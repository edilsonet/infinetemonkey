text: '1.6 CANCELAMENTO

  2

  2 DEFINIÇÕES

  2.1 PUBLICAÇÕES EXTERNAS

  São documentos normativos ou informativos direcionados a todos os integrantes do

  Sistema de Aviação Civil, elos do Sistema de Segurança de Vôo (SEGVÔO), e às pessoas

  físicas ou jurídicas, nacionais ou estrangeiras, no trato de assuntos relacionados com o
  DAC.

  2.2 PUBLICAÇÕES INTERNAS

  São documentos normativos ou informativos direcionados ao público interno,

  constituído de integrantes do COMAER, DAC, IAC, SERAC e/ou CTA/IFI.

  2.3 PUBLICAÇÕES NORMATIVAS

  São normas de caráter compulsório, de teor técnico ou administrativo, que

  estabelecem uma padronização de procedimentos relativa às atividades da aviação civil.

  2.4 PUBLICAÇÕES INFORMATIVAS

  São publicações, de caráter meramente informativo, que instruem ou divulgam

  assuntos de ordem técnica ou organizacional.

  2.5 PUBLICAÇÕES DE PLANEJAMENTO

  São publicações que tratam de aspectos relativos ao planejamento do

  desenvolvimento da aviação civil .

  2.6 CLASSIFICAÇÃO OSTENSIVA

  É a classificação das publicações cuja divulgação destina-se aos integrantes dos elos

  do Sistema de Aviação Civil ou a quem interessar de acordo com a abrangência do assunto.

  2.7 CLASSIFICAÇÃO SIGILOSA

  É a classificação das publicações que devem ser de conhecimento restrito,

  atendendo ao previsto no Decreto No 2.910, de 29/12/98, publicado no DOU No 250, de

  30/12/98, conjuntamente com o disposto no Cap. III do Decreto 2.134, de 24/01/97, publicado

  no DOU No 018, de 27/01/97.

  2.8 FORNECIMENTO

  Distribuição gratuita.

  2.9 VENDA

  Distribuição mediante pagamento de emolumento.

  3 TIPOS DE PUBLICAÇÕES DO DAC2005 IAC 001-1001A

  3

  3.1 EXTERNAS

  As publicações externas são de natureza normativa, informativa e de planejamento,

  para os quais estão previstos os seguintes tipos:

  NORMATIVAS SIGLAS

  Programa Nacional de Aviação Civil -

  Regulamento Brasileiro de Homologação Aeronáutica RBHA

  Instrução de Aviação Civil IAC

  Norma de Serviço Aéreo Internacional NOSAI

  INFORMATIVAS SIGLAS

  Informativo de Aviação Civil INFAC

  Horário de Transporte Aéreo HOTRAN

  Anuário do Transporte Aéreo -

  Manual -

  PLANEJAMENTO SIGLA

  Plano da Aviação Civil -'
