text: '11.1.8 REFERÊNCIAS BIBLIOGRÁFICAS

  Citação das fontes bibliográficas utilizadas pelo autor, quando necessária,

  localizando-se no final do texto da publicação, com o objetivo de fornecer um embasamento

  técnico literário à publicação. Será apresentada de acordo com as prescrições da NBR 6023
  da

  ABNT - Referências Bibliográficas - Procedimento.2005 IAC 001-1001A

  15'
