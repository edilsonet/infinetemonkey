text: '11.1.9.1 Se existirem anexos, estes deverão estar no final do texto e serão paginados
  pela

  numeração formada pela letra A, seguida de número arábico seqüencial que identificará o

  anexo.

  Exemplo: A-1 (Anexo um), A-2 (Anexo dois).'
