text: '11.1.9.2 Caso o anexo tenha continuidade na(s) página(s) seguinte(s), a identificação
  será

  acrescida de um hífen seguido de número(s) arábico(s) correspondente(s).

  Exemplo: A-4-1, A-4-2, A-4-3, A-5...

  11.2 INFAC

  A composição do texto será igual aos da IAC, excetuando-se o item 11.1 alínea “a)”

  e o item 11.1.1, que não estão previstos para o INFAC.

  12 FORMATAÇÃO DO TEXTO2005 IAC 001-1001A

  16

  12.1 IAC e INFAC'
