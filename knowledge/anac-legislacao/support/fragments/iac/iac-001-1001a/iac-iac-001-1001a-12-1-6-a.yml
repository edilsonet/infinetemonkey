title: 12.1.6(a)
text: 'a) o indicativo numérico da divisão e subdivisões do texto será em algarismos

  arábicos, recebendo o título ou a primeira palavra do texto, separado por espaços,

  conforme exemplo da página seguinte. Todo o indicativo numérico começará sob

  o primeiro algarismo do indicativo numérico anterior;'
