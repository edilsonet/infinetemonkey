cite: 12.1.7(d)
title: 12.1.7(d)
text: 'd) as páginas que forem acrescentadas, em virtude de modificações, serão numeradas

  pelo sistema decimal. Ex.: se, no texto da página 3, ocorrerem alterações que

  exijam cinco páginas, a numeração será 3, 3-1, 3-2, 3-3, 3-4, 3-5, etc.'
