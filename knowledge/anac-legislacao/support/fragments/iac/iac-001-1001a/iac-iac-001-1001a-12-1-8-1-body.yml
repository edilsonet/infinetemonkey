cite: 12.1.8.1
title: Será constituído do ano de efetivação e do símbolo da publicação, que aparecerão
text: '12.1.8.1 Será constituído do ano de efetivação e do símbolo da publicação, que aparecerão

  nas páginas internas em negrito, devendo ser impresso do lado esquerdo e direito

  respectivamente, na parte superior e fora da área útil.'
