title: Nos casos em que a autoridade que aprovou a IAC julgar que o processo sistemático
text: '13.1.3 Nos casos em que a autoridade que aprovou a IAC julgar que o processo sistemático

  de atualização de determinada IAC deva dispensar a emissão de Portaria, deverá ser incluído

  um item nas disposições finais, do texto da referida IAC, definindo claramente esta

  determinação.'
