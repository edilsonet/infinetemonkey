text: '13.2.3 A(s) página(s) de rosto, será(ão) posicionada(s) ao final da publicação.

  13.3 LISTA DE PÁGINAS EFETIVAS

  A Lista de Páginas Efetivas (Anexo 11), onde constarão todas as páginas em vigor

  com as respectivas edições, caso sejam originais e/ou emendas deverá ser posicionada após
  a

  página de “Controle de Emendas”.

  13.4 PÁGINAS DE ALTERAÇÕES

  As demais páginas trocadas e/ou acrescentadas, em virtude das correções, ostentarão

  do lado esquerdo do Cabeçalho Corrente o número correspondente à emenda, seguido do

  respectivo ano de publicação.

  Exemplo:

  13.5 ALERTAS DE EMENDA'
