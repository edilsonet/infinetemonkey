title: As correções processadas deverão ser digitadas em negrito e ficar entre colchetes.
text: '13.5.1 As correções processadas deverão ser digitadas em negrito e ficar entre colchetes.

  Ao fim da seção envolvida, o número da emenda e o ano de publicação, conforme exemplo

  acima, deverão constar entre parênteses. Para se eliminar capítulos e itens, basta citá-los,

  acrescentando, a seguir, a expressão “SUPRIMIDO”.'
