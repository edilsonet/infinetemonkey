  o negrito e voltará à grafia normal e o parágrafo suprimido será efetivamente excluído.

  13.6 CONTROLE DE EMENDAS

  Logo após a página de “Siglas e Abreviaturas”, deverá constar a página de “Controle

  de Emendas” (Anexo 9), a ser preenchida pelo detentor da publicação, a cada atualização

  ocorrida. Esta folha somente será preenchida pelo órgão elaborador quando a emenda for

  efetivamente efetuada por tal órgão.

  13.7 REEDIÇÃO

  É a nova edição de uma determinada publicação, que deverá ser emitida, em

  princípio, a cada quatro anos. A reedição inclui as emendas introduzidas na edição anterior,

  zerando a respectiva contagem.

  13.8 REIMPRESSÃO

  A reimpressão é uma nova tiragem da edição em vigor. Não permite quaisquer

  alterações. São mantidas as características da publicação anterior quanto à data, numeração,

  teor, formato e distribuição.

  13.9 REVOGAÇÃO

  E1- AAAA2005 IAC 001-1001A

  21

  É o cancelamento e a conseqüente perda de vigência de uma publicação, quando de

  sua reedição ou edição de outra publicação que a substitua.

  13.10 ERRATA

  Lista de erros de natureza tipográfica ou afim, com as devidas correções, indicando-

  se as páginas ou linha em que aparecem. Confeccionada quase sempre em papel avulso,

  acrescida à publicação depois de impressa e distribuída (Anexo 12).2005 IAC 001-1001A

  22

  14 DISPOSIÇÕES FINAIS

  14.1 Os órgãos responsáveis pela elaboração de publicações deverão ter o máximo

  empenho no sentido de adequar os assuntos e objetivos da publicação aos tipos previstos
  nesta

  norma, evitando, sempre que possível, a regulamentação de procedimentos por meio de

  Portarias, as quais deverão, preferencialmente, ser emitidas somente para a aprovação de

  documento normativo.

  14.2 As publicações do DAC e das organizações subordinadas deverão ser elaboradas de

  acordo com estas prescrições ou com as indicações referenciadas nesta Instrução, conforme

  respectivas especificações.

  14.3 Além dos tipos de publicações previstos nesta norma, poderão ser adotados,

  conforme sejam aplicáveis, as publicações convencionais definidas na ICA 5-1 - Confecção,

  Controle e Numeração de Publicações.

  14.4 Antes da elaboração ou atualização de qualquer publicação, o órgão interessado

  deverá proceder à compatibilização da formatação e da numeração, junto à Seção de

  Publicações, com o objetivo de evitar a despadronização e a duplicidade de publicações sobre

  o mesmo assunto.

  14.5 Todos os setores que sejam responsáveis pela emissão das IAC ora existentes, fora

  dos padrões estabelecidos nesta Norma, deverão reeditá-las gradualmente, a começar pelas

  mais antigas.

  14.6 Os interessados na aquisição de qualquer publicação constante do item 8.1 deverão

  se dirigir, pessoalmente ou por via postal, à Seção de Publicações do DAC e, nas demais

  publicações, aos respectivos Órgãos elaboradores, ou ainda acessar o Portal do DAC na

  Internet no endereço eletrônico www.dac.gov.br.

  14.7 Esta IAC entrará em vigor na data de publicação no Diário Oficial da União da

  Portaria Nº 546/DGAC, de 16 de junho de 2005 que aprova esta Instrução.2005 IAC 001-1001A

