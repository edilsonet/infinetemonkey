title: É a publicação que tem por objetivo divulgar, de forma segmentada, regras e
text: '3.1.1.1 É a publicação que tem por objetivo divulgar, de forma segmentada, regras e

  procedimentos, de caráter normativo, para promover o desenvolvimento e a implementação

  das diversas áreas da aviação civil em consonância com os Anexos à Convenção da Aviação

  Civil Internacional, visando ainda, facilitar, de maneira inequívoca, a aplicação de leis,

  decretos, portarias e regulamentos.'
