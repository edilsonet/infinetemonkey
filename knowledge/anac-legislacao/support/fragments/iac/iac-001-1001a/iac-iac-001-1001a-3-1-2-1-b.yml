text: 'b) estabelecer padrões administrativos e de homologação de empresas relativos a:

  (1) projetos, materiais, mão de obra, construção e desempenho de aeronaves,

  motores, hélices e demais componentes aeronáuticos; e

  (2) inspeções, manutenção em todos os níveis reparos e operação de aeronaves,

  motores, hélices e demais componentes.2005 IAC 001-1001A

