section_title: O plano seguirá as prescrições estabelecidas pelo Instituto de Aviação Civil.
subsection_id: a
cite: 3.1.9.2(a)
title: 3.1.9.2(a)
text: 'a) o setor responsável pela elaboração ou alteração de qualquer IAC deverá preparar

  Portaria, a qual será emitida pela respectiva autoridade competente, fazendo

  referência expressa à autorização do Diretor-Geral do Departamento de Aviação

  Civil ou ao ato de delegação de competência, bem como ao título, ao número, aos

  anexos, para publicação no Diário Oficial da União, de acordo com as normas de

  formatação da Imprensa Nacional;'
