text: 'b) o encaminhamento da Portaria de aprovação para assinatura deverá ser feito junto

  com o original da IAC, com as respectivas páginas rubricadas pelo chefe do setor

  elaborador ou pela autoridade competente, conforme a conveniência

  administrativa.'
