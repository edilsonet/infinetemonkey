text: 'f) o ato de aprovação da IAC será publicado no Diário Oficial da União e em

  Boletim do DAC.

  5.2 INFAC

  O chefe do setor responsável pela elaboração ou alteração do INFAC deverá

  preparar e emitir o original, que terá a assinatura do referido chefe e da respectiva autoridade

  competente pela aprovação, no final do texto, o qual deverá ser encaminhado para publicação

  em Boletim do DAC.

  6 EFETIVAÇÃO

  6.1 IAC2005 IAC 001-1001A

  8

  A data de efetivação, ou seja, a entrada em vigor da IAC, corresponderá à data de

  publicação da Portaria no Diário Oficial da União ou outra data previamente definida e

  explicitada na Portaria de aprovação pela autoridade competente.

  6.2 INFAC

  A data de vigência do INFAC será a data de publicação em Boletim do DAC ou

  alguma outra data previamente definida na publicação.

  7 PROCEDIMENTOS ADMINISTRATIVOS

  Os setores deverão providenciar a confecção dos originais dos RBHA e IAC, sua

  aprovação e remessa imediata à Seção de Publicações, logo após a publicação da portaria
  de

  aprovação. O INFAC deverá ser encaminhado à Seção de Publicações logo após a assinatura

  da autoridade competente.2005 IAC 001-1001A

  9

