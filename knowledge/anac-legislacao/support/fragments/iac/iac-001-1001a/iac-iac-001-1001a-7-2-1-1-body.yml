title: Nos casos em que a autoridade competente julgar que o teor da publicação, que
text: '7.2.1.1 Nos casos em que a autoridade competente julgar que o teor da publicação, que

  embora ostensiva, não deva ser divulgada na Internet, deverá suprimir a indicação

  “INTERNET” do item Disponibilização do Capítulo 1 - Disposições Preliminares.'
