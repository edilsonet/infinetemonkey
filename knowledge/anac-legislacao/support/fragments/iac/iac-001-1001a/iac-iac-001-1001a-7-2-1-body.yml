title: ELETRÔNICA
text: '7.2.1 ELETRÔNICA

  As publicações citadas no item 7 deverão ser impreterível e primeiramente

  encaminhadas à Seção de Publicações para divulgação na Internet, observando-se os padrões

  de formatação vigentes para o Portal do DAC, inclusive a prescrição do item 10.2.'
