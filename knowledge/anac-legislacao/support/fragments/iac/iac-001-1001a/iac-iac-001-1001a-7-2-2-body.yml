title: SUPERVISÃO
text: '7.2.2 SUPERVISÃO

  A supervisão do conteúdo das publicações disponibilizadas na Internet é atribuição

  do setor elaborador, que deverá comunicar à Seção de Publicações toda e qualquer

  discrepância observada, e providenciar a respectiva correção.'
