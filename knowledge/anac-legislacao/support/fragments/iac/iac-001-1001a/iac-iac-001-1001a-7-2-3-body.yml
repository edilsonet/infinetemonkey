title: CATÁLOGO DE PUBLICAÇÕES
text: '7.2.3 CATÁLOGO DE PUBLICAÇÕES

  As publicações externas, disponibilizadas para venda ou assinatura, deverão ser

  referenciadas no Catálogo de Publicações do DAC.

  7.3 HISTÓRICO DAS PUBLICAÇÕES

  Todos os originais das publicações emitidas serão mantidos arquivados na Seção de

  Publicações, a fim de se constituir um acervo histórico de normas e regulamentos.

  7.4 IMPRESSÃO GRÁFICA

  A Seção de Publicações providenciará e acompanhará o processo de reprodução

  gráfica, de acordo com o previsto nesta Norma.

  8 DISPONIBILIZAÇÃO

  8.1 Compete à Seção de Publicações a divulgação, a edição, o fornecimento e a venda

  dos RBHA, IAC e INFAC.

  8.2 As demais publicações citadas nesta IAC serão disponibilizadas pelos respectivos

  setores.2005 IAC 001-1001A

  10

  8.3 A disponibilização dar-se-á de acordo com o critério estabelecido pelo órgão

  elaborador, através da indicação dos seguintes grupos de acesso para venda ou fornecimento,

  e também, a indicação de divulgação eletrônica na Internet.'
