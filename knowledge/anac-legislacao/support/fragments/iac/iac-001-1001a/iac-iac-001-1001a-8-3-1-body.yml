title: GRUPO DE ÓRGÃOS PÚBLICOS
text: '8.3.1 GRUPO DE ÓRGÃOS PÚBLICOS

  A - Administração estadual/municipal de aeroportos conveniados com o DAC.

  C - Comandos Aéreos Regionais (COMAR).

  CM- Centro de Medicina Aeroespacial.

  D - Órgãos internos do DAC.

  GV- Governos dos Estados, Territórios e Distrito Federal.

  IA - Instituto de Aviação Civil.

  IF - Instituto de Fomento e Coordenação Industrial (CTA/IFI).

  IN - Empresa Brasileira de Infra-Estrutura Aeroportuária (INFRAERO).

  PM- Prefeituras Municipais.

  SA- Seções de Aviação Civil (SAC).

  SR- Serviços Regionais de Aviação Civil (SERAC)

  TP - Todos os Órgão Publicos.'
