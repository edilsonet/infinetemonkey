title: DIVULGAÇÃO ELETRÔNICA
text: '8.3.3 DIVULGAÇÃO ELETRÔNICA

  INTERNET-Rede Mundial de Computadores/Portal do DAC

  8.4 A indicação de fornecimento para os órgãos públicos deverá ser estabelecida, de

  forma bastante criteriosa, pelo setor elaborador, para que os recursos e procedimentos

  cabíveis sejam convenientemente otimizados, tratando-se da categoria A, C, GV e PM, deverá

  ser encaminhada junto com a Parte prevista no item 7.1, uma listagem contendo: o endereço

  completo e a indicação do setor do destinatário.

  8.5 O envio para o SR, SA e IA é regular para todas as publicações.

  8.6 Será facultada a aquisição de publicações às empresas privadas, instituições diversas
  e

  pessoas físicas, segundo preço estipulado para cada publicação, independentemente da categoria,
  cuja

  especificação acima tem por objetivo principal auxiliar na previsão de demanda da publicação.

  9 NUMERAÇÃO

  9.1 IAC e INFAC'
