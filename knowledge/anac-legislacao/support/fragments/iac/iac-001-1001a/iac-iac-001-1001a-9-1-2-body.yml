title: Serão numeradas de acordo com os seus respectivos assuntos, composta da sigla
text: '9.1.2 Serão numeradas de acordo com os seus respectivos assuntos, composta da sigla

  designativa da publicação, de um numeral de sete algarismos, e, a partir da respectiva segunda

  edição, uma letra do alfabeto.'
