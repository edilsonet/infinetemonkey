title: Os três primeiros algarismos desse numeral serão indicativos do assunto, de acordo
text: '9.1.3 Os três primeiros algarismos desse numeral serão indicativos do assunto, de acordo

  com a Tabela de Numeração de Assuntos da Aviação Civil (Anexo 4) que foi baseada na

  numeração dos regulamentos, intitulados Federal Aviation Regulation, da Federal Aviation

  Administration (FAA), autoridade aeronáutica dos Estados Unidos.'
