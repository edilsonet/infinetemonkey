title: A letra será um indicativo de cada nova edição da publicação.
text: '9.1.6 A letra será um indicativo de cada nova edição da publicação.

  Exemplos:

  A publicação que vier a substituir outra de mesmo título continuará com o número da

  anterior, porém com data atualizada, mencionando a que foi substituída e que deverá ser

  considerada sem efeito.'
