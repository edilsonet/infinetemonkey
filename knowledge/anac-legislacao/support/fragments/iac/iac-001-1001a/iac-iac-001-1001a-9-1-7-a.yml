title: 9.1.7(a)
text: 'a) impressão:

  -frente e verso a partir da página 1 do capítulo 1; e

  -a publicação sigilosa deverá ser impressa com a respectiva classificação,

  grafada na cor vermelha, no alto e no rodapé, de cada página, incluindo a

  capa;'
