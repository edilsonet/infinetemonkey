title: A publicação de caráter sigiloso deverá ter a numeração acrescida da abreviatura
text: '9.1.7 A publicação de caráter sigiloso deverá ter a numeração acrescida da abreviatura

  correspondente ao respectivo grau de sigilo.

  Exemplo:

  10 FORMATAÇÃO DA IAC E INFAC

  10.1 DIGITAÇÃO

  As publicações serão digitadas com as seguintes especificações:2005 IAC 001-1001A

  12'
