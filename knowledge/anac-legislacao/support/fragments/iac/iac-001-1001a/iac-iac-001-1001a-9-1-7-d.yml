text: 'd) configuração das margens:

  -margem superior: 3,0 cm

  -margem inferior: 2,5 cm

  -margem interna ou esquerda: 3,0 cm

  -margem externa ou direita: 2,0 cm

  -a partir da margem - cabeçalho: 1,5 cm

  -a partir da margem - rodapé: 1,5 cm'
