text: 'e) espaçamento:

  - entre o cabeçalho e o primeiro item ou linha do parágrafo: um espaço

  duplo em branco;

  -entre linhas do texto do parágrafo: espaçamento simples;

  -entre capítulos: cada capítulo iniciar-se-á numa nova página , porém, quando

  se tratar de publicação com poucas páginas, poderá ser adotado um padrão

  com três espaços simples em branco entre os capítulos;

  - entre o título do item e o respectivo texto: um espaço simples em branco;

  - entre alíneas constituídas de uma linha: sem espaço; e

  - entre alíneas constituídas de mais de uma linha: um espaço simples em

  branco.

  10.2 ARQUIVO ELETRÔNICO

  As publicações em formato eletrônico deverão ser disponibilizadas em arquivo

  único, desde a capa até a última página do documento.

  10.3 IMPRESSÃO EM PAPEL

  As publicações apresentar-se-ão no formato de folhetos, da seguinte forma:'
