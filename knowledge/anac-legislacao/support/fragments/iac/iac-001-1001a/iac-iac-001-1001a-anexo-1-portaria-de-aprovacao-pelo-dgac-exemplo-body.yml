text: 'ANEXO 1 - PORTARIA DE APROVAÇÃO PELO DGAC - EXEMPLO

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC No XXX/DGAC, de XX de XXXXXX de XXXX.

  Aprova a Instrução de Aviação Civil que dispõe sobre .........

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, com base no

  Decreto No 000, de ..., que ... e tendo em vista o disposto na Portaria No 000/GC-5, de
  DD de

  MMMMM, de AAAA, resolve:

  Art. 1o Seja efetivada a IAC abaixo discriminada:

  Título: ............................

  Art. 2o Esta Portaria entra em vigor, 00 dias após a data de sua publicação no......

  Art. 3o Revogam-se a IAC 000-000 de DDMMAAAA e a respectiva Portaria No

  XX/DGAC, de DD de MMMMMM de AAAA, publicada no ................, de DD de

  MMMMMMM de AAAA.

  Maj. Brig.-do-Ar NOME

  Diretor-Geral2005 IAC 001-1001A

  A-1-1

  PORTARIA DE ELABORAÇÃO - INSTRUÇÃO

  PADRÕES TÉCNICOS DE ELABORAÇÃO DE PORTARIAS EM TAMANHO ORIGINAL

  - As matérias deverão ser geradas em editor de texto Microsoft Word.

  INFORMAÇÕES GERAIS:

  - Configuração do papel: A-4;

  - Tipo de Letra: “Times New Roman”;

  - Tamanho: 12; e

  - Recuo de margens: usar a régua, nunca a barra de espaço.

  CABEÇALHO:

  - Em caixa alta;

  - Iniciar a digitação da Portaria já com o número correspondente;

  - Não deixar espaço antes e depois da barra que separa o número do órgão responsável; e

  - Entre o cabeçalho e a ementa, deixar somente uma linha em branco.

  EMENTA:

  - Extensão: 16 cm a partir da margem direita; e

  - Entre a ementa e o texto da Portaria, deixar somente uma linha em branco.

  TEXTO:

  - Extensão: 18 cm da margem esquerda à direita;

  - Parágrafos: recuo de margem de 1 cm, usando a marcação de régua do Word;

  - Evitar excessos de recuo de margens, destaques do texto, caixa alta, sublinhados e negritos;

  e

  - Não usar dois espaços entre palavras para compensar margens tortas.

  ASSINATURA:

  - O nome do signatário da Portaria deverá estar a 2 cm do final do texto, colocada sempre
  à

  margem direita.2005 IAC 001-1001A

  A-2'
