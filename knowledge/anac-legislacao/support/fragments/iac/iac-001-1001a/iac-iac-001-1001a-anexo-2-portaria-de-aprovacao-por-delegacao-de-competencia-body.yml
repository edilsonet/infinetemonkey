text: 'ANEXO 2 - PORTARIA DE APROVAÇÃO POR DELEGAÇÃO DE COMPETÊNCIA -

  EXEMPLO

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC No 000/S..., DD de MMMMMM de AAAA

  Aprova a Instrução de Aviação Civil que dispõe ...

  O CHEFE DO SUBDEPARTAMENTO ...........................do DAC, tendo em vista a

  delegação de competência estabelecida no item 0 da Portaria DAC No 000/DGAC, de DD de

  MMMMM de AAAA, publicada no Boletim No 000, de DD de MMMMMMM de AAAA, do

  DAC, e com base nos artigos 2º e 3º do Decreto No 0000, de DD de MMMMMMM de AAAA,

  resolve:

  Art. 1o Seja efetivada a IAC abaixo discriminada:

  IAC ..........

  Título: ........................................................

  Art. 2o Esta Portaria entra em vigor 30 (trinta) dias após a sua publicação e cancela a

  Portaria 000, de DD MMM AAAA

  Brig.-do-Ar ..........

  Chefe do Subdepartamento de

  ........2005 IAC 001-1001A

  A-2-1

  PORTARIA - INSTRUÇÃO DE ELABORAÇÃO

  VIDE ANEXO 12005 IAC 001-1001A

  A-3'
