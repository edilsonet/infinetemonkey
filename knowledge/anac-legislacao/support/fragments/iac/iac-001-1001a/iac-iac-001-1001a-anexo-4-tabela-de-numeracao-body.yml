text: 'ANEXO 4 - TABELA DE NUMERAÇÃO

  TABELA DE NUMERAÇÃO DE ASSUNTOS DA AVIAÇÃO

  CIVIL

  NUMERAÇÃO ASSUNTOS GERAIS

  001 a 019 PROCEDIMENTOS - REGRAS GERAIS

  020 a 059 AERONAVES

