text: 'INTRODUÇÃO

  As publicações do DAC têm por finalidade instruir e informar ao público em geral e/ou aos

  integrantes do Sistema de Aviação Civil sobre normas e assuntos relacionados às atividades
  da

  aviação civil.2005 IAC 001-1001A

