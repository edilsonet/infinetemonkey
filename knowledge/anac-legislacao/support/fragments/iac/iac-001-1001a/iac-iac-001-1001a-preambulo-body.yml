text: 'REPÚBLICA FEDERATIVA DO BRASIL

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  DIREÇÃO GERAL DE AVIAÇÃO CIVIL

  DIVISÃO DE DOCUMENTAÇÃO

  INSTRUÇÃO DE AVIAÇÃO CIVIL

  ELABORAÇÃO E CONTROLE DE

  PUBLICAÇÕES DO DAC

  20052005 IAC 001-1001A

  I

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC No 546/DGAC, DE 16 DE JUNHO DE 2005.

  Aprova a Instrução de Aviação Civil - IAC que trata da elaboração e controle de

  publicações do DAC.

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, com base no Decreto

  No 65.144, de 12 de setembro de 1969, que institui o Sistema de Aviação Civil do Ministério
  da

  Aeronáutica, e tendo em vista o disposto na Portaria No 453/GM-5, de 2 de agosto de 1991,
  que

  reformula o Sistema de Segurança de Vôo da Aviação Civil, resolve:

  Art.1o Seja efetivada a IAC abaixo discriminada:

  Título: Elaboração e controle de publicações do DAC.

  Art.2o Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Art.3o Revogam-se a IAC 001-1001, de 24 de novembro de 2003 e respectiva Portaria nº

  1.536/DGAC, de 21 de novembro de 2003, publicada no DOU nº 228, de 24 de novembro de 2003.

  Maj. Brig.-do-Ar JORGE GODINHO BARRETO NERY

  Diretor-Geral

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO, N° 116, S/1, P.28, DE 20 DE JUNH0 DE 2005.2005 IAC
  001-1001A

  II'
