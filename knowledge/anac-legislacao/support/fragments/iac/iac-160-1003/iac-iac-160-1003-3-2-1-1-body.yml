title: 'Estão isentas dessas tarifas, as aeronaves dos seguintes Estados:'
text: '3.2.1.1 Estão isentas dessas tarifas, as aeronaves dos seguintes Estados:

  África do Sul, Argentina, Austrália, Canadá, Chile, Cingapura, Costa do

  Marfim, Espanha, Gabão, Grã-Bretanha, Guiana, Iraque, Israel, Itália, Jordânia,

  Líbano, México, Noruega, Panamá, Paraguai, Polônia, Portugal, República da

  Coréia, República Dominicana, Romênia, Senegal, Suécia, Uruguai e

  Venezuela.'
