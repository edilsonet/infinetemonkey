title: 'Estão isentas dessas tarifas, com restrições, os seguintes Estados:'
text: '3.2.1.2 Estão isentas dessas tarifas, com restrições, os seguintes Estados:

  Bélgica, Japão e Turquia - em visitas

  oficiais; Cabo Verde - aeronaves

  presidenciais; Dinamarca - somente Tarifa

  de Pouso; e

  República da Coréia - somente a Tarifa de Permanência por 6 horas.'
