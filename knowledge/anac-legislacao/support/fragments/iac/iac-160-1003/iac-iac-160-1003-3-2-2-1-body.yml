title: 'Estão isentas dessas tarifas as aeronaves dos seguintes Estados:'
text: '3.2.2.1 Estão isentas dessas tarifas as aeronaves dos seguintes Estados:

  África do Sul, Argentina, Austrália, Bolívia, Canadá, Chile, Colômbia, Costa

  do Marfim, Dinamarca, Equador, Filipinas, Honduras, Iraque, Israel,

  Jordânia, Líbano, México, Noruega, Panamá, Paraguai, Peru, Portugal,

  República da Coréia, República Dominicana, República Federal da

  Alemanha, Rússia, São Salvador, Senegal, Suécia, Trinidad e Tobago,

  Uruguai e Venezuela.'
