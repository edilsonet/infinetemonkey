title: 'Reciprocidade de tratamento utilizando aeródromos de Bases Aéreas:'
text: '3.2.2.3 Reciprocidade de tratamento utilizando aeródromos de Bases Aéreas:

  Estados Unidos da América2005 IAC 160-1003

  5

  4 DISPOSIÇÕES FINAIS

  A Emenda que venha a ser determinada a esta IAC, será aprovada pela autoridade competente,

  sem a necessidade de emissão de Portaria, conforme os subitens 13.1.3 e 13.1.4, da IAC 001-

  1001A, de 16 de junho de 2005.2005 IAC 160-1003

  6

  REFERÊNCIAS BIBLIOGRÁFICAS

  1. BRASIL. Decreto nº 65.144, de 12 de setembro de 1969. Institui o Sistema de Aviação Civil
  do

  Ministério da Aeronáutica e dá outras providências.

  2. BRASIL. Decreto nº 86.864, de 21 de janeiro de 1982. Regulamenta o Decreto-lei nº 1.896,
  de

  17 de dezembro de 1981.'
