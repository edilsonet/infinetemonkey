title: INTRODUÇÃO
text: 'INTRODUÇÃO

  A presente IAC tem por finalidade divulgar aos órgãos interessados, a relação dos

  Estados que mantêm reciprocidade de tratamento com o Brasil, em relação à isenção das Tarifas
  da

  Infra-estrutura Aeronáutica (Tarifas Aeroportuárias e das de Uso das Comunicações e dos
  Auxílios à

  Navegação Aérea em Rota).2005 IAC 160-1003

