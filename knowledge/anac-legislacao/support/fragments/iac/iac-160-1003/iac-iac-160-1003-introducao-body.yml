  1

  1 DISPOSIÇÕES PRELIMINARES

  1.1 FINALIDADE

  Divulgar as condições gerais e a relação dos Estados que mantém isenção das Tarifas da

  Infra-estrutura Aeronáutica de passageiros e de aeronaves públicas ou militares estrangeiras,
  em

  reciprocidade de tratamento com o Brasil.

  1.2 FUNDAMENTO

  Decreto nº 65.144, de 12 de setembro de 1969, que institui o Sistema de Aviação Civil do

  Ministério da Aeronáutica; Decreto nº 86.864, de 21 de janeiro de 1982, que regulamenta
  o Decreto-

  lei nº 1896; Decreto nº 89.121, de 6 de dezembro de 1983, que regula a Lei nº 6009, de 26
  de

  dezembro de 1973; Portaria nº 602/GC5, de 22 de setembro de 2000, que estabelece os

  procedimentos para a aplicação e para a cobrança das Tarifas Aeroportuárias de Embarque,

  doméstica e internacional, pelas empresas de transporte aéreo; os artigos 18, 19 e 20, da
  Instrução

  sobre a cobrança das Tarifas Aeroportuárias de Embarque, de Pouso e de Permanência, aprovada

  pela Portaria Nº 306/GC5, de 25 de março de 2003; e o artigo 13, da Instrução sobre a cobrança
  das

  Tarifas de Uso das Comunicações e dos Auxílios à Navegação Aérea em Rota, aprovada pela

  Portaria Nº 376/GC5, de 11 de abril de 2003.

  1.3 APROVAÇÃO

  Aprovada pela Portaria nº 1305/DGAC, de 19 de dezembro de 2005.

  1.4 DISPONIBILIZAÇÃO

  A - C - D - EE - EN - IN - SR - X - INTERNET - IAC - DECEA - MRE.

  1.5 CANCELAMENTO

  2

  2 DEFINIÇÕES

  2.1 RECIPROCIDADE DE TRATAMENTO

  Isenção do pagamento dos preços relativos às Tarifas Aeroportuárias e das do Uso das

  Comunicações e dos Auxílios à Navegação Aérea em Rota, concedidas para os Estados que

  dispensem igual tratamento aos passageiros e às aeronaves públicas civis ou militares brasileiras.

  2.2 REPRESENTANTE DIPLOMÁTICO

  Membro de Estado estrangeiro no exercício da missão de Diplomata ou de Adido.

  2.3 FUNCIONÁRIO CONSULAR

  Representante de Estado estrangeiro no exercício da função de Cônsul-Geral, Cônsul, Vice-

  Cônsul e de Adjunto.

  2.4 FUNCIONÁRIO ESTRANGEIRO PORTADOR DE PASSAPORTE DE SERVIÇO

  Representante de Estado portador de Passaporte de Serviço, quando em viagem oficial.

  2.5 FUNCIONÁRIO DE EMPRESA DE TRANSPORTE AÉREO INTERNACIONAL

  Funcionário de empresa de transporte aéreo de Estado que concede reciprocidade de

  tratamento aos funcionários das empresas de transporte aéreo nacionais.2005 IAC 160-1003

  2

  3 ISENÇÕES

  3.1 DA TARIFA DE EMBARQUE

  (Revogado pela Resolução nº 432, de 19.06.2017)

