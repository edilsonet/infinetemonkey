text: '2005 IAC 160-1003

  I

  REPÚBLICA FEDERATIVA DO BRASIL

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  SUBDEPARTAMENTO DE INFRA-ESTRUTURA

  DIVISÃO DE TARIFAS DA INFRA-ESTRUTURA

  AEROPORTUÁRIA

  INSTRUÇÃO DE AVIAÇÃO CIVIL

  RECIPROCIDADE DE TRATAMENTO EM RELAÇÃO

  À ISENÇÃO DAS TARIFAS DA INFRA-ESTRUTURA

  AERONÁUTICA

  20052005 IAC 160-1003

  I

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC Nº 1305/DGAC, DE 19 DE DEZEMBRO DE 2005.

  Aprova a Instrução de Aviação Civil - IAC que trata da reciprocidade de tratamento em relação
  à

  isenção das Tarifas da Infra-estrutura Aeronáutica.

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, com base no Decreto

  No 65.144, de 12 de setembro de 1969, nas Portarias Nº 306/GC5, de 25 de março de 2003 e
  Nº 376/GC5, de

  11 de abril de 2003,

  RESOLVE:

  Art. 1º Seja efetivada a IAC abaixo discriminada:

  Título: Reciprocidade de tratamento em relação à isenção das Tarifas da Infra-estrutura

  Aeronáutica.

  Art. 2º Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Art. 3º Revogam-se a IAC 5102-0899, de 30 de agosto de 1999 e respectiva Portaria nº 572/DGAC,

  de 30 de agosto de 1999, publicada no DOU nº 188, de 30 de setembro de 1999.

  Maj Brig Ar JORGE GODINHO BARRETO NERY

  Diretor-Geral

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO, Nº 244, S/1, P. 43, DE 21 DE DEZEMBRO DE

  2005.2005 IAC 160-1003

  II'
