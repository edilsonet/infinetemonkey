text: '3.3.2 QUANTO À PINTURA E IDENTIFICAÇÃO DE PROPRIEDADE DO BEM

  A entidade cessionária se obriga a cumprir a Instrução de Aviação Civil (IAC 180-1003)

  referente à "Identificação de propriedade de material aeronáutico do DAC".

  3.4 PRAZO DE CESSÃO DE USO

  A vigência da cessão é por um prazo indeterminado, podendo ser interrompida nos seguin-

  tes casos:'
