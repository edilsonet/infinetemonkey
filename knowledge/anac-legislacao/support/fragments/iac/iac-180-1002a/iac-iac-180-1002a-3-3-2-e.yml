title: 3.3.2(e)
text: 'e) decisão do DAC de alienar o bem.

  NOTAS: 1) No caso da decisão de redistribuição do bem a entidade cessionária deve ser comunicada,

  pelo SERAC da área, com antecedência mínima de 1 (um) mês e, no caso de decisão de alienação,
  no

  prazo de 6 (seis) meses.

  2) No caso de substituição da diretoria da entidade cessionária, o SERAC da área deve realizar

  uma reavaliação da vigência da Cessão de Uso.

  3.5 DOCUMENTAÇÃO NECESSÁRIA PARA O ATO DE ENTREGA'
