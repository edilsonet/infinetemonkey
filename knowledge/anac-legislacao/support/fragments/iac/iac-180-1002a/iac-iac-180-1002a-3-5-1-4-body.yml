text: '3.5.1.4 Outros documentos

  No caso de aeronave(s), providenciar o preenchimento e a assinatura do Requerimento

  Padronizado do Registro Aeronáutico Brasileiro (RAB), solicitando a averbação do “Direito
  de Uso”

  junto àquele Registro Público.'
