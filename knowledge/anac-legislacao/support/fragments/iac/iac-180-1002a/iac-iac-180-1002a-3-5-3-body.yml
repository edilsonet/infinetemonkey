text: '3.5.3 A SER PROVIDENCIADA PELO SERAC

  No caso de redistribuição de aeronaves, o SERAC deve providenciar a emissão de um Cer-

  tificado Provisório de Registro e Aeronavegabilidade (CPRA) em nome do novo operador, com
  vali-

  dade de 60 (sessenta) dias a contar da data da redistribuição, publicada em Boletim Externo
  do CO-

  MAER. Este documento deve ser entregue na data da formalização da Cessão de Uso.'
