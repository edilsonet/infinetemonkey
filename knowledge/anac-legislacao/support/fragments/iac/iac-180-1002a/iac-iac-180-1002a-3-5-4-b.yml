title: 3.5.4(b)
text: 'b) o ato de cessão de uso do bem deve ser celebrado com a presença física e simultânea
  de

  representante da Autoridade Aeronáutica, do Presidente da Entidade Cessionária e em caso
  de redistri-

  buição, do Presidente da Entidade Restituidora. No caso do bem estar sendo transferido da
  área de um

  SERAC para outro, a coordenação do ato de cessão deve ser feita entre os referidos Órgãos;'
