title: ENVIO E CONTROLE DA DOCUMENTAÇÃO
text: '3.5.4 ENVIO E CONTROLE DA DOCUMENTAÇÃO

  Todos os documentos destinados aos Órgãos subordinados ao DAC devem ser encaminha-

  dos através do SERAC da respectiva área.

  Nos casos em que a entidade cessionária estiver sob a jurisdição de um SERAC diferente

  do SERAC da área da entidade restituidora, este último deve enviar àquele a pasta de arquivo
  do histó-

  rico do bem em questão (todo o controle existente), no prazo de 30 (trinta) dias, contados
  a partir da

  data em que o Termo de Exame e Recebimento for lavrado.

  Observação: O resumo da documentação envolvida está no Anexo nº 5 desta IAC.2005 IAC 180-1002A

  8

  4 ATO DE ENTREGA DO BEM

  4.1 FORMALIZAÇÃO DA CESSÃO DE USO'
