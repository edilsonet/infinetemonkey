  5 SUBSTITUIÇÃO DA DIRETORIA DA ENTIDADE CESSIONÁRIA

  5.1 DEVERES DAS DIRETORIAS SUBSTITUÍDA E EMPOSSADA

  Por ocasião da mudança de diretoria da Entidade Cessionária, durante a vigência da Cessão

  de Uso do equipamento aeronáutico de propriedade do DAC, a diretoria em exercício deve dar
  ciência

  prévia aos futuros diretores das responsabilidades assumidas com relação ao(s) bem(ns) cedido(s)
  à

  entidade pelo(s) respectivo(s) Contrato(s) de Cessão, de acordo com o disposto nesta IAC.

  A nova diretoria deve, no prazo de 30 (trinta) dias contados a partir de sua posse, encami-

  nhar ao SERAC da área de sua jurisdição um novo Laudo Técnico sobre o Inventário do Bem
  (LIB),

  para cada equipamento aeronáutico cedido pelo DAC à Entidade de sua responsabilidade. Este(s)
  do-

  cumento(s) deve(m) seguir o modelo do Anexo 4, da presente IAC, devendo, neste caso, ser(em)
  assi-

  nado(s), conjuntamente, pelo Presidente empossado e seu antecessor, com suas firmas reconhecidas

  em cartório por autenticidade.

  No caso de haver discrepâncias relacionadas com o bem, incluindo sua documentação téc-

  nica aplicável, o SERAC deve adotar as providências julgadas cabíveis.2005 IAC 180-1002A

  10

  6 DAS PENALIDADES

  6.1 POR DEIXAR DE APRESENTAR A DOCUMENTAÇÃO NO PRAZO ESTABELECI-

  DO

  No caso específico de redistribuição ou recadastramento de aeronave, haverá a suspensão

  de sua aeronavegabilidade por configurar situação irregular do novo operador no Cadastro
  Nacional de

  Aeronaves Civis Brasileiras, controlado pelo RAB.

  Para todos os bens, na impossibilidade de cumprimento dos prazos de remessa da docu-

  mentação ao RAB e/ou SERAC, a cessionária deve informar antecipadamente, em documento revesti-

  do das formalidades legais, suas razões ao SERAC envolvido, o qual deve tomar as providências
  cabí-

  veis e, se for o caso, providenciar a interrupção da cessão do bem conforme previsto no
  item 3.4 desta

  IAC.

  6.2 POR DESCUMPRIR OUTROS PRECEITOS DESTA IAC

  Tendo sido observados indícios do descumprimento do previsto nesta IAC, a Autoridade

  Aeronáutica pode adotar procedimentos administrativos para a tomada de providências cabíveis
  e, no

  caso de evidência(s) de crime contra o patrimônio da União, deve determinar a abertura do
  competente

  inquérito.2005 IAC 180-1002A

  11

  7 DISPOSIÇÕES TRANSITÓRIAS

  7.1 RECADASTRAMENTO

  As entidades cessionárias que possuam equipamentos aeronáuticos pertencentes ao DAC,

  por força de cessão de uso a título gratuito, firmada em data anterior ao início de vigência
  da presente

  IAC, devem providenciar, junto aos SERAC, a celebração de novos Contratos de Direito de
  Uso e a

  elaboração dos demais documentos previstos nesta IAC.

  O presente recadastramento deve ser totalmente realizado até agosto de 2006. O resumo da

  documentação envolvida está no Anexo nº 5, excetuando-se os procedimentos referentes à figura
  da

  entidade restituidora.

  A inobservância do prazo estabelecido acarreta a penalidade prevista no item 6.1 desta

  IAC.2005 IAC 180-1002A

