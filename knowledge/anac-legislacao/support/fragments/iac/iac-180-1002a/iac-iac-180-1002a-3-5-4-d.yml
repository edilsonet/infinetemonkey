text: 'd) as entidades cessionárias têm um prazo de 60 (sessenta) dias, a partir da publicação
  do

  Item de Distribuição ou Redistribuição, no Boletim Externo do COMAER, para apresentar toda
  a do-

  cumentação ao SERAC, conforme previsto no Anexo nº 5. O SERAC, no caso de aeronave, após
  rea-

  lizados os procedimentos de sua competência, deve encaminhar ao RAB os documentos cabíveis,
  elen-

  cados no supracitado Anexo, para o devido registro do Direito de Uso nos assentamentos da
  aeronave.

  4.2 REPRESENTANTES DA AUTORIDADE AERONÁUTICA PARA OS EFEITOS DES-

  TA IAC'
