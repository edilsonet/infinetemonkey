title: ANEXO 1 - MODELO DE CONTRATO DE CESSÃO (CC)
text: 'ANEXO 1 - MODELO DE CONTRATO DE CESSÃO (CC)

  CONTRATO DE CESSÃO DE USO

  Pelo presente Instrumento celebrado entre o Governo Federal, doravante

  denominado simplesmente CEDENTE, por intermédio do Departamento de Aviação Civil, com

  sede na Rua Santa Luzia nº 651, 6º andar - Castelo, Município do Rio de Janeiro - RJ, CEP.
  nº

  20020-080, neste ato representado pelo Exmo. Sr. ..............................................................................,

  Diretor-Geral do Departamento de Aviação Civil (ou seu representante legal, conforme previsto
  no

  item 4.2 desta IAC), no uso dos poderes que lhe são conferidos pela Portaria nº..............................

  (inserir “e IAC nº 180-1002A”, no caso de representante legal) e o

  ........................................................ (nome da entidade), doravante denominado
  simplesmente

  CESSIONÁRIO, inscrito(a) no CNPJ sob o nº .............................................com
  sede na Cidade de

  ..................................................., Estado ou Unidade da Federação .........................................CEP.
  nº

  ............................., neste ato representado(a) por seu Presidente Sr.

  ..................................................................., CPF. nº ....................................
  e pelo Diretor de (especi-

  ficar) Sr. ................................................................., CPF. nº ..............................
  nomeados, conforme

  Ata de Assembléia, datada de ..../....../....., cuja cópia autenticada é parte integrante
  do presente Ins-

  trumento, têm justo e acordada a Cessão de Uso da(o)............................... (aerona-

  ve/simulador/outros bens), abaixo descrito(a), mediante cláusulas e condições a seguir estabeleci-

  das.

  Cláusula Primeira:

  O Cedente entrega neste ato ao Cessionário o bem descrito abaixo no estado

  em que se encontra, conforme o Termo de Exame e Recebimento (TER), que é parte integrante
  do

  presente instrumento.

  Cláusula Segunda:

  O Cessionário assume completa e total responsabilidade pelo uso, exploração,

  dano, inclusive responsabilidade para com terceiros, (no caso de aeronaves inserir: bem
  como pelos

  tripulantes, pessoas e bens no solo, colisão, abalroamento) da (o) aeronave/simulador/outros
  bens

  (prefixo, fabricante, número de série e modelo para aeronave ou marca, modelo e número de
  série

  no caso de simulador e outros bens), ora recebida (o) através da presente cessão de uso,
  para ser

  utilizada (o) com o fim de (instrução, ou pesquisa e desenvolvimento), de acordo com as
  normas e

  determinações do Departamento de Aviação Civil.

  Cláusula Terceira:

  A vigência da presente cessão de uso é por prazo indeterminado, podendo ser

  interrompida pela ocorrência dos fatos, abaixo relacionados:'
