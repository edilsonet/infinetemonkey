text: 'e) decisão do cedente em alienar o bem, objeto do presente instrumento.

  Cláusula Quarta: (somente para o caso de aeronaves)2005 IAC 180-1002A

  A1-2

  A cessionária fica obrigada a providenciar o preenchimento do Requerimento Pa-

  dronizado do Registro Aeronáutico Brasileiro (RAB) devidamente instruído com a documentação

  prevista na legislação em vigor, solicitando a averbação do “Direito de Uso” do bem , para
  fins de

  registro do contrato de cessão de uso nos assentamentos da aeronave junto ao RAB e conseqüente

  atualização do Cadastro Nacional de Aeronaves Civis Brasileiras.

  Cláusula Quinta (ou Quarta):

  Obriga-se o cessionário pela observância dos termos da IAC nº 180-1002A "Ces-

  são de Equipamentos Aeronáuticos", de ....../....../......... , alterações posteriores e
  por todo o teor

  deste Instrumento de Cessão, em especial: responsabilizar-se pela conservação, manutenção
  e inte-

  gridade do bem; utilizá-lo com o fim específico a que foi cedido obedecendo aos procedimentos
  e

  limitações previstos no(s) manual (ais) do fabricante; manter atualizadas e em bom estado
  todas as

  publicações cedidas com o bem; responsabilizar-se por multas ou infrações ocasionadas pela
  guarda

  ou uso do bem; não permutar seus componentes com outros bens similares, mesmo aqueles de
  pro-

  priedade do DAC, sem prévia autorização da Autoridade Aeronáutica; não modificar qualquer
  parte

  do bem ou seus componentes, inclusive seu padrão de pintura externa, sem autorização prévia
  da

  Autoridade Aeronáutica; permitir o livre acesso e vistoria do bem por agente da Autoridade
  Aero-

  náutica; e apresentar relatórios anuais e/ou sempre que solicitado, sobre a utilização e
  estado físico

  do bem.

  Cláusula Sexta (ou Quinta):

  No caso de descumprimento do previsto na IAC referida na Cláusula anterior, a Au-

  toridade Aeronáutica mandará instaurar o competente processo administrativo para tomada
  de pro-

  vidências cabíveis, inclusive, abertura do competente inquérito, havendo evidências de crime
  con-

  tra o patrimônio da União.

  Depois de lido e por estarem justos e acordados, as partes contratantes assinam o

  presente instrumento, em 03 (três) vias de igual teor, na presença de duas testemunhas.

  Cidade, (UF)................................... ..............de .....................de
  ................

  __________________________________________________

  Cedente (conforme previsto no item 4.2 desta IAC)

  ___________________________________________________

  Nome da Entidade Cessionária

  Presidente

  ___________________________________________________

  Nome da Entidade Cessionária

  Diretor de ( )

  Testemunhas:

  1ª................................................................

  R.G. nº - CPF nº

  2ª...............................................................

  R.G. nº - CPF nº2005 IAC 180-1002A

  A1-3

  NOTAS:

  1) 0 Presidente da entidade cessionária será responsável pelo envio de todas as vias ao
  SERAC. No

  caso de aeronave, o SERAC, após todos os procedimentos previstos de sua competência, encami-

  nhará uma via ao RAB, para o devido registro, juntamente com os demais documentos cabíveis;

  2) excetuando-se a assinatura do Cedente (AA), as demais deverão ser reconhecidas em Cartório,

  por autenticidade, entretanto, as firmas das testemunhas podem ser por semelhança; e

  3) com exceção da última página, todas as demais devem ser rubricadas pelos signatários.2005
  IAC 180-1002A

  A2-1'
