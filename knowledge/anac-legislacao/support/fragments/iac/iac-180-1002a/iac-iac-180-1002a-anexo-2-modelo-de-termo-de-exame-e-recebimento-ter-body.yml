title: ANEXO 2 - MODELO DE TERMO DE EXAME E RECEBIMENTO (TER)
text: 'ANEXO 2 - MODELO DE TERMO DE EXAME E RECEBIMENTO (TER)

  (CASO DE ENTREGA INICIAL DE EQUIPAMENTOS)

  Aos (dia, mês, ano), nas dependências do (local da entrega), no Município de (municí-

  pio), reuniram-se os Sr. (Presidente da entidade cessionária) e o Sr. (representante da
  Autoridade

  Aeronáutica da área), para proceder ao exame e recebimento do(a) (prefixo, fabricante, número
  de

  série e modelo para aeronave ou marca, modelo e número de série no caso de simulador e outros

  bens) ora entregue por ato do Exmo. Sr. Diretor-Geral do Departamento de Aviação Civil,
  ao (enti-

  dade cessionária). O detalhamento do estado geral do bem e da documentação que o acompanha

  está descrito no Laudo Técnico sobre o Inventário do Bem (LIB), que é parte integrante do
  presente

  instrumento.

  E para constar, é lavrado o presente Termo de Exame e Recebimento em 03 (três) vias,

  para todos os efeitos legais, que vão assinadas pelos representantes acima mencionados e
  por duas

  testemunhas, sendo 01 (uma) via pertencente à (entidade cessionária), 01 (uma) ao Nº Serviço
  Re-

  gional de Aviação Civil e outra, no caso de aeronave, para a averbação junto ao Registro
  Aeronáuti-

  co Brasileiro.

  (Cidade/Município) ....................., em DD de MMM de AAAA

  __________________________________ ______________________________________

  Sr. Presidente do(a) (entidade cessionária) Autoridade Aeronáutica ou seu representante

  legal, conforme previsto no item 4.2 desta IAC

  ___________________________________

  1ª Testemunha Sr. (nome e CPF)

  ___________________________________

  2ª Testemunha Sr. (nome e CPF)

  NOTAS:

  1) O Presidente da entidade cessionária será responsável pelas providências de envio das
  vias ao

  SERAC. No caso de aeronave, o SERAC, após todos os procedimentos previstos de sua competên-

  cia, encaminhará uma via ao RAB, juntamente com os demais documentos pertinentes; e

  2) excetuando-se a assinatura da Autoridade Aeronáutica, as demais deverão ser reconhecidas
  em

  Cartório, sendo a do Presidente da entidade cessionária, obrigatoriamente, por autenticidade.2005
  IAC 180-1002A

  A3-1'
