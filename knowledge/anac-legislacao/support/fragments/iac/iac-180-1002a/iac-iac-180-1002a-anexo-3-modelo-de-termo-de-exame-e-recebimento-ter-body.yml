title: ANEXO 3 - MODELO DE TERMO DE EXAME E RECEBIMENTO (TER)
text: 'ANEXO 3 - MODELO DE TERMO DE EXAME E RECEBIMENTO (TER)

  (CASO DE REDISTRIBUIÇAO DE EQUIPAMENTOS)

  Aos (dia, mês, ano), nas dependências do (local da redistribuição), no Município de

  (município), reuniram-se os Sr. (representante da Autoridade Aeronáutica da área) e Sr.
  (Presidente

  da entidade cessionária), para proceder ao exame e recebimento do(a) (prefixo, fabricante,
  número

  de série e modelo para aeronave ou marca, modelo e número de série no caso de simulador
  e outros

  bens)...................... proveniente do(a) (entidade restituidora) e ora redistribuída,
  por ato do Exmo.

  Sr. Diretor-Geral do Departamento de Aviação Civil, ao (entidade cessionária). O detalhamento
  do

  estado geral do bem e da documentação que o acompanha está descrito no Laudo Técnico sobre
  o

  Inventário do Bem (LIB), que é parte integrante do presente instrumento.

  E para constar, é lavrado o presente Termo de Exame e Recebimento em 04 (quatro)

  vias, para todos os efeitos legais, que vão assinadas pelos representantes acima mencionados,
  sendo

  01 (uma) via pertencente à (entidade cessionária), 01 (uma) via (entidade restituidora),
  01 (uma)

  ao Nº Serviço Regional de Aviação Civil e 1(uma), no caso de aeronave, para a averbação
  junto ao

  Registro Aeronáutico Brasileiro.

  (Cidade/Município) ....................., em DD de MMM de AAAA

  _______________________________ _____________________________

  Sr. Sr.

  Presidente do(a) (entidade cessionária) Presidente do(a) (entidade restituidora)

  _______________________________________

  Autoridade Aeronáutica ou seu representante

  legal, conforme previsto no item 4.2 desta IAC

  (Interveniente anuente)

  ___________________________________

  1ª Testemunha Sr. (nome e CPF)

  __________________________________

  2ª Testemunha Sr. (nome e CPF)

  NOTAS:

  1) O Presidente da entidade cessionária será responsável pelas providências de envio das
  vias ao

  SERAC. No caso de aeronave, o SERAC, após todos os procedimentos previstos de sua competên-

  cia, encaminhará uma via ao RAB, juntamente com os demais documentos pertinentes; e

  2) excetuando-se a assinatura da Autoridade Aeronáutica, as demais deverão ser reconhecidas
  em

  Cartório, sendo a do Presidente da entidade cessionária, obrigatoriamente, por autenticidade.2005
  IAC 180-1002A

  A4-1'
