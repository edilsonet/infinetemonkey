  A4-3

  Outras observações:

  (Este campo é destinado para a colocação das discrepâncias relacionadas com o bem e toda
  a sua

  documentação técnica aplicável)

  1 - A aeronave está com aeronavegabilidade suspensa. As asas e estabilizador foram retirados
  para

  transporte por via terrestre. A pintura das asas precisa ser refeita e faltam as seguintes
  partes: corti-

  na da cabine, tampa da caixa da bateria, conjunto e roda da bequilha.

  2 - O motor aguarda revisão de 1200h.

  3 - A hélice e o cone foram retirados para o transporte.

  4 - Foi instalado um conjunto transponder de acordo com instruções recebidas do DAC pelo
  Certifi-

  cado de Homologação de Tipo nº 2001S09-03 e remetido o "SegVôo" para o SERAC.

  Geral - A entidade cessionária se comprometeu a arcar com os custos necessários à recuperação
  da

  aeronave (revisão do motor, aquisição de peças que faltam e pintura)

  (Município), em (dia / mês / ano)

  __________________________________ ___________________________________

  Sr. Sr.

  Presidente do(a) (entidade cessionária) Presidente do(a) (entidade restituidora)

  ___________________________________ ____________________________________

  Autoridade Aeronáutica da área da entidade Autoridade Aeronáutica da área da entidade

  cessionária ou seu representante legal, con- restituidora ou seu representante legal, con-

  forme previsto no item 4.2 desta IAC forme previsto no item 4.2 desta IAC

  NOTAS:

  1) Excetuando-se a assinatura da Autoridade Aeronáutica, as demais deverão ser reconhecidas
  em

  Cartório, obrigatoriamente, por autenticidade;

  2) com exceção da última página, todas as demais devem ser rubricadas pelos signatários;

  3) o detalhamento do estado geral do componente deverá ser feito sucintamente na coluna
  observa-

  ções, ou mais detalhadamente no final do documento; e

  4) o Presidente da entidade cessionária será responsável pelas providências de envio das
  vias desti-

  nadas ao SERAC. No caso de aeronave, o SERAC, após todos os procedimentos previstos de sua

  competência, encaminhará uma via ao RAB, juntamente com os demais documentos pertinentes.2005
  IAC 180-1002A

  A5-1'
