  1

  1 DISPOSIÇÕES PRELIMINARES

  1.1 FINALIDADE

  Esta Instrução de Aviação Civil estabelece os procedimentos para a cessão de uso a título

  gratuito de aeronaves e equipamentos aeronáuticos a entidades de instrução de aviação civil
  ou a enti-

  dades relacionadas com a pesquisa e o desenvolvimento da aviação civil.

  1.2 FUNDAMENTO

  Artigo 2º do Decreto nº 65.144, de 12 de setembro de 1969, que institui o Sistema de Avia-

  ção Civil do Ministério (Comando) da Aeronáutica e a Portaria nº 453/GM5, de 02 de agosto
  de 1991,

  que reformula o Sistema de Segurança de Vôo e o Parágrafo Único do Artigo 3º do Decreto
  Lei 1305

  de 8 de janeiro de 1974.

  1.3 APROVAÇÃO

  Aprovada pela Portaria DAC nº 835/DGAC, de 18 de agosto de 2005.

  1.4 DISTRIBUIÇÃO

  D - IA - SA - SR - AE

  1.5 CORRELAÇÕES

  RBHA 47,140 e 141

  1.6 CANCELAMENTO

  2

  2 DEFINIÇÕES

  2.1 AVIÔNICOS OU EQUIPAMENTOS DE AVIÔNICA

  Equipamentos eletrônicos e/ou de processamento de dados, inclusive os emissores e/ou

  receptores de ondas eletromagnéticas e seus componentes, utilizados para controle, comunicação
  e/ou

  navegação em aeronaves, simuladores ou treinadores sintéticos.

  2.2 ACESSÓRIOS DE CÉLULA

  Componentes normalmente agregados à aeronave e que não são imprescindíveis ao vôo

  (polainas dos pneus, extintores de incêndio, capas de proteção, calços, material de amarração,
  casulo

  externo de carga etc).

  2.3 ACESSÓRIOS DO MOTOR E DE SISTEMAS

  Componentes instalados, indispensáveis ao funcionamento do motor e de sistemas, que

  podem ser trocados por manutenção nível operador. (magneto, carburador, bomba hidráulica,
  alterna-

  dor, bateria etc).

  2.4 AUTORIDADE AERONÁUTICA (AA)

  Para efeito desta IAC, o termo “Autoridade Aeronáutica” se refere ao Departamento de

  Aviação Civil, seus Subdepartamentos, seus elos regionais (Serviços Regionais de Aviação
  Civil) ou

  quaisquer representantes credenciados desses órgãos.

  2.5 BEM/BENS

  Para efeito desta IAC, o(s) termo(s) bem/bens se refere(m) aos equipamentos aeronáuticos

  de propriedade do DAC, passíveis de cessão a entidades que tenham relação com o ensino ou
  a pesqui-

  sa e o desenvolvimento da aviação civil.

  2.6 ENTIDADE CESSIONÁRIA OU CESSIONÁRIA (EC)

  Entidade para a qual o Departamento de Aviação Civil está cedendo o uso do bem.

  2.7 CEDENTE

  Proprietário do bem, o Departamento de Aviação Civil.

  2.8 CÉLULA OU CÉLULA DE AERONAVE

  Parte da aeronave compreendendo a fuselagem, asas, superfícies de comando, carenagem,

  cabine, trem de pouso e sistemas incorporados à aeronave, excluído(s) o(s) motor(es) e a(s)
  hélice(s).

  2.9 CONTRATO DE CESSÃO DE USO (CC)

  Instrumento celebrado entre o Departamento de Aviação Civil e a Entidade que usará o

  bem estabelecendo as cláusulas e condições a serem seguidas.2005 IAC 180-1002A

  3

  2.10 COMPONENTE

  Peça, acessório, subconjunto ou conjunto que é utilizado em um equipamento aeronáutico.

  2.11 ENTIDADE RESTITUIDORA OU RESTITUIDORA (ER)

  Entidade que devolve o bem de propriedade do DAC.

  2.12 EQUIPAMENTO OU EQUIPAMENTO AERONÁUTICO

  Aeronaves, simuladores, treinadores sintéticos e componentes que possam ser utilizados

  pelos mesmos, inclusive aqueles de apoio de solo.

  2.13 INSTRUMENTO

  Componente destinado a indicar, por meios sonoros ou visuais, os parâmetros relacionados

  com a operação da aeronave, de seus sistemas ou de partes da mesma. Inclui dispositivos
  eletrônicos

  destinados a programar automaticamente o vôo.

  2.14 INVENTÁRIO DO BEM (IB)

  Documento contendo a relação detalhada dos principais componentes, agregados ao bem.

  2.15 LAUDO TÉCNICO SOBRE O INVENTÁRIO DO BEM (LIB)

  Registro com as observações sobre a condição técnica de cada um dos componentes, que

  fazem parte do Inventário do Bem (IB), podendo, se necessário, conter anexos (ver exemplo
  do Anexo

  nº 4).

  2.16 PROPRIEDADE DO DAC

  Para efeito desta IAC o termo "propriedade do DAC" se refere ao material aeronáutico de

  propriedade da União Federal sob a responsabilidade do Departamento de Aviação Civil.

  2.17 TERCEIROS

  Pessoas ou entidades a quem o cessionário entrega, provisoriamente, a guarda do bem vi-

  sando a sua manutenção ou reparo.

  2.18 TERMO DE EXAME E RECEBIMENTO (TER)

  O Termo de Exame é o documento escrito e formal, no qual o(s) representante(s) legal(is)

  da Entidade Cessionária aceita(m), perante o agente da Autoridade Aeronáutica, o estado
  físico geral

  em que se encontra o bem a ser cedido. Este Termo deverá ser elaborado de acordo com o modelo
  do'
