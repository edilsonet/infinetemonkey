text: 'ANEXO 5 - QUADRO RESUMO DA DOCUMENTAÇÃO ENVOLVIDA

  1) PARA CESSÃO DE AERONAVES

  NOTAS:

  ORIGEM - entidade responsável pela lavratura do documento.

  QTD - quantidade de exemplares dos documentos a serem feitos.

  TIPO - especifica a "qualidade" do documento : " O" - original; "C" - cópia comum; " CA"-
  cópia

  autenticada em Cartório.

  DESTINO - detentor(es) final(ais) de exemplar(es) do documento.

  * - Toda a documentação técnica prevista no RBHA-91, conforme aplicável.

