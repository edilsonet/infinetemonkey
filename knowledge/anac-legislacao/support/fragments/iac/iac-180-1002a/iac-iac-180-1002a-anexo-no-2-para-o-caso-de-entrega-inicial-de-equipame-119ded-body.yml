text: 'Anexo nº 2 para o caso de entrega inicial de equipamentos ou de acordo com o modelo
  do Anexo nº 3

  para o caso de redistribuição de equipamentos.2005 IAC 180-1002A

  4

  3 NORMAS GERAIS

  3.1 CANDIDATOS À CESSÃO DE USO

  A cessão de aeronaves e equipamentos aeronáuticos de propriedade do Departamento de

  Aviação Civil deve obedecer às diretrizes do Ministério da Defesa e só pode ser feita a
  entidades de

  instrução de aviação civil ou a entidades relacionadas com a pesquisa e o desenvolvimento
  da aviação

  civil.

  3.2 REQUISITOS PARA A CESSÃO DE USO'
