text: 'REPÚBLICA FEDERATIVA DO BRASIL

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  SUBDEPARTAMENTO TÉCNICO-OPERACIONAL

  INSTRUÇÃO DE AVIAÇÃO CIVIL

  CESSÃO DE EQUIPAMENTOS

  AERONÁUTICOS

  20052005 IAC 180-1002A

  I

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC No 835/DGAC, DE 18 DE AGOSTO DE 2005.

  Aprova a IAC que institui a Cessão de Equipamentos Aeronáuticos

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, considerando a

  necessidade de melhor regularizar os procedimentos relativos à cessão de uso a título gratuito
  de

  equipamentos aeronáuticos destinados à instrução da aviação civil, pelo Departamento de
  Aviação

  Civil, visando o resguardo do bem, a responsabilidade por seu uso, exploração, guarda e
  conserva-

  ção, resolve:

  Art. 1o Efetivar a IAC abaixo discriminada:

  Símbolo: IAC 180-1002A

  Título: Cessão de Equipamentos Aeronáuticos

  Art. 2o Revogar a Portaria DAC nº 865/DGAC, de 11 de agosto de 2004, publicada no Diá-

  rio Oficial da União n° 158, de 17 de agosto de 2004, que aprovou a IAC 180-1002, “Cessão
  de

  Equipamentos Aeronáuticos”.

  Art. 3o Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Maj Brig do Ar JORGE GODINHO BARRETO NERY

  Diretor-Geral

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO NO 166, DE 29 DE AGOSTO DE 20052005 IAC 180-1002A

  II'
