title: MODIFICAÇÕES
text: '3.1.1 MODIFICAÇÕES

  Quaisquer bens de propriedade do DAC, cedidos por contrato de uso, devem ter sua

  aparência externa mantida igual àquela original de quando foram cedidos desde que não tenha

  havido para o mesmo instruções de modificação mandatória ou autorização expressa emitida
  pela

  Autoridade Aeronáutica.'
