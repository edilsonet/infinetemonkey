text: '3.1.3 MÉTODOS DE APLICAÇÃO DA IDENTIFICAÇÃO

  O método escolhido também deve ser aquele que não comprometa a segurança de

  operação do bem, seja factível tecnicamente, tenha maior perenidade e uma boa e harmoniosa

  apresentação estética. Aconselha-se consulta à Norma ABNT NBR 8575 (Marcação para

  identificação de peças para uso aeronáutico).

  3.2 IDENTIFICAÇÃO DE PROPRIEDADE.'
