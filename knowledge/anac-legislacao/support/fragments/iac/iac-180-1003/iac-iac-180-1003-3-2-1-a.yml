title: 3.2.1(a)
text: 'a) Fuselagem: abaixo e antes da janela da(s) porta(s) de acesso da tripulação ou abaixo

  da capota, próximo à(s) entrada(s) da tripulação deve ser escrito em letras de forma maiúsculas,
  em

  cor que contraste com a pintura de fundo, em letras de tamanho compatível porém com altura

  mínima não inferior a 5 (cinco) centímetros o letreiro: "PROPRIEDADE DA UNIÃO FEDERAL"

  seguido logo abaixo da frase "USO EXCLUSIVO EM INSTRUÇÃO" (ver Anexo nº1).

  Nota: Caso o acesso de tripulantes possa ser feito por ambos os lados da fuselagem, o

  letreiro também deverá ser aposto em ambos os lados.'
