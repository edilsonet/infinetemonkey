title: AERONAVES DE ASAS ROTATIVAS
text: '3.2.2 AERONAVES DE ASAS ROTATIVAS

  Em local mais adequado de quaisquer das partes laterais externas, em ambos os lados, o

  letreiro previsto em 3.2.1.a. Havendo disponibilidade de espaço deverá ser aposto acima
  destes

  dizeres o emblema do DAC conforme ilustração do Anexo nº2, figura nº 1.'
