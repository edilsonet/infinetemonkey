title: 3.2.3(a)
text: 'a) Cada Módulo (cabine, controle, plotagem etc) deverá ter aposto em ambas as laterais

  de sua parte externa o emblema do DAC e abaixo deste, em letras de forma maiúsculas, em
  cor que

  contraste com o fundo a frase "PROPRIEDADE DA UNIÃO FEDERAL" , em tamanho compatível

  porém com altura mínima não inferior a 1 (um) centímetro (ver anexo nº2 figura nº 1).'
