title: EQUIPAMENTOS DE APOIO E COMPONETES CEDIDOS EM SEPARADO
text: '3.2.4 EQUIPAMENTOS DE APOIO E COMPONETES CEDIDOS EM SEPARADO

  Devem ser afixados letreiros, em letras de forma, em sua parte externa, contrastando

  com a pintura de fundo, em local de fácil visualização pelo usuário e em dimensões compatíveis
  os

  dizeres: "PROPRIEDADE DA UNIÃO FEDERAL - DAC".'
