text: '3.2.5 ACESSÓRIOS RETIRADOS TEMPORARIAMENTE DO BEM CEDIDO

  Os acessórios de um bem retirados temporariamente para serem reparados ou mantidos

  por terceiros devem ter afixados a si, por iniciativa da entidade cessionária, a identificação
  de

  propriedade conforme instruções desta IAC.17 AGO 04 IAC 180-1003

  6

  4 DISPOSIÇÕES FINAIS

  Tendo sido observados indícios do descumprimento do previsto nesta IAC, a

  Autoridade Aeronáutica poderá adotar procedimentos administrativos para a tomada de

  providências cabíveis e, no caso de evidências de crime contra o patrimônio da União, determinará

  a abertura do competente inquérito.17 AGO 04 IAC 180-1003

  A1-1'
