title: ANEXO 1 - IDENTIFICAÇÃO NA FUSELAGEM DE AERONAVES DE ASA FIXA
text: 'ANEXO 1 - IDENTIFICAÇÃO NA FUSELAGEM DE AERONAVES DE ASA FIXA

  1) PARA AVIÕES COM PORTA(S) DE ACESSO À CABINE.

  Afixar o letreiro antes da(s) porta(s), abaixo da linha da(s) janela(s).

  2) PARA AVIÕES COM ACESSO À CABINE POR CAPOTA OU ABERTURA SUPERIOR.

  Afixar o letreiro abaixo da entrada no(s) lado(s) de acesso.

  PROPRIEDADE DA UNIÃO FEDERAL

  USO EXCLUSIVO EM INSTRUÇÃO

  PROPRIEDADE DA UNIÃO FEDERAL

  USO EXCLUSIVO EM INSTRUÇÃO17 AGO 04 IAC 180-1003

  A2-1'
