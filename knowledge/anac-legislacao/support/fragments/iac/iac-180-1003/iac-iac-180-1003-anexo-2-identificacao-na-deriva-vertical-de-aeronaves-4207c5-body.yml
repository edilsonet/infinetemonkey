text: 'ANEXO 2 - IDENTIFICAÇÃO NA DERIVA VERTICAL DE AERONAVES DE ASA FIXA

  1) EMBLEMA DO DAC E DIZERES.

  O emblema do DAC deve ser nas cores indicadas no desenho e ter largura mínima de 16

  (dezesseis) centímetros mantidas as proporções.

  2) LOCAL APROXIMADO PARA FIXAÇÃO

  Ambos os lados da deriva vertical17 AGO 04 IAC 180-1003

  A3-1'
