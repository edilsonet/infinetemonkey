  1 DISPOSIÇÕES PRELIMINARES

  1.1 FINALIDADE

  Esta Instrução de Aviação Civil estabelece os procedimentos para padronizar a

  identificação de propriedade de material aeronáutico do DAC.

  1.2 FUNDAMENTO

  Artigo 2º do Decreto nº 65.144, de 12 de setembro de 1969, que institui o Sistema de

  Aviação Civil do Ministério (Comando) da Aeronáutica e a Portaria nº 453/GM5, de 02 de agosto

  de 1991, que reformula o Sistema de Segurança de Vôo e o Parágrafo Único do Artigo 3º do

  Decreto Lei 1305 de 8 de janeiro de 1974.

  1.3 APROVAÇÃO

  Aprovada pela Portaria DAC nº 866/DGAC, de 11 de AGOSTO 2004.

  1.4 DATA DE EFETIVAÇÃO

  17/08/2004

  1.5 DISTRIBUIÇÃO

  D - SA - SR - X17 AGO 04 IAC 180-1003

  2

  2 DEFINIÇÕES

  2.1 ACESSÓRIOS DE CÉLULA

  Componentes normalmente agregados à aeronave e que não são imprescindíveis ao vôo

  (polainas dos pneus, extintores de incêndio, capas de proteção, calços, material de amarração,

  casulo externo de carga etc).

  2.2 ACESSÓRIOS DO MOTOR E DE SISTEMAS

  Componentes instalados, indispensáveis ao funcionamento do motor e de sistemas, que

  podem ser trocados por manutenção nível operador. (magneto, carburador, bomba hidráulica,

  alternador, bateria etc).

  2.3 AUTORIDADE AERONÁUTICA

  Para efeito desta IAC, o termo “Autoridade Aeronáutica” se refere ao Departamento de

  Aviação Civil, seus elos regionais (Serviços Regionais de Aviação Civil) ou quaisquer

  representantes credenciados desses órgãos.

  2.4 BENS

  Para efeito desta IAC, o(s) termo(s) bem ou bens se refere(m) a qualquer tipo de

  material aeronáutico de propriedade do DAC, cedido (s) a entidades que tenham relação com
  o

  ensino ou a pesquisa e o desenvolvimento da aviação civil.

  2.5 CÉLULA OU CÉLULA DE AERONAVE

  Parte da aeronave compreendendo a fuselagem, asas, superfícies de comando,

  carenagem, cabine, trem de pouso e sistemas incorporados à aeronave, excluídos o(s) motor(es)
  e

  a(s) hélice(s).

  2.6 COMPONENTE

  Conjunto, subconjunto, acessório ou peça que é utilizado em um equipamento

  aeronáutico.

  2.7 CESSIONÁRIO OU ENTIDADE CESSIONÁRIA

  Entidade para a qual o Departamento de Aviação Civil cede o bem.

  2.8 EQUIPAMENTO OU EQUIPAMENTO AERONÁUTICO

  Aeronaves, simuladores, treinadores sintéticos e componentes que possam ser

  utilizados pelos mesmos, inclusive aqueles de apoio de solo.

  2.9 LETREIRO

  O termo "letreiro" para efeito desta IAC se refere a dizeres afixados por tinta, marcados

  ou impressos por quaisquer processos sobre superfície do bem ou em plaqueta a ele afixada.17
  AGO 04 IAC 180-1003

  3

  2.10 OPERADOR

  Entidade responsável pela cessão de uso do bem ou pessoa que o utiliza.

  2.11 PINTURA

  O termo "pintura" para efeito desta IAC se refere ao recobrimento de superfície externa

  do bem.

  2.12 PROPRIEDADE DO DAC

  Para efeito desta IAC, o termo "propriedade do DAC" se refere ao material aeronáutico

  de propriedade da União Federal sob a responsabilidade do Departamento de Aviação Civil.

  2.13 TERCEIROS

  Pessoas ou entidades a quem o cessionário entrega provisoriamente a guarda

  do bem visando sua manutenção ou reparo.17 AGO 04 IAC 180-1003

  4

  3 NORMAS GERAIS

  Todos os equipamentos aeronáuticos cedidos pelo DAC por Contrato de Uso a

  entidades relacionadas com o ensino ou pesquisa da aviação civil, quando tratados isoladamente,

  devem ter afixados a si, de maneira permanente, letreiros que os identifiquem como de propriedade

  DAC.

  3.1 APARÊNCIA EXTERNA DO BEM'
