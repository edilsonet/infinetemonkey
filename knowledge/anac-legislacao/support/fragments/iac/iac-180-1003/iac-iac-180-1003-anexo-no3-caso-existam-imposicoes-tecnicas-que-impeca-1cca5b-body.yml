title: Anexo nº3). Caso existam imposições técnicas que impeçam a pintura na superfície do
  leme
text: 'Anexo nº3). Caso existam imposições técnicas que impeçam a pintura na superfície do
  leme

  direcional, a mesma deverá ser substituída por pintura ou adesivo com a mesma disposição
  de

  cores, de forma retangular e afixados em ambos os lados da deriva vertical acima do emblema
  do

  DAC ( ver Anexo nº3).'
