text: 'REPÚBLICA FEDERATIVA DO BRASIL

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  SUBDEPARTAMENTO TÉCNICO

  INSTRUÇÃO DE AVIAÇÃO CIVIL

  IDENTIFICAÇÃO DE PROPRIEDADE DE MATERIAL

  AERONÁUTICO DO DAC

  17 AGO 200417 AGO 04 IAC 180-1003

  II

  SERVIÇO PÚBLICO FEDERAL

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  SUBDEPARTAMENTO TÉCNICO

  PORTARIA DAC No 866/DGAC, DE 11 DE AGOSTO DE 2004.

  Aprova a IAC que institui a padronização da identificação de material aeronáutico de

  propriedade do DAC.

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, considerando a

  necessidade de padronizar os procedimentos relativos à identificação de propriedade de

  equipamentos aeronáuticos do Departamento de Aviação Civil, resolve:

  Art. 1o Seja efetivada a IAC abaixo discriminada:

  Símbolo: IAC 180-1003

  Espécie: Normativa

  Título: Identificação de Propriedade de Material Aeronáutico do DAC

  Art. 2o Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Maj.-Brig.-do-Ar Jorge GODINHO Barreto Nery

  Diretor-Geral

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO NO 158 , S/1, DE 17 DE AGOSTO DE 2004.17 AGO 04 IAC
  180-1003

  III'
