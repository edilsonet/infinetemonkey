text: '3.6.2.3 A tabela estará disponível nos locais onde são solicitados os serviços indenizáveis
  e no sítio do DAC

  na INTERNET

  3.7 CONTA ÚNICA

  Conta Única do Tesouro Nacional, na qual será depositado o valor referente ao serviço solicitado
  pelo

  usuário, que tem o número 170.500-8, da Agência nº 4201-3, do Banco do Brasil.21 MAR 2005
  IAC 187-1001

  4

  3.8 CONTA INSTITUCIONAL

  Denominação do mecanismo (códigos numéricos) que permite identificar a destinação favorecida
  atra-

  vés da Unidade Gestora, da Gestão e da Identificação dos serviços, incluindo o dígito verificador.

  Objetiva a contabilização automática dos registros contábeis no Sistema Integrado de Administração
  Fi-

  nanceira do Governo Federal, sendo imprescindível que as informações fornecidas estejam
  descritas

  corretamente. No caso do DAC, a Unidade Gestora é 120033, a Gestão é 0001 e a Finalidade
  será em

  função do tipo do serviço executado: serviços de inspeção, fiscalização, taxas, emolumentos
  e for-

  necimentos de editais 220809, multas 220817 e adicional tarifário 107085.

  3.9 MAPPER - Banco de Dados relativo ao Sistema de Aviação Civil.

  3.10 SEFA - Secretaria de Economia e Finanças da Aeronáutica, órgão responsável pela Gestão
  da Conta

  Institucional.

  3.11 SISCOD - Sistema de Conferência de Depósito Bancário Identificado (Sistema BOLETA)
  - adminis-

  trados pela Assessoria de Assuntos Especiais, efetua a comprovação do ingresso na Conta

  Única do Tesouro dos depósitos realizados.

  3.12 GABAC - Gabinete do DAC.

  3.13 DGAC - Diretor-Geral do DAC.

  3.14 ACI - Agente de Controle Interno do Departamento de Aviação Civil.21 MAR 2005 IAC 187-1001

  5

  CAPÍTULO 4 - PROCEDIMENTOS PARA A EXECUÇÃO DE SERVIÇO

