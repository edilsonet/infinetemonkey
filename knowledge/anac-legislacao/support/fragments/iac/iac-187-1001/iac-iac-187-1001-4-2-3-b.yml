text: 'b) certificar-se da efetivação do Depósito Bancário Identificado, no SISCOD, referente
  ao valor

  devido pelo serviço solicitado, executando os procedimentos previstos de anotação do código
  de

  confirmação no comprovante de depósito bancário (boleta) e juntar o mesmo ao processo, quando

  possuir acesso ao MAPPER; e'
