  6

  CAPÍTULO 5 - PROCEDIMENTOS PARA EFETUAR OS DEPÓSITOS BANCÁRIOS IDENTI-

  FICADOS - GRU DEPÓSITO

  5.1 DEPÓSITOS BANCÁRIOS

  Os pagamentos dos serviços realizados pelo DAC, SERAC e EAC somente são aceitos através
  das

  GRU Depósito (Guia de Recolhimento da União - Depósito), que utilizará rotina de depósito
  co-

  mum e será utilizada para pagamentos simples, exclusivamente no Banco do Brasil. Caberá
  ao pa-

  gador informar um valor único, um CPF/CNPJ válido e um código identificador. Esses depósitos

  efetuados na Conta Única do Tesouro têm as seguintes características: Conta-Corrente nº
  170500-

  8 - Agência 4201-3 - Banco do Brasil.

  5.2 FORMAS DE DEPÓSITO

  Os depósitos bancários podem ser realizados de diversas maneiras:'
