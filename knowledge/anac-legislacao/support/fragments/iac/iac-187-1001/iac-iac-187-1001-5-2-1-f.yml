text: 'f) Nome do destinatário: Neste campo, informe apenas um dos códigos seguintes:

  12003300001220809 (para serviços de inspeção, fiscalização, taxas, emolumentos e for-

  necimentos de editais), ou 12003300001220817 (para multas), ou 12003300001107085

  (para adicional tarifário), conforme a finalidade do serviço pretendido;'
