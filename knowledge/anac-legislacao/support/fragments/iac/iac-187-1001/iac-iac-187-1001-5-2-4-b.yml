text: 'b) disponibilizar aos setores do DAC os dados estatísticos, oriundos dos emolumentos;21
  MAR 2005 IAC 187-1001

  9

  CAPÍTULO 7 - DISPOSIÇÕES FINAIS

  7.1 A realização de serviços em aeronaves públicas, conforme definição do CBA, art. 107,
  § 3º, estará isenta

  do pagamento de emolumentos.

  7.2 As aeronaves a serviço de entidades da Administração Indireta Federal, Estadual ou Municipal
  são con-

  sideradas, para os efeitos do Código Brasileiro de Aeronáutica, art. 107, § 4º, aeronaves
  privadas, não apro-

  veitando, portanto, a isenção concedida às aeronaves públicas.

  7.3 Os Chefes dos Serviços Regionais de Aviação Civil, bem como os Chefes das Divisões do
  DAC, serão

  os responsáveis pela declaração de isenção nos processos das aeronaves.

  7.4 A Tabela de Serviços Indenizáveis deverá ser atualizada, anualmente, ou sempre que houver
  expressiva

  variação de custos em um ou mais serviços, mediante propostas elaboradas pelos setores prestadores
  dos

  serviços, através do Gabinete, submetidas à aprovação do DGAC.

  7.5 Os casos de arrecadação não contemplados nesta IAC serão tratados em norma específica.

  7.6 Os casos omissos serão resolvidos pelo DGAC.21 MAR 2005 IAC 187-1001

  10

  REFERÊNCIAS BIBLIOGRÁFICAS

  1. BRASIL. Lei N° 7.565, de 19 de dezembro de 1986. Dispõe sobre o Código Brasileiro de
  Aeronáuti-

  ca.

  2. BRASIL Departamento de Aviação Civil. Elaboração e Controle de Publicações do DAC. Rio
  de

  Janeiro: DAC, 2003. (IAC 0001-0100, de 24/11/2003).'
