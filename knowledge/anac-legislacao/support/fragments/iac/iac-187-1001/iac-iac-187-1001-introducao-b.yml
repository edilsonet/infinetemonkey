text: 'b) Serviços que correspondam a interesses muito específicos de empresas ou de pessoas
  físicas por a-

  tenderem a objetivos empresariais ou pessoais.

  OBSERVAÇÕES:

  i. caberá ao beneficiário direto realizar e comprovar a indenização referente àquele serviço
  por ele

  solicitado e que lhe será prestado; e

  ii. a arrecadação advinda de cobrança dos serviços prestados, de que trata esta IAC, será
  revertida

  em aumento dos padrões de qualidade e eficiência dos serviços prestados pelo DAC.21 MAR
  2005 IAC 187-1001

  3

  CAPÍTULO 3 - DEFINIÇÕES

  3.1 ASSAE - Assessoria de Assuntos Especiais

  Tem por atribuição a gerência do SISCOD (Sistema utilizado na validação dos comprovantes
  de depó-

  sitos bancários, apresentados pelos usuários, quando da solicitação dos serviços).

  3.2 SERAC - Serviço Regional de Aviação Civil

  Tem por finalidade executar diretamente ou assegurar a execução das atividades relacionadas
  com a

  Aviação Civil dentro de sua área de jurisdição dos COMAR.

  3.3 SAC - Seção de Aviação Civil

  Diretamente subordinada ao SERAC, tem como atribuições, fiscalizar o correto funcionamento
  das ope-

  rações, verificar os documentos legais das aeronaves e seus tripulantes, bem como, prestar
  a devida as-

  sistência aos usuários do transporte aéreo em termos de facilitação e segurança.

  3.4 USUÁRIO

  Pessoa física ou jurídica que requeira algum tipo de serviço ao DAC

  3.5 RDBI - Recibo de Depósito Bancário Identificado

  Documento comprobatório do depósito efetuado pelo usuário, referente ao serviço solicitado,
  cujos pro-

  cedimentos encontram-se no Capítulo 5, desta IAC.

  3.6 TABELA DE SERVIÇOS INDENIZÁVEIS'
