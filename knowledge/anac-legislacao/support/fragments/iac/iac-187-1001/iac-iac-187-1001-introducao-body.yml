  1

  CAPÍTULO 1 - DISPOSIÇÕES PRELIMINARES

  1.1 FINALIDADE

  Estabelecer normas e procedimentos para cobrança de serviços de natureza específica, prestados
  pelo

  Departamento de Aviação Civil e Organizações subordinadas às empresas de serviços aéreos
  privados,

  empresas de serviços aéreos públicos, empresas de serviços auxiliares, empresas da indústria
  aeronáuti-

  ca e às pessoas físicas.

  1.2 FUNDAMENTO

  Conforme o que preceituam o artigo 1º, o artigo 2º e seu inciso VII e o artigo 3º da Lei
  nº 5.989, de

  17 de dezembro de 1973, que dispõe sobre o Fundo Aeroviário, e o previsto na Portaria nº

  075/GM5, de 17 de janeiro de 1985, que autoriza o Departamento de Aviação Civil a cobrar
  emo-

  lumentos relativos a custos de serviços.

  1.3 APROVAÇÃO

  Aprovada pela Portaria No 225/DGAC, de 17 de março de 2005.

  1.4 DATA DE EFETIVAÇÃO

  21/03/2005.

  1.5 DISPONIBILIZAÇÃO

  D - EA - EN - EE - HM - IA - IF - SA - SE - SR - TA - X - INTERNET.

  1.6 CANCELAMENTO

  IAC Nº 0010, de 03/06/2002.21 MAR 2005 IAC 187-1001

  2

  CAPÍTULO 2 - NATUREZA DOS SERVIÇOS

  2.1 Do rol de serviços prestados às pessoas físicas e jurídicas pelo Departamento de Aviação
  Civil, no de-

  sempenho de suas atribuições institucionais, destacam-se dois aspectos distintos quanto
  à natureza de

