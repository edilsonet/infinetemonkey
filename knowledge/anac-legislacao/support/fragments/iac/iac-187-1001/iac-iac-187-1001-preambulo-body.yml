text: 'REPÚBLICA FEDERATIVA DO BRASIL

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  GABINETE

  INSTRUÇÃO DE AVIAÇÃO CIVIL - NORMATIVA

  COBRANÇA DE SERVIÇOS PRESTADOS PELO

  DEPARTAMENTO DE AVIAÇÃO CIVIL E ORGANIZAÇÕES

  SUBORDINADAS

  21 MAR 2005I

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA DAC Nº 225/DGAC, DE 17 DE MARÇO DE 2005.

  Aprova a IAC que estabelece normas e procedimentos pa-

  ra a cobrança dos serviços prestados pelo DAC.

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, de acordo

  com o que preceituam o Art. 1º, o Art. 2 e seu inciso VII e o Art. 3º da Lei nº 5.989, de
  17 de dezembro

  de 1973, que dispõe sobre o Fundo Aeroviário, e conforme o previsto na Portaria nº 075/GM5,
  de 17 de

  janeiro de 1985, que autoriza o Departamento de Aviação Civil a cobrar emolumentos relativos
  a custos

  de serviços, e considerando a necessidade de atualizar os dados relativos aos pagamentos
  dos serviços

  prestados pelo Departamento de Aviação Civil, pelo Instituto de Aviação Civil e Serviços
  Aéreos Regi-

  onais de Aviação Civil, resolve:

  Art. 1º Seja efetivada a IAC abaixo discriminada:

  Título: Cobrança de Serviços Prestados pelo Departamento de Aviação Civil e Organi-

  zações Subordinadas

  Art. 2º Revogam-se a Portaria n° 601/DGAC. De 03 de junho de 2002, publicada no Diá-

  rio Oficial da União n° 108, de 07 de junho de 2002, que aprovou a IAC 0010, e a Portaria
  n°

  1210/DGAC, de 29 de novembro de 2004, publicada no Diário Oficial da União n° 237, de 10
  de de-

  zembro de 2004.

  Art 3° Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Maj Brig Ar JORGE GODINHO BARRETO NERY

  Diretor-Geral do Departamento de Aviação Civil

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO, N° 54, S/1, P.33, DE 21 DE MARÇO DE 2005.II'
