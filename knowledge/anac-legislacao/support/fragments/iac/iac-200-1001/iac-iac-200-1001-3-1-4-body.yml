title: Essas informações serão confidenciais, devendo ser utilizadas pela Empresa Aérea não
text: '3.1.4 Essas informações serão confidenciais, devendo ser utilizadas pela Empresa Aérea
  não

  somente em caso de acidente aeronáutico, como também em benefício do passageiro no caso
  de

  uma emergência pessoal, sendo vedado o uso das mesmas para quaisquer outros propósitos.'
