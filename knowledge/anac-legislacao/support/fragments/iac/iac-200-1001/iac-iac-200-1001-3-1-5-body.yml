text: '3.1.5 Após a Empresa Aérea tomar conhecimento de um acidente aeronáutico, envolvendo
  uma

  de suas aeronaves, deverá confeccionar a lista reconciliada dos passageiros e tripulantes
  a bordo da

  aeronave acidentada, no prazo de três horas, para seu próprio uso e para a Autoridade Aeronáutica,

  caso esta a solicite.

  3.2. ADMINISTRAÇÕES AEROPORTUÁRIAS

  As Administrações Aeroportuárias devem se utilizar de todos os meios possíveis para

  apoiar as Empresas Aéreas na coleta das informações de contato de emergência dos passageiros,

  conforme o item 3.1 desta Instrução.

  4 PLANO DE ASSISTÊNCIA ÀS VÍTIMAS DE ACIDENTE AERONÁUTICO E APOIO

  A SEUS FAMILIARES

  4.1 As Empresas Aéreas nacionais e estrangeiras que exploram transporte aéreo público no

  Brasil deverão elaborar seus respectivos Planos Corporativos de Assistência às Vítimas de
  Acidente

  Aeronáutico e Apoio a seus Familiares onde serão estabelecidas as ações de sua responsabilidade

  para prover assistência, serviços e informações às vítimas e as medidas de apoio a seus
  familiares.2005 IAC 200-1001

  3

  4.2 Cada base operada pela Empresa Aérea deverá ter seu Plano Local de Assistência às

  Vítimas de Acidente Aeronáutico e Apoio a seus Familiares, contendo informações e recursos

  específicos relativos à localidade em que estiver estabelecida. O conteúdo do Plano Local
  deverá

  estar baseado nas diretrizes estabelecidas no Plano Corporativo de Assistência Familiar
  da Empresa

  Aérea, devendo nele constar, no mínimo:'
