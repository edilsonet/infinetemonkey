text: 'a) preservação da lista dos passageiros embarcados, em caráter confidencial, até a

  divulgação para o público. A lista dos passageiros a bordo só poderá ser divulgada após

  a notificação aos familiares, ficando a critério da Empresa Aérea fazer a divulgação

  parcial, mediante o andamento das notificações;'
