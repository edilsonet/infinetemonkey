text: 'e) provisão de segurança e controle de acesso nos centros ativados.

  4.5 O Plano Local de Assistência às Vítimas de Acidente Aeronáutico e Apoio a seus

  Familiares deverá estar disponível nas respectivas bases e em local de fácil acesso, havendo
  a

  necessidade de confecção de, pelo menos, uma cópia impressa, que deverá ser do conhecimento
  de

  todos os seus funcionários.

  4.6 Este Plano deverá ser atualizado sempre que houver qualquer alteração, indicando a data

  desta revisão.2005 IAC 200-1001

  5

  5 DISPOSIÇÕES FINAIS

  5.1 As Empresas Aéreas deverão prover treinamento do presente Plano para as equipes de suas

  bases, conforme o previsto nos seus manuais de procedimentos, inclusive com a realização
  de

  simulações.

  5.2 As Empresas Aéreas devem coordenar, juntos aos órgãos e empresas de apoio, as suas

  participações nos Planos Locais de Assistência às Vítimas de Acidente Aeronáutico e Apoio
  a seus

  Familiares.

  5.3 A aplicação das assistências previstas nesta IAC se encerrará após a efetivação de todos
  os

  trâmites de atendimento às vítimas, fatais ou não, do apoio aos seus familiares e a realização
  das

  cerimônias fúnebres;

  5.4 O Plano de Assistência às Vítimas de Acidente Aeronáutico e Apoio a seus Familiares

  poderá fazer parte do Plano Corporativo de Resposta a Emergências das Empresas Aéreas.

  5.5 Empresas Aéreas que operem vôos com código compartilhado deverão conhecer seus

  planos mutuamente e coordenar ações conjuntas em caso de acidente aeronáutico.

  5.6 As Empresas Aéreas deverão apresentar ao DAC seus Planos Corporativos de Assistência

  às Vítimas de Acidente Aeronáutico e Apoio a seus Familiares, nos moldes da presente IAC,
  até

  180 (cento e oitenta) dias contados a partir da data de publicação da presente Instrução.

  5.7 Os casos não previstos nesta IAC serão submetidos à apreciação do Chefe do SSA.2005
  IAC 200-1001

  6

  REFERÊNCIAS BIBLIOGRÁFICAS

  1. BRASIL. Decreto 65.144, de 12 de setembro de 1969. Institui o Sistema de Aviação Civil
  do

  Ministério da Aeronáutica e dá outras providências. Diário Oficial [da República

  Federativa do Brasil], Brasília, 1969.

  2. ______. Anexo 13 à Convenção de Aviação Civil Internacional da OACI.

  3. ______. Circular OACI Nº 285-AN/166 de 2001 - Orientação sobre Assistência às Vítimas
  de

  Acidente de Aviação e seus Familiares.

  4. ______. Portaria nº 18/DGAC, de 12 Jan. 00 - Aprova os procedimentos para obtenção de

  informações de passageiros embarcados em aeronaves nacionais e estrangeiras, explorando

  transporte aéreo público.

  5. ______. Portaria nº 19/DGAC de 12 Jan. 00 - Aprova os procedimentos para a elaboração
  do

  Plano de Assistência aos familiares das Vítimas de Desastre Aéreo.

  6. ______ . NSMA 3-1 de 22 Fev. 99 - Conceituação de Vocábulos, expressões e siglas de uso
  no

  SIPAER.

  7. ______ . NSMA 3-5 de 30 Jan. 96 - Comunicação de Acidentes e de Incidentes Aeronáuticos.

  8. ______ . NSMA 3-7 de 30 Jan. 96 - Responsabilidades dos Operadores de Aeronaves em Caso

  de Acidente e de Acidente Aeronáutico.'
