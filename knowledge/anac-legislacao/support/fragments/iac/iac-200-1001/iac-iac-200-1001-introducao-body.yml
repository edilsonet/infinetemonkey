  1

  1 DISPOSIÇÕES PRELIMINARES

  1.1 FINALIDADE

  Estabelecer as diretrizes para a elaboração do Plano de Assistência às Vítimas de Acidente

  Aeronáutico e Apoio a seus Familiares.

  1.2 FUNDAMENTO

  Decreto nº 65.144, de 12/09/69, que institui o Sistema de Aviação Civil do Ministério da

  Aeronáutica e a Portaria nº 453/GM5, de 02/08/91, que reformula o Sistema de Segurança de
  vôo.

  1.3 APROVAÇÃO

  Aprovada pela Portaria nº 706 /DGAC, de 22 de julho de 2005.

  1.4 DISPONIBILIZAÇÃO

  D - SR - IA - IF - SA - TD - INTERNET

  1.5 CORRELAÇÕES

  CIRCULAR OACI 285-AN/166.

  1.6 CANCELAMENTO

  A Portaria n.º 706 /DGAC, de 22 de julho de 2005, que aprova esta IAC 200-1001, revoga

  as Portarias nº 18/DGAC, de 25 de fevereiro de 2000 e a Portaria nº 19/DGAC, de 16 de março
  de

  2000.2005 IAC 200-1001

  2

  2 GLOSSÁRIO

  As definições dos termos técnicos utilizados nesta IAC estão disponíveis para consulta na

  MMA 58-1 Glossário de Termos Técnicos de Aviação Civil, de 20 Set. 1989.

  3 INFORMAÇÕES DOS PASSAGEIROS EMBARCADOS

  3.1 EMPRESAS AÉREAS

  As Empresas Aéreas nacionais e estrangeiras que exploram transporte aéreo público no

  Brasil deverão solicitar de cada passageiro embarcado, nos vôos domésticos e nos internacionais,
  de

  e para o território brasileiro, o seu nome completo por extenso e em ordem direta e o nome
  de uma

  pessoa, que não esteja a bordo, com telefone para contato em caso de emergência,

  preferencialmente de um membro da família.'
