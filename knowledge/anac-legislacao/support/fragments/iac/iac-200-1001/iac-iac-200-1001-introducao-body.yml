title: INTRODUÇÃO
text: 'INTRODUÇÃO

  A ocorrência de um acidente aeronáutico pode provocar uma tragédia de grandes proporções,
  sendo

  reconhecida a necessidade de assistência às vítimas e Apoio a seus familiares. Este documento

  estabelece as ações básicas sob a responsabilidade das Empresas Aéreas nacionais e estrangeiras

  que exploram transporte público de passageiros no Brasil, para prover tal assistência e
  gerenciar os

  serviços que devem se tornar imediatamente disponíveis às vítimas e as medidas de apoio
  a seus

  familiares.

  Diante dos transtornos causados pelo acidente aeronáutico, cabe à Empresa Aérea de transporte

  aéreo público a importante tarefa de informar sobre os passageiros e os tripulantes a bordo,

  responder aos questionamentos dos seus familiares, procurando atender às suas necessidades

  imediatas.

  O Plano de ação, a ser elaborado pelas Empresas Aéreas, deverá ser norteado pelas idéias
  básicas

  contidas nesta IAC, a qual foi formulada com base nas orientações da Circular OACI nº 285-

  AN/166, visando padronizar os procedimentos a serem adotados no caso de acidente aeronáutico.2005
