  I

  MINISTÉRIO DA DEFESA

  COMANDO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  PORTARIA No 706/DGAC, DE 22 DE JULHO DE 2005.

  Aprova a Instrução de Aviação Civil - IAC que trata

  de Assistência às Vítimas de Acidente Aeronáutico e

  Apoio a seus Familiares.

  O DIRETOR-GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, com base no Decreto No 65.144, de

  12 setembro de 1969, que institui o Sistema de Aviação Civil do Ministério da Aeronáutica,
  e tendo em vista o disposto

  na Portaria No 453/GM-5, de 02 de agosto de 1991, que reformula o Sistema de Segurança de
  Vôo da Aviação Civil,

  resolve:

  Art. 1o Seja efetivada a IAC abaixo discriminada:

  Título: Plano de Assistência às Vítimas de Acidente Aeronáutico e Apoio a seus Familiares.

  Art. 2o Esta Portaria entra em vigor na data de sua publicação no Diário Oficial da União.

  Art. 3o Revogam-se as Portarias nº 18/DGAC, publicada no DOU nº 40, de 25 de fevereiro de
  2000 e a Portaria nº

  19/DGAC, publicada no DOU nº 52, de 16 de março de 2000.

  Maj Brig Ar JORGE GODINHO BARRETO NERY

  Diretor-Geral

  PUBLICADA NO DIÁRIO OFICIAL DA UNIÃO Nº 150, DE 05 DE AGOSTO DE 20052005 IAC 200-1001

  II'
