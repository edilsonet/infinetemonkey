  1 9 4 4 , e o a r t i g o 2 4 , d a L e i n º

  5 . 1 0 7 , d e 1 3 d e s e t e m b r o d e 1 9 6 6 ,

  a l t e r a d a p e l o D e c r e t o - L e i n º 2 0 , d e

  1 4 d e s e t e m b r o d e 1 9 6 6 .

  O Presidente da República, usando das atribuições que lhe confere o artigo 55,

  item I e II da Constituição, decreta:

  Art. 1º - As contribuições de que tratam o artigo 1º do Decreto-Lei nº 6.246, de 05

  de fevereiro de 1944, e o artigo 24, da Lei nº 5.107, de 13 de setembro de 1966, na

  remuneração decorrente do Decreto-Lei nº 20, de 14 de setembro de 1966, arrecadadas das

  empresas privadas, públicas, de economia mista e autárquicas, quer federais, estaduais ou

  municipais, de transporte aéreo regular, não regular; de táxi aéreo e de serviços aéreos

  especializados; de telecomunicações aeronáuticas, de implantação, administração, operação
  e

  exploração da infra-estrutura aeroportuária, e de serviços auxiliares; de fabricação, reparos
  e

  manutenção, ou de representação, de aeronaves, suas peças e acessórios, e de

  equipamentos aeronáuticos, serão destinados à aplicação nas atividades ligadas ao ensino

  profissional aeronáutico de tripulantes, técnicos e especialistas civis, para os serviços
  de apoio

  e proteção à navegação aérea, a infraestrutura aeronáutica e a Aviação Civil em geral, a
  cargo

  do Ministério da Aeronáutica, de acordo com os incisos III e IV do parágrafo único, do Artigo
  63

  do Decreto-Lei nº 200, de 25 de fevereiro de 1967, alterado pelos Decretos-Leis nº 900,
  de 29

  de setembro de 1969 e 991 de 21 de outubro de 1969.

  Art. 2º - O produto das contribuições, de que trata o artigo anterior, efetivamente

  arrecadado, será depositado pelo Instituto Nacional de Previdência Social, no Banco do Brasil

  S.A., para

  A1-1IAC 0201-1296

  7'
