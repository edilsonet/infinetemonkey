  I - GENERALIDADES

  1.1 - A SAC, diretamente subordinada ao Chefe do SERAC, tem por atribuição

  básica o trato dos assuntos de Aviação Civil nos aeroportos onde for

  estabelecida.

  1.2. - Toda SAC terá um representante perante o SERAC. Nos casos de

  Administração Indireta ou de Órgão Conveniado, o representante será

  indicado por estes órgãos e notificado ao SERAC.

  1.3. - Não havendo pessoa com curso ou estágio específico de Fiscal de Aviação

  Civil, o SERAC, em caráter excepcional, designará um responsável para

  desempenhar tais funções.

  II - ESTRUTURA

  2.1. - A SAC terá um responsável, designado pelo Chefe do SERAC, que

  responderá pelos assuntos de Aviação Civil e pela parte administrativa.

  2.2. - Em princípio, o responsável pela SAC será o militar mais antigo ou o

  indicado pelo Chefe do SERAC.

  III - ATRIBUIÇÕES

  3.1 - A SAC tem atribuições:

  1 - A representação do DAC/SERAC junto à administração aeroportuária;

  2 - A fiscalização de aeronaves e aeronautas dentro da sua área de atuação, de

  acordo com a legislação de Aviação Civil em vigor;IAC 2306 - 0790

  4

  3 - O entendimento e orientação aos usuários do Sistema de Aviação Civil;

  4 - A interdição de aeronaves por determinação do DAC/SERAC;

  5 - A liberação de aeronaves após cumpridas as exigências legais;

  6 - A comunicação ao SERAC de ocorrências relativas ao serviço;

  7 - A atualização da coletânea de publicações do Sistema;

  8 - As providências relativas ao sobrevôo de aeronaves estrangeiras; e

  9 - A participação junto as demais autoridades aeroportuárias, policiais e da

  administração municipal, nas atividades relativas ao serviço.

  3.2. - O responsável pela SAC tem por atribuições:

  1 - O controle e a coordenação das atividades da SAC;

  2 - O zelo pelo cumprimento das leis, regulamentos e normas em vigor;

  3 - As providências relativas à elaboração e a remessa ao SERAC da Escala

  de Serviço;

  4 - O encaminhamento ao SERAC do expediente administrativo, quando for o

  caso;

  5 - A remessa ao SERAC da totalidade dos Impressos de Sugestões e/ou

  Reclamações (ISR) recebidos pela SAC, bem como um extrato das

  irregularidades lançadas no livro de ocorrências, e providências tomadas;

  6 - O estabelecimento de padrões de atendimento ao público e a

  disponibilidade de formulários ISR para os usuários;

  7 - O controle dos bens sob sua guarda;IAC 2306 - 0790

  5

  8 - A manutenção atualizada da legislação e publicações referentes ao Sistema

  de Aviação Civil e dos HOTRAN e HOTREG, quando for o caso;

  9 - A liberação de aeronaves interditadas pelos códigos 2 e 5, caso o

  proprietário ou operador comprove ter satisfeito as exigências legais que

  motivaram a referida interdição; nos demais códigos, somente após liberação

  do SERAC;

  10 - O contato com o SERAC ou DAC nos casos de apreensão, detenção ou

  liberação de aeronaves por outros Órgãos;

  11 - A expedição de autorização de Sobrevôo de aeronaves estrangeiras e a

  liberação de viagens cargueiras, de traslado e serviço;

  12 - A informação junto as autoridades da Receita Federal, Polícia Federal e

  Saúde dos Portos, visando a liberação de aeronaves estrangeiras;

  13 - A liberação, quando fora do expediente do SERAC, de artigos perigosos

  e/ou controlados;

  14 - A participação nas reuniões da Administração Aeroportuária local;

  15 - A coordenação das atividades de Aviação Civil junto as demais

  autoridades aeroportuárias;

  16 - O acionamento das Polícias Federal e Civil nos casos específicos; e

  17 - A fiscalização das condições da infra-estrutura do aeródromo, para fins de

  interdição e expedição de PRÉ-NOTAM.

  3.3. - Quanto ao aspecto da Aviação, deverá fiscalizar:

  1 - A verificação da documentação das aeronaves da Aviação Geral;

  2 - A verificação de licenças e certificados dos aeronavegantes;IAC 2306 - 0790

  6

  3 - A fiscalização de aeronaves da Aviação Geral quanto a passageiros e carga

  transportadas, de acordo com o Certificado de Aeronavegabilidade;

  4 - A expedição de Autorização de Sobrevôo mediante liberação da Chefia da

  SAC e da Seção de Controle (5PL2), do DAC;

  5 - A liberação de aeronaves interditadas pelos códigos 2 e 5, caso seu

  proprietário ou operador comprove ter satisfeito as exigências legais que

  motivaram a referida interdição. Tal liberação deverá ser comunicada ao Chefe

  da SAC e ao SERAC;

  6 - O contato com a Seção de Controle (5PL2) do DAC, quando fora do horário

  de expediente, nos casos de apreensão, detenção ou liberação de aeronaves

  por outros Órgãos;

  7 - O acompanhamento do atendimento aos usuários da aviação civil na área

  aeroportuária;

  8 - O atendimento aos usuários da aviação civil na prestação de informações

  referentes ao serviço;

  9 - A fiscalização das normas e procedimentos previstos para o pátio de

  estacionamento;

  10 - A informação às autoridades da Polícia Federal, Receita Federal e Saúde

  dos Portos, visando a liberação de aeronaves estrangeiras;

  11 - A liberação, na ausência da Chefia, de artigos perigosos e/ou controlados;

  e

  12 - O registro das ocorrências durante o serviço.

  IV - DISPOSIÇÕES TRANSITÓRIAS

  4.1. - Os Fiscais de Aviação Civis não possuidores de curso ou estágio específico,

  deverão realizá-lo num prazo de 12 (doze) meses a partir da efetivação desta

  IAC. Este cursoIAC 2306 - 0790

  7

  ou estágio poderá ser ministrado pelo próprio SERAC, com coordenação do

  Instituto de Aviação Civil.

  4.2. - Os Fiscais de Aviação Civil somente poderão assumir suas funções após

  liberados pelo respectivo SERAC ao término do curso ou estágio específico.

  V - DISPOSIÇÕES FINAIS

  5.1. - O titular da função de Fiscal de Aviação Civil será identificado pelo porte da

  Carteira de Fiscal de Aviação Civil descrita no anexo, a qual lhe conferirá as

  prerrogativas necessárias à fiscalização e ao livre trânsito nas dependências

  aeroportuárias relacionadas ao Sistema de Aviação Civil, sendo excluído o

  seu aceso às dependências sob controle de outros Órgãos Federais.

  5.2. - Os casos omissos serão resolvidos pela Chefia do SERAC.IAC 2306 - 0790

