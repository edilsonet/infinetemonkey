title: preambulo(a)
text: 'a) Tripulação Mínima / Simples

  (1) Aeronaves que requeiram qualificações de Classe.

  - Dois pilotos qualificados a nível de piloto em comando para a Classe de Multimotores,

  titulares da qualificação IFR, sendo um designado como Comandante; ou

  - Dois pilotos qualificados a nível de piloto em comando para a classe de Multimotores,

  sendo um titular da qualificação IFR e Instrutor de Pilotagem Elementar, designado como

  Comandante, e o outro titular, no mínimo, de Autorização Provisória IFR.

  NOTA:

  - Para que o titular de Autorização receba a Instrução IFR, o táxi aéreo deverá solicitar

  autorização para ministrar tal Instrução, ficando a permissão a critério do STE.

  (2) Aeronaves que requeiram qualificação de Tipo.

  - Um piloto qualificado ao nível de piloto em comando no tipo, titular da qualificação IFR,

  designado como Comandante.

  - Um piloto qualificado ao nível de piloto em comando ou co-piloto, titular da qualificação

  IFR.

  (3) A utilização de tripulação Composta e de Revezamento, em aeronaves pertencentes à

  empresas de Táxi Aéreo, será objeto de autorização especial por parte do DAC, que julgará

  cada caso separadamente. Nestes casos serão observados os mesmos critérios adotados no

  Título I item 10.

  (4) Não será permitida a operação IFR para aeronaves monomotoras utilizadas por empresas

  de Táxi Aéreo.

  (5) Helicópteros operando segundo regras de Vôo Visual (VFR).

  a - Tripulação Mínima / Simples - A constante como mínima no respectivo Certificado de

  Aeronavegabilidade, devendo o(s) piloto(s) ser(em) qualificado(s) no tipo.

  NOTA:IAC 3206

  - Para os helicópteros que operam nos serviços de Táxi Aéreo, transportando mais de doze

  passageiros, serão exigidos dois Pilotos, independente do que constar como mínimo no seu

  Certificado de Aeronavegabilidade. Um Piloto deverá estar qualificado no Tipo, ao nível

  de piloto em Comando, e designado Comandante, mais um Piloto com qualificação mínima

  de co-piloto.

  (6) Helicópteros operando segundo as regras de vôo por Instrumentos (IFR)

  a - tripulação Mínima / Simples - Um piloto qualificado ao nível de piloto em comando no

  Tipo, titular da qualificação IFRH.

  - um piloto qualificado ao nível de piloto em comando ou co-piloto no tipo, titular da

  qualificação IFRH.

  (7) Para helicópteros operados por empresa de Táxi Aéreo, transportando mais de vinte

  passageiros, será exigido a presença de um Comissário.

  IV - COMPOSIÇÃO DE TRIPULAÇÃO PARA A AVIAÇÃO GERAL

  01 - O termo Aviação Geral engloba as seguintes atividades:

  - Serviço Aéreo Especializado (SE);

  - Serviço Administrativo (SAD) - Municipal, Estadual e Federal;

  - Serviço para Indústria e/ou Comércio (SIC);

  - Transporte Privado (TPR);

  - Instrução;

  - Recreio (R)

  02 - Aviões operando segundo as regras de Vôo Visual (VFR)

  a - Tripulação Mínima / Simples - A constante como mínima no seu Certificado de

  Aeronavegabilidade.

  03 - Aviões operando segundo as regras de Vôo por Instrumentos (IFR).

  a - Aviões que requeiram qualificação de Classe (mono e multi) equipados com piloto

  automático.

  Tripulação Mínima / SimplesIAC 3206

  - Um piloto qualificado ao nível de piloto em comando na Classe, titular da qualificação

  IFR.

  b - Aviões que requeiram qualificação de Classe e que não estejam equipados com piloto

  automático.

  Tripulação Mínima / Simples

  - Um piloto qualificado ao nível de piloto em comando na Classe, titular da qualificação

  IFR, designado como Comandante; ou

  - Dois pilotos qualificados a nível de piloto em comando para a Classe de multimotores,

  sendo um titular da qualificação IFR e Instrutor de Pilotagem Elementar, designado como

  Comandante, e o outro titular no mínimo de autorização Provisória IFR.

  NOTA:

  - Para que o titular de Autorização receba a Instrução IFR, o explorador da aeronave deverá

  solicitar autorização para ministrar tal Instrução, ficando a permissão à critério do STE.

  c- Aviões que requeiram qualificação de Tipo.

  Tripulação Mínima / Simples

  - Um piloto qualificado ao nível de piloto em comando no Tipo, titular da qualificação IFR

  designado como Comandante;

  - Um piloto qualificado ao nível de piloto em comando ou co-piloto no Tipo, titular da

  qualificação IFR.

  OBS: Este item não se aplica às aeronaves empregadas na categoria Privada Transporte

  Público, para as quais será observado o disposto no “TYPE CERTIFICATE”.

  04 - A utilização de tripulação Composta e de revezamento em aeronaves da Aviação Geral,
  será

  objeto de autorização especial por parte do DAC que julgará cada caso separadamente. Nestes

  casos serão observados os mesmos critérios adotados no Título I item 10.

  05 - A composição de tripulação, para os helicópteros que operam na Aviação Geral, seguirá
  os

  mesmos critérios adotados no Título III itens 5, 6 e 7.

  V - DISPOSIÇÔES FINAIS

  01 - O termo Transporte Aéreo Regular engloba o Transporte Aéreo Regional.IAC 3206

  02 - Nos vôos de instrução, sem passageiros, serão exigidas apenas as qualificações de Piloto

  designado como Comandante e Instrutor.

  03 - Independente da validade dos Certificados de Habilitação Técnica, será responsabilidade
  do

  operador ou proprietário evitar que vôos de transporte de passageiros, mediante remuneração,

  sejam executados com tripulação de apenas um piloto, se este não houver realizado, no

  mínimo, quatro decolagens e pousos no tipo de aeronave utilizada, nos últimos sessenta dias.

  04 - Aplica-se o disposto no item número três, anterior, ao Comandante das aeronaves operadas
  por

  mais de um piloto.

  05 - Os casos omissos serão resolvidos pelo Chefe do Subdepartamento Técnico.'
