text: 'TÍTULO: COMPOSIÇÃO DE TRIPULAÇÃO.

  MINISTÉRIO DA AERONÁUTICA

  DEPARTAMENTO DE AVIAÇÃO CIVIL

  SUBDEPARTAMENTO TÉCNICO

  IAC - 3206 - 0387 NOSER A-C-D-ET-SA-SE-SR-

  TA-X20 Fev 87 01 Mar 87

  I N T R O D U Ç Ã O

  I - A presente IAC tem por finalidade definir a composição das tripulações, emprega

  das nas aeronaves civis brasileiras, identificando as qualificações mínimas a que

  devam atender seus integrantes.

  II - Seu conteúdo inclui, igualmente, o atendimento dos aspectos técnicos, relativos

  ao exercício funcional, regidos pela regulamentação da profissão do Aeronauta

  e daqueles exercidos não remuneradamente.

  III - É expedida com fundamento no que estabelecem os artigos 2º e 3º do Decreto

  nº 65.144 de 12 de Set 69 que instituiu o Sistema de Aviação Civil e a Lei 7.183

  de 05 Abr 84, que regula o exercício da profissão do Aeronauta no Brasil.

  IV - A presente IAC é composta de 12 páginas e substitui a de mesmo número, efe-

  tivada em 28 Fev 85, que deverá ser considerada sem efeito.

  TEN BRIG DO AR - Waldir Pinto da Fonseca

  Diretor Geral

  MAJ BRIG DO AR - Fernando Luiz V. Seroa da Motta

  Chefe do Subdepartamento Técnico

  1

  SÍMBOLO DATA

  EXPEDIÇÃO EFETIVAÇÃO

  CATEGORIA DISTRIBUIÇÃOIAC 3206 - 0387

  l - GENERALIDADES

  01 - Tripulante e Tripulação são denominações definidas na Lei 7.183 de 05

  de abril 84, Capítulo I, Seção I artigos 4º e 5º, Seção II artigo 8º, respectivamente.

  02 - Uma tripulação poderá ser: MINÍMA, SIMPLES, COMPOSTA

  e de REVEZAMENTO.

  03 - Tripulação Mínima é a determinada na forma de certificação do tipo da aeronave e

  a constante do seu manual de operação, homologado pelo DAC, sendo permitida

  sua utilização em vôos locais de instrução, de experiência, de vistoria e traslado.

  04 - Tripulação Simples é a constituída basicamente de uma tripulação

  mínima acrescida, quando for o caso, dos tripulantes necessários à realização do vôo.

  05 - Tripulação Composta e de Revezamento são constituídas, basicamente, de

  uma tripulação simples, acrescidas de mais tripulantes, cujos

  números serão estabelecidos no título dois desta NOSER.

  06 - Uma tripulação será composta ou de revezamento, conforme o caso, em relação

  aos seguintes tripulantes: COMANDANTE, CO-PILOTO, MECÂNICO DE

  VÔO, NAVEGADOR, RADIOPERADOR DE VÔO e COMISSÁRIO.

  07 - O DAC, considerando o Art. 14 da Seção II, Capítulo I, da Lei 7.183 de

  05 Abr 84, poderá determinar a composição da tripulação ou as

  modificações que se tornarem necessárias.

  08 - As tripulações composta ou de revezamento só poderão ser empregadas

  em vôos internacionais e nas seguintes hipóteses:

  a - mediante programação;

  2IAC 3206IAC 3206 - 0387

  b - para atender a atrasos ocasionados por condições meteorológicas

  ou por trabalhos de manutenção; e

  c - em situações excepcionais, mediante autorização do DAC.

  09 - Uma tripulação composta poderá ser utilizada em vôos domésticos, para atender a

  atrasos ocasionados por condições meteorológicas desfavoráveis

  ou por trabalhos de manutenção.

  10 - Um tipo de tripulação só poderá ser transformado na origem do vôo e até o limite

  de três horas, contadas a partir da apresentação da tripulação,

  previamente escalada.

  11 - A contagem de tempo para o limite da jornada será a partir da

  hora da apresentação da tripulação original ou de tripulante de

  reforço, sendo considerado o que ocorrer primeiro.

  II - COMPOSIÇÃO DE TRIPULAÇÃO NO TRANSPORTE

  AÉREO REGULAR

  01 - Para os pilotos que operam aeronaves engajadas no Transporte Aéreo

  Regular, será exigido como requisito mínimo à qualificação de IFR, além

  da de tipo, em nível apropriado.

  02 - Os pilotos deverão ser titulares da licença de Piloto de Linha Aérea, Comercial

  Comercial Sênior ou Comercial, em função das atribuições a serem

  cumpridas e das conseqüentes prerrogativas, definidas no Anexo I, 7ª. Edição, da OACI.

  03 - Os mecânicos de Vôo, Navegadores, Radioperadores e Comissários

  deverão ser titulares das respectivas licenças, acompanhadas

  das qualificações necessárias ao desempenho de suas prerrogativas.

  04 - Será exigida a presença de um Navegador nas rotas com etapas

  superiores a mil km, sem sobrevôo de auxílios à navegação. Tal exigência,

  no entanto, poderá ser dispensada,

  3IAC 3206

  a critério do DAC, que fixará os critérios e requisitos para sua realização, após análise
  da rota,

  infra-estrutura de apoio e equipamentos disponíveis a bordo da aeronave.

  05 - É proibido o exercício simultâneo de mais de uma função a bordo da aeronave, mesmo
  que o

  tripulante seja titular das licenças relativas às mesmas.

  06 - Composição de Tripulação - Pilotos, Mecânicos de Vôo, Navegadores e Radioperadores.

  a - Mínima / Simples - um piloto qualificado a nível de Piloto em Comando, designado como

  Comandante; um Piloto qualificado como Co-Piloto; um Mecânico de Vôo para aeronaves

  cujos Certificados de Aeronavegabilidade assim o exige; um Radioperador de Vôo e/ou um

  Navegador, quando requerido pelo DAC, em função do estabelecido em 04.

  b - Composta - Dois pilotos qualificados ao nível de Piloto em Comando, um dos quais

  designados como Comandante; um piloto qualificado como Co-Piloto; dois Mecânicos de

  Vôo, nos aviões para os quais for requerida a função na forma de seu Certificado de

  Aeronavegabilidade; um Radioperador de Vôo e/ou um Navegador, quando requerido pelo

  DAC, em função do estabelecido em 04.

  NOTA:

  É o Operador obrigado a assegurar poltronas reclináveis para os tripulantes acrescidos à

  tripulação simples (Piloto, M/V, NAV, ROV), incluído o Inspetor do DAC, quando

  designado em missão, para o mesmo vôo, em número tal que permita o descanso dos

  tripulantes que não estejam no turno de trabalho.

  c - De Revezamento - Dois pilotos qualificados ao nível de Piloto em Comando, um dos quais,

  designado como Comandante; Dois pilotos qualificados a nível de Co-Piloto; Dois

  Mecânicos de Vôo, nos aviões para os quais for requerida esta função, na forma do seu

  Manual de Operações, aprovado pelo DAC; Dois Radioperadores de Vôo e/ou Dois

  Navegadores, quando requeridos pelo DAC, de acordo com o estabelecido em 04.

  NOTA:

  É o Operador obrigado a assegurar acomodações para o repouso horizontal dos tripulantes,

  acrescidos à tripulação simples (Piloto, M/V, NAV, ROV), assim como poltrona reclinável

  para o Inspetor do DAC, quando designado em missão, para o mesmo vôo, em número tal

  que permita o descanso dos tripulantes que não estejam no turno de trabalho.

  07 - Composição de Tripulação - Comissários

  a - O número de Comissários será estabelecido em função dos seguintes fatores:

  (1) - Segurança dos passageiros;

  (2) - Padrão de atendimento a bordo; eIAC 3206

  (3) - Duração da jornada.

  Em atendimento ao item (1), segurança dos passageiros, fica estabelecido que o número

  mínimo de comissários será correspondente ao número de saídas de emergência, ao nível do
  piso, de

  sorte a permitir a evacuação de todos os passageiros da aeronave no menor tempo possível.

  NOTA:

  Para as aeronaves FH-227 e F-27, operadas no Transporte Aéreo Regional, em observação a

  este critério, a porta principal de passageiros e a porta de emergência localizada no lado

  direito da fuselagem, em frente à porta principal, serão consideradas como única saída de

  emergência.

  Para as aeronaves EMB-170 e EMB-190, em observação a esse critério, a porta principal de

  passageiros e a porta de emergência localizada no lado direito da fuselagem, em frente à

  porta principal, serão consideradas como uma única saída de emergência, em razão do que

  essas aeronaves serão tidas como possuindo 2 portas ao nível do assoalho. (Redação dada

  pela Resolução ANAC N° 59, de 05 de novembro de 2008)

  Em atendimento aos itens (2) e (3), Padrão de Atendimento a bordo e duração da jornada,

