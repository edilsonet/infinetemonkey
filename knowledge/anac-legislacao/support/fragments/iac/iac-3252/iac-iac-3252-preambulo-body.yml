  (\x03'$7$: Preencher com o nome da cidade e a data em que for preenchido.\n,,,\x03±\x03\
  ',6326,dÆ(6\x03),1$,6\x03\n,,,\x03\x10\x03',6326,dÆ(6\x03),1$,6\x03\x03\n\x03\n01 - As horas\
  \ de vôo realizadas pelos tripulantes, em aeronaves de outras categorias, que não\nestejam\
  \ enquadradas no item I, Título I, serão registradas apenas nas Cadernetas Individuais de\
  \ Vôo\n(CIV), em acordo com a regulamentação específica.\n02 - As horas voadas de que trata\
  \ o item 3, Título I, deverão ser relacionadas no formulário\n“Relatório de Registro Individual\
  \ de Horas de Vôo - Mensal”, separadamente, anexando-o, para fins\nde arquivo, ao utilizado\
  \ para as horas do mês a que se refere.\n03 - As horas de vôo realizadas pelos tripulantes\
  \ brasileiros, a bordo de aeronaves com marcas de\nnacionalidade e de matrícula estrangeira,\
  \ poderão ser apresentadas ao DAC, quando houver por\nobjetivo demonstrar experiência de\
  \ vôo para fins de elevação de licença para grau superior,\nconforme o disposto no RBHA\
  \ 61.\na. A Empresa, quando necessário, encaminhará ao SERAC da área de sua Sede\nou Base\
  \ um documento solicitando levantamento de experiência de seu tripulante. Para tanto ela\n\
  remeterá ao SERAC uma declaração, em papel timbrado assinada pelo diretor da Empresa ou\
  \ por\npessoa por ela autorizada, com as horas realizadas pelo referido tripulante, a partir\
  \ do dia 01 Jan 97.\nNOME P/\nEXTENSO\nASS :\n5(63216»9(/\x03\nSICRANO DE TAL\n/2&$/\x03\
  (\x03'$7$\x03\nRIO DE JANEIRO, 16/01/97IAC3252-121/135-0197\n9\nTais horas deverão ser discriminadas\
  \ de forma semelhante ao estabelecido para o Relatório de\nRegistro Individual de Horas\
  \ de Vôo - Mensal, utilizando-se as instruções de preenchimento\nconstantes do título II,\
  \ item nº 5, letras “e”, “j”, “k” e “p”, seguindo-se o seguinte exemplo:\nNOME DO TRIPULANTE:\
  \ Beltrano de Tal\nPeríodo voado: 01 jan 97 a 31 mar 97\nEquipamento: B-727\nFunção a Bordo:\
  \ CO-PILOTO Total: 65.6\nTipo de Vôo: NOTURNO Total: 16.8\nDIURNO Total: 48.8\nVFR Total:\
  \ 30.2\nIFR Total: 35.4\nTotal Geral 65.6\n(Sessenta e cinco horas e seis décimos)\n04 -\
  \ Os operadores, de que trata esta NOSER, ficam obrigados a expedir, a partir de 01 de Janeiro\n\
  de 1997, uma declaração das horas voadas por seus tripulantes, quando estes forem dispensados\n\
  da Empresa. Tais horas deverão ser discriminadas conforme o previsto no item 3 “a” deste\
  \ Título.\nFicam, também, obrigados a encaminhar ao DAC um documento fornecendo informações\
  \ sobre\nadmissão e/ou demissão de tripulante, contendo, neste último caso, o período trabalhado\
  \ pelo\nmesmo na Empresa considerada.\n05 - Cada aeronave deverá possuir um Livro de Bordo,\
  \ com numeração de páginas em ordem\ncrescente, cujo preenchimento será da responsabilidade\
  \ do comandante que deverá nele anotar:\n1 - Os nomes, os Códigos DAC dos tripulantes e\
  \ as funções a bordo;\n2 - horas “calço-a-calço” conforme o previsto no ART 28 da LEI N°\
  \ 7.183 de 05 ABR 84;\n3 - aeródromos operados;\n4 - observações quanto à manutenção da\
  \ aeronave e outras de interesse; e\n5 - assinatura do comandante.\n06 - Em caso de falência\
  \ da Empresa o liquidante ou síndico da massa falida resgatará os registros\nde horas dos\
  \ tripulantes, de que trata esta NOSER no item Nº 02 do Título I e no item\nn° 02 do seu\
  \ Título III, ficando obrigado a expedir a declaração de horas tratadas no item N° 04 deste\n\
  Título.\n07 - Os casos omissos serão resolvidos pelo Chefe do Subdepartamento Técnico do\
  \ Departamento\nde Aviação Civil.IAC3252-121/135-0197\n10"
