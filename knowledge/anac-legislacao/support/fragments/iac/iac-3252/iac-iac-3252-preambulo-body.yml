  \ Conversão de Minutos em Décimos de Hora; e\n03 - Tabela de Habilitações de Aeronautas\n\
  , 1 7 5 2 ' 8 d ≠ 2 \x03\n, - A presente Norma de Serviço (NOSER) tem por finalidade estabelecer\
  \ diretrizes\npara o “arquivamento” da documentação do registro individual de horas de vôo\
  \ dos\ntripulantes das empresas citadas no Título I, Item 01, deste regulamento.\n,, - O\
  \ presente documento é expedido com fundamento no que estabelecem os\nartigos 2º e 3º do\
  \ Decreto nº 65.144, de 12 Set 69, que instituiu o Sistema de\nAviação Civil do Ministério\
  \ da Aeronáutica.\n,,, - Esta NOSER é composta de 15 folhas e substitui a anterior, de 01\
  \ Jan 87, que\ndeverá ser considerada sem efeito. Ela é efetivada pelo Chefe do Subdepartamento\n\
  Técnico, por delegação de competência constante no item número 1 do inciso I da\nportaria\
  \ nº 433/DGAC, de 31 de outubro de 1986.\n__________________________________________________\n\
