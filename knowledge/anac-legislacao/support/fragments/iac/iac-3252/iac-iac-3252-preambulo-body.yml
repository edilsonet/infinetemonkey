  \n\x03\n,\x03\x10\x03*(1(5$/,'$'(6\x03\n\x13\x14\x03 \x10 Os registros de horas de vôo dos\
  \ tripulantes serão efetuados pelos operadores cuja\nclassificação das aeronaves, constante\
  \ do RBHA-47, seja: de Serviço de Transporte Aéreo Público\nRegular, doméstico ou internacional\
  \ (735), Serviço de Transporte Aéreo Público Não-Regular,\ndoméstico ou internacional (731);\
  \ e Serviço de Transporte Público Não-Regular - Táxi Aéreo (73;).\n127$\x03 \x14\nConsidera-se,\
  \ para efeito desta NOSER, como operador o estabelecido no Art.\n123 da Lei Nº 7565, de\
  \ 19 Dez 86 (CBAer).\n127$\x03\x15\nAs informações registradas serão de total responsabilidade\
  \ da empresa.\n\x13\x15\x03\x10 Mensalmente, os operadores, cujas aeronaves estejam enquadradas\
  \ na classificação citada no\nitem 01 deste Título, deverão arquivar em suas sedes os Relatórios\
  \ de Registro Individual de Horas\nde Vôo dos seus tripulantes realizadas a bordo de sua(s)\
  \ aeronave(s). Tal arquivamento deverá ser\nefetuado, até o décimo dia útil do mês subseqüente\
  \ ao de referência, mesmo que não tenha ocorrido\nvôo.\n127$\nO fornecimento de dados, informações\
  \ ou estatísticas inexatas ou adulteradas,\nbem como a recusa de exibição de livros documentos\
  \ estatísticos, quando requisitados pela\nfiscalização, ou quaisquer irregularidades cometidas,\
  \ caracterizará infração, com sanções\nprevistas no Código Brasileiro de Aeronáutica (CBAer),\
  \ com ênfase no seu artigo nº 299.\n\x13\x16 - As horas de vôo efetuadas por tripulantes\
  \ a bordo de aeronaves brasileiras ou estrangeiras,\npertencentes a operadores enquadrados\
  \ nesta NOSER, com quem eles não tenham vínculo\npermanente, quando em vôo de instrução,\
  \ treinamento, avaliação ou experiência, são igualmente\ncomputáveis e também deverão ser\
  \ “arquivadas”, conforme disposto no item 02, Título III.\n,,\x03\x10\x031250$6\x033$5$\x03\
