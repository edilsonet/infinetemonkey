title: CONTROLE DA PRIORIZAÇÃO PRELIMINAR
text: '2.2.1 CONTROLE DA PRIORIZAÇÃO PRELIMINAR

  O DAC/SIE analisará as propostas apresentadas pelos Governos Estaduais, efetuando o con-

  trole das Fichas de Análise de Priorização (FAP).

  Baseado nos créditos previstos para o exercício a que se refere o planejamento, bem como

  nas orientações previstas na ICA 58-37, o DAC/SIE elaborará uma proposta de priorização

  preliminar, que será submetida à apreciação do Comandante da Aeronáutica.

  Após a aprovação, pelo Comandante da Aeronáutica da Priorização Preliminar, o DAC

  informará aos Estados as propostas de empreendimentos, com recursos do PROFAA,

  incluídas no planejamento, explicitando as providências a serem tomadas, bem como as

  informações do objeto a ser executado e do custo estimado.'
