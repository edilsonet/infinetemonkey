text: '2.2.2 CONTROLE DE ELABORAÇÃO E APROVAÇÃO DO PROJETO EXECUTIVO

  No prazo máximo de 30 dias corridos do recebimento da comunicação formal da inclusão de

  um empreendimento no planejamento do PROFAA, o Estado elaborará um cronograma das

  atividades relacionadas à elaboração do projeto executivo, bem como do orçamento básico

  associado, informando ao DAC/SIE.

  Baseado nos cronogramas apresentados pelos Estados, o DAC/SIE elaborará uma planilha

  de controle, nos moldes estabelecidos no Anexo 1 desta Instrução.'
