title: Controle dos Créditos para Despesas com Investimentos
text: '2.2.3.1 Controle dos Créditos para Despesas com Investimentos

  O DAC/SIE manterá um controle, conforme Anexo 2 desta Instrução, dos créditos para

  investimentos, por Ação relativa ao PROFAA, discriminando a destinação dos créditos

  descentralizados, por COMAR e por localidade contemplada com recursos do Programa.

  As atualizações deverão ser efetuadas sempre que houver alteração no montante dos créditos

  disponibilizados ao Programa ou, ainda, quando houver a descentralização ou cancelamento

  de créditos.'
