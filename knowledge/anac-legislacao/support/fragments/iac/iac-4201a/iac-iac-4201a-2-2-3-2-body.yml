title: Controle dos Créditos para Despesas Correntes
text: '2.2.3.2 Controle dos Créditos para Despesas Correntes

  O DAC/SIE manterá um controle, conforme Anexo 3 desta Instrução, dos créditos para

  despesas correntes, por Ação relativa ao PROFAA, discriminando a destinação dos créditos

  descentralizados por COMAR e por natureza de despesa.

  As atualizações deverão ser efetuadas sempre que houver alteração no montante dos créditos

  disponibilizados ao Programa ou, ainda, quando houver a descentralização ou cancelamento

  de créditos.'
