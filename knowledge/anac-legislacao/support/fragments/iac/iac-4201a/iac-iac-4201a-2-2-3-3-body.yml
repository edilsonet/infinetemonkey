title: Controle dos Créditos em Restos a Pagar
text: '2.2.3.3 Controle dos Créditos em Restos a Pagar

  O DAC/SIE manterá um controle, conforme Anexo 4 desta Instrução, dos créditos em restos

  a pagar do exercício anterior, por Ação relativa ao PROFAA, discriminando a destinação

  dos créditos descentralizados por COMAR e por localidade contemplada com recursos do

  Programa.

  As atualizações deverão ser efetuadas sempre que houver o cancelamento de algum empe-

  nho em restos a pagar ou quando ocorrer o repasse financeiro ao Estado.'
