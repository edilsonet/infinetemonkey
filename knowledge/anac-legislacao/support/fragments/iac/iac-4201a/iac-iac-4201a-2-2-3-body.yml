text: '2.2.3 CONTROLE DOS CRÉDITOS DISPONIBILIZADOS

  Os créditos disponibilizados para o PROFAA constituem-se dos valores alocados para

  investimentos e despesas correntes na Ação de Construção de Aeroportos e Aeródromos de

  Interesse Estadual e na Ação de Reforma e Ampliação de Aeroportos e Aeródromos de In-

  teresse Estadual, parte do Programa de Desenvolvimento da Infra-Estrutura Aeroportuária.

  O DAC/SIE efetuará o controle dos créditos disponibilizados e sua aplicação, referentes:'
