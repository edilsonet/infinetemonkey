title: ELABORAÇÃO
text: '2.3.2 ELABORAÇÃO

  O Estado, com empreendimento incluído no Plano de Investimentos do PROFAA, deverá

  elaborar o Plano de Trabalho, conforme a Instrução Normativa no 1/STN, de 15 de janeiro

  de 1997 e alterações posteriores e encaminhá-lo ao COMAR.

  Em cumprimento ao que determina a Lei no 8666, de 21 de junho de 1993, e em

  consonância com o que estabelece a letra “s”, item 6.4, da ICA 58-37, o cronograma de

  desembolso deverá prever uma última parcela, que só será paga após a conclusão do

  processo de recebimento das obras ou serviços. Esta parcela, somada a participação do Con-

  cedente e do Convenente, deverá ser equivalente a 10% do valor total do empreendimento.'
