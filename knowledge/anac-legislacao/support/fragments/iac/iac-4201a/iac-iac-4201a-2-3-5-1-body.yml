title: 'Do COMAR:'
text: '2.3.5.1 Do COMAR:

  - além dos requisitos estabelecidos na ICA 58-37 para a celebração dos Convênios, deverá

  verificar a situação de regularidade do Estado no Cadastro Único de Exigências para

  Transferências Voluntárias (CAUC);

  - remeter três vias do Termo de Convênio ao DAC/SIE, após assinatura do Comandante do

  COMAR e registro no SIAFI;

  - efetuar o controle do empreendimento, conforme Anexo 6 desta Instrução;

  - atualizar os registros no SIAFI, após o DAC/SIE restituir as duas vias assinadas do Termo

  de Convênio;

  - remeter ao Governo do Estado uma via do Termo de Convênio, informando os dados da

  publicação de seu extrato no Diário Oficial da União; e

  - informar à Assembléia Legislativa do Estado a assinatura do Termo de Convênio,

  encaminhando ao DAC/SIE, para controle, cópia do referido documento de informação.'
