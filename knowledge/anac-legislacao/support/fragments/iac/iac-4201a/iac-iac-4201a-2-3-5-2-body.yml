title: 'Do DAC/SIE:'
text: '2.3.5.2 Do DAC/SIE:

  - elaborar o extrato para publicação no Diário Oficial da União e informar ao COMAR, a-

  través de mensagem pelo SIAFI, os dados da publicação;

  - remeter, após publicação do extrato no Diário Oficial da União, uma cópia completa do

  Termo de Convênio à SEFA, para homologação; e

  - restituir ao COMAR após publicação do extrato no Diário Oficial da União, duas vias do

  Termo de Convênio ao COMAR.31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  5

  2.4 EXECUÇÃO DOS CONVÊNIOS'
