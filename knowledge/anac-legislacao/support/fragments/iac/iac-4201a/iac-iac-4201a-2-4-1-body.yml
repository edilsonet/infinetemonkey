title: CONTROLE DE INÍCIO DO EMPREENDIMENTO
text: '2.4.1 CONTROLE DE INÍCIO DO EMPREENDIMENTO

  Após informação do DAC/SIE da assinatura do Termo de Convênio e da publicação de seu

  extrato no Diário Oficial da União, o COMAR emitirá a Autorização de Início do

  Empreendimento, conforme Anexo 5 da ICA 58-37, encaminhando ao DAC/SIE uma cópia

  da mesma para controle.'
