title: Controle da Prestação de Contas Parcial
text: '2.4.2.1 Controle da Prestação de Contas Parcial

  O Estado emitirá solicitação para que seja feita uma visita de inspeção à obra por técnicos

  do COMAR. Tal solicitação deverá conter planilha dos serviços realizados, detalhando, por

  item, o custo unitário, o quantitativo executado e o valor total.

  O Estado deverá providenciar a Prestação de Contas Parcial da última parcela repassada,

  cabendo ao COMAR informar sua aprovação ao DAC/SIE, através de mensagem pelo

  SIAFI, para efeito de controle.'
