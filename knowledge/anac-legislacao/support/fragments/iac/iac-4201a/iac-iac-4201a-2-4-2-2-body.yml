title: Controle das Despesas Correntes
text: '2.4.2.2 Controle das Despesas Correntes

  Com base no Plano de Trabalho, o COMAR enviará ao DAC/SIE, com antecedência mínima

  de 10 dias da data prevista para visita de inspeção, cópias das Ordens de Serviço dos

  técnicos envolvidos, para controle e repasse das despesas correntes.'
