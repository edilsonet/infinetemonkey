title: Relatório Mensal de Acompanhamento
text: '2.4.3.1 Relatório Mensal de Acompanhamento

  O DAC/SIE efetuará o controle do empreendimento através do Relatório Mensal de A-

  companhamento de cada empreendimento, Anexo 6 da ICA 58-37, que deverá ser re-

  metido pelo COMAR até o quinto dia útil do mês seguinte ao mês de referência do Rela-

  tório.'
