title: CONTROLE DE TÉRMINO DO EMPREENDIMENTO
text: '2.4.4 CONTROLE DE TÉRMINO DO EMPREENDIMENTO

  Para controle de finalização do processo, o COMAR encaminhará ao DAC/SIE, cópia do

  Termo de Recebimento das obras, bem como informará ao DAC/SIE o ato de aprovação da

  Prestação de Contas Final apresentada pelo Estado, e sua homologação pela SEFA.31 AGO 2001
  IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  6

  CAPÍTULO 3 - DISPOSIÇÃO TRANSITÓRIA

  3.1 SISTEMA EM TEMPO REAL

  A Divisão de Informática do DAC, deverá elaborar, até 30 de dezembro de 2001, um sis-

  tema para que o COMAR efetue a transmissão, em tempo real, das informações previstas

  nesta Instrução, através de meio eletrônico.31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  7

  CAPÍTULO 4 - DISPOSIÇÕES FINAIS

  4.1 Os casos não previstos nesta Instrução serão submetidos à apreciação do Diretor-Geral
  de

  Aviação Civil.

  4.2 Esta Instrução entrará em vigor na data de sua publicação, ficando revogadas as disposições

  em contrário.31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  8

  REFERÊNCIAS BIBLIOGRÁFICAS

  1. BRASIL. Decreto 65.144, de 12 de setembro de 1969. Institui o Sistema de Aviação Civil
  do

  Ministério da Aeronáutica e dá outras providências. Diário Oficial [da República

  Federativa do Brasil], Brasília, 1969.

  2. ______. Ministério da Aeronáutica. Centro de Documentação e Histórico da Aeronáutica.
  Con-

  fecção, Controle e Numeração de Publicações. Rio de Janeiro: CENDOC, 1999. (ICA 5-

  1).

  3. ______. Departamento de Aviação Civil. Elaboração e Controle de Publicações do DAC.

  Rio de Janeiro.31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  9

  ANEXOS31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________'
