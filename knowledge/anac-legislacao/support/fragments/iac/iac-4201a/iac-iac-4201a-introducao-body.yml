title: INTRODUÇÃO
text: 'INTRODUÇÃO

  A Instrução do Comando da Aeronáutica no 58-37 (ICA 58-37), aprovada pela Portaria

  no 20/GC5, de 14 de janeiro de 2000, que trata da Metodologia para Execução do Programa
  Federal

  de Auxílio a Aeroportos (PROFAA), prevê, em seu item 6 - "Gerenciamento, Controle e

  Fiscalização", como competência do DAC, gerenciar o Plano de Investimentos, através de um

  sistema de controle e fiscalização, em coordenação com os COMAR, pelo qual será acompanhado
  o

  desenvolvimento dos diversos eventos que deverão estar de acordo com o previsto na ICA 58-37
  e

  nos Convênios firmados entre os partícipes.

  A presente Instrução de Aviação Civil vem preencher esta lacuna, bem como disciplinar as

  providências decorrentes da edição da Instrução Normativa no 1, de 4 de maio de 2001, da

  Secretaria do Tesouro Nacional, visando cumprir as exigências constantes da Lei Complementar

  no 101, de 4 de maio de 2000 (Lei de Responsabilidade Fiscal).31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

  1

  CAPÍTULO 1 - DISPOSIÇÕES PRELIMINARES

  1.1 OBJETIVO

  Esta Instrução tem por objetivo estabelecer a sistemática de controle e fiscalização dos

  Planos de Investimentos do Programa Federal de Auxílio a Aeroportos (PROFAA), pelo

  DAC em coordenação com os COMAR.

  1.2 FUNDAMENTO

  - Lei no 8.399, de 7 de janeiro de 1992;

  - Lei Complementar no 101, de 4 de maio de 2000;

  - Instrução Normativa no 1, de 15 de janeiro de 1997, da Secretaria do Tesouro Nacional

  (IN 01/97);

  - Instrução Normativa no 1, de 4 de maio de 2001, da Secretaria do Tesouro Nacional

  (IN 01/01);

  - Portaria No 1047/GM4, de 30 de dezembro de 1992;

  - Instrução do Ministério da Aeronáutica No 172-4 (IMA 172-4), de 1 de janeiro de 1998;

  - Instrução do Ministério da Aeronáutica No 171-33 (IMA 171-33), de 9 de julho de 1999;

  - Portaria No 19/GC5, de 14 de janeiro de 2000;

  - Instrução do Comando da Aeronáutica No 58-37 (ICA 58-37), de 14 de janeiro de 2000;

  - Portaria No 20/GC5, de 14 de janeiro de 2000; e

  - Instrução de Aviação Civil No 5001-0899 (IAC 5001-0899), de 9 de agosto de 1999.

  1.3 APROVAÇÃO

  Aprovada pela Portaria No 1.262A/DGAC, de 31 de agosto de 2001.

  1.4 DATA DE EFETIVAÇÃO

  25/10/2001.

  1.5 ÂMBITO

  Geral.

  1.6 DISTRIBUIÇÃO

  C - D - GV.

  1.7 CORRELAÇÕES

  ICA 58-37.

  1.8 CANCELAMENTO

  Não há.31 AGO 2001 IAC 4201

  ________________________________________________________________________________________________

  _______________________________________________________________________________________________

