  SERVIÇO PÚBLICO FEDERAL\nDEPARTAMENTO DE AVIAÇÃO CIVIL\nPORTARIA DAC No 1262A/DGAC, DE 31\
  \ DE AGOSTO DE 2001.\nAprova a IAC que trata da Sistemática\nde Controle e Fiscalização\
  \ do Programa\nFederal de Auxílio a Aeroportos.\nO DIRETOR GERAL DO DEPARTAMENTO DE AVIAÇÃO\
  \ CIVIL, com base no De-\ncreto No 65.144, de 12 de setembro de 1969, que institui o Sistema\
  \ de Aviação Civil do Ministério\nda Aeronáutica, e nos artigos 18 e 19 da Lei Complementar\
  \ no 97, de 9 de junho de 1999, e tendo\nem vista o disposto na Instrução do Comando da\
  \ Aeronáutica no 58-37, que trata da Metodologia\npara a Execução do Programa Federal de\
  \ Auxílio a Aeroportos, resolve:\nArt. 1o Seja efetivada a IAC abaixo discriminada:\nSímbolo:\
  \ IAC 4201\nEspécie: Normativa\nÂmbito: Geral\nTítulo: Sistemática de Controle e Fiscalização\
  \ do Programa Federal de Auxílio a\nAeroportos.\nArt. 2o Esta Portaria entra em vigor após\
  \ a sua publicação no Diário Oficial da União.\nMaj.-Brig.-do-Ar - VENANCIO GROSSI\nDiretor-Geral\
  \ do DAC\nPUBLICADA NO DIÁRIO OFICIAL DA UNIÃO NO 205, DE 25 DE OUTUBRO DE 2001.31 AGO 2001\
