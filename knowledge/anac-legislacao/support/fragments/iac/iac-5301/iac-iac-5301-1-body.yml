  2. _______. Ministério da Aeronáutica. Portaria no 774/GM-2, de 13 de dezembro de 1997.

  Estabelece critérios e procedimentos para a utilização de áreas aeroportuárias .

  3. _______. Departamento de Aviação Civil. Constituição e Atribuições Específicas das Seções

  de Aviação Civil. Rio de Janeiro: DAC, 1990. 07p. (IAC 2306-0790)

  4. _______. Departamento de Aviação Civil. Fiscalização de Aeronaves Civis e Suas Respectivas

  Tripulações. Rio de Janeiro: DAC, 1990. 05p. (IAC 2212-1190).IAC 5301-0699

  COMANDO DA AERONÁUTICA

  PORTARIA DAC N.º 390A/DGAC, DE 11 DE JUNHO DE 1999

  Aprova a Instrução de Aviação Civil (IAC), que dispõe sobre as Instalações para as Seções
  de

  Aviação Civil (SAC) nos aeroportos.

  O DIRETOR GERAL DO DEPARTAMENTO DE AVIAÇÃO CIVIL, no uso das

  atribuições que lhe confere o Decreto N.° 65.144, de 12 de setembro de 1969; e tendo em
  vista o

  disposto na Lei N.º 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica)
  e, ainda, no

  Art. 3°, Art. 4º e inciso III do Art. 5º, da Portaria N.° 774/GM-2, de 13 de novembro de
  1997, resolve:

  Art. 1º Seja efetivada a IAC abaixo discriminada:

  Símbolo: IAC 5301-0699

  Espécie: NORMATIVA

  Âmbito: GERAL

  Título: INSTALAÇÕES PARA AS SEÇÕES DE AVIAÇÃO CIVIL (SAC) NOS

  AEROPORTOS.

  Art. 2º Esta Portaria entrará em vigor na data de sua publicação, ficando revogadas as

  disposições em contrário.

  Ten.-Brig.-do-Ar MARCOS ANTÔNIO DE OLIVEIRA

  Diretor-Geral'
