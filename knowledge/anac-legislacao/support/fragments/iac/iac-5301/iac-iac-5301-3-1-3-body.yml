text: '3.1.3 o terceiro segmento deve ser situado em local de fácil acesso para o passageiro
  e próximo à

  área de “check in”.IAC 5301-0699

  3.2 Dependendo do padrão arquitetônico e do movimento do aeroporto, os três segmentos poderão

  funcionar em instalações isoladas ou integradas, desde que sejam atendidos os requisitos
  acima.

  3.3 Nos aeroportos onde houver mais de um terminal de passageiros, a administração aeroportuária

  deverá disponibilizar um terceiro segmento em cada terminal.

  4 SINALIZAÇÃO

  4.1 A administração aeroportuária deverá disponibilizar sinalização conforme o anexo 1 desta
  IAC,

  em todo o conjunto de informações aos usuários do aeroporto abrangendo as áreas de

  embarque, de desembarque e outras de grande movimentação, seguindo a mesma padronização

  da sinalização existente.

  4.2 Especial atenção deve ser dada à sinalização para a localização do terceiro segmento,
  por ser a

  área de atendimento aos passageiros.

  5 ÁREAS NECESSÁRIAS PARA ABRIGAR A SAC

  5.1 As áreas destinadas aos segmentos das SAC devem possuir medidas mínimas, que variam

  conforme o movimento dos aeroportos e terminais, de modo a atender às necessidades para
  o

  cumprimento de suas atribuições.

  5.2 Assim sendo, são as seguintes as áreas mínimas que deverão ser disponibilizadas pelas

  administrações aeroportuárias, para o funcionamento das SAC:'
