title: 5.2.3(c)
text: 'c) terceiro segmento, quando isolado - de 3,60 a 4,30m2 por terminal.

  5.3 Modelos de composição dos segmentos das SAC, seus mobiliários e suas respectivas áreas

  mínimas constam nos anexos 2 a 9, desta IAC.

  6 APROVAÇÃO DOS PROJETOS DAS SAC

  6.1 Quando da construção, ampliação ou reforma de terminais de passageiros, a administração

  aeroportuária deverá submeter o projeto das instalações para a SAC ao DAC, para aprovação.

  6.2 Do mesmo modo, quando for ativada uma SAC, a administração aeroportuária deverá submeter

  o projeto das instalações para a SAC ao DAC, para aprovação.

  7 DISPOSIÇÕES FINAIS

  7.1 As administrações dos aeroportos que estiverem em desacordo com esta Instrução terão
  prazo de

  180 (cento e oitenta) dias, contados a partir da data de sua publicação, para se adequarem
  aos

  dispositivo desta IAC.

  7.2 Compete aos SERAC exercerem a fiscalização do cumprimento desta IAC, devendo comunicar

  ao DAC as discrepâncias observadas.

  7.3 Os casos omissos serão resolvidos pelo Diretor-Geral do DAC.IAC 5301-0699'
