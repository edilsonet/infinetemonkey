text: 'ANEXO 9 - MODELO DO 1º SEGMENTO INTEGRADO COM AS INSTALAÇÕES DA

  SALA DE TRÁFEGO EM AEROPORTOS (PADRÃO C) ........................................... 15

  REFERÊNCIAS BIBLIOGRÁFICAS ..................................................................................................
  16IAC 5301-0699

  1 INTRODUÇÃO

  1.1 O controle e a fiscalização das atividades da aviação civil são obrigações administrativas
  do

  Departamento de Aviação Civil - DAC, órgão central do Sistema de Aviação Civil,

  indispensáveis à segurança da operação dos aeroportos, das aeronaves e dos usuários do

  Sistema.

  1.2 Estas funções são exercidas nos aeroportos pelas Seções de Aviação Civil - SAC, ativadas

  através de Portarias do Diretor-Geral de Aviação Civil, cujas atribuições específicas estão

  estabelecidas na IAC 2306-0790.

  1.3 Cabe às administrações aeroportuárias destinar as áreas necessárias para abrigar o pessoal
  e o

  mobiliário das SAC, para o seu funcionamento.

  2 COMPOSIÇÃO

  2.1 Para poder exercer suas atribuições nos aeroportos, as SAC deverão ter suas instalações

  divididas em três segmentos, conforme abaixo discriminado:'
