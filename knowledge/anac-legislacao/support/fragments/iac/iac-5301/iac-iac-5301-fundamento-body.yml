title: FUNDAMENTO
text: 'FUNDAMENTO

  Lei No 7.565, de 19 Dez 86, que dispõe sobre o Código Brasileiro de Aeronáutica;

  Decreto N.º 65.144, de 12 Set. 69, que institui o Sistema de Aviação Civil; e

  Portaria No 774/GM-2, de 13 Nov. 97, que estabelece critérios e procedimentos para a

  utilização de áreas aeroportuárias, edificadas ou não, de instalações, de equipamentos,
  de

  facilidades e de serviços nos aeroportos e dá outras providências.'
