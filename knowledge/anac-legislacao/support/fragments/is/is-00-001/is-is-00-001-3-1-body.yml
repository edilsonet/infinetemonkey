text: '3.1 O art. 87 da Lei nº 7.565/86 (Código Brasileiro de Aeronáutica - CBAer) estabelece
  que a

  prevenção de acidentes aeronáuticos é da responsabilidade de todas as pessoas, naturais
  ou

  jurídicas, envolvidas com a fabricação, manutenção, operação e circulação de aeronaves,

  bem assim com as atividades de apoio da infraestrutura aeronáutica no território brasileiro.'
