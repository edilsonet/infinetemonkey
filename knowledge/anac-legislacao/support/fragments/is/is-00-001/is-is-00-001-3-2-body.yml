text: '3.2 As seção 21.3 do Regulamento Brasileiro da Aviação Civil - RBAC nº 21 estabelece
  requi-

  sitos a serem observados por detentores de um Certificado de Tipo (incluindo um Certificado

  Suplementar de Tipo), de um Atestado de Produto Aeronáutico Aprovado, ou, ainda, de um

  licenciamento de Certificado de Tipo com relação a qualquer falha, mau funcionamento ou

  defeito em qualquer produto, peça, processo ou artigo fabricado por tais detentores e que

  tenha sido considerado como causador de qualquer uma das ocorrências listadas no pará-

  grafo (c) da referida seção.'
