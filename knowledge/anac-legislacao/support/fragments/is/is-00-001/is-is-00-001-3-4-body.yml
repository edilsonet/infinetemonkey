title: Não obstante, as seções 135.415 do RBAC nº 135 e 121.703 do RBAC nº 121 também esta-
text: '3.4 Não obstante, as seções 135.415 do RBAC nº 135 e 121.703 do RBAC nº 121 também
  esta-

  belecem requisitos que devem ser observados e comunicados por detentores de um Certifi-

  cado de Empresa de Transporte Aéreo (Certificado ETA) segundo os requisitos dos RBAC

  no 135 e n° 121, respectivamente, com relação às dificuldades em serviço encontradas em

  produtos operados por tais detentores.'
