title: 'Diretriz de aeronavegabilidade - DA: documento emitido pela ANAC, visando eliminar'
text: '4.3 Diretriz de aeronavegabilidade - DA: documento emitido pela ANAC, visando eliminar

  uma condição insegura existente em um produto aeronáutico, com probabilidade de existir

  ou de se desenvolver em outros produtos do mesmo projeto de tipo. O seu cumprimento é

  obrigatório e frequentemente impõe o cumprimento de um BS de uma forma especificada.

  As diretrizes emitidas pelas diversas AACs também são consideradas brasileiras e aqui apli-

  cáveis se estas AACs são as responsáveis pelo projeto de tipo de produtos operando no Brasil

  (para maiores informações, ver IS nº 39-001).'
