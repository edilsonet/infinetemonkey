text: '4.5 Sistema de Dificuldades em Serviço: é um sistema responsável por assegurar que
  as infor-

  mações relativas a falhas, mau funcionamento ou defeito em qualquer produto aeronáutico

  sejam apropriadamente coletadas, analisadas e processadas, independentemente de estarem

  ou não relacionadas a acidentes ou incidentes aeronáuticos.'
