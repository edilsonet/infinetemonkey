title: 'Produto Aeronáutico: aeronave, um motor ou uma hélice, assim como componentes e par-'
text: '4.6 Produto Aeronáutico: aeronave, um motor ou uma hélice, assim como componentes e
  par-

  tes dos mesmos. Inclui ainda qualquer instrumento, equipamento, mecanismo, componente,

  peça, dispositivo, pertence ou acessório, incluindo equipamentos de comunicações, que é

  usado, ou com intenção de uso, na operação ou no controle de uma aeronave em voo e está

  instalado ou acoplado na aeronave e não faz parte da célula, do motor ou da hélice. Inclui,

  finalmente, materiais e processos usados na fabricação de todos os itens acima.'
