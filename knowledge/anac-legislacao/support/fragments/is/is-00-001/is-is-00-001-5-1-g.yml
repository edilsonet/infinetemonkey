title: 5.1(g)
text: 'g) Detentores de um Certificado segundo os requisitos do RBAC nº 145.

  NOTA 1: Em geral, a obrigação da comunicação de uma dificuldade em serviço recai sobre

  os detentores de um CT, que geralmente são organizações complexas. Porém, em alguns

  casos, esta obrigação poderá recair sobre um profissional, visto que alguns critérios de

  comunicação de dados aplicam-se a pessoas.Data de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B

  NOTA 2: Esta IS não substitui os deveres e responsabilidades das organizações e dos pro-

  fissionais envolvidos com a industria aeronáutica, uma vez que reside sobre todos (autori-

  dade, fabricante, organizações de manutenção, operadores e proprietários de aeronaves) a

  responsabilidade pelo gerenciamento da segurança de voo. À ANAC, como integrante deste

  processo, cabe o estabelecimento de padrões que a indústria deverá observar, assim como

  a verificação de sua manutenabilidade através da contínua vigilância.'
