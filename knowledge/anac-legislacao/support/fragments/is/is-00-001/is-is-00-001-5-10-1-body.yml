title: 'Geral: Há diferentes requisitos para o envio dos relatórios para operadores ou proprietários,'
text: '5.10.1 Geral: Há diferentes requisitos para o envio dos relatórios para operadores
  ou proprietários,

  organizações de manutenção aeronáutica, organizações responsáveis pelo projeto e organi-

  zações responsáveis pela produção. Sendo assim, os critérios envolvidos no envio de tais

  relatórios não são os mesmos para estas diferentes organizações. Por exemplo, a ANAC não

  receberá o mesmo tipo de relatório enviado por uma organização responsável pelo projeto

  de tipo ou enviado por um operador. Tal fato é uma consequência das diferentes perspectivas

  de cada uma das organizações baseadas em suas atividades.'
