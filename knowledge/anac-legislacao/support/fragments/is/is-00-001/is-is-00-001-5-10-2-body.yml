text: '5.10.2 Operações e Manutenção: A lista de exemplos de ocorrências no Apêndice B foi
  estabele-

  cida para fornecer um guia para estas organizações sobre os tipos de eventos que devem ser

  comunicados à ANAC. Vale observar que tal lista não é exaustiva, desta forma, caso algumData
  de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B

  evento ocorra e não esteja contemplado nesta IS e que no melhor julgamento de engenharia

  seja passível de comunicação, então tal evento deve ser enviado à ANAC.'
