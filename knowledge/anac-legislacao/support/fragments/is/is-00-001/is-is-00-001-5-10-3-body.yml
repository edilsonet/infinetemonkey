title: 'Projeto: A lista de exemplos fornecida por esta IS não deve ser usada pelas organizações'
text: '5.10.3 Projeto: A lista de exemplos fornecida por esta IS não deve ser usada pelas
  organizações

  responsáveis pelo projeto como um guia para determinar se alguma ocorrência deve ou não

  ser comunicada à ANAC. Esta lista deve ser utilizada para o estabelecimento de um sistema

  de coleta de dados, pois após estas organizações receberem os dados de campo, devem fazer

  suas análises para determinar se uma determinada ocorrência poderá causar uma condição

  insegura em um produto.'
