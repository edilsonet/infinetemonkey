text: '5.10.4 Produção: a princípio, a obrigação de comunicar as ocorrências contidas na lista
  de exem-

  plos não se aplica as organizações responsáveis pela produção. Sua obrigação primária con-

  siste em informar eventuais desvios em seu processo produtivo as organizações responsáveis

  pelo projeto. Entretanto, aqueles casos em que a análise conjunta da organização responsável

  pela produção com a responsável pelo projeto, detectar que tal desvio em seu processo pro-

  dutivo possa provocar uma condição insegura em um produto, devem ser comunicados à

  ANAC.

  6 APÊNDICES'
