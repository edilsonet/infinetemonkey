section_title: 'Os objetivos do Sistema de Dificuldades em Serviço são:'
subsection_id: a
cite: 5.2.2(a)
title: 5.2.2(a)
text: 'a) Permitir análises de segurança de cada ocorrência relatada, incluindo ocorrências
  similares,

  de tal forma que qualquer ação necessária possa ser tomada, possibilitando determinar as
  causas

  necessárias para evitar ocorrências recorrentes.'
