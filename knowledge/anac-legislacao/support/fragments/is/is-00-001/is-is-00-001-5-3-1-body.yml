text: '5.3.1 Conforme os requisitos definidos nos regulamentos operacionais, ocorrências definidas
  como

  incidentes, falhas, mau funcionamento, defeito, defeito técnico ou das limitações técnicas
  que

  possam colocar em perigo a operação segura da aeronave devem ser comunicadas à ANAC.'
