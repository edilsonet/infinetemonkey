text: '5.3.2 Os regulamentos de projeto e certificação de produtos, partes e componentes definem
  quais as

  falhas, mau funcionamento, defeito ou outras ocorrências que resultem ou possam resultar
  em

  condições inseguras, devem ser comunicadas à ANAC.'
