text: '5.3.5 O envio dos relatórios não isenta a responsabilidade da pessoa ou da organização
  responsável

  pelo seu envio de tomar ações corretivas prevenindo futuras ocorrências similares. Tais
  ações

  assim como possíveis ações preventivas, devem ser incluídas nos relatórios enviados.Data
  de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B'
