title: 5.4.2(g)
text: 'g) Uma pessoa executando a função de serviços auxiliares de solo incluindo, mas não
  limitados,

  as seguintes funções:

  I- Abastecimento e provisionamento na aeronave;

  II- Preparo e carregamento da aeronave (DOV);

  III- Aplicação de fluidos descongelantes; e

  IV- Reboque de aeronaves.'
