title: A ANAC encoraja a comunicação voluntária de dados relacionados com dificuldades em
  ser-
text: '5.4.3 A ANAC encoraja a comunicação voluntária de dados relacionados com dificuldades
  em ser-

  viço, assim como são feitas as comunicações de relatório de perigo dirigidas à autoridade
  de

  investigação do Sistema de Investigação e Prevenção de Acidentes Aeronáuticos (SIPAER).

  Não obstante, qualquer funcionário de uma das organizações acima listadas poderá comunicar

  os dados que julgar necessários, observando o preconizado nos Apêndices B e C deste docu-

  mento.'
