section_title: A autoridade aeronáutica estabelece que acidente aeronáutico é toda ocorrência
  aeronáutica
subsection_id: a
cite: 5.5.1(a)
title: 5.5.1(a)
text: 'a) Uma pessoa sofra lesão grave ou morra como resultado de:

  I- estar na aeronave; ou

  II- ter contato direto com qualquer parte da aeronave, incluindo aquelas que dela te-

  nham se desprendido; ou

  III- ser submetida à exposição direta do sopro de hélice, rotor ou escapamento de jato,

  ou às suas consequências.

  NOTA 1: Exceção é feita quando as lesões resultem de causas naturais, forem autoinfligidas

  ou infligidas por terceiros, ou forem causadas a pessoas que embarcaram clandestinamente

  e se acomodaram em área que não as destinadas aos passageiros e tripulantes.'
