title: 5.5.1(b)
text: 'b) A aeronave sofra dano ou falha estrutural que:Data de emissão: 13 de março de 2018.
  IS nº 00-001

  Revisão B

  I- afete adversamente a resistência estrutural, o seu desempenho ou as suas caracte-

  rísticas de voo; e

  II- normalmente exija a realização de grande reparo ou a substituição do componente

  afetado.

  NOTA 2: Exceção é feita para falha ou danos limitados a um único motor, suas carenagens

  ou acessórios; ou para danos limitados às hélices, às pontas de asa, às antenas, aos probes,

  aos pneus, aos freios, às rodas, às carenagens do trem, aos painéis, às portas do trem de

  pouso, aos para-brisas, aos amassamentos leves e pequenas perfurações no revestimento da

  aeronave, ou danos menores às pás do rotor principal e de cauda, ao trem de pouso e àque-

  les resultantes de colisão com granizo ou fauna (incluindo perfurações no radome).'
