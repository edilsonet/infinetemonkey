text: '5.5.1 A autoridade aeronáutica estabelece que acidente aeronáutico é toda ocorrência
  aeronáutica

  relacionada à operação de uma aeronave tripulada, havida entre o momento em que uma pessoa

  nela embarca com a intenção de realizar um voo até o momento em que todas as pessoas tenham

  dela desembarcado ou, no caso de uma aeronave não tripulada, toda ocorrência havida entre
  o

  momento que a aeronave está pronta para se movimentar, com a intenção de voo, até a sua

  inércia total pelo término do voo, e seu sistema de propulsão tenha sido desligado e, durante
  os

  quais, pelo menos uma das situações abaixo ocorra:'
