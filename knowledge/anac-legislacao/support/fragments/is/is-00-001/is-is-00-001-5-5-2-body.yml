title: A autoridade aeronáutica também define incidente aeronáutico como toda ocorrência associada
text: '5.5.2 A autoridade aeronáutica também define incidente aeronáutico como toda ocorrência
  associada

  à operação de uma aeronave, havendo intenção de voo, que não chegue a se caracterizar como

  um acidente aeronáutico ou uma ocorrência de solo, mas que afete ou possa afetar a segurança

  da operação.'
