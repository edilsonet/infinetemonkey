title: Para as operações conduzidas segundo os requisitos do RBAC nº 121 e nº 135 e para atividades
text: '5.6.1 Para as operações conduzidas segundo os requisitos do RBAC nº 121 e nº 135 e
  para atividades

  conduzidas segundo o RBAC nº 145, o período de 96 horas para comunicação dos dados inicia-

  se no horário e local da ocorrência ou então, desde o horário que o responsável pelo envio
  do

  dado determinou que há uma condição insegura ou potencialmente perigosa associada com a

  ocorrência.'
