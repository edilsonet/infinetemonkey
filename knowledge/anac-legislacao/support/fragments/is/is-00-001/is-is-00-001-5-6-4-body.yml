title: Quando uma ocorrência for julgada em resultar em um perigo iminente, a ANAC deverá
  ser
text: '5.6.4 Quando uma ocorrência for julgada em resultar em um perigo iminente, a ANAC deverá
  ser

  comunicada imediatamente e pelo método mais rápido possível (telefone, fax, telex, e-mail,

  etc.) com todas as informações disponíveis naquele momento. Logo após a comunicação inicial

  e dentro do prazo do estabelecido em 5.6.1, 5.6.2 ou 5.6.3, conforme aplicável, deverá ser
  en-

  viado o relatório formal do evento à ANAC.'
