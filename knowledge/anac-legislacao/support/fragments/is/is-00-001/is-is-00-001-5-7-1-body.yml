text: '5.7.1 Os relatórios requeridos pelos RBAC nº 21, nº 121, nº 135 e nº 145 devem ser
  transmitidos em

  um formato aceitável pela ANAC, conforme Apêndice C. A quantidade de informação contida

  nos relatórios deve ser compatível com a severidade da ocorrência. Cada relatório deve conter,

  no mínimo, as seguintes informações:'
