text: '5.7.2 Para qualquer ocorrência envolvendo um sistema ou componente monitorado ou protegido
  por

  um sistema de proteção ou de aviso (como sistemas de detecção e extinção de fogo), é impor-

  tante informar se tal sistema funcionou adequadamente.'
