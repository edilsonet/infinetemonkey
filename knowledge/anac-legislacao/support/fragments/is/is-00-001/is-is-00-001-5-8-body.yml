title: Envio dos relatórios para outras autoridades
text: '5.8 Envio dos relatórios para outras autoridades

  Os relatórios de eventos relacionados ao controle de tráfego aéreo devem ser enviados ao
  De-

  partamento de Controle do Espaço Aéreo (DECEA) do Comando da Aeronáutica (COMAER)

  e aqueles relacionados incidentes e acidentes aeronáuticos devem ser enviados à autoridade
  de

  investigação do SIPAER, conforme definido na legislação pertinente.'
