title: Caso seja constatado que uma ocorrência tenha impacto ou esteja relacionada em um produto
text: '5.9.3 Caso seja constatado que uma ocorrência tenha impacto ou esteja relacionada em
  um produto

  aeronáutico certificado segundo um processo de CT, CST ou APAA, então o detentor do certi-

  ficado aplicável deve ser informado. Caso a ocorrência aconteça em um produto aeronáutico

  que não requer APAA, pois é aprovado sob a égide de um CT ou CST, então o detentor do CT

  ou CST deverá ser informado.'
