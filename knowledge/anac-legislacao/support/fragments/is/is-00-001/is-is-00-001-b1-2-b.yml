title: B1.2(b)
text: '(b) SISTEMA DE PILOTO AUTOMÁTICO

  I- Falha de operação do sistema de piloto automático quando engajado;

  II- Dificuldade na controlabilidade da aeronave quando o sistema de piloto automático esti-

  ver engajado;

  III- Falha de qualquer dispositivo de desconexão do sistema de piloto automático;

  IV- Alteração inadvertida do modo do sistema de piloto automático.'
