title: SISTEMAS
text: 'B1.2 SISTEMAS

  B1.2.1 Os critérios a seguir são gerais e aplicáveis a qualquer sistema da aeronave:

  NOTA: O banco de dados do sistema de dificuldades em serviço utiliza o sistema ATA 2200

  para a codificação de sistemas e subsistemas de aeronaves e suas respectivas descrições.
  A

  codificação ATA 2200 deverá ser usada ao se fazer o relatório, sendo um campo selecionável

  do sistema de dificuldades em serviço.'
