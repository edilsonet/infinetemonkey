title: B1.2(d)
text: '(d) SISTEMA ELÉTRICO

  I- Perda de um sistema de distribuição de energia elétrica (AC/DC);

  II- Perda de mais de um ou perda total do sistema de geração de energia elétrica;

  III- Falha do sistema de geração de energia elétrica de emergência.'
