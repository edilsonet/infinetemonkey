title: B1.2(e)
text: '(e) CABINE/COMPARTIMENTO DE CARGAS.

  I- Perda de controle do assento do piloto ou co-piloto em voo;

  II- Falha de qualquer equipamento ou sistema de emergência, incluindo o sistema de sinali-

  zação de evacuação de emergência, quaisquer portas de saída, luzes de emergência, etc.;

  III- Perda da capacidade de retenção da carga transportada pelo sistema de carregamento
  de

  carga.'
