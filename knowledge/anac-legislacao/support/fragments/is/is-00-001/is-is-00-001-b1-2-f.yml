title: B1.2(f)
text: '(f) SISTEMA DE PROTEÇÃO CONTRA FOGO

  I- Alarmes de fogo, exceto aqueles confirmados como falsos;

  II- Falha não detectável ou defeito do sistema de detecção e proteção contra fogo e fumaça

  resultando em perda ou redução na capacidade de detecção ou proteção contra fogo e

  fumaça;

  III- Falha de indicação (alarme) em eventos de fogo ou fumaça.'
