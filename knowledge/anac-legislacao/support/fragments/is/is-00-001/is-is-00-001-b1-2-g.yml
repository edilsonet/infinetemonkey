title: B1.2(g)
text: '(g) COMANDOS DE VOOData de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B

  I- Assimetria de flaps, slats, spoilers, etc.;

  II- Limitação de movimento, rigidez, perda ou atraso da resposta da aeronave após a atuação

  dos sistemas de comandos de voo primários ou de seus compensadores e sistemas de

  travamento;

  III- Descontrole das superfícies de comandos de voo;

  IV- Vibração de superfícies de comandos de voo reportadas pela tripulação;

  V- Falha ou desconexão do sistema mecânico de comandos de voo;

  VI- Interferência nos controles das superfícies de comando de voo da aeronave ou degradação

  das qualidades de voo.'
