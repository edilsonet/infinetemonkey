title: B1.2(h)
text: '(h) SISTEMA DE COMBUSTÍVEL

  I- Mau funcionamento do sistema de indicação de quantidade de combustível resultando

  em perda total ou indicação errônea da quantidade de combustível da aeronave;

  II- Vazamento de combustível resultando em perda de grande quantidade, perigo de fogo

  ou contaminação;

  III- Mau funcionamento ou defeitos do sistema de alijamento de combustível resultando em

  perda inadvertida de quantidade significativa de combustível, perigo de fogo, contami-

  nação perigosa de equipamentos da aeronave ou incapacidade de alijar combustível;

  IV- Mau funcionamento ou defeito na distribuição ou no suprimento do sistema de combus-

  tível;

  V- Incapacidade de transferir ou utilizar a quantidade total de combustível utilizável.'
