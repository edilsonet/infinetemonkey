title: B1.2(i)
text: '(i) HIDRÁULICA

  I- Perda de um sistema hidráulico em operações ETOPS;

  II- Falha do sistema de isolamento;

  III- Perda de mais de um sistema hidráulico;

  IV- Falha do sistema hidráulico de emergência;

  V- Extensão inadvertida da turbina de ar de impacto (Ram Air Turbine - RAT).'
