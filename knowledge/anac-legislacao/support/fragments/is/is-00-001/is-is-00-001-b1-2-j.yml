text: '(j) SISTEMA DE PROTEÇÃO E DETECÇÃO DE GELO

  I- Perda não detectável ou redução no desempenho do sistema de degelo/antigelo;

  II- Perda de mais de um sistema de aquecimento dos sensores (probes);Data de emissão: 13
  de março de 2018. IS nº 00-001

  Revisão B

  III- Incapacidade de obter degelo simétrico nas asas;

  IV- Acúmulo anormal de gelo provocando alterações no desempenho ou nas qualidades de

  voo da aeronave;

  V- Visibilidade prejudicada da tripulação.'
