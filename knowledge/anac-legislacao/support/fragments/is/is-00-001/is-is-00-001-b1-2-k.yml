title: B1.2(k)
text: '(k) INDICAÇÕES/ALERTAS/SISTEMAS DE GRAVAÇÃO DE DADOS

  I- Mau funcionamento ou defeito de qualquer sistema de indicação, quando a possibilidade

  de indicação duvidosa para a tripulação resultar em ações inapropriadas em sistemas es-

  senciais;

  II- Perda de funções de alerta (vermelho) de um sistema;

  III- Para glass cockpits; perda ou mau funcionamento de mais de uma unidade de indicação

  (display unit) ou computador associado com a função de alerta ou display.'
