title: B1.2(l)
text: '(l) SISTEMAS DE TREM DE POUSO/FREIOS/PNEUS

  I- Fogo nos freios;

  II- Perda significativa da ação dos freios;

  III- Frenagem assimétrica alterando a trajetória pretendida;

  IV- Falha no sistema de extensão do trem de pouso por gravidade (free fall), inclusive du-

  rante ensaios e testes;

  V- Extensão ou retração não comandada das portas dos trens de pouso;

  VI- Estouros múltiplos de pneus.'
