title: B1.2(m)
text: '(m) SISTEMAS DE NAVEGAÇÃO (INCLUINDO SISTEMAS DE APROXIMAÇÃO POR

  PRECISÃO) E SISTEMAS DE DADOS DE AR

  I- Perda total ou falhas múltiplas de equipamentos de navegação;

  II- Perda total ou falhas múltiplas de equipamentos de dados de ar;

  III- Indicações enganosas significativas;

  IV- Erros de navegação significativos atribuídos a dados incorretos ou erro de código do

  banco de dados utilizado;

  V- Desvios inesperados na direção lateral ou vertical que não sejam causados por ações co-

  mandadas pelo piloto;Data de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B

  VI- Problemas com as facilidades de navegação de solo causando erros de navegação signi-

  ficativos que não estejam associados com transitórios do modo de navegação inercial

  para o modo de navegação por rádio.'
