title: B1.2(n)
text: '(n) OXIGÊNIO PARA AERONAVES PRESSURIZADAS

  I- Perda da capacidade de suprimento de oxigênio na cabine de tripulantes;

  II- Perda da capacidade de suprimento de oxigênio para um número significativo da cabine

  de passageiros (mais que 10%), inclusive quando encontrado durante manutenção, trei-

  namentos ou testes.'
