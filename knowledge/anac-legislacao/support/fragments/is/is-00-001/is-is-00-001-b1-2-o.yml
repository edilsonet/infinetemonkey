title: B1.2(o)
text: '(o) SISTEMA DE SANGRIA DE AR

  I- Vazamentos de ar quente sangrado resultando em alarme de fogo ou dano estrutural;

  II- Perda de todos os sistemas de sangria de ar;

  III- Falha do sistema de detecção de vazamento ar quente sangrado.'
