subsection_id: c
cite: B1.3(c)
title: B1.3(c)
text: '(c) Falha ou mau funcionamento de qualquer parte de um motor ou de sua instalação ou
  carenagens

  resultando em:

  I- Falha incontida de componentes ou de suas partes;

  II- Fogo interno ou externo ou ainda fuga não controlada de gases quentes;

  III- Empuxo em uma direção diferente da comandada pelo piloto;

  IV- Falha ou operação inadvertida do sistema reversor de empuxo/potência;

  V- Incapacidade de controle de potência, empuxo, ou rotações por minuto (RPM);

  VI- Falha da estrutura de fixação dos motores;

  VII- Perda parcial ou total de uma parte maior das instalações dos motores;

  VIII- Fumaça densa ou concentração de produtos tóxicos suficientes para incapacitar a tripu-

  lação técnica ou a de passageiros;

  IX- Incapacidade de utilização de procedimentos normais para apagar os motores;Data de emissão:
  13 de março de 2018. IS nº 00-001

  Revisão B

  X- Incapacidade de religar motores em condições de serviço;'
