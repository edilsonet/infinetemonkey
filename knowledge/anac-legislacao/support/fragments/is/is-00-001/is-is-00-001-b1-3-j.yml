cite: B1.3(j)
title: B1.3(j)
text: '(j) Adicionalmente, para hélices e transmissões; falha ou mau funcionamento de qualquer
  parte de

  uma hélice ou motor resultante de uma das situações:

  I- Disparo da hélice;

  II- Desenvolvimento de arrasto excessivo;

  III- Empuxo em direção oposta àquela comandada pelo piloto;

  IV- Desprendimento de hélice ou de qualquer parte maior da mesma;

  V- Falha resultando em desbalanceamento excessivo;

  VI- Movimento inadvertido das pás das hélices levando-as abaixo da posição de mínima

  elevação em voo estabelecida;

  VII- Incapacidade de embandeirar as hélices;

  VIII- Incapacidade de alterar o passo das hélices;

  IX- Alteração inadvertida do passo;Data de emissão: 13 de março de 2018. IS nº 00-001

  Revisão B

  X- Torque incontrolável ou alterações/flutuações do vetor velocidade;

  XI- Liberação de componentes de baixa energia;'
