cite: B1.3(k)
title: B1.3(k)
text: '(k) Adicionalmente, para o caso de rotores e transmissões para helicópteros:

  I- Dano ou defeito na caixa de acessórios do rotor principal ou suas extensões podendo

  causar uma separação em voo do conjunto do rotor ou um mau funcionamento do controle

  do rotor;

  II- Dano no rotor de cauda, transmissões ou sistemas equivalentes;'
