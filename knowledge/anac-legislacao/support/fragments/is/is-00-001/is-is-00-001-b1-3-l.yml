title: B1.3(l)
text: '(l) Adicionalmente, para o caso de APU:

  I- Apagamento ou falha da APU, quando esta for requerida funcionar apropriadamente de-

  vido a requisitos operacionais como em casos de despachos da aeronave pela Lista de

  Equipamentos Mínimos do operador (Minimum Equipment List - MEL) ou durante ope-

  rações ETOPS - Extended Twin Operations;

  II- Incapacidade de apagar o APU;

  III- Disparo;

  IV- Incapacidade de ligar a APU quando necessário por requisitos operacionais.'
