cite: B1.5(d)
title: B1.5(d)
text: '(d) Qualquer dano ou deterioração como fraturas, trincas, corrosão, delaminação e descolamentos;

  resultante de qualquer causa como flutter, perda de rigidez ou falha estrutural nos seguintes
  elemen-

  tos:

  I- Estrutura primária ou um elemento estrutural principal (Principal Structure Element -

  PSE), conforme definido no manual de reparos do fabricante, onde este dano ou deterio-

  ração exceder os limites estabelecidos no manual de reparos aprovado do fabricante que

  requeira um reparo, substituição parcial ou completa;

  II- Estrutura secundária que possa colocar em risco a segurança de voo;

  III- Motores, hélices ou o sistema de rotores de uma aeronave de asas rotativas;'
