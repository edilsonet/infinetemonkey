cite: B1.5(e)
title: B1.5(e)
text: '(e) Qualquer falha, defeito ou mau funcionamento de qualquer sistema ou equipamento,
  ou dano ou

  deterioração encontrados durante o cumprimento de diretrizes de aeronavegabilidade ou qualquer

  outra instrução mandatória emitida pela autoridade de aviação civil nas seguintes situações:

  I- Quando for detectada pela primeira vez por uma organização executando seu cumpri-

  mento;

  II- Quando for detectada em cumprimentos subsequentes, esta falha, defeito ou mau funcio-

  namento, exceder os limites estabelecidos em suas instruções ou nos casos em que os

  procedimentos de manutenção ou de reparo não estão disponíveis;'
