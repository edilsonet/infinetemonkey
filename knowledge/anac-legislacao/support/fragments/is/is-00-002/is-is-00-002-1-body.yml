text: '1. Use PEF

  05

  Use the general knowledge

  content found on the

  appropriate type rating PEF.

  Specific knowledge

  2. - Airline Transport Pilot License

  privileges

  3. -

  General requirements for pilots

  operating in certified air carriers

  (Parts 121 and 135)

  4. -

  Differences between the types

  of air operations (Parts 91, 121

  e 135)

  5. - Uses and purposes of a General

  Operations Manual

  6. -

  Airmen labor regulations

  (need not be evaluated if the

  exam is conducted by a non-

  Brazilian examiner)

  7. - Alcohol and drugs regulations

  8. - Instruments required for VFR

  and IFR operations

  9. - Emergency equipment required

  10. - Airfield requirements

  11. - Fuel and oil planning

  Flight exam

  General procedures'
