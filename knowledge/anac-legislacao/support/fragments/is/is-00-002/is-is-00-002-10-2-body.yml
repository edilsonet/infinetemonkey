title: Além disso, o examinador deve considerar em sua decisão que, mesmo havendo
text: '10.2 Além disso, o examinador deve considerar em sua decisão que, mesmo havendo

  condições regulamentares para o voo, nem sempre sua realização é recomendável, já

  que determinadas circunstâncias podem prejudicar a realização do exame (ex: teto

  meteorológico baixo, pôr-do-sol muito próximo em aeródromo não balizado,

  instrumentos inoperantes que seriam requeridos para a realização de determinada

  manobra, etc.).'
