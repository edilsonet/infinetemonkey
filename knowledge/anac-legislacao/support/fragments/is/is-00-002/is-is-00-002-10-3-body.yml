text: '10.3

  Seção 10

  Inserção do

  Subitem 10.5

  Alteração da FAP

  03 - PLA

  Inserção de

  informações sobre

  o piloto SIC

  Alteração do

  número da Lei do

  Aeronauta nas FAP

  02, 03 e 14.

  Remoção da ambiguidade acerca

  do exame IFR poder ou não ser

  feito no período noturno. Ele

  deve ser realizado em período

  diurno.

  Estabelecimento de

  procedimento especial para a

  realização de exames de

  proficiência relacionados à

  concessão de licença de PLA,

  avião ou helicóptero. Define-se

  que tais exames somente podem

  ser realizados em se utilizando

  de tripulação composta.'
