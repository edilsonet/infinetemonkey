title: Antes de anunciar sua decisão pela realização ou não do exame, o examinador deve,
text: '10.4 Antes de anunciar sua decisão pela realização ou não do exame, o examinador deve,

  como parte do exame, requerer que o candidato identifique se o voo pode ou não ser

  realizado de acordo com os mínimos regulamentares vigentes (consultando aData de emissão:
  31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  meteorologia, documentação da aeronave e dos pilotos, NOTAMs, etc.). O candidato

  que julgar incorretamente as condições presentes deve ser considerado “Reprovado”

  (ex: candidato afirma ser possível decolar para um exame VFR mas o METAR indica

  condições IMC).'
