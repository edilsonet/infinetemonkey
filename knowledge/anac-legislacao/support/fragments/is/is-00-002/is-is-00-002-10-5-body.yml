title: Os exames de proficiência relacionados à concessão de licença de Piloto de Linha Aérea
text: '10.5 Os exames de proficiência relacionados à concessão de licença de Piloto de Linha
  Aérea

  - PLA, avião ou helicóptero, devem ser realizados, obrigatoriamente, em configuração de

  Piloto em Comando - PIC e Piloto Segundo em Comando - SIC, mesmo quando o exame

  for realizado em aeronave certificada single pilot. Com isso, o examinando deve como

  Piloto em Comando - PIC e outro piloto, que não o examinador, deve atuar como Piloto

  Segundo em Comando - SIC. As condições de incapacitação devem ser verificadas

  quando da simulação de incapacitação do SIC. Os aspectos relacionados a Crew Resource

  Management - CRM devem merecer especial atenção por parte do examinador.

  Os exames de proficiência relacionados à concessão de licença de PLA, avião ou

  helicóptero, continuam podendo ser realizados em aeronaves classe ou certificadas

  single pilot.

  O piloto a atuar como SIC deve estar com habilitações correspondentes e CMA válidos.'
