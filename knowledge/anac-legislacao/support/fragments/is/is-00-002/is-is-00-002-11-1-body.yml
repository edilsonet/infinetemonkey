title: Uso das FAP
text: '11.1 Uso das FAP

  Durante o exame, todos os itens previstos nas FAP aplicáveis (Apêndice A desta IS)

  devem ser realizados pelo candidato, salvo aqueles que estejam expressamente

  indicados como “(opcional)”.

  Não obstante o previsto acima, o examinador pode, a seu critério, dispensar a

  demonstração de quaisquer itens previstos na FAP, desde que não sejam obrigatórios

  pelo RBAC nº 61 e caso sua realização seja desaconselhável ou impossível por

  limitações da aeronave, da infraestrutura local, da meteorologia ou da duração do

  exame, desde que o examinador entenda que a ausência da manobra não prejudicará sua

  capacidade de avaliar a proficiência do candidato para a licença ou habilitação

  pretendida.

  O exame de proficiência para concessão ou revalidação de habilitação IFR, quando

  conduzido em aeroclube, escola de aviação civil ou Centro de Instrução de Aviação

  Civil (CIAC), pode ser realizado em duas etapas, complementares, em aeronave e em

  FSTD para cumprimento de todos os itens de verificação IFR requeridos. Neste caso, o

  que não for possível realizar em aeronave pode ser realizado em FSTD, conforme

  programa de instrução aprovado pela ANAC. A primeira etapa consiste em voo

  simulado em FSTD, e a segunda etapa consiste em voo real em aeronave. Cada etapa

  será representada pelo preenchimento de uma FAP 06 - Habilitação de Voo por

  Instrumentos distinta.

  As duas etapas do exame de proficiência devem ser realizadas na sequência pelo mesmo

  servidor designado pela ANAC ou examinador credenciado, em FSTD e aeronave de

  mesmo modelo dos utilizados pelo piloto na instrução prática, em conformidade com oData
  de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  programa de instrução aprovado.'
