title: Para voos de cheque de CPA, seja concessão ou revalidação, far-se-á uso de tão
text: '11.2.2.1 Para voos de cheque de CPA, seja concessão ou revalidação, far-se-á uso de
  tão

  somente uma FAP, a FAP de CPA.

  Não é permitido cumular o exame de habilitação de instrutor (INV) com qualquer outro

  em um mesmo voo, uma vez que são necessários procedimentos diferenciados

  (incluindo troca de assento, avaliação pedagógica, dentre outros) para que se possa

  atestar de maneira eficaz a capacidade instrucional do candidato.'
