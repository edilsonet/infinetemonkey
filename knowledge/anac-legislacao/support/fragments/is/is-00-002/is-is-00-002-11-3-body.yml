title: Repetição de manobras malsucedidas
text: '11.3 Repetição de manobras malsucedidas

  Caso o candidato obtenha, naqueles elementos de competência da FAP que não sejam

  considerados críticos, isto é, que não requeiram ação imediata e procedimentos

  memorizados, um desempenho inferior ao necessário para a aprovação, o examinador

  pode autorizar, a seu critério, uma nova tentativa. Nesse caso, deve ser observado o

  disposto no item 6.4.4.

  A fim de preservar a segurança da operação, uma nova tentativa não pode ser concedida

  nos casos em que a falha do candidato tenha implicado em condição insegura de voo ou

  tenha ocorrido em virtude do descumprimento de regras ou procedimentos

  estabelecidos.

  Independentemente do disposto no item 11.3.1, uma nova tentativa pode ser concedida

  pelo examinador nos seguintes: quando a execução de determinada manobra ou

  procedimento foi prejudicada ou interrompida devido a instruções dos órgãos de

  controle ou restrições de tráfego aéreo, condições meteorológicas adversas, ou outros

  fatores que interfiram na execução da manobra, quando o candidato não compreendeu

  adequadamente a intenção do examinador devido a uma falha de comunicação, ou ainda

  quando o examinador deixou de observar algum detalhe importante da execução da

  manobra ou procedimento. Dependendo da causa, o examinador deverá considerar ainda

  interromper o exame e retomá-lo em outra ocasião.'
