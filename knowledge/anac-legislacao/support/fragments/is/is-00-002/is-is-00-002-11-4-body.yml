title: Interrupção de exames
text: '11.4 Interrupção de exames

  Caso o examinador considere, após o início do voo, que as condições meteorológicas ou

  de tráfego aéreo não estejam mais propícias ou condizentes com o prosseguimento do

  voo, é facultado ao examinador optar pela interrupção temporária do exame.

  Uma vez interrompido o exame, o examinador deverá preencher as FAP

  correspondente, avaliando os itens que foram efetivamente realizados, e preenchendo os

  itens restantes como não realizados. Deverá preencher ainda o motivo da interrupção no

  campo de comentários.Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  O exame pode ser retomado no mesmo dia, ou em até 10 dias de sua interrupção. O

  examinador pode continuar o exame do ponto onde este fora interrompido, ou optar por

  realizar novamente alguma manobra ou procedimento. Deve ser preenchido novo

  conjunto de FAP, explicitando no campo de comentários que se trata da retomada do

  exame interrompido.

  O conjunto completo de FAP deve ser encaminhado para a ANAC.

  Caso haja necessidade de alteração do examinador, ou caso o prazo para a retomada

  previsto no item 11.4.3 seja excedido, deverá ser realizado um novo exame completo,

  sendo canceladas as FAP anteriores.'
