title: Exames para habilitação de instrutor de voo
text: '11.5 Exames para habilitação de instrutor de voo

  Os exames que concedem ou revalidam uma habilitação de instrutor de voo apresentam

  diferenças de fluxo e sequenciamento em relação aos demais.

  No início do exame, o examinador solicitará ao candidato que apresente uma

  explanação oral de assuntos selecionados e relevantes, referente à categoria de aeronave

  que corresponde à licença. No caso de um INVA, por exemplo, o examinador

  selecionará itens correspondentes a uma licença de Piloto Privado de Avião ou

  habilitação de classe MNTE.

  Num exame de concessão essa primeira fase será extensa, com a avaliação do candidato

  na instrução teórica em uma seleção abrangente de itens. Num exame de revalidação a

  seleção pode se limitar a três áreas distintas do conhecimento relevante.

  Após a avaliação da instrução oral (teórica), o examinador prosseguirá então com o

  exame oral habitual para avaliar as outras áreas de conhecimento, sem a necessidade de

  extensas explanações por parte do candidato.

  Após a aprovação no exame oral, o examinador selecionará os itens que serão realizados

  em voo, também correspondentes à categoria da aeronave. O candidato procederá com a

  realização dos briefings detalhados dos itens selecionados, tal como o faria para um

  aluno em instrução.

  Antes de iniciar o voo, o candidato deverá demonstrar que a aeronave se encontra

  aeronavegável, conforme o estabelecido no item 10. Deve, inclusive, explanar porque o

  voo tem condições de prosseguir, e quais são os itens que atestam tal condição,

  incluindo com a apresentação dos equipamentos e recursos de segurança disponíveis a

  bordo da aeronave.

  Durante o voo o candidato a instrutor deverá demonstrar a instrução das manobras

  selecionadas, sendo avaliado por sua técnica de demonstração e instrução, capacidade

  de correção de erros, uso apropriado de explanações orais durante o voo, gerenciamento

  do espaço aéreo e consciência situacional, e gerenciamento da segurança do voo.

  Após o voo, o candidato a instrutor realizará um debriefing apropriado às manobras

  realizadas, e realizará o preenchimento das fichas comumente utilizadas. Só então o

  examinador prosseguirá com o debriefing habitual do exame e preenchimento das FAP.Data de
  emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  Em virtude da extensão do exame, especialmente em casos de concessão, pode ser

  necessário ou desejável a interrupção do exame para posterior retomada. Nesse caso

  deverão ser seguidos os procedimentos do item 11.4.'
