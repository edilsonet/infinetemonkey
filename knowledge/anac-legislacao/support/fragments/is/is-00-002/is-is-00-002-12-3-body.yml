title: Tratando-se de exame em operador não certificado pela ANAC (aviação RBAC 91),
text: '12.3 Tratando-se de exame em operador não certificado pela ANAC (aviação RBAC 91),

  compete ao candidato aprovado manter guarda de sua FAP e utilizá-la para anexar a seu

  processo de licença, habilitação ou certificado perante a ANAC.'
