title: Tratando-se de exame em operador certificado pela ANAC (empresas de transporte
text: '13.4 Tratando-se de exame em operador certificado pela ANAC (empresas de transporte

  aéreo, centros de treinamento, aeroclubes, escolas, etc.), a via original da FAP deve ser

  arquivada pelo operador.'
