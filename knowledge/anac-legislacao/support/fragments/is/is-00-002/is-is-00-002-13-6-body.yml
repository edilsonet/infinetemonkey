title: Com base no Art. 163 do CBA e do RBAC nº 61, todas as habilitações relativas ao
text: '13.6 Com base no Art. 163 do CBA e do RBAC nº 61, todas as habilitações relativas ao

  exame que levou à reprovação serão automaticamente suspensas e, enquanto

  perdurarem as suspensões, o piloto não poderá exercer as prerrogativas correspondentes

  àquelas habilitações. As suspensões somente serão revogadas após o candidato ser

  aprovado em novo exame. Salvo informação adicional, não há impedimentos para o

  exercício das prerrogativas das demais habilitações que permanecerem válidas.'
