text: '14.1 O debriefing deve ocorrer após o exame, tenha ele resultado na aprovação ou

  reprovação do candidato. Nele, o examinador deve declarar ao candidato o resultado

  final do exame, bem como discutir os pontos fortes e fracos do candidato.'
