text: '14.4 A ANAC recomenda que o examinador tenha em mãos durante o debriefing uma cópia

  impressa ou digitalizada desta IS, incluindo seus Apêndices, como forma de demonstrar

  ao candidato o embasamento normativo para cada um dos procedimentos realizadosData de emissão:
  31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  durante o exame, bem como para sanar eventuais dúvidas de ambas as partes.'
