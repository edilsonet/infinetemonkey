cite: 2(a)
title: 2(a)
text: 'a) demonstrar as manobras ao aluno:

  i. introduzir manobras e informações novas de em porções que possam ser compreendidas

  e exercitadas pelo aluno, sem sobrecarregá-lo;

  ii. explicar cada manobra de maneira clara, concisa e sistemática;

  iii. unir explicação verbal e demonstração prática, de modo que o aluno consiga visualizar

  concretamente o que o instrutor está lhe ensinando;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  iv. na demonstração prática, realizar as manobras de maneira suave e coordenada,

  respeitando os padrões de execução e os limites de tolerância previstos nos apêndices B

  e C desta IS;

  v. explicar ao aluno qual o desempenho mínimo para cada manobra;'
