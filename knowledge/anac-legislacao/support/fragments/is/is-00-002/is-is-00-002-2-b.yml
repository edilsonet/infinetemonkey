title: 2(b)
text: 'b) monitorar a realização das manobras pelo aluno (prática sem assistência do instrutor):

  i. identificar as deficiências do candidato e fornecer feedback para que ele possa se

  corrigir e alcançar o padrão mínimo requerido;

  ii. fornecer demonstração adicional da manobra ou de fase dela, caso necessário;

  iii. encorajar o aluno a avaliar, por si mesmo, como está desempenhando a manobra;

  iv. tomar nota do desempenho do candidato para discussão no debriefing;'
