title: Documentos requeridos para a
text: '2. Documentos requeridos para a

  realização do voo

  3. - Conhecimentos técnicos da

  aeronave

  4. -

  Procedimentos normais,

  anormais e de emergência da

  aeronave

  5. - Cálculo de peso e

  balanceamento da aeronave

  6. -

  Cálculos de desempenho de

  pouso e decolagem da

  aeronave

  7. -

  Boletins ou notificações de

  segurança referentes à

  operação da aeronave,

  emitidos pelo fabricante, pela

  autoridade aeronáutica do país

  de origem ou pela ANAC

  8. -

  Leitura e interpretação de

  mensagens e cartas

  meteorológicas

  9. -

  Leitura e interpretação de

  publicações aeronáuticas

  (ROTAER, AIP, NOTAM, etc.)

  10. - Planejamento de voo

  Exame de voo

  Procedimentos gerais'
