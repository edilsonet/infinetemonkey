title: 2(c)
text: 'c) para as aeronaves “TIPO”, a execução das manobras fica a critério do examinador,
  caso

  este considere que o cenário operacional no qual o exame específico esteja inserido indique

  que as manobras possam ser realizadas com um nível de segurança operacional aceitável.

  Destaca-se que, nestes casos, a simulação da situação de emergência não poderá ser iniciada

  em altitude inferior à 1000 ft. Considera-se cumprido este item caso a simulação ocorra
  em

  qualquer fase de uma SID (carta de saída normalizada - voo por instrumentos).

  CIR.5 - Navegar a aeronave sob IFR'
