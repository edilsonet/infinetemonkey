title: 2(d)
text: 'd) com o auxílio de uma carta aeronáutica:

  i. identificar aeródromos presentes em sua rota e evitar conflitos com seu circuito de

  tráfego ou área de proteção designada (ATZ);

  ii. identificar os limites laterais e verticais dos espações aéreos controlados e manter-se

  fora de tais espaços;

  iii. identificar os limites laterais e verticais dos espaços aéreos condicionados e manter-

  se fora de tais espaços ou coordenar seu ingresso com os órgãos ATS;'
