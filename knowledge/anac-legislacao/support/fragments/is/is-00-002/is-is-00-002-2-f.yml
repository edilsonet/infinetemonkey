text: 'f) as manobras simuladas de operação monomotor não demandam o corte real de motor,

  devendo ser realizadas mediante a manutenção do motor inoperante em potência mínima

  (“idle”), sem a necessidade de embandeiramento, no caso de aeronaves propelidas a hélices.

  CIR.9 - Realizar uma aproximação para circular'
