title: 2(i)
text: 'i) identificar os possíveis riscos da operação, incluindo condições meteorológicas
  presentes ou

  futuras, obstáculos na área de aplicação, condições físicas, carga de trabalho prévia e
  fadiga

  dos envolvidos na operação, possível interferência da aplicação com áreas residenciais,
  áreas

  ambientalmente protegidas ou áreas de agricultura e pecuária sensíveis ao produto aplicado;'
