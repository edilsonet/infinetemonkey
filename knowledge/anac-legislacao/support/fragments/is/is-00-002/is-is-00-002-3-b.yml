title: 3(b)
text: 'b) os conhecimentos relativos ao abastecimento devem ser avaliados oralmente pelo examinador

  caso a aeronave não necessite ser reabastecida para o voo de exame (ex: solicitar ao candidato

  que indique onde se encontram os bocais de combustível, como abri-los e fechá-los

  corretamente, como aterrar a aeronave, como identificar se o combustível utilizado é o correto,

  etc.).Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H'
