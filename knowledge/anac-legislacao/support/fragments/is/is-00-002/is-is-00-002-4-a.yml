title: 4(a)
text: 'a) Campo reservado para o examinador incluir, caso entenda necessário, tarefas

  adicionais às que já estão previstas na respectiva FAP, com o intuito de aumentar a

  qualidade da avaliação. O examinador deve escrever o nome da manobra no campo

  em branco da coluna “Elemento de competência”.'
