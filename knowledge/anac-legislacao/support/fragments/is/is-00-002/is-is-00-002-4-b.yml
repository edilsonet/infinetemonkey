title: 4(b)
text: 'b) considerações aerodinâmicas relacionadas a voo lento, glissada, estóis, parafusos,
  curvas de

  grande inclinação e atitudes anormais da aeronave, incluindo:

  i. indícios do estol e comportamento da aeronave durante o estol e sua recuperação;

  ii. relação entre ângulo de ataque e estol;

  iii. efeitos do peso, força g e ângulo de ataque;

  iv. perigos do voo não coordenado;

  v. importância de se reduzir o ângulo de ataque para recuperar a aeronave do estol;

  vi. uso dos comandos de voo durante o estol;

  vii. considerações quanto ao estado energético total da aeronave (trocas entre velocidade

  e altura);

  viii. como converter velocidade em altura;

  ix. como converter altura em velocidade;

  x. limites estruturais de força g;

  xi. causas do aumento da velocidade de estol durante curvas;

  xii. efeitos das manobras nos sistemas de combustível, flapes, sistemas giroscópicos e

  pitot.'
