text: 'c) componentes de um sistema de rádio aeronáutico:Data de emissão: 31 de dezembro de
  2024

  IS nº 00-002

  Revisão H

  i. sistema de energização do rádio (master da aeronave, master de aviônicos, bateria, etc.);

  ii. microfone;

  iii. transmissor;

  iv. receptor;

  v. antena;

  vi. headphones e alto-falantes;

  vii. procedimentos para utilizar o rádio;

  viii. uso dos switches de seleção de canais (VHF, HF, Intercom, PA);

  ix. como ligar e desligar o rádio;

  x. como selecionar frequências no rádio;

  xi. uso do controle de squelch;

  xii. uso adequado do microfone.'
