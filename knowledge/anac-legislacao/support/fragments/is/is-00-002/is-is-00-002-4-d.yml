text: 'd) para navegação por satélite (GNSS):

  i. princípios de operação, desempenho e erros de um sistema GNSS;

  ii. métodos para determinar a posição da aeronave utilizando o GNSS;

  iii. procedimentos para uso do GNSS e salvaguardas contra erros de navegação e perda

  de consciência situacional;

  iv. procedimentos tipicamente realizados em uma navegação GNSS;

  v. indicadores da passagem de waypoints;

  vi. verificações operacionais e de manutenção necessárias em equipamentos GNSS;

  vii. fatores humanos relacionados com o uso do GNSS;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  viii. requisitos regulamentares para a realização de uma operação GNSS;'
