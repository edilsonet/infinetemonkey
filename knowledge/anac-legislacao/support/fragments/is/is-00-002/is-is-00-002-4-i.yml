cite: 4(i)
title: 4(i)
text: 'i) gerenciamento de tarefas, incluindo:

  i. organização da carga de trabalho e definição de prioridades;

  ii. planejamento de eventos de forma que ocorram em uma sequência lógica;

  iii. antecipação de eventos para garantir que haja oportunidade para a conclusão das

  tarefas planejadas;

  iv. uso da tecnologia disponível;

  v. priorização e proteção de tarefas simultaneamente ao recebimento e filtragem de

  estímulos externos recebidos.

  MCO Gerenciar o voo durante operações com tripulação múltipla'
