text: 'z) fatores que afetam a integridade estrutural do avião (NOTA: a integridade não é
  assegurada

  somente pela operação em ou abaixo da velocidade máxima de manobra; a integridade pode

  ser comprometida, mesmo abaixo de tal velocidade, se o piloto aplica múltiplos comandos

  simultâneos em um mesmo eixo ou aplica deflexão total simultânea dos comandos em mais

  de um eixo).

  III.2 CATEGORIA HELICÓPTERO

  H1 - Controlar o helicóptero no solo - estacionário'
