text: '5.1 Introdução

  Esta IS contém os padrões, políticas, procedimentos e diretrizes a serem seguidos pelos

  examinadores designados pela ANAC para conduzir exames de proficiência de pilotos.

  No exercício de suas atividades, a responsabilidade primária dos examinadores é zelar

  pela segurança do sistema de aviação civil brasileiro.

  Os operadores aéreos ou organizações de instrução/treinamento que possuírem um

  programa de instrução/treinamento aprovado pela ANAC podem propor, no âmbito do

  programa aprovado, que a verificação de proficiência do candidato seja realizada de

  maneira alternativa ao previsto nesta IS. O método alternativo depende de aprovação da

  ANAC, e deve ser capaz de assegurar a proficiência dos candidatos aprovados em nível,

  no mínimo, equivalente ao previsto nesta IS.Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H'
