title: Como utilizar esta IS
text: '5.2 Como utilizar esta IS

  O corpo principal desta IS (isto é, as seções 1 a 19) fornece orientações gerais aplicáveis

  a todos os exames de proficiência de pilotos.

  O Apêndice A desta IS identifica quais conteúdos, manobras e procedimentos aplicáveis

  a cada tipo de exame, por meio das Fichas de Avaliação de Pilotos - FAP. As FAP são

  formulários (checklists) de preenchimento obrigatório pelos examinadores, para cada

  exame de proficiência que conduzirem.

  O Apêndice B, por sua vez, contém um glossário que detalha quais competências o

  candidato deve demonstrar em cada item da FAP para que seu desempenho seja

  considerado satisfatório.

  O Apêndice C contém as margens de tolerância admissíveis durante a realização das

  manobras em voo. A realização de qualquer manobra com desvios superiores às

  tolerâncias previstas neste Apêndice ensejará a reprovação do candidato.

  O Apêndice D apresenta o “Checklist do examinador”, um auxílio de uso facultativo

  que tem por objetivo auxiliar os examinadores a se recordarem de todos os

  procedimentos de sua responsabilidade no decorrer de um exame, desde a preparação

  até a conclusão.

  Por fim, o Apêndice E traz o “Checklist do candidato”, também de uso facultativo e que

  se propõe a auxiliar os candidatos a não se esquecerem dos documentos pessoais e de

  voo necessários no dia do exame.'
