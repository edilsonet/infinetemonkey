text: '5.3 Obrigações dos examinadores

  A realização dos exames de proficiência é uma atividade de grande importância para a

  segurança e qualidade do sistema de aviação civil brasileiro. Por isso, o examinador

  deve agir com profissionalismo, alto nível de conhecimento e absoluta convicção da

  importância de sua função, para que saiba manter sua integridade técnica mesmo em

  face de pressões em contrário.

  Ao atuar como examinador, o piloto assume uma posição de destaque na comunidade

  de aviação, e torna-se capaz de influenciar positivamente a habilidade, os

  conhecimentos, comportamentos e atitudes dos demais pilotos.

  Por isso, a ANAC requer que os examinadores:'
