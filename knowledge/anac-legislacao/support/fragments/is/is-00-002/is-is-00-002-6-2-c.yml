title: 6.2(c)
text: 'c) Deficiências do manual de curso e do programa de instrução aplicável.

  O monitoramento dessas informações permite à ANAC e às organizações de

  instrução/treinamento focar esforços para a atualização dos manuais de curso, dos

  programas de instrução/treinamento e dos exames de proficiência. Permite ainda ao

  candidato conhecer suas deficiências e aperfeiçoar-se para os próximos exames.'
