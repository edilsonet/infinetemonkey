title: Fases do processo de avaliação
text: '6.3 Fases do processo de avaliação

  O processo de avaliação pode ser detalhado em 5 etapas:

  1 - Identificação dos objetivos: O primeiro passo é identificar quais são os objetivos

  da avaliação. Em outras palavras, o examinador deve saber com clareza se o exame que

  conduzirá terá por objetivo a concessão de uma licença, revalidação de uma habilitação,

  o credenciamento de examinador, etc.

  2 - Identificação dos padrões aplicáveis: Com os objetivos do exame definidos, é

  preciso agora identificar qual o padrão de desempenho se espera que o candidato

  apresente para ser bem sucedido. Em termos práticos, isso consiste em identificar quais

  procedimentos e manobras devem ser realizados durante o exame e qual o desempenho

  mínimo esperado para cada um deles. Essas informações se encontram nos Apêndices

  A, B e C desta IS.Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  3 - Execução: O candidato é solicitado pelo examinador a realizar os procedimentos e

  manobras.

  4 - Observação: O examinador observa o desempenho do candidato e compara com os

  padrões mínimos aplicáveis.

  5 - Julgamento: O examinador determina se o desempenho do candidato atende ao

  mínimo requerido e o julga “Aprovado” ou “Reprovado” no exame.'
