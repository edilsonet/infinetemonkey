title: Confiabilidade da avaliação
text: '6.4 Confiabilidade da avaliação

  Uma avaliação confiável é aquela que fornece resultados consistentes. No contexto do

  exame de proficiência, isso significa que dois candidatos que possuam desempenho

  idêntico devem obter o mesmo resultado final, independentemente de quem aplique seu

  exame.

  Fatores humanos, tanto do examinador quanto do candidato, podem interferir

  significativamente na confiabilidade de uma avaliação. São exemplos de alguns desses

  fatores:'
