cite: 6.4(e)
title: 6.4(e)
text: 'e) Estresse e nervosismo - o exame de proficiência por si só pode ser um fator que

  induza ansiedade no candidato.

  Os examinadores devem ficar atentos à influência desses fatores e agir para evitá-los ou

  limitar seus efeitos.

  Outro fator importante para a confiabilidade da avaliação é que o exame de proficiência

  não seja confundido com instrução de voo. A repetição excessiva de manobras

  malsucedidas durante o exame pode mascarar o desempenho real do candidato, já que a

  cada realização malsucedida ele está também praticando a manobra, o que pode lhe

  fornecer uma capacidade temporária de atingir os mínimos requeridos para aprovação,

  mas sem que isso seja uma característica consistente de sua pilotagem.'
