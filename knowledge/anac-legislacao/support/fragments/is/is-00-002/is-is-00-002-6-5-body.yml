title: Validade da avaliação
text: '6.5 Validade da avaliação

  Uma avaliação é válida se ela mede tudo aquilo que ela deve medir, e nada além disso.

  O escopo de um exame de proficiência deve ser exatamente aquele definido pela

  ANAC, seguindo-se os padrões mínimos definidos pela ANAC, pois de um lado isso

  garante que o candidato será avaliado em todas as competências necessárias e de outro

  garante que o examinador não extrapolará o requerido pela ANAC.Data de emissão: 31 de dezembro
  de 2024

  IS nº 00-002

  Revisão H'
