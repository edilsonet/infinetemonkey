title: Discriminação
text: '6.7 Discriminação

  Discriminação é a capacidade da avaliação de detectar diferentes níveis de desempenho

  entre os candidatos. O exame de proficiência de pilotos fornece uma discriminação

  bastante simples, pois distingue os candidatos somente entre “Aprovados” e

  “Reprovados”, sem gradação entre eles. Isso ocorre porque o objetivo do exame não é

  comparar pilotos entre si, mas sim identificar se um determinado piloto possui ou não o

  nível mínimo de proficiência requerido pela ANAC.'
