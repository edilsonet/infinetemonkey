title: 6.9(a)
text: 'a) Erro de tendência central: O examinador tende a avaliar o desempenho dos

  candidatos como “mediano”, se eximindo de proferir conceitos claros como “bom”

  ou “ruim”. Por um lado, o examinador não se permite avaliar o desempenho como

  bom, pois sempre considera que o piloto pode melhorar em algo, mas por outro,

  também não avalia o desempenho como ruim por se preocupar com a possível

  reação emocional do candidato. Esse erro é mais comum quando o examinador é

  inexperiente, ou com os que se preocupam com “o que os outros vão pensar”, em

  detrimento da verdade e, em última instância, da isonomia entre os candidatos.'
