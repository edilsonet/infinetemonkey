title: 6.9(d)
text: 'd) Efeito Halo/Horn: Ocorre quando o examinador deixa sua impressão pessoal a

  respeito do candidato influenciar sua avaliação. Se a impressão geral do examinador

  sobre uma pessoa é boa, ele tende a apreciá-la com benevolência, estendendo a

  impressão positiva aos demais itens da avaliação (Efeito Halo). Se, ao contrário, aData
  de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  impressão geral do examinador sobre o indivíduo é ruim, ele tende a avaliá-lo com

  excesso de rigor, estendendo a impressão negativa aos demais itens da avaliação

  (Efeito Horn). Pode ocorrer também que a avaliação de um fator específico

  contamine a avaliação dos outros, seja de forma positiva ou negativa, distorcendo a

  avaliação de cada fator isoladamente.'
