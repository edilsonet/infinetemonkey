title: 6.9(e)
text: 'e) Erro de semelhança (auto-identificação): Ocorre quando um avaliador adota uma

  postura de tendência favorável à pessoa que está sendo avaliada devido a uma

  empatia que se estabelece entre ambos, seja por se parecem fisicamente, seja pelas

  características profissionais, pelos interesses pessoais, pela formação na mesma

  faculdade ou por pertencerem ao mesmo grupo social.

  Apesar de, na teoria, os erros parecerem óbvios e facilmente evitáveis, na prática todos

  os examinadores podem estar sujeitos a cometer um ou mais deles sem sequer perceber.

  Por isso, é importante que os examinadores façam um esforço consciente para evitá-los,

  buscando sempre atuar de maneira objetiva e com base nos critérios publicados pela

  ANAC.

  Buscar trocar informações com outros examinadores e com a comunidade, a fim de

  identificar critérios comuns de avaliação de desempenho, é essencial para reduzir a

  influência dessas características pessoais nos processos de avaliação.'
