title: Todo exame de proficiência deve iniciar-se por um exame oral, que tem por objetivo
text: '8.1 Todo exame de proficiência deve iniciar-se por um exame oral, que tem por objetivo

  avaliar se o candidato possui os conhecimentos requeridos para a função que pretende

  exercer. Esse exame deve ser realizado de maneira completa tanto nos exames iniciais

  quanto nos de revalidação.'
