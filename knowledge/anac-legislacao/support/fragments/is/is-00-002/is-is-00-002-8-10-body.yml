title: O candidato só pode prosseguir para a execução do exame de voo se tiver respondido
text: '8.10 O candidato só pode prosseguir para a execução do exame de voo se tiver respondido

  satisfatoriamente às questões formuladas sobre cada item de avaliação oral da FAP,

  conforme avaliação do examinador sobre o nível de conhecimento do candidato. Caso

  isso não ocorra, o candidato deve ser considerado reprovado e o exame deve ser

  encerrado. O examinador deverá anotar na FAP em quais áreas do conhecimento o

  desempenho do candidato foi considerado insuficiente ao responder às questões.'
