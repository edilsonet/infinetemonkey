text: '8.11 Além disso, o candidato deve ser reprovado caso não responda corretamente a qualquer

  questão cujo desconhecimento, a critério do examinador, comprometa criticamente a

  segurança operacional, tais como realização de peso e balanceamento, velocidades

  críticas de operação da aeronave, memory items previstos no manual da aeronave, etc.'
