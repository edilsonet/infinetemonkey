title: O conteúdo aplicável a cada exame oral se encontra previsto nas FAP (Apêndice A
text: '8.2 O conteúdo aplicável a cada exame oral se encontra previsto nas FAP (Apêndice A

  desta IS). O examinador deve elaborar questões que abordem todo o conteúdo previsto,

  mas que não o extrapolem.'
