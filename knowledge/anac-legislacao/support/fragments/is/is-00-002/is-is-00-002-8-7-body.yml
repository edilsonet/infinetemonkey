title: 'A tabela abaixo traz alguns exemplos de questões adequadas e inadequadas:'
text: '8.7 A tabela abaixo traz alguns exemplos de questões adequadas e inadequadas:

  Questões adequadas Questões inadequadas

  Fácil compreensão

  Descreva qual o efeito do vento de través

  na decolagem e como o piloto pode

  corrigi-lo.

  Confusa

  Se você fosse decolar com vento de

  través, como a aeronave reagiria?

  Usa termos comuns para o contexto

  (no exemplo, um exame de Piloto

  Privado)

  Descreva quais seriam suas ações

  imediatas em caso de pane de motor

  durante a corrida de decolagem.

  Usa termos não usuais para o contexto

  (no exemplo, um exame de Piloto

  Privado)

  Descreva os memory items previstos no

  AFM em caso de uma RTO.

  Promove o raciocínio

  Em uma pane total dos motores, por que é

  importante manter a velocidade de

  melhor planeio?

  Resposta SIM/NÃO

  Manter a velocidade de melhor planeio é

  importante em caso de pane dos motores?Data de emissão: 31 de dezembro de 2024

