text: '8.8 O papel do examinador é diferente do papel do instrutor. Ao instrutor cabe explicar
  e

  demonstrar, ao passo que ao examinador compete somente observar e avaliar. Por

  isso, o examinador não deve direcionar o candidato à resposta correta, e deve sempre

  exigir respostas completas.'
