title: 9.1(b)
text: 'b) Aeródromos utilizados: repassar quais serão os aeródromos utilizados durante o

  exame e quais tipos de pouso serão realizados em cada um deles, bem como as

  eventuais condições que serão simuladas (ex: obstáculos na cabeceira, pista reduzida

  para pouso curto, superfície macia (terra, grama, areia, etc.)).'
