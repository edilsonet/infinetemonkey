subsection_id: d
cite: 9.1(d)
title: 9.1(d)
text: 'd) Definir o Piloto em Comando (PIC): definir quem será o piloto em comando para

  fins regulamentares. O PIC poderá ser o candidato, o examinador ou um terceiro

  piloto, desde que cumpra todos os requisitos pertinentes a essa função (CMA válido,

  habilitações válidas, endossos e experiência recente). É importante lembrar que o

  PIC necessariamente deverá ocupar um dos assentos de pilotagem da aeronave.'
