title: 9.1(f)
text: 'f) Transferência de controles: em nenhum momento do voo pode haver dúvidas

  sobre quem está no controle da aeronave. Examinador e candidato devem

  estabelecer uma fraseologia para ser utilizada a cada transferência de controles (ex:

  “controles comigo”/“controles com você”).'
