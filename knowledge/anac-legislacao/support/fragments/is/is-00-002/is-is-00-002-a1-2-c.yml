text: 'c) realizar as verificações apropriadas durante o táxi, conforme previsto no manual
  da aeronave,

  incluindo:

  i. freios e controle direcional;

  ii. leitura e funcionamento dos instrumentos;

  iii. ajuste de altímetro.'
