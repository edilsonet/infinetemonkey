title: A3.2(d)
text: 'd) executar as manobras a seguir dentro dos parâmetros constantes do Apêndice C desta
  IS,

  aplicando os comandos com suavidade e mantendo a aeronave corretamente configurada e

  compensada:

  i. voo de cruzeiro normal;

  ii. voo de cruzeiro em regime de alta potência;

  iii. aceleração e desaceleração da aeronave;

  iv. voo de cruzeiro em regime de maior alcance;

  v. voo de cruzeiro em regime de maior autonomia;

  vi. voo com flapes aplicados.'
