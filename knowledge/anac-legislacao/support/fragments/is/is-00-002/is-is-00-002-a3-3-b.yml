text: 'b) executar as manobras a seguir dentro dos parâmetros constantes do Apêndice C desta
  IS,

  aplicando os comandos com suavidade e mantendo a aeronave corretamente configurada e

  compensada:

  i. descida em planeio;

  ii. descida com potência;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  iii. descida em configuração para pouso (flapes e trem de pouso aplicados).'
