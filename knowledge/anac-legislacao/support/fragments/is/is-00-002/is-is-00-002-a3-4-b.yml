title: A3.4(b)
text: 'b) executar as manobras a seguir dentro dos parâmetros constantes do Apêndice C desta
  IS,

  aplicando os comandos com suavidade e mantendo a aeronave corretamente configurada e

  compensada:

  i. curvas niveladas;

  ii. curvas ascendentes;

  iii. curvas descendentes;

  iv. curvas descendentes em planeio.'
