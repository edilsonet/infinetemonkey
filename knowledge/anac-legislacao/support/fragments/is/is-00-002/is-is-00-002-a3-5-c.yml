section_title: '- Controlar a aeronave em voo lento'
subsection_id: c
cite: A3.5(c)
title: A3.5(c)
text: 'c) exceto para aviões multimotores, executar as manobras a seguir dentro dos parâmetros

  constantes do Apêndice C desta IS, aplicando os comandos com suavidade e mantendo a

  aeronave corretamente configurada e compensada:

  i. voo na velocidade de aproximação mínima com flapes retraídos;

  ii. voo na velocidade de aproximação mínima com flapes e trem de pouso estendidos.'
