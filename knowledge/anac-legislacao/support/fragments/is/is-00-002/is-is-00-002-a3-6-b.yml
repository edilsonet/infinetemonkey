cite: A3.6(b)
title: A3.6(b)
text: 'b) seguindo o procedimento de tráfego local, realizar com segurança um circuito de
  tráfego

  completo e executar as manobras a seguir dentro dos parâmetros constantes do Apêndice C

  desta IS, aplicando os comandos com suavidade e mantendo a aeronave corretamente

  configurada e compensada:

  i. estabelecer e manter as pernas contra o vento e de través;

  ii. estabelecer e manter a perna do vento paralela à pista e com um afastamento constante

  em relação a esta;

  iii. estabelecer e manter a perna base a 90º da pista e com um afastamento constante em

  relação a esta.'
