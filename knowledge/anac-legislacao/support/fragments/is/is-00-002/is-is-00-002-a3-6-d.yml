section_title: '- Realizar circuitos de tráfego e aproximações'
subsection_id: d
cite: A3.6(d)
title: A3.6(d)
text: 'd) realizar as seguintes manobras para conduzir a aeronave para o pouso:

  i. identificar o ponto do circuito mais adequado para iniciar uma trajetória de descida

  constante, levando em conta eventuais prolongamentos requeridos para evitar conflitos

  de tráfego;

  ii. identificar corretamente a pista a ser utilizada para pouso e alinhar a trajetória final
  da

  aeronave para o pouso;

  iii. estar com a aeronave configurada para pouso e estabilizada ao atingir 500ft AGL;

  iv. identificar e manter um ponto de visada na pista para o pouso;

  v. manter uma velocidade de aproximação não inferior a 1.3Vs até o arredondamento para

  o pouso;

  vi. identificar as condições de vento presentes e corrigir adequadamente seus efeitos sobre

  a aeronave;

  vii. conceder margem de segurança na velocidade de aproximação como precaução em

  caso de rajadas ou tesouras de vento.'
