title: A4.1(b)
text: 'b) transicionar entre a aproximação final e o toque de maneira controlada e suave,
  incluindo:

  i. controlar a flutuação durante o arredondamento (flare);

  ii. tocar a pista a uma razão de descida controlada e suave, dentro dos limites de tolerânciaData
  de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  do Apêndice C em relação ao ponto de toque designado;

  iii. controlar a aeronave de modo a evitar um “pouso quicado” (bounced landing);

  iv. tocar dentro dos limites de tolerância do Apêndice C em relação à linha central da

  pista.'
