title: A4.4(b)
text: 'b) iniciar a arremetida com suavidade e mantendo o controle da aeronave e o alinhamento
  com

  a pista, incluindo os seguintes procedimentos:Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  i. selecionar potência, atitude e configuração corretas;

  ii. estar atento e evitar quaisquer obstáculos no terreno;

  iii. considerar os efeitos do vento na trajetória de arremetida;

  iv. evitar conflito com tráfego local e com as respectivas esteiras de turbulência.'
