text: 'd) recuperar a aeronave do estol, por meio dos seguintes procedimentos:

  i. reduzir o ângulo de ataque;

  ii. utilizar a potência e altitude disponíveis, conforme necessário, para aumentar aData
  de emissão: 31 de dezembro de 2024

