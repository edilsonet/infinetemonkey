text: 'a) realizar glissada frontal:

  i. de modo a obter razão de descida acentuada, enquanto mantém constantes o rumo e a

  velocidade aerodinâmica; e

  ii. controlando a razão de descida através da coordenação entre ailerons e pedal.'
