section_title: '- Realizar um pouso forçado'
subsection_id: a
cite: A6.3(a)
title: A6.3(a)
text: 'a) em uma simulação de pane total de motor, realizar os seguintes itens:

  i. identificar corretamente a situação de pane total de motor;

  ii. realizar as ações de memória previstas no manual da aeronave;

  iii. formular e descrever um plano de ação, incluindo a seleção da área de pouso mais

  adequada;

  iv. estabelecer trajetória de planeio ideal para posicionar o avião para o pouso na área
  de

  pouso selecionada;

  v. executar demais procedimentos de emergência, conforme o tempo permitir;

  vi. informar intenções ao ATS, se o tempo permitir;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  vii. orientar os passageiros a ajustar os cintos de segurança e adotar a posição de impacto;

  viii. pousar o avião garantindo o resultado mais seguro possível.'
