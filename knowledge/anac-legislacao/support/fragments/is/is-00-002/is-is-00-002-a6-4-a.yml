section_title: '- Realizar um pouso de precaução fora de aeródromo'
subsection_id: a
cite: A6.4(a)
title: A6.4(a)
text: 'a) em uma simulação de situação técnica ou meteorológica em que seja recomendável realizar

  um pouso fora de aeródromo, realizar os seguintes itens:

  i. avaliar as circunstâncias de voo e tomar uma decisão apropriada sobre a necessidade de

  realizar um pouso de precaução fora de aeródromo;

  ii. pesquisar a área para identificar um local de pouso de precaução adequado;

  iii. selecionar área de pouso, realizar uma inspeção visual de suas condições e avaliar
  a

  sua aptidão para o pouso, tendo em conta:

  (A) áreas de aproximação e pouso livres de obstáculos;

  (B) comprimento e largura da área de pouso adequados para o tipo de avião;

  (C) superfície da área de pouso adequada para o tipo de avião e livre de obstáculos.

  iv. manter a orientação e contato visual com a área de pouso;

  v. informar intenções ao ATS, se o tempo permitir;

  vi. orientar os passageiros a ajustar os cintos de segurança e adotar a posição de impacto.'
