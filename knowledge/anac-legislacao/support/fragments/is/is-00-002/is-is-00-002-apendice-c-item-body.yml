text: 'Apêndice C - Item

  III - Margens de

  tolerância para voo

  por instrumentos -

  Aproximação sem

  guia vertical:

  Ajustado para 0,5

  nm em um arco

  DME ou arco

  GNSS entende-se

  que este parâmetro

  mais adequado para

  avaliar o piloto na

  condução do voo

  por instrumentos

  Item 16: Lista de

  Apêndices alterada

  Removido'
