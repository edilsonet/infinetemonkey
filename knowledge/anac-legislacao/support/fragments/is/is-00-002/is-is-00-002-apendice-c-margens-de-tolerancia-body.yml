  III TOLERÂNCIAS PARA VOO POR INSTRUMENTOS

  Esta tabela se aplica a todas as concessões e revalidações de uma habilitação de voo por

  instrumentos.

  Adicionalmente, aos exames de voo por instrumentos aplicam-se também as tolerâncias

  constantes dos itens I e II deste Apêndice.

  Manobra ou procedimento Tolerâncias

  Aproximação sem guia vertical

  +-5º do curso designado

  +- metade da deflexão máxima da escala do CDI

  Dentro dos valores máximos de RNP aplicáveis

  stall

  Aproximação com guia vertical

  Todos os mínimos laterais especificados acima

  +- metade da deflexão máxima da escala da guia vertical no

  instrumento utilizado; ou

  +- 75ft em um procedimento BARO VNAV

