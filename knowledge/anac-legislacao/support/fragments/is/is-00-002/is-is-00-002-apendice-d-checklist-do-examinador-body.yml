title: APÊNDICE D - CHECKLIST DO EXAMINADOR
text: 'APÊNDICE D - CHECKLIST DO EXAMINADOR

  Não é necessária a apresentação deste à ANAC.

  Conforme o Decreto 9.094/2017, somente se exigirá que o candidato apresente as informações
  básicas de

  identificação. Todas as informações que constem em sistemas do governo federal devem ser
  neles obtidas, a partir dos

  dados básicos fornecidos pelo candidato.

  Marcar ✓ nos itens concluídos. Marcar N nos itens não aplicáveis

  Preparação para o exame

  Relógio

  Caneta, papel de rascunho e prancheta para anotações em voo

  FAPs impressas

  Planejar cenário do exame (questões orais, rota, duração estimada, panes simuladas previstas)

  Documentos do candidato

  Documento de identidade com foto.

  CANAC

  CHT e CMA válido (verificar em http://www2.anac.gov.br/consultasdelicencas/consultas2.asp)

  Horas em CIV e declarações de instrução correspondem à licença/habilitação pretendida e,
  caso

  requerido, o candidato possui os endossos detalhados na IS 61-006

  Aeronave

  Todos os instrumentos requeridos em bom estado de funcionamento (vide RBAC 91, seção 91.205)

  Sem pendências no RAB (http://www2.anac.gov.br/aeronaves/cons_rab.asp)

  Diário de bordo e registros de manutenção atualizados

  Certificados de matrícula e aeronavegabilidade

  Apólice de seguro válida

  Ficha de inspeção anual de manutenção

  Licença da estação de rádio (ANATEL).

  Manual de voo original e checklists

  NSCA 3-13

  FSTD

  Qualificação ANAC válida

  (http://www.anac.gov.br/assuntos/setor-regulado/empresas/simuladores-de-voo-fstd/simuladores-de-voo-fstd)

  Após o exame

  Entregar FAP original ao candidato(exceto exames de credenciamento de examinador); obter
  cópia

  impressa ou digital para controle pessoal

  Preencher FAP eletrônica em até 5 dias corridosData de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H'
