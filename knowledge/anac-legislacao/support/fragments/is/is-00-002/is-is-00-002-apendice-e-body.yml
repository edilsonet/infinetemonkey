cite: apendice-e
title: Apêndice E -
text: 'Apêndice E -

  Aeronave:

  Corrigida a

  referência de

  Inserção da FAP 12, revisão do

  texto para informar a

  necessidade do cheque IFR em

  CIAC em duas etapas em virtude

  da revogação da IS 61-002,

  inclusão do fluxo e

  sequenciamento de um exame de

  instrutor de voo,

  correções em função da

  publicação do RBAC 91, ajustes

  para melhor refletir o ambiente

  operacional do voo de cheque,

  adicionados procedimentos para

  interrupção e retomada de

  exames, e remoção do Apêndice

  F devido a existência prévia

  desse controle no item 18.Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  RBHA 91 para

  RBAC 91

  Item 13.1 f:

  alterado para

  consistência do

  resultado do exame'
