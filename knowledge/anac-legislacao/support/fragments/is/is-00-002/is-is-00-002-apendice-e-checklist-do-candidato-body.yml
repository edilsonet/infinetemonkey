title: APÊNDICE E - CHECKLIST DO CANDIDATO
text: 'APÊNDICE E - CHECKLIST DO CANDIDATO

  Não é necessária a apresentação deste à ANAC.

  Conforme o Decreto 9.094/2017, somente se exigirá que o candidato apresente as informações
  básicas de

  identificação. Todas as informações que constem em sistemas do governo federal devem ser
  neles obtidas, a

  partir dos dados básicos fornecidos pelo candidato.

  Marcar ✓ nos itens concluídos. Marcar N nos itens não aplicáveis

  Preparação para o exame

  Relógio

  Caneta, papel de rascunho e prancheta para anotações em voo

  Planejamento do voo (rota e tempo de voo previstos (se navegação), peso e balanceamento,
  combustível)

  Cartas aeronáuticas

  ROTAER, AIP Brasil e formulário de Plano de Voo (aceitáveis em versão digital; desnecessários
  caso

  sejam disponibilizados no aeródromo de partida)

  Documentos pessoais

  Documento de identidade com foto

  CANAC

  Horas em CIV e declarações de instrução que comprovem os requisitos para a licença/habilitação

  pretendida e, caso requerido, o candidato possui os endossos dos instrutores nos moldes
  da IS 61-006

  Aeronave

  Todos os instrumentos requeridos em bom estado de funcionamento (vide RBAC 91, seção 91.205)

  Verificar pendências no RAB (http://www2.anac.gov.br/aeronaves/cons_rab.asp)

  Diário de bordo e registros de manutenção atualizados

  Certificados de matrícula e aeronavegabilidade

  Apólice de seguro válida

  Ficha de inspeção anual de manutenção

  Licença da estação de rádio (ANATEL).

  Manual de voo original e checklists

  NSCA 3-13

  FSTD

  Qualificação ANAC válida - verificar no sistema (não é necessário apresentar comprovante)

  (http://www.anac.gov.br/assuntos/setor-regulado/empresas/simuladores-de-voo-fstd/simuladores-de-voo-fstd)

  Após o exame

  Receber a FAP original do examinador (exceto exames de credenciamento de examinador)'
