section_title: '- Realizar procedimentos pré-voo'
subsection_id: b
cite: C2.1(b)
title: C2.1(b)
text: 'b) obter, interpretar e aplicar informações contidas nas publicações consultadas antes
  do voo,

  incluindo:

  i. lista de equipamentos mínimos (MEL), quando houver;

  ii. liberação da manutenção ou registros no Diário de Bordo que indiquem não haver

  pendências de manutenção para a aeronave;

  iii. previsão meteorológica;

  iv. boletins de observação meteorológica;

  v. NOTAM;

  vi. Informações de RAIM (Receiver Autonomous Integrity Monotoring) para os

  equipamentos GNSS;

  vii. ROTAER; e

  viii. AIP.'
