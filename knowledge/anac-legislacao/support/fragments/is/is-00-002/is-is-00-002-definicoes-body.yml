title: 'definições:'
text: 'definições:

  Candidato - Qualquer pessoa que seja avaliada por um examinador.

  Examinador - Qualquer pessoa que seja credenciada ou designada pela ANAC para

  conduzir exames de proficiência de pilotos.

  Exame de proficiência (também chamado simplesmente de exame ou cheque) - É o

  processo de avaliar, por meio de uma demonstração teórica e prática, se um candidato

  possui conhecimentos, habilidades e atitudes requeridas pela ANAC para determinada

  licença, habilitação ou certificado. Subdivide-se nas fases de Exame oral e Exame de

  voo.

  Elemento de competência - Qualquer tarefa, manobra ou exercício listado na FAP.

  Ficha de Avaliação de Pilotos (FAP) - É o relatório oficial preenchido pelo examinador

  para declarar o resultado do exame, cujo formato padronizado se encontra previsto nesta

  IS.

  Pode - Usado para indicar um item discricionário.

  Deve - Usado para indicar um item obrigatório.'
