title: G1.1(b)
text: 'b) obter, interpretar e aplicar as informações necessárias para a realização do voo
  com segurança

  consultando, no mínimo:

  i. documentos/revisões que atestem a liberação da aeronave para voo pelo pessoal

  de manutenção;

  ii. boletins e previsões meteorológicas aeronáuticas;

  iii. NOTAMs;

  iv. cartas aeronáuticas aplicáveis ao voo;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  v. ROTAER e AIP, conforme aplicável.'
