title: G3.2(b)
text: 'b) ser capaz de manter voo reto e nivelado em todas as seguintes configurações de voo:

  i. velocidade reduzida;

  ii. velocidade normal de cruzeiro;

  iii. velocidade elevada;

  iv. velocidade de máximo alcance;

  v. aeronave configurada com flapes.Data de emissão: 31 de dezembro de 2024

