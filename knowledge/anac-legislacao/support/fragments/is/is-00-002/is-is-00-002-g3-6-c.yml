cite: G3.6(c)
title: G3.6(c)
text: 'c) realizar uma aproximação para pouso:

  i. iniciar e manter uma descida controlada, em uma trajetória adequada para atingir a pista;

  ii. ajustar o ponto de início da descida conforme necessário para ajustar-se ao tráfego

  presente no circuito e na pista;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  iii. estabelecer e manter a aeronave em uma final para pouso alinhada com a pista;

  iv. configurar a aeronave para o pouso;

  v. identificar e manter um ponto de visada na pista;

  vi. manter uma aproximação estabilizada até o momento do início do flare;

  vii. compensar o vento e manter a aeronave em uma trajetória final alinhada com a pista;

  viii. manter margens de segurança na velocidade para eventuais rajadas de vento;'
