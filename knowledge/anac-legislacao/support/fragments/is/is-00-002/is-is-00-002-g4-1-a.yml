title: G4.1(a)
text: 'a) transicionar entre a aproximação final e o toque na pista de maneira suave e controlada,

  incluindo:

  i. controlar a flutuação e evitar pouso “quicado” (bounced landing);Data de emissão: 31
  de dezembro de 2024

  IS nº 00-002

  Revisão H

  ii. tocar a pista com uma razão de descida controlada e adequada, dentro da área de pouso

  especificada (conforme margens de tolerâncias do Apêndice C);

  iii. alinhar a aeronave antes do toque na pista.'
