section_title: '- Realizar um pouso forçado'
subsection_id: a
cite: G6.2(a)
title: G6.2(a)
text: 'a) após uma emergência simulada que requeira um pouso forçado:

  i. realizar as ações imediatas necessárias para o controle da emergência;

  ii. selecionar uma área de pouso adequada e que esteja dentro da distância de planeio;

  iii. estabelecer trajetória de planeio até a área selecionada, levando em consideração o

  vento presente e os obstáculos no solo.'
