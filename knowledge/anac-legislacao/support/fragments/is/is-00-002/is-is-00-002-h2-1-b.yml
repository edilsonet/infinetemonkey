title: H2.1(b)
text: 'b) decolar o helicóptero:

  i. ajustar os comandos de voo corretamente para a decolagem e pairado;Data de emissão: 31
  de dezembro de 2024

  IS nº 00-002

  Revisão H

  ii. aplicar corretamente os comandos de voo e potência para decolar o helicóptero e

  manter um pairado estável, ao mesmo tempo em que controla a proa da aeronave;

  iii. antecipar e tomar em consideração o efeito do vento, aplicando comandos

  apropriadamente para manter a posição sobre o ponto definido para o pairado;

  iv. demonstrar conhecimento e tomar precauções quanto ao efeito do downwash do rotor

  sobre aeronaves, pessoas e objetos próximos;

  v. checar o correto funcionamento dos comandos de voo, do centro de gravidade da

  aeronave e da potência do motor no pairado;'
