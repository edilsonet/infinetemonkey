title: '- Deslocar a aeronave em todas as direções a partir do voo pairado (quadrados)'
text: 'H2.3 - Deslocar a aeronave em todas as direções a partir do voo pairado (quadrados)

  Quadrado de Proa Fixa/Constante - Posicione-se no lado frontal do quadrado e inicie a manobra
  a

  partir de seu ponto central. Desloque a aeronave lateralmente na mesma velocidade de um
  táxi até

  atingir o vértice. Todo o deslocamento será feito mantendo-se a proa inicial e com movimentos
  de

  cíclico à direita, para trás, à esquerda e para frente. É necessário contato visual com
  a linha de

  referência.

  Quadrado de Proa Variável - Inicie a manobra com o mesmo procedimento do Quadrado de Proa
  Fixa.

  Entretanto, ao atingir o vértice e sem perder a continuidade do movimento, gire 90º com
  os pedais,

  mantendo a cauda do helicóptero para dentro do quadrado. Continue o deslocamento uniforme
  com a proa

  perpendicular à linha de referência, repetindo o procedimento em todos os lados do quadrado.'
