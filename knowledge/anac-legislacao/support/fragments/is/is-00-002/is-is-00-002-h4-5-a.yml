text: 'a) a aproximação e pouso direto é utilizada quando existir condição de poeira, sujeira
  ou neve

  na superfície. Quando existir risco de detritos soltos na superfície reduzirem a visibilidade
  ou

  serem ingeridos pelo motor.'
