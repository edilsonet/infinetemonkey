section_title: '- Pousar e decolar de terreno inclinado (somente se houver área adequada)'
subsection_id: b
cite: H5.7(b)
title: H5.7(b)
text: 'b) utilizar as técnicas apropriadas de pouso em terreno inclinado, em especial:

  i. observar e levar em consideração o vento, a inclinação e superfície do terreno e as

  limitações do helicóptero;

  ii. manter a RPM do rotor dentro dos limites previstos;

  iii. aproximar-se com razão de descida apropriada, rumo constante e evitando o voo

  descoordenado/derrapado;

  iv. controlar o rolamento do helicóptero após o primeiro toque no solo;

  v. manter o helicóptero posicionado no terreno inclinado enquanto abaixa o coletivo e

  centraliza o cíclico.'
