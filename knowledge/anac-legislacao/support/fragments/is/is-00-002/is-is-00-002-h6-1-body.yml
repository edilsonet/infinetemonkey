title: '- Aproximação de grande ângulo'
text: 'H6.1 - Aproximação de grande ângulo

  Aproximação utilizando um ângulo de descida maior que o de uma aproximação normal.

  A aproximação de Grande Ângulo deve ser utilizada quando existir obstáculos na área que
  impeçam

  uma aproximação normal. É utilizada ainda em áreas confinadas, como é o caso, por exemplo,
  dos

  helipontos elevados (ver item H6.4).'
