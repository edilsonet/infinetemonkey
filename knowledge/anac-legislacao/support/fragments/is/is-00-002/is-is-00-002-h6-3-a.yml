cite: H6.3(a)
title: H6.3(a)
text: 'a) pousar com potência limitada:

  i. calcular previamente o desempenho do helicóptero utilizando os gráficos fornecidos no

  manual da aeronave;

  ii. identificar se a área de pouso disponível é suficiente para uma aproximação e pouso

  com potência limitada;

  iii. determinar uma trajetória apropriada para aproximação e um ponto de toque para o

  pouso;

  iv. interceptar a trajetória de aproximação;

  v. gerenciar a velocidade do helicóptero e manter o melhor desempenho possível do rotor

  considerando as condições ambientais e a limitação de potência da aeronave;

  vi. identificar e evitar obstáculos na trajetória de aproximação e pouso;

  vii. manter a sustentação translacional até o momento em que o pouso esteja garantido;

  viii. direcionar a aeronave corretamente para a direção do pouso;

  ix. tocar a aeronave no ponto designado;

  x. controlar a aeronave após o toque no solo.'
