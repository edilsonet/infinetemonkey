cite: H6.3(b)
title: H6.3(b)
text: 'b) decolar com potência limitada:

  i. calcular previamente o desempenho do helicóptero utilizando os gráficos fornecidos no

  manual da aeronave;

  ii. aplicar a máxima potência disponível e manter a rotação ótima do rotor;

  iii. acelerar o helicóptero na razão apropriada para a decolagem;

  iv. reconhecer e controlar o efeito da sustentação translacional gerada pelo deslocamento

  da aeronave (ETL - Effective Translational Lift);

  v. manter a direção de decolagem da aeronave, corrigindo os efeitos do vento e

  coordenando a aeronave conforme apropriado;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  vi. estabelecer e manter a subida;

  vii. identificar e evitar obstáculos.'
