section_title: '- Pousar e decolar em heliponto elevado'
subsection_id: a
cite: H6.4(a)
title: H6.4(a)
text: 'a) pousar em um heliponto elevado:

  i. planejar o pouso considerando as limitações do helicóptero;

  ii. verificar a potência na aeronave previamente ao início da aproximação;

  iii. inspecionar visualmente o heliponto elevado e definir as trajetórias apropriadas para

  aproximação, pouso e decolagem;

  iv. verificar as condições de vento e turbulência nas proximidades do terreno;

  v. interceptar e manter a trajetória de aproximação escolhida;

  vi. identificar e evitar obstáculos na trajetória de aproximação e pouso;

  vii. manter a sustentação translacional até o momento em que o pouso esteja garantido;

  viii. finalizar a aproximação mantendo voo pairado sobre o ponto de toque designado;

  ix. tocar o solo no ponto designado;

  x. controlar a aeronave após o toque no solo;'
