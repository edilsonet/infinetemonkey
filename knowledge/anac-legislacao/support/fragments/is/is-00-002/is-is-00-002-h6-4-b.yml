section_title: '- Pousar e decolar em heliponto elevado'
subsection_id: b
cite: H6.4(b)
title: H6.4(b)
text: 'b) decolar de um heliponto elevado:

  i. planejar a decolagem considerando as limitações do helicóptero;

  ii. verificar a potência na aeronave previamente ao início da decolagem;

  iii. inspecionar visualmente o heliponto elevado e definir a trajetória apropriada para
  a

  decolagem;

  iv. verificar as condições de vento e turbulência nas proximidades do terreno; e

  v. interceptar e manter a trajetória de decolagem escolhida.'
