title: H7.1(g)
text: 'g) comunicar-se com o ATC, se houver tempo hábil;

  Para a segurança da operação, antes que a aeronave alcance o mínimo de 500 ft o examinador
  deve

  comunicar ao piloto que o procedimento está finalizado e a configuração do voo nivelado
  deve ser

  reestabelecida.'
