title: H7.2(a)
text: 'a) iniciar e manter autorrotação simulada, mantendo a velocidade recomendada e seguindo
  um

  dos seguintes perfis:

  i. Nunca iniciar qualquer procedimento abaixo de 500 ft ou conforme

  o Manual de Voo ou de Treinamento. O que for mais restritivo.

  ii. Iniciar o procedimento na velocidade previamente discutida no

  briefing, preferencialmente diferente da recomendada no RFM paraData de emissão: 31 de dezembro
  de 2024

  IS nº 00-002

  Revisão H

  a execução do procedimento;

  iii. Após a entrada buscar a velocidade prevista no RFM ou Manual de

  Treinamento;

  iv. Realizar a descida direta, em curva de 90, 180 ou 360 graus; e

  v. Manter a RPM do rotor dentro do limite durante a autorrotação.'
