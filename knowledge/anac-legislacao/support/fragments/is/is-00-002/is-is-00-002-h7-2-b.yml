cite: H7.2(b)
title: H7.2(b)
text: 'b) concluir a manobra de uma das seguintes maneiras:

  i. se estiver fora dos parâmetros estabelecidos, recuperar a aeronave da manobra em uma

  altitude mínima pré-estabelecida, como se segue:

  (A) antecipar-se à altitude mínima estabelecida para a recuperação, de modo a não

  ultrapassá-la;

  (B) garantir que as indicações de RPM do motor e do rotor estejam dentro do

  previsto antes de aplicar potência de subida;

  (C) aplicar potência de subida;

  (D) manter estável a proa da aeronave;

  (E) estabelecer a velocidade de subida.

  ii. se estiver dentro dos parâmetros estabelecidos, concluir a manobra com o uso de

  potência, como se segue:

  (A) se a potência for reduzida para o início do procedimento, ela deve estar

  completamente restabelecida antes de iniciar o flare. Obs: A redução da potência

  fica a critério do Examinador, entretanto, o aluno deve estar apto para realizar o

  procedimento com ou sem redução de potência, se o manual de treinamento

  permitir os dois casos;

  (B) iniciar o flare na altura apropriada, conforme o RFM ou maior;

  (C) reduzir gradualmente o deslocamento horizontal e vertical da aeronave, até

  alcançar o ponto de toque determinado;

  (D) manter o controle da proa, rotação do motor e rotação do rotor durante a

  manobra;

  (E) finalizar a manobra estabelecendo voo pairado sobre o ponto de toque definido.'
