subsection_id: b
cite: H7.3(b)
title: H7.3(b)
text: 'b) Aproado com o vento, efetue uma decolagem normal. Aplique adicional cíclico à frente

  acelerando para a faixa entre 40 e 50 nós até que se atinja o mínimo de 25 pés de altura.
  Com

  a cabine nivelada, inicie uma parada rápida aplicando cíclico para trás, baixando o coletivo
  e,

  simultaneamente, usando o pedal direito para manter a proa.'
