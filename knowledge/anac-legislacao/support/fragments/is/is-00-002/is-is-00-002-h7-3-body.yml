title: '- Parada Rápida ou Rejeição de Decolagem'
text: 'H7.3 - Parada Rápida ou Rejeição de Decolagem

  Treinamento de desaceleração rápida da aeronave a partir de um deslocamento à frente, simulando
  a

  necessidade de abortar uma decolagem ou uma rápida parada caso algo venha a impedir a livre
  circulação

  do helicóptero. A Parada Rápida é normalmente praticada sobre a pista de pouso e decolagem.Data
  de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H'
