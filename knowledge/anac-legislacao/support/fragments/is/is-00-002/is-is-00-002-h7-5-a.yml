section_title: '- Gerenciar perda completa da tração do rotor de cauda (em simulador)'
subsection_id: a
cite: H7.5(a)
title: H7.5(a)
text: 'a) identificar uma perda completa da tração do rotor de cauda (em voo normal e voo
  pairado)

  corretamente e manter controle do helicóptero, conforme o RFM da aeronave.

  Obs: Em aeronave o Examinador deve estabelecer uma situação no Exame Oral para verificar

  a capacidade do piloto em identificar e realizar o procedimento. Neste caso, em voo, deve
  ser

  realizado apenas o procedimento adequado para manter o voo controlado e pouso.'
