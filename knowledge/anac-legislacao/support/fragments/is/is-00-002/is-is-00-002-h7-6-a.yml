cite: H7.6(a)
title: H7.6(a)
text: 'a) Simulação de travamento dos pedais.

  i. Com a aeronave em voo, simular que os pedais estão travados;

  ii. Descrever as consequências do travamento proposto pelo examinador, a reação da

  aeronave e ação necessária até o pouso;Data de emissão: 31 de dezembro de 2024

  IS nº 00-002

  Revisão H

  iii. manter o controle do helicóptero com segurança;

  iv. conduzir o helicóptero até a área de pouso adequada mais próxima, seguindo o

  previsto no Manual de Voo e/ou de Operação.

  v. É recomendado não pousar antes de restabelecer o comando dos pedais.'
