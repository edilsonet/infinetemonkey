cite: H7.6(b)
title: H7.6(b)
text: 'b) Simulação de perda de eficiência dos pedais.

  j. Com a aeronave em voo, simular que os pedais perderam a eficiência;

  k. Descrever as consequências da falha proposta pelo examinador, a reação da aeronave

  e ação necessária até o pouso;

  i. conduzir o helicóptero até a área de pouso adequada mais próxima, seguindo o

  previsto no Manual de Voo e/ou de Operação.

  j. É recomendado não pousar antes de restabelecer o comando dos pedais.'
