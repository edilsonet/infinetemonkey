section_title: '- Realizar aproximação e pouso corrido, (somente se previsto no RFM da aeronave,
  e de'
subsection_id: b
cite: H7.8(b)
title: H7.8(b)
text: 'b) o perfil e velocidade de toque no pouso corrido será estabelecido pelo Examinador,
  que poderá

  criar uma situação hipotética e o piloto deverá reconhecer a melhor maneira de pousar corrido.

  Ex. para algumas aeronaves: Pouso curto após perda parcial da potência do motor; Pouso curto

  após falha do único sistema hidráulico; ou Pouso Longo após Travamento dos Pedais com a

  aeronave alinhada.'
