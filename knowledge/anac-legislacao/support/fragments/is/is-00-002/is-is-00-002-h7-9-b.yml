title: H7.9(b)
text: 'b) Imediatamente o aluno deve manter a proa aplicando certa quantidade de pedal direito.

  Permita que o helicóptero desça e amorteça o toque com o coletivo.

  Em voo e acima de 500 pés (aeronave monomotora)

  Simular uma falha de motor durante um voo acima de 500 pés, no pairado ou com velocidade.'
