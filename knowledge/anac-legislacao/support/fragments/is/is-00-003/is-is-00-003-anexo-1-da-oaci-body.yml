title: Anexo 1 da OACI
text: 'Anexo 1 da OACI


  Diferenças entre o anexo 1 da OACI e o regulamento das tripulações aéreas


  Descreva a relação e as diferenças entre o anexo 1 da OACI e o regulamento das tripulações
  aéreas.


  Licenças, habilitações e certificados para pilotos


  Defina o seguinte: categoria de aeronave, cross-country, tempo de instrução dupla, tempo
  de voo, piloto estudante em comando, tempo de instrumento, tempo de voo por instrumento,
  tempo de solo do instrumento, multi crew cooperation (MCC), aeronave multipiloto, noturno,
  piloto particular, verificação de proficiência, renovação, revalidação, teste de habilidade,
  tempo de voo individual, tipo de aeronave.


  Conteúdo e estrutura


  Explique a estrutura do RBAC 61.


  Entenda a diferença entre o RBAC 61 e os meios aceitáveis de atendimento (Instrução Suplementar
  - IS) e de materiais de orientação (Compêndio de Elementos de Fiscalização - CEF) em relação
  ao RBAC 61.


  Explique os requisitos para atuar como membro da tripulação de voo de uma aeronave civil
  registrada em um Estado membro.


  Declare em que medida os Estados membros aceitarão certificados emitidos por outros Estados
  membros.


  Liste os dois fatores que são relevantes para o exercício dos privilégios de uma licença.


  Indique as circunstâncias em que é necessário um endosso de proficiência na língua.


  Liste as restrições para os titulares de licenças com idade igual ou superior a 60 anos.


  Explique o termo "autoridade competente".


  Descreva a obrigação de transportar e apresentar documentos (por exemplo, uma licença de
  tripulação de voo) sob o RBAC 61.


  Licença de piloto comercial (PC)


  Declare os requisitos para a emissão de uma licença de PC.


  Declare os privilégios de uma licença de PC.


  Licença de piloto de linha aérea (PLA) e licença de piloto de tripulação múltipla (TM)


  Declare os requisitos para a emissão de uma licença PL e de uma licença TM.


  Declare os privilégios de uma licença PL e de uma licença TM.


  Classificações


  Explique os requisitos para as classificações de classe, sua validade e privilégios.


  Explique os requisitos para as classificações de tipo, sua validade e privilégios.


  Explique os requisitos para as classificações de instrumentos, sua validade e privilégios.


  Certificado médico aeronáutico


  Descreva o conteúdo relevante do RBAC 67 (partes administrativas e requisitos relacionados
  apenas ao concessão do CMA).


  Declare os requisitos para um CMA.


  Nomeie o tipo de CMA necessário ao exercer os privilégios de uma licença PL e de uma licença
  TM.


  Declare as ações a serem tomadas em caso de diminuição da aptidão médica.


  REGRAS DO AR


  Definições do anexo 2 da OACI


  Explique as definições do anexo 2 da ICAO.


  Aplicabilidade das Regras do Ar


  Explicar a aplicação territorial das Regras do Ar da ICAO.


  Explique o cumprimento das Regras do Ar.


  O estado que a bordo de uma aeronave é o principal responsável pela operação da aeronave,
  de acordo com as Regras do Ar.


  Indique em que circunstâncias é permitida a inobservância das Regras do Ar.


  Explique os deveres do PIC em relação às ações pré-voo no caso de um voo IFR.


  Indique quem tem a autoridade final quanto à disposição da aeronave.


  Explicar a problemática do uso de substâncias psicoativas por membros da tripulação de voo.


  Regras gerais


  Descreva as regras para evitar colisões.


  Descreva as luzes a serem exibidas pela aeronave.


  Compreenda os sinais de organização.


  Indique os requisitos básicos de altura mínima para o voo sobre áreas congestionadas de
  cidades, vilas ou povoações, ou sobre uma reunião de pessoas ao ar livre.


  Defina quando os níveis de cruzeiro devem ser expressos em termos de níveis de voo (FL).


  Defina em que circunstâncias os níveis de cruzeiro devem ser expressos em termos de altitudes.


  Explique a limitação de proximidade a outras aeronaves e as regras de direito de passagem,
  incluindo posições de espera na pista e barras de parada iluminadas.


  Descreva o significado dos sinais de luz exibidos para e pela aeronave.


  Descreva os requisitos ao realizar voos simulados por instrumentos.


  Indique as regras básicas para uma aeronave que opere dentro e nas proximidades de um aeródromo
  (AD).


  Explique os requisitos para a apresentação de um plano de voo ATS.


  Explique por que uma verificação de tempo deve ser obtida antes do voo.


  Explique as ações a serem tomadas em caso de alteração ou atraso no plano de voo.


  Declare as ações a serem tomadas em caso de alterações inadvertidas na rota, velocidade
  real no ar (TAS) e estimativa de tempo que afetem o plano de voo atual.


  Explique os procedimentos para fechar um plano de voo.


  Declare para quais voos deve ser obtida uma autorização do controle de tráfego aéreo.


  Declare como um piloto pode solicitar autorização do controle de tráfego aéreo.


  Declare a ação a ser tomada se a autorização do controle de tráfego aéreo não for satisfatória
  para o piloto em comando.


  Descreva as ações necessárias a serem realizadas se a continuação de um voo VFR controlado
  em VMC não for mais praticável.


  Descreva as disposições para a transmissão de um relatório de posição para a unidade ATS
  apropriada, incluindo o tempo de transmissão e o conteúdo normal da mensagem.


  Descreva a ação necessária quando uma aeronave passa por uma falha COM.


  Indicar quais informações uma aeronave submetida a interferência ilegal deve fornecer ao
  órgão ATS adequado.


  Regras de voo visual (VFR)


  Descreva as Regras de Voo Visual conforme consta no Capítulo 4 do Anexo 2 da ICAO.


  Regras de voo por instrumentos (IFR)


  Descreva as Regras de Voo por Instrumentos conforme consta no Capítulo 5 do Anexo 2 da ICAO.


  Interceptação de aeronaves civis


  Liste as possíveis razões para interceptar uma aeronave civil.


  Declare qual ação primária deve ser realizada por uma aeronave interceptada.


  Indique qual frequência deve ser tentada principalmente para entrar em contato com uma aeronave
  interceptadora.


  Indique em qual modo e código um transponder a bordo da aeronave interceptada deve ser operado.


  Lembre-se dos sinais e frases de interceptação.


  PROCEDIMENTOS PARA SERVIÇOS DE NAVEGAÇÃO AÉREA - OPERAÇÕES DE AERONAVES (PANS-OPS)


  Prefácio e introdução


  Traduzir o termo ‘PANS-OPS’ para linguagem simples.


  Declare o objetivo geral dos procedimentos de voo PANS-OPS (ICAO Doc 8168, Volume I).


  Definições e abreviações


  Lembre-se de todas as definições incluídas no Doc 8168 da ICAO, Volume I, Parte I, Capítulo
  1.


  Interprete todas as abreviaturas conforme mostrado no Doc 8168 da ICAO, Volume I, Parte
  I, Capítulo 2.


  Procedimentos de partida


  Critérios gerais (assumindo todos os motores operando)


  Cite os fatores que determinam o projeto dos procedimentos de partida por instrumentos.


  Explique em quais situações os critérios para saídas omnidirecionais são aplicados.


  Saídas padrão por instrumentos (SID)


  Defina os termos "saída direta" e "saída em curva".


  Declare a responsabilidade do operador quando não puder utilizar os procedimentos de partida
  publicados.


  Saídas omnidirecionais


  Explique quando o ''método omnidirecional'' é usado para a saída.


  Descreva as soluções quando um procedimento omnidirecional não for possível.


  Informação publicada


  Indique as condições para a publicação de uma rota SID e / ou RNAV.


  Descreva como os desvios omnidirecionais são expressos na publicação apropriada.


  Procedimentos de saída em navegação de área (RNAV) e saídas baseadas em RNP


  Explique a relação entre os procedimentos de saída baseados em RNAV / RNP e os procedimentos
  de aproximação.


  Procedimentos de aproximação


  Critérios gerais


  Critérios gerais (exceto a tabela ''velocidades para cálculos de procedimento'') do projeto
  para o procedimento de aproximação:


  áreas de aproximação por instrumentos;


  precisão das correções;Critérios gerais (exceto a tabela ''velocidades para cálculos de
  procedimento'') do projeto para o procedimento de aproximação:


  áreas de aproximação por instrumentos;


  precisão das correções;


  correções formadas por cruzamentos;


  fatores de tolerância de correção de intersecção;


  outros fatores de tolerância de correção;


  funis das áreas de aproximação;


  gradiente de descida.


  gradiente de descida.


  Cite os cinco segmentos possíveis de um procedimento de aproximação por instrumento.


  Dê razões para estabelecer categorias de aeronaves para a aproximação.


  Declare o ângulo máximo entre a superfície de aproximação final e a linha central da RWY
  estendida para ainda considerar uma abordagem de não precisão como sendo uma "aproximação
  direta".


  Indicar a distância mínima entre obstáculos proporcionada pelas altitudes mínimas de setor
  (MSA) estabelecidas para um aeródromo.


  Descreva o ponto de origem, forma, tamanho e subdivisões da área usada para MSA.


  Declare quando um piloto deve aplicar correções de vento ao realizar um procedimento de
  aproximação por instrumentos.


  Cite o fator de desempenho mais significativo que influencia a conduta dos procedimentos
  de aproximação por instrumentos.


  Explique por que um piloto não deve descer abaixo das OCA/H que são estabelecidos para:


  procedimentos de aproximação de precisão;


  procedimentos de aproximação de não precisão;


  procedimentos visuais (circular).


  Descreva em termos gerais os fatores relevantes para o cálculo dos mínimos operacionais.


  Traduza os seguintes acrônimos em linguagem simples:


  DA, DH, OCA, OCH, MDA, MDH, MOC, DA / H, OCA / H, MDA / H.


  Explique a relação entre os termos:


  DA, DH, OCA, OCH, MDA, MDH, MOC, DA / H, OCA / H, MDA / H.


  Projeto do procedimento de aproximação


  Descreva como a seção transversal vertical de cada um dos cinco segmentos de aproximação
  é dividida em várias áreas.


  Declare dentro de qual área da seção transversal a distância mínima de obstáculos (MOC)
  é fornecida para toda a largura da área.


  Defina os termos ‘IAF’, ‘IF’, ‘FAF’, ‘MAPt’ e ‘TP’.


  Nomeie a área dentro da qual o ponto traçado de um ponto de interseção pode estar.


  Explique por quais fatores as dimensões de uma correção de interseção são determinadas.


  Declare a precisão das instalações que fornecem rastreamento (VOR, ILS, NDB).


  Descreva os "outros fatores de correção de tolerância ": radar de vigilância (radar de área
  terminal (TAR)), radar de vigilância em rota (RSR), DME, farol marcador de 75 MHz, correções
  acima de uma estação (VOR, NDB).


  Descreva as informações básicas relacionadas às aberturas da área de aproximação.


  Indique o gradiente de descida ideal (preferido para uma aproximação de precisão) em graus
  e por cento.


  Segmentos de chegada e aproximação


  Cite os cinco segmentos padrão de um procedimento APP por instrumento e indique o início
  e o fim de cada um deles.


  Descreva onde normalmente termina uma rota ARR.


  Indique se as chegadas omnidirecionais ou setoriais podem ou não ser fornecidas.


  Explique a principal tarefa do segmento inicial de APP.


  Descreva o ângulo máximo de intersecção entre o segmento de APP inicial e o segmento de
  APP intermediário (fornecido na correção intermediária) para uma abordagem de precisão e
  uma abordagem de não precisão.


  Descreva a principal função do segmento intermediário de APP.


  Indique a principal função do segmento final da APP.


  Cite os dois objetivos possíveis de um APP final.


  Explique o termo "ponto de aproximação final" no caso de uma aproximação ILS.


  Declare o que acontece se o GP do ILS ficar inoperante durante o APP.


  Aproximação perdida


  Cite as três fases de um procedimento de aproximação perdida e descreva seus limites geométricos.


  Descreva a principal função de um procedimento de aproximação perdida.


  Indique em qual altura / altitude a aproximação perdida deve ser iniciada com segurança.


  Defina o termo ''ponto de aproximação perdida (MAPt)''.


  Descreva como um MAPt pode ser estabelecido em um procedimento de aproximação.


  Indique a reação do piloto se, ao atingir o MAPt, a referência visual necessária não for
  estabelecida.


  Descreva o que se espera que um piloto faça no caso de uma aproximação perdida ser iniciada
  antes de chegar ao MAPt.


  Informar se o piloto é obrigado a cruzar o MAPt na altura / altitude exigida pelo procedimento
  ou se tem permissão para cruzar o MAPt a uma altitude / altura superior à exigida pelo procedimento.


  Manobra visual (circulação) nas proximidades do aeródromo


  Descreva o que se entende por "manobra visual (circulação)".


  Descreva como um obstáculo proeminente na área de manobra visual (circulação) fora da área
  de aproximação final e de aproximação perdida deve ser considerado para a circulação visual.


  Declare para qual categoria de aeronave é determinada a altitude / altura livre de obstáculos
  dentro de uma área de manobra visual (circulação) estabelecida.


  Descreva como um MDA/H é especificado para manobra visual (circulação) se o OCA/H for conhecido.


  Declare as condições a serem cumpridas antes de descer abaixo do MDA/H em uma abordagem
  de manobra visual (circulação).


  Descreva por que não pode haver um único procedimento projetado para conduzir uma aproximação
  circular em todas as situações.


  Declare como o piloto deve se comportar após o contato visual inicial durante uma manobra
  visual (circulação).


  Descreva o que se espera que o piloto faça se a referência visual for perdida ao circular
  para pousar a partir de uma aproximação por instrumentos.


  Procedimentos de aproximação por navegação de área (RNAV) com base em VOR / DME


  Descreva as preparações que devem ser feitas antes de realizar abordagens VOR / DME RNAV.


  Explique as desvantagens do sistema VOR / DME RNAV.


  Liste os fatores dos quais a precisão de navegação do sistema VOR / DME RNAV depende.


  Declare se a aproximação VOR/DME/RNAV é um procedimento de precisão ou não.


  Uso de equipamento FMS/RNAV para seguir procedimentos convencionais de aproximação de não
  precisão


  Declare as preparações para voar os procedimentos convencionais de aproximação de não precisão
  usando equipamento FMS/RNAV.


  Procedimentos de espera


  Entrada e espera


  Explique porque os desvios dos procedimentos de voo de uma espera estabelecida de acordo
  com o Doc 8168 são perigosos.


  Declare que se por alguma razão um piloto for incapaz de cumprir os procedimentos para condições
  normais estabelecidos para qualquer padrão de espera em particular, ele deve avisar o ATC
  o mais cedo possível.


  Descreva como as curvas à direita podem ser transferidas para padrões de curvas à esquerda.


  Descreva a forma e a terminologia associadas ao padrão de espera.


  Declare o ângulo de inclinação e a razão de curva a serem usados durante o voo em um padrão
  de espera.


  Explique por que os pilotos em um padrão de espera devem tentar manter os rastros e como
  isso pode ser alcançado.


  Descreva onde o tempo de saída começa em um padrão de espera.


  Indique onde a perna de saída em uma espera termina se a perna de saída é baseada em DME.


  Nomeie e descreva os três setores de entrada em um padrão de espera.


  Defina os termos ''entrada paralela'', ''entrada de compensação'' (offset ou teardrop) e
  ''entrada direta''.


  Determine o procedimento de entrada correto para um determinado padrão de espera.


  Declare o tempo no ar parado para voar a perna de saída com ou sem DME.


  Descreva o que o piloto deve fazer quando a liberação é recebida, especificando o tempo
  de partida do ponto de espera.


  Eliminação de obstáculos (exceto tabela)


  Descreva o layout da área de espera básica, área de entrada e área tampão de um padrão de
  espera.


  Declare qual a distância de obstáculos é fornecida por um nível de espera mínimo permissível
  referente à área de espera, a área tampão (somente geral) e sobre terrenos altos ou em áreas
  montanhosas.


  Procedimentos de configuração de altímetro


  Requisitos e procedimentos básicos


  Descreva os dois objetivos principais das configurações do altímetro.


  Defina os termos ''QNH'' e ''QFE''.


  Descreva os diferentes termos para altitude ou níveis de voo, respectivamente, que são as
  referências durante a subida ou descida para alterar a configuração do altímetro de QNH
  para 1013,2 hPa e vice-versa.


  Defina o termo ''Nível de Voo (FL)''.


  Declare onde o nível de voo zero deve estar localizado.


  Declare o intervalo pelo qual os níveis de voo consecutivos devem ser separados.


  Descreva como os níveis de voo são numerados.


  Defina o termo ‘altitude de transição’.


  Declare como as altitudes de transição devem ser normalmente especificadas.


  Explique como a altura da altitude de transição é calculada e expressa na prática.


  Indique onde as altitudes de transição devem ser publicadas.


  Defina o termo "nível de transição".


  Declare quando o nível de transição normalmente é passado para a aeronave.


  Declare como a posição vertical da aeronave deve ser expressa na altitude de transição e
  no nível de transição ou abaixo dela.


  Defina o termo "camada de transição".


  Descreva quando a posição vertical de uma aeronave passando pela camada de transição deve
  ser expressa em termos de níveis de voo e quando em termos de altitude.


  Declare quando a configuração do altímetro QNH deve ser disponibilizada para a aeronave
  que decola.


  Explique quando a separação vertical de uma aeronave durante o voo em rota deve ser avaliada
  em termos de altitude e quando em termos de níveis de voo.


  Explique quando, nas comunicações ar-solo durante um voo em rota, a posição vertical de
  uma aeronave deve ser expressa em termos de altitude e quando em termos de níveis de voo.


  Descreva por que os relatos de configuração do altímetro QNH devem ser fornecidos em locais
  suficientes.


  Declare como uma configuração de altímetro QNH deve ser disponibilizada para aeronaves que
  se aproximam para pouso em um aeródromo controlado.


  Declare sob quais circunstâncias a posição vertical de uma aeronave acima do nível de transição
  pode ser referenciada a altitudes.


  Procedimentos para operadores e pilotos


  Declare os três requisitos que as altitudes selecionadas ou os níveis de voo selecionados
  devem ter.


  Descreva um teste operacional pré-voo em caso de configuração de QNH e em caso de configuração
  de QFE, incluindo tolerâncias de indicação (erro) referentes às diferentes faixas de teste.


  Indique em qual configuração pelo menos um altímetro deve ser configurado antes da decolagem.


  Indique onde, durante a subida, a configuração do altímetro deve ser alterada de QNH para
  1013,2 hPa.


  Descreva quando um piloto de uma aeronave com intenção de pousar em um AD deverá obter o
  nível de transição.


  Descreva quando um piloto de uma aeronave com intenção de pousar em um AD deve obter a configuração
  real do altímetro QNH.


  Indique onde as configurações do altímetro devem ser alteradas de 1013,2 hPa para QNH durante
  a descida para pouso.


  Operação simultânea em pistas de instrumentos paralelas ou quase paralelas


  Descreva a diferença entre as abordagens paralelas independentes e dependentes.


  Descreva as seguintes operações diferentes:


  decolagens em condições de voo por instrumentos simultâneas;


  aproximações / decolagens paralelas segregadas;


  operações semimistas e mistas.


  Saiba sobre ‘NOZ’ e ‘NTZ’.


  Cite os requisitos de equipamento da aeronave para conduzir aproximações paralelas por instrumentos.


  Declare sob quais circunstâncias aproximações paralelas por instrumentos podem ser conduzidas.


  Declare os requisitos de radar para aproximações simultâneas, independentes e paralelas
  por instrumentos e como as condições meteorológicas as afetam.


  Declare o ângulo máximo de interceptação para um localizador ILS CRS ou trajetória de APP
  final MLS no caso de aproximações de instrumentos simultâneas, independentes e paralelas.


  Descreva as condições especiais para trajetórias em procedimentos de aproximação perdida
  e decolagens em caso de operações simultâneas e paralelas.


  Procedimentos operacionais de radar de vigilância secundária (transponder)


  Operação de transponders


  Indique quando e onde o piloto deverá operar o transponder.


  Declare os modos e códigos que o piloto deve operar na ausência de quaisquer direções ATC
  ou acordos regionais de navegação aérea.


  Indique quando o piloto deve operar o modo "C".


  Indique quando o piloto deve ''SQUAWK IDENT''.


  Indique o modo e o código do transponder para indicar:


  um estado de emergência;


  uma falha de comunicação;


  interferência ilegal.


  Descreva as consequências de uma falha do transponder durante o voo.


  Declare a ação principal do piloto no caso de um transponder inutilizado antes da partida,
  quando nenhum reparo ou substituição em determinado aeródromo for possível.


  Operação do equipamento ACAS


  Descreva a principal razão para usar airborne collision avoidance system - ACAS.


  Indique se o ‘uso de indicações ACAS’ descrito no Doc 8168 é absolutamente obrigatório.


  Explique a reação do piloto necessária para permitir que o ACAS cumpra seu papel de auxilia-lo
  na prevenção de potenciais colisões.


  Explique por que os pilotos não devem manobrar suas aeronaves apenas em resposta aos avisos
  de tráfego.


  Explique a importância dos avisos de tráfego (TA) em vista de possíveis avisos de resolução
  (RA).


  Declare por que um piloto deve seguir os avisos de resolução imediatamente.


  Liste os motivos que podem forçar um piloto a desconsiderar um aviso de resolução.


  Decida como um piloto deve reagir se houver um conflito entre os avisos de resolução no
  caso de um encontro coordenado de RA ACAS / ACAS.


  Explique a importância de instruir o ATC imediatamente de que um aviso de resolução foi
  seguido.


  Explique os deveres de um piloto no que diz respeito ao ATC quando uma situação de aviso
  de resolução for resolvida.


  SERVIÇOS DE TRÁFEGO AÉREO E GESTÃO DE TRÁFEGO AÉREO'
