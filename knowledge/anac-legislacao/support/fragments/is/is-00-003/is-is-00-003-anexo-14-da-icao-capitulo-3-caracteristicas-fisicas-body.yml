title: Anexo 14 da ICAO, Capítulo 3 - Características físicas
text: 'Anexo 14 da ICAO, Capítulo 3 - Características físicas


  Descreva a distância mínima que uma posição de estacionamento de uma aeronave isolada (após
  a aeronave ter sido submetida a interferência ilegal) deve ter de outras posições de estacionamento,
  edifícios ou áreas públicas.


  ICAO Doc 4444


  Descreva as considerações que devem ser feitas com relação à liberação de um táxi, caso
  se saiba ou se acredite que uma aeronave foi submetida a interferência ilegal.


  INVESTIGAÇÃO DE ACIDENTES E INCIDENTES DE AERONAVES


  Definições essenciais do Anexo 13 da ICAO


  Defina o seguinte: acidente, aeronave, gravador de voo, incidente, investigação, massa máxima,
  operador, incidente sério, lesão grave, Estado de projeto, Estado de fabricação, Estado
  de ocorrência, Estado do operador, Estado de registro.


  Defina a diferença entre ''incidente sério'' e ''acidente''.


  Determine se uma determinada ocorrência deve ser definida como um incidente sério ou um
  acidente.


  Reconhecer a descrição de um acidente ou incidente.


  Aplicabilidade do Anexo 13 da ICAO


  Descreva os limites geográficos, se houver, dentro dos quais se aplicam as especificações
  dadas no Anexo 13.


  Investigação de acidentes e incidentes da ICAO


  Indique o(s) objetivo(s) da investigação de um acidente ou incidente de acordo com o Anexo
  13.


  Compreender os procedimentos gerais para a investigação de um acidente ou incidente de acordo
  com o Anexo 13.


  Investigação de acidentes e incidentes de acordo com normativos do Brasil


  Esteja familiarizado com o Decreto nº 9.540, de 25 de outubro de 2018, que dispõe sobre
  o sistema de investigação e prevenção de acidentes aeronáuticos no Brasil..


  Esteja familiarizado com a ICA 3-7 “Programa de reporte voluntário para segurança de voo”.


  Estar familiarizado com as diferenças entre os procedimentos para investigação de acidentes
  e incidentes nos regulamentos brasileiros em comparação com o Anexo 13 da ICAO.


  MARCO REGULATÓRIO'
