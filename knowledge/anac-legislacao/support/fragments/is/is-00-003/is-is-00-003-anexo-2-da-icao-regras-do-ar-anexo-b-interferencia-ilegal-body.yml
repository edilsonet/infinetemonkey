title: Anexo 2 da ICAO - Regras do Ar, Anexo B - Interferência ilegal
text: 'Anexo 2 da ICAO - Regras do Ar, Anexo B - Interferência ilegal


  Descreva o que o PIC deve fazer, a menos que as considerações a bordo da aeronave determinem
  o contrário.


  Descreva o que o PIC deve fazer se:


  a aeronave deve se afastar de sua rota designada;


  a aeronave deve sair de seu nível de cruzeiro designado;


  a aeronave é incapaz de notificar uma unidade ATS da interferência ilegal.


  Descreva o que o PIC deve tentar fazer em relação à transmissão de avisos para decidir em
  que nível a tripulação está procedendo se nenhum procedimento regional aplicável para contingências
  em voo tiver sido estabelecido.'
