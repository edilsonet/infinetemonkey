text: 'Anexo 6 da ICAO, Capítulo 13 - Segurança


  Descreva as considerações especiais referentes às portas da cabine da tripulação no que
  diz respeito à segurança da aviação.


  Explique o que um operador deve fazer para minimizar as consequências de atos de interferência
  ilegal.


  Explique o que um operador deve fazer para ter pessoal adequado disponível que possa contribuir
  para a prevenção de atos de sabotagem ou outras formas de interferência ilegal.'
