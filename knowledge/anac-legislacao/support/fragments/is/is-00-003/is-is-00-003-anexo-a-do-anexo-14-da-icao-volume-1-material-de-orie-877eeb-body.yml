text: 'Anexo A do Anexo 14 da ICAO, Volume 1 - material de orientação suplementar


  Distâncias declaradas


  Liste os quatro tipos de ''distâncias declaradas'' em uma pista e também as abreviaturas
  apropriadas.


  Explique as circunstâncias que levam à situação em que as quatro distâncias declaradas em
  uma pista são iguais ao comprimento da pista.


  Descreva a influência de uma área de parada (stopway) ou zona desimpedida (clearway) e /
  ou limite deslocado sobre as quatro ''distâncias declaradas''.


  Áreas de operação do rádio-altímetro


  Descreva a finalidade da área de operação de um rádio-altímetro.


  Descreva as características físicas da área de operação de um rádio-altímetro.


  Descreva as dimensões da área de operação de um rádio-altímetro.


  Descreva a posição da área de operação de um rádio-altímetro.


  Sistemas de iluminação de aproximação


  Cite os dois grupos principais de sistemas de iluminação de aproximação.


  Descreva as duas versões diferentes de um sistema de iluminação de aproximação simples.


  Descreva as duas versões básicas diferentes de sistemas de iluminação de aproximação de
  precisão para CAT I.


  Descreva o diagrama dos 300 m internos do sistema de iluminação de aproximação de precisão
  no caso de CAT II e III.


  Descreva como o arranjo de um sistema de iluminação de aproximação e a localização do limite
  apropriado estão inter-relacionados entre si.


  FACILITAÇÃO (Anexo 9 da ICAO)


  Geral'
