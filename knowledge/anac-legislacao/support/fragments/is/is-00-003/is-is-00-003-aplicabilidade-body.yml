title: Aplicabilidade
text: 'Aplicabilidade


  Explique a aplicabilidade da Lei nº 13.475/2017


  Aspectos da legislação trabalhista


  Identificar a filiação ao sindicato e o desligamento do sindicato como direitos do profissional.


  Definir convenção coletiva de trabalho e acordo coletivo de trabalho.


  Evidenciar a importância da convenção coletiva de trabalho e do acordo coletivo de trabalho.


  Definir Segurança e Medicina do Trabalho.


  Citar o objetivo da Comissão Interna de Prevenção de Acidentes (CIPA).


  Identificar os componentes da CIPA.


  Definir cessação de contrato de trabalho.


  Definir Seguridade Social.


  Identificar a Previdência Social como um dos componentes da Seguridade Social.


  Citar a finalidade da Previdência Social.


  Citar a forma de custeio da Previdência Social.


  Citar o tempo de contribuição e a idade mínima requeridos para concessão de aposentadoria
  ao aeronauta.


  Aspectos da específicos


  Discutir a Portaria Interministerial nº 3.016, 1988, face a Lei nº 13.475/2017.


  Caracterizar a convenção coletiva de trabalho do aeronauta quando à finalidade, ao valor
  legal e à duração.


  Definir aeronauta.


  Citar o limite máximo do número de comissários estrangeiros em exercício a bordo de aeronave
  de empresa brasileira operando linha internacional.


  Definir tripulante segundo a Lei nº Lei nº 13.475/2017.


  Definir comandante, copiloto, comissário de voo, navegador, radio-operador de voo, mecânico
  de voo e operador de equipamento especial.


  Definir base.


  Definir tripulação.


  Definir tripulação mínima, tripulação simples, tripulação composta e tripulação de revezamento.


  Citar a existência da obrigatoriedade de acomodações a bordo para descanso de tripulação
  composta e de tripulação de revezamento.


  Indicar o tipo e a quantidade de acomodações cuja existência é obrigatória a bordo para
  descanso de tripulação composta.


  Indicar o tipo e a quantidade de acomodações cuja existência é obrigatória a bordo para
  descanso de tripulação de revezamento.


  Identificar a tripulação simples como o tipo de tripulação que pode ser usado tanto em voo
  doméstico como em voo internacional.


  Identificar a tripulação formada como o tipo de tripulação composto em voos internacionais
  e que só pode ser usado em voo doméstico em caráter excepcional, por atraso em razão de
  condições meteorológicas ou de trabalhos de manutenção.


  Identificar a tripulação de revezamento como o tipo de tripulação que só pode ser usado
  em voos internacionais.


  Indicar as condições exigidas para a transformação de um tipo de tripulação em outro.


  Citar a finalidade da transformação de um tipo de tripulação em outro.


  Citar as finalidades da escala de serviço.


  Citar a existência da recomendação da utilização do aeronauta, pela escala, em sistema de
  rodízio.


  Citar a existência da obrigatoriedade da informação, pelo aeronauta, do vencimento de suas
  habilitações.


  Citar as regras para divulgação da escala de serviço.


  Citar as finalidades da escala especial ou convocação.


  Definir jornada de trabalho.


  Citar o local de início da jornada de trabalho, de modo geral, na base domiciliar.


  Citar o local de início da jornada de trabalho de modo geral, fora da base domiciliar.


  Citar a regra de início e de término da jornada de trabalho em caso de voo.


  Citar a duração máxima da jornada de trabalho de uma tripulação mínima e de uma tripulação
  simples.


  Citar o limite máximo de horas noturnas dentro da jornada de trabalho de uma tripulação
  simples.


  Explicar como é efetuada a contagem de horas de trabalho noturnas de uma tripulação simples
  em horários mistos.


  Citar a duração máxima da jornada de trabalho de uma tripulação composta.


  Citar a duração máxima da jornada de trabalho de uma tripulação de revezamento.


  Enunciar as situações em que é permitida a ampliação dos limites da jornada de trabalho


  Citar a existência da obrigatoriedade de comunicação, à Agência Nacional de Aviação Civil
  - ANAC, da ampliação da jornada de trabalho.


  Citar o limite máximo semanal e o limite máximo mensal da jornada de trabalho.


  Definir viagem.


  Citar a existência da possibilidade da realização de mais de uma jornada dentro de uma só
  viagem.


  Citar a existência da possibilidade de uma combinação de voos que passem pela base e não
  dispensem o aeronauta do serviço.


  Citar a existência da exigência da complementação do voo ao final da viagem, com vista a
  atender à realização ou à conclusão de serviços inadiáveis.


  Citar a regra sobre o regresso de viagem de tripulação simples entre as vinte e três horas
  e as seis horas, tendo havido, pelo menos, três horas de jornada.


  Definir sobreaviso.


  Citar a duração máxima do sobreaviso.


  Citar o local do cumprimento do sobreaviso.


  Citar o período mínimo exigido no sobreaviso entre a convocação do tripulante e a sua apresentação
  no aeroporto.


  Citar os limites máximos semanal e mensal do sobreaviso.


  Citar a existência da não aplicação dos limites do sobreaviso nos casos de empresas de táxi
  aéreo e de empresas de serviços aéreos especializados.


  Definir reserva.


  Citar a duração máxima da reserva no caso de aeronautas de empresas de táxi aéreo e de serviços
  aéreos especializados, bem como no caso de aeronautas das demais empresas.


  Citar a existência da obrigatoriedade de ser propiciado descanso com acomodações adequadas
  em caso de reserva superior a três horas.


  Definir hora de voo.


  Explicar a forma pela qual são computados o início e o término da hora de voo.


  Indicar os limites máximos do número de horas de voo e de pousos por jornada - para tripulação
  mínima, para tripulação simples, para tripulação composta e para tripulação de revezamento


  Citar as situações excepcionais em que se admite o aumento dos limites do número de pousos
  para tripulação mínima, para tripulação simples, para tripulação composta, para tripulação
  de revezamento e para empresa de transporte aéreo regional operando aviões convencionais
  e turboélice.


  Citar os limites máximos de horas de voo mensal, trimestral e anual no caso de avião convencional,
  no caso de avião turboélice e no caso de avião a jato, bem como as exceções no caso de aeronauta
  que tripula diferentes tipos de aeronave, no caso de aeronauta que tripula aeronave em espaço
  inferior a trinta dias e no caso de aeronauta que se desloca como tripulante extra.


  Definir repouso.


  Citar os limites mínimos de horas de repouso de acordo com a jornada de trabalho realizada
  anteriormente.


  Citar o mínimo de horas que é acrescentado nos limites mínimos de horas de repouso em caso
  de cruzamento de três ou mais fusos horários em um dos sentidos da viagem.


  Citar a existência da garantia do fornecimento de acomodações e de transporte (ou de ressarcimento
  de despesa com transporte) para repouso fora da base.


  Citar a existência da postergação do início da contagem do período de repouso em caso da
  não disponibilidade de transporte ao término da jornada.


  Definir folga periódica.


  Indicar o início da folga periódica.


  Citar a duração mínima da folga periódica.


  Indicar a base como local de gozo da folga periódica, em geral.


  Citar o limite máximo de períodos trabalhados que confere o direito à folga periódica.


  Citar a regra de concessão de folga periódica em caso de voo internacional longo não previamente
  programado.


  Citar o local de gozo da folga em caso de participação em curso fora da base.


  Citar o limite mínimo mensal de folgas.


  Citar a existência da obrigatoriedade da concessão de folga mensal de dois períodos consecutivos
  de vinte e quatro horas cada, abrangendo, pelo menos, um sábado ou um domingo.


  Citar a regra de cálculo da remuneração do sobreaviso.


  Citar a regra de cálculo da remuneração da reserva e da hora de voo diurna.


  Citar a regra de cálculo da remuneração da hora de voo noturna.


  Citar o documento que regulamenta o valor das diárias a serem pagas ao aeronauta.


  Citar os tipos de diária aos quais o aeronauta tem direito, bem como os respectivos horários
  a que se referem.


  Citar os intervalos máximos permitidos entre refeições do aeronauta durante um voo.


  Citar a existência da obrigatoriedade de ser servida uma refeição em voo ao aeronauta entre
  as vinte e duas horas e as seis horas.


  Citar as durações mínima e máxima da refeição do aeronauta em terra durante uma jornada
  de voo.


  Citar os períodos destinados a refeições do aeronauta quando em reserva ou em programação
  de treinamento.


  Citar a duração máxima da refeição do aeronauta quando em reserva ou em programação de treinamento.


  Citar a existência da obrigatoriedade de concessão gratuita de assistência médica ao aeronauta
  quando fora da base.


  Citar a existência do fornecimento gratuito e obrigatório, ao aeronauta, de peças de uniforme
  e de equipamentos exigidos para o exercício da função.


  Citar a duração das férias do aeronauta.


  Citar a existência da necessidade de notificação antecipada das férias do aeronauta, por
  parte do operador aéreo.


  Citar a existência da proibição da conversão de férias em abono pecuniário.


  Definir transferência provisória.


  Citar o intervalo mínimo permitido entre duas transferências provisórias do aeronauta.


  Citar os direitos assegurados ao aeronauta no caso de transferência provisória.


  Citar a antecedência mínima que deve ser respeitada pelo empregador para notificar ao aeronauta
  sua transferência provisória.


  Definir transferência permanente.


  Citar o intervalo mínimo permitido entre duas transferências permanentes do aeronauta.


  Citar os direitos assegurados ao aeronauta no caso de transferência permanente.


  Citar a antecedência mínima que deve ser respeitada pelo empregador para notificar ao aeronauta
  sua transferência permanente.


  RT - RADIOTELEFONIA - EXAMES: PLA E PLH


  Demonstrar conhecimento acerca do procedimentos de comunicação e fraseologia aplicados às
  operações de aeronaves sob regras de voo por instrumentos (IFR); ações a serem tomadas em
  caso de falha na comunicação.

  TV - TEORIA DE VOO - EXAMES: PPA, PPL E CPA


  ANATOMIA DO VOO DO AVIÃO


  Conhecimentos básicos de Física


  Conceituar vetor.


  Efetuar operações com vetores.


  Identificar os diferentes tipos de movimento.


  Caracterizar a grandeza vetorial força, seus tipos, efeitos e unidades.


  Identificar as principais forças de resistência.


  Enunciar as leis de Newton e suas aplicações.


  Conceituar trabalho e potência.


  Citar as unidades de medidas de trabalho e potência.


  Calcular temperaturas aplicando as diferentes escalas termométricas.


  Distinguir os principais tipos de termômetro.


  Enunciar o princípio fundamental da calorimetria.


  Enunciar as leis de Charles e de Boyle.


  Aerodinâmica


  Enumerar as leis e os princípios da Física que são básicos para o estudo da aerodinâmica.


  Interpretar as informações indicadas no velocímetro.


  Identificar as forças que agem sobre um corpo no ar.


  Identificar as forças que atuam sobre uma aeronave em voo, bem como os fatores que nelas
  influem.


  Hélices


  Identificar os efeitos da hélice nas manobras das aeronaves.


  Comandos de voo e superfícies de comando


  Identificar os princípios de funcionamento dos comandos (ou controles) de voo nas manobras
  das aeronaves.


  Dispositivos hipersustentadores


  Identificar as funções dos dispositivos hipersustentadores nas manobras das aeronaves.


  Esforços estruturais e fator carga


  Descrever os efeitos dos esforços estruturais que sofrem as aeronaves e as manobras correspondentes
  aos problemas deles derivados.


  Mecânica de voo e performances


  Descrever as peculiaridades do voo em função dos diversos fatores que influenciam a realização
  das manobras de: decolagem, subida, voo cruzeiro, curvas, descida e pouso.


  Atitudes anormais


  Descrever as características das atitudes anormais, em especial, os “parafusos”.


  Estabilidade e controle


  Identificar os diferentes tipos de equilíbrio estático e dinâmico, descrevendo os respectivos
  efeitos.


  Descrever os diferentes tipos de estabilidade de uma aeronave e os efeitos provocados por
  cada um de seus elementos ou componentes.


  Descrever o comportamento da estabilidade do avião em função das variações de potência e
  de altitude.


  Cálculo de peso e balanceamento para o planejamento de voo


  Efetuar os cálculos de peso e de balanceamento para o planejamento de voo.


  Enunciar os diversos pesos atribuídos às aeronaves em função do combustível, da carga e
  dos equipamentos de voo de uso regulamentar.


  Reconhecer a importância do CG na estabilidade da aeronave e os limites do CG que uma aeronave
  pode suportar.


  Utilizar corretamente os gráficos e tabelas com as limitações e performances de uma aeronave
  para planejamento de voo.


  Efetuar os cálculos de peso e balanceamento de uma aeronave.


  Identificar os procedimentos relativos ao carregamento e à amarração de cargas nas aeronaves.

  TV - TEORIA DE VOO - EXAME: PPH


  AERODINÂMICA DO HELICÓPTERO


  Princípios básicos de aerodinâmica e física


  Enunciar os princípios da aerodinâmica e de física que incidem sobre uma aeronave em voo.


  Mecânica de voo e efeitos associados


  Reconhecer os diferentes efeitos associados à mecânica de voo dos helicópteros.


  Fenômenos características e técnicas de pilotagem


  Relacionar a atitude da aeronave considerando-se os eixos de manobra.


  Descrever as formas de operação dos diferentes comandos do voo.


  Mecânica de voo e efeitos associados


  Reconhecer as causas dos diferentes tipos de estol e os procedimentos para se evitar ou
  sair dele.


  Estabilidade


  Discriminar os diferentes tipos de equilíbrio estático e dinâmico, descrevendo os respectivos
  efeitos.


  Peso e balanceamento


  Identificar os elementos a serem considerados no cálculo do peso e do balanceamento do helicóptero.


  Generalidades do helicóptero


  Identificar os diferentes tipos de rotor.


  Reconhecer a nomenclatura básica para a classificação dos helicópteros.


  Elementos que atuam no voo do helicóptero


  Explicar a atuação dos diferentes elementos sobre um helicóptero em voo.


  Segurança no solo


  Interpretar o conjunto de sinalizações padronizadas durante a operação no solo.


  Manobras de voo


  Explicar as peculiaridades das diferentes manobras de voo.


  Explicar as peculiaridades das operações em área restrita.


  Explicar as características das condições de voo do helicóptero, inclusive as de emergência.

  TV - TEORIA DE VOO - EXAME: PCA/IFR


  Aerodinâmica


  Identificar os princípios básicos da aerodinâmica


  Identificar as forças que atuam sobre uma aeronave em voo, bem como os fatores que nelas
  influem.


  Hélices


  Identificar as funções das hélices, comandos de voo e dispositivos hipersustentadores nas
  manobras das aeronaves.


  Comandos de voo


  Identificar as funções das hélices, comandos de voo e dispositivos hipersustentadores nas
  manobras das aeronaves.


  Dispositivos hipersustentadores


  Identificar as funções das hélices, comandos de voo e dispositivos hipersustentadores nas
  manobras das aeronaves.


  Esforços estruturais


  Explicar os efeitos dos esforços estruturais realizados pelas aeronaves e as manobras correspondentes
  aos problemas deles derivados.


  Parafusos


  Explicar as peculiaridades dos parafusos e das situações de perda.


  Estabilidade e controle


  Reconhecer os efeitos dos diferentes tipos de equilíbrio e dinâmico.


  Peso, balanceamento e performance


  Caracterizar peso, balanceamento e performance de aeronaves de baixa velocidade.


  Mecânica de voo e performance de subida


  Explicar as peculiaridades do voo horizontal, do voo em descida, do voo ascendente e do
  voo em curva.


  Mecânica de voo e performance em cruzeiro


  Explicar as peculiaridades do voo horizontal, do voo em descida, do voo ascendente e do
  voo em curva.


  Mecânica de voo e performance de descida


  Explicar as peculiaridades do voo horizontal, do voo em descida, do voo ascendente e do
  voo em curva.


  Performance de pouso e decolagem


  Explicar as peculiaridades da decolagem e do pouso.


  Manobras: voo em curva


  Explicar as peculiaridades do voo horizontal, do voo em descida, do voo ascendente e do
  voo em curva.


  Noções aplicáveis ao planejamento de voo


  Reconhecer os elementos necessários ao planejamento de voo.


  Teoria de voo de alta velocidade


  Explicar os efeitos da alta velocidade sobre o desempenho da aeronave.


  Reconhecer os efeitos da alta velocidade sobre o desempenho da aeronave.


  Fator carga


  Explicar os efeitos causados pelo fator carga, bem como as manobras correspondentes aos
  problemas dele derivados.


  TV - TEORIA DE VOO - EXAME: PCH


  Princípios básicos de aerodinâmica e física


  Explicar os efeitos das propriedades do ar sobre uma aeronave em voo.


  Explicar os diferentes efeitos causados pelas forças que atuam sobre a aeronave.


  Explicar a atuação das forças básicas sobre um helicóptero em voo


  Comandos de voo e superfícies de comando


  Reconhecer os dispositivos dos controles dos movimentos de helicóptero.


  Identificar os diferentes efeitos causados pelos comandos de voo.


  Estabilidade


  Discriminar os diferentes tipos de equilíbrio estático e dinâmico, descrevendo os respectivos
  efeitos.


  Generalidades do helicóptero


  Identificar os diferentes tipos de rotor.


  Segurança no solo


  Interpretar o conjunto de sinalizações padronizadas durante a operação no solo.


  Mecânica de voo e performance


  Explicar as peculiaridades do voo horizontal, do voo planado, do voo ascendente, do voo
  em curva, do voo pairado.


  Manobras de voo


  Explicar as peculiaridades da decolagem e do pouso.


  Explicar as peculiaridades das operações em área restrita.


  Explicar as características das condições de voo do helicóptero, inclusive as de emergência.


  Teoria de voo de alta velocidade


  Explicar os efeitos da alta velocidade sobre o comportamento da aeronave.


  Fator carga


  Explicar os efeitos causados pelo fator carga, bem como as manobras correspondentes aos
  problemas dele derivados.

  TV - TEORIA DE VOO - EXAME: PBL


  Compreender os princípios do voo relacionados aos balões.

  Nota: esta prova pode conter também os objetivos de aprendizagem listados em PBL - OUTROS
  TÓPICOS NO EXAME DE PBL


  PBL - OUTROS TÓPICOS NO EXAME DE PBL

  Os seguintes tópicos serão incluídos nas outras provas de PBL:


  Performance de Voo, Planejamento e Carregamento


  Conhecer os Efeitos do carregamento nas características de voo; cálculos de peso e balanceamento


  Compreender o uso e aplicação prática de dados de performance na decolagem, pouso e em outras
  condições, incluindo o efeito da temperatura.


  Organizar o planejamento pré-voo e em rota para operações sob regras de voo VFR; procedimentos
  de serviço de tráfego aéreo; procedimentos para ajuste de altímetro; operações em áreas
  de alta densidade de tráfego aéreo.


  Desempenho Humano


  Analisar o desempenho humano relevante ao voo de balão, incluindo os princípios do TEM (Threat
  and Error Management).


  Procedimentos Operacionais


  Conhecer o uso de documentação aeronáutica tais como AIP, NOTAM, códigos e abreviaturas
  aeronáuticas.


  Analisar os procedimentos de precaução e de emergência apropriados, incluindo ações a serem
  tomadas para evitar condições meteorológicas adversas, esteira de turbulência e outras ameaças
  operacionais.'
