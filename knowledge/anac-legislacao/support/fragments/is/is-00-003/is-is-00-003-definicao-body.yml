  Discorrer sobre as interferências exercidas nas condições meteorológicas pelos seguintes
  fenômenos: linhas de instabilidade e de cortante, calmarias doldrums, Zona de Convergência
  Intertropical (Intertropical Convergence Zone - ITCZ), ondas de leste, inversão dos ventos
  alíseos, Zona de Convergência do Atlântico Sul (ZCAS), monções e fenômeno El Niño e La Niña.


