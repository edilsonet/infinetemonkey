  Demonstrar s circulação de calor entre equador e polos.


  Reconhecer as modificações na circulação em função da rotação terrestre.


  Identificar ventos predominantes, sistemas de pressão, frentes e tropopausa.


  Modificações nas zonas climáticas


  Reconhecer a influência na modificação das zonas climáticas pelos seguintes fatores: intensidade
  de luz solar e sua variação com a latitude; distribuição de terras e águas; ventos predominantes;
  barreiras montanhosas; posição das principais áreas de alta e de baixa pressão.


  Distribuição de elementos do clima


  Levantar informações meteorológicas concernentes a: - distribuição de pressão na superfície
  e correspondente padrão de vento - posições de zonas frontais principais - causa e frequência
  de falta de visibilidade da superfície - variações na temperatura do ar na superfície nas
  camadas altas - variações nos ventos superiores - frequência e intensidade de precipitação
  e trovoadas - frequência e gravidade das condições favoráveis para formação de gelo nas
  aeronaves - frequência e gravidade das condições em que ocorre turbulência de céu claro.


  Classificação climática


