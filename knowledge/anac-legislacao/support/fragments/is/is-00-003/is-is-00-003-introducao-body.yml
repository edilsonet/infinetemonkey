title: Introdução
text: 'Introdução


  Definir primeiros socorros.


  Identificar a prestação de primeiros socorros pelo comissário de voo como parte integrante
  de seu encargo relativo à segurança e ao atendimento do passageiro a bordo.


  Evidenciar a importância do treinamento em primeiros socorros.


  Citar a primeira providência a ser tomada pelo comissário de voo quando da necessidade de
  prestação de primeiros socorros.


  Citar os principais recursos para primeiros socorros disponíveis na aeronave.


  Caracterizar o Conjunto Médico de Emergência quanto à aplicabilidade e ao conteúdo.


  Caracterizar o Conjunto de Primeiros Socorros quanto à aplicabilidade e ao conteúdo.


  Evidenciar a importância do controle do Conjunto Médico de Emergência e do Conjunto de Primeiros
  Socorros.


  Caracterizar o sistema portátil de oxigênio medicinal ou terapêutico quanto à finalidade
  e aos componentes.


  Citar os procedimentos a serem executados pelo comissário de voo para a utilização, por
  passageiro, do sistema de oxigênio medicinal ou terapêutico.


  Caracterizar o sistema portátil de oxigênio de emergência quanto à finalidade e aos componentes.


  Citar os procedimentos a serem executados pelo comissário de voo para utilização do sistema
  portátil de oxigênio de emergência.


  Citar os itens do sistema portátil de oxigênio de emergência que devem ser checados antes
  do voo.


  Suporte Básico de Vida


  Definir suporte básico de vida.


  Definir obstrução de vias aéreas superiores por corpo estranho.


  Identificar os sinais e os sintomas da obstrução de vias aéreas superiores por corpo estranho.


  Citar os procedimentos corretivos não invasivos apropriados para desobstrução de vias aéreas
  superiores em bebês (até um ano), em crianças (de um a oito anos), em adultos (com mais
  de oito anos), em gestantes e em obesos, segundo protocolos da American Heart Association.


  Definir parada respiratória e parada cardiorrespiratória.


  Identificar os sinais e os sintomas de parada respiratória e de parada cardiorrespiratória.


  Citar os procedimentos corretivos não invasivos apropriados para casos de parada respiratória
  e parada cardiorrespiratória em bebês, em crianças e em adultos, segundo protocolos da American
  Heart Association.


  Emergências clínicas


  Identificar os sinais indicativos da necessidade de primeiros socorros em razão de hipóxia
  hipobárica.


  Citar os procedimentos corretivos apropriados a serem executados pelo comissário de voo
  em caso de hipóxia hipobárica.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aerodilatação
  no sistema digestivo.


  Citar os procedimentos corretivos não invasivos apropriados a serem executados pelo comissário
  de voo em caso de aerodilatação no sistema digestivo.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aerodilatação
  nos seios da face.


  Citar os procedimentos corretivos não invasivos apropriados a serem executados pelo comissário
  de voo em caso de aerodilatação no ouvido médio.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aeroembolismo
  na forma cutânea.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aeroembolismo
  na forma articular.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aeroembolismo
  na forma pulmonar.


  Identificar os sinais indicativos da necessidade de primeiros socorros em caso de aeroembolismo
  na forma nervosa.


  Citar os procedimentos corretivos apropriados a serem executados pelo comissário de voo
  em caso de aeroembolismo na forma cutânea, aeroembolismo na forma articular, aeroembolismo
  na forma pulmonar e aeroembolismo na forma nervosa.


  Definir desmaio.


  Identificar os sinais e os sintomas que precedem o desmaio.


  Citar os procedimentos preventivos apropriados a serem executados pelo comissário de voo
  para evitar o desmaio.


  Citar os procedimentos corretivos não invasivos apropriados a serem executados pelo comissário
  de voo em caso de desmaio.


  Definir angina e infarto agudo do miocárdio.


  Identificar os sinais e os sintomas da angina e do infarto agudo do miocárdio.


  Citar os procedimentos corretivos não invasivos apropriados a serem executados pelo comissário
  de voo em caso de angina e de infarto agudo no miocárdio.


  Identificar os sinais e os sintomas de acidente vascular cerebral.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em caso de acidente vascular cerebral.


  Definir convulsão.


  Citar as causas de convulsões.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  durante e após convulsões.


  Identificar os sinais e os sintomas do consumo excessivo de álcool.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em caso de consumo excessivo de álcool.


  Definir hipoglicemia e hiperglicemia.


  Identificar os sinais e os sintomas de hipoglicemia e de hiperglicemia.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em situações de hipoglicemia e de hiperglicemia.


  Enunciar as possíveis causas da dor de orelha.


  Citar os procedimentos corretivos não invasivos apropriados a serem executados pelo comissário
  de voo em caso de dor de orelha.


  Definir diarreia, vômito, enjoo/náusea, cólica e azia.


  Citar as possíveis causas de diarreia, vômito, enjoo/náusea, cólica e azia.


  Citar a orientação que deverá ser dada, pelo comissário de voo, a passageiros vítimas de
  diarreia, vômito, enjoo/náusea, cólica e azia.


  Definir asma e choque anafilático.


  Identificar os sinais e os sintomas de asma e de choque anafilático.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em casos de asma e de choque anafilático.


  Definir insolação, intermação, hipotermia e hipertermia/febre.


  Indicar os sinais e os sintomas de insolação, intermação, hipotermia e hipertermia/febre.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em caso de insolação, intermação, hipotermia e hipertermia/febre.


  Definir envenenamento.


  Identificar os sinais e os sintomas de cada uma das formas de envenenamento.


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  para cada uma das formas de envenenamento.


  Definir parto de emergência.


  Identificar os sinais indicativos do início do parto.


  Preparar os recursos materiais necessários para o parto.


  Acomodar a parturiente para a realização do parto.


  Citar os procedimentos a serem executados pelo comissário de voo com a parturiente e o feto
  durante o parto.


  Citar os procedimentos a serem executados pelo comissário de voo com a mãe e o bebê após
  o parto.


  Emergências traumáticas


  Definir queimadura.


  Citar os procedimentos não invasivos a serem executados pelo comissário de voo em caso de
  queimadura que não afete os olhos.


  Citar os procedimentos não invasivos a serem executados pelo comissário de voo em caso de
  queimadura nos olhos.


  Citar os procedimentos não invasivos a serem executados pelo comissário de voo ao lidar
  com pessoa em chamas.


  Citar os procedimentos preventivos destinados a evitar mordidas, picadas, bicadas, ferroadas,
  irritações, queimaduras, sucções, penetrações e invasões de outros animais (animais irracionais
  de sangue quente, de modo geral, incluindo animais de regiões geladas, tais como ursos,
  machos de focas, leopardos, leões marinhos e aves do tipo skua ou gaivota de rapina; cobras;
  aranhas; escorpiões; seres humanos; piranha; sanguessuga; arraia; candiru; poraquê; tubarão;
  moréia; barracuda; ouriço; medusa; anêmona; caracol venenoso; carrapato; e bicho-de-pé e
  outros insetos).


  Citar os procedimentos corretivos não invasivos a serem executados pelo comissário de voo
  em casos de mordidas, picadas, bicadas, ferroadas, irritações, queimaduras, sucções, penetrações
  e invasões de outros animais (animais irracionais de sangue quente, de modo geral, incluindo
  animais de regiões geladas, tais como ursos, machos de focas, leopardos, leões marinhos
  e aves do tipo skua ou gaivota de rapina; cobras; aranhas; escorpiões; seres humanos; piranha;
  sanguessuga; arraia; candiru; poraquê; tubarão; moréia; barracuda; ouriço; medusa; anêmona;
  caracol venenoso; carrapato; e bicho-de-pé e outros insetos).


  Definir hemorragia.


  Definir hemorragia interna.


  Definir hemorragia externa.


  Definir choque hipovolêmico.


  Citar os procedimentos de hemostasia a em casos de hemorragias externas.


  Definir traumatismos.


  Definir traumatismos abertos.


  Citar os procedimentos a serem executados pelo comissário de voo em casos de traumatismos
  abertos, conforme a localização destes.


  Definir traumatismos fechados.


  Citar os procedimentos a serem executados pelo comissário de voo em casos de traumatismos
  fechados.


  Definir contusão, entorse e luxação.


  Definir fraturas.


  Descrever as técnicas de imobilização apropriadas a serem aplicadas pelo comissário de voo
  em caso de fratura.


  Citar a finalidade da triagem de vítimas de acidentes aéreos.


  Descrever cada uma das técnicas a serem aplicadas pelo comissário de voo para remoção de
  vítimas - cadeirinha, maca, padiola, arrasto, arrasto em manta, apoio nas costas e nos braços
  e bombeiro.


  REG - REGULAMENTOS - EXAMES DE PLA E PLH


  Demonstrar conhecimento acerca dos seguintes tópicos:


  Direito internacional: convenções, acordos e organizações marcas de nacionalidade e registro
  de aeronaves


  Marcas de nacionalidade e registro de aeronaves


  Licenciamento de pessoal


  Regras do Ar


  Aeródromos


  Facilitação de formalidades em terra para a liberação de aeronaves e passageiros, mercadorias
  e correspondências, no que diz respeito aos requisitos das autoridades aduaneiras, de imigração,
  de saúde pública e agrícolas


  Segurança


  Investigação de acidentes e incidentes de aeronaves


  Profissão do Aeronauta


  Regras de voo por instrumentos (IFR)


  REG - REGULAMENTOS - EXAME DE PBL


  Conhecer as regras e normativos relevantes ao detentor de uma licença de piloto de balão.


  Conhecer as Regras do ar.


  Conhecer os Procedimentos e atuação do serviço de tráfego aéreo.

  Nota: esta prova pode conter também os objetivos de aprendizagem listados em PBL - OUTROS
  TÓPICOS NO EXAME DE PBL


  REG E AAREG - REGULAMENTOS - EXAMES: TODOS EXCETO PBL, PLA E PLH


  DIREITO INTERNACIONAL: CONVENÇÕES, ACORDOS E ORGANIZAÇÕES


  A Convenção sobre Aviação Civil Internacional (Chicago) - ICAO DOC 7300


  Explique o contexto histórico que levou ao estabelecimento da Convenção sobre a Aviação
  Civil Internacional, Chicago, 7 de dezembro de 1944.


  Parte I - Navegação aérea


  Estar familiarizado com o conteúdo geral de partes relevantes dos seguintes capítulos:


  princípios gerais e aplicação da Convenção;


  sobrevoar o território dos Estados Contratantes;


  nacionalidade da aeronave;


  medidas para facilitar a navegação aérea;


  condições a serem cumpridas em relação às aeronaves;


  normas internacionais e práticas recomendadas (SARP), especialmente notificação de diferenças
  e validade de certificados e licenças endossados.


  Descreva a aplicação dos seguintes termos na aviação civil:


  soberania;


  território, alto mar, de acordo com a Convenção das Nações Unidas sobre o alto mar.


  Defina os seguintes termos e explique como eles se aplicam ao tráfego aéreo internacional:


  direito de voo não regular (incluindo as duas liberdades técnicas do ar);


  serviços aéreos regulares;


  cabotagem;


  desembarque nos aeroportos aduaneiros;


  aplicabilidade da regulamentação do ar;


  regras do ar;


  busca de aeronaves.


  Descreva os deveres dos Estados Contratantes em relação a:


  documentos transportados a bordo da aeronave:


  certificado de registração;


  certificados de aeronavegabilidade;


  licenças de pessoal;


  reconhecimento de certificados e licenças;


  restrições de carga;


  aparelhos fotográficos.


  Parte II - A Organização da Aviação Civil Internacional (OACI)


  Descreva os objetivos da OACI.


  Explique a organização e os deveres da Assembleia da ICAO, do Conselho e da Comissão de
  Navegação Aérea (ANC).


  Explique a organização e os deveres da sede da ICAO e dos escritórios regionais.


  Descreva as regiões mundiais da ICAO.


  Familiarize-se com a hierarquia das publicações da ICAO (SARP, Doc):


  anexos à convenção;


  documentos.


  O Acordo Internacional de Trânsito de Serviços Aéreos (ICAO Doc 7500)


  Explique as duas liberdades técnicas do ar.


  O Acordo Internacional de Transporte Aéreo


  Explique as três liberdades comerciais do ar.


  Descreva a situação jurídica na UE em relação às liberdades do ar.


  Descreva a situação legal no NAM e no NAT em relação às liberdades do ar.


  Descreva a situação legal no CAR e no SAM com relação às liberdades do ar.


  Supressão de atos ilícitos contra a segurança da aviação civil


  Explicar os fatos que levaram às convenções e suplementos relativos a atos ilegais contra
  a segurança da aviação civil


  Explique o conteúdo da Convenção sobre Atos Ilícitos cometidos a bordo de aeronaves. Doc
  8364 - Convenção sobre ofensas e certos outros atos cometidos a bordo de aeronaves, Tóquio,
  14 de setembro de 1963.


  Explique o conteúdo da Convenção sobre Supressão de Apreensão Ilegal de Aeronaves. Doc 8920
  - Convenção para a supressão de apreensões ilegais de aeronaves, Haia, 16 de dezembro de
  1970, e Protocolo para a supressão de atos ilegais contra a segurança da aviação civil,
  Montreal, 23 de setembro de 1971.


  Explique o conteúdo da Convenção sobre Supressão de Atos Ilícitos de Violência nos Aeroportos
  que Servem à Aviação Civil Internacional, de acordo com o Doc 8966 - Convenção para a Supressão
  de Atos Ilegais contra a Segurança da Aviação Civil, realizado em Montreal em 23 de setembro
  de 1971 e assinado em Montreal em 24 de fevereiro de 1988.


  Descreva as medidas e ações a serem tomadas pelo PIC de uma aeronave para suprimir atos
  ilegais contra a segurança da aeronave. Doc 9518 - Protocolo complementar à Convenção para
  a Supressão de Atos Ilegais contra a Segurança da Aviação Civil, realizado em Montreal em
  23 de setembro de 1971 e assinado em Montreal em 24 de fevereiro de 1988.


  Acordos bilaterais


  Explicar o motivo da existência de acordos bilaterais para transporte aéreo programado.
  Resumo dos acordos bilaterais de transporte aéreo, Doc 9511 da OACI.


  Direito privado internacional


  Explique as convenções e protocolos projetados para cobrir a responsabilidade perante pessoas
  e mercadorias de acordo com o Sistema de Varsóvia, com base na Convenção para a Unificação
  de Certas Regras Relativas ao Transporte Aéreo Internacional, Varsóvia, 2 de outubro de
  1929.


  Explique o significado legal da emissão de um bilhete de passageiro e / ou de documentos
  de bagagem / carga.


  Descreva as consequências para uma companhia aérea e / ou o PIC quando um bilhete de passageiro
  não for emitido.


  Explique que a responsabilidade para com pessoas e mercadorias pode ser ilimitada com base
  na Convenção de Montreal de 28 de maio de 1999.


  Explique as consequências do regulamento da UE sobre os direitos dos passageiros em caso
  de atraso, cancelamento ou recusa de embarque.


  Explique o limite de responsabilidade em relação à destruição, perda, dano ou atraso de
  bagagem.


  Explique as consequências do regulamento brasileiro sobre os direitos dos passageiros em
  caso de atraso, cancelamento ou recusa de embarque.


  Responsabilidades dos operadores e pilotos em relação a pessoas e mercadorias no solo em
  caso de danos e ferimentos causados pela operação da aeronave


  Explicar as convenções e protocolos projetados para cobrir a responsabilidade de pessoas
  e mercadorias no terreno, com base na Convenção Internacional para Regras Relativas a Danos
  Causados por Aeronaves, assinada em Roma em 29 de maio de 1933 e 7 de outubro de 1952 e
  em Montreal em 23 de setembro de 1978.


  A Convenção de Roma (1933) e outros documentos relacionados aos direitos das aeronaves


  Compreender as regras relacionadas ao reconhecimento internacional de direitos em aeronaves
  e as regras relacionadas à prisão preventiva de aeronaves.


  Parte III - Organizações mundiais


  A Associação de Transporte Aéreo Internacional (IATA)


  Descreva a organização e os objetivos gerais da IATA.


  A Flight Safety Foundation (FSF)


  Descreva a organização e os objetivos gerais da FSF.


  Comunidade das Autoridades de Aviação Civil Lusófonas (CAACL)


  Descreva a organização e os objetivos gerais da CAACL.


  A Federação Internacional de Associações de Pilotos de Linhas Aéreas (IFALPA)


  Descreva a organização e os objetivos gerais da IFALPA.


  Sistema Regional de Cooperação para a Supervisão da Segurança Operacional (SRVSOP)


  Descreva a organização geral e os objetivos do SRVSOP.


  Descreva o papel do SRVSOP na aviação civil sul-americana.


  Descreva o papel das Autoridades de Aviação Civil (AAC) dos países em relação ao SRVSOP.


  Dê uma visão geral da estrutura dos regulamentos do SRVSOP.


  Descreva o relacionamento entre o SRVSOP, a OACI e outras organizações.


  Corporación Centroamericana de Servicios de Navegación Aérea (COCESNA)


  Descreva o papel da COCESNA na aviação civil sul-americana.


  Comissão Latinoameircana de Aviação Civil (CLAC)


  Faça um breve resumo da CLAC.


  Descreva os objetivos da CLAC e do Acordo Multilateral de Céus Abertos.


  AERONAVEGABILIDADE DAS AERONAVES'
