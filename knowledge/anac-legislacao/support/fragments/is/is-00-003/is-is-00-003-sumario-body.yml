title: SUMÁRIO
text: 'SUMÁRIO

  AVI 1 - AVIÔNICOS - EXAME: AVI

  AVI 2 - AVIÔNICOS - EXAME: AVI

  BAS - MÓDULO BÁSICO - EXAMES: BAS, AVI, CEL E GMP

  CAEP - CONHECIMENTOS AERONÁUTICOS E PEDAGÓGICOS - EXAME: INV

  CEL 1 - CÉLULA - EXAME: CEL

  CEL 2 - CÉLULA - EXAME: CEL

  CGA - CONHECIMENTOS GERAIS DE AERONAVES - EXAME: PLA

  CGA - CONHECIMENTOS GERAIS DE AERONAVES - EXAME: PLH

  CGA - CONHECIMENTOS GERAIS DE AERONAVES - EXAME: CMS

  CTA E AACT - CONHECIMENTOS TÉCNICOS DE AERONAVES - EXAMES: PPA, PPH, PCA, PCH, PPL, CPA,
  MCV E DOV

  CTA - CONHECIMENTOS TÉCNICO DE AERONAVES - EXAME: PBL

  EH - ERRO HUMANO - EXAMES: PLA E PLH

  ESS - EMERGÊNCIA, SEGURANÇA E SOBREVIVÊNCIA - EXAME: CMS

  GMP 1 - GRUPO MOTOPROPULSOR 1 - EXAME: GMP

  GMP 2 - GRUPO MOTOPROPULSOR 2 - EXAME DE GMP

  MET - METEOROLOGIA - EXAMES: PPA, PPL E CPA

  MET - METEOROLOGIA - EXAME: PPH

  MET - METEOROLOGIA - EXAME: PCA

  MET - METEOROLOGIA - EXAME: PCH

  MET - METEOROLOGIA - EXAME: PLA

  MET - METEOROLOGIA - EXAME: PLH

  MET - METEOROLOGIA - EXAME: IFR

  MET - METEOROLOGIA - EXAME: PBL

  MET - METEOROLOGIA - EXAME: DOV MOD 1

  NAV - NAVEGAÇÃO - EXAMES: PPA, PPL E CPA

  NAV - NAVEGAÇÃO - EXAME: PPH

  NAV - NAVEGAÇÃO - EXAME: PCA

  NAV - NAVEGAÇÃO - EXAME: PCH

  NAV - NAVEGAÇÃO - EXAMES: PLA E PLH

  NAV - NAVEGAÇÃO - EXAME: IFR

  NAV - NAVEGAÇÃO - EXAME: PBL

  NAV - NAVEGAÇÃO - EXAME: DOV MOD 1

  PLN - PLANEJAMENTO DE VOO - EXAME: DOV MOD 2

  PO - PROCEDIMENTOS OPERACIONAIS - EXAMES DE PLA

  PO - PROCEDIMENTOS OPERACIONAIS - EXAME: PLH

  PPB - PERFORMANCE, PESO E BALANCEAMENTO - EXAMES: PLA E PLH

  PPB - PERFORMANCE, PESO E BALANCEAMENTO - EXAMES: MCV E DOV MOD 2

  PV - PRINCÍPIOS DE VOO - EXAME: PLA

  PV - PRINCÍPIOS DE VOO - EXAME: PLH

  PPS - MEDICINA AEROESPACIAL E PRIMEIROS SOCORROS - EXAME: CMS

  REG - REGULAMENTOS - EXAMES DE PLA E PLH

  REG - REGULAMENTOS - EXAME DE PBL

  REG E AAREG - REGULAMENTOS - EXAMES: TODOS EXCETO PBL, PLA E PLH

  RPA - REGULAMENTOS DA AVIAÇÃO CIVIL E DA PROFISSÃO DO AERONAUTA - EXAME: CMS

  RT - RADIOTELEFONIA - EXAMES: PLA E PLH

  TV - TEORIA DE VOO - EXAMES: PPA, PPL E CPA

  TV - TEORIA DE VOO - EXAME: PPH

  TV - TEORIA DE VOO - EXAME: PCA/IFR

  TV - TEORIA DE VOO - EXAME: PCH

  TV - TEORIA DE VOO - EXAME: PBL

  PBL - OUTROS TÓPICOS NO EXAME DE PBL


  AVI 1 - AVIÔNICOS - EXAME: AVI


  INGLÊS TÉCNICO - AVIÔNICOS


  Conhecer o vocabulário básico de ferramentas, componentes e equipamentos, sistemas de aeronaves
  em língua inglesa relacionados a habilitação Aviônicos.


  Interpretar informações, textos técnicos e manuais em língua inglesa relacionados a habilitação
  Aviônicos.


  INSTRUMENTOS DE AERONAVES


  Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um
  deles e o princípio de funcionamento.


  Conhecer os procedimentos e precauções no manuseio e instalação dos instrumentos, a fonte
  de alimentação de cada um e sua finalidade na aeronave.


  Compreender a classificação, as características de construção e os procedimentos de instalação
  dos instrumentos das aeronaves.


  Efetuar adequadamente os procedimentos de remoção e de instalação dos instrumentos das aeronaves.


  Desmontar, inspecionar, montar e calibrar instrumentos de aeronaves.


  Realizar testes, calibragem e manutenção dos diversos instrumentos de aeronaves e seus componentes.


  Efetuar inspeção, testes e compensação de bússolas.


  Detectar defeitos e reconhecer o desempenho dos diversos instrumentos de aeronaves e seus
  componentes.


  Reconhecer as condições de balanceamento do rotor de instrumentos giroscópicos.


  Efetuar as marcações de limites de acordo com os manuais do fabricante da aeronave.


  SISTEMAS ELÉTRICOS DE AERONAVES


  Conhecer as caraterísticas dos sistemas elétricos de acordo com o porte das aeronaves.


  Identificar os fatores que influenciam na escolha do material e da bitola de fios para uma
  instalação elétrica de aeronaves.


  Identificar os símbolos gráficos básicos empregados em diagramas elétricos e eletrônicos.


  Compreender os processos de identificação de fios e cabos condutores.


  Efetuar os procedimentos adequados para inspeção, substituição, instalação e manutenção
  de equipamentos elétricos, de metalização, de cablagens e encaminhamento de fiações.


  Realizar instalação, remoção, testes e manutenção em sistemas de iluminação de aeronaves.


  Aplicar os procedimentos adequados na decapagem, estanhagem e soldagem de condutores.


  Compreender os princípios de funcionamento dos dispositivos de proteção de circuitos.


  Realizar instalação, remoção, inspeção, testes e manutenção nas baterias empregadas nas
  aeronaves.


  Adotar as normas de segurança necessárias e técnicas padronizadas durante a instalação elétrica,
  a amarração de condutores e os procedimentos de manutenção de aeronaves.


  Inspecionar, reparar e substituir componentes dos sistemas elétricos das aeronaves.


  Reconhecer os limites de carga elétrica dos circuitos.


  Efetuar os procedimentos adequados para a substituição de pinos de módulos de aterramento.


  SISTEMAS DE COMUNICAÇÃO E DE NAVEGAÇÃO


  Identificar a função dos componentes dos sistemas de comunicação e de navegação e a sua
  localização na aeronave


  Descrever as condições de instalação dos equipamentos e os procedimentos de manutenção previstos
  pelo fabricante da aeronave


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  sistemas de comunicação e de navegação, inclusive sistemas de piloto automático, servomecanismos,
  sistemas de acoplamento de aproximação, sistemas de intercomunicação, sistemas VOR, ILS,
  LORAN, Radar beacon, FMS e GPWS.


  AVI 2 - AVIÔNICOS - EXAME: AVI


  SISTEMAS ELÉTRICOS DE PARTIDA E DE IGNIÇÃO DE MOTORES


  Reconhecer as características e componentes dos sistemas elétricos de partida e de ignição
  dos motores convencionais e dos motores à reação.


  Compreender os princípios de funcionamento dos sistemas elétricos de partida e de ignição
  dos motores convencionais e dos motores à reação.


  Executar os procedimentos de inspeção e de manutenção dos sistemas de partida e de ignição
  dos motores convencionais e dos motores à reação.


  SISTEMAS ELÉTRICOS DE PROTEÇÃO CONTRA OS EFEITOS DO GELO E DA CHUVA E CONTRA FOGO


  Descrever o desempenho de cada componente dos sistemas de detecção e eliminação do gelo
  em aeronaves e hélices.


  Conhecer os sistemas de controle de gelo, geada e neblina no para-brisa.


  Conhecer e distinguir os componentes dos sistemas de detecção e de extinção de fogo, bem
  como os tipos de agentes extintores.


  Instalar, remover, inspecionar, substituir e executar outros serviços de baixa complexidade
  em componentes de sistemas elétricos de proteção contra os efeitos do gelo e da chuva e
  contra fogo em estruturas.


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  componentes elétricos dos sistemas de detecção e de extinção de fogo no motor.


  Instalar, remover, inspecionar, substituir e executar serviços de baixa complexidade em
  componentes elétricos dos sistemas de controle de gelo e chuva no motor.


  ELETRÔNICA BÁSICA


  Entender o funcionamento e realizar medições utilizando o osciloscópio.


  Entender o funcionamento e uso dos diversos tipos de dispositivos semicondutores.


  Analisar esquemas e circuitos que utilizam dispositivos semicondutores.


  Entender os fatores que afetam a estabilidade dos circuitos transistorizados, bem como os
  meios de estabilização.


  Entender a alimentação de um circuito eletrônico, bem como a proteção contra sobrecarga.


  Realizar testes em circuitos eletrônicos.


  ELETRÔNICA DIGITAL


  Entender o funcionamento de portas lógicas e circuitos combinacionais


  Distinguir as características dos diversos circuitos de um microprocessador.


  Compreender os sistemas de base usados em computadores.


  Efetuar conversão de bases dos sistemas de numeração.


  Efetuar operações de aritmética binária.


  Reconhecer as características dos circuitos de comutação.


  Distinguir as características dos diferentes tipos de encapsulamento dos circuitos integrados.


  Compreender a função dos circuitos multiplexadores e demultiplexadores.


  Identificar os diversos tipos de Flip-flop.


  Reconhecer as diversas classificações da memória.


  Analisar o funcionamento de conversores digital-analógico e analógico-digital.


  Descrever o princípio de funcionamento da CPU.


  Reconhecer os símbolos usados nas representações gráficas de um fluxograma.


  Reconhecer a influência de fenômenos sobre a manutenção de sistemas eletrônicos


  Compreender o funcionamento e realizar testes e manutenção em sistemas


  eletrônicos/digitai típicos


  Compreender as vantagens e desvantagens da transmissão de dados através de fibra ótica.


  Compreender os princípios de funcionamento e os tipos de visores utilizados nas aeronaves


  Efetuar o manuseio adequado de componentes sensíveis a descargas eletrostáticas


  Compreender as restrições, os requisitos de aeronavegabilidade e os possíveis efeitos catastróficos
  decorrentes de alterações não aprovadas em programas utilizados em aeronaves.


  INSPEÇÃO DE AVIÔNICOS


  Compreender os princípios de funcionamento dos componentes elétricos e eletrônicos empregados
  nas aeronaves.


  Reconhecer as condições operacionais dos componentes de aviônicos das aeronaves e os procedimentos
  para a correção dos defeitos, utilizando as informações do manual do fabricante dos equipamentos.


  Reconhecer as condições operacionais dos componentes elétricos e eletrônicos na fuselagem
  e os procedimentos para a correção dos defeitos, utilizando as informações do manual do
  fabricante dos equipamentos.


  Identificar defeitos nos componentes elétricos e eletrônicos das cabines, do setor das asas,
  da seção central, do setor do trem de pouso, das antenas, das luzes da empenagem, do setor
  do motor, da hélice, do setor de comunicação e de navegação, do sistema de piloto automático.


  Reconhecer os componentes internos de um RCCB (disjuntor diferencial).


  Reconhecer as finalidades das inspeções especiais.


  Manusear adequadamente os materiais, ferramentas básicas, equipamentos, instrumentos e componentes
  empregados em oficinas de manutenção dos sistemas aviônicos, de acordo com as normas de
  segurança.


  Executar manutenção elétrica de acordo com as normas de conservação e guarda de material.


  Consultar adequadamente as normas, os manuais e diagramas elétricos para identificação de
  condutores e circuitos elétricos.


  Analisar esquemas dos diversos circuitos dos equipamentos.


  Identificar os princípios básicos de conduta no laboratório e as regras de segurança e de
  conservação dos equipamentos.


  Executar os procedimentos práticos de manutenção nos componentes dos sistemas eletrônicos
  de aeronaves.


  Efetuar testes nos equipamentos eletrônicos de aeronaves.


  Operar componentes de indicação de funções eletrônicas.


  Realizar inspeção e manutenção nas antenas.


  Efetuar testes de bancada.


  Efetuar adequadamente os procedimentos de remoção e instalação de componentes elétricos
  e eletrônicos dos sistemas de aviônicos das aeronaves.


  BAS - MÓDULO BÁSICO - EXAMES: BAS, AVI, CEL E GMP


  COMUNICAÇÃO ORAL E ESCRITA


  Conhecer os conceitos da comunicação oral e escrita e identificar os diferentes tipos de
  comunicação.


  Organizar dados e informações necessárias ao processo de comunicação e aplicar técnicas
  de redação apropriadas em matéria de estrutura, linguagem e apresentação de documentos.


  Redigir documentos técnicos para demonstrar domínio na comunicação escrita, quanto à coesão
  e coerência textual, à correção e à clareza da linguagem, do ponto de vista da norma gramatical.


  MATEMÁTICA


  Efetuar as operações fundamentais nos conjuntos de números inteiros


  Resolver problemas pelo uso de percentagem, razão e proporção.


  Executar operações algébricas.


  Interpretar dados representados em gráficos e tabelas.


  Calcular área e volume de figuras geométricas.


  Efetuar medições utilizando o sistema métrico e o sistema inglês (imperial).


  CIÊNCIAS NATURAIS


  Entender e aplicar os princípios das máquinas (alavanca, plano inclinado simples etc.).


  Reconhecer os princípios da Física aplicáveis às aeronaves e seus sistemas.


  Identificar as leis da Física aplicáveis à aviação.


  Entender os conceitos básicos da matéria e átomo.


  Reconhecer os materiais e substâncias presentes nas diversas atividades realizadas na manutenção
  de aeronaves.


  DESENHO TÉCNICO


  Interpretar os diferentes tipos de desenhos, diagramas e esquemas utilizados na manutenção.


  Executar os diferentes tipos de desenhos técnicos aplicáveis à manutenção.


  Elaborar diagramas e desenhos técnicos específicos da manutenção segundo as normas da ABNT.


  INGLÊS BÁSICO E TÉCNICO


  Conhecer a gramática e o vocabulário básico da língua inglesa.


  Conhecer o vocabulário específico de aeronaves, peças, acessórios e sistemas de aeronaves.


  Interpretar publicações técnicas.


  Interpretar inequivocamente avisos e recomendações em publicações técnicas.


  CONHECIMENTOS BÁSICOS SOBRE AERONAVES DE ASA FIXA E ROTATIVA


  Identificar as forças atuantes sobre uma aeronave em voo.


  Conhecer a estrutura básica de uma aeronave.


  Descrever a atuação das superfícies de comando no direcionamento das aeronaves.


  Compreender os fenômenos relacionados ao voo de aeronaves de asa fixa e asa rotativa.


  Entender os fenômenos associados ao voo de alta velocidade.


  TECNOLOGIA DOS MATERIAIS AERONÁUTICOS


  Distinguir as características e a forma de utilização dos materiais empregados na manutenção
  de aeronaves.


  Compreender os métodos de segurança e frenagem utilizados na manutenção de aeronaves.


  Identificar os processos de tratamento térmico e os diferentes tipos de testes de dureza
  dos metais.


  Executar adequadamente frenagens com arames de freno.


  CONTROLE DE CORROSÃO EM MATERIAIS AERONÁUTICOS


  Identificar os diversos tipos de corrosão em produtos aeronáuticos.


  Descrever os processos de controle da corrosão.


  Inspecionar, identificar e tratar corrosão em materiais aeronáuticos.


  Identificar e selecionar os produtos de limpeza adequados.


  Compreender a importância do processo de limpeza e pintura em materiais aeronáuticos.


  TUBULAÇÕES E CONEXÕES


  Identificar e instalar os diferentes tipos de tubos, mangueiras e conexões utilizados nos
  sistemas das aeronaves.


  Analisar e executar reparos em tubos, mangueiras e conexões.


  Realizar curvaturas, flanges e frisos em tubos rígidos e fixar conexões em tubos flexíveis.


  COMBUSTÍVEIS E SISTEMAS DE COMBUSTÍVEL


  Compreender os procedimentos de pesquisa e análise de falhas de componentes dos sistemas
  de combustíveis, reparos nos tanques de combustível, abastecimento e destanqueio.


  Distinguir as características e os processos de detecção da contaminação dos diversos tipos
  de combustíveis de aviação.


  Descrever o funcionamento dos diferentes tipos de unidades dos sistemas de combustível das
  aeronaves.


  Compreender a importância das normas de segurança relacionadas à manutenção de componentes
  dos sistemas de combustíveis.


  ELETRICIDADE BÁSICA


  Identificar os fundamentos básicos da eletricidade e a aplicação de leis aos circuitos elétricos.


  Calcular e medir capacitância e indutância.


  Calcular e medir potência elétrica.


  Medir corretamente voltagem, corrente, resistência e continuidade.


  GERADORES E MOTORES ELÉTRICOS DE AVIAÇÃO


  Identificar os princípios básicos de funcionamento dos motores elétricos de aeronaves.


  Enunciar o princípio de funcionamento dos geradores de corrente contínua e dos geradores
  de corrente alternada.


  Inspecionar, verificar e solucionar problemas em geradores de corrente contínua e geradores
  de corrente alternada.


  PESO E BALANCEAMENTO


  Entender os procedimentos necessários para a pesagem e balanceamento de aeronaves e seu
  respectivo registro.


  Efetuar adequadamente os procedimentos para pesagens de aeronaves.


  Reconhecer a pesagem da aeronave como procedimento de segurança de voo.


  Verificar a distribuição do peso para a manutenção do equilíbrio de uma aeronave,


  Respeitando as normas pertinentes, instalar ou remover lastros, conforme o caso.


  METROLOGIA E FERRAMENTAS


  Identificar as ferramentas básicas das oficinas, bem como as ferramentas utilizadas para
  corte de metais e para abertura de roscas.


  Descrever os processos adequados de utilização das ferramentas.


  Distinguir os diferentes tipos de escalas dos medidores.


  Descrever o uso correto dos instrumentos de medição de precisão.


  Descrever o uso correto das ferramentas manuais comuns, ferramentas de corte, ferramentas
  de medição e ferramentas de precisão.


  Adotar procedimentos adequados em casos de acidentes ou incidentes com ferramentas.


  Reconhecer a necessidade da observação das normas de segurança durante os trabalhos nas
  oficinas.


  PRINCÍPIOS DA INSPEÇÃO E DOCUMENTAÇÃO DA MANUTENÇÃO


  Identificar os critérios que determinam as inspeções obrigatórias e as especiais.


  Identificar e distinguir os documentos utilizados na manutenção de aeronaves.


  Reconhecer o padrão de dados técnicos das especificações A.T.A. 100.


  Identificar os processos de inspeção para a detecção de falhas nas peças de aeronaves.


  MANUSEIO DE SOLO, SEGURANÇA E EQUIPAMENTOS DE APOIO


  Reconhecer os equipamentos de apoio ao solo adequados a cada tipo de operação.


  Compreender os procedimentos necessários para abastecimento e ancoragem de aeronaves.


  Reconhecer os procedimentos de testes nos equipamentos elétricos e eletrônicos de aeronaves.


  Realizar sinalização padronizada durante as operações de táxi de aeronaves.


  Identificar riscos e perigos latentes durante operações de solo.


  Identificar os tipos de incêndios, os métodos e equipamentos de extinção e reconhecer os
  procedimentos a serem adotados no caso de incêndios.


  Compreender as normas de segurança durante as operações de reboque de aeronaves, levantamento
  da aeronave nos macacos hidráulicos, operações de partida nos motores e execução de trabalhos
  de manutenção.


  REGULAMENTAÇÃO DA AVIAÇÃO CIVIL


  Descrever a função e a abrangência da(o):


  Lei 7.565/1986;


  Lei 11.182/2005;


  Decreto 1.232/1962.


  Identificar a licença e as habilitações do Mecânico de Manutenção Aeronáutica, bem como
  suas prerrogativas e limitações.


  Identificar os órgãos e suas atribuições:


  Departamento de Controle do Espaço Aéreo - DECEA;


  Centro de Investigação e Prevenção de Acidentes Aeronáuticos - CENIPA.


  Reconhecer a necessidade de atualização dos conhecimentos das normas vigentes.


  REGULAMENTAÇÃO DA PROFISSÃO DE MECÂNICO


  Compreender a importância da higiene e segurança no trabalho.


  Identificar os direitos e deveres relativos à profissão perante as Leis do Trabalho.


  Reconhecer a parcela de responsabilidade do mecânico no que diz respeito a acidentes e incidentes
  aeronáuticos.


  SEGURANÇA OPERACIONAL


  Identificar os princípios básicos da filosofia SIPAER.


  Compreender os conceitos relacionados ao Sistema de Gerenciamento de Segurança Operacional
  (SGSO).


  Identificar o papel do pessoal da manutenção na investigação de acidentes e incidentes aeronáuticos.


  Compreender a importância do mecânico de manutenção aeronáutico dentro do Sistema de Gerenciamento
  de Segurança Operacional.


  FATORES HUMANOS NA MANUTENÇÃO AERONÁUTICA


  Compreender as definições de fatores humanos e a evolução dentro da manutenção.


  Fornecer subsídios para identificação de condições latentes, ameaças e fatores de risco
  sistêmicos para a ocorrência de acidentes ou incidentes na manutenção de aeronaves.


  Promover a cultura de segurança na manutenção aeronáutica.


  PRIMEIROS SOCORROS


  Explicar os procedimentos de primeiros socorros a serem adotados no local de trabalho.


  Compreender a importância dos conhecimentos sobre atendimento de emergência a feridos.


  CAEP - CONHECIMENTOS AERONÁUTICOS E PEDAGÓGICOS - EXAME: INV


  DIDÁTICO PEDAGÓGICA


  O Instrutor e a Comunicação


  Identificar os elementos básicos do processo de comunicação.


  Reconhecer a importância dos atributos de um expositor.


  Citar os tipos de comunicação.


  Distinguir as técnicas de comunicação.


  Utilizar adequadamente recursos auxiliares que facilitem a comunicação.


  Relações Interpessoais


  Distinguir que o indivíduo é um ser social.


  Identificar os sistemas humanos


  Citar os fatores que influenciam o comportamento humano


  Descrever a hierarquia das necessidades humanas


  Reconhecer a importância da relação com o outro e com os grupos sociais.


  Recursos Audiovisuais


  Sumariar a teoria que torna válido o uso de recursos audiovisuais em trabalhos didáticos.


  Explicar as razões para o uso dos recursos audiovisuais em trabalhos didáticos.


  Identificar os princípios gerais para uso dos recursos audiovisuais em trabalhos didáticos.


  Processo Ensino-Aprendizagem


  Reconhecer o valor da Psicologia da Educação para o processo ensino-aprendizagem.


  Definir aprendizagem.


  Explicar a diferença entre produtos e processos de aprendizagem.


  Classificar os grupos de produtos existentes.


  Identificar as etapas de uma aprendizagem.


  Explicar transferências de aprendizagem.


  Descrever os fatores que podem ser prejudiciais à aprendizagem.


  Identificar os fatores facilitadores da aprendizagem.


  Identificar os procedimentos utilizados pelo instrutor para facilitar a retenção da aprendizagem.


  A Avaliação e a Crítica


  Reconhecer a importância da avaliação no processo ensino-aprendizagem.


  Identificar a avaliação por apreciação como um dos métodos avaliativos.


  Distinguir os requisitos desejáveis nos instrumentos utilizados na avaliação por apreciação.


  Diferenciar os erros comuns de apreciação.


  Reconhecer a importância da crítica como processo de aprimoramento de desempenhos.


  Identificar a finalidade da crítica.


  Identificar os tipos de crítica.


  Caracterizar os princípios norteadores de uma crítica.


  Distinguir as fases de planejamento na organização da crítica.


  AERONÁUTICA


  Teoria de Voo


  Identificar os princípios básicos da aerodinâmica.


  Citar as funções dos comandos de voo nas manobras das aeronaves.


  Discriminar os diferentes tipos de equilíbrio, descrevendo os respectivos efeitos.


  Explicar os efeitos dos esforços estruturais realizados pelas aeronaves e as manobras correspondentes
  aos problemas deles derivados.


  Explicar as peculiaridades da decolagem e do pouso


  Explicar os diferentes tipos de manobras e atitudes de voo.


  Instrução Aeromédica


  Identificar os fatores potenciais de risco nas condições de voo e os respectivos efeitos
  sobre as condições psicofísicas do homem.


  Citar os sintomas de alterações psicofísicas decorrentes das condições de voo.


  Reconhecer a importância da manutenção dos hábitos de higiene, alimentação, repouso e lazer
  como fontes de conservação da saúde e da aptidão psicofísica.


  Avaliar as consequências nocivas psicofísicas decorrentes de riscos autoimpostos.


  Identificar as condições psicofísicas que restringem a aptidão para pilotar.


  Explicar os efeitos do treinamento fisiológico.


  CEL 1 - CÉLULA - EXAME: CEL


  INGLÊS TÉCNICO - CÉLULA


  Conhecer o vocabulário básico de ferramentas, componentes e equipamentos, sistemas e estruturas
  de aeronaves em Língua Inglesa relacionados a habilitação Célula.


  Interpretar informações, textos técnicos e manuais em língua Inglesa relacionados a habilitação
  Célula.


  ESTRUTURAS DE AERONAVES E SISTEMAS DE CONTROLE DE VOO


  Identificar os esforços estruturais sofridos pelas aeronaves em voo.


  Definir os tipos de construção das estruturas das aeronaves de asa fixa e asa rotativa.


  Identificar a função e o mecanismo de acionamento das superfícies de comando.


  Conhecer os equipamentos e os procedimentos de regulagens de aeronaves.


  Identificar os processos de balanceamento das superfícies de comando de voo.


  Efetuar procedimentos de verificação do alinhamento estrutural e da simetria de aeronaves.


  Detectar defeitos e executar adequadamente os processos de fixação de terminais em cabos
  de comando.


  ENTELAGEM


  Identificar o tipo de material e os procedimentos de revestimento e de reparos de aeronaves
  com tecido.


  Descrever adequadamente os procedimentos de impermeabilização dos revestimentos de tecido
  das aeronaves.


  Descrever os procedimentos de inspeção e reparo de tecido de aeronaves.


  REVESTIMENTO, PINTURA E ACABAMENTO DE AERONAVES


  Identificar os processos de revestimento, pintura e acabamento de aeronaves.


  Selecionar adequadamente os materiais utilizados para revestimento, pintura, acabamento
  e restauração de pintura de aeronaves.


  Compreender os procedimentos e as medidas de segurança em todas as operações de pintura
  de aeronaves e armazenamento de materiais de acabamento.


  REPAROS EM ESTRUTURAS METÁLICAS


  Identificar adequadamente os tipos de danos em aeronaves possíveis de serem reparados, os
  materiais e os processos de recuperação.


  Identificar adequadamente os tipos de rebites usados em aviação, as ferramentas utilizadas
  e os procedimentos utilizados de acordo com cada tipo de reparo em aeronaves.


  Conhecer a operação de máquinas e equipamentos destinados a moldagem de chapas e perfis
  para reparo de aeronaves.


  Adotar os procedimentos de inspeção e reparo de aeronaves com revestimento metálico.


  SOLDAGEM EM AERONAVES


  Conhecer os diversos tipos de soldagem e equipamentos empregados, bem como conhecer os cuidados
  no seu manuseio e as técnicas de emprego em partes de aeronaves.


  Identificar as características de uma solda perfeita e as de soldas defeituosas, tanto em
  metais ferrosos quanto em não ferrosos.


  MATERIAIS COMPOSTOS AVANÇADOS


  Identificar os prendedores a serem instalados em estruturas compostas e estruturas sanduíche.


  Identificar os procedimentos de inspeção e reparo de fibra de vidro, plástico, compostos
  em geral e colmeias (honeycomb) para estrutura de aeronaves.


  Identificar os procedimentos de inspeção e reparo em estruturas laminadas.


  Identificar os procedimentos de utilização de plásticos e de fibra de vidro em aeronaves.


  Identificar os procedimentos de inspeção e reparo em estruturas laminadas.


  Identificar os procedimentos de utilização de plásticos e de fibra de vidro em aeronaves.


  SISTEMAS DE PROTEÇÃO CONTRA OS EFEITOS DO GELO E DA CHUVA E CONTRA FOGO


  Descrever o desempenho de cada componente dos sistemas de detecção e eliminação do gelo
  em aeronaves e hélices.


  Conhecer os sistemas de controle de gelo, geada e neblina no para-brisa.


  Conhecer e distinguir os componentes dos sistemas de detecção e de extinção de fogo, bem
  como os tipos de agentes extintores.


  Instalar, remover, inspecionar, substituir e executar outros serviços de baixa complexidade
  em componentes de sistemas de proteção contra os efeitos do gelo e da chuva e contra fogo
  em estruturas.


  CEL 2 - CÉLULA - EXAME: CEL


  SISTEMA HIDRÁULICO E DE TREM DE POUSO


  Identificar o tipo de óleo adequado ao sistema hidráulico de uma aeronave.


  Conhecer as características de um sistema hidráulico e o princípio de funcionamento dos
  seus componentes.


  Entender os procedimentos de manutenção dos sistemas hidráulicos e dos trens de pouso das
  aeronaves.


  Entender os procedimentos de manutenção de conjuntos de freios, rodas, pneus e câmaras de
  ar para aeronaves.


  Instalar, remover, substituir e executar outros serviços de baixa complexidade em componentes
  do sistema hidráulico de aeronaves.


  Instalar, remover, substituir e executar outros serviços de baixa complexidade em componentes
  do trem de pouso de aeronaves.


  SISTEMAS PNEUMÁTICOS E DE CONTROLE DO AMBIENTE DE CABINE


  Conhecer as características dos sistemas pneumáticos, de pressurização e de ar condicionado,
  bem como o princípio de funcionamento dos seus componentes.


  Conhecer os procedimentos de manutenção dos sistemas pneumáticos, de pressurização e de
  ar condicionado.


  Identificar as características de um sistema de oxigênio e os procedimentos de manutenção
  dos seus componentes.


  Identificar os equipamentos portáteis de oxigênio e sua utilização.


  Instalar, remover, substituir e executar outros serviços de baixa complexidade em componentes
  do sistema pneumático e de controle do ambiente de cabine de aeronaves.


  SISTEMAS ELÉTRICOS DE AERONAVES


  Conhecer as caraterísticas dos sistemas elétricos de acordo com o porte das aeronaves.


  Identificar os fatores que influenciam na escolha do material e da bitola de fios para uma
  instalação elétrica de aeronaves.


  Identificar os símbolos gráficos básicos empregados em diagramas elétricos.


  Conhecer os procedimentos adequados para instalação de equipamentos elétricos, de metalização
  e encaminhamento de fiações.


  Conhecer os procedimentos de manutenção dos sistemas de iluminação de aeronaves.


  Compreender os princípios de funcionamento dos dispositivos de proteção de circuitos.


  Compreender as características e os procedimentos adequados de inspeção das baterias empregadas
  nas aeronaves.


  INSTRUMENTOS DE AERONAVES


  Identificar os tipos de instrumentos de uma aeronave, os componentes básicos de cada um
  deles e os princípios de funcionamento.


  Conhecer os procedimentos e precauções no manuseio e instalação dos instrumentos, a fonte
  de alimentação de cada um e sua finalidade na aeronave.


  Conhecer os procedimentos de testes, inspeção e manutenção dos diversos instrumentos empregados
  em aeronaves.


  SISTEMAS DE COMUNICAÇÃO E DE NAVEGAÇÃO


  Identificar a função dos componentes dos sistemas de comunicação e de navegação e a sua
  localização nas aeronaves.


  Descrever as condições de instalação dos equipamentos e os procedimentos de manutenção previstos
  pelos fabricantes das aeronaves.


  CGA - CONHECIMENTOS GERAIS DE AERONAVES - EXAME: PLA


  Demonstrar conhecimento acerca dos seguintes tópicos:


  Características gerais e limitações dos sistemas elétricos, hidráulicos, de pressurização
  e outros sistemas de aeronaves; sistemas de controle de voo, incluindo piloto automático
  e aumento de estabilidade.


  Princípios de operação, procedimentos de manuseio e limitações operacionais de motores de
  aeronaves; efeitos das condições atmosféricas no desempenho do motor; informações operacionais
  relevantes do manual de voo ou de outros documentos apropriados.


  Procedimentos operacionais e limitações da categoria relevante de aeronave; efeitos das
  condições atmosféricas no desempenho da aeronave de acordo com as informações operacionais
  pertinentes do manual de voo.


  Verificações de uso e funcionalidade de equipamentos e sistemas da aeronave


  Instrumentos de voo; bússolas; instrumentos giroscópicos, limites operacionais e efeitos
  de precessão; práticas e procedimentos em caso de mau funcionamento de vários instrumentos
  de voo e unidades de exibição eletrônica.


  Procedimentos de manutenção para estruturas, sistemas e motores da aeronave apropriada.


  CGA - CONHECIMENTOS GERAIS DE AERONAVES - EXAME: PLH


  Demonstrar conhecimento acerca dos seguintes tópicos:


  Características gerais e limitações dos sistemas elétricos, hidráulicos, de pressurização
  e outros sistemas de aeronaves; sistemas de controle de voo, incluindo piloto automático
  e aumento de estabilidade.


  Princípios de operação, procedimentos de manuseio e limitações operacionais de motores de
  aeronaves; efeitos das condições atmosféricas no desempenho do motor; informações operacionais
  relevantes do manual de voo ou de outros documentos apropriados.


  Procedimentos operacionais e limitações da categoria relevante de aeronave; efeitos das
  condições atmosféricas no desempenho da aeronave de acordo com as informações operacionais
  pertinentes do manual de voo.


  Verificações de uso e funcionalidade de equipamentos e sistemas da aeronave


  Instrumentos de voo; bússolas; instrumentos giroscópicos, limites operacionais e efeitos
  de precessão; práticas e procedimentos em caso de mau funcionamento de vários instrumentos
  de voo e unidades de exibição eletrônica.


  Procedimentos de manutenção para estruturas, sistemas e motores da aeronave apropriada.


  Transmissão de helicópteros.

