section_title: Sim, o parágrafo 121.361(b) do RBAC nº 121 é aplicável à aeronave como um todo;
  e
subsection_id: a
cite: 1(a)
title: 1(a)
text: (a) Somente é permitido operar uma aeronave se o peso vazio e o centro de gravidade
  tiverem sido calculados com valores estabelecidos por pesagem real da aeronave dentro dos
  36 meses precedentes.
