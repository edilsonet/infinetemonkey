title: Sim, o parágrafo 121.361(b) do RBAC nº 121 é aplicável à aeronave como um todo; e
text: '1. Sim, o parágrafo 121.361(b) do RBAC nº 121 é aplicável à aeronave como um todo;
  e

  2. Não há conflito ente a seção 121.361 do RBAC nº 121 e o art. 70, §1º da Lei nº 7.565/1986

  FUNDAMENTO DA INTERPRETAÇÃO

  Em 2012 foi questionada a inclusão de empresas não certificadas pela ANAC nas Especificações
  Operativas das empresas de transporte aéreo, para prestarem serviços de manutenção em aeronaves,
  conforme a seção 121.361 do RBAC nº 121, frente ao disposto no art. 70, § 1º da Lei nº 7.565/1986
  e a dúvida sobre sua aplicabilidade em relação à aeronave como um todo, uma vez que o requisito
  se refere a “componentes de células, motores, equipamentos e peças de reposição”.

  Em 02/02/2012 a Superintendência de Aeronavegabilidade (SAR) emitiu uma Policy (Nota Técnica
  22/2012/GGAC/SAR) para esclarecer o assunto. Os esclarecimentos na referida Policy permanecem
  válidos e estão reproduzidos nesta Instrução Suplementar.

  Na implantação do disposto na seção 121.361 sempre foi interpretado que componentes de células,
  motores, equipamentos e peças de reposição incluíam a aeronave como um todo. Por isso, sempre
  se permitiu detentores de certificado regidos pelo RBAC nº 121 contratar serviços de manutenção
  para suas aeronaves de empresas não certificadas pela ANAC, em suas bases no exterior.

