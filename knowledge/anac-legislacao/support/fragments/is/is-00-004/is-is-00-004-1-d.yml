title: 1(d)
text: 'd) a contratada é auditada para a verificação da sua capacidade de prestar os serviços
  contratados tanto pelo detentor de certificado quanto pela ANAC.

  Adicionalmente, a seção 121.373 do RBAC nº 121 estabelece que o detentor de certificado
  emitido pela ANAC deve estabelecer e manter um sistema de análise e supervisão continuada
  (SASC), o qual deve supervisionar a execução de todos os trabalhos em curso, sejam executados
  pelo próprio detentor de certificado, sejam executados sob contrato externo.

  Entende-se que inexiste conflito desta política em relação ao art. 70, § lº da Lei nº 7.565/1986,
  que prevê que qualquer oficina de manutenção de produto aeronáutico deve ser certificada
  pela autoridade aeronáutica, uma vez que se deve considerar que a atividade ocorre sob a
  certificação atribuída ao operador aéreo, expedida pela ANAC, coerente com os art. 174-A
  e 193-A da mesma Lei e com os RBAC nº 119 e 121.

  Deve-se considerar, também, que à época em que foi promulgada a Lei nº 7.565/1986, não havia
  certificação de empresas aéreas, assim sendo, a aplicação das imposições previstas no Art.
  70, § lº, da referida lei às operações de empresas aéreas deve ser feita hoje levando-se
  em consideração todos os requisitos e controles já aplicados aos operadores aéreos.

  Observe-se que o Art. 8º, XLIV e XLV, da Lei nº 11.182/2005, versa que compete à ANAC deliberar,
  na esfera administrativa, quanto à interpretação da legislação, sobre serviços aéreos e,
  na esfera técnica, quanto à interpretação das normas e recomendações internacionais relativas
  ao sistema de segurança de voo da aviação civil.

  O mesmo Art. 8º, XXX, da Lei nº 11.182/2005, atribui competência a ANAC para expedir normas
  e estabelecer padrões mínimos de segurança de voo, de desempenho e eficiência, a serem cumpridos
  pelas prestadoras de serviços aéreos e de infra-estrutura aeronáutica e aeroportuária, inclusive
  quanto a equipamentos, materiais, produtos e processos que utilizarem e serviços que prestarem.

  Por fim, de acordo com o Art. 2º, XIII, da Lei nº 9.784/1999, é dever da Administração Pública
  interpretar as normas da forma que melhor garantam o atendimento do fim público a que se
  dirigem.

  Assim, conclui-se que a alteração da política descrita não se justifica uma vez que:'
