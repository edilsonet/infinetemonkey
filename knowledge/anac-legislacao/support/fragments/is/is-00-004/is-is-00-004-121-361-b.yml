title: 121.361(b)
text: '(b) A ANAC pode emendar as especificações operativas de um detentor de certificado
  para permitir desvios das provisões desta subparte que impediriam o retorno ao serviço de
  componentes de células, motores, equipamentos e peças de reposição por terem sido tais itens
  submetidos à manutenção, modificação ou inspeção no exterior e, consequentemente, por pessoas
  não qualificadas pela ANAC para tais serviços. Cada detentor de certificado utilizando itens
  nessas condições deve assegurar-se que todos os trabalhos nos mesmos foram executados conforme
  as normas de seu manual ou, pelo menos, conforme normas do fabricante do item.

  Questiona-se:'
