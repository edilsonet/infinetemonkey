  Superintendência de Padrões Operacionais - SPO

  DIRETRIZ INTERPRETATIVA

  Assunto: utilização de áreas de pouso para uso aeroagrícola em feiras e exposições correlatas
  às atividades aeroagrícolas por fabricantes de aeronaves

  Código:

  DI-SPO 0011

  Rev: B

  Aprovada originalmente em: 6/11/2020

  Revisada em: 2/10/2023

  Regulamentos:

  Itens de Regulamento:

  91.303(f)

  QUESTÃO

  O parágrafo 91.303(f)(1) do RBAC nº 91 estabelece que fabricantes de aeronaves agrícolas
  podem utilizar área de pouso para uso aeroagrícola (conforme definido no parágrafo 137.3(a)(1)
  do RBAC nº 137), sem cumprir com o disposto no parágrafo 91.102(d) do RBAC nº 91, para demonstração
  para potenciais clientes ou em campanhas de certificação, desde que autorizado pela ANAC.

  Diante disso, questiona-se: é possível a utilização de áreas de pouso para uso aeroagrícola
  por fabricantes para participação de suas aeronaves em feiras e exposições correlatas às
  atividades aeroagrícolas? O que é necessário para a autorização?

  INTERPRETAÇÃO

  Sim, é possível a utilização de áreas de pouso para uso aeroagrícola por fabricantes de
  aeronaves para participação de suas aeronaves em feiras e exposições correlatas às atividades
  aeroagrícolas.

  O fabricante está previamente autorizado a realizar tais operações desde que cumpra as seguintes
  condicionantes, que são consistentes com os requisitos do RBAC nº 137:

  I - a construção e disponibilização de uma área de pouso para uso aeroagrícola serão de
  inteira responsabilidade do proprietário da área;

  II - a área de pouso para uso aeroagrícola não necessita ser cadastrada pela ANAC;

  III - a operação de uma aeronave do fabricante em área de pouso para uso aeroagrícola, conduzida
  sob o parágrafo 91.303(f)(1) do RBAC nº 91, somente poderá ocorrer se:'
