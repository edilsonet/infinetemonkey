text: 'e) não for proibido, por qualquer dispositivo legal ou regulamentar, o uso da área
  escolhida;

  VI - a utilização de uma área de pouso para uso aeroagrícola será de inteira responsabilidade
  do fabricante; e

  VII - a operação noturna somente poderá ser realizada se a área for adequadamente sinalizada
  e iluminada para comportar tais operações.

  Operações fora dessas condicionantes podem ser autorizadas mediante consulta, análise e
  autorização expressa da ANAC, caso a Agência entenda que os níveis de segurança são aceitáveis.

  FUNDAMENTO DA INTERPRETAÇÃO

  O parágrafo 91.303(f)(1) do RBAC nº 91 foi incluído para prever no regulamento a condição
  exposta na Decisão nº 27, de 21 de março de 2018 para todos os fabricantes de aeronaves,
  visto que o fabricante não é, por princípio, um operador aeroagrícola e não é regido pelo
  RBAC nº 137. Desse modo, as condicionantes foram incluídas de modo consistente com aquela
  Decisão, que por sua vez havia sido emitida de modo consistente com a seção 137.301 do RBAC
  nº 137. A Revisão B desta Diretriz incorporou ainda aspectos relativos à Emenda 05 ao RBAC
  nº 137, aprovada pela Resolução nº 716/2023.

  O parágrafo 91.303(f)(1) especifica que os voos podem ser feitos “para demonstração para
  potenciais clientes” e as “operações em feiras e exposições correlatas às atividades aeroagrícolas”
  podem ser entendidas como operações desta natureza.

  PALAVRAS-CHAVE

  ÁREA DE POUSO PARA USO AEROAGRÍCOLA; 137.301; FEIRAS; EXPOSIÇÕES; OPERAÇÕES AEROAGRÍCOLAS


  Superintendência de Padrões Operacionais - SPO

  DIRETRIZ INTERPRETATIVA

  Assunto: utilização de áreas de pouso para uso aeroagrícola em feiras e exposições correlatas
  às atividades aeroagrícolas por operadores aeroagrícolas

  Código:

  DI-SPO 0012

  Rev: B

  Aprovada originalmente em: 6/11/2020

  Revisada em: 2/10/2023

  Regulamentos:

  Itens de Regulamento:

  137.3(a)(13) / 137.301(e)(1) / 91.303(f)

  QUESTÃO

  A seção 137.301 do RBAC nº 137 define requisitos para utilização de área de pouso para uso
  aeroagrícola, que são áreas de pouso que não necessitam ser cadastradas na ANAC. O parágrafo
  137.301(e)(1) define que a operação nessas áreas deve ser exclusiva para atividades aeroagrícolas.
  O parágrafo 137.3(a)(13) do RBAC nº 137 define que operação aeroagrícola significa a operação
  aérea que tenha por fim proteger ou fomentar o desenvolvimento da agricultura em qualquer
  de seus aspectos, mediante a aplicação em voo de fertilizantes, sementes, inseticidas, herbicidas
  e outros defensivos, povoamento de águas, combate a incêndios em campos e florestas, provocação
  artificial de chuvas, modificação artificial de clima, combate a insetos, combate a vetores
  de doenças ou outros empregos correlatos.

  Diante disso, questiona-se: é possível a utilização de áreas de pouso para uso aeroagrícola
  para participação das aeronaves em feiras e exposições correlatas às atividades aeroagrícolas.

  INTERPRETAÇÃO

  Sim, é possível, desde que sejam cumpridos todos os requisitos aplicáveis do RBAC nº 137,
  em especial, mas não se limitando, os requisitos da seção 137.301.

  Uma vez que os envolvidos nas operações garantirem o cumprimento dos requisitos aplicáveis,
  as operações de pouso e decolagem podem ocorrer sem necessidade de autorização prévia da
  ANAC.

  Contudo, no caso de haver interesse em demonstração de aeronaves em voo (manobras e procedimentos)
  para o público, fica caracterizada a operação de demonstração aérea, sendo requerida autorização
  prévia da ANAC, conforme a seção 91.303 do RBAC nº 91 e nos termos da IS nº 91-008.

  FUNDAMENTO DA INTERPRETAÇÃO

  Conforme a seção 137.301 do RBAC nº 137, a disponibilização de uma área de pouso para uso
  aeroagrícola é permitida exclusivamente para atividades aeroagrícolas. O parágrafo 137.3(a)(13)
  do RBAC nº 137 define operação aeroagrícola como sendo a operação aérea que tenha por fim
  proteger ou fomentar o desenvolvimento da agricultura em qualquer de seus aspectos, mediante
  a aplicação em voo de fertilizantes, sementes, inseticidas, herbicidas e outros defensivos,
  povoamento de águas, combate a incêndios em campos e florestas, provocação artificial de
  chuvas, modificação artificial de clima, combate a insetos, combate a vetores de doenças
  ou outros empregos correlatos.

  As atividades em feiras e exposições correlatas às atividades aeroagrícolas podem ser enquadradas
  nas atividades de fomento do desenvolvimento da agricultura, como outros empregos correlatos,
  estando, portanto, abrangidas pela definição do parágrafo 137.3(a)(13). Neste caso, os operadores
  devem cumprir todos os requisitos aplicáveis do RBAC nº 137, com especial atenção para os
  requisitos da seção 137.301.

  Já o translado da aeronave não está incluído no escopo de operações aeroagrícolas e devem
  cumprir o disposto no RBAC nº 91, bem como as regras de tráfego aéreo definidas e publicadas
  pelo DECEA.

  Quando houver apresentação para um público, o evento poderá ser classificado como demonstração
  aérea (além de ser uma operação aeroagrícola), quando então será necessário também o cumprimento
  da seção 91.303 do RBAC nº 91, que requer autorização prévia da ANAC conforme IS nº 91-008
  (procedimentos para realização de evento aeronáutico).

  PALAVRAS-CHAVE

  ÁREA DE POUSO PARA USO AEROAGRÍCOLA; 137.301; FEIRAS; EXPOSIÇÕES; OPERAÇÕES AEROAGRÍCOLAS


  Superintendência de Padrões Operacionais - SPO

  DIRETRIZ INTERPRETATIVA

