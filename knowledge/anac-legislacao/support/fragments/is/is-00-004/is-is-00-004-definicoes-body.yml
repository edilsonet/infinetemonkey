title: DEFINIÇÕES
text: 'DEFINIÇÕES

  N/A

  EDIÇÃO DE DIRETRIZES INTERPRETATIVAS

  A fim de orientar o público externo e interno quanto à interpretação e aplicabilidade dos
  requisitos normativos pertinentes às atividades de sua competência, a Superintendência de
  Padrões Operacionais (SPO) institui as Diretrizes Interpretativas (DI-SPO).

  A SPO editará as DI-SPO por motivação de ofício ou em resposta a consultas de origem interna
  ou externa, nos casos em que entenda necessário pacificar interpretações normativas divergentes.

  As DI-SPO aprovadas serão publicadas no Apêndice C desta Instrução Suplementar e, salvo
  expressamente indicado em seu texto, não retroagem para desfazer os atos administrativos
  já realizados anteriormente sob interpretação diversa.'
