text: '3.2 Os RBAC nº 61 e 65 e o RBHA nº 63 estabelecem requisitos para a obtenção de licenças,

  certificados e habilitações. O indeferimento do pedido confere, ao interessado, o direito

  de interpor recurso contra a decisão, que se faz na forma dessa Instrução Suplementar.'
