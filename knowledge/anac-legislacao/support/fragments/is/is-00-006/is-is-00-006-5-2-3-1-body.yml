title: A representação do interessado por terceiro, no processo, se demonstra por meio juntada
text: '5.2.3.1 A representação do interessado por terceiro, no processo, se demonstra por
  meio juntada

  de procuração (ou de sua cópia), contendo a assinatura do outorgante, a indicação do lugar

  onde foi passada, a qualificação do outorgante e do outorgado, a data, e o objetivo da

  outorga com a designação e a extensão dos poderes conferidos.'
