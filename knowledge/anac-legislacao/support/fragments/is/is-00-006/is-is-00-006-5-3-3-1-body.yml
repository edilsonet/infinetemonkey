title: Tratando o indício de documento ou elemento considerado em decisão que já implicou
text: '5.3.3.1 Tratando o indício de documento ou elemento considerado em decisão que já implicou

  na concessão de licença, inclusão ou revalidação de habilitação, estará essa sujeita, ainda,

  à suspensão cautelar, com fundamento no art. 45 da Lei nº 9.784, de 29 de janeiro de

  1999, e a exposição de vidas humanas ao risco.'
