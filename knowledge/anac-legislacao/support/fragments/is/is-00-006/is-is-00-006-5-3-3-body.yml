title: A existência de indícios, no processo, de que o documento juntado não é verdadeiro
  ou
text: '5.3.3 A existência de indícios, no processo, de que o documento juntado não é verdadeiro
  ou

  foi alterado, ou da prestação de informações falsas, com o objetivo de cumprir requisito(s)

  necessário(s) para a concessão de uma licença, inclusão ou revalidação de habilitação,

  ensejará a abertura de processo administrativo sancionatório para a apuração dos fatos e

  aplicação da medida administrativa cabível.'
