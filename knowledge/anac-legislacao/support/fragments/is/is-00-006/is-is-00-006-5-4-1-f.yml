section_title: 'Para envio do recurso, o requerente deverá seguir os procedimentos a seguir:'
subsection_id: f
cite: 5.4.1(f)
title: 5.4.1(f)
text: 'f) na seção de “Documentos”, para o formulário de recurso será apresentado um link

  (“clique aqui para editar conteúdo”) em “Documento Principal”. O formulário de

  recurso deve ser preenchido no próprio editor do sistema. Ao clicar no link para

  editar o formulário, será aberta uma janela que trará os campos do formulário a ser

  preenchido. Deve-se preencher o formulário conforme as instruções de

  preenchimento da IS 00-006. Após preenchimento, deve-se clicar em “Salvar” e

  depois fechar a janela para retornar a tela de peticionamento;'
