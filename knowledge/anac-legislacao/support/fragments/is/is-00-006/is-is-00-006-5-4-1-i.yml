section_title: 'Para envio do recurso, o requerente deverá seguir os procedimentos a seguir:'
subsection_id: i
cite: 5.4.1(i)
title: 5.4.1(i)
text: 'i) caso seja necessário, pode-se adicionar mais documentos, como, por exemplo, uma

  procuração de representação do legitimado, caso aplicável, seguindo os

  procedimentos abaixo:

  • clicar no botão “Escolher arquivo” para carregar o arquivo (que

  deve estar salvo no dispositivo);

  • indicar o “Tipo de Documento”, por exemplo, “procuração”, “anexo”, etc.;

  • digitar no campo “Complemento do Tipo de Documento” mais informações;

  • escolher o “Nível de Acesso” e selecionar a opção de “Hipótese Legal”, caso

  seja restrito;

  • selecionar o “Formato” e o tipo de “Conferência com o documento

  digitalizado”, caso aplicado;

  • clicar em “Adicionar”;Data de emissão: 30 de abril de 2020 IS nº 00-006

  Revisão C'
