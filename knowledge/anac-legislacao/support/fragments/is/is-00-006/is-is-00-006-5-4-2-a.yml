section_title: 'Para preenchimento do formulário de recurso seguem abaixo instruções:'
subsection_id: a
cite: 5.4.2(a)
title: 5.4.2(a)
text: 'a) deve-se indicar a instância recursal no qual o processo será submetido. Por

  exemplo, no campo “Instância do Recurso” deve-se selecionar: “Primeira instância

  - (Coordenador de Licenças e Habilitações - CLHA)”, caso seja a primeira vez que

  está recorrendo ao processo; “Segunda instância - (Gerente de Certificação de

  Pessoal - GCEP)” caso seja a segunda vez que recorre do mesmo processo; ou

  “Terceira instância - (Superintendente de Padrões Operacionais - SPO)”, caso

  seja a terceira vez que recorre ao processo;'
