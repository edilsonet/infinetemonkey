text: 'APÊNDICE A - MODELO DE FORMULÁRIO DE RECURSO

  FORMULÁRIO DE RECURSO

  Formulário de recurso a indeferimento de processo de concessão ou revalidação de licença,

  certificado ou habilitação, segundo o RBAC nº 61, RBHA 63 ou RBAC nº 65.

  DATA: ____/____/________

  INSTÂNCIA DO RECURSO

  [ ] Primeira instância - (Coordenador de Licenças e Habilitações - CLHA)

  [ ] Segunda instância - (Gerente de Certificação de Pessoal - GCEP)

  [ ] Terceira instância - (Superintendente de Padrões Operacionais - SPO)'
