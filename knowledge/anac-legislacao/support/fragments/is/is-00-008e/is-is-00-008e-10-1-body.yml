section_id: '10.1'
section_title: 'O RBAC nº 61, RBHA 63 e RBAC nº 65 estabelecem requisitos para a concessão
  de licença ou certificado, inclusão e revalidação de habilitação, a saber: idade, grau de
  instrução, aptidão psicofísica, conhecimentos teóricos e práticos, instrução de voo, experiência
  de voo, exame de proficiência. Ao solicitar os serviços associados à concessão de licença
  ou certificado, inclusão ou revalidação de habilitação, será necessário que o candidato
  demonstre o cumprimento da combinação de alguns desses requisitos, conforme consta na respectiva
  seção do RBAC ou RBHA associada à solicitação.'
