section_title: Conforme disposto na seção 61.13 do RBAC 61 e na IS 00-002, o solicitante que
  não obtiver aprovação no exame de proficiência somente poderá prestar novo exame após realizar,
  sob a supervisão de um instrutor de voo habilitado e qualificado, treinamento corretivo
  relativo às deficiências que provocaram a sua reprovação. Este treinamento poderá consistir
  em estudo teórico, treinamento prático, ou ambos, conforme aplicável à falha que motivou
  sua reprovação.
