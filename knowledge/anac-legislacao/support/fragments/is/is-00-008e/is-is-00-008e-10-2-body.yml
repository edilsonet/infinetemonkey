section_title: O grau de instrução (escolaridade) deverá ser demonstrado por meio do certificado
  de conclusão correspondente ao nível de escolaridade informado. Apenas o histórico escolar
  não se caracteriza como documento comprobatório. Candidatos que tenham concluído seus estudos
  no exterior deverão solicitar o certificado de equivalência à Secretaria de Educação.
