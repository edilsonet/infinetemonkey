section_id: '10.4'
section_title: Não é necessário fornecer documento comprobatório referente à aprovação em
  exame teórico quando este for realizado na ANAC. A aprovação será verificada pela própria
  ANAC quando da análise do processo por meio de consulta feita à base de dados presente no
  endereço eletrônico http://www2.anac.gov.br/resultadodosexames/consultas_cct.asp. Candidatos
  que tenham realizado cursos em instituições certificadas pela ANAC e para os quais não se
  aplique a realização de exame teórico posterior na ANAC deverão anexar o respectivo certificado
  de conclusão em seus processos de habilitação.
