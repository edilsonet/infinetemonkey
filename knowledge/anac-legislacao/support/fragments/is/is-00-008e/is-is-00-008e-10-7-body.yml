section_title: De acordo com o parágrafo 61.31 (d) do RBAC nº 61, é responsabilidade do piloto
  manter atualizados seus registros de voo, bem como a veracidade de seu conteúdo. Portanto,
  a CIV Digital deve ser mantida sempre atualizada, ainda que o piloto não esteja, no momento,
  solicitando algum serviço de licença/habilitação no qual precise demonstrar experiência.
