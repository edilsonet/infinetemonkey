section_id: '10.8'
section_title: A comprovação de experiência acumulada em operadores aéreos regidos pelos RBAC
  nº 121 e RBAC nº 135 será realizada por meio do registro na CIV Digital do total de horas
  voadas na empresa (por função e por equipamento), conforme preconizado na IS nº 61-001.
  Em tais casos, a empresa deve realizar o lançamento na CIV Digital quando do desligamento
  do profissional da empresa ou nos casos em que o piloto precise comprovar experiência para
  a concessão de licença. Portanto, apenas os pilotos regidos pelos RBAC nº 121 e nº 135 podem
  não ter sua experiência de voo na empresa atualizada na CIV Digital (uma vez que o lançamento
  dos voos ocorridos na empresa é feito em momentos específicos, conforme mencionado acima).
  A experiência de voo acumulada fora de operadores regidos pelos RBAC nº 121 e RBAC nº 135
  deve ser constantemente atualizada pelo piloto na CIV Digital.
