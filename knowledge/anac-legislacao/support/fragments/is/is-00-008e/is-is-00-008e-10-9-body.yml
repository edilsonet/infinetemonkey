section_id: '10.9'
section_title: A CIV Digital não aceita lançamentos de horas de voo em aeronaves militares.
  Para fins de concessão ou revalidação de licenças/habilitações, caso o requerente deseje
  utilizar a experiência obtida em aeronave militar, deverá enviar junto ao processo, cópias
  das páginas do Relatório de desimpedimento que comprovem a experiência necessária, contendo
  as horas de voo realizadas e a data do último voo no respectivo equipamento.
