section_title: A abertura de uma solicitação também é realizada no SACI (SINTAC). O usuário
  poderá acessar o sistema com seu login e senha (https://sistemas.anac.gov.br/saci) e, em
  seguida, selecionar a opção Serviços>Habilitação>Solicitação Serviço disponível no menu
  à esquerda conforme mostra a imagem abaixo.
