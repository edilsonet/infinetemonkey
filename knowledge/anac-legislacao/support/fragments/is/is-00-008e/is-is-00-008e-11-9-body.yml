document: is-00-008e
family: '0'
section_id: '11.9'
section_title: Recomenda-se que o endereço de e-mail informado na abertura da solicitação
  coincida com o que está registrado no cadastro do SACI. A mensagem automática do sistema,
  contendo o número da solicitação gerada, será enviada para o endereço de e-mail indicado
  no momento de abertura da solicitação. Eventuais pendências, avisos de mudança de status
  do processo, solicitação de informações ou documentos, e comunicação de indeferimento serão
  feitas por meio do endereço cadastrado no SACI.
