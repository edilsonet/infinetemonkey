section_title: Caso o processo seja indeferido, será possível observar a situação “Aguardando
  Indeferimento”. Após a mudança para a situação “Aguardando Indeferimento”, que será comunicada
  por e-mail conforme dispõe o item 12.4 desta IS, o interessado poderá apresentar recurso
  nos termos da IS nº 00-006 a fim de contestar a análise do processo, se cabível.
