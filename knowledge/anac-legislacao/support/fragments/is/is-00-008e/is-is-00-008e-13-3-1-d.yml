cite: 13.3.1(d)
title: 13.3.1(d)
text: d) No caso de não haver equipamento eletrônico disponível para leitura do QR Code ou,
  ainda, para situações em que não haja disponibilidade de rede (internet) no momento da apresentação
  do CHT Digital, a documentação completa em modo offline também deverá ser mantida pelo regulado
  em seu dispositivo móvel ou em versão impressa para apresentação. É responsabilidade do
  profissional manter sua documentação completa em seu dispositivo móvel (em modo offline)
  ou em versão impressa para apresentação, sempre que necessário.
