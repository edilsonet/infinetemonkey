section_id: 13.3.1
section_title: 'Por meio do mesmo login e senha utilizados para acessar o SACI, entrar no
  sistema: https://sistemas.anac.gov.br/NovaCHT.'
subsection_id: f
cite: 13.3.1(f)
title: 13.3.1(f)
text: f) O portador de um CHT Digital terá acesso a um modelo de cartão que poderá ser impresso
  em gráfica, com layout similar ao do antigo CHT impresso pela Casa da Moeda do Brasil. Para
  acessar o layout disponível para impressão, é necessário que o usuário acesse o sistema
  https://sistemas.anac.gov.br/NovaCHT , informe seu login (o mesmo utilizado para acessar
  o SACI) e, na tela “Visualizar habilitações e licenças”, clique no botão “Imprimir cartão”.
