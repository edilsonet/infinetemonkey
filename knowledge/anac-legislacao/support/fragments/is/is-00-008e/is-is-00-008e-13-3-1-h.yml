section_title: 'Por meio do mesmo login e senha utilizados para acessar o SACI, entrar no
  sistema: https://sistemas.anac.gov.br/NovaCHT.'
subsection_id: h
cite: 13.3.1(h)
title: 13.3.1(h)
text: 'h) Além da leitura do QR Code contido no CHT Digital, as informações sobre as licenças
  e habilitações de determinado profissional da aviação civil estão disponíveis para acesso
  público na página: “Consultar licenças e habilitações ativas” (https://sistemas.anac.gov.br/novacht/consultanovacht),
  mediante fornecimento de Código ANAC, CPF e data de nascimento do respectivo profissional.
  A referida página é a fonte oficial para consulta de validade das habilitações, devendo
  sempre ser consultada imediatamente antes do exercício das prerrogativas de uma licença
  e/ou habilitação.'
