section_title: 'Por meio do aplicativo gov.br, disponível nas lojas de aplicativos dos sistemas
  operacionais dos aparelhos de telefonia móvel ou tablets:'
subsection_id: b
cite: 13.3.2(b)
title: 13.3.2(b)
text: b) Apesar de possuir a foto utilizada para reconhecimento facial no citado aplicativo
  gov.br, o CHT Digital não se constitui como documento de identificação. Porém, não se requer
  apresentação de documento oficial de identificação com foto para garantir sua validade.
