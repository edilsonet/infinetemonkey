section_title: 'Por meio do aplicativo gov.br, disponível nas lojas de aplicativos dos sistemas
  operacionais dos aparelhos de telefonia móvel ou tablets:'
subsection_id: d
cite: 13.3.2(d)
title: 13.3.2(d)
text: d) No caso de não haver equipamento eletrônico disponível para leitura do QR Code ou,
  ainda, para situações em que não haja disponibilidade de rede (internet) no momento da apresentação
  do CHT Digital, a documentação completa em modo offline também poderá ser mantida pelo regulado
  em seu dispositivo móvel ou em versão impressa para apresentação.
