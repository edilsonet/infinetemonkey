section_title: 'Por meio do aplicativo gov.br, disponível nas lojas de aplicativos dos sistemas
  operacionais dos aparelhos de telefonia móvel ou tablets:'
subsection_id: f
cite: 13.3.2(f)
title: 13.3.2(f)
text: 'f) Além da leitura do QR Code contido no CHT Digital, as informações sobre as licenças
  e habilitações de determinado profissional da aviação civil estão disponíveis para acesso
  público na página: “Consultar licenças e habilitações ativas” (https://sistemas.anac.gov.br/novacht/consultanovacht),
  mediante fornecimento de Código ANAC, CPF e data de nascimento do respectivo profissional.'
