section_id: '5.1'
section_title: O código ANAC (CANAC) é o número único, composto de 6 dígitos, que identifica
  o candidato ou o titular de uma licença ou certificado emitido pela ANAC segundo o RBAC
  nº 61, RBHA 63 e RBAC nº 65. O código ANAC é único para uma pessoa, ainda que esta possua
  mais de uma licença e ou certificado emitido pela ANAC.
