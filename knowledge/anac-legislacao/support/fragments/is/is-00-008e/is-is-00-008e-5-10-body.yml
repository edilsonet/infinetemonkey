section_title: O Art. 14, § 2º, da Resolução ANAC nº 520/2019 estabelece que, no caso do titular
  de uma licença e/ou certificado emitido pela ANAC que não estiver cadastrado como usuário
  externo do Protocolo Eletrônico nos termos da referida Resolução, a ANAC poderá efetuar
  as comunicações processuais via imprensa oficial.
