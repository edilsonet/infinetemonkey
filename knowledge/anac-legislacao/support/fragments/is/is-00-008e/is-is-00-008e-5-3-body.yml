section_id: '5.3'
section_title: Para utilização do SACI, o interessado deverá possuir CANAC, login e senha
  que permitam seu acesso. O login e a senha de acesso ao SACI são pessoais e intransferíveis,
  ficando seu detentor direta e exclusivamente responsável por qualquer informação inserida
  no SACI por meio do seu acesso. É compulsória a fidedignidade das informações inseridas
  no sistema. Em caso de informações falsas ou inexatas, fica o detentor do login sujeito
  à responsabilização administrativa, civil e penal cabíveis.
