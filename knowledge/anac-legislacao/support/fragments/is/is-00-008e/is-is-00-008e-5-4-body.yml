id: is-is-00-008e-5-4-body
kind: is
document: is-00-008e
family: '0'
section_id: '5.4'
section_title: A pessoa detentora de um CANAC, login e senha no SACI é exclusivamente responsável
  pela guarda segura da sua senha. Para tanto, deverá adotar procedimentos que garantam seu
  sigilo e proteção, tais como guardá-la em local seguro (preferencialmente memorizar, sem
  fazer uso de anotações), em hipótese alguma disponibilizá-la a terceiros, evitar o uso da
  funcionalidade de “salvar senha” do navegador (recomendação útil para dispositivos compartilhados
  com terceiros), uso de maior número de caracteres e utilização de caracteres especiais (preferencialmente
  mesclar letras minúsculas, maiúsculas, números e caracteres especiais), troca periódica
  da senha, etc.
