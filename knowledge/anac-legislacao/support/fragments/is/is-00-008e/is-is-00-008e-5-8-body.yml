section_title: A comunicação entre a ANAC e o regulado se dará, a critério da ANAC, por via
  postal ou eletrônica. Portanto, o endereço residencial, o endereço eletrônico (e-mail) e
  o número de telefone devem, particularmente, ser mantidos sempre atualizados no SACI pelo
  detentor do CANAC.
