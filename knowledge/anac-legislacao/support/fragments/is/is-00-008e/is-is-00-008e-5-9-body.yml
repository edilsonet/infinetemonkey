section_id: '5.9'
section_title: A Resolução nº 520, de 03 de junho 2019, regulamenta o processo eletrônico
  no âmbito da ANAC e estipula, em seu Art. 13, que pessoas físicas ou jurídicas, cujas atividades
  sejam reguladas pela ANAC, devem se cadastrar como usuário externo do Protocolo Eletrônico
  da ANAC. Portanto, todo o titular de uma licença ou certificado emitido pela ANAC segundo
  o RBAC nº 61, RBHA 63 e RBAC nº 65 deve se cadastrar como usuário externo do Protocolo Eletrônico
  da ANAC, conforme procedimento disposto no Art. 12 da referida Resolução.
