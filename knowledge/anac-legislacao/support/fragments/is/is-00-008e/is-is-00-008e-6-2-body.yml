section_id: '6.2'
section_title: A constatação por parte da ANAC de qualquer documento fraudulento ou informação
  intencionalmente falsa com o objetivo de demonstrar atendimento de requisito(s) necessário(s)
  para a concessão de uma licença ou certificado, inclusão ou revalidação de habilitação,
  implicará na penalidade de suspensão do aeronauta por 180 dias, sem prejuízo da responsabilização
  civil e penal cabíveis.
