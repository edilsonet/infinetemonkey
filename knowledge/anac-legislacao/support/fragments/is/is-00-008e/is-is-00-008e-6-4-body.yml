id: is-is-00-008e-6-4-body
kind: is
document: is-00-008e
family: '0'
section_id: '6.4'
section_title: Quando houver indício de irregularidade sobre ato administrativo já praticado,
  no qual o regulado possa ter sido beneficiado com a concessão de uma licença ou certificado,
  inclusão ou revalidação de habilitação sem o integral atendimento aos requisitos aplicáveis,
  será instaurado o respectivo processo administrativo apuratório e adotada a suspensão cautelar
  da licença e/ou habilitação tão logo a ANAC constate tal indício, tendo em vista o disposto
  no art. 45 da Lei nº 9.784, de 29 de janeiro de 1999, e a exposição de vidas humanas ao
  risco.
