section_title: No caso do item 6.4 desta IS, uma vez que o processo administrativo de apuração
  conclua que houve irregularidade não sanável no(s) processo(s) de certificação objeto(s)
  da apuração, eventuais atos administrativos por ele(s) subsidiados serão anulados, sem prejuízo
  às sanções previstas nos itens 6.2 e 6.3 desta IS e às sanções penais cabíveis.
