section_id: '7.1'
section_title: Com a criação da ANAC, os Códigos DAC, pertencentes aos detentores de licença
  emitida pelo antigo Departamento de Aviação Civil (DAC), foram automaticamente convertidos
  para Código ANAC (CANAC). Portanto, não deverá ser criado um CANAC pelos detentores de licenças
  emitidas pelo DAC. A criação de um novo código gerará duplicidade e inconsistência na base
  de dados.
