section_id: '7.2'
section_title: Caso não consiga encontrar ou consultar o código antigo (Código DAC), o interessado
  deverá enviar o requerimento padrão (cf. Apêndice A desta IS) preenchido, solicitando a
  busca e a regularização de suas licenças e habilitações. Ao requerimento deverão ser anexadas
  as cópias da licença antiga; da identidade; do certificado militar, quando pertinente; do
  certificado de escolaridade e do comprovante de residência. O requerimento deverá ser assinado
  e todos os campos deverão estar preenchidos, inclusive endereço de e-mail e telefones de
  contato. O envio do requerimento, juntamente à documentação pertinente, deverá ser realizado
  por meio do Protocolo Eletrônico conforme orientações contidas no item 5.12 desta IS.
