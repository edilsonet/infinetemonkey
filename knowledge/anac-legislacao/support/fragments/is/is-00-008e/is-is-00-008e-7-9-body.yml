section_title: Na tela seguinte àquela indicada no item 7.4 desta IS, após preencher todos
  os campos requeridos, o usuário deverá inserir cópia digitalizada (upload) dos documentos
  pessoais exigidos, bem como foto e assinatura digitalizadas. Estrangeiros estão dispensados
  de apresentar RG e certificado militar.
