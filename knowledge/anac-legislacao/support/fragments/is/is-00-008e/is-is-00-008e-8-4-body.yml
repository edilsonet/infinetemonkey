section_id: '8.4'
section_title: Após fornecer os dados exigidos, o usuário deverá, na tela seguinte, criar
  seu login de acesso (o login não pode conter espaços e caracteres especiais, não sendo recomendável
  que tenha mais de 15 caracteres), senha (para senha, observar a sugestão apresentada no
  item 5.4 desta IS) e confirmar a senha escolhida. Ao clicar em Ok, o sistema vinculará seu
  CANAC ao login criado e enviará uma mensagem automática para o endereço de e-mail cadastrado.
