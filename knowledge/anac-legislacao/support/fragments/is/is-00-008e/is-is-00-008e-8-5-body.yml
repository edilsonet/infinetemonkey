document: is-00-008e
family: '0'
section_id: '8.5'
section_title: Caso o endereço de e-mail não tenha sido registrado no momento de criação do
  CANAC, não será possível finalizar o procedimento e gerar login e senha para acesso ao SACI.
  Nesse caso, será necessário que a inclusão do endereço de e-mail seja feita por intervenção
  manual de servidor da ANAC. Para solicitar a inclusão, por questões de segurança, será preciso
  enviar o requerimento padrão (Apêndice A) à GCEP, devidamente preenchido e assinado, com
  cópia da carteira de identidade em anexo, por meio do Protocolo Eletrônico, conforme orientações
  disponibilizadas no item 5.12 desta IS.
