section_id: '8.7'
section_title: 'Caso o usuário tenha problemas de acesso ao SACI, como esquecimento ou expiração
  da senha de acesso, a opção “Esqueci minha senha”, disponível na página de acesso, deverá
  ser selecionada. A senha será encaminhada para o endereço de e-mail que consta na base de
  dados do SACI. Se o problema persistir, deverá entrar em contato com a ANAC por intermédio
  do canal de atendimento “Fale com a ANAC”, acessando o endereço eletrônico: https://www.anac.gov.br/fale-com-a-anac.'
