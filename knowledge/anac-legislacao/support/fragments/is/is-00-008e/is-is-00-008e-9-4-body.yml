section_id: '9.4'
section_title: 'Alguns campos estão bloqueados no SACI para alteração, são eles: nome, CPF,
  identidade, data de nascimento, título de eleitor, certificado de reservista e nacionalidade.
  Para atualizá-los será necessária a intervenção manual de servidor da ANAC. Após disponibilizar
  os respectivos documentos atualizados em seu cadastro, o usuário deverá solicitar a alteração
  de tais informações por meio do canal de atendimento Fale com a ANAC, acessando o endereço
  eletrônico: https://www.anac.gov.br/fale-com-a-anac.'
