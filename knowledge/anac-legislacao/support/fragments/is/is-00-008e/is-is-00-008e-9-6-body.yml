id: is-is-00-008e-9-6-body
kind: is
document: is-00-008e
family: '0'
section_id: '9.6'
section_title: 'A atualização da empresa aérea associada ao cadastro do usuário no SACI poderá
  ser feita pela própria empresa ou solicitada à ANAC pelo usuário. Caso o interessado identifique
  que esse campo encontra-se com informação desatualizada, isto é, consta o vínculo a uma
  empresa na qual não trabalhe mais e com a qual não possa mais entrar em contato, poderá
  solicitar essa atualização à ANAC, enviando cópia digitalizada da documentação comprobatória
  pertinente (ex.: cópia da carteira de trabalho - folhas de identificação e do distrato do
  contrato de trabalho ou outro documento que comprove a desvinculação da empresa).'
