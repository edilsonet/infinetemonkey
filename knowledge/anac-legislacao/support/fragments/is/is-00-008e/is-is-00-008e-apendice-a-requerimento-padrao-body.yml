title: APÊNDICE A - REQUERIMENTO PADRÃO
text: 'APÊNDICE A - REQUERIMENTO PADRÃO


  CÓDIGO ANAC


  DADOS PESSOAIS

  NOME COMPLETO:

  CPF:

  TELEFONES:

  E-MAIL:

  SOLICITAÇÃO


  OBSERVAÇÃO


  DECLARAÇÃO DE CIÊNCIA E RESPONSABILIDADE

  Atesto que estou ciente do conteúdo da Instrução Suplementar nº 00-008 (IS nº 00-008) e
  que todas as informações fornecidas por meio do SACI são verdadeiras, estão atualizadas
  e são de minha inteira responsabilidade. Assumo, portanto, as possíveis consequências caso
  seja identificada alguma não conformidade e/ou irregularidade.


  Certifico que todas as informações e documentos por mim disponibilizados no SACI e/ou que
  componham processo administrativo de certificação de pessoal no qual eu seja interessado
  são legítimos e representam a verdade. Comprometo-me a disponibilizar o(s) original(is)
  e prestar quaisquer esclarecimentos sobre os mesmos caso seja requisitado pela ANAC ou outra
  autoridade competente.


  Estou ciente de que qualquer irregularidade nos dados fornecidos poderá tornar sem efeito
  os atos administrativos por eles subsidiados, sem prejuízo das sanções administrativas e/ou
  penais cabíveis.

  Declaro ter atualizado minhas informações pessoais no SACI.


  Declaro ter realizado o upload das digitalizações dos documentos pessoais no SACI.


  Local e data:___________________________________________________________________________


  Assinatura:

  (a mesma que consta

  digitalizada no SACI)


  IMPRIMIR, ASSINAR E DIGITALIZAR PARA INSERÇÃO NO SISTEMA.


  Instruções para preenchimento do Requerimento Padrão


  Com exceção do campo “OBSERVAÇÃO”, que é opcional, o preenchimento de todos os campos é
  obrigatório.


  CANAC: código ANAC do solicitante (6 dígitos numéricos).


  NOME COMPLETO: nome completo do solicitante (sem abreviação).


  CPF: número do CPF do solicitante.


  TELEFONES: números de telefone do solicitante (com DDD), fixo e celular, se possuir.


  E-MAIL: endereço de e-mail do solicitante.


  SOLICITAÇÃO: escrever de forma clara, objetiva e sucinta a(s) solicitação(ões).

  Exemplo: “Concessão da licença de Piloto Comercial de Avião (PCM) e Inclusão das habilitações
  MLTE e IFRA”.


  OBSERVAÇÃO: campo opcional para o solicitante descrever alguma observação ou informação
  que entender pertinente.


  Local e data: informar a cidade, sigla do estado e a data de preenchimento do requerimento
  padrão.


  Assinatura: assinatura do interessado, que deverá ser idêntica à imagem da sua assinatura
  digitalizada que consta no SACI.'
