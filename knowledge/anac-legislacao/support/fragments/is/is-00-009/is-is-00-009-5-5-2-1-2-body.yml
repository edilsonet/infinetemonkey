text: '5.5.2.1.2 Aeronaves experimentais, operando segundo o RBAC nº 91, devem possuir a bordo
  o Certificado de Marca Experimental (CME) válido. [RBAC nº 91.203(b)]

  5.5.2.1.3 Aeronaves com certificado de tipo provisório, operando segundo o RBAC nº 91, devem
  possuir a bordo o certificado de tipo provisório válido. [RBAC nº 91.203(c)]

  5.5.2.1.4 Aeronaves operadas segundo o RBAC nº 103 não possuem certificado de matrícula,
  mas devem estar cadastradas na ANAC, na forma estabelecida pela IS nº 103-001. [RBAC nº
  103.7(b)]

  5.5.2.1.5 Para aeronaves operando segundo o RBAC nº 136, não é necessário possuir o certificado
  de matrícula a bordo durante as operações, mas o certificado válido deve estar disponível
  no local de operação. [RBAC 136.15(a)]

  5.5.2.1.6 Para aeronaves operando segundo o RBAC nº 137, não é necessário possuir o certificado
  de matrícula a bordo durante as operações aeroagrícolas, mas o certificado válido deve estar
  disponível no local de operação. [RBAC n° 137.501(a)(1)]'
