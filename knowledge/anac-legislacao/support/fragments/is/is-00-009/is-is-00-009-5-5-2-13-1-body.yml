text: '5.5.2.13.1

  Alterado o trecho “Em operações comerciais de transporte de passageiros e/ou carga, segundo
  o RBAC nº 135 ou RBAC nº 136” para “Em operações de serviço de transporte de passageiros
  e/ou carga segundo o RBAC nº 135, de serviço aéreo especializado de voo panorâmico segundo
  o RBAC nº 136”.'
