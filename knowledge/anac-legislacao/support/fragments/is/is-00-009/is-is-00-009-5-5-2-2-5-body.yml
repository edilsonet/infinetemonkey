text: '5.5.2.2.5 Aeronaves operadas segundo o RBAC nº 103 não possuem Certificado de Aeronavegabilidade.
  [RBAC nº 103.7(a)]

  5.5.2.2.6 Para aeronaves operando segundo o RBAC nº 136, não é necessário possuir o Certificado
  de Aeronavegabilidade a bordo durante as operações, mas o certificado válido deve estar
  disponível no local de operação. [RBAC nº 136.15(a)]

  5.5.2.2.7 Para aeronaves operando segundo o RBAC nº 137, não é necessário possuir o Certificado
  de Aeronavegabilidade a bordo durante as operações aeroagrícolas, mas o certificado válido
  deve estar disponível no local de operação. [RBAC nº 137.501(a)(2)]'
