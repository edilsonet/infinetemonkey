text: '5.5.2.3.1 Todas as aeronaves civis brasileiras devem possuir diário de bordo conforme
  requerido pela Resolução nº 457/2017. [Art. 2º da Resolução nº 457/2017]

  5.5.2.3.2 Deve estar a bordo da aeronave o diário de bordo que contenha no mínimo os últimos
  30 (trinta) dias de operação da aeronave. [Art. 8º, inciso II, da Resolução nº 457/2017]

  5.5.2.3.3 No caso de aeronaves engajadas em atividades de recreio ou desporto, o diário
  de bordo não precisa estar a bordo quando for inviável o seu transporte devido às características
  construtivas da aeronave. No entanto, ele deve ser atualizado tão logo quanto praticável.
  [RBAC nº 91.203(a)(4)]

  5.5.2.3.4 Para aeronaves operando segundo o RBAC nº 137, os operadores devem atender aos
  requisitos de diário de bordo específicos, com atenção aos lançamentos corrigidos, que não
  podem ser feitos de um modo tal que impeça a leitura da informação inutilizada, e dos campos
  que não podem ser deixados em branco no diário de bordo e que possam ser eventualmente aproveitados
  para lançamentos indevidos. [RBAC nº 137.521]'
