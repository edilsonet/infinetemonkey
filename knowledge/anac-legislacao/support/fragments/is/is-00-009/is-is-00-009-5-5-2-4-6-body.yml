cite: 5.5.2.4.6
title: A apresentação do documento pode ser efetuada de forma digital.
text: '5.5.2.4.6 A apresentação do documento pode ser efetuada de forma digital.

  5.5.2.5. Apólice de seguro ou certificado de seguro válido.

  5.5.2.5.1. Toda aeronave deve possuir cobertura de seguro de responsabilidade civil nas
  classes a seguir, aplicáveis à sua configuração e operação: Classe I - Passageiros e respectivas
  bagagens de mão; Classe II - Tripulantes; Classe III - Pessoas e bens no solo; Classe IV
  - Colisão ou abalroamento; e Classe V - Cargas e bagagens despachadas. Com relação às Classes
  I e II, o seguro deve ser proporcional à quantidade de assentos. É obrigatório o seguro
  da Classe V para as aeronaves que operem serviços de transporte aéreo. [Art. 100 da Resolução
  nº 293/2013]

  5.5.2.5.2. O operador deve prover formas de comprovação de que a apólice de seguro ou certificado
  de seguro encontram-se válidos. [RBAC nº 91.203(a)(5)]

  5.5.2.5.3. Aeronaves, operando segundo o RBAC nº 91 e RBAC nº 135, devem possuir a bordo
  apólice de seguro ou certificado de seguro válido. [RBAC nº 91.203 (a)(5) / RBAC nº 135.3
  (a)(1)]

  5.5.2.5.4. Aeronaves, operando segundo o RBAC nº 103, que se dediquem à formação ou adestramento
  de outros desportistas, devem possuir o seguro contra danos a pessoas ou bens na superfície
  e ao pessoal técnico a bordo. [RBAC n° 103.7(c)]

  5.5.2.5.5. Para aeronaves operando segundo o RBAC nº 136, não é necessário possuir apólice
  de seguro ou certificado de seguro válido a bordo durante as operações, mas a apólice de
  seguro ou certificado de seguro válido, contemplando as classes I, II, III e IV, deve estar
  disponível no local de operação. [RBAC nº 136.15(a); RBAC nº 136.43(b)(4)]

  5.5.2.5.6. Para aeronaves operando segundo o RBAC nº 137, não é necessário possuir apólice
  de seguro a bordo durante as operações aeroagrícolas, mas a apólice de seguro válida da
  aeronave deve estar disponível no local de operação. [RBAC nº 137.501(a)(8)]

  5.5.2.5.7. A apresentação do documento pode ser efetuada de forma digital.

  5.5.2.6. Certificado de Verificação de Aeronavegabilidade (CVA) ou laudo de vistoria de
  aeronave.

  5.5.2.6.1. Aeronaves, operando segundo o RBAC nº 91 e RBAC nº 135 não registradas na categoria
  TPR, devem possuir a bordo Certificado de Verificação de Aeronavegabilidade (CVA) ou laudo
  de vistoria de aeronave válido - emitido nos últimos 12 (doze) meses. [RBAC nº 91.203 (a)(7)
  / RBAC nº 91.403(f) / RBAC 135.3 (a)(1)]

  5.5.2.6.2. Desde que dentro dos últimos 12 (doze) meses, uma vistoria técnica inicial (VTI)
  ou especial (VTE) substitui a apresentação do CVA. [RBAC nº 91.403(f)]

  5.5.2.6.3. Aeronaves, operando segundo RBAC nº 135 registradas na categoria TPR, devem apresentar
  CVA emitido para a aeronave nos últimos 3 (três) anos. [RBAC nº 91.403(e)]

  5.5.2.6.4. Para aeronaves operando segundo o RBAC nº 136, não é necessário possuir Certificado
  de Verificação de Aeronavegabilidade (CVA) ou laudo de vistoria de aeronave a bordo durante
  as operações, mas o Certificado de Verificação de Aeronavegabilidade (CVA) ou o laudo de
  vistoria de aeronave deve estar disponível no local de operação. [RBAC nº 136.15(a)]

  5.5.2.6.5. Para aeronaves operando segundo o RBAC nº 137, não é necessário possuir Certificado
  de Verificação de Aeronavegabilidade (CVA) ou laudo de vistoria de aeronave a bordo durante
  as operações aeroagrícolas, mas o Certificado de Verificação de Aeronavegabilidade (CVA)
  ou o laudo de vistoria de aeronave deve estar disponível no local de operação. [RBAC nº
  137.501(a)(4)]

  5.5.2.6.6. A apresentação do documento pode ser efetuada de forma digital.

  5.5.2.7. Ficha de peso e balanceamento, com a respectiva planta-baixa da configuração aprovada
  para voo.

  5.5.2.7.1. Aeronaves, operando segundo o RBAC nº 91 e RBAC nº 135, devem possuir a bordo
  ficha de peso e balanceamento, com a respectiva planta-baixa da configuração aprovada para
  voo, referente à última pesagem requerida para a aeronave. [RBAC nº 91.203(a)(12) / RBAC
  nº 135.3(a)(1)]

  5.5.2.7.2. Aeronaves cujos manuais aprovados definem intervalos de tempo entre pesagens
  consecutivas devem ser pesadas de acordo com tais manuais. [RBAC nº 91.423(a)]

  5.5.2.7.3. Aviões categoria transporte regional e categoria transporte, aviões multimotores
  com motores a reação de qualquer categoria e aeronaves de asas rotativas categoria transporte,
  quando não possuírem intervalos de pesagem definidos em seus manuais aprovados, devem ser
  pesados a cada 5 anos. [RBAC nº 91.423(b)]

  5.5.2.7.4. Aeronaves operando segundo o RBAC nº 135 devem ter o peso vazio e o centro de
  gravidade calculados com valores estabelecidos por pesagem real da aeronave dentro dos 36
  meses precedentes. Excetua-se desta regra a aeronave que tenha recebido o certificado de
  certificação de tipo original dentro dos 36 meses precedentes ou aeronave operada sob um
  sistema de peso e balanceamento aprovado nas Especificações Operativas do detentor de certificado.
  [RBAC nº 135.185]

  5.5.2.7.5. Qualquer aeronave, operando segundo o RBAC nº 91, RBAC nº 135, RBAC nº 136 e
  RBAC nº 137, deve ser pesada sempre que houver dúvidas quanto à exatidão de seu peso e balanceamento
  e após ter sido submetida a serviços de manutenção e alterações que possam ter alterado
  seu peso, tais como pintura geral, grandes reparos, grandes alterações, mudanças de configuração,
  etc. [RBAC nº 91.423(c)]

  5.5.2.7.6. A ficha de peso e balanceamento de uma aeronave, operando segundo o RBAC nº 91,
  RBAC nº 135, RBAC nº 136 e RBAC nº 137, deve ser recalculada sempre que a aeronave sofrer
  alteração por remoção, instalação ou mudança de posição de equipamentos, acessórios, decoração
  interna, etc. [RBAC nº 91.423(d)]

  5.5.2.7.7. A pesagem de uma aeronave, operando segundo o RBAC nº 91, RBAC nº 135, RBAC nº
  136 e RBAC nº 137, deve ser executada por pessoa autorizada para o serviço. [RBAC nº 91.423(e)]

  5.5.2.7.8. Para aeronaves operando segundo o RBAC nº 136, não é necessário possuir ficha
  de peso e balanceamento a bordo durante as operações, mas a ficha de peso e balanceamento,
  com a respectiva planta-baixa da configuração aprovada para voo, deve estar disponível no
  local de operação. [RBAC nº 136.15(a)]

  5.5.2.7.9. Para aeronaves operando segundo RBAC nº 137, não é necessário possuir ficha de
  peso e balanceamento a bordo durante as operações aeroagrícolas, mas a ficha de peso e balanceamento,
  com a respectiva planta-baixa da configuração aprovada para voo, deve estar disponível no
  local de operação. [RBAC nº 137.501(a)(3)]

  5.5.2.7.10. A apresentação do documento pode ser efetuada de forma digital.

  5.5.2.8. Lista de Passageiros.

  5.5.2.8.1. Somente é requerido que seja preparada, esteja a bordo do voo e permaneça arquivada
  pelo operador uma lista de passageiros em operações de serviço de transporte aéreo de passageiros
  ou operações de serviço aéreo especializado de voo panorâmico.

  5.5.2.8.2. Para operações segundo o RBAC nº 135 e RBAC nº 136, quando houver o transporte
  de passageiros, devem possuir a bordo uma lista de passageiros. [RBAC nº 91.203(a)(10)]

  5.5.2.8.3. Para operações segundo o RBAC nº 135 e RBAC nº 136, a lista de passageiros deverá
  conter informações suficientes para identificar os passageiros, por exemplo: nome completo
  do passageiro, documento de identificação (C.P.F. ou R.G., por exemplo) e telefone de contato.
  Caso o passageiro não possua C.P.F. ou R.G., pode ser informado outro documento de identificação
  oficial.

  5.5.2.8.4. Para operações segundo o RBAC nº 135 e RBAC nº 136, as informações referentes
  à lista de passageiro podem ser registradas no Diário de Bordo ou em qualquer outro meio
  físico ou digital e devem ser preenchidas antes da realização do voo.

  5.5.2.8.5. Para operações segundo o RBAC nº 135 e RBAC nº 136, a lista de passageiros a
  ser apresentada é referente ao voo realizado (após o pouso) ou a ser realizado (antes da
  decolagem). No entanto, ressalta-se que a lista de passageiros deve ser mantida por no mínimo
  1 (um) ano após o voo. [RBAC nº 91.203(a)(10)]

  5.5.2.8.6. Para operações não comerciais, sujeitas exclusivamente ao RBAC nº 91 (incluindo
  Subparte K do RBAC nº 91), não é requerida lista de passageiros a bordo da aeronave, nem
  a sua guarda após o voo. Mesmo assim, durante atividades de fiscalização da ANAC, o comandante
  do voo poderá ser solicitado a identificar os passageiros a bordo, prestes a embarcar ou
  que desembarcaram da aeronave. [RBAC nº 91.203(a)(10)]

  5.5.2.9. Manual de voo aprovado ou manual de operação da aeronave (AOM).

  5.5.2.9.1. Aeronaves, operando segundo o RBAC nº 91, RBAC nº 135 e RBAC nº 136, para as
  quais é requerido um manual de voo aprovado pela seção 21.5 do RBAC nº 21, devem possuir
  a bordo um manual de voo aprovado (AFM) ou um AOM atualizado. [RBAC nº 91.9(b)(1) / RBAC
  nº 91.203(a)(2) / RBAC nº 136.15(b)]

  5.5.2.9.2. Aeronaves, operando segundo o RBAC nº 91, RBAC nº 135 e RBAC nº 136, para as
  quais não é requerido um manual de voo aprovado pela seção 21.5 do RBAC nº 21, devem possuir
  a bordo: um manual de voo aprovado (ou um AOM) atualizado; ou material para manual aprovado;
  ou marcações e placares aprovados; ou uma combinação qualquer desses itens. [RBAC nº 91.9(b)(2)]

  5.5.2.9.3. Para as aeronaves de construção amadora, operando segundo o RBAC nº 91, a necessidade
  ou não do manual de voo aprovado é estabelecida à época de emissão do certificado de autorização
  de voo experimental (CAVE). [RBAC nº 91.9(a)]

  5.5.2.9.4. Para aeronaves experimentais operando em aeródromo restrito, o manual de voo
  (aprovado por engenheiro aeronáutico) deve estar a bordo da aeronave. [Itens 5.5.4 e 5.6.4
  da IS nº 91.319-001]

  5.5.2.9.5. Para aeronaves acrobáticas, quando realizando voos acrobáticos, os documentos
  devem estar disponíveis no local de operação, não sendo necessário portá-los a bordo da
  aeronave. [RBAC 91.9(b)(1)]

  5.5.2.9.6. Para aeronaves operando segundo o RBAC nº 137, não é necessário possuir manual
  de voo ou de operações a bordo durante as operações aeroagrícolas, mas o manual de voo ou
  de operações deve estar disponível no local de operação. [RBAC nº 137.501(a)(5)]

  5.5.2.9.7. A apresentação do documento pode ser efetuada por meio de dispositivos eletrônicos
  (EFB), desde que cumpridos os requisitos da IS nº 91-002. No entanto, para aeronaves que
  voam sob as regras do RBAC nº 135 ou Subparte K do RBAC nº 91, tais autorizações devem estar
  respectivamente nas Especificações Operativas do detentor de certificado ou Especificações
  Administrativas do administrador de programa.

  5.5.2.10. Lista condensada de verificações (checklist).

  5.5.2.10.1. Aeronaves, operando segundo o RBAC nº 91, RBAC nº 135, RBAC nº 136 e RBAC nº
  137 devem possuir a bordo a lista condensada de verificações (checklist) da aeronave. [RBAC
  nº 91.203(a)(2) / RBAC nº 135.83(a)(1) / RBAC nº 136.15(b) / RBAC nº 137.501(b)]

  5.5.2.10.2. Para operações segundo o RBAC nº 91, exceto para as operações segundo as Subpartes
  F e K do RBAC nº 91, aceitam-se as listas contidas no manual de voo aprovado.

  5.5.2.10.3. Para operações segundo as Subpartes F e K do RBAC nº 91 (aeronaves de um programa
  de propriedade compartilhada, grandes aviões e aviões multimotores com motores a turbina),
  deve haver lista de verificação contendo os procedimentos normais e em emergência previstos
  nos parágrafos 91.503(b) e 91.503(c) do RBAC nº 91. E, para aviões multimotores, deve haver
  também os dados de desempenho para subidas com um motor inoperante. [RBAC n° 91.503]

  5.5.2.10.4. Para aeronaves multimotoras ou para aeronaves com trem de pouso retrátil, operando
  segundo o RBAC nº 135, deve haver também uma lista de verificações em emergência contendo
  os procedimentos requeridos pelo parágrafo 135.83(c) do RBAC nº 135. [RBAC nº 135.83(a)(2)]

  5.5.2.10.5. Na existência de lista condensada, deve haver meios que possibilitem identificar
  a aplicabilidade à aeronave, como referência ao AFM do qual faz parte ou ao documento de
  aprovação como parte do AOM. [RBAC nº 91.9 / RBAC nº 91.203(a)(2)]

  5.5.2.10.6. A apresentação do documento pode ser efetuada através de dispositivos eletrônicos
  (EFB), desde que cumpridos os requisitos da IS nº 91-002. No entanto, para aeronaves que
  voam sob as regras do RBAC nº 135 ou Subparte K do RBAC nº 91, tais autorizações devem estar
  respectivamente nas Especificações Operativas do detentor de certificado ou Especificações
  Administrativas do administrador de programa.

  5.5.2.11. Publicações Aeronáuticas

  5.5.2.11.1. Aeronaves, operando segundo o RBAC nº 91, RBAC nº 135, RBAC nº 136 e RBAC nº
  137 devem possuir a bordo publicações aeronáuticas apropriadas válidas e atualizadas, contendo
  informações adequadas concernentes a auxílios de navegação, procedimentos de aproximação
  e saída, e demais informações aeronáuticas referentes à rota a ser voada e aos aeródromos
  a serem utilizados. [RBAC nº 91.203(a)(3) / RBAC nº 135.3 (a)(1) / RBAC nº 135.83(a)(3)
  / RBAC nº 135.83(a)(4) / RBAC nº 136.15(b)]

  5.5.2.11.2. A ICA 53-7, publicada pelo Departamento de Controle do Espaço Aéreo (DECEA)
  versa sobre a disponibilização e utilização da informação aeronáutica em formato digital,
  contemplando também a impressão e distribuição do conteúdo total ou parcial.

  5.5.2.11.3. Podem ser utilizadas publicações comerciais em papel, desde que as publicações
  tenham sido aprovadas pela autoridade aeronáutica do país emissor.

  5.5.2.11.4. A apresentação do documento pode ser efetuada por meio de dispositivos eletrônicos
  (EFB), desde que cumpridos os requisitos da IS nº 91-002. No entanto, para aeronaves que
  voam sob as regras do RBAC nº 135 ou Subparte K do RBAC nº 91, tais autorizações devem estar
  respectivamente nas Especificações Operativas do detentor de certificado ou Especificações
  Administrativas do administrador de programa.

  5.5.2.12. Autorizações de operações especiais ou específicas.

  5.5.2.12.1. Tripulantes, operando segundo o RBAC nº 91, RBAC nº 103, RBAC nº 135, RBAC nº
  136 e RBAC nº 137 devem possuir a bordo da aeronave ou portar (RBAC nº 103), se aplicável,
  as autorizações de operações especiais ou específicas. [RBAC nº 91.203(a)(9) / RBAC nº 103.701(c)(1)
  / RBAC nº 135.3 (a)(1) / RBAC nº 135.83(a)(3) / RBAC nº 135.83(a)(4) / RBAC nº 136.15(b)]

  5.5.2.12.2. Operadores privados operando segundo o RBAC nº 91 em voos nacionais, sob as
  especificações PBN RNAV 10, RNAV 5, RNAV 2, RNAV 1, RNP 4, RNP 2, RNP APCH não necessitam
  de Letter of Approval (LOA), bastando a comprovação especificada na seção 5.5 da IS nº 91-001.
  [seção 5.5 da IS nº 91-001]

  5.5.2.12.3. Tripulantes operando segundo o RBAC nº 91 podem comprovar as autorizações por
  meio de LOA ou outras autorizações emitas pela ANAC.

  5.5.2.12.4. Tripulantes operando segundo a Subparte K do RBAC nº 91 podem apresentar as
  autorizações por meio das Especificações Administrativas. [RBAC nº 91.1025(c)]

  5.5.2.12.5. Tripulantes operando segundo o RBAC nº 135 podem apresentar as autorizações
  por meio das Especificações Operativas. [RBAC nº 135.23(a)(3)];

  5.5.2.12.6. Para operações sobre área densamente povoada em aeronaves detentoras de CAVE,
  que sejam de construção amadora, de categoria primária montadas a partir de conjuntos, ou
  aeronaves leves esportivas experimentais, o comandante deverá apresentar o Formulário de
  Inspeção de Aeronave Experimental (F-319) válido emitido por ente qualificado e devidamente
  assinado. [RBAC nº 91.319 / IS nº 91.319-001]

  5.5.2.12.7. A apresentação dos documentos pode ser efetuada de forma digital.

  5.5.2.13. Manifesto de Carga

  5.5.2.13.1. Em operações de serviço de transporte de passageiros e/ou carga segundo o RBAC
  nº 135, de serviço aéreo especializado de voo panorâmico segundo o RBAC nº 136 e em operações
  segundo a Subparte K do RBAC nº 91, o piloto em comando deverá apresentar o manifesto de
  carga preparado previamente ao voo e contendo informações concernentes ao carregamento da
  aeronave. [RBAC nº 91.203(a)(11) / RBAC nº 91.1027(c)/ RBAC nº 135.63(c)]

  5.5.2.13.2. Para operações segundo o RBAC nº 135, o manifesto de carga deve ser preparado
  previamente ao voo conforme o previsto no requisito 135.63(c). Caso tenha aprovação em suas
  Especificações Operativas, a elaboração do manifesto pode ser efetuada em EFB. [RBAC nº
  135.63(c) / 135.63(f)]

  5.5.2.13.3. Ainda para as operações segundo o RBAC nº 135, em que houver transporte comercial
  de cargas, o comandante deverá apresentar a listagem das cargas embarcadas, ou conhecimento
  aéreo (AWB), contendo o número de volumes transportados e os pesos. [Lei nº 7.565/86, Art.
  20, inciso III / Resolução Conaero nº 01/2017, Art. 16, III]

  5.5.2.13.4. Para operações segundo a Subparte K do RBAC nº 91, operações de aeronaves de
  propriedade compartilhada, o manifesto de carga deve ser preparado conforme o previsto no
  requisito 91.1027(c). Caso tenha aprovação em suas Especificações Administrativas, a elaboração
  do manifesto pode ser efetuada em EFB. [RBAC nº 91.1027(c) / 91.1027(f)]

  5.5.2.13.5. Para operações segundo o RBAC nº 136, o manifesto de carga deve estar de acordo
  com o procedimento previsto no manual de operações. [RBAC 136.23(b)(4)(iv)]

  5.5.2.13.6. Para as demais operações, ou seja, operações exclusivamente segundo o RBAC nº
  91, exceto Subparte K, o comandante da aeronave deverá de demonstrar que o voo ocorreu ou
  irá ocorrer dentro dos parâmetros e limitações estabelecidos pelo manual de voo da aeronave
  e de acordo com as características da aeronave específica, a partir das informações registradas
  no diário de bordo. O registro no diário de bordo, juntamente com a apresentação dos cálculos
  de carregamento da aeronave e dos limites e parâmetros utilizados caracterizarão a apresentação
  do manifesto de carga conforme requerido pela pelo regulamento. [RBAC nº 91.9(e) / RBAC
  nº 91.203(a)(11) / RBAC nº 91.423]

  5.5.2.13.7. Para operações segundo o RBAC nº 91, exceto Subparte K do RBAC nº 91, o cálculo
  do carregamento da aeronave deve ser realizado previamente ao voo e deve incluir pelo menos
  as seguintes informações e parâmetros:'
