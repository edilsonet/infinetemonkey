title: 5.5.2.4.6(d)
text: 'd) o centro de gravidade da aeronave carregada.

  5.5.2.13.8. Para operações segundo o RBAC nº 91, exceto Subparte K do RBAC nº 91, podem
  ser utilizadas ferramentas digitais, não sendo necessária autorização da ANAC. Cabe ao operador
  aéreo demonstrar que a ferramenta utilizada é compatível com as características e limitações
  do modelo da aeronave e referente à aeronave especificamente (com informações atualizadas
  da ficha de pesagem) em operação e que permite a demonstração dos parâmetros e etapas de
  cálculo ao servidor da ANAC durante a atividade de fiscalização.

  5.5.2.13.9. Para operações segundo o RBAC nº 91, exceto Subparte K, o operador pode determinar
  condições de carregamento (passageiro, carga e combustível) pré-definidas em que os limites
  operacionais da aeronave são cumpridos. Por exemplo, se o operador realiza habitualmente
  um deslocamento de “A” para “B” com os mesmos tripulantes e passageiros, não é necessário
  um cálculo individualizado por cada voo, mas as condições de tal operação (padrão de carregamento).

  5.5.2.14. Certificado de Operador Aéreo (COA) e Cadastro de Aeroagrícola (CDAG)

  5.5.2.14.1. Para operações internacionais sob o RBAC nº 135, uma cópia autenticável do COA
  deve ser levada a bordo. A cópia do COA emitido pela ANAC com mecanismo que permite a verificação
  da autenticidade do documento é considerada autenticável para atendimento ao requisito [RBAC
  nº 119.43(d)(1)]

  5.5.2.14.2 Para operações sob o RBAC nº 137, não é necessário que o CDAG esteja disponível
  no local da operação. No entanto, é necessário que o CDAG esteja atualizado e que reflita
  a situação real do operador, ou que haja evidência de que a atualização já foi providenciada
  junto à ANAC. [RBAC nº 137.115(d)]

  5.5.2.14.3. A apresentação do documento pode ser efetuada de forma digital.

  5.5.2.15. Especificações Operativas (EO) e Especificações Administrativas (EA).

  5.5.2.15.1. Para operações segundo a Subparte K do RBAC nº 91, o Manual de Operações do
  Programa, a bordo da aeronave, deve conter informações e limitações constantes das Especificações
  Administrativas, incluindo áreas de operações autorizadas, categoria e classe de aeronaves
  autorizadas, requisitos de composição de tripulação e tipos de operações autorizadas. [RBAC
  nº 91.1023(e)(2) / 91.1025(c)]

  5.5.2.15.2. As EA em dispositivo eletrônico, para operadores segundo a Subparte K do RBAC
  nº 91, poderão ser aceitas desde que o operador possua aprovação para uso de dispositivo
  eletrônico. [RBAC nº 91.1023(f)(1)]

  5.5.2.15.3. Para operações segundo o RBAC nº 135, uma cópia das Especificações Operativas
  deve ser levada a bordo da aeronave. No caso de aeronaves autorizadas a realizar operações
  internacionais, a cópia deve ser traduzida para o inglês. [RBAC nº 119.43(d)(2)]

  5.5.2.15.4. As EO em dispositivo eletrônico, para operadores segundo o RBAC nº 135, poderão
  ser aceitas desde que o operador possua aprovação para o uso. [RBAC nº 135.21(g)(1)]

  5.5.2.16. Manual Geral da Empresa e Manual de Operações do Programa.

  5.5.2.16.1. Para operações segundo a Subparte K do RBAC nº 91, deve haver a bordo da aeronave
  uma quantidade de manuais atualizados (ou de partes apropriadas dos mesmos) adequada ao
  número e funções de tripulantes a bordo. Para o uso em voo de dispositivo eletrônico, contendo
  parte do manual requerido a bordo, é necessária autorização específica da ANAC. [RBAC nº
  91.1023(e)(2) / 91.1023(f)(1)]

  5.5.2.16.2. Para operações segundo o RBAC nº 135, deve haver a bordo da aeronave uma quantidade
  de manuais atualizados (ou de partes apropriadas dos mesmos) adequada ao número e funções
  de tripulantes a bordo. Para o uso em voo de dispositivo eletrônico, contendo parte do manual
  requerido a bordo, é necessária autorização específica da ANAC. [RBAC nº 135.21(f)(2) /
  135.21(g)(1)]

  5.5.2.17. Lista de equipamentos mínimos (MEL) e Lista de controle ACR.

  5.5.2.17.1. Caso aprovada pela ANAC e em utilização, a lista deve estar a bordo. [RBAC 91.213(a)(1)
  / 91.1115(a)(2) / RBAC nº 135.179(b)(2)]

  5.5.2.17.2. Para operações segundo o RBAC nº 135 ou segundo a Subparte K do RBAC nº 91,
  deve haver uma lista de controle de itens com Ação Corretiva Retardada - ACR, conforme previsto
  na IS nº 91-012. [5.1.3.3 da IS nº 91-012]

  5.5.2.17.3. A apresentação do documento pode ser efetuada através de dispositivos eletrônicos.
  No entanto, para aeronaves que voam sob as regras do RBAC nº 135, tal autorização deve estar
  nas Especificações Operativas do detentor de certificado. [RBAC nº 135.179(b)(2)]

  5.5.2.18. Manual de Procedimentos Operacionais Padronizados - Standard Operating Procedures
  (SOP)

  5.5.2.18.1. Para operações segundo o RBAC nº 135 ou segundo a Subparte K do RBAC nº 91,
  deve haver a bordo da aeronave o manual de procedimentos operacionais padronizados (SOP).
  O SOP em dispositivos eletrônicos (EFB) poderá ser aceito desde que autorizado nas Especificações
  Operativas do detentor de certificado operador. [RBAC nº 91.1025(ff) / RBAC nº 135.21(f)(2)
  / 135.21(g)(1) / 135.23(a)(35)]

  5.5.3. Inspeção Interna.

  5.5.3.1. A aeronave deve estar aeronavegável e em conformidade com os requisitos aplicáveis
  à sua operação. [RBAC nº 91.7]

  5.5.3.2. A seguir são prestadas orientações sobre alguns itens habitualmente verificados
  em inspeção de rampa. Ressalta-se que a lista de itens não é exaustiva e que, a critério
  da equipe de fiscalização, outros itens poderão ser fiscalizados.

  5.5.3.3. Cabine de comando, painel da aeronave e instrumentos.

  5.5.3.3.1. Não pode haver objetos limitando a movimentação dos controles de voo ou bloqueando
  a visibilidade dos para-brisas. [RBAC nº 91.3(a)]

  5.5.3.3.2. Exceto se autorizado pela ANAC ou previsto em MEL aprovada pela ANAC ou em operação
  segundo o requisito 91.213(d) do RBAC nº 91, a aeronave deve possuir os equipamentos e instrumentos,
  requeridos pelo RBAC n° 91, em condições operacionais, devidamente inspecionados, calibrados,
  pesados e lacrados, conforme aplicável. [RBAC nº 91.205 / RBAC nº 91.213]

  5.5.3.3.3. Caso a aeronave possua equipamento de navegação, a base de dados deve estar atualizada.
  Ressalta-se que uma base de dados desatualizada em equipamento de navegação, mesmo que somente
  afixado ao painel, consiste em instrumento inoperante. Apenas é permitida a operação de
  aeronave com equipamentos inoperantes quando em conformidade com o que preconiza uma MEL
  aprovada pela ANAC ou, para aeronaves que não possuem MEL aprovada, em conformidade com
  a seção 91.213 do RBAC n° 91. [RBAC n° 91.213]

  5.5.3.3.4. Os assentos dos tripulantes devem possuir cinto de segurança conforme determinado
  pelo RBAC nº 91. [RBAC nº 91.205(b)(12) / 91.205(b)(13) / 91.205(b)(15) / RBAC 91.313 (g)
  / RBAC 91.521]

  5.5.3.3.5. O extintor de incêndio deve estar devidamente instalado, acessível aos tripulantes
  em voo e em conformidade com as especificações técnicas aplicáveis (tipo e quantidade de
  agente extintor adequados e com a manutenção realizada conforme o estabelecido pelo fabricante
  da aeronave e, na ausência de instruções do fabricante da aeronave, pelo fabricante do equipamento).
  [RBAC nº 91.205(b)(18)]

  5.5.3.3.6. Aeronaves pressurizadas e as que operam em altitude pressão acima dos 12.500
  pés (MSL), operando segundo o RBAC nº 91, devem estar equipadas com sistema de oxigênio
  suplementar adequado à operação. [RBAC n° 91.211]

  5.5.3.3.7. Aeronaves pressurizadas e as que operam em altitude pressão acima dos 10.000
  pés (MSL), operando segundo o RBAC nº 135, devem estar equipadas com sistema de oxigênio
  adequado à operação. [RBAC nº 135.89]

  5.5.3.3.8. Uma lanterna elétrica portátil, em boas condições de operação, é requerida para
  cada membro da tripulação para operações no período noturno. Independentemente do tipo de
  voo, uma lanterna é requerida também para as aeronaves enquadradas nas Subpartes F e K do
  RBAC n° 91. A tecnologia de iluminação ou forma de alimentação da lanterna não é regulamentada,
  devendo apenas ser garantida a boa condição de operação. [RBAC nº 91.205(c)(8) / RBAC 91.205
  (d)(1) / RBAC 91.503(a)(1) / RBAC 135.159(a)(6)(iii)]

  5.5.3.3.9. Para aviões com capacidade máxima acima de 19 passageiros, operando segundo as
  Subpartes F e K do RBAC nº 91, deve haver uma machadinha de resgate disponível. [RBAC nº
  91.513(e)]

  5.5.3.3.10. Para aeronaves com configuração para passageiros com mais de 19 assentos, operando
  segundo o RBAC nº 135, deve haver uma machadinha acessível aos tripulantes, mas inacessível
  aos passageiros durante operação normal. [RBAC nº 135.177(b)(3)]

  5.5.3.3.11. Os placares requeridos devem estar devidamente instalados e legíveis. [RBAC
  nº 91.9]

  5.5.3.3.12. Transmissores Localizadores de Emergência (ELT) e Personal Locator Beacons (PLB)
  devem estar em conformidade com o requisito 91.207 do RBAC nº 91. [RBAC 91.207]

  5.5.3.3.13. Helicópteros em operação segundo o RBAC nº 135 sobre terreno desabitado ou selva
  devem possuir ELT em conformidade com o requisito 135.166(b). [RBAC nº 135.166(b)]

  5.5.3.4. Cabine de passageiros e carga.

  5.5.3.4.1. Não pode haver objetos que restrinjam o acesso ou a utilização de qualquer saída
  normal ou de emergência ou o uso dos corredores do compartimento dos passageiros, inclusive
  o corredor de acesso ao compartimento dos pilotos. [RBAC nº 91.525(a)(3)(iv)]

  5.5.3.4.2. O layout da cabine de passageiros deve estar de acordo com a planta-baixa da
  aeronave. [RBAC nº 91.203(a)(12) / RBAC nº 91.423]

  5.5.3.4.3. Os cintos de segurança devem estar de acordo com o estipulado pelo RBAC nº 91.

  5.5.3.4.4. Para aeronaves de propriedade compartilhada, operando segundo a Subparte K do
  RBAC nº 91, cartões impressos com instruções aos passageiros devem ser transportados na
  aeronave em locais convenientes para uso de cada passageiro. Os cartões devem ser apropriados
  à aeronave na qual serão utilizados, conter um diagrama e o método de operar as saídas de
  emergência e conter outras instruções necessárias para o uso do equipamento de emergência
  a bordo da aeronave. [RBAC nº 91.1035(f)]

  5.5.3.4.5. Para aeronaves que operam sob as regras do RBAC nº 135 é necessário que estejam
  disponíveis a bordo cartões impressos de informação aos passageiros, colocados em posições
  convenientes para o uso de cada passageiro. Devem ser apropriados para o respectivo modelo
  da aeronave, conter um diagrama das saídas de emergência e o método de operá-las, informações
  sobre as posições a serem tomadas pelos passageiros em caso de pouso forçado da aeronave
  e instruções necessárias ao uso do equipamento de emergência a bordo da aeronave. [RBAC
  nº 135.117(e)]

  5.5.3.4.6. Aeronaves operando sob as regras do RBAC nº 135 devem possuir a bordo um conjunto
  de primeiros socorros para tratamento de ferimentos que possam ocorrer a bordo ou em acidentes
  menores. O conjunto deve ser apropriadamente embalado e posicionado de modo a ser prontamente
  visível e acessível pelos ocupantes da aeronave, devendo conter os itens especificados no
  requisito 135.177(b)(1) do RBAC nº 135. Para aeronaves com capacidade para 19 assentos ou
  menos é opcional o item ressuscitador/reanimador (AMBU) em silicone. [RBAC nº 135.176 /
  135.177]

  5.5.3.4.7. Aeronaves com configuração para passageiros com mais de 19 assentos, operando
  sob as regras do RBAC nº 135, devem possuir a bordo um conjunto de precaução universal,
  contendo os itens especificados no requisito 135.177(b)(2) do RBAC nº 135. [RBAC nº 135.177(b)(2)]

  5.5.3.4.8. Não pode haver objetos obstruindo o acesso ou o uso de qualquer saída de emergência,
  exceto para operações exclusivamente cargueiras nas condições determinadas pelo requisito
  135.87 do RBAC nº 135. [RBAC n° 135.87 / 135.91(a)(5)]

  5.5.3.4.9. Aeronaves pressurizadas e as que operam em altitude pressão acima dos 14.000
  pés (MSL), operando segundo o RBAC nº 91, devem estar equipadas com sistema de oxigênio
  suplementar adequado à operação. [RBAC n° 91.211]

  5.5.3.4.10. Aeronaves pressurizadas e as que operam em altitude pressão acima dos 10.000
  pés (MSL), operando segundo o RBAC n° 135, devem estar equipadas com sistema de oxigênio
  adequado à operação com passageiros. [RBAC n° 135.157]

  5.5.3.4.11. Aeronaves operando segundo a Subparte F e K do RBAC nº 91 ou segundo o RBAC
  nº 135 devem possuir avisos e placares visíveis para todos os passageiros e comissários,
  informando sobre a proibição de fumar a bordo e quando da necessidade de ajustar os cintos
  de segurança. [RBAC nº 91.517 / RBAC nº 135.177(b)(4)]

  5.5.3.4.12. Aeronaves operando segundo a Subparte F e K do RBAC nº 91 somente podem efetuar
  o transporte de bagagem de mão e carga se as mesmas estiverem de acordo, respectivamente,
  com os requisitos 91.523 e 91.525 do RBAC nº 91. [RBAC 91.523 / RBAC 91.525]

  5.5.3.4.13. Aeronaves operando segundo o RBAC nº 135 somente podem efetuar o transporte
  de carga, incluindo bagagem de mão, se estiverem de acordo com o requisito 135.87 do RBAC
  nº 135. Para o transporte em aeronave com configuração cargueira aprovada, deve haver previsão
  nas Especificações Operativas do detentor de certificado. [RBAC nº 135.87]

  5.5.3.4.14. Aeronaves operando segundo a Subparte F e K do RBAC nº 91 devem possuir pelo
  menos um extintor adequadamente colocado no compartimento de passageiros de cada avião acomodando
  mais de 6 e menos de 31 passageiros e pelo menos 2 extintores adequadamente colocados no
  compartimento de passageiros de cada avião acomodando mais de 30 passageiros. Os extintores
  de incêndio devem ser instalados e presos de maneira a não interferir com a operação segura
  do avião e não afetar a segurança de tripulantes e passageiros. Eles devem ser rapidamente
  acessíveis e, salvo se sua localização for clara, seus locais de guarda devem ser apropriadamente
  identificados. O tipo e quantidade de agente extintor devem ser adequados e a manutenção
  realizada conforme o estabelecido pelo fabricante da aeronave e, na ausência de instruções
  do fabricante da aeronave, pelo fabricante do equipamento. [RBAC nº 91.513(c)]

  5.5.3.4.15. Aeronaves operando segundo o RBAC nº 135, transportando passageiros, devem possuir
  pelo menos um extintor manual, de tipo aprovado, adequadamente posicionado na cabine de
  passageiros de: cada grande avião com configuração para passageiros de mais de 6 assentos,
  excluindo qualquer assento para pilotos; cada avião multimotor com motor a turbina com configuração
  para passageiros de mais de 6 assentos, excluindo qualquer assento para pilotos; cada aeronave
  não listada anteriormente neste parágrafo com configuração para passageiros de mais de 9
  assentos, excluindo qualquer assento para pilotos. O tipo e quantidade de agente extintor
  devem ser adequados e a manutenção realizada conforme o estabelecido pelo fabricante da
  aeronave e, na ausência de instruções do fabricante da aeronave, pelo fabricante do equipamento.
  [RBAC nº 135.155]

  5.5.3.4.16. Aviões que possuam uma configuração aprovada para passageiros com mais de 60
  e menos de 100 assentos devem possuir um megafone. Os aviões com 100 ou mais assentos devem
  possuir dois megafones. As características dos megafones e localização estão determinadas
  pelo requisito 91.513(f) do RBAC n° 91. [RBAC 91.513(f)]

  5.5.3.4.17. Aeronaves operando segundo o RBAC n° 135 e que estejam autorizadas nas suas
  Especificações Operativas (EO) a operar sobre terreno desabitado ou selva, ao realizarem
  tais operações, devem possuir a bordo os equipamentos de emergência requeridos pelo requisito
  135.166 do RBAC n° 135. [RBAC nº 135.166]

  5.5.3.4.18. Aeronaves operando segundo o RBAC n° 91, para operar sobre água, devem possuir
  os equipamentos de sobrevivência previstos no requisito 91.231 do RBAC nº 91. [RBAC nº 91.231]

  5.5.3.4.19. Aeronaves operando segundo o RBAC n° 135 e que estejam autorizadas nas suas
  Especificações Operativas a operar sobre grandes extensões de água e operações “off-shore”
  com helicópteros, ao realizarem tais operações, devem possuir a bordo os equipamentos de
  emergência requeridos pelo requisito 135.167 do RBAC nº 135. [RBAC nº 135.167]

  5.5.3.4.20. Helicópteros realizando voo panorâmico sobre a água, segundo o RBAC nº 136,
  devem estar equipados conforme previsto na seção 136.45 do citado regulamento. [RBAC nº
  136.45]

  5.5.4. Inspeção externa.

  5.5.4.1. A aeronave deve estar aeronavegável e em conformidade com os requisitos aplicáveis
  à sua operação. [RBAC nº 91.7]

  5.5.4.2. A seguir são prestadas orientações sobre alguns itens habitualmente verificados
  em inspeção de rampa. Ressalta-se que a lista de itens não é exaustiva e que, a critério
  da equipe de fiscalização, outros itens poderão ser fiscalizados.

  5.5.4.3. Os seguintes pontos serão objeto de avaliação durante inspeção de rampa:

  5.5.4.3.1. Aspecto externo geral.

  5.5.4.3.2. Gotejamento de fluidos, combustível ou óleos.

  5.5.4.3.3. Estado dos pneus e compartimentos do trem de pouso.

  5.5.4.3.4. Desgaste e reparos aparentes, principalmente em áreas aerodinâmicas, bordos de
  ataque de asas, superfícies de comando, deriva, entradas de ar de motores, pás de hélices
  e rotores.

  5.5.4.4. A aeronave deve estar identificada e marcada conforme o requerido pelo RBAC nº
  45.

  5.5.4.4.1. A placa de identificação à prova de fogo deve estar em conformidade com os requisitos
  45.11 e 45.13 do RBAC nº 45. [RBAC nº 45.11 / RBAC n° 45.13]

  5.5.4.4.2. A placa de marcas de nacionalidade e de matrícula deve estar em conformidade
  com o requisito 45.30-I do RBAC nº 45. [RBAC nº 45.30-I]

  5.5.4.4.3. Aeronaves operando sob o RBAC nº 135 e serviços aéreos especializados (incluindo
  as modalidades de voo panorâmico ou de voos de instrução) devem estar devidamente identificadas,
  conforme a aplicabilidade e o requerido pelo requisito 45.12-I do RBAC nº 45, com as inscrições
  “TRANSPORTE PÚBLICO”, “SAE”, “VOO PANORÂMICO” ou “INSTRUÇÃO”. [RBAC nº 45.12-I]

  5.5.4.4.4. As marcas de nacionalidade e de matrícula devem estar em conformidade com a Subparte
  C do RBAC nº 45. [RBAC nº 45 Subparte C]

  5.5.4.4.5. Aeronave categoria restrita, leve esportiva, experimental ou com certificado
  de aeronavegabilidade provisório devem estar marcadas enquanto “RESTRITA”, “LEVE ESPORTIVA”,
  “EXPERIMENTAL” ou “PROVISÓRIO”, conforme aplicável e de acordo com o requisito 45.23-I (b)
  do RBAC nº 45. [RBAC n° 45.23-I(b)]

  5.5.4.4.6. As aeronaves que operam sob as regras do RBAC nº 135 devem ter o nome comercial,
  conforme indicado nas EO emitidas para o operador, devidamente afixado. No caso das aeronaves
  que operam sob as regras do RBAC nº 137, o operador não pode oferecer serviço aéreo segundo
  o RBAC nº 137 utilizando um nome comercial diferente daquele constante do CDAG do operador.
  [RBAC nº 119.9 / RBAC nº 137.9(a)]

  5.6. Área de inspeção “Procedimentos”

  5.6.1. A fim de verificar os procedimentos estabelecidos pelo operador da aeronave para
  a operação, ou os previstos nos manuais e programas constantes a bordo, poderão ser realizadas
  entrevistas com a tripulação, pessoal de terra e passageiros.

  5.6.2. Dentre os diversos procedimentos que podem ser verificados, dependendo da aplicabilidade,
  destacam-se os seguintes:

  5.6.2.1. Operação realizada ou pretendida e a compatibilidade com a certificação do operador,
  aeronave e tripulação;

  5.6.2.2. Operação de aeronaves experimentais sobre área densamente povoada deve ser realizada
  conforme estipulado pela IS nº 91.319-001 e alterações posteriores;

  5.6.2.3. Planejamento de voo pela tripulação de voo, tal como revisão do clima, planos de
  voo, dados utilizados para o carregamento, peso e balanceamento e de desempenho e peso de
  decolagem, NOTAMs, requisitos de controle de voo (despacho, liberação de voo, etc.);

  5.6.2.4. Atividades da tripulação de pré-voo da aeronave, como inspeção externa da aeronave,
  revisão dos diários de bordo, livros de registro e procedimentos de configuração da cabine
  de comando;

  5.6.2.5. Preenchimento e armazenamento (quando aplicável) dos manifestos de carga, peso
  e balanceamento;

  5.6.2.6. Atividades de registro de pós voo nos livros de registros da tripulação de voo;

  5.6.2.7. Uso apropriado de MEL e placares, registro, despacho correto de item em ACR, deferimento
  e encerramento de itens MEL;

  5.6.2.8. Registros de manutenção da aeronave;

  5.6.2.9. Embarque e desembarque de passageiros, incluindo procedimentos de proteção ao público;

  5.6.2.10. Carregamento e acondicionamento de cargas e bagagens;

  5.6.2.11. Transporte de artigos perigosos; e

  5.6.2.12. Abastecimento.

  5.7. Resultado da inspeção em rampa

  5.7.1. Após o término da inspeção, o preposto do operador será informado pela equipe que
  a atividade foi encerrada.

  5.7.2. O resultado da fiscalização desencadeará a adoção de providência administrativa,
  caso constatada infração regulamentar durante ou após a fiscalização, sendo classificadas
  enquanto preventiva, sancionatória e acautelatória. [Art. 3º da Resolução ANAC nº 472/18]

  5.7.3. Pessoas naturais, cujas atividades sejam reguladas pela ANAC, e seus representantes,
  e pessoas naturais que representem pessoas jurídicas cujas atividades sejam reguladas pela
  ANAC, devem estar cadastrados enquanto usuário externo do protocolo eletrônico. [Art. 13
  da Resolução ANAC nº 520/19]

  5.7.4. A partir do cadastro, todos os atos e comunicações processuais entre a ANAC e os
  usuários externos previstos no item 5.7.3 serão realizados por meio eletrônico, não sendo
  admitidos peticionamentos de documentos e intimações por meio diverso, exceto quando houver
  indisponibilidade do meio eletrônico que cause dano relevante à celeridade ou à instrução
  do processo ou incompatibilidade com os padrões aceitos pelo Protocolo Eletrônico. [Art.
  14 da Resolução ANAC nº 520/19]

  5.7.5. Eventualmente, caso sejam necessárias informações adicionais, tripulante(s), operador(es)
  e passageiro(s) poderão ser contatados posteriormente.'
