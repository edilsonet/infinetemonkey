title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1. Inspeção de Rampa

  5.1.1. Inspeção em rampa é uma das atividades de fiscalização (ou vigilância continuada)
  de segurança operacional realizada em uma aeronave antes da partida ou após o corte dos
  motores, com o objetivo de comprovar o cumprimento dos requisitos regulamentares e dos procedimentos
  operacionais aplicáveis, conforme a legislação em vigor.

  5.1.2. O escopo da inspeção de rampa é definido em função da demanda que a ocasionou. Por
  exemplo, se uma inspeção de rampa for dirigida a uma determinada aeronave com a priorização
  sobre alguma denúncia específica, a ANAC irá verificar todas as evidências para tomar ações
  pertinentes, visando a aeronavegabilidade continuada e operacionalidade da aeronave, resguardando
  o interesse público conforme as disposições legais no interesse da segurança, eficiência
  e regularidade dos serviços.

  5.1.3. A abrangência da verificação em uma inspeção de rampa dependerá do tempo e dos recursos
  da ANAC disponíveis, além das evidências encontradas e existência de processo de denúncia
  ou demanda de fiscalização que ensejou a inspeção de rampa.

  5.1.4. A equipe de fiscalização, durante a realização de suas atividades, não está limitada
  à inspeção de rampa, podendo fiscalizar inclusive aeronaves que não estiverem em operação.
  No entanto, ressalta-se que na ausência de representante do operador aéreo, eventuais observações
  serão notificadas remotamente.

  5.1.5. A operação de aeronaves deve ser realizada de acordo com todos os requisitos regulamentares
  aplicáveis. Ressalta-se que os itens apresentados na presente IS não representam a totalidade
  de itens que podem ser fiscalizados durante uma inspeção de rampa.

  5.1.6. O servidor da ANAC, em atividade de fiscalização, exerce o poder próprio da Autoridade
  de Aviação Civil podendo restringir, em favor do interesse público, direito, bem ou atividade
  individual. [art. 2º e 5º da Lei 11.182/2005]

  5.1.7. Desobedecer ou desacatar servidor público em atividade é crime com pena de multa
  e detenção. [art. 330 e 331 do Código Penal]

  5.1.8. Durante atividade externa de fiscalização, é garantido aos servidores da ANAC, mediante
  apresentação de sua identidade funcional, o acesso a documentos, áreas restritas de aeródromos,
  aeronaves civis em território brasileiro, aeronaves civis brasileiras em qualquer parte,
  bem como a instalações das sociedades empresariais e entidades reguladas pela ANAC. [Art.
  4º da Instrução Normativa ANAC nº 101, de 14 de junho de 2016]

  5.2. Abordagem da aeronave

  5.2.1. O operador, ou o seu representante, será abordado pela equipe de fiscalização da
  ANAC, que se apresentará, identificando outros servidores presentes, e descreverá a finalidade
  e abrangência da inspeção.

  5.2.2. O acesso à aeronave deve ser facilitado pelo operador ou por um representante do
  operador (membro da tripulação ou da manutenção), que deve sempre acompanhar o servidor
  da ANAC durante a realização da inspeção. Também deverá ser facilitado o acesso às partes
  da aeronave, à documentação, aos manuais, aos equipamentos e aos itens de segurança.

  5.2.3. Cabe ao operador ou a seu representante, quando solicitado pelo servidor designado
  da ANAC, manusear as partes da aeronave, a documentação, os manuais, os equipamentos e os
  itens de segurança.

  5.2.4. Os equipamentos e itens operacionais (como extintores ou equipamentos de segurança
  diversos) instalados na aeronave devem ser manuseados por pessoa devidamente habilitada
  e com conhecimento para manuseá-los, designada pelo operador ou pelo seu representante.

  5.2.5. Via de regra, evitar-se-á interferência na operação, priorizando-se a atividade no
  tempo disponível após o desembarque e antes do embarque de passageiros na aeronave. No entanto,
  eventualmente, devido a evidências observadas durante a fiscalização, pode haver a necessidade
  de maiores apurações que podem impactar na operação pretendida.

  5.3. Áreas de atuação da inspeção em rampa

  5.3.1. As áreas gerais de inspeção que serão observadas e avaliadas durante as inspeções
  de rampa são: Pessoal, Aeronave e Procedimentos.

  5.3.2. A área de inspeção “Pessoal” refere-se à documentação de porte obrigatório da tripulação,
  assim como a itens referentes à regulamentação da tripulação e à qualificação e composição
  da tripulação mínima. Neste tópico também é englobado o Mecânico de Manutenção Aeronáutica
  que eventualmente esteja executando atividade de manutenção.

  5.3.3. A área de inspeção “Aeronave” refere-se à aeronave em geral, no que diz respeitos
  aos itens de documentação e manuais requeridos a bordo, equipamentos de voo, equipamentos
  de segurança, equipamentos de emergência e estado geral da aeronave.

  5.3.4. A área de inspeção “Procedimentos” refere-se aos procedimentos realizados pelo operador.

  5.4. Área de inspeção “Pessoal”

  5.4.1. Documento oficial de identificação com foto: os tripulantes devem portar documento
  oficial de identificação com foto.

  5.4.1.1. Conforme determina a Lei nº 12.037, de 1º de outubro de 2009, são considerados
  documentos de identificação oficial (com foto): carteira de identidade; carteira de trabalho;
  carteira profissional; passaporte; carteira de identificação funcional; ou outro documento
  público que permita a identificação.

  5.4.1.2. Alguns documentos de identificação oficial podem ser apresentados em seu formato
  digital, quando assim for permitido pela lei.

  5.4.2. Licenças e habilitações dos pilotos e comissários: os tripulantes devem portar seus
  respectivos documentos de licença e habilitação técnica válidos e em conformidade com a
  operação. Ressalta-se que os documentos atualmente são em formato digital. [Art. 20, III
  da Lei nº 7.565 / RBAC nº 91.5(a)(3) / Portaria SPO nº 2.247 de 02 de setembro de 2020]

  5.4.2.1. Para operações segundo o RBAC nº 103, não é exigida habilitação de piloto emitida
  pela ANAC. Contudo, o operador deverá possuir certidão de cadastro de aerodesportista na
  forma estabelecida pela IS nº 103-001. [RBAC 103.7(a)]

  5.4.3. Certificado médico aeronáutico (CMA): os tripulantes devem possuir certificado médico,
  emitido por entidade homologada para tal, correspondente à classe requerida e válido. O
  CMA não é documento de porte obrigatório pela tripulação.

  5.4.3.1. A restrição de uso obrigatório de lentes corretivas requer que o tripulante disponha
  de um segundo par de óculos, mesmo que use lentes de contato. [CMA de 1ª Classe - RBAC nº
  67.99 (g)(4); CMA de 2ª Classe - RBAC nº 67.139(g)(4); CMA de 5ª Classe - RBAC nº 67.259(g)(4)]

  5.4.4. Licenças dos Mecânicos de Voo e/ou Despachantes Operacionais de Voo atendendo a aeronave:
  os mecânicos de voo e/ou despachantes devem portar suas licenças, com os respectivos documentos
  de habilitação técnica requeridos e em conformidade com a operação. [RBAC nº 63.19(a) /
  65.51(b)]

  5.4.5. Licenças dos Mecânicos de Manutenção Aeronáutica: os mecânicos devem possuir a habilitação
  técnica requerida e em conformidade com a atividade de manutenção realizada. [RBAC nº 65.81
  / 65.85 / 65.87 / 65.88 / 65.89]

  5.4.6. Tripulação mínima requerida: a aeronave deve ser operada com a tripulação mínima
  requerida no respectivo Certificado de Aeronavegabilidade (CA) ou Certificado de Autorização
  de Voo Experimental (CAVE) e em conformidade com a operação. [RBAC nº 91.5(a)(1)]

  5.4.6.1. Para aeronaves que voam sob as regras do RBAC nº 91, exceto Subparte K, em operação
  IFR - São exigidos 2 pilotos qualificados IFR em aeronaves com configuração para passageiros
  com 10 ou mais assentos e em aeronaves sem piloto automático (PA) com configuração para
  passageiros com 9 ou menos assentos para passageiros.

