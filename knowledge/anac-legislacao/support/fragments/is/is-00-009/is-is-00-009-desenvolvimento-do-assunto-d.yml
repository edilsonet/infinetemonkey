text: 'd) para operações Categoria II. [RBAC nº 91.1049(d)(4) / RBAC nº 135.111]

  5.4.6.3. Somente é permitido operar um avião regido pelas Subpartes F e K do RBAC nº 91
  ou uma aeronave sob o RBAC nº 135, que tenha a bordo mais de 19 passageiros, se a aeronave
  possuir um comissário de voo para cada grupo de passageiros composto por no máximo 50 pessoas.
  [RBAC nº 91.533 / RBAC nº 135.107]

  5.5. Áreas de inspeção “aeronaves”

  5.5.1. Com o objetivo de organizar a inspeção, a avaliação da aeronave é dividida em três
  áreas: documental, inspeção interna e externa.

  5.5.2. Inspeção documental.

  5.5.2.1. Certificado de matrícula (CM) / certificado de marca experimental (CME) / Certidão
  de Cadastro de Equipamento.

  5.5.2.1.1 Aeronaves, operando segundo o RBAC nº 91 e RBAC nº 135, devem possuir a bordo
  o certificado de matrícula (CM) válido, emitido pela ANAC em nome do operador. [RBAC nº
  91.203(a)(1) / RBAC nº 135.3(a)(1)]'
