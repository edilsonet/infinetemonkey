text: '1. Sub ProtocolarData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  Estágio 3: Extra Protocolar - O operador neste estágio 3 de maturidade trabalha de forma
  a integrar

  diversos processos de CRM e de gestão de segurança, a filosofia de CRM permeia toda a organização

  fazendo parte da cultura de segurança. A organização entende e trabalha para manter elevada
  a qualidade

  dos facilitadores e do treinamento, investindo em atualizações destes de forma específica.
  A organização

  entende o valor do LOFT para seus pilotos e trabalha para garantir este treinamento mais
  do que é

  requerido. Tipicamente, tal organização demonstrará uma combinação dessas características:

  - Processos de CRM e de gestão da segurança com interfaces visando a retroalimentação dos

  mesmos

  - Treinamentos de CRM que agregam especificidade conforme os níveis estratégico, tático
  e

  operacional. No nível operacional incorporam treinamentos em LOFT, utilizam

  apropriadamente métodos tais como TEM e NOTECHS

  - Todos os envolvidos na gestão do PCRM sabem seu papel, formalmente atribuído, e executam

  suas funções coordenadamente e pro ativamente

  - A organização seleciona facilitadores experientes além de atenderem os critérios básicos

  (operacional e/ou especialista em fatores humanos)

  - Tripulantes implementam rotineiramente as técnicas aprendidas de gestão de erros e

  ameaças, briefings, forte aderência aos procedimentos padronizados. Sugerem mudanças em

  procedimentos mal escritos ou mal planejados, e os níveis de gestão os analisam sob o

  enfoque dos fatores humanos

  Estágio 4: Desenvolvimento Contínuo - Neste estágio o operador aéreo compreende e valoriza
  todos os

  aspectos do PCRM despendendo esforços contínuos de integração como atividade sensível de
  segurança

  operacional. Tipicamente, tal operador demonstrará uma combinação dessas características:

  - Gestão dos processos pertinentes ao PCRM faz parte das atividades gerenciais, das

  responsabilidades e das análises de desempenho humano

  - Ampla aceitação da filosofia de CRM em todos os níveis organizacionais compondo a cultura

  de segurança

  - Treinamentos baseados em evidências (EBT - Evidence Based Training)

  - Adoção de análise de necessidade de treinamento para a gestão do processo de atualização

  contínua dos facilitadores

  - O documento PCRM tem qualidade, e é baseado fortemente em análise de dados de

  segurança, é vivo, reflete e incorpora resultados da gestão de mudanças

  O modelo aborda cinco eixos críticos (elementos chave) para o sucesso do PCRM

  - Integração dos níveis estratégico, tático e operacional da organização

  - Integração do CRM com sistemas de gestão de segurança

  - Qualidade do PCRM (documento)

  - Seleção e capacitação dos facilitadores

  - Implementação do treinamento de CRMData de emissão: 6 de março de 2025. IS nº 00-010

