title: Comunicar-se clara e objetivamente em todos os meios e canais inspirando
text: '2. Comunicar-se clara e objetivamente em todos os meios e canais inspirando

  confiança.

  Indicadores de

  desempenho

  aceitáveis

  - Comunicação é tempestiva e atende às necessidades dos

  interlocutores;

  - Usa técnicas de questionamento variadas com o objetivo de

  promover a discussão do assunto ou gerar uma resposta;

  - Ouve e responde educadamente mesmo em situações

  desafiadoras;

  - Passa as informações claramente ao interlocutor e verifica se a

  compreensão correta ocorreu;

  - Gerencia conflitos fazendo uso de técnicas adequadas de

  comunicação;

  - Adapta estilo e tom para atender a determinada ocasião ou

  público;

  - Realiza feedbacks estruturados, claros e objetivos.

  Indicadores de

  desempenho não

  aceitáveis

  O requerido nível de habilidades de comunicação para desempenhar o

  papel/a função não é demonstrado

  - Faz uso de poucas técnicas de questionamento e em decorrência

  não é capaz de obter resposta detalhada;

  - Quando desafiado reage ou responde de forma inapropriada;

  - Gera entendimento errôneo ou confusão por ficar calado ou por

  faltar clareza na comunicação;

  - Demonstra pouca confiança. Responde de forma hesitante,

  desestruturada ou confusa.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B'
