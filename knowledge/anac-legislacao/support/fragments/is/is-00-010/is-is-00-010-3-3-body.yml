title: O meio ou procedimento alternativo mencionado no item 3.2(b) desta IS deve garantir
text: '3.3 O meio ou procedimento alternativo mencionado no item 3.2(b) desta IS deve garantir

  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.'
