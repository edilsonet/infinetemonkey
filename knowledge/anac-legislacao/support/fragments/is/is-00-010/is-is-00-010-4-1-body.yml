title: Para efeitos desta instrução, são válidas as definições listadas no RBAC n° 01 e as
text: '4.1 Para efeitos desta instrução, são válidas as definições listadas no RBAC n° 01
  e as

  apresentadas a seguir:

  Curso de Padronização de Instrutores. Significa um curso cujo objetivo é padronizar

  o uso de métodos e técnicas de ensino-aprendizagem apropriadas ao ensino de adultos,

  visando implementar ações de treinamento e de facilitação da aprendizagem. Esse curso

  deve proporcionar aos participantes uma aprendizagem relativa: ao emprego apropriado

  das técnicas de comunicação verbal e não-verbal no processo educativo; ao

  desenvolvimento do papel de facilitador/mediador em dinâmicas de grupo e exercícios

  orientados; ao manejo de turma; à preparação e implementação de atividades de

  treinamento e à avaliação contínua da aprendizagem. O curso é um pré-requisito para os

  candidatos a facilitadores de CRM.

  Desempenho humano. Significa capacidades e limitações do ser humano as quais têm

  impacto na segurança e eficiência de operações aeronáuticas (RBAC n° 01).

  Facilitador de CRM. Significa o profissional capacitado, de acordo com os critérios

  estabelecidos nesta IS, para introduzir e consolidar, por meio dos treinamentos de CRM,

  os conceitos e a filosofia de CRM dentro de uma estrutura organizacional. Vide Glossário

  nesta IS para mais informações.

  Fatores Humanos. É um campo multidisciplinar que incorpora os métodos e princípios

  das ciências sociais e do comportamento, engenharia e fisiologia, voltado para otimizar
  o

  desempenho humano e reduzir o erro humano em um sistema complexo.

  Filosofia de CRM. A filosofia de CRM assume que cada membro de equipe é passível

  de falhas e que os erros e as ameaças devem ser gerenciados pela equipe mediante uso de

  comunicação efetiva, checklists, procedimentos padronizados, cooperação,

  monitoramento e crosschecks contínuos. A filosofia de CRM estabelece que os níveis

  superiores da administração devem ser modelos e propagadores da cultura de segurança

  fundamentada no CRM, a fim de prevenir falhas latentes na organização. A filosofia de

  CRM pressupõe que os treinamentos de CRM incluam uma série de métodos, técnicas e

  objetivos voltados para o aprimoramento das habilidades não técnicas das equipes, a fim

  de obter um melhor trabalho de equipe no gerenciamento das ameaças e dos erros para

  assegurar operações seguras e eficientes.

  Instrutor. Significa, em alguns casos, a pessoa capacitada para ministrar aula no

  Treinamento para Facilitador de CRM ou o instrutor/examinador piloto nos casos de

  LOFT. O termo facilitador de CRM é empregado quando o instrutor também é um

  facilitador de CRM. É recomendado que todos os instrutores LOFT sejam também

  facilitadores de CRM.

  Gerenciamento de Recursos de Equipes (CRM). Significa a aplicação sistemática do

  conhecimento em fatores humanos, que visa aperfeiçoar a coordenação e a comunicaçãoData
  de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  de equipes, promovendo operações seguras decorrentes do uso eficiente de todos os

  recursos disponíveis (humanos, materiais, tecnológicos e da informação). Nesta IS, a sigla

  CRM significa tanto o treinamento da tripulação (crew) quanto corporativo (corporate).

  Política de Fatores Humanos/CRM. Significa a formalização e divulgação das

  diretrizes relacionadas ao gerenciamento dos recursos humanos envolvidos direta e

  indiretamente com a filosofia de CRM, devendo ser endossada pelo gestor da

  organização. Visa demonstrar comprometimento e integração dos temas relacionados aos

  fatores humanos a fim de melhorar o desempenho individual e das equipes.

  Princípios de Fatores Humanos. Significam os princípios que se aplicam ao projeto,

  certificação, treinamento, operações e manutenção aeronáuticos e que busquem a

  interface segura entre as pessoas e outros componentes do sistema pela consideração

  adequada do desempenho humano (RBAC n° 01).'
