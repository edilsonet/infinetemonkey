title: DESENVOLVIMENTO
text: '4. DESENVOLVIMENTO

  CONTÍNUO

  - Os três níveis

  são integrados

  e

  retroalimentad

  os, de forma

  dinâmica.

  - Existe

  integração entre

  o CRM e os

  sistemas de

  gestão de

  segurança, que

  se alimentam

  mutuamente.

  - PCRM é

  continuamente

  aperfeiçoado

  como resultado

  da gestão dos

  outros

  elementos

  chave neste

  estágio

  - O operador aéreo gerencia os

  processos de seleção,

  treinamento e atualização

  prevendo necessidades

  específicas da organização e do

  indivíduo.

  - O operador atende as

  demandas de atualização

  requerida pelos facilitadores,

  após análise de pertinência

  - Treinamento é

  desenvolvido pelo

  método Evidence

  Based Training (EBT,

  Doc 9995).

  3.EXTRA

  PROTOCOLAR

  - Há

  treinamento

  para os três

  níveis, os quais

  são

  coordenados

  entre si.

  - Existe interface

  entre o CRM e

  outros sistemas

  de segurança,

  além do SGSO.

  - O PCRM

  apresenta base

  científica

  robusta em seu

  planejamento e

  desenvolviment

  o.

  - O processo de seleção atende à

  necessidade de treinamento do

  público-alvo, equilibrando os

  perfis dos facilitadores

  (operacionais e fatores

  humanos)

  - Seleciona facilitadores

  experientes,

  - Treinamento excede os

  mínimos da IS

  - Atualização dos facilitadores

  supera a quantidade

  estabelecida na IS (+24h/2anos)

  - Operador garante

  que os profissionais

  destacados para o

  treinamento,

  avaliação e validação

  são facilitadores

  experientes na

  função.'
