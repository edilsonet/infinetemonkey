cite: 5.1(f)
title: 5.1(f)
text: 'f) customização à luz do seu público-alvo, em consonância com as necessidades de

  treinamento para atendimento da política de fatores humanos/CRM da empresa,

  considerando-se os níveis estratégico, tático e operacional.

  A aplicação do CRM na modalidade corporate significa adicionar outros segmentos da

  organização que podem impactar a operação, gerando falhas latentes que venham a

  vulnerabilizar o sistema. Esta versão corporate deve ser capaz de atender as necessidades

  de treinamento do pessoal operacional e dos que não têm função direta nas operações.

  Cabe ao operador aéreo decidir, com base na avaliação da necessidade de treinamento, se

  a versão Cockpit ou Crew Resource Management será disponibilizada para um segmento

  específico do público-alvo, em vez da versão Corporate. A segmentação tem sido eficaz

  para atender demandas específicas de determinado grupo, incluindo treinamento de

  transição e de elevação de nível, dentre outros requeridos que se beneficiem de uma

  versão mais específica do CRM, incluindo as versões MRM ou DRM.

  Nota: a necessidade de um CRM segmentado pode indicar uma ou mais deficiências

  organizacionais, como a falta de pessoal ou a sobrecarga de trabalho para planejar e

  implementar corretamente o CRM Corporate para os variados tipos de participantes. O

  CRM segmentado não pode ser aplicado como única estratégia, todos os anos, já que os

  participantes precisam experimentar esse treinamento com componentes de diferentes

  setores que se complementam para assegurar operações aéreas eficientes e seguras.

  O programa de treinamento de CRM deve ser constantemente avaliado visando a

  melhoria contínua, conforme orientado nas seções 5.5 - Avaliação e Validação dos

  Programas de CRM e 5.8 - Estágio de Maturidade do Operador Aéreo quanto ao CRM,

  desta IS.'
