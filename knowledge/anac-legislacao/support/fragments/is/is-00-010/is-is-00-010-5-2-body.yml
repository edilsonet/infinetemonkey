text: '5.2 FUNDAMENTOS DO TREINAMENTO DE CRMData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  Conhecimento do contexto organizacional antes da implantação do treinamento de

  CRM

  Antes de programar o treinamento de CRM é necessário que a organização conheça seu

  próprio contexto de atuação no que diz respeito à filosofia de CRM. Uma das formas de

  se adquirir tal conhecimento é por meio do diagnóstico de cultura organizacional, com

  ênfase na cultura de segurança (DCO - vide Glossário), o qual pode fornecer informações

  essenciais para o planejamento, aplicação e manutenção do programa de CRM (PCRM).'
