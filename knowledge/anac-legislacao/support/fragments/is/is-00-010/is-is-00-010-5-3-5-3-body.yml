title: A carga horária estimada é de 4 (quatro) horas-aula para que os elementos curriculares
text: '5.3.5.3 A carga horária estimada é de 4 (quatro) horas-aula para que os elementos curriculares

  mínimos sejam administrados (veja Quadro 1). As disciplinas relacionadas à fadiga e ao

  uso de substâncias psicoativas não devem ser resumidas ao objetivo e aplicabilidade dos

  ementas apresentadas nos itens 5.7.17.10 e 5.7.17.11.

  Treinamento de Facilitadores de CRM'
