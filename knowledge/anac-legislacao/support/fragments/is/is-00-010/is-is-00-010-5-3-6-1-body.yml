title: Este treinamento é presencial e deve ser ministrado por facilitadores de CRM,
text: '5.3.6.1 Este treinamento é presencial e deve ser ministrado por facilitadores de CRM,

  preferencialmente por uma equipe, de forma a haver complementação de experiência e

  conhecimento para didaticamente abarcar todo o programa do curso.'
