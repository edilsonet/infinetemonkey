section_title: TREINAMENTOS DE CRM
subsection_id: h
cite: 5.3(h)
title: 5.3(h)
text: 'h) À critério da empresa, o participante poderá acessar o AVA em horários e locais
  de

  sua preferência.

  5.3.2.3. A primeira fase requer a disponibilização do material impresso ou virtual para
  os

  participantes, contendo as disciplinas tratadas, os objetivos instrucionais, a definição
  de

  termos abordados, e um resumo de cada disciplina, devendo ser organizado em uma

  sequência lógica. Recomenda-se que os conceitos presentes no Quadro 1 desta IS sejam

  apresentados de forma visual e textualmente acessíveis, para que o objetivo de oferecer

  uma abordagem conceitual comum aos participantes seja cumprido.

  2ª FASE - Prática

  5.3.3.1. A fase prática em CRM é presencial e poderá ser realizada em sala de aula, em simulador

  de voo (Treinamento Orientado para Operações em Rota - LOFT), em cockpit, ou em

  outros tipos de dispositivos de treinamento, para que os elementos de CRM aprendidos

  na 1ª fase possam ser aplicados e analisados por meio da técnica do feedback (crítica).

  Vide glossário para Line-Oriented Flight Training.

  5.3.3.2. As empresas reguladas pelo Regulamento Brasileira de Aviação Civil - RBAC n° 121

  deverão realizar a fase prática dos seus pilotos por meio do LOFT. O LOFT é uma

  oportunidade para cada membro de equipe e para o instrutor-facilitador analisarem seu

  desempenho durante o treinamento. Observar itens 5.5.5 e 5.5.6 desta IS.

  5.3.3.3. A fase prática realizada em sala de aula deve oportunizar aos participantes exercícios

  práticos (dinâmicas de grupo, dramatizações, simulações de papéis, estudos de caso e

  outras técnicas), com o objetivo de desenvolver estratégias para lidar com situações de

  rotina e de emergência, possibilitando uma análise a posteriori dos comportamentos

  evidenciados durante o treinamento.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  5.3.3.4. O número de participantes nesta 2ª Fase não deve exceder 20 (vinte) e nem ser inferior
  a

  2 (dois). Exceção feita para o SRM - Single-Pilot Resource Management, quando o

  treinamento poderá ser realizado somente com 1 (um) piloto.

  5.3.3.5. A fase prática deve consistir em ao menos 4 (quatro) horas consecutivas, e ocorrer
  em um

  prazo não superior a 6 (seis) meses do término da 1ª fase. No caso do LOFT, adicionam-

  se 2 (duas) horas para briefing e debriefing à carga horária mínima, totalizando 6 (seis)

  horas.

  3ª FASE - Periódico

  5.3.4.1. A 3ª fase do treinamento de CRM é presencial e não se caracteriza como um momento

  pontual. Após concluídas a primeira e a segunda fases, o aprimoramento do

  conhecimento, habilidades e atitudes de CRM deve ser continuado. O desenvolvimento

  contínuo é requerido para que as habilidades não técnicas possam ser compreendidas e

  incorporadas ao repertório comportamental de cada membro de equipe, respeitando-se o

  estilo de cada um. Os métodos e técnicas do treinamento de CRM colaboram para o

  desenvolvimento de competências efetivas para a segurança das operações aéreas. Os

  modelos de fatores humanos (SHELL, Reason, TEM, HFACS, PEAR, dentre outros) são

  reapresentados em forma de estudos de caso e exercícios orientados, conforme

  pertinência.

  5.3.4.2. Nesta fase, o treinamento deve incluir no mínimo 08 (oito) horas-aula ao ano, ou
  16

  (dezesseis) horas-aula a cada dois anos. Os operadores devem se concentrar nos pontos

  críticos à sua operação, e graduar o nível de aprofundamento necessário ao contínuo

  desenvolvimento das competências de CRM dos participantes, utilizando os dados

  obtidos a partir do SGSO e pesquisas formais e informais que indiquem necessidades

  específicas de treinamento. Não é preciso que todos os elementos curriculares sejam

  trabalhados, porém estes devem ser cobertos em um período de 3 (três) anos.

  5.3.4.3. Recomenda-se leitura prévia de material apropriado para esta fase. O material didático

  pode ser disponibilizado sob diferentes formas, a critério do operador.

  5.3.4.4. Esta fase deve desenvolver o conhecimento, as habilidades e as atitudes dos participantes

  relativas ao CRM no contexto do operador, de acordo com os dados de segurança

  coletados e analisados à luz do campo dos Fatores Humanos.

  5.3.4.5. A qualidade desta fase depende da atualização contínua do programa de treinamento
  de

  CRM (PCRM). A relevância deste programa é realçada quando os eventos de segurança

  ocorridos na empresa são integrados ao treinamento sob a forma de estudos de caso. A

  partir de estudos de caso, os tripulantes são alertados sobre as ameaças e experiência de

  terceiros. Assim, e mais importante, o treinamento de CRM se torna uma via de

  compartilhamento das contramedidas de segurança que foram bem-sucedidas naquele

  ambiente operacional estudado.

  5.3.4.6. O operador deverá demonstrar à ANAC que a proposta de treinamento atinge aos

  objetivos esperados desta fase, observando-se a carga horária mínima prevista nessa

  seção. Sessões LOFT como parte dos treinamentos periódicos dos pilotos,Data de emissão:
  6 de março de 2025. IS nº 00-010

  Revisão B

  complementarmente às instruções em sala de aula, é uma forma de cumprimento aceitável

  desta fase.

  5.3.4.7. Cenários sugeridos para essa fase: atrasos de voo, procedimentos de emergência,
  briefing

  e debriefing, conceito de sterile cockpit, procedimentos pré-decolagem e notificação de

  pouso, consulta e análise de documentos pré-voo (MEL, METAR e outros),

  procedimentos de turbulência e mau tempo, problemas médicos a bordo, cheque externo

  da aeronave, peso e balanceamento da aeronave, entre outros.

  5.3.4.8. O número de participantes nesta 3ª Fase não deve exceder 20 (vinte) e nem ser inferior
  a

  2 (dois) se transcorrer em sala de aula. Exceção feita para o SRM - Single Pilot Resource

  Management, quando o treinamento poderá ser realizado somente com 1 (um) piloto.

  CRM para Cargos de Direção requeridos (RBAC nº 119)'
