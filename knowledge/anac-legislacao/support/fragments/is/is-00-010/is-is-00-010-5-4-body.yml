  A implementação do Quadro 1 deverá ser adequada conforme o ambiente operacional.

  Os operadores aéreos cujas operações envolvam tripulações de apenas um piloto deverão

  utilizar a abordagem Single Pilot Resource Management - SRM, cuja filosofia centra-

  se no desenvolvimento de habilidades de pensamento crítico e de gerenciamento do voo,

  objetivando a tomada de decisão tempestiva e oportuna, como prevenção de acidentes.

