text: '5.6 PROGRAMA DE TREINAMENTO DE CRM (PCRM)

  O operador aéreo deve submeter o PCRM para aprovação da ANAC como parte do

  Programa de Treinamento da organização.

  O operador aéreo deve indicar expressamente o setor responsável pela gestão do PCRM,

  respeitando-se o parágrafo 5.2.1.5 desta IS, e deve definir o Coordenador do PCRM na

  empresa.

  A designação formal do(s) facilitador(es) de CRM por parte do operador aéreo é condição

  necessária para o exercício da função. Este documento deve ser mantido no arquivo (file)

  do profissional ou deve constar no Programa de CRM (PCRM).

  Os operadores devem construir seu programa de treinamento para atender à cultura e aos

  padrões operacionais da empresa. No Quadro 2 o conteúdo de um PCRM é apresentado;

  contudo, cabe aos operadores adequarem esse modelo às suas particularidades.

  Quadro 2 - PROGRAMA DE TREINAMENTO DE CRM - PCRM

  SEÇÃO 01 Termo de aprovação, controle de revisões e de distribuição

  SEÇÃO 02 Identificação do operador aéreo e responsabilidades atribuídas

  SEÇÃO 03 Política de Fatores Humanos/CRM

  SEÇÃO 04 Regulamentação aplicável, apresentação e público-alvo

  SEÇÃO 05 Gerenciamento do PCRM

  SEÇÃO 06 Manual de CRM (pode ser um documento à parte)

  SEÇÃO 07 Apêndices e Anexos

  Detalhamento das seções apresentadas no Quadro 2:'
