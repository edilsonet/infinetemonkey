title: 5.7.17.10(b)
text: 'b) Identificação de sinais de fadiga nos membros da equipe e em si mesmo e

  estratégias de monitoramento do desempenho para apoiar a decisão sobre a

  distribuição da carga de trabalho. O gerenciamento da carga de trabalho, que pode

  variar dependendo do contexto operacional.'
