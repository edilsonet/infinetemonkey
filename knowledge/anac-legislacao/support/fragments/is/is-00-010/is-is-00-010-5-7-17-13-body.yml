text: '5.7.17.13 Aprendizagem e técnicas de facilitação. No ambiente de aprendizagem da aviação,
  a

  facilitação se refere a um conjunto de técnicas de que um instrutor faz uso para auxiliar
  o

  grupo na análise de questões, na aprendizagem a partir da experiência, e no trabalho como

  uma equipe para se chegar às conclusões.'
