title: 5.7.17.13(e)
text: 'e) Apresentação de métodos e técnicas de avaliação e desenvolvimento da própria

  prática de facilitador de CRM.

  Nota: essa disciplina tem previsão de carga horária no APÊNDICE H - Modelo de

  Programação para a Parte Teórica do Treinamento para Facilitador de CRM,

  especificamente no quarto dia do curso. Para ser elegível ao treinamento para facilitador

  de CRM, o candidato precisa atender ao pré-requisito definido no parágrafo 5.7.10 desta

  IS. Não se espera que a carga horária do treinamento para facilitador de CRM seja

  utilizada com técnicas de plataforma, as quais o candidato já deve possuir conhecimento

  e experiência anterior.'
