cite: 5.7.17.14(a)
title: 5.7.17.14(a)
text: 'a) Os três relatórios de observação devem ser preenchidos pelo candidato a facilitador

  que observou o treinamento. Os relatórios devem ser assinados pelo candidato, pelo

  facilitador que ministrou o treinamento e pelo responsável do operador aéreo,

  conforme Apêndice F.'
