text: 'e) A validação do treinamento de CRM e seu impacto na evolução dos índices de

  segurança operacional e da cultura de segurança.

  Processo avaliativo. A frequência para aprovação na parte teórica deverá ser de 100%.

  Casos de força maior deverão ser analisados pelo coordenador, sendo o motivo daData de emissão:
  6 de março de 2025. IS nº 00-010

  Revisão B

  ausência registrado no arquivo (file) do candidato. Nestes casos a frequência não poderá

  ser menor do que 80%.

  Uma avaliação individual abrangente (contendo todas as disciplinas estudadas) destinada

  a verificar a efetividade da aprendizagem deverá ser aplicada ao final do treinamento,

  contendo tanto questões discursivas quanto objetivas. A aprovação ocorre a partir de 80%

  de aproveitamento.

  Nota: é possível haver consultas ao material didático usado no curso durante a avaliação.

  Neste caso, deve-se incluir questões dissertativas de maior dificuldade.

  Certificados de conclusão da parte teórica. Somente serão considerados válidos os

  certificados emitidos por pessoa jurídica e assinados pelo responsável do operador aéreo

  e pelo coordenador técnico do curso. Os certificados devem conter as seguintes

  informações:'
