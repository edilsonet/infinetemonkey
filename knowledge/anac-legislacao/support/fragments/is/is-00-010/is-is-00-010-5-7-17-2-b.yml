text: 'b) Análise do conteúdo desta IS compreendendo a filosofia dos treinamentos de CRM

  no âmbito da aviação civil, o compromisso da alta gestão, a customização do

  treinamento, as características e os significados das fases, os elementos curriculares

  mínimos, a avaliação e a validação do treinamento, a capacitação dos facilitadores,

  o programa de treinamento de CRM, e demais responsabilidades dos operadores

  aéreos no gerenciamento do programa de treinamento de CRM.'
