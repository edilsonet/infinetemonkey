cite: 5.7.17.3(b)
title: 5.7.17.3(b)
text: 'b) Estimular, especialmente para os novos copilotos na função de Pilot Monitoring

  (PM), uma atitude positiva em relação ao monitoramento e ao uso adequado da

  técnica de questionamento (questioning, inquiry) frente a falhas ou ações cometidas

  pelo Pilot Flying (PF) que requerem esclarecimento. O treinamento deve enfatizar

  que o questionamento adequado é promovido como um comportamento de CRM

  desejado, e que não haverá consequências adversas se um piloto questionar

  adequadamente a decisão ou ação de outro piloto. Da mesma forma, o treinamento

  para comandantes deve aprimorar a habilidade de transmitir e receber informações

  e perguntas sobre erros e desvios de maneira adequada, sendo um comportamento

  de CRM desejável.'
