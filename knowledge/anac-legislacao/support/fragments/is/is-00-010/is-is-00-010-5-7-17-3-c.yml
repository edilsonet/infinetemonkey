title: 5.7.17.3(c)
text: 'c) Demonstração de modelos operacionais de processo de tomada de decisão de grupo.

  As equipes podem se referir a esses modelos para fazerem boas escolhas em

  situações em que a informação é incompleta ou contraditória. Estudo da

  assertividade e a relação entre nível de risco e grau de assertividade, que inclui

  intervenção oportuna e tempestiva em caso de desvio.'
