title: 5.7.17.8(a)
text: 'a) A compreensão da mudança da natureza do trabalho do tripulante em função da

  crescente automação nas aeronaves; identificação de atividades relacionadas ao

  monitoramento: da automação, da trajetória de voo, do outro piloto que compõe a

  tripulação.'
