title: Automação e Monitoramento. A crescente automação das aeronaves civis exige novas
text: '5.7.17.8 Automação e Monitoramento. A crescente automação das aeronaves civis exige
  novas

  habilidades gerenciais por parte dos tripulantes para a manutenção da segurança

  operacional. É importante o conhecimento das limitações humanas relativas ao

  monitoramento contínuo, e da mesma forma é preciso identificar os diferentes tipos de

  sistema de automação (dos modelos operados) para melhor gerenciá-los.'
