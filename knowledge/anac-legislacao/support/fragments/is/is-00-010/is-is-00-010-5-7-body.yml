title: desta IS.
text: '5.7 desta IS.

  FADIGA: Fadiga significa um estado fisiológico de redução de capacidade de desempenho físico

  e/ou mental resultante do débito de sono, vigília estendida, desajustes dos ritmos

  circadianos, alterações do ciclo vigília-sono e/ou carga excessiva de trabalho (mental e/ou
  física) que

  podem prejudicar o nível de alerta e a habilidade de uma pessoa executar atividades relacionadas
  à

  segurança operacional. Outra definição: Diminuição progressiva da habilidade do ser humano
  para

  realizar uma atividade determinada, que pode se manifestar através da deterioração da qualidade
  do

  trabalho, imprecisão, desinteresse, tédio, falta de entusiasmo, apatia entre outros.

  HABILIDADES: capacidade de fazer uso produtivo do conhecimento, ou seja, utilizá-lo em uma

  ação. O termo costuma ser associado à qualidade da ação, saber fazer, fazer algo bem.

  HABILIDADES NÃO TÉCNICAS: são definidas como as habilidades cognitivas, sociais e de

  autogerenciamento, que complementam as habilidades técnicas dos tripulantes, e contribuem
  para a

  segurança operacional e para o desempenho eficaz de tarefas. Estão incluídas nesse conjunto,
  ao

  menos, as habilidades de manutenção da consciência situacional, tomada de decisão, trabalho
  em

  equipe, liderança, gerenciamento do estresse e gerenciamento da fadiga.

  INCIDENTES AERONÁUTICOS: significa uma ocorrência aeronáutica, não classificada como um

  acidente, associada à operação de uma aeronave, que afete ou possa afetar a segurança da
  operação.

  INCIDENTES AERONÁUTICOS GRAVES: incidente aeronáutico envolvendo circunstâncias que

  indiquem que houve elevado risco de acidente relacionado à operação de uma aeronave que,
  no caso

  da aeronave tripulada, ocorre entre o momento em que uma pessoa nela embarca, com a intenção
  e

  realizar um voo, até o momento em que todas as pessoas tenham dela desembarcado; ou, no
  caso de

  uma aeronave não tripulada, ocorre entre o momento em que a aeronave está pronta para se

  movimentar, com a intenção de voo, até a sua parada total pelo término do voo, e seu sistema
  de

  propulsão tenha sido desligado.

  LINE-ORIENTED FLIGHT TRAINING - LOFT (Treinamento Orientado para Operações em Rota):

  refere-se ao treinamento de tripulantes em simuladores de voo, que envolve uma simulação
  completa

  de situações que são representativas das operações de linha, com ênfase especial em situações
  que

  envolvem comunicações, gerenciamento e liderança. A 2ª Fase do CRM (RBAC n° 121), que aplica,

  em simulador de voo, os conceitos aprendidos durante a 1ª Fase.

  LINE ORIENTED SAFETY AUDITY - LOSA (Auditoria de Segurança Operacional das Operações

  de Linha): ferramenta organizacional voltada para a prevenção, usada para identificar ameaças
  na

  aviação, com o objetivo de minimizar os riscos que tais ameaças possam gerar e implementar
  medidas

  para o gerenciamento do erro humano no contexto operacional. Uma técnica de coleta de dados
  de

  observação comportamental, que visa capturar dados sobre o desempenho das tripulações de
  voo

  durante as operações normais.

  MODELO HFACS: o Sistema de Análise e Classificação de Fatores Humanos (HFACS) foi

  desenvolvido pelo Dr. Scott Shappell e pelo Dr. Doug Wiegmann (2000). O HFACS descreve os
  maisData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  frequentes erros humanos encontrados nos acidentes estudados, em cada um dos quatro níveis
  de

  falhas descritos por James Reason em seu modelo: atos inseguros (erros e violações), precondições

  para atos inseguros, supervisão insegura e influências organizacionais.

  MODELO PEAR: modelo muito usado para a identificação e o gerenciamento dos elementos de

  Fatores Humanos no ambiente de manutenção aeronáutica. As categorias conceituais formam
  o

  acrônimo PEAR: People (pessoas envolvidas no trabalho); Environment (ambiente do trabalho);

  Actions (ações que as pessoas desempenham); e Resources (recursos necessários para que o
  trabalho

  seja feito).

  MODELO REASON: o conceito de acidente organizacional foi aceito pela indústria aeronáutica

  devido, em parte, à contribuição do modelo de James Reason, ou como é mundialmente conhecido
  -

  Modelo do queijo suíço. Reason argumenta que os acidentes decorrem das falhas latentes,
  não

  detectadas e do alinhamento destas com as falhas ativas (erros e violações dos operadores)
  e com as

  defesas que falham no momento final que antecede ao acidente. As fatias do queijo ilustram
  as

  barreiras de defesas e os furos representam fraquezas em partes diferenciadas do sistema,
  que variam

  continuamente em dimensão e posição em todas as fatias. Neste modelo o autor defendeu que
  na

  maioria dos acidentes pode-se rastrear um ou mais de quatro níveis organizacionais de falhas:

  influências organizacionais, supervisão insegura, pré condições para atos inseguros, e os
  próprios atos

  inseguros (= falhas ativas = erros ou violações).

  MODELO SHELL: O modelo SHELL é uma abordagem conceitual de Fatores Humanos proposta

  na Circular 216-AN31 da ICAO. O modelo SHELL é um diagrama prático que ilustra os diferentes

  componentes de Fatores Humanos, sendo seu nome derivado das letras iniciais de cada componente.

  Ele ilustra as quatro (4) principais categorias conceituais e suas interfaces: Liveware
  (o elemento

  humano); Software (procedimentos, manuais, simbologia, cartas aeronáuticas etc.); Hardware

  (equipamento, disposição do local de trabalho e seus aspectos ergonômicos etc.); e Environment

  (tanto o ambiente interno como o externo ao trabalho). O elemento central, o elemento humano
  -

  liveware ¬ possui quatro principais tipos de interação: liveware-software - o elemento humano
  e o

  suporte lógico, incluindo normas, manuais, procedimentos, cartas aeronáuticas etc; liveware-

  hardware - o elemento humano e as máquinas, incluindo todos os equipamentos e seus aspectos

  ergonômicos; liveware-environment - o elemento humano e o meio ambiente, incluindo fatores

  internos e externos ao local de trabalho; e liveware-liveware - o elemento humano e outros
  seres

  humanos, incluindo os membros de equipe. O ambiente (E) sendo a situação na qual o sistema
  L-H-

  S tem que funcionar. Neste modelo, a compatibilidade ou incompatibilidade dos blocos (interface)
  é

  tão importante quanto as características dos próprios blocos. Uma incompatibilidade pode
  ser uma

  fonte de erro humano.

  MONITORAMENTO: o monitoramento é o comportamento e as habilidades usados pelos pilotos

  para manter sua própria "visão geral" através da verificação cruzada (cross check) das ações
  uns dos

  outros e da observação diligente da trajetória de voo, dos sistemas de aeronaves e dos modos
  de

  automação. O monitoramento eficaz é uma importante barreira de segurança na prevenção e

  recuperação dos incidentes relacioandos à perda de controle da aeronave. A alteração do
  termo Pilot

  Not Flying (PNF) para Pilot Monitoring (PM) ocorreu justamente para se realçar o que o piloto

  precisa fazer em vez daquilo que ele não está fazendo, salientando as atividades de monitoramento

  do piloto que não está pilotando a aeronave. Desta forma, na cabine de comando, o Pilot
  Monitoring

  (PM) monitora o estado da aeronave e os dados dos sistemas, realiza os call outs diante
  de desviosData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  ao plano de voo pretendido e intervém se necessário; enquanto o Piloto Flying (PF) controla
  a

  aeronave em qualquer momento, durante o voo e em solo.

  MOTIVAÇÃO: estado interno que tem origem em uma necessidade da pessoa e que move o seu

  organismo, direcionando o comportamento para objetivos que possam satisfazê-la.

  PERCEPÇÃO: processo de recepção, seleção, transformação e organização das informações

  fornecidas através dos sentidos.

  PROCESSO DECISÓRIO OU TOMADA DE DECISÃO: processo em que o indivíduo recolhe e

  analisa as informações pertinentes e relevantes a determinada situação e escolhe a alternativa
  de ação

  mais aceitável em determinado espaço de tempo, sendo afetado por variáveis, tais como:

  complexidade do problema, características de personalidade de quem toma a decisão, limites

  cognitivos dos seres humanos, tempo, dentre outras.

  PROCEDIMENTOS OPERACIONAIS PADRONIZADOS (SOP - Standard Operating

  Procedures): são os procedimentos desenvolvidos por um fabricante de aeronave ou por um
  operador

  para orientar os tripulantes na operação da aeronave. Os SOP cobrem todos os procedimentos

  requeridos em todas as fases de voo, desde o pré-voo até o desligamento da aeronave nas
  operações.

  PROGRAMA: significa agrupamento lógico de ações educacionais estruturadas segundo uma mesma

  intencionalidade, visando ao desenvolvimento de competências necessárias ao alcance de resultados

  institucionais.

  SEGURANÇA OPERACIONAL: é o estado no qual o risco de lesões às pessoas ou danos às

  propriedades são reduzidos e mantidos em (ou abaixo de) um nível aceitável, mediante um
  contínuo

  processo de identificação de perigos e gerenciamento de riscos.

  TEM (Threat and Error Management): É uma abordagem que visa detectar e responder às ameaças

  e erros com contramedidas que reduzam ou eliminem suas consequências, e, ainda, mitiguem
  a

  probabilidade de ocorrência de estados indesejáveis da aeronave. O modelo propõe que as
  ameaças

  (mau tempo, por exemplo), erros (piloto selecionar o modo errado de automação, por exemplo),
  e

  estados indesejáveis da aeronave (desvio de altitude, por exemplo) são eventos cotidianos
  que toda

  tripulação tem que gerenciar para manter a segurança da operação, promovendo uma cultura
  de

  consciência situacional e comunicação efetiva entre a tripulação. O TEM é fundamental nos

  treinamentos de Crew Resource Management (CRM), que enfatiza a importância do trabalho de

  equipe e da tomada de decisão informada para melhorar a segurança operacional.

  TREINAMENTO: processo educacional através do qual os recursos humanos de uma organização

  desenvolvem eficiência no seu trabalho, presente ou futuro, aprimorando hábitos de pensamento
  e

  ação, habilidades, conhecimento e atitudes que possibilitem desempenhar melhor as suas atividades

  naquele contexto organizacional.

  VIOLAÇÃO: descumprimento intencional de regras e procedimentos com consciência, ou não,
  da

  dimensão dos efeitos que a ação pode produzir. Uma violação é uma ação intencional (ou inação)
  que

  resulta em descumprimento de regras conhecidas, políticas, procedimentos ou normas aceitáveis.Data
  de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B'
