text: '5.8 ESTÁGIO DE MATURIDADE DO OPERADOR AÉREO QUANTO AO CRM

  Garantia da qualidade. O operador aéreo é responsável por avaliar e estabelecer

  medidas de melhorias contínuas. Mesmo que o operador aéreo não seja o provedor do

  treinamento, sendo este terceirizado, deve desenvolver um método de supervisão e de

  garantia da qualidade em consonância aos aspectos dispostos nesta IS.Data de emissão: 6
  de março de 2025. IS nº 00-010

  Revisão B

  Os operadores aéreos devem desenvolver mecanismos gerenciais com controle de

  qualidade do Programa de Treinamento de CRM visando a melhoria contínua. O apêndice

  O apresenta orientações para apoiar o processo de identificação do estágio de maturidade

  em que se encontra o provedor.

  O modelo apresentado para avaliar o estágio de maturidade é composto de quatro

  estágios: sub protocolar, protocolar, extra protocolar e desenvolvimento contínuo. Cada

  estágio compõe-se de cinco componentes essenciais ao sucesso do Programa de CRM:

  integração dos níveis estratégico, tático e operacional da organização, integração do CRM

  com sistemas de gestão de segurança, qualidade do PCRM (documento), seleção e

  capacitação dos facilitadores e implementação do treinamento de CRM.

  A alta gestão dos operadores aéreos deve demonstrar conhecimento do seu estágio de

  maturidade quanto ao CRM e desenvolver políticas de melhorias contínuas com base em

  dados de segurança e da cultura organizacional. A demonstração de conhecimento deve

  ser formalizada por meio de documentação pertinente assim como as diretrizes e

  procedimentos criados para a consecução deste objetivo.

  6 APÊNDICES'
