cite: abreviaturas(c)
title: abreviaturas(c)
text: 'c) Compreender que os erros humanos não podem ser totalmente eliminados durante o voo,
  devendo

  ser controlados (conhecimento); d) Utilizar o modelo de gerenciamento das ameaças e dos
  erros no

  planejamento do voo (habilidade); e) Manter a consciência situacional durante o voo (atitude).

  AUTOMAÇÃO: substituição de uma função realizada por um ser humano, seja ela manual ou

  cognitiva, por uma função realizada por uma máquina. O objetivo da automação é auxiliar
  o operador

  a realizar suas tarefas. Automação pode ser definida ainda como um dispositivo ou sistema
  que realiza

  (parcial ou totalmente) uma função anteriormente, ou que poderia ser, realizada (parcial
  ou

  totalmente) por um operador humano.

  AUTOMAÇÃO CENTRADA NO ELEMENTO HUMANO: a automação centrada no elemento

  humano provê ao operador uma assistência automatizada que lhe permite poupar tempo e esforço,

  deixando-o livre para a execução de outras tarefas de controle. Devem ser automatizadas
  somente as

  funções que o controlador necessita, baseadas na informação e nos requisitos das tarefas.
  Na aviação,

  a automação refere-se mais frequentemente ao piloto automático, sistema de gerenciamento
  de voo

  (FMS), assim como a outras funções e sistemas inovadores relacionados às cabines de comando

  avançadas. A automação também tem o potencial de causar incidentes significativos quando

  incompreendida ou mal manejada, como quando os pilotos aceitam o que a automação da aeronave

  está fazendo sem monitorar ou confirmar adequadamente se a aeronave está fazendo o que eles

  esperavam ou queriam que ela fizesse (dependência da automação).

  AUTOMATISMO: ação automática e involuntária executada sem a volição (vontade) consciente
  do

  ser humano. Um exemplo de automatismo pode ser observado nas ações necessárias a um

  procedimento de emergência que o piloto executa de forma automática depois de ter sido,

  exaustivamente, treinado.

  BRIEFING: palavra de origem inglesa amplamente usada na aviação que significa verbalização
  dos

  procedimentos a serem executados durante um voo, que tenham sido planejados a priori, e
  o que se

  espera da atuação e participação de cada um. Ver debriefing.

  CALIBRAÇÃO: significa, no contexto desta IS, o processo no qual os facilitadores de CRM
  (LOFT)

  estabelecem e alinham os critérios de avaliação do CRM por indicadores comportamentais,
  mediados

  pela metodologia específica adotada. O treinamento de calibração deve se basear na apresentação
  de

  casos ou situações, preferencialmente através de vídeos, em que cada facilitador realiza
  a análise e a

  avaliação individualmente. Depois, as avaliações são apresentadas para debates, visando
  a redução

  da dispersão de avaliação dos facilitadores, buscando-se, dentro do possível, um consenso.
  Exercícios

  de calibração precisam ser feitos periodicamente para validar o processo de avaliação do
  CRM por

  indicadores comportamentais. Os dados devem ser registrados e um banco de dados deve ser
  gerado

  para acompanhamento e melhorias do processo.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  CARGA DE TRABALHO: é a relação existente entre as exigências da tarefa e a capacidade máxima

  individual de cada trabalhador. Como os recursos humanos são limitados, o nível necessário
  para uma

  tarefa específica pode exceder a quantidade disponível. Nestas circunstâncias, a carga de
  trabalho

  também pode ser definida como a proporção dos recursos necessários para a tarefa para a
  quantidade

  de recursos disponíveis. Uma tarefa não vai produzir o mesmo nível de carga de trabalho
  para

  operadores diferentes (dependendo do nível de experiência na atividade) ou para o mesmo
  operador

  (dependendo do seu estado durante a execução da tarefa).

  CARGA DE TRABALHO MENTAL: é a demanda colocada nos recursos mentais de um operador

  quanto ao uso da atenção, percepção, processo de tomada de decisão e ação.

  CHECKLIST: as listas de verificação (sejam elas de resposta ou de leitura, impressas ou
  eletrônicas)

  constituem ferramentas que dão suporte à tripulação e asseguram que todas as ações necessárias
  a

  cada fase do voo sejam realizadas sem omissão e de forma ordenada. É uma ferramenta para
  reduzir

  o potencial de erro da tripulação e de auxílio à manutenção da consciência situacional.
  Os checklists

  normais, anormais e de emergência, são geralmente disponibilizados em um manual de consulta
  fácil

  e rápida, o Quick Reference Handbook (QRH).

  CLIMA ORGANIZACIONAL: conjunto de percepções, sentimentos, atitudes, estados de humor, que

  se forma entre os membros da organização, nas relações intra e intergrupais, frente às regras
  e normas

  estabelecidas, sendo conjuntural e sujeito a rápidas mudanças. Se diferencia da cultura
  organizacional

  por refletir mais o ‘estado’ em que a empresa, ou parte dela, se encontra. Caracteriza-se
  mais por um

  estado momentâneo e passível de alteração mesmo em curto espaço de tempo em razão de novas

  influências, e que decorre das decisões e ações gerenciais, postas em prática ou não, e/ou
  das reações

  dos empregados a essas ações ou à perspectiva dela.

  COMPLACÊNCIA: característica de personalidade que representa a condescendência para com
  atos

  ou fatos que deveriam ser reprovados (controlados). Um estado de auto-satisfação com o próprio

  desempenho, juntamente com um rebaixamento da atenção para com o perigo, problemas ou

  controvérsias.

  COMPORTAMENTO: significa a resposta psico-fisiológica de um organismo aos estímulos internos

  ou externos em um dado momento ou situação. O termo quando adjetivado busca especificar
  o

  significado, como ocorre no modelo NOTECHS. Neste modelo o termo indicador comportamental

  (veja apêndices M e N) refere-se a “uma habilidade não técnica ou competência relativa a

  determinado ambiente de trabalho que contribui favorável ou desfavoravelmente para a efetividade

  do desempenho.” Sendo, neste caso, avaliado o comportamento observável e não comportamento

  inferido. Ver calibração.

  COMPETÊNCIA: conjunto de conhecimento, habilidades e atitudes necessários para executar
  uma

  tarefa de acordo com o padrão estabelecido.

  COMUNICAÇÃO: processo pelo qual um emissor organiza uma ideia ou fato, de forma racional
  e

  coerente, através de um conjunto sistemático de símbolos ou códigos (mensagem), verbais
  ou não,

  para transmissão de informações, selecionando os meios apropriados para que seus propósitos
  possam

  ser expressos ao receptor que a codifica. Requer interatividade e comprometimento entre
  o emissor e

  o receptor da mensagem.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  CONHECIMENTO: corresponde a uma série de informações assimiladas e estruturadas pelo

  indivíduo dentro de um esquema preexistente que exercem influência sobre seu julgamento
  ou

  comportamento. Em termos de objetivos de instrução, podem ser divididos conforme o domínio

  cognitivo da taxonomia de Bloom:'
