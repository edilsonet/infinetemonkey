title: abreviaturas(d)
text: 'd) Conhecimento Metacognitivo: relacionado ao reconhecimento da cognição em geral e
  da

  consciência da amplitude e profundidade de conhecimento adquirido de um determinado

  conteúdo. Em contraste com o conhecimento procedural, esse conhecimento é relacionado à

  interdisciplinaridade. A ideia principal é utilizar conhecimentos previamente assimilados

  (interdisciplinares) para resolução de problemas e/ou a escolha do melhor método, teoria
  ou

  estrutura. Conhecimento estratégico; conhecimento sobre atividades cognitivas incluindo

  contextos preferenciais e situações de aprendizagem (estilos); e autoconhecimento.

  CONFLITO: presença de ideias, sentimentos ou interesses antagônicos não resolvidos, advindos
  das

  relações de trabalho em um mesmo grupo de pessoas, podendo ser intragrupal (em uma só área
  da

  empresa) ou intergrupal (entre várias áreas da empresa). O modelo NOTECHS apresenta definição

  do termo resolução de conflito, uma vez que esta habilidade está contida na categoria cooperação.

  Ver apêndices M e N.

  CONSCIÊNCIA SITUACIONAL: percepção correta da realidade, revestida de capacidade crítica
  de

  determinada situação, envolvendo todos os seus elementos de forma a possibilitar que decisões

  apropriadas sejam tomadas, dentro do tempo disponível, para o cumprimento bem sucedido da

  operação. Outra definição muito utilizada no ambiente de aviação é a formulada por Mika
  Endsley

  (1988): a CS é caracterizada pela percepção dos elementos no ambiente de trabalho dentro
  de um

  volume de tempo e espaço, a compreensão do significado desses elementos e a projeção dessa

  situação em um futuro próximo. Esta definição ressalta os três elementos críticos da manutenção
  da

  CS: percepção, compreensão e projeção.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  CULTURA NACIONAL: a cultura nacional representa os componentes compartilhados do

  patrimônio nacional. Estes incluem valores, atitudes e normas comportamentais. Alguns aspectos
  da

  cultura nacional que foram identificados como críticos na aviação incluem: Individualismo-

  Coletivismo (Individualism - Collectivism - IC), Distância do Poder (Power Distance - PD)
  e Evasão

  de Incerteza (Uncertainty Avoidance - UA).

  CULTURA ORGANIZACIONAL: conjunto de regras e normas formais e informais; crenças, valores

  e sistemas; estilos de administração e liderança; histórias e mitos; rituais e símbolos
  de uma

  organização. Rege comportamentos da organização, dando-lhe uma identidade, através da disposição

  de linguagem, princípios de ação e formas de interpretação dos fatos comuns a todos os seus

  elementos. Está sujeita a mudanças lentas e é fortemente influenciada pela cúpula da organização.
  A

  organização fornece o ambiente no qual as culturas nacional e profissional operam e é uma

  determinante importante do comportamento dos profissionais. É no nível organizacional que
  a cultura

  de segurança é criada, nutrida e valorizada.

  CULTURA PROFISSIONAL: cultura que está associada a ser membro de uma profissão. No caso

  dos pilotos, este é um aspecto que pode influenciar as atitudes na cabine de comando, relacionando-

  se com as culturas organizacional e nacional. As culturas profissional e organizacional
  são mais

  suscetíveis de mudanças quando comparadas à cultura nacional. Um aspecto muito positivo
  da cultura

  dos pilotos é o orgulho pela profissão. Eles amam seu trabalho e são fortemente motivados
  para fazê-

  lo bem. A cultura profissional de pilotos também tem um forte componente negativo quase
  universal,

  o da invulnerabilidade pessoal. Foi observado que a maioria dos pilotos, em todas as culturas,
  sente

  que toma decisão tão bem em emergências como em situações normais, que seu desempenho não
  é

  afetado por problemas pessoais, e que não comete mais erros em situações de estresse elevado.
  Deste

  tipo de pensamento podem resultar falhas na utilização das práticas de CRM como medidas

  defensivas contra o erro.

  CULTURA DE SEGURANÇA: o conjunto de crenças, normas, atitudes e práticas de uma

  organização preocupada em minimizar a exposição da força de trabalho e do público em geral
  a

  condições perigosas. Promove uma atitude compartilhada de preocupação e responsabilidade
  pela

  segurança.

  CUSTOMIZAÇÃO: palavra de origem inglesa consagrada na administração e no marketing que

  significa, neste caso, adaptação dos conceitos de CRM à cultura de cada organização.

  DEBRIEFING: palavra de origem inglesa amplamente usada na aviação para significar o ato
  de tecer

  comentários resumidamente após o término de determinada atividade, utilizando-se de técnicas
  para

  estimular a crítica dos méritos e deméritos de um desempenho visando o seu aperfeiçoamento
  futuro.

  Ver briefing.

  DIAGNÓSTICO DE CULTURA ORGANIZACIONAL (DCO): processo para apurar e descrever a

  cultura corporativa de uma organização (cultura organizacional), com base em suas crenças,
  atitudes,

  valores e comportamentos herdados de seus fundadores. Pode ser conduzido por meio de entrevistas,

  observações, questionários e / ou escalas. Utilizado para avaliar o funcionamento de uma
  organização,

  departamento ou atividade para identificar fontes de problemas e áreas que necessitam de

  aprimoramento. O DCO inclui as fases de preparação, execução, análise dos dados e devolução
  aos

  entrevistados, sendo sempre um projeto autorizado pela alta gestão da empresa. Este DCOData
  de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  relacionado ao CRM busca identificar os diversos fatores que influenciam o desempenho individual

  e de equipe no ambiente operacional. Logo, trata-se de um diagnóstico de cultura de segurança

  operacional, cujo resultado contribui para o planejamento e aprimoramento do programa de
  CRM.

  EDUCAÇÃO A DISTÂNCIA (EaD): modalidade educacional na qual a mediação didático-

  pedagógica nos processos de ensino e aprendizagem ocorre com a utilização de meios e tecnologias

  de informação e comunicação, com alunos e tutores desenvolvendo atividades educativas em
  lugares

  e tempos diversos.

  EFETIVIDADE: qualidade ou estado daquilo que é concretizado, realizado; dimensão do

  desempenho associada aos impactos gerados pelos processos, produtos ou serviços, vinculados
  ao

  grau de satisfação ou valor agregado pela transformação produzida.

  EFICÁCIA: dimensão do desempenho segundo a qual se avalia se as atividades planejadas foram

  realizadas e os resultados planejados, alcançados. O termo eficaz, relacionado ao uso dos
  recursos

  disponíveis no âmbito do CRM, indica se os recursos disponíveis foram utilizados na garantia
  da

  segurança das operações.

  EFICIÊNCIA: dimensão do desempenho que expressa a relação entre o resultado alcançado e
  os

  recursos por ele demandados. O termo eficiente, relacionado ao uso dos recursos disponíveis
  no

  âmbito do CRM, indica se os recursos disponíveis foram utilizados de maneira produtiva.

  EQUIPE: conjunto de pessoas de formação complementares trabalhando em prol de um objetivo

  comum. Requer integração e empenho dos membros envolvidos, que devem colaborar para o sucesso

  da operação, trocando informações e promovendo um clima amistoso e de cooperação entre si.

  ERRO HUMANO: termo genérico que compreende toda ocasião na qual a sequência mental

  planejada de atividades, mentais ou físicas, falha em alcançar seu resultado pretendido.
  Erros são as

  ações ou inações da tripulação que levam ao desvio daquilo que foi pretendido ou esperado
  pela

  tripulação ou organização; reduz a margem de segurança; e aumenta a probabilidade de ocorrência

  de eventos adversos em solo ou durante o voo. Os erros humanos também são abordados no Modelo

  Reason sendo analisados quanto ao momento em que produzem suas consequências, constituindo
  as

  falhas latentes e as falhas ativas. Salienta-se que os erros não são intencionais. Esta
  definição também

  é usada no modelo TEM, que é uma abordagem voltada para o gerenciamento das ameaças e dos

  erros para evitar que a aeronave entre em um estado indesejável.

  ESTADO INDESEJÁVEL DA AERONAVE: na abordagem TEM o termo se refere aos desvios para

  o limite do envelope de segurança da aeronave, consequência de inadequado gerenciamento
  dos erros

  e das ameaças.

  ESTRESSE: conjunto de reações que ocorre no organismo quando está submetido a um esforço
  de

  adaptação. Estresse é um estado de tensão que causa ruptura no equilíbrio interno do organismo.
  O

  desequilíbrio ocorre quando a pessoa necessita responder a alguma demanda que ultrapassa
  ou é

  percebida como superior à sua capacidade adaptativa.

  FACILITADOR: é o profissional selecionado, de acordo com requisitos mínimos exigidos, para
  ser

  um facilitador da aprendizagem. É um instrutor que possibilita a aprendizagem em um ambienteData
  de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  centrado no aluno, orientando os participantes por meio de discussões, interações, exercícios

  estruturados e experiências. No caso do facilitador de CRM, os requisitos são explicitados
  na seção'
