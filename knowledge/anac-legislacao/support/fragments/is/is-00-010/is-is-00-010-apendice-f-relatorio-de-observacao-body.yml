title: APÊNDICE F - RELATÓRIO DE OBSERVAÇÃO
text: 'APÊNDICE F - RELATÓRIO DE OBSERVAÇÃO

  RELATÓRIO DE OBSERVAÇÃO - CANDIDATO A FACILITADOR pág. 1

  Nome:

  Cargo e função:

  Empresa em que trabalha:

  Telefones para contato:

  Com. 1: ( ) Com. 2: ( ) Cel.: ( )

  e-mail:

  Observação:

   1ª fase  2ª fase  3ª fase

  Período do curso:

  Nome da empresa que ministrou o treinamento de CRM (Caso tenha sido uma empresa terceirizada,

  especificar nome da empresa e dados do(s) facilitador(es) que ministrou(aram) o curso, assim
  como o nome

  da empresa contratante):

  Endereço da empresa (que recebeu o treinamento):

  Telefones para contato:

  Com. 1: ( ) Com. 2: ( ) Com. 3.: ( )

  Objetivo da observação:

   Atender ao parágrafo 5.7.23.1 da IS 00-010, que cuida da capacitação do facilitador em
  CRM.

   Outro (descrever):

  Disciplinas cobertas pelo treinamento (listar seus nomes):Data de emissão: 6 de março de
  2025. IS nº 00-010

  Revisão B

  Objetivos das aulas (Anotar do material de aula usado pelo facilitador, por exemplo: aula
  de TEM - objetivo:

  reconhecer a abordagem do gerenciamento do erro e da ameaça como uma contramedida ao erro
  humano

  nas operações aéreas. Escreva ‘não observado’ se não houver objetivo da aula no material
  apresentado):

  Recursos e materiais didáticos utilizados (Qualidade da apostila e do conteúdo desta, pertinência
  dos extratos

  de filmes, qualidade dos equipamentos e dos recursos audiovisuais, reálias (flipchart),
  etc.):

  Características ambientais (Do local do curso e da sala de aula - descrição dos elementos
  que compõem a

  infraestrutura para as atividades curriculares, do apoio e suporte geral observados para
  a consecução do

  treinamento):

  Características dos alunos (Categoria funcional, faixa etária, número de alunos, nível de
  interesse percebido,

  atitudes, comportamentos evidenciados etc.):

  Desenvolvimento da aula (Relato descritivo das aulas, ou seja, das sequências das atividades
  levadas a efeito,

  se a aula atingiu o objetivo proposto, técnicas usadas para atingir o objetivo das aulas
  (aula expositiva, trabalho

  de grupo, dramatização, estudo de caso, exercícios etc.):

  Relacionamento facilitador/aluno (Descrever as evidências colhidas em termos do tipo de
  relação existente

  entre alunos e facilitador; se é cordial, tensa, formal, informal, permissiva, respeitosa
  quanto às opiniões

  diferentes etc.; se o facilitador consegue gerenciar as discussões/dinâmicas mantendo o
  vínculo com o objetivo

  da aula, se faz escuta ativa):

  Tendências metodológicas do(a) facilitador(a) (Verificar se a ênfase no curso foi de aulas
  expositivas ou de

  facilitação, verificar se o facilitador utilizou tanto o método dedutivo (do geral para
  o particular) quanto oData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  método indutivo (do particular para o geral); observar se o facilitador apresentou ou reviu
  os conceitos básicos

  das disciplinas, por exemplo, se for tratar do impacto do estresse no processo de tomada
  de decisão, é preciso

  apresentar as definições dos termos “estresse” e “tomada de decisão” antes de avançar no
  conteúdo):

  Apreciação da aula / treinamento (Desenvolver uma apreciação pessoal sobre a aula ou sobre
  o treinamento

  observado como um todo, considerando a interação de todos os elementos do ensino aqui abordados.

  Considerar também, e principalmente, o desempenho do(a) facilitador(a) em relação à dinâmica
  da aula, à

  utilização do tempo, à propriedade da programação e dos conteúdos das disciplinas em relação
  ao Manual de

  treinamento de CRM.):

  Local: Data:

  Assinatura do candidato a facilitador:

  Assinatura do instrutor observado:

  Assinatura do responsável pelo provedor do serviço:Data de emissão: 6 de março de 2025.
  IS nº 00-010

  Revisão B'
