text: 'c) A conclusão da parte prática ocorre pela aceitação pelo operador aéreo dos 6 (seis)

  relatórios apresentados.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  A parte prática deve ser compatível com a atuação pretendida do facilitador de CRM,

  respeitando o público-alvo e objetivos de treinamento.'
