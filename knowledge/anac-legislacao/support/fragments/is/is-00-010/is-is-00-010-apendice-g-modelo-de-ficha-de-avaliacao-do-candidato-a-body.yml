text: 'APÊNDICE G - MODELO DE FICHA DE AVALIAÇÃO DO CANDIDATO A

  FACILITADOR DE CRM - PARTE PRÁTICA DO TREINAMENTO PARA

  FACILITADOR DE CRM

  Modelo de ficha de avaliação do candidato a facilitador de CRM

  (Ofereça razões/dê exemplos)

  S/N

  1

  O candidato colaborou para que os objetivos instrucionais fossem atingidos? Comentário:

  2

  O candidato atuou em consonância com os conceitos e as melhores práticas do CRM?

  Comentário:

  3

  O candidato integrou os aspectos do CRM aos treinamentos técnicos dos participantes?

  Comentário:

  4

  O candidato identificou nos exemplos e estudos de casos os motivos dos resultados, sabendo

  correlacionar o “como” e o “porquê” dos eventos abordados? Comentário:

  5

  O candidato utilizou as habilidades de facilitação de forma eficaz para estimular a compreensão

  e a autoanálise dos participantes? Comentário:

  6

  O candidato avaliou corretamente as habilidades não técnicas dos participantes? Comentário:

  7

  O candidato demonstrou conhecimento requerido para a função? Comentário:

  8

  O candidato demonstrou as habilidades instrucionais para seu papel de facilitador? Comentário:

