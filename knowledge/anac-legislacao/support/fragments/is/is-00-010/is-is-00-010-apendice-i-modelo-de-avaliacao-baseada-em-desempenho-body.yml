text: 'APÊNDICE I - MODELO DE AVALIAÇÃO BASEADA EM DESEMPENHO:

  CONHECIMENTO EM FATORES HUMANOS

  FH / Modelo de avaliação baseada em desempenho: Conhecimento em Fatores Humanos

  CONHECIMENTO EM FATORES HUMANOS

  Demonstrar apropriado conhecimento da área de Fatores Humanos para oferecer necessário grau

  de credibilidade para o papel.

  Indicadores de

  desempenho

  aceitáveis

  A compreensão dos fundamentos teóricos do campo Fatores Humanos é

  suficiente para o papel

  - Demonstra entendimento teórico do campo Fatores Humanos e das

  condições humanas relevantes.

  - Identifica os conceitos chave dos Fatores Humanos e entende suas

  implicações no contexto operacional (ou os aplica no contexto

  operacional).

  - Identifica as necessidades relacionadas aos fatores humanos e avalia

  consequências.

  O conhecimento sobre os requisitos legais e as publicações de Fatores

  Humanos é suficiente para o papel

  - É capaz de explicar os requisitos para um público não leigo na

  matéria.

  As oportunidades de aprendizagem são ativamente buscadas

  - Usa uma variedade de recursos para melhorar o próprio

  conhecimento na matéria (FH).

  - Coloca o conhecimento e a compreensão adquirida em prática, de

  acordo com seu papel.

  - Usa feedback e ‘lições aprendidas’ da experiência para melhorar a

  aprendizagem.

  - Demonstra aprendizagem contínua e desenvolvimento no assunto.

  Indicadores de

  desempenho não

  aceitáveis

  O nível de conhecimento requerido não foi demonstrado.

  - O nível de conhecimento demonstrado não foi suficiente para o

  papel.

  - Não foi capaz de responder questões relacionadas aos Fatores

  Humanos corretamente ou adequadamente.

  - Conhecimento limitado da regulamentação/normativos

  pertencentes aos Fatores Humanos na área da disciplina ministrada.

  - Os princípios dos Fatores Humanos não foram ou foram

  inadequadamente aplicados no contexto operacional (habilidades

  não técnicas contribuintes para o sucesso ou fracasso da operação).

  - Manteve o foco nas causas técnicas dos acidentes, muito pouca

  referência para as habilidades não técnicas.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B'
