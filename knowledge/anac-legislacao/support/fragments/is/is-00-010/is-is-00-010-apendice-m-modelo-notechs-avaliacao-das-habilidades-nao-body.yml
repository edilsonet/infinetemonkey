text: 'APENDICE M - MODELO NOTECHS - AVALIAÇÃO DAS HABILIDADES NÃO

  TÉCNICAS POR INDICADORES COMPORTAMENTAIS

  NOTECHS - MODELO DE AVALIAÇÃO DAS HABILIDADES NÃO TÉCNICAS POR INDICADORES

  COMPORTAMENTAIS

  CATEGORIAS ELEMENTOS EXEMPLO DE COMPORTAMENTOS (POSITIVOS)

  COOPERAÇÃO Construção e manutenção de

  equipe

  - Estabelecer uma atmosfera de comunicação aberta

  e de participação

  - Encorajar que os outros deem novas informações e

  feedback

  - Não competir com os outros

  Consideração pelos outros - Levar em consideração sugestões dos outros

  mesmo que você não concorde com elas

  - Levar em consideração a condição dos outros

  - Oferecer um feedback apropriado

  Dar suporte aos outros - Colaborar com a equipe em situações de

  necessidade, mantendo o foco na tarefa e não na

  pessoa

  - Oferecer ajuda

  Resolução de conflitos - Manter a calma nos conflitos

  - Sugerir soluções ao conflito

  - Concentrar-se no que é certo e não em quem está

  certo

  LIDERANÇA E

  HABILIDADES

  GERENCIAIS

  Uso de autoridade e

  assertividade

  - Se posicionar no papel de liderança

  - Ter iniciativa para garantir que a tarefa/missão seja

  atingida com sucesso

  - Exercer o comando quando a situação exigir

  - Motivar o grupo pelo reconhecimento e pela

  supervisão quando necessário

  Oferecer e manter padrões - Garantir que os procedimentos padrões sejam

  seguidos

  - Interferir em caso de desvio

  - Após consultar a equipe, desviar do procedimento

  padrão se a situação assim o exigir

  Planejamento e coordenação - Encorajar os elementos do grupo de trabalho no

  planejamento e na consecução da tarefa

  - Falar claramente as intenções e os objetivos

  Gerenciamento da Carga de

  trabalho

  - Distribuir as atividades entre a equipe, checar e

  corrigir apropriadamenteData de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B

  - Priorizar atividades operacionais secundárias para a

  obtenção de recursos suficientes para as atividades

  de voo principais

  - Reservar tempo suficiente para a realização da

  atividade

  CONSCIÊNCIA

  SITUACIONAL

  Consciência dos sistemas da

  aeronave

  - Monitorar e relatar mudanças nos sistemas da

  aeronave

  - Ter conhecimento das entradas e das mudanças

  para os sistemas

  Consciência do ambiente

  externo

  - Obter informações sobre o ambiente

  - Contatar recursos externos quando necessário

  - Dividir informações sobre o ambiente com os

  demais

  Consciência do tempo (time) - Discutir estratégias de contingência

  - Identificar problemas possíveis ou futuros

  TOMADA DE

  DECISÃO

  Definição e diagnóstico do

  problema

  - Buscar informações e identificar o problema

  - Rever com a tripulação os fatores causais do

  problema

  Produção de opções - Estabelecer curso alternativo de ação

  - Perguntar à equipe por opções

  Avaliação do risco e seleção de

  opções

  - Considerar e compartilhar riscos acerca dos cursos

  de ação alternativos

  - Falar sobre possíveis riscos acerca dos cursos de

  ação, em termos de restrições da tripulação

  - Confirmar curso de ação escolhido

  Revisão dos resultados - Checar resultado em relação ao objetivo

  ESCALA DE AVALIAÇÃO DAS HABILIDADES NÃO TÉCNICAS - NOTECHS

  Muito inadequado Inadequado Aceitável Bom Muito bom

  O comportamento

  observado afeta

  diretamente a segurança

  operacional

  O comportamento

  observado, em outras

  circunstâncias,

  poderia ter afetado a

  segurança operacional

  O comportamento

  observado não

  afeta a segurança

  operacional, mas

  precisa melhorar

  O comportamento

  observado melhora

  a segurança

  operacional

  O comportamento

  observado é um exemplo a

  ser seguido para a

  segurança operacional

  Para estudo aprofundado, recomenda-se: Van Avermaete, J.A.G. (1998).Data de emissão: 6 de
  março de 2025. IS nº 00-010

  Revisão B'
