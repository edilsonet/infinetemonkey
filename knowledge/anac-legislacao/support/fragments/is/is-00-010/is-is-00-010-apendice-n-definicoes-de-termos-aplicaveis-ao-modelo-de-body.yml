title: APÊNDICE N - DEFINIÇÕES DE TERMOS APLICÁVEIS AO MODELO DE
text: 'APÊNDICE N - DEFINIÇÕES DE TERMOS APLICÁVEIS AO MODELO DE

  AVALIAÇÃO NOTECHS

  Da mesma forma que se estabeleceu o uso de fraseologia padrão nas comunicações

  radiotelefônicas na aviação, no campo comportamental também é preciso haver o

  compartilhamento de termos e definições para se tratar com mais objetividade as avaliações
  das

  habilidades de CRM. Abaixo, segue uma relação de termos básicos ao bom entendimento do modelo

  NOTECHS. Os termos serão apresentados em uma ordem lógica e não alfabética para melhor

  entendimento do modelo.

  TERMO DEFINIÇÃO/DESCRIÇÃO

  Avaliação O processo de observar, assinalar e interpretar o conhecimento

  e desempenho individual em face de determinado padrão

  estabelecido.

  Habilidades Não Técnicas - São as habilidades que se referem aos comportamentos e

  atitudes dos pilotos na cabine não diretamente relacionados ao

  controle da aeronave, gerenciamento dos sistemas e aos.

  - Habilidades não técnicas são definidas como as habilidades

  cognitivas, sociais e de autogerenciamento, que complementam

  as habilidades técnicas dos trabalhadores, e contribuem para a

  segurança e para o desempenho eficaz de tarefas. Incluem

  competências tais como tomada de decisão, gerenciamento da

  carga de trabalho, comunicação em equipe, consciência

  situacional.

  Gerenciamento de Recursos

  de Equipe (CRM)

  Uma filosofia de operações e de treinamento de equipe, com o

  objetivo de garantir a utilização eficaz de todos os recursos

  disponíveis para realizar operações de voo seguras e eficientes.

  Facilitador Um instrutor que permite a aprendizagem em um ambiente

  centrado no estudante guiando os participantes através de

  discussões, interações, exercícios estruturados e experiências.

  Objetivo de treinamento Uma afirmação clara composta por três partes, ou seja, o

  desempenho esperado ou o que o aluno deverá ser capaz de

  fazer ao final da capacitação (ou ao final das fases específicas de

  capacitação), o padrão de desempenho que dever ser atingido

  para confirmar o nível de competência do aluno, e as condições

  sob as quais o aluno irá demonstrar a competência (ICAO, 2006).

  Princípios de fatores humanos Princípios que se aplicam ao projeto, certificação, treinamento,

  operações e manutenção aeronáuticos e que busquem a

  interface segura entre as pessoas e outros componentes do

  sistema pela consideração adequada do desempenho humano.

  Desempenho Humano Capacidades e limitações humanas que geram impacto na

  segurança e eficiência das operações aéreas.

  NOTECHS Uma abordagem, desenvolvida pela Joint Aviation Authorities

  (Europa), para a avaliação das habilidades não técnicas, tendo

  por base um sistema de indicadores comportamentais. EstaData de emissão: 6 de março de 2025.
  IS nº 00-010

  Revisão B

  abordagem ou este modelo é baseado em quatro categorias e

  em quinze elementos constituintes (Apêndice M).

  Indicador comportamental Uma habilidade não técnica ou competência relativa a

  determinado ambiente de trabalho que contribui favorável ou

  desfavoravelmente para a efetividade do desempenho.

  Cooperação É a habilidade de trabalhar efetivamente em equipe. Esta

  categoria inclui quatro elementos: Construção e manutenção de

  equipes, Consideração pelos outros, Dar suporte aos outros, e

  Resolução de conflitos.

  Construção e manutenção de

  equipe

  Habilidade para estabelecer relações interpessoais positivas

  entre os membros da equipe e participar ativamente para a

  finalização das tarefas.

  Consideração pelos outros Envolve a aceitação do jeito de ser do outro e a compreensão da

  sua situação pessoal.

  Dar suporte aos outros Está relacionado a ajudar os parceiros de equipe quando eles

  precisarem de ajuda.

  Resolução de conflitos Trata-se da articulação de diferentes posições interpessoais e da

  atitude de oferecer sugestões para soluções.

  Liderança e Habilidades

  Gerenciais

  Processo de se finalizar uma tarefa coletiva com uma equipe

  motivada e operante através de coordenação e persuasão. Esta

  categoria envolve quatro elementos: Uso de autoridade e

  assertividade, oferecer e manter padrões, Planejamento e

  coordenação, e Gerenciamento da carga de trabalho.

  Uso de autoridade e

  assertividade

  Precisa ser ajustado à necessidade de participação e

  assertividade do grupo de trabalho.

  Oferecer e manter padrões Refere-se a estar de acordo com padrões essenciais para a

  finalização da tarefa. Faz parte desta habilidade supervisionar e

  fazer uma intervenção em caso de desvio dos padrões por parte

  de alguém da equipe. Se a situação exigir algum desvio de um

  procedimento padronizado, este desvio precisa ser debatido e

  anunciado.

  Planejamento e coordenação Referem-se ao uso apropriado do conceito e divisão de tarefas

  e de delegação de tal modo que se atinja um elevado

  desempenho do grupo de trabalho e se evite altos e baixos

  quanto à carga de trabalho.

  Gerenciamento da carga de

  trabalho

  Demanda uma clara priorização das atividades operacionais

  primárias e secundárias. O planejamento deve distribuir as

  atividades apropriadamente pela equipe. Sinais de estresse e de

  fadiga precisam ser levados em conta. Recursos externos e

  internos (incluindo a automação) devem ser utilizados para que

  a ação seja realizada no tempo necessário.

  Consciência situacional É a habilidade de perceber acuradamente o que está dentro da

  cabine e fora da aeronave. Também é a habilidade de

  compreender o significado de elementos variados do ambienteData de emissão: 6 de março de
  2025. IS nº 00-010

  Revisão B

  e a projeção da condição de voo em um futuro próximo. Esta

  categoria envolve três elementos: Consciência dos sistemas da

  aeronave, Consciência do ambiente externo, e Consciência do

  tempo (time).

  Consciência dos sistemas da

  aeronave

  A tripulação precisa estar constantemente ciente da situação

  dos diferentes sistemas da aeronave.

  Consciência do ambiente

  externo

  A tripulação precisa estar consciente sobre o ambiente (posição,

  condições meteorológicas, tráfego aéreo, terreno).

  Consciência do tempo A tripulação precisa não só estar consciente sobre o presente

  estado dos sistemas da aeronave e do ambiente, como precisa

  ser capaz de predizer estados futuros, e assim antecipar

  acontecimentos futuros.

  Tomada de Decisão É a habilidade de estabelecer um julgamento ou escolher uma

  opção. Esta categoria envolve quatro elementos: Definição e

  diagnóstico do problema, Produção de opções, Avaliação do

  risco e seleção de opções, e Revisão dos resultados.

  Definição e diagnóstico do

  problema

  Habilidade de coletar informações necessárias para definir um

  problema e seus fatores causais

  Produção de opções Habilidade em gerar mais de uma resposta ao problema.

  Avaliação do risco e seleção de

  opções

  Habilidade em se avaliar com sucesso os riscos e os benefícios

  de diferentes respostas a um mesmo problema.

  Revisão dos resultados Refere-se à necessidade da tripulação em checar as

  consequências da solução em relação ao objetivo pré-definido.

  * Para estudo aprofundado do modelo de avaliação NOTECHS, recomenda-se: ESCUDEIRO, M. L.
  NOTECHS: UM MODELO

  DE AVALIAÇÃO DAS HABILIDADES NÃO TÉCNICAS ATRAVÉS DE INDICADORES COMPORTAMENTAIS. Conexão
  Sipaer, v. 3,

  2012.Data de emissão: 6 de março de 2025. IS nº 00-010

  Revisão B'
