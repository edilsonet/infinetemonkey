text: '141.77

  QUESTÃO

  A seção 141.77 do RBAC nº 141 prevê o aproveitamento de estudos ou de experiência prévia
  de aluno que tenha recebido instrução de uma instituição de ensino superior, de uma instituição
  de ensino técnico de nível médio, de uma escola militar, de outro CIAC certificado pela
  ANAC ou de um instrutor de voo habilitado pela ANAC.

  Diante disso questiona-se: pode o CIAC expedir certificado de conclusão de candidatos que
  realizaram parte do curso fora de entidade?

  INTERPRETAÇÃO

  Sim, pode, desde que cumpridos os requisitos da seção 141.77 do RBAC nº 141. Uma vez que
  tenha sido possível o aproveitamento de estudos ou de experiência prévia, esses estudos
  ou experiência prévia do aluno equivalem, para todos os efeitos, ao que seria fornecido
  pelo CIAC receptor. Além disso:

  I - Para alunos egressos de outro CIAC

  Para a transferência de entidade, a instituição que acolhe o aluno deve exigir deste a carta
  de transferência e avaliá-lo de forma a indicar em qual missão/fase da instrução ele será
  admitido.

  Após o término do curso, no verso do certificado de conclusão (a ser expedido pelo CIAC
  onde o aluno conclui o curso) deverá constar as seguintes informações:


  Título: Aluno transferido da [nome da entidade anterior]


  Nome completo e CANAC do aluno


  Data em que a entidade admitiu o aluno


  Experiência prévia (horas de voo) à admissão na entidade


  Missão/fase para a qual a entidade avaliou e entendeu que o aluno estava apto a prosseguir
  o curso


  Experiência/Instrução realizada na entidade que admitiu o aluno

  O CIAC que acolheu o aluno é responsável por inaugurar a pasta deste na instituição contendo
  cópia da CIV, carta de transferência e os registros da avaliação inicial. O CIAC do qual
  o aluno é egresso deve, por sua vez, manter todos os registros de treinamento realizados
  pelo aluno naquela instituição, incluindo cópia da carta de transferência emitida ao aluno.

  II - Para alunos com experiência FORA de CIAC

  Com exceção do curso prático de piloto privado, em que se exige que seja realizado integralmente
  dentro de entidades certificadas pela ANAC, os CIACs podem expedir certificados de conclusão
  de curso para alunos que tenham realizado parte do curso fora de entidade. Neste caso a
  entidade é responsável por avaliar previamente o aluno, indicando em qual missão/fase da
  instrução o mesmo será admitido. No verso do certificado de conclusão deverá constar as
  seguintes informações:


  Título: Aluno com instrução prévia fora de entidade


  Nome completo e CANAC do aluno


  Data de admissão no curso


  Experiência prévia (horas de voo) à admissão na entidade


  Missão/fase para a qual a entidade avaliou e entendeu que o aluno está apto a prosseguir
  o curso


  Experiência/Instrução realizada na entidade

  Ao se aproveitar parte de instrução realizada fora da entidade, o concluinte não fará jus
  a eventual redução de experiência prevista no RBAC nº 61 para aqueles que realizarem de
  forma completa e ininterrupta, em sua totalidade, o curso na entidade.

  FUNDAMENTO DA INTERPRETAÇÃO

  As instruções de voo para as licenças previstas no RBAC nº 61 devem ser ministradas por
  instrutor de voo devidamente habilitado e qualificado. Contudo, com exceção da licença de
  Piloto Privado, o RBAC nº 61 não exige que tais instruções ocorram em um CIAC certificado
  pela ANAC, bastando que a parte prática seja ministrada por instrutor de voo devidamente
  habilitado. Dessa forma, com exceção da licença de Piloto Privado, já são concedidas pela
  ANAC licenças para aqueles que realizaram sua instrução fora de um CIAC.

  A ANAC recomenda e incentiva que o aluno realize sua instrução dentro de um CIAC, inclusive
  por meio do próprio RBAC nº 61, que reconhece essa qualidade ao aceitar que candidatos que
  realizaram integralmente seus cursos em CIAC possam pleitear algumas licenças com horas
  de experiência menor àqueles que não realizaram integralmente seu curso em CIAC. Portanto,
  por possuir um ambiente estruturado e voltado à prática de ensino, é desejável que, sempre
  que possível, o aluno realize sua instrução integralmente dentro de um CIAC. Se não puderem
  realizar integralmente sua instrução dentro de um CIAC, que realizem ao menos parte dela,
  onde terão contato com padrões, metodologias e ferramentas que agregarão à experiência do
  candidato.

  Em leitura ao RBAC nº 141, vislumbra-se a possibilidade de que os CIACs aceitem alunos com
  experiência prévia fora de um CIAC. Por outro lado, ao impedir que tais candidatos pudessem
  aproveitar parte da experiência que possuem e ingressarem na fase/missão compatível ao nível
  de competência e experiência, estar-se-ia desincentivando que tais alunos realizassem instrução
  (ainda que somente parte dela) dentro de um CIAC.

  Ademais, mesmo com certificado expedido por CIAC, o candidato que não realizar de forma
  completa e ininterrupta, em sua totalidade, o curso em CIAC, não fará jus a eventual redução
  de experiência prevista no RBAC nº 61. Não há assim nenhum prejuízo instrucional com tal
  procedimento. Pelo contrário, candidatos que já iriam obter licença sem passar por um CIAC
  (o que é previsto e permitido pelo regulamento) terão a oportunidade e o reconhecimento
  de agregarem ao seu conhecimento, ainda que de forma parcial, o ensino formal propiciado
  por um CIAC.

  PALAVRAS-CHAVE

  TRANSFERÊNCIA DE ENTIDADE; 141.75.


  Superintendência de Pessoal da Aviação Civil - SPL

