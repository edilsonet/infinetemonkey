title: General licensing specifications
text: '2.1.1 General licensing specifications

  2.1.1.3 An applicant shall, before being issued with any pilot licence or rating, meet such
  requirements in respect of age, knowledge, experience, flight instruction, skill and medical
  fitness, as are specified for that licence or rating.

  2.1.1.3.1 An applicant for any pilot licence or rating shall demonstrate, in a manner determined
  by the Licensing Authority, such requirements for knowledge and skill as are specified for
  that licence or rating.'
