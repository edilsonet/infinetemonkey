title: Crediting of flight time
text: '2.1.9 Crediting of flight time

  2.1.9.1 A student pilot or the holder of a pilot licence shall be entitled to be credited
  in full with all solo, dual instruction and pilot-in-command flight time towards the total
  flight time required for the initial issue of a pilot licence or the issue of a higher grade
  of pilot licence.

  2.1.9.2 The holder of a pilot licence, when acting as co-pilot at a pilot station of an
  aircraft certificated for operation by a single pilot but required by a Contracting State
  to be operated with a co-pilot, shall be entitled to be credited with not more than 50 per
  cent of the co-pilot flight time towards the total flight time required for a higher grade
  of pilot licence. The Contracting State may authorize that flight time be credited in full
  towards the total flight time required if the aircraft is equipped to be operated by a co-pilot
  and the aircraft is operated in a multi-crew operation.

  2.1.9.3 The holder of a pilot licence, when acting as co-pilot at a pilot station of an
  aircraft certificated to be operated with a co-pilot, shall be entitled to be credited in
  full with this flight time towards the total flight time required for a higher grade of
  pilot licence.

  2.1.9.4 The holder of a pilot licence, when acting as pilot-in-command under supervision,
  shall be entitled to be credited in full with this flight time towards the total flight
  time required for a higher grade of pilot licence.

  PALAVRAS-CHAVE

  AERONAVE SINGLE PILOT; SEGUNDO EM COMANDO; SIC; CONTAGEM E REGISTRO DE HORAS DE VOO; COPILOTO;
  CO-PILOTO; 61.29; CIV.


  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: Ordem de cumprimento dos requisitos estabelecidos para a concessão de licenças,
  certificados e/ou habilitações

  Código:

  DI-SPL 0004

  Rev: B

  Aprovada originalmente em: 8/12/2017 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.13(a)

  QUESTÃO

  O parágrafo 61.13(a) estabelece entre os requisitos mínimos para a concessão de licenças
  certificados e/ou habilitações o atendimento a: idade, grau de instrução, aptidão psicofísica,
  conhecimentos teóricos, instrução de voo, experiência de voo e aprovação em exame de proficiência.

  No entanto, o texto do RBAC n º 61, diferentemente do texto do RBHA 61, não condiciona explicitamente
  a realização do exame de proficiência somente após o cumprimento de todos os demais requisitos.
  Com a publicação do RBAC nº 61 Emenda 00, em 05/06/2012, bem como em suas revisões subsequentes,
  o novo texto passou a ser omisso em relação a esse ponto. Atualmente o RBAC nº 61 encontra-se
  em sua sexta revisão e elenca em sua seção 61.13 os requisitos que devem ser atendidos para
  concessão de uma licença e/ou habilitação, não estabelecendo, contudo, de forma explícita
  quais requisitos devem ser cumpridos previamente ao exame de proficiência.

  Portanto, questiona-se: o candidato à concessão de licenças, certificados e/ou habilitações
  deve observar os requisitos estabelecidos no parágrafo 61.13(a) na ordem em que são mencionados,
  devendo cumprir o exame de proficiência somente após o cumprimento dos demais requisitos?

  INTERPRETAÇÃO

  O solicitante deve candidatar-se ao exame de proficiência somente após ter atendido os requisitos
  de idade, grau de instrução, aptidão psicofísica, conhecimentos teóricos, instrução de voo
  e experiência de voo, observando a ordem mencionada no texto do Regulamento.

  FUNDAMENTO DA INTERPRETAÇÃO

  O RBAC nº 61 é o regulamento que trata das licenças, habilitações e certificados de pilotos,
  estabelecendo os requisitos que devem ser alcançados para sua concessão e revalidação.

  Dentre as previsões do regulamento, a seção 61.13(a) é a responsável por disciplinar os
  requisitos a serem cumpridos para a concessão das licenças, habilitações e certificados
  de pilotos:'
