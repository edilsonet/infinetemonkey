title: Experience
text: '2.3.4.1 Experience

  2.3.4.1.1 The applicant shall have completed not less than 40 hours of flight time, or 35
  hours if completed during a course of approved training, as a pilot of helicopters. The
  Licensing Authority shall determine whether experience as a pilot under instruction in a
  flight simulation training device is acceptable as part of the total flight time of 40 hours
  or 35 hours, as the case may be. Credit for such experience shall be limited to a maximum
  of 5 hours.

  2.3.4.1.2 The applicant shall have completed in helicopters not less than 10 hours of solo
  flight time under the supervision of an authorized flight instructor, including 5 hours
  of solo cross-country flight time with at least one cross-country flight totalling not less
  than 180 km (100 NM) in the course of which landings at two different points shall be made.

  2.3.4.1.1.1 When the applicant has flight time as a pilot of aircraft in other categories,
  the Licensing Authority shall determine whether such experience is acceptable and, if so,
  the extent to which the flight time requirements of 2.3.4.1.1 can be reduced accordingly.


  Aeronave de Sustentação por Potência'
