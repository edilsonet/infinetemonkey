title: Experience
text: '2.3.5.1 Experience

  2.3.5.1.1 Recommendation.- The applicant should have completed not less than 40 hours of
  flight time as a pilot of powered-lifts. The Licensing Authority should determine whether
  experience as a pilot under instruction in a flight simulation training device is acceptable
  as part of the total flight time of 40 hours.

  2.3.5.1.3 Recommendation.- The applicant should have completed in powered-lifts not less
  than 10 hours of solo flight time under the supervision of an authorized flight instructor,
  including 5 hours of solo cross-country flight time with at least one cross-country flight
  totalling not less than 270 km (150 NM) in the course of which full-stop landings at two
  different aerodromes shall be made.

  2.3.5.1.2 Recommendation.- When the applicant has flight time as a pilot of aircraft in
  other categories, the Licensing Authority should determine whether such experience is acceptable
  and, if so, the extent to which the flight time requirements of 2.3.5.1.1 could be reduced
  accordingly.


  Note-se que a possibilidade de redução de horas abrange expressamente apenas os parágrafos
  2.3.3.1.1, 2.3.4.1.1 e 2.3.5.1.1, e não abrange as horas de voo solo e navegação previstas
  nos parágrafos 2.3.3.1.2, 2.3.4.1.2 e 2.3.5.1.3.

  Isso nos auxilia na interpretação do RBAC nº 61, pois já podemos concluir que os requisitos
  de voo solo e navegação não podem ser objeto do abatimento de horas, já que isso permitiria
  a formação de Pilotos Privados com mínimos inferiores aos estabelecidos pela ICAO.

  Quanto às horas de voo noturno, tecnicamente interpretamos que também não são passíveis
  de redução. Isso ocorre porque um dos principais objetivos da instrução de voo noturno é
  adaptar o aluno às operações de pouso e decolagem em cenário de baixa luminosidade. À noite,
  as percepções visuais de distância do solo e velocidade em relação ao solo são alteradas,
  de modo que um piloto não instruído pode julgar mal tais dados e causar pouso brusco ou
  a colisão da aeronave com o solo.

  Em virtude das claras diferenças entre os procedimentos de aproximação e pouso em cada categoria
  de aeronave, é razoável afirmar que a instrução de pousos e decolagens no período noturno
  em uma categoria não pode ser considerada suficiente para adaptar o piloto a realizar tais
  operações em outra categoria diversa.

  Dessa forma, concluímos que o piloto que faça jus à redução de horas de voo prevista nos
  parágrafos 61.81(a)(1)(ii), 61.81(a)(2)(ii)(A) e 61.81(a)(3)(ii)(A) do RBAC nº 61 pode abater
  horas somente da fase de instrução em duplo comando.

  Adicionalmente, vale relembrar que o regulamento prevê apenas os parâmetros mínimos requeridos
  pela ANAC para a formação de um piloto. É responsabilidade do instrutor de voo garantir
  que o aluno somente prossiga para as próximas fases da instrução e para o exame de proficiência
  quando estiver realmente apto a fazê-lo com segurança, ainda que isso implique em aumento
  do tempo total de instrução.

  PALAVRAS-CHAVE

  ABATIMENTO DE HORAS; 61.81; PILOTO PRIVADO; PP; PPH; PPA.


  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: Piloto português: exercício de função remunerada a bordo de aeronave de matrícula
  brasileira

  Código:

  DI-SPL 0002

  Rev: B

  Aprovada originalmente em: 11/3/2016 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.43(c)

  QUESTÃO

  O parágrafo 61.43(c) do RBAC nº 61 permite que portugueses detentores de licença de piloto
  comercial, tripulação múltipla ou de linha aérea exerçam função remunerada a bordo de aeronave
  de matrícula brasileira, conforme disposto no §1º do art. 156 do CBA.

  O problema é que o §1º do art. 156 do CBA se aplica apenas a brasileiros natos e naturalizados
  e não inclui os portugueses que possuam igualdade de direitos e obrigações civis.

  O Decreto nº 70.436, de 18 de abril de 1972, ainda vigente, que versa sobre a igualdade
  dos direitos e obrigações civis a portugueses, é totalmente omisso com relação ao exercício
  de outras atividades profissionais além do magistério (cf. o art. 14), de modo que não se
  consegue nele fundamentar a função remunerada a bordo de aeronave de portugueses que possuam
  igualdade de direitos e obrigações civis.

  A Lei 7.184/84 (Lei do Aeronauta) também versa, em seu art. 3º que, “ressalvados os casos
  previstos no Código Brasileiro do Ar, a profissão de aeronauta é privativa de brasileiros”,
  e é totalmente silente com relação aos portugueses que possuam igualdade de direitos e obrigações
  civis.

  Neste caso, pergunta-se se o disposto no parágrafo 61.43(c) do RBAC nº 61 não estaria conflitando
  com a legislação vigente e extrapolando as suas atribuições ao permitir o exercício de função
  remunerada a bordo de aeronave de matrícula brasileira.

  INTERPRETAÇÃO

  O cidadão português, beneficiário do estatuto da igualdade (igualdade de direitos), concedido
  mediante decisão do Ministério da Justiça, pode exercer função remunerada a bordo de aeronave
  de matrícula brasileira tal como um cidadão brasileiro. Dessa forma, o disposto no parágrafo
  61.43(c) do RBAC nº 61 não conflita com a atual legislação vigente.

  FUNDAMENTO DA INTERPRETAÇÃO

  O Parecer n. 00030/2015/CMF/PFANAC/PGF/AGU, item 18, esclarece:

  “Nesse caso, a norma deve ser interpretada em compatibilidade com o disposto nos §§ 1º e
  2º do art. 12 da Constituição Federal, que equiparou, em direitos, os portugueses com residência
  permanente no Brasil aos brasileiros naturalizados. De efeito, embora os conceitos não coincidam,
  é possível depreender, a partir de uma interpretação conforme o atual ordenamento constitucional,
  que, permitindo a norma o exercício de função remunerada a bordo de aeronaves nacionais
  por brasileiros naturalizados, está também permitindo o exercício dessa atividade aos portugueses
  portadores de igualdade de direitos. Entende-se, portanto, recepcionada a norma, restando
  apenas a restrição de reciprocidade em favor de brasileiros”.

  O § 1º do art. 12 da Constituição Federal versa:

  § 1º Aos portugueses com residência permanente no País, se houver reciprocidade em favor
  de brasileiros, serão atribuídos os direitos inerentes ao brasileiro, salvo os casos previstos
  nesta Constituição.

  A Constituição, por sua vez, não prevê nenhum caso de distinção relativa à atividade aeronáutica,
  de modo que restou verificar apenas a reciprocidade em favor de brasileiros.

  Consultada a Autoridade Nacional da Aviação Civil portuguesa, esta assim se manifestou,
  por meio do Ofício nº 236/GabJur/PCA/2015, protocolado na ANAC sob o número 00058.083329/2015-27:

  “Dispõe o n.º 3 do artigo 15.º da Constituição da República Portuguesa, que aos cidadãos
  dos Estados de língua portuguesa (nos quais se incluem os cidadãos brasileiros), com residência
  permanente em Portugal, são reconhecidos, nos termos da lei e em condições de reciprocidade,
  direitos não conferidos a estrangeiros. Note-se, contudo, que esta norma exige que o cidadão,
  in casu, o cidadão brasileiro, tenha residência permanente em Portugal.”

  A condição, portanto, não difere do exposto no art. 12, § 1º da Constituição brasileira.
  O referido Ofício então continua:

  “E, ainda, nos termos do artigo 12.º do Tratado de Amizade, Cooperação e Consulta entre
  a República Portuguesa e a República Federativa do Brasil, assinado em Porto Seguro, em
  22 de abril de 2000, aprovado pela Resolução da Assembleia da República n.º 83/2000 e ratificado
  pelo Decreto do Presidente da República n.º 79/2000, ambos de 14 de dezembro, os portugueses
  no Brasil e os brasileiros em Portugal, beneficiários do estatuto da igualdade, gozarão
  dos mesmos direitos e estarão sujeitos aos mesmos deveres dos nacionais desses Estados.
  E, de acordo com o artigo 46.º do mesmo Tratado, os nacionais de uma das Partes Contratantes
  poderão aceder a uma profissão e exercê-la, no território da outra Parte Contratante, em
  condições idênticas às exigidas aos nacionais desta última. Por fim, nos termos do artigo
  47.º do Tratado em apreço, se o acesso a uma profissão ou o seu exercício se acharem regulamentados
  no território de uma das Partes Contratantes por disposições decorrentes da participação
  desta num processo de integração regional, poderão os nacionais da outra Parte Contratante
  aceder naquele território a essa profissão e exercê-la em condições idênticas às prescritas
  para os nacionais dos outros Estados participantes nesse processo de integração regional.
  (...)

  Portanto, no caso de que nos ocupamos, quer a Constituição da República Portuguesa, quer
  o Tratado de Amizade, Cooperação e Consulta entre a República Portuguesa e a República Federativa
  do Brasil apontam, com base em critérios de reciprocidade, para uma igualdade de direitos
  dos cidadãos brasileiros em Portugal e dos cidadãos portugueses.”

  Não resta dúvidas, portanto, pelo acima exposto, que um cidadão brasileiro que tenha residência
  permanente em Portugal poderia obter uma licença nos termos da legislação e regulamentações
  adotadas por Portugal, assim como exercer uma profissão. Neste caso, a Constituição brasileira
  confere o mesmo direito ao cidadão português com residência permanente no Brasil, desde
  que cumpra a legislação e as regulamentações brasileiras. Dessa forma, o disposto no parágrafo
  61.43(c) do RBAC nº 61 não conflita com a atual legislação brasileira vigente.

  É importante ressaltar que esta interpretação é válida somente enquanto forem mantidas as
  disposições do art. 12, § 1º da Constituição brasileira e enquanto forem mantidas as disposições
  da legislação portuguesa que garantem a reciprocidade de tratamento dos pilotos brasileiros
  que exerçam função remunerada a bordo de aeronaves portuguesas.

  Fundamentos baseados no processo administrativo nº 00058.045315/2015-13.

  PALAVRAS-CHAVE

  CIDADÃO PORTUGUÊS COM IGUALDADE DE DIREITOS E OBRIGAÇÕES CIVIS, CIDADÃO PORTUGUÊS COM RESIDÊNCIA
  PERMANENTE NO BRASIL, RBAC nº 61.43(c)


  Superintendência de Pessoal da Aviação Civil - SPL

