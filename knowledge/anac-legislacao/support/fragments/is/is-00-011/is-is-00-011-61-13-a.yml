section_title: Solicitação de licenças, certificados e/ou habilitações
subsection_id: a
cite: 61.13(a)
title: 61.13(a)
text: '(a) A solicitação para a concessão de uma licença/certificado e/ou de uma habilitação
  de acordo com este Regulamento deve ser feita por meio de preenchimento de formulário próprio,
  apresentado à ANAC, o qual deve ser enviado por via eletrônica disponibilizada pela ANAC,
  após o requerente ter atendido aos requisitos de idade, grau de instrução, aptidão psicofísica,
  conhecimentos teóricos, instrução de voo, experiência de voo e aprovação em exame de proficiência
  previstos neste Regulamento, correspondentes à licença/certificado e/ou habilitação requerida.
  Para tanto:

  A dúvida tem se apresentado nos processos de concessão de uma licença e/ou habilitação quando
  a ANAC tem se deparado com frequência com situações em que o requisito de exame de proficiência
  foi cumprido antes do cumprimento dos demais requisitos, tais como instrução de voo e experiência
  de voo.

  Como orientação para a correta interpretação do requisito, é importante destacar o que prevê
  a legislação internacional, especialmente o Anexo 1 à Convenção de Aviação Civil Internacional
  e o 14 CFR Part 61 da FAA dos EUA. O texto foi esquematizado em tabela para facilitar a
  compreensão:

  Normatização internacional'
