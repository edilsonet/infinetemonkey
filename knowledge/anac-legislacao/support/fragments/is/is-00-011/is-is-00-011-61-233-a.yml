title: 61.233(a)
text: '(a) O candidato a uma habilitação de instrutor de voo deve cumprir o seguinte:

  (3) ter sido aprovado em exame teórico da ANAC ou aprovado pela ANAC, para a habilitação
  de instrutor de voo referente à categoria a que pretenda obter a habilitação;”

  De leitura expressa do texto acima destacado, entende-se que é necessário que um postulante
  à habilitação de Instrutor de Voo realize quantos Exames Teóricos quantas as categorias
  de aeronave que o mesmo postulante deseja atuar como tal.

  Contudo, há que se verificar os seguintes pontos, para melhor entender e esclarecer a questão
  técnica que se apresenta: conteúdo do Exame Teórico relacionado à habilitação de Instrutor
  de Voo; SARP ICAO e práticas internacionais.

  Para avaliar o conteúdo do Exame Teórico relacionado à habilitação de instrutor de voo,
  lança-se mão da verificação do conteúdo da Instrução Suplementar 141-007 (IS 141-007), que,
  dentre outras coisas, define o conteúdo programático dos cursos de formação de Instrutor
  de Voo.

  A seção 7.5, da citada IS 141-007, traz, em seu parágrafo inicial, o seguinte texto: “O
  candidato a uma habilitação de instrutor de voo de avião deve realizar um curso teórico,
  aprovado pela ANAC, de conteúdo comum a todas as categorias de aeronave, conforme especificado
  a seguir. Após a realização do curso, o candidato deve ser aprovado no exame teórico da
  ANAC.” (grifo meu)

  Portanto, já neste momento, resta clara a política técnica desta ANAC de que as competências
  técnicas relacionadas à habilitação de Instrutor de Voo são únicas, independentemente da
  categoria de aeronave a que se quer ministrar instrução.

  Importante esclarecer que, apesar do exposto acima, é imprescindível que o Instrutor de
  Voo esteja devidamente habilitado e qualificado na(s) aeronave(s) que pretende ministrar
  instrução, dada a evidente necessidade de possuir conhecimentos técnico-operacionais relacionados
  à específica aeronave utilizada para ministrar as instruções de voo.

  Com relação aos SARPs ICAO, é necessário verificar o conteúdo do Anexo 1 à Convenção de
  Chicago, no que se refere à habilitação de Instrutor de Voo.

  A definição dos requisitos específicos relacionados à citada habilitação é encontrada na
  seção 2.8 do já citado Anexo 1.

  Nesta seção, encontra-se o seguinte:

  “2.8.1.1 Knowledge

  The applicant shall have met the knowledge requirements for the issue of a commercial pilot
  licence as appropriate to the category of aircraft included in the licence. In addition,
  the applicant shall have demonstrated a level of knowledge appropriate to the privileges
  granted to the holder of a flight instructor rating, in at least the following areas:” (grifo
  meu)

  Da leitura atenta do exposto na seção 2.8.1.1 do Anexo 1, esse GCEP extrai o seguinte:

  O postulante a uma habilitação de instrutor de voo deve possuir licença de Piloto Comercial
  e ter conhecimento apropriado da categoria de aeronave que pretende ministrar instrução
  de voo. Frisa-se que tal entendimento já havia sido exposto nesse documento, conforme o
  descrito acima.

  O postulante a uma habilitação de instrutor de voo deve demonstrar nível de conhecimento
  adicional, apropriado e exclusivo sobre competências relacionadas à atividade de instrução
  de voo, independente da categoria de aeronave a que se pretende dar a instrução. Reforça
  essa leitura do requisito a lista de conhecimentos específicos que devem ser aferidos junto
  ao postulante da habilitação de Instrutor de Voo:

  “a) techniques of applied instruction;'
