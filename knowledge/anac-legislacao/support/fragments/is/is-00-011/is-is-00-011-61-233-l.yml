text: 'l) hazards involved in simulating system failures and malfunctions in the aircraft.”

  Então, evidencia-se a esse GCEP que a ICAO acaba por não distinguir as competências instrucionais
  que devem ser auferidas a um candidato à habilitação de Instrutor de Voo, em função da categoria
  de aeronave que se pretende ministrar as instruções de voo.

  Passando a verificar o definido pelo FAA em seu CFR 14 Part 61, constata-se, da leitura
  da seção 61.183 do citado documento, que a autoridade Norte-Americana traz as mesmas definições
  e estrutura de requisitos estabelecida no Anexo 1 ICAO.

  Consequentemente, resta também evidenciado que a FAA acaba por não distinguir as competências
  instrucionais que devem ser auferidas a um candidato à habilitação de Instrutor de Voo,
  em função da categoria de aeronave que se pretende ministrar as instruções de voo.


  EXAME TEÓRICO; INSTRUTOR DE VOO, 61.233.'
