title: 61.245(b)
text: '(b) Helicóptero

  (1) Un total de cuarenta (40) horas de instrucción y de vuelo solo, que deben incluir por
  lo menos:

  (iii) un vuelo de travesía de un mínimo de cien (100) millas náuticas [ciento ochenta (180)
  km] durante el cual se habrán realizado dos (2) aterrizajes completos en dos (2) aeródromos
  diferentes;

  Subpart E - Private Pilots

  §61.109 Aeronautical experience.'
