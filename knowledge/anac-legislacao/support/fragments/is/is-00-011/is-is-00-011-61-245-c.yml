text: '(c) For a helicopter rating. Except as provided in paragraph (k) of this section, a
  person who applies for a private pilot certificate with rotorcraft category and helicopter
  class rating must log at least 40 hours of flight time that includes at least 20 hours of
  flight training from an authorized instructor and 10 hours of solo flight training in the
  areas of operation listed in §61.107(b)(3) of this part, and the training must include at
  least-

  (4) 10 hours of solo flight time in a helicopter, consisting of at least-

  (ii) One solo cross country flight of 100 nautical miles total distance, with landings at
  three points, and one segment of the flight being a straight-line distance of more than
  25 nautical miles between the takeoff and landing locations; and


  Consultando a legislação internacional, observou-se que o requisito foi incluído no RBAC
  nº 61 em harmonização ao LAR 61.245(a)(1)(iii) e 61.245(b)(1)(iii), em uma tradução livre
  muito próxima ao texto original. Contudo, na leitura do parágrafo 2.3.4.1.2 do Anexo 1 à
  Convenção de Aviação Civil Internacional, há o entendimento de que no curso do voo de navegação
  deverá haver pousos em dois pontos diferentes, o que parece não considerar o aeródromo de
  origem. A dúvida é finalmente diluída quando da consulta ao 14 CFR Part 61 Part 61.109(c)(4)(ii),
  cujo regulamento afirma que são necessárias aterrissagens em pelo menos três pontos distintos,
  o que neste caso poderia incluir o aeródromo de origem.

  Dessa forma, concluímos que os parágrafos 61.81(a)(1)(i)(C) e 61.81(a)(2)(i)(C) do RBAC
  nº 61 admitem a aterrissagem em dois aeródromos diferentes, deles excluindo-se o aeródromo
  de origem do voo. A interpretação pauta-se no entendimento de que as duas aterrissagens
  devem ocorrer durante o voo de navegação, o que exclui o aeródromo de início e/ou o destino
  final, especialmente quando o texto diz "durante o qual" (ou seja, durante o voo de navegação)
  “se realizem, ao menos, 2 (duas) aterrissagens completas em aeródromos diferentes", descartando-se,
  portanto, o aeródromo de origem e destino final no cômputo destas aterrissagens e aproximando-se
  do entendimento do Anexo 1 da à Convenção de Aviação Civil Internacional. Assim, essa interpretação
  está coerente com o texto adotado pela FAA e com o que sinaliza o Anexo 1 à Convenção de
  Aviação Civil Internacional.

  Além do texto da regulamentação internacional de referência que indica claramente a necessidade
  de serem três pontos, é necessário que seja feita uma rota onde a avaliação do tempo, bússola
  e mapa possa contribuir para a experiência do piloto. Uma navegação com três pontos de pouso
  e decolagem é mais complexa do que uma simples ida e volta, e por isso mesmo é mais recomendada
  para aprimorar a experiência da navegação visual do futuro piloto.

  PALAVRAS-CHAVE

  61.81; ATERRISSAGENS; AÉRODROMOS DIFERENTES; PILOTO PRIVADO.


  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: Definição do termo ininterrupto presente no RBAC nº 61.

  Código:

  DI-SPL 0006

  Rev: B

  Aprovada originalmente em: 3/7/2018 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.81(a)(1)(i), 61.81(a)(2)(i), 61.101(a)(1)(i), 61.101(a)(1)(i)(A), 61.101(a)(2)(i), 61.101(a)(3)(i)

  QUESTÃO

  Os parágrafos 61.81(a)(1)(i), 61.81(a)(2)(i), 61.101(a)(1)(i), 61.101(a)(1)(i)(A), 61.101(a)(2)(i),
  61.101(a)(3)(i) do RBAC nº 61, preveem a possibilidade de que um piloto tenha reduzida a
  quantidade de horas previstas no respectivo requisito de experiência, desde que acumule
  estas horas na realização completa, ininterrupta e com aproveitamento de um curso aprovado
  pela ANAC.

  Portanto, questiona-se a definição do termo “ininterrupta” no requisito.

  INTERPRETAÇÃO

  O termo “ininterrupta” não se refere a questões temporais, mas a continuidade do programa
  de treinamento aprovado. Exemplifica-se que, se o treinamento for paralisado por qualquer
  período, a retomada do curso deverá seguir a sequência de atividades previstas no programa
  de treinamento.

  FUNDAMENTO DA INTERPRETAÇÃO

  O Anexo 1 à Convenção de Chicago não traz qualquer referência a requisitos temporais de
  como deverá ser feita a realização de horas de voo de instrução, durante um curso aprovado.
  Entende-se que não há ganho, pedagogicamente, com o descarte de horas de voo de instrução
  já acumuladas com o objetivo de se adquirir experiência para se obter uma determinada licença.

  Os CIACs possuem procedimentos e critérios para readaptar o aluno a uma condição atual e
  dar continuidade nas atividades previstas no programa de treinamento.

  PALAVRAS-CHAVE

  ABATIMENTO DE HORAS; 61.81; PILOTO PRIVADO; PP; PPH; PPA; PC; PCH; PCA.


  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: Necessidade de se revalidar uma habilitação de tipo ainda válida quando um PC se
  candidata a uma licença de PLA.

  Código:

  DI-SPL 0007

  Rev: B

  Aprovada originalmente em: 3/7/2018 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.139(d)

  QUESTÃO

  O parágrafo 61.139(d) do RBAC nº 61, prevê a possibilidade de que candidato a uma licença
  de piloto de linha aérea para qualquer categoria de aeronave deve ter atendido aos requisitos
  estabelecidos no RBAC nº 61 para a concessão ou revalidação da habilitação relativa à aeronave
  em que seja realizado o exame de proficiência.

  Diante disso, questionou-se a necessidade de se revalidar uma habilitação de tipo ainda
  válida quando um piloto comercial (PC) se candidata a uma licença de piloto de linha aérea
  (PLA), tendo em vista a imprecisão temporal do texto “deve ter atendido aos requisitos estabelecidos
  neste Regulamento para a concessão ou revalidação da habilitação relativa à aeronave”.

  INTERPRETAÇÃO

  Caso o candidato a uma licença de piloto de linha aérea (PLA) já possua válida a habilitação
  de classe ou tipo correspondente à aeronave em que realizará o exame de proficiência para
  fins de obtenção da licença de PLA, não há necessidade de revalidar a referida habilitação
  em conjunto com a obtenção da licença de PLA.

  Do contrário, isto é, caso NÃO possua a habilitação de classe ou tipo correspondente à aeronave
  em que realizará o exame de proficiência para fins de obtenção da licença de PLA ou, caso
  a possua, se esta estiver vencida, deverá, adicionalmente, cumprir com os requisitos previstos
  no RBAC nº 61 para a sua concessão ou revalidação, conforme aplicável.

  Cabe ressaltar que esta interpretação não isenta qualquer necessidade de revalidação de
  habilitação nem estende o qualquer prazo de validade.

  FUNDAMENTO DA INTERPRETAÇÃO

  A dúvida tem se apresentado nos processos de concessão de uma licença de PLA quando o regulado
  já possui habilitação de tipo válida.

  Como orientação para a correta interpretação do texto do requisito, esta SPL entende que
  uma vez o candidato a PLA possua habilitação prévia válida de uma aeronave classe ou tipo,
  não há obrigatoriedade em revalidá-la em conjunto com o exame de proficiência para a obtenção
  da licença de PLA.

  PALAVRAS-CHAVE

  EXAME DE PROFICIÊNCIA; 61.139; HABILITAÇÃO; PILOTO DE LINHA AÉREA; PLA


  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: prerrogativa de examinadores credenciados de CIAC

  Código:

  DI-SPL 0008

  Rev: B

  Aprovada originalmente em: 6/9/2018 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.13(a) e 141.97(a)

  QUESTÃO

  O parágrafo 61.13(a) do RBAC nº 61 explicita que a “aprovação em exame de proficiência”
  constitui-se de um dos requisitos para a solicitação de uma licença e/ou habilitação.

  O parágrafo 141.97(a) do RBAC nº 141 explicita que o examinador credenciado do CIAC SÓ PODE
  realizar exames práticos de piloto após o CIAC verificar e atestar que o candidato cumpre
  todos os requisitos teóricos e práticos para obter ou revalidar a licença, habilitação ou
  certificado a que se refere o exame.

  Diante disso questiona-se: pode o CIAC realizar exame de proficiência de candidatos que
  realizaram parte do curso fora de entidade?

  INTERPRETAÇÃO

  Os exames de proficiência para convalidação de licença e/ou habilitações e para revalidação
  de habilitação NÃO REQUEREM que o candidato tenha realizado curso na entidade na qual o
  examinador credenciado esteja vinculado.

  Os exames de proficiência para concessão de licença e/ou habilitação REQUEREM que o candidato
  tenha concluído o curso e possua certificado de conclusão expedido pela entidade na qual
  o examinador credenciado esteja vinculado.

  FUNDAMENTO DA INTERPRETAÇÃO

  A prerrogativa dos examinadores credenciados de CIAC é realizar exame de proficiência com
  vista a concessão ou convalidação de licença e/ou concessão, convalidação ou revalidação
  de habilitações, conforme licenças e habilitações expressamente descritas no Ofício de credenciamento.

  O parágrafo 141.97(a) do RBAC nº 141 prevê que “examinador credenciado do CIAC só pode realizar
  exames práticos de piloto após o CIAC verificar e atestar que o candidato cumpre todos os
  requisitos teóricos e práticos para obter ou revalidar a licença, habilitação ou certificado
  a que se refere o exame”. Dessa forma, os cursos certificados para os CIAC tratam apenas
  de concessão de licença e/ou habilitação, o que torna obrigatória, portanto, a conclusão
  e emissão de certificado de conclusão previamente a realização do exame de proficiência
  por examinador credenciado vinculado à entidade. Também não se concebe que um candidato
  seja submetido a exame de proficiência sem que tenha concluído a parte prática do curso.

  Por outro lado, não há curso certificado pela ANAC para a convalidação de licença(s) e/ou
  habilitação(ões) ou para a revalidação(ões) de habilitação(ões). Por não haver provisão
  de conclusão de curso em tais casos, entende-se que o CIAC poderá, por meio do seu examinador
  credenciado, realizar o exame de proficiência, conforme prerrogativas explícitas no seu
  Ofício de credenciamento.

  PALAVRAS-CHAVE

  EXAME DE PROFICIÊNCIA; 61.13; 141.97.


  Superintendência de Pessoal da Aviação Civil - SPL

