text: '61.29

  QUESTÃO

  A seção 61.29 do RBAC nº 61 prevê as regras para contagem e registro de horas de voo por
  pilotos.

  Pelo previsto nos parágrafos 61.29(d) e 61.29(e), se observa que o piloto segundo em comando
  de uma aeronave “single pilot” (isto é, certificada para tripulação mínima de um piloto),
  somente pode contar tais horas nos casos em que “devido à operação, a ANAC determinar que
  necessite de um segundo em comando”.

  No entanto, o registro de horas na função de segundo em comando (SIC) em aeronaves single
  pilot se faz necessário para o cumprimento da experiência recente, bem como para eventuais
  finalidades pessoais, tais como controle de horas totais voadas, comprovação de experiência
  profissional prévia para fins de participação em processos seletivos de operadores aéreos,
  etc.

  Desse modo, pergunta-se: o piloto segundo em comando que operar aeronave single pilot em
  casos fora dos previstos nos parágrafos 61.29(d) e 61.29(e) pode registrar tais horas em
  sua Caderneta Individual de Voo (CIV)? Em caso afirmativo, em qual campo da CIV devem ser
  lançadas essas horas?

  INTERPRETAÇÃO

  O piloto segundo em comando que operar uma aeronave single pilot em casos fora dos previstos
  nos parágrafos 61.29(d) e 61.29(e) do RBAC nº 61 pode registrar tais horas em sua CIV. O
  piloto deve, neste caso, registrar integralmente o tempo de voo no campo “CO-PILOTO” de
  sua CIV.

  O piloto NÃO PODE apresentar tais horas à ANAC para fins de solicitação de uma licença.

  O piloto PODE, entretanto, utilizar tais horas para outras finalidades que não a concessão
  de licença, tais como comprovar experiência recente, comprovar experiência para fins profissionais
  (ficando a critério do empregador aceitar ou não tais horas), etc.

  Caso o piloto opere como segundo em comando de aeronave single pilot em um operador de táxi
  aéreo, sob a previsão da seção 135.101 do RBAC nº 135, as horas PODEM ser consideradas para
  fins de concessão de uma licença de grau superior desde que sejam comprovadas mediante declaração
  de horas de voo expedida pelo operador.

  FUNDAMENTO DA INTERPRETAÇÃO

  O RBAC nº 61 é o regulamento que trata das licenças, habilitações e certificados de pilotos,
  estabelecendo os requisitos que devem ser atingidos para sua concessão e revalidação.

  Dentre as previsões do regulamento, a seção 61.29 é a responsável por disciplinar a “contagem
  e registro de horas de voo”, dentro da qual se encontram os parágrafos 61.29(d) e (e):'
