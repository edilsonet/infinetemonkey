cite: 61.29(d)
title: 61.29(d)
text: (d) Para fins de contagem das horas de voo, para concessão de uma licença de piloto
  de grau superior, o titular de uma licença de piloto quando atuar como segundo em comando
  de uma aeronave certificada para operação com tripulação mínima de 1 (um) piloto, mas que,
  devido à operação, a ANAC determinar que necessite um segundo em comando, deve registrar
  as horas de voo considerando, no máximo, 50% (cinquenta por cento) do tempo de voo na função
  de segundo em comando. (Redação dada pela Resolução nº 378, de 18.03.2016)
