section_title: Contagem e registro de horas de voo
subsection_id: e
cite: 61.29(e)
title: 61.29(e)
text: '(e) No caso do estabelecido no parágrafo (d) desta seção, o segundo em comando pode
  registrar integralmente as horas de voo se a aeronave possuir uma posição de segundo em
  comando devidamente equipada para operar com segundo em comando.

  Se por um lado a regra é clara ao informar que as horas realizadas como segundo em comando
  de aeronave single pilot somente são aceitáveis nos casos em que houver uma regra de operação
  que determine a presença do segundo em comando a bordo (ex: RBAC nº 135.101), por outro
  o trecho grifado deixa expresso que todo o teor do parágrafo somente se aplica à contagem
  de horas de voo para fins de concessão de uma licença de piloto de grau superior (isto é,
  para obter uma licença “superior” à que o piloto interessado possui).

  Em outras palavras, os itens 61.29(d) e (e), assim como de fato toda a seção 61.29, pretendem
  somente estabelecer quais horas são aceitas pela ANAC como comprovação de experiência em
  processos de concessão de licença de pilotos, e não restringir completamente o lançamento
  em si das horas de voo em CIV pelos pilotos.

  Isso ocorre porque a CIV é um documento pessoal de experiência, de responsabilidade de seu
  detentor, que tem apenas como uma de suas finalidades a comprovação de experiência perante
  a ANAC, mas certamente não se trata de seu único propósito. Não há restrição regulamentar
  para que tal documento seja utilizado para outros fins, tais como controle pessoal das horas
  voadas, registro de horas para fins profissionais e comprovação de experiência recente na
  classe/tipo perante a ANAC.

  Quanto a esta última, note-se que caso o lançamento da experiência como SIC em aeronave
  single pilot fosse vedado, tornar-se-ia impossível ao piloto que tenha perdido a experiência
  recente comprovar à ANAC que a recuperou, uma vez que o método regular para tal recuperação
  é realizar, na função de segundo em comando (já que o piloto nesse caso está impedido de
  atuar como piloto em comando), os pousos e/ou procedimentos previstos na seção 61.21 do
  RBAC nº 61.

  Desse modo, para exemplificar esta interpretação, podemos afirmar que um piloto comercial
  que atue como segundo em comando de aeronave registrada para tripulação mínima de um piloto
  poderá registrar tais horas integralmente no campo “CO-PILOTO” de sua CIV, mas não poderá
  apresentar tais horas à ANAC para a comprovação das horas de voo requeridas pela seção 61.141
  para a obtenção de uma licença de PLA, e caso as apresente, terá tais horas desconsideradas
  por esta Agência.

  Ressalte-se, por fim, que este entendimento está de acordo com o previsto na regra que deu
  origem à previsão constante do RBAC nº 61, qual seja, o Anexo 1 à Convenção sobre Aviação
  Civil Internacional (Convenção de Chicago), que também limita a aplicabilidade da regra
  ao registro de horas para fins de concessão de uma licença de grau superior:'
