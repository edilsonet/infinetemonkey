cite: 61.39(i)
title: 61.39(i)
text: '(i) Has received and logged training time within 2 calendar months preceding the month
  of application in preparation for the practical test;


  (ii) Is prepared for the required practical test; and


  (iii) Has demonstrated satisfactory knowledge of the subject areas in which the applicant
  was deficient on the airman knowledge test; and


  (7) Have a completed and signed application form.

  Note-se que no Anexo 1 à Convenção de Aviação Civil Internacional os requisitos para a emissão
  da licença e/ou habilitação encontram-se dispostos em dois parágrafos distintos, sendo o
  parágrafo 2.1.1.3.1 um detalhamento do parágrafo 2.1.1.3. No parágrafo 2.1.1.3 estão dispostos
  os requisitos de idade, conhecimento, experiência, instrução de voo, habilidade e aptidão
  psicofísica. Já o parágrafo 2.1.1.3.1 pontua a forma de demonstração dos requisitos de conhecimento
  e habilidade. Isso favorece a interpretação de que após o cumprimento dos requisitos estabelecidos
  no parágrafo 2.1.1.3. o candidato deve demonstrar o domínio de conhecimento e habilidade
  específicos para a obtenção da licença ou habilitação pretendida.

  O mesmo entendimento pode ser aplicado à seção 61.39 do 14 CFR Part 61, que elenca os pré-requisitos
  para o exame de proficiência. Entre eles, destaca-se o parágrafo 61.39(a)(3) que informa
  a necessidade de realização do treinamento de voo requerido e a obtenção da experiência
  aeronáutica como pré-requisitos para a realização dos exames práticos.

  Dessa forma, concluímos que o exame de proficiência deve ser entendido como a etapa final
  do processo e cumprido somente após o atendimento satisfatório dos demais requisitos na
  ordem em que são apresentados no Regulamento.

  Adicionalmente, vale lembrar que a ausência de quaisquer requisitos que devem anteceder
  o exame de proficiência invalida sua realização para fins de composição de processo de solicitação
  de licença e/ou habilitação, mesmo que realizados a posteriori para fins de conclusão do
  processo de licenciamento ou habilitação. Nestes casos, o candidato deverá submeter novo
  processo, apresentando nova FAP que certifique que o solicitante foi avaliado somente após
  completar os requisitos de instrução ou experiência mínimos requeridos no RBAC nº 61.

  PALAVRAS-CHAVE

  61.13; ORDEM DE CUMPRIMENTO DE REQUISITOS; EXAME DE PROFICIÊNCIA; INSTRUÇÃO DE VOO; EXPERIÊNCIA
  DE VOO; EMISSÃO DE LICENÇA E/OU HABILITAÇÃO.


