section_title: Requisitos de experiência para a concessão da licença de piloto privado
subsection_id: i
cite: 61.81(i)
title: 61.81(i)
text: '(i) um total de 40 (quarenta) horas de instrução e voo solo, ou 35 (trinta e cinco)
  horas de instrução e voo solo, se estas foram efetuadas, em sua totalidade, durante a realização
  completa, ininterrupta e com aproveitamento de um curso de piloto privado de helicóptero
  aprovado pela ANAC. As horas totais devem incluir, pelo menos:

  (C) 1 (um) voo de navegação de, no mínimo, 100 (cem) milhas náuticas, equivalentes a 180
  (cento e oitenta) quilômetros durante o qual se realizem, ao menos, 2 (duas) aterrissagens
  completas em aeródromos diferentes;

  No entanto, não está claro no texto do Regulamento se um pouso no aeródromo de origem e/ou
  destino final pode ser computado nas duas aterrisagens previstas.

  Portanto, questiona-se: o candidato a uma licença de piloto privado pode considerar o aeródromo
  de origem como um dos dois aeródromos diferentes para a realização das aterrissagens completas
  requeridas pelo Regulamento?

  INTERPRETAÇÃO

  Além de aterrissar no aeródromo de origem, no retorno, o candidato à licença de PP deve
  realizar outras duas aterrisagens completas durante o voo de navegação em aeródromos distintos
  (dois aeródromos diferentes do aeródromo de origem e/ou destino final).

  FUNDAMENTO DA INTERPRETAÇÃO

  A origem da dúvida reside no fato de que embora esteja claro no texto do Regulamento que
  são necessárias duas aterrissagens completas em aeródromos diferentes, não se especifica
  se um destes aeródromos pode ou não ser o aeródromo de origem do voo de navegação.

  Como orientação para a correta interpretação do requisito, é importante destacar o que prevê
  o Anexo 1 à Convenção de Aviação Civil Internacional, o LAR 61 e o 14 CFR Part 61 da FAA
  dos EUA. O texto foi esquematizado em tabela para facilitar a compreensão:


  Normatização internacional'
