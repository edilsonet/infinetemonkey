title: APÊNDICE C - Diretrizes Interpretativas da SPL
text: 'APÊNDICE C - Diretrizes Interpretativas da SPL

  Superintendência de Pessoal da Aviação Civil - SPL

  DIRETRIZ INTERPRETATIVA

  Assunto: Abatimento de horas para a Licença de Piloto Privado

  Código:

  DI-SPL 0001

  Rev: C

  Aprovada originalmente em: 26/2/2016 (na IS nº 00-004)

  Revisada em: 6/11/2020

  Regulamentos:

  Itens de Regulamento:

  61.81(a)(1)(ii), 61.81(a)(2)(ii)(A) e 61.81(a)(3)(ii)(A)

  QUESTÃO

  Os parágrafos 61.81(a)(1)(ii), 61.81(a)(2)(ii)(A) e 61.81(a)(3)(ii)(A) do RBAC nº 61 preveem
  a possibilidade de que um piloto obtenha a licença de Piloto Privado com um total de 25
  horas de voo na categoria, caso já possua licença em categoria de aeronave distinta da pretendida.

  No entanto, os parágrafos 61.81(a)(1)(i), 61.81(a)(2)(i) e 61.81(a)(3)(i) preveem mínimos
  específicos de horas de voo em instrução duplo comando, navegação, voo solo e voo noturno,
  e não fica claro quais desses mínimos podem ser reduzidos para se obter a licença com apenas
  25 horas de voo.

  Portanto, questiona-se: o piloto que faz jus à obtenção da licença de Piloto Privado com
  25 horas totais de voo pode abater horas da fase de instrução em duplo comando, solo, navegação,
  voo noturno ou de qualquer uma delas?

  INTERPRETAÇÃO

  O abatimento de horas pode incidir somente sobre as horas de instrução em duplo comando,
  devendo o piloto realizar integralmente, na categoria de aeronave para a qual deseje obter
  a licença, os mínimos previstos para voo solo (10h), voo em navegação (5h) e voo noturno
  (3h).

  FUNDAMENTO DA INTERPRETAÇÃO

  A origem da dúvida vem do fato de que, apesar de os parágrafos acima possibilitarem a redução
  das horas totais de voo para 25h, ao somar-se os tempos mínimos de instrução em duplo comando,
  voo solo (incluindo navegação) e voo noturno (parágrafos 61.81(a)(1) para PP Avião, 61.81(a)(2)
  para PP Helicóptero e 61.81(a)(3) para PP Aeronave de Sustentação por Potência), obtém-se
  um mínimo de 33 horas, e não há indicação de quais delas podem ser reduzidas para se chegar
  às 25h totais.

  Como orientação para a correta interpretação do requisito, é importante destacar o que prevê
  o Anexo 1 à Convenção de Aviação Civil Internacional. Conforme indicado abaixo aquele regulamento
  prevê também a possibilidade de redução (a critério da autoridade de cada país). O texto
  foi esquematizado em tabela para facilitar a compreensão:'
