title: 5.5.3.1
text: '5.5.3.1

  Ajuste em 5.5.3 e inclusão do item 5.5.3.1, definindo a aplicabilidade do seguro nos casos
  de instrução e nos casos de "autorização especial" nos termos da seção 103.5 e do parágrafo
  103.15(a)(1) do RBAC nº 103,.

  5.5.3.1, Nota

  Inclusão de notificação sobre o não prejuízo à exigência do seguro em razão da revogação
  do art. 178 do CBA.'
