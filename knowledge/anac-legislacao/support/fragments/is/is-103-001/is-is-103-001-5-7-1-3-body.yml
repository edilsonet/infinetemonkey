text: '5.7.1.3 Qualquer solicitação de autorização especial referente às normas relacionadas
  ao tráfego aéreo deve ser encaminhada diretamente ao DECEA.

  5.7.2. Uma vez concedida a autorização especial, o seu porte é obrigatório, em meio físico
  ou digital, conforme estabelecido no parágrafo 103.701(c)(1) do RBAC nº 103, para fins de
  fiscalização.

  5.8. Infrações

  5.8.1. A seção 103.701 estabelece correlação entre os requisitos do RBAC nº 103 e os dispositivos
  previstos na lei de contravenções e código penal com o objetivo de permitir que as forças
  locais de segurança pública atuem prontamente na repressão aos desvios que colocam em risco
  terceiros e o sistema de aviação civil.

  5.8.2. A atuação das forças de segurança locais independe de atuação da ANAC, não havendo
  necessidade de qualquer tipo de contato ou comunicação para a tomada de medidas cabíveis
  no âmbito legal em caso de identificação de infração. No entanto, se o fato for comunicado
  à ANAC, esta poderá também tomar medidas administrativas cabíveis.'
