text: 'OBJETIVO

  1.1. Estabelecer e esclarecer a forma de cumprimento dos requisitos dispostos no RBAC nº
  103 e a metodologia utilizada pela ANAC, em coordenação com Departamento de Controle do
  Espaço Aéreo (DECEA), para a administração das atividades aerodesportivas em veículos ultraleves.'
