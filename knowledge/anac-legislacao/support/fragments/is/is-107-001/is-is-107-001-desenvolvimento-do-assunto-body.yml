title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  Estrutura e Conteúdo do PSA

  Conforme previsto na seção 107.211 do RBAC nº 107, no PSA deve constar as medidas e os procedimentos
  de segurança a serem empregados pelo operador de aeródromo.

  Os recursos preventivos de segurança (Apêndice F), bem como os Planos e Programas (Apêndices
  G, H e I) previstos nesta Instrução Suplementar, juntamente com o Formulário de Dados AVSEC
  do Aeródromo (Apêndice E) e a Listagem de Inclusão de Medidas de Segurança e Procedimentos
  Alternativos, caso exista, compõem o PSA do operador de aeródromo.

  Os recursos preventivos de segurança (Apêndice F), bem como os Planos e Programas (Apêndices
  G, H e I) previstos nesta Instrução Suplementar não necessitam ser apresentados à ANAC para
  avaliação e aprovação.

  O operador de aeródromo deve apresentar o Formulário de Dados AVSEC do Aeródromo (Apêndice
  E), em formato digital, conforme orientações disponibilizadas na página eletrônica da ANAC
  na rede mundial de computadores.

  Os prazos para apresentação de alterações ao PSA à ANAC, assim como a definição dos casos
  que exigem análise e aprovação pela Agência, serão definidas por meio de regramento específico.

  Tópicos desta IS relacionados a requisito que não seja aplicável a determinado operador
  de aeródromo, nos termos do Apêndice A do RBAC nº 107, devem ser desconsiderados, não sendo
  necessária a apresentação de qualquer documentação à ANAC.

  Nos casos em que o operador de aeródromo pretenda implementar meio ou procedimento previsto
  na IS nº 107, mas que esteja relacionado a requisito que não lhe é aplicável, nos termos
  do Apêndice A do RBAC nº 107, deverá seguir o trâmite previsto para implementação de inclusão
  de medida de segurança, conforme item 5.2.

  A ANAC poderá disponibilizar, através de seu sítio eletrônico, modelos para orientar a elaboração
  de determinados documentos por parte do operador de aeródromo (formulários de testes de
  equipamentos, termos de credenciamento, PSESCA, PSTAV, entre outros).


  Inclusão de medidas de segurança ou de procedimentos alternativos ao disposto nesta Instrução
  Suplementar (Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos)

  Caso o operador de aeródromo pretenda incluir medida de segurança ou procedimento alternativo
  de segurança em relação ao disposto nesta IS, deverá obter aprovação prévia da ANAC.

  A proposta de inclusão de medida de segurança ou procedimento alternativo de segurança deverá
  ser encaminhada à ANAC com a apresentação do Formulário de Apresentação de Inclusão de Medida
  de Segurança ou Procedimento Alternativo, que contém a descrição da proposta do operador
  de aeródromo e respectivas justificativas.

  O Formulário deverá ser encaminhados à ANAC por meio do protocolo eletrônico, conforme instruções
  constantes na página eletrônica da Agência na rede mundial de computadores.

  Após aprovação da ANAC, as medidas adicionais de segurança ou procedimentos alternativos
  de segurança indicados pelo operador de aeródromo serão determinados pela Listagem de Inclusão
  de Medidas de Segurança e Procedimentos Alternativos, que passará a ser parte integrante
  do PSA do operador.

  A Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos será enviada
  pela ANAC ao operador de aeródromo, acrescentando à proposta de conteúdo contida no Formulário
  de Apresentação de Inclusão de Medida de Segurança e Procedimento Alternativo, a versão
  da listagem, o número da portaria de aprovação e a data da publicação.


  Análise e aprovação de pedido de inclusão de medida de segurança ou procedimento alternativo

  A análise de pedido de inclusão de medida de segurança ou procedimento alternativo de segurança
  ao disposto nessa IS é uma atividade realizada pela ANAC, com o objetivo de avaliar se o
  conteúdo que efetivamente seja adicional ou alternativo ao disposto nesta IS está de acordo
  com o previsto no RBAC 107 ou com o objetivo do procedimento descrito nesta IS.

  Somente serão analisadas as propostas que estiverem devidamente justificadas no Formulário
  de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo.

  A justificativa da proposta do operador de aeródromo deve conter elementos suficientes para
  demonstrar que:

  O pedido de inclusão de medida de segurança ou procedimento alternativo é exequível por
  parte do operador; e

  O pedido de inclusão de medida de segurança ou procedimento alternativo de segurança assegura
  um nível de segurança equivalente ou maior ao estabelecido no RBAC nº 107 ou no procedimento
  descrito nesta IS.

  A aprovação de inclusão de medida de segurança ou procedimento alternativo de segurança
  ao disposto nesta IS ocorrerá por meio de Portaria da Superintendência de Infraestrutura
  Aeroportuária.

  Somente após a publicação da Portaria de aprovação, a inclusão de medida de segurança ou
  procedimento alternativo passa a ser considerada como parte integrante do PSA do operador
  do aeródromo, em complementação ao disposto nessa IS e do Formulário de Dados AVSEC do Aeródromo
  (Apêndice E).


  Alterações de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC

  A alteração de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC segue o disposto nos itens e 5.3.'
