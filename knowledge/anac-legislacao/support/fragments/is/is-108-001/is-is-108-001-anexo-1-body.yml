text: 'ANEXO 1

  Relatório de Reciclagem


  Período avaliado: ___/___/___ a ___/___/___

  Avaliador: ____________________________________________________________

  Cargo do avaliador: _____________________________________________________

  Certificação AVSEC do avaliador: _________________________________________


  Nome do profissional

  Item avaliado (inserir código do comportamento em serviço) *

  Descrição dos conhecimentos e técnicas identificados como frágeis

  Resumo das atividades práticas

  Apto/

  Não apto


  * Caso os conhecimentos e técnicas identificados como frágeis não estejam listados na Atividade
  2 do Formulário de Avaliação do Treinamento em Serviço (comportamento em serviço), descreva-os
  de forma objetiva e sucinta. (ver Anexo 2)


  Declaro que as informações prestadas nesse formulário são verdadeiras e estou ciente de
  que minha conduta influencia diretamente a segurança da aviação civil contra atos de interferência
  ilícita. Declaro ainda estar ciente das medidas cabíveis caso se comprove a ocorrência de
  irregularidades, tendo em vista a importância dessa atividade para a garantia de realização
  de procedimentos de segurança de acordo com as normativas vigentes.


  Data: ____/____/____


  ____________________________________________

  Avaliador'
