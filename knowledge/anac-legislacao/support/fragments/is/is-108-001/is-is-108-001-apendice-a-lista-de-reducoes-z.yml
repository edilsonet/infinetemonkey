text: 'z) GABAER - Gabinete do Comandante da Aeronáutica

  aa) IATA - International Air Transport Association (Associação Internacional do Transporte
  Aéreo)

  bb) IRA - Informação Restrita de AVSEC

  cc) IS - Instrução Suplementar

  dd) OACI - Organização de Aviação Civil Internacional

  ee) PCQ/AVSEC - Programa de Controle de Qualidade de Segurança da Aviação Civil contra Atos
  de Interferência Ilícita

  ff) PF - Polícia Federal

  gg) PIAVSEC - Programa de Instrução de Segurança da Aviação Civil contra Atos de Interferência
  Ilícita

  hh) PNAVSEC - Programa Nacional de Segurança da Aviação Civil contra Atos de Interferência
  Ilícita

  ii) PNIAVSEC - Programa Nacional de Instrução de Segurança da Aviação Civil contra Atos
  de Interferência Ilícita

  jj) PNR - Passenger Named Record (Registro de Identificação de Passageiros)

  kk) PSA - Programa de Segurança Aeroportuária

  ll) PSER - Programa de Segurança do Expedidor Reconhecido

  mm) PSOA - Programa de Segurança do Operador Aéreo

  nn) PSTAV - Plano de Segurança de Transporte Aéreo de Valores

  oo) RBAC - Regulamento Brasileiro da Aviação Civil

  pp) SISBIN - Sistema Brasileiro de Inteligência

  qq) TECA - Terminal de Cargas'
