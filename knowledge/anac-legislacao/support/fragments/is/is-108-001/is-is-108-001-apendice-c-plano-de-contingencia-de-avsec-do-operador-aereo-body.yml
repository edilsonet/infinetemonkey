text: 'APÊNDICE C - PLANO DE CONTINGÊNCIA DE AVSEC DO OPERADOR AÉREO


  O conteúdo do Apêndice C foi intencionalmente suprimido, pois o acesso, a divulgação e o
  tratamento dessas informações são restritos às pessoas com necessidade de conhecê-la, tendo
  em vista o disposto no Anexo 17 da Convenção da Aviação Civil Internacional, promulgada
  pelo Decreto nº 21.713, de27 de agosto de 1946, e no art. 36 da Lei nº 12.527, de 18 de
  novembro de 2011.'
