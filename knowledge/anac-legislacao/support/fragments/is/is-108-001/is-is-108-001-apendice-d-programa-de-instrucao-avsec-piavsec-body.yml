title: APÊNDICE D - PROGRAMA DE INSTRUÇÃO AVSEC (PIAVSEC)
text: 'APÊNDICE D - PROGRAMA DE INSTRUÇÃO AVSEC (PIAVSEC)


  D.1 POLÍTICA E OBJETIVO


  D.1.1 Política

  D.1.1.1 Promover o treinamento e gestão dos recursos humanos de forma a propiciar sua plena
  condição na operação da segurança da aviação civil.


  D.1.2 Objetivos

  D.1.2.1 Garantir a qualificação dos profissionais que desempenham atividades relacionadas
  à segurança da aviação civil para assegurar a correta aplicação do Programa Nacional de
  Segurança da Aviação Civil contra Atos de Interferência Ilícita (PNAVSEC).

  D.1.2.2 Manter meios de avaliação da atuação dos profissionais que desempenham atividade
  AVSEC de forma a garantir que os procedimentos de segurança sejam executados conforme o
  previsto.

  D.1.2.3 Este Programa contempla todos os profissionais que realizam atividade AVSEC em benefício
  do operador aéreo, sejam contratados de forma direta ou indireta.


  D.2 CONTEÚDO PROGRAMÁTICO E GRADE CURRICULAR


  D.2.1 O operador aéreo controla a certificação de seus profissionais, garantindo que os
  mesmos façam treinamento em centros de instrução que possuem conteúdo programático de acordo
  com o Programa Nacional de Instrução em Segurança da Aviação Civil contra Atos de Interferência
  Ilícita (PNIAVSEC) e com os critérios deste operador.

  D.2.2 Ressalta-se que este operador pode solicitar alteração do conteúdo programático para
  melhor alinhamento com os objetivos da gestão de segurança do operador aéreo no momento
  de direcionar o treinamento dos profissionais.


  D.3 REFERÊNCIAS BIBLIOGRÁFICAS E DOCUMENTOS NORMATIVOS OU REGULAMENTARES


  D.3.1 Leis

  D.3.1.1 Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de
  Aeronáutica.

  D.3.1.2 Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação
  Civil.


  D.3.2 Decretos

  D.3.2.1 Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional
  de Segurança da Aviação Civil contra Atos de Interferência Ilícita.


  D.3.3 DAVSEC

  D.3.3.1 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 01-2015, que traz a relação de aeródromos que possuem procedimentos equivalentes de inspeção
  de segurança de passageiros e bagagens de mão e de verificação de segurança de aeronaves.

  D.3.3.2 Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC)
  nº 02-2016, que traz os parâmetros quantitativos para realização dos procedimentos de inspeção
  de segurança aleatória nos aeródromos civis públicos brasileiros.


  D.3.4 Resoluções

  D.3.4.1 Resolução ANAC nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de
  20 de julho de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução
  Suplementar (IS), estabelece critérios para elaboração e dá outras providências.

  D.3.4.2 Resolução ANAC nº 254, de 6 de novembro de 2012, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 108, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador Aéreo.

  D.3.4.3 Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação
  Civil contra Atos de Interferência Ilícita - PNIAVSEC.

  D.3.4.4 Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro
  de Aviação Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador de Aeródromo.

  D.3.4.5 Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança
  contra Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).


  D.4 RESPONSABILIDADES E PROCEDIMENTOS DE SELEÇÃO DOS PROFISSIONAIS PARA DESEMPENHO DE ATIVIDADES
  AVSEC


