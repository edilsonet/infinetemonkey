title: apendice-d-programa-de-instrucao-avsec-piavsec(d)
text: 'd) Avaliação de saúde física e mental para o desempenho pleno das atividades AVSEC,
  comprovada por meio de exame médico.

  D.4.2 Os exames médicos são atualizados a cada 24 (vinte e quatro) meses.

  D.4.3 O operador aéreo arquiva a documentação dos profissionais orgânicos e terceirizados.
  Os arquivos dos profissionais terceirizados podem ser mantidos nas instalações da empresa
  terceirizada. O arquivo é mantido de forma física ou digital.


  D.5 RESPONSABILIDADES E PROCEDIMENTOS DE RECICLAGEM


  D.5.1 O operador aéreo garante a reciclagem de todos os profissionais que desempenham atividade
  em seu benefício e que não demonstram proficiência durante atividade de fiscalização ou
  de controle de qualidade realizada pelo próprio operador aéreo ou pela Agência Nacional
  de Aviação Civil (ANAC) e nos casos previstos em regulamentação específica sobre Treinamento
  em Serviço.

  D.5.2 As ações de reciclagem são formalizadas por meio do Relatório de Reciclagem, conforme
  consta no Anexo 1 deste PIAVSEC, que apresenta um resumo das atividades realizadas e a lista
  de presença dos participantes.

  D.5.3 Após a realização da atividade de reciclagem, o operador realiza novas avaliações
  no profissional, sem avisar e de forma discreta, em quantidade suficiente para garantir
  que as fragilidades identificadas foram sanadas.


  D.6 RESPONSABILIDADES E PROCEDIMENTOS DE REALIZAÇÃO DO TREINAMENTO EM SERVIÇO


  D.6.1 O operador aéreo garante um Treinamento em Serviço, necessário para obtenção da certificação
  em Inspeção de Segurança da Aviação Civil, a todos os profissionais que desempenham atividade
  AVSEC em seu benefício, além de demais casos previstos em regulamentação específica sobre
  Treinamento em Serviço.

  D.6.2 O operador aéreo designa profissionais responsáveis para supervisão do treinamento
  em serviço (Supervisor de Treinamento) conforme regulamentação específica sobre Treinamento
  em Serviço.

  D.6.3 O profissional responsável pode fazer avaliações prévias do desempenho do profissional
  em treinamento, apresentando feedback do trabalho desenvolvido para que o profissional em
  treinamento tenha a oportunidade de melhorar o seu desempenho.

  D.6.4 Para os profissionais em Formação em Inspeção de Segurança da Aviação Civil, o Treinamento
  em Serviço somente pode se iniciar após o aluno comprovar, por meio de declaração expedida
  pelo centro de instrução, que atendeu aos critérios de aprovação 1 e 2 do Curso de Formação
  em Inspeção de Segurança em Aviação Civil (critério 1: frequência mínima igual ou superior
  a 80% da carga horária do curso; critério 2: nota na avaliação teórica igual ou superior
  a 70%).

  D.6.4.1 Após atender os critérios 1 e 2 do Curso de Formação, o profissional possui o prazo
  máximo de 12 (doze) meses para concluir o Treinamento em Serviço.

  D.6.4.2 A partir da contratação, o Treinamento em Serviço é iniciado e concluído durante
  os 30 (trinta) primeiros dias de trabalho do profissional (período de um mês).

  D.6.5 Durante o treinamento em serviço de profissionais em Formação em Inspeção de Segurança
  da Aviação Civil, cada profissional designado para atuar como Supervisor de Treinamento
  só poderá acompanhar um profissional em treinamento por vez, resguardadas especificidades
  previstas em regulamentação específica sobre Treinamento em Serviço.

  D.6.5.1 O profissional em Formação em Inspeção de Segurança da Aviação Civil, durante todo
  o período do treinamento em serviço, não pode tomar decisão relacionada à resolução de alarmes
  sem a devida supervisão direta do profissional que o está acompanhando ou avaliando.

  D.6.6 O Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil
  ocorre durante a efetiva prestação de serviço de inspeção e dentro do período de validade
  da certificação vigente.

  D.6.6.1 O Treinamento em Serviço tem duração entre 6 (seis) e 24 (vinte e quatro) meses.

  D.6.6.2 Somente após a conclusão do treinamento em serviço é possível realizar matrícula
  no centro de instrução para o curso de Atualização em Inspeção de Segurança da Aviação Civil.

  D.6.7 O Treinamento em Serviço é composto pelas fases previstas em regulamentação específica
  sobre Treinamento em Serviço.

  D.6.8 No Treinamento em Serviço, o operador aéreo faz uso da Ficha de Avaliação contida
  em regulamentação específica sobre Treinamento em Serviço.

  D.6.9 A Ficha é composta de duas partes:'
