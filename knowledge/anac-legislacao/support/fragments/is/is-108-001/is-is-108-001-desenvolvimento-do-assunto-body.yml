title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO


  Estrutura e conteúdo do PSOA

  Conforme previsto na seção 108.257 do RBAC nº 108, no PSOA devem constar as medidas e os
  procedimentos de segurança a serem empregados pelo operador aéreo.

  Os meios e procedimentos de segurança (Apêndice B), bem como os Planos e Programas (Apêndices
  C, D e E) previstos nesta Instrução Suplementar são considerados o PSOA do operador aéreo
  e não necessitam ser apresentados à ANAC para avaliação e aprovação.

  Tópicos desta IS relacionados a requisito que não seja aplicável a determinado operador
  aéreo, nos termos do Apêndice A do RBAC nº 108, devem ser desconsiderados, não sendo necessária
  a apresentação de qualquer documentação a ANAC.

  Nos casos em que o operador aéreo pretenda implementar meio ou procedimento previsto na
  IS nº 108, mas que esteja relacionado a requisito que não lhe é aplicável, nos termos do
  Apêndice A do RBAC nº 108, deverá seguir o trâmite previsto para implementação de inclusão
  de medida de segurança, conforme item 5.2.

  Os modelos apresentados nesta IS (formulários, listas, entre outros) possuem os objetivos
  de esclarecer a compreensão e auxiliar na aplicação dos procedimentos descritos, podendo
  o operador alterar suas formatações, complementar com informações de acordo com sua operação
  e utilizar meios digitais de preenchimento.


  Inclusão de medidas de segurança ou de procedimentos alternativos ao disposto nesta Instrução
  Suplementar

  Caso o operador aéreo pretenda incluir medida de segurança ou procedimento alternativo em
  relação ao disposto nesta IS, deverá obter aprovação prévia da ANAC.

  A proposta de inclusão de medida de segurança ou procedimento alternativo deverá ser encaminhada
  à ANAC com a apresentação dos seguintes documentos:


  Formulário de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo,
  que contém a descrição da proposta do operador aéreo e respectivas justificativas; e


  No caso de proposta de inclusão de medida de segurança decorrente de exigências de Estado
  estrangeiro, o operador aéreo também deverá encaminhar documentação do respectivo Estado
  contendo a descrição da medida de segurança e sua justificativa.

  Os documentos deverão ser encaminhados à ANAC por meio do protocolo eletrônico, conforme
  instruções constantes na página eletrônica da Agência na rede mundial de computadores.

  Após aprovação da ANAC, as medidas adicionais de segurança ou procedimentos alternativos
  implementados pelo operador aéreo serão determinados pela Listagem de Inclusão de Medidas
  de Segurança e Procedimentos Alternativos, que passará a ser parte integrante do PSOA do
  operador aéreo.

  A Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos será enviada
  pela ANAC ao operador aéreo, acrescentando à proposta de conteúdo contida no Formulário
  de Apresentação de Inclusão de Medida de Segurança e Procedimento Alternativo, a versão
  da listagem, o número da portaria de aprovação e a data da publicação.


  Análise e aprovação de pedido de inclusão de medida de segurança ou procedimento alternativo

  A análise de pedido de inclusão de medida de segurança ou procedimento alternativo ao disposto
  nessa IS é uma atividade realizada pela ANAC, com o objetivo de avaliar se o conteúdo que
  efetivamente seja adicional ou alternativo ao disposto nesta IS está de acordo com o previsto
  no RBAC 108 ou com o objetivo do procedimento descrito nesta IS.

  Somente serão analisadas as propostas que estiverem devidamente justificadas no Formulário
  de Apresentação de Inclusão de Medida de Segurança ou Procedimento Alternativo.

  A justificativa da proposta do operador aéreo deve conter elementos suficientes para demonstrar
  que:


  O pedido de inclusão de medida de segurança ou procedimento alternativo é exequível por
  parte do operador aéreo; e


  O pedido de inclusão de medida de segurança ou procedimento alternativo assegura um nível
  de segurança equivalente ou maior ao estabelecido no RBAC nº 108 ou no procedimento descrito
  nesta IS.

  A aprovação de inclusão de medida de segurança ou procedimento alternativo ao disposto nesta
  IS ocorrerá por meio de Portaria da Superintendência de Infraestrutura Aeroportuária.

  Somente após a publicação da Portaria de aprovação, a inclusão de medida de segurança ou
  procedimento alternativo passa a ser considerado como parte integrante do PSOA do operador
  aéreo, em complementação ao disposto nessa IS.


  Alterações de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC

  A Alteração de inclusão de medida de segurança ou procedimento alternativo já aprovado pela
  ANAC segue o disposto nos itens 5.2 e 5.3.


  Processo de Ratificação da Certificação de Expedidor Reconhecido

  A ratificação pela ANAC da certificação de expedidor reconhecido ocorre através de solicitação
  do operador aéreo contendo os seguintes documentos:


  Formulário de Solicitação de Ratificação de Certificação de Expedidor Reconhecido, contendo
  os dados do operador aéreo e do expedidor.


  Declaração de Conformidade do Expedidor Reconhecido, assinada pelo Responsável Nacional
  pela AVSEC do operador aéreo, afirmando que as medidas de segurança do expedidor aplicadas
  às áreas e instalações foram presencialmente avaliadas em auditoria pelo operador aéreo
  e consideradas suficientes para impedir o acesso de objetos que possam comprometer a segurança
  da aviação civil nos envios de carga e mala postal direcionados ao transporte aéreo.

  Os documentos deverão ser encaminhados à ANAC por meio do protocolo eletrônico, conforme
  instruções constantes na página eletrônica da Agência na rede mundial de computadores.

  O registro do expedidor reconhecido pelo operador aéreo ocorre após a ratificação da ANAC,
  através da inserção do expedidor na lista de expedidores reconhecidos do operador aéreo.


  Informações cadastrais de envio obrigatório à ANAC

  O operador aéreo que esteja obrigado a implementar um PSOA, nos termos do parágrafo 108.255
  (a) do RBAC nº 108, deverá encaminhar as informações contidas na Ficha de Cadastro AVSEC
  do Operador Aéreo à ANAC, por meio do protocolo eletrônico ou outro meio disponibilizado
  pela ANAC.

  A Ficha de Cadastro AVSEC do Operador Aéreo e as orientações para envio dos dados podem
  ser encontradas na página eletrônica da ANAC na rede mundial de computadores.

  As informações da Ficha de Cadastro AVSEC do Operador Aéreo deverão ser mantidas atualizadas
  pelo operador aéreo, através de comunicação à ANAC em prazo não superior a 30 (trinta) dias
  a contar da data em que ocorreu a alteração do dado.'
