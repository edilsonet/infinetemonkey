title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS


  7.1. O operador aéreo é responsável pela avaliação do conteúdo padronizado apresentado nesta
  IS, com o intuito de verificar se os recursos previstos são suficientes para garantia da
  segurança da aviação civil contra atos de interferência ilícita, levando em consideração
  sua própria avaliação de risco e níveis de complexidade e criticidade de suas operações
  aéreas.

  7.2 Considerando que o acesso irrestrito ao PSOA (Apêndices B, C, D e E desta IS) compromete
  a efetividade dos recursos de segurança preventivos, de resposta e de comunicação e, por
  conseguinte, pode pôr em risco a vida e a segurança da população, a informação contida nesses
  apêndices deve ser tratada como restrita às instituições que necessitam conhecer o seu conteúdo
  para a garantia da AVSEC.

  A guarda e distribuição do PSOA deve observar procedimentos de controle, definidos pelo
  operador aéreo, necessários para garantir que o acesso aos documentos seja restrito às pessoas
  com necessidade de conhecê-los, conforme o grau de sigilo atribuído.

  Os casos omissos serão dirimidos pela ANAC.

  Esta IS entra em vigor no dia 10 de fevereiro de 2025.'
