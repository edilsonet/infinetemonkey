text: 'Fundamentos

  Leis

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica.

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.


  Decretos

  Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional de Segurança
  da Aviação Civil contra Atos de Interferência Ilícita.


  DAVSEC

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  01-2015, que traz a relação de aeródromos que possuem procedimentos equivalentes de inspeção
  de segurança de passageiros e bagagens de mão e de verificação de segurança de aeronaves.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  02-2016, que traz os parâmetros quantitativos para realização dos procedimentos de

  inspeção de segurança aleatória nos aeródromos civis públicos brasileiros.

  Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC) nº
  04-2021, que estabelece a relação de aeródromos em que há a obrigatoriedade de realizar
  a inspeção de segurança das bagagens despachadas para seguir em voos domésticos e os prazos
  para aplicação da medida de segurança.


  Resoluções

  Resolução ANAC nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho
  de 2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução Suplementar
  (IS), estabelece critérios para elaboração e dá outras providências.

  Resolução ANAC nº 167, de 17 de agosto de 2010, que estabelece diretrizes para o gerenciamento
  de risco à Segurança da Aviação Civil contra Atos de Interferência Ilícita (AVSEC) pela
  ANAC.

  Resolução ANAC nº 254, de 6 de novembro de 2012, que aprova o Regulamento Brasileiro de
  Aviação Civil nº 108, intitulado Segurança da Aviação Civil contra Atos de Interferência
  Ilícita - Operador Aéreo.

  Resolução ANAC nº 255, de 13 de novembro de 2012, que estabelece regras sobre a disponibilização
  de Informações Antecipadas sobre Passageiros (Advance Passenger Information - API) e do
  Registro de Identificação de Passageiros (Passenger Name Record - PNR).

  Resolução ANAC nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 110, intitulado Programa Nacional de Instrução em Segurança da Aviação Civil contra
  Atos de Interferência Ilícita - PNIAVSEC.

  Resolução ANAC nº 362, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação
  Civil nº 107, intitulado Segurança da Aviação Civil contra Atos de Interferência Ilícita
  - Operador de Aeródromo.

  Resolução ANAC nº 400, de 13 de dezembro de 2016, que dispõe sobre as Condições Gerais de
  Transporte Aéreo.

  Resolução ANAC nº 461, de 25 de janeiro de 2018, que dispõe sobre os procedimentos de embarque
  e desembarque de passageiros armados, despacho de armas de fogo e de munição e transporte
  de passageiros sob custódia a bordo de aeronaves civis.

  Resolução ANAC nº 499, de 12 de dezembro de 2018, que aprova o Programa de Segurança contra
  Atos de Interferência Ilícita da Agência Nacional de Aviação Civil (PAVSEC-ANAC).


  Instruções Normativas

  Instrução Normativa ANAC nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162,
  de 20 de julho de 2010, que estabelece normas e critérios para a elaboração e alteração
  de Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.'
