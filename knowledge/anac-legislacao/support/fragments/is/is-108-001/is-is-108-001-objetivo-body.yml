title: Objetivo
text: 'Objetivo

  Esta Instrução Suplementar estabelece o Programa de Segurança de Operador Aéreo (PSOA) em
  conformidade com os requisitos contidos nas seções 108.255 a 108.259 do Regulamento Brasileiro
  de Aviação Civil - RBAC nº 108 e descreve, em seus Apêndices, a combinação de recursos organizacionais,
  materiais, humanos e procedimentais aceitos pela ANAC para fins de cumprimento dos requisitos
  do RBAC nº 108 por parte dos operadores aéreos.

  Os recursos de prevenção e de resposta descritos nesta Instrução Suplementar podem ser utilizados
  como referência pelos operadores aéreos que não sejam obrigados a cumprir os requisitos
  constantes nas seções 108.255 e 108.259 do RBAC nº 108.'
