title: APÊNDICE A - CRITÉRIOS, SUBCRITÉRIOS E REQUISITOS DO PROGRAMA OEA-ANAC
text: 'APÊNDICE A - CRITÉRIOS, SUBCRITÉRIOS E REQUISITOS DO PROGRAMA OEA-ANAC

  A.1 CRITÉRIOS DE ADMISSIBILIDADE

  A.1.1 Critério: Condições Prévias

  A.1.1.1 Subcritério: Certificação Prévia

  Requisito a: O requerente à certificação OEA-ANAC deve ser certificado no Programa Brasileiro
  de Operador Econômico Autorizado da Receita Federal do Brasil, na modalidade de Segurança
  (OEA-S).

  Requisito b: O requerente à certificação OEA-ANAC não deve ter recebido indeferimento de
  pedido de certificação ao Programa OEA-ANAC nos últimos 6 (seis) meses.


  A.2 CRITÉRIOS DE ELEGIBILIDADE

  A.2.1 Critério: Política de Recursos Humanos

  A.2.1.1 Subcritério: Seleção de pessoal para cargos sensíveis

  Requisito a: Deve ser designado um profissional, no âmbito de um setor ou departamento organizacional
  apropriado, que receba a responsabilidade por gerir os riscos associados às ameaças de atos
  de interferência ilícita nas operações de volumes de carga destinados ao transporte aéreo.


  A.3 CRITÉRIOS DE SEGURANÇA

  A.3.1 Critério: Segurança da Carga

  A.3.1.1 Subcritério: Acesso às áreas de processamento e armazenamento de unidades de carga

  Requisito a: Deve existir procedimento formal (escrito), de caráter obrigatório, para aplicação
  da restrição de acesso de malas, mochilas e outros materiais/objetos que sejam desnecessários
  à operação do exportador nas instalações de processamento e armazenamento de unidades de
  carga, de forma a prevenir a entrada de objetos que possam colocar em risco a segurança
  do transporte dos volumes de carga.


  A.3.1.2 Subcritério: Transferência de unidades de carga

  Requisito a: Deve existir procedimento formal (escrito), de caráter obrigatório, que discipline
  a transferência de unidades de carga entre as entidades da cadeia logística, através do
  uso da Declaração de Segurança da Carga, de forma física ou eletrônica.

  Requisito b: O procedimento deve conter a indicação do(s) profissional(is) ou da(s) função(ões)
  autorizada(s) a assinar a Declaração de Segurança da Carga.

  Requisito c: Deve ser emitido a Declaração de Segurança da Carga como instrumento para realização
  segura da transferência da carga, sendo permitida a integração da Declaração com outros
  documentos utilizados na cadeia logística da carga.


  A.3.2 Critério: Treinamento e Conscientização de Ameaças

  A.3.2.1 Subcritério: Treinamento em proteção da aviação civil contra atos de interferência
  ilícita

  Requisito a: O profissional responsável pela gestão da segurança deve ter treinamento sobre
  segurança da aviação civil contra atos de interferência ilícita (conhecimento do contexto
  de risco enfrentado pela aviação civil e conhecimento dos recursos de segurança que podem
  ser empregados para proteção do sistema de aviação civil contra atos de interferência ilícita).


  A.3.3 Critério: Resposta a Incidentes de Segurança

  A.3.3.1 Subcritério: Falha na aplicação de medidas preventivas de segurança

  Requisito a: Deve existir procedimento formal (escrito), de caráter obrigatório, para aplicação
  em casos de falha na adoção de alguma medida de segurança, no âmbito das ações de contingência
  da organização.


  A.3.4 Critério: Sistema de Gestão da Qualidade da Segurança

  A.3.4.1 Subcritério: Controle de Qualidade AVSEC

  Requisito a: Deve existir procedimento formal (escrito), de caráter obrigatório, para monitoramento
  periódico do cumprimento dos requisitos OEA.

  Requisito b: Realizar testes de segurança, no mínimo anualmente, nos controles de segurança
  relacionados ao acesso de pessoas e veículos às áreas de produção, armazenagem e preparação
  dos volumes de carga.

  Requisito c: Realizar auditoria de segurança nas instalações do exportador, no mínimo a
  cada 2 (dois) anos, de modo a atestar aplicação dos controles de segurança durante as fases
  de produção, armazenagem e transporte dos volumes de carga.'
