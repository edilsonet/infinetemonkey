title: APÊNDICE B - BENEFÍCIOS DO PROGRAMA OEA-ANAC
text: 'APÊNDICE B - BENEFÍCIOS DO PROGRAMA OEA-ANAC


  Benefícios de caráter Geral do OEA-ANAC


  Divulgação no Sítio da ANAC: divulgação do nome do operador no sítio da ANAC, disponível
  no endereço http://anac.gov.br, após a publicação do respectivo ato administrativo de certificação,
  no Sistema OEA, quando da formalização do Requerimento de Certificação.


  Utilização da logomarca "AEO/ANAC": utilização da logomarca do Programa Brasileiro de OEA
  Integrado, conforme especificações contidas na Portaria RFB n° 768/15 - Manual da Marca
  AEO;


  Ponto de Contato na ANAC: ANAC designará um servidor como ponto de contato para comunicação
  entre ANAC e a entidade certificada como OEA-ANAC, para esclarecimento de dúvidas relacionadas
  ao Módulo ANAC do Programa OEA e a procedimentos de segurança e facilitação da aviação civil.


  Benefícios concedidos pelas Autoridades de segurança da aviação civil estrangeiras: será
  facultado ao OEA-AVSEC usufruir dos benefícios e vantagens de Acordos de Reconhecimento
  Mútuo (ARM) que a ANAC venha a assinar com as Autoridades de segurança da aviação civil
  de outros países;


  Benefícios Específicos do OEA-ANAC


  Agendamento prioritário aos transportadores terrestres de mercadorias do exportador: os
  transportadores terrestres responsáveis pelo transporte de mercadorias de um exportador
  OEA-ANAC poderão solicitar agendamento prioritário para descarregamento dos volumes de carga
  no TECA do aeroporto, quando o operador aeroportuário dispuser de serviços de agendamento
  nessa fase operacional, incluindo prioridade de atendimento na área de espera de veículos
  para acesso à área de descarregamento na entrada do TECA.


  Observação: A concessão da prioridade para descarregamento dos volumes de carga está condicionada
  às possibilidades operacionais ofertadas pelo operador aeroportuário.


  Credencial permanente aos profissionais representantes do exportador: o profissional de
  agente de carga, a serviço do exportador OEA-ANAC poderá solicitar credenciamento permanente
  junto ao operador aeroportuário para acesso às áreas do terminal de carga necessárias ao
  desempenho de suas atividades relativas às necessidades do exportador OEA-ANAC.


  Observação: A concessão do credenciamento permanente será condicionada ao cumprimento, por
  parte do profissional solicitante, dos critérios de credenciamento de pessoas estabelecidos
  pela(s) norma(s) aplicável(eis) e pelo operador aeroportuário. O operador aeroportuário
  poderá considerar a validade do contrato entre o prestador de serviço e o exportador OEA-ANAC,
  para fins de delimitação temporal da validade da credencial permanente concedida ao profissional
  solicitante.


  Eficiência no manuseio da carga pelo operador aeroportuário: no âmbito das funções do operador
  aeroportuário, os volumes de carga originados do exportador OEA-ANAC serão classificados
  como carga conhecida e manuseados de forma segregada, e quando a operação permitir, serão
  processados de maneira prioritária em relação aos demais volumes de carga.


  Eficiência no manuseio da carga pelo operador aéreo: no âmbito das funções do operador aéreo,
  os volumes de carga originados do exportador OEA-ANAC serão considerados como carga conhecida
  e manuseados de forma segregada das cargas n&atiatilde;o conhecidas e, quando a operação
  permitir, serão processados de maneira prioritária em relação aos demais volumes de carga.


  Isenção de inspeção primária da remessa de carga (inspeção de segurança da aviação civil):
  a carga do exportador OEA-ANAC, sendo classificada como carga conhecida, poderá ser processada
  pelos operadores aeroportuários e aéreos sem a necessidade de ser realizada a inspeção primária
  em 100% dos volumes de carga, exceto quando houver informação que altere a classificação
  da carga.

  Inspeção AVSEC secundária de forma remota: a carga do exportador OEA-ANAC, caso seja submetida
  a um processo de inspeção primária, e caso seja requerida a realização de uma inspeção secundária,
  a remessa de carga poderá ser despaletizada ou desunitizada e submetida ao método de inspeção
  secundário pelo próprio operador aéreo, sendo este processo supervisionado de forma remota
  pela Receita Federal do Brasil, através de Circuito Fechado de Televisão (CFTV), provido
  pelo operador aeroportuário.


  Observação: A concessão da inspeção AVSEC secundária de forma remota está condicionada às
  possibilidades operacionais ofertadas pelo operador aeroportuário.'
