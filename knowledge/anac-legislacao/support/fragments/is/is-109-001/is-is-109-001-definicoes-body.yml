title: Definições
text: 'Definições

  Operador Econômico Autorizado (OEA) significa o interveniente/agente em operação de comércio
  exterior envolvido na movimentação internacional de mercadorias a qualquer título que, mediante
  o cumprimento voluntário dos critérios de segurança aplicados à cadeia logística ou das
  obrigações tributárias e aduaneiras, conforme a modalidade de certificação, demonstre atendimento
  aos níveis de conformidade e confiabilidade exigidos pelo Programa OEA e seja certificado
  nos termos da Instrução Normativa específica da RFB.'
