title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  Processo de Certificação do Programa OEA-ANAC

  O processo de certificação inicia-se com o requerimento do interessado e preenchimento do
  Questionário de Autoavaliação (QAA), que deve ser formulado conforme estabelecido pela Superintendência
  de Infraestrutura aeroportuário.

  O requerente deverá designar um funcionário como ponto de contato com a ANAC e seu respectivo
  suplente, com acesso a diversos setores da empresa, para tratar da prestação das informações
  necessárias durante o processo de certificação, bem como das solicitações apresentadas após
  a certificação.

  A certificação será emitida para o CNPJ do estabelecimento matriz, podendo ser extensivo
  a todos os estabelecimentos, salvo eventual ressalva quando da certificação.

  A certificação requerida será obtida somente após a demonstração satisfatória do atendimento
  aos critérios de admissibilidade, de elegibilidade e de segurança (AVSEC), que estão estabelecidos
  no Apêndice A desta Instrução Suplementar.


  Análise da Solicitação de Certificação.

  A análise da solicitação de certificação abrangerá uma etapa de análise documental e poderá
  incluir uma etapa de visita in loco, para avaliação de características físicas e operacionais
  de instalação(ões) indicada(s) pelo requerente.

  A pedido do requerente, poderão ser prorrogados os prazos para saneamento ou apresentação
  de esclarecimento ou documentos adicionais.

  Concluída a análise do processo, a ANAC se manifestará pelo deferimento total ou parcial
  ou pelo indeferimento do pedido e notificará o requerente quanto à decisão.


  Validade, Publicação, Manutenção e Revisão da Certificação

  A certificação será emitida em caráter precário, com prazo de validade indeterminado, por
  meio de ato do Superintendente de Infraestrutura Aeroportuária.

  A certificação emitida poderá ser acompanhada de recomendações que visem ao aumento do grau
  de conformidade da organização requerente.

  O atendimento às recomendações será objeto de acompanhamento e será considerado para fins
  de redução do escopo e do nível de auditoria/inspeção a ser realizado nas atividades de
  revisão periódica da certificação.


  Benefícios aos Operadores Certificados

  Os benefícios que serão entregues aos operadores certificados estão definidos no Apêndice
  B.'
