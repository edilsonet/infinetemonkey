title: Fundamentos
text: 'Fundamentos

  Leis

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica.

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.


  Decretos

  Decreto nº 11.195, de 8 de setembro de 2022, que dispõe sobre o Programa Nacional de Segurança
  da Aviação Civil contra Atos de Interferência Ilícita.


  RBAC

  Regulamento Brasileiro de Aviação Civil - RBAC nº 109.


  Resoluções

  Resolução ANAC nº 515, de 8 de maio de 2019, que dispõe sobre os procedimentos de inspeção
  de segurança da aviação civil contra atos de interferência ilícita nos aeroportos e dá outras
  providências.


  Instruções Normativas

  Instrução Normativa ANAC nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162,
  de 20 de julho de 2010, que estabelece normas e critérios para a elaboração e alteração
  de Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.'
