title: Objetivo
text: 'Objetivo

  Esta Instrução Suplementar estabelece os critérios, benefícios e procedimentos aceitáveis
  para operacionalização do Programa de Certificação AVSEC de Operadores da Cadeia de Carga
  Aérea Internacional (Programa OEA-ANAC), através do módulo complementar de certificação
  ao Programa OEA, denominado módulo OEA-Integrado ANAC, conforme Regulamento Brasileiro de
  Aviação Civil - RBAC nº 109.

  Revogação - N/A'
