text: '1. Definições e Abreviaturas

  1.1 Para os efeitos deste Manual, aplicam-se as definições estabelecidas nos seguintes atos:

  Regulamento Brasileiro da Aviação Civil nº 01 − RBAC 01; Regulamento Brasileiro da Aviação
  Civil

  nº 110 − RBAC 110; Regulamento Brasileiro da Aviação Civil nº 107 − RBAC 107; Regulamento

  Brasileiro da Aviação Civil nº 108 − RBAC 108; Regulamento Brasileiro da Aviação Civil nº
  111 −

  RBAC 111; Decreto nº 7.168, de 5 de maio de 2010, que dispõe sobre o Programa Nacional de

  Segurança da Aviação Civil contra Atos de Interferência Ilícita; e Lei nº 7.565, de 19 de
  dezembro de

  1986, que dispõe sobre o Código Brasileiro da Aeronáutica; e as seguintes:

  <Acrescentar as definições que não foram mencionadas em nenhuma das normativas acima, se

  houver>


  1.2 Aplicam-se ainda as seguintes abreviaturas:

  <Acrescentar as abreviaturas que não foram mencionadas em nenhuma das normativas acima,
  se

  houver>


