section_title: Requisitos para desempenho de atividades AVSEC
subsection_id: i
cite: 110.11(i)
title: 110.11(i)
text: '(i) Os exames médicos deverão ser atualizados a cada 24 (vinte e quatro) meses.

  (3) Ser capacitado e possuir certificação AVSEC, conforme os critérios deste Regulamento.

  C.1.1 O centro de instrução realiza processo seletivo em seu benefício antes de indicar
  profissionais

  que irão desempenhar atividades AVSEC. As atividades AVSEC estão elencadas no Apêndice A
  do

  RBAC 110.

  C.1.1.1 O processo seletivo é realizado para a escolha de novos funcionários que irão desempenhar

  atividades AVSEC ou para aqueles já pertencentes ao quadro da empresa e que pretendem atuar
  nas

  atividades de segurança.

  C.1.2 O centro de instrução solicita a apresentação pelo candidato da seguinte documentação
  para o

  processo seletivo: documento de identidade, antecedentes criminais, comprovante de residência
  e


  29/10/2015

  IS nº 110-001

  Revisão A


  curriculum vitae. Os antecedentes criminais a serem apresentados devem ser os mesmos daqueles

  exigidos pela norma vigente sobre credenciamento nos aeroportos brasileiros.

  C.1.3 O funcionário valida a documentação apresentada pelo candidato, conferindo, no mínimo,
  se ele

  possui maioridade penal, e se os antecedentes criminais apresentam os mesmos dados de sua

  identidade. Caso haja disponibilidade de consulta pela internet quanto à certificação dos
  antecedentes

  apresentados, o funcionário também as confere por esse meio. Em caso de identificação de
  alguma

  irregularidade na documentação apresentada, é solicitada retificação ao candidato ou, se
  confirmada

  alguma fraude no documento, o candidato é eliminado do processo seletivo.

  C.1.4 O funcionário analisa os antecedentes criminais do candidato e caso haja indicação
  de algum

  desvio de conduta, avalia se esse histórico pode comprometer as atividades a serem desempenhadas
  na

  empresa em caso de reincidência futura, sendo este fator preponderante no processo de escolha
  de

  candidato.

  C.1.5 O funcionário responsável pela entrevista realiza perguntas investigativas, de acordo
  com os

  principais pontos de interesse do centro de instrução, por meio de um questionário previamente

  elaborado por este centro de instrução com a finalidade de identificar as características,
  personalidade,

  habilidades e experiências prévias do candidato, de forma a compará-lo com as exigências
  da vaga a

  ser assumida. As respostas às perguntas elaboradas são registradas no questionário para
  consultas

  futuras.

  C.1.6 Após a realização das entrevistas, avaliação dos antecedentes e possíveis testes com
  os

  candidatos, o centro de instrução define qual o candidato que possui o perfil mais adequado
  para

  realização de atividade AVSEC, sendo o candidato selecionado orientado a realizar exames
  médicos e

  entregar a documentação para ser designado ao desempenho de atividades AVSEC.

  C.1.7 Os exames médicos devem comprovar aptidão física e mental do candidato. O centro de

  instrução define as atividades que o profissional deverá desempenhar, comunicando ao médico
  do

  trabalho, para que ele avalie se o candidato possui as aptidões físicas mínimas para a função,
  exigindo

  exames específicos julgados necessários para cada caso.

  C.1.8 O centro de instrução arquiva os documentos de encaminhamento ao médico do trabalho

  contendo a descrição da função e a avaliação de saúde realizada, com cópia legível dos exames,
  caso

  existam. Caso o candidato receba laudo médico favorável quanto a sua condição física e mental
  para

  desempenho da função, ele é indicado para o desempenho de atividades AVSEC.

  C.1.9 Com o auxílio do Formulário para conferência e arquivamento dos documentos referentes
  aos

  requisitos para desempenho de atividades AVSEC, constante no Apêndice F, um funcionário
  do centro

  de instrução confere a relação de toda a documentação do processo de seleção: documento
  de

  identidade, antecedentes criminais, comprovante de residência, curriculum vitae, questionário
  de


  29/10/2015

  IS nº 110-001

  Revisão A


  entrevista, encaminhamento de candidato à avaliação médica, laudos e exames médicos, se
  houver e

  demais documentos. O formulário é a maneira de controlar o procedimento para que todos os

  documentos exigidos pelo centro de instrução sejam arquivados.

  C.1.10 A documentação é arquivada por, no mínimo, 5 (cinco) anos e até um ano após o desligamento

  do funcionário.


  C.2 MATRÍCULA DE ALUNOS'
