cite: 110.11(i)
title: 110.11(i)
text: '(i) A verificação do perfil e capacidade para desempenho das atividades AVSEC deve
  considerar as

  atividades elencadas no Apêndice A.

  (ii) A comprovação da maioridade penal deve ser realizada por meio da apresentação de documento

  pessoal de identificação válido, com fotografia, data de nascimento e que possua fé pública.

  (iii) A avaliação de antecedentes inclui a verificação da identidade, a verificação de experiência
  prévia

  e a verificação de antecedentes criminais, com objetivo de avaliar a idoneidade de um indivíduo
  para

  implementação de controle de segurança e para acesso desacompanhado a uma área restrita
  de

  segurança.

  (A) Para fins de avaliação dos antecedentes criminais, o profissional deverá apresentar
  ao empregador

  os mesmos atestados de antecedentes criminais previstos para o credenciamento junto ao aeródromo,

  conforme regulamentação específica da ANAC.

  (B) A avaliação de antecedentes criminais deve balizar as decisões da organização com

  responsabilidade AVSEC sobre a indicação de um profissional para realizar atividades AVSEC.

