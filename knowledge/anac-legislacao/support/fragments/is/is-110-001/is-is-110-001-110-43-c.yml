section_title: Matrícula em curso AVSEC
subsection_id: c
cite: 110.43(c)
title: 110.43(c)
text: '(c) A matrícula em curso de Atualização só deve ser realizada para alunos que possuírem
  o respectivo

  curso de Formação ou Atualização válido até o primeiro dia do curso de Atualização pleiteado.


  C.2.1 Quando da abertura das inscrições para um curso AVSEC, o centro de instrução divulga
  aos

  interessados os documentos necessários para que seja efetuada a matrícula, conforme Apêndice
  B do

  RBAC 110. O Apêndice G deste manual apresenta o Formulário para conferência e arquivamento
  dos

  documentos de matrícula de aluno, contendo os documentos necessários para a matrícula em
  todos os

  cursos AVSEC, a qual é utilizada por funcionário no ato da matrícula em curso e no arquivamento
  da

  documentação referente à turma de curso AVSEC. Os antecedentes criminais a serem apresentados

  devem ser os mesmos daqueles exigidos pela norma vigente sobre credenciamento e a credencial

  aeroportuária para acesso às áreas restritas de segurança ou controladas é válida em substituição
  aos

  antecedentes. O centro de instrução reconhece apenas os modelos de credenciais informadas,
  por

  meios oficiais, pelos operadores de aeródromo ou pela ANAC.


  29/10/2015

  IS nº 110-001

  Revisão A


  C.2.2 Os documentos são avaliados, confrontando os dados do aluno constantes em seu documento
  de

  identidade com os dados presentes nos demais documentos (antecedentes, certificados, dentre
  outros).

  Em caso de suspeita quanto à autenticidade dos documentos, estes são conferidos acessando
  o sítio

  eletrônico do órgão emissor ou solicitando ao órgão emissor parecer quanto à veracidade
  da

  informação apresentada. Caso haja alguma divergência entre os dados apresentados, o centro
  de

  instrução comunica o aluno e pede a sua retificação.

  C.2.3 O funcionário analisa os antecedentes criminais do aluno e caso haja indícios de desvio
  de

  conduta, avalia se esse histórico pode comprometer a AVSEC, negando a matrícula caso confirmado.

  Em caso de dúvida quanto a essa avaliação, a Polícia Federal é consultada formalmente a
  respeito para

  que seja prosseguida a matrícula somente após parecer favorável desse órgão.

  C.2.4 O aluno somente é aceito em matrícula de curso AVSEC caso apresente todos os documentos

  exigidos pelo Apêndice B do RBAC 110 para o curso, além da exigência de parecer favorável
  dessa

  avaliação documental e o não indeferimento na análise de antecedentes criminais. Após a
  realização de

  toda a análise documental o aluno preenche a Ficha de matrícula em curso AVSEC, conforme

  Apêndice H.

  C.2.5 Quando há indeferimento de pedidos de matrícula, o aluno é comunicado por meio de
  um

  informe.

  C.2.6 O centro de instrução comunica a realização de um curso AVSEC à ANAC com 15 (quinze)
  dias

  de antecedência e os nomes dos alunos são informados, de maneira atualizada, até o início
  do curso. O

  meio de comunicação com a ANAC é o sítio eletrônico www.anac.gov.br/avsec, por meio de login
  e

  senha fornecidos pela ANAC no processo de autorização.

  C.2.7 Após a efetivação da matrícula o centro de instrução entrega ao aluno, mediante assinatura
  no

  formulário constante no Apêndice J, o regulamento do curso (Apêndice I) e o material instrucional.

  Em caso de curso ministrado em EAD, se o regulamento for disponibilizado digitalmente, o
  aluno

  marca o campo correspondente como forma de comprovação de leitura do documento. Nesse caso,
  o

  regulamento do curso fica disponível à consulta do aluno durante o decorrer de todo o curso.

  C.2.8 O processo de matrícula pode ser realizado sem a presença do aluno, por meio do envio
  da

  documentação exigida, em formato físico ou digital, tanto para cursos presencias como a
  distância.


  C.3 AVALIAÇÃO DE DESEMPENHO'
