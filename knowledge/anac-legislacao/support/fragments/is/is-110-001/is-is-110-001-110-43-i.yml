cite: 110.43(i)
title: 110.43(i)
text: '(i) Para fins de avaliação dos antecedentes criminais, o profissional deverá apresentar
  ao

  centro de instrução os mesmos atestados de antecedentes criminais previstos para o credenciamento

  junto ao aeródromo, conforme regulamento específico da ANAC.

  (ii) A avaliação de antecedentes criminais deve balizar as decisões do centro de instrução
  sobre a

  indicação de um profissional para realizar um curso AVSEC.

  (iii) O profissional que possua credencial de acesso à área restrita de segurança do aeroporto
  em que

  trabalha pode apresentá-la como comprovante de verificação de antecedentes já realizada.'
