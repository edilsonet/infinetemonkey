  APÊNDICE N - MODELO DE ROTEIRO PREPARATÓRIO PARA AVALIAÇÃO

  DE DESEMPENHO


  O responsável pela aplicação da avaliação de desempenho e interposição de recursos

  deverá ler em voz alta para a turma, antes de iniciar a contagem do tempo da avaliação,
  as

  seguintes regras, além daquelas contidas na capa da prova:


  “Vamos dar início à avaliação de desempenho. Para isso é importante que vocês

  conheçam as regras que todos devem seguir durante a avaliação, conforme a seguir.

  1. Procurar utilizar o banheiro antes do início da avaliação.

  2. Somente abrir o caderno de provas após autorização expressa.

  3. Guardar todo o material de consulta.

  4. Desligar celulares e qualquer equipamento eletrônico.

  5. Deixar sobre a mesa apenas lápis, borracha, caneta, garrafa de água e lanches.

  6. Somente se ausentar da sala de aula com o consentimento do responsável.

  7. Ao final da avaliação entregar o caderno da prova teórica e folha de resposta para o

  responsável.

  8. Será considerado apto para o exercício da função o aluno que obtiver o mínimo de

  70% (setenta por cento) na avaliação de desempenho.

  9. Será disponibilizado o gabarito em até 2 (duas) horas após o término da avaliação.

  10. O aluno que for pego cometendo qualquer das irregularidades listadas no

  Regulamento do Curso, será automaticamente excluído do processo de certificação.

  11. Leia atentamente as orientações presentes na capa do caderno de prova antes do seu

  início.

  12. Ao término da avaliação, permaneça sentado, levante o braço e aguarde o responsável

  pela aplicação da avaliação recolher os documentos de prova.


  Boa sorte!”


