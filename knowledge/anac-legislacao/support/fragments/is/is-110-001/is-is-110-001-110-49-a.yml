section_title: Melhoria da qualidade da instrução ministrada
subsection_id: a
cite: 110.49(a)
title: 110.49(a)
text: '(a) O centro de instrução deve manter metodologia de avaliação da instrução ministrada
  capaz de

  identificar falhas e gerar melhorias, garantindo a qualidade mínima da instrução, conforme
  seu MPCI.


  C.5.1 O centro de instrução mantém atualizado seu material instrucional e as propostas de
  plano de

  aula com a normativa AVSEC vigente. O centro de instrução utiliza a Proposta de Plano de
  Aula,

  contida no Apêndice E, para cada conteúdo programático e esse documento é utilizado para
  balizar as

  aulas dos instrutores do centro de instrução.

  C.5.2 Ao final da última aula de toda turma presencial ministrada, o instrutor do curso
  entrega o

  Formulário para avaliação de reação para ser preenchido pelos alunos, conforme Apêndice
  P. Nesse

  formulário, os alunos respondem os questionamentos com base em sua percepção sobre diferentes

  aspectos do curso ministrado.

  C.5.3 O instrutor recolhe os formulários preenchidos, guarda dentro de um envelope, lacra
  o envelope

  e o encaminha ao responsável técnico pelo centro de instrução. O centro de instrução também
  pode

  disponibilizar uma plataforma digital para que os alunos preencham as avaliações de reação.
  Nesse

  caso os alunos somente conseguem acesso ao certificado do curso após seu preenchimento.

  C.5.4 Nos casos de cursos ministrados em EAD, o processo é semelhante ao apresentado no
  item

  C.5.1, sendo utilizadas as mesmas questões do formulário constante no Apêndice P. No entanto
  o meio

  de preenchimento do formulário de avaliação de reação é variável conforme metodologia de

  desenvolvimento do curso, indicado no Apêndice B, item B.7.

  C.5.5 O resultado das avaliações é tabulado, gerando um banco de dados único, conforme Apêndice
  Q,

  e são fornecidas informações que servirão de base para as ações de melhoria do curso afetado.
  Caso

  algum item avaliado apresente nota abaixo da média, é obrigatório o parecer do responsável
  técnico no

  formulário. O responsável técnico assina o Formulário de tabulação dos resultados (Apêndice
  Q) e


  29/10/2015

  IS nº 110-001

  Revisão A


  dissemina suas informações para a equipe do centro de instrução, principalmente os instrutores

  envolvidos no curso.

  C.5.6 Caso seja identificado algum problema nas interpretações de resultados, ou uma oportunidade
  de

  melhoria, o responsável técnico analisa esse tópico de forma a investigar suas causas. Para
  cada causa

  identificada, ele realiza um plano de ação para que nos próximos cursos o nível de satisfação
  dos

  alunos seja elevado quanto a esse aspecto. O Apêndice R apresenta o Formulário de ações
  corretivas,

  que é baseado na metodologia 5W2H.

  C.5.7 O responsável técnico ou um instrutor, realiza acompanhamento de aulas do centro de
  instrução,

  com o objetivo de avaliar a aula ministrada pelos instrutores, preenchendo a avaliação do
  instrutor,

  conforme Apêndice L. O instrutor é avaliado na seguinte frequência: uma aula a cada 10 (dez)
  cursos

  para os quais ministre instrução.

  C.5.8 Os instrutores recebem sua avaliação e são informados de que em momento oportuno poderá
  ser

  realizada uma reunião com o responsável técnico, caso a avaliação apresente necessidade
  de alguma

  adequação por parte do instrutor. Caso o responsável técnico julgue insatisfatório o desempenho
  do

  instrutor, o centro de instrução realiza um número maior de acompanhamento das aulas desse
  instrutor.

  Nesses casos, é criado um plano de ação, conforme descrição no item C.5.6.

  C.5.9 O centro de instrução mantém arquivados os seguintes documentos referentes à melhoria
  da

  qualidade, em meio físico ou digital, por pelo menos 5 (cinco) anos após a data de realização
  do curso:'
