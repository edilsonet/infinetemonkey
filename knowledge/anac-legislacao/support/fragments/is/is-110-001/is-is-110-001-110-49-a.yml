  Critérios de Aprovação

  <O centro de instrução pode manter somente os dados do curso que o aluno for realizar>

  Para que o aluno seja considerado aprovado no curso selecionado é necessário:

  a) Para os cursos AVSEC para Atendimento ao Passageiro, AVSEC para Carga Aérea,

  AVSEC para Operações de Solo, AVSEC para Tripulantes e AVSEC para Vigilantes:

  - ter frequência integral no curso.


  b) Para o curso Básico AVSEC:

  - frequência mínima igual ou superior a 80% (oitenta por cento) da carga horária do

  curso; e

  - nota na avaliação teórica igual ou superior a 70% (setenta por cento).


  c) Para o curso Inspeção de Segurança da Aviação Civil:

  - frequência mínima igual ou superior a 80% (oitenta por cento) da carga horária do

  curso;

  - nota na avaliação teórica igual ou superior a 70% (setenta por cento);

  - para o curso de Formação, a Ficha de Avaliação do Treinamento Inicial em Serviço,

  qualificando o profissional como apto; e

  - para o curso de Atualização, a Ficha de Avaliação da Formação Continuada,

  qualificando o profissional como apto.


  29/10/2015

  IS nº 110-001

  Revisão A


  d) Para o curso AVSEC para Operador de Aeródromo:

  - frequência mínima igual ou superior a 80% (oitenta por cento) da carga horária do

  curso; e

  - nota na avaliação teórica igual ou superior a 70% (setenta por cento).


  e) Para o curso AVSEC para Operador Aéreo:

  - frequência mínima igual ou superior a 80% (oitenta por cento) da carga horária do

  curso; e

  - nota na avaliação teórica igual ou superior a 70% (setenta por cento).


  Dos deveres do aluno

  - Manter frequência às aulas, dentro dos limites previstos nos critérios de aprovação.

  - Obter as notas mínimas necessárias para aprovação no curso, conforme critérios de

  aprovação.

  - Comparecer pontualmente às aulas, avaliações e outras atividades programadas pelo

  centro de instrução.

  - Zelar pelo patrimônio do centro de instrução, incluindo edifícios, equipamentos,

  mobiliário e qualquer material de uso coletivo.

  - Manter comportamento social e vestimentas compatíveis com o ambiente educacional.

  - Tratar com civilidade os instrutores, responsáveis técnico e pedagógico, equipe

  administrativa e de limpeza, bem como os demais colegas.

  - Seguir as regras de realização de avaliação de desempenho e interposição de recursos

  definidas pela instituição, ciente que será excluído do curso caso seja identificado

  qualquer meio fraudulento para realização das avaliações.

  - Não divulgar às pessoas que não desempenham atividades relacionadas à segurança as

  informações adquiridas em regulamentação sigilosa, não repassando os materiais

  utilizados no curso.


  Avaliação de desempenho

  A avaliação de desempenho, quando aplicável, é realizada ao final do curso para verificação

  da aprendizagem do conteúdo pelo aluno.

  A elaboração da prova a ser aplicada pelo centro de instrução é responsabilidade da ANAC,

  sendo o centro de instrução responsável apenas por sua aplicação e correção.

  O aluno somente poderá realizar o exame se estiver portando documento de identificação

  oficial com foto.


  29/10/2015

  IS nº 110-001

  Revisão A


  Somente serão aceitas marcações na folha de respostas entregue pelo responsável e com

  marcações feitas com caneta azul ou preta. O aluno deverá assinar o formulário de respostas

  para sua identificação.

  A avaliação de desempenho possui duração de 1(uma) hora e 30 (trinta) minutos. Exige-se

  pontualidade nos dias da avaliação, pois orientações importantes serão fornecidas previamente

  aos exames.

  Após a avaliação, o centro de instrução apresenta as notas aos alunos e procede os trâmites

  para publicação no sistema da ANAC.


  Interposição de recursos

  O aluno poderá interpor recurso acerca do resultado de uma ou mais questões após a avaliação

  de desempenho. Para isso deverá preencher o formulário de interposição de recurso, conforme

  as regras apresentadas no Apêndice N.

  A interposição de recursos somente pode ser realizada em local controlado pelo centro de

  instrução, cujo acesso ocorra apenas para aluno identificado.

  O gabarito será disponibilizado em até 2 (duas) horas do término da avaliação e o tempo

  destinado para o aluno interpor seu recurso é também de 2 (duas) horas.

  O prazo para a resposta sobre deferimento ou indeferimento do recurso é de até 10 (dez)
  dias.

  O aluno não deve levar consigo as provas e os gabaritos fornecidos exclusivamente para a

  interposição de recursos.


  Exclusão da avaliação

  O aluno terá sua prova anulada e o curso tornado sem validade se for pego cometendo alguma

  das seguintes irregularidades durante a avaliação:

  - consultando qualquer tipo de material;

  - fazendo uso de celular ou demais equipamentos eletrônicos;

  - fornecendo ou solicitando auxílio de colegas;

  - cometendo qualquer outro tipo de fraude para obter vantagens na aprovação do curso;

  - faltando com o devido respeito para com qualquer membro da equipe de aplicação da

  prova, com as autoridades presentes ou com os demais candidatos;

  - não entregando o caderno da prova teórica e folha de resposta ao término do tempo

  destinado para a sua realização;

  - afastando-se da sala, a qualquer tempo, sem autorização, portando ou não folha de

  respostas ou caderno de prova; ou

  - perturbando, de qualquer modo, a ordem dos trabalhos, incorrendo em comportamento

  indevido.


  29/10/2015

  IS nº 110-001

  Revisão A


  Resultado e Certificado

  Os certificados serão emitidos, exclusivamente, pela ANAC após a publicação do resultado

  pelo centro de instrução no sistema da Agência.

  O centro de instrução publica o resultado no sistema da ANAC em até <informar o prazo em

  dias> após o término da avaliação de desempenho.

  O centro de instrução entrega a Declaração de encaminhamento de aluno para Treinamento

  em Serviço, após o término das partes teórica e prática do curso de Formação em Inspeção
  de

  Segurança da Aviação Civil em até <informar prazo e forma de entrega>.


