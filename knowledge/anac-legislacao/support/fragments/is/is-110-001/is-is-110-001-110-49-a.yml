  apto ao início das atividades de Treinamento em Serviço, conforme parágrafo 110.51(g) e

  seção 110.71, ambos do RBAC 110.


  Ressalto que após a realização do Treinamento em Serviço, é necessário o

  encaminhamento de avaliação a este centro de instrução, por meio do aluno, para que a

  certificação seja emitida pela ANAC, conforme parágrafos 110.51(i) e 110.61(c) do RBAC

  110. O prazo para emissão da declaração é de até 10 (dez) dias após o término do

  Treinamento em Serviço, conforme parágrafo 110.71(f) do RBAC 110.


