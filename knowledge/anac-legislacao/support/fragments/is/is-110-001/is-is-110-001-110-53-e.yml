section_title: Avaliação de desempenho teórica
subsection_id: e
cite: 110.53(e)
title: 110.53(e)
text: '(e) O aluno que for inabilitado poderá realizar um novo curso AVSEC.


  C.3.1 As avaliações teóricas enviadas pela ANAC são recebidas pelo centro de instrução,
  impressas e

  mantidas em um envelope lacrado, o qual somente é aberto previamente à aplicação dos exames,
  na

  presença dos alunos.

  C.3.2 O centro de instrução disponibiliza no mínimo 1 (um) funcionário responsável pela
  aplicação de

  avaliação. Esse profissional deve assinar o termo de responsabilidade, juntamente com o
  responsável

  técnico do centro de instrução. No termo há descrição clara da turma, assim como do local
  e data da

  avaliação, conforme Apêndice M. Todos os procedimentos apresentados neste item (C.3) são
  válidos

  para primeira e segunda chamadas.

  C.3.3 A avaliação de desempenho é realizada na data e horário informados no cronograma presente
  nos

  regulamentos dos cursos, para os quais é exigida avaliação de desempenho. Os alunos são
  informados


  29/10/2015

  IS nº 110-001

  Revisão A


  por meio do regulamento e durante o curso sobre a necessidade de apresentar documento com
  foto

  para a realização das avaliações e interposição de recursos.

  C.3.4 O responsável pela aplicação das avaliações, munido de lista de alunos, identifica
  todas as

  pessoas por meio de documento com foto, permitindo permanecer em sala de aula somente alunos
  que

  realizarão as avaliações, coletando a assinatura de cada um na lista de frequência, conforme
  modelo no

  Apêndice K.

  C.3.5 Na aplicação de avaliação teórica, o responsável pela aplicação das avaliações realiza
  as

  seguintes etapas:

  C.3.5.1 Os alunos são orientados a ocuparem assentos, mantendo uma distância mínima de um

  assento dos alunos nas laterais e deixar sobre a mesa somente caneta, lápis, borracha e
  o

  documento de identificação.

  C.3.5.2 Após a devida identificação dos alunos, o envelope lacrado contendo as provas é
  aberto

  na frente dos alunos e estas são entregues de forma ordenada. Os alunos são orientados a
  não

  abrir o caderno de provas até que sejam autorizados. Caso a ANAC informe que deverão ser

  aplicadas mais de um modelo de prova para a turma, o responsável pela aplicação distribui
  os

  modelos de provas de forma intercalada.

  C.3.5.3 Após a distribuição das provas, o responsável pela aplicação da avaliação faz a
  leitura do

  roteiro preparatório presente no Apêndice N, em voz alta, apresentando as regras da avaliação.

  Caso algum aluno ainda precise adequar-se às regras da prova, como desligar o celular, o

  responsável aguarda até que todos estejam nas condições de iniciar a prova.

  C.3.5.4 É comunicado aos alunos, em voz alta, que estão autorizados a iniciar as avaliações,
  bem

  como é informado o seu horário de início, anotando esse horário, se possível, no quadro
  da sala a

  vista de todos.

  C.3.5.5 Após o início da avaliação começam a valer as regras de aplicação de exames informadas

  no roteiro preparatório, e o responsável pela aplicação deve supervisionar o seu cumprimento
  por

  parte dos alunos, de forma a evitar qualquer fraude durante as avaliações.

  C.3.5.6 O aluno que finalizar a prova antes do tempo pode ser dispensado. Se vários alunos

  terminam a aplicação do exame ao mesmo tempo, o responsável pela aplicação solicita que
  eles

  aguardem em seus assentos, enquanto recolhe as folhas de um aluno por vez. O aplicador deve

  ter paciência e atenção para manter o controle da turma enquanto recolhe o material distribuído.

  O aplicador verifica se todas as folhas da prova e gabarito de cada aluno estão no conjunto
  de

  documentos recolhidos. O aluno pode levar consigo somente as anotações iguais às que marcou

  na folha de respostas.

  C.3.5.7 Cada conjunto de prova e folha de respostas recolhido deve ser mantido fora do alcance


  29/10/2015

  IS nº 110-001

  Revisão A


  visual dos alunos.

  C.3.5.8 Faltando 30 (trinta) minutos para o encerramento da avaliação, os alunos são alertados

  sobre o tempo que resta para o término da avaliação. No término do tempo de 1 (uma) hora
  e 30

  (trinta) minutos, os alunos são informados que o tempo de prova acabou e todas as avaliações
  e

  folhas de respostas são recolhidas.

  C.3.6 Após o término da avaliação, o responsável pela aplicação guarda todo o material utilizado
  num

  envelope e o lacra para enviar ao centro de instrução.

  C.3.7 O responsável pela aplicação inicia a correção das folhas de resposta dos alunos,
  munido do

  gabarito disponibilizado pela ANAC, registrando o percentual de acertos em campo específico
  da lista

  de presença dos alunos. Finalizada a correção, o responsável pela aplicação guarda as folhas
  de

  respostas em envelope e o lacra para enviar ao centro de instrução. Posteriormente as notas
  dos

  alunos são informadas.

  C.3.8 No caso do curso de Formação em Inspeção de Segurança da Aviação Civil, após a confirmação

  de aprovação dos alunos, o responsável técnico emite, individualmente, a Declaração de

  encaminhamento de aluno para Treinamento em Serviço, conforme Apêndice S. O aluno deverá

  encaminhar essa declaração à organização com responsabilidade AVSEC para dar início às atividades

  junto ao operador.


  C.4 INTERPOSIÇÃO DE RECURSO'
