section_title: Interposição de recursos às avaliações de desempenho teóricas
subsection_id: d
cite: 110.57(d)
title: 110.57(d)
text: '(d) Para os alunos que desejarem interpor recurso, o centro de instrução deve disponibilizar
  um

  modelo da avaliação de desempenho aplicada, o respectivo gabarito e um formulário de recurso,

  em até 2 (duas) horas após o aluno concluir a avaliação de desempenho.

  (1) A avaliação de desempenho aplicada, o gabarito e o formulário de recurso só devem ser

  disponibilizados em ambiente controlado, conforme regras deste Regulamento, não permitindo

  que as questões sejam copiadas.

  (2) O processo de interposição de recurso deve ser realizado presencialmente em sala de
  aula, em


  29/10/2015

  IS nº 110-001

  Revisão A


  ambiente controlado por indivíduo que tenha assinado previamente termo de responsabilidade,

  inclusive para os cursos a distância ou semipresenciais, de forma a evitar a cópia de questões

  pelos alunos que tiverem acesso ao modelo da avaliação de desempenho disponibilizado.

  (3) O aluno poderá levar o registro de suas respostas para conferência do gabarito.'
