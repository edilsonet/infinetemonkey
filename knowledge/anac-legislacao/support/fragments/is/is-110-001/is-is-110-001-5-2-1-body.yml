text: '5.2.1

  Para as alterações posteriores à autorização concedida pela ANAC referentes à qualificação

  da pessoa jurídica ou do seu representante legal, aos cursos AVSEC a serem ministrados e
  ao

  MPCI, conforme previsto no parágrafo 110.29(g) do RBAC 110, o centro de instrução deverá

  encaminhar o requerimento contido no Apêndice V, instruído com o tópico do MPCI alterado.'
