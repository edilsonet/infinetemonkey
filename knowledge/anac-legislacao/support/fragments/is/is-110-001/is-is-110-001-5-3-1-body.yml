text: '5.3.1

  Durante os processos de análise do requerimento de autorização ou de alterações previstas
  no

  parágrafo 110.29(g) do RBAC 110, a ANAC poderá solicitar reuniões com representantes da

  empresa requerente para tratar de assunto específico do processo de autorização de centro
  de

  instrução ou atualização de MPCI.'
