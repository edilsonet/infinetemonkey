text: '5.4.1

  O MPCI é documento obrigatório a ser elaborado pelo centro de instrução e deve ser

  apresentado com a seguinte estrutura:

  a)

  Capa (Apêndice A);

  b)

  Controle de alterações (Apêndice A);

  c)

  Sumário (Apêndice A);

  d)

  Termo de Responsabilidade (Apêndice A);

  e)

  Generalidades (Apêndice A);

  f)

  Dados gerais do centro de instrução (Apêndice B);

  g)

  Quadro funcional (Apêndice B);

  h)

  Lista de cursos AVSEC (Apêndice B);

  i)

  Recursos auxiliares da instrução (Apêndice B);

  j)

  Referências bibliográficas e documentos normativos ou regulamentares utilizados nos

  cursos AVSEC (Apêndice B);

  k)

  Nível de sigilo, arquivo e guarda de documento (Apêndice B);

  l)

  Plataformas ou meios utilizados para instrução nos cursos a distância ou

  semipresenciais (Apêndice B);

  m)

  Responsabilidades e procedimentos de seleção dos profissionais e conferência dos

  requisitos para desempenho de atividades AVSEC (Apêndice C);

  n)

  Responsabilidades e procedimentos de matrícula de alunos (Apêndice C);

  o)

  Responsabilidades e procedimentos de avaliação de desempenho e interposição de

  recurso (Apêndice C);

  p)

  Responsabilidades e procedimentos de melhoria da qualidade (Apêndice C);

  q)

  Grade curricular (Apêndice D);

  r)

  Proposta de Plano de aula (Apêndice E);

  s)

  Modelo de Formulário para conferência e arquivamento dos documentos referentes aos

  requisitos para desempenho de atividades AVSEC (Apêndice F);

  t)

  Modelo de Formulário para conferência e arquivamento dos documentos de matrícula

  de aluno (Apêndice G);

  u)

  Modelo de Ficha de matrícula em curso AVSEC (Apêndice H);

  v)

  Modelo de Regulamento de Curso (Apêndice I);

  w)

  Modelo de Formulário de recebimento de Regulamento de Curso e de material

  instrucional (Apêndice J);

  x)

  Modelo de Lista de frequência (Apêndice K);

  y)

  Modelo de Formulário de avaliação de instrutor (Apêndice L);

  z)

  Modelo de Termo de responsabilidade na aplicação de avaliação de desempenho e

  interposição de recursos (Apêndice M);


  29/10/2015

  IS nº 110-001

  Revisão A


  aa)

  Modelo de roteiro preparatório para avaliação de desempenho (Apêndice N);

  bb) Modelo de Formulário para interposição de recursos (Apêndice O);

  cc)

  Modelo de Formulário para avaliação de reação (Apêndice P);

  dd) Modelo de Formulário de tabulação de resultados (Apêndice Q);

  ee)

  Modelo de Formulário de ações corretivas (Apêndice R);

  ff)

  Modelo de Declaração de encaminhamento de aluno para Treinamento em Serviço

  (Apêndice S);

  gg) Modelo de Formulário para arquivamento de documentos relacionados a turma de curso

  AVSEC (Apêndice T);

  hh) Comprovante de aquisição de software simulador de equipamento de raios-X ou

  documento de autorização de uso.'
