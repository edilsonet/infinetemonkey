title: 5.4.3
text: '5.4.3

  No MPCI a ser submetido à ANAC, o centro de instrução deverá apresentar os tópicos

  presentes nos Apêndices A, B e E. Os demais tópicos do MPCI somente deverão ser

  encaminhados à ANAC se houver procedimentos que diferirem do conteúdo dos Apêndices

  C, D, F, G, H, I, J, K, L, M, N, O, P, Q, R, S e T desta IS.'
