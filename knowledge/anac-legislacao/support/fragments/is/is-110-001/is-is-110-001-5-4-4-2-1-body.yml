text: '5.4.4.2.1 A proposta de plano de aula constante do Apêndice E deve servir como um balizador
  para a

  condução das aulas pelos instrutores. Assim, entende-se que as modificações realizadas na

  proposta de plano de aula de determinado curso são atribuições dos instrutores, não sendo

  necessário encaminhamento à ANAC caso haja modificação.'
