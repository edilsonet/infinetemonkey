text: '5.4.4.2.2 Os dados constantes da subseção B.5 do Apêndice B desta IS somente necessitam
  ser

  enviados à ANAC na primeira avaliação do MPCI, tendo em vista a solicitação de autorização

  do centro de instrução, não sendo necessário o envio a cada atualização de referências

  bibliográficas, documentos normativos ou regulamentares.'
