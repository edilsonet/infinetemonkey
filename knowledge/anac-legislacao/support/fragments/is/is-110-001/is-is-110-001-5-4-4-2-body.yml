text: '5.4.4.2 No caso de pedido de alteração conforme o parágrafo 110.29(g) do RBAC 110,
  o interessado

  deve proceder às alterações que julgar necessárias no texto dos Apêndices desta IS, justificá-

  las no requerimento contido no Apêndice V e indicá-las no sumário do MPCI.'
