text: '5.4.5

  O Sumário deve ser elaborado de forma que seja possível identificar os tópicos que

  apresentam diferenças dos modelos ou procedimentos presentes nos apêndices desta IS,

  conforme os parágrafos 5.4.4, 5.4.4.1 e 5.4.4.2. A coluna “ALTERADO” do sumário deve ser

  preenchida com as palavras “SIM” ou “NÃO”, conforme haja ou não indicação de diferença,

  respectivamente.'
