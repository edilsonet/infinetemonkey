text: '5.4.6

  Os dados dispostos na alínea l) do parágrafo 5.4.1 desta subseção somente devem ser

  preenchidos (conforme Apêndice B) pelas empresas que solicitarem autorização ou

  atualização de autorização de cursos na modalidade de ensino a distância, devendo ser


  29/10/2015

  IS nº 110-001

  Revisão A


  excluídos do MPCI dos demais centros de instrução.'
