  B.6 NÍVEL DE SIGILO, ARQUIVO E GUARDA DE DOCUMENTO

  B.6.1 O centro de instrução mantém, em meio físico ou digital, os seguintes registros de
  seleção e

  conferência dos requisitos para desempenho de atividades AVSEC em seu benefício:

  a) Antecedentes criminais;

  b) comprovante de residência, conforme legislação específica sobre a matéria;

  c) Questionário de entrevista;

  d) exames ou laudos médicos;

  e) Curriculum vitae; e

  f)

  Testes de conhecimentos, se houver.

  B.6.1.1 Com exceção das alíneas a) e b), os demais itens não são exigidos caso o desempenho
  das

  atividades AVSEC ocorra por meio de concurso público.

  B.6.2 O centro de instrução mantém arquivados, em meio físico ou digital, os seguintes documentos

  relativos aos procedimentos de matrícula de cada aluno:

  a) Antecedentes criminais ou cópia legível da credencial de acesso à área restrita de segurança
  do

  aeroporto, conforme parágrafo 110.43(a)(1)(iii) do RBAC 110;

  b) comprovante de residência, conforme legislação específica sobre a matéria;

  c) comprovante de recebimento de regulamento de curso e de material instrucional;


  29/10/2015

  IS nº 110-001

  Revisão A


  d) comprovante de escolaridade, para matrícula nos cursos Básico AVSEC, Inspeção de Segurança

  da Aviação Civil, AVSEC para Operador de Aeródromo e AVSEC para Operador Aéreo;

  e) Licença válida de tripulante, para matrícula no curso AVSEC para Tripulante;

  f)

  Habilitação para exercer a atividade de vigilante, conforme DPF, para matrícula no curso
  AVSEC

  para Vigilante;

  g) Certificado do curso Básico AVSEC, para matrícula no curso de Formação em Inspeção de

  Segurança da Aviação Civil;

  h) Ficha de Avaliação do Treinamento em Serviço, para matrícula no curso de Atualização
  em

  Inspeção de Segurança da Aviação Civil;

  i)

  Certificado do curso Básico AVSEC, para matrícula nos cursos AVSEC para Operador de

  Aeródromo e AVSEC para Operador Aéreo;

  j)

  cópia legível de comprovante de experiência profissional de, no mínimo, 6 (seis) meses em

  atividade relacionada com a aviação civil (exemplo: carteira de trabalho, declaração da
  empresa,

  contrato de prestação de serviço, ato da Administração Pública publicado no Diário Oficial
  da União,

  entre outros), para os cursos AVSEC para Operador de Aeródromo e AVSEC para Operador Aéreo;
  e

  k) Ficha de avaliação do Treinamento em Serviço para o curso de Atualização em Inspeção
  de

  Segurança da Aviação Civil.

  B.6.3 O centro de instrução mantém arquivados os seguintes documentos relativos a cada turma
  de

  curso AVSEC:

  a) Grade horária;

  b) Grade curricular;

  c) Registro de frequência dos alunos;

  d) 1 (um) exemplar de cada avaliação de desempenho aplicada e folhas de respostas de todos
  os

  alunos;

  e) declarações emitidas pelo centro de instrução contendo os alunos aprovados em curso de

  Formação em Inspeção de Segurança da Aviação Civil, habilitando-os para o início do Treinamento

  em Serviço;

  f)

  Fichas de avaliações do Treinamento em Serviço emitidas por organização com responsabilidade

  AVSEC, para o curso de Formação e Atualização em Inspeção de Segurança da Aviação Civil;

  g) Termos de responsabilidade dos aplicadores de avaliações de desempenho e de interposição
  de

  recursos; e

  h) Formulários das interposições de recursos às avaliações de desempenho, incluindo as respostas
  do

  responsável técnico.

  B.6.4 O centro de instrução mantém arquivados os seguintes registros relativos aos procedimentos
  de

  melhoria da qualidade:

  a) Formulário para avaliação de reação;


  29/10/2015

  IS nº 110-001

  Revisão A


  b) Formulário de tabulação de resultados;

  c) Formulário de ações corretivas, quando houver; e

  d) Formulário de avaliação de instrutor.


  B.6.5 Períodos de arquivamento:

  B.6.5.1 Os registros dos procedimentos de seleção e de conferência dos requisitos para desempenho
  de

  atividades AVSEC de funcionários são guardados pelo tempo em que o profissional mantém relação

  de trabalho e até 1 (um) ano após o seu desligamento.

  B.6.5.2 O centro de instrução mantém arquivados por, no mínimo, 5 (cinco) anos todos os
  documentos

  referentes aos itens B.6.2, B.6.3 e B.6.4.


  B.6.6 Condições de arquivamento:

  <Informar como ocorre o arquivamento:

  - Se ocorre somente após o encerramento de um processo ou por etapas.

  - Nome do responsável e em qual momento são conferidos os documentos a serem arquivados,

  utilizando o Formulário para arquivamento de documentos relacionados a turma de curso

  AVSEC, conforme modelo no Apêndice T.

  - Se o meio utilizado para arquivamento é físico, digital ou uma combinação de ambos.

  - Descrever como será organizado o arquivamento, por exemplo, em caixas, pastas, arquivo

  deslizante, se será organizado em ordem alfabética, ordem cronológica ou outro meio de fácil

  acesso.

  - Descrever como um documento pode ser localizado no arquivo: por uma sequência lógica,

  com uso de planilha, por meio de um sistema informatizado, outros.

  - Outras características do processo de arquivamento>.

  - <Se houver alguma diferença entre as formas de arquivamento de documentos relativos a

