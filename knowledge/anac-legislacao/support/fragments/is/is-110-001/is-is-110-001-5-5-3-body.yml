  A.4 TERMO DE RESPONSABILIDADE DE CUMPRIMENTO DO MPCI


  Em atenção à regulamentação da ANAC, declaramos que temos conhecimento dos requisitos

  do RBAC 110, das disposições da IS nº 110-001 e das responsabilidades e procedimentos contidos
  no

  MPCI elaborado, atualizado e conferido por este centro de instrução.

  Por este termo assumimos em nome do(a) <nome do centro de instrução>, em atenção ao

  parágrafo 110.39(b)(5) do RBAC 110, total responsabilidade pela implementação dos procedimentos

  descritos neste MPCI, incluindo os trechos para os quais não foi apresentada diferença em
  relação ao

  modelo disponibilizado pela ANAC.

  Sendo assim, assinamos o presente Termo de Responsabilidade comprometendo-nos pelo

  cumprimento do RBAC 110 e do referido MPCI em todos os seus aspectos legais e normativos
  perante

  a Autoridade de Aviação Civil.


