  de curso AVSEC.

  Apêndice U - Requerimento de autorização de centro de instrução.

  Apêndice V - Requerimento de alteração do MPCI.

  7.

  DISPOSIÇÕES FINAIS

  7.1

  O responsável técnico do centro de instrução deve avaliar o conteúdo apresentado nesta IS,

  com o intuito de verificar se os procedimentos previstos são suficientes para garantia da

  qualidade da instrução ministrada, levando em consideração as necessidades e níveis de

  complexidade e criticidade de suas atividades de instrução.

  7.2

  Os casos omissos serão dirimidos pela ANAC.

  7.3

  Esta IS entra em vigor na data de sua publicação.


  29/10/2015

  IS nº 110-001

  Revisão A


