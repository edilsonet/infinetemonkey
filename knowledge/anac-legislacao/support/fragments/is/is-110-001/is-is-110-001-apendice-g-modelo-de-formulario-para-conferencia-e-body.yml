title: APÊNDICE G - MODELO DE FORMULÁRIO PARA CONFERÊNCIA E
text: 'APÊNDICE G - MODELO DE FORMULÁRIO PARA CONFERÊNCIA E

  ARQUIVAMENTO DOS DOCUMENTOS DE MATRÍCULA DE ALUNO


  DOCUMENTOS PARA CONFERÊNCIA E ARQUIVAMENTO RELATIVOS AOS

  PROCEDIMENTOS DE MATRÍCULA DE ALUNOS

  Aluno:

  Curso:

  Data:

  Local de realização do curso:

  DOCUMENTOS COMUNS PARA MATRÍCULA EM TODOS OS CURSOS AVSEC


  Antecedentes Criminais.


  Comprovante de residência.


  Cópia legível de documento de identidade ou credencial aeroportuária.


  Ficha de matrícula em curso AVSEC.

  DOCUMENTOS ESPECÍFICOS PARA MATRÍCULA EM CURSOS AVSEC


  Comprovante de escolaridade, para matrícula nos cursos Básico AVSEC, Inspeção de

  Segurança da Aviação Civil, AVSEC para Operador de Aeródromo e AVSEC para

  Operador Aéreo.


  Licença válida de tripulante, para matrícula no curso AVSEC para Tripulante.


  Habilitação para exercer a atividade de vigilante, conforme DPF, para matrícula no

  curso AVSEC para Vigilante.


  Certificado do curso Básico AVSEC, para matrícula no curso de Formação em

  Inspeção de Segurança da Aviação Civil.


  Ficha de Avaliação do Treinamento em Serviço, para matrícula no curso de

  Atualização em Inspeção de Segurança da Aviação Civil.


  Certificado do curso Básico AVSEC, para matrícula nos cursos AVSEC para Operador

  de Aeródromo e AVSEC para Operador Aéreo.


  Cópia legível da carteira de trabalho, somente das páginas que comprovem experiência

  profissional mínima de 6 (seis) meses no sistema de aviação civil, para os cursos

  AVSEC para Operador de Aeródromo e AVSEC para Operador Aéreo.

  DOCUMENTOS ENTREGUES AOS ALUNOS NO PROCEDIMENTO DE MATRÍCULA


  Regulamento do curso.


  Material instrucional.


  Formulário de recebimento de regulamento de curso e de material instrucional (para

  assinatura, somente).


  29/10/2015

  IS nº 110-001

  Revisão A'
