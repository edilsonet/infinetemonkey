text: 'a) Para os cursos AVSEC para Atendimento ao Passageiro, AVSEC para Carga Aérea e

  AVSEC para Operações de Solo:

  - Atestado de antecedentes criminais; (1) e

  - documento pessoal de identificação válido, com fotografia, data de nascimento e que

  possua fé pública ou credencial aeroportuária.'
