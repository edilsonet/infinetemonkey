title: apendice-i-modelo-de-regulamento-de-curso(b)
text: 'b) Para o curso Básico AVSEC:

  - frequência mínima igual ou superior a 80% (oitenta por cento) da carga horária do

  curso; e

  - nota na avaliação teórica igual ou superior a 70% (setenta por cento).'
