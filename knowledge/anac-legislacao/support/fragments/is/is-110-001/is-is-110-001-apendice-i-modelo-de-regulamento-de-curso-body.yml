  Empresa autorizada pela ANAC por meio da Portaria nº <inserir nº da

  Portaria>, autorização que pode ser consultada no sítio eletrônico:

  www.anac.gov.br/avsec, pelo link “centro de instrução”.

  Endereço: <inserir endereço da sede do centro de instrução>

  Telefone: <inserir telefone da sede do centro de instrução>


  O centro de instrução apresenta um meio de comunicação com o aluno para que ele

  encaminhe reclamações, sugestões e elogios, por meio do e-mail: <inserir e-mail>


  Responsável Técnico: <inserir nome completo do responsável>


  Procedimentos para matrícula

  <O centro de instrução pode manter somente os dados do curso que o aluno for realizar>

  Para a efetivação de sua matrícula o aluno deverá apresentar à secretaria de cursos deste

  centro de instrução os seguintes documentos:'
