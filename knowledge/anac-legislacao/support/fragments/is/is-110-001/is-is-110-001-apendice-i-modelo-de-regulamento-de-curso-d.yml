text: 'd) Para o curso Básico AVSEC:

  - Atestado de antecedentes criminais; (1)

  - comprovante de conclusão de nível médio; e

  - documento pessoal de identificação válido, com fotografia, data de nascimento e que

  possua fé pública ou credencial aeroportuária.'
