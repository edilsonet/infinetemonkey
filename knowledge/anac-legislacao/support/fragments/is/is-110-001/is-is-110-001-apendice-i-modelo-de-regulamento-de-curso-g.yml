text: 'g) Para curso AVSEC para Operador Aéreo:

  - Atestado de antecedentes criminais; (1)

  - comprovante de conclusão de nível médio;

  - Certificado do curso Básico AVSEC, se a matrícula ocorrer para curso de Formação;

  - cópia legível de comprovante de experiência profissional de, no mínimo, 6 (seis)

  meses em atividade relacionada com a aviação civil (exemplo: carteira de trabalho,

  declaração da empresa, contrato de prestação de serviço, ato da Administração Pública

  publicado no Diário Oficial da União, entre outros); e


  29/10/2015

  IS nº 110-001

  Revisão A


  - documento pessoal de identificação válido, com fotografia, data de nascimento e que

  possua fé pública ou credencial aeroportuária.


  (1) Até a entrada em vigor do RBAC 107, serão considerados válidos os atestados emitidos
  conforme

  exigências da IAC 107-1006.


