text: 'APÊNDICE L - MODELO DE FORMULÁRIO DE AVALIAÇÃO DE INSTRUTOR


  Centro de Instrução:

  Nome do avaliador:

  Nome do instrutor avaliado:

  Curso:

  Item do conteúdo programático:

  Data:

  Local:


  Na observação da aula, o avaliador deverá levantar aspectos relacionados à atuação do instrutor,
  ao material

  didático utilizado, à qualidade da aula, ao respeito à programação proposta, ao alcance
  dos objetivos do curso, ao

  uso dos recursos auxiliares, à relação instrutor-aluno e demais tópicos relacionados à pratica
  docente e ao bom

  desenvolvimento das aulas.

  Nº

  Itens de Verificação

  Resposta

  Sim

  Não

  N/A*

  1

  O instrutor verificou se todos os alunos receberam o material

  instrucional?


  2

  O instrutor manteve uma continuidade na apresentação do

  conteúdo, de forma a garantir o pleno desenvolvimento dos

  conceitos AVSEC?


  3

  Houve

  compatibilidade

  do

  material

  instrucional

  com

  a

  apresentação do instrutor?


  4

  Houve coerência dos conteúdos apresentados com os objetivos

  propostos?


  5

  A aula foi ministrada de acordo com a proposta de plano de aula e

  a programação do curso inicialmente apresentada?


  6

  As modificações na programação do curso prejudicaram a


  29/10/2015

  IS nº 110-001

  Revisão A


  formação dos alunos?


  7

  O instrutor demonstrou conhecimento dos regulamentos e

  forneceu bons exemplos para ilustrar o assunto aos alunos?


  8

  O instrutor se dispôs a esclarecer as dúvidas dos alunos?


  9

  O instrutor fez bom uso dos recursos, tais como vídeos,

  simulacros, equipamentos de inspeção, dentre outros?


  10

  O instrutor soube conduzir os alunos durante a atividade prática?


  Anotações gerais:


  * Não aplicável.


  _______________________________________

  Assinatura do avaliador


  29/10/2015

  IS nº 110-001

  Revisão A'
