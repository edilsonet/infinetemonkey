text: 'APÊNDICE M - MODELO DE TERMO DE RESPONSABILIDADE NA

  APLICAÇÃO DE AVALIAÇÃO DE DESEMPENHO E INTERPOSIÇÃO DE

  RECURSOS


  Este centro de instrução, <inserir nome do centro de instrução e CNPJ> informa que

  <inserir nome completo do responsável pela aplicação de avaliação de desempenho e

  interposição de recurso e seu CPF> está autorizado(a) a acompanhar os procedimentos de

  avaliação de desempenho e interposição de recursos do curso <informar o curso AVSEC>, na

  localidade de <informar município e endereço de realização do curso>, durante o período
  de

  <informar o período de realização do curso>, a ser realizado na modalidade <informar o

  curso é se presencial ou a distância>, tendo sido informado(a) das responsabilidades que

  possui com relação ao sigilo das informações contidas nas avaliações, da lisura do processo

  de certificação. Esse profissional está ciente de que sua conduta influencia diretamente
  a

  segurança da aviação civil e está sujeito às medidas cabíveis caso se comprove a ocorrência

  de irregularidades, entre elas:

  - repassar as respostas das avaliações a um ou mais alunos;

  - ser conivente com a troca de informações entre os alunos;

  - permitir que um ou mais alunos realize a prova em tempo superior ao previsto;

  - permitir que um ou mais alunos utilize qualquer equipamento eletrônico, bem como

  livros, apostilas e demais materiais durante a execução da prova;

  - fornecer qualquer auxílio não previsto para a execução das provas.


  _______________________________________

  Responsável Técnico


  Eu, <inserir nome completo do responsável pela aplicação de avaliação de desempenho e

  interposição de recurso e seu CPF>, declaro que estou ciente das informações acima

  apresentadas, bem como das regras presentes no Apêndice N do MPCI deste centro de

  instrução, sabendo que estou sujeito às medidas cabíveis em caso de descumprimento deste

  termo de responsabilidade.


  ______________________________________

  Responsável pela aplicação de avaliação de desempenho

  e interposição de recurso


  29/10/2015

  IS nº 110-001

  Revisão A'
