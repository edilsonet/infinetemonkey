text: 'APÊNDICE N - MODELO DE ROTEIRO PREPARATÓRIO PARA AVALIAÇÃO

  DE DESEMPENHO


  O responsável pela aplicação da avaliação de desempenho e interposição de recursos

  deverá ler em voz alta para a turma, antes de iniciar a contagem do tempo da avaliação,
  as

  seguintes regras, além daquelas contidas na capa da prova:


  “Vamos dar início à avaliação de desempenho. Para isso é importante que vocês

  conheçam as regras que todos devem seguir durante a avaliação, conforme a seguir.'
