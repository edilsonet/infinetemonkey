text: 'APÊNDICE Q - MODELO DE FORMULÁRIO DE TABULAÇÃO DE RESULTADOS


  Item

  Nota média (=3)

  Avaliação da nota

  1

  <Somatório de

  notas dividido

  pelo número de

  alunos>

  <Informar se a nota foi satisfatória ou não, considerando

  satisfatório o que está igual ou maior do que a média,

  apresentando um breve parecer caso seja insatisfatória.

  Fazer análise com base nas notas e nos comentários dos

  alunos>

  2


  3


  4


  5


  6


  7


  8


  9


  10


  Considerações gerais sobre o curso:


  Representação Gráfica

  <Apresentar aqui os resultados encontrados acima de maneira gráfica, utilizando, no

  mínimo, uma das seguintes representações: gráfico de coluna, gráfico em barra, gráfico em

  pizza, gráfico em linhas, gráfico de áreas ou gráfico de redes>.


  Data: ____/____/____

  _____________________________________

  Responsável técnico


  29/10/2015

  IS nº 110-001

  Revisão A'
