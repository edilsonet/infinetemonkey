text: 'APÊNDICE S - MODELO DE DECLARAÇÃO DE ENCAMINHAMENTO DE

  ALUNO PARA TREINAMENTO EM SERVIÇO


  Declaro, como responsável técnico por este centro de instrução, que o aluno <inserir

  nome completo do aluno> foi aprovado nas partes teórica e prática do curso de Formação em

  Inspeção de Segurança da Aviação Civil, que se realizou na cidade de <inserir nome da

  cidade onde ocorreu o curso>, no período de ____/____/____ a ____/____/____, estando

  apto ao início das atividades de Treinamento em Serviço, conforme parágrafo 110.51(g) e

  seção 110.71, ambos do RBAC 110.


  Ressalto que após a realização do Treinamento em Serviço, é necessário o

  encaminhamento de avaliação a este centro de instrução, por meio do aluno, para que a

  certificação seja emitida pela ANAC, conforme parágrafos 110.51(i) e 110.61(c) do RBAC

  110. O prazo para emissão da declaração é de até 10 (dez) dias após o término do

  Treinamento em Serviço, conforme parágrafo 110.71(f) do RBAC 110.


  Caso seja necessária a confirmação dos dados acima mencionados favor entrar em

  contato:


  Nome do centro de instrução: __________________________________________________

  Nome do responsável técnico: __________________________________________________

  Telefone: __________________________________________

  E-mail: ____________________________________________


  Reforço ainda que a nossa autorização para ministrar o curso Inspeção de Segurança

  da Aviação Civil consta na Portaria <inserir número da portaria de autorização>, disponível

  no site da ANAC.


  Data: _____/_____/_____


  _____________________________________________

  Assinatura do responsável técnico


  29/10/2015

  IS nº 110-001

  Revisão A'
