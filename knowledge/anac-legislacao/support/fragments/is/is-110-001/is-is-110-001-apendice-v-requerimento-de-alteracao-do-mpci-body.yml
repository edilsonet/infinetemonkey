text: 'APÊNDICE V - REQUERIMENTO DE ALTERAÇÃO DO MPCI

  PEDIDO

  ( ) Inclusão de curso(s) ( ) Exclusão de curso(s)

  ( ) Alteração do responsável técnico ( ) Alteração do representante legal

  ( ) Alteração de grade curricular

  ( ) outros:________________________________________

  DADOS DO CENTRO DE INSTRUÇÃO

  Nome:

  CNPJ:

  DADOS DO RESPONSÁVEL OU REPRESENTANTE LEGAL

  Nome:

  Telefone:

  E-mail:

  Venho requerer a alteração do MPCI do centro de instrução acima qualificado, com base nos
  preceitos

  do Regulamento Brasileiro de Aviação Civil nº 110, para <ministrar ou excluir> os seguintes
  cursos:


  AVSEC para Atendimento ao Passageiro


  AVSEC para Carga Aérea


  AVSEC para Operações de Solo


  AVSEC para Tripulante


  AVSEC para Vigilante


  Básico AVSEC


  Inspeção de Segurança da Aviação Civil


  AVSEC para Operador de Aeródromo


  AVSEC para Operador Aéreo

  Declaro que seguem anexos a este requerimento os seguintes documentos, conforme os parágrafos

  110.29(b)(4) e (6) do RBAC 110.


  MPCI


  Material instrucional

  Declaro que o MPCI apresentado possui diferenças com relação à IS nº 110-001 apenas nos
  seguintes

  itens:*

  Número do item

  Justificativa


  * Ressalta-se que o preenchimento das lacunas do modelo (<preencher>) não se configura como
  diferença.


  DATA: ____/____/____

  _______________________________________________________

  ASSINATURA DO REPRESENTANTE LEGAL'
