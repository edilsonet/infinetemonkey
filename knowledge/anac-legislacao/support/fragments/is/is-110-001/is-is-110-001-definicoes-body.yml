title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1

  Para os efeitos desta Instrução Suplementar, aplicam-se as definições estabelecidas nos

  seguintes atos: Regulamento Brasileiro da Aviação Civil nº 01 − RBAC 01; Regulamento

  Brasileiro da Aviação Civil nº 110 − RBAC 110; Regulamento Brasileiro da Aviação Civil nº

  107 − RBAC 107; Regulamento Brasileiro da Aviação Civil nº 108 − RBAC 108;

  Regulamento Brasileiro da Aviação Civil nº 111 − RBAC 111; Decreto nº 7.168, de 5 de maio

  de 2010, que dispõe sobre o Programa Nacional de Segurança da Aviação Civil contra Atos

  de Interferência Ilícita; e Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o
  Código

  Brasileiro da Aeronáutica; e as seguintes:

  Avaliação de Reação: Instrumento utilizado para medir a satisfação dos alunos com relação

  ao curso que foi ministrado, considerando dentre outros aspectos, as condições físicas do

  ambiente, os materiais disponíveis, os recursos utilizados, os objetivos propostos e a atuação

  dos instrutores.

  Recursos Auxiliares de Instrução: Materiais didáticos voltados para finalidade AVSEC,

  incluindo simulacros, pórticos, sistema simulador de equipamento de Raios-X, entre outros.

  4.2

  Aplicam-se, para os efeitos desta IS, as abreviações e siglas estabelecidas nos seguintes
  atos:

  RBAC 01; RBAC 110; RBAC 107; RBAC 108; RBAC 111; Decreto nº 7.168, de 2010; e Lei

  nº 7.565, de 1986.

  5.'
