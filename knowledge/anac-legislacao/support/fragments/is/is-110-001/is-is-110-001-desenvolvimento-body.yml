title: DESENVOLVIMENTO
text: 'DESENVOLVIMENTO

  <Detalhar a maneira como cada tópico do roteiro será

  abordado, mencionado os principais argumentos, exemplos e

  estratégias que serão empregados na explanação>.

  <Definir as estratégias de participação dos alunos, exemplos:

  perguntas e respostas, exercícios, atividades em grupo, dentre

  outros>.

  <Definir os recursos utilizados, tais como slides, apostilas,

  vídeos, áudios, formulários, simulacros, equipamentos de

  inspeção etc>.

  <inserir, em minutos, o

  tempo da aula

  correspondente à

  conclusão>

  CONCLUSÃO

  Síntese

  <Mencionar que será realizada a releitura dos tópicos do roteiro

  e dos objetivos>.

  Remotivação

  <Apresentar a estratégia de remotivação a ser adotada,

  lembrando que esta serve como um convite à atuação>.

  Fecho

  <Apresentar uma frase de reflexão>.


  29/10/2015

  IS nº 110-001

  Revisão A'
