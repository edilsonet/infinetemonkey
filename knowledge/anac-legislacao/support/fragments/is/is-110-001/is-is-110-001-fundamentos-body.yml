title: FUNDAMENTOS
text: 'FUNDAMENTOS

  3.1

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de

  Aeronáutica.

  3.2

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.

  3.3

  Decreto nº 7.168, de 5 de maio de 2010, cujo Anexo dispõe sobre o Programa Nacional de

  Segurança da Aviação Civil contra Atos de Interferência Ilícita.

  3.4

  Resolução nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho de

  2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução

  Suplementar (IS), estabelece critérios para elaboração e dá outras providências.

  3.5

  Resolução nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação

  Civil (RBAC) nº 110, que trata do Programa Nacional de Instrução em Segurança da Aviação

  Civil contra atos de interferência ilícita - PNIAVSEC.

  3.6

  Instrução Normativa nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162, de
  20

  de julho de 2010, que estabelece normas e critérios para a elaboração e alteração de

  Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.


  29/10/2015

  IS nº 110-001

  Revisão A


  4.'
