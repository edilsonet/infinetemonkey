title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR - IS


  IS Nº 110-001

  REVISÃO A

  Aprovação:

  Portaria nº 2893/SIA, de 28 de outubro de 2015.

  Assunto:

  Processo de autorização de centros de instrução e Manual de

  Procedimentos do Centro de Instrução (MPCI).


  1.

  OBJETIVO

  1.1

  Esta Instrução Suplementar - IS visa estabelecer orientações quanto ao processo de

  autorização de centros de instrução e à elaboração do Manual de Procedimentos do Centro
  de

  Instrução - MPCI.

  1.2

  Esta IS descreve procedimentos aceitos pela ANAC que garantem o cumprimento dos

  requisitos contidos nas seções 110.29 e 110.39 do Regulamento Brasileiro da Aviação Civil
  nº

  110 por parte dos centros de instrução.

  1.3

  Os procedimentos administrativos, acadêmicos e pedagógicos descritos nesta IS devem ser

  utilizados como referência pelos centros de instrução, ficando sujeitas à análise e aprovação

  da ANAC as propostas que divirjam dos procedimentos aqui apresentados.

  1.4

  Os meios ou procedimentos alternativos mencionados no parágrafo 1.3 devem garantir nível

  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o

  objetivo do procedimento normalizado nesta IS.

  2.

  REVOGAÇÃO - N/A

  3.

  FUNDAMENTOS

  3.1

  Lei nº 7.565, de 12 de dezembro de 1986, que dispõe sobre o Código Brasileiro de

  Aeronáutica.

  3.2

  Lei nº 11.182, de 27 de setembro de 2005, que cria a Agência Nacional de Aviação Civil.

  3.3

  Decreto nº 7.168, de 5 de maio de 2010, cujo Anexo dispõe sobre o Programa Nacional de

  Segurança da Aviação Civil contra Atos de Interferência Ilícita.

  3.4

  Resolução nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de julho de

  2010, que institui o Regulamento Brasileiro da Aviação Civil (RBAC) e a Instrução

  Suplementar (IS), estabelece critérios para elaboração e dá outras providências.

  3.5

  Resolução nº 361, de 16 de julho de 2015, que aprova o Regulamento Brasileiro de Aviação

  Civil (RBAC) nº 110, que trata do Programa Nacional de Instrução em Segurança da Aviação

  Civil contra atos de interferência ilícita - PNIAVSEC.

  3.6

  Instrução Normativa nº 15, de 20 de novembro de 2008, alterada pela Resolução nº 162, de
  20

  de julho de 2010, que estabelece normas e critérios para a elaboração e alteração de

  Regulamento Brasileiro da Aviação Civil e de Instrução Suplementar.


  29/10/2015

  IS nº 110-001

  Revisão A


  4.

  DEFINIÇÕES

  4.1

  Para os efeitos desta Instrução Suplementar, aplicam-se as definições estabelecidas nos

  seguintes atos: Regulamento Brasileiro da Aviação Civil nº 01 − RBAC 01; Regulamento

  Brasileiro da Aviação Civil nº 110 − RBAC 110; Regulamento Brasileiro da Aviação Civil nº

  107 − RBAC 107; Regulamento Brasileiro da Aviação Civil nº 108 − RBAC 108;

  Regulamento Brasileiro da Aviação Civil nº 111 − RBAC 111; Decreto nº 7.168, de 5 de maio

  de 2010, que dispõe sobre o Programa Nacional de Segurança da Aviação Civil contra Atos

  de Interferência Ilícita; e Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o
  Código

  Brasileiro da Aeronáutica; e as seguintes:

  Avaliação de Reação: Instrumento utilizado para medir a satisfação dos alunos com relação

  ao curso que foi ministrado, considerando dentre outros aspectos, as condições físicas do

  ambiente, os materiais disponíveis, os recursos utilizados, os objetivos propostos e a atuação

  dos instrutores.

  Recursos Auxiliares de Instrução: Materiais didáticos voltados para finalidade AVSEC,

  incluindo simulacros, pórticos, sistema simulador de equipamento de Raios-X, entre outros.

  4.2

  Aplicam-se, para os efeitos desta IS, as abreviações e siglas estabelecidas nos seguintes
  atos:

  RBAC 01; RBAC 110; RBAC 107; RBAC 108; RBAC 111; Decreto nº 7.168, de 2010; e Lei

  nº 7.565, de 1986.

  5.

  DESENVOLVIMENTO DO ASSUNTO

  5.1

  Requerimento para Autorização de centro de instrução'
