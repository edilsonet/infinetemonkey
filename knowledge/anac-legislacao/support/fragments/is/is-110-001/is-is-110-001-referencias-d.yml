text: 'd) Formulário de avaliação de instrutor.


  B.6.5 Períodos de arquivamento:

  B.6.5.1 Os registros dos procedimentos de seleção e de conferência dos requisitos para desempenho
  de

  atividades AVSEC de funcionários são guardados pelo tempo em que o profissional mantém relação

  de trabalho e até 1 (um) ano após o seu desligamento.

  B.6.5.2 O centro de instrução mantém arquivados por, no mínimo, 5 (cinco) anos todos os
  documentos

  referentes aos itens B.6.2, B.6.3 e B.6.4.


  B.6.6 Condições de arquivamento:

  <Informar como ocorre o arquivamento:

  - Se ocorre somente após o encerramento de um processo ou por etapas.

  - Nome do responsável e em qual momento são conferidos os documentos a serem arquivados,

  utilizando o Formulário para arquivamento de documentos relacionados a turma de curso

  AVSEC, conforme modelo no Apêndice T.

  - Se o meio utilizado para arquivamento é físico, digital ou uma combinação de ambos.

  - Descrever como será organizado o arquivamento, por exemplo, em caixas, pastas, arquivo

  deslizante, se será organizado em ordem alfabética, ordem cronológica ou outro meio de fácil

  acesso.

  - Descrever como um documento pode ser localizado no arquivo: por uma sequência lógica,

  com uso de planilha, por meio de um sistema informatizado, outros.

  - Outras características do processo de arquivamento>.

  - <Se houver alguma diferença entre as formas de arquivamento de documentos relativos a

  cursos presenciais e cursos EAD, informar aqui essa diferença.>


  B.6.7 Controle de acesso:

  <Descrever os meios utilizados para garantir a segurança da informação, como o uso de armários

  com chave, armário com abertura por senha, ou sistema de controle de acesso à software/hardware

  quando em arquivo digital.>

  <Mencionar os cargos da empresa que possuem acesso ao arquivo e de que maneira tem acesso:

  chave, senha, digital, dentre outros>.


  29/10/2015

  IS nº 110-001

  Revisão A


  B.7 PLATAFORMAS OU MEIOS UTILIZADOS PARA INSTRUÇÃO NOS CURSOS A

  DISTÂNCIA OU SEMIPRESENCIAIS


  B.7.1 O centro de instrução utiliza a plataforma <descrever resumidamente o método em EAD

  proposto para o curso, incluindo o meio de transmissão do conhecimento e o nome da plataforma,

  caso aplicável> em seus cursos na modalidade a distância. Algumas das características dos
  cursos

  EAD ministrados neste centro de instrução estão listadas abaixo:


  B.7.2 Descrição dos recursos:

  B.7.2.1 Materiais de leitura: <mencionar se o curso utiliza algum recurso de leitura, tais
  como

  apostilas, apresentações em PowerPoint, murais de leitura, sites, e-mails, blogs, bibliotecas
  virtuais,

  e-books etc.>

  B.7.2.2 Recursos auditivos: <mencionar se o curso utiliza algum recurso auditivo, tais como
  CD,

  MP3, podcasting, radio Web etc.>

  B.7.2.3 Recursos audiovisuais: <mencionar se o curso utiliza algum recurso audiovisual,
  tais como

  televisão, videocassete, DVD, videoconferência, vídeo digital, animação gráfica etc.>


  B.7.2.4 Grupos de discussão: <mencionar se o curso possui listas de discussões, fóruns,
  chats ou salas

  de bate-papo e como funcionam.>


  B.7.3 Atividades de fixação da aprendizagem:

  <Inserir informações sobre as atividades de fixação da aprendizagem.>


  B.7.4 Critérios para controle da participação de aluno em curso EAD

  <Inserir informações sobre os critérios para garantir a efetiva participação do aluno, tais
  como nota

  mínima nos exercícios, tempo mínimo de acesso ao portal, participação nos grupos de discussão,

  prazos para envio de atividades, processo de revisão de aulas, dentre outros.>


  B.7.5 Avaliação de Reação em curso EAD

  <Inserir informações sobre como será realizada a avaliação de reação, utilizando o modelo
  de

  formulário contido no Apêndice P.>


  B.7.6 Suporte técnico e pedagógico

  <Mencionar como funciona o suporte dos profissionais técnicos e pedagógicos durante o curso.>


  B.7.7 Demais características

  <Inserir demais informações julgadas importantes para o bom desenvolvimento do curso a

  distância.>


  29/10/2015

  IS nº 110-001

  Revisão A'
