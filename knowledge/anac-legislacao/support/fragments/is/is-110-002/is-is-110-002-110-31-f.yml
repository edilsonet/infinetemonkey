cite: 110.31(f)
title: 110.31(f)
text: '(f) É vedado ao Instrutor AVSEC exercer, qualquer das atividades previstas neste Regulamento,
  após período de afastamento superior a 365 dias corridos. (Incluído pela Resolução nº 638,
  de 07.10.2021)

  (1) Entende-se por afastamento o período em que o Instrutor AVSEC não desempenha suas funções
  nos limites de sua certificação;

  (2) O prazo descrito no parágrafo (f) desta Seção terá início no primeiro dia após a data
  do último exercício da atividade de Instrutor AVSEC;

  (3) Na hipótese do afastamento por prazo superior ao previsto no parágrafo (f) desta Seção,
  o Instrutor AVSEC deverá realizar treinamento, na forma estabelecida pela ANAC, visando
  a retomada das competências necessárias para exercício de suas atividades com segurança.

  5.3.11.1 O Treinamento após período de afastamento deverá ser composto pelos conteúdos indicados
  no item 5.3.10.2 desta IS, acrescido de ao menos uma turma supervisionada/avaliada.

  5.3.11.2 O Treinamento indicado no item 5.3.11.1 desta IS deverá ser formalizado por meio
  de documento que apresente resumo das atividades realizadas, a carga horária e a frequência
  do profissional em treinamento (Apêndice D).

  5.3.11.2.1 Durante a Prática supervisionada, o Supervisor de Treinamento deverá avaliar
  a competência do profissional para garantir que o Instrutor AVSEC esteja apto para ministrar
  o(s) curso(s) para os quais foi habilitado, de acordo com os parâmetros do MPCI.

  5.3.11.3 Os itens a serem observados pelo Supervisor de Treinamento durante a ministração
  das aulas estão disponibilizados na Ficha de Avaliação (Apêndice E), que deverá ser assinada
  pelo Supervisor e pelo profissional, para que se formalize o treinamento.

  5.3.11.4 O centro de instrução é o responsável por informar à ANAC no cadastro de turma
  AVSEC, o nome e o CPF dos instrutores em treinamento após período de afastamento.


  5.4 Responsabilidades e procedimentos relativos ao nível de sigilo, arquivo e guarda dos
  registros'
