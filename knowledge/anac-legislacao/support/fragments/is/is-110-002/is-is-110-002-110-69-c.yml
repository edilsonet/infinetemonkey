cite: 110.69(c)
title: 110.69(c)
text: '(c) É vedado ao Agente de Proteção da Aviação Civil - APAC exercer, qualquer das atividades
  AVSEC previstas neste Regulamento, após período de afastamento superior a 180 dias corridos.
  (Incluído pela Resolução nº 638, de 07.10.2021)

  (1) Entende-se por afastamento o período em que o APAC não desempenha suas funções nos limites
  de sua certificação;

  (2) O prazo descrito no parágrafo (c) desta Seção terá início no primeiro dia após a data
  do último exercício da atividade AVSEC como APAC;

  (3) Na hipótese do afastamento por prazo superior ao previsto no parágrafo (c) desta Seção
  o APAC deverá realizar treinamento, na forma estabelecida pela ANAC, visando a retomada
  das competências necessárias para exercício de suas atividades com segurança'
