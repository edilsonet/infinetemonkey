text: '5.1.1 Todos os dados referentes aos treinamentos deverão ser informados à ANAC por
  meio de sistema específico.

  5.1.2 A prestação das informações prevista no item 5.1.1 desta IS deverá ter início a partir
  da disponibilização de sistema específico pela ANAC. Para fins de fiscalização ou controle
  de qualidade, a ANAC poderá solicitar o envio da documentação referente ao treinamento dos
  profissionais AVSEC por outro meio a qualquer tempo.

  5.2 Do Agente de Proteção da Aviação Civil'
