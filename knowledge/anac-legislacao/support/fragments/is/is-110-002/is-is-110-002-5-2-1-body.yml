title: O Treinamento em Serviço poderá ocorrer tanto como parte do processo de certificação
  quanto para a aquisição ou comprovação de proficiência.
text: '5.2.1 O Treinamento em Serviço poderá ocorrer tanto como parte do processo de certificação
  quanto para a aquisição ou comprovação de proficiência.

  5.2.2 Após certificado, o profissional deverá realizar novo treinamento em serviço sempre
  que for designado para um novo posto de trabalho, exceto quando as atividades e especificações
  do novo posto forem iguais ao posto anterior ou o profissional já tenha realizado o referido
  treinamento durante a vigência da sua atual certificação.

  5.2.2.1 O treinamento em serviço do profissional designado para um novo posto de trabalho
  poderá ter duração variável, a depender do conhecimento prévio e do desempenho do profissional
  avaliado, ficando a cargo do Supervisor de Treinamento a identificação do tempo necessário
  para a comprovação da plena proficiência no novo posto.


  Exemplo 1

  Um APAC que atuava na inspeção de bagagens despachadas foi transferido para inspeção de
  carga, ambas utilizando equipamento de raios-x. Tendo em vista a facilidade demonstrada
  pelo profissional em transferir o conhecimento acumulado na inspeção de bagagens despachadas
  para o novo posto de trabalho, o supervisor considerou adequado atestar sua proficiência
  em de curto período de tempo após iniciado o treinamento em serviço.

  Exemplo 2

  Um APAC que atuava na inspeção de passageiros foi remanejado de posto para exercer a atividade
  de inspeção da carga e mala postal. Apesar de ter adquirido conhecimento prático acerca
  do uso do equipamento de raios-x para inspeção de pertences de mão, seu conhecimento acerca
  da inspeção da carga se resume ao adquirido no curso de formação em Inspeção de Segurança.

  Neste caso, o período de treinamento em serviço do APAC deverá ser compatível com o tempo
  necessário para que adquira esquemas de interpretação de imagens de carga.

  Nota. Recomenda-se às organizações com responsabilidade AVSEC a elaboração de um Manual
  para Treinamento em Serviço local, considerando as particularidades de cada posto de trabalho,
  ou melhoria/detalhamento dos atuais Manuais de Procedimento de cada posto.

  5.2.3 A organização com responsabilidade AVSEC deverá designar um ou mais Supervisores de
  Treinamento responsáveis pelo acompanhamento e avaliação do treinamento em serviço dos APACs.
