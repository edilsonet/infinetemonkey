text: '5.2.4.13 O profissional possui o prazo máximo de 12 (doze) meses, a contar do último
  dia do curso, para concluir o Treinamento em Serviço.

  5.2.4.14 As organizações com responsabilidade AVSEC deverão entregar a ficha de avaliação
  ao profissional no prazo máximo de 10 (dez) dias após o término do Treinamento em Serviço.'
