text: '5.2.4.15 As organizações deverão remeter cópia digitalizada da ficha ao Centro de Instrução
  responsável pelo treinamento do profissional.

  5.2.4.16 O profissional em treinamento deve entregar a Ficha de Avaliação de Treinamento
  em Serviço ao Centro de Instrução e efetuar o pagamento da TFAC correspondente para emitir
  seu certificado.'
