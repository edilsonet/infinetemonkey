section_id: 5.2.4.6
section_title: 'O Treinamento em Serviço é composto pelas seguintes fases, de responsabilidade
  da organização com responsabilidade AVSEC:'
subsection_id: i
cite: 5.2.4.6(i)
title: 5.2.4.6(i)
text: '(i) teste nos procedimentos de controle de acesso de pessoas às aeronaves;

  (ii) teste nos procedimentos de verificação e inspeção de segurança das aeronaves, no caso
  em que a base opere voo internacional; e.

  (iii) teste nos procedimentos de transporte das provisões de bordo e/ou de serviço de bordo,
  no caso em que o APAC for responsável pela aceitação das provisões de bordo e/ou de serviço
  de bordo produzidas em pontos sem acesso direto às ARS e o transporte se der de forma que
  os procedimentos descritos no item B.16 da IS nº 108-001 sejam aplicáveis.

  Sendo assim, em média o profissional em treinamento em serviço deverá realizar 7 testes
  relativos a cada protocolo de teste aplicável.

  Exemplo 3

  O operador, identificando que não possui capacidade operacional para realizar o treinamento
  em serviço em 5 dias seguidos, solicita que o profissional em treinamento compareça ao trabalho
  em dias alternados (1ª semana - segunda, quarta e sexta e 2ª semana - terça e quinta), a
  fim de garantir a organização e realização dos 20 testes aleatórios e a disponibilidade
  do CBT.

  5.2.4.6.2.7 Na Fase 3, o Supervisor de Treinamento deverá considerar:'
