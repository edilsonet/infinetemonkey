title: 5.2.4.8(b)
text: 'b) Parte 2, denominada Guia de Encaminhamento, destinada ao registro do resultado final
  da avaliação do profissional em treinamento.

  5.2.4.9 No final do treinamento em serviço, o Supervisor de Treinamento deverá formalizar
  por meio da Ficha de Avaliação, se o novo profissional está “apto” ou “não-apto” para desempenho
  de suas funções, com base nos critérios de avaliação citados na Fase 3.

  5.2.4.10 A decisão de “apto” ou “não-apto” deverá ser compartilhada com o Responsável pelo
  PCQ/AVSEC da organização com responsabilidade AVSEC. A Ficha de avaliação referente a prática
  avaliada (Apêndice B) deverá ser assinada pelo Responsável pelo PCQ/AVSEC juntamente com
  o Supervisor de Treinamento.

  5.2.4.11 No caso de o profissional não alcançar o resultado “apto” no treinamento em serviço,
  poderá ser concedido um tempo adicional de treinamento a fim de que o profissional aprimore
  as competências necessárias e que nova avaliação (Fase 3) seja realizada.

  5.2.4.12 No caso de novo resultado “não-apto”, o perfil do profissional para atuar no canal
  de inspeção deverá ser reconsiderado pela organização com responsabilidade AVSEC antes de
  uma decisão sobre uma nova oportunidade de treinamento.'
