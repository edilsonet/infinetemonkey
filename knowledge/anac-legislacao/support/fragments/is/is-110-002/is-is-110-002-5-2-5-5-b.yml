section_id: 5.2.5.5
section_title: 'O Treinamento em Serviço é composto pelas seguintes fases:'
subsection_id: b
cite: 5.2.5.5(b)
title: 5.2.5.5(b)
text: 'b) 6 horas por semestre, totalizando 12 (doze) horas por ano, utilizando sistema simulador
  de equipamento de raios-x de um Centro de Instrução autorizado.

  5.2.5.5.1.2 A simulação de ameaças deve utilizar uma biblioteca de imagens substancial,
  incluindo variedade de tipos de ameaças em diferentes posicionamentos no interior da mala
  e em termos de ângulo de visão do objeto. Para bagagem de mão deve incluir objetos pontiagudos
  e cortantes, bombas, armas, explosivos, dispositivos explosivos improvisados (IEDs) e/ou
  seus componentes e demais objetos proibidos previstos em regulamentação específica da ANAC.
  Para bagagem despachada e carga deve se concentrar em IEDs.

  5.2.5.5.1.3 Na Fase 2, o Supervisor de Treinamento deverá utilizar os critérios de avaliação
  previstos no item 5.2.4.6.2.7 desta IS.

  5.2.5.6 Ao longo do treinamento em serviço, o Supervisor de Treinamento deverá avaliar continuamente
  o desempenho do profissional, a fim de identificar progressos e deficiências e fornecer-lhe
  feedbacks do trabalho desenvolvido para que tenha a oportunidade de melhorar o seu desempenho.

  5.2.5.7 O Supervisor de Treinamento realizará apontamentos na Ficha de Avaliação quanto
  ao desempenho do APAC em testes aleatórios, relacionamento com os clientes e colegas de
  equipe e nível de proficiência nas atividades AVSEC que realiza.

  5.2.5.7.1 Não sendo o Supervisor do módulo de inspeção (função VI) também o Supervisor de
  Treinamento, o Supervisor do módulo de inspeção deverá repassar eventuais observações referentes
  às competências do APAC ao Supervisor de Treinamento para que sejam inseridas na Ficha de
  avaliação referente a prática supervisionada.'
