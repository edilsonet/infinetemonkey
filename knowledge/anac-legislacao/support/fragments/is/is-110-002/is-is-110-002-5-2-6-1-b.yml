section_id: 5.2.6.1
section_title: O Treinamento após período de afastamento deve ocorrer durante a efetiva prestação
  de serviço e dentro do período de validade da certificação vigente.
subsection_id: b
cite: 5.2.6.1(b)
title: 5.2.6.1(b)
text: 'b) ser um instrutor permanente do centro de instrução, com habilitação válida de Instrutor
  AVSEC do curso a ser avaliado, que possua no mínimo 2 anos de experiência atuando segundo
  os parâmetros do MPCI do referido centro.

  5.3.3 O Treinamento dos Instrutores AVSEC deverá abranger os cursos para os quais o profissional
  recebeu a certificação, conforme o RBAC nº 110 e a Portaria nº 5.148, de 2021.'
