title: O Treinamento após período de afastamento deve ocorrer durante a efetiva prestação
  de serviço e dentro do período de validade da certificação vigente.
text: '5.2.6.1 O Treinamento após período de afastamento deve ocorrer durante a efetiva prestação
  de serviço e dentro do período de validade da certificação vigente.

  5.2.6.2 O Treinamento poderá ter duração variável, a depender do conhecimento prévio e do
  desempenho do profissional avaliado, ficando a cargo do Supervisor de Treinamento a identificação
  do tempo necessário para a comprovação da plena proficiência no posto de trabalho.

  5.2.6.2.1 As Fichas de Avaliação contidas no Apêndice B e C desta IS poderão ser adaptadas
  considerando o posto de trabalho ocupado pelo profissional em treinamento.

  5.2.6.3 No caso de o profissional não alcançar o resultado “apto” no treinamento poderá
  realizar novamente as Fases previstas nesta IS, de acordo com as necessidades identificadas
  pelo Supervisor de Treinamento.

  5.2.6.3.1 No caso de novo resultado “não-apto”, o perfil do profissional para atuar no posto
  de trabalho deverá ser reconsiderado pela organização com responsabilidade AVSEC, antes
  de uma decisão sobre uma nova oportunidade de treinamento.


  5.3 Do Instrutor AVSEC

  5.3.1 O Centro de Instrução deverá garantir que os Instrutores AVSEC estejam competentes
  para exercer suas atividades, mantendo atualizados seus conhecimentos e habilidades tanto
  nas técnicas de ensino quanto na área de segurança da aviação civil contra atos de interferência
  ilícita.

  5.3.2 O Centro de Instrução deverá designar um responsável pelo acompanhamento e avaliação
  do treinamento em serviço dos Instrutores AVSEC. As qualificações mínimas para a função
  são:'
