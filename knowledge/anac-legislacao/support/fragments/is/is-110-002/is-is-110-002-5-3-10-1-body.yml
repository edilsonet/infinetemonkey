text: '5.3.10.1 O Instrutor AVSEC deverá participar de treinamento recorrente no Centro de
  Instrução, a fim de que permaneça competente para exercer suas atividades.

  Nota. Recomenda-se que o Treinamento recorrente ocorra a cada 24 (vinte e quatro) meses
  e que seja realizado por meio de vários encontros durante o período.'
