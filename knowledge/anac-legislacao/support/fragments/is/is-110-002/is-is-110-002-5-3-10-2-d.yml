title: 5.3.10.2(d)
text: 'd) verificação da experiencia operacional mínima ou realização de 4 atividades operacionais
  por semestre, conforme regulamentação e orientações específicas da ANAC.

  5.3.10.3 O Treinamento indicado no item 5.3.10.2 desta IS deverá ser formalizado por meio
  de documento que apresente resumo das atividades realizadas, a carga horária e a frequência
  do profissional em treinamento (Apêndice D).'
