text: '5.3.4 O Treinamento dos Instrutores AVSEC não poderá ocorrer em cursos aprovados na
  modalidade EAD assíncrono.

  5.3.5 Durante o Treinamento inicial e o Treinamento após período de afastamento, o Instrutor
  AVSEC somente poderá ministrar aulas em cursos AVSEC sob a supervisão do Supervisor de Treinamento.'
