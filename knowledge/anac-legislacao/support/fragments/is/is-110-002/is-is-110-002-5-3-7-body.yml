text: '5.3.7 Os planos de aula, o material instrucional do curso e o MPCI deverão ser entregues
  ao profissional em treinamento.

  5.3.8 O Centro de Instrução deverá inserir no seu MPCI os procedimentos referentes ao treinamento
  do Instrutor AVSEC, quando for submetida a próxima revisão do Manual, sendo aplicável o
  texto integral da IS até eventual proposta e aprovação de forma de cumprimento alternativa.'
