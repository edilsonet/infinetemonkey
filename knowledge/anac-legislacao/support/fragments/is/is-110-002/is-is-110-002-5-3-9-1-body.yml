text: '5.3.9.1 Antes de ministrar qualquer instrução, o Instrutor AVSEC deverá ter participado
  de treinamento inicial no Centro de Instrução em que irá atuar.

  5.3.9.1.1 Caso o instrutor já tenha atuado ministrando o mesmo curso em outro CI, o novo
  Centro de Instrução poderá levar o fato em consideração ao planejar o treinamento inicial.

  5.3.9.2 O treinamento inicial de cada instrutor deve estar vinculado às atividades desenvolvidas
  pelo profissional nos cursos AVSEC e aos procedimentos do Centro de Instrução.'
