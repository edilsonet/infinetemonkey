text: 'e) atualizações quanto a novas tecnologias e regulamentos aplicáveis à(s) respectiva(s)
  habilitação(ões).

  5.3.9.4 O Treinamento indicado no item 5.3.9.3 desta IS deverá ser formalizado por meio
  de documento que apresente resumo das atividades realizadas, carga horária e a frequência
  do profissional em treinamento (Apêndice D).

  5.3.9.5 Durante a Prática supervisionada, o Supervisor de Treinamento deverá avaliar a competência
  do profissional e realizar as etapas necessárias para garantir que o Instrutor AVSEC esteja
  apto para ministrar o(s) curso(s) para os quais foi habilitado, de acordo com os parâmetros
  do MPCI.

  Exemplo

  Recebendo instrutores de outros Centros de Instrução ou novos instrutores (sem experiência
  em curso AVSEC / pouca ou larga experiência operacional / pouca ou larga experiência didática):

  O novo instrutor recebe acesso e orientações relacionadas aos documentos, formulários, planos
  de aula, plataformas EAD etc. necessários ao desempenho de suas atividades. (Estudo de todo
  o material)

  O Supervisor de Treinamento esclarece eventuais dúvidas em relação aos conteúdos programáticos
  previstos na grade curricular do(s) curso(s) relativo(s) ao treinamento. Em seguida, insere
  o profissional em treinamento no sistema da ANAC, a fim de que acompanhe e participe de
  uma Turma de Curso AVSEC.

  Ao fim do curso, caso o Supervisor de Treinamento conclua que o profissional em treinamento
  se encontra apto para atuar sem supervisão, assinará a ficha e liberará o novo instrutor.

  Caso negativo, o Supervisor de Treinamento recomendará um maior tempo de estudo da documentação
  e reavaliará a competência do instrutor, até que esse seja considerado apto para atuar sem
  supervisão, podendo inseri-lo como instrutor em treinamento em quantos cursos forem necessários.

  5.3.9.6 Os itens a serem observados pelo Supervisor de Treinamento durante a ministração
  das aulas estão disponibilizados na Ficha de Avaliação (Apêndice E), que deverá ser assinada
  pelo Supervisor e pelo profissional, para que se formalize o treinamento.'
