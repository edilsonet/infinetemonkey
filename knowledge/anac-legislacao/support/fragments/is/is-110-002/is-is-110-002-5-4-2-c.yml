section_id: 5.4.2
section_title: 'O centro de instrução deverá manter arquivados, em meio físico ou digital,
  por no mínimo 5 (cinco) anos, os seguintes documentos:'
subsection_id: c
cite: 5.4.2(c)
title: 5.4.2(c)
text: 'c) Fichas de avaliação dos Treinamentos em Serviço dos Instrutores AVSEC.

  5.4.3 As organizações com responsabilidade AVSEC e os centros de instrução deverão garantir
  que haja registros que comprovem o atendimento dos requisitos para desempenho de atividade
  AVSEC para cada profissional que realizar atividade AVSEC em seu benefício, enquanto o profissional
  mantiver relação de trabalho e até um ano após o seu desligamento.'
