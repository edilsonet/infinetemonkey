text: '1. Objetivo

  1.1 Esta Instrução Suplementar - IS visa estabelecer meios e procedimentos para a realização
  do treinamento em serviço de profissionais AVSEC.

  1.2 Esta IS descreve procedimentos aceitos pela ANAC que garantem o cumprimento dos requisitos
  contidos nos parágrafos 110.31(f)(1)(2)(3), 110.63(b)(7)(8), 110.69(c)(1)(2)(3) e nas seções
  110.15, 110.17, 110.51 e 110.71 do Regulamento Brasileiro da Aviação Civil nº 110 por parte
  dos profissionais AVSEC, dos centros de instrução e das organizações com responsabilidade
  AVSEC.

  1.3 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
  previsto no RBAC nº 110 poderá:'
