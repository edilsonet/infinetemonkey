text: '5.2.4.13 O profissional possui o prazo máximo de 12 (doze) meses, a contar do último
  dia do curso, para concluir o Treinamento em Serviço.

  5.2.4.14 As organizações com responsabilidade AVSEC deverão entregar a ficha de avaliação
  ao profissional no prazo máximo de 10 (dez) dias após o término do Treinamento em Serviço.

  5.2.4.15 As organizações deverão remeter cópia digitalizada da ficha ao Centro de Instrução
  responsável pelo treinamento do profissional. A organização com responsabilidade AVSEC deverá
  remeter carta ao centro de instrução atestando a proficiência do(s) Supervisor(es) de Treinamento,
  com base nas qualificações mínimas constantes do item 5.2.3 desta IS, indicando a validade
  da referida designação de acordo com a certificação do profissional designado.

  5.2.4.16 O profissional em treinamento deve entregar a Ficha de Avaliação de Treinamento
  em Serviço ao Centro de Instrução e efetuar o pagamento da TFAC correspondente para emitir
  seu certificado.'
