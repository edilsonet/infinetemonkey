text: '5.2.4.5 O Supervisor de Treinamento só poderá acompanhar um profissional em treinamento
  por vez.

  5.2.4.5.1 Fica resguardado ao Supervisor de Treinamento acompanhar até dois profissionais
  em treinamento por vez nos casos em que não haja impacto nas operações e as atividades de
  ambos os profissionais em treinamento sejam realizadas no mesmo posto de trabalho.

  5.2.4.5.2 O Supervisor de Treinamento não deverá ser computado no cálculo do número de profissionais
  que deva estar disponível no módulo de inspeção, exceto durante a Fase 1 do Treinamento
  em Serviço para Atualização.'
