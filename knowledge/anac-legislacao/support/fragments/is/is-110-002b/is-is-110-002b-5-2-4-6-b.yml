section_title: 'O Treinamento em Serviço é composto pelas seguintes fases, de responsabilidade
  da organização com responsabilidade AVSEC:'
subsection_id: b
cite: 5.2.4.6(b)
title: 5.2.4.6(b)
text: 'b) utilizando sistema simulador de equipamento de raios-x de um Centro de Instrução
  autorizado.

  5.2.4.6.2.3 A simulação de ameaças deve utilizar uma biblioteca de imagens substancial,
  incluindo variedade de tipos de ameaças em diferentes posicionamentos no interior da mala
  e em termos de ângulo de visão do objeto. Para bagagem de mão deve incluir objetos pontiagudos
  e cortantes, bombas, armas, explosivos, dispositivos explosivos improvisados (IEDs) e/ou
  seus componentes e demais objetos proibidos previstos em regulamentação específica da ANAC.
  Para bagagem despachada e carga deve se concentrar em IEDs.

  5.2.4.6.2.4 Ao longo do treinamento em serviço, o Supervisor de Treinamento deverá avaliar
  continuamente o desempenho do profissional, a fim de identificar progressos e deficiências
  e fornecer-lhe feedbacks do trabalho desenvolvido para que tenha a oportunidade de melhorar
  o seu desempenho.

  5.2.4.6.2.5 O Supervisor de Treinamento realizará apontamentos na Ficha de Avaliação quanto
  ao desempenho do APAC em testes aleatórios, relacionamento com os clientes e colegas de
  equipe e nível de proficiência nas atividades AVSEC que realiza

  5.2.4.6.2.6 O profissional em treinamento em serviço deverá ser submetido a todos os tipos
  de testes de identificação de ameaças previstos em normativo específico aplicáveis ao posto
  de trabalho, a fim de que seja avaliado nos aspectos necessários ao desempenho da atividade.

  Exemplo 1

  Um profissional em treinamento em serviço trabalha no canal de inspeção de passageiros do
  aeroporto “Y”. Levando em conta que o parágrafo 107.185(e)(6)(i) do RBAC nº 107 prevê a
  realização de 1 (um) teste para cada ponto de controle de acesso à área restrita de segurança
  - ARS do aeródromo, o protocolo de teste AVSEC deverá ser repetido 20 (vinte) vezes para
  que o profissional em treinamento seja submetido aos 20 testes aleatórios.

  Exemplo 2

  O profissional em treinamento em serviço foi designado para um posto de trabalho, a fim
  de exercer as atividades de controle de acesso a aeronave e inspeção de aeronave. Durante
  o treinamento em serviço, o profissional deverá ser submetido a 20 testes aleatórios relacionados
  ao novo posto de trabalho, quais sejam:'
