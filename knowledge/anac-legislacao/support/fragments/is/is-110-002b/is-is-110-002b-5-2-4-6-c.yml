title: 5.2.4.6(c)
text: 'c) Fase 3: Identificação de ameaças (Prática avaliada).

  5.2.4.6.1 Na Fase 1, o profissional em treinamento em serviço deverá realizar a leitura
  do Manual de Procedimentos do posto de trabalho em que foi alocado e observar a execução
  de atividades pelos demais APACs.

  A leitura do Manual de Procedimentos poderá ser complementada por um treinamento específico
  de ambientação ao posto de trabalho ou por orientações do Supervisor de Treinamento acerca
  de procedimentos previstos em regulamentos da ANAC e no programa de segurança do operador.

  5.2.4.6.2 Na Fase 2, a organização com responsabilidade AVSEC deverá visar o aprimoramento
  do profissional para identificação de ameaças, utilizando-se de no mínimo 12 (doze) horas
  de simulações de ameaças (por meio de CBT) e 20 (vinte) horas de prática supervisionada
  no posto de trabalho.

  Exemplo

  Um profissional que trabalhasse 8 horas diárias completaria a Fase 2 do treinamento em serviço
  em 4 dias: 3 horas (CBT) + 5 horas de prática supervisionada no posto de trabalho por dia.

  Recomendação: O operador deveria prover meios para que estações de acesso ao CBT sejam localizadas
  nas proximidades do posto de trabalho.

  5.2.4.6.2.1 A simulação de ameaças (CBT) deverá ser realizada utilizando-se ferramenta disponibilizada
  pela ANAC.

  5.2.4.6.2.2 Enquanto não for disponibilizada ferramenta pela ANAC, a simulação de ameaças
