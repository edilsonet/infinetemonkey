section_title: Treinamento em Serviço para Formação em Inspeção de Segurança da Aviação Civil
subsection_id: b
cite: 5.2.4(b)
title: 5.2.4(b)
text: 'b) aprovação no exame de certificação da ANAC.

  5.2.4.2 O Treinamento em Serviço deverá ter duração mínima de 40 (quarenta) horas e deve
  ser concluído no prazo máximo de 30 (trinta) dias, a partir da data da contratação do profissional.

  Exemplo 1

  Um profissional que trabalhasse 8 horas diárias completaria o treinamento em serviço em
  5 dias (primeiras 40 horas de trabalho).

  Fase 1: 4 horas

  Fase 2: 32 horas - 12 horas de simulações de ameaça + 20 horas de prática supervisionada

  Fase 3: 4 horas

  Exemplo 2

  Um profissional que trabalhasse duas vezes na semana, em escala de 4 horas diárias, necessitaria
  de 5 semanas para completar as 40 horas de treinamento, ultrapassando o prazo máximo de
  30 dias previsto.

  Assim, para realizá-lo dentro do prazo, o supervisor deveria incluir dois dias extras (8
  horas) de treinamento, que poderiam ser utilizados na fase 01 (leitura de manuais do posto,
  orientações sobre o aeroporto etc.) e na fase 02 (utilização do CBT).

  5.2.4.3 O profissional em Formação em Inspeção de Segurança da Aviação Civil, durante todo
  o período do treinamento em serviço, não pode tomar decisão relacionada à resolução de alarmes
  sem a anuência do Supervisor de Treinamento.

  5.2.4.4 O profissional em Formação em Inspeção de Segurança da Aviação Civil poderá ser
  computado no cálculo do número de profissionais que deve estar disponível no módulo de inspeção,
  durante o período em que estiver efetivamente no módulo, acompanhado em todo o tempo por
  seu Supervisor de Treinamento.'
