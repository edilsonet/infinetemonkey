cite: 5.2.5.3.1
title: O Supervisor de Treinamento só poderá acompanhar um profissional em treinamento por
  vez.
text: '5.2.5.3.1 O Supervisor de Treinamento só poderá acompanhar um profissional em treinamento
  por vez.

  5.2.5.3.2 Caso o Supervisor de Treinamento seja também o Supervisor do módulo de inspeção,
  o referido profissional poderá acompanhar até 4 (quatro) profissionais em treinamento por
  vez, desde que que não haja impacto nas operações e as atividades de todos os profissionais
  em treinamento sejam realizadas no mesmo posto de trabalho.

  5.2.5.3.3 O Supervisor de Treinamento poderá ser computado no cálculo do número de profissionais
  que deva estar disponível no módulo de inspeção apenas durante a Fase 1 do Treinamento em
  Serviço para Atualização.

  5.2.5.4 Somente após a conclusão do treinamento em serviço é possível realizar matrícula
  no centro de instrução para o curso de Atualização em Inspeção de Segurança da Aviação Civil.'
