text: '5.2.5.5.2 Na Fase 2, o Supervisor de Treinamento deverá utilizar os critérios de avaliação
  previstos no item 5.2.4.6.2.7 desta IS.

  5.2.5.6 Ao longo do treinamento em serviço, o Supervisor de Treinamento deverá avaliar continuamente
  o desempenho do profissional, a fim de identificar progressos e deficiências e fornecer-lhe
  feedbacks do trabalho desenvolvido para que tenha a oportunidade de melhorar o seu desempenho.

  5.2.5.7 O Supervisor de Treinamento realizará apontamentos na Ficha de Avaliação quanto
  ao desempenho do APAC em testes aleatórios, relacionamento com os clientes e colegas de
  equipe e nível de proficiência nas atividades AVSEC que realiza.

  5.2.5.7.1 Não sendo o Supervisor do módulo de inspeção (função VI) também o Supervisor de
  Treinamento, o Supervisor do módulo de inspeção deverá repassar eventuais observações referentes
  às competências do APAC ao Supervisor de Treinamento para que sejam inseridas na Ficha de
  avaliação referente a prática supervisionada.'
