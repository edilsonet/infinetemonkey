section_id: 5.2.5.5
section_title: 'O Treinamento em Serviço é composto pelas seguintes fases:'
subsection_id: b
cite: 5.2.5.5(b)
title: 5.2.5.5(b)
text: 'b) 6 horas por semestre, totalizando no mínimo 12 (doze) horas durante a validade da
  certificação, utilizando sistema simulador de equipamento de raios-x de um Centro de Instrução
  autorizado.

  Nota. No período de 24 meses (validade da certificação), as horas de simulação de ameaças
  (CBT) serão proporcionais ao tempo de efetiva prestação de serviço, variando entre 12 e
  24 horas no total.

  Forma de cumprimento A:

  Exemplo 1

  180 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 15 minutos
  x 24 (nº de semanas trabalhando ou à disposição/sobreaviso) = 360 minutos = total de 6 horas
  no ano específico.

  Exemplo 2

  270 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 15 minutos
  x 36 (nº de semanas trabalhando ou à disposição/sobreaviso) = 540 minutos = total de 9 horas
  no ano específico.

  Exemplo 3

  365 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 15 minutos
  x 48 (nº de semanas trabalhando ou à disposição/sobreaviso) = 720 minutos = total de12 horas
  no ano específico.


  Forma de cumprimento B:

  Exemplo 1

  180 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 6 horas
  por semestre = total de 6 horas no ano específico

  Exemplo 2

  270 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 6 horas
  no 1º semestre + 3 horas no 2º semestre = total de 9 horas no ano específico

  Exemplo 3

  365 dias contratado no ano (trabalhando em tempo integral/parcial/escala/etc.) = 6 horas
  no 1º semestre + 6 horas no 2º semestre = total de12 horas no ano específico.

  Obs.: Para fins de manutenção de proficiência, mesmo os profissionais contratados para trabalhos
  em tempo parcial/sobreaviso/cobrir férias/etc. deverão realizar/considerar no cálculo 15
  minutos semanais durante o tempo em que estiverem efetivamente contratados/à disposição
  da empresa para assumir tarefas de inspeção.

  5.2.5.5.1.2 A simulação de ameaças deve utilizar uma biblioteca de imagens substancial,
  incluindo variedade de tipos de ameaças em diferentes posicionamentos no interior da mala
  e em termos de ângulo de visão do objeto. Para bagagem de mão deve incluir objetos pontiagudos
  e cortantes, bombas, armas, explosivos, dispositivos explosivos improvisados (IEDs) e/ou
  seus componentes e demais objetos proibidos previstos em regulamentação específica da ANAC.
  Para bagagem despachada e carga deve se concentrar em IEDs.'
