title: A duração da Prática avaliada depende da complexidade do posto de trabalho ocupado
  pelo profissional em treinamento.
text: '5.2.5.7.2 A duração da Prática avaliada depende da complexidade do posto de trabalho
  ocupado pelo profissional em treinamento.

  5.2.5.7.3 O Supervisor do Treinamento deverá fazer uso da Ficha de Avaliação contida no
  Apêndice B desta IS, considerando o posto de trabalho ocupado pelo profissional em treinamento.

  5.2.5.7.4 No caso de resultado “não-apto”, o profissional deverá ser submetido a uma ação
  de reciclagem a fim de se identificar o alcance ou não das competências esperadas.

  Exemplo 1

  No caso de um APAC que tenha trabalhado pelo período de um ano e meio, o profissional realizará
  18 horas de simulação de ameaças em CBT.

  O Supervisor de Treinamento observa e provê orientações ao profissional em treinamento em
  serviço, registrando as informações na ficha de avaliação (prática supervisionada). Também
  são registrados todos os testes pelos quais o profissional foi submetido.

  O Supervisor do módulo de inspeção (função VI) eventualmente informa ao Supervisor de Treinamento
  observações relacionadas ao profissional em treinamento em serviço para fins de registro
  na ficha de avaliação.

  Com antecedência adequada ao término da certificação do profissional, o Supervisor de Treinamento
  informa ao profissional em treinamento em serviço que o mesmo será avaliado durante determinada
  semana e observa todas as atividades do posto de trabalho sendo realizadas pelo profissional.
  Em sendo considerado apto, o Supervisor de Treinamento assinará a ficha de avaliação juntamente
  com um Responsável AVSEC local do Operador dando como concluído o treinamento em serviço.

  Exemplo 2

  No caso de um APAC que tenha trabalhado pelo período de 180 dias, o profissional deverá
  realizar 30 minutos de simulações de ameaças em CBT por semana, para que alcance o mínimo
  de 12 horas de simulações de ameaças previstas no RBAC nº 110.

  O Supervisor de Treinamento observa e provê orientações ao profissional em treinamento em
  serviço, registrando as informações na ficha de avaliação (prática supervisionada). Também
  são registrados todos os testes pelos quais o profissional foi submetido.

  O Supervisor do módulo de inspeção (função VI) eventualmente informa ao Supervisor de Treinamento
  observações relacionadas ao profissional em treinamento em serviço para fins de registro
  na ficha de avaliação.

  Com antecedência adequada ao término da certificação do profissional, o Supervisor de Treinamento
  informa ao profissional em treinamento em serviço que o mesmo será avaliado durante determinada
  semana e observa todas as atividades do posto de trabalho sendo realizadas pelo profissional.
  Em sendo considerado apto, o Supervisor de Treinamento assinará a ficha de avaliação juntamente
  com um Responsável AVSEC local do Operador dando como concluído o treinamento em serviço.

  Exemplo 3 - 110.71(3)(ii)(iii) do RBAC nº 110

  Um profissional em treinamento em serviço muda da organização com responsabilidade AVSEC
  A para a B antes de completar o período de treinamento de 180 dias. Nesse caso deverá iniciar
  novo período de 180 dias de treinamento em serviço na nova organização.

  Caso o profissional não atenda ao prazo mínimo de 180 dias de treinamento em serviço ao
  longo da vigência de sua certificação não obterá a certificação de Atualização devendo realizar
  novo curso de Formação, caso queira obter nova certificação.

  Exemplo 4

  Um profissional em treinamento em serviço não demonstrou proficiência durante a prática
  supervisionada (ou prática avaliada) devendo ser submetido à reciclagem prevista na seção
  110.73 do RBAC nº 110.

  Nesse caso, o profissional em treinamento em serviço deverá ser removido do posto de trabalho
  até ser atestado pelo responsável pela reciclagem que esse possui a proficiência necessária
  para exercer a(s) atividade(s) referente(s) ao posto.

  5.2.5.7.5 As organizações com responsabilidade AVSEC deverão entregar a ficha de avaliação
  ao profissional no prazo máximo de 10 (dez) dias após o término do Treinamento em Serviço.

  5.2.5.7.6 As organizações deverão remeter cópia digitalizada da ficha ao Centro de Instrução
  responsável pelo treinamento do profissional. A organização com responsabilidade AVSEC deverá
  remeter carta ao centro de instrução atestando a proficiência do(s) Supervisor(es) de Treinamento,
  com base nas qualificações mínimas constantes do item 5.2.3 desta IS, indicando a validade
  da referida designação de acordo com a certificação do profissional designado.

  5.2.5.7.7 O APAC deve entregar a Ficha de Avaliação de Treinamento em Serviço ao Centro
  de Instrução, realizar o curso de atualização, ser aprovado no exame de certificação e efetuar
  o pagamento da TFAC correspondente para emitir seu certificado.

  5.2.5.7.8 O profissional somente poderá atuar no posto de trabalho durante a vigência de
  sua certificação e após a emissão do certificado de atualização pela ANAC/Centro de Instrução
  autorizado.'
