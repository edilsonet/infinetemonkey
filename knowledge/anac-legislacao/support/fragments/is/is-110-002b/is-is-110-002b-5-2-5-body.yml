title: Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil
text: '5.2.5 Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil

  5.2.5.1 A certificação de Atualização em Inspeção de Segurança da Aviação Civil inicia com
  o Treinamento em Serviço na organização com responsabilidade AVSEC e termina com o curso
  no centro de instrução, devendo ocorrer na sequência demonstrada no Apêndice A desta IS.

  5.2.5.2 O Treinamento em Serviço para Atualização em Inspeção de Segurança da Aviação Civil
  deve ocorrer durante a efetiva prestação de serviço de inspeção e dentro do período de validade
  da certificação vigente.

  5.2.5.3 Durante o período mínimo de 180 dias de efetiva prestação de serviço de inspeção,
  o APAC deverá ser observado e orientado pelo Supervisor de Treinamento de forma periódica.'
