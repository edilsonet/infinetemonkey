title: DISPOSIÇÕES TRANSITÓRIAS
text: '7. DISPOSIÇÕES TRANSITÓRIAS

  7.1 Nos Treinamentos em Serviço para Formação ou Atualização em Inspeção de Segurança da
  Aviação Civil que estejam em andamento na data da publicação desta IS serão aceitos os meios
  e procedimentos previstos na IS nº 107-001 ou na IS nº 108-001 até a conclusão dos referidos
  treinamentos.

  7.2 Os Treinamento em Serviço para Formação ou Atualização em Inspeção de Segurança da Aviação
  Civil iniciados a partir da publicação desta IS deverão adotar os meios e procedimentos
  exclusivamente previstos nessa IS.

  7.3 O acompanhamento das aulas dos Instrutores AVSEC mencionado no item 5.3.10.4 desta IS
  deve seguir o prazo previsto no item C.5.7 da IS nº 110-001.'
