  Orientação, observação e esclarecimento de dúvidas

  Inicie as atividades do Treinamento em Serviço a partir da orientação da atuação do profissional
  com o objetivo de adequar sua atuação aos regulamentos da ANAC e ao programa de segurança
  do operador, quanto aos seguintes aspectos:

  1. A importância da aplicação dos procedimentos previstos nas normativas AVSEC para a segurança
  da aviação civil.

  2. A realidade operacional do operador, incluindo, pelo menos, os aspectos relacionados
  às áreas restritas de segurança, áreas controladas e demais localidades em que são exigidos
  procedimentos de inspeção AVSEC a serem executados pelo profissional em treinamento.

  3. Os objetivos de cada atividade a ser desempenhada, a partir da análise do contexto operacional
  do canal de inspeção de segurança, observando os parâmetros normativos para desempenho das
  atividades.


