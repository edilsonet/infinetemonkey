  TABELA-RESUMO DO DESEMPENHO DO TREINAMENTO EM SERVIÇO [Tabela 1 abaixo]

  *Legenda:

  1 e 2 - Apto: apto: o profissional em treinamento obteve, no mínimo, nota 7 (sete) para
  todos os itens avaliados.

  1 e 2 - Não-apto: o profissional em treinamento não obteve nota 7 (sete), no mínimo, para
  todos os itens avaliados.

  3 - Apto: o profissional em treinamento identificou 70% (setenta por cento) ou mais das
  ameaças constantes nos testes aleatórios.

  3 - Não-apto: o profissional em treinamento não identificou, no mínimo, 70% (setenta por
  cento) das ameaças constantes nos testes aleatórios.

  Resultado Final: SOMENTE será considerado APTO o profissional em treinamento que obtiver
  o resultado “APTO” nos três critérios de avaliação e aptidão constante na Tabela

  Resumo do Desempenho do Treinamento em Serviço.

  Informo que as informações prestadas nesse formulário são verdadeiras e estou ciente de
  que minha conduta influencia diretamente a segurança da aviação civil contra atos de interferência
  ilícita. Declaro ainda estar ciente das medidas cabíveis caso se comprove a ocorrência de
  irregularidades, tendo em vista a importância dessa atividade para a garantia de realização
  de procedimentos de segurança de acordo com as normativas vigentes.

