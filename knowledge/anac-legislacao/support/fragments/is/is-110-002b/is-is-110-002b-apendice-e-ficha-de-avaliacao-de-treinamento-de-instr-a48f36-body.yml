text: 'APÊNDICE E - FICHA DE AVALIAÇÃO DE TREINAMENTO DE INSTRUTOR AVSEC


  Centro de Instrução:

  Nome do Supervisor de Treinamento:

  Nome do profissional em treinamento:

  Treinamento inicial ( ) Treinamento após período de afastamento ( )

  Curso:

  ID da turma:

  Data:

  Local:

  Na observação da aula, o avaliador deverá levantar aspectos relacionados à atuação do instrutor,
  ao material didático utilizado, à qualidade da aula, ao respeito à programação proposta,
  ao alcance dos objetivos do curso, ao uso dos recursos auxiliares, à relação instrutor-aluno
  e demais tópicos relacionados à prática docente e ao bom desenvolvimento das aulas.

  Nº

  Itens de Verificação

  Resposta

  Sim

  Não

  N/A*

  1

  O instrutor manteve uma continuidade na apresentação do conteúdo, de forma a garantir o
  pleno desenvolvimento dos conceitos AVSEC?

  2

  A aula foi ministrada de acordo com a proposta de plano de aula e a programação do curso
  inicialmente apresentada?

  3

  O instrutor demonstrou conhecimento dos regulamentos e forneceu bons exemplos para ilustrar
  o assunto aos alunos?

  4

  O instrutor gerenciou o tempo da aula de maneira eficaz?

  5

  O instrutor se dispôs a esclarecer as dúvidas dos alunos?

  6

  O instrutor fez bom uso dos recursos, tais como vídeos, simulacros, equipamentos de inspeção,
  dentre outros?

  7

  O instrutor soube conduzir os alunos durante a atividade prática?

  Anotações gerais:

  Resultado:

  ( ) Apto** ( ) Necessidade de treinamento complementar ( ) Não Apto

  * Não aplicável.

  ** O resultado Apto permite ao Instrutor AVSEC exercer suas atividades sem supervisão.


  _________________________________________________

  Assinatura do profissional em treinamento


  _________________________________________________

  Assinatura do Supervisor de treinamento'
