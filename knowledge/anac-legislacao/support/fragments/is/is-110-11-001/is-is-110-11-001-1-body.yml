title: OBJETIVO
text: '1. OBJETIVO

  1.1. Esta Instrução Suplementar - IS visa estabelecer os critérios mínimos de condição física
  e

  mental para desempenho de atividades AVSEC.

  1.2. Esta IS descreve procedimentos aceitos pela ANAC que garantem o cumprimento do

  parágrafo 110.11(a)(2) do Regulamento Brasileiro da Aviação Civil nº 110.

  1.3. Os procedimentos descritos nesta IS devem ser utilizados como referência pelos centros
  de

  instrução e pelas organizações com responsabilidade AVSEC, ficando sujeitas à análise e

  aprovação da ANAC as propostas que divirjam dos procedimentos aqui apresentados.

  1.4. Os meios ou procedimentos alternativos mencionados no parágrafo 1.3 devem garantir
  nível

  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o

  objetivo do procedimento normalizado nesta IS.'
