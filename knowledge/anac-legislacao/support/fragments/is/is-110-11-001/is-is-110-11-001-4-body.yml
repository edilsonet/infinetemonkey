title: APLICABILIDADE
text: '4. APLICABILIDADE

  4.1. Esta IS é aplicável ao processo de seleção e aos exames de saúde periódicos de profissionais

  certificados pelo RBAC nº 110 e que atuarão nas atividades AVSEC previstas para as

  referidas certificações.

  4.2. Os parágrafos 6.1 e 6.4 previstos nesta IS são aplicáveis a todos os profissionais
  AVSEC.

  4.3. Os parágrafos 6.2 e 6.3 previstos nesta IS são aplicáveis aos profissionais certificados
  nos

  cursos Básico AVSEC, AVSEC para Vigilantes e Inspeção de Segurança da Aviação Civil.

  4.4. O parágrafo 6.2 previsto nesta IS é aplicável ao Instrutor de Inspeção de Segurança
  da

  Aviação Civil - ISCR.'
