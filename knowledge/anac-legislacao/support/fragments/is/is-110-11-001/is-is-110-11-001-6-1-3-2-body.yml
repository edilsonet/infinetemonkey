title: A ANAC poderá oferecer modelo de guia de encaminhamento aos centros de instrução e
  as
text: '6.1.3.2 A ANAC poderá oferecer modelo de guia de encaminhamento aos centros de instrução
  e as

  organizações com responsabilidade AVSEC.

  6.1.4. Os atestados deverão ser arquivados pela organização contratante, em meio físico
  ou digital,

  enquanto o profissional mantiver relação de trabalho e, por no mínimo, cinco anos após o
  seu

  desligamento.

  6.1.5. Os critérios psicofísicos especificados nesta IS não descrevem a totalidade das situações.Data
  de emissão: 13 de agosto de 2021.

  IS nº 110.11-001

  Revisão A

  Portanto, devem ser aplicados dentro do contexto da experiência dos médicos e dos

  conhecimentos atuais da medicina preventiva e ocupacional, no que couber.

  6.1.6. Nos exames de saúde periódicos deve ser levada em conta a função que o profissional
  exerce

  ou exercerá de acordo com o Apêndice A do RBAC nº 110, bem como os recursos

  terapêuticos e o prognóstico da enfermidade porventura existente.

  6.2. Critérios Oftalmológicos

  6.2.1. Acuidade visual: a visão deve ser igual ou melhor do que 20/60 nos dois olhos sem
  lentes

  corretoras ou igual ou melhor do que 20/20 num olho e 20/30 no outro com lentes corretoras.

  6.2.2. Percepção de cores: deve possuir um nível de percepção e diferenciação que garanta
  uma

  eficaz interpretação, distinção e avaliação das imagens apresentadas nos monitores dos

  equipamentos e sistemas.

  6.2.3. Devem também ser efetuados exames para verificação de doenças progressivas oculares
  que

  possam impedir a função do profissional. Sua confirmação é fundamento para exclusão da

  seleção.

  6.3. Critérios Auditivos e Otorrinolaringológicos

  6.3.1. Audição: a perda de audição em cada ouvido deve ser inferior a 30dB, atestada por

  audiograma com frequências inferiores a 2000 Hz.

  6.3.2. Capacidade de expressão: deve ter capacidade plena de se expressar oralmente, de
  forma clara

  e precisa.

  6.3.3. Olfato: deve ter capacidade para detectar odores.

  6.4. Critérios Mentais e Comportamentais

  6.4.1. Ausência de transtorno psiquiátrico e/ou de humor, salvo parecer de médico especialista

  atestando que o profissional está em regular tratamento e sem prejuízos das funções laborais

  em prol da segurança da aviação civil, nos últimos 4 (quatro) meses.'
