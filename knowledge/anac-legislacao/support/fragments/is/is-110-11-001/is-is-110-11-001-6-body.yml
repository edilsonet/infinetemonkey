title: CRITÉRIOS PSICOFÍSICOS
text: '6. CRITÉRIOS PSICOFÍSICOS

  6.1. Disposições Gerais

  6.1.1. A condição psicofísica dos profissionais deve ser avaliada na seleção e, posteriormente,
  no

  mínimo a cada 24 (vinte e quatro) meses, conforme previsto no parágrafo 110.11(a)(2)(i)
  do

  6.1.2. As avaliações devem ser realizadas e comprovadas por meio de exames e atestados médicos.

  6.1.3. Os centros de instrução e as organizações com responsabilidade AVSEC deverão utilizar
  uma

  guia para o encaminhamento dos profissionais aos exames de saúde.'
