title: Acrônimos
text: 'Acrônimos

  Para os efeitos desta IS, são válidos os seguintes acrônimos:

  ANAC: Agência Nacional de Aviação Civil

  IS: Instrução Suplementar (publicação da ANAC)

  NREM: sono de movimento não-rápido dos olhos (sono não REM)

  OACI: Organização de Aviação Civil Internacional

  PVT: Teste de Vigilância Psicomotora (Psychomotor Vigilance Task)

  RBAC: Regulamento Brasileiro de Aviação Civil (publicação da ANAC)

  REM: sono de movimento rápido dos olhos (Rapid Eye Movement)'
