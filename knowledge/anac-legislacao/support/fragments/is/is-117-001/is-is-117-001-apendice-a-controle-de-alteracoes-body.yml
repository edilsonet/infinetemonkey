title: Apêndice A. Controle de Alterações
text: 'Apêndice A. Controle de Alterações

  Alterações Realizadas na Revisão C

  Item Alterado

  Alteração Realizada

  Itens 7.5, 7.6 e seus respectivos subitens.

  Todos foram renumerados.

  Subitens dos itens 9.1.1 até 9.1.4.

  Todos foram renumerados.

  Subitens do item 17.2

  Principais subitens foram renumerados

  Item 17.2.2.a

  Trocar a expressão “transporte aéreo público” por “serviço de transporte aéreo”.

  Removidas as expressões “por certificação” e “incluindo operações”.

  Item 17.2.2.d.ii

  Removida a expressão “por certificação”.

  Item 17.2.3.a

  Trocar a expressão “transporte aéreo público” por “serviço de transporte aéreo”.

  Removida a expressão “por certificação”.

  Item 17.2.4.b

  Incluída a expressão “mesmo sendo feitas pelas mesmas aeronaves”.

  Removida a expressão “, bem como operações feitas com aviões a pistão ou com helicópteros.”.

  Item 17.2.4.d

  Removida a expressão “a jato”.

  Item 17.2.4.d.ii

  Removido o item.

  Item 17.2.4.d.iii

  Removida a expressão “a jato”.

  Incluída a expressão “e helicópteros”.

  Incluída a palavra “sempre”.

  Incluída a frase “O inverso também é verdadeiro: se o operador escolher o Apêndice A para
  suas operações aeromédicas, estas devem sempre ser feitas por aquele Apêndice.”.

  Trocado o tempo verbal do verbo ser de “será” para “é”.

  Item 17.2.5.c

  Removida a expressão “um C208”.

  Item 17.2.6.a.iv

  Removida a palavra “exclusivamente”.

  Item 17.2.7.a

  Removida a palavra “exclusivamente”.

  Item.17.2.7.b - Caput

  Removida a expressão “certificadas para ser operada” e introduzida a expressão “operadas”.

  Item 17.2.7.b.i

  Removidas as expressões “é mais conveniente que” e “sejam” e introduzidas as expressões
  “e operadas por apenas um piloto” e “devem ser”.

  Item 17.2.7.b.ii

  Removidas as expressões “um grande acervo de”, “incluindo”, “e Falcon 7x”, “é mais conveniente
  que que as” e “sejam” e introduzidas as expressões “e operadas por apenas um piloto” e “devem
  ser”.

  Item 17.2.7.b.iii

  Removido.

  Item 17.2.7.b.iv

  Removido

  tem 17.2.7.c - Caput

  Incluída a expressão “, operadas por dois ou mais pilotos”.

  tem 17.2.7.c

  Incluídos os subitens “i” e “ii”. Demais subitens renumerados.

  Item 17.2.7.c.v

  Removida a expressão “as quais” e introduzida a expressão “que, conforme suas possibilidades
  operacionais”.


  [1] Sobre o uso de álcool e outras substâncias, vide RBAC nº 120 e IS nº 120-002 da ANAC.


  [2] National Transportation Safety Board Safety Study 94/01.


  [3] Some a quantidade de horas que dormiu nas últimas 48 horas (últimas duas oportunidades
  de sono). O tempo acordado a partir do qual o risco passa a existir é a soma deste resultado
  a partir do horário em que acordou. Exemplo: Uma pessoa dormiu 7 horas do dia 1 para o dia
  2 e 8 horas do dia 2 para o dia 3 (7+8=15 horas). No dia 3 acordou às 07:00 (7+15=22). A
  partir das 22:00 do dia 3, ela deve prestar mais atenção ao seu nível de alerta e ao gerenciamento
  de fadiga.


  [4] Por exemplo: o Questionário de Matutinidade e Vespertinidade (Morningness-Eveningness
  Questionnaire, MEQ), o Composite Scale of Morningness (CSM) e o Questionário de Cronotipo
  de Munique (Munich Chronotype Questionnaire, MCTQ)


  [5] https://issuu.com/cesvcenipa/docs/revista_20cnfh_versao_final_06nov'
