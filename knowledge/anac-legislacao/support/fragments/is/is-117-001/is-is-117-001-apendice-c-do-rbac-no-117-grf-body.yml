title: Apêndice C do RBAC nº 117 - GRF
text: 'Apêndice C do RBAC nº 117 - GRF

  O Apêndice C está disponível para operadores de serviço de transporte aéreo (RBAC nº 121
  ou RBAC nº 135) que realizem operações comerciais não complexas com aeronaves que requeiram
  dois pilotos.

  O Apêndice C é mais adequado que o Apêndice B para a operações domésticas ou internacionais
  com dois pilotos, mas que não cruzem três fusos ou mais.

  O Apêndice C não se aplica às operações com tripulação aumentada ou operações que cruzem
  3 fusos ou mais na mesma jornada ou operações cujos tripulantes estejam não-aclimatados
  ou em estado desconhecido de aclimatação.

  É importante observar o seguinte:

  I - Operações de treinamento e de exame em voo, de translado ou com aeronaves que requeiram,
  por certificação, apenas um piloto, devem ser feitas segundo o Apêndice A.

  II - Operações com helicópteros que requerem dois ou mais pilotos podem ser feitas segundo
  o Apêndices C, mas isto não é aconselhável. Recomenda-se realizá-las de acordo com as regras
  do Apêndice A.

  III - As operações no item 17.2.3.a acima, caso assim deseje o operador, podem ser realizadas
  inteiramente segundo o Apêndice A. No entanto, caso o operador opte por realizá-las segundo
  o Apêndice C, tais operações devem ser inteiramente realizadas segundo este Apêndice.

  IV - Não será permitido que as operações comerciais de um mesmo operador possam, simultaneamente,
  ser feitas por dois apêndices diferentes.

  V - Caso o operador realize operações complexas e não-complexas simultaneamente, ele pode
  optar por cumprir o Apêndice B.'
