title: Apêndice D do RBAC nº 117 - GRF
text: 'Apêndice D do RBAC nº 117 - GRF

  O Apêndice D está disponível para operações aeromédicas, bem como treinamentos e exames
  relacionados a este tipo de operação.

  Note que outros tipos de operações do operador (tais como operações de transporte de passageiros
  ou de carga, mesmo sendo feitas pelas mesmas aeronaves) devem ser realizadas segundo as
  regras dos Apêndices A, B ou C do RBAC nº 117.

  Empresas que realizem simultaneamente operações aeromédicas e não aeromédicas (passageiros
  e/ou carga), devem cumprir o Apêndice A para estas duas últimas.

  Exemplo: um táxi aéreo realiza operações de transporte de passageiro, de carga, aeromédicas
  com aviões e helicópteros.

  I - As operações de transporte de passageiro e de carga devem ser feitas de acordo com as
  regras do Apêndice A.

  II - As operações aeromédicas com aviões e helicópteros podem ser feitas de acordo com as
  regras dos Apêndices A ou D, a escolha do operador. No entanto, uma vez que o operador escolha
  o Apêndice D para suas operações aeromédicas, estas devem sempre ser feitas por aquele Apêndice.
  O inverso também é verdadeiro: se o operador escolher o Apêndice A para suas operações aeromédicas,
  estas devem sempre ser feitas por aquele Apêndice. Não é permitido que as operações aeromédicas
  de um mesmo operador possam, simultaneamente, ser feitas por dois apêndices diferentes.'
