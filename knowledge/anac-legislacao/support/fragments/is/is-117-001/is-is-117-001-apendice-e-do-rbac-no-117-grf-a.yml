cite: apendice-e-do-rbac-no-117-grf(a)
title: apendice-e-do-rbac-no-117-grf(a)
text: 'a) Operações privadas

  I - uma pessoa física possui um R22 e o opera ela mesma para deslocar-se entre suas propriedades
  (isto é, ela não recorre a pilotos contratados para operar o R22). Este tipo de operação
  não é coberto pelo RBAC nº 117;

  II - um operador privado possui um R22, o qual é utilizado apenas em pequenos voos ao redor
  da sua base principal e não extrapola as limitações contidas na Lei nº 13.475/17. A aeronave
  é operada por um piloto contratado pelo operador. Nesta situação, suas operações devem ser
  realizadas de acordo com o Apêndice A do RBAC nº 117;

  III - um operador privado possui um Sêneca, que é utilizado em voos dentro do Brasil e não
  extrapola as limitações contidas na Lei nº 13.475/17. A aeronave é operada por um piloto
  contratado pelo operador. Nesta situação, suas operações devem ser realizadas de acordo
  com o Apêndice A do RBAC nº 117;

  IV - um operador privado possui um C550. que é utilizado em operações dentro do Brasil,
  podendo ainda realizar voos para a Argentina, Paraguai ou Uruguai, respeitando as limitações
  contidas na Lei nº 13.475/17. A aeronave é operada por dois pilotos contratados pelo operador,
  apesar de ser certificada para operação com apenas um piloto. Nesta situação, suas operações
  devem ser realizadas de acordo com o Apêndice A do RBAC nº 117;

  V - um operador privado possui um S76, que é utilizado para operações dentro do Estado de
  São Paulo, respeitando as limitações contidas na Lei nº 13.475/17. O helicóptero é operador
  por dois pilotos contratados pelo operador. Nesta situação, suas operações devem ser realizadas
  de acordo com o Apêndice A do RBAC nº 117;

  VI - um operador privado possui um Falcon 900, que é utilizado tanto em viagens nacionais
  quanto internacionais, entre o Brasil e a costa Leste dos Estados Unidos (isto é, sem cruzar
  três fusos ou mais), respeitando as limitações contidas na Lei nº 13.475/17. A aeronave
  é operada por pilotos contratados pelo operador. Nesta situação, é mais conveniente que
  as suas operações sejam integralmente realizadas de acordo com o Apêndice A do RBAC nº 117;

  VII - um operador privado possui um Falcon 2000, que é utilizado tanto em viagens nacionais
  quanto internacionais, entre o Brasil e a costa Leste dos Estados Unidos (isto é, sem cruzar
  três fusos ou mais). Nesta situação o operador pode tanto operar segundo o Apêndice A do
  RBAC nº 117 (caso não tenha necessidade de extrapolar as limitações contidas na Lei nº 13.475/17)
  ou pelo Apêndice E do RBAC nº 117 (caso tenha a necessidade de extrapolar alguma das limitações
  contidas na Lei 13.475/17). No entanto, o operador deve ter em mente que suas operações
  ocorrerão exclusivamente sob o Apêndice A ou sob o Apêndice E. Não será permitido que as
  operações com o Falcon 2000 possam, simultaneamente, ser feitas pelos dois Apêndices;

  VIII - um operador privado possui um C750, que é utilizado tanto em viagens nacionais quanto
  internacionais entre o Brasil e a Europa (isto é, cruzando três fusos ou mais), respeitando
  as limitações contidas na Lei nº 13.475/17. A aeronave é operada por pilotos contratados
  pelo operador. Nesta situação, é mais conveniente que as suas operações sejam integralmente
  realizadas de acordo com o Apêndice A do RBAC nº 117;

  IX - um operador privado possui um G650, que é utilizado tanto em viagens nacionais quanto
  internacionais entre o Brasil e a Europa (isto é, cruzando três fusos ou mais). A aeronave
  é operada por pilotos contratados pelo operador. Nesta situação o operador pode tanto operar
  segundo o Apêndice A do RBAC nº 117 (caso não tenha necessidade de extrapolar as limitações
  contidas na Lei nº 13.475/17) ou pelo Apêndice E do RBAC nº 117 (caso tenha a necessidade
  de extrapolar alguma das limitações contidas na Lei 13.475/17). No entanto, o operador deve
  ter em mente que suas operações ocorrerão exclusivamente sob o Apêndice A ou sob o Apêndice
  E. Não será permitido que as operações com o G650 possam, simultaneamente, ser feitas pelos
  dois Apêndices.'
