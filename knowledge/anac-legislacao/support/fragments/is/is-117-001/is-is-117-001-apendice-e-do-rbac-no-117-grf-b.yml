title: apendice-e-do-rbac-no-117-grf(b)
text: 'b) Operações de táxi aéreo com aeronaves operadas por apenas um

  I - um operador de táxi aéreo possui cinco aeronaves C208, as quais são utilizadas em voos
  cargueiros dentro do Brasil e operadas por apenas um piloto, sem extrapolar as limitações
  contidas na Lei nº 13.475/17. Nesta situação, suas operações devem ser integralmente realizadas
  de acordo com o Apêndice A do RBAC nº 117.

  II - um operador de táxi aéreo possui aeronaves King Air e Phenom 300, as quais são utilizadas
  para voo pelo Brasil e pela América Latina e operadas por apenas um piloto. No entanto,
  todas as operações respeitam as limitações contidas na Lei nº 13.475/17. Nesta situação,
  suas operações devem ser integralmente realizadas de acordo com o Apêndice A do RBAC nº
  117;'
