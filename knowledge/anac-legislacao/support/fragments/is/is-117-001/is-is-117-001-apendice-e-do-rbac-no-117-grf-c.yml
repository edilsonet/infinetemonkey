title: apendice-e-do-rbac-no-117-grf(c)
text: 'c) Operações segundo os RBAC nº 121 ou 135, operadas por dois ou mais pilotos

  I - um operador de táxi aéreo possui aeronaves King Air, Phenom 300 e Falcon 7x, as quais
  são utilizadas para voo pelo Brasil e pela América Latina, sempre sendo operadas por dois
  pilotos. As suas operações, no entanto, extrapolam as limitações contidas na Lei nº 13.475/17.
  Nesta situação, é mais conveniente que as suas operações sejam integralmente realizadas
  de acordo com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil
  e na América Latina, não sendo consideradas operações complexas;

  II - um operador de táxi aéreo possui um grande acervo de aeronaves, incluindo King Air,
  Phenom 300 e Falcon 7x, as quais são utilizadas para voo pelo Brasil, pela América Latina
  e Europa, sempre operadas por dois ou mais pilotos. As suas operações, no entanto, extrapolam
  as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente que as suas
  operações sejam integralmente realizadas de acordo com o Apêndice B do RBAC nº 117, uma
  vez que as operações para a Europa são consideradas complexas;

  III - um operador regular nacional ou internacional possui aeronaves ATR-42, B737 e A320,
  as quais são utilizadas para voo pelo Brasil, pela América Latina ou costa leste dos EUA,
  respeitando todas as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente
  que as suas operações sejam integralmente realizadas de acordo com o Apêndice A do RBAC
  nº 117;

  IV - um operador regular possui aeronaves ATR-42, B737 e A320, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA (todas com tripulações simples).
  As suas operações, no entanto, extrapolam as limitações contidas na Lei nº 13.475/17. Nesta
  situação, é mais conveniente que as suas operações sejam integralmente realizadas de acordo
  com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil e na América
  Latina, não sendo consideradas operações complexas;

  V - um operador regular possui aeronaves ATR-42, B737, A320 e B777 que, conforme suas possibilidades
  operacionais, são utilizadas para voo pelo Brasil, pela América Latina, costa leste dos
  EUA e Europa. As suas operações, no entanto, extrapolam as limitações contidas na Lei nº
  13.475/17. Nesta situação, é mais conveniente que as suas operações sejam integralmente
  realizadas de acordo com o Apêndice B do RBAC nº 117, uma vez que as operações para a Europa
  são consideradas complexas;

  VI - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA, respeitando todas as limitações
  contidas na Lei nº 13.475/17. Nesta situação, é mais conveniente que as suas operações sejam
  integralmente realizadas de acordo com o Apêndice A do RBAC nº 117;

  VII - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas para
  voo pelo Brasil, pela América Latina ou costa leste dos EUA (todas com tripulações simples).
  As suas operações, no entanto, extrapolam algumas das limitações contidas na Lei nº 13.475/17.
  Nesta situação, é mais conveniente que as suas operações sejam integralmente realizadas
  de acordo com o Apêndice C do RBAC nº 117, uma vez que ocorrem exclusivamente no Brasil
  e na América Latina, não sendo consideradas operações complexas;

  VIII - um operador não-regular possui aeronaves B-767 de carga, as quais são utilizadas
  para voo pelo Brasil, pela América Latina, costa leste dos EUA e Europa. As suas operações,
  no entanto, extrapolam as limitações contidas na Lei nº 13.475/17. Nesta situação, é mais
  conveniente que as suas operações sejam integralmente realizadas de acordo com o Apêndice
  B do RBAC nº 117, uma vez que as operações para a Europa são consideradas complexas.'
