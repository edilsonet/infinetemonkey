text: 'APÊNDICE B. CONTEÚDO DO MANUAL DO OPERADOR DO NB.

  B.1. Geral

  B.1.1. Este Apêndice apresenta o conteúdo mínimo que deve ser inserido no MGO de uma empresa
  que opere sob o NB do RBAC nº 117. Aplica-se apenas aos operadores dos RBAC nº 121 ou 135
  (vide item 6.2.2 desta IS).

  B.1.2. Conforme informado no item 9.2.3 desta IS, os operadores devem incluir tais procedimentos
  no capítulo 7 (para operadores do RBAC nº 121) ou seção 5 (para operadores do RBAC nº 135),
  conforme aplicável.

  B.2. Conteúdo mínimo a ser inserido no MGO

  B.2.1. Os seguintes tópicos devem estar contidos no MGO (vide o item 6.2 desta IS para maiores
  detalhes sobre os tópicos abaixo):

  a. Tipo de operação segundo o RBAC nº 117.

  i. Incluir, em destaque, no seu MGO as informações abaixo:

  A. indicação de que o operador conduz suas operações sob um NB;

  B. indicação de que o operador não está autorizado a conduzir operações sob um GRF ou um
  SGRF.

  ii. As indicações acima devem ser incluídas na primeira página do capítulo 7 ou seção 5,
  conforme aplicável.

  b. Políticas do operador sobre gestão da fadiga.

  i. Política de não-utilização dos tripulantes que não estejam aptos ao trabalho (vide item
  6.3 desta IS).

  ii. Outras políticas relativas à gestão de fadiga do operador (por exemplo, em interação
  com outros regulamentos ou práticas da empresa, cultura de segurança operacional etc.).

  c. Limites operacionais.

  i. Indicação de que todas as operações devem ser realizadas segundo o Apêndice A do RBAC
  nº 117.

  ii. Os limites máximos e mínimos advindos do cumprimento do Apêndice A para cada tripulante
  (vide item 6.5 desta IS).

  d. Responsabilidade dos funcionários do operador.

  i. Cada operador deve incluir no seu manual as responsabilidades dos tripulantes para o
  gerenciamento da sua fadiga (vide a seção 6.10 desta IS).

  e. Registros.

  i. Procedimentos utilização e conservação de registros, incluindo reportes de ocorrência
  de fadiga (vide item 6.7 desta IS).

  f. Procedimentos operacionais.

  i. Procedimentos para retirar do voo tripulantes que se declarem inaptos para o voo por
  motivo de fadiga. Vide o item 6.3 desta IS.

  ii. Procedimentos para selecionar as acomodações para repouso dos tripulantes (quando fora
  da base contratual). Vide o item 6.4 desta IS.

  iii. Procedimentos para a disponibilização de refeições para os tripulantes. Vide o item
  6.6 desta IS para maiores detalhes.

  iv. Procedimentos para determinação da base contratual do tripulante. Vide o item 6.8 desta
  IS.

  v. Procedimentos para a publicação de escalas. Vide o item 6.9 desta IS.'
