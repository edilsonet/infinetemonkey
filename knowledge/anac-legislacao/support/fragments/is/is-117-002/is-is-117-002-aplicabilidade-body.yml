title: Aplicabilidade
text: 'Aplicabilidade

  Este item é aplicável a todos os operadores especificados no parágrafo 117.1(b) do RBAC
  117, incluindo aqueles que possuem um GRF aceito pela Anac, quando não houver requisitos
  específicos nos Apêndices B até E (vide tabelas de Alterações de requisitos em função da
  adoção do Apêndice) ou SGRF aprovado pela Anac, quando não houver alteração nos requisitos
  em função do SGRF.

  Requisitos trabalhistas da Lei 13.475/17

  a. A Lei nº 13.475, de 28 de agosto de 2017, ao mesmo tempo que em que traz matéria relacionada
  a segurança operacional - afetas às atribuições desta Agência -, também dispõe sobre matéria
  que não se dirige a esse fim - notadamente, os relacionados aos aspectos trabalhistas da
  relação que existe entre os aeronautas e seus empregadores.

  b. O cumprimento dos requisitos estabelecidos no RBAC nº 117 não afasta a necessidade do
  cumprimento dos demais dispositivos legais (isto é, aqueles que não são afetos à Anac).

  c. Para dirimir dúvidas sobre os dispositivos da Lei não afetos à Anac, os operadores devem
  entrar em contato com as autoridades competentes ou os sindicatos / associações de classe.

  Parâmetros estabelecidos na regulamentação da Anac

  Diversos artigos e parágrafos da Lei nº 13.475, de 28 de agosto de 2017, informam que limites
  neles previstos podem ser alterados mediante convenção ou acordo coletivo de trabalho, desde
  que não ultrapassem os “parâmetros estabelecidos na regulamentação da autoridade de aviação
  civil brasileira”. A Tabela 3 a seguir lista esses dispositivos e informa quais são os referidos
  parâmetros (isto é, os limites estabelecidos pela Anac).

  Dispositivo da Lei Parágrafo correspondente do Apêndice A do RBAC 117 Art. 24 Vide o item
  10.1.3.3 desta IS Art. 26, § 3º A117.9(a)(3) Art. 27, § Único A117.9(b)(3) Art. 28, § Único
  Vide o item 10.1.3.3 desta IS Art. 32, § 2º A117.13(b)(2) Art. 33, § 2º A117.13(c)(2) Art.
  37, § Único A117.15(b)(1) Art. 41, § 1º A117.15(i) Art. 41, § 5º A117.15(a)(1) Art. 41,
  § 6º A117.15(l) Art. 42, § 3º A117.15(m)(3) Art. 43, § 7º A117.17(f) Art. 44, § 7º A117.19(d)
  Art. 48, § Único A117.23(c) Art. 50, § 4º A117.25(d) Art. 52, § Único A117.25(f)(1)

  Tabela 3: Dispositivos da Lei 13.475/17 que requerem parâmetros estabelecidos pela Anac

  O seguinte procedimento geral foi inserido para todos os dispositivos, exceto os especificados
  no item 10.1.3.3 desta IS:

  a. Texto incluído em cada um dos requisitos do RBAC nº 117 citados na Tabela 3: “.... desde
  que estejam contidos no manual do operador e sejam previamente aprovados pela Anac. O operador
  deve demonstrar à Anac que tais limites são seguros para a operação proposta”; e

  b. Foram retiradas às menções ao CCT ou ACT, por não serem responsabilidade de fiscalização
  da Anac. No entanto, como informa a Nota da Seção 117.1, isto não afasta a necessidade do
  cumprimento dos dispositivos legais da Lei nº 13.475/17, dentre os quais, a necessidade
  de CCT ou ACT, caso a Lei nº 13.475/17 assim o exija.

  c. Exemplos: Dispositivo da Lei 13.475/17 Como ficou no Apêndice A do RBAC 117 Art. 26 §3º
  Os limites previstos no inciso I do caput deste artigo poderão ser alterados mediante convenção
  ou acordo coletivo de trabalho, desde que não ultrapassem os parâmetros estabelecidos na
  regulamentação da autoridade de aviação civil brasileira. Parágrafo A117.9(a)(3) Os limites
  previstos no parágrafo (a)(1) desta seção podem ser alterados, desde que estejam contidos
  no manual do operador e sejam previamente aprovados pela Anac. O operador deve demonstrar
  à Anac que tais limites são seguros para a operação proposta. Art. 32 §2 Os tripulantes
  empregados nos serviços aéreos definidos no inciso IV do caput do art. 5º, quando em atividade
  de fomento ou proteção à agricultura, poderão ter os limites previstos neste artigo estabelecidos
  em convenção ou acordo coletivo de trabalho, desde que não ultrapassem os parâmetros de
  segurança de voo determinados na regulamentação da autoridade de aviação civil brasileira.
  Parágrafo A119.13(b)(2) Os tripulantes empregados nos serviços aéreos definidos no parágrafo
  117.1(b)(4) podem ter os limites de horas de voo em uma mesma jornada alterados, desde que
  estejam contidos no manual do operador e sejam previamente aprovados pela Anac. O operador
  deve demonstrar à Anac que tais limites são seguros para a operação proposta.

  Tabela 4: Dispositivos "parâmetros estabelecidos pela Anac" (exemplos)

  Em dois casos não foram estabelecidos parâmetros pela Anac pelos motivos apresentados na
  Tabela 5. Dispositivo da Lei 13.475/17 Justificativa Art. 24. Resguardados os direitos e
  as condições previstos nesta Lei, os demais direitos, condições de trabalho e obrigações
  do empregado estarão definidos no contrato de trabalho e poderão ser devidamente regulados
  em convenção ou acordo coletivo de trabalho, desde que não ultrapassem os parâmetros estabelecidos
  na regulamentação da autoridade de aviação civil brasileira. Este artigo é muito genérico
  e aberto, podendo abarcar qualquer tipo de direitos, condições de trabalho e obrigações,
  inclusive as trabalhistas. Portanto, ele não foi incluído no RBAC nº 117. Art. 28 Parágrafo
  único. A programação de rodízios e turnos obedecerá ao princípio da equidade na distribuição
  entre as diversas situações de trabalho para que não haja discriminação entre os tripulantes
  com qualificações idênticas, salvo em empresas que adotem critérios específicos estabelecidos
  em acordo coletivo de trabalho, desde que não ultrapassem os parâmetros estabelecidos na
  regulamentação da autoridade de aviação civil brasileira. Este parágrafo é muito genérico
  e aberto, podendo abarcar qualquer tipo de rodízio de tripulante, sem que a Anac tenha algum
  tipo de regra sobre isto. Adicionalmente, ele está ligado a um artigo não aplicável à legislação
  da Anac. Portanto, ele não foi incluído no RBAC nº 117.

  Tabela 5: Artigos da Lei 13.475/17 sobre "parâmetros estabelecidos pela Anac" que não foram
  inseridos no RBAC 117.

  A aplicação dos dispositivos citados na Tabela 3 deve ser feita de acordo com os procedimentos
  abaixo especificados:

  a. especificar claramente o limite a ser ultrapassado;

  b. apresentar justificativa técnica para a ultrapassagem do limite, incluindo apresentação
  de resultados de um software biomatemático;

  c. operadores dos RBAC nº 121 e 135: apresentação de revisão do MGO com os procedimentos
  operacionais necessários em função da alteração de limite solicitada;

  d. demais operadores aéreos: apresentação de procedimentos operacionais necessários em função
  da alteração de limite solicitada.

  Nota: o cumprimento dos requisitos estabelecidos nesta IS quanto ao item anterior não afasta
  a necessidade do cumprimento dos demais dispositivos legais contidos na Lei 13.475/17.

  Notificação de ampliação de jornada

  Uma ampliação de jornada deve reportada pelo Protocolo Eletrônico SEI da Anac (https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei).

  Conforme A117.15(g), qualquer ampliação dos limites das horas de trabalho prevista no parágrafo
  A117.15(f) deve ser comunicada, em no máximo 24 horas após a viagem, pelo comandante ao
  operador, que, no prazo de 15 dias, comunicará à Anac. Devem ainda ser cumpridos os requisitos
  dos parágrafos 117.19(e)(1)(iv) e 117.19(e)(3).

  O operador deve:

  a. protocolar no SEI sua comunicação por carta / ofício em processo cujos tipos estão abaixo
  indicados:

  i. Operador 91: Consultas, comunicações ou solicitações diversas;

  ii. Operador 121: Reporte Lei do Aeronauta; e

  iii. Operador 135: Reporte Lei do Aeronauta; e

  b. anexar documentos avaliados suficientes para a análise, incluindo cópia do diário de
  bordo e demais evidências dos motivos que levaram à ampliação / extensão de jornada, de
  modo a demostrar que a extensão ocorreu sob condição prevista em A117.15(f) (ou disposições
  equivalentes dos demais apêndices do RBAC nº 117, como, por exemplo, C117.17(b) e (c), para
  operadores do Apêndice C).

  Jornada e tempo de voo até aeródromo de alternativa - Apêndice A

  Não há necessidade, no planejamento da jornada, da duração da jornada e do tempo de voo
  até o aeródromo de alternativa serem considerados dentro dos limites de jornada e voo estabelecidos
  nas seções A117.13 e A117.15 do Apêndice A do RBAC nº 117.

  Apesar disso, as seguintes observações devem ser feitas sobre esse assunto:

  a. Tanto a Lei nº 13.475/17 quanto o Apêndice A do RBAC 117 não preveem extensões de tempo
  de voo, exceto como indicado no parágrafo A117.13(b)(2) daquele Apêndice. Deste modo, a
  extrapolação do tempo de voo além do previsto na seção A117.13 é uma infração tanto à Lei
  quanto ao RBAC nº 117;

  b. Tanto a Lei nº 13.475/17 quanto o parágrafo A117.15(f) do Apêndice A do RBAC nº 117 preveem
  ampliações dos limites de jornada em até 60 (sessenta) minutos, a critério exclusivo do
  piloto em comando da aeronave, nas seguintes condições:

  i. inexistência, em local de escala regular, de acomodações apropriadas para o repouso da
  tripulação e dos passageiros; ou

  ii. ocorrência de circunstâncias operacionais imprevistas, como definido no parágrafo 117.3(d)-I
  do RBAC 117.

  c. Deste modo, os aeródromos de alternava requeridos devem ser escolhidos de modo a não
  fazerem a jornada ultrapassar em mais de 60 minutos os limites prescritivos aplicáveis.

  Finalmente, a notificação de ampliação de jornada deve ser enviada como previsto no item
  10.1.4 desta IS.

  Interrupção de jornada

  Conforme previsto no parágrafo A117.15(c) - Interrupção de jornada, do Apêndice A do RBAC
  117, as orientações aqui contidas somente são válidas para os seguintes operadores:

  a. operadores de táxi aéreo certificados pelo RBAC nº 135;

  b. operadores de serviços aéreos especializados, exceto operadores aeroagrícolas; e

  c. os operadores de aviação geral operando exclusivamente segundo as regras do RBAC nº 91
  quando realizando operações sem fins lucrativos com pilotos contratados, a serviço do operador
  da aeronave.

  Quando compondo tripulação mínima ou simples, os tripulantes dos operadores citados no item
  anterior podem ter suas jornadas de trabalho acrescidas de até a metade do tempo da interrupção,
  nos seguintes casos:

  a. quando houver interrupção da jornada fora da base contratual, superior a 3 (três) horas
  e inferior a 6 (seis) horas consecutivas, e for proporcionado pelo operador local para descanso
  separado do público e com controle de temperatura e luminosidade; ou

  b. quando houver interrupção da jornada fora da base contratual, superior a 6 (seis) horas
  e inferior a 10 (dez) horas consecutivas, e forem proporcionados pelo operador quartos individuais
  com banheiro privativo, condições adequadas de higiene e segurança, mínimo ruído e controle
  de temperatura e luminosidade.

  A interrupção de jornada é limitada a somente uma ocorrência por jornada.

  A interrupção de jornada deve ser consignada no diário de bordo da aeronave, com a informação
  de quais foram os horários reais de interrupção e retomada da jornada, tipo de acomodação
  oferecida pelo operador (veja o item anterior), e assinatura do comandante.

  Para efeito de contagem de tempo de interrupção, não são considerados os tempos necessários
  para atividades pós-voo, pré-voo e deslocamento até o local de descanso ou repouso, não
  podendo o tempo total destas atividades ser menor do que 30 minutos.

  Para efeito de cálculo de repouso após a jornada interrompida, deve ser considerado o tempo
  total da jornada, incluindo a interrupção.

  Adicionalmente, deve ser verificado se:

  a. há tempo real suficiente alocado na escala para o tripulante deslocar-se de e para o
  local adequado para dormir ou descansar durante a interrupção e cumprir os limites máximos
  de jornada previstos;

  b. os tripulantes não sejam perturbados durante o período de descanso relacionado à jornada
  interrompida. Isso significa ter políticas e procedimentos específicos que abordem possíveis
  fontes de distúrbio;

  c. o tempo transcorrido durante o período de descanso ou repouso da jornada interrompida
  seja sempre considerado como um trabalho e seja incluído como parte da jornada; e

  d. todo o período mínimo de acesso a uma acomodação adequada deve ser alcançado antes do
  final do período de jornada de trabalho máxima (sem considerar o aumento devido à jornada
  interrompida) antes que seja permitido um aumento no limite da jornada de trabalho.

  Folga regulamentar: proporcionalidade no mês

  10.1.7.1. O RBAC nº 117 traz, no parágrafo A117.25(e)(2) do Apêndice A, uma regra de proporcionalidade
  para folgas mensais, a qual é aplicável somente para os operadores definidos no parágrafo
  117.1(b)(1):

  (2) Quando o tripulante concorrer parcialmente à escala de serviço do mês, por motivo de
  férias ou afastamento, aplicar-se-á a proporcionalidade do número de dias trabalhados ao
  número de folgas a serem concedidas, com aproximação para o inteiro superior.

  Para os demais operadores, embora não haja previsão equivalente de forma explícita no parágrafo
  A117.25(f) daquele mesmo Apêndice (refletindo a diferença entre os art. 51 e 52 da Lei nº
  13.475), entende-se que é razoável a aplicação do mesmo critério para todos os operadores.

  Nota: observa-se que a regra da proporcionalidade, antes de constar na lei, constava na
  Portaria Interministerial 3016/88 (atualmente revogada), com aplicabilidade para todos os
  tripulantes.

  Folga de tripulantes

  O parágrafo 117.3(g) informa que folga significa o período não inferior a 24 (vinte e quatro)
  horas consecutivas em que o tripulante, em sua base contratual, sem prejuízo da remuneração,
  está desobrigado de qualquer atividade relacionada com seu trabalho.

  Deste modo, é importante indicar que quaisquer trabalhos (mesmo em escritório, como, por
  exemplo, atualizar manuais) ou treinamentos (solo, em aeronave ou simulador de voo) são
  considerados “atividade relacionada com seu trabalho” e, portanto, não podem ser feitos
  durante o período de folga do tripulante.

  Operação fora da base contratual

  Os parágrafos A117.15(j), A117.15(k) e A117.15(k)(1) do Apêndice A do RBAC nº 117 informam
  o seguinte:

  a. A117.15(j): os tripulantes empregados pelos operadores definidos nos parágrafos 117.1(b)(2)
  até 117.1(b)(6) têm como período máximo de trabalho consecutivo 21 (vinte e um) dias, contados
  do dia de saída do tripulante de sua base contratual até o dia do regresso a ela.

  b. A117.15(k): para os tripulantes empregados pelos operadores definidos nos parágrafos
  117.1(b)(2) até 117.1(b)(6), o período consecutivo de trabalho, no local de operação, não
  pode exceder a 17 (dezessete) dias.

  c. A117.15(k)(1): quando prestarem serviço fora da base contratual por período superior
  a 6 (seis) dias, os tripulantes referidos neste parágrafo têm, no retorno, folgas correspondentes
  a, no mínimo, o número de dias fora da base contratual menos 2 (dois) dias.

  Conforme o parágrafo 117.3(g) do RBAC nº 117, folga significa o período não inferior a 24
  (vinte e quatro) horas consecutivas em que o tripulante, em sua base contratual, sem prejuízo
  da remuneração, está desobrigado de qualquer atividade relacionada com seu trabalho (grifo
  nosso).

  Adicionalmente, o parágrafo A117.25(a) do Apêndice A do RBAC nº117 informa que, salvo o
  previsto nos parágrafos A117.15(j) e A117.15(k) daquele Apêndice, a folga deve ter início,
  no máximo, após o 6º (sexto) período consecutivo de até 24 (vinte e quatro) horas, contada
  a partir da apresentação do tripulante, observados os limites da duração da jornada e do
  repouso.

  Nota: a referência aos parágrafos encontra-se incorreta na emenda nº 01 do RBAC nº 117.
  Considera-se, nesta IS, a referência correta, em alinhamento ao previsto na Lei nº 13.475/17.

  A situação prevista nos parágrafos A117.15(j), A117.15(k) e A117.15(k)(1) é normalmente
  conhecida como "regime de missão". Esta situação é uma exceção à regra do parágrafo A117.25(a).
  Logo, durante esse regime de missão, em que o aeronauta estará fora de base, não usufruirá
  de folga. Pode haver períodos prolongados de repouso, até maiores do que 24h, mas não serão
  caracterizados como folga, por não serem na base contratual.

  Registra-se, de todo modo, que o parágrafo A117.15(k)(1) prevê as folgas que o tripulante
  deve receber após o retorno à base contratual, quando prestarem serviço fora da base por
  período superior a 6 (seis) dias.

  Complementando, esclarece-se que o local de operação, citado no parágrafo A117.15(k), é
  justamente o local fora da base contratual citado no parágrafo A117.15(k)(1), pois os dois
  parágrafos se referem a uma única situação, a do regime de missão.

