title: Bibliografia
text: 'Bibliografia

  a. ANAC. (2012). IS nº 119-002D - Guia para a elaboração de SGSO de empresa aérea certificada
  de acordo com o RBAC 119.

  b. ANAC. (2022). IS nº 135-005A - Operação aeromédica realizada por operadores aéreos regidos
  pelo RBAC nº 135.

  c. ANAC. (2023). IS nº 119-004J - Obtenção, alteração, suspensão, revogação e cassação de
  certificado de empresa de transporte aéreo regida pelo RBAC nº 135.

  d. ANAC. (2023). Regulamento Brasileiro de Aviação Civil nº 135 (RBAC nº 135) - Emenda 13.
  Operações de transporte aéreo público com aviões com configuração máxima certificada de
  assentos para passageiros de até 19 assentos e capacidade máxima de carga paga de até 3.400.

  e. ANAC. (2024). IS nº 117-001A - Conceitos básicos sobre fadiga humana.

  f. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 001 (RBAC nº 001) - Emenda 16.
  Definições, regras de redação e unidades de medida para uso nos normativos da ANAC.

  g. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 117 (RBAC nº 117) - Emenda 01.
  Requisitos para gerenciamento de risco da fadiga.

  h. CASA. (2019). CAO 48.1. Civil Aviation Order 48.1 Instrument 2019.

  i. CASA. (2024). CAAP 48-01 v3.3 - Fatigue management for flight crew members.

  j. FAA. (2013). AC 117-1 - Flightcrew Member Rest Facilities.

  k. FAA. (2013). AC 120-003A - Fatigue Risk Management Systems for Aviation Safety.

  l. ICAO. (2020). Doc 9966 Second Edition, Version 2 (Revised) - Manual for the Oversight
  of Fatigue Management Approaches.'
