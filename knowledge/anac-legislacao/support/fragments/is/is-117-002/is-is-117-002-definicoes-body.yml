title: Definições
text: 'Definições

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, no RBAC nº
  117 e IS nº 117-001, além das abaixo listadas:

  a. acesso (à alimentação, à acomodação, ao transporte etc.) significa que o tripulante não
  encontra impedimento ou restrição para atendimento real e imediato das suas necessidades
  de alimentação, higiene pessoal, descanso ou repouso;

  b. atraso significa o período entre o horário original de apresentação e o horário de apresentação
  real do tripulante, contados na mesma base de fuso horário.'
