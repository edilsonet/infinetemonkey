  Fusos horários e ajustes biológicos (A117.23(d))

  A responsabilidade de gerenciar os efeitos das mudanças de fuso horário é compartilhada
  entre o operador e o tripulante. O operador deve fornecer condições de repouso e períodos
  de adaptação necessários. O tripulante deve aproveitar essas condições para obter o máximo
  de repouso possível.

  Por sua vez, o tripulante tem a obrigação de aplicar essas informações à sua situação ao
  decidir sua aptidão para o trabalho. Os tripulantes devem estar cientes de suas condições
  de adaptação de fuso horário pessoal. Estes podem diferir do que o RBAC nº 117 específica.
  Caso um tripulante sinta que não está apto para o trabalho após um período de folga ou após
  o cruzamento de fusos horários, deve relatar tal fato ao operador para que este possa avaliar
  se suas limitações e políticas de fadiga são adequadas.

  Tripulações compostas e de revezamento

  Com as instalações adequadas de descanso em voo, a tripulação pode revezar os períodos de
  descanso e compartilhar acomodações para gerenciar sua fadiga. É importante que as tripulações
  considerem que, com uma equipe aumentada (tripulação composta ou de revezamento), haverá
  variabilidade em termos de alerta e ajuste circadiano (ou seja, fuso horário / relógio biológico)
  entre os tripulantes. Além disso, todos eles terão diferentes necessidades de sono e diferentes
  efeitos quanto ao desempenho das contramedidas (por exemplo, uso de cafeína). Ao utilizar
  acomodações de descanso em voo, um tripulante deve fazê-lo de forma inteligente, em vez
  de fazer algo potencialmente estressante, o tripulante deve aproveitar o tempo para relaxar
  e tentar dormir.

  Existem vários estudos que analisam os efeitos da inércia do sono no desempenho, particularmente
  ao despertar do sono profundo. Os operadores e os tripulantes devem estar cientes e gerenciar
  o efeito da inércia do sono nas suas operações.

  Commuting

  O commuting, ou deslocamento do tripulante, refere-se ao ato de um tripulante que não reside
  ou não usufrui de repouso em local próximo à sua base de operações e, portanto, utiliza
  um meio de transporte para se deslocar de sua moradia ou local de repouso para o aeroporto
  visando iniciar sua jornada. Este deslocamento chega em alguns casos a envolver o uso de
  viagens aéreas para chegar ao local de início de uma jornada, ou ainda o deslocamento terrestre
  por vias congestionadas envolvendo situações de estresse e incerteza quanto ao tempo total
  de deslocamento.

  O membro da tripulação de voo em deslocamento (commuting) é o único responsável por determinar
  e usar o meio de transporte de sua escolha para ir e vir de seu local de trabalho. Em termos
  básicos, o deslocamento é uma função iniciada pelo tripulante.

  Ao necessitarem se deslocar para sua base de operações, os membros da tripulação podem enfrentar
  situações potencialmente geradoras de estresse que normalmente não seriam experimentadas
  se estivessem situados, no repouso, próximo à base de operações. Exemplos dessas situações
  de estresse são: garantir que se chegue à base para o serviço de maneira oportuna, planejar
  para possíveis atrasos, preparar-se para possíveis mudanças no modo de deslocamento e se
  adaptar a mudanças repentinas e fora de seu controle, como, por exemplo, mudanças bruscas
  nas condições meteorológicas locais.

  Flexibilidade e criatividade são elementos essenciais para um deslocamento bem-sucedido,
  visando-se reduzir o estresse. O lado negativo do deslocamento é o tempo dispendido, o que
  prolonga o primeiro dia de uma viagem e pode reduzir o tempo total disponível para que o
  tripulante exerça suas funções com segurança.

  Conforme gerenciamento de risco específico a ser realizado quanto ao commuting, diante de
  previsão de deslocamento mais longo por parte de ao menos um dos tripulantes, pode ser necessário
  limitar-se adicionalmente a jornada e o tempo de voo naquela jornada.

  Uma das maiores desvantagens de um deslocamento longo é a maior perda de tempo livre do
  tripulante. O tempo de deslocamento é realizado durante o tempo livre dos membros da tripulação
  de voo e parte desse tempo livre será, portanto, consumido pelo deslocamento. Na tentativa
  de compensarem essa perda de tempo livre, os membros da tripulação de voo podem vir a deslocar-se
  para o trabalho com menor antecedência do que seria necessário considerando o horário de
  sua apresentação e as condições em que será realizado esse deslocamento, aumentando os níveis
  de estresse e fadiga.

  Outro aspecto negativo de um deslocamento longo é aquele relacionado ao fato de que, seguindo
  seu planejamento para evitar atrasos, o tripulante pode vir a chegar à base de operações
  horas antes do horário de apresentação, fazendo com que neste dia o membro da tripulação
  possa exceder-se em relação ao seu tempo de vigília, aumentando a fadiga para este dia e
  agravando a fadiga acumulada.

  Nota: Em um exemplo extremo, um membro da tripulação de voo está agendado para se apresentar
  às 8 horas da manhã em sua base para iniciar uma jornada de trabalho. Para garantir a chegada
  à base antes do horário de apresentação, e estando em local de repouso distante do local
  de apresentação, o membro da tripulação opta por deslocar se durante a noite por via aérea.
  Supondo que seu sono ocorreu apenas antes de iniciar o deslocamento, o membro da tripulação
  de voo terá permanecido acordado por várias horas consecutivas ao término desta jornada.
  Neste caso, o membro da tripulação de voo estaria exposto a um déficit de sono significativo,
  em particular ao final de sua jornada, contribuindo adicionalmente para a fadiga acumulada.

  É fundamental que os membros da tripulação avaliem seus hábitos de deslocamento de modo
  a respeitar os requisitos aplicáveis e visando reduzir ao máximo o potencial para desenvolvimento
  de fadiga decorrente de deslocamentos mal planejados.

  A Tabela 2 abaixo, tratando do cálculo de um período de repouso considerando o tempo de
  deslocamento e a oportunidade de sono, deve ser utilizada como referência para definir de
  forma objetiva se determinado commuting pode ou não ser realizado.


  Tabela 2: Cálculo de um período de repouso considerando o tempo de deslocamento (commuting)
  e a oportunidade de sono.

  Preparação para uma jornada

  Atividades prévias a uma jornada. Membros da tripulação em repouso ou período livre de atividades
  em sua moradia que se envolvam em atividades domésticas antes de se apresentarem para a
  jornada de trabalho podem se expor involuntariamente a riscos de fadiga semelhantes aos
  dos pilotos que precisam de um deslocamento longo para chegarem ao local de trabalho (commuting).
  Tais atividades incluem trabalho doméstico, reparos de carro, trabalho no jardim entre outras
  atividades semelhantes.

  Tripulação em local de repouso versus tripulação em deslocamento (commuting). O tempo total
  de vigília para um membro da tripulação situado em sua base contratual que se envolva em
  atividades antes do serviço pode ser semelhante ao de alguém que deve se efetuar um deslocamento
  longo para seu serviço. A exposição potencial a riscos de fadiga para esse dia de jornada
  afetaria ambos os membros da tripulação de maneira semelhante. Essencialmente, ambos estão
  acordados pelo mesmo período antes de iniciar sua jornada. Embora isso possa não ser um
  problema para uma apresentação no meio da manhã, para um horário de apresentação noturno,
  a menos que o tripulante tenha tirado uma soneca antes de se apresentar, ambos os comportamentos
  expõem a um maior potencial para um evento de fadiga.

  Minimizar atividades pré-jornada. Uma recomendação pertinente é a de que o tripulante evite
  planejar deslocamentos ou outras atividades pré-jornada que resultem em estar acordado por
  mais de aproximadamente 16 horas antes do final programado da jornada. Adicionalmente, ao
  usufruir da oportunidade de sono de ao menos 8 horas consecutivas dentro das 12 horas que
  antecedem o início da jornada, é recomendável que o tripulante tenha efetivamente dormido
  pelo menos 6 horas antes de se apresentar para a jornada, além de que obtenha, no mínimo,
  mais de 6 horas de sono por dia, de forma a evitar fadiga cumulativa. Entretanto, a melhor
  conta depende do autoconhecimento, pois 6 horas de sono podem ser insuficientes para algumas
  pessoas. O débito de sono de “apenas” 1 hora por dia, de forma cumulativa pode representar
  uma noite inteira sem dormir ao longo de uma semana. Os pilotos também devem considerar
  a quantidade de sono e tempo de vigília (tempo acordado) em sua tomada de decisão em relação
  a quando informar ao operador que não devem voar devido a fadiga. Se houver débito de sono,
  uma regra geral seria descontar o que falta do total de 16 horas acordado (ex. dormir duas
  horas a menos diminui o tempo total da vigília em duas horas naquele dia, para 14 horas.
  Isso também vale para débitos acumulados).

  Reduzir o Risco de Fadiga. É fundamental que os tripulantes percebam que períodos prolongados
  de vigília antes de iniciar uma jornada podem contribuir para a fadiga. Portanto, os membros
  da tripulação devem adotar as mitigações de fadiga apropriadas, obtendo o descanso adequado
  antes de iniciar qualquer jornada de forma a reduzir a exposição a um evento relacionado
  à fadiga.

  Informações do tripulante que devem ser repassadas ao operador

  Os tripulantes devem considerar como seus arranjos de vida e tempo de deslocamento para
  o trabalho podem afetar seus níveis de fadiga. Quaisquer condições potencialmente problemáticas
  precisam ser informadas ao operador se elas tiverem, ou provavelmente virem a ter, um impacto
  no desempenho operacional.

  Moradia

  O tripulante deve informar ao seu empregador o local real de moradia.

  A escolha da moradia pode ter um impacto nos níveis de fadiga dependendo de:

  a. locais de moradia compartilhados ou alternados;

  b. tempos de deslocamento longos e variáveis ​​(por exemplo, devido à distância e ao congestionamento
  de tráfego);

  c. ambientes barulhentos ou interrupções de descanso em casa (por exemplo, obras ou escolas
  nas proximidades, ruído do tráfego, paredes não isoladas para sons etc.); ou

  d. ambientes ou áreas de descanso excessivamente iluminados (por exemplo, iluminação urbana
  brilhante, coberturas de luz inadequadas durante os períodos de descanso diurno).

  Nota: Os tripulantes podem achar que certas situações de vida únicas podem melhorar o estado
  de alerta e minimizar o risco de fadiga. Em alguns casos, pode ser benéfico viver longe
  de uma base contratual, em vez de mais perto. Um exemplo é onde a base contratual é continuamente
  ruidosa ou excessivamente iluminada durante períodos de sono / repouso ou durante a noite.
  Os tripulantes devem considerar seus arranjos de vida e quaisquer mudanças relação a qualquer
  impacto que possa ter sobre seu estado de alerta. Se surgirem situações potencialmente problemáticas,
  isso precisa ser informado ao operador.

  Emprego externo e outras atividades

  Os tripulantes têm a obrigação de gerenciar quaisquer atividades externas pessoais para
  garantir que não afetem seus níveis de fadiga durante as operações. Atividades externas
  incluem atividades como:

  a. obrigações domésticas;

  b. atividades de lazer;

  c. segundo emprego ou outras atividades;

  d. obrigações familiares;

  e. trabalho voluntário realizado fora do horário de trabalho;

  f. pilotagem noturna;

  g. voos privados não-recreativos;

  h. trabalho por turnos;

  i. administração de um negócio;

  j. realização de trabalhos que podem levar à desgaste físico ou mental;

  k. estudo ou cursos; e

  l. dirigir.

  Voo privado em conjunto com outros tipos de operações

  O tripulante que realiza voos privados não-recreativos (definidos em 117.1(b)(6)) e atua
  também como tripulante para um operador de transporte aéreo ou para outro operador privado,
  tem a obrigação de declarar seus voos privados. As operações de voo particulares cobrem
  uma ampla gama de atividades. Para fins de gerenciamento de fadiga, essas atividades podem
  ser divididas em:

  a. operações privadas recreativas; ou

  b. operações privadas não recreativas.

  Uma operação privada recreativa pode ser conduzida por um tripulante e não há limites atuais
  (além dos limites pessoais) que possam ser aplicáveis. No curso normal dos eventos, o tripulante
  que faz algum voo privado de recreio em um dia de folga deve estar atento às políticas dos
  operadores para a relação entre fadiga e voos recreativos.

  Há indivíduos que realizam voos particulares que não são considerados recreativos (isto
  é, trabalho remunerado, voos de translado, ensaios em voo, voos de instrução etc.). Essas
  operações são vistas como mais difíceis de cancelar ou reprogramar e geralmente envolvem
  mais planejamento e complexidade operacional do que um voo recreativo tradicional. Elas
  podem ter um efeito sobre a jornada de trabalho subsequente para o piloto que também é empregado
  por um operador. Nesta situação, deve-se verificar os limites que se aplicam; no entanto,
  uma vez que o tripulante é empregado por um operador, essas atividades devem ser declaradas,
  pois elas farão parte dos limites de tempo de voo cumulativos do tripulante.

  Cultura de segurança operacional

  A fim de manter uma cultura de segurança operacional aberta e justa, os tripulantes precisam
  divulgar quaisquer situações que os estejam afetando, ou possam afetá-los no futuro, seu
  estado de alerta e conformidade com o RBAC nº 117. A divulgação também é consistente com
  as melhores práticas dos princípios de segurança e gerenciamento de riscos. Os tripulantes
  têm a obrigação de contribuir para essa cultura de segurança saudável e manter uma forte
  cultura de elaboração de reportes, o que, por sua vez, permite que ao operador gerenciar
  o risco de forma preditiva e proativa. Os funcionários precisam ser capazes de divulgar
  informações e discutir com o operador situações que possam gerar fadiga e afetar o estado
  de alerta em um ambiente aberto, comunicativo e confidencial, sem sentir medo de penalidade.

  NECESSIDADE DE IMPLANTAR UM GRF OU UM SGRF PARA UM OPERADOR DO NB.

  Sempre que um operador do NB determinar a necessidade de alterar uma limitação operacional
  contida no RBAC nº 117, ele deve implantar (ou alterar):

  a. Um Gerenciamento de Risco da Fadiga (GRF), em conformidade com as seções 117.61 ou 117.65
  e com os Apêndices B, C, D ou E (conforme aplicável) e com as IS nº 117-003, 117-006 ou
  117-007, conforme aplicável.

  b. um Sistema de Gerenciamento de Risco da Fadiga (SGRF), em conformidade com a seção 117.63
  do RBAC nº 117 e com as IS nº 117-004 ou 117-005, conforme aplicável.

  PROCEDIMENTOS DE ADEQUAÇÃO

  Procedimentos de adequação dos operadores 91 que operem sob o NB do RBAC nº 117

  O item 9.1 desta IS aplica-se aos operadores citados nos parágrafos 117.1(b)(3), (4), (5)
  e (6) do RBAC nº 117:

  a. os operadores de serviços aéreos especializados; e

  b. os operadores de aviação geral operando exclusivamente segundo as regras do RBAC nº 91quando
  realizando operações sem fins lucrativos com pilotos contratados, a serviço do operador
  da aeronave.

  Cada operador citado no item 9.1.1 que conduza suas operações sob o Nível Básico (NB) do
  RBAC nº 117 é responsável primário pelo cumprimento das regras contidas nas Seções 117.19
  e 117.21, bem como no Apêndice A do RBAC nº 117.

  A adequação de um operador 91 é automática e independe de certificação pela Anac. Não será
  requerido o envio de material e não serão emitidos documentos confirmando sua adequação
  ao RBAC nº 117.

  Procedimentos de adequação dos operadores 121 ou 135 que operem sob o NB do RBAC nº 117

  Cada operador que conduza suas operações segundo os RBAC nº 121 ou 135 e sob o Nível Básico
  (NB) do RBAC nº 117, é responsável primário pelo cumprimento das regras contidas nas Seções
  117.19 e 117.21, bem como no Apêndice A do RBAC nº 117.

  Detentores de certificado que desejem conduzir operações no NB devem incluir em seu MGO
  as informações requeridas pelas seções 117.19.

  O MGO deve incorporar as informações requeridas pelo APÊNDICE B desta IS e devem ser inseridas
  nos seguintes capítulos do MGO:

  a. no Capítulo 7 - Gerenciamento da fadiga humana, previsto na IS nº 121-005, para um operador
  certificado segundo as regras do RBAC nº 121; ou

  b. na Seção 5 - Procedimentos para cumprimento da jornada de trabalho, previsto na IS nº
  135-002, para um operador certificado segundo as regras do RBAC nº 135.

