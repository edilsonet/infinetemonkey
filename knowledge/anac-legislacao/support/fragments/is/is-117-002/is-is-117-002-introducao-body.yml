title: Introdução
text: 'Introdução

  A seção 117.19 informa que todos os operadores possuem uma série de obrigações, sendo a
  principal delas dar condições para que o tripulante se encontre apto para o trabalho, e
  não permitir que um voo seja realizado em situação que sabidamente leve à fadiga ou permitir
  que um tripulante fatigado execute um voo [117.19(a)].

  Adicionalmente, os operadores do nível NB têm obrigação de desenvolver políticas e procedimentos
  para os itens 6.2 até 6.10 e Seção 10 desta IS.

  Manual do Operador (MGO) [117.19(a)] e Programa de Treinamento (PTO)

  Um operador do NB deve cumprir as limitações contidas nas seções 117.19 e 117.21 e Apêndice
  A do RBAC nº 117.

  As empresas que operam segundo os RBAC nº 121 e 135 e subparte K do RBAC nº 91, devem incluir
  no seu MGO os procedimentos de fadiga estabelecidos na seção 117.19. O item 9.2.3 e o APÊNDICE
  B desta IS apresentam informações adicionais sobre o capítulo de fadiga do MGO que operam
  segundo os RBAC nº 121 e 135 e são do NB.

  Operadores do RBAC nº 91 (exceto os da Subparte K daquele Regulamento), como por exemplo,
  operadores privados, empresas SAE, aeroclubes e CIAC, não necessitam elaborar um manual,
  conforme especificado no parágrafo 117.19(i), embora devam cumprir os demais requisitos
  contidos nas seções 117.19 e 117.21 e no Apêndice A do RBAC nº 117.

  O RBAC nº 117 não requer que empresas e operadores do NB elaborem e ministrem um programa
  de treinamento específico para fadiga.

  Aptidão para o trabalho [117.19(a)]

  Conforme estipulado no parágrafo 117.19(a), nenhum operador pode requerer que um tripulante
  opere uma aeronave se, considerando as circunstâncias do voo a ser realizado, o operador
  tiver razões para acreditar que aquele tripulante esteja, ou provavelmente venha a estar,
  sob o efeito de fadiga que possa prejudicar o desempenho do tripulante de modo a afetar
  a segurança da operação. O operador pode chegar a esta conclusão a partir de estudos próprios
  (informação científica, experiência anterior, modelagem biomatemática) ou a partir de informações
  fornecidas pelos próprios tripulantes, seja por meio de uma simples declaração de “inaptidão
  para assumir o voo ou a jornada” ou um reporte mais detalhado (como o exemplo do APÊNDICE
  D desta IS).

  As empresas que operam segundo as regras dos RBAC nº 121 ou 135 devem descrever no seu MGO
  os procedimentos para retirar do voo tripulantes que se declarem inaptos para o voo por
  motivo de fadiga.

  Acomodações para repouso [117.3(b)(3)]

  Os operadores devem estar cientes da exigência de que os tripulantes tenham uma oportunidade
  de sono antes de realizar uma jornada, um sobreaviso ou uma reserva. A oportunidade de sono
  deve dispor de acomodações adequadas para dormir, podendo ocorrer na residência do tripulante
  ou em outro local (por exemplo, um hotel).

  Nota: de acordo com o parágrafo 117.3(b)(3) do RBAC nº 117, é informado que na “base contratual
  de trabalho do tripulante, a moradia contempla os requisitos de acomodação para repouso”;
  deste modo, não é necessário que o operador gerencie as condições de repouso da moradia
  do tripulante.

  Os operadores devem considerar procedimentos que minimizem interrupções no sono dos tripulantes.
  Períodos de repouso devem incluir blocos definidos de tempo (oportunidades de sono), durante
  os quais os tripulantes não são contatados. Todo o pessoal relevante (por exemplo, o pessoal
  da elaboração da escala de tripulantes) deveria estar ciente dessas oportunidades de sono
  protegidas. Os operadores também devem desenvolver procedimentos para proteger o sono dos
  tripulantes nos lugares de pernoite.

  A ergonomia física das instalações para dormir e descansar deveria ser levada em conta,
  a fim de garantir que o pessoal possa obter uma recuperação adequada e estar apto para a
  próxima jornada. Sugere-se que os operadores considerem os fatores ergonômicos do trabalho,
  bem como as facilidades disponíveis nas instalações, ao gerenciar a fadiga nas operações.

  Os operadores devem considerar e gerenciar cuidadosamente como a localização da acomodação
  para repouso pode afetar a qualidade do sono. Ao considerar um local para acomodação, os
  operadores devem levar em conta os seguintes fatores para que se cumpra a oportunidade mínima
  de sono e o tempo hábil para necessidades fisiológicas:

  a. distância do deslocamento de / para o local de repouso ou descanso;

  b. opções de transporte (quanto menos opções, maior dependência de apenas um, o que demanda
  um plano alternativo em caso de problemas; avaliar locais com muito tráfego e engarrafamentos
  previsíveis que poderiam ser evitados);

  c. possíveis incômodos ou interrupções (por ex.: ruído exacerbado devido a obras nas proximidades,
  vias de alto tráfego, bares, locais de shows, eventos);

  d. possibilidade de realizar ligações telefônicas;

  e. limpeza das instalações;

  f. serviço de quarto;

  g. trabalho de manutenção nas instalações;

  h. controle de temperatura acessível e em pleno funcionamento;

  i. opções de compartilhamento de quartos (compartilhamento de quartos podem prejudicar o
  sono);

  j. controle de iluminação acessível e em pleno funcionamento;

  k. hábitos sociais (por exemplo, horários de refeições locais, horários de chegada / partida
  de outros hóspedes etc.); e

  l. garantia da segurança pessoal nas instalações (chaves individuais, portaria, vigilância).

  Os operadores também deveriam considerar como o local de repouso pode interagir com diferentes
  horários. Um tripulante pode ser sensível a alterações horárias de 1 ou 2 horas, quando
  há diferença de horários de verão e/ou quando o repouso ocorre em outro fuso dentro do país.
  Por exemplo, um tripulante adaptado ao fuso -3 UTC, cujo repouso aconteça em Manaus (1 hora
  a menos), ou Rio Branco (2 horas a menos) poderá:

  a. impactar os hábitos sociais relativos ao horário das refeições e dos horários de sono
  / despertar;

  b. exigir que o tripulante se ajuste à hora local; e

  c. exigir que o tripulante adiante seu relógio biológico.

  A diferença entre a necessidade de acordar às 05:00 horas ou 06:00 horas pode ser a diferença
  entre os efeitos da janela de baixa do alerta do ciclo circadiano (WOCL) impactando no desempenho
  ao longo do dia ou não.

  Definição de limites de jornada e de tempo de voo [117.19(c)(2) e 117.19(c)(3)]

  Limitar a duração das jornadas e o tempo de voo dentro de uma jornada é um aspecto fundamental
  do gerenciamento da fadiga. O Apêndice A do RBAC nº 117 define os limites máximos de jornada
  e de tempo de voo, bem como os limites mínimos de repouso e folgas.

  Operadores dos RBAC nº 121 ou 135 e da Subparte K do RBAC 91: o MGO precisa documentar as
  limitações aplicáveis ​​a todos os tripulantes, as quais não podem exceder os limites máximos,
  nem reduzir os limites mínimos, contidos no Apêndice A do RBAC nº 117.

  A Anac não aceitará um MGO que simplesmente se refira às limitações contidas no Apêndice
  A do RBAC nº 117. O MGO deve especificar claramente as limitações aplicáveis ​​aos seus
  tripulantes; estes tornam-se limites "prescritivos". Esse requisito permite que todos os
  tripulantes estejam cientes de suas limitações, sem precisar recorrer à consulta do referido
  Apêndice.

  Fornecimento de refeições

  Uma alimentação adequada é parte do que se faz necessário para que os tripulantes possam
  se manter aptos para o trabalho durante uma viagem.

  A Lei nº 13.475, de 28 de agosto de 2017, ao mesmo tempo que em que traz matéria relacionada
  a segurança operacional - afetas às atribuições desta Agência -, também dispõe sobre matéria
  que não se dirige a esse fim - notadamente, os relacionados aos aspectos trabalhistas da
  relação que existe entre os aeronautas e seus empregadores. O cumprimento dos requisitos
  estabelecidos no RBAC nº 117 não afasta a necessidade do cumprimento dos demais dispositivos
  legais, o que inclui os artigos 61 a 64 da Lei nº 13.475/17, que tratam do direito à alimentação
  dos tripulantes em viagem.

  Conservação de registros [117.19(e)]

  O parágrafo 117.19(e) do RBAC nº 117 requer que o operador mantenha registros em relação
  às listas de membros da tripulação, tempos reais de serviço e tempos de voo (incluindo reportes
  de situações onde a jornada é estendida sob uma cláusula de "extensão").

  Esses registros e reportes devem ser mantidos por cinco anos, como determinado pelo parágrafo
  117.19(e)(2) do RBAC nº 117. Os operadores devem manter registros da duração de todas os
  períodos de serviço realizados por um tripulante, como qualquer tarefa que um tripulante
  tenha executado para o operador (incluindo atividades de escritório).

  Quando for usada uma extensão que exceda limite aplicável do Apêndice A do RBAC 117, devem
  ser cumpridos os requisitos dos parágrafos 117.19(e)(3) e A117.15(g), que incluem comunicação
  da extensão à Anac. Ademais, um reporte deve ser preenchido pela tripulação sempre que ela
  acreditar que houve fadiga (consulte o APÊNDICE D desta IS para exemplos de reportes de
  ocorrência de fadiga).

  O objetivo desses reportes é facilitar a identificação dos perigos de fadiga e a melhoria
  nas políticas de gerenciamento de fadiga de um operador (ou seja, limitações). Deve haver
  detalhes suficientes no reporte para permitir que ele seja efetivamente usado para essa
  finalidade.

  Nota: o reporte requerido por este item não isenta o operador de preparar e enviar à Anac
  a comunicação prevista no parágrafo A117.15(g) do Apêndice A do RBAC nº 117.

  Determinação da base contratual do tripulante [117.19(f)]

  É necessário que o operador determine e notifique cada um de seus tripulantes do seu aeroporto
  de base contratual, a menos que o tripulante apenas realize operações aeroagrícolas [vide
  o parágrafo 117.19(f) do RBAC nº 117].

  Detalhes do processo para fazer essas determinações da base contratual devem ser incluídos
  no MGO. Isso permite que os tripulantes entendam os procedimentos associados a essas determinações
  (por exemplo, o tempo disponível para os seus deslocamentos na base contratual, locais adequados
  de moradia etc.).

  Os operadores devem garantir que as mudanças de base contratual não afetem adversamente
  a segurança das operações. É necessária uma análise cuidadosa das consequências dessa mudança
  para o tripulante e como isto poderá afetar o seu estado de alerta.

  As determinações da base contratual devem ser feitas com um alto grau de permanência, de
  modo a não interromper as rotinas de recuperação de fadiga do tripulante entre as jornadas.

  Este item não isenta o operador de observar os regramentos do direito trabalhista quanto
  à determinação da base contratual do tripulante.

  Elaboração e publicação de escalas [117.19(g)]

  É importante que os operadores publiquem a escala de serviço com antecedência suficiente
  para permitir que os tripulantes organizem seu equilíbrio trabalho, sono adequado e outros
  aspectos da vida pessoal. As escalas também devem ser publicadas com uma antecedência suficiente
  para que seja comunicada a todos os tripulantes. O parágrafo 117.19(g) do RBAC nº 117 informa
  que devem ser seguidos os requisitos mínimos da seção A117.9 do Apêndice A do RBAC nº 117
  para a elaboração e divulgação das escalas de serviço, como se segue:

  Operadores do RBAC nº 121 e operadores regulares do RBAC nº 135 (Parágrafo 117.1(b)(1) do
  RBAC nº 117):

  a. A prestação de serviço do tripulante, respeitados os períodos de folgas e repousos regulamentares,
  deve ser determinada por meio de:

  i. escala, no mínimo mensal, divulgada com antecedência mínima de 5 (cinco) dias, determinando
  os horários de início e término de voos, serviços de reserva, sobreavisos e folgas, sendo
  vedada a consignação de situações de trabalho e horários não definidos; ou

  ii. escala ou convocação, para realização de cursos, reuniões, exames relacionados a treinamento
  e verificação de proficiência técnica.

  b. Os limites previstos no parágrafo 6.9.1.1.a.i desta IS podem ser alterados, desde que
  estejam contidos no manual do operador e sejam previamente aprovados pela Anac. O operador
  deve demonstrar à Anac que tais limites são seguros para a operação proposta;

  c. Em 4 (quatro) meses do ano, os operadores estão autorizados, caso julguem necessário,
  a divulgar escala semanal para voos de horário, serviços de reserva, sobreavisos e folgas
  com antecedência mínima de 2 (dois) dias, para a primeira semana de cada mês, e de 7 (sete)
  dias, para as semanas subsequentes; e

  d. Para voos exclusivamente cargueiros, é autorizada a divulgação de escala semanal para
  voos de horário, serviços de reserva, sobreavisos e folgas com antecedência mínima de 2
  (dois) dias, para a primeira semana de cada mês, e 7 (sete) dias, para as semanas subsequentes.

  Demais operadores aéreos (Parágrafos 117.1(b)(2), 117.1(b)(3), 117.1(b)(5) e 117.1(b)(6)
  do RBAC nº 117):

  a. A prestação de serviço do tripulante, respeitados os períodos de folgas e repousos regulamentares,
  deve ser determinada por meio de:

  i. escala, no mínimo semanal, divulgada com antecedência mínima de 2 (dois) dias, determinando
  os horários de início e término de voos, serviços de reserva, sobreavisos e folgas, sendo
  vedada a consignação de situações de trabalho e horários não definidos; ou

  ii. escala ou convocação, para realização de cursos, reuniões, exames relacionados a treinamento
  e verificação de proficiência técnica;

  b. Outros critérios para a determinação da prestação de serviço dos tripulantes podem ser
  adotados, desde que tais critérios estejam contidos no manual do operador e sejam previamente
  aprovados pela Anac;

  O item 6.9.1.2 não se aplica aos operadores do RBAC nº 137 (Parágrafo 117.1(b)(4) do RBAC
  117).

  Recomenda-se, no entanto, que o período mínimo de notificação especificado no parágrafo
  anterior tenha a maior antecedência possível quando um tripulante for escalado para viagens
  que:

  a. envolverem operações com tripulação composta e de revezamento;

  b. cruzarem três ou mais fusos horários;

  c. incluírem duas ou mais operações noturnas; ou

  d. incluírem jornadas interrompidas.

  Embora as alterações posteriores à publicação das escalas sejam compreensíveis, é importante
  que essas alterações sejam mínimas, ou seja, que a escala seja o mais estável possível.

  É importante haver procedimentos em vigor para que qualquer risco de fadiga resultante dos
  efeitos das mudanças na escala após publicação seja gerenciado. Isso é particularmente importante
  para operações com tripulação composta ou de revezamento e o subsequente planejamento do
  descanso em voo.

  Para operações sob demanda, particularmente aquelas em que os tripulantes são empregados
  ocasionalmente, pode haver pouca oportunidade de notificar uma próxima jornada.

  a. A menos que a jornada seja bastante curta, um operador deveria ter procedimentos que
  envolvam a divulgação de uma jornada casual, pelo menos um dia antes desta ocorrer.

  b. Esses procedimentos, portanto, permitiriam que o tripulante, antes de aceitar a jornada,
  considere a sua aptidão para o trabalho e se será ou não capaz de garantir um repouso adequado
  antes.

  c. Como um guia, para uma jornada ser considerada bastante curta, não excederá 50% do limite
  de jornada de voo para o horário de início aplicável.

  d. Além disso, se houver algum aumento no limite da jornada por meio do uso de tripulações
  compostas ou de revezamento ou de uma jornada interrompida, o período de notificação precisará
  ser aumentado adequadamente.

  Adicionalmente aos itens acima:

  a. O operador deve garantir que o tripulante não seja escalado para uma jornada maior do
  que o número de horas especificado:

  i. no Apêndice A do RBAC nº 117 para os operadores do RBAC nº 91.

  ii. no MGO, para os operadores dos RBAC nº 121 e 135 e Subparte K do RBAC 91;

  b. É importante que se tenha um cuidado especial com os horários de saída do local de descanso
  e previstos de chegada no aeroporto, a fim de evitar que o tripulante fique em vigília no
  aeroporto sem a respectiva contagem de tempo de jornada.

  c. O horário de início da jornada deve ser o real de apresentação do tripulante no local
  indicado pelo operador. Considerações adicionais:

  i. A mera chegada do tripulante ao aeroporto/local de apresentação não caracteriza necessariamente
  apresentação ao trabalho. Portanto, o operador pode orientar seus tripulantes a somente
  iniciar as atividades a partir de determinado horário (normalmente o horário publicado na
  escala) e até mesmo impedir que os tripulantes iniciem as atividades antes do horário determinado;

  ii. Por outro lado, se o tripulante se apresenta e efetivamente é admitido no trabalho e
  inicia suas atividades antes do horário de apresentação previsto na escala, o horário de
  apresentação real deve ser considerado. Nesse sentido, os operadores não podem tirar proveito
  de um tripulante envolvido em atividades voluntárias antes de uma jornada que, de outra
  forma, seriam consideradas atividades requeridas. O operador não pode programar a jornada
  de trabalho de tal maneira que haja tão pouco tempo disponível antes do voo que o horário
  de início do voo só seja atingido se o tripulante realizar as atividades necessárias antes
  do início da jornada de trabalho. Neste caso, as atividades não podem mais ser consideradas
  voluntárias.

  iii. No diário de bordo, deve ser registrado o que efetivamente ocorreu, ou seja, os horários
  reais de apresentação, respeitando-se os prazos mínimos previstos no RBAC nº 117. Os horários
  reais também devem ser considerados nos registros do tripulante para contabilização dos
  limites de jornada, seja diária, mensal ou anual.

  d. Horário de término da jornada. Caso ocorra algo que impeça que os tripulantes deixem
  o trabalho em 30 minutos (ou 45 minutos, conforme aplicável) após o corte dos motores, como,
  por exemplo, atraso no provimento de meios de desembarque de passageiros com necessidade
  de assistência especial (PNAE), o horário real deve ser considerado. Não há previsão de
  registro do horário de encerramento de jornada no diário de bordo, mas o registro deve ocorrer
  no meio estabelecido pelo operador para atendimento ao parágrafo 117.19(e)(1)(ii) do RBAC
  nº 117.

  e. O operador deve assegurar que as jornadas sejam designadas de tal maneira que forneçam
  provisão suficiente para o(s) voo(s) pretendido(s), bem como um período suficiente para
  deveres pré e pós-voo que levem em consideração requisitos inevitáveis tais como:

  i. check-in de passageiros;

  ii. embarque de passageiros;

  iii. balancear e carregar a aeronave, bem como preparar o manifesto de carga correspondente;

  iv. alfândega e imigração;

  v. deveres pré-voo (por exemplo, entrada de dados de voo);

  vi. inspeções pré-voo de manutenção e de pilotos (reabastecimento de combustível e óleo
  etc.);

  vii. deveres pós-voo (por exemplo, preenchimento do diário de bordo e tempo de serviço,
  limpeza de aeronaves, lavagem de compressores e outros serviços do piloto).

  f. O operador deve mensurar e/ou mitigar a fadiga decorrente de treinamentos em simulador
  e/ou trabalhos administrativos e operacionais, principalmente quando estes forem associados
  a uma atividade de voo. Eventuais atividades voluntárias devem ser enquadradas como trabalho
  e inseridas no cômputo da jornada.

  Acomodações para descanso a bordo de aeronave (A117.11)

  Operações com tripulações compostas ou de revezamento, com o consequente aumento de tempo
  de jornada em relação às tripulações simples, são permitidas nas operações sob o Apêndice
  A do RBAC nº 117.

  Aumentar a tripulação é uma estratégia que os operadores podem utilizar para auxiliar no
  gerenciamento do estado de alerta da tripulação. Com os procedimentos apropriados e instalações
  adequadas de descanso a bordo, a tripulação pode se revezar nos períodos de descanso durante
  o voo e utilizar as instalações para gerenciar seu estado de alerta e mitigar os efeitos
  da fadiga.

  Na definição dos procedimentos para descanso a bordo, o operador deve considerar os efeitos
  da inércia do sono. A inércia do sono afeta a atenção e o desempenho é reduzido, por isso,
  ela deve ser incluída como um período de inatividade operacional do tripulante após o sono.
  Normalmente, 15 minutos se mostram suficientes para que a pessoa se sinta funcional novamente;
  entretanto, este tempo pode ser maior dependendo de características pessoais e situacionais.

  Os limites de duração da jornada e do tempo de voo para tripulações compostas e de revezamento,
  constantes das seções A117.13 e A117.15 do Apêndice A do RBAC nº 117, somente podem ser
  utilizados se for provida uma acomodação adequada, fora da cabine de comando para o descanso
  a bordo da tripulação, na seguinte quantidade, conforme a seção A117.11 do Apêndice A do
  RBAC nº 117:

  a. aos tripulantes realizando voos em tripulação composta deve ser assegurado número de
  acomodações adequadas para descanso a bordo igual ao número de tripulantes somados à tripulação
  simples; e

  b. aos tripulantes realizando voos em tripulação de revezamento deve ser assegurado número
  de acomodações adequadas para descanso a bordo igual à metade do total de tripulantes.

  Para operadores do RBAC nº 121 ou 135, as acomodações requeridas para tripulação devem ser:

  a. aos tripulantes realizando voos em tripulação composta, pelo menos classe 2; e

  b. aos tripulantes realizando voos em tripulação de revezamento, pelo menos classe 1.

  Para os demais operadores, embora não se tenha estabelecido a obrigação, no RBAC nº 117,
  para que essas acomodações atendam às classes de acomodação definidas no parágrafo 117.3(b)(1)
  do RBAC nº 117, essas acomodações devem atender aos seguintes critérios para serem consideradas
  adequadas:

  a. reclinação de 40º ou mais com relação à vertical; e

  b. suporte para as pernas e pés na posição reclinada.

  OBRIGAÇÕES INDIVIDUAIS DOS TRIPULANTES

  Aptidão para o trabalho

  Aspectos gerais

  Conforme estipulado no parágrafo 117.21(a) do RBAC n]º 117, um tripulante deve utilizar
  a oportunidade de sono, os períodos de repouso, descanso e adaptação, garantidos pelo seu
  empregador, para obter a quantidade de sono suficiente para realizar com segurança qualquer
  atividade prevista na escala de trabalho.

  Em caso de sensação de fadiga ou da impossibilidade de descansar ou dormir antes de uma
  jornada, independentemente da causa, o tripulante deve se negar a operar uma aeronave se
  acreditar que tal situação possa comprometer seu estado de alerta e afetar a segurança de
  uma operação. Se for este o caso, ele deve informar ao operador a impossibilidade de assumir
  a jornada a qualquer tempo.

  Situações de vida mais ou menos permanentes que possam gerar fadiga e afetar o nível de
  alerta também são de responsabilidade do tripulante e devem ser informadas ao operador,
  conforme item 7.2 desta IS.

  Pode ser difícil ao tripulante avaliar se está fatigado ou não. A principal chave do gerenciamento
  é o autoconhecimento. Observar-se cuidadosamente, prestar atenção aos próprios hábitos e
  necessidades, experimentar novas situações geram resultados que se tornam a principal referência
  para o gerenciamento individual da fadiga.

  Cumpre salientar que a acomodação para repouso na base, ou seja, a moradia, é de responsabilidade
  do tripulante. Uma vez informado ao operador, considera-se que o local está de acordo com
  os requisitos de acomodação para repouso definidos no RBAC nº 117, não cabendo ao operador
  verificá-lo. Isso também se aplica aos outros locais informados pelo tripulante em que o
  hotel possa ser dispensado.

  Também é importante o tripulante ter claro que o sobreaviso não se confunde com repouso
  ou folga. Por isso, para esta condição, são recomendadas atividades leves, que não levem
  ao estresse físico, cognitivo ou emocional. Atividades que exijam muita atenção, como dirigir,
  devem ser evitadas em excesso.

  A escolha do local para cumprir o sobreaviso é de responsabilidade do tripulante. Recomenda-se
  ele ocorra em local com fácil acesso à acomodação para repouso, de forma que o descanso
  ou o sono sejam possíveis para preparação de um eventual chamado, e que o tempo de deslocamento
  até o aeroporto seja o menor possível.

  Atenção especial deve ser dada ao sobreaviso diurno, cujo acionamento pode resultar em uma
  jornada noturna. Para tanto, o tripulante deve se manter preparado durante o dia para ficar
  acordado mais do que esperado, utilizando adequadamente horários propícios ao cochilo (por
  exemplo, a janela de sono da tarde) e evitando atividades e tarefas que exijam o cognitivo,
  o emocional ou o físico em demasia. Avisar a família sobre esta condição antecipadamente
  pode ajudar a manter o ambiente adequado.

  ​​​​​Medição individual de alerta

  Determinar a aptidão para o trabalho sempre foi uma tarefa complexa e desafiadora, tanto
  para os operadores quanto para os próprios funcionários.

  Uma abordagem multi-método se mostra particularmente útil, dado que diversas pesquisas em
  fadiga demonstraram que os seres humanos são pouco precisos em determinar o quão fatigados
  eles realmente estão. A melhor abordagem para medir o nível de alerta de um indivíduo é
  combinar informações de várias fontes. Embora nenhuma ferramenta ou método esteja livre
  de limitações na medição, é mais provável que a obtenção de informações de diversas fontes
  forneça ao indivíduo uma imagem mais precisa sobre como tomar suas decisões em relação ao
  nível de alerta. Por exemplo, em vez de confiar apenas em sua avaliação genérica do seu
  grau de fadiga, os tripulantes poderiam referenciar melhor essa avaliação usando uma escala,
  como a escala Samn-Perelli, e adicionalmente, melhorar a precisão dessa avaliação considerando
  um ou mais das seguintes fontes de informação:

  a. seu histórico de sono, especialmente se mantiveram um diário de sono pessoal;

  b. monitoramento de indicadores comportamentais / cognitivos / emocionais (por exemplo,
  pálpebras caídas, tempo de processamento de informações mais lento, humor negativo);

  c. considerando suas respostas a fatores relevantes para a fadiga (por exemplo, duração
  do sono, qualidade do sono, ambiente do sono, fusos horários cruzados);

  d. completar um teste de vigilância psicomotora portátil (PVT), por pelo menos 5 minutos;
  ou

  e. examinando pontuações de ferramentas de monitoramento do sono (como actímetros).

  O uso de uma variedade de medidas (ou seja, dados objetivos e subjetivos) para determinar
  uma "imagem" do estado de alerta ajudará ao tripulante a tomar melhores decisões sobre o
  gerenciamento de sua fadiga e se ele está apto para o trabalho.

  Também é importante reconhecer que os tripulantes que estão fatigados terão prejuízo na
  tomada de decisões (por exemplo, sobre seus níveis de alerta) e terão pior julgamento em
  termos de como estão fatigados e se estão realmente aptos para o trabalho. Isso ocorre porque
  a capacidade de resolver problemas e tomar decisões é reduzida quando sofrem de fadiga.
  Operacionalmente, isso pode significar que tripulantes fatigados que fazem uma avaliação
  sobre sua aptidão para o trabalho podem interpretar mal os resultados dos testes ou utilizar
  ferramentas de medição incorretamente.

  A comunicação sobre a intensidade de sua fadiga pode não ser eficaz quando um tripulante
  está fatigado. Como a criatividade (juntamente com a capacidade de resolver problemas) também
  é reduzida quando se sofre de fadiga, um tripulante será menos efetivo ao:

  a. determinar formas eficazes de gerenciar a fadiga;

  b. abordar questões de alerta; e

  c. identificar potenciais riscos e perigos.

  Para evitar julgamento e tomada de decisão de baixa qualidade, a Anac recomenda envolver
  no processo de medição do estado de alerta um indivíduo não fatigado para ajudar o tripulante
  a avaliar a aptidão para o trabalho.

  Fatores importantes que fornecem informações ao determinar a aptidão para o trabalho são
  a medição do(e):

  a. histórico de sono;

  b. alterações no ritmo circadiano;

  c. risco operacional; e

  d. a hora da operação proposta.

  O Apêndice C desta IS fornece um exemplo de um método útil para auxiliar um indivíduo considerar
  fatores que afetam o seu estado de alerta. A intenção desta ferramenta é que ela seja usada
  de maneira proativa para ajudar um tripulante que acredita apresentar um risco de fadiga,
  mas não tem certeza se deve iniciar o trabalho, ou não tem certeza por quanto tempo permanecerá
  com um nível razoável de alerta.

  É importante que os operadores e funcionários entendam que a ferramenta no Apêndice C desta
  IS não pretende fornecer um resultado "apto ou não-apto". Haverá também situações em que
  os tripulantes precisarão iniciar as operações e gerenciar seu risco de fadiga através do
  uso de outras contramedidas (por exemplo, rodízio de tarefas ou cochilos em solo).

  Note que a ferramenta apresentada no Apêndice C desta IS é apenas um exemplo de auxílio
  para tomar decisões ao determinar a aptidão para o trabalho. Os operadores ou tripulantes
  podem utilizar outras formas para determinar a aptidão para o trabalho, os quais devem ter
  sua validade estabelecida e serem simples o suficiente para serem utilizáveis no dia a dia.
  O gerenciamento da fadiga precisa ser específico para o contexto de risco operacional do
  operador.

  ​​​​​​Reporte de ocorrência de fadiga

  7.1.3.1. A forma mais eficaz de o tripulante informar uma questão relativa à fadiga (mesmo
  quando não se tem certeza) é por meio de um reporte formal. Dedicar um tempo e esforço para
  preencher os dados pode gerar um resultado importante para a segurança e para a organização.
  Compartilhar a experiência com colegas e descobrir que já houve situações semelhantes ajuda
  no entendimento da questão, mas pode não evoluir se tal não for formalmente repassado e
  tratado pelo operador. O reporte deveria ser analisado pelo operador, e um feedback formal
  deveria ser fornecido ao tripulante que gerou o reporte. Consulte o APÊNDICE D desta IS
  para um exemplo de um reporte de ocorrência de fadiga.

  Saúde e bem-estar

  Faz parte da responsabilidade individual de cada tripulante o monitoramento de sua saúde
  e a busca por tratamento adequado quando necessário. São exemplos:

  a. problemas de saúde a curto prazo (agudos) ou crônicos;

  b. predisposições genéticas;

  c. nutrição;

  d. hidratação; ou

  e. distúrbios do sono.

  Há uma ampla gama de distúrbios do sono que podem gerar fadiga, afetando as funções circadianas,
  a quantidade de sono e a qualidade do sono. É de responsabilidade do tripulante buscar diagnóstico
  médico quando se identificar com os sinais e sintomas, bem como seguir o tratamento, se
  for o caso.

  Nota: Os distúrbios do sono variam em gravidade, desde ocasionais e inconvenientes (por
  exemplo, jet lag) até crônicos e potencialmente com risco de vida (por exemplo, síndrome
  da apneia obstrutiva do sono). Os tripulantes têm o dever de monitorar e gerenciar quaisquer
  problemas de saúde que possam afetar sua aptidão para o trabalho, o que pode incluir o contato
  com um especialista médico. Os tripulantes devem estar cientes de que as dificuldades do
  sono podem existir ou podem se desenvolver no futuro e que elas devem ser tratadas de acordo,
  de modo que não afetem a segurança das operações.

  Carga de trabalho

  Um dos tópicos principais ao considerar os fatores humanos e o desempenho humano nos sistemas
  de aviação é o gerenciamento da carga de trabalho. Embora existam várias conceituações de
  carga de trabalho, a carga de trabalho mental pode ser definida como uma função das demandas
  sob responsabilidade da tripulação e das capacidades da tripulação para atender a essas
  demandas.

  O gerenciamento de carga de trabalho para a tripulação requer consideração de:

  a. quanto a tarefa demanda de atenção;

  b. qual a capacidade de processamento das pessoas acerca da tarefa;

  c. se há tarefas duplas ou múltiplas a serem desempenhadas; e

  d. como as capacidades mentais estão sendo utilizadas.

  Embora o gerenciamento de carga de trabalho em si seja importante ao minimizar o risco de
  erro humano, também é provável que a carga de trabalho e a natureza das tarefas executadas
  afetem a fadiga da tripulação. Até hoje, poucos estudos consideraram como a carga de trabalho
  influencia o estado de alerta (ou vice-versa); no entanto, é provável que sua interação
  exija consideração e gerenciamento.

  Atualmente, os fatores relacionados à carga de trabalho considerados mais evidente são a
  quantidade de etapas de voo cumpridas na mesma jornada (no sentido de, quanto mais etapas,
  maior a carga de trabalho) e a duração da jornada (neste caso, especialmente as maiores
  de 8 horas).

  Técnicas típicas para gerenciar a carga de trabalho enquanto em serviço incluem:

  a. diminuição de tarefas;

  b. priorização de tarefas;

  c. delegação de tarefas;

  d. rotação de tarefas; e

  e. rotação de pessoal.

  Também é importante estar ciente do nível ideal de estresse ou excitação de uma pessoa,
  necessário para um desempenho ideal:

  a. reconhecer as vantagens do estresse e engajamento em uma tarefa;

  b. ter atitudes realistas em relação ao estresse entendendo que as pessoas reagem diferentemente
  a situações estressantes (por exemplo, emergências);

  c. usar comunicação eficaz com os colegas; e

  d. monitorar e observar comportamentos que possam indicar uma mudança no nível de carga
  de trabalho de uma pessoa (por exemplo, segurar os controles com firmeza, fixação no horizonte
  artificial, túnel com foco em uma tela).

  A carga de trabalho também é um fator cada vez mais importante para modelos biomatemáticos
  de previsão de desempenho. Embora a determinação do grau em que esse fator (a variância)
  possa causar impacto no estado de alerta (além de fatores como a duração, o tempo ou o padrão
  do deslocamento), é necessária uma pesquisa adicional. Vários modelos biomatemáticos de
  fadiga no mercado estão atualmente investigando e incorporando os efeitos da carga de trabalho
  no estado de alerta em seu conjunto de variáveis ​​preditivas.

  No geral, os dados existentes sugerem que as relações entre carga de trabalho, desempenho
  e fadiga subjetiva são provavelmente complexas e que pesquisas adicionais são desejáveis.
  Para o pessoal da aviação, é importante considerar e gerenciar os efeitos da carga de trabalho
  e da fadiga individualmente ao gerenciar o risco, bem como a relação de interação que pode
  estar presente entre eles.

  Estratégias de mitigação da fadiga

  Um tripulante pode gerenciar a fadiga antes, durante e depois das jornadas de trabalho,
  empregando uma gama de estratégias de mitigação de fadiga que funcionem para suas necessidades
  pessoais. No gerenciamento de fadiga, a ferramenta mais potente é a proteção ao sono. Por
  isso, é importante estabelecer hábitos de sono eficazes, realizando a chamada higiene do
  sono, tais como:

  a. programando os horários para dormir;

  b. programando os horários para comer em função do horário para dormir (de modo que a digestão
  da refeição não interfira no sono e que não seja necessário levantar para comer);

  c. tentando realizar uma atividade tranquila antes de dormir;

  d. estabelecendo uma rotina para dormir, sempre que possível;

  e. não comendo ou bebendo mais que o habitual antes de dormir (especialmente 3 horas antes
  do sono pretendido);

  f. avaliando se exercícios físicos antes de dormir favorecem ou prejudicam o sono (vide
  item 7.1.6.3 desta IS);

  g. saindo da cama se não conseguir dormir, em busca de atividades calmas, não excitantes;

  h. usando técnicas de relaxamento;

  i. garantindo um ambiente de sono propício ao sono, especificamente que seja fresco, escuro
  e silencioso, com cama e travesseiro confortáveis.

  Uma das contramedidas de fadiga mais eficazes é cochilar; no entanto, é importante lembrar
  que o cochilo não deve ser considerado como uma alternativa para uma noite de sono regular.
  O cochilo pode ser útil ao suplementar um sono breve ou de baixa qualidade. Apenas 15 a
  20 minutos podem aumentar o desempenho e o estado de alerta temporariamente. Deve-se ter
  cuidado ao planejar o cochilo, pois o cochilo por mais de 45 minutos pode resultar em maior
  inércia do sono.

  O exercício físico também é um mitigador de risco de fadiga benéfico, pois melhora a energia
  e a resistência, melhora o humor, alivia o estresse e resulta em um sono mais longo e mais
  tranquilo. Entretanto, exercícios físicos aeróbicos aceleram o metabolismo, de modo que
  idealmente devem ser evitados antes de 3 horas do horário destinado ao sono. Este intervalo
  pode ser menor para pessoas acostumadas a treinar, principalmente à noite, de modo que a
  avaliação demanda autoconhecimento. De qualquer forma, não se deve acreditar que logo depois
  de uma atividade física, especialmente aeróbica, o sono será propiciado rapidamente.

  Nutrição e hidratação adequadas também são importantes para o gerenciamento e prevenção
  da fadiga. Idealmente, o tripulante deve:

  a. ter uma dieta equilibrada;

  b. comer regularmente;

  c. consumir lanches saudáveis;

  d. tomar café da manhã;

  e. fazer refeições planejadas;

  f. beber água regularmente; e

  g. evitar as refeições noturnas (que resultam em uma digestão mais lenta).

  Outra contramedida de fadiga popular é o uso da cafeína como estimulante. A cafeína pode
  melhorar o estado de alerta temporariamente, leva de 15 a 30 minutos para surtir efeito
  e pode durar até 5 horas; no entanto, é importante considerar que existem diferenças individuais
  em termos dos efeitos da cafeína, que a tolerância e a abstinência podem se desenvolver,
  e que o uso deve ser evitado antes de dormir. A cafeína deve ser usada quando seu efeito
  tiver o maior impacto (ou seja, antes da descida e do pouso).

  Para aumentar a qualidade do sono, o álcool deve ser evitado antes de dormir. Embora culturalmente
  se acredite que o álcool favoreça o sono, na realidade ele prejudica o sono restaurador.
  Medicamentos que auxiliam o sono devem ser utilizados com cuidado e apenas sob orientação
  médica, pois podem levar à sonolência, confusão e esquecimento. A nicotina também deve ser
  evitada, pois é um estimulante que pode interferir no início e na manutenção do sono.

  Uma maneira ideal dos tripulantes acompanharem a qualidade do sono ou a eficácia das contramedidas
  de fadiga usadas é manter um registro do sono ou um diário do sono. Pesquisas sugerem que
  as pessoas (incluindo os tripulantes) tendem a superestimar a quantidade de sono obtido;
  portanto, um registro diário pode ajudar a ter uma lembrança precisa, e um histórico de
  sono entre períodos de folga, por exemplo. Um diário do sono pode incorporar:

  a. hora de dormir;

  b. hora do despertar;

  c. tempo na cama;

  d. humor ao despertar;

  e. nutrição / consumo de álcool do dia anterior;

  f. qualidade do sono (por exemplo, número de despertares percebidos durante a noite); e

  g. ambiente do sono (por exemplo, uma cama confortável, ventilação, iluminação, ruído).

  É de responsabilidade do tripulante levar em conta suas necessidades pessoais, ergonômicas
  e ambientais ao configurar as acomodações para repouso em sua casa.

  Apresenta-se na Tabela 1 exemplos de ações que os tripulantes podem adotar visando a mitigação
