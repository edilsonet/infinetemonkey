title: OBJETIVO
text: 'OBJETIVO

  Orientar os operadores aéreos, escolas de aviação, centros de treinamento e tripulantes
  sobre o cumprimento das suas obrigações contidas nos requisitos do RBAC nº 117 relacionadas
  aos requisitos de gerenciamento da fadiga no nível básico (NB).

  Estabelecer os procedimentos aceitáveis para a adequação dos operadores aéreos aos requisitos
  do nível básico de gerenciamento da fadiga (NB) do RBAC nº 117.'
