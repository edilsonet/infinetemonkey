text: '1. OBJETIVO

  1.1 Orientar os detentores de certificado que conduzem suas operações sob os RBAC nº 121

  e 135, aqueles que se enquadram nos parágrafos 117.11(a)(2) e 117.11(a)(3) do RBAC nº

  117, e tripulantes sobre o cumprimento das suas obrigações contidas nos requisitos do

  1.2 Estabelecer os procedimentos aceitáveis para a certificação dos detentores de certificado

  aos requisitos de gerenciamento de risco da fadiga (GRF) do RBAC nº 117.'
