  v. O manual deve conter procedimentos para determinar o período de adaptação

  necessário para um tripulante que esteja em um estado desconhecido de

  aclimatação torne-se adaptado novamente para uma determinada localidade.

  Os períodos de adaptação mínimos estão especificados na Tabela 1 do RBAC

  nº 117. O operador pode entender que mais horas são necessárias em certas

  circunstâncias ou locais e assim estabelecer no seu manual.

  vi. Para tripulantes aclimatados, os limites de jornada e tempo de voo do MO não

  devem exceder os limites das Tabelas B.1, B.2 ou B.3.

  vii. Para tripulantes em estado desconhecido de aclimatação, os limites de jornada

  e tempo de voo do MO não devem exceder os limites das Tabelas B.1, B.2 ou

  B.3 diminuídos em 1 hora para a célula correspondente.

  viii. Um tripulante não pode ser designado para mais de 2 jornadas consecutivas

  em um estado desconhecido de aclimatação. Uma vez que 2 jornadas

  consecutivas sejam realizadas em um estado desconhecido de aclimatação,

  um período de adaptação deve ser designado antes que o tripulante possa

  realizar outra jornada.

  f. Apêndice C do RBAC nº 117.

  i. Os limites no MO não devem exceder os limites no RBAC nº 117, Apêndice

  C, Tabela C.1.

  6.4.3. Aumento dos limites da jornada de trabalho em função de jornada interrompida

  [117.B(f) ou 117.C(f)]

  6.4.3.1. Para muitos operadores, fornecer aos tripulantes um período de descanso durante
  uma

  jornada é uma maneira útil de abordar o risco potencial de fadiga e, em contrapartida,

  permitir um aumento do limite desta jornada de trabalho, caracterizando a chamada

  jornada interrompida. A jornada interrompida envolve garantir ao tripulante um ambiente

  propício para dormir ou descansar durante a interrupção e liberá-lo de todas as tarefas

  durante esse período.

  6.4.3.2. Fazer provisão para jornada interrompida não é obrigatório; no entanto, se o MO
  não

  incluir procedimentos para jornada interrompida, essa prática não é permitida.

  6.4.3.3. A jornada interrompida não é permitida para operadores do RBAC nº 121 sob o Apêndice

  A do RBAC nº 117, uma vez que ela não é acompanhada das salvaguardas previstas nos

  Apêndices B e C do RBAC nº 117. Para os operadores do RBAC nº 121 sob os ApêndicesData de
  emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  B e C, é exclusiva para tripulações mínimas e simples, aclimatadas e fora de base.

  6.4.3.4. O que deve constar do MO:

  a. se um operador optar por incorporar jornada interrompida em suas operações, seu

  manual deve conter procedimentos para assegurar que:

  i. a adequação da acomodação atende ao padrão mínimo. Para tanto, deverá

  considerar que:

  A. existe um padrão diferente para acomodações para dormir (repouso) e

  acomodações para descansar (reserva). O padrão para cada um pode ser

  encontrado na seção de definições do RBAC nº 117;

  B. a casa do tripulante é considerada adequada, sendo da responsabilidade

  do tripulante a manutenção como acomodação para repouso;

  C. locais diferentes da casa, informados pelo tripulante como adequados

  para acomodação para reserva ou repouso, podem justificar casos de

  dispensa de hotel, sendo da responsabilidade do tripulante a

  manutenção como acomodação para repouso;

  D. os locais de repouso e descanso indicados pelo operador devem ser

  avaliados para assegurar a conformidade com o RBAC nº 117 (por

  exemplo, hotéis). Isso significa reavaliar o padrão periodicamente ou

  quando o operador tiver motivos para acreditar que pode haver um

  problema com o padrão fornecido;

  ii. haja tempo real suficiente alocado na escala para o tripulante deslocar-se de

  e para o local adequado para dormir ou descansar durante a interrupção e

  ainda ter tempo suficiente nesse local para cumprir os requisitos mínimos

  (vide especialmente o parágrafo B(f)(5) do RBAC nº 117);

  iii. os tripulantes não sejam perturbados durante o período de descanso

  relacionado à jornada interrompida. Isso significa ter políticas e

  procedimentos específicos que abordem possíveis fontes de distúrbio. Como

  exemplo, a existência de protocolos de comunicação para gerenciar como o

  tripulante é contatado e como ele configura seu celular para proteger-se contra

  distúrbios inadvertidos de chamadas recebidas;

  iv. as jornadas interrompidas sejam atribuídas a um tripulante como parte da

  escala de trabalho a fim de fornecer ao tripulante a quem ela se aplica uma

  oportunidade razoável de planejar seu descanso ou repouso e vida social antes

  da sua próxima jornada;

  v. o setor responsável informe aos tripulantes em reserva e sobreaviso que

  poderão ser acionados para uma jornada interrompida, se tal prática fizer parte

  da política do operador;

  vi. o tempo transcorrido durante o período de descanso ou repouso da jornada

  interrompida seja sempre considerado como um trabalho e seja incluído como

  parte da jornada;Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  vii. todo o período mínimo de acesso a uma acomodação adequada deve ser

  alcançado antes do final do período de jornada de trabalho máxima (sem

  considerar o aumento devido à jornada interrompida) antes que seja permitido

  um aumento no limite da jornada de trabalho;

  viii. o limite da ocorrência de jornadas interrompidas seja de uma vez a cada 168

  horas consecutivas por tripulante, para operações sob o RBAC nº 121;

  Importante para o operador considerar:

  • A gestão da mudança na troca de acomodações (mudança de hotel, por exemplo);

  • Um procedimento para o tripulante fornecer feedback sobre o padrão das

  acomodações consideradas adequadas para dormir (repouso) ou descansar

  (reserva); e

  • Revisão do padrão das acomodações adequadas para dormir ou descansar em um

  processo periódico formal.

  b. acomodações para reserva (vide definição no RBAC nº 117) para interrupções de

  mais de 3 e menos de 6 horas consecutivas entre o período de 06:00 e 00:00;

  c. acomodações para repouso (vide definição no RBAC nº 117) para interrupções de

  6 a 10 horas, a qualquer hora do dia, ou quando alguma parte da interrupção ocorrer

  entre 00:00 a 06:00 (madrugada);

  d. que, atendidos os requisitos acima, a jornada total pode ser acrescida de até metade

  do tempo de interrupção;

  e. que, depois de aplicar o aumento de até metade do tempo da interrupção, a jornada

  de trabalho máximo (jornada interrompida total) não seja superior a 14 horas para

  operadores do RBAC nº 121 e 16 horas para operadores do RBAC nº 135, em que

  a interrupção é contada como jornada;

  f. que o tempo remanescente da jornada interrompida, após o período de descanso ou

  repouso, não ultrapasse 6 horas;

  g. que, para tripulantes operando sob o RBAC nº 121, as jornadas interrompidas não

  sejam precedidas ou sucedidas por repouso reduzido;

  h. que, para efeito de contagem de tempo de interrupção, não são considerados os

  tempos necessários para atividades pós-voo, pré-voo e deslocamento até o local de

  descanso ou repouso, não podendo ser o tempo total destas atividades menor do que

  30 minutos;

  i. que, para efeito de cálculo de repouso após a jornada interrompida, devem ser

  considerados os requisitos estabelecidos no parágrafo (l) do Apêndice aplicável;

  j. jornadas interrompidas devem ser consignadas no diário de bordo da aeronave com

  a informação de quais foram os horários reais de interrupção e retomada da jornada,

  tipo de acomodação oferecida pelo operador (reserva ou repouso), e assinatura do

  piloto em comando;

  k. por ser algo novo, o operador deve estabelecer que o GAGEF acompanhe asData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  jornadas interrompidas, especialmente no início de suas operações, buscando

  ativamente informações junto aos tripulantes para avaliações de possíveis riscos e

  pontos fortes.

  6.4.4. Aumento da jornada e tempo de voo em operações com tripulação composta ou de

  revezamento [117.B(g)]

  6.4.4.1. Operações com tripulações compostas ou de revezamento, com o consequente aumento

  de tempo de jornada, em relação às tripulações mínimas e simples, são permitidas nas

  operações sob o Apêndice B do RBAC nº 117 (mas não sob o Apêndice C).

  6.4.4.2. Aumentar a tripulação é uma estratégia que os operadores podem utilizar para auxiliar
  no

  gerenciamento do estado de alerta da tripulação. Com os procedimentos apropriados no

  MO e instalações adequadas de descanso a bordo, a tripulação pode se revezar nos

  períodos de descanso durante o voo e utilizar as instalações para gerenciar seu estado de

  alerta e mitigar os efeitos da fadiga.

  6.4.4.3. Na definição dos procedimentos para descanso a bordo, o operador deve considerar
  os

  efeitos da inércia do sono. A inércia do sono afeta a atenção e o desempenho é reduzido,

  por isso, ela deve ser incluída como um período de inatividade operacional do tripulante

  após o sono. Normalmente, 15 minutos se mostram suficientes para que a pessoa se sinta

  funcional novamente; entretanto, este tempo pode ser maior dependendo de

  características pessoais e situacionais.

  6.4.4.4. Os tripulantes têm diferentes necessidades de sono e diferentes efeitos de desempenho
  de

  contramedidas (por exemplo, uso de cafeína), cada um dos quais deve ser levado em

  consideração. A tripulação adicional ainda ficará fatigada mesmo quando não estiver em

  uma função operacional. Os operadores precisam garantir que os tripulantes recebam

  treinamento sobre o uso apropriado de tripulações aumentadas e instalações de descanso

  a bordo.

  6.4.4.5. Os limites aumentados da tripulação são em parte determinados pela classe de

  acomodação de descanso da tripulação disponível a bordo da aeronave. As acomodações

  de descanso da tripulação necessitam de um desenho e consideração cuidadosos, a fim de

  permitir o cumprimento dos requisitos adequados de descanso e sono em voo para a

  tripulação. As classes de acomodações de descanso da tripulação são definidas no

  parágrafo 117.3(b)(1) do RBAC nº 117.

  6.4.4.6. Ao determinar as especificações apropriadas das instalações de descanso a bordo
  das

  aeronaves, os seguintes fatores deveriam ser levados em consideração (ver AC 117-001

  da FAA para maiores detalhes):

  a. alívio das restrições posturais do trabalho (por exemplo, períodos prolongados

  sentados e afivelados a um assento);

  b. ruído (no sentido de evitá-lo ao máximo);

  c. configurações físicas das próprias instalações (no sentido de que as instalações

  sejam amplas o suficiente para acomodar os tripulantes com conforto,

  possibilitando que ele possa se sentar e se virar para poder “dormir de lado”, e que

  tenha comprimento o suficiente para que seus pés não fiquem acomodados de forma

  desconfortável, isto é, flexionados);Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  d. localização dos locais de descanso (por exemplo: um local muito próximo aos

  lavatórios e galleys poder dificultar o descanso dos tripulantes devido ao ruído e

  falta de privacidade);

  e. necessidades de privacidade (idem acima);

  f. iluminação (no sentido de ser controlável pelo tripulante em descanso,

  possibilitando total escuridão);

  g. vibração (no sentido de evitá-lo ao máximo);

  h. microclima (fluxo de ar, ventilação, temperatura, gradiente de temperatura,

  umidade);

  i. higiene (evitar patógenos, proteção);

  j. procedimentos para garantia da comunicação entre os tripulantes (por exemplo:

  existência de um interfone no local de descanso);

  k. mecanismos de se afivelar aos assentos (por exemplo: os cintos devem ser

  aprovados pela gerência de certificação da aeronave da ANAC);

  l. condições de acesso (por exemplo: as condições de acesso devem ser aprovadas

  pela gerência de certificação da aeronave da ANAC);

  m. procedimentos de evacuação (por exemplo: os procedimentos de evacuação devem

  ser aprovadas pela gerência de certificação da aeronave da ANAC); e

  n. requisitos de equipamentos de emergência disponíveis nas instalações (por

  exemplo: os requisitos de equipamentos de emergência disponíveis nas instalações

  devem ser aprovadas pela gerência de certificação da aeronave da ANAC).

  6.4.4.7. Além do informado nos itens anteriores, os operadores do GRF devem estar atentos
  aos

  tópicos abaixo.

  a. Para os pilotos que realizarão o pouso, sugere-se que o descanso a bordo ocorra na

  segunda metade da jornada, ou seja, mais próximo ao momento do pouso.

  Entretanto, dependendo das necessidades pessoais, horários de decolagem e pouso

  previstos e outras circunstâncias, os momentos apropriados poderão variar, de

  modo que o operador preveja que a própria tripulação tenha autonomia para

  rearranjá-los.

  b. Se possível, o número de etapas para tripulações compostas e de revezamento deve

  ser limitado a uma ou duas, de modo que uma operação desse tipo seja realizada

  apenas em jornadas com duração suficientemente longas para permitir descansar ou

  dormir.

  6.4.4.8. O que deve constar do MO.

  a. Se um operador optar por incorporar operações com tripulação composta ou de

  revezamento e a fim de obter um aumento na jornada de trabalho, os limites no MO

  não devem exceder os limites estabelecidos no Apêndice B do RBAC nº 117, para

  operadores sob esta aplicabilidade. Neste caso, devem ser observados os limitesData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  para tripulantes aclimatados (Tabelas B.2 e B.3) e para tripulantes em estado

  desconhecido de aclimatação (parágrafo B(e) do RBAC nº 117).

  b. Os procedimentos devem assegurar que o tempo mínimo de descanso do tripulante

  durante o voo cumpre o estabelecido nos parágrafos B(g)(3) e B(g)(4) do Apêndice

  B do RBAC nº 117. Estes tempos são apenas mínimos, devendo ser aumentados

  para manter ou restaurar o estado de alerta adequado. Como guia, estes mínimos

  assumem que a maior parte da jornada de trabalho é constituída pelo tempo de voo,

  sendo o tempo de descanso / sono disponível (fase de cruzeiro) totalmente utilizado

  e distribuído de forma razoavelmente uniforme entre os tripulantes. Portanto, os

  procedimentos no MO devem refletir essa meta de utilizar plenamente os períodos

  de voo disponíveis para obter descanso em voo. É por esse motivo que o número

  de etapas é limitado para uma operação tripulação com tripulação composta e de

  revezamento, garantindo assim que as jornadas contenham etapas mais longas que

  permitam tempo adequado para descanso / sono.

  c. Procedimentos para a designação de tripulantes para uma tripulação composta ou

  de revezamento devem prever que a tripulação que inicie e termine a jornada seja a

  mesma.

  Importante

  Por razões de segurança, esta é uma condição crítica. Se, por exemplo, uma

  emergência médica exigisse o desembarque de um tripulante durante a jornada de

  trabalho, para que o voo continuasse, todos os tripulantes deveriam ser substituídos

  por uma nova tripulação, iniciando uma nova jornada de trabalho.

  Considera-se que o gerenciamento de diferentes limites da jornada de trabalho e

  duração do tempo de serviço e de voo, bem como a alocação de descanso durante o

  voo, para cada tripulante é potencialmente muito difícil para uma tripulação e, em

  particular, para o comandante gerenciar com segurança. Dada a provável pressão

  para realizar o voo, ter um ou mais membros da tripulação com um nível de fadiga

  significativamente diferente poderia criar disparidades entre os tripulantes (por

  exemplo, na decisão sobre extensões de jornada).

  As extensões devem ser uma decisão que considere o nível de fadiga de cada tripulante

  de forma independente; no entanto, quando apenas um tripulante suportaria a

  extensão, os outros membros da equipe podem não apoiar a decisão de estender a

  jornada.

  Além disso, um mitigador de fadiga para uma tripulação é a suposição de que, se um

  tripulante está fatigado em um determinado grau, os demais provavelmente também o

  estão. Quando um membro da equipe identifica que está cansado, ele deve discutir /

  gerenciar tal ponto com seus colegas e / ou começar a monitorar o restante da

  tripulação mais de perto.

  Se uma tripulação inclui pessoas com jornadas de trabalho significativamente

  diferentes, entender quando cada um está fatigado torna-se muito mais difícil e menos

  provável de ser gerido de forma eficaz. Considera-se que esse nível adicional de

  complexidade deveria ser gerenciado de acordo com um SGRF.

  d. Para empregar tripulações compostas e de revezamento, o MO deve detalhar os

  procedimentos para tais tipos de tripulação, os quais devem incluir:

  i. a designação de um piloto responsável por tomar decisões de comando emData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  todos os momentos em que o piloto-em-comando (PIC) estiver utilizando

  descanso em voo;

  ii. um procedimento para um briefing abrangente antes dos tripulantes se

  revezarem durante o voo;

  iii. um meio de priorizar os requisitos de descanso a bordo, para que eles não

  tenham prioridade sobre a necessidade de otimizar os níveis de experiência

  da tripulação na cabine de comando para o gerenciamento de ameaças

  operacionais planejadas e não planejadas.

  iv. designação de um tripulante responsável por agendar o descanso da tripulação

  em voo e reavaliar os horários de descanso da tripulação (em caso de

  circunstâncias operacionais imprevistas, especialmente desvios em voo ou

  retorno de voo);

  v. gestão dos possíveis efeitos da inércia do sono no desempenho ao despertar

  do sono profundo; e

  vi. procedimentos que assegurem que outros membros da tripulação estejam

  cientes da necessidade de respeitar o requisito de repouso em voo, evitando

  interrompê-lo e reduzindo o ruído desnecessário que pode perturbar o sono

  dos tripulantes que estão no período de descanso a bordo.

  6.4.5. Atraso no horário de apresentação e cancelamento [seções 117.B(h) e 117.C(h)]

  6.4.5.1. Atraso na apresentação.

  a. As seções 117.B(h) e 117.C(h) contêm requisitos sobre atrasos no horário de

  apresentação do tripulante. Atrasar o horário de apresentação pode resultar em

  períodos prolongados de vigília que, se não forem adequadamente gerenciados,

  possuem o potencial de causar impacto no risco de fadiga. Se o operador, no período

  anterior ao início de uma jornada, tomar conhecimento de circunstâncias que levem

  a um atraso no horário de apresentação do tripulante escalado para essa jornada,

  então é razoável que o horário de apresentação do tripulante seja atrasado.

  b. De acordo com os limites contidos nos Apêndices B e C, o operador pode tomar a

  decisão de atrasar a jornada de trabalho caso ele consiga avisar o tripulante

  enquanto ele ainda não tiver deixado a acomodação para repouso, seja na base ou

  fora dela. O RBAC estipula os valores mínimos conforme abaixo, mas eles podem

  não ser suficientes, de forma que o MO deve refletir os períodos de antecipação

  reais para comunicação do atraso:

  i. pelo menos 2 horas ou mais antes do horário de apresentação, quando o

  tripulante está na base contratual; ou

  ii. pelo menos 1 hora ou mais antes do horário de apresentação para o serviço

  quando não estiver na base contratual.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo 1:

  Uma jornada está programada para se iniciar às 11:00 na base contratual do

  tripulante. Desta forma, caso haja algum atraso previsto no horário de apresentação,

  tal atraso deve ser comunicado ao tripulante antes das 09:00 (isto é, com 2 horas ou

  mais de antecedência), antes de o tripulante deixar o hotel.

  Exemplo 2:

  Uma jornada está programada para se iniciar às 11:00 fora da base contratual do

  tripulante. Desta forma, caso haja algum atraso previsto no horário de apresentação,

  tal atraso deve ser comunicado ao tripulante antes das 10:00 (isto é, com 1 horas ou

  mais de antecedência), antes de o tripulante deixar o hotel.

  c. Se um tripulante não for informado de um atraso de acordo com o item 6.4.5.1.b, a

  jornada desse tripulante deve ser considerada como iniciada em uma das seguintes

  opções:

  i. o horário de apresentação original; ou

  ii. o último horário de apresentação informado de acordo com o item 6.4.5.1.b

  acima.

  Exemplo 1:

  Uma jornada está programada para se iniciar às 11:00 na base contratual do

  tripulante. Um atraso de 5 horas foi comunicado ao tripulante às 10:00 (isto é, com

  apenas 1 hora de antecedência). Nesta situação, o horário da apresentação original

  se mantém, sendo a jornada considerada iniciada às 11:00.

  Exemplo 2:

  Uma jornada está programada para se iniciar às 11:00 fora da base contratual do

  tripulante. Um atraso de 5 horas foi comunicado ao tripulante às 10:30 (isto é, com

  apenas 30 minutos de antecedência). Nesta situação, o horário da apresentação

  original se mantém, sendo a jornada considerada iniciada às 11:00.

  d. Se uma jornada for atrasada e o tripulante informado antes do repouso anterior à

  referida jornada, consideram-se os limites de jornada normalmente aplicáveis do

  MO para esta jornada (tanto para tripulações simples, quanto aumentadas).

  Exemplo:

  Uma jornada está programada para se iniciar às 11:00 fora da base contratual do

  tripulante. Um atraso de 5 horas foi comunicado ao tripulante às 20:00 do dia

  anterior, imediatamente antes do término da jornada. Nesta situação, aplica-se a

  jornada que se iniciará às 16:00 (11:00 + 5 horas = 16:00), o limite máximo de

  jornada previsto para este horário.

  e. Dependendo da duração do atraso, pode haver um aumento no risco de fadiga que

  pode afetar a segurança de um voo após esse atraso. Os operadores devem ter

  procedimentos que atendam a essa situação e garantir que existam salvaguardas

  para mitigar qualquer aumento de risco.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  i. As provisões de atraso do horário de apresentação dividem-se em três

  possíveis situações:

  A. menos de 4 horas (sendo o valor a soma de um ou mais atrasos);

  B. 4 horas ou mais (sendo o valor a soma de um ou mais atrasos, podendo

  ultrapassar 10 horas);

  C. um único atraso de 10 horas ou mais.

  Exemplo 1:

  Uma jornada está programada para se iniciar às 11:00 na base contratual do

  tripulante. O início da jornada foi adiado para às 14:00 e novamente para às 16:00

  horas. Deste modo, o atraso total a ser computado será de 5 horas.

  Exemplo 2:

  Suponha que o tripulante já cumpriu o máximo de sobreavisos regulamentares

  previstos nos parágrafos 117.B(j)(3) ou 117.C(j)(3) (8 sobreavisos mensais, por

  exemplo) e que, após isto, ele tenha a sua apresentação atrasada em 5 horas. Como

  informado nos parágrafos 117.B(h)(5) ou 117.C(h)(5), o tempo de atraso será

  considerado como sendo sobreaviso, que ele cumpra ou não os requisitos de

  sobreaviso. Desta forma, o atraso de 5 horas não irá contar como 1 sobreaviso

  adicional ao máximo previsto (neste caso, não irá contar como o 9º sobreaviso do

  mês).

  ii. Para atrasos cuja soma seja menor do que 4 horas, a suposição é que o

  tripulante pode ser capaz de descansar; no entanto, é improvável que consiga

  voltar a dormir. O limite máximo de jornada que o tripulante não pode

  exceder será o menor dentre o determinado para o horário original de

  apresentação, o determinado para o novo horário de apresentação e o

  determinado pelos parágrafos 117.B(j)(4)(5)(6) ou 117.C(j)(4)(5)(6). O

  raciocínio por trás disso é que o tripulante não teve a oportunidade de

  organizar seu tempo de despertar para se adequar ao tempo de apresentação

  posterior e provavelmente permanecerá acordado durante o período do atraso.

  Em contraste, se o horário de apresentação com atraso resultar em um limite

  de jornada máximo mais baixo, isso se torna o limite máximo da jornada, pois

  significa que o atraso resultou em um horário de início para o qual a jornada

  máxima está começando a invadir o WOCL.

  Exemplo 1: atraso de 3 horas na apresentação do tripulante de uma tripulação

  simples, com a informação de atraso sendo feita de acordo com o item 6.4.5.1.b.

  A) Dados do atraso:

  1) Horário original de apresentação do tripulante: 12:00;

  2) Tripulante está fora da base contratual;

  3) Horário de aviso ao tripulante do novo horário de apresentação: 10:30 (o

  tripulante ainda não havia deixado o hotel);

  4) Novo horário de apresentação do tripulante: 15:00;

  5) Jornada contém apenas uma etapa.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  B) Determinação da jornada máxima conforme B(h)(7) ou C(h)(7) do RBAC nº 117:

  1) Jornada máxima baseada no horário de apresentação original (12:00): 12

  horas (conforme tabelas B.1 ou C.1);

  2) Jornada máxima baseada no novo horário de apresentação (15:00): 11 horas

  (conforme tabelas B.1 ou C.1);

  3) Duração do atraso: 15:00 - 12:00 = 3 horas;

  4) Jornada máxima determinada pelo parágrafo B(j)(4) ou C(j)(4) do RBAC nº

  117:'
