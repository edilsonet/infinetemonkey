title: 'e 117.61 do RBAC nº 117. Resumidamente, pode-se citar:'
text: '117.17 e 117.61 do RBAC nº 117. Resumidamente, pode-se citar:

  a. auxiliar na implementação do GRF;

  i. propor o quantitativo mínimo de integrantes do GAGEF, bem como definir

  eventuais substituições em cada classe de integrante;

  ii. definir os procedimentos internos, incluindo o procedimento de tomada de

  decisão;

  iii. propor a política de gestão de fadiga do operador aéreo;

  iv. propor as responsabilidades de cada um dos setores diretamente envolvidos

  no GRF;

  b. supervisionar a operação contínua dos processos do GRF;

  i. promover reuniões periódicas para discussão dos assuntos relacionados à

  fadiga;

  ii. planejar o cronograma anual de reuniões;

  iii. convocar consultores nas áreas relacionadas a demandas técnicas oriundas

  dos temas discutidos em reunião ou sempre que for necessária a manifestação

  de especialistas;

  iv. operacionalizar a coleta de dados que irão subsidiar as análises sobre osData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  eventos de segurança quanto à fadiga;

  v. propor ações de auditoria contínua para mensuração da efetividade do sistema

  adotado, bem como propor ações corretivas para contínua melhoria do

  sistema;

  vi. zelar pelo correto cumprimento dos requisitos relativos ao RBAC nº 117,

  propondo também ações corretivas em caso de desvios e violações neste

  cumprimento;

  vii. estabelecer os limites operacionais que serão objeto do GRF;

  viii. definir as ferramentas para análise e mensuração da fadiga de seus tripulantes,

  além da adoção de reportes, planilhas, programas de computador e/ou

  aplicativos móveis para auxiliar na mensuração;

  ix. desenvolver, implementar e monitorar processos para a identificação de riscos

  de fadiga;

  x. assegurar que uma avaliação de risco abrangente seja realizada para os riscos

  de fadiga;

  xi. desenvolver, implementar e monitorar controles e mitigações, conforme

  necessário, para gerenciar os riscos de fadiga identificados;

  xii. desenvolver, implementar e monitorar métricas eficazes de desempenho do

  GRF;

  xiii. garantir que os membros da tripulação e outros recebam resposta aos seus

  reportes de fadiga;

  xiv. comunicar riscos de fadiga e o desempenho do GRF para a gerência sênior;

  xv. cooperar com a ANAC em relação à auditoria do GRF;

  c. manter a documentação do GRF;

  i. desenvolver e manter a documentação do GRF;

  ii. propor relatórios de coleta de dados e de análise de risco, indicadores e fatores

  contribuintes;

  iii. propor a adoção de ferramentas de medição do nível de fadiga da tripulação

  envolvida na(s) operação(ões) objeto do GRF, propor ações de mitigação do

  risco de fadiga;

  d. ser responsável pelo treinamento do GRF.

  i. aprovar o cronograma de treinamento, os instrutores, os recursos cabíveis e

  tomar decisões relacionadas aos eventos de treinamento;

  ii. ser responsável pelo desenvolvimento, atualização e entrega de materiais de

  educação e treinamento do GRF (essas atividades podem ser terceirizadas,Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  inclusive para o setor de treinamento do operador, mas o GAGEF é

  responsável por garantir que eles atendem aos requisitos do GRF e são

  eficazes);

  iii. garantir que todo o pessoal relevante receba treinamento apropriados do GRF,

  e que os registros de treinamento sejam mantidos como parte da

  documentação do GRF.

  6.3.2.13. Pelo maior risco teórico nas seguintes situações, recomenda-se que o GAGEF acompanhe

  ativamente e de maneira rotineira:

  a. operações noturnas e na madrugada, especialmente a partir de duas na mesma

  semana de trabalho;

  b. jornadas interrompidas, especialmente se a interrupção for noturna ou de

  madrugada;

  c. mudanças de turno, especialmente se ocorrerem na mesma semana de trabalho (por

  exemplo, rotações irregulares ou no sentido anti-horário);

  d. utilização de descanso a bordo;

  e. jornadas finalizadas e iniciadas no mesmo dia (repouso diurno);

  f. jornadas diárias com 10 ou mais horas;

  g. jornadas semanais acumuladas com mais de 44 horas;

  h. casos de repouso reduzido.

  6.3.2.14. O GAGEF deve reunir-se, no mínimo, mensalmente durante o primeiro ano do GRF e

  sempre que grandes mudanças ocorrerem. As reuniões devem ser suficientemente longas

  e auxiliadas com recursos que permitam a melhor tomada de decisão. Sempre que

  necessário, reuniões em intervalos mais curtos (para acompanhamento de uma situação

  específica, por exemplo) devem ser planejadas, semanal, quinzenalmente ou sempre que

  uma dada operação ocorrer. Em todos os casos, deve ser assegurada a participação do

  SNA.

  6.3.2.15. As reuniões do GAGEF devem ser registradas em ata própria de reunião, as quais
  devem

  incluir eventuais divergências sobre as decisões tomadas. Dentro das possibilidades de

  cada GAGEF, deveria haver consenso das decisões tomadas por aquele grupo.

  6.3.2.16. Os membros do GAGEF devem ter conhecimento profundo do RBAC nº 117 e desta IS,

  bem como da cultura do país e do ambiente operacional do seu operador. Também deve

  conhecer a cultura profissional dos seus funcionários (subculturas), assim como a cultura

  e clima organizacionais, de forma a aproximar conhecimentos e experiência da área de

  CRM e fatores humanos às decisões no âmbito do GRF.

  6.3.3. Transição entre apêndices do RBAC nº 117 [117.17 e 117.61(c)(5)]

  6.3.3.1. Geral.

  a. Dependendo das características operacionais, os operadores podem precisar operarData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  sob mais de um apêndice do RBAC nº 117 e, deste modo, precisam fazer a transição

  de seus tripulantes entre esses apêndices.

  b. Operar sob múltiplos Apêndices do RBAC nº 117 significa uma ou ambas das

  opções abaixo:

  i. combinando mais de um Apêndice dentro de uma única jornada de trabalho;

  e/ou

  ii. mudando de um Apêndice para outro em jornadas de trabalho consecutivas.

  c. A transição de tripulantes entre diferentes apêndices pode levar a inconsistências

  nos requisitos de jornada de trabalho / tempo de voo / reserva / sobreaviso / repouso.

  d. Os procedimentos de transição entre apêndices são necessários para garantir que o

  tripulante esteja sempre em conformidade ao fazer essas transições.

  e. Adicionalmente, deve haver uma avaliação dos riscos de fadiga resultantes da

  transição entre apêndices no contexto operacional e no ambiente operacional

  específicos do operador. O operador deve abordar quaisquer riscos identificados

  com procedimentos e/ou ajuste de seus limites.

  f. antes de mudar de um Apêndice do RBAC nº 117 para outro, operador deve

  identificar os perigos associados à transição de seus tripulantes entre apêndices e

  gerenciar os riscos por meio da aplicação de limites e procedimentos de transição,

  de acordo com a seção 117.17 da RBAC nº 117. Isso é feito para garantir que as

  transições não resultem em um aumento no risco à segurança operacional.

  6.3.3.2. Procedimentos.

  a. Operar sob múltiplos apêndices requer um processo de duas etapas. O primeiro

  passo é garantir que o tripulante esteja dentro dos limites do novo apêndice antes

  da transição. Então, se o tripulante estiver operando para mais de um apêndice em

  uma jornada de trabalho, o segundo passo é determinar os limites que serão

  aplicados à jornada de trabalho proposta.

  b. No RBAC nº 117, as seguintes seções devem ser consideradas no desenvolvimento

  de procedimentos para operação em múltiplos apêndices; e, em particular,

  gerenciando o risco de fadiga por meio de transições de um apêndice para outro:

  i. seção 117.11;

  ii. seção 117.17; e

  iii. parágrafo 117.61(c)(5).

  c. A Seção 117.11 do RBAC nº 117 exige que:

  i. cada operador deve cumprir os limites e requisitos mencionados nos

  apêndices aplicáveis;

  ii. cada tripulante, empregado pelo operador, deve cumprir os limites dos

  apêndices que o operador optou por cumprir.Data de emissão: 31 de janeiro de 2020 IS nº
  117-003

  Revisão B

  d. em algumas circunstâncias, o atendimento de todos os requisitos de um apêndice

  antes de operar sob esse apêndice poderia ser potencialmente mais restritivo do que

  o necessário para gerenciar o risco potencial de fadiga associado à transição.

  e. os requisitos para combinar vários apêndices dentro de uma única jornada de

  trabalho são abordados na seção 117.17 do RBAC nº 117 e os operadores devem

  ter procedimentos que atendam a esses requisitos.

  6.3.3.3. Operando sob dois ou mais apêndices em uma única jornada de trabalho.

  a. Se o operador pretende realizar operações em que dois ou mais apêndices se

  aplicam a uma única jornada de trabalho, o seu manual deve conter procedimentos

  que garantam que:

  i. a jornada de trabalho máxima é o máximo que se aplica ao tipo de operação

  que está sendo conduzida no momento (com base na suposição de que toda a

  jornada de trabalho foi conduzida sob esse apêndice). A jornada de trabalho

  máxima para a atividade que está sendo realizada a qualquer momento é

  sempre baseada no horário de início jornada completa, não no momento em

  que o tripulante mudou para essa atividade;

  ii. o tempo máximo de voo é o tempo voo máximo contido no apêndice sob o

  qual a operação está sendo conduzida naquele momento específico (com base

  na suposição de que toda a jornada de trabalho foi conduzida sob esse

  apêndice). Deve basear-se no horário de início original da jornada de trabalho

  e não no horário de início das operações em cada apêndice;

  iii. o tempo de repouso que deve ser aplicado após a jornada de trabalho é o maior

  dos tempos mínimos de repouso calculados sob cada Apêndice.

  iv. vide os dois exemplos abaixo que ilustram as regras acima.Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

  Exemplo 1:

  Suponha que o operador escale o tripulante para uma jornada com duas etapas, como

  abaixo mostrado:

  1) Etapa 1: transporte doméstico regular de passageiros (RBAC nº 121 + RBAC nº

  117 Apêndice C);

  2) Etapa 2: translado de aeronave (RBHA 91 + RBAC nº 117 Apêndice A (Lei nº

  13.475/17))

  Então:

  1) Antes do tripulante transitar para a etapa 2, ele deve ser capaz de conduzir a

  etapa 1 dentro do limite máximo de jornada constante do seu manual de

  operações para transporte doméstico regular de passageiros;

  2) O horário de referência de início da etapa 2 é o horário de início da etapa 1,

  como se o tripulante estivesse conduzido toda a etapa 2 desde o início (consulte

  a Figura 3).

  Note que, de acordo com a seção 117.17 do RBAC nº 117:

  1) A jornada máxima será a da etapa 2: 9h [Parágrafo 117.17(a)(1)]

  2) O tempo de voo máximo será o da etapa 2: 8h [Parágrafo 117.17(a)(2)]

  3) O repouso mínimo será o da etapa 2: 12h [Parágrafo 117.17(d)]

  Figura 4: Operando sob dois apêndices em uma única jornada de trabalho - determinação

  da jornada e do tempo de voo máximos e do repouso mínimoData de emissão: 31 de janeiro de
  2020 IS nº 117-003

  Revisão B

  Exemplo 2:

  Suponha que o operador escale o tripulante para uma jornada com duas etapas, como

  abaixo mostrado:

  4) Etapa 1: translado de aeronave [RBHA 91 + RBAC nº 117 Apêndice A (Lei nº

  13.475/17)];

  5) Etapa 2: transporte doméstico regular de passageiros (RBAC nº 121 + RBAC nº

  117 Apêndice C);

  Considerando as mesmas regras do exemplo anterior:

  1) A jornada máxima será a da etapa 2: 10h [Parágrafo 117.17(a)(1)]

  2) O tempo de voo máximo será o da etapa 2: 8h [Parágrafo 117.17(a)(2)]

  3) O repouso mínimo será o da etapa 2: 12h [Parágrafo 117.17(d)]

  Figura 5: Operando sob dois apêndices em uma única jornada de trabalho - determinação

  da jornada e do tempo de voo máximos e do repouso mínimo

  6.3.4. Identificação de perigos [117.61(c)(2)]

  6.3.4.1. Tal como ocorre com toda a gestão de riscos, os riscos relacionados à fadiga humana

  degradando o estado de alerta devem ser identificados, avaliados e gerenciados (por

  exemplo, colocando em prática controles e estratégias de mitigação).

  6.3.4.2. Os perigos podem combinar-se de maneira imprevisível, de modo que mesmo perigos

  aparentemente triviais podem resultar em estados indesejáveis, que podem se combinar

  com outros perigos para resultar em acidentes ou incidentes.

  6.3.4.3. Os métodos para identificação de perigos devem ser proporcionais à proposta dos
  limites

  nos apêndices aplicáveis. Se os limites propostos no MO estiverem próximos aos limites

  dos Apêndices B ou C do RBAC nº 117, o operador deve ter processos de identificação

  de riscos reativos, proativos e até mesmo preditivos para garantir que o risco de fadiga

  seja gerenciado adequadamente.

  6.3.4.4. Os perigos podem ser identificados a partir de uma variedade de fontes, incluindo,
  mas

  não se limitando a:Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  a. workshops de identificação de perigos (por exemplo, brainstorming usando pessoal

  operacional experiente);

  b. avaliações de risco (avaliações de risco formais podem revelar novos perigos);

  c. desenvolvimento de cenários de risco;

  d. registro de riscos (por exemplo, por meio de sistemas eletrônicos);

  e. análise de tendências;

  f. reporte de perigos;

  g. reportes de fadiga (Anexo A) e FAPA (Apêndice D);

  h. feedback do treinamento;

  i. pesquisas de segurança e auditorias de segurança de supervisão operacional;

  j. monitoramento de operações normais;

  k. utilização de modelos biomatemáticos devidamente validados;

  l. investigação do estado sobre acidentes e incidentes graves; e

  m. sistemas de troca de informações (operadores similares, reguladores etc.).

  6.3.4.5. Com o passar do tempo, o banco de dados de perigos relatados permitirá que o operador:

  a. identifique situações de risco de fadiga que precisam de atenção especial; e

  b. conduza análises de tendências que podem fornecer a base para melhorar a

  identificação de perigos.

  6.3.4.6. O operador deve inserir no seu MO políticas e procedimentos para lidar com as

  informações fornecidas pelos tripulantes que possam afetar o seu estado de alerta no

  trabalho. Exemplos de tais fatores constam na Seção 7.2 desta IS.

  6.3.4.7. Perigos como estes deveriam ser considerados:

  a. ao determinar as limitações de voo e tempo de serviço; e/ou

  b. à melhoria contínua das políticas e práticas estabelecidas pelo operador.

  6.3.4.8. Os modelos biomatemáticos podem auxiliar os operadores a fornecer previsões de
  fadiga

  humana e/ou de oportunidade de sono que podem ser utilizados como um componente no

  gerenciamento da fadiga. Um dos principais papéis de muitos modelos é fornecer

  ferramentas de auxílio na confecção de escalas de tripulantes, destinadas a fornecer uma

  validação inicial para escalas recém-desenvolvidas ou modificadas.

  6.3.4.9. Embora não seja um componente necessário, os modelos biomatemáticos podem

  incorporar aspectos da ciência da fadiga nas práticas de escala de tripulantes, fornecendo

  previsões de níveis de risco de fadiga, níveis de desempenho e/ou tempos/oportunidades

  ideais de sono. Entretanto, modelos biomatemáticos têm limitações que devem serData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  consideradas. Algumas limitações incluem:

  a. prever probabilidades de risco para uma média populacional em vez de níveis de

  fadiga de um indivíduo específico;

  b. não levar em conta o impacto da carga de trabalho ou fatores de estresse pessoais e

  relacionados ao trabalho que podem afetar os níveis de fadiga;

  c. descrição incompleta de todos os fatores fisiológicos da fadiga; e

  d. testes limitados (validação) com dados específicos da aviação.

  6.3.4.10. Cada modelo tem diferentes pontos fortes e limitações. Ao usar um modelo

  biomatemático, a ANAC sugere que o operador adote uma abordagem cautelosa, que leve

  em conta as limitações e a validade do modelo naquele contexto operacional específico

  (ou seja, se foi validado a partir de dados de fadiga de operações semelhantes àquelas em

  que o operador está interessado). Ao tomar decisões sobre a elaboração da escala, as

  previsões do modelo não devem ser usadas sem referência à experiência operacional ou

  dados de reportes de fadiga já conhecidos.

  6.3.4.11. É importante estar ciente de que um regime de gerenciamento de fadiga deve ser
  projetado

  como um sistema abrangente e multicamadas, no qual modelos biomatemáticos fornecem

  um papel de suporte opcional.

  6.3.4.12. Quando disponível, um operador deve fazer uso de seu SGSO para este processo.
  A

  Tabela 2 desta IS fornece exemplos adicionais dos tipos de perigos que podem precisar

  ser abordados.

  6.3.4.13. Os Apêndices B e C do RBAC nº 117 contêm requisitos para gerenciar o risco de
  fadiga

  devido à perda de sono, tempo acordado, tempo de trabalho e os efeitos do horário do dia.

  No entanto, os diferentes ambientes operacionais, bem como diferentes cargas de

  trabalho, podem aumentar ou diminuir o acúmulo de fadiga. Tais Apêndices fornecem

  considerações mínimas sobre essas influências, como por exemplo, o número máximo de

  etapas permitidos para uma jornada.

  6.3.4.14. Os operadores devem considerar suas próprias circunstâncias usando experiências

  anteriores da empresa ou discussões com outros operadores e grupos, para que limitações

  referentes a essas medidas (diferentes ambientes operacionais e cargas de trabalho etc.)

  possam ser incluídas no seu manual.

  6.3.4.15. A tabela a seguir apresenta alguns exemplos de uma abordagem razoável para a

  identificação de perigos para um operador sem um processo de avaliação de risco

  estabelecido. Ressalta-se que os tempos jornada e de voo não são os únicos meios

  possíveis de reduzir riscos associados aos perigos identificados.

  6.3.4.16. Os exemplos de perigos de fadiga da tabela abaixo podem existir para alguns operadores.

  Esta lista não é específica para nenhum tipo de operação em particular, mas destina-se a

  prover uma orientação mínima sobre a identificação de riscos de fadiga e respectivos

  ajustes das limitações e considerações de políticas e procedimentos a serem adotados para

  um operador do GRF. Adicionalmente, o operador pode utilizar o seu SGSO aprovado

  para avaliar os perigos relativos à fadiga relacionados a fatores não considerados nos

  Apêndices B e C do RBAC nº 117, estabelecendo limites adicionais apropriados.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

