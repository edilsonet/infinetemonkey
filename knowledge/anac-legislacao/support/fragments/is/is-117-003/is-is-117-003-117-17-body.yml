  6.3.4.17. Sobre o assunto, recomenda-se o estudo da IS nº 119-002 da ANAC.

  6.3.5. Reporte de ocorrência de fadiga [117.61(c)(3) e 117.61(c)(4)]

  6.3.5.1. A disposição dos tripulantes de reportar a ocorrência de fadiga refletirá seu nível
  de

  compreensão de seus papéis e responsabilidades em relação ao gerenciamento do risco

  de fadiga e sua confiança de que o objetivo da coleta de dados é melhorar a segurança.

  Um sistema eficaz de reporte de fadiga requer uma cultura de relato aberta e justa. O

  sistema de reporte deve:

  a. oferecer formulários fáceis de acessar, preencher e enviar;

  b. ter regras claras sobre a confidencialidade das informações comunicadas;

  c. ter regras claras sobre a proteção de reportes voluntários;

  d. incluir análises regulares dos reportes;

  e. fornecer feedback regular aos tripulantes sobre decisões ou ações tomadas com base

  nos reportes e lições aprendidas (recomenda-se que o MO contenha um prazo limite

  para que a solução do reporte seja informada ao tripulante).

  6.3.5.2. Um reporte de fadiga, em papel ou eletrônico (vide Anexo A), deve incluir informações

  sobre:

  a. sono recente;

  b. hora do dia em que o evento ocorreu;Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  c. histórico de atividades desempenhadas no trabalho (o mínimo deveria ser dos

  últimos três dias);

  d. medição de diferentes aspectos do comprometimento relacionado à fadiga (por

  exemplo, escalas de alerta ou de sonolência validadas).

  6.3.5.3. O reporte também deve fornecer espaço para comentários escritos, para que a pessoa
  que

  está relatando possa explicar o contexto do evento e dar sua opinião sobre o motivo pelo

  qual isso aconteceu.

  6.3.5.4. Todos os níveis da organização devem encorajar os membros da tripulação a preencher
  e

  enviar reportes de ocorrência de fadiga nos seguintes casos:

  a. por meio do sistema de notificação voluntária, quando uma jornada não tenha

  começado ou não esteja concluída, devido à fadiga (total ou parcial). Isso inclui

  quando a jornada é concluída, mas somente após alguma ação de mitigação. Por

  exemplo:

  i. a adição de um membro extra da tripulação;

  ii. a redução da carga de trabalho da jornada;

  iii. o atraso da hora de apresentação;

  iv. a criação de oportunidade para um cochilo em solo;

  v. o aumento da supervisão / monitoramento;

  b. por meio do sistema de notificação voluntária após uma jornada, se o tripulante

  acreditar (após refletir sobre o assunto) que o nível de fadiga a que ele ou outros

  membros da tripulação estiveram expostos significou que não haviam sido mantidas

  margens de segurança suficientes durante o(s) voo(s);

  c. por meio do sistema de notificação voluntária, quando a tripulação percebe algo em

  seu ambiente operacional que pode causar impacto em seus membros, ou em outros

  membros da tripulação, de tal forma que as margens de segurança poderiam ser

  reduzidas a níveis insatisfatórios;

  d. por meio do sistema de comunicação de ocorrências, quando ocorreu um incidente

  ou evento onde a fadiga pode, ou não, ter contribuído para o fator de segurança.

  Para permitir isso, é preferível que haja um reporte de fadiga ou um aviso sobre o

  mecanismo de reporte de ocorrências do operador. Nestes casos, é aconselhável

  obter um histórico de sono de pelo menos 72 horas.

  6.3.5.5. O operador deve tratar os reportes de fadiga de forma proporcional ao seu conteúdo.

  6.3.6. Definição de limitações considerando os perigos [117.61(c)(3)]

  6.3.6.1. O operador deve estar ciente de que os limites constantes dos Apêndices B e C são
  limites

  prescritivos que necessitam de monitoramento constante por serem mais amplos que os

  estabelecidos pela Lei nº 13.475/17. Entretanto, limitações prescritivas são os mínimos

  esperados, e podem não ser suficientes para gerenciar adequadamente os riscos. Se

  desejar, o operador pode estabelecer em seu MO limites máximos menores e limitesData de
  emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  mínimos maiores do que os do RBAC, e operar com base nesses.

  6.3.6.2. Assim, ao determinar os limites de tempo de voo e serviço, os operadores precisam

  considerar as necessidades específicas de seu ambiente operacional e alterar os limites

  constantes de seu MO de forma adequada. Adicionalmente é importante que os

  operadores considerem que seu ambiente provavelmente mudará com o tempo.

  Consequentemente, quaisquer alterações precisam ser adequadamente avaliadas quanto

  ao risco. O operador também precisa reavaliar, atualizar e modificar continuamente os

  limites de jornada de trabalho e de tempo de voo para garantir a segurança das operações

  no momento corrente.

  6.3.6.3. Os operadores devem considerar as consequências de mudanças organizacionais ou

  operacionais na fadiga e no desempenho da tripulação. Caso surjam problemas

  relacionados à fadiga associados a mudanças de operações (por exemplo, rotas

  diferentes); ou a introdução de novas operações, os operadores devem considerar mais

  mitigações para gerenciar a fadiga e o desempenho da tripulação. Para avaliar o risco de

  qualquer mudança, deve ser conduzida uma ampla avaliação de risco, o que inclui

  observar a probabilidade e as consequências dos riscos de fadiga associados a essa

  mudança.

  6.3.6.4. Os relatórios de avaliação de riscos serão requeridos pela ANAC durante as atividades
  de

  vigilância, para demonstrar que as mudanças foram devidamente consideradas.

  6.3.6.5. Os limites que são determinados sob esta obrigação tornam-se novos limites

  “prescritivos” para o operador. Isto significa que qualquer ultrapassagem destes limites

  deve estar de acordo com os requisitos de extensão e apenas em circunstâncias

  operacionais imprevistas.

  6.3.6.6. Todos os tipos de treinamento (em aeronave, sala de aula ou à distância) podem
  afetar o

  estado de alerta dos tripulantes e seu desempenho operacional subsequente. Do ponto de

  vista da carga de trabalho, também é possível que monitorar ou treinar outro tripulante

  possa ser mais fatigante do que trabalhar em operações regulares. É altamente

  recomendável que os operadores façam uma redução apropriada dos limites máximos de

  jornada de trabalho quando esta incluir um período de treinamento.

  6.3.6.7. As sessões de treinamento em um simulador devem ser incluídos nas jornadas de trabalho.

  Ao planejar qualquer treinamento em simulador, o impacto do nível de fadiga da

  tripulação na qualidade do treinamento deve ser considerado e gerenciado.

  6.3.6.8. Trabalhos administrativos ou operacionais dentro e fora do escritório também devem
  ser

  sempre considerados na contagem total da jornada de trabalho. Mesmo um trabalho

  parcial em escritório, ou à distância (virtual), por gerar esforço cognitivo e depender
  de

  um estado de vigília atento, deve ser levado em consideração quando do planejamento

  das jornadas e tempos de voo, especialmente quando etapas de voo são combinadas com

  trabalhos em solo na mesma jornada.

  6.3.6.9. Os operadores não devem tirar proveito de um tripulante envolvido em atividades

  voluntárias antes de uma jornada que, de outra forma, seriam consideradas atividades

  requeridas. O operador não deve programar a jornada de trabalho de tal maneira que haja

  tão pouco tempo disponível antes do voo que o horário de início do voo só seja atingido

  se o tripulante realizar as atividades necessárias antes do início da jornada de trabalho.

  Neste caso, as atividades não podem mais ser consideradas voluntárias.Data de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo 1:

  • Não garantir tempo suficiente na jornada de trabalho para realizar atividades como

  planejamento de voo, cálculo de peso e balanceamento etc. porque, em outras

  ocasiões, o tripulante já realizou essas tarefas voluntariamente antes da jornada de

  trabalho ser iniciado.

  Exemplo 2:

  • Retirar o tripulante do seu local de repouso de forma que ele chegue ao local da

  apresentação uma ou duas horas antes do início da jornada e considerar apenas 30

  minutos deste tempo para inclusão na jornada.

  6.3.6.10. Na definição das limitações, os reportes de fadiga preenchidos pelos tripulantes
  devem

  ser examinados com especial atenção. Mesmo taxas baixas sobre determinado aspecto

  não devem ser desconsideradas ou entendidas de antemão como “problema individual”

  sem devida análise da parte técnica (GAGEF).

  6.3.7. Melhoria contínua de políticas e procedimentos [117.61(c)(4)]

  6.3.7.1. Os operadores precisam monitorar e avaliar a eficácia de seus controles de gerenciamento

  de fadiga (como políticas e procedimentos). Quando os controles são considerados

  inadequados ou ineficazes, o operador deve abordar isso como parte de seus requisitos de

  melhoria contínua.

  6.3.7.2. Políticas e procedimentos a serem considerados incluem:

  a. elaboração de escalas de voo;

  b. condições de acomodação fora de base;

  c. procedimentos referentes a tripulações compostas e de revezamento;

  d. programas de treinamento;

  e. uso de ferramentas de prontidão e vigilância.

  Exemplo:

  Um operador, que inicie suas operações principalmente durante o final da madrugada

  e início da manhã (digamos, entre 05:00 e 07:00), deve levar em conta essa

  necessidade operacional ao elaborar suas políticas e procedimentos. Neste caso,

  deveria existir um procedimento para, a cada dia, atrasar em uma hora o horário de

  apresentação do tripulante cujo despertar infringe o seu período da madrugada, de

  modo a possibilitar a recuperação da qualidade de sono à medida que a semana

  progrida (exemplo, programar o primeiro dia para às 05:00, o segundo para às 06:00,

  o terceiro para às 08:00 ou mais tarde, pois não seria possível antes devido às duas

  madrugadas anteriores).

  6.3.7.3. As políticas e procedimentos de um operador devem ser reavaliadas quanto à adequação

  quando houver ajustes das limitações de jornada de trabalho e/ou de tempo de voo.

  6.3.8. Indicadores de desempenho e sistema de coleta de informações e dados de um GRF

  [117.61(c)(2) e 117.61(c)(4)]Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  6.3.8.1. Introdução.

  a. Os indicadores de desempenho, bem como o sistema de coleta de informações e

  dados relativos à adoção do GRF, devem levar em conta os seguintes aspectos:

  i. Propósito - um operador aéreo deve reunir dados e informações suficientes

  para estar seguro de que é capaz de identificar e tratar as potenciais ameaças

  da fadiga e seus riscos associados nas suas operações. É preciso ficar claro

  para o operador que fatores operacionais podem produzir maior ou menor

  fadiga sobre suas tripulações;

  ii. Prioridade - uma vez que a incapacidade decorrente de fadiga afeta múltiplas

  habilidades e possui diversas causas, não existe uma única medição que dê

  conta de descrever completamente os níveis de fadiga ou fatores causadores

  de fadiga em uma dada tripulação. Para decidir que dados colher, o operador

  deve levar em consideração aquelas operações em que é esperado um elevado

  nível de risco de fadiga. Nelas, os recursos devem estar direcionados para a

  coleta de dados significativos para a operação; e

  iii. Eficiência - deve existir um equilíbrio entre a coleta de dados em quantidade

  suficiente para o operador aéreo estar seguro acerca de suas decisões, ações,

  e demandas adicionais e os respectivos custos envolvidos nesta coleta e

  análise. Os recursos, sempre limitados, devem ser otimizados para oferecer

  uma correta identificação das ameaças e riscos associados à fadiga e onde os

  controles e mitigações devem ser melhor aplicados.

  b. O Apêndice E e o Apêndice F desta IS apresentam o sistema de coleta de

  informações e dados, bem como os indicadores de desempenho recomendados para

  a implantação e gerenciamento de um GRF.

  c. A ANAC pode, a qualquer momento, requisitar um relatório dos indicadores do

  GRF.

  6.3.8.2. Forma de Apresentação.

  a. O Anexo B desta IS oferece um exemplo de relatório de apresentação dos dados e

  indicadores coletados/produzidos a intervalos definidos conforme esta IS.

  b. Qualquer relatório produzido pelo GAGEF deveria vir assinado pelos membros do

  GAGEF. Deve ainda ser apresentado como anexo a um FOP 107, de maneira que

  ele seja objeto de análise por parte da SPO/ANAC, quando for solicitado.

  6.3.8.3. Uso proposto para os indicadores.

  a. Os indicadores apresentados pelos operadores aéreos devem, tão logo a

  sistematização da coleta permita, ser acompanhados de análises de tendência, de

  forma a oferecer subsídio ao GAGEF para o monitoramento das operações sob um

  GRF e, por extensão, para acompanhamento por parte da ANAC.

  b. Os indicadores de desempenho propostos e adotados visam avaliar se as estratégias

  de mitigação aprovadas estão correspondendo à redução do risco desejada. Esta

  avaliação dos indicadores deve ser feita a intervalos regulares ou sempre que o

  GAGEF observar que os riscos não estão sendo satisfatoriamente mitigados. AData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  análise dos dados listados no Apêndice E desta IS deve servir de parâmetro mínimo

  para a eventual revisão das ações mitigatórias.

  c. Estas análises devem compor os relatórios periódicos que o GAGEF deve produzir

  e disponibilizar à ANAC, conforme periodicidade estabelecida entre o operador

  aéreo e a ANAC ou, excepcionalmente, quando as circunstâncias da operação sob

  GRF exigirem.

  6.3.9. Determinação da aclimatação [117.5 e 117.B(e)]

  6.3.9.1. Estar aclimatado, ou seja, adaptado a um local, é estar em um estado que pode ser
  alterado

  quando o deslocamento é muito rápido para um novo local após cruzamento de fusos. Até

  que o tripulante esteja totalmente adaptado ao novo local, um estado de transição ocorre,

  caracterizando o estado desconhecido de aclimatação. A diferença entre estar aclimatado

  ou em estado desconhecido de aclimatação, para o RBAC nº 117, impacta a duração

  máxima da jornada, o cálculo do repouso após a jornada, e o momento e o período

  necessários para o completo ajuste do corpo dependendo da quantidade de fusos cruzados.

  6.3.9.2. A seção 117.5 utiliza o conceito de fusos horários para realizar os cálculos de
  aclimatação.

  É importante ressaltar que o fuso horário a ser utilizado é aquele oficial do país (pode

  haver mais de um fuso oficial por país). Por exemplo:

  a. Paris / França: +1

  b. Buenos Aires / Argentina: -3

  c. Caracas / Venezuela: -2,5

  d. Cidade do México / México: -6

  e. Madri / Espanha: +1

  6.3.9.3. O parágrafo 117.5(c) do RBAC nº 117 informa que no “início de uma jornada ou de
  um

  período de repouso em um novo local que difira em três fusos ou mais do local original,

  o tripulante é considerado aclimatado ao local original se a jornada ou o repouso no novo

  local se iniciar em menos de 36 horas após o início da jornada no local original”. Deste

  modo, pode-se observar que existem duas hipóteses para que um tripulante entre em um

  estado desconhecido de aclimatação:

  a. o tripulante continua aclimatado ao local original se ele inicia uma jornada em um

  novo local que difira em três fusos ou mais do local original, em menos de 36 horas

  após o início da jornada no local original; ou

  b. o tripulante continua aclimatado ao local original se ele inicia um repouso em um

  novo local que difira em três fusos ou mais do local original, em menos de 36 horas

  após o início da jornada no local original.

  6.3.9.4. O parágrafo 117.5(d) do RBAC nº 117 informa que no “início de uma jornada ou de
  um

  período de repouso em um novo local que difira em três fusos ou mais do local original,

  o tripulante é considerado em estado desconhecido de aclimatação se a jornada ou o

  repouso no novo local se iniciar 36 horas ou mais após o tripulante ter iniciado a jornada

  no local original, desde que não haja enquadramento no período de adaptação, conforme

  parágrafo (e) desta seção”. Deste modo, pode-se observar que existem duas hipóteses paraData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  que um tripulante entre em um estado desconhecido de aclimatação:

  a. o tripulante entra em um estado desconhecido de aclimatação se ele inicia uma

  jornada em um novo local que difira em três fusos ou mais do local original, em 36

  horas ou mais após o início da jornada no local original; ou

  b. o tripulante entra em um estado desconhecido de aclimatação se ele inicia um

  repouso em um novo local que difira em três fusos ou mais do local original, em 36

  horas ou mais após o início da jornada no local original.

  c. note ainda que:

  i. no início do repouso, o tripulante pode (ou não) estar ainda aclimatado ao

  local original, isso importa para o cálculo do repouso após a jornada; e

  ii. no início da jornada seguinte, o tripulante pode (ou não) estar ainda

  aclimatado ao local original, isso importa para o cálculo da duração da

  jornada.

  Exemplo 1:

  O tripulante iniciou uma jornada em Guarulhos, local original onde ele está

  aclimatado, às 20:00, com destino a Paris. A duração da jornada é de 13 horas. Neste

  local o tripulante inicia um repouso de 27 horas, quando então assume a jornada de

  retorno.

  • No início do repouso em Paris, somente 13 horas haviam se passado desde o início

  da jornada em Guarulhos. Deste modo, o tripulante continua aclimatado à

  Guarulhos, e o cálculo do repouso deve ser feito considerando-o, portanto, como

  “aclimatado”.

  • No início da jornada de retorno em Paris, 13 horas + 27 horas = 40 horas haviam

  se passado desde o início da jornada em Guarulhos. Deste modo, o tripulante fará

  a jornada de retorno em um estado desconhecido de aclimatação.

  Exemplo 2:

  O tripulante iniciou uma jornada de 6 horas em Paris com destino a Telavive. No

  momento do início da jornada, já se passaram 31 horas desde o início da jornada em

  Guarulhos, local original onde ele está aclimatado.

  • No início da jornada em Paris, somente 31 horas haviam se passado desde o início

  da jornada em Guarulhos. Deste modo, o tripulante fará a jornada Paris - Telavive

  aclimatado à Guarulhos.

  • No início do repouso em Telavive, 31 horas + 6 horas = 37 horas haviam se passado

  desde o início da jornada em Guarulhos. Deste modo, o tripulante iniciará o seu

  repouso em um estado desconhecido de aclimatação, e o cálculo de sua duração

  deve ser feito considerando-o, portanto, como “em estado desconhecido de

  aclimatação”.

  6.3.9.5. A responsabilidade de gerenciar os efeitos das mudanças de três ou mais fusos horários
  e

  de aclimatação deve ser compartilhada entre o operador e o tripulante.

  a. Conforme o RBAC nº 117, antes de completar 36 horas a partir do deslocamento

  do local de origem, considera-se que o tripulante ainda esteja aclimatado (adaptado)Data
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  ao local de origem; entretanto, este valor é uma referência que deve ser

  acompanhada levando-se em conta os reportes dos tripulantes. Neste sentido, o

  operador deve estimular e valorizar os relatos dos tripulantes no manejo das

  operações transmeridionais.

  b. A transição entre adaptação no local original e a adaptação em outro local de

  diferente fuso gera um estado em que não se conhece a qual local o tripulante está

  aclimatado. Este período caracteriza o estado desconhecido de aclimatação.

  c. Iniciar uma jornada em estado desconhecido de aclimatação requer especial

  atenção, pois o tripulante não está plenamente adaptado a nenhum local, podendo

  estar sofrendo efeitos da mudança de fusos e com desempenho reduzido.

  6.3.9.6. O operador deve fornecer treinamento de fadiga adequado, bem como ferramentas que
  os

  tripulantes possam utilizar para avaliar seu próprio estado de alerta e conhecer

  contramedidas. Estas ferramentas podem ser a exemplificada nesta IS (FAPA), outra já

  existente ou uma nova e customizada desenvolvida pelo próprio operador ou, ainda, uma

  combinação. Mas, principalmente, o operador deve fornecer as condições para que o

  repouso seja suficiente e de qualidade, informando a tarefa a ser desempenhada com a

  maior antecedência possível. O operador não pode exigir que um tripulante inicie uma

  jornada quando o próprio se julgar inapto para cumpri-la.

  6.3.9.7. O tripulante, por sua vez, tem a obrigação de aplicar este treinamento à sua situação
  ao

  decidir sobre sua aptidão para o trabalho, bem como fazer uso responsável de horários

  livres, preservando a oportunidade de sono e favorecendo o sono de qualidade. Os

  tripulantes devem reportar ao seu operador quando se sentirem inaptos para o trabalho

  depois de cruzar fusos horários.

  6.3.9.8. O operador deve usar reportes para avaliar se suas limitações e políticas de fadiga
  são

  adequadas. Embora as limitações e políticas aplicáveis possam estar de acordo com o

  garantir, na medida do possível, que os tripulantes estejam aptos para o trabalho, inclusive

  estabelecendo limitações mais restritivas que o regulamento em sua política.

  6.3.9.9. Em um estado desconhecido de aclimatação, um tripulante não pode realizar mais
  de 2

  jornadas consecutivas. Um período de adaptação deve ocorrer antes que o tripulante possa

  realizar outra jornada de trabalho. Se um tripulante entrar em estado desconhecido de

  aclimatação fora do Brasil e retornar ao país neste estado, isto já conta como uma jornada

  e ele só poderá cumprir mais uma jornada de trabalho, quando fica obrigado ao repouso

  estendido que caracteriza o período de adaptação.

  6.3.9.10. Para definir a jornada máxima de um tripulante em estado desconhecido de aclimatação,

  deve-se considerar o horário no local onde ele esteve por último aclimatado nas Tabelas

  B.1, B.2 ou B.3 (incluindo os ajustes para o horário de verão), e não o horário local.

  6.3.9.11. Para o cálculo da jornada máxima de um tripulante em estado desconhecido de

  aclimatação, diminui-se em 1 hora os valores constantes da Tabela B.1 ou das Tabelas

  B.2 e B.3 do RBAC nº 117, conforme aplicável, considerando-se a coluna “hora

  aclimatada referente ao início da jornada” do local onde o tripulante esteve por último

  aclimatado.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo:

  Um tripulante originalmente aclimatado a São Paulo inicia uma jornada em Paris, em

  estado desconhecido de aclimatação. A jornada máxima buscada nas Tabelas B.2 e

  B.3 deve ser baseada no horário do local onde ele esteve por último aclimatado, ou

  seja, de São Paulo, e não de Paris. Se em Paris o voo for às 21:00 local, deve-se

  consultar a linha que inclua 21:00 menos 4 horas (a diferença de fusos), ou seja, 17:00

  em São Paulo, e diminuir em 1 hora do valor da célula correspondente.

  6.3.9.12. O período de adaptação pode ser realizado concomitantemente ao repouso, que deve
  se

  estender até cumprir a duração estabelecida na Tabela 1 do RBAC nº 117 (adaptada na

  Tabela 3 abaixo). O sentido leste ou oeste não corresponde ao deslocamento realizado em

  estado desconhecido de aclimatação, e sim ao deslocamento referente à maior diferença

  de fusos entre o local original e cada um dos locais onde foi iniciada uma jornada ou um

  período de repouso desde a última aclimatação.

