  6.4.1.6. O que deve constar do MO.

  a. O MO deve ter procedimentos para garantir que um tripulante obtenha ao menos:

  i. 8 horas consecutivas de oportunidade de sono (na base ou fora da base) dentro

  das 12 horas imediatamente anteriores ao início de uma jornada, sobreaviso

  ou reserva;

  ii. 8 horas consecutivas de oportunidade de sono dentro de 10 horas

  imediatamente anteriores ao início de uma jornada seguinte a um sobreaviso

  finalizado sem um chamado, após repouso reduzido, cancelamento ou atraso

  único de 10 horas ou mais.

  b. O MO deve refletir que, se uma jornada estiver atrasada:

  i. os requisitos para a oportunidade de sono relacionam-se com a hora de início

  da jornada de trabalho originalmente prevista, em vez do novo horário de

  início, quando o atraso é inferior a 10 horas;Data de emissão: 31 de janeiro de 2020 IS
  nº 117-003

  Revisão B

  ii. quando há um único atraso de 10 ou mais horas, a oportunidade de sono

  prévio é necessária antes do horário de início atrasado.

  6.4.2. Jornada e limites de tempo de voo [117.B(d)(e)(f)(g) ou 117.C(d)(e)(f)(g)]

  6.4.2.1. Limitar a duração das jornadas e o tempo de voo dentro de uma jornada é um aspecto

  fundamental do gerenciamento da fadiga. O RBAC nº 117 define limites máximos de

  jornada e de tempo de voo nos seus Apêndices B e C.

  6.4.2.2. O MO precisa documentar as limitações aplicáveis a todos os tripulantes. Estas
  limitações

  não devem exceder as contidas nos apêndices que o operador opte por cumprir.

  6.4.2.3. A ANAC não aceitará um MO que simplesmente se refira às limitações contidas na
  Lei

  nº 13.475/17 ou no RBAC nº 117. O MO deve especificar claramente as limitações

  aplicáveis aos seus tripulantes; estes tornam-se limites "prescritivos". Esse requisito

  permite que todos os tripulantes estejam cientes de suas limitações.

  6.4.2.4. O risco de fadiga pode não ser suficientemente gerenciado com base apenas em limitações

  das horas de jornada e na programação de repousos de duração mínima adequada. Após

  a aplicação desses limites, pode haver necessidade do operador controlar o risco de fadiga

  devido a fatores como:

  a. variações individuais;

  b. ambiente operacional;

  c. horários de trabalho (durante a noite e nas janelas de baixa do alerta, por exemplo);

  d. carga de trabalho (entre outros fatores).

  Variações individuais podem assumir diferentes formas, tais como:

  • o tripulante está matriculado em um curso superior de ciências aeronáuticas, por

  exemplo;

  • o tripulante possui cargos administrativos na empresa aérea, devendo coordenar

  tais tarefas com as atividades de voo.

  6.4.2.5. Os limites de jornada e de tempo de voo para operações complexas ou com dois ou
  mais

  pilotos também levam em conta o estado de aclimatação do tripulante (afetado pelo

  cruzamento de fusos horários) e se a tripulação é ou não aumentada (isto é, composta ou

  de revezamento).

  6.4.2.6. O RBAC nº 117 possui um requisito incorporado para identificação de perigos e

  gerenciamento de riscos para os Apêndices B e C do RBAC nº 117. O efeito disso é que

  as limitações especificadas naqueles apêndices podem precisar ser modificadas por um

  operador para reduzir os riscos de fadiga a um nível aceitável (vide o item 6.3.6 desta
  IS).

  6.4.2.7. O que deve constar do MO.

  a. Procedimentos (um sistema de escala) para garantir que o tripulante não seja

  escalado para uma jornada maior do que o número de horas especificado no MO,

  que, por sua vez, não deve exceder os limites estipulados no Apêndice do RBAC nº

  117 aplicável. É importante que se tenha um cuidado especial com os horários deData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  saída do local de descanso e previstos de chegada no aeroporto, a fim de evitar que

  o tripulante fique em vigília no aeroporto sem a respectiva contagem de tempo de

  jornada.

  b. Procedimentos do setor de escalas, para assegurar que as jornadas sejam designadas

  de tal maneira que forneçam provisão suficiente para o(s) voo(s) pretendido(s), bem

  como um período suficiente para deveres pré e pós-voo que levem em consideração

  requisitos inevitáveis tais como:

  i. check-in de passageiros;

  ii. embarque de passageiros;

  iii. balancear e carregar a aeronave, bem como preparar o manifesto de carga

  correspondente;

  iv. alfândega e imigração;

  v. deveres pré-voo (por exemplo, entrada de dados de voo);

  vi. inspeções pré-voo de manutenção e de pilotos (reabastecimento de

  combustível e óleo etc.);

  vii. deveres pós-voo (por exemplo, preenchimento do diário de bordo e tempo de

  serviço, limpeza de aeronaves, lavagem de compressores e outros serviços do

  piloto).

  c. Procedimentos para mensurar e/ou mitigar a fadiga decorrente de treinamentos em

  simulador e/ou trabalhos administrativos e operacionais, principalmente quando

  estes forem associados a uma atividade de voo.

  d. Avaliação de como eventuais atividades voluntárias devem ser enquadradas como

  trabalho e inserção no cômputo da jornada (vide item 6.3.6.9 desta IS).

  e. Apêndice B do RBAC nº 117.

  i. Os limites no MO não devem exceder os limites no RBAC nº 117, Apêndice

  B, Tabelas B.1, B.2 e B.3.

  ii. Operações complexas com mais de um piloto são normalmente sujeitas ao

  cruzamento de fusos horários, afetando o ritmo circadiano dos tripulantes.

  Portanto, a jornada de trabalho e os limites de tempo de voo são calculados

  com base na localização em que o ''relógio biológico'' do tripulante é

  considerado.

  iii. Consulte o item 6.3.9 desta IS para obter orientação sobre aclimatação e

  adaptação.

  iv. O MO deve conter procedimentos capazes de determinar se o tripulante está

  aclimatado e, em caso afirmativo, a qual local está aclimatado e,

  inversamente, quando está em um estado desconhecido de aclimatação. Esses

  procedimentos devem levar ao mesmo resultado da tabela a seguir:Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

