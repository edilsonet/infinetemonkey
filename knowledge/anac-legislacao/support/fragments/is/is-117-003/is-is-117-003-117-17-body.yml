  6.3.9.13. Exemplos de utilização da Tabela 3 para aclimatação de um tripulante na base contratual

  ou fora dela.

  Exemplo 1:

  Um tripulante aclimatado à Guarulhos se desloca para Paris, entra em estado

  desconhecido de aclimatação e retorna ao Guarulhos na jornada seguinte.

