  aclimatação do tripulante para os propósitos do RBAC nº 117. Esses cenários devem ser

  considerados apenas como orientação na aplicação da seção 117.5 e podem não garantir

  que um tripulante esteja realmente aclimatado ou em um estado desconhecido de

  aclimatação, conforme descrito.

  6.3.10. Cultura de segurança operacional

  6.3.10.1. O Anexo 19 exige que os Estados e os prestadores de serviços promovam uma cultura
  de

  segurança operacional positiva com o objetivo de promover a implementação eficaz da

  gestão da segurança operacional por meio do SSP / SGSO. Para a implantação de um

  GRF, é importante a promoção de uma cultura de segurança operacional positiva.

  6.3.10.2. Uma cultura de segurança operacional é a consequência natural de ter humanos no
  sistema

  de aviação. Ela pode ser descrita “como as pessoas se comportam em relação à segurança

  e ao risco quando ninguém está observando”. É uma expressão de como a segurança é

  percebida, valorizada e priorizada pela gerência e pelos funcionários de uma organização,

  e se reflete na medida em que os indivíduos e grupos:

  a. estão cientes dos riscos e perigos conhecidos enfrentados pela organização e suas

  atividades;

  b. continuamente se comportam para preservar e aumentar a segurança;

  c. têm acesso aos recursos necessários para operações seguras;

  d. estão dispostos e são capazes de se adaptar diante de questões de segurança;

  e. estão dispostos a comunicar questões de segurança; e

  f. avaliam consistentemente os comportamentos relacionados à segurança em toda a

  organização.

  6.3.10.3. Para mais informações sobre este assunto, consultar o Doc 9859 (ICAO) e IS nº
  119-002

  (ANAC).Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  6.4 Obrigações referentes aos Apêndices B e C do RBAC nº 117

  O operador deve escolher em qual dos Apêndices B ou C irá operar. Vide o item 5.2 desta

  IS para ter orientações sobre qual Apêndice melhor se adapta à sua operação.

  6.4.1. Oportunidade de sono anterior à jornada, sobreaviso ou reserva [117.B(c) ou

  117.C(c)]

  6.4.1.1. Conforme os parágrafos (c) dos Apêndices B e C do RBAC nº 117, um tripulante não

  deve ser escalado para uma jornada, sobreaviso ou reserva, ou iniciá-la(o), exceto se tiver

  a oportunidade de sono de 8 (oito) horas consecutivas dentro das 12 (doze) horas que

  antecedem:

  a. o início da jornada, sobreaviso ou reserva, se esta(e) não sofreu atraso;

  b. o horário original de apresentação para a jornada, sobreaviso ou reserva, se esta(e)

  sofreu atraso de menos de 10 horas; ou

  c. o início da jornada, sobreaviso ou reserva após o atraso, se este foi de 10 horas ou

  mais.

  6.4.1.2. Para tanto, deve haver uma política e procedimentos descritos no MO, baseados no

  entendimento mútuo entre o tripulante e o operador, sobre em que momento a

  oportunidade do sono se situará no período anterior a jornada de trabalho (especialmente

  para casos em que a oportunidade de sono não coincidir com a noite local).

  6.4.1.3. Em circunstâncias normais, o tripulante não deve ser contatado pelo operador durante
  a

  oportunidade de sono anterior à jornada, exceto de uma maneira que não perturbe seu

  sono naquele período. Do contrário, caracterizar-se-á circunstâncias anormais.

  a. Circunstâncias normais referem-se às situações em que o operador deseja preservar

  a oportunidade de sono anterior do tripulante, sem interromper o fluxo contínuo do

  sono. Em casos de períodos de repouso maiores do que 12 horas, eventuais contatos

  nas horas anteriores ao período de 12 horas que precede o início da jornada são

  considerados normais, desde que não interfiram na noite local.

  Exemplo 1:

  Uma jornada foi finalizada às 16:00 no dia 1 e o tripulante obteve 20 horas de repouso.

  Sua próxima jornada será às 12:00 do dia 2. O período que deve ser preservado para

  garantir a oportunidade de sono é das 00:00 às 12:00. Porém, como a noite local já

  iniciou às 22:00, o ideal é não haver contato desde este horário. Por outro lado, se a

  política do operador considerar que 2 horas antes do horário do início da jornada a

  pessoa já está acordada, o intervalo entre 10:00 e 12:00 do dia 2 seria considerado

  normal. Da mesma forma, o intervalo entre 16:00 e 22:00 do dia 1.

  Exemplo 2:

  Uma jornada é finalizada às 06:00 e, após repouso de 12 horas, outra jornada será

  iniciada no mesmo dia. O período de oportunidade de sono coincidirá com o período

  de repouso integralmente, de forma que quaisquer contatos devem ser evitados ao

  máximo. Por conveniência, o operador pode definir que 1 hora logo após o término da

  jornada e 1 hora antes do início da próxima sejam janelas em que o contato pode ser

  realizado sem atrapalhar o sono do tripulante. Entretanto, um contato realizado àsData de
  emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  08:00 ou às 13:00, por exemplo, seria considerado sob circunstâncias anormais, pois

  interferiria diretamente na oportunidade de sono do tripulante.

  b. Circunstâncias anormais referem-se ao caso em que o operador precisa entrar em

  contato com o tripulante e entende-se que isso significará que a oportunidade de

  sono anterior foi interrompida. O tripulante, então, não poderá iniciar a jornada de

  trabalho sem completar um período de oportunidade de sono anterior a partir do

  final da interrupção.

  Exemplo:

  Pode ocorrer que o operador necessite de informações urgentes do tripulante, como

  dados de aeronavegabilidade de uma aeronave operada pelo tripulante na jornada de

  trabalho anterior e decide que não pode esperar até que a oportunidade de sono

  anterior termine, entendendo que a oportunidade de sono deve ser rearranjada e

  iniciada novamente do zero a partir do final da interrupção.

  6.4.1.4. Quando houver a necessidade de oportunidades de sono prévio, o MO deve conter:

  a. a política do operador para gerenciar os requisitos da oportunidade de sono anterior,

  de modo que os tripulantes estejam cientes de quando o sono deve ser planejado

  com referência à hora de início de suas jornadas. Recomenda-se que esta política

  seja construída após consulta junto aos tripulantes;

  A consulta acima referenciada pode ser feita de diferentes formas, tais como envio de

  e-mails, solicitação de preenchimento de documento adicional durante a preparação

  do voo, pesquisa via internet etc.

  Outro método viável seria a formação de um grupo com representação das categorias

  (pilotos e comissários) para recolher informação dos tripulantes, como oficinas de

  trabalho.

  b. procedimentos para assegurar que a oportunidade mínima de sono antes de uma

  jornada ou de períodos de sobreaviso ou reserva possa ser cumprida;

  c. procedimentos para orientar os funcionários do operador a não interromper a

  oportunidade de sono de tripulantes ao entrar em contato com eles antes do horário

  de início de uma jornada, a não ser que este contato esteja de acordo com o

  protocolo da empresa que tenha sido construído junto aos próprios tripulantes;

  d. procedimentos que detalham métodos e protocolos de contato especificados que

  provaram ser eficazes em não interromper a oportunidade de sono anterior de

  tripulantes, bem como identificar e comunicar horários adequados de contato. Esses

  procedimentos devem ser claros e prontamente disponíveis para os funcionários do

  operador envolvidos nos contatos com os tripulantes, bem como para os tripulantes

  afetados;

  e. procedimentos para assegurar que, tanto quanto seja praticável, cada tripulante

  esteja ciente de que tem a responsabilidade de fazer uso apropriado da oportunidade

  de sono antes de iniciar uma jornada, a fim de alcançar um estado de alerta

  adequado no início da jornada de trabalho.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Observação:

  Os procedimentos necessários podem ser tão simples quanto garantir que os

  tripulantes, o pessoal da escala e todos aqueles que possam ter motivos para entrar

  em contato com um tripulante antes de uma jornada, tenham sido informados sobre

  esse requisito na sua contratação. Todos devem estar cientes de que qualquer contato

  (que não esteja de acordo com os procedimentos do operador) durante o período de

  oportunidade do sono, tem o potencial de afetar a aptidão do tripulante ao trabalho

  para a jornada subsequente.

  6.4.1.5. O requisito de oportunidade de sono prévio pode resultar em um repouso mínimo

  aumentado em alguns locais, se não houver tempo suficiente disponível para a

  oportunidade anterior de sono. A tabela a seguir pode ser usada para ajudar a determinar

