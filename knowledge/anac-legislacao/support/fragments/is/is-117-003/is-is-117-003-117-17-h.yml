  b. Apêndice C do RBAC nº 117.

  i. Fadiga aguda.

  A. O operador deve incluir no seu manual os períodos de repousos

  mínimos que serão aplicados aos seus tripulantes. Esses períodos não

  devem ser inferiores aos exigidos pelo parágrafo (l) do Apêndice C doData de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  requeiram e ainda permitir uma oportunidade de oito horas de sono.

  ii. Fadiga cumulativa.

  A. Para lidar com a fadiga cumulativa, antes de iniciar uma jornada, o

  tripulante deve, pelo menos, ter cumprido os requisitos de folga

  periódica previstos na Seção X (arts. 50 até 54) da Lei nº 13.475/17.

  B. O operador deve inserir no seu MO procedimentos sobre tais requisitos.

  É importante que os limites constantes da Seção X da Lei nº 13.475/17

  sejam transcritos para aquele Manual.

