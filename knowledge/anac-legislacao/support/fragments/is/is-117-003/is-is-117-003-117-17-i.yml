family: '117'
section_id: '117.17'
section_title: 'e 117.61 do RBAC nº 117. Resumidamente, pode-se citar:'
subsection_id: i
cite: 117.17(i)
title: 117.17(i)
text: 'i) Duração: 12 horas (uma vez que a jornada não excedeu 12 horas)

  ii) Momento de início: 14:30 (uma vez que as obrigações do tripulante com o

  operador cessaram neste momento).

  6.4.6. Reprogramação e extensão de jornada de trabalho [117.B(i) ou 117.C(i)]

  6.4.6.1. Tanto na reprogramação como na extensão de jornadas exige-se que o operador, além
  de

  avaliar independentemente o risco de fadiga associado à reprogramação ou extensão

  proposta, confirme junto aos tripulantes se eles se consideram aptos a realizar a jornada

  modificada.

  6.4.6.2. Embora os tripulantes continuem a ser a última linha de defesa, a realidade é que
  nem

  sempre estão em boas condições para avaliar ou mitigar adequadamente o aumento do

  risco de fadiga, especialmente se eles próprios estiverem com altos níveis de fadiga ou

  altos níveis de pressão para concluir uma jornada.

  6.4.6.3. Reprogramação da jornada de trabalho [117.B(i)(1) ou 117.C(i)(1)]).

  a. Esta seção se refere aos limites para a reprogramação de uma jornada de trabalho,

  uma vez que tenha sido iniciada.

  i. A reprogramação que resulta no aumento de uma jornada deve, ainda assim,

  permanecer dentro dos limites de jornada e tempo de voo do MO para o novo

  número de etapas, considerando o mesmo horário de apresentação;Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

  ii. A jornada reprogramada não pode exceder 4 horas em relação à jornada

  original.

  iii. Cada tripulante deve considerar-se apto para a jornada modificada,

  declarando tal em formulário apropriado, a ser disponibilizado pelo operador.

  b. Uma jornada reprogramada pode, posteriormente, ser estendida de acordo com os

  requisitos de extensão de jornada, se circunstâncias operacionais imprevistas

  ocorrerem.

  6.4.6.4. Extensão de jornada de trabalho [117.B(i)(2) ou 117.C(i)(2)].

  a. Extensão se refere ao aumento da jornada de trabalho de modo que exceda o limite

  da jornada máximo que consta no MO para a jornada originalmente prevista. A

  extensão:

  i. deve ser causada por circunstâncias operacionais imprevistas (vide

  definição);

  ii. deve ser feita de acordo com a discricionariedade do piloto em comando;

  iii. não pode exceder 1 (uma) hora para tripulações mínimas ou simples;

  iv. não pode exceder 2 (duas) horas para tripulações compostas ou de

  revezamento; e

  v. possibilita o aumento de apenas 1 (uma) etapa.

  6.4.6.5. A intenção por trás do uso do termo "circunstâncias imprevistas" é evitar que os

  operadores escalonem continuamente os períodos de voo e serviço até seus limites

  máximos e que dependam regularmente de extensões para atingir suas metas

  operacionais. Além da experiência operacional, a identificação de perigos e as avaliações

  de risco podem ser utilizadas para prever possíveis interrupções ou atrasos, por exemplo:

  a. condições meteorológicas;

  b. instruções de controle de tráfego aéreo;

  c. tráfego de pico durante a partida / pouso;

  d. necessidade de manutenção não prevista;

  e. doença dos membros da tripulação durante o trabalho, etc.

  6.4.6.6. Um operador deve ter expectativas razoáveis, baseadas na sua experiência e em dados

  anteriores, de que a jornada de trabalho possa ser realizada dentro dos limites do MO. Os

  limites máximos de jornada em todos os Apêndices do RBAC nº 117 foram definidos

  com a expectativa de não haver extensões.

  a. A legislação e o regulamento estabelecem critérios para extensão de jornada, cuja

  ocorrência se espera rara, sob decisão final do comandante da aeronave. O

  comandante deve estar ciente das condições de aptidão dos outros membros da

  tripulação para tomar sua decisão.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  b. Os requisitos para extensão de jornada foram incluídos nos Apêndices B e C para

  que se tenha a flexibilidade apropriada quando for necessário ampliar uma jornada

  no caso de circunstâncias operacionais imprevistas e quando a tripulação está apta

  para a ampliação.

  c. A decisão de estender uma jornada deve ser tomada pelo piloto em comando antes

  do início de um voo (normalmente a última etapa da jornada de trabalho), quando

  a cada um dos membros da tripulação é dada a opção de continuar ou não a jornada,

  com base na avaliação da sua aptidão para o trabalho.

  d. O operador não está autorizado a continuamente aumentar o tamanho das jornadas

  e dos tempos de voo até seus limites máximos, resultando no uso excessivo de

  extensões, quando a experiência anterior indicar que é necessário um tempo maior

  para cumprir a jornada e/ou o tempo de voo.

  6.4.6.7. Extensões só deveriam ocorrer em menos de 5% em qualquer amostra de jornadas

  similares ou operações semelhantes. A amostra de jornadas deve basear-se na captura de

  uma causa raiz comum para a extensão. Um exemplo de procedimento para cumprir este

  item está abaixo descrito:

  a. coletar todas as interrupções ou atrasos em um determinado período (por exemplo,

  uma semana, uma quinzena, um mês etc.) em relação ao planejamento inicial do

  operador;

  b. verificar quais interrupções e atrasos levaram a extensões além dos limites máximos

  das jornadas estabelecidos no MO;

  c. determinar as causas raízes de cada uma das extensões acima citadas e classificar

  como semelhantes as jornadas ou operações que tenham uma mesma causa raiz;

  d. contabilizar o número de jornadas ou operações totais semelhantes as jornadas ou

  operações supracitadas;

  e. determinar se as jornadas ou operações com extensão (item c acima) ultrapassam

  os 5% das jornadas ou operações totais (item d acima);

  f. tomar as medidas necessárias para mitigar as causas raízes encontradas.

  Exemplo 1:

  • Ocorrência: suponha que o tempo no solo em um aeroporto esteja programado para

  45 minutos, mas leva 1 hora e 15 minutos em um terço dos casos. Como tal situação

  afeta mais de 5% de todos os voos que possuam escala naquele aeroporto, não será

  apropriado continuar a programar o tempo de 45 minutos em jornadas que são

  muito próximas aos limites do MO.

  • Causa raiz: dificuldade em realizar todas as operações de solo em um determinado

  aeroporto dentro do tempo previsto (45 minutos).

  • Amostra: todos os voos do operador que possuem escala no referido aeródromo em

  um determinado período.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo 2:

  • Ocorrência: suponha que o tempo de espera (holding) em um determinado

  aeródromo seja o triplo do tempo originalmente programado por motivo de

  orientação do controle de tráfego aéreo em um quarto dos casos (isto somente

  ocorre durante os horários de pico no aeródromo). Caso tal condição se apresente

  em mais de 5% de todos os voos do operador para aquele aeródromo, não será

  apropriado continuar a programar o tempo normal de espera, quando a jornada

  for muito próxima do máximo estabelecido no MO.

  • Causa raiz: a dificuldade do controle de tráfego aéreo realizar o processamento

  para pouso em um determinado aeródromo dentro do tempo padrão de espera (30

  minutos).

  • Amostra: todos os voos do operador que pousam naquele aeródromo durante o seu

  horário de pico.

  Exemplo 3:

  • Ocorrência: suponha que diversos voos são atrasados entre 30 min e 50 min na

  decolagem em um aeródromo por motivos meteorológicos durante o inverno. Caso

  tal condição se apresente em mais de 5% de todos os voos do operador iniciados

  naquele aeródromo, não será apropriado continuar a considerar o voo sem atraso

  na decolagem, quando a jornada for muito próxima do máximo estabelecido no MO.

  • Causa raiz: a dificuldade de iniciar o voo durante o inverno no horário planejado

  devido às condições meteorológicas reinantes.

  • Amostra: todos os voos do operador que decolam do referido aeródromo no período

  de inverno.

  6.4.6.8. Quando um operador experimenta extensões em mais de 5% da amostra, deveria

  considerar a revisão de suas práticas de escala. Tal revisão tem por objetivo prover uma

  maior confiança de que os limites de jornada e tempo de voo prescritos no MO não serão

  excedidos.

  6.4.6.9. Para que um operador do GRF cumpra suas obrigações, os relatórios de extensão devem

  ser introduzidos em seus processos de identificação de perigos e monitoramento contínuo

  (consulte os itens 6.3.4, 6.3.4.17 e 6.3.7 desta IS para obter orientações adicionais).

  6.4.6.10. Conforme estabelecido no parágrafo único do art. 40 da Lei nº 13.475/17, qualquer

  ampliação dos limites das horas de trabalho estabelecidas no MO deve ser comunicada,

  em no máximo 24 (vinte e quatro) horas após a viagem, pelo comandante ao empregador,

  que, no prazo de 15 (quinze) dias, deve comunicar à ANAC.

  6.4.6.11. O que deve constar do MO.

  a. O MO deve conter procedimentos para:

  i. orientar e treinar o tripulante no uso de ferramentas que o auxiliem a avaliar

  sua aptidão para o trabalho (vide Apêndice D);

  ii. impedir uma reprogramação do tripulante se este considerar-se inapto para o

  trabalho na jornada reprogramada;Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  iii. impedir uma extensão de jornada, exceto se todos tripulante tiverem sido

  consultados pelo piloto em comando e todos declararem-se aptos para o

  trabalho na extensão solicitada;

  iv. coletar informações suficientes sobre cada reprogramação e extensão de

  jornada, para permitir um estudo mais aprofundado pelo GAGEF e um ajuste

  fino do processo de escala de tripulantes, minimizando assim a probabilidade

  de novas extensões.

  b. Reprogramação de jornada: os procedimentos devem, no mínimo:

  i. identificar que, ao reprogramar uma jornada, 4 horas é o aumento máximo

  para a jornada de trabalho originalmente atribuída ao tripulante;

  ii. identificar que um tripulante reprogramado não deve exceder os limites

  máximos de jornada de trabalho constantes do MO;

  iii. identificar que uma jornada reprogramada não deve fazer com que o

  tripulante exceda limites de jornada e tempo de voo acumulados;

  iv. identificar que uma jornada reprogramada não deve fazer com que o

  tripulante ultrapasse o limite de operações na madrugada.

  c. Extensões de jornada:

  i. os procedimentos devem limitar claramente o uso de extensões às

  circunstâncias em que:

  A. a jornada de trabalho já foi iniciada;

  B. a decisão de ampliar a jornada de trabalho e / ou o tempo de voo é

  tomada antes do início do último voo dessa mesma jornada e antes dos

  limites de jornada de trabalho e de tempo de voo serem excedidos;

  C. as circunstâncias operacionais que exigiram a extensão de jornada

  poderiam ser classificadas como imprevistas (vide definição de

  circunstância operacional imprevista nesta IS);

  D. o tripulante não excederá a duração da jornada acumulada e do tempo

  de voo acumulado durante a extensão;

  E. a extensão é necessária para completar o voo até o destino planejado;

  ii. os procedimentos também devem deixar claro que uma extensão não pode ser

  maior que:

  A. para operações com tripulação composta ou de revezamento, 2 horas

  para a jornada de trabalho e 1 hora de voo, em relação aos limites do

  MO;

  B. para operações com tripulações mínimas ou simples, 1 hora para a

  jornada de trabalho e 30 minutos de voo, em relação aos limites do MO;Data de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  C. o número de etapas da jornada pode ser ampliado em mais 1 (um);

  Exemplo:

  Uma jornada com tripulação simples foi iniciada às 14:30, com quatro etapas. No

  MO, a previsão de jornada neste caso seria de 11 horas, sendo 9 horas de tempo de

  voo . Devido a problemas meteorológicos graves, contudo, foi feito uso da extensão.

  Neste caso, a jornada máxima possível seria de 12 horas (uma hora a mais), com cinco

  etapas (uma etapa a mais), e o tempo de voo total da jornada seria de 9,5 horas (meia

  hora a mais).

  iii. se circunstâncias operacionais imprevistas acontecerem após a decolagem da

  última etapa de uma jornada, então o voo pode continuar para o destino

  planejado ou para o destino alternativo de acordo com a discricionariedade

  do piloto em comando; e

  iv. o repouso após a jornada estendida deve ser baseado na sua duração total,

  incluindo a extensão.

  6.4.7. Limites de sobreaviso e reserva [117.B(j) ou 117.C(j)]

  6.4.7.1. Do ponto de vista da fadiga, há vantagens e desvantagens na utilização de sobreaviso
  e

  reserva.

  a. Reserva.

  i. Vantagens: anula a necessidade do tripulante dirigir até o aeroporto após o

  chamado, o que, dependendo do tempo de viagem, do clima e das condições

  de tráfego pode impactar negativamente os níveis de fadiga antes do início da

  jornada de trabalho. O tempo em que o tripulante permanece à disposição é

  mais curto.

  ii. Desvantagens: é mais provável que um tripulante esteja em estado de

  prontidão, enquanto não realiza nenhum trabalho real, mesmo se houver

  acesso a acomodação para reserva adequada. Este estado elevado de

  prontidão pode gerar ansiedade, o que pode aumentar a fadiga e diminuir os

  níveis de alerta mais rápido do que em casa ou em outro local longe do

  aeroporto.

  b. Sobreaviso.

  i. Vantagens: o tripulante escolhe o local, podendo permanecer em casa ou um

  local equivalente a uma acomodação para repouso (mais confortável que

  acomodação para reserva), em companhia de familiares e amigos, se desejar.

  ii. Desvantagens: terá de cumprir o tempo máximo de deslocamento caso seja

  acionado, por isso o local de escolha não poderá ser qualquer um. Ainda,

  provavelmente terá de dirigir, o que exige atenção e contribui para a fadiga.

  O período do sobreaviso (se durante o dia, por exemplo), a ansiedade gerada

  de um possível acionamento e interferências sociais podem atrapalhar a

  perspectiva de um possível sono.

  6.4.7.2. É responsabilidade do operador monitorar esses riscos potenciais e tomar decisões
  sobreData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  a utilização do sobreaviso ou da reserva, de modo a gerenciar o risco apropriadamente.

  Boas práticas

  O operador oferecer oficinas com as famílias dos tripulantes e promover informações

  sobre as características especiais das profissões de piloto e comissários de voo:

  • Por que os horários de trabalho são irregulares?

  • O que é uma reserva, e qual a diferença para o sobreaviso?

  • A importância do respeito à condição de sobreaviso em casa.

  • A importância da manutenção de um ambiente de repouso em casa.

  6.4.7.3. Uma importante estratégia de gerenciamento de risco para qualquer operador, no
  que se

  refere aos períodos de sobreaviso e reserva, é maximizar a eficácia de qualquer

  oportunidade de sono / descanso que o tripulante possa ter enquanto estiver naquelas

  situações. Isso significa reduzir o contato ao mínimo e, quando pertinente, não incluir
  o

  tripulante nas deliberações operacionais e na tomada de decisões antes do início da

  jornada de trabalho.

  6.4.7.4. É importante que os operadores observem que, para tripulantes diferentes, podem
  existir

  maneiras diferentes de gerenciar qualquer estresse adicional, que pode estar presente

  como resultado da manutenção de um nível mais alto de alerta durante os períodos de

  sobreaviso ou reserva. Uma estratégia que os tripulantes podem empregar envolve

  atividades relacionadas à aviação enquanto ainda está em estado de prontidão. Se um

  tripulante decidir realizar tarefas relacionadas ao trabalho enquanto estiver em sobreaviso

  ou reserva (inteiramente por vontade própria), então esse tempo não deve ser considerado

  como jornada de trabalho. Contudo, os operadores não podem tirar vantagem indevida

  desse método de gerenciamento de estresse, não alocando tempo suficiente para realizar

  essas tarefas, que de outra forma seriam requeridas, na jornada de trabalho subsequente.

  6.4.7.5. Condições para reserva.

  a. Conforme estabelecido no art. 44 da Lei nº 13.475/17, quando prevista a reserva

  por período superior a 3 horas, o operador deve assegurar ao tripulante acomodação

  adequada para seu descanso.

  b. O operador deve planejar a reserva de forma que todos os tripulantes em reserva no

  mesmo período tenham oportunidade de descansar após 3 horas, salvo se houver

  disposições diferentes em ACT ou CCT (§ 7º do art. 43 da Lei nº 13.475/17).

  c. O descanso não deve ser contabilizado antes de 3 horas do início da reserva.

  6.4.7.6. Condições para sobreaviso.

  a. Para casos de sobreaviso, quando o tripulante pode permanecer em local de sua

  escolha aguardando um chamado, que pode ou não acontecer, é recomendável que

  o operador oriente as medidas que o tripulante deve atender para se manter apto

  para o voo.

  b. Conforme o art. 43 da Lei nº 13.745/17, caput e parágrafo 1º, o tempo de

  apresentação do tripulante após comunicação de nova tarefa é de 90 minutos, ou

  150 quando designado para outra base em município ou conurbação com dois ou

  mais aeroportos. O operador pode estimular que estas durações sejam calculadasData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  considerando-se todos os possíveis fatores de pressão de tempo e acessibilidade

  para entrar e sair do local escolhido, de forma a evitar ao máximo situações de

  estresse.

  6.4.7.7. O que deve constar do MO.

  a. Os procedimentos do MO devem:

  i. incluir um meio de fazer avaliações confiáveis de acomodações adequadas

  para dormir ou descansar (na base contratual e nas bases secundárias ou

  escalas) que são propostas para uso em períodos de sobreaviso ou reserva.

  Essas avaliações devem ser contínuas para garantir que a acomodação

  permaneça adequada ao objetivo. Especial atenção deve ser dada às

  acomodações para reserva, que são de responsabilidade do operador;

  ii. garantir que os tripulantes não sejam perturbados pelo contato da empresa

  durante o período de sobreaviso ou reserva, exceto para chamar o tripulante

  para uma jornada de trabalho.

  Importante:

  O estresse e a fadiga podem ser acelerados se o tripulante for obrigado a realizar

  tarefas (por exemplo, tarefas de escritório) enquanto estiver em sobreaviso ou reserva.

  Portanto, a realização dessas tarefas não pode ser considerada como sobreaviso ou

  reserva.

  b. Os procedimentos devem assegurar que:

  i. um sobreaviso finalizado sem um chamado deve ser seguido por um período

  de tempo de repouso de, pelo menos, 10 horas consecutivas;

  ii. uma reserva finalizada sem um chamado deve ser seguida por um período de

  tempo de repouso de, pelo menos, 12 horas consecutivas;

  iii. a duração do sobreaviso respeite o cálculo de que o sobreaviso é finalizado

  quando do início do deslocamento do tripulante ao aeroporto (90 ou 150

  minutos antes do início da jornada, conforme a situação), e não quando o

  operador faz contato para informar sobre a jornada;

  iv. se o tripulante que compuser tripulação simples for acionado durante um

  sobreaviso, a soma do limite máximo de jornada ao tempo de sobreaviso não

  pode ultrapassar 16 horas;

  Exemplo 1: sobreaviso (simples)

  • Situação: um sobreaviso com duração de 10 horas é iniciado às 08:00 por um

  tripulante aclimatado na sua base contratual em GRU. Às 12:00 o tripulante é

  informado que assumirá uma jornada às 17:30. O tripulante deixa a sua residência

  às 15:00 para dirigir-se ao local onde iniciará a sua jornada.

  • Cálculo da duração do sobreaviso: considerando que o sobreaviso foi iniciado às

  08:00 e o tripulante deixou a sua residência às 15:00, a duração real do sobreaviso

  foi de 7 horas.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  • Tempo de translado: o tempo de translado do tripulante (150 minutos) não é

  contado para efeito de sobreaviso.

  • Duração máxima da jornada: 16 horas - 7 horas = 9 horas.

  v. sujeito ao item (e) abaixo, se o tripulante que compuser tripulação composta

  ou de revezamento for acionado em até 8 horas do início de seu sobreaviso,

  os limites máximos de jornada previstos nas respectivas tabelas são

  aplicáveis;

  Exemplo 3: sobreaviso (composta - menos de 8 horas de sobreaviso)

  Se um tripulante aclimatado de uma tripulação composta for acionado para uma

  jornada com início às 20:00, após 7 horas de sobreaviso, para um voo em acomodação

  Classe 2, a jornada de trabalho máxima aplicável de 13 horas pode ser cumprida

  normalmente.

  vi. se o tripulante que compuser tripulação composta ou de revezamento for

  acionado após 8 horas de um sobreaviso, os limites de jornada previstos nas

  respectivas tabelas devem ser diminuídos do valor que exceder as 8 horas de

  sobreaviso;

  Exemplo 4: sobreaviso (composta - mais de 8 horas de sobreaviso)

  Se um tripulante aclimatado de uma tripulação composta for acionado para uma

  jornada com início às 20:00, após 10 horas de sobreaviso, para um voo em

  acomodação Classe 2, a jornada de trabalho máxima aplicável de 13 horas deve ser

  reduzida em 2 horas (ou seja, para 11 horas), uma vez que o tripulante ultrapassou em

  2 horas o limite de 8 horas de sobreaviso.

  vii. em município ou conurbação com 2 (dois) ou mais aeroportos, o tripulante

  designado para aeroporto diferente da base contratual terá prazo de 150 (cento

  e cinquenta) minutos para a apresentação, após receber comunicação para o

  início de nova tarefa;

  viii. no período de sobreaviso, não serão computados os períodos de deslocamento

  de 150 (cento e cinquenta) minutos nos municípios / conurbações com 2

  (dois) ou mais aeroportos ou de 90 (noventa) minutos nos demais municípios

  / conurbações;

  ix. o tripulante de voo ou de cabine empregado de uma empresa que opere sob o

  as regras do RBAC nº 121 terá a quantidade de sobreavisos limitada a 8 (oito)

  mensais, podendo ser reduzida ou ampliada por convenção ou acordo coletivo

  de trabalho (nesse caso, os sobreavisos derivados de atrasos não são

  contabilizados);

  x. a duração da reserva respeite o cálculo de que ela termina assim que o voo é

  iniciado, sendo que sua duração abate diretamente a jornada máxima

  permitida;Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo: reserva

  • Situação: uma reserva com duração de 6 horas é iniciada às 06:00 por um

  tripulante na sua base contratual em GRU. Às 09:00 o tripulante é informado que

  assumirá um voo às 11:00 nesse mesmo local.

  • Cálculo da duração da reserva: considerando que a reserva foi iniciada às 06:00

  e o tripulante assumiu o voo às 11:00, a duração da reserva foi de 5 horas.

  • Cálculo da jornada após a reserva:

  ✓ Jornada máxima às 06:00 (tabelas B.1 / C.1 - coluna 1-2 etapas): 11 horas

  ✓ Duração da reserva: 5 horas

  ✓ Jornada máxima após a reserva: 11 horas - 5 horas = 6 horas

  6.4.8. Transporte dos tripulantes: alterações nos requisitos de repouso [117.B(k) ou

  117.C(k)]

  6.4.8.1. Para apresentações em aeroporto diferente da base contratual, mas dentro do mesmo

  município ou da mesma conurbação, os tripulantes em geral se utilizam de transporte

  fornecido pelo operador para o deslocamento do aeroporto de base contratual até o

  aeroporto onde se apresentarão para a jornada.

  6.4.8.2. Adicionalmente, para não correrem o risco de atraso, os tripulantes devem considerar

  vários fatores, tais como:

  a. tais traslados podem durar cerca de uma hora ou mais;

  b. devem se ajustar aos horários de partida dos ônibus do aeroporto de base contratual;

  e

  c. devem prever uma antecedência mínima para chegada ao aeroporto onde se

  apresentarão para a jornada.

  6.4.8.3. O mesmo tipo de situação pode ocorrer ao final de uma jornada.

  6.4.8.4. Em consequência dos itens acima, os requisitos de repouso desta IS devem ser alterados

  nos casos onde a base contratual do tripulante é situada em município ou conurbação

  dotada de dois ou mais aeroportos, como abaixo mostrado:

  a. no caso de viagem que se inicie em aeroporto diferente do definido como base

  contratual, e distante até 50 (cinquenta) quilômetros da base, o repouso mínimo

  regulamentar anterior à jornada será acrescido de, no mínimo, uma hora;

  b. no caso de viagem que finalize em aeroporto diferente do definido como base

  contratual e distante até 50 (cinquenta) quilômetros da base, o repouso mínimo

  regulamentar após a jornada será acrescido de, no mínimo, uma hora; e

  c. quando não houver disponibilidade de transporte ao término da jornada, o período

  de repouso será computado a partir da colocação do mesmo à disposição da

  tripulação.

  6.4.8.5. O que deve constar do MO.

  a. Apêndices B e C do RBAC nº 117:Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  i. o MO deve conter procedimentos para alterar os requisitos de repouso do

  tripulante sempre que a sua base contratual for situada em município ou

  conurbação dotada de dois ou mais aeroportos.

  Exemplo:

  • Situação: Um tripulante (aclimatado) termina uma jornada de 10 horas em

  Congonhas. A base contratual do tripulante é o aeroporto de Guarulhos.

  • Determinação do repouso mínimo: como o tripulante está aclimatado e a sua

  jornada foi inferior a 12 horas, o repouso mínimo regulamentar será de 12 horas.

  • Alteração do repouso mínimo: como o aeroporto de Congonhas fica localizado em

  uma conurbação dotada de dois ou mais aeroportos distantes entre si menos de 50

  km, e o tripulante é baseado em Guarulhos, o período de 12 horas deve ser

  acrescido de 1 hora, resultando em um repouso mínimo de 13 horas.

  6.4.9. Períodos de repouso [117.B(l) ou 117.C(l)]

  6.4.9.1. É essencial que o operador e o tripulante compartilhem o conceito de que o repouso
  é um

  período livre de todos os deveres e serviços associados ao trabalho. Isso significa que
  o

  tripulante não pode simplesmente ser incumbido de tarefas de solo durante seus períodos

  de repouso mínimo obrigatórios e não pode ser escalado para outra jornada de trabalho

  até que os requisitos mínimos de repouso tenham sido atendidos.

  6.4.9.2. Com base na função que o repouso desempenha, existem três grandes categorias de

  requisitos para repouso:

  a. aqueles que abordam a fadiga aguda (isto é, a exigência de um repouso após uma

  jornada); e

  b. aqueles que abordam a fadiga acumulada (isto é, a exigência de folgas periódicas,

  como previstas na Seção X (arts. 50 até 54) da Lei nº 13.475/17); e

  c. aquelas que abordam a fadiga relacionada ao cruzamento de fusos horários (são

  previstos para aclimatar um tripulante à hora local, isto é, a exigência de períodos

  de adaptação).

  6.4.9.3. Abordando a fadiga aguda.

  a. O operador deve ter em mente que os períodos de repouso atribuídos devem ser

  longos o suficiente para fornecer:

  i. a oportunidade de sono exigida (8 horas);

  ii. tempo para atender as necessidades fisiológicas e preparação do tripulante

  (em geral 2 horas); e

  iii. tempo suficiente para o transporte de e para o local de repouso.Data de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo:

  Se o tempo de deslocamento entre o aeroporto e o hotel em um determinado local for

  de 15 minutos, o operador deve garantir que o repouso permita:

  • Deslocar-se de e para a acomodação para repouso (neste caso, 30 minutos no

  total);

  • Um período suficiente para se alimentar, comer, beber, ir ao banheiro, lavar-se e

  vestir-se (2 horas podem ser apropriados); e

  • A oportunidade mínima de sono exigida (8 horas).

  Em geral, os requisitos de repouso mínimo preveem tempo suficiente para garantir a

  oportunidade de sono, os deslocamentos e a preparação do tripulante. Entretanto,

  haverá casos em que serão necessários períodos mais longos de repouso, como quando

  o tempo de deslocamento for maior, quando houver períodos estendidos de check-in

  ou check-out do hotel ou desembaraço aduaneiro, por exemplo.

  6.4.9.4. Abordando a fadiga acumulada.

  a. Em todos os Apêndices devem ser seguidas as regras de folga periódica previstas

  na Seção X (arts. 50 até 54) da Lei nº 13.475/17.

  b. Uma consideração importante é que, para iniciar uma jornada, um tripulante deve

  manter o atendimento aos requisitos mesmo ao final desta mesma jornada.

  c. Isso significa que um operador deve estar constantemente levando em consideração

  o histórico do tripulante para determinar se ele pode ser designado para uma

  jornada.

  d. Ao término do repouso mínimo, o tripulante deve obter o número mínimo de folgas

  previstas.

  6.4.9.5. Abordando a fadiga relacionada ao cruzamento de fusos horários.

  a. Para os Apêndices A e B do RBAC nº 117, cruzar mais de três fusos horários

  aumenta o repouso mínimo requerido após a jornada de trabalho.

  b. No caso do Apêndice B do RBAC nº 117, caso o tripulante aclimatado ao ponto de

  origem da jornada cruze mais de três fusos durante esta mesma jornada, presume-

  se que seu relógio biológico migre para longe da hora local do ponto de origem.

  Após 36 horas do início da jornada, o seu relógio biológico já não está

  suficientemente alinhado para ser classificado como aclimatado ao ponto de

  origem. Neste momento, o tripulante é considerado em um estado desconhecido de

  aclimatação e requer um período de adaptação para ser aclimatado a algum local.

  c. Em estado desconhecido de aclimatação, o tripulante não é impedido de trabalhar,

  mas a jornada máxima deve ser diminuída em 1 hora. Se for entendido que esta

  diminuição não atenderá a necessidade do operador, ele deverá garantir um período

  de adaptação do tripulante no novo local.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  Exemplo:

  O tripulante aclimatado à São Paulo iniciou uma jornada de 14 horas para Paris

  (quatro fusos de diferença). Nesta cidade ele deve cumprir um repouso mínimo de 18

  horas, de acordo com o parágrafo (l)(3)(i) do Apêndice B do RBAC nº 117 [12 + 2*

  (2) + 2* (1)=18]. Supondo que, por algum motivo, ele somente consiga iniciar o seu

  retorno para São Paulo após 5 horas do final do repouso, ele terá passado 37 horas

  desde o início da jornada anterior, passando a estar em um estado desconhecido de

  aclimatação.

  6.4.9.6. O que deve constar do MO.

  a. Apêndice B do RBAC nº 117.

  i. Fadiga aguda.

  A. O operador deve incluir no seu manual os períodos de repousos

  mínimos que serão aplicados aos seus tripulantes. Esses períodos não

  podem ser inferiores aos exigidos pelo parágrafo (l) do Apêndice B do

  requeiram e ainda permitir uma oportunidade de oito horas de sono.

  ii. Fadiga cumulativa.

  A. Para lidar com a fadiga cumulativa, antes de iniciar uma jornada, o

  tripulante deve, pelo menos, ter cumprido os requisitos de folga

  periódica previstos na Seção X (arts. 50 até 54) da Lei nº 13.475/17.

  B. O operador deve inserir no seu MO procedimentos sobre tais requisitos.

  É importante que os limites constantes da Seção X da Lei nº 13.475/17

  sejam transcritos para aquele Manual.

  iii. Cruzamento de fusos horários.

  A. Se houver cruzamento de 3 ou mais fusos horários, o operador deve se

  atentar para três condições: a quantidade de fusos cruzados, a duração

  da jornada e o estado de aclimatação dos tripulantes.

  B. Se a jornada se mantiver em menos de 3 fusos em relação ao local de

  origem, não será considerada a diferença entre eles para cálculo de

  repouso (por exemplo: Porto Alegre - Manaus, diferença de 1 fuso;

  Brasília - Rio Branco, diferença de 2 fusos; São Paulo - Lima,

  diferença de 2 fusos; Rio de Janeiro - Nova Iorque, diferença de 2 fusos;

  São Paulo - Miami, diferença de 2 fusos).

  C. Entretanto, se a jornada cruzar 3 ou mais fusos, o operador deve

  considerar a diferença entre os fusos do local de origem e destino para

  o cálculo do repouso posterior, dependendo se o tripulante estiver

  aclimatado ou em estado desconhecido de aclimatação. Não são

  consideradas diferenças devido ao horário de verão ou inverno da

  origem ou do destino.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

