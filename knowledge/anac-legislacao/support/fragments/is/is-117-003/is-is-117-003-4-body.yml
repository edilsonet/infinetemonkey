title: DEFINIÇÕES, ACRÔNIMOS E REFERÊNCIAS
text: '4. DEFINIÇÕES, ACRÔNIMOS E REFERÊNCIAS

  4.1 Acrônimos

  Para os efeitos desta IS, são válidos os seguintes acrônimos:

  a. ANAC: Agência Nacional de Aviação CivilData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  b. CMS: Comissário de Voo

  c. COA: Certificado de Operador Aéreo

  d. EO: Especificações Operativas

  e. FAPA: Ferramenta de Auxílio para Autoavaliação

  f. GRF: Gerenciamento de Risco da Fadiga

  g. GAGEF: Grupo de Ação de Gerenciamento de Fadiga

  h. IS: Instrução Suplementar

  i. MGF: Manual Geral da Fadiga

  j. MO: Manual do Operador

  k. NB: Nível Básico

  l. OACI: Organização de Aviação Civil Internacional

  m. RBAC: Regulamento Brasileiro de Aviação Civil

  n. SGRF: Sistema de Gerenciamento do Risco da Fadiga

  o. SNA: Sindicato Nacional dos Aeronautas

  4.2 Definições

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, no RBAC nº

  117 e IS nº 117-001, além das abaixo listadas:

  a. acesso (à alimentação ou à acomodação) significa que o tripulante não encontra

  impedimento ou restrição para atendimento real e imediato das suas necessidades

  de alimentação, higiene pessoal, descanso ou repouso;

  b. atraso significa o período de tempo entre o horário original de apresentação e o

  horário de apresentação real do tripulante, contados na mesma base de fuso horário.

  O tempo de atraso, para efeito da determinação da jornada máxima das seções 117.B(h)

  e 117.C(h), será considerado como sendo sobreaviso, quer ele cumpra ou não os

  requisitos de sobreaviso, não contando por força do art. 43 §7º da Lei nº 13.475/17.

  c. chave de voo significa uma jornada ou uma combinação de jornadas a ser cumprida

  por um tripulante. . Uma chave de voo pode compreender um ou mais dias de

  programação.

  d. circunstâncias normais significam as condições em que a oportunidade de sono é

  preservada. Quando o operador contata o tripulante durante o período de

  oportunidade de sono, entende-se que ela é interrompida, caracterizando uma

  circunstância anormal;

  e. circunstância operacional imprevista significa um evento excepcional não

  planejado que se torna evidente após o início da jornada de trabalho, como climaData de
  emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  imprevisto, mau funcionamento de um equipamento ou atraso no tráfego aéreo;

  f. controles significam as estratégias defensivas de nível de sistema projetadas para

  minimizar o risco de fadiga de forma contínua;

  g. estado desconhecido de aclimatação significa o desconhecimento em relação à

  qual região o tripulante está aclimatado, quando 36 horas ou mais se passaram desde

  seu deslocamento a um local distante três fusos ou mais do local onde esteve por

  último aclimatado, sem que ele tenha desfrutado do período de adaptação no novo

  local;

  h. fuso horário (ou fuso) significa uma região definida com um horário local

  uniforme que difere em uma hora (ou parte de uma hora) do horário local uniforme

  de uma região adjacente, utilizando o valor definido pelo país. Não leva em conta

  diferenças horárias devido ao horário de verão ou inverno da origem ou do destino;

  i. mitigações significam as intervenções sistêmicas destinadas a reduzir um risco

  específico de fadiga apropriadamente identificado;

  j. operação específica significa a proposta de operação incluída no SGRF que

  permita ao operador interessado operar sob limites diferentes dos estipulados na Lei

  nº 13.475, de 28 de agosto de 2017, ou dos Apêndices B ou C do RBAC nº 117.

  Correspondente à expressão safety case utilizada internacionalmente; e

  k. tripulações aumentadas significam tripulações composta ou de revezamento.

  4.3 Referências

  a. RBAC nº 117;

  b. IS nº 117-001;

  c. IS nº 119-002 (SGSO);

  d. CAAP 48-1 da CASA;

  e. AC 120-03A da FAA; e

  f. AC 117-001 da FAA.'
