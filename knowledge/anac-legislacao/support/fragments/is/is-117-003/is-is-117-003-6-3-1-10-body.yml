text: '6.3.1.10 desta IS).

  e. Registros.

  i. Procedimentos utilização e conservação de registros, incluindo reportes de

  ocorrência de fadiga (vide item 6.2.5 desta IS).

  f. Procedimentos operacionais.

  i. Procedimentos para retirar do voo tripulantes que se declarem inaptos para o

  voo por motivo de fadiga. Vide o item 6.2.2 desta IS.

  ii. Procedimentos para selecionar os locais para repouso dos tripulantes (quando

  fora da base contratual). Vide o item 6.2.3 desta IS.

  iii. Procedimentos de descanso para tripulações compostas e de revezamento (se

  aplicável). Vide o item 6.4.4 desta IS.

  iv. Procedimento para análise de reportes (tempo máximo), tipos de mitigações

  e tempo máximo para feedback ao tripulante. Vide o item 6.3.4.17 desta IS.

  v. Procedimentos de extensão de jornada devido a circunstâncias operacionais

  imprevistas. Vide o item 6.4.6 desta IS.

  vi. Procedimentos para determinação da base contratual do tripulante. Vide o

  item 6.2.6 desta IS.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  vii. Procedimentos para a disponibilização de refeições para os tripulantes. Vide

  o item 6.2.4 desta IS para maiores detalhes.

  viii. Procedimentos para a elaboração e publicação de escalas. Vide o item 6.2.7

  desta IS.

  ix. Procedimentos para atender aos requisitos de gerenciamento de risco de

  fadiga (vide itens 6.3.3.2, 6.3.4.17, 6.3.6, 6.3.7 e 6.3.8 , além da Figura 1 desta

  IS).

  x. Procedimentos para o estabelecimento de limitações levando em conta os

  perigos (vide item 6.3.6 desta IS).

  xi. Procedimentos para atender aos requisitos de operações em múltiplos

  apêndices (vide o item 6.3.3 desta IS).

  xii. Procedimentos para o desenvolvimento e manutenção de uma cultura de

  segurança operacional positiva (vide itens 6.3.10 e 7.2.4 desta IS).

  xiii. Procedimentos para garantir oportunidade de sono à tripulação anterior à

  jornada (vide item 6.4.1 desta IS).

  xiv. Procedimentos de determinação da aclimatação (vide item 6.3.9 desta IS).

  xv. Procedimentos para jornada interrompida (vide item 6.4.3 desta IS).

  xvi. Procedimentos de operação com tripulações compostas e de revezamento

  (vide item 6.4.4 desta IS).

  xvii. Procedimentos a seguir no caso de atraso ou cancelamento na apresentação

  (vide item 6.4.5 desta IS).

  xviii. Procedimento para reprogramação e extensão (vide item 6.4.6 desta IS).

  xix. Procedimentos de sobreaviso e reserva (vide item 6.4.7 desta IS).

  xx. Procedimentos para repouso (vide itens 6.4.8 e 6.4.9 desta IS).

  xxi. Procedimentos para cumprimento de jornada de trabalho e tempo de voo

  acumulados (vide itens 0 e 6.4.11 desta IS).

  xxii. Procedimentos para operação na madrugada (vide item 6.4.12 desta IS).Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B'
