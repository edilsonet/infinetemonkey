title: OBRIGAÇÕES DOS OPERADORES GRF
text: '6. OBRIGAÇÕES DOS OPERADORES GRF

  6.1 Introdução

  6.1.1. As seções 117.19 e 117.61 do RBAC nº 117 informam que os operadores que desejarem

  operar segundo o nível GRF possuem uma série de obrigações.

  6.1.2. A principal obrigação do operador é dar condições para que o tripulante se encontre
  apto

  para o trabalho, não permitindo que uma jornada seja realizada em situação que

  sabidamente leve à fadiga ou que um tripulante fatigado assuma uma jornada [117.19(a)].

  6.1.3. Os operadores do nível GRF têm obrigação de desenvolver políticas e procedimentos
  para

  os itens 6.2, 6.3 e 6.3.10 desta IS.

  6.1.4. Os operadores que tiverem um Sistema de Gerenciamento de Segurança Operacional

  (SGSO) eficaz estarão familiarizados com esses processos e tal SGSO provavelmente

  será capaz de cumprir as obrigações de identificação de perigos e monitoramento

  contínuo.

  6.2 Obrigações referentes à seção 117.19

  6.2.1. Manual do Operador (MO) [117.19(a)]

  6.2.1.1. As empresas que operam segundo os RBAC nº 121 e 135 e que foram aprovadas para

  operar no nível GRF deve cumprir as limitações contidas nas seções 117.19 e 117.61 e

  dos Apêndices B ou C (conforme aplicável) do RBAC nº 117.

  6.2.1.2. Deste modo, o MO deve conter as políticas e procedimentos descritos nos itens 6.2,
  6.3 e

  6.3.9desta IS.

  6.2.1.3. O Apêndice A desta IS apresenta informações adicionais sobre o capítulo de fadiga
  do

  MO que operam sob um GRF. Caso desejem, os operadores podem desenvolver um

  manual específico para disciplinar o gerenciamento de fadiga na empresa.

  6.2.2. Aptidão para o trabalho [117.19(a)]Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  6.2.2.1. Conforme estipulado no parágrafo 117.19(a), nenhum operador pode requerer que um

  tripulante opere uma aeronave se, considerando as circunstâncias do voo a ser realizado,

  o operador tiver razões para acreditar que aquele tripulante esteja, ou provavelmente

  venha a estar, sob o efeito de fadiga que possa prejudicar o desempenho do tripulante de

  modo a afetar a segurança da operação. O operador pode chegar a esta conclusão a partir

  de estudos próprios (informação científica, experiência anterior, modelagem

  biomatemática, recomendação do GAGEF, etc.) ou a partir de informações fornecidas

  pelos próprios tripulantes, seja por meio de uma simples declaração de “inaptidão para

  assumir o voo ou a jornada” ou um reporte mais detalhado (como o exemplo do Apêndice

  D).

  6.2.2.2. Os operadores devem descrever no seu MO os procedimentos para retirar do voo

  tripulantes que se declarem inaptos para o voo por motivo de fadiga.

  6.2.3. Acomodações para repouso [117.3(b)(3)]

  6.2.3.1. Os operadores devem estar cientes da exigência de que os tripulantes tenham uma

  oportunidade de sono antes de realizar uma jornada, um sobreaviso ou uma reserva. A

  oportunidade de sono deve dispor acomodações adequadas para dormir, podendo ocorrer

  na residência do tripulante ou em outro local (por exemplo, um hotel).

  Nota: de acordo com o parágrafo 117.3(b)(3) do RBAC nº 117, é informado que na

  “base contratual de trabalho do tripulante, a moradia contempla os requisitos de

  acomodação para repouso”; deste modo, não é necessário que o operador gerencie as

  condições de repouso da moradia do tripulante.

  6.2.3.2. Os operadores deveriam considerar procedimentos que minimizem interrupções no sono

  dos tripulantes. Períodos de repouso devem incluir blocos definidos de tempo

  (oportunidades de sono), durante os quais os tripulantes não são contatados. Todo o

  pessoal relevante (por exemplo, o pessoal da elaboração da escala de tripulantes) deveria

  estar ciente dessas oportunidades de sono protegidas. Os operadores também devem

  desenvolver procedimentos para proteger o sono dos tripulantes nos lugares de pernoite.

  6.2.3.3. A ergonomia física das instalações para dormir e descansar deveria ser levada em
  conta,

  a fim de garantir que o pessoal possa obter uma recuperação adequada e estar apto para a

  próxima jornada. Sugere-se que os operadores considerem os fatores ergonômicos do

  trabalho, bem como as facilidades disponíveis nas instalações, ao gerenciar a fadiga nas

  operações.

  6.2.3.4. Os operadores devem considerar e gerenciar cuidadosamente como a localização da

  acomodação para repouso pode afetar a qualidade do sono. Ao considerar um local para

  acomodação, os operadores devem levar em conta os seguintes fatores para que se cumpra

  a oportunidade mínima de sono e o tempo hábil para necessidades fisiológicas:

  a. distância do deslocamento de / para o local de repouso ou descanso;

  b. opções de transporte (quanto menos opções, maior dependência de apenas um, o

  que demanda um plano alternativo em caso de problemas; avaliar locais com muito

  tráfego e engarrafamentos previsíveis que poderiam ser evitados);

  c. possíveis incômodos ou interrupções (por ex.: ruído exacerbado devido a obras nas

  proximidades, vias de alto tráfego, bares, locais de shows, eventos);Data de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  d. possibilidade de realizar ligações telefônicas;

  e. limpeza das instalações;

  f. serviço de quarto;

  g. trabalho de manutenção nas instalações;

  h. controle de temperatura acessível e em pleno funcionamento;

  i. opções de compartilhamento de quartos (compartilhamento de quartos podem

  prejudicar o sono);

  j. controle de iluminação acessível e em pleno funcionamento;

  k. hábitos sociais (por exemplo, horários de refeições locais, horários de chegada /

  partida de outros hóspedes, etc.);

  l. garantia da segurança pessoal nas instalações (chaves individuais, portaria,

  vigilância).

  6.2.3.5. Os operadores também deveriam considerar como o local de repouso pode interagir
  com

  diferentes horários. Um tripulante pode ser sensível a alterações horárias de 1 ou 2 horas,

  quando há diferença de horários de verão e/ou quando o repouso ocorre em outro fuso

  dentro do país. Por exemplo, um tripulante adaptado ao fuso -3 UTC, cujo repouso

  aconteça em Manaus (1 hora a menos), ou Rio Branco (2 horas a menos) poderá:

  a. impactar os hábitos sociais relativos ao horário das refeições e dos horários de sono

  / despertar;

  b. exigir que o tripulante se ajuste à hora local; e

  c. exigir que o tripulante adiante seu relógio biológico.

  6.2.3.6. A diferença entre a necessidade de acordar às 05:00 horas ou 06:00 horas pode ser
  a

  diferença entre os efeitos da janela de baixa do alerta do ciclo circadiano (WOCL)

  impactando no desempenho ao longo do dia ou não.

  6.2.4. Fornecimento de refeições

  6.2.4.1. Os operadores devem fornecer alimentação aos tripulantes conforme requerido pelos
  arts.

  61 até 64 da Lei nº 13.475/17.

  6.2.5. Conservação de registros [117.19(e)]

  6.2.5.1. O parágrafo 117.19(e) do RBAC nº 117 requer que o operador mantenha registros em

  relação às listas de membros da tripulação, tempos reais de serviço e tempos de voo

  (incluindo reportes de situações onde a jornada é estendida sob uma cláusula de

  "extensão").

  6.2.5.2. Esses registros e reportes devem ser mantidos por cinco anos, como determinado
  pelo

  parágrafo 117.19(e)(2) do RBAC nº 117. Os operadores devem manter registros da

  duração de todos os períodos de serviço realizados por um tripulante, como qualquerData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  tarefa que um tripulante tenha realizado para o operador (incluindo atividades de

  escritório).

  6.2.5.3. Quando for usada uma extensão que exceda o limite "prescritivo" contido no MO,
  um

  reporte deve ser preenchido pela tripulação sempre que ela acreditar que houve fadiga

  (consulte o Anexo A desta IS para um exemplo de um reporte de ocorrência de fadiga).

  6.2.6. Determinação da base contratual do tripulante [117.19(f)]

  6.2.6.1. É necessário que o operador determine e notifique cada um de seus tripulantes do
  seu

  aeroporto de base contratual.

  6.2.6.2. Detalhes do processo para fazer essas determinações da base contratual devem ser

  incluídos no MO. Isso permite que os tripulantes entendam os procedimentos associados

  a essas determinações (por exemplo, o tempo disponível para os seus deslocamentos na

  base contratual, locais adequados de moradia etc.).

  6.2.6.3. Os operadores devem garantir que as mudanças de base contratual não afetem

  adversamente a segurança das operações. É necessária uma análise cuidadosa das

  consequências dessa mudança para o tripulante e como isto poderá afetar o seu estado de

  alerta.

  6.2.6.4. As determinações da base contratual devem ser feitas com um alto grau de permanência,

  de modo a não interromper as rotinas de recuperação de fadiga do tripulante entre as

  jornadas.

  6.2.6.5. Este item não isenta o operador de observar os regramentos do direito trabalhista
  quanto

  à determinação da base contratual do tripulante.

  6.2.7. Elaboração e publicação de escalas [117.19(g)]

  6.2.7.1. É importante que os operadores publiquem a escala de serviço com antecedência

  suficiente para que seja comunicada a todos os tripulantes e permitir que eles organizem

  seu trabalho, sono e outros aspectos da vida pessoal. O parágrafo 117.19(g) do RBAC nº

  119 informa que devem ser seguidos os requisitos mínimos dos arts. 26 até 28 da Lei nº

  13.475/17 para a elaboração e divulgação das escalas de serviço.

  6.2.7.2. Recomenda-se, no entanto, que o período mínimo de notificação tenha a maior

  antecedência possível quando um tripulante for escalado para viagens que:

  a. envolverem operações com tripulação composta e de revezamento;

  b. cruzarem três ou mais fusos horários;

  c. incluírem duas ou mais operações noturnas; ou

  d. incluírem jornadas interrompidas.

  6.2.7.3. Para operações sob demanda, particularmente aquelas em que os tripulantes são

  empregados ocasionalmente, pode haver pouca oportunidade de notificar uma próxima

  jornada. Exceto se a jornada for bastante curta, um operador deveria ter procedimentos

  que envolvam a divulgação de uma jornada casual, pelo menos um dia antes desta ocorrer.

  Esses procedimentos, portanto, permitiriam que o tripulante, antes de aceitar a jornada,Data
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  considere a sua aptidão para o trabalho e se será ou não capaz de garantir um repouso

  adequado antes. Como um guia, para uma jornada ser considerada bastante curta, não

  excederá 50% do limite de jornada de voo para o horário de início aplicável. Além disso,

  se houver algum aumento no limite da jornada por meio do uso de tripulações

  aumentadas, jornada interrompida ou reprogramação, o período de notificação precisará

  ser aumentado adequadamente.

  6.2.7.4. Embora as alterações posteriores às escalas sejam compreensíveis, é importante
  que essas

  alterações sejam mínimas, ou seja, que a escala seja o mais estável possível.

  6.2.7.5. É importante haver procedimentos em vigor para que qualquer risco de fadiga resultante

  dos efeitos das mudanças na escala após publicação seja gerenciado. Isso é

  particularmente importante para operações com tripulação composta ou de revezamento

  e o subsequente planejamento do descanso em voo.

  6.3 Obrigações referentes à seção 117.61

  O conjunto de políticas e procedimentos de um GRF - Gerenciamento de Risco de Fadiga,

  pode ser resumido na figura abaixo:

  Figura 1: Atividades do Gerenciamento de Risco da Fadiga (GRF)

  6.3.1. Treinamento [117.61(d)(e)(f)(g)(h)]

  6.3.1.1. [117.61(d)(1) e 117.61(f)] O operador deve realizar treinamento inicial e periódico
  dos

  funcionários responsáveis pelo cumprimento das regras do RBAC nº 117, ou seja,

  gestores, tripulantes, despachantes operacionais de voo e pessoal da escala de voo,

  abordando provisões relevantes sobre os riscos relacionados à fadiga nas suas atribuições,

  conforme currículo proposto no Apêndice B desta IS.Data de emissão: 31 de janeiro de 2020
  IS nº 117-003

  Revisão B

  6.3.1.2. Para cumprir suas obrigações de treinamento, o operador deve:

  a. alocar recursos adequados para treinamento em fadiga (incluindo instrutores,

  recursos de instrução e tempo); e

  b. aceitar que os benefícios do treinamento em fadiga não serão realizados sem

  investimentos e esforços contínuos.

  6.3.1.3. [117.61(g)] Os operadores deveriam adaptar seus programas de treinamento para incluir

  tópicos relevantes para sua própria operação. Por exemplo, após o treinamento, os

  tripulantes devem estar cientes dos procedimentos contidos no MO, dos limites e das

  obrigações do operador e dos tipos de operações realizados pela empresa.

  6.3.1.4. O treinamento deve ser conduzido em uma base inicial e periódica. O intervalo entre
  dois

  treinamentos consecutivos deve ser de no máximo dois anos. No entanto, quando um

  operador identifica uma necessidade de treinamento a intervalos mais curtos (por

  exemplo, aclimatação, sequenciamento de noites/madrugadas, jornadas longas ou

  quaisquer dúvidas dos tripulantes ou pessoal relevante), deve oferecê-lo o mais breve

  possível.

  6.3.1.5. O treinamento requerido pelo RBAC nº 117 pode ser integrado a outro treinamento

  conduzido por um operador (como por exemplo, periódico, fatores humanos / treinamento

  de habilidades não técnicas etc.). No entanto, todos os tópicos constantes do Apêndice B

  desta IS devem ser ministrados.

  6.3.1.6. Os critérios de avaliação podem ser extraídos da análise inicial das necessidades
  de

  treinamento. O pessoal de treinamento é incentivado a usar sua experiência para

  desenvolver critérios de avaliação adaptados à realidade de suas operações.

  6.3.1.7. [117.61(d)(2) e [117.61(h)(2)] O treinamento sobre fadiga deve ser encerrado com
  uma

  avaliação. O principal objetivo dessa avaliação é determinar em que medida os

  participantes do programa de treinamento estão aprendendo. Sugere-se uma média de

  aprovação de 80%, em uma escala de 0% a 100%.

  6.3.1.8. O treinamento sobre fadiga deve ser incluído no programa de treinamento aprovado
  do

  operador e enviado para análise da ANAC. O treinamento somente terá validade caso seja

  feito de acordo com o programa aprovado.

  6.3.1.9. [117.61(e)] Execução do treinamento.

  a. Operadores que foram certificados no GRF até 28 de fevereiro de 2020:

  i. o conteúdo do treinamento previsto no Apêndice B desta deve ser ministrado

  em até 12 meses após a data de aprovação do GRF;

  ii. o operador deve prover, no mínimo, um plano de comunicação aos seus

  funcionários de modo que, até 28 de fevereiro de 2020, eles sejam

  comunicados sobre o conteúdo das Seções 6 e 7 desta IS.

  iii. adicionalmente, tal comunicado deve incluir alertas sobre a mudança das

  regras de fadiga (transição das Leis nº 7.183/84 e nº 13.475/17 para o RBAC

  nº 117), o que é fadiga, o que é o GAGEF e quem o compõe, como fazer o

  reporte de fadiga na empresa, qual o contato para dúvidas relativas ao RBACData de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  nº 117 e outros aspectos considerados importantes pela empresa.

  b. Operadores certificados no GRF após 28 de fevereiro de 2020:

  i. todo o pessoal requerido pela seção 117.61(d)(1) deve estar treinado antes do

  início da aprovação daquele programa.

  6.3.1.10. [117.61(i)] Os registros relativos aos treinamentos (materiais, datas, instrutores,
  tutores,

  certificados, avaliações etc.) devem ser mantidos por pelo menos 5 (cinco) anos.

  6.3.1.11. O treinamento é uma estratégia essencial de divulgação do GRF, mas não a única.
  Por

  isso, o operador deve ter ciência de que outras formas de promoção rotineiras, simples e

  úteis complementam e mantém a importância do assunto em dia.

  6.3.1.12. Recomenda-se fortemente que o primeiro treinamento seja realizado presencialmente,

  devido à complexidade do assunto e o momento de transição de regras.

  6.3.1.13. Treinamentos à distância poderão ser ofertados, desde que demonstrem claramente
  o

  cumprimento do conteúdo e a adequação do tempo disponibilizado (vide Apêndice B

  desta IS). Recomenda-se que, se for esta a opção do operador, ocorra apenas nos

  periódicos.

  6.3.2. Grupo de Ação de Gerenciamento da Fadiga - GAGEF [117.61(c)(7)]

  6.3.2.1. O parágrafo 117.61(c)(7) requer a criação de um GAGEF para implantar e coordenar
  as

  atividades do GRF de um operador.

  6.3.2.2. A composição do GAGEF está indicada no parágrafo 117.3(i) do RBAC nº 117, como
  se

  segue: “grupo, composto de representantes de todos os envolvidos nas ações de

  gerenciamento da fadiga, que é responsável por coordenar as atividades de gerenciamento

  da fadiga na organização. A implantação e a atualização do Sistema de Gerenciamento

  de Risco de Fadiga Humana devem ser acompanhadas pelo sindicato da categoria

  profissional”.

  6.3.2.3. O tamanho e a composição do GAGEF irão variar em função do porte do detentor de

  certificados, do tamanho e da complexidade das operações cobertas pelo GRF e ao nível

  de risco de fadiga dessas operações.

  6.3.2.4. Os operadores aéreos de médio ou de grande porte terão departamentos especializados

  que irão interagir com o GAGEF. A Figura 2 e a Figura 3 apresentam exemplos dessas

  inter-relações. Cada operador deve decidir, com base na sua experiência, os setores que

  devem participar do seu GAGEF.

  6.3.2.5. Para um grande operador, recomenda-se que o GAGEF tenha, no mínimo, a seguinte

  composição:

  a. representantes da administração com autoridade e responsabilidade

  (accountability) para coordenar e autorizar as ações decorrentes das decisões

  emanadas das reuniões do Grupo;

  b. representantes dos pilotos, comissários, despachantes operacionais, pessoal de

  escala de voo e pessoal da área de fatores humanos ou similar;Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

  c. representantes da área de SGSO; e

  d. em caráter interino ou eventual, consultores (especialistas) com domínio na área

  científica, médica, ou qualquer outra que seja pertinente ao problema sendo

  analisado.

  6.3.2.6. A Figura 2 abaixo, ilustra a composição de um GAGEF de um operador aéreo de médio

  ou grande porte.

  Figura 2: Composição do GAGEF de operadores médios ou grandes.

  6.3.2.7. Para pequenos operadores, um único indivíduo pode representar mais de um grupo
  de

  partes interessadas. Por exemplo, o piloto chefe também pode ser o escalador.

  6.3.2.8. A Figura 3 abaixo, ilustra a composição do GAGEF para um pequeno operador aéreo.

  Figura 3: Composição do GAGEF de operadores pequenos.

  6.3.2.9. Embora a ANAC possa observar as reuniões do GAGEF (ou analisar as atas e resultados)

  como parte de suas atividades de fiscalização, ela não é um componente desse grupo.

  6.3.2.10. A categoria de representantes de tripulantes pode incluir os tripulantes da própria
  empresa

  e representantes de Associações, se houver.

  6.3.2.11. Participação do Sindicato Nacional dos Aeronautas (SNA).

  a. As atividades de implantação (certificação) e atualização do GRF, como informado

  pelo RBAC nº 117, devem ser acompanhadas pelo sindicato da categoria

  profissional dos aeronautas (vide a seção 117.3(i) do RBAC nº 117).Data de emissão: 31 de
  janeiro de 2020 IS nº 117-003

  Revisão B

  b. Em função do item acima, o representante indicado pelo SNA:

  i. deve ter acesso aos procedimentos, atas de reunião, relatórios e demais

  documentos pertinentes relacionados ao GRF e que tenham passado pelo

  GAGEF;

  ii. deve participar das reuniões do GAGEF. Para detentores de certificado que

  operem segundo as regras do RBAC nº 121 a participação deve ser

  obrigatoriamente presencial;

  iii. recomenda-se o envio da documentação ao representante do SNA em até 2

  dias contados da data reunião ou da confecção da respectiva ata, a qual deve

  ser assinada pelo SNA.

  c. Sobre os documentos a serem tratados no GAGEF, recomenda-se a desidentificação

  de reportes ou casos que adentrem a individualidade.

  d. É importante ressaltar que a ANAC irá considerar, nas suas análises, as informações

  do SNA sobre o GRF do operador.

  e. Os participantes do sindicato no GAGEF devem ser formalmente indicados pelo

  presidente do Sindicato. Eles devem receber treinamento sobre o assunto e assinar

  um termo de responsabilidade e de confidencialidade elaborado pelo operador, para

  resguardo de informações às quais tiver acesso.

  6.3.2.12. As atribuições do GAGEF são aquelas relacionadas as atividades constantes das
  seções'
