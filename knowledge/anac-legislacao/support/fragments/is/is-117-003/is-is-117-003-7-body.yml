title: OBRIGAÇÕES INDIVIDUAIS DOS TRIPULANTES
text: '7. OBRIGAÇÕES INDIVIDUAIS DOS TRIPULANTES

  7.1 Aptidão para o trabalho

  7.1.1. Aspectos gerais

  7.1.1.1. Conforme estipulado no parágrafo 117.21(a) do RBAC nº 117, um tripulante deve utilizar

  a oportunidade de sono, os períodos de repouso, descanso e adaptação, garantidos pelo

  seu empregador, para obter a quantidade de sono suficiente para realizar com segurança

  qualquer atividade prevista na escala de trabalho.

  7.1.1.2. O tripulante deve negar operar uma aeronave se acreditar que tal situação possa

  comprometer seu estado de alerta e afetar a segurança de uma operação. Se for este o

  caso, ele deve informar ao operador a impossibilidade de assumir a jornada a qualquer

  tempo.

  7.1.1.3. Situações de vida mais ou menos permanentes que possam gerar fadiga e afetar o
  nível

  de alerta também são de responsabilidade do tripulante e devem ser informadas ao

  operador, conforme item 7.2 desta IS.

  7.1.1.4. Pode ser difícil ao tripulante avaliar se está fatigado ou não. Embora o treinamento

  oferecido pelo operador preveja o ensino de identificação e técnicas para administrá-la,
  a

  principal chave do gerenciamento é o autoconhecimento. Observar-se cuidadosamente,

  prestar atenção aos próprios hábitos e necessidades, experimentar novas situações geram

  resultados que se tornam a principal referência para o gerenciamento individual da fadiga.

  7.1.1.5. Cumpre salientar que a acomodação para repouso na base, ou seja, a moradia, é de

  responsabilidade do tripulante. Uma vez informado ao operador, considera-se que o local

  está de acordo com os requisitos de acomodação para repouso definidos no RBAC nº 117,

  não cabendo ao operador verificá-lo. O mesmo se aplica aos outros locais informados

  pelo tripulante em que o hotel possa ser dispensado.

  7.1.1.6. Também é importante o tripulante ter claro que o sobreaviso não se confunde com

  repouso ou folga. Por isso, para esta condição, são recomendadas atividades leves, que

  não levem ao estresse físico, cognitivo ou emocional. Atividades que exijam muita

  atenção, como dirigir, devem ser evitadas em excesso.

  7.1.1.7. A escolha do local para cumprir o sobreaviso é de responsabilidade do tripulante.

  Recomenda-se ele ocorra em local com fácil acesso à acomodação para repouso, de forma

  que o descanso ou o sono sejam possíveis para preparação de um eventual chamado, e

  que o tempo de deslocamento até o aeroporto seja o menor possível.

  Atenção especial deve ser dada ao sobreaviso diurno, cujo acionamento pode resultar em

  uma jornada noturna. Para tanto, o tripulante deve se manter preparado durante o dia para

  ficar acordado mais do que esperado, utilizando adequadamente horários propícios ao

  cochilo (por exemplo, a janela de sono da tarde) e evitando atividades e tarefas que

  exijam o cognitivo, o emocional ou o físico em demasia. Avisar a família sobre esta

  condição antecipadamente pode ajudar a manter o ambiente adequado.

  7.1.2. Medição individual de alerta

  7.1.2.1. Determinar a aptidão para o trabalho sempre foi uma tarefa complexa e desafiadora,
  tantoData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  para os operadores, que devem ministrar treinamento aos funcionários para que estes

  entendam como cumprir suas responsabilidades, quanto para os próprios funcionários.

  7.1.2.2. Uma abordagem multi-método se mostra particularmente útil, dado que diversas

  pesquisas em fadiga demonstraram que os seres humanos são pouco precisos em

  determinar o quão fatigados eles realmente estão. A melhor abordagem para medir o nível

  de alerta de um indivíduo é combinar informações de várias fontes. Embora nenhuma

  ferramenta ou método esteja livre de limitações na medição, é mais provável que a

  obtenção de informações de diversas fontes forneça ao indivíduo uma imagem mais

  precisa sobre como tomar suas decisões em relação ao nível de alerta. Por exemplo, em

  vez de confiar apenas em sua avaliação genérica do seu grau de fadiga, os tripulantes

  poderiam referenciar melhor essa avaliação usando uma escala, como a escala Samn-

  Perelli, e adicionalmente, melhorar a precisão dessa avaliação considerando um ou mais

  das seguintes fontes de informação:

  a. seu histórico de sono, especialmente se mantiveram um diário de sono pessoal;

  b. monitoramento de indicadores comportamentais / cognitivos / emocionais (por

  exemplo, pálpebras caídas, tempo de processamento de informações mais lento,

  humor negativo);

  c. considerando suas respostas a fatores relevantes para a fadiga (por exemplo,

  duração do sono, qualidade do sono, ambiente do sono, fusos horários cruzados);

  d. completar um teste de vigilância psicomotora portátil (PVT), por pelo menos 5

  minutos; ou

  e. examinando pontuações de ferramentas de monitoramento do sono (como

  actímetros).

  7.1.2.3. O uso de uma variedade de medidas (ou seja, dados objetivos e subjetivos) para

  determinar uma "imagem" do estado de alerta ajudará ao tripulante a tomar melhores

  decisões sobre o gerenciamento de sua fadiga e se ele está apto para o trabalho.

  7.1.2.4. Também é importante reconhecer que os tripulantes que estão fatigados terão prejuízo
  na

  tomada de decisões (por exemplo, sobre seus níveis de alerta) e terão pior julgamento em

  termos de como estão fatigados e se estão realmente aptos para o trabalho. Isso ocorre

  porque a capacidade de resolver problemas e tomar decisões é reduzida quando sofrem

  de fadiga. Operacionalmente, isso pode significar que tripulantes fatigados que fazem

  uma avaliação sobre sua aptidão para o trabalho podem interpretar mal os resultados dos

  testes ou utilizar ferramentas de medição incorretamente.

  7.1.2.5. A comunicação sobre a intensidade de sua fadiga pode não ser eficaz quando um

  tripulante está fatigado. Como a criatividade (juntamente com a capacidade de resolver

  problemas) também é reduzida quando se sofre de fadiga, um tripulante será menos

  efetivo ao:

  a. determinar formas eficazes de gerenciar a fadiga;

  b. abordar questões de alerta; e

  c. identificar potenciais riscos e perigos.Data de emissão: 31 de janeiro de 2020 IS nº
  117-003

  Revisão B

  7.1.2.6. Para evitar julgamento e tomada de decisão de baixa qualidade, a ANAC recomenda

  envolver no processo de medição do estado de alerta um indivíduo não fatigado para

  ajudar o tripulante a avaliar a aptidão para o trabalho.

  7.1.2.7. Fatores importantes que fornecem informações ao determinar a aptidão para o trabalho

  são a medição do(e):

  a. histórico de sono;

  b. alterações no ritmo circadiano;

  c. risco operacional; e

  d. a hora da operação proposta.

  7.1.2.8. O Apêndice D desta IS fornece um exemplo de um método útil para auxiliar um indivíduo

  considerar fatores que afetam o seu estado de alerta. A intenção desta ferramenta é que

  ela seja usada de maneira proativa para ajudar um tripulante que acredita apresentar um

  risco de fadiga, mas não tem certeza se deve iniciar o trabalho, ou não tem certeza por

  quanto tempo permanecerá com um nível razoável de alerta.

  7.1.2.9. É importante que os operadores e funcionários entendam que a ferramenta no Apêndice

  D não pretende fornecer um resultado "apto ou não-apto". Haverá também situações em

  que os tripulantes precisarão iniciar as operações e gerenciar seu risco de fadiga por meio

  do uso de outras contramedidas (por exemplo, rodízio de tarefas ou cochilos em solo).

  7.1.2.10. Note que a ferramenta apresentada no Apêndice D é apenas um exemplo de auxílio
  para

  tomar decisões ao determinar a aptidão para o trabalho. Os operadores ou tripulantes

  podem utilizar outras formas para determinar a aptidão para o trabalho, os quais devem

  ter sua validade estabelecida e serem simples o suficiente para serem utilizáveis no dia
  a

  dia. O gerenciamento da fadiga precisa ser específico para o contexto de risco operacional

  do operador.

  7.1.3. Reporte de ocorrência de fadiga

  7.1.3.1. A forma mais eficaz de o tripulante informar uma questão relativa à fadiga (mesmo

  quando não se tem certeza) é por meio de um reporte formal. Dedicar um tempo e esforço

  para preencher os dados pode gerar um resultado importante para a segurança e para a

  organização. Compartilhar a experiência com colegas e descobrir que já houve situações

  semelhantes ajuda no entendimento da questão, mas pode não evoluir se tal não for

  formalmente repassado e tratado pelo operador. O reporte deve ser analisado pelo

  operador, e um feedback formal deve ser fornecido ao tripulante que gerou o reporte.

  7.1.3.2. As obrigações de identificação de perigos dos operadores dependem de reportes de

  tripulantes quando eles acreditam que a fadiga levou a uma redução nas margens de

  segurança, ou que levaria a uma redução nas margens de segurança se alguma ação

  mitigadora não tivesse sido tomada. Ressalta-se que os operadores devem envidar todos

  os esforços por meio do treinamento de fadiga para destacar a importância do relato

  voluntário preciso. De um modo geral, há quatro casos em que o relato de fadiga é

  essencial para a identificação efetiva de perigos (vide item 6.3.5.4 e consulte o Anexo
  A

  desta IS para um exemplo de um reporte de ocorrência de fadiga).

  7.1.4. Saúde e bem-estarData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  7.1.4.1. Faz parte da responsabilidade individual de cada tripulante o monitoramento de
  sua saúde

  e a busca por tratamento adequado quando necessário. São exemplos:

  a. problemas de saúde a curto prazo (agudos) ou crônicos;

  b. predisposições genéticas;

  c. nutrição;

  d. hidratação; ou

  e. distúrbios do sono.

  7.1.4.2. Há uma ampla gama de distúrbios do sono que podem gerar fadiga, afetando as funções

  circadianas, a quantidade e a qualidade do sono. É de responsabilidade do tripulante

  buscar diagnóstico médico quando se identificar com os sinais e sintomas, bem como

  seguir o tratamento, se for o caso.

  Os distúrbios do sono variam em gravidade, desde ocasionais e inconvenientes (por

  exemplo, jet lag) até crônicos e potencialmente com risco de vida (por exemplo,

  síndrome da apneia obstrutiva do sono). Os tripulantes têm o dever de monitorar e

  gerenciar quaisquer problemas de saúde que possam afetar sua aptidão para o

  trabalho, o que pode incluir o contato com um especialista médico. Os tripulantes

  devem estar cientes de que as dificuldades do sono podem existir ou podem se

  desenvolver no futuro e que elas devem ser tratadas de acordo, de modo que não afetem

  a segurança das operações.

  7.1.5. Carga de Trabalho

  7.1.5.1. Um dos tópicos principais ao considerar os fatores humanos e o desempenho humano
  nos

  sistemas de aviação é o gerenciamento da carga de trabalho. Embora existam várias

  conceituações de carga de trabalho, a carga de trabalho mental pode ser definida como

  uma função das demandas sob responsabilidade da tripulação e das capacidades da

  tripulação para atender a essas demandas.

  7.1.5.2. O gerenciamento de carga de trabalho para a tripulação requer consideração de:

  a. quanto a tarefa demanda de atenção;

  b. qual a capacidade de processamento das pessoas acerca da tarefa;

  c. se há tarefas duplas ou múltiplas a serem desempenhadas; e

  d. como as capacidades mentais estão sendo utilizadas.

  7.1.5.3. Embora o gerenciamento de carga de trabalho em si seja importante ao minimizar
  o risco

  de erro humano, também é provável que a carga de trabalho e a natureza das tarefas

  realizadas afetem a fadiga da tripulação. Até hoje, poucos estudos consideraram como a

  carga de trabalho influencia o estado de alerta (ou vice-versa); no entanto, é provável
  que

  sua interação exija consideração e gerenciamento.

  7.1.5.4. Atualmente, os fatores relacionados à carga de trabalho considerados mais evidente
  são

  a quantidade de etapas de voo cumpridas na mesma jornada (no sentido de, quanto maisData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  etapas, maior a carga de trabalho) e a duração da jornada (neste caso, especialmente as

  maiores de 8 horas).

  7.1.5.5. Técnicas típicas para gerenciar a carga de trabalho enquanto em serviço incluem:

  a. diminuição de tarefas;

  b. priorização de tarefas;

  c. delegação de tarefas;

  d. rotação de tarefas; e

  e. rotação de pessoal.

  7.1.5.6. Também é importante estar ciente do nível ideal de estresse ou excitação de uma
  pessoa,

  necessário para um desempenho ideal:

  a. reconhecer as vantagens do estresse e engajamento em uma tarefa;

  b. ter atitudes realistas em relação ao estresse entendendo que as pessoas reagem

  diferentemente a situações estressantes (por exemplo, emergências);

  c. usar comunicação eficaz com os colegas; e

  d. monitorar e observar comportamentos que possam indicar uma mudança no nível

  de carga de trabalho de uma pessoa (por exemplo, segurar os controles com firmeza,

  fixação no horizonte artificial, túnel com foco em uma tela).

  7.1.5.7. A carga de trabalho também é um fator cada vez mais importante para modelos

  biomatemáticos de previsão de desempenho. Vários modelos biomatemáticos de fadiga

  no mercado estão atualmente investigando e incorporando os efeitos da carga de trabalho

  no estado de alerta em seu conjunto de variáveis preditivas.

  7.1.5.8. No geral, os dados existentes sugerem que as relações entre carga de trabalho,

  desempenho e fadiga subjetiva são provavelmente complexas e que pesquisas adicionais

  são desejáveis. Para o pessoal da aviação, é importante considerar e gerenciar os efeitos

  da carga de trabalho e da fadiga individualmente ao gerenciar o risco, bem como a relação

  de interação que pode estar presente entre eles.

  7.1.6. Estratégias de mitigação da fadiga

  7.1.6.1. Um tripulante pode gerenciar a fadiga antes, durante e depois das jornadas de trabalho,

  empregando uma gama de estratégias de mitigação de fadiga que funcionem para suas

  necessidades pessoais. No gerenciamento de fadiga, a ferramenta mais potente é a

  proteção ao sono. Por isso, é importante estabelecer hábitos de sono eficazes, realizando

  a chamada higiene do sono, tais como:

  a. programando os horários para dormir;

  b. programando os horários para comer em função do horário para dormir (de modo

  que a digestão da refeição não interfira no sono e que não seja necessário levantar

  para comer);Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  c. tentando realizar uma atividade tranquila antes de dormir;

  d. estabelecendo uma rotina para dormir, sempre que possível;

  e. não comendo ou bebendo mais que o habitual antes de dormir (especialmente 3

  horas antes do sono pretendido);

  f. avaliando se exercícios físicos antes de dormir favorecem ou prejudicam o sono

  (vide 7.1.6.3);

  g. saindo da cama se não conseguir dormir, em busca de atividades calmas, não

  excitantes;

  h. usando técnicas de relaxamento;

  i. garantindo um ambiente de sono propício ao sono, especificamente que seja fresco,

  escuro e silencioso, com cama e travesseiro confortáveis.

  7.1.6.2. Uma das contramedidas de fadiga mais eficazes é cochilar; no entanto, é importante

  lembrar que o cochilo não deve ser considerado como uma alternativa para uma noite de

  sono regular. O cochilo pode ser útil ao suplementar um sono breve ou de baixa qualidade.

  Apenas 15 a 20 minutos podem aumentar o desempenho e o estado de alerta

  temporariamente. Deve-se ter cuidado ao planejar o cochilo, pois o cochilo por mais de

  45 minutos pode resultar em maior inércia do sono.

  7.1.6.3. O exercício físico também é um mitigador de risco de fadiga benéfico, pois melhora
  a

  energia e a resistência, melhora o humor, alivia o estresse e resulta em um sono mais

  longo e mais tranquilo. Entretanto, exercícios físicos aeróbicos aceleram o metabolismo,

  de modo que idealmente devem ser evitados antes de 3 horas do horário destinado ao

  sono. Este intervalo pode ser menor para pessoas acostumadas a treinar, principalmente

  à noite, de modo que a avaliação demanda autoconhecimento. De qualquer forma, não se

  deve acreditar que logo depois de uma atividade física, especialmente aeróbica, o sono

  será propiciado rapidamente.

  7.1.6.4. Nutrição e hidratação adequadas também são importantes para o gerenciamento e

  prevenção da fadiga. Idealmente, o tripulante deve:

  a. ter uma dieta equilibrada;

  b. comer regularmente;

  c. consumir lanches saudáveis;

  d. tomar café da manhã;

  e. fazer refeições planejadas;

  f. beber água regularmente; e

  g. evitar as refeições noturnas (que resultam em uma digestão mais lenta).

  7.1.6.5. Outra contramedida de fadiga popular é o uso da cafeína como estimulante. A cafeína

  pode melhorar o estado de alerta temporariamente, leva de 15 a 30 minutos para surtirData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  efeito e pode durar até 5 horas; no entanto, é importante considerar que existem diferenças

  individuais em termos dos efeitos da cafeína, que a tolerância e a abstinência podem se

  desenvolver, e que o uso deve ser evitado antes de dormir. A cafeína deve ser usada

  quando seu efeito tiver o maior impacto (ou seja, antes da descida e do pouso).

  7.1.6.6. Para aumentar a qualidade do sono, o álcool deve ser evitado antes de dormir. Embora

  culturalmente se acredite que o álcool favoreça o sono, na realidade ele prejudica o sono

  restaurador. Medicamentos que auxiliam o sono devem ser utilizados com cuidado e

  apenas sob orientação médica, pois podem levar à sonolência, confusão e esquecimento.

  A nicotina também deve ser evitada, pois é um estimulante que pode interferir no início

  e na manutenção do sono.

  7.1.6.7. Uma maneira ideal dos tripulantes acompanharem a qualidade do sono ou a eficácia
  das

  contramedidas de fadiga usadas é manter um registro do sono ou um diário do sono.

  Pesquisas sugerem que as pessoas (incluindo os tripulantes) tendem a superestimar a

  quantidade de sono obtido; portanto, um registro diário pode ajudar a ter uma lembrança

  precisa, e um histórico de sono entre períodos de folga, por exemplo. Um diário do sono

  pode incorporar:

  a. hora de dormir;

  b. hora do despertar;

  c. tempo na cama;

  d. humor ao despertar;

  e. nutrição / consumo de álcool do dia anterior;

  f. qualidade do sono (por exemplo, número de despertares percebidos durante a

  noite); e

  g. ambiente do sono (por exemplo, uma cama confortável, ventilação, iluminação,

  ruído).

  7.1.6.8. É de responsabilidade do tripulante levar em conta suas necessidades pessoais,

  ergonômicas e ambientais ao configurar as acomodações para repouso em sua casa.

  7.1.7. Fusos horários e aclimatação

  7.1.7.1. A responsabilidade de gerenciar os efeitos das mudanças de fuso horário e de aclimatação

  é compartilhada entre o operador e o tripulante. O operador deve fornecer condições de

  repouso e períodos de adaptação necessários, bem como oferecer treinamento sobre o

  assunto, ensinando ferramentas de avaliação de estado de alerta e contramedidas de

  fadiga.

  7.1.7.2. Por sua vez, o tripulante tem a obrigação de aplicar essas informações à sua situação
  ao

  decidir sua aptidão para o trabalho. Os tripulantes devem estar cientes de seus requisitos

  de adaptação de fuso horário pessoal. Estes podem diferir do que o RBAC nº 117

  especifica. Caso um tripulante sinta que não está apto para o trabalho após um período de

  folga ou após o cruzamento de fusos horários, deve relatar tal fato ao operador para que

  este possa avaliar se suas limitações e políticas de fadiga são adequadas.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  7.1.8. Tripulações compostas e de revezamento

  7.1.8.1. Com as instalações adequadas de descanso em voo, a tripulação pode revezar os períodos

  de descanso e compartilhar acomodações para gerenciar sua fadiga. É importante que as

  tripulações considerem que, com uma equipe aumentada (tripulação composta ou de

  revezamento), haverá variabilidade em termos de alerta e ajuste circadiano (ou seja, fuso

  horário / relógio biológico) entre os tripulantes. Além disso, todos eles terão diferentes

  necessidades de sono e diferentes efeitos quanto ao desempenho das contramedidas (por

  exemplo, uso de cafeína). Ao utilizar acomodações de descanso em voo, um tripulante

  deve fazê-lo de forma inteligente, em vez de fazer algo potencialmente estressante, o

  tripulante deve aproveitar o tempo para relaxar e tentar dormir.

  7.1.8.2. Existem vários estudos que analisam os efeitos da inércia do sono no desempenho,

  particularmente ao despertar do sono profundo. Os operadores e os tripulantes devem

  estar cientes e gerenciar o efeito da inércia do sono nas operações de voo (vide 6.4.4.3).

  7.2 Informações do tripulante que devem ser repassadas ao operador

  Os tripulantes devem considerar como seus arranjos de vida e tempo de deslocamento

  para o trabalho podem afetar seus níveis de fadiga. Quaisquer condições potencialmente

  problemáticas precisam ser informadas ao operador se elas tiverem, ou provavelmente

  virem a ter, um impacto no desempenho operacional.

  7.2.1. Moradia

  7.2.1.1. A escolha da moradia pode ter um impacto nos níveis de fadiga dependendo:

  a. locais de moradia compartilhados ou alternados;

  b. tempos de deslocamento longos e variáveis (por exemplo, devido à distância e ao

  congestionamento de tráfego);

  c. ambientes barulhentos ou interrupções de descanso em casa (por exemplo, obras ou

  escolas nas proximidades, ruído do tráfego, paredes não isoladas para sons etc.); ou

  d. ambientes ou áreas de descanso excessivamente iluminados (por exemplo,

  iluminação urbana brilhante, coberturas de luz inadequadas durante os períodos de

  descanso diurno).

  Os tripulantes podem achar que certas situações de vida únicas podem melhorar o

  estado de alerta e minimizar o risco de fadiga. Em alguns casos, pode ser benéfico

  viver longe de uma base contratual, em vez de mais perto. Um exemplo é onde a base

  contratual é continuamente ruidosa ou excessivamente iluminada durante períodos de

  sono / repouso ou durante a noite. Os tripulantes devem considerar seus arranjos de

  vida e quaisquer mudanças relação a qualquer impacto que possa ter sobre seu estado

  de alerta. Se surgirem situações potencialmente problemáticas, isso precisa ser

  informado ao operador.

  7.2.2. Emprego externo e outras atividades

  7.2.2.1. Os tripulantes têm a obrigação de gerenciar quaisquer atividades externas pessoais
  para

  garantir que não afetem seus níveis de fadiga durante as operações. Atividades externasData
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  como:

  a. obrigações domésticas;

  b. atividades de lazer;

  c. segundo emprego ou outras atividades;

  d. obrigações familiares;

  e. trabalho voluntário realizado fora do horário de trabalho;

  f. pilotagem noturna;

  g. voos privados não-recreativos;

  h. trabalho por turnos;

  i. administração de um negócio;

  j. realização de trabalhos que podem levar à desgaste físico ou mental;

  k. estudo ou cursos;

  l. dirigir.

  7.2.3. Voo privado

  7.2.3.1. O tripulante, que realiza voos particulares e atua como tripulante para um operador,
  tem

  a obrigação de declarar seus voos privados realizados em operações não recreativas. As

  operações de voo particulares cobrem uma ampla gama de atividades. Para fins de

  gerenciamento de fadiga, essas atividades podem ser divididas em:

  a. operações privadas recreativas; ou

  b. operações privadas não recreativas.

  7.2.3.2. Uma operação privada recreativa pode ser conduzida por um tripulante e não há limites

  atuais (além dos limites pessoais) que possam ser aplicáveis. No curso normal dos

  eventos, em que faz algum voo privado de recreio em um dia de folga o tripulante deve

  estar atento às políticas dos operadores para a relação entre fadiga e voos recreativos.

  7.2.3.3. Há indivíduos que realizam voos particulares que não são considerados recreativos
  (isto

  é, trabalho remunerado, voos de translado, ensaios em voo, voos de instrução etc.). Essas

  operações são vistas como mais difíceis de cancelar ou reprogramar e geralmente

  envolvem mais planejamento e complexidade operacional do que um voo recreativo

  tradicional. Elas podem ter um efeito sobre a jornada de trabalho subsequente para o

  piloto que também é empregado por um operador. Nesta situação, deve-se verificar os

  limites que se aplicam; no entanto, uma vez que o tripulante é empregado por um

  operador, essas atividades devem ser declaradas, pois elas farão parte dos limites de

  tempo de voo cumulativos do tripulante.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  7.2.4. Cultura de segurança operacional

  7.2.4.1. A fim de manter uma cultura de segurança operacional aberta e justa, os tripulantes

  precisam divulgar quaisquer situações que os estejam afetando, ou possam afetá-los no

  futuro, seu estado de alerta e conformidade com o RBAC nº 117. A divulgação também

  é consistente com as melhores práticas dos princípios de segurança e gerenciamento de

  riscos. Os tripulantes têm a obrigação de contribuir para essa cultura de segurança

  saudável e manter uma forte cultura de elaboração de reportes, o que, por sua vez, permite

  que ao operador gerenciar o risco de forma preditiva e proativa. Os funcionários precisam

  ser capazes de divulgar informações e discutir com o operador situações que possam gerar

  fadiga e afetar o estado de alerta em um ambiente aberto, comunicativo e confidencial,

  sem sentir medo de penalidade.'
