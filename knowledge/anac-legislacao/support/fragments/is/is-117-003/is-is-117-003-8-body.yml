text: '8. NECESSIDADE DE IMPLANTAR UM SGRF PARA UM OPERADOR DO GRF.

  8.1 Sempre que um operador do GRF determinar a necessidade de alterar uma limitação

  operacional contida da Lei nº 13.475/17 ou no RBAC nº 117, ele deve implantar (ou

  alterar) um Sistema de Gerenciamento de Risco da Fadiga, em conformidade com a seção'
