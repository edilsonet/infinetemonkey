title: PROCEDIMENTOS DE CERTIFICAÇÃO
text: '9. PROCEDIMENTOS DE CERTIFICAÇÃO

  9.1 Geral

  9.1.1. Cada detentor que conduza suas operações segundo os RBAC nº 121 ou 135 e desejar
  ter aprovado

  um GRF deve cumprir os requisitos contidos na Subparte A, na Subparte B, na Seção 117.61
  e

  nos Apêndices B ou C (conforme aplicável) do RBAC nº 117 (vide Tabela 1).

  9.2 Procedimentos específicos para operadores do GRF

  9.2.1. Detentores de certificado que desejem conduzir operações no GRF devem enviar à ANAC

  os seguintes documentos:

  a. revisão do MO com alterações requeridas pelas seções 117.19 e 117.61 e Apêndices

  B ou C;

  b. revisão do PTO com alterações requeridas pelas seções 117.19 e 117.61 para

  aprovação;

  c. nome do representante do SNA junto ao operador, incluindo o documento de

  indicação emitido pelo SNA.

  9.2.1.2. A revisão do MO requerida pela seção 117.19 do RBAC nº 117 pode ser feita tanto
  por

  alteração direta do MGO, quanto pelo desenvolvimento de um manual específico para

  fadiga, o qual será um dos anexos do MGO. O operador irá escolher o método que mais

  lhe convier.

  a. Em função do tamanho e da complexidade do operador, o MGO pode ser composto

  por um volume principal e complementado por publicações produzidas por outras

  organizações (governamentais ou comerciais) e por outros manuais ou trechos de

  manuais publicados pelo operador.

  b. Nos casos em que manuais e documentos que compõem o MGO tenham sido

  desenvolvidos separadamente, o operador deve elaborar o volume principal do

  MGO de forma a manter a estrutura de capítulos e seções estabelecida na seção 5.2

  da IS nº 121-005A ou da IS nº 135-002D e indicar no local correspondente onde a

  informação está disponível no documento ou manual complementar.Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

  c. Opção 1 de alteração do MO: alteração direta do MGO. As informações requeridas

  pelo Apêndice A desta IS devem ser inseridas nos seguintes capítulos do MGO:

  i. no Capítulo 7 - Gerenciamento da fadiga humana, previsto na IS nº 121-

  005A, para um operador certificado segundo as regras do RBAC nº 121; ou

  ii. na Seção 5 - Procedimentos para cumprimento da jornada de trabalho,

  previsto na IS nº 135-002D, para um operador certificado segundo as regras

  do RBAC nº 135;

  d. Opção 2 de alteração do MO: emissão de um manual específico para fadiga, embora'
