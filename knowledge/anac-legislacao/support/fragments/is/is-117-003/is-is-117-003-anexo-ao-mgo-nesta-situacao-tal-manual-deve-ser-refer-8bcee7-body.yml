title: anexo ao MGO. Nesta situação, tal manual deve ser referenciado no Capítulo 7 do
text: 'anexo ao MGO. Nesta situação, tal manual deve ser referenciado no Capítulo 7 do

  MGO (RBAC nº 121) ou na Seção 5 do MGO (RBAC nº 135). O manual específico

  deve ser levado a bordo da aeronave, uma vez que se trata de um anexo ao MGO.

  e. Nas duas opções acima, a alteração do MO deve ser enviada à ANAC como uma

  revisão do MGO.

  9.2.1.3. Em qualquer das opções, a revisão do MGO será aceita pela ANAC.

  9.2.1.4. O envio da documentação especificada no item 9.2.1 deve ser feito de acordo com
  os

  procedimentos contidos nos seguintes documentos:

  a. operadores certificados segundo as regras do RBAC nº 121:

  i. MGO: IS nº 121-005A (ou sua revisão mais recente): encaminhado à ANAC

  por um FOP 107, incluindo em anexo o nome e documento de indicação do

  representante do SNA;

  ii. PTO: IS nº 121-006A (ou sua revisão mais recente): encaminhado à ANAC

  por um FOP 107;

  b. operadores certificados segundo as regras do RBAC nº 135;

  i. MGO: IS nº 135-002D (ou sua revisão mais recente): encaminhado à ANAC

  por um FOP 207, incluindo em anexo o nome e documento de indicação do

  representante do SNA;

  ii. PTO: IS nº 135-003C (ou sua revisão mais recente): encaminhado à ANAC

  por um FOP 207.

  c. Os supracitados modelos de formulários, em sua versão mais atualizada, estão

  disponíveis para o usuário em formato editável no sítio da ANAC na rede mundial

  de computadores, no endereço eletrônico: http://www.anac.gov.br/assuntos/setor-

  regulado/empresas/acesso-rapido/modelos-e-formularios. Consultar as Tabelas 1

  (Formulários da IS nº 119-001F) ou 5 (Formulários da IS nº 119-004E) na referida

  página a fim de baixar o formulário adequado.

  9.2.1.5. O marco temporal para o início das operações sob um GRF será 30 dias após a data
  na

  qual a proposta de revisão do MO deu entrada na ANAC.'
