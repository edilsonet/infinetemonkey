text: 'APÊNDICE A. CONTEÚDO DO MANUAL DO OPERADOR DE GRF.

  A.1. Geral

  A.1.1. Este Apêndice apresenta o conteúdo mínimo que deve ser inserido no MO que tenha um

  GRF aprovado. Aplica-se apenas aos operadores dos RBAC nº 121 ou 135 (vide item 6.1

  desta IS).

  A.1.2. Determinação dos apêndices a serem utilizados pelo operador (consulte o item 5.2
  desta

  IS): confirme quais operações o operador está autorizado a conduzir e, portanto, os

  apêndices disponíveis. Um operador do GRF deve, no mínimo, utilizar o Apêndice B ou o'
