title: Apêndice A do RBAC nº 117. É importante observar que as limitações do Apêndice
text: 'Apêndice A do RBAC nº 117. É importante observar que as limitações do Apêndice

  A são aquelas constantes da Lei nº 13.475/17, acrescidas das definições das classes

  de descanso a bordo para tripulações compostas e de revezamento;

  b. GRF - Gerenciamento de Risco de Fadiga: permite maior flexibilidade com

  limitações de tempo de operação e de voo menos restritivas, mas exige que os

  operadores tenham implantado processos de gerenciamento de riscos, processos de

  monitoramento contínuo e um programa de treinamento para os tripulantes.

  Operadores regidos por um GRF devem cumprir as subpartes A e B, acrescidas da

  seção 117.61 da subparte C e dos Apêndices B ou C (conforme aplicável) do RBAC

  nº 117;

  c. SGRF - Sistema de Gerenciamento de Risco de Fadiga: é um sistema orientado

  por dados e encarregado de monitorar e gerenciar continuamente os riscos de

  segurança relacionados à fadiga, com base em princípios científicos e

  conhecimentos, bem como experiência operacional, que visa garantir que o pessoal

  relevante esteja trabalhando em níveis adequados de alerta. Operadores regidos por

  um SGRF devem cumprir as subpartes A e B, bem como a seção 117.63 da Subparte

  C do RBAC nº 117, conforme orientado pela IS nº 117-004.

  5.1.6. Veja a tabela abaixo para um resumo dos três níveis e sua interação com as subpartes
  e

  apêndices do RBAC nº 117:

  Nível de

  Gerenciamento

  de Fadiga

  Subparte A Subparte B Subparte C Apêndice A

  (Lei 13.475/17) Apêndice B Apêndice C'
