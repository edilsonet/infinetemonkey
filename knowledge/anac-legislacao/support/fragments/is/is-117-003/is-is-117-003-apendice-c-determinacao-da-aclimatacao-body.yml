title: APÊNDICE C. DETERMINAÇÃO DA ACLIMATAÇÃO
text: 'APÊNDICE C. DETERMINAÇÃO DA ACLIMATAÇÃO

  C.1. Exemplos de determinação da aclimatação, jornadas de trabalho e duração do

  repouso dentro de viagens de um tripulante.

  C.1.1. Os tripulantes e operadores devem se referir à seção 117.5 do RBAC nº 117, que

  orienta a determinação da aclimatação de um tripulante. Os cenários a seguir são

  exemplos de como essas determinações se aplicam.

  C.1.2. Esses cenários são hipotéticos. Os repousos são exemplos, não necessariamente o

  repouso mínimo requerido, que é determinado pelo Apêndice B do RBAC nº 117.

  Os cenários não consideram os limites de jornada e tempos de voo cumulativos ou

  paradas intermediárias em cada jornada. A duração do repouso será sempre maior

  que o da Tabela 8 ou da Tabela 9 desta IS.

  C.2. Exemplo 1: voos domésticos, dentro da América do Sul, Caribe e Costa Leste dos

  EUA.

  C.2.1. Pressupostos:

  a. base contratual do tripulante é o aeroporto de Guarulhos (GRU);

  b. tripulante está aclimatado à Guarulhos no início da primeira jornada da viagem;

  c. voo comercial doméstico de passageiros;

  d. tripulação simples; e

  e. empresa conduz suas operações de acordo com os Apêndices B do RBAC nº 117.

