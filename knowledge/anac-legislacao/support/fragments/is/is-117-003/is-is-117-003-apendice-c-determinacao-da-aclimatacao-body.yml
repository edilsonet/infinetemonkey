  C.3.2. Análise das Jornadas do Exemplo 2.

  a. Determinação da aclimatação.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  i. O tripulante inicia uma jornada de 11 horas aclimatado à Guarulhos (local

  original), terminando-a na Cidade do México (três fusos a oeste de

  Guarulhos), onde um repouso de 18 horas começa. No início do repouso o

  tripulante permanece aclimatado à Guarulhos, pois, embora a diferença entre

  Guarulhos (local original) e Cidade do México (novo local) seja de 3 fusos, o

  tripulante está a menos de 36 horas do início da jornada em Guarulhos [vide

  Parágrafo 117.5(c)].

  ii. No início da próxima jornada na Cidade do México, se passaram 29 horas (11

  + 18) desde o início da jornada em Guarulhos. Deste modo, o tripulante

  continua aclimatado à Guarulhos [vide Parágrafo 117.5(c)]. A duração da

  jornada é de 5 horas e termina em Los Angeles (cinco fusos a oeste de

  Guarulhos), onde um repouso de 12 horas se inicia. Na chegada em Los

  Angeles se passaram 34 horas (29 + 5) desde o início da jornada em

  Guarulhos e, portanto, o tripulante continua aclimatado à Guarulhos no início

  do repouso [vide Parágrafo 117.5(d)].

  iii. No início da próxima jornada em Los Angeles, passaram-se 46 horas (34 +

  12), ou seja, mais de 36 horas desde o início da viagem em Guarulhos e foram

  cruzados mais de 3 fusos. Deste modo, o tripulante entra em um estado

  desconhecido de aclimatação [vide Parágrafo 117.5(d)]. A duração da jornada

  é de 5 horas e termina na Cidade do México (três fusos a oeste de Guarulhos),

  onde um repouso de 18 horas se inicia. Na chegada, como o tripulante não

  usufruiu de um período de adaptação em Los Angeles, ele continua em um

  estado desconhecido de aclimatação no início do repouso [vide Parágrafo

  117.5(d)].

  iv. No início da próxima jornada na Cidade do México, o tripulante permanece

  em um estado desconhecido de aclimatação [vide Parágrafo 117.5(d)]. A

  duração da jornada é de 11 horas e termina em Guarulhos, onde o operador é

  obrigado a aclimatar o tripulante, uma vez que este já realizou duas etapas em

  estado desconhecido de aclimatação [vide Parágrafo 117.B(e)(3)].

