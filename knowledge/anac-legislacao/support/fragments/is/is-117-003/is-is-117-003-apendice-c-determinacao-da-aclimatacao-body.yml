  ii. A duração mínima do período de adaptação em Guarulhos será dada de

  acordo com o previsto no parágrafo 117.5(f), como se segue:

  A. maior diferença de fusos na viagem: 5 (entre Guarulhos e Los Angeles);

  B. sentido da jornada: oeste (de Guarulhos para Los Angeles);

  C. período de adaptação segundo a Tabela 1 do RBAC nº 117: 48 horas.

  iii. Desta forma, o tripulante deve usufruir de um período mínimo de 48 horas

  livre de qualquer serviço em Guarulhos, ao final do qual ficará aclimatado a

  esta cidade.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  C.3.3. Notas sobre o Exemplo 2.

  a. As duas primeiras jornadas são operações na madrugada com o tripulante

  aclimatado.

  b. Na última jornada o tripulante está em um estado desconhecido de aclimatação.

  Deste modo, essa jornada não é considerada como sendo uma operação na

  madrugada [vide 117.B(o)(5)].

  c. A adaptação é feita após a última jornada considerando a maior diferença de fusos

  na viagem [vide 117.5(f)(2)] e o sentido em que ocorre [vide 117.5(f)(4)].

  d. Todas as consultas às tabelas B.2 e B.3 são feitas utilizando-se a hora local de

  Guarulhos (coluna 1 das duas tabelas), uma vez que:

  i. nas duas primeiras jornadas o tripulante ainda está aclimatado à Guarulhos; e

  ii. nas duas últimas jornadas Guarulhos é o último local onde o tripulante foi

  aclimatado.

  C.4. Exemplo 3: “bate e volta” para a Europa.

  C.4.1. Pressupostos:

  a. base contratual do tripulante é o aeroporto de GRU;

  b. voo comercial internacional de passageiros:

  c. tripulação composta;

  d. classes de acomodação dos tripulantes de voo e de cabine: 2 e 3, respectivamente;

  e

  e. empresa conduz suas operações de acordo com o Apêndice B do RBAC nº 117.

