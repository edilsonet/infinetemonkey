  C.2.2. Análise das jornadas do Exemplo 1.

  a. Determinação da aclimatação.

  i. O tripulante inicia uma jornada de 3,5 horas aclimatado à Guarulhos (local

  original), terminando-a em Cuiabá (novo local), onde um repouso de 15,5

  horas começa. No início do repouso o tripulante fica aclimatado à Cuiabá,

  pois a diferença de 1 fuso entre Guarulhos e Cuiabá é menor que 3 fusos [vide

  Parágrafo 117.5(b)].

  ii. No início da próxima jornada, Cuiabá passa a ser o local original. A duração

  da jornada é de 4 horas e termina em Rio Branco (novo local, um fuso a oeste

  de Cuiabá), onde um repouso de 19 horas começa. No início do repouso oData de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  tripulante fica aclimatado à Rio Branco, pois a diferença entre Cuiabá (local

  original) e Rio Branco (novo local) é menor que 3 fusos [vide Parágrafo

  117.5(b)].

  iii. No início da próxima jornada, Rio Branco passa a ser o local original. A

  duração da jornada é de 3 horas e termina em Manaus (um fuso a leste de Rio

  Branco). No início do repouso o tripulante fica aclimatado à Manaus, pois a

  diferença entre Guarulhos (local original) e Manaus (novo local) é menor que

  3 fusos [vide Parágrafo 117.5(b)].

  C.2.3. Notas sobre o Exemplo 1.

  a. Como pode ser notado neste exemplo, para jornadas domésticas, o tripulante nunca

  entrará em estado desconhecido de aclimatação. O mesmo ocorre para jornadas

  inteiramente realizadas entre os fusos GMT-3 e GMT-5 (isto é, dentro da América

  do Sul, Caribe e Costa Leste dos EUA).

  b. Nesta chave de voo o tripulante já realizou duas operações seguidas na madrugada.

  Desta forma, a próxima jornada somente poderia ser iniciada a partir das 08:01,

  conforme o item 6.4.12.3 desta IS.

  C.3. Exemplo 2: ida e volta para a costa Oeste dos EUA.

  C.3.1. Pressupostos:

  a. base contratual do tripulante é o aeroporto de GRU;

  b. tripulante está aclimatado à Guarulhos no início da primeira jornada da viagem;

  c. voo comercial doméstico de passageiros:

  d. tipo de tripulação: composta;

  e. classes de acomodação dos tripulantes de voo e de cabine: 2 e 3, respectivamente;

  e

  f. empresa conduz suas operações de acordo com o Apêndice B do RBAC nº 117.

