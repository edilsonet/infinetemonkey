  b. Determinação da duração máxima de cada jornada.

  i. A duração máxima de cada jornada será dada pelas tabelas B.2 (tripulante de

  voo) e B.3 (tripulante de cabine), onde a “hora aclimatada referente ao início

  da jornada” é dada pela “hora do local onde o tripulante esteve por último

  aclimatado” [vide Parágrafo 117.B(e)(2)]. Neste exemplo, Guarulhos é o

  local onde por último o tripulante foi aclimatado.

  ii. A duração máxima das jornadas previstas nas tabelas B.2 e B.3 deve ser

  diminuída em 1 hora na etapa Lisboa - Guarulhos, uma vez que ela foi

  realizada com o tripulante em um estado desconhecido de aclimatação [vide

  Parágrafo 117.B(e)(1)].

