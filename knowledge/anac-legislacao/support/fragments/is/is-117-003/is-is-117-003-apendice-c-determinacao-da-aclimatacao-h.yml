  ii. A duração mínima do período de aclimatação em Guarulhos será dada de

  acordo com o previsto no parágrafo 117.5(f), como se segue:

  A. maior diferença de fusos na viagem: 3 (entre Guarulhos e Lisboa);

  B. sentido da jornada: leste (de Guarulhos para Lisboa);

  C. período de adaptação segundo a Tabela 1 do RBAC nº 117: 45 horas.

  iii. Desta forma, o tripulante deve usufruir de um período mínimo de 45 horas

  livre de qualquer serviço em Guarulhos, ao final do qual ficará aclimatado a

  esta cidade.

  C.4.3. Notas sobre o Exemplo 3.

  a. Foi utilizado o sentido leste para o cálculo do período de adaptação, uma vez que

  foi para este sentido que o tripulante se deslocou de forma a perder sua aclimatação

  à Guarulhos.

  b. Este exemplo é ilustrativo de qualquer voo que seja um “bate e volta” para a Europa,

  em que o tripulante entre em um estado desconhecido de aclimatação.

  C.5. Exemplo 4: três escalas na Europa.

  C.5.1. Pressupostos:

  a. base contratual do tripulante é o aeroporto de GRU;

  b. voo comercial internacional de passageiros:

  c. tripulação de revezamento;

  d. classes de acomodação dos tripulantes de voo e de cabine: 2 e 3, respectivamente;

  e

  e. empresa conduz suas operações de acordo com o Apêndice B do RBAC nº 117.

