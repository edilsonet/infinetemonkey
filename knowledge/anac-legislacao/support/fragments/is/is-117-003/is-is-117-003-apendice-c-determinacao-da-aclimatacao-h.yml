  c. Determinação do repouso mínimo de cada jornada e do período de aclimatação em

  Milão.

  i. A duração mínima do repouso será dada considerando a duração da jornada

  anterior, o estado de aclimatação e o número de fusos cruzados, como previsto

  no parágrafo 117.B(l)(1)(i).

