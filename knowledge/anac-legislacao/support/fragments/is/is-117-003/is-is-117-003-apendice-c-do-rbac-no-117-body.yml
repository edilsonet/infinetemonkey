  Tabela 10. Repouso após uma jornada (Apêndice C do RBAC nº 117).

  6.4.9.7. Para que não haja dúvidas, nos casos de repouso reduzido previstos nos parágrafos
  (l)(2)

  e (l)(4) dos Apêndices B e C do RBAC nº 117, e na determinação do período de adaptação

  previsto em 117.5(e)(2), a condição relativa a noites locais deve preservar o período entre

  22:00 e 08:00 (hora local) integralmente. Assim, uma jornada não poderá ser finalizada

  depois das 22:00, nem a seguinte ser iniciada antes das 08:00, independentemente da

  duração do período de repouso, para que seja caracterizada uma noite local. Por exemplo:

  uma jornada finalizada às 18:30, seguida de 12 horas de repouso, deverá ter seu repouso

  estendido até às 08:00 para garantir a noite local.

  6.4.10. Limites de tempo de voo acumulados

  6.4.10.1. O limite de tempo de voo acumulado em períodos de médio e longo prazo é um meio
  de

  gerir a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um tripulante

  de forma intensiva durante um longo período.

  6.4.10.2. O tempo de voo acumulado significa o total progressivo de tempo de voo acumulado
  peloData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  tripulante ao agir como um membro da tripulação a bordo de qualquer aeronave, mas

  excluindo o tempo de voo acumulado durante operações privadas recreativas.

  6.4.10.3. Para que um operador gerencie o tempo de voo cumulativo, ele deve rastrear o tempo
  de

  voo registrado pelo tripulante ao voar em suas operações durante o período em questão e

  o tempo de voo que os tripulantes acumulam durante voos não recreativos durante esse

  mesmo período.

  Nota: voos recreativos são voos conduzidos por um tripulante a título pessoal e durante

  o período de lazer do tripulante. Um voo conduzido por um tripulante como uma

  operação privada não é considerado recreativo se ocorrer para, ou em nome de, uma

  entidade, independentemente de a entidade ser ou não detentora de um COA ou

  detentor de uma licença sob o RBAC nº 141.

  6.4.10.4. Para que este limite seja aplicado com precisão, o operador deve registrar o tempo
  de voo,

  de acordo com a definição do tempo de voo no RBAC nº 117, o que significa, no caso de

  uma aeronave de asa fixa, o período compreendido entre o início do deslocamento, com

  o intuito de iniciar um voo, até o momento em que se imobiliza a aeronave na posição de

  estacionamento (calço-a-calço).

  6.4.10.5. Os apêndices B e C do RBAC nº 117 têm os mesmos limites cumulativos de tempo de

  voo:

  a. para aviões a jato:

  i. 90 horas durante qualquer período de 28 dias consecutivos; e

  ii. 900 horas durante qualquer período de 365 dias consecutivos;

  b. para aviões turboélice:

  i. 95 horas durante qualquer período de 28 dias consecutivos; e

  ii. 950 horas durante qualquer período de 365 dias consecutivos;

  c. para aviões convencionais:

  i. 96 horas durante qualquer período de 28 dias consecutivos; e

  ii. 960 horas durante qualquer período de 365 dias consecutivos.

  6.4.10.6. Quando o tripulante operar diferentes tipos de aeronaves, o limite inferior deve
  ser

  respeitado.

  6.4.10.7. O que deve constar do MO.

  a. O MO do operador deve incluir:

  i. procedimentos para o rastreamento e análise do tempo de voo acumulado de

  cada tripulante;

  ii. um meio de monitorar o tempo de voo de cada tripulante, garantindo assim

  que qualquer tripulante não exceda os limites aplicáveis;Data de emissão: 31 de janeiro
  de 2020 IS nº 117-003

  Revisão B

  iii. diretrizes em formato claro e prontamente disponíveis para os funcionários

  do operador envolvidos nas atividades de escala e para os tripulantes.

  b. Pode haver necessidade de procedimentos para tripulantes que voam para outro

  operador. Se um tripulante voar para outro operador, serão necessários

  procedimentos para considerar essas horas de voo ao avaliar se o tripulante está

  dentro dos limites de tempo de voo acumulados.

  c. Pode ser necessário haver procedimentos para os tripulantes incluírem em seu

  registro de voo acumulado qualquer voo particular em atividades não recreativas.

  d. O MO não deve permitir que um tripulante exceda os limites acumulados de tempo

  de voo especificados nos parágrafos B(m) dos Apêndices B e C do RBAC nº 117,

  conforme aplicável.

  6.4.11. Limites de jornada acumulados

  6.4.11.1. O limite de jornada acumulado em períodos de médio e longo prazo é um meio de
  gerir

  a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um tripulante de

  forma intensiva durante um longo período.

  6.4.11.2. O limite de jornada acumulado de um tripulante significa o total progressivo das
  jornadas

  de trabalho do tripulante ao realizar qualquer trabalho para um operador, incluindo, além

  das jornadas de voo e períodos de sobreaviso e reserva, períodos de trabalho nos

  escritórios do operador, reuniões, treinamentos de solo ou de voo.

  6.4.11.3. Os apêndices B e C do RBAC nº 117 têm os mesmos limites de jornada acumulados:

  a. 60 horas durante qualquer período de 7 (sete) dias consecutivos, mediante

  convenção ou acordo coletivo de trabalho;

  b. 100 horas durante qualquer período de 14 (quatorze) dias consecutivos;

  c. 176 horas mensais; e

  d. 176 horas durante qualquer período de 28 (vinte e oito) dias consecutivos.

  6.4.11.4. Para que não haja dúvidas, em relação aos itens “c” e “d” acima, se o limite de
  176 horas

  for atingido em 28 dias, os dias que representam a diferença para o final do mês calendário

  devem ser livres de qualquer serviço.

  6.4.11.5. O que deve constar do MO.

  a. O MO do operador deve incluir:

  i. procedimentos para o rastreamento e análise dos tempos totais de jornada

  acumulada de cada tripulante;

  ii. um meio de monitorar os limites de jornada de cada tripulante, garantindo

  assim que qualquer tripulante não exceda os limites aplicáveis;

  iii. diretrizes em formato claro e prontamente disponíveis para os funcionários

  do operador envolvidos nas atividades de escala, treinamento e para osData de emissão: 31
  de janeiro de 2020 IS nº 117-003

  Revisão B

  tripulantes.

  b. Pode haver necessidade de procedimentos para tripulantes que voam para outro

  operador. Se um tripulante voar para outro operador, serão necessários

  procedimentos para considerar essas horas trabalhadas ao avaliar se o tripulante está

  dentro dos limites de tempo de jornada acumulados.

  c. Pode ser necessário haver procedimentos para os tripulantes incluírem em seu

  registro de voo acumulado qualquer voo particular em atividades não recreativas.

  d. O MO não deve permitir que um tripulante exceda os limites acumulados de tempo

  de voo especificados nos parágrafos B(n) dos Apêndices B e C do RBAC nº 117,

  conforme aplicável.

  6.4.12. Limites em operações na madrugada

  6.4.12.1. Operação na madrugada significa uma jornada que compreenda o período transcorrido,

  total ou parcialmente, entre 00h00 e 06h00, hora legal onde o tripulante está aclimatado.

  6.4.12.2. Ressalta-se que o RBAC nº 117 utiliza a definição de “operação na madrugada”,
  a qual é

  diferente da definição de madrugada da Lei nº 13.475/17, como acima sublinhado.

  6.4.12.3. A fim de minimizar a fadiga em operações na madrugada, os Apêndices B e C contêm
  a

  exigência de que o operador aéreo não pode escalar um tripulante para um voo cuja

  jornada se inicie entre 06:00 e 08:00 se este tripulante tiver realizado duas operações

  consecutivas na madrugada nas 48 horas anteriores a esta jornada.

  Boas práticas

  • Prever folgas, preferencialmente 2 ou mais, após trabalho noturno,

  principalmente após operações na madrugada.

  • Finalizar jornadas noturnas até às 06:00 parece ser melhor do que a partir

  deste horário, para garantir que a pessoa se desloque ainda no escuro e não se

  exponha à luz, o que favorecerá seu sono matinal.

  6.4.12.4. Em relação ao item 6.3.12.3, o operador pode escolher atrasar o horário de início
  da

  jornada após uma ou duas madrugadas para proteger melhor a noite de sono de seus

  tripulantes, permitindo que acordem mais tarde (iniciar jornadas a partir das 10:00, por

  exemplo), e/ou diminuir a duração da jornada posterior, que deverá inevitavelmente

  acabar antes das 00:00 para não caracterizar a terceira operação na madrugada

  consecutiva. O GAGEF poderá propor testar diferentes configurações levando em conta

  estas observações em interação com os conceitos de noite, noite local e duração da

  jornada, buscando minimizar os riscos advindos das combinações de jornadas (diurnas,

  noturnas e na madrugada) ao longo de períodos de 168 horas ou 28 dias, por exemplo.

  Da mesma forma, o operador deveria proteger a jornada anterior à operação na

  madrugada, aplicando a mesma regra contida no regulamento ou estabelecendo outra

  ainda mais restritiva, conforme o exemplo acima. O objetivo é evitar que um tripulante

  acorde ou esteja acordado em mais de duas madrugadas na sequência. Se sua jornada

  anterior, contudo, iniciar antes das 08:00, muito provavelmente seu despertar ocorrerá

  antes ou muito próximo das 06:00.

  6.4.12.5. Mesmo jornadas iniciadas fora do horário da madrugada (a partir de 06:01), exigem
  queData de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  o acordar ocorra na madrugada, por necessidade de preparação e deslocamento. O

  operador deveria levar isso em conta ao planejar jornadas consecutivas de início cedo ou

  operações na madrugada sucedidas ou precedidas de início cedo.

  Atenção:

  O tripulante tem base contratual em Congonhas e apresentação para iniciar sua

  jornada em Guarulhos às 06:30. As opções de ônibus saindo de Congonhas com

  destino a Guarulhos são às 05:00/ 05:10 / 05:30 / 06:00 / 06:10. Como é sabido, o

  tempo do trajeto demora em média uma hora, por isso, o tripulante irá se programar

  para pegar o ônibus das 05:00 ou 05:10.

  Apesar de a apresentação se dar em período fora do horário da madrugada, o

  tripulante acordará dentro do período da madrugada.

  6.4.12.6. O que deve constar do MO.

  a. O operador deve desenvolver diretrizes e procedimentos de escala de tripulantes

  que claramente exijam o rastreamento de jornadas em operações na madrugada

  durante períodos consecutivos de 168 horas. Esses procedimentos também devem

  identificar e rastrear as jornadas que se tornam operações na madrugada devido à

  reprogramação ou extensão, ou operações consecutivas com início cedo (antes das

  10:00).

  b. O MO deve conter procedimentos e diretrizes para:

  i. gerenciar adequadamente os limites da escala em operações na madrugada;

  ii. identificar o potencial de uma operação na madrugada limitar a futura

  atribuição de jornadas a um tripulante.

  c. Ao escalar tripulantes para uma jornada (mesmo que não seja na madrugada), o

  número de operações na madrugada realizadas no período de 168 horas em que ela

  irá ocorrer precisa ser considerado.

  d. Jornadas realizadas por um tripulante em estado desconhecido de aclimatação não

  contam como operações na madrugada (independente do horário na qual são

  conduzidas), uma vez que no estado desconhecido de aclimatação não se consegue

  definir os horários de início e término da madrugada para o tripulante.

  Boas práticas

  Em estado desconhecido de aclimatação, para maior proteção do tripulante, o

  operador pode aplicar as regras de restrição de operação na madrugada normalmente

  em seu MO, ou mesmo restringi-las ainda mais, dado que a condição para que

  aconteça exija o cruzamento de 3 ou mais fusos horários - o que potencialmente afeta

  o estado de alerta.

  e. Deve haver evidência de procedimentos que exijam que o operador aéreo não tenha

  escalado um tripulante aclimatado para um voo cuja jornada se inicie entre 06:00 e

  08:00 se este tripulante tiver realizado duas operações consecutivas na madrugada

  nas 48 horas anteriores a esta jornada.Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B'
