cite: apendice-c-do-rbac-no-117-conforme-aplicavel
title: Apêndice C do RBAC nº 117, conforme aplicável.
text: 'Apêndice C do RBAC nº 117, conforme aplicável.

  A.1.3. Todos os procedimentos e limites operacionais devem ser documentados no MO. A ANAC

  deve estar convencida de que os limites e procedimentos operacionais a serem introduzidos

  no MO razoavelmente garantem que os tripulantes não excedam níveis seguros de fadiga

  durante a operação de uma aeronave.

  A.2. Conteúdo mínimo a ser inserido no manual do operador

  A.2.1. Devem ser incluídos no MO todos os tópicos abaixo.

  a. Ambiente operacional da empresa aérea.

  i. Descrever o ambiente operacional da empresa aérea que irá afetar o

  gerenciamento de risco da fadiga (voos nacionais e/ou internacionais,

  cruzamento de fusos horários, voos de curta duração e/ou de longa duração,

  operação diurna e/ou noturna / madrugada, operação de passageiros e/ou de

  carga etc.).

  ii. Incluir, em destaque, no seu MO as informações abaixo:

  A. indicação de que o operador está autorizado a conduzir suas operações

  sob um GRF;

  B. indicação de qual Apêndice (B ou C, conforme o caso) o operador irá

  atender.

  iii. A indicação acima deve ser feita da seguinte forma:

  A. caso seja adotada a opção constante do item 9.2.1.2.c: incluir as

  informações na primeira página do Capítulo 7 ou Seção 5, conforme

  aplicável;

  B. caso seja adotada a opção constante do item 9.2.1.2.d: incluir as

  informações na primeira página do manual específico para o

  gerenciamento da fadiga.

  b. Políticas do operador sobre gestão da fadiga.

  i. Política de não-utilização dos tripulantes que não estejam aptos ao trabalho

  (vide item 6.2.2 desta IS).Data de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B

  ii. Política de segurança operacional (vide itens 6.3.10 e 7.2.4 desta IS).

  iii. Outras políticas relativas à gestão de fadiga do operador (por exemplo, em

  interação com outros regulamentos ou práticas da empresa).

  c. Limites operacionais.

  i. Indicação de que todas as operações do operador devem ser realizadas

  segundo o Apêndice B ou Apêndice C do RBAC nº 117.

  ii. Os limites máximos e mínimos advindos do cumprimento do Apêndice B ou

  do Apêndice C do RBAC nº 117 para cada tripulante (vide os itens 6.3 e 6.4

  desta IS e as seções dos Apêndices B ou C que contêm limitações de jornada

  de trabalho, tempo de voo e de repouso antes ou após a jornada).

  iii. Para os tripulantes conduzindo uma dada operação: cada limite mencionado

  no parágrafo anterior como alterado pelo operador para os tripulantes e para

  a operação, desde que não exceda os limites máximos, ou reduza os limites

  mínimos, especificados no Apêndice B ou no Apêndice C do RBAC nº 117

  (vide itens 6.3.6, 6.4.2, 6.4.3, 6.4.4, 6.4.7, 6.4.8, 6.4.9, 6.4.9.7, 6.4.11 e 6.4.12

  desta IS).

  d. Responsabilidade dos funcionários do operador.

  i. Cada operador deve incluir no seu manual as responsabilidades para o

  gerenciamento da fadiga e gerenciamento de risco da fadiga (vide o item'
