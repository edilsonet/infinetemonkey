title: APÊNDICE E. INFORMAÇÕES E DADOS OPERACIONAIS (DO)
text: 'APÊNDICE E. INFORMAÇÕES E DADOS OPERACIONAIS (DO)

  E.1. O operador aéreo pode tomar por base os dados listados abaixo para realizar coleta
  a

  intervalos periódicos, estabelecidos pelo seu GAGEF.

  E.2. Informações e dados que devem ser coletados (DO = Dado Operacional).

  E.2.1. Relatos da tripulação.

  a. (DO.1.1) Reclamações de fadiga de tripulações;

  b. (DO.1.2) Número de reportes de fadiga de tripulantes.

  E.2.2. O operador aéreo e seus números.

  a. (DO.2.1) Número de operações realizadas pelo operador utilizando tripulações

  simples, compostas e de revezamento.

  b. (DO.2.2) Tipos de acomodação a bordo e respectivas matrículas de aeronaves em

  operação (informação inicial fornecida no primeiro reporte do GAGEF e sempre

  que houver mudança).

  E.2.3. Escala de voos.

  a. (DO.3.1) Percentual de uso do tripulante em reserva na malha mensal, relativo a

  cada tipo de tripulante no total (CMTE, COPIL, CMS).

  b. (DO.3.2) Percentual de uso do tripulante em sobreaviso na malha mensal, relativo

  a cada tipo de tripulante no total (CMTE, COPIL, CMS).

  E.2.4. Dias de folga.

  a. (DO.4.1) Número médio de folgas de 24 horas (monofolga) na escala mensal por

  tipo de tripulação.

  b. (DO.4.2) Número de faltas (média de vezes e duração média) por tipo de tripulação.

  E.2.5. Jornadas.

  a. (DO.5.1) Número de ocorrências de escala durante a janela de baixa do alerta do

  ciclo circadiano em relação à tripulação total de uma dada operação (jornadas em

  início e em final de madrugada, jornadas noturnas programadas e realizadas).

  b. (DO.5.2) Número médio de dias de folga entre jornadas.

  c. (DO.5.3) Número médio de etapas por dia (programadas x realizadas).

  d. (DO.5.4) Número médio de dias de jornadas consecutivas.

  e. (DO.5.5) Cruzamento de 3(três) ou mais fusos horários: percentual desta operação

  na malha aérea por período definido e percentual da tripulação total.

  f. (DO.5.6) Duração média da conexão em outra base por período definido.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  g. (DO.5.7) Média de tempo dispendido entre o aeroporto/hotel/aeroporto.

  E.2.6. Planos de contingência.

  a. (DO.6.1) Número médio e percentual de acionamentos de reserva sobre operações

  diárias previstas.

  b. (DO.6.2) Número médio e percentual de acionamentos de sobreaviso sobre

  operações diárias previstas.

  c. (DO.6.3) Tempo médio entre um acionamento de sobreaviso e a respectiva

  apresentação para o voo.

  E.2.7. Escala planejada versus escala realizada.

  a. (DO.7.1) Percentual de discrepância entre escalas planejadas versus realizadas por

  dia.

  E.2.8. Base contratual.

  a. (DO.8.1) Quantitativo de tripulantes por tipo por base contratual.

  b. (DO.8.2) Média mensal de tripulantes que mudam de base por interesse do operador

  aéreo.

  E.2.9. Dados mensuráveis e reportáveis.

  a. (DO.9.1) Reportes de incidentes relacionados à fadiga.

  b. (DO.9.2) Número médio de registros oriundos de sistemas de reporte de eventos de

  segurança operacional (RELPREV e outros).

  c. (DO.9.3) Número de simulações de fadiga por meio de modelos biomatemáticos a

  intervalos definidos pelo GAGEF.

  d. (DO.9.4) Frequência de produção de modelagens de chaves de voo, de acionamento

  e respectivos tempos de voo e jornadas de trabalho.

  E.2.10. Ações internas.

  a. (DO.10.1) Tempo médio de reuniões e respectiva frequência mensal do pessoal do

  GAGEF.

  b. (DO.10.2) Número médio de pesquisas sobre fadiga em um dado período definido.

  c. (DO.10.3) Reportes de incidente/acidente do operador aéreo por período definido.

  d. (DO.10.4) Relatórios externos, estudos, análises e relatórios de acidente/incidente

  de outros operadores aéreos.

  E.2.11. Coleta planejada de dados.

  a. (DO.11.1) Frequência de coleta de dados de sono por tipo de tripulação.Data de emissão:
  31 de janeiro de 2020 IS nº 117-003

  Revisão B

  b. (DO.11.2) Frequência de coleta de dados oriundos de estudos de desempenho

  cognitivo de sono por tipo de tripulação.

  c. (DO.11.3) Frequência de coleta de dados oriundos de voos (FOQA).

  d. (DO.11.4) Frequência de coleta de dados da escala de voo por tipo de tripulante.Data
  de emissão: 31 de janeiro de 2020 IS nº 117-003

  Revisão B'
