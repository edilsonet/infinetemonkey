title: Apêndice C. Avaliando a Contribuição da Fadiga em Eventos de Segurança.
text: 'Apêndice C. Avaliando a Contribuição da Fadiga em Eventos de Segurança.

  C.1. Introdução

  C.1.1. O objetivo primário da investigação do papel da fadiga em eventos de segurança é
  identificar como sua ocorrência ou seus efeitos poderiam ter sido mitigados, de forma a
  diminuir a probabilidade de ocorrerem no futuro. Não existe uma fórmula simples para avaliar
  a contribuição da fadiga em eventos de segurança. Para estabelecer que a fadiga foi um fator
  contribuinte, deve ser demonstrado que:

  a. a pessoa ou a equipe provavelmente estavam fatigados;

  b. a pessoa ou a equipe tiveram ações ou tomaram decisões particulares que foram causais
  no que deu errado;

  c. tais ações e decisões são consistentes com o tipo de comportamento esperado de uma pessoa
  ou equipe fatigada.

  C.1.2. Informações básicas podem ser coletadas de todos os reportes e eventos de segurança,
  com análises mais aprofundadas reservadas aos eventos em que havia maior probabilidade de
  a fadiga ter sido um fator importante e/ou quando os resultados do evento foram mais severos.

  C.2. Informações básicas

  C.2.1. Para estabelecer se um tripulante estava provavelmente fatigado no momento do evento,
  quatro peças de informações são necessárias:

  a. a hora do dia em que o evento ocorreu. Se entre 02:00 e 06:00 (WOCL), então a fadiga
  pode ter sido um fator;

  b. se o ritmo circadiano do tripulante normal estava desajustado (por exemplo, nas últimas
  72 horas ele estava trabalhando à noite, ou se cruzou fusos);

  c. há quantas horas o tripulante estava acordado na hora da ocorrência (para obter esta
  informação, talvez seja mais fácil perguntar a que horas o tripulante acordou no dia do
  evento). Se mais de 16 horas, então a sonolência tenha sido um fator; e

  d. se as últimas 72 horas de história de sono sugerem débito de sono. Como guia, a média
  de sono de um adulto saudável é de 7 a 8 horas a cada 24 horas, então uma pessoa que tenha
  obtido menos de 21 (3x7) horas de sono nas últimas 72 horas provavelmente estava experimentando
  os efeitos da falta de sono. Se a informação da história de sono não estiver disponível,
  o histórico das jornadas pode fornecer informações sobre as oportunidades de sono.

  C.3. Investigação aprofundada da fadiga

  C.3.1. Se as respostas às perguntas anteriores (informações básicas) sugerem que tripulante
  estava fatigado na hora do evento, então uma investigação mais aprofundada requer verificar
  se a pessoa ou a equipe tiveram ações ou tomaram decisões particulares que foram causas
  do que deu errado, e se tais ações e decisões são consistentes com o tipo de comportamento
  esperado de uma pessoa ou equipe fatigada. Os checklists a seguir fornecem um exemplo de
  como isso pode ser feito.

  a. Checklist 1 (Figura 8) objetiva estabelecer se a pessoa ou equipe estavam em estado de
  fadiga, baseando-se em uma série de questões ou provas que endereçam a aspectos chave da
  fadiga. A resposta a cada pergunta é comparada a uma “melhor resposta”, que auxilia a construção
  de uma figura geral do perigo da fadiga. Qualquer desvio da “melhor resposta” indica risco
  aumentado de fadiga.

  b. Checklist 2 (Figura 9) objetiva estabelecer se a ações ou condições inseguras foram consistentes
  com o tipo de comportamento esperado de uma pessoa ou equipe fatigada.

  Questões

  Melhor resposta

  Anotações do investigador

  Qualidade do sono: Estabelece se havia ou não débito de sono

  Qual foi a duração do último período de sono obtido?

  7,5 a 8,5 horas


  A que horas iniciou?

  Normal dentro do ciclo circadiano (noite)


  A que horas acordou?

  Normal dentro do ciclo circadiano (manhã cedo)


  Seu sono foi interrompido? Se sim, por quanto tempo?

  Não


  Tirou algum cochilo depois de dormir?

  Sim


  (se sim) Qual foi a duração do cochilo?

  Obteve oportunidade de cochilo restaurador (1,5 a 2 horas) ou estratégico (20 min) antes
  do início de turno tardio (noturno)


  Descreva seu padrão de sono das últimas 72 horas. (Aplicar sistema de crédito de sono)

  2 créditos para cada hora de sono; perda de 1 ponto a cada hora acordado - o valor deve
  ser positivo


  Qualidade do sono: Estabelece se o sono foi ou não restaurador

  Como o período de sono obtido se relaciona com o ciclo de sono normal do tripulante (isto
  é, inicia à noite e termina pela manhã)

  Sobreposto ao ciclo circadiano (inicia à noite e termina pela manhã)


  Interrupções no sono?

  Sem despertares


  Quais as condições do ambiente em que dormiu?

  Condições apropriadas (silencioso, temperatura confortável, ar fresco, própria cama, quarto
  escuro)


  Distúrbios do sono?

  Nenhuma


  Histórico de trabalho: Estabelece se as horas trabalhadas e o tipo de jornada ou atividades
  impactaram a quantidade e qualidade do sono

  Quantas horas de trabalho ou de sobreaviso/reserva antes da ocorrência?

  Depende da situação horas de trabalho ou sobreaviso/reserva que garanta o nível de alerta
  esperado para a tarefa


  Qual o histórico de trabalho da semana precedente?

  Número de horas de trabalho ou sobreaviso/reserva que não leve à fadiga acumulada


  Escalas não regulares

  Estabelece se a escala estava problemática com relação ao seu impacto na quantidade e qualidade
  do sono

  O tripulante trabalhava em turnos (durante períodos de sono)?

  Não (sabe-se que o ciclo circadiano e o sono não se adaptam completamente ao trabalho em
  turnos)


  Se sim, o turno era permanente?

  Sim, dias


  Se não, o turno era rotativo (no sentido horário) ou não regular?

  Sim, rotativo no sentido horário, rotação lenta (1 dia para cada hora atrasada), turno noturno
  reduzido e ao final do ciclo da rotação


  Como as horas extras e os turnos dobrados eram programados?

  Nos momentos do ciclo em que a pessoa está mais alerta (final da manhã, anoitecer)


  Tarefas críticas de segurança agendadas para quais horários?

  Nos momentos do ciclo em que a pessoa está mais alerta (final da manhã, anoitecer)


  O tripulante recebeu treinamento sobre uso de estratégias pessoais para mitigação da fadiga?

  Sim


  Jet lag: Estabelece a existência e impacto do jet lag na quantidade e qualidade do sono

  Quantidade de fusos cruzados?

  Um


  Se mais de um, com qual rapidez foram cruzados?

  Quanto mais lento, melhor


  Em qual sentido?

  Oeste


  Figura 8. Checklist 1 - Estabelecendo o Estado da Fadiga (Fonte: DOC 9966, 2ª ed., 2016).


  Figura 9. Checklist 2 - Estabelecendo a Relação Entre a Fadiga e as Decisões ou Atos Inseguros
  (Fonte: DOC 9966, 2ª ed., 2016).'
