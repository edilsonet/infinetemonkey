title: Apêndice D. Sistema de Coleta de Informações e Dados
text: 'Apêndice D. Sistema de Coleta de Informações e Dados

  D.1. O operador aéreo deve tomar por base os dados listados abaixo para realizar coleta
  a intervalos periódicos, estabelecidos pelo seu GAGEF. Os dados abaixo são aqueles constantes
  do Apêndice I da IS nº 117-003 (item reservados, os quais devem ser procurados naquela IS),
  acrescidos dos necessários à um SGRF (itens que não estão reservados).

  D.2. Informações e dados que devem ser coletados.

  D.2.1. Relatos da tripulação.

  a. Reservado.

  b. Reservado.

  c. (DE.1.3) Relatos de doença de tripulantes (SGRF).

  D.2.2. O operador aéreo e seus números.

  a. Reservado.

  b. Reservado.

  c. (DE.2.3) Número médio de picos de voos em épocas de baixa e alta temporada (SGRF).

  d. (DE.2.4) Número médio de voos mês a mês (SGRF).

  D.2.3. Escala de voos.

  a. Reservado.

  b. Reservado.

  c. (DE.3.3) Eventos de instabilidade da escala programada (em especial mudanças de mais
  ou menos 2 horas, pernoites não planejados, tempo entre a mudança da escala de um tripulante
  e seu efetivo cumprimento) (SGRF).

  d. (DE.3.4) Reserva técnica de pessoal para atendimento a imprevistos (em números ou percentual
  do mínimo necessário para atender aos voos programados - comandante, copiloto, comissário)
  (SGRF).

  e. (DE.3.5) Número total de horas de extensão de jornada por período definido (SGRF).

  f. (DE.3.6) Número total de horas de extensão de horas de voo por período definido (SGRF).

  D.2.4. Dias de folga.

  a. Reservado.

  b. Reservado.

  c. (DE.4.3) Número médio de dias de folga por período definido (SGRF).

  D.2.5. Jornadas.

  a. Reservado.

  b. Reservado.

  c. Reservado.

  d. Reservado.

  e. Reservado.

  f. Reservado.

  g. Reservado.

  h. (DE.5.8) Percentual entre operações com tripulação simples, composta e de revezamento
  na malha aérea mensal (programado x realizado) (SGRF).

  i. (DE.5.9) Total de horas de ocorrência de extensão de jornadas por período definido (SGRF).

  j. (DE.5.10) Média de tempo de extensão de uma jornada por período definido (SGRF).

  k. (DE.5.11) Número médio de horas de jornada programadas para a tripulação (SGRF).

  l. (DE.5.12) Número médio de horas de jornada realizadas para a tripulação (SGRF).

  D.2.6. Planos de contingência.

  a. Reservado.

  b. Reservado.

  c. Reservado.

  d. (DE.6.4) Número médio de ocorrências de acionamento em folgas de tripulantes por sazonalidade
  (SGRF).

  e. (DE.6.5) Número médio de atrasos em jornadas e percentual sobre operações diárias previstas
  (SGRF).

  f. (DE.6.6) Correlação entre número médio de atrasos em jornadas e sazonalidade (SGRF).

  D.2.7. Escala planejada versus escala realizada.

  a. Reservado.

  b. (DE.7.2) Número médio de eventos operacionais que interfiram no atendimento da escala
  planejada (SGRF).

  D.2.8. Base contratual.

  a. Reservado.

  b. Reservado.

  c. (DE.8.3) Média mensal de tripulantes que solicitam mudança de base (SGRF).

  D.2.9. Reservado.

  a. (DO.9.1) Reportes de incidentes relacionados à fadiga.

  b. (DO.9.2) Número médio de registros oriundos de sistemas de reporte de eventos de segurança
  operacional (RELPREV e outros).

  c. (DO.9.3) Número de simulações de fadiga por meio de modelos biomatemáticos a intervalos
  definidos pelo GAGEF.

  d. (DO.9.4) Frequência de produção de modelagens de chaves de voo, de acionamento e respectivos
  tempos de voo e jornadas de trabalho.

  D.2.10. Reservado.

  a. (DO.10.1) Tempo médio de reuniões e respectiva frequência mensal do pessoal do GAGEF.

  b. (DO.10.2) Número médio de pesquisas sobre fadiga em um dado período definido.

  c. (DO.10.3) Relatórios de incidente/acidente do operador aéreo por período definido.

  d. (DO.10.4) Relatórios externos, estudos, análises e relatórios de acidente/incidente de
  outros operadores aéreos.

  D.2.11. Reservado.

  a. (DO.11.1) Frequência de coleta de dados de sono por tipo de tripulação.

  b. (DO.11.2) Frequência de coleta de dados oriundos de estudos de desempenho cognitivo de
  sono por tipo de tripulação.

  c. (DO.11.3) Frequência de coleta de dados oriundos de voos (FOQA).

  d. (DO.11.4) Frequência de coleta de dados da escala de voo por tipo de tripulante.

  D.2.12. Outras fontes de dados.

  a. (DE.12.1) Frequência de ocorrência de auditorias e pesquisas relacionadas à fadiga em
  um período definido (SGRF).

  b. (DE.12.2) Frequência de estudos sobre fadiga (SGRF).'
