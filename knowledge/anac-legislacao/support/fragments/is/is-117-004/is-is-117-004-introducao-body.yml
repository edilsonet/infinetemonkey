title: Introdução
text: 'Introdução

  5.1. Esta Instrução Suplementar visa orientar os provedores de serviços previstos no RBAC
  nº 117 na implementação de um Sistema de Gerenciamento de Risco da Fadiga (SGRF).

  5.2. O sistema de gerenciamento de risco da fadiga (SGRF) é previsto no art. 19 da Lei nº
  13.475, de 28 de agosto de 2017, e é brevemente descrito na seção 117.63 do RBAC nº 117,
  sendo definido como um sistema, aprovado pela ANAC, de monitoramento e gerenciamento contínuo
  dos riscos de segurança associados à fadiga, baseado em dados, princípios científicos e
  experiência operacional, que visa assegurar que o pessoal envolvido execute suas atividades
  sob um nível adequado de alerta. Um SGRF aprovado possibilita que sejam praticados limites
  operacionais diferentes dos constantes da Lei nº 13.475/17 e do RBAC nº 117.

  5.3. Esta IS aplica-se apenas aos detentores de certificado que operem segundo os RBAC nº
  121 ou 135 e que tenham um Gerenciamento de Risco da Fadiga (GRF) aceito pela ANAC em conformidade
  com a seção 117.61 do RBAC nº 117 (vide IS nº 117-003), uma vez que diversos procedimentos
  empregados no GRF poderão ser utilizados no SGRF.

  5.4. De forma a facilitar o processo de desenvolvimento e apresentação de um SGRF, um operador
  aéreo pode se utilizar de um GRF que tenha sido previamente aceito, conforme procedimentos
  indicados na IS nº 117-003. O GRF aceito contém diversos elementos e fatores que ajudarão
  o operador aéreo em seu processo de implementação do SGRF na ANAC. No entanto, deve-se atentar
  ao fato de que o GRF aceito segundo a seção 117.61 do RBAC nº 117 e pela IS nº 117-003 deve
  ser alterado a fim de acomodar os novos requisitos advindos do SGRF.

  5.5. Operadores que não se enquadrem no item 5.3 acima devem utilizar os procedimentos contidos
  na IS nº 117-005.

  Informações Iniciais

  6.1. Geral

  6.1.1. O SGRF é um sistema de gerenciamento a ser utilizado pelo detentor de certificado
  para gerenciar os efeitos da fadiga em operações específicas. Ele é baseado e dependente
  de dados, apoiado em princípios científicos e conhecimento operacional, que permite o devido
  gerenciamento de riscos relativos aos erros humanos provocados pela fadiga. O objetivo do
  SGRF é gerenciar, monitorar e mitigar os efeitos da fadiga de modo a melhorar o nível de
  alerta dos tripulantes e reduzir os erros de desempenho.

  6.1.2. O parágrafo 117.63(a) do RBAC nº 117 informa que um operador pode exceder qualquer
  provisão daquele regulamento desde que obtenha implementação de um SGRF que proporcione
  pelo menos um nível de segurança equivalente ao previsto nos Apêndices A, B ou C contra
  acidentes, incidentes e eventos relacionados à fadiga.

  6.1.3. O detentor de certificado utilizará um SGRF como forma de aplicar um meio alternativo
  de cumprimento (MAC) dos limites prescritivos constantes da Lei nº 13.475/17 ou dos Apêndices
  A, B ou C do RBAC nº 117. Portanto, o MAC do titular do certificado deve ser avaliado e
  validado pela ANAC quanto à segurança e eficácia. Isto é feito pelo processo de implementação
  do SGRF.

  6.2. Componentes de um SGRF

  6.2.1. O parágrafo 117.63(b) do RBAC nº 117 requer que um SGRF contenha quatro componentes,
  os quais são comentados nas seguintes seções desta IS:

  a. Seção 7: política e objetivos do SGRF [parágrafo 117.63(b)(1)];

  b. Seção 8: processos de GRF [parágrafo 117.63(b)(2)];

  c. Seção 9: processos de GSO [parágrafo 117.63(b)(3)]; e

  d. Seção 10: promoção do SGRF [parágrafo 117.63(b)(4)].

  6.2.2. Dos quatro componentes do SGRF, dois são direcionados à organização e dois à operação,
  como mostrado na Figura 1.

  a. Os processos de gerenciamento de risco da fadiga e a garantia da segurança operacional
  constituem os processos operacionais.

  b. Os processos operacionais são orientados pelas políticas e objetivos do SGRF e apoiadas
  pelos processos de promoção, os quais compõem as atividades organizacionais.


  Figura 1. Componentes do SGRF (fonte: DOC 9966, 2º ed., 2016).


  6.2.3. Os procedimentos operacionais do SGRF devem, no mínimo:

  a. incorporar princípios científicos e conhecimento e experiência operacional;

  b. identificar, de forma contínua, perigos de segurança relacionados à fadiga e os riscos
  que deles resultam;

  c. garantir que as ações corretivas, necessárias para mitigar efetivamente os riscos associados
  aos perigos, sejam devida e convenientemente implementadas;

  d. prover registro e gerenciamento contínuos, bem como avaliação regular de:

  i. perigos para a segurança relacionados à fadiga;

  ii. ações corretivas relevantes;

  iii. em qual medida a mitigação dos riscos relacionados à fadiga é atingida por meio das
  ações corretivas; e

  e. prover a melhoria contínua da eficácia do SGRF.

  f. estabelecer para cada tripulante, no mínimo os valores:

  i. máximos em relação a:

  A. tempos de voo;

  B. períodos de jornada de trabalho; e

  ii. mínimos de períodos de repouso.

  6.2.4. Veja na Figura 2 abaixo, um diagrama dos processos operacionais do SGRF:


  Figura 2. Atividades Operacionais do SGRF: diferença entre GRF e SGRF (Fonte: AC 120-003A
  - modificado).


  6.2.5. Em relação ao parágrafo 6.2.3.f, os valores para cada tripulante devem ser estabelecidos
  com referência às circunstâncias aplicáveis de cada voo, jornada de voo, jornada de trabalho
  ou período de repouso. Exemplos de valores que devem ser estabelecidos devem incluir, quando
  for o caso:

  a. o tipo de tripulação;

  b. o horário local de início da jornada de voo;

  c. o horário aclimatado de início da jornada de voo;

  d. o número de trechos a serem voados;

  e. as classes de descanso para a tripulação.

  6.3. Relação entre o SGRF e o SGSO

  6.3.1. Um SGRF é um sistema especializado que utiliza os princípios e processos do SGSO
  para gerenciar o risco da fadiga. Da mesma forma que o SGSO, o SGRF procura alcançar um
  equilíbrio realista entre segurança, produtividade e custos. No entanto, existem algumas
  características importantes de uma abordagem SGRF que a diferenciam do gerenciamento de
  riscos da fadiga usando um SGSO sobre limites prescritivos.

  6.3.2. Na abordagem prescritiva, a fadiga é um dos possíveis riscos que o SGSO deve considerar,
  mas as evidências baseadas em dados relacionadas à fadiga não são coletadas de forma específica
  e ativa, a menos que um problema de fadiga tenha sido identificado pelo SGSO. Normalmente,
  o operador reage quando um risco de fadiga é identificado.

  6.3.3. Com o SGRF, visto que é um sistema baseado em desempenho, o operador deve identificar
  e avaliar os possíveis riscos de fadiga antes de realizar operações no âmbito do SGRF, bem
  como identificar e avaliar os riscos reais de fadiga de forma proativa durante as operações.

  6.3.4. Uma abordagem SGRF exigirá recursos adicionais a serem alocados para o gerenciamento
  da fadiga, processos aprimorados especificamente estabelecidos para enfrentar riscos de
  fadiga e treinamento e comunicações de gerenciamento da fadiga mais abrangentes do que os
  exigidos de um operador que cumpra apenas as regulamentações do SGSO sobre um sistema de
  limitação prescritivas (o caso do GRF, por exemplo).

  Política e Objetivos do SGRF [117.63(b)(1)]

  7.1. Política e Compromisso da Administração [117.63(b)(1)(i)]

  7.1.1. O detentor de certificado deve possuir uma política de SGRF que:

  a. faça referência a todos os componentes de SGRF mencionados no parágrafo 117.63(b) do
  RBAC nº 117 e no item 6.2 desta IS; e

  b. seja integrada ao SGSO.

  7.1.2. A política deve requerer que todas as operações às quais o SGRF seja aplicável estejam
  claramente definidas no manual do operador, devendo conter os seguintes elementos:

  a. assinatura do gestor responsável do detentor de certificado;

  b. compromisso da administração:

  i. declarar o compromisso da organização em relação:

  A. aos procedimentos de relato de segurança operacional;

  B. aos procedimentos relacionados à cultura de segurança operacional;

  C. à provisão de recursos necessários para o SGRF; e

  D. à melhoria contínua do SGRF;

  ii. ser acessível a todas as áreas relevantes e níveis da organização, de maneira a indicar
  o endosso específico do detentor de certificado;

  c. responsabilidade acerca do gerenciamento de risco da fadiga:

  i. indicar claramente os objetivos de segurança para o SGRF;

  ii. requerer que os níveis de responsabilidade sejam claramente identificados para os gestores,
  tripulantes, e demais pessoas relevantes; e

  iii. requerer revisões periódicas para garantir que se mantenha relevante, apropriada e
  aderente à organização;

  d. designação do responsável pelo SGRF e os componentes do GAGEF:

  i. indicar claramente o responsável pelo SGRF do operador, no caso, o gerente de SGRF (pode
  acumular com o gerente do GRF, por exemplo);

  ii. indicar claramente a composição e atribuições do GAGEF; e

  iii. deixar claro que, embora a responsabilidade primária do SGRF seja do detentor de certificado,
  sua implementação efetiva requer a responsabilidade compartilhada entre os gestores, tripulantes,
  sindicato da categoria profissional e demais pessoas relevantes.

  7.1.3. A política deve ser reavaliada sempre que:

  a. as operações sob o SGRF completarem quatro meses de sua entrada em vigor (vide item 8.7.2);

  b. houver um evento de segurança operacional relacionado à fadiga que não tenha sido previsto
  no processo de identificação das ameaças e riscos associados;

  c. as operações sob o SGRF se modificarem substancialmente, afetando a escala, seleção da
  tripulação, treinamento, tipo de aeronave envolvida ou classe de descanso utilizada; ou

  d. houver emendas à legislação correlata.

  7.2. Responsabilidade pelo sistema de gerenciamento de risco da fadiga [117.63(b)(1)(ii)]

  7.2.1. O gerenciamento efetivo da fadiga exige o reconhecimento da responsabilidade compartilhada
  entre o operador e o tripulante, mesmo que os meios para o atingir variem.

  7.2.2. Aspectos do contexto organizacional influenciam a maneira como as pessoas cumprem
  suas responsabilidades acerca do gerenciamento da fadiga. Por isso, o operador deve ser
  capaz de demonstrar como a responsabilidade compartilhada é compreendida e implementada
  na sua organização.

  7.2.3. São dois os níveis de responsabilidades acerca de um SGRF:

  a. do operador;

  b. do tripulante.

  7.2.4. O operador é responsável por (vide seção 117.63 do RBAC nº 117):

  a. prover recursos adequados para o gerenciamento da fadiga;

  b. prover e promover um ambiente de trabalho que enfatize apropriadamente as formas de controle
  e/ou mitigação dos riscos associados à fadiga;

  c. apresentar evidências de respostas apropriadas aos reportes de fadiga;

  d. apresentar evidências de escalas que possibilitem manter em nível aceitável a fadiga
  no trabalho, bem como de oportunidades adequadas para o tripulante descansar e dormir; e

  e. oferecer treinamento sobre como o gerenciamento da fadiga na organização abrange o trabalho
  e como os tripulantes podem manejar melhor sua própria fadiga, mantendo aberto um canal
  contínuo para orientações e dúvidas.

  7.2.5. Os tripulantes são responsáveis por (vide seção 117.21 do RBAC nº 117):

  a. fazer o melhor uso possível dos períodos de repouso para dormir adequadamente;

  b. apresentar-se ao trabalho aptos para desempenharem suas funções;

  c. gerenciar seus próprios níveis de fadiga;

  d. reportar questões relacionadas à fadiga; e

  e. fazer uso responsável da autoridade (por exemplo, discricionariedade do piloto em comando).

  7.3. Designação do Responsável pelo SGRF e dos Componentes do GAGEF [117.63(b)(1)(iii)]

  7.3.1. O parágrafo 117.63(b)(1)(iii) requer a criação de um GAGEF para implantar e coordenar
  as atividades do SGRF de um operador.

  7.3.2. A composição do GAGEF está indicada no parágrafo 117.3(i) do RBAC nº 117, como se
  segue: “grupo, composto de representantes de todos os envolvidos nas ações de gerenciamento
  da fadiga, que é responsável por coordenar as atividades de gerenciamento da fadiga na organização.
  A implantação e a atualização do Sistema de Gerenciamento de Risco da Fadiga Humana devem
  ser acompanhadas pelo sindicato da categoria profissional”.

  7.3.3. O GAGEF já existente no operador que opere sob os Apêndices B ou C do RBAC nº 117
  pode ser mantido, desde que contemple o contido nesta IS. Caso o detentor de certificado
  opere segundo um GRF e um SGRF, é necessário apenas que ele tenha um único GAGEF, que neste
  caso, deve atender aos itens da presente IS. O tamanho e a composição do GAGEF irão variar
  em função do porte do detentor de certificados, do tamanho e da complexidade das operações
  cobertas pelo GRF e ao nível de risco de fadiga dessas operações.

  7.3.4. Os operadores aéreos de médio ou de grande porte terão departamentos especializados
  que irão interagir com o GAGEF. A Figura 3 apresenta exemplos dessas inter-relações. Cada
  operador deve decidir, com base na sua experiência, os setores que devem participar do seu
  GAGEF.

  7.3.5. Para um grande operador, recomenda-se que o GAGEF tenha, no mínimo, a seguinte composição:

  a. representantes da administração com autoridade e responsabilidade (accountability) para
  coordenar e autorizar as ações decorrentes das decisões emanadas das reuniões do Grupo;

  b. representantes dos pilotos, comissários, despachantes operacionais, pessoal de escala
  de voo e pessoal da área de fatores humanos ou similar;

  c. representantes da área de SGSO; e

  d. em caráter interino ou eventual, consultores (especialistas) com domínio na área científica,
  médica, ou qualquer outra que seja pertinente ao problema sendo analisado.

  7.3.6. A Figura 2 abaixo, ilustra a composição de um GAGEF de um operador aéreo de médio
  ou grande porte.


  Figura 3: Composição do GAGEF de operadores médios ou grandes.

  (Fonte: AC 120-003A - modificado)


  7.3.7. O gerente de SGRF (vide definição) deverá compor o GAGEF, sendo o gestor do grupo
  e responsável pelas ações relativas ao SGRF. Se não puder participar de todas as reuniões
  do GAGEF, deverá dar ciência nas atas geradas pelo grupo e documentar eventuais decisões
  decorrentes.

  7.3.8. Para pequenos operadores (até 10 tripulantes), um único indivíduo pode representar
  mais de um grupo de partes interessadas. Por exemplo, o piloto chefe também pode ser o escalador.

  7.3.9. A Figura 4 abaixo, ilustra a composição do GAGEF para um pequeno operador aéreo.


  Figura 4: Composição do GAGEF de operadores pequenos.

  (Fonte: AC 120-003A - modificado)


  7.3.10. Embora a ANAC possa observar as reuniões do GAGEF (ou analisar as atas e resultados)
  como parte de suas atividades de fiscalização, ela não é um componente desse grupo.

  7.3.11. A categoria de representantes de tripulantes pode incluir os tripulantes da própria
  empresa e representantes de associações, se houver.

  7.3.12. Participação do Sindicato Nacional dos Aeronautas (SNA).

  7.3.12.1. As atividades de implantação (certificação) e atualização do GRF, como informado
  pelo RBAC nº 117, devem ser acompanhadas pelo sindicato da categoria profissional dos aeronautas
  (vide a seção 117.3(i) do RBAC nº 117).

  7.3.12.2. Em função do item acima, o representante indicado pelo SNA:

  i. deve ter acesso aos procedimentos, atas de reunião, relatórios e demais documentos pertinentes
  relacionados ao GRF e que tenham passado pelo GAGEF;

  ii. deve participar das reuniões do GAGEF. Para detentores de certificado que operem segundo
  as regras do RBAC nº 121 a participação deve ser obrigatoriamente presencial;

  iii. recomenda-se o envio da documentação ao representante do SNA em até 2 dias contados
  da data reunião ou da confecção da respectiva ata, a qual deve ser assinada pelo SNA.

  7.3.12.3. Sobre os documentos a serem tratados no GAGEF, recomenda-se a desidentificação
  de reportes ou casos que adentrem a individualidade.

  7.3.12.4. É importante ressaltar que a ANAC irá considerar, nas suas análises, as informações
  do SNA sobre o SGRF do operador. Tais informações, caso se refiram a assuntos técnicos da
  competência dessa Agência, serão enviadas ao operador, devendo este enviar à ANAC análise
  do assunto.

  7.3.12.5. Os participantes do sindicato no GAGEF devem ser formalmente indicados pelo presidente
  do Sindicato. Eles devem receber treinamento sobre o assunto e assinar um termo de responsabilidade
  e de confidencialidade elaborado pelo operador, para resguardo de informações às quais tiver
  acesso.

  7.3.13. As atribuições do GAGEF são aquelas relacionadas as atividades constantes da seção
  117.63 do RBAC nº 117. Resumidamente, pode-se citar:

  a. auxiliar na implementação do SGRF;

  b. desenvolver e manter a política e os objetivos do SGRF:

  i. propor as políticas e objetivos do SGRF;

  ii. propor o compromisso da administração;

  iii. propor as responsabilidades de cada um dos setores diretamente envolvidos no SGRF a
  respeito do gerenciamento do risco da fadiga;

  iv. estabelecer o quantitativo mínimo de integrantes do GAGEF, bem como definir eventuais
  substituições em cada classe de integrante e suas respectivas responsabilidades;

  v. estabelecer os procedimentos internos, incluindo o procedimento de tomada de decisão
  no GAGEF;

  vi. promover reuniões periódicas para discussão dos assuntos relacionados à fadiga;

  vii. planejar o cronograma anual de reuniões;

  viii. convocar consultores nas áreas relacionadas a demandas técnicas oriundas dos temas
  discutidos em reunião ou sempre que for necessária a manifestação de especialistas;

  ix. desenvolver a documentação do SGRF e responsabilizando-se pela sua manutenção; e

  x. cooperar com a ANAC em relação à auditoria do SGRF;

  c. administrar os processos de gerenciamento de riscos de fadiga:

  i. desenvolver, implementar e monitorar os processos de gerenciamento de risco da fadiga;

  ii. operacionalizar a coleta de dados que irão subsidiar as análises sobre os eventos de
  segurança quanto à fadiga;

  iii. propor relatórios de coleta de dados e de análise de risco, indicadores e fatores contribuintes;

  iv. desenvolver, implementar e monitorar indicadores (SPI) de desempenho do SGRF que sejam
  eficazes;

  v. propor a adoção de ferramentas de medição do nível de fadiga dos tripulantes envolvidos
  na(s) operação(ões) específica(s) objeto do SGRF;

  vi. desenvolver, implementar e monitorar controles e mitigações, conforme necessário, para
  gerenciar os riscos de fadiga identificados;

  vii. desenvolver, implementar e monitorar processos para a identificação de perigos relacionados
  à fadiga;

  viii. assegurar que uma avaliação de risco abrangente seja realizada para os perigos relacionados
  à fadiga;

  ix. garantir que os membros da tripulação e outros recebam resposta aos seus reportes de
  fadiga;

  x. estabelecer os limites operacionais de cada operação específica que será objeto do SGRF;
  e

  xi. comunicar riscos de fadiga e o desempenho do SGRF ao gerente do SGRF;

  d. contribuir para os processos de garantia da segurança operacional quanto à fadiga:

  i. desenvolver, implementar e monitorar processos de garantia da segurança operacional:

  ii. cooperar com os demais setores do operador para desenvolver, implementar e monitorar
  os processos de garantia de segurança, baseado nos indicadores (SPI) e metas acordados;

  iii. propor ações de auditoria contínua para mensuração da efetividade do sistema adotado,
  bem como propor ações corretivas para contínua melhoria do sistema;

  iv. zelar pelo correto cumprimento dos requisitos relativos ao RBAC nº 117, propondo também
  ações corretivas em caso de desvios e violações neste cumprimento;

  v. supervisionar a operação contínua dos processos do SGRF;

  vi. identificar alterações (procedimentos, indicadores, objetivos, políticas etc.) necessárias
  ao SGRF;

  vii. propor estudos que meçam a fadiga dos tripulantes, quando necessários para a identificação
  de perigos ou para monitoramento da efetividade dos controles e mitigações;

  viii. identificar perigos emergentes relacionados à fadiga; e

  ix. melhorar a eficácia do SGRF; e

  e. ser responsável pelos processos de promoção e comunicação do SGRF:

  i. desenvolver e manter estratégias de comunicação com todos os envolvidos no SGRF;

  ii. aprovar o cronograma de treinamento, os instrutores, os recursos cabíveis e tomar decisões
  relacionadas aos eventos de treinamento;

  iii. ser responsável pelo desenvolvimento, atualização e entrega de materiais de educação
  e treinamento do SGRF (essas atividades podem ser terceirizadas, inclusive para o setor
  de treinamento do operador, mas o GAGEF é responsável por garantir que eles atendem aos
  requisitos do SGRF e são eficazes); e

  iv. garantir que todo o pessoal relevante receba treinamento apropriados do SGRF, e que
  os registros de treinamento sejam mantidos como parte da documentação do SGRF.

  7.3.14. O GAGEF deve reunir-se, no mínimo, mensalmente durante a fase de implantação do
  SGRF, no seu primeiro ano de operação e sempre que grandes mudanças ocorrerem. As reuniões
  devem ser suficientemente longas e auxiliadas com recursos que permitam a melhor tomada
  de decisão. Sempre que necessário, reuniões em intervalos mais curtos (para acompanhamento
  de uma situação específica, por exemplo) devem ser planejadas, semanal, quinzenalmente ou
  sempre que uma dada operação ocorrer. Em todos os casos, deve ser assegurada a participação
  do SNA.

  7.3.15. As reuniões do GAGEF devem ser registradas em ata própria de reunião, as quais devem
  incluir eventuais divergências sobre as decisões tomadas. Dentro das possibilidades de cada
  GAGEF, deveria haver consenso das decisões tomadas por aquele Grupo. O GAGEF deveria estabelecer
  no MO o quórum mínimo das reuniões.

  7.3.16. Os membros do GAGEF devem ter conhecimento profundo do RBAC nº 117, da IS nº 117-001,
  da IS nº 117-003 e desta IS, bem como da cultura do país e do ambiente operacional do seu
  operador. Também deve conhecer a cultura profissional dos seus funcionários (subculturas),
  assim como a cultura e clima organizacionais, de forma a aproximar conhecimentos e experiência
  da área de CRM e Fatores Humanos às decisões no âmbito do GRF.

  7.3.17. O GAGEF já existente no operador que opere sob os Apêndices B ou C do RBAC nº 117
  pode ser mantido, desde que contemple o contido nesta IS. Caso o detentor de certificado
  opere segundo um GRF e um SGRF, é necessário apenas que ele tenha um único GAGEF, que neste
  caso, deve atender aos itens da presente IS.

  7.4. Documentação [117.63(b)(1)(iv)]

  7.4.1. A documentação descreve todos os elementos do SGRF, fornecendo um registro das suas
  atividades e quaisquer alterações daquele Sistema.

  7.4.2. Ela é essencial para auditorias internas e externas do SGRF. A documentação pode
  ser centralizada em um manual do SGRF ou as informações necessárias podem ser integradas
  ao MO.

  7.4.3. A documentação do SGRF deve ser formalmente aprovada pelo gestor responsável do operador
  e ser acessível a todo o pessoal que possa precisar consultá-la e à ANAC. Seu conteúdo mínimo
  está abaixo especificado:

  a. política e objetivos do SGRF;

  b. processos e procedimentos do SGRF;

  c. responsabilidades e autoridades por esses processos e procedimentos;

  d. mecanismos para o envolvimento contínuo da administração, membros da tripulação e todos
  os outros funcionários envolvidos;

  e. programa de treinamento SGRF, requisitos de treinamento e registros de atendimento;

  f. limitações de jornada, tempo de voo, sobreaviso, reserva, repouso etc.;

  g. horários de voo programados e reais, períodos de serviço e períodos de descanso com desvios
  e razões para os desvios observados;

  h. resultados do SGRF, incluindo descobertas de dados coletados, recomendações e ações tomadas;
  e

  i. composição e atribuições do GAGEF.

  7.4.4. A documentação deve ser reavaliada sempre que:

  a. as operações sob o SGRF completarem quatro meses de sua entrada em vigor (vide item 8.7.2);

  b. houver um evento de segurança operacional relacionado à fadiga que não tenha sido previsto
  no processo de identificação das ameaças e riscos associados;

  c. as operações sob o SGRF se modificarem substancialmente, afetando a escala, seleção da
  tripulação, treinamento ou tipo de aeronave envolvida; ou

  d. houver emendas à legislação correlata.

  Processos de Gerenciamento de Riscos da Fadiga (GRF) no SGRF [117.63(b)(2)]

  8.1. Introdução

  8.1.1. Os processos de GRF fazem parte do dia a dia do SGRF. São eles que permitem ao operador
  alcançar os objetivos de segurança definidos na sua política de SGRF.

  8.1.2. Juntamente com os processos de GSO (quadro azul da Figura 2), os processos de GRF
  constituem as atividades operacionais do SGRF.

  8.1.3. O quadro verde da Figura 5 descreve os processos de gerenciamento de risco da fadiga.
  A partir dela, observa-se que a eficácia de todas as ações mitigatórias é capturada nos
  dados de fadiga monitorados continuamente, de forma que os processos formem um ciclo fechado.
  Diferentes níveis de perigo de fadiga podem ser gerenciados de forma diferente dentro da
  organização.

  8.1.4. Uma série de dados monitorados nos processos de SGRF é usada para gerar indicadores
  de desempenho (Safety Performance Indicators - SPI). Juntamente com dados obtidos fora do
  SGRF, os indicadores são usados nos ciclos de GRF e de GSO do SGRF para checar se um nível
  aceitável de risco de fadiga e de segurança está sendo mantido.


  Figura 5. Atividades Operacionais do SGRF: Processo de Gerenciamento de Riscos da Fadiga
  (Fonte: AC 120-003A - modificado).


  8.1.5. Conforme ilustrado na Figura 5, os processos de gerenciamento de risco da fadiga
  são:

  a. identificação das operações onde o SGRF será aplicado (operações específicas) (item 1
  do quadro verde) (vide item 8.2 adiante);

  b. coleta de dados relacionados à fadiga (item 2 do quadro verde) (vide item 8.3 adiante);

  c. identificação de situações em que a fadiga pode constituir um perigo (item 3 do quadro
  verde) (vide item 8.4 adiante);

  d. avaliação e mitigação dos riscos (item 4 do quadro verde) (vide itens 8.5 e 8.6 adiante);
  e

  e. monitoramento da efetividade dos controles e mitigações (item 5 do quadro verde) (vide
  item 8.7 adiante).

  8.1.6. Quando um detentor de certificado obtiver dados por meio de um GRF que indiquem que
  os valores máximos e mínimos requeridos pelos parágrafos 6.2.3.f estão muito altos ou muito
  baixos, respectivamente, ele deve emendar o SGRF para garantir que estes valores sejam aceitáveis.
  Neste caso, devem ser aplicados os procedimentos de gestão da mudança.

  8.2. Identificação das operações onde o SGRF será aplicado

  8.2.1. É importante que o detentor do certificado identifique claramente as operações em
  que o SGRF será aplicado. Diferentes tipos de operações de voo podem envolver diferentes
  causas de fadiga dos tripulantes e podem exigir diferentes controles e estratégias para
  mitigar os riscos associados. Dentro de seu SGRF, um detentor de certificado pode precisar
  desenvolver vários conjuntos de diferentes processos de GRF para diferentes operações. Estes
  devem ser claramente identificáveis.

  8.3. Processo de Coleta de Dados Relacionados à Fadiga [117.63(b)(2)(i) e (iii)]

  8.3.1. Para maximizar a utilidade dos reportes de fadiga gerados pelos tripulantes, os procedimentos
  devem ser organizados para capturar todas as informações relevantes, como a programação
  que leva ao reporte de fadiga, as ações do funcionário para obter descanso, evidência subjetiva
  e objetiva de fadiga, condições ambientais que podem ter exagerado ou contribuído para a
  fadiga, condições médicas ou de saúde relevantes, ações específicas (comissões e / ou omissões)
  relacionadas ao incidente e comunicações antes e durante o evento. A política corporativa
  deve fornecer proteção de privacidade e métodos para proteger o funcionário de ações adversas
  que desestimulem os reportes.

  8.3.2. As tecnologias desenvolvidas para monitorar o sono e o desempenho dos membros da
  tripulação podem ser usadas para suplementar os autorrelatos de fadiga. Embora possa não
  ser prático aplicar essas tecnologias continuamente, estudos periódicos de sono real (usando
  actígrafos ou diários de sono) e fadiga (usando medidas de desempenho e avaliações subjetivas)
  podem ser altamente valiosos para medir objetivamente a extensão da fadiga em diferentes
  tipos de operações e isolando os principais condutores de fadiga. O detentor de certificado
  deve usar os resultados dessas avaliações como dados de entrada do processo de garantia
  da segurança no SGRF para avaliar melhor a fadiga potencial em operações futuras (por exemplo,
  em uma nova proposta de escala de serviço dos tripulantes).

  8.3.3. Maiores informações sobre a utilização de ferramentas para o monitoramento da fadiga
  estão contidas no Apêndice B. O item 8.4.3 desta IS contém detalhes sobre a coleta de dados
  individuais dos tripulantes.

  8.4. Procedimentos de Identificação dos Perigos [117.63(b)(2)(iv)]

  8.4.1. Processos de identificação de perigos.

  8.4.1.1. Um SGRF necessariamente envolve três processos de identificação de perigo:

  a. preditivo;

  b. proativo (ou preventivo, como no SGSO); e

  c. reativo.

  8.4.1.2. A figura abaixo resume os três tipos de identificação de perigo e os respectivos
  métodos de avaliação:


  Figura 6. Tipos de Identificação de Perigo (Fonte: DOC 9966 2º ed., 2016).

  8.4.2. Processos preditivos.

  8.4.2.1. Os processos preditivos de identificação de perigos devem ser capazes de identificar
  perigos relacionados à fadiga pelo exame da escala do tripulante no seu período de planejamento
  e antes de sua publicação e levar em consideração:

  a. fatores que sabidamente afetam o sono;

  b. fatores que sabidamente afetam a fadiga; e

  c. os efeitos de (a) e (b) no desempenho dos tripulantes.

  8.4.2.2. Os métodos de exame dos processos preditivos podem incluir, mas não são limitados
  a:

  a. experiência prévia do detentor de certificado, ou da indústria, e dados coletados em
  tipos similares de operações;

  b. práticas de confecção de escala baseadas em evidências;

  c. modelos biomatemáticos.

  8.4.2.3. Experiência prévia do detentor de certificado.

  a. A experiência coletiva dos gerentes, pessoal da escala e do pessoal operacional é uma
  importante fonte de informações na identificação de perigos de fadiga relacionados à escala.

  b. Por exemplo, um tripulante pode reconhecer uma viagem específica como geradora de alto
  nível de fadiga por causa aos constantes atrasos devido ao mau tempo.

  c. Este conhecimento pode ser potencializado se as pessoas receberem educação sobre a dinâmica
  da perda e recuperação do sono, e sobre o relógio biológico circadiano.

  d. Tais fatores biológicos ajudam a explicar por que algumas práticas de escala afetam a
  fadiga (por exemplo, os voos que iniciam muito cedo, jornadas longas, paradas curtas, oportunidades
  de sono durante o dia e cruzamento de fusos).

  e. Entretanto, quando demandas operacionais mudam, a experiência prévia pode ter uma contribuição
  limitada. O processo de escala baseado em práticas já instaladas pode não funcionar para
  situações novas. Por isso, é importante se obter a coleta de dados reais de fadiga dos tripulantes,
  no intuito de checar se as lições deixadas pela experiência ainda continuam válidas.

  f. Outra forma de identificar perigos relacionadas à escala é buscar informações em escalas
  similares. Isso pode incluir relatórios de incidentes e de fadiga, ou publicações científicas
  e outras informações disponíveis para operações similares. A confiança deste método depende
  diretamente de quão similares são de fato as operações escolhidas para comparação.

  8.4.2.4. Práticas de confecção de escalas baseada em evidências.

  a. A identificação de perigos de fadiga relacionados à escala também pode ser predita quando
  a ciência da fadiga é aplicada.

  b. As escalas baseadas em evidências podem ser desenvolvidas por um expert, por exemplo,
  um escalador treinado em identificação de perigos ou pelo GAGEF.

  c. As bases científicas para as regras de escalas devem estar registradas junto à documentação
  de SGRF.

  d. O monitoramento dos níveis de fadiga nos processos de gerenciamento de risco de fadiga
  serve de mecanismo para a melhoria contínua das regras de escalas baseadas em evidências.

  e. Perigos potenciais de fadiga podem ser identificados a partir de escalas que se aproximam
  ou excedem as regras utilizadas para as escalas baseadas em evidências. Isto pode ocorrer
  devido a problemas na operação.

  8.4.2.5. Modelos biomatemáticos.

  a. A modelagem biomatemática pode identificar potenciais perigos de fadiga por meio de análise
  de uma programação, que pode ser usada como um gatilho para uma investigação mais aprofundada.

  b. Dos modelos comerciais disponíveis, o que mais se tem de confiável é a predição de níveis
  relativos de fadiga - “o perigo de fadiga deve ser maior nesta ou naquela escala?”.

  c. Por outro lado, modelos biomatemáticos não deveriam ser utilizados sem fazer referência
  à experiência operacional. Os modelos objetivam predizer aspectos da escala que pode gerar
  um aumento no risco de fadiga. Eles não se constituem em si um SGRF, mas sim uma ferramenta
  dentre várias que pode ser utilizada no SGRF.

  8.4.3. Processos Proativos.

  8.4.3.1. Os processos proativos de identificação de perigos devem ser capazes de identificar
  perigos relacionados à fadiga durante operações de voo correntes.

  8.4.3.2. Os métodos de identificação do processo proativo podem incluir, mas não são limitados
  a:

  a. autorrelato (reporte) de risco da fadiga [Prgf. 117.63(b)(2)(i)];

  b. pesquisas de fadiga com os tripulantes;

  c. dados de desempenho individual do tripulante;

  d. bancos de dados de segurança acessíveis e estudos científicos;

  e. análise de tempo trabalhado planejado versus real;

  f. monitoramento do sono.

  8.4.3.3. Autorrelato (reporte) de risco da fadiga [Prgf. 117.63(b)(2)(i)].

  a. Relatórios (reportes) que informem altos níveis de fadiga ou questões de desempenho relacionadas
  à fadiga são uma fonte vital de informação para a identificação dos perigos da fadiga no
  dia a dia da operação, tanto quando o operador segue os limites prescritivos quanto no SGRF.
  O reporte pode vir dos tripulantes ou outras pessoas.

  b. Dependendo do modelo de relatório de perigo do SGSO do operador, um modelo específico
  para a fadiga pode não ser necessário, desde que ele seja capaz de coletar as informações
  adequadas. Tal inclui informações sobre sono recente (no mínimo dos três dias anteriores),
  hora do dia em que aconteceu e medidas de diversos aspectos da fadiga (por exemplo, preenchimento
  de escalas de alerta e sonolência). Os reportes de fadiga também deveriam oferecer espaço
  para comentários para que a pessoa possa explicar de detalhar o contexto e fornecer seu
  entendimento sobre o que ocorreu. A coleta de informações para identificar a fadiga como
  um fator contribuinte de acidentes deveria ser incluída nos formulários de relatório de
  incidentes e acidentes.

  c. Reportes de fadiga devem ser avaliados continuamente pelo GAGEF, e este deve dar ao tripulante
  ou ao grupo interessado o retorno sobre as ações tomadas, ou explicar por que nenhuma ação
  foi tomada. Uma sequência de reportes sobre uma rota particular ou uma série específica
  de turnos deve ser um gatilho para melhor investigação do GAGEF.

  8.4.3.4. Pesquisas de fadiga com os tripulantes.

  a. Basicamente, há dois tipos de pesquisas sobre fadiga:

  i. pesquisas retrospectivas, as quais perguntam aos tripulantes sobre suas experiências
  de sono passadas, fadiga e fatores que a causaram. Elas podem ser relativamente longas e
  ser completadas apenas uma vez ou em um longo período de tempo (por exemplo, uma vez ao
  ano); e

  ii. pesquisas prospectivas, as quais solicitam aos tripulantes registrarem suas experiências
  de sono passadas e fadiga em tempo real. Elas são relativamente curtas e são completadas
  múltiplas vezes para monitorar a fadiga durante uma jornada, escala ou viagem. Normalmente
  incluem medidas de sonolência, fadiga e humor.

  b. O Apêndice B desta IS lista medidas padronizadas de fadiga e sonolência que podem ser
  utilizadas nas pesquisas retrospectivas, e outras que podem ser utilizadas em pesquisas
  prospectivas. São escalas validadas e largamente utilizadas em operações de voo. A partir
  do uso de escalas padronizadas, o GAGEF poderá comparar níveis de fadiga entre operações
  (do próprio operador ou de outros), por meio do tempo, e com dados advindos de estudos científicos.
  Isso pode ajudar a tomada de decisões sobre onde os controles e as ações mitigatórias são
  mais necessários.

  c. As pesquisas de fadiga também podem focar uma operação particular ou uma questão específica.
  Por exemplo, uma série de reportes de fadiga sobre um padrão particular de jornadas pode
  estimular o GAGEF a conduzir pesquisas, tanto retrospectivas quanto prospectivas, com os
  tripulantes sujeitos àquela condição para verificar quão amplo está o problema. O GAGEF
  também pode conduzir pesquisas sobre os efeitos de mudanças de programações. Também podem
  ser mais gerais, como uma visão geral da fadiga num setor, frota de aeronave e tipo de operação.

  d. Comparadas a outros tipos de monitoramento de fadiga, as pesquisas podem ser rápidas
  e baratas e providenciar uma fotografia dos níveis de fadiga e suas causas potenciais. Se
  a maioria da população alvo (idealmente mais de 70%) participar da pesquisa, o quadro é
  mais representativo. Estes tipos de pesquisas são subjetivos, pois trata-se de uma lembrança
  e opinião pessoas do sujeito, assim, obter um quadro representativo da população é importante
  para direcionar as ações do GAGEF.

  8.4.3.5. Dados de desempenho individual.

  a. Medidas de desempenho provêm dados que podem ser utilizados para suplementar os dados
  subjetivos coletados nos reportes de fadiga e nas pesquisas. Atualmente há três tipos principais
  de abordagem de monitoramento do desempenho, cada qual com sua força e fraqueza.

  b. Primeiramente, um apanhado de testes simples desenvolvidos e validados em laboratórios
  podem ser adaptados para uso em operação. Eles medem aspectos de desempenho de um tripulante
  (por exemplo, tempo de reação, vigilância, memória de curto prazo, etc.). Na escolha de
  um teste para mensurar a fadiga de um tripulante, é importante considerar:

  i. O teste dura quanto tempo? Ele pode ser completado em vários momentos (por exemplo, ao
  longo de uma jornada ou durante um voo) sem comprometer a habilidade de cumprir os limites
  de jornada e a operação?

  ii. O teste foi validado? Por exemplo, ele demostrou ser sensível aos efeitos de perda de
  sono e do ciclo circadiano sob condições experimentais controladas?

  iii. O teste é preditivo em relação a tarefas mais complexas, como desempenho em simulador?

  iv. O teste já foi utilizado em outra operação de voo similar, e os dados estão disponíveis
  para comparar os níveis de fadiga entre operações?

  c. Estas medidas podem ser desvantajosas por interromper o fluxo normal de trabalho. Além
  disso, pouco se sabe como o desempenho em um teste simples reflete o desempenho em tarefas
  mais complexas, ou na contribuição do desempenho do grupo. Por outro lado, esta é uma abordagem
  prática disponível.

  d. Em segundo lugar, há um considerável interesse em encontrar meios de relacionar os níveis
  individuais de fadiga aos dados coletados sistematicamente por meio de um sistema automatizado
  (FDA). A vantagem é que estes dados coletados rotineiramente não interrompem o fluxo normal
  de trabalho, e são relevantes para a segurança operacional. A dificuldade é que muitos fatores
  contribuem para os desvios dos parâmetros planejados. Por exemplo, para poder utilizar os
  dados do FDA como uma medida de fadiga de um tripulante seria necessário demonstrar mudanças
  consistentes no FDA que estivessem ligadas a outras medidas de fadiga do tripulante (por
  exemplo, perda de sono nas últimas 24 horas, horário do ciclo circadiano, etc.). Pesquisas
  nesta área estão sendo desenvolvidas.

  e. A terceira abordagem demanda a presença de observadores treinados pontuando o desempenho
  do pessoal operacional enquanto trabalham (por exemplo, LOSA). Entretanto, isso é bastante
  exigente e pode custar caro. Ter a presença de um observador também pode despertar o alerta
  do observado e gerar outras demandas ao tripulante. Estes fatores atualmente limitam a utilidade
  desta prática no âmbito da busca de perigos proativos do SGRF, embora possa ser utilizada.

  8.4.3.6. Bancos de dados de segurança acessíveis e estudos científicos.

  a. Outras informações gerais sobre os perigos da fadiga podem estar disponíveis em bancos
  de dados externos, mantidos pela autoridade e bancos de dados dos provedores de serviços
  e de instituições de pesquisa. Por serem relativamente raros, os bancos de dados que coleta
  e analisam eventos de segurança são uma importante fonte adicional de informações que complementa
  a mensuração da fadiga nas operações cobertas pelo SGRF.

  b. Pesquisas de fadiga em operações estão expandindo. O valor particular destes estudos
  é o maior rigor científico utilizado, o que aumenta a confiança nos seus resultados. O nível
  de detalhamento em material científico pode ser maior do que o necessário para a identificação
  proativa de perigos, contudo, a maioria dos artigos apresentam um resumo contendo as principais
  descobertas, o que pode ser muito útil ao GAGEF.

  8.4.3.7. Análise da jornada trabalhado planejada versus real.

  a. A identificação preditiva de perigos de fadiga deve ser feita já no planejamento de escalas.
  Entretanto, diversas circunstâncias imprevisíveis podem gerar mudanças ao planejamento inicial,
  como condições meteorológicas, falhas mecânicas ou de automação não esperadas, indisponibilidade
  de pessoal por doenças, por exemplo. A fadiga se relaciona ao que é realmente trabalhado,
  não ao que foi planejado. Dados dos períodos reais trabalhados podem identificar os momentos
  em que a fadiga tenha sido maior que o esperado no planejamento.

  b. Dados de períodos de trabalhado planejados e trabalhados são requeridos tanto na abordagem
  prescritiva quando no SGRF. Sob a busca proativa de perigos no SGRF, o GAGEF pode utilizar
  estes dados para rastrear com qual frequência em cada mês:

  i. as jornadas terminaram 30 minutos após o planejado;

  ii. a jornada máxima diária estipulada na política de SGRF foi excedida;

  iii. quantas e quais trocas de turno e de viagem aconteceram.

  8.4.3.8. Monitoramento do sono.

  a. Dada a importância primária da perda de sono e sua recuperação na dinâmica da fadiga,
  outro método útil e comumente utilizado na identificação proativa de perigos é o monitoramento
  do sono. O sono pode ser monitorado de várias maneiras, cada forma tendo vantagens e desvantagens.
  Veja o Apêndice B desta IS.

  b. O método mais simples de monitorar o sono é pedir que os tripulantes completem um diário
  de sono antes, durante e depois o momento a ser estudado. Normalmente é solicitado que registrem
  quando dormiram e que avaliem a qualidade do sono obtido assim que acordarem. Isso pode
  ser feito em papel ou métodos eletrônicos.

  c. Uma medida mais objetiva de mensurar os padrões de sono e enquanto acordado é por meio
  do monitoramento contínuo do movimento, utilizando um actígrafo. O actígrafo é um aparelho
  semelhante a um relógio de pulso que deve ser usado continuamente (exceto durante o banho).
  Os dados da quantidade de movimento são gravados regularmente (normalmente a cada minuto)
  e é baixada no computador após algumas semanas, para análise. Por não ser barato, apenas
  uma amostra de tripulantes terá seu sono monitorado desta maneira. Os sistemas atuais exigem
  que uma pessoa treinada processe e analise os dados.

  d. Em casos mais raros, quando os riscos esperados de fadiga são altos ou incertos (por
  exemplo, em rotas novas), aparelhos de polissonografia portáteis podem ser utilizados durante
  o expediente. Isso envolve a colocação de eletrodos na cabeça e no rosto para gravar sinais
  elétricos do cérebro (eletroencefalografia ou EEG), movimentos dos olhos (eletro-oculografia
  ou EOG) e os músculos do queixo (eletromiografia ou EMG). A polissonografia é o método “padrão-ouro”
  na avaliação de quantidade e qualidade do sono, mas é relativamente invasivo para os participantes,
  e caro tanto em termos de equipamento quanto pela necessidade de um técnico treinado que
  faz a pontuação manualmente.

  8.4.4. Processos Reativos

  8.4.4.1. Os processos reativos de identificação de perigos devem ser capazes de identificar
  a contribuição dos perigos relacionados à fadiga aos eventos reais que poderiam afetar,
  ou afetaram de fato, a segurança, com a visão de determinar como os efeitos de fadiga em
  cada evento poderiam ter sido minimizados.

  8.4.4.2. Os eventos reais citados em 8.4.4.1 podem incluir, mas não estão limitados àqueles
  sujeitos a, ou mencionados em, um ou mais dos seguintes:

  a. reportes de fadiga;

  b. reportes confidenciais;

  c. relatórios de auditorias;

  d. relatórios de incidentes de aeronaves relacionados à fadiga [Prgf. 117.61(b)(2)(iii)];

  e. eventos de análise de dados de voo (FDA/FOQA).

  8.4.4.3. Dependendo da severidade do evento, uma análise da fadiga pode ser conduzida pelo
  GAGEF, pelo setor de segurança operacional ou por um especialista externo ou mesmo pela
  ANAC ou CENIPA. As descobertas de qualquer investigação que envolva a fadiga devem ser integradas
  à documentação do SGRF.

  8.4.4.4. Não existe um teste simples (como de sangue) para avaliar a fadiga. Para estabelecer
  que ela teve contribuição em um evento, deve ser demonstrado que:

  a. a pessoa ou a equipe provavelmente estavam fatigados;

  b. a pessoa ou a equipe tiveram ações ou tomaram decisões particulares que foram causais
  no que deu errado; e

  c. tais ações e decisões são consistentes com o tipo de comportamento esperado de uma pessoa
  ou equipe fatigada.

  8.4.4.5. Um método básico de investigação de fadiga está resumido no Apêndice C.

  8.5. Procedimentos de Avaliação de Riscos no SGRF [117.63(b)(2)(v)]

  8.5.1. Os procedimentos de avaliação do risco no SGRF devem ser capazes de determinar:

  a. a probabilidade da ocorrência de eventos ou surgimento de circunstâncias que gerem um
  perigo relacionado à fadiga;

  b. a severidade potencial dos perigos relacionados à fadiga;

  c. quando os riscos de segurança associados aos parágrafos (a) ou (b) requerem mitigação.

  8.5.2. Os procedimentos de avaliação de riscos no SGRF devem garantir que os perigos relacionados
  à fadiga identificados sejam examinados em relação:

  a. ao contexto operacional relevante e os procedimentos nos quais o perigo relacionado à
  fadiga surgiu;

  b. à probabilidade de o perigo relacionado à fadiga surgir nessas circunstâncias;

  c. às possíveis consequências do perigo relacionado à fadiga nessas circunstâncias;

  d. à eficácia dos procedimentos e controles de segurança existentes para prevenir, ou, se
  a prevenção não for possível, para mitigar:

  i. o risco de o perigo relacionado à fadiga surgir; e

  ii. as possíveis consequências do perigo relacionado à fadiga.

  8.5.3. Uma vez que o perigo seja identificado, o nível de risco que ele representa deve
  ser avaliado e uma decisão deve ser tomada no sentido de definir se ele é um risco que deve
  ser mitigado ou não. Avaliar o risco de fadiga pode ser um desafio, pois:

  a. a fadiga pode diminuir a habilidade de uma pessoa em desempenhar praticamente todas suas
  tarefas; e

  b. são muitos os fatores que podem contribuir para o nível de perda do desempenho, muitos
  dos quais imprevisíveis.

  8.5.4. Além disso, não é apenas a capacidade de o tripulante em desempenhar suas tarefas
  que diminui com o aumento da fadiga, mas também sua capacidade em responder aos aumentos
  de demandas em tarefas mais complexas. Tais aumentos de demanda podem ser associados ao
  gerenciamento de ameaças, como um piloto realizando um pouso em condições climáticas desfavoráveis,
  um comissário lidando com uma evacuação não planejada, ou um controlador exposto a uma onda
  de tráfego aéreo não esperada. De modo inverso, a baixa carga de trabalho pode desmascarar
  a sonolência fisiológica experimentada pela pessoa.

  8.5.5. A fadiga raramente é a única causa de um evento, mas é com frequência um fator contribuinte
  em diversos níveis. O nível de risco que a fadiga representa depende da tarefa e do contexto
  onde ela é executada.

  8.5.6. Devido a estas características, os métodos atuais de avaliação de riscos, em relação
  à fadiga, são de certa forma limitados. Por isso, a utilidade dos métodos depende do conhecimento
  e da experiência de quem avalia. Por outro lado, a maturidade do SGSO e a maior experiência
  no SGRF ao redor do mundo tendem a gerar avanços na forma de avaliar os riscos de fadiga.

  8.5.7. Veja as matrizes de avaliação de risco de fadiga no Apêndice A.

  8.6. Procedimentos de Mitigação de Riscos no SGRF [117.63(b)(2)(v)]

  8.6.1. Os procedimentos de mitigação de riscos no SGRF, para cada perigo relacionado à fadiga,
  devem ser capazes de:

  a. selecionar estratégias de mitigação apropriadas para o perigo;

  b. implementar a estratégia de mitigação selecionada; e

  c. monitorar a implementação e eficácia das estratégias adotadas.

  8.6.2. Seleção de estratégias de mitigação apropriadas para o perigo.

  a. Os processos de avaliação dos riscos determinam se um perigo de fadiga requer ou não
  mitigação. O mais importante na escolha das ações mitigatórias é o nível estimado de risco
  de fadiga associado. Todas as ações mitigatórias requerem recursos (esforço, tempo, custos),
  por isso recursos limitados devem ser priorizados onde o risco de fadiga realmente necessita
  ser controlado.

  b. Uma cuidadosa seleção de mitigações efetivas de fadiga baseia-se em dados, e não na medida
  desinformada de se fazer “alguma coisa a respeito”. A identificação de mitigações que são
  de fato aplicáveis podem ser buscadas em estudos científicos, literatura científica relevante
  e experiência em SGRF do próprio operador ou de outros operadores similares.

  c. As estratégias de mitigação da fadiga e seu efetivo controle vão muito além dos períodos
  de jornada e repouso. Para jornada muito longas, que iniciam muito cedo pela manhã, finalizam
  muito tarde ou atravessam a noite, os controles e mitigações devem ser considerados numa
  sucessão de dias e jornadas. Especial atenção deve ser dada às influências circadianas nos
  horários de dormir e acordar, independentemente dos horários de sono e repouso. Estratégias
  que focam apenas uma jornada podem não identificar os efeitos da fadiga acumulada e se tornarem
  ineficazes numa sequência de jornadas. Ainda, a identificação de ações mitigatórias requer
  um entendimento mais amplo do conhecimento científico da área, experiência operacional e
  regulações aplicáveis. Neste sentido, o GAGEF deve sempre participar da identificação de
  estratégias de mitigação aplicadas e ser consultado em todas as decisões que envolvam ações
  mitigatórias relacionadas à fadiga.

  8.6.3. Monitorar a implementação e eficácia das estratégias adotadas.

  a. Os dados monitorados nos processos de gerenciamento de risco da fadiga geram indicadores
  de desempenho (Safety Performance Indicators - SPI), que fornecem uma métrica para monitorar
  a eficácia dos controles de fadiga e as mitigações. Se a tendência nos indicadores indicar
  que as ações mitigatórias não estão adequadas e que o perigo de fadiga continua, então uma
  detalhada avaliação do risco da situação deve ser realizada e novas ações mitigatórias propostas
  se necessário. Os indicadores também são uma fonte crítica de informações para os processos
  de garantia da segurança do SGRF.

  b. Para que os indicadores sejam úteis, valores e metas aceitáveis devem ser definidos.
  Eles devem ser apropriados ao nível de risco de uma dada operação, e nas regiões “tolerável”
  e “aceitável” da avaliação de risco. Espera-se que uma variedade de indicadores seja levada
  em conta para que a indicação de fadiga seja mais confiável e consequentemente o desempenho
  do SGRF. É importante notar que diferentes indicadores podem ser apropriados em diferentes
  tipos de operação. Os indicadores devem ser identificados junto à ANAC durante o processo
  de implementação do SGRF, e podem mudar à medida que o SGRF é constituído e que as circunstâncias
  se alteram.

  8.6.3.1. Tipos comuns de indicadores são:

  a. indicadores operacionais que monitoram as causas de fadiga relacionadas à jornada. Exemplos
  incluem: o número de vezes em que jornada máxima e excedida; o número de períodos de voo
  que finalizam na janela de baixa do ciclo circadiano (WOCL); o número de reportes antes
  das 06:30 em “x” dias sucessivos;

  b. indicadores baseados em dados reativos de fadiga. Exemplos incluem o número de reportes
  de fadiga em escalas ou programações, incidentes relacionados à fadiga ou eventos FOQA e
  medidas de absenteísmo;

  c. indicadores baseados em monitoramento proativo de níveis reais de fadiga dos tripulantes.

  8.6.3.2. Se as ações mitigatórias atingem o padrão aceitável (isto é, os indicadores alcançarem
  os valores e metas definidas), elas passam a fazer parte das operações normais. Se os controles
  e ações tomadas não reduzem o perigo de fadiga a um nível aceitável, é necessário retomar
  o processo a partir do passo apropriado. Isso pode exigir: apanhar mais informações e dados,
  reavaliar os riscos associados ao perigo, e/ou implementar e avaliar novos controles e mitigações.

  8.6.4. Exemplo de sistema de monitoramento.

  8.6.4.1. Um bom ponto de partida para o desenvolvimento de um sistema de monitoramento da
  implantação e da eficácia das estratégias de gerenciamento de risco da fadiga encontra-se
  na IS nº 117-003. O Apêndice D desta IS apresenta uma ampliação do sistema de coleta de
  informações e dados constante do Apêndice E da IS nº 117-003, sendo aplicável à coleta de
  informações e dados de um SGRF.

  8.7. Processo de monitoramento da efetividade dos controles e mitigações [117.63(b)(2)(ii)]

  8.7.1. Conceitualmente este tópico é semelhante à Seção 9 desta IS, mas o processo descrito
  nesta Seção se concentra nos relatórios individuais de fadiga dos tripulantes. Tais relatórios
  fornecem feedback ao detentor de certificado sobre as condições que podem contribuir para
  a fadiga.

  8.7.2. Se as estratégias de mitigação tiverem um desempenho aceitável, elas se tornarão
  parte das operações normais e serão monitoradas pelos processos de GSO. Se as estratégias
  de mitigação não tiverem um desempenho aceitável, deve-se retomar os processos de GRF na
  etapa apropriada.

  8.7.3. É importante que o GAGEF monitore atentamente os primeiros quatro meses de uma operação
  específica. Ele supervisionará regularmente todos os dados e relatórios de fadiga que chegarem
  e atuará em tempo hábil quando surgirem problemas. Cópias de todos os dados coletados e
  dos dados de monitoramento associados, juntamente com as ações tomadas pelo detentor do
  certificado para mitigar eventos e ocorrências de fadiga, devem estar disponíveis para a
  ANAC durante intervalos regulares de relatórios programados durante aquele prazo. Um relatório
  deve ser compilado e processos de rotina serão definidos para monitoramento e gerenciamento
  de riscos de fadiga ao final do quarto mês da operação específica. Este relatório estará
  disponível para todas as partes interessadas, incluindo a ANAC. Se os indicadores de desempenho
  forem aceitáveis, a operação poderá entrar em um monitoramento de rotina.

  8.7.4. Se os controles e mitigações forem executados com um padrão aceitável, eles se tornarão
  parte das operações normais e serão monitorados pelos processos GSO. Se os controles e mitigações
  não tiverem um desempenho aceitável, será necessário retomar os processos de GRF na etapa
  apropriada. Isso pode exigir:

  a. reunir informações e dados adicionais;

  b. reavaliação do risco de fadiga e dos riscos associados; e/ou

  c. identificação, implementação e avaliação de controles e revisões novos ou revisados mitigações.

  Processos de Garantia da Segurança Operacional (GSO) no SGRF [117.63(b)(3)]

  9.1. Introdução

  9.1.1. Os processos de GSO do SGRF formam o segundo ciclo das atividades operacionais do
  SGRF (vide quadro azul da Figura 7). Têm o objetivo de monitorar quão bem o SGRF de forma
  integral está funcionando. A partir do uso de indicadores (SPI) monitorados nos processos
  de gerenciamento de risco da fadiga (GRF), junto com informações e conhecimento especializados
  de outras fontes, os processos de garantia da segurança no SGRF têm três funções principais:

  a. monitorar se os resultados do SGRF estão sendo entregues em níveis aceitáveis de risco
  de fadiga, estando de acordo com os objetivos de segurança definidos na política de SGRF
  e outros regulamentos aplicáveis;

  b. monitorar as mudanças no ambiente operacional e na organização que podem afetar o risco
  de fadiga nas operações conduzidas sob o SGRF, e identificar maneiras por meio das quais
  o desempenho do SGRF pode ser mantido ou melhorado antes da introdução das mudanças;

  c. prover feedback constante que direciona a melhoria contínua dos processos de gerenciamento
  de riscos da fadiga e dos outros componentes do SGRF.


  Figura 7. Atividades Operacionais do SGRF: Processo de Processos da Garantia da Segurança
  Operacional (Fonte: AC 120-003A - modificado).

  9.1.2. Os procedimentos de garantia da segurança operacional devem contemplar os seguintes
  processos para verificar e validar a efetividade dos controles de riscos relacionados à
  fadiga utilizados pelo detentor de certificado:

  a. processo de monitoramento do desempenho do SGRF (item 1 da figura azul) (vide item 9.2
  adiante);

  b. processo de melhoria contínua do SGRF (item 2 da figura azul) (vide item 9.4 adiante);
  e

  c. processo de gestão da mudança (organizacional e operacional) (item 3 da figura azul)
  (vide item 9.3 adiante).

  9.1.3. Dentro de uma organização, as responsabilidades pelas atividades da garantia de segurança
  do SGRF podem ser distribuídas da forma mais apropriada à empresa aérea, dependendo do número
  e complexidade de operações conduzidas sob o SGRF e do tamanho do operador. Normalmente,
  os processos de garantia da segurança seriam responsabilidade de equipe responsável pelo
  SGSO. Alguns processos especificamente ligados à fadiga podem ser conduzidos pelo pessoal
  do GAGEF. Contudo, outras atividades da garantia de segurança, como a auditoria interna
  dos processos de gerenciamento do risco de fadiga, podem ser conduzidas por unidades organizacionais
  diferentes, que assumem a responsabilidade de administrá-las.

  9.2. Monitorando o desempenho da segurança do SGRF [117.63(b)(3)(i)]

  9.2.1. Geral.

  9.2.1.1. O desempenho do SGRF deve ser verificado por meio dos indicadores de segurança
  (SPI) identificados por meio de uma variedade de fontes, incluindo:

  a. tendências nos indicadores a partir dos processos de gerenciamento de riscos de fadiga
  e do SGSO;

  b. relatórios de perigo e investigações;

  c. auditorias e pesquisas; e

  d. análise e estudos sobre a fadiga.

  9.2.1.2. Quando os indicadores de segurança (SPI) não estão em nível aceitável, os controles
  e mitigações em uso podem necessitar ser modificados por meio dos processos do SGRF. Uma
  revisão dos estudos importantes sobre fadiga pode auxiliar em gerar novas ideias. Investigação
  a respeito de como os reportes de segurança são acompanhados ou a verificação de tendências
  nos reportes e incidentes relacionados à fadiga pode ser requerido. Resultados de auditorias
  podem necessitar ser revistos, checagens podem ser necessárias para verificar se as recomendações
  do GAGEF foram seguidas, se o treinamento de fadiga tem sido oferecido conforme esperado,
  ou se o GAGEF está funcionando de acordo com o previsto no manual do operador, de forma
  a descobrir por que o SGRF não está rodando como esperado. Pode ser apropriado rever os
  indicadores para garantir que eles são de fato medidas apropriadas para o desempenho do
  SGRF.

  9.2.1.3. O operador deve ser capaz de identificar e justificar a escolha dos seus indicadores
  e suas respectivas metas.

  9.2.2. Tendências nos indicadores de desempenho de segurança (SPI) obtidos dos processos
  de GRF e SGSO

  9.2.2.1. Indicadores de segurança (SPI) que medem o desempenho geral do SGRF devem incluir
  alguns indicadores identificados pelo GAGEF como parte do gerenciamento de riscos de fadiga
  para monitorar a efetividade dos controles e mitigações. A natureza dos indicadores pode
  variar de acordo com as operações sujeitas ao SGRF. Eles também podem incluir indicadores
  que capturam aspectos mais amplos do próprio SGRF, como as métricas utilizadas pelo SGSO.
  São exemplos:

  a. número de reportes de fadiga em relação a outros reportes de perigo voluntários;

  b. frequência de reportes de fadiga associado a uma jornada específica ou um padrão;

  c. frequência em que os limites identificados pelos operadores são excedidos;

  d. frequência em que os limites delimitados pelo SGRF são excedidos.

  9.2.2.2. Valores e metas aceitáveis devem ser definidas para os indicadores, e eles devem
  estar sempre na região tolerável dos processos de gerenciamento de risco do operador. Por
  exemplo, um operador pode definir uma meta de não exceder suas jornadas em mais de 10 vezes
  ao mês. As tendências demonstradas pela habilidade de o operador manter os valores aceitáveis
  ou de atingir metas ao longo do tempo podem ser usadas para avaliar o SGRF. As tendências
  podem ser identificadas: em jornadas individuais; padrões de trabalho; períodos de tempo
  mais curtos (como semanais); períodos mais longos (como mensais ou anuais); e em relação
  a localidades específicas, tipo de operação ou grupos de operadores.

  9.2.2.3. À medida que o SGRF amadurece, como parte dos requisitos de reavaliação contínuos,
  indicadores mais sofisticados e metas poderão ser necessários para melhor monitorar o desempenho
  do SGRF.

  9.2.3. Relatórios de perigo e investigações.

  9.2.3.1. O GAGEF deve registrar e armazenar todos os perigos de fadiga encontrados no SGRF,
  bem como as ações tomadas na mitigação, junto à documentação do SGRF. Este registro deve
  ser regularmente avaliado para verificar se ele contém os perigos de fadiga válidos e atuais
  e as medidas de mitigação apropriadas, como parte do processo de garantia da segurança.

  9.2.3.2. Tendências em reportes de fadiga também podem ser monitorados como indicadores
  da efetividade do SGRF. Eventos de segurança em que a fadiga de um tripulante tenha sido
  identificada como um fator contribuinte será menos comum que um reporte de fadiga. Por outro
  lado, a análise regular destes eventos pode elucidar as áreas em que o SGRF pode ser melhorado.
  O valor de ambas as fontes de informação depende do uso de métodos apropriados de análise
  do papel da fadiga no evento.

  9.2.4. Auditorias e pesquisas.

  9.2.4.1. Auditorias e pesquisas podem fornecer medidas de efetividade do SGRF sem depender
  da fadiga ter sido identificada como alta em reportes ou incidentes, ambas situações relativamente
  raras.

  9.2.4.2. Auditorias podem ser utilizadas para avaliar periodicamente a efetividade do SGRF.
  Elas deveriam abordar as seguintes questões:

  a. Todos os departamentos envolvidos estão implementando as recomendações do GAGEF?

  b. O pessoal operacional está utilizando as estratégias de mitigação da fadiga como recomendado
  pelo GAGEF?

  c. O programa de treinamento do SGRF é efetivo?

  d. O SGRF está mantendo a documentação requeridas de suas atividades?

  9.2.4.3. Auditorias internas devem ser conduzidas por uma unidade organizacional externa
  ao GAGEF. As devolutivas das fiscalizações regulatórias podem fornecer informações úteis
  para o monitoramento do desempenho do SGRF. Outro tipo de auditoria que pode ser utilizada
  neste contexto é por meio da reavaliação feita por um painel de especialistas acerca das
  atividades do GAGEF e da validade científica de suas decisões. Este painel também pode fornecer
  atualizações constantes ao GAGEF.

  9.2.4.4. Pesquisas podem fornecer uma fotografia da efetividade do SGRF. Por exemplo, elas
  podem documentar como as escalas e padrões de trabalho estão afetando os tripulantes, tanto
  perguntando a eles sobre experiências recentes (retrospectivas) ou orientando-os ao longo
  do tempo (prospectivas). Nestes casos, as pesquisas deveriam incluir medidas validadas,
  como escalas padronizadas de sonolência e fadiga, e medidas padronizadas dos horários e
  qualidade do sono (veja 12 e Apêndice B). Altos índices de participação (idealmente mais
  de 70%) são requeridos para que os resultados sejam considerados representativos do grupo
  estudado. Ressalta-se que as taxas de resposta tendem a decair quando as pessoas são investigadas
  muito frequentemente (chamada “fadiga do participante”).

  9.2.5. Análises e estudos sobre a fadiga.

  9.2.5.1. Uma análise com foco na segurança deveria ser realizada para avaliar se o SGRF
  estaria adequado para lidar com uma mudança, como quando da introdução de um novo tipo de
  operação ou uma mudança significativa de uma operação já existente conduzida sob o SGRF.
  A análise avalia quais os prováveis efeitos da mudança no risco de fadiga e a adequabilidade
  e efetividade dos processos de gerenciamento de risco para lidar com estes efeitos.

  9.2.5.2. Nos processos de garantia da segurança do SGRF, os estudos de fadiga são utilizados
  principalmente como fontes de informações mais amplas advindas externamente sobre questões
  comuns relativas ao SGRF (enquanto no GRF elas são utilizadas para avaliar perigos específicos).
  São conduzidos tanto quando o operador está preocupado com uma questão mais ampla relativa
  à fadiga para a qual é útil buscar informações de fontes externas, quanto quando uma nova
  operação está sendo conduzida e não se tem muitas informações. As fontes de informação podem
  incluir a experiência de outros operadores, estudos extensos da indústria ou do Estado,
  ou estudos científicos. Este tipo de informação pode ser especialmente útil quando o operador
  está construindo um caso de segurança específico mas tem experiência limitada e pouco conhecimento.

  9.3. Processo de gestão da mudança planejada [117.63(b)(3)(ii)]

  9.3.1. Geral.

  9.3.1.1. Os processos de garantia da segurança do SGRF de um operador devem conduzir um
  processo formal de gestão da mudança que:

  a. identifique as mudanças no ambiente operacional que possam introduzir riscos de fadiga;

  b. identifique as mudanças dentro da organização que possam introduzir riscos de fadiga;

  c. identifique o impacto que uma mudança referida nos itens (a) ou (b) acima pode ter no
  desempenho efetivo do SGRF;

  d. para a referida mudança, qual emenda, alteração ou modificação pode ser necessária ao
  SGRF para garantir o desempenho efetivo continuado;

  e. considere as ferramentas disponíveis que podem ser utilizadas para manter ou melhorar
  o desempenho do SGRF antes da implementação das mudanças; e

  f. determine o prazo para que as mudanças sejam implementadas.

  9.3.1.2. Exemplos de mudanças incluem:

  a. trazer novas operações para o escopo do SGRF;

  b. fazer ajustes aos programas de treinamento;

  c. alterar o perfil da força de trabalho;

  d. alterar o número de funcionários do operador (por exemplo: grandes contratações ou demissões
  de pessoal).

  9.3.1.3. Quando uma mudança planejada é identificada, o operador deve:

  a. utilizar os processos de GRF e GSO para identificar perigos de fadiga, avaliar os riscos
  associados e propor controles e mitigações;

  b. obter aprovação da ANAC para o uso dos controles e mitigações propostos que vão resultar
  em um nível de risco residual aceitável;

  c. documentar a estratégia de administrar quaisquer riscos de fadiga associados à mudança.

  9.3.1.4. Durante o período de implementação da mudança, o monitoramento dos SPI (os que
  já existem ou novos específicos para a mudança) fornece feedback periódicos de que o SGRF
  está funcionando como pretendido sob as novas condições. Exemplos incluem ter um período
  de validação para uma nova rota, durante a qual monitoramento adicional da fadiga dos tripulantes
  é realizado, juntamente a avaliações mais frequentes dos SPI como parte dos processos de
  garantia da segurança do SGRF.

  9.3.2. Mantendo o desempenho do SGRF face a mudanças.

  9.3.2.1. O ambiente da aviação é muito dinâmico e mudanças são uma parte normal da indústria.
  Elas podem ser causadas por fatores externos (por exemplo, novos requisitos regulatórios
  ou de segurança - security) ou pode fatores internos (por exemplo, mudanças gerenciais,
  novas rotas, equipamentos ou procedimentos). Mudanças, não importando a causa, podem gerar:

  a. redução da efetividade dos controles e mitigações que foram implementadas para lidar
  com perigos de fadiga existentes; e

  b. introduzir novos perigos em uma operação, devendo ser gerenciados.

  9.3.2.2. Pelo fato de os processos de garantia da segurança do SGRF avaliarem o desempenho
  global do SGRF, eles fornecem um meio para reconhecer os riscos de fadiga emergentes e de
  administrar as mudanças planejadas.

  9.4. Melhoria contínua [117.63(b)(3)(iii)]

  9.4.1. Geral.

  9.4.1.1. Como os processos de garantia de segurança do SGRF provêm um meio de monitorar
  o desempenho geral do SGRF, eles não apenas oferecem os meios para garantir que o gerenciamento
  adequado da fadiga seja mantido, mas também os meios para a melhoria contínua do SGRF.

  9.4.1.2. Os processos de garantia de segurança do SGRF devem permitir a melhoria contínua
  do SGRF (isto é, a melhoria da eficácia do SGRF) por meio de:

  a. eliminação e/ou modificação dos controles de risco que levaram a consequências inesperadas
  ou que não são mais úteis devido a mudanças no contexto operacional ou organizacional;

  b. avaliação regular e frequente das instalações, dos equipamentos, da documentação, e dos
  procedimentos para determinar suas implicações no gerenciamento e controle dos riscos relacionados
  à fadiga; e

  c. monitoramento e identificação de riscos de fadiga emergentes de forma a permitir a inclusão
  de novos procedimentos e de procedimentos para prevenir ou mitigar tais riscos a tempo.

  9.4.1.3. É importante que as mudanças feitas ao SGRF sejam documentadas de modo a serem
  acessíveis para auditorias internas e fiscalizações da ANAC.

  9.4.2. Reconhecendo riscos emergentes de fadiga.

  9.4.2.1. Análises de tendências dos indicadores de segurança (SPI) podem indicar a emergência
  de um perigo de fadiga que não foi anteriormente reconhecido.

  9.4.2.2. Por exemplo, mudanças em uma parte da organização podem aumentar a carga de trabalho
  e o risco de fadiga em outra parte da organização.

  9.4.2.3. Identificar os riscos emergentes de fadiga é uma importante função dos processos
  de garantia da segurança do SGRF, o qual tem uma perspectiva mais ampla do que os processos
  de gerenciamento de risco puros.

  9.4.2.4. Qualquer risco identificado de fadiga, ou a combinação de riscos existentes para
  os quais os controles atuais forem ineficientes, deveriam retornar ao GAGEF para avaliação
  e gerenciamento por meio do GRF (avaliação do risco, desenho e implementação dos controles
  efetivos e mitigação).

  Promoção e Comunicação do SGRF [117.63(b)(4)]

  10.1. Geral

  10.1.1. Os procedimentos de promoção da segurança no SGRF para perigos relacionados à fadiga
  devem incluir programas de treinamento e comunicação capazes de apoiar e prover melhoria
  contínua todos os elementos do SGRF na manutenção de níveis de segurança ótimos.

  10.1.2. Os procedimentos de promoção da segurança no SGRF devem incluir:

  a. programas de treinamento e educação para tripulantes e demais pessoas relevantes para
  garantir níveis de competência proporcionais aos papeis e responsabilidades de cada pessoa
  sob o SGRF;

  b. um plano de comunicação de SGRF efetivo que:

  i. explique todos os elementos do SGRF aos tripulantes e demais pessoas relevantes; e

  ii. descreva os canais de comunicação que devem ser utilizados para reunir, disseminar e
  aplicar as informações relacionadas ao SGRF.

  10.2. Programa de treinamento sobre fadiga [117.63(b)(4)(i)]

  10.2.1. Para um SGRF ser efetivo, todas as pessoas que contribuem para o desempenho de segurança
  do SGRF devem receber treinamento apropriado. Isso inclui o pessoal operacional alvo, o
  pessoal da escala, qualquer outra pessoa da organização que influencie direta ou indiretamente
  os períodos de trabalho planejados e reais, pessoas da operação que tomam decisões, todos
  os membros do GAGEF e o pessoal envolvido na avaliação geral de risco e na alocação de recursos.
  Também estão incluídos gerentes seniores, em particular o executivo responsável pelo SGRF
  e a liderança sênior de qualquer departamento que lide com operações conduzidas sob o SGRF.

  10.2.2. O conteúdo do treinamento deve ser adaptado de acordo com as diferentes competências
  e tarefas requeridas para cada grupo de forma que façam sua parte efetivamente no SGRF.
  A todos os grupos se requer conhecimento básico sobre as dinâmicas da perda do sono e recuperação,
  os efeitos dos ciclos diários do ritmo circadiano, a influência da carga de trabalho, e
  as maneiras como estes fatores interagem com as demandas operacionais para gerar fadiga.
  Além disso, é útil a todos os grupos obter informações em como administrar suas questões
  pessoais de sono e fadiga. Uma característica especial no treinamento de SGRF é que os princípios
  principais da ciência da fadiga - administração do sono e entendimento dos efeitos do ritmo
  circadiano - são relevantes não só na operação, mas também nas suas vidas fora do trabalho,
  como dirigir de forma segura e se manter saudável. Assim, o treinamento de SGRF trata de
  assuntos com os quais todas as pessoas se identificam, de forma que isso pode ajudar a promover
  o conceito de responsabilidade compartilhada no SGRF.

  10.2.3. Os treinamentos devem seguir conteúdo mínimo do treinamento inicial estipulado na
  IS nº 117-003 e serem complementados com detalhes da operação específica que se pretende
  conduzir sob o SGRF. Como esta IS se dirige àqueles que já operam sob os Apêndices B ou
  C do RBAC nº 117 e já conduziram o treinamento inicial previsto, um treinamento complementar
  será exigido para os casos de SGRF.

  10.2.4. Abaixo segue sugestão de enfoque de treinamento complementar de acordo com o público-alvo.

  a. Público-alvo: pessoal operacional (tripulantes) e pessoal da escala.

  i. Responsabilidades do operador aéreo no gerenciamento da fadiga sob um SGRF:

  A. apresentação das operações sujeitas ao SGRF;

  B. limites de jornada e tempo de voo relacionados às operações específicas;

  C. requisitos de descanso e repouso relativos às operações específicas;

  D. política de reporte de fadiga, procedimentos, processos e formulários envolvidos;

  E. política e procedimentos de mitigação da fadiga;

  F. GAGEF: o que é, de quem se compõe, limites, obrigações e prerrogativas; e

  G. manual do operador aéreo envolvido em atividades sob o SGRF.

  ii. Responsabilidade da tripulação para assegurar repouso adequado e aptidão para o trabalho
  sob um SGRF:

  A. responsabilidades do tripulante de voo e de cabine;

  B. responsabilidade pela declaração de aptidão para o trabalho;

  C. obtenção de repouso com qualidade;

  D. estratégias pessoais para prevenção e gerenciamento dos riscos da fadiga;

  E. responsabilidade no reporte de fadiga;

  F. reconhecimento e autoavaliação da fadiga e identificação dos sinais de fadiga em colegas.

  iii. Processos e procedimentos para mudanças planejadas na escala, incluindo:

  A. uso e limitações de quaisquer ferramentas de escala e modelos biomatemáticos ou outros
  algoritmos que podem ser usados para predizer o nível de fadiga de um tripulante ao longo
  de programações/escalas;

  B. avaliação do impacto potencial da fadiga nas mudanças planejadas;

  C. envolvimento precoce do GAGEF no planejamento da mudança que têm potencial de aumentar
  o risco de fadiga; e

  D. implementação das mudanças recomendadas pelo GAGEF.

  b. Público-alvo: executivos que tomam decisões e gerentes operacionais (neste caso, sugere-se
  uma ementa mais completa para aqueles que não participaram do treinamento inicial previsto
  na IS nº 117-003).

  i. Apresentação das normas sobre fadiga:

  A. artigos da Lei nº 13.475/17, relativos à fadiga;

  B. RBAC nº 117 e suas Instruções Suplementares; e

  C. manual do operador aéreo envolvido em atividades sob o SGRF.

  ii. Responsabilidades do operador aéreo no gerenciamento da fadiga:

  A. apresentação das operações sujeitas ao SGRF;

  B. as responsabilidades (accountabilities) dos diferentes envolvidos (stakeholders) no SGRF,
  incluindo eles mesmos;

  C. GAGEF: o que é, de quem se compõe, limites, obrigações e prerrogativas;

  D. visão geral dos tipos de estratégias de mitigação da fadiga sendo utilizadas na organização;

  E. ligações entre o SGRF e outras partes do SGSO da organização;

  F. ligações entre o SGRF e outras partes da organização, por exemplo departamento de escala
  setor de operações, departamento médico, departamento de segurança, etc.; e

  G. responsabilidade do operador aéreo para garantir repouso adequado e aptidão para o trabalho
  de sua tripulação.

  iii. Princípios científicos que sustentam o SGRF:

  A. conceitos básicos relativos à fadiga:

  B. causas e a consciência da fadiga:

  C. efeitos físicos decorrentes da atividade laboral sob múltiplas longitudes;

  D. prevenção, mitigação e combate à fadiga:

  E. influência do estilo de vida:

  F. familiarização com as desordens do sono:

  G. efeitos da fadiga como resultado de deslocamento de tripulante (commuting):

  c. Público-alvo: gerente do SGRF e membros do GAGEF.

  i. Apresentação das normas sobre fadiga:

  A. Lei nº 13.475/17;

  B. RBAC nº 117 e suas Instruções Suplementares; e

  C. manual do operador aéreo envolvido em atividades sob o SGRF.

  ii. Responsabilidades do GAGEF no gerenciamento da fadiga:

  A. componentes e elementos do SGRF;

  B. operações sujeitas ao SGRF;

  C. responsabilidades (accountabilities) dos diferentes envolvidos (stakeholders) no SGRF,
  incluindo eles mesmos;

  D. GAGEF: o que é, de quem se compõe, limites, obrigações e prerrogativas;

  E. visão geral dos tipos de estratégias de mitigação da fadiga sendo utilizadas na organização;

  F. ligações entre o SGRF e outras partes do SGSO da organização;

  G. ligações entre o SGRF e outras partes da organização, por exemplo departamento de escala
  setor de operações, departamento médico, departamento de segurança, etc.; e

  H. responsabilidade do operador aéreo para garantir repouso adequado e aptidão para o trabalho
  de sua tripulação.

  10.2.5. Os treinamentos devem ser oferecidos inicialmente (antes do início do SGRF) e, para
  os tripulantes e pessoal da escala, anualmente de forma recorrente.

  10.2.6. Os provedores de serviço devem manter registros de treinamento e monitorar sua efetividade.

  10.2.7. A eficácia dos treinamentos e das atividades de educação sobre fadiga devem ser
  avaliadas regularmente.

  a. Como parte de uma sessão de treinamento, o público-alvo deve realizar alguma atividade
  que permita ao operador avaliar o conhecimento adquirido (como, por exemplo, responder um
  questionário antes e depois).

  b. Como parte do processo de educação, para avaliação da manutenção do conhecimento a médio
  e longo prazos, o operador deve realizar pesquisas junto ao público-alvo, buscando avaliar
  a eficácia do treinamento (por exemplo, a cada seis meses).

  c. Como parte dos processos de melhoria contínua, o operador deve receber feedbacks da qualidade
  do treinamento por parte do público-alvo, de forma a poder revisá-lo e melhorá-lo.

  10.3. Plano de comunicação [117.63(b)(4)(ii)]

  10.3.1. A comunicação efetiva é crucial para a implementação e manutenção do SGRF. Um plano
  de comunicação de um operador deve:

  a. explicar as políticas, procedimentos e responsabilidades do SGRF a todos os envolvidos
  (stakeholders); e

  b. descrever os canais de comunicação para obter e disseminar informações relativas ao SGRF.

  10.3.2. Os programas de treinamento do SGRF são uma parte importante do plano de comunicação.
  Entretanto, treinamentos geralmente acontecem após longos períodos. Por isso, é necessário
  que haja comunicação contínua com todos os envolvidos sobre as atividades e desempenho do
  SGRF, de forma a manter o assunto “fadiga” no radar e encorajar o comprometimento contínuo.
  Uma variedade de tipos de comunicação pode ser utilizada, como mídias eletrônicas (websites,
  fóruns online, e-mails), newsletters, boletins, seminários e colocação de pôsteres em locais
  estratégicos.

  10.3.3. Comunicações sobre as atividades e desempenho do SGRF (advindas do GAGEF ou gerências
  designadas) devem ser claras, dadas na ocasião correta (no timing correto) e críveis, isto
  é, consistentes com os fatos e afirmações anteriores apoiadas pelo próprio operador. A informação
  também deve ser direcionada às necessidades e papeis dos diferentes grupos envolvidos, de
  forma que as pessoas não se sintam sobrecarregadas com uma grande quantidade de informações
  que tem pouca relevância para elas.

  10.3.4. Comunicações obtidas do pessoal operacional alvo ou daqueles que acesso a informações
  relevantes são vitais na identificação dos perigos, para o feedback sobre a efetividade
  dos controles e mitigações, e no fornecimento de informações para os indicadores de desempenho
  do SGRF (por exemplo, por meio da participação de pesquisas e estudos de monitoramento da
  fadiga). Para que estas comunicações sejam abertas e honestas, todos os envolvidos no SGRF
  devem entender as políticas que tratam de confidencialidade e dados e uso ético das informações
  recebidas. Também devem ser claros os limites que separam eventos de segurança relativos
  à fadiga não-culposos e violações deliberadas que podem gerar punições (isto é, a política
  relativa à cultura de segurança operacional).

  10.3.5. Os procedimentos de comunicação devem estar descritos na documentação do SGRF e
  serem avaliados periodicamente como parte dos processos de garantia da segurança.

  10.3.6. Juntamente com a política e documentação do SGRF, os processos de promoção do SGRF
  apoiam as atividades operacionais do SGRF (processos de gerenciamento de risco e garantia
  da segurança).

  a. Os processos de promoção são um componente essencial dos SGRF porque o SGRF, assim como
  o SGSO, depende da comunicação efetiva na organização.

  b. Na realidade, enquanto os processos de gerenciamento de riscos e de garantia da segurança
  são o “motor” do SGRF, os processos de promoção são as fundações.

  c. Por um lado, deve haver comunicações regulares sobre as atividades e o desempenho de
  segurança do SGRF para todos os envolvidos (stakeholders). Dependendo da estrutura da organização,
  isso pode ser feito por meio do gerente do SGRF ou função equivalente descrita pelo gestor
  responsável como responsável para esta divulgação.

  d. Por outro lado, o pessoal operacional e outros envolvidos devem comunicar rápida e claramente
  suas preocupações ao GAGEF ou gerentes responsáveis.

  e. Em todos os casos, todos os envolvidos devem ter um entendimento apropriado sobre a fadiga
  e seu papel no SGRF.

  Aprovação do SGRF

  11.1. Visão geral do processo de aprovação de um SGRF

  11.1.1. O processo de aprovação do SGRF é uma abordagem sistemática e progressiva, fornecendo
  um meio para o detentor de certificado demonstrar que o SGRF proposto fornece um MAC aceitável
  para gerenciar e mitigar a fadiga, juntamente com um procedimento de monitoramento contínuo.

  11.1.2. A primeira aprovação de um SGRF será feita com base em uma operação específica.
  Caso o operador deseje ter mais de uma operação específica, ele deve solicitar a aprovação
  de uma revisão do SGRF para cada uma delas. Os componentes do SGRF (vide o item 6.2) podem
  ser compartilhados entre as diversas aprovações de um SGSO, de acordo com a sua aplicabilidade.

  11.1.3. O processo de aprovação de um SGRF compreende 5 fases:

  a. Fase 1 - Preparação da solicitação formal

  b. Fase 2 - Solicitação formal

  c. Fase 3 - Análise da documentação

  d. Fase 4 - Demonstrações e validações

  e. Fase 5 - Aprovação

  11.1.4. O processo de aprovação acima descrito segue as regras do regime de portais previsto
  tanto no item 5.2.5 da IS nº 119-001 (para operadores certificados pelo RBAC nº 121) quanto
  no item 6.2 da IS nº 119-004 (para operadores certificados pelo RBAC nº 135).

  11.1.5. Os itens 11.2 até 11.7 a seguir especificam cada uma das fases do processo de aprovação
  do SGRF pela ANAC, bem como o monitoramento continuado da operação. Adicionalmente, será
  especificado como a ANAC irá acompanhar os dados gerados pelo SGRF.

  11.2. Fase 1 - Preparação da Solicitação Formal.

  11.2.1. Nesta fase operador aéreo deve desenvolver, em conjunto com o Sindicato Nacional
  dos Aeronautas (SNA), os documentos necessários para realizar a solicitação formal (Fase
  2). De acordo com o § 3º do art. 19 da Lei nº 13.475/17, a implantação e a atualização do
  Sistema de Gerenciamento de Risco da Fadiga serão acompanhadas pelo sindicato da categoria
  profissional. O operador deve apresentar evidências de que este dispositivo da Lei está
  sendo cumprido. A apresentação das atas de reunião do GAGEF com a assinatura do representante
  do SNA supre este requisito.

  11.2.2. A solicitação deve basear-se num estudo da operação específica preliminar (vide
  definição 4.2.d desta IS) que ampare tecnicamente a solicitação de alteração do limite proposto
  pelo SGRF. O estudo preliminar deve ser apresentado à ANAC na Fase 2 do processo de aprovação
  do SGRF, devidamente assinado pelo(s) especialista(s) que o produziram. Note que, caso uma
  coleta de dados seja necessária a fim de dar embasamento empírico ao estudo preliminar,
  tal coleta deve ser realizada na Fase 4, após a aceitação do estudo preliminar pela ANAC
  (Fase 3). O planejamento da coleta de dados contido no estudo preliminar deve ser feito
  de acordo com o previsto no item 11.2.4.f adiante.

  11.2.3. Caso deseje, o detentor de certificado pode entrar em contato com a ANAC e marcar
  reuniões durante esta fase a fim de tirar dúvidas sobre o SGRF e o respectivo processo de
  aprovação.

  11.2.4. As seguintes atividades devem ser desenvolvidas pelo detentor de certificado na
  Fase 1:

  a. executar uma análise de necessidades que defina as condições operacionais específicas
  para as quais um SGRF será aplicado para justificar um desvio dos limites prescritivos (Lei
  nº 13475/17 e/ou RBAC nº 117) e o motivo pelo qual essa operação deva ser conduzida sob
  jornadas de trabalho e de repouso alternativas;

  b. definir como os procedimentos operacionais propostos exigirão um método alternativo de
  cumprimento (MAC) para o tempo de voo inicialmente prescrito, a jornada e os requisitos
  de repouso, citando a seção regulatória específica e a justificativa aplicável;

  c. descrever como os procedimentos operacionais propostos fornecerão as mitigações de fadiga
  suficientes em relação às fornecidas pelos limites prescritivos atuais;

  d. desenvolver uma análise do faltante (gap analysis) para:

  i. identificar elementos do SGRF na operação específica que já estão disponíveis em sistemas
  e processos existentes;

  ii. identificar sistemas e processos existentes que possam ser modificados para atender
  às necessidades do SGRF na operação específica (para não ter que "reinventar a roda"); e

  iii. identificar onde os novos sistemas e processos necessitam ser desenvolvidos para o
  SGRF na operação específica;

  e. desenvolver manuais e procedimentos do SGRF:

  i. preparar uma declaração da política e objetivos do SGRF assinada pelo executivo responsável
  (vide item 7.1). É esperado que se reveja a declaração da política e dos objetivos, caso
  necessário, à medida que o processo de aprovação avança;

  ii. desenvolver o plano de documentação do SGRF. O operador aéreo deve desenvolver e manter
  atualizada toda a documentação do SGRF que descreva e registre os assuntos citados no item
  7.4. Cabe ressaltar que dados, recomendações e ações do plano estarão sujeitos a ajustes
  ao longo do processo de análise e aprovação da operação específica pela ANAC;

  iii. identificar e alocar os recursos humanos e financeiros. Indicar formalmente o Gerente
  de SGRF. O Gerente do SGRF deve ter autoridade e controle para que isto ocorra eficientemente
  (vide item 7.2);

  iv. estabelecer o GAGEF. Definir sua missão e descrever os papéis e responsabilidades de
  cada um de seus membros, juntamente com os recursos da empresa. O cenário no qual um GAGEF
  for estabelecido poderá variar de acordo com o tamanho e complexidade do operador aéreo
  e seu SGRF, e em função de haver pessoal suficientemente qualificado em outros postos da
  empresa que estejam disponíveis para iniciar estas atividades (vide item 7.3);

  v. desenvolver o plano de comunicação do SGRF. O operador aéreo deve ter um plano de comunicação
  do SGRF que atenda ao item 10.1 desta IS;

  vi. desenvolver processos adequados de GRF e de GSO para identificar e documentar riscos
  e aplicar mitigações adequadas para reduzir a probabilidade e severidade desses riscos (vide
  Seções 8 e 9 desta IS);

  A. Desenvolver um sistema de reporte de fadiga. Um reporte de fadiga é um método para um
  membro de tripulação de bordo se comunicar com o pessoal de gerenciamento da fadiga e com
  o GAGEF quando eles lidarem com um evento de fadiga. Deve haver um processo claro que descreva
  como o relatório de fadiga será tratado para incluir uma análise de causa (RCA) e de coleta
  e retenção de dados de fadiga. A política do SGRF deve providenciar proteção de privacidade
  e métodos para proteger o empregado de ações adversas que desencorajem eventos e condições
  de notificação em torno dos eventos. O processo deve delinear o período de tempo que os
  dados serão mantidos e um caminho para mitigação ou gerenciamento da ocorrência de fadiga.
  Espera-se que ocorra a reavaliação deste tópico após cada mudança de fases e à medida que
  a operação específica se tornar operacional.

  B. Desenvolver um sistema de relatório de incidentes relacionados à fadiga. Um incidente
  de fadiga é definido como um evento adverso, no qual a fadiga é suspeita de ter sido um
  fator causal ou contribuinte, que resulta em um acidente, incidente, desvio do SOP ou descumprimento
  de políticas ou procedimentos do SGRF. O sistema de relatório de incidentes de fadiga é
  um método pelo qual um membro de tripulação de voo comunica um evento de fadiga adversa
  ao pessoal de gerenciamento da fadiga e ao GAGEF. Os relatórios de eventos adversos que
  podem ser atribuídos total ou parcialmente à fadiga são semelhantes aos relatórios da tripulação
  e podem servir de mecanismo para obter todas as informações relevantes sobre as contribuições
  de fadiga para o incidente. A política do SGRF definirá como um evento adverso é avaliado
  para o envolvimento potencial da fadiga, bem como define uma metodologia para a realização
  de um RCA detalhado. No mínimo, o processo de investigação e relatórios de incidentes devem
  obter todas as informações necessárias para rastrear a causa do incidente, especialmente
  o potencial nível de fadiga e as condições que contribuíram para o evento relacionado à
  fadiga. A política de relatório de fadiga deve proteger a privacidade dos funcionários e
  minimizar as ações adversas que desencorajarão eventos e circunstâncias relacionadas aos
  eventos. Espera-se que ocorra a reavaliação deste tópico após cada mudança de fases e à
  medida que a operação específica se tornar operacional.

  C. Desenvolver um sistema para monitorar a fadiga dos tripulantes como parte de um SGRF
  genérico. Os dados coletados fornecem feedback ao operador aéreo em relação às condições
  percebidas para contribuir para a fadiga. Para maximizar a utilidade de tais relatórios,
  os procedimentos devem ser desenvolvidos para capturar todas as informações relevantes,
  como o cronograma que antecede o reporte de fadiga, as ações do empregado para obter o repouso,
  evidência subjetiva e objetiva de fadiga, condições ambientais que podem ter exagerado ou
  contribuído para fadiga, saúde ou condições médicas relevantes, ações específicas relacionadas
  ao incidente e comunicações antes e durante o evento. Espera-se que ocorra a reavaliação
  deste tópico após cada mudança de fases e à medida que a operação específica se tornar operacional.

  vii. desenvolver / revisar os processos do SGRF com base na identificação reativa de riscos,
  incluindo avaliação de risco e desenvolvimento, implementação e monitoramento de controles
  e mitigações adequados, com base nos voos de coleta planejada de dados;

  A. Identificar ameaças, avaliação e mitigação de riscos, processo de Garantia da Segurança
  Operacional e processo de promoção com base nos voos de coleta de dados planejados.

  B. Verificar se os processos de documentação do SGRF estão estabelecidos para suportar a
  versão atual do SGRF.

  C. Verificar se as atividades do programa de treinamento do SGRF são estabelecidas para
  suportar esta versão atual do SGRF. (As partes interessadas precisam de treinamento para
  garantir que sejam competentes para assumir suas responsabilidades na operação específica
  à medida que o plano de implementação se desenrola) (veja item 11.5.2.g adiante).

  D. Desenvolver um método para o arquivamento de todos os registros de treinamento do SGRF
  e implementar esse processo.

  E. Verificar se os processos de comunicação do SGRF são estabelecidos para suportar a versão
  atual do SGRF proposto.

  viii. desenvolver procedimentos operacionais da operação específica. O operador aéreo utilizará
  os processos de GRF e GSO, bem como o estudo da operação específica no desenvolvimento de
  procedimentos da operação específica pertinentes aos tripulantes, despachantes operacionais,
  escaladores etc.;

  ix. desenvolver um plano de treinamento próprio para a operação específica, conforme item
  10.2 desta IS. Espera-se que ocorra a reavaliação deste tópico entre fases e quando a operação
  específica se tornar operacional.

  f. desenvolver um plano de implementação da operação específica. Os resultados da análise
  do faltante (vide item 11.2.4.d) são utilizados como base para o desenvolvimento do plano
  de implementação da operação específica do detentor do certificado. Essencialmente, isso
  fornece um roteiro descrevendo como o desenvolvimento de cada um dos processos do SGRF irá
  prosseguir. O plano de implementação deve seguir as diretrizes descritas nos itens 11.2.4.g,
  11.2.4.h, 11.2.4.h e 11.2.4.j adiante, caso estes sejam necessários. Espera-se que ocorra
  a reavaliação deste tópico após cada mudança de fases e à medida que a operação específica
  se tornar operacional;

  g. desenvolver um plano de coleta de dados (vide item 4.2.c) seguindo as diretrizes abaixo
  descritas. Espera-se que ocorra a reavaliação deste tópico após cada mudança de fases e
  à medida que a operação específica se tornar operacional;

  i. Desenvolver um plano inicial de coleta de dados. Para isso, deve-se definir uma amostra
  representativa da população a ser estudada. A seleção dos participantes deve ser aleatória
  de forma a ser auditável. Um ponto importante na amostragem dos tripulantes é a separação
  de tripulantes técnicos dos tripulantes de cabine, tendo em vista as suas diferenças de
  atuação durante o voo e de quantidade.

  ii. Definir como o plano de coleta de dados estabelecerá a eficácia do SGRF.

  iii. Identificar os recursos e ferramentas necessários (actígrafo, PVT, escalas, modelagem
  biomatemática, etc.).

  iv. Especificar a metodologia e contexto do estudo e a linha de tempo para a coleta de dados.

  v. A ANAC avaliará o plano de coleta de dados para avaliar a viabilidade, abrangência e
  credibilidade.

  vi. Ajustar o plano à medida que as variáveis se modificarem durante o estudo e coleta dos
  dados.

  h. desenvolver um plano de análise de dados seguindo as diretrizes abaixo descritas. Espera-se
  que ocorra a reavaliação deste tópico após cada mudança de fases e à medida que a operação
  específica se tornar operacional;

  i. Descrever o plano de análise inicial de dados.

  ii. Com base nas medidas de sono, fadiga e desempenho propostas, definir padrões de segurança
  que serão utilizados para avaliar a eficácia da operação proposta em condições alternativas
  de trabalho e de repouso.

  iii. Descrever como o plano de análise de dados dará suporte à efetividade do SGRF com base
  nesses padrões de segurança.

  iv. Descrever como esses dados serão usados para estabelecer um meio alternativo de cumprimento
  de requisito, baseado em desempenho.

  v. Identificar os recursos necessários e ferramentas de análise de dados.

  vi. Especificar a metodologia do estudo, a linha de tempo para o plano de análise de dados
  e o contexto da saída de dados.

  vii. Justificar os padrões de segurança propostos para estabelecer a eficácia do SGRF e
  a validade do plano de coleta e análise de dados para estabelecer que a operação específica
  atende a esses padrões.

  viii. Ajustar o plano à medida que as variáveis se modificarem durante o estudo e análise
  dos dados.

  i. elaborar e desenvolver planos para os voos de coleta de dados propostos, de acordo com
  a Política do SGRF proposta para a coleta de dados;

  i. A informação do plano de coleta de dados deve delinear os seguintes parâmetros operacionais
  e indicar em que medida eles irão exceder as limitações prescritivas do tempo de voo e respectivas
  jornadas de trabalho:

  A. requisitos de jornada pré e pós-repouso;

  B. rota pretendida;

  C. frequência temporal;

  D. tipo de tripulação adotada;

  E. datas de início e final da coleta de dados nos voos sob o SGRF;

  F. hora de início (aclimatada) da jornada de trabalho;

  G. hora de início (estado desconhecido de aclimatação) da jornada de trabalho;

  H. tripulação de voo (número de pilotos necessário) e um método de amostragem casual simples
  para a seleção, quantidade e identificação dos participantes do estudo voluntário;

  I. tripulação de cabine (número de comissários necessário) e um método de amostragem casual
  simples para a seleção, quantidade e identificação dos participantes do estudo voluntário;

  J. direção predominante de voo (norte, sul, leste ou oeste);

  K. duração da jornada de trabalho proposta;

  L. duração total do tempo de voo;

  M. duração máxima da jornada de trabalho proposta a bordo para cada membro da tripulação
  de voo durante o(s) voo(s);

  N. quantidade de fusos planejados para cruzamento nos voos;

  O. o número de etapas de voo e o horário previsto para as decolagens e pousos para membros
  de tripulação de voo aclimatados e não aclimatados;

  P. provisões para o repouso;

  Q. quantidade e classe(s) de instalações para descanso a bordo; e

  R. descrição das acomodações nas bases secundárias.

  ii. Considerar e compensar a duração dos atrasos típicos.

  iii. Se necessário, solicitar uma autorização para a operação de coleta de dados com base
  no plano de coleta de dados. Se tal autorização for necessária, a ANAC poderá impor limitações
  e condições de segurança aplicáveis à operação proposta. Se concedida, a autorização será
  limitada à duração da coleta dos dados.

  j. Definir o escopo dos requisitos de coleta de dados utilizando as diretrizes descritas
  nos itens 11.2.4.g, 11.2.4.h e 11.2.4.h acima. Além disso, o operador aéreo deve demonstrar
  de forma satisfatória que todos os voos com coleta de dados podem ser conduzidos de forma
  segura, utilizando os processos do SGRF propostos. O plano deve, como mínimo:

  i. desenvolver os procedimentos operacionais dos membros da tripulação com base em processos
  de GRF e GSO para operações em que o SGRF será aplicado;

  ii. desenvolver um esquema de descanso a bordo para as operações dos membros da tripulação
  nos voos de coleta de dados (caso aplicável). Definir os padrões desejáveis de sono para
  o descanso em voo;

  iii. desenvolver esquemas de repouso pré e pós-jornada para os voos de coleta de dados.
  Definir padrões desejáveis de sono para períodos de repouso pré e pós-jornada;

  iv. desenvolver, quando cabível, procedimentos especiais especificamente aplicáveis aos
  voos planejados de coleta de dados (para tripulantes, DOV, escalantes e outros profissionais
  que participarão de tais voos, por exemplo);

  v. fornecer uma lista de aeronaves que serão autorizadas para a coleta de dados por marca,
  modelo e série, e incluir uma descrição (classe) das acomodações de repouso instaladas;

  vi. desenvolver procedimentos para situações em que um membro de tripulação operacional
  esteja fatigado em voo e mitigações para reduzir o nível de fadiga do membro da tripulação.

  11.3. Fase 2 - Solicitação Formal

  11.3.1. Esta fase envolve o operador aéreo enviar à ANAC a documentação gerada em função
  das atividades da Fase 1.

  11.3.2. O operador aéreo protocolará a seguinte documentação (vide IS nº 119-001 ou IS nº
  119-004 para verificar o procedimento de apresentação de documentos à ANAC durante um processo
  de revisão de EO), que será analisada pela ANAC (recomenda-se que os documentos contidos
  nos itens “a” até “e” abaixo sejam consolidados nos manuais do detentor de certificado a
  fim de facilitar o seu entendimento e análise):

  a. política e objetivos de gerenciamento de risco da fadiga:

  i. declaração formal da política do SGRF assinada pelo gestor responsável pela empresa;

  ii. responsabilidade acerca do gerenciamento de risco da fadiga;

  iii. designação do responsável pelo SGRF e dos componentes do GAGEF;

  b. gerenciamento de riscos da fadiga (GRF):

  i. processo de reporte de fadiga da tripulação;

  ii. processo de monitoramento de fadiga da tripulação;

  iii. processo de reporte de incidentes relacionados à fadiga da tripulação;

  iv. processo de identificação de perigos; e

  v. processo de avaliação e mitigação dos riscos;

  c. garantia da segurança operacional (GSO) quanto à fadiga:

  i. processo de monitoramento do desempenho do SGRF;

  ii. processo de gestão da mudança (organizacional e operacional);

  iii. processo de melhoria contínua do SGRF;

  iv. plano de coleta e análise de dados para apoiar a política do SGRF;

  d. promoção do gerenciamento de risco da fadiga, que contenha os seguintes elementos:

  i. programa de treinamento dos pilotos e funcionários do operador responsáveis pela execução
  das atividades do SGRF; e

  ii. plano de comunicação do SGRF;

  e. procedimentos operacionais dos tripulantes, escalantes, despachantes de voo etc. relativos
  à operação específica (vide item 11.2.4.e.vii);

  f. plano de implementação da operação específica (vide item 11.2.4.f);

  g. estudo da operação específica preliminar (vide item 11.2.2); e

  h. atas de reunião do GAGEF que demonstrem a participação do SNA no processo de implantação
  ou atualização do SGRF (vide item 7.3.15).

  11.4. Fase 3 - Análise da documentação

  11.4.1. Durante esta fase, a ANAC irá avaliar a documentação enviada pelo operador. Caso
  existam não-conformidades, estas serão comunicadas o mais brevemente possível.

  11.4.2. Após a aceitação ou aprovação da documentação (conforme necessário), a ANAC irá
  estabelecer, em comum acordo com o operador aéreo, intervalos dos relatórios a serem enviados
  à ANAC para acompanhamento da Fase 4 no que tange à implantação dos processos (vide item
  11.5.1.c adiante) e à coleta e análise de dados (vide o item 11.5.3 adiante).

  11.5. Fase 4 - Demonstrações e validações.

  11.5.1. Nesta fase, a critério da ANAC, o operador aéreo passará por uma vistoria onde irá:

  a. apresentar evidências de que os sistemas previstos no plano de implantação do SGRF estão
  em funcionamento (vide item 11.5.2);

  b. coletar e analisar os dados, como previsto no plano de coleta e análise de dados do SGRF
  (vide item 11.5.3);

  c. apresentar o estudo da operação específica completo, contendo além do estudo preliminar
  (que pode ser revisado) o pacote de dados (vide item 4.2.c(iii)), os resultados obtidos
  e as análises correlatas.

  11.5.2. O operador deve apresentar evidências de que os seguintes processos estão sendo
  executados:

  a. os necessários canais de comunicação entre os setores ou pessoas que são responsáveis
  pelo gerenciamento do SGRF estão ativos;

  b. os processos do SGRF com base em identificação de risco reativo, proativo e preditivo
  estejam operacionais, incluindo avaliação de risco e desenvolvimento, implementação e monitoramento
  de controles e mitigações adequados;

  c. os processos de documentação do SGRF foram estabelecidos para suportar a versão atual
  do SGRF proposto;

  d. as atividades de treinamento do SGRF foram estabelecidas para apoiar a versão atual do
  SGRF proposto;

  e. os processos de comunicação do SGRF foram estabelecidos para suportar a versão atual
  do SGRF proposto;

  f. os processos para monitorar a eficácia dos controles e mitigações estão totalmente implementados;
  e

  g. o plano de implantação do SGRF está sendo executado.

  11.5.3. Coleta e análise de dados. Caso seja necessário que dados adicionais sejam coletados,
  os seguintes procedimentos devem ser realizados pelo operador:

  a. solicitar e obter da ANAC, caso necessário, autorização para realizar os voos necessários
  para a coleta de dados. Ao longo desse processo, o operador aéreo também coletará e analisará
  outros dados, como relatórios de fadiga, e compilará esses dados juntamente com aqueles
  previstos no plano de coleta e análise de dados do SGRF;

  b. após a coleta de dados o operador aéreo deve:

  i. realizar uma análise completa dos resultados da coleta de dados com ênfase específica
  sobre como os dados confirmam que a operação alternativa fora dos limites prescritivos fornece
  um método alternativo de cumprimento de requisito efetivo com padrões de segurança;

  ii. descrever os resultados agregados de cada uma das medidas especificadas no plano de
  coleta de dados proposto;

  iii. fornecer informações específicas sobre como os resultados se relacionam com os padrões
  de segurança estabelecidos no plano de coleta de dados;

  iv. mostrar como os resultados estabelecem a eficácia do SGRF proposto em relação às operações
  realizadas de acordo com os limites prescritivos;

  v. identificar qualquer evidência de fadiga excessiva descoberta em associação com a operação
  proposta e como essa fadiga é mitigada para que o SGRF proposto demonstre eficácia e conformidade;
  e

  vi. ajustar o plano de coleta de dados, caso requerido pelo item anterior, e fornecer à
  ANAC a evidência da efetividade de qualquer mitigação proposta;

  c. compilar um pacote de dados (vide item 4.2.c(iii)) os dados coletados e analisados (como
  previsto no plano de coleta e análise de dados do SGRF) e preparar o estudo da operação
  específica final;

  d. revisar seus procedimentos operacionais do SGRF, conforme necessário, para adequá-los
  aos resultados da análise de dados e do estudo da operação específica final;

  e. enviar o pacote de dados e estudo da operação específica final à ANAC para avaliação
  e validação.

  11.5.4. A ANAC irá avaliar o estudo da operação específica completo e as mudanças nas políticas,
  procedimentos e processos do detentor de certificado para garantir que o SGRF proposto preveja,
  pelo menos, um nível equivalente de segurança ao previsto no(s) limites(s) prescritivo(s)
  para as quais se deseja o SGRF.

  11.6. Fase 5 - Aprovação.

  11.6.1. Após a conclusão satisfatória da Fase 4, a ANAC pode aprovar (ou revisar a aprovação)
  o SGRF de acordo com a operação específica por meio da emissão de uma revisão das EO do
  detentor de certificado.

  11.6.2. Antes de emitir uma revisão de EO para aprovação de um SGRF, a ANAC irá considerar
  que o SGRF esteja satisfatório por:

  a. compreender todos os componentes e elementos mencionados no parágrafo 6.2;

  b. ser um sistema seguro, integrado e direcionado por dados, que monitore e gerencie de
  maneira efetiva e contínua os riscos de segurança relacionados à fadiga, utilizando princípios
  científicos e conhecimento, e experiência operacional; e

  c. possibilitar ao detentor de certificado assegurar que os tripulantes e demais pessoas
  relevantes desempenhem suas tarefas com nível de alerta suficiente para garantir a segurança
  das operações.

  11.6.3. Se, após a análise dos resultados da Fase 4, a ANAC decidir não aprovar o SGRF,
  o detentor de certificado pode solicitar novamente a aprovação de um SGRF. Nesta situação,
  o operador deve antes resolver todas as não-conformidades apontadas para a não-aprovação
  do SGRF anterior.

  11.6.4. A ANAC pode revogar ou suspender a aprovação de um SGRF se:

  a. o detentor de certificado não cumprir os requisitos do RBAC nº 117 para implementação
  ou uso do SGRF;

  b. a ANAC considerar que a continuidade da implementação ou uso do SGRF pode afetar a segurança
  na aviação de forma adversa;

  c. o detentor de certificado recusar dar acesso em relação a qualquer informação ou registro
  produzido sob o SGRF à ANAC, com o objetivo de avaliar a eficácia e segurança do SGRF;

  d. o SGRF não apresentar resultados de segurança demonstráveis, esperados quando da aprovação
  do SGRF; ou

  e. o SGRF não for capaz de entregar melhoria contínua na apresentação de resultados de segurança.

  11.7. Monitoramento contínuo do SGRF

  11.7.1. A ANAC estabelecerá um cronograma de auditoria regular para garantir que os relatórios
  de fadiga e outros indicadores de segurança suportem a eficácia do SGRF.

  11.7.2. O operador aéreo deve fornecer à ANAC, sempre que esta solicitar, todos os dados
  de monitoramento nos intervalos especificados para avaliação.

  11.7.3. Salvo especificação em contrário, com o objetivo de monitoramento contínuo, o operador
  aéreo atenderá aos seguintes intervalos de elaboração de relatórios a serem disponibilizados
  à ANAC:

  a. inicial: um relatório deve ser compilado para monitoramento e gerenciamento de riscos
  de fadiga ao final do quarto mês da operação específica (veja os itens 7.1.3, 7.4.4 e 8.7.3
  sobre os primeiros quatro meses de operação). Este relatório substitui o primeiro relatório
  trimestral previsto no próximo item;

  b. primeiro e segundo anos (a contar da data da emissão da revisão da EO para inclusão da
  operação específica): trimestral, a partir do segundo trimestre de operação;

  c. terceiro ano: semestralmente; e

  d. quarto ano ou mais: anualmente.

  NOTA: Em condições extraordinárias, com base na frequência das operações propostas do SGRF,
  podem ser necessários intervalos de relatórios alternativos.'
