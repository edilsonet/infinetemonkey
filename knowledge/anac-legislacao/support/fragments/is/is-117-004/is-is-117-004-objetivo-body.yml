text: 'Objetivo

  1.1. Estabelecer os procedimentos para implementação de um Sistema de Gerenciamento de Risco
  da Fadiga (SGRF) para detentores de um COA que opere segundo os RBAC nº 121 ou 135 e que
  tenha um GRF aceito pela ANAC em conformidade com a seção 117.61 do RBAC nº 117.'
