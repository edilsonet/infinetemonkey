title: 'e 117.61 do RBAC nº 117. Resumidamente, pode-se citar:'
text: '117.19 e 117.61 do RBAC nº 117. Resumidamente, pode-se citar:

  a. auxiliar na implementação do GRF:

  i. propor o quantitativo mínimo de integrantes do GAGEF, bem como definir

  eventuais substituições em cada classe de integrante;

  ii. definir os procedimentos internos, incluindo o procedimento de tomada de

  decisão;

  iii. propor a política de gestão de fadiga do operador; e

  iv. propor as responsabilidades de cada um dos setores diretamente envolvidos no

  GRF;

  b. supervisionar a operação contínua dos processos do GRF:

  i. promover reuniões periódicas para discussão dos assuntos relacionados à fadiga;

  ii. planejar o cronograma anual de reuniões;

  iii. convocar consultores nas áreas relacionadas a demandas técnicas oriundas dos

  temas discutidos em reunião ou sempre que for necessária a manifestação de

  especialistas;

  iv. operacionalizar a coleta de dados que irão subsidiar as análises sobre os eventos

  de segurança quanto à fadiga;

  v. propor ações de auditoria contínua para mensuração da efetividade do sistema

  adotado, bem como propor ações corretivas para contínua melhoria do sistema;

  vi. zelar pelo correto cumprimento dos requisitos relativos ao RBAC nº 117,

  propondo também ações corretivas em caso de desvios e violações neste

  cumprimento;

  vii. estabelecer os limites operacionais que serão objeto do GRF;

  viii. definir as ferramentas para análise e mensuração da fadiga de seus tripulantes,

  além da adoção de reportes, planilhas, programas de computador e/ou aplicativos

  móveis para auxiliar na mensuração;

  ix. desenvolver, implementar e monitorar processos para a identificação de riscos deData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  fadiga;

  x. assegurar que uma avaliação de risco abrangente seja realizada para os riscos de

  fadiga;

  xi. desenvolver, implementar e monitorar controles e mitigações, conforme

  necessário, para gerenciar os riscos de fadiga identificados;

  xii. desenvolver, implementar e monitorar métricas eficazes de desempenho do GRF;

  xiii. garantir que os membros da tripulação e outros recebam resposta aos seus reportes

  de fadiga;

  xiv. comunicar riscos de fadiga e o desempenho do GRF para a gerência sênior; e

  xv. cooperar com a ANAC em relação à auditoria do GRF;

  c. manter a documentação do GRF:

  i. desenvolver e manter a documentação do GRF;

  ii. propor relatórios de coleta de dados e de análise de risco, indicadores e fatores

  contribuintes; e

  iii. propor a adoção de ferramentas de medição do nível de fadiga da tripulação

  envolvida na(s) operação(ões) objeto do GRF, propor ações de mitigação do risco

  de fadiga; e

  d. ser responsável pelo treinamento do GRF:

  i. aprovar o cronograma de treinamento, os instrutores, os recursos cabíveis e tomar

  decisões relacionadas aos eventos de treinamento;

  ii. ser responsável pelo desenvolvimento, atualização e entrega de materiais de

  educação e treinamento do GRF (essas atividades podem ser terceirizadas,

  inclusive para o setor de treinamento do operador, mas o GAGEF é responsável

  por garantir que eles atendem aos requisitos do GRF e são eficazes); e

  iii. garantir que todo o pessoal relevante receba treinamento apropriados do GRF, e

  que os registros de treinamento sejam mantidos como parte da documentação do

  GRF.

  6.3.2.9. Pelo maior risco teórico nas seguintes situações, recomenda-se que o GAGEF acompanhe

  ativamente e de maneira rotineira:

  a. operações noturnas e na madrugada, especialmente a partir de duas na mesma semana

  de trabalho;

  b. jornadas interrompidas, especialmente se a interrupção for noturna ou de madrugada;

  c. mudanças de turno, especialmente se ocorrerem na mesma semana de trabalho (por

  exemplo, rotações irregulares ou no sentido anti-horário);

  d. utilização de descanso a bordo;Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  e. jornadas finalizadas e iniciadas no mesmo dia (repouso diurno);

  f. jornadas diárias com 10 ou mais horas.

  6.3.2.10. O GAGEF deve reunir-se, no mínimo, mensalmente durante o primeiro ano do GRF e

  sempre que grandes mudanças ocorrerem. As reuniões devem ser suficientemente longas e

  auxiliadas com recursos que permitam a melhor tomada de decisão. Sempre que necessário,

  reuniões em intervalos mais curtos (para acompanhamento de uma situação específica, por

  exemplo) devem ser planejadas, semanal, quinzenalmente ou sempre que uma dada

  operação ocorrer. Em todos os casos, deve ser assegurada a participação do SNA.

  6.3.2.11. As reuniões do GAGEF devem ser registradas em ata própria de reunião, as quais
  devem

  incluir eventuais divergências sobre as decisões tomadas. Dentro das possibilidades de cada

  GAGEF, deveria haver consenso das decisões tomadas por aquele grupo.

  6.3.2.12. Os membros do GAGEF devem ter conhecimento profundo do RBAC nº 117 e desta IS,

  bem como da cultura do país e do ambiente operacional do seu operador. Também deve

  conhecer a cultura profissional dos seus funcionários (subculturas), assim como a cultura
  e

  clima organizacionais, de forma a aproximar conhecimentos e experiência da área de CRM

  e fatores humanos às decisões no âmbito do GRF.

  6.3.3. Transição entre apêndices do RBAC nº 117 [117.17 e 117.61(c)(5)]

  6.3.3.1. Geral.

  a. Dependendo das características operacionais, o operador pode precisar operar sob mais

  de um apêndice do RBAC nº 117 e, deste modo, devem fazer a transição de seus

  tripulantes entre esses apêndices. Por exemplo:

  i. Um tripulante realiza operações aeromédicas (Apêndice D) e não aeromédicas

  (Apêndice A);

  ii. Treinamentos e exames em voo (Apêndice A) etc.

  b. Operar sob múltiplos Apêndices do RBAC nº 117 significa uma ou ambas das opções

  abaixo:

  i. combinando mais de um Apêndice dentro de uma única jornada de trabalho; e/ou

  ii. mudando de um Apêndice para outro em jornadas de trabalho consecutivas.

  c. A transição de tripulantes entre diferentes apêndices pode levar a inconsistências nos

  requisitos de jornada de trabalho / tempo de voo / reserva / sobreaviso / repouso.

  d. Os procedimentos de transição entre apêndices são necessários para garantir que o

  tripulante esteja sempre em conformidade ao fazer essas transições.

  e. Adicionalmente, deve haver uma avaliação dos riscos de fadiga resultantes da transição

  entre apêndices no contexto operacional e no ambiente operacional específicos do

  operador. O operador deve abordar quaisquer riscos identificados com procedimentos

  e/ou ajuste de seus limites.

  f. Antes de mudar de um Apêndice do RBAC nº 117 para outro, operador deve identificar

  os perigos associados à transição de seus tripulantes entre apêndices e gerenciar os riscosData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  por meio da aplicação de limites e procedimentos de transição, de acordo com a seção'
