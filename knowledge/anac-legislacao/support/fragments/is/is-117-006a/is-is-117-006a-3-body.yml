title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 A Resolução no 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar

  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,

  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de

  requisito previsto em RBAC, poderá:

  a. adotar os meios e procedimentos previamente especificados em IS; ou

  b. apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,

  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir

  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar

  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato

  normativo.

  3.5 Nesta IS sempre que a palavra “deve” for utilizada, ela se refere a uma obrigação contida

  diretamente no RBAC nº 117 ou uma consequência direta de um requisito daquele

  Regulamento ou de outro regulamento aplicável. As palavras “deveria” ou “pode” referem-

  se a recomendações da ANAC ao operador.

  3.6 Nesta IS sempre que a expressão “não pode” for utilizada, ela se refere a uma proibição

  contida no RBAC nº 117 ou uma consequência direta de uma proibição contida naquele

  Regulamento ou de outro regulamento aplicável. Expressões tais como “não deve” ou “não

  deveria” referem-se a recomendações da ANAC ao operador.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A'
