text: '4. DEFINIÇÕES, ACRÔNIMOS E REFERÊNCIAS

  4.1 Acrônimos

  Para os efeitos desta IS, são válidos os seguintes acrônimos:

  a. ANAC: Agência Nacional de Aviação Civil

  b. COA: Certificado de Operador Aéreo

  c. EO: Especificações Operativas

  d. FAPA: Ferramenta de Auxílio para Autoavaliação

  e. GRF: Gerenciamento de Risco da Fadiga

  f. GAGEF: Grupo de Ação de Gerenciamento de Fadiga

  g. IS: Instrução Suplementar

  h. MGF: Manual Geral da Fadiga

  i. MGO: Manual Geral de Operações

  j. MO: Manual do Operador

  k. NB: Nível Básico

  l. OACI: Organização de Aviação Civil Internacional

  m. RBAC: Regulamento Brasileiro de Aviação Civil

  n. SGRF: Sistema de Gerenciamento do Risco da Fadiga

  o. SGSO: Sistema de Gerenciamento de Segurança Operacional

  p. SNA: Sindicato Nacional dos Aeronautas

  q. SSP: State safety programme

  4.2 Definições

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, no RBAC nº

  117, IS nº 117-001 e IS nº 135-005, além das abaixo listadas:

  a. acesso (à alimentação ou à acomodação) significa que o tripulante não encontra

  impedimento ou restrição para atendimento real e imediato das suas necessidades de

  alimentação, higiene pessoal, descanso ou repouso;

  b. atraso significa o período entre o horário original de apresentação e o horário de

  apresentação real do tripulante, contados no mesmo fuso horário. O tempo de atraso será

  considerado como sendo sobreaviso, quer ele cumpra ou não os requisitos de sobreaviso

  contidos na seção A117.17 do Apêndice A do RBAC nº 117.

  c. chave de voo significa uma jornada ou uma combinação de jornadas a ser cumprida por

  um tripulante. Uma chave de voo pode compreender um ou mais dias de programação.

  d. controles significam as estratégias defensivas de nível de sistema projetadas para

  minimizar o risco de fadiga de forma contínua;

  e. fuso horário (ou fuso) significa uma região definida com um horário local uniforme

  que difere em uma hora (ou parte de uma hora) do horário local uniforme de uma regiãoData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  adjacente, utilizando o valor definido pelo país. Não leva em conta diferenças horárias

  devido ao horário de verão ou inverno da origem ou do destino;

  f. mitigações significam as intervenções sistêmicas destinadas a reduzir um risco

  específico de fadiga apropriadamente identificado para um valor considerado aceitável;

  g. operador, empresa ou detentor de certificado, nesta IS, significa um operador

  aeromédico, como definido na IS nº 135-005; e

  h. tripulação aumentada significa uma tripulação composta ou de revezamento.

  4.3 Bibliografia

  a. ANAC. (2012). IS nº 119-002D - Guia para a elaboração de SGSO de empresa aérea

  certificada de acordo com o RBAC 119.

  b. ANAC. (2022). IS nº 135-005A - Operação aeromédica realizada por operadores aéreos

  regidos pelo RBAC nº 135.

  c. ANAC. (2023). IS nº 119-004J - Obtenção, alteração, suspensão, revogação e cassação

  de certificado de empresa de transporte aéreo regida pelo RBAC nº 135.

  d. ANAC. (2023). Regulamento Brasileiro de Aviação Civil nº 135 (RBAC nº 135) -

  Emenda 13. Operações de transporte aéreo público com aviões com configuração

  máxima certificada de assentos para passageiros de até 19 assentos e capacidade máxima

  de carga paga de até 3.400.

  e. ANAC. (2024). IS nº 117-001A - Conceitos básicos sobre fadiga humana.

  f. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 001 (RBAC nº 001) -

  Emenda 16. Definições, regras de redação e unidades de medida para uso nos normativos

  da ANAC.

  g. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 117 (RBAC nº 117) -

  Emenda 01. Requisitos para gerenciamento de risco da fadiga.

  h. CASA. (2019). CAO 48.1. Civil Aviation Order 48.1 Instrument 2019.

  i. CASA. (2024). CAAP 48-01 v3.3 - Fatigue management for flight crew members.

  j. FAA. (2013). AC 120-003A - Fatigue Risk Management Systems for Aviation Safety.

