title: INTRODUÇÃO
text: '5. INTRODUÇÃO

  5.1 A Lei nº 13.475, de 28 de agosto de 2017, dispõe sobre o exercício da profissão de

  tripulante, denominado aeronauta, estabelecendo critérios e limites prescritivos de

  gerenciamento de fadiga, cumprindo os requisitos exigidos pela Organização Internacional

  de Aviação Civil (OACI).

  5.2 O art. 19 da Lei nº 13.475/17 permite que as limitações operacionais nela estabelecidas

  sejam alteradas pela ANAC, desde que respeitados os preceitos do Sistema de

  Gerenciamento de Risco de Fadiga Humana. Tais preceitos constam do DOC 9966, da

  OACI, e estão constantemente evoluindo a partir de resultados de pesquisas científicas e
  da

  experiência da indústria.

  5.3 Com o intuito de atender ao art. 19 da Lei nº 13.475/17, foi criado o RBAC nº 117,

  intitulado Requisitos para Gerenciamento de Risco de Fadiga Humana, de forma a

  complementar a Lei com o que existe de mais atual no que se refere ao gerenciamento

  prescritivo de fadiga humana nas operações aéreas, bem como possibilitar ao operador

  desenvolverem novas propostas baseadas em desempenho, uma inovação na indústria

  brasileira.

  5.4 O RBAC nº 117 foi desenvolvido em três níveis, do puramente prescritivo (NB - Nível

  Básico) até o customizado às necessidades do operador (SGRF - Sistema de Gerenciamento

  de Risco de Fadiga), contando com um nível intermediário em que alguma flexibilidade é

  possível quando determinadas exigências são atendidas (GRF - Gerenciamento de Risco

  de Fadiga). O operador deve optar por qual nível seguir, seja para todas as suas operações

  ou para parte delas. É importante observar que, uma vez feita a opção, todas as operações

  abrangidas pela opção devem seguir as regras escolhidas.

  Nota: a IS nº 117-001 traz um detalhamento sobre os três níveis.

  5.5 Esta IS tem como objetivo fornecer orientação para atender aos requisitos do GRF para
  um

  operador que opte por seguir os requisitos da Seção 117.61 e Apêndice D do RBAC nº 117.

  5.6 A fim de fornecer aos leitores orientações relevantes para seus interesses, esta IS
  é dividida

  em quatro partes principais:

  a. Seção 5: Introdução (esta parte)

  b. Seção 6: Obrigações do operador do GRF;

  c. Seção 7: Obrigações individuais dos tripulantes; e

  d. Seção 8: Procedimentos de certificação.

  5.7 Os apêndices e anexos desta IS cobrem áreas mais específicas de orientação, tais como

  interpretar e exemplificar os limites e requisitos do RBAC nº 117 para operadores

  aeromédicos.

  Nota: a Lei nº 13.475/17, ao mesmo tempo que em que traz matéria relacionada a segurança

  operacional - afetas às atribuições desta Agência -, também dispõe sobre matéria que não

  se dirige a esse fim - notadamente, a relacionada aos aspectos trabalhistas da relação que

  existe entre os aeronautas e seus empregadores. O cumprimento dos requisitos

  estabelecidos no RBAC nº 117, detalhados nesta IS, não afasta a necessidade do

  cumprimento dos demais dispositivos legais.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A'
