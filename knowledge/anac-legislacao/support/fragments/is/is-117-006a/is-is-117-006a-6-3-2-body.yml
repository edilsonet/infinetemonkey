text: '6.3.2 desta IS).

  e. Registros.

  i. Procedimentos utilização e conservação de registros, incluindo reportes de

  ocorrência de fadiga (vide item 6.2.6 desta IS).

  f. Procedimentos operacionais.

  i. Procedimentos para retirar do voo tripulantes que se declarem inaptos para o voo

  por motivo de fadiga. Vide o item 6.2.2 desta IS.

  ii. Procedimentos para selecionar os locais para repouso dos tripulantes (quando fora

  da base contratual). Vide o item 6.2.3 desta IS.

  iii. Procedimentos de descanso para tripulações compostas e de revezamento (se

  aplicável). Vide o item 6.4.4 desta IS.

  iv. Procedimento para análise de reportes (tempo máximo), tipos de mitigações e

  tempo máximo para feedback ao tripulante. Vide o item 6.3.4.17 desta IS.

  v. Procedimentos de extensão de jornada devido a circunstâncias operacionais

  imprevistas. Vide o item 6.4.6 desta IS.

  vi. Procedimentos para determinação da base contratual do tripulante. Vide o item'
