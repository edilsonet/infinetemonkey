  decisão de atraso não atender aos requisitos mínimos estabelecidos no MO.

  6.4.6. Extensão de jornada de trabalho e de tempo de voo [D117.17]

  6.4.6.1. Na extensão de jornadas ou de tempo de voo exige-se que o operador, além de avaliar

  independentemente o risco de fadiga associado à extensão proposta, confirme junto aos

  tripulantes se eles se consideram aptos a realizar a jornada modificada.

  6.4.6.2. Embora os tripulantes continuem a ser a última linha de defesa, a realidade é que
  nem

  sempre estão em boas condições para avaliar ou mitigar adequadamente o aumento do risco

  de fadiga, especialmente se eles próprios estiverem com altos níveis de fadiga ou altos

  níveis de pressão para concluir uma jornada.

  6.4.6.3. Extensão de jornada de trabalho [D117.17(a)].

  a. Extensão de jornada se refere ao aumento da jornada de trabalho de modo que exceda o

  limite da jornada máximo que consta no MO para a jornada originalmente prevista. A

  extensão de jornada:

  i. deve ser causada por circunstâncias operacionais imprevistas (vide definição);

  ii. deve ser feita de acordo com a discricionariedade do piloto em comando;

  iii. só pode ser utilizada se cada tripulante se considerar apto para completar a jornada;

  iv. não pode exceder 1 (uma) hora para todos os tipos de tripulação;

  v. não pode ser feito se isso for extrapolar o limite de tempo de voo acumulado

  constante do MO; e

  vi. não pode ser feito se isso for extrapolar o limite de trabalho acumulado constante

  do MO.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  b. A intenção por trás do uso do termo "circunstâncias imprevistas" é evitar que o operador

  escalone continuamente os períodos de voo e serviço até seus limites máximos e que

  dependam regularmente de extensões para atingir suas metas operacionais. Além da

  experiência operacional, a identificação de perigos e as avaliações de risco podem ser

  utilizadas para prever possíveis interrupções ou atrasos, por exemplo:

  i. condições meteorológicas;

  ii. instruções de controle de tráfego aéreo;

  iii. tráfego de pico durante a partida / pouso;

  iv. necessidade de manutenção não prevista;

  v. doença dos membros da tripulação durante o trabalho, etc.

  6.4.6.4. Extensão de tempo de voo [D117.17(b)].

  a. Extensão de tempo de voo se refere ao aumento do tempo de voo de modo que exceda

  o limite de tempo de voo máximo que consta no MO para a jornada prevista. A extensão

  de tempo de voo:

  i. deve ser feita de acordo com a discricionariedade do piloto em comando;

  ii. só pode ser utilizada se for operacionalmente necessário para completar a jornada;

  iii. só pode ser utilizada se cada tripulante se considerar apto para completar a jornada;

  iv. não pode exceder 30 minutos para todos os tipos de tripulação; e

  v. não pode ser feito se isso for extrapolar o limite de tempo de voo acumulado

  constante do MO.

  6.4.6.5. Um operador deve ter expectativas razoáveis, baseadas na sua experiência e em dados

  anteriores, de que a jornada de trabalho e o tempo de voo possam ser cumpridos de acordo

  com os limites do MO. Os limites máximos de jornada e de tempo de voo em todos os

  Apêndices do RBAC nº 117 foram definidos com a expectativa de não haver extensões.

  a. A legislação e o regulamento estabelecem critérios para extensão de jornada, cuja

  ocorrência se espera rara, sob decisão final do comandante da aeronave. O comandante

  deve estar ciente das condições de aptidão dos outros membros da tripulação para tomar

  sua decisão.

  b. Os requisitos para extensão de jornada ou de tempo de voo foram incluídos no Apêndice

  D para que se tenha a flexibilidade apropriada quando for necessário ampliar uma

  jornada no caso de circunstâncias operacionais imprevistas e quando a tripulação está

  apta para a ampliação.

  c. A decisão de estender uma jornada ou o tempo de voo deve ser tomada pelo piloto em

  comando antes do início de um voo (normalmente a última etapa da jornada de trabalho),

  quando a cada um dos membros da tripulação é dada a opção de continuar ou não a

  jornada, com base na avaliação da sua aptidão para o trabalho.

  d. Em exceção ao disposto acima, um voo pode continuar para o destino planejado ou paraData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  o destino alternativo de acordo com a discricionariedade do piloto em comando se

  circunstâncias operacionais imprevistas ocorrerem após a decolagem da última etapa de

  uma jornada, podendo ser ultrapassado qualquer limite desta seção ou qualquer limite

  acumulado de tempo de voo ou de jornada constantes das seções D117.25 ou D117.27

  respectivamente [D117.17(d)].

  e. O operador não está autorizado a continuamente aumentar o tamanho das jornadas e dos

  tempos de voo até seus limites máximos, resultando no uso excessivo de extensões,

  quando a experiência anterior indicar que é necessário um tempo maior para cumprir a

  jornada e/ou o tempo de voo.

  6.4.6.6. Extensões só deveriam ocorrer em menos de 5% em qualquer amostra de jornadas similares

  ou operações semelhantes. A amostra de jornadas deve basear-se na captura de uma causa

  raiz comum para a extensão. Um exemplo de procedimento para cumprir este item está

  abaixo descrito:

  a. coletar todas as interrupções ou atrasos em um determinado período (por exemplo, uma

  semana, uma quinzena, um mês etc.) em relação ao planejamento inicial do operador;

  b. verificar quais interrupções e atrasos levaram a extensões além dos limites máximos das

  jornadas estabelecidos no MO;

  c. determinar as causas raízes de cada uma das extensões acima citadas e classificar como

  semelhantes as jornadas ou operações que tenham uma mesma causa raiz;

  d. contabilizar o número de jornadas ou operações totais semelhantes as jornadas ou

  operações supracitadas;

  e. determinar se as jornadas ou operações com extensão (item c acima) ultrapassam os 5%

  das jornadas ou operações totais (item d acima);

  f. tomar as medidas necessárias para mitigar as causas raízes encontradas.

  Exemplo 1:

  • Ocorrência: suponha que o tempo no solo em um aeroporto esteja programado para

  45 minutos, mas leva 1 hora e 15 minutos em um terço dos casos. Como tal situação

  afeta mais de 5% de todos os voos que possuam escala naquele aeroporto, não será

  apropriado continuar a programar o tempo de 45 minutos em jornadas que são

  muito próximas aos limites do MO.

  • Causa raiz: dificuldade em realizar todas as operações de solo em um determinado

  aeroporto dentro do tempo previsto (45 minutos).

  • Amostra: todos os voos do operador que possuem escala no referido aeródromo em

  um determinado período.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  Exemplo 2:

  • Ocorrência: suponha que o tempo de espera (holding) em um determinado

  aeródromo seja o triplo do tempo originalmente programado por motivo de

  orientação do controle de tráfego aéreo em um quarto dos casos (isto somente

  ocorre durante os horários de pico no aeródromo). Caso tal condição se apresente

  em mais de 5% de todos os voos do operador para aquele aeródromo, não será

  apropriado continuar a programar o tempo normal de espera, quando a jornada

  for muito próxima do máximo estabelecido no MO.

  • Causa raiz: a dificuldade do controle de tráfego aéreo realizar o processamento

  para pouso em um determinado aeródromo dentro do tempo padrão de espera (30

  minutos).

  • Amostra: todos os voos do operador que pousam naquele aeródromo durante o seu

  horário de pico.

  Exemplo 3:

  • Ocorrência: suponha que diversos voos são atrasados entre 30 min e 50 min na

  decolagem em um aeródromo por motivos meteorológicos durante o inverno. Caso

  tal condição se apresente em mais de 5% de todos os voos do operador iniciados

  naquele aeródromo, não será apropriado continuar a considerar o voo sem atraso

  na decolagem, quando a jornada for muito próxima do máximo estabelecido no MO.

  • Causa raiz: a dificuldade de iniciar o voo durante o inverno no horário planejado

  devido às condições meteorológicas reinantes.

  • Amostra: todos os voos do operador que decolam do referido aeródromo no período

  de inverno.

  6.4.6.7. Quando um operador experimenta extensões em mais de 5% da amostra, deveria considerar

  a revisão de suas práticas de escala. Tal revisão tem por objetivo prover uma maior

  confiança de que os limites de jornada e tempo de voo prescritos no MO não serão

  excedidos.

  6.4.6.8. Para que um operador do GRF cumpra suas obrigações, os relatórios de extensão devem

  ser introduzidos em seus processos de identificação de perigos e monitoramento contínuo

  (consulte os itens 6.3.4 e 6.3.7 desta IS para obter orientações adicionais).

  6.4.6.9. Conforme estabelecido no parágrafo único do art. 40 da Lei nº 13.475/17, qualquer

  ampliação dos limites das horas de trabalho estabelecidas no MO deve ser comunicada, em

  no máximo 24 (vinte e quatro) horas após a viagem, pelo comandante ao empregador, que,

  no prazo de 15 (quinze) dias, deve comunicar à ANAC.

  6.4.6.10. O MO deve conter procedimentos para:

  a. orientar e treinar o tripulante no uso de ferramentas que o auxiliem a avaliar sua aptidão

  para o trabalho (vide Apêndice D desta IS);

  b. impedir uma extensão de jornada, exceto se todos tripulante tiverem sido consultados

  pelo piloto em comando e todos declararem-se aptos para o trabalho na extensão

  solicitada;

  c. coletar informações suficientes sobre cada reprogramação e extensão de jornada, para

  permitir um estudo mais aprofundado pelo GAGEF e um ajuste fino do processo deData de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  escala de tripulantes, minimizando assim a probabilidade de novas extensões.

  d. os procedimentos devem limitar claramente o uso de extensões às circunstâncias em que:

  i. a jornada de trabalho já foi iniciada;

  ii. a decisão de ampliar a jornada de trabalho e / ou o tempo de voo é tomada antes

  dos limites de jornada de trabalho e de tempo de voo serem excedidos;

  iii. as circunstâncias operacionais que exigiram a extensão de jornada poderiam ser

  classificadas como imprevistas [vide 117.3(d)-I];

  iv. o tripulante não excederá a duração da jornada acumulada e do tempo de voo

  acumulado durante a extensão (exceto se as circunstâncias operacionais

  imprevistas ocorrerem após a decolagem da última etapa da jornada, caso em que

  o voo pode continuar até o destino planejado ou alternativo de acordo com a

  discricionariedade do piloto em comando);

  e. os procedimentos também devem deixar claro que uma extensão não pode ser maior que

  1 hora para a jornada de trabalho e 30 minutos de tempo de voo, em relação aos limites

  do MO.

  f. se circunstâncias operacionais imprevistas acontecerem após a decolagem da última

  etapa de uma jornada, então o voo pode continuar para o destino planejado ou para o

  destino alternativo de acordo com a discricionariedade do piloto em comando; e

  g. o repouso após a jornada estendida deve ser baseado na sua duração total, incluindo a

  extensão.

  6.4.7. Limites de sobreaviso, reserva ou tempo em solo entre etapas de voo [D117.19]

  6.4.7.1. Do ponto de vista da fadiga, há vantagens e desvantagens na utilização de sobreaviso,

  reserva e tempo em solo entre etapas de voo.

  a. Reserva.

  i. Vantagens: anula a necessidade do tripulante dirigir até o aeroporto após o

  chamado, o que, dependendo do tempo de viagem, do clima e das condições de

  tráfego pode impactar negativamente os níveis de fadiga antes do início da jornada

  de trabalho. O tempo em que o tripulante permanece à disposição é mais curto.

  ii. Desvantagens: é mais provável que um tripulante esteja em estado de prontidão,

  enquanto não realiza nenhum trabalho real, mesmo se houver acesso a

  acomodação para reserva adequada. Este estado elevado de prontidão pode gerar

  ansiedade, o que pode aumentar a fadiga e diminuir os níveis de alerta mais rápido

  do que em casa ou em outro local longe do aeroporto.

  b. Sobreaviso.

  i. Vantagens: o tripulante escolhe o local, podendo permanecer em casa ou um local

  equivalente a uma acomodação para repouso (mais confortável que acomodação

  para reserva), em companhia de familiares e amigos, se desejar.

  ii. Desvantagens: terá de cumprir o tempo máximo de deslocamento caso sejaData de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  acionado, por isso o local de escolha não poderá ser qualquer um. Ainda,

  provavelmente terá de dirigir, o que exige atenção e contribui para a fadiga. O

  período do sobreaviso (se durante o dia, por exemplo), a ansiedade gerada de um

  possível acionamento e interferências sociais podem atrapalhar a perspectiva de

  um possível sono.

  c. Tempo de solo entre etapas de voo.

  i. Vantagens: se cumpridos os requisitos da seção D117.11 do RBAC nº 117, essa

  interrupção pode ser utilizada para viabilizar aumento nos limites de jornada.

  ii. Desvantagens: se houver previsão de tempo de solo entre etapas de voo por prazo

  superior a 3 (três) horas, o operador deve assegurar ao tripulante acomodação para

  reserva, conforme estabelecido no parágrafo 117.3(b)(2).

  6.4.7.2. É responsabilidade do operador monitorar esses riscos potenciais e tomar decisões
  sobre a

  utilização do sobreaviso ou da reserva, de modo a gerenciar o risco apropriadamente.

  Boas práticas

  O operador oferecer oficinas com as famílias dos tripulantes e promover informações

  sobre as características especiais das profissões de piloto e comissários de voo:

  • Por que os horários de trabalho são irregulares?

  • O que é uma reserva, e qual a diferença para o sobreaviso?

  • A importância do respeito à condição de sobreaviso em casa.

  • A importância da manutenção de um ambiente de repouso em casa.

  6.4.7.3. Uma importante estratégia de gerenciamento de risco para qualquer operador, no
  que se

  refere aos períodos de sobreaviso e reserva, é maximizar a eficácia de qualquer

  oportunidade de sono / descanso que o tripulante possa ter enquanto estiver naquelas

  situações. Isso significa reduzir o contato ao mínimo e, quando pertinente, não incluir
  o

  tripulante nas deliberações operacionais e na tomada de decisões antes do início da jornada

  de trabalho.

  6.4.7.4. É importante que o operador observe que, para tripulantes diferentes, podem existir

  maneiras diferentes de gerenciar qualquer estresse adicional, que pode estar presente como

  resultado da manutenção de um nível mais alto de alerta durante os períodos de sobreaviso

  ou reserva. Uma estratégia que os tripulantes podem empregar envolve atividades

  relacionadas à aviação enquanto ainda está em estado de prontidão. Se um tripulante decidir

  realizar tarefas relacionadas ao trabalho enquanto estiver em sobreaviso ou reserva

  (inteiramente por vontade própria), então esse tempo não deve ser considerado como

  jornada de trabalho. Contudo, o operador não pode tirar vantagem indevida desse método

  de gerenciamento de estresse, não alocando tempo suficiente para realizar essas tarefas,
  que

  de outra forma seriam requeridas, na jornada de trabalho subsequente.

  6.4.7.5. Condições para reserva.

  a. A reserva tem duração mínima de 3 (três) horas e máxima de 10 (dez) horas [A117.19(b)

  do Apêndice A do RBAC nº 117];

  b. Quando prevista a reserva por período superior a 3 horas, o operador deve assegurar ao

  tripulante acomodação adequada para reserva [A117.19(c) do Apêndice A do RBAC nºData de
  emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  117]; e

  c. Uma reserva finalizada sem um chamado deve ser seguida por um período de repouso

  de, pelo menos, 12 horas consecutivas [D117.19(a)(2) do Apêndice D do RBAC nº 117].

  d. As regras acima valem para todas as operações do operador, uma vez que:

  i. no caso dos parágrafos ”a” e “b”, as regras do Apêndice A valem para todos os

  operadores; e

  ii. no caso do parágrafo ”c”, a jornada seguinte pode ser aeromédica.

  6.4.7.6. Condições para sobreaviso.

  a. Um sobreaviso não pode ser inferior a 3 (três) horas e não pode exceder 12 (doze) horas

  [A117.17(a) do Apêndice A do RBAC nº 117].

  b. Caso o tripulante não seja convocado para uma tarefa durante o período de sobreaviso,

  o tempo de repouso mínimo de 8 (oito) horas deve ser respeitado antes do início de nova

  tarefa [A117.17(c) do Apêndice A do RBAC nº 117].

  c. O período de sobreaviso, contabilizado desde seu início até o início do deslocamento

  caso o tripulante seja acionado para nova tarefa, não pode ser superior a 12 (doze) horas

  [A117.17(d) do Apêndice A do RBAC nº 117].

  d. No período de 12 (doze) horas previsto no item anterior, não devem ser computados os

  períodos de deslocamento de 90 (noventa) ou 150 (cento e cinquenta) minutos previstos

  no item (c) a seguir [A117.17(e) do Apêndice A do RBAC nº 117].

  e. Um sobreaviso finalizado sem um chamado deve ser seguido por um período de repouso

  de, pelo menos, 10 horas consecutivas [D117.19(a)(1) do Apêndice D do RBAC nº 117]

  f. Se um tripulante que compuser tripulação simples for acionado durante um sobreaviso,

  a soma do limite máximo de jornada ao tempo de sobreaviso não pode ultrapassar 16

  horas [D117.19(a)(4) do Apêndice D do RBAC nº 117].

  Exemplo: sobreaviso (simples)

  • Situação: um sobreaviso com duração de 10 horas é iniciado às 08:00 por

  um tripulante aclimatado na sua base contratual em GRU. Às 12:00 o

  tripulante é informado que assumirá uma jornada às 17:30. O tripulante

  deixa a sua residência às 15:00 para dirigir-se ao local onde iniciará a sua

  jornada.

  • Cálculo da duração do sobreaviso: considerando que o sobreaviso foi

  iniciado às 08:00 e o tripulante deixou a sua residência às 15:00, a duração

  real do sobreaviso foi de 7 horas.

  • Tempo de translado: o tempo de translado do tripulante (150 minutos) não

  é contado para efeito de sobreaviso.

  • Duração máxima da jornada: 16 horas - 7 horas = 9 horas.

  g. Para casos de sobreaviso, quando o tripulante pode permanecer em local de sua escolha

  aguardando um chamado, que pode ou não acontecer, é recomendável que o operador

  oriente as medidas que o tripulante deve atender para se manter apto para o voo.

  h. Conforme os parágrafos (a) e (b) da seção A117.17 do Apêndice A do RBAC nº 117, oData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  tempo de apresentação do tripulante após comunicação de nova tarefa é de 90 minutos,

  ou 150 quando designado para outra base em município ou conurbação com dois ou

  mais aeroportos. O operador pode estimular que estas durações sejam calculadas

  considerando-se todos os possíveis fatores de pressão de tempo e acessibilidade para

  entrar e sair do local escolhido, de forma a evitar ao máximo situações de estresse.

  6.4.7.7. Condição para tempo de solo entre etapas de voo

  a. Diante de previsão de tempo de solo entre etapas de voo por prazo superior a 3 (três)

  horas, o operador deve assegurar ao tripulante acomodação para reserva, conforme

  estabelecido no parágrafo 117.3(b)(2).

  6.4.7.8. O que deve constar do MO.

  a. Os procedimentos do MO devem:

  i. incluir um meio de fazer avaliações confiáveis de acomodações adequadas para

  dormir ou descansar (na base contratual e nas bases secundárias ou escalas) que

  são propostas para uso em períodos de sobreaviso ou reserva. Essas avaliações

  devem ser contínuas para garantir que a acomodação permaneça adequada ao

  objetivo. Especial atenção deve ser dada às acomodações para reserva, que são de

  responsabilidade do operador;

  ii. garantir que os tripulantes não sejam perturbados pelo contato da empresa durante

  o período de sobreaviso ou reserva, exceto para chamar o tripulante para uma

  jornada de trabalho.

  Importante:

  O estresse e a fadiga podem ser acelerados se o tripulante for obrigado a realizar

  tarefas (por exemplo, tarefas de escritório) enquanto estiver em sobreaviso ou reserva.

  Portanto, a realização dessas tarefas não pode ser considerada como sobreaviso ou

  reserva.

  b. Os procedimentos devem assegurar que os requisitos citados nos itens 6.4.7.5 e 6.4.7.6

  sejam cumpridos.

  c. a duração da reserva respeite o cálculo de que ela termina assim que o voo é iniciado,

  sendo que sua duração abate diretamente a jornada máxima permitida;

  Exemplo: reserva

  • Situação: uma reserva com duração de 6 horas é iniciada às 06:00 por um

  tripulante na sua base contratual em GRU. Às 09:00 o tripulante é informado que

  assumirá um voo às 11:00 nesse mesmo local.

  • Cálculo da duração da reserva: considerando que a reserva foi iniciada às 06:00

  e o tripulante assumiu o voo às 11:00, a duração da reserva foi de 5 horas.

  • Cálculo da jornada após a reserva:

  ✓ Jornada máxima às 06:00 (tabela D.2): 12 horas

  ✓ Duração da reserva: 5 horas

  ✓ Jornada máxima após a reserva: 12 horas - 5 horas = 7 horasData de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  6.4.8. Reservado

  6.4.9. Períodos de repouso [D117.23]

  6.4.9.1. É essencial que o operador e o tripulante compartilhem o conceito de que o repouso
  é um

  período livre de todos os deveres e serviços associados ao trabalho. Isso significa que
  o

  tripulante não pode simplesmente ser incumbido de tarefas de solo durante seus períodos

  de repouso mínimo obrigatórios e não pode ser escalado para outra jornada de trabalho até

  que os requisitos mínimos de repouso tenham sido atendidos.

  6.4.9.2. Com base na função que o repouso desempenha, existem três grandes categorias de

  requisitos para repouso:

  a. aqueles que abordam a fadiga aguda (isto é, a exigência de um repouso após uma

  jornada), como previstas nos parágrafos (a) e (b) da Seção D117.23 do Apêndice D do

  b. aqueles que abordam a fadiga acumulada (isto é, a exigência de folgas periódicas, como

  previsto no parágrafo (c) na Seção D117.23 do Apêndice D do RBAC nº 117; e

  c. aquelas que abordam a fadiga relacionada ao cruzamento de fusos horários, como no

  parágrafo A117.23(d) do Apêndice A do RBAC nº 117.

  6.4.9.3. Abordando a fadiga aguda [parágrafos (a) e (b) da Seção D117.23 do Apêndice D do
  RBAC

  nº 117].

  a. O operador deve ter em mente que os períodos de repouso atribuídos devem ser longos

  o suficiente para fornecer:

  i. a oportunidade de sono exigida (8 horas);

  ii. tempo para atender as necessidades fisiológicas e preparação do tripulante

  (mínimo de 2 horas); e

  iii. tempo suficiente para o transporte de e para o local de repouso.

  Exemplo:

  Se o tempo de deslocamento entre o aeroporto e o hotel em um determinado local for

  de 15 minutos, o operador deve garantir que o repouso permita:

  • Deslocar-se de e para a acomodação para repouso (neste caso, 30 minutos no

  total);

  • Um período suficiente para se alimentar, comer, beber, ir ao banheiro, lavar-se e

  vestir-se (2 horas podem ser apropriadas); e

  • A oportunidade mínima de sono exigida (8 horas).

  Em geral, os requisitos de repouso mínimo preveem tempo suficiente para garantir a

  oportunidade de sono, os deslocamentos e a preparação do tripulante. Entretanto,

  haverá casos em que serão necessários períodos mais longos de repouso, como quando

  o tempo de deslocamento for maior, quando houver períodos estendidos de check-in

  ou check-out do hotel ou desembaraço aduaneiro, por exemplo.

  b. Caso o período mínimo de repouso previsto nos parágrafos (a) e (b) da Seção D117.23

  do Apêndice D do RBAC nº 117 não comporte os itens acima, ele deve ser aumentadoData de
  emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  até que isso ocorra.

  6.4.9.4. Abordando a fadiga acumulada [Parágrafo D117.23(c) do Apêndice D do RBAC nº 117].

  a. Em todos os Apêndices devem ser seguidas as regras de folga periódica previstas na

  Seção A117.25 do Apêndice A do RBAC nº 117, exceto o parágrafo A117.25(e).

  b. Uma consideração importante é que, para iniciar uma jornada, um tripulante deve manter

  o atendimento aos requisitos mesmo ao final desta mesma jornada.

  c. Isso significa que um operador deve estar constantemente levando em consideração o

  histórico do tripulante para determinar se ele pode ser designado para uma jornada.

