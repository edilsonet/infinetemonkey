text: '8. PROCEDIMENTOS DE ACEITAÇÃO DE UM GRF SEGUNDO O APÊNDICE D

  DO RBAC nº 117

  8.1 Geral

  8.1.1. Cada detentor que conduza operações aeromédicas e deseje ter um GRF aceito pela ANAC

  deve cumprir os requisitos contidos nas Seções 117.17, 117.19, 117.61 e no Apêndice D do

  8.2 Procedimentos específicos

  8.2.1. Documentos a serem enviados à ANAC:

  a. revisão do MO com alterações requeridas pelas seções 117.17, 117.19 e 117.61 e'
