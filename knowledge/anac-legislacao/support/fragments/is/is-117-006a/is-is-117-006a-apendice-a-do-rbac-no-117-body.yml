title: 'Apêndice A do RBAC nº 117:'
text: 'Apêndice A do RBAC nº 117:

  a. 44 horas semanais; e

  b. 176 horas mensais.

  6.4.11.4. O que deve constar do MO.

  a. O MO do operador deve incluir:

  i. procedimentos para o rastreamento e análise dos tempos totais de jornada

  acumulada de cada tripulante;

  ii. um meio de monitorar os limites de jornada de cada tripulante, garantindo assim

  que qualquer tripulante não exceda os limites aplicáveis;

  iii. diretrizes em formato claro e prontamente disponíveis para os funcionários do

  operador envolvidos nas atividades de escala, treinamento e para os tripulantes.

  b. Pode haver necessidade de procedimentos para tripulantes que voam para outro

  operador. Se um tripulante voar para outro operador, serão necessários procedimentos

  para considerar essas horas trabalhadas ao avaliar se o tripulante está dentro dos limites

  de tempo de jornada acumulados.

  c. Pode ser necessário haver procedimentos para os tripulantes incluírem em seu registro

  de jornada acumulada qualquer voo particular em atividades não recreativas.Data de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  d. O MO não deve permitir que um tripulante exceda os limites acumulados de jornada

  especificados na seção D117.27 do Apêndice D do RBAC nº 117, conforme aplicável,

  ou no próprio MO, o que for menor.

  6.4.12. Limites em operações na madrugada e início cedo [D117.29]

  6.4.12.1. Operação na madrugada

  a. Operação na madrugada significa uma jornada que compreenda o período transcorrido,

  total ou parcialmente:

  i. para viagens que cruzam menos de 3 fusos horários, madrugada significa o período

  transcorrido, total ou parcialmente, entre 00h00 e 06h00, hora local da base

  contratual do tripulante;

  ii. para viagens que cruzam 3 ou mais fusos horários, se:

  A. a jornada se inicia em até 48 horas do início da viagem, madrugada

  significa o período transcorrido, total ou parcialmente, entre 00h00 e

  06h00, hora local da base contratual do tripulante;

  B. a jornada se inicia após 48 horas do início da viagem, madrugada significa

  o período transcorrido, total ou parcialmente, entre 00h00 e 06h00, hora

  local onde o tripulante se encontra.

  b. A fim de minimizar a fadiga em operações na madrugada, o Apêndice D contém a

  exigência de que, exceto como previsto no item 6.4.12.1.b.ii a seguir, o operador não

  pode escalar um tripulante para realizar mais de duas jornadas consecutivas que

  envolvam operações na madrugada, limitadas a quatro jornadas com operações na

  madrugada durante qualquer período de 168 horas consecutivas.

  i. Caso sejam designadas quatro jornadas que envolvam operações na madrugada

  em qualquer período de 168 horas consecutivas, apenas mais uma jornada com

  função a bordo, sobreaviso ou reserva pode ser designada para o mesmo período.

  ii. O tripulante pode ser escalado para jornada na terceira operação na madrugada

  consecutiva, desde que como tripulante extra a serviço, em voo de retorno à base

  contratual, encerrando sua jornada. Nesta condição, o tripulante não pode ser

  escalado para compor tripulação no período que antecede a terceira operação na

  madrugada consecutiva na mesma jornada.

  Boas práticas

  • Prever folgas, preferencialmente 2 ou mais, após trabalho noturno,

  principalmente após operações na madrugada.

  • Finalizar jornadas noturnas até às 06:00 parece ser melhor do que a partir

  deste horário, para garantir que a pessoa se desloque ainda no escuro e não se

  exponha à luz, o que favorecerá seu sono matinal.

  c. Quando houver jornadas em duas madrugadas consecutivas:

  i. o período de 22h00 até 08h00 anterior à primeira madrugada deve estar livre de

  qualquer atividade; eData de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  ii. o período de 22h00 até 08h00 subsequente à segunda madrugada deve estar livre

  de qualquer atividade.

  d. Ainda, o operador pode escolher atrasar o horário de início da jornada após uma ou duas

  madrugadas para proteger melhor a noite de sono de seus tripulantes, permitindo que

  acordem mais tarde (iniciar jornadas a partir das 10:00, por exemplo), e/ou diminuir a

  duração da jornada posterior (que, no caso de duas madrugadas consecutivas, deverá

  inevitavelmente acabar antes das 22:00). O GAGEF poderá propor testar diferentes

  configurações levando em conta estas observações em interação com os conceitos de

  noite, noite local e duração da jornada, buscando minimizar os riscos advindos das

  combinações de jornadas (diurnas, noturnas e na madrugada) ao longo de períodos de

  168 horas ou 28 dias, por exemplo.

  Da mesma forma, o operador deveria proteger a jornada anterior à operação na

  madrugada, aplicando a mesma regra contida no regulamento ou estabelecendo outra

  ainda mais restritiva, conforme o exemplo acima.

  e. Mesmo jornadas iniciadas fora do horário da madrugada (a partir de 06:01), exigem que

  o acordar ocorra na madrugada, por necessidade de preparação e deslocamento. O

  operador deveria levar isso em conta ao planejar jornadas consecutivas de início cedo

  ou operações na madrugada sucedidas ou precedidas de início cedo.

  f. O período de 168 horas consecutivas a que se refere o item 6.4.12.1.b pode ser encerrado,

  iniciando-se a contagem de novo período, sempre que for disponibilizado ao tripulante

  um período mínimo de 48 horas, incluindo duas noites locais, livre de qualquer

  atividade.

  6.4.12.2. Início cedo

  a. Operações com início cedo são aquelas que:

  i. para viagens que cruzam menos de 3 fusos horários, o período transcorrido, total

  ou parcialmente, entre 06h01 e 07h59, hora local da base contratual do tripulante;

  e

  ii. para viagens que cruzam 3 ou mais fusos horários, se:

  A. a jornada se inicia em até 48 horas do início da viagem, o período

  transcorrido, total ou parcialmente, entre 06h01 e 07h59, hora local da base

  contratual do tripulante; e

  B. a jornada se inicia após 48 horas do início da viagem, o período

  transcorrido, total ou parcialmente, entre 06h01 e 07h59, hora local onde

  o tripulante se encontra.

  iii. Nenhum operador pode escalar e nenhum tripulante pode aceitar a escalação para

  mais de três jornadas consecutivas com início cedo.

  6.4.12.3. O que deve constar do MO.

  a. O operador deve desenvolver diretrizes e procedimentos de escala de tripulantes que

  claramente exijam o rastreamento de jornadas em operações na madrugada durante

  períodos consecutivos de 168 horas. Esses procedimentos também devem identificar eData de
  emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  rastrear as jornadas que se tornam operações na madrugada devido à reprogramação ou

  extensão, ou operações consecutivas com início cedo.

  b. O MO deve conter procedimentos e diretrizes para:

  i. gerenciar adequadamente os limites da escala em operações na madrugada e com

  início cedo;

  ii. identificar o potencial de uma operação na madrugada limitar a futura atribuição

  de jornadas a um tripulante.

  c. Ao escalar tripulantes para uma jornada (mesmo que não seja na madrugada), o número

  de operações na madrugada realizadas no período de 168 horas em que ela irá ocorrer

  deve ser considerado.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A'
