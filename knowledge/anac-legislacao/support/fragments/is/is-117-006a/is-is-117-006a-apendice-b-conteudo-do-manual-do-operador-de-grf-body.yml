text: 'APÊNDICE B. CONTEÚDO DO MANUAL DO OPERADOR DE GRF.

  B.1. Geral

  B.1.1. Este Apêndice apresenta o conteúdo mínimo que deve ser inserido no MO que tenha um

  GRF aceito.

  B.1.2. Determinação dos apêndices a serem utilizados pelo operador (consulte o item 6.2.1
  desta

  IS): confirme quais operações o operador está autorizado a conduzir e, portanto, os

  apêndices disponíveis. Um operador do GRF deve, no mínimo, utilizar o Apêndice D do

  B.1.3. Todos os procedimentos e limites operacionais devem ser documentados no MO. A ANAC

  deve estar convencida de que os limites e procedimentos operacionais a serem introduzidos

  no MO razoavelmente garantem que os tripulantes não excedam níveis seguros de fadiga

  durante a operação de uma aeronave.

  B.2. Conteúdo mínimo a ser inserido no manual do operador

  Devem ser incluídos no MO todos os tópicos abaixo.

  a. Ambiente operacional da empresa aérea.

  i. Descrever o ambiente operacional da empresa aérea que irá afetar o gerenciamento

  de risco da fadiga (voos nacionais e/ou internacionais, cruzamento de fusos

  horários, voos de curta duração e/ou de longa duração, operação diurna e/ou noturna

  / madrugada etc.).

  ii. Incluir, em destaque, no seu MO as informações abaixo:

  A. indicação de que o operador está autorizado a conduzir suas operações sob um

  GRF segundo o Apêndice D do RBAC nº 117;

  B. indicação de que o operador irá cumprir o Apêndice D do RBAC nº 117.

  iii. A indicação acima deve ser feita da seguinte forma:

  A. caso seja adotada a opção constante do item 8.2.2.a: incluir as informações na

  primeira página da Seção 5, conforme aplicável;

  B. caso seja adotada a opção constante do item 8.2.2.b: incluir as informações na

  primeira página do MGF.

  b. Políticas do operador sobre gestão da fadiga.

  i. Política de não-utilização dos tripulantes que não estejam aptos ao trabalho (vide

  item 6.2.2 desta IS).

  ii. Política de segurança operacional (vide itens 6.2.4 e 7.2.4 desta IS).

  iii. Outras políticas relativas à gestão de fadiga do operador (por exemplo, em interação

  com outros regulamentos ou práticas da empresa).

  c. Limites operacionais.Data de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  i. Indicação de que todas as operações aeromédicas do operador devem ser realizadas

  segundo o Apêndice D do RBAC nº 117.

  ii. Os limites máximos e mínimos advindos do cumprimento do Apêndice D do RBAC

  nº 117 para cada tripulante (vide os itens 6.3 e 6.4 desta IS e as seções do Apêndice

  D que contêm limitações de jornada de trabalho, tempo de voo e de repouso antes

  ou após a jornada).

  iii. Para os tripulantes conduzindo uma dada operação: cada limite mencionado no

  parágrafo anterior como alterado pelo operador para os tripulantes e para a

  operação, desde que não exceda os limites máximos, ou reduza os limites mínimos,

  especificados no Apêndice D do RBAC nº 117 (vide itens 6.3.6, 6.4.2, 6.4.3, 6.4.4,

  6.4.7, 6.4.9, 6.4.10, 6.4.11 e 6.4.12 desta IS).

  d. Responsabilidade dos funcionários do operador.

