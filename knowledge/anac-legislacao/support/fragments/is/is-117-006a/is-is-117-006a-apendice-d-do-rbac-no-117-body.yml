cite: apendice-d-do-rbac-no-117
title: Apêndice D do RBAC nº 117;
text: 'Apêndice D do RBAC nº 117;

  b. revisão do PTO com alterações requeridas pelas seções 117.19 e 117.61;

  c. atualização da declaração de conformidade, incluindo os requisitos constantes das

  seções 117.17, 117.19 e 117.61 e do Apêndice D do RBAC nº 117;

  d. nome do representante do SNA junto ao operador, incluindo o documento de indicação

  emitido pelo SNA.

  8.2.2. A revisão do MO requerida pelas seções 117.17, 117.19 e 117.61 do RBAC nº 117 pode

  ser feita tanto por alteração direta do MGO, quanto pelo desenvolvimento de um MGF, o

  qual será um dos anexos do MO. O operador irá escolher o método que mais lhe convier.

  a. Opção 1 de alteração do MO: alteração direta do MGO. A Seção 5 - Procedimentos para

  cumprimento da jornada de trabalho, previsto na IS nº 135-002, deve ser revisada a fim

  de incluir as informações requeridas pelo APÊNDICE B desta IS;

  b. Opção 2 de alteração do MO: emissão de um MGF. Nesta situação, a Seção 5 do MGO

  deve ser substituída por uma citação ao MGF. Este último deve conter as informações

  requeridas pelo APÊNDICE C desta IS. O MGF deve ser levado a bordo da aeronave

  sempre que uma operação aeromédica for executada.

  c. Em qualquer das opções, a revisão do MGO e o MGF devem ser aceitos pela ANAC

  antes do início das operações segundo o GRF.

  8.2.3. A revisão do PTO deve conter as informações requeridas pelos parágrafos 117.61(f)
  e

  117.61(g) do RBAC nº 117. O Apêndice C dessa IS especifica detalhadamente o conteúdo

  a ser inserido no PTO.

  8.2.4. O envio da documentação especificada no item 8.2.1 deve ser feito utilizando-se o
  FOP

  207 previsto na IS 119-004, um para cada manual ou programa a ser enviado.

  8.2.5. Os supracitados modelos de formulários, em sua versão mais atualizada, estão disponíveis

  para o usuário em formato editável no sítio da ANAC na rede mundial de computadores,

  no endereço eletrônico: http://www.anac.gov.br/assuntos/setor-regulado/empresas/acesso-

  rapido/modelos-e-formularios.

  8.2.5.1. O marco temporal para o início das operações sob um GRF será, no mínimo, 30 dias
  após

  a data na qual a proposta de revisão do MO e do PTO deu entrada na ANAC. Os tripulantesData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  devem estar treinados para o início da operação.'
