  (1) (2) (3) (4)

  Resposta de risco elevado

  em Q1 ou Q2. Risco elevado: meça o nível de alerta usando métodos objetivos e

  subjetivos e discuta com seu supervisor porque seu nível de alerta

  pode não ser suficiente para esta jornada e considere a possibilidade

  de ser escalado para outra jornada de forma a gerenciar o risco (por

  exemplo, em tripulação aumentada, período de repouso maior).

  Se uma das respostas for

  de risco elevado mesmo

  com as outras em risco

