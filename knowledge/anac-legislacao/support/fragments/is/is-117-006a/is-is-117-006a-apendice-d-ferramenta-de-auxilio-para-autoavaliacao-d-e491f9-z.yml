  Q3. A que horas ocorre a presente jornada? Resultado do Risco (3)

  Todas as horas que ocorram entre 08:00 e 22:00 Baixo

  As que ocorram entre as 06:00 e 08:00 e entre 22:00 e 02:00 Moderado

  Parte da jornada ocorre entre 02:00 e 06:00 Elevado

  Q4. Qual nível de risco operacional está associado à jornada?

  (Considere rota, aeroportos, espaço aéreo, nível de experiência da tripulação,

  características e operacionalidade da aeronave e condições atmosféricas) Resultado do Risco
  (4)

  Descrição

  Todos os fatores foram considerados de baixo risco Baixo

