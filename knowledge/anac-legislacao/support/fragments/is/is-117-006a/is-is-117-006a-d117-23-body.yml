  c. Fadiga relacionada ao cruzamento de fusos horários

  i. O operador deve incluir no seu manual previsão para que, no retorno à base de

  uma viagem que tenha cruzado três ou mais fusos em um dos seus sentidos, o

  repouso seja acrescido de duas horas por cada fuso cruzado.

  6.4.10. Limites de tempo de voo acumulados [D117.25]

  6.4.10.1. O limite de tempo de voo acumulado em períodos de médio e longo prazo é um meio
  de

  gerir a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um tripulanteData
  de emissão: 11/10/2024

  IS nº 117-006

  Revisão A

  de forma intensiva durante um longo período.

  6.4.10.2. O tempo de voo acumulado significa o total progressivo de tempo de voo acumulado
  pelo

  tripulante ao agir como um membro da tripulação a bordo de qualquer aeronave, mas

  excluindo o tempo de voo acumulado durante operações privadas recreativas.

  6.4.10.3. Para que um operador gerencie o tempo de voo cumulativo, ele deve rastrear o tempo
  de

  voo registrado pelo tripulante ao voar em suas operações durante o período em questão e
  o

  tempo de voo que os tripulantes acumulam durante voos não recreativos durante esse

  mesmo período.

  Nota: voos recreativos são voos conduzidos por um tripulante a título pessoal e durante

  o período de lazer do tripulante. Um voo conduzido por um tripulante como uma

  operação privada não é considerado recreativo se ocorrer para, ou em nome de, uma

  entidade, independentemente de a entidade ser ou não detentora de um COA ou

  detentor de uma licença sob o RBAC nº 141.

  6.4.10.4. Para que este limite seja aplicado com precisão, o operador deve registrar o tempo
  de voo,

  de acordo com a definição do tempo de voo no RBAC nº 117, o que significa:

  a. no caso de uma aeronave de asa fixa, o período compreendido entre o início do

  deslocamento, com o intuito de iniciar um voo, até o momento em que se imobiliza a

  aeronave na posição de estacionamento (calço-a-calço); ou

  b. no caso de um helicóptero, o período compreendido entre a partida dos motores, com o

  intuito de iniciar um voo, até o momento em que se corta os motores, ao término do voo;

  6.4.10.5. O Apêndice D do RBAC nº 117 tem os mesmos limites cumulativos de tempo de voo
  dos

  parágrafos A117.13(c) e A117.13(d) do Apêndice A do RBAC nº 117, conforme mostrado

  na tabela abaixo:

  Aeronave Limite de Horas de Voo Mensais Limite de Horas de Voo Anuais

  Aviões a Jato 80 (oitenta) 800 (oitocentas)

  Aviões Turboélice 85 (oitenta e cinco) 850 (oitocentas e cinquenta)

  Aviões Convencionais 100 (cem) 960 (novecentas e sessenta)

  Helicópteros 90 (noventa) 930 (novecentas e trinta)

  Tabela 3: Limites mensais e anuais de tempo de voo.

  6.4.10.6. O que deve constar do MO.

  a. O MO do operador deve incluir:

  i. procedimentos para o rastreamento e análise do tempo de voo acumulado de cada

  tripulante;

  ii. um meio de monitorar o tempo de voo de cada tripulante, garantindo assim que

  qualquer tripulante não exceda os limites aplicáveis;

  iii. diretrizes em formato claro e prontamente disponíveis para os funcionários do

  operador envolvidos nas atividades de escala e para os tripulantes; e

  iv. especificação detalhada dos limites de tempo de voo (não será permitida umaData de emissão:
  11/10/2024

  IS nº 117-006

  Revisão A

  simples citação aos limites do RBAC nº 117).

  b. Pode haver necessidade de procedimentos para tripulantes que voam para outro

  operador. Se um tripulante voar para outro operador, serão necessários procedimentos

  para considerar essas horas de voo ao avaliar se o tripulante está dentro dos limites de

  tempo de voo acumulados.

  c. Pode ser necessário haver procedimentos para os tripulantes incluírem em seu registro

  de voo acumulado qualquer voo particular em atividades não recreativas.

  d. O MO não pode permitir que um tripulante exceda os limites acumulados de tempo de

  voo especificados no próprio MO.

  6.4.11. Limites de trabalho acumulado [D117.27]

  6.4.11.1. O limite de trabalho (jornada) acumulado em períodos de médio e longo prazo é
  um meio

  de gerir a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um

  tripulante de forma intensiva durante um longo período.

  6.4.11.2. O limite de jornada acumulado de um tripulante significa o total progressivo das
  jornadas

  de trabalho do tripulante ao realizar qualquer trabalho para um operador, incluindo, além

  das jornadas de voo e períodos de sobreaviso e reserva, períodos de trabalho nos escritórios

  do operador, reuniões, treinamentos de solo ou de voo.

  a. O limite de trabalho acumulado do tripulante deve englobar tanto as operações

  aeromédicas quanto as não aeromédicas.

