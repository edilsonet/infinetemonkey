title: Identificar as operações onde o GRF será aplicado
text: '1. Identificar as operações onde o GRF será aplicado

  Não

  efetivoData de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  cientes dos procedimentos do operador, dos seus limites e obrigações, assim como dos tipos

  de operações realizados. [117.65(d) e (e)]

  6.3.1.4. O treinamento deve ser conduzido em uma base inicial e periódica. O intervalo entre
  dois

  treinamentos consecutivos deve ser de no máximo dois anos. No entanto, quando um

  operador identifica uma necessidade de treinamento a intervalos mais curtos (por exemplo,

  disritmia circadiana, sequenciamento de noites/madrugadas, jornadas longas ou quaisquer

  dúvidas dos tripulantes ou pessoal relevante), deve oferecê-lo o mais breve possível.

  6.3.1.5. O treinamento requerido pelo RBAC nº 117 pode ser integrado a outro treinamento

  conduzido por um operador (como por exemplo, periódico, fatores humanos / treinamento

  de habilidades não técnicas etc.). No entanto, todos os tópicos constantes do Apêndice A

  desta IS devem ser ministrados.

  6.3.1.6. Os critérios de avaliação podem ser extraídos da análise inicial das necessidades
  de

  treinamento. O pessoal de treinamento é incentivado a usar sua experiência para

  desenvolver critérios de avaliação adaptados à realidade de suas operações.

  6.3.1.7. O treinamento sobre fadiga deve ser encerrado com uma avaliação. O principal objetivo

  dessa avaliação é determinar em que medida os participantes do treinamento estão

  aprendendo. Sugere-se uma média de aprovação de 80%. [117.65(c)(2) e 117.65(f)(2)]

  6.3.1.8. Execução do treinamento. [117.65(d)]

  a. Todos os tripulantes do operador envolvidos na operação sob o Apêndice E devem estar

  treinados antes do início das operações sob o Apêndice E.

  6.3.1.9. Os registros relativos aos treinamentos (materiais, datas, instrutores, tutores,
  certificados,

  avaliações etc.) devem ser mantidos por pelo menos 5 (cinco) anos. [117.65(g)]

  a. Quanto à descrição dos recursos de treinamento prevista em 117.65(b)(6), o que se

  espera é que, mesmo quando o treinamento requerido for desenvolvido diretamente pelo

  próprio operador (por meio de seus próprios pilotos, por exemplo), permanece sendo

  obrigação do operador desenvolver e manter registros que detalhem como ocorreu este

  treinamento, incluindo o currículo do treinamento realizado.

  6.3.1.10. O treinamento é uma estratégia essencial de divulgação do GRF, mas não a única.
  Por isso,

  o operador deve ter ciência de que outras formas de promoção rotineiras, simples e úteis

  complementam e mantêm a importância do assunto em dia.

  6.3.1.11. Recomenda-se fortemente que o primeiro treinamento seja realizado presencialmente,

  devido à complexidade do assunto.

  6.3.1.12. Treinamentos à distância poderão ser ofertados, desde que demonstrem claramente
  o

  cumprimento do conteúdo e a adequação do tempo disponibilizado (vide Apêndice A desta

  IS). Recomenda-se que, se for esta a opção do operador, ocorra apenas nos periódicos.

  6.3.2. Transição entre apêndices do RBAC nº 117 [117.17 e 117.65(b)(5)]

  6.3.2.1. Geral.

  a. Dependendo das características operacionais, os operadores podem precisar operar sob

  mais de um apêndice do RBAC nº 117 e, deste modo, precisam fazer a transição de seusData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  tripulantes entre esses apêndices.

  b. Operar sob múltiplos Apêndices do RBAC nº 117 significa uma ou ambas das opções

  abaixo:

  i. combinando mais de um Apêndice dentro de uma única jornada de trabalho; e/ou

  ii. mudando de um Apêndice para outro em jornadas de trabalho consecutivas.

  c. A transição de tripulantes entre diferentes apêndices pode levar a inconsistências nos

  requisitos de jornada de trabalho / tempo de voo / reserva / sobreaviso / repouso.

  d. Os procedimentos de transição entre apêndices são necessários para garantir que o

  tripulante esteja sempre em conformidade ao fazer essas transições.

  e. Adicionalmente, deve haver uma avaliação dos riscos de fadiga resultantes da transição

  entre apêndices no contexto operacional e no ambiente operacional específicos do

  operador. O operador deve abordar quaisquer riscos identificados com procedimentos

  e/ou ajuste de seus limites.

  f. Antes de mudar de um Apêndice do RBAC nº 117 para outro, o operador deve identificar

  os perigos associados à transição de seus tripulantes entre apêndices e gerenciar os riscos

  por meio da aplicação de limites e procedimentos de transição, de acordo com a seção'
