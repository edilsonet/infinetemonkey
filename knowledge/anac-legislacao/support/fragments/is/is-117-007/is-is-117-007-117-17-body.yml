  Tabela 3: Determinação do horário de referência para planejamento das jornadas

  6.3.8.12. Os procedimentos de gerenciamento de risco de fadiga do operador devem, conforme

  117.65(b)(2) e (b)(3), ser capazes de identificar e mitigar perigos em situações específicas.

  Isto inclui as situações em que o tripulante necessite de um período maior de descanso

  prévio a uma nova jornada em função de ajuste biológico (aclimatação) avaliado como

  necessário. Devido a diferenças individuais e fatores operacionais, é difícil estimar com

  precisão o ajuste do ritmo circadiano em indivíduos ao atravessar fusos horários.

  6.3.8.13. As regras de aclimatação previstas em 117.5 não se aplicam às operações sob o
  Apêndice

  E.

  6.3.8.14. Mais informações conceituais constam na IS nº 117-001.

  6.3.9. Cultura de segurança operacional positiva

  6.3.9.1. Uma cultura de segurança operacional (safety culture) é a consequência natural
  de ter

  humanos no sistema de aviação. Ela pode ser descrita como “a forma que as pessoas se

  comportam em relação à segurança e ao risco quando ninguém está observando”. É uma

  expressão de como a segurança é percebida, valorizada e priorizada pela gerência e pelos

  funcionários de uma organização, e se reflete na medida em que os indivíduos e grupos:Data
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  a. estão cientes dos riscos e perigos conhecidos enfrentados pela organização e suas

  atividades;

  b. continuamente se comportam para preservar e aumentar a segurança;

  c. têm acesso aos recursos necessários para operações seguras;

  d. estão dispostos e são capazes de se adaptar diante de questões de segurança;

  e. estão dispostos a comunicar questões de segurança; e

  f. avaliam consistentemente os comportamentos relacionados à segurança em toda a

  organização.

  6.3.9.2. Para a implantação de um GRF, é importante a promoção de uma cultura de segurança

  operacional positiva.

  6.3.9.3. Uma cultura de segurança operacional positiva deve compreender, entre outros aspectos:

  a. ser claramente apoiada pelo operador (gestão das operações);

  b. prover e promover um fluxo adequado de informação, reporte, análise e feedback;

  c. proteger os dados e informações, bem como as fontes dos reportes, na máxima extensão

  em que isso seja praticável; e

  d. não ter caráter punitivo.

  6.3.9.4. Quanto aos reportes dos aspectos de segurança operacional relevantes para o gerenciamento

  de risco de fadiga (os reportes de fadiga), o operador deve garantir, na máxima extensão

  em que isso lhe seja praticável:

  a. estabelecimento de processos claros e expectativas para o reporte de fadiga, com

  mecanismos de proteção, incluindo, por exemplo, mecanismos de proteção salarial;

  b. ciência do recebimento de reportes e informações relacionadas a segurança operacional,

  e deve fornecer feedback ao relator quanto às medidas tomadas; e

  c. manutenção da integridade do sistema de reporte e, conforme razoavelmente praticável,

  da confidencialidade do relator.

  6.3.9.5. Como ferramenta alternativa aos registros em papel, e visando melhor garantir os
  objetivos

  de manutenção da integridade do sistema de reporte e da proteção de dados e informações

  ali contidas, o operador poderá fazer uso de sistema informatizado para registro e guarda

  de informações de reportes de segurança operacional.

  a. Tal sistema, uma vez que venha a ser escolhido para utilização pelo operador, deve

  seguir os parâmetros estabelecidos na Resolução nº 458, de 20 de dezembro de 2017, ou

  outro normativo que venha a substitui-la.

  b. O registro digital de dados em blockchain é uma das opções para a aceitação do registro

  informatizado e tem como princípio o uso de um algoritmo de consenso distribuído que

  permite a validação descentralizada da informação, de maneira a garantir suaData de emissão:
  29 de outubro de 2024 IS nº 117-007

  Revisão A

  imutabilidade independentemente de uma terceira parte.

  6.4 Obrigações referentes ao Apêndice E do RBAC nº 117

  6.4.1. Oportunidade de sono anterior à jornada, sobreaviso ou reserva [E117.5]

  6.4.1.1. Conforme E117.5(a), um tripulante não pode ser escalado para uma jornada, sobreaviso
  ou

  reserva ou iniciá-la(o), exceto se tiver a oportunidade de sono de 8 (oito) horas consecutivas

  dentro das 12 (doze) horas que antecedem:

  a. o início da jornada, sobreaviso ou reserva, se esta(e) não sofreu atraso;

  b. o horário original de apresentação para a jornada, sobreaviso ou reserva, se esta(e)
  sofreu

  atraso de menos de 10 horas; ou

  c. o início da jornada, sobreaviso ou reserva após o atraso, se este foi de 10 horas ou
  mais.

  6.4.1.2. Para tanto, deve haver um entendimento mútuo entre o tripulante e o operador, sobre
  em

  que momento a oportunidade do sono se situará no período anterior à jornada de trabalho

  (especialmente para casos em que a oportunidade de sono não coincidir com a noite local).

  6.4.1.3. Em circunstâncias normais, o tripulante não deve ser contatado pelo operador durante
  a

  oportunidade de sono anterior à jornada, exceto de uma maneira que não perturbe seu sono

  naquele período. Do contrário, caracterizar-se-ão circunstâncias anormais.

  a. Circunstâncias normais referem-se às situações em que o operador deseja preservar a

  oportunidade de sono anterior do tripulante, sem interromper o fluxo contínuo do sono.

  Em casos de períodos de repouso maiores do que 12 horas, eventuais contatos nas horas

  anteriores ao período de 12 horas que precede o início da jornada são considerados

  normais, desde que não interfiram na noite local.

  b. Circunstâncias anormais referem-se ao caso em que o operador precisa entrar em contato

  com o tripulante e entende-se que isso significará que a oportunidade de sono anterior

  foi interrompida. O tripulante, então, não poderá iniciar a jornada de trabalho sem

  usufruir um período de oportunidade de sono anterior, iniciado desde o final da

  interrupção e concluído até o início dos preparativos para iniciar a jornada de trabalho.

  Exemplo:

  Pode ocorrer que o operador necessite de informações urgentes do tripulante, como

  dados de aeronavegabilidade de uma aeronave operada pelo tripulante na jornada de

  trabalho anterior e decide que não pode esperar até que a oportunidade de sono

  termine, entendendo que a oportunidade de sono deve ser rearranjada e iniciada

  novamente do zero a partir do final da interrupção.

