text: '117.17 da RBAC nº 117. Isso é feito para garantir que as transições não resultem em
  um

  aumento no risco à segurança operacional.

  6.3.2.2. Procedimentos.

  a. Operar sob múltiplos apêndices em uma única jornada de trabalho requer um processo

  de duas etapas. O primeiro passo é garantir que o tripulante esteja dentro dos limites do

  novo apêndice antes da transição. O segundo passo é determinar os limites que serão

  aplicados à jornada de trabalho proposta.

  b. Para operar sob múltiplos apêndices em jornadas de trabalho consecutivas, o caso mais

  trivial, basta concluir os limites aplicáveis de repouso e, se aplicável, tempo livre de

  atividades correspondentes à primeira jornada e, antes de iniciar a segunda jornada, estar

  dentro dos limites aplicáveis a ela (por exemplo, aplicando-se repouso prévio a uma

  jornada longa).

  c. No RBAC nº 117, as seguintes seções devem ser consideradas no desenvolvimento de

  procedimentos para operação em múltiplos apêndices; e, em particular, gerenciando o

  risco de fadiga por meio de transições de um apêndice para outro:

  i. seção 117.11;

  ii. seção 117.17; e

  iii. parágrafo 117.65(b)(5).

  d. A seção 117.11 do RBAC nº 117 exige que:

  i. cada operador deve cumprir os limites e requisitos mencionados nos apêndices

  aplicáveis; eData de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  ii. cada tripulante, empregado pelo operador, deve cumprir os limites dos apêndices

  que o operador optou por cumprir.

  e. Em algumas circunstâncias, o atendimento de todos os requisitos de um apêndice antes

  de operar sob esse apêndice poderia ser potencialmente mais restritivo do que o

  necessário para gerenciar o risco potencial de fadiga associado à transição.

  f. Os requisitos para combinar vários apêndices dentro de uma única jornada de trabalho

  são abordados na seção 117.17 do RBAC nº 117 e os operadores devem ter

  procedimentos que atendam a esses requisitos.

  6.3.2.3. Operando sob dois ou mais apêndices em uma única jornada de trabalho.

  a. Se o operador pretende realizar operações em que dois ou mais apêndices se aplicam a

  uma única jornada de trabalho, o operador deve adotar procedimentos que garantam que:

  i. a jornada de trabalho máxima é o máximo que se aplica ao tipo de operação que

  está sendo conduzida no momento (com base na suposição de que toda a jornada

  de trabalho foi conduzida sob esse apêndice). A jornada de trabalho máxima para a

  atividade que está sendo realizada a qualquer momento é sempre baseada no horário

  de início da jornada completa, não no momento em que o tripulante mudou para

  essa atividade;

  ii. o tempo máximo de voo é o tempo de voo máximo contido no apêndice sob o qual

  a operação está sendo conduzida naquele momento específico (com base na

  suposição de que toda a jornada de trabalho foi conduzida sob esse apêndice). Deve

  basear-se no horário de início original da jornada de trabalho e não no horário de

  início das operações em cada apêndice; e

  iii. o tempo de repouso que deve ser aplicado após a jornada de trabalho é o maior dos

  tempos mínimos de repouso calculados sob cada Apêndice.

  6.3.3. Identificação de perigos [117.65(b)(2)]

  6.3.3.1. Tal como ocorre com toda a gestão de riscos, os riscos relacionados à fadiga humana

  degradando o estado de alerta devem ser identificados, avaliados e gerenciados (por

  exemplo, colocando em prática controles e estratégias de mitigação).

  6.3.3.2. Os perigos podem combinar-se de maneira imprevisível, de modo que mesmo perigos

  aparentemente triviais podem resultar em estados indesejáveis, que podem se combinar

  com outros perigos para resultar em acidentes ou incidentes.

  6.3.3.3. Os métodos para identificação de perigos devem ser proporcionais aos limites efetivamente

  adotados pelo operador para suas operações cotidianas. Se os limites adotados forem

  próximos aos limites dos requisitos do Apêndice E do RBAC nº 117, o operador deve ter

  processos de identificação de riscos reativos, proativos e até mesmo preditivos que sejam

  suficientes para garantir que o risco de fadiga seja gerenciado adequadamente.

  6.3.3.4. Os perigos podem ser identificados a partir de uma variedade de fontes, incluindo,
  mas não

  se limitando a:

  a. workshops de identificação de perigos (por exemplo, brainstorming usando pessoal

  operacional experiente);Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  b. avaliações de risco (avaliações de risco formais podem revelar novos perigos);

  c. desenvolvimento de cenários de risco;

  d. registro de riscos (por exemplo, por meio de sistemas eletrônicos);

  e. análise de tendências;

  f. reporte de perigos;

  g. reportes de fadiga (Apêndice E) e FAPA (Apêndice B);

  h. feedback do treinamento;

  i. pesquisas de segurança e auditorias de segurança de supervisão operacional;

  j. monitoramento de operações normais;

  k. utilização de modelos biomatemáticos devidamente validados;

  l. investigação do estado sobre acidentes e incidentes graves; e

  m. sistemas de troca de informações (operadores similares, reguladores etc.).

  6.3.3.5. Com o passar do tempo, o banco de dados de perigos relatados permitirá que o operador:

  a. identifique situações de risco de fadiga que precisam de atenção especial; e

  b. conduza análises de tendências que podem fornecer a base para melhorar a identificação

  de perigos.

  6.3.3.6. O operador deve adotar procedimentos para lidar com as informações fornecidas pelos

  tripulantes que possam afetar o seu estado de alerta no trabalho. Exemplos de tais fatores

  constam na Seção 7.2 desta IS.

  6.3.3.7. Perigos como estes deveriam ser considerados:

  a. ao determinar as limitações de voo e tempo de serviço; e/ou

  b. na melhoria contínua das políticas e práticas estabelecidas pelo operador.

  6.3.3.8. Os modelos biomatemáticos podem auxiliar os operadores a fornecer previsões de
  fadiga

  humana e/ou de oportunidade de sono que podem ser utilizados como um componente no

  gerenciamento da fadiga. Um dos principais papéis de muitos modelos é fornecer

  ferramentas de auxílio na confecção de escalas de tripulantes, destinadas a fornecer uma

  validação inicial para escalas recém-desenvolvidas ou modificadas.

  6.3.3.9. Embora não seja um componente necessário, os modelos biomatemáticos podem incorporar

  aspectos da ciência da fadiga nas práticas de escala de tripulantes, fornecendo previsões
  de

  níveis de risco de fadiga, níveis de desempenho e/ou tempos/oportunidades ideais de sono.

  Entretanto, modelos biomatemáticos têm limitações que devem ser consideradas. Algumas

  limitações incluem:

  a. prever probabilidades de risco para uma média populacional em vez de níveis de fadigaData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  de um indivíduo específico;

  b. não levar em conta o impacto da carga de trabalho ou fatores de estresse pessoais e

  relacionados ao trabalho que podem afetar os níveis de fadiga;

  c. descrição incompleta de todos os fatores fisiológicos da fadiga; e

  d. testes limitados (validação) com dados específicos da aviação.

  6.3.3.10. Cada modelo tem diferentes pontos fortes e limitações. A Anac sugere que, ao usar
  um

  modelo biomatemático, o operador adote uma abordagem cautelosa, que leve em conta as

  limitações e a validade do modelo naquele contexto operacional específico (ou seja, se foi

  validado a partir de dados de fadiga de operações semelhantes àquelas em que o operador

  está interessado). Ao tomar decisões sobre a elaboração da escala, as previsões do modelo

  não devem ser usadas sem referência à experiência operacional ou dados de reportes de

  fadiga já conhecidos.

  6.3.3.11. É importante estar ciente de que um regime de gerenciamento de fadiga deve ser
  projetado

  como um sistema abrangente e multicamadas, no qual modelos biomatemáticos fornecem

  um papel de suporte opcional.

  6.3.3.12. Quando disponível, um operador deve fazer uso de procedimentos mais abrangentes
  de

  avaliação e mitigação dos riscos de fadiga. A Tabela 2 desta IS fornece exemplos adicionais

  de tipos de perigos que podem precisar ser abordados.

  6.3.3.13. O Apêndice E do RBAC nº 117 contém requisitos para gerenciar o risco de fadiga
  devido

  à perda de sono, tempo acordado, tempo de trabalho e os efeitos do horário do dia. No

  entanto, os diferentes ambientes operacionais, bem como diferentes cargas de trabalho,

  podem aumentar ou diminuir o acúmulo de fadiga. Este Apêndice fornece considerações

  mínimas sobre essas influências.

  6.3.3.14. O número máximo de etapas permitidas para uma jornada, por exemplo, não está entre

  essas considerações e deverá ser definido conforme o gerenciamento de risco de fadiga do

  operador, em particular para jornadas que se aproximem dos limites de tempo de voo ou de

  jornada aplicáveis.

  6.3.3.15. Os operadores devem considerar suas próprias circunstâncias usando experiências

  anteriores do operador ou discussões com outros operadores e grupos, para que limitações

  referentes a essas medidas (diferentes ambientes operacionais e cargas de trabalho etc.)

  sejam consideradas.

  6.3.3.16. A tabela a seguir apresenta alguns exemplos de uma abordagem razoável para a

  identificação de perigos para um operador sem um processo de avaliação de risco

  estabelecido. Ressalta-se que os tempos jornada e de voo não são os únicos meios possíveis

  de reduzir riscos associados aos perigos identificados.

  6.3.3.17. Os exemplos de perigos de fadiga da tabela abaixo podem existir para alguns operadores.

  Esta lista não é específica para nenhum tipo de operação em particular, mas destina-se a

  prover uma orientação mínima sobre a identificação de riscos de fadiga e respectivos

  ajustes das limitações e considerações de políticas e procedimentos a serem adotados para

  um operador do GRF sob o Apêndice E. Adicionalmente, o operador pode utilizar

  processos mais abrangentes para avaliar os perigos relativos à fadiga relacionados a fatores

  não considerados no Apêndice E do RBAC nº 117, estabelecendo limites adicionaisData de emissão:
  29 de outubro de 2024 IS nº 117-007

  Revisão A

  apropriados.

