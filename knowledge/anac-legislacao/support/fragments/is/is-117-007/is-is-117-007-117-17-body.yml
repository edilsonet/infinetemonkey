  6.3.3.18. Para maior aprofundamento no tema, recomenda-se o estudo da IS nº 119-002 da Anac.

  6.3.4. Reporte de ocorrência de fadiga [117.65(b)(3) e 117.65(b)(4)]

  6.3.4.1. A disposição dos tripulantes de reportar a ocorrência de fadiga refletirá seu nível
  de

  compreensão de seus papéis e responsabilidades em relação ao gerenciamento do risco de

  fadiga e sua confiança de que o objetivo da coleta de dados é melhorar a segurança. Um

  sistema eficaz de reporte de fadiga requer uma cultura de relato aberta e justa. O sistema

  de reporte deve:

  a. oferecer formulários fáceis de acessar, preencher e enviar;

  b. ter regras claras sobre a confidencialidade das informações comunicadas;

  c. ter regras claras sobre a proteção de reportes voluntários;

  d. incluir análises regulares dos reportes; e

  e. fornecer feedback regular aos tripulantes sobre decisões ou ações tomadas com base nos

  reportes e lições aprendidas (recomenda-se que o operador estabeleça um prazo limite

  para que a solução do reporte seja informada ao tripulante).Data de emissão: 29 de outubro
  de 2024 IS nº 117-007

  Revisão A

  6.3.4.2. Um reporte de fadiga, em papel ou eletrônico (vide Apêndice E), deve incluir informações

  sobre:

  a. sono recente;

  b. hora do dia em que o evento ocorreu;

  c. histórico de atividades desempenhadas no trabalho (o mínimo deveria ser dos últimos

  três dias);

  d. medição de diferentes aspectos do comprometimento relacionado à fadiga (por exemplo,

  escalas de alerta ou de sonolência validadas).

  6.3.4.3. O reporte também deve fornecer espaço para comentários escritos, para que a pessoa
  que

  está relatando possa explicar o contexto do evento e dar sua opinião sobre o motivo pelo

  qual isso aconteceu.

  6.3.4.4. Todos os níveis da organização devem encorajar os membros da tripulação a preencher
  e

  enviar reportes de ocorrência de fadiga nos seguintes casos:

  a. por meio do sistema de notificação voluntária, quando uma jornada não tenha começado

  ou não esteja concluída, devido à fadiga (total ou parcial). Isso inclui quando a jornada

  é concluída, mas somente após alguma ação de mitigação. Por exemplo:

  i. a adição de um membro extra da tripulação;

  ii. a redução da carga de trabalho da jornada;

  iii. o atraso da hora de apresentação;

  iv. a criação de oportunidade para um cochilo em solo; e

  v. o aumento da supervisão / monitoramento;

  b. por meio do sistema de notificação voluntária após uma jornada, se o tripulante acreditar

  (após refletir sobre o assunto) que o nível de fadiga a que ele ou outros membros da

  tripulação estiveram expostos significou que não haviam sido mantidas margens de

  segurança suficientes durante o(s) voo(s);

  c. por meio do sistema de notificação voluntária, quando a tripulação percebe algo em seu

  ambiente operacional que pode causar impacto em seus membros, ou em outros

  membros da tripulação, de tal forma que as margens de segurança poderiam ser

  reduzidas a níveis insatisfatórios; e

  d. por meio do sistema de comunicação de ocorrências, quando ocorreu um incidente ou

  evento em que a fadiga pode, ou não, ter contribuído para o fator de segurança. Para

  permitir isso, é preferível que haja um reporte de fadiga ou um aviso sobre o mecanismo

  de reporte de ocorrências do operador. Nestes casos, é aconselhável obter um histórico

  de sono de pelo menos 72 horas.

  6.3.4.5. O operador deve tratar os reportes de fadiga de forma proporcional ao seu conteúdo.

  6.3.5. Definição de limitações considerando os perigos [117.65(b)(3)]Data de emissão: 29
  de outubro de 2024 IS nº 117-007

  Revisão A

  6.3.5.1. O operador deve estar ciente de que os limites constantes do Apêndice E são limites

  prescritivos que necessitam de monitoramento constante por serem mais amplos que os

  estabelecidos pela Lei nº 13.475/17. Entretanto, limitações prescritivas são os mínimos

  esperados, e podem não ser suficientes para gerenciar adequadamente os riscos. Como parte

  de seu gerenciamento de risco, o operador pode precisar estabelecer limites máximos

  menores e limites mínimos maiores do que os do RBAC, e operar com base nesses.

  6.3.5.2. Assim, ao determinar os limites de tempo de voo e serviço, os operadores precisam

  considerar as necessidades específicas de seu ambiente operacional e alterar, se necessário,

  sempre a favor da maior segurança, os limites a serem efetivamente adotados de forma

  adequada. Adicionalmente é importante que os operadores considerem que seu ambiente

  provavelmente mudará com o tempo. Consequentemente, quaisquer alterações precisam

  ser adequadamente avaliadas quanto ao risco. O operador também precisa reavaliar,

  atualizar e modificar continuamente os limites de jornada de trabalho e de tempo de voo

  para garantir a segurança das operações no momento corrente.

  6.3.5.3. Os operadores devem considerar as consequências de mudanças organizacionais ou

  operacionais na fadiga e no desempenho da tripulação. Caso surjam problemas relacionados

  à fadiga associados a mudanças de operações (por exemplo, rotas diferentes); ou a

  introdução de novas operações, os operadores devem considerar mais mitigações para

  gerenciar a fadiga e o desempenho da tripulação. Para avaliar o risco de qualquer mudança,

  deve ser conduzida uma ampla avaliação de risco, o que inclui observar a probabilidade e

  as consequências dos riscos de fadiga associados a essa mudança.

  6.3.5.4. Os relatórios de avaliação de riscos serão requeridos pela Anac durante as atividades
  de

  vigilância, para demonstrar que as mudanças foram devidamente consideradas.

  6.3.5.5. Os limites que são determinados sob esta obrigação tornam-se novos limites “prescritivos”

  para o operador. Isto significa que qualquer ultrapassagem destes limites deve estar de

  acordo com os requisitos de extensão e apenas em circunstâncias operacionais imprevistas.

  6.3.5.6. Todos os tipos de treinamento (em aeronave, sala de aula ou à distância) podem
  afetar o

  estado de alerta dos tripulantes e seu desempenho operacional subsequente. Do ponto de

  vista da carga de trabalho, também é possível que monitorar ou treinar outro tripulante

  possa ser mais fatigante do que trabalhar em operações de voo. É altamente recomendável

  que os operadores façam uma redução apropriada dos limites máximos de jornada de

  trabalho quando esta incluir um período de treinamento.

  6.3.5.7. As sessões de treinamento em um simulador devem ser incluídas nas jornadas de trabalho.

  Ao planejar qualquer treinamento em simulador, o impacto do nível de fadiga da tripulação

  na qualidade do treinamento deve ser considerado e gerenciado.

  6.3.5.8. Trabalhos administrativos ou operacionais dentro e fora do escritório também devem
  ser

  sempre considerados na contagem total da jornada de trabalho. Mesmo um trabalho parcial

  em escritório, ou à distância (virtual), por gerar esforço cognitivo e depender de um estado

  de vigília atento, deve ser levado em consideração quando do planejamento das jornadas e

  tempos de voo, especialmente quando etapas de voo são combinadas com trabalhos em solo

  na mesma jornada.

  6.3.5.9. O operador não deve tirar proveito de um tripulante envolvido em atividades voluntárias

  antes de uma jornada que, de outra forma, seriam consideradas atividades requeridas. O

  operador não pode programar a jornada de trabalho de tal maneira que haja tão pouco tempoData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  disponível antes do voo que o horário de início do voo só seja atingido se o tripulante

  realizar as atividades necessárias antes do início da jornada de trabalho. Neste caso, as

  atividades não podem mais ser consideradas voluntárias.

  Exemplo 1:

  • Não garantir tempo suficiente na jornada de trabalho para realizar atividades como

  planejamento de voo, cálculo de peso e balanceamento etc. porque, em outras

  ocasiões, o tripulante já realizou essas tarefas voluntariamente antes da jornada de

  trabalho ser iniciado.

  Exemplo 2:

  • Retirar o tripulante do seu local de repouso de forma que ele chegue ao local da

  apresentação uma ou duas horas antes do início da jornada e considerar apenas 30

  minutos deste tempo para inclusão na jornada.

  6.3.5.10. Na definição das limitações, os reportes de fadiga preenchidos pelos tripulantes
  devem ser

  examinados com especial atenção. Mesmo taxas baixas sobre determinado aspecto não

  devem ser desconsideradas ou entendidas de antemão como “problema individual” sem

  devida análise da parte técnica.

  6.3.6. Melhoria contínua de políticas e procedimentos [117.65(b)(4)]

  6.3.6.1. Os operadores precisam monitorar e avaliar a eficácia de seus controles de gerenciamento

  de fadiga (como políticas e procedimentos). Quando os controles são considerados

  inadequados ou ineficazes, o operador deve abordar isso como parte de seus requisitos de

  melhoria contínua.

  6.3.6.2. Políticas e procedimentos a serem considerados incluem:

  a. elaboração de escalas de voo;

  b. condições de acomodação fora de base;

  c. procedimentos referentes a tripulações compostas e de revezamento;

  d. programas de treinamento; e

  e. uso de ferramentas de prontidão e vigilância.

  Exemplo:

  Um operador, que inicie suas operações principalmente durante o final da madrugada

  e início da manhã (digamos, entre 05:00 e 07:00), deve levar em conta essa

  necessidade operacional ao elaborar suas políticas e procedimentos. Neste caso,

  deveria existir um procedimento para, a cada dia, atrasar em uma hora o horário de

  apresentação do tripulante cujo despertar infringe o seu período da madrugada, de

  modo a possibilitar a recuperação da qualidade de sono à medida que a semana

  progrida (exemplo, programar o primeiro dia para às 05:00, o segundo para às 06:00,

  o terceiro para às 08:00 ou mais tarde, pois não seria possível antes devido às duas

  madrugadas anteriores).

  6.3.6.3. As políticas e procedimentos de um operador devem ser reavaliadas quanto à adequaçãoData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  quando houver ajustes das limitações de jornada de trabalho e/ou de tempo de voo.

  6.3.7. Indicadores de desempenho e coleta de informações e dados de um GRF [117.65(b)(2)

  e 117.65(b)(4)]

  6.3.7.1. Introdução.

  a. Os indicadores de desempenho, bem como o sistema de coleta de informações e dados

  relativos à adoção do GRF, devem levar em conta os seguintes aspectos:

  i. Propósito - um operador aéreo deve reunir dados e informações suficientes para

  estar seguro de que é capaz de identificar e tratar as potenciais ameaças da fadiga e

  seus riscos associados nas suas operações. É preciso ficar claro para o operador que

  fatores operacionais podem produzir maior ou menor fadiga sobre suas tripulações;

  ii. Prioridade - uma vez que a incapacidade decorrente de fadiga afeta múltiplas

  habilidades e possui diversas causas, não existe uma única medição que dê conta de

  descrever completamente os níveis de fadiga ou fatores causadores de fadiga em

  uma dada tripulação. Para decidir que dados colher, o operador deve levar em

  consideração aquelas operações em que é esperado um elevado nível de risco de

  fadiga. Nelas, os recursos devem estar direcionados para a coleta de dados

  significativos para a operação; e

  iii. Eficiência - deve existir um equilíbrio entre a coleta de dados em quantidade

  suficiente para o operador aéreo estar seguro acerca de suas decisões, ações, e

  demandas adicionais e os respectivos custos envolvidos nesta coleta e análise. Os

  recursos, sempre limitados, devem ser otimizados para oferecer uma correta

  identificação das ameaças e riscos associados à fadiga e onde os controles e

  mitigações devem ser melhor aplicados.

  b. O Apêndice C e o Apêndice D desta IS apresentam indicadores de desempenho

  recomendados para a implantação e gerenciamento de um GRF sob o Apêndice E do

  c. A Anac pode, a qualquer momento, requisitar um relatório dos indicadores do GRF.

  6.3.7.2. Uso proposto para os indicadores.

  a. Os indicadores apresentados pelos operadores devem, tão logo a sistematização da

  coleta permita, ser acompanhados de análises de tendência, de forma a oferecer subsídio

  ao operador para o monitoramento das operações sob o GRF e, por extensão, para

  acompanhamento por parte da Anac.

  b. Os indicadores de desempenho propostos e adotados visam avaliar se as estratégias de

  mitigação aprovadas estão correspondendo à redução do risco desejada. Esta avaliação

  dos indicadores deve ser feita a intervalos regulares ou sempre que o operador tiver

  razões para acreditar que os riscos não estão sendo satisfatoriamente mitigados. A

  análise dos dados listados nos Apêndices C e D desta IS deve servir de parâmetro

  mínimo para a eventual revisão das ações mitigatórias.

  6.3.8. Fisiologia circadiana e horários de WOCL, madrugada e início cedo [117.3(m-III);

  117.3(o)-I; 117.3(m)-II; E117.7; E117.29; 117.65(b)(2) e (3)]Data de emissão: 29 de outubro
  de 2024 IS nº 117-007

  Revisão A

  6.3.8.1. Os efeitos circadianos são considerações importantes ao se buscar determinar as

  necessidades operacionais, pois os ritmos circadianos não se ajustam rapidamente a

  mudanças. Na verdade, os ritmos de muitas funções fisiológicas se ajustam em diferentes

  taxas. Há um "relógio" biológico no cérebro humano, assim como em outros organismos,

  que regula os padrões de 24 horas das funções do corpo. Esse relógio controla não apenas

  o sono e a vigília, alternando-se em paralelo com o ciclo ambiental claro/escuro, mas

  também a natureza oscilatória da maioria das funções fisiológicas, psicológicas e

  comportamentais. A ampla gama de funções corporais controladas por esse relógio

  biológico inclui a temperatura corporal, a secreção de hormônios, a digestão, o desempenho

  físico e mental, o humor e muitos outros. Em uma base de 24 horas, essas funções flutuam

  em um padrão regular, com um alto nível em um determinado momento do dia e um baixo

  nível em outro momento.

  6.3.8.2. O padrão circadiano do relógio (sendo "circa" significando "ao redor" e "dies"
  significando

  "dia") de vigília e sono programa o corpo humano para estar acordado durante o dia e

  dormir à noite. O sistema circadiano repete esse padrão diariamente. Certas horas do ciclo

  de 24 horas - aproximadamente das 02:00 às 06:00 (para indivíduos adaptados a um horário

  de acordar durante o dia e dormir à noite), chamado de janela de baixa do alerta no ritmo

  circadiano (WOCL) - são identificadas como um momento em que o corpo está

  programado para dormir, e durante esse período, o alerta e o desempenho são prejudicados.

  6.3.8.3. Há um segundo período menos pronunciado de redução da alerta entre as 15:00 e as
  17:00,

  que depende do horário em que a pessoa acordou e de quanto sono obteve, podendo variar.

  6.3.8.4. Horários não convencionais interrompem os padrões diários de vigília e sono, resultando

  em uma disritmia circadiana. Por exemplo, uma pessoa que trabalha durante a noite está

  mantendo a vigília em oposição direta à programação fisiológica de dormir. Funções

  fisiológicas, psicológicas e comportamentais são definidas, pelo sistema circadiano, em

  estado reduzido durante a WOCL. Não se pode compensar este efeito estando acordado e

  ativo. Por outro lado, a mesma pessoa que dorme durante o dia está em oposição direta à

  programação fisiológica de estar acordada nesse horário. O sistema circadiano fornece um

  alto nível de funcionamento durante o dia que então se contrapõe ao desejo de dormir.

  6.3.8.5. A disritmia circadiana também ocorre no caso do jet lag. Quando o relógio biológico
  não

  está alinhado com os sinais de tempo do ambiente externo, ocorre uma dessincronização

  tanto em relação ao ambiente externo quanto entre as várias funções fisiológicas internas.

  Tais perturbações circadianas podem levar a perda aguda de sono, déficit de sono,

  diminuição do desempenho e alerta, e vários problemas de saúde (por exemplo,

  gastrointestinais).

  6.3.8.6. Não existe uma equação simples para determinar a taxa de ajuste circadiano em cada

  indivíduo. Inúmeros fatores desempenham um papel, como o número de fusos horários

  atravessados, a direção da viagem, a quantidade e o momento da exposição à luz, tipos

  matinais/vespertinos e pessoas que dormem muito ou pouco.

  6.3.8.7. Considerando a fisiologia circadiana e a disritmia no caso do jet lag, as definições
  de Janela

  de Baixa do Alerta no Ritmo Circadiano (em inglês Window of Circadian Low - WOCL),

  de madrugada e de início cedo para as operações realizadas sob o Apêndice E são feitas

  como a seguir.

  6.3.8.8. A definição quanto a se uma jornada atravessa ou atinge a WOCL, e, portanto, necessita
  de

  limites operacionais diferentes dos da jornada padrão, dependerá, no Apêndice E, deData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  considerações sobre quantos fusos já foram cruzados na viagem e em que momento de uma

  viagem a jornada se inicia. O mesmo ocorre para a definição de madrugada e de início cedo.

  6.3.8.9. Caso se trate de uma viagem que, até o momento do início da nova jornada, cruzou
  menos

  de 3 fusos horários, o horário a ser considerado para a WOCL (das 02h00 às 6h00), para a

  madrugada (das 00h00 às 06h00) e para o início cedo (das 06h01 às 07h59) será definido a

  partir da hora local da base contratual do tripulante.

  6.3.8.10. Caso se trate de uma viagem que já cruzou 3 ou mais fusos horários:

  a. Caso a nova jornada se inicie em até 48h do início da viagem, o horário a ser considerado

  para a WOCL, madrugada e início cedo permanece sendo definido a partir da hora local

  da base contratual do tripulante; e

  b. Caso a nova jornada se inicie após 48h do início da viagem, o horário a ser considerado

  para a WOCL, madrugada e início cedo passa a ser definido a partir da hora local onde

  o tripulante se encontra.

  6.3.8.11. Assim, o operador deve adotar procedimentos para determinar qual o horário deverá
  ser

  utilizado como base para o planejamento de uma dada jornada. Esses procedimentos devem

  levar ao mesmo resultado da tabela a seguir:

  Diferença de fusos entre o local da

  base contratual e um novo local (local

  onde o tripulante iniciará uma nova

  jornada)

