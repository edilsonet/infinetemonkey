text: '117.65 117.63

  NB x

  (exceto 117.5) x x

  GRF x x x x(*) x

  SGRF x x x x(*)

  (*) Parte dos requisitos do Apêndice A permanece aplicável às operações sob Apêndice E,
  e

  mesmo sob um SGRF. Para as operações sob Apêndice E, ver Tabela E.1 na seção E117.1

  para a definição de quais requisitos do Apêndice E substituem ou complementam requisitos

  específicos do Apêndice A.

  Tabela 1: Níveis de gerenciamento da fadiga e requisitos do RBAC nº 117 associados para
  operadores de

  aviação geral operando exclusivamente segundo as regras do RBAC nº 91, conforme o parágrafo

  117.1(b)(6) do RBAC nº 117.

  5.1.6. Esta IS tem como objetivo fornecer orientação para atender aos requisitos do GRF
  para

  operações privadas sob o RBAC nº 91 quando realizando operações sem fins lucrativos

  com pilotos contratados, a serviço do operador, em aviões a jato com 2 ou mais pilotos.

  Parte deste material é relevante para um operador que pretenda candidatar-se a um SGRF

  ou opere sob um SGRF.

  5.1.7. A fim de fornecer aos leitores orientações relevantes para seus interesses, esta
  IS é dividida

  em cinco partes principais:

  a. Seção 5: Introdução (esta parte)

  b. Seção 6: Obrigações dos operadores do GRF;

  c. Seção 7: Obrigações individuais dos tripulantes;

  d. Seção 8: Necessidade de implantar um SGRF para um operador do GRF; eData de emissão:
  29 de outubro de 2024 IS nº 117-007

  Revisão A

  e. Seção 9: Procedimentos de aceitação.

  5.1.8. Os apêndices desta IS cobrem áreas mais específicas de orientação, tais como interpretar
  e

  exemplificar os limites e requisitos do RBAC nº 117.

  Nota: a Lei nº 13.475/17, ao mesmo tempo que em que traz matéria relacionada a segurança

  operacional - afetas às atribuições desta Agência -, também dispõe sobre matéria que não

  se dirige a esse fim - notadamente, a relacionada aos aspectos trabalhistas da relação que

  existe entre os aeronautas e seus empregadores. O cumprimento dos requisitos

  estabelecidos no, detalhados nesta IS, não afasta a necessidade do cumprimento dos demais

  dispositivos legais.'
