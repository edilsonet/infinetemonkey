text: '16. Definições, regras de redação e unidades de medida para uso nos normativos da

  ANAC.

  d. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 117 (RBAC nº 117) -

  Emenda 01. Requisitos para gerenciamento de risco da fadiga.

  e. CASA. (2024). CAAP 48-01 v3.3 - Fatigue management for flight crew members.

  f. FAA. (2012). AC 117-1 - Flightcrew Member Rest Facilities. Date issued 2012-09-20.

  g. FAA. (2013). AC 117-3 - Fitness for Duty. Date issued 2012-10-11.

  h. ICAO. (2020). Doc 9966 Second Edition, Version 2 (Revised) - Manual for the

  Oversight of Fatigue Management Approaches.

  i. ICAO; IBAC & FSF. (2016). Fatigue Management Guide for General Aviation

  Operators of Large and Turbojet Airplanes. First Edition

  j. NBAA & FSF. (2014). Duty/Rest Guidelines for Business Aviation. April 2014.'
