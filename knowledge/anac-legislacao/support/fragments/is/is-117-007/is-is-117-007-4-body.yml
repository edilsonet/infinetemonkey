text: '4. DEFINIÇÕES, ACRÔNIMOS E BIBLIOGRAFIA

  4.1 Acrônimos

  Para os efeitos desta IS, são válidos os seguintes acrônimos:

  a. Anac: Agência Nacional de Aviação Civil

  b. FAPA: Ferramenta de Auxílio para Autoavaliação

  c. GRF: Gerenciamento de Risco da Fadiga

  d. IS: Instrução Suplementar

  e. NB: Nível Básico

  f. OACI: Organização de Aviação Civil Internacional

  g. RBAC: Regulamento Brasileiro de Aviação Civil

  h. SGRF: Sistema de Gerenciamento do Risco da Fadiga

  i. WOCL: Window Of Circadian Low (janela de baixa do alerta do ritmo circadiano)

  4.2 Definições

  Para os efeitos desta IS, são válidas as definições listadas nos RBAC nº 01, no RBAC nº

  117 e IS nº 117-001, além das abaixo listadas:

  a. acesso (à alimentação ou à acomodação) significa que o tripulante não encontra

  impedimento ou restrição para atendimento real e imediato das suas necessidades de

  alimentação, higiene pessoal, descanso ou repouso;

  b. atraso significa o período de tempo entre o horário original de apresentação e o horário

  de apresentação real do tripulante, contados na mesma base de fuso horário. O tempo de

  atraso será considerado como sendo sobreaviso, quer ele cumpra ou não os requisitos de

  sobreaviso contidos na seção A117.17 do Apêndice A do RBAC 117.

  c. circunstância operacional imprevista significa um evento excepcional não planejado

  que se torna evidente após o início da jornada, como condições meteorológicas

  imprevistas, mau funcionamento de um equipamento ou atraso no tráfego aéreo;

  d. controles significam as estratégias defensivas de nível de sistema projetadas para

  minimizar o risco de fadiga de forma contínua;Data de emissão: 29 de outubro de 2024 IS
  nº 117-007

  Revisão A

  e. fuso horário (ou fuso) significa uma região definida com um horário local uniforme

  que difere em uma hora (ou parte de uma hora) do horário local uniforme de uma região

  adjacente, utilizando o valor definido pelo país. Não leva em conta diferenças horárias

  devido ao horário de verão ou inverno da origem ou do destino;

  f. mitigações significam as intervenções sistêmicas destinadas a reduzir um risco

  específico de fadiga apropriadamente identificado;

  g. operação específica significa a proposta de operação incluída no SGRF que permita ao

  operador interessado operar sob limites diferentes dos estipulados na Lei nº 13.475, de

  28 de agosto de 2017, ou do Apêndice E do RBAC nº 117. Corresponde à expressão

  safety case utilizada internacionalmente; e

  h. tripulações aumentadas significa tripulações composta ou de revezamento.

  4.3 Bibliografia

  a. ANAC. (2020). IS nº 117-003B - Gerenciamento de risco da fadiga - GRF.

  b. ANAC. (2024). IS nº 117-001A - Conceitos básicos sobre fadiga humana.

  c. ANAC. (2024). Regulamento Brasileiro de Aviação Civil nº 01 (RBAC nº 01) - Emenda'
