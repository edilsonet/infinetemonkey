title: INTRODUÇÃO
text: '5. INTRODUÇÃO

  5.1 Geral

  5.1.1. A Lei nº 13.475, de 28 de agosto de 2017, dispõe sobre o exercício da profissão de

  tripulante, denominado aeronauta, estabelecendo critérios e limites prescritivos de

  gerenciamento de fadiga, cumprindo os requisitos exigidos pela Organização Internacional

  de Aviação Civil (OACI).

  5.1.2. O art. 19 da Lei nº 13.475/17 permite que as limitações operacionais nela estabelecidas

  sejam alteradas pela Anac, com base nos preceitos do Sistema de Gerenciamento de Risco

  de Fadiga Humana. Tais preceitos constam do DOC 9966, da OACI, e estão constantemente

  evoluindo a partir de resultados de pesquisas científicas e da experiência da indústria.Data
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  5.1.3. Com o intuito de atender ao art. 19 da Lei nº 13.475/17, foi criado o RBAC nº 117,

  intitulado Requisitos para Gerenciamento de Risco de Fadiga Humana, de forma a

  complementar a Lei com o que existe de mais atual no que se refere ao gerenciamento

  prescritivo de fadiga humana nas operações aéreas, bem como possibilitar aos operadores

  desenvolverem novas propostas baseadas em desempenho, uma inovação na indústria

  brasileira.

  5.1.4. O RBAC nº 117 foi desenvolvido em três níveis, do puramente prescritivo (NB - Nível

  Básico) até o customizado às necessidades do operador (SGRF - Sistema de Gerenciamento

  de Risco de Fadiga), contando com um nível intermediário em que alguma flexibilidade é

  possível quando determinadas exigências são atendidas (GRF - Gerenciamento de Risco

  de Fadiga). O operador deve optar por qual nível seguir, seja para todas as operações ou

  para parte delas. É importante observar que, uma vez feita a opção, todas as operações

  abrangidas pela opção devem seguir as regras escolhidas.

  Nota: a IS nº 117-001 traz um detalhamento sobre os três níveis.

  5.1.5. A tabela abaixo apresenta um resumo dos três níveis e sua interação com as subpartes
  e

  apêndices do RBAC nº 117, considerando-se aqui apenas as opções para os operadores de

  aviação geral operando exclusivamente segundo as regras do RBAC nº 91, conforme o

  parágrafo 117.1(b)(6) do RBAC nº 117:

  Nível de

  Gerenciamento

  de Fadiga

  Subparte A Subparte B Subparte C Apêndice A

  (Lei 13.475/17) Apêndice E'
