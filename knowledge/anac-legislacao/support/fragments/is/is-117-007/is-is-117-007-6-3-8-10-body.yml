text: '6.3.8.10 desta IS.

  b. Conforme o item 6.3.8.11, procedimentos de gerenciamento de risco de fadiga

  implantados pelo operador devem ser capazes de identificar situações específicas que

  necessitem de um período maior de descanso prévio a uma nova jornada em função de

  disritmia circadiana e ajuste biológico / adaptação (aclimatação) avaliado como

  necessário.

  c. Adicionalmente, conforme estabelecido em A117.23(d), para viagens em que ocorra o

  cruzamento de 3 (três) ou mais fusos horários em um dos sentidos da viagem, o tripulante

  deve ter, na base contratual, o repouso após a jornada acrescido de 2 (duas) horas por

  cada fuso cruzado.

  d. O cruzamento de fusos horários em um dos sentidos da viagem deve ser considerado

  com base na diferença máxima absoluta entre o maior fuso a leste e o maior fuso a oeste

  visitados, mesmo que nenhum dois coincida com o da base.

  e. O fuso horário a ser considerado não leva em conta diferenças horárias devido ao horário

  de verão ou de inverno da origem ou do destino.

  Exemplo 1: Viagem com origem na base contratual em Guarulhos (UTC-3), segue para

  Londres (UTC) e lá a tripulação efetua repouso. Na jornada seguinte, a tripulação segue

  para Nova Iorque (UTC-5), onde efetua novo período de repouso, e de lá retorna a

  Guarulhos (UTC-3). Neste caso, considerando-se o maior fuso a leste e o maior fuso a

  oeste a diferença de fusos é de 5, entre os fusos de Londres e de Nova Iorque. O repouso

  extra devido ao cruzamento de fusos horários neste caso será, quando de volta à base,

  de 10 horas (2 vezes a diferença de fusos de 5 horas).

  Exemplo 2: Viagem com origem na base contratual em Guarulhos (UTC-3), segue para

  Milão (UTC+1) e lá a tripulação efetua repouso. Na jornada seguinte, a tripulação

  retorna a Guarulhos (UTC-3). Neste caso, considerando-se o maior fuso a leste e o

  maior fuso a oeste a diferença de fusos é de 4, entre os fusos de Milão e de Guarulhos.

  O repouso extra devido ao cruzamento de fusos horários neste caso será, quando de

  volta à base, de 8 horas (2 vezes a diferença de fusos de 4 horas).

  6.4.9.6. Procedimentos a serem adotados.

  a. Fadiga aguda.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  i. O operador deve respeitar os períodos de repousos mínimos que serão aplicados aos

  seus tripulantes. Esses períodos não podem ser inferiores aos exigidos pelos

  parágrafos E117.23(a)(1), E117.23(a)(2) e E117.23(a)(3), podendo ser maiores

  caso as circunstâncias assim o requeiram, e ainda devendo permitir uma

  oportunidade de oito horas de sono.

  b. Fadiga cumulativa.

  i. Para lidar com a fadiga cumulativa, antes de iniciar uma jornada, o tripulante deve,

  se aplicável, ter cumprido pelo menos os requisitos de período livre de atividades

  (repouso adicional ou folga), previstos em E117.23(a)(4) e E117.23(a)(5).

  ii. Deve-se observar que os requisitos de tempo livre de atividades previstos incluem

  no mínimo duas noites locais, ou seja, duas noites que incluam 8 horas consecutivas

  de sono cada, entre os períodos entre 22h00 e 08h00, na hora local.

  iii. Adicionalmente, deve ser observado o requisito em E117.23(c) que refere que um

  tripulante retornando de uma folga de 24 horas para assumir uma jornada só poderá

  fazê-lo se a jornada se iniciar a partir das 10h00.

  c. Os limites mínimos de repousos e períodos livres de atividade previstos em E117.23

  podem ser resumidos como na tabela a seguir:

