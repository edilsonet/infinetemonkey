  d. Cruzamento de fusos horários.

  A. O operador deve utilizar procedimentos de gerenciamento de risco de fadiga

  capazes de identificar situações específicas que necessitem de um período

  maior de descanso prévio a uma nova jornada em função de disritmia circadiana

  e ajuste biológico / adaptação (aclimatação) avaliado como necessário.

  B. Adicionalmente, se houver cruzamento de 3 ou mais fusos horários, o operador

  deve programar o repouso previsto em E117.23(a)(1), (a)(2) e (a)(3), quando

  de volta à base, acrescido de 2 (duas) horas por cada fuso cruzado.

  6.4.10. Limites de tempo de voo acumulado [E117.25]

  6.4.10.1. O limite de tempo de voo acumulado em períodos de médio e longo prazo é um meio
  de

  gerir a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um tripulante

  de forma intensiva durante um longo período.

  6.4.10.2. O tempo de voo acumulado significa o total progressivo de tempo de voo acumulado
  pelo

  tripulante ao agir como um membro da tripulação a bordo de qualquer aeronave, mas

  excluindo o tempo de voo acumulado durante operações privadas recreativas.

  6.4.10.3. Para que um operador gerencie o tempo de voo cumulativo, ele deve rastrear o tempo
  de

  voo registrado pelo tripulante ao voar em suas operações durante o período em questão e
  o

  tempo de voo que os tripulantes acumulam durante voos não recreativos durante esse

  mesmo período.

  Nota: voos recreativos são voos conduzidos por um tripulante a título pessoal e durante

  o período de lazer do tripulante. Um voo conduzido por um tripulante como uma

  operação privada não é considerado recreativo se ocorrer para, ou em nome de, uma

  entidade, independentemente de a entidade ser ou não detentora de um COA ou

  certificada sob o RBAC nº 141.

  6.4.10.4. Para que este limite seja aplicado com precisão, o operador deve registrar o tempo
  de voo,

  de acordo com a definição do tempo de voo no RBAC nº 117, o que significa, no caso de

  uma aeronave de asa fixa, o período compreendido entre o início do deslocamento, com o

  intuito de iniciar um voo, até o momento em que se imobiliza a aeronave na posição de

  estacionamento (calço-a-calço).

  6.4.10.5. O Apêndices E do RBAC nº 117 têm os seguintes limites cumulativos de tempo de
  voo:

  a. 90 horas durante qualquer período de 28 dias consecutivos; e

  b. 900 horas durante qualquer período de 365 dias consecutivos;

  6.4.10.6. Quando o tripulante realizar diferentes tipos de operações, o limite inferior
  deve ser

  respeitado.

  6.4.10.7. Procedimentos a serem adotados.

  a. O operador deve adotar:

  i. procedimentos para o rastreamento e análise do tempo de voo acumulado de cada

  tripulante;Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  ii. um meio de monitorar o tempo de voo de cada tripulante, garantindo assim que

  qualquer tripulante não exceda os limites aplicáveis; e

  iii. diretrizes em formato claro e prontamente disponíveis para os tripulantes.

  b. Há necessidade de procedimentos para tripulantes que voam para outro operador. Se um

  tripulante voar para outro operador, serão necessários procedimentos para considerar

  essas horas de voo ao avaliar se o tripulante está dentro dos limites de tempo de voo

  acumulados. Sobre isto ver item 7.2.3 desta IS.

  c. Há necessidade de procedimentos para os tripulantes incluírem em seu registro de voo

  acumulado qualquer voo particular em atividades não recreativas.

  d. O operador não deve permitir que um tripulante exceda os limites acumulados de tempo

  de voo especificados na seção E117.25 do RBAC nº 117.

  6.4.11. Limites de trabalho acumulado [E117.27]

  6.4.11.1. O limite de jornada de trabalho acumulada em períodos de médio e longo prazo é
  um meio

  de gerir a fadiga cumulativa, reduzindo a possibilidade de um operador escalar um

  tripulante de forma intensiva durante um longo período.

  6.4.11.2. O limite de trabalho acumulado de um tripulante significa o total progressivo
  das jornadas

  de trabalho do tripulante ao realizar qualquer trabalho para um operador, incluindo, além

  das jornadas de voo e períodos de sobreaviso e reserva, períodos de trabalho nos escritórios

  do operador, reuniões, treinamentos de solo ou de voo.

  6.4.11.3. O Apêndice E do RBAC nº 117 têm os seguintes limites de jornada acumulados:

  a. 60 horas durante qualquer período de 7 (sete) dias consecutivos;

  b. 100 horas durante qualquer período de 14 (quatorze) dias consecutivos; e

  c. 176 horas mensais.

  6.4.11.4. Para que não haja dúvidas, em relação ao item “c” acima, se o limite de 176 horas
  for

  atingido, os dias que representam a diferença para o final do mês calendário devem ser

  livres de qualquer serviço.

  Nota: o §1º do Art. 41 da Lei 13.475/17 requer, para a utilização de um limite semanal de

  trabalho acima de 44 horas semanais, que essa disposição conste de convenção ou acordo

  coletivo de trabalho, procedimento que diz respeito, unicamente, à relação que existe entre

  operador e tripulante e que está fora das atribuições da Anac.

  6.4.11.5. Procedimentos a serem adotados.

  a. O operador deve adotar:

  i. procedimentos para o rastreamento, registro e análise dos tempos totais de jornada

  acumulada de cada tripulante;

  ii. um meio de monitorar os limites de jornada de cada tripulante, garantindo assim

  que qualquer tripulante não exceda os limites aplicáveis;Data de emissão: 29 de outubro
  de 2024 IS nº 117-007

  Revisão A

  iii. diretrizes em formato claro e prontamente disponíveis para os funcionários do

  operador envolvidos nas atividades de escala, treinamento e para os tripulantes.

  b. Pode haver necessidade de procedimentos para tripulantes que voam para outro

  operador. Se um tripulante voar para outro operador, serão necessários procedimentos

  para considerar essas horas trabalhadas ao avaliar se o tripulante está dentro dos limites

  de tempo de jornada acumulados.

  c. Pode ser necessário haver procedimentos para os tripulantes incluírem em seu registro

  de voo acumulado qualquer voo particular em atividades não recreativas.

  d. O operador não deve permitir que um tripulante exceda os limites acumulados de tempo

  de voo especificados na seção E117.25, conforme aplicável.

  6.4.12. Limites em operações na madrugada e início cedo [E117.29]

  6.4.12.1. Operação na madrugada significa, no Apêndice E, uma jornada que compreenda o período

  transcorrido, total ou parcialmente, entre 00h00 e 06h00. Os horários a serem utilizado
  para

  a definição da madrugada serão, conforme estabelecido em 117.3(o)-I(4) e de acordo com

  o exposto na seção 6.3.8 desta IS. Estes horários poderão, portanto, ser definidos com base

  na hora local da base contratual do tripulante ou a partir da hora local onde o tripulante
  se

  encontra.

  6.4.12.2. Notar que aqui se trata de limitações referentes ao uso de tripulante no período
  da

  madrugada (00h00 às 06h00), e não apenas no período da WOCL (02h00 às 06h00). Há

  ainda limitações adicionais para jornadas na WOCL em tripulações simples, tratadas nesta

  IS na seção 6.4.2.

  6.4.12.3. A fim de minimizar a fadiga em operações na madrugada, o Apêndices E contêm as

  seguintes exigências:

  a. nenhum tripulante pode realizar mais de duas jornadas consecutivas que envolvam

  operações na madrugada, limitadas a quatro jornadas com operações na madrugada

  durante qualquer período de 168 horas consecutivas, exceto como previsto no item “c”

  a seguir;

  b. caso sejam designadas quatro jornadas que envolvam operações na madrugada em

  qualquer período de 168 horas consecutivas, apenas mais uma jornada com função a

  bordo, sobreaviso ou reserva pode ser designada para o mesmo período;

  c. um tripulante pode ser escalado para jornada na terceira operação na madrugada

  consecutiva, desde que como tripulante extra a serviço, em voo de retorno à base

  contratual, encerrando sua jornada de trabalho. Nesta condição, o tripulante não pode

  ser escalado para compor tripulação no período que antecede a terceira operação na

  madrugada consecutiva na mesma jornada de trabalho;

  d. o período de 168 horas consecutivas a que se refere o item “a”, acima, pode ser

  encerrado, iniciando-se a contagem de novo período, sempre que for disponibilizado ao

  tripulante um período mínimo de 48 horas, incluindo duas noites locais, livre de qualquer

  atividade.

  e. nenhum operador aéreo pode escalar e nenhum tripulante pode aceitar a escalação para

  duas operações consecutivas na madrugada a menos que o repouso anterior à primeiraData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  operação na madrugada inclua o período de 22h00 até 08h00 livre de qualquer atividade

  (uma noite livre), e o repouso subsequente à segunda operação na madrugada inclua o

  período de 22h00 até 08h00 livre de qualquer atividade (outra noite livre).

  i. Entende-se que o período de repouso anterior à primeira operação na madrugada

  pode ser cumprido por um período de repouso propriamente dito ou por um período

  livre de atividades, incluindo folga.

  Boas práticas

  • Prever folgas, após trabalho noturno, principalmente após operações na

  madrugada.

  • Finalizar jornadas noturnas até às 06:00 parece ser melhor do que a partir

  deste horário, para garantir que a pessoa se desloque ainda no escuro e não se

  exponha à luz, o que favorecerá seu sono matinal.

  6.4.12.4. O operador pode escolher atrasar o horário de início da jornada seguinte a uma
  única

  operação na madrugada para proteger melhor a noite de sono de seus tripulantes, permitindo

  que acordem mais tarde (iniciar jornadas a partir das 10:00, por exemplo), e/ou diminuir
  a

  duração dessa jornada posterior. O operador poderá propor testar diferentes configurações,

  buscando minimizar os riscos advindos das combinações de jornadas (diurnas, noturnas e

  na madrugada) ao longo de períodos de 168 horas ou 28 dias, por exemplo.

  Da mesma forma, o operador pode escolher proteger a jornada anterior a uma única

  operação na madrugada. O objetivo é evitar que um tripulante acorde ou esteja

  acordado em duas madrugadas na sequência. Se sua jornada anterior, contudo, iniciar

  antes das 08:00, muito provavelmente seu despertar ocorrerá antes ou muito próximo

  das 06:00.

  6.4.12.5. Mesmo jornadas iniciadas fora do horário da madrugada (a partir de 06:01), exigem
  que o

  acordar ocorra na madrugada, por necessidade de preparação e deslocamento. O operador

  deveria levar isso em conta ao planejar jornadas consecutivas de início cedo ou operações

  na madrugada sucedidas ou precedidas por operações de início cedo.

  6.4.12.6. Aplicável especificamente às operações com início cedo, nenhum operador pode escalar
  e

  nenhum tripulante pode aceitar a escalação para mais de três jornadas consecutivas com

  início cedo.

  a. A definição do horário a ser considerado para configurar o que seria o início cedo deve

  seguir o previsto nos itens 6.3.8.9 e 6.3.8.10 desta IS.

  6.4.12.7. Os requisitos contendo limitações para operações na madrugada, de início cedo
  e operações

  na WOCL com tripulação simples também se aplicam às operações decorrentes de

  reprogramações ou extensões. Portanto, há que se ter atenção diante de reprogramações e

  extensões quanto aos conceitos e limitações relacionados a madrugada, WOCL e início

  cedo.

  6.4.12.8. Procedimentos a serem adotados.

  a. O operador deve desenvolver diretrizes e procedimentos de escala de tripulantes que

  claramente exijam o rastreamento de jornadas em operações na madrugada de início

  cedo, abrangendo períodos consecutivos de 168 horas. Esses procedimentos também

  devem identificar e rastrear as jornadas que se tornam operações na madrugada, naData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  WOCL (tripulação simples) ou em início cedo devido à reprogramação ou extensão.

  b. O operador deve adotar procedimentos e diretrizes para:

  i. gerenciar adequadamente os limites da escala em operações na madrugada, na

  WOCL (com tripulação simples) e em operações com início cedo;

  ii. identificar o potencial de uma operação na madrugada, na WOCL ou com início

  cedo limitar a futura atribuição de jornadas a um tripulante.

  c. Ao escalar tripulantes para uma jornada (mesmo que não seja na madrugada), o número

  de operações na madrugada realizadas no período de 168 horas em que ela irá ocorrer

  precisa ser considerado.'
