title: OBRIGAÇÕES DOS OPERADORES DO GRF
text: '6. OBRIGAÇÕES DOS OPERADORES DO GRF

  6.1 Introdução

  6.1.1. As seções 117.19 e 117.65 do RBAC nº 117 informam que os operadores que desejarem

  operar segundo o nível GRF possuem uma série de obrigações.

  6.1.2. A principal obrigação do operador é dar condições para que o tripulante se encontre
  apto

  para o trabalho, não permitindo que uma jornada seja realizada em situação que

  sabidamente leve à fadiga ou que um tripulante fatigado assuma uma jornada [117.19(a)].

  6.1.3. Os operadores do nível GRF têm obrigação de adotar procedimentos para os itens 6.2
  e 6.3

  desta IS.

  6.1.4. Os operadores que tiverem um Sistema de Gerenciamento de Segurança Operacional

  (SGSO) eficaz estarão familiarizados com esses processos e tal SGSO provavelmente será

  capaz de cumprir as obrigações de identificação de perigos e monitoramento contínuo.

  6.2 Obrigações referentes à seção 117.19

  6.2.1. Aptidão para o trabalho [117.19(a)]

  6.2.1.1. Conforme estipulado no parágrafo 117.19(a), nenhum operador pode requerer que um

  tripulante opere uma aeronave se, considerando as circunstâncias do voo a ser realizado,
  o

  operador tiver razões para acreditar que aquele tripulante esteja, ou provavelmente venha
  a

  estar, sob o efeito de fadiga que possa prejudicar o desempenho do tripulante de modo a

  afetar a segurança da operação. O operador pode chegar a esta conclusão a partir de estudos

  próprios (informação científica, experiência anterior, modelagem biomatemática, etc.) ou

  a partir de informações fornecidas pelos próprios tripulantes, seja por meio de uma simples

  declaração de “inaptidão para assumir o voo ou a jornada” ou um reporte mais detalhado

  (como o exemplo do Apêndice E desta IS).

  6.2.1.2. Os operadores devem adotar procedimentos para garantir a retirada do voo de tripulantes

  que se declarem inaptos para o voo por motivo de fadiga.

  6.2.2. Acomodações para repouso [117.3(b)(3)]

  6.2.2.1. Os operadores devem estar cientes da exigência de que os tripulantes tenham umaData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  oportunidade de sono antes de realizar uma jornada, um sobreaviso ou uma reserva. Para

  essa oportunidade de sono, o tripulante deve dispor acomodações adequadas para dormir,

  podendo ocorrer na residência do tripulante ou em outro local (por exemplo, um hotel).

  Nota: de acordo com o parágrafo 117.3(b)(3) do RBAC nº 117, é informado que na

  “base contratual de trabalho do tripulante, a moradia contempla os requisitos de

  acomodação para repouso”; deste modo, não é necessário que o operador gerencie as

  condições de repouso da moradia do tripulante.

  6.2.2.2. Os operadores deveriam considerar procedimentos que minimizem interrupções no sono

  dos tripulantes. Períodos de repouso devem incluir blocos definidos de tempo

  (oportunidades de sono), durante os quais os tripulantes não são contatados. Todo o pessoal

  relevante deve estar ciente dessas oportunidades de sono protegidas. Os operadores também

  devem desenvolver procedimentos para proteger o sono dos tripulantes nos lugares de

  pernoite.

  6.2.2.3. A ergonomia física das instalações para dormir e descansar deveria ser levada em
  conta, a

  fim de garantir que o pessoal possa obter uma recuperação adequada e estar apto para a

  próxima jornada. Sugere-se que os operadores considerem os fatores ergonômicos do

  trabalho, bem como as facilidades disponíveis nas instalações, ao gerenciar a fadiga nas

  operações.

  6.2.2.4. Os operadores devem considerar e gerenciar cuidadosamente como a localização da

  acomodação para repouso pode afetar a qualidade do sono. Ao considerar um local para

  acomodação, os operadores devem levar em conta os seguintes fatores para que se cumpra

  a oportunidade mínima de sono e o tempo hábil para necessidades fisiológicas:

  a. distância do deslocamento de / para o local de repouso ou descanso;

  b. opções de transporte (quanto menos opções, maior dependência de apenas um, o que

  demanda um plano alternativo em caso de problemas; avaliar locais com muito tráfego

  e engarrafamentos previsíveis que poderiam ser evitados);

  c. possíveis incômodos ou interrupções (por ex.: ruído exacerbado devido a obras nas

  proximidades, vias de alto tráfego, bares, locais de shows, eventos);

  d. possibilidade de realizar ligações telefônicas;

  e. limpeza das instalações;

  f. serviço de quarto;

  g. trabalho de manutenção nas instalações;

  h. controle de temperatura acessível e em pleno funcionamento;

  i. opções de compartilhamento de quartos (compartilhamento de quartos podem prejudicar

  o sono);

  j. controle de iluminação acessível e em pleno funcionamento;

  k. hábitos sociais (por exemplo, horários de refeições locais, horários de chegada / partida

  de outros hóspedes, etc.); eData de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  l. garantia da segurança pessoal nas instalações (chaves individuais, portaria, vigilância).

  6.2.2.5. Os operadores também deveriam considerar como o local de repouso pode interagir
  com

  diferentes horários. Um tripulante pode ser sensível a alterações horárias de 1 ou 2 horas,

  quando há diferença de horários de verão e/ou quando o repouso ocorre em outro fuso

  dentro ou fora do país. Assim, mesmo diferenças de um ou dois fusos horários podem:

  a. impactar os hábitos sociais relativos ao horário das refeições e dos horários de sono
  /

  despertar;

  b. exigir que o tripulante se ajuste à hora local; e

  c. exigir que o tripulante adiante seu relógio biológico.

  6.2.2.6. A diferença entre a necessidade de acordar às 05:00 horas ou 06:00 horas pode ser
  a

  diferença entre os efeitos da janela de baixa do alerta do ciclo circadiano (WOCL)

  impactando no desempenho ao longo do dia ou não.

  6.2.3. Fornecimento de refeições

  6.2.3.1. Uma alimentação adequada é parte do que se faz necessário para que os tripulantes
  possam

  se manter aptos para o trabalho durante uma viagem.

  6.2.3.2. A Lei nº 13.475, de 28 de agosto de 2017, ao mesmo tempo que em que traz matéria

  relacionada a segurança operacional - afetas às atribuições desta Agência -, também dispõe

  sobre matéria que não se dirige a esse fim - notadamente, os relacionados aos aspectos

  trabalhistas da relação que existe entre os aeronautas e seus empregadores. O cumprimento

  dos requisitos estabelecidos no RBAC nº 117 não afasta a necessidade do cumprimento dos

  demais dispositivos legais, o que inclui os artigos 61 a 64 da Lei nº 13.475/17, que tratam

  do direito à alimentação dos tripulantes em viagem.

  6.2.4. Conservação de registros [117.19(e)]

  6.2.4.1. O parágrafo 117.19(e) do RBAC nº 117 requer que o operador mantenha registros em

  relação às listas de membros da tripulação, tempos reais de serviço e tempos de voo

  (incluindo reportes de situações em que a jornada é estendida sob uma cláusula de

  “extensão”).

  6.2.4.2. Esses registros e reportes devem ser mantidos por cinco anos, como determinado
  pelo

  parágrafo 117.19(e)(2) do RBAC nº 117. Os operadores devem manter registros da duração

  de todos os períodos de serviço realizados por um tripulante, como qualquer tarefa que um

  tripulante tenha realizado para o operador (incluindo atividades de escritório).

  6.2.4.3. Quando for usada uma extensão que exceda limite aplicável do Apêndice E, devem
  ser

  cumpridos os requisitos dos parágrafos 117.19(e)(3) e A117.15(g), que incluem

  comunicação da extensão à Anac. Ademais, um reporte deve ser preenchido pela tripulação

  sempre que ela acreditar que houve fadiga (consulte o Apêndice E desta IS para exemplos

  de reportes de ocorrência de fadiga).

  6.2.5. Determinação da base contratual do tripulante [117.19(f)]

  6.2.5.1. É necessário que o operador determine e notifique cada um de seus tripulantes do
  seu

  aeroporto de base contratual.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  6.2.5.2. Os operadores devem garantir que as mudanças de base contratual não afetem

  adversamente a segurança das operações. É necessária uma análise cuidadosa das

  consequências dessa mudança para o tripulante e como isto poderá afetar o seu estado de

  alerta.

  6.2.5.3. As determinações da base contratual devem ser feitas com um alto grau de permanência,

  de modo a não interromper as rotinas de recuperação de fadiga do tripulante entre as

  jornadas.

  6.2.5.4. Este item não isenta o operador de observar os regramentos do direito trabalhista
  quanto à

  determinação da base contratual do tripulante.

  6.2.6. Elaboração e publicação de escalas [117.19(g)]

  6.2.6.1. É importante que os operadores publiquem a escala de serviço com antecedência suficiente

  para que seja comunicada a todos os tripulantes e permitir que eles organizem seu trabalho,

  sono e outros aspectos da vida pessoal. O parágrafo 117.19(g) do RBAC nº 117 informa

  que devem ser seguidos os requisitos mínimos da seção A117.9 do Apêndice A quanto à

  elaboração e divulgação das escalas de serviço.

  6.2.6.2. Para o operador privado aplica-se o previsto no parágrafo A117.9(d), o que inclui
  escala no

  mínimo semanal, divulgada com antecedência mínima de 2 (dois) dias.

  6.2.6.3. Recomenda-se, no entanto, que o período mínimo de notificação tenha a maior

  antecedência possível quando um tripulante for escalado para viagens que:

  a. envolverem operações com tripulação aumentada e em jornadas longas com tripulação

  simples, definidas em E117.7(c)(3);

  b. cruzarem três ou mais fusos horários;

  c. incluírem duas ou mais operações noturnas; ou

  d. incluírem jornadas interrompidas.

  6.2.6.4. Embora as alterações posteriores às escalas sejam compreensíveis, é importante
  que essas

  alterações sejam mínimas, ou seja, que a escala seja o mais estável possível.

  6.2.6.5. É importante haver procedimentos em vigor para que qualquer risco de fadiga resultante

  dos efeitos das mudanças na escala após publicação seja gerenciado. Isso é particularmente

  importante para operações com tripulação aumentada e o subsequente planejamento do

  descanso em voo, assim como para jornadas longas com tripulação simples.

  6.2.6.6. Para operações em que os tripulantes são empregados ocasionalmente, pode haver
  pouca

  oportunidade de notificar uma próxima jornada. Exceto se a jornada for bastante curta, um

  operador deveria ter procedimentos que envolvam a divulgação de uma jornada casual pelo

  menos um dia antes desta ocorrer. Esses procedimentos permitiriam que o tripulante, antes

  de aceitar a jornada, considere a sua aptidão para o trabalho e se será ou não capaz de

  garantir um repouso adequado antes. Como um guia, para uma jornada ser considerada

  bastante curta, não excederá 50% do limite de jornada de voo para o tipo de jornada

  aplicável. Além disso, se houver algum aumento no limite da jornada por meio do uso de

  tripulação aumentada, jornada interrompida ou reprogramação, o período de notificação

  precisará ser aumentado adequadamente.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  6.3 Obrigações referentes à seção 117.65

  O conjunto de políticas e procedimentos de um GRF - Gerenciamento de Risco de Fadiga,

  pode ser resumido na figura abaixo:

  Figura 1: Atividades do Gerenciamento de Risco da Fadiga (GRF)

  6.3.1. Treinamento [117.65(c), (d), (e), (f) e (g)]

  6.3.1.1. O operador deve realizar treinamento inicial e periódico dos tripulantes, abordando

  provisões relevantes sobre os riscos relacionados à fadiga nas suas atribuições, conforme

  currículo proposto no Apêndice A desta IS. [117.65(c)(1) e 117.65(d)]

  6.3.1.2. Para cumprir suas obrigações de treinamento, o operador deve:

  a. alocar recursos adequados para treinamento em fadiga (incluindo instrutores, recursos

  de instrução e tempo); e

  b. aceitar que os benefícios do treinamento em fadiga não serão realizados sem

  investimentos e esforços contínuos.

  6.3.1.3. Os operadores devem adaptar seus programas de treinamento para incluir tópicos
  relevantes

