title: PROCEDIMENTOS DE ACEITAÇÃO DE UM GRF SEGUNDO O APÊNDICE E
text: '9. PROCEDIMENTOS DE ACEITAÇÃO DE UM GRF SEGUNDO O APÊNDICE E

  DO RBAC nº 117

  9.1 Geral

  9.1.1. Cada operador de aviação geral operando exclusivamente segundo as regras do RBAC
  nº

  91, em operações sem fins lucrativos e com pilotos contratados a serviço do operador da

  aeronave que desejar ter aceita sua operação sob um GRF deve cumprir os requisitos

  contidos na Subparte A, na Subparte B, na Seção 117.65 e no Apêndice E do RBAC nº 117

  (vide Tabela 1: (*) Parte dos requisitos do Apêndice A permanece aplicável às operações

  sob Apêndice E, e mesmo sob um SGRF. Para as operações sob Apêndice E, ver Tabela

  E.1 na seção E117.1 para a definição de quais requisitos do Apêndice E substituem ou

  complementam requisitos específicos do Apêndice A).

  9.1.2. A aceitação para operar sob as regras do Apêndice E do RBAC nº 117 será realizada
  por

  meio de processo de cadastro e autorização.

  9.2 Solicitação de cadastro e autorização para operar sob o Apêndice E

  9.2.1. Operadores que desejem conduzir operações sob as regras do GRF previsto no Apêndice
  EData de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  e Seção 117.65 do RBAC nº 117 devem solicitar autorização prévia para operar sob esse

  conjunto de regras.

  9.2.2. Podem submeter a solicitação de autorização, além do próprio operador, seus

  representantes legais e procuradores especiais.

  9.2.2.1. A adequada condução do processo depende da efetividade da comunicação entre a Anac
  e

  o interessado. Portanto, é importante que o interessado realize e mantenha atualizado seu

  cadastro no protocolo eletrônico da Anac, bem como as indicações dos representantes

  legais e procuradores especiais no sistema SEI.

  9.2.2.2. As comunicações oficiais acerca do processo serão encaminhadas, por meio eletrônico
  no

  sistema SEI, para os representantes legais ou procuradores cadastrados para o CNPJ ou

  CPF do operador interessado.

  9.2.2.3. O processo eletrônico da Anac está previsto na Resolução nº 520/2019 e maiores

  informações podem ser consultadas no seguinte endereço: https://www.gov.br/anac/pt-

  br/sistemas/protocolo-eletronico-sei.

  9.2.2.4. Todas as comunicações, interações e documentos necessários ao processo somente
  serão

  aceitos se realizados pelas pessoas legalmente designadas pelo interessado.

  9.2.2.5. São consideradas pessoas legalmente designadas pelo interessado o gestor responsável,
  os

  procuradores cadastrados no SEI como procuradores especiais ou pessoas legalmente

  constituídas, que apresentem procuração, contrato de trabalho ou prestação de serviços ou

  outro documento que comprove a legalidade e efetividade da representação.

  9.2.3. Uma solicitação de cadastro e autorização junto à Anac para operar um operador atuar
  sob

  as regras do Apêndice E do RBAC nº 117 deve ser feita por meio do envio dos seguintes

  documentos:

  a. formulário de cadastro para operações sob as regras do Apêndice E do RBAC nº 117,

  em modelo eletrônico disponível no sistema SEI;

  b. declaração simples, pelo operador, referindo: sua aderência às regras de aptidão para
  o

  trabalho, sua responsabilidade na adoção das medidas aplicáveis de gerenciamento de

  fadiga e de risco de fadiga, incluindo a realização de treinamento para os tripulantes,
  e

  sua aderência aos princípios de uma cultura justa;

  c. documento que evidencie o endereço designado como sede do operador ou sua

  residência fixa, em que seja possível identificar vínculo com a pessoa física ou jurídica

  requerente. Para comprovar endereço, são aceitos: contrato de locação de imóvel em

  vigor, contas de consumo (como água, luz, telefone, gás, celular, internet, etc.), IPTU,

  ITR, boleto de condomínio, correspondência originária de instituições financeiras

  (públicas ou privadas,) ou órgãos públicos e correspondência postada e enviada pelos

  Correios;

  d. procuração ou outro instrumento de mandato, caso necessário, de acordo com o item'
