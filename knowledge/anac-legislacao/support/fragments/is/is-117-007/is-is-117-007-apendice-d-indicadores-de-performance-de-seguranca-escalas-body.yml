title: APÊNDICE D. INDICADORES DE PERFORMANCE DE SEGURANÇA - ESCALAS
text: 'APÊNDICE D. INDICADORES DE PERFORMANCE DE SEGURANÇA - ESCALAS

  SUBJETIVAS

  D.1.1. Usando-se procedimentos de gerenciamento de risco e de garantia da segurança

  operacional podem ser coletados dados sobre a fadiga dos membros da equipe de voo,

  seja por meio do sistema de relatórios de segurança do operador, por de relatórios de

  fadiga (por exemplo, relatórios de perigo e relatórios de incidentes/acidentes). A partir

  desses relatórios, tendências podem ser monitoradas na forma de Safety Performance

  Indicators (SPIs) relacionados à fadiga, como:

  D.1.1.1. Número e severidade dos relatórios de fadiga.

  D.1.1.2. Número de incidentes relacionados à fadiga.

  D.1.1.3. Números de voos ou jornadas não realizados devido a fadiga.

  D.1.2. SPIs baseados em dados de fadiga coletados

  D.1.2.1. Relatórios de fadiga podem fornecer dados sobre histórico de sono e níveis de fadiga
  por

  autorrelato, usando escalas subjetivas de fadiga e sonolência. Se o operador tiver

  preocupações específicas sobre o nível de risco de fadiga associado a um aspecto de um

  cronograma ou rota, essas medidas podem ser usadas para coletar dados em momentos

  específicos durante um período de trabalho.

  D.1.2.2. SPIs que podem ser gerados e monitorados usando essas medidas são apresentados
  na

  tabela a seguir:

  Medida / Indicador SPIs (um voo por jornada*)

  Histórico de sono e vigília monitorados

  através de diários de sono

  1) Sono nas últimas 24h antes do início de uma

  jornada

  2) Tempo acordado no início da jornada

  3) Sono nas últimas 24h antes do top of descent

  (TOD) (incluindo sono a bordo para

  tripulações aumentadas)

  4) Tempo acordado no TOD

  Fadiga subjetiva, conforme escala de Samn-

  Perelli

  1) Avaliação de fadiga pré-voo

  2) Avaliação de fadiga no TOD

  Sonolência subjetiva, conforme escala

  Karolinska

  1) Avaliação de sonolência pré-voo

  2) Avaliação de sonolência no TOD

  (*) Observação: para jornadas que envolvam vários segmentos de voo, pode ser apropriado
  medir

  SPIs no início e no final da jornada, uma vez que os membros da tripulação podem não ter
  tempo

  suficiente para avaliar sua fadiga e sonolência antes do TOD (top of descent) em voos curtos.
  Também

  pode ser apropriado ter SPIs relacionados à carga de trabalho (por exemplo: número de etapas
  de voo)

  em operações com várias etapas.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A'
