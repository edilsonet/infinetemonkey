title: Apêndice E do RBAC nº 117.
text: 'Apêndice E do RBAC nº 117.

  6.4.4.2. Aumentar a tripulação é uma estratégia que os operadores podem utilizar para auxiliar
  no

  gerenciamento do estado de alerta da tripulação. Com os procedimentos apropriados e

  instalações adequadas de descanso a bordo, a tripulação pode se revezar nos períodos de

  descanso durante o voo e utilizar as instalações para gerenciar seu estado de alerta e mitigar

  os efeitos da fadiga.

  6.4.4.3. Na definição dos procedimentos para descanso a bordo, o operador deve considerar
  os

  efeitos da inércia do sono. A inércia do sono afeta a atenção e o desempenho é reduzido,

  por isso, ela deve ser incluída como um período de inatividade operacional do tripulante

  após o sono. Normalmente, 15 minutos se mostram suficientes para que a pessoa se sinta

  funcional novamente; entretanto, este tempo pode ser maior dependendo de características

  pessoais e situacionais.

  6.4.4.4. Os tripulantes têm diferentes necessidades de sono e diferentes efeitos de desempenho
  de

  contramedidas (por exemplo, uso de cafeína), cada um dos quais deve ser levado em

  consideração. A tripulação adicional ainda ficará fatigada mesmo quando não estiver em

  uma função operacional. Os operadores precisam garantir que os tripulantes recebam

  treinamento sobre o uso apropriado de tripulações aumentadas e instalações de descanso a

  bordo.

  6.4.4.5. Os limites aumentados da tripulação constantes da seção E117.13 do Apêndice E do
  RBAC

  nº 117 somente podem ser utilizados se for provida uma acomodação adequada, fora da

  cabine de comando para o descanso a bordo da tripulação, na quantidade estabelecida na

  seção A 117.11 do Apêndice A do RBAC nº 117. Embora não se tenha estabelecido a

  obrigação, no RBAC nº 117, para que essas acomodações atendam às classes de

  acomodação definidas no parágrafo 117.3(b)(1) do RBAC nº 117, essas acomodações

  devem atender aos seguintes critérios para serem consideradas adequadas:

  a. reclinação de 40º ou mais com relação à vertical; e

  b. suporte para as pernas e pés na posição reclinada.

  6.4.4.6. Ao determinar as especificações apropriadas das instalações de descanso a bordo
  das

  aeronaves, os seguintes fatores adicionais deveriam ser levados em consideração:

  a. alívio das restrições posturais do trabalho (por exemplo, períodos prolongados sentados

  e afivelados a um assento);Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  b. ruído e perturbação (no sentido de evitá-lo ao máximo). Se possível, com uso de cortina

  para isolamento;

  c. configurações físicas das próprias instalações (no sentido de que as instalações sejam

  amplas o suficiente para acomodar os tripulantes com conforto, possibilitando que ele

  possa se sentar e se virar para poder “dormir de lado”, e que tenha comprimento o

  suficiente para que seus pés não fiquem acomodados de forma desconfortável, isto é,

  flexionados);

  d. distância/separação entre assentos, de forma a proporcionar espaço suficiente ao

  tripulante;

  e. localização dos locais de descanso (por exemplo: um local muito próximo aos lavatórios

  e galleys pode dificultar o descanso dos tripulantes devido ao ruído e falta de

  privacidade);

  f. necessidades de privacidade (idem acima). Se possível, com uso de cortina para

  isolamento;

  g. iluminação (no sentido de ser controlável pelo tripulante em descanso, possibilitando

  total escuridão). Se possível, com uso de cortina para isolamento;

  h. vibração (no sentido de evitá-lo ao máximo);

  i. microclima (fluxo de ar, ventilação, temperatura, gradiente de temperatura, umidade);

  j. higiene (evitar patógenos, proteção);

  k. procedimentos para garantia da comunicação entre os tripulantes (por exemplo:

  existência de um interfone no local de descanso);

  l. mecanismos de se afivelar aos assentos (por exemplo: os cintos devem ser aprovados

  pela gerência de certificação da aeronave da Anac);

  m. condições de acesso (por exemplo: as condições de acesso devem ser aprovadas pela

  gerência de certificação da aeronave da Anac);

  n. procedimentos de evacuação (por exemplo: os procedimentos de evacuação devem ser

  aprovados pela gerência de certificação da aeronave da Anac); e

  o. requisitos de equipamentos de emergência disponíveis nas instalações (por exemplo: os

  requisitos de equipamentos de emergência disponíveis nas instalações devem ser

  aprovados pela gerência de certificação da aeronave da Anac).

  6.4.4.7. Além do informado nos itens anteriores, os operadores do Apêndice E do RBAC nº
  117

  devem estar atentos aos tópicos abaixo.

  a. Para os pilotos que realizarão o pouso, sugere-se que o descanso a bordo ocorra na

  segunda metade da jornada, ou seja, mais próximo ao momento do pouso. Entretanto,

  dependendo das necessidades pessoais, horários de decolagem e pouso previstos e outras

  circunstâncias, os momentos apropriados poderão variar, de modo que o operador

  preveja que a própria tripulação tenha autonomia para rearranjá-los.Data de emissão: 29
  de outubro de 2024 IS nº 117-007

  Revisão A

  b. Se possível, o número de etapas para tripulações compostas e de revezamento deve ser

  limitado a uma ou duas, de modo que uma operação desse tipo seja realizada apenas em

  jornadas com duração suficientemente longas para permitir descansar ou dormir.

  6.4.4.8. Procedimentos a serem adotados.

  a. Se um operador optar por realizar operações com tripulação composta ou de

  revezamento e a fim de obter um aumento na jornada de trabalho, os limites destas

  operações não devem exceder os limites estabelecidos na seção 117.13 do Apêndice E

  do RBAC nº 117.

  b. As operações com tripulação composta ou de revezamento não apresentam limites

  globais de tempo de voo, mas sim de tempo individual de voo na cabine (para cada

  tripulante). Tempo individual de voo na cabine é o tempo total que um tripulante de voo

  passa na cabine de comando durante uma jornada. Basta o tripulante estar dentro da

  cabine de comando para contar para o “flight deck duty time” (independentemente de ele

  estar ou não em um assento de pilotagem).

  c. Os procedimentos devem assegurar que a jornada, o tempo individual de voo na cabine

  e o descanso a bordo de cada tripulante durante o voo cumpram o estabelecido no

  parágrafo E117.13(a). Como guia, os limites máximos de tempo individual de voo na

  cabine assumem que o tempo de descanso / sono disponível (fase de cruzeiro) seja

  totalmente utilizado e distribuído de forma balanceada, isto é, razoavelmente uniforme,

  entre os pilotos. Para isto, deve haver também uma distribuição balanceada do tempo

  individual de voo na cabine entre os pilotos. Portanto, os procedimentos devem refletir

  essa meta de utilizar plenamente os períodos de voo disponíveis para obter descanso em

  voo. É também por esse motivo que o número de etapas deve ser limitado para uma

  operação com tripulação composta e de revezamento, garantindo assim que as jornadas

  contenham etapas mais longas, que permitam tempo adequado para descanso / sono.

  d. Procedimentos para a designação de tripulantes para uma tripulação composta ou de

  revezamento devem prever que a tripulação que inicie e termine a jornada seja a mesma.

  Importante

  Por razões de segurança, esta é uma condição crítica. Se, por exemplo, uma

  emergência médica exigisse o desembarque de um tripulante durante a jornada de

  trabalho, para que o voo continuasse, todos os tripulantes deveriam ser substituídos

  por uma nova tripulação, iniciando uma nova jornada de trabalho.

  Considera-se que o gerenciamento de diferentes limites da jornada de trabalho e

  duração do tempo de serviço e de voo, bem como a alocação de descanso durante o

  voo, para cada tripulante é potencialmente muito difícil para uma tripulação e, em

  particular, para o piloto em comando gerenciar com segurança. Dada a provável

  pressão para realizar o voo, ter um ou mais membros da tripulação com um nível de

  fadiga significativamente diferente poderia criar disparidades entre os tripulantes (por

  exemplo, na decisão sobre extensões de jornada).

  As extensões devem ser uma decisão que considere o nível de fadiga de cada tripulante

  de forma independente; no entanto, quando apenas um tripulante suportaria a

  extensão, os outros membros da equipe podem não apoiar a decisão de estender a

  jornada.

  Além disso, um mitigador de fadiga para uma tripulação é a suposição de que, se um

  tripulante está fatigado em um determinado grau, os demais provavelmente também oData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  estão. Quando um membro da equipe identifica que está cansado, ele deve discutir /

  gerenciar tal ponto com seus colegas e / ou começar a monitorar o restante da

  tripulação mais de perto.

  Se uma tripulação inclui pessoas com jornadas de trabalho significativamente

  diferentes, entender quando cada um está fatigado torna-se muito mais difícil e menos

  provável de ser gerido de forma eficaz.

  e. Para empregar tripulações compostas e de revezamento, o operador deve adotar os

  procedimentos para tais tipos de tripulação, os quais devem incluir:

  i. a designação de um piloto responsável por tomar decisões de comando em todos os

  momentos em que o piloto-em-comando (PIC) estiver utilizando descanso em voo;

  ii. um procedimento para um briefing abrangente antes dos tripulantes se revezarem

  durante o voo;

  iii. um método para tratar o descanso a bordo de forma que seja possível priorizar

  eventual necessidade de otimização dos níveis de experiência da tripulação na

  cabine de comando para o gerenciamento de ameaças operacionais planejadas e não

  planejadas;

  iv. designação de um tripulante responsável por agendar o descanso da tripulação em

  voo e reavaliar os horários de descanso da tripulação (em caso de circunstâncias

  operacionais imprevistas, especialmente desvios em voo ou retorno de voo);

  v. gestão dos possíveis efeitos da inércia do sono no desempenho ao despertar do sono

  profundo; e

  vi. procedimentos que assegurem que outros membros da tripulação estejam cientes da

  necessidade de respeitar o requisito de repouso em voo, evitando interrompê-lo e

  reduzindo o ruído desnecessário que pode perturbar o sono dos tripulantes que estão

  no período de descanso a bordo.

  6.4.4.9. O repouso e repouso adicional mínimos após jornadas com tripulações compostas e
  de

  revezamento são tratados no item 6.4.9 desta IS.

  6.4.5. Atraso no horário de apresentação e cancelamento [E117.15]

  6.4.5.1. Atraso na apresentação.

  a. A seção E117.15 contém requisitos sobre atrasos no horário de apresentação do

  tripulante. Atrasar o horário de apresentação pode resultar em períodos prolongados de

  vigília que, se não forem adequadamente gerenciados, possuem o potencial de causar

  impacto no risco de fadiga. Se o operador, no período anterior ao início de uma jornada,

  tomar conhecimento de circunstâncias que levem a um atraso no horário de apresentação

  do tripulante escalado para essa jornada, então é razoável que o horário de apresentação

  do tripulante seja atrasado. O objetivo é manter o tripulante informado sobre o horário

  previsto para o início da jornada, evitando assim que ele se canse desnecessariamente

  iniciando a sua jornada antes do que é necessário.

  b. Para atrasos de até três horas, o início da jornada ocorrerá quando o tripulante se

  apresentar para a jornada, conforme o novo horário estabelecido. Caso possível, oData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  tripulante deveria receber a comunicação desse atraso enquanto ainda não deixou seu

  local de repouso.

  Exemplo:

  Uma jornada está programada para se iniciar às 11:00. Um atraso de 2 horas na

  programação foi comunicado ao tripulante às 09:30. Como ele não havia deixado seu

  hotel, pode descansar um pouco mais antes de dirigir-se ao aeroporto para se

  apresentar às 13:00, o novo horário de início da jornada.

  c. O RBAC estipula que, para um atraso superior a três horas no horário de apresentação,

  desde que o tripulante seja informado desse atraso antes que deixe seu local de repouso,

  seja na base ou fora dela, a jornada pode ser considerada como tendo início três horas

  após o horário de apresentação original. A critério do operador, o período de antecipação

  para a informação pode ser aumentado (por exemplo, para meia ou uma hora antes do

  horário previsto para que o tripulante deixe seu local de repouso).

  Exemplo:

  Uma jornada está programada para se iniciar às 11:00. Um atraso de 5 horas na

  programação foi comunicado ao tripulante às 09:30. Como ele não havia deixado seu

  hotel quando recebeu a comunicação, ao iniciar sua jornada às 16:00, considera-se o

  início da jornada como tendo ocorrido às 14:00, três horas após a previsão original.

  d. Se um tripulante não for informado de um atraso de acordo com o item 6.4.5.1.c, a

  jornada desse tripulante deve ser considerada como iniciada no horário de apresentação

  inicial.

  Exemplo:

  Uma jornada está programada para se iniciar às 11:00. Um atraso de 5 horas foi

  comunicado ao tripulante às 10:00, mas ele já havia deixado seu local de repouso.

  Nesta situação, o horário da apresentação original se mantém, sendo a jornada

  considerada iniciada às 11:00.

  e. Se uma jornada for atrasada e o tripulante informado antes do repouso anterior à referida

  jornada, consideram-se os limites de jornada normalmente aplicáveis para esta jornada

  (tanto para tripulações simples, quanto aumentadas).

  f. Dependendo da duração do atraso, pode haver um aumento no risco de fadiga que pode

  afetar a segurança de um voo após esse atraso. O operador deve ter procedimentos que

  atendam a essa situação e garantir que existam salvaguardas para mitigar qualquer

  aumento de risco.

  g. Para atrasos de até 3 horas, a suposição é que o tripulante pode ser capaz de descansar;

  no entanto, é improvável que consiga voltar a dormir. Para atrasos maiores do que 3

  horas, a jornada pode ser considerada como começando 3 horas após o horário original

  de apresentação, independente da duração total do atraso. Esta limitação reflete a

  expectativa de que o tripulante já tenha completado 8 horas de sono e eventualmente

  também não consiga voltar a dormir durante o período de atraso. Ainda que nesta

  situação possa descansar, o tripulante provavelmente estará acordado por um período

  significativo antes de iniciar a jornada de trabalho atrasada.Data de emissão: 29 de outubro
  de 2024 IS nº 117-007

  Revisão A

  h. Observar que, no uso de tripulações simples, o horário de apresentação com atraso pode

  resultar em um limite de jornada máximo mais baixo caso o atraso resulte em um horário

  de início que faça a jornada máxima invadir a WOCL. Neste caso, o limite de jornada

  menor, correspondente ao da jornada na WOCL se tornará o novo limite máximo da

  jornada.

  i. Deve-se levar em conta que oportunidades de sono durante o dia são mais difíceis de

  serem aproveitadas para dormir, de forma que, mesmo tendo a disponibilidade de tempo,

  a alta probabilidade de o tripulante não conseguir dormir, ou dormir por pouco tempo,

  afetará o estado de alerta dele posteriormente. Desta forma, há de se observar a duração

  da jornada posterior ao atraso e buscar formas de diminui-la sempre que possível. Buscar

  outros tripulantes que estejam numa situação mais estável (por exemplo, mais

  descansados) também é uma opção.

  j. Os requisitos de atraso no horário de apresentação devem ser atendidos para permitir

  que o horário de início da jornada seja atrasado. Como em outros limites do RBAC nº

  117, deve haver procedimentos quanto ao processo pelo qual os horários de apresentação

  são atrasados de acordo com as limitações.

  k. O objetivo a ser buscado nos procedimentos de comunicação de atraso do horário de

  apresentação, é evitar que o tripulante deixe o local onde está em repouso. Uma boa

  prática seria a de informar o atraso pelo menos 30 minutos antes do horário previsto de

  saída do local de repouso.

  l. Conforme E117.15(b) o tempo de atraso deve ser considerado como sendo sobreaviso,

  quer ele cumpra ou não os requisitos de sobreaviso. Isto é, ainda que este não seja um

  sobreaviso previsto em escala semanal divulgada com antecedência mínima de 2 dias,

  como previsto no parágrafo A117.9(d)(1), considera-se o tempo de atraso como de

  sobreaviso.

  m. Neste caso, aplica-se ainda o previsto em E117.19(a)(4), quanto a um tripulante

  compondo tripulação simples: se for acionado durante um sobreaviso (tempo de atraso

  deve ser considerado como sendo sobreaviso), a soma do limite máximo de jornada ao

  tempo de sobreaviso não pode ultrapassar 16 horas.

  6.4.5.2. Cancelamento da jornada [E117.15(d)].

  a. Um cancelamento ocorre quando a jornada do tripulante é atrasada conforme o item

  6.4.5.1.a acima e o operador informa ao tripulante que o voo não ocorrerá.

  b. Nesta situação o tripulante deve ter um período de repouso de pelo menos 10 horas

  consecutivas, a partir do momento em que ele é informado do cancelamento, antes de

  novamente receber uma jornada, de acordo com o Apêndice E do RBAC nº 117.

  c. O tripulante tem a obrigação de usar o seu repouso precedente e o período anterior de

  oportunidade de sono para estar suficientemente descansado e alerta para desempenhar

  suas funções com segurança na jornada de trabalho.

  d. O tripulante deve ser avisado sobre o cancelamento antes do último horário de

  apresentação válido (isto é, o horário de apresentação original ou o horário de

  apresentação informado de acordo com o item 6.4.5.1.a).

  e. Caso o tripulante não seja avisado de um cancelamento até o último horário deData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  apresentação válido, a jornada deve ser considerada como iniciada nesse horário.

  6.4.5.3. Procedimentos a serem adotados.

  a. Atrasos:

  i. Uma jornada é considerada atrasada se o seu início for postergado em relação ao

  horário originalmente previsto. O tempo de atraso é contado a partir deste horário

  até o novo horário de apresentação.

  ii. O operador deve prever procedimentos para atrasos de até 3 horas, situação na qual

  o início da jornada ocorrerá quando o tripulante se apresentar para a jornada,

  conforme o novo horário estabelecido.

  iii. O operador deve prever procedimentos para atrasos de mais de 3 horas, em que o

  tempo entre o horário de apresentação original e o horário de apresentação atrasado

  é considerado como sobreaviso, quer ele cumpra ou não os requisitos de sobreaviso.

  Nestes casos, o início da jornada após o atraso deve ser fixado em 3 (três) horas

  após o horário de apresentação inicial, mesmo que o atraso seja superior a 3 horas.

  iv. O operador deve prever procedimentos para controlar e impedir que, em tripulação

  simples, a soma do limite máximo de jornada ao tempo de atraso (sobreaviso)

  ultrapasse 16 horas.

  v. Quanto à contagem do tempo de atraso pode-se, por exemplo, inicialmente

  comunicar um atraso de 2 horas e, em seguida, atrasar o tempo de início em mais

  1,5 horas. Para os fins de determinar a jornada de trabalho máxima, isto representa

  um atraso total de 3,5 horas e deve ser tratado como um atraso de três horas e meia,

  em vez de dois atrasos cada um com menos de 3 horas.

  vi. O operador deve estabelecer antecipadamente a maneira pela qual os tripulantes

  serão notificados do atraso antes de deixar sua acomodação.

  vii. Os operadores também devem prever procedimentos para gerenciar o risco de

  fadiga quando a notificação da decisão de atraso estiver no limite do atendimento

  aos requisitos mínimos estabelecidos.

  Exemplo:

  Em vez de telefonar diretamente para o tripulante, exemplos de condutas que gerenciam a

  notificação e protegem a oportunidade anterior de sono incluem:

  • Propor que o tripulante entre em contato com o operador após o despertar; ou

  • Organizar um sistema em que os funcionários do hotel atrasem a chamada de despertar

  solicitada e coloque uma mensagem sob a porta do quarto do tripulante.

  Exemplo de procedimento:

  • Todas as comunicações entre o operador e um tripulante durante um repouso ou que

  possam afetar a oportunidade de sono do tripulante devem estar de acordo com o seguinte

  protocolo de comunicação:

  ✓ Um tripulante só deve ser contatado durante a sua oportunidade de sono se houver

  um atraso no horário de início da jornada de trabalho e somente por mensagem de

  texto;Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  ✓ O tripulante deve garantir que seu celular fique "silencioso" durante os períodos de

  oportunidade do sono para, da melhor forma possível, garantir um sono reparador

  ininterrupto;

  ✓ O tripulante deve verificar suas mensagens e respondê-las antes de deixar a

  acomodação;

  ✓ Uma mensagem enviada e que apareça como entregue é considerada uma notificação,

  no entanto, o tripulante ainda deve respondê-la antes de deixar acomodação para

  confirmar que entendeu a mensagem (fechar a comunicação); e

  ✓ O horário e o conteúdo das mensagens (e chamadas telefônicas) referentes a atrasos

  serão registrados no sistema apropriado do operador.

  b. Cancelamentos.

  i. O parágrafo E117.15(d) estabelece os requisitos mínimos de repouso quando um

  operador cancela a próxima jornada de trabalho.

  ii. Se a notificação de cancelamento não atender ao requisito de notificação do item

  6.4.5.2.d desta IS, para fins de determinação do repouso mínimo a jornada de

  trabalho é considerada como tendo sido iniciada:

  A. na hora de início original; ou

  B. no último horário de apresentação com atraso que foi notificado.

  iii. Nesta situação, o repouso mínimo requerido deve ser baseado na duração da jornada

  contada a partir do momento acima indicado e finalizada no momento que cessarem

  todos os deveres do tripulante para com o operador.

  6.4.6. Reprogramação e extensão de jornada de trabalho [E117.17]

  6.4.6.1. Tanto na reprogramação como na extensão de jornadas exige-se que o operador, além
  de

  avaliar independentemente o risco de fadiga associado à reprogramação ou extensão

  proposta, confirme junto aos tripulantes se eles se consideram aptos a realizar a jornada

  modificada.

  6.4.6.2. Embora os tripulantes continuem a ser a última linha de defesa, a realidade é que
  nem

  sempre estão em boas condições para avaliar ou mitigar adequadamente o aumento do risco

  de fadiga, especialmente se eles próprios estiverem com altos níveis de fadiga ou altos

  níveis de pressão para concluir uma jornada.

  6.4.6.3. Reprogramação da jornada de trabalho [E117.17(a)).

  a. Esta seção se refere aos limites para a reprogramação de uma jornada de trabalho, uma

  vez que tenha sido iniciada.

  i. A reprogramação que resulta no aumento de uma jornada deve, ainda assim,

  permanecer dentro dos limites de jornada e tempo de voo aplicáveis, considerando

  o mesmo horário de apresentação.

  ii. Cada tripulante deve considerar-se apto para a jornada modificada, declarando tal

  em formulário apropriado, a ser disponibilizado pelo operador.

  b. Uma jornada reprogramada pode, posteriormente, ser estendida de acordo com osData de
  emissão: 29 de outubro de 2024 IS nº 117-007

