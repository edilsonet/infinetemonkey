  6.4.8. Posicionamento [E117.21]

  6.4.8.1. Quando as necessidades operacionais de uma viagem excederem os requisitos aplicáveis,

  o posicionamento de outra tripulação em local apropriado ao longo da rota é uma estratégia

  que pode ser usada. O posicionamento pode ser planejado ainda para permitir maior

  tolerância a contingências de viagem.

  6.4.8.2. Posicionamento, conforme definição em 117.3(t)-I, significa, para um tripulante,
  ser

  transportado, como tripulante extra a serviço, a uma localidade definida pelo operador,
  e:

  a. não inclui ser transportado de ou para acomodação para repouso, antes ou após uma

  jornada;

  b. se realizado imediatamente antes de uma jornada que inclua um voo como tripulante

  deve ser considerado como parte da jornada, mas não como parte do tempo de voo;

  c. se realizado imediatamente após uma jornada que inclua um ou mais voos como

  tripulante não deve ser considerado como parte da jornada para efeito dos limites de

  jornada e tempo de voo previstos nas seções E117.7 e E117.13 e nem deve ser

  considerado como parte do repouso previsto na seção E117.23; e

  d. deve ser considerado como parte da jornada para efeito de cálculo do período de repouso

  posterior à jornada, de folga e do limite de trabalho acumulado.

  6.4.8.3. O operador pode determinar, antes do início ou após a conclusão das tarefas de
  voo

  atribuídas a um tripulante em uma jornada, que o tripulante se posicione em local adequado

  definido pelo operador.

  6.4.8.4. Procedimentos a serem adotados.

  a. O operador deve adotar procedimentos para posicionamentos, garantindo que:

  i. se realizado imediatamente antes de uma jornada que inclua um voo como tripulante

  deve ser considerada como parte da jornada, mas não como parte do tempo de voo;

  ii. se realizado imediatamente após uma jornada que inclua um ou mais voos como

  tripulante não deve ser considerado como parte da jornada para efeito dos limites

  de jornada e tempo de voo previstos nas seções E117.7 e E117.13 e nem deve ser

  considerado como parte do repouso previsto na seção E117.23; eData de emissão: 29 de outubro
  de 2024 IS nº 117-007

  Revisão A

  iii. o tempo dispendido no posicionamento pelo tripulante deve ser considerado como

  de jornada de trabalho para fins de determinação dos períodos de repouso, de folga

  e para o limite de trabalho acumulado, conforme previsões das seções E117.23 e

  E117.27.

  6.4.9. Períodos de repouso após jornada e de folga periódica [E117.23]

  6.4.9.1. É essencial que o operador e o tripulante compartilhem o conceito de que o repouso
  é um

  período livre de todos os deveres e serviços associados ao trabalho. Isso significa que
  o

  tripulante não pode simplesmente ser incumbido de tarefas de solo durante seus períodos

  de repouso mínimo obrigatórios e não pode ser escalado para outra jornada de trabalho até

  que os requisitos mínimos de repouso tenham sido atendidos.

  6.4.9.2. Com base na função que o repouso desempenha, existem três grandes categorias de

  requisitos para repouso após uma jornada (ver item 6.4.1.6 desta IS para requisitos de

  repouso antes de uma jornada longa):

  a. aqueles que abordam a fadiga aguda (isto é, a exigência de um repouso após uma

  jornada), como previstos nos parágrafos E117.23(a)(1), E117.23(a)(2) e E117.23(a)(3);

  b. aqueles que abordam a fadiga acumulada (isto é, a exigência de folgas e repousos

  adicionais, enquanto períodos livres de atividades, como previstos na seção A117.25, e

  nos parágrafos E117.23(a)(4) e E117.23 (a)(5), incluindo os subparágrafos e a Nota da

  seção E117.23;

  c. aquelas que abordam a fadiga relacionada ao cruzamento de fusos horários.

  6.4.9.3. Abordando a fadiga aguda.

  a. O operador, além obedecer aos requisitos referidos acima em 6.4.9.2(a), deve ter em

  mente que os períodos de repouso atribuídos devem ser longos o suficiente para

  fornecer:

  i. a oportunidade de sono exigida (8 horas);

  ii. tempo para atender as necessidades fisiológicas e preparação do tripulante (mínimo

  de 2 horas); e

  iii. tempo suficiente para o transporte de e para o local de repouso.

  Exemplo:

  Se o tempo de deslocamento entre o aeroporto e o hotel em um determinado local for

  de 15 minutos, o operador deve garantir que o repouso permita:

  • Deslocar-se de e para a acomodação para repouso (neste caso, 30 minutos no

  total);

  • Um período suficiente para se alimentar, comer, beber, ir ao banheiro, lavar-se e

  vestir-se (2 horas podem ser apropriados); e

  • A oportunidade mínima de sono exigida (8 horas).

  Em geral, os requisitos de repouso mínimo preveem tempo suficiente para garantir a

  oportunidade de sono, os deslocamentos e a preparação do tripulante. Entretanto,

  haverá casos em que serão necessários períodos mais longos de repouso, como quandoData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  o tempo de deslocamento for maior, quando houver períodos estendidos de check-in

  ou check-out do hotel ou desembaraço aduaneiro, por exemplo.

  6.4.9.4. Abordando a fadiga acumulada.

  a. Devem ser seguidos os requisitos de folga e repouso adicional previstos nos parágrafos

  E117.23(a)(4) e E117.23(a)(5) do RBAC nº 117.

  b. Uma consideração importante é que, para iniciar uma jornada, um tripulante deve manter

  o atendimento aos requisitos mesmo ao final desta mesma jornada.

  c. Isso significa que um operador deve estar constantemente levando em consideração o

  histórico do tripulante para determinar se ele pode ser designado para uma jornada.

  d. O tripulante deve obter, ao longo do mês, o número mínimo de folgas previstos. Para os

  operadores privados o mínimo de folgas mensais é fixado em 8 (oito) folgas, das quais

  ao menos 2 (duas) deverão compreender um sábado e um domingo consecutivos,

  conforme A117.25(f).

  e. Adicionalmente, deve ser observado o requisito em E117.23(c) que refere que um

  tripulante retornando de uma folga de 24 horas para assumir uma jornada só poderá fazê-

  lo se a jornada se iniciar a partir das 10h00, observado ainda o previsto em E117.5 quanto

  a oportunidade de sono e de repouso anterior à jornada, sobreaviso ou reserva.

  f. Os requisitos de período livre de atividades previstos nos parágrafos E117.23(a)(4) e

  E117.23(a)(5) devem ser usados também durante a viagem, quando esta se estende para

  além de 6 dias (144 horas), neste caso caracterizando o repouso adicional.

  g. Uma exceção à obrigação de aplicação de um período de repouso adicional, em viagem,

  até o final de cada série de jornadas dá-se após voos internacionais realizados naquela

  série de jornadas. Nesta situação, conforme A117.25(c), o operador poderá ampliar a

  duração máxima de uma série de jornadas em até 36 horas (totalizando um máximo de

  180 horas de duração para a série de jornadas). Desta forma, pode conceder uma folga

  (ao invés do repouso adicional iniciando-se até 144 horas do início da série de jornadas),

  já de volta à base, neste caso começando esta folga até 180 horas do início da série de

  jornadas.

  h. A folga a ser aplicada conforme o item anterior deve ter a mesma duração mínima que

  seria a prevista para o repouso adicional caso ele tivesse sido concedido.

  i. Quando houver utilização da previsão em A117.25(c), isto é, aplicação de folga até 180

  horas do início da série de jornadas ao invés de repouso adicional até 144 horas do início

  da série de jornadas, o operador deve conceder ao tripulante mais 2 (dois) períodos de

  folga no mesmo mês em que o voo for realizado, além das folgas mensais mínimas

  previstas, totalizando um mínimo de 10 folgas.

  j. O repouso adicional não substitui o repouso referente à jornada anterior requerido pelos

  parágrafos (a)(1), (a)(2) e (a)(3) da seção E117.23. O repouso adicional só pode ser

  aplicado após finalizado o repouso referente à jornada anterior.

  k. Caso a viagem já tenha se encerrado, com retorno à base contratual, a aplicação dos

  mesmos requisitos, E117.23(a)(4) e (a)(5), caracteriza a folga periódica mínima previstaData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  para as operações sob o Apêndice E.

  l. A folga periódica mínima prevista não substitui o repouso referente à jornada anterior

  requerido pelos parágrafos (a)(1), (a)(2) e (a)(3) da seção E117.23. A folga só pode ser

  aplicada após finalizado o repouso referente à jornada anterior.

  6.4.9.5. Abordando a fadiga relacionada ao cruzamento de fusos horários.

  a. Para o Apêndice E do RBAC nº 117, cruzar mais de três fusos horários pode afetar o

  horário de referência (horário da base contratual ou horário local onde o tripulante se

  encontra) a ser considerado para a WOCL, para a madrugada e para início cedo, caso a

  nova jornada comece mais de 48 após o início da viagem. Sobre isso, ver itens 6.3.8.9 e'
