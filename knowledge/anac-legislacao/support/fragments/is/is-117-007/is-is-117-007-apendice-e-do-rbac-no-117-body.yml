  requisitos de extensão de jornada, se circunstâncias operacionais imprevistas ocorrerem.

  6.4.6.4. Extensão de jornada de trabalho [E117.17(b) e (d)].

  a. Extensão se refere ao aumento da jornada de trabalho de modo que exceda o limite da

  jornada máximo que consta no Apêndice E para a jornada originalmente prevista. A

  extensão:

  i. deve ser causada por circunstâncias operacionais imprevistas (vide definição);

  ii. deve ser feita de acordo com a discricionariedade do piloto em comando;

  iii. só pode ser utilizada se cada tripulante se considerar apto para completar a jornada;

  iv. não pode exceder 1 (uma) hora;

  v. não pode ser feito se isso for extrapolar o limite de tempo de voo acumulado

  previsto em E117.25; e

  vi. não pode ser feito se isso for extrapolar o limite de trabalho acumulado previsto em

  E117.27.

  6.4.6.5. A intenção por trás do uso do termo "circunstâncias operacionais imprevistas" é
  evitar que

  os operadores escalonem continuamente os períodos de voo e serviço até seus limites

  máximos e que dependam regularmente de extensões para atingir suas metas operacionais.

  Além da experiência operacional, a identificação de perigos e as avaliações de risco podem

  ser utilizadas para prever possíveis interrupções ou atrasos, por exemplo:

  a. condições meteorológicas;

  b. instruções de controle de tráfego aéreo;

  c. tráfego de pico durante a partida / pouso;

  d. necessidade de manutenção não prevista; e

  e. doença dos membros da tripulação durante o trabalho, etc.

  6.4.6.6. Extensão de tempo de voo [E117.17(c) e (d)].

  a. Extensão de tempo de voo se refere ao aumento do tempo de voo de modo que exceda

  o limite de tempo de voo máximo que consta no Apêndice E para a jornada

  originalmente prevista. A extensão de tempo de voo:

  i. deve ser feita de acordo com a discricionariedade do piloto em comando;

  ii. só pode ser utilizada se for operacionalmente necessário para completar a jornada;

  iii. só pode ser utilizada se cada tripulante se considerar apto para completar a jornada;

  iv. não pode exceder 30 minutos; e

  v. não pode ser feito se isso for extrapolar o limite de tempo de voo acumulado

  previsto em E117.25.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  6.4.6.7. Um operador deve ter expectativas razoáveis, baseadas na sua experiência e em dados

  anteriores, de que a jornada de trabalho possa ser realizada dentro dos limites do Apêndice

  E. Os limites máximos de jornada em todos os Apêndices do RBAC nº 117 foram definidos

  com a expectativa de não haver extensões.

  a. A legislação e o regulamento estabelecem critérios para extensão de jornada, cuja

  ocorrência se espera rara, sob decisão final do piloto em comando da aeronave. O piloto

  em comando deve estar ciente das condições de aptidão dos outros membros da

  tripulação para tomar sua decisão.

  b. Os requisitos para extensão de jornada foram incluídos no Apêndice E para que se tenha

  a flexibilidade apropriada quando for necessário ampliar uma jornada no caso de

  circunstâncias operacionais imprevistas e quando a tripulação está apta para a

  ampliação.

  c. A decisão de estender uma jornada deve ser tomada pelo piloto em comando antes do

  início de um voo (normalmente a última etapa da jornada de trabalho), quando a cada

  um dos membros da tripulação é dada a opção de continuar ou não a jornada, com base

  na avaliação da sua aptidão para o trabalho.

  d. Em exceção ao disposto acima, um voo pode continuar para o destino planejado ou para

  o destino alternativo de acordo com a discricionariedade do piloto em comando se

  circunstâncias operacionais imprevistas ocorrerem após a decolagem da última etapa de

  uma jornada e se essas circunstâncias operacionais imprevistas obrigarem um tripulante

  a exceder qualquer limite permitido pelo Apêndice E do RBAC nº 117 [E117.17(e)].

  e. O operador não está autorizado a continuamente aumentar o tamanho das jornadas e dos

  tempos de voo até seus limites máximos, resultando no uso excessivo de extensões,

  quando a experiência anterior indicar que é necessário um tempo maior para cumprir a

  jornada e/ou o tempo de voo.

  6.4.6.8. Extensões só deveriam ocorrer em menos de 5% em qualquer amostra de jornadas similares

  ou operações semelhantes. A amostra de jornadas deve basear-se na captura de uma causa

  raiz comum para a extensão. Um exemplo de procedimento para cumprir este item está

  abaixo descrito:

  a. coletar todas as interrupções ou atrasos em um determinado período (por exemplo, uma

  semana, uma quinzena, um mês etc.) em relação ao planejamento inicial do operador;

  b. verificar quais interrupções e atrasos levaram a extensões além dos limites máximos das

  jornadas estabelecidos nos requisitos aplicáveis do Apêndice E;

  c. determinar as causas raízes de cada uma das extensões acima citadas e classificar como

  semelhantes as jornadas ou operações que tenham uma mesma causa raiz;

  d. contabilizar o número de jornadas ou operações totais semelhantes às jornadas ou

  operações supracitadas;

  e. determinar se as jornadas ou operações com extensão (item c acima) ultrapassam os 5%

  das jornadas ou operações totais (item d acima); e

  f. tomar as medidas necessárias para mitigar as causas raízes encontradas.Data de emissão:
  29 de outubro de 2024 IS nº 117-007

  Revisão A

  Exemplo 1:

  • Ocorrência: suponha que o tempo no solo em um aeroporto esteja programado para

  45 minutos, mas leva 1 hora e 15 minutos em um terço dos casos. Como tal situação

  afeta mais de 5% de todos os voos que possuam escala naquele aeroporto, não será

  apropriado continuar a programar o tempo de 45 minutos em jornadas que são

  muito próximas aos limites aplicáveis.

  • Causa raiz: dificuldade em realizar todas as operações de solo em um determinado

  aeroporto dentro do tempo previsto (45 minutos).

  • Amostra: todos os voos do operador que possuem escala no referido aeródromo em

  um determinado período.

  Exemplo 2:

  • Ocorrência: suponha que o tempo de espera (holding) em um determinado

  aeródromo seja o triplo do tempo originalmente programado por motivo de

  orientação do controle de tráfego aéreo em um quarto dos casos (isto somente

  ocorre durante os horários de pico no aeródromo). Caso tal condição se apresente

  em mais de 5% de todos os voos do operador para aquele aeródromo, não será

  apropriado continuar a programar o tempo normal de espera, quando a jornada

  for muito próxima do máximo estabelecido.

  • Causa raiz: a dificuldade de o controle de tráfego aéreo realizar o processamento

  para pouso em um determinado aeródromo dentro do tempo padrão de espera (30

  minutos).

  • Amostra: todos os voos do operador que pousam naquele aeródromo durante o seu

  horário de pico.

  Exemplo 3:

  • Ocorrência: suponha que diversos voos são atrasados entre 30 min e 50 min na

  decolagem em um aeródromo por motivos meteorológicos durante o inverno. Caso

  tal condição se apresente em mais de 5% de todos os voos do operador iniciados

  naquele aeródromo, não será apropriado continuar a considerar o voo sem atraso

  na decolagem, quando a jornada for muito próxima do máximo estabelecido.

  • Causa raiz: a dificuldade de iniciar o voo durante o inverno no horário planejado

  devido às condições meteorológicas reinantes.

  • Amostra: todos os voos do operador que decolam do referido aeródromo no período

  de inverno.

  6.4.6.9. Quando um operador experimenta extensões em mais de 5% da amostra, deveria considerar

  a revisão de suas práticas de escala. Tal revisão tem por objetivo prover uma maior

  confiança de que os limites de jornada e tempo de voo prescritos não serão excedidos.

  6.4.6.10. Para que um operador do GRF cumpra suas obrigações, os relatórios de extensão
  devem

  ser introduzidos em seus processos de identificação de perigos e monitoramento contínuo

  (consulte os itens 6.3.3, 6.3.3.18 e 6.3.6 desta IS para obter orientações adicionais).

  6.4.6.11. Conforme estabelecido no parágrafo único do art. 40 da Lei nº 13.475/17 e no

  117.19(e)(3)(ii), qualquer ampliação dos limites das horas de trabalho estabelecidas nos

  requisitos aplicáveis do Apêndice E deve ser comunicada, em no máximo 24 (vinte eData de
  emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  quatro) horas após a viagem, pelo piloto em comando ao operador, que, no prazo de 15

  (quinze) dias, deve comunicar à Anac.

  6.4.6.12. Procedimentos a serem adotados.

  a. O operador deve adotar procedimentos para:

  i. orientar e treinar o tripulante no uso de ferramentas que o auxiliem a avaliar sua

  aptidão para o trabalho (vide Apêndice B);

  ii. impedir uma reprogramação do tripulante se este considerar-se inapto para o

  trabalho na jornada reprogramada;

  iii. impedir uma extensão de jornada, exceto se todos tripulante tiverem sido

  consultados pelo piloto em comando e todos declararem-se aptos para o trabalho na

  extensão solicitada; e

  iv. coletar informações suficientes sobre cada reprogramação e extensão de jornada,

  para permitir um estudo mais aprofundado pelo próprio operador e um ajuste fino

  do processo de escala de tripulantes, minimizando assim a probabilidade de novas

  extensões.

  b. Reprogramação de jornada: os procedimentos devem, no mínimo:

  i. identificar que um tripulante reprogramado não pode exceder os limites máximos

  de jornada de trabalho constantes do Apêndice E;

  ii. identificar que uma jornada reprogramada não pode fazer com que o tripulante

  exceda limites de jornada e tempo de voo acumulados;

  iii. identificar que uma jornada reprogramada não pode fazer com que o tripulante

  ultrapasse os limites de operações na madrugada ou de início cedo.

  c. Extensões de jornada:

  i. Os procedimentos devem limitar claramente o uso de extensões às circunstâncias

  em que:

  A. a jornada de trabalho já foi iniciada;

  B. a decisão de ampliar a jornada de trabalho e/ou o tempo de voo é tomada antes

  dos limites de jornada de trabalho e de tempo de voo serem excedidos;

  C. as circunstâncias operacionais que exigiram a extensão de jornada poderiam ser

  classificadas como imprevistas (vide definição de circunstância operacional

  imprevista);

  D. o tripulante não excederá a duração da jornada acumulada e do tempo de voo

  acumulado durante a extensão (exceto se as circunstâncias operacionais

  imprevistas ocorrerem após a decolagem da última etapa da jornada, caso em

  que o voo pode continuar até o destino planejado ou alternativo de acordo com

  a discricionariedade do piloto em comando);Data de emissão: 29 de outubro de 2024 IS nº
  117-007

  Revisão A

  ii. os procedimentos também devem deixar claro que uma extensão não pode ser maior

  que 1 hora para a jornada de trabalho e 30 minutos para o tempo de voo.

  iii. se circunstâncias operacionais imprevistas acontecerem após a decolagem da última

  etapa de uma jornada, então o voo pode continuar para o destino planejado ou para

  o destino alternativo de acordo com a discricionariedade do piloto em comando; e

  iv. o repouso após a jornada que sofreu extensão com base em E117.17(b) deve ser

  baseado na sua duração total, incluindo a extensão.

  6.4.7. Limites de sobreaviso, reserva ou tempo em solo entre etapas de voo [E117.19]

  6.4.7.1. Do ponto de vista da fadiga, há vantagens e desvantagens na utilização de sobreaviso
  e

  reserva.

  a. Reserva.

  i. Vantagens: anula a necessidade de o tripulante dirigir até o aeroporto após o

  chamado, o que, dependendo do tempo de viagem, do clima e das condições de

  tráfego pode impactar negativamente os níveis de fadiga antes do início da jornada

  de trabalho. O tempo em que o tripulante permanece à disposição é mais curto.

  ii. Desvantagens: é mais provável que um tripulante esteja em estado de prontidão,

  enquanto não realiza nenhum trabalho real, mesmo se houver acesso a acomodação

  para reserva adequada. Este estado elevado de prontidão pode gerar ansiedade, o

  que pode aumentar a fadiga e diminuir os níveis de alerta mais rápido do que em

  casa ou em outro local longe do aeroporto.

  b. Sobreaviso.

  i. Vantagens: o tripulante escolhe o local, podendo permanecer em casa ou um local

  equivalente a uma acomodação para repouso (mais confortável que acomodação

  para reserva), em companhia de familiares e amigos, se desejar.

  ii. Desvantagens: terá de cumprir o tempo máximo de deslocamento caso seja

  acionado, por isso o local de escolha não poderá ser qualquer um. Ainda,

  provavelmente terá de dirigir, o que exige atenção e contribui para a fadiga. O

  período do sobreaviso (se durante o dia, por exemplo), a ansiedade gerada de um

  possível acionamento e interferências sociais podem atrapalhar a perspectiva de um

  possível sono.

  6.4.7.2. É responsabilidade do operador monitorar esses riscos potenciais e tomar decisões
  sobre a

  utilização do sobreaviso ou da reserva, de modo a gerenciar o risco apropriadamente.

  6.4.7.3. Uma importante estratégia de gerenciamento de risco para qualquer operador, no
  que se

  refere aos períodos de sobreaviso e reserva, é maximizar a eficácia de qualquer

  oportunidade de sono / descanso que o tripulante possa ter enquanto estiver naquelas

  situações. Isso significa reduzir o contato ao mínimo e, quando pertinente, não incluir
  o

  tripulante nas deliberações operacionais e na tomada de decisões antes do início da jornada

  de trabalho.

  6.4.7.4. É importante que os operadores observem que, para tripulantes diferentes, podem
  existir

  maneiras diferentes de gerenciar qualquer estresse adicional, que pode estar presente comoData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  resultado da manutenção de um nível mais alto de alerta durante os períodos de sobreaviso

  ou reserva. Uma estratégia que os tripulantes podem empregar envolve atividades

  relacionadas à aviação enquanto ainda está em estado de prontidão. Se um tripulante decidir

  realizar tarefas relacionadas ao trabalho enquanto estiver em sobreaviso ou reserva

  (inteiramente por vontade própria), então esse tempo não deve ser considerado como

  jornada de trabalho. Contudo, os operadores não podem tirar vantagem indevida desse

  método de gerenciamento de estresse, não alocando tempo suficiente para realizar essas

  tarefas, que de outra forma seriam requeridas, na jornada de trabalho subsequente.

  6.4.7.5. Condições para reserva.

  a. A reserva do tripulante tem duração mínima de 3 horas e máxima de 10 horas.

  b. Conforme estabelecido no parágrafo A117.19(c), quando prevista a reserva, o operador

  deve assegurar a todos os tripulantes acomodação adequada para seu descanso,

  conforme 117.3(b)(2).

  c. Os tripulantes acionados na reserva para execução de outras tarefas não relacionadas
  ao

  voo, terão suas atividades do dia encerradas após o término do procedimento.

  d. Uma reserva finalizada sem um chamado deve ser seguida por um período de repouso

  de, pelo menos, 12 horas consecutivas.

  6.4.7.6. Condições para sobreaviso.

  a. Para casos de sobreaviso, quando o tripulante pode permanecer em local de sua escolha

  aguardando um chamado, que pode ou não acontecer, é recomendável que o operador

  oriente as medidas que o tripulante deve atender para se manter apto para o voo.

  b. O período de sobreaviso não pode ser inferior a 3 horas e não pode exceder 12 horas.

  c. Conforme os parágrafos A117.17(a) e A117.17(b), o tempo de apresentação do

  tripulante após comunicação de nova tarefa é de 90 minutos, ou 150 quando designado

  para outra base em município ou conurbação com dois ou mais aeroportos. O operador

  pode estimular que estas durações sejam calculadas considerando-se todos os possíveis

  fatores de pressão de tempo e acessibilidade para entrar e sair do local escolhido, de

  forma a evitar ao máximo situações de estresse.

  d. Um sobreaviso finalizado sem um chamado deve ser seguido por um período de repouso

  de, pelo menos, 10 horas consecutivas.

  e. Se um tripulante compondo tripulação simples for acionado durante um sobreaviso, a

  soma do limite máximo de jornada ao tempo de sobreaviso não pode ultrapassar 16

  horas.

  6.4.7.7. Condição para tempo de solo entre etapas de voo.

  a. Diante de previsão de tempo de solo entre etapas de voo por prazo superior a 3 (três)

  horas, o operador deve assegurar ao tripulante acomodação para reserva, conforme

  estabelecido no parágrafo 117.3(b)(2).

  6.4.7.8. Procedimentos a serem adotados.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  a. Os procedimentos a serem adotados devem:

  i. incluir um meio de fazer avaliações confiáveis de acomodações adequadas para

  dormir ou descansar que são propostas para uso em períodos de sobreaviso ou

  reserva. Essas avaliações devem ser contínuas para garantir que a acomodação

  permaneça adequada ao objetivo. Especial atenção deve ser dada às acomodações

  para reserva, que são de responsabilidade do operador;

  ii. garantir que os tripulantes não sejam perturbados por contato do operador durante

  o período de sobreaviso ou reserva, exceto para chamar o tripulante para uma

  jornada de trabalho.

  Importante:

  O estresse e a fadiga podem ser acelerados se o tripulante for obrigado a realizar

  tarefas (por exemplo, tarefas de escritório) enquanto estiver em sobreaviso ou reserva.

  Portanto, a realização dessas tarefas não pode ser considerada como sobreaviso ou

  reserva. Conforme o parágrafo E117.19(a)(3), caso o tripulante seja acionado na

  reserva para execução de outras tarefas não relacionadas ao voo, o tripulante terá

  suas atividades do dia encerradas após o término do procedimento.

  b. Os procedimentos devem assegurar que:

  i. um sobreaviso finalizado sem um chamado deve ser seguido por um período de

  tempo de repouso de, pelo menos, 10 horas consecutivas;

  ii. uma reserva finalizada sem um chamado deve ser seguida por um período de tempo

  de repouso de, pelo menos, 12 horas consecutivas;

  iii. a duração do sobreaviso respeite o cálculo de que o sobreaviso é finalizado quando

  do início do deslocamento do tripulante ao aeroporto (90 ou 150 minutos antes do

  início da jornada, conforme a situação), e não quando o operador faz contato para

  informar sobre a jornada;

  iv. os tripulantes acionados na reserva para execução de outras tarefas não relacionadas

  ao voo, terão suas atividades do dia encerradas após o término do procedimento; e

  v. se o tripulante que compuser tripulação simples for acionado durante um

  sobreaviso, a soma do limite máximo de jornada ao tempo de sobreaviso não pode

  ultrapassar 16 horas;

