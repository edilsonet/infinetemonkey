  6.4.1.6. Conforme E117.5(b), um tripulante não pode ser escalado para uma jornada longa,
  a menos

  que tenha um repouso de no mínimo 24 horas, incluindo uma noite local, anterior ao início

  da jornada longa.

  a. Neste requisito, não se trata do repouso após a jornada previsto em E117.23, mas de um

  requisito de repouso anterior, específico para as jornadas longas (definidas em

  E117.7(c)(3)). Este período de repouso anterior à jornada pode ser cumprido por um

  período de repouso propriamente dito ou por um período livre de atividades, incluindo

  folga.

  b. Para a jornada longa prevista em E117.7(c)(3) o operador deve garantir que ambos os

  requisitos sejam atendidos: repouso anterior e posterior à jornada. Antes da jornada

  longa o repouso deve ser de no mínimo 24 horas, incluindo uma noite local. E o repouso

  após uma jornada longa é de no mínimo 18 horas, conforme previsto na seção

  E117.23(a)(3). Em caso de jornada longa na WOCL, conforme E117.7(d)(2) este

  repouso deve incluir uma noite local.

  c. Caso duas jornadas longas sejam realizadas em sequência o repouso mínimo a ser

  praticado entre elas deve ser o maior entre os dois tipos de repouso previstos, ou seja,

  repouso de 24 horas com uma noite local.

  Exemplo:

  No caso de realização de duas jornadas longas em sequência - o máximo de jornadas

  deste tipo permitidas em um período de 168 horas consecutivas, conforme E117.7(d)(3)

  - o repouso posterior à primeira jornada longa seria de no mínimo 18 horas, conforme

  E117.23(a)(3), e incluindo uma noite local, caso a jornada longa tenha sido na WOCL.

  Porém, como o requisito de repouso anterior requer para a segunda jornada que esta

  seja precedida de um repouso de no mínimo 24 horas com uma noite local, este é o

  repouso mínimo a ser praticado entre as jornadas.

  6.4.1.7. Procedimentos a serem adotados.

  a. O operador deve adotar procedimentos para garantir que um tripulante obtenha ao

  menos:Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  i. 8 horas consecutivas de oportunidade de sono (na base ou fora da base) dentro das

  12 horas imediatamente anteriores ao início de uma jornada, sobreaviso ou reserva;

  ii. 8 horas consecutivas de oportunidade de sono dentro de 10 horas imediatamente

  anteriores ao início de uma jornada seguinte a um sobreaviso finalizado sem um

  chamado, após repouso reduzido, cancelamento ou atraso único de 10 horas ou

  mais; e

  iii. 24 horas de repouso, incluindo uma noite local, anterior ao início de uma jornada

  longa com tripulação simples.

  b. O operador deve garantir que, se uma jornada estiver atrasada:

  i. os requisitos para a oportunidade de sono relacionem-se com a hora de início da

  jornada de trabalho originalmente prevista, em vez do novo horário de início,

  quando o atraso é inferior a 10 horas; e

  ii. quando haja um único atraso de 10 ou mais horas, a oportunidade de sono prévio

  seja observada antes do horário de início atrasado.

  6.4.2. Limites de jornada e de tempo de voo - tripulação simples [E117.7]

  6.4.2.1. Limitar a duração das jornadas e o tempo de voo dentro de uma jornada é um aspecto

  fundamental do gerenciamento da fadiga. O RBAC nº 117 define limites máximos de

  jornada e de tempo de voo no seu Apêndice E.

  6.4.2.2. O operador deve adotar as limitações contidas no Apêndice E do RBAC nº 117, conforme

  aplicáveis. Estes são limites prescritivos.

  6.4.2.3. Porém, o risco de fadiga pode não ser suficientemente gerenciado com base apenas
  em

  limitações das horas de jornada e na programação de repousos de duração mínima

  adequada. Após a aplicação desses limites, pode haver necessidade de o operador controlar

  o risco de fadiga devido a fatores como:

  a. variações individuais;

  b. ambiente operacional;

  c. horários de trabalho (durante a noite e nas janelas de baixa do alerta, por exemplo);

  d. carga de trabalho;

  e. entre outros fatores.

  Variações individuais podem assumir diferentes formas, tais como:

  • o tripulante está matriculado em um curso superior de ciências aeronáuticas, por

  exemplo;

  • o tripulante realiza atividades administrativas para o operador, devendo coordenar

  tais tarefas com as atividades de voo.

  • o tripulante é empregado também de um operador de transporte aéreo, devendo

  coordenar tais tarefas com suas atividades enquanto tripulante contratado para

  operações privadas.Data de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  6.4.2.4. Variações excessivas especificamente quanto à carga de trabalho devem ser objeto
  de

  especial atenção quanto ao risco de fadiga. A fadiga resultante pode ser significativamente

  aumentada na sequência de atividades que, por diferentes motivos, tenham se revelado mais

  demandantes quanto à carga de trabalho envolvida do que era antes esperado.

  6.4.2.5. O RBAC nº 117 possui um requisito incorporado para identificação de perigos e

  gerenciamento de riscos para o Apêndice E do RBAC nº 117. O efeito disso é que as

  limitações especificadas naquele apêndice podem precisar ser modificadas por um operador

  para reduzir os riscos de fadiga a um nível aceitável (vide o item 6.3.5 desta IS).

  6.4.2.6. Procedimentos a serem adotados.

  a. Procedimentos para garantir que o tripulante não seja escalado para uma jornada maior

  do que o número de horas especificado no Apêndice E do RBAC nº 117. É importante

  que se tenha um cuidado especial com os horários de saída do local de descanso e

  previstos de chegada no aeroporto, a fim de evitar que o tripulante fique em vigília no

  aeroporto sem a respectiva contagem de tempo de jornada.

  b. Procedimentos de escalas, para assegurar que as jornadas sejam designadas de tal

  maneira que forneçam provisão suficiente para o(s) voo(s) pretendido(s), bem como um

  período suficiente para deveres pré e pós-voo que levem em consideração requisitos

  inevitáveis tais como:

  i. embarque de passageiros;

  ii. balancear e carregar a aeronave, bem como preparar o manifesto de carga

  correspondente;

  iii. alfândega e imigração;

  iv. inspeções pré-voo do pessoal de manutenção e de pilotos (reabastecimento de

  combustível e óleo etc.);

  v. deveres pós-voo (por exemplo, preenchimento do diário de bordo e tempo de

  serviço e outros serviços do piloto).

  c. Procedimentos para mensurar e/ou mitigar a fadiga decorrente de treinamentos em

  simulador e/ou trabalhos administrativos e operacionais, principalmente quando estes

  forem associados a uma atividade de voo.

  d. Avaliação de como eventuais atividades voluntárias devem ser enquadradas como

  trabalho e de sua inserção no cômputo da jornada (vide item 6.3.5.9 desta IS).

  e. Apêndice E do RBAC nº 117.

  i. Os limites a serem adotados para o uso de tripulações simples não podem exceder

  os limites do RBAC nº 117, Apêndice E, E117.7, Tabela E.2.

  ii. Consulte o item Erro! Fonte de referência não encontrada.6.3.8 desta IS para o

  bter orientação sobre o horário a ser considerado como base para o planejamento

  das jornadas e para o gerenciamento de risco quanto à desregulação circadiana.

  iii. Quanto às limitações de jornada e tempo de voo em tripulação simples os limites aData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  serem adotados devem respeitar a tabela a seguir.

  Limites de jornada e tempo de voo - tripulação simples

  Tipo de jornada Jornada máxima Tempo de voo máximo

  Padrão 14 horas 10,5 horas

  Na WOCL 11,5 horas 10 horas

  Longa 15 horas Não há

  Longa na WOCL 12,5 horas 10,5 horas

  Tabela 5: Limites de jornada e tempo de voo - tripulação simples

  iv. As definições aplicáveis às jornadas em tripulação simples são:

  A. Jornada padrão, conforme E117.7(c)(1), significa uma jornada em tripulação

  simples que não infringe a WOCL e não é uma jornada longa. Infringir a

  WOCL significa adentrar essa janela temporal por 1 minuto ou mais.

  B. Jornada na WOCL, conforme E117.7(c)(2), significa uma jornada em

  tripulação simples que atravessa a janela de baixa do alerta no ritmo circadiano

  (WOCL), ou cujo início ou término ocorrem neste período.

  C. Jornada longa, conforme E117.7(c)(3), significa uma jornada em tripulação

  simples com tempo de voo superior a 10,5 horas (ou 10 horas e até um máximo

  de 10,5 horas, se for na WOCL) ou limite de jornada com duração maior que

  14 horas (ou 11,5 horas, se for na WOCL) até um máximo de 15 horas.

  D. Ao realizar uma jornada longa o tripulante deve cumprir tanto com o seu

  repouso prévio, previsto em E117.5(b), quanto com o repouso posterior à

  jornada, previsto em E117.23(a)(3) e E117.7(d)(2). O repouso prévio

  corresponde a um período de no mínimo 24 horas, incluindo uma noite local,

  anterior ao início da jornada longa. O repouso posterior deve ser de, no mínimo,

  18 horas após a jornada longa. Conforme E117.7(d)(2), após uma jornada longa

  na WOCL esse período de repouso posterior deve ainda incluir uma noite local.

  E. Um tripulante só pode realizar até 2 (duas) jornadas do tipo longa em um

  período de 168 horas consecutivas.

  v. Gerenciamento da carga de trabalho: dados de acidentes e pesquisas de fadiga com

  base no desempenho e na fisiologia sugerem que há vulnerabilidade e risco

  aumentados durante fases críticas da operação, com os níveis de risco mais elevados

  durante a descida e o pouso. Cada pouso adicional pode aumentar a carga de

  trabalho, degradar adicionalmente o desempenho e representar um período de

  vulnerabilidade aumentada. Como dados científicos suficientes não estão

  disponíveis, é necessário aplicar princípios gerais:

  A. Se o tempo de voo para uma tripulação simples operando durante a WOCL ou

  em jornada longa contiver um único bloco de tempo de voo longo e contínuo

  (por exemplo, se aproximando do máximo de 10 horas de tempo de voo na

  operação na WOCL, ou se aproximando do limite máximo de 15 horas de

  jornada, na jornada longa), então é recomendado que a tripulação não realize

  outras tarefas de voo após o pouso, como voos de reposicionamento da

  aeronave ou voos curtos para desembarque de passageiros.Data de emissão: 29 de outubro de
  2024 IS nº 117-007

  Revisão A

  B. Para todas as operações, e, em específico, para as operações em tripulação

  simples do tipo longa, recomenda-se que procedimentos de gerenciamento de

  risco sejam aplicados para a determinação do número de pousos previstos para

  aquela jornada, limitando-o conforme avaliado necessário pelos procedimentos

  de identificação de perigos e mitigação de riscos do operador.

  6.4.3. Aumento dos limites da jornada de trabalho em função de jornada interrompida, para

  tripulações simples [E117.11]

  6.4.3.1. Para muitos operadores, fornecer aos tripulantes um período de descanso durante
  uma

  jornada é uma maneira útil de abordar o risco potencial de fadiga e, em contrapartida,

  permitir um aumento do limite desta jornada de trabalho, caracterizando a chamada jornada

  interrompida. A jornada interrompida envolve garantir ao tripulante um ambiente propício

  para dormir ou descansar durante a interrupção e liberá-lo de todas as tarefas durante esse

  período.

  6.4.3.2. Procedimentos a serem adotados.

  a. Se um operador optar por incorporar jornada interrompida em suas operações, o

  operador deve adotar procedimentos para assegurar que:

  i. a adequação da acomodação atende ao padrão mínimo. Para tanto, deverá

  considerar que:

  A. existe um padrão diferente para acomodações para dormir (repouso) e

  acomodações para descansar (reserva). O padrão para cada um pode ser

  encontrado na seção 117.3 do RBAC nº 117;

  B. a casa do tripulante é considerada adequada, sendo da responsabilidade do

  tripulante a manutenção como acomodação para repouso;

  C. locais diferentes da casa, informados pelo tripulante como adequados para

  acomodação para reserva ou repouso, podem justificar casos de dispensa de

  hotel, sendo da responsabilidade do tripulante a manutenção como acomodação

  para repouso; e

  D. os locais de repouso e descanso indicados pelo operador devem ser avaliados

  para assegurar a conformidade com o RBAC nº 117 (por exemplo, hotéis). Isso

  significa reavaliar o padrão periodicamente ou quando o operador tiver motivos

  para acreditar que pode haver um problema com o padrão fornecido;

  ii. haja tempo real suficiente alocado na escala para o tripulante deslocar-se de e para

  o local adequado para dormir ou descansar durante a interrupção e ainda ter tempo

  suficiente nesse local para cumprir os requisitos mínimos (vide especialmente o

  parágrafo 117.11(d) do RBAC nº 117);

  iii. os tripulantes não sejam perturbados durante o período de descanso relacionado à

  jornada interrompida. Isso significa ter políticas e procedimentos específicos que

  abordem possíveis fontes de distúrbio. Como exemplo, a existência de protocolos

  de comunicação para gerenciar como o tripulante é contatado e como ele configura

  seu celular para proteger-se contra distúrbios inadvertidos de chamadas recebidas;

  iv. as jornadas interrompidas sejam atribuídas a um tripulante como parte da escala deData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  trabalho a fim de fornecer ao tripulante a quem ela se aplica uma oportunidade

  razoável de planejar seu descanso ou repouso e vida social antes da sua próxima

  jornada;

  v. o operador informe aos tripulantes em reserva e sobreaviso que poderão ser

  acionados para uma jornada interrompida, se tal prática fizer parte da política do

  operador;

  vi. o tempo transcorrido durante o período de descanso ou repouso da jornada

  interrompida seja sempre considerado como um trabalho e seja incluído como parte

  da jornada;

  vii. todo o período mínimo de acesso a uma acomodação adequada deve ser alcançado

  antes do final do período de jornada de trabalho máxima (sem considerar o aumento

  devido à jornada interrompida) antes que seja permitido um aumento no limite da

  jornada de trabalho;

  Importante para o operador considerar:

  • A gestão da mudança na troca de acomodações (mudança de hotel, por exemplo);

  • Um procedimento para o tripulante fornecer feedback sobre o padrão das

  acomodações consideradas adequadas para dormir (repouso) ou descansar

  (reserva); e

  • Revisão do padrão das acomodações adequadas para dormir ou descansar em um

  processo periódico formal.

  b. devem ser providas acomodações para reserva (vide definição no RBAC nº 117) para

  interrupções de mais de 3 e menos de 6 horas consecutivas entre o período de 06:00 a

  00:00;

  c. devem ser providas acomodações para repouso (vide definição no RBAC nº 117) para

  interrupções de 6 a 8 horas, a qualquer hora do dia, ou quando alguma parte da

  interrupção ocorrer entre 00:00 e 06:00 (madrugada);

  d. atendidos os requisitos acima, a jornada total pode ser acrescida de até metade do tempo

  de interrupção;

  e. depois de aplicar o aumento de até metade do tempo da interrupção, a jornada de trabalho

  máxima (jornada interrompida total) não seja superior a 16 horas, em que a interrupção

  é contada como jornada;

  f. o tempo remanescente da jornada interrompida, após o período de descanso ou repouso,

  não ultrapasse 6 horas;

  g. para efeito de contagem de tempo de interrupção, não são considerados os tempos

  necessários para atividades pós-voo, pré-voo e deslocamento até o local de descanso ou

  repouso, não podendo ser o tempo total destas atividades menor do que 30 minutos;

  h. para efeito de cálculo de repouso após a jornada interrompida, devem ser considerados

  os requisitos estabelecidos no parágrafo E117.23(a);

  i. jornadas interrompidas devem ser consignadas no diário de bordo da aeronave com aData
  de emissão: 29 de outubro de 2024 IS nº 117-007

  Revisão A

  informação de quais foram os horários reais de interrupção e retomada da jornada, tipo

  de acomodação oferecida pelo operador (reserva ou repouso), e assinatura do piloto em

  comando; e

  j. o operador deve estabelecer procedimentos de acompanhamento das jornadas

  interrompidas, especialmente no início de suas operações, buscando ativamente

  informações junto aos tripulantes para avaliações de possíveis riscos e pontos fortes.

  6.4.4. Aumento da jornada e tempo de voo em operações com tripulação composta ou de

  revezamento [E117.13]

