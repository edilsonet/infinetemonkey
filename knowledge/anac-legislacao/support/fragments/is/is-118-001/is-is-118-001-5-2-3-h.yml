section_title: 'Não podem ser considerados como NEF:'
subsection_id: h
cite: 5.2.3(h)
title: 5.2.3(h)
text: 'h) itens de controle administrativo, conforme definidos na IS nº 91-012.

  5.2.4 A fim de que os operadores possam ter uma referência inicial para desenvolvimento
  da NEF, a ANAC recomenda como referência a utilização da Universal NEF List disponibilizada
  pelo FAA e publicada através da página da web: https://drs.faa.gov/browse/excelExternalWindow/662D990A823FEE35862577580059BC0A.0001

  Nota: essa lista não esgota todos os itens e também pode trazer itens não aplicáveis. Assim,
  deve ser avaliada a sua utilização pelos operadores.

  5.3 Formato e conteúdo da Lista NEF

  5.3.1 A Lista NEF pode ser desenvolvida em papel ou em formato eletrônico, desde que, em
  qualquer caso, sejam disponibilizadas para a tripulação de voo e de cabine e para o pessoal
  de manutenção e de operação de voo. Embora o termo lista seja utilizado ao longo desta seção,
  uma lista física não precisa ser desenvolvida e mantida.'
