title: Revisões do programa NEF devem ser enviadas para ANAC seguindo o mesmo procedimento
  da edição original.
text: '5.5.6 Revisões do programa NEF devem ser enviadas para ANAC seguindo o mesmo procedimento
  da edição original.

  5.5.7 A Lista NEF não é especificamente aprovada ou aceita pela ANAC. Assim, com exceção
  da lista NEF enviada juntamente a um programa NEF, não é necessário o envio para a ANAC
  de cada revisão da lista. No entanto, o operador deve manter o histórico de todas as revisões
  da lista, de forma a permitir saber, para uma data específica, qual a lista NEF vigente.

  5.5.8 As listas NEF poderão ser objeto de verificação da ANAC, inclusive quanto aos novos
  itens adicionados à lista. Neste sentido, a ANAC poderá solicitar uma cópia de qualquer
  revisão da lista NEF a qualquer momento.'
