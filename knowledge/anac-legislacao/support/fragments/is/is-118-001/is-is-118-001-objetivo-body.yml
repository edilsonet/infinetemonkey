title: OBJETIVO
text: 'OBJETIVO

  1.1 Estabelecer meios e procedimentos associados ao uso de equipamentos e acessórios de
  aeronaves considerados como “não essenciais” para a segurança de voo.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação ou aceitação de Programas
  NEF.'
