title: 5.2.1(e)
text: 'e) Fase 5 - Certificação.


  Figura 1 - Processo de certificação de cinco fases


  5.2.3 O pessoal de administração requerido, conforme parágrafo 119.65(d)(2) do RBAC nº 119,
  deve conhecer a regulamentação pertinente às operações pretendidas, assim como as IS que
  lhes sejam relacionadas, incluindo esta, a fim de que o processo de certificação seja agilizado.'
