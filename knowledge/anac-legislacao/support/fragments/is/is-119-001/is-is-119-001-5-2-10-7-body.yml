text: '5.2.10.7 Revogado

  5.2.10.8 Após a aceitação ou aprovação de todos os documentos que compõem o PSF, o EsEC
  informará o encerramento da fase 3 do processo de certificação à organização requerente.
  Com isso, a organização requerente do COA deverá se preparar para proceder às demonstrações
  requeridas, segundo os planejamentos apresentados, nas datas acordadas no cronograma de
  eventos de certificação.'
