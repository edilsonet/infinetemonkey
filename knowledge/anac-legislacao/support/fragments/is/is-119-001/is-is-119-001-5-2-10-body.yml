text: '5.2.10 Fase 3 - Avaliação de documentos

  5.2.10.1 Depois da aceitação do PSF para análise e realização da RSF satisfatória, os servidores
  designados para compor a equipe de certificação darão início a uma análise detalhada de
  todos os manuais, programas e documentos exigidos pela Anac e que foram apresentados pela
  organização requerente do COA juntamente com o FOP 104.

  5.2.10.2 A organização requerente será devidamente notificada, através do FOP 124 ou ofício,
  caso um manual, programa ou documento seja considerado incompleto ou deficiente ou, ainda,
  se for detectada alguma não-conformidade com relação à legislação aplicável, como regulamentos
  e instruções suplementares, e aos demais documentos de referência, como avaliações operacionais
  e manuais de operação de aeronaves. As devidas correções deverão ser enviadas pela organização
  requerente ao setor da Anac emissor do documento com as deficiências ou não-conformidades
  por meio do FOP 125.

  5.2.10.3 O prazo máximo de resposta ao FOP 124 ou ofício enviado pela Anac é de 30 dias
  corridos, a contar do recebimento do documento pela organização requerente, respeitando
  o prazo máximo estabelecido na seção 5.2.14 desta IS.

  5.2.10.4 Se os manuais, programas e documentos que compõem o PSF forem considerados satisfatórios,
  eles serão aceitos ou aprovados, conforme o caso, por meio de FOP 111 ou ofício, emitido
  separadamente para cada manual, programa ou documento avaliado, à medida que os servidores
  da equipe de certificação encarregados da análise do material forem encerrando seus trabalhos
  de avaliação. No caso do PTO, a aprovação será considerada inicial até que seja concluída
  a demonstração da eficácia de todos os treinamentos, quando será emitido o FOP 111 de aprovação
  final, o que poderá ocorrer mesmo após o término do processo de certificação.

  5.2.10.5 O prazo para análise e eventual aceitação ou aprovação de determinado manual, programa
  ou documento dependerá do atendimento satisfatório, em termos de conteúdo e tempo, pela
  organização requerente, das deficiências e não-conformidades apontadas pela Anac. Respostas
  insatisfatórias às deficiências e não-conformidades apontadas pela equipe de certificação
  poderão gerar atrasos no cronograma de eventos, demandando o envio de novo FOP 103.

  5.2.10.6 A aceitação ou aprovação concedida individualmente ao manual, programa ou documento
  analisado não implica em aceitação ou aprovação final de todo, ou de parte, do PSF, tampouco
  é garantia de que a organização requerente receberá seu COA.'
