title: Fase 4 - Demonstrações e inspeções
text: '5.2.11 Fase 4 - Demonstrações e inspeções

  5.2.11.1 A seção 119.39 do RBAC nº 119 estabelece que a Anac deve constatar que uma organização
  requerente de um COA consegue demonstrar sua capacidade de cumprir com os requisitos regulamentares
  e com as práticas operacionais seguras antes de iniciar suas operações comerciais. A seção
  119.59 do RBAC nº 119 estabelece algumas condições adicionais que devem ser observadas nas
  demonstrações e inspeções.

  5.2.11.2 A fase 4 se inicia com o encerramento formal da fase 3 e envio das solicitações
  de demonstrações e inspeções, separadamente para cada uma destas, por meio de FOP 116, FOP
  117 e seus anexos.

  5.2.11.3 As demonstrações devem representar, no cenário mais próximo possível da realidade,
  as atividades que o operador aéreo poderá realizar após a emissão do COA. Estas demonstrações
  serão avaliadas “in loco” pelos servidores da Anac designados para observá-las, tanto nas
  áreas de operações, quanto nas áreas de manutenção da organização requerente.

  5.2.11.4 Durante essas demonstrações e inspeções, os servidores da Anac avaliarão a efetividade
  das políticas, métodos, procedimentos e instruções aplicáveis conforme descrito nos manuais,
  programas e documentos apresentados para a certificação.

  5.2.11.5 Nesta fase, os servidores darão ênfase à avaliação da efetividade do sistema de
  gerenciamento adotado. As deficiências encontradas serão levadas ao conhecimento da organização
  requerente e ações corretivas devem ser tomadas antes de o COA ser emitido.

  5.2.11.6 A fase 4 servirá também para confirmar se o conhecimento do pessoal de administração
  requerida sobre a legislação aplicável e sobre o sistema de documentos de segurança operacional
  da organização requerente satisfaz os requisitos regulamentares, conforme o parágrafo 119.65(d)(2)
  do RBAC nº 119. Para avaliar esse conhecimento, por meio de entrevistas, os servidores da
  Anac formularão questões relacionadas aos processos da organização sob controle ou responsabilidade
  de cada um dos indivíduos. Cada um dos membros da administração requerida deverá demonstrar
  um nível aceitável de conhecimento ao responder corretamente às questões. Resultados insatisfatórios
  poderão requerer uma nova avaliação do(s) indivíduo(s) em data posterior ou a indicação
  de novo(s) candidato(s).

  5.2.11.7 A critério do EsEC, atividades de demonstrações e inspeções podem ser antecipadas
  antes do encerramento da fase 3, desde que os pré-requisitos técnicos correspondentes a
  essas atividades tenham sido completamente atendidos na respectiva fase 3.

  5.2.11.8 Abaixo estão listadas as demonstrações e inspeções requeridas para o cumprimento
  da fase 4 do processo de certificação e que deverão ser solicitadas pela organização requerente
  ao EsEC:'
