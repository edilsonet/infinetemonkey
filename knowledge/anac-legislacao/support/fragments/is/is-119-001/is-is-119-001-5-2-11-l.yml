cite: 5.2.11(l)
title: 5.2.11(l)
text: 'l) voo de avaliação operacional, conforme requerido pela seção 119.34 do RBAC nº 119
  e a IS nº 119-009. Essa atividade somente deve ser realizada após a finalização de todas
  as demais demonstrações e inspeções requeridas, exceto exame em rota de pilotos.

  Nota: o Apêndice E contém orientações sobre o uso compartilhado de avião durante a fase
  de demonstrações do processo de certificação.

  5.2.11.9 Como resultado das inspeções realizadas, algumas deficiências e não-conformidades
  poderão ser verificadas, e serão comunicadas à organização requerente por meio de FOP 109
  ou ofício à organização requerente. As correções deverão ser apresentadas por meio de FOP
  123, e eventualmente será requerida nova demonstração para comprovação da efetividade das
  correções. Todas as deficiências e não-conformidades deverão estar corrigidas para permitir
  a aprovação na respectiva inspeção na qual foram identificadas.

  Nota: as deficiências e não-conformidades podem demandar revisão de manuais já aprovados
  na fase 3 do processo de certificação.

  5.2.11.10 Somente depois de ter sido aprovada em todas as demonstrações e inspeções a que
  foi submetida, uma organização requerente de um COA terá demonstrado satisfatoriamente ao
  EsEC sua capacidade de operar com segurança conforme requerido. O EsEC informará essa condição
  à organização requerente, comunicando o encerramento da fase 4 do processo de certificação.

  5.2.11.11 Uma organização requerente de um COA pode requerer à Anac sua certificação como
  organização de manutenção aprovada, concomitantemente com a obtenção de seu COA. Neste caso,
  a organização requerente deverá atender aos dois processos de certificação, que serão conduzidos
  pela Anac por equipes distintas de servidores, de forma que ambos estejam na fase de demonstrações
  e inspeções ao mesmo tempo. Isso ocorre porque os voos de avaliação operacional exigem que
  a organização requerente demonstre à Anac todas as operações de voo e de solo relacionadas.
  Portanto, o requerente deve demonstrar o uso de sua organização de manutenção aprovada (oficina
  certificada de acordo com os requisitos do RBAC nº 145), para assegurar a correspondência
  entre os procedimentos previstos em seu manual geral de manutenção para controle de manutenção
  e para execução de manutenção.'
