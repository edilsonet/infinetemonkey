title: Revogado
text: '5.2.12.3 Revogado

  5.2.12.4 Após emissão do COA e das EO, a Anac procederá à verificação dos demais requisitos
  necessários para exploração dos serviços aéreos previstos na Resolução nº 659, de 2 de fevereiro
  de 2022. A exploração do serviço aéreo somente poderá ser iniciada a partir da publicação
  de Portaria dando a publicidade do cumprimento dos requisitos desta Resolução.

  5.2.12.5 Para publicação da Portaria que dá publicidade ao cumprimento dos requisitos da
  Resolução nº 659, de 2 de fevereiro de 2022, é necessário que a organização não possua pendências
  acerca da certificação AVSEC. Orientações podem ser encontradas no sítio da Anac, no endereço
  eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/aerodromos/avsec/operador-aereo-1.

  5.2.12.6 Para o início das operações, a organização requerente deverá observar o disposto
  na Resolução nº 219, de 13 de março de 2012, e na Portaria 791/SSO, de 26 de abril de 2012,
  as quais dispõem sobre o Sistema Eletrônico de Registro de voo. As orientações para envio
  das informações requeridas devem ser solicitadas pelo e-mail registrodevoo@anac.gov.br.'
