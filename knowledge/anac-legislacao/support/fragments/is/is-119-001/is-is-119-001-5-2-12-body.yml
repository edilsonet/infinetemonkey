title: Fase 5 - Certificação
text: '5.2.12 Fase 5 - Certificação

  5.2.12.1 Após as quatro fases anteriores terem sido concluídas, o EsEC emitirá o COA e aprovará
  as EO da nova empresa de transporte aéreo com todas as autorizações, aprovações, limitações
  e isenções concedidas.

  5.2.12.2 Caso a organização requerente tenha optado por obter a certificação cumprindo requisitos
  inicialmente não aplicáveis à sua operação, conforme 5.2.9.11.4, uma observação deverá ser
  inclusa nas EO listando esses requisitos e determinando a obrigatoriedade de seu cumprimento.'
