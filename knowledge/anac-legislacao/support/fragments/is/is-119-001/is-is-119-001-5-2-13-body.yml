title: Prazos de referência do processo
text: '5.2.13 Prazos de referência do processo

  5.2.13.1 A tabela 1 apresenta diversos prazos referentes às atividades do EsEC na condução
  de um processo de certificação. Seu conteúdo não se constitui prazo regulamentar para o
  final do processo, devendo, portanto, ser encarado pela organização requerente apenas como
  parâmetro de planejamento para a proposição das datas no cronograma de eventos de certificação.

  5.2.13.2 Os prazos de processamento, por parte do EsEC, em cada fase, são os apresentados
  pela tabela 1 abaixo. Cada prazo apresentado nesta tabela será considerado a partir do recebimento
  do material pelo EsEC.

  Tabela 1 - Prazos médios para o processamento das atividades do EsEC (em dias corridos)

  Fase

  Prazo

  Evento Inicial

  Evento Final

  1

  10

  Apresentação da solicitação de informações.

  Prestação das informações básicas por parte da Anac.

  15

  Recebimento, pelo coordenador de certificação, do FOP 101.

  ROP bem sucedida e formalizada em ata.

  2

  20

  Apresentação do PSF.

  Convocação para realização da RSF.

  15

  Convocação para realização da RSF.

  Comunicação de encerramento da fase 2

  3

  120


  Comunicação de encerramento da fase 2.

  Comunicação de encerramento da fase 3.

  4

  60

  Recebimento pelo coordenador de certificação dos FOP 116 e 117, para todas as demonstrações
  requeridas.

  Comunicação de encerramento da fase 4.

  5

  10

  Comunicação de encerramento da fase 4.

  Emissão do COA e das EO.'
