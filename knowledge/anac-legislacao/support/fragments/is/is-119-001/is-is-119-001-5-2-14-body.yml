cite: 5.2.14
title: Encerramento do processo de certificação
text: '5.2.14 Encerramento do processo de certificação

  5.2.14.1 Caso seja considerado pela Anac que o processo contém não-conformidade insanável
  ou que, por qualquer outra razão, a organização requerente não está própria e adequadamente
  equipada ou não é capaz de conduzir as operações com a segurança requerida pelos RBAC aplicáveis,
  o processo será indeferido e arquivado, e o requerente formalmente comunicado.

  Nota 1: caso particular da condição acima pode ocorrer quando a proposta de um manual, programa
  ou documento é rejeitada pela 3ª vez durante a análise ou quando a demonstração da execução
  de um determinado procedimento ou operação, bem como testes de validação, é rejeitada pela
  3ª vez por não-conformidade ou incapacidade de demonstração por parte do requerente, independentemente
  do prazo.

  Nota 2: outro caso particular da condição acima pode ocorrer quando a organização requerente
  não observar o prazo de 30 dias, ou outro prazo eventualmente definido, para correção de
  pendências, deficiências ou não conformidades notificadas pela Anac.

  5.2.14.2 A organização requerente deve manter o processo de certificação ativo. Se houver
  , por período superior a 90 dias, inatividade ou adiamento para realização de inspeções
  e demonstrações ou qualquer outra ação necessária para prosseguimento das fases do processo
  de certificação, ficará caracterizada descontinuidade ou desistência do processo de certificação,
  e a Anac poderá indeferir e arquivar o processo.

  5.2.14.3 Caso haja uma mudança significativa na proposta de certificação da organização
  requerente, a Anac poderá indeferir e arquivar o processo. Situações que podem ser consideradas
  pela Anac são: alteração no tipo/modelo de aeronave, alteração na característica de operação
  regular ou não regular, e alteração no tipo de operação de transporte de carga ou passageiros.

  5.2.14.4 A utilização ou o fornecimento de dados, informações ou documentos falsos ou adulterados
  são motivos para a Anac indeferir e arquivar o processo de certificação, sem prejuízo das
  demais providências administrativas previstas na legislação contra os responsáveis.

  5.2.14.5 Um processo encerrado não pode ser reaberto, tampouco documentos contidos nele
  podem ser reutilizados, salvo por decisão de reconsideração, assegurado o direito de ampla
  defesa e do contraditório.

  5.2.14.6 Para as decisões da Anac, é assegurado ao requerente o direito de ampla defesa
  e do contraditório. Os recursos devem ser direcionados à autoridade que emitiu a decisão,
  que poderá remetê-los às instâncias superiores.

  Nota: o prazo para a apresentação de recurso contra as decisões da Anac, é de 10 dias a
  contar da ciência da decisão, conforme previsto na Lei nº 9.784/99 (Lei do processo administrativo).'
