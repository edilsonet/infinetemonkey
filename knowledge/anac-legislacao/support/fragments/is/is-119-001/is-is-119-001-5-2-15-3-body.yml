text: '5.2.15.3 A Anac é representada em fiscalizações e ensaios por servidores qualificados
  na área específica de inspeção.

  5.2.15.4 O setor da Anac encarregado de conduzir os processos de verificação das condições
  de exploração de serviços aéreos para empresas brasileiras, de acordo com a Resolução nº
  659, de 2 de fevereiro de 2022, é a Coordenadoria de Serviços Aéreos e Demandas Institucionais
  (CSDI) da SPO.

  5.2.15.5 O setor da Anac encarregado de conduzir os processos relacionados à aeronavegabilidade
  de aeronaves, incluindo a inspeção de aeronaves e a suspensão de certificados de aeronavegabilidade,
  é a Gerência de Certificação de Aeronavegabilidade Continuada (GCAC) da SPO.'
