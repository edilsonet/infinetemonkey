title: Responsabilidade pelos processos de certificação
text: '5.2.15 Responsabilidade pelos processos de certificação

  5.2.15.1 Para as organizações que pretendam se certificar como operador de serviço de transporte
  aéreo regido de acordo com os requisitos operacionais do RBAC nº 121, o EsEC é a Gerência
  de Operações de Empresas de Transporte Aéreo - 121 (GCTA) da Superintendência de Padrões
  Operacionais (SPO).'
