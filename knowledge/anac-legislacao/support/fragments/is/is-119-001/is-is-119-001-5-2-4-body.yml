title: Modelos de formulários e modelos de currículos
text: '5.2.4 Modelos de formulários e modelos de currículos

  5.2.4.1 Os formulários FOP e os modelos de currículos mencionados nesta IS têm por finalidade
  padronizar o fluxo de informações das organizações requerentes para a Anac e vice-versa,
  assim como padronizar o fluxo de informações entre setores internos da Anac, objetivando
  a agilização do processo de certificação. A utilização desses formulários e modelos é um
  meio aceitável de cumprimento do RBAC 119.35(a)(1) e (a)(2).

  5.2.4.2 Os respectivos modelos de formulários e currículos, em sua versão mais atualizada,
  estão disponíveis para o usuário em formato editável no sítio da Anac na rede mundial de
  computadores, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.4.3 O usuário pode editar os modelos de formulários e currículos para formato alternativo,
  conforme sua conveniência, excluindo campos eventualmente desnecessários à sua condição
  específica de certificação, suspensão, revogação de suspensão ou revogação de COA, desde
  que essa edição seja aceita pelo EsEC e que todas as informações requeridas sejam apresentadas
  no formato alternativo proposto.

  5.2.4.4 O usuário fica ciente de que alterações significativas de forma nos modelos de formulários
  e currículos, que comprometam a padronização do fluxo de informações, podem afetar o prazo
  final de certificação da organização requerente.

  5.2.4.5 Os FOP aplicáveis aos processos de certificação para operação segundo o RBAC nº
  121 são listados a seguir, sinalizados como de emissão pelos requerentes (Req.) ou pela
  Anac (Anac):'
