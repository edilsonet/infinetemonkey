title: Regime de portais do processo
text: '5.2.5 Regime de portais do processo

  5.2.5.1 O processo de certificação adotado pela Anac impõe um regime de portais, ou seja,
  somente se pode considerar que uma fase esteja encerrada caso todos os requisitos da fase
  tenham sido cumpridos.

  5.2.5.2 Se houver não-conformidades na documentação apresentada pela organização requerente,
  o processo será sobrestado até a regularização. Caso haja atraso significativo para a regularização
  da documentação, pode ser solicitado pelo EsEC ajuste no cronograma de eventos de certificação
  (FOP 103), com envio de um novo FOP 103, em substituição ao último.

  5.2.5.3 Se a organização requerente deixar de atender um ou mais requisitos anteriormente
  atendidos que lhe permitiram o prosseguimento de fase, o processo poderá retornar à fase
  anterior até a satisfação dos referidos requisitos.

  5.2.5.4 Se a organização requerente pretender fazer alterações nas características do processo
  de certificação em curso, o processo poderá retornar a fases anteriores, dependendo da complexidade
  da alteração.'
