title: Representantes e pessoas de contato da organização requerente
text: '5.2.6 Representantes e pessoas de contato da organização requerente

  5.2.6.1 As comunicações, interações e documentos necessários ao processo de certificação
  somente serão aceitos se realizados pelas pessoas legalmente designadas pela organização
  requerente, respeitadas as respectivas áreas de atuação. Os representantes não-técnicos
  legalmente designados podem receber orientações gerais sobre a documentação encaminhada
  ao EsEC pela organização requerente.

  5.2.6.2 São consideradas pessoas legalmente designadas pela organização requerente o gestor
  responsável, os indicados para os cargos de pessoal de administração requerido e os procuradores
  legalmente constituídos.

  5.2.6.3 Não obstante os parágrafos 5.2.6.1 e 5.2.6.2 e visando otimizar as interações entre
  a Anac e a organização requerente, detalhes envolvendo atendimento de requisitos técnicos
  somente serão fornecidos ao pessoal da direção da organização requerente ou ao pessoal técnico
  por ela indicado encarregado de providenciar o cumprimento do requisito técnico.'
