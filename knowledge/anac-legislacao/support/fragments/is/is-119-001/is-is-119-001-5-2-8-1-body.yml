title: Solicitação de informações
text: '5.2.8.1 Solicitação de informações

  5.2.8.1.1 A organização interessada deve entrar em contato com o EsEC, informando-o de sua
  intenção de obter um COA. Esse contato inicial pode ser realizado através de carta, correio
  eletrônico, telefone, fax, visita (mediante contato prévio), etc., para permitir que as
  informações básicas e gerais da certificação possam ser apresentadas e discutidas.

  5.2.8.1.2 Se após esse contato inicial a organização mantiver sua intenção e pretender avançar
  com a certificação, o gestor responsável, ou seu representante legal, deverá preencher o
  formulário FOP 101 e protocolar a documentação na Anac.

  5.2.8.1.3 As datas propostas pela organização requerente para a ROP, apresentadas no FOP
  101, devem ser, no mínimo, o equivalente ao período de 10 (dez) dias após a data do protocolo
  do FOP 101 na Anac.

  5.2.8.1.4 O FOP 101 possui campos para que sejam informadas as autorizações para operações
  especiais que a organização requerente pretende obter no processo de certificação. Essas
  informações são essenciais para que o coordenador de certificação e a equipe de certificação
  possam se preparar para a ROP.

  5.2.8.1.5 O gerente do setor do EsEC designará um coordenador de certificação para conduzir
  o processo de certificação da organização requerente e coordená-lo junto à equipe de certificação.

  5.2.8.1.6 O coordenador de certificação verificará a conformidade dos documentos citados
  no parágrafo 5.2.8.1.2 desta IS, bem como encaminhará para análise dos integrantes da equipe
  de certificação, se necessário, que informarão ao EsEC o parecer sobre a documentação. Caso
  haja não-conformidades, a organização requerente será informada pelo EsEC por meio de ofício,
  com a descrição das não-conformidades verificadas.

  5.2.8.1.7 A aceitação dos documentos citados no parágrafo 5.2.8.1.2 desta IS pelo EsEC,
  inicia formalmente o processo para que uma organização possa obter um COA. O EsEC comunicará
  a aceitação do documento à organização interessada , informando o número de protocolo do
  processo de certificação e a data agendada para a ROP entre o pessoal de administração requerido
  da organização requerente e o coordenador de certificação, juntamente com a equipe de certificação,
  em local a ser estabelecido pelo EsEC.

  5.2.8.1.8 O coordenador de certificação será a principal via de comunicação entre a organização
  requerente e a Anac. Entretanto, as comunicações e interações relacionadas aos processos
  de análise de manuais, programas e documentos, na fase 3, e inspeções e demonstrações, na
  fase 4, que estejam sob responsabilidade dos demais integrantes da equipe de certificação,
  poderão ser realizadas com o próprio integrante da equipe de certificação que estiver encarregado
  da análise do processo, visando agilizar a interação.'
