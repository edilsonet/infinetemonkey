title: Revogado.
text: '5.2.8.2.4 Revogado.

  5.2.8.2.5 A ROP somente será considerada satisfatória se o coordenador de certificação e
  a equipe de certificação estiverem convencidos de que os representantes da organização requerente
  compreenderam plenamente o processo de certificação a ser conduzido pela Anac e suas responsabilidades
  neste processo. Uma ROP bem-sucedida, devidamente registrada em ata ou memória de reunião,
  é o ato que encerra a fase 1 do processo de certificação. A partir deste momento, a organização
  requerente deverá proceder à elaboração de todos os manuais e demais documentos requeridos
  para a certificação.

  5.2.8.2.6 Ao longo de todo o processo de certificação, reuniões adicionais poderão ser solicitadas
  pelo EsEC ou pela organização requerente, que deverão ser registradas e anexadas ao processo
  de certificação.'
