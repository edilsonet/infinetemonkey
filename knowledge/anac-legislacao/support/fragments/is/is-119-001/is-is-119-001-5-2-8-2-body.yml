title: Reunião de Orientação Prévia - ROP
text: '5.2.8.2 Reunião de Orientação Prévia - ROP

  5.2.8.2.1 O objetivo da ROP é confirmar as informações fornecidas pela organização requerente
  do COA, além de prover-lhe informações críticas sobre o processo, questões práticas, bem
  como esclarecer quaisquer dúvidas relativas ao PSF. Devem comparecer à ROP o gestor responsável
  da empresa e demais membros da administração requerida indicados no FOP 101. Além disso,
  esses profissionais devem estar preparados para discutir, em termos gerais, os planos e
  os aspectos específicos da operação pretendida.

  5.2.8.2.2 A organização requerente receberá, durante a ROP, instruções sobre a elaboração
  dos manuais, programas e documentos que deverão ser apresentados ao longo das 5 fases do
  processo, sobre as inspeções e demonstrações que fazem parte da fase 4 e sobre as respectivas
  taxas (TFAC) que deverão ser recolhidas e cujos dados de pagamento ou comprovantes de pagamento
  deverão ser enviados para compor os processos associados.

  5.2.8.2.3 Caso a organização requerente tenha manifestado interesse em obter autorização
  para operações especiais que não fazem parte do escopo básico da certificação inicial, serão
  fornecidas informações sobre o processo para obtenção dessas autorizações, baseadas nas
  respectivas IS/IAC que tratam dos assuntos. Na ausência de IS/IAC publicada sobre alguma
  operação especial pretendida, o coordenador de certificação irá informar na ROP detalhes
  do processo e as referências que deverão ser utilizadas.'
