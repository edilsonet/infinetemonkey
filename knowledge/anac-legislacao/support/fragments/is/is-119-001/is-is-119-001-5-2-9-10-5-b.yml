title: 5.2.9.10.5(b)
text: 'b) manual de operações da aeronave (AOM) de todas as aeronaves que serão empregadas
  na operação, caso a organização não adote o AFM, conforme IS nº 121-004;

  Nota: os procedimentos operacionais padronizados (SOP), guias de referência rápida (QRH)
  e análises de pistas são considerados parte do AOM.'
