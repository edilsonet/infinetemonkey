title: 5.2.9.10.5(o)
text: 'o) programa de manutenção de aeronavegabilidade continuada (PMAC) e seus elementos,
  conforme IS nº 120-016;

  Nota: fazem parte do conceito do PMAC, entre outros, o manual geral de manutenção (MGM),
  o programa de manutenção (PMnt), o programa de treinamento de manutenção (PTM), o sistema
  de análise e supervisão continuada (SASC) e o programa de confiabilidade da manutenção.'
