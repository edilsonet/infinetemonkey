title: 5.2.9.10.5(r)
text: 'r) outros documentos e manuais, se requeridos em outros normativos específicos para
  alguma autorização especial pretendida.

  Nota: o requerente deve possuir ainda um programa de segurança do operador aéreo (PSOA),
  como parte da certificação AVSEC. Orientações podem ser encontradas no sítio da Anac, no
  endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/aerodromos/avsec/operador-aereo-1.'
