title: Sistema de documentos de segurança operacional
text: '5.2.9.10 Sistema de documentos de segurança operacional

  5.2.9.10.1 O sistema de documentos de segurança operacional contém informações sobre as
  políticas gerais da organização requerente, deveres e responsabilidades dos tripulantes
  e do pessoal de solo, descrição dos treinamentos, sistemas das aeronaves, política de controle
  operacional e procedimentos específicos de operações e manutenção.

  5.2.9.10.2 O RBAC nº 121 requer que o sistema de documentos de segurança operacional inclua
  as instruções e as informações necessárias para permitir o desempenho de operações seguras
  de voo e de solo. A descrição do conteúdo do sistema de documentos de segurança operacional
  pode ser encontrada no RBAC nº 121, assim como nas instruções suplementares que tratam especificamente
  dos próprios manuais e programas e das autorizações para operações específicas.

  Nota: o Apêndice F contém orientações sobre o sistema de documentos de segurança operacional
  referente a funções de responsabilidade do requerente, porém desempenhadas por operador
  congênere do mesmo grupo econômico com certificação válida emitida pela Anac ou, sujeito
  à avaliação da Anac, por autoridade de aviação civil estrangeira.

  5.2.9.10.3 A organização requerente deverá estabelecer o sistema de documentos de segurança
  operacional considerando os aspectos de organização, validação, elaboração, implementação,
  emendas e comunicação previstos na IS nº 121-010.

  5.2.9.10.4 O sistema de documentos de segurança operacional deverá estar desenvolvido para
  entrega junto com o FOP 104. A Anac reconhece que a compra ou leasing de uma aeronave pode
  não estar completamente definida no início do processo de certificação, porém o requerente
  deve encaminhar para avaliação seus manuais e programas específicos (de operações e de manutenção)
  tão desenvolvidos quanto possam estar em face do tipo de aeronave a ser empregado em suas
  operações.'
