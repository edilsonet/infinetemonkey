title: Declaração de conformidade
text: '5.2.9.11 Declaração de conformidade

  5.2.9.11.1 A organização requerente deverá encaminhar como anexo ao FOP 104 uma declaração
  de conformidade referenciando todas as seções e parágrafos dos normativos aplicáveis à operação
  pretendida pela organização requerente, com o correspondente método de conformidade a ser
  adotado por ela ou uma indicação de que o requisito não lhe seja aplicável.

  5.2.9.11.2 As subpartes pertinentes e cada seção e parágrafo deverão ser identificados e
  acompanhados de uma breve descrição do método de conformidade ou, preferencialmente, por
  referência específica a um manual, programa ou algum outro documento que contenha a descrição
  do procedimento proposto para atender ao requisito.

  5.2.9.11.3 A declaração de conformidade deve ser assinada pelo gestor responsável ou pelos
  diretores de operações de manutenção da organização requerente do COA.

  5.2.9.11.4 Caso a organização requerente tenha optado por obter a certificação cumprindo
  requisitos inicialmente não aplicáveis à sua operação e caso a Anac permita essa opção,
  esses requisitos passam a ser de cumprimento obrigatório e deverão constar na declaração
  de conformidade. Por exemplo, uma organização requerendo certificação para operações não
  regulares pode optar por realizar despacho de seus voos de acordo com as regras aplicáveis
  a operações regulares. Nesse caso, os requisitos aplicáveis a despacho de voos em operações
  regulares passam a ser de cumprimento obrigatório.'
