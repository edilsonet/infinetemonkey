title: 5.2.9.13(k)
text: 'k) áreas e edificações necessárias às operações.

  5.2.9.13.3 Os contratos e documentos de compra dos itens descritos em 5.2.9.13.2 desta IS
  podem não estar, ainda, disponíveis até o início da fase 2 do processo de certificação,
  porém deverão ser apresentados, obrigatoriamente, até o início da fase 4. Entretanto, para
  o início da fase 2, a organização requerente deverá apresentar pelo menos as cartas de intenção
  ou documentos equivalentes referentes aos equipamentos, instalações e serviços pretendidos,
  com informações suficientes que permitam a análise detalhada do pacote de solicitação formal
  na fase 3 do processo de certificação.'
