title: Solicitação e plano de formação do quadro inicial de instrutores e examinadores
text: '5.2.9.14 Solicitação e plano de formação do quadro inicial de instrutores e examinadores

  5.2.9.14.1 Para iniciar suas operações a organização requerente deverá dispor de um número
  adequado de instrutores e examinadores de forma a viabilizar a qualificação de seus tripulantes
  e DOVs segundo os requisitos previstos no RBAC nº 121.

  5.2.9.14.2 Caso deseje, a organização requerente poderá valer-se do procedimento descrito
  no Apêndice D para formar seu quadro inicial de instrutores e examinadores.'
