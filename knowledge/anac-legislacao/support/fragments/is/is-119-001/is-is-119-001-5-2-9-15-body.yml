text: '5.2.9.15 Solicitações de isenção ou nível equivalente de segurança

  5.2.9.15.1 Caso a organização requerente pretenda solicitar alguma isenção ou reconhecimento
  de nível equivalente de segurança quanto ao cumprimento de requisito estabelecido pela Anac
  em RBAC, Resolução ou Condição Especial, deve fazê-lo de acordo com o previsto no RBAC nº
  11.'
