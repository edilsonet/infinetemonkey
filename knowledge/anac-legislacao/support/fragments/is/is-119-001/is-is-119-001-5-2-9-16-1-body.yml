text: '5.2.9.16.1 Se o PSF for considerado aceitável, a Anac irá convocar a organização requerente
  para realização de uma reunião de solicitação formal (RSF).

  5.2.9.16.2 Deverá, obrigatoriamente, comparecer à RSF todo o pessoal de administração requerido
  da organização requerente, que também contará com as presenças do coordenador de certificação
  e da equipe de certificação. O não comparecimento à RSF de algum dos membros da administração
  requerida poderá ser motivo suficiente para o cancelamento da reunião e agendamento de nova
  data.'
