title: Revogado.
text: '5.2.9.16.4 Revogado.

  5.2.9.16.5 A RSF servirá para resolver quaisquer questões pendentes da parte da Anac ou
  da organização requerente a respeito do processo de certificação e estabelecer um entendimento
  comum entre as partes sobre as fases seguintes do processo. O cronograma de eventos de certificação
  proposto no FOP 103 será discutido e acordado, e eventuais ajustes e conflitos de datas
  também serão resolvidos.'
