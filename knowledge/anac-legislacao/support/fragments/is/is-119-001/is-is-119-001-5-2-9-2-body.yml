text: '5.2.9.2 O PSF, composto pelo FOP 104 e seus anexos, listados no parágrafo 5.2.9.6 desta
  IS, deve ser protocolado na Anac para que seja iniciada a fase 2.

  5.2.9.3 Durante esta fase, os servidores conduzirão uma avaliação preliminar dos documentos
  apresentados, com o objetivo de verificar se todos os manuais, programas e documentos requeridos
  foram entregues e se estão no formato requerido pelos regulamentos aplicáveis.

  5.2.9.4 Caso haja erros ou omissões, o processo será sobrestado até a regularização, o que
  poderá gerar atrasos no cronograma de eventos de certificação, demandando o envio de novo
  FOP 103. A organização requerente será informada das não-conformidades verificadas para
  que sejam sanadas.

  5.2.9.5 Se as informações do PSF forem consideradas satisfatórias, o EsEC notificará a organização
  requerente sobre a aceitação do pacote e solicitará a realização da reunião de solicitação
  formal (RSF), conforme o parágrafo 5.2.9.16 desta IS.'
