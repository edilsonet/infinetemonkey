text: 'i) outros documentos ou manuais, a critério da organização requerente ou solicitados
  pelo coordenador de certificação do EsEC, durante a ROP.

  5.2.9.6.4 Caso alguma nova autorização seja solicitada pela organização requerente ou caso
  a Anac considere necessário, a Anac poderá solicitar a apresentação de quaisquer outros
  manuais, programas e documentos ao longo do processo de certificação.'
