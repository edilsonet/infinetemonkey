text: '5.2.9.7.1 A organização requerente deve utilizar o esboço das EO para informar as autorizações
  que pretende obter para executar as suas operações pretendidas.

  5.2.9.7.2 O esboço das EO permite que a organização requerente detalhe adequadamente a abrangência
  de cada autorização solicitada. Por exemplo, a organização requerente pode solicitar autorização
  para operações ILS CAT II somente para um dos modelos de aeronave que pretende operar. O
  esboço das EO viabiliza a informação desse nível de detalhe.

  5.2.9.7.3 O modelo das EO está disponível para consulta no sítio da Anac, no endereço eletrônico:
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.9.7.4 Recomenda-se que a organização requerente aponte no esboço das EO somente as autorizações
  essenciais para viabilizar seu plano de negócios inicial. Dessa forma, o processo de certificação
  inicial tende a ser menos complexo, o que pode reduzir sua duração.'
