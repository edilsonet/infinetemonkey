family: '119'
section_id: 5.2.9.8.2
section_title: 'Em anexo ao PSF devem constar os seguintes documentos referentes aos indicados
  para as posições de administração requerida:'
subsection_id: f
cite: 5.2.9.8.2(f)
title: 5.2.9.8.2(f)
text: 'f) nos casos do diretor ou gerente de manutenção e inspetor chefe (nos casos requeridos,
  conforme parágrafo C7(b)(I)(B) desta IS), a comprovação de possuir, no seu conselho de fiscalização
  da profissão, registro de atribuições compatíveis com o requerido no RBAC nº 119, que pode
  ser feita por uma das seguintes formas:

  I - a Anac pode consultar as bases do conselho com o número de CPF da pessoa;

  II - a pessoa pode apresentar os comprovantes, caso os tenha à mão; ou

  III - a pessoa pode fornecer uma declaração escrita e assinada, nos termos do parágrafo
  único do art. 3º do Decreto nº 9.094, de 17 de julho de 2017.

  5.2.9.8.3 Conforme 119.65(b) do RBAC nº 119, a Anac pode aprovar posições ou número de posições
  diferentes daquelas listadas em 119.65(a) para uma particular operação, se a organização
  requerente demonstrar que pode realizar essa operação com o mais alto grau de segurança
  com essa configuração devido:'
