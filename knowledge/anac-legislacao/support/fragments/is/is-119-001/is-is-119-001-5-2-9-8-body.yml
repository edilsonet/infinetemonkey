title: Cadastro do pessoal de administração requerido
text: '5.2.9.8 Cadastro do pessoal de administração requerido

  5.2.9.8.1 As seções 119.65 e 119.67 do RBAC nº 119 estabelecem para empresas que operam
  segundo o RBAC nº 121 posições administrativas básicas e qualificações mínimas para ocupar
  tais posições. Na seleção e designação do pessoal de administração requerido, devem ser
  observados os critérios estabelecidos no Apêndice C desta IS.'
