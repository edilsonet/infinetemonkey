title: Cronograma de eventos de certificação
text: '5.2.9.9 Cronograma de eventos de certificação

  5.2.9.9.1 O cronograma de eventos de certificação é um documento que lista os eventos e
  etapas relevantes do processo de certificação, cujas datas propostas serão discutidas e
  acordadas durante a RSF. Depois de aceito pelo EsEC e pela organização requerente, ele se
  constituirá na ferramenta de controle do restante do processo, porque especificará todos
  os prazos de cumprimento das tarefas associadas.

  5.2.9.9.2 O cronograma de eventos de certificação lista as datas nas quais itens, atividades,
  programas, aeronaves e instalações devem estar prontos para a inspeção a ser conduzida pela
  equipe de certificação na fase 4 do processo. Tais datas estimadas devem seguir uma lógica
  em termos de sequência. Na definição do cronograma também deve ser considerada a capacidade
  da empresa, em termos de tempo, para responder questionamentos e solucionar não-conformidades
  durante o processo de certificação, assim como preparar suas instalações, equipamentos,
  aeronaves e pessoal para as inspeções e demonstrações requeridas. Para demonstrações e inspeções
  que requeiram o deslocamento de servidores da Anac a diferentes cidades ou ao exterior,
  é necessária a comunicação com antecedência suficiente para permitir a realização dos trâmites
  burocráticos internos da Agência. Essa necessidade deve ser considerada no momento da elaboração
  do FOP 103.

  5.2.9.9.3 A falta de atendimento satisfatório de uma atividade prevista no cronograma de
  eventos ou o seu não cumprimento na data acordada poderá atrasar a certificação. A qualquer
  tempo durante o processo, se a organização requerente ou o EsEC entenderem que é necessária
  uma revisão das datas de alguns dos eventos listados no cronograma de eventos de certificação,
  uma nova coordenação entre as partes deve ser providenciada o mais rápido possível, por
  iniciativa da organização requerente ou do EsEC, conforme o caso.'
