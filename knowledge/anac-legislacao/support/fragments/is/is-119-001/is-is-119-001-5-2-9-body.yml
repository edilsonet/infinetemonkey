text: '5.2.9 Fase 2 - Solicitação Formal

  5.2.9.1 De acordo com o parágrafo 119.35(a) do RBAC nº 119, uma solicitação formal para
  obtenção do COA deverá ser realizada por meio de um PSF. A apresentação do PSF é o ato que
  inicia a fase 2 do processo de certificação.'
