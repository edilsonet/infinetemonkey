cite: 5.3.1.2
title: Qualquer alteração no COA implica também em alteração nas EO.
text: '5.3.1.2 Qualquer alteração no COA implica também em alteração nas EO.

  5.3.1.3 Toda solicitação de alteração de COA e das EO deve ser encaminhada ao EsEC responsável
  pela supervisão operacional da empresa no momento, por meio do FOP 119, com a documentação
  necessária em anexo, pelo menos 45 dias antes da data pretendida da entrada em vigor da
  alteração - com exceção da alteração de endereço da sede administrativa, da base principal
  de operações ou da base principal de manutenção, para a qual se aplica o prazo de 90 dias,
  conforme o parágrafo 119.47(b) do RBAC nº 119. Somente após a distribuição do processo aos
  seus respectivos setores, haverá interação diretamente da empresa com o setor da área específica.

  Nota 1: não obstante o parágrafo acima, os prazos de referência para o processo são aqueles
  descritos na seção 5.2.13 desta IS, dependendo da extensão e da complexidade das alterações
  propostas. Recomenda-se que o FOP 119 seja apresentado com antecedência, a critério do operador,
  de forma a aumentar a probabilidade de conclusão no prazo solicitado.

  Nota 2: referente ao prazo para pessoal de administração requerida, ver o parágrafo C10
  do Apêndice C desta IS.

  5.3.1.4 Quando houver simultaneidade de modificações, devem ser atendidas as exigências
  descritas de cada uma delas, sem, no entanto, haver necessidade de duplicidade de documentos.

  5.3.1.5 As revisões e elaborações de manuais e programas ou qualquer documentação requerida,
  como também os procedimentos operacionais, devem seguir a IS nº 121-010, salvo se de outra
  forma especificado nesta seção.

  Nota: a critério do EsEC, pode ser exigida a realização de uma ROP para esclarecimento e
  ajustes do processo de alteração do COA e das EO.

  5.3.1.6 Recomenda-se que a empresa de transporte aéreo entre em contato com o EsEC para
  obtenção de orientação prévia antes de solicitar formalmente alterações de COA e EO.'
