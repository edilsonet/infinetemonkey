title: Disposições Gerais
text: '5.3.1 Disposições Gerais

  Nota: para os processos de alteração do COA e das EO, pode ser aplicável a exigência de
  TFAC, de acordo com as orientações contidas na seção 5.2.7 desta IS. Nestes casos, devem
  ser apresentados dados de pagamento ou comprovante de pagamento da TFAC, conforme os procedimentos
  e prazos detalhados nas mesmas orientações.

  5.3.1.1 O processo de alteração do COA e das EO é similar ao processo de certificação de
  empresa de transporte aéreo, guardadas as proporções, podendo ser menos complexo e demorado
  dependendo do tipo de alteração pretendida. Esta seção apresenta os meios de cumprimento
  aceitáveis para os parágrafos 119.41(a)(2) e (c) do RBAC nº 119, no que se refere à solicitação
  de alteração do COA, e 119.51(a)(2) e (c) do RBAC nº 119, no que se refere à solicitação
  de alteração das EO.'
