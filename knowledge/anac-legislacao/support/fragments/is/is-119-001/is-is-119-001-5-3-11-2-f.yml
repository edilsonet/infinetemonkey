section_title: 'Aprovação de revisão da LBM. Neste modo, para alteração de autorização de
  execução de manutenção, a seguinte documentação deve ser encaminhada à Anac:'
subsection_id: f
cite: 5.3.11.2(f)
title: 5.3.11.2(f)
text: 'f) revisão de procedimento do sistema de documentos de segurança operacional, conforme
  necessário. Não é necessário o protocolo do manual inteiro revisado, mas tão somente o protocolo
  do procedimento específico revisado, que, uma vez aceito pela Anac, deverá ser incorporado
  no manual pertinente em até 90 dias.

  5.3.11.2.2 As declarações requeridas neste processo devem ser assinadas pelo diretor ou
  gerente de manutenção ou por pessoa com delegação explícita no sistema de documentos de
  segurança operacional da empresa.'
