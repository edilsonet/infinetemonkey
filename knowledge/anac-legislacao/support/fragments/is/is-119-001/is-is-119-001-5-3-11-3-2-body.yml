text: '5.3.11.3.2 A Anac pode, a qualquer momento, verificar o cumprimento dos requisitos
  aplicáveis.

  5.3.11.3.3 Caso haja atualização da LBM em desacordo com os procedimentos para aceitação
  da LBM revisada ou com os requisitos vigentes, o detentor de certificado fica sujeito a
  providências administrativas, nos termos da Resolução nº 472/2018, ou norma que vier a substituí-la,
  assim como a suspensão desta prerrogativa por até 12 meses.


  5.3.11.4 Procedimento para gestão de LBM no MGM. Os detentores de certificado devem apresentar
  em seu MGM procedimento, a ser expressamente aprovado pela Anac, para gerir uma Lista de
  Bases de Manutenção (LBM). O procedimento deve conter:'
