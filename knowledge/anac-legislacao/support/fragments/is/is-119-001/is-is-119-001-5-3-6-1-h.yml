section_title: 'Para a alteração de pessoal de administração, a seguinte documentação é necessária:'
subsection_id: h
cite: 5.3.6.1(h)
title: 5.3.6.1(h)
text: 'h) somente para diretor ou gerente de manutenção e inspetor chefe (nos casos requeridos,
  conforme parágrafo C7(b)(I)(B) desta IS), a comprovação de possuir, no seu conselho de fiscalização
  da profissão, registro de atribuições compatíveis com o requerido no RBAC nº 119, que pode
  ser feita por uma das seguintes formas:

  I - a Anac pode consultar as bases do conselho com o número de CPF da pessoa;

  II - a pessoa pode apresentar os comprovantes, caso os tenha à mão; ou

  III - a pessoa pode fornecer uma declaração escrita e assinada, nos termos do parágrafo
  único do art. 3º do Decreto nº 9.094, de 17 de julho de 2017;'
