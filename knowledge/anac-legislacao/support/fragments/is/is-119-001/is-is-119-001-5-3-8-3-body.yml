text: '5.3.8.3 A partir da realização da ROP, o processo deve ser conduzido conforme estabelece
  a seção 5.2 desta IS e acordado na referida reunião.

  5.3.8.4 Até a conclusão do processo de inclusão de aeronave, salvo parecer desfavorável
  de algum setor envolvido, o operador pode utilizar a aeronave em operações não comerciais,
  nos termos da legislação em vigor.'
