title: Inclusão ou alteração de tipo OACI, modelo ou configuração de aeronave na frota
text: '5.3.8 Inclusão ou alteração de tipo OACI, modelo ou configuração de aeronave na frota

  5.3.8.1 De acordo com os parágrafos 119.49(a)(4)(ii) e (b)(4)(ii) do RBAC nº 119, um operador
  não pode operar aeronaves que não tenham sido previamente autorizadas em suas EO.'
