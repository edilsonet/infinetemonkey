title: 5.3.9.1(g)
text: 'g) declaração de conformidade atualizada.

  Nota: deve se atentar se a alteração proposta não implica também em uma alteração das características
  de certificação de operador de serviço de transporte aéreo, conforme a seção 5.3.4 desta
  IS.

  5.3.9.2 Para a alteração de autorizações especiais (RVSM, CAT II/III, CAT I AR, LVTO, NAT
  HLA, ETOPS, PBN, utilização de EFB, uso expandido de PED, operação de intercâmbio de aeronaves,
  operação em terreno desabitado, operação sobre grandes extensões de água, operação nos aeroportos
  Santos Dumont (SBRJ) ou Congonhas (SBSP)), a seguinte documentação é necessária:'
