title: Revisão de manuais sem alteração do COA ou das EO
text: '5.4.1 Revisão de manuais sem alteração do COA ou das EO

  5.4.1.1 Os manuais e programas que forem revisados, cuja revisão não implique alterações
  de dados do COA ou das EO, devem ser encaminhados diretamente aos setores responsáveis,
  juntamente com os dados de pagamento das TFAC (se aplicáveis), os quais interagirão diretamente
  com o operador, não sendo necessária a remessa de qualquer documentação ao EsEC.'
