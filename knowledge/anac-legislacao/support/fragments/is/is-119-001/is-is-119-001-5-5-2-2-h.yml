title: 5.5.2.2(h)
text: 'h) o não cumprimento das condições estabelecidas no parágrafo C10.4 desta IS, referentes
  a alteração e vacância do pessoal de administração requerido.

  5.5.2.3 A Anac poderá suspender o COA da empresa de transporte aéreo em decorrência de processo
  sancionatório instaurado nos termos da Resolução Anac nº 472/2018, ou norma que vier a substituí-la,
  como previsto nos Art. 289 e 299 do Código Brasileiro de Aeronáutica.'
