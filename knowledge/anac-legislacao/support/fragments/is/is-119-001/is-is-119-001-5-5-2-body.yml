title: Suspensão do COA pela Anac
text: '5.5.2 Suspensão do COA pela Anac

  5.5.2.1 A Anac poderá suspender cautelarmente o COA de uma empresa de transporte aéreo,
  sem a prévia manifestação do interessado, de acordo com o parágrafo 119.41(b) do RBAC nº
  119 e o Art. 45 da Lei nº 9.784/1999 caso constate o não cumprimento de requisitos técnico-operacionais
  que configurem risco iminente à segurança operacional.'
