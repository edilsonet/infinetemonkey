section_title: Revogação da Suspensão do COA
subsection_id: a
cite: 5.5.3(a)
title: 5.5.3(a)
text: 'a) plano de ações corretivas com descrição detalhada das ações, prazos e responsáveis
  necessários para recuperar as condições de certificação. O plano deve incluir as ações para
  demonstrar a correção das não-conformidades, caso o COA tenha sido suspenso pela Anac por
  ocorrência de não-conformidade. O prazo total para conclusão das ações necessárias deve
  ser igual ou inferior a 360 dias.

  5.5.3.2 Caso seja requerido pela Anac, ou a empresa pretenda, alterar o COA, as EO e/ou
  seus manuais, simultaneamente ao processo de revogação de suspensão do COA, deve seguir
  as instruções das seções 5.3 ou 5.4 desta IS, conforme aplicável.'
