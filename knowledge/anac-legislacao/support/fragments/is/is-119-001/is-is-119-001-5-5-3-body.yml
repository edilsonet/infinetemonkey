text: '5.5.3 Revogação da Suspensão do COA

  5.5.3.1 Para iniciar o processo de revogação da suspensão de seu COA, a empresa de transporte
  aéreo deverá fazer a solicitação ao EsEC que o suspendeu por meio do FOP 122, em até 90
  dias após a data de suspensão do COA, instruindo seu processo com o seguinte documento:'
