text: 'b) um dos seguintes 3 grupos de características: operações regulares nacionais, operações
  regulares internacionais e operações não regulares (independentemente de serem nacionais
  ou internacionais).

  5.8.2 Se o detentor de certificado não conduzir uma característica de operação para a qual
  está autorizado por suas especificações operativas, dentro do número de dias calendáricos
  previstos no parágrafo anterior, não poderá conduzir a mesma característica de operação,
  a menos que ele avise à Anac pelo menos 15 dias calendáricos consecutivos antes de retomar
  aquela característica de operação.

  5.8.3 O aviso à Anac deve incluir as datas, horários e locais previstos para retomada das
  operações, bem como resultado de autoavaliação que demonstre que o detentor de certificado
  permanece adequadamente equipado e capaz de conduzir as operações em segurança. A autoavaliação
  deve abordar:'
