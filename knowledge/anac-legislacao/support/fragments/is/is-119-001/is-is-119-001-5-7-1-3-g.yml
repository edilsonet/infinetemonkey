text: 'g) quaisquer outras informações julgadas relevantes.

  5.8.4 O detentor de certificado deve estar disponível e acessível durante o período previsto
  em 5.8.2 para a eventualidade de a Anac decidir conduzir uma inspeção e reexame para verificar
  se o detentor de certificado permanece adequada e propriamente equipado e capaz de conduzir
  operações seguras.'
