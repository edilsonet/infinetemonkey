title: Cassação do COA por parte da Anac
text: '5.7.1 Cassação do COA por parte da Anac

  5.7.1.1 A Anac poderá cassar o COA de uma empresa de transporte aéreo, em decorrência de
  processo sancionatório instaurado nos termos da Resolução Anac nº 472/2018, ou norma que
  vier a substituí-la, como previsto nos Art. 289 e 299 do Código Brasileiro de Aeronáutica.'
