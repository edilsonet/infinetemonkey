title: apendice-c-pessoal-de-administracao-requerido(a)
text: 'a) Cabe ao profissional determinar, gerir e essencialmente decidir sobre as atividades
  do detentor de certificado visando à manutenção das aeronaves da frota em condições seguras
  de voo. Para alcançar esse objetivo, são algumas atividades típicas do cargo:

  I - gerenciar as atividades da empresa visando ao cumprimento do programa de manutenção
  das aeronaves (aprovado ou recomendado pelo fabricante, conforme aplicável), incluindo as
  diretrizes de aeronavegabilidade e demais tarefas de manutenção pertinentes;

  II - garantir o cumprimento dos requisitos de manutenção previstos na regulamentação pertinente
  e aplicáveis à empresa;

  III - garantir a adequada liberação para voo após serviços de manutenção, manutenção preventiva
  ou alteração, assim como a designação adequada das pessoas autorizadas a realizar tal liberação;

  IV - assegurar o adequado funcionamento, através de um sistema de gestão, de toda a estrutura
  organizacional sob sua responsabilidade, incluindo, quando aplicável, setor de biblioteca,
  controle de manutenção, engenharia, pesquisa/correção de falhas (troubleshooting), setores
  de ferramentaria, estocagem de materiais e logística, avaliando a disponibilidade de recurso
  humano capacitado e suficiente para a realização das atividades;

  V - definir, aplicar e verificar a aderência dos funcionários aos procedimentos previstos
  na última revisão aceita do Manual Geral de Manutenção da empresa;

  VI - assegurar que todos os funcionários com funções ligadas à manutenção e à aeronavegabilidade
  da frota estejam devidamente capacitados e qualificados para exercerem tais funções; e

  VII - atuar perante a agência como representante técnico do detentor de certificado no tratamento
  das questões afetas à aeronavegabilidade, sendo o responsável final pelo acompanhamento
  das atividades de certificação e fiscalização realizadas pela Anac bem como pela apresentação
  tempestiva e implementação efetiva dos planos de ações corretivas elaboradas como resposta
  às não conformidades identificadas pela agência.'
