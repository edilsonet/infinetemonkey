text: 'b) Adicionalmente, no caso do inspetor chefe não possuir a qualificação prevista no
  parágrafo 119.67(d)(1)(i) do RBAC nº 119, ele deve ter, dentro dos últimos 6 anos, experiência
  de pelo menos 1 ano como inspetor de manutenção.

  C9. Desvios relativos aos requisitos de experiência

  C9.1. Conforme 119.67(f) do RBAC nº 119, podem ser solicitados desvios relativos aos requisitos
  de experiência estabelecidos na seção 119.67. Tais desvios podem ser solicitados quando
  o candidato não possui a experiência requerida, seja como piloto ou em posições administrativas.
  Porém, não são aceitos pela Anac desvios relativos a títulos, certificados, licenças ou
  habilitações requeridas, como, por exemplo, um candidato sem a licença de piloto de linha
  aérea (PLA), quando requerida.

  C9.2. A prerrogativa sobre análise e eventual autorização é da Anac. A Anac se reserva ao
  direito de revogar qualquer autorização concedida nesses temos, a qualquer momento, podendo
  determinar que o detentor de certificado designe um novo profissional para o cargo no prazo
  de 30 dias, extensível pela Anac por igual período.

  C9.3. Na avaliação da solicitação, a Anac levará em conta o tamanho e abrangência das operações,
  bem como a qualificação do pessoal técnico do detentor do certificado.

  C9.4. Pode ser considerada comparável, para fins do parágrafo 119.67(f) do RBAC nº 119,
  a experiência administrativa, de voo ou de manutenção obtida em detentores de certificado
  de operador aéreo ou organização de manutenção aeronáutica estrangeiros, sujeito à avaliação
  da Anac sobre o Estado emissor (por exemplo, referente às diferenças reportadas pelo Estado
  com relação aos Anexos da OACI ou aos resultados do Estado no programa de auditorias USOAP,
  da OACI), bem como às verificações necessárias junto ao Estado emissor para confirmação
  da validade dos documentos apresentados. O candidato deve cumprir ainda os outros requisitos
  aplicáveis, incluindo o entendimento sobre os RBAC, conforme requerido pelo parágrafo 119.65(d)(2)
  do RBAC nº 119.

  C10. Alteração e vacância do pessoal de administração requerido.

  C10.1. O parágrafo 119.65(e)(3) do RBAC nº 119 estabelece que o detentor de certificado
  deve notificar à Anac, no prazo de 10 dias, qualquer alteração ou vacância do pessoal de
  administração requerido. Este prazo se aplica somente no caso de alterações não programadas.
  Nas demais situações, o operador deve enviar a solicitação de alteração de pessoal de administração
  com a antecedência requerida para alteração das EO, conforme previsto no parágrafo 5.3.1.3
  desta IS.

  C10.2. Na eventualidade do desligamento de profissional exercendo cargo listado como pessoal
  de administração requerido, o processo de cadastramento de novo profissional deverá estar
  concluído em, no máximo, 60 dias corridos, incluindo o prazo de 10 dias para notificação
  à Anac. Esse prazo considera que o detentor de certificado possui procedimentos e atua para
  que as atribuições do cargo vago sejam exercidas de forma interina, de forma a cumprir com
  sua obrigação de manter o cumprimento dos regulamentos e de conduzir operações seguras,
  conforme os parágrafos 119.40(c) e 119.39(a)(3) do RBAC nº 119.

  C10.3. Para garantir o cumprimento deste requisito, o detentor de certificação (ou a organização
  requerente) deve incluir em seu sistema de documentos de segurança operacional (como no
  MGO, PMAC e MGSO):'
