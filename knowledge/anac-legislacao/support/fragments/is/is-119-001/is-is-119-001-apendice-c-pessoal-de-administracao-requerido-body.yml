title: APÊNDICE C - PESSOAL DE ADMINISTRAÇÃO REQUERIDO
text: 'APÊNDICE C - PESSOAL DE ADMINISTRAÇÃO REQUERIDO

  C1. Na seleção e designação do pessoal de administração requerido, seja na certificação
  inicial (conforme parágrafo 5.2.9.8 desta IS), seja em processo de alteração de COA e EO
  (conforme seção 5.3.6 desta IS), devem ser observados os critérios estabelecidos neste Apêndice.

  C2. Os indivíduos designados para as posições de administração requerida devem possuir amplo
  conhecimento, relevante à posição, sobre a legislação e sobre as operações planejadas, as
  EO e o sistema de documentos de segurança operacional da organização requerente.

  C3. O parágrafo 119.65(a) estabelece que o pessoal de administração requerido deve trabalhar
  horas suficientes nas posições administrativas estabelecidas ou posições equivalentes. Por
  padrão, a Anac estabelece que uma posição administrativa para operações sob o RBAC nº 121
  requer o equivalente a um trabalho de dedicação exclusiva, ou seja, um mínimo de 40 horas
  semanais. Assim:

  i. somente pode haver acúmulo de mais de uma função em uma mesma pessoa se for aprovada
  configuração específica para o detentor de certificado (conforme 5.2.9.8.3 desta IS); e

  ii. não pode haver compartilhamento de uma mesma pessoa para mais de um detentor de certificado.

  Nota: este requisito não impede que a pessoa execute outras funções na estrutura do detentor
  de certificado, que não posições de administração requeridas, como as funções de tripulante,
  DOV, mecânico de manutenção aeronáutica etc.

  C4. Conforme 119.39(b) e 119.40(c), a Anac tem a prerrogativa de não-aceitação de profissional
  com comprovado histórico de conduta e/ou desempenho inadequados.

  Nota: as referências às sanções administrativas capituladas no art. 299, incisos I, V, VI
  ou VII, da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica - CBA),
  contidas no parágrafo 119.39(b)(1)(2)(ii) do RBAC nº 119, se referem a enquadramentos de
  infrações como "procedimento ou prática, no exercício das funções, que revelem falta de
  idoneidade profissional para o exercício das prerrogativas dos certificados de habilitação
  técnica;", "fornecimento de dados, informações ou estatísticas inexatas ou adulteradas;",
  "recusa de exibição de livros, documentos contábeis, informações ou estatísticas aos agentes
  da fiscalização;" ou "prática reiterada de infrações graves;", ainda que, em razão da inclusão
  do § 3º do art. 288 do CBA, promovida pela Lei nº 14.368, atualmente o art. 299 não se aplique
  às atribuições da Anac.

  C5. Considerações quanto à posição de diretor ou gerente de operações'
