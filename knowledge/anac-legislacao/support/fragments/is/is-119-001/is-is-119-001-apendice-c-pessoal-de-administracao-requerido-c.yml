title: apendice-c-pessoal-de-administracao-requerido(c)
text: 'c) Conforme parágrafo 119.67(d)(2) do RBAC nº 119, deve-se ter 1 ano de experiência
  em postos de responsabilidade, com autoridade administrativa, de serviços de manutenção
  ou modificações em aviões. Tal posto significa qualquer posição em que os deveres e responsabilidades
  normais incluam gerenciamento ou supervisão de área afeta à manutenção de aeronaves com
  responsabilidade sobre um ou mais dos seguintes elementos:

  I - manual do programa de manutenção;

  II - aeronavegabilidade;

  III - organização de manutenção e inspeção;

  IV - execução e aprovação de manutenção, manutenção preventiva e alterações;

  V - aprovação de alterações realizadas por fornecedores de manutenção ou contratados;

  VI - sistema de análise e supervisão continuada (SASC);

  VII - manutenção de registros de manutenção; e

  VIII - treinamento de pessoal de manutenção.'
