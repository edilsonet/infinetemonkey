title: apendice-c-pessoal-de-administracao-requerido(e)
text: 'e) Conforme parágrafo 119.67(d)(4) do RBAC nº 119, deve-se ter realizado curso em um
  dos aviões de maior motorização operados pelo detentor de certificado ou ter experiência
  prática em atividades de manutenção em aviões de mesma categoria de certificação de tipo
  e motorização similar operados pelo detentor de certificado.

  C8. Considerações quanto à posição de inspetor chefe'
