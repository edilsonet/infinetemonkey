title: apendice-c-pessoal-de-administracao-requerido(h)
text: 'h) demonstrar falta de assertividade na tomada de decisão ou na gestão das suas responsabilidades
  e/ou de seus subordinados.

  C11.3. O detentor de certificado será informado da necessidade de substituição do pessoal
  de administração requerido por meio de Ofício, contendo prazo para a efetivação da substituição.

  C11.4. Após a comunicação da decisão por parte da ANAC, o detentor de certificado deverá
  encaminhar solicitação de alteração de EO para atualização do pessoal de administração requerido,
  conforme a seção 5.3.6, e estará sujeito aos prazos e às providências administrativas previstas
  na seção 5.5.2, ambas desta IS.'
