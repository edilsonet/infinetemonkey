title: apendice-c-pessoal-de-administracao-requerido(i)
text: 'i) engenharia com qualificação coerente com a atividade realizada;

  ii) tecnólogo em manutenção de aeronaves; ou

  iii) técnico em manutenção de aeronaves.

  B) Sob as alternativas do parágrafo C7(b)(I)(A), o profissional deve estar registrado junto
  ao respectivo conselho de fiscalização da profissão, com atribuição profissional coerente
  com a atividade desempenhada. Para atendimento a esse requisito, em seu registro devem constar
  as atribuições necessárias para exercer atividades de direção de serviços técnicos referentes
  a aeronaves, seus sistemas, seus equipamentos e seus serviços afins e correlatos. De acordo
  com os procedimentos de cada conselho, é possível que o registro regular do profissional
  junto ao conselho já contemple a atribuição de direção de serviços técnicos, não sendo necessária
  comprovação adicional específica desta atribuição.

  C) Outras formações em curso técnico, tecnólogo ou superior reconhecidas pelo Ministério
  da Educação podem ser consideradas aceitáveis, mediante avaliação caso a caso pela Anac
  quanto ao currículo profissional do candidato e sua compatibilidade com as atividades a
  serem exercidas. Esta análise do currículo é complementar à qualificação e não dispensa
  o cumprimento dos outros requisitos específicos de treinamento, experiência e competência
  estabelecidos no RBAC nº 119.

  D) Podem ser aceitas qualificações obtidas no exterior, sujeito às verificações necessárias
  junto ao Estado emissor para confirmação da validade dos documentos apresentados, bem como
  ao atendimento dos parágrafos de C7(b)(I)(A) a (C).

  II - possuir licença de mecânico de manutenção aeronáutica, com habilitação nos grupos célula
  e motopropulsor.

  A) As habilitações não necessitam estar válidas, se o profissional não pretender exercer
  as prerrogativas concedidas a seu titular, como as previstas nos RBAC nº 43 e 65. No entanto,
  nesse caso, a Anac avaliará as razões para a perda da validade: a suspensão em razão de
  falta de recredenciamento não representa impedimento ao cumprimento do requisito; no entanto,
  suspensão por aplicação de medidas cautelares ou punitivas representam impedimento.

  B) Podem ser aceitas licenças emitidas por outro Estado contratante da OACI, sujeito à avaliação
  da Anac sobre o Estado emissor (por exemplo, referente às diferenças reportadas pelo Estado
  com relação aos Anexos da OACI ou aos resultados do Estado no programa de auditorias USOAP,
  da OACI), ao atendimento do parágrafo C7(b)(II)(A), bem como às verificações necessárias
  junto ao Estado emissor para confirmação da validade dos documentos apresentados. O candidato
  deve cumprir ainda os outros requisitos aplicáveis, incluindo o entendimento sobre os RBAC,
  conforme requerido pelo parágrafo 119.65(d)(2) do RBAC nº 119.'
