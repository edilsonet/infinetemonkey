text: b) treinamento como instrutor/examinador os candidatos devem receber treinamento para
  as funções de instrutor e de examinador, do provedor de treinamento original (conforme indicado
  no parágrafo anterior). Em seguida, devem adquirir proficiência no programa de treinamento
  proposto pelo requerente instruindo-se uns aos outros, ou instruindo outros tripulantes
  e DOVs, sob supervisão do provedor de treinamento original e sujeito ao acompanhamento da
  Anac;
