text: 'APÊNDICE E - UTILIZAÇÃO compartilhada DE Avião PREVIAMENTE AO INÍCIO DA EXPLORAÇÃO
  DO SERVIÇO DE TRANSPORTE AÉREO

  E1. O RBAC nº 121, em seu parágrafo 121.153(c), requer que o detentor de certificado possua
  uso exclusivo de, no mínimo, um avião - o que é normalmente requerido a partir da certificação.
  Durante o processo de certificação, especialmente na fase 4, é requerida a disponibilização
  do avião para vistorias, auditorias, demonstrações de evacuação de emergência ou amerissagem
  (conforme aplicável) e voos de avaliação operacional. No entanto, o uso do avião é pontual
  e pode não justificar a sua imobilização desde o início dessa disponibilização até o início
  da exploração do serviço de transporte aéreo. Assim, considerando que não é requerido o
  cumprimento do parágrafo 121.153(c) enquanto o requerente ainda não estiver operando sob
  o RBAC nº 121, pode se permitir que o avião utilizado no processo de certificação seja utilizado
  também para outros fins, enquanto não ocorre o início da exploração do serviço, desde que
  sejam atendidos alguns critérios.

  E2. Há ao menos dois cenários em que poderia ocorrer essa utilização do avião para outros
  fins:'
