title: apendice-e-utilizacao-compartilhada-de-aviao-previame-d84c52(d)
text: d) deve ser formalmente estabelecida, entre os operadores, a responsabilidade pelo controle
  da manutenção. Recomenda-se a adoção de um controle centralizado, de forma que um operador
  seja o responsável pelo controle e que o outro operador possa reportar as ocorrências e
  atividades relacionadas à manutenção para registro nesse controle, bem como consultar o
  status do avião nesse controle;
