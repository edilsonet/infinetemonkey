subsection_id: e
cite: apendice-e-utilizacao-compartilhada-de-aviao-previame-d84c52(e)
title: apendice-e-utilizacao-compartilhada-de-aviao-previame-d84c52(e)
text: 'e) os operadores devem estabelecer procedimentos para transferência do controle operacional,
  exceto no caso previsto a seguir:

  I - se for acordado que o avião será transferido somente uma vez para cada operador, podem
  ser adotados procedimentos simplificados com relação ao previsto na IS nº 119-006, mantendo-se
  ao menos o registro nos documentos da aeronave (diário de bordo). Normalmente, a transferência
  do operador primário (o requerente) para o secundário ocorreria após a conclusão das demonstrações;
  e a transferência do operador secundário para o primário ocorreria pouco antes do início
  da exploração do serviço de transporte aéreo;'
