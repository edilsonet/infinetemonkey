title: APÊNDICE F - Funções EXECUTADAS por operadores CONGÊNERES
text: 'APÊNDICE F - Funções EXECUTADAS por operadores CONGÊNERES

  Nota 1: este Apêndice não se aplica aos serviços auxiliares ao transporte aéreo previstos
  na Resolução nº 116, de 20 de outubro de 2009.

  Nota 2: este Apêndice trata da possibilidade de uma função ser executada por operador congênere,
  cumprindo os mesmos requisitos aplicáveis originalmente, caso a função fosse executada pelo
  próprio detentor de certificado. A delegação dessas atividades representa somente uma alteração
  da forma de cumprimento; não pode ser utilizada para se desviar dos requisitos aplicáveis,
  como, por exemplo, sob alegação de cumprimento de requisitos equivalentes pelo operador
  congênere.

  F1. O requerente ou detentor de um certificado segundo o RBAC nº 119 (doravante denominado
  “operador tomador”) pode utilizar recursos de um operador congênere do mesmo grupo econômico
  (doravante denominado “operador fornecedor”), incluindo pessoal, sistemas e procedimentos,
  para executar funções requeridas pelo RBAC nº 121 necessárias para o desempenho seguro de
  atividades, respeitadas as condições deste Apêndice.

  F2. Para efeitos deste Apêndice, considera-se grupo econômico duas ou mais empresas de transporte
  aéreo que façam parte de um mesmo controle acionário, onde o operador tomador esteja sediado
  no Brasil e o operador fornecedor esteja sediado no Brasil ou no exterior, e onde o operador
  tomador seja requerente ou detentor de um certificado emitido sob o RBAC nº 119 para operar
  sob o RBAC nº 121, e o operador fornecedor seja detentor de um certificado emitido sob o
  RBAC nº 119 para operar sob o RBAC nº 121, ou seja detentor de um certificado para operar
  sob regras estrangeiras compatíveis com o RBAC nº 121.

  F3. O operador tomador permanece diretamente responsável pela correta execução e eficácia
  dos procedimentos pelo operador fornecedor.

  F4. O operador tomador deve especificar formalmente, por meio da declaração de conformidade,
  quais funções serão ou poderão ser executadas pelo operador fornecedor. Deve ser formalmente
  estabelecida, entre os operadores, a responsabilidade pelo controle das atividades delegadas.

  F5. O sistema de manuais do operador tomador deverá especificar todas as atividades que
  serão ou poderão ser executadas pelo operador fornecedor (quais, como, quando, onde, quem)
  assim como declarar que a responsabilidade direta por tais atividades é do operador tomador.

  F6. O operador tomador é responsável por garantir que o pessoal do operador fornecedor tenha
  acesso aos manuais e procedimentos relativos às atividades executadas pelo operador fornecedor.

  F7. Cada operador deve possuir o seu próprio sistema de manuais e o operador fornecedor
  deve executar os procedimentos dos manuais do operador tomador.

  F8. Os operadores são responsáveis por, no âmbito do SGSO, analisar e gerenciar os riscos
  decorrentes da delegação, documentando toda a análise e ações decorrentes. A Anac poderá
  avaliar, a qualquer tempo, os procedimentos associados à delegação e tomar ações cabíveis
  caso identifique deterioração dos níveis de segurança.

