title: apendice-f-funcoes-executadas-por-operadores-congeneres(c)
text: 'c) caso haja diferenças significativas entre os procedimentos, a análise de risco deve
  tratar especificamente dos riscos associados a essas diferenças.

  F10. Nos casos de F9.b) e c), as diferenças de procedimentos aplicáveis ao operador tomador
  e ao operador fornecedor devem ser identificadas, bem como as ações mitigadoras tomadas.

  F11. O operador tomador deve monitorar mudanças de procedimentos ou estruturas no operador
  fornecedor (por motivos internos ou externos ao operador, por exemplo, mudanças na legislação)
  que possam afetar as atividades realizadas para o operador tomador, observando-se o disposto
  nos itens F8 a F10 deste Apêndice.

  F12. O programa de treinamento do operador tomador deve prever treinamento específico para
  o pessoal do operador fornecedor relativo às atividades delegadas. A responsabilidade pelo
  cumprimento do programa de treinamento é do operador tomador.

  F13. Caso o operador fornecedor pretendido seja um detentor de um certificado para operar
  segundo regras estrangeiras, a Anac avaliará a certificação e a maturidade da empresa e
  poderá restringir as atividades delegadas.

  F14. O operador tomador deve formalizar à Anac o pedido para delegar atividades para um
  operador congênere segundo este Apêndice.'
