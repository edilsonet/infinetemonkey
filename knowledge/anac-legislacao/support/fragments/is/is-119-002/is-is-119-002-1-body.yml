title: OBJETIVO
text: '1. OBJETIVO

  1.1. Este documento tem por objetivo oferecer ao detentor e/ou requerente de um

  Certificado de Empresa de Transporte Aéreo (Certificado ETA), emitido em

  consonância com o RBAC 119, orientações para a implantação de seus Sistemas de

  Gerenciamento da Segurança Operacional (SGSO).

  1.2. Este documento foi estruturado considerando os requisitos estabelecidos no RBAC 119,

  para o pessoal de administração requerido (119.69 e 119.71) e aqueles relacionados à

  implantação do Sistema de Gerenciamento da Segurança Operacional (SGSO), para a

  certificação de empresas de transporte aéreo operando segundo os RBAC 121 e RBAC

  135.

  1.3. Além disso, esta IS apresenta informações de como conduzir uma Análise do Faltante
  e

  o Plano de Implantação do SGSO, partes integrantes do Manual de Gerenciamento da

  Segurança Operacional (MGSO) a ser entregue à ANAC. Faz também uma explanação

  sobre a proposta da ANAC de implantação do SGSO em fases, incluindo, quando for o

  caso, as possibilidades de autorizar isenção temporária. Foram incluídos, ainda, alguns

  formulários e exemplos, que podem ser utilizados ou adaptados de forma a atender às

  necessidades individuais de cada detentor e/ou requerente de um certificado.

  1.4. Outro objetivo deste documento é orientar o detentor e/ou requerente de um certificado

  na seleção e definição de um Gestor Responsável para a empresa, considerando os

  requisitos previstos nas seções 119.69 e 119.71, do RBAC 119, bem como as

  responsabilidades e atribuições a serem alocadas a esta função. Propõem-se, ainda,

  orientações que permitam o Gestor Responsável designar um diretor ou gerente de

  segurança operacional, que seja aceitável pela ANAC, considerando a experiência,

  competência e qualificação para responder individualmente, e ser o ponto focal, para a

  implantação e manutenção de um SGSO efetivo na empresa.

  1.5. Este documento também estabelece parâmetros que permitem às empresas operando

  segundo o RBAC 135 demonstrarem cumprimento aceitável pela ANAC, no que se

  refere aos Requisitos 119.69 (Pessoal de administração requerido para operações

  conduzidas segundo o RBAC 135), 119.71 (Pessoal de administração: qualificações

  para operações conduzidas segundo o RBAC 135).Data da emissão: 9 de novembro de 2012 IS
  nº 119-002

  REVISÃO D

  1.6. Este documento deve ser considerado apenas como uma orientação. Se houver alguma

  discrepância entre este documento e a regulação, normas ou exceções aplicáveis, estas

  últimas terão precedência sobre o aqui descrito.'
