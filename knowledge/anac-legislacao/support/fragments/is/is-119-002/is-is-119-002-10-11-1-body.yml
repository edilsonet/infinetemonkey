title: Durante essa fase, e não após 1°de maio de 2014, os detentores de certificado regidos
text: '10.11.1 Durante essa fase, e não após 1°de maio de 2014, os detentores de certificado
  regidos

  pelo RBAC 121 devem ser capazes de demonstrar que os componentes/elementos

  implantados das três primeiras fases continuam funcionando de forma eficaz, bem como

  demonstrar que colocaram em prática o que estiver previsto para esta fase, relacionados

  à garantia da segurança operacional (Apêndice Q, (f)).'
