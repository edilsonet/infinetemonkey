title: Durante essa fase, e não após 1°de agosto de 2014, os detentores de certificado regidos
text: '10.11.2 Durante essa fase, e não após 1°de agosto de 2014, os detentores de certificado
  regidos

  pelo RBAC 135 devem ser capazes de demonstrar que os componentes/elementos

  implantados nas três primeiras fases continuam funcionando de forma eficaz, bem como

  de demonstrar que colocaram em prática o que estiver previsto para esta fase,

  relacionados à garantia da segurança operacional (Apêndice H, (f)).'
