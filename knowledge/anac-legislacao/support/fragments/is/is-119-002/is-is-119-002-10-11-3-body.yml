title: O ponto principal dessa fase é a capacidade de demonstrar a existência de um processo
text: '10.11.3 O ponto principal dessa fase é a capacidade de demonstrar a existência de um
  processo

  para o monitoramento e a medição do desempenho da segurança operacional em

  comparação com as políticas e objetivos de segurança operacional estabelecidas pelo

  Gestor Responsável. Para isso, deve definir e acompanhar os indicadores e metas de

  desempenho, bem como os requisitos ou plano de ação para alcançar as metas

  estabelecidas, de modo a manter suas operações dentro do Nível Aceitável de

  Desempenho da Segurança Operacional (NADSO) estabelecido após a conclusão do

  Plano de Implantação.'
