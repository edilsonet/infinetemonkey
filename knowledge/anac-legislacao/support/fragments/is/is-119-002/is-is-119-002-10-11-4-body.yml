title: Dentro do conceito de melhoria contínua do SGSO, o Gestor Responsável deve
text: '10.11.4 Dentro do conceito de melhoria contínua do SGSO, o Gestor Responsável deve

  demonstrar, ainda, os processos adotados para validar a eficácia dos controles de risco

  de segurança operacional implantados, bem como o contínuo aprimoramento da

  documentação (Apêndice Q, (d)(6) e Apêndice H, (d)(6)) e do treinamento relacionados

  com à garantia da segurança operacional e ao plano de respostas a emergências

  (Apêndice Q, (g)(1) e Apêndice H, (g)(1)).'
