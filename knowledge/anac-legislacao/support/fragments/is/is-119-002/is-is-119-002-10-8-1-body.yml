text: '10.8.1 As atividade previstas para a primeira fase de implantação têm por objetivo
  integrar os

  requisitos do SGSO às atividades diárias, principalmente no que se refere à política,

  objetivos e estrutura organizacional. Por se tratar da fase que deve iniciar a mudança de

  comportamento da estrutura organizacional do detentor de certificado, essas atividades

  merecem uma contextualização maior do que as demais, conforme apresentado a seguir.'
