text: '10.8.3 Uma vez concluídas as análises iniciais descritas em 9.6.2 e até as datas definidas
  no

  parágrafo (b) do Apêndice R do RBAC 121 ou do Apêndice I do RBAC 135, o Gestor

  Responsável deve encaminhar à ANAC o MGSO contendo o que foi acordado como

  planejamento do SGSO, além dos demais componentes/elementos previstos nos

  referidos Apêndice R (RBAC 121) ou I (RBAC 135) e representado no Apêndice A

  desta IS.'
