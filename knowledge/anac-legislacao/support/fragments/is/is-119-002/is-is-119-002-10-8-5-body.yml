cite: 10.8.5
title: Os demais componentes/elementos que não estão previstos devem ser implementados
text: '10.8.5 Os demais componentes/elementos que não estão previstos devem ser implementados

  até 1° de maio 2011 ou 1º de agosto de 2011, conforme o caso, e devem estar

  configurados no planejamento constante do Plano de Implantação. É importante

  destacar que, ao estabelecer um prazo no planejamento, o Gestor Responsável pelo

  PSAC deve considerar este prazo como o de demonstração de sua efetividade para uma

  inspeção da ANAC. Além disso, podem ser incluídos outros componentes/elementos

  constantes do Apêndice Q do RBAC 121/Apêndice I do RBAC 135, se for considerado

  necessário para esclarecer algum ponto do plano ou se houver alguma evolução entre o

  plano acordado com a ANAC e o efetivamente entregue.'
