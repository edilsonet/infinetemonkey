title: A entrega do MGSO contendo o que foi acordado para o Plano de Implantação do
text: '10.8.6 A entrega do MGSO contendo o que foi acordado para o Plano de Implantação do

  SGSO deve fazer parte do conjunto de documentos, a ser entregue na segunda fase do

  processo de certificação do detentor e/ou requerente de um certificado. O SGSO

  somente será considerado aceito pela ANAC quando for assinado pelos responsáveis

  (accountables) pelo processo na Agência (ver modelo no Apêndice C).

  10.9 Fase 2 - de 1º de maio de 2011 até 30 de abril de 2011 (RBAC 121) ou de 1º de

  agosto de 2011 até 31 de julho de 2012 (RBAC 135).'
