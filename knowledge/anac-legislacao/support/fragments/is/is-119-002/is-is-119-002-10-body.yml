title: AS FASES DE IMPLANTAÇÃO DO SGSO
text: '10. AS FASES DE IMPLANTAÇÃO DO SGSO

  10.1 A adoção de uma implantação do SGSO por fases, conforme previsto nos RBAC 135 ou

  121 foi a forma proposta pela ANAC para que as empresas de transporte aéreo cujos

  certificados tenham sido emitidos pela ANAC, ou solicitados, antes agosto de 2010,

  pudessem adequar sua estrutura organizacional, políticas e objetivos aos novos

  conceitos introduzidos pela implantação de um SGSO.

  10.2 Uma vez aprovado pelo Gestor Responsável pela empresa de transporte aéreo e

  encaminhado para análise pela ANAC, esse Plano passa a fazer parte dos objetivos

  estratégicos de segurança operacional do detentor e/ou requerente de um certificado,

  mesmo antes de sua aceitação pela ANAC. Quando o MGSO e, consequentemente o

  Plano de Implantação, for aceito pela ANAC, o conjunto desses objetivos estratégicos

  deve ser considerado como o primeiro Nível Aceitável de Desempenho da Segurança

  Operacional (NADSO) do PSAC a ser acordado com a Agência.

  10.3 Nesse sentido, a situação atual em relação aos requisitos dos regulamentos deveria
  ser

  apresentada de forma mensurável, se constituindo nos primeiros Indicadores de

  Desempenho de Segurança Operacional (IDSO). A partir dos resultados da Análise do

  Faltante, deveriam ser apresentadas as Metas de Desempenho de Segurança Operacional

  (MDSO) para cada fase e os Requisitos de Segurança Operacional (ReqSO) ou Plano de

  Ação para alcançar as metas propostas dentro dos prazos estabelecidos.

  10.4 O detentor e/ou requerente de um certificado deve apresentar, para cada fase a ser

  acordada com a ANAC, pelo menos os requisitos estabelecidos no Apêndice R do

  RBAC 121 ou no Apêndice I do RBAC 135. Entretanto, é possível que a ANAC, a

  partir da análise dos dados disponíveis na Agência, possa indicar a necessidade de

  antecipar a implantação de um requisito previsto inicialmente para uma fase posterior.

  O mesmo raciocínio serve no sentido inverso, ou seja, a ANAC pode aceitar a

  solicitação de um detentor e/ou requerente de um certificado para postergar para outra

  fase a apresentação de requisitos previstos numa fase anterior, se esta decisão não

  comprometer a segurança operacional acima do nível aceitável pela Agência.

  10.5 Em ambos os casos, o Gestor Responsável fica comprometido, em nome do detentor

  e/ou requerente de um certificado, em implantar o SGSO de acordo com o planejamento

  aceito pela ANAC. A aceitação do Plano de Implantação do SGSO permite à Agência

  identificar quem, em nome do detentor, assume o compromisso da garantia da

  segurança operacional durante o processo de implantação do SGSO, de forma a manter

  as operações dentro de níveis aceitáveis.Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  10.6 Ainda, o Gestor Responsável fica comprometido junto à ANAC de enviar os

  documentos que comprovem a efetiva implantação dos componentes/elementos

  acordados, nos prazos estabelecidos. Esses documentos são considerados como

  informações importantes para que o INSPAC identifique o grau de comprometimento

  do responsável pela efetiva implantação do SGSO no detentor de certificado.

  10.7 Por se tratar de um planejamento, é necessário que tanto o gestor responsável do

  detentor de certificado quanto a ANAC considerem uma flexibilidade envolvida na

  implantação. Entretanto, deve haver um compromisso de que os

  componentes/elementos serão implantados sem ultrapassar o prazo final de cada fase.

  As mudanças propostas muito próximas do final do prazo estabelecido para uma fase

  podem não ser processadas a tempo pela ANAC, em função da carga de trabalho ou de

  outras prioridades.

  10.8 Fase 1 - de 1º de maio de 2010 até 30 de abril de 2011 (RBAC 121) ou de 1º de

  agosto de 2010 até 31 de julho de 2011 (RBAC 135).'
