title: GESTOR RESPONSÁVEL
text: '11. GESTOR RESPONSÁVEL

  11.1 A introdução dos novos requisitos e dos conceitos de gerenciamento dos riscos à

  segurança operacional passou a necessitar que o detentor do certificado designasse um

  Gestor Responsável. Esse Gestor Responsável deve ser uma pessoa única e identificável

  pertencente a apenas um detentor do certificado e que assumirá a responsabilidade

  (accountability) total pelo atendimento aos requisitos estabelecidos pela ANAC para o

  tipo de operação certificada.

  11.2 A seleção dessa pessoa passa a ser fundamental para a garantia da segurança

  operacional por parte do detentor de certificado. Deveria ser estabelecido um processo

  que permita que uma pessoa com as qualificações corretas seja indicada como Gestor

  Responsável e que esta pessoa entenda e aceite o papel e as responsabilidades da

  segurança das operações do detentor de certificado que estão associadas com a função.Data
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  11.3 Os Apêndices H e I oferecem exemplos de fluxograma e uma série de perguntas em

  cada um deles, elaboradas com o objetivo de auxiliar o detentor do certificado no

  processo de seleção da pessoa que vai assumir o cargo de Gestor Responsável. O

  fluxograma do Apêndice H considera diversas estruturas de PSAC, com o objetivo de

  facilitar a seleção de uma pessoa com perfil compatível.

  11.4 Uma vez selecionada a pessoa para o cargo, as perguntas colocadas ao final do

  formulário permitirão confirmar que a pessoa selecionada é a adequada ao cargo. Todas

  as questões devem receber um “sim” para que o candidato seja aceito. Caso alguma

  resposta receba um “não”, o processo de seleção deveria começar todo outra vez com

  um novo candidato. As estruturas organizacionais apresentada no Apêndice G pretende

  cobrir a maioria das situações que serão encontradas para a constituição das empresas

  de transporte aéreo a serem certificadas.

  11.5 No caso de o processo não resultar em uma seleção objetiva da pessoa a ser designada

  como Gestor Responsável, um candidato deve ser selecionado junto com a SSO/ANAC.

  Nesse caso, a designação do Gestor Responsável deveria ser validada durante a próxima

  inspeção, a ser realizada no processo de aceitação do SGSO/MGSO do PSAC.

  11.6 É importante destacar que existem requisitos para que uma pessoa seja o Gestor

  Responsável em outras partes da regulação de certificação de um detentor de

  certificado, que não estão relacionadas diretamente com o SGSO. As informações

  colocadas aqui têm por objetivo auxiliar o detentor do certificado na implantação do

  SGSO e na seleção do Gestor Responsável.'
