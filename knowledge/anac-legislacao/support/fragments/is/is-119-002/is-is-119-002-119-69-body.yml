  cargo de DSO/GSO para a implantação e manutenção do sistema de gerenciamento da

  segurança operacional (SGSO) dentro da organização, o gestor responsável deve avaliar

  se o seu candidato apresenta qualificações desejáveis para assumir o DSO/GSO. De

  acordo com a OACI (DOC 9859, 2nd Edition), são elas:'
