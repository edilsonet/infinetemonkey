title: DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL
text: '12. DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL

  12.1 Uma das primeiras responsabilidades do Gestor Responsável é a designação do pessoal

  chave e as respectivas responsabilidades para implantação do Sistema de

  Gerenciamento da Segurança Operacional na Empresa. O pessoal chave deve se

  comprometer com as responsabilidades identificadas independentemente de suas

  funções principais.

  12.2 A garantia, entretanto, do sucesso do SGSO está na identificação de uma pessoa que

  tenha acesso direto ao Gestor Responsável. A pessoa, designada como diretor ou

  gerente de segurança operacional, deve ter qualificações gerenciais em nível sênior

  dentro da Empresa, de forma a ser capaz de demonstrar o grau de autoridade compatível

  com suas responsabilidades quando estiver lidando com assuntos relacionados com a

  segurança operacional do detentor e/ou requerente de um certificado.

  12.3 As principais responsabilidades associadas ao diretor ou gerente de segurança

  operacional estão relacionadas à garantia da segurança operacional definida na política

  do detentor de certificado. Isso envolve o desenvolvimento de estudos para estabelecer e

  monitorar os Indicadores de Desempenho da Segurança Operacional (IDSO) e as Metas

  de Desempenho da Segurança Operacional (MDSO); a avaliação da efetividade das

  ações estabelecidas e do SGSO como um todo; e o monitoramento das operações diárias

  em relação aos requisitos da regulação.

  12.4 Essa pessoa deve ser empregada do detentor e/ou requerente de um certificado. A

  possibilidade de uma mesma pessoa acumular, temporariamente, o cargo de diretor ouData da
  emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  gerente de segurança operacional com outro da direção requerida, estabelecida no

  processo de Certificação (119.65) em Empresas mais complexas pode ser aceita pela

  ANAC, desde que o detentor e/ou requerente de um certificado demonstre no processo

  que o gerenciamento da segurança operacional previsto no SGSO não está

  comprometido.

  12.5 Para empresas que operam segundo o RBAC 135, os critérios acerca do acúmulo de

  cargos da direção requerida por parte do Diretor ou Gerente de Segurança Operacional e

  os critérios acerca do compartilhamento do cargo de Diretor ou Gerente de Segurança

  Operacional por mais de uma empresa estão definidos no Apêndice L.

  12.6 O diretor ou gerente de segurança operacional não está acima de qualquer outro nível
  da

  direção requerida. Entretanto, ele deve ser reconhecido pela alta direção como

  representante do Gestor Responsável para os assuntos de segurança operacional e uma

  pessoa capaz de apoiá-lo com informações e relatórios gerenciais que assegurem o

  processo de melhoria contínua do detentor de certificado. É importante destacar,

  entretanto, que a responsabilidade (accountability) da operação e manutenção do SGSO

  está com o Gestor Responsável, e não com o diretor ou gerente de segurança

  operacional.

  12.7 O Apêndice J apresenta orientações suplementares acerca dos requisitos aplicáveis ao

  cargo de Diretor ou Gerente de Segurança Operacional.'
