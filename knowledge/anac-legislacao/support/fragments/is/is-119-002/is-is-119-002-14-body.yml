title: APÊNDICES
text: '14. APÊNDICES

  14.1 Apêndice A - Componentes/elementos da estrutura do SGSO e as fases de implantação

  previstas na regulação.

  14.2 Apêndice B - MGSO RBAC 135 - Modelo.

  14.3 Apêndice C - Termo de aprovação e de aceitação - Exemplo.

  14.4 Apêndice D - Termo de responsabilidade do gestor responsável - Exemplo.

  14.5 Apêndice E - Análise do faltante para detentor de certificado pelo RBAC 135.Data da
  emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  14.6 Apêndice F - Cronograma de implantação do SGSO em um detentor de certificado -

  Modelo.

  14.7 Apêndice G - Controle do Plano de Implantação do SGSO - Exemplo.

  14.8 Apêndice H - Fluxograma para a seleção do Gestor Responsável - Exemplo.

  14.9 Apêndice I - Lista de perguntas para a seleção do Gestor Responsável - Exemplo.

  14.10 Apêndice J - Qualificações e experiência do indicado ao cargo de Diretor ou Gerente
  de

  Segurança Operacional.

  14.11 Apêndice K - Critério para aferição da complexidade do operador para os propósitos
  da

  implantação e manutenção do SGSO.

  14.12 Apêndice L - Acúmulo de cargos e compartilhamento entre empresas do Diretor ou

  Gerente de Segurança Operacional.

  14.13 Apêndice M - Método aceitável de cumprimento para o SGSO das empresas 135

  (H135.1(a))'
