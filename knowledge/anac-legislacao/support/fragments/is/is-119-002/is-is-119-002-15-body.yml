title: DISPOSIÇÕES FINAIS
text: '15. DISPOSIÇÕES FINAIS

  15.1. O gestor responsável do detentor de certificado que não apresentar o MGSO até 30 de

  abril de 2011 (RBAC 121) ou até 31 de julho de 2011 (RBAC 135) pode perder a

  oportunidade de implantar seus SGSO em quatro fases, uma vez que o prazo final para

  todos os PSAC 121 e 135 estarem com SGSO operando não muda (dezembro de 2014).

  15.2. Desta forma, é aconselhável que o gestor responsável de um detentor e/ou requerente
  de

  um certificado contate o inspetor responsável por seu processo de certificação o mais

  cedo possível, visando garantir que seus programas, incluindo a documentação

  aprovada/aceita anteriormente, esteja em conformidade com os requisitos de

  implantação do SGSO estabelecidos nos RBAC 121 e RBAC 135. Os PSAC que forem

  identificados dentro do programa de vigilância continuada em desrespeito aos requisitos

  do SGSO estarão sujeitos às penalidades previstas na legislação em vigor.

  15.3. O gestor responsável de um detentor do certificado que entregar sua documentação nos

  prazos estabelecidos e se utilizar dos formulários aqui propostos para a implantação do

  SGSO pode vir a ser tratado com prioridade, uma vez que a proposta está padronizada e

  é de conhecimento da ANAC.

  15.4. O gestor responsável de um detentor de certificado e/ou requerente de um certificado

  deve atentar para as informações introduzidas neste documento por meio dos Apêndices

  J, K, L e M, pois poderão ser solicitados a apresentar à ANAC sua forma de incorporar

  essas orientações.

  15.5. Os casos omissos serão dirimidos pela ANAC.

  15.6. Esta IS entra em vigor na data de sua publicação.Data da emissão: 9 de novembro de
  2012 IS nº 119-002

  REVISÃO D'
