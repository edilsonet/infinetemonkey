title: 3(a)
text: 'a) o gestor responsável de um detentor e/ou requerente de um certificado que

  pretenda, por qualquer finalidade, demonstrar o cumprimento de requisito previsto

  em RBAC ou RBHA, poderá adotar os meios e procedimentos previamente

  especificados em IS; ou apresentar um meio ou procedimento alternativo

  devidamente justificado, exigindo-se, nesse caso, a análise e concordância expressa

  do órgão competente da ANAC.'
