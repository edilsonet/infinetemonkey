cite: 3(b)
title: 3(b)
text: 'b) o gestor responsável de um detentor e/ou requerente de um certificado deve garantir

  que o meio ou procedimento alternativo mencionado no parágrafo 3, alínea a, desta

  IS ofereça um nível aceitável de desempenho da segurança operacional, que resulte

  numa proteção igual ou superior ao estabelecido pelo requisito aplicável,

  concretizando o objetivo do procedimento normalizado em IS.'
