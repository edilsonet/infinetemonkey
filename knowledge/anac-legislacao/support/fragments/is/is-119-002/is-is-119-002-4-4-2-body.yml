title: Gerenciamento dos riscos à segurança operacional
text: '4.4.2 Gerenciamento dos riscos à segurança operacional

  Para este elemento o ponto principal está relacionado com os meios e processos estabelecidos

  para obter as informações sobre os perigos à segurança operacional existentes no ambiente

  operacional onde a Empresa se insere.

  A identificação das condições latentes está, muitas vezes, parcialmente realizada pelo pessoal

  operativo ou consta de relatório de fiscalização da própria ANAC. Esses relatórios, ricos
  em

  informação, podem acabar sendo desconsiderados se não houver um processo estabelecido.

  Além disso, uma política não punitiva de reportes de segurança operacional é fundamental
  para

  ampliar a base de dados disponíveis e estar de acordo com as diretrizes estabelecidas pela
  ANAC.

  Outro processo que tem que ficar claro é como são tratados os perigos identificados em relatórios

  emitidos pelo órgão de investigação de acidentes e incidentes aeronáuticos, após as investigações

  onde esteja envolvido o Detentor do Certificado.

  Deve claramente definida a forma como são tratadas essas recomendações e como consideram
  a

  regulação da Agência, onde for de sua responsabilidade, antes de serem implantadas as ações.'
