title: Garantia da Segurança Operacional
text: '4.4.3 Garantia da Segurança Operacional

  A definição do processo de medição do desempenho da segurança operacional é um elemento

  importante desse componente. Deve servir para a revisão dos objetivos estabelecidos para
  o

  desempenho da segurança operacional, caso algumas das ferramentas adotadas (inspeção,

  auditoria, pesquisas etc.) identifique que o Gestor Responsável não está conseguindo cumprir
  com

  o Plano de Implantação aceito pela ANAC ou se este planejamento não foi suficiente para
  que esse

  Gestor Responsável alcance e mantenha um Nível Aceitável de Desempenho da Segurança

  Operacional aceito e acordado com a Agência.

  Os Gestores de Detentores de Certificado operando segundo o RBAC 135 precisam, ainda,

  identificar se estão enquadrados no disposto no Parágrafo (g) ou (h) da Seção 121.2, do
  RBAC 121.

  Em caso positivo, devem avaliar os impactos (perigos e riscos) trazidos pelas mudanças previstas

  nos regulamentos, principalmente na Seção 119.1, do RBAC 119 (Plano de transição para

  Operadores Aéreos) e na Seção 121.2, do RBAC 121 (Programa de conformidade para operadores

  em transição para o RBAC 121. Alguns novos operadores).'
