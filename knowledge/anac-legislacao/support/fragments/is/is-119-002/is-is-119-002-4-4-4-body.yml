title: Promoção da Segurança Operacional
text: '4.4.4 Promoção da Segurança Operacional

  A implantação do SGSO em um Detentor de Certificado envolve, normalmente, a introdução de

  novos conceitos, processos, formas de comunicação e de divulgação da política e objetivos
  da

  segurança operacional adotados pela Empresa.Data da emissão: 9 de novembro de 2012 IS nº
  119-002

  REVISÃO D

  Desta forma, os membros do grupo de planejamento, composto por diretores, gerentes e

  supervisores chave da organização devem possuir conhecimento e experiência suficiente para

  entender os desafios que se apresentam e os impactos dos novos requisitos nos processos,

  procedimentos e documentação do Detentor do Certificado relacionado à certificação e à

  segurança operacional.

  Assim, a base da promoção da segurança operacional é apoiada em dois fundamentos:

  treinamento e divulgação. Pode ser necessário iniciar com a capacitação em segurança

  operacional pela alta direção ou pelos membros designados para compor o grupo que vai ser

  responsável pela elaboração do próprio SGSO do Detentor de Certificado.

  A identificação do nível de conhecimento em segurança operacional e em SGSO desejável para

  cada grupo ou setor envolvido direta ou indiretamente na segurança operacional do Detentor
  de

  Certificado deve levar à proposta de um programa de treinamento onde constem os tópicos
  a

  serem tratados em cada um e o tempo alocado.

  O envolvimento de todos com responsabilidade na segurança operacional do Detentor de

  Certificado, desde o inicio do planejamento de implantação, é um fator importante para o
  sucesso

  do SGSO, uma vez que envolve uma mudança na cultura. Assim, a definição dos meios de

  participação dos empregados assume um papel importante, principalmente, no que se refere
  aos

  reportes de segurança operacional, fonte preciosa para a identificação dos perigos à segurança

  operacional.

  Além disso, é importante definir, também, os meios de divulgação, internos e externos, das

  mudanças propostas para a garantia da segurança operacional do Detentor de Certificado,
  bem

  como daquelas mudanças já realizadas. A retroalimentação aos que apresentaram reporte e
  a

  divulgação dos resultados alcançados deve ser considerada para que todos se sintam parte
  do

  compromisso assumido pela alta direção.

  4.5 FASES E CRONOGRAMA DE IMPLANTAÇÃO DO SGSO

  O Detentor do Certificado operando segundo o RBAC 121 deve ter a partir de 1º de maio de
  2010

  ou segundo o RBAC 135 a partir de 1º de agosto de 2010, iniciado o estabelecimento de um
  plano

  de implantação do Sistema de Gerenciamento da Segurança Operacional (SGSO) em sua

  organização, utilizando-se de, no máximo, quatro fases para a implantação desse Sistema.
  A

  princípio, cada fase deve ter a duração de um ano.

  Os requisitos para as fases apresentados no Apêndice R do RBAC 121 ou Apêndice I do RBAC
  135

  devem ser utilizados como pontos de controle pelos Inspetores da ANAC, visando identificar
  se

  foram implantados os que fazem parte do plano de implantação aceito pela Agência, bem como

  sua eficácia.

  Entretanto, dados oficiais disponíveis na ANAC, inclusive os resultados de relatórios de
  inspeção,

  auditoria ou fiscalização podem alterar os requisitos mínimos dispostos nos regulamentos,
  tanto

  antecipando como aceitando um prazo mais longo para um determinado componente ou

  elemento, desde que a implantação não ultrapasse os quatro anos estabelecidos no Apêndice
  R do

  RBAC 121 ou Apêndice I do RBAC 135.

  Cabe destacar que estas alterações terão que ser acordadas com o setor responsável pela

  certificação do Detentor de Certificado na ANAC. Ao serem aceitos o planejamento apresentado
  eData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  as fases de implantação, esta aceitação pode ser considerado como o primeiro NADSO

  estabelecido para aquele Detentor de Certificado.

  Desta forma, é aconselhável que o Plano apresente meios de mensurar sua efetiva implantação,

  por meio de Indicadores de Desempenho da Segurança Operacional (IDSO), metas de Desempenho

  da Segurança Operacional (MDSO) e Requisitos de Desempenho de Segurança Operacional

  (ReqSO)ou Plano de Ações, necessários ao acompanhamento da proposta endossada pelo Gestor

  Responsável pelo Detentor de Certificado.

  Ressalta-se a necessidade de conscientizar os gestores responsáveis pelo Detentor de Certificado

  que o planejamento da implantação do SGSO, bem como o cronograma que o representa, uma vez

  aceitos pela ANAC passam a ser tratados como requisitos para sua operação e, como tal, alvos
  de

  fiscalização por parte da Agência e das sansões previstas na legislação.'
