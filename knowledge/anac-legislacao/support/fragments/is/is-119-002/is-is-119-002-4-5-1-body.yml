text: '4.5.1 1ª Fase de Implantação (Maio de 2010 a Maio de 2011 - RBAC 121 ou Agosto 2010
  a

  Agosto 2011 - RBAC 135)

  A Fase 1, deve ser apresentada 1º de maio de 2011 para os operadores regidos pelo RBAC 121
  e

  até 1º de agosto de 2011 para os operadores regidos pelo RBAC 135. É a fase em que o Gestor

  Responsável estabelece as bases para alcançar a efetiva operação de seu SGSO. Deve ser

  apresentada uma proposta de como os requisitos do SGSO estabelecidos na regulação da ANAC
  e

  ainda não existentes ou efetivos serão implantados e integrados às atividades diárias da

  organização, bem como um quadro definindo os responsáveis por que essa implantação de forma

  que ocorra conforme o planejado.

  Desta forma, passa a ser requisito para a obtenção ou manutenção do certificado que, a partir
  de

  1º de junho de 2011 aos operadores regidos pelo RBAC 121 e de 1º de setembro de 2011 aos

  operadores regidos pelo RBAC 135, o Gestor Responsável de um Detentor do Certificado seja

  capaz de demonstrar que:

  a. Existe um Gestor Responsável identificado e suas responsabilidades para com a

  segurança operacional, bem como as responsabilidades dos outros membros da

  direção estão definidas e efetivas, conforme prevê o Apêndice H, parágrafos (d)(2) e'
