section_title: 1ª Fase de Implantação (Maio de 2010 a Maio de 2011 - RBAC 121 ou Agosto 2010
  a
subsection_id: d
cite: 4.5.1(d)
title: 4.5.1(d)
text: '(d)(3);

  b. Foi identificado explicitamente e designado pelo Gestor Responsável o Diretor ou

  Gerente de Segurança Operacional, ou um grupo de planejamento, que está

  responsável pela implantação o SGSO, conforme estabelecido no Apêndice H, (d)(4)(i)

  e (ii);

  c. Existe uma descrição escrita de seu SGSO;

  d. Foi realizada e está disponível a análise do faltante (“gap”) dos recursos existentes

  comparados com os requisitos estabelecidos no Apêndice H (d)(4)(iv) para a

  implantação do SGSO;

  e. Foi desenvolvido e está disponível o plano de implantação do SGSO, incluindo um

  cronograma, que explique como a organização pretende implantar o SGSO baseado

  nos requisitos nacionais e normas e métodos recomendados internacionais, a partir da

  descrição do sistema e dos resultados da análise do faltante (Apêndice H, (d)(4));

  f. Foi desenvolvida e documentada a política e os objetivos de segurança operacional

  (Apêndice H, (d)(6)(i)); eData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  g. Foram desenvolvidos e estão documentados os meios de comunicação e difusão da

  segurança operacional na EMPRESA (Apêndice H, (g)(2)).

  A ANAC pode, a partir da avaliação dos riscos à segurança operacional identificados em

  documentos oficiais, exigir a antecipação de algum requisito previsto inicialmente para
  outra fase.

  Entretanto, as alterações devem ser fundamentadas, considerando o gerenciamento dos riscos
  à

  segurança operacional da aviação civil pela ANAC, previsto no PSOE-ANAC, parte integrante
  do

  PSO-BR.'
