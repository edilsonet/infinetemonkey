title: 2ª Fase de Implantação (Maio de 2011 a Maio de 2012 - RBAC 121 ou Agosto 2011 a
text: '4.5.2 2ª Fase de Implantação (Maio de 2011 a Maio de 2012 - RBAC 121 ou Agosto 2011
  a

  Agosto 2012 - RBAC 135)

  A partir de maio de 2012 para os operadores regidos pelo RBAC 121 ou agosto de 2012 para
  os

  operadores regidos pelo RBAC 135, passa a ser requisito para a obtenção ou manutenção do

  certificado que o Gestor Responsável de um Detentor do Certificado seja capaz de demonstrar,

  além do estabelecido na Fase anterior, que:

  a. Foram implantados os processos reativos e preventivos, no que couber, do

  gerenciamento de riscos de segurança operacional (Apêndice H, (e)) relacionados com

  a:

  I. identificação de perigos; e

  II. avaliação e mitigação dos riscos.

  b. Foram oferecidos e podem ser comprovados os treinamentos previstos no programa

  de treinamento da EMPRESA, tanto aqueles relativos ao plano de implantação do

  SGSO e aos processos reativos do gerenciamento dos riscos de segurança operacional,

  como os demais aprovados; e

  c. Foi desenvolvida e pode ser comprovada a estrutura adotada para a documentação

  relacionada com o plano de implantação do SGSO e dos processos reativos do

  gerenciamento de riscos da segurança operacional (Apêndice Q (d)(6) ou H (d)(6)).

  Caso durante o período reservado para o desenvolvimento e a implantação da segunda fase
  o

  Gestor Responsável identificar que não será capaz de cumprir com o estabelecido deve avaliar
  e

  propor um replanejamento das ações para aceitação pela ANAC. Entretanto, o prazo final

  permanece sendo 2014 para a conclusão do processo, a menos que a ANAC autorize uma maneira

  alternativa de cumprir com este requisito.'
