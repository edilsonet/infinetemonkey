text: '4.5.4 4ª fase de Implantação (Maio de 2013 a Maio de 2014 - RBAC 121 ou Agosto 2013
  a

  Agosto 2014 - RBAC 135)

  A partir de maio de 2014 para os operadores regidos pelo RBAC 121 ou agosto de 2014 para
  os

  operadores regidos pelo RBAC 135, passa a ser requisito para a obtenção ou manutenção do

  certificado que a Empresa seja capaz de demonstrar, além do estabelecido nas Fases anteriores,

  que:

  a. Foi implantado e está funcionando o processo de garantia da segurança operacional,

  desenvolvendo (Apêndice Q (f) ou Apêndice H (f)) relativa à definição e controle dos:

  I. níveis aceitáveis de segurança operacional;

  II. indicadores e metas de desempenho; e

  III. processos de melhoria contínua do SGSO.

  b. Foram implantados e podem ser comprovados os demais processos relacionados com

  a garantia da segurança operacional, desenvolvendo (Apêndice Q (f) ou Apêndice H'
