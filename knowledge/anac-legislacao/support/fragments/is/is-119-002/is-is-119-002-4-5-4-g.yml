text: '(g)(1) ou Apêndice H (g)(1)); e

  d. Foi desenvolvida e pode ser comprovada a estrutura adotada para a documentação

  relativa à garantia da segurança operacional e ao plano de resposta a emergências

  (Apêndice Q(d)(6) ou Apêndice H (d)(6)).

  Uma vez que 2014 é o prazo final para a implantação do SGSO do Detentor do Certificado,
  o

  Gestor Responsável deve ser capaz de demonstrar que atende ao estabelecido no RBAC 119,
  RBAC

  121 ou RBAC 135, de forma completa. Destaca-se que o certificado pode ser suspenso ou

  cancelado caso não o Gestor Responsável não consiga demonstrar que seu SGSO está implantado

  e que suas atividades ocorrem dentro do NADSO acordado com a ANAC.

  Desta forma, assim como nas demais fases de implantação, cabe ao Gestor Responsável pelo

  Detentor do Certificado identificar, com antecedência, suas dificuldades para cumprir com
  o

  estabelecido, e solicitar à ANAC, antes do vencimento do prazo, um replanejamento das ações
  e

  uma nova data para a conclusão dessa implantação.Data da emissão: 9 de novembro de 2012
  IS nº 119-002

  REVISÃO D'
