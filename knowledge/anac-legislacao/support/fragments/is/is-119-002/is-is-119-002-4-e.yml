title: 4(e)
text: 'e) gestor responsável: pessoa física, designada pelo detentor e/ou requerente de

  certificado para atuar em seu nome, com autoridade corporativa para assegurar que

  todas as atividades de operações e de manutenção do detentor de certificado possam

  ser financiadas e realizadas com o nível de segurança operacional requerido pela

  ANAC e estabelecido no SGSO da organização.'
