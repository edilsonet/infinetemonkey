title: 4(f)
text: 'f) indicadores de desempenho de segurança operacional (IDSO): representam uma

  medição quantitativa do desempenho de segurança operacional de um provedor de

  serviços de aviação civil (PSAC), são expressos em termos quantificáveis,

  associados aos resultados de uma dada atividade realizada pelo provedor de

  serviços.'
