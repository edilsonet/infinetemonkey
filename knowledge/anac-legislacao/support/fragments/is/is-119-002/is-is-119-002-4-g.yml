title: 4(g)
text: 'g) metas de desempenho da segurança operacional (MDSO): Representam uma

  referência de nível de desempenho de segurança operacional desejado para um

  PSAC, em um prazo definido, devendo ser expresso em termos numéricos e deve

  ser acordado com a ANAC.'
