title: 4(h)
text: 'h) nível aceitável de desempenho da segurança operacional (NADSO): É uma

  referência mensurável para medir o desempenho de segurança operacional de um

  PSAC, proposto em seu SGSO como parte de seus objetivos de segurança

  operacional, e que deve ser aceito pela ANAC.'
