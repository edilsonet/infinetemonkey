text: 'm) programa de segurança operacional específico da agência nacional de aviação

  civil (PSOE-ANAC): Documento que apresenta os requisitos para a atuação da

  ANAC, como órgão regulador, nas áreas de sua competência legal: Anexos 1, 6, 8 e

  14 da Convenção de Aviação Civil Internacional, conforme estabelecido no PSO-

  BR, e as diretrizes e requisitos da ANAC para orientar a implantação eData da emissão: 9
  de novembro de 2012 IS nº 119-002

  REVISÃO D

  desenvolvimento dos SGSO por parte de seus entes regulados (PSAC).'
