title: 4(n)
text: 'n) provedores de serviços de aviação civil (PSAC): são as organizações que prestam

  serviços de aviação civil, definidas no PSOE-ANAC, cuja regulação de

  gerenciamento da segurança operacional é responsabilidade da ANAC, conforme

  estabelecido no PSO-BR.'
