text: 'q) segurança operacional: é o estado no qual o risco de lesões a pessoas ou danos a

  bens se reduzem e se mantêm em um nível aceitável ou abaixo deste, por meio de

  um processo contínuo de identificação de perigos e gestão de riscos.'
