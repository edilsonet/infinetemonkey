text: 's) sistema de gerenciamento da segurança operacional (SGSO): é um conjunto de

  ferramentas gerenciais e métodos organizados de maneira a apoiar as decisões que

  devem ser tomadas por um provedor de serviços da aviação civil (PSAC) com

  relação ao risco relativo às suas atividades diárias.'
