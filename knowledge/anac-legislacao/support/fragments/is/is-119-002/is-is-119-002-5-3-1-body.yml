title: Indicadores de desempenho de segurança operacional
text: '5.3.1 Indicadores de desempenho de segurança operacional

  Devem ser apresentadas as medidas ou parâmetros que estão sendo empregados para expressar
  o

  nível de desempenho de segurança operacional alcançado pela empresa de transporte aéreo.

  Inicialmente, devem ser considerados, pelo menos, indicadores que reflitam o nível de implantação

  do SGSO estabelecido para cada fase no plano de implantação aceito e acordado com a ANAC.

  Devem ser considerados, ainda, indicadores que reflitam objetivos reativos de correção de
  não

  conformidades identificadas internamente ou por meio de auditorias externas, inclusive da
  própria

  ANAC.'
