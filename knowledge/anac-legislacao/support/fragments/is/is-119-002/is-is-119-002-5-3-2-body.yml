title: Metas de desempenho de segurança operacional
text: '5.3.2 Metas de desempenho de segurança operacional

  Uma vez estabelecidos os indicadores acima, o gestor responsável deve declarar as metas
  para

  cada um.

  Essas metas devem ser representadas por uma medição quantitativa do desempenho de segurança

  operacional esperado para um prazo definido pelo Gestor Responsável, apoiado pelo Diretor
  ou

  Gerente de Segurança Operacional.

  Devem servir como uma referência para o nível de desempenho de segurança operacional

  desejado e acordado com a ANAC, sendo necessariamente expressos em termos numéricos.'
