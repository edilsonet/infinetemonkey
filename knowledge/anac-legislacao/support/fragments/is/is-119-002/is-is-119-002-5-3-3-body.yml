text: '5.3.3 Requisitos de segurança operacional do SGSO

  Devem ser apresentados aqui as ações e os meios necessários para atingir as metas de

  desempenho de segurança operacional declarados pelo gestor responsável da empresa em 5.3.2,

  acima.

  Estes requisitos devem estar incluídos nas fases propostas no plano de implantação, de acordo

  com o componente/elemento a que se refere.

  5.4 RESPONSABILIDADE DA DIREÇÃO ACERCA DA SEGURANÇA

  OPERACIONAL

  O Sr.<COLOCAR O NOME>, designado Gestor Responsável pelo <NOME DO DETENTOR DO

  CERTIFICADO>, é o responsável final, independente de outras funções para, em seu nome,

  garantir a implantação e manutenção do SGSO.Data da emissão: 9 de novembro de 2012 IS nº
  119-002

  REVISÃO D

  O Gestor Responsável tem autoridade corporativa para assegurar que todas as nossas atividades

  de operações e de manutenção possam ser financiadas e realizadas com o nível de segurança

  operacional requerido pela ANAC e estabelecido neste SGSO.

  Além das responsabilidades acima, como Gestor Responsável pelo <NOME DO DETENTOR DO

  CERTIFICADO>tenho as seguintes responsabilidades:'
