  aberta em qualquer das posições listadas no item 1 deste MGSO.

  5.5 DESIGNAÇÃO DO PESSOAL CHAVE DE SEGURANÇA OPERACIONAL

  Para implantar, operar e manter nosso SGSO, foi estabelecida a estrutura de segurança

  operacional abaixo, proporcional ao tamanho e complexidade da nossa organização.

  COLOCAR O ORGANOGRAMA RELACIONADO COM O SGSO'
