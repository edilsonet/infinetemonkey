title: Diretor ou Gerente de Segurança Operacional
text: '5.5.1 Diretor ou Gerente de Segurança Operacional

  Fica designado o Sr. <NOME> como <Diretor ou Gerente> de Segurança Operacional do <NOME

  DO DETENTOR DO CERTIFICADO>, que foi aceito pela ANAC, e possui experiência,

  competência e qualificação adequada ao cargo, sendo responsável individualmente e como ponto

  focal para a implantação e manutenção de um SGSO efetivo.

  O Sr. <NOME> passa a ser responsável em nome do Gestor Responsável, por:'
