title: 5.5.1(e)
text: 'e) Supervisionar a eficácia da segurança operacional dos setores que participam diretamente

  da prestação dos serviços.

  Além das responsabilidades e atribuições acima, o Sr. <NOME> fica encarregado de comunicar
  à

  ANAC qualquer Evento de Segurança Operacional - ESO que ocorra durante as nossas atividades.

  Esses ESO incluem acidentes, incidentes graves, incidentes, ocorrências de solo, ocorrências

  anormais ou qualquer situação de risco que tenha o potencial de causar dano ou lesão ou
  ameace

  a viabilidade da operação do <NOME DO DETENTOR DO CERTIFICADO>.'
