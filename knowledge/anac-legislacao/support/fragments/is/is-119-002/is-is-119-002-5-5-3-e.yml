text: 'e) Retorno das atividades de emergência às operações normais do DETENTOR DE

  CERTIFICADO.

  O Plano de Resposta a Emergências (PRE), parte integrante deste MGSO, detalha por escrito
  as

  ações que serão adotadas depois de um acidente ou incidente grave, designando um responsável

  por cada ação.

  O <NOME> <Diretor ou Gerente> de Segurança Operacional da empresa é o responsável por

  buscar junto aos operadores aeroportuários, identificados em nossas Especificações Operativas,

  cópia dos Planos de Emergência Aeroportuários (PLEM), de forma a incluir no PRE de nossa

  Empresa os riscos à segurança operacional associados.

  De posse dessas cópias, os envolvidos no PRE, principalmente os que atuam em nossas bases

  desses aeroportos, se comprometem a colaborar, no que for de sua responsabilidade, para
  que o

  aeródromo volte a operar em condições de segurança operacional ou volte à normalidade de
  suas

  operações o mais rápido possível.

  5.9 DOCUMENTAÇÃO

  Todas as atividades relacionadas ao Sistema de Gerenciamento da Segurança Operacional de

  nossa organização estão documentadas e disponíveis a todos de nossa Empresa, de acordo com
  o

  nível de responsabilidade dos envolvidos. Desta forma, conhecer este MGSO passa a ser um

  elemento essencial para a eficácia de nosso próprio SGSO.

  A documentação do SGSO buscou incluir ou fazer referência, conforme o caso, a todos os

  regulamentos pertinentes e aplicáveis à nossa operação, tantos os emitidos pela ANAC quanto
  os

  resultados de trabalhos internos. A manutenção de uma relação de documentos válidos, suaData
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  distribuição ou permissão de acesso é de responsabilidade do <NOME E CARGO DO

  RESPONSÁVEL>.

  A inclusão de formulários e modelos para a padronização de nossos registros e documentação

  específicos do SGSO é fundamental para que alcancemos os objetivos estabelecidos em nossa

  política. Esses registros e documentação incluem, entre outros, formulários de notificação
  de

  perigos, cadeia de comando para as responsabilidades e ações relativas ao gerenciamento
  da

  segurança operacional, bem como a estrutura proposta para o SGSO da empresa (COLOCAR AS

  DEMAIS PROPOSTAS INCLUÍDAS).

  O <NOME E FUNÇÃO> é o responsável por apresentar as diretrizes para a gestão dos registros,

  bem como de seu tratamento, armazenamento, recuperação e conservação das informações.

  Desta forma, este MGSO passa a ser o documento chave para a divulgação e comunicação do

  enfoque adotado pela <NOME DO DETENTOR DO CERTIFICADO> para a segurança operacional de

  toda nossa Empresa, incluindo a política e os objetivos de segurança operacional, os

  procedimentos e as responsabilidades individuais relacionados à implantação e operação do

  SGSO.

  O <NOME E FUNÇÃO> fica responsável para em nome do <NOME DO DETENTOR DE

  CERTIFICADO> por desenvolver, divulgar e manter atualizado este MGSO em <papel ou meio

  eletrônico>, contendo:

  (1) Termo de aprovação e aceitação

  (2) Termo de Responsabilidades

  (3) Informações gerais sobre o DETENTOR DE CERTIFICADO

  (4) Descrição do ambiente operacional

  (5) Análise do faltante

  (6) Plano de implantação do SGSO

  (7) Políticas e objetivos de segurança operacional

  (8) Gerenciamento dos riscos à segurança operacional

  (9) Garantia da segurança operacional

  (10) Promoção da segurança operacional

  5.10 COMPROMISSO FINAL SOBRE A SEGURANÇA OPERACIONAL DA <NOME

  DO DETENTOR DE CERTIFICADO>

  Eu, _____________________________, como Gestor Responsável da <NOME DO DETENTOR DO

  CERTIFICADO> declaro meu compromisso perante a ANAC de garantir a segurança operacional
  em

  nossas atividades por meio da implantação, operação e manutenção deste SGSO, buscando

  sempre a melhoria contínua da segurança operacional em nossas operações.

  Declaro, ainda, conhecer as normas brasileiras aplicáveis ao gerenciamento de segurança

  operacional e me disponho a contribuir com o Estado Brasileiro na promoção de uma cultura
  de

  segurança operacional na aviação civil.

  <Cidade>, xx de (mês) de 20XX

  Assinatura

  <NOME DO GESTOR RESPONSÁVEL DO DETENTOR DO CERTIFICADO>Data da emissão: 9 de novembro de
  2012 IS nº 119-002

  REVISÃO D'
