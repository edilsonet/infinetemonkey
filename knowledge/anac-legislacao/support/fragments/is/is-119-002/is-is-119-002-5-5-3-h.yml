text: 'h) Informar e aceitar a direção estratégica da CSO da organização.

  5.6 PLANO DE IMPLANTAÇÃO DO SGSO

  O Plano de implantação do SGSO foi elaborado pelo grupo de planejamento, instituído conforme

  documento <COLOCAR NOME, NUMERO DO DOCUMERO E DATA>, que incluiu os membros da alta

  direção abaixo listados, apoiados pelo <NOME><Diretor ou Gerente> de Segurança Operacional,

  que passa a assumir o compromisso de desenvolver e implantar o SGSO de nossa empresa.

  LISTAR OS MEMBROS DESIGNADOS

  O grupo de planejamento acima realizou entrevistas e conversou com os diversos setores de
  nossa

  organização, buscando as informações e os dados necessários para desenvolver a análise do

  faltante apresentada no Capítulo 3. O objetivo dessa análise foi avaliar toda a estrutura
  existente

  frente aos requisitos de SGSO estabelecidos pela ANAC no RBAC 121 ou RBAC 135 e demais

  regulamentos relacionados com a segurança de nossas operações.

  Uma vez identificadas as carências em nossa estrutura organizacional ou em nossos

  procedimentos e processos, o grupo definiu a abordagem para gerenciar a implementação dessas

  diferenças, de modo a satisfazer as política e os objetivos da alta direção, em função da

  complexidade do ambiente operacional da <NOME DO DETENTOR DO CERTIFICADO>. Essa

  abordagem gerencial foi aprovada pelo <NOME DO GESTOR RESPONSÁVEL> e está consolidada no

  plano de implantação do SGSO apresentado no Capítulo 4 deste MGSO.Data da emissão: 9 de
  novembro de 2012 IS nº 119-002

  REVISÃO D

  5.7 PROVIMENTO DOS RECURSOS HUMANOS E FINANCEIROS

  Eu, como Gestor Responsável da Empresa, assumo o compromisso de disponibilizar, em nome
  da

  <NOME DO DETENTOR DO CERTIFICADO> os recursos humanos e financeiros necessários à

  implantação e a operação propostas no Plano de Implantação do SGSO, envidando todos os

  esforços no sentido de assegurar orçamento e efetivo de funcionários compatíveis com a

  manutenção das atividades previstas neste MGSO, durante o tempo em que esta empresa

  permanecer operacional.

  5.8 COORDENAÇÃO DO PLANO DE RESPOSTA A EMERGÊNCIAS (PRE)

  O responsável pela coordenação geral das emergências de nossa organização é o <NOME E

  CARGO>, conforme <COLOCAR NOME, NUMERO E DATA DO DOCUMENTO>. Ele atuará em meu

  nome na tarefa de identificar a necessidade de rever os processos existentes e a necessidade
  de

  coordenação com outros setores de dentro ou de fora de nossa Empresa.

  É, ainda, responsável por apresentar relatórios à alta direção sobre as medidas adotadas
  para os

  casos de emergências e descritas em <COLOCAR A REFERÊNCIA AO PRE>, visando identificar a

  necessidade de serem incluídas novas ações ou alteradas as existentes, de forma a coordenar
  e

  manter um plano de resposta a emergências que assegure a(o):'
