title: POLÍTICAS E OBJETIVOS DE SEGURANÇA
text: '5. POLÍTICAS E OBJETIVOS DE SEGURANÇA

  OPERACIONAL

  5.1 RESPONSABILIDADES DA ADMINISTRAÇÃO (Modelo)

  A Segurança Operacional do <NOME DO DETENTOR DO CERTIFICADO > é responsabilidade

  de todos os seus empregados, bem como das demais pessoas que ali trabalham.

  Os cargos gerenciais apresentados no item 1 deste Manual (ou em outro local do MGO) possuem

  as qualificações compatíveis com o estabelecido na Seção 119.71, do RBAC 119.

  A política de segurança operacional aqui estabelecida contém nossos compromissos a respeito
  da

  segurança operacional, incluindo a responsabilidade de prover os recursos humanos e financeiros

  necessários para sua implantação. Esta política será divulgada a toda a organização.

  Esta política será revista periodicamente para assegurar que permaneça relevante e esteja

  apropriada à complexidade de nossas atividades e deve ser apoiada por todos os envolvidos
  com

  as atividades da organização.

  O Sr. (NOME DO DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL DESIGNADO) é <Diretor

  ou Gerente> de Segurança Operacional, sendo responsável pela implantação e administração
  do

  SGSO dentro da empresa, em meu nome.

  Os procedimentos estabelecidos neste documento devem ser obedecidos por todos, sejam

  empregados, gestores, contratados ou prestadores de serviço, que estão direta ou indiretamente

  envolvidos na prestação do serviço de (especificar) no (nome do Detentor do Certificado).

  O <Diretor ou Gerente> de Segurança Operacional possui responsabilidade direta no

  gerenciamento do risco das operações do (nome do Detentor do Certificado) e também de manter

  este MGSO atualizado em relação às atividades desenvolvidas.

  5.2 COMPROMISSOS DE SEGURANÇA OPERACIONAL

  Eu, como Gestor Responsável pelo <NOME DO DETENTOR DO CERTIFICADO> assumo os

  seguintes compromissos:'
