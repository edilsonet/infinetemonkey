  REVISÃO D

  5.3 OBJETIVOS DE SEGURANÇA OPERACIONAL

  Os objetivos de segurança operacional refletem os níveis aceitáveis de desempenho da segurança

  operacional para o nosso SGSO. Servem como uma referência mensurável para o desempenho de

  segurança operacional proposto nesse SGSO. Para cada objetivo de desempenho da segurança

  operacional foi necessário estabelecer um ou mais indicadores de desempenho da segurança

  operacional, junto com os resultados desejados, expressos em termos destes indicadores.

  O objetivo principal deste <NOME DO DETENTOR DO CERTIFICADO> é garantir que nossas

  atividades sejam desenvolvidas de forma a alcançar e manter ou melhorar o Nível Aceitável
  de

  Desempenho de Segurança Operacional (NADSO) acordado com a ANAC.

  Neste sentido, são apresentados a seguir os indicadores, as metas e os requisitos de segurança

  operacional estabelecidos para os objetivos de nossa empresa para a primeira fase do SGSO.
  À

  medida que nosso sistema evolua novos objetivos serão estabelecidos e acordados com a ANAC,

  de forma a garantir a melhora contínua da segurança operacional em nossas operações.'
