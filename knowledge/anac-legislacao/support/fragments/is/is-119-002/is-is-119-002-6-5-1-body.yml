title: Probabilidade dos Riscos à Segurança Operacional
text: '6.5.1 Probabilidade dos Riscos à Segurança Operacional

  O processo de controlar os riscos à segurança operacional decorrente dos perigos identificados,
  as

  conseqüências, se inicia com a avaliação da probabilidade de que cada uma dessas conseqüências

  realmente aconteça durante a prestação dos serviços certificados para o Detentor do Certificado.

  Este processo é denominado ‘processo de avaliação da probabilidade dos riscos à segurança

  operacional’, ou seja, uma metodologia para a avaliação dessa probabilidade. Para estabelecer

  essa probabilidade é importante que cada Gestor Responsável elabore perguntas que ajudem
  a

  identificar a situação de sua empresa frente àqueles eventos avaliados, como as apresentadas
  a

  seguir.'
