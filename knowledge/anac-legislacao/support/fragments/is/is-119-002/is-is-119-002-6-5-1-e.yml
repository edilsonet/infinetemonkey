cite: 6.5.1(e)
title: 6.5.1(e)
text: 'e) Existem conseqüências que podem afetar ou trazer conseqüências para nossa

  organização ou que podem se transformar em ameaças à segurança pública?

  A resposta a essas ou a outras perguntas dependem de se ter acesso a dados históricos ou
  de

  tendência que deveriam estar disponíveis na Biblioteca de Segurança Operacional. Assim,

  enquanto não existir uma biblioteca estruturada as avaliações somente poderão ser realizadas

  considerando opiniões ou tendências divulgadas na mídia.

  O <Diretor ou Gerente> de Segurança Operacional deve identificar a necessidade de consultar

  outros setores da Empresa, inclusive o GASO, para obter as respostas às perguntas da variável

  ‘probabilidade’ para cada conseqüência estudada.

  A tabela a seguir apresenta a proposta da ANAC para a avaliação de probabilidade, a ser
  adotada

  pelo Gestor Responsável até que saia uma regulação específica da Agência sobre gerenciamento

  de risco. Trata-se de uma tabela com cinco categorias de probabilidade de ocorrência de
  uma

  condição ou processo inseguro, bem como seu significado e um valor alocado a cada um.

  O Gestor Responsável pode propor significados diferentes para cada definição qualitativa

  apresentada na tabela adotada pela ANAC, de forma a apresentar situações de riscos específicos

  para cada situação estudada, mas essa modificação deve ser justificada nesta parte do trabalho.

  Entretanto, deve ser mantida a matriz de cinco variáveis qualitativas e as definições para
  cada

  nível de probabilidade, ou seja, Frequente, Ocasional, Remoto, Improvável, Muito improvável,
  bem

  como os valores associados a cada uma dessas variáveis, de um a cinco, sendo o maior

  correspondendo ao Frequente.Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
