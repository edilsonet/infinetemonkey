text: '6.5.2 Severidade dos Riscos à Segurança Operacional

  Uma vez avaliadas as consequências em termos de probabilidade, a segunda etapa de controle
  dos

  riscos à segurança operacional é avaliar a gravidade ou a severidade das consequências dos

  perigos identificados, se por acaso seu potencial de dano ocorrer durante a prestação dos
  serviços.

  Este processo é denominado ‘processo de avaliação da severidade dos riscos à segurança

  operacional’, ou seja, uma metodologia para a avaliação dessa severidade em uma eventual

  ocorrência.

  Assim como para a probabilidade, devem ser formuladas perguntas que ajudem à Empresa

  identificar a situação frente àqueles eventos avaliados, como as apresentadas a seguir'
