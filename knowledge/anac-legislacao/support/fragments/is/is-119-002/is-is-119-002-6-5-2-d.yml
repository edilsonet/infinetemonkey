title: 6.5.2(d)
text: 'd) Quais são as possíveis consequências políticas ou o interesse da mídia, caso ocorra?

  O <Diretor ou Gerente> de Segurança Operacional deve avaliar as considerações resultantes
  à

  consulta sobre as perguntas e concluir pela gravidade das possíveis consequências consideradas.

  Assim como no caso de probabilidade, a tabela da ANAC, apresentada a seguir, pode ser adotada

  tomando como base a pior situação previsível para cada perigo identificado.

  O Gestor Responsável pode propor significados diferentes para cada definição qualitativa
  na

  aviação apresentada na tabela adotada pela ANAC, de forma a apresentar situações de riscos

  específicos para cada situação estudada, mas essa modificação deveria ser justificada nesta
  parte

  do trabalho. Entretanto, deveria ser mantida a matriz de cinco variáveis qualitativas e
  as

  definições para cada nível de severidade, ou seja, Catastrófico, Crítico, Significativo,
  Pequeno,Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Insignificante, bem como os valores associados a cada uma dessas variáveis, de A a E, sendo
  que o

  “A” corresponderia ao Catastrófico.'
