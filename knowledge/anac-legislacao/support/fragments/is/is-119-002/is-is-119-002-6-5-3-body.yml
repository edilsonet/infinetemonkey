title: Tolerabilidade dos Riscos à Segurança Operacional
text: '6.5.3 Tolerabilidade dos Riscos à Segurança Operacional

  Uma vez avaliados os riscos à segurança operacional, para cada consequência, de ocorrer
  um

  evento ou condição insegura em termos de probabilidade e severidade, a terceira etapa do

  processo de controle a ser desenvolvido pelo <Diretor ou Gerente> de Segurança Operacional
  é a

  definição da ‘tolerabilidade’ dos perigos em função de suas consequências para as operações
  para

  as quais a Empresa é certificada pela ANAC.

  Na prática esta avaliação é feita em duas etapas. A primeira trata de obter uma avaliação
  geral dos

  riscos à segurança operacional combinando as duas tabelas, de probabilidade e de severidade,
  em

  uma matriz. Em seguida exporta-se o índice de risco à segurança operacional obtido pela
  matriz

  acima para a matriz de tolerabilidade dos riscos, apresentada a seguir.Data da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Esta matriz pode ser representada de outras formas pelo Gestor Responsável. Entretanto,
  deveria

  manter a coerência com o resultado adotado pela ANAC, conforme apresentado abaixo, de forma

  que seja identificado o que é aceitável, tolerável ou não tolerável. É importante lembrar
  que este

  resultado deve estar associado à avaliação antes (situação atual) e depois da implantação
  de

  novas defesas propostas para a mitigação dos riscos identificados.

  6.6 CONTROLE E MITIGAÇÃO DOS RISCOS À SEGURANÇA OPERACIONAL

  A última etapa do processo de gerenciamento dos riscos à segurança operacional é a avaliação

  sobre a necessidade de serem implantadas medidas mitigadoras ou de controle para que os
  riscos

  avaliados fiquem dentro de um Nível Aceitável de Desempenho de Segurança Operacional (NADSO)

  tanto pelo Gestor Responsável quanto pela ANAC. As medidas mitigadoras podem incluir a

  eliminação do perigo ou a adoção de defesas (tecnologia, treinamento e regulamento) que

  reduzam a probabilidade ou a severidade dos riscos avaliados.

  Na tabela acima, adotada pela ANAC, os resultados em vermelho (5A, 5B, 5C, 4A, 4B, 3A) são

  considerados inaceitáveis nas condições existentes, os amarelos (5D,5E, 4C, 4D, 4E, 3B,
  3C, 3D, 2A,

  2B, 2C) vão exigir a adoção de medidas mitigadoras e uma decisão por parte do Diretor ouData
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Gerente de Segurança Operacional ou do próprio Gestor Responsável, de forma a verificar
  qual a

  redução esperada após a adoção das medidas, e os verdes (3E, 2D, 2E, 1A, 1B 1C, 1D, 1E)
  são

  consideráveis aceitáveis.

  Se o resultado da avaliação da tolerabilidade apontar para um resultado em que a operação
  do

  Detentor de Certificado seja considerada inaceitável, o Gestor Responsável deve suspender
  as

  operações ou adotar medidas mitigadoras imediatas, de responsabilidade própria, que devem

  elevar o nível de risco à região tolerável.

  A continuidade das operações nesses casos requer, inicialmente, uma decisão do Diretor ou

  Gerente de Segurança Operacional ou do próprio Gestor Responsável, conforme a gravidade

  associada, ouvindo o GASO. Outro ponto importante a ser considerado nesta etapa é a

  identificação das medidas mitigadoras de implantação mais em longo prazo ou que sejam de

  responsabilidades de outros Detentores de Certificados.

  Nesses casos é necessário que o Gestor Responsável se responsabilize em verificar junto
  ao Gestor

  Responsável do outro Detentor de Certificado se as medidas podem ser implantadas e quando,

  bem como estabelecer uma forma de acompanhamento de sua efetiva implantação. Em qualquer

  caso, o importante é que as operações sejam mantidas em um nível aceitável ou suspensas
  pelo

  próprio Gestor Responsável, devendo informar à ANAC as medidas adotas e as razões que levaram

  à decisão.

  Uma vez aceita pelo Diretor ou Gerente de Segurança Operacional ou o próprio Gestor

  Responsável, conforme o caso, a mitigação e as estratégias a serem adotadas, como parte
  do

  processo de garantia da segurança operacional, as defesas propostas devem ser reavaliadas
  como

  novos perigos potenciais, visando assegurar a eficiência e eficácia dessas medidas de defesa
  no

  novo ambiente operacional.

  Entretanto, é importante que o <Diretor ou Gerente> de Segurança Operacional mantenha o

  acompanhamento não só dos resultados das medidas mitigadoras adotadas, para verificar sua

  eficácia, como também avaliar se as condições que levaram àquela tolerabilidade permanecem

  inalteradas. Caso algum dos parâmetros utilizado tenha sofrido uma variação significativa
  a

  avaliação de tolerabilidade do risco deve ser feita de novo.

  O Gestor Responsável deve aprovar os níveis de gerenciamento dos riscos a serem adotados
  pelo

  <Diretor ou Gerente>, que não podem ser menores do que os estabelecidos pela ANAC, mas

  podem ser mais restritivos. Independente de ser igual ou mais restritivo, a partir da aprovação

  pelo Gestor Responsável,mesmo antes da aceitação pela ANAC, todos ficam comprometidos com

  o processo ali estabelecido. E este o processo que será objeto de fiscalização por parte
  da ANAC.

  O <Diretor ou Gerente> de Segurança Operacional, em nome do Gestor Responsável, é responsável

  pela definição dos controles de segurança para cada risco avaliado, devendo garantir que
  as

  medidas existentes ou propostas sejam efetivamente implantadas e alcancem os resultados

  estabelecidos para o gerenciamento dos riscos à segurança operacional da Empresa.

  6.7 BIBLIOTECA DE SEGURANÇA OPERACIONAL

  O gerenciamento da documentação relacionada com os perigos deve ser tratado com um

  procedimento formal, que permita traduzir a informação de sua forma bruta em conhecimento

  relacionado com os perigos. A compilação e a gestão de forma contínua desse conhecimento
  são

  conhecidas como “biblioteca de segurança operacional”.Data da emissão: 9 de novembro de
  2012 IS nº 119-002

  REVISÃO D

