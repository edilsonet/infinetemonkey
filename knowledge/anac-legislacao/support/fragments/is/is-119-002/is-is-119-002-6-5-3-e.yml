title: 6.5.3(e)
text: 'e) Gestão das informações de segurança operacional obtidas, garantindo a

  rastreabilidade das ações decorrentes.

  A figura a seguir apresenta uma forma de estruturar o processo de documentação de perigos
  à

  segurança operacional, considerando as fontes reativas, preventivas e preditivas. Orienta
  a forma

  que deveriam ser trabalhados os perigos identificados e a gestão das medidas propostas até
  a

  formulação da biblioteca.

  Destaca-se ainda, a preocupação de deixar configurada a importância da divulgação dos estudos
  e

  das informações desenvolvidos a partir dessa biblioteca por meio de documentos internos
  e de

  conscientização do público interno e externo ao Gestor Responsável sobre os riscos avaliados.

  O processo a ser apresentado no MGSO deve se preocupar com a retroalimentação dessas

  informações geradas pelas análises do <Diretor ou Gerente> de Segurança Operacional ou da
  CSO

  para o controle e mitigação dos riscos à segurança operacional, incluindo a avaliação das

  conseqüências de cada perigo e as prioridades e responsabilidades relacionadas com as respostas

  e estratégias de mitigação adotadas.

  O <Diretor ou Gerente> de Segurança Operacional, como parte de suas funções, deve garantir
  a

  conservação da memória de segurança operacional, bem como que os dados ali armazenados

  sirvam como fonte de referência para as decisões dos membros da alta direção. Deve servir

  também para o acompanhamento dos resultados obtidos com a implantação das medidas

  mitigadoras adotadas a partir do processo de gerenciamento dos riscos do Gestor Responsável,

  visando realinhar essas ações caso os resultados que estão sendo alcançados não correspondam

  aos objetivos de segurança operacional estabelecidos pela Alta Direção.Data da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Outro processo a ser implantado pelo <Diretor ou Gerente> de Segurança Operacional diz respeito

  à divulgação do material elaborado contendo a análise de tendências, bem aqueles propostos
  com

  fins educacionais (boletins, informes, seminários de segurança operacional e outros).

  6.8 PROGRAMAS ESPECÍFICOS DE SEGURANÇA OPERACIONAL

  O <Diretor ou Gerente> de Segurança Operacional deve apresentar os programas específicos,
  caso

  existam, que o Gestor Responsável vem desenvolvendo com o objetivo de mitigar os riscos

  identificados, podendo estar neste item ou na parte relativa à promoção da segurança

  operacional, mais adiante, dependendo da abordagem adotada.

  Estes programas podem incluir, entre outros, programas de vistorias de segurança operacional;

  Programa de Gerenciamento de Recursos de Equipe (Corporate Resources Management - CRM);

  Programa de Incursão em Pista; Programa de Transporte de Cargas Perigosas em Aeronaves;

  Programa de Recuperação de Atitudes Anormais; Programa de Manuseio de Materiais Perigosos

  no Sítio Aeroportuário; Programa de Gerenciamento do Risco de Colisão com a Fauna, Programa

  de Gerenciamento da Fadiga, Programa de Conservação da Audição; Programa de Prevenção de

  FOD - Foreign Object Damage; Approach and Landing Accident Reduction - ALAR; Interferência
  de

  Dispositivos Eletrônicos Portáteis; Maintenance Operations Quality Assurance - MOQA; Prevenção

  de Colisão com Balões de Ar Quente não Tripulados; Prevenção de Colisão com o Solo em Voo

  Controlado - CFIT; Programa de Acompanhamento de Análise de Dados - PAADV/FOQA; Programa

  de Treinamento de Evacuação de Emergência - PTEE; Programa de Observação de Segurança -

  LOSA e Supervisão de Atividades das Empresas Sub-Contratadas de Terceiros.Data da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
