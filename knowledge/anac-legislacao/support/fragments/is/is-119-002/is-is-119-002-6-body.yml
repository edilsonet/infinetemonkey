title: O PROCESSO DE ACEITAÇÃO DO SGSO DE DETENTOR DE
text: '6. O PROCESSO DE ACEITAÇÃO DO SGSO DE DETENTOR DE

  CERTIFICADO.

  6.1 O Sistema de Gerenciamento da Segurança Operacional (SGSO) é o principal elemento

  do programa de gerenciamento dos riscos à segurança operacional pela ANAC, previsto

  no PSOE-ANAC. Além disso, é o elemento chave para se alcançar a meta para aData da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  aviação civil estabelecida pela ANAC, que é uma redução em 50%, até 2015, do valor

  do indicador registrado no ano de 2007, composto pelo número de acidentes ponderados

  pela exposição ao risco da aviação civil. Com essas ações, a ANAC espera aumentar a

  confiança do público e da comunidade no sistema de transporte aéreo brasileiro,

  adotando princípios de gerenciamento pró-ativo, em vez de considerar apenas o

  cumprimento dos requisitos da regulação.

  6.2 A Superintendência de Segurança Operacional (SSO), como parte importante desse

  esforço, editou em 2009 e 2010 os regulamentos que introduziram os conceitos de

  SGSO no processo de certificação de empresas de transporte aéreo, em voos regulares e

  não regulares, para o transporte aéreo público de passageiros, bens e malas postais; ou

  em operações com aviões civis, registrados no Brasil.

  6.3 Dentre os principais regulamentos editados estão os RBAC 119 - Certificação:

  Operadores Regulares e Não-Regulares, o RBAC 135 - Requisitos Operacionais:

  Operações Complementares e por Demanda e o RBAC 121 - Requisitos Operacionais:

  Operações Domésticas, de Bandeira e Suplementares, que incorporam a necessidade de

  implantar um SGSO ao processo de certificação, além de estabelecer os requisitos e as

  fases para essa implantação.

  6.4 Esses regulamentos, disponíveis no site da ANAC, definem que os detentores e/ou

  requerentes de um certificado, regulados pelo RBAC 121 devem entregar um Manual de

  Gerenciamento da Segurança Operacional (MGSO) até 30 de abril de 2011 e os

  regulados pelo RBAC 135, até 31 de julho de 2011, contendo sua proposta de

  implantação do SGSO para a empresa.

  6.5 O gerenciamento da segurança operacional envolve uma mudança organizacional e

  cultural nos detentores de certificados, que acabam por impactar os processos de

  certificação da ANAC. Por esse motivo, a ANAC acredita que a proposta de

  implantação do SGSO em fases, a ser levada a efeito pelos detentores e/ou requerentes

  de certificados, é a forma adequada para permitir que esta mudança seja alcançada sem

  comprometer a segurança operacional das atividades certificadas.

  6.6 Assim, o Manual de Gerenciamento da Segurança Operacional (MGSO) a ser

  desenvolvido pelo detentor e/ou requerente de um certificado e entregue como parte do

  processo de certificação, deve demonstrar, desde a 1ª fase, o compromisso de uma

  implantação efetiva dos requisitos previstos nos Apêndices Q e R do RBAC 121, e

  Apêndices H e I, do RBAC 135. O planejamento de implantação pode ser desenvolvido

  em até quatro fases, desde que não ultrapasse o prazo máximo de quatro anos. Isto

  significa dizer que, até dezembro de 2014, todos os operadores aéreos regulados pelo

  RBAC 119 devem estar com seus SGSO aceitos pela ANAC, implantados e operando.

  6.7 A concepção proposta nos regulamentos é que, a cada fase estabelecida no Apêndice R

  do RBAC 121 ou no Apêndice I do RBAC 135, sejam implantados novos

  componentes/elementos previstos no Apêndice Q do RBAC 121 ou no Apêndice H do

  RBAC 135. Neste sentido, esta IS auxilia os gestores responsáveis de detentores e/ou

  requerentes de um certificado no planejamento e implantação de seu SGSO. Ao aceitar

  o Plano de Implantação do SGSO, a ser entregue no MGSO na 1ª fase, a ANAC

  considera que o gestor responsável de um detentor e/ou requerente de um certificado

  fica comprometido com os prazos acordados para a efetivação dos requisitos.Data da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  6.8 Finalmente, os requerentes de um certificado de empresa de transporte aéreo posteriores

  à aprovação do RBAC 119, RBC 121 e do RBAC 135 devem consultar a ANAC para

  verificar a melhor estratégica para a implantação de seu SGSO, de forma que seja

  mantida a diretriz de, até dezembro de 2014, todos os operadores aéreos regulados pelo

  RBAC 119 estarem com seus SGSO aceitos pela ANAC, implantados e operando.'
