text: 'e) Gestor Responsável - pessoa física, designada pelo Detentor de Certificado para
  atuar

  em seu nome, com autoridade corporativa para assegurar que todas as atividades de operações
  e

  de manutenção do Detentor de Certificado possam ser financiadas e realizadas com o nível
  de

  segurança operacional requerido pela ANAC e estabelecido no SGSO da organização'
