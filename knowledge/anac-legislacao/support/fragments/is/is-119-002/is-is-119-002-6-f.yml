title: 6(f)
text: 'f) Indicadores de Desempenho de Segurança Operacional (IDSO). Representam uma

  medição quantitativa do desempenho de segurança operacional de um PSAC, expressos em

  termos quantificáveis, associados aos resultados de uma dada atividade realizada pelo provedor

  de serviços.'
