text: 'g) Metas de Desempenho da Segurança Operacional (MDSO). Representam uma

  referência de nível de desempenho de segurança operacional desejado para um PSAC, em um

  prazo definido, devendo ser expresso em termos numéricos e deve acordado com a ANAC.'
