title: 6(h)
text: 'h) Nível Aceitável de Desempenho da Segurança Operacional (NADSO). É uma referência

  mensurável para medir o desempenho de segurança operacional de um provedor de serviços de

  aviação civil (PSAC), proposto em seu SGSO como parte de seus objetivos de segurança

  operacional, e que deve ser aceito pela ANAC.'
