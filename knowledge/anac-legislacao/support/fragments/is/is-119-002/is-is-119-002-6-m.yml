title: 6(m)
text: 'm) Programa de Segurança Operacional Específico da Agência Nacional de Aviação Civil

  (PSOE-ANAC). Documento que apresenta os requisitos para a atuação da ANAC, como órgão

  regulador, nas áreas de sua competência legal: Anexos 1, 6, 8 e 14 da Convenção de Aviação
  Civil

  Internacional, conforme estabelecido no PSO-BR, e as diretrizes e requisitos da ANAC para
  orientar

  a implantação e desenvolvimento dos SGSO por parte de seus entes regulados (PSAC).'
