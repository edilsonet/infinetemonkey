text: 'n) Provedores de serviços de aviação civil (PSAC). São as organizações que prestam

  serviços de aviação civil, definidas no PSOE-ANAC, cuja regulação de gerenciamento da segurança

  operacional é responsabilidade da ANAC, conforme estabelecido no PSO-BR.'
