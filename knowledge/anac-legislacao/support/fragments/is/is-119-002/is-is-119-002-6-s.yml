text: 's) Sistema de Gerenciamento da Segurança Operacional (SGSO). É um conjunto de

  ferramentas gerenciais e métodos organizados de maneira a apoiar as decisões que devem ser

  tomadas por um provedor de serviços da aviação civil (PSAC) com relação ao risco relativo
  às suas

  atividades diárias.

  6.3 RESPONSÁVEL PELO GERENCIAMENTO DE RISCOS À SEGURANÇA

  OPERACIONAL DO <NOME DO DETENTOR DO CERTIFICADO>

  Deve ser identificado nesta parte o <DIRETOR OU GERENTE> de Segurança Operacional que, em

  nome do <NOME DO GESTOR RESPONSÁVEL>, ser o responsável para garantir a realização

  sistemática de coleta de dados relativos aos perigos à segurança das atividades realizadas
  pelo

  DETENTOR DE CERTIFICADO.

  Este responsável deve desenvolver e manter um banco de dados de segurança operacional

  (biblioteca de segurança operacional) e sistemas de processamento que permitam a identificação

  dos perigos existentes, assim como as análises e avaliações dos riscos associados e da tendência
  de

  agravamento da situação.

  Desta forma, este responsável pode elaborar, junto com o Grupo de Ação de Segurança

  Operacional (GASO), o planejamento de atividades que busquem mitigar os riscos de segurança

  operacional avaliados e manter a operação dentro do Nível Aceitável de Desempenho da

  Segurança Operacional (NADSO) estabelecido na política do Gestor Responsável e aceito pela

  ANAC.

  Deve descrever a interação do responsável por este gerenciamento com a Comissão de Segurança

  Operacional (CSO) e com o Grupo de Ação de Segurança Operacional (GASO), caso tenham sido

  criados, visando identificar claramente as responsabilidades de cada envolvido no processo

  proposto.

  É importante que o Gestor Responsável seja informado dos resultados obtidos e sobre a

  necessidade de implantar as ações necessárias para que o DETENTOR DE CERTIFICADO gerencie

  seus riscos à segurança operacional, mantendo-os dentro de um nível de desempenho aceitável

  pela alta direção e pela ANAC.

  6.4 IDENTIFICAÇÃO DE PERIGOS À SEGURANÇA OPERACIONAL

  Os perigos na aviação civil costumam ser de três tipos: naturais, técnicos ou econômicos.
  Na

  identificação dos perigos naturais é necessário avaliar o ambiente operacional do Detentor
  de

  Certificado considerando a possibilidade de eventos meteorológicos ou climáticos adversos,

  eventos geofísicos, condições geográficas e eventos ambientais ou de saúde pública.

  Os perigos à segurança operacional associados aos aspectos técnicos costumam estar relacionados

  às aeronaves e aos seus componentes, sistemas, subsistemas e equipamentos, instalações de
  uma

  organização, ferramentas e equipamentos, bem como a instalações, sistemas, subsistemas e

  equipamentos fora da organização, entre outros.Data da emissão: 9 de novembro de 2012 IS
  nº 119-002

  REVISÃO D

  No que se refere aos perigos associados aos aspectos econômicos é importante avaliar as

  condições do Detentor de Certificado e do setor em relação à expansão, recessão, custo do

  material ou equipamento etc.

  Na identificação dos perigos devem ser considerados, também, fatores de projeto, procedimentos

  e práticas operacionais, comunicações, fatores organizacionais, fatores do ambiente de trabalho,

  fatores regulamentares, defesas existentes e aspectos relacionados ao desempenho humano.

  O Gestor Responsável deve apresentar nesta parte do MGSO o processo formal desenvolvido,
  e

  como pretende mantê-lo atualizado, para coletar, registrar, atuar e gerar retroalimentação
  acerca

  dos perigos nas operações, baseado em uma combinação dos seguintes métodos de aquisição
  de

  dados:'
