subsection_id: a
cite: 7(a)
title: 7(a)
text: 'a) Política e objetivos estratégicos da segurança operacional

  a.1. Responsabilidade e compromisso da administração;

  a.2 Responsabilidades da direção acerca da segurança operacional;

  a.3 Estrutura organizacional e os responsáveis (pessoal-chave) pela segurança

  operacional em suas atividades;

  a.4 Plano de Implantação do SGSO;

  a.5 Coordenação do plano de resposta a emergências; e

  a.6 Documentação.'
