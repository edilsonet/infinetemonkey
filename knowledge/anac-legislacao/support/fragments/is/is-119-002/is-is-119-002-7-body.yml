  DISTRIBUIÇÃO E CONTROLE DE CÓPIAS

  Este MGSO será distribuído integralmente aos Diretores, Gerentes e Chefes de Departamento
  de nossa

  Empresa.

  O Diretor ou Gerente de Segurança Operacional é responsável por identificar os demais envolvidos
  com a

  Segurança Operacional de nossa organização que devem receber cópia integral ou parcial deste
  MGSO.

  A lista de distribuição abaixo indica os detentores do manual e o número das cópias.

  Cópia Detentor

  1 Presidente

  1 Vice Presidente

  1 Diretor ou Gerente de Segurança Operacional

  1 Biblioteca

  1 Secretaria

  2 Etc.Data da emissão: 9 de novembro de 2012 IS nº 119-002

