  REVISÃO D

  TERMO DE APROVAÇÃO E DE ACEITAÇÃO

  PARTE 1 - APROVAÇÃO PELO DETENTOR DO CERTIFICADO

  Eu, _______________________________, na qualidade de Gestor Responsável pela <COLOCAR O
  NOME

  DO DETENTOR DE CERTIFICADO>, aprovo o presente Manual de Gerenciamento da Segurança Operacional

  (MGSO), desenvolvido para atender aos requisitos estabelecidos na Subparte BB do RBAC 121
  ou na Seção

  135.29 do RBAC 135.

  A validade deste MGSO é indeterminada a partir desta aprovação, devendo as atualizações
  ser

  comunicadas à ANAC com antecedência necessária a sua aceitação, antes de sua incorporação
  às atividades

  da <COLOCAR O NOME DO DETENTOR DE CERTIFICADO>.

  Cidade, XX de (mês) de 20XX

  ____________________________________

  (Nome e assinatura do Gestor Responsável)

  PARTE 2 - ACEITAÇÃO PELA ANAC

  Este Manual de Gerenciamento da Segurança Operacional (MGSO) é considerado aceito pela ANAC,
  uma

  vez que seu conteúdo atendeu aos requisitos aplicáveis, conforme processo de aceitação consubstanciada

  no FORM 111, integrante deste MGSO.

  O Plano de Implantação do SGSO da <NOME DO DETENTOR DE CERTIFICADO >, constante deste MGSO
  foi

  analisado e reflete o compromisso do Gestor Responsável com a garantia da manutenção da
  segurança

  operacional em suas operações enquanto implanta os componentes/elementos faltantes, de acordo
  com o

  Plano aceito.

  A implementação do Plano aceito passa a se configurar como o Nível Aceitável de Desempenho
  de

  Segurança Operacional (NADSO) considerado aceito pela ANAC para essa <NOME DO DETENTOR DE

  CERTIFICADO>, ficando o Sr. <NOME DO DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL>

  responsável pela manutenção desse NADSO em nome do Gestor Responsável.

  Rio de Janeiro, XX de Xxxxxxxx de 2011.

  __________________________________ _______________________________

  (Nome e assinatura do INSPAC responsável) (Nome e assinatura do GCTA)Data da emissão: 9
  de novembro de 2012 IS nº 119-002

  REVISÃO D

  PARTE 1 - DO DETENTOR DO CERTIFICADO

  A Empresa <NOME DO DETENTOR DE CERTIFICADO>, detentora do certificado nº 20XX-XX-XXXX-XX-XX,

  assume perante a Agência Nacional de Aviação Civil (ANAC) o compromisso de implantar a política
  de

  segurança operacional definida neste documento de acordo com os regulamentos aplicáveis.

  PARTE 2 - DA DESIGNAÇÃO DO GESTOR RESPONSÁVEL

  Eu, ______________________________, como representante legal do <NOME DO DETENTOR DE

  CERTIFICADO>, detentora do certificado nº 20XX-XX-XXXX-XX-XX, assumo as responsabilidades
  de Gestor

  Responsável, previstas no <RBAC 12 ou RBAC 135>, me comprometendo a adotar as ações necessárias
  à

  implantação e manutenção do SGSO de nossa Empresa, independente de outras funções que venha
  a

  assumir.

  PARTE 3 - DA DESIGNAÇÃO DO DIRETOR OU GERENTE DE SEGURANÇA

  OPERACIONAL

  Eu, ______________________________, como Gestor Responsável pelo <NOME DO DETENTOR DE

  CERTIFICADO> designo o Sr. _________________________ como nosso <Diretor ou Gerente> de
  Segurança

  Operacional.

  Declaro, ainda, que o Sr. _________________________ possui experiência suficiente, competência
  e

  qualificação adequada, de acordo com os requisitos estabelecidos na regulação em vigor e
  teve sua

  designação aceita pela ANAC.

  O Sr. _________________________, será responsável individualmente e ponto focal para a implantação
  e

  manutenção do SGSO de nossa Empresa, de forma a atender o Plano de Implantação aceito pela
  ANAC e a

  garantir sua efetividade.

  Rio de Janeiro, XX de Xxxxxxxx de 20xx.

  _____________________________________________________

  (nome, função e assinatura do Gestor Responsável)Data da emissão: 9 de novembro de 2012
  IS nº 119-002

  REVISÃO D

  CONTROLE DE REVISÕES

  O registro de revisões descrito abaixo identifica as páginas que foram alteradas neste Manual.

  Obs.: Mantenha-o sempre atualizado. Havendo perda do mesmo, informe imediatamente ao Diretor
  ou

  Gerente de Segurança Operacional do (nome do DETENTOR DE CERTIFICADO), visando à sua reposição.

