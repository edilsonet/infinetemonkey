text: 'c) Eliminar ou modificar os controles do risco à segurança operacional que já não sejam

  necessários ou efetivos devido às mudanças produzidas no ambiente operacional.

  O Gestor Responsável, com o suporte do <Diretor ou Gerente> de Segurança Operacional, deve

  verificar a necessidade de elaborar o Plano de transição, previsto no Parágrafo (g), da
  Seção 135.2,

  do RBAC 135, para sua Empresa. Caso seja necessário, deve submeter à ANAC esse plano

  (contendo um calendário de eventos) para mudar de operações regulares segundo os requisitos

  de operações complementares do RBAC 135 para os requisitos de operações domésticas ou de

  bandeira do RBAC 121. Cada plano de transição deve conter detalhes sobre o seguinte:'
