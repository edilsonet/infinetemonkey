title: 7(d)
text: 'd) Promoção da segurança operacional

  d.1 Treinamento e qualificação; e

  d.2 Divulgação do SGSO e da comunicação acerca da segurança operacional.

  7.2 O Apêndice A apresenta um resumo do que deveria ser implantado em cada fase,

  considerando o estabelecido no Apêndice R do RBAC 121 ou no Apêndice I do RBAC

  135, sendo que os elementos “Documentação” e “Treinamento” devem ser comuns a

  todas as fases e implantados de forma a incorporarem os novos conceitos vinculados aos

  componentes e elementos de cada fase.'
