  necessário que o Gestor Responsável ou o <Diretor ou Gerente> de Segurança Operacional

  submeta à ANAC o nome e o currículo dos auditores a serem utilizados nessas auditorias.

  Finalmente, deve ser apresentado como parte do sistema de supervisão e medição do desempenho

  da segurança operacional implantado pelo Gestor Responsável, em nome do Detentor de

  Certificado, qual o sistema de retroalimentação adotado para garantir que o <Diretor ou
