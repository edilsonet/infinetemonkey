  de Segurança Operacional incorpore no processo de gerenciamento de risco à segurança

  operacional as medidas preventivas e corretivas apropriadas e oportunas a serem adotadas
  em

  resposta aos informes resultantes das auditorias independentes.

  7.3 GERENCIAMENTO DA MUDANÇA.

  Para definir os processos de gestão da mudança a serem apresentado MGSO é importante

  considerar os fatores internos (expansão, contratação, mudanças nos sistemas existentes,

  equipamentos, programas, produtos e serviços e a introdução de novos equipamentos ou

  procedimentos) bem como os externos (mudanças físicas e das condições operacionais dos

  aeródromos, mudança de regulação).

  Assim, o <Diretor ou Gerente> de Segurança Operacional deve estabelecer um processo formal
  de

