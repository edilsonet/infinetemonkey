text: 'e) Assegurar o nível de conhecimentos, treinamento e manutenção da competência do

  pessoal.

  O Gestor Responsável pode contratar outra organização ou pessoa com conhecimentos técnicos

  aeronáuticos apropriados e com experiência demonstrada em auditorias para realizar as

  auditorias independentes de segurança operacional propostas no Manual. Entretanto, éData
