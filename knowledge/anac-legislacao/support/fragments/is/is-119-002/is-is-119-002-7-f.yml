cite: 7(f)
title: 7(f)
text: 'f) Medidas de processo - meios de proporcionar às partes responsáveis as informações

  necessárias para verificar se as ações estabelecidas estão sendo realizadas, se os

  produtos definidos estão sendo produzidos e os resultados previstos estão sendo

  alcançados.

  O <Diretor ou Gerente> de Segurança Operacional deve apresentar no MGSO os procedimentos

  estabelecidos para a identificação dos perigos à segurança operacional (reportes de segurança

  operacional; auditorias independentes de segurança operacional; pesquisas de segurança

  operacional; revisões de segurança operacional; estudos de segurança operacional; e investigações

  internas de segurança operacional, que incluam eventos que não requeiram ser reportados
  à

  ANAC), inclusive informando quais são processos internos e quais são ou podem ser alimentados

  por terceiros, incluindo as atividades de fiscalização da ANAC.

  Deve apresentar, ainda, os procedimentos estabelecidos para receber e processar os reporte
  de

  segurança operacional relacionados com o desempenho da segurança operacional e seu

  monitoramento, definindo como estariam identificando e processando os tipos de comportamentos

  operacionais considerados aceitáveis ou inaceitáveis, incluindo as condições sob as quais
  se

  considerará a imunidade às medidas disciplinares.

  Um aspecto importante é que os processos operacionais sejam elaborados incorporando, sempre

  que possível, controles dos riscos à segurança operacional tendo como base a aplicação dos

  princípios da gestão da qualidade.

  O Gestor Responsável deve demonstrar no MGSO como pretende disponibilizar e manter os meios

  e procedimentos necessários para:'
