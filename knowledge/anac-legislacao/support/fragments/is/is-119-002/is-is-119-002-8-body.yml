title: PROMOÇÃO DA SEGURANÇA OPERACIONAL
text: '8. PROMOÇÃO DA SEGURANÇA OPERACIONAL

  8.1 INTRODUÇÃO

  A atividade de segurança operacional de um Detentor de Certificado não terá êxito somente
  por

  determinação da alta direção ou pela imposição mecânica de políticas. A promoção de segurança

  operacional é parte fundamental para a implantação de uma mudança no comportamento

  individual e de toda a organização, preenchendo os vazios deixados pela política, procedimentos
  e

  processos organizacionais, e proporcionando um sentido para as ações de segurança operacional
  a

  serem implantadas.

  A maioria dos processos e procedimentos especificados nos demais componentes do SGSO

  proporciona os elementos estruturais básicos para o sistema. Entretanto, o Gestor responsável

  precisa estabelecer, também, processos e procedimentos que permitam a comunicação entre
  o

  pessoal operativo e a administração.

  O <Diretor ou Gerente> de Segurança Operacional deve estabelecer um processo que permita

  comunicar as metas ou objetivos estabelecidos pela alta direção, bem como a situação atual
  das

  atividades e os sucessos significativos. Por outro lado, deve ser apresentada também, a
  maneira

  pela qual os empregados podem fazer comunicações de segurança operacional em um ambiente

  colaborativo.

  Aqui, mais uma vez recorda-se que, como nos dois anteriores, este capítulo do MGSO é evolutivo,

  em função das ações propostas no Plano de Implantação do SGSO. Devem, portanto, os

  responsáveis por desenvolver esta parte do documento estar cientes da necessidade de

  compatibilizar as propostas com a que conta em cada fase, e evoluir o texto a cada emenda
  a ser

  encaminhada após a conclusão de cada fase.

  8.2 TREINAMENTO E QUALIFICAÇÃO

  Os requisitos da Subparte BB do RBAC 121 ou Subparte H do RBAC 135 apresentam a necessidade

  de cada Detentor de Certificado sujeito àquele regulamento estabelecer e manter um programa

  de treinamento aprovado para as tripulações, examinadores, instrutores e pessoal de operações

  empregado ou usado por ele.

  Em complemento, o Apêndice Q do RBAC 121 ou Apêndice H do RBAC 135, apresenta os requisitos

  de capacitação em segurança operacional para garantir que o pessoal envolvido esteja

  adequadamente qualificado nos conceitos e atividades previstas no MGSO, sendo competente

  para desempenhar as funções a ele atribuídas, segundo suas responsabilidades no SGSO em

  implantação ou implantado.

  Desta forma, o <Diretor ou Gerente> de Segurança Operacional deve avaliar os dois conjuntos
  de

  requisitos e estabelecer a melhor maneira de integrar a capacitação em SGSO ao programa
  de

  treinamento de seu pessoal. Para isto, deve ser capaz de identificar as necessidades para
  cada

  função com responsabilidade estabelecida no SGSO da Empresa.

  Após esta avaliação, o <Diretor ou Gerente> de Segurança Operacional deve desenvolver e
  manter

  um programa de treinamento de segurança operacional ou incorporar as necessidades de

  treinamento em SGSO nos programas existentes. Deve considerar nesta ação que o alcance da

  qualificação de segurança operacional deve ser apropriado à participação de cada pessoa
  no SGSO

  proposto.Data da emissão: 9 de novembro de 2012 IS nº 119-002

