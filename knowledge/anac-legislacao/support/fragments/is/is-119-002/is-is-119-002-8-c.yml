section_title: O MANUAL DE GERENCIAMENTO DA SEGURANÇA OPERACIONAL
subsection_id: c
cite: 8(c)
title: 8(c)
text: 'c) divulgar as medidas de segurança operacional adotadas para o atendimento à

  política estabelecida, de forma a envolver a todos da organização e aos seus

  parceiros e terceirizados.

  8.2 O MGSO é parte integrante da documentação necessária à certificação de um detentor

  e/ou requerente de um certificado e deve ser apresentado à ANAC através do serviço de

  protocolo (em papel ou Protocolo Digital), juntamente com os demais documentos

  previstos para a segunda fase do processo de certificação: “solicitação formal”. As

  empresas de transporte aéreo que forem detentores de certificados devem considerar o

  processo de aceitação de seu MGSO na mesma metodologia adotada para os demais

  manuais previstos nos RBAC 121 ou 135.

  8.3 O conteúdo do MGSO deve apresentar os resultados dos estudos desenvolvidos e as

  propostas para a implantação do SGSO no detentor de certificado. A estrutura

  apresentada na tabela 1, a seguir, é uma orientação para que o gestor responsável de um

  detentor de certificado consiga planejar o desenvolvimento dos estudos necessários à

  implantação do SGSO, bem como a forma de demonstrar os resultados alcançados.

  8.4 Pode ser adotada outra estrutura ou forma de apresentar os resultados dos trabalhos

  desenvolvidos e a proposta de implantação do SGSO para análise pela ANAC.

  Entretanto, considerando o processo de certificação de uma empresa aérea, previsto na

  regulação em vigor, a adoção dessa proposta auxilia na identificação do que apresentar

  para discussão, análise, demonstração e aceitação junto à ANAC.

  TABELA 1

  ESTRUTURA E CONTEÚDO PROPOSTO PARA O MGSO'
