cite: 8(f)
title: 8(f)
text: 'f) Transmitir informação genérica de segurança operacional.

  Cabe ao <Diretor ou Gerente> de Segurança Operacional desenvolver e manter uma maneira

  formal de comunicar a eficácia do SGSO por meio de boletins operacionais, circulares, publicações

  oficiais, páginas da web, etc.

  Outro tipo de informação que deveria ser incluído no processo formal estabelecido pelo Gestor

  Responsável, em nome do Detentor de Certificado, é a ampla divulgação do aprendizado obtido

  com as investigações, histórias de casos ou experiências internas ou de Empresas semelhantes.

  O <Diretor ou Gerente> de Segurança Operacional deve estabelecer uma maneira de fazer fluir

  uma comunicação fácil com o pessoal operativo de toda a Empresa e contratados, uma vez que
  a

  eficácia da segurança operacional proposta no SGSO necessita fundamentalmente da participação

  desse pessoal na identificação dos perigos.Data da emissão: 9 de novembro de 2012 IS nº
  119-002

  REVISÃO D'
