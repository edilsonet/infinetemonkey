text: 'g) Procedimentos de emergências;

  O Gestor Responsável deve garantir que o <Diretor ou Gerente> de Segurança Operacional possua

  um curso de sistema de gerenciamento de segurança operacional reconhecido pela Agência Nacional
  de

  Aviação Civil e que seja ou venha a ser capacitado também, antes de assumir o cargo, pelo
  menos, nos

  seguintes itens:'
