cite: 8(l)
title: 8(l)
text: 'l) Capítulo 8 - Promoção da segurança operacionalData da emissão: 9 de novembro de
  2012 IS nº 119-002

  REVISÃO D

  8.5 O Apêndice B apresenta um exemplo de proposta para um Manual de Gerenciamento da

  Segurança Operacional - MGSO para os operadores regidos pelo RBAC 119.

  8.6 O Apêndice C tem por objetivo apresentar um modelo de formulário onde o gestor

  responsável de um detentor e/ou requerente de um certificado aprova o MGSO

  encaminhado à ANAC, bem como reserva um local apara a aceitação formal pela

  Agência, após as assinaturas do inspetor de aviação civil, ponto focal junto à ANAC, do

  inspetor responsável pela certificação da empresa e do Gerente de Certificação de

  Operações de Transporte Aéreo (GCTA ou GVAG/SSO).

  8.7 O Apêndice D contém um modelo de termo de responsabilidade do detentor e/ou

  requerente de um certificado, elaborado com o objetivo de auxiliá-lo a declarar seus

  compromissos perante à ANAC, bem como designar o Gestor Responsável e o diretor

  ou gerente de segurança operacional. Identifica ainda, quem será o responsável

  individualmente e ponto focal para a implantação e manutenção do SGSO do PSAC

  frente à ANAC, de forma a atender o Plano de Implantação aceito pela ANAC e a

  garantir sua efetividade.

  8.8 Quando se tratar de uma empresa certificada ou com processo de certificação já

  iniciado, o MGSO deve ser acrescentado à documentação do detentor de certificado, até

  maio de 2011, conforme previsto no Apêndice R do RBAC 121 ou até agosto de 2011,

  conforme o Apêndice I do RBAC 135. A incorporação do MGSO ao sistema de

  manuais previsto na regulação deve se dar com observância à concepção de cinco fases

  do processo de certificação de uma empresa aérea regida pelo RBAC 119, tanto para as

  empresas existentes quanto para as novas.'
