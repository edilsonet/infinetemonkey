text: 'APÊNDICE C - TERMO DE APROVAÇÃO E DE ACEITAÇÃO - EXEMPLO

  PARTE 1 - APROVAÇÃO PELO DETENTOR DO CERTIFICADO

  Eu, _______________________________, na qualidade de Detentor do Certificado de Operador
  Aéreo da

  <COLOCAR O NOME DO DETENTOR DE CERTIFICADO>, aprovo o presente Manual de Gerenciamento da

  Segurança Operacional (MGSO), desenvolvido para atender aos requisitos estabelecidos na
  Subparte BB do

  RBAC 121 e na Seção 135.29 do RBAC 135.

  A validade deste MGSO é indeterminada a partir desta aprovação, devendo as atualizações
  ser

  comunicadas à ANAC com antecedência necessária a sua aceitação, antes de sua incorporação
  às atividades

  da <COLOCAR O NOME DO DETENTOR DE CERTIFICADO >.

  Cidade, XX de (mês) de 20XX

  ____________________________________

  (Nome e assinatura do Detentor do Certificado)

  PARTE 2 - ACEITAÇÃO PELA ANAC

  Este Manual de Gerenciamento da Segurança Operacional (MGSO) é considerado aceito pela ANAC,
  uma

  vez que seu conteúdo atendeu aos requisitos aplicáveis, conforme processo de aceitação consubstanciada

  no FORM 111 integrante deste MGSO.

  O Plano de Implantação do SGSO da <NOME DO DETENTOR DE CERTIFICADO >, constante deste MGSO
  foi

  analisado e reflete o compromisso do Detentor do Certificado com a garantia da manutenção
  da segurança

  operacional em suas operações enquanto implanta os componentes/elementos faltantes, de acordo
  com o

  Plano aceito.

  A implantação do Plano aceito passa a se configurar como o Nível Aceitável de Desempenho
  de Segurança

  Operacional (NADSO) considerado aceito pela ANAC para essa <NOME DO DETENTOR DE CERTIFICADO
  >,

  ficando o Sr. <NOME DO DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL> responsável pela

  manutenção desse NADSO em nome do Detentor do Certificado.

  Rio de Janeiro, XX de Xxxxxxxx de 20XX.

  ______________________________ _____________________________

  (Nome, assinatura e SIAPE do INSPAC) (Nome e assinatura do GCTA)Data da emissão: 9 de novembro
  de 2012 IS nº 119-002

  REVISÃO D'
