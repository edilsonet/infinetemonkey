text: 'APÊNDICE D - TERMO DE RESPONSABILIDADE DO GESTOR RESPONSÁVEL-

  EXEMPLO

  NOTAS EXPLICATIVAS

  A Parte 1 deste documento pode ser utilizada como uma declaração de que o Gestor Responsável

  conhece e assume as responsabilidades estabelecidas no Apêndice Q (RBAC 121) ou Apêndice
  H

  (RBAC 135). Os PSAC que estão obrigados a desenvolver um SGSO devem completar também as

  partes 2 e 3 deste formulário.

  Este Termo de Responsabilidade, ou outro formulário semelhante, a Análise do Faltante e
  o Plano

  de Implantação do SGSO devem ser submetidos ao INSPAC responsável da ANAC para revisão no

  prazo estabelecido pela regulação. É aconselhável que esses documentos sejam discutidos
  e aceitos,

  por ambas as partes, pelo menos 3 (três) meses antes do prazo de entrega de cada fase, sendo
  que

  antes da 1ª será considerado como o marco inicial para a implantação do SGSO como um todo
  no

  PSAC, considerando os quatros anos concedidos pela ANAC para este objetivo.Data da emissão:
  9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  APÊNDICE D - TERMO DE RESPONSABILIDADE DO GESTOR RESPONSÁVEL-

  EXEMPLO

  Um fluxograma e uma lista de perguntas estão incluídos nos Apêndices H e I, desta IS. Eles

  podem ser utilizados para auxiliar o Detentor do Certificado na identificação do Gestor

  Responsável. O fluxo e as perguntas foram elaborados para garantir que a pessoa e não a

  função seja identificada como responsável (accountable).

  PARTE 1 - DO DETENTOR DO CERTIFICADO

  A Empresa <NOME DO DETENTOR DE CERTIFICADO>, detentora do certificado nº 20XX-XX-XXXX-XX-

  XX, assume perante a Agência Nacional de Aviação Civil (ANAC) o compromisso de implantar
  a

  política de segurança operacional definida neste documento de acordo com os regulamentos

  aplicáveis.

  PARTE 2 - DA DESIGNAÇÃO DO GESTOR RESPONSÁVEL

  Eu, ______________________________, como representante legal do <NOME DO DETENTOR DE

  CERTIFICADO>, detentora do certificado nº 20XX-XX-XXXX-XX-XX, assumo as responsabilidades
  de

  Gestor Responsável, previstas no <RBAC 12 ou RBAC 135>, me comprometendo a adotar as ações

  necessárias à implantação e manutenção do SGSO de nossa Empresa, independente de outras

  funções que venha a assumir.

  PARTE 3 - DA DESIGNAÇÃO DO DIRETOR OU GERENTE DE SEGURANÇA

  OPERACIONAL

  Eu, ______________________________, como Gestor Responsável pelo <NOME DO DETENTOR DE

  CERTIFICADO> designo o Sr. _________________________ como nosso <Diretor ou Gerente> de

  Segurança Operacional.

  Declaro, ainda, que o Sr. _________________________ possui experiência suficiente, competência

  e qualificação adequada, de acordo com os requisitos estabelecidos na regulação em vigor
  e teve

  sua designação aceita pela ANAC.

  O Sr. _________________________, será responsável individualmente e ponto focal para a

  implantação e manutenção do SGSO de nossa Empresa, de forma a atender o Plano de Implantação

  aceito pela ANAC e a garantir sua efetividade.

  Nome da Cidade, XX de Xxxxxxxx de 20xx.

  _____________________________________________________

  (nome, função e assinatura do Gestor Responsável)Data da emissão: 9 de novembro de 2012
  IS nº 119-002

  REVISÃO D'
