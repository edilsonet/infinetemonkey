text: '(i). Treinamento e educação; e

  (ii). Comunicação acerca da segurança operacional.

  3.3 ESTRUTURA EXISTENTE NA ORGANIZAÇÃO E MUDANÇAS NECESSÁRIAS

  O Gestor Responsável deve apresentar aqui os resultados das análises realizadas em relação
  às

  estruturas existentes no Detentor de Certificado e que poderiam ser adaptadas ou mantidas
  para a

  implantação de seu SGSO, considerando a os componentes e elementos estabelecidos pela ANAC
  e

  apresentadas no item anterior.

  Um Detentor de Certificado, a menos que seja uma nova entrante no mercado, deve ter vários
  dos

  componentes/elementos propostos pela ANAC para o SGSO implantados e funcionando, uma vez

  que segurança operacional é princípio básico de um operador aéreo.

  A identificação dos componentes/elementos existentes deve ser feita de forma clara permitindo

  que os envolvidos e a ANAC entendam as estruturas existentes e sua contribuição para a operação

  do SGSO a ser implantado.

  A partir dessa análise, devem ser identificadas as mudanças necessárias na estrutura

  organizacional, nos processos e procedimentos, que servirão de base para a elaboração do

  planejamento de implantação do SGSO proposto pela ANAC nos RBACs 121 e 135.

  3.4 RESPONSÁVEIS PELA IMPLANTAÇÃO DAS MEDIDAS OU PROCESSOS

  O Gestor Responsável deve identificar os responsáveis (accountables) pela efetivação das

  mudanças consideradas necessárias na estrutura organizacional e demais elementos, bem como

  pela implantação das medidas ou processos adicionais identificados para implantação do SGSO

  requerido pela ANAC.

  3.5 FORMULÁRIO PARA AUXILIAR A ANÁLISE DO FALTANTE

  Utilizando como base a proposta apresentada no Doc 9859, 2ª Edição, de 2009, da OACI para
  a

  Análise do faltante foi desenvolvido o formulário modelo, Apêndice C, que contém perguntas,

  sempre associadas a requisito da regulação, e que devem ser respondidas.

  O objetivo do formulário modelo é auxiliar o Gestor Responsável na avaliação de sua estrutura

  organizacional, sua política, objetivos e nível de cumprimento da regulação frente aos requisitos

  estabelecidos para a implantação do SGSO. Apesar de aparentemente esgotar os requisitos

  relacionados à implantação, operação e manutenção do SGSO, é importante considerar que

  existem outros requisitos no RBAC 119, RBAC 121 e RBAC 135 voltados à garantia da segurança

  operacional das atividades do Detentor do Certificado e que devem ser considerados.Data
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  A adoção desse formulário não é obrigatória, mas pode ser utilizada como uma ferramenta
  para a

  realização da análise do faltante tanto para o trabalho realizado quanto para a implantação
  do

  SGSO proposto pela ANAC.

  O <Diretor ou Gerente> de Segurança Operacional deve apresentar as mudanças, se houver,
  nos

  processos existentes, bem como as medidas e processos adicionais necessários para adaptar
  a(s)

  operação(ões) certificada(s) ou proposta(s) em relação aos requisitos da ANAC, visando garantir
  a

  manutenção de suas atividades dentro de um nível aceitável de desempenho da segurança

  operacional (NADSO), a ser acordado com a Agência, após a aprovação pelo Gestor Responsável.Data
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
