title: 'Apêndice H (e)), relacionados com a:'
text: 'Apêndice H (e)), relacionados com a:

  I. identificação de perigos; eData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  II. avaliação e mitigação de riscos.

  b. Foram oferecidos e podem ser comprovados os treinamento relativo aos processos

  preventivos e preditivos do gerenciamento dos riscos de segurança operacional

  (Apêndice Q (g)(1) ou Apêndice H (g)(1)); e

  c. Foi desenvolvida e pode ser comprovada a estrutura adotada para a documentação

  dos processos preventivos e preditivos do gerenciamento de riscos de segurança

  operacional (Apêndice Q (d)(6) ou Apêndice H (d)(6)).

  Ao final ou durante esta fase, caso o Gestor Responsável identifique que não será capaz
  de

  cumprir com o estabelecido e acordado com a Agência, deve avaliar e propor um replanejamento

  das ações. Entretanto, o prazo final estabelecido para 2014 permanece para a conclusão do

  processo d e implantação do SGSO na Empresa, a menos que a ANAC autorize uma maneira

  alternativa de cumprir com este requisito.'
