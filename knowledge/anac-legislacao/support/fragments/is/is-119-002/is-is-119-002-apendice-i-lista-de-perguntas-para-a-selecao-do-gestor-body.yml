text: 'APÊNDICE I - LISTA DE PERGUNTAS PARA A SELEÇÃO DO GESTOR

  RESPONSÁVEL

  Fonte: SMS Implementation Procedures Guide, Rev. 1, June, 200.

  Identifique a pessoa

  pelo nome

  Esta pessoa tem autoridade total sobre

  os assuntos relacionados aos recursos

  humanos?

  Esta pessoa tem autoridade efetiva sobre os

  assuntos relacionados aos recursos

  financeiros?

  sim

  sim

  Esta pessoa tem responsabilidade direta

  pela condução dos negócios do Detentor

  de Certificado?

  sim

  Se o PSAC possui mais de um

  certifica (COA e OMA), esta pessoa é

  responsável pelos dois certificados?

  sim

  A pessoa tem autoridade sobre todas

  as operações certificadas?

  sim

  A pessoa tem autoridade sobre

  todas as operações certificadas?

  sim

  Se a resposta for “não” para qualquer

  das perguntas, o processo deve

  recomeçar com outro candidato

  Se as respostas forem todas “sim”, então

  essa pessoa é o Gestor Responsável do

  Detentor de Certificado

  nãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
