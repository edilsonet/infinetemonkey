text: 'APÊNDICE J - QUALIFICAÇÕES E EXPERIÊNCIA DO INDICADO AO CARGO DE

  DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL

  J1 Este Apêndice apresenta orientações suplementares acerca dos requisitos da seção

  119.71, do RBAC 119, no que se refere à experiência profissional e às qualificações

  desejáveis para o candidato que deseja assumir o cargo de Diretor ou Gerente de

  Segurança Operacional (DSO/GSO) em um detentor de certificado que opere ou deseje

  operar segundo o RBAC 135. As orientações aqui expostas não isentam nenhum

  detentor de certificado do cumprimento dos requisitos aplicáveis da seção 119.71, do

  RBAC 119.

  J2 As qualificações e compromissos exigidos do pessoal de administração requerido para

  operações conduzidas segundo o RBAC 135 estão definidos pela ANAC nas seções'
