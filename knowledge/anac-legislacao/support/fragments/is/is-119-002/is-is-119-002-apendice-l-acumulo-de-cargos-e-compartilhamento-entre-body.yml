title: APÊNDICE L - ACÚMULO DE CARGOS E COMPARTILHAMENTO ENTRE
text: 'APÊNDICE L - ACÚMULO DE CARGOS E COMPARTILHAMENTO ENTRE

  EMPRESAS DO DIRETOR OU GERENTE DE SEGURANÇA OPERACIONAL.

  L1 Este Apêndice estabelece critérios que permitem às empresas que operam segundo o

  RBAC 135 o acúmulo por parte do Diretor ou Gerente de Segurança Operacional

  (DSO/GSO) com outros cargos da administração requerida pelo RBAC 119, de acordo

  com a complexidade aferida à empresa conforme o Apêndice K deste documento e

  desde que aprovado pela ANAC.

  L2 Este Apêndice também estabelece critérios que permitem às empresas que operam

  segundo o RBAC 135 o compartilhamento do cargo de DSO/GSO entre mais de uma

  empresa, de acordo com a complexidade aferida à empresa conforme o Apêndice K

  deste documento e desde que aprovado pela ANAC.

  L3 Os critérios para permitir o acúmulo definido em L1 ou o compartilhamento definido

  em L2, bem como os prazos para tais acúmulos ou compartilhamentos, estão definidos

  na tabela abaixo:

