  Nota (1): O compartilhamento só pode aceito se for com até 1 (uma) empresa de média complexidade
  ou com

  2 (duas) de baixa complexidade.

  Nota (2): O compartilhamento só pode ser aceito se for com até: 1 (uma) empresa de média
  complexidade e 1

  (uma) empresa de baixa complexidade; ou 2 (duas) empresas de baixa complexidade.

  L4 Para solicitar à ANAC a autorização para o acúmulo do cargo de DSO/GSO com outro

  cargo da direção requerida (RBAC 119.69) dentro da empresa, devem ser adotados os

  seguintes procedimentos:Data da emissão: 9 de novembro de 2012 IS nº 119-002

