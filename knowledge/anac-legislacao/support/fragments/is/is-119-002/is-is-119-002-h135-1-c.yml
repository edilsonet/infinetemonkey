title: H135.1(c)
text: '(c)(1)

  Existe um processo formal

  estabelecido e documentado para

  identificar as mudanças dentro da

  organização decorrentes da migração

  para o RBAC 121, quando for o

  caso?

  ( ) Sim

  ( ) Não

  ( ) NAData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 3 - Garantia da Segurança Operacional

  Elemento 3.2 - Gerenciamento da Mudança

  NA'
