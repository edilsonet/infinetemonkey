title: H135.1(d)
text: '(d)(4)(v)

  É possível comprovar se a descrição do

  sistema contido no plano de implantação

  do SGSO elaborado abordou todos os

  aspectos listados de (A) a (H)?

  ( ) Sim

  ( ) Não

  NA RBAC

  135.2

  O sistema atual descrito permite

  identificar a necessidade de adequação do

  PSAC aos requisitos estabelecidos no

  RBAC 135 para atender ao programa de

  conformidade para operadores

  transicionando para o RBAC 121?

  ( ) Sim

  ( ) Não

  NA

  RBAC

  119.1(1)

  RBAC

  121.2

  É necessário incorporar ao plano de

  implantação do SGSO algum requisito

  associado ao Plano de transição para

  Operadores Aéreos, previsto em

  119.1(c)(1)?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 1, Política e objetivos da segurança operacional

  Elemento 1.4 - Plano de implantação do SGSO

  Ap. Q'
