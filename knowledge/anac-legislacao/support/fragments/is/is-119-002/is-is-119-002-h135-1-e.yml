text: '(e)(2)(ii)

  Os níveis de gerenciamento para tomar

  as decisões sobre a tolerância aos

  riscos de segurança operacional

  definidos pelo Gestor Responsável

  foram aceitos pela ANAC?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 2 Gerenciamento dos Riscos à Segurança Operacional

  Elemento 2.2 - Processos de avaliação e mitigação de riscos

  AP. Q'
