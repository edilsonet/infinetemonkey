text: '(f)(1)(i)(A)

  Estão implantados os meios e

  procedimentos necessários para

  verificar se o desempenho da

  segurança operacional da organização

  está compatível com as políticas e

  objetivos de segurança operacional

  estabelecidas?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135

  Componente 3 - Garantia da Segurança Operacional

  Elemento 3.1 - Monitoramento e medição do desempenho da segurança

  operacional

  AP. Q'
