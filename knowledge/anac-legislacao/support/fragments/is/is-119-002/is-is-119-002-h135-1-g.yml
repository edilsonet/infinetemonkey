text: '(g)(1)(iv)

  (C)

  O programa de treinamento de segurança

  operacional estabelecido inclui, no

  currículo de treinamento inicial de

  segurança operacional para todo o

  pessoal do PSAC, a importância da

  observação da política de segurança

  operacional e os procedimentos que

  compõem o seu SGSO?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 4 - Promoção da Segurança Operacional

  Elemento 4.1 - Instrução e Educação

  AP. Q'
