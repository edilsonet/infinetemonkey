text: '(c)(1)

  A proposta para a 2ª fase de implantação

  identifica os responsáveis implementação

  dos novos requisitos do SGSO às

  atividades diárias do PSAC?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 1, Política e objetivos da segurança operacional

  Elemento 1.4 - Plano de implantação do SGSO

  AP. R'
