text: '(d)(2)

  A 3ª Fase contempla a incorporação ao

  programa de treinamento do PSAC

  aspectos relativos aos processos do

  gerenciamento preventivos (pró-ativos) e

  preditivos dos riscos de segurança

  operacional, caso não implantados nas

  fases anteriores?

  ( ) Sim

  ( ) NãoData da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  Requisitos do SGSO

  Resposta

  Se sim, onde está atendido,

  Se não, coloque o processo ou

  ação que precis ser

  desenvolvido

  Ref.(RBAC) Pergunta

  121 135 Componente 1, Política e objetivos da segurança operacional

  Elemento 1.4 - Plano de implantação do SGSO

  AP. R'
