title: respeito dos colegas e da gerência ou diretoria da empresa.
text: 'J3.11 respeito dos colegas e da gerência ou diretoria da empresa.

  J4 O gestor responsável deve encaminhar a indicação da pessoa que deseja assumir o cargo

  de DSO/GSO à ANAC. Nesta solicitação deverão constar documentos que comprovem

  que a pessoa indicada ao cargo de DSO/GSO possui, de fato, a experiência descrita naData
  da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  seção 119.71 (a)(2) do RBAC 119. Esta documentação poderá constar de cópias de

  contratos de trabalho, declarações de empresa para a qual o indicado trabalha ou

  trabalhou, explicitando que exerceu atividades na área especificada no regulamento e

  detalhando quais atividades. Em adição, o gestor responsável deve declarar que o

  candidato atende aos demais requisitos aplicáveis da seção 119. 71, do RBAC 119.

  J5 Caso a pessoa indicada para assumir o cargo de DSO/GSO não cumpra aos requisitos

  aplicáveis do RBAC 119 acerca da experiência profissional, 119.71 (a)(2), e o gestor

  responsável opte por cumprir com os requisitos 119.71(a)(4) ou 119.71(a)(5), para

  operadores segundo o RBAC 135, os seguintes documentos devem ser encaminhados à

  ANAC:'
