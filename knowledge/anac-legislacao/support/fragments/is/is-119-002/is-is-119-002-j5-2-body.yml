title: uma declaração onde atesta que seu candidato ao cargo de DSO/GSO possui as
text: 'J5.2 uma declaração onde atesta que seu candidato ao cargo de DSO/GSO possui as

  qualificações e atribuições do item J2, acima, acrescidas daquelas do item J3, no total

  ou parte delas, de tal forma que o cumprimento da implantação do sistema de

  gerenciamento da segurança operacional será garantido e mantido num nível de

  segurança igual, ou superior, aquele requerido pela ANAC e descrito no regulamento

  RBAC 135.

  J6 Anexados às declarações do gestor responsável, seja a opção pelo cumprimento do

  estipulado em J4, seja em J5, deverão ser encaminhados documentos que comprovem a

  experiência e qualificações do indicado, tais como, participação em palestras sobre

  segurança operacional, cursos sobre aviação civil, treinamentos de empresa de

  transporte aéreo, formação acadêmica, participação em atividades correlacionadas à

  segurança operacional, entre outros.

  J7 A documentação da empresa será submetida à análise, podendo a ANAC solicitar outros

  documentos, caso haja necessidade de maiores esclarecimentos.

  J8 Encerrada a análise do material apresentado, será emitido um parecer, seja deferindo
  ou

  indeferindo o pleito.Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D'
