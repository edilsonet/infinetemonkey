title: 'Primeiro passo: a empresa deve verificar se ao menos uma das opções listadas na'
text: 'K2.1 Primeiro passo: a empresa deve verificar se ao menos uma das opções listadas na

  categoria “Alta complexidade” aplica-se à sua estrutura ou suas operações atualmente.

  Em caso afirmativo, a empresa é classificada como sendo de alta complexidade. Caso

  nenhuma das afirmações aplique-se à empresa, passar ao segundo passo;'
