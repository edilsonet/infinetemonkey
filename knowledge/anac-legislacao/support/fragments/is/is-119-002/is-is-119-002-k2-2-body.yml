title: 'Segundo passo: a empresa deve verificar se ao menos uma das opções listadas na'
text: 'K2.2 Segundo passo: a empresa deve verificar se ao menos uma das opções listadas na

  categoria “Média complexidade” aplica-se à sua estrutura ou suas operações atualmente.

  Em caso afirmativo, a empresa é classificada como sendo de média complexidade. Caso

  nenhuma das afirmações aplique-se à empresa, passar ao terceiro passo;'
