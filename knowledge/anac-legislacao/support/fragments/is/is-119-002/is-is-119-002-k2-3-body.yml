text: 'K2.3 Terceiro passo: uma vez que nenhum dos critérios da “Alta complexidade” nem da

  “Média complexidade” aplica-se à empresa, automaticamente esta empresa é

  classificada como de baixa complexidade.

  K3 Categoria “Alta complexidade”. Uma empresa será classificada como de alta

  complexidade quando ao menos uma das afirmações abaixo seja aplicável à sua

  estrutura ou às suas operações atuais:'
