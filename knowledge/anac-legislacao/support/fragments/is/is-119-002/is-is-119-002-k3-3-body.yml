text: 'K3.3 operar com 11 (onze) ou mais aeronaves em sua frota.

  K4 Categoria “Média complexidade”. Uma empresa será classificada como de média

  complexidade quando operar com 4 (quatro) a 10 (dez) aeronaves em sua frota.

  K5 Categoria “Baixa complexidade”. Uma empresa será classificada como de baixa

  complexidade quando ela não for classificada nem como de alta complexidade e nem de

  média complexidade, conforme acima definido.Data da emissão: 9 de novembro de 2012 IS nº
  119-002

  REVISÃO D'
