text: 'L4.1 o gestor responsável pelo detentor de certificado deve assinar e encaminhar à
  ANAC

  um documento em que declare que esse acúmulo não compromete a segurança

  operacional da empresa, assumindo o compromisso de manter um nível aceitável de

  desempenho da segurança.'
