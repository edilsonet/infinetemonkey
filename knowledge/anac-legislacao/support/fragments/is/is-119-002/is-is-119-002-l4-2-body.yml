title: 'no documento mencionado em L4.1, o gestor responsável deve incluir:'
text: 'L4.2 no documento mencionado em L4.1, o gestor responsável deve incluir:

  L4.2.1 qual o cargo da direção requerida previsto no RBAC 119.69 deseja ser acumulado com

  o de DSO/GSO;

  L4.2.2 qual o tempo o acúmulo dos cargos, considerando o disposto em L3;

  L4.2.3 declaração da pessoa da direção requerida (RBAC 119.69) que deseja acumular também

  o cargo de DSO/GSO de que atende aos requisitos estabelecidos em 119.71(a), que está

  ciente de suas responsabilidades (accountabilities) para ambas as atividades que deseja

  acumular e que não haverá prejuízo para um desempenho eficiente e eficaz de nenhuma

  delas;

  L4.2.4 número de funcionários da empresa, especificando a função deles (ex. número de

  pilotos, mecânicos, coordenadores de voo, etc.).'
