title: em adição, caso a empresa possua um prazo limite para o acúmulo de acordo com o
text: 'L4.3 em adição, caso a empresa possua um prazo limite para o acúmulo de acordo com
  o

  item L3, ela deverá apresentar um plano de implantação do SGSO; ou uma revisão

  deste, caso já esteja aceito; ou uma retificação do plano, caso já tenha sido entregue à

  ANAC, mas ainda não esteja aceito, que contemple as seguintes informações:

  L4.3.1 data em que será executada a mudança de pessoa que assume o cargo de DSO/GSO,

  considerando o disposto em L3;

  L4.3.2 se aplicável, data em que a empresa irá solicitar a alteração de suas Especificações

  Operativas para a mudança da pessoa que assume o cargo de DSO/GSO, considerando o

  disposto em L3.

  L5 Para solicitar à ANAC a autorização de compartilhamento de uma pessoa para exercer o

  cargo de DSO/GSO em mais de uma empresa, devem ser adotados os seguintes'
