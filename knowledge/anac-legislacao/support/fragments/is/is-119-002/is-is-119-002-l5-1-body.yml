title: o gestor responsável de cada detentor de certificado que aceitou compartilhar um
text: 'L5.1 o gestor responsável de cada detentor de certificado que aceitou compartilhar
  um

  DSO/GSO, e desde que permitido em L3, deve assinar e encaminhar à ANAC um

  documento em que declare que esse compartilhamento não compromete a segurança

  operacional de sua empresa, assumindo o compromisso de manter um nível aceitável de

  desempenho da segurança;'
