text: 'L5.2 em cada um dos documentos mencionados em L5.1, o gestor responsável de cada

  empresa detentora de certificado deve incluir:

  L5.2.1 quais as empresas envolvidas no compartilhamento e localização (cidade/estado) de

  suas bases operacionais;Data da emissão: 9 de novembro de 2012 IS nº 119-002

  REVISÃO D

  L5.2.2 por quanto tempo se deseja que o compartilhamento ocorra, considerando o disposto
  em

  L3;

  L5.2.3 uma declaração assinada pelo profissional que pretende exercer o cargo de DSO/GSO

  de forma compartilhada de que ele atende aos requisitos estabelecidos em 119.71(a), do

  RBAC 119, que está ciente de suas responsabilidades (accountabilities) para com a

  garantia da segurança operacional das empresas em que deseja atuar como DSO/GSO e

  que não haverá prejuízo para um desempenho eficiente e eficaz de suas atividades em

  nenhuma delas;

  L5.2.4 número de funcionários de cada empresa envolvida, especificando a função deles (ex.

  número de pilotos, mecânicos, coordenadores de voo, etc.);'
