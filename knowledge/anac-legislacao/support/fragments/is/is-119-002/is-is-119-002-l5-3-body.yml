title: em adição, caso a empresa possua um prazo limite para o compartilhamento, de acordo
text: 'L5.3 em adição, caso a empresa possua um prazo limite para o compartilhamento, de acordo

  com o item L3, ela deverá apresentar um plano de implantação do SGSO; ou uma

  revisão deste, caso já esteja aceito; ou uma retificação do plano, caso já tenha sido

  entregue à ANAC, mas ainda não esteja aceito, que contemple as seguintes

  informações:

  L5.3.1 data em que será executada a adequação da direção requerida (RBAC 119.69) da

  empresa de forma a atender o disposto em L3;

  L5.3.2 se aplicável, data em que a empresa irá solicitar a alteração de suas Especificações

  Operativas para a mudança da pessoa que assume o cargo de DSO/GSO, considerando o

  disposto em L3;'
