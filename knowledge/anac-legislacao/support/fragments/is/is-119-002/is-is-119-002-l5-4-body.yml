cite: L5.4
title: ao propor que uma pessoa possa compartilhar a função de DSO/GSO de uma empresa
text: 'L5.4 ao propor que uma pessoa possa compartilhar a função de DSO/GSO de uma empresa

  135 com outra(s), o gestor responsável de cada uma delas deve poder evidenciar que a

  pessoa selecionada possui o conhecimento necessário sobre seus manuais do detentor do

  certificado e suas especificações operativas.

  L6 A qualquer momento em que a ANAC identificar que o acúmulo de funções da direção

  requerida (RBAC 119.69) com o do DSO/GSO está comprometendo a segurança

  operacional do detentor do certificado, comprometendo a implantação do sistema de

  gerenciamento da segurança operacional ou sua manutenção, a autorização pode ser

  cassada e as empresas envolvidas devem apresentar um nome aceitável pela ANAC em

  até 10 dias após a notificação.

  L7 A qualquer momento em que a ANAC identificar que o compartilhamento de um

  DSO/GSO com outro(s) detentor(es) de certificado está comprometendo a segurança

  operacional de qualquer um deles, comprometendo a implantação do sistema de

  gerenciamento da segurança operacional ou a manutenção deste em qualquer um dos

  operadores, a autorização pode ser cassada e as empresas envolvidas devem apresentar

  um nome aceitável pela ANAC em até 10 dias após a notificação.Data da emissão: 9 de novembro
  de 2012 IS nº 119-002

  REVISÃO D'
