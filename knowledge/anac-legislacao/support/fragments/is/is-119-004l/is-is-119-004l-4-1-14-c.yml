id: is-is-119-004l-4-1-14-c
kind: is
document: is-119-004l
family: '119'
section_id: 4.1.14
section_title: 'operador aéreo classificado como Operador Simples: organização que opere ou
  que pretenda operar sob as regras do RBAC nº 135 e que:'
subsection_id: c
cite: 4.1.14(c)
title: 4.1.14(c)
text: 'c) seja engajada, ou pretenda se engajar, exclusivamente em operações não regulares,
  domésticas, sem autorização para determinadas operações especiais complexas e sem prerrogativa
  para realizar manutenção de aeronaves sob o certificado de operador aéreo emitido pelo RBAC
  nº 135.

  4.1.15 operador aéreo classificado como Operador Padrão: organização que opere ou que pretenda
  operar sob as regras do RBAC nº 135 e que não se enquadre nas limitações para Operador Simples;

  Nota 1: para fins de classificação de um operador aéreo, consideram-se como não regulares
  as operações realizadas sob a Resolução nº 576, de 4 de agosto de 2020, ou norma que vier
  a substituí-la, uma vez que cumprem os requisitos aplicáveis a operações não regulares.

  Nota 2: para fins de classificação dos operadores aéreos regidos pelo RBAC nº 135, nos termos
  do Programa de Segurança Operacional Específico (PSOE-ANAC), operadores aéreos classificados
  como Operadores Padrão são classificados como de grande porte / alta complexidade.

  4.1.16 pacote de solicitação formal (PSF): conjunto de documentos requeridos para certificação
  ou para determinada solicitação de alteração ou inclusão de autorização proposta pelo operador,
  tais como: FOP, FAI, material técnico, inclusive documentos comprobatórios etc. conforme
  aplicável;

  4.1.17 reunião de orientação prévia (ROP): audiência entre a organização requerente e a
  Anac que tem por finalidade a explanação e/ou esclarecimento de dúvidas, de ambas as partes,
  relativas ao processo de certificação de empresa de transporte aéreo, acerca das particularidades
  da operação à qual o requerente se propõe, além de prover informações críticas sobre o processo;
