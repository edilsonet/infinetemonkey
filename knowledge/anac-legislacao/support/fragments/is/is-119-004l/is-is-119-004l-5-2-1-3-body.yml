text: '5.2.1.3 Sempre que julgar necessário, a SPO, de acordo com a complexidade da operação
  requerida, poderá avocar qualquer processo.

  5.2.1.4 O setor da Anac encarregado de conduzir os processos relacionados à aeronavegabilidade
  de aeronaves, incluindo a inspeção de aeronaves e a suspensão de certificados de aeronavegabilidade,
  é a Gerência de Certificação de Aeronavegabilidade Continuada (GCAC) da SPO.'
