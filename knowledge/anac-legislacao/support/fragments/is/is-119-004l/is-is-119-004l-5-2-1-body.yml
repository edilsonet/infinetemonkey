title: Responsabilidade pelos processos
text: '5.2.1 Responsabilidade pelos processos

  5.2.1.1 Para as organizações que pretendam se certificar para operações regidas de acordo
  com os requisitos operacionais do RBAC nº 135, o Escritório Emissor de Certificado (EsEC)
  é a Gerência de Certificação (GTCE) da Gerência de Operações da Aviação Geral (GOAG) da
  Superintendência de Padrões Operacionais (SPO).

  5.2.1.2 Para as organizações certificadas de acordo com os requisitos operacionais do RBAC
  nº 135, todas as petições relacionadas com alteração, suspensão, revogação e cassação de
  certificado ou com Especificações Operativas devem ser direcionadas à Gerência de Certificação
  (GTCE) da Gerência de Operações da Aviação Geral (GOAG) da Superintendência de Padrões Operacionais
  (SPO).'
