text: '5.2.10.13 Para as demais Operações de Serviço Aéreo Especializado (SAE), deve haver
  autorização específica emitida conforme IS nº 91-007.

  5.2.10.14 Caso o operador pretenda realizar algum outro tipo de operação que não esteja
  listada na Tabela 2 ou nos parágrafos 5.2.10.10, 5.2.10.11, 5.2.10.12 e 5.2.10.13, a Anac
  deve ser consultada sobre a necessidade de autorização.

  5.2.10.15 Na certificação inicial para obtenção de COA, caso tenha sido solicitada alguma
  dessas autorizações operacionais listadas na Tabela 2, deve ser instaurado processo específico,
  relacionado ao processo de certificação, para cada tipo de autorização solicitada. A petição
  deve ser realizada por meio do FOP 226.

  5.2.10.15.1 No entanto, não é necessária a solicitação de transporte de passageiros, pois
  é presumida enquanto condição básica. Por outro lado, caso o operador pretenda fazer apenas
  transporte de carga, deve informar ao EsEC.

  5.2.10.16 Para operadores certificados, caso tenha sido solicitada alguma dessas autorizações
  operacionais listadas na Tabela 2, deve ser instaurado processo específico para cada tipo
  de autorização solicitada. A petição deve ser realizada por meio do FOP 219.

  5.2.10.17 O operador pode incluir mais de um modelo/variante de aeronave na mesma solicitação
  de autorização, mas, neste caso, a análise será realizada e finalizada em conjunto.'
