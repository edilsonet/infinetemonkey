text: '5.2.10.2 O sistema de documentos de segurança operacional, apresentado na seção 5.2.6
  desta IS, deve estar de acordo com as autorizações operacionais.

  5.2.10.3 Devem ser apresentadas cópia dos registros de manutenção de instalação dos equipamentos
  requeridos para a operação, atestando capacidade operacional das aeronaves, se aplicável.

  5.2.10.4 Deve ser apresentada listagem das oficinas contratadas para manutenção dos equipamentos
  requeridos e/ou demonstração da qualificação do operador para realizar a manutenção dos
  equipamentos, se aplicável.

  5.2.10.5 Deve ser apresentada a demonstração de aprovação brasileira dos equipamentos instalados,
  quando a instalação destes constituir grande modificação da aeronave, se aplicável.

  5.2.10.6 A critério da Anac, para subsidiar a análise do pedido da respectiva autorização
  operacional, podem ser requeridas as apresentações de quaisquer documentos, comprovações
  ou demonstrações requeridas por normativo.'
