title: Programa de Manutenção de Aeronavegabilidade Continuada (PMAC)
text: '5.2.11.1 Programa de Manutenção de Aeronavegabilidade Continuada (PMAC)

  5.2.11.1.1 A seção 135.425 do RBAC nº 135 e a IS nº 120-016 requerem que os operadores de
  aeronaves certificadas com configuração para 10 (dez) ou mais assentos para passageiros
  possuam um Programa de Manutenção de Aeronavegabilidade Continuada (PMAC) com seus 10 elementos.

  5.2.11.1.2 Esse Programa deve ser autorizado em EO, para cada modelo de aeronave. A forma
  de cumprimento de cada um dos elementos do PMAC deve estar descrita no sistema de manuais
  do operador.'
