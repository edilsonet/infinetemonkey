section_title: 'Aprovação de LBM. Neste modo, para alteração de autorização de execução de
  manutenção, a seguinte documentação deve ser enviada à Anac:'
subsection_id: c
cite: 5.2.11.2.2(c)
title: 5.2.11.2.2(c)
text: 'c) operadores certificados há pelo menos três anos.

  5.2.11.2.3.1 Para atuar neste modo, o detentor de certificado deve atender aos parágrafos
  5.2.11.2.4 e 5.2.11.2.5 desta IS, em especial quanto aos itens a serem verificados pela
  própria empresa e os registros a serem mantidos.

  5.2.11.2.3.2 A Anac pode, a qualquer momento, verificar o cumprimento dos requisitos aplicáveis.

  5.2.11.2.3.3 Caso haja atualização da LBM em desacordo com os procedimentos para aceitação
  da LBM revisada ou com os requisitos vigentes, o detentor de certificado fica sujeito a
  providências administrativas, nos termos da Resolução Anac nº 762/2024, assim como a suspensão
  desta prerrogativa por até 12 meses.

  5.2.11.2.4 Procedimento para gestão de LBM no MGM. Os detentores de certificado que executam
  manutenção devem apresentar em seu MGM procedimento, a ser expressamente aprovado pela Anac,
  para gerir uma Lista de Bases de Manutenção (LBM). Deve conter:'
