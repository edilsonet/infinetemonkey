section_id: 5.2.11.2.2
section_title: 'Aprovação de LBM. Neste modo, para alteração de autorização de execução de
  manutenção, a seguinte documentação deve ser enviada à Anac:'
subsection_id: e
cite: 5.2.11.2.2(e)
title: 5.2.11.2.2(e)
text: e) procedimento para, quando houver exclusão de base de manutenção, protocolar junto
  à Anac a LBM atualizada em até 5 dias úteis após o encerramento das atividades na base.
  Operadores enquadrados no parágrafo 135.411(a)(2) do RBAC nº 135, em caso de exclusão de
  base, poderão revisar sua LBM por aceitação.
