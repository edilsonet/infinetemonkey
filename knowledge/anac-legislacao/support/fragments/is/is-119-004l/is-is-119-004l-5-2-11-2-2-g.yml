section_title: 'Aprovação de LBM. Neste modo, para alteração de autorização de execução de
  manutenção, a seguinte documentação deve ser enviada à Anac:'
subsection_id: g
cite: 5.2.11.2.2(g)
title: 5.2.11.2.2(g)
text: 'g) declaração de conformidade atualizada referente ao RBAC nº 43, à Subparte E do RBAC
  nº 91 e à Subparte J do RBAC nº 135, assim como outros itens regulamentares julgados aplicáveis.

  5.2.11.2.2.1 As declarações requeridas neste processo devem ser assinadas pelo diretor ou
  gerente de manutenção ou por pessoa com delegação explícita no sistema de documentos de
  segurança operacional da empresa.

  5.2.11.2.2.2 A critério da Anac, pode ser requerida uma auditoria de base de manutenção
  antes da autorização para execução de manutenção.

  5.2.11.2.2.3 Para atuar neste modo, o detentor de certificado deve atender aos parágrafos
  5.2.11.2.4 e 5.2.11.2.5 desta IS.

  5.2.11.2.3 Aceitação da LBM revisada. Neste modo, o detentor de certificado pode iniciar
  as atividades de manutenção de acordo com a LBM logo após sua revisão, não sendo necessário
  aguardar posicionamento da Anac. Este modo de revisão somente é permitido aos operadores
  enquadrados no parágrafo 135.411(a)(2) do RBAC nº 135, isto é, operadores que possuam um
  Programa de Manutenção de Aeronavegabilidade Continuada (PMAC), e se limita a:'
