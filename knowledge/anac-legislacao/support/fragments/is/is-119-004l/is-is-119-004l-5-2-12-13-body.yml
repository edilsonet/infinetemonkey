text: '5.2.12.13 Em caso de não recepção do recurso, o requerente será comunicado sobre a
  decisão e ratificação de indeferimento e arquivamento do processo.

  5.2.12.14 Caso exista interesse da organização requerente, esta deverá dar início a um novo
  processo, que será conduzido em conformidade com os procedimentos apresentados nesta IS.

  5.2.12.15 Não serão aproveitados quaisquer atos praticados no curso do processo encerrado,
  embora não sejam vedados ao requerente a apresentação e o aproveitamento do conteúdo dos
  manuais, programas, documentos e informações apresentados no processo encerrado, desde que
  devidamente atualizados.

  5.2.12.16 As ações requeridas em relação a aeronaves, cujos atos já tenham sido concluídos
  pelo Registro Aeronáutico Brasileiro, antes do indeferimento do processo, ficam desobrigadas
  no novo processo.'
