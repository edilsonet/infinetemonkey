title: Prazos, iterações e encerramento compulsório de processos
text: '5.2.12 Prazos, iterações e encerramento compulsório de processos

  5.2.12.1 Caso seja considerado pela Anac que o processo contém não-conformidade por omissão
  de documentação necessária, ou que o objeto da análise se tornou impossível, inútil ou prejudicado
  por fator superveniente, após a avaliação preliminar ou análise, independentemente do número
  de iterações, o processo será indeferido e arquivado compulsoriamente, e o requerente formalmente
  comunicado.

  5.2.12.2 Para cada manual, programa ou documento, caso uma proposta seja rejeitada pela
  3ª vez durante a análise, o processo relacionado a essa proposta poderá ser indeferido e
  arquivado compulsoriamente, independentemente do prazo.

  5.2.12.3 Nos casos em que a rejeição de um documento, manual ou programa for motivada pela
  atualização de um regulamento, publicação técnica do fabricante ou autoridade de aviação
  civil, ou qualquer documento de referência para análise do material, não haverá contabilização
  dessa iteração para fins de arquivamento do processo específico.

  5.2.12.4 Quando o arquivamento de um determinado manual ou programa, conforme descrito no
  parágrafo 5.2.12.2 desta IS, ocorrer 2 (duas) vezes durante o processo de certificação,
  este poderá ser indeferido e arquivado compulsoriamente, independentemente do prazo.

  5.2.12.5 Caso a demonstração da execução de um determinado procedimento ou operação, bem
  como testes de validação, seja rejeitada pela 3ª vez por não-conformidade ou incapacidade
  de demonstração por parte do requerente, o processo de certificação poderá ser indeferido
  e arquivado compulsoriamente, independentemente do prazo.

  5.2.12.6 A organização requerente de um COA terá um prazo padrão de 30 (trinta) dias para
  apresentar as ações requeridas durante qualquer fase do processo de certificação ou às respostas
  a cada comunicação de não-conformidade, mas poderão ser definidos prazos diversos pela Anac
  em situações excepcionais.

  5.2.12.7 A não observância do prazo estabelecido, sem qualquer manifestação por parte do
  requerente para a apresentação das ações requeridas, caracterizará desistência e poderá
  ensejar o encerramento do processo.

  5.2.12.8 Sendo necessário e caso ainda esteja dentro do prazo inicialmente concedido, o
  requerente, por meio de petição protocolada na Anac, poderá solicitar, por uma única vez,
  prorrogação de prazo desde que devidamente justificada. A concessão da dilação e o prazo
  ficarão a critério da Anac.

  5.2.12.9 A descontinuidade ou desistência do processo de certificação, em qualquer de suas
  fases, implicará o seu indeferimento e arquivamento, inclusive de processos correlatos,
  tornando nula qualquer autorização que já tenha sido concedida pela Anac durante o processo.

  5.2.12.10 Um processo encerrado não pode ser reaberto. Os documentos, informações, manuais,
  programas, análises, aceitações, aprovações e autorizações contidos em um processo de certificação
  encerrado poderão ser reutilizados em um novo processo caso a Anac verifique que não haverá
  prejuízos à conformidade do novo processo com relação à legislação vigente.

  5.2.12.11 Para as decisões da Anac, é assegurado ao requerente o direito de ampla defesa
  e do contraditório. Os recursos devem ser direcionados à autoridade que emitiu a decisão,
  que poderá remetê-los às instâncias superiores.

  5.2.12.12 O prazo para a apresentação de recurso contra as decisões da Anac, é de 10 dias
  a contar da ciência da decisão, conforme previsto na Lei nº 9.784/99 (Lei do processo administrativo).'
