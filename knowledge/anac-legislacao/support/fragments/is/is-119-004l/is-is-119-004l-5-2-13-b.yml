section_title: Formação da primeira tripulação e do quadro inicial de instrutores
subsection_id: b
cite: 5.2.13(b)
title: 5.2.13(b)
text: 'b) a realização, pelos candidatos ao quadro inicial de instrutores do operador, dos
  treinamentos e exames necessários para que eles atuem como instrutores do operador.

  5.2.13.4 É necessário que o(s) piloto(s) em comando que formem a primeira tripulação por
  meio deste método componham também o quadro inicial de instrutores do operador.

  5.2.13.5 Idealmente, ambos os treinamentos e exames requeridos seriam realizados em conformidade
  com o parágrafo 5.2.13.2 desta IS. Porém, para operadores que estejam em processo de certificação
  inicial para obtenção do COA ou incluindo um novo modelo de aeronave em suas Especificações
  Operativas, pode haver dificuldade na aplicação do RBAC nº 135, uma vez que este cenário
  não é especificamente contemplado pelo RBAC. Um exemplo é quando se pretende operar um modelo
  de aeronave ainda não operado sob o RBAC nº 135, por nenhum outro operador.

  5.2.13.6 Caso não seja possível a obtenção de um instrutor conforme previsto no parágrafo
  5.2.13.2 desta IS, a Anac poderá, excepcionalmente, autorizar o operador aéreo a contratar
  ou acordar com um piloto, que possua notório conhecimento técnico no modelo da aeronave,
  para atuar como instrutor dos candidatos à primeira tripulação e do quadro inicial de instrutores
  do operador, na condução do programa de treinamento aprovado. Para tanto, deve ser protocolada
  na Anac a seguinte documentação para análise:'
