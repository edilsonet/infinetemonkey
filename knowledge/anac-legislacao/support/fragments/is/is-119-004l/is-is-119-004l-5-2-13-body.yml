title: Formação da primeira tripulação e do quadro inicial de instrutores
text: '5.2.13 Formação da primeira tripulação e do quadro inicial de instrutores

  5.2.13.1 O RBAC nº 135 estabelece, em seu parágrafo 135.323(a)(3), que o detentor de certificado
  deve proporcionar instrutores de solo apropriadamente qualificados para os treinamentos
  requeridos. Adicionalmente, no parágrafo 135.323(a)(5), é determinado que deve haver número
  suficiente de instrutores de voo e instrutores de FSTD para conduzir os referidos treinamentos
  e cursos de FSTD permitidos.

  5.2.13.2 O RBAC nº 135 também estabelece, em seu parágrafo 135.324(a), que além do detentor
  de certificado, somente outro detentor de certificado, segundo o RBAC nº 135, um CTAC certificado
  ou validado segundo o RBAC nº 142, ou um fabricante de aeronaves classe (segundo critérios
  do RBAC nº 61), para aeronaves de sua própria fabricação, é elegível para prover treinamento
  e exames, sob contrato ou outra forma de acordo.

  5.2.13.3 Após a aprovação do programa de treinamento, o operador aéreo deverá providenciar
  as tratativas para a formação de sua primeira tripulação e do quadro inicial de instrutores.
  Isso envolve dois processos distintos:'
