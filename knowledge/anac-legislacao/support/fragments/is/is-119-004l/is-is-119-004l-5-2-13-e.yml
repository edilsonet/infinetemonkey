title: 5.2.13(e)
text: 'e) FAI.

  5.2.13.7 Com relação aos instrutores indicados, a Anac irá avaliar se atendem aos requisitos
  regulamentares e se são qualificados para ministrar os treinamentos. Devem ser atendidos,
  no mínimo, os requisitos que seriam necessários para que a instrução ocorra em conformidade
  com o RBAC nº 61, que seria aplicável para um piloto que operaria sob o RBAC nº 91. É fundamental
  que seja demonstrada a experiência no modelo da aeronave e a qualificação do piloto que
  pretende ministrar as instruções.

  5.2.13.8 Com relação ao candidato à primeira tripulação, a Anac avaliará se possui experiência
  prévia na aeronave e/ou em modelos similares e se seria viável o seu treinamento para instrutor.

  5.2.13.9 Se autorizado, a Anac informará ao operador aéreo que pode proceder com o treinamento
  inicial completo da aeronave para a primeira tripulação e com o treinamento de instrutor
  de voo para o(s) primeiro(s) piloto(s) em comando.

  5.2.13.10 O piloto autorizado a ministrar a instrução de voo deve receber o treinamento
  de solo teórico previsto na seção 135.340 do RBAC nº 135. A critério da Anac, este piloto
  deve ser submetido ao exame de observação previsto no parágrafo 135.340(a)(2) do RBAC nº
  135 antes de ministrar treinamento ao primeiro piloto do operador aéreo no equipamento.

  5.2.13.11 A primeira tripulação do operador aéreo no equipamento deve receber o treinamento
  inicial completo da aeronave conforme previsto no programa de treinamento e ser submetido
  aos exames previstos nas seções 135.293, 135.297 e 135.299, conforme aplicáveis, do RBAC
  nº 135. Se aprovada, passará a ser a primeira tripulação do operador aéreo no equipamento.

  5.2.13.12 O(s) primeiro(s) piloto(s) em comando do operador aéreo no equipamento devem realizar
  os treinamentos de solo e voo para instrutor previstos na seção 135.340 do RBAC nº 135 e
  ser submetido ao exame de observação para instrutor de voo previsto no parágrafo 135.340(a)(2).
  Uma vez qualificado como piloto em comando e instrutor de voo, este será o disseminador
  do conhecimento para os demais tripulantes da empresa.

  5.2.13.13 O operador aéreo deve informar à GTCE, com uma antecedência mínima de 40 (quarenta)
  dias, toda a programação detalhada dos treinamentos e eventuais alterações. Tal prazo é
  fundamental para que um agente designado pela Anac possa acompanhar o procedimento e verificar
  sua eficácia.

  5.2.13.14 Caso o treinamento não seja devidamente notificado ou haja incerteza sobre o cumprimento
  do procedimento descrito nesta IS, o treinamento será invalidado.

  5.2.13.15 Caso o operador aéreo, após a certificação inicial para obtenção do COA ou inclusão
  de novo modelo de aeronave em suas Especificações Operativas, venha a perder o seu quadro
  de instrutores, poderá pleitear a formação de novo instrutor conforme previsto nesta IS.
  No entanto, tal situação deve ser excepcional, podendo ser motivo de ações de vigilância
  por parte da Anac. É de responsabilidade do operador aéreo a manutenção de um número suficiente
  de instrutores de voo para a condução dos seus treinamentos.

