title: Representantes e pessoas de contato da organização requerente
text: '5.2.2 Representantes e pessoas de contato da organização requerente

  5.2.2.1 A adequada condução dos processos depende da efetividade da comunicação entre a
  Anac e a organização requerente. Portanto, é essencial que a organização requerente realize
  e mantenha atualizado seu cadastro no protocolo eletrônico da Anac, bem como as indicações
  dos representantes legais e procuradores especiais no sistema SEI.

  5.2.2.2 As comunicações oficiais acerca dos processos serão encaminhadas através do sistema
  SEI, exclusivamente por meio eletrônico, para os representantes legais e procuradores cadastrados
  para o CNPJ da organização.

  5.2.2.3 O processo eletrônico da Anac está previsto na Resolução nº 520/2019, ou norma que
  venha a substituí-la, e maiores informações podem ser consultadas no seguinte endereço eletrônico:
  https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.2.2.4 Todas as comunicações, interações e documentos necessários aos processos somente
  serão aceitos se realizadas pelas pessoas legalmente designadas pela organização requerente,
  respeitadas as respectivas áreas de atuação. Os representantes não-técnicos legalmente designados
  podem receber orientações gerais sobre a documentação encaminhada pela organização requerente.

  5.2.2.5 São consideradas pessoas legalmente designadas pela organização requerente o gestor
  responsável, os indicados para os cargos de pessoal de administração requerido e os procuradores
  legalmente constituídos que estão devidamente cadastrados no sistema SEI para o CNPJ da
  organização.

  5.2.2.6 Visando a otimizar as interações entre a Anac e a organização requerente, detalhes
  envolvendo atendimento de requisitos técnicos somente serão fornecidos ao pessoal da direção
  da organização requerente ou ao pessoal técnico por ela indicado encarregado de providenciar
  o cumprimento do requisito técnico.

  5.2.2.7 Os processos podem ser acompanhados pelo requerente ou seu representante legal pelo
  sistema SEI (https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei), se necessário,
  solicitando vista aos documentos que estiverem protegidos conforme a Lei nº 12.527 (Lei
  de Acesso à Informação) pelo Serviço de Informações ao Cidadão - SIC (https://www.gov.br/anac/pt-br/acesso-a-informacao/servico-de-informacoes-ao-cidadao-sic).'
