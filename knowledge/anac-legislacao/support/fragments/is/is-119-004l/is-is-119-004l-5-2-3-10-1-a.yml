section_title: 'Conforme parágrafo 119.71(b)(1) do RBAC nº 119, o diretor ou gerente de operações
  deve possuir uma licença de:'
subsection_id: a
cite: 5.2.3.10.1(a)
title: 5.2.3.10.1(a)
text: a) se o indicado já tiver atuado como diretor ou gerente de operações, independentemente
  do tempo na função, deve ter pelo menos 3 anos de experiência como piloto em comando de
  aeronaves operando segundo o RBAC nº 121 ou 135;
