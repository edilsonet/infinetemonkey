section_id: 5.2.3.10.1
section_title: 'Conforme parágrafo 119.71(b)(1) do RBAC nº 119, o diretor ou gerente de operações
  deve possuir uma licença de:'
subsection_id: b
cite: 5.2.3.10.1(b)
title: 5.2.3.10.1(b)
text: 'b) Piloto Comercial (PC), se as operações somente requererem que o piloto em comando
  possua igual licença. Se for requerida habilitação de voo por instrumentos (IFR) para algum
  piloto em comando do detentor de certificado, o diretor ou gerente de operações também deve
  possuir habilitação IFR.

  5.2.3.10.1.1 A licença não pode ter sido cassada ou de outra forma invalidada. As habilitações
  associadas não necessitam estar válidas.

  5.2.3.10.1.2 Podem ser aceitas licenças emitidas por outro Estado contratante da OACI, sujeito
  à avaliação da Anac sobre o Estado emissor (por exemplo, referente às diferenças reportadas
  pelo Estado com relação aos Anexos da OACI ou aos resultados do Estado no programa de auditorias
  USOAP, da OACI), bem como às verificações necessárias junto ao Estado emissor para confirmação
  da validade dos documentos apresentados. O candidato deve cumprir ainda os outros requisitos
  aplicáveis, incluindo o entendimento sobre os RBAC, conforme requerido pelo parágrafo 119.69(d)(2)
  do RBAC nº 119.

  5.2.3.10.2 O requisito de experiência pode ser atendido por meio da experiência administrativa
  (119.71(b)(2)(i)) ou por meio de experiência de voo combinada ou não com experiência prévia
  na função (119.71(b)(2)(ii)).

  5.2.3.10.2.1 Com relação à experiência administrativa como gerente ou supervisor mencionada
  no parágrafo 119.71(b)(2)(i) do RBAC nº 119, o profissional indicado deve demonstrar que
  exerceu função na qual suas atribuições e responsabilidades normais incluíam gerenciamento
  e tomada de decisão em processos de controle operacional (ex: gerente ou supervisor de centro
  de despacho de voo, escala de tripulantes, treinamento de tripulantes, flight standards).
  Comprovação de experiência prévia em outras posições da administração requerida pela seção
  119.69 do RBAC nº 119 também são aceitáveis para demonstração de experiência em posição
  exercendo controle operacional.

  5.2.3.10.2.2 Com relação à experiência de voo mencionada no parágrafo 119.71(b)(2)(ii) do
  RBAC nº 119:'
