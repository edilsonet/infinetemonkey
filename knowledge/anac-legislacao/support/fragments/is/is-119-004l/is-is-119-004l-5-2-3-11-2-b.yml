section_id: 5.2.3.11.2
section_title: 'O piloto chefe deve possuir uma licença de:'
subsection_id: b
cite: 5.2.3.11.2(b)
title: 5.2.3.11.2(b)
text: 'b) Piloto Comercial (PC), se as operações somente requererem que o piloto em comando
  possua igual licença. Se for requerida habilitação de voo por instrumentos (IFR) para algum
  piloto em comando do detentor de certificado, o piloto chefe também deve possuir habilitação
  IFR (119.71(d)).

  5.2.3.11.3 O piloto chefe deve ser qualificado para trabalhar, como piloto em comando, em
  modelo de aeronave aceitável pela Anac. Portanto, as licenças e habilitações requeridas
  devem ser as emitidas pela Anac, não sendo aceitas licenças emitidas por outro Estado.

  5.2.3.11.3.1 A qualificação para trabalhar como piloto em comando é obtida por meio do cumprimento
  do programa de treinamento operacional aprovado do detentor de certificado. No início do
  processo de certificação, é aceitável que o candidato a piloto chefe ainda não possua essas
  qualificações, desde que ele venha a obtê-las durante o processo de certificação do operador.

  5.2.3.11.3.2 Na avaliação do modelo de aeronave aceitável, o objetivo da Anac é verificar
  se as operações realizadas pelo candidato ao cargo de piloto chefe são representativas em
  relação às operações do operador aéreo, especialmente no que se refere à complexidade e
  aos tipos de operação habitualmente realizados.

  5.2.3.11.3.3 O operador aéreo, por meio do formulário de análise de impacto (FAI), deve
  apresentar à Anac quais foram os critérios utilizados para determinar o piloto chefe, considerando
  os aspectos operacionais e a sua frota. Espera-se que sejam abordados, no mínimo, os seguintes
  itens, não sendo esta relação exaustiva:'
