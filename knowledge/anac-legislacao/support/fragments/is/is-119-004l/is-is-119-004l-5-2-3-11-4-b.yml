section_title: 'Com relação à experiência de voo:'
subsection_id: b
cite: 5.2.3.11.4(b)
title: 5.2.3.11.4(b)
text: 'b) se o indicado não tiver atuado como piloto chefe, deve ter pelo menos 3 anos de
  experiência, dentro dos últimos 6 anos, como piloto em comando de aeronaves operando segundo
  o RBAC nº 121 ou 135 (119.71(c)(1) e (d)(1)).

  Nota: os parágrafos 119.71(c)(2)(i) e (d)(2)(i) do RBAC nº 119 preveem ainda, para pessoa
  com experiência prévia como piloto chefe, a possibilidade de atendimento dos requisitos
  de experiência de voo por pilotos das Forças Armadas, da reserva, mediante atendimento de
  critérios alternativos.

  5.2.3.11.5 Para detentores de certificado que operem aeronaves de categorias distintas (por
  exemplo, aviões e helicópteros), é recomendado que possuam um Piloto Chefe para cada categoria
  de aeronave. Nesse caso, é requerido que ambos cumpram os requisitos de experiência da seção
  119.71 do RBAC nº 119.'
