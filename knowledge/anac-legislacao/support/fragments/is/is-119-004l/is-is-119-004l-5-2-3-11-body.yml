title: Orientações adicionais quanto à posição de piloto chefe
text: '5.2.3.11 Orientações adicionais quanto à posição de piloto chefe

  5.2.3.11.1 Os requisitos para atuar como piloto chefe constam nos parágrafos 119.71(c) e
  (d), com aplicabilidades distintas. No entanto, dada a similaridade, são apresentados a
  seguir de forma conjunta, fazendo a distinção somente quando necessário.'
