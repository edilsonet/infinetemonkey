section_id: 5.2.3.12.2
section_title: 'Conforme parágrafo 119.71(e)(1) do RBAC nº 119, há duas alternativas referentes
  à qualificação do profissional:'
subsection_id: a
cite: 5.2.3.12.2(a)
title: 5.2.3.12.2(a)
text: 'a) possuir diploma ou certificado de curso técnico, tecnólogo ou superior com currículo
  compatível com as atividades a serem exercidas.

  I - São consideradas aceitáveis as seguintes formações:

  A) engenharia com qualificação coerente com a atividade realizada;

  B) tecnólogo em manutenção de aeronaves; ou

  C) técnico em manutenção de aeronaves.

  II - Sob as alternativas do parágrafo 5.2.3.12.2(a)(I), o profissional deve estar registrado
  junto ao respectivo conselho de fiscalização da profissão, com atribuição profissional coerente
  com a atividade desempenhada. Para atendimento a esse requisito, em seu registro devem constar
  as atribuições necessárias para exercer atividades de direção de serviços técnicos referentes
  a aeronaves, seus sistemas, seus equipamentos e seus serviços afins e correlatos. De acordo
  com os procedimentos de cada conselho, é possível que o registro regular do profissional
  junto ao conselho já contemple a atribuição de direção de serviços técnicos, não sendo necessária
  comprovação adicional específica desta atribuição. A comprovação de possuir, no seu conselho
  de fiscalização da profissão, registro de atribuições compatíveis com o requerido RBAC nº
  119, pode ser feita de uma das seguintes formas:

  A) a Anac pode consultar as bases do conselho com o número de CPF da pessoa;

  B) a pessoa pode apresentar os comprovantes, caso os tenha à mão; ou

  C) a pessoa pode fornecer uma declaração escrita e assinada, nos termos do parágrafo único
  do art. 3º do Decreto nº 9.094, de 17 de julho de 2017.

  III - Outras formações em curso técnico, tecnólogo ou superior reconhecidas pelo Ministério
  da Educação podem ser consideradas aceitáveis, mediante avaliação caso a caso pela Anac
  quanto ao currículo profissional do candidato e sua compatibilidade com as atividades a
  serem exercidas. Esta análise do currículo é complementar à qualificação e não dispensa
  o cumprimento dos outros requisitos específicos de treinamento, experiência e competência
  estabelecidos no RBAC nº 119.

  IV - Podem ser aceitas qualificações obtidas no exterior, sujeito às verificações necessárias
  junto ao Estado emissor para confirmação da validade dos documentos apresentados, bem como
  ao atendimento dos parágrafos de 5.2.3.12.2(a)(I) a (III).'
