section_title: 'Conforme parágrafo 119.71(e)(1) do RBAC nº 119, há duas alternativas referentes
  à qualificação do profissional:'
subsection_id: b
cite: 5.2.3.12.2(b)
title: 5.2.3.12.2(b)
text: 'b) possuir licença de mecânico de manutenção aeronáutica, com habilitação nos grupos
  célula e motopropulsor.

  I - As habilitações não necessitam estar válidas, se o profissional não pretender exercer
  as prerrogativas concedidas a seu titular, como as previstas nos RBAC nº 43 e 65. No entanto,
  nesse caso, a Anac avaliará as razões para a perda da validade: a suspensão em razão de
  falta de recredenciamento não representa impedimento ao cumprimento do requisito; no entanto,
  suspensão por aplicação de medidas cautelares ou punitivas representam impedimento.

  II - Podem ser aceitas licenças emitidas por outro Estado contratante da OACI, sujeito à
  avaliação da Anac sobre o Estado emissor (por exemplo, referente às diferenças reportadas
  pelo Estado com relação aos Anexos da OACI ou aos resultados do Estado no programa de auditorias
  USOAP, da OACI), ao atendimento do parágrafo 5.2.3.12.2(b)(I), bem como às verificações
  necessárias junto ao Estado emissor para confirmação da validade dos documentos apresentados.
  O candidato deve cumprir ainda os outros requisitos aplicáveis, incluindo o entendimento
  sobre os RBAC, conforme requerido pelo parágrafo 119.69(d)(2) do RBAC nº 119.

  5.2.3.12.3 Conforme parágrafo 119.71(e)(2) do RBAC nº 119, deve-se ter 3 anos de experiência,
  dentro dos últimos 6 anos, em atividades profissionais relacionadas a manutenção de produtos
  aeronáuticos para um detentor de certificado de operador aéreo ou organização de manutenção
  de produto aeronáutico.

  5.2.3.12.4 Conforme parágrafo 119.71(e)(3) do RBAC nº 119, deve-se ter realizado curso em
  uma das aeronaves de maior categoria de certificação de tipo e motorização operadas pelo
  detentor de certificado ou ter experiência prática em atividades de manutenção em aeronaves
  de mesma categoria de certificação de tipo e motorização similar operadas pelo detentor
  de certificado.

  5.2.3.12.5 Caso o profissional pretenda atuar em mais de uma empresa, deve demonstrar à
  Anac que há compatibilização de tempo e área de atuação, conforme previsto nos parágrafos
  119.69(a) e 119.71(e)(4) do RBAC n° 119. Quando o profissional for compartilhado por mais
  de uma empresa aérea ou organização de manutenção, aplicam-se as seguintes condições:'
