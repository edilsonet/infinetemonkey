section_title: 'Conforme parágrafo 119.71(e)(1) do RBAC nº 119, há duas alternativas referentes
  à qualificação do profissional:'
subsection_id: d
cite: 5.2.3.12.2(d)
title: 5.2.3.12.2(d)
text: d) a carga horária do profissional deve estar estabelecida no seu vínculo profissional
  com as empresas, não ocorrendo sobreposições, e itser compatível com o exercício de suas
  funções em todas elas, considerando inclusive o eventual deslocamento do profissional entre
  instalações sediadas em localidades diferentes. O profissional deve enviar à Anac a proposta
  de como pretende cumprir as cargas horárias nas respectivas empresas, incluindo os traslados
  quando as empresas não forem na mesma cidade, e justificar a divisão de dedicação às empresas.
