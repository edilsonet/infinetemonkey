title: Substituição compulsória de cargo de administração por processo sancionatório
text: '5.2.3.13 Substituição compulsória de cargo de administração por processo sancionatório

  5.2.3.13.1 A Anac poderá solicitar a substituição de uma pessoa exercendo qualquer um dos
  cargos de administração requeridos de uma empresa de transporte aéreo previstos na seção
  119.69 do RBAC nº 119, em decorrência de processo sancionatório instaurado nos termos da
  Resolução Anac nº 762/2024, ou norma que vier a substituí-la, conforme previsto no art.
  288 do Código Brasileiro de Aeronáutica.

  5.2.3.13.2 Caso seja constatada a participação ou omissão dos ocupantes de cargo de administração
  requerido nas infrações relacionadas no art. 288 do Código Brasileiro de Aeronáutica, de
  forma sistêmica e reiterada, a Anac poderá solicitar a substituição do ocupante do cargo.

  Nota: esta previsão é adicional à constante no parágrafo 119.40(c)(1) do RBAC nº 119.

  5.2.3.13.3 O detentor de certificado será informado da necessidade de substituição do pessoal
  de administração requerido por meio de Ofício, contendo prazo para a efetivação da substituição.

  5.2.3.13.4 Após a comunicação da decisão por parte da Anac, o detentor de certificado deverá
  encaminhar solicitação de alteração de EO para atualização do pessoal de administração requerido,
  conforme a seção 5.4.5, e estará sujeito aos prazos e às providências administrativas previstas
  na seção 5.5.2, ambos desta IS.'
