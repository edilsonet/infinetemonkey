cite: 5.2.3.14(b)
title: 5.2.3.14(b)
text: 'b) os procedimentos para notificação à Anac de alteração ou vacância do pessoal de
  administração, no prazo de 10 dias, conforme requerido pelo parágrafo 119.69(e)(3) do RBAC
  nº 119. Nesta notificação, deve ser anexada a solicitação de alteração de pessoal de administração,
  em conformidade com a seção 5.4.5 desta IS; no entanto, caso o detentor de certificado não
  possua indicação no prazo de 10 dias para enviar junto à notificação, deve incluir justificativa
  para a situação, apresentar a pessoa que exercerá as atribuições interinamente e apresentar
  um plano para conclusão do processo no prazo de 60 dias.

  5.2.3.15.4 O processo de escolha do novo profissional deve ser criterioso, mediante verificação,
  por parte do detentor de certificado, de que o indicado cumpre com os requisitos aplicáveis.
  Caso a Anac não aceite a indicação, poderá ser concedido prazo adicional de 10 dias para
  a apresentação de nova indicação.

  5.2.3.15.5 Caso a Anac identifique que as condições estabelecidas nesta seção não são mantidas,
  pode suspender o Certificado de Operador Aéreo em conformidade com a seção 5.5.2 desta IS.'
