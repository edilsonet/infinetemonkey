text: '5.2.3.14 Substituição compulsória de cargo por deficiência técnica ou de gestão

  5.2.3.14.1 A qualquer momento a Anac poderá solicitar a substituição de uma pessoa exercendo
  qualquer um dos cargos de administração requeridos de uma empresa de transporte aéreo previstos
  na seção 119.69 do RBAC nº 119, caso seja constatado que o ocupante do cargo deixou de cumprir
  com os requisitos estabelecidos pelo parágrafo 119.69(d) do RBAC nº 119.

  5.2.3.14.2 A Anac considera que as condições listadas abaixo demonstram deficiência técnica
  do pessoal de administração requerido, quando comprovadamente são reiteradas e sistêmicas
  e/ou levam a operação do detentor de certificado a situações indesejadas com risco operacional
  inaceitável:'
