title: 5.2.3.14(h)
text: 'h) demonstrar falta de assertividade na tomada de decisão ou na gestão das suas responsabilidades
  e/ou de seus subordinados.

  5.2.3.14.3 O detentor de certificado será informado da necessidade de substituição do pessoal
  de administração requerido por meio de Ofício, contendo prazo para a efetivação da substituição.

  5.2.3.14.4 Após a comunicação da decisão por parte da Anac, o detentor de certificado deverá
  encaminhar solicitação de alteração de EO para atualização do pessoal de administração requerido,
  conforme a seção 5.4.5, e estará sujeito aos prazos e às providências administrativas previstos
  na seção 5.5.2, ambas desta IS.

  5.2.3.15. Alteração e vacância do pessoal de administração requerido

  5.2.3.15.1 O parágrafo 119.69(e)(3) do RBAC nº 119 estabelece que o detentor de certificado
  deve notificar à Anac, no prazo de 10 dias, qualquer alteração ou vacância do pessoal de
  administração requerido. Este prazo se aplica somente no caso de alterações não programadas.
  Nas demais situações, o operador deve enviar a solicitação de alteração de pessoal de administração
  com a antecedência requerida para alteração das EO, conforme previsto na seção 5.4 desta
  IS.

  5.2.3.15.2 Na eventualidade do desligamento de profissional exercendo cargo listado como
  pessoal de administração requerido, o processo de cadastramento de novo profissional deverá
  estar concluído em, no máximo, 60 dias corridos, incluindo o prazo de 10 dias para notificação
  à Anac. Esse prazo considera que o detentor de certificado possui procedimentos e atua para
  que as atribuições do cargo vago sejam exercidas de forma interina, de forma a cumprir com
  sua obrigação de manter o cumprimento dos regulamentos e de conduzir operações seguras,
  conforme os parágrafos 119.40(c) e 119.39(a)(3) do RBAC nº 119.

  5.2.3.15.3 Para garantir o cumprimento deste requisito, o detentor de certificação (ou a
  organização requerente) deve incluir em seu sistema de documentos de segurança operacional
  (como no MGO, MGM/PMAC e MGSO):'
