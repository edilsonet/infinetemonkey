title: Orientações adicionais quanto à posição de gestor responsável
text: '5.2.3.8 Orientações adicionais quanto à posição de gestor responsável

  5.2.3.8.1 O gestor responsável deve possuir as prerrogativas e responsabilidades atribuídas
  a essa função, em conformidade com os parágrafos 119.71(g) e 119.72(a) do RBAC nº 119.

  5.2.3.8.2 A designação do Gestor Responsável deve refletir as prerrogativas e responsabilidades
  atribuídas a essa função, devendo estar em conformidade com os atos constitutivos do operador
  aéreo (119.71(h)).'
