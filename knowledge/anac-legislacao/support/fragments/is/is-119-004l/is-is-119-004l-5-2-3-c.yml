cite: 5.2.3(c)
title: 5.2.3(c)
text: 'c) a área de operações.

  Nota: um caso particular desta possibilidade é apresentado na seção 6 desta IS.

  5.2.3.3 Conforme 119.71(f) do RBAC nº 119, podem ser solicitados desvios relativos aos requisitos
  de experiência previstos na seção 119.71. Tais desvios podem ser solicitados quando o candidato
  não possui a experiência requerida, seja como piloto ou em cargos de gestão. Porém, não
  são aceitos pela Anac desvios relativos à qualificação da pessoa como piloto, como, por
  exemplo, um candidato sem uma licença de piloto de linha aérea (PLA) ou sem uma habilitação
  para a aeronave específica, quando requeridas.

  5.2.3.3.1 A prerrogativa sobre análise e eventual autorização é da Anac. A Anac se reserva
  ao direito de revogar qualquer autorização concedida nesses temos, a qualquer momento, podendo
  determinar que o detentor de certificado designe um novo profissional para o cargo no prazo
  de 30 dias, extensível pela Anac por igual período.

  5.2.3.3.2 Na avaliação da solicitação, a Anac levará em conta o tamanho e abrangência das
  operações, bem como a qualificação do pessoal técnico do detentor do certificado.

  5.2.3.3.3 Pode ser considerada comparável, para fins do parágrafo 119.71(f) do RBAC nº 119,
  a experiência administrativa, de voo ou de manutenção obtida em detentores de certificado
  de operador aéreo ou organização de manutenção aeronáutica estrangeiros, sujeito à avaliação
  da Anac sobre o Estado emissor (por exemplo, referente às diferenças reportadas pelo Estado
  com relação aos Anexos da OACI ou aos resultados do Estado no programa de auditorias USOAP,
  da OACI), bem como às verificações necessárias junto ao Estado emissor para confirmação
  da validade dos documentos apresentados. O candidato deve cumprir ainda os outros requisitos
  aplicáveis, incluindo o entendimento sobre os RBAC, conforme requerido pelo parágrafo 119.69(d)(2)
  do RBAC nº 119.

  5.2.3.4 Conforme 119.69(a) do RBAC nº 119, o pessoal de administração deve trabalhar horas
  suficientes nas suas posições administrativas. Assim, existem restrições quanto ao acúmulo
  de funções em uma mesma empresa ou compartilhamento de uma pessoa entre diferentes empresas:'
