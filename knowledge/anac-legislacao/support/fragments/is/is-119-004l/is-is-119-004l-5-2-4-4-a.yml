text: 'a) impactos do custo da proposta: considerando o tempo necessário à certificação ou,
  no caso de empresa já certificada, alteração. A empresa deve informar, por exemplo, que
  calculou os custos de capital necessários e que dispõe desses recursos, que está ciente
  que o montante poderá ficar bloqueado por extensos períodos;'
