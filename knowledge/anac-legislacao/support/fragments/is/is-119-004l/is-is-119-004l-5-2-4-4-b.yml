title: 5.2.4.4(b)
text: 'b) impacto sobre o pessoal de administração requerido: a empresa deve informar que
  atende aos requisitos de pessoal do RBAC nº 119, ou, no caso de empresa já certificada e
  que atualmente não atenda aos requisitos para a operação pretendida, que está ciente da
  necessidade de alteração de pessoal;'
