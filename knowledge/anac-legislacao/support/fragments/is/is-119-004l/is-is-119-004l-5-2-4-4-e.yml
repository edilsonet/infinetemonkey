title: 5.2.4.4(e)
text: 'e) impacto em recursos materiais: deve assegurar que a empresa irá dispor de material
  suficiente e adequado para a operação, conforme a necessidade. Por material entende-se qualquer
  recurso físico e tangível para suportar a operação, por exemplo: equipamentos de terra,
  equipamentos de emergência, equipamentos de comunicação, publicações aeronáuticas, dispositivos
  eletrônicos, dispositivos de localização e quaisquer outros que possam influenciar a operação.
  Deve considerar ainda a necessidade de infraestrutura externa à empresa. (Por exemplo: o
  aeródromo da base principal comporta a operação pretendida? A operação é de alguma forma
  limitada pela infraestrutura disponível? Existe abastecimento, serviço contra incêndio,
  instalações para recebimento de passageiros e carga para comportar a operação?); e'
