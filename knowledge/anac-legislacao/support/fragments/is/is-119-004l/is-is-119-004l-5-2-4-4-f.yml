cite: 5.2.4.4(f)
title: 5.2.4.4(f)
text: 'f) impacto nos serviços de manutenção: deve apresentar o estudo de impacto nos serviços
  de manutenção, próprios ou terceirizados, apropriados para a operação pretendida. Deve informar
  das necessidades de contratação e treinamento de pessoal e da necessidade de aquisição de
  material como manuais, ferramental e peças de reposição.

  5.2.4.4.2 O formulário FAI deve ser assinado, obrigatoriamente, por todo o pessoal de administração
  requerido da empresa, de forma a indicar sua ciência do resultado do estudo apresentado.

  5.2.4.4.3 O estudo presente no formulário FAI deve prover evidência objetiva de que a organização
  planejou as ações para conduzir com segurança as operações propostas.

  5.2.4.4.4 Também deve constar do FAI os números dos processos com os peticionamentos de
  análises de manuais e outros documentos que impactam diretamente no processo de certificação,
  alteração de COA e/ou alteração de EO. Caso não tenham sido enviados manuais ou outros documentos
  e processos distintos, essa informação deve constar no FAI da mesma forma.'
