title: Modelos de formulários e modelos de currículos
text: '5.2.4 Modelos de formulários e modelos de currículos

  5.2.4.1 Os formulários FOP e os modelos de currículos mencionados nesta IS têm por finalidade
  padronizar o fluxo de informações das organizações requerentes para a Anac e vice-versa,
  assim como padronizar o fluxo de informações entre setores internos da Anac, objetivando
  prover maior celeridade ao processo de certificação. A utilização desses formulários e modelos
  é um meio aceitável de cumprimento dos parágrafos 119.35(a)(1) e (a)(2) do RBAC nº 119.

  5.2.4.2 Os respectivos modelos de formulários e currículos, em sua versão mais atualizada,
  estão disponíveis, em formato editável, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.4.3 Os FOP aplicáveis aos processos para operação segundo o RBAC nº 135 são listados
  a seguir, sinalizados como de emissão pelos requerentes (Req.) ou pela Anac (Anac):'
