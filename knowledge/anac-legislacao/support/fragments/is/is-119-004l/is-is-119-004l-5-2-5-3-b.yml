section_title: 'Para os propósitos de definição das TFAC aplicáveis, utiliza-se a seguinte
  relação:'
subsection_id: b
cite: 5.2.5.3(b)
title: 5.2.5.3(b)
text: 'b) para Operadores Padrão, se aplicam as TFAC de operadores do Grupo III da Resolução
  nº 653.

  Nota: conforme parágrafo 5.4.1.10 desta IS, nos casos de alteração de EO, considera-se sempre
  o grupo no qual a empresa estará classificada após a alteração.

  5.2.5.4 As TFAC previstas na Resolução nº 653, de 2021 destinadas aos operadores do RBAC
  nº 135 de maneira geral, se aplicam aos operadores de todos os operadores sob o RBAC nº
  135, independentemente de seu grupo de classificação.'
