title: Emolumentos
text: '5.2.5 Emolumentos

  5.2.5.1 As TFAC aplicáveis estão previstas na Resolução nº 653, de 20 de dezembro de 2021,
  regulamentada pela Portaria nº 8.676, de 25 de julho de 2022, ou normas que venham a substituí-las.

  5.2.5.2 As orientações sobre a aplicabilidade das TFAC e sobre a geração das respectivas
  guias de recolhimento da união (GRU) podem ser encontradas no sítio da Anac, por meio do
  seguinte endereço eletrônico: https://www.gov.br/anac/pt-br/sistemas/novas-tfac.'
