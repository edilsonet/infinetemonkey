text: '5.2.6.13 Os modelos dos cartões de bordo com instruções aos passageiros são considerados
  parte do MGO.

  5.2.6.14 O manual geral de manutenção (MGM) pode ser apresentado em um ou mais volumes,
  devendo incluir a descrição dos procedimentos de manutenção realizados pelas oficinas certificadas.

  5.2.6.15 A qualquer momento, se a Anac identificar que partes do manual e/ou programa, sejam
  eles aceitos ou aprovados, não são satisfatórias, o operador deve revisar tais partes no
  prazo determinado pela Agência.

  5.2.6.16 Os manuais e programas que forem revisados, cuja revisão não implique alterações
  de dados do COA ou das EO, devem ser encaminhados diretamente aos setores responsáveis,
  os quais interagirão diretamente com o operador, não sendo necessária a remessa de qualquer
  documentação ao EsEC. Os manuais devem ser encaminhados por meio de FOP 207, juntamente
  com os dados de pagamento das TFAC (se aplicáveis).'
