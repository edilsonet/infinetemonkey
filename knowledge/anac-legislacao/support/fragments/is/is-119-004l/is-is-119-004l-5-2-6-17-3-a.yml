section_title: 'Na certificação inicial:'
subsection_id: a
cite: 5.2.6.17.3(a)
title: 5.2.6.17.3(a)
text: a) a organização requerente deve encaminhar como anexo ao FOP 204 uma declaração de
  conformidade inicial referenciando todas as seções e parágrafos dos RBAC nº 91 e 135, conforme
  requerido pela seção 119.35 do RBAC nº 119. Essa declaração deve ser uma listagem completa
  de todas as seções e parágrafos dos RBAC aplicáveis à operação pretendida pela organização
  requerente, com o correspondente método de conformidade a ser adotado por ela ou uma indicação
  de que o requisito não lhe seja aplicável.
