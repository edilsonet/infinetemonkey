title: 5.2.6.17.3(c)
text: c) se o método de cumprimento específico ainda não tiver sido desenvolvido pela organização
  requerente no momento de apresentação do FOP 204, a declaração de conformidade deve indicar
  a data de quando a organização encaminhará sua atualização com o método proposto. A declaração
  de conformidade deve ser assinada pelo gestor responsável ou pelos diretores de operações
  e de manutenção da organização requerente do COA.
