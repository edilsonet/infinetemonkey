title: 5.2.6.17.3(d)
text: d) caso a organização requerente tenha optado por obter a certificação cumprindo requisitos
  inicialmente não aplicáveis à sua operação e caso a Anac permita essa opção, esses requisitos
  passam a ser de cumprimento obrigatório e deverão constar na declaração de conformidade.
  Por exemplo, uma organização requerendo certificação para operações não regulares pode optar
  por cumprir requisitos de piloto em comando aplicáveis a operações regulares. Nesse caso,
  esses requisitos passam a ser de cumprimento obrigatório.
