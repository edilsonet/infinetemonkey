title: Declaração de conformidade
text: '5.2.6.17 Declaração de conformidade

  5.2.6.17.1 Os modelos de declaração de conformidade estão disponíveis para consulta no endereço
  eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.6.17.2 Quando houver modelo de declaração de conformidade específica, o operador também
  deverá providenciar o seu preenchimento. A título exemplificativo, cita-se o D-142-01 que
  é utilizado para o Programa de Manutenção de Aeronavegabilidade Continuada (PMAC).'
