text: '5.2.6 Sistema de documentos de segurança operacional

  5.2.6.1 O sistema de documentos de segurança operacional contém informações sobre as políticas
  gerais do operador aéreo, deveres e responsabilidades dos tripulantes e do pessoal de solo,
  descrição dos treinamentos, sistemas das aeronaves, política de controle operacional e procedimentos
  específicos de operações e manutenção.

  5.2.6.2 O RBAC nº 135 requer que o sistema de documentos de segurança operacional inclua
  as instruções e as informações necessárias para permitir o desempenho de operações seguras
  de voo e de solo. A descrição do conteúdo do sistema de documentos de segurança operacional
  pode ser encontrada no RBAC nº 135, seções 135.21, 135.23, entre outras, assim como nas
  instruções suplementares que tratam especificamente dos próprios manuais e programas e das
  autorizações para operações específicas.

  5.2.6.3 O operador aéreo deve estabelecer o sistema de documentos de segurança operacional
  conforme as características da operação pretendida, de forma a atender a legislação em vigor,
  em consonância com as políticas do operador aéreo. O conteúdo dos documentos, manuais, programas
  etc., independentemente de terem sido aprovados ou aceitos pela Anac, são de inteira responsabilidade
  do operador.

  5.2.6.4 Para a certificação inicial, o sistema de documentos de segurança operacional deverá
  estar desenvolvido para ser entregue junto com o FOP 204. A Anac reconhece que a compra
  ou leasing de uma aeronave pode não estar completamente definida no início do processo de
  certificação, porém o requerente deve encaminhar para avaliação seus manuais e programas
  específicos (de operações e de manutenção) completos, considerando o tipo de aeronave a
  ser empregado em suas operações. Eventual alteração durante o processo de certificação deve
  atender à seção 5.3.3 desta IS.

  5.2.6.5 Visando a aprovação ou aceitação dos manuais de forma mais célere, e a fim de evitar
  gastos desnecessários e longos períodos de análise processual, a Anac recomenda que a organização
  requerente produza seus manuais e programas com atenção ao seguinte:'
