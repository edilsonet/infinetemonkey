title: 5.2.6(g)
text: 'g) é encorajado que os procedimentos contidos nos manuais e programas satisfaçam os
  requisitos de maneira superior aos mínimos requeridos pela legislação.

  5.2.6.6 O prazo para análise e eventual aceitação ou aprovação de determinado manual, programa
  ou documento dependerá do atendimento satisfatório, em termos de conteúdo e tempo, pela
  organização requerente, das deficiências e não-conformidades apontadas pela Anac. Respostas
  insatisfatórias às deficiências e não-conformidades apontadas pela equipe de certificação
  poderão gerar atrasos no processo de certificação.

  5.2.6.7 Os manuais e/ou programas que requerem aceitação receberão um FOP 212, que deverá
  ser anexado a cada manual e/ou programa correspondente, de modo a comprovar a aceitação
  do material pela Anac.

  5.2.6.8 Uma vez que o operador esteja certificado, os manuais ou partes dos manuais sujeitas
  à aceitação poderão ser revisados pelo operador, sem necessidade de análise de conteúdo
  por parte da Anac, bastando que o operador protocole a revisão do manual, juntamente com
  o comprovante de pagamento da TFAC correspondente, quando aplicável. Informações sobre emolumentos
  estão disponíveis na seção 5.2.5 desta IS.

  5.2.6.9 Já os manuais e/ou programas que requerem aprovação receberão um FOP 211, que deverá
  ser anexado a cada manual e/ou programa correspondente, de modo a comprovar a aprovação
  do material pela Anac.

  5.2.6.10 Uma vez que o operador esteja certificado, os manuais e/ou programas ou partes
  desses, sujeitas à aprovação, poderão ser revisados pelo operador, mas as modificações realizadas
  somente poderão ser implementadas após a análise de conteúdo por parte da Anac, seguida
  com a emissão do FOP 211 para a revisão em questão.

  5.2.6.11 A tabela abaixo reúne os manuais e programas do sistema de manuais, indicando para
  cada um deles a sua aplicabilidade e se é requerida aceitação ou aprovação.

  Tabela 1 - Manuais e programas do sistema de manuais

