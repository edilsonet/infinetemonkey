text: '5.2.7 Documentos de comprovação de compra, leasing, contratos e cartas de intenção

  5.2.7.1 Estes documentos devem prover evidência objetiva de que a organização requerente
  tem condições de conduzir com segurança as operações propostas, em instalações adequadas
  e com serviços operacionais de apoio apropriadamente contratados, levando-se em conta o
  nível de complexidade dessas operações.

  5.2.7.2 Alguns exemplos de equipamentos, instalações e serviços cuja disponibilidade deve
  ser demonstrada por documentos como comprovação de compra, contrato ou carta de intenção
  são os seguintes:'
