title: Solicitações de isenção de cumprimento de regra ou procedimento alternativo
text: '5.2.8 Solicitações de isenção de cumprimento de regra ou procedimento alternativo

  5.2.8.1 Caso a organização requerente pretenda solicitar alguma isenção de cumprimento de
  requisito de regulamento, deve fazê-lo de acordo com o previsto no RBAC nº 11.

  5.2.8.2 Caso a organização requerente pretenda solicitar procedimento alternativo de cumprimento
  de procedimentos contidos em IS, deve apresentar solicitação formal, utilizando um FOP 208,
  para deliberação da SPO ou de gerência por ela delegada.'
