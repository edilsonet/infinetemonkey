text: '5.2.9.10 As listas de matrículas e capacidades operacionais devem possuir um controle
  formal de revisões, de publicação e de distribuição.

  5.2.9.11 Caso um detentor de certificado não apresente a listagem solicitada pela Anac e/ou
  falhe em demonstrar que o seu processo de gerenciamento da frota está documentado e efetivo
  estará sujeito às sanções administrativas previstas na Resolução Anac nº 762/2024 incluindo
  o disposto nas seções 5.5, 5.6 e 5.7 desta IS.

  5.2.9.12 O operador deve possuir procedimentos para preencher e enviar à Anac para validação,
  os formulários da CARSAMMA relativos às suas autorizações operacionais, conforme aplicáveis.

  Nota: os formulários encontram-se disponíveis em http://portal.cgna.decea.mil.br/carsamma/home/formularios.'
