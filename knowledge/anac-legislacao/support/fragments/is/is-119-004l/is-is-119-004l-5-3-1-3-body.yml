text: '5.3.1.3 Nas reuniões solicitadas pela Anac, é obrigatório o comparecimento do pessoal
  de administração requerido que for solicitado.

  5.3.1.4 A critério da Anac, poderá ser realizada reunião entre a organização requerente
  e a área técnica responsável, com finalidade de confirmar se o conhecimento do pessoal de
  administração requerido sobre a legislação aplicável e sobre o sistema de documentos de
  segurança operacional da organização requerente satisfaz os requisitos regulamentares.

  5.3.1.5 A GTCE será a principal via de comunicação entre a organização requerente e a Anac.
  Entretanto, as comunicações e interações relacionadas aos processos de análise de manuais,
  programas e documentos que estejam sob responsabilidade da GTOA serão realizadas diretamente
  com esta gerência, visando agilizar a interação.'
