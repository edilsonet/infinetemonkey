text: '5.3.3.2 São consideradas alterações relevantes as previstas no art. 11 da Portaria
  nº 8.676, de 25 de julho de 2022.

  5.3.3.3 Dependendo da complexidade da alteração, o processo poderá retornar a fases anteriores
  ou até mesmo ser indeferido e arquivado compulsoriamente, sendo o requerente formalmente
  comunicado.

  5.3.3.4 Caso as alterações resultem na modificação da classificação do operador aéreo, o
  PSF deve ser ajustado, bem como o planejamento da organização requerente para demonstrar
  cumprimento dos requisitos aplicáveis do RBAC nº 135.'
