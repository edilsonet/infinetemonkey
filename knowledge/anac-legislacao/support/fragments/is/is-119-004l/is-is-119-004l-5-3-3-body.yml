title: Alterações durante o processo de certificação
text: '5.3.3 Alterações durante o processo de certificação

  5.3.3.1 Caso a organização requerente pretenda fazer alterações relevantes nas características
  do processo de certificação em curso, essas deverão ser submetidas à avaliação da Anac através
  de novo FOP 201 e, se aplicável, novo FOP 202.'
