title: Solicitação de informações
text: '5.3.4.1 Solicitação de informações

  5.3.4.1.1 A SPO disponibiliza aos interessados, por meio do endereço eletrônico https://www.gov.br/anac/voe135,
  informações e guias sobre o processo de certificação, bem como sobre programas e manuais
  necessários para a certificação.

  5.3.4.1.2 Caso o interessado, após a leitura da presente IS e dos guias disponibilizados
  pela Anac, ainda possua dúvidas sobre o processo de certificação ou manuais ou programas
  necessários, deve entrar em contato com a Anac por meio dos canais oficiais de comunicação,
  que podem ser acessados por meio do endereço eletrônico https://www.gov.br/anac/taxi-aereo.
  Dentre as opções disponibilizadas, há o agendamento de reunião técnica virtual.

  5.3.4.1.3 Caso o interessado tenha dúvidas sobre sua capacidade de iniciar o processo de
  certificação, ou não tenha entendido de modo pleno os requisitos aplicáveis, poderá solicitar
  esclarecimentos adicionais à Anac por meio dos canais de comunicação oficiais, que poderão
  ser acionados quantas vezes forem necessárias.

  5.3.4.1.4 Caso não persistam dúvidas, o gestor responsável ou o representante legal da organização
  interessada, que estiver devidamente cadastrado no SEI e que possua poderes para peticionar
  em nome da organização requerente, deve encaminhar, por meio do protocolo eletrônico da
  Anac, os formulários FOP 200 e FOP 201.

  5.3.4.1.5 Caso não sejam observadas as condições para protocolo, o pedido será indeferido,
  o processo será compulsoriamente arquivado e o interessado será comunicado sobre a necessidade
  de se familiarizar sobre o processo de certificação.

  5.3.4.1.6 É importante ressaltar que, uma vez solicitada a ROP, o processo de certificação
  está sujeito aos requisitos, procedimentos e prazos regulamentares estabelecidos nesta instrução
  suplementar, no RBAC nº 119 e no RBAC nº 135. Portanto, a organização requerente somente
  deverá solicitar a ROP quando considerar que tem condições de conduzir o processo de certificação
  de maneira adequada, ou seja, que a organização está devidamente estruturada e que os requisitos
  aplicáveis podem ser adequadamente cumpridos e demonstrados à Anac dentro dos prazos previstos.

  5.3.4.1.7 As datas propostas pela organização requerente para a realização da ROP, apresentadas
  no FOP 200, devem ser, no mínimo, 10 (dez) dias após a data do protocolo do FOP 200 na Anac.

  5.3.4.1.8 O FOP 201 possui campos para que sejam informadas as autorizações operacionais
  que a organização requerente pretende obter no processo de certificação. Essas informações
  são essenciais para que o coordenador de certificação e a equipe de certificação possam
  se preparar para a ROP. Informações adicionais sobre autorizações operacionais encontram-se
  na seção 5.2.10 desta IS.

  5.3.4.1.9 O gerente do setor do EsEC designará um coordenador de certificação para conduzir
  o processo de certificação da organização requerente e coordená-lo junto à equipe de certificação.

  5.3.4.1.10 O coordenador de certificação e a equipe verificarão a conformidade dos documentos
  protocolados. Caso haja não-conformidades, a organização requerente será informada pelo
  EsEC, por meio de ofício, sobre as não-conformidades identificadas.

  5.3.4.1.11 A apresentação satisfatória dos documentos protocolados inicia formalmente o
  processo para que uma organização possa obter um COA. O EsEC, por meio de ofício à organização
  requerente, agendará a realização da ROP entre o pessoal de administração requerido da organização
  requerente e o coordenador de certificação, juntamente com a equipe de certificação, em
  local estabelecido pelo EsEC.'
