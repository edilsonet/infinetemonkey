title: Reunião de Orientação Prévia - ROP
text: '5.3.4.2 Reunião de Orientação Prévia - ROP

  5.3.4.2.1 O objetivo da ROP é confirmar as informações fornecidas pela organização requerente
  do COA, além de prover-lhe informações críticas sobre o processo e questões práticas. Devem
  comparecer à ROP o gestor responsável da empresa e demais membros da administração requerida
  indicados no FOP 200. Além disso, esses profissionais devem estar preparados para discutir,
  em termos gerais, os planos e os aspectos específicos da operação pretendida.

  5.3.4.2.2 Caso haja a falta de alguma pessoa da administração requerida, que foi indicada
  no FOP 200, a ROP será cancelada e o processo compulsoriamente arquivado.

  5.3.4.2.3 Recomenda-se que a elaboração das minutas de manuais e programas da organização
  requerente tenha sido finalizada antes da ROP, já tendo sido sanadas todas as dúvidas por
  meio dos canais de comunicação da Anac.

  5.3.4.2.4 A organização requerente receberá, durante a ROP, instruções sobre os manuais,
  programas e documentos que deverão ser apresentados ao longo das 5 fases do processo, sobre
  as inspeções e demonstrações que fazem parte da fase 4 e sobre emolumentos.

  5.3.4.2.5 Caso a organização requerente tenha manifestado interesse em obter alguma das
  autorizações operacionais apresentadas na seção 5.2.10 desta IS, serão fornecidas informações
  sobre o processo para obtenção dessas autorizações, baseadas nas respectivas IS/IAC que
  tratam dos assuntos. Na ausência de IS/IAC publicada sobre alguma autorização operacional
  pretendida, o coordenador de certificação irá informar na ROP detalhes do processo e as
  referências que deverão ser utilizadas.

  5.3.4.2.6 O cronograma de eventos de certificação será discutido e acordado. Os eventos
  significativos serão registrados no FOP 203. O cronograma de eventos deve ser considerado
  para a elaboração do FAI que posteriormente deverá ser submetido em anexo ao FOP 204 para
  o início da fase 2.

  5.3.4.2.6.1 A Anac disponibiliza no endereço eletrônico https://www.gov.br/anac/voe135 os
  prazos de referência do processo de certificação. Ressalta-se que não se constituem prazos
  regulamentares para o final do processo, devendo, portanto, ser encarados pela organização
  requerente apenas como parâmetros de planejamento para a proposição das datas no cronograma
  de eventos de certificação.

  5.3.4.2.7 Caso os representantes da organização não compreendam plenamente o processo de
  certificação, não apresentem um planejamento adequado para cumprir as etapas do processo
  de certificação ou não tenham definido a aeronave a ser utilizada pelo operador, a ROP será
  considerada insatisfatória, ensejando no encerramento compulsório do processo de certificação.

  5.3.4.2.8 A ROP somente será considerada satisfatória se o coordenador de certificação e
  a equipe de certificação estiverem convencidos de que os representantes da organização requerente
  compreenderam plenamente o processo de certificação a ser conduzido pela Anac e suas responsabilidades
  neste processo.

  5.3.4.2.9 Uma ROP bem-sucedida, devidamente registrada no FOP 203 (Relatório consolidado
  da proposta de certificação), é o ato que encerra a fase 1 do processo de certificação.
  A partir deste momento, a organização requerente deverá organizar e, se necessário, revisar
  toda a documentação requerida para a certificação.'
