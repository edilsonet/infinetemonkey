title: 5.3.5.3(j)
text: 'j) outros documentos ou manuais, a critério da organização requerente ou solicitados
  pelo coordenador de certificação do EsEC, durante a ROP.

  5.3.5.4 Caso seja pretendida alguma autorização operacional, conforme apresentado na seção
  5.2.10 desta IS, a organização requerente deve instaurar processo específico para cada uma
  através do FOP 226 e os anexos aplicáveis.

  5.3.5.5 Cada documento que faz parte do sistema de documentos de segurança operacional,
  apresentado na seção 5.2.6, deve ser enviado por meio de FOP 207 específico.'
