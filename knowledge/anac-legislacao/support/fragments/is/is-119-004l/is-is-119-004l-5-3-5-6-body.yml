title: Todo o conjunto de manuais será analisado no processo de certificação inicial.
text: '5.3.5.6 Todo o conjunto de manuais será analisado no processo de certificação inicial.

  5.3.5.7 Caso alguma nova autorização seja solicitada pela organização requerente ou caso
  a Anac considere necessário, a Anac poderá solicitar a apresentação de quaisquer outros
  manuais, programas e documentos ao longo do processo de certificação.

  5.3.5.8 Durante esta fase, os servidores conduzirão uma avaliação de elegibilidade do processo,
  com análise preliminar dos documentos apresentados, com o objetivo de verificar se todos
  os manuais, programas e documentos requeridos foram entregues e se estão no formato requerido
  pelos regulamentos aplicáveis.

  5.3.5.9 Caso haja erros ou omissões, a análise do processo será interrompida até a regularização.
  Caso isso aconteça, poderá haver atrasos significativos no processo de certificação. A organização
  requerente será informada das não-conformidades e pendências verificadas na ocasião da interrupção.

  5.3.5.10 Após o PSF ser considerado satisfatório pela Anac a organização requerente será
  comunicada por meio de ofício a respeito do encerramento da Fase 2 do processo de certificação.'
