title: Fase 2 - Solicitação Formal
text: '5.3.5 Fase 2 - Solicitação Formal

  5.3.5.1 O Pacote de Solicitação Formal (PSF) deve ser protocolados na Anac em até 30 dias
  após o encerramento da Fase 1 (realização de ROP bem-sucedida, devidamente registrada em
  FOP 203).

  5.3.5.2 Não são aceitos pedidos de dilação de prazo para a apresentação do PSF e, caso o
  prazo não seja cumprido, haverá o encerramento compulsório do processo de certificação.'
