title: Fase 3 - Avaliação de documentos
text: '5.3.6 Fase 3 - Avaliação de documentos

  5.3.6.1 Depois da aceitação do PSF, os servidores designados para compor a equipe de certificação
  darão início a uma análise detalhada de todos os manuais, programas e documentos exigidos
  pela Anac e que foram apresentados pela organização requerente do COA juntamente com o FOP
  204.

  5.3.6.2 A organização requerente será devidamente notificada, por meio de FOP 224 ou ofício,
  caso um manual, programa ou documento seja considerado incompleto ou deficiente ou, ainda,
  se for detectada alguma não-conformidade com relação à legislação aplicável, como regulamentos
  e instruções suplementares, e aos demais documentos de referência, como avaliações operacionais
  e manuais de operação de aeronaves. As devidas correções devem ser enviadas pela organização
  requerente ao setor da Anac emissor do documento com as deficiências ou não-conformidades
  por meio do FOP 225.

  5.3.6.3 O prazo máximo de resposta ao FOP 224 ou ofício enviado pela Anac é de 30 dias,
  a contar do recebimento do documento pela organização requerente, devendo ser respeitado
  o estabelecido pela seção 5.2.12 desta IS.

  5.3.6.4 Após a apresentação dos manuais no pacote de solicitação formal, quaisquer modificações
  ou substituições nos manuais e/ou documentos terão impacto direto no andamento do processo
  de certificação. Orientações sobre alterações ao longo do processo encontram-se disponíveis
  na seção 5.3.3 desta IS.

  5.3.6.5 Se os manuais, programas e documentos que compõem o PSF forem considerados satisfatórios,
  eles serão aprovados ou aceitos, conforme o caso, por meio de FOP 211 ou FOP 212, emitido
  separadamente para cada manual, programa ou documento avaliado, à medida que os servidores
  da equipe de certificação encarregados da análise do material forem encerrando seus trabalhos
  de avaliação. No caso do PTO, a aprovação será considerada inicial até que seja concluída
  a demonstração da eficácia de todos os treinamentos, quando será emitido o FOP 211 de aprovação
  final, o que poderá ocorrer mesmo após o término do processo de certificação.

  5.3.6.6 Após a aprovação inicial do PTO, a organização requerente deverá seguir os procedimentos
  da IS nº 61-007 para solicitar o cadastro no sistema SISHAB, ou sistema que o substituir,
  para que o PTO aprovado seja cadastrado. A organização poderá então notificar os módulos
  e currículos para que sejam garantidos o treinamento e a qualificação requerida pelo RBAC
  nº 135.

  5.3.6.7 Os treinamentos devem ser notificados e coordenados com o EsEC para que possam ser
  acompanhados como parte das inspeções e demonstrações previstas para a Fase 4 do processo
  de certificação, conforme a seção 5.3.7 desta IS. Orientações adicionais sobre a formação
  do quadro inicial de tripulação do operador aéreo estão disponíveis na seção 5.2.13 desta
  IS.

  5.3.6.8 A aceitação ou aprovação concedida individualmente ao manual, programa ou documento
  analisado não implica em aceitação ou aprovação final de todo, ou de parte, do PSF, tampouco
  é garantia de que a organização requerente receberá seu COA.

  5.3.6.9 Após as avaliações realizadas nesta fase, a declaração de conformidade inicial evolui
  para a declaração de conformidade final. Esta última deve estar aprovada ao final da fase
  3, pois seu objetivo é o de garantir que cada requisito regulamentar aplicável à operação
  pretendida foi adequadamente tratado pelos manuais, programas e documentos apresentados
  pela organização requerente do COA.

  5.3.6.10 Após a aceitação ou aprovação de todos os documentos que compõem o PSF, o EsEC
  informará o encerramento da fase 3 do processo de certificação à organização requerente
  por meio de ofício.

  5.3.6.11 Com isso, a organização requerente do COA deverá se preparar para proceder às demonstrações
  requeridas, segundo os planejamentos apresentados, nas datas acordadas ao longo do processo
  de certificação.'
