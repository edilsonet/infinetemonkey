section_title: 'O profissional responsável por produzir o relatório deve ter as seguintes
  qualificações:'
subsection_id: c
cite: 5.3.7.11.3(c)
title: 5.3.7.11.3(c)
text: 'c) conhecimento dos requisitos de manutenção do modelo particular da aeronave a ser
  adicionada à EO.

  5.3.7.11.4 O relatório deve ser aprovado pelo diretor ou gerente de manutenção e citar evidências
  das verificações realizadas para suportar suas conclusões. Recomenda-se que não-conformidades
  encontradas durante a elaboração do relatório sejam corrigidas antes de o relatório ser
  submetido à Anac.

  5.3.7.11.5 Juntamente com o relatório, deve ser apresentado um FOP 216 preenchido com a
  data a partir da qual o operador estará preparado e disponível para receber auditoria.

  5.3.7.11.6 Na data proposta de auditoria, a aeronave deve estar regularizada no Registro
  Aeronáutico Brasileiro - RAB, em nome deste operador e compatível com o serviço pretendido.
  O operador deve atentar que, durante a visita técnica, a apresentação de aeronave mantida
  em condições não adequadas quanto a aeronavegabilidade continuada pode ocasionar atrasos
  no presente processo, assim como gerar providências administrativas cabíveis nos termos
  da Resolução Anac nº 762/2024. É importante que, antes de receber a visita da equipe técnica
  da Anac, o operador verifique o estado geral de sua aeronave e componentes, assim como a
  adequação dos registros referentes ao equipamento, tomando como base os checklists de vistoria
  da Anac.

  5.3.7.12 As demonstrações devem representar, no cenário mais próximo possível da realidade,
  as atividades que o operador aéreo poderá realizar após a emissão do COA. Estas demonstrações
  poderão ser avaliadas “in loco”, à distância ou documentalmente pelos servidores da Anac
  designados para observá-las, tanto nas áreas de operações, quanto nas áreas de manutenção
  da organização requerente.

  5.3.7.13 Durante essas demonstrações e inspeções, os servidores da Anac avaliarão a efetividade
  das políticas, métodos, procedimentos e instruções aplicáveis conforme descrito nos manuais,
  programas e documentos apresentados para a certificação.

  5.3.7.14 Nesta fase, os servidores darão ênfase à avaliação da efetividade do sistema de
  gerenciamento adotado. As deficiências encontradas serão levadas ao conhecimento da organização
  requerente e ações corretivas devem ser tomadas.

  5.3.7.15 Com o objetivo de aferir o conhecimento do pessoal de administração requerido sobre
  a legislação aplicável e sobre se o sistema de documentos de segurança operacional da organização
  requerente satisfaz os requisitos regulamentares, todo o pessoal de administração requerido
  da organização requerente deve estar disponível para responder aos questionamentos da equipe
  de certificação conforme dias e horários previamente agendados.

  5.3.7.16 A indisponibilidade de algum dos membros da administração requerida poderá ser
  motivo suficiente para o cancelamento de inspeção e para o agendamento de nova data.

  5.3.7.17 Caso a organização requerente falhe em demonstrar o atendimento ao parágrafo 119.69(d)(2)
  do RBAC nº 119, a critério do EsEC, poderá ser solicitada nova avaliação do(s) indivíduo(s)
  em uma data posterior, a troca do pessoal de administração indicado, ou a revisão de manuais
  eventualmente já aceitos ou aprovados.

  5.3.7.18 A critério do EsEC, atividades de demonstrações e inspeções podem ser antecipadas
  antes do encerramento da fase 3, desde que os pré-requisitos técnicos correspondentes a
  essas atividades tenham sido completamente atendidos na respectiva fase 3.

  5.3.7.19 Abaixo estão listadas as demonstrações e inspeções requeridas para o cumprimento
  da fase 4 do processo de certificação e que deverão ser solicitadas pela organização requerente
  ao EsEC:'
