section_title: 'O profissional responsável por produzir o relatório deve ter as seguintes
  qualificações:'
subsection_id: i
cite: 5.3.7.11.3(i)
title: 5.3.7.11.3(i)
text: 'i) voo de avaliação operacional, conforme requerido pela seção 119.34 do RBAC nº 119.
  Essa atividade somente deve ser realizada após a finalização de todas as demais demonstrações
  e inspeções requeridas, exceto exame em rota de pilotos.

  5.3.7.20 Como resultado das inspeções realizadas, algumas deficiências e não-conformidades
  poderão ser verificadas, e serão comunicadas à organização requerente por meio de FOP 209.
  As correções deverão ser apresentadas por meio de FOP 223, e eventualmente será requerida
  nova demonstração para comprovação da efetividade das correções.'
