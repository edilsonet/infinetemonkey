section_id: 5.3.7.2
section_title: 'A fase de inspeções e demonstrações poderá ser composta por 3 etapas distintas:'
subsection_id: e
cite: 5.3.7.2(e)
title: 5.3.7.2(e)
text: 'e) desempenho da organização requerente ao longo do processo de certificação.

  5.3.7.4 Após a determinação, a Anac informará à organização requerente sobre as etapas aplicáveis,
  bem como as evidências que serão solicitadas durante a fase de inspeções e demonstrações.

  5.3.7.5 Para a etapa de demonstrações documentais, a empresa requerente será solicitada
  a enviar evidências relacionadas a instalações da empresa, aeródromo onde está baseada,
  aeronaves, estrutura e processos para controle operacional, entre outros.

  5.3.7.6 Para a etapa de demonstrações operacionais e entrevistas por videoconferência, a
  empresa requerente será solicitada a informar datas disponíveis para agendamento de videoconferência
  com a participação do pessoal de administração requerido da empresa. Nessa oportunidade,
  serão realizadas entrevistas com o objetivo de realizar verificações adicionais sobre o
  cumprimento de requisitos previstos na legislação aplicável.

  5.3.7.7 A critério da Anac, poderão ser definidos procedimentos para o agendamento de demonstração
  real da operação, na modalidade à distância, por plataforma de videoconferência.

  5.3.7.8 Para a etapa de inspeções e demonstrações presenciais, a empresa requerente será
  solicitada a inform2ar datas disponíveis para agendamento de uma inspeção in loco nas dependências
  do operador, ou nos locais de operação, dependendo das características da empresa.

  5.3.7.9 O agendamento das inspeções e demonstrações, remotas ou presenciais, se dará de
  acordo com a disponibilidade e conveniência da organização requerente e da equipe de servidores
  da Anac.

  5.3.7.10 A organização requerente, após coordenação com a GTOA e com a GTCE, deve protocolar
  as solicitações de demonstrações e inspeções, separadamente para cada uma destas, por meio
  de FOP 216, FOP 217 e seus anexos.'
