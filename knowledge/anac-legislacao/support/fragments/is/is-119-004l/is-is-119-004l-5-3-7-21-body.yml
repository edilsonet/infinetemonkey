text: '5.3.7.21 Todas as deficiências e não-conformidades deverão estar corrigidas para permitir
  a aprovação na respectiva inspeção na qual foram identificadas.

  5.3.7.22 Os currículos de treinamento acompanhados durante a Fase 4 do processo de certificação,
  e que forem considerados satisfatórios pela Anac, receberão a sua aprovação final, com a
  emissão de um novo FOP 211 para o PTO aprovado da organização requerente.

  5.3.7.23 Uma organização requerente de um COA pode requerer à Anac sua certificação como
  organização de manutenção aprovada, concomitantemente com a obtenção de seu COA. Neste caso,
  a organização requerente deverá atender aos dois processos de certificação, que serão conduzidos
  pela Anac por equipes distintas de servidores, de forma que ambos estejam na fase de demonstrações
  e inspeções ao mesmo tempo. Isso ocorre porque os voos de avaliação operacional exigem que
  a organização requerente demonstre à Anac todas as operações de voo e de solo relacionadas.
  Portanto, o requerente deve demonstrar o uso de sua organização de manutenção aprovada (oficina
  certificada de acordo com os requisitos do RBAC nº 145), para assegurar a correspondência
  entre os procedimentos previstos em seu manual geral de manutenção para controle de manutenção
  e para execução de manutenção.

  5.3.7.24 Somente depois de ter sido aprovada em todas as demonstrações e inspeções a que
  foi submetida, tendo solucionado todas as eventuais não conformidades observadas, uma organização
  requerente de um COA terá demonstrado satisfatoriamente ao EsEC sua capacidade de operar
  com segurança conforme requerido.

  5.3.7.25 O EsEC informará essa condição à organização requerente por meio de ofício, comunicando
  formalmente o encerramento da fase 4 do processo de certificação e solicitando o envio dos
  dados de pagamento ou comprovante de pagamento da TFAC aplicável à certificação. Informações
  adicionais encontram-se na seção 5.2.5 desta IS.'
