title: Fase 5 - Certificação
text: '5.3.8 Fase 5 - Certificação

  5.3.8.1 O requerente deve apresentar os dados de pagamento ou comprovante de pagamento da
  TFAC referente à Emissão de Certificado de Operador Aéreo. Informações adicionais encontram-se
  na seção 5.2.5 desta IS.

  5.3.8.2 Após as quatro fases anteriores terem sido concluídas, o EsEC emitirá o COA e aprovará
  as EO da nova empresa de transporte aéreo com todas as autorizações, aprovações, limitações
  e isenções concedidas.

  5.3.8.3 Caso a organização requerente tenha optado por obter a certificação cumprindo requisitos
  inicialmente não aplicáveis à sua operação, conforme o parágrafo 5.2.6.17.3d) desta IS,
  uma observação deverá ser inclusa nas EO listando esses requisitos e determinando a obrigatoriedade
  de seu cumprimento.

  5.3.8.4 Após emissão do COA e das EO, a Anac procederá à verificação dos demais requisitos
  necessários para exploração dos serviços aéreos previstos na Resolução nº 659, de 2 de fevereiro
  de 2022, ou norma que venha a substituí-la. A exploração do serviço aéreo somente poderá
  ser iniciada a partir da publicação de Portaria dando a publicidade do cumprimento dos requisitos
  desta Resolução.

  5.3.8.5 Com a publicação de portaria no Diário Oficial da União referente à emissão do COA,
  e com a entrega do COA e das EO à organização requerente, o processo de certificação estará
  formalmente encerrado.

