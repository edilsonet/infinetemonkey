title: O operador deve submeter documentos e processos com solicitações separadas e independentes
  para cada tipo de alteração de COA e EO.
text: '5.4.1.5 O operador deve submeter documentos e processos com solicitações separadas
  e independentes para cada tipo de alteração de COA e EO.

  5.4.1.6 Para cada uma das alterações propostas, é necessário que a empresa solicitante elabore
  um estudo abrangente acerca do planejamento e impacto da proposta, por meio do FAI, devidamente
  preenchido, levando em consideração as informações apresentadas no parágrafo 5.2.4.4 desta
  IS. No caso de haver múltiplas alterações o FAI deve constar no processo principal e deve
  relacionar cada um dos outros processos.

  5.4.1.7 Uma alteração do COA, das EO, ou de ambos, com previsão nesta Instrução Suplementar,
  somente entrará em vigor após a emissão da revisão do COA e/ou EO, contendo a referida alteração.'
