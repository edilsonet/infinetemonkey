cite: 5.4.1.8
title: Qualquer alteração no COA implica também em alteração nas EO.
text: '5.4.1.8 Qualquer alteração no COA implica também em alteração nas EO.

  5.4.1.9 Para os processos de alteração do COA e das EO, de acordo com as orientações contidas
  na seção 5.2.5 desta IS, pode ser aplicável a exigência de TFAC. Caso aplicável, devem ser
  apresentados dados de pagamento ou comprovante de pagamento da TFAC, conforme os procedimentos
  e prazos detalhados nas mesmas orientações.

  5.4.1.10 Caso a classificação por grupo de complexidade da empresa seja impactada com a
  alteração, conforme as definições desta IS, as TFAC apresentadas juntamente com a proposta
  deverão corresponder ao grupo em que a empresa estará classificada após a alteração.

  5.4.1.11 Caso detentor de certificado deixe de possuir direitos de uso e operação sobre
  pelo menos uma aeronave de um determinado modelo e/ou com determinada autorização operacional
  ou de manutenção, por mais de 30 (trinta) dias, deverá solicitar a Anac a revisão de suas
  EO para retirada do modelo de aeronave das suas EO, ou para atualização das autorizações
  operacionais e/ou de manutenção afetadas.

  5.4.1.12 As revisões e elaborações de manuais e programas ou qualquer documentação requerida,
  como também os procedimentos operacionais, devem seguir as orientações da seção 5.2.6 desta
  IS, salvo se de outra forma especificado nesta seção.

  5.4.1.13 A critério da Anac, pode ser exigida a realização de demonstrações, inspeções e
  reuniões para esclarecimento e ajustes do processo de alteração do COA e das EO e para avaliação
  e validação dos procedimentos e conhecimentos e envolvimento do pessoal de administração
  requerido.

  5.4.1.14 Durante a elaboração da revisão do sistema de documentos de segurança operacional,
  motivada pela alteração do COA ou das EO, caso o operador aéreo detecte alguma não conformidade
  em material que já tenha sido aceito ou aprovado pela Anac e que esteja vigente, o operador
  aéreo pode solicitar a análise da correção em processo apartado ao de alteração do COA ou
  das EO.

  5.4.1.15 Caso a Anac, durante a análise do sistema de documentos de segurança operacional,
  motivada pela alteração do COA ou das EO, observe alguma não conformidade em material que
  já tenha sido aceito ou aprovado e que esteja vigente, realizará a instauração de processo
  específico apartado para o tratamento da correção.

  5.4.1.16 A instauração de processo apartado e específico para o tratamento de correções
  de materiais aceitos ou aprovados e que estejam vigentes, conforme apresentado nos parágrafos
  5.4.1.14 e 5.4.1.15 desta IS, visa uma maior celeridade na mitigação de eventuais riscos
  operacionais bem como a redução de impactos em processos de alteração do COA ou das EO.'
