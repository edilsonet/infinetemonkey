title: Disposições Gerais
text: '5.4.1 Disposições Gerais

  5.4.1.1 O processo de alteração do COA e das EO é similar ao processo de certificação de
  empresa de transporte aéreo, guardadas as proporções, podendo ser menos complexo e demorado
  dependendo do tipo de alteração pretendida. Esta seção apresenta os meios de cumprimento
  aceitáveis para os parágrafos 119.41(a)(2) e (c) do RBAC nº 119, no que se refere à solicitação
  de alteração do COA, e 119.51(a)(2) e (c) do RBAC nº 119, no que se refere à solicitação
  de alteração das EO.

  5.4.1.2 Toda solicitação de alteração de COA e das EO deve ser encaminhada à GTCE, por meio
  de FOP 219, com a documentação necessária em anexo, pelo menos 45 (quarenta e cinco) dias
  antes da data pretendida da entrada em vigor da alteração - com exceção da alteração de
  endereço da sede administrativa, da base principal de operações e da base principal de manutenção,
  para as quais se aplicam o prazo de 90 (noventa) dias, conforme o parágrafo 119.47(b) do
  RBAC nº 119. Somente após a distribuição do processo aos seus respectivos setores, haverá
  interação diretamente da empresa com o setor da área específica.

  5.4.1.3 Recomenda-se que, dependendo da extensão e da complexidade das alterações propostas,
  o FOP 219 seja apresentado com uma maior antecedência, a critério do operador, de forma
  a aumentar a probabilidade de conclusão no prazo solicitado.

  5.4.1.4 O prazo de notificação estabelecido no parágrafo 119.69(e)(3) do RBAC nº 119, de
  10 (dez) dias após a alteração ou vaga aberta em qualquer das posições de administração
  requeridas, se aplica somente no caso de alterações não programadas. Nas demais situações,
  o operador deve enviar a solicitação de alteração de pessoal de administração com a antecedência
  requerida para alteração das EO.'
