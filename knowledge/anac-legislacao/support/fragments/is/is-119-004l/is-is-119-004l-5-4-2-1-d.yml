section_id: 5.4.2.1
section_title: 'Para a alteração de razão social e/ou nome comercial (nome fantasia), a seguinte
  documentação é necessária:'
subsection_id: d
cite: 5.4.2.1(d)
title: 5.4.2.1(d)
text: 'd) proposta de revisão de documentos que compõem o sistema de documentos de segurança
  operacional do operador, conforme necessário. Cada documento alterado deve ser apresentado
  por meio de FOP 207 específico. É requerida ao menos a revisão do MGO.

  5.4.2.2 Conforme a seção 119.9 do RBAC nº 119, o nome comercial deve ser legivelmente escrito
  nas aeronaves operadas segundo o RBAC nº 135, de forma a ser claramente visível e compreensível
  pelo lado de fora da aeronave por uma pessoa no solo, enquanto a aeronave está também em
  solo. Portanto, alterações no nome comercial podem requerer uma alteração do nome escrito
  nas aeronaves.'
