text: 'd) FOP 216 solicitando inspeções e demonstrações na nova base. O FOP 216 deve ser encaminhado
  após a documentação enviada ter sido considerada satisfatória e no momento em que o detentor
  de certificado estiver preparado para receber a equipe de inspeção da Anac.

  5.4.3.2 Somente há obrigação de o detentor de certificado possuir listadas em suas EO bases
  secundárias de operações caso haja operação regular no aeródromo, ou a empresa execute atividades
  relacionadas a controle operacional na localidade.

  5.4.3.3 Para o caso de aeródromo utilizado em operações regulares, em adição à documentação
  listada no parágrafo 5.4.3.1 desta IS, a seguinte documentação é necessária:'
