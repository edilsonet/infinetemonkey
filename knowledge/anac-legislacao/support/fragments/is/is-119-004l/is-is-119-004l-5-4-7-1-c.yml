section_title: 'Para a inclusão de novo modelo de aeronave nas EO, a seguinte documentação
  é necessária:'
subsection_id: c
cite: 5.4.7.1(c)
title: 5.4.7.1(c)
text: c) proposta de revisão de documentos que compõem o sistema de documentos de segurança
  operacional, conforme necessário. Cada documento alterado deve ser apresentado por meio
  de FOP 207 específico. Por se tratar de um novo modelo, poderá ser necessário que o detentor
  de certificado revise todos os manuais e programas que compõem o sistema de manuais da empresa,
  requerido pela seção 135.21 do RBAC nº 135;
