text: '5.4.7.4 Caso seja pretendida a inclusão de autorizações operacionais, tais solicitações
  devem ser submetidas conforme a seção 5.4.8 desta IS.

  5.4.7.5 Até a conclusão do processo de inclusão de modelo de aeronave, salvo parecer desfavorável
  de algum setor envolvido, o operador pode utilizar a aeronave em operações não comerciais,
  nos termos da legislação em vigor.

  Nota: caso o modelo de aeronave a ser incluído seja um modelo de aeronave já presente nas
  Especificações Operativas da empresa, conforme a Especificação de Tipo (TCDS - Type Certificate
  Data Sheet) aplicável, não é necessário solicitar a inclusão do modelo à Anac, cabendo ao
  operador adicionar o modelo por meio de seu gerenciamento de frota. O TCDS pode ser verificado
  no site da Anac, disponível em https://sistemas.anac.gov.br/certificacao/Produtos/Especificacao.asp.
  Se os modelos estão listados em uma mesma linha, identificada pelo mesmo numeral (geralmente
  um algarismo romano), eles são considerados um mesmo modelo para os efeitos de inclusão
  de novo modelo de aeronave. Caso o TCDS não esteja disponível no site da Anac, buscar as
  informações junto à autoridade de aviação civil do Estado detentor do projeto.'
