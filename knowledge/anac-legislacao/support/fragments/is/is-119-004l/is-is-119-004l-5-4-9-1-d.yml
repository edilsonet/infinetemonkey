section_title: 'Para a inclusão do Programa de Manutenção de Aeronavegabilidade Continuada
  (PMAC), a seguinte documentação é necessária:'
subsection_id: d
cite: 5.4.9.1(d)
title: 5.4.9.1(d)
text: d) proposta de revisão de documentos que compõem o sistema de documentos de segurança
  operacional, conforme indicado no parágrafo 5.2.11.1.3 desta IS e conforme aplicável. Manuais
  criados ou revisados referentes a autorização solicitada devem ser enviados em processos
  separados, utilizando seus respectivos tipos processuais, e ter seus números de protocolo
  indicados no FOP 219.
