subsection_id: b
cite: 5.5.2.3(b)
title: 5.5.2.3(b)
text: 'b) ausência de tripulante para o modelo de aeronave constante em EO.

  5.5.2.4 A Anac poderá suspender o COA da empresa de transporte aéreo em decorrência de processo
  sancionatório instaurado nos termos da Resolução Anac nº 761/2024.'
