text: '5.5.3.3 A critério da GTCE, ouvidos os setores envolvidos, pode ser solicitada a realização
  de uma reunião para esclarecimento e ajustes do processo.

  5.5.3.4 O processo de revogação da suspensão do COA será conduzido pela GTCE de acordo com
  o processo de 5 fases apresentado nesta IS, dependendo da complexidade do processo de revogação
  da suspensão.

  Nota: o processo de revogação da suspensão do COA pode ser tanto a comprovação da solução
  da não-conformidade como uma revisão completa do processo de certificação.

  5.5.3.5 A revogação da suspensão do COA, caso aceita pelo EsEC, será informada à empresa
  de transporte aéreo por meio do FOP 221, complementado pelas respectivas EO, quando aplicável.'
