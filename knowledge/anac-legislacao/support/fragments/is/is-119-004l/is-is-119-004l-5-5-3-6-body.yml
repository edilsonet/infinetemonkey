title: A Anac dará publicidade da decisão no Diário Oficial da União.
text: '5.5.3.6 A Anac dará publicidade da decisão no Diário Oficial da União.

  5.5.3.7 No caso de suspensão de COA em decorrência de processo sancionatório, conforme o
  parágrafo 5.5.2.4 desta IS, a suspensão se dará por período definido, não sendo necessária
  a solicitação de revogação da suspensão. Ao final do período informado de vigência da suspensão
  o operador poderá retomar as suas operações comerciais segundo o RBAC nº 135.

  5.6 Revogação do COA'
