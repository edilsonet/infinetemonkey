text: 'a) demonstração da correção das não-conformidades, caso o COA tenha sido suspenso pela
  Anac por ocorrência de não-conformidade.

  5.5.3.2 Caso seja requerido pela Anac, ou a empresa pretenda, alterar o COA, as EO e/ou
  seus manuais, simultaneamente ao processo de revogação de suspensão do COA, deve seguir
  as instruções das seções 5.2.6 ou 5.4 desta IS, conforme aplicável.'
