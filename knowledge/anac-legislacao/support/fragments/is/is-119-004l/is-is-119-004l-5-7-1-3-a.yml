title: 5.7.1.3(a)
text: 'a) 119.69 do RBAC nº 119: a Anac pode aprovar posições e números de posições diferentes
  daquelas listadas na seção 119.69, se o detentor ou requerente do certificado demonstrar
  que ele pode realizar a operação com alto grau de segurança sob a direção de um número menor
  ou diferentes categorias de pessoal de administração, considerando as características de
  operação envolvida;, número e tipo de aeronaves envolvidas; e a área de operações;'
