title: 5.7.1.3(b)
text: 'b) 135.21 do RBAC nº 135: o detentor de certificado deve preparar e submeter à aceitação
  prévia da Anac um sistema de documentos de segurança operacional, na forma de um manual
  geral da empresa, estabelecendo procedimentos e políticas. Este manual deve ser utilizado
  pelo pessoal de voo, de solo e de manutenção do detentor de certificado, na condução de
  suas operações. No entanto, a Anac pode autorizar desvios com relação ao sistema de documentos
  de segurança operacional se for considerado que, em função do tamanho limitado das operações,
  o manual, ou parte dele, não é necessário para a orientação do pessoal de voo, de solo e
  de manutenção;'
