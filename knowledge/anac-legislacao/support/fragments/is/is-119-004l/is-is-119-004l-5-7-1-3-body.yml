text: '5.7.1.3 A Anac dará publicidade da decisão no Diário Oficial da União.

  Nota: um COA cassado não pode ser restaurado. Se a organização desejar operar novamente,
  deverá iniciar um novo processo de certificação.


  DIFERENÇAS NO PROCESSO DE CERTIFICAÇÃO PARA OPERADORES SIMPLES

  6.1 Essa seção traz as diferenças no processo de certificação, os desvios previstos e a
  extensão dos mesmos que são consideradas aceitáveis, bem como as limitações pertinentes
  para organizações requerentes ou detentores de certificado classificados como Operadores
  Simples, conforme definido nesta IS.

  6.2 Os desvios possíveis para Operadores Simples são os previstos nas seguintes seções:'
