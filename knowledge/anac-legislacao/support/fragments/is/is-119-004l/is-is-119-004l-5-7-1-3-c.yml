cite: 5.7.1.3(c)
title: 5.7.1.3(c)
text: 'c) 135.29 do RBAC nº 135: o detentor de certificado deve estabelecer e manter um SGSO.
  Entretanto, a Anac poderá autorizar desvios se considerar que, por conta de limitações de
  tamanho e complexidade das operações do detentor de certificado, os níveis de segurança
  operacional serão mantidos em níveis aceitáveis.'
