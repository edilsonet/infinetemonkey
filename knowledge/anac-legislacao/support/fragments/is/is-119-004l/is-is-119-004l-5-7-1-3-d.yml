title: 5.7.1.3(d)
text: 'd) 135.341 do RBAC nº 135: O detentor de certificado deve estabelecer e manter um programa
  aprovado de treinamento de piloto e o detentor de certificado que utilize comissários deve
  estabelecer e manter um programa de treinamento aprovado de comissário, que sejam apropriados
  para as operações em que cada piloto e cada comissário forem envolvidos. Os programas devem
  garantir que os pilotos e comissários sejam adequadamente treinados para atender aos aplicáveis
  requisitos de conhecimento e de prática requeridos pelas seções 135.293 a 135.301. Entretanto,
  a Anac poderá autorizar desvios desta seção se considerar que, por conta de limitações de
  tamanho e complexidade das operações do detentor de certificado, os níveis de segurança
  operacional serão mantidos em níveis aceitáveis; e'
