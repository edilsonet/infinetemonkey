title: 5.7.1.3(e)
text: 'e) 135.343 do RBAC nº 135: Um detentor de certificado somente pode utilizar uma pessoa
  e uma pessoa somente pode trabalhar como tripulante em operação segundo este Regulamento
  se esse tripulante tiver completado, dentro dos 12 meses calendáricos que precedem essa
  operação, as apropriadas fases do programa de treinamento inicial ou periódico estabelecido
  para o tipo de função que a pessoa vai executar. Essa seção não se aplica ao operador para
  o qual a Anac tenha aprovado desvios à seção 135. 341 deste regulamento, que dispensem a
  apresentação e obtenção de aprovação do programa de treinamento.

  6.3 Desvios com relação ao sistema de documentos de segurança operacional

  6.3.1 Organizações requerentes ou detentores de certificado classificados como Operadores
  Simples devem apresentar sistema de manuais e de documentos de segurança operacional, conforme
  a seção 135.21 do RBAC nº 135. Entretanto, os manuais e documentos são simplificados.'
