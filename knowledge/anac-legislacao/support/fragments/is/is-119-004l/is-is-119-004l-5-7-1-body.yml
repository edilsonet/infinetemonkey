text: '5.7.1 Cassação do COA por parte da Anac

  5.7.1.1 A Anac poderá cassar o COA de uma empresa de transporte aéreo, em decorrência de
  processo sancionatório instaurado nos termos da Resolução Anac nº 761/2024.'
