text: '6.4.4 Outros tipos de estrutura administrativa podem ser aprovados, desde que haja
  justificativa por parte dos requerentes.

  6.5 Desvios com relação ao SGSO

  6.5.1 Organizações requerentes ou detentores de certificado classificados como Operadores
  Simples estão dispensados de estabelecer e manter um SGSO conforme requerido pela seção
  135.29 do RBAC nº 135.'
