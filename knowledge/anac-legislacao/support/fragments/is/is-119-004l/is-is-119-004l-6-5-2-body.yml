text: '6.5.2 Tais organizações estão dispensadas de possuir em seu quadro de administração
  o gerente ou diretor de segurança operacional e de apresentar um MGSO.

  6.5.3 Mesmo assim, o detentor de certificado é responsável pela garantia da segurança operacional
  da sua organização. Em última análise o gestor responsável é o responsável final e a pessoa
  competente para tomar as decisões que permitam ao detentor de certificado manter a sua operação
  dentro dos níveis aceitáveis de segurança operacional.

  6.5.4 Identificar perigos, avaliar riscos, aplicar medidas corretivas e preventivas, bem
  como documentar e registrar as ações de aprimoramento da segurança operacional e disseminação
  de informações relevantes devem ser preocupações constantes dos detentores de certificado.

  6.5.5 O comprometimento da alta direção e responsabilidade primária acerca da segurança
  operacional deverão ser registrados na Declaração de Conformidade de organizações requerentes
  ou detentores de certificado. A pessoa responsável pela manutenção da segurança operacional
  deverá ser o gestor responsável ou outra pessoa designada por ele, cujo nome deverá constar
  na declaração de conformidade.

  6.5.6 Organizações requerentes ou detentores de certificado deverão desenvolver e descrever
  em sua declaração de conformidade os processos e ferramentas, adequadas e compatíveis com
  a sua realidade operacional, com relação aos seguintes assuntos:'
