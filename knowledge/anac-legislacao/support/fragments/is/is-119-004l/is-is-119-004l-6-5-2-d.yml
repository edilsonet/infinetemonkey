title: 6.5.2(d)
text: 'd) promoção da segurança operacional.

  6.5.7 Para elaboração dos procedimentos listados acima as organizações requerentes ou detentores
  de certificado poderão utilizar a IS nº 119-002 como referência.

  6.6 Desvios com relação ao programa de treinamento operacional

  6.6.1 Organizações requerentes ou detentores de certificado classificados como Operadores
  Simples devem apresentar um programa de treinamento conforme previsto na seção 135.341 do
  RBAC nº 135 e devem qualificar seus tripulantes de acordo com o programa aprovado, conforme
  previsto na seção 135.343 do RBAC nº 135.'
