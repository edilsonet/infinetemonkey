section_id: 6.6.2
section_title: 'O programa de treinamento operacional deve conter os seguintes segmentos de
  currículo:'
subsection_id: e
cite: 6.6.2(e)
title: 6.6.2(e)
text: 'e) treinamentos especiais, de acordo com as autorizações operacionais constantes nas
  EO.

  6.6.3 Para esses segmentos de currículo, o programa de treinamento operacional deve ser
  desenvolvido normalmente, conforme as IS aplicáveis. Da mesma forma, o processo de aprovação
  do programa de treinamento operacional deve ser conduzido normalmente.

  6.6.4 Para os treinamentos de solo e de voo (em aeronave e/ou simulador), específico para
  as aeronaves operadas, devem ser indicados quais detentores de COA pelo RBAC nº 135 ou CTAC
  certificados pelo RBAC nº 142 pretende-se utilizar como provedores de treinamento, conforme
  previsto na seção 135.324 do RBAC nº 135.

  6.6.5 Dessa maneira, Operadores Simples não podem obter aprovação do PTO nos currículos
  de solo e de voo. Mesmo assim, devem demonstrar que tiveram acesso aos currículos de treinamento
  aprovados pela Anac de detentores de COA pelo RBAC nº 135 ou CTAC, e que realizaram análise
  de pertinência, qualidade e aplicabilidade do programa de treinamento às suas aeronaves
  e características operacionais.

  6.6.6 Os requisitos de tripulantes e de exames das subpartes E e G do RBAC nº 135 continuam
  aplicáveis com relação a periodicidade e escopo de exames, experiência recente e demais
  qualificações e requisitos de tripulantes.

  6.7 Operadores aéreos classificados como Operadores Simples

  6.7.1 Os processos de certificação inicial, de alteração da certificação e das autorizações
  de organizações requerentes ou detentores de certificado classificados como Operadores Simples
  seguirá os procedimentos descritos nas seções 5.3 e 5.4 desta IS, com as especificidades
  descritas a seguir.

  6.7.2 Detentores de certificado que alterarem suas características de forma a se enquadrar
  em um grupo mais complexo deverão informar a Anac e solicitar alteração de EO para inclusão
  da nova classificação e das novas características. Durante o processo de alteração de EO,
  o detentor de certificado deverá demonstrar cumprimento dos requisitos aplicáveis ao novo
  grupo.

  6.7.3 Detentores de certificado que alterarem suas características de forma a se enquadrar
  em um grupo menos complexo deverão informar a Anac e solicitar alteração de EO para inclusão
  da nova classificação e das novas características. O detentor de certificado somente poderá
  fazer uso dos desvios previstos para o novo grupo, a partir da emissão da revisão das EO
  contendo tal informação.

  6.7.4 Detentores de certificado classificados como Operadores Simples não terão prerrogativas
  para realização de manutenção sob o COA emitido pelo RBAC nº 119. Dessa maneira, deverão
  utilizar os serviços de Organizações de Manutenção (OM) devidamente certificadas de acordo
  com o RBAC nº 145, com capacidades compatíveis com os tipos de serviço e modelo de aeronave.'
