title: Fase 1 - Solicitação prévia
text: '6.7.5 Fase 1 - Solicitação prévia

  6.7.5.1 Nesta fase, a organização requerente já deve declarar que pretende obter um COA
  para operação conforme as definições e limitações para um Operador Simples.

  6.7.5.2 O formulário FOP 201 enviado já deve incluir o número de pilotos que a organização
  requerente pretende contratar, bem como as operações que deseja realizar, dentro das características
  do grupo em que se enquadra.

  6.7.5.3 Durante a ROP a organização requerente receberá instruções claras sobre as especificidades
  do seu processo de certificação, considerando o grupo no qual está classificada, e considerando
  os desvios e limitações previstas nos RBAC nº 119 e 135 e nesta IS.'
