text: '6.7.6 Fase 2 - Solicitação formal

  6.7.6.1 Para organizações requerentes classificadas como Operador Simples, o sistema de
  manuais requerido pela seção 135.21 do RBAC nº 135 será simplificado, conforme detalhado
  nas seções 6.3 e 6.5 desta IS.

  6.7.6.2 Tais organizações deverão apresentar programa de treinamento operacional simplificado
  conforme a seção 135.341 do RBAC nº 135, conforme detalhado na seção 6.6 desta IS.

  6.7.6.3 Além disso, não precisarão contar com as funções de administração requeridas pela
  seção 119.69 do RBAC nº 119, conforme detalhado nas seções 6.4 e 6.5 desta IS.'
