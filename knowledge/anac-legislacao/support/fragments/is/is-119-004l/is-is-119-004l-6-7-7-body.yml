text: '6.7.7 Fase 3 - Avaliação de documentos

  6.7.7.1 Apesar de organizações requerentes ou detentores de certificado classificados como
  Operadores Simples serem dispensados de apresentarem certos documentos ou manuais, ou de
  poderem apresentar documentação simplificada, as análises serão realizadas seguindo os mesmos
  critérios utilizados para aceitação ou aprovação dos manuais e/ou procedimentos de um operador
  padrão do RBAC nº 135.'
