text: '6.7.8 Fase 4 - Demonstrações e inspeções

  6.7.8.1 Com relação às atividades de inspeções e demonstrações requeridas para a Fase 4
  do processo, apesar de serem previstas menos atividades para organizações requerentes ou
  detentores de certificado classificados como Operadores Simples, as análises e verificações
  seguirão os mesmos critérios utilizados para validação dos procedimentos e verificação de
  cumprimento dos requisitos que são utilizados para um operador classificado como Operador
  Padrão do RBAC nº 135.'
