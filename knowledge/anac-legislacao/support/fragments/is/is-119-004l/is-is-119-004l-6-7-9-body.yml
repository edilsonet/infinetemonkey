title: Fase 5 - Certificação
text: '6.7.9 Fase 5 - Certificação

  6.7.9.1 Detentores de certificado classificados como Operadores Simples terão tal condição
  registrada em suas Especificações Operativas, bem como os desvios do RBAC nº 135 que usufruem,
  conforme seção 6.2 desta IS.

  6.7.9.2 Além disso, os nomes dos pilotos são listados nas suas EO, não sendo aceita a utilização
  de pilotos eventuais para voos remunerados de transporte de passageiros e/ou carga sob as
  regras do RBAC nº 135.

  6.8 Limitações de tamanho e complexidade operacional

  6.8.1 Organizações requerentes ou detentores de certificado classificados como Operadores
  Simples usufruem dos desvios e das simplificações nos processos de certificação apresentados
  nos itens anteriores.


  6.8.2 Os desvios e as simplificações previstas são possíveis considerando limitações de
  tamanho e de complexidade operacional das organizações requerentes ou detentores de certificado.'
