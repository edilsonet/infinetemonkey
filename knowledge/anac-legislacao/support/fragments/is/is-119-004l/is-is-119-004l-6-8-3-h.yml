subsection_id: h
cite: 6.8.3(h)
title: 6.8.3(h)
text: 'h) o operador não poderá realizar as seguintes operações especiais complexas: RNP AR,
  ILS CAT II e III, Aeromédico, ETOPS, NAT-HLA, grandes extensões de água, off-shore, CPDLC,
  ganho de créditos operacionais com HGS ou EFVS ou transporte de artigos perigosos. Quanto
  ao gerenciamento de fadiga, o operador deve se limitar ao nível básico, conforme o Apêndice
  A do RBAC nº 117; e'
