section_id: 6.8.3
section_title: 'A seguir são apresentadas as limitações de tamanho e complexidade:'
subsection_id: z
cite: 6.8.3(z)
title: 6.8.3(z)
text: 'z) hora de pouso;

  aa) hora de corte dos motores;

  bb) aeródromo de partida;

  cc) aeródromo de pouso;

  dd) quantidade de passageiros a bordo;

  ee) natureza do voo; e

  ff) ocorrências no voo.

  7.9 Além dos dados e informações listadas nos parágrafos 7.6, 7.7 e 7.8 desta IS, os detentores
  de certificado devem enviar informações sobre desempenho em segurança operacional, que não
  estão incluídas como relatos mandatórios por outras normas da Anac. Essas informações serão
  solicitadas diretamente nos formulários eletrônicos, de acordo com o grupo de classificação
  do detentor de certificado.

  7.10 Detentores de certificado classificados Operador Padrão devem compartilhar mensalmente
  seus indicadores de desempenho de segurança operacional, definidos em seu MGSO, para avaliação
  do desempenho e maturidade do seu SGSO, bem como para avaliação do seu desempenho em segurança
  operacional.

  7.11 Detentores de certificado que utilizarem diário de bordo eletrônico para as aeronaves
  da sua frota, garantindo acesso da Anac a esses dados, estarão dispensados da apresentação
  dos dados listados no parágrafo 7.8 desta IS.

  7.12 Maiores informações, detalhes e orientações sobre os campos e sobre o preenchimento
  das informações estarão disponíveis nos formulários e na plataforma digital. Dúvidas, dificuldade
  ou sugestões devem ser encaminhadas por meio dos canais oficiais de comunicação, que podem
  ser acessados por meio do endereço eletrônico https://www.gov.br/anac/taxi-aereo.'
