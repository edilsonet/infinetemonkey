title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  9.1 O compartilhamento de informações requerido na seção 7 desta IS deverá ocorrer à partir
  de 1º de agosto de 2026, com o envio das informações referentes ao mês de julho de 2026.
  Até essa data, os operadores devem seguir enviando as informações conforme procedimento
  em vigor descrito no Ofício Circular nº 1(SEI)/2016/GOAG/SPO-ANAC.

  9.2 A GTCE irá publicar instruções sobre os procedimentos de certificação conduzidos em
  plataforma dedicada para esta finalidade por meio do endereço eletrônico https://www.gov.br/anac/taxi-aereo.

  9.3 Os casos omissos serão dirimidos pela SPO.'
