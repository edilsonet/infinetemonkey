title: OBJETIVO
text: 'OBJETIVO

  1.1 Oferecer a uma organização que opere ou pretenda operar sob o RBAC nº 135 em operações
  regulares ou não regulares, um método de cumprimento para obter, alterar, suspender, solicitar
  revogação de uma suspensão ou solicitar a revogação de um certificado de operador aéreo
  (COA) e/ou especificações operativas (EO), de acordo com os requisitos estabelecidos pelo
  RBAC nº 119.'
