text: '4. DEFINIÇÕES

  4.1 Conceito de aeronave limpa (clean aircraft concept) - quando durante as operações de

  solo existirem condições favoráveis a formação de gelo, uma tentativa de decolagem não

  deve ocorrer se gelo, geada, neve ou lama estiverem aderentes ou presentes nas asas, hélices,

  superfícies de controle, entradas de ar do motor ou outras superfícies críticas.

  4.2 Contaminantes de congelamento - para uso desta IS, contaminantes de congelamento

  incluem chuva congelante leve (light freezing rain), chuva congelante (freezing rain),

  chuvisco congelante (freezing drizzle), geada (frost), gelo (ice), pelotas de gelo (ice
  pellets),

  neve (snow), grãos de neve (snow grains), e lama (slush).

  4.3 Procedimento de antigelo - procedimento utilizado para fornecer proteção contra a

  formação de geada ou gelo e acumulação de neve ou lama em superfícies limpas da aeronave

  por um período limitado de tempo (tempo de atuação ou holdover time - HOT). Fluidos

  antigelo são normalmente aplicados sem aquecimento em superfícies de aeronaves limpas,

  mas também podem ser aplicados aquecidos. São fluidos antigelo:'
