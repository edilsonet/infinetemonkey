title: 'responsabilidade: em cada aeródromo sujeito à ou onde operações são esperadas de serem'
text: '6.1.1.1 responsabilidade: em cada aeródromo sujeito à ou onde operações são esperadas
  de serem

  conduzidas em condições que levem à ocorrência de congelamentos em solo, o operador

  deve determinar quem é o responsável por decidir quando os procedimentos de degelo e

  antigelo serão utilizados. Adicionalmente, devem ser descritos os deveres e

  responsabilidades específicas de cada posto ou grupo operacional responsável pela ativação

  dos procedimentos operacionais de antigelo / degelo no solo, visando decolagem segura do

  avião;'
