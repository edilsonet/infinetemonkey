title: 'incorporação em manuais: uma descrição detalhada do programa de degelo e antigelo
  deve'
text: '6.1.1.3 incorporação em manuais: uma descrição detalhada do programa de degelo e antigelo
  deve

  ser incorporada aos manuais do detentor do certificado para membros da tripulação de voo,

  despachantes ou outras pessoas que sejam responsáveis ou que trabalham no

  despacho/controle operacional, pessoal de solo, e pessoal de gerenciamento para usar quando

  conduzindo operações sob condições de congelamento em solo. Essa descrição deve incluir

  as funções, deveres, responsabilidades, instruções, e procedimentos a serem utilizados e
  de

  que forma o detentor de certificado determina que as condições são tais que torna-se

  razoavelmente previsível que geada, gelo ou neve irá aderir ao avião e que os procedimentos

  operacionais do programa de antigelo / degelo devem ser acionados; e'
