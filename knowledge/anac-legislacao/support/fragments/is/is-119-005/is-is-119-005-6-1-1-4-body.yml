text: '6.1.1.4 coordenação: em cada aeródromo, um plano de operações de inverno deve ser desenvolvido

  para incluir coordenação com o ATC (Air Traffic Control - Controle de Tráfego Aéreo) e as

  autoridades apropriadas do aeródromo.'
