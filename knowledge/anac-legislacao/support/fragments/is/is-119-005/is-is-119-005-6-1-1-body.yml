text: '6.1.1 Plano de gerenciamento: de forma a executar apropriadamente o controle operacional

  (quando as condições estão tais que geada, gelo, neve, ou lama possam razoavelmente ser

  esperadas aderirem a uma aeronave), o detentor do certificado deve desenvolver, coordenar

  com outras partes afetadas, implementar e usar um plano de gerenciamento para execução

  apropriada de seu programa aprovado de degelo/antigelo. Um plano contemplando os

  seguintes elementos é aceitável:'
