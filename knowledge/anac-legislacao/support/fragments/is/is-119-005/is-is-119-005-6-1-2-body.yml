title: 'Procedimentos para aplicação: em um manual apropriado, os detentores de certificado'
text: '6.1.2 Procedimentos para aplicação: em um manual apropriado, os detentores de certificado

  devem especificar os procedimentos de aplicação de fluido de degelo e antigelo para cada

  tipo de aeronave operada. O pessoal de solo deve possuir treinamento e qualificação para

  aplicação do fluido de degelo e antigelo, de acordo com um programa aprovado de degelo e

  antigelo, sendo requerido, caso necessário após uma avaliação, treinamento e qualificação

  adicionais no programa aprovado do outro detentor de certificado para realizar os

  procedimentos de degelo e antigelo em uma aeronave similar operada pelo outro detentor de

  certificado com um programa de degelo e antigelo também aprovado. Além disso, um

  treinamento específico também é necessário ao pessoal de degelo de um operador para

  degelar uma aeronave com diferentes configurações (por exemplo, turboélice com cauda em

  T).'
