cite: 6.1.3.1(b)
title: 6.1.3.1(b)
text: 'b) Procedimentos devem ser desenvolvidos a fim de otimizar a comunicação entre a equipe

  de solo e os tripulantes de voo. Deve ser considerado o seguinte:

  I - procedimentos durante o posicionamento da aeronave (se requerido);

  II - qualquer informação relevante durante o processo de degelo e antigelo;Data de publicação:
  9 de fevereiro de 2018 IS nº 119-005

  Revisão A

  III - início do HOT (Start of the HOT);

  IV - os procedimentos de partida da aeronave; e

  V - que os equipamentos utilizados na tarefa e outros foram removidos, por exemplo,

  da área de push back (Equipment clear). E, ainda, que o trabalho já foi realizado e é

  seguro iniciar o taxi (Job done - safe to start taxiing).'
