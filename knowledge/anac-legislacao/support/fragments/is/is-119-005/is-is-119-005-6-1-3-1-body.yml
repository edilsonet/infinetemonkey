title: 'responsabilidades e procedimentos: o programa do detentor de certificado deve definir'
text: '6.1.3.1 responsabilidades e procedimentos: o programa do detentor de certificado deve
  definir

  responsabilidades operacionais e conter procedimentos para a tripulação de voo,

  despachantes de aeronaves, outras pessoas que sejam responsáveis ou que trabalham no

  despacho/controle operacional, e pessoal de solo e de manutenção ao quais se apliquem o

  uso dos HOTs e das ações resultantes se o determinado HOT for excedido.'
