text: '6.1.3.3 utilização de tabelas de HOT: as faixas de HOT são uma estimativa do tempo
  que um

  fluido de degelo/antigelo irá prevenir a formação de geada ou gelo e a acumulação de neve

  em uma superfície não protegida de uma aeronave. O HOT começa quando a aplicação final

  de fluido de degelo/antigelo começa e expira quando o fluido de degelo/antigelo aplicado
  à

  aeronave perde sua efetividade (por exemplo, quando o gelo começa a se formar sobre ou

  no fluido). Os HOTs variam com as condições meteorológicas. A efetividade de fluidos de

  degelo/antigelo é baseada em um número de variáveis (por exemplo, temperatura, conteúdo

  de umidade da precipitação, vento, e a temperatura da superfície da aeronave). As tabelas
  de

  HOT devem ser usadas para planejamento de partida e em conjunção com os procedimentos

  de verificação de pré-decolagem.'
