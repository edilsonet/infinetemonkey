section_title: 'Identificação de superfícies críticas da aeronave: as superfícies críticas
  da aeronave que'
subsection_id: a
cite: 6.1.4.1(a)
title: 6.1.4.1(a)
text: 'a) Geralmente, o seguinte deve ser considerado para ser superfície crítica de aeronave,
  se a

  informação do fabricante da aeronave não estiver disponível:

  I - tubos de pitot, tomadas estáticas, tomadas de ram-air para instrumentos de controle

  do motor e de voo, outros tipos de pontos de tomadas de sensores de instrumentos,

  entradas de ventilação dos tanques de combustível (fuel vents), hélices e entradas de

  motor;

  II - asas, empenagens e superfícies de controle; e

  III - superfícies da parte superior da fuselagem em aeronaves com configuração de

  motores montados ao centro (ex: Boeing 727) ou na fuselagem traseira (ex: Embraer

  EMB-145).'
