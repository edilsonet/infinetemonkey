  que'
text: '6.1.4.1 Identificação de superfícies críticas da aeronave: as superfícies críticas
  da aeronave que

  devem estar livres de contaminantes antes da decolagem devem ser descritas no manual de

  manutenção do fabricante da aeronave ou em outros documentos desenvolvidos pelo

  fabricante, tais como boletins de serviço e de operações.'
