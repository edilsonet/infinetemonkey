title: Identificação de superfícies representativas (para uso em verificações pré-decolagem
text: '6.1.4.2 Identificação de superfícies representativas (para uso em verificações pré-decolagem

  somente): para cada tipo de aeronave operada, detentores de certificado devem listar, em

  um manual apropriado, as superfícies representativas que devem ser verificadas enquanto

  são conduzidas as verificações de pré-decolagem. Alguns fabricantes de aeronaves têm

  identificado certas superfícies de aeronaves que a tripulação de voo pode prontamente

  observar para determinar se contaminantes de congelamento estão se acumulando ou se

  formando nessas superfícies e, usando-as como uma superfície representativa, essa

  tripulação de voo possa realizar julgamentos razoáveis considerando se contaminantes de

  congelamento estão aderindo a outras superfícies da aeronave. Quando estiver sendo

  identificada uma superfície de aeronave que seja representativa, as seguintes instruções

  devem ser consideradas:'
