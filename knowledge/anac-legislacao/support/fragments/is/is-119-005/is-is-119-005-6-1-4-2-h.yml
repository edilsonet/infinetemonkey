title: 6.1.4.2(h)
text: 'h) a presença de cor contrastante na superfície representativa é necessária em algumas

  circunstâncias para que seja possível visualmente detectar alguns tipos de contaminantes.
  Se

  a superfície proposta não possuir esse contraste, é requerido que uma porção dessa superfície

  seja pintada de acordo;'
