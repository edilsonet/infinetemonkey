title: 'Técnicas de reconhecimento: o programa de treinamento do detentor de certificado,'
text: '6.1.4.3 Técnicas de reconhecimento: o programa de treinamento do detentor de certificado,

  incluindo os treinamentos inicial, de transição, periódicos, de elevação de nível, ou qualquer

  outro programa avançado de qualificação e treinamento de qualificação continuada deve

  incluir técnicas específicas para cada tipo de aeronave para uso pela tripulação de voo
  e

  outras pessoas envolvidas no programa de degelo/antigelo para reconhecimento de

  contaminação nas superfícies das aeronaves. A tripulação de voo e outras pessoas envolvidas

  no programa de degelo/antigelo devem usar essas técnicas específicas de tipo enquanto

  conduzirem verificação no pré-voo de gelo na aeronave. Contaminantes de congelamento

  podem tomar a forma de gelo, geada, neve ou lama.

  Nota: A formação de gelo claro (clear ice) pode ser difícil de se detectar visualmente.
  Portanto,

  técnicas específicas de identificação de gelo claro devem ser incluídas em todos os

  programas de treinamento.Data de publicação: 9 de fevereiro de 2018 IS nº 119-005

  Revisão A'
