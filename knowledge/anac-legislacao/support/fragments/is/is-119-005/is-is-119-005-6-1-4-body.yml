title: 'Contaminantes de congelamento na aeronave: a aeronave deve estar livre de todos os'
text: '6.1.4 Contaminantes de congelamento na aeronave: a aeronave deve estar livre de todos
  os

  contaminantes de congelamento que se aderem às asas, superfícies de controle, hélices,

  entradas de motor, ou outras superfícies críticas antes da decolagem.Data de publicação:
  9 de fevereiro de 2018 IS nº 119-005

  Revisão A

  Nota: A ANAC pode autorizar a decolagem com geada sob a asa na área dos tanques de

  combustível, se puder ser demonstrado que existe uma degradação mínima aceitável do

  desempenho (performance) da aeronave devido a essas acumulações. Entretanto, uma geada

  na superfície inferior da asa (under-wing frost) que degrade o desempenho (performance)
  da

  aeronave além de um mínimo é aceitável se a informação de desempenho (performance)

  apropriada estiver fornecida no Manual de Voo.'
