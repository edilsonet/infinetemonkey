title: 'Verificação pré-decolagem (dentro do HOT): verificação necessária sempre que'
text: '6.1.5.1 Verificação pré-decolagem (dentro do HOT): verificação necessária sempre que

  procedimentos para o uso do HOT sejam requeridos. A ANAC recomenda que somente a

  tripulação de voo cumpra a verificação de pré-decolagem. A verificação deve ser efetuada

  dentro do HOT, mediante observações nas asas e nas superfícies representativas para

  contaminação de congelamento. As superfícies a serem verificadas são determinadas pelos

  fabricantes da aeronave ou orientações contidas nesta Instrução Suplementar. As listas de

  verificações pré-decolagem são integradas aos procedimentos associados ao HOT e são

  essenciais. Devido às limitações e cuidados associados ao uso dos HOT, a tripulação de voo

  deve avaliar a situação meteorológica atual e outras condições situacionais que afetam a

  condição da aeronave e não confiar no uso do HOT como o único determinante de que a

  aeronave está livre de contaminantes. Diversas verificações de pré-decolagem podem ser

  requeridas durante o período de HOT, baseadas em fatores que incluem a extensão do

  alcance do HOT, condições meteorológicas ou outras condições. A tripulação deve manter

  uma consciência continuada e monitorar as condições da aeronave e cumprir uma verificação

  de pré-decolagem logo antes de ingressar na pista em uso. Quando conduzindo a verificação

  de pré-decolagem, a tripulação de voo deve levar em consideração a sequência de aplicação

  (i.e., onde na aeronave o processo de degelo começou).'
