section_title: 'Verificação de contaminação pré-decolagem (quando o HOT foi excedido): uma'
subsection_id: a
cite: 6.1.5.2(a)
title: 6.1.5.2(a)
text: 'a) exceto se de outra forma autorizado no programa aprovado do detentor de certificado,

  detentores de certificado que operam aeronaves com hard-wing (asas sem dispositivos

  móveis de sustentação no bordo de ataque) com motores a turbina na parte traseira da

  fuselagem devem conduzir verificações de contaminação pré-decolagem externamente à

  aeronave. A verificação pré-decolagem para essas aeronaves deve incluir um método,

  aprovado pela ANAC, para determinar que todas as superfícies estão livres de

  contaminantes; eData de publicação: 9 de fevereiro de 2018 IS nº 119-005

  Revisão A'
