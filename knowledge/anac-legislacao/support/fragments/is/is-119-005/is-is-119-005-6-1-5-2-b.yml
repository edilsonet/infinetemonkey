section_title: 'Verificação de contaminação pré-decolagem (quando o HOT foi excedido): uma'
subsection_id: b
cite: 6.1.5.2(b)
title: 6.1.5.2(b)
text: 'b) operadores de aeronaves diferentes daquelas informadas no item 6.1.5.2(a) devem

  conduzir essa verificação externamente à aeronave, exceto se for possível demonstrar que
  a

  verificação pode ser cumprida adequadamente a partir da parte interna da aeronave,

  conforme especificado no programa do detentor do certificado. O programa deve detalhar

  procedimentos e requisitos para essa verificação. Quando do desenvolvimento de um

  programa para a condução da verificação de contaminação pré-decolagem a partir da parte

  interna da aeronave, detentores de certificado devem considerar se os membros da tripulação

  são capazes de ver suficientemente as asas, superfícies de controle, e outras superfícies
  para

  determinar se estão livres de contaminantes. Ao realizar essa determinação, deve ser

  considerado o tipo de aeronave, o método de condução da verificação (da cabine de comando

  ou de passageiros), e outros fatores, tais como iluminação da aeronave e condições

  ambientais.'
