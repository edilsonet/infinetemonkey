title: 'Verificação de contaminação pré-decolagem (quando o HOT foi excedido): uma'
text: '6.1.5.2 Verificação de contaminação pré-decolagem (quando o HOT foi excedido): uma

  verificação de contaminação pré-decolagem é uma das condições que permite uma

  decolagem após um HOT ter sido excedido. Quando um HOT tiver sido excedido, os

  detentores de certificado devem ter procedimentos de verificação de contaminação pré-

  decolagem para uso pela tripulação de voo e/ou pessoal de solo qualificado a fim de

  assegurar que as superfícies críticas da aeronave permaneçam livre de contaminantes de

  congelamento. A tripulação de voo e/ou pessoal de solo qualificado devem completar a

  verificação de contaminação pré-decolagem dentro de 5 minutos antes do início da

  decolagem, preferencialmente o mais próximo possível do início da decolagem. Essa

  verificação deve ser cumprida externamente à aeronave, exceto se o programa aprovado do

  detentor de certificado especificar de maneira diversa. Se qualquer dúvida existir com

  relação à condição da aeronave após completar essa verificação, a aeronave não pode decolar

  exceto se for efetuado novo procedimento de degelo e um novo HOT for determinado. O

  seguinte deve ser considerado quando do desenvolvimento de procedimentos para essa

  verificação:'
