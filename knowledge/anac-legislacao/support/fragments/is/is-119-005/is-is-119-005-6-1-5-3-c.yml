text: 'c) todas as superfícies críticas estão livres de contaminantes antes do pushback ou
  táxi.

  Nota: Detentores de certificado devem ter procedimentos que requeiram que pessoal de solo

  qualificado conduza essa verificação. Procedimentos de comunicação devem ser

  estabelecidos para transmitir as informações pertinentes sobre degelo/antigelo e os

  resultados dessa verificação ao piloto em comando.'
