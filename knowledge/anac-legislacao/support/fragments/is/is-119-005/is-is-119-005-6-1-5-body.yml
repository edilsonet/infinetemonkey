  121'
text: '6.1.5 Tipos de verificações de gelo (icing checks): o parágrafo 121.629(c)(4) do RBAC
  nº 121

  identifica verificações pré-decolagem e verificações de contaminação pré-decolagem que,

  quando aplicável, são requeridas de serem cumpridas sob um programa de degelo/antigelo

  aprovado de um operador. O procedimento de degelo/antigelo de aeronave também inclui

  uma verificação pós degelo/antigelo de todas as superfícies da aeronave.'
