title: logo antes do começo da aplicação de fluido de degelo/antigelo, o pessoal de solo deve
text: '6.1.6.2 logo antes do começo da aplicação de fluido de degelo/antigelo, o pessoal de
  solo deve

  confirmar com a tripulação de voo se a aeronave está devidamente configurada para degelo,

  conforme se segue:

  Exemplo: “Comandante, sua aeronave está pronta para o degelo/antigelo?”

  Ou, em inglês, se necessário:

  “Captain, is your aircraft ready for deicing/anti-icing?”;'
