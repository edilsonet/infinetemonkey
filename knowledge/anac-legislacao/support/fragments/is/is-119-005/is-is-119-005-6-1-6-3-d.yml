text: 'd) verificação pós-aplicação cumprida. Especificar data (dia, mês por extenso, ano);
  e

  Nota 1: O elemento da letra “d” do item 6.1.6.3 é requerido para guarda de registro, mas
  opcional

  para notificação à tripulação.

  Nota 2: A transmissão à tripulação de voo dos elementos das letras “a”, “b” e “c” do item
  6.1.6.3

  confirma que uma verificação pós degelo/antigelo foi completada e que a aeronave está

  limpa.'
