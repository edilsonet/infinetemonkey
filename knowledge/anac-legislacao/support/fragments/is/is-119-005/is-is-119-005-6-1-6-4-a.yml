text: 'a) processo de um passo com fluido tipo I ou outro fluido de degelo aprovado (one step

  process with Type I or other approved deicing fluid):

  “Comandante, eu sou o seu degelador designado. Sua aeronave foi degelada com fluido tipo

  I. A sua aplicação de fluido começou às 14:30.”

  Em inglês, caso necessário:

  “Captain, I am your designated deicer. Your aircraft has been deiced with Type I fluid.

  Your fluid application began at 1430.”; e'
