text: 'b) processo de dois passos com fluidos tipos II, III ou IV (two step process with Types
  II,

  III, or IV):Data de publicação: 9 de fevereiro de 2018 IS nº 119-005

  Revisão A

  “Comandante, eu sou o seu degelador designado. Sua aeronave foi degelada com fluido tipo

  I e antigelada com tipo IV. Uma mistura de fluido antigelo de 75 foi usada. A sua aplicação

  de fluido antigelo começou às 16:45.”

  Em inglês, caso necessário:

  “Captain, I am your designated deicer. Your aircraft has been deiced with Type I fluid and

  anti-iced with Type IV. An anti-ice fluid mixture of 75 was used. Your anti-ice fluid

  application began at 1645.”'
