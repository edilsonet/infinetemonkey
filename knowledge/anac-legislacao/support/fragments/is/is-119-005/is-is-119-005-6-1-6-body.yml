text: '6.1.6 Comunicações: a efetividade da comunicação entre o pessoal de solo e a tripulação
  de voo

  antes de começarem as operações de degelo/antigelo é crítica. Após a conclusão das

  operações de degelo/antigelo, o pessoal de solo deve se comunicar com a tripulação de voo

  para determinar o início do HOT. O HOT particular que a tripulação de voo usa também é

  crítico. Como muitos aplicadores de degelo servem a operadores múltiplos, a ANAC

  recomenda que todos os programas aprovados incluam o seguinte fluxo de sequência e

  informação para fornecer uma fraseologia padrão:'
