section_id: 6.1.7.1
section_title: 'Cada programa aprovado de detentor de certificado deve consistir do seguinte:'
subsection_id: a
cite: 6.1.7.1(a)
title: 6.1.7.1(a)
text: 'a) os detentores de certificado devem conduzir treinamentos inicial e periódico anual
  para

  tripulantes de voo, despachantes ou outras pessoas que sejam responsáveis ou que trabalham

  no despacho/controle operacional e pessoal de solo. Os treinamentos devem assegurar que

  todos os envolvidos obtenham um profundo conhecimento das políticas e procedimentos de

  solo de degelo/antigelo da aeronave, incluindo procedimentos requeridos e lições

  aprendidas;'
