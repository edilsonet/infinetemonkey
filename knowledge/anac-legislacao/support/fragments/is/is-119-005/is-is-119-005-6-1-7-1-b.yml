section_title: 'Cada programa aprovado de detentor de certificado deve consistir do seguinte:'
subsection_id: b
cite: 6.1.7.1(b)
title: 6.1.7.1(b)
text: 'b) os programas de treinamento do pessoal de solo, despachantes ou outras pessoas que

  sejam responsáveis ou que trabalham no despacho/controle operacional, e tripulantes devem

  incluir descrição detalhada de treinamento de solo inicial e periódico anual, levando-se
  em

  consideração as especificidades do programa, os deveres e responsabilidades de cada função;'
