section_title: 'Cada programa aprovado de detentor de certificado deve consistir do seguinte:'
subsection_id: c
cite: 6.1.7.1(c)
title: 6.1.7.1(c)
text: 'c) os programas de treinamento do pessoal de solo, despachantes ou outras pessoas que
  sejam

  responsáveis ou que trabalham no despacho/controle operacional, e tripulantes devem

  possuir uma seção ou capítulo destinado a um programa de garantia da qualidade para

  monitorar e manter um nível alto de competência. Um plano de revisão continuado é

  aconselhável para avaliar a efetividade do treinamento de degelo/antigelo recebido;'
