section_title: 'Cada programa aprovado de detentor de certificado deve consistir do seguinte:'
subsection_id: d
cite: 6.1.7.1(d)
title: 6.1.7.1(d)
text: 'd) o programa deve possuir um sistema de rastreamento que registre e garanta que todo
  o

  pessoal requerido foi satisfatoriamente treinado. Detentores de certificado devem manter

  registros de treinamento e qualificação de pessoal (ver Apêndice D desta IS) para

  demonstração de qualificação;'
