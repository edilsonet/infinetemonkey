title: 6.1.7.1(f)
text: 'f) quando os fluidos de antigelo forem usados, o treinamento deve alertar os tripulantes

  quanto à possibilidade de lidar com reações anormais da aeronave, tais como a necessidade

  de aplicação de força adicional no manche para rotação da aeronave para decolagem

  (additional takeoff rotation stick-force).'
