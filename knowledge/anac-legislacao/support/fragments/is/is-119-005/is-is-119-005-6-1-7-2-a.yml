cite: 6.1.7.2(a)
title: 6.1.7.2(a)
text: 'a) efeitos de contaminantes de congelamento nas superfícies de aeronaves (F/D/G):

  fornecer um entendimento do efeito crítico que a presença de pequenas quantidades de

  geada, gelo ou neve tem sobre superfícies de voo. Essa discussão deve incluir, mas não é

  limitada a:

  I - perda de sustentação;

  II - aumento de arrasto e peso;

  III - controlabilidade reduzida;

  IV - tendência brusca de movimento cabrador (pitch up) e queda de asa durante a

  rotação (roll off) (F/D);

  V - ocorrência de estol em ângulos de ataque menores do que o normal (F/D);

  VI - buffet ou estol ocorre antes da ativação do alerta de estol (stall warning) (F/D);
  e

  VII - áreas específicas da aeronave:

  - potencial dano do motor por FOD;

  - entradas de ram air;

  - pontos de tomadas de instrumentos;

  - aeronaves com dispositivos de bordo de ataque - leading edge device (LED),

  como slats e flaps de bordo de ataque (leading edge) e aeronaves sem LED;

  - diretrizes de aeronavegabilidade/inspeções específicas; e

  - winglets.'
