title: 6.1.7.2(b)
text: 'b) condições de gelo no solo para a aeronave: descrição das condições que causam

  implementação de procedimentos de degelo/antigelo (F/D/G):

  I - acumulação de gelo em voo: detentores de certificado devem possuir procedimentos

  para tripulantes reportarem ocorrências de gelo em voo durante a chegada da aeronave

  para o pessoal responsável por executar o programa de degelo/antigelo do detentor de

  certificado. A acumulação de gelo em voo pode resultar na necessidade de procedimento

  de degelo em solo quando voos são programados com trânsitos curtos (ou seja, para

  trânsitos de 30 minutos ou menos e quando as temperaturas ambientes estão iguais ou

  inferiores ao ponto de congelamento);

  II - geada, incluindo geada branca (hoarfrost);Data de publicação: 9 de fevereiro de 2018
  IS nº 119-005

  Revisão A

  Nota: Pode-se definir hoarfrost como um fino depósito branco de uma fina textura cristalina
  que

  se forma sobre superfícies expostas durante noites calmas e sem nuvens quando a

  temperatura cai abaixo da temperatura de congelamento e a umidade do ar está próxima do

  ponto de saturação. Não está associada à precipitação. O depósito é fino o suficiente para

  que as características da superfície subjacente, como linhas de tinta, marcas ou letras
  possam

  ser distinguidas.

  III - precipitação congelante (neve, chuva congelante, chuvisco ou garoa congelantes,

  ou granizo, os quais podem aderir a superfícies de aeronaves);

  IV - nevoeiro congelante (freezing fog);

  V - chuva ou elevada umidade na asa fria encharcada (cold soaked wing);

  VI - chuva ou elevada umidade nos tanques de combustível da asa fria encharcada;

  VII - geada sob a asa (pode não exigir degelo/antigelo dentro de certos limites); e

  VIII - identificação de falha de fluido;

  NOTA 1: O termo “falha de fluido”, neste contexto, é definido conforme definição a

  seguir: tipicamente, no caso da neve, uma camada de neve eventualmente se acumula

  na superfície do fluido e não é mais absorvida pelo fluido. O aparecimento de uma

  acumulação torna-se evidente. Há uma clara perda de brilho ou polimento na superfície

  do fluido. Esse conceito, porém, pode ser ampliado para qualquer situação que possa

  vir a diminuir a um nível inaceitável a eficácia de ação do fluido.'
