section_title: Os detentores de certificado devem treinar e qualificar os tripulantes (flight
  crew (F)),
subsection_id: d
cite: 6.1.7.2(d)
title: 6.1.7.2(d)
text: 'd) procedimentos de comunicações entre a tripulação, pessoal de solo, ATC, e pessoal
  de

  estação da companhia (F/D/G);

  Nota: Atenção quando estiver exercitando comunicação de 3 vias. Pode ser confusa, enganosa
  ou

  mal direcionada. Procedimentos de comunicação devem incluir confirmação de pessoal de

  solo para a tripulação de voo após o processo de degelo e antigelo estar completo e todo

  pessoal e equipamento terem sido retirados (equipment clear) antes de reconfigurar ou

  mover a aeronave.'
