text: 'f) características e capacidades de fluidos usados (F/D/G):

  I - descrições gerais de fluido;

  II - composição e aparência;

  III - diferenças entre fluidos de degelo/antigelo tipo I e tipo II/IV;Data de publicação:
  9 de fevereiro de 2018 IS nº 119-005

  Revisão A

  IV - propósito de cada tipo;

  V - fluidos de degelo;

  VI - fluidos de antigelo;

  VII - capacidades de fluidos de degelo/antigelo;

  VIII - fluidos de degelo/antigelo aprovados para uso (SAE, ISO, etc.);

  IX - informação específica de fluido fornecida pelo fabricante do fluido ou da aeronave

  (F/D e/ou G, conforme apropriado);

  X - requisitos de temperatura de fluido (quente x frio); e

  XI - propriedades associadas com degelo/antigelo por infravermelho;'
