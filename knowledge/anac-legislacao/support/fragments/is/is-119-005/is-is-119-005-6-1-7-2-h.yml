title: 6.1.7.2(h)
text: 'h) instalações de degelo/antigelo e procedimentos de operação de equipamento (G): um

  entendimento das capacidades do equipamento de degelo e as qualificações para operação.

  A parte do programa de treinamento relativa ao equipamento deve incluir o seguinte:

  I - descrição dos vários tipos de equipamentos:

  - veículos de degelo;

  - instalações de infravermelho; e

  - estandes fixos;

  II - operação do equipamento; e

  III - procedimentos de emergência;'
