section_title: Os detentores de certificado devem treinar e qualificar os tripulantes (flight
  crew (F)),
subsection_id: m
cite: 6.1.7.2(m)
title: 6.1.7.2(m)
text: 'm) métodos/procedimentos (F/D/G):

  I - inspeção de superfícies críticas;

  II - precauções relativas a gelo claro;

  III - verificação de pré-decolagem para a tripulação de voo/pessoal de solo;

  IV - determinação da utilização de procedimentos de degelo/antigelo;

  V - localização dos serviços de degelo/antigelo;

  VI - comunicação antes, durante e após os procedimentos de degelo/antigelo;

  VII - precauções gerais relacionadas aos procedimentos de degelo/antigelo;

  VIII - requisitos específicos de aeronave;

  IX - degelo:

  - requisitos; e

  - remoção efetiva de geada, neve, e gelo (G);

  X - antigelo:

  - requisitos;

  - antigelo preventivo (G); e

  - aplicação (G);

  XI - degelo/antigelo:

  - um passo; e

  - dois passos;

  XII - orientações para aplicação de fluidos de degelo/antigelo;

  XIII - requisitos de verificações pós degelo/antigelo;

  XIV - verificações dos controles de voo;

  XV - comunicações após degelo/antigelo; e

  XVI - uso do formulário de degelo/antigelo para a estação (Apêndice E desta IS);'
