text: 'n) uso de HOTs (F/D/G):Data de publicação: 9 de fevereiro de 2018 IS nº 119-005

  Revisão A

  I - definição de HOT;

  II - quando o HOT começa e quando termina;

  III - limitações e cuidados associados ao uso dos HOT;

  IV - fonte de dados de HOT;

  V - relações entre HOT e concentrações particulares de fluido e para diferentes tipos de

  fluidos;

  VI - categoria de precipitação (e.g., névoa (fog), chuvisco ou garoa, chuva, e neve);

  VII - intensidade da precipitação;

  VIII - como determinar um HOT específico através da faixa de HOT que corresponde

  a condições climáticas moderadas ou leves (F/D); e

  IX - ajustar o HOT para condições climáticas variáveis (F/D);

  Nota: O pessoal de solo deve receber treinamento de familiarização a fim de determinar um
  HOT

  específico a partir da faixa de HOT e ajusta-lo para as condições meteorológicas que estejam

  variando.'
