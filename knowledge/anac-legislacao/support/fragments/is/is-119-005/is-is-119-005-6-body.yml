title: ELEMENTOS DO PROGRAMA
text: '6. ELEMENTOS DO PROGRAMA

  6.1 Além de uma lista de páginas efetivas, de procedimentos que incluam a sistemática de

  análise das revisões de dados técnicos relacionados ao programa de degelo/antigelo e os

  meios para determinação das ações decorrentes, de uma lista de atualizações (highlights)

  com localização (página e item), descrição e motivação de todas as alterações feitas, de
  um

  processo de revisão que inclua barras laterais que indiquem os itens revisados, o programa

  de degelo e antigelo de um detentor de certificado deve incluir os elementos abaixo.'
