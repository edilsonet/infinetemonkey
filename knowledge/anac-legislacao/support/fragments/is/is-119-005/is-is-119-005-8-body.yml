text: '8. ORIENTAÇÕES GERAIS SOBRE O PROCESSO

  8.1 A fim de iniciar o processo de aprovação de programa de degelo/antigelo, deve ser

  apresentado o FOP 119 (exceto certificação inicial) com dados do pagamento ou o

  comprovante de pagamento da respectiva TFAC de alteração das especificações operativas,

  e é esperado que os seguintes documentos, com os dados das TFACs, quando aplicável,

  sejam encaminhados para a SPO com os respectivos FOP 107 para análise:'
