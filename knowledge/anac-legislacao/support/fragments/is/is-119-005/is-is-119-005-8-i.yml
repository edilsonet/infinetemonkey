title: 8(i)
text: 'i) outros documentos, caso o detentor do COA considere necessários.

  Nota: Os procedimentos relacionados ao programa de degelo/antigelo em solo não requerem
  um

  manual à parte, podendo estar desenvolvidos em manuais requeridos como o MGO ou

  MGM.

  8.2 Deve ser apresentado, juntamente ao processo, uma lista de verificação para apresentação

  em conformidade do processo de programa de degelo/antigelo, a ser disponibilizado no site

  da ANAC, no link http://www.anac.gov.br/assuntos/setor-regulado/empresas/acesso-

  rapido/modelos-e-formularios, indicando conformidade com os itens desta Instrução

  Suplementar.

  8.3 Todos os documentos devem ser apresentados em formato eletrônico.'
