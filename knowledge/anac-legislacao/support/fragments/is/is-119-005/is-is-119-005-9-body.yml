title: OPERAÇÕES SEM UM PROGRAMA APROVADO DE DEGELO/ANTIGELO
text: '9. OPERAÇÕES SEM UM PROGRAMA APROVADO DE DEGELO/ANTIGELO

  9.1 De acordo com o parágrafo 121.629(d) do RBAC nº 121, um detentor de certificado pode

  continuar a operar sem um programa aprovado de degelo/antigelo se tiver procedimentos

  aprovados e pessoal apropriadamente treinado para conduzir uma verificação de

  contaminação pré-decolagem. As especificações operativas do detentor de certificado devem

  conter a autorização para conduzir essa verificação no lugar de um programa aprovado.

  Conforme estabelecido no referido parágrafo 121.629(d), essa verificação é cumprida

  quando as condições são tais que geada, gelo ou neve podem ser razoavelmente esperadas

  de aderir à aeronave. A verificação deve ser completada em 5 minutos antes do começo da

  decolagem e externamente à aeronave. Os manuais do detentor de certificado e os programas

  de treinamento devem detalhar procedimentos para cumprir essa verificação.

  9.2 No caso de operações segundo o RBAC nº 135, as alternativas estão previstas nos parágrafos

  135.227(b)(1) e (2) do RBAC nº 135. As especificações operativas do detentor de certificado

  devem conter a autorização para conduzir essa verificação no lugar de um programa

  aprovado. Os manuais do detentor de certificado e os programas de treinamento devem

  detalhar procedimentos para cumprir essa verificação.Data de publicação: 9 de fevereiro
  de 2018 IS nº 119-005

  Revisão A'
