title: 'Estado de Registro: é o Estado em que a aeronave está registrada;'
text: '4.1.6 Estado de Registro: é o Estado em que a aeronave está registrada;

  4.1.7 operador primário (ou intercambiador): operador aéreo que normalmente possui a responsabilidade
  sobre o controle operacional da aeronave quando não há contrato de intercâmbio vigente;

  4.1.8 operador secundário (ou intercambiado): operador aéreo que recebe a aeronave para
  operação segundo um contrato de intercâmbio e assume responsabilidade sobre o controle operacional
  da aeronave quando realizando suas rotas;

  4.1.9 contrato de intercâmbio de aeronave (aircraft interchange agreement): acordo entre
  operadores aéreos que viabilize o serviço, com uma única aeronave, ligando a rota de uma
  empresa aérea à rota de outra empresa aérea em um ponto de intercâmbio, de forma que o controle
  operacional e as responsabilidades dele decorrentes, bem como a tripulação competem à empresa
  aérea operando em cada rota. Neste tipo de contrato, o último operador assume o controle
  operacional da aeronave, no momento da transferência;

  4.1.10 controle operacional de um voo: significa exercer o controle sobre o início, a continuação,
  os desvios para alternativa e o término do mesmo, visando a segurança da aeronave e à regularidade
  e eficiência do voo;

  4.1.11 pontos de troca: são os aeródromos, especificados em contrato e nas especificações
  operativas dos operadores, onde ocorrerão as trocas de responsabilidade sobre o controle
  operacional entre o operador primário e o operador secundário, em um contrato de intercâmbio
  de aeronaves. A transferência envolve a substituição da tripulação de um operador pela tripulação
  do outro operador;

  4.1.12 convalidação de licenças, habilitações e certificados: medida tomada por um Estado
  signatário da Convenção de Chicago, por meio da qual, ao invés de outorgar a própria licença,
  habilitação ou certificado, reconhece como equivalente a suas próprias, as licenças, habilitações
  ou certificados outorgados por outro Estado signatário da Convenção de Chicago;

  4.2 Lista de abreviaturas:

  AAC - Autoridade de Aviação Civil

  AOM - Manual de Operações de Aeronave

  CA - Certificado de Aeronavegabilidade de Aeronave

  CM - Certificado de Matrícula de Aeronave

  COA - Certificado de Operador Aéreo

  EFB - Eletronic Flight Bag

  EO - Especificações Operativas

  FSTD - Dispositivo de Treinamento para Simulação de Voo

  GCAC - Gerência de Certificação de Aeronavegabilidade Continuada

  GCTA - Gerência de Operações de Empresas de Transporte Aéreo - 121

  GOAG - Gerência de Operações da Aviação Geral

  MEL - Lista de Equipamentos Mínimos

  MGO - Manual Geral de Operações

  MCMS - Manual de Comissários de Voo

  MGM - Manual Geral de Manutenção

  PBN - Performance Based Navigation

  PED - Portable Eletronic Device

  PMA - Programa de Manutenção de Aeronave

  PrTrnMnt - Programa de Treinamento de Manutenção

  PTO - Programa de Treinamento Operacional

  QRH - Quick Reference Book

  RAB - Registro Aeronáutico Brasileiro

  SAR - Superintendência de Aeronavegabilidade

  SASC - Sistema de Análise e Supervisão Continuada

  SOP - Manual de Procedimentos Operacional Padrão

  SPO - Superintendência de Padrões Operacionais'
