title: Caso o operador primário ou secundário seja estrangeiro, será de sua responsabilidade
  obter as autorizações aplicáveis junto à AAC de seu país.
text: '5.10.2 Caso o operador primário ou secundário seja estrangeiro, será de sua responsabilidade
  obter as autorizações aplicáveis junto à AAC de seu país.

  5.10.3 As EO serão alteradas para incluir as seguintes informações da aeronave: tipo OACI,
  marcas de nacionalidade e matrícula, validade do contrato de intercâmbio, espécie de operação,
  nome do operador primário ou secundário e aeródromos de troca. Também serão adicionadas
  as informações sobre autorizações específicas por tipo OACI, modelo e matrícula das aeronaves
  envolvidas no contrato de intercâmbio.

  5.10.4 A aeronave deverá ser operada de acordo com as autorizações e limitações específicas,
  listadas nas EO de cada operador, nos períodos de tempo em que estiver sob o seu controle
  operacional.

  5.10.5 Caso o operador deseje incluir nova autorização operacional, deverá solicitar formalmente
  a abertura de um processo de alteração de EO, conforme a IS nº 119-001 ou a IS nº 119-004.

  5.11 Vigilância continuada

  5.11.1 Após a emissão de autorização para operação de aeronaves em contratos de intercâmbio,
  sejam elas registradas no Brasil ou no exterior, os operadores estarão sujeitos a todas
  as atividades de vigilância continuada realizadas pela ANAC.

  5.11.2 Atividades como inspeção em rampa, voo de acompanhamento, acompanhamento de treinamento
  e vigilância de examinador credenciado serão realizadas também nas aeronaves operadas sob
  contratos de intercâmbio.

  5.11.3 Em operações que envolvam intercâmbio com aeronaves estrangeiras, a ANAC solicitará
  o envio de informações periódicas sobre as operações, de forma a permitir o monitoramento
  adequado dos riscos envolvidos. O operador secundário brasileiro deverá enviar mensalmente
  à GCAC/SPO um relatório com análise criteriosa dos dados operacionais coletados, por ele
  e pelo operador primário estrangeiro, para as aeronaves em operação de intercâmbio, incluindo
  eventual plano de ações corretivas para os desvios ou situações inseguras.

  5.11.4 Os dados operacionais citados no parágrafo 5.11.3 devem ser, no mínimo, os mesmos
  usados pelo operador secundário brasileiro para atender ao SASC, conforme previsto na seção
  121.373 do RBAC nº 121.

  5.12 Arquivamento compulsório de processo

  5.12.1 O operador interessado terá sempre o prazo máximo de 90 (noventa) dias e o limite
  máximo de 3 (três) tentativas para resolver pendências e não conformidades apontadas durante
  o processo de autorização para utilização de aeronave em contrato de intercâmbio.

  5.12.2 Caso um dos limites acima não seja atendido, o processo será compulsoriamente arquivado.
  Após o arquivamento, caso a empresa ainda tenha interesse, deverá encaminhar documentação
  para iniciar novo processo, conforme os procedimentos descritos nesta IS.

  5.13 Revogação compulsória de autorização'
