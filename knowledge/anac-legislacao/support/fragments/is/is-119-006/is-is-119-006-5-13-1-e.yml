section_title: 'A autorização para execução de contrato de intercâmbio de aeronaves deverá
  ser automaticamente revogada nas seguintes situações:'
subsection_id: e
cite: 5.13.1(e)
title: 5.13.1(e)
text: 'e) se um dos operadores deixar de demonstrar capacidade de manter o controle operacional
  e de aeronavegabilidade da aeronave envolvida.

  5.13.2 No caso da revogação compulsória da autorização, serão emitidas as revisões das EO
  dos operadores brasileiros para formalização da revogação da autorização.'
