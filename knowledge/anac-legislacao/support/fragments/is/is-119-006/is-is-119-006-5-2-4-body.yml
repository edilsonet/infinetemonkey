title: Nos casos em que exista dúvida ou controvérsia, a ANAC também considerará fatores adicionais
  como funções operacionais.
text: '5.2.4 Nos casos em que exista dúvida ou controvérsia, a ANAC também considerará fatores
  adicionais como funções operacionais.

  5.2.5 As operações devem ser conduzidas sob o COA e as EO da parte que é responsável pelo
  controle operacional a cada momento. Isso significa que os procedimentos devem seguir os
  manuais aceitos/aprovados para o detentor desse COA, seguindo os programas de treinamento
  aprovados para o detentor desse COA e obedecendo às limitações constantes nessas EO.

  5.2.6 Por isso, nos contratos de intercâmbio, as operações devem ser conduzidas de acordo
  com o COA e as EO do último operador a assumir a responsabilidade sobre controle operacional
  da aeronave. A seguir são apresentados exemplos de autorizações e limitações que devem respeitar
  as autorizações do operador exercendo o controle operacional da aeronave:'
