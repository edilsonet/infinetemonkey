text: 'q) utilização de FSTD e/ou outros dispositivos de treinamento aprovados.

  5.3 Intercâmbio de aeronave registrada em outros Estados

  5.3.1 A seção 121.153 do RBAC nº 121 estabelece que um operador brasileiro, certificado
  segundo o RBAC nº 119, para operações segundo o RBAC nº 121, somente poderá operar uma aeronave
  não registrada no Brasil sob um contrato de intercâmbio, conforme estabelecido pela seção
  121.569 do RBAC nº 121.

  5.3.2 A seção 135.25 não permite operação de aeronaves que não estejam registradas no Brasil,
  para operadores certificados segundo o RBAC nº 119 para operações segundo o RBAC nº 135.

  5.3.3 Quando o contrato de intercâmbio envolve aeronaves estrangeiras, questões relacionadas
  com a manutenção e operação das aeronaves tornam-se mais complexas.'
