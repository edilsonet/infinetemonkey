text: '5.3.13 Caberá aos operadores revisarem os seus manuais de forma a contemplar o que
  foi definido pelas AAC dos Estados envolvidos nos acordos firmados.

  5.3.14 Os operadores envolvidos no contrato de intercâmbio poderão intermediar as comunicações
  entre as AAC de seus Estados, visando garantir que o acordo aborde todas as questões necessárias
  para a colocação do contrato de intercâmbio em prática.

  5.3.15 A ANAC tem a discricionariedade para rejeitar proposta de contrato de intercâmbio
  de aeronaves, se considerar que a AAC do Estado de Registro da aeronave é incapaz de, no
  cumprimento de suas responsabilidades, manter os níveis de segurança exigidos pela legislação
  brasileira.

  5.4 Características da operação de aeronaves em regime de intercâmbio'
