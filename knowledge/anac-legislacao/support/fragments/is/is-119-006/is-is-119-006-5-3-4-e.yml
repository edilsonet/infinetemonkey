section_id: 5.3.4
section_title: 'O intercambiador deve demonstrar, e estabelecer no contrato de intercâmbio
  e em seus manuais que:'
subsection_id: e
cite: 5.3.4(e)
title: 5.3.4(e)
text: 'e) os manuais do operador brasileiro sejam adequados para contemplar procedimentos
  operacionais e de manutenção, para garantir que a operação da aeronave atenda aos requisitos
  definidos nos regulamentos da ANAC.

  5.3.5 A ANAC avaliará cuidadosamente todos os aspectos de um contrato de intercâmbio antes
  de autorizar um operador a utilizar aeronaves estrangeiras. Uma vez concedida autorização,
  a ANAC exercerá vigilância sobre as operações e a manutenção da aeronave intercambiada.
  Se tiver razões para acreditar que o operador não está em conformidade com o acordo bilateral
  entre as autoridades de aviação civil e quaisquer dos regulamentos aplicáveis a AAC desse
  Estado será informada e solicitada a investigar o assunto.

  5.3.6 Quando o intercâmbio envolver aeronaves registradas fora do Brasil é necessária a
  celebração de acordo formal entre a ANAC e a AAC do Estado de Registro da aeronave, que
  viabilize a aplicação dos contratos de intercâmbio. Há possibilidade de serem firmados,
  em nível gerencial, ajustes formais e de natureza técnica entre as AAC, para detalhamento
  de termos do acordo e procedimentos para seu cumprimento.

  5.3.7 Os acordos de aeronavegabilidade e segurança operacional visam prover a cooperação
  entre as AAC, dos Estados signatários da Convenção de Chicago, para estabelecer reconhecimento,
  harmonização e aprovação recíprocos de procedimentos, como os relativos a aeronavegabilidade,
  manutenção de aeronaves, treinamento de aeronautas e outros aspectos relacionados à segurança
  e padrões de voos.

  5.3.8 Esses acordos geram maior confiança entre as partes e redução do ônus econômico imposto
  à indústria e aos operadores da aviação por redundantes inspeções técnicas, avaliações e
  testes.

  5.3.9 A celebração desses acordos também deve estabelecer e detalhar a divisão de responsabilidades
  entre as AAC, com relação à responsabilidade sobre aeronavegabilidade continuada das aeronaves,
  convalidação de certificados de aeronaves, convalidação de certificados de organização de
  manutenção de aeronaves, convalidação de certificados de operadores aéreos, convalidação
  de licenças e habilitação de tripulantes e DOV e demais assuntos relacionados.

  5.3.10 Os acordos de aeronavegabilidade e segurança operacional podem esclarecer e estabelecer
  os critérios e requisitos que devem ser cumpridos pelos operadores, nos casos em que os
  regulamentos dos Estados envolvidos apresentarem diferenças significativas.

  5.3.11 Pode ser necessário celebrar um acordo para a transferência de todas ou de parte
  das funções, obrigações ou responsabilidades do Estado de Registro da aeronave para a ANAC.
  Esse acordo de transferência está previsto no artigo 83 bis da Convenção de Chicago.

  5.3.12 Na aplicação do art. 83 bis, cabe às AAC definirem as responsabilidades e os aspectos
  relacionados à utilização dos manuais, procedimentos e programas dos operadores envolvidos
  no contrato de intercâmbio.'
