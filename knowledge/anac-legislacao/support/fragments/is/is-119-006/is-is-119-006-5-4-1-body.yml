text: '5.4.1 O contrato de intercâmbio de aeronave é celebrado entre o intercambiador da aeronave
  (que pode ser também o proprietário) e o intercambiado.

  5.4.2 Ambos os operadores aéreos envolvidos no contrato de intercâmbio devem possuir certificados
  e autorizações para operação segundo o mesmo RBAC ou regulamento estrangeiro correspondente.

  5.4.3 O operador deverá utilizar suas próprias tripulações completas (todos os tripulantes
  de voo e de cabine) durante os períodos em que estiver exercendo controle operacional sobre
  aeronave.'
