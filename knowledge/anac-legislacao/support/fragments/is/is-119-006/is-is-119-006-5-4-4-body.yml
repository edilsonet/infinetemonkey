text: '5.4.4 Cada operador deverá conduzir as operações de acordo com seu próprio COA e com
  suas próprias EO.

  5.4.5 No contrato de intercâmbio de aeronaves, deve haver a transferência dos direitos de
  uso da aeronave e de controle operacional entre os operadores primário e secundário, no
  máximo, a cada 30 (trinta) dias. A troca de controle operacional deverá ser registrada nos
  documentos da aeronave (diário de bordo) e será objeto de fiscalização da ANAC.

  5.4.6 A ANAC realizará, a cada solicitação de inclusão de aeronaves a serem operadas sob
  contrato de intercâmbio, a avaliação do operador quanto à capacidade de gerenciamento da
  frota de aeronaves. Nessa avaliação, poderão ser considerados:'
