text: 'i) outros elementos definidos pela ANAC que permitam a identificação de riscos adicionais
  diante da uma maior quantidade de aeronaves estrangeiras intercambiadas.

  5.4.7 A ANAC estabelecerá, nos termos do parágrafo 5.11.3 desta IS, um regime de envio de
  informações periódicas, pelo operador secundário brasileiro à agência, de forma a permitir
  o monitoramento adequado dos riscos operacionais envolvidos.

  5.4.8 O número de aeronaves a serem operadas sob contrato de intercâmbio poderá ser expandido
  ao longo do tempo, se demonstrado que o aumento da frota das aeronaves estrangeiras não
  acarreta impacto adverso no nível de segurança operacional apresentado. Reduções também
  podem ser estipuladas pela ANAC caso seja identificada uma degradação do nível de segurança
  do operador secundário brasileiro.

  5.5 Concessão de autorização

  5.5.1 A concessão de autorização para execução de contrato de intercâmbio de aeronaves é
  realizada por meio de processo de certificação de operador aéreo, em 5 fases, conforme estabelecido
  pela IS nº 119-001 (para operadores segundo o RBAC nº 121) ou pela IS nº 119-004 (para operadores
  segundo o RBAC nº 135). Mais especificamente, consiste em um processo de alteração de EO,
  conforme a IS nº 119-001 ou com a IS nº 119-004.

  5.5.2 Um operador aéreo, antes de colocar em vigor um contrato de intercâmbio de aeronaves
  pelo qual ele deve receber e ceder o direito de uso e o controle operacional de uma aeronave
  sem tripulação de outro operador, alternadamente, deverá solicitar à ANAC a análise e a
  aprovação do contrato de intercâmbio.

  5.5.3 Essa solicitação deve ser formalizada por meio de um FOP 119 ou FOP 219 para abertura
  de processo administrativo de alteração de EO, de acordo com a IS nº 119-001 ou com a IS
  nº 119-004.

  5.5.4 Caso os dois operadores aéreos envolvidos no contrato forem brasileiros, ambos deverão
  solicitar alteração de EO, para que constem no documento as matrículas das aeronaves utilizadas
  sob o contrato de intercâmbio, seja como operador primário ou secundário.

  5.5.5 Ao final do processo, no caso de os dois operadores serem brasileiros, as EO de ambos
  os operadores serão modificadas para inclusão das informações do contrato de intercâmbio.

  5.5.6 Caso um dos operadores for estrangeiro, caberá a este verificar todas as condições
  e requisitos impostos pela AAC responsável pela sua certificação, para propiciar a execução
  do contrato de intercâmbio.

  5.5.7 De acordo com o estabelecido pela IS nº 119-001 ou pela IS nº 119-004, o operador
  poderá solicitar à GCTA ou à GOAG a realização de uma reunião de orientação prévia (ROP),
  como Fase 1 do processo de alteração de EO, para discussão e esclarecimento de todos os
  procedimentos e requisitos que demandam demonstração de cumprimento.

  5.5.8 É importante ressaltar que as AAC têm a competência para definir aspectos relativos
  a responsabilidades pela manutenção, utilização de programas e manuais, realização de treinamentos,
  etc. Os operadores deverão fazer constar em seus manuais e no contrato de intercâmbio, as
  informações definidas pelas AAC.

  5.5.9 Para início da Fase 2 do processo, os seguintes documentos devem ser enviados para
  a GCTA ou para GOAG, com objetivo de iniciar o processo administrativo para autorização
