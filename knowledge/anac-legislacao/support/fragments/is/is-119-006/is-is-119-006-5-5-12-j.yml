document: is-119-006
family: '119'
section_id: 5.5.12
section_title: 'O operador deverá submeter, juntamente com o FOP 119, ou FOP 219, a minuta
  do contrato de intercâmbio. A ANAC verificará o contrato para garantir que:'
subsection_id: j
cite: 5.5.12(j)
title: 5.5.12(j)
text: 'j) estão definidas, no mínimo, as responsabilidades e autoridades para garantir a aeronavegabilidade
  continuada da aeronave durante o período de intercâmbio, incluindo:

  I - aprovação para retorno ao serviço;

  II - cumprimento e controle das tarefas de manutenção, conforme programa de manutenção aprovado;

  III - cumprimento e controle das Diretrizes de Aeronavegabilidade aplicáveis;

  IV - qualificação e treinamento do pessoal envolvido na manutenção;

  V - informações de dificuldades em serviço e ocorrências aeronáuticas; e

  VI - conservação e guarda dos registros de manutenção;'
