section_title: 'O operador deverá submeter, juntamente com o FOP 119, ou FOP 219, a minuta
  do contrato de intercâmbio. A ANAC verificará o contrato para garantir que:'
subsection_id: k
cite: 5.5.12(k)
title: 5.5.12(k)
text: k) os arranjos para abordar quaisquer questões operacionais durante o período de intercâmbio
  estão definidos. Isso inclui, mas não se limita a, qualificações e treinamento de pessoal
  operacional, como pilotos e tripulação de cabine, detalhes sobre como serão abordadas deficiências,
  relatórios de incidentes, reportes obrigatórios e voluntários, etc.;
