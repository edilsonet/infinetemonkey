family: '119'
section_id: 5.5.12
section_title: 'O operador deverá submeter, juntamente com o FOP 119, ou FOP 219, a minuta
  do contrato de intercâmbio. A ANAC verificará o contrato para garantir que:'
subsection_id: q
cite: 5.5.12(q)
title: 5.5.12(q)
text: 'q) os programas de manutenção (operador primário ou intercambiador) que serão utilizados
  estão designados.

  5.5.13 Parte das informações listadas pode estar disposta em contratos complementares ao
  contrato principal. No entanto, a inclusão de tais informações apenas nos manuais de um
  dos operadores não é um método considerado aceitável.

  5.5.14 Caso a análise preliminar do pacote de documentos seja favorável, a Fase 2 será considerada
  encerrada satisfatoriamente, e será iniciada a Fase 3, de análise documental.

  5.5.15 Durante a Fase 3 do processo, serão realizadas as análises operacionais e de aeronavegabilidade
  continuada (pela SPO) e análise do registro de aeronave (pelo RAB). Para o encerramento
  da Fase 3, a documentação enviada deverá receber parecer favorável de todos os setores em
  cada uma das análises.

  5.5.16 Nos itens seguintes desta IS serão detalhados os procedimentos para análise documental
  da solicitação de autorização para intercâmbio de aeronaves (Fase 3 do processo), e também
  para eventuais demonstrações, relativas à Fase 4 do processo.

  5.5.17 Por fim, o item de emissão de autorização detalha a Fase 5 do processo, segundo a
  IS nº 119-001 ou a IS nº 119-004, apresentando o formato de EO para autorização de intercâmbio.

  5.5.18 Recomenda-se que um operador aéreo brasileiro somente solicite o uso de uma aeronave,
  em regime de intercâmbio, caso já possua em suas EO pelo menos uma aeronave do mesmo modelo.

  5.5.19 Caso um operador aéreo brasileiro solicite a utilização de uma aeronave, em regime
  de intercâmbio, que não seja do mesmo modelo de uma aeronave já operada por ele e constante
  de suas EO, o processo de autorização intercâmbio deverá ser acompanhado de um processo
  de alteração de EO para inclusão de novo modelo de aeronave, de acordo com a IS nº 119-001
  ou com a IS nº 119-004.

  5.5.20 Os pontos de troca devem ser inseridos nas EO dos operadores brasileiros envolvidos.
  A transferência de tripulantes e da responsabilidade pelo controle operacional deve ocorrer
  sempre nos pontos de troca especificados nas EO.

  5.5.21 Durante o processo de aprovação de operação de aeronaves em contratos de intercâmbio,
  quaisquer inconformidades ou pendências serão informadas à empresa por meio de ofício, ou
  de FOP 124 ou FOP 224, no caso de inconformidades em manuais e demais documentos, conforme
  IS nº 119-001 ou IS nº 119-004.

  5.6 Aprovação operacional

  5.6.1 As provisões desta IS são aplicáveis aos operadores brasileiros. No caso de operadores
  estrangeiros, estes estarão responsáveis por obter as devidas autorizações das AAC de seus
  países.

  5.6.2 A seguir serão apresentadas orientações para alteração de manuais e documentos dos
  operadores primário e secundário, e outras ações para aprovação e autorização para celebração
  de um contrato de intercâmbio de aeronaves.'
