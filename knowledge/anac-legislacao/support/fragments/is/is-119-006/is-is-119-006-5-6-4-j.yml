section_title: 'Os manuais do operador secundário devem ser revisados para abordar os seguintes
  aspectos:'
subsection_id: j
cite: 5.6.4(j)
title: 5.6.4(j)
text: 'j) os procedimentos para controle da aeronavegabilidade continuada da aeronave durante
  o período de intercâmbio, incluindo informações sobre responsabilidades e autoridades, abrangendo,
  no mínimo:

  I - aprovação para retorno ao serviço;

  II - cumprimento e controle das tarefas de manutenção, conforme programa de manutenção aprovado;

  III - cumprimento e controle das Diretrizes de Aeronavegabilidade aplicáveis;

  IV - qualificação e treinamento do pessoal envolvido na manutenção;

  V - informações de dificuldades em serviço e ocorrências aeronáuticas; e

  VI - conservação e guarda dos registros de manutenção; e'
