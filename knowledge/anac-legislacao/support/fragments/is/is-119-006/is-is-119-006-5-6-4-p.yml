title: 5.6.4(p)
text: 'p) os procedimentos para o uso de sistemas do operador primário, caso aplicável.

  5.6.5 A ANAC, ou pessoa devidamente credenciada, poderá realizar inspeções e vistorias na
  aeronave para garantir que as diferenças entre as aeronaves que já fazem parte da frota
  de um operador secundário e aeronaves envolvidas no contrato de intercâmbio estão abordadas
  e devidamente tratadas nas revisões aos manuais do operador secundário.

  5.6.6 De acordo com o Anexo 6, Partes I e III, à Convenção de Chicago, a MEL, que inclui
  a lista de equipamentos e acessórios de aeronave considerados não essenciais (NEF), deve
  ser específica para cada operador e aprovada pela AAC do Estado do operador. Assim, o operador
  secundário deverá providenciar a aprovação da revisão da MEL, incluindo as aeronaves pertencentes
  ao contrato de intercâmbio.

  5.6.7 É responsabilidade dos operadores providenciarem a compatibilização da MEL para garantir
  a continuidade das operações nos pontos de troca, além de garantir que os requisitos aplicáveis
  de cada AAC envolvidas e acordo bilaterais por ela firmados serão cumpridos pelos operadores,
  durante a vigência do contrato de intercâmbio. Considerando que o registro das irregularidades
  da aeronave deve ser único, deve haver compatibilização entre os prazos para operação com
  o item inoperante, assim como entre as ações de manutenção requeridas. No entanto, caso
  sejam necessárias variações nos procedimentos operacionais entre as MEL, que afetem apenas
  a operação da aeronave enquanto ela se encontra com o próprio operador, tais diferenças
  podem ser admitidas.

  Nota: a IS nº 91-012 detalha os procedimentos para compatibilização da MEL em casos de intercâmbio
  de aeronaves que envolvam diferentes Estados como Estado do operador ou de registro, bem
  como os procedimentos para revisão da MEL pelos operadores.

  5.6.8 Os operadores são responsáveis por distribuir todos os manuais e informações de aeronaves,
  contratar fornecedores de manutenção e fornecedores de serviços de solo, adequados para
  o atendimento da aeronave envolvida no contrato de intercâmbio.

  5.6.9 Todos os operadores aéreos devem dispor de livros de registro a bordo das aeronaves
  para registrar todas as irregularidades mecânicas ocorridas durante o voo, avarias que ocorrem
  no solo e informações da tripulação (conforme as seções 121.563 e 121.701 do RBAC nº 121
  e a seção 135.65 do RBAC nº 135).

  5.6.10 Em um contrato de intercâmbio, os livros de registros de manutenção e de tripulação
  utilizados devem ser os desenvolvidos e fornecidos pelo operador à autoridade de aviação
  civil que emitiu seu COA, em conformidade com os requisitos por ela estabelecidos. No caso
  de haver diferenças no conteúdo entre os livros de registros de manutenção e de tripulação
  entre os operadores envolvidos em um contrato de intercâmbio, o operador secundário deve
  desenvolver procedimentos para garantir o registro de todas as informações requeridas pela
  AAC de seu Estado.

  5.6.11 Ao longo da vigência do contrato de intercâmbio da aeronave, o operador secundário
  deverá continuar a coletar itens como registros de manutenção, registros de aeronave, dados
  do Sistema de Análise e Supervisão Continuada (SASC), tempo de voo, tempo do motor, tendências
  de manutenção e todas as outras informações pertinentes.

  5.6.12 Deverão ser tomadas todas as ações cabíveis para garantir a compatibilidade entre
  os procedimentos e informações registradas nos livros, de forma que todos os requisitos
  aplicáveis, presentes nos regulamentos brasileiros (quando a aeronave é operada pela empresa
  brasileira) estejam sendo cumpridos.

  5.6.13 A AAC do operador secundário deverá estar ciente e de acordo com o contrato de intercâmbio
  celebrado, com relação à utilização de livros de registros de manutenção e de tripulação.

  5.6.13.1 Os operadores deverão desenvolver procedimentos para envio de dados para o Sistema
  Eletrônico de Registro de Voo, conforme a Resolução nº 219, de 13 de março de 2012 e com
  a Portaria ANAC nº 791/SSO, de 26 de abril de 2012, dos voos realizados sob o contrato de
  intercâmbio. Os dados enviados deverão incluir voos das aeronaves registradas no Brasil,
  mesmo quando operadas por empresas estrangeiras, e dados de voos de operadores brasileiros,
  mesmo quando operando aeronaves estrangeiras.

  5.6.13.2 Caso um dos operadores seja estrangeiro, a responsabilidade pelo envio dos dados
  para o Sistema Eletrônico de Registro de Voo será do operador brasileiro. No caso de intercâmbio
  entre empresas brasileiras, cada operador deverá enviar os dados dos voos realizados sob
  o seu controle operacional com as aeronaves do contrato de intercâmbio.

  5.6.14 O operador responsável pelo controle operacional da aeronave, a cada momento, deve
  garantir que ao longo de suas rotas, as estações de linha estejam preparadas para atender
  a aeronave do contrato de intercâmbio, seja com relação ao atendimento de solo, seja com
  relação aos serviços de manutenção.

  5.6.15 Se houver diferenças na capacidade e/ou arranjo dos assentos, os comissários de bordo
  podem ter que receber treinamento para essas diferenças e um exercício de evacuação parcial
  de emergência pode ser necessária para cumprimento da Fase 4 do processo.

  5.7 Aprovação de aeronavegabilidade

  5.7.1 As provisões desta IS são aplicáveis aos operadores brasileiros. No caso de operadores
  estrangeiros, estes estarão responsáveis por obter as devidas autorizações das AAC de seus
  países.

  5.7.2 O contrato de intercâmbio deve especificar o programa de manutenção principal do operador,
  MEL e procedimentos associados, que devem ser utilizados ​​durante a operação e qual operador
  deve ser responsável pelo controle de manutenção da aeronave em cada momento. Não obstante
  as provisões específicas em acordos bilaterais entre as AAC dos estados dos operadores envolvidos,
  diferenças em programas de manutenção, MEL e procedimentos associados devem ser verificadas
  e minimizadas.

  5.7.3 Os manuais do operador primário devem ser revisados para abordar os seguintes aspectos,
  que devem estar alinhados com as provisões do contrato de intercâmbio:'
