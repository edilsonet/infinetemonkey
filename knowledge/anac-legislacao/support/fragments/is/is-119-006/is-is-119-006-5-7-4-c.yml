section_id: 5.7.4
section_title: 'Os manuais do operador secundário devem ser revisados para abordar os seguintes
  aspectos:'
subsection_id: c
cite: 5.7.4(c)
title: 5.7.4(c)
text: 'c) a responsabilidade primária do operador brasileiro, enquanto operador vigente, pela
  aeronavegabilidade de seus aviões.

  5.7.14 Todos os aspectos da operação de intercâmbio proposta serão cuidadosamente analisados,
  por exemplo: os meios para exibir o nome ou o número de certificado do titular de certificado
  que opera a aeronave (seção 119.9 do RBAC nº 119). A revisão da aeronave pode revelar variâncias
  de equipamentos e arranjos de cabine, interruptores, instrumentos e controles que possam
  representar um perigo, requerendo a implementação de um programa de treinamento ou a adoção
  de outras mudanças corretivas destinadas a abordar tais problemas.

  5.8 Demonstrações e inspeções

  5.8.1 Como Fase 4 do processo, a ANAC poderá realizar inspeções nos operadores, brasileiros
  e/ou estrangeiros, envolvidos no contrato de intercâmbio de aeronaves.'
