text: 'l) os procedimentos para o envio das informações previstas no parágrafo 5.11.3 desta
  IS.

  5.7.5 O operador primário deverá manter o registro de manutenção da aeronave e deverá assegurar
  que os itens necessários para serem inspecionados, reparados ou revisados são abordados
  nesses registros, inclusive nos momentos em que a aeronave estiver sob o controle operacional
  do operador secundário.

  5.7.6 A ANAC, ou pessoa devidamente credenciada, poderá realizar inspeções e vistorias na
  aeronave para garantir que as diferenças entre as aeronaves que já estão localizadas na
  frota de um operador secundário e aeronaves intercambiadas estão abordadas e devidamente
  tratadas nas revisões aos manuais do operador secundário.

  5.7.7 No caso de um operador aéreo brasileiro cedendo aeronave para um operador estrangeiro,
  deverá ser demonstrado que a aeronave será mantida em conformidade com todos os requisitos
  estabelecidos na legislação brasileira.

  5.7.8 O contrato de intercâmbio deverá estabelecer se a aeronave pode ou não vir com peças
  sobressalentes. O intercambiado deverá rever o programa de peças e incorporá-lo nos seus
  manuais. Além disso, terá que inventariar e controlar as peças estrangeiras de acordo com
  os requisitos do contrato.

  5.7.9 O operador secundário deverá determinar onde as peças sobressalentes serão localizadas.
  O contrato de intercâmbio deve definir o processo de devolução de peças, bem como os transportadores
  de embarque, e como armazenar e enviar materiais estrangeiros (COMAT) para as instalações
  do operador primário.

  5.7.10 Se os requisitos de inspeção obrigatória para as aeronaves estrangeiras forem diferentes
  devido a diferenças em sistemas e/ou equipamentos, o intercambiado terá que desenvolver
  uma lista e treinamento de inspeção obrigatória de adendos (seção 121.371 do RBAC nº 121).

  5.7.11 O sistema SASC incorporará os requisitos de uma aeronave registrada no estrangeiro.
  O SASC terá que monitorar todos os procedimentos necessários para operar e manter esta aeronave
  durante o intercâmbio. No final do arrendamento, quando o operador primário retoma a aeronave,
  deverá copiar e retornar todas as informações do SASC (seção 121.373 do RBAC nº 121).

  5.7.12 No caso de contratação de organizações de manutenção terceirizadas, os operadores
  deverão se certificar de que essa organização possui as autorizações e certificações requeridas
  pelo Estado de Registro da aeronave.

  5.7.13 Quando o contrato de intercâmbio envolver aeronaves estrangeiras, sendo operadas
  por empresas brasileiras, devem ser tomadas as devidas providências para que os requisitos
  de aeronavegabilidade do RBAC nº 121 sejam satisfatoriamente cumpridos. Essas providências
  incluem três importantes condições de aeronavegabilidade às aeronaves:'
