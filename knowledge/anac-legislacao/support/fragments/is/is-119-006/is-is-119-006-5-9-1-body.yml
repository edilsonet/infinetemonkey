title: O contrato de intercâmbio deve ser inscrito no RAB de acordo com os requisitos e procedimentos
  descritos na Resolução nº 293, de 19 de novembro de 2013.
text: '5.9.1 O contrato de intercâmbio deve ser inscrito no RAB de acordo com os requisitos
  e procedimentos descritos na Resolução nº 293, de 19 de novembro de 2013.

  5.9.2 O contrato somente será considerado válido e efetivo, após o devido registro no RAB.
  Em caso de operação com empresas brasileiras, poderá haver emissão de novo CA e CM. No caso
  de envolver empresa estrangeira, o RAB emitirá uma Certidão de Inteiro Teor com a inscrição
  dos contratos submetidos e analisados.

  5.10 Emissão de autorização para operação de aeronave em contrato de intercâmbio

  5.10.1 A autorização para a operação de aeronave em contrato de intercâmbio, será formalizada
  por meio da emissão de revisão das EO dos operadores, como Fase 5 do processo. Ambas as
  EO do operador primário e do secundário poderão ser emendadas para especificar as aeronaves
  que possuem autorização para operarem em contrato de intercâmbio.'
