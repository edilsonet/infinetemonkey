text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO C

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  5.5.12(j)

  Texto alterado para maior clareza do conteúdo relacionado à aeronavegabilidade

  continuada que deve constar do contrato de intercâmbio.

  5.6.3(i)

  Incluído item sobre revisão de MEL.

  Renumerado o seguinte.

  5.6.4(k)

  Incluído item sobre revisão de MEL, retirado do item 5.6.4(l) [antigo 5.6.4(k)].

  Renumerados os seguintes.

  5.7.3(f)

  Incluído item sobre revisão de MEL.

  Renumerados os seguintes.

  5.7.3(g) [antigo 5.7.3(f)]

  Texto alterado.

  5.7.3(j) [antigo 5.7.3(i)]

  Texto alterado para maior clareza do conteúdo relacionado à aeronavegabilidade

  continuada que deve constar nos manuais do operador primário.

  5.7.4(e)

  Texto alterado para abranger também o antigo 5.7.3(i), que foi excluído.

  5.7.4(f)

  Incluído item sobre revisão de MEL, retirado do antigo 5.7.4(j).

  Renumerados os seguintes.

  5.7.4(j)

  Texto alterado para maior clareza do conteúdo relacionado à aeronavegabilidade continuada
  que

  deve constar nos manuais do operador secundário.'
