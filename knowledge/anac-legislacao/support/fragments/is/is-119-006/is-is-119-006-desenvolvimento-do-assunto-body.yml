title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 A celebração de contratos de intercâmbio de aeronaves, envolvendo operadores aéreos
  brasileiros e/ou aeronaves registradas no Brasil ou no exterior, deve ser autorizada pela
  ANAC, podendo haver emissão de CA e CM de aeronave, e por meio de emendas às EO dos operadores
  brasileiros.

  5.1.2 Somente operadores aéreos brasileiros, detentores de COA e EO válidos segundo o RBAC
  nº 121 ou RBAC nº 135, poderão celebrar contratos de intercâmbio de aeronaves em regime
  de intercâmbio.

  5.1.3 Os contratos de intercâmbio sempre estão vinculados a uma ou mais aeronaves. O ponto
  central do contrato é a cessão/recebimento da aeronave, diferenciando-se dos contratos de
  fretamento, que focam no tipo de serviço prestado ou trocado entre as partes. Ou seja, para
  que fique caracterizado o intercâmbio deve haver transferência dos direitos de uso e do
  controle operacional da aeronave objeto do contrato.

  5.1.4 Antes de se iniciar um processo administrativo na ANAC para permitir a celebração
  de um contrato de intercâmbio de aeronaves, é necessário que os operadores envolvidos sejam
  capazes de determinar claramente que a cessão será realizada na modalidade de intercâmbio.
  Essa determinação pode ser feita em conjunto com a gerência da ANAC responsável pela supervisão
  desses operadores.

  5.1.5 Os contratos de intercâmbio entre operadores de diferentes Estados deverão ser precedidos
  por acordo bilateral entre as respectivas autoridades de aviação civil (AAC), de forma que
  que possa ser avaliada a manutenção do nível de segurança das operações e acordados detalhadamente
  as responsabilidades de cada AAC e os procedimentos específicos para aprovações e supervisão.

  5.1.6 A ANAC tem a discricionariedade para rejeitar proposta de acordo bilateral, se considerar
  que a AAC do Estado do outro operador da aeronave é incapaz de, no cumprimento de suas responsabilidades,
  manter os níveis de segurança exigidos pela legislação brasileira.

  5.1.7 A ANAC tem a discricionariedade para rejeitar proposta de contratos de intercâmbio
  de aeronaves apresentada por operador aéreo, se considerar que um dos operadores envolvidos
  é incapaz de, no cumprimento de suas responsabilidades, manter os níveis de segurança exigidos
  pela legislação brasileira.

  5.2 Responsabilidade sobre o controle operacional

  5.2.1 No caso de contratos de intercâmbio de aeronaves em regime de intercâmbio, a responsabilidade
  sobre o controle operacional é alternada entre os operadores, de forma que o último operador
  a assumir os direitos de uso da aeronave, também assume o controle operacional.

  5.2.2 Os operadores deverão encaminhar junto com o pacote de documentos e manuais, uma proposta
  de procedimentos para a alternância de controle operacional, de acordo com as características
  da operação pretendida e do modelo de aeronave envolvida.

  5.2.3 A ANAC avaliará a proposta dos operadores e determinará se as partes demonstram ser
  capazes de assumir o controle operacional dos voos, durante a execução de um contrato de
  intercâmbio de aeronave, ao exercer controle e responsabilidade por um determinado número
