title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 Procedimentos alternativos aos meios de cumprimento de requisitos expostos nesta IS
  deverão ser solicitados por meio de processo específico, iniciado por um FOP 108 ou FOP
  208, conforme a IS nº 119-001 ou a IS nº 119-004, respectivamente.'
