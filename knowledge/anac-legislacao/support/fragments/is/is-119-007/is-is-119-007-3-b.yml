title: 3(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-

  se, nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir

  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou

  outro ato normativo.

  3.5 Esta IS estabelece meios aceitáveis de cumprimento para as seções 121.574 do RBAC nº

  121 e 135.91 do RBAC nº 135.'
