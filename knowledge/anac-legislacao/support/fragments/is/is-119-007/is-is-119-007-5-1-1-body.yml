cite: 5.1.1
title: Concentradores de oxigênio portáteis (POC) são pequenos dispositivos eletrônicos
text: '5.1.1 Concentradores de oxigênio portáteis (POC) são pequenos dispositivos eletrônicos

  portáteis (PED) com função médica, que funcionam separando o oxigênio do nitrogênio

  e de outros gases do ar ambiente, fornecendo ao usuário oxigênio a uma concentração de

  mais de 90%. POC armazenam brevemente uma pequena quantidade de oxigênio até que:

  ou percebam a inalação do usuário e entreguem oxigênio sob demanda; ou entreguem o

  oxigênio em um fluxo contínuo para o usuário. POC não contêm oxigênio comprimido e,

  portanto, não requerem o mesmo nível de cuidado que o oxigênio comprimido e são

  seguros para uso a bordo de aeronave se certas condições forem satisfeitas.

  Nota: passageiros são proibidos de levar oxigênio comprimido ou oxigênio líquido a

  bordo de aeronaves. De acordo com a regulamentação de artigos perigosos, dispositivos

  que contenham oxigênio líquido ou comprimido devem apresentar etiquetas específicas.'
