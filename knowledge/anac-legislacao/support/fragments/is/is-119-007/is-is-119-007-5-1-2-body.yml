title: Conforme a Resolução nº 280 da ANAC, os passageiros que necessitam de oxigênio
text: '5.1.2 Conforme a Resolução nº 280 da ANAC, os passageiros que necessitam de oxigênio

  durante o voo são enquadrados como passageiros com necessidades de assistência

  especial (PNAE). Para operadores de serviço de transporte aéreo público de passageiros,

  doméstico ou internacional, regular ou não regular, exceto serviços de táxi aéreo, a

  resolução estabelece que o PNAE tem direito aos mesmos serviços prestados aos usuários

  em geral, podendo haver restrições quando não houver condições para garantir a saúde e

  segurança do PNAE ou demais passageiros, com base nas condições previstas em atos

  normativos da ANAC, no manual geral de operações ou nas especificações operativas do

  operador aéreo. Assim, se não houver restrições operacionais, o passageiro deve ser

  permitido a levar consigo e a operar seu POC a bordo da aeronave.'
