title: Os operadores devem incorporar em manuais de seu sistema de documentos de segurança
text: '5.1.3 Os operadores devem incorporar em manuais de seu sistema de documentos de segurança

  operacional (como, por exemplo, no Manual Geral de Operações) as políticas e os

  procedimentos relativos ao transporte de POC a bordo da aeronave, bem como incluir tais

  informações em treinamentos aos funcionários responsáveis por esses procedimentos.

  5.2 Critério de aceitação de POC'
