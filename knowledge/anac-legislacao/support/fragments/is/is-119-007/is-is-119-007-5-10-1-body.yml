title: Para os POC identificados no Apêndice B desta IS, já houve determinação de que não
text: '5.10.1 Para os POC identificados no Apêndice B desta IS, já houve determinação de que
  não

  causam interferência com os sistemas da aeronave. Para os demais POC, a IS nº 91.21-

  001 estabelece um método para obter a utilização expandida de dispositivos eletrônicos

  portáteis (PED).

  Nota: a FAA disponibiliza informações referentes à emissão de radiofrequência por

  alguns modelos de POC em:

  https://www.faa.gov/about/initiatives/cabin_safety/portable_oxygen/.'
