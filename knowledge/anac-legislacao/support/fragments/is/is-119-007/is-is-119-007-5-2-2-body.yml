title: Como regra geral, o POC deve possuir uma etiqueta, conforme requerido pelos parágrafos
text: '5.2.2 Como regra geral, o POC deve possuir uma etiqueta, conforme requerido pelos parágrafos

  121.574(e)(1)(v) do RBAC nº 121 e 135.91(f)(1)(v) do RBAC nº 135. No entanto, os

  POC listados no Apêndice B desta IS podem ser aceitos mesmo sem a etiqueta.

  Nota: ressalta-se que o apêndice B não apresenta uma lista exaustiva de todos os POC

  que podem ser transportados a bordo de aeronave, mas somente daqueles dispensados da

  etiqueta. POC que atendam aos critérios de aceitação estabelecidos no RBAC, conforme

  detalhados por esta IS, podem ser aceitos, independentemente de estarem na lista.'
