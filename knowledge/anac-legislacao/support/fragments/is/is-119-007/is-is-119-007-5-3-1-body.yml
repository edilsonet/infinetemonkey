title: A ANAC não exige que um passageiro consulte um médico antes de utilizar um POC a
text: '5.3.1 A ANAC não exige que um passageiro consulte um médico antes de utilizar um POC
  a

  bordo da aeronave. No entanto, conforme o art. 10 da Resolução nº 280, o operador aéreo

  pode exigir a apresentação de Formulário de Informações Médicas (MEDIF) ou outro

  documento médico com informações sobre as condições de saúde do passageiro que

  necessite utilizar oxigênio. O passageiro pode consultar o operador aéreo a respeito dessa

  necessidade.'
