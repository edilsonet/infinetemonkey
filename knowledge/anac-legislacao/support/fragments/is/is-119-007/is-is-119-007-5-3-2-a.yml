title: 5.3.2(a)
text: 'a) os efeitos da cabine pressurizada (a altitude-pressão da cabine pode chegar a 8
  mil

  pés) na necessidade de oxigênio do passageiro. Alguns usuários de POC precisam de

  maior fluxo de oxigênio em razão da altitude-pressão da cabine. Alguns usuários de POC

  que usam o POC apenas ocasionalmente em solo podem precisar usar o POC no voo

  inteiro em razão da altitude-pressão da cabine;'
