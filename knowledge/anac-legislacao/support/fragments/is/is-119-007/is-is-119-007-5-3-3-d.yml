subsection_id: d
cite: 5.3.3(d)
title: 5.3.3(d)
text: 'd) os operadores aéreos podem estabelecer requisitos de bateria, com vistas a garantir

  a saúde e a segurança do passageiro em voo, desde que tais requisitos sejam divulgados

  aos passageiros. Tipicamente, os operadores aéreos podem requerer bateria suficiente

  para manter o POC funcionando por 150% da duração esperada do voo.'
