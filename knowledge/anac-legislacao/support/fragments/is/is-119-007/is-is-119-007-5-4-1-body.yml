title: Danos à bateria ou curtos-circuitos podem resultar em superaquecimento ou fogo. Esses
text: '5.4.1 Danos à bateria ou curtos-circuitos podem resultar em superaquecimento ou fogo.
  Esses

  eventos, por sua vez, podem resultar em danos aos passageiros e, no pior caso para alguns

  tipos de bateria, até em um incêndio catastrófico na cabine de passageiros. Portanto,

  baterias de lítio sobressalentes levadas a bordo da aeronave devem ser individualmente

  protegidas de modo a evitar curtos-circuitos (colocando-as em embalagens originais de

  varejo ou isolando seus terminais, p. ex., tampando os terminais expostos ou colocando

  cada bateria em um saco plástico ou bolsa de proteção separada). Baterias de lítioData de
  emissão: 23 de abril de 2021

  Data da vigência: 3 de maio de 2021

  IS nº 119-007

  Revisão A

  sobressalentes não podem ser levadas na bagagem despachada.

  Nota: aplicam-se ainda as demais restrições estabelecidas na regulamentação de artigos

  perigosos, incluindo o RBAC nº 175 e as Instruções Suplementares associadas, que têm

  por base as Instruções Técnicas para o Transporte Seguro de Artigos Perigosos por Via

  Aérea (Doc. 9284-AN/905), publicadas pela OACI.'
