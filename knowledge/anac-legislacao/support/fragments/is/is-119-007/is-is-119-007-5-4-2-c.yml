  bordo das aeronaves para o usuário de POC, a fim de facilitar uma vigilância contínua

  dos tripulantes durante todo o período do voo, relacionada ao uso adequado do POC e a

  guarda das suas baterias, respeitando-se a proibição e restrições apontadas na seção 5.7

  desta IS.'
