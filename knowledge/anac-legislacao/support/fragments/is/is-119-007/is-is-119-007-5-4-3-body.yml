title: Os usuários de POC são responsáveis por garantir que as baterias levadas a bordo, como
text: '5.4.3 Os usuários de POC são responsáveis por garantir que as baterias levadas a bordo,
  como

  bagagem de mão ou junto ao corpo, são embaladas adequadamente. Pode ser que

  fornecedores de POC, alguns operadores aéreos ou agências de carga especializadas no

  envio de pequenas embalagens ofereçam esse serviço de embalagem.

  5.5 Formas de transporte do POC'
