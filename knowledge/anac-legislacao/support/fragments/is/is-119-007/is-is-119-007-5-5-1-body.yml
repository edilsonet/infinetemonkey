text: '5.5.1 Se o POC for levado como bagagem de mão, não pode ser considerado como parte
  da

  franquia de bagagem de mão, tendo em vista que representa equipamento de uso

  necessário ao transporte. Caso seja necessário o transporte de bagagem com as baterias

  de lítio sobressalentes a bordo, elas também não podem ser consideradas como parte da

  franquia de bagagem de mão, mas devem obedecer aos requisitos da regulamentação de

  artigos perigosos.'
