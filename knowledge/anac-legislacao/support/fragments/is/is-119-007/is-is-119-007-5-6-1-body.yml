title: Para que o POC funcione corretamente, o filtro de entrada de ar não pode estar bloqueado
text: '5.6.1 Para que o POC funcione corretamente, o filtro de entrada de ar não pode estar
  bloqueado

  durante o uso. Portanto, a área em torno do POC deve estar livre de cobertores, casacos

  ou outras peças de bagagem de mão que possam bloquear a entrada de ar. Se a entrada de

  ar for bloqueada, o usuário de POC poderá ser alertado, por luzes ou avisos sonoros, de

  que a concentração de oxigênio na saída do POC é insuficiente; e quando a temperatura

  dos componentes internos do POC aumentar além de um certo limite, porque o POC está

  tentando entregar oxigênio, o POC poderá desligar automaticamente para prevenirData de emissão:
  23 de abril de 2021

  Data da vigência: 3 de maio de 2021

  IS nº 119-007

  Revisão A

  superaquecimento e o usuário de POC poderá ser alertado, por luzes ou avisos sonoros.'
