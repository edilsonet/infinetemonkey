title: O POC deve ser colocado sob o assento na frente do usuário de POC de forma que o
text: '5.6.2 O POC deve ser colocado sob o assento na frente do usuário de POC de forma que
  o

  usuário ou seu acompanhante possam ver as luzes de alerta ou ouvir os avisos sonoros.

  Por essa razão, não é recomendado colocar o POC sob o assento do próprio usuário ou

  em compartimentos fechados. No entanto, outras localizações podem ser aceitáveis.'
