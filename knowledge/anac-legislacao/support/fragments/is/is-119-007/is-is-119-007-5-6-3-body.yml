text: '5.6.3 Deve-se evitar, ao longo de toda duração do voo, a proximidade do POC com superfícies

  aquecidas ou com materiais que produzam fagulha, faísca ou centelha ou que possam

  queimar em atmosferas com altas concentrações de oxigênio, pois o uso do POC pode

  provocar aumento da concentração de oxigênio no ambiente ao seu entorno.

  5.7 Restrições de assento para passageiros que possam vir a usar POC a bordo da

  aeronave'
