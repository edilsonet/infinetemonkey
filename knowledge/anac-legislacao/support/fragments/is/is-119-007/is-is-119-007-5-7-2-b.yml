title: 5.7.2(b)
text: 'b) o tubo que é usado para levar o oxigênio do POC até a máscara ou cânula nasal

  do usuário de POC pode atravessar a fileira de modo que restrinja a saída dos passageiros

  ou mesmo se torne um perigo durante uma evacuação. O usuário de POC não pode

  restringir a saída de passageiros durante essas fases do voo. Nesse caso, pode ser

  requerida uma restrição de uso de assento pelo usuário de POC. Por exemplo, se todos os

  assentos da fileira estão ocupados, o assento apropriado para o usuário de POC deve ser

  o assento da janela. Porém, se não houver outros passageiros na fileira, ou se há somente

  um outro passageiro na fileira e que já está sentado no assento de corredor, então os outros

  assentos podem ser utilizados pelo usuário de POC. Por fim, caso o POC seja armazenado

  de forma que o tubo não bloqueie a saída de outros passageiros, então também não é

  necessário restringir o uso de assento pelo usuário de POC.

  5.8 Uso de POC durante despressurização da cabine'
