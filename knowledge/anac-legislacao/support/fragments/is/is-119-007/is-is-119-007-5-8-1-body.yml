title: Não há perigo associado ao uso do POC durante uma despressurização da cabine. Porém,
text: '5.8.1 Não há perigo associado ao uso do POC durante uma despressurização da cabine.
  Porém,

  no caso de uma despressurização (rápida ou lenta), POC tipicamente não continuarão a

  atender às necessidades de oxigênio do usuário a altitudes-pressão de cabine superiores
  a

  8 ou 10 mil pés. Isso ocorre porque a baixa pressão do ar ambiente a altas altitudes faz

  com que a concentração do oxigênio na saída do POC seja muito baixa. Numa

  despressurização de cabine, o usuário de POC deve ser orientado a interromper o uso do

  POC e a usar a máscara de oxigênio suplementar até que a aeronave desça abaixo dos 10

  mil pés de altitude-pressão da cabine.Data de emissão: 23 de abril de 2021

  Data da vigência: 3 de maio de 2021

  IS nº 119-007

  Revisão A'
