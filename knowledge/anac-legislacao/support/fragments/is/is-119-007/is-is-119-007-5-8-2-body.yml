title: Os requisitos de informações aos passageiros estabelecem que tripulantes orientem os
text: '5.8.2 Os requisitos de informações aos passageiros estabelecem que tripulantes orientem
  os

  passageiros da necessidade de uso de oxigênio no caso de despressurização da cabine

  (121.571(a)(1)(vi) do RBAC nº 121 e 135.117(a)(7) do RBAC nº 135). Os usuários de

  POC irão receber essas informações juntamente com os demais passageiros. No entanto,

  usuários de POC que são dependentes de seus POC como fonte primária de oxigênio

  suplementar podem não reconhecer as limitações de seus POC ou que os procedimentos

  informados a todos os passageiros também são aplicáveis a eles. Operadores aéreos

  podem querer enfatizar a importância desse procedimento de despressurização aos

  usuários de POC.'
