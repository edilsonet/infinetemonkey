text: '5.8.3 Procedimentos típicos de operadores aéreos requerem que, após uma despressurização
  da

  cabine, a aeronave desça rapidamente para uma altitude em que o oxigênio suplementar

  não seja mais necessário. No entanto, em razão de fatores limitantes, como terreno

  elevado, a descida da aeronave pode ser limitada a uma altitude mínima da rota,

  resultando que a altitude-pressão da cabine da aeronave se mantenha alta, de forma que o

  oxigênio suplementar continue sendo necessário e que o POC não funcione

  adequadamente (tipicamente altitudes-pressão de cabine superiores a 8 ou 10 mil pés).

  Nesse caso, os comissários devem seguir os procedimentos referentes ao uso de oxigênio

  suplementar de primeiros socorros para atender às necessidades adicionais de oxigênio

  dos usuários de POC. Os comissários devem também saber que os POC devem voltar a

  funcionar adequadamente para atender às necessidades de oxigênio do usuário quando a

  altitude-pressão de cabine for inferior a 8 ou 10 mil pés.

  5.9 Uso de fonte de energia elétrica da aeronave para o POC'
