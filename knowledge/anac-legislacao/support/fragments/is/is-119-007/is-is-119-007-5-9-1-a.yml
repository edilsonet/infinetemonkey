section_title: Não há requisitos para que o operador aéreo forneça fonte de energia elétrica
  da aeronave
subsection_id: a
cite: 5.9.1(a)
title: 5.9.1(a)
text: 'a) políticas e procedimentos. Operadores aéreos devem estabelecer políticas e

  procedimentos para os comissários a respeito do uso de fontes de energia elétrica da

  aeronave no evento de uma falha da bateria ou de o usuário de POC possuir um número

  insuficiente de baterias;'
