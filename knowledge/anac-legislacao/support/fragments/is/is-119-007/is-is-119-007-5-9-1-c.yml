section_id: 5.9.1
section_title: Não há requisitos para que o operador aéreo forneça fonte de energia elétrica
  da aeronave
subsection_id: c
cite: 5.9.1(c)
title: 5.9.1(c)
text: 'c) sistemas de fornecimento de energia. No desenvolvimento de procedimentos

  associados ao POC, os operadores aéreos devem se referir às orientações sobre os

  sistemas de fornecimento de energia para serem usados com um PED, como, por

  exemplo, o memorando ANM-01-111-165, intitulado “Policy Statement on Certification

  of Power Supply Systems for Portable Electronic Devices on Part 25 Airplanes”,

  publicado pela FAA;'
