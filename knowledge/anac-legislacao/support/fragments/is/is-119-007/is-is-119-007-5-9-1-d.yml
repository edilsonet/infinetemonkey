title: 5.9.1(d)
text: 'd) saídas de energia. Algumas das saídas de energia a bordo de uma aeronave estãoData
  de emissão: 23 de abril de 2021

  Data da vigência: 3 de maio de 2021

  IS nº 119-007

  Revisão A

  localizadas em galleys, próximo às saídas de emergência ou próximo aos jump seats. Os

  operadores aéreos devem garantir que a saída de energia utilizada pelo POC é localizada

  de tal forma que o cabo do POC não se torne um perigo para a movimentação dos

  comissários ou dos passageiros em quaisquer fases do voo, incluindo a operação em rota;'
