title: DISPOSIÇÕES FINAIS
text: '7. DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 Os operadores aéreos devem protocolar revisões de seus manuais, em atendimento ao

  parágrafo 5.1.3 desta IS, até 1º de julho de 2021.

  7.3 Esta IS entra em vigor em 1º de maio de 2021.Data de emissão: 23 de abril de 2021

  Data da vigência: 3 de maio de 2021

  IS nº 119-007

  Revisão A'
