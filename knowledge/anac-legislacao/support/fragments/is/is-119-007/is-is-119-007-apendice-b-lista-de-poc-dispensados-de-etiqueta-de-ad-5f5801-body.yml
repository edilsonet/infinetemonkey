text: 'APÊNDICE B - LISTA DE POC DISPENSADOS DE ETIQUETA DE ADEQUAÇÃO PARA

  O TRANSPORTE A BORDO DE AERONAVES

  B1. Conforme os parágrafos 121.574(e)(1)(v) do RBAC nº 121 e 135.91(f)(1)(v) do RBAC

  nº 135, a ANAC pode autorizar o uso de POC dispensando a etiqueta que atesta adequação

  para o transporte a bordo de aeronaves nos casos em que o país do fabricante não requeira

  sua afixação, desde que os demais critérios de aceitação tenham sido verificados.

  B2. Este apêndice apresenta a lista dos POC dispensados dessa etiqueta:'
