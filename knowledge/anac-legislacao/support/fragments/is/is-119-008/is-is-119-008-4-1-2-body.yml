text: '4.1.2 Acesso controlado: nível de acesso que permite tomar conhecimento restrito dos
  dados e parâmetros específicos.

  4.1.3 Acompanhamento e análise de dados de voo: monitoramento sistemático das operações
  por meio da obtenção de dados oriundos de registradores de dados de voo, visando à prevenção
  de incidentes e acidentes aeronáuticos, de ocorrências anormais que tragam risco adicional
  à segurança operacional e ao aprimoramento contínuo no padrão de segurança da empresa.'
