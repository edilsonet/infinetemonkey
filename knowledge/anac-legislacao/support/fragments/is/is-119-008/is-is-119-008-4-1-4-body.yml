  PAADV.'
text: '4.1.4 Análise de tendência: informações estatísticas associadas a eventos monitorados
  pelo PAADV.

  4.1.5 Análise técnica: avaliação realizada sob a perspectiva de qualidade dos dados, ou
  seja, validando a integridade dos dados gravados ou descartando (invalidando) falsos positivos.

  4.1.6 Dado: qualquer parte de uma informação digital coletada de uma aeronave específica,
  engajada em um programa de análise de dados de voo, independente de qual formato eletrônico
  ela possua.

  4.1.7 Dado de identificação: cada dado ou combinação de dados que permitam que os dados
  de voo, coletados ou registrados, sejam associados a uma aeronave e/ou voo específico.'
