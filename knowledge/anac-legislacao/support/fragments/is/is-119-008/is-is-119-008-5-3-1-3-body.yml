text: '5.3.1.3 A análise de dados de voo (Flight Data Analysis - FDA) é uma ferramenta sistemática
  para a identificação proativa de perigos nas operações.

  5.3.1.4 Um Programa de Acompanhamento e Análise de Dados de Voo (PAADV) pode ser definido
  como um programa não-punitivo de coleta e análise de dados de voo a fim de desenvolver informações
  preditivas e objetivas para a melhoria da segurança operacional como, por exemplo, melhoria
  de procedimentos-padrão nas operações, melhores práticas de manutenção e engenharia, procedimentos
  de controle de tráfego aéreo, dentre outros.'
