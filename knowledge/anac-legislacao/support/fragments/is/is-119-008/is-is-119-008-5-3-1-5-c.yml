section_title: 'Um PAADV envolve:'
subsection_id: c
cite: 5.3.1.5(c)
title: 5.3.1.5(c)
text: 'c) Promover ações corretivas (mitigações) para tratar problemas em potencial.

  5.3.1.6 Os dados obtidos por meio de um PAADV podem também ser utilizados para outras tarefas
  secundárias, permitindo um ganho de eficiência operacional ao operador, desde que seguidos
  os procedimentos e premissas estabelecidos nesta IS.

  5.3.1.7 Um operador aéreo deve estabelecer e manter um PAADV como parte de seu Sistema de
  Gerenciamento da Segurança Operacional (SGSO). Além disso, recomenda-se que o PAADV esteja
  integrado a outros programas de segurança do operador, como, por exemplo, a um sistema voluntário
  de reportes e a um programa de auditoria das operações de linha (Line Operations Safety
  Audit - LOSA).'
