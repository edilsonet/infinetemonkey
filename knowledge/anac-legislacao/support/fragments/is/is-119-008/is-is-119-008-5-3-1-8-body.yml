text: '5.3.1.8 Um PAADV não pode ser utilizado com finalidade punitiva e deve conter salvaguardas
  adequadas para proteger as fontes de dados.

  5.3.1.9 O estabelecimento de um PAADV deve ser precedido de uma política de utilização,
  acesso e manuseio dos dados e de um acordo (protocolo) firmado entre o operador aéreo, o
  sindicato que legalmente representa os pilotos e a associação de pilotos do operador aéreo,
  quando houver, respeitados os limites estabelecidos nesta IS.'
