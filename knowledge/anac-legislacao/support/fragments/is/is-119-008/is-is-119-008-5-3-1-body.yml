text: '5.3.1 Geral

  5.3.1.1 As aeronaves comerciais de transporte aéreo possuem capacidade cada vez maior de
  gravar parâmetros ao longo de um voo. Anteriormente, o uso desses dados era limitado apenas
  a processos reativos como o de investigação de ocorrências aeronáuticas. A introdução de
  melhorias nas tecnologias de hardware e software, como o uso de mídias removíveis e na transmissão
  de dados, por exemplo, associado ao uso de sistemas de gerenciamento de risco, permitem
  atualmente um amplo espectro de aplicações para um operador aéreo.

  5.3.1.2 A OACI, em seu Anexo 6, Parte I, define análise de dados como sendo o processo de
  analisar os dados de voo gravados com a finalidade de melhorar a segurança das operações
  aéreas.'
