title: Não punitivo e de caráter instrutivo
text: '5.4.2.1 Não punitivo e de caráter instrutivo

  5.4.2.1.1 Um PAADV não pode ser utilizado para fins punitivos. O operador aéreo não poderá
  usar as análises provenientes do PAADV para fins disciplinares, exceção feita aos casos
  considerados como egrégios, após analisados e julgados passíveis de ter sua confidencialidade
  desprotegida, de acordo com o previsto na seção 5.5 desta IS.

  5.4.2.1.2 O operador aéreo não poderá incluir no processo ou arquivo individual da tripulação
  de voo qualquer tipo de informação relativa a dados obtidos por meio do PAADV, nem os utilizar
  com o objetivo de ranqueamento de progressão de carreira, promoção ou qualquer distinção
  técnica, disciplinar e administrativa.'
