title: Confidencial e sigiloso
text: '5.4.2.2 Confidencial e sigiloso

  5.4.2.2.1 O operador aéreo deve assegurar-se de que nenhuma tripulação específica possa
  ser associada a um determinado voo, exceto sob rígidas condições de sigilo e confidencialidade
  da informação, conforme previsto no acordo firmado pelo operador aéreo com o sindicato da
  categoria profissional e a associação de pilotos da empresa aérea, quando houver.'
