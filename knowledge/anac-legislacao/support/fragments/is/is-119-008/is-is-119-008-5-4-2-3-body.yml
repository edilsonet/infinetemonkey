title: Integração com o SGSO
text: '5.4.2.3 Integração com o SGSO

  5.4.2.3.1 O PAADV deve estar associado a um SGSO e inserido em um ambiente de cultura de
  segurança operacional positiva. O operador aéreo deve se comprometer com uma abordagem proativa
  para a gestão sistemática da segurança operacional a um ponto que todos os níveis de envolvimento
  estarão conscientes e se sentirão responsáveis.

  5.4.2.3.2 Os princípios necessários ao estabelecimento de um PAADV bem-sucedido são os mesmos
  daqueles necessários ao estabelecimento de um SGSO, requerido aos operadores certificados
  segundo o RBAC nº 119. Mais do que oportuno, esse alinhamento torna o funcionamento do PAADV
  muito mais efetivo quando totalmente integrado ao SGSO de uma organização e vice-versa.'
