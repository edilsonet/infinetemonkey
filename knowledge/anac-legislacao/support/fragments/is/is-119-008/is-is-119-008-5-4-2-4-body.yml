title: Uso para monitoramento das operações
text: '5.4.2.4 Uso para monitoramento das operações

  5.4.2.4.1 O PAADV deve destinar-se ao monitoramento e melhoria das operações. A utilização
  dos dados e da ferramenta de leitura (software) para fins de investigação de acidente, incidente
  ou incidente grave não faz parte do escopo desta IS.'
