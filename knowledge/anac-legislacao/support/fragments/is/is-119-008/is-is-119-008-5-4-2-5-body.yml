text: '5.4.2.5 Privacidade da tripulação de voo

  5.4.2.5.1 O PAADV deve respeitar a privacidade da tripulação de voo e as restrições de uso
  de dados oriundos de ADRS, CARS, CVR, FDR, AIR e AIRS previstas na seção 5.5.4 desta IS.'
