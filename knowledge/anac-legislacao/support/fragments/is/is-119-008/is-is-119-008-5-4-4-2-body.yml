text: '5.4.4.2 O Anexo 19 da OACI recomenda que os Estados e os prestadores de serviços promovam
  uma cultura de segurança operacional positiva.

  5.4.4.3 Quando um operador aéreo possui uma cultura de segurança operacional positiva, apoiada
  pela alta gestão da empresa e pelos gestores imediatos, os funcionários de “linha de frente”
  tendem a ter um senso de responsabilidade compartilhada para com o alcance dos objetivos
  de segurança da organização.

  5.4.4.4 Uma cultura de segurança positiva requer alto grau de confiança e respeito entre
  os funcionários e a gestão. É necessário tempo e esforço para construir um ambiente propício
  a troca de informações. Por outro lado, más decisões ou a falta de ação, por parte da gestão
  da empresa, pode facilmente quebrar esse vínculo.

  5.4.4.5 Estabelecer uma cultura justa é uma parte importante da cultura de segurança. O
  operador aéreo deve então estabelecer processos internos para subsidiar as análises, a fim
  de que por meio e procedimentos claros, tripulações envolvidas em eventos do PAADV recebam
  tratamento justo e medidas corretivas proporcionais para evitar reincidências.'
