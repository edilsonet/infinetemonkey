title: 5.4.4.7(b)
text: b) O envolvimento de pessoas com experiência apropriada quando da identificação e avaliação
  dos riscos. Por exemplo, tripulações de voo experientes em um determinado tipo de aeronave
  podem ser essenciais para o diagnóstico preciso dos riscos operacionais emergentes das análises
  do Flight Data Monitoring (FDM);
