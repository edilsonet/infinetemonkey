text: '5.4.4 Cultura de Segurança Operacional

  5.4.4.1 Uma cultura de segurança operacional é a consequência natural de se ter humanos
  no sistema de aviação. Ela pode ser descrita “como as pessoas se comportam em relação à
  segurança e ao risco quando ninguém está observando”. É uma expressão de como a segurança
  é percebida, valorizada e priorizada pela alta gestão e pelos funcionários de uma organização,
  e se reflete na medida em que indivíduos e grupos:'
