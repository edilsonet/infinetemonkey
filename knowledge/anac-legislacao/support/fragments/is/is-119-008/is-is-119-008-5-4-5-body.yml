title: Envolvimento da Tripulação de Voo
text: '5.4.5 Envolvimento da Tripulação de Voo

  5.4.5.1 Tal como acontece em sistemas de reporte bem-sucedidos, a confiança estabelecida
  entre a gestão e as tripulações de voo também é fundamental para um PAADV efetivo.

  5.4.5.2 Cabe ao operador aéreo prover garantias das intenções do PAADV, das condições para
  uso dos dados e da proteção aos tripulantes e demais funcionários da empresa, de modo que
  se obtenha o apoio do grupo de voo. Para que essa confiança no programa seja fortalecida,
  o operador deve buscar a participação de representantes do sindicato e da associação de
  pilotos da empresa, quando houver, no desenvolvimento, implementação e na operação do PAADV.

  5.4.5.3 É fundamental que todos os envolvidos no PAADV, desde gestores até tripulantes de
  voo, acordem sobre o intuito e os objetivos do programa e sob quais regras este deve operar.
  Para isso, é fundamental elaborar um documento que estabeleça claramente o escopo de atuação,
  exclusões e as condições de uso. Tal documento deve ser elaborado pelo operador em conjunto
  com o sindicato da categoria profissional e a associação de pilotos da empresa, quando houver.

  5.5 PROTEÇÃO DOS DADOS DO PAADV'
