title: Diferentes níveis de acesso poderão ser criados a critério do gestor do programa.
text: '5.5.2.3 Diferentes níveis de acesso poderão ser criados a critério do gestor do programa.

  5.5.2.4 O gestor do PAADV deve controlar a configuração do software de análise e/ou restringir
  o acesso dos integrantes do PAADV aos dados de escala de voo, a fim de salvaguardar os dados
  que possam associar uma determinada tripulação a um voo.'
