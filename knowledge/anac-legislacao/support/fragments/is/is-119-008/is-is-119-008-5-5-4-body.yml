text: '5.5.4 Restrição ao uso de dados de CVR, CARS, AIR e AIRS

  5.5.4.1 Os registros e transcrições de dados de CVR, CARS, AIR classe A e AIRS classe A
  não podem ser utilizados para propósitos que não sejam de investigação de acidentes ou incidentes.
  Conforme dispositivos estabelecidos pelo CENIPA, exceto se os registros e transcrições forem:'
