title: 5.6.1.1(a)
text: 'a) sistemas a bordo da aeronave que capturem e registrem os dados de voo (por exemplo:
  DFDR ou equivalente), bem como permitam o armazenamento dessas informações em uma mídia
  física (por exemplo: QAR), ou ainda o envio automatizado por meio de rede sem fio dos dados
  registrados em uma estação terrestre;'
