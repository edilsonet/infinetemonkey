text: '5.6.2.4.1 Gestor do PAADV

  5.6.2.4.1.1 O operador aéreo deve garantir que o seu PAADV seja conduzido por um gestor
  com alto nível de integridade e imparcialidade, boa capacidade de gestão, análise, conhecimento
  prático e compreensão das operações de voo. Adicionalmente, que seja capaz de estabelecer
  relacionamento eficaz com a gestão das áreas de Segurança Operacional, Operações de Voo
  e Manutenção, e demais áreas ou entidades envolvidas com o programa.

  5.6.2.4.1.2 O Gestor do PAADV possui a seguintes responsabilidades e atribuições:'
