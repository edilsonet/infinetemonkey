text: '5.6.2.4.3 Intérprete(s) Técnico(s)

  5.6.2.4.3.1 O intérprete técnico deve possuir visão sistêmica e conhecimento do ambiente
  operacional geral. Deve entender a complexidade da operação e auxiliar na adaptação e criação
  de novos eventos para garantir que o operador aéreo tenha um conjunto de procedimentos para
  cobrir adequadamente os aspectos relevantes relacionados à segurança da aviação e que possam
  ser monitorados através de um PAADV.

  5.6.2.4.3.2 O(s) intérprete(s) técnico(s) possui as seguintes responsabilidades e atribuições:'
