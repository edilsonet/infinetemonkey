text: '5.6.2.4.4 Intérprete(s) de operações e manutenção

  5.6.2.4.4.1 O intérprete de operações e manutenção deve possuir conhecimento dos padrões
  operacionais (SOPs, manuais das aeronaves, MGO, rotinas operacionais e outros manuais pertinentes),
  particularidades das aeronaves e aeródromos utilizados, para uma melhor interpretação dos
  dados apresentados pelo sistema.

  5.6.2.4.4.2 O intérprete de operações e manutenção tem as seguintes responsabilidades e
  atribuições:'
