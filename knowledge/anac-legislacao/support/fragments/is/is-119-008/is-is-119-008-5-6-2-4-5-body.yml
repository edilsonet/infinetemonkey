title: Agente(s) de ligação (gatekeeper)
text: '5.6.2.4.5 Agente(s) de ligação (gatekeeper)

  5.6.2.4.5.1 Indivíduo com boas habilidades interpessoais e uma atitude positiva em relação
  à cultura de segurança. É essencial que este representante tenha a confiança da equipe e
  dos gerentes quanto à sua integridade, bom julgamento e imparcialidade.

  5.6.2.4.5.2 As pessoas designadas para a função de agentes de ligação são as únicas com
  a permissão e responsabilidade para discussões confidenciais com membros da tripulação de
  voo eventualmente envolvidos em eventos apontados pelo programa.

  5.6.2.4.5.3 Deve, obrigatoriamente, ser um piloto em exercício na organização.

  5.6.2.4.5.4 Poderá haver mais de um agente de ligação na estrutura do PAADV, sendo recomendável
  um por tipo de operação ou por tipo de aeronave.

  5.6.2.4.5.5 O operador aéreo deve assegurar que a designação dos agentes de ligação:'
