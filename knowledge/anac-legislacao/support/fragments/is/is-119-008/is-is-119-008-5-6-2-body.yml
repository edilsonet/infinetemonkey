title: Funções e responsabilidades
text: '5.6.2 Funções e responsabilidades

  5.6.2.1 As funções indicadas abaixo poderão ser acumuladas, ou mesmo poderão ser criadas
  funções adicionais, dependendo da estrutura e nível de complexidade das operações aéreas.

  5.6.2.2 Todos os membros que fazem parte da estrutura de pessoal devem receber treinamento
  e possuir experiência adequada, de acordo com sua função no PAADV e devem estar sujeitos
  a um acordo de confidencialidade.'
