text: '5.6.3.6 Em qualquer frente de trabalho, é vedada a utilização de dados para fins punitivos
  ou disciplinares dos envolvidos.

  5.6.3.7 O fluxo de trabalho deve possuir estrutura definida e utilizar ferramentas e práticas
  específicas, assim como mão-de-obra treinada, para que o detentor do programa possa monitorar
  os parâmetros registrados pelas aeronaves em voo e em solo durante as operações rotineiras.

  5.6.3.8 O fluxo de trabalho deve contribuir com estudos sob demanda que podem promover melhorias
  nos procedimentos das áreas de operações de voo, treinamento, manutenção e demais áreas
  estratégicas.

  5.6.3.9 O PAADV pode ainda atuar de forma colaborativa com os processos investigativos internos
  na empresa envolvendo segurança operacional, com a indústria da aviação, na elaboração de
  estudos ou ainda compartilhando dados que possam contribuir para a melhoria da segurança
  do sistema de aviação civil (exemplo: programas de compartilhamento de dados de voo).'
