title: Fluxo de trabalho do PAADV
text: '5.6.3 Fluxo de trabalho do PAADV

  5.6.3.1 O PAADV deve possuir caráter preventivo e estar alinhado às diretrizes previstas
  pelo SGSO da empresa, visando à melhoria contínua dos níveis de segurança operacional da
  aviação civil brasileira.

  5.6.3.2 O estabelecimento de um PAADV deve ser descrito nos manuais da empresa, os quais
  devem contemplar a metodologia de utilização, acesso e manuseio das informações extraídas
  dos gravadores de voo.

  5.6.3.3 O gestor do PAADV é responsável pelo desenvolvimento de um canal de comunicação
  com clientes internos e externos do programa, incluindo empresas congêneres e autoridades
  regulatórias, obedecendo às premissas desta IS.

  5.6.3.4 É obrigatório o estabelecimento e a manutenção de um acordo firmado entre o operador
  aéreo, o sindicato que legalmente representa os aeronautas e, quando houver, a associação
  de pilotos da empresa aérea, baseado nos limites estabelecidos nesta IS.

  5.6.3.5 Informações extraídas dos dados de voo poderão ser utilizadas para análise de informações
  estratégicas da organização, desde que obedeça aos níveis de acesso às informações previstos
  na seção 5.5 “Proteção dos dados do PAADV”, bem como mantenha alinhamento com item 5.6.3.1.'
