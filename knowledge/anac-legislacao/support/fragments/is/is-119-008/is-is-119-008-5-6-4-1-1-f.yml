title: 5.6.4.1.1(f)
text: 'f) Em caso de necessidade e havendo existência de estrutura adequada, o indivíduo envolvido
  em evento objeto de análise poderá ser convidado a participar de um debriefing, cujos objetivos
  e características devem ser os seguintes:

  I - Reuniões entre tripulação técnica e o núcleo de operações de voo, objetivando a apresentação
  de um evento específico aos tripulantes, de modo a provocar a reflexão, coleta de informações
  e a troca de conhecimentos. Tem caráter instrutivo e não punitivo;

  II - Aos tripulantes convidados para tal atividade, será assegurada máxima confidencialidade
  e privacidade para acesso aos dados de voo;

  III - Objetivar que o tripulante de voo seja um multiplicador de segurança operacional durante
  sua atividade em rota;

  IV - O agente de ligação (gatekeeper) zelará pelo integral cumprimento do protocolo para
  acesso, utilização e manuseio dos dados e parâmetros dos registradores de voo, firmado junto
  ao sindicado da categoria profissional; e

  V - Nos casos em que houver dúvidas na caracterização de erro ou violação, assim como nos
  casos de assunção desnecessária e consciente de riscos, serão tratados conforme previsto
  na seção 5.8 “Comitê de casos egrégios e acesso a informações confidenciais”.'
