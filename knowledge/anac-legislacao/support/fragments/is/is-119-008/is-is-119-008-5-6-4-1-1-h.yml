text: h) Independentemente da existência de eventos, os tripulantes poderão ter acesso aos
  dados de seus voos quando assim o solicitarem, com exceção daqueles que estiverem sob investigação.
  O operador aéreo deve especificar os procedimentos e as formas de solicitação para visualização
  de um voo em específico; e
