text: '5.6.4.1.2 Núcleo de aeronavegabilidade

  5.6.4.1.2.1 O Núcleo de aeronavegabilidade possui atribuições relacionadas à análise dos
  dados registrados pelas aeronaves durante as operações rotineiras, para fins de acompanhamento
  contínuo de itens relacionados à engenharia e manutenção de aeronaves.

  5.6.4.1.2.2 A equipe deve possuir treinamento para a manipulação de dados com objetivo voltado
  para o monitoramento de desgaste de componentes e observação de integridade e correto funcionamento
  de sistemas, assim como para as demais análises voltadas à aeronavegabilidade continuada.

  5.6.4.1.2.3 O núcleo de aeronavegabilidade possui as seguintes atribuições e tarefas:'
