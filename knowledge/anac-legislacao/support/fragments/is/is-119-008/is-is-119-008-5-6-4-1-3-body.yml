text: '5.6.4.1.3 Núcleo de eficiência e qualidade operacional

  5.6.4.1.3.1 O núcleo de eficiência e qualidade operacional possui atribuições relacionadas
  à análise dos dados, exclusivamente estatísticos, utilizando parâmetros de voo não diretamente
  relacionados à segurança operacional, com objetivo exclusivo de eficiência operacional.

  5.6.4.1.3.2 As informações trabalhadas neste núcleo, assim como os estudos e análises produzidos,
  possuem finalidade exclusivamente estatística e não podem conter informações que permitam
  o rastreio de dados de indivíduo envolvido na operação.

  5.6.4.1.3.3 Todo compartilhamento de dados brutos não processados (raw data) deverá obedecer
  a regras específicas de confidencialidade e deverá ser registrado em acordos de sigilo mútuo
  (exemplo: Non Disclosure Agreement).

  5.6.4.1.3.4 O núcleo de eficiência e qualidade operacional possui as seguintes atribuições
  e tarefas:'
