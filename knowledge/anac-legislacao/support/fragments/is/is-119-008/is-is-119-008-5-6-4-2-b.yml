text: b) As formas e os meios de contato pelos quais os tripulantes de voo serão contatados
  em função do risco identificado. Os objetivos do contato, juntamente com a abordagem das
  ações de debriefing e levantamento de informações, devem ser claros e amplamente divulgados;
