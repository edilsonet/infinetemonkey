  Figura 1: Núcleos de atuação em um Programa de Acompanhamento e Análise de Dados de Voo
  (PAADV) e fluxo de trabalho.


  5.7 CONTATO COM A TRIPULAÇÃO

  5.7.1 Há situações em que a análise dos dados do FDM em uma estação de solo pode não permitir
  um diagnóstico conclusivo do ocorrido em um determinado evento, sendo necessário obter informações
  adicionais para elucidar o contexto operacional em que o voo estava inserido.

  5.7.2 O contato com a tripulação pode ser a melhor forma de entender o “como” e o “por quê”
  o voo foi conduzido de tal forma. As informações fornecidas pela tripulação podem ser de
  grande valia para a área de segurança operacional, pois permitem uma análise mais precisa
  da ocorrência do ponto de vista do SGSO. Além disso, podem ser úteis a outros setores que
  utilizam os dados do PAADV, como operações de voo, flight standards, treinamento, dentre
  outros.

  5.7.3 O operador aéreo deve elaborar procedimentos para o contato com a tripulação, assim
  como formalizá-los em sua documentação do PAADV, e devem conter no mínimo:'
