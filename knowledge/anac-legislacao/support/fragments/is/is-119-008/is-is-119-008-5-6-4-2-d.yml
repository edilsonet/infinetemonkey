text: 'd) Os procedimentos de uso dos dados obtidos no contato com a tripulação para alimentação
  do banco de dados do PAADV e do SGSO do operador.

  5.7.4 Quando necessário, recomenda-se que o contato seja feito o quanto antes possível,
  dada a maior facilidade dos tripulantes de voo se recordarem dos detalhes do evento. Os
  questionamentos à tripulação devem ser realizados pelo agente de ligação (gatekeeper).

  5.7.5 Os meios de contato com a tripulação podem variar em função do porte do operador aéreo
  e dos meios disponíveis para tal. Diferentes tecnologias podem ser utilizadas, tais como
  e-mail, telefone, mensagem de texto, carta, reuniões presenciais ou ainda chamadas de vídeo.
  O operador aéreo deve considerar, no desenvolvimento dos procedimentos de contato, os métodos
  que melhor se adequam à realidade do PAADV da empresa.

  5.7.6 É recomendado que o operador considere o uso de ferramentas de debriefing que possuam
  visualizações ou animações durante o contato com a tripulação, facilitando a compreensão
  do cenário, tendo em vista a finalidade instrutiva desse contato.

  5.7.7 O estabelecimento de contato com a tripulação pode, potencialmente, trazer efeitos
  adversos sobre os contatados e sobre o grupo de voo de forma geral. Esses efeitos devem
  ser levados em consideração nessa tomada de decisão.

  5.8 COMITÊ DE CASOS EGRÉGIOS E ACESSO A INFORMAÇÕES CONFIDENCIAIS

  5.8.1 A cultura de segurança operacional estabelece que os indivíduos da linha de frente
  não serão punidos por atos, omissões ou decisões tomadas que sejam compatíveis com o seu
  nível de experiência.

  5.8.2 Em raras situações, no entanto, a análise de dados de voo, somadas a outras informações,
  pode sugerir que a tripulação de voo violou um procedimento ou norma de forma deliberada,
  ou ainda, assumiu, de forma consciente, um risco além do previsto para a operação.

  5.8.3 Nas situações em que houver evidências concretas de possíveis ocorrências das situações
  descritas no item 5.8.2 acima, o Gestor do PAADV deverá instaurar o Comitê de Casos Egrégios.

  5.8.4 Compete ao Comitê de Casos Egrégios, única e exclusivamente, julgar se o evento em
  questão traz evidências consistentes de violação das regras e normas vigentes e assunção
  de risco inaceitável, e se, por conseguinte, é recomendado pelo Comitê a quebra da confidencialidade
  e encaminhamento do caso para as medidas administrativas cabíveis.

  5.8.5 O acordo entre o operador aéreo, o sindicato que legalmente representa os pilotos
  da empresa, quando houver, deve prever a criação do Comitê de Casos Egrégios, composto por
