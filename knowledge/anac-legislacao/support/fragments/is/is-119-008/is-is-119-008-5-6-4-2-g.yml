text: 'g) Representante do Departamento de Engenharia e Manutenção da empresa.

  5.8.6 Os prazos para convocação, os procedimentos, regras para a deliberação e as condições
  de compartilhamento de informações confidenciais devem estar estabelecidos no protocolo
  firmado entre o operador e o sindicato da categoria profissional e associação de pilotos,
  quando houver.

  5.8.7 O operador deve realizar o registro formal dos comitês de casos egrégios em ata sem
  que as identidades dos tripulantes técnicos envolvidos no voo sob análise constem desses
  registros, independentemente da ação tomada.

  5.9 TERCEIRIZAÇÃO DO PROGRAMA

  5.9.1 O detentor de certificado pode contratar de terceiros a operação de um PAADV. Contudo,
  caso opte por terceirizar a operação de seu programa, o PAADV deve atender a todos os aspectos
  apresentados nesta IS. Além disso, o operador deve manter total responsabilidade pela manutenção
  do programa.'
