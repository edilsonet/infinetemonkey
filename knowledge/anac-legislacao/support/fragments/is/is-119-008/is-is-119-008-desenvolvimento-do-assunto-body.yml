title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 APLICABILIDADE

  5.1.1 Esta Instrução Suplementar é aplicável aos detentores de certificado de operador aéreo
  (COA) que operem sob o RBAC nº 121 ou RBAC nº 135, e que operem aviões cujo peso máximo
  de decolagem aprovado seja superior a 27.000 kg.

  5.1.2 Esta IS poderá ser utilizada por operadores que voluntariamente queiram desenvolver
  um PAADV contemplando as aeronaves de sua frota, ainda que com aviões com peso máximo de
  decolagem aprovado igual ou inferior a 27.000 kg.

  5.2 ESTRUTURA DO PAADV

  5.2.1 Para ser considerado adequado, o Programa de Acompanhamento e Análise de Dados de
  Voo (PAADV) deverá contemplar os tópicos e conteúdo descritos nesta Instrução Suplementar.'
