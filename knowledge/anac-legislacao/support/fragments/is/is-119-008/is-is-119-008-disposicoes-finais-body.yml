title: Disposições Finais
text: 'Disposições Finais

  7.1 Um Programa de Acompanhamento e Análise de Dados de Voo (PAADV) já estabelecido e em
  execução que tenha sido desenvolvido com base na IAC 119-1005 continuará válido e aceitável
  pela ANAC por um período máximo de 6 (seis) meses a contar da data de vigência desta IS.
  Dentro desse período, o operador deverá adequar o seu programa ao previsto nesta IS.

  7.2 Após a data de vigência desta Instrução Suplementar, os novos PAADV deverão ser desenvolvidos
  e implementados seguindo as diretrizes e instruções presentes nesta IS.

  7.3 Os casos omissos serão dirimidos pela SPO.'
