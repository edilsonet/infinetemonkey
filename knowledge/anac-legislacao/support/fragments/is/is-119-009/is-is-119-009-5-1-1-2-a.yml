text: 'a) Conforme definições constantes nos parágrafos 135.145(a) e 135.145(b) do RBAC nº
  135.

  5.1.1.3 Não faz parte do escopo desta IS a definição de critérios para realização de voos
  de validação requeridos para autorizações especiais (ETOPS, RNP AR APCH, etc.), que são
  tratados em normativos específicos. Entretanto, o operador requerente poderá aproveitar
  os voos de ava


  5.2 Voo de Avaliação'
