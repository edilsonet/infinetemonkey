title: 5.2.1.4(c)
text: 'c) as áreas a serem demonstradas durante os voos de avaliação operacional.

  5.2.1.5 Os voos de avaliação operacional deverão ser condizentes com a proposta do requerente.
  Dessa forma, caso a proposta inclua, por exemplo, operações internacionais ou sobre o mar,
  os voos de avaliação operacional também deverão contemplar operações internacionais ou sobre
  o mar.'
