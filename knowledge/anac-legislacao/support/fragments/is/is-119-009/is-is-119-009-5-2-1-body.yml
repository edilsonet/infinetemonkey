text: '5.2.1 Generalidades

  5.2.1.1 O voo de avaliação operacional consiste em uma atividade prática que objetiva demonstrar
  a capacidade do requerente em conduzir suas operações de maneira segura, seguindo todos
  os normativos aplicáveis e procedimentos operacionais relacionados à manutenção, operações,
  despacho e acompanhamento ou monitoramento de voo, regras de segurança e artigos perigosos.

  5.2.1.2 Além da demonstração de capacidades, o voo de avaliação operacional possui a finalidade
  de permitir a aquisição de experiência com a aeronave e com a operação proposta por parte
  do requerente.

  5.2.1.3 O voo de avalia&ccccedil;ão operacional deverá ser conduzido o mais próximo possível
  da realidade, ou seja, como o requerente efetivamente realizará suas operações após a conclusão
  do processo de certificação.'
