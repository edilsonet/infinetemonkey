title: O transporte de passageiros durante o voo de avaliação operacional é proibido.
text: '5.2.2.1 O transporte de passageiros durante o voo de avaliação operacional é proibido.

  5.2.2.2 Para os requerentes que já tenham autorização para transportar carga comercialmente,
  o transporte de carga é permitido. Aos requerentes que não possuam tal autorização, não
  será dada permissão para o transporte.'
