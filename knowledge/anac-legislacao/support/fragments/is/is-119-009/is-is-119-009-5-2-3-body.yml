text: '5.2.3 Métodos de demonstração aceitáveis

  5.2.3.1 Os requerentes deverão demonstrar capacidade de conduzir as operações de voo e manutenção,
  em conformidade com os requisitos aplicáveis e com os procedimentos operacionais definidos,
  aprovados ou aceitos durante o processo de certificação.

  5.2.3.2 A demonstração poderá, além da execução do voo propriamente dito, se valer de recursos
  adicionais, como simuladores de voo, análises realizadas pela engenharia de operações, pesquisas
  operacionais, tabletop exercises e outros, desde que:'
