section_id: 5.2.4.2
section_title: 'O plano deve conter, no mínimo:'
subsection_id: m
cite: 5.2.4.2(m)
title: 5.2.4.2(m)
text: 'm) outras informações consideradas necessárias pela ANAC em virtude do processo de
  certificação.

  5.2.4.3 Eventuais alterações no plano deverão ser apresentadas à ANAC com antecedência suficiente
  para sua avaliação e aprovação. Não será admitida a utilização de um plano de execução que
  não tenha previamente sido aprovado pela ANAC.

  5.3.4.4 Recomenda-se que o operador preveja a necessidade de acionamento de pessoal e de
  recursos para lidar com diferentes cenários durante a execução do voo de avaliação operacional,
  a exemplo de uma operação real.

  5.3.4.5 De acordo com os objetivos pretendidos com o voo, a ANAC poderá não acompanhar na
  íntegra a execução do voo de avaliação. Nessas situações, deverá ocorrer um alinhamento
  prévio sobre quais etapas serão acompanhadas e quais etapas o solicitante poderá realizar
  sem esse acompanhamento.'
