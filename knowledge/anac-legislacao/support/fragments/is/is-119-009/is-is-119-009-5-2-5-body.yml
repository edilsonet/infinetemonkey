text: '5.2.5 Cenários do voo de avaliação operacional

  5.2.5.1 Durante a execução do voo, a critério da ANAC, serão colocados cenários para que
  o requerente tenha a oportunidade de demonstrar a preparação da empresa como um todo em
  lidar com as situações de maneira adequada e em conformidade com os procedimentos operacionais
  constantes nos manuais da empresa.

  5.2.5.2 A elaboração dos cenários visará a simulação de uma operação normal e condizente
  com a proposta do requerente. Contudo, cenários de situações não rotineiras ou de emergências
  poderão ser colocados pela ANAC. Os cenários possíveis incluem mas não se restringem a:'
