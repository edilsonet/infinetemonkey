title: 5.2.6.1(c)
text: 'c) Extensão - Situação na qual o voo é estendido além do planejado em comum acordo
  entre o requerente e a equipe de servidores da ANAC, com o intuito de atingir o objetivo
  da avaliação, quando isso não for possível dentro do plano de execução aprovado.

  Nota: Os limites de extensão aceitáveis para cada etapa deverão estar previstos no plano
  de execução do voo de avaliação.'
