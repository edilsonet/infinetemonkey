title: 5.2.6.1(d)
text: 'd) Performance deficiente - Situação na qual o voo de avalição é encerrado, conforme
  planejado ou de maneira antecipada por iniciativa da equipe de servidores da ANAC, uma vez
  que o requerente não apresente demonstrações de desempenho condizentes com a sua proposta.


  5.3 Carga Horária

  5.3.1 Os quantitativos de carga horária aqui descritos referem-se ao “tempo de voo” definido
  no RBAC n° 01, e não incluem as ações anteriores e posteriores necessárias à execução do
  voo.'
