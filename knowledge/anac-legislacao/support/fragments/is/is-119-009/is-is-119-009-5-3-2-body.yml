title: 'Para a definição da carga horária do voo de avaliação operacional, serão adotados
  os valores de referência abaixo:'
text: '5.3.2 Para a definição da carga horária do voo de avaliação operacional, serão adotados
  os valores de referência abaixo:

  Cenário

  Voos de avaliação operacional inicial

  100 horas*

  25 horas***

  Voos de avaliação para operações

  25 horas**

  6 horas****

  Voos de avaliação operacional em aviões materialmente modificados

  20 horas

  4 horas****

  *: das 100 horas, pelo menos 10 horas devem ser noturnas.

  **: das 25 horas, pelo menos 5 horas devem ser noturnas.

  ***: das 25 horas, pelo menos 5 horas devem ser noturnas, contemplar 5 procedimentos de
  aproximação por instrumentos e as últimas 5 horas devem ser acompanhadas pela ANAC

  ****: dessas horas, as últimas 2,5 horas devem ser acompanhadas pela ANAC'
