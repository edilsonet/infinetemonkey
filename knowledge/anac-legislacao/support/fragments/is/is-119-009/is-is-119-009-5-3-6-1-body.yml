title: 'O requerente deverá adotar a tabela a seguir como orientação quanto às situações passíveis
  de redução da carga horária:'
text: '5.3.6.1 O requerente deverá adotar a tabela a seguir como orientação quanto às situações
  passíveis de redução da carga horária:

  Situação

  Redução

  Operações segundo RBAC nº 121

  Redução

  Operações segundo RBAC nº 135

  Novo tipo de aeronave não utilizada previamente em operações segundo RBAC n° 121 ou nº 135;
  ou

  Certificação inicial de operador sem experiência com aeronave de mesma categoria e classe.

  0 horas

  0 horas

  Operador certificado para operações segundo RBAC n° 135 e sem experiência em operações segundo
  RBAC n° 121 e vice-versa.

  8 horas

  3 horas

  Operador certificado sem experiência com aeronave de mesma categoria e classe.

  10 horas

  4 horas

  Certificação inicial de operador com experiência com aeronave de mesma categoria e classe.

  10 horas

  4 horas

  Operador certificado com experiência com aeronave da mesma categoria e classe.

  13 horas

  5 horas

  5.3.6.2 A aplicação da redução da carga horária deverá ser solicitada formalmente pelo requerente
  junto ao plano de execução do voo de avaliação operacional, acompanhado de documentação
  que comprove a existência da situação que enseja a redução.

  5.3.6.3 A ANAC poderá aprovar reduções de carga horária diferentes do solicitado pelo requerente,
  caso conclua que isso é necessário para assegurar a adequada cobertura das áreas e objetivos
  do voo de avaliação operacional.'
