title: 'A definição da carga horária aplicável à solicitação será definida segundo a sequência
  de etapas descrita a seguir:'
text: '5.3.7.1 A definição da carga horária aplicável à solicitação será definida segundo
  a sequência de etapas descrita a seguir:

  I. Avaliação da solicitação do requerente visando identificar a complexidade da operação
  pretendida e as diferenças em relação à operação atual, incluindo potenciais impactos e
  riscos;

  II. Definição das áreas e objetivos da avaliação, utilizando como referência o Apêndice
  0 desta IS e, se for o caso, da quantidade de horas necessárias à aquisição de experiência
  operacional dos tripulantes da empresa;

  III. Definição da carga horária de referência considerando o quadro constante em 5.3.2;

  IV. Aplicação dos critérios de redução de carga seguindo as orientações do quadro constante
  em 5.3.6.1;

  V. Análise do plano de execução do voo de avaliação operacional considerando todas as informações
  das etapas anteriores visando verificar se o plano contém todas as informações e documentos
  necessários, se é compatível com a proposta do requerente, e se os parâmetros adotados para
  a definição da carga horária são adequados e, por fim, se o plano atenderá a todos os objetivos
  do voo de avaliação; e

  VI. Aprovação do plano ou comunicação das correções necessárias ao requerente.

  5.4 Solicitação'
