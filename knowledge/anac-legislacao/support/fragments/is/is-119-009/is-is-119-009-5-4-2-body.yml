cite: 5.4.2
title: 'Durante a solicitação, recomenda-se que o requerente siga a sequência de etapas descritas
  a seguir:'
text: '5.4.2 Durante a solicitação, recomenda-se que o requerente siga a sequência de etapas
  descritas a seguir:

  I - Reunião de orientação prévia, etapa na qual o requerente terá oportunidade de esclarecer
  todas as dúvidas relativas ao voo de avaliação operacional, bem como acordar previamente
  com a ANAC as diretrizes que serão utilizadas durante a avaliação;

  II - Apresentação do plano de execução do voo de avaliação operacional, conforme descrito
  em 5.2.4;

  III - Interação com a ANAC para eventuais alterações, correções e esclarecimentos que eventualmente
  sejam necessários;

  IV - Execução do voo de avaliação operacional conforme descrito e aprovado no plano de execução;
  e

  V - Finalização do voo de avaliação operacional com apresentação dos resultados por parte
  da ANAC.'
