title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.1.1 Característica operacional: equivalente à definição da expressão “Características
  de certificação de operador de transporte aéreo público” do RBAC n° 01, ou seja, aquelas
  associadas ao arranjo operacional descrito pelo operador a ser certificado, conforme o desenho
  de suas operações, indicando se serão agendadas (regulares) e/ou não agendadas (não regulares),
  nacionais e/ou internacionais e se as aeronaves empregadas atendem aos requisitos previstos
  no RBAC nº 135 ou 121, ou outras características que direcionam para a certificação do operador
  aéreo.

  4.1.2 Ferry flight: voo realizado com o propósito de retornar uma aeronave para a base,
  reposicionar uma aeronave de uma localidade para outra ou movimentar uma aeronave de ou
  para a base de manutenção.

  4.1.3 Tabletop exercises: a realização de um voo simulado com o grau de realismo que permita
  a execução de procedimentos e rotinas conforme seriam executados em um voo real.

  4.1.4 Voo de reposicionamento: Os voos de reposicionamento são os realizados para deslocar
  a aeronave de um ponto fora de uma rota normal, como por exemplo, da fábrica para a base
  de operações, ou da oficina.


  4.2 Lista de siglas (em ordem alfabética)

  ACAS - Airborne Collision Avoidance System.

  ACR - Ação Corretiva Retardada.

  ATS - Serviço de Tráfego Aéreo (Air Traffic Service).

  CDL - Lista de Desvios de Configuração (Configuration Deviation List).

  EFB - Electronic Flight Bag.

  ETOPS - Operações Prolongadas (Extended Operations).

  EFVS - Sistema Intensificador de Visibilidade em Voo (Enhanced Flight Vision System).

  HUD - Head-Up Display.

  IFR - Regras de Voo por Instrumento (Instrument Flight Rules).

  MEL - Lista de Equipamentos Mínimos (Minimum Equipment List).

  PA - Piloto Automático.

  PED - Dispositivo Eletrônico Portátil (Portable Electronic Device).

  RBAC - Regulamento Brasileiro da Aviação Civil.

  RBHA - Regulamento Brasileiro de Homologação Aeronáutica.

  RNP AR APCH - Operação de aproximação RNP com autorização requerida.

  TCAS - Traffic Alert and Collision Avoidance System.

  VFR - Regras de Voo Visual (Visual Flight Rules).'
