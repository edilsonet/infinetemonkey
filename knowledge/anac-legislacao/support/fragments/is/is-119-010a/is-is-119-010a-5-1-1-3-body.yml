text: '5.1.1.3 Esta IS não inclui instruções relativas a treinamentos associados ao Sistema
  de Gerenciamento de Segurança Operacional - SGSO.

  5.1.1.4 Esta IS não inclui instruções relativas ao programa de treinamento de artigos perigosos.
  As regras relativas ao transporte de artigos perigosos por via aérea são apresentadas no
  RBAC nº 175, e as instruções suplementares (IS) nº 175-002 e 175-007 apresentam orientações
  sobre o treinamento de artigos perigosos.'
