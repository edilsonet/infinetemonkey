title: Cada operador aéreo deve elaborar o seu próprio PTM, adequado à sua operação.
text: '5.1.1.5 Cada operador aéreo deve elaborar o seu próprio PTM, adequado à sua operação.

  5.1.1.6 Como a presente IS descreve um meio de cumprimento aceitável, mas não único, a palavra
  “deve”, quando utilizada, somente se aplica ao operador aéreo que escolha seguir as instruções
  desta IS, que, então, deve ser seguida integralmente.

  5.1.1.7 Esta IS aborda e contém assuntos adicionais aos requisitos, os quais são determinações
  obrigatórias. A Anac tem conhecimento de que o treinamento adicional descrito nesta IS excede
  o requerido pelas seções 121.375 do RBAC nº 121 e 135.433 do RBAC nº 135, mas entende que
  é necessário prover esses exemplos como um roteiro para um programa completo e abrangente,
  direcionado para a segurança operacional da aviação civil. Se o operador optar por elaborar
  um programa de treinamento com treinamentos adicionais, mas não relacionados a um regulamento
  ou requisito específico, somente aqueles treinamentos requeridos pelos regulamentos ou requisitos
  estarão sujeitos à análise da Anac. Um meio de elaborar esse tipo de programa seria separar
  os assuntos de treinamento regulados dos não regulados dentro do manual que contém o programa
  de treinamento.

  5.1.1.8 Para o caso de empresas que tenham ou pretendam ter certificação segundo mais de
  um RBAC, por exemplo RBAC nº 121 e RBAC nº 145, é aceitável a elaboração de apenas um programa
  de treinamento que atenda a ambos os regulamentos, desde que isso esteja claramente identificado.'
