kind: is
document: is-119-010a
family: '119'
section_id: 5.1.2.6
section_title: 'O operador aéreo deve garantir que o programa de treinamento seja reavaliado
  periodicamente quanto à necessidade de sua revisão, para:'
subsection_id: b
cite: 5.1.2.6(b)
title: 5.1.2.6(b)
text: 'b) verificar se o programa está atualizado e adequado ao tipo de manutenção que está
  sendo executada, pois a evolução do programa de manutenção de aeronave, assim como as instruções
  de aeronavegabilidade continuada e demais documentos de serviço e dados técnicos (exemplo:
  Service Bulletins) gerados pelos detentores de projeto - muitas vezes tornados mandatórios
  por Diretrizes de Aeronavegabilidade - frequentemente introduzem Requisitos de Treinamento
  adicionais em função de técnicas ou equipamentos específicos para atender a esses documentos.'
