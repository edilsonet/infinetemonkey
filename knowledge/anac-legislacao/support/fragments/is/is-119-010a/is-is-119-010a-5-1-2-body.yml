text: '5.1.2 Orientações gerais

  5.1.2.1 A pessoa que pretende ser certificada como operador de serviço de transporte aéreo
  conforme RBAC nº 119 deve submeter um PTM de seu pessoal para aprovação. da Anac. Esse programa
  de treinamento deve assegurar que as pessoas envolvidas com Funções de Manutenção sob o
  Certificado de Operador Aéreo - COA sejam capazes de executar as tarefas que lhes forem
  designadas.

  Nota 1: o PTM abrange ações de manutenção preventiva mesmo que ao longo desta Instrução
  Suplementar seja utilizado o termo “manutenção” isoladamente.

  Nota 2: o PTM deve abranger inclusive, quando for o caso, treinamento para piloto que executa
  manutenção preventiva e respectiva aprovação para retorno ao serviço considerando os parágrafos
  43.3(g)-I e 43.7(f)-I do RBAC nº 43.

  5.1.2.2 As pessoas detentoras de licença da Anac como Mecânicos de Manutenção Aeronáutica
  - MMA podem adquirir o conhecimento teórico por meio de cursos de familiarização ou manutenção
  e reparo de artigos (produtos aeronáuticos) para os quais se especializam. A habilidade
  inicial básica é geralmente adquirida por meio de treinamento formal, tal como em um CIAC,
  ou de experiência prática específica trabalhando sob supervisão de um mecânico mais experiente
  habilitado pela Anac (treinamento em serviço registrado conforme subseção 5.3.8 desta IS).
  A experiência inicial pode variar substancialmente de pessoa para pessoa, bem como a experiência
  acumulada, em decorrência do tipo ou do nível de complexidade de treinamentos subsequentes
  (recorrentes). Um operador aéreo precisa ministrar treinamentos iniciais e recorrentes adequados
  para assegurar que seu pessoal seja capaz de executar as tarefas designadas.

  5.1.2.3 As seções 121.375 do RBAC nº 121 e 135.433 do RBAC nº 135 requerem que cada operador
  aéreo estabeleça um programa de treinamento para as pessoas envolvidas no processo de manutenção
  sob autorização do operador aéreo. Existem várias categorias de funcionários de um operador
  aéreo, com uma variedade de especialidades. Esse programa de treinamento aumenta a segurança
  operacional da aviação civil por assegurar a cada pessoa a plena Competência para executar
  a tarefa a ela designada.'
