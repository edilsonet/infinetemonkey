title: Requisitos relativos aos manuais de operadores aéreos
text: '5.1.3 Requisitos relativos aos manuais de operadores aéreos

  5.1.3.1 O PTM é parte integrante do sistema de documentos de segurança operacional (RBAC
  121.133 e RBAC 135.21). Pode ser apresentado como um volume independente ou como um capítulo
  específico do sistema de manuais de manutenção do operador aéreo.'
