section_id: 5.1.4.4
section_title: 'O programa de treinamento de um operador aéreo deve incluir o seguinte:'
subsection_id: e
cite: 5.1.4.4(e)
title: 5.1.4.4(e)
text: 'e) treinamento corretivo, para corrigir deficiências de Competência detectadas pelo
  operador aéreo (ver subseção 5.2.6 desta IS).

  5.1.4.5 Os PTM de diferentes operadores aéreos podem variar em número de cursos, conteúdo,
  carga horária, intervalo para recorrência (determinado em dias, meses ou anos), métodos
  de treinamento e fontes. Por exemplo, um operador aéreo de grande porte pode ter cursos
  de Doutrinação separados para técnicos, inspetores, gerentes e supervisores enquanto outro
  operador aéreo, de pequeno porte, poderia ter somente um curso de Doutrinação que seja adequado
  para todo o seu pessoal, inclusive pessoal temporário.

  5.1.4.6 Como produto do PTM, o operador aéreo deve incluir no documento a grade dos treinamentos
  e cursos programados, com seus respectivos conteúdos, carga horária, método de ensino e
  instituição ou instrutor responsável pelo curso.

  5.1.4.7 A Anac estabelece as seguintes questões para verificar se o PTM está em conformidade
  com o requisito de assegurar que cada pessoa envolvida com Funções de Manutenção esteja
  treinada ou seja capaz de executar o que lhe foi designado:'
