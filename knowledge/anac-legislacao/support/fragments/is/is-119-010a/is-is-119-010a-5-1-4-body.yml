title: Escopo e complexidade do PTM
text: '5.1.4 Escopo e complexidade do PTM

  5.1.4.1 A finalidade do programa de treinamento, tanto o inicial quanto o recorrente, é
  de assegurar que as pessoas do operador aéreo envolvidas com Funções de Manutenção sejam
  capazes de executar as tarefas designadas. Entende-se tarefa designada como aquela atribuída
  à pessoa pelo operador aéreo detentor de autorização para sua execução.

  5.1.4.2 O PTM de um operador aéreo deve ser baseado nas necessidades e características de
  sua operação. Na elaboração de seu PTM, cada operador aéreo deve considerar o tamanho de
  suas instalações, a complexidade de suas operações, as tarefas associadas com cada Função
  de Manutenção e os níveis de habilidade e experiência de seu pessoal. Portanto, o PTM de
  um dado operador aéreo deve ser diferente do dos demais.

  5.1.4.3 O operador aéreo deve desenvolver procedimentos para determinar o treinamento requerido
  para cada pessoa. Considerando que nem todas as pessoas requerem o mesmo nível de treinamento,
  para facilitar a elaboração dos Requisitos de Treinamento e os cursos a serem ministrados,
  o operador aéreo pode fazer o planejamento desses cursos baseado na separação do pessoal
  em categorias.'
