title: Treinamento de Doutrinação inicial
text: '5.2.2 Treinamento de Doutrinação inicial

  5.2.2.1 O treinamento de Doutrinação é um treinamento essencial para todo o pessoal do operador
  aéreo. O objetivo e a complexidade desse treinamento podem variar, baseando-se na posição,
  cargo ou atividade designada para cada pessoa. O operador aéreo deve determinar a complexidade
  requerida nesse treinamento para cada posição, cargo ou atividade por meio do processo de
  avaliação de necessidades, descrito na subseção 5.3.2 desta IS.'
