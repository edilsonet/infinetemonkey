section_id: 5.2.3.6
section_title: 'Sempre que uma nova informação for introduzida nos temas de treinamento técnico
  inicial:'
subsection_id: b
cite: 5.2.3.6(b)
title: 5.2.3.6(b)
text: 'b) para os já contratados, deve ser provido um treinamento adicional resumido contendo
  a nova informação. Alternativamente, a informação adicional pode ser dada ao pessoal existente
  por meio de treinamento técnico recorrente contendo a nova informação.

  5.2.3.7 O tempo dedicado ao treinamento técnico inicial pode variar, dependendo do nível
  de experiência das pessoas e das Competências associadas ao trabalho ou tarefas designadas.
  Assim, o operador aéreo deve: estabelecer uma carga horária mínima para todas as pessoas
  de um cargo específico, seja por treinamento dado pelo próprio operador aéreo, seja para
  conhecimento adquirido por meio de outras fontes; ou, em vez de estabelecer uma carga horária
  mínima para treinamento técnico inicial, avaliar a necessidade de treinamento técnico inicial
  baseado em resultados dos testes de habilidade e conhecimento. Em qualquer caso, o programa
  de treinamento do operador aéreo deve assegurar que a pessoa seja capaz de executar satisfatoriamente
  os trabalhos ou tarefas a ela designados.'
