text: '5.2.3 Treinamento técnico inicial

  5.2.3.1 Os Requisitos de Treinamento técnico inicial devem buscar prover ao pessoal as Competências
  adequadas requeridas para executar devidamente as tarefas designadas.

  5.2.3.2 A avaliação de necessidades é a base para determinar os Requisitos de Treinamento
  técnico inicial (e recorrente) de uma pessoa. Assim, o operador aéreo deve ter procedimentos
  para determinar o escopo e a profundidade do treinamento técnico inicial que sejam baseados
  em cada função designada e na experiência e Competência de cada Funcionário Técnico (estas
  são estabelecidas pela avaliação de necessidades, conforme seção 5.3.2 desta IS).

  5.2.3.3 No desenvolvimento dos cursos de treinamento técnico inicial, o operador aéreo pode
  levar em conta que raramente as pessoas têm o mesmo nível de treinamento, experiência e
  habilidade. Por exemplo, para pessoal técnico, um operador aéreo pode desejar ter cursos
  separados para:'
