title: Treinamento técnico inicial especializado
text: '5.2.4 Treinamento técnico inicial especializado

  5.2.4.1 O operador aéreo deve ter procedimentos para identificar tarefas de manutenção que
  requerem habilidades especiais ou que têm complexidade que requerem o desenvolvimento de
  treinamento técnico especializado para garantir a capacitação. Algumas áreas que podem requerer
  treinamento especializado incluem: inspeção boroscópica, reparos em estruturas não-metálicas
  (compósitos), aplicação de plasma spray, técnicas especiais de inspeção de aeronave ou de
  testes, como teste por Ensaios Não Destrutivos - END, operações especiais de usinagem, operações
  complexas de soldagem e operações complexas de montagem.

  5.2.4.2 Pessoas que já possuem um treinamento especializado e desenvolvem competência nessas
  tarefas deveriam ser capazes de transmitir o conhecimento a outros.

  5.2.4.3 O PTM do operador aéreo deve atender aos Requisitos de Treinamento técnico especializado
  inicial de qualquer tarefa para a qual o operador aéreo determine que esse treinamento seja
  requerido.'
