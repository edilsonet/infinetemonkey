title: Nem todas as tarefas designadas terão os mesmos Requisitos de Treinamento.
text: '5.2.5.3 Nem todas as tarefas designadas terão os mesmos Requisitos de Treinamento.

  5.2.5.4 O operador aéreo pode também querer dispor de um procedimento para determinar quando
  um treinamento recorrente não é necessário para execução de uma tarefa.

  5.2.5.5 O operador aéreo deve ter procedimentos para determinar o tipo e a frequência (em
  dias, meses ou anos) do treinamento recorrente para cada um dos seus Funcionários Técnicos
  por meio da avaliação de necessidades.'
