title: Treinamento corretivo
text: '5.2.6 Treinamento corretivo

  5.2.6.1 Um operador aéreo deve ter procedimentos para determinar os Requisitos de Treinamento
  individual, inclusive os casos de necessidade de treinamento corretivo. O operador aéreo
  deve utilizar os procedimentos de treinamento corretivo para retificar, o quanto antes,
  a falta de habilidade ou conhecimento demonstrada por um Funcionário Técnico.

  5.2.6.2 Em algumas ocasiões, o treinamento corretivo pode consistir em uma pessoa com conhecimentos
  adequados repassando os procedimentos por meio de treinamento em serviço (on-the-job-training
  - OJT).

  5.2.6.3 O treinamento corretivo deve ser utilizado para imediata correção de uma deficiência
  de habilidade ou conhecimento, e pode ser focado em apenas um Funcionário Técnico. Dado
  o caráter imediato, o operador aéreo não necessita, por exemplo, esperar formar um grupo
  para executar um treinamento corretivo.

  5.2.6.4 Um treinamento corretivo eficaz deve mostrar à pessoa o que aconteceu, por que aconteceu
  e, de um modo positivo, como deveria ter sido feito e como evitar que o erro aconteça novamente.

  5.3 Componentes básicos do programa de treinamento'
