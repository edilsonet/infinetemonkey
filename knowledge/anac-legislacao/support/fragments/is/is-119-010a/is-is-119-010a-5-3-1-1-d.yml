title: 5.3.1.1(d)
text: d) medida da eficácia. Para evitar a potencial designação de uma pessoa não adequadamente
  qualificada para execução de Funções de Manutenção, o programa de treinamento pode incluir
  um processo para medir continuamente a eficácia do programa de treinamento como um todo
  e dos cursos individualmente;
