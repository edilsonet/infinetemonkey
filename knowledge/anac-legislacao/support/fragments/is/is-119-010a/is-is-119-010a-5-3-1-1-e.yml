cite: 5.3.1.1(e)
title: 5.3.1.1(e)
text: e) documentação do treinamento. O operador aéreo deve ter procedimentos para documentar
  o treinamento de cada pessoa. Isso inclui estabelecer o conteúdo dos registros de treinamento
  e de um sistema para registrar, acessar e reter os registros de treinamento por, no mínimo,
  5 (cinco) anos após o término do vínculo contratual; e
