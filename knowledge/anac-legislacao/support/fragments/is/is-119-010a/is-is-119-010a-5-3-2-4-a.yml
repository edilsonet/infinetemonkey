title: 5.3.2.4(a)
text: a) A descrição do programa deve incluir os processos que o operador aéreo irá usar para
  identificar seus Requisitos de Treinamento que assegurem que cada pessoa designada para
  executar Função de Manutenção ou envolvida com Funções de Manutenção seja capaz de executar
  adequadamente o trabalho.
