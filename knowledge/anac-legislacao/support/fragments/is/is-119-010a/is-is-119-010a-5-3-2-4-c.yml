cite: 5.3.2.4(c)
title: 5.3.2.4(c)
text: c) A avaliação de necessidades de treinamento é uma análise metódica das tarefas associadas
  com as funções de manutenção. Essa análise envolve a identificação das Competências necessárias
  para o adequado preenchimento dos cargos que executem funções de manutenção. Adicionalmente,
  na determinação dos Requisitos de Treinamento, um operador aéreo deve analisar a natureza
  da estrutura de seu negócio e suas operações.
