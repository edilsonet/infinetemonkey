title: 5.3.2.4(e)
text: e) A avaliação de necessidades repassa os Requisitos de Treinamento do operador aéreo
  dentro do contexto da Competência do pessoal existente e das tarefas associadas com autorizações
  de trabalho específicas. Baseado no resultado da avaliação de necessidade, um operador aéreo
  pode desenvolver e revisar suas matérias e seus cursos.
