title: 5.3.2.5(b)
text: b) O programa de treinamento deve descrever como um operador aéreo mantém o funcionário
  atualizado, e como ele recebe o treinamento inicial, recorrente e corretivo de acordo com
  os parágrafos 5.2.3, 5.2.4, 5.2.5 e 5.2.6. Esses procedimentos devem ser documentados e
  formar a base do programa de treinamento.
