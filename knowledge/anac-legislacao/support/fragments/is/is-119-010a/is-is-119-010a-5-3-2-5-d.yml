text: 'd) Alguns dos métodos disponíveis para avaliar a Competência do Funcionário Técnico
  versus vantagens por método estão listados na Tabela 2.


  TABELA 2. Avaliação de Competência

  Método

  Vantagens x desvantagens

  Prova formal

  Elaboração de uma prova formal escrita, com critério de aprovação. Embora seja um método
  eficaz para avaliar conhecimento, ele não determina necessariamente se uma pessoa é capaz
  de aplicar o conhecimento à tarefa que lhe foi atribuída.

  Certificado

  A posse de um certificado pode ser um pré-requisito para algumas posições especializadas.
  E ainda, a certificação de qualificações ou do treinamento fornecido por uma organização
  de ensino certificada pela Anac (como um CIAC, conforme o RBAC nº 141) ou uma entidade reconhecida
  pelo MEC pode medir o conhecimento de uma pessoa. Entretanto, ele não avalia necessariamente
  a habilidade da pessoa em aplicar aquele conhecimento à tarefa atribuída.

  Conclusão de um curso de treinamento

  Uma análise da documentação ou instrução ministrada pode ser usada para avaliar o conhecimento
  de uma pessoa em um assunto. A conclusão de cursos de treinamento é mais útil quando existe
  uma verificação por meio de teste ou demonstração de que a pessoa satisfaz os objetivos
  do curso. Entretanto, a conclusão satisfatória de um treinamento não se traduz necessariamente
  em habilidade para executar uma tarefa.


  Avaliação

  prática

  Uma avaliação prática permite à pessoa demonstrar habilidade em um ambiente controlado que
  seja similar a uma situação, ou parte de uma situação, encontrada na vida real. Tal avaliação
  pode, por exemplo, permitir ao avaliador focalizar as etapas críticas de um longo processo,
  sem executar todo processo. Este pode ser um meio eficaz de determinar a Competência de
  uma pessoa. Entretanto, a avaliação pode depender da habilidade da pessoa que elabora o
  mecanismo de avaliação prática.

  Avaliação

  OJT

  Esse tipo de avaliação deve ser objetivamente baseado e julgado pelo cumprimento, com sucesso,
  de uma tarefa específica. Este é um meio eficaz para determinar a Competência de uma pessoa.
  Entretanto, a avaliação pode depender da habilidade da pessoa que efetua a avaliação, a
  menos que anteriormente sejam estabelecidos critérios objetivos.


  Prova oral em ambiente de trabalho

  Esse tipo de avaliação deve ser objetivamente baseado e julgado pela resposta adequada a
  um conjunto consistente de questões. Este é um meio eficaz para avaliar o conhecimento e
  habilidade de uma pessoa para aplicar aqueles conhecimentos. É também um método válido para
  determinar se um inspetor ou supervisor é capaz de ler, escrever e entender tanto no idioma
  português quanto na língua em que estão descritos os procedimentos técnicos, geralmente
  o inglês. Entretanto, ele pode depender das habilidades da pessoa que conduz a prova, a
  menos que anteriormente sejam estabelecidos critérios objetivos.


  Nota: esta lista é uma amostra de ferramentas para avaliar o sucesso do programa de treinamento,
  mas não deve ser considerada completa. Métodos específicos de instrução, por exemplo, também
  fazem surgir mecanismos específicos de avaliação. A Anac encoraja que sempre se considere
  a utilização de novas técnicas para conduzir avaliações eficazes.'
