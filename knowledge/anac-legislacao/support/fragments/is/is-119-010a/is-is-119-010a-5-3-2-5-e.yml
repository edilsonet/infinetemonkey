cite: 5.3.2.5(e)
title: 5.3.2.5(e)
text: e) Ao realizar qualquer avaliação da Competência de uma pessoa, o processo do operador
  aéreo deve ser o mais objetivo, completo e estruturado possível, para produzir resultados
  consistentes. O operador aéreo deve estabelecer as qualificações e o nível de habilidade
  básico para a tarefa designada para a posição ou função de trabalho e, então, estabelecer
  métodos objetivos para comparar a Competência da pessoa com esses padrões de habilidade.
  Pode ser necessário ao operador aéreo usar mais de um método para avaliar adequadamente
  a Competência de uma pessoa.
