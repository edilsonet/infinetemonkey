title: 5.3.2.5(g)
text: 'g) O operador aéreo deve ter procedimentos para:

  I - assegurar que as avaliações tenham consistência e base objetiva;

  II - assegurar que a avaliação seja documentada nos registros de treinamento da pessoa;

  III - assegurar que a pessoa que conduz a avaliação seja qualificada para avaliar os resultados;
  e

  IV - monitorar a pessoa para assegurar sua Competência para executar as tarefas consistentemente
  de forma aceitável, prescrevendo treinamento recorrente ou corretivo quando necessário.'
