title: Avaliação das necessidades
text: '5.3.2 Avaliação das necessidades

  5.3.2.1 Os procedimentos de avaliação das necessidades de treinamento de um operador aéreo
  possibilitam identificar os Requisitos de Treinamento com base em cargos, deveres e tarefas.
  Eles também estabelecem um método objetivo para o operador aéreo determinar uma grade de
  treinamento, avaliando as Competências de cada pessoa e estabelecendo programas de treinamento
  para elas, a fim de preencher as lacunas entre suas Competências e os requisitos de cargos,
  deveres, tarefas e habilidades.

  5.3.2.2 Os procedimentos para a avaliação de necessidades do operador aéreo são baseados
  no seu tamanho, número de Funcionários Técnicos, práticas de treinamento e de designação
  das tarefas e a complexidade e escopo de suas operações.

  5.3.2.3 O operador aéreo deve estabelecer um padrão básico que identifique as necessidades
  de treinamento de cada Funcionário Técnico, avaliando individualmente a função e os deveres
  do trabalho contra suas Competências específicas. As matérias, programas de cursos e as
  lições associadas podem então ser designadas para preencher as lacunas identificadas.'
