title: 5.3.4.2(c)
text: c) Treinamento Baseado em Computador (Computer Based Training - CBT). Cursos interativos
  podem ser utilizados para prover conhecimento e ensinar habilidade prática em um ritmo adequado
  para cada funcionário. O CBT pode ser executado em qualquer local e em horários convenientes.
  Para assegurar a eficácia desse tipo de treinamento, o operador aéreo deve avaliar as informações
  providas, confrontando com suas necessidades particulares.
