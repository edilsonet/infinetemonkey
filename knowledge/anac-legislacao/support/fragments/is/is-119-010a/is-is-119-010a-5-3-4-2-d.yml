section_title: 'Segue abaixo um resumo de diferentes métodos para ministrar treinamento:'
subsection_id: d
cite: 5.3.4.2(d)
title: 5.3.4.2(d)
text: 'd) Treinamento a distância. Treinamento a distância se aplica a situações em que o
  instrutor não está na mesma localidade que o pessoal. Ele pode tomar a forma de videoconferência,
  teleconferência ou uma combinação de ambos, denominada algumas vezes de aulas “virtuais”;
  ou instruções baseadas em internet ou intranet, que permite ao pessoal interagir com um
  instrutor ou com material de treinamento similar ao CBT. A vantagem deste método de treinamento
  é que os cursos podem ser feitos sob medida para necessidades específicas de um operador
  aéreo e o instrutor pode responder a questões individuais.

  5.3.4.3 O operador aéreo deve selecionar o método de transmissão do conhecimento com base
  em suas avaliações de necessidades. Ele também deve ter um método para verificar se a técnica
  de transmissão de conhecimento escolhida é eficaz para o funcionário em treinamento.'
