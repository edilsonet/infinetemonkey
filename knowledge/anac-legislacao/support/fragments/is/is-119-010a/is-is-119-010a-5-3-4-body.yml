text: '5.3.4 Definição dos métodos de treinamento

  5.3.4.1 Uma vez definidas as matérias e o conteúdo dos cursos, o operador aéreo pode determinar
  os métodos disponíveis para ministrá-los, e existem vários métodos disponíveis para esse
  fim.'
