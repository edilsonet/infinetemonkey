text: '5.3.5.1 Existem inúmeras fontes para o treinamento e o operador aéreo deve ter um processo
  para selecionar as que satisfarão seus Requisitos de Treinamento.

  5.3.5.2 Os Requisitos de Treinamento de um operador aéreo podem ser cumpridos por meio de
  treinamentos ministrados no próprio operador aéreo, organizações de ensino certificadas
  pela Anac (um CIAC, conforme RBAC nº 141) ou uma entidade reconhecida pelo MEC, os providos
  pelos fabricantes ou por organizações de manutenção aprovadas RBAC nº 145 e outros operadores
  sob os RBAC nº 121 e RBAC nº 135.

  5.3.5.3 Para gerenciar custos, operadores aéreos que tenham necessidades similares podem
  ratear os custos de treinamento. Estes operadores podem também querer funcionar como entidades
  de treinamento ou trabalhar com um CIAC para desenvolver cursos. Tais CIAC e operadores
  aéreos podem formalizar acordos de cooperação.'
