text: b) CIAC. Um CIAC certificado de acordo com o RBAC nº 141 pode ser uma fonte eficaz de
  treinamento para um operador aéreo, particularmente para Competências básicas. O treinamento
  pode precisar ser suplementado por informações particulares às tarefas e aos equipamentos
  do operador aéreo;
