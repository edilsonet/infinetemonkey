section_title: 'Algumas fontes comuns de treinamento são:'
subsection_id: c
cite: 5.3.5.4(c)
title: 5.3.5.4(c)
text: c) outros operadores aéreos ou organizações de manutenção. Outros operadores aéreos
  ou organizações de manutenção podem ter programas de treinamento para fornecer treinamento
  a terceiros mediante contrato. Operadores aéreos podem prover a Funcionários Técnicos específicos
  o treinamento em itens de inspeção obrigatória (IIO). Um operador aéreo pode também prover
  outros treinamentos gerais, tais como requisitos dos regulamentos;
