text: a) analisar e investigar problemas identificados nos serviços de manutenção executados
  pelo operador aéreo, evidenciados por pilotos (Pilot Reports - PIREPs ou Maintenance Reported
  Defects - MAREPs), e discrepâncias levantadas pelas análises do Programa de Confiabilidade
  ou auditorias do SASC em um produto a ser aprovado para retorno ao serviço, dentre outros
  incidentes;
