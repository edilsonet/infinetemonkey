title: 5.3.7.3(d)
text: 'd) reclamações ou sugestões de Funcionários Técnicos relacionadas à execução de serviços
  a eles designados, ou a falta de treinamento.

  5.3.7.4 Quando se conclui que um treinamento deve ser ajustado (por não estar dando bons
  resultados), o operador aéreo deve ter um método para atualizá-lo e prover as informações
  adicionais ao seu pessoal.'
