title: O operador aéreo deve registrar o treinamento requerido de cada Funcionário Técnico
  em um formato aceitável pela Anac.
text: '5.3.8.1 O operador aéreo deve registrar o treinamento requerido de cada Funcionário
  Técnico em um formato aceitável pela Anac.

  5.3.8.2 A Competência de cada Funcionário Técnico depende de treinamento, conhecimento e
  experiência. Consequentemente, a determinação de que ele seja capaz de executar uma Função
  de Manutenção requer uma análise dos fatores que contribuíram para a Competência adquirida.
  Os dados para efetuar essa análise devem ser encontrados nos registros de treinamento do
  Funcionário Técnico, desde que os princípios desta IS sejam seguidos quando o PTM for elaborado.

  5.3.8.3 O operador aéreo pode arquivar seus registros de treinamento tanto eletronicamente
  quanto em papel. Em qualquer dos casos, o formato e conteúdo dos registros de treinamento
  devem ser padronizados com base nas designações individuais para execução de tarefas.'
