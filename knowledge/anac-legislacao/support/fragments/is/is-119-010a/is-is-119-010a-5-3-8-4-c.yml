section_title: 'Os registros de cada Funcionário Técnico devem conter, pelo menos:'
subsection_id: c
cite: 5.3.8.4(c)
title: 5.3.8.4(c)
text: 'c) Certificados de Habilitação Técnica da Anac, aplicáveis às pessoas qualificadas
  (supervisores, pessoal de inspeção e pessoas que aprovam artigos para retorno ao serviço
  devem ter licença de MMA adequada, de acordo com o RBAC nº 65);

  Nota: no caso de manutenção realizada por piloto, devem ser considerados os requisitos do
  RBAC nº 43.'
