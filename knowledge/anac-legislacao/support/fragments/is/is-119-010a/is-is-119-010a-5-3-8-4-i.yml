section_title: 'Os registros de cada Funcionário Técnico devem conter, pelo menos:'
subsection_id: i
cite: 5.3.8.4(i)
title: 5.3.8.4(i)
text: 'i) documento assinado pelo supervisor para comprovar treinamento em serviço, por exemplo:
  “na data de xx/xx/xxxx o mecânico Sr. xxx trabalhou com reparo estrutural em cumprimento
  ao item xx da Ordem de Serviço nº yyy/xxx, sob minha supervisão, tendo executado o serviço
  de forma satisfatória”. O registro pode ser um campo da ordem de serviço, capaz de identificar
  o supervisor e o supervisionado.

  5.3.8.5 Todos os registros requeridos pelo programa de treinamento para determinar se cada
  pessoa é capaz de executar as tarefas a ela atribuídas, bem como os que documentam o treinamento
  conduzido, devem ser detalhados no programa de treinamento e arquivados por no mínimo 5
  (cinco) anos após o término do vínculo contratual.

  5.3.8.6 O operador aéreo é encorajado a ter procedimentos para regularmente analisar todos
  os registros de treinamento de modo a assegurar que cumpram os requisitos estabelecidos
  no manual do programa de treinamento.'
