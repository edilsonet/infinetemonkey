title: DEFINIÇÕES
text: 'DEFINIÇÕES

  No texto desta IS, os termos abaixo definidos, quando grafados com inicial maiúscula, devem
  ser entendidos como segue.

  4.1 Centros de Instrução de Aviação Civil (CIAC): organização certificada conforme o RBAC
  nº 141 cuja finalidade é formar recursos humanos para a aviação civil, conduzindo seus alunos
  para a obtenção das licenças, habilitações e certificados requeridos pela Anac.

  4.2 Competência: conhecimentos, habilidades e atitudes requeridas para executar adequadamente
  uma tarefa.

  4.3 Doutrinação: tipo de treinamento inicial fornecido por operadores aéreos contendo conhecimentos
  básicos a serem ministrado a seus funcionários, sobre o operador, como ele é estabelecido,
  como funciona, seus procedimentos, suas prerrogativas, limitações, seus manuais, a regulamentação
  aplicável, etc.

  4.4 Função de Manutenção: uma etapa, ou uma série de etapas, no processo de execução de
  manutenção, manutenção preventiva ou alteração e funções de inspeção, que pode resultar
  na aprovação de um artigo para retorno ao serviço, e funções de registro.

  4.5 Funcionário Técnico: pessoa com Competência para executar Funções de Manutenção.

  4.6 Requisitos de Treinamento: quaisquer necessidades relativas a treinamento, seja para
  uma pessoa, um operador aéreo, um curso, ou uma Função de Manutenção. Exemplos: Competências
  necessárias para uma pessoa (ou para uma Função de Manutenção), tipo do treinamento necessário
  para executar uma tarefa, cursos necessários para uma pessoa, etc.'
