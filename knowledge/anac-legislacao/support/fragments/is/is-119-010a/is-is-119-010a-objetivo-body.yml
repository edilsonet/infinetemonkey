title: OBJETIVO
text: 'OBJETIVO

  1.1 Esclarecer, detalhar e orientar a aplicação dos requisitos do programa de treinamento
  de manutenção e de manutenção preventiva - PTM, previstos nos Regulamentos Brasileiros da
  Aviação Civil - RBAC nº 121 e RBAC nº 135, aplicável aos operadores de serviço de transporte
  aéreo, descrevendo um meio aceitável, mas não único, para elaborar o programa de treinamento
  para o pessoal de manutenção e manutenção preventiva, tal como requerido pelas seções 121.375
  do RBAC nº 121 e 135.433 do RBAC nº 135.'
