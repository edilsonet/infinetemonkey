text: '1. OBJETIVO

  1.1 A presente Instrução Suplementar visa constituir-se como um guia de referência para
  o de-

  senvolvimento, implantação e gestão permanente dos Programas de Prevenção do Uso In-

  devido de Substâncias Psicoativas na Aviação Civil requeridos pelo RBAC nº 120 para as

  empresas incluídas em sua aplicabilidade.'
