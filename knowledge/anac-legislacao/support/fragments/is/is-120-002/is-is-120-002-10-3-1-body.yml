  ser
text: '10.3.1 Na Declaração de Conformidade, as subpartes pertinentes e cada seção relevante
  devem ser

  identificadas e acompanhadas de uma breve descrição do método de conformidade ou, pre-

  ferencialmente, acompanhadas por referência específica a uma seção ou item específico do

  Manual previamente desenvolvido.

  10.4 O Manual e a Declaração de Conformidade devem ser assinados pela alta direção da orga-

  nização requerente.

  10.5 Um modelo sugerido de Declaração de Conformidade específica para o RBAC 120 - Emenda

  03 pode ser encontrado no Apêndice D, onde se indica ainda quais informações específicas

  sobre métodos de cumprimento adotados são devidas também para o Manual.'
