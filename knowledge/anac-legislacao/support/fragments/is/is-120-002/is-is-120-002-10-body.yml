title: MANUAL PPSP E DECLARAÇÃO DE CONFORMIDADE
text: '10. MANUAL PPSP E DECLARAÇÃO DE CONFORMIDADE

  10.1 Todo regulado que se enquadre na aplicabilidade do RBAC 120 deverá desenvolver um Ma-

  nual e uma Declaração de Conformidade específicos para este Regulamento. Estes docu-

  mentos devem ser mantidos atualizados nos arquivos da empresa, disponíveis para apresen-

  tação quando solicitado pela ANAC.

  10.2 O Manual deve incluir a Política da empresa para o tema, descrever e atribuir as responsa-

  bilidades na condução do Programa e descrever os procedimentos para o PPSP específico.

  10.3 A Declaração de Conformidade é uma listagem completa de todas as seções e requisitos
  dos

  RBAC 120, com o correspondente método de conformidade a ser adotado pela empresa ou

  uma indicação de que o requisito não lhe seja aplicável.'
