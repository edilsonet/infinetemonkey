title: REFERÊNCIAS BIBLIOGRÁFICAS
text: '11. REFERÊNCIAS BIBLIOGRÁFICAS

  11.1 Regulamento Brasileiro da Aviação Civil nº 120 (RBAC nº 120);

  11.2 Lei Federal nº 11.182, de 27 de setembro de 2005, Art. 8º, inciso XII;Data de emissão:
  19 de novembro de 2021

  IS nº 120-002

  Revisão D

  11.3 Classificação de Transtornos Mentais e de Comportamento da CID-10: Descrições Clínicas

  e Diretrizes Diagnósticas. Coord. Organização Mundial de Saúde. Ed. Artes Médicas, Porto

  Alegre, 1993;

  11.4 DOC 9654-AN/945. Manual on prevention of problematic use of substances in the aviation

  workplace. International Civil Aviation Organization, 1995 (disponível apenas em versão

  impressa);

  11.5 DOC 8984. Manual of Civil Aviation Medicine. International Civil Aviation Organization,

  2008 (Disponível em: www.icao.int/icaonet/dcs/8984/index.html);

  11.6 Management of alcohol- and drug-related issues in the workplace. An ILO code of practice,

  Geneva, International Labour Office, 1996;

  11.7 Coming clean: Drug and alcohol testing in the workplace. In: World of Work Magazine

  No.57, September 2006, International Labour Office, 1996;

  11.8 Title 49: Transportation - Part 40: Procedures for transportation workplace drug and
  alco-

  hol testing programs. Effective October 1, 2010. Department of Transportation, Drug and

  Alcohol Policy and Compliance Office;

  11.9 Department of Health and Human Services - HHS. Mandatory Guidelines for Federal

  Workplace Drug Testing Programs. Substance Abuse and Mental Health Services Adminis-

  tration (SAMHSA). Nov. 2008;

  11.10 Department of Health Services - HHS. Mandatory Guidelines for Federal Workplace Drug

  Testing Programs - Oral Fluid. Substance Abuse and Mental Health Services Administration

  (SAMHSA). Out. 2019;

  11.11 Relatório de recomendações e requisitos de saúde e segurança para Programas de Prevenção

  do uso indevido de Substâncias Psicoativas na Aviação Civil. Documento interno da Gerên-

  cia de Fatores Humanos na Aviação e Medicina de Aviação (GFHM), 2010.'
