title: 120.1(a)
text: '(a) Este Regulamento se aplica a qualquer pessoa

  que desempenhe Atividade de Risco à Segurança

  Operacional na Aviação Civil (ARSO), que se en-

  quadre como: Indicar qual(ais) a(s) área(s) de atuação e/ou

  tipo(s) de operação(ões) conduzida(s) pela em-

  presa: se empresa de transporte aéreo operando

  sob RBAC 121 ou 13se operador de serviços espe-

  cializados públicos, se detentor de certificado sob

  RBAC 145, se detentor de certificado sob RBAC

  139, ou se empresa subcontrada por uma das ante-

  riores, para desempenhar ARSO. Esta indicação

  poderá ser feita em um único parágrafo.

  (1) exploradores de serviços aéreos, certificados ou

  autorizados segundo a regulamentação da ANAC

  relativa a'
