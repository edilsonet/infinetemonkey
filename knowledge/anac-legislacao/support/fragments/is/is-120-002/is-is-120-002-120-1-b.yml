cite: 120.1(b)
title: 120.1(b)
text: '(b) Para os propósitos deste Regulamento, são con-

  sideradas ARSO:

  Indicar quais atividades ARSO específicas a em-

  presa mantém/realiza sob sua responsabilidade di-

  reta ou indireta, isto é, ARSO diretamente reali-

  zada por empregado(s) da empresa responsável,

  ou através de empregado(s) de empresa(s) contra-

  tada(s).

  Deve-se estimar no PPSP e referenciar nesta De-

  claração de Conformidade o número médio de em-

  pregados em cada uma das atividades elencadas.

  (1) cálculo das posições de carga, bagagem, passa-

  geiros e combustível nas aeronaves operadas sob o

  respectivo voo;

  (2) manutenção, manutenção preventiva ou altera-

  ção de produtos aeronáuticos;

  (3) inspeção e certificação da manutenção de um

  produto aeronáutico;

  (4) abastecimento das aeronaves operadas sob o

  supervisão do abastecimento e manutenção dos ve-

  ículos que serão utilizados para esse abasteci-

  mento;

  (5) inspeção de segurança da aviação civil contra

  atos de interferência ilícita aplicadas em pessoas,

  objetos, áreas ou aeronaves sob responsabilidade

  de operadores de aeródromo e/ou de operadores aé-

  reos classificados como Classe de III a VI segundo

  o RBAC nº 108;

  (6) atividades realizadas por um membro da tripu-

  lação de uma aeronave;Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (7) carregamento e descarregamento de bagagem e

  carga em aeronave operada sob o RBAC nº 121,

  incluindo a abertura e fechamento de portas, a su-

  pervisão do carregamento e a condução/operação

  dos veículos ou equipamentos utilizados no trans-

  porte da bagagem e carga;

  (8) sinalização para estacionamento de uma aero-

  nave ou sua orientação para movimentação (mars-

  halling);

  (9) atividades realizadas por fiscal de pátio;

  (10) atividades de condução de veículos e/ou ope-

  ração de equipamentos, por pessoas com credencial

  aeroportuária permanente e que atuem na área ope-

  racional, quando prestadas a operadores sob o

  tuando os motoristas do Serviço de Salvamento e

  Combate a Incêndio;

  (11) atividades de varredura contra objetos estra-

  nhos em área operacional não edificada prestadas a

  operadores sob o RBAC nº 121;

  (12) calço das aeronaves que operem sob o RBAC

  nº 121, quando realizado em área operacional não

  edificada; e

  (13) exercício do controle operacional de aerona-

  ves em operações sob o RBAC nº 121.'
