cite: 120.1(e)
title: 120.1(e)
text: '(e) Cabem às entidades relacionadas no parágrafo

  120.1(a) cumprir e fazer cumprir os requisitos defi-

  nidos neste Regulamento pelos seus empregados e

  pelos empregados de suas contratadas, direta ou in-

  diretamente, caso desempenhem qualquer Ativi-

  dade de Risco à Segurança Operacional na Aviação

  Civil listada no parágrafo 120.1(b).

  A empresa que contrate outra(s) empresa(s) para

  desempenho de ARSO deve descrever como veri-

  fica o cumprimento do PPSP de sua(s) contra-

  tada(s).'
