cite: 120.1(i)
title: 120.1(i)
text: '(i) empresas de transporte aéreo; e

  (ii) serviços aéreos especializados públicos (SAE);

  (2) detentores de certificados sob o RBAC nº 145

  localizados em território brasileiro que aprovem

  para o retorno ao serviço aeronaves envolvidas em

  operações regidas pelo RBAC nº 121 ou RBAC nº

  135; e

  (3) operadores de aeródromos classificados como

  Classe III ou IV segundo o RBAC nº 153.'
