cite: 120.3(a)
title: 120.3(a)
text: '(a) É obrigatória a todas as empresas mencionadas

  na seção 120.1(a)(1) a (a)(3) deste Regulamento, a

  elaboração, execução e manutenção de um Pro-

  grama de Prevenção do Risco Associado ao Uso

  Indevido de Substâncias Psicoativas na Aviação

  Civil (PPSP), bem como de seus subprogramas, to-

  dos válidos perante a ANAC.

  Cumpre-se pela existência e disponibilidade de

  Manual e Declaração de Conformidade específicos

  para este regulamento, e do Programa efetiva-

  mente implantado.

  Cumpre-se pela existência e disponibilidade de

  Manual e Declaração de Conformidade específicos

  para este regulamento.

  (1) Cada empresa responsável e, ainda, cada em-

  presa que, conforme 120.3(b), necessite possuir seu

  próprio PPSP deverá desenvolver um Manual espe-

  cífico com o objetivo de descrever detalhadamente

  seu Programa e subprogramas, incluindo os méto-

  dos de cumprimento específicos adotados.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (2) Cada empresa responsável e, ainda, cada em-

  presa que, conforme 120.3(b), necessite possuir seu

  próprio PPSP deverá desenvolver uma Declaração

  de Conformidade específica para o presente regula-

  mento, isto é, um documento contendo uma lista-

  gem completa de todas as seções e requisitos deste

  Regulamento e o correspondente método de cum-

  primento adotado para cada seção ou requisito.

  Ambos os documentos devem ser mantidos atuali-

  zados, e nos arquivos da empresa, disponíveis para

  apresentação imediata quando solicitado pela

  ANAC.

  O Manual deve pormenorizar como será operacio-

  nalizado o Programa da empresa. Não basta dizer

  o que será feito, mas, sobretudo, como será feito,

  provendo ainda evidências das contratações e do-

  cumentações necessárias.

  (3) As informações contidas no Manual de um

  PPSP e na Declaração de Conformidade devem ser

  mantidas atualizadas para todos os fins internos e

  externos à empresa, devendo estes documentos se-

  rem apresentados imediatamente sempre que soli-

  citado pela ANAC.'
