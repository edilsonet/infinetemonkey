cite: 120.3(b)
title: 120.3(b)
text: '(b) A empresa responsável que seja contratante de

  outra empresa, poderá, conforme os critérios de

  contratação, incluir essa empresa contratada no seu

  PPSP. Caso opte pela não inclusão, deverá exigir

  que a empresa contratada possua seu próprio PPSP,

  nos termos deste Regulamento.

  A empresa responsável deve identificar as ARSO

  conduzidas sob sua responsabilidade mas que são

  realizadas por empresa contratada. Deve-se, nes-

  tes casos, identificar a(s) ARSO específica(s), a(s)

  empresa(s) contratada(s) e se esta(s) (cada uma

  delas) possuem PPSP próprio ou se os empregados

  da empresa contratada estão incluídos neste

  PPSP.'
