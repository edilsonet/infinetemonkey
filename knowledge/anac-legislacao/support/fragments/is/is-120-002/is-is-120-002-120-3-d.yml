title: 120.3(d)
text: '(d) As empresas responsáveis relacionadas nos pa-

  rágrafos 120.1(a) deste Regulamento devem garan-

  tir que todo profissional que desempenhe Atividade

  de Risco à Segurança Operacional na Aviação Ci-

  vil sob sua responsabilidade esteja contemplado em

  um PPSP, podendo ser no seu próprio programa ou

  no de sua contratada.'
