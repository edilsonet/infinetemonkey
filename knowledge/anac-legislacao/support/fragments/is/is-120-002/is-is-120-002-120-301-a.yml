title: 120.301(a)
text: '(a) O Programa de Prevenção do Risco Associado

  ao Uso Indevido de Substâncias Psicoativas (PPSP)

  deverá conter, no mínimo:

  O PPSP da <Empresa> contém:

  (1) um Subprograma de Educação, na forma da

  subparte H deste Regulamento;

  Subprograma de Educação para a Prevenção: indi-

  car em que parte do Programa encontram-se os

  métodos de cumprimento previstos para este sub-

  programa.

  (2) um Subprograma de Exames Toxicológicos de

  Substâncias Psicoativas, conforme a subparte I

  deste Regulamento; e

  Subprograma de Exames Toxicológicos de Subs-

  tâncias Psicoativas: indicar em que parte do Pro-

  grama encontram-se os métodos de cumprimento

  previstos para este subprograma.

  (3) um Subprograma de Resposta a Evento Impedi-

  tivo, conforme a subparte J deste Regulamento.

  Subprograma de Resposta a Evento Impeditivo: in-

  dicar em que parte do Programa encontram-se os

  métodos de cumprimento previstos para este sub-

  programa.'
