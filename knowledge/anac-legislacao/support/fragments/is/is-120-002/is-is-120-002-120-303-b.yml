subsection_id: b
cite: 120.303(b)
title: 120.303(b)
text: '(b) No caso de empresa subcontratada para execu-

  ção de uma ARSO, todos os seus empregados

  ARSO e supervisores devem estar submetidos ao

  seu próprio PPSP ou ao PPSP da empresa respon-

  sável contratante, exceto como previsto no pará-

  grafo (c) desta seção.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Discriminar eventuais ARSO realizadas por em-

  presa(s) contratada(s) e se estes empregados estão

  abrangidos no PPSP da empresa responsável (con-

  tratante) ou se em PPSP próprio da contratada.'
