cite: 120.303(c)
title: 120.303(c)
text: '(c) Sob avaliação de risco a ser feita pela empresa

  responsável, em situações emergenciais, esta po-

  derá contratar uma empresa ou indivíduo para a

  execução de uma ARSO que não estejam abrangi-

  dos em um PPSP. A empresa responsável deve

  manter a documentação relativa a essa contratação

  emergencial por 5 (cinco) anos.

  Exceção para contratação em situação emergen-

  cial.

  A <Empresa> manterá a documentação relativa a

  qualquer contratação emergencial por no mínimo 5

  (cinco) anos.'
