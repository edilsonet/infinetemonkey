cite: 120.303(d)
title: 120.303(d)
text: '(d) A empresa responsável deve incluir, obrigatori-

  amente, todo contratado em seu PPSP caso a dura-

  ção do contrato seja superior a 1 (um) mês.

  Limitação para o que se considera como contrata-

  ção em situação emergencial.

  A <Empresa> incluirá quaisquer empresas/empre-

  gados contratadas(os) para desempenhar ARSO,

  conforme o parágrafo 120.1(a)(4), em seu PPSP

  caso a duração do contrato seja superior a 1 (um)

  mês.'
