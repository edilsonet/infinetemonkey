cite: 120.307(a)
title: 120.307(a)
text: '(a) A ANAC poderá requerer, a qualquer empresa

  responsável, um relatório contendo os resultados

  consolidados do PPSP de um determinado período

  de avaliação.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  A Empresa deve demonstrar ciência e indicar a co-

  leta permanente dos dados necessários à apresen-

  tação, a qualquer tempo, dos indicadores em tela,

  sempre que solicitados.

  (1) O relatório deverá apresentar dois indicadores

  agregados e impessoais:'
