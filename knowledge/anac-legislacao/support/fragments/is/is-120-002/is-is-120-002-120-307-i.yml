cite: 120.307(i)
title: 120.307(i)
text: '(i) proporção de empregados ARSO submetidos ao

  Subprograma de Resposta a Eventos Impeditivos

  em relação aos eventos impeditivos ocorridos; e

  (ii) proporção de retorno ao serviço de empregados

  ARSO em relação ao total de empregados submeti-

  dos ao Subprograma de Resposta a Eventos Impe-

  ditivos.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (2) O relatório também deverá conter a quantidade

  de empregados ARSO, com indicação da atividade

  realizada, e a quantidade de empregados ARSO

  submetidos aos exames ETSP (prévios, aleatórios,

  pós-acidente, baseados em suspeita justificada, de

  retorno ao serviço, de acompanhamento) realizados

  no período.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Atentar que este relatório limita-se a dados quanti-

  tativos, não devendo incluir quaisquer informações

  que potencialmente violem confidencialidade dos

  laudos de exames e registros médicos a serem ge-

  rados sob as ações do Programa.'
