cite: 120.309(a)
title: 120.309(a)
text: '(a) Toda empresa responsável deve eleger um re-

  presentante designado para responder pela elabora-

  ção, execução e manutenção do seu PPSP e de to-

  dos os subprogramas associados. A empresa deve

  manter as informações atualizadas deste represen-

  tante, como o nome e os dados de contato, para to-

  dos os fins internos e externos à empresa, dispen-

  sado o envio dessas informações à ANAC. Toda-

  via, essas informações devem ser apresentadas

  imediatamente sempre que solicitado pela ANAC.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Indicar o nome do Representante Designado, e in-

  formar o cargo por ele ocupado na empresa (o Re-

  presentante Designado deve ser empregado regu-

  lar da empresa), cargo este que deve ser possuidor

  de autoridade e responsabilidade pela implantação

  do Programa, sem prejuízo da responsabilidade fi-

  nal da empresa. Indicar, ainda, endereço, correio

  eletrônico e telefones de contato do RD.'
