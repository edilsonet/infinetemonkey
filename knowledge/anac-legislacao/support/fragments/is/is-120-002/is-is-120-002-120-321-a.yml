cite: 120.321(a)
title: 120.321(a)
text: '(a) A empresa responsável deve desenvolver, ela-

  borar e executar, internamente ou por contrato, um

  subprograma de educação fornecendo:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade genérica. Ou seja:

  Indicar se o subprograma de educação é realizado

  internamente (sob responsabilidade de qual em-

  pregado, incluindo suas qualificações), ou por

  contrato (sob contrato de prestação de serviços

  com empresa ou profissional externo). Observar

  parágrafo (h) desta Seção, que prevê que o ESP ou

  profissional com formação equivalente seja o coor-

  denador do Subprograma de Educação; verificar

  se é aplicável à empresa.

  (1) aos empregados ARSO e seus supervisores, in-

  formações sobre o uso indevido de substâncias psi-

  coativas; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade específica.

  (2) aos Supervisores Treinados para Encaminha-

  mento a ETSP, treinamento específico para enca-

  minhamento de um empregado ARSO para um

  ETSP baseado em suspeita justificada conforme o

  parágrafo 120.323(b).

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade específica.'
