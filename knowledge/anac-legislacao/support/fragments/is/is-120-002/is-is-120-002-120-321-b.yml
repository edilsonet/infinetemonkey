cite: 120.321(b)
title: 120.321(b)
text: '(b) A empresa responsável deve manter em ar-

  quivo, em papel ou mídia eletrônica, por 5 (cinco)

  anos os documentos que comprovem o atendi-

  mento dos requisitos dessa subparte.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
