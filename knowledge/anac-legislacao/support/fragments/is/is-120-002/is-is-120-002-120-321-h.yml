title: 120.321(h)
text: '(h) Com exceção do disposto no parágrafo (i) desta

  Seção, o desenvolvimento, a elaboração do conte-

  údo e a execução do subprograma de educação de-

  vem ser coordenados pelo ESP ou profissional com

  formação equivalente designado pela empresa.

  Indicar a aplicabilidade deste requisito à empresa:

  se o subprograma de educação será coordenado

  pelo ESP ou profissional com formação equiva-

  lente, ou outro.

  Indicar o nome do profissional responsável pelo

  treinamento. Caso não seja ele o ESP, evidenciar

  suas qualificações para a função.'
