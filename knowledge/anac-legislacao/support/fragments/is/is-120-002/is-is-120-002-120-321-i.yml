cite: 120.321(i)
title: 120.321(i)
text: '(i) Para as empresas listadas abaixo, o desenvolvi-

  mento, a elaboração do conteúdo e a execução do

  subprograma de educação não precisa ser coorde-

  nado pelo ESP ou profissional com formação equi-

  valente, desde que os temas contemplados pelo pa-

  rágrafo 120.323(a)(12) deste Regulamento sejam

  tratados a partir das orientações da ANAC publica-

  mente divulgadas:

  (1) operador segundo as regras do RBAC no 135

  com até 10 empregados ARSO (nã o contando os

  empregados de empresas contratados, direta ou in-

  diretamente);

  (2) operador SAE; e

  (3) organizações de manutenção regidas pelo

  RBAC 145, exceto as que aprovam para retorno ao

  serviço aeronaves operadas segundo o RBAC121.'
