text: '(a) O material educacional voltado para emprega-

  dos ARSO deve incluir:

  Conteúdo mínimo obrigatório do material educa-

  tivo/informativo voltado para empregados ARSO

  (e supervisores).

  Fornecer exemplo/modelo do material de educa-

  ção específico usado para instrução de Superviso-

  res Treinados, seja no PPSP ou nesta Declaração

  de Conformidade.

  (1) informação de que os ETSP são exigidos por

  este regulamento;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (2) as categorias de ARSO abrangidas pelo pro-

  grama;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (3) as circunstâncias em que um ETSP é requerido;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (4) procedimentos dos ETSP;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (5) informações relativas ao rol de substâncias psi-

  coativas a serem testadas;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (6) informações relativas às substâncias, incluindo

  medicamentos acompanhados ou não de prescrição

  médica, de uso restrito para empregados ARSO;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (7) política relativa ao uso de substância psicoativa

  no ambiente de trabalho;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja:

  Deve-se incluir o texto da Política da empresa re-

  lativa ao uso de substância psicoativa no ambiente

  de trabalho, seja no PPSP ou nesta Declaração de

  Conformidade.

  (8) indicação do nome de pessoas designadas para

  tirar dúvidas sobre o programa;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (9) explicação do que constitui uma recusa em sub-

  meter-se ao ETSP e suas consequências;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (10) informações sobre resultado positivo e suas

  consequências;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (11) informações sobre o programa de resposta a

  evento impeditivo; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

