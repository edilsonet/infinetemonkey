title: 120.323(b)
text: '(b) O conteúdo do material educacional específico

  de instrução de Supervisores Treinados para Enca-

  minhamento a ETSP deve conter a identificação de

  indicadores físicos, comportamentais e de desem-

  penho para a realização de observações específicas,

  atuais e articuladas visando encaminhamento a

  exame por suspeita justificada.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja:

  Fornecer exemplo/modelo do material de educa-

  ção específico usado para instrução de Superviso-

  res Treinados, seja no PPSP ou nesta Declaração

  de Conformidade.

  SUBPARTE I

  SUBPROGRAMA DE EXAMES TOXICOLÓGI-

  COS DE SUBSTÂNCIAS PSICOATIVAS'
