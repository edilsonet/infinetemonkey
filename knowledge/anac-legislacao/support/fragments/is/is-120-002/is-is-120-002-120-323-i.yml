title: 120.323(i)
text: '(i) efeitos do uso de substâncias psicoativas na sa-

  úde, no trabalho e na vida pessoal do indivíduo; Indicar em que parte, seção ou item do
  PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (ii) sinais e sintomas do uso nocivo e de dependên-

  cia de substâncias psicoativas; e

  (iii) métodos de tratamento disponíveis na comuni-

  dade para resolução de problemas associados ao

  uso de substâncias psicoativas.'
