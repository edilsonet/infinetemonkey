title: 120.331(a)
text: '(a) Toda empresa responsá vel deve submeter aos

  ETSP seus empregados ARSO de acordo com o

  previsto nesta subparte.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade genérica.'
