title: 120.331(b)
text: '(b) As empresas listadas abaixo nã o precisam aten-

  der aos pará grafos 120.339(a) e (b) desta Subparte:

  Indicar se empresa se enquadra nesta regra, e se

  pretende não realizar exames prévios e aleatórios.

  (1) operadores segundo as regras do RBAC no 135

  com até 10 empregados ARSO (nã o contando os

  empregados de empresas contratados, direta ou in-

  diretamente);

  (2) operadores SAE; e

  (3) organizaçõ es de manutençã o regidas pelo

  ao serviç o aeronaves operadas segundo o RBAC

  no 121.'
