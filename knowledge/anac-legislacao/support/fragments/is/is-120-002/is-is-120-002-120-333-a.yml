section_title: Funções e requisitos do médico revisor
subsection_id: a
cite: 120.333(a)
title: 120.333(a)
text: '(a) A empresa responsável deve designar um mé-

  dico revisor para desempenhar as seguintes fun-

  ções:

  O médico revisor contratado no âmbito do presente

  PPSP é o Sr(a). <nome do médico, nº do CRM, es-

  tado da federação do CRM>.

  Pode ser indicado mais de um médico para a fun-

  ção de médico revisor da empresa.

  O médico revisor pode ser também o ESP da em-

  presa, desde que possua as qualificções para tal,

  segundo 120.353.

  (1) determinar se o resultado positivo não referen-

  dado de um ETSP é devido a um tratamento legí-

  timo ou outra fonte inócua; Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  estas obrigatoriedades. Ou seja, deverá definir de

  que forma estes requisitos serão implantados ope-

  racionalmente.

  (2) avaliar se um indivíduo não pôde realizar um

  ETSP por não poder produzir a amostra corporal

  necessária em razão de uma condição médica espe-

  cífica; e

  (3) demais funções relativas aos ETSP e às respon-

  sabilidades descritas na seção 120.343.

  (4) notificar conforme 120.331(f)(3).'
