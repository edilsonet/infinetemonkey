title: 120.333(b)
text: '(b) O médico revisor deve possuir diploma regis-

  trado no MEC e registro profissional válido e vi-

  gente que o habilitem ao exercício da medicina.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.'
