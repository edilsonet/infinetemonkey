title: 120.335(a)
text: '(a) As substâ ncias psicoativas a serem testadas em

  cada ETSP, independentemente do tipo, sã o:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito à

  obrigatoriedade de que cada ETSP seja realizado

  (1) álcool;Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (2) metabólitos de opiáceos; para a detecção de cada uma das substâncias pre-

  vistas. Ou seja, deverá definir de que forma este

  requisito será implantado operacionalmente.

  (3) metabólitos de canabinóides;

  (4) metabólitos de cocaína; e

  (5) anfetaminas / metanfetaminas / metilenodioxi-

  metanfetamina / metilenodioxianfetamina.'
