cite: 120.339(a)
title: 120.339(a)
text: '(a) ETSP prévio: toda empresa responsável deve

  conduzir ETSP prévios, conforme os seguintes re-

  quisitos:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) nenhuma empresa responsável deve contratar

  qualquer indivíduo para o desempenho de ARSO a

  não ser que conduza um ETSP prévio e receba um

  resultado negativo para este indivíduo;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (2) a empresa responsável deve realizar um ETSP

  prévio antes que o novo empregado desempenhe

  uma ARSO pela primeira vez;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (3) a empresa responsável deve realizar um ETSP

  prévio se um indivíduo for realocado de uma ativi-

  dade que não é de risco à segurança operacional

  para uma ARSO;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (4) empresas responsáveis devem conduzir outro

  ETSP prévio e receber um resultado negativo antes

  de contratar ou alocar um indivíduo para desempe-

  nhar uma ARSO se mais de 180 dias passaram en-

  tre o ETSP prévio requerido nos parágrafos (a)(2) e'
