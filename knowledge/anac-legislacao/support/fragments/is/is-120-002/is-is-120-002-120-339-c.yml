text: 'c) As concentrações-limite para os exames preliminar e confirmatório nas amostras de

  urina e fluido oral são as previstas, respectivamente, nas Tabelas 1 e 2 a seguir,

  incluindo instruções adicionais específicas para cada matriz, em seguida à respec-

  tiva tabela.

