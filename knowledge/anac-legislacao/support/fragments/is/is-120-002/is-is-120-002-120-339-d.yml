title: 120.339(d)
text: '(d) O ETSP deverá ser utilizado para avaliar o

  cumprimento do estabelecido em 120.9(a)(2). Ad-

  mite-se o uso de exames que avaliem o uso recente

  de substâ ncias psicoativas.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
