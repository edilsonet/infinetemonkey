cite: 120.339(f)
title: 120.339(f)
text: '(f) O PPSP deve conter os procedimentos utiliza-

  dos para:

  Descrever os procedimentos para realização dos

  ETSP. Mesmo sendo o exame conduzido pelo labo-

  ratório contratado, a empresa deve descrever

  como acontece o processo:

  (1) coleta, manuseio e armazenamento das amos-

  tras para os ETSP;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Ou seja:

  Discriminar quem pode coletar, a amostra a ser

  coletada, qual treinamento o(s) coletor(es) pos-

  sui(em) para isto e quais os procedimentos especí-

  ficos adotados.

  (2) realização dos ETSP, incluindo as matrizes bio-

  lógicas utilizadas e os níveis de corte adotados;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Ou seja:

  Discriminar a respeito do(s) método(s) proposto(s)

  para análise dos ETSP: a matriz biológica utili-

  zada, os níveis de corte usados para análise de

  cada classe de substâncias (classes de substâncias

  a serem analisadas previstas em 120.335) e demais

  procedimentos previstos.

  (3) notificação pelo médico revisor de um resul-

  tado positivo e de um resultado positivo não refe-

  rendado ao indivíduo examinado; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja:

  Discriminar procedimento para notificação e en-

  trevista com o médico revisor, garantindo-se o de-

  vido sigilo e confidencialidade.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (4) garantia da integridade das amostras, utili-

  zando-se para este fim procedimentos de cadeia de

  custódia.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja:

  Discriminar a cadeia de custódia da amostra: des-

  crever procedimentos, prazos de encaminhamento

  e incluir modelo de formulários de registro e con-

  trole utilizados.'
