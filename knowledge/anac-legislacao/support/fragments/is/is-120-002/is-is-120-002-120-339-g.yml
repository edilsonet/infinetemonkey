cite: 120.339(g)
title: 120.339(g)
text: '(g) O medidor de alcoolemia - etilômetro - deve ser

  utilizado conforme os limites e condições estabele-

  cidos pela legislação metrológica em vigor e obser-

  var os seguintes requisitos:

  Informar se fará uso do etilômetro para exame to-

  xicológico específico para álcool e o planejamento

  para disponibilidade do(s) equipamento(s) visando

  cumprir os requisitos aplicáveis.

  (1) ser aprovado na verificação metrológica inicial

  realizada pelo Instituto Nacional de Metrologia,

  Qualidade e Tecnologia (INMETRO) ou órgão da

  Rede Brasileira de Metrologia Legal e Qualidade -

  RBMLQ;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Sugere-se que sejam apresentadas cópias dos res-

  pectivos certificados de aprovação, ou comprova-

  ção equivalente.

  (2) ser aprovado na verificação periódica anual rea-

  lizada pelo INMETRO ou RBMLQ; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Sugere-se que sejam apresentadas cópias dos res-

  pectivos certificados de aprovação, ou comprova-

  ção equivalente.

  (3) ser aprovado em inspeção em serviço ou even-

  tual, conforme determina a legislação metrológica

  vigente.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Sugere-se que sejam apresentadas cópias dos res-

  pectivos certificados de aprovação, ou comprova-

  ção equivalente.'
