title: 120.339(h)
text: '(h) Os ETSP deverão incluir, para a caracterização

  de um resultado positivo, sua confirmação pela téc-

  nica de espectrometria de massa. Este requisito não

  se aplica ao uso do etilômetro.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
