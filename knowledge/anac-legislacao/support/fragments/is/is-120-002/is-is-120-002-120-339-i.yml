cite: 120.339(i)
title: 120.339(i)
text: '(i) A empresa responsável somente poderá contra-

  tar os serviços de um laboratório para ETSP que

  seja:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Indicar o laboratório contratado (informando

  nome, endereço, responsável técnico e dados de

  contato) que seja possuidor de no mínimo uma das

  formas de acreditação previstas e indicar qual(ais)

  delas o(s) laboratório(s) possui(em). Apresentar

  cópias dos respectivos certificados, incluindo es-

  copo de acreditação, além de cópia do contrato es-

  tabelecido entre a empresa e o laboratório.

  (1) [reservado];

  (2) acreditado pela Coordenação Geral de Acredi-

  tação - CGCRE/INMETRO;

  (3) acreditado pelo Sistema Nacional de Acredita-

  ção segundo requisitos da Sociedade Brasileira de

  Análises Clínicas - Sistema DICQ-SBAC;

  (4) acreditado pelo Sistema Nacional de Acredita-

  ção segundo requisitos da Organização Nacional de

  Acreditação - Sistema DICQ-ONA;Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (5) acreditado pelo Programa de Acreditação de

  Laboratórios Clínicos (PALC) da Sociedade Brasi-

  leira de Patologia Clínica/ Medicina Laboratorial

  (SBPC/ML); ou

  Obs.: empresas sujeitas a ‘programa simplificado’,

  ou seja, à isenção de cumprimento do previsto em'
