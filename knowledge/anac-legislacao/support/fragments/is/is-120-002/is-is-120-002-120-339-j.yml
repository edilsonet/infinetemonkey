cite: 120.339(j)
title: 120.339(j)
text: '(j) Deve ser garantido ao empregado o direito à

  contraprova para um resultado laboratorial posi-

  tivo. Esta análise de contraprova deve ser realizada

  segundo os padrões usados na obtenção do resul-

  tado positivo.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
