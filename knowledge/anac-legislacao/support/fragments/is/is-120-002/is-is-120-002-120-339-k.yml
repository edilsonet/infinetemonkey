cite: 120.339(k)
title: 120.339(k)
text: '(k) Previamente à realização de qualquer ETSP, o

  empregado deve ser informado de seu direito à re-

  cusa de submeter-se ao ETSP e das consequências

  dessa recusa.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
