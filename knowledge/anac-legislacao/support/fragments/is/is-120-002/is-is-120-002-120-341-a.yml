section_title: Retenção de documentos pela empresa
subsection_id: a
cite: 120.341(a)
title: 120.341(a)
text: '(a) A empresa responsável deve manter em um lo-

  cal seguro de acesso controlado, em papel ou mídia

  eletrônica, por um período de 5 (cinco) anos: Indicar em que parte, seção ou item do PPSP
  da

  empresa está atestado pela empresa o respeito a

  estas obrigatoriedades. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) documentos apresentados pelo empregado

  abrangido neste Regulamento que se contrapõem

  ao resultado dos ETSP sob esta subparte;

  (2) registros e notificações relacionados a qualquer

  evento impeditivo; e

  (3) demais documentos que comprovem o cumpri-

  mentos dos requisitos desta subparte.'
