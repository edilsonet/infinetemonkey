cite: 120.343(a)
title: 120.343(a)
text: '(a) Registros sobre resultados de ETSP avaliados

  pelo médico revisor devem ser mantidas por ele

  por 5 (cinco) anos em papel ou mídia eletrônica. Se

  a empresa responsável mudar seu médico revisor

  por qualquer motivo, a empresa responsável deve

  assegurar que o antigo médico revisor encaminhe

  todos os registros mantidos de acordo com esta se-

  ção ao novo médico revisor.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
