cite: 120.345(a)
title: 120.345(a)
text: '(a) Exceto como requerido em lei, ou expressa-

  mente autorizado, ou requerido nesta subparte, ne-

  nhuma empresa responsável ou médico revisor

  deve divulgar ou permitir o acesso a informações

  sobre empregados ARSO que estejam contidas em

  registros requeridos a serem mantidos sob esta sub-

  parte.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
