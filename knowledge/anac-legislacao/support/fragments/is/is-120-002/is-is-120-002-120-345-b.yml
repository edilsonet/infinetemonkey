cite: 120.345(b)
title: 120.345(b)
text: '(b) Um empregado ARSO pode, por meio de re-

  querimento escrito, ter vistas e obter cópias de

  quaisquer registros pertinentes aos ETSP aos quais

  ele foi submetido.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
