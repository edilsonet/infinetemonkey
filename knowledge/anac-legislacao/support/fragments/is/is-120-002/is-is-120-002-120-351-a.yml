title: 120.351(a)
text: '(a) Após um evento impeditivo, uma empresa res-

  ponsável, antes de permitir o retorno do empregado

  envolvido ao desempenho de uma ARSO, deve in-

  cluí-lo no subprograma de resposta a evento impe-

  ditivo, conforme esta subparte, que inclui as se-

  guintes medidas: Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) avaliação abrangente por um ESP;

  (2) recomendação pelo ESP de uma ou mais das

  seguintes ações:'
