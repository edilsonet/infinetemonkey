text: '(v) programa de tratamento em regime ambulato-

  rial; e

  (vi) programa de tratamento em regime de interna-

  ção.

  (3) a empresa responsável deve permitir que o indi-

  víduo cumpra o encaminhamento proposto;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (4) o ESP deverá produzir relatórios e mantê-los

  arquivados, em papel ou mídia eletrônica, por um

  período de 5 (cinco) anos;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (5) o método de cumprimento do Programa de Res-

  posta a Evento Impeditivo da empresa responsável

  deve estar descrito no PPSP desta empresa respon-

  sável.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
