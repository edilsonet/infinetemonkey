cite: 120.353(a)
title: 120.353(a)
text: '(a) O ESP deve ser detentor de diploma devida-

  mente registrado no MEC e registro profissional

  em conselho de classe válido e vigente que o ga-

  rantam a prerrogativa de realização de avaliação

  abrangente.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, declarar que:

  O especialista em transtornos decorrentes do uso

  de substâncias psicoativas no âmbito do presente

  PPSP é o Sr(a). <nome do médico ou do psicólogo,

  nº do CRM ou do CRP, estado da federação do

  CRM ou do CRP>.

  Pode ser indicado mais de um profissional para a

  função de ESP da empresa.

  O ESP pode ser também o médico revisor da em-

  presa.'
