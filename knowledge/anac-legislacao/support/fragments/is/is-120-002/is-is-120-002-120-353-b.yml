title: 120.353(b)
text: '(b) Além da formação básica e do registro profis-

  sional, o ESP deve ter, com relação ao tratamento

  dos transtornos decorrentes do uso de substâncias

  psicoativas, dependência química ou equivalentes,

  no mínimo:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  estas obrigatoriedades.

  Indicar quais os itens de qualificação acadê-

  mica/profissional o ESP atende de forma a cum-

  prir o previsto e fornecer a devida comprovação.

  (1) 2 (dois) anos de experiência de trabalho; ou

  (2) curso de extensão cujo currículo perfaça no mí-

  nimo 90 (noventa) horas e 1 (um) ano de experiên-

  cia de trabalho; ou

  (3) diploma de curso de pós-graduação, lato ou

  stricto sensu (especialização, mestrado ou douto-

  rado), reconhecido pelo MEC.

  SUBPARTE K

  DISPOSIÇÕES TRANSITÓRIAS E FINAIS N/A'
