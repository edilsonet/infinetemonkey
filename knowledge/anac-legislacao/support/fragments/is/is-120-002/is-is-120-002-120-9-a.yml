title: 120.9(a)
text: '(a) É vedado a qualquer empregado ARSO:

  Proibições aos empregados e às empresas.

  A empresa deve indicar explicitamente em que

  parte, seção ou item do PPSP da empresa está tra-

  tado, pela empresa, o respeito a estas proibi-

  ções/obrigatoriedades.

  (1) o uso de substâncias psicoativas durante o exer-

  cício de suas atividades;

  (2) o exercício de suas atividades enquanto estiver

  sob o efeito de qualquer substância psicoativa; e

  (3) o exercício de suas atividades caso tenha sido

  envolvido em um evento impeditivo e não tenha

  obtido um resultado negativo em um ETSP de re-

  torno ao serviço, conforme parágrafo 120.339(e)

  deste Regulamento.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D'
