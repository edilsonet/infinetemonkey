cite: 120.9(b)
title: 120.9(b)
text: '(b) Toda empresa responsável deve tomar as provi-

  dências necessárias, conforme a legislação brasi-

  leira vigente e este regulamento, para afastar de

  suas atividades qualquer empregado ARSO que

  contrarie a proibição contida no parágrafo (a) desta

  seção.

  A <Empresa> tomará as providências necessárias,

  conforme a legislação brasileira vigente e o RBAC

  120, para afastar de suas atividades qualquer em-

  pregado ARSO que contrarie as proibições conti-

  das no parágrafo (a) desta seção. Eventual ação de

  afastamento necessária será conduzida através do

  médico/setor médico da Empresa e de forma a pre-

  servar o sigilo e a confidencialidade das informa-

  ções médicas geradas.

  A empresa deve indicar explicitamente em que

  parte, seção ou item do PPSP da empresa estão

  contemplados seus procedimentos operacionais de

  forma a garantir o atendimento a este requisito,

  segundo legislação brasileira vigente e de forma a

  preservar o sigilo e confidencialidade das informa-

  ções médicas geradas.

