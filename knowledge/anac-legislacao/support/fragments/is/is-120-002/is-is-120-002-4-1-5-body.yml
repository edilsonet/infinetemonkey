text: '4.1.5 Exame Toxicológico de Substâncias Psicoativas (ETSP): exame toxicoló gico laboratorial

  destinado à detecçã o de substâ ncias psicoativas no organismo, incluindo, no mí nimo,
  as se-

  guintes: á lcool, metabó litos de opiá ceos, metabó litos de canabinoides, metabó litos
  de co-

  caí na, anfetaminas, metanfetaminas, metilenodioximetanfetamina e metilenodioxianfeta-

  mina. Para a substâ ncia á lcool, o ETSP també m pode ser realizado por meio de etilô
  metro.

  Um ETSP é considerado quando da realizaçã o de exames para todas as substâ ncias citadas.'
