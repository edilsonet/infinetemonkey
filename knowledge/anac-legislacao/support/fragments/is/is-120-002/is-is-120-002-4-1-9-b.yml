section_title: 'Recusa (em submeter-se ao ETSP): é o que ocorre quando um indivíduo'
subsection_id: b
cite: 4.1.9(b)
title: 4.1.9(b)
text: 'b) Interferiu ou tentou interferir na integridade da amostra corporal necessária ao

  ETSP requerido.

  Nota: não é considerado como recusa em submeter-se ao ETSP quando um indivíduo

  não conseguir fornecer uma amostra corporal para um ETSP por razões médicas avali-

  adas por um médico revisor.'
