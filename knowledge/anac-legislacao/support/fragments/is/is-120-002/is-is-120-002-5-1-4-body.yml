title: Outros detalhamentos do desenvolvimento e implantação dos programas previstos no RBAC
text: '5.1.4 Outros detalhamentos do desenvolvimento e implantação dos programas previstos
  no RBAC

  nº 120.

  5.2 Com o formato de um guia de referência de caráter orientativo, as empresas não devem

  interpretar o presente material como o único meio aceitável de cumprimento dos requisitos

  do RBAC nº 120. Poderão, assim, utilizar este documento como referência para a construção

  de seus próprios Programas a serem desenvolvidos respeitando as características próprias
  e

  o ambiente organizacional da empresa.

  5.3 Sugestões, comentários e dúvidas podem ser encaminhados à Técnica de Normas Operacio-

  nais (GTNO) da Superintendência de Padrões Operacionais (SPO) pelo e-mail:

  gtno@anac.gov.br.'
