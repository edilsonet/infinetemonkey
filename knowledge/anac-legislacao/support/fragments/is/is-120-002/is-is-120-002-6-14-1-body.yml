text: '6.14.1 A política para uso de medicamentos deve ser construída de forma que a empresa
  busque

  garantir o uso responsável de medicamentos por parte de empregados ARSO. O mau uso

  deliberado de medicamentos enquanto em serviço ou nas dependências da empresa deve ser

  proibido.'
