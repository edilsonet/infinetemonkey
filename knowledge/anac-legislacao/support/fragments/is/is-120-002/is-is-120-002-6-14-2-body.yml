title: Um empregado ARSO deve ter a anuência do setor médico ou do médico revisor da empresa
text: '6.14.2 Um empregado ARSO deve ter a anuência do setor médico ou do médico revisor da
  empresa

  antes de iniciar o uso de qualquer medicamento que tenha potencial para afetar sua capaci-

  dade de executar seu trabalho com segurança.'
