title: No advento eventual de uma circunstância inesperada em que um empregado ARSO seja
text: '6.14.5 No advento eventual de uma circunstância inesperada em que um empregado ARSO
  seja

  solicitado a realizar serviços inesperados enquanto estiver sob influência de álcool, outra

  substância psicoativa ou qualquer medicamento com potencial para causar impacto na segu-

  rança das operações, deve ser de responsabilidade do empregado informar o solicitante do

  serviço de sua situação. Onde for apropriado, o empregado ARSO deverá recusar a convo-

  cação, situação na qual não deve ser penalizado por recusar assumir aquele serviço inespe-

  rado.'
