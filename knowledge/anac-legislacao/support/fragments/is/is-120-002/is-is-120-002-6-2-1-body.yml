text: '6.2.1 Indica-se que, antes da implantação do Programa, seja feita uma ampla sensibilização
  sobre

  o tema, inicialmente dirigida à alta direção da empresa, podendo posterior e adicionalmente

  incluir funcionários em função de supervisão, funcionários ARSO em geral e suas famílias.

  6.3 A política da empresa deve ser desenvolvida em conjunto com os empregados e/ou seus

  representantes. O desenvolvimento da política deverá ser precedido por uma avaliação con-

  junta a ser realizada entre empregadores, empregados e seus representantes quanto aos po-

  tenciais efeitos do uso indevido de substâncias psicoativas no ambiente de trabalho especí-

  fico da empresa, considerando as particularidades das atividades desenvolvidas, aspectos
  da

  cultura local e outras questões relevantes que possam servir para melhor orientar as ações
  de

  um dado Programa.'
