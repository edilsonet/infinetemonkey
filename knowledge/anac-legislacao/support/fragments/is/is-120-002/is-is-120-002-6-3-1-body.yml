cite: 6.3.1
title: A implantação do Programa será idealmente precedida da elaboração de um Diagnóstico
text: '6.3.1 A implantação do Programa será idealmente precedida da elaboração de um Diagnóstico

  Situacional (DS), a ser realizado através de ampla pesquisa anônima - sob utilização de
  sis-

  tema eletrônico e/ou sistema impresso - com o objetivo de gerar um mapeamento específico

  dos problemas relacionados ao uso, uso nocivo e dependência do álcool e de outras substân-

  cias psicoativas, considerando a segurança dos empregados e do ambiente de trabalho espe-

  cífico da empresa em suas diversas bases, caso aplicável. A confecção do DS deverá prece-

  der a construção da Política e dos procedimentos - e, portanto, do PPSP - possibilitando

  otimização das ações posteriores.

  6.4 A alta direção da empresa deve estar envolvida e declarar compromisso com a implantação

  e os benefícios visados pelo Programa desde seu início, já nas ações de planejamento para

  implantação. Deverão também estar envolvidos com o Programa desde suas fases iniciais de

  planejamento: o setor jurídico da empresa, as chefias e supervisores das áreas implicadas

  (ARSO), pessoal de recursos humanos/gestão de pessoas, entre outros empregados, con-

  forme a estrutura organizacional da empresa.

  6.5 Os procedimentos descritos na Política devem garantir confidencialidade e sigilo para
  todas

  as informações derivadas do Programa da empresa, na máxima extensão em que possam ser

  praticados.

  6.6 Pode fazer parte da Política da empresa seu entendimento a respeito da dependência de
  subs-

  tâncias psicoativas. As diretrizes da Organização Mundial de Saúde a consideram como uma

  síndrome (doença), conforme definido na Classificação de Transtornos Mentais e de Com-

  portamento da CID-10. Em sua Política, a empresa poderá justificar sua adoção das ações

  de mitigação do risco relacionado ao uso indevido de substâncias psicoativas conforme o

  inseridos dentro do Programa cumprem um papel necessário para o controle do acesso a

  atividades de risco à segurança operacional tal como definidas pelo Regulamento.'
