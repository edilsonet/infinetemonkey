  política da empresa sobre o tema, em particular quanto aos exames toxicológicos a serem

  conduzidos em conformidade com o RBAC nº 120.

  6.10 Em sua Política a empresa pode estimular o entendimento de que os ETSP objetivam atender

  primordialmente ao interesse da coletividade dos usuários do sistema de aviação civil, bem

  como a população em geral, quanto à segurança operacional, sobrepujando, assim, eventuais

  interesses individuais contrários a uma relativa e parcial invasão da intimidade e privacidade

  de cada um dos empregados em atividade de risco, ao visar aquela finalidade última.

  6.11 Procedimentos: todos os procedimentos requeridos no âmbito do RBAC nº 120 devem estar

  descritos no Manual do PPSP da empresa.

  6.12 Revisão: O Manual do programa deve ser revisto sempre que necessário para sua melhoria

  contínua e visando documentar alterações na política, nas responsabilidades ou nos procedi-

  mentos.

  6.13 Exemplos de textos de Políticas podem ser encontrados no DOC 9654 - Anexo B.

  6.14 Política para medicamentos'
