text: '6. POLÍTICA

  6.1 O Manual do PPSP (descrito em maiores detalhes na Seção 10 desta IS) deve conter a Polí-

  tica da empresa para os assuntos a ele relacionados. Este documento deve ser assinado pela

  alta direção e seu conteúdo divulgado de modo a tornar-se de conhecimento de todos os

  implicados, no mínimo todos os funcionários em ARSO. A política deve incluir pelo menos

  os seguintes temas: prevenção, identificação, abordagem, tratamento e reabilitação, além
  de

  detalhes sobre em quais casos ações disciplinares serão aplicáveis.

  6.2 Seu conteúdo deve preferencialmente incluir o entendimento de que os transtornos decor-

  rentes do uso de substâncias psicoativas devem ser considerados como problemas de saúde

  e o uso indevido de substâncias como problema disciplinar, a serem abordados de forma

  técnica e não preconceituosa, em ambos os casos.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D'
