text: '7.2.2 e 7.2.3 Atualização de endereços eletrônicos de entidades de referência com conteúdo
  sobre o tema.

  Seção 8.9

  Alterações nas alíneas 8.9.1, 8.9.1 b), 8.9.2, e 8.9.2 c) para incluir previsão de uso de
  amostra bio-

  lógica de fluido oral para análise de todas as classes de substâncias previstas, exceto
  álcool. Inclu-

  são da Tabela 2 e alíneas 8.9.16 a 8.9.20, para o mesmo fim.'
