text: '7.2.4 Universidade Federal de São Paulo - UNIFESP: www.unifesp.br

  Nota: Recomenda-se para a capacitação dos profissionais de saúde requeridos para ações

  específicas do Programa, Médico Revisor (MR) e Especialista em transtornos decorrentes

  do uso de substâncias psicoativas (ESP), o Curso SUPERA, realizado em parceria entre a

  SENAD e a UNIFESP, na modalidade Educação à Distância.'
