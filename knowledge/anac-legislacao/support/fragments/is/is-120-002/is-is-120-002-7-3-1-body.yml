text: '7.3.1 Os itens de 1 a 11 do treinamento previsto pelo RBAC nº 120 em seu parágrafo
  120.323 (a)

  são dependentes de especificidades próprias ao desenvolvimento do PPSP de cada empresa.

  Para o cumprimento principalmente dos tópicos referidos no item 12, mas também incluindo

  temas a serem abordados por força dos itens 1 a 11, sugere-se abordar os seguintes assuntos

  e seu encadeamento, conforme disposto a seguir (adaptado do Anexo B do DOC 9654 da

  OACI):'
