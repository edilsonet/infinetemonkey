text: 'i) Efeitos de substâncias psicoativas - no mínimo as elencadas no Regulamento em

  120.335;

  I - O subprograma de educação não precisa se restringir às substâncias que são

  objeto de análise através de ETSP: a lista das substâncias psicoativas é mais

  ampla, conforme 120.7 (t);'
