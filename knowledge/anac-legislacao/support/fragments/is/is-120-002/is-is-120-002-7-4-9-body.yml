title: Um supervisor treinado também poderá atuar, dependendo da abrangência do treinamento
text: '7.4.9 Um supervisor treinado também poderá atuar, dependendo da abrangência do treinamento

  recebido, como um facilitador da reinserção do empregado em suas atividades após retorno

  ao serviço, conforme aplicável a partir do PPSP da empresa.'
