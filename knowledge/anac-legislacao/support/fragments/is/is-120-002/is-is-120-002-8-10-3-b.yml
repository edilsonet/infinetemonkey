title: 8.10.3(b)
text: 'b) Amostra adulterada: amostra de urina contendo substância que não é um consti-

  tuinte normal da urina humana ou contendo substância endógena em uma concen-

  tração que não é fisiologicamente normal.

  I - Não há uma explicação médica aceitável para a urina adulterada, assim, esses

  casos devem ser tratados como uma recusa, caracterizando um evento impe-

  ditivo.

  II - A adulteração em amostra de urina pode ser identificada de modo simplifi-

  cado através de um teste de pH e outro para identificar um ou mais compo-

  nentes oxidantes.

  III - Meios de identificar uma amostra de urina adulterada:

  i. O pH da amostra não-adulterada deve ficar entre 3,0 e 11,0.

  ii. Concentração de nitrito (NO2) acima de 500 mcg/ml (acima de

  200mcg/ml a amostra seve ser invalidada).

  iii. Presença de surfactantes (inclui detergentes comuns).

  iv. Presença de um halogênio oxidativo.

  v. Presença de glutaraldeído.

  vi. Presença de clorocromato de piridina.'
