title: 8.10.3(c)
text: 'c) Amostra substituída: os critérios para determinar se uma amostra de urina foi subs-

  tituída se baseiam em níveis fisiológicos de concentração de creatinina e gravidade

  específica para a urina humana. Uma amostra é considerada substituída quando si-

  multaneamente:

  I - A concentração de creatinina é inferior a 2 mg/dl.

  II - A gravidade específica é inferior a 1.0010 ou superior a 1.0200.

  III - A amostra substituída, quando por ação do doador, também deve ser interpre-

  tada como uma recusa.'
