title: 8.10.3(d)
text: 'd) Inválido: quando existe uma substância adulterante ou interferente não identificada,

  mas que não extrapola os níveis de corte definidos para uma amostra substituída ou

  adulterada. Nesse caso o exame é cancelado, devendo outro ser realizado a seguir.Data de
  emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  Nota: A presença de material diluído mesmo em resultado positivo deverá ser men-

  cionada.'
