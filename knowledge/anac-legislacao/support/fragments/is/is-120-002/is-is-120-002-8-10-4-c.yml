cite: 8.10.4(c)
title: 8.10.4(c)
text: 'c) Inválido: os critérios para um laboratório reportar resultado inválido para análise

  em amostra de fluido oral são:

  I - Ocorre interferência nos testes iniciais em duas alíquotas separadas da amos-

  tra;

  II - Ocorre interferência na análise confirmatória em duas alíquotas separadas da

  amostra e o laboratório não pode identificar a substância envolvida na inter-

  ferência;

  III - A aparência física da amostra (p. ex. viscosidade) é tal que testar a amostra

  pode danificar os instrumentos do laboratório;

  IV - A amostra foi testada mas as aparências das amostras primária e secundária

  são claramente diferentes; ou

  V - A concentração de um biomarcador (p. ex. albumina ou IgG) não é consis-

  tente com o estabelecido para fluido oral humano nas análises de duas alíquo-

  tas separadas da amostra.

  8.11 Médico Revisor (MR)'
