  em
text: '8.11.3 Ao receber o formulário de cadeia de custódia o MR deve verificar se houve algum
  erro em

  seu preenchimento, como a falta de uma assinatura ou outro fator que invalide o exame. Esta

  verificação deve ser feita ainda que, em geral, os laboratórios responsáveis pelos exames

  também a conduzam.'
