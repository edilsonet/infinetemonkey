text: '8.11.7 O MR deve fazer pelo menos 6 (seis) tentativas de contato com o indivíduo examinado
  es-

  paçadas em 48h. Se o prazo se esgotar sem sucesso, o MR deve entrar em contato com o

  RD, pedindo que o indivíduo examinado o contate. A partir do contato do MR com o RD, o

  indivíduo examinado tem mais 72h para marcar uma entrevista com o MR.'
