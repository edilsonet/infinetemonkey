text: '8.11.9 Após rever o exame laboratorial, o MR envia ao RD um documento relatando o resultado

  do ETSP e eventuais comentários, como, por exemplo, se houve entrevista e quando ela

  aconteceu.

  8.12 ETSP baseado em suspeita justificada.'
