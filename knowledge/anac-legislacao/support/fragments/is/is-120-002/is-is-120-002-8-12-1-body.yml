title: O empregador, através do supervisor treinado, pode solicitar ao empregado coberto pelo
text: '8.12.1 O empregador, através do supervisor treinado, pode solicitar ao empregado coberto
  pelo

  programa que se submeta a um exame específico de alcoolemia ou de detecção de outras

  substâncias psicoativas quando houver motivos ou suspeitas razoáveis, atestadas por escrito,

  de que o empregado tenha violado proibições previstas no Programa da empresa.'
