title: A decisão para a realização de um exame sob suspeita ou motivo justificado deve basear-se
text: '8.12.2 A decisão para a realização de um exame sob suspeita ou motivo justificado deve
  basear-se

  em uma suspeita justificada por escrito de que o empregado em questão esteja sob influência

  de (alguma) substância psicoativa. Esta observação a ser registrada será feita a partir
  de da-

  dos específicos, observados no momento presente, contendo observações referidas ao com-

  portamento/conduta do empregado, indicadores de desempenho e sinais físicos que apontem

  para a possibilidade de consumo de substância psicoativa.'
