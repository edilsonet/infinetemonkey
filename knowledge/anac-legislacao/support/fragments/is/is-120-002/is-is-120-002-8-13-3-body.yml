title: Outras razões que justificam a não realização de um ETSP pós-acidente, a serem igualmente
text: '8.13.3 Outras razões que justificam a não realização de um ETSP pós-acidente, a serem
  igualmente

  atestadas em documento específico pelo setor competente da empresa, são aquelas ligadas
  à

  falta de ‘condições adequadas’, o que inclui qualquer atendimento médico necessário ou a

  impossibilidade, naquela situação específica, de realizar o ETSP dentro da janela de detecção

  prevista (8h para álcool, com etilômetro, e 32h para outras substâncias).'
