text: '8.13.4 A empresa pode ainda ampliar para além do mínimo estabelecido pelo regulamento
  o rol de

  situações geradoras de ETSP pós-acidente passando a incluir também acidentes de trabalho

  e/ou eventos de segurança operacional de forma geral (incluindo ocorrências anormais ou

  qualquer situação de risco com potencial para causar dano ou lesão ou ameaçar a viabilidade

  de sua operação), a partir de definição neste sentido introduzida em seu manual PPSP e

  considerando aspectos específicos do tipo de operação conduzida.'
