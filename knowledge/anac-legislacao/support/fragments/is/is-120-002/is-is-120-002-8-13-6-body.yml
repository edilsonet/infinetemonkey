title: Nas ações de fiscalização documentais/correntes ou conduzidas no local da empresa,
  ela
text: '8.13.6 Nas ações de fiscalização documentais/correntes ou conduzidas no local da empresa,
  ela

  deverá apresentar seu planejamento para, após um acidente, incidente ou ocorrência de solo,

  conduzir um exame requerido: para álcool, em até 8h do evento (disponibilidade de etilôme-

  tro) e, para outras substâncias, em até 32h do evento ocorrido (disponibilidade de coletor

  treinado e material para coleta), em conformidade com os requisitos aplicáveis.'
