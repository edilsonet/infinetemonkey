text: '8.3.3 Apenas um indivíduo deve passar pelo processo de coleta sob supervisão por vez,
  para cada

  coletor. Esse procedimento o ajuda a dedicar mais atenção às possíveis tentativas de adulte-

  ração e substituição de amostra, assim como evitar que haja falhas que invalidem a coleta,

  como, por exemplo, não solicitar a assinatura do doador.'
