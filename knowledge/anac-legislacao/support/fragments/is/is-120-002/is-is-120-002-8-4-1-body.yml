text: '8.4.1 O indivíduo do qual se fará a coleta deve ser informado de que ele não é obrigado
  a fornecer

  uma amostra biológica para cumprir o ETSP. Ao mesmo tempo, deve ser informado de que

  a recusa em fornecê-la acarretará em afastamento imediato de ARSO por período indetermi-

  nado, até que sejam cumpridas as condições previstas para retorno ao serviço, conforme

  estabelece a subparte J do RBAC nº 120.'
