text: '8.5.7 Observações pertinentes.

  8.6 Quando do registro da coleta no livro de registro, deve-se preencher também o formulário

  de cadeia de custódia, que irá acompanhar a amostra, o qual contém informações similares

  às descritas acima, como o nome e a assinatura do doador.

  8.7 Se um empregado não comparecer para a doação de amostra em determinado intervalo de

  tempo após ter recebido a comunicação de sua indicação isso pode ser considerado como

  uma recusa. Os critérios para esta delimitação devem estar estabelecidos no PPSP da em-

  presa.

  8.8 Coleta de ar expirado para exame de alcoolemia'
