text: '8.8.2 O valor de corte indicado para a caracterização de resultado positivo para a
  substância álcool

  etílico em amostra de ar expirado analisada através de etilômetro em conformidade com os

  requisitos aplicáveis do RBAC nº 120 é de 0,10 mg/L, sendo o resultado a ser considerado

  o valor correspondente ao da leitura diretamente realizada e exibida pelo etilômetro.'
