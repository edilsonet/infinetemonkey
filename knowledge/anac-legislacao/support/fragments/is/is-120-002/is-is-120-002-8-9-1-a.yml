title: 8.9.1(a)
text: 'a) Exames com a matriz biológica urina vêm sendo utilizados há várias décadas e con-

  tinuamente tomados como objeto de estudos científicos, permanecendo válidos e

  em uso corrente por diversos países, instituições e empresas enquanto a melhor

  forma de exame pericial para detecção de substâncias psicoativas com validade fo-

  rense.'
