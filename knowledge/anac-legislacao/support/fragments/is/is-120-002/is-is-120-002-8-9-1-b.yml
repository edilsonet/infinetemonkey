cite: 8.9.1(b)
title: 8.9.1(b)
text: 'b) Exames toxicológicos em amostras de fluido oral possuem, igualmente, significati-

  vos estudos e crescentes aplicações, em específico para a detecção de uso recente.

  São aceitáveis desde que realizados em todas as suas etapas sob a responsabilidade

  de laboratório acreditado e atuando em conformidade com as demais previsões nor-

  mativas.'
