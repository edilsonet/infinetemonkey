  Nota: Adaptado de “DEPARTMENT OF HEALTH AND HUMAN SERVICES. 42 CFR

  Chapter I. Mandatory Guidelines for Federal Workplace Drug Testing Programs -

  Oral/Fluid. Effective January 1, 2020. Substance Abuse and Mental Health Services Ad-

  ministration (SAMHSA).”

  (1) Para analitos agrupados (ou seja, dois ou mais analitos na mesma classe de substâncias
  e

  com o mesmo limiar para exame preliminar / screening):

  Imunoensaio: O teste deve ser calibrado com um analito do grupo identificado como ana-

  lito alvo. A reatividade cruzada do imunoensaio para o(s) outro(s) analito(s) dentro do

  grupo deve ser de 80% ou acima. De outra forma, imunensaios separados devem ser usa-

  dos para os analitos do mesmo grupo.

  Tecnologia alternativa: Ao menos um dos analitos de cada grupo de substâncias deve ser

  usado para calibração. No mínimo um dos analitos dentro do grupo deve ter concentraçãoData
  de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  igual ou superior ao do limiar do exame preliminar. Alternativamente, a soma dos analitos

  presentes deve ser igual ou superior ao limiar do exame preliminar.

  (2) Um imunoensaio deve ser calibrado com o analito alvo, Delta-9-Tetrahidrocanabidiol

  (THC).

  (3) Tecnologia alternativa (THC e 6-AM): O limiar do teste confirmatório deve ser usado

  para um teste inicial alternativo que seja específico para o analito alvo (ou seja, 2 ng/mL

  para THC e 2 ng/mL para 6-AM).

  (4) Metilenodioximetanfetamina (MDMA).

  (5) Metilenodioxianfetamina (MDA).

  Atenção especial ao fato de que a coleta de fluido oral deve ser conduzida em local que

  permita razoável privacidade, onde apenas pessoal autorizado e o doador da amostra este-

  jam presentes.'
