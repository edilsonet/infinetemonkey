text: '8.9.16 Cada coleta de fluido oral deve gerar duas amostras, para servirem de prova
  e contraprova,

  contendo no mínimo 1ml cada, coletadas em sequência ou simultaneamente, usando-se dois

  dispositivos de coleta ou um único.'
