cite: 8.9.2(b)
title: 8.9.2(b)
text: 'b) Resguarda-se, ainda, a possibilidade de utilização de exames toxicológicos em

  amostra biológica de queratina para os exames a serem eventualmente realizados

  para fins de pesquisa diagnóstica, no âmbito da avaliação abrangente a ser feita pelo

  ESP da empresa, após evento impeditivo configurado em conformidade com o re-

  gulamento. Estes exames não devem se confundir com os previstos nos parágrafos'
