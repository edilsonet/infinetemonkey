title: A adoção destas matrizes biológicas visa dar cumprimento à análise das proibições previstas
text: '8.9.2 A adoção destas matrizes biológicas visa dar cumprimento à análise das proibições
  previstas

  no parágrafo 120.9 (a) do RBAC nº 120 e especificamente no parágrafo 120.9 (a) (2), res-

  peitando igualmente a definição de “uso indevido de substâncias psicoativas” presente
  no

  parágrafo 120.7 (w), e fazendo recurso à avaliação de possível “uso recente”, tal como
  pre-

  vista no parágrafo 120.331 (d).'
