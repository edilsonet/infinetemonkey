text: '8. SUBPROGRAMA DE EXAMES TOXICOLÓGICOS DE SUBSTÂNCIAS PSICOA-

  TIVAS

  8.1 Quaisquer ações referentes a exames toxicológicos requeridas pelo programa, incluindo
  a

  coleta de amostra corporal, transporte, armazenamento, análise e obtenção do resultado de-

  vem ser acompanhadas de termo(s) de consentimento assinado(s) pelo empregado/indivíduo

  envolvido.

  8.2 Acesso aos resultados do exame. O empregado deverá ter acesso aos resultados dos exames

  toxicológicos sobre si próprio a qualquer tempo.

  8.3 Recomendações gerais para o procedimento de coleta:Data de emissão: 19 de novembro de
  2021

  IS nº 120-002

  Revisão D'
