text: '9.1.1 Funções do ESP - um Especialista em transtornos decorrentes do uso de Substâncias
  Psico-

  ativas na aviação civil é um profissional de saúde habilitado para realizar uma avaliação

  abrangente para um empregado com um evento impeditivo caracterizado. Este profissional

  atestará recomendações referentes a ações de orientação disciplinar e/ou tratamento, e acom-

  panhamento através de exames toxicológicos. A principal função do ESP é proteger o inte-

  resse público em segurança através do exercício de suas prerrogativas de acordo com o

  vidades da empresa de forma a possibilitar o retorno ao serviço do empregado envolvido em

  evento impeditivo. A responsabilidade fundamental deste profissional é prover uma avalia-Data
  de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  ção clínica individual, incluindo diagnóstico, de forma a determinar qual o nível de assistên-

  cia médico-psicológica o empregado necessita para resolver seus problemas relacionados ao

  uso de substância(s) psicoativa(s).'
