text: '9.1.13 Para evitar conflito de interesses em relação a sua prática profissional o ESP
  não deve enca-

  minhar o empregado para sua prática privada, para profissional ou organização de quem

  receba remuneração ou ainda para pessoa ou organização que represente interesse financeiro.

  Ao ESP não deverá ser permitido encaminhar o empregado para entidades com as quais haja

  associação financeira.'
