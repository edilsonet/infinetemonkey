section_title: Recomendações para o ESP relativas à avaliação de retorno ao serviço
subsection_id: b
cite: 9.1.15(b)
title: 9.1.15(b)
text: 'b) Conduzir entrevista(s) para avaliar se o empregado demonstra ter cumprido ade-

  quadamente as recomendações de tratamento e se está apto a realizar exame de re-

  torno ao serviço, de tal forma que possa, em caso de exame de retorno com resultado

  negativo, retomar suas atividades sem comprometer a segurança das atividades por

  ele realizadas ou a segurança das operações da empresa.'
