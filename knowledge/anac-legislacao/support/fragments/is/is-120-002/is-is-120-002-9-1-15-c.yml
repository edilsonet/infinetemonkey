title: 9.1.15(c)
text: 'c) O ESP pode decidir que o empregado está apto a ser encaminhado para um exame

  de retorno ao serviço mesmo antes que ele, o empregado, tenha concluído todo o

  percurso das recomendações recebidas para seu tratamento.'
