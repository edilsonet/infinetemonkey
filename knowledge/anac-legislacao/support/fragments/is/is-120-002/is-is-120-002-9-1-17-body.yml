title: O pagamento pela avaliação do ESP poderá depender de um acordo entre empregados e/ou
text: '9.1.17 O pagamento pela avaliação do ESP poderá depender de um acordo entre empregados
  e/ou

  seus representantes e empregador. Este tema deverá estar incluído na Política/procedimentos

  da empresa, tendo sido discutido quando de sua construção em conjunto entre o empregador

  e os empregados e/ou seus representantes, e divulgado aos empregados por ocasião do Sub-

  programa de Educação da empresa a forma específica pela qual o ESP será acessado e re-

  munerado por seus serviços.'
