title: Uma empresa ou um conjunto de empresas ou ainda uma associação de classe de emprega-
text: '9.1.18 Uma empresa ou um conjunto de empresas ou ainda uma associação de classe de
  emprega-

  dos obrigados a ações do programa podem se organizar com a finalidade de desenvolver e

  implantar serviço de tratamento realizado por pares, egressos de programa de tratamento
  e

  reabilitação bem sucedido. Este tipo de iniciativa tende a contribuir positivamente para
  a

  reinserção profissional dos indivíduos afetados, melhorando os resultados gerais a serem

  obtidos pelo Programa.'
