title: Após realizado o tratamento determinado e antes do retorno do funcionário ao trabalho
  o
text: '9.1.4 Após realizado o tratamento determinado e antes do retorno do funcionário ao
  trabalho o

  ESP deverá realizar nova(s) entrevista(s) individual(ais), na medida do necessário, para
  que

  possa avaliar se houve cumprimento satisfatório das recomendações iniciais. Caso seja ne-

  cessário, nesta ocasião ele poderá realizar encaminhamentos adicionais de modo a reorientar

  da melhor forma o tratamento necessário do empregado visando seu retorno ao serviço.'
