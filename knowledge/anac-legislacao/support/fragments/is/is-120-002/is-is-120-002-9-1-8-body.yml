text: '9.1.8 As recomendações de ações de tratamento podem, e sempre que possível devem incluir
  a

  frequência e a participação em grupos anônimos de ajuda mútua (Alcoólicos Anônimos e/ou

  Narcóticos Anônimos), desde que realizada em paralelo a acompanhamento/atendimento

  psicoterapêutico realizado por profissional de saúde qualificado.'
