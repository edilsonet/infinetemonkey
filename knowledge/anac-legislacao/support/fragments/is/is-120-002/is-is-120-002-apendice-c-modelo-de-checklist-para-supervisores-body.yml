text: 'APÊNDICE C - MODELO DE CHECKLIST PARA SUPERVISORES

  FORMULÁRIO DE ENCAMINHAMENTO DE EMPREGADO A EXAME TOXICOLÓGICO

  MOTIVADO POR SUSPEITA JUSTIFICADA [RBAC 120.339 (d)]

  Nome do Empregado: Data:

  Indicadores físicos e comportamentais:

   Vestuário inadequado

   Higiene pessoal precária

   Sinais físicos de possível uso, p. ex. odor alcoólico, olhos vermelhos, espasmos, pupilas
  dilatadas, hipe-

  ratividade incomum, fala arrastada, etc (especificar):_________________________________

   Falta de concentração

   Confusão mental

   Labilidade emocional

   Outros (especificar)

  Comentários:

  Indicadores de desempenho:

   Desempenho subitamente comprometido

   Significativa variabilidade no desempenho

   Tarefas frequentemente incompletas

   Constantes erros operacionais

   Incapacidade de seguir ou lembrar instruções recebidas

   Julgamento deficiente

   Queixa de terceiros (público em geral)

   Queixa de outros colaboradores

   Danos frequentes a equipamentos

   Outros (especificar)

  Comentários:

  Absenteísmo e atrasos frequentes:

   Saídas não autorizadas do local de trabalho

   Uso excessivo de licenças médicas

   Atrasos frequentes no retorno ao trabalho após pausas e interrupções

   Absenteísmo (faltas frequentes ou não justificadas)

   Absenteísmo frequente às sextas e/ou segundas-feiras

  Comentários:

  Problemas de segurança operacional

   Falha no atendimento a requisitos ou instruções de importância para a segurança operacional

   Lesões frequentes no ambiente de trabalho

   Envolvimento frequente em acidentes de trabalho

  Comentários:

  Assinatura(s):

  ______________________________ _____________________________

  Supervisor treinado Supervisor treinado adicional (opcional)

  Análise pelo Setor Médico / Médico Revisor:

   Em ___/___/_____: Realize-se ETSP para as substâncias previstas em 120.335 (a).

   Realize-se, adicionalmente, ETSP para a(s) seguinte(s) substância(s) psicoativa(s):

  _______________________________________________

   Não se realize ETSP. Motivo:______________________________

  ______________________________

  Setor Médico / Médico RevisorData de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D'
