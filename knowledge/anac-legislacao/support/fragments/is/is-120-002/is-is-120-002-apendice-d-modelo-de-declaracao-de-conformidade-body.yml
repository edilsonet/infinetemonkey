title: APÊNDICE D - MODELO DE DECLARAÇÃO DE CONFORMIDADE
text: 'APÊNDICE D - MODELO DE DECLARAÇÃO DE CONFORMIDADE

  Modelo de Declaração de Conformidade - RBAC 120 - Emenda 03

  DECLARAÇÃO DE CONFORMIDADE

  <Nome da Empresa>

  Certifico que esta Declaração de Conformidade foi desenvolvida pela <Nome da Empresa> e
  reflete

  a maneira adotada pela empresa para o cumprimento dos requisitos de segurança operacional
  contidos

  no Regulamento de Brasileiro de Aviação Civil nº 120 - RBAC 120, emenda 03.

  Declaro que os métodos de conformidade aqui listados ou referenciados são de minha inteira
  respon-

  sabilidade, bem como o seu contínuo cumprimento.

  ___________<Assinatura>___________

  <Nome completo do Gestor Responsável>

  <Título ou função ocupada da empresa>

  < nº CPF>

  Data: ________________

  REPRESENTANTE DESIGNADO

  <Nome da empresa e Logotipo, se houver>

  Eu, _____<Nome completo do Gestor Responsável>____, Gestor Responsável da _<Nome da Em-

  presa>_, designo o Sr. ___<nome do representante designado-RD>___, CPF nº _<CPF do RD>_,

  empregado regular desta empresa na função/cargo de ___<função ou cargo do RD>___, como nosso

  Representante Designado nos termos do RBAC 120, possuidor de autoridade e responsabilidade
  para

  responder pela elaboração, execução e manutenção do Programa de Prevenção do Risco Associado

  ao Uso indevido de Substâncias Psicoativas - PPSP da empresa, pelo cumprimento dos subprogramas

  e de todos os requisitos aplicáveis do RBAC 120, assim como pela prestação de contas, sem
  prejuízo

  da responsabilidade final da _<Nome da Empresa>_.

  <Assinatura>___________

  <Nome completo do Gestor Responsável>

  <Título ou função ocupada da empresa>

  < nº CPF>

  Ciente,

  _____________<Assinatura>_____________

  <Nome completo do representante designado>

  Data: ________________Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  RBAC 120 (Emd 03)

  Programa de Prevenção do Risco Associado ao

  Uso Indevido de Substâncias Psicoativas na Avi-

  ação Civil

  SUBPARTE A

  GERAL'
