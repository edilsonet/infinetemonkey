title: 'requisitos:'
text: 'requisitos:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) a taxa percentual mínima anual de empregados

  examinados de forma aleatória deverá ser:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Indicar, especificamente, qual o número total de

  empregados ARSO sob o PPSP da empresa no mo-

  mento de apresentação desta declaração, ou o nú-

  mero médio estimado de empregados ARSO previs-

  tos para o período de 5 anos a partir desta data (o

  que for maior), e em que faixa a empresa se enqua-

  dra quanto à taxa percentual mínima anual de em-

  pregados a serem examinados de forma aleatória.

  Obs.: Diante de qualquer previsão de alteração no

  número de empregados ARSO que possa produzir

  alteração da faixa quanto à taxa mínima anual

  obrigatória, o PPSP deverá ser previamente revi-

  sado e revalidado junto à ANAC, contendo os no-

  vos dados de número de empregados ARSO e a

  nova faixa para realização dos ETSP aleatórios.'
