text: '(c) ETSP pós-acidente: toda empresa responsável

  deve conduzir ETSP pós-acidente, conforme os se-

  guintes requisitos:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) após a ocorrência de acidente, incidente ou

  ocorrência de solo, a empresa responsável deve en-

  caminhar para um ETSP, se houver condições ade-

  quadas, os empregados ARSO envolvidos, a não

  ser que possa ser claramente determinado, para

  cada empregado ARSO, que sua performance não

  contribuiu para o acidente;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (2) nenhum empregado ARSO requerido a realizar

  um ETSP pós-acidente poderá consumir substância

  psicoativa até que o referido exame seja conduzido,

  considerando que haja condições adequadas;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (3) nada nesta seção pode ser usado para atrasar ou

  impedir a atenção médica necessária para algum

  indivíduo envolvido em acidente, incidente ou

  ocorrência de solo; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (4) as condições adequadas para realizar um ETSP

  pós-acidente mencionadas acima são tais que:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
