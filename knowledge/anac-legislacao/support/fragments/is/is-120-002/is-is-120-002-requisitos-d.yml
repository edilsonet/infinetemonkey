title: requisitos(d)
text: '(d) ETSP baseado em suspeita justificada: toda em-

  presa responsável deve conduzir ETSP baseados

  em suspeita justificada conforme os seguintes re-

  quisitos:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) a empresa responsável deve conduzir um em-

  pregado ao ETSP se houver suspeita justificada de

  que ele está sob influência de substância psicoa-

  tiva;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (2) a decisão de examinar um empregado deve se

  basear em suspeita justificada, realizada por um

  Supervisor Treinado para Encaminhamento a

  ESTP;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (3) o supervisor que determina a existência de sus-

  peita justificada não deve realizar o ETSP no em-

  pregado; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (4) na ausência de um ETSP, nenhuma empresa

  responsável pode tomar medidas no âmbito deste

  regulamento com base exclusivamente na suspeita

  justificada;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
