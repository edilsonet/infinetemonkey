title: requisitos(e)
text: '(e) ETSP de retorno ao serviço: uma empresa res-

  ponsável, antes de permitir que um indivíduo volte

  a desempenhar uma ARSO após um evento impe-

  ditivo, deve submetê-lo a um ETSP de retorno ao

  serviço e obter um resultado negativo para este in-

  divíduo. O ETSP não deve ocorrer até que o ESP

  da empresa responsável tenha determinado que o

  indivíduo cumpriu as recomendações feitas a ele,

  conforme subparte J deste Regulamento.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
