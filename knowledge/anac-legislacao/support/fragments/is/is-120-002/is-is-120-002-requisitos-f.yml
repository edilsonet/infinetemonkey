title: requisitos(f)
text: '(f) ETSP de acompanhamento: toda empresa res-

  ponsável deve conduzir ETSP de acompanha-

  mento, conforme os seguintes requisitos:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (1) a empresa responsável deve realizar ETSP não

  anunciados para todo indivíduo contratado para de-

  sempenhar uma ARSO e que está voltando a de-

  sempenhar uma ARSO após o retorno ao serviço

  decorrente de um evento impeditivo;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (2) o número e freqüência de tais ETSP devem ser

  determinados pelo ESP da empresa responsável (ou

  ESP contratado pela empresa responsável) e deve

  conter no mínimo 6 (seis) ETSP nos primeiros 12

  (doze) meses seguintes ao retorno ao serviço deste

  empregado;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.

  (3) os ETSP de acompanhamento não devem exce-

  der 60 (sessenta) meses a contar da data de retorno

  ao serviço do indivíduo que desempenhará uma

  ARSO. O ESP da empresa responsável pode cance-

  lar os ETSP de acompanhamento a qualquer mo-

  mento se determinar que tais ETSP não são mais

  necessários, desde que, no mínimo, 6 (seis) ETSP

  nos primeiros 12 (doze) meses tenham sido condu-

  zidos; e

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (4) os indivíduos que estiverem sendo submetidos

  aos ETSP de acompanhamento devem ser excluí-

  dos do conjunto de empregados elegíveis para a re-

  alização de ETSP aleatórios e devem retornar ao

  conjunto imediatamente após o término da série de

  ETSP de acompanhamento programada.

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade. Ou seja, deverá definir de

  que forma este requisito será implantado operacio-

  nalmente.'
