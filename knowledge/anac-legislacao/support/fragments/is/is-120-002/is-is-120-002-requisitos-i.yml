title: requisitos(i)
text: '(i) 50% (cinquenta por cento), para uma empresa

  responsável que possui até 500 (quinhentos) em-

  pregados ARSO, inclusive;

  (ii) 28% (vinte e oito por cento) ou 250 (duzentos e

  cinquenta) ETSP, o que for maior, para uma em-

  presa responsável que possui de 501 (quinhentos e

  um) a 2000 (dois mil) empregados ARSO, inclu-

  sive; e

  (iii) 7% (sete por cento) ou 560 (quinhentos e ses-

  senta) ETSP, o que for maior, para uma empresa

  responsável que possui mais de 2000 (dois mil)

  empregados ARSO.

  (2) a metodologia eleita para o ETSP aleatório

  deve garantir uma seleção isenta e imparcial da

  pessoa a ser testada, devendo identificar clara-

  mente cada pessoa de forma única e ser auditável;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.Data de emissão: 19 de novembro de 2021

  IS nº 120-002

  Revisão D

  (3) cada empregado ARSO deve ter a mesma

  chance de ser selecionado a cada vez em que é rea-

  lizada a seleção;

  Indicar e descrever brevemente o método de sele-

  ção escolhido para atendimento a este requisito.

  (4) a empresa responsável deve selecionar e exami-

  nar uma taxa percentual anualizada de empregados

  igual ou maior à taxa mínima e deve dividir o nú-

  mero de resultados de ETSP aleatórios realizados

  pelo número médio de empregados que desempe-

  nham ARSO para determinar se alcançou a taxa

  mínima anual, conforme os parágrafos

  120.339(b)(1) a 120.339(b)(3);

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  (5) toda empresa responsável deve certificar-se de

  que os ETSP aleatórios conduzidos sob esta sub-

  parte não sejam previamente anunciados e que as

  datas para as realizações dos ETSP aleatórios se-

  jam distribuídas de forma não regular durante o

  ano;

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Ou seja:

  Indicar método para escolha das datas para reali-

  zação de ETSP e método para o anúncio da obri-

  gatoriedade de um ETSP requerido.

  (6) toda empresa responsável deve requerer que um

  empregado ARSO, selecionado para um ETSP ale-

  atório, proceda para o local de coleta imediata-

  mente, considerando que:

  Indicar em que parte, seção ou item do PPSP da

  empresa está atestado pela empresa o respeito a

  esta obrigatoriedade.

  Ou seja:

  Indicar método para o anúncio da obrigatoriedade

  de ETSP para um empregado ARSO selecionado e

  procedimentos para realização do ETSP reque-

  rido. Incluir o respeito ao previsto no item 8.7

  desta Instrução Suplementar.'
