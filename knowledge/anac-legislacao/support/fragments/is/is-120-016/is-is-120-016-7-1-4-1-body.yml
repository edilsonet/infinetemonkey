title: Todas as aeronaves dos modelos de aeronaves listados na autorização sejam mantidas
  de acordo com o Programa de Manutenção.
text: '7.1.4.1 Todas as aeronaves dos modelos de aeronaves listados na autorização sejam mantidas
  de acordo com o Programa de Manutenção.

  7.1.4.2 O Programa de Manutenção deve ser suficientemente abrangente em seu escopo e detalhes
  de modo a permitir que o operador mantenha suas aeronaves em condições aeronavegáveis, de
  acordo com regulamentos brasileiros.

  7.1.4.3 As aeronaves, partes e componentes das aeronaves pertencentes aos modelos listados
  devem ser mantidos em condições aeronavegáveis de acordo com os tempos limites para cumprimento
  de revisão geral (overhaul), trocas de peças, inspeções periódicas e checks de rotina. Os
  tempos limites ou os padrões para determiná-los devem constar na programação de manutenção
  a ser aprovada pela Anac.

  7.1.4.4 Itens pertencentes à categoria on condition devem ser mantidos em condições aeronavegáveis
  através de inspeções, checks, serviços, reparos e manutenção preventiva periódicos. Os procedimentos
  e padrões para as inspeções, checks, serviços, reparos, manutenção preventiva e testes devem
  constar no manual de manutenção do operador.

  7.1.4.5 Partes ou subconjuntos de componentes que não possuam intervalo de tempo definido
  para ações de manutenção devem ser checados, inspecionados ou revisados (inclui overhaul)
  no mesmo intervalo definido para o conjunto maior ou intervalo definido pela ATA 100.

  7.1.5 Objetivos do Programa de Manutenção de Aeronavegabilidade Continuada. O PMAC deve
  assegurar que três objetivos específicos do programa sejam alcançados a fim de proporcionar
  o mais alto nível de segurança possível no transporte aéreo:'
