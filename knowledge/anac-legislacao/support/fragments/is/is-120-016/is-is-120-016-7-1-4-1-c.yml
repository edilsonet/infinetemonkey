cite: 7.1.4.1(c)
title: 7.1.4.1(c)
text: 'c) O detentor do certificado ou qualquer outra pessoa fornece pessoal competente e
  instalações e equipamentos adequados para realizar manutenção e alterações na aeronave do
  operador.

  7.1.6 Sistema de Análise e Supervisão Continuada (SASC). O PMAC também deve ter um sistema
  de vigilância continuada, investigação, coleta de dados, análise, ações corretivas e acompanhamento
  de ações corretivas que assegure que todas as partes de seu PMAC sejam eficazes e estejam
  sendo executadas de acordo com o seu manual de manutenção. Deve-se atentar para a diferença
  entre "Eficácia” e “Desempenho” na execução. Um PMAC com desempenho satisfatório significa
  que seu pessoal está seguindo o proposto nos manuais do operador, enquanto um PMAC eficaz
  significa que os resultados desejados estão sendo alcançados de acordo com os objetivos
  e padrões que o operador aéreo estabeleceu, e que os objetivos do PMAC estão sendo de fato
  cumpridos.

  7.2 Elementos do PMAC

  7.2.1 Os elementos serão explicados individualmente ao longo desta seção da IS. Entretanto,
  se existirem outras IS que forneçam informações mais detalhadas sobre um ou mais elementos
  do programa, esse elemento não será explicado em profundidade. O PMAC inclui os 10 elementos
