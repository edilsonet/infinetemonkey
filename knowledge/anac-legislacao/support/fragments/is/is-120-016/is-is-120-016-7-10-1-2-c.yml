title: 7.10.1.2(c)
text: 'c) Um item de inspeção obrigatória em uma aeronave.

  Nota: manutenção essencial abrange a manutenção associada aos Itens de Inspeção Obrigatória
  (IIO) on-wing, quando executada por outra pessoa. O conceito de manutenção essencial também
  inclui as inspeções obrigatórias em si, desde que também realizadas on-wing. Manutenção
  on-wing nesta definição abrange a aeronave como um todo, e não apenas a manutenção realizada
  em motores instalados na aeronave. Ainda, manutenção essencial não engloba qualquer manutenção
  ou inspeção IIO realizada off-wing.

  Além disso, trabalho contratado inclui a manutenção não programada tanto na alínea “a) manutenção
  essencial” quanto na alínea “c) IIO”.

  Deve-se notar que todos os requisitos que demandem que as empresas aéreas desenvolvam políticas,
  procedimentos, métodos e instruções para utilização de manutenção contratada incluem manutenção
  programada e não programada.

  7.10.1.3 Diretamente Encarregado. Significa ter responsabilidade pelo trabalho executado
  por um provedor de manutenção. Um representante do detentor de certificado diretamente responsável
  pelo trabalho contratado não precisa necessariamente observar fisicamente e dirigir cada
  provedor de manutenção constantemente, mas deve estar disponível para consulta sobre assuntos
  que exijam instrução ou decisão.

  Nota: o termo “consulta” pode ser interpretado de forma ampla. Isto permite à empresa aérea
  flexibilidade para utilizar inúmeros métodos de tecnologia da informação - tais como fotografias
  de alta resolução, mensagens de texto e Internet - para adquirir as informações necessárias
  para tomar decisões e fornecer instruções.

  7.10.1.4 Exigências para manutenção contratada. Com relação à manutenção contratada, e consistente
  com os parágrafos 121.379(a) do RBAC nº 121 e 135.437(a) do RBAC nº 135, espera-se que:'
