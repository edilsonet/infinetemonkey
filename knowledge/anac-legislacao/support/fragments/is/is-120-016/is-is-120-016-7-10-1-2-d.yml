title: 7.10.1.2(d)
text: d) Cada detentor de certificado que contratar manutenção, manutenção preventiva ou alterações
  desenvolva e implemente políticas, procedimentos, métodos e instruções para a realização
  de todos esses serviços. Essas políticas, procedimentos, métodos e instruções devem prever
  que a manutenção, manutenção preventiva e alterações sejam realizadas de acordo com o manual
  de manutenção do detentor de certificado;
