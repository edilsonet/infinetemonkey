title: 7.10.1.2(e)
text: e) Cada detentor de certificado que contratar manutenção, manutenção preventiva ou alterações
  assegure que seu sistema de análise e supervisão continuada (SASC) contenha procedimentos
  para supervisão de todos os trabalhos contratados de manutenção, manutenção preventiva e
  alterações realizadas pelo provedor de manutenção, conforme requerido pelos parágrafos 121.373(a)
  do RBAC nº 121 e 135.431(a) do RBAC nº 135;
