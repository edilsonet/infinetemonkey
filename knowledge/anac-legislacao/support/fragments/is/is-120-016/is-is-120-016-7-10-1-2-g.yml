section_title: 'Trabalho contratado. Pode ser definido como sendo:'
subsection_id: g
cite: 7.10.1.2(g)
title: 7.10.1.2(g)
text: 'g) Cada detentor de certificado que contrate manutenção, manutenção preventiva ou alterações
  forneça à ANAC uma lista de provedores de manutenção em um formato aceitável. Esta lista
  deve incluir o nome e endereço físico, ou endereços, onde cada provedor de manutenção realiza
  trabalhos para o detentor do certificado, e uma descrição do tipo de manutenção, manutenção
  preventiva ou alteração que deve ser realizada em cada local. A lista deve ser atualizada
  com quaisquer alterações, incluindo adições ou exclusões, e enviada à ANAC até o último
  dia de cada mês.

  7.10.2 Responsabilidade pela manutenção realizada por terceiros. Consistente com o parágrafo
  121.1(a)(2) do RBAC nº 121 e parágrafo 135.1(a)(2) do RBAC nº 135, quando a empresa usa
  um provedor de manutenção para realizar todas ou parte das atividades de manutenção em sua
  aeronave ou componentes, esse provedor torna-se parte da estrutura de manutenção da empresa
  aérea, sob sua supervisão. Além disso, as seções 121.363 do RBAC nº 121 e 135.413 do RBAC
  nº 135 deixam claro que a empresa continua sendo a principal responsável por toda a manutenção
  realizada por esse provedor de manutenção em sua aeronave. O operador deve determinar que
  o provedor de manutenção tem a capacidade de realizar o trabalho em nome dele, de dirigir
  adequadamente seus trabalhos e de determinar que o trabalho foi executado de forma satisfatória
  e de acordo com o sistema de manuais e padrões do detentor de certificado. Todo o trabalho
  executado em cada aeronave da empresa deve ser realizado de acordo com o sistema de manuais
  do operador. Deve ser fornecido ao provedor de manutenção as partes apropriadas do manual
  de manutenção para a execução dos trabalhos. O operador deve se assegurar que o provedor
  de manutenção siga os procedimentos, realizando auditorias em trabalhos em andamento. O
  sistema de manuais do detentor de certificado deve conter procedimentos relativos aos trabalhos
  realizados por provedores de manutenção. A seção de política e procedimentos do manual geral
  de manutenção deve definir claramente as autoridades, responsabilidades e procedimentos
  para que o pessoal do detentor de certificado administre, controle e dirija o serviço contratado
  de manutenção. O material que a empresa fornece ao provedor de manutenção deve conter as
  instruções necessárias para uso e orientação do provedor de manutenção, e deve ser fornecido
  pela empresa aérea ao provedor de manutenção antes do início do serviço.

  7.10.3 Manutenção Contratada Não-Programada Realizada Fora de Sede. Por vezes, a empresa
  precisará executar serviços de manutenção em aeronave enquanto ela estiver fora das suas
  instalações regulares de manutenção. A empresa também pode precisar de serviços de manutenção
  por motivo fortuito (ex: condições meteorológicas). O sistema de manuais da empresa deve
  incluir procedimentos para a obtenção desses serviços sob essas condições fortuitas. A empresa
  nunca deve usar o termo "manutenção de emergência" para descrever manutenção fortuita, ou
  não-programada, pois tais termos podem passar a ideia a seus funcionários e seus provedores
  de manutenção que os regulamentos e/ou procedimentos não precisam ser seguidos. "Emergência"
  significa que uma situação grave ocorreu inesperadamente, envolve um perigo à vida ou à
  propriedade, e exige ação imediata. Uma aeronave fora de serviço estacionada no pátio de
  um aeroporto dificilmente poderia constituir um perigo à vida ou à propriedade. A empresa
  deve descrever os procedimentos usados para controlar e dirigir a manutenção não-programada
  que será realizada pelo provedor de manutenção. Requisitos de manutenção não-programada
  ou fortuitas não tiram da empresa a responsabilidade de garantir que o provedor de manutenção
  tenha a organização, instalações e equipamentos adequados, pessoal competente, assim como
  as partes apropriadas do sistema de manuais do detentor de certificado relativos ao trabalho
  a ser realizado. Tudo deve ser verificado antes que qualquer membro do pessoal do provedor
  de manutenção comece a trabalhar na aeronave. Esses procedimentos e métodos de verificação
  devem constar do sistema de manuais da empresa.

  7.10.4 Documento de Liberação da Aeronave para Voo ou Inserção de Registro no Livro de Manutenção
  da Aeronave Exigida pelas Seções 121.709 do RBAC nº 121 e 135.443 do RBAC nº 135. Para fins
  de manutenção contratada, é importante observar que os parágrafos 121.709(b)(3) do RBAC
  nº 121 e 135.443(b)(3) do RBAC nº 135 estabelecem requisitos específicos para as pessoas
  autorizadas a assinar uma liberação da aeronave para voo ou registro no livro de manutenção
  da aeronave. Como definido no RBAC nº 01, Seção 01.1, pessoa significa um indivíduo, firma,
  sociedade, corporação, companhia, associação, sociedade anônima ou entidade governamental.
  Assim, uma organização de manutenção ou operadores aéreos congêneres, como uma empresa,
  também se qualificam como uma pessoa definida na seção 01.1 do RBAC nº 01 e podem preparar
  ou fazer preparar uma liberação da aeronave para voo ou uma entrada apropriada no livro
  de manutenção de aeronave. Normalmente, o registro gerado pela contratada é limitado ao
  trabalho que a organização de manutenção aeronáutica ou operador aéreo contratado são certificados
  para executar, e realmente executou. Entretanto, é possível ao contratado realizar a liberação
  de aeronavegabilidade, e para isso deve, cumprir com os procedimentos estabelecidos no manual
  do detentor de certificado. Como não há referência a "pessoa" nos parágrafos 121.709(b)
  do RBAC nº 121 ou 135.443(b) do RBAC nº 135, o "detentor de certificado" não se refere ao
  provedor de manutenção, mas sim ao detentor de certificado que opera sob o RBAC nº 121 ou
  135 para quem o provedor está realizando manutenção. Tal entendimento corresponde ao dever
  do detentor de certificado sob os RBAC nº 121 e 135, conforme as seções 121.367 e 135.425,
  de garantir que não somente pessoal competente esteja executando a manutenção em suas frotas,
  mas que cada aeronave liberada para serviço esteja em condição aeronavegável.

  7.10.4.1 Registro no Livro de Manutenção de Aeronave ou Preenchimento do Documento de Liberação
  da Aeronave para Voo. A empresa deve designar cada indivíduo autorizado a executar registro
  no livro de manutenção da aeronave ou a emitir o documento de liberação da aeronave para
  voo, por nome e título ocupacional. O indivíduo que faz o registro no livro de manutenção
  de aeronave ou no Documento de Liberação da Aeronave para Voo atua como agente autorizado
  do operador. Ele certifica que a manutenção foi realizada de acordo com o sistema de manuais
  do operador, e que não existe nenhuma condição conhecida que tornaria a aeronave não-aeronavegável.
  Isso não diminui a responsabilidade do pessoal de manutenção de realizar as funções ou tarefas
  de manutenção de acordo com o sistema de manuais da empresa.

  7.10.4.2 Procedimentos de Registros no Livro de Manutenção da Aeronave ou do Documento de
  Liberação da Aeronave para Voo. De acordo com os requisitos contidos nos parágrafos 121.709(b)(1)
  do RBAC nº 121 e 135.443(b)(1) do RBAC nº 135, a empresa deve incluir em seu sistema de
  manuais os procedimentos para fazer registros no livro de manutenção da aeronave ou de preenchimento
  do documento de liberação da aeronave para voo. Os regulamentos exigem que a empresa faça
  registros no livro de manutenção da aeronave ou o preenchimento do documento de liberação
  da aeronave para voo antes de operar a aeronave, após ter realizado qualquer manutenção.
  A empresa deve fazer os registros no livro de manutenção da aeronave ou preencher o documento
  de liberação da aeronave para voo. Além da forma ou do formato, não há diferença legal ou
  técnica entre um documento de liberação da aeronave para voo ou um registro no livro de
  manutenção da aeronave.

  7.10.5 Avaliação de Novos Provedores de Manutenção. Antes de poder usar um provedor de manutenção
  pela primeira vez, a empresa deve verificar se o candidato a provedor de manutenção cumpre
  com os requisitos pertinentes do RBAC nº 121, Subparte L ou do RBAC nº 135, Subparte J.
  Na maioria dos casos, é necessário que a empresa realize uma auditoria no local. A empresa
  deve demonstrar, através dessa auditoria ou por algum outro meio, que o provedor de manutenção
  possui uma organização adequada, instalações e equipamentos adequados, pessoal competente
  e é capaz de realizar o trabalho de acordo com as exigências do Programa de Manutenção do
  detentor de certificado. Entretanto, um processo de avaliação de risco pode ser usado para
  determinar se deve ou não realizar uma auditoria in loco. Essa avaliação deve levar em conta
  o que acontece (o efeito da falha) em eventual caso de falha do componente ou sistema da
  aeronave em que o provedor de manutenção trabalhe. Se o efeito da falha influenciar a segurança,
  os procedimentos podem exigir a realização de auditoria inicial no provedor, auditorias
  recorrentes no local, bem como a alocação de um funcionário presente nas instalações do
  provedor de manutenção, a quem sejam atribuídas funções de auditoria e supervisão.

  Nota: uma vez que o efeito da falha de partes ou sistemas que estão sob manutenção essencial
  diz respeito a segurança operacional, a empresa aérea deve ter políticas e procedimentos
  robustos para qualificar, supervisionar e controlar esses provedores de manutenção, o que
  deve incluir auditorias in loco.

  7.10.6 Supervisão Continuada do Provedor de Manutenção. Garantir que cada um dos provedores
  de manutenção da empresa esteja em conformidade continuamente é uma das principais funções
  do SASC. A empresa deve usar um processo baseado em risco para estabelecer um cronograma
  de auditorias e inspeções em cada um dos seus provedores de manutenção. Inerente a um processo
  baseado em risco, a empresa pode determinar que alguns de seus provedores de manutenção
  não necessitam de uma auditoria presencial. Consistente com o termo "execução" presente
  nas seções 121.373 do RBAC nº 121 ou 135.431 do RBAC nº 135, as auditorias que a empresa
  realiza devem ser principalmente auditorias nos trabalhos em andamento para verificar que
  os provedores de manutenção estejam seguindo o sistema de manuais do operador em suas partes
  aplicáveis. Recomenda-se que as auditorias sejam realizadas por auditores treinados, e os
  resultados avaliados por analistas treinados. Os resultados da avaliação devem permitir
  que a empresa determine a conformidade contínua de cada provedor de manutenção ao RBAC nº
  121, Subparte L ou RBAC nº 135, Subparte J, conforme apropriado, e ao Programa de Manutenção
  da empresa.'
