title: Usando uma Organização de Manutenção (OM) como um dos Provedores de Manutenção.
text: '7.10.7 Usando uma Organização de Manutenção (OM) como um dos Provedores de Manutenção.

  7.10.7.1 Contratos para Manutenção. Se o operador decidir exercer sua autoridade prevista
  nas seções 121.379 do RBAC nº 121 e 135.437 do RBAC nº 135 para fazer contratos com outras
  pessoas para realizar a manutenção para as aeronaves da sua frota, conforme previsto em
  seu sistema de manuais, recomenda-se fortemente a utilização de operador congênere ou OM
  certificados pela ANAC ou pela Autoridade local, no caso de prestador localizado no exterior.
  Entretanto, a empresa pode ter contratos para manutenção com qualquer pessoa, conforme definição
  da seção 01.1 do RBAC nº 01, desde que esse provedor de manutenção realize a manutenção
  de acordo com o sistema de manuais do detentor de certificado. Deve-se atentar que o operador
  sempre mantém responsabilidade por todo o serviço realizado por terceiro; assim caso utilize
  em algum momento prestador de serviço não certificado, deve ter meios eficazes adicionais
  àqueles requeridos ao contratar prestador de serviço certificado, para verificar se o trabalho
  realizado está de acordo com o previsto em seu sistema de manuais.

  7.10.7.2 Provedor de Manutenção RBAC nº 145. Os requisitos da regulamentação e do Programa
  de Manutenção da empresa aérea que são usados para qualificar um provedor de manutenção
  que possui um certificado de Organização de Manutenção são exatamente os mesmos que a empresa
  usaria para um provedor de manutenção que não possui um certificado. Não há diferença. Consistente
  com os parágrafos 119.1(e) do RBAC nº 119, 121.1(a)(2) do RBAC nº 121, ou 135.1(a)(2) do
  RBAC nº 135, cada pessoa, certificada ou não, que é empregada ou contratada pela empresa
  para executar qualquer manutenção, manutenção preventiva ou alteração de aeronave deve cumprir
  com os requisitos do RBAC nº 121 ou RBAC nº 135 e os requisitos do Programa de Manutenção
  do detentor de certificado. Além disso, a autorização prevista nos parágrafos 121.379(b)
  do RBAC nº 121 ou 135.437(b) do RBAC nº 135 para aprovar a aeronave para retornar ao serviço
  após a manutenção estende-se ao trabalho realizado por pessoas contratadas, como previsto
  nos parágrafos 121.379(a) do RBAC nº 121 e 135.437(a) do RBAC nº 135.'
