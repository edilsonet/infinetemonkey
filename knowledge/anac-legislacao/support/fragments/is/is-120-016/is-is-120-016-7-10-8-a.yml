subsection_id: a
cite: 7.10.8(a)
title: 7.10.8(a)
text: a) Organização Adequada. A fim de garantir o cumprimento com as seções 121.365 do RBAC
  nº 121 e 135.423 do RBAC nº 135, o contrato deve prever que o provedor de manutenção tenha
  uma organização adequada ao trabalho a ser executado. No caso de o provedor de manutenção
  executar inspeção em um IIO, o contrato deve prever que a função de inspeção esteja separada
  das demais funções dentro da organização contratada. Se o manual de manutenção do operador
  aéreo possui procedimentos específicos, o contrato deve prover ao operador meios de garantir
  que o provedor de manutenção é capaz de cumprir com esses procedimentos, como por exemplo,
  através de um programa de auditoria ou obrigações contratuais.
