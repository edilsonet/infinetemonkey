subsection_id: b
cite: 7.10.8(b)
title: 7.10.8(b)
text: b) Programa de Manutenção. A fim de garantir o cumprimento com as com as seções 121.367
  do RBAC nº 121 e 135.425 do RBAC nº 135, o contrato entre as partes deve prever que o provedor
  de manutenção irá executar o trabalho contratado de acordo com o Programa de Manutenção
  do operador. Isto significa que as informações necessárias para garantir o cumprimento do
  PMAC, tal como o manual de manutenção, devem estar disponíveis para o provedor de manutenção
  antes do início dos trabalhos. Além disso, o contrato deve prover ao operador meios de verificar
  se o contratado tem pessoal competente, equipamento adequado, e instalações conforme requerido
  por seu manual de manutenção. Através de auditorias, o operador aéreo pode se certificar
  que o provedor de manutenção dispõe da estrutura necessária (ver as seções 121.363 e 121.367
  do RBAC nº 121, e 135.413, 135.423 e 135.425 do RBAC nº 135).
