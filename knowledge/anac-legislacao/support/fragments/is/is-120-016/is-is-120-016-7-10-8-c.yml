cite: 7.10.8(c)
title: 7.10.8(c)
text: c) Requisitos do manual. As seções 121.369 do RBAC nº 121 e 135.427 do RBAC nº 135 declaram
  que o detentor de certificado deve possuir um manual cobrindo procedimentos para cumprimento
  do seu PMAC. Esses requisitos devem ser de conhecimento do contratado, sendo o operador
  aéreo responsável por garantir que a devida informação chegue até ele. O contrato deve prever
  que é dever do operador fornecer os devidos dados ao contratado.
