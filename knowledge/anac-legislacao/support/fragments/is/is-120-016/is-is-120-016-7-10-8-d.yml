subsection_id: d
cite: 7.10.8(d)
title: 7.10.8(d)
text: 'd) Propriedade dos Dados. Um manual de manutenção pode conter informações (confidenciais
  ou não) que o operador aéreo não queira compartilhar com um provedor de manutenção por diversas
  razões. Por exemplo, se o provedor de manutenção também trabalhar em aeronaves de um concorrente
  do operador, pode ser que o operador não se sinta confortável em compartilhar informações.
  A melhor solução para que o operador compartilhe seus dados com segurança é que o contrato
  preveja o adequado manuseio de dados do operador pelo provedor de manutenção.

  Nota: as informações confidenciais ou de propriedade indicadas neste parágrafo referem-se
  somente àquela informação desenvolvida pelo operador para a sua manutenção própria. Informações
  confidenciais ou de propriedade não se referem a outros dados aos quais o provedor de manutenção
  necessita acesso, tais como instruções para aeronavegabilidade continuada (ICA) de acordo
  com o parágrafo 21.50(b) do RBAC nº 21, por exemplo.'
