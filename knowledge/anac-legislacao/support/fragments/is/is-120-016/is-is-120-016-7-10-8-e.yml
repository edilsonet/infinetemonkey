cite: 7.10.8(e)
title: 7.10.8(e)
text: 'e) IIO. No caso de executar IIO, a fim de garantir o cumprimento com as seções 121.371
  do RBAC nº 121 e 135.429 do RBAC nº 135, o contrato deve prever que o operador é responsável
  por treinar, qualificar, e autorizar o pessoal do provedor a executar IIO em seu nome. O
  pessoal de inspeção do provedor divide-se em duas categorias: (1) inspetores exclusivos
  ou (2) inspetores que também atuam na execução da manutenção. Em ambos os casos, o operador
  deve treinar os inspetores do provedor de manutenção para realizar as inspeções obrigatórias,
  e a inspeção obrigatória deve estar separada da manutenção. Se o manual de manutenção do
  operador requer aspectos específicos, o contrato deve prover ao operador meios de garantir
  que o provedor de manutenção cumpre os procedimentos estabelecidos, como por exemplo, através
  de programas de auditorias ou obrigações contratuais. O contrato deve prever ainda que uma
  listagem do pessoal do provedor de manutenção treinado no programa IIO do operador e formalmente
  designado pelo operador, deve ser mantida pelo provedor de manutenção para consulta sempre
  que necessário.'
