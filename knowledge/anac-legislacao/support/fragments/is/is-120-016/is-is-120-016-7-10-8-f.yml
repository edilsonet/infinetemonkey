cite: 7.10.8(f)
title: 7.10.8(f)
text: 'f) Sistema de Análise e Supervisão Continuada. A fim de garantir o cumprimento com
  as seções 121.373 do RBAC nº 121 e 135.431 do RBAC nº 135, o contrato deve prever que o
  SASC do operador é o responsável por verificar a execução dos trabalhos do contratado, de
  modo a garantir o desempenho e eficácia do PMAC do operador. O SASC de um operador aéreo
  deve conter os procedimentos para a supervisão de todos os provedores de manutenção.

  I- O contrato deve permitir que ações corretivas sejam tomadas, caso sejam encontradas quaisquer
  deficiências ou inadequações no Programa de Manutenção, referente aos itens contratualmente
  requeridos do provedor de manutenção.

  II- Além dos reportes de auditorias no provedor de manutenção, o operador deve ter um processo
  para que o seu representante designado documente apontamentos (findings) e ações corretivas
  tomadas com relação ao provedor de manutenção. Esses apontamentos (findings) devem ser inclusos
  no sistema de análise e supervisão continuada (SASC) do operador aéreo, e são essenciais
  para identificar deficiências ou inadequações no seu Programa de Manutenção.'
