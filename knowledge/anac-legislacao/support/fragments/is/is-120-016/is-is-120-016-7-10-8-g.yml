section_title: Desenvolvendo um Acordo Contratual entre um Operador Aéreo e um Provedor de
  Manutenção.
subsection_id: g
cite: 7.10.8(g)
title: 7.10.8(g)
text: g) Autoridade Regulatória. A seção 119.59 do RBAC nº 119 permite à ANAC ter acesso aos
  registros de manutenção e instalações dos provedores de manutenção. O contrato deve garantir
  à ANAC o nível de acesso previsto na seção 119.59 do RBAC nº 119 às instalações e documentos
  de qualquer pessoa prestando serviços de manutenção para um operador aéreo, não importando
  se aquele serviço é fornecido sob contratação ou subcontratado, por empresa certificada
  ou não pela ANAC.
