cite: 7.10.8(h)
title: 7.10.8(h)
text: 'h) Programas de Treinamento. A fim de garantir o cumprimento com as seções 121.375
  do RBAC nº 121 e 135.433 do RBAC nº 135, o contrato deve garantir que o pessoal do provedor
  de manutenção certificado ou não, esteja:

  I- Adequadamente treinado e qualificado para manter a aeronave do operador de acordo com
  o programa de treinamentos do operador. É importante notar que os critérios de treinamento
  aplicáveis ao provedor de manutenção devem ser os mesmos aplicados ao pessoal do operador.

  II- Adequadamente habilitado, treinado, e autorizado para executar inspeções de IIO de acordo
  com o manual de manutenção do operador (ver as seções 121.371 do RBAC nº 121 e 135.429 do
  RBAC nº 135). O programa IIO deve ser gerenciado sem divisões. Não pode haver diferença
  entre o modo como o pessoal do operador é treinado e realiza a inspeção IIO e o modo como
  a pessoa contratada executa a mesma tarefa. O treinamento para o pessoal do operador e o
  treinamento para as pessoas contratadas devem ser baseados na mesma ementa de treinamento,
  que deve também abordar os adequados procedimentos para preparar, assinar, e manusear os
  registros de manutenção de acordo com os procedimentos do operador.'
