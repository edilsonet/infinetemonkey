cite: 7.10.8(j)
title: 7.10.8(j)
text: j) Requisitos de Qualificação. As seções 121.378 e 121.709 do RBAC nº 121 e 135.435
  e 135.443 do RBAC nº 135 declaram que o operador deve garantir que somente pessoas habilitadas
  podem ser diretamente responsáveis pela manutenção, por executar inspeções obrigatórias,
  ou pela liberação de aeronavegabilidade. O contrato deve cobrir estes requisitos em uma
  declaração breve para garantir que não haja entendimentos equivocados entre as partes.
