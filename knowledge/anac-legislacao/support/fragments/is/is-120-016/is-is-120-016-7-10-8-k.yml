section_id: 7.10.8
section_title: Desenvolvendo um Acordo Contratual entre um Operador Aéreo e um Provedor de
  Manutenção.
subsection_id: k
cite: 7.10.8(k)
title: 7.10.8(k)
text: k) Autoridade para executar. As seções 121.379 do RBAC nº 121 e 135.437 do RBAC nº 135
  permitem que o operador contrate alguém para executar manutenção em seu lugar. O centro
  da relação entre o operador aéreo e o provedor de serviço são os procedimentos contidos
  no manual do operador. O operador deve verificar continuamente que o provedor de manutenção
  é capaz de cumprir com os procedimentos de seu PMAC, seja através de supervisão, auditoria
  ou obrigações contratuais. O contrato deve claramente estabelecer as obrigações de cada
  parte de acordo com os regulamentos, e o modo como isso será verificado. As seções do contrato
  associadas ao cumprimento de requisitos regulatórios devem permitir ao operador verificar
  que o trabalho é executado e registrado conforme indicado em seu manual de manutenção.
