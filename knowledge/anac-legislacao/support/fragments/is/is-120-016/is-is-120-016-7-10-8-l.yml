section_id: 7.10.8
section_title: Desenvolvendo um Acordo Contratual entre um Operador Aéreo e um Provedor de
  Manutenção.
subsection_id: l
cite: 7.10.8(l)
title: 7.10.8(l)
text: l) Registros. A fim de garantir o cumprimento com as seções 43.9 do RBAC nº 43, 121.380
  do RBAC nº 121 e 135.439 do RBAC nº 135, o contrato deve cobrir qualquer especificidade
  relativa a registros, a fim de garantir que os registros requeridos são gerados conforme
  manual de manutenção do operador e tornados disponíveis para a ANAC. Se o manual de manutenção
  do operador indicar que a responsabilidade por tornar os registros de manutenção disponíveis
  é delegada ao provedor de manutenção, o contrato deve estabelecer quais registros devem
  ser mantidos, o tempo que os registros devem ser mantidos, assim como a forma de manter
  tais registros.
