cite: 7.10.8(m)
title: 7.10.8(m)
text: 'm) Considerações Adicionais. Se o manual de manutenção do operador aéreo deixa claro
  que os requisitos regulatórios são garantidos através de relações de negócios com o provedor
  de manutenção, o contrato deve refletir essa obrigação, e pode ser usado para verificar
  o cumprimento de requisitos.

  Nota: o escopo do trabalho ditará a profundidade da supervisão, troca de informações, e
  auditoria necessária para garantir o cumprimento pelo provedor de manutenção com o PMAC
  do operador. Quanto mais extensivo o trabalho, maior treinamento, informações, e supervisão
  serão necessários pelo operador.'
