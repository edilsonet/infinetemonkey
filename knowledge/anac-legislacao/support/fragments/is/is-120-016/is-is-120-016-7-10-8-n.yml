subsection_id: n
cite: 7.10.8(n)
title: 7.10.8(n)
text: n) Troca de informação. A necessidade de troca de informação será ditada pelos requisitos
  técnicos do trabalho a ser executado. O operador aéreo deve garantir que informações advindas
  do provedor de manutenção sejam obtidas quando necessário para o programa de confiabilidade
  do operador. Isto deve ser estipulado no contrato. Se a informação necessária deve ser coberta
  no contrato dependerá dos manuais e dos procedimentos do operador. Se o manual ou procedimento
  requer que tal informação seja especificada em contrato, o operador aéreo deve incorporá-las.
  Por exemplo, uma vez que o provedor de serviço é requerido a fornecer pessoal competente
  e instalações adequadas, pode ser incluída no contrato cláusula para notificar o operador
  aéreo das alterações no pessoal do provedor de serviço, instalações e propriedade.
