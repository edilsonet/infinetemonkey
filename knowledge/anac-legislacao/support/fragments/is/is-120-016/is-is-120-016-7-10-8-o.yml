title: 7.10.8(o)
text: o) Rastreabilidade de componentes e partes. Pode incluir critérios de rastreabilidade
  para uso de partes novas, até obrigação de retornar partes danificadas ao operador. Pode
  incluir considerações sobre exchanged parts, com critérios de estar na mesma configuração,
  incluindo o cumprimento com Boletim de Serviço (SB) e Diretrizes de Aeronavegabilidade (DA).
