id: is-is-120-016-7-10-9-a
kind: is
document: is-120-016
family: '120'
section_id: 7.10.9
section_title: Considerações Especiais no Desenvolvimento de um Acordo Contratual entre o
  Operador Aéreo e o Provedor de Manutenção.
subsection_id: a
cite: 7.10.9(a)
title: 7.10.9(a)
text: a) Se esta foi planejada antes de o provedor de manutenção iniciar os trabalhos, ela
  deve ser abordada no contrato. Caso contrário, o operador aéreo deve ter procedimentos no
  manual dele para abordar a possibilidade de subcontratação. Se o provedor de manutenção
  for uma Organização de Manutenção certificada pela ANAC, ele deve ter procedimentos específicos
  em seu Manual de Organização de Manutenção (MOM) para prestar serviços a operadores aéreos.
  Deve ter também procedimentos para enviar e receber itens de subcontratados, com critérios
  distintos para subcontratados certificados e não certificados. Esses procedimentos devem
  ser bem detalhados, por exemplo em “o que”, “onde”, “quando”, “como” e “quem”. Eles devem
  descrever como a OM receberá o item do subcontratado, verificará a manutenção realizada,
  gerará os registros necessários, e encaminhará ao operador. O provedor de manutenção deverá
  assegurar que o trabalho executado pela subcontratada está de acordo com o estabelecido
  pelo operador aéreo, especificações do fabricante e, se aplicável, dados aprovados ou aceitos
  pela ANAC.
