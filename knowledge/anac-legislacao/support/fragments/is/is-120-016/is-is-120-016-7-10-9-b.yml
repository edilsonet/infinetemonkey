text: 'b) Políticas quanto ao uso indevido de substâncias psicoativas são requeridas pelo
  RBAC nº 120. É possível incluir uma visão geral deste programa no contrato, pois, caso o
  provedor de manutenção não tenha um programa PPSP, tanto ele como os subcontratados devem
  atender o PPSP do operador aéreo.

  7.11 Treinamento de Pessoal

  7.11.1 Requisitos do Programa de Treinamento de Manutenção. Requisitos específicos de treinamento
  de pessoal de manutenção de empresas aéreas são encontrados em certas seções da Subparte
  L do RBAC nº 121 e da Subparte J do RBAC nº 135. O RBAC nº 121, seção 121.375 e o RBAC nº
  135, seção 135.433 exigem que a empresa tenha um programa de treinamento que garanta que
  cada pessoa (incluindo o pessoal de inspeção) que determina a adequação do trabalho realizado
  pela empresa esteja totalmente informada sobre procedimentos, técnicas e novos equipamentos
  em uso, e seja competente para desempenhar suas funções. Há um requisito de treinamento
  adicional implícito na Subparte L do RBAC nº 121 e na Subparte J do RBAC nº 135 referente
  a responsabilidade da empresa em fornecer pessoal competente para o desempenho adequado
  de seu Programa de Manutenção. Um programa de treinamento é o meio lógico para assegurar
  que o pessoal de manutenção seja competente. Os regulamentos da ANAC permitem que a empresa
  desenvolva um programa de treinamento que atenda às suas necessidades particulares. A IS
  nº 119-010 deve ser atualizada para o desenvolvimento do Programa de Treinamento de Manutenção
  e Manutenção Preventiva de Operador de Serviço de Transporte Aéreo.

  7.11.2 Tipos de Treinamento. Alguns dos possíveis tipos de treinamento do programa de treinamento
  são treinamento inicial, treinamento recorrente, treinamento especializado, treinamento
  baseado em competência, treinamento de provedor de manutenção e treinamento corretivo. Recomenda-se
  que a empresa selecione o treinamento apropriado para o seu pessoal, incluindo o pessoal
  do provedor de manutenção, baseado em uma avaliação de competência para a realização do
  serviço. Trata-se de uma avaliação de necessidades de treinamentos que compara o conhecimento,
  as habilidades e as capacidades necessárias para realizar adequadamente uma determinada
  tarefa ou função, com a capacidade atual daqueles a quem a empresa pretende atribuir uma
  determinada tarefa ou função.

  7.11.3 Treinamento Inicial. A empresa deve fornecer treinamento inicial aos funcionários
  recém-contratados, ou aos seus funcionários existentes quando começarem a trabalhar em um
  novo equipamento ou em uma nova tarefa. O programa de treinamento inicial pode incluir assuntos
  como doutrinação ou orientação do colaborador, políticas e procedimentos do departamento
  de manutenção, registros e documentação de manutenção, sistemas de aeronaves ou equipamentos
  em terra, habilidades específicas (por exemplo, aviônicos, reparos em materiais compostos,
  run-up de aeronaves e táxi), melhoria nas habilidades, fatores humanos, treinamento específico
  para tarefas, artigos perigosos, Sistema de Gerenciamento da Segurança Operacional (SGSO)
  da empresa. O treinamento inicial também pode incluir uma avaliação baseada em competência
  dos funcionários, de modo a avaliar o treinamento e a experiência prévia de um funcionário
  e ajudar a identificar suas necessidades específicas de treinamento individual. O objetivo
  é fornecer um treinamento que cubra a lacuna (gap) entre a competência necessária e a competência
  que um indivíduo já possui.

  7.11.4 Treinamento Recorrente. O treinamento recorrente ocorre periodicamente, e tem por
  objetivo manter a competência contínua do pessoal do operador. A empresa deve fornecer ao
  seu pessoal as informações e habilidades necessárias para manter seu padrão de competência.
  Esse treinamento também abrange a introdução de novas aeronaves, modificações de aeronaves,
  equipamentos de solo novos ou diferentes, novos procedimentos, técnicas e métodos ou outras
  informações. O treinamento recorrente, embora ocorra de forma repetitiva, não necessita
  aderir a um cronograma definido. Em um treinamento recorrente, a empresa não necessita abordar
  informações já fornecidas anteriormente em outros treinamentos, a menos que seja necessário
  para manter o grau de competência desejado. O treinamento recorrente pode incluir:'
