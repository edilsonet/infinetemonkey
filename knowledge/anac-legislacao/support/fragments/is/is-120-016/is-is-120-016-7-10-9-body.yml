text: '7.10.9 Considerações Especiais no Desenvolvimento de um Acordo Contratual entre o Operador
  Aéreo e o Provedor de Manutenção.

  7.10.9.1 Desenvolver procedimentos e políticas contratuais. O contrato deve incluir um processo
  para aprovar o uso de subcontratados obtendo a aprovação do operador aéreo antes do uso
  dos subcontratados.

  7.10.9.2 Garantir cumprimento com as seções especificas dos RBAC. As cláusulas contratuais
  devem ser customizadas aos trabalhos específicos objeto do acordo. A responsabilidade pela
  aeronavegabilidade da empresa aérea não se encerra no provedor de manutenção contratado.
  Ela continua com os subcontratados do provedor de manutenção original. Os contratados e
  subcontratados devem estar sob os requisitos e supervisão do PMAC da empresa aérea.

  7.10.9.3 Subcontratação pelo provedor de manutenção. Durante o curso da contratação normal
  de manutenção, pode ser necessário que o provedor de manutenção utilize os serviços de um
  subcontratado:'
