cite: 7.10.9(d)
title: 7.10.9(d)
text: 'd) Qualquer outra instrução ou treinamento contínuo que não possa ser fornecido em
  um cronograma definido.

  7.11.5 Treinamento Especializado. Um treinamento especializado deve se concentrar na competência
  necessária a tarefas específicas ou áreas de responsabilidade, tais como Itens de Inspeção
  Obrigatória (IIO), boroscopia, ensaios não destrutivos ou instalação e ajustes de comandos
  de voo (Flight control rigging). A empresa pode fornecer esse treinamento em conjunto com
  o treinamento inicial ou recorrente. A empresa não precisa limitá-lo a assuntos de manutenção,
  podendo incluir, por exemplo, treinamentos sobre gerenciamento ou liderança para novos supervisores,
  treinamento de informática ou ainda outros treinamentos necessários devido a mudança nas
  obrigações e responsabilidades de um indivíduo.

  7.11.6 Treinamento de Provedores de Manutenção. O programa de treinamento da empresa deve
  fornecer informações apropriadas a cada funcionário de um provedor de manutenção sobre o
  Programa de Manutenção do operador. O programa deve incluir treinamento específico para
  as funções apropriadas para cada cargo ou área de responsabilidade. A empresa não precisa
  fornecer treinamento ao pessoal do provedor de manutenção em áreas que não estão relacionadas
  ao trabalho executado por ele. Por exemplo, treinamentos sobre registros de manutenção de
  aeronaves envolvendo lista de equipamentos mínimos (MEL) não seriam necessários para pessoal
  envolvido na limpeza de interiores de aeronaves, mas seriam necessários para o pessoal que
  realiza manutenção sob demanda (on call) para a empresa.

  Nota: se um provedor de manutenção tem treinamentos próprios para o seu pessoal, o operador
  não precisa aplicar novamente esses treinamentos para o pessoal do provedor de manutenção.
  Entretanto, a empresa deve assegurar-se de que o provedor de manutenção realmente forneceu
  o treinamento, e que o treinamento atende às necessidades e aos padrões de treinamento dela.
  Essa verificação pode ser feita dentro do processo contínuo de auditoria do provedor de
  manutenção no Sistema de Análise e Supervisão Continuada (SASC).

  7.11.7 Treinamento Baseado em Competência. Embora as empresas aéreas historicamente tenham
  fornecido um número específico de horas de treinamento para garantir que seus colaboradores
  tenham as competências necessárias para executar suas funções, estudos apontam que pode
  ser melhor para a empresa utilizar o padrão de treinamento baseado em competência. Esse
  tipo de treinamento não precisa ser aplicado em um horário definido ou por um número específico
  de horas. Nele, inicialmente a empresa avalia os indivíduos para verificar quais treinamentos
  são necessários. Utiliza essas avaliações para identificar o pessoal que detém um maior
  nível de competência e podem ser dispensados de participar de algumas etapas da instrução,
  ou ainda para identificar os indivíduos que necessitam de mais treinamento. O treinamento
  baseado em competência permite que a empresa adapte seu programa de treinamentos às necessidades
  de seu pessoal de manutenção e provedores de manutenção.

  7.11.7.1 Utilização do Treinamento Baseado em Competência. A empresa pode usar o treinamento
  baseado em competência para elevar o nível de competência de um funcionário até o nível
  exigido pelas suas obrigações e responsabilidades. A empresa deve ter procedimentos para
  determinar quando um indivíduo requer treinamento baseado em competência. A empresa pode
  determinar a necessidade desse tipo de treinamento através de avaliações pré ou pós-contratação,
  ou através das funções de análise e ação corretiva do seu SASC. Se a empresa usar treinamento
  baseado em competência, esse treinamento deve abordar especificamente a falta de competência
  encontrada. Em alguns casos, o treinamento baseado em competência pode consistir apenas
  em uma pessoa com conhecimento adequado revisando os procedimentos com um funcionário através
  de um On-the-Job Training (OJT). A empresa deve elaborar um treinamento baseado em competência
  para corrigir uma deficiência imediata de conhecimento ou habilidade, e o treinamento pode
  se concentrar em um indivíduo ou em um pequeno grupo. A empresa pode incluir treinamento
  baseado em competência em seus treinamentos iniciais ou recorrentes.

  7.11.7.2 Deficiências de Competência. Para aquelas circunstâncias em que a empresa identifica
  uma deficiência de competência através da investigação de um evento utilizando o SASC, seu
  treinamento baseado em competência deve mostrar ao indivíduo o que aconteceu, o porquê aconteceu
  e demonstrar, de forma positiva, como evitar que isso aconteça novamente.

  7.11.7.3 Treinamento para melhoria da competência. A empresa deve orientar o seu treinamento
  de melhoria de competência para corrigir as deficiências de competência de seu pessoal identificadas
  pelo SASC.

  7.11.8 Treinamento Corretivo. O programa de treinamento da empresa deve ter procedimentos
  para determinar os Requisitos de Treinamento individual, inclusive os casos de necessidade
  de treinamento corretivo. O operador aéreo deve utilizar os procedimentos de treinamento
  corretivo para retificar, o quanto antes, a falta de habilidade ou conhecimento demonstrada
  por um Funcionário Técnico.

  7.12 Sistema de Análise e Supervisão Continuada (SASC)

  7.12.1 Histórico do Sistema de Análise e Supervisão Continuada. A introdução do requisito
  do SASC resulta de um estudo sobre uma série de acidentes com aeronaves de empresas aéreas
  relacionados a manutenções ocorridas durante a década de 1950. O estudo descobriu que, em
  muitos casos, a principal causa de um acidente era uma deficiência no Programa de Manutenção
  da empresa aérea. O estudo descobriu que, em alguns casos, o pessoal de manutenção não realizou
  as tarefas de manutenção necessárias ou não as executou corretamente por, em ambas as situações,
  não seguir o sistema de manuais da empresa. Em outros casos, o estudo descobriu que o Programa
  de Manutenção, mesmo quando seguido como planejado e documentado, não foi eficaz na prevenção
  da situação que levou ao acidente. Nesse caso, o Programa de Manutenção da empresa não produziu
  os resultados desejados.

  7.12.1.1 Regulamentos. As seções 121.373 do RBAC nº 121 e 135.431 do RBAC nº 135 exigem
  que a empresa estabeleça e mantenha um SASC para avaliar o desempenho e a eficácia do Programa
  de Manutenção da empresa.

  7.12.1.2 Correção de Deficiências. Esses regulamentos exigem ainda que seja incluído um
  processo no SASC da empresa para corrigir qualquer deficiência identificada em seu Programa
  de Manutenção, independentemente de a empresa ter executado o trabalho ou de ele ter sido
  executado por um provedor de manutenção.

  7.12.2 SASC é uma ferramenta de gerenciamento da segurança operacional. O SASC é o sistema
  de gerenciamento da segurança operacional no que se refere às funções de manutenção. Como
  ferramenta para gerenciar a segurança, ele faz parte da estrutura geral de políticas e procedimentos
  que a empresa utiliza para garantir que suas operações tenham o mais alto grau de segurança
  possível. É um processo estruturado e metódico que ajuda a empresa a atingir os objetivos
  do Programa de Manutenção. O SASC, juntamente com o Sistema de Gerenciamento da Segurança
  Operacional (SGSO), são os sistemas de gerenciamento da segurança operacional atualmente
  mandatórios por regulamento. Se a empresa utilizá-lo corretamente, o SASC torna-se uma ótima
  ferramenta para garantir a segurança operacional, e ajudar a promover uma cultura de segurança
  na empresa, fornecendo um processo formal para que os funcionários identifiquem e corrijam
  deficiências. Como se verá na breve discussão a seguir sobre a estrutura de um SASC, os
  mesmos objetivos de medir e melhorar continuamente o desempenho (execução do programa) e
  a eficácia (resultados do programa) aplicam-se igualmente a todos os elementos do Programa
  de Manutenção, incluindo o elemento principal (execução de manutenção e aprovação para retorno
  ao serviço).'
