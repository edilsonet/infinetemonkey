section_title: Usando um Programa de Auditoria.
subsection_id: a
cite: 7.12.3.2(a)
title: 7.12.3.2(a)
text: 'a) Durante a primeira etapa, de vigilância, a empresa coletará e obterá dados usando
  um programa de auditoria para apoiar a medição do desempenho (execução do programa). O programa
  de auditoria deve ser bem estruturado, baseado na avaliação de risco, e realizado por indivíduos
  treinados e capacitados para realização de auditorias. O principal tipo de auditoria executada
  deve ser aquela para verificação de trabalhos em andamento (work-in-progress) para avaliar
  se o funcionário está seguindo o sistema de manuais da empresa. Outras áreas sujeitas a
  auditoria são: práticas reais de manutenção em andamento e operações em solo. Os auditores
  também avaliarão áreas tais como conteúdo dos sistemas de manuais, dados técnicos de manutenção,
  condições da aeronave, treinamento e controle de publicações.'
