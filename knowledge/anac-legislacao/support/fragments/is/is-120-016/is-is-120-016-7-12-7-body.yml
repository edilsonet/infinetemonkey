title: Requisitos de pessoal envolvido com o SASC
text: '7.12.7 Requisitos de pessoal envolvido com o SASC

  7.12.7.1 Habilidades efetivas para o SASC. Um SASC eficaz requer que o pessoal envolvido
  tenha certas habilidades que a empresa pode não ter prontamente disponíveis dentro de sua
  organização de manutenção. Por exemplo, as habilidades de auditoria não são automaticamente
  inerentes às habilidades para realizar manutenção. A capacidade de análise, particularmente
  relacionada à determinação da causa-raiz, análise de risco e a influência de fatores humanos,
  é especializada e geralmente requer treinamento e experiência específicos.

  7.12.7.2 Compartilhamento de pessoal. Para todos os operadores, mas particularmente para
  os menores, o pessoal requerido para o SASC pode ser compartilhado. A empresa pode escolher
  que seu pessoal desempenhe as funções SASC ou pode optar por contratar alguém de fora de
  sua organização para realizar algumas ou todas as funções do SASC. É essencial que a empresa
  reconheça que os conhecimentos e habilidades requeridos para desempenhar funções no SASC,
  não necessariamente coincidem com aqueles conhecimentos e habilidades resultantes de muitos
  anos de experiência em manutenção e reparos de aeronaves.

  Nota 1: a empresa pode encontrar informações mais detalhadas sobre o desenvolvimento e implementação
  de um SASC na AC 120-79 da FAA.

  Nota 2: a Advisory Circular AC 120-79 da FAA, intitulada "Developing and Implementing an
  Air Carrier Continuing Analysis and Surveillance System" configura método aceitável de cumprimento
  pela Anac.

  Uso de tolerâncias e solicitações de extensão de manutenção

  8.1 Aplicabilidade. Esta seção contém informações aplicáveis a todos os operadores sob o
  RBAC nº 121 e RBAC nº 135.

  8.2 Tolerâncias. O uso de tolerâncias estabelecidas pelo fabricante só é possível se houver
  procedimento aceito para tal definido no Manual Geral de Manutenção ou aprovado na Parte
  A da Programação de Manutenção, caso o operador possua uma. Este procedimento deve indicar,
