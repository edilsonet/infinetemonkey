title: 7.12.7(e)
text: 'e) Pessoas responsáveis pela avaliação e autorização para uso da tolerância, incluindo
  as qualificações necessárias;

  Nota 1: as tolerâncias indicadas pelo fabricante nos documentos referenciados na Parte B
  podem ser utilizadas pelo operador, sem necessidade de autorização específica da ANAC, desde
  que obedecido o procedimento para uso de tolerância indicado na Parte A, e que sejam respeitadas
  quaisquer restrições impostas pelo fabricante.

  Nota 2: o uso de tolerâncias deve ser encarado como excepcionalidade pelos operadores, e
  nunca como regra ou recursos regulares no planejamento da manutenção.

  8.3 Extensões de Manutenção. O uso de extensões de manutenção (short-term escalation), isto
  é, dilatações de prazos além das tolerâncias previstas pelo fabricante, deverão sempre ser
  precedidas de autorização por escrito da ANAC.'
