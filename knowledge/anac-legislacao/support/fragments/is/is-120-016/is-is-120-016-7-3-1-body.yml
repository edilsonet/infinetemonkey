title: Responsabilidade pela Manutenção da Aeronave.
text: '7.3.1 Responsabilidade pela Manutenção da Aeronave.

  7.3.1.1 Responsabilidade da Empresa Aérea Certificada pelo RBAC nº 119. Considerando as
  seções 121.363 do RBAC nº 121 e 135.413 do RBAC nº 135, o detentor de certificado emitido
  conforme RBAC nº 119 é o principal responsável pela aeronavegabilidade de sua aeronave,
  e pela execução de todos os serviços de manutenção ou alterações. O COA faz do detentor
  de certificado uma entidade de manutenção. Sob o certificado, é realizada, ou contratada,
  a própria manutenção, manutenção preventiva ou alterações. De acordo com os parágrafos 121.1(a)(2)
  e 135.1(a)(2), os RBAC nº 121 e 135 descrevem requisitos para as pessoas que a empresa aérea
  contrata ou emprega para qualquer serviço de manutenção, manutenção preventiva ou alteração
  de aeronave. Cada uma dessas pessoas deve estar sob direção e controle do detentor de certificado
  e deve seguir seu Programa de Manutenção.

  7.3.1.2 Responsabilidades pela manutenção. Para qualquer trabalho realizado na aeronave,
  o detentor de certificado retém a responsabilidade direta e primária pela execução e aprovação
  de todas as manutenções e alterações, quer a empresa realize esse trabalho ou outra pessoa
  o faça para ela, mesmo que essa pessoa seja uma Organização de Manutenção certificada pelo
  RBAC nº 145. O detentor do certificado sempre mantém a responsabilidade primária pela adequada
  execução e aprovação da manutenção feita por esse provedor de manutenção.

  7.3.1.3 Diferenças entre Programas. A tabela a seguir fornece uma comparação das diferenças
  entre os programas de manutenção de empresas aéreas e os programas de inspeção das aeronaves
  que operam na aviação geral (RBAC nº 91) e sob o parágrafo 135.411(a)(1) do RBAC nº 135.
  A Tabela intitulada "Resumo da aplicabilidade de inspeções requeridas no RBAC nº 91 Seção
  91.409" contidas na IS nº 91.403-001 complementa a compreensão das diferenças existentes.

  TABELA 1: RESUMO DE APLICABILIDADE.

  Elemento

  Empresas aéreas - RBAC nº 121 e 135 (135.411(a)(2))

  Empresas Aéreas -RBAC nº 135 (135. 411(a)(1))

  Proprietários / Operadores - RBAC nº 91

  Uso de um PMAC ou programa de inspeção ou programa recomendado pelo fabricante.

  Exigido o uso de um PMAC para manutenção de suas aeronaves.

  Exigido o uso de um programa de inspeção recomendado pelo fabricante (seção 91.409 do RBAC
  nº 91), acrescido do programa de manutenção recomendado pelo fabricante para motor, hélice
  e componentes (seção 135.421 do RBAC nº 135)

  Exigido o uso de um programa de inspeção recomendado pelo fabricante (seção 91.409 do RBAC
  nº 91).

  Responsabilidades dentro do respectivo programa.

  Responsável pela adequada execução da manutenção de acordo com seu programa e manual geral
  de manutenção, bem como pela aeronavegabilidade de suas aeronaves, incluindo estruturas
  de aeronaves, motores de aeronaves, hélices, equipamentos e suas partes.

  Responsável pela adequada execução da manutenção, de acordo com seu manual geral de manutenção
  e programa de inspeções recomendado /aprovado junto à Anac, quando executa a própria manutenção,
  bem como pela aeronavegabilidade de suas aeronaves, incluindo estruturas de aeronaves, motores
  de aeronaves, hélices, equipamentos e suas partes.

  Responsável por manter a aeronave em condições aeronavegáveis

  (seção 91.403(a) do RBAC nº 91).

  Responsável pelo desenvolvimento e uso do programa e do manual geral de manutenção; determinação
  do método de execução da manutenção; uma lista de inspeções obrigatórias; um Sistema de
  Análise e Supervisão Continuada (SASC); uma organização de manutenção que pode exercer controle
  operacional sobre as operações de manutenção; e outros itens que, coletiva e sistematicamente,
  servem para garantir que cada aeronave tenha sido devidamente mantida para operações de
  transporte aéreo e esteja aeronavegável.


  Responsável pela seleção de um programa de inspeção (recomendado pelo fabricante ou aprovado
  junto à Anac) e pela programação de aeronaves para as inspeções, e por garantir que as discrepâncias
  que ocorrem entre as inspeções programadas sejam reparadas. Responsável pela seleção de
  um programa de manutenção recomendado pelo fabricante dos motores, hélices e componentes,
  ou aprovação de um programa de manutenção específico junto à ANAC.

  Responsável pela seleção de um programa de inspeção (recomendado pelo fabricante ou aprovado
  junto à Anac) e pela programação de aeronaves para as inspeções, e por garantir que as discrepâncias
  que ocorrem entre as inspeções programadas sejam reparadas.

  Deve determinar qual manutenção é necessária, como fazê-la, quando fazê-la, realizar essa
  manutenção e aprovar sua própria aeronave para retornar ao serviço. Pode autorizar outra
  pessoa a realizar o trabalho de manutenção, mas a manutenção deve ser realizada de acordo
  com o programa e com o manual de manutenção da empresa aérea. A empresa aérea ainda mantém
  a responsabilidade pela conclusão adequada da manutenção (seção 121.363 do RBAC nº 121,
  ou seção 135.413 do RBAC nº 135).

  Se não autorizada a executar manutenção, deve disponibilizar a aeronave para pessoas autorizadas
  e certificadas que realizem inspeções e outras manutenções.

  Deve disponibilizar a aeronave para pessoas autorizadas e certificadas que realizem inspeções
  e outras manutenções.

  Junto com a supervisão da Anac, é a principal autoridade no que diz respeito a seu programa
  de manutenção. É a principal responsável pela execução da manutenção de acordo com o seu
  programa e o seu manual de manutenção, bem como pela aeronavegabilidade de suas aeronaves,
  incluindo as estruturas de aeronaves, motores de aeronaves, hélices, equipamentos e suas
  partes.

  A(s) pessoa(s) autorizada(s) e certificada(s) têm a responsabilidade de realizar a manutenção
  corretamente de acordo com o manual do fabricante e de aprovar a aeronave para retornar
  ao serviço. A empresa aérea não tem essa responsabilidade, a menos que seja autorizada a
  executar a própria manutenção. Entretanto, a empresa aérea é responsável por assegurar que
  o pessoal de manutenção faça as anotações apropriadas nos registros de manutenção da aeronave,
  indicando que ela recebeu aprovação para retornar ao serviço.

  A(s) pessoa(s) autorizada(s) e certificada(s) têm a responsabilidade de realizar a manutenção
  corretamente de acordo com o manual do fabricante e de aprovar a aeronave para retornar
  ao serviço. O proprietário/operador não tem essa responsabilidade. Entretanto, o proprietário/operador
  é responsável por assegurar que o pessoal de manutenção faça as anotações apropriadas nos
  registros de manutenção da aeronave, indicando que ela recebeu aprovação para retornar ao
  serviço.


