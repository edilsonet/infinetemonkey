title: Requisitos do Manual Geral de Manutenção (MGM)
text: '7.4.1 Requisitos do Manual Geral de Manutenção (MGM)

  7.4.1.1 Regulamentos. Os regulamentos (seções 121.133 e 121.369 do RBAC nº 121, e as seções
  135.21 e 135.427 do RBAC nº 135) exigem que a empresa tenha um Manual Geral de Manutenção.
  É parte obrigatória do sistema de manuais de manutenção do operador aéreo.

  7.4.1.2 Revisão. O Manual Geral de Manutenção deve ser fácil de revisar e ter procedimentos
  para manter todas as suas partes atualizadas. O manual pode ser em formato eletrônico ou
  em outro aceito pela Anac.

  7.4.1.3 Disponibilidade. O detentor de certificado deve disponibilizar cópias do manual,
  ou partes apropriadas dele, para aquelas pessoas obrigadas a cumpri-lo, incluindo quaisquer
  alterações ou acréscimos. Deverá manter todas as cópias de seu manual atualizadas, exceto
  se expressamente indicado que se trata de “cópia não controlada”. A empresa também deve
  disponibilizar seu manual à Anac e órgãos por ela definidos, conforme previsto nos parágrafos
  121.137(a)(3) e 135.21(e)(2) dos RBAC nº 121 e 135, respectivamente.

  7.4.1.4 Requisitos relacionados. Alguns requisitos relacionados ao manual são: parágrafo
  43.13(c) do RBAC nº 43, seções 121.135, 121.137 e 121.369 do RBAC nº 121, e as seções 135.21,
  135.23 e 135.427 do RBAC nº 135.'
