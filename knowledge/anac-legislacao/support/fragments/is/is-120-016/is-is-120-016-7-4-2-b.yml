title: 7.4.2(b)
text: 'b) Fornece instruções e procedimentos para administrar, usar, gerenciar e emendar o
  Programa.

  7.4.2.2 Organização e formato. O Manual Geral de Manutenção é uma publicação da empresa,
  e a empresa é a única responsável por sua organização e conteúdo. Entretanto, outros podem
  compilá-lo e publicá-lo em nome da empresa. O formato do Manual Geral de Manutenção pode
  ser hard copy ou eletrônico.'
