section_title: 'Os processos de avaliação desses eventos devem abordar:'
subsection_id: c
cite: 7.4.3.2.4(c)
title: 7.4.3.2.4(c)
text: 'c) Coordenação com o fabricante, conforme o caso. Os procedimentos especiais de inspeção
  para eventos de alta carga devem ser robustos o suficiente para:

  · Identificar que ocorreu um evento de carga muito alta;

  · Garantir que indícios de danos estruturais sejam encontrados em uma inspeção inicial;

  · Envolver o OEM, se necessário,

  · Ter um processo para inspeções adicionais que vise identificar todos os danos estruturais;
  e

  · Ter um processo de aprovação para o retorno ao serviço.'
