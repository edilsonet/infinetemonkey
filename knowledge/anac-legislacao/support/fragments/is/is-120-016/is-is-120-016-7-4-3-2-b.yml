title: 7.4.3.2(b)
text: 'b) Eventos de solo: pousos duros, pousos com sobrepeso e pousos com desvio lateral
  (drift landing) que resultem em cargas laterais e de arrasto excessivas.

  7.4.3.2.3 Normalmente, o fabricante do equipamento (OEM) incluirá instruções de inspeção
  detalhadas que deverão ser seguidas após eventos de sobrecargas. O objetivo destas instruções
  é detectar danos à aeronave após um evento em voo ou em solo. Embora existam muitas condições
  que possam resultar em sobrecargas na estrutura da aeronave, com danos estruturais subsequentes,
  o uso de dados de voo no processo de inspeção pode ser particularmente benéfico nos eventos
  identificados acima.'
