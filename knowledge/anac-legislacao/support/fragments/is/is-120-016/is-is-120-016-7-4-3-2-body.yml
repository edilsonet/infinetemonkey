text: '7.4.3.2 Instruções para a Administração, Gerenciamento e Cumprimento do Programa de
  Manutenção.

  7.4.3.2.1 Esta seção contém instruções detalhadas para o gerenciamento das várias funções
  e inter-relações de cada elemento do Programa de Manutenção, tais como limitações de tempo
  de manutenção, conservação de registros, gerenciamento de Diretrizes de Aeronavegabilidade
  (DA), gerenciamento e supervisão do Programa de Manutenção, gerenciamento e supervisão de
  manutenção contratada, e treinamento de pessoal. Esta seção geralmente inclui uma descrição
  das tarefas de manutenção programadas, informações de procedimento e instruções detalhadas,
  ou referências específicas do manual de manutenção para a realização de tarefas de manutenção.
  Além disso, nesta parte do manual de manutenção, devem ser descritos os critérios para iniciar
  voos de avaliações funcionais, juntamente com os requisitos processuais para eles. Nesta
  parte do manual, devem ser incluídos procedimento e critérios para inspeções não programadas,
  tais como aquelas associadas a descargas atmosféricas, impactos de cauda (tail strike),
  temperatura do motor excedendo o limite estabelecido, derramamentos de material perigoso
  (hazmat), pousos duros ou com excesso de peso, ou qualquer evento que envolva altas cargas
  para a aeronave.

  7.4.3.2.2 Deve haver um processo abrangente na parte de manutenção não programada do manual
  que trate daqueles eventos raros e de cargas estruturais extremamente altas que ocorrerem
  nas aeronaves. Esses eventos particulares são aqueles nos quais o processo de inspeção subsequente
  pode se beneficiar do uso de dados de voo. Devem ser considerados os eventos listados abaixo
  como os mais significativos:'
