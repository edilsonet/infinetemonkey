cite: 7.4.3.3(d)
title: 7.4.3.3(d)
text: 'd) a empresa garante que qualquer manutenção ou alteração subsequente de sua aeronave
  não remova a manutenção ou alteração que foi exigida por uma DA.

  Nota: a Advisory Circular nº 39-9 publicada pela Federal Aviation Administration - FAA é
  considerada um método de cumprimento aceitável na elaboração de programa de gerenciamento
  de diretriz de aeronavegabilidade, em suas partes aplicáveis, em sua versão vigente.

  7.4.3.3.3 Remoção das Disposições de DA. Se a empresa remover posteriormente a manutenção
  ou alteração mandatória pela DA, a empresa estará violando o RBAC nº 39 e uma condição insegura
  poderá ter sido introduzida na aeronave. Também tornaria imprecisos os registros necessários
  para essa DA específica. Se a empresa determinar que um método alternativo de cumprimento
  (AMOC) para uma DA é necessário, a empresa deve consultar a revisão mais recente da IS nº
  39.19-001 - Método Alternativo de Cumprimento de uma Diretriz de Aeronavegabilidade. Com
  relação à manutenção de registros de DA, consulte a Seção 7.9 desta IS para obter informações
  detalhadas que tratam de sistema de manutenção de registros.

  7.4.3.3.4 Fichas de Trabalho (Work Cards). As fichas de trabalho, às vezes chamadas de cartões
  ou fichas de tarefas, embora não sejam uma exigência regulamentar específica, evoluíram
  como uma melhor prática. Consideramos as fichas de trabalho como parte do manual da empresa
  aérea e do seu Programa de Manutenção. Elas representam "o que fazer" e "como fazer" de
  seu Programa de Manutenção. A empresa usa as fichas de trabalho como um meio simples de
  cumprir com os requisitos de manutenção e geração de registros. As fichas de trabalho são
  um elemento de controle para a execução da manutenção. Elas também fornecem os meios para
  garantir que todo o pessoal de manutenção cumpra com o manual de manutenção da empresa aérea.
  É uma maneira fácil para a empresa certificar-se de que seu pessoal de manutenção, assim
  como os contratados, estão seguindo os procedimentos da empresa. A segunda função principal
  é documentar as atividades de manutenção, proporcionando um meio para que a empresa cumpra
  com seus requisitos de conservação de registros de manutenção. As fichas de trabalho também
  documentam os resultados das inspeções, verificações e testes para a coleta e análise de
  dados. As auditorias de trabalho em andamento que a empresa realiza como parte de seu SASC
  também garantem que cada indivíduo que realiza trabalho em sua aeronave esteja seguindo
  seu manual de manutenção.

  7.4.3.3.5 Manutenção contratada. Se a empresa aérea optar por utilizar outra empresa para
  realizar a manutenção para ela, os parágrafos 121.369(b) do RBAC nº 121 e 135.427(b) do
  RBAC nº 135 exigem que o manual da empresa aérea inclua políticas, procedimentos, métodos
  e instruções para a realização de toda manutenção, manutenção preventiva e alterações realizadas
  por um provedor de manutenção. Essas políticas, procedimentos, métodos e instruções devem
  ser aceitáveis para a Anac e prever que a manutenção, a manutenção preventiva e as alterações
  sejam realizadas de acordo com o Programa de Manutenção e o manual de manutenção do detentor
  de certificado.

  Nota: consulte a Seção 7.10 desta IS para obter mais informações sobre as exigências de
  manutenção contratada.

  7.4.3.3.6 Uso de Ferramentas Especiais. Algumas tarefas de manutenção de produtos aeronáuticos
  demandam a utilização de ferramentas especiais, normalmente desenvolvidas pelos respectivos
  fabricantes. Os regulamentos permitem o desenvolvimento de ferramentas especiais pelos próprios
  operadores aéreos ou Organizações de Manutenção certificadas sob o RBAC nº 145. A equivalência
  dessas ferramentas com as dos fabricantes deverá ser demonstrada junto à Anac, com base
  nas instruções e procedimentos previstos na IS nº 43.13-005 - Ferramentas Especiais.

  7.5 Organização da Manutenção nas Empresas Aéreas

  7.5.1 Geral. A organização da manutenção deve ser capaz de executar, supervisionar, gerenciar
  e emendar seu Programa de Manutenção, gerenciar e orientar seu pessoal de manutenção e de
  fornecer o direcionamento necessário para atingir os objetivos do seu Programa de Manutenção.
  A empresa deve incluir um organograma e uma descrição de sua organização da manutenção em
  seu manual geral de manutenção. Os requisitos de manutenção constam da Subparte L do RBAC
  nº 121, Subparte J do RBAC nº 135 e Subparte C do RBAC nº 119. Esses regulamentos organizacionais
  aplicam-se ao operador aéreo, bem como a qualquer outra organização que forneça serviços
  de manutenção para a empresa. Um organograma é uma boa maneira de mostrar as atribuições
  de autoridades e responsabilidades gerais e diretas.

  7.5.2 Pessoal de administração. A Subparte C do RBAC nº 119 inclui requisitos específicos
  para cargos de gerenciamento de manutenção para operações sob os RBAC nº 121 e 135. Esses
  são cargos de gestão exigidos pelos regulamentos. Entretanto, a empresa pode precisar de
  mais cargos de gestão para administrar e gerenciar sua organização da manutenção. Se necessário
  para a sua operação, a empresa pode solicitar à Anac um desvio dos tipos e números dos cargos
  de gestão requeridos no RBAC nº 119 para empresas operando sob os RBAC nº 121 ou 135.

  7.5.2.1 Cargos requeridos para operadores sob RBAC nº 121. Para operações realizadas sob
  o RBAC nº 121, o parágrafo 119.65(a) do RBAC nº 119 exige que cada detentor de certificado
  tenha pessoal qualificado servindo no cargo de Diretor (ou Gerente) de Manutenção e de Inspetor
  Chefe (ou equivalente). A seção 119.67 do RBAC nº 119 define as qualificações para esses
  cargos.

  7.5.2.2 Cargos requeridos para operadores sob RBAC nº 135. Para operações conduzidas sob
  o RBAC nº 135, o parágrafo 119.69(a) do RBAC nº 119 exige que cada detentor de certificado
  tenha um indivíduo qualificado servindo na posição de Diretor (ou Gerente) de Manutenção,
  ou equivalente. O parágrafo 119.71(e) do RBAC nº 119 define as qualificações para esse cargo.

  7.5.2.3 Cargos de Gestão. Os regulamentos exigem que a empresa defina as obrigações, responsabilidades
  e autoridade de cada um de seus diretores ou gerentes em seu manual. A empresa deve declarar
  quem tem autoridade e/ou responsabilidade geral, e quem tem autoridade e/ou responsabilidade
  direta por um determinado processo. Além disso, a empresa deve notificar a Anac quando fizer
  mudanças na forma de cumprimento do RBAC nº 119 - Pessoal de Administração Requerido, incluindo
  quando houver vacância de uma dessas posições.

  NOTA 1: "Autoridade" significa o poder de elaborar ou alterar políticas ou procedimentos
  fundamentais sem ter que buscar aprovação de nível superior. Autoridade é permissão. É um
  direito aliado a um poder autônomo para realizar certos atos ou ordenar que outros ajam.
  Por exemplo, uma pessoa concede a outra, autoridade para agir, tal como um empregador a
  um empregado, uma corporação a seus dirigentes, ou um Governo a seus colaboradores, para
  desempenhar certas funções.

  NOTA 2: "Responsabilidade" significa a obrigação de assegurar que uma tarefa ou função seja
  realizada com sucesso. A responsabilidade inclui a prestação de contas da ação após executar
  uma tarefa ou função.'
