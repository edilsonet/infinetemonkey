title: Principais Seções do Manual Geral de Manutenção.
text: '7.4.3 Principais Seções do Manual Geral de Manutenção.

  O manual de manutenção deve ter uma organização prática. Normalmente, ele terá pelo menos
  três seções: (1) a primeira cobrindo políticas e procedimentos administrativos; (2) uma
  segunda contendo instruções detalhadas para a administração, gerenciamento e realização
  dos elementos do Programa de Manutenção; e (3) uma terceira cobrindo dados técnicos que
  descrevem padrões, métodos, técnicas e procedimentos de manutenção.

  7.4.3.1 Políticas e Procedimentos Administrativos. A principal função desta parte do manual
  é servir como uma ferramenta administrativa e de gestão para organizar, dirigir, alterar
  e controlar o Programa de Manutenção. Normalmente, são colocados aqui organogramas delineando
  as funções, relações e linhas de autoridade entre os elementos organizacionais e pessoal.
  Poderão ser listadas aqui as descrições de cargos, deveres, responsabilidades, autoridade
  específicos para cada cargo dentro da organização de manutenção. Os atributos de autoridade
  e responsabilidade que são colocados aqui devem mostrar quem tem autoridade e/ou responsabilidade
  geral e quem tem autoridade e/ou responsabilidade direta por determinadas funções.'
