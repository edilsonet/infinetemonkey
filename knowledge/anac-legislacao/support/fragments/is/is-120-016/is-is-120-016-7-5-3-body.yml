text: '7.5.3 Estrutura Organizacional da Manutenção Requerida da Empresa Aérea

  7.5.3.1 Estrutura. Dados os diferentes tipos e tamanhos de empresas aéreas, foi desenvolvida
  uma regulamentação ampla a fim de definir a organização da manutenção de uma empresa aérea.
  Um único meio de cumprimento ou um único organograma que se aplicaria a todos os diferentes
  tipos e tamanhos de organizações de manutenção de empresas aéreas não seria possível.

  7.5.3.2 Autoridade e Responsabilidade. O diretor de manutenção possui autoridade e responsabilidade
  geral pelo gerenciamento e implementação de todo o Programa de Manutenção. A função de inspeção
  de Item de Inspeção Obrigatória (IIO), que é parte do Programa de Manutenção, tem sua responsabilidade:'
