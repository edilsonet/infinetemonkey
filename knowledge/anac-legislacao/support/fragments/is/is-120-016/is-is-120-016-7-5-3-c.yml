cite: 7.5.3(c)
title: 7.5.3(c)
text: 'c) O diretor ou gerente de manutenção, responsável pelo Programa de Manutenção, no
  terceiro nível (estratégico).

  7.5.3.4 Descrições dos Cargos. A empresa deve atribuir autoridade e responsabilidade de
  forma clara em sua organização da manutenção utilizando seu Programa de Manutenção e elementos,
  incluindo delegações de responsabilidade. A empresa deve descrever as obrigações e responsabilidades
  de cada cargo em seu manual, para que não haja um eventual comprometimento do sistema organizacional
  ao gerar dúvidas sobre quem é responsável por um determinado elemento, processo ou tarefa.
  Deve-se tomar cuidado com os deveres e responsabilidades ocultas, em que o dever ou responsabilidade
  é mostrado em um processo, mas não na descrição do cargo.'
