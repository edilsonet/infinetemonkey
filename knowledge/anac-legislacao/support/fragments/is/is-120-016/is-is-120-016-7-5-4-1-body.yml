title: Exigências regulamentares
text: '7.5.4.1 Exigências regulamentares

  7.5.4.1.1 Se a empresa realizar manutenção (não inclui inspeções IIO), os parágrafos 121.365(a)
  do RBAC nº 121 e 135.423(a) do RBAC nº 135 requerem que a empresa tenha uma organização
  que seja adequada para realizar os trabalhos de manutenção. Adicionalmente, se a empresa
  realizar as inspeções de IIO, os parágrafos 121.365(b) do RBAC nº 121 e 135.423(b) do RBAC
  nº 135 exigem que a empresa aérea tenha uma organização que seja adequada para realizar
  o trabalho de inspeção IIO.

  7.5.4.1.2 O departamento de produção de manutenção (execução) não é a totalidade da sua
  organização da manutenção. Assim como o departamento de inspeção, se a empresa tiver um,
  contendo a organização das inspeções de IIO, também não é. Definimos "manutenção" na seção
  01.1 do RBAC nº 01 como "inspeção, revisão, reparo, conservação e substituição de partes
  de uma aeronave, excluindo a manutenção preventiva". Não definimos a inspeção IIO na seção
  01.1 do RBAC nº 01. No contexto dos RBAC nº 121 e 135, o termo "inspeção de IIO" tem um
  significado regulamentar muito específico, e não deve ser confundido com o uso geral da
  palavra "inspeção" em todos os regulamentos.

  7.5.4.1.3 Embora não haja nenhuma exigência regulamentar para separar os departamentos de
  manutenção e de inspeção obrigatória, há exigência de, durante a execução, separar a manutenção
  da inspeção obrigatória. Os regulamentos exigem que a empresa organize a execução de todas
  as funções de manutenção, incluindo inspeção, reparo, revisão e substituição de peças, de
  modo a separar a função de inspeção obrigatória das outras atividades de manutenção, manutenção
  preventiva e alteração. Essa separação de funções deve estar abaixo do nível de controle
  administrativo em que a empresa exerce a responsabilidade geral pelas funções. Na Figura
  1 a seguir é apresentado um Diagrama da Organização da Manutenção, contendo um organograma
  representativo.


  FIGURA 1 - DIAGRAMA DA ORGANIZAÇÃO DA MANUTENÇÃO.


