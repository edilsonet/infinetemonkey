title: Execução da Manutenção
text: '7.6.1 Execução da Manutenção

  7.6.1.1 Autoridade para Executar Manutenção. Como uma entidade de manutenção, a empresa
  tem autorização sob os parágrafos 43.3(f) e 43.7(e) do RBAC nº 43, seção 121.379 do RBAC
  nº 121 e seção 135.437 do RBAC nº 135 para executar manutenção nas aeronaves da sua frota
  e aprová-las para retornar ao serviço sem obter qualquer outra certificação de manutenção.
  Além disso, as seções 121.379 do RBAC nº 121 e 135.437 do RBAC nº 135 fornecem autoridade
  clara para que a empresa, sob seu certificado de operador aéreo, execute a manutenção em
  nome de outras empresas aéreas que conduzam operações sob o mesmo RBAC, observadas as restrições
  previstas na seção 135.437 do RBAC nº 135.'
