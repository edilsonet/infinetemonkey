title: 7.7.5.2(c)
text: 'c) O operador deve estabelecer um processo interno de atualização dos sistemas e mapas
  de controle de inspeções, tarefas e outras obrigações relacionadas à Programação de Manutenção
  proposta, contendo:

  I- Procedimento sistemático de análise das revisões dos documentos de referência da parte
  B recebidas, incluindo análise de aplicabilidade de todas as tarefas relacionadas, e os
  meios para determinação das ações decorrentes;

  II- Procedimento de registro das análises de aplicabilidade de tarefas o qual deve possibilitar
  sua recuperação para efeitos de auditoria. Devem ser mantidas também cópias de todas as
  revisões anteriores dos manuais/documentos de referência; e

  III- Sempre que for disponibilizada uma revisão do documento de referência da parte B, a
  análise de aplicabilidade e atualização do sistema/mapa de controle, caso aplicável, devem
  ser realizadas em até 180 (cento e oitenta) dias, a contar da data de publicação, ou antes,
  caso o emissor da publicação informe prazo mais restritivo.'
