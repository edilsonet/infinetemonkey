text: 'f) As alterações realizadas devem constar em uma lista de atualizações (highlights)
  com localização (página e item), descrição e motivação de todas as alterações feitas, a
  ser apresentada conforme descrito:

  Localização

  Descrição

  Motivação

  Página

  Item'
