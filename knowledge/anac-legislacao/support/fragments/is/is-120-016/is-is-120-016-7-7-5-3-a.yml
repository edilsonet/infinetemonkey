cite: 7.7.5.3(a)
title: 7.7.5.3(a)
text: 'a) A Parte B contém uma referência aos documentos, sem anotar a data ou letra de revisão
  desses documentos que deram origem à Programação de Manutenção do operador, assim como uma
  declaração da empresa de que as tarefas de manutenção aplicáveis serão executadas exatamente
  da mesma forma e com o mesmo intervalo de tempo recomendado nesses documentos, exceto por
  aquelas relacionadas na parte C ou julgadas como não aplicáveis. A parte B será dividida
  em 7 (sete) seções, assim organizadas:

  I- Seção B1 - Declaração informando que cumpre com as tarefas de manutenção aplicáveis recomendadas
  pelo fabricante/detentor do projeto de tipo de célula, exceto por aquelas relacionadas na
  parte C desta programação de manutenção e por aquelas julgadas como não aplicáveis, referenciando
  os documentos de origem;

  II- Seção B2 - Declaração informando que cumpre com as tarefas de manutenção aplicáveis
  recomendadas pelo fabricante/detentor do projeto de tipo de motores, exceto por aquelas
  relacionadas na parte C desta programação de manutenção e por aquelas julgadas como não
  aplicáveis, referenciando os documentos de origem;

  III- Seção B3 - Declaração informando que cumpre com as tarefas de manutenção aplicáveis
  recomendadas pelos fabricantes/detentor do projeto de tipo de hélices, exceto por aquelas
  relacionadas na parte C desta programação de manutenção e por aquelas julgadas como não
  aplicáveis, referenciando os documentos de origem;

  IV- Seção B4 - Declaração informando que cumpre com as tarefas relacionadas a Diretrizes
  de Aeronavegabilidade aplicáveis emitidas pela Anac ou pelo país detentor de projeto de
  tipo;

  V- Seção B5 - Declaração informando que cumpre com as tarefas de manutenção previstas nas
  Especificações de Tipo das aeronaves, motores e hélices, referenciando os documentos de
  origem;

  VI- Seção B6 - Declaração informando que cumpre com as tarefas de manutenção previstas nos
  Regulamentos, em especial com as tarefas referenciadas no RBAC 91 e com as seções 121.1107,
  121.1111, 121.1113, 121.1115 e 121.1117 do RBAC nº 121, conforme aplicáveis; e

  VII- Seção B7 - Declaração informando que cumpre com as tarefas de manutenção previstas
  em informações de aeronavegabilidade continuada de reparos e/ou alterações, assim como as
  tarefas oriundas do cumprimento com a seção 121.1109 do RBAC nº 121, conforme aplicável.

  Nota: como a atualização da lista de reparos ou alterações, assim como a atualização de
  tarefas relacionadas à seção 121.1109 do RBAC nº 121 pode ser muito dinâmica, poderá ser
  proposto e aprovado um procedimento que garanta que a empresa mantenha acesso às informações
  de aeronavegabilidade continuada relacionadas, e por consequência, uma lista atualizada
  dessas tarefas.'
