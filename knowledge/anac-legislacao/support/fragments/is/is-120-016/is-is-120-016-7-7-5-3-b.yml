title: 7.7.5.3(b)
text: 'b) Cada uma das declarações das 7 (sete) Seções da Parte B deverá seguir algum dos
  exemplos abaixo:

  I - Exemplo 1: A “Flight Airlines” mantém suas aeronaves de acordo com os documentos abaixo
  listados, nas suas últimas revisões, exceto por aquelas listadas na Parte C deste manual,
  e por aquelas tarefas julgadas como não aplicáveis, conforme registros mantidos por este
  operador:

  - Manual de Manutenção, PN xxxx, capítulo 4- airworthiness limitations

  - Manual de Manutenção, PN xxxx, capítulo 5 - time limits/maintenance checks,

  onde foi utilizada a opção 3.A.(3)(a), em função das condições de operações da empresa.


  II - Exemplo 2: A “Flight Airlines” mantém suas aeronaves de acordo com os documentos abaixo
  listados, nas suas últimas revisões, exceto por aquelas tarefas presentes na parte C deste
  manual, e por aquelas tarefas julgadas como não aplicáveis, conforme registros mantidos
  por este operador:

  - MRB, PN xxxx;

  - SSID, PN xxxx;

  - CPCP, PN xxxx;


  III - Exemplo 3: A “Flight Airlines” mantém suas aeronaves de acordo com os documentos abaixo
  listados, nas suas últimas revisões, exceto por aquelas tarefas presentes na parte C deste
  manual, e por aquelas tarefas julgadas como não aplicáveis, conforme registros mantidos
  por este operador:

  - Manual de Manutenção, PN xx, capítulo 4 e 5.'
