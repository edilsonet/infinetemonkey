title: 7.7.5.4(b)
text: b) A Parte C só é aplicável para empresas que, com base em sua experiência, em seu sistema
  de análise e supervisão continuada e/ou no programa de confiabilidade, substancie que as
  diferenças apresentadas não comprometem a eficácia de sua programação de manutenção, nem
  o cumprimento dos objetivos do PMAC, estabelecidos nas seções 121.367 do RBAC nº 121 e 135.425
  do RBAC nº 135.
