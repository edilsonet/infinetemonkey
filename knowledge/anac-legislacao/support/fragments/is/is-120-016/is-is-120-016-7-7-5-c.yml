title: 7.7.5(c)
text: c) A Parte B contém uma referência aos documentos, sem anotar a data ou letra de revisão
  desses documentos, que deram origem à Programação de Manutenção do Operador a ser aprovada
  pela Anac, além de uma declaração da empresa de que tarefas de manutenção serão executadas
  exatamente da mesma forma e com os mesmos intervalos de tempo recomendados nos documentos,
  exceto se de outra forma determinado na parte C e por aquelas julgadas como não aplicáveis;
