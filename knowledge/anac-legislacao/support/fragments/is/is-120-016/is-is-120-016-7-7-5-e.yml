title: 7.7.5(e)
text: 'e) O Plano de Implementação do Operador (PIO), necessário para cumprimento da seção
  121.1109 do RBAC nº 121, deve estar em anexo à Programação de Manutenção do Operador, sendo
  aprovado juntamente com ela.

  Nota: o apêndice C desta IS contém orientações sobre o Plano de Implementação de Operador
  (PIO), em cumprimento à seção 121.1109 do RBAC nº 121.'
