subsection_id: a
cite: 7.9.10.2(a)
title: 7.9.10.2(a)
text: a) A liberação para retorno ao serviço através de documento de liberação da aeronave
  para voo ou registro no livro de manutenção da aeronave, conforme exigido pelas seções 121.709
  do RBAC nº 121 ou 135.443 do RBAC nº 135 corresponde à aprovação para retorno ao serviço,
  prevista nas seções 43.5 e 43.7(e) do RBAC nº 43, 121.379(b) do RBAC nº 121, e 135.437(b)
  do RBAC nº 135. Além disso, os RBAC nº 121 e 135 exigem que a empresa prepare um documento
  de liberação da aeronave para voo ou um registro no livro de manutenção da aeronave antes
  que a empresa possa operar sua aeronave após realizar qualquer manutenção, manutenção preventiva
  ou alterações, quer a empresa opere a aeronave em serviço de transporte aéreo ou não.
