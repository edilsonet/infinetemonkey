section_title: Documento de Liberação da Aeronave para Voo ou Registro no Livro de Manutenção
  da Aeronave
subsection_id: b
cite: 7.9.10.2(b)
title: 7.9.10.2(b)
text: 'b) A aprovação para retorno ao serviço e documentação exigida pelas seções 121.709
  do RBAC nº 121 ou 135.443 do RBAC nº 135 podem ser executadas de uma das duas maneiras:

  I- A empresa pode preencher um documento de liberação da aeronave para voo e entregá-lo
  ao piloto em comando (PIC). Se a empresa usar um documento de liberação da aeronave para
  voo, deve mantê-lo separado e distinto do livro de bordo da aeronave. A exigência de ser
  separado e distinto consta no parágrafo 121.380(a)(1) e seção 121.709 do RBAC nº 121. Não
  há diferença legal ou técnica entre um documento de liberação da aeronave para voo e um
  registro no livro de manutenção da aeronave.

  II- Se a empresa fizer um registro no livro de manutenção da aeronave, não terá que emitir
  um documento de liberação da aeronave para voo. Para evitar confusão e para ser consistente
  com os regulamentos, a empresa não deve identificar essa inserção no livro da aeronave como
  uma liberação de aeronavegabilidade.'
