cite: 7.9.10.2(c)
title: 7.9.10.2(c)
text: 'c) De acordo com os parágrafos 121.709(e) do RBAC nº 121 e 135.443(d) do RBAC nº 135,
  a empresa pode incluir em seu manual uma declaração de que a assinatura no diário de bordo
  ou livro de manutenção de uma pessoa autorizada, constitui uma aprovação para retornar ao
  serviço sob seu Programa de Manutenção da empresa aérea. A empresa deve preparar seu documento
  de liberação da aeronave para voo ou registro no livro de manutenção da aeronave de acordo
  com os procedimentos de seu manual e deve incluir as quatro verificações seguintes, consistentes
  com os regulamentos:

  I- O trabalho foi realizado de acordo com as exigências do manual da empresa;

  II- Todos os IIO a serem inspecionados foram inspecionados por uma pessoa autorizada, que
  determinou que o trabalho foi concluído satisfatoriamente;

  III- Não existe nenhuma condição conhecida que torne a aeronave não aeronavegável; e

  IV- No que diz respeito ao trabalho realizado, a aeronave está em condições de operação
  segura.'
