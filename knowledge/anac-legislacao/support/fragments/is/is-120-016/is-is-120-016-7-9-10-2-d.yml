cite: 7.9.10.2(d)
title: 7.9.10.2(d)
text: 'd) O documento de liberação da aeronave para voo ou registro no livro de manutenção
  da aeronave deve ser assinado por uma pessoa devidamente habilitada e autorizada pela empresa
  a fazer o documento de liberação da aeronave para voo ou registro no livro de manutenção
  da aeronave em seu nome.

  Nota 1: a emissão de um documento de liberação da aeronave para voo ou registro no livro
  de manutenção devem ser feitos por um mecânico habilitado e autorizado pelo detentor de
  certificado a realizar tal liberação em seu nome, sob o certificado do operador aéreo, conforme
  definido nos parágrafos 43.7(e), 121.379(b) ou 135.437(b) e 121.709(b) ou 135.443(b)(3)).

  Nota 2: de acordo com os regulamentos, nenhum indivíduo pode emitir um documento de liberação
  da aeronave para voo ou fazer uma inserção no livro de manutenção a menos que a empresa
  o tenha autorizado.'
