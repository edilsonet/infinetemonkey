section_title: Documento de Liberação da Aeronave para Voo ou Registro no Livro de Manutenção
  da Aeronave
subsection_id: e
cite: 7.9.10.2(e)
title: 7.9.10.2(e)
text: e) O sistema de manuais da empresa deve incluir procedimentos detalhados para emissão
  do documento de liberação da aeronave para voo ou registro no livro de manutenção da aeronave
  após o cumprimento de qualquer manutenção realizada na aeronave. Esses procedimentos devem
  incluir um meio que garanta que o operador não opere a aeronave após a execução de manutenção,
  manutenção preventiva ou incorporação de alteração, a menos que a empresa emita um documento
  de liberação da aeronave para voo ou faça o devido registro no livro de manutenção da aeronave.
