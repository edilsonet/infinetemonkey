title: Requisitos para Relatórios de Grandes Alterações e Grandes Reparos.
text: '7.9.11 Requisitos para Relatórios de Grandes Alterações e Grandes Reparos.

  7.9.11.1 Relatório de Grandes Reparos e Grandes Alterações do RBAC nº 121. Se a empresa
  conduzir operações sob o RBAC nº 121, a seção 121.707 exige que a empresa faça um relatório
  de cada grande alteração e grande reparo aplicado nas aeronaves. A empresa deve disponibilizar
  o relatório de grandes alterações e grandes reparos à ANAC, quando solicitado. Isto se enquadra
  nos requisitos previstos na seção 119.59 do RBAC nº 119.

  7.9.11.2 Relatório de Grandes Reparos e Grandes Alterações - RBAC nº 135. Se a empresa conduzir
  operações sob o RBAC nº 135, não há nenhuma exigência que requeira que a empresa apresente
  relatórios de grandes alterações ou grandes reparos. Entretanto, embora um relatório não
  seja exigido, os registros de manutenção ou alteração da aeronave são exigidos e a empresa
  deve disponibilizá-los quando solicitados pela ANAC.

  Nota: a empresa não deve confundir esses relatórios de alterações e reparos com a lista
  atualizada do status de grandes alterações exigidas pelo RBAC nº 121 ou a lista atualizada
  de grandes reparos e alterações exigida pelo RBAC nº 135.

  7.9.12 Tempo de conservação de registros. Cada detentor de certificado deve conservar os
  registros conforme determinado pelos parágrafos 121.380(c) do RBAC nº 121 e 135.439(b) do
  RBAC nº 135.

  7.10 Manutenção Contratada

  7.10.1 Manutenção Contratada. O termo “manutenção contratada” significa qualquer manutenção,
  manutenção preventiva ou alterações realizadas por provedor de serviços de manutenção para
  o detentor de um certificado de empresa aérea. É importante observar que o detentor de certificado
  sempre retém a responsabilidade primária por qualquer manutenção contratada realizada por
  um provedor de manutenção.

  7.10.1.1 Provedor de Manutenção. As seções 121.363(b) do RBAC nº 121 e 135.413(b)(2) do
  RBAC nº 135 tratam de manutenção contratada por empresa aérea. Nesse aspecto, um provedor
  de manutenção é qualquer pessoa que executa manutenção, manutenção preventiva ou uma alteração
  para um detentor de certificado que não seja uma pessoa treinada e empregada diretamente
  por esse detentor de certificado.'
