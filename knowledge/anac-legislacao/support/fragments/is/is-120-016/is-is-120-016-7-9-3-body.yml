title: Trabalho realizado por uma Organização de Manutenção Aeronáutica (OM) RBAC nº 145
text: '7.9.3 Trabalho realizado por uma Organização de Manutenção Aeronáutica (OM) RBAC nº
  145

  7.9.3.1 Guarda de Registros. A geração e conservação dos registros de manutenção de uma
  Organização de Manutenção são regidas pela seção 145.219 do RBAC nº 145. Entretanto, os
  parágrafos 43.9(a) do RBAC nº 43 e a seção 145.219 do RBAC nº 145 não se aplicam quando
  a Organização de Manutenção Aeronáutica está realizando qualquer trabalho em aeronaves de
  um operador aéreo. O parágrafo 43.9(b) do RBAC nº 43 indica que as anotações de manutenção
  dos operadores aéreos devem seguir o disposto nos RBAC nº 121 e 135.

  7.9.3.2 Cópias de Registros. A redação da seção 145.205 do RBAC nº 145, assim como os parágrafos
  119.1(c) do RBAC nº 119, 121.1(b) do RBAC nº 121, e 135.1(a)(2) do RBAC nº 135, obrigam
  uma organização de manutenção a seguir os procedimentos e requisitos previstos no sistema
  de manuais do operador aéreo, ao realizar qualquer manutenção ou alterações nas aeronaves
  deste operador. Consequentemente, uma OM deve usar os padrões de desempenho do RBAC nº 121
  ou 135, incluindo os requisitos de geração e guarda de registros, ao invés de seguir as
  disposições do RBAC nº 145 e dos manuais da organização de manutenção (MOM e MCQ). A responsabilidade
  pela conservação de registros de acordo com as exigências dos parágrafos 121.380(c) do RBAC
  nº 121 e 135.439(b) do RBAC nº 135 é da empresa aérea, e não da OM. Entretanto, se uma OM
  quiser reter uma cópia desses registros gerados durante o trabalho nas aeronaves do operador
  aéreo, não há impedimento regulamentar para tal. Pedir à OM que conserve os registros de
  manutenção para o operador é coerente com os regulamentos, embora somente o operador seja
  responsável por mantê-los e disponibilizá-los para a ANAC. Isto é consistente com as exigências
  do parágrafo 119.59(c) do RBAC nº 119.'
