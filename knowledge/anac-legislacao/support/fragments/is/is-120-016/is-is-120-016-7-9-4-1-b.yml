section_title: 'Registros de Manutenção. Os registros de manutenção são importantes para:'
subsection_id: b
cite: 7.9.4.1(b)
title: 7.9.4.1(b)
text: 'b) a ANAC, para avaliação contínua dos registros de manutenção das aeronaves, como
  um meio direto de determinar a aeronavegabilidade e o status de segurança operacional das
  aeronaves das empresas aéreas.

  7.9.4.2 Análise dos Registros de Manutenção. Como a análise dos registros de manutenção
  é frequentemente o único meio direto de se determinar a realização de uma manutenção requerida,
  o ato de intencionalmente falsificar, rasurar ou alterar os registros de manutenção, se
  caracteriza como infração conforme disposto na Resolução nº 762, de 18 de dezembro de 2024.'
