title: Emissão e Conservação dos Registros Requeridos
text: '7.9.5 Emissão e Conservação dos Registros Requeridos

  7.9.5.1 Sistema de conservação de registros. Os parágrafos 121.369(c) do RBAC nº 121 e 135.427(c)
  do RBAC nº 135 requerem que a empresa tenha e use um sistema de conservação de registros
  para a preservação e recuperação de todo o trabalho realizado nas suas aeronaves. A empresa
  deve documentar seu sistema de registros no seu manual de manutenção. O principal objetivo
  deste sistema é a geração, conservação, guarda e recuperação de registros de manutenção
  precisos e completos de suas aeronaves. Esses registros são necessários principalmente para
  demostrar que o certificado de aeronavegabilidade padrão emitido pela ANAC está efetivo
  e que a aeronave está aeronavegável e é capaz de voar com segurança.

  7.9.5.2 Locais de registro. O parágrafo 119.59(b)(1)(ii) do RBAC nº 119 também requer que
  a empresa elabore e mantenha uma listagem que identifique o local de cada registro, documento
  ou relatório que a empresa tem de produzir e manter, bem como uma listagem que identifique
  cada pessoa responsável por cada um desses registros, documentos e relatórios.

  7.9.5.3 Diretrizes de Aeronavegabilidade (DA). Os parágrafos 121.380(a)(2)(v) do RBAC nº
  121 e 135.439(a)(2)(v) do RBAC nº 135 requerem que a empresa aérea mantenha um registro
  do status atual das DA aplicáveis à sua aeronave, incluindo a data e os métodos de conformidade,
  e, se a DA envolver ação recorrente, a hora e a data em que a próxima ação é necessária.

  7.9.6 Registros Requeridos de Manutenção de Empresas Aéreas. Os requisitos encontrados nas
  seções 121.380 do RBAC nº 121 e 135.439 do RBAC nº 135 exigem dois tipos de registros: uma
  lista com status atualizado de informações das aeronaves e os registros de liberação de
  aeronavegabilidade das aeronaves.

  7.9.7 Quando Disponibilizar os Registros para a ANAC. O parágrafo 119.59(c) do RBAC nº 119
  determina que a empresa deve colocar os registros de manutenção das aeronaves à disposição
  da ANAC, sempre que por ela requerido.

  7.9.8 Responsabilidade por Disponibilizar os Registros para a ANAC. Pelo parágrafo 119.59(b)(1)
  do RBAC nº 119, a empresa deve manter disponível para a ANAC em sua sede administrativa
  (ou em outro local aceito pela ANAC) uma listagem atualizada que inclua a localização e
  as pessoas responsáveis pela conservação de cada registro, documento e relatório, relativos
  à operação do detentor de certificado, cuja conservação seja requerida na forma e maneira
  estabelecida pela ANAC. A empresa deve manter esta lista atualizada e disponibilizá-la à
  ANAC, quando solicitado.

  7.9.9 Registros Requeridos. A empresa deve produzir e manter atualizados certos registros
  de status. Os registros de status são requeridos pelas seções 121.380 do RBAC nº 121 e 135.439
  do RBAC nº 135, e explicados a seguir:

  7.9.9.1 Tempo total em serviço. O tempo total em serviço da fuselagem, de cada motor instalado
  e de cada hélice instalada é um registro que contém o tempo em serviço acumulado desde novo
  ou reconstruído, expresso em horas, pousos ou ciclos.

  Nota: é importante notar que "reconstruído" não tem o mesmo significado que "revisado" (Parágrafo
  43.2(b)-I do RBAC nº 43).

  7.9.9.2 Status atual de cada peça com vida limite. O status atual de cada peça com vida
