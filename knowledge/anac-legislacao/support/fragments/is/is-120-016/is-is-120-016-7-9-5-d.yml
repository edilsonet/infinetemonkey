text: 'd) O tempo em serviço quando a próxima revisão geral programada for realizada.

  Nota: a listagem do tempo desde a última revisão geral refere-se a informações resumidas
  do status atual. Não se deve confundir com o registro de overhaul, que é uma descrição do
  trabalho realizado e a identificação da pessoa que realizou e/ou emitiu a aprovação para
  retorno ao serviço.

