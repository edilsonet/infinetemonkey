section_id: 7.9.9.5
section_title: 'Situação atualizada das DA aplicáveis. O status atualizado das DA aplicáveis
  significa um registro que contém pelo menos as seguintes informações:'
subsection_id: b
cite: 7.9.9.5(b)
title: 7.9.9.5(b)
text: 'b) Uma descrição ou referência aos dados técnicos aprovados pela ANAC utilizados para
  incorporar a grande alteração.

  Nota 1: se a empresa conduzir operações sob o RBAC nº 135, a empresa deve incluir também
  nessa lista todos os grandes reparos e grandes alterações existentes em cada rotor.

  Nota 2: a lista atualizada das grandes alterações contém apenas informações resumidas do
  status atual das grandes alterações. Não se deve confundir a lista com um relatório de grande
  alteração, que é uma descrição do trabalho realizado, uma descrição dos dados técnicos aprovados
  pela ANAC usados para fazer a grande alteração e a identificação do indivíduo que realizou
  ou emitiu a aprovação para retorno ao serviço. A empresa não deve confundir a lista de grandes
  alterações com a exigência de ter relatório de cada grande alteração ou grande reparo aplicado
  em suas aeronaves. Esses relatórios, conforme seção 121.707 do RBAC nº 121 deverão estar
  disponíveis quando requisitados pela ANAC. Há duas exigências diferentes - uma para uma
  listagem de status atualizado de uma grande alteração e outra de um relatório de cada grande
  alteração que a empresa incorporar.

  7.9.9.7 Documentos que embasam a liberação da aeronave. Todos os registros necessários para
  demonstrar que os requisitos para a emissão da liberação da aeronavegabilidade, conforme
  seções 121.709 do RBAC nº 121 e 135.443 do RBAC nº 135, foram atendidos. Tais registros
  podem incluir:'
