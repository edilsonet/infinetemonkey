section_id: 7.9.9.5
section_title: 'Situação atualizada das DA aplicáveis. O status atualizado das DA aplicáveis
  significa um registro que contém pelo menos as seguintes informações:'
subsection_id: d
cite: 7.9.9.5(d)
title: 7.9.9.5(d)
text: 'd) Documentos de Liberação da Aeronave para Voo cobrindo os últimos 60 dias de operação,
  quando tal documento é usado pela empresa.

  7.9.10 Outros Registros e Relatórios Necessários. Os regulamentos da ANAC exigem que a empresa
  emita outros relatórios e registros, conforme discutido nesta Seção da IS. A empresa pode
  usar esses registros e relatórios para avaliar suas atividades de manutenção, para verificar
  a adequação de seus sistemas de manuais de manutenção, assim como para verificar a eficácia
  de seu PMAC. Esses registros são uma das fontes de informação para o Sistema de Análise
  e Supervisão Continuada (SASC) do operador. A ANAC também usa esses relatórios em sua vigilância
  continuada das atividades do Programa de Manutenção da empresa.

  7.9.10.1 Livro de Registro de Manutenção. As seções 121.701 do RBAC nº 121 e 135.65 do RBAC
  nº 135 exigem que qualquer pessoa que tome uma ação em resposta a uma falha ou mau funcionamento
  relatado ou observado, faça um registro dessa ação no livro de manutenção da aeronave. Essas
  entradas do registro de manutenção da empresa aérea correspondem aos requisitos de registro
  de manutenção do parágrafo 43.9(b) do RBAC nº 43. A empresa também deve assegurar que cada
  piloto em comando (PIC) garanta que todas as irregularidades mecânicas ocorridas durante
  o voo sejam registradas no livro de manutenção, de acordo com a seção 121.563 do RBAC nº
  121 e o parágrafo 135.65(c)(1) do RBAC nº 135.'
