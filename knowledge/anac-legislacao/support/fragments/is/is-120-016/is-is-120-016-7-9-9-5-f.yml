section_title: 'Situação atualizada das DA aplicáveis. O status atualizado das DA aplicáveis
  significa um registro que contém pelo menos as seguintes informações:'
subsection_id: f
cite: 7.9.9.5(f)
title: 7.9.9.5(f)
text: 'f) Com relação a uma DA, o método de cumprimento significa uma descrição concisa da
  ação tomada para cumprir com as exigências da DA. Se a DA ou o Boletim de Serviço (SB) do
  fabricante referenciado permitir o uso de mais de um método de cumprimento, o registro deve
  incluir uma referência ao método específico de cumprimento utilizado. Se a empresa usar
  um método alternativo de cumprimento (AMOC) para cumprir com uma DA, o método de cumprimento
  significa uma descrição do AMOC e uma cópia da aprovação da ANAC.

  Nota: a empresa não deve confundir a lista de status atualizado de uma DA ou o método de
  cumprimento com um registro de realização da DA, que é uma descrição do trabalho e a indicação
  de quem o executou e/ou emitiu a aprovação para retorno ao serviço. Eles são dois registros
  separados e distintos.

