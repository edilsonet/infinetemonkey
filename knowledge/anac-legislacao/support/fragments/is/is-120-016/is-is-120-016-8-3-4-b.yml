section_id: 8.3.4
section_title: 'Para solicitação de extensão devem ser enviados os seguintes documentos:'
subsection_id: b
cite: 8.3.4(b)
title: 8.3.4(b)
text: 'b) Relatório técnico, assinado pelo Diretor de Manutenção, contendo:

  I- Motivo do pedido de extensão;

  II- Identificação da aeronave, motor, hélice ou componente;

  III- Dificuldades em serviço dos últimos 12 (doze) meses referentes ao escopo da extensão
  pretendida;

  IV- Proposta de ações de manutenção para acompanhamento do produto aeronáutico em questão
  durante a vigência da extensão, como por exemplo, inspeções complementares;

  V- Registro de manutenção referente à última realização da tarefa ou da revisão geral do
  produto aeronáutico em questão, conforme aplicável, para a qual está sendo solicitada a
  extensão;

  VI- Análise perante possíveis diretrizes de aeronavegabilidade relacionadas que poderiam
  impedir a extensão;

  VII- A quantidade de pedidos de extensão dos últimos 12 (doze) meses, aprovados ou não.
  Para os pedidos aprovados, deverão constar a situação, se estão em vigor ou não, e o respectivo
  documento de aprovação;

  VIII- Status atual do intervalo de manutenção, indicando se foi utilizada a tolerância definida
  pelo fabricante, caso haja;

  IX- Análise de risco elaborada pelo SGSO ou SASC do operador, caso possua, que indique a
  classificação de risco, referente aos aspectos de aeronavegabilidade continuada, assim como
  meios de mitigação caso aplicável. Tal análise deve levar em consideração possível multiplicidade
  de tarefas com extensão; e

  X- Assinatura do responsável.'
