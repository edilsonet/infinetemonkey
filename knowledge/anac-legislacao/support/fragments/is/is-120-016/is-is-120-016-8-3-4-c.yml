section_title: 'Para solicitação de extensão devem ser enviados os seguintes documentos:'
subsection_id: c
cite: 8.3.4(c)
title: 8.3.4(c)
text: 'c) Comprovante de recolhimento de TFAC.

  Nota: o uso de extensões deve ser encarado como excepcionalidade pelos operadores, e nunca
  como regra ou recursos regulares no planejamento da manutenção.

  FORMULÁRIOS

  9.1 Os respectivos modelos de formulários, em sua versão mais atualizada, estão disponíveis
  para o usuário em formato editável no sítio da ANAC na rede mundial de computadores, no
  endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.'
