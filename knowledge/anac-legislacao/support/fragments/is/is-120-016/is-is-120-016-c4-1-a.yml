section_title: 'O parágrafo 402 do capítulo 4 da AC 120-93 traz o conteúdo do PIO:'
subsection_id: a
cite: C4.1(a)
title: C4.1(a)
text: 'a) implementação do Guia de Avaliação de Reparos contendo:

  (1) um processo para a realização de pesquisas para identificar e determinar se os reparos
  e alterações existentes afetam estruturas críticas à fadiga (Fatigue Critical Baseline Structure
  - FCBS);

  (2) um processo para obter as DTIs; e

  (3) um cronograma para determinar datas limites para o cumprimento das inspeções nas aeronaves
  e para a incorporação das DTIs no programa de manutenção;'
