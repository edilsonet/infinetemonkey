title: Revisões. O operador pode propor revisões em sua programação de manutenção conforme
text: '10.1.1 Revisões. O operador pode propor revisões em sua programação de manutenção conforme

  as orientações estabelecidas na IS nº 120-016. A cada revisão, o operador deve encaminhar

  à Anac a programação de manutenção proposta juntamente com documento de aprovação

  final contendo assinatura dos responsáveis pelo programa de confiabilidade.

  Nota: além da aceitação de cada revisão, todo o processo fica sujeito ao acompanhamento

  contínuo da Anac de forma a verificar que o operador está executando seu processo em

  conformidade com seu programa de confiabilidade, e que suas decisões baseadas em dados

  são no sentido da segurança e dos objetivos do programa. Portanto, o programa deve

  incluir requisitos suficientes de documentação e armazenamento de registros.

  10.2 Implementação. O processo deve resultar num plano coerente para se implementar as

  mudanças na programação de manutenção. O plano de implementação deve ser

  documentado e conter outras informações consideradas durante o processo de aprovação

  interna. Na maioria dos casos, mudanças na programação de manutenção irão requerer

  coordenação significativa com as organizações de suporte de manutenção, envolvendo

  alocação de recursos, logística e grupos de planejamento, especialmente quando o intervalo

  de um pacote de cheque inteiro está sendo revisado.'
