title: Intervalos escalonados e exclusão de tarefas. Estas mudanças normalmente se tornarão
text: '10.2.1 Intervalos escalonados e exclusão de tarefas. Estas mudanças normalmente se
  tornarão

  efetivas assim que protocoladas na Anac para aceitação, conforme o item 10.1.1 e

  conforme o processo interno definido do operador para alterações nas tarefas. A

  implementação de tarefas individuais com intervalos escalonados é relativamente simples.

  Nota: o operador deve prestar atenção especial a tarefas de cheques de tempo/data que

  avaliem limites de vida restantes. Itens com vida-limite não podem ter seu limite de vida

  excedido por causa de escalonamentos de tarefa. Antes de implementar o escalonamento, o

  operador deve se assegurar que há tempo restante suficiente em itens com vida-limite no

  novo intervalo. Um item com vida limitada não pode permanecer em serviço após o limite

  de seu vencimento.Data de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X'
