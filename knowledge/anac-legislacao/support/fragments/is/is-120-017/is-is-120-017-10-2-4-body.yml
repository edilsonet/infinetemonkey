title: Acompanhamento. O programa de confiabilidade do operador deve continuar a monitorar
text: '10.2.4 Acompanhamento. O programa de confiabilidade do operador deve continuar a monitorar

  a eficácia da programação de manutenção durante a implementação. Dependendo do risco,

  um operador pode precisar acompanhar e reportar mudanças específicas ou fases de

  implementação de forma a confirmar que a mudança não impacta adversamente o sistema

  afetado, e que a mudança está atingindo os resultados esperados.

  11 FORMATO DE RELATÓRIOS E EXIBIÇÃO

  11.1 Geral. Todos os programas irão requerer meios de exibição e relatórios resumidos dos

  dados coletados, análises realizadas e o status de recomendações aprovadas internamente.'
