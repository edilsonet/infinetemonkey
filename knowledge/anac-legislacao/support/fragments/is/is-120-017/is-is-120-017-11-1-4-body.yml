text: '11.1.4 Entrega. A distribuição dos relatórios e prazos de entrega devem estar especificados
  no

  programa de confiabilidade. Os relatórios devem ser entregues aos gestores de manutenção

  do operador e à Anac.

  12 APÊNDICES

  12.1 Apêndice A - [Reservado].

  12.2 Apêndice B - Ajustes em tarefa/intervalo - diagrama de alto nível.

  12.3 Apêndice C - Tarefas Failure Effect Category (FEC) 5 e 8.

  12.4 Apêndice D - Tarefas Failure Effect Category (FEC) 6/7/9.

  12.5 Apêndice E - Tarefas de lubrificação/filtro.

  12.6 Apêndice F - Procedimento de análise Zonal/Enhanced Zonal (EZAP).

  12.7 Apêndice G - Estruturas.

  12.8 Apêndice H - Tarefas Lightning/High Intensity Radiated Fields (L/HIRF).

  12.9 Apêndice I - Programas do operador e aparência.

  12.10 Apêndice J - Requisitos de fonte regulatória.

  12.11 Apêndice K - Lista de reduções.

  13 DISPOSIÇÕES FINAIS

