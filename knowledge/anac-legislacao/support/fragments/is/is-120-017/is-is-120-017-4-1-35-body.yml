text: '4.1.35 Tipo de tarefa. Classificações padrão do processo MSG para um escopo específico
  de

  tarefa (por exemplo inspeção, lubrificação, calibração, inspeção visual detalhada e cheque

  funcional etc.).

  5 INFORMAÇÕES GERAIS

  5.1 O programa de confiabilidade é o padrão do operador para determinar limitações de tempo

  para tarefas de manutenção, ou seja, programação de manutenção. Quando aprovado pela

  Anac e após haver autorização da Agência nas Especificações Operativas, o programa de

  confiabilidade apresenta os meios para ajustes de intervalos de tarefas da programação de

  manutenção. Tais alterações são sujeitas a avaliação continuada da Anac e sua manutenção

  pode depender de resultados de fiscalização.

  Nota: esta Instrução Suplementar aplica as definições quanto a aprovação e aceitação

  dispostas na IS nº 121-010.'
