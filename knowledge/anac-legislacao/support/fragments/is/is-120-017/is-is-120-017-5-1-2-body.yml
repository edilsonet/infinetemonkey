title: Tarefas com intervalos ajustados devem ser incluídas na Parte C, Seção C2 da
text: '5.1.2 Tarefas com intervalos ajustados devem ser incluídas na Parte C, Seção C2 da

  programação de manutenção.

  Para receber aprovação da Anac para o uso de um programa de confiabilidade como

  padrão para ajustes em tarefas e intervalos da programação de manutenção o operador deve

  demonstrar que atende os métodos descritos nesta IS.

  No caso de revisão da programação de manutenção decorrente de ajustes nos intervalos, a

  programação de manutenção deve ser apresentada à Anac juntamente com o parecer

  favorável dos responsáveis pelo programa de confiabilidade. A nova programação de

  manutenção pode ser colocada em prática a partir da data em que é protocolada na Anac.

  Caso haja atualização da programação de manutenção em desacordo com os

  procedimentos previstos no programa de confiabilidade aprovado ou com os requisitos

  vigentes, o detentor de certificado fica sujeito à suspensão desta prerrogativa.'
