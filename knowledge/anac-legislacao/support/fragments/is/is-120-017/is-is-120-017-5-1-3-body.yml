title: Métodos de cumprimento
text: '5.1.3 Métodos de cumprimento

  A presente IS descreve processos, técnicas e procedimentos que levam a um programa de

  confiabilidade eficaz e que contribui com a garantia de um nível de segurança apropriado

  aos tipos de operações conduzidas. Nenhuma das informações contidas nesta IS é

  mandatória ou constitui regulamento. Esta IS não impõe, reduz ou altera requisitos

  regulamentares.

  Cada operador é único, sendo que não se pode descrever uma única forma de cumprimento

  que seja aplicável a todos quanto ao desenvolvimento, implementação e manutenção de um

  programa de confiabilidade.

  Por definição, a presente IS assume que todos os elementos de seu PMAC estão

  estabelecidos, documentados e funcionando. Os padrões descritos nesta IS não visam de

  forma alguma considerar deficiências em outras áreas de seu PMAC sendo, portanto,

  considerados um nível mínimo aceitável. O entendimento da Anac quanto à adequação do

  programa de confiabilidade proposto pode variar do estabelecido nesta IS, de forma a

  considerar deficiências em outras áreas de seu PMAC.

  5.2 Histórico'
