title: Operadores RBAC nº121 e 135. Os regulamentos da Anac estabelecem que detentores de
text: '5.2.1 Operadores RBAC nº121 e 135. Os regulamentos da Anac estabelecem que detentores
  de

  certificado operando sob o RBAC nº 121 ou sob os parágrafos 135.411(a)(2) ou (b) do

  suas limitações de tempo. Tais limitações de tempo especificam as tarefas e intervalos para

  manutenção programada: os “que”, “como” e “quando” de seu esforço de manutenção

  programada. No contexto do PMAC de operadores aéreos o conjunto de tarefas de

  manutenção, associado a seus intervalos de manutenção, é chamado de Programação de

  Manutenção.'
