title: Maintenance Steering Group - 3rd Task Force (MSG-3). Esta IS utiliza por base o
text: '5.2.3 Maintenance Steering Group - 3rd Task Force (MSG-3). Esta IS utiliza por base
  o

  processo MSG-3, o qual foca na manutenção das funções de sistemas de aeronaves

  enquanto também considera a eficácia e custo de manutenção. O processo MSG-3

  identifica as consequências de falhas funcionais e permite uma seleção mais ampla de tipos

  de tarefas de manutenção do que o MSG-2. De maneira geral, a presente IS não identifica

  nenhum processo específico do Maintenance Steering Group (MSG) enquanto se refere

  aos processos, métodos e padrões do operador especificados num programa de

  confiabilidade.'
