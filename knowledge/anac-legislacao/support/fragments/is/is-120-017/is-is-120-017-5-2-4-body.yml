title: Sistema de Análise e Supervisão Continuada (SASC). Um programa de confiabilidade
text: '5.2.4 Sistema de Análise e Supervisão Continuada (SASC). Um programa de confiabilidade

  devidamente desenvolvido e eficaz é uma parte do SASC, podendo atender parcialmente

  os requisitos de SASC relacionados à coleta de dados operacionais, análise e ações

  corretivas. Assim como no SASC, o programa de confiabilidade do operador não visa

  duplicar os requisitos relacionados ao SGSO. Em vez disso, todos esses sistemas devem

  ser desenvolvidos para se comunicar e se complementar naturalmente entre si, resultando

  em pouca ou nenhuma duplicação de esforço ou responsabilidades.

  6 AVALIAÇÃO E REVISÃO DO PROGRAMA DE CONFIABILIDADE

  6.1 Criação do programa e revisões'
