  6.2 Outros requisitos regulamentares. A Anac estabelece a previsão de que operadores

  condição para sistemas, aeronaves, componentes e grupo motopropulsor, conforme

  definido nas seções 121.369 e 121.374 e Apêndice P do RBAC nº 121, e na seção 135.427

  do RBAC nº 135 e Apêndice G do RBAC nº 135. Esses requisitos requerem, ainda, que

  operadores RBAC nº 121 e RBAC nº 135 tenham um programa de confiabilidade ETOPS

  para operações ETOPS. O cumprimento destes requisitos não é considerado suficiente para

  se assegurar um método para a determinação de ajustes de intervalos na programação de

  manutenção. Isto é válido especialmente para o caso de escalonamento de intervalos. O

  operador deve desenvolver seu programa de confiabilidade incorporando os métodos

  aceitáveis descritos nesta IS, de forma a garantir um padrão eficaz para a determinação
  de

  ajustes de intervalos.

  6.3 Apresentação do programa de confiabilidade. O programa de confiabilidade inicial deve

  ser apresentado à Anac para análise e aprovação e inclusão da respectiva autorização nas

  Especificações Operativas. As revisões subsequentes do programa de confiabilidade serão

  aceitas pela Anac.

  6.4 Avaliação contínua. Como parte de um Sistema de Análise e Supervisão Continuada

  (SASC) eficaz, o operador deve monitorar continuamente o desempenho e eficácia de seu

  programa de confiabilidade com base em seus indicadores. O operador deve conduzir

  avaliações periódicas documentadas de forma a determinar se seus padrões de desempenho

  são realistas e eficazes quanto à identificação de deficiências, realizando revisões conforme

  necessário.

  7 SISTEMA DE COLETA DE DADOS

