title: Treinamento/competência técnica do pessoal de confiabilidade
text: '6.1.4 Treinamento/competência técnica do pessoal de confiabilidade

  O operador deve determinar seus padrões técnicos especializados e requisitos de

  documentação de treinamento para pessoas com funções de coleta, análise e

  armazenamento de dados ou relatórios de confiabilidade. As competências e padrões de

  conhecimento desejados devem estar definidos e se basear no nível de complexidade dos

  dados operacionais e de manutenção programada coletados. A Tabela 6-1 apresenta

  treinamentos típicos, para referência.

  O operador pode ajustar o conteúdo, frequência e métodos de treinamentos

  disponibilizados a indivíduos dependendo de uma avaliação de suas funções e

  responsabilidades, treinamento prévio, experiência prática na manutenção, e/ou

  demonstração de aptidão e resultados alcançados.

  A Anac espera que os participantes do programa de confiabilidade com autoridade de

  aprovação compreendam inteiramente suas funções e responsabilidade relativas ao

  programa de confiabilidade.

  Tema do treinamento Padrões de conhecimento do pessoal de

  confiabilidade

  Especificações Operativas Familiarização e ciência

  Treinamento em sistemas de análise Treinamento geral em padrões de qualidade e

  métodos de análise estatística

  Treinamento em dados de confiabilidade Experiência ou treinamento na realização de

  análise de relatórios de dados operacionais e de

  outras não conformidades identificadas na

  manutenção programada

  Maintenance Steering Group (MSG-3) Entendimento da metodologia MSG-3

  Treinamento de avaliação de risco A habilidade de avaliar risco associado a uma

  situação, falha ou perigo

  Treinamento em análise de causa-raiz,

  incluindo fatores humanos

  Método de solução de problemas que identifica a

  causa-raiz de defeitos, falhas, deficiências ou

  perigos

  Treinamento em Failure Mode and Effects

  Analysis (FMEA)

  Método de análise que identifica os modos de

  falha e efeitos decorrentes de falhas relacionadas

  a panes específicas

  Treinamento técnico Específico por aeronave (fabricante, modelo e

  número de série)

