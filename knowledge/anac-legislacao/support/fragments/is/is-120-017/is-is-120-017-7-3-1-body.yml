text: '7.3.1 Geral. Fontes e tipos de dados são o fundamento de qualquer programa de confiabilidade.

  Dados são considerados de qualidade suficiente quando são precisos, livres de erros de

  registros substanciais e quando são abrangentes o suficiente, tanto no escopo quanto nos

  detalhes, de forma a facilitar suas funções pretendidas na operação, análise e tomada de

  decisões.'
