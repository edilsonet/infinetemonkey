text: 'e) um sistema de código usado para se correlacionar irregularidades mecânicas em

  sistemas de aeronaves com defeitos identificados durante tarefas de manutenção de rotina,

  relatórios de desgaste da organização de manutenção e outros dados relevantes.

  Nota: embora um meio eletrônico de coleta, armazenamento, obtenção e análise de dados

  não seja requerido formalmente, limitações nessas áreas podem restringir ou impedir o

  operador de exercer as responsabilidades indispensáveis necessárias para se implementar
  e

  manter um programa de confiabilidade eficaz.

  8 SISTEMA DE PADRÕES DE DESEMPENHO

  8.1 Identificação de padrões de desempenho. Um padrão de desempenho é expresso

  numericamente, como um número, uma taxa, razão ou porcentagem. Pode ser calculado

  pelo número de eventos ocorrendo num período específico de operação expresso em ciclos

  de voo, horas de voo, horas de operação ou tempo calendárico. Padrões de desempenho são

  utilizados para se identificar uma medida aceitável de confiabilidade em termos de falhas

  de sistemas ou componentes, irregularidades mecânicas reportadas por pilotos, atrasos

  operacionais e cancelamentos, não conformidades identificadas em manutenção

  programada, ou qualquer outro evento que sirva de base para o padrão. Limites de controle

  ou valores de alerta devem se basear em métodos estatísticos amplamente aceitos como

  desvio padrão, distribuição de Poisson, ou método de média ou de valor de referência,

  conforme adequado. Adicionalmente, o programa deve incluir procedimentos para revisão

  periódica e ajuste de padrões. No caso de inclusão de novos modelos na frota, o programa

  deve conter procedimentos detalhados para o monitoramento até que experiência suficiente

  de operação esteja disponível para se computar um padrão de desempenho. Padrões deData de
  emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X

  desempenho aceitáveis devem ser ajustáveis com base na experiência operacional do

  operador, assim como nos efeitos da idade da frota e considerações operacionais, sazonais

  e ambientais. Os padrões de desempenho devem ser associados com os sistemas

  específicos da aeronave, conforme os tipos de dados sendo medidos.

  8.2 Técnicas para determinar desvios dos padrões. Um operador pode escolher utilizar uma

  ou uma combinação de técnicas listadas na Tabela 8-1, Técnicas para a determinação de

  desvios dos padrões de desempenho, ou qualquer outro método aceitável que identifique

  quando o nível aceitável de desempenho definido pelo operador não for atingido.

  Independentemente do método escolhido pela empresa aérea, ele deve ser proativo e capaz

  de identificar problemas operacionais emergentes e vigentes que o operador possa precisar

  corrigir. O método escolhido não pode ser tão tolerante a ponto de que desvios anormais
  de

  um padrão aceitável não sejam identificados como problemas ou como deficiências

  ocultas. Nem pode ser tão restritivo a ponto de resultar em “ruído” excessivo de dados,
  do

  qual desvios demais do padrão sejam identificados. Um método eficaz resultará em dados

  relevantes e significativos, a partir dos quais deficiências potenciais, emergentes e em

  tempo real possam ser identificadas, analisadas e tratadas.Data de emissão: 20 de março
