cite: 8.2.2
title: Programas de monitoramento de tendências. Quando dados são preparados com uma
text: '8.2.2 Programas de monitoramento de tendências. Quando dados são preparados com uma

  exibição móvel gráfica ou tabular do desempenho atual estes ilustram tendências, assim

  como condições fora dos limites. Dados de desempenho de sistemas de aeronaves

  normalmente são reforçados por relatórios de remoção de componentes ou de falhas

  confirmadas. A escolha de unidades de medida não é crítica, desde que sejam constantes ao

  longo da operação do programa e que sejam apropriadas ao tipo e frequência dos eventos

  ou condições que estão sendo registrados. Para avaliar deterioração no desempenho o

  operador deve determinar prazos associados com o monitoramento do desempenho. Por

  exemplo, um programa poderia monitorar os padrões de desempenho para medir o

  desempenho do mês atual, de 3 meses e de 12 meses.'
