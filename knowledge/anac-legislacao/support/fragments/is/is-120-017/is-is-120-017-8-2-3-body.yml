cite: 8.2.3
title: Programas baseados em eventos. Um programa baseado em eventos monitora e
text: '8.2.3 Programas baseados em eventos. Um programa baseado em eventos monitora e

  desenvolve recomendações em resposta a eventos operacionais específicos. Programas

  baseados em eventos podem ser utilizados por organizações de qualquer porte e aplicados

  a qualquer tamanho de frota. Esta técnica deve contar com quantidade suficiente de dados

  de forma a ter a capacidade de analisá-los e chegar a conclusões significativas e

  praticáveis. Muitas das informações geradas para auxiliar na operação cotidiana de seu

  PMAC podem ser utilizadas de forma eficaz como base para este tipo de análise contínua

  de desempenho mecânico. Como medida de eficácia da programação de manutenção,

  alguns tipos de dados são mais adequados para programas baseados em eventos do que

  outros. Eventos tendo implicações em segurança ou outro impacto operacional

  significativo devem ser investigados independentemente do número de ocorrências.'
