title: Programas baseados em indicadores. Este método envolve um indicador composto,
text: '8.2.4 Programas baseados em indicadores. Este método envolve um indicador composto,

  criado e apresentado utilizando múltiplos tipos de dados. Os dados devem ser

  correlacionados com sistemas e subsistemas de aeronaves específicas para produzirem uma

  classificação de desempenho referente a todos os sistemas e subsistemas sendo

  monitorados.'
