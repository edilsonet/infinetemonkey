text: 'd) baseado em indicadores:

  I - classificação dos sistemas e subsistemas com pior desempenho;

  II - não conformidades identificadas em tarefas de rotina; e

  III - eficácia do programa de gerenciamento da Lista de Equipamentos

  Mínimos (MEL).

