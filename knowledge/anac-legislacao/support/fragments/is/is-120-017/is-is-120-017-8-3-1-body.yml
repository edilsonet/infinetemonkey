text: '8.3.1 Documentos fonte do detentor do projeto. Revisões nos documentos de referência,

  incluindo no Maintenance Review Board Report (MRBR) e no Maintenance Planning

  Document (MPD) são geradas para beneficiar a comunidade de operadores de aeronaves e

  ocorrem em função de se agregar experiência de operação em serviço de determinado

  fabricante e modelo de aeronave. Tais revisões contemplam experiência global em serviço

  e refletem novas configurações de projeto e novas regras. Conforme estabelecido na IS nº

  120-016, item 7.7.4.4, o operador deve realizar uma revisão documentada de cada nova

  revisão de documentos fonte do detentor do projeto de forma a determinar se uma mudançaData
  de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X

  em sua programação de manutenção é aplicável. Um período definido de revisão ou

  critérios de prazos deve ser incluído nos procedimentos do operador, se baseando:'
