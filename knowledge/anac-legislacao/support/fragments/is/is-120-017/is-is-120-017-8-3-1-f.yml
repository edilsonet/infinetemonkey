text: 'f) em caso de eliminação de tarefas ou aumentos de intervalo de tarefa em documentos

  fonte do detentor de projeto:

  I - se a análise das métricas de confiabilidade e padrões de desempenho do

  operador relacionados às tarefas revisadas demonstram níveis aceitáveis

  de confiabilidade o operador pode escolher por adotar a mudança ou não.

  II - se a análise das métricas de confiabilidade e padrões de desempenho do

  operador relacionados às tarefas revisadas demonstram níveisData de emissão: 20 de março
  de 2025 IS nº 120-017

  Revisão AX

  X

  inaceitáveis de confiabilidade o operador não deve adotar a mudança até

  que desenvolva recomendações para tratar estas variações. A revisão do

  detentor do projeto pode ser reconsiderada após se atingirem níveis

  aceitáveis de desempenho.'
