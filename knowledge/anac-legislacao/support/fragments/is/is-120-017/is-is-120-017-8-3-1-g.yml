title: 8.3.1(g)
text: 'g) em caso de adições de tarefa ou diminuição de intervalos em documentos fonte do

  detentor de projeto:

  I - se a análise das métricas de confiabilidade e padrões de desempenho do

  operador relacionados às tarefas revisadas demonstram níveis aceitáveis

  de confiabilidade o operador pode escolher por adotar a mudança ou não.

  II - se a análise das métricas de confiabilidade e padrões de desempenho do

  operador relacionados às tarefas revisadas demonstram níveis

  inaceitáveis de confiabilidade, o operador deve adotar a mudança, a

  menos que tenha desenvolvido suas próprias recomendações, conforme

  descrito nesta IS, para tratar as variações dos padrões de desempenho.'
