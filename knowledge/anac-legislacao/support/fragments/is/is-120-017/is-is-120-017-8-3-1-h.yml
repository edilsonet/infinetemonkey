title: 8.3.1(h)
text: 'h) análise de Weibull. A análise de Weibull determina o perfil de distribuição e

  previsibilidade de falha, sendo usada para determinar se um componente ou sistema

  demonstra sinais de deterioração do desempenho com a idade. Este método estatístico

  ajuda a determinar se um componente pode se beneficiar de uma tarefa de restauração ou

  de manutenção preventiva comum;

  Nota: quando aplicado apropriadamente, métodos de análise de Weibull não são objetos de

  limitações de rendimento de tarefa como descrito em 9.3.3.'
