title: 8.3.1(i)
text: 'i) análise de Pareto. A análise de Pareto é uma ordenação classificatória simples do

  número ou da taxa de defeitos para uma determinada fonte de dados. Esta representação

  gráfica pode ser utilizada de forma eficaz para eventos de aeronave fora de serviço,

  eventos de atrasos e cancelamentos, aplicações e extensões da lista de equipamentos

  mínimos (MEL), e outras métricas conforme apropriado. Gráficos de Pareto são usados

  para identificar os itens com maior número de falhas, os quais são frequentemente visados

  para melhorias de desempenho;'
