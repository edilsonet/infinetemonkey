title: 8.3.1(l)
text: 'l) outras ferramentas de análise de causa-raiz.

  9.3 Análise de eficácia de tarefa. O operador deve realizar análises rotineiramente, de
  forma

  a determinar a aplicabilidade e a eficácia das tarefas contidas na programação de

  manutenção. Isso em adição à análise da tarefa e dados operacionais relacionados,

  cumprida durante a otimização. A evolução da programação de manutenção não consiste

  apenas em aumentar intervalos de tarefas específicas, mas sim em substanciar o

  cumprimento de uma tarefa eficaz no intervalo apropriado, sem comprometer a segurança

  nem impactar negativamente o desempenho operacional além do aceitável.'
