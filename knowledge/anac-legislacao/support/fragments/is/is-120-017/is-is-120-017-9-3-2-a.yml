cite: 9.3.2(a)
title: 9.3.2(a)
text: 'a) o processo de seleção de conjunto de dados que reflita a composição da frota deve

  considerar os seguintes critérios:

  I - histórico operacional;

  II - diferenças nas configurações;

  III - tempo decorrido desde grandes conversões ou recondicionamentos;

  IV - diferenças de utilização;Data de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X

  V - aeronaves de alta utilização de horas e ciclos e aeronaves de baixa

  utilização;

  VI - sazonalidade e condições ambientais;

  VII - longos períodos de estocagem; e

  VIII - rendimento da tarefa;

  Nota: aeronaves que não atendam padrões mínimos de rendimento de tarefas

  não devem ser incluídas na amostragem aleatória. Não conformidades

  identificadas em tarefas de manutenção programada realizadas com rendimento

  de tarefa menor podem ser indicadores de que o intervalo publicado está muito

  alto. Mais análise será requerida, incluindo a análise de dados em serviço

  relacionados.'
