text: '9.3.2 Amostragem de dados. Em cumprimento com as obrigações do Sistema de Análise e

  Supervisão Continuada (SASC) para determinação da eficácia da programação de

  manutenção do operador, conforme o RBAC nº 121, seção 121.373, 100% de seus dados

  de padrões de desempenho são coletados e analisados. Por causa desde requisito do SASC,

  o conceito de amostragem pode ser aplicado como uma ferramenta eficaz e eficiente

  quando analisando outros tipos e conjuntos de dados em suporte aos requisitos do

  programa. A amostragem de dados permite ao operador analisar e definir uma porção

  determinada de dados a partir de um conjunto de dados relevantes, ao invés de analisar a

  quantidade inteira de dados que possam estar disponíveis. Assim como em qualquer

  processo eficaz de análise de dados, a Anac requer que o operador colete e analise tipos
  de

  dados adicionais e/ou conjuntos de dados diferentes, conforme requerido pelas

  circunstâncias.

  Durante a execução dos requisitos do SASC, especificamente no contexto de amostragem

  de dados, o operador encontrará variáveis nas quais diferenças nos seguintes aspectos serão

  significativas, como por exemplo:'
