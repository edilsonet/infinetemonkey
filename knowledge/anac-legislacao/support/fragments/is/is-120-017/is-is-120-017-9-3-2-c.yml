cite: 9.3.2(c)
title: 9.3.2(c)
text: 'c) dependendo da tarefa sendo analisada, seu método de amostragem deve permitir

  flexibilidade para contabilizar benefícios da análise de tarefas executadas repetitivamente

  em aeronaves específicas, em comparação com a análise de tarefas executadas uma vez

  num número maior de aeronaves. Conforme descrito acima, a coleta de dados adicionais

  e/ou conjuntos diferentes de dados pode ser necessária.'
