cite: 9.3.2(d)
title: 9.3.2(d)
text: 'd) empregar pessoal qualificado para realizar estas funções, assegurando resultados

  consistentes.

  Nota: competências de pessoal são discutidas no parágrafo 6.1.4 desta IS e na AC 120-79

  da FAA, Developing and Implementing an Air Carrier Continuing Analysis and

  Surveillance System, Capítulo 6, Personnel Who Perform CASS Functions; e na IS nº 120-

  16, Manutenção realizada por empresas de transporte aéreo, item 7.11, Treinamento de

  Pessoal.

  Independentemente do método empregado para determinar seus requisitos de dados

  amostrais, o processo de amostragem deve resultar em confiança de que os dados amostrais

  são aplicáveis e representativos da população. O processo de amostragem deve considerar

  dados fornecidos por pontos fora da curva em sua população, de modo a evitar a

  possibilidade de que uma decisão seja inapropriadamente influenciada por dados que se

  encontram nos extremos do conjunto de dados do operador. O conteúdo abaixo é

  apresentado apenas como mera referência, sem a intenção de sugerir qualquer método

  específico aqui citado como método ou fórmula recomendado para se determinar o

  tamanho amostral em todas as situações.'
