text: 'g) outras ferramentas em métodos e ferramentas de análise:

  I - aquelas desenvolvidas para prever falhas ou desempenho futuro; e

  II - aquelas desenvolvidas para monitorar desempenho em tempo real.

  Devido a essas variações e à ampla variedade de ferramentas de análise que se pode

  escolher empregar, não é possível apresentar detalhes prescritivos nesta IS ou critérios
  para

  aplicação na determinação de quais tipos e conjuntos de dados se devem coletar e analisar,

  nem os conjuntos de dados amostrais ou métodos de análise que se deve utilizar.

