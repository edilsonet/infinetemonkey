  Revisão AX

  X

  aplicação na determinação de quais tipos e conjuntos de dados se devem coletar e analisar,

  nem os conjuntos de dados amostrais ou métodos de análise que se deve utilizar.

  No caso específico de amostragem de dados não é possível, da mesma forma, prover um

  método de amostragem que sirva para todos, nem fórmula que seja eficaz para todo tipo de

  dados ou método de análise disponível. Não se deve tentar definir ou confiar em apenas um

  método ou fórmula que estabeleça um tamanho amostral para ser usada em todos os casos.

  O operador deve responder às necessidades da análise sendo realizada e quaisquer análises

  adicionais conforme discutido acima. Assim, o operador deve desenvolver e executar seus

  próprios processos e métodos, incluindo seus métodos amostrais, de forma a ser ágil o

  suficiente para responder a dados específicos e necessidades de análise de cada situação.

