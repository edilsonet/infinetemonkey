cite: 9.3.4(b)
title: 9.3.4(b)
text: 'b) estruturas que:

  I - afetam a aeronavegabilidade ou a segurança em solo ou em voo;

  II - têm defeitos reportáveis sob o sistema de dificuldades em serviço;

  III - têm corrosão de Nível 2; e

  IV - têm corrosão de Nível 1 encontrada em intervalo distinto daquele de sua

  manutenção programada.

  Não conformidade não significativa. Uma não conformidade não significativa é um

  defeito de manutenção considerado diretamente relacionado com a tarefa sendo analisada e

  que não indica uma falha funcional, ou degradação ou desgaste significativo, e que não se

  enquadro numa categoria exemplo de não conformidade significativa (por exemplo,

  corrosão de Nível 1 identificada no intervalo de sua manutenção programada).

  Dependendo do risco, estas podem ou não requerer atenção primária da análise.'
