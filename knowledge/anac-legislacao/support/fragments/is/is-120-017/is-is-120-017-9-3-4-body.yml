title: Preparação de dados e considerações relacionadas. Dados operacionais tipicamente são
text: '9.3.4 Preparação de dados e considerações relacionadas. Dados operacionais tipicamente
  são

  coletados e codificados consistentemente de forma que a correlação com uma tarefa da

  programação de manutenção é evidente para a análise ou para os engenheiros realizando a

  análise (ver parágrafo 7.3). Para assegurar abrangência e relevância dos dados na execução

  da análise o operador deve se assegurar de que todas as não conformidades nos dados são

  diretamente relacionadas com a tarefa sendo analisada.

  Dados relacionados. Dados relacionados consistem em defeitos de manutenção

  descobertos durante manutenção programada ou não programada, para os quais a ação

  corretiva está diretamente associada com a tarefa sendo analisada ou com a consequência

  de sua falha funcional.

  Dados não relacionados. Dados não relacionados consistem em defeitos de manutenção

  descobertos durante manutenção programada ou não programada, para os quais a ação

  corretiva não está diretamente associada com a tarefa sendo analisada ou com a

  consequência de sua falha funcional. Dependendo do risco, pode ser necessário investigar

  não conformidades de dados não relacionados separadamente da avaliação da tarefa ou

  intervalo especificado.

  Nota: não conformidades que, de outra forma, seriam consideradas significativas,

  conforme definido abaixo, devem ser cuidadosamente investigadas para se determinar a

  eficácia geral do programa.

  Não conformidade significativa. Uma não conformidade significativa é um registro de

  manutenção considerado diretamente relacionado com a tarefa sendo analisada e que

  indica que uma falha funcional ou degradação ou desgaste significativo tenha ocorrido.

  Estas requerem atenção primária da análise. Exemplos de não conformidades significativas

  incluem:Data de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X'
