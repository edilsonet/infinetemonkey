title: Sumário de dados. Cada ajuste de intervalo deve incluir um sumário dos dados que foram
text: '9.3.5 Sumário de dados. Cada ajuste de intervalo deve incluir um sumário dos dados
  que foram

  utilizados na análise. Dados relevantes, precisos e em quantidade suficiente constituem
  a

  fundação dos padrões de um operador para determinar as limitações de tempo de sua

  manutenção programada. Este sumário de dados deve demonstrar que os processos e

  procedimentos do programa de confiabilidade do operador foram seguidos no que tange a

  seleção de dados.'
