  Tabela 9-1. Fontes de dados por tipos de tarefa

  1 A fonte de dados primária para tarefas de sistemas e grupo motopropulsor (excluindo-se
  tarefas FEC 8 e 9) consiste

  nos dados de confiabilidade operacional do operador. A eficácia dessas tarefas é medida
  pela capacidade da tarefa da

  programação de manutenção de detectar e corrigir defeitos no sistema antes que eles impactem
  o ambiente operacional.

  2 É importante observar que, já que falhas associadas com essas tarefas normalmente são
  encontradas durante a

  execução de tarefas de rotina, estes dados podem não ser capturados como parte dos elementos
  de dados normais de

  confiabilidade do operador. Portanto, faz-se necessário algum meio para capturar estas falhas
  para análise.

  3 Apenas para aquelas tarefas em que falhas seriam evidentes à tripulação ou ao pessoal
  da manutenção, e que seriam

  registradas nos dados operacionais (como logbook ou livro técnico da aeronave).

  4 Inclui qualquer dano (trincas por fadiga ou corrosão), tendo sido descoberta ou não como
  resultado de uma tarefa de

  manutenção programada.Data de emissão: 20 de março de 2025 IS nº 120-017

