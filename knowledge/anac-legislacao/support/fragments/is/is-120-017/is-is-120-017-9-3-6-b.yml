text: 'b) fontes de dados secundários devem ser usadas para basear melhor ou validar conclusões

  de análises, ou quando mais investigação é requerida. Estes dados não devem ser utilizados

  como única fonte para se determinarem limitações de tempo de uma tarefa. Operadores

  podem identificar fontes adicionais de dados para análise.Data de emissão: 20 de março de
  2025 IS nº 120-017

