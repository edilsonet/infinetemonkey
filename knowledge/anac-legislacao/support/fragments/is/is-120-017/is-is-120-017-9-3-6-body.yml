text: '9.3.6 Avaliação de fontes de dados. A Tabela 9-1, Fontes de Dados por Tipo de Tarefas,

  contém fontes de dados recomendados que o operador pode usar na análise para determinar

  limitações de tempo para tarefas da programação de manutenção. Os dados são divididos

  em fontes primária e secundária:'
