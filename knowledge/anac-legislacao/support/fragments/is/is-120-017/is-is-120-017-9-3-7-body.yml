title: Processo de análise. Uma vez que o operador identificou e obteve os dados, ele deve
text: '9.3.7 Processo de análise. Uma vez que o operador identificou e obteve os dados, ele
  deve

  analisá-los de forma a substanciar ajuste de intervalo ou revisão da tarefa. Para realizar
  o

  nível correto da análise, o operador deve desenvolver lógica de decisão padronizada

  baseada no tipo de tarefa e dados sendo analisados. A análise deve ser realizada por

  pessoal capacitado e apropriadamente treinado. Para exemplos dessa lógica de decisão ver

  apêndices desta IS.'
