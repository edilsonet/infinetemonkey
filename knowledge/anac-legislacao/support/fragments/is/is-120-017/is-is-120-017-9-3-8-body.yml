title: Resultado da análise. Se a análise demonstra que o impacto nas operações para um dado
text: '9.3.8 Resultado da análise. Se a análise demonstra que o impacto nas operações para
  um dado

  sistema é baixo, a tarefa pode ser considerada eficaz, independentemente do número de

  não conformidades identificadas na manutenção programada. Por outro lado, um alto grau

  de impacto operacional poderia indicar uma tarefa ineficaz, mesmo se o número de não

  conformidades identificadas na manutenção programada seja baixo. Outras combinações

  também são possíveis. A Tabela 9-2, Revisão de tarefas de sistemas e grupo

  motopropulsor, apresenta exemplos de situações que podem ser identificadas durante a

  análise. Esta tabela é relativa, sendo que conclusões devem se basear na especificidade
  de

  suas operações. A tabela não é definitiva ou exaustiva, visando apenas prover orientação

  aos operadores quanto à avaliação de tarefas e não conformidades. A existência de não

  conformidade na manutenção programada, por si mesma, não é um indicativo de programa

  ineficaz.

