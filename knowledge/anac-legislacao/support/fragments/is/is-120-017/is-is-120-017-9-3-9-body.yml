text: '9.3.9 Padrões de dados. O operador deve desenvolver um padrão sobre como irá coletar,

  validar, exibir e arquivar dados de tarefas, junto com os resultados de quaisquer análises

  realizadas, incluindo as conclusões e recomendações consideradas no processo de

  aprovação interna. Deve também considerar adicionar uma seção de tarefas com ênfase

  especial em seu Sumário de Dados, que contenha informação relacionada a certas tarefas

  que requeiram análise ou consideração especial, como:'
