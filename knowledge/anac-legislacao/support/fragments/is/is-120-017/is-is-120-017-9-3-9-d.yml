title: 9.3.9(d)
text: 'd) tarefas Lightning/High Intensity Radiated Field (L/HIRF).

  9.4 Recomendações. Espera-se que o operador investigue e desenvolva recomendações

  baseadas em risco (as quais podem incluir recomendações de “não ação”) em resposta a

  variações de um padrão de desempenho. Os resultados da investigação, incluindo os dados

  coletados e analisados, causa(s)-raiz, a avaliação de risco, e recomendações de ações,

  devem estar documentados e armazenados.'
