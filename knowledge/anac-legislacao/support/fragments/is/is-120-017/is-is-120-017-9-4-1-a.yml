title: 9.4.1(a)
text: 'a) escalonar (aumento) ou desescalonar (diminuição) o intervalo atual da programação
  de

  manutenção;

  Nota 1: O operador não pode escalonar Itens de Limitações de Aeronavegabilidade

  (Airworthiness Limitation Items - ALI) usando seu programa de confiabilidade.

  Nota 2: Exceto como apresentado na Seção de Limitações de Aeronavegabilidade

  (Airworthiness Limitation Section - ALS) operadores não podem escalonar tarefas que são

  “marcadas”, ou de outra forma identificadas, como uma tarefa CMR (Certification

  Maintenance Requirement) além do intervalo do System Safety Assessment (SSA).

  Referência na AC 25-19 da FAA, Certification Maintenance Requirements.'
