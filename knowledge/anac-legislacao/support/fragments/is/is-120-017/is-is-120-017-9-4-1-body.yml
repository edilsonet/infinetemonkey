text: '9.4.1 Ações Recomendadas de Programação de Manutenção. Ver Apêndice B, Ajustes em

  Tarefa/Intervalo - Diagrama de Alto Nível. O propósito de um programa de confiabilidade

  é de permitir a um operador desenvolver meios para determinar limitações de tempo

  eficazes, de forma a subsidiar alterações de limitações de tempo em sua programação de

  manutenção e aceitação da Anac. A menos que restrito de outra forma, uma proposta de

  validade da programação de manutenção poderia incluir:'
