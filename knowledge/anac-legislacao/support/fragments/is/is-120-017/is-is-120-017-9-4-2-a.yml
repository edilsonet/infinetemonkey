title: 9.4.2(a)
text: 'a) mudanças em outros elementos do Programa de Manutenção de Aeronavegabilidade

  Continuada (PMAC):

  I - responsabilidade pela aeronavegabilidade;

  II - Manual Geral de Manutenção (MGM);

  III - estrutura de manutenção do operador;

  IV - execução e aprovação de manutenção e alterações;

  V - programação de manutenção;

  VI - Itens de Inspeções Obrigatórias (IIO);

  VII - sistema de armazenamento de registros de manutenção;

  VIII - manutenção subcontratada;

  IX - treinamento de pessoal; e

  X - SASC;'
