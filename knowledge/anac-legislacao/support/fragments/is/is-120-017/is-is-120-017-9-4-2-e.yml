  10 ALTERAÇÕES NA PROGRAMAÇÃO DE MANUTENÇÃO - APROVAÇÃO

  INTERNA E IMPLEMENTAÇÃO

  10.1 Processo de aprovação. Em adição aos dados de comprovação apropriados, o processo de

  ajuste da programação de manutenção do operador deve definir procedimentos de

  aprovação interna e de implementação. Um plano de aprovação deve compreender

  procedimentos que se iniciem pela revisão apropriada e emissão de uma recomendação

  pelo pessoal com autoridade e responsabilidade pelo programa de confiabilidade. O

  pessoal responsável pela implementação das alterações deve estar identificado e definido.

