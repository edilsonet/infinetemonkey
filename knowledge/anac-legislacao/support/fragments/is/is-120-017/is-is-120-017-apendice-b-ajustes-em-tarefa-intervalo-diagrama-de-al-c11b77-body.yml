text: 'APÊNDICE B - AJUSTES EM TAREFA/INTERVALO - DIAGRAMA DE ALTO NÍVEL

  Notas:

  1. Instruções de Aeronavegabilidade Continuada (Instructions for Continued Airworthiness
  - ICA) derivadas de

  Certificado Suplementar de Tipo (CST) não devem ser tratadas diferentemente de qualquer
  outra tarefa, a menos

  que os documentos da ICA do detentor do CST forneçam instruções específicas para gerenciamento
  de intervalos.

  Coordenar com detentores do CST, apresentando feedback do desempenho do produto durante
  iniciativas de análise

  associadas a estes projetos, é uma boa prática para os operadores.

  2. Exemplos incluem: Diretriz de Aeronavegabilidade (DA), Certification Maintenance Requirements
  (CMR),

  airworthiness limitation item (ALI), tarefas de limitações de aeronavegabilidade (airworthiness
  limitation - AL),

  tarefas fuel tank safety (FTS), tarefas com Failure Effect Category (FEC) 5 ou 8 indicadas
  como associadas a CMR,

  etc.

  3. Os operadores não devem contar exclusivamente com a classificação de códigos FEC do detentor
  do projeto de tipo.

  A compreensão das funções sob análise e consequências associadas à falha funcional é benéfica.'
