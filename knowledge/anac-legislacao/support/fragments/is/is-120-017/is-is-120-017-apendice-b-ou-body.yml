text: 'Apêndice B; ou

  outro processo

  de análise

  definido.

  Com base no risco, determine o

  conjunto de dados e análises

  necessários para avaliar a

  alteração proposta.

  A análise

  substancia a

  revisão ou

  exclusão da

  tarefa?

  O impacto

  previsto é

  aceitável?

  Nota 1. Esta lógica de decisão se

  aplica a tarefas desenvolvidas e

  implementadas pelo operador,

  como:

  a. Tarefas que suportam

  outras tarefas;

  b. Tarefas de suporte

  administrativo;

  c. Objetivos de marca e

  imagem; e

  d. Padrões de aparência e

  limpeza de cabine estabelecidos

  pelo operador.

  Sim

  Não

  Não

  Sim

