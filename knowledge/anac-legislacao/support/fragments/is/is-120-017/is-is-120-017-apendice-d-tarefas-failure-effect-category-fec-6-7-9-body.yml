text: 'APÊNDICE D - TAREFAS FAILURE EFFECT CATEGORY (FEC) 6/7/9

  Assegure-se de que o critério de seleção de dados confere com as

  orientações presentes nesta IS (ou conforme aceito pela Anac).

  A tarefa

  ainda é

  aplicável e

  eficaz?1

  Seria praticável

  aplicar um

  intervalo

  revisado para

  um subconjunto

  da frota para

  amostragem?

  O impacto

  previsto no

  desempenho

  operacional é

  aceitável?

  A análise

  substancia um

  intervalo revisado

  para a tarefa e

  continua eficaz? 2

  Com base no risco,

  programe uma

  análise de

  acompanhamento

  para validar se a

  tarefa permaneceu

  eficaz após a

  implementação.

  Fim

  Tarefa FEC 6/7/9

  A tarefa é

  de

  lubrificação

  ou de filtro?

  Apêndice

  E

  Submeta a

  programação de

  manutenção

  revisada para

  aceitação da

  Anac.

  Verificar classificação de código FEC correto (MRBR)

  Entrar em

  contato com o

  detentor do

  projeto de tipo se

  o código FEC for

  considerado

  incorreto.

  Considere'
