title: APÊNDICE H - TAREFAS LIGHTNING/HIGH INTENSITY RADIATED FIELDS (L/HIRF)
text: 'APÊNDICE H - TAREFAS LIGHTNING/HIGH INTENSITY RADIATED FIELDS (L/HIRF)

  Tarefas L/HIRF 1

  Assegure-se de que as

  regras da ICA do detentor

  do projeto de tipo são

  seguidas, se aplicável.

  Realize a análise dos dados apropriados. 2

  Revise o

  escopo, tipo

  e/ou o

  intervalo da

  tarefa.

  Submeta a

  programação de

  manutenção

  revisada para

  aceitação da Anac.

  Fim

  Revise as regras

  da ICA do

  detentor do

  projeto de tipo.

  Assegure-se de que os critérios de

  seleção de dados atendem as

  orientações presentes IS, ou conforme

  aceito pela Anac).

  A análise substancia

  uma revisão de

  intervalo de tarefa

  e/ou de escopo que

  mantenha níveis

  aceitáveis de

  proteção L/HIRF?

  Não

  SimData de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X

  Nota 1. Recomenda-se coordenação com o fabricante. A proteção L/HIRF pode incluir:

  a. Cabos, blindagem, cintas de ligação, trilhas entre conectores.

  b. Proteção L/HIRF dentro dos conduítes, de isolantes térmicos ou outras coberturas.

  c. Estrutura não metálica com malha condutora e/ou revestimento antiestática.

  Nota 2. A análise deve considerar:

  a. O ambiente e efeitos de produtos corrosivos, condensação, temperatura e vibração na

  proteção.

  b. Suscetibilidade a dano durante a manutenção ou operações (por exemplo, onde conectores

  podem ser pisados, ou efeitos de fluidos descongelantes em conectores durante operações
  de

  inverno).

  c. Não conformidades identificadas em manutenção programada associadas com alças de

  ligação, lightning wicks, ligação de cablagem e conectores em chapa de tanque, etc.Data
  de emissão: 20 de março de 2025 IS nº 120-017

  Revisão AX

  X'
