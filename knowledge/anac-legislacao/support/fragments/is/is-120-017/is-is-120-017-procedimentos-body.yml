  Nota 1.

  a. Considere estruturas, sistemas e instalações na zona em questão para assegurar que a

  degradação não intencional ou perda de função não irão ocorrer.

  b. Deve ser mantida rastreabilidade de revisões de instruções de aeronavegabilidade continuada

  (ICA) aprovadas de electrical wiring interconnection system (EWIS) para inclusão de tarefa,

  intervalos, procedimentos, proteções e cuidados.

  c. Operadores devem aplicar quaisquer procedimentos adicionais ou restrições baseadas em
  seus

  requisitos de documentação de conformidade, conforme aplicável.

  d. [Reservado]

  Nota 2. Exemplo:

  Algumas tarefas zonais podem satisfazer parcialmente requisitos de tolerância a dano, as
  quais

  devem ser executadas em limites originalmente estabelecidos após determinado limiar de fadiga.

  Intervalos podem ser escalonados antes deste limiar, mas devem ser ajustados aos níveis
  originais

  no limiar.

  Nota 3.

  a. Relativo ao modo de falha visado e intenção original.

  b. Referência no MSG-3, seção 2-3-7.1 (Tabela 2-3-7.1, Criteria for Task Selection) para

  orientações quanto à aplicabilidade e eficácia de segurança.

  Nota 4. Esta avaliação não necessariamente inclui o conceito de medição da contaminação
  ou de

  taxas de acumulação na prática. Entretanto, cada ajuste de tarefa deve ser suficientemente

  substanciado, o que inclui se a os resultados desejados continuarão a ser atingidos no intervalo

  revisado. Referência nas AC 25-27, AC 120-94, e AC 120-102 da FAA para informações adicionais

  sobre contaminantes.

  Nota 5. A proteção de Lightning/High Intensity Radiated Fields (L/HIRF) pode incluir:

  a. Cabos, blindagem, cintas de ligação, trilhas entre conectores.

  b. Proteção L/HIRF dentro de conduítes, de isolantes térmicos ou outras coberturas.

  c. Estrutura não metálica com malha condutora e/ou revestimento antiestática.

  Nota 6. Considere:

  a. O ambiente e efeitos de produtos corrosivos, condensação, temperatura e vibração na

  proteção.

  b. Suscetibilidade aumentada ao dano durante manutenção ou operações (por exemplo, onde

  conectores podem ser pisados, ou efeitos de fluidos descongelantes em conectores durante

  operações de inverno).

  Nota 7. A consciência destas relações contribui com uma análise de qualidade. Zonal working

  groups podem ter modificado intervalos zonais para acomodar essas interfaces.

  Nota 8.

  a. Por exemplo, não conformidades associadas com alças de ligação, lightning wicks, ligação
  de

  cablagem e conectores em chapa de tanque, etc.

  b. Assegure-se de que consequências não intencionais, como deterioração ambiental

  (Environmental Deterioration - ED) ou Dano Acidental, não sejam introduzidos devido à

  frequência do acesso e saída.Data de emissão: 20 de março de 2025 IS nº 120-017

