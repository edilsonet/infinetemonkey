section_title: 'Em termos de estrutura, o volume principal do guia de rota deve conter pelo
  menos:'
subsection_id: e
cite: 5.1.1.2(e)
title: 5.1.1.2(e)
text: 'e) lista de páginas efetivas: lista com todas as páginas do guia de rota, associadas
  à revisão em que se encontram, permitindo o controle da revisão atual de cada página.

  5.1.1.3 O volume principal do guia de rota deve possuir uma composição e um sistema de numeração
  de páginas que facilite revisões. Assim, o operador deve estruturar seu sistema de numeração
  de páginas de forma que a inclusão ou alteração de um determinado conteúdo afete o menor
  número possível de páginas.

  5.1.1.4 Todas as páginas do volume principal do guia de rota devem ser unicamente identificadas
  (por números, letras ou combinações destes) e conter o nome do operador, o número e a data
  da revisão referente à última alteração da própria página.'
