text: '5.1.1 Estrutura do guia de rota

  5.1.1.1 O guia de rota é composto por um volume principal, desenvolvido pelo operador, que
  pode ser complementado por publicações produzidas por outras organizações (governamentais
  ou comerciais) ou por trechos de outros manuais publicados pelo operador.'
