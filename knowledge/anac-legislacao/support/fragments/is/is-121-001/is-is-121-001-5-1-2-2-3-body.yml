text: '5.1.2.2.3 sistema de revisão: deve ser descrito o sistema de revisão do guia de rota
  e devem ser definidos os responsáveis pela atualização do conteúdo.

  5.1.2.2.3.1 O sistema de revisão do guia de rota deve atender à estrutura de revisões estabelecida
  no parágrafo 5.2 desta IS. Caso o operador utilize revisões temporárias, além da estrutura
  de revisões estabelecida nesta IS, ele deve descrever as situações às quais se aplica uma
  revisão temporária, os métodos específicos de atualização do conteúdo e de distribuição
  da revisão temporária.

  5.1.2.2.3.2 Os responsáveis pela atualização do conteúdo incluem:'
