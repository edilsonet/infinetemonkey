text: '5.1.2.2.5 a apresentação sobre como as informações dos aeródromos e rotas estão dispostas
  no guia de rota.

  5.1.2.3 Aeródromos. O guia de rota deve conter as seguintes informações sobre todos os aeródromos
  (regulares ou não) utilizados nas operações do operador, incluindo os aeródromos de alternativa
  (de destino, ETOPS e utilizados nas rotas com planejamento de redespacho) e os aeródromos
  adequados (conforme definido na IS nº 121-012).

  Nota: essas informações atendem parcialmente ao requerido pelas seções 121.97 (para operações
  regulares) e 121.117 (para operações não regulares) do RBAC nº 121, devendo ser complementadas
  por informações de caráter temporário, como as divulgadas por NOTAM.

  5.1.2.3.1 Lista com os aeródromos regulares e de alternativa (destino, ETOPS e redespacho)
  utilizados em operações regulares, em conformidade com as orientações constantes no Apêndice
  B sobre a construção, manutenção e distribuição da lista.'
