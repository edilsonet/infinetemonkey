title: 5.1.2.3.7(b)
text: b) procedimentos de contingência, incluindo casos de falha de motor na decolagem (requerido
  quando obstáculos impedem a execução dos procedimentos normais cumprindo-se os requisitos
  de desempenho com um motor inoperante - subparte I do RBAC nº 121). Inclui, por exemplo,
  a situação em que os obstáculos limitariam o peso de decolagem em razão dos requisitos de
  desempenho com um motor inoperante, mas o desenvolvimento de procedimento de contingência
  ameniza ou retira esta limitação no peso de decolagem);
