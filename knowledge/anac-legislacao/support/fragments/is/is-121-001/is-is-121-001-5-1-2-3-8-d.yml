text: 'd) mínimos em caso de deterioração de instalações do aeródromo.

  5.1.2.3.9 Serviços disponíveis no aeródromo ou, especificamente, os serviços contratados
  pelo operador no aeródromo, incluindo combustível, handling, serviços de degelo/antigelo.

  5.1.2.3.10 Aviões utilizados no aeródromo, os procedimentos específicos para utilização
  do aeródromo e as limitações operacionais associadas a cada modelo (incluindo peso máximo
  de operação e outras restrições, de acordo com análise de pista).

  5.1.2.3.11 Riscos específicos para operação no aeródromo, como pássaros, operação de pequenas
  aeronaves, helicópteros, aeronaves em instrução, balões em determinado período do ano, pista
  escorregadia, etc.

  Nota: esse conteúdo normalmente possui relação com o SGSO do operador, podendo ser alimentado
  por reportes de situações observadas pelos tripulantes ou funcionários das estações de linha
  do operador.

