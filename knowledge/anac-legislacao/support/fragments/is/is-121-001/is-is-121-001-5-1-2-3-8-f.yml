title: 5.1.2.3.8(f)
text: 'f) seleções de aeródromos de alternativa mais distantes (de acordo com situação meteorológica
  usual no entorno do aeródromo).

  5.1.2.3.11.2 Quando requerida para a operação específica (por exemplo, para algumas operações
  RNP AR APCH), o operador deve incluir o FOSA no guia de rota.

  5.1.2.3.12 Qualificações especiais requeridas para operação no aeródromo, de acordo com
  a seção 121.445 do RBAC nº 121 (por exemplo, a exigência de concluir treinamentos específicos
  para operação nos aeroportos de Congonhas (IAC 121-1013) e Santos Dumont (IAC 3130)).'
