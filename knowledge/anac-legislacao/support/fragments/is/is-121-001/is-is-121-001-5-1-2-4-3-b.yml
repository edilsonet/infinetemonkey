section_title: 'para as rotas com planejamento de redespacho em voo, rotas ETOPS, rotas sobre
  terrenos montanhosos (como os Andes) ou sobre grandes extensões d’água:'
subsection_id: b
cite: 5.1.2.4.3(b)
title: 5.1.2.4.3(b)
text: b) para rotas sobre terrenos montanhosos, deve se incluir procedimentos de drift-down,
  incluindo auxílios de navegação utilizados para execução desses procedimentos. Esses auxílios
  devem ser verificados antes do início do voo, para se assegurar de que estão operacionais;
