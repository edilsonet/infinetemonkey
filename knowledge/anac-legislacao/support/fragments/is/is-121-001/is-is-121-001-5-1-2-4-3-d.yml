section_title: 'para as rotas com planejamento de redespacho em voo, rotas ETOPS, rotas sobre
  terrenos montanhosos (como os Andes) ou sobre grandes extensões d’água:'
subsection_id: d
cite: 5.1.2.4.3(d)
title: 5.1.2.4.3(d)
text: 'd) equipamentos de comunicação ou de navegação específicos.

  5.1.2.4.3.1 O operador deve especificar quais são as rotas em que utiliza planejamento de
  redespacho em voo, as rotas ETOPS, as rotas sobre terrenos montanhosos (como os Andes) e
  as rotas sobre grandes extensões d’água.

  5.1.2.4.3.2 O operador pode, a seu critério, incluir as informações do parágrafo 5.1.2.4.3
  desta IS para outras rotas consideradas críticas, como quaisquer outras rotas que exijam
  detalhamento de procedimentos específicos em casos de contingência, como falhas de motor
  ou despressurização.'
