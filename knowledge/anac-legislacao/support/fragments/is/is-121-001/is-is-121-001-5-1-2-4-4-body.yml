title: 'Informações meteorológicas. O guia de rota deve conter, para cada aeródromo ou área
  de operação:'
text: '5.1.2.4.4 Informações meteorológicas. O guia de rota deve conter, para cada aeródromo
  ou área de operação:

  5.1.2.4.5 as fontes de informação meteorológica utilizadas pelo operador, de acordo com
  a seção 121.101 e o parágrafo 121.687(b) do RBAC nº 121, para operações regulares; ou a
  seção 121.119 e o parágrafo 121.689(b) do RBAC nº 121, para operações não regulares.

  5.1.2.4.5.1 Para cada fonte, o guia de rota deve identificar a área de abrangência e os
  procedimentos específicos de consulta e interpretação dos dados;'
