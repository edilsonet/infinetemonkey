title: 5.1.2.5.2(c)
text: 'c) meio de verificar a validade das cartas. Uma lista de páginas efetivas da publicação
  contratada pelo operador, em conjunto com a informação da data da próxima atualização, permite
  essa verificação.

  5.1.2.6 Regras do ar e demais regras locais. O operador deve informar as particularidades
  para cada aeródromo ou área de operação (incluindo as áreas de sobrevoo e os aeródromos
  de alternativa), incluindo:

  5.1.2.6.1 requisitos de planos de voo ATS: indicação da utilização de plano de voo individual
  ou repetitivo e da responsabilidade pela notificação do plano de voo ao órgão responsável,
  bem como os procedimentos necessários a essa atividade;'
