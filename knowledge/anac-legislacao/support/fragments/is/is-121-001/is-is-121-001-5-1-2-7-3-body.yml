text: '5.1.2.7.3 O guia de rota deve incluir os procedimentos de comunicação para os tripulantes
  e demais empregados responsáveis pelo contato com as aeronaves.

  5.1.2.7.3.1 Os procedimentos gerais podem estar descritos em outros locais, devendo o guia
  de rota especificar as particularidades de cada área, rota ou aeródromo (por exemplo, rotas
  com planejamento de redespacho em voo, rotas ETOPS ou demais rotas mencionadas no parágrafo
  5.1.2.4.3 desta IS).

  5.1.2.7.3.2 Os procedimentos devem especificar:'
