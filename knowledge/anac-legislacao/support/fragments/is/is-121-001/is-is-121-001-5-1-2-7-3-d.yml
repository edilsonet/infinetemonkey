section_id: 5.1.2.7.3
section_title: O guia de rota deve incluir os procedimentos de comunicação para os tripulantes
  e demais empregados responsáveis pelo contato com as aeronaves.
subsection_id: d
cite: 5.1.2.7.3(d)
title: 5.1.2.7.3(d)
text: 'd) quais informações devem ser comunicadas ou solicitadas (tempo previsto de chegada,
  horário de partida, situação de manutenção ou de item MEL, solicitações especiais relativas
  a passageiros - como passageiros com necessidades especiais embarcando ou desembarcando
  e necessidade de ponte de embarque -, pedidos de informação sobre local de estacionamento
  no pátio, etc.).

  5.1.2.7.3.3 Os procedimentos devem incluir também as situações de falha de comunicação.'
