text: '5.1.2.9.2 os procedimentos para pilotos que observem um acidente ou que interceptem
  uma comunicação de socorro; e

  5.1.2.9.3 os sinais visuais terra-ar, a serem utilizados por sobreviventes de um acidente
  ou aterrisagem forçada. Os sinais padronizados no Apêndice do Anexo 12 à Convenção de Aviação
  Civil Internacional, publicado pela ICAO, são apresentados no Apêndice A desta IS. Caso
  haja variações na área de operação, estas devem ser incluídas no guia de rota.'
