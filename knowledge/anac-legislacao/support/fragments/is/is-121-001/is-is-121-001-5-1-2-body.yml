text: '5.1.2 Conteúdo do guia de rota

  5.1.2.1 O conceito de guia de rota abrange pelo menos os assuntos listados nesta subseção.
  O guia de rota do operador deve garantir que esse conteúdo é disponibilizado por completo
  aos empregados que utilizem tal informação, seja por meio do conteúdo desenvolvido pelo
  operador, constante no volume principal do guia de rota, seja em outros manuais do operador
  (desde que esses manuais sejam também analisados pela ANAC), seja em publicações produzidas
  por outras organizações que componham o guia de rota do operador.

  5.1.2.1.1 Caso o conteúdo esteja em outros manuais do operador ou em publicações de outras
  organizações, o volume principal do guia de rota deve indicar, por referência, o local específico
  onde tal informação pode ser encontrada.

  5.1.2.2 Administração do guia de rota. O guia deve incluir, em seu volume principal, informação
  sobre a administração do manual, abrangendo os seguintes assuntos:'
