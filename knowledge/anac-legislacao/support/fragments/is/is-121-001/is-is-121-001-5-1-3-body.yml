title: Relação com outros manuais e publicações
text: '5.1.3 Relação com outros manuais e publicações

  5.1.3.1 O operador deve garantir que seus manuais estejam alinhados entre si, de modo a
  formar um conjunto coeso e coerente de procedimentos. O operador pode estabelecer o procedimento
  padrão em um manual (no guia de rota ou em outros manuais) e estabelecer as particularidades
  para um aeródromo, uma rota ou uma área no guia de rota. Neste caso, o operador deve preparar
  seus manuais de forma a garantir que as particularidades aplicáveis serão seguidas, incluindo,
  por exemplo, referências entre os manuais.

  5.1.3.2 O operador deve estabelecer procedimentos de modo a garantir que as informações
  de NOTAM, mesmo que não incorporadas no guia de rota (em razão de sua natureza temporária),
  sejam levadas ao conhecimento dos tripulantes e despachantes e corretamente consideradas
  por eles no planejamento e na condução dos voos. O operador pode, a seu critério, incluir
  informações de NOTAMs de mais longa duração em seu guia de rota.

  5.2 Processos de revisão do guia de rota'
