cite: 5.2.4.1
title: O guia de rota deve ser enviado em formato digital.
text: '5.2.4.1 O guia de rota deve ser enviado em formato digital.

  5.2.4.2 Não é necessário incluir na documentação protocolada os arquivos das publicações
  produzidas por terceiros que componham o guia de rota, bastando a referência a estas publicações
  no volume principal do guia de rota.

  5.2.4.2.1 Na análise da revisão original e a cada alteração do fornecedor dessas publicações,
  o operador deve encaminhar os contratos (ou outras formas de acordo) que garantam o fornecimento
  dessas publicações.'
