text: '5.2.6.3 A qualquer tempo, a ANAC poderá solicitar ao operador o envio da última revisão
  de seu guia de rota.

  5.3 Utilização do guia de rota

  5.3.1 O guia de rota deve ser utilizado pela tripulação de voo para cada voo, nas etapas
  de planejamento e, quando necessário, para consulta em voo. Assim, o operador deve manter
  o guia de rota atualizado a bordo da aeronave, seja em formato físico (papel) ou em formato
  eletrônico, caso o operador tenha autorização para utilização de informação aeronáutica
  em formato digital. O operador também deve manter o guia de rota atualizado disponível para
  consulta dos tripulantes de voo em solo.

  5.3.2 O operador também deve manter uma cópia (física ou eletrônica) do guia de rota atualizado
  disponível para consulta em sua base de operações, nos setores responsáveis pelo despacho
  ou liberação de voo e de controle operacional.

  5.3.3 O guia de rota pode ser utilizado como ferramenta para o sistema de qualificação dos
  pilotos em comando para rotas e aeródromos, conforme requerido pelas seções 121.443 e 121.445
  do RBAC nº 121. No entanto, o guia de rota não é suficiente para a qualificação dos pilotos
  em comando, por não abranger todas as informações requeridas (como, por exemplo, as NOTAMs
  de interesse, conforme o parágrafo 121.443(b)(8)).'
