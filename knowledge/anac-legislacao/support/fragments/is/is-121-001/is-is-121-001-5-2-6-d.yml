cite: 5.2.6(d)
title: 5.2.6(d)
text: 'd) atualização das publicações produzidas por outras organizações.

  5.2.6.2 O conteúdo do guia de rota deve ser permanentemente atualizado pelo operador. Exceto
  nos casos previsto no parágrafo 5.2.5.1 desta IS, não é necessário que o operador submeta
  as revisões de conteúdo para análise da ANAC, bastando, para o operador poder utilizar a
  revisão atualizada, que elabore as revisões, obtenha aprovação do diretor/gerente de operações
  (responsável pela aprovação do guia de rota na estrutura do operador) e atualize as publicações
  disponibilizadas aos seus empregados. Não é emitido FOP 111 para as atualizações de conteúdo
  do guia de rota para alterações não identificadas no parágrafo 5.2.5.1 desta IS.

  Nota: no caso de alteração das informações da lista de aeródromos regulares e de alternativa,
  a alteração no guia de rota deve seguir o previsto no Apêndice B desta IS.'
