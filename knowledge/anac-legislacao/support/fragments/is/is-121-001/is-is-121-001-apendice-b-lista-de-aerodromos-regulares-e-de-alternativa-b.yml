title: apendice-b-lista-de-aerodromos-regulares-e-de-alternativa(b)
text: b) lista de aeródromos de alternativa utilizados pelo detentor de certificado em operações
  regulares, informando, para cada aeródromo, se o seu uso é para alternativa de destino,
  para alternativa ETOPS ou para planejamento de redespacho (seja como intermediário, seja
  como alternativa de intermediário), e ainda os modelos de aeronave autorizados. Ressalta-se
  que operações ETOPS ou com planejamento de redespacho demandam autorizações especiais que
  são emitidas por meio das especificações operativas;
