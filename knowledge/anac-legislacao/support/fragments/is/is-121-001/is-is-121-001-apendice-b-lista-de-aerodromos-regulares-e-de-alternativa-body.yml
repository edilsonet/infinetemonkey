text: 'APÊNDICE B - LISTA DE AERÓDROMOS REGULARES E DE ALTERNATIVA


  B1 Para cumprimento das seções 119.49(a)(4)(i) e 119.49(b)(4)(i) do RBAC nº 119, os detentores
  de certificado deverão manter atualizada no Guia de Rotas a listagem de aeródromos regulares
  e de alternativa utilizados em operações regulares (Lista de Aeródromos Regulares e de Alternativa)
  detalhando os modelos de aeronaves autorizados.

  B2 A Lista de Aeródromos Regulares e de Alternativa deve ser composta pelas seguintes informações:'
