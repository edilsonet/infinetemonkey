cite: apendice-b-lista-de-aerodromos-regulares-e-de-alternativa(d)
title: apendice-b-lista-de-aerodromos-regulares-e-de-alternativa(d)
text: 'd) declaração de que os aeródromos, seu uso e as aeronaves autorizadas cumprem com
  as exigências para sua inclusão na Lista de Aeródromos Regulares e de Alternativa, conforme
  estabelecidas no MGO (deve ser incluída referência a qual parte do MGO).

  B3 Aeródromos regulares não precisam ser informados como de alternativa para um mesmo modelo
  de aeronave.

  B4 Aeródromos regulares ou de alternativa não precisam ser informados como aeródromos adequados
  para um mesmo modelo de aeronave.

  B5 A tabela a seguir apresenta sugestão de formatos para apresentação da Lista de Aeródromos
  Regulares e de Alternativa no Guia de Rotas.

  Tabela B-1: Lista de aeródromos regulares e de alternativa

  Aeródromo

  Modelos de aeronave autorizados

  Aeródromo regular

  Aeródromo de alternativa

  Aeródromo adequado

  Destino

  ETOPS

  Redespacho

  SBBR

  737-7BX, 737-7EA, 737-8BK, 737-86J

  737-7BX, 737-7EA, 737-8BK, 737-86J


  SBCF

  737-7BX, 737-7EA, 737-8BK, 737-86J


  SBGL

  737-7BX, 737-7EA, A320-212, A320-232, 767-223


  SBPA

  737-7BX, 737-7EA, A320-212, A320-232, 767-223


  GVAC

  A330-243F

  767-223, A330-243F

  767-223, A330-243F


  KMIA

  767-223, A330-243F


  MDSD


  737-8BK, 737-86J


  B6 Caso o operador deixe de atender aos requisitos requeridos para um determinado aeródromo
  regular (por exemplo, deixar de ter pessoal treinado, ou possuir os equipamentos para controle
  de peso e dimensões de carga ou bagagem, etc.), esse aeródromo deve ser removido da Lista
  de Aeródromos Regulares e de Alternativa.

  B7 Caso um detentor de certificado não possua a Lista de Aeródromos Regulares e de Alternativa
  atualizada em seu Guia de Rotas estará sujeito às sanções administrativas previstas na Resolução
  ANAC nº 472/2018.'
