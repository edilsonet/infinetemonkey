title: Apêndice C - Controle de alterações
text: 'Apêndice C - Controle de alterações

  7DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 A alteração na numeração de revisões do guia de rota, conforme parágrafo 5.2.2 desta
  IS, deve ser aplicada a partir da primeira revisão que requeira aprovação, após a entrada
  em vigor da Revisão B desta IS.

  7.3 A alteração da lista de aeródromos regulares e de alternativa, para atendimento à Revisão
  C desta IS, deve ocorrer em até 90 dias após a entrada em vigor da Revisão C desta IS.'
