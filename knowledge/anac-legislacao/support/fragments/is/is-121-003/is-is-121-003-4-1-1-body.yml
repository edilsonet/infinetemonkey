text: '4.1.1 Ambiente de alta carga de trabalho. Qualquer ambiente em que as múltiplas demandas
  para a

  tripulação de voo exigem a priorização das funções de trabalho. Por exemplo, a operação
  IFR

  abaixo de 10.000 pés durante chegada ou partida de uma área terminal (incluindo os

  procedimentos de táxi) é considerada como um ambiente de alta carga de trabalho.'
