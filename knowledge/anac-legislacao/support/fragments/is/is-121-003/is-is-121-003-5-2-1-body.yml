title: Mesmo os procedimentos operacionais padronizados (SOP) sendo universalmente reconhecidos
text: '5.2.1 Mesmo os procedimentos operacionais padronizados (SOP) sendo universalmente reconhecidos

  como fundamentais para operações seguras na aviação, acidentes e incidentes continuam a
  ocorrer

  como um resultado direto das, ou relacionado às, falhas das tripulações em seguir os SOP,

  principalmente durante as fases críticas do voo.Data de emissão: 19 de janeiro de 2018 IS
  nº 121-003

  Revisão A'
