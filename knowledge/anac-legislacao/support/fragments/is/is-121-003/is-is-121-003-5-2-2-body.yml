text: '5.2.2 Esta Instrução Suplementar (IS) fornece orientação para o projeto, desenvolvimento,

  implementação, avaliação e atualização de SOP. Enfatiza, também, que os SOP devem ser claros,

  abrangentes e estar prontamente disponíveis na cabine de pilotos do avião em cada voo.'
