title: A coordenação efetiva da tripulação e o seu desempenho dependem do compartilhamento
  de um
text: '5.2.4 A coordenação efetiva da tripulação e o seu desempenho dependem do compartilhamento
  de um

  modelo mental de cada tarefa a ser desempenhada. Este modelo mental, por sua vez, é baseado

  em SOP. Os SOP visam a fornecer um modelo consistente e padronizado de cada tarefa que deve

  ser realizada por cada tripulante durante cada fase de voo e durante qualquer situação normal,

  anormal ou de emergência. Os SOP devem ser mantidos atualizados e podem ser desenvolvidos

  individualmente pelo operador ou incorporando os procedimentos encontrados nos manuais de

  operação de suas aeronaves em suas operações diárias. Uma vez estabelecidos, os SOP devem
  ser

  aplicados com consistência e uniformidade ao longo da operação.'
