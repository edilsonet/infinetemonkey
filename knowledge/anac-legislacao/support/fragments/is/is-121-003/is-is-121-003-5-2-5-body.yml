cite: 5.2.5
title: 'A implementação de qualquer procedimento SOP é mais eficaz quando:'
text: '5.2.5 A implementação de qualquer procedimento SOP é mais eficaz quando:

  1) o procedimento é apropriado para a situação;

  2) o procedimento é praticável;

  3) os membros da tripulação compreendem os motivos do procedimento;

  4) as funções de pilot flying (PF) e de pilot monitoring (PM) são claramente definidas;

  5) é feito um treinamento efetivo;

  6) a aderência ao padrão é enfatizada pelas tripulações e reforçada por instrutores,

  examinadores e gerentes; e

  7) os membros da tripulação estão cientes dos riscos / perigos potenciais se os SOP não

  forem seguidos.

  5.3 Determinando quando os procedimentos necessitam ser projetados ou modificados'
