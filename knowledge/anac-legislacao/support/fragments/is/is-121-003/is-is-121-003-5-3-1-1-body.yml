text: '5.3.1.1 Os operadores são obrigados a estabelecer procedimentos operacionais padronizados
  (SOP) de

  acordo com o parágrafo 121.135(b)(27) do RBAC nº 121. Embora um fabricante de equipamentos

  originais (Original Equipment Manufacturer - OEM) costumeiramente provenha seus operadores

  com procedimentos sugeridos e listas de verificação para o seu equipamento, é facultado
  aos

  operadores desenvolver ou modificar os procedimentos e listas de verificação fornecidos
  pelo

  OEM. Alguns dos procedimentos podem exigir uma "nenhuma objeção técnica" do OEM para

  que sejam modificados.'
