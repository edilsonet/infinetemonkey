text: '5.3.2.1.1 Procedimentos e listas de verificação publicados pelo OEM são concebidos
  para refletir o projeto

  e os procedimentos operacionais do equipamento deste fabricante. Estes promovem o uso ideal

  da aeronave, conforme previsto pelos projetistas, mas podem ser genéricos em suaData de
  emissão: 19 de janeiro de 2018 IS nº 121-003

