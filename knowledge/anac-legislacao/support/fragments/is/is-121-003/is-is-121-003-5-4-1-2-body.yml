title: 'Em geral, os bons procedimentos abrangem os seguintes elementos:'
text: '5.4.1.2 Em geral, os bons procedimentos abrangem os seguintes elementos:

  1) o que o procedimento é projetado para realizar;

  2) quando e em que condições o procedimento deve ser executado;

  3) quem é responsável por executar cada etapa no procedimento;

  4) como, em detalhes suficientes, o procedimento deve ser realizado; e

  5) como confirmar que o procedimento foi realizado corretamente.'
