title: Os desenvolvedores dos procedimentos devem pesquisar todas as fontes de informação
text: '5.4.3.2 Os desenvolvedores dos procedimentos devem pesquisar todas as fontes de informação

  disponíveis referentes ao processo ou procedimento a ser desenvolvido ou revisado. Isso
  pode

  incluir a revisão de dados do Sistema de Gerenciamento de Segurança Operacional (SGSO) ou

  de um Programa de acompanhamento e análise de dados de voo (PAADV). Os desenvolvedores

  de procedimentos também devem entender profundamente o sistema de procedimentos e como

  eles se enquadram nas políticas existentes e na orientação e filosofia operacional do

  operador. Qualquer novo processo ou procedimento deve ser consistente com esse quadro.Data
  de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A'
