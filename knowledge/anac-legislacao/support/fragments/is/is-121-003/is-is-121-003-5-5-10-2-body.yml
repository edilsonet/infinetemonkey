text: '5.5.10.2 Conteúdo dos avisos e cuidados. Cada aviso ou cuidado deve identificar um
  único perigo, as

  consequências do perigo e quaisquer limitações de tempo críticas. As ações a serem tomadas
  não

  devem aparecer nos indicativos de avisos ou precauções.'
