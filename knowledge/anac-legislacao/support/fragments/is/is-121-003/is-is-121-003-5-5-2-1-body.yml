text: '5.5.2.1 Organização Geral. Os procedimentos devem ser organizados da forma mais simples
  possível e

  na ordem de execução das tarefas. Normalmente os procedimentos normais são organizados em

  sequência por fase de voo. Procedimentos anormais e de emergência devem ser organizados
  pela

  condição de desencadeamento (por exemplo, fumaça na cabine) - e não pelo sistema

  potencialmente relacionado (por exemplo, sistema elétrico).'
