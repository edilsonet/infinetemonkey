text: '5.5.2.6 Índices. Um índice deve ser fornecido para cada manual de procedimento. Ao
  projetar o índice,

  certifique-se de que o formato reflete com precisão a filosofia e o treinamento aprovado
  do

  operador. Se um procedimento é identificado de mais de uma maneira (por exemplo, se houver

  várias indicações), deve-se incluir todos os parâmetros prováveis no índice.'
