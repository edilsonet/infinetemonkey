text: '5.5.3.1 Use palavras de forma consistente. O uso da palavra deve ser simples e consistente
  ao longo dos

  SOP. Se possível, evite criar novos termos. Use palavras em seu sentido usual, a menos que
  elas

  tenham um significado amplamente aceito na indústria da aviação. Faça correspondências às

  nomenclaturas utilizadas na cabine de pilotagem.'
