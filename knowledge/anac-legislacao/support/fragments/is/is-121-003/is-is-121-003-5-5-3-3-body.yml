title: Cuidado ao usar abreviações. Use somente abreviaturas que são definidas e comumente
  utilizadas
text: '5.5.3.3 Cuidado ao usar abreviações. Use somente abreviaturas que são definidas e comumente
  utilizadas

  na indústria (por exemplo: GPS, velocidade de referência (VREF), órgão de controle de tráfego

  aéreo (ATC)) e evite criar novas abreviaturas sempre que possível. Apenas abreviações que
  sejam

  bastante claras no ambiente operacional devem ser utilizadas.'
