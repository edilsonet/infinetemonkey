text: '5.5.5.1 Ao determinar como formatar procedimentos, devem ser considerados o propósito,
  o modo e as

  condições sob os quais os procedimentos exibidos serão utilizados. A apresentação dos

  procedimentos que se destinam a serem usados no solo, com disponibilidade de tempo e em
  forma

  impressa, pode diferir em formato da de procedimentos que serão lidos a partir de um computador

  em voo, durante turbulência, à noite ou sob pressão de tempo. A apresentação deve ser avaliada

  em condições que se aproximam daquelas sob as quais a exibição do procedimento poderá ser

  necessária.'
