text: '5.5.5.8 Comprimento da linha. Tradicionalmente, as listas de verificação foram formatadas
  para se

  assemelhar a um índice ou tabela de conteúdo com componentes correspondentes na mesma linha

  (por exemplo: Desafio / Resposta) justificados e ligados por pontos ou linhas. Este formato
  é

  aceitável; no entanto, devem ser evitadas grandes lacunas entre os itens. Quanto maior o
  espaço,

  maior será a possibilidade de o piloto inadvertidamente corresponder itens erroneamente.'
