text: '5.5.6.3 Marcadores e numeração. Use números, marcadores e linhas, conforme apropriado,
  para indicar

  o início de cada etapa. O uso de linhas numeradas pode reduzir erros de navegação e de

  localização no caso de ocorrer uma interrupção. As etapas numeradas também facilitam a

  navegação entre os procedimentos quando é necessário "IR PARA" uma etapa dentro de um

  procedimento.'
