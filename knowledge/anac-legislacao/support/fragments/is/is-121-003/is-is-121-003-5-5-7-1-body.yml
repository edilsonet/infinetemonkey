title: 'Cuidados e avisos (por exemplo: CAUTION, WARNING), palavras condicionais (por exemplo:'
text: '5.5.7.1 Cuidados e avisos (por exemplo: CAUTION, WARNING), palavras condicionais (por
  exemplo:

  SE, ENTÃO), e notas importantes (por exemplo, NOTA) ou eventos cronometrados devem ser

  enfatizadas. Itens irreversíveis devem ser enfatizados antes de a ação a ser tomada. Técnicas
  para

  chamar a atenção para certas palavras ou frases devem ser usadas com moderação, mas de forma

  consistente. O uso excessivo de ênfase reduz a sua eficácia e torna o procedimento difícil
  de

  ler. Técnicas para ênfase podem incluir:

  1) Tipográfica. Técnicas de digitação podem incluir negrito, itálico, sublinhado e caixa
  alta

  como elementos de ênfase;

  2) Gráfica. Técnicas de ênfase gráficas incluem enquadramento, sombreamento, colorir e

  o uso de símbolos padrão;

  3) Espacial. Técnicas espaciais para transmitir ênfase incluem o uso de espaço em branco

  para grupo texto e reservando lugares na página ou tela para tipos selecionados de

  mensagens; eData de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A

  4) Verbal. A ênfase em determinados itens pode ser transmitida usando palavras enfáticas

  (por exemplo: Importante, Nota, Atenção e Aviso).'
