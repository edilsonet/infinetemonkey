text: '5.5.8.1 Em determinados procedimentos alguns passos devem ser executados somente quando
  condições

  específicas ocorrerem. Tarefas condicionais são uma fonte frequente de confusão, principalmente

  em procedimentos pouco utilizados. Esse problema pode ser mitigado ao manter sentenças bem

  estruturadas, claramente formuladas e tão concisas quanto possível.'
