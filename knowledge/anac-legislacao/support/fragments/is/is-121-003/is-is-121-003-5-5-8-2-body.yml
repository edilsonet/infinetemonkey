text: '5.5.8.2 Instruções condicionais devem apresentar claramente todas as condições para
  que o correto fluxo

  de ações seja tomado. Os passos que estão associados com cada condição devem ser agrupados

  de forma clara. O final do bloco de ações deve ser bem definido, e a ação ou procedimento
  a ser

  realizado após a conclusão do bloco deve ser claramente especificado. Caso haja opções

  incorporadas, então essas também devem ser claramente explicitadas e os passos associados

  agrupados de forma inequívoca.'
