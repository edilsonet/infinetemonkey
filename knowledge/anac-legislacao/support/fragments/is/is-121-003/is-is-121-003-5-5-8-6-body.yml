text: '5.5.8.6 Espera, ações contínuas e ações repetidas. Em alguns casos, uma ação deve ser
  mantida ou

  repetida até que alguma condição ocorra. Nestes casos, especifique:

  1) quais ações são devem ser repetidas;

  2) as condições em que essas ações devem ser descontinuadas ou desfeitas; e

  3) se demais linhas de ação devem ser continuadas. Por exemplo: “Segure o botão

  pressionado até a pressão atingir 120 psi, e ENTÃO vá para a etapa 5 deste procedimento.”'
