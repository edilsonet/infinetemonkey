title: As listas de verificações são um tipo especial de procedimento. Elas são a forma em
  que
text: '5.6.1.1 As listas de verificações são um tipo especial de procedimento. Elas são a
  forma em que

  procedimentos expandidos são destrinchados e, muitas vezes, a forma mais comum e mais

  frequente pela qual as tripulações interagem com os procedimentos. Na cabine de pilotagem
  as

  listas de verificação são uma ferramenta importante para garantir a padronização das tarefas
  a

  serem executadas.'
