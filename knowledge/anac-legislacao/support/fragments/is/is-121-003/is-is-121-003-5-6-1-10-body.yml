text: '5.6.1.10 Papéis. O papel de fornecer a sugestão correta no momento certo para iniciar
  a lista de verificação

  é sempre atribuído a um dos dois pilotos; geralmente, o piloto em comando (PIC) no solo
  e o PF

  no ar. Normalmente, a sugestão vem na forma de uma chamada verbal (por exemplo, "before
  start

  checklist") e serve para solicitar ao outro piloto para pegar a lista de verificação. Supondo
  que

  uma lista de verificação para operação normal envolva os dois membros da tripulação em um

  método de “desafio-resposta”, ambos os pilotos deveriam dirigir sua atenção para a tarefa
  da lista

  de verificação. O piloto responsável pela liderança da lista de verificação começa por chamar
  (ou

  "desafiar") o primeiro item da lista. O outro piloto verifica se o item foi feito corretamente
  e

  fornece a resposta relevante. Existem diversas variações do método desafio-resposta: após
  a

  resposta do piloto respondente, o piloto desafiante pode verificar o estado do item desafiado,
  pode

  ou não fornecer uma resposta verbal ou pode passar diretamente a desafiar o próximo item.
  A

  verificação pode ou não envolver gestos específicos, como apontar para o interruptor relevante,

  alavanca ou indicação.'
