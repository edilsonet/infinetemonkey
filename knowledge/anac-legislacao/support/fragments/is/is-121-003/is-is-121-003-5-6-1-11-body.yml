text: '5.6.1.11 Âncora de iniciação. O início de uma lista de verificação é melhor ancorado
  em uma sugestão ou

  pista clara que não pode ser facilmente removida, obstruída ou esquecida, como a ocorrência
  de

  um evento específico (por exemplo, a chegada em um ponto 500 metros antes da barra de parada

  indica a iniciação da lista de verificação antes da decolagem). Muitas vezes, o início de
  uma lista

  de verificação é deixado em aberto, apenas limitado por uma janela de tempo (por exemplo,
  a

  lista de verificação de táxi para ser concluída a qualquer momento durante o táxi) e circunstâncias

  aceitáveis (por exemplo, quando ambos os pilotos estão livres de outras funções). As sugestões

  para iniciar listas de verificação nessas situações são muitas vezes apenas uma técnica
  pessoal

  entre os pilotos, que usam sugestões internas e externas à cabine de comando, para ajudá-los
  a

  lembrar-se de iniciar a lista de verificação no momento certo. No entanto, tais iniciações

  "flutuantes" de lista de verificação criam um alto risco de não se iniciar a lista de verificação
  na

  hora e, portanto, ter que lê-la correndo ou até mesmo nem iniciar a lista de verificação.
  A

  importância de ter sugestões externas claras e confiáveis para desencadear o início do

  procedimento da lista de verificação no ponto certo deve ser sempre enfatizadaData de emissão:
  19 de janeiro de 2018 IS nº 121-003

  Revisão A'
