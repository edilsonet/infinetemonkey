text: '5.6.1.12 Sinal de conclusão. O sinal de conclusão da lista de verificação indica que
  a lista de verificação

  efetivamente foi realizada na sua totalidade e leva ao próximo segmento de atividades. O
  sinal de

  conclusão mais comum é um anúncio verbal, como "Before Taxi checklist complete" pelo piloto

  que foi responsável por liderar a respectiva lista de verificação. A chamada de conclusão
  deve ser

  escrita como o item da última linha ou centralizada abaixo de cada lista de verificação.
  Quando a

  chamada de conclusão não está explicitamente listada na lista de verificação, uma camada
  de

  redundância é removida e o risco de omissões aumenta.'
