text: '5.6.1.13 Verificação da lista de verificação. Durante o projeto da lista de verificação,
  é importante ter em

  mente que todos os projetos de lista de verificação estão sujeitos a erros humanos. Os membros

  da tripulação podem omitir ou ignorar itens da lista de verificação ou às vezes responder

  erroneamente a uma lista de verificação acreditando que um item ou uma tarefa foi realizada

  quando não foi. Em outros momentos, os membros da tripulação podem ver o que eles esperam

  ver ao invés do que realmente está indicado ou foi realizado. Uma estratégia que ajuda a
  superar

  o erro humano é desenvolver políticas para o uso de listas de verificação que exijam rigorosas

  verificações ou verificações cruzadas e reforçar essas políticas por meio de programas de

  treinamento da tripulação. Os procedimentos destinados ao uso das listas de verificação
  devem

  ser claramente escritos no manual de operação do operador e devem ser compatíveis com a

  filosofia de CRM do operador.'
