cite: 5.6.1.14
title: 'A política deve incluir, entre outros, os seguintes itens:'
text: '5.6.1.14 A política deve incluir, entre outros, os seguintes itens:

  1) responsabilidades da tripulação de voo para manter o controle da aeronave, analisar

  situações e solicitar a lista de verificação apropriada em situações normais, anormais,
  e de

  emergência;

  2) o membro específico da tripulação responsável por iniciar cada lista de verificação;

  3) o tempo específico em que cada lista de verificação deve ser iniciada;

  4) o membro específico da tripulação responsável por cumprir cada item da lista de

  verificação;

  5) o membro específico da tripulação responsável por garantir que cada lista de verificação

  esteja concluída e reportar essa conclusão à tripulação; e

  6) responsabilidades dos tripulantes em levar à atenção do PIC e do resto da tripulação

  qualquer desvio observado dos procedimentos escritos.'
