text: '5.6.1.3 Embora possam ser publicadas em um manual, as listas de verificações são projetadas
  para uso

  independente, de modo que os utilizadores raramente irão ser solicitados a fazer referência
  a

  quaisquer manuais de voo, especialmente depois de terem sido previamente treinados sobre
  o seu

  conteúdo. Listas de verificações são utilizadas para assegurar que determinadas séries de
  ações

  especificadas sejam realizadas na sequência correta e para verificar que a aeronave foi

  configurada corretamente para cada fase do voo.'
