title: As listas de verificação têm sido uma parte significativa da base de padronização de
  tripulantes
text: '5.6.1.4 As listas de verificação têm sido uma parte significativa da base de padronização
  de tripulantes

  técnicos durante anos. Tais procedimentos, quando aplicados de forma disciplinada e

  padronizada, destinam-se a apoiar o desempenho humano, independentemente da

  circunstância. As listas de verificações são uma ajuda para a memória e garantem que os
  itens

  críticos necessários para a operação segura de aeronaves não serão negligenciados ou esquecidos.'
