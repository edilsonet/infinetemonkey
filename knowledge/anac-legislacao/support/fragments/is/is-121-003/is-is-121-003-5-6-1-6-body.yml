text: '5.6.1.6 As listas de verificações devem acomodar as demandas das fases de alta carga
  de trabalho e as

  limitações de desempenho experimentadas por seres humanos quando estão sob estresse. Elas

  devem responder às especificidades de cada situação, mas também ajudar as tripulações na
  gestão

  da tarefa global.'
