text: '5.6.1.8 Tipos de lista e modo de execução. Para a maioria dos procedimentos normais
  nos postos de

  pilotagem, uma sequência de ações e verificações é conduzida de memória para configurar
  a

  aeronave e seus sistemas. O fluxo de memória é seguido por uma lista de verificação contendo
  os

  itens mais críticos dentro desse fluxo e que confirmam se o fluxo foi feito corretamente.'
