text: '5.6.1.9 Sincronismo. Dada a criticidade do processo de verificação é crucial considerar
  a capacidade dos

  tripulantes em focar sua atenção na execução. Os momentos dedicados às leituras das listas
  de

  verificação devem ser tais que minimizem as distrações e outras tarefas simultâneas. O tempo

  alocado para as listas de verificação deve ser pensado de forma a não interferir com outras
  tarefas

  e evitar a interrupção. Por exemplo, uma lista de verificação de táxi, que deve ser realizada
  durante

  o táxi, pode criar um risco, já que não é possível, simultaneamente, prestar atenção completa
  à

  movimentação do táxi e à leitura da lista de verificação.'
