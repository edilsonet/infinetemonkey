text: '5.6.2.1 Listas de verificação relacionadas ao voo. As listas de verificação relacionadas
  ao voo devem ser

  realizadas por um membro da tripulação que lê a lista de verificação, com o segundo membro
  da

  tripulação confirmando e respondendo a cada item, conforme apropriado. As exceções a isso

  podem ser as listas de verificação “Após a decolagem” e “Após o pouso”. Enquanto estiver
  no ar,

  o PF não deve ser distraído de controlar a trajetória de voo da aeronave para executar um
  item de

  lista de verificação que um outro membro da tripulação pode realizar. Apenas um piloto deve

  estar com a cabeça baixa enquanto a aeronave estiver em movimento.'
