text: '5.6.2.3 Acompanhamento da conclusão da lista de verificação. O membro da tripulação
  responsável por

  iniciar a lista de verificação deve ser responsável por garantir que a lista de verificação
  seja

  completada de forma sistemática e expedita. Este tripulante deve ser responsável por gerenciar

  interrupções, pela verificação cruzada de controles e indicadores para assegurar que as
  ações

  necessárias foram realizadas, e por informar que a lista de verificação foi concluída.'
