text: '5.6.2.4 Call-outs. Um call-out (ou chamada) deve ser feito pelo piloto se ele está
  realizando uma tarefa

  que exige que ele esteja com a cabeça baixa. Isso ajuda a garantir que o outro piloto não
  esteja

  com a cabeça baixa ao mesmo tempo.'
