title: Na fase antes do início da partida dos motores, os itens de navegação e orientação
  de voo são
text: '5.6.2.5.1 Na fase antes do início da partida dos motores, os itens de navegação e orientação
  de voo são

  considerados itens críticos. Uma atenção conjunta deve ser exigida de ambos os pilotos quando
  a

  mesma configuração for necessária para mais de um dispositivo (como computadores,

  instrumentos de voo e altímetros). O alinhamento da plataforma inercial e a programação
  de

  computadores devem ser realizados por um membro da tripulação e confirmados

  independentemente por outro. O maior número de itens dessa lista de verificação deve ser

  realizado e verificado antes da movimentação da aeronave.'
