text: '5.6.2.5.2 Nas fases de táxi e pré-decolagem, a configuração da aeronave (como flapes,
  compensador e

  freios aerodinâmicos) e itens de orientação de voo (como proa, diretor de voo, configurações
  do

  painel de seleção de altitude e velocidade) também são itens críticos. Considerações devem
  ser

  feitas para operações fora da rotina, como degelo da aeronave, que podem resultar em mudanças

  de configuração com relação ao que foi previamente definido.'
