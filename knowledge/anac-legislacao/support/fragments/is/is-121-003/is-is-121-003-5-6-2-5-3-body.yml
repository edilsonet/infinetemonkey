  O PF e o PM
text: '5.6.2.5.3 Na aproximação, os itens de orientação de voo da lista de verificação são
  críticos. O PF e o PM

  devem ser obrigados a confirmar e responder a esses itens quando incorporados a uma lista
  de

  verificação. Atenção conjunta deve ser necessária quando a mesma configuração é necessária
  em

  dois dispositivos separados (como computadores, instrumentos de voo ou altímetros).'
