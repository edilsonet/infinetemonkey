text: '5.6.2.5.5 Não se deve depender de uma lista de verificação para iniciar uma alteração
  na configuração da

  aeronave. Os operadores devem orientar as mudanças de configuração da aeronave em eventos

  operacionais específicos (por exemplo, baixar o trem de pouso na interceptação do glide).
  Para

  qualquer alteração na configuração, um comando do PF e um reconhecimento do tripulante que

  toma a ação devem ser necessários.'
