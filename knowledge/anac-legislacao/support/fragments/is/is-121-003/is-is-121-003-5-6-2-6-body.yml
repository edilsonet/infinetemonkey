text: '5.6.2.6 Interrupções. Os tripulantes muitas vezes não conseguem completar uma lista
  de verificação por

  causa de uma interrupção ou de um item na lista de verificação que ainda não foi realizado.

  Procedimentos operacionais devem ser estabelecidos para garantir que a sequência correta
  da lista

  de verificação seja completada após uma interrupção. Se a sequência não puder ser restabelecida

  ou a tripulação não estiver esclarecida sobre onde retomar a lista de verificação, a seção

  apropriada da lista de verificação deve ser realizada desde o início.'
