text: '5.6.2.7 Itens representativos. Os itens representativos são itens selecionados que
  representam um

  subconjunto inteiro de um fluxo de ações, de tal modo que se o item selecionado foi executado,
  o

  subconjunto inteiro também deve ter sido executado. Por exemplo, se todas as indicações
  do

  motor estiverem “no verde”, toda a sequência de partida do motor deve ter sido feita corretamente;

  portanto, verificar as indicações do motor pode servir como um item representativo para
  a

  sequência de partida do motor.Data de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A'
