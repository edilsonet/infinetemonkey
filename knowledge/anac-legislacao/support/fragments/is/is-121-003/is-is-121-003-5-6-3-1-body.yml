text: '5.6.3.1 A ordem dos itens na lista de verificação pode refletir a sequência do fluxo
  ou da operação se o

  fluxo anterior à lista de verificação for cuidadosamente projetado para:

  1) aproveitar a disposição física e a localização de interruptores, monitores e indicadores

  na cabine de comando (por exemplo, indo da esquerda para a direita ou de cima para baixo);

  2) levar em consideração as dependências inerentes entre os sistemas envolvidos;

  3) dar suporte à memória humana; e

  4) ser curto.'
