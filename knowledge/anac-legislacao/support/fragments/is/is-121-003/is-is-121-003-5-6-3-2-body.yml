text: '5.6.3.2 Essa ordem ajuda na aprendizagem e aumenta a facilidade de uso. Outra consideração
  possível

  na ordem é a prioridade do item. A probabilidade de interrupções e distrações aumenta com
  o

  comprimento da lista de verificação e o tempo necessário para executá-la. Assim, mesmo que
  as

  listas de verificação contenham principalmente itens críticos, esses poderiam ser priorizados,
  e

  aqueles com maior importância poderiam ser colocados primeiro na lista de verificação.'
