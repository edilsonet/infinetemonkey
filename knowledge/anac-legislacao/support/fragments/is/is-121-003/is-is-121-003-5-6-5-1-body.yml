title: 'Os erros no uso das listas de verificação podem ocorrer nas seguintes áreas:'
text: '5.6.5.1 Os erros no uso das listas de verificação podem ocorrer nas seguintes áreas:

  1) o tripulante ignorou o(s) item(s) na lista de verificação;

  2) o tripulante não verificou as configurações visualmente;

  3) a lista de verificação do fabricante ou do operador da aeronave continha erro(s) ou estava

  incompleta;

  4) não completar um dos passos após uma interrupção;

  5) não concluir uma lista de verificação;

  6) executar a lista de verificação incorreta;

  7) dificuldade em encontrar uma lista de verificação;Data de emissão: 19 de janeiro de 2018
  IS nº 121-003

  Revisão A

  8) desorientar-se dentro de uma lista de verificação;

  9) dificuldade em confirmar que a ação da lista de verificação foi realizada corretamente;

  10) problemas na compreensão e interpretação da lista de verificação; ou

  11) dificuldade em determinar quem deve estar realizando as ações da lista de verificação

  (PF vs. PM).'
