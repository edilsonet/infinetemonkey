text: '5.6.6.1 Todas as listas de verificação estão sujeitas a interrupção em qualquer ponto
  do voo pelo ATC ou

  por outros motivos operacionais. No entanto, dados operacionais indicam que as tripulações
  de

  voo são mais susceptíveis a interrupção e distração em solo durante as fases antes do voo
  (ou seja,

  "ANTES DA PARTIDA", "PUSHBACK", "PARTIDA", "TAXI" e "ANTES DA

  DECOLAGEM") devido à pressão do tempo e interrupções do pessoal de suporte (por exemplo,

  equipe de rampa, equipe de degelo).'
