text: '5.6.6.2 Pessoal de apoio ao treinamento. Muitas das distrações ou interrupções que
  ocorrem na área de

  rampa podem ser reduzidas ao mínimo pelos operadores da aeronave por meio do treinamento
  do

  pessoal de suporte. Os operadores devem assegurar que o pessoal do apoio de solo que se

  comunica diretamente com a tripulação de voo esteja familiarizado com os procedimentos usados

  na cabine de comando e a necessidade de evitar a interrupção da tripulação durante o fluxo
  da

  lista de verificação. As pessoas que entram na cabine de comando para conversar com a tripulação

  ou entram em contato com a tripulação por meio de um interfone devem indicar a sua presença
  e,

  a menos que exista uma emergência, abster-se de interromper qualquer atividade da cabine
  de

  comando ou conversar com a tripulação até que a tripulação indique que completou suas tarefas

  e está ciente de sua presença.'
