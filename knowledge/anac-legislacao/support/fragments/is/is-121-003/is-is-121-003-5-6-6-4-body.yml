text: '5.6.6.4 Limitações cognitivas. As limitações cognitivas experimentadas pelos seres
  humanos ao lidar

  com o estresse, as demandas de tarefas concomitantes e a pressão do tempo estão por trás
  de

  muitos dos erros cometidos pelas tripulações quando respondem a emergências. Incluir mais

  informações nas listas de verificação pode reduzir a carga de memória e outras demandas

  cognitivas. No entanto, quanto mais informações forem incluídas em uma lista de verificação,

  mais longa ela fica e mais tempo será necessário para concluí-la. Os elaboradores de listas
  de

  verificação devem incluir itens nas listas que relembrem as tripulações de informações que
  eles

  não conseguem se lembrar facilmente e outras sugestões que lhes atendam, enquanto respondem

  a uma situação específica.'
