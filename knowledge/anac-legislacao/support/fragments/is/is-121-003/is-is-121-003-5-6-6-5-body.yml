title: 'Dicas de prevenção de erros em listas de verificação:'
text: '5.6.6.5 Dicas de prevenção de erros em listas de verificação:

  1) lembre-se de usar a lista de verificação;

  2) verifique cada item, toda vez;

  3) reduza a velocidade e confirme itens significativos;

  4) deliberadamente leia a lista de verificação; e

  5) se interrompido, reinicie desde o começo.Data de emissão: 19 de janeiro de 2018 IS nº
  121-003

  Revisão A

  5.7 O piloto monitorando (PM)'
