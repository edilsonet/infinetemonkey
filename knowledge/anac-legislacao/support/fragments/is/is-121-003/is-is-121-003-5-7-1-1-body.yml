title: Vários estudos de desempenho de tripulações, incidentes e acidentes identificaram o
text: '5.7.1.1 Vários estudos de desempenho de tripulações, incidentes e acidentes identificaram
  o

  monitoramento e a verificação cruzada inadequados como vulnerabilidades na segurança da

  aviação. O monitoramento e a verificação cruzada eficazes podem ser a última barreira ou
  linha

  de defesa contra acidentes porque a detecção de um erro ou de uma situação insegura pode
  quebrar

  a cadeia de eventos que leva a um acidente. Inversamente, quando essa camada de defesa está

  ausente, erros e situações inseguras podem passar despercebidos, potencialmente levando
  a

  consequências adversas. Tripulações de voo devem usar o monitoramento para ajudá-las a

  identificar, prevenir e mitigar os eventos que possam impactar as margens de segurança.
  Portanto,

  é imperativo que os operadores estabeleçam uma política operacional e procedimentos sobre
  os

  deveres do PM, incluindo o monitoramento, e implementem um treinamento eficaz para as

  tripulações de voo e instrutores na tarefa de monitoramento para ajudar o PM a rapidamente

  identificar, prevenir e mitigar os eventos que possam impactar as margens de segurança.'
