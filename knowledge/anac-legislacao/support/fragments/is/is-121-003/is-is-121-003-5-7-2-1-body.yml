cite: 5.7.2.1
title: 'Um piloto está monitorando eficazmente se ele está:'
text: '5.7.2.1 Um piloto está monitorando eficazmente se ele está:

  1) seguindo consistentemente os SOP;

  2) comunicando claramente os desvios a outros tripulantes;

  3) gerindo distrações eficazmente;

  4) permanecendo vigilante;

  5) avisando o PF se os modos de orientação de voo ou ações da aeronave estão em

  desacordo com as ações esperadas ou desejadas e intervindo quando necessário;

  6) continuamente comparando configurações de passo/potência pré-estabelecidas com o

  desempenho atual de voo; e

  7) considerando que os monitores primários de voo (PFD), monitores de navegação (ND)

  e outras fontes de informação (por exemplo, EFB) podem estar exibindo informações

  incorretas e sempre permanecendo em busca de outras evidências que confirmem ou

  desmintam a informação que os monitores estão fornecendo.'
