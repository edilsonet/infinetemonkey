text: '5.7.3.1.4 Modelo mental inadequado do piloto a respeito dos modos dos sistemas de piloto
  automático. Os

  pilotos podem não ter uma compreensão completa ou exata de todas as funções e comportamentos

  do sistema de piloto automático. Alguns aspectos de sistemas automáticos de gestão do voo
  não

  são bem combinados com as características humanas de processamento de informações.'
