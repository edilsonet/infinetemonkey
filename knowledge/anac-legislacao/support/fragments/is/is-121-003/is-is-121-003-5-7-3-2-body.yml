title: Além disso, as limitações de desempenho humanas devem ser reconhecidas como potenciais
text: '5.7.3.2 Além disso, as limitações de desempenho humanas devem ser reconhecidas como
  potenciais

  desafios para um monitoramento eficaz. O cérebro humano tem dificuldade com uma longa e

  sustentada vigilância e tem uma capacidade de multitarefa muito limitada. Os pilotos são

  vulneráveis a interrupções e distrações e a limitações cognitivas que afetam o que eles
  percebem

  e não percebem.'
