title: Pode ser difícil para os seres humanos monitorar erros e desvios de maneira contínua
  quando
text: '5.7.3.3 Pode ser difícil para os seres humanos monitorar erros e desvios de maneira
  contínua quando

  erros e desvios raramente ocorrem. Isto é verdade para a gama de condições de carga de trabalho

  experimentadas pelos membros da tripulação de voo. O monitoramento durante os períodos de

  elevada carga de trabalho é importante já que estes períodos apresentam situações num fluxo

  rápido e porque a alta carga de trabalho aumenta a vulnerabilidade a erros. No entanto,
  estudos

  mostram que o mal desempenho no monitoramento pode estar presente também durante períodos

  de baixa carga de trabalho. Lapsos no desempenho do monitoramento durante períodos de menor

  carga de trabalho estão frequentemente associados com o tédio, complacência ou ambos.'
