text: '5.7.4.1 Em uma operação de dois pilotos, um piloto é designado como PF (Piloto Voando)
  e um piloto é

  designado como PM (Piloto Monitorando). Uma análise dos manuais dos operadores indica que

  os papéis e tarefas associadas ao PF e ao PM nem sempre são claramente definidos. Cada operador

  deve definir explicitamente as funções do PF e do PM, inclusive:

  1) a qualquer momento durante o voo, um piloto é o PF e um piloto é o PM.

  2) o PF é responsável pela gestão, e o PM é responsável pelo monitoramento da trajetória

  de voo atual e projetada e da energia da aeronave em todos os momentos;

  3) o PF está sempre engajado em voar a aeronave (mesmo quando a aeronave está sob

  controle do PA - piloto automático) e evita tarefas ou atividades que o distraiam desse

  compromisso. Se o PF tem de se envolver em atividades que o distraiam do controle da

  aeronave, o PF deve transferir o controle da aeronave para o outro piloto e, em seguida,

  assumir o papel do PM;

  4) a transferência de funções entre PF e PM deve ser feita de forma positiva com atribuição

  verbal e aceitação verbal incluindo um breve resumo do estado da aeronave;

  5) o PM dá suporte ao PF em todos os momentos, ficando a par do estado da aeronave e

  das instruções e autorizações ATC;

  6) o PM monitora o estado da aeronave e o status dos sistemas, avisa qualquer desvio

  percebido ou potenciais desvios da trajetória de voo pretendido, e intervém se necessário;Data
  de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A

  7) o PF fornece um briefing para o piloto que está voltando de uma pausa. O briefing deve

  conter informações adequadas para assegurar ao piloto que está retornando uma atualização

  sobre o estado da aeronave e dos sistemas e instruções atuais do ATC.'
