text: '5.7.5.1 Políticas e procedimentos operacionais devem ser revistos ou desenvolvidos
  para garantir que a

  divisão de tarefas e responsabilidades entre membros da tripulação de voo proteja a capacidade

  do PF de controlar a trajetória de voo. Deve se evitar atribuir tarefas não relacionadas
  à trajetória

  de voo ao PF. Dados operacionais devem ser coletados e usados para revisar definições dos
  papéis

  e responsabilidades do PF e PM para garantir a sua eficácia. Os operadores são incentivados
  a

  tomar uma abordagem integrada em operações e treinamento (incluindo inicial e periódico)
  para

  enfatizar as responsabilidades e a importância dos papéis do PF e PM.'
