text: '5.7.5.2 Um aspecto crítico das tarefas de monitoramento inclui a intervenção quando
  um desvio é

  identificado. As políticas, procedimentos e treinamento do operador devem cobrir adequadamente

  a intervenção na trajetória de voo incluindo a intervenção de humano para humano.'
