title: Os SOP devem indicar o que dizer, como dizer, quando dizer, e com que nível de assertividade
text: '5.7.6.3.1 Os SOP devem indicar o que dizer, como dizer, quando dizer, e com que nível
  de assertividade

  apropriada. Os SOP devem também abordar se ou quando o PM deve assumir o papel do PF, se

  for determinado que o PF não está corrigindo o problema da trajetória de voo em tempo

  hábil. Considerações para a decisão de assumir o controle devem incluir incapacitação ou

  ausência de resposta ou correção da trajetória de voo após duas chamadas. O SOP também deve

  especificar quais os call-outs específicos e que ações associadas são necessárias em uma
  tomada

  de controle para assegurar que ocorra uma troca positiva de controle da aeronave. As políticas

  devem ser claras para garantir que não haja confusão sobre quem é o PF a todo momento.'
