text: '5.7.6.3.2 Da mesma forma, os SOP devem descrever como o PF notifica o PM acerca de
  um problema de

  orientação de voo. Por exemplo, em algumas operações, se o PA está desligado com o diretor
  de

  voo (FD) ligado, o PF voa a aeronave manualmente, mas o PM faz todas as inserções de

  orientação de voo. Nesta situação, considere o caso em que o PM faz uma inserção errônea
  de

  orientação de voo, e o PF percebe isso. Nesse caso, uma intervenção humano a humano implicariaData
  de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A

  em o PF verbalizar ao PM o erro e a correção desejada. (Por exemplo, “modo de aproximação

  ainda não está armado - arme aproximação por favor."). Para englobar tudo isso, o texto

  recomendado pode ser algo como: “PM comunicando eficazmente ao PF sobre o problema da

  trajetória de voo, esperando que o PF, em seguida, corrija o problema; ou o PF comunicando
  ao

  PM sobre um problema de orientação de voo (se o PM é o responsável pelas inserções de

  orientação de voo), esperando que o PM corrija esse problema."'
