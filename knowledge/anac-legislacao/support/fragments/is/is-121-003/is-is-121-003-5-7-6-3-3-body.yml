text: '5.7.6.3.3 Outro exemplo é quando um PM avisa “1 dot acima” e o PF responde “Corrigindo”
  e retorna à

  rampa do glide em tempo hábil. Se, por exemplo, o PF não responder a duas chamadas sucessivas,

  então, pelo SOP do operador, se a segurança indica, o PM avisa “eu tenho o controle,

  arremetendo” e inicia uma arremetida como PF.

  Nota: O controle da trajetória de voo é responsabilidade do PF, enquanto que a orientação
  da

  trajetória de voo pode ser responsabilidade de qualquer um dos pilotos, dependendo do SOP
  do

  operador.'
