text: '5.7.6.3 Intervenção humano a humano. Se ocorrer um problema na trajetória de voo, o
  PM deve notificar

  o PF sobre o problema e esperar que o PF, em seguida, corrija o problema. Uma forma de o
  PM

  conseguir notificar o PF é verbalizar um call-out de desvio, seguido de uma reação esperada
  do

  PF para este call-out com uma ação corretiva.'
