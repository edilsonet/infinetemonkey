text: '5.7.7.1 Um operador deve treinar seus pilotos em todas as políticas e procedimentos
  relacionados ao

  monitoramento da trajetória de voo (por exemplo, call-outs, dupla chamada, etc). Esse

  treinamento também deve incluir qualquer uma das práticas recomendadas pelo operador.'
