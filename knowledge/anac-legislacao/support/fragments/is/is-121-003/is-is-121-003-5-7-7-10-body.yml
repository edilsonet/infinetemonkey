title: Assegure que pilotos possam fazer a transição sem problemas entre as combinações/níveis
  de
text: '5.7.7.10 Assegure que pilotos possam fazer a transição sem problemas entre as combinações/níveis
  de

  orientação de voo/automação de voo (inclusive voo manual), capacitando-os a antecipar,

  reconhecer e recuperar-se de desafios conhecidos de comportamento dos sistemas de orientação

  de voo (inclusive FMS) e controle de voo (inclusive PA e autothrottles) (por exemplo, sutis

  reversões de modo) e armadilhas circunstanciais/ambientais conhecidas por levar a erros

  relacionados à trajetória de voo (por exemplo, vetores para fora, em seguida de volta pra
  dentro

  de uma STAR durante uma autorização de “descida via”).'
