text: '5.7.7.11 O treinamento em sistemas de orientação e controle de voo deve incluir uma
  avaliação da

  compreensão de um piloto sobre esses sistemas e o que vai acontecer em seguida, dado um

  determinado conjunto de circunstâncias de voo, e as razões. O treinamento deve incorporar

  degradações e falhas de FMS e consequências operacionais que exijam uma ação por parte da

  tripulação de voo, desafios conhecidos de comportamento dos sistemas de orientação de voo
  e

  controle de voo (por exemplo, sutis reversões de modo), e armadilhas circunstanciais/ambientais

  (por exemplo, vetores para fora, em seguida de volta pra dentro de uma STAR durante uma

  autorização de “descida via”) conhecidas por levar a erros relacionados a trajetória de
  voo.'
