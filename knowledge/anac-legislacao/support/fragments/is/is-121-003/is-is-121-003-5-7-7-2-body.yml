text: '5.7.7.2 Os pilotos devem ser treinados sobre as responsabilidades do PM em monitorar
  a trajetória de

  voo. Em particular, os pilotos devem ser treinados para reconhecer quando o PF não está

  controlando adequadamente a trajetória de voo ou quando o PM não está monitorando

  adequadamente a trajetória de voo. Este treinamento deve incluir o acúmulo de carga nas
  tarefas

  do piloto e sinais de diminuição do desempenho. Alguns exemplos incluem a falta de

  comunicação, atenção canalizada e incapacidade de fazer call-outs necessários.'
