text: '5.7.7.3 Os pilotos devem ser treinados sobre os erros comuns aplicáveis no monitoramento
  da trajetória

  de voo. Isso inclui treinamento em métodos apropriados de reconhecimento de precursores
  e

  sinais de degradação do monitoramento e resolução de erros ou lapsos de monitoramento.'
