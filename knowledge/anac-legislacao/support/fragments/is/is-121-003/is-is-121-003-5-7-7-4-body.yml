text: '5.7.7.4 Os pilotos devem ser treinados no conceito de que existem situações previsíveis
  durante cada voo,

  quando o risco de desvio da trajetória de voo é aumentado, aumentando a importância da gestão

  adequada da carga de trabalho. Se o PM é treinado para reconhecer as fases de voo ou situações

  quando eles estão mais vulneráveis a desvios da trajetória de voo (inclusive quando existe
  pouco

  tempo para corrigir desvios), ele poderia planejar estrategicamente as tarefas e a carga
  de trabalho

  para maximizar o monitoramento durante aquelas fases.'
