text: '5.7.7.7 Os pilotos devem ser treinados para gerenciar distrações que interfiram com
  o monitoramento da

  trajetória de voo. Forneça orientações sobre gestão de prioridades de tarefas e treiná-los
  para

  efetivamente alternar entre outras tarefas e o monitoramento da trajetória de voo para que
  a

  vigilância da trajetória de voo seja sempre mantida. Inclua estratégias de gestão de informações

  e tarefas que permitam aos pilotos utilizar cartas, EFB, ACARS, etc. enquanto monitoram

  eficazmente a trajetória de voo e o estado de energia do avião.Data de emissão: 19 de janeiro
  de 2018 IS nº 121-003

  Revisão A'
