text: '5.7.7.8 Os pilotos devem ser treinados em métodos de intervenção que o PM pode usar
  para ajudar o PF

  a recuperar o controle adequado da trajetória de voo e oferecer oportunidades para o PM
  praticar

  estes métodos (por exemplo, chamadas de desvios, níveis de assertividade).'
