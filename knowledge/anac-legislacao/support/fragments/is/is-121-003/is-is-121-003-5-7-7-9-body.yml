text: '5.7.7.9 Os pilotos devem ser treinados e ser capazes de demonstrar a compreensão de
  combinações entre

  diferentes níveis de orientação e automação de voo operacionalmente relevantes (por exemplo,

  dado um determinado conjunto de circunstâncias, o que acontecerá a seguir?).'
