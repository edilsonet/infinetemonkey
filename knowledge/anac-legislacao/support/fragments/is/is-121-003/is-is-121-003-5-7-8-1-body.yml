cite: 5.7.8.1
title: 'O desempenho do monitoramento pode ser significativamente melhorado por:'
text: '5.7.8.1 O desempenho do monitoramento pode ser significativamente melhorado por:

  1) desenvolvimento e implementação de SOP eficazes para dar suporte ao monitoramento

  e fazendo a verificação cruzada de funções e intervenções apropriadas;

  2) treinamento de tripulações em estratégias de monitoramento; e

  3) por pilotos seguindo esses SOP e estratégias.'
