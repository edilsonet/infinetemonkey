title: Confusão de modo de piloto automático. Dados de segurança operacional (incluindo acidentes,
text: '5.7.9.1 Confusão de modo de piloto automático. Dados de segurança operacional (incluindo
  acidentes,

  incidentes, LOSA, FOQA, e dados do SGSO) têm mostrado que a confusão de modo de piloto

  automático é uma vulnerabilidade potencial em operações de voo e merece atenção especial

  durante as tarefas de monitoramento. Os pilotos devem ser capazes de demonstrar o conhecimento

  e a habilidade necessários para corretamente selecionar, interpretar e antecipar os modos
  normais

  de piloto automático, bem como ser capazes de demonstrar ações corretivas apropriadas para

  modos inadequados ou inesperados. Isto deve incluir a capacidade de:Data de emissão: 19
  de janeiro de 2018 IS nº 121-003

  Revisão A

  1) identificar corretamente e interpretar anúncios de modo de voo individuais;

  2) descrever o impacto do respectivo modo nos sistemas relacionados e na operação do

  avião; e

  3) compreender anúncios de modo de pitch e suas relações com a potência disponível, bem

  como o estado de energia da aeronave (por exemplo, o risco de utilizar o modo de vertical

  speed para subir em altitudes elevadas com potência disponível limitada).'
