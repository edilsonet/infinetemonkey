text: '5.7.9.3 Consciência do modo de piloto automático. O Anunciador do Modo de Voo (FMA)
  fornece à

  tripulação de voo informações sobre o estado dos sistemas de piloto automático/sistemas

  automatizados, especificamente no que diz respeito às funções de orientação e de controle
  sendoData de emissão: 19 de janeiro de 2018 IS nº 121-003

  Revisão A

  utilizadas. Seja controlando manualmente a aeronave, utilizando os sistemas automatizados
  para

  controlar a trajetória de voo da aeronave e energia, ou várias combinações de ambos, o FMA
  é a

  fonte de informações para descrever “quem faz o quê”.'
