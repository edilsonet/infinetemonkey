title: É importante que os tripulantes de voo sejam exaustivamente treinados para entender
  as
text: '5.7.9.4 É importante que os tripulantes de voo sejam exaustivamente treinados para
  entender as

  implicações e relações de cada modo já que o respectivo modo comunica a fonte da trajetória
  de

  voo da aeronave e a energia. É também imperativo que os ambos os membros da tripulação,
  como

  uma equipe, entendam o modo atual e seu sistema de controle para eficazmente gerenciar a

  trajetória de voo e a energia. Assim como a função de monitoramento é de responsabilidade

  simultânea de ambos os pilotos (e potenciais tripulações auxiliares quando na cabine de

  comando), a consciência do FMA e suas implicações são também o dever de ambos os

  pilotos. Entender a consequência dos modos, quer esperados ou inesperados, e a capacidade
  de

  antecipar modos subsequentes e a compreensão do significado e efeitos sistêmicos do modo
  é

  central para o gerenciamento da trajetória de voo.'
