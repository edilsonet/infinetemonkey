title: A consciência do modo do sistema de piloto automático requer um monitoramento eficaz
  dos
text: '5.7.9.5 A consciência do modo do sistema de piloto automático requer um monitoramento
  eficaz dos

  modos de piloto automático. Abaixo estão algumas estratégias que poderiam ser treinadas
  para

  melhorar o monitoramento dos modos de piloto automático:

  1) mantenha-se no circuito voando mentalmente a aeronave mesmo quando o PA ou outro

  piloto está voando a aeronave;

  2) quando tiver sido distraído, certifique-se sempre de verificar o FMA e seus instrumentos

  de voo para estar de volta no circuito o mais rápido possível;

  3) monitore os instrumentos de voo tal como faria quando você está voando a aeronave

  manualmente;

  4) seja diligente no monitoramento de todas as mudanças na trajetória de voo - ações do

  piloto, modos do sistema, respostas da aeronave;

  5) sempre faça do monitoramento do PF uma tarefa prioritária quando mudanças na

  trajetória de voo estejam sendo feitas;

  6) sempre verifique o FMA após uma mudança selecionada no painel de controle do PA;

  7) mantenha uma consciência dos sistemas de piloto automático e modos selecionados pela

  tripulação ou iniciados automaticamente pelo computador de gerenciamento de voo

  (consciência de modo) para monitorar eficazmente a trajetória de voo;

  8) mantenha uma consciência das capacidades disponíveis nos modos de piloto automático

  acoplados para evitar confusão de modos; e

  9) controle eficazmente os sistemas e modos selecionados para determinar que a aeronave

  está na trajetória de voo desejada.

  6 APÊNDICES'
