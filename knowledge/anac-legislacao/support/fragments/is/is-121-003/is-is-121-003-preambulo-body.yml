text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS No 121-003

  Revisão A

  Aprovação: Portaria nº 150/SPO, de 16 de janeiro de 2018.

  Assunto: Procedimentos para a elaboração dos procedimentos

  operacionais padronizados (SOP) de operadores

  certificados sob o RBAC n º 121.

  1 OBJETIVO

  1.1 Oferecer a uma organização que opere ou pretenda operar de acordo com o RBAC nº 121
  em

  operações domésticas, de bandeira e/ou suplementares, um método de cumprimento para elaborar

  e obter aceitação dos procedimentos operacionais padronizados (SOP) de suas aeronaves.

  2 REVOGAÇÃO - N/A

  3 FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS,

  norma suplementar de caráter geral editada pelo Superintendente da área competente, objetivando

  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou RBHA.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito

  previsto em RBAC ou RBHA, poderá:

  1) adotar os meios e procedimentos previamente especificados em IS; ou

  2) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse

  caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 Esta IS relaciona-se com os seguintes regulamentos:

  1) RBHA 91 - Regras gerais de operação para aeronaves civis - ou RBAC que venha a

  substituí-lo;

  2) RBAC nº 121 - Requisitos operacionais: operações domésticas, de bandeira e

  suplementares.

  3.4 Esta IS apresenta meios aceitáveis de cumprimento para o parágrafo 121.135(b)(27) do
  RBAC nº

  121.

  4 DEFINIÇÕES

  4.1 Para os fins desta IS, as seguintes definições e termos são fornecidos:Data de emissão:
