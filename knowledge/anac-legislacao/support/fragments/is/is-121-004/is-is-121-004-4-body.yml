text: '4. DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições previstas nos RBAC nº 01 e 121 e
  as

  seguintes definições:Data de emissão: 19 de janeiro de 2018

  IS nº 121-004

  Revisão A

  AFM - Airplane Flight Manual (Manual de Voo do Avião) - documento elaborado

  pelo fabricante e aprovado pela autoridade aeronáutica no processo de certificação

  da aeronave.

  AOM - Aircraft Operating Manual (manual de operações da aeronave) -

  documento elaborado pelo operador da aeronave (ou pelo fabricante, sob demanda

  do operador), para descrever detalhes da operação da aeronave, de modo instrutivo

  e didático para a tripulação e demais pessoas envolvidas na operação.'
