text: '5.1.1 O parágrafo 121.141(a) do RBAC nº 121 determina que o operador deve possuir um

  Manual de Voo do Avião (AFM) ou Manual de Operações do Avião (AOM) atualizado

  para cada tipo de avião que ele opera.'
