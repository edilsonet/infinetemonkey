title: O AFM é um documento técnico elaborado pelo fabricante e aprovado pela autoridade
text: '5.1.2 O AFM é um documento técnico elaborado pelo fabricante e aprovado pela autoridade

  aeronáutica durante o processo de certificação da aeronave. Para aeronaves de categoria

  transporte, sua estrutura e conteúdo são previstos na seção 25.1581 do RBAC nº 25.'
