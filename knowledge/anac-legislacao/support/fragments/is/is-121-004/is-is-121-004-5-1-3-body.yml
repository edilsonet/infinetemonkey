text: '5.1.3 Via de regra, por se tratar de um documento de aeronavegabilidade, o AFM não
  aborda

  de maneira abrangente e didática todos os procedimentos e atribuições da tripulação, e

  por isso seu uso pelos operadores aéreos como fonte primária de orientação para seus

  tripulantes não é recomendável.'
