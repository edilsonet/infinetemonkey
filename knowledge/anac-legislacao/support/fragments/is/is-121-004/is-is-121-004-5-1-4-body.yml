text: '5.1.4 Já o AOM é um documento mais completo e didático, elaborado pelo operador aéreo
  (ou

  pelo fabricante da aeronave, sob demanda do operador) com base nas informações

  técnicas contidas no AFM, mas complementando-as e organizando-as tendo em vista o

  fim específico de orientar tripulantes, despachantes operacionais de voo e demais pessoas

  envolvidas diretamente na operação da aeronave.'
