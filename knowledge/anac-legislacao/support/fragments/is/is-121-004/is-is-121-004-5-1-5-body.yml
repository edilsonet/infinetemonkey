text: '5.1.5 Por isso, em linhas gerais a ANAC recomenda que o operador não utilize o AFM
  para

  substituir o AOM, mas sim desenvolva um AOM próprio, adequado à sua realidade

  operacional e seguindo os critérios previstos nesta IS.

  5.2 Conteúdo do manual'
