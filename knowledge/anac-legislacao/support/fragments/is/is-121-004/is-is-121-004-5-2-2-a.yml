cite: 5.2.2(a)
title: 5.2.2(a)
text: 'a) Identificar explicitamente os itens de memória, de modo que sejam claramente

  distinguidos dos outros procedimentos ou checklists. Um item de memória (ou item

  de ação imediata) é uma ação que deve realizada expeditamente, de modo a evitar

  ou estabilizar uma situação de perigo, para a qual não há tempo disponível para a

  tripulação consultar um manual ou um checklist. Os tripulantes devem se

  familiarizar com essas ações requeridas de forma a executá-las de memória,

  corretamente e com segurança. As situações que constituem itens de memória

  incluem, mas não se limitam a:Data de emissão: 19 de janeiro de 2018

  IS nº 121-004

  Revisão A

  I. ameaça iminente de incapacitação de tripulante;

  II. ameaça iminente de perda de controle da aeronave; e

  III. ameaça iminente de destruição de um sistema ou componente que torne

  improvável a continuidade segura do voo e a subsequente aterrissagem.'
