cite: 5.2.2(d)
title: 5.2.2(d)
text: 'd) Possuir linguagem e estruturas claras e acessíveis ao público alvo do manual, isto

  é, tripulantes, despachantes operacionais de voo e outras pessoas envolvidas

  diretamente na operação da aeronave. O operador é responsável por assegurar-se de

  que o idioma utilizado no AOM é compreendido satisfatoriamente por todas as

  pessoas que irão utilizá-lo.

  5.3 Processo de aceitação do manual'
