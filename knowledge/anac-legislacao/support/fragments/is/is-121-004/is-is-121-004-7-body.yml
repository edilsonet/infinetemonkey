text: '7. DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 Todos os detentores de certificado para operações segundo o RBAC nº 121 devem revisar

  seu AOM para adequação às disposições desta IS em até 180 dias após sua publicação,

  ou em prazo inferior, caso requerido pela ANAC.Data de emissão: 19 de janeiro de 2018

  IS nº 121-004

  Revisão A'
