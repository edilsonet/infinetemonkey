title: apendice-a-conteudo-minimo-do-aom(a)
text: 'a) dados detalhados de desempenho com um (ou mais, se aplicável) motor inoperante,

  incluindo fuel flow em condições atmosféricas padrão (ISA) e não padrão, como

  uma função da velocidade aerodinâmica e do regime de potência utilizado, e

  abordando as seguintes situações:

  I. drift down, quando aplicável;

  II. procedimentos de espera; e

  III. limitações de altitude aplicáveis à condição de motor inoperante;'
