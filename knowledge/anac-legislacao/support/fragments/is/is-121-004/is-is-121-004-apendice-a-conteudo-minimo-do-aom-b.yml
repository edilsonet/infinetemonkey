text: 'b) dados detalhados de desempenho com todos os motores operantes, incluindo fuel

  flow em condições atmosféricas padrão (ISA) e não padrão, como uma função da

  velocidade aerodinâmica e do regime de potência utilizado, e abordando as

  seguintes situações:

  I. cruzeiro (a partir de 10.000 ft inclusive);

  II. procedimentos de espera; e'
