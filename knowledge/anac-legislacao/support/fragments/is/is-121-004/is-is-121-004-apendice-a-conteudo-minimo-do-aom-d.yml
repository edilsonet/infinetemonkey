text: 'd) peso operacional seco e seu centro de gravidade ou índice correspondente.

  A9. CARREGAMENTO

  A9.1. Procedimentos e instruções para carregar, afixar e descarregar a carga.

  A10. MATERIAIS DE SOBREVIVÊNCIA E EMERGÊNCIA, INCLUINDO

  OXIGÊNIO

  A10.1. Lista de verificação de equipamentos de sobrevivência, emergência e segurança

  transportados para rotas a serem voadas, incluindo procedimentos para verificar antes

  que o equipamento é adequado para o serviço, bem como localização, acesso e uso

  de equipamentos de sobrevivência, emergência e segurança e listas de verificação

  associadas.

  A10.2. Procedimentos para determinar a quantidade de oxigênio requerida e a quantidade

  disponível, tendo em conta o perfil de voo, o número de ocupantes e a possível

  descompressão da cabine.

  A11. PROCEDIMENTOS DE EVACUAÇÃO DE EMERGÊNCIA

  A11.1. Instruções para a preparação da evacuação de emergência, incluindo a coordenação

  com a tripulação.

  A12. SISTEMAS DA AERONAVE

  A12.1. Descrição dos sistemas de aeronave, controles associados e indicações e instruções

  operacionais.'
