title: apendice-a-conteudo-minimo-do-aom(f)
text: 'f) voos realizados de acordo com a lista de desvios da configuração (CDL).

  A7. PLANEJAMENTO DO VOO

  A7.1. Dados e instruções necessárias para planejamentos pré-voo e durante o voo, incluindo

  fatores como regimes de velocidade e ajustes de potência, procedimentos para

  operações com um ou mais motores inoperantes, dados para voos ETOPS (incluindo

  a velocidade de cruzeiro com um motor inoperante e a distância máxima permitida

  até um aeródromo de alternativa adequado) e voos para aeródromos isolados.

  A7.2. Método para calcular o combustível necessário para as diferentes fases de voo.

  A7.3. Quando aplicável, dados de desempenho suficientes para possibilitar o planejamento

  ETOPS, incluindo o cálculo da reserva de combustível crítica e planejamento de áreas

  de operação. Devem estar incluídos, no mínimo, os dados a seguir:'
