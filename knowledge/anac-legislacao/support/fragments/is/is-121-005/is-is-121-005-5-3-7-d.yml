id: is-is-121-005-5-3-7-d
kind: is
document: is-121-005
family: '121'
section_id: 5.3.7
section_title: 'O MGO deve ser aprovado em qualquer uma das condições abaixo:'
subsection_id: d
cite: 5.3.7(d)
title: 5.3.7(d)
text: 'd) quando por iniciativa do operador pelo menos uma das seções abaixo for alterada:

  1) nome das pessoas designadas para os cargos de administração requerida;

  2) controle e supervisão das operações (todo o capítulo);

  3) gerenciamento da fadiga humana (todo o capítulo) [apenas no caso de o operador optar
  pela implementação do GRF ou SGRF]

  4) método de determinação das altitudes mínimas de voo;

  5) método de determinação dos mínimos operacionais dos aeródromos;

  6) políticas e procedimentos para o uso, distribuição e inserção de dados eletrônicos de
  navegação atualizados;

  7) peso e balanceamento;

  8) degelo e antigelo no solo;

  9) Electronic Flight Bag;

  10) procedimentos de navegação;

  11) HUD/EVS;

  12) política e procedimentos para gerenciamento do combustível em voo;

  13) dispositivos eletrônicos portáteis;

  14) operações de baixa visibilidade;

  15) ETOPS; ou

  16) acordos de ACMI, wet-leasing, intercâmbio e code-share.

  5.4 Uso do MGO em serviço

  5.4.1 Cada operador deve manter o MGO e demais manuais e documentos que o complementam em
  sua base principal de operações. Além disso, cada operador deve fornecer o MGO ou as partes
  aplicáveis do MGO a todo o pessoal empregado de solo ou voo que realiza ou presta serviços
  de apoio às operações aéreas. O MGO pode ser confeccionado no formato convencional em papel
  ou em outro formato que seja conveniente para seus usuários. Todos os empregados que receberam
  uma cópia do manual devem mantê-lo atualizado. Cada empregado deve ter acesso ao MGO ou
  às partes apropriadas do MGO enquanto estiver executando suas tarefas.'
