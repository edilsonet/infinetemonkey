title: Uma cópia do MGO deve ser levada a bordo de todas as aeronaves do operador.
text: '5.4.2 Uma cópia do MGO deve ser levada a bordo de todas as aeronaves do operador.

  5.4.3 É obrigação do operador aéreo, por meio de seus empregados e das demais pessoas que
  atuam em suas operações, cumprir e fazer os procedimentos estabelecidos no MGO. Em caso
  de divergências com normas, devem ser cumpridas as normas, a Anac deve ser notificada imediatamente,
  e o manual deve ser revisado tão brevemente quanto possível.'
