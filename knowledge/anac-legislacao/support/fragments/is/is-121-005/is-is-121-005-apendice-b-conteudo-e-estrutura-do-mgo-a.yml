title: apendice-b-conteudo-e-estrutura-do-mgo(a)
text: '(a) descrição das licenças, habilitações, qualificações e competências exigidas do
  pessoal de operações para o desempenho das suas funções. Devem se considerar o tipo de avião,
  o tipo de operação e a composição da tripulação. Por exemplo:

  I. treinamento e qualificação em zonas, rotas e aeródromos;

  II. aeródromos especiais;

  III. treinamento;

  IV. experiência;

  V. exames; e

  VI. experiência recente;'
