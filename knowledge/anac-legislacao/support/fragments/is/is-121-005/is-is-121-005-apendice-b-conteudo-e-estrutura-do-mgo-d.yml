text: '(d) quaisquer outros documentos requeridos, inclusive para operações específicas.

  B8.2. Serviços de solo

  Nota: a disponibilidade dos serviços de solo é parte da certificação do operador aéreo,
  conforme requerido pelo parágrafo 119.39(a)(4)(iv) do RBAC nº 119. Conforme previsto no
  art. 2º da Resolução nº 116, de 20 de outubro de 2009, os serviços de solo podem ser realizados
  diretamente pelo operador aéreo, pelo operador de aeródromo ou por sociedade empresária
  contratada. Independentemente de quem realiza, o operador aéreo é responsável pela adequada
  condução das operações.

  B8.2.1. Estrutura organizacional. Descrição da estrutura orgânica dotada da autoridade necessária
  para controlar todas as funções dos serviços de solo, incluindo linhas de responsabilidade
  para:'
