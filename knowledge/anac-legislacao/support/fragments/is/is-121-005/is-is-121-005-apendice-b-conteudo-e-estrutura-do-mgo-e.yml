text: '(e) descrição dos tipos de fluidos utilizados, incluindo:

  I. nomes comerciais;

  II. características;

  III. efeitos no desempenho do avião;

  IV. tempos máximos de espera;

  V. precauções durante a utilização.

  Nota: o conteúdo desta seção deve estar de acordo com a IS nº 119-005.

  B8.3. Procedimentos de voo

  B8.3.1. Política VFR/IFR. Descrição da política para permitir voos em VFR ou exigir voos
  em IFR, ou como efetuar a mudança de um para o outro.

  B8.3.2. Familiarização com rotas e aeródromos. Procedimentos para familiarização com rotas
  e aeródromos de forma a garantir que nenhum piloto será designado como piloto em comando
  de um avião em uma rota ou segmento de rota em que não esteja qualificado, de acordo com
  as seções 121.443 e 121.445 do RBAC nº 121 e com a IS nº 121-020.

  B8.3.3. Briefings. Conteúdo mínimo dos briefings de saída e de aproximação, e qualquer outro
  briefing necessário para o tipo de operação.

  B8.3.4. Condições meteorológicas necessárias para iniciar ou continuar uma aproximação por
  instrumentos.

  B8.3.5. Responsabilidades e procedimentos da tripulação de voo para gerenciamento da carga
  de trabalho durante aproximações por instrumentos noturnas ou em condições IMC.

  B8.3.6. Instruções para realizar procedimentos de aproximação de precisão e não precisão
  por instrumentos.

  B8.3.7. Equipamento de navegação. Lista dos equipamentos de navegação mínimos para operações
  em um determinado espaço aéreo, incluindo, quando aplicável:'
