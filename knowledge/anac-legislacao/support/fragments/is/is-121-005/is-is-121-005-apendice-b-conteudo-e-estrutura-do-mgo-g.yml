text: '(g) serviço de abastecimento de combustível.

  Nota: a descrição se aplica qualquer aeródromo em que se opere, independentemente de que
  este seja base (principal ou secundária) de operações ou de manutenção. A IS nº 121-013,
  que aborda a estrutura para estações de linha (bases secundárias de operação), deve ser
  utilizada de referência.

  B8.2.2. Qualificação do pessoal e terceirização. Requisitos de qualificação e instrução
  para o pessoal envolvido, e políticas, processos e procedimentos para terceirização dos
  serviços de solo.

  B8.2.3. Responsabilidades sobre terceirização. Responsabilidades do operador pelos serviços
  de solo quando parte ou todas as funções e tarefas tenham sido terceirizadas, incluindo
  o programa de supervisão dos provedores de serviços contratados.

  B8.2.4. Procedimentos de abastecimento. Descrição dos procedimentos de abastecimento de
  combustível, incluindo:'
