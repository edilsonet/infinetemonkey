text: '(h) atividade precursora de erupção vulcânica ou uma erupção vulcânica.

  B8.3.22. Esteira de turbulência. Os critérios para separação de esteira de turbulência,
  considerando o tipo de avião, as condições do vento e a localização da pista.

  B8.3.23. Tripulantes nos seus postos. Os requisitos para os tripulantes ocuparem os seus
  postos de trabalho ou assentos durante as diferentes fases do voo ou sempre que se considere
  necessário por razões de segurança, incluindo os procedimentos relativos ao repouso controlado
  nos compartimentos de descanso.

  B8.3.24. Utilização dos cintos de segurança pela tripulação e pelos passageiros. Os requisitos
  de utilização dos cintos de segurança pelos tripulantes e pelos passageiros durante as diferentes
  fases do voo ou sempre que razões de segurança justifiquem o seu uso.

  B8.3.25. Acesso à cabine de comando. Normas para permitir o acesso à cabine de comando,
