title: apendice-c-gerenciamento-da-frota(f)
text: '(f) Declaração de que:

  I. As aeronaves autorizadas cumprem com as exigências para sua inclusão na lista de acordo
  com procedimentos estabelecidos no MGO (deve ser incluída referência a qual parte do MGO);

  II. As MEL em vigor são aplicáveis a todas as matrículas da lista.'
