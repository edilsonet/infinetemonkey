title: OBJETIVO
text: 'OBJETIVO

  1.1 Apresentar procedimentos aceitáveis para a elaboração do Manual Geral de Operações de
  operadores aéreos regidos pelo RBAC nº 121;

  1.2 Apresentar procedimentos aceitáveis para o processo de revisão do Manual Geral de Operações
  por tais operadores; e

  1.3 Apresentar os procedimentos aceitáveis para utilização do Manual Geral de Operações
  em serviço por tais operadores.'
