section_id: 5.1.1.1
section_title: 'O programa de treinamento operacional deve ser composto das seguintes partes:'
subsection_id: b
cite: 5.1.1.1(b)
title: 5.1.1.1(b)
text: 'b) Página de aprovação: página com identificação dos responsáveis pela aprovação do
  programa de treinamento operacional na estrutura do detentor de certificado. Deve conter
  ainda uma declaração, assinada pelo diretor de operações, de que o programa de treinamento
  cumpre com a legislação aplicável, com as condições do COA e especificações operativas,
  e que as instruções contidas no programa devem ser seguidas pelo pessoal do operador.'
