section_id: 5.1.1.1
section_title: 'O programa de treinamento operacional deve ser composto das seguintes partes:'
subsection_id: e
cite: 5.1.1.1(e)
title: 5.1.1.1(e)
text: 'e) pré-requisitos definidos pelo RBAC ou pelo operador para ingresso no currículo,
  ou seja, uma descrição das qualificações mínimas e pré-requisitos para que os alunos sejam
  considerados aptos a realizarem cada currículo de treinamento. Exemplos desses pré-requisitos
  incluem: licenças, qualificações do tipo de aeronave, treinamentos prévios, horas mínimas
  de voo, experiência com outras empresas do RBAC nº 121 ou 135 e experiência recente. Esta
  descrição será utilizada para se determinar o nível de detalhamento necessário de cada módulo
  de treinamento e as cargas horárias mínimas de treinamento;'
