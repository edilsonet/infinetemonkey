title: 5.1.1.1(f)
text: 'f) Definições: devem ser definidos os termos utilizados no programa de treinamento
  operacional, visando a garantir sua correta interpretação. As definições contidas na seção
  4 desta IS e as contidas nos demais materiais de referência, se aplicáveis ao detentor de
  certificado, podem ser usadas como base para elaboração desta seção.'
