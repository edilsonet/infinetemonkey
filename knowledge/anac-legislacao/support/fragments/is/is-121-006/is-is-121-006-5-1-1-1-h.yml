section_title: 'O programa de treinamento operacional deve ser composto das seguintes partes:'
subsection_id: h
cite: 5.1.1.1(h)
title: 5.1.1.1(h)
text: h) descrições ou exibições pictoriais de manobras e procedimentos normais, anormais
  e de emergência utilizadas no currículo, quando apropriado. Essas descrições ou exibições
  pictoriais, quando agrupadas, são comumente referidas como o documento de manobras e procedimentos
  de voo (por exemplo, o Flight Crew Training Manual - FCTM). Essas informações devem ser
  submetidas como parte do currículo ou ser apropriadamente referenciadas no currículo;
