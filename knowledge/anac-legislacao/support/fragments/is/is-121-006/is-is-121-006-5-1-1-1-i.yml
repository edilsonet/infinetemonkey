section_title: 'O programa de treinamento operacional deve ser composto das seguintes partes:'
subsection_id: i
cite: 5.1.1.1(i)
title: 5.1.1.1(i)
text: 'i) Generalidades: deve descrever o objetivo geral do programa de treinamento operacional,
  estabelecer as funções para as quais o treinamento se aplica, informar a regulamentação
  aeronáutica, publicações do fabricante do avião, avaliações operacionais e demais documentos
  que fundamentam o programa, definir as responsabilidades dos setores envolvidos no treinamento,
  e estabelecer quaisquer políticas, diretrizes e procedimentos gerais de treinamento, de
  forma a assegurar que cada tripulante ou DOV seja adequadamente treinado e qualificado para
  um determinado tipo de operação, função específica e tipo de equipamento, de acordo com
  os requisitos estabelecidos pelo RBAC nº 121.'
