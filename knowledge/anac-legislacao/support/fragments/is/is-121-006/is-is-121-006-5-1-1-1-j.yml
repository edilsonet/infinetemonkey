title: 5.1.1.1(j)
text: 'j) Ementas dos currículos de treinamento.

  5.1.1.2 As ementas dos currículos são as partes do programa de treinamento operacional onde
  os operadores especificam o conteúdo dos currículos. As ementas devem conter pelo menos
  as informações especificadas na seção 5.1.1.3 desta IS. Essa informação é necessária para
  que a ANAC possa determinar se o currículo do operador atende aos requisitos regulamentares
  durante a fase 3 do processo de aprovação. As ementas dos currículos devem conter informações
  suficientes para que os planos de aula possam ser construídos a partir delas. Por sua vez,
  informações detalhadas devem ser colocadas em planos de aula, manuais de treinamento e outros
  documentos mantidos pelo operador. Esse material detalhado é avaliado durante a fase 4 do
  processo de aprovação.

  5.1.1.3 Informações requeridas dos currículos. Cada operador deve enviar as ementas dos
  currículos especificamente adequadas aos tipos de aeronaves e tipos de operações. Essas
  ementas podem diferir de um operador para outro e de uma categoria de treinamento para outro
  em termos de formato, detalhes e apresentação. Os currículos para diferentes funções podem
  ser combinados em um único documento, desde que cada uma das funções seja especificamente
  identificada e quaisquer diferenças na instrução sejam especificadas para cada função. Cada
  ementa de currículo e de segmento de currículo deve incluir as seguintes informações:'
