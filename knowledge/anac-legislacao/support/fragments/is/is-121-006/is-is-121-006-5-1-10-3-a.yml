section_title: O treinamento não presencial poderá ser realizado em treinamentos para tripulantes
  e DOV.
subsection_id: a
cite: 5.1.10.3(a)
title: 5.1.10.3(a)
text: a) O treinamento não presencial é apropriado quando o conteúdo da aula tiver caráter
  técnico, informativo ou teórico e quando envolver habilidade de execução de uma tarefa que
  exija a manipulação de palavras, números e símbolos relacionada à aplicação do conhecimento
  adquirido, classificação, aplicação de regras, procedimentos ou princípios (mentais), solução
  de problemas ou aplicação do pensamento criativo.
