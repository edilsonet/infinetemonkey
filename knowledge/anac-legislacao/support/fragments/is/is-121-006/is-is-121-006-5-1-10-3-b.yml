family: '121'
section_id: 5.1.10.3
section_title: O treinamento não presencial poderá ser realizado em treinamentos para tripulantes
  e DOV.
subsection_id: b
cite: 5.1.10.3(b)
title: 5.1.10.3(b)
text: 'b) O treinamento não presencial não é apropriado quando envolver habilidade de execução
  de uma tarefa que requeira destreza, coordenação e atividade muscular que geralmente envolve
  a manipulação de objetos ou materiais e o uso de movimentos musculares precisos ou não de
  maneira coordenada. Exemplos de treinamentos que demandam essas atividades são o treinamento
  de voo de pilotos e mecânicos de voo, familiarização de comissários de voo com a aeronave
  e seus equipamentos, treinamento prático de emergências, Capacitação em Serviço (CAS,
  ou OJT em inglês On the Job Training), entre outros.

  5.1.10.4 A natureza geral e as características específicas das mídias e das plataformas
  utilizadas para o treinamento não presencial são diversas podendo variar de sistemas tecnológicos
  complexos a mais simples. Exemplos incluem mídia em papel, vídeos, áudios, animações, aulas
  transmitidas em tempo real ou gravadas, salas de aula virtuais etc. O formato utilizado
  deve atender e se adaptar ao objetivo de cada treinamento. Cabe ao operador definir o melhor
  formato para realizar o treinamento não presencial e demonstrar à ANAC a eficácia do treinamento.

  5.1.10.5 Caso opte pelo treinamento não presencial para algum segmento de currículo ou módulo
  de treinamento, o PTO deverá possuir uma descrição da modalidade, da avaliação do aluno,
  da avaliação da efetividade do treinamento, e sobre a operação e manutenção dessa modalidade
  de treinamento.'
