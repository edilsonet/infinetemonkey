title: 5.1.10.6(d)
text: 'd) Descrição de como será a interação do instrutor com os alunos durante o treinamento
  não presencial, incluindo:

  I. Como será o monitoramento pelo instrutor do progresso e dificuldades dos alunos no treinamento;

  II. Como os alunos serão orientados e incentivados para sua evolução no treinamento;

  III. Como será o acesso do aluno ao instrutor, para esclarecimento de dúvidas.'
