title: 5.1.10.7(a)
text: a) Comparação de indicadores do treinamento não presencial com referências, como, por
  exemplo, tempo médio requerido para o aluno completar o treinamento, taxa de aprovação,
  média de pontuação, entre outros. Essas referências podem ser extraídas dos treinamentos
  aplicados anteriormente de forma presencial, ou utilizando outro padrão apropriado.
