section_title: 'Descrição de como será avaliado se o aluno atingiu os objetivos do treinamento,
  incluindo:'
subsection_id: c
cite: 5.1.10.7(c)
title: 5.1.10.7(c)
text: 'c) O desempenho mínimo para aprovação na avaliação. Uma pontuação inferior à mínima
  de aprovação exige um retreinamento em todos os conteúdos que estavam abaixo do padrão e
  a realização de um novo teste.

  Nota: Quaisquer respostas incorretas devem ser abordadas após a avaliação com o objetivo
  de informar ao aluno qual foi o erro e apresentar a resposta correta. Essa abordagem é necessária
  inclusive para os alunos aprovados na avaliação.'
