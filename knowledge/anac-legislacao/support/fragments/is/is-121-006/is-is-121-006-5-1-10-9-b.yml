title: 5.1.10.9(b)
text: 'b) Como será a atualização do conteúdo dos treinamentos e da avaliação. A atualização
  deve englobar novos aspectos relacionados ao assunto do treinamento ou da avaliação (ex:
  mudanças em procedimentos, mudanças nas aeronaves, novos tipos ou características de operação
  etc.), performance dos alunos em suas funções no trabalho, assim como informações oriundas
  do processo de gerenciamento de risco e promoção de segurança operacional do SGSO, de forma
  a monitorar a eficácia do treinamento e identificar possíveis falhas ou necessidade de aprimoramento.

  5.1.10.10 As descrições requeridas pelos itens 5.1.10.6 a 5.1.10.9 podem ser incluídas em
  uma parte única (ex: generalidades) ou nas partes que tratam especificamente dos segmentos
  de currículo e módulos que serão aplicados através de treinamento não presencial. Recomenda-se
  que as descrições comuns a todos os segmentos de currículo e módulos sejam incluídas no
  PTO em uma parte única.

  5.1.10.11 O operador deverá disponibilizar acesso à ANAC, para fins de fiscalização, aos
  treinamentos, registros, e informações sobre a avaliação da efetividade do treinamento.'
