text: '5.1.10 Treinamento não presencial

  5.1.10.1 O operador pode apresentar, para análise e aprovação da ANAC, parte do programa
  de treinamento na modalidade não presencial desde que cumpra integralmente com os requisitos
  do RBAC nº 121 e as instruções desta e das demais IS relacionadas a programas de treinamento
  para tripulantes e DOV, incluindo a carga horária mínima e interação com instrutor.

  5.1.10.2 O treinamento não presencial é um termo usado na indústria da aviação com vários
  significados, dependendo do contexto em que se encontra. Para os fins desta IS, será considerado
  como um aprendizado que é realizado por qualquer método ou meio de treinamento que não inclua
  a presença física do instrutor e de alunos (tripulantes e DOV) em uma sala de aula tradicional.
  O treinamento não presencial é conhecido por outros termos, como ensino a distância (EaD),
  e-learning, estudo em casa, treinamento autoguiado, sala de aula virtual, treinamento baseado
  em computador, treinamento online etc.'
