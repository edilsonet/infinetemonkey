title: 5.1.11(h)
text: 'h) detalhes sobre a execução de determinadas tarefas, procedimentos ou manobras, incluindo
  informação se são dependentes do assento utilizado pelo tripulante e a necessidade de treinamento
  para cada assento.

  Nota 1: os FCD publicados pela Anac, bem como links para os de outras autoridades de aviação
  civil de referência, encontram-se disponíveis em https://www.gov.br/anac/pt-br/assuntos/regulados/aeronaves/avaliacao-operacional.

  Nota 2: informações adicionais podem ser encontradas na IS nº 21.61-001.'
