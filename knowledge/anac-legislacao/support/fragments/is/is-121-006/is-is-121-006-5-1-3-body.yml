title: Desenvolvimento dos currículos de treinamento
text: '5.1.3 Desenvolvimento dos currículos de treinamento

  5.1.3.1 Currículos requeridos. O operador deve desenvolver e manter somente os currículos
  que serão utilizados. Por exemplo, se um operador especifica que todos os pilotos recém-contratados
  devem ser treinados primeiramente como mecânico de voo de um B-727 (o currículo apropriado
  para essa categoria de treinamento seria o “Treinamento Inicial de Nova Contratação B-727
  MCV”), o operador não seria obrigado a desenvolver nenhum currículo de Treinamento Inicial
  de Nova Contratação para os pilotos para outras aeronaves nas funções de SIC ou PIC. Os
  currículos de treinamento devem estar harmonizados com as aeronaves e autorizações descritas
  nas Especificações Operativas (EO).

  5.1.3.2 Requisitos de conclusão. Cada pessoa obrigada a treinar de acordo com um currículo
  deve completar esse currículo na sua totalidade. Cada aluno deve completar satisfatoriamente
  todos os segmentos de currículos prescritos por um currículo de treinamento aprovado. Quando
  uma pessoa completa o treinamento e os exames especificados por um currículo, essa pessoa
  está qualificada para servir em uma função específica em um tipo específico de aeronave.'
