text: 'd) pilotos que não possuam experiência anterior em operações sob o RBAC nº 121.

  Nota: nesses exemplos, cada currículo terá horas programadas ou planejadas diferentes para
  refletir o nível de conhecimento e habilidade do empregado com relação à operação ou à aeronave
  do operador. Independentemente das qualificações anteriores de um indivíduo, é responsabilidade
  do operador garantir que cada indivíduo seja proficiente e totalmente qualificado nos procedimentos
  e operações antes de autorizar o indivíduo a operar como tripulante ou DOV.

  5.1.5.3 Pré-requisitos para múltiplos currículos. Os operadores que escolhem desenvolver
