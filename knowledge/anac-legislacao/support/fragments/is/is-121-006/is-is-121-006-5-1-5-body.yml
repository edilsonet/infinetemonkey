title: Múltiplos currículos em uma única categoria
text: '5.1.5 Múltiplos currículos em uma única categoria

  5.1.5.1 Os operadores podem desenvolver e ter aprovados vários currículos para uma única
  categoria, função e tipo de aeronave. Esses currículos podem ter diferentes horas programadas
  ou planejadas com base no conhecimento e habilidade anterior do tripulante ou DOV.'
