cite: 5.1.6(a)
title: 5.1.6(a)
text: a) Ajustes nas ementas do módulo de treinamento. Uma vez aprovadas, as ementas do módulo
  de treinamento normalmente permanecem fixas, requerendo revisão apenas quando elementos
  ou eventos são introduzidos ou retirados. Por exemplo, se o operador propuser a instalação
  de equipamentos HGS (Head-up Guidance System) em suas aeronaves, as ementas do módulo de
  treinamento existentes devem ser revisadas ​​para incluir o treinamento de solo e de voo
  sobre HGS. Uma revisão da ementa do módulo de treinamento deve ser aprovada pela ANAC.
