cite: 5.1.6(b)
title: 5.1.6(b)
text: 'b) Ajuste no material didático. O operador tem a flexibilidade de fazer ajustes no
  material didático, desde que o ajuste não adicione ou exclua elementos ou eventos da ementa
  do módulo de treinamento. Quaisquer mudanças (adicionar ou excluir elementos ou eventos)
  na ementa do módulo de treinamento devem ser aprovadas pela ANAC.

  Nota: a ANAC também pode, com base em relatórios de vigilância ou outras informações, exigir
  que o operador modifique o material didático, os métodos de instrução e as ementas dos módulos
  de treinamento.

  5.1.6.3 Uso de um módulo de treinamento em múltiplos currículos ou categorias de treinamento.
  Um módulo de treinamento específico pode ser usado em mais de um currículo e em mais de
  uma categoria de treinamento. Por exemplo, um módulo de treinamento sobre procedimentos
  de evacuação de emergência para o treinamento periódico pode ser utilizado também para o
  treinamento de requalificação. Os operadores devem desenvolver os cursos de forma a dar
  a ênfase necessária à categoria específica de treinamento. Por exemplo, o treinamento de
  elevação de nível de SIC para PIC deve enfatizar as novas responsabilidades da sua função.
  A ênfase no treinamento de elevação de nível de MCV para SIC, no entanto, deve ser sobre
  as necessárias habilidades de pilotagem, bem como sobre os requisitos da nova função. O
  treinamento de transição deve enfatizar os sistemas de aeronave e os procedimentos e habilidades
  de pilotagem necessários para operar um tipo de aeronave diferente. Em muitos casos, os
  operadores podem desenvolver diferentes conjuntos de material didático de cursos para um
  único módulo de treinamento para cobrir diferenças em ênfase.

  5.1.6.4 Exemplo de módulo de treinamento. Os operadores devem apresentar módulos de treinamento
