title: Módulos de treinamento
text: '5.1.6 Módulos de treinamento

  5.1.6.1 Construção de elementos e eventos. Os segmentos do currículo consistem de módulos
  de treinamento. Os módulos de treinamento são, por sua vez, construídos de elementos ou
  eventos organizados em uma sequência lógica. Os segmentos e módulos do currículo devem ser
  construídos para que a instrução avance do conceito e da habilidade mais básicos para os
  mais avançados durante a abordagem da instrução. O escopo e o conteúdo de cada módulo de
  treinamento dependem da categoria de treinamento e do currículo no qual o segmento de currículo
  deve ser incorporado. O número e o conteúdo dos módulos para um determinado segmento de
  currículo podem variar de uma categoria de treinamento para outra. Por exemplo, módulos
  de treinamento de solo da aeronave na categoria de treinamento de Elevação de Nível talvez
  não precisem ser tão abrangentes quanto os módulos de treinamento de solo da aeronave na
  categoria de treinamento Inicial do Equipamento. A quantidade de detalhes em cada módulo
  determina as horas de treinamento necessárias para completar o treinamento exigido por um
  segmento de currículo.

  5.1.6.2 Detalhamento da ementa de um módulo de treinamento. Os operadores devem elaborar
  ementas do módulo de treinamento com detalhes suficientes para garantir que a ANAC possa
  determinar se os itens essenciais do assunto foram abordados e que os requisitos regulamentares
  foram atendidos. A ementa do módulo de treinamento servirá como uma base a partir da qual
  o operador desenvolverá um material didático completo e utilizável e selecionará métodos
  apropriados de ensino. A eficácia do material didático e dos métodos de instrução não pode
  ser avaliada antes do início do treinamento e, portanto, será avaliada durante a fase 4
  do processo de aprovação.'
