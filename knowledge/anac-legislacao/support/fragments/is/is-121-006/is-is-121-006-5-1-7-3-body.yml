title: A Parte B ilustra as seis categorias de treinamento que são reconhecidas pela ANAC.
text: '5.1.7.3 A Parte B ilustra as seis categorias de treinamento que são reconhecidas pela
  ANAC.

  5.1.7.4 A Parte C é um exemplo de um currículo que é uma programação completa de treinamento
  específico para um tipo de aeronave e função. Este exemplo descreve um currículo de treinamento
  de transição PIC B-727.

  5.1.7.5 A Parte D é um exemplo de um segmento de currículo específico e mostra que ele consiste
  de vários módulos de treinamento. Este exemplo é o segmento de currículo de treinamento
  de voo do currículo de treinamento de transição PIC B-727.'
