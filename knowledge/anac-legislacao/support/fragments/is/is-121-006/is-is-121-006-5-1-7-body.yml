title: Representação esquemática genérica de um Programa de Treinamento
text: '5.1.7 Representação esquemática genérica de um Programa de Treinamento

  5.1.7.1 A representação no Apêndice A mostra a relação entre o programa de treinamento total
  e as categorias de treinamento, currículos, segmentos curriculares e módulos de treinamento.

  5.1.7.2 A Parte A representa componentes que, quando combinados, constituem o programa geral
  de treinamento de um operador. Alguns desses componentes devem ser especificamente aprovados
  pela ANAC (por exemplo, examinadores credenciados), enquanto outros são apenas aceitos como
  elementos de suporte (por exemplo, instalações).'
