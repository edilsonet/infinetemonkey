title: Instrutores de voo e de solo
text: '5.1.9 Instrutores de voo e de solo

  5.1.9.1 O operador deve estabelecer em seu programa de treinamento os critérios de conhecimentos,
  experiência, e atitudes, que garantam o cumprimento regulatório para a função apropriada
  do instrutor. Uma lista dos instrutores de voo e de solo deverá ser disponibilizada para
  a ANAC, assim como mantida atualizada.

  5.1.9.2 Instrutores de voo. Os instrutores de voo devem atender aos requisitos das seções
  121.412 e 121.414 do RBAC nº 121, que incluem a realização de treinamentos e exames específicos
  para o exercício dessa função numa determinada aeronave.

  5.1.9.3 Instrutores de solo. Conforme o parágrafo 121.401(a)(2) do RBAC nº 121, os instrutores
  de solo devem ser apropriadamente qualificados para os treinamentos que serão por eles ministrados.'
