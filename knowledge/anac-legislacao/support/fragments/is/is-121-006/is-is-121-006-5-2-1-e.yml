kind: is
document: is-121-006
family: '121'
section_id: 5.2.1
section_title: 'A seção 121.683 do RBAC nº 121 requer que cada operador mantenha registros
  atualizados de cada tripulante e cada DOV ao menos sobre seguintes assuntos:'
subsection_id: e
cite: 5.2.1(e)
title: 5.2.1(e)
text: 'e) dispensas de emprego.

  5.2.2 O operador deve descrever em seu PTO o conteúdo, a forma de organização dos registros
  e os requisitos de conservação, conforme este item 5.2 desta IS. Deve ainda, conforme o
  parágrafo 119.59(b)(1)(ii) do RBAC nº 119, indicar a localização (a base principal de operações
  ou o endereço específico) e as pessoas ou cargos responsáveis pela conservação desses registros.

  5.2.3 Os registros devem ser organizados de forma a facilitar o planejamento de treinamentos
  e exames, o controle de validade de qualificações, habilitações e certificados, e ainda
  a demonstração de cumprimento de requisitos do RBAC nº 121 durante inspeções da ANAC.'
