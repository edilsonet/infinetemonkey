title: 5.2.4(b)
text: 'b) separados pelos currículos realizados. Para cada currículo realizado deve existir
  uma página de índice que:

  I. indique o cumprimento dos pré-requisitos definidos pelo RBAC ou pelo operador para ingresso
  no currículo; e

  II. liste os documentos que demonstram a realização dos segmentos de currículo e exames
  (ex: certificados de conclusão, fichas de instrução, fichas de avaliação) requeridos pelo
  PTO; e'
