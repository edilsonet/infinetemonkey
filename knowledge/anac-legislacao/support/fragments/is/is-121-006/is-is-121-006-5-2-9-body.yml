text: '5.2.9 Os exames devem ser documentados por meio das fichas de avaliação, tanto em casos
  de sucesso quanto de insucesso.

  5.2.10 Todos os registros requeridos pela seção 121.683, do RBAC nº 121, devem ser mantidos
  atualizados durante todo o período de emprego do tripulante ou DOV no operador, e por ao
  menos 12 meses após dispensa de emprego ou desqualificação profissional ou por saúde.

  5.3 Processo de aprovação do Programa de Treinamento Operacional'
