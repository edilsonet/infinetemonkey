text: '5.3.1 Generalidades

  5.3.1.1 As aprovações de um currículo de treinamento seguem o processo geral de cinco fases
  descrito na IS nº 121-010 (Sistema de documentos de segurança operacional). Apesar de as
  etapas básicas deste processo deverem ser obrigatoriamente seguidas durante o processo de
  análise e aprovação do PTO, as fases serão ajustadas de acordo com as características de
  cada processo e de cada PTO. A duração do processo de aprovação dependerá da complexidade
  do pedido do operador. O processo de aprovação aplica-se a cada operador solicitando a aprovação
  de um novo currículo ou uma revisão de um currículo atualmente aprovado. A ANAC negará a
  aprovação de qualquer treinamento que não atenda aos requisitos regulamentares ou que tenha
  sido considerado deficiente. Caso sejam identificadas deficiências em currículos de treinamento
  que já receberam aprovação, a ANAC notificará o operador e estabelecerá um prazo para a
  adequação do PTO. Caso o prazo para correção não seja respeitado, a aprovação dos currículos
  de treinamento envolvidos poderá ser revogada.'
