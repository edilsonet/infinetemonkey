title: Fase 1 - Orientação prévia
text: '5.3.2 Fase 1 - Orientação prévia

  5.3.2.1 Esta fase será iniciada, tão logo a empresa aérea entre em contato com a ANAC e
  informe que deseja orientações sobre aprovação inicial ou revisão do PTO aprovado (incluindo
  revisão solicitada pela ANAC).

  5.3.2.2 A ANAC fornecerá ao operador orientações sobre o desenvolvimento do currículo de
  treinamento e a estrutura do PTO, material didático, instalações, qualificações dos instrutores
  e outras necessidades propostas pelo operador. O operador será informado sobre o procedimento
  para solicitar a aprovação inicial e sobre os tipos de informações adicionais de suporte
  que a ANAC exigirá que o operador envie. A ANAC e o operador deverão estabelecer, por meio
  de reuniões, contatos telefônicos ou comunicação eletrônica, um entendimento comum sobre
  os requisitos aplicáveis ao treinamento e as orientações fornecidas nesta IS.'
