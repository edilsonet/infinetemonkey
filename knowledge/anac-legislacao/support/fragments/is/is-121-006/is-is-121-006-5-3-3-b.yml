text: b) lista de instrutores de solo e voo e suas qualificações. Esta informação é particularmente
  importante se o operador pretender utilizar instrutores contratados. A ANAC irá avaliar
  se os instrutores propostos atendem aos requisitos regulamentares e são qualificados para
  ministrar os treinamentos necessários. Este item é obrigatório no caso de certificação inicial
  do operador e inclusão de novos modelos de aeronave nas EO;
