title: 5.3.3(c)
text: c) descrição detalhada dos dispositivos de treinamento (GTD ou FSTD). Apropriada quando
  o dispositivo não está prontamente disponível para avaliação da ANAC. É particularmente
  importante quando o operador pretende contratar um dispositivo de treinamento que não tenha
  sido previamente aprovado ou qualificado pela ANAC ou no caso de FSTD reconhecido como parte
  da convalidação de certificado de centro de treinamento estrangeiro. Esta descrição deve
  fornecer informações suficientemente detalhadas para permitir à ANAC avaliar se o treinamento
  e os exames a serem conduzidos são apropriados ao nível do dispositivo de treinamento.
