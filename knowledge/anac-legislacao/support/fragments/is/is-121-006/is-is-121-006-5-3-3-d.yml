cite: 5.3.3(d)
title: 5.3.3(d)
text: d) registros do treinamento. Cópias de formulários de treinamento a serem usados para
  registrar o progresso do aluno e a conclusão do treinamento podem ser necessárias. Isso
  garante que o operador tenha planejado os currículos conforme os requisitos do RBAC nº 121.
  Este tipo de informação deve ser exigido das empresas em processo de certificação ou com
  revisão significativa dos conteúdos dos programas de treinamento. Esses formulários, registros
  ou planilhas devem ser projetados de modo que as informações de conclusão do curso sejam
  registradas e os dados possam ser recuperados para verificar a conformidade com a regulamentação.
  Conforme o parágrafo 121.401(f)(3) do RBAC nº 121, para os registros mantidos em formato
  digital, é necessário que o operador apresente os sistemas que garantam a confiabilidade,
  integridade e rastreabilidade dos dados.
