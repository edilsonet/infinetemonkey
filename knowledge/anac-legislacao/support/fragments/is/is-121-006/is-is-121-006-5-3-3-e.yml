title: 5.3.3(e)
text: 'e) informações de apoio. Podem incluir amostras de material didático, planos de aula
  e guias de instrutores. Podem incluir ainda informações extras sobre outros tipos de cursos,
  tais como estudos à distância, instrução computadorizada (CBT) e cenários de treinamento
  LOFT (Line-Oriented Flight Training), de forma suficientemente detalhadas para fornecer
  uma compreensão sobre, por exemplo, como o treinamento será administrado, o método de instrução
  proposto, a interação entre instrutor e aluno, método para avaliar o aprendizado dos alunos,
  etc.

  5.3.3.3 Nesta fase a ANAC irá revisar os documentos protocolados a fim de garantir sua integridade,
  completude e admissibilidade para as fases posteriores do processo. O exame detalhado dos
  documentos não é realizado durante a fase dois. Se, após a revisão inicial, os documentos
  forem considerados completos e de qualidade aceitável (ou se pequenas deficiências forem
  rapidamente resolvidas pelo operador), a ANAC iniciará a fase de avaliação detalhada. Por
  outro lado, se a submissão for considerada incompleta ou obviamente inaceitável, o processo
  de aprovação será interrompido, e o operador será notificado das deficiências. O processo
  de aprovação será retomado quando as não conformidades forem sanadas.

  5.3.3.4 Empresas em estágio inicial de certificação. Um operador solicitante de um COA nos
  estágios iniciais da certificação pode não conseguir fornecer todas as informações necessárias
  para o seu programa de treinamento. Por exemplo, o candidato pode ainda não saber quais
  instalações de treinamento ou dispositivos de treinamento pretende usar. A falta de tal
  informação na solicitação formal não indica necessariamente que o currículo de treinamento
  será rejeitado. A ANAC poderá iniciar a análise do material mesmo que as informações não
  estejam completas. A aprovação inicial, no entanto, de um segmento de currículo será retida
  até que todas as partes pertinentes tenham sido examinadas. Por exemplo, excepcionalmente
  a ANAC pode aprovar inicialmente um segmento de currículo de treinamento de solo, mesmo
  que o FSTD ainda não tenha sido avaliado e aprovado para treinamento de voo. No entanto,
  uma avaliação efetiva dos currículos de treinamento pode ser dificultada quando um número
  excessivo de segmentos de currículos incompletos é permitido.'
