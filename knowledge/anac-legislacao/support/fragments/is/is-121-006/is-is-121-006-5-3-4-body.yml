text: '5.3.4 Fase 3 - Avaliação detalhada

  5.3.4.1 A terceira fase é iniciada quando a ANAC começa uma análise detalhada e avaliação
  de um currículo de treinamento ou segmento de currículo. O objetivo desta fase é determinar
  a adequação dos currículos de treinamento para aprovação inicial. Esta fase termina com
  a aprovação inicial ou com a rejeição total, ou parcial, do currículo de treinamento.

  5.3.4.2 Se, depois de concluir essas avaliações, a ANAC determinar que o currículo ou segmento
  de currículo é satisfatório, que tem o suporte adequado e que as horas de treinamento são
  realistas, a aprovação inicial será concedida. Eventualmente apenas parte do que foi apresentado
  será considerada satisfatória. No entanto, se essa parte for dependente de outras que ainda
  não foram desenvolvidas ou de outra parcela insatisfatória, a aprovação inicial será retida.
  Por exemplo: um Currículo Inicial de Equipamento PIC B-737, segmento de currículo de treinamento
  de voo é satisfatório, mas os módulos de treinamento relacionados no segmento de currículo
  de treinamento de solo são insatisfatórios. Nesse caso, será inapropriado conceder a aprovação
  inicial até que o segmento do currículo de treinamento de solo seja determinado como satisfatório.

  5.3.4.3 Emissão da aprovação inicial. Caso os currículos de treinamento obtenham a aprovação
  inicial, os exemplares do PTO deverão exibir em sua primeira página o formulário FOP 111
  referente à concessão da aprovação inicial, independente do meio de disponibilização (físico
  ou digital). A aprovação inicial incluirá pelo menos as seguintes informações:'
