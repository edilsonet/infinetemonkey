  5.3.4.4 Indeferimento da aprovação inicial. Se a ANAC determinar que a aprovação inicial
  de um currículo de treinamento proposto ou segmento de currículo deve ser negada, o operador
  será notificado dos motivos do indeferimento, identificando as áreas deficientes do currículo
  de treinamento. É responsabilidade do operador reconstruir ou corrigir a área deficiente
  antes da reenvio para a ANAC.'
