title: Fase 4 - Demonstrações e inspeções
text: '5.3.5 Fase 4 - Demonstrações e inspeções

  5.3.5.1 A fase 4 inicia-se quando o operador começa a treinar no currículo com aprovação
  inicial. O operador deve fornecer a programação de todos os treinamentos e exames a serem
  realizados em um currículo inicialmente aprovado, de modo a propiciar oportunidades de inspeções
  da ANAC. Sempre que possível, a primeira sessão de treinamento realizada após a aprovação
  inicial será acompanhada e avaliada pela ANAC. Uma amostragem suficiente das sessões de
  treinamento será observada, até que a ANAC possua uma avaliação realista do PTO aprovado.
  Durante a instrução sob aprovação inicial, espera-se que o operador avalie e ajuste adequadamente
  os métodos de treinamento conforme necessário e conforme comunicado oficialmente pela ANAC,
  após as inspeções de acompanhamento de programa de treinamento. Muitas vezes, os ajustes
  podem ser feitos alterando o material didático e/ou o método de ensino sem alterar o currículo
  inicialmente aprovado (ou com apenas correções minoritárias). Por outro lado, pode ser necessário
  que o operador altere substancialmente o currículo, o que pode exigir outra emissão de aprovação
  inicial pela ANAC antes que as mudanças possam ser implementadas. A ANAC também poderá solicitar
  que o operador aplique novamente o treinamento acompanhado, à mesma turma de tripulantes
  ou DOVs, caso o resultado não tenha sido satisfatório.

  5.3.5.2 Durante a fase 4, o operador deve demonstrar a capacidade de treinar efetivamente
  os tripulantes e DOVs. Cada deficiência identificada durante a avaliação do treinamento
  realizado sob um currículo inicialmente aprovado será apontada e discutida com o operador.
  As deficiências serão documentadas e registradas no processo administrativo da análise do
  programa de treinamento. Cada deficiência que foi identificada deve ser imediatamente corrigida.
  Se um operador não tomar as medidas corretivas adequadas, a ANAC poderá revogar formalmente
  a aprovação inicial, devendo, nesse caso, comunicar o operador dessa decisão (vide item
  5.6 desta IS).'
