text: '5.3.6.1 Esta fase envolve a concessão de aprovação final do currículo de treinamento
  de um operador, por meio da emissão do FOP 111.

  5.3.6.2 Com base nos resultados da avaliação realizada na fase 4, a ANAC irá determinar
  se deve conceder ou indeferir a aprovação final de um currículo de treinamento.

  5.3.6.3 Caso os currículos de treinamento obtenham a aprovação final, os exemplares do manual
  PTO deverão exibir em sua primeira página o formulário FOP 111 referente à concessão da
  aprovação final, independente do meio de disponibilização (físico ou digital).

  5.4 Autorização para realização de treinamento antes da aprovação inicial

  5.4.1 Conforme previsto no parágrafo 121.405(b) do RBAC nº 121, a ANAC pode autorizar que
  o operador inicie a condução do treinamento antes da obtenção da aprovação inicial, mediante
  solicitação do operador. Após análise da solicitação, se considerada satisfatória, autorização
  será concedida por ofício. Para tanto, as seguintes condições devem ser atendidas:'
