text: 'g) proposta para reduzir o número aprovado de horas de treinamento.

  5.6 Revogação da aprovação do Programa de Treinamento

  5.6.1 Todas as deficiências constatadas pela ANAC, sejam em um currículo ou segmento de
  currículo com aprovação inicial ou final, serão comunicadas ao operador para que sejam aplicadas
  as ações corretivas necessárias. Deficiências graves, ou não corrigidas dentro do prazo
  requerido, poderão resultar na revogação da aprovação. No caso de deficiências em currículo
  ou segmento de currículo com aprovação inicial, constatadas durante inspeção de acompanhamento
  com vistas à aprovação final, a ANAC pode requerer que a ação corretiva seja aplicada imediatamente
  para que o treinamento sendo acompanhado seja considerado válido.

  5.6.2 A aprovação do currículo ou segmento de currículo será revogada caso as tentativas
  de sanar as deficiências constatadas não tenham sucesso. Com a revogação da aprovação de
  um currículo ou segmento de currículo, o operador estará impedido de ministrar tais treinamentos
  aos tripulantes e DOVs, e, caso o faça, os treinamentos não serão considerados válidos pela
  ANAC. Nesse caso, o operador deverá dedicar os esforços necessários para sanar as deficiências
  e conseguir novamente a aprovação, pois suas operações podem ser severamente limitadas com
  a manutenção da revogação. O acúmulo ou a manutenção por tempo excessivo de revogações de
  aprovação de currículos ou segmentos de currículos pode resultar em uma suspensão do COA
  do operador.

  5.6.3 De acordo com o parágrafo 121.405(e) do RBAC nº 121, caso a ANAC determine que alterações
  em um currículo ou segmento de currículo são necessárias, o operador terá 30 dias após o
  recebimento da notificação para revisar o programa de treinamento e solicitar nova aprovação
  final ou recorrer da determinação. Caso a ANAC tenha determinado as alterações pela identificação
  de uma situação de risco iminente, o operador deve aplicar as alterações imediatamente,
  ainda que pretenda recorrer da determinação. A determinação pela ANAC de alterações em um
  currículo ou segmento de currículo, em qualquer situação, revoga a aprovação final.

  5.6.4 Se o operador optar por revisar o programa de treinamento em resposta à revogação
  de um currículo ou segmento de currículo, a revisão proposta será processada da mesma maneira
  que um pedido de aprovação inicial, por meio do processo de cinco fases descrito anteriormente.

  5.6.5 Se um operador decidir recorrer da decisão de revogação, este deve formalizar o recurso
  em até 30 dias após receber a notificação. O recurso deve conter uma explicação detalhada
  sobre o motivo pelo qual o operador acredita que as alterações descritas no ofício de revogação
  são desnecessárias ou inadequadas. Se, após o recebimento do recurso, a ANAC identificar
  uma situação de risco iminente, o operador será notificado de que deve aplicar as alterações
  imediatamente. Se não for identificada situação de risco iminente, o recurso será analisado
  cuidadosamente. Nesse caso, o recurso gera efeito suspensivo ao ofício de revogação e o
  operador poderá continuar a realizar treinamentos segundo o currículo anteriormente aprovado,
  enquanto aguarda decisão da ANAC. Após a análise do recurso, a ANAC poderá decidir pela
  manutenção da revogação, e o operador deverá aplicar as alterações no programa de treinamento,
  ou pela revisão da decisão de revogação.

  5.7 Vigilância do Programa de Treinamento

  5.7.1 O principal método de avaliação de programas de treinamento é o seu acompanhamento
  por servidores qualificados da ANAC. Entretanto, outras formas de avaliação podem ser utilizadas,
  como análise do controle e de registros de treinamento, relatórios de auditorias internas
  e externas, relatórios de investigação de acidentes, entre outros. Deficiências constatadas
  através de qualquer um desses métodos de avaliação pode resultar em solicitação por parte
  da ANAC de ações corretivas, ou mesmo revogação da aprovação de um currículo de treinamento.'
