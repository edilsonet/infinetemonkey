  de treinamento.'
text: '4.1.1 Carga horária: tempo necessário para se ministrar um segmento de currículo ou
  módulo de treinamento.

  4.1.2 Detentor de certificado: operador de serviço de transporte aéreo público que tenha
  recebido um certificado emitido de acordo com o RBAC 119. Nesta IS, abrange também o solicitante
  de um certificado a ser emitido de acordo com o RBAC 119. Também é denominado “operador”.

  4.1.3 Dispositivo de Treinamento para Simulação de Voo (Flight Simulation Training Device
  - FSTD): significa qualquer equipamento no qual as condições de voo podem ser simuladas
  no solo e que esteja qualificado pela ANAC. Compreende os Simuladores de Voo (Full Flight
  Simulator - FFS) e os Dispositivos de Treinamento de Voo (Flight Training Device - FTD).'
