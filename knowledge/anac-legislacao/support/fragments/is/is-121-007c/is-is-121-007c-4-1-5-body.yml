text: '4.1.5 Missões de voo: detalhamento das manobras, procedimentos e respectivas cargas
  horárias de cada missão de treinamento de voo em aeronave.

  4.1.6 Período de elegibilidade: de acordo com os parágrafos 121.401(e), 121.413(b) e 121.414(b)
  do RBAC nº 121, o tripulante pode realizar um treinamento ou exame no mês anterior ou posterior
  ao que o treinamento ou exame é requerido. Assim, o período de elegibilidade de um treinamento
  é composto por 3 meses (o mês anterior ao mês de referência, o próprio mês de referência
  e o mês posterior ao mês de referência). Caso o tripulante complete o treinamento ou o exame
  neste período de elegibilidade, independentemente do mês, deverá ser considerado que o treinamento
  ou o exame foi completado no mês de referência.

  4.1.7 Relatório de avaliação operacional: documento resultante da avaliação operacional,
  em conformidade com a IS nº 00-007 (ou regulamentação estrangeira correspondente).'
