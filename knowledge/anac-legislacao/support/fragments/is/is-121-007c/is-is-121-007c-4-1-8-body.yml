text: '4.1.8 Segmento de qualificação: parte do treinamento composta pelos exames e verificações
  requeridos.

  4.1.9 Sessões de simulador ou em dispositivos de treinamento: detalhamento das manobras,
  procedimentos e respectivas cargas horárias de cada sessão de treinamento em simulador de
  voo ou dispositivo de treinamento.

  4.2 Lista de abreviaturas:

  ACARS - Aircraft communication addressing and reporting system (sistema de comunicações
  e relatório de aeronaves)

  ACAS - Airborne collision avoidance system (sistema anticolisão de bordo)

  ADF - Automatic direction finder (indicador automático de direção)

  AFM - Aircraft flight manual (manual de voo aprovado do avião)

  AOM - Aircraft operating manual (manual de operações da aeronave)

  ANAC - Agência Nacional de Aviação Civil

  APU - Auxiliary power unit (unidade auxiliar de energia)

  ATIS - Automatic terminal information system (serviço automático de informação terminal)

  AVSEC - Aviation Security (segurança da aviação contra atos de interferência ilícita)

  CDL - lista de desvios de configuração

  CENIPA - Centro de Investigação e Prevenção de Acidentes Aeronáuticos

  COA - Certificado de Operador Aéreo

  CRM - Crew Resource Management

  DA - Diretriz de Aeronavegabilidade

  DECEA - Departamento de Controle do Espaço Aéreo

  DH - Decision height (altura de decisão)

  DME - distance measuring equipment (equipamento medidor de distância)

  EO - Especificações operativas

  ETOPS - Extended operations

  FAA - Federal Aviation Administration (Autoridade de Aviação Civil dos EUA)

  GPWS - Ground proximity warning system (sistema de alerta de aproximação com o solo)

  HF - High frequency

  IFR - Instrument flight rules (regras de voo por instrumentos)

  ILS - Instrument Landing System (Sistema de aproximação por instrumentos)

  INS - Inertial navigation system (sistema de navegação inercial)

  IRS - Inertial reference system (Sistema de referência inercial)

  IS - Instrução Suplementar

  MCV - Mecânico de voo

  MDA - Minimum descent altitude (altitude mínima de descida)

  MDR - Master difference requirements (requisitos de diferença master)

  MEL - Minimum equipment list (lista de equipamentos mínimos)

  OACI - Organização da Aviação Civil Internacional

  ODR - Operator difference requirements (requisitos de diferença do operador)

  PBN - Performance based navigation

  PIC - Pilot in Command (piloto em comando)

  PPSP - Programa de Prevenção do Risco Associado ao Uso Indevido de Substâncias Psicoativas

  RBAC - Regulamento Brasileiro de Aviação Civil

  RNAV - Area navigation

  RNP - Required navigation performance

  RVSM - Reduced vertical separation minimum

  SGSO - Sistema de gerenciamento da segurança operacional

  SIC - Second in Command (segundo em comando)

  TAWS - Terrain awareness and warning system (Sistema de alerta e percepção do terreno)

  TCAS - Traffic alert and collision avoidance system (sistema de alerta de tráfego e prevenção
  de colisões)

  SOP - Standard operating procedures (procedimentos operacionais padronizados)

  VFR - Visual flight rules (regras de voo visual)

  VHF - Very high frequency

  VOR - VHF Omni-Directional Range'
