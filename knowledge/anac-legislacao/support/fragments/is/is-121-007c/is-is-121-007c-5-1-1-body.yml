title: Esta IS se aplica a todos os detentores de certificado que realizam operações domésticas,
  de bandeira e suplementares.
text: '5.1.1 Esta IS se aplica a todos os detentores de certificado que realizam operações
  domésticas, de bandeira e suplementares.

  5.1.2 Esta IS se aplica, no que couber, aos detentores de certificado que realizam operações
  complementares com aviões com configuração para passageiros com mais de 19 assentos, excluindo-se
  os assentos para tripulantes, que, conforme o parágrafo 135.3(b) do RBAC nº 135, devem atender
  aos requisitos de treinamento e qualificação de tripulantes estabelecidos nas subpartes
  N e O do RBAC nº 121, em lugar dos requisitos das subpartes E, G e H do RBAC nº 135.

  5.1.3 Esta IS também se aplica a detentores de certificado que, conforme o parágrafo 135.3(c)
  do RBAC nº 135, tenham solicitados e tenham sido autorizados a atender aos requisitos de
  treinamento e qualificação de tripulantes estabelecidos nas subpartes N e O do RBAC nº 121,
  em lugar dos requisitos das subpartes E, G e H do RBAC nº 135 - sendo opcional atender aos
  requisitos de experiência operacional da seção 135.244 do RBAC nº 135 ou da seção 121.434
  do RBAC nº 121.'
