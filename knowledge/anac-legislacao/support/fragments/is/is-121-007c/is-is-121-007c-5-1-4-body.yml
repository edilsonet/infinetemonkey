text: '5.1.4 Esta IS não se aplica à elaboração de um programa de qualificação avançada (AQP),
  tratado na subparte Y do RBAC nº 121.

  5.2 Introdução

  5.2.1 Existem seis categorias de treinamento aplicáveis ao programa de treinamento de tripulantes
  de voo: inicial de nova contratação, inicial de equipamento, transição, elevação de nível,
  periódico e requalificação.'
