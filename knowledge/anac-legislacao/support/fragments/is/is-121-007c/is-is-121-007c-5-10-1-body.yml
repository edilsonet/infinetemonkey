text: '5.10.1 Generalidades

  5.10.1.1 Esta seção contém informações, diretrizes e orientações a serem usadas pelos operadores
  na elaboração dos currículos de treinamento periódico dos tripulantes de voo. As informações
  incluem os objetivos e o conteúdo desses currículos. A categoria de treinamento periódico
  é aplicável para os tripulantes de voo que foram previamente treinados e qualificados pelo
  operador, que continuam trabalhando no mesmo tipo de aeronave e função a bordo e que devem
  receber treinamento periódico e/ou serem examinados dentro de um período de elegibilidade
  específico para manter a qualificação. Segundo RBAC nº 121, o currículo de treinamento periódico
  dos tripulantes de voo contém os seguintes segmentos de currículo: treinamento de emergências
  gerais, treinamento de solo da aeronave, treinamento de voo e qualificação. Segmentos de
  currículo de diferenças e especiais também podem ser incluídos, quando aplicável.'
