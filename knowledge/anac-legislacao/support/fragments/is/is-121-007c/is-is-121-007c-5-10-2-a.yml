section_title: Objetivo do treinamento periódico
subsection_id: a
cite: 5.10.2(a)
title: 5.10.2(a)
text: a) o RBAC nº 121 exige que todos os assuntos e tópicos necessários no treinamento inicial
  sejam cobertos no treinamento periódico. Os tripulantes de voo devem permanecer proficientes
  nessas matérias caso continuem a trabalhar na mesma aeronave e função a bordo. Os operadores
  devem fornecer treinamento suficiente para garantir que os tripulantes de voo permaneçam
  proficientes. O treinamento necessário para atingir este objetivo deve ser administrado
  mesmo que seja superior aos tópicos listados ou à carga horária agendada;
