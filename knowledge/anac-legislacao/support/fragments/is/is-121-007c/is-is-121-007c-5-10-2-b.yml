section_title: Objetivo do treinamento periódico
subsection_id: b
cite: 5.10.2(b)
title: 5.10.2(b)
text: b) o RBAC nº 121 não exige que todos os assuntos e tópicos sejam revistos a cada ciclo
  de treinamento. Os operadores devem desenvolver os currículos de treinamento periódico com
  os diferentes tópicos e elementos que serão enfatizados em cada ciclo de treinamento. Assim,
  quando um elemento for ministrado, ele o será na profundidade adequada;
