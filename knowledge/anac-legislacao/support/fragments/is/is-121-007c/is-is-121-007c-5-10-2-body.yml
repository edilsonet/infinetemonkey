text: '5.10.2 Objetivo do treinamento periódico

  5.10.2.1 O objetivo do treinamento periódico é assegurar que os tripulantes de voo continuem
  familiarizados e proficientes em seu tipo específico de aeronave e função a bordo. O treinamento
  periódico também oferece aos operadores a oportunidade de apresentar aos tripulantes de
  voo mudanças nos procedimentos operacionais, nos deveres e responsabilidades da tripulação
  e evoluções dentro do ambiente operacional e da indústria de aviação.

  5.10.2.2 Os operadores devem garantir que os tripulantes realizem a carga horária de instrução
  necessária para cada ciclo de treinamento periódico e dentro do período estabelecido pelo
  RBAC nº 121. Além disso, os operadores devem considerar que, embora um tripulante tenha
  satisfeito o RBAC nº 121, talvez os objetivos do treinamento não tenham sido cumpridos.
  O operador deve considerar o objetivo cumprido somente quando o tripulante estiver apto
  a trabalhar no nível de proficiência exigido imediatamente antes de passar para o próximo
  ciclo de treinamento.

  5.10.2.2.1 Os operadores devem avaliar os segmentos de currículo do treinamento periódico
  para garantir que os assuntos sejam apropriados, bem como seu escopo e profundidade. O treinamento
  dado pelo operador em cada segmento deve atender ao objetivo desse segmento. Uma vez que
  existem limites quanto à quantidade de treinamento periódico que pode ser razoavelmente
  fornecido, os operadores devem assegurar que o tempo destinado ao treinamento seja usado
  de forma eficaz e eficiente. Os operadores devem considerar o seguinte:'
