title: 5.10.2(d)
text: d) os syllabi do treinamento periódico (não necessariamente os descritivos do currículo)
  devem ser revisados ​​com frequência (de preferência anualmente). Os operadores devem remover
  qualquer material desnecessário, desatualizado, supérfluo ou inapropriado e substituí-lo
  por material atualizado e oportuno. Os operadores devem elaborar os descritivos dos segmentos
  de currículo de treinamento periódico de modo a permitir variações nos syllabi em ciclos
  de treinamento subsequentes, sem que haja necessidade de nova aprovação do programa de treinamento;
