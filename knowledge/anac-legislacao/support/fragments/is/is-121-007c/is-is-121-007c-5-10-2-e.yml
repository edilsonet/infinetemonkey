subsection_id: e
cite: 5.10.2(e)
title: 5.10.2(e)
text: e) os operadores devem usar pré-testes ou outros métodos para identificar as áreas em
  que tripulantes de voo estão deficientes. Embora os operadores não tenham que fornecer treinamento
  nas áreas em que os tripulantes demonstram competência, eles devem, no entanto, ser capazes
  de identificar áreas com deficiências e conduzir treinamento para proficiência nessas áreas.
