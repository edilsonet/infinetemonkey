title: Mês do treinamento/exame e períodos de elegibilidade
text: '5.10.3 Mês do treinamento/exame e períodos de elegibilidade

  5.10.3.1 Para que os tripulantes de voo sejam designados para operações comerciais, o RBAC
  nº 121 exige que eles concluam vários eventos de treinamento e exames periódicos a cada
  12 meses. Quando o operador adotar uma abordagem modular para o treinamento periódico, todos
  esses elementos e eventos de treinamento devem ser agrupados em módulos específicos para
  serem administrados e registrados como um segmento de currículo de treinamento periódico.
  Quando o operador não adotar uma abordagem de treinamento modular, para cada tripulante
  de voo devem ser mantidos registros da realização de cada elemento do treinamento requerido,
  e cada elemento ou evento deve ser agendado separadamente. Os operadores devem usar as seguintes
  diretrizes e orientações sobre os eventos de treinamento e exames periódicos:

  5.10.3.1.1 Designação do mês de treinamento/exame (mês de referência). Quando um tripulante
  de voo completar um programa de treinamento inicial, de transição, de elevação de nível
  ou de requalificação dentro de um período de 3 meses calendáricos, o mês em que o segmento
  de currículo de qualificação for concluído será considerado o mês de treinamento/exame (mês
  de referência) do tripulante. Se o treinamento for concluído dentro do período de 3 meses,
  o operador poderá fazer um único registro de todo o currículo sem detalhar quando os eventos
  individuais ocorreram. A programação subsequente do treinamento periódico poderá então ser
  baseada no mês de referência. No entanto, se o tempo necessário para completar o treinamento
  inicial, de transição, de elevação de nível ou de requalificação exceder 3 meses calendáricos,
  então o operador deverá agendar e registrar a realização dos eventos periódicos separadamente.


  5.10.3.1.2 Ajuste do mês de treinamento/exame (mês de referência). Os operadores podem ajustar
  o mês de referência de um tripulante de voo ao administrar treinamento e qualificação periódicos.
  Quando o treinamento for realizado antes do vencimento, os operadores devem garantir que
  todos os requisitos sejam cumpridos dentro dos 12 meses calendáricos permitidos pelo regulamento.
  Os requisitos são por vezes omitidos quando um tripulante de voo completa um currículo de
  treinamento inicial, de transição ou de elevação de nível em algum momento diferente do
  período de elegibilidade anterior. Quando um mês de base for ajustado, o motivo do ajuste
  deve ser anotado no registro do tripulante de voo. Um sistema de códigos para esse ajuste
  pode ser usado para sistemas de registros computadorizados.

  5.10.3.1.3 Período de elegibilidade. Um tripulante de voo que não tenha completado todos
  os requisitos de treinamento e exames periódicos no mês de referência poderá ser designado
  para servir em operações comerciais durante o restante do período de elegibilidade (conforme
  definido em 4.1.7 desta IS), mas não depois disso. Um tripulante de voo que não completar
  todos os módulos de treinamento e qualificação requeridos dentro do período de elegibilidade
  deverá completar o treinamento de requalificação antes de servir novamente em operações
  comerciais.'
