title: Segmento de currículo de solo periódico
text: '5.10.4 Segmento de currículo de solo periódico

  5.10.4.1 Os operadores devem garantir que o treinamento de solo da aeronave periódico inclua
  instrução em três áreas: assuntos operacionais gerais, sistemas de aeronaves e integração
  de sistemas. Treinamentos de diferenças e operações especiais também podem ser necessários.
  O RBAC 121.427 exige que o treinamento de solo da aeronave periódico contenha instrução
  nos mesmos assuntos necessários para o treinamento inicial. Este requisito não significa
  que cada elemento do treinamento inicial deva ser realizado a cada ciclo de treinamento
  periódico. Significa que as áreas temáticas pertinentes devam ser realizadas com frequência
  suficiente para garantir que os tripulantes de voo permaneçam competentes no desempenho
  de suas funções. Os regulamentos também exigem que certos assuntos, como o treinamento de
  emergências, sejam cobertos a cada ano.

  5.10.4.2 Carga horária. As cargas horárias do treinamento de solo devem ser especificadas
  no respectivo segmento do currículo de treinamento periódico. No entanto, é possível que
  os operadores sejam demandados a conduzir mais do que a carga horária mínima estabelecida
  no regulamento para atingir o objetivo do treinamento. O RBAC 121.427 (b)(2) dispõe que
  o treinamento em todos os elementos que são requeridos no treinamento de solo da aeronave
  inicial deve ser dado "como apropriado" no treinamento periódico. Um meio aceitável de construir
  segmentos de currículo do treinamento periódico é focar em um ou dois módulos dentro de
  cada área temática. Durante o treinamento periódico, módulos adicionais podem ser realizados
  nos ciclos de treinamento subsequentes até que todas as áreas do treinamento inicial tenham
  sido completamente revistas. Um ciclo completo não deve exceder 3 anos.

  5.10.4.3 Treinamento de diferenças e operações especiais. Quando treinamento de diferenças
  ou operações especiais forem aplicáveis, eles devem ser incluídos nos currículos de treinamento
  periódicos. Este treinamento pode ser apresentado como um segmento de currículo separado
  e distinto ou pode ser integrado em outros módulos. Uma maneira efetiva para o operador
  conduzir treinamento de diferenças é discutir as diferenças em sistemas e procedimentos
  individuais como parte integral do treinamento. Os métodos de treinamento e nível de diferenças
  estabelecidos nos relatórios de avaliação operacional determinarão se as diferenças podem
  ser efetivamente integradas ou se um segmento de currículo separado é necessário. Quando
  operações especiais são realizadas, módulos de treinamento especiais são normalmente necessários,
  em vez de integrar o treinamento em outros segmentos. O treinamento periódico também deve
  incluir informações atualizadas sobre equipamentos, práticas e procedimentos operacionais,
  informações de acidentes e incidentes, e áreas que exigem ênfase como resultado dos exames
  de voo, exames de proficiência e exames em rota.'
