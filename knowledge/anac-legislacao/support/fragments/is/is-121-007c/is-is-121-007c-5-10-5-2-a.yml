section_id: 5.10.5.2
section_title: 'Composição dos módulos de teste escrito e oral. O módulo de teste oral ou
  escrito deve conter três conjuntos distintos de elementos de teste:'
subsection_id: a
cite: 5.10.5.2(a)
title: 5.10.5.2(a)
text: a) o primeiro conjunto de elementos deve ser de natureza geral e cobrir as disposições
  aplicáveis ​​dos RBAC/RBHA 61, 63, 91, 119 e 121; as EO do operador; e o sistema de manuais
  do operador. Este segmento só precisa ser completado uma vez durante cada ciclo de qualificação
  e não precisa ser repetido se o tripulante de voo estiver qualificado em mais de uma aeronave;
