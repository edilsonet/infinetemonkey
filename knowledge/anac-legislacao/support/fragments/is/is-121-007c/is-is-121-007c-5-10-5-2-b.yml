section_id: 5.10.5.2
section_title: 'Composição dos módulos de teste escrito e oral. O módulo de teste oral ou
  escrito deve conter três conjuntos distintos de elementos de teste:'
subsection_id: b
cite: 5.10.5.2(b)
title: 5.10.5.2(b)
text: b) o segundo conjunto de elementos inclui sistemas de aeronaves, procedimentos operacionais,
  peso balanceamento, segurança operacional no aeroporto em solo e dados de desempenho relativos
  a cada modelo específico de aeronave. Esta parte do módulo de teste deve ser completada
  para cada modelo de aeronave em que o tripulante de voo irá servir. Quando o tripulante
  de voo está qualificado para servir em mais de uma variante de uma aeronave, um segmento
  de teste de diferenças escrito ou oral também é necessário; e
