section_id: 5.10.5.2
section_title: 'Composição dos módulos de teste escrito e oral. O módulo de teste oral ou
  escrito deve conter três conjuntos distintos de elementos de teste:'
subsection_id: c
cite: 5.10.5.2(c)
title: 5.10.5.2(c)
text: c) O terceiro conjunto de elementos de teste consiste em operações especiais ou únicas.
  O conteúdo desse conjunto pode variar com autorizações constantes nas EO, com o modelo de
  avião, e ainda com as operações que o tripulante está autorizado a conduzir. O teste sobre
  operações especiais pode ser incluído nas partes gerais ou específicas da aeronave, conforme
  apropriado.
