title: Testes escritos ou orais
text: '5.10.5 Testes escritos ou orais

  5.10.5.1 O teste escrito ou oral é um módulo obrigatório dos exames de voo e de proficiência
  periódicos do RBAC nº 121. Este teste pode ser realizado em conjunto com o módulo de exame
  em voo ou separadamente. O teste deve ser realizado dentro do período de elegibilidade do
  tripulante de voo.'
