title: Segmento de currículo de emergências gerais periódico
text: '5.10.6 Segmento de currículo de emergências gerais periódico

  5.10.6.1 Operadores do RBAC nº 121 são obrigados a realizar treinamento periódico de emergências
  gerais. Este segmento de currículo deve ser separado do segmento de currículo de solo da
  aeronave periódico. O treinamento periódico de emergências gerais consiste de módulos sobre
  equipamentos de emergência e situações de emergência. A seção 5.4 desta IS contém diretrizes
  e orientações sobre o escopo e o conteúdo dos módulos de treinamento de emergências gerais,
  incluindo o detalhamento sobre treinamentos periódicos.'
