text: '5.10.7.4 Mecânicos de voo. Para o treinamento periódico, os mecânicos de voo devem
  ter completado um exame de voo dentro de 12 meses calendáricos.

  5.10.7.5 Múltiplos tipos de aeronave. Quando um tripulante de voo opera mais de um tipo
  de aeronave, o mês de treinamento/exame para cada avião é o mesmo mês do calendário em que
  foi realizado o exame original no tipo de avião. Os operadores geralmente consideram vantajoso
  alinhar o mês de treinamento/exame no segundo avião 6 meses calendáricos após o mês de treinamento/exame
  no primeiro avião.

  5.11 Currículo de treinamento de requalificação'
