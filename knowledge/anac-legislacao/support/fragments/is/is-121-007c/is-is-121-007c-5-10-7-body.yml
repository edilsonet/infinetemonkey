title: Segmento de treinamento de voo e de qualificação periódico
text: '5.10.7 Segmento de treinamento de voo e de qualificação periódico

  5.10.7.1 Seção 121.433(c)(1)(i). O RBAC 121.433(c)(1)(i) exige que todos os tripulantes
  de voo concluam satisfatoriamente um segmento de currículo de treinamento de voo periódico
  e um exame de voo ou de proficiência, conforme aplicável, dentro dos 12 meses precedentes
  em cada tipo de avião em que o tripulante irá servir.

  5.10.7.2 Exame de proficiência para piloto em comando. O RBAC 121.441 exige que o piloto
  em comando tenha completado um exame de proficiência nos últimos 12 meses calendáricos.
  Se o piloto em comando serve em mais de um tipo de avião, o RBAC 121.433 exige que ele tenha
  completado o exame de proficiência em cada tipo de avião nos 12 meses calendáricos anteriores.

  5.10.7.3 Exame de proficiência para segundo em comando. O RBAC 121.441 exige que o segundo
  em comando tenha completado um exame de proficiência nos últimos 12 meses calendáricos.
  Se o segundo em comando serve em mais de um tipo de avião, ele deve completar o exame de
  proficiência em cada tipo de avião nos 12 meses calendáricos anteriores.'
