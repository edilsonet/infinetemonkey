text: '5.11.1 Generalidades

  5.11.1.1 Esta seção contém informações, diretrizes e orientações a serem usadas pelos operadores
  para elaboração e aprovação dos currículos de treinamento de requalificação. Nesta seção,
  uma definição formal de treinamento de requalificação é fornecida, pois essa definição não
  consta nos regulamentos. Uma vez que tripulantes de voo qualificados para operações comerciais
  segundo o RBAC nº 121 às vezes perdem sua qualificação, é útil para os operadores ter uma
  definição de treinamento de requalificação, incluindo seus motivos e objetivos.

  5.11.1.2 Definição. Para os propósitos desta IS, o treinamento de requalificação é definido
  como aquela categoria de treinamento conduzida especificamente para restabelecer o status
  de qualificação de um tripulante de voo previamente qualificado. O currículo de treinamento
  de requalificação do operador deve conter a função a bordo específica e o tipo de aeronave
  para as operações aplicáveis. Para ser elegível para treinamento em um currículo de requalificação,
  um tripulante de voo deve ter sido previamente qualificado nesse tipo de aeronave e função
  a bordo e, posteriormente, perdido essa qualificação.

  5.11.1.3 Motivos para os tripulantes de voo perderem a qualificação. Um tripulante de voo
  pode ser simultaneamente qualificado em uma aeronave e função a bordo e não qualificado
  em outra. Um tripulante de voo pode perder o status de qualificação e se tornar "não qualificado"
