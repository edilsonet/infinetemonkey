text: '5.11.2 Reestabelecimento da experiência recente de pilotos

  5.11.2.1 O RBAC 121.439(a) exige que cada piloto operando segundo o RBAC nº 121 realize
  pelo menos três decolagens e três pousos no tipo de avião em que trabalha dentro dos 90
  dias consecutivos precedentes, podendo ser utilizado simulador com sistema de visualização
  e aprovado segundo 121.407 para manobras de pouso e decolagem. O piloto que falha em cumprir
  esse requisito não está qualificado para operar segundo o RBAC nº 121. Nesse caso, o segmento
  de currículo de qualificação para treinamento de requalificação consiste em um módulo de
  experiência ou módulo básico de exame (exame de proficiência) de acordo com o Apêndice F
  do RBAC nº 121. Os segmentos de currículo de treinamento de solo e voo geralmente não são
  necessários. Os operadores devem garantir que os módulos de treinamento de requalificação
  para recuperação de experiência recente atendam aos critérios abaixo.

  5.11.2.2 Módulo de qualificação. Um módulo de qualificação de experiência recente com pelo
  menos três decolagens e três pousos pode realizado atendendo aos seguintes critérios:'
