section_title: Reestabelecimento da experiência recente de pilotos
subsection_id: c
cite: 5.11.2(c)
title: 5.11.2(c)
text: 'c) um simulador de voo nível A. Nesse caso, o piloto deve possuir pelo menos 100 horas
  de voo no tipo de avião. O piloto também deve ser observado posteriormente durante os dois
  primeiros pousos nas operações de linha por um examinador credenciado. O piloto não pode
  realizar aproximações para mínimos inferiores à CAT I, até que este requisito tenha sido
  cumprido. Os pousos devem ser feitos dentro de 45 dias após a conclusão do treinamento em
  simulador.

  5.11.2.4 Uso de simuladores de voo. Quando um simulador de voo for usado para restabelecer
  a experiência recente, todos os assentos de tripulante devem ser ocupados por indivíduos
  qualificados nos procedimentos do operador e nas funções a bordo especificadas. O nível
  de qualificação dos tripulantes de voo não precisa ser equivalente ao nível exigido de um
  tripulante de voo servindo em operações comerciais. O simulador de voo deve ser operado
  em um cenário de voo normal. O reposicionamento do cenário no simulador não é permitido.

  5.11.2.5 Certificação de proficiência do piloto. O examinador credenciado deve certificar
  a proficiência do piloto e inserir essa certificação nos registros do piloto.'
