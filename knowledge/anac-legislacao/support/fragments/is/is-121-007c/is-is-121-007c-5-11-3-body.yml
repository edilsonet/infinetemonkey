title: Reestabelecimento da experiência recente de mecânicos de voo
text: '5.11.3 Reestabelecimento da experiência recente de mecânicos de voo

  5.11.3.1 O RBAC 121.453 exige que mecânicos de voo adquiram pelo menos 50 horas de voo como
  mecânicos de voo, nos 6 meses precedentes, no tipo de avião em que irão servir. Um mecânico
  de voo que não cumpriu este requisito deve restabelecer a experiência recente ao concluir
  um módulo básico de qualificação (exame de voo) conduzido por um examinador credenciado
  ou por um servidor da ANAC. O exame pode ser conduzido em um avião em operações não comerciais,
  ou em um "simulador de mecânico de voo".

  Nota: um “simulador de mecânico de voo” é o equivalente de um dispositivo de treinamento
  de voo (FTD) nível 6 ou superior, porém não precisa ter movimentos.'
