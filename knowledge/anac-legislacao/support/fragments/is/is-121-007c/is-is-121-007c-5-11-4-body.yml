text: '5.11.4 Requalificação por falha em completar o treinamento periódico dentro do período
  de elegibilidade

  5.11.4.1 Um segmento de currículo de requalificação é exigido quando um tripulante de voo
  não conseguir completar o treinamento periódico durante um período de elegibilidade pré-estabelecido.
  A quantidade mínima de treinamento requerida em cada segmento de currículo é determinada
  pelo período em que o tripulante de voo estiver não qualificado. Os tripulantes de voo devem
  ser treinados até atingirem a proficiência e completar um módulo de qualificação antes de
  retornarem às operações comerciais. Os descritivos do currículo de requalificação devem
  especificar os eventos e carga horária mínimos. O RBAC nº 121 permite que os tripulantes
  de voo sejam treinados até atingirem o nível requerido de proficiência. Em casos particulares,
  podem ser necessárias mais horas de treinamento com relação ao previsto na ementa do currículo.
  A Figura 17 contém os requisitos de requalificação para os tripulantes de voo que excederam
  os respectivos períodos de elegibilidade dos treinamento ou cheques necessários.

  Tempo decorrido desde o mês de vencimento

  Segmento de solo periódico

  Segmento de voo periódico

  Segmento de qualificação

  Até 12 meses

  Parcela do segmento de solo não realizada quando o treinamento periódico venceu.

  Os elementos não realizados quando o treinamento periódico venceu.

  Os módulos não realizados no período de elegibilidade: exame de proficiência, exame em rota,
  exame de voo ou exames especiais

  12 a 59 meses

  24 horas

  16 horas

  Todos os módulos de qualificação do currículo de transição.

  Mais de 59 meses

  - Igual ao treinamento inicial de equipamento -

  Figura 17 - Currículo de requalificação para tripulantes de voo com o treinamento periódico
  vencido

  5.11.5 Tripulantes de voo que não cumprem requisitos de experiência recentes ou cujo treinamento
  periódico está vencido após serem redesignados para um novo tipo de aeronave

  5.11.5.1 Um tripulante de voo que for redesignado para uma função a bordo ou um tipo de
  aeronave no qual era anteriormente qualificado, mas para o qual atualmente não está qualificado,
  deve receber treinamento de requalificação. O método usado para requalificar o tripulante
  difere de acordo com o motivo da requalificação, da forma abaixo:

  5.11.5.2 Falta de eventos de experiência recentes exigidos. Um tripulante de voo que não
  estiver qualificado apenas por não ter realizado os eventos de experiência recente necessários
  deve ser requalificado de acordo com os parágrafos 5.11.2 e 5.11.3 desta IS, conforme aplicável.

  5.11.5.3 Treinamento periódico vencido. Um tripulante de voo que não estiver qualificado
  por ter seu treinamento periódico vencido deve ser requalificado de acordo com o parágrafo
  5.11.4 desta IS.'
