section_id: 5.11.6
section_title: Tripulantes de voo redesignados para uma função a bordo previamente ocupada
  em uma aeronave sendo atualmente operada.
subsection_id: b
cite: 5.11.6(b)
title: 5.11.6(b)
text: 'b) Um tripulante de voo que não estiver qualificado para um módulo do treinamento periódico
  vencido deve ser requalificado de acordo com o parágrafo 5.11.4 desta IS .

  5.11.6.3 Piloto para mecânico de voo. Quando um tripulante de voo estiver se deslocando
  da função de piloto para a de mecânico de voo, a requalificação deve ser realizada de acordo
  com o parágrafo 5.11.4 desta IS.

  5.11.6.4 PIC para SIC. Quando um piloto em comando for redesignado para a função de segundo
  em comando, o treinamento de requalificação consiste nas tarefas dependentes de assento
  relacionadas à função de segundo em comando, como fluxo da lista de verificação e trabalhos
  burocráticos, como preenchimento do livro de bordo, relatório técnico da aeronave e peso
  e balanceamento. Os requisitos de treinamento de requalificação dependentes do assento variam
  de acordo com o período em que o piloto estava fora da função de segundo em comando e da
  complexidade da aeronave. Devido ao amplo leque de situações, os operadores devem exercer
  julgamento razoável ao rever cada caso.'
