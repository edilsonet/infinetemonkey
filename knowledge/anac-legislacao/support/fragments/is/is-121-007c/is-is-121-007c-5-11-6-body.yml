text: '5.11.6 Tripulantes de voo redesignados para uma função a bordo previamente ocupada
  em uma aeronave sendo atualmente operada.

  5.11.6.1 Quando um tripulante de voo for redesignado para função a bordo anteriormente ocupada
  no mesmo tipo de aeronave em que ele atualmente opera, pode ser necessário treinamento de
  requalificação. O método usado para requalificar o tripulante difere de acordo com o motivo
  da requalificação, da forma abaixo.

  5.11.6.2 SIC para PIC / MCV para SIC. Quando o tripulante de voo estiver retornando de segundo
  em comando para piloto em comando ou de mecânico de voo para segundo em comando, ele deve
  cumprir com os requisitos de experiência recente e treinamento periódico para a função ou
  ser enviado para treinamento de requalificação.'
