title: Requalificação de tripulantes de voo que reprovaram em um exame
text: '5.11.7 Requalificação de tripulantes de voo que reprovaram em um exame

  5.11.7.1 Um tripulante de voo que reprovar em um exame requerido deve ser inserido no treinamento
  de requalificação. O segmento do treinamento de requalificação deve consistir, pelo menos,
  do treinamento periódico necessário para restaurar a competência do tripulante de voo nos
  eventos malsucedidos. O treinamento pode consistir apenas em um esclarecimento detalhado,
  ou pode ser bastante extenso. Treinamento adicional deve ser dado para fortalecer o desempenho
  geral do tripulante de voo. Os motivos para a perda de qualificação e o treinamento fornecido
  devem ser inseridos nos registros do tripulante de voo.

  5.11.7.2 Certificação da proficiência do tripulante de voo. O instrutor ou examinador credenciado
  conduzindo esse treinamento devem certificar a proficiência do tripulante de voo antes que
  ele refaça o exame. Esta certificação não se limita aos eventos em que o tripulante de voo
  falhou, mas engloba todos os eventos do módulo de qualificação.

  5.11.7.3 Notificação para ANAC. O operador deve notificar a gerência da ANAC responsável
  pela supervisão de suas operações sobre todas as reprovações em exames. A notificação deve
  ser oportuna, de modo que a ANAC possa providenciar um servidor para realizar ou observar
  o módulo de qualificação quando, no seu julgamento, essa ação for necessária. Por exemplo,
  a observação poderá ser realizada no caso de pilotos em comando que reprovaram no exame
  de proficiência ou exame em rota. Os operadores podem realizar quanto treinamento de requalificação
  for necessário antes de agendar e realizar o um novo módulo de qualificação.

  5.11.7.4 Segmento de currículo de qualificação. O segmento de currículo de qualificação
  para um segundo em comando ou mecânico de voo deve consistir no módulo anteriormente malsucedido.
  O segmento de currículo de qualificação para um piloto em comando deve consistir no módulo
  básico de qualificação, no módulo de exame em rota, ou ambos, se apropriado.'
