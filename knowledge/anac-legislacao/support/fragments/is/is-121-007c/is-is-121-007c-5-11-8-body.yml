title: Avaliação do currículo de treinamento de requalificação para aprovação inicial
text: '5.11.8 Avaliação do currículo de treinamento de requalificação para aprovação inicial

  5.11.8.1 Ao avaliar o conteúdo programático do currículo de treinamento de requalificação
  para aprovação inicial, a ANAC irá determinar se os segmentos apropriados do currículo de
  solo, voo e qualificação da aeronave estão listados e se cada segmento de currículo contém
  os elementos e eventos necessários.

  5.11.8.2 Requisitos do módulo. Os módulos de experiência recente devem apenas conter uma
  listagem dos eventos que devem ser realizados e o método que o operador pretende usar para
  realizá-los.

  5.11.8.3 Segmentos de treinamento e qualificação. O currículo deve conter segmentos de treinamento
  e qualificação para tripulantes de voo que reprovaram em exames. O segmento de treinamento
  só precisa conter uma declaração simples de que o treinamento fornecido será prescrito para
  o caso individual, a fim de restabelecer a proficiência do tripulante de voo. No entanto,
  o segmento de qualificação deve conter uma listagem dos módulos que o tripulante deve completar
  para recuperar a qualificação.

  5.11.8.4 Descritivo de currículo para treinamento em atraso. Conteúdos programáticos de
  currículos separados devem ser preparados para o treinamento em atraso dos tripulantes de
  voo de acordo com a Figura 17. O conteúdo programático do currículo deve fornecer informações
  suficientes para permitir que a ANAC avalie se os elementos e eventos em cada módulo de
  treinamento são adequados para requalificar corretamente o tripulante de voo. Um exemplo
  de currículo de treinamento de requalificação, com um módulo de treinamento (voo automático
  / diretor de voo), está na Figura 18. As orientações e diretrizes dessas seções desta IS
  sobre os segmentos de currículo de solo, voo e qualificação devem ser usadas ​​pelo operador
  para elaboração das propostas de currículo.

  5.11.8.5 Módulos de outros currículos. Uma técnica que o operador pode usar para construir
  segmentos de currículo de requalificação é começar com módulos de treinamento de solo e
  voo de outros currículos (como treinamento de solo de transição para PIC) e remover elementos
  desnecessários ou ajustar o conteúdo dos elementos, conforme necessário. No exemplo mostrado
  na Figura 18, o número de elementos e eventos nos módulos de treinamento foi reduzido a
  partir daqueles fornecidos para o treinamento inicial do equipamento.

  5.11.8.6 Registro do tripulante de voo. O motivo para a entrada no treinamento de requalificação
  deve ser inserido no registro do tripulante de voo. O operador pode estabelecer um novo
  mês de treinamento/exame (mês de referência) ou manter o mês de referência original após
  o tripulante de voo completar com sucesso o treinamento de requalificação.


  Figura 18 - Exemplo de currículo de requalificação

  5.12 Instrutores e examinadores credenciados'
