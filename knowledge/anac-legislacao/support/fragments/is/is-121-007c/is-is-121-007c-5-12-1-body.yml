text: '5.12.1 Generalidades

  5.12.1.1 Esta seção contém orientações sobre os instrutores e examinadores credenciados
  dos programas de treinamento de tripulantes de voo do RBAC nº 121, incluindo as funções
  e propósitos desses profissionais, bem como requisitos regulamentares, qualificações e responsabilidades
  funcionais.

  5.12.1.2 Esta seção também fornece orientações sobre os requisitos de treinamento dos instrutores
  e examinadores credenciados dos programas de treinamento de tripulantes de voo.'
