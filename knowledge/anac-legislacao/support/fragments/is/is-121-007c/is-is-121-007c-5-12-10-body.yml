title: Seleção de instrutores
text: '5.12.10 Seleção de instrutores

  5.12.10.1 Como os níveis de experiência de pilotos e mecânicos de voo variam entre os operadores,
  é impossível especificar níveis mínimos de experiência para os candidatos a instrutores.
  Em alguns casos, como naqueles envolvendo novos operadores, os candidatos podem ter relativamente
  pouca experiência de voo. Independentemente dos níveis de experiência, os candidatos devem
  demonstrar altos níveis de conhecimento e habilidade nas funções de trabalho aplicáveis.
  Os operadores devem garantir que o treinamento adequado para os instrutores seja realizado
  e documentado nos registros aplicáveis.'
