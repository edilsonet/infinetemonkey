section_id: 5.12.11.3
section_title: 'Treinamento de voo. O treinamento de voo para instrutores de voo e examinadores
  credenciados em aeronave deve incluir:'
subsection_id: a
cite: 5.12.11.3(a)
title: 5.12.11.3(a)
text: a) instrução e prática suficiente na condução de treinamento (e exames para examinadores
  credenciados), a partir dos assentos de piloto direito e esquerdo, dos procedimentos normais,
  anormais e de emergência requeridos pelo RBAC nº 121. Para um instrutor de voo e examinador
  credenciado em aeronave, o treinamento e a prática nos eventos de pouso e decolagem do programa
  de treinamento aprovado do operador devem ser conduzidos em uma aeronave; o restante do
  treinamento pode ser realizado em um simulador de voo aprovado;
