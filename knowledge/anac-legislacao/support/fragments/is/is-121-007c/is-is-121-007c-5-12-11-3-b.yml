section_id: 5.12.11.3
section_title: 'Treinamento de voo. O treinamento de voo para instrutores de voo e examinadores
  credenciados em aeronave deve incluir:'
subsection_id: b
cite: 5.12.11.3(b)
title: 5.12.11.3(b)
text: b) para examinadores credenciados de pilotos em avião, treinamento em voo em uma aeronave
  supervisionando pousos e decolagens normais a partir de qualquer assento de piloto. O operador
  deve garantir que o examinador credenciado seja minuciosamente treinado nas funções de segundo
  em comando e capaz de realizá-las com competência enquanto supervisiona e avalia um novo
  piloto em comando;
