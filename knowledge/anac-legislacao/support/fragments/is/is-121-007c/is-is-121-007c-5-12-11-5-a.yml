title: 5.12.11.5(a)
text: a) instrução e prática de voo suficientes para garantir a competência do instrutor.
  Os procedimentos normais, anormais e de emergência devem ser cobertos. Para um instrutor
  de voo de mecânico de voo, o treinamento de voo pode ser completado inteiramente em FSTD;
