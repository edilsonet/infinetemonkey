section_title: 'Crédito para treinamento de examinadores credenciados - múltiplos operadores:'
subsection_id: a
cite: 5.12.11.6(a)
title: 5.12.11.6(a)
text: 'a) a ANAC poderá aprovar um examinador credenciado piloto ou mecânico de voo para servir
  mais de um operador. A ANAC poderá determinar se o treinamento concluído com um operador
  pode ser creditado para treinamento de examinador credenciado de outro operador. O treinamento
  que poderá ser creditado pode incluir partes do treinamento no solo e treinamento de voo.
  Por exemplo, um examinador credenciado piloto ou mecânico de voo pode ser elegível para
  créditos de treinamento nas seguintes condições:

  1) está empregado como um examinador de um Centro de Treinamento;

  2) realiza regularmente exames de proficiência; e

  3) utiliza os mesmos procedimentos para todos os operadores; e'
