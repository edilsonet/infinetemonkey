cite: 5.12.11.6(b)
title: 5.12.11.6(b)
text: b) quando a aeronave, os procedimentos ou os tipos de operações forem diferentes, a
  ANAC poderá exigir que o examinador credenciado (para serviço com um operador adicional)
  complete o treinamento adicional apropriado. Tal treinamento deve abordar as diferenças
  e pode incluir segmentos de currículo completos.
