text: '5.12.11 Treinamento para instrutores de voo e examinadores credenciados

  5.12.11.1 Para garantir que seus instrutores de voo estejam adequadamente treinados, os
  operadores devem incluir no programa de treinamento inicial e de transição de instrutor
  de voo o treinamento especificado nos RBAC 121.412, 121.414 e Apêndice H do RBAC nº 121,
  conforme aplicável. Para garantir que seus examinadores credenciados estejam adequadamente
  treinados, os operadores devem incluir no programa de treinamento inicial e de transição
  de examinador credenciado o treinamento especificado nos RBAC 121.411, 121.413 e Apêndice
  H do RBAC nº 121, conforme aplicável. Candidatos a instrutor de voo ou examinador credenciado
  devem completar satisfatoriamente os treinamentos inicial, de transição ou de elevação de
  nível do programa de treinamento aprovado do operador para a aeronave e função a bordo desejada.
  Além disso, os instrutores de voo devem completar o treinamento de instrutor do operador,
  e os examinadores credenciados devem completar os treinamentos de instrutor e de examinador
  credenciado. Se o instrutor de voo ou examinador credenciado concluir satisfatoriamente
  em um treinamento prévio um segmento de currículo que se aplica a mais de uma aeronave ou
  função a bordo, então não é necessário repetir esse segmento.

  5.12.11.2 Treinamento de solo. O treinamento de solo para instrutores de voo e examinadores
