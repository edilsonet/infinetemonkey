section_title: 'Os requisitos de qualificação e treinamento de instrutores e examinadores
  credenciados de tripulantes de voo segundo o RBAC nº 121 são:'
subsection_id: b
cite: 5.12.2.1(b)
title: 5.12.2.1(b)
text: b) o RBAC 121.401(a)(4) estabelece que os operadores devem prover número suficiente
  de instrutores de voo e examinadores credenciados pilotos e mecânicos de voo qualificados
  para conduzir os treinamentos de voo e exames requeridos pelo RBAC nº 121;
