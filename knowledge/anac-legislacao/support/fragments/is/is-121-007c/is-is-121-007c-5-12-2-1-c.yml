section_id: 5.12.2.1
section_title: 'Os requisitos de qualificação e treinamento de instrutores e examinadores
  credenciados de tripulantes de voo segundo o RBAC nº 121 são:'
subsection_id: c
cite: 5.12.2.1(c)
title: 5.12.2.1(c)
text: c) o RBAC 121.401(e) estabelece que cada instrutor, supervisor ou examinador credenciado
  responsável por um determinado conteúdo de treinamento ou segmento de currículo (incluindo
  segmentos de treinamento de solo e voo, exames de voo e exames de proficiência) deve certificar
  o conhecimento e a proficiência dos indivíduos após a conclusão do treinamento ou exame;
