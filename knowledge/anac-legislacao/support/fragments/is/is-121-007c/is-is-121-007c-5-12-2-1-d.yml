section_title: 'Os requisitos de qualificação e treinamento de instrutores e examinadores
  credenciados de tripulantes de voo segundo o RBAC nº 121 são:'
subsection_id: d
cite: 5.12.2.1(d)
title: 5.12.2.1(d)
text: d) o RBAC 121.402(a) estabelece que cada instrutor de solo, instrutor de voo, examinador
  credenciado piloto ou examinador credenciado mecânico de voo deve estar trabalhando para
  e sob controle operacional direto do operador, de outro operador congênere do RBAC nº 121
  ou de um centro de treinamento certificado segundo RBAC nº 142;
