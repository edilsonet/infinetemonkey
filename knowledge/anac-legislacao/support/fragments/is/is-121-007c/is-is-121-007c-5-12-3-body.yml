title: Definições
text: '5.12.3 Definições

  5.12.3.1 As seguintes definições se aplicam a instrutores de solo, instrutores de voo, examinadores
  credenciados piloto e examinadores credenciados mecânicos de voo discutidos nesta seção.

  5.12.3.2 Examinador credenciado piloto. Um examinador credenciado piloto é um aviador aprovado
  pela ANAC que possui conhecimento, treinamento e experiência adequados e demonstrada capacidade
  para avaliar e certificar os conhecimento e habilidades de outros pilotos.

  5.12.3.3 Examinador credenciado mecânico de voo. Um examinador credenciado mecânico de voo
  é um aviador aprovado pela ANAC que possui conhecimento, treinamento e experiência adequados
  e demonstrada capacidade para avaliar e certificar os conhecimento e habilidades de outros
  mecânicos de voo.

  5.12.3.4 Instrutor de voo. Um instrutor de voo é um tripulante de voo designado pelo operador
  segundo o RBAC nº 121 que possui conhecimento, treinamento e experiência adequados e demonstrada
  capacidade para treinar tripulantes de voo em um segmento de currículo de voo do programa
  de treinamento aprovado do operador.

  Nota: um instrutor de voo não é obrigado a manter uma habilitação de Instrutor de Voo emitida
  segundo o RBAC nº 61 ao ministrar instrução no âmbito de um programa de treinamento aprovado
  segundo o RBAC nº 121.

  5.12.3.5 Instrutor de solo. Um instrutor de solo é uma pessoa selecionada e qualificada
  por um operador do RBAC nº 121 que possui o conhecimento, treinamento e experiência adequados
  e demonstrada capacidade para treinar tripulantes de voo em segmentos de currículo que não
  incluam treinamento de voo.'
