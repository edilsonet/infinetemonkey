title: Função e características do instrutor
text: '5.12.5 Função e características do instrutor

  5.12.5.1 Um instrutor é uma pessoa empregada por um operador com a finalidade de treinar
  tripulantes de voo sob um programa de treinamento aprovado. Os instrutores devem estar bem
  informados sobre os requisitos aplicáveis dos RBAC/RBHA e outras políticas aplicáveis da
  ANAC, sobre práticas operacionais seguras e sobre as políticas e procedimentos do operador.
  Os instrutores devem possuir habilidades de comunicação efetivas e uma conduta que sempre
  reflita profissionalismo e uma atitude positiva em relação à segurança operacional.'
