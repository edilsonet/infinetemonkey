section_title: 'Elegibilidade. Para autorização inicial e contínua como instrutor de voo em
  avião, um aviador deve atender aos seguintes requisitos de elegibilidade:'
subsection_id: b
cite: 5.12.6.2(b)
title: 5.12.6.2(b)
text: b) para os instrutores de pilotos, possuir certificado médico aeronáutico de 1ª classe
  se estiver servindo como tripulante de voo. Se não estiver servindo como um tripulante de
  voo requerido, o instrutor de pilotos não é obrigado a possuir um CMA;
