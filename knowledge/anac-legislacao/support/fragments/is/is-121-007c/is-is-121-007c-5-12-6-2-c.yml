section_title: 'Elegibilidade. Para autorização inicial e contínua como instrutor de voo em
  avião, um aviador deve atender aos seguintes requisitos de elegibilidade:'
subsection_id: c
cite: 5.12.6.2(c)
title: 5.12.6.2(c)
text: c) para os instrutores de mecânicos de voo, possuir certificado médico aeronáutico de
  2ª classe se estiver servindo como tripulante de voo. Se não estiver servindo como um tripulante
  de voo requerido, o instrutor de mecânicos de voo não é obrigado a possuir um CMA;
