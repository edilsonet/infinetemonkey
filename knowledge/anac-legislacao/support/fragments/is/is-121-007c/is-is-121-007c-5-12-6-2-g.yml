section_title: 'Elegibilidade. Para autorização inicial e contínua como instrutor de voo em
  avião, um aviador deve atender aos seguintes requisitos de elegibilidade:'
subsection_id: g
cite: 5.12.6.2(g)
title: 5.12.6.2(g)
text: 'g) pelo menos uma vez a cada 24 meses, demonstrar de forma satisfatória a capacidade
  para conduzir treinamento de voo para um servidor da ANAC ou examinador credenciado do operador.
  A demonstração pode ser realizada em uma aeronave, um simulador de voo, um dispositivo de
  treinamento de voo ou em uma combinação deles, conforme apropriado. A avaliação inicial
  deve incluir avaliação em uma aeronave.

  5.12.6.3 Atividades autorizadas. Um instrutor de voo em avião, quando autorizado pelo operador,
  pode realizar as seguintes atividades de treinamento de voo em uma aeronave ou FSTD:'
