text: '5.12.6 Instrutor de voo em avião

  5.12.6.1 Um instrutor de voo em avião pode ser um instrutor de pilotos, um instrutor de
  mecânicos de voo ou ambos, e pode conduzir treinamento de voo em aeronaves ou FSTD.'
