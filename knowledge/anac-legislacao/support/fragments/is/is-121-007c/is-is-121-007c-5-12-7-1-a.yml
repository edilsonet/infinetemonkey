section_title: Um instrutor de voo em simulador pode ministrar treinamento em um FSTD e pode
  ser um instrutor de pilotos, um instrutor de mecânicos de voo ou ambos.
subsection_id: a
cite: 5.12.7.1(a)
title: 5.12.7.1(a)
text: a) possuir a licença e as habilitações necessárias, exceto o certificado médico aeronáutico,
  para trabalhar como piloto em comando ou mecânico de voo, como apropriado, em operações
  segundo o RBAC nº 121;
