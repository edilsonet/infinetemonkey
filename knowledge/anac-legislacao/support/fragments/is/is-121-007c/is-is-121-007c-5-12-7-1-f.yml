cite: 5.12.7.1(f)
title: 5.12.7.1(f)
text: 'f) pelo menos uma vez a cada 24 meses, demonstrar de forma satisfatória a capacidade
  para conduzir treinamento de voo para um servidor da ANAC ou examinador credenciado do operador.
  A demonstração pode ser realizada em simulador de voo, dispositivo de treinamento de voo
  ou ambos, conforme apropriado.

