section_id: 5.12.8.2
section_title: 'Atividades autorizadas. Um instrutor de solo, quando qualificado e autorizado
  pelo titular do certificado, pode realizar o seguinte:'
subsection_id: b
cite: 5.12.8.2(b)
title: 5.12.8.2(b)
text: 'b) certificação da proficiência e conhecimentos satisfatórios dos tripulantes de voo
  após a conclusão de um segmento de currículo ou módulo de treinamento de solo.

  5.12.8.3 Registros de treinamento e qualificação. O operador deve manter a documentação
  do treinamento e qualificação de cada instrutor do solo e deve disponibilizar essa documentação
  para inspeção da ANAC sempre que solicitado.'
