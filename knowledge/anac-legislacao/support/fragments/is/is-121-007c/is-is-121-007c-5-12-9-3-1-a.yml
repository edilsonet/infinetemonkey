section_title: 'Treinamento no solo. O treinamento de solo deve incluir os seguintes assuntos:'
subsection_id: a
cite: 5.12.9.3.1(a)
title: 5.12.9.3.1(a)
text: 'a) Autorizações. Deveres de um instrutor de voo ou examinador credenciado em relação
  ao uso de autorizações de controle de tráfego aéreo (ATC) em um ambiente de treinamento.

  1) Formato das autorizações para simular com precisão o ATC.

  2) Capacidade de fornecer oportunamente respostas típicas dos controladores.

  3) Uso das autorizações com precisão para criar um cenário mais realista no ambiente de
  treinamento.

  4) Fornecimento com precisão de autorizações realistas para aumentar a credibilidade e o
  profissionalismo do instrutor.

  5) Uso das autorizações com precisão para simular a separação de tráfego corretamente e
  o conhecimento do controlador sobre os parâmetros de desempenho dos sistemas da aeronave.'
