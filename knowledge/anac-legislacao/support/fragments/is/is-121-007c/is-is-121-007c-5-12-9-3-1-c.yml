title: 5.12.9.3.1(c)
text: 'c) Vetoração. Uso apropriado e benefícios/armadilhas de treinamento.

  1) Práticas de vetoração comumente mal utilizadas.

  2) Importância e benefícios no treinamento da vetoração correta para preservar o realismo.

  3) Treinamento negativo e impacto associado de práticas imprecisas ou não realistas.'
