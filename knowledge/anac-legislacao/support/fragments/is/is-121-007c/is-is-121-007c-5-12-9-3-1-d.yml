text: 'd) Diferenças da Organização da Aviação Civil Internacional (OACI). Aplicável para
  os operadores que realizam operações internacionais.

  1) Variações entre terminologia DECEA e OACI.

  2) Treinamento e práticas em aeroportos estrangeiros.

  3) Altitudes de transição.'
