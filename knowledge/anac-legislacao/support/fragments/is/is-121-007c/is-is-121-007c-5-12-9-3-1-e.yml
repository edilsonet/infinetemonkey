section_title: 'Treinamento no solo. O treinamento de solo deve incluir os seguintes assuntos:'
subsection_id: e
cite: 5.12.9.3.1(e)
title: 5.12.9.3.1(e)
text: 'e) Sinalização das pistas de pouso e decolagem e de táxi, sistema de guiamento e controle
  do movimento sobre a superfície (Surface Movement Guidance and Control System - SMGCS),
  etc.

  1) Mudanças recentes na sinalização e marcações.

  2) Variações entre aeroportos grandes e pequenos.

  3) Marcações da pista de pouso e descolagem.

  4) Marcações da pista de táxi.

  5) Sistemas de iluminação de solo e de aproximação.

  6) SMGCS: quem deve cumprir, em que condições meteorológicas se aplica, e como cumprir as
  autorizações e os procedimentos.

  5.12.9.3.2 Treinamento de voo. O treinamento deve ser realizado em um simulador de voo e
  deve ser projetado como um evento destinado a replicar as operações dentro do espaço aéreo
  real. Ele deve ser projetado para simular de forma realista (dentro das limitações da tecnologia
  do simulador de voo) uma visão do ambiente ATC que tripulantes de voo podem encontrar quando
  operam no espaço aéreo real. O treinamento de voo deve incluir os seguintes eventos, conforme
  aplicável, adaptados para refletir o ambiente operacional do operador:'
