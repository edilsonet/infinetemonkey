title: 5.12.9.3.1(r)
text: 'r) outros eventos que o operador considere apropriados.

  5.12.9.3.3 Cronograma do programa LOS. O operador deve desenvolver cenários simulados de
  operações em linha suficientes para garantir que os instrutores de voo e examinadores credenciados
  não repitam o mesmo cenário dentro de quatro ciclos de treinamento conforme definido no
  programa de treinamento aprovado. Se os segmentos de treinamento de solo e de voo ocorrerem
  com um intervalo maior do que 30 dias, o operador deve manter um registro de acompanhamento
  separado para cada segmento. Cada segmento terá então seu próprio ciclo de periodicidade
  de 12 meses.

  5.12.9.4 Informações mais detalhadas sobre Line Operational Simulations poderão ser encontradas
  na Advisory Circular (AC) 120-35D, de 13 março de 2015, da Federal Aviation Admininstration
  - FAA.'
