cite: 5.12.9(b)
title: 5.12.9(b)
text: 'b) um programa de simulação de operações em linha (Line-Operational Simulation - LOS),
  conforme 5.12.9.2 desta IS.

  5.12.9.2 Observação de operação em linha do assento do observador. O operador pode cumprir
  com os requisitos dos RBAC 121.411(f)(2) e 121.412(f)(2) exigindo que instrutores de voo
  e examinadores credenciados completem a observação das operações em linha a partir do assento
  de observador. Para receber aprovação, os operadores devem garantir que o programa proposto
  exija que cada instrutor de voo e examinador credenciado complete um mínimo de dois segmentos
  de voo no assento de observador do avião a cada período de 12 meses.

  5.12.9.3 Programa LOS. Os operadores podem cumprir com os requisitos dos RBAC 121.411(f)(2)
  e 121.412(f)(2) por meio da realização de um programa de simulação de operações em linha.
  Para receber aprovação, o operador deve garantir que o programa atende os seguintes critérios.'
