text: '5.12.9 Programa de observação de operação em linha

  5.12.9.1 Para mostrar conformidade com os requisitos RBAC 121.411(f) e 121.412(f), os operadores
  devem preferencialmente designar instrutores de voo e examinadores credenciados para voar,
  como tripulante requerido para o tipo de avião, um mínimo de dois segmentos de voo durante
  operações reais da linha na aeronave nos últimos 12 meses - na prática, se um tripulante
  de voo cumpre os requisitos de experiência recente de 121.439 e 121.453, atenderá também
  a 121.411(f)(1) e 121.412(f)(1). No lugar dos voos compondo tripulação requerida em operações
  reais, os instrutores de voo e examinadores credenciados podem completar um programa aprovado
  de observação de operação em linha. Existem dois tipos de programas de observação de operação
  em linha que podem ser aprovados:'
