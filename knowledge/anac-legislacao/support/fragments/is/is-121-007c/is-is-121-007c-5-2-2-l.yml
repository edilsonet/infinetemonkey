section_title: 'Para composição dos currículos de treinamento associados a essas categorias
  de treinamento, os seguintes segmentos de currículo se aplicam:'
subsection_id: l
cite: 5.2.2(l)
title: 5.2.2(l)
text: 'l) segmento de currículo PPSP - RBAC nº 120 e IS nº 120-002.

  5.2.3 Esta IS fornece diretrizes e orientações para desenvolvimento e aplicação dos segmentos
  de currículo listados nos subparágrafos a) até g) do parágrafo 5.2.2.

  5.2.4 Orientações sobre os segmentos de currículo listados nos subparágrafos h) até l) do
  parágrafo 5.2.2 estão estabelecidas em outros normativos específicos publicados pela ANAC.

  5.2.5 Esta IS ainda estabelece orientações sobre qualificações e treinamento dos instrutores
  e examinadores credenciados designados para atuar em um programa de treinamento de tripulantes
  de voo.

  5.3 Segmento de currículo de doutrinamento básico'
