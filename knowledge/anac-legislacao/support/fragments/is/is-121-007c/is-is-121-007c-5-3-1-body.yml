text: '5.3.1 Generalidades

  5.3.1.1 Esta seção estabelece o objetivo e conteúdo do segmento de currículo de doutrinamento
  básico dos currículos de treinamento para tripulantes de voo. Este treinamento é requerido
  para todos os tripulantes de voo designados a receber treinamento inicial de nova contratação.
  O doutrinamento básico normalmente é o primeiro segmento do currículo de treinamento conduzido
  para os tripulantes de voo recém contratados. Este serve como introdução ao operador e aos
  requisitos operacionais do RBAC nº 121.'
