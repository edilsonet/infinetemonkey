subsection_id: a
cite: 5.3.10(a)
title: 5.3.10(a)
text: a) a área de doutrinamento básico do operador deve conter informações de escopo, qualidade
  e profundidade suficientes para garantir que o tripulante de voo entenda completamente os
  deveres e responsabilidades aplicáveis à sua função. Os módulos de treinamento também devem
  proporcionar informação suficiente ao tripulante sobre as políticas, procedimentos e práticas
  do operador; e
