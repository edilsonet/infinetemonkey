section_title: Avaliação do segmento de doutrinamento básico para aprovação inicial
subsection_id: b
cite: 5.3.10(b)
title: 5.3.10(b)
text: 'b) a área de doutrinamento básico aeronáutico deve tratar das partes apropriadas dos
  manuais do operador e quaisquer outras informações pertinentes. Estes módulos devem conter
  elementos que tratem do tipo de operação do operador e certas áreas gerais, tais como meteorologia
  e princípios de peso e balanceamento. É essencial que os operadores entendam que o doutrinamento
  básico aeronáutico não corresponde ao treinamento específico da aeronave. Tal treinamento
  é realizado para garantir que os tripulantes adquiram conceitos fundamentais de aviação
  antes de prosseguir para o treinamento de solo e de voo para uma aeronave específica.

  5.4 Segmento de currículo de emergências gerais'
