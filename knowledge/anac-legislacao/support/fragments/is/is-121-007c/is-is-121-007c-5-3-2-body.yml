title: Objetivo do doutrinamento básico
text: '5.3.2 Objetivo do doutrinamento básico

  5.3.2.1 O objetivo do doutrinamento básico é apresentar ao novo tripulante de voo o operador
  e suas maneiras de conduzir operações de transporte aéreo. Especificamente consiste em informar
  ao novo empregado suas políticas, procedimentos, normas e práticas administrativas e organizacionais
  para lhe garantir os conhecimentos básicos requeridos para um tripulante de voo.'
