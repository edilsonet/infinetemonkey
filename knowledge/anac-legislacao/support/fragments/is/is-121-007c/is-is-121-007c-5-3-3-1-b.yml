section_id: 5.3.3.1
section_title: 'Os módulos do segmento de currículo de doutrinamento básico para os tripulantes
  de voo podem ser agrupados em duas grandes áreas gerais de treinamento:'
subsection_id: b
cite: 5.3.3.1(b)
title: 5.3.3.1(b)
text: 'b) doutrinamento básico aeronáutico.

  5.3.3.2 Essas áreas servem para informar ao tripulante sobre as formas de cumprimento dos
  regulamentos usados pelo operador e para garantir que o tripulante obtenha os conhecimentos
  básicos necessários para receber treinamento de solo e de voo específico da aeronave. Os
  assuntos das duas áreas nem sempre são mutuamente excludentes e, em alguns casos, podem
  ser apresentados sob o mesmo módulo de treinamento.'
