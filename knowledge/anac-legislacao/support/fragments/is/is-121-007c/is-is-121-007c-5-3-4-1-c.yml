document: is-121-007c
family: '121'
section_id: 5.3.4.1
section_title: 'A área de doutrinamento básico do operador deve incluir módulos de treinamento
  que contemplem pelo menos o seguinte:'
subsection_id: c
cite: 5.3.4.1(c)
title: 5.3.4.1(c)
text: 'c) conteúdo do COA e das EO.

  5.3.4.2 O doutrinamento básico do operador também deve incluir informações sobre a empresa
  que o tripulante precisa conhecer a fim de exercer adequadamente suas funções. Estas informações
  podem incluir temas como: história da empresa, organização, políticas, escopo da operação,
  procedimentos administrativos, regras de conduta, salários, seguros, benefícios e contratos.'
