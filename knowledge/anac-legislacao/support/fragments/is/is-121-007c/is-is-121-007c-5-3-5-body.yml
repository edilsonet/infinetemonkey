text: '5.3.5 Doutrinamento básico aeronáutico

  5.3.5.1 A área de doutrinamento básico aeronáutico deve cobrir as partes apropriadas do
  sistema de manuais do operador, além de outras informações pertinentes que garantam que
  o tripulante esteja apto a receber treinamento de solo e de voo. A área deve incluir módulos
  que demonstrem que o treinamento aplicável à função cobrirá os conceitos e princípios gerais
  dos seguintes assuntos:'
