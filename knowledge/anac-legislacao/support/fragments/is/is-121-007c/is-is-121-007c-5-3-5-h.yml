cite: 5.3.5(h)
title: 5.3.5(h)
text: 'h) procedimentos de voo por instrumentos.

  5.3.5.2 O doutrinamento básico aeronáutico deverá tratar do tipo de operação e das capacidades
  gerais das aeronaves do operador. Por exemplo, um operador que utiliza aeronaves de categoria
  transporte com motores a jato deve incluir um elemento sobre informações meteorológicas
  de alta altitude (por exemplo, correntes de ventos de grande velocidade) no módulo de meteorologia.
  É importante destacar que o doutrinamento básico aeronáutico não corresponde ao treinamento
  de solo específico de determinada aeronave. Este tipo de treinamento pretende garantir que
  o tripulante de voo tenha um entendimento básico de certas áreas gerais antes de prosseguir
  com o treinamento de solo e de voo de uma aeronave específica.'
