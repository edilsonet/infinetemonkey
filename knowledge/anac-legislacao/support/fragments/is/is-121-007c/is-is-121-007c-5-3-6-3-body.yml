text: '5.3.6.3 A Figura 1 ilustra um exemplo de como um módulo de treinamento do segmento
  de doutrinamento básico pode ser apresentado.


  Figura 1 - Exemplo de módulo de treinamento do segmento de doutrinamento básico


  5.3.6.4 Não é necessário nem desejável incluir descrições detalhadas de cada elemento dentro
  da ementa do módulo de treinamento. Essas descrições detalhadas são mais apropriadas quando
  incluídas no material didático do operador. Durante o processo de aprovação, a ANAC avaliará
  o material didático para garantir que o alcance e a profundidade da instrução sejam adequados.
  A Figura 2 ilustra a inter-relação dos módulos de treinamento no segmento de currículo de
  doutrinamento básico para tripulantes de voo.


  Figura 2 - Exemplo de segmento de currículo de doutrinamento básico


  5.3.6.5 O RBAC 121.415 estabelece um mínimo de 40 horas-aula para o segmento de currículo
  de doutrinamento básico. Geralmente, as 40 horas devem ser o número mínimo de horas de treinamento
  para o doutrinamento básico de operadores do RBAC nº 121 que empregam tripulantes com pouca
  ou nenhuma experiência prévia neste regulamento. No entanto, redução das horas programadas
  em certas situações pode ser aceitável. Um exemplo seria uma situação de fusão ou de aquisição,
  em que os tripulantes que estão sendo remanejados para o novo operador realizariam somente
  os módulos do doutrinamento básico do operador. Outro exemplo seria um operador que estabelece
  como pré-requisito de admissão somente tripulantes com alto nível de experiência com o RBAC
  nº 121.'
