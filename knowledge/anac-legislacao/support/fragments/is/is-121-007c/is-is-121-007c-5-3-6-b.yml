section_title: Módulos de treinamento do doutrinamento básico
subsection_id: b
cite: 5.3.6(b)
title: 5.3.6(b)
text: 'b) uma lista dos elementos relacionados ao módulo que serão ministrados durante o treinamento.

  5.3.6.2 Os módulos de treinamento devem conter elementos suficientes para garantir que um
  tripulante receba treinamento nas áreas de doutrinamento básico do operador e doutrinamento
  básico aeronáutico. Estas áreas devem prover conhecimentos adequados para preparação para
  os segmentos posteriores do currículo, que são específicos para a aeronave. O operador possui
  certa flexibilidade para a elaboração destes módulos de treinamento. Por exemplo, quando
  o operador utiliza múltiplos currículos para uma mesma categoria de treinamento, os módulos
  do doutrinamento básico aeronáutico para tripulantes com experiência significativa em operações
  sob o RBAC nº 121 podem ser menos extensos do que aqueles ministrados a tripulantes sem
  esta experiência. Normalmente este é o caso quando existem fusões, aquisições ou operadores
  que contratam apenas tripulantes com experiência prévia em operações sob o RBAC nº 121.'
