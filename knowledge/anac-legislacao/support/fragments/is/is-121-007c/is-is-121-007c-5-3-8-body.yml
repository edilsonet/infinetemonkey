text: '5.3.8 Conteúdo dos módulos da área de doutrinamento básico aeronáutico

  5.3.8.1 Os módulos do doutrinamento básico aeronáutico fornecem treinamento para garantir
  que o tripulante estará apto para prosseguir com os segmentos de treinamento de solo e de
  voo. Estes módulos abordam as partes apropriadas dos manuais do operador, bem como informações
  sobre procedimentos de voo e práticas padrão de navegação de outros documentos, como AIP/ROTAER.
  A ênfase a ser dada nestes módulos não corresponde ao treinamento específico da aeronave.
  O doutrinamento básico aeronáutico está relacionado apenas com o tipo de operação e com
  a família de aeronaves usadas pelo operador. O objetivo destes módulos é garantir que o
  tripulante adquira os conhecimentos necessários para conduzir operações segundo o RBAC nº
  121. Módulos de treinamento aceitáveis para esta área são:'
