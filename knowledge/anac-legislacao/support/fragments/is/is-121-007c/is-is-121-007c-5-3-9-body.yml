title: Requisitos para completar o segmento
text: '5.3.9 Requisitos para completar o segmento

  5.3.9.1 A conclusão deste segmento de currículo deve estar documentada por uma certificação
  do instrutor, que garanta que o tripulante concluiu o treinamento com êxito. Esta certificação
  geralmente está baseada nos resultados de provas escritas aplicadas ao final do curso. Em
  alguns métodos de treinamento, a certificação pode estar baseada em avaliações de progresso
  do tripulante feitas durante o treinamento.'
