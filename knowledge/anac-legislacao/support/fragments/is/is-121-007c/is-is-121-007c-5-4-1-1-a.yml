family: '121'
section_id: 5.4.1.1
section_title: Existem dois tipos de treinamentos de emergências que os operadores do RBAC
  nº 121 devem oferecer aos tripulantes de voo.
subsection_id: a
cite: 5.4.1.1(a)
title: 5.4.1.1(a)
text: 'a) o treinamento de equipamentos de emergências fornece instrução e prática no uso
  real de certos equipamentos de emergência, tais como PBE, extintores de incêndio, coletes
  salva-vidas e equipamentos de primeiros socorros. Uma vez que se trata de um treinamento
  de emergências gerais, devem ser considerados os diferentes modelos de equipamentos de emergência
  existentes na frota do operador; e

  Nota: A utilização de extintores de incêndio do tipo Halon durante as práticas de combate
  ao fogo não é apropriada a menos que exista uma área de treinamento que tenha sido desenhada
  e planejada para prevenir os danos ao meio ambiente decorrente de descargas de Halon. Quando
  não forem utilizadas estas instalações, preferencialmente outros agentes extintores de fogo
  não danosos ao meio ambiente devem ser utilizados durante as práticas.'
