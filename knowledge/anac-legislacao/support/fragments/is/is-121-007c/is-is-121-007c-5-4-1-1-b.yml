id: is-is-121-007c-5-4-1-1-b
kind: is
document: is-121-007c
family: '121'
section_id: 5.4.1.1
section_title: Existem dois tipos de treinamentos de emergências que os operadores do RBAC
  nº 121 devem oferecer aos tripulantes de voo.
subsection_id: b
cite: 5.4.1.1(b)
title: 5.4.1.1(b)
text: 'b) o treinamento de situações de emergência consiste na instrução de fatores envolvidos,
  assim como nos procedimentos a serem seguidos, quando situações de emergência ocorrem. Os
  exemplos incluem evacuação de passageiros, amaragem, despressurização rápida e lenta, fogo
  a bordo e administração de primeiros socorros.

  5.4.1.5 Os módulos do treinamento de emergências gerais devem tratar do tipo de operação
  conduzido pelo operador. Por exemplo, se a empresa opera aeronaves acima de 25 mil pés,
  os tripulantes devem receber treinamento em temas como: respiração, hipóxia, enfermidade
  por despressurização e quaisquer procedimentos relacionados. Em outro exemplo, uma empresa
  que não realiza operações sobre grandes extensões de água não precisa conduzir treinamento
  sobre o uso de botes salva-vidas.'
