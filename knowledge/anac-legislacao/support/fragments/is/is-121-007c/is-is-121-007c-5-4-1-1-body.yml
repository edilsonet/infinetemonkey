title: Existem dois tipos de treinamentos de emergências que os operadores do RBAC nº 121
  devem oferecer aos tripulantes de voo.
text: '5.4.1.1 Existem dois tipos de treinamentos de emergências que os operadores do RBAC
  nº 121 devem oferecer aos tripulantes de voo.

  5.4.1.2 O primeiro tipo de treinamento é o “específico da aeronave”. Este tipo de treinamento
  de emergências inclui instrução e práticas em procedimentos anormais e de emergências associados
  aos sistemas da aeronave, projeto estrutural e características operacionais. Este treinamento
  oferece aos tripulantes de voo os conhecimentos e as habilidades necessárias para executar
  os procedimentos anormais e de emergências especificados no AFM (ou procedimentos do AFM
  incorporados ao AOM). Exemplos de tais procedimentos são aqueles usados quando ocorrem problemas
  nos motores, trem de pouso, controles de voo etc. O treinamento “específico da aeronave”
  também inclui instrução sobre a localização dos equipamentos de emergência da aeronave,
  tais como extintores de incêndio, cilindros de oxigênio, botes salva-vidas, coletes salva-vidas
  e equipamentos de primeiros socorros. O treinamento “específico da aeronave” deve estar
  incluído nos segmentos de currículo de treinamento de solo e de voo.

  5.4.1.3 O outro tipo é definido como “treinamento de emergências gerais”. O treinamento
  de emergências gerais é requerido para todos os tripulantes de voo sobre cada item especificado
  no RBAC 121.417.

  5.4.1.4 Esta seção oferece orientação sobre o conteúdo, métodos de apresentação, avaliação
  e aprovação do treinamento de emergências gerais para tripulantes de voo.

  5.4.1.4.1 Duas áreas distintas de treinamento são requeridas para a condução do treinamento
  de emergências gerais. Estas áreas são: equipamentos de emergências e situações de emergências.
  O segmento de currículo de emergências gerais deve conter módulos de treinamento que proporcionem
  conhecimento em ambas as áreas:'
