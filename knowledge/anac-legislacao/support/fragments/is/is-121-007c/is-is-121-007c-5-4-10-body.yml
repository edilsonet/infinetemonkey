text: '5.4.10 Dispositivos de treinamento: maquetes de cabine e saídas de emergência (mockups)

  5.4.10.1 O treinamento prático sobre equipamentos de emergência para itens tais como saídas
  de emergência e sistema de oxigênio para passageiros deve ser conduzido em uma aeronave
  estática, em um dispositivo de treinamento (mockup) de cabine aprovado ou em um dispositivo
  de treinamento (mockup) de saídas de emergência aprovado. Os mockups de cabine e de saídas
  de emergência devem ser representativos de uma seção em escala real da aeronave. Os mockups
  de cabine devem possuir portas operacionais, janelas de saída, escorregadeiras, botes salva-vidas
  e quaisquer outros equipamentos utilizados durante o treinamento de equipamentos de emergência.
  A ANAC não aprovará o uso de mockups de cabine e de saídas de emergência sem antes realizar
  uma inspeção para determinar sua adequação. Os mockups de cabine e de saídas de emergência
  são aceitáveis se cumprirem com os seguintes critérios:'
