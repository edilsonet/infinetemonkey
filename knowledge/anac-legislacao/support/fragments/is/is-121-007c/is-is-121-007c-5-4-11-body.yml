text: '5.4.11 Avaliação do segmento de currículo de emergências gerais para aprovação inicial.

  5.4.11.1 Ao avaliar um segmento de currículo de emergências gerais para aprovação inicial,
  a ANAC irá determinar se os módulos de treinamento contenham informação de suficiente qualidade,
  escopo e profundidade para garantir que os tripulantes de voo possam executar tarefas e
  procedimentos de emergência sem supervisão.

  5.5 Segmento de currículo de solo'
