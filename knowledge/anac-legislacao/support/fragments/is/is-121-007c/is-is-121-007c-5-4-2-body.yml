text: '5.4.2 Relação entre as categorias de treinamento e o segmento de currículo de emergências
  gerais

  5.4.2.1 Treinamento inicial. Todos os operadores do RBAC nº 121 devem desenvolver e obter
  aprovação do segmento de currículo de emergências gerais para a categoria de treinamento
  inicial de nova contratação. Os operadores que possuem treinamento inicial de equipamento
  aplicável a pilotos que alternam entre aeronaves do Grupo I (aviões propelidos a hélice)
  e do Grupo II (aviões propelidos a jato) devem desenvolver um segmento de currículo de emergências
  gerais para os tripulantes designados a receber treinamento inicial de equipamento numa
  aeronave de grupo diferente pela primeira vez. Os operadores podem desenvolver um segmento
  de currículo de emergências gerais separado para os tripulantes de voo designados a receber
  treinamento inicial de equipamento numa aeronave de um mesmo grupo. Neste caso, a decisão
  em desenvolver um segmento de emergências gerais em separado deve estar baseada na complexidade
  da operação, bem como nas diferenças dos regimes de voo, dos equipamentos de emergência
  e dos procedimentos associados às aeronaves envolvidas.

  5.4.2.2 Treinamento de transição. Não existem requisitos para um segmento de currículo de
  emergências gerais em separado para a categoria de treinamento de transição. Os tripulantes
  de voo devem ter recebido previamente o treinamento de emergências gerais durante o treinamento
  inicial (nova contratação ou inicial de equipamento). O treinamento de emergências “específico
  da aeronave” deve estar incluído nos segmentos de currículo de solo e de voo.

  5.4.2.3 Treinamento de elevação de nível. Considerando os treinamentos de emergências gerais
  previamente realizados pelos tripulantes de voo para a função anteriormente exercida (em
  treinamentos iniciais e periódicos), os operadores devem desenvolver segmentos de currículo
  de emergências gerais que abordem as diferenças de atividades entre as funções anteriormente
  executadas (MCV ou SIC) e as funções para as quais estão se qualificando (SIC ou PIC). O
  treinamento de emergências “específico da aeronave” deve estar incluído nos segmentos de
  currículo de solo e de voo.

  5.4.2.4 Treinamento periódico. Os operadores do RBAC nº 121 devem desenvolver e obter aprovação
  de um segmento de currículo de emergências gerais em separado para a categoria de treinamento
  periódico, conforme detalhado no item 5.4.9 desta IS.

  5.4.2.5 Treinamento de requalificação. Um segmento de currículo de emergências gerais é
  requerido para a categoria de treinamento de requalificação dependendo da finalidade desse
  treinamento. Se o propósito do treinamento envolver a requalificação de tripulantes de voo
  que perderam a qualificação no segmento de emergências gerais há mais de um ano, então a
  aplicação de um novo segmento de emergências gerais deve ser requerida.'
