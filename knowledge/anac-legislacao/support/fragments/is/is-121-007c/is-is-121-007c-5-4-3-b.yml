section_title: Módulos do segmento de currículo de emergências gerais
subsection_id: b
cite: 5.4.3(b)
title: 5.4.3(b)
text: 'b) uma lista dos elementos relacionados ao módulo que serão ministrados durante o treinamento.

  5.4.3.2 Os módulos de treinamentos devem conter elementos ou eventos suficientes para garantir
  que os tripulantes receberão treinamento sobre equipamentos de emergência e sobre procedimentos
  comuns a todas aeronaves do operador e tipos de operação realizadas.

  5.4.3.3 Não é necessário incluir descrições detalhadas de cada elemento dentro da ementa
  do módulo de treinamento. Essas descrições detalhadas são mais apropriadas quando incluídas
  no material didático do operador. Durante o processo de aprovação, a ANAC avaliará o material
  didático para garantir que o alcance e a profundidade da instrução sejam adequados. A Figura
  3 gerais apresenta um exemplo com um método aceitável de apresentação de um módulo do segmento
  de currículo emergências gerais.


  Figura 3 - Módulo do segmento de currículo de emergências gerais

  Nota: na Figura 3, itens como procedimentos de fogo no motor, procedimentos contra incêndios
  por causa elétrica e a localização de cada extintor de incêndios não foram incluídos intencionalmente
  no módulo de emergências gerais. Estes elementos estão incluídos nos segmentos de currículo
  de treinamento de solo e de voo da aeronave.'
