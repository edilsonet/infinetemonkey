title: Carga horária
text: '5.4.4 Carga horária

  5.4.4.1 O RBAC nº 121 não especifica um número mínimo de horas de treinamento para o segmento
  de currículo de treinamento de emergências gerais. Ao elaborar este segmento, o operador
  deve considerar a complexidade do tipo de operação e das aeronaves utilizadas.

  5.4.4.2 Como referência, deve ser usada a tabela da Figura 5. As horas de treinamento necessárias
  para um tipo complexo de operação podem exceder a referência apresentada, enquanto, para
  um tipo menos complexo, pode ser aceitável uma carga horária menor.

