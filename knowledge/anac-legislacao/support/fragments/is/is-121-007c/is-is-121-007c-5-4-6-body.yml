title: Conteúdo do segmento de currículo de emergências gerais para tripulantes de voo
text: '5.4.6 Conteúdo do segmento de currículo de emergências gerais para tripulantes de voo

  5.4.6.1 Um segmento de currículo de emergências gerais deve indicar a realização de instrução,
  apropriada ao tipo de operação do operador, em duas áreas distintas. Estas áreas de treinamento
  são: “situações de emergência” e “equipamentos de emergências”.'
