text: '5.4.9 Módulos do segmento de currículo de emergências gerais periódico

  5.4.9.1 O treinamento de emergências gerais periódico deve consistir de módulos de treinamento
  (subdivididos em elementos e eventos) agrupados nas áreas de situações de emergência e equipamentos
  de emergência.

  5.4.9.2 A ementa do treinamento periódico de emergências gerais deve consistir de todos
  os itens listados no RBAC 121.417. O treinamento deve ser realizado a cada 12 (doze) meses,
  normalmente no mesmo período em que o treinamento periódico de solo da aeronave é conduzido.

  5.4.9.3 Os módulos do treinamento sobre situações de emergência que são parte do segmento
  de currículo de emergências gerais periódico devem incluir pelo menos o seguinte:'
