text: 'd) doenças, ferimentos, uso apropriado de equipamentos de primeiros socorros e outras
  situações anormais que envolvam passageiros ou tripulantes.

  5.4.9.4 Os módulos de treinamento de equipamentos de emergência que requerem que os tripulantes
  realmente manuseiem os equipamentos devem ser conduzidos pelo menos a cada 24 (vinte e quatro)
  meses. Durante períodos alternados de 12 (doze) meses, o treinamento de equipamentos de
  emergência pode ser realizado mediante demonstrações ou apresentações pictóricas. Os módulos
  do treinamento sobre equipamentos de emergência que são parte do segmento de currículo de
  emergências gerais periódico devem incluir pelo menos o seguinte:'
