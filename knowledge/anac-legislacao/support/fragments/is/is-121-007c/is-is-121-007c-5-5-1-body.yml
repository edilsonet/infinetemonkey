text: '5.5.1 Generalidades

  5.5.1.1 Esta seção estabelece os objetivos e orienta sobre a estrutura e o conteúdo do segmento
  de currículo de solo para tripulantes de voo. Este segmento está composto por três áreas
  distintas de treinamento, identificadas como: assuntos gerais operacionais, sistemas da
  aeronave e integração de sistemas.'
