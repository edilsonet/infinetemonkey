title: Integração de sistemas
text: '5.5.10 Integração de sistemas

  5.5.10.1 A terceira área do segmento de treinamento de currículo de solo é definida como
  “integração de sistemas da aeronave”. Esta área capacita o tripulante sobre como os sistemas
  da aeronave se inter-relacionam com os procedimentos normais, anormais e de emergência.
  Este treinamento inclui procedimentos tão básicos quanto os usados para energizar com a
  APU os sistemas elétricos e pneumáticos, ou tão complexos quanto os usados para programar
  os sistemas computadorizados de navegação e voo automático. O treinamento sobre integração
  de sistemas da aeronave deve incluir CRM, interação dos tripulantes com o uso das listas
  de verificação e outros procedimentos operacionais. Normalmente, é conduzido utilizando
  recursos de treinamento de solo representando uma configuração específica da cabine de comando,
  incluindo a lógica dos interruptores e indicadores/anunciadores. Os simuladores de voo e
  dispositivos de treinamento de voo descritos na seção sobre o segmento de currículo de voo
  também podem ser usados para treinamento em integração de sistemas. Adicionalmente, os sistemas
  de treinamento baseados em computador ou outros sistemas interativos podem ser usados para
  este treinamento. O treinamento sobre integração de sistemas pode ser ministrado em conjunto
  com o treinamento sobre sistemas da aeronave ou como a última fase do segmento de currículo
  de solo.

  5.5.10.2 O treinamento efetivo em integração de sistemas deve servir como uma ponte lógica
  entre o segmento de currículo de solo e o segmento de currículo de voo. Este treinamento
  deve permitir que os tripulantes se familiarizarem com a configuração da cabine de comando,
  listas de verificação, procedimentos do operador e outras áreas que são mais bem assimiladas
  antes que eles conduzam manobras e procedimentos reais de voo. A ANAC considerará este tipo
  de treinamento, bem como a qualidade e capacidade dos dispositivos de treinamento utilizados
  como fatores decisivos para eventual redução das horas de treinamento.'
