title: Recursos de treinamento de solo
text: '5.5.11 Recursos de treinamento de solo

  5.5.11.1 Alguns recursos de treinamento de solo são utilizados pelos operadores durante
  a condução do segmento de currículo de solo. O nível de sofisticação destes recursos pode
  variar desde uma simples exibição pictórica em papel até uma aeronave estática. Estes podem
  incluir apresentações em slides, sistemas de instrução baseados em computador, painéis de
  sistemas da aeronave, modelos, maquetes, dispositivos de treinamento de voo, simuladores
  de voo e outros inúmeros métodos para ministrar o treinamento. O operador deve solicitar
  aprovação para uso de cada recurso de treinamento de solo durante o processo de aprovação
  inicial ou final de um segmento de currículo de solo.

  Nota: os simuladores de voo e dispositivos de treinamento de voo requerem qualificação prévia
  da ANAC como pré-requisito para constarem no programa de treinamento do operador.'
