section_title: 'Ao avaliar um segmento de currículo de solo para aprovação inicial, a ANAC
  irá determinar se eles cumprem com os seguintes critérios:'
subsection_id: a
cite: 5.5.12.1(a)
title: 5.5.12.1(a)
text: a) a carga horária especificada em cada módulo proposto será examinada. A qualidade
  ou a suficiência do treinamento não serão medidas apenas a partir da quantidade de horas.
  A adequação da qualidade e suficiência será determinada apenas mediante a observação direta
  do treinamento e dos testes e exames em progresso ou mediante análise dos relatórios de
  auditorias e investigações. No entanto, as horas de treinamento especificadas devem ser
  realistas em termos da quantidade de tempo que levará para realizar a instrução descrita
  no segmento de currículo. Quaisquer petições e justificativas apropriadas para a redução
  das horas de treinamento devem ser submetidas pelo operador junto com a proposta inicial;
