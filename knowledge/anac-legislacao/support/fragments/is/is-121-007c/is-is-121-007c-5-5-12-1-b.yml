section_title: 'Ao avaliar um segmento de currículo de solo para aprovação inicial, a ANAC
  irá determinar se eles cumprem com os seguintes critérios:'
subsection_id: b
cite: 5.5.12.1(b)
title: 5.5.12.1(b)
text: 'b) a proposta de segmento de currículo deverá conter módulos de treinamento apropriados
  para aeronave específica. Os módulos devem possuir elementos ou eventos suficientes para
  garantir que o treinamento ministrado aos tripulantes terá a qualidade e a profundidade
  necessárias em um assunto em particular.

  5.6 Segmento de currículo de voo'
