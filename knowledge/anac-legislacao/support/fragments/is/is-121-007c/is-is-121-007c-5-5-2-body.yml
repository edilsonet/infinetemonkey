title: Objetivos do treinamento de solo
text: '5.5.2 Objetivos do treinamento de solo

  5.5.2.1 O objetivo principal do treinamento de solo é fornecer aos tripulantes de voo os
  conhecimentos necessários para que compreendam as funções básicas dos sistemas da aeronave,
  o uso dos componentes de cada sistema individual, a integração dos sistemas da aeronave
  e os procedimentos operacionais. Uma exigência importante de um segmento de currículo de
  solo é que, uma vez concluído, o tripulante de voo deverá estar suficientemente preparado
  para iniciar o segmento de currículo de voo. O treinamento de solo explorado nesta seção
  é aquele para um tipo específico de aeronave. O treinamento de solo pode ser conduzido utilizando
  diversos métodos, tais como instrução em sala de aula, dispositivos de treinamento de solo,
  instrução baseada em computador, simuladores de voo, dispositivos de treinamento de voo
  e aeronaves estáticas.'
