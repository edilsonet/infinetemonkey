title: Relação entre as categorias de treinamento e o segmento de currículo de solo
text: '5.5.3 Relação entre as categorias de treinamento e o segmento de currículo de solo

  5.5.3.1 Os tripulantes de voo devem concluir com êxito um segmento de currículo de solo
  para cada categoria apropriada de treinamento (inicial de nova contratação, inicial de equipamento,
  transição, elevação de nível, periódico ou requalificação). Cada segmento de treinamento
  de solo consiste de módulos de treinamento que contêm matérias pertinentes e apropriadas
  à categoria de treinamento. Os módulos de treinamento podem ser desenvolvidos para serem
  utilizados de forma intercambiável entre as várias categorias de treinamento. Por exemplo,
  um mesmo módulo de treinamento do sistema hidráulico pode ser utilizado nas categorias de
  treinamento inicial de nova contratação, inicial de equipamento e de transição.'
