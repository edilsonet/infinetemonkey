cite: 5.5.4(b)
title: 5.5.4(b)
text: 'b) uma lista dos elementos relacionados ao módulo que serão ministrados durante o treinamento.

  5.5.4.2 Os módulos de treinamento devem conter elementos ou eventos suficientes para garantir
  que os tripulantes receberão instrução sobre as principais características e operação dos
  sistemas individuais, bem como sobre a integração destes sistemas com outros da aeronave.
  Não é necessário incluir descrições detalhadas de cada elemento dentro de um módulo de treinamento.
  Essas descrições detalhadas são mais apropriadas quando incluídas no material didático do
  operador. Durante o processo de aprovação, a ANAC avaliará o material didático para garantir
  que o alcance e a profundidade da instrução seja adequada. A Figura 7 oferece um exemplo
  com um método aceitável de apresentação de um módulo do segmento de currículo de solo.


  Figura 7 - Módulo do segmento de currículo de solo'
