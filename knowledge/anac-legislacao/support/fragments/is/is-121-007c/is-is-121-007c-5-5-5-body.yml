title: Carga horária
text: '5.5.5 Carga horária

  5.5.5.1 A carga horária de treinamento deve estar especificada em todos os segmentos de
  currículo de solo propostos. Além de considerar o relatório de avaliação operacional, em
  atendimento à IS nº 121-006, o operador deve se basear em critérios razoáveis (por exemplo,
  experiência prévia, interação com o fabricante da aeronave ou outros operadores) para determinar
  se o treinamento pode ser adequadamente realizado dentro das horas de treinamento especificadas.
  Certos métodos de treinamento, tais como treinamento baseado em computador, permitem aos
  tripulantes progredirem a uma taxa que depende da capacidade particular de cada um em assimilar
  os conhecimentos ou habilidades necessárias. Para estes métodos, a carga horária especificada
  deve ser um indicativo do tempo que um aluno médio irá progredir durante o treinamento.

  5.5.5.2 A Figura 9 oferece uma referência para determinar as horas de treinamento para os
  segmentos de currículo de solo. Esta tabela apresenta as cargas horárias padrão previstas
  no RBAC 121.419 e 121.427 para as categorias de treinamento inicial de nova contratação,
  inicial de equipamento e periódico. Apesar de não estarem especificadas no RBAC nº 121,
  a tabela também apresenta cargas horárias de referência para as categorias de treinamento
  de transição e de elevação de nível.


