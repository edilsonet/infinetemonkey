  Figura 9 - Horas de treinamento de solo para tripulantes de voo

  5.5.5.3 De acordo com o RBAC 121.405(d), a ANAC pode aprovar reduções aos requisitos de
  horas programadas das categorias de treinamento inicial de nova contratação, inicial de
  equipamento e periódico. Para aprovar essas reduções, a ANAC irá avaliar previamente se
  os auxílios de instrução, dispositivos, métodos e procedimentos listados pelo operador irão
  melhorar a qualidade e a eficácia treinamento. Nesses casos, o documento que transmite a
  aprovação inicial ou final para estes segmentos de currículo conterá uma declaração com
  os fundamentos para reduzir as horas programadas do RBAC nº 121.

  5.5.5.4 As exigências de treinamento de solo para a categoria de elevação de nível variam
  amplamente dependendo da experiência e da função anterior dos tripulantes e da condição
  de qualificação deles na aeronave para a qual o treinamento está sendo conduzido. Nos casos
  de tripulantes que não tenham operado a aeronave por um longo período, o treinamento de
  solo para elevação de nível pode precisar ser tão extenso quanto um treinamento inicial
  de equipamento. Em outros casos, quando os tripulantes estão atualmente qualificados na
  aeronave, seja como mecânico de voo ou segundo em comando, o treinamento de solo para elevação
  de nível pode ser apenas aquela instrução necessária para qualificá-los na nova função.
  Para o estabelecimento da carga horária do treinamento de elevação de nível, o operador
  deverá ter definida a política de promoção de tripulantes, determinando claramente quais
  são os requisitos de qualificação e experiência recente que um tripulante deve cumprir para
  ser elegível a cada um dos múltiplos currículos da categoria de elevação de nível.'
