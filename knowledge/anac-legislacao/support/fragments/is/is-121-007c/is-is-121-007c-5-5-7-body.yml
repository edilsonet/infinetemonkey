title: Conteúdo dos segmentos de currículo de solo da aeronave
text: '5.5.7 Conteúdo dos segmentos de currículo de solo da aeronave

  5.5.7.1 Um segmento de currículo de solo deve apresentar o treinamento dividido em três
  áreas distintas, apropriadas à aeronave específica. Estas áreas de treinamento são “assuntos
  gerais operacionais, “sistemas da aeronave” e “integração de sistemas”. O operador deve
  desenvolver módulos de treinamento individuais para cada uma destas áreas de treinamento.
  Normalmente, o treinamento de integração de sistemas deve ocorrer na parte final do curso.
  No entanto, outros métodos de desenvolvimento dos módulos e sua sequência podem ser aceitáveis.'
