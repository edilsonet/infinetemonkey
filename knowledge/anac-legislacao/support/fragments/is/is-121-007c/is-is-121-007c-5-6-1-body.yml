text: '5.6.1 Generalidades

  5.6.1.1 Esta seção estabelece os objetivos e orienta sobre a estrutura e conteúdo dos segmentos
  de currículo de voo. Também esclarece as diferenças entre os objetivos do treinamento e
  os objetivos da qualificação. O treinamento de voo consiste de certas manobras e procedimentos
  requeridos definidos como “eventos de treinamento”. Os eventos de treinamento que devem
  ser incluídos nos segmentos de currículo de voo para satisfazer os requisitos do RBAC nº
  121 estão especificados nas tabelas de manobras e procedimentos apresentadas nesta seção.'
