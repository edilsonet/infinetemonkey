title: Dispositivo de treinamento de voo nível 5
text: '5.6.11 Dispositivo de treinamento de voo nível 5

  5.6.11.1 Propósito: Permite o aprendizado, desenvolvimento e prática de habilidades, procedimentos
  da cabine de comando e procedimentos de voo por instrumentos necessários para entender e
  operar os sistemas integrados de uma aeronave específica em típicas operações de voo em
  tempo real.'
