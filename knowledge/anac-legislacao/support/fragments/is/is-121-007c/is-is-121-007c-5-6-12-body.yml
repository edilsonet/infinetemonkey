title: Dispositivo de treinamento de voo nível 6
text: '5.6.12 Dispositivo de treinamento de voo nível 6

  5.6.12.1 Propósito: Permite o aprendizado, desenvolvimento e prática de habilidades em procedimentos
  da cabine de comando, procedimentos de voo por instrumentos, certas manobras simétricas
  e características de voo necessárias para operação dos sistemas integrados de uma aeronave
  específica em operações de voo típicas.'
