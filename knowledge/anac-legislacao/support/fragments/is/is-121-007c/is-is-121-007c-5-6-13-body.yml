title: Dispositivo de treinamento de voo nível 7
text: '5.6.13 Dispositivo de treinamento de voo nível 7

  5.6.13.1 Propósito: Permite o aprendizado, desenvolvimento e prática de habilidades em procedimentos
  da cabine de comando, procedimentos de voo por instrumentos e características de voo necessárias
  para operação dos sistemas integrados de uma aeronave específica em operações de voo típicas.'
