title: Simulador de voo nível A
text: '5.6.14 Simulador de voo nível A

  Propósito: Permite o desenvolvimento e prática das habilidades necessárias para a realização
  de tarefas operacionais de voo de acordo com um padrão pré-estabelecido de competência em
  uma aeronave e função a bordo específicas. Os simuladores nível A podem ser utilizados para
  exigências específicas de experiência recente dos pilotos e para exigências específicas
  em tarefas operacionais de voo dos treinamentos de transição, elevação de nível, periódico
  e requalificação. Também podem ser utilizados para eventos específicos do treinamento inicial
  de nova contratação e inicial de equipamento.'
