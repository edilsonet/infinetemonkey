title: Simulador de voo nível B
text: '5.6.15 Simulador de voo nível B

  5.6.15.1 Propósito: Permite o desenvolvimento e prática das habilidades necessárias para
  a realização de tarefas operacionais de voo de acordo com um padrão pré-estabelecido de
  competência em uma aeronave e função a bordo específicas. Os simuladores nível B podem ser
  utilizados para os requisitos de experiência recente dos pilotos e para exigências específicas
  em tarefas operacionais de voo dos treinamentos de transição, elevação de nível, periódico
  e requalificação. Também podem ser utilizados para eventos específicos do treinamento inicial
  de nova contratação e inicial de equipamento. Simuladores nível B também podem ser usados
  para realização de pousos e decolagens noturnas e para pousos durante um exame de proficiência.'
