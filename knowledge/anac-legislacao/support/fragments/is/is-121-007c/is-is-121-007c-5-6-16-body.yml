title: Simulador de voo nível C
text: '5.6.16 Simulador de voo nível C

  5.6.16.1 Propósito: Permite o desenvolvimento e prática das habilidades necessárias para
  a realização de tarefas operacionais de voo de acordo com um padrão pré-estabelecido de
  competência em uma aeronave e função a bordo específicas. Os simuladores nível C podem ser
  utilizados para os requisitos de experiência recente dos pilotos e para exigências específicas
  em tarefas operacionais de voo dos treinamentos de transição, elevação de nível, periódico
  e requalificação. Também podem, desde que aprovados no programa de treinamento, ser utilizados
  para todos os eventos do treinamento inicial de nova contratação e inicial de equipamento,
  desde que observadas as restrições estabelecidas no item 3(c) do apêndice H do RBAC nº 121.'
