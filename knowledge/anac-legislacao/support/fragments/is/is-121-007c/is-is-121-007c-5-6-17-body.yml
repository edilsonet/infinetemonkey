title: Simulador de voo nível D
text: '5.6.17 Simulador de voo nível D

  5.6.17.1 Propósito: Permite o desenvolvimento e prática das habilidades necessárias para
  a realização de tarefas operacionais de voo de acordo com um padrão pré-estabelecido de
  competência em uma aeronave e função a bordo específicas. Simuladores nível D podem ser
  usados para os requisitos de experiência recente dos pilotos e para treinamento de todas
  as tarefas operacionais de voo, exceto, como os demais simuladores, a instrução em aeronave
  estática, exame em rota e aquisição de experiência de operação.'
