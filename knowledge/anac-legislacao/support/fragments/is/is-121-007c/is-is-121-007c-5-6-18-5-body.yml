text: '5.6.18.5 O operador deve garantir que o treinamento inclui procedimentos e limitações
  do AFM para operações em condições de gelo, se disponível.

  5.6.18.6 Antes de cada tabela de manobras e procedimentos, há um parágrafo que indica as
  manobras e procedimentos requeridos para cada tripulante e fornece orientações sobre áreas
  específicas de ênfase que devem estar inclusas no treinamento.'
