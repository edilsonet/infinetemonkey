title: 5.6.18(a)
text: a) um “X” indica que a qualificação do FSTD especificado é tal que usualmente são dispensadas
  avaliações específicas do seu uso para o respectivo evento do segmento de currículo de voo
  com vistas à aprovação do FSTD no programa de treinamento. Entretanto, deve ser observado
  que existem variações entre FSTD de um mesmo nível, usualmente como consequência de sua
  data de fabricação e as respectivas regras de qualificação de FSTD vigentes à época. Essas
  variações podem ter como consequência a incapacidade do FSTD de simular adequadamente uma
  dada manobra ou procedimento. Nesses casos as limitações usualmente serão apontadas na documentação
  de qualificação do simulador. É responsabilidade do operador verificar essas limitações
  e considerá-las na elaboração de seu programa de treinamento;
