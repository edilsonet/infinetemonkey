cite: 5.6.18(b)
title: 5.6.18(b)
text: b) um “A” indica que um FSTD de nível mais baixo pode ser utilizado para o treinamento
  de procedimentos se aquele dispositivo tiver as representações de sistemas e funções necessárias
  para o treinamento do evento. Como estas representações de sistemas e funções excedem os
  requisitos básicos para aquele nível de dispositivo, um “A” indica que o dispositivo deve
  ser avaliado e aprovado para aquele evento em particular. Qualquer manobra ou procedimento
  permitido em um nível específico de FSTD também pode ser conduzido em um simulador ou dispositivo
  de treinamento de nível mais alto ou na própria aeronave (desde que o evento possa ser realizado
  com segurança na aeronave);
