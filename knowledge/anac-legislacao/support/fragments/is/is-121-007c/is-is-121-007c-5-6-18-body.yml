text: '5.6.18 Tabelas de manobras e procedimentos

  5.6.18.1 Os eventos que devem ser realizados durante o treinamento de voo estão listados
  nas tabelas de manobras e procedimentos dos apêndices de B a E desta IS. Os requisitos do
  RBAC nº 121 estão incluídos nestas tabelas. Estas tabelas devem ser utilizadas durante o
  desenvolvimento das propostas de segmento de currículo de voo. Estas tabelas também descrevem
  os equipamentos de treinamento aceitáveis (FSTD ou aeronave) que podem ser usados para cada
  evento de treinamento. As informações constantes nas tabelas devem ser interpretadas da
  seguinte forma:'
