text: '5.6.19.1.1 Os pilotos em comando devem completar o treinamento em cada evento desta
  tabela.

  5.6.19.1.2 Os SIC devem completar o treinamento em cada evento desta tabela. O treinamento
  dos SICs para os seguintes eventos não requer manipulação dos controles primários da aeronave,
  devendo enfatizar os deveres como pilot monitoring (PM):'
