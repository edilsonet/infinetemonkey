text: '5.6.19 Treinamento de voo inicial de nova contratação e inicial de equipamento para
  PIC/SIC

  5.6.19.1 Manobras e procedimentos requeridos. O treinamento das manobras e procedimentos
  da tabela do Apêndice B desta IS deve ser conduzido para conclusão satisfatória do segmento
  de currículo de voo do treinamento inicial de nova contratação e inicial de equipamento.'
