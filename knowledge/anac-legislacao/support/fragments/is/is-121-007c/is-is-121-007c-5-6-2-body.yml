title: Objetivo do treinamento de voo
text: '5.6.2 Objetivo do treinamento de voo

  5.6.2.1 O treinamento de voo, como explorado nesta seção, significa a condução dos eventos
  de treinamento em aeronave, simulador de voo ou dispositivo de treinamento de voo de acordo
  com um currículo de treinamento aprovado. Segundo o RBAC 121.424, as manobras e procedimentos
  requeridos no treinamento de voo devem ser executados em avião, exceto: as manobras e procedimentos
  para tesouras de vento, que devem ser executadas em um simulador do avião especificamente
  aprovado para a execução de tais manobras e procedimentos; e manobras e procedimentos que
  possam ser executadas em um simulador do avião, em dispositivo de treinamento adequado ou
  em um avião estático, conforme permitido pelo Apêndice E do RBAC nº 121. O treinamento de
  voo também pode ser conduzido utilizando uma combinação de aeronave com um simulador de
  voo ou dispositivo de treinamento de voo. Em todos os casos, o objetivo principal do treinamento
  de voo é oferecer aos tripulantes a oportunidade para adquirir as habilidades e os conhecimentos
  necessários para desempenhar sua função de acordo com um padrão desejado. Esta oportunidade
  estipula demonstração, treinamento e prática de manobras e procedimentos (eventos de treinamento)
  relacionados a uma particular aeronave e função a bordo. A conclusão bem sucedida do treinamento
  de voo é validada mediante exames apropriados.'
