section_title: Treinamento de transição para PIC. Os pilotos em comando devem completar o
  treinamento em cada evento desta tabela.
subsection_id: b
cite: 5.6.20.1.1(b)
title: 5.6.20.1.1(b)
text: 'b) Treinamento de elevação de nível. Ênfase deve ser colocada sobre os deveres e responsabilidades
  específicos relacionados à função a bordo do tripulante. Adicionalmente, no caso de um mecânico
  de voo sendo promovido a segundo em comando, deve ser enfatizado o treinamento em manobras
  de voo (particularmente em aproximações e pousos).

  Nota: as áreas de ênfase para a aeronave normalmente constam no relatório de avaliação operacional.'
