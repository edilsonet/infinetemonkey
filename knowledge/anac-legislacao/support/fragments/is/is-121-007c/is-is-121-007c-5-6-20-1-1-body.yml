text: '5.6.20.1.1 Treinamento de transição para PIC. Os pilotos em comando devem completar
  o treinamento em cada evento desta tabela.

  5.6.20.1.2 Treinamento de transição para SIC. Os segundos em comando devem completar o treinamento
  em cada evento desta tabela. O treinamento dos SICs para os seguintes eventos não requer
  manipulação dos controles primários da aeronave, devendo enfatizar os deveres como pilot
  monitoring (PM):'
