text: 'c) curvas de grande inclinação.

  5.6.20.1.3 Treinamento de elevação de nível para PIC. Um segundo em comando sendo promovido
  para piloto em comando deve completar o treinamento em cada evento desta tabela (incluindo
  aqueles marcados com “PIC”).

  5.6.20.1.4 Treinamento de elevação de nível para SIC. Mecânicos de voo sendo promovidos
  a segundo em comando devem completar o treinamento em cada evento desta tabela. O treinamento
  para os seguintes eventos não requer manipulação dos controles primários da aeronave, devendo
  enfatizar os deveres como pilot monitoring (PM):'
