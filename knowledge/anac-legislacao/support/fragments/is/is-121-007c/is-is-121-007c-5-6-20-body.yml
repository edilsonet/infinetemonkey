text: '5.6.20 Treinamento de voo de transição e de elevação de nível para PIC/SIC

  5.6.20.1 Manobras e procedimentos requeridos. O treinamento das manobras e procedimentos
  da tabela do Apêndice C desta IS deve ser conduzido para conclusão satisfatória do segmento
