section_title: Treinamento de voo periódico para PIC/SIC
subsection_id: a
cite: 5.6.21(a)
title: 5.6.21(a)
text: a) Treinamento de voo periódico. É o treinamento que deve ser conduzido por um piloto
  em comando ou segundo em comando uma vez a cada 12 meses e deve incluir instrução nas manobras
  e procedimentos listados no Apêndice F do RBAC nº 121. Os simuladores de voo níveis B, C
  e D usualmente dispensam avaliações sobre seu uso para treinamento em cada manobra ou procedimento
  do treinamento periódico com vistas a aprovação do simulador no programa de treinamento.
  Entretanto, deve ser observado que existem variações entre simuladores de um mesmo nível,
  usualmente como consequência de sua data de fabricação e as respectivas regras de qualificação
  de simuladores vigentes à época. Essas variações podem ter como consequência a incapacidade
  do FSTD de simular adequadamente uma dada manobra ou procedimento requerido. Nesses casos
  as limitações usualmente serão apontadas na documentação de qualificação do simulador. É
  responsabilidade do operador verificar essas limitações e considerá-las na elaboração de
  seu programa de treinamento. O treinamento de voo periódico também pode ser realizado em
  aeronave.
