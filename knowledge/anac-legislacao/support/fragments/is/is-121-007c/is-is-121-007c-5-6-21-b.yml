title: 5.6.21(b)
text: 'b) Treinamento de voo periódico em simuladores nível A. Os simuladores de voo nível
  A (simuladores visuais) não estão qualificados para serem utilizados no treinamento de certas
  manobras listadas no Apêndice E do RBAC nº 121, tais como pousos e decolagens. No entanto,
  esses simuladores podem ser utilizados para instrução e prática nos procedimentos usados
  para realizar essas manobras. Estas manobras estão marcadas com a letra “C” na tabela do
  Apêndice D desta IS. O exame de proficiência pode ser realizado em um simulador nível A,
  desde que a pessoa que está sendo examinada seja avaliada durante a condução de dois pousos
  em operações de linha (ou outro exame) por um examinador credenciado. Um exame de proficiência
  completo (sem a exigência dos pousos em linha) pode ser realizado em simuladores de voo
  nível B, C e D.

  5.6.21.2 Considerações sobre ênfase do treinamento. Os operadores devem desenvolver o segmento
  de currículo de voo do treinamento periódico de forma a maximizar o treinamento em certas
  manobras e procedimentos. A competência do piloto para desempenhar em sua função designada
  é avaliada durante um exame de proficiência anual. Durante esse exame, pelo menos os eventos
  requeridos pelo Apêndice F do RBAC nº 121 devem ser realizados. O segmento de currículo
  de voo do treinamento periódico deve abordar todos os eventos de treinamento listados no
  Apêndice D desta IS. Durante o treinamento de voo periódico, a ênfase da instrução deve
  ser sobre aqueles eventos, manobras ou procedimentos que normalmente não são encontrados
  durante as operações de linha de rotina, tais como treinamento em procedimentos anormais
  ou de emergência ou treinamento de tesouras de vento. Adicionalmente, o treinamento em manobras
  ou procedimentos novos ou revisados, novos equipamentos ou outras áreas similares é especialmente
  adequado para os períodos do treinamento de voo periódico.

  Nota: embora nem todas as manobras e procedimentos precisem ser realizados durante o treinamento
  de voo periódico, a documentação do segmento de currículo deve abordar todos os eventos
  de treinamento listados no Apêndice D desta IS.'
