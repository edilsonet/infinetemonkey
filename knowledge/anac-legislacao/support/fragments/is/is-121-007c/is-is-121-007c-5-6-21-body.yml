text: '5.6.21 Treinamento de voo periódico para PIC/SIC

  5.6.21.1 Manobras e procedimentos requeridos. O treinamento das manobras e procedimentos
  da tabela do Apêndice D desta IS deve ser conduzido de acordo com os parágrafos a seguir
  para conclusão satisfatória do segmento de currículo de voo do treinamento periódico.'
