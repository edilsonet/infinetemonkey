text: '5.6.22 Treinamento de voo inicial de nova contratação, inicial de equipamento, de transição
  e periódico para MCV

  5.6.22.1 Treinamento requerido para a emissão inicial de licença de mecânico de voo. Todos
  os solicitantes de um certificado de habilitação técnica inicial de mecânico de voo devem
  satisfazer os requisitos estabelecidos no RBHA 63, Subparte B, ou regulamento que vier a
  substituí-lo.

  5.6.22.2 Treinamento de voo de transição para mecânico de voo. Um mecânico de voo empregado
  por um operador do RBAC nº 121 que é designado de um avião para outro deve completar o segmento
  de currículo de voo de transição aprovado segundo o RBAC nº 121. O uso de aeronaves, simuladores
  e dispositivos de treinamento de voo para a realização de eventos de treinamento devem ser
  propostos pelo operador e aprovados pela ANAC.

  5.6.22.3 Manobras e procedimentos requeridos. O treinamento nas manobras e procedimentos
  da tabela do Apêndice E desta IS deve ser conduzido para conclusão satisfatória do treinamento
  inicial de nova contratação, inicial de equipamento, de transição ou periódico para mecânicos
  de voo anteriormente habilitados ou para emissão da licença inicial de mecânico de voo.
  O treinamento para essas manobras e procedimentos deve incluir instrução em procedimentos
  normais, anormais e de emergência, conforme apropriado.

  5.6.22.4 Considerações sobre ênfase do treinamento. O operador deve garantir que o treinamento
  de voo para mecânico de voo enfatize as áreas apropriadas para cada categoria de treinamento:'
