title: Objetivo da qualificação
text: '5.6.3 Objetivo da qualificação

  5.6.3.1 O objetivo do segmento de currículo de qualificação é determinar se ocorreu um aprendizado
  suficiente durante o treinamento, a partir da comparação do desempenho individual do tripulante
  em situações práticas com padrões estabelecidos. Uma pessoa que cumpre os objetivos da qualificação
  finaliza satisfatoriamente tal segmento de currículo. Por sua vez, uma pessoa que falha
  em cumprir estes objetivos deve regressar à condição de treinamento. Após treinamento adicional,
  o tripulante técnico deve repetir e finalizar com êxito, pelo menos, aquelas partes do segmento
  de currículo de qualificação consideradas anteriormente insatisfatórias.'
