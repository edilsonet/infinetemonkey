text: '5.6.4 Módulos do segmento de currículo de voo

  5.6.4.1 Um segmento de currículo de voo deve ser proposto em formato modular (módulos de
  treinamento) ou como uma série de eventos que devem ser cumpridos durante o treinamento.
  Este segmento de currículo deve incluir quantos módulos ou eventos forem necessários para
  proporcionar um treinamento adequado. Cada proposta de módulo de treinamento (se usado pelo
  operador) deve fornecer pelo menos as seguintes informações:'
