section_title: Módulos do segmento de currículo de voo
subsection_id: c
cite: 5.6.4(c)
title: 5.6.4(c)
text: 'c) quando o operador perder a aprovação de um segmento de currículo por causa de deficiências,
  a ANAC pode exigir novo desenvolvimento desse segmento para incluir módulos ou eventos de
  treinamento altamente detalhados (o nível de detalhe deve fornecer informações suficientes
  para garantir que as deficiências identificadas anteriormente foram corrigidas).

  5.6.4.4 Para garantir conformidade com os regulamentos, os módulos e eventos de treinamento
  devem conter pelo menos os eventos listados nas tabelas de manobras e procedimentos dos
  apropriados apêndices desta IS. A inter-relação dos módulos e/ou eventos de treinamento
  dentro de um segmento de currículo deve proporcionar uma progressão ordenada e prática do
  treinamento. Por exemplo, o táxi pode ser listado como um evento no primeiro módulo de um
  segmento de currículo de voo, mas não precisa ser listado nos módulos subsequentes, embora
  a instrução sobre manobras de táxi aconteça durante todo o treinamento de voo. Os módulos
  devem ser desenvolvidos de forma que os eventos de treinamento sejam apresentados em uma
  sequência lógica. Por exemplo, o treinamento de aproximação perdida deve ser realizado em
  conjunto com o treinamento de aproximação.'
