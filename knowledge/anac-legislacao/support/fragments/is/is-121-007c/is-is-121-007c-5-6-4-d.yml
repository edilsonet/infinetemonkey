title: 5.6.4(d)
text: 'd) disposições sobre briefing antes e depois de cada período de treinamento.

  5.6.4.2 O operador pode apresentar uma proposta contendo módulos de treinamento representando
  blocos de eventos ou uma proposta listando todos os elementos e eventos a serem realizados
  durante o treinamento de voo. Outras formas de apresentação do segmento de currículo de
  voo podem ser aceitáveis. Independentemente do formato utilizado, os operadores devem elaborar
  o segmento de currículo de voo comparando-o com as tabelas de manobras e procedimentos dos
  apropriados apêndices desta IS. Durante o treinamento real, a ordem e ritmo de apresentação
  dos eventos de treinamento podem variar. Um instrutor pode variar os eventos em um segmento
  de currículo publicado, durante qualquer período em particular, quando o progresso do estudante
  indica a necessidade. No entanto, um evento requerido não pode ser omitido de um segmento
  de currículo. A ANAC avaliará durante inspeções o material didático do treinamento de voo
  do operador, bem como os planos de aula e guias do instrutor, a fim de assegurar que existe
  um plano no qual todos os eventos serão apropriadamente cumpridos. Para maior suporte da
  existência desse plano, também serão avaliados os formulários usados pelo operador para
  registar o treinamento de voo. Não é necessário que a ANAC aprove o material didático do
  curso ou os formulários de registro do treinamento.

  5.6.4.3 Não é necessário incluir descrições detalhadas sobre como as manobras e os procedimentos
  específicos serão realizados dentro da ementa dos módulos ou dos eventos de treinamento.
  A princípio, tais descrições devem constar no AFM aprovado, no AOM do operador ou em um
  documento separado de manobras e procedimentos (por exemplo, o Flight Crew Training Manual
  - FCTM). Descrições detalhadas ou representações pictóricas são requeridas para certas manobras,
  procedimentos e funções normais, anormais e de emergência executadas durante o treinamento
  de voo. No entanto, a ANAC pode exigir que os operadores forneçam propostas de treinamento
  extremamente detalhadas nas seguintes situações:'
