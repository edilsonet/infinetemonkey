cite: 5.6.5(a)
title: 5.6.5(a)
text: 'a) Dois tripulantes. Uma composição de tripulantes apropriada é vital para o conceito
  de treinamento LOFT. Práticas de escala aceitáveis e permissões para substituição da tripulação
  diferem no LOFT periódico e na qualificação LOFT. Excepcionalmente a tripulação no treinamento
  LOFT pode ser composta por dois SIC ou dois PIC. Nesse caso, ambos pilotos devem receber
  um crédito total de 4 horas, desde que:

  1) a sessão LOFT possua um mínimo de 4 horas;

  2) ao menos 2,5 horas sejam utilizadas no cenário LOFT; e

  3) os pilotos troquem os assentos aproximadamente na metade do segmento de voo LOFT.'
