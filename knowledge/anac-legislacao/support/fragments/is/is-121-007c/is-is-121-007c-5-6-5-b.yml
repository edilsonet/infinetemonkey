cite: 5.6.5(b)
title: 5.6.5(b)
text: 'b) Um tripulante. Excepcionalmente, quando um único tripulante participa de uma sessão
  de qualificação LOFT, este tripulante deverá receber um crédito completo de 4 horas, desde
  que as seguintes condições sejam cumpridas:

  1) A sessão LOFT possua um mínimo de 4 horas; e

  2) Ao menos 2,5 horas sejam utilizadas no cenário LOFT.

  Nota: uma seção de qualificação LOFT de 2 horas para um piloto não atende aos requisitos
  de treinamento do Apêndice H do RBAC nº 121. Um programa de qualificação LOFT consiste de
  pelo menos um período de treinamento de quatro horas para cada tripulante.

  5.6.5.6 As tabelas a seguir especificam as cargas horárias de referência para os segmentos
  de currículo de voo. Essas cargas horárias se baseiam na premissa de que existem auxílios
  de treinamento razoáveis, tais como instrutores eficientes e guias de instrução de voo bem
  organizados. As informações da Figura 14 se aplicam quando a maioria ou todo o treinamento
  de voo é realizado em FSTD e quando dois pilotos são treinados nos postos de pilotagem na
  mesma sessão. As informações da Figura 15 se aplicam quando o treinamento de voo é realizado
  por somente um tripulante em FSTD ou aeronave. Treinamento de voo de dois pilotos simultaneamente
  em aeronave não é permitido.

  5.6.5.7 Ao determinar a adequação da carga horária do treinamento de voo, o operador deve
  utilizar as informações das tabelas a seguir como um ponto de partida, a partir do qual
  outros fatores também devem ser considerados. Podem existir muitas razões para que as horas
  de treinamento sejam maiores do que as especificadas nestas tabelas. Pode ser necessário
  especificar uma carga horária maior devido à complexidade da aeronave e dos tipos de operação.
  A ANAC pode também requerer mais horas em caso de auxílios de treinamento inadequados. Por
  outro lado, uma carga horária menor pode ser aceitável com o uso de métodos de treinamento
  altamente sofisticados, treinamento efetivo sobre integração de sistemas no segmento de
  currículo de solo, aeronaves menos complexas ou um tipo menos complexo de operação. A tabela
  a seguir ilustra alguns fatores que devem ser considerados ao determinar a adequação das
  horas de treinamento de voo.

