text: '5.6.5 Carga horária

  5.6.5.1 Os segmentos de currículo de voo devem especificar o número planejado de horas de
  treinamento. A carga horária proposta pelo operador deve conceder de forma realista tempo
  suficiente para demonstração, instrução e prática dos eventos de treinamento listados no
  segmento de currículo completo. A ANAC não aprovará um segmento de currículo de voo a menos
  que a carga horária seja suficiente para realizar todos os eventos de treinamento requeridos.

  5.6.5.2 O RBAC 121.424 e 121.425 estabelecem as cargas horárias de treinamento de voo em
  avião para pilotos e mecânicos de voo inscritos nas categorias de treinamento inicial de
  nova contratação e inicial de equipamento. De acordo com o RBAC 121.405(d), a ANAC pode
  aprovar uma redução das horas previstas no próprio RBAC nº 121 para as categorias de treinamento
  inicial de nova contratação e inicial de equipamento. Para aprovar uma proposta de redução,
  a ANAC avaliará se todos os auxílios de instrução, dispositivos, métodos e procedimentos
  listados pelo operador no currículo de treinamento irão melhorar a qualidade e a eficácia
  do processo ensino/aprendizado. A tabela da Figura 12 lista as horas programadas do RBAC
  nº 121 para treinamento em avião.


  Grupo de aeronaves

