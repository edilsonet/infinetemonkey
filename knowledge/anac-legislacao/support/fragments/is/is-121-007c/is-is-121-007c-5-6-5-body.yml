  5.6.5.3 O RBAC nº 121 não estabelece as horas programadas de treinamento de voo em avião
  para as demais categorias de treinamento e não estabelece as horas programadas de treinamento
  de voo em FSTD para todas as categorias de treinamento. No entanto, a carga horária deve
  estar especificada em todos os segmentos de currículo de voo propostos pelo operador. Além
  de considerar o relatório de avaliação operacional, em atendimento à IS nº 121-006, o operador
  deve usar as referências estabelecidas nesta IS, bem como suas experiências passadas, experiências
  com o fabricante e com outros operadores, e um julgamento razoável para determinar se o
  treinamento pode ser adequadamente realizado dentro da carga horária especificada no segmento
  de currículo.

  5.6.5.4 Quando o treinamento é conduzido em FSTD, é aceitável e desejável desenvolver o
  segmento de currículo de voo de modo que dois pilotos possam ser treinados durante a mesma
  sessão. Isso inclui o treinamento de um PIC e um SIC, dois PIC ou dois SIC ao mesmo tempo.
  Durante este tipo de treinamento, um piloto (piloto A) manipula os controles da aeronave
  (pilot flying - PF), enquanto o outro piloto (piloto B) executa as responsabilidades de
  monitoramento (pilot monitoring - PM). Durante a mesma sessão, os pilotos devem alternar.
  O piloto B manipula os controles (PF) e o piloto A executa os deveres de PM. As responsabilidades
  do PM estão normalmente incluídas nos manuais de operação da aeronave e/ou nos documentos
  de manobras e procedimentos. Estas responsabilidades incluem deveres em situações normais,
  anormais e de emergência (que são executadas pelo PM) e as atividades de participação da
  tripulação (conceitos de CRM) utilizados pelo operador. Ambos os pilotos receberão treinamento
  essencial dos conceitos de CRM durante toda a sessão. Portanto, as horas totais realizadas
  durante a sessão de treinamento podem ser creditadas a cada piloto participante. Por exemplo,
  se um PIC e um SIC participam de uma sessão de 4 horas em um simulador de voo, ambos receberão
  um crédito de treinamento de 4 horas. Este método para creditar as horas de treinamento
  é válido somente quando ambos os pilotos alunos manipulam os controles por aproximadamente
  o mesmo período, 2 horas cada. Este método de crédito de horas não é válido quando o instrutor
  está fornecendo instrução e ao mesmo tempo ocupando um dos assentos de pilotagem da aeronave,
  do simulador de voo ou do dispositivo de treinamento de voo.

  5.6.5.5 As sessões de treinamento LOFT, sejam de qualificação ou periódicas, devem estar
  baseadas em pelo menos 4 horas totais de atividade de treinamento dos tripulantes, como
