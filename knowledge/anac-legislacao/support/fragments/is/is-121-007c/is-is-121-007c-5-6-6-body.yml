title: Requisitos para completar o segmento
text: '5.6.6 Requisitos para completar o segmento

  5.6.6.1 Normalmente, um tripulante deve terminar um segmento de currículo de voo após cumprir
  com êxito cada evento de treinamento e a carga horária especificada. Os tripulantes devem
  então cumprir satisfatoriamente as exigências especificadas no segmento de currículo de
  qualificação. Se o tripulante falhar em cumprir qualquer uma das exigências de qualificação
  por falta de competência em voo, ele deverá regressar à condição de treinamento. Ao receber
  novo treinamento, uma recomendação do instrutor é necessária para que o tripulante volte
  a realizar as partes insatisfatórias da qualificação.'
