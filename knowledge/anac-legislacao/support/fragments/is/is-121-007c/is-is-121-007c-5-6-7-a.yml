section_title: Avaliação do segmento de currículo de voo para aprovação inicial
subsection_id: a
cite: 5.6.7(a)
title: 5.6.7(a)
text: a) os eventos de treinamento devem estar de acordo com as tabelas de manobras e procedimentos
  aplicáveis à categoria de treinamento específica. O operador deve selecionar a tabela de
  manobras e procedimentos apropriada e realizar uma comparação detalhada da tabela e do segmento
  de currículo de voo proposto. Os eventos de treinamento requeridos e o nível apropriado
  de FSTD ou aeronave a serem utilizados devem constar na proposta. A omissão de qualquer
  evento requerido ou a indicação inapropriada de um FSTD será razão suficiente para negar
  a aprovação inicial;
