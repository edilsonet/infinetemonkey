subsection_id: c
cite: 5.6.7(c)
title: 5.6.7(c)
text: c) O treinamento deve enfatizar áreas específicas aplicáveis à categoria de treinamento.
  Como as propostas de treinamento de voo normalmente não são construídas de modo a permitir
  determinar se as áreas apropriadas foram enfatizadas, a ANAC examinará os auxílios de instrução
  do curso (tais como materiais didáticos, guias do instrutor de voo e cenários LOFT), a fim
  de determinar se tais áreas foram enfatizadas e se o operador é capaz de desenvolver ferramentas
  de treinamento aceitáveis. Nos parágrafos que precedem as tabelas de manobras e procedimentos
  desta seção, considerações sobre ênfase na instrução para cada categoria de treinamento
  são discutidas.
