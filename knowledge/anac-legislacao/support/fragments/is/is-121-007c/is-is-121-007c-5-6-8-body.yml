title: Elaboração do documento de manobras e procedimentos do operador
text: '5.6.8 Elaboração do documento de manobras e procedimentos do operador

  5.6.8.1 O operador deve fornecer um documento de manobras e procedimentos (por exemplo,
  o Flight Crew Training Manual - FCTM) para aprovação da ANAC. O operador deve garantir que
  este documento forneça descrições detalhadas ou ilustrações pictóricas para as manobras
  normais, anormais e de emergência, incluindo os procedimentos e funções que serão executadas
  no treinamento de voo. Os guias de instrutor ou planos de aula que darão suporte ao documento
  de manobras e procedimentos devem especificar as condições (tais como condições meteorológicas,
  pesos da aeronave e outros parâmetros) a serem aplicados durante a instrução de uma manobra
  ou procedimento. As condições especificadas nestes guias ou planos de aula devem ser equivalentes
  aos tipos de operação autorizadas nas EO, tais como decolagens com baixa visibilidade ou
  o uso de mínimos de aproximação Categoria II ou Categoria III. Descrições detalhadas ou
  ilustrações pictóricas são requeridas para pelo menos os eventos de treinamento identificados
  com o símbolo “M” nas tabelas de manobras e procedimentos (detalhadas no parágrafo 5.6.18
  desta IS). Os documentos de manobras e procedimentos devem ser elaborados com suficiente
  detalhe para garantir que cumprem com os seguintes critérios:'
