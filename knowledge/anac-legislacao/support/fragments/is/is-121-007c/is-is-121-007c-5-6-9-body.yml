title: Dispositivos de treinamento para simulação de voo (FSTD)
text: '5.6.9 Dispositivos de treinamento para simulação de voo (FSTD)

  5.6.9.1 Os equipamentos para treinamento de voo consistem da aeronave, de simuladores de
  voo (full fligh simulators - FFS) e de dispositivos de treinamento de voo (flight training
  devices - FTD). O tipo (ex: FFS ou FTD) e nível (ex: FFS nível C, FTD nível 7) que pode
  ser aprovado para cada manobra ou procedimento requerido no segmento de currículo de voo
  pode ser consultado nas tabelas dos apêndices B a E desta IS. Esses simuladores e dispositivos
  são os únicos tipos de equipamentos (além da própria aeronave) que podem ser aprovados em
  um programa de treinamento de voo.

  5.6.9.2 Para que um simulador de voo (FFS) seja elegível para inclusão no programa de treinamento,
  ele deve possuir qualificação da ANAC. Para alguns dispositivos de treinamento de voo (FTD)
  também é requerido que possuam qualificação da ANAC para serem elegíveis para inclusão no
  programa de treinamento. O fato de um simulador ou dispositivo de treinamento de voo possuir
  qualificação não é unicamente suficiente para que possa ser utilizado nos segmentos de currículos
  de voo, sendo necessária ainda sua aprovação específica no programa de treinamento do operador.

  5.6.9.3 Para aprovação de uso de FSTD o operador deverá descrever em seu programa de treinamento
  como serão integrados os usos de diferentes dispositivos, identificado cada um deles, de
  modo a realizar todas as manobras requeridas adequadamente em treinamentos e exames. Adicionalmente,
  ANAC irá avaliar no mínimo os seguintes documentos e informações:'
