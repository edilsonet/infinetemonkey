text: '5.7.1 Generalidades

  5.7.1.1 Esta seção contém orientação sobre a elaboração e aprovação dos segmentos de currículo
  de qualificação e seus respectivos módulos. Um segmento de currículo de qualificação é o
  segmento final de cada uma das seis categorias de treinamento para tripulantes de voo. Um
  segmento de currículo de qualificação é composto pelos módulos de testes, exames e experiência
  que um tripulante deve completar com sucesso após o treinamento formal, antes de estar qualificado
  para trabalhar sem supervisão como um tripulante segundo o RBAC nº 121'
