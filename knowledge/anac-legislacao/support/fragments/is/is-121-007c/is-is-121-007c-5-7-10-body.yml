title: Módulo de qualificação de exame em rota
text: '5.7.10 Módulo de qualificação de exame em rota

  5.7.10.1 O RBAC nº 121 estabelece que um tripulante, antes de servir como piloto em comando
  sem supervisão em operações comerciais, deve concluir satisfatoriamente um exame em rota.
  Exceto pelo treinamento de requalificação, o segmento de currículo de qualificação para
  pilotos em comando deve incluir um módulo de exame em rota para todas as demais categorias
  de treinamento. Os currículos de treinamento de requalificação devem incluir um módulo de
  exame em rota de acordo com a qualificação perdida pelo piloto; por exemplo, deve incluir
  o módulo de exame em rota quando os pilotos em comando tiverem perdido sua qualificação
  por 12 meses ou mais. O RBAC nº 121 ainda estabelece que todos os pilotos em comando devem
  completar satisfatoriamente um exame em rota a cada 12 meses em pelo menos um dos tipos
  de aeronave em que opera. Assim, o segmento de currículo de qualificação do treinamento
  periódico deve incluir um módulo de exame em rota para os pilotos em comando.

  5.7.10.2 Diretrizes e orientações gerais. O RBAC nº 121 estabelece que o exame em rota deve
  ser conduzido por um servidor da ANAC ou por um examinador credenciado devidamente qualificado
  no avião que está sendo usado. Em certas situações, como quando o operador está qualificando
  sua primeira turma de examinadores, a única forma prática de cumprir o requisito de exame
  em rota é solicitar que um servidor da ANAC conduza o exame e certifique o desempenho do
  piloto em comando. Para o RBAC nº 121, o tempo usado para realização do exame em rota pode
  ser creditado como hora de experiência de operação. No entanto, o exame em rota não deve
  ser realizado até que o requisito de horas de experiência de operação tenha sido completado
  significativamente. Os operadores devem colocar ênfase em seus programas de exame em rota.
  Um programa de exame em rota bem gerenciado pode permitir a detecção de deficiências e tendências
  adversas e estabelecer a necessidade de revisão de procedimentos antigos ou do início de
  novos procedimentos. Para registrar os resultados dos exames em rota, os operadores devem
  utilizar a FAP prevista na IS nº 00-002 (ou, se aprovado pela ANAC, conforme item 5.7.7.1.1
  desta IS, a FAP prevista em seu programa de treinamento).

  5.7.10.3 Exame em rota no RBAC nº 121. Para as operações segundo o RBAC nº 121, o exame
  em rota deve ser realizado ao longo de pelo menos uma rota típica na qual o piloto em comando
  pode ser designado a operar. Se a rota típica em que o piloto em comando irá voar incluir
  navegação autônoma, então o exame em rota deve ser realizado em uma rota onde a navegação
  autônoma é usada. O exame em rota pode ser realizado durante operações comerciais ou não-comerciais.'
