section_title: 'O parágrafo 121.434(h) do RBAC nº 121 identifica situações de exceção:'
subsection_id: a
cite: 5.7.11.3(a)
title: 5.7.11.3(a)
text: a) em 121.434(h)(3), se estabelece que, por padrão, o piloto não deve operar outro tipo
  de avião (que não o avião em que está concluindo sua qualificação) durante o período de
  consolidação de conhecimentos e habilidades. Caso o piloto opere outro avião pelo mesmo
  detentor de certificado nesse período, ele ficará impedido de retornar ao avião em que está
  se qualificando, até que complete um treinamento de atualização conduzido por um instrutor
  apropriadamente qualificado ou por um examinador credenciado. Se o operador prevê que tal
  situação pode ocorrer, deverá incluir esse treinamento de atualização em seu programa de
  treinamento;
