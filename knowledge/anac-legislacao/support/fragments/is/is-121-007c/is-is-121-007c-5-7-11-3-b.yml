section_title: 'O parágrafo 121.434(h) do RBAC nº 121 identifica situações de exceção:'
subsection_id: b
cite: 5.7.11.3(b)
title: 5.7.11.3(b)
text: 'b) em 121.434(h)(4), se prevê a possibilidade de extensão do período de 120 dias para
  até 150 dias. Para tanto, o operador deve avaliar se:

  I. o piloto continua a atender os outros requisitos aplicáveis da Subparte O do RBAC nº
  121; e

  II. até o 120º dia, um examinador credenciado comprovar e atestar que o piloto manteve um
  nível de proficiência adequado após observá-lo em um voo de operação em rota; ou, até o
  120º dia, o piloto completar, satisfatoriamente, um treinamento de atualização conduzido
  por um instrutor apropriadamente qualificado ou por um examinador credenciado. Nesse último
  caso, o operador deve incluir esse treinamento de atualização em seu programa de treinamento;
