section_title: 'O parágrafo 121.434(h) do RBAC nº 121 identifica situações de exceção:'
subsection_id: c
cite: 5.7.11.3(c)
title: 5.7.11.3(c)
text: 'c) em 121.434(h)(5), se prevê a possibilidade de, mediante solicitação do operador,
  a ANAC conceder um desvio, o que ocorrer por ofício ou pelas EO. As circunstâncias consideradas
  pela ANAC para avaliar a possibilidade do desvio são:

  I. um detentor de certificado que, no início de suas operações, não emprega um piloto que
  atenda aos requisitos mínimos do parágrafo 121.434(g);

  II. um detentor de certificado que já opera normalmente e adiciona um novo tipo de avião
  a sua frota; e

  III. um detentor de certificado que estabeleça uma nova base de tripulantes em uma estação
  de linha, onde estarão baseados pilotos que devem se qualificar nos aviões que operem nessa
  nova base.

  Nota: as situações descritas em 121.434(h)(1) e (2) se referiam a períodos de transição,
  da época da inclusão do requisito no regulamento, não sendo aplicáveis para operadores atualmente.'
