title: Módulo de qualificação de consolidação de conhecimentos e habilidades
text: '5.7.11 Módulo de qualificação de consolidação de conhecimentos e habilidades

  5.7.11.1 Conforme o parágrafo 121.434(g) do RBAC nº 121, os pilotos em comando e segundos
  em comando, como padrão, devem adquirir, para consolidação de conhecimentos e habilidades,
  100 horas de tempo de voo de operação em rota dentro de 120 dias após a conclusão do exame
  de proficiência. Nessas 100 horas, estão incluídas as horas de experiência de operação descritas
  no item 5.7.9 desta IS, bem como as horas do exame em rota descrito no item 5.7.10 desta
  IS.

  5.7.11.2 A consolidação de conhecimentos e habilidades pode ser realizada em operações comerciais.
  Diferentemente das horas de experiência operacional, no entanto, não é necessário que tais
  voos sejam realizados com instrutor ou com examinador credenciado. Durante esse período,
  o operador deve se atentar especialmente aos requisitos de dupla, como estabelecidos na
  seção 121.438 do RBAC nº 121, bem como aos requisitos da seção 121.652.'
