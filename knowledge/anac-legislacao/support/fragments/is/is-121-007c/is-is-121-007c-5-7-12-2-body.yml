text: '5.7.12.2 Módulos adicionais de exame podem ser realizados simultaneamente com um exame
  de voo, exame de proficiência ou exame em rota.

  5.7.12.3 Os normativos específicos que tratam de operações especiais usualmente requerem
  módulos adicionais de exame, porém nem sempre especificam o conteúdo desses exames. Considerando
  que há vários meios aceitáveis ​​para realização esses exames, o operador deve detalhar
  na descrição do módulo adicional de exame o conteúdo de tais avaliações.

  5.7.12.4 Quando um operador optar por realizar um módulo adicional de exame em conjunto
  com um módulo básico de exame, os requisitos de ambos os módulos devem ser cumpridos. No
  entanto, um único evento pode ser creditado para ambos os módulos ao mesmo tempo.

  5.7.12.5 Os operadores podem optar por realizar módulos adicionais de exame separadamente
  de um exame de voo, exame de proficiência ou exame em rota. Quando os módulos de exame forem
  realizados em separado, o operador deve limitar o uso de tripulantes àqueles voos que não
  envolvem operações especiais até que esses tripulantes tenham completado satisfatoriamente
  os exames adicionais.

  5.8 Segmento de currículo especial'
