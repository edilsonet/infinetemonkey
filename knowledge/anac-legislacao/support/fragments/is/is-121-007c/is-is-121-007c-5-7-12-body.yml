title: Módulos adicionais de exame
text: '5.7.12 Módulos adicionais de exame

  5.7.12.1 Módulos adicionais de exame incluem a avaliação de eventos que devem ser realizados
  para qualificar tripulantes de voo em operações especiais, tais como aproximações por instrumentos
  CAT II ou CAT III. Outro exemplo de um módulo adicional de exame é o requisito para qualificação
  de um piloto em comando ao longo de rotas ou sobre áreas que requerem um tipo especial de
  navegação (conforme RBAC 121.445(d)(2)).'
