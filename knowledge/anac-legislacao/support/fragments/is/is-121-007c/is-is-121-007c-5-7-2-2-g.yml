title: 5.7.2.2(g)
text: 'g) Treinamento orientado para operação em rota (Line Oriented Flight Training - LOFT).
  LOFT é um módulo de treinamento realizado em um simulador de voo após a conclusão do módulo
  básico de exame para satisfazer os requisitos do Apêndice H do RBAC nº 121.

  5.7.2.3 Módulos de experiência. O RBAC nº 121 requer que os módulos de experiência sejam
  concluídos antes que um tripulante de voo trabalhe sem supervisão e sem restrições em operações
  comerciais. Outros módulos de experiência são requeridos para autorizações especiais ou
  para restabelecer a experiência recente. Um ou mais dos seguintes módulos de experiência
  podem ser necessários em um segmento de currículo de qualificação:'
