title: Licenças e habilitações requeridas pelo RBAC nº 121
text: '5.7.4 Licenças e habilitações requeridas pelo RBAC nº 121

  5.7.4.1 Todos os tripulantes de voo devem possuir licenças e habilitações específicas antes
  de exercer suas atividades em operações comerciais segundo o RBAC nº 121. Se um tripulante
  de voo não possuir as licenças e/ou habilitações exigidas, elas devem ser obtidas ao término
  do segmento de currículo de qualificação.'
