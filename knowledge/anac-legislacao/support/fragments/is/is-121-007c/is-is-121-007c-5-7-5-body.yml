title: Módulo básico de exame
text: '5.7.5 Módulo básico de exame

  5.7.5.1 Os módulos básicos de exames são compostos de duas partes: uma parte consiste nos
  elementos dos testes escritos ou orais, e a outra parte consiste nos eventos do exame de
  proficiência em voo. Embora sejam partes distintas e separadas, quando combinadas compõem
  um único módulo de exame.

  5.7.5.2 Conteúdo do módulo básico de exame. Os assuntos que devem ser abordadas no teste
  escrito ou oral para o módulo básico de exame estão descritos no Apêndice F do RBAC nº 121.

  5.7.5.3 Padrões de desempenho. Nas operações segundo o RBAC nº 121, pode ser exigido um
  nível de proficiência mais alto do que o exigido para a emissão inicial da licença do piloto.
  O padrão exigido para os exames básicos é no mínimo o necessário para obter a licença necessária
  para atuar como piloto em comando. Por exemplo, um segundo em comando que possui uma licença
  de piloto comercial com uma habilitação IFR e que esteja fazendo uma aproximação por instrumentos
  (ILS) em um B737 deve ter o mesmo padrão de proficiência do piloto em comando sentado à
  esquerda que possui uma licença de PLA e uma habilitação de tipo para o B737.

  5.7.5.4 Uso de dispositivos. O operador pode aproveitar ao máximo os FSTD na elaboração
  do segmento de currículo de qualificação. Por exemplo, um operador pode avaliar um piloto
  em comando e um segundo em comando simultaneamente em muitos procedimentos normais, anormais
  e de emergência quando um simulador de voo é usado. Consequentemente, os operadores são
  incentivados a elaborar os segmentos de currículo de qualificação usando ao máximo os FSTD.

  5.7.5.5 Treinamento LOFT. Um módulo de treinamento LOFT é considerado parte do segmento
  de currículo de qualificação, apesar de ser um evento de experiência, e não de exame. Um
  piloto que se qualifica para uma licença ou habilitação em um simulador de voo de nível
  C ou D recebe a respectiva licença ou habilitação imediatamente após completar satisfatoriamente
  o exame básico. No entanto, o piloto não está qualificado para realizar operações comerciais
  até ter concluído com sucesso o módulo de treinamento LOFT.

  5.7.5.6 O módulo básico de exame requerido pelo RBAC nº 121 é denominado exame de proficiência
  (para pilotos) e exame de voo (para mecânicos de voo). O exame de proficiência para pilotos
  consiste nos elementos escritos ou orais e nos eventos de voo especificados no Apêndice
  F do RBAC nº 121. O Apêndice F desta IS resume os elementos e eventos que compõem um exame
  de proficiência. Um exame de proficiência qualifica os pilotos tanto para operações VFR
  quanto IFR e aproximações por instrumento CAT I com mínimos padrão. Operações como aproximações
  CAT II ou CAT III requerem módulos adicionais de exame. Para um mecânico de voo, o exame
  de voo consiste nos eventos resumidos no Apêndice G desta IS. Embora o RBAC nº 121 não exija
  explicitamente um elemento de teste oral ou escrito como parte do exame de voo para mecânicos
  de voo, o operador deve garantir que tal teste seja incluído como parte do módulo básico
  de exame.'
