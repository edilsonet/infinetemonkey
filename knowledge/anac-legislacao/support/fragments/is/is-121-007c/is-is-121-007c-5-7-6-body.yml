title: Crédito para os exames de proficiência de certificação de pessoal
text: '5.7.6 Crédito para os exames de proficiência de certificação de pessoal

  5.7.6.1 Quando um exame de proficiência é realizado para concessão de uma licença de PLA
  ou para averbação de uma nova habilitação de tipo numa licença de PLA, esse exame, se realizado
  de acordo com o programa de treinamento aprovado do operador, poderá ser simultaneamente
  creditado como um exame de proficiência segundo o RBAC nº 121.

  5.7.6.2 O exame de voo para concessão de uma licença de MCV ou para averbação de uma habilitação
  a uma licença de MCV satisfaz o requisito de exame de voo segundo o RBAC nº 121.'
