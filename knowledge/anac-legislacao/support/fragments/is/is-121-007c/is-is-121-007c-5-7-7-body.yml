text: '5.7.7 Condução dos exames de voo e de proficiência

  5.7.7.1 Diretrizes e orientações específicas para realização dos exames de proficiência
  de pilotos para certificação de pessoal estão estabelecidas na Instrução Suplementar nº
  00-002. Os operadores deverão garantir que seus examinadores credenciados realizem os exames
  de proficiência segundo o RBAC nº 121 de acordo com os mesmos padrões, diretrizes e orientações
  aplicáveis aos exames de proficiência para certificação de pessoal.

  5.7.7.1.1 A IS nº 00-002 permite que os operadores realizem exames de proficiência de maneira
  alternativa à estabelecida na própria IS, desde que seja assegurada a proficiência dos candidatos
  aprovados em nível, no mínimo, equivalente ao previsto na IS e desde que haja aprovação
  da ANAC. Os operadores que optarem por adotar maneira alternativa devem incluir explicitamente
  em seu programa de treinamento as diferenças desejadas. Por exemplo, caso o operador pretenda
  utilizar modelos de FAP diferentes do previsto na IS nº 00-002, deve incluir em seu programa
  de treinamento os modelos de FAP que deseja utilizar.

  5.7.7.2 Desvios de eventos. Os examinadores credenciados do operador podem dispensar a realização
  daqueles eventos indicados por um asterisco (*) nas figuras dos Apêndices F e G desta IS.
  De acordo com o RBAC 121.441(d), os eventos só podem ser dispensados se:'
