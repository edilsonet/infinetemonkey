section_title: Condução dos exames de voo e de proficiência
subsection_id: c
cite: 5.7.7(c)
title: 5.7.7(c)
text: 'c) o piloto ou mecânico de voo sendo examinado esteja atualizado em operações segundo
  o RBAC nº 121 no particular tipo de avião e na particular função a bordo, ou tenha completado
  satisfatoriamente, dentro dos 6 meses precedentes, um programa de treinamento aprovado para
  o particular tipo de avião e função a bordo.

  5.7.7.2.1 O uso da autoridade para desvios não é automático. Os examinadores credenciados
  do operador devem exercer essa autoridade com cautela. Quando um examinando demonstrar um
  alto nível de desempenho, os examinadores podem fazer uso mais liberal da autoridade para
  desvios. No entanto, quando o desempenho de um examinando cumpre apenas com os padrões mínimos
  aceitáveis, nenhum dos eventos do exame de proficiência pode ser dispensado.

  5.7.7.2.2 O Apêndice F do RBAC nº 121 contém certas restrições sobre o desvio de eventos.
  Por exemplo, quando em um exame em avião uma aproximação para circular é necessária, se
  ela não puder ser realizada devido ao tráfego ou a outros motivos, ela pode ser dispensada.
  No entanto, as aproximações para circular não podem ser dispensadas por dois exames sucessivos.

  5.7.7.3 Treinamento para proficiência. Quando um examinador credenciado determinar que um
  evento de um exame não foi realizado satisfatoriamente, ele pode realizar treinamento e
  repetir a avaliação desse evento. Esta disposição é feita no interesse da imparcialidade
  e para evitar dificuldades e despesas indevidas para pilotos e operadores. No entanto, o
  treinamento adicional não pode ser realizado sem o registro da falha desses eventos. O controle
  de qualidade de um programa de treinamento é realizado, entre outros meios, pela identificação
  desses eventos em exames em que os tripulantes falharam. Os operadores e examinadores credenciados
  devem seguir as orientações abaixo quanto à prática do treinamento para proficiência:

  5.7.7.3.1 O treinamento e o exame não podem ser realizados simultaneamente. Quando o treinamento
  é necessário, o exame deve ser suspenso temporariamente, o treinamento deve ser realizado
  e, então, o exame deve ser retomado.

  5.7.7.3.2 Quando o treinamento para proficiência é necessário, o examinador credenciado
  deve registrar os eventos inicialmente insatisfatórios que motivaram a realização do treinamento
  adicional.

  5.7.7.3.3 Quando o treinamento para proficiência for realizado e o exame posteriormente
  concluído dentro da sessão original, a avaliação geral para o exame pode ser registrada
  como satisfatória. No entanto, quando o treinamento necessário para alcançar a proficiência
  não puder ser concluído na sessão de exame original, este deve ser registrado como insatisfatório
  e o tripulante deve ser enviado para treinamento de requalificação.

  5.7.7.3.4 Quando for necessário o treinamento para proficiência e for prático realizá-lo,
  os eventos restantes da fase do exame de proficiência devem ser concluídos antes que o treinamento
  no evento malsucedido seja realizado. Se for mais prático, o evento malsucedido pode ser
  repetido no final de uma sequência lógica.

  5.7.7.3.5 Se após receber treinamento adicional o tripulante falhar novamente em um evento,
  a falha deve ser registrada e o tripulante deve ser enviado para treinamento de requalificação.

  Nota: se por razões técnicas ou outras, o exame não puder ser concluído após a falha de
  um evento e antes de o treinamento e a reavaliação puderem ser realizados, o exame deve
  ser considerado finalizado. No entanto, o piloto não poderá trabalhar em operações comerciais
  até que o exame seja concluído com sucesso.'
