title: Uso de FSTD para exames de voo e de proficiência
text: '5.7.8 Uso de FSTD para exames de voo e de proficiência

  5.7.8.1 As orientações deste parágrafo se aplicam para o uso de FSTD na realização de exames
  de proficiência segundo o RBAC nº 121. O nível de FSTD que pode ser usado para qualquer
  evento de voo particular nesses exames depende da função a bordo do tripulante e da categoria
  de treinamento. As tabelas de manobras e procedimentos listadas nos Apêndices B, C e D desta
  IS especificam o nível mínimo de FSTD que pode ser usado para um determinado evento de treinamento.
  Este nível mínimo também é o nível que deve ser usado para avaliar o evento durante um exame
  de voo ou de proficiência. Antes de iniciar um exame, os examinadores credenciados do operador
  devem determinar quais eventos podem ser realizados no FSTD a ser usado.'
