cite: 5.7.9.2(b)
title: 5.7.9.2(b)
text: 'b) currículo de transição de aviões do grupo II para PIC e MCV

  Nota: não é permitida a redução das horas experiência de operação para tripulantes que estejam
  completando: inicial de nova contratação ou inicial de equipamento em aviões do grupo II
  para PIC, SIC ou MCV; ou transição em aviões do grupo II para SIC.

  5.7.9.3 Condução da experiência de operação. Todos os tripulantes de voo devem ter completado
  com sucesso um exame de voo ou de proficiência antes de iniciar a experiência de operação,
  sendo, portanto, considerados qualificados para trabalhar em operações comerciais sob supervisão
  adequada. Os tripulantes de voo devem adquirir experiência de operação durante a realização
  de operações comerciais, exceto quando o operador estiver incluindo um novo modelo de aeronave
  em sua frota. Nesse caso, as horas de voo adquiridas durante a realização de voos de translado
  ou de avaliação operacional poderão ser creditadas como horas de experiência de operação.

  5.7.9.3.1 Um piloto em processo de aquisição da experiência de operação como PIC segundo
  o RBAC nº 121 deve ocupar o assento apropriado e desempenhar funções de PIC sob a supervisão
  de um examinador credenciado ou instrutor de voo em avião. O examinador ou instrutor também
  deve ocupar um assento de piloto. No entanto, no caso de um PIC treinado sob um currículo
  de transição, o examinador ou instrutor poderá ocupar o assento do observador após o PIC
  em qualificação ter realizado pelo menos dois pousos e decolagens e o examinador ou instrutor
  estiver convencido de que o piloto é competente para executar os deveres de um PIC. Durante
  o tempo em que um PIC em qualificação estiver adquirindo a experiência de operação, o examinador
  ou instrutor deve dar instruções conforme necessário e ajudar a refinar a proficiência do
  piloto como um PIC. O examinador ou instrutor deve determinar quando o PIC estiver totalmente
  proficiente e pronto para ser avaliado durante um exame em rota inicial. Se o PIC em qualificação
  não estiver pronto para um exame em rota depois que as horas mínimas de experiência de operação
  estiverem concluídas, a supervisão deve continuar até que o PIC esteja proficiente. O examinador
  ou instrutor não deve recomendar um exame em rota inicial até que esteja convencido de que
  o PIC em qualificação está proficiente. Se o examinador ou instrutor recomendar o PIC para
  um exame em rota antes das horas mínimas de voo, então o período usado na realização do
  exame pode ser creditado como tempo de experiência de operação. No entanto, em todos os
  casos o PIC em qualificação deve completar satisfatoriamente as horas mínimas de voo e os
  ciclos de operação sob a supervisão de um examinador ou instrutor antes que ele possa ser
  liberado para trabalhar sem supervisão em voos comerciais.

  5.7.9.3.2 Um piloto em processo de aquisição de experiência de operação como SIC segundo
  o RBAC nº 121 deve ocupar o assento apropriado e desempenhar funções de SIC sob a supervisão
  de um examinador credenciado ou instrutor de voo em avião. O examinador ou instrutor também
  deve ocupar um assento de piloto. O SIC em qualificação deve completar satisfatoriamente
  as horas mínimas de voo e os ciclos de operação sob a supervisão de um examinador ou instrutor
  antes que ele possa ser liberado para trabalhar sem supervisão em voos comerciais.

  5.7.9.3.3 Um MCV em processo de aquisição de experiência de operação deve desempenhar suas
  funções na estação de mecânico de voo sob a supervisão de um examinador credenciado mecânico
  de voo ou um mecânico de voo qualificado. Em todos os casos, o MCV em qualificação deve
  completar satisfatoriamente as horas mínimas de voo antes de ser designado como mecânico
  de voo requerido em operações comerciais.

  5.7.9.4 Guia de qualificação de experiência de operação. Os operadores devem desenvolver
  um guia de qualificação de experiência de operação para ser usado por supervisores, instrutores
  de voo e examinadores credenciados. O objetivo do guia de qualificação é garantir que o
  tripulante de voo adquira sistematicamente experiência em todas as tarefas que será obrigado
  a executar posteriormente sem supervisão. Uma lista aceitável de eventos de experiência
  que podem ser incorporados em um guia de qualificação é a seguinte:'
