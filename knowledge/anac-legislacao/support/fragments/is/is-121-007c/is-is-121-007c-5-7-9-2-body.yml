text: '5.7.9.2 Horas de experiência de operação e ciclos de operação mínimos do RBAC nº 121

  5.7.9.2.1 Inicial de nova contratação para PIC ou SIC, inicial de equipamento para PIC ou
  SIC, transição para PIC com treinamento em simulador de voo. De acordo com o RBAC 121.434(c)(3)(i),
  os pilotos que estão completando o currículo inicial de nova contratação ou inicial de equipamento
  para PIC ou SIC, ou o currículo de transição para PIC que inclua treinamento em um simulador
  de voo aprovado devem completar satisfatoriamente o seguinte mínimo de ciclos operacionais
  e horas de experiência de operação:'
