  5.7.9.2.2 Transição para PIC sem treinamento em simulador de voo ou Transição para SIC.
  De acordo com o RBAC 121.434 (c)(3)(ii), os PICs que estão completando um currículo de transição
  que não inclua treinamento em um simulador de voo aprovado, e os SICs que estão completando
  um currículo de transição devem completar satisfatoriamente os seguintes mínimos de ciclos
