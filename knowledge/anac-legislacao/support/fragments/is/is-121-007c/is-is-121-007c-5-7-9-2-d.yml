title: 5.7.9.2(d)
text: 'd) aviões do grupo II para SIC: 15 horas e 4 ciclos de operação com pelo menos 2 ciclos
  como piloto nos controles do avião.

  5.7.9.2.3 Elevação de nível para PIC ou SIC. Embora o RBAC 121.434 requeira a conclusão
  satisfatória da experiência de operação para pilotos que estejam completando um currículo
  de elevação de nível, as horas mínimas de voo não estão estabelecidas. No entanto, as seguintes
  horas mínimas de voo são aceitáveis para uma elevação de nível de SIC para PIC e para uma
  elevação de nível de MCV para a SIC, independentemente de o currículo de elevação de nível
  incluir instrução em um simulador de voo aprovado:'
