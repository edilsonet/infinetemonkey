title: Módulo de qualificação de experiência de operação
text: '5.7.9 Módulo de qualificação de experiência de operação

  5.7.9.1 Os pilotos em comando e segundos em comando que estão concluindo os treinamentos
  inicial de nova contratação, inicial de equipamento, de transição ou de elevação de nível
  devem completar de forma satisfatória a experiência de operação. Os mecânicos de voo que
  estão concluindo os treinamentos inicial de nova contratação, inicial de equipamento e de
  transição devem adquirir experiência de operação. O segmento de currículo de qualificação
  aplicável aos tripulantes dessas funções a bordo deve listar os requisitos apropriados a
  cada função. O RBAC nº 121 estabelece os requisitos mínimos de horas de voo para essas funções.
  O RBAC nº 121 também estabelece ciclos de operação mínimos para pilotos. Os operadores podem
  optar por estabelecer em seus programas de treinamento requisitos de experiência de operação
  maiores do que o mínimo regulamentar.'
