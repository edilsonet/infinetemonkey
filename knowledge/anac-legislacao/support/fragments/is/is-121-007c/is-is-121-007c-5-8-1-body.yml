text: '5.8.1 Generalidades

  5.8.1.1 Esta seção contém diretrizes e orientações a serem utilizadas pelos operadores para
  elaboração e aprovação dos segmentos de currículo especiais. Para esse fim, os operadores
  devem estar cientes da seguinte distinção entre treinamento básico e treinamento especial:

  5.8.1.2 Treinamento básico. As seis categorias de treinamento definidas no RBAC nº 121 (inicial
  de nova contratação, inicial de equipamento, transição, elevação de nível, periódico e requalificação)
  contêm o treinamento básico necessário para tripulantes de voo se qualificarem numa aeronave
  específica e numa função a bordo específica. O treinamento nos procedimentos necessários
  para operar com auxílios de navegação padrão e até mínimos padrão é parte integrante desses
  currículos. Todos os operadores devem fornecer este treinamento básico. Os métodos e eventos
  de treinamento estão especificados nos regulamentos ou em outros normativos específicos
  e são bem compreendidos na indústria de transporte aéreo.

  5.8.1.2.1 Treinamento especial. O treinamento "especial" é o conduzido por um operador para
  qualificar tripulantes e despachantes além do escopo do treinamento básico. Cada operador
  é obrigado a realizar apenas o treinamento especial necessário para as suas operações específicas.
  Elementos e eventos de treinamentos especiais podem ser integrados em uma ou mais das seis
  categorias de treinamento definidas ou conduzidos como um segmento de currículo separado.
  Normalmente é necessário treinamento especial para operações que exigem autorização específica
  nas EO. Exemplos incluem, mas não se limitam a:'
