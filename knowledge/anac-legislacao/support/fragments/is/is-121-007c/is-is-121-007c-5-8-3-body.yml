title: Elaboração do treinamento especial
text: '5.8.3 Elaboração do treinamento especial

  5.8.3.1 O operador deve elaborar o currículo inicial de modo a garantir que ele inclua os
  segmentos, módulos, elementos e eventos apropriados. Os regulamentos, Instruções Suplementares,
  Instruções de Aviação Civil e demais normativos da ANAC sobre as várias operações especiais
  devem ser usados como referência na definição dos requisitos de treinamento para essas operações.
  A ANAC somente concederá aprovação inicial quando o currículo proposto pelo operador estiver
  em conformidade com tais normativos. Quando tais diretrizes e orientações não existirem,
  o operador deve realizar uma análise para identificar as tarefas necessárias e os padrões
  de desempenho apropriados para o treinamento especial. Para tanto, poderá usar como referência
  documentação publicada pela OACI, pelo fabricante da aeronave ou por outras autoridades
  estrangeiras. Nesse caso, o operador deverá enviar a análise das tarefas e dos padrões de
  desempenho como documentação de apoio juntamente com a proposta de currículo. A ANAC irá
  avaliar a documentação de suporte em conjunto com a proposta de currículo antes de conceder
  a aprovação inicial.'
