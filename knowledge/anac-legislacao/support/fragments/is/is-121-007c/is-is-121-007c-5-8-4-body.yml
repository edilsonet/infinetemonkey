title: Aplicações específicas dos segmentos de currículo especiais
text: '5.8.4 Aplicações específicas dos segmentos de currículo especiais

  5.8.4.1 Os operadores devem ter ciência de várias situações comuns nas quais é necessário
  treinamento especial. Alguns exemplos de aplicações específicas de treinamento especial
  são:

  5.8.4.1.1 Operações de bandeira. Nas operações de bandeira, é um requisito que os tripulantes
  possuam conhecimento dos procedimentos e EOs aplicáveis ​​a essas operações. Para a navegação
  autônoma, pode ser necessário que os tripulantes de voo conheçam procedimentos de navegação
  e equipamentos especializados (como o espaço aéreo NAT HLA ou sistemas de navegação inercial).
  Os operadores devem garantir que, nas operações de bandeira, os tripulantes de voo tenham
  prática supervisionada e demonstrem sua competência nessas operações antes de realizá-las
  sem supervisão.

  5.8.4.1.2 Aproximações CAT II e CAT III. Para treinamento nas aproximações CAT II e CAT
  III, os operadores devem garantir que o treinamento requerido inclua equipamentos especiais,
  procedimentos, práticas e demonstração de competência. O treinamento pode ser integrado
  nas seis categorias de treinamento definidas no RBAC nº 121, ou pode ser desenvolvido como
  um segmento de currículo separado. A ANAC poderá aprovar qualquer um desses métodos de organização.

  5.8.4.1.3 Operações de decolagem com baixa visibilidade. Antes que os pilotos possam realizar
  decolagens com mínimos abaixo do padrão em operações comerciais, eles devem receber instrução,
  praticar e demonstrar sua competência para realizar decolagens em condições mínimas de visibilidade
  autorizadas. Os operadores devem garantir que o treinamento inclua: requisitos de pista
  e iluminação; decolagens rejeitadas na velocidade de decisão (V1) ou próximo a ela com falha
  do motor mais crítico; operações de táxi; e procedimentos para evitar incursões de pista
  em condições de baixa visibilidade. Este treinamento deve ser realizado em um simulador
  de voo aprovado.

  Nota: o treinamento para operações de decolagem com baixa visibilidade mediante o emprego
  do Head Up Guidance System (HGS) consta na IS nº 91-003.

  5.9 Segmento de currículo de diferenças'
