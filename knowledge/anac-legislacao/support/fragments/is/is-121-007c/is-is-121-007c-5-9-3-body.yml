title: Relatórios de avaliação operacional
text: '5.9.3 Relatórios de avaliação operacional

  5.9.3.1 O treinamento de diferenças deve se basear em uma análise precisa das diferenças
  de projeto e manobras das aeronaves envolvidas. Para isso, a ANAC e outras autoridades de
  aviação civil publicam relatórios de avaliação operacional com tais análises. As autoridades
  formulam Requisitos de Diferenças Master (MDR) para abordar as diferenças entre as aeronaves
  relacionadas e os apresenta em formato tabular no relatório apropriado.

  Nota 1: os relatórios de avaliação operacional publicados pela ANAC encontram-se disponíveis
  em https://www.gov.br/anac/pt-br/assuntos/regulados/aeronaves/avaliacao-operacional.

  Nota 2: informações adicionais podem ser encontradas na IS nº 00-007.'
