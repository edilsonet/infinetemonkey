title: Grau de diferenças
text: '5.9.4 Grau de diferenças

  5.9.4.1 Os operadores devem garantir que os métodos utilizados para conduzir o treinamento
  de diferenças sejam apropriados ao grau de diferença entre a aeronave base e suas variantes.
  Para descrever os graus de diferença e definir métodos aceitáveis de treinamento e exames,
  foram definidos cinco níveis de diferenças (níveis A-E), conforme descritos na IS nº 00-007.'
