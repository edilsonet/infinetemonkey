title: Avaliação das diferenças
text: '5.9.6 Avaliação das diferenças

  5.9.6.1 O relatório de avaliação operacional da ANAC contém MDR para as variantes envolvidas.
  Quando um relatório de avaliação operacional foi publicado pela ANAC e contém MDR para as
  variantes envolvidas, o treinamento de diferenças proposto pelo operador deve cumprir os
  requisitos do relatório de avaliação operacional. Os operadores devem usar tabelas de Requisitos
  de Diferença do Operador (ODR) para mostrar como o programa aborda diferenças através de
  descrições dos métodos de treinamento e exames para cada variante. As tabelas ODR fornecem
  um meio uniforme para os operadores gerenciarem de forma abrangente o treinamento de diferenças
  e fornecem uma base para a aprovação da ANAC. Os ODR devem cumprir e ser tão ou mais restritivos
  do que os MDR e outras recomendações do relatório de avaliação operacional.

  5.9.6.2 O relatório de avaliação operacional da ANAC não existe ou não contém MDR para as
  variantes envolvidas. O operador que pretende propor treinamento de diferenças para o qual
  um relatório de avaliação operacional não foi publicado pela ANAC ou não contém MDR para
  as variantes envolvidas deve enviar uma análise de diferenças realizada pelo próprio ou
  por outra parte qualificada (como o fabricante ou outro operador). Relatórios de avaliação
  operacional publicados por outras autoridades de aviação civil devem ser usados como referência,
  com prioridade para o relatório publicado pela autoridade de aviação civil de certificação
  primária do modelo da aeronave. A análise pode assumir qualquer forma, desde que identifique
  com precisão todas as diferenças de projeto e manobras que afetem as características do
  voo, as habilidades e/ou procedimentos dos tripulantes de voo. Um meio aceitável de elaborar
  uma análise de diferenças é construir um currículo para a aeronave base e identificar cada
  item do currículo em que há uma diferença (veja exemplo da Figura 16).


