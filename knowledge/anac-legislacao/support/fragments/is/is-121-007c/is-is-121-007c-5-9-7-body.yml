title: Exames e treinamento de diferenças periódicos
text: '5.9.7 Exames e treinamento de diferenças periódicos

  5.9.7.1 Quando os operadores designam os tripulantes de voo em múltiplas variantes de uma
  aeronave, algumas formas de treinamento de diferenças devem ser incluídas no currículo de
  treinamento periódico. A quantidade e tipo necessário de treinamento e exame dependem do
  grau de diferenças envolvidas e das circunstâncias do operador. As diferenças de nível A
  devem ser revisadas nos segmentos de currículo de solo periódicos. As diferenças de nível
  B requerem um exame de tarefas ou sistemas. As diferenças de níveis C, D e E requerem algum
  grau de exame de proficiência em FSTD ou aeronave.'
