text: '5.9.8 Treinamento dependente de assento.

  5.9.8.1 A seção 121.430 do RBAC nº 121 requer que os pilotos que sejam designados para operar
  nos assentos direito e esquerdo (incluindo pilotos qualificados como piloto em comando que
  eventualmente são designados para operar no assento esquerdo, ao compor tripulação com outro
  piloto em comando) sejam aprovados em um treinamento adequado. Tais pilotos são frequentemente
  confrontados com requisitos especiais de treinamento e habilidades. As diferenças nos requisitos
  de tarefas e habilidades dos tripulantes de voo variam de insignificante a altamente significativas
  para diferentes fabricantes e modelos de aeronaves. Por esse motivo, os operadores devem
  avaliar os requisitos de treinamento dependentes do assento caso a caso, para determinar
  o treinamento adequado. A ANAC pode exigir que os operadores usem uma avaliação de diferenças
  (conforme descrito nesta seção) para fazer essa determinação. Os operadores devem usar como
  referência os relatórios de avaliação operacional para a aeronave específica para identificação
  das tarefas dependentes do assento.

  5.10 Currículo de treinamento periódico para tripulantes de voo'
