  Notas:

  “Ambos”: O termo “ambos” significa que o elemento ou evento se aplica tanto para PIC quanto
  para SIC.

  *: O elemento ou evento pode ser dispensado desde que observadas as restrições estabelecidas
  no RBAC 121.441(d).

  1: Tanto o PIC quanto o SIC podem tomar crédito pelo evento

  2: Consulte orientações na IS nº 00-002.

  3: O examinador está autorizado a avaliar qualquer evento requerido para emissão de licença
  de PLA.'
