title: 'Programa de treinamento: um sistema de instrução que inclui currículos de'
text: '4.1.1 Programa de treinamento: um sistema de instrução que inclui currículos de

  treinamento, instalações, instrutores, examinadores credenciados, material didático,

  métodos de instrução e procedimentos de aplicação de testes e de exames práticos para

  verificação de proficiência. Um programa de treinamento deve satisfazer os requisitos do

  adequadamente treinado e atualizado para cada aeronave e tipo de operação que o

  operador conduz.'
