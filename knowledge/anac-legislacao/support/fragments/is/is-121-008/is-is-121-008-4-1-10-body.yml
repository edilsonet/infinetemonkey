text: '4.1.10 Métodos de instrução: metodologia para transmitir informações a um aluno. Isso
  pode

  incluir palestras, demonstrações, apresentações audiovisuais, workshops de estudo

  dirigidos e exercícios. Os dispositivos de treinamento, aeronaves e estações de

  computador também são considerados métodos de instrução.'
