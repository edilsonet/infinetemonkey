text: '4.1.11 Testes e exames práticos: métodos para avaliar se candidatos demonstram o nível
  de

  conhecimento exigido em um assunto e se eles aplicam em situações práticas (se

  apropriado) o conhecimento e as habilidades aprendidos em situações de instrução. Os

  testes devem ser aplicados pelo instrutor do treinamento para avaliar o aproveitamento

  do treinamento pelo aluno, enquanto os exames práticos, aplicados pela ANAC ou

  examinadores credenciados, avaliam a proficiência, a tomada de decisão e a aplicação das

  habilidades adquiridas durante a operação.'
