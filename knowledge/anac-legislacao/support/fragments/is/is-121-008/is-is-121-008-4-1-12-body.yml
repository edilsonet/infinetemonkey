text: '4.1.12 Mês de treinamento / verificação: o mês calendário de referência durante o qual
  um

  despachante operacional de voo deve receber o treinamento periódico requerido e um

  exame prático de competência. O mês “calendário” significa o primeiro dia até o último

  dia de um mês civil em particular.'
