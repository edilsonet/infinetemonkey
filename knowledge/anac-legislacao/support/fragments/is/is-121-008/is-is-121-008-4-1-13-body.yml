title: 'Período de elegibilidade: três meses do calendário: o mês antes do “mês de treinamento'
text: '4.1.13 Período de elegibilidade: três meses do calendário: o mês antes do “mês de treinamento

  / verificação”, o “mês de treinamento / verificação” e o mês após o “mês de treinamento

  / verificação”. O treinamento ou exame prático concluído durante o período de

  elegibilidade é considerado como completado durante o “mês de treinamento /

  verificação”. Este período de elegibilidade não é aplicado à validade das habilitações

  averbadas nas licenças de Despachante Operacional de Voo.'
