title: 'Examinador Credenciado DOV: é um indivíduo, despachante operacional de voo,'
text: '4.1.15 Examinador Credenciado DOV: é um indivíduo, despachante operacional de voo,

  empregado por um operador detentor de certificado do RBAC nº 121, que é autorizado

  pela ANAC a realizar exames práticos para verificações de proficiência e competência

  dos demais despachantes operacionais de voo do detentor de certificado.

  4.2 Ainda para os efeitos desta IS, são válidas as seguintes siglas:

  ATC Controle de Tráfego Aéreo

  AFM Manual da Aeronave

  AVSEC Aviation Security

  CAS Capacitação em Serviço (mesmo que OJT - On Job Training)

  CDL Lista de Desvios de Configuração

  COA Certificado de Operador Aéreo

  CSD Constant Speed Drive

  DGR Treinamento de Artigos Perigosos

  DOV Despachante Operacional de Voo

  EDG Engine-driven Generator

  EO Especificações Operativas

  MDOV Manual do Despacho Operacional de Voo

  MEL Lista de Equipamentos Mínimos

  PIC Piloto em Comando

  RBAC Regulamento Brasileiro de Aviação Civil

  RBHA Regulamento Brasileiro de Homologação Aeronáutica

  TFAC Taxa de Fiscalização de Aviação Civil

  W&B Peso e Balanceamento

  5 CURRÍCULOS DO PROGRAMA DE TREINAMENTO OPERACIONAL PARA

  DESPACHANTES OPERACIONAIS DE VOO (PTO-DOV)

  5.1 Procedimentos Gerais.'
