title: 'Categorias de treinamento: uma classificação de treinamento com base em quem'
text: '4.1.2 Categorias de treinamento: uma classificação de treinamento com base em quem

  receberá o treinamento e no propósito do treinamento. Existem cinco categorias de

  treinamento que se aplicam aos despachantes operacionais de voo: Inicial de nova

  contratação (§ 121.422), Inicial de equipamento (§ 121.422), Transição (§ 121.422),

  Periódico (§ 121.427), e Requalificação (§§ 121.422 e 121.427). Cada categoria de

  treinamento consiste em um ou mais currículos.'
