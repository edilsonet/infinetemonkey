text: '4.1.3 Currículo: uma programação de treinamento completa específica para um ou vários
  tipos

  de aeronave e uma categoria de treinamento. Um exemplo é um “Currículo Inicial de

  Contratação DOV B-727” (Categoria + Função + Equipamento). Cada currículo é

  composto por vários segmentos de currículos.'
