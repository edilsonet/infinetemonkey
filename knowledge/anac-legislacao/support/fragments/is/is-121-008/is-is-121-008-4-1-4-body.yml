title: 'Segmento de currículo: uma fase integral de treinamento que pode ser avaliada'
text: '4.1.4 Segmento de currículo: uma fase integral de treinamento que pode ser avaliada

  separadamente e aprovada individualmente, mas não qualifica por si só uma pessoa como

  despachante operacional de voo. Os três principais segmentos de currículo relevantes ao

  treinamento de despachantes operacionais de voo são: Doutrinamento Básico, Solo e

  Qualificação. Cada segmento de currículo consiste em um ou mais módulos de

  treinamento.'
