title: 'Módulo de treinamento: uma subparte de um segmento de currículo que constitui uma'
text: '4.1.5 Módulo de treinamento: uma subparte de um segmento de currículo que constitui
  uma

  unidade lógica e autônoma. Um módulo contém elementos ou eventos relacionados a um

  assunto específico. Por exemplo, o segmento de currículo “DOV Inicial de Contratação

  - Solo” deve conter um módulo de treinamento referente à meteorologia. Como outro

  exemplo, um segmento de currículo “DOV Inicial de Contratação - Doutrinamento

  Básico” deve incluir um módulo referente às explicações adequadas dos regulamentos.

  Um módulo de treinamento inclui uma descrição detalhada, material didático apropriado

  e métodos de ensino.'
