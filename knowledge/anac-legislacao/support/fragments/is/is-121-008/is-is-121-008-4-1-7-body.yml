text: '4.1.7 Elemento: uma parte integral, relacionada a assuntos (não relacionada a tarefas)
  de um

  módulo de treinamento, verificação ou qualificação. Por exemplo, um módulo de um

  segmento de currículo de Doutrinamento Básico pode incluir elementos como a

  nomenclatura de aeronaves e organização do manual geral de operações do operador

  (MGO).'
