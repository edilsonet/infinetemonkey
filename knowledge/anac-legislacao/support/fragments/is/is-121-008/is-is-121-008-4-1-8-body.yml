text: '4.1.8 Evento: uma parte integral, relacionada a tarefas, de um módulo de treinamento,

  verificação ou qualificação que requer o uso de um procedimento ou procedimentos

  específicos. Um evento de treinamento oferece ao aluno uma oportunidade de instrução,

  demonstração e / ou prática usando procedimentos específicos. Um evento de verificação

  ou qualificação fornece à ANAC, ao examinador credenciado ou ao instrutor, a

  oportunidade de avaliar a capacidade de um aluno realizar corretamente uma tarefa

  específica sem instrução ou supervisão.'
