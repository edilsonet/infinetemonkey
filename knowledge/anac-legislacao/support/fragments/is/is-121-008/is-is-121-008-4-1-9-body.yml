text: '4.1.9 Material didático: material de instrução desenvolvido para cada currículo. Esta
  é a

  informação em planos de aula, guias de instrutores, programas de software de

  computador, programas audiovisuais, apostilas e cadernos de exercícios, manuais de

  despacho operacional de voo (MDOV) e folhetos. Os cursos devem refletir com precisão

  os requisitos do currículo, ser efetivamente organizados e integrar-se adequadamente com

  os métodos de instrução.'
