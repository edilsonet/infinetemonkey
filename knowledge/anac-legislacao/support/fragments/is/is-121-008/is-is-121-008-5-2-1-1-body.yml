title: Existem seis categorias básicas de treinamento, das quais cinco são aplicáveis aos
text: '5.2.1.1 Existem seis categorias básicas de treinamento, das quais cinco são aplicáveis
  aos

  despachantes operacionais de voo: Inicial de Nova Contratação, Inicial de Equipamento,

  Transição, Periódico e Requalificação. Os fatores que determinam a categoria adequada

  de treinamento são a experiência anterior do aluno com o operador e o status de

  qualificação atual do aluno em relação à aeronave específica. Os operadores podem

  desenvolver e receber aprovação em vários currículos diferentes para uma mesmaData de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  aeronave específica em cada categoria de treinamento. Embora os requisitos

  regulamentares para o conteúdo do curso possam ser idênticos para duas categorias

  diferentes de treinamento, a ênfase e a profundidade do treinamento exigido em cada

  currículo variam. As cinco categorias de treinamento aplicáveis aos despachantes

  operacionais de voo são brevemente discutidas nos parágrafos seguintes.'
