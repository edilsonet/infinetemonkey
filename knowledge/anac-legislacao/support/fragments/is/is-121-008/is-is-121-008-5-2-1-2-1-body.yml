text: '5.2.1.2.1 Os operadores podem limitar o treinamento a um tipo específico de aeronave.
  Depois que

  o novo despachante operacional de voo for qualificado, o operador pode então realizar

  treinamento de transição ou inicial de equipamento para qualificar o despachante em outra

  aeronave.'
