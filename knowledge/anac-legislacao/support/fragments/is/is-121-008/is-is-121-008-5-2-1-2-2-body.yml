title: Os operadores podem desenvolver os currículos de treinamento para qualificar o novo
text: '5.2.1.2.2 Os operadores podem desenvolver os currículos de treinamento para qualificar
  o novo

  despachante operacional de voo para despachar todas as aeronaves na frota do operador.

  O currículo inicial elaborado dessa forma, deve conter, além do treinamento geral,

  treinamento específico para cada uma das aeronaves. Por exemplo, um currículo Inicial

  de Nova Contratação para aviões B-727 e DC-9 pode conter um módulo geral sobre

  sistemas hidráulicos, um outro módulo sobre as especificidades dos sistemas hidráulicos

  do B-727 e ainda outro módulo sobre os detalhes dos sistemas hidráulicos do DC-9.'
