title: Categoria Inicial de Nova Contratação. Os operadores devem utilizar essa categoria
text: '5.2.1.2 Categoria Inicial de Nova Contratação. Os operadores devem utilizar essa categoria

  para qualificar pessoal que não teve experiência anterior como despachante operacional

  de voo com o operador. O treinamento inicial de nova contratação aplica-se também aos

  despachantes já licenciados que nunca trabalharam para o operador, e adicionalmente

  aplica-se ao pessoal já empregado pelo operador em uma função diferente (por exemplo,

  despachantes técnicos, auxiliares de DOV ou agentes de aeroporto). Esta categoria inclui

  treinamento inicial de doutrinamento básico, treinamento em tarefas básicas,

  responsabilidades e obrigações como despachante operacional de voo e treinamento

  específico para um ou mais tipos de aeronave. Uma vez que a formação inicial de nova

  contratação geralmente é a primeira exposição do novo despachante a métodos, políticas

  e procedimentos específicos da empresa, ela deve ser a mais abrangente das cinco

  categorias de treinamento. Os operadores podem organizar o treinamento inicial de nova

  contratação em dois métodos comuns e aceitos:'
