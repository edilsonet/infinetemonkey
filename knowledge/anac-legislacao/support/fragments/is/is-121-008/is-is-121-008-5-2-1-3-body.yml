title: Categoria Inicial de Equipamento. Os operadores devem utilizar essa categoria para
text: '5.2.1.3 Categoria Inicial de Equipamento. Os operadores devem utilizar essa categoria
  para

  qualificar um despachante operacional de voo do operador que já treinou e se qualificou

  em uma aeronave de um grupo de aeronaves (I ou II, conforme definido na seção 121.400

  do RBAC nº 121) e agora está se qualificando em uma aeronave do outro grupo. As áreas

  de ênfase no treinamento inicial de equipamentos são as características gerais do grupo

  de aeronaves, as características únicas da aeronave específica e os deveres do despachante

  exclusivos relacionados ao grupo de aeronaves e ao tipo específico de aeronave.'
