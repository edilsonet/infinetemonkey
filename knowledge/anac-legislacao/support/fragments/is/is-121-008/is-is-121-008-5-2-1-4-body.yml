title: Categoria Transição. Os operadores devem utilizar esta categoria para um despachante
text: '5.2.1.4 Categoria Transição. Os operadores devem utilizar esta categoria para um despachante

  operacional de voo que já treinou e se qualificou em um tipo de aeronave e agora está se

  qualificando em outro tipo de aeronave do mesmo grupo. As duas áreas de ênfase no

  treinamento de transição são as características únicas da aeronave específica e os deveres

  de despachante específicos para essa aeronave.'
