title: Categoria Requalificação. Os operadores devem utilizar esta categoria para requalificar
text: '5.2.1.6 Categoria Requalificação. Os operadores devem utilizar esta categoria para
  requalificar

  um despachante operacional de voo que tenha sido treinado e qualificado pelo operador,

  mas que se tornou desqualificado por não ter realizado satisfatoriamente treinamento

  periódico completo, exame prático de competência ou voo de familiarização operacional

  dentro do período de elegibilidade apropriado.

  Nota: embora o RBAC nº 121 não aborde especificamente o treinamento de requalificação para

  despachantes, tal treinamento é a forma mais simples de um despachante recuperar sua

  qualificação. Caso o operador não desenvolva tal categoria, deverá utilizar treinamento

  inicial de nova contratação quando precisar requalificar um despachante.'
