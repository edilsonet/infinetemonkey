text: '5.2.2.1 O operador deve desenvolver e manter apenas os currículos que serão utilizados.
  Por

  exemplo, os operadores que operam apenas um grupo de aviões não necessitam

  desenvolver currículos iniciais de equipamento. Não é necessário que os operadores

  tenham um currículo de treinamento de Transição, se seus novos despachantes são

  treinados em todas as aeronaves que operam, durante o treinamento inicial de nova

  contratação. Esse operador só precisaria de um currículo de transição se um novo tipo de

  aeronave fosse adicionado à frota.'
