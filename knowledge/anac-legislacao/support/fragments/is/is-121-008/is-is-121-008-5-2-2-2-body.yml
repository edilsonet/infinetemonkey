title: Qualificação do Despachante Operacional de Voo. Cada pessoa obrigada a treinar de
text: '5.2.2.2 Qualificação do Despachante Operacional de Voo. Cada pessoa obrigada a treinar
  de

  acordo com um currículo deve completar esse currículo na sua totalidade. Quando uma

  pessoa completa o treinamento e o(s) exame(s) prático(s) para verificação de competência

  ou proficiência especificados por um currículo, essa pessoa está qualificada para

  despachar os tipos específicos de aeronaves especificados no currículo nas operações

  comerciais regidas pelo RBAC nº 121, de acordo com as habilitações recebidas.Data de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
