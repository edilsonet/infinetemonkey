title: Múltiplos currículos em uma única categoria. Os operadores podem desenvolver mais de
text: '5.2.2.3 Múltiplos currículos em uma única categoria. Os operadores podem desenvolver
  mais de

  um currículo para cada categoria de treinamento aplicável. Cada currículo pode ser

  adaptado a um grupo específico de estudantes. Um currículo Inicial de Nova Contratação

  desenvolvido para estudantes com pouca ou nenhuma experiência anterior em

  companhias aéreas deve ser mais extenso do que um currículo para estudantes que tenham

  essa experiência anterior. Por exemplo, um currículo abreviado para o treinamento Inicial

  de Nova Contratação pode ser usado em situações de fusão ou aquisição de empresas

  aéreas. Nesses casos, o RBAC nº 121, § 121.405 permite uma redução nas horas do

  programa.'
