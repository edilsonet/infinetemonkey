title: A Parte A representa componentes que, quando combinados, constituem o programa geral
text: '5.2.3.2 A Parte A representa componentes que, quando combinados, constituem o programa
  geral

  de treinamento de um operador. Esses componentes diferem em que alguns devem ser

  especificamente aprovados pela ANAC (por exemplo, currículos), enquanto outros são

  aceitos como elementos de suporte (por exemplo, instalações e equipamentos de suporte).'
