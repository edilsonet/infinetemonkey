title: Objetivo do treinamento de doutrinamento básico. O segmento de currículo de
text: '5.3.1.1 Objetivo do treinamento de doutrinamento básico. O segmento de currículo de

  doutrinamento básico é exclusivo da categoria Inicial de Nova Contratação. Esse

  segmento de currículo aplicado aos despachantes operacionais de voo tem os seguintes

  propósitos: como uma introdução para o novo empregado ao operador, como forma de

  esclarecer como o operador atende aos requisitos do RBAC nº 121 e como base para os

  treinamentos posteriores. Consiste na informação requerida como base fundamental, para

  aplicar o subsequente segmento de currículo de solo para os novos despachantes.'
