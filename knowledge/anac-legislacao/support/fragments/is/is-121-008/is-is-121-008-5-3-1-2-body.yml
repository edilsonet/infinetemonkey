title: Assuntos de treinamento requeridos. O parágrafo 121.415(a)(1) do RBAC nº 121 exige
text: '5.3.1.2 Assuntos de treinamento requeridos. O parágrafo 121.415(a)(1) do RBAC nº 121
  exige

  que todos os despachantes operacionais de voo recém-contratados completem um mínimo

  de 40 horas de treinamento de doutrinamento básico. Nenhuma redução de horas nesseData de
  emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  treinamento será permitida, a menos que seja coordenada com a ANAC e expressamente

  aprovada pela ANAC. O parágrafo 121.415(a)(1) exige que o treinamento nos seguintes

  assuntos seja incluído no segmento de currículo de doutrinamento básico para

  despachantes operacionais de voo:'
