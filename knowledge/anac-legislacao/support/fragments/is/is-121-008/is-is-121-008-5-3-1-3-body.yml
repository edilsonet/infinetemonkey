text: '5.3.1.3 Assuntos de treinamento opcionais. Os operadores podem incluir outros assuntos
  no

  segmento de currículo de doutrinamento básico para despachantes operacionais de voo.

  Esses assuntos podem ser complementos das áreas requeridas pelo RBAC e devem ser

  além das 40 horas mínimas exigidas pelo § 121.415(a)(1). Este treinamento consiste na

  informação que os novos despachantes precisam como base para a formação específica e

  detalhada a ser conduzida no segmento de currículo de solo. Entre os assuntos apropriados

  para esse tipo de treinamento estão os seguintes:'
