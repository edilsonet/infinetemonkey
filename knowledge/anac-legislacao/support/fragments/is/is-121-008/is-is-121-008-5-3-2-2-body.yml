title: Deveres e responsabilidades. Esse módulo contém os deveres que serão atribuídos ao
text: '5.3.2.2 Deveres e responsabilidades. Esse módulo contém os deveres que serão atribuídos
  ao

  despachante operacional de voo recém-contratado depois de se tornar habilitado. Por

  exemplo, um operador de pequeno porte pode atribuir aos despachantes a confecção de

  planos de voo, o planejamento de carga e realização de cálculos de peso e balanceamento

  (W & B). A tendência da indústria, no entanto, é atribuir essas funções a grupos

  especializados de funcionários. A seção 121.533 exige que o despachante da aeronave se

  assegure que essas funções tenham sido adequadamente realizadas antes de liberar um

  voo, independentemente de as funções terem sido realizadas pelo despachante da

  aeronave ou por outro funcionário. O novo despachante deve ser treinado especificamente

  sobre como e por quem essas tarefas devem ser realizadas durante as operações

  comerciais. Uma vez que será necessário o despachante qualificado avaliar a adequação

  do planejamento de voo e carga, o operador deve garantir que os novos despachantes

  tenham um conhecimento profundo dos princípios básicos desses assuntos. Outro assuntoData
  de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  que deve fazer parte deste módulo é o compartilhamento de responsabilidades entre DOV

  e PIC.'
