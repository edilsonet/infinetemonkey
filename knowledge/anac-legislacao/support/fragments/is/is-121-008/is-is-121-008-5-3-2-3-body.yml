  despachante operacional de voo como o operador estejam em conformidade com a

  legislação aplicável durante as operações de voo. Os operadores devem citar

  regulamentos e normativos específicos durante este módulo e mostrar como os

  procedimentos do operador foram elaborados para cumprir os seguintes regulamentos:'
