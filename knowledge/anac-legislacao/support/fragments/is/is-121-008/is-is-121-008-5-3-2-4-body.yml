title: Conteúdo do COA e das EO. Esse módulo contém treinamento nas operações
text: '5.3.2.4 Conteúdo do COA e das EO. Esse módulo contém treinamento nas operações

  específicas que o operador pode realizar, nas operações que são proibidas, nas que

  requerem mínimos meteorológicos específicos e nas limitações das autorizações

  concedidas ao operador. O novo despachante operacional de voo deve estar

  completamente familiarizado com essa informação antes de assumir os seus deveres

  como despachante.'
