title: Um segmento de currículo de doutrinamento básico para despachante operacional de voo
text: '5.3.3.1 Um segmento de currículo de doutrinamento básico para despachante operacional
  de voo

  deve incluir tantos módulos de treinamento quanto necessário para garantir o treinamento

  adequado. Cada módulo de treinamento deve conter, pelo menos, um título descritivo do

  módulo de treinamento e uma lista dos elementos ou eventos relacionados a serem

  apresentados durante a instrução no módulo.'
