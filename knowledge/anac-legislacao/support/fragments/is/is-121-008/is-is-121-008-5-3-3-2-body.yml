title: Ementa do módulo de treinamento. A ementa do módulo de treinamento deve conter
text: '5.3.3.2 Ementa do módulo de treinamento. A ementa do módulo de treinamento deve conter

  apenas os elementos e eventos necessários para assegurar que os alunos despachantes

  recebam o treinamento adequado. Os operadores não são obrigados a incluir descrições

  detalhadas de cada elemento ou evento para aprovação inicial, uma vez que tais

  descrições detalhadas pormenorizadas são mais apropriadamente incluídas no material

  didático. Durante o processo de aprovação final, durante a fase 4, a ANAC irá revisar os

  cursos e materiais didáticos para garantir que o alcance e a profundidade dos módulos de

  treinamento sejam adequados.'
