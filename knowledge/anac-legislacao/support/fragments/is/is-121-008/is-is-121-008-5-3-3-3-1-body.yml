text: '5.3.3.3.1 Um módulo de treinamento para alunos com larga experiência nas operações
  do RBAC

  nº 121 pode ser menos abrangente do que um módulo de treinamento para estudantes sem

  essa experiência. Este é geralmente o caso com operadores que contratam apenas pessoal

  altamente qualificado com ampla experiência nas operações sob o RBAC nº 121.'
