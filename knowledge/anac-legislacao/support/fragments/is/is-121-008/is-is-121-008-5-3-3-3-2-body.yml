text: '5.3.3.3.2 Os módulos de treinamento exigidos pelo § 121.415(a) devem ser incluídos
  na ementa do

  segmento de currículo de doutrinamento básico e contados para o requisito de horas para

  este segmento. A sequência real do treinamento pode ser determinada pelo operador. Por

  exemplo, apesar de o módulo de treinamento que contém os requisitos do briefing

  meteorológico ao piloto em comando (PIC) ser incluído na descrição detalhada do

  segmento de currículo de “Inicial - Doutrinamento Básico DOV”, o operador pode

  realmente realizar o treinamento deste módulo depois de ter completado o módulo de

  treinamento de meteorologia do segmento de currículo “Inicial - Solo DOV”.Data de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
