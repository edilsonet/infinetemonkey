title: Um operador pode optar por colocar um módulo de treinamento em mais de um segmento
text: '5.3.3.3.3 Um operador pode optar por colocar um módulo de treinamento em mais de um
  segmento

  de currículo. Para fins de aprovação, no entanto, o módulo de treinamento deve ser listado

  na ementa do segmento de currículo designado pelo regulamento. Por exemplo, para

  cumprir a seção 121.415 do RBAC nº 121, o conteúdo das EO deve ser abordado no

  segmento de currículo de doutrinamento básico. Isso, no entanto, não proíbe o operador

  de cobrir partes aplicáveis da EO em outros segmentos de currículo, como o Inicial - Solo.'
