title: Um instrutor qualificado deve certificar que um aluno despachante operacional de voo
text: '5.3.5.1 Um instrutor qualificado deve certificar que um aluno despachante operacional
  de voo

  completou esse segmento de currículo. O operador deve manter esse certificado nos

  registros de treinamento. Esse certificado é geralmente baseado nos resultados

  satisfatórios de um exame escrito ou oral (que não deve ser confundido com o exame

  prático realizado pela ANAC ou examinador, para concessão da habilitação). O exame

  específico para esse segmento de currículo pode ser administrado no final de cada

  segmento ou no final do curso.'
