title: A seção 121.415 do RBAC nº 121 especifica um mínimo de 40 horas de instrução
text: '5.3.6.1 A seção 121.415 do RBAC nº 121 especifica um mínimo de 40 horas de instrução

  programadas para o treinamento de doutrinamento básico de despachante operacional de

  voo. Os operadores que empregam pessoal com pouca ou nenhuma experiência em

  operações sob o RBAC nº 121 devem programar pelo menos 40 horas de treinamento

  para o doutrinamento básico, mas poderão programar horas adicionais de treinamento em

  função da complexidade da operação ou da própria aeronave.'
