title: Treinamento de artigos perigosos (DGR). O treinamento de DGR não pode ser incluído
text: '5.3.6.2 Treinamento de artigos perigosos (DGR). O treinamento de DGR não pode ser incluído

  nas 40 horas requeridas no currículo de doutrinamento básico. O programa de treinamento

  de DGR é regulado pela subparte Z e pelo apêndice O do RBAC nº121 e pelo RBAC nº

  175, e o programa deve ser elaborado pelo operador conforme a IS nº 175-007.

  Normalmente, a extensão do treinamento de DGR para despachantes depende da

  categoria e de se o treinamento é inicial ou periódico. Um despachante que é responsável

  por aceitar e/ou manipular o DGR deve receber um treinamento mais intensivo do que o

  necessário para apenas estar familiarizado com o DGR. Se um operador optar por incluir

  o treinamento de DGR em seu segmento de currículo de doutrinamento básico para DOV,

  as horas programadas para esse treinamento devem ser em adição ao mínimo exigido de

  40 horas. As 40 horas requeridas para o segmento de currículo inicial de solo para DOV

  (Nova Contratação ou Novo Equipamento), conforme a seção 121.422 do RBAC nº 121,

  também não podem incluir treinamento de DGR.'
