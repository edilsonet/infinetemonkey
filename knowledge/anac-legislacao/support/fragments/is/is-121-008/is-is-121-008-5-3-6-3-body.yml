title: Treinamento de segurança da aviação contra atos de interferência ilícita (AVSEC).
text: '5.3.6.3 Treinamento de segurança da aviação contra atos de interferência ilícita (AVSEC).

  O treinamento de AVSEC não pode ser incluído nas 40 horas requeridas do currículo de

  doutrinamento básico. O treinamento de AVSEC é regulamentado pelo RBAC nº 111. Se

  um operador optar por incluir treinamento de AVSEC em seu segmento de currículo de

  doutrinamento básico para DOV, as horas programadas para esse treinamento deve ser

  em adição ao mínimo exigido de 40 horas. As 40 horas requeridas para o segmento de

  currículo inicial de solo para DOV (Nova Contratação ou Novo Equipamento), conforme

  a seção 121.422 do RBAC nº 121, também não podem incluir treinamento de AVSEC.

  5.4 Segmento de currículo: Solo (Categorias Inicial de Nova Contratação, Inicial de

  Equipamento e Transição)'
