title: 5.4.2.1(a)
text: 'a) comunicações: deve abranger as características dos sistemas a serem utilizados e
  os

  apropriados procedimentos normais e de emergência a serem tomados. De acordo com os

  procedimentos adotados pelo operador, inclui a comunicação com a tripulação no pré-

  voo para briefing, com a tripulação em aeronave no solo, com a tripulação em aeronave

  em voo, com o setor de manutenção responsável por informar a condição de

  aeronavegabilidade da aeronave (inclusive informações sobre itens ACR e CDL), com o

  pessoal responsável pelo controle operacional (por exemplo, diretor de operações), com

  controle de tráfego aéreo e o fluxo de comunicação para acionamentos em caso de

  emergência (incluindo Salvaero), sendo que esses procedimentos podem estar em

  procedimentos de emergência;'
