title: 5.4.2.1(b)
text: 'b) meteorologia: deve abranger os vários tipos de informação meteorológica, as formas

  de previsão e interpretação do tempo, incluindo as previsões da temperatura e de outras

  condições do tempo da rota e da área terminal a serem utilizadas; sistemas frontais;

  condições e comportamento dos ventos; o uso de cartas meteorológicas de tempo presente

  e de previsão; e, quando uma aeronave a reação (grupo II) está envolvida, a utilização de

  reportes e previsões do espaço aéreo superior, e previsões de turbulência e sua prevenção;'
