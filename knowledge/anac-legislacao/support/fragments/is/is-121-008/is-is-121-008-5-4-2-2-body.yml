title: Interpretação de condições adversas. A interpretação de meteorologia e de outras
text: '5.4.2.2 Interpretação de condições adversas. A interpretação de meteorologia e de outras

  condições adversas deve ser fortemente enfatizada no treinamento inicial e deve incluir

  treinamento em pelo menos turbulência de céu claro (CAT - clear air turbulence), wind

  shear, tempestades, formação de gelo e cinzas vulcânicas.'
