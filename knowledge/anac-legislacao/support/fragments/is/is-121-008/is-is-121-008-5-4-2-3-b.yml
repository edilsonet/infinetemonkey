title: 5.4.2.3(b)
text: 'b) publicações e cartas para navegação aérea;

  Nota: os aeroportos abrangidos no treinamento devem ser os que especificamente ficarão na

  área sob a responsabilidade dos despachantes durante a operação. A ênfase do operador

  deve ser nos aeroportos que trazem problemas especiais para os despachantes

  operacionais de voo que já estão na operação nesta aérea.'
