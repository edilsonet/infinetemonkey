section_title: Características específicas da aeronave. O operador deve prover tanto treinamento
subsection_id: a
cite: 5.4.2.4(a)
title: 5.4.2.4(a)
text: 'a) O treinamento de aeronaves para os despachantes operacionais deve ser apropriado
  a

  suas funções. Não é necessário haver o mesmo grau de detalhes existente no treinamento

  dados aos pilotos. Por exemplo, os despachantes devem ser ensinados que as aeronaves

  turbo-jato possuem unidades conversoras CSD (Constant Speed Drive), e que tais

  unidades CSD são necessárias para o funcionamento apropriado do gerador EDG (engine-

  driven generator), e que quando a unidade CSD está inoperante o gerador associado

  também está inoperante. De posse deste conhecimento o novo despachante deve poder

  determinar a ação correta a ser tomada consultando a MEL. Os despachantes não são

  obrigados a ter conhecimentos detalhados de sistemas para compreender essa informação.'
