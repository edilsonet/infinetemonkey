section_title: Características específicas da aeronave. O operador deve prover tanto treinamento
subsection_id: b
cite: 5.4.2.4(b)
title: 5.4.2.4(b)
text: 'b) Os operadores podem optar por conduzir treinamento inicial (de nova contratação
  ou

  de equipamento) em um tipo de aeronave ou incluir todos os tipos de aeronaves operadas

  no currículo inicial de nova contratação. Quando o operador opta por limitar o

  treinamento inicial de nova contratação a apenas um tipo específico de aeronave, os

  despachantes devem ser habilitados nos tipos adicionais de aeronaves por meio do

  currículo de transição ou inicial de equipamento.'
