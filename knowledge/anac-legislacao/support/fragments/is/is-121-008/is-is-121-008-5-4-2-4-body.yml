title: Características específicas da aeronave. O operador deve prover tanto treinamento
text: '5.4.2.4 Características específicas da aeronave. O operador deve prover tanto treinamento

  geral quanto específico quando os novos despachantes estão sendo habilitados em maisData
  de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  de um tipo de aeronave. O treinamento deve ser conduzido nas características gerais de

  operação nos grupos de aeronaves, como turbo hélice ou turbo jato. Adicionalmente, é

  requerida a descrição de cada aeronave em que o novo despachante será habilitado, e esse

  treinamento deve estar diretamente interligado com as funções que o despachante

  desempenhará. O programa de treinamento do operador deverá enfatizar o seguinte:

  características de operação da aeronave, características de desempenho da aeronave,

  equipamentos de navegação, aproximação por instrumentos, equipamentos de

  comunicação e equipamentos de emergência. O operador deve também prover

  treinamento nas partes apropriadas do manual da aeronave (AFM ou AOM) que são

  aplicáveis as funções dos despachantes, incluindo descrição dos procedimentos anormais

  e de emergência, na Lista de Equipamentos Mínimos (MEL) e na Lista de Desvios de

  Configuração (CDL).'
