section_title: Características específicas da aeronave. O operador deve prover tanto treinamento
subsection_id: c
cite: 5.4.2.4(c)
title: 5.4.2.4(c)
text: 'c) A seção 121.418 do RBAC nº 121 requer que os operadores conduzam treinamento de

  diferenças quando a empresa aérea possuir variações do mesmo tipo de aeronave. Tal

  treinamento deve focar nas diferenças que afetam os deveres dos despachantes

  operacionais de voo, como as características operacionais, limitações e MEL.'
