title: Procedimentos de emergência. Os operadores devem fornecer treinamento para os
text: '5.4.2.6 Procedimentos de emergência. Os operadores devem fornecer treinamento para
  os

  despachantes operacionais de voo nos procedimentos que deverão seguir em um caso de

  emergência. O treinamento deve abranger as ações tomadas para auxiliar a tripulação e

  para notificar a companhia e as autoridades e agências necessárias.'
