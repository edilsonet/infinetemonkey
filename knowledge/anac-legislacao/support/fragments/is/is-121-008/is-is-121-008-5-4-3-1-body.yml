title: Inicial de Nova Contratação. Esse treinamento é necessário para habilitar todos os
text: '5.4.3.1 Inicial de Nova Contratação. Esse treinamento é necessário para habilitar todos
  os

  despachantes operacionais de voo recém contratados com ou sem experiência prévia em

  operações 121. O operador deve prover um treinamento completo e abrangente dos

  assuntos e garantir que cada novo despachante operacional de voo recém-contratado

  tenha dominado as habilidades necessárias para realizar adequadamente o trabalho. Além

  do treinamento acadêmico na sua formação como despachante e o treinamento em sala

  de aula na empresa aérea, os novos contratados são requeridos a completar Capacitação

  em Serviço (CAS, ou OJT em inglês On Job Training), para se tornarem competentes nas

  habilidades necessárias como despachantes operacionais de voo, e para desenvolverem

  proficiência nas habilidades mais específicas de sua função. No caso dos contratados

  recém-formados no curso de Despachante Operacional de Voo, para obtenção de sua

  licença e habilitações nas aeronaves do operador, essa Capacitação em Serviço deverá ser

  usada para atender os requisitos do RBHA 65 § 65.57, referentes ao estágio operacional

  de 90 dias com 40 despachos reais sob supervisão de um instrutor DOV (ou disposições

  equivalentes do RBAC que vier a substituí-lo). Já no caso de despachantes recém

  contratados, mas que já possuem experiência anterior em operadores sob o RBAC nº 121,

  uma quantidade de 10 despachos sob supervisão de um instrutor DOV tem se mostradoData de
  emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  eficiente para sua familiarização com os procedimentos na nova empresa. Em qualquer

  caso, no máximo dois voos supervisionados devem ser utilizados para instrução por dia.'
