title: Inicial de Equipamento. Esse treinamento é necessário para habilitar os despachantes
text: '5.4.3.2 Inicial de Equipamento. Esse treinamento é necessário para habilitar os despachantes

  em aeronaves de outro grupo. O operador deve enfatizar duas áreas: as novas

  características de operação da nova aeronave e as novas considerações que um

  despachante deve fazer em função da nova aeronave. Por exemplo, quando um

  despachante está se habilitando pela primeira vez na empresa em aeronaves a reação, será

  necessário treinamento em meteorologia de altas altitudes, em detecção e prevenção de

  turbulência de céu claro, em tropopausa e em jet streams.'
