title: Transição. Esse treinamento é necessário para habilitar os despachantes em aeronaves
text: '5.4.3.3 Transição. Esse treinamento é necessário para habilitar os despachantes em
  aeronaves

  do mesmo grupo. O despachante deve ser plenamente qualificado e habilitado em uma

  aeronave do mesmo grupo para ser elegível ao treinamento de transição. Assumindo-se

  que o despachante já possua familiaridade com as características das aeronaves deste

  grupo, o segmento de currículo deste treinamento de solo consiste quase que

  exclusivamente em treinamento nas características específicas da nova aeronave.'
