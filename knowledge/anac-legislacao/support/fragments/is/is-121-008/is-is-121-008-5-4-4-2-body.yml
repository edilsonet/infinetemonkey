title: Horas de treinamento Transição. As horas programadas para o treinamento de transição
text: '5.4.4.2 Horas de treinamento Transição. As horas programadas para o treinamento de
  transição

  não são especificadas no RBAC nº 121. O número de horas necessárias para o treinamento

  de transição varia amplamente, dependendo da similaridade dos tipos de aeronave

  envolvidas e da experiência do despachante operacional de voo. Com tipos de aeronaves

  similares, o treinamento de transição pode não ser tão extensivo. Quando as diferenças

  entre os tipos de aeronave são grandes, é necessário um treinamento mais extenso.'
