title: Determinando as horas gerais de treinamento de solo. A ANAC considerará a
text: '5.4.4.3 Determinando as horas gerais de treinamento de solo. A ANAC considerará a

  complexidade tanto da operação como da aeronave ao avaliar a ementa do segmento de

  currículo de treinamento de solo de um operador. O treinamento para um tipo complexo

  de operação pode exigir mais do que o requisito regulamentar mínimo de 40 horas. As

  horas programadas propostas incialmente devem ser pelo menos as 40 horas especificadas

  no § 121.422. Normalmente, o treinamento requerido só pode ser realizado no mínimo de

  40 horas requeridas pelo regulamento nos casos de operações simples e com no máximo

  um ou dois tipos de aeronave. Quando as operações são complexas e vários tipos

  diferentes de avião estão envolvidos, são geralmente necessárias mais horas de

  treinamento. As horas de treinamento realmente necessárias somente poderão ser

  determinadas no processo de aprovação final através da verificação pela ANAC daData de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  eficácia do treinamento (fase 4). As reduções nas horas programadas são apropriadas

  somente quando o operador demonstra que o treinamento fornecido é suficiente.

  5.5 Segmento de currículo: Qualificação.'
