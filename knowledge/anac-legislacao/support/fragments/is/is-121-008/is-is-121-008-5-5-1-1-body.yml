title: Qualificação inicial. O RBAC nº 121, no parágrafo 121.422(b), exige que o segmento
text: '5.5.1.1 Qualificação inicial. O RBAC nº 121, no parágrafo 121.422(b), exige que o segmento

  de currículo de qualificação dos despachantes operacionais de voo, para todas as

  categorias iniciais (Inicial de Nova Contratação, Inicial de Equipamento e Transição)

  deve conter um exame de competência. No entanto, apenas o segmento de currículo de

  qualificação da categoria Inicial de Nova Contratação ou Inicial de Equipamento requer

  voo de familiarização operacional, pois o voo de familiarização deve ser realizado por

  grupo de aeronaves, conforme o parágrafo 121.463(a) do RBAC nº 121. Além disso, o

  parágrafo 121.463(d) exige que um despachante esteja familiarizado com os

  procedimentos operacionais essenciais para cada especialidade da operação, como uma

  área de operação sobre o qual o despachante exerce sua jurisdição. Um meio para cumprir

  esta regra é realizar um exame de competência em uma área representativa da operação

  na qual o despachante da aeronave está qualificado.'
