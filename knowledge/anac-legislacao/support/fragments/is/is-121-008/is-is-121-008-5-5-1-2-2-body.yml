title: A Seção 121.463(c) exige que cada despachante de aeronave complete o voo de
text: '5.5.1.2.2 A Seção 121.463(c) exige que cada despachante de aeronave complete o voo
  de

  familiarização operacional periódico a cada 12 meses em algum tipo de aeronave para

  cada grupo de aeronave em que o despachante esteja habilitado para despachar.

  Nota: um exame de competência ou um voo de familiarização operacional concluído no mês

  anterior ou no mês após o mês de treinamento / verificação, é considerado como concluído

  no mês de treinamento / verificação. Este período de três meses é denominado período de

  elegibilidade, conforme 4.1.13 desta IS.'
