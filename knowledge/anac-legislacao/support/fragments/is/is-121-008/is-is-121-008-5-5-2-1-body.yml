title: O parágrafo 121.422(b) exige que um despachante operacional de voo demonstre
text: '5.5.2.1 O parágrafo 121.422(b) exige que um despachante operacional de voo demonstre

  conhecimento e habilidade para a ANAC ou um examinador credenciado DOV durante

  um exame de competência. A definição de examinador credenciado é uma pessoa que o

  operador indicou e treinou, e que foi aprovado pela ANAC para realizar a verificação da

  competência dos demais despachantes do operador. Um examinador credenciado não

  precisa necessariamente ser uma pessoa com um título de gerente, supervisor ouData de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  coordenador, mas deve ser atualmente habilitado como despachante para o operador.

  Durante a verificação de competência, o candidato só precisa demonstrar conhecimento

  e capacidade nas áreas geográficas para as quais está se qualificando.'
