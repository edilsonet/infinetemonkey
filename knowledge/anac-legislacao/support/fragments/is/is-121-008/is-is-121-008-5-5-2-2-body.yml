title: Condução do exame. A verificação de competência deve ser uma avaliação abrangente
text: '5.5.2.2 Condução do exame. A verificação de competência deve ser uma avaliação abrangente

  em que a ANAC ou o examinador credenciado DOV observa todos os aspectos da função

  de despacho. Uma parte do exame de competência deve consistir em o candidato

  despachar um voo real ou simular um voo real. Se o candidato não estiver qualificado

  atualmente para despachar um voo real, um despachante qualificado deve revisar e assinar

  todos os documentos necessários, o que não será necessário no caso de uma simulação.

  A parte restante do exame pode ser conduzida em uma sala de aula ou outro ambiente que

  permita que o candidato demonstre os conhecimentos e habilidades nas áreas que

  poderiam não ser observadas durante um período de serviço rotineiro. A padronização da

  condução do exame pratico DOV é descrita em IS específica.'
