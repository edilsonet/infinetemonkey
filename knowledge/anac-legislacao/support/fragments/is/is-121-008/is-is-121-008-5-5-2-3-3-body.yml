text: '5.5.2.3.3 Periódico e requalificação. O exame deve ser realizado especificamente para
  cada

  habilitação solicitada e deve englobar amostras representativas das rotas nas quais o

  despachante mantém qualificação. Os critérios mínimos para essa amostragem devem

  considerar a complexidade da operação (de passageiros ou cargueira, autorizações

  especiais, localidades com restrições especiais).'
