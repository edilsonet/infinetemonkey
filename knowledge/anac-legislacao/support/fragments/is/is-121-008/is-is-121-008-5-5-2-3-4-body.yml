text: '5.5.2.3.4 Operações especiais. Quando um despachante é qualificado em Extended Operations
  -

  ETOPS (ou Extended Diversion Time Operations - EDTO), ou em operações planejadas

  com redespacho em rota, os exames aplicados devem avaliar obrigatoriamente essas

  funções.'
