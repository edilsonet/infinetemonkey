text: '5.5.2.4 Nível de proficiência. O candidato a despachante operacional de voo deve estar
  apto a

  satisfatoriamente despachar os voos na mesma quantidade de tempo que o operador

  determina que seus despachantes qualificados realizem o mesmo trabalho. Deve-se

  avaliar se o candidato tem um nível de proficiência tal que o resultado bem-sucedido do

  trabalho do despachante nunca fique em dúvida.'
