title: A ANAC irá se assegurar que a descrição detalhada do curso do operador submetido para
text: '5.5.3.1 A ANAC irá se assegurar que a descrição detalhada do curso do operador submetido
  para

  aprovação inicial contenha pelo menos cada módulo requerido e a citação regulatória.Data
  de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  Antes de conceder a aprovação final, a ANAC irá verificar se os examinadores

  credenciados do operador exigem padrões adequados de proficiência nos exames de

  competências dos despachantes operacionais de voo e que os voos de familiarização

  operacional atinjam os objetivos de treinamento.'
