title: A seção 121.422 requer, como evento de um segmento de currículo de qualificação do
text: '5.5.4.1 A seção 121.422 requer, como evento de um segmento de currículo de qualificação
  do

  treinamento de transição, apenas o exame prático para verificação de competência

  específico. A categoria de treinamento de transição não requer voo de familiarização

  operacional. Se o exame prático for coincidente com os exames práticos periódicos, no

  entanto, será requerido o voo familiarização operacional como parte do módulo do

  treinamento periódico. Antes de conceder a aprovação final, a ANAC irá verificar se os

  examinadores credenciados do operador exigem um padrão adequado de proficiência nos

  exames de competências dos despachantes operacionais de voo.'
