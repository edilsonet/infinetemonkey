title: Um despachante operacional de voo deve realizar um voo de familiarização operacional
text: '5.5.5.1 Um despachante operacional de voo deve realizar um voo de familiarização operacional

  em um tipo de aeronave de cada grupo quando inicialmente se qualificar nesse grupo de

  aviões e, depois disso, anualmente. A seção 121.463(a)(3) especifica que a substituição

  de 1 hora de tempo de voo por cada decolagem e pouso adicional pode reduzir as 5 horas

  de familiarização operacional a 2 horas, 30 minutos.

  Trechos Mínimo de horas de voo

  1 decolagem e 1 pouso 5 horas

  2 decolagens e 2 pousos 4 horas

  3 decolagens e 3 pousos 3 horas

  4 decolagens e 4 pousos 2,5 horas

  5 decolagens e 5 pousos 2,5 horas'
