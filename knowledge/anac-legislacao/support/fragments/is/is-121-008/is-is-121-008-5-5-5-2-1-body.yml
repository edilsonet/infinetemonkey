title: Os voos selecionados devem levar o candidato a despachante operacional de voo pelas
text: '5.5.5.2.1 Os voos selecionados devem levar o candidato a despachante operacional de
  voo pelas

  áreas essenciais em que o candidato deve ser qualificado. Os voos devem transitar uma

  das principais áreas terminais (TMA) dentro da região. Para os voos de familiarização

  operacional em anos consecutivos, o operador deve ter um plano para expor

  sistematicamente um despachante às diferentes rotas e áreas terminais que estão sob sua

  responsabilidade.'
