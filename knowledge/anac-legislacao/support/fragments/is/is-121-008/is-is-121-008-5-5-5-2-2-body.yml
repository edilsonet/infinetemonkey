title: Os operadores devem se assegurar que os despachantes operacionais de voo responsáveis
text: '5.5.5.2.2 Os operadores devem se assegurar que os despachantes operacionais de voo
  responsáveis

  pelas rotas sobre grandes extensões de agua tenham uma familiarização operacional

  nessas rotas e com os procedimentos de tripulação de voo, da mesma forma como nas

  rotas domésticas. Os despachantes responsáveis pelo ETOPS devem observar essas

  operações.'
