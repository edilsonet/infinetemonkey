text: '5.5.5.3 Voo de familiarização operacional em um simulador. O RBAC nº 121 permite que
  os

  despachantes operacionais de voo realizem a familiarização operacional da aeronave em

  um simulador. Depois que o despachante estiver qualificado, pode-se permitir queData de
  emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  observe o treinamento de voo LOFT e o treinamento de gerenciamento de recursos do

  cockpit dos membros da tripulação de voo (CRM). Esse treinamento deve se relacionar

  diretamente com os deveres dos despachantes. No entanto, a realização da familiarização

  em simulador deve ser utilizada como exceção, sendo que não será dada autorização para

  voos de familiarização operacional repetidamente realizados em simulador em vez de

  voos reais. Não será autorizado o uso de um simulador em vez de voos reais nas categorias

  de treinamento Inicial de Nova Contratação ou Inicial de Equipamento. Se circunstâncias

  especiais existirem (por exemplo, questões médicas ou físicas) que exigem

  procedimentos alternativos a essa norma, o operador deverá solicitar tal procedimento

  alternativo formalmente. Os pedidos de desvio devem incluir uma explicação das

  circunstâncias que exigem o procedimento alternativo.'
