title: Os operadores tipicamente atribuem despachantes operacionais de voo para exercer
text: '5.5.6.1 Os operadores tipicamente atribuem despachantes operacionais de voo para exercer

  autoridade e controle operacional sobre uma determinada área geográfica, ou segmento

  da operação, mas podem exigir que o despachante mantenha a familiaridade em áreas ou

  segmentos adicionais. O parágrafo 121.463(d) exige que os operadores se assegurem que

  cada despachante esteja familiarizado com todos os procedimentos operacionais

  essenciais em um determinado segmento da operação ou área geográfica antes de lhe

  atribuir a responsabilidade de despacho ou controle operacional nessa área. Este

  treinamento não deve ser confundido com o voo de familiarização operacional, que expõe

  o despachante aos procedimentos de voo por parte da tripulação.'
