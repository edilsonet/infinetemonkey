title: Perda da familiarização. Os operadores devem desenvolver os critérios que identificam
text: '5.5.6.2 Perda da familiarização. Os operadores devem desenvolver os critérios que identificam

  quando um despachante operacional de voo não está atualizado o suficiente para trabalhar

  em um segmento ou área e devem desenvolver os procedimentos necessários para a sua

  familiarização. Os meios que o operador pode usar para identificar quando um

  despachante não está atualizado dependem de muitos fatores, como a complexidade da

  operação em um segmento específico, a experiência do despachante e o tempo de

  ausência do despachante longe da função.'
