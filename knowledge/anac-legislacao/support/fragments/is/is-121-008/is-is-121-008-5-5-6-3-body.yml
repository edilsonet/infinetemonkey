text: '5.5.6.3 Refamiliarização. Dependendo da situação, o método que o operador usa para

  restabelecer a familiarização pode ser tão simples como um briefing por um despachante

  qualificado, ou tão complexo como uma verificação de competência por um examinador

  credenciado (não confundir com o currículo de requalificação).

  5.6 Currículo de treinamento: Periódico.Data de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
