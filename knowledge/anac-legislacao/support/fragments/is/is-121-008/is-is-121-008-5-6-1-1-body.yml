title: As seções 121.427 e 121.415 exigem que os operadores conduzam o treinamento
text: '5.6.1.1 As seções 121.427 e 121.415 exigem que os operadores conduzam o treinamento

  periódico para garantir que cada despachante operacional de voo permaneça

  adequadamente treinado e proficiente em tarefas e responsabilidades a eles atribuídas em

  relação a cada avião e tipo de operação designados. O parágrafo 121.415(g)(2) também

  exige o treinamento do despachante em novos equipamentos, instalações, procedimentos

  e técnicas.'
