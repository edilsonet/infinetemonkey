title: O parágrafo 121.433(c)(1)(ii) exige que cada despachante operacional de voo complete
text: '5.6.2.1 O parágrafo 121.433(c)(1)(ii) exige que cada despachante operacional de voo
  complete

  treinamento periódico e que seja aprovado em exame de competência a cada 12 meses

  calendários. Os operadores também devem garantir que, além de realizar o exame de

  competência, cada despachante complete 5 horas em voos de familiarização operacional

  a cada 12 meses calendários, conforme exigido pelo parágrafo 121.463(c). O método

  padronizado é que o operador alinhe no “mês de treinamento / verificação” a realização

  do treinamento do despachante, do exame de competência e do voo de familiarização

  operacional, ou que os realize dentro do período de elegibilidade.'
