text: '5.6.3.1 O parágrafo 121.427(c)(3) especifica as horas mínimas programadas para instrução
  no

  treinamento periódico. O objetivo do treinamento periódico é garantir que os

  despachantes operacionais de voo permaneçam proficientes nas tarefas e nas

  responsabilidades atribuídas. O despachante cumpre esse objetivo quando ele ou ela pode

  atuar em um nível aceitável de proficiência, no momento imediatamente antes que se

  inicie o próximo ciclo de treinamento periódico, pois ultrapassá-lo pode exigir mais horas

  de treinamento do que o especificado na regulamentação. As horas mínimas requeridas

  são as seguintes:'
