text: '5.6.4.1.1 O parágrafo 121.415(g)(2) requer treinamento em novos equipamentos, instalações,

  procedimentos e técnicas. Os operadores devem reservar um período de tempo, ou

  módulo(s), no treinamento periódico a cada ano para esses tópicos. Eles também devem

  abordar problemas e preocupações atuais. Esse treinamento específico deve ser revisado

  anualmente.Data de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
