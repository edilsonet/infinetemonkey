title: O treinamento periódico em cada tipo de aeronave, incluindo o treinamento de diferenças,
text: '5.6.4.1.2 O treinamento periódico em cada tipo de aeronave, incluindo o treinamento
  de diferenças,

  deve ser realizado para despachantes operacionais de voo a cada ano. Esse treinamento

  deve se relacionar direta e especificamente com os deveres do despachante e pode não

  ser simplesmente uma repetição do treinamento dado aos membros da tripulação de voo.

  A quantidade de treinamento dada ao despachante deve garantir a proficiência contínua

  nas suas obrigações em relação a cada tipo de aeronave.'
