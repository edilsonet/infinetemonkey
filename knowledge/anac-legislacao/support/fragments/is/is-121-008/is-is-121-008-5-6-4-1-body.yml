text: '5.6.4.1 A Seção 121.427 requer treinamento periódico em cada assunto do treinamento
  inicial.

  As seções 121.415 e 121.422 delineiam esses assuntos. A ANAC irá avaliar se os

  operadores têm os meios de identificar e corrigir as deficiências no conhecimento e na

  proficiência dos despachantes operacionais de voo em cada aeronave e em cada uma das

  áreas requeridas.'
