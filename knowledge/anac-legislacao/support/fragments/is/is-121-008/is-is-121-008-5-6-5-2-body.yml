title: As horas de treinamento anuais propostas na ementa do curso devem inicialmente atender
text: '5.6.5.2 As horas de treinamento anuais propostas na ementa do curso devem inicialmente
  atender

  ou exceder as especificações regulatórias. Normalmente, o treinamento periódico

  necessário pode ser realizado nas horas mínimas especificadas por regulamento apenas

  para operações simples de um ou dois tipos de aeronave. O treinamento para operações

  complexas e para diferentes tipos de aeronaves normalmente requer mais horas. Tanto a

  ANAC quanto os operadores só podem determinar a efetividade das horas reais de

  treinamento necessárias observando e avaliando a eficácia do treinamento fornecido.'
