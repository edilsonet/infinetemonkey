cite: 5.7.1.1
title: O RBAC nº 121 não aborda especificamente a requalificação do despachante operacional
text: '5.7.1.1 O RBAC nº 121 não aborda especificamente a requalificação do despachante operacional

  de voo. Quando os despachantes perdem sua qualificação e a conformidade com o RBAC

  nº 121, eles devem se requalificar antes de atuar como despachante novamente. O

  parágrafo 121.415(g)(1) exige que, além das categorias de treinamento inicial, de

  transição e periódico, seja providenciado para cada despachante o treinamento necessário

  para manter a proficiência em cada avião e operação em que atue. É responsabilidade do

  operador desenvolver o currículo de treinamento de requalificação para retornar um

  despachante que tenha perdido a qualificação a um status qualificado.'
