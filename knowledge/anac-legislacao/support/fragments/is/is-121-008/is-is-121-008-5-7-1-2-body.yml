title: Os despachantes operacionais de voo que não completaram o treinamento periódico, um
text: '5.7.1.2 Os despachantes operacionais de voo que não completaram o treinamento periódico,
  um

  exame de competência ou o voo de familiarização operacional dentro do período de

  elegibilidade, ou que ficaram afastados de suas funções por prolongado período, devem

  completar o treinamento de requalificação antes que eles possam atuar novamente como

  despachantes em voos comerciais sem supervisão. O conteúdo e a duração do currículo

  de requalificação dependem do período de tempo em que o despachante ficou afastado da

  função. A ANAC irá se certificar que a descrição detalhada do currículo de requalificação

  contenha as horas específicas de treinamento e eventos para requalificação do

  despachante. Operadores devem entender que a base para a requalificação é a

  demonstração da proficiência específica do despachante por meio de um exame prático

  para a verificação da sua competência e o cumprimento do treinamento faltante. Um

  despachante deve receber a quantidade de treinamento suficiente para alcançar um nível

  aceitável de proficiência. A quantidade de horas para o treinamento de requalificaçãoData
  de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  nunca pode ser inferior ao tempo necessário para o treinamento periódico anual. Se um

  despachante atingir um nível de proficiência em menos horas do que as adicionais

  programadas, o despachante não precisa completar as horas adicionais programadas

  remanescentes.'
