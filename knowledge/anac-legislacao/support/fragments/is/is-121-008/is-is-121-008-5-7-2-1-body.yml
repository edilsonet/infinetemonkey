text: '5.7.2.1 Considerando que no “mês de treinamento / verificação” (mês devido) dentro
  do período

  de elegibilidade um despachante operacional de voo deva realizar um treinamento

  periódico, tendo este treinamento sido completado ou não, as horas necessárias mínimas

  para requalificação são descritas na tabela a seguir:

  Tempo desde o mês devido Segmento de

  Treinamento

  Segmento de

  Qualificação

  Até 3 meses calendários Treinamento Periódico

  (se não foi completado

  no período de

  elegibilidade)

  Qualquer módulo que

  não foi completado no

  período de elegibilidade,

  seja EC e/ou VFO

  Entre 3 meses e 6 meses 8 horas de treinamento

  adicional, e treinamento

  periódico (se não foi

  completado no período

  de elegibilidade)

  EC (e, se não foi

  completado no período

  de elegibilidade, VFO)

  Entre 6 meses e 12 meses 8 horas de treinamento

  adicional, treinamento

  periódico, e capacitação

  em serviço (CAS ou

  OJT)

  EC e VFO

  Entre 12 meses e 36 meses 16 horas de treinamento

  adicional, treinamento

  periódico, e capacitação

  em serviço (CAS ou

  OJT)

  EC e VFO

