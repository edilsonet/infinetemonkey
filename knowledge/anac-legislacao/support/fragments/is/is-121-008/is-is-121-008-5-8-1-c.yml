title: 5.8.1(c)
text: 'c) O parágrafo 121.401(f)(1) especifica que cada instrutor responsável por um

  determinado assunto de treinamento ou segmento curricular deve certificar, ou prover

  certificado, da proficiência e do conhecimento dos indivíduos após a conclusão com

  aproveitamento desse treinamento.'
