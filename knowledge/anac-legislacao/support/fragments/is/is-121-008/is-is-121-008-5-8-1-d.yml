title: 5.8.1(d)
text: 'd) O parágrafo 121.402(a) especifica que cada instrutor deve estar trabalhando para,
  ou

  sob o controle direto do detentor do certificado, ou para outro detentor do certificado
  sob

  o RBAC nº 121 ou para um centro de treinamento sob o RBAC nº 142.'
