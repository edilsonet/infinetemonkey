title: 5.8.1(i)
text: 'i) possuir a licença e as habilitações necessárias para trabalhar como despachante

  operacional de voo;

  ii) possuir contrato de trabalho na função DOV (sendo essa exercida no mínimo há

  3 anos);

  iii) ter completado com sucesso o treinamento para os aviões envolvidos (inicial,

  transição e periódicos);

  iv) ter completado satisfatoriamente os apropriados exames de competência; e'
