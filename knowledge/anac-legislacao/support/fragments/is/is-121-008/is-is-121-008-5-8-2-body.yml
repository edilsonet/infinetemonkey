title: Visão geral do papel e características do instrutor DOV. Um instrutor DOV é uma pessoa
text: '5.8.2 Visão geral do papel e características do instrutor DOV. Um instrutor DOV é uma
  pessoa

  empregada por um operador com a finalidade de treinar despachantes operacionais de voo

  em um programa de treinamento aprovado. Os instrutores devem conhecer os requisitos

  aplicáveis dos RBAC/RBHA 65, 91, 110, 119 e 121, além de políticas e práticas

  operacionais de segurança da ANAC e as políticas e procedimentos do operador. Um

  instrutor DOV deve possuir habilidades de comunicação efetivas e uma atitude que

  sempre reflita profissionalismo e uma visão positiva em relação à segurança.'
