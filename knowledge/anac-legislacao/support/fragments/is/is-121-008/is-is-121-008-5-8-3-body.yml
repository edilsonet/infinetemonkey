text: '5.8.3 Treinamento e qualificação. Um indivíduo deve cumprir os requisitos de capacitação
  e

  qualificação do operador para conduzir instrução, conforme seu Programa de

  Treinamento aprovado, por completar com sucesso o Curso de Formação de Instrutores

  do operador. Apesar de o RBAC nº121 não abordar especificamente o requisito de carga

  horária e conteúdo desse curso, recomenda-se que os operadores utilizem o Curso de

  Formação de Facilitadores de Aprendizagem, disponível no site de Capacitação da ANAC

  em https://sistemas.anac.gov.br/capacitacao, como referência para seu planejamento de

  conteúdo e carga horária. Os instrutores DOVs devem receber treinamento do material

  do curso a ser ministrado e em pelo menos nos seguintes tópicos:'
