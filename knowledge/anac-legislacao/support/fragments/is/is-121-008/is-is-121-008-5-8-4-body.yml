text: '5.8.4 Registros de treinamento e qualificação. O operador deve manter a documentação
  do

  treinamento e qualificação para cada instrutor DOV e deve disponibilizar essa

  documentação para inspeção pela ANAC por sua solicitação. Uma lista de instrutores

  DOV deve ser fornecida por ocasião do processo de aprovação do programa de

  treinamento DOV e, após a aprovação do programa, mantida sempre atualizada e

  disponível e acessível para consulta da ANAC.

  5.9 Examinadores Credenciados DOV'
