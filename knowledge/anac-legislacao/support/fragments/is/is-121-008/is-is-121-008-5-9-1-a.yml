title: 5.9.1(a)
text: 'a) O parágrafo 121.401(a)(4) requer que os detentores de certificados forneçam

  examinadores credenciados de despachante operacional de voo suficientes, para realizar

  os exames de competência exigidos pelo regulamento.'
