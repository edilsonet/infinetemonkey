text: '5.9.2 Visão geral do papel e características do examinador credenciado DOV. O papel
  do

  examinador credenciado é garantir que os despachantes operacionais de voo atinjam os

  padrões de competência demonstrando conhecimentos e habilidades nos assuntos de

  treinamento exigidos pelo RBAC nº 121. Os examinadores devem conhecer os requisitos

  aplicáveis dos RBAC/RBHA 65, 91, 110, 119 e 121, além de políticas e práticas

  operacionais de segurança da ANAC, e as políticas e procedimentos do operador.'
