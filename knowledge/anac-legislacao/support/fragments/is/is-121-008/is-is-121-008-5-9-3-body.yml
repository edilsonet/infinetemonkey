title: Treinamento e qualificação. Um operador sob o RBAC nº 121 deve estabelecer e manter
text: '5.9.3 Treinamento e qualificação. Um operador sob o RBAC nº 121 deve estabelecer e
  manter

  um programa para treinar e qualificar os seus examinadores credenciados DOV. UmData de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.

  indivíduo deve estar licenciado e habilitado como um despachante operacional de voo

  para que se qualifique como candidato a um examinador. Neste contexto, “licenciado e

  habilitado” significa que um indivíduo completou com sucesso todos os requisitos de

  treinamento e qualificação nos §§ 121.415, 121.422 e 121.427 (incluindo exames de

  competência). Para manter a qualificação como examinador credenciado DOV, um

  indivíduo deve permanecer atualizado e qualificado como um despachante operacional

  de voo por completar o treinamento periódico, incluindo os exames de competência

  requeridos. Adicionalmente é mandatório o candidato a examinador ser aprovado em um

  curso de formação inicial de examinadores credenciados DOV, ministrado pela ANAC.

  Apenas após a aprovação nos treinamentos mínimos, tanto do operador como da ANAC,

  o candidato a examinador poderá ser submetido a um processo de credenciamento para

  comprovação do cumprimento dos requisitos regulatórios da seção § 121.412b. A IS nº

  121-002 fornece orientação sobre o processo de credenciamento inicial,

  recredenciamento e vigilância dos Examinadores Credenciados e a sua atuação nas

  empresas de transporte aéreo regidas pelo RBAC nº 121, incluindo do Examinador

  Despachante Operacional de Voo.'
