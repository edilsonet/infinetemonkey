title: Pessoal. A fim de garantir a continuação da qualificação de seu quadro de despachantes
text: '5.9.4 Pessoal. A fim de garantir a continuação da qualificação de seu quadro de despachantes

  operacionais de voo, os operadores sob o RBAC nº 121 devem empregar pelo menos dois

  examinadores DOV. Em casos raros, como na certificação inicial de um operador aéreo,

  ou mudanças súbitas da equipe, pode haver o emprego de um único examinador

  credenciado DOV. Porém, a taxa recomendada de emprego de examinadores

  credenciados DOV é de aproximadamente 10% do total de despachantes operacionais de

  voo contratados pelo operador.'
