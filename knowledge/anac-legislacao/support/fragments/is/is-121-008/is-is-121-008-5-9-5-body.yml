title: Registros de treinamento e qualificação. O operador deve manter a documentação do
text: '5.9.5 Registros de treinamento e qualificação. O operador deve manter a documentação
  do

  treinamento e da qualificação para cada examinador credenciado DOV e deve

  disponibilizar essa documentação para inspeção da ANAC quando solicitado.

  6 APÊNDICES

  A. Representação esquemática genérica do Programa de Treinamento DOV.

  B. Ajuda de trabalho para identificação das categorias e currículos mínimos.

  C. Ficha de Voo de Familiarização DOV.

  D. Controle das alterações

  7 DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 Esta IS entra em vigor em 26 de março de 2018.Data de emissão: 23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
