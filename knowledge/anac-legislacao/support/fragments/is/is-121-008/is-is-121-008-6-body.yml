title: Para cada aeronave identifique o treinamento Periódico e de Requalificação necessário.
text: '6. Para cada aeronave identifique o treinamento Periódico e de Requalificação necessário.

  Para cada item marcado será necessário um currículo de treinamento.

  Categorias de Treinamento x

  Currículos Necessários

  Aeronaves Grupo I Aeronaves Grupo II

  Preencha as aeronaves operadas >>

  Treinamento Inicial de Contratação

  Treinamento Inicial de Equipamento

  Treinamento de Transição

  Treinamento Periódico

  Treinamento de Requalificação

  Para cada Currículo, verifique a seguinte estrutura:

  Categorias de Treinamento.

  Currículos de Treinamento.

  Segmentos de Currículos.

  Módulos de Treinamento.

  Módulos de Qualificação.

  Cada Currículo e Segmento de Currículo proposto ou alterado apresenta a seguinte informação:

  Nome do Operador, Tipo de Aeronave, Função e Título do currículo ou segmento?Data de emissão:
  23 de fevereiro de 2018

  IS nº 121-008

  Revisão A

  - NTDOV - GCTA - SP.'
