text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS No 121-008

  Revisão A

  Aprovação: Portaria nº 526/SPO, de 15 de fevereiro de 2018.

  Assunto: Procedimentos para elaboração de programa de

  treinamento operacional de despachantes operacionais de

  voo segundo o RBAC nº 121.

  1 OBJETIVO

  1.1 Orientar as empresas aéreas regidas pelo RBAC nº 121 nos processos específicos de

  elaboração, aprovação e revisão dos currículos de treinamento utilizados nos Programas

  de Treinamento Operacional para Despachantes Operacionais de Voo (PTO-DOV).

  2 REVOGAÇÃO

  2.1 Não aplicável.

  3 FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar

  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,

  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou

  RBHA.

