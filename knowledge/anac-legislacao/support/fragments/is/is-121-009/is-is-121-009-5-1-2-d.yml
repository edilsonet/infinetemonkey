cite: 5.1.2(d)
title: 5.1.2(d)
text: 'd) cada conjunto deve conter, pelo menos:

  I - material para reparar e encher o bote;

  II - material para dessalinizar água do mar e para fornecer um mínimo de calorias a cada

  ocupante do bote durante 24 horas;

  III - material para sinalização, independente do equipamento pirotécnico requerido por

  121.339(a)(3) - (espelho, marcador de mar, etc.);

  IV - material para primeiros socorros, contido em estojo à prova d’água, apropriado para

  fazer curativos e para medicar queimaduras, enjoo e dores (analgésico);

  V - manual de sobrevivência no mar; e

  VI - qualquer outro material julgado conveniente pela empresa, em função da rota a ser

  voada.

  5.2 Conjunto de sobrevivência para operações sobre terrenos desabitados'
