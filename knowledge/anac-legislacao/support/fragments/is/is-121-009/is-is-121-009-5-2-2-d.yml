section_title: Considera-se apropriadamente equipado, para selva, o conjunto de sobrevivência
  que
subsection_id: d
cite: 5.2.2(d)
title: 5.2.2(d)
text: 'd) cada conjunto deve conter, pelo menos:

  I - material para sinalização, independente do equipamento pirotécnico requerido por

  121.353(a) - (espelho, gerador de fumaça, marcador de água para uso em rio etc.);

  II - material, em quantidade suficiente para o consumo de cada ocupante por 24 horas,

  para purificar água e para fornecer um mínimo de calorias;

  III - fósforo, isqueiro ou similar para fazer fogo;

  IV - um manual de sobrevivência adequado, uma bússola e um apito;

  V - repelente de insetos;

  VI - sal de cozinha;

  VII - conjunto de primeiros socorros e lanterna (podem ser computados aqueles exigidos

  pelos parágrafos 121.309(d) e 121.310(l) do RBAC nº 121); e

  VIII - qualquer outro material considerado conveniente pela empresa, em função de rota

  a ser voada.'
