text: '5.2.3 Para outros terrenos desabitados, que não selva, a empresa deverá propor o conteúdo
  mínimo

  do conjunto de sobrevivência, adequada à rota a ser voada e ao número de passageiros

  transportados, e esse conteúdo deverá ser aceito pela ANAC.

  5.3 Disposições finais'
