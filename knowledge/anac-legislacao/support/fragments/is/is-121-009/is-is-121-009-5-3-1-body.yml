text: '5.3.1 Cada empresa aérea deve fornecer à ANAC, em função do tipo de avião e das rotas
  a serem

  voadas, a quantidade de conjuntos de sobrevivência na selva e no mar a serem transportados

  em cada tipo de avião e uma listagem do material contido em cada conjunto.'
