title: A ANAC pode autorizar o uso apenas dos conjuntos de sobrevivência no mar, ou de uma
text: '5.3.2 A ANAC pode autorizar o uso apenas dos conjuntos de sobrevivência no mar, ou
  de uma

  combinação adequada de conjuntos de sobrevivência no mar e conjuntos de sobrevivência

  em regiões despovoadas ou selva, desde que a empresa demonstre que o número e o conteúdo

  de tais conjuntos atendem às necessidades de sobrevivência na região considerada.Data de
  emissão: 9 de maio de 2018. IS nº 121-009

  Revisão A'
