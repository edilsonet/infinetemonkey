text: '4.1.2 sistema de documentos de segurança operacional: conjunto inter-relacionado de

  documentos estabelecidos pelo operador aéreo para compilação e organização das

  informações necessárias para as operações de solo e voo. Ele compreende, no mínimo, os

  sistemas de manuais de operações e de manutenção requeridos pela legislação. Na

  terminologia do Anexo 6 à Convenção de Chicago, é chamado de flight safety documents

  system;'
