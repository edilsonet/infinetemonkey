text: '4.1.4 sistema de manuais de operações: conjunto de manuais que contém procedimentos,

  instruções e orientações para uso do pessoal de operações na execução de seus deveres.

  Na terminologia do Anexo 6 à Convenção de Chicago, é chamado de operations manual.

  4.2 Lista de abreviaturas (em ordem alfabética):

  ANAC - Agência Nacional de Aviação Civil

  CENIPA - Centro de Investigação e Prevenção de Acidentes Aeronáuticos

  COA - certificado de operador aéreo

  DECEA - Departamento de Controle do Espaço Aéreo

  EO - especificações operativas

  IAC - Instrução de Aviação Civil

  IS - Instrução Suplementar

  OACI - Organização da Aviação Civil Internacional

  RBAC - Regulamento Brasileiro da Aviação Civil

  RBHA - Regulamento Brasileiro de Homologação Aeronáutica'
