title: Estes documentos, considerados em conjunto, compõem o sistema de documentos de
text: '5.1.2 Estes documentos, considerados em conjunto, compõem o sistema de documentos de

  segurança operacional do operador aéreo. Os manuais, programas, listas de verificação

  etc. de operações e de manutenção requeridos pela legislação para operadores do RBAC

  nº 121 são elementos mínimos do sistema. Outros documentos desenvolvidos pelo

  operador para apoio às operações, mas que não são necessariamente requeridos pelos

  regulamentos, também podem ser levados em consideração, tais como boletins de

  segurança de caráter temporário.'
