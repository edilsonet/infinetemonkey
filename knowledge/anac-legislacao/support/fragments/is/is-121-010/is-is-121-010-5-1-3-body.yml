cite: 5.1.3
title: O conceito de um sistema de documentos de segurança operacional requer que os
text: '5.1.3 O conceito de um sistema de documentos de segurança operacional requer que os

  operadores adotem uma abordagem integrada e considerem seus documentos como um

  sistema completo. É importante que esses documentos sejam coerentes entre si e

  consistentes com a legislação, requisitos dos fabricantes das aeronaves e princípios de

  fatores humanos. Também é necessário garantir a consistência dos documentos entre

  diferentes departamentos do operador aéreo, bem como em sua aplicação. Daí a ênfase

  em uma abordagem integrada, considerando o conjunto desses documentos como um

  sistema completo.'
