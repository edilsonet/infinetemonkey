text: '5.1.4 Os parágrafos a seguir abordam os principais aspectos da organização e desenvolvimento

  do sistema de documentos de segurança operacional dos operadores aéreos. O

  desenvolvimento de um sistema de documentos de segurança operacional deve ser tratado

  com uma abordagem sistêmica, na qual alterações em um único documento podem afetar

  o sistema como um todo.

  5.2 Estabelecimento do sistema de documentos de segurança operacional'
