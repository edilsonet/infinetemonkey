title: O sistema de documentos de segurança operacional deve ser organizado de acordo com
text: '5.2.1.1 O sistema de documentos de segurança operacional deve ser organizado de acordo
  com

  critérios que assegurem facilidade de acesso às informações necessárias às operações de

  solo e voo e que facilitem o gerenciamento da distribuição e da revisão dos vários

  documentos que compõem o sistema.'
