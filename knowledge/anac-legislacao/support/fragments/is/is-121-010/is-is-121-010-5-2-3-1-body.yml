title: O sistema de documentos de segurança operacional deve manter a consistência na
text: '5.2.3.1 O sistema de documentos de segurança operacional deve manter a consistência
  na

  terminologia e no uso de termos padronizados para itens e ações comuns.

  Exemplo: considerando que os termos "throttles" e "thrust levers" se referem ao mesmo item,
  o

  operador deve escolher um dos termos e usá-lo de forma consistente em sua

  documentação. O operador também deve se atentar para manter a consistência entre seus

  documentos e as marcações, etiquetas e placares de aeronaves e componentes.'
