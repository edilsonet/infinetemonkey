title: Os documentos do sistema devem incluir um glossário de termos e acrônimos com suas
text: '5.2.3.2 Os documentos do sistema devem incluir um glossário de termos e acrônimos com
  suas

  respectivas definições, atualizados periodicamente para garantir o acesso dos

  profissionais à terminologia mais recente. Todos os termos, acrônimos e abreviaturas

  relavantes incluídas no sistema de documentos de segurança operacional devem estar

  definidos.'
