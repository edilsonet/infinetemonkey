title: O sistema de documentos de segurança operacional deve assegurar padronização entre
text: '5.2.3.3 O sistema de documentos de segurança operacional deve assegurar padronização
  entre

  diferentes tipos de documento, incluindo formatação, terminologia, estilo de redação e

  uso de gráficos e símbolos. Isso inclui localização consistente de tipos específicos de

  informação e uso consistente de códigos e unidades de medida.'
