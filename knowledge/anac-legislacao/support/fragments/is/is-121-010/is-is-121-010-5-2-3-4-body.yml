title: Os documentos do sistema devem possuir um índice para ajudar os profissionais a
text: '5.2.3.4 Os documentos do sistema devem possuir um índice para ajudar os profissionais
  a

  localizar as informações pertinentes às suas atividades. O índice deve ser colocado no

  início de cada documento para rápida referência.Data de emissão: 6 de julho de 2018 IS nº
  121-010

  Revisão A

  Nota: é recomendável que o sistema de documentos de segurança operacional possua um índice

  remissivo único para localizar, em tempo hábil, informações presentes em mais de um

  documento. Esse índice único deveria ser colocado em pelo menos um dos documentos

  principais do sistema.'
