title: Cada cópia de um manual, por exemplo, deve preferenciamente conter um número de
text: '5.2.3.6 Cada cópia de um manual, por exemplo, deve preferenciamente conter um número
  de

  série, e uma lista de detentores deve ser mantida pela pessoa responsável por publicar

  revisões. Quando este sistema não for utilizado, o operador deve ter arranjos alternativos

  satisfatórios para controlar a publicação e revisão dos manuais. Cada manual deve conter

  título e lista de conteúdo, dando uma indicação clara do seu escopo. No início, deve haver

  página de controle de revisões, com indicação do número e data da revisão e nome ou

  assinatura das pessoas responsáveis pela revisão. As páginas alteradas devem receber a

  data da nova revisão. Os arranjos de páginas, seções, parágrafos, etc. deve ser ordenado

  e sistemático para facilitar a identificação imediata de qualquer parte do assunto. O padrão

  de impressão, cópia, encadernação, separação e indexação de seção, etc. deve ser

  suficiente para permitir que o documento seja lido sem dificuldade e para garantir que ele

  permaneça intacto e legível durante o uso normal.'
