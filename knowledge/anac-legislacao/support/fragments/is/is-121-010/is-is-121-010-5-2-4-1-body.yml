cite: 5.2.4.1
title: Os operadores devem monitorar a implementação e manutenção do sistema de
text: '5.2.4.1 Os operadores devem monitorar a implementação e manutenção do sistema de

  documentos de segurança operacional para assegurar o uso apropriado e realista dos

  documentos, baseado nas características do ambiente operacional e de modo que seja

  operacionalmente relevante e benéfico aos profissionais. Este monitoramento deve incluir

  um sistema formal de feedback para obtenção de críticas e sugestões dos profissionais.'
