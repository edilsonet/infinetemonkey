title: Ao longo do tempo, inúmeras situações demandarão revisões no sistema de documentos
text: '5.2.5.1 Ao longo do tempo, inúmeras situações demandarão revisões no sistema de documentos

  de segurança operacional. Essas revisões podem ser provocadas tanto por fatores internos

  quanto externos aos operadores. Para tanto, é necessário que os operadores estejam

  preparados para lidar com esses fatores.'
