title: 5.2.5.2(d)
text: 'd) fabricantes e fornecedores de produtos aeronáuticos.

  Nota 1: a coleta de informações pode consistir, por exemplo, de uma assinatura, que garanta
  o

  recebimento de informação de forma tempestiva sempre que houver atualização, ou de

  uma consulta periódica, de forma registrada, à fonte de informação para verificar se houveData
  de emissão: 6 de julho de 2018 IS nº 121-010

  Revisão A

  atualização.

  Nota 2: os fabricantes fornecem informações necessárias para a operação de aeronaves

  específicas. Essas informações atendem a requisitos da autoridade de aviação do país de

  projeto da aeronave e tendem a enfatizar os sistemas e procedimentos em condições que

  podem não corresponder totalmente às exigências dos operadores. Os operadores devem

  considerar essas informações e garantir que elas atendam à legislação brasileira e às

  necessidades de seus profissionais.'
