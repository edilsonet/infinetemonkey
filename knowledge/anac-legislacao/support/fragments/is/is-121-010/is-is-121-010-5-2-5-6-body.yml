title: A alteração de documentos em manuscrito não é aceitável. Alterações ou adições, por
text: '5.2.5.6 A alteração de documentos em manuscrito não é aceitável. Alterações ou adições,
  por

  menores que sejam, devem ser incorporadas pela emissão de uma página nova,

  devidamente datada, e o conteúdo alterado deve ser indicado por uma marcação, como

  por exemplo uma linha vertical na margem.'
