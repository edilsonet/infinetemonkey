text: '5.2.6.1 Os operadores devem desenvolver métodos de comunicação de novas informações.
  Os

  métodos específicos devem ser responsivos ao grau de urgência da comunicação.Data de emissão:
  6 de julho de 2018 IS nº 121-010

  Revisão A

  Nota 1: a estrutura para comunicar mudanças na documentação é necessária, porém os operadores

  devem ter cuidado para não abusar da sua utilização. Alterações frequentes,

  especialmente nos procedimentos de voo, mesmo que divulgadas de forma eficiente,

  podem minar a estabilidade de manuais e listas de verificação e reduzir o seu

  cumprimento pelos profissionais.

  Nota 2: a comunicação de novas informações para o usuário final dos documentos, como por

  exemplo os tripulantes, também pode exigir a coordenação com outros grupos que

  possam ser afetados pelas alterações, tais como instrutores, mecânicos e despachantes.'
