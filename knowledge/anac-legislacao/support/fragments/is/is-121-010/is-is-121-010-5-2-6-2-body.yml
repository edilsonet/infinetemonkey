title: O método de comunicação de novas informações deve ser complementado por um
text: '5.2.6.2 O método de comunicação de novas informações deve ser complementado por um

  sistema de rastreamento para assegurar que os profissionais estejam atualizados. O

  sistema de rastreamento deve incluir um procedimento para verificar se os profissionais

  dispõem das atualizações mais recentes. Para documentos distribuídos em versão física,

  os procedimentos devem garantir que as versões desatualizadas foram devidamente

  recolhidas e descartadas.

  5.3 Processo geral de aprovação e aceitação'
