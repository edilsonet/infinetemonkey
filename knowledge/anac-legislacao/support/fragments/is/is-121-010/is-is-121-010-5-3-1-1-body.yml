text: '5.3.1.1 Esta seção contém orientações sobre o processo de aprovação e aceitação do
  sistema de

  documentos de segurança operacional. Este processo é baseado no processo geral de

  certificação estabelecido na IS nº 119-001.

  Nota: durante o processo de certificação inicial de um operador, o processo de aprovação

  e aceitação do sistema de documentos de segurança operacional deve seguir a IS nº 119-

  001.'
