title: Processo de aceitação. O processo de aceitação de um manual, seção de manual ou lista
text: '5.3.1.2 Processo de aceitação. O processo de aceitação de um manual, seção de manual
  ou lista

  de verificação normalmente consiste das fases um, dois e três do processo geral. O

  operador sempre deve enviar à ANAC cópias atualizadas dos documentos que compõem

  o sistema para registro e vigilância. Todo o sistema de documentos de segurança

  operacional será avaliado durante a fase de análise detalhada de documentos (fase três)

  do processo de certificação inicial. Uma vez que o operador esteja certificado, ele pode

  revisar, distribuir e usar material aceito mesmo que a ANAC não tenha realizado uma

  avaliação. Se, depois de uma avaliação, a ANAC determinar que partes dos manuais ou

  listas de verificação são inaceitáveis, o operador deve revisar tais partes inaceitáveis
  nos

  prazos e condições estabelecidas.'
