title: Processo de aprovação. O processo de aprovação de um manual, programa ou lista de
text: '5.3.1.3 Processo de aprovação. O processo de aprovação de um manual, programa ou lista
  de

  verificação normalmente consiste das fases um, dois, três e cinco do processo geral. No

  entanto, pode ser necessária a inclusão da fase quatro (fase de demonstração) no processo

  de aprovação. Diferentemente do processo de aceitação, documentos aprovados somente

  podem ser alterados e colocados em prática pelo operador após receberem da ANAC uma

  notificação por escrito atestando a aprovação.'
