text: '5.3.1.4 Avaliação dos documentos para aceitação ou aprovação da ANAC. O operador pode

  desenvolver no seu sistema de documentos de segurança operacional qualquer política,

  método, procedimento ou lista de verificação que considere necessário para o tipo deData
  de emissão: 6 de julho de 2018 IS nº 121-010

  Revisão A

  operação realizada. No entanto, essas políticas, métodos, procedimentos e listas de

  verificação devem cumprir com os regulamentos e ser consistentes com práticas

  operacionais seguras. O papel da ANAC no processo é fornecer uma avaliação

  independente e objetiva do material do operador, considerando o cumprimento com a

  legislação em vigor, consistência com práticas operacionais seguras e embasamento em

  fundamentação sólida ou eficácia demonstrada.'
