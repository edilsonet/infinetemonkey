text: '5.3.1.5 Não-conformidades. Quando a ANAC encontrar uma “não-conformidade” no sistema
  de

  documentos de segurança operacional, o operador deverá tomar as ações apropriadas para

  resolver a discrepância. No entanto, caso a discrepância não seja resolvida, a ANAC

  poderá revogar formalmente a aprovação ou aceitação do manual, programa ou lista de

  verificação em questão.'
