title: A primeira fase do processo de aprovação ou aceitação começa com a comunicação entre
text: '5.3.2.1 A primeira fase do processo de aprovação ou aceitação começa com a comunicação
  entre

  a ANAC e o operador (um detentor de certificado atual ou um requerente de certificado).

  Esta fase não é obrigatória, sendo realizada usualmente em processos de aceitação ou

  aprovação de documentos relacionados a certificações complexas, ou quando considerada

  necessária pela ANAC ou pelo operador.'
