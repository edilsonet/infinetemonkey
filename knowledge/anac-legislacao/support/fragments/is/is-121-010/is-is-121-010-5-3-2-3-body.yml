title: O objetivo principal da fase um é determinar os requisitos básicos que o operador deve
text: '5.3.2.3 O objetivo principal da fase um é determinar os requisitos básicos que o operador
  deve

  atender para obter aceitação ou aprovação do sistema de documentos de segurança

  operacional. Para isso, devem ser avaliadas as seções apropriadas dos regulamentos,

  instruções suplementares ou instruções de avaiação civil aplicáveis, boletins operacionais

  da empresa, isenções aprovadas para o operador ou que ele esteja solicitando, as EO e

  quaisquer desvios aplicáveis aos assuntos que o operador deve abordar no sistema de

  documentos de segurança operacional. O operador deverá compreender claramente os

  tópicos e o nível de detalhe que deverão ser desenvolvidos no material a ser submetido

  durante a fase dois do processo. Durante a fase 1, as seguintes orientações serão

  comunicadas ao operador:'
