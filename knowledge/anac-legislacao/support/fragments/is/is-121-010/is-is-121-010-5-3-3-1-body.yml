title: A fase 2 consiste na realização pela ANAC de uma revisão preliminar (e não uma análise
text: '5.3.3.1 A fase 2 consiste na realização pela ANAC de uma revisão preliminar (e não
  uma análise

  detalhada) do material submetido pelo operador. Esta revisão preliminar destina-se a

  garantir que a solicitação do operador esteja clara e contenha toda as informações

  necessárias. A avaliação da fase 2 será realizada imediatamente após o recebimento da

  documentação do operador. Se, após a avaliação preliminar, a documentação parecer

  completa e de qualidade aceitável, ou se deficiências imediatamente levadas à atenção do

  operador forem rapidamente resolvidas, a fase 3, de análise detalhada, poderá começar.

  Se a documentação estiver incompleta ou obviamente não aprovável/não aceitável, a

  ANAC irá notificar o operador, com uma explicação das deficiências.'
