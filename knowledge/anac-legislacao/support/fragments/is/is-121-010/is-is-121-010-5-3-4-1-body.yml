title: A fase 3 é a análise detalhada da documentação submetida pelo operador. Durante esta
text: '5.3.4.1 A fase 3 é a análise detalhada da documentação submetida pelo operador. Durante
  esta

  fase, a ANAC irá analisar detalhadamente a documentação do operador para determinar

  se a solicitação está completa e tecnicamente correta. O tempo para completar a fase três

  depende do escopo e da complexidade da solicitação. Se parte da documentação

  procolada pelo operador requerer aprovação, a análise será normalmente realizada

  imediatamente após o término da fase 2. Por outro lado, se toda a documentação requerer

  apenas aceitação, a análise detalhada será geralmente realizada durante as inspeções e

  demais atividades de vigilância continuada da ANAC (neste caso, como explicado

  anteriormente, o operador poderá usar o material mesmo que a análise detalhada ainda

  não tenha sido concluída).'
