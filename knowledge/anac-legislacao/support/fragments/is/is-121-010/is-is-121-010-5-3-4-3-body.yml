text: '5.3.4.3 A ANAC irá considerar cuidadosamente a experiência e o histórico do operador
  ao avaliar

  procedimentos e listas de verificação. Quando o operador possuir um histórico de

  operações bem-sucedidas, a ANAC normalmente irá aprovar ou aceitar solicitações

  consistentes com os procedimentos existentes do operador. Por outro lado, quando oData de
  emissão: 6 de julho de 2018 IS nº 121-010

  Revisão A

  operador tiver um histórico relevante de incidentes e deficiências, a ANAC irá analisar

  cuidadosamente as políticas e premissas básicas do operador na confecção do sistema de

  documentos de segurança operacional.'
