title: Em certas circunstâncias, inspeções e demonstrações com acompanhamento da ANAC
text: '5.3.5.1 Em certas circunstâncias, inspeções e demonstrações com acompanhamento da ANAC

  precisarão ser realizados após a fase 3, de análise detalhada da documentação (exemplo:

  aprovação de um novo currículo do programa de treinamento operacional). Já em outras,

  especialmente para pequenas revisões ou procedimentos mais simples, as inspeções e

  demonstrações não serão ou podem não ser necessárias.'
