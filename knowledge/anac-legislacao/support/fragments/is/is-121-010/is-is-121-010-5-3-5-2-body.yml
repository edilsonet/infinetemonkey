title: Independentemente da necessidade ou não de acompanhamento in loco da ANAC, os
text: '5.3.5.2 Independentemente da necessidade ou não de acompanhamento in loco da ANAC,
  os

  operadores devem possuir um processo interno de validação para elaboração do sistema

  de documentos de segurança operacional, conforme item 5.2.2 desta IS. Essa validação

  deve ser realizada antes de o operador submeter a proposta com os procedimentos para

  aprovação ou aceitação da ANAC.'
