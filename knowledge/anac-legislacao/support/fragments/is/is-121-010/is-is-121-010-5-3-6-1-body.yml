title: A fase 5 consiste da aprovação da ANAC para documentos, manuais, seções de manuais
text: '5.3.6.1 A fase 5 consiste da aprovação da ANAC para documentos, manuais, seções de
  manuais

  e listas de verificação que compõem o sistema de documentos de segurança operacional.

  Nesta fase, a ANAC irá formalmente notificar o operador da aprovação. Para documentos

  que não requerem aprovação da ANAC, mas apenas aceitação, a notificação por escrito

  pode não ser requerida. Os normativos específicos que tratam da elaboração de cada

  documento que compõe o sistema de documentos de segurança operacional irão detalhar

  o procedimento de aprovação ou aceitação.'
