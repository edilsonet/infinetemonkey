text: '5.3.6.3 Notificação de desaprovação. As atividades de coordenação, revisão e edição
  que

  ocorrem em todas as fases do processo normalmente resultam em documentos aprovados.

  No entanto, em certas circunstâncias o processo poderá ser encerrado pela ANAC. Por

  exemplo, caso o operador não tome qualquer ação sobre não-conformidades do material

  dentro do prazo estabelecido, o processo poderá ser encerrado compulsoriamente. Ou

  caso o operador não resolva uma mesma não-conformidade após três notificações, a

  solicitação também poderá ser indeferida e o processo encerrado. Nesses casos, a ANAC

  irá notificar o operador com as razões para a negação da aprovação.'
