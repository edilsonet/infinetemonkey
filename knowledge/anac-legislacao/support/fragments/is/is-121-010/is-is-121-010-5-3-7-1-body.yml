text: '5.3.7.1 Quando qualquer parte do sistema de documentos de segurança operacional que
  está em

  uso pelo operador for considerada deficiente, a ANAC irá notificar o operador e solicitar

  ações para resolver a deficiência. As deficiências podem ser notificadas por meio de

  ofício ou de um formulário FOP 124 (previsto na IS nº 119-001).'
