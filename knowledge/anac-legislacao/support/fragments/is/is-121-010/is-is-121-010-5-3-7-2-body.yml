text: '5.3.7.2 Deficiência envolvendo material aprovado. Se a deficiência envolver material
  já

  aprovado pela ANAC, a notificação indicará claramente que a aprovação da ANAC será

  revogada a partir de uma data específica se não forem tomadas medidas corretivas. AData
  de emissão: 6 de julho de 2018 IS nº 121-010

  Revisão A

  notifcação também irá comunicar o operador que o material requer nova aprovação da

  ANAC e que, após a data especificada, quaisquer operações sem essa aprovação violarão

  a legislação e os regulamentos aplicáveis.'
