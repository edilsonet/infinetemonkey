title: Deficiência envolvendo material aceito. Se a deficiência envolver material desenvolvido
text: '5.3.7.3 Deficiência envolvendo material aceito. Se a deficiência envolver material
  desenvolvido

  pelo operador que seja aceito pela ANAC, a notificação indicará claramente que o

  material que está deficiente e as razões para tal. Se, após essa notificação, o operador
  não

  tomar as medidas corretivas adequadas, a ANAC poderá adotar as providências

  administrativas previstas na legislação, como por exemplo a alteração de ofício das EO

  para revogar as autorizações afetadas pela deficiência.

  5.4 Disposições que requerem aprovação'
