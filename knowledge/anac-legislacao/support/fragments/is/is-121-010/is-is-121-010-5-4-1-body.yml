title: As disposições que requerem prévia aprovação da ANAC antes que quaisquer revisões
text: '5.4.1 As disposições que requerem prévia aprovação da ANAC antes que quaisquer revisões

  ou alterações sejam colocadas em vigor pelos operadores estão indicadas nos

  RBAC/RBHA 91, 119 e 121 (sempre que aparecem os termos “aprovar”, “aprovado” ou

  “aprovação”) ou nos normativos específicos que tratam da elaboração dos diversos

  manuais, programas e listas de verificação que compõem o sistema de documentos de

  segurança operacional.

  5.5 Sistema de manuais de operações e de manutenção'
