title: O Anexo 6, Parte I à Convenção de Chicago requer que os operadores forneçam um
text: '5.5.1 O Anexo 6, Parte I à Convenção de Chicago requer que os operadores forneçam um

  sistema de manuais de operações (operations manual) para uso e orientação do pessoal

  de operações; assim como sistema de manuais de manutenção (maintenance control

  manual) para uso e orientação do pessoal de manutenção e de operações. Como parte do

  sistema de documentos de segurança operacional (flight safety documents system), os

  manuais de operações e de manutenção devem ser continuamente revisados e emendados,

  como apropriado, para garantir que as informações lá disponíveis estejam atualizadas.

  Tais revisões ou emendas devem ser emitidas para todo o pessoal cujas atividades

  requeiram o uso dos manuais.'
