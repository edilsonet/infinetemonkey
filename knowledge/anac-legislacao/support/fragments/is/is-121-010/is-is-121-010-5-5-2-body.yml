title: Uma cópia do sistema de manuais de operações e de manutenção, bem como de quaisquer
text: '5.5.2 Uma cópia do sistema de manuais de operações e de manutenção, bem como de quaisquer

  revisões ou emendas subsequentes, devem sempre ser enviadas à ANAC para avaliação,

  aceitação e, quando requerido, aprovação. O operador deve incorporar no seu sistema de

  manuais de operações e de manutenção todo o conteúdo mandatório estabelecido nos

  regulamentos e demais normativos específicos que tratam da elaboração de tais manuais.'
