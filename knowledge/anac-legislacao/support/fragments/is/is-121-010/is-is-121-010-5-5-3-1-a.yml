title: 5.5.3.1(a)
text: 'a) Manual Geral de Operações (MGO), que pode ser apresentado em um ou mais

  volumes, conforme descrito em IAC ou IS específica;

  Nota: manuais como manual de aeroportos (MAED), manual do despachante operacional de

  voo (MDOV), manual de peso e balanceamento são considerados volumes

  complementares ao MGO.'
