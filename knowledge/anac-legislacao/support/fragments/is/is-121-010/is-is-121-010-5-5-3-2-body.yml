text: '5.5.3.2 Dependendo do tamanho e complexidade do operador, os manuais listados acima
  podem

  ser organizados em diferentes volumes. Por exemplo, o Manual Geral de Operações pode

  desdobrado em um manual de aeroportos, manual de peso e balanceamento, manual do

  despachante operacional de voo, etc.'
