section_title: 'O sistema de manuais de manutenção deve conter as seguintes informações:'
subsection_id: a
cite: 5.5.4.2(a)
title: 5.5.4.2(a)
text: 'a) uma descrição dos procedimentos para garantir que cada avião é mantido em

  condição aeronavegável, que os equipamentos operacionais e de emergência

  necessários para o voo pretendido estão funcionando e que o certificado de

  aeroanvegabilidade de cada avião permanece válido, incluindo:

  I. uma descrição dos acordos administrativos entre o operador e as organizações

  de manutenção aprovadas; e

  II. uma descrição dos procedimentos de manutenção e dos procedimentos para

  completar e assinar uma liberação de manutenção quanto a manutenção é

  baseada em um sistema que não é de uma organização de manutenção aprovada;'
