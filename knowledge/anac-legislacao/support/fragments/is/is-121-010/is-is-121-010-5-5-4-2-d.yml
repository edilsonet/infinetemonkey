title: 5.5.4.2(d)
text: 'd) uma descrição dos métodos utilizados para completar e armazenar os registros de

  manutenção do operador, incluindo:

  I. tempo total em serviço (horas, tempo civil e ciclos, como apropriado) do avião

  e de todos os componentes de vida útil limitada;

  II. situação atual de cumprimento com todas as informações mandatórias de

  aeronavegabilidade continuada;

  III. detalhes apropriados das alterações e reparos;

  IV. tempo em serviçoo (horas, tempo civil e ciclos, como apropriado) desde a últimaData
  de emissão: 6 de julho de 2018 IS nº 121-010

  Revisão A

  revisão geral do avião ou dos seus componentes sujeitos a um limite de vida útil

  após revisão;

  V. situação atual de cada avião com relação ao cumprimento do programa de

  manutenção; e

  VI. os registros de manutenção detalhados que mostrem que todos os requistos de

  assinatura da liberação de manutenção foram cumpridos;'
