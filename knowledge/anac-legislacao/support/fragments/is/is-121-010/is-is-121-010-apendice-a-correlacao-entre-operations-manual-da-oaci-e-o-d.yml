text: 'd) Parte D - Treinamento. Composta por todos os aspectos relacionados ao treinamento
  do

  pessoal requerido para operação segura das aeronaves.

  A.2 A correlação entre a estrutura do operations manual da OACI e o sistema de manuais de

  operações está identificada na tabela abaixo:

  Operations manual da OACI Estrutura correspondente no sistema de manuais de

  operações onde os assuntos devem ser desenvolvidos

  Parte A - Generalidades Manual geral de operações

  Manual de artigos perigosos

  Manual de gerenciamento da segurança operacional

  Programa de análise e acompanhamento de dados de voo

  Nota: manuais comumente desenvolvidos pelos operadores

  que complementam informações do manual geral de

  operações são:

  Manual de aeroportos

  Manual do despachante operacional de voo

  Manual de peso e balanceamento

  Programa de degelo e antigelo no solo

  Parte B - Informações sobre a

  operação das aeronaves

  Manual de operações da aeronave

  Manual de comissários de voo

  Lista de equipamentos mínimos

  Lista de desvios de configurações

  Nota: os procedimentos operacionais padrozinados (SOP),

  listas de verificação, guias de referência rápida e análises de

  pistas fazem parte do escopo do manual de operações da

  aeronave.

  Parte C - Áreas, rotas e aeródromos Guia de rotas

  Parte D - Treinamento Programa de treinamento operacional

  Manual e programa de CRM'
