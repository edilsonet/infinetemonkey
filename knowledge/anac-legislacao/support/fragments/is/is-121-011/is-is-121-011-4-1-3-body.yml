text: '4.1.3 carga horária: tempo necessário para se ministrar um segmento de currículo ou
  módulo de treinamento;

  4.1.4 detentor de certificado: operador de serviço de transporte aéreo que tenha recebido
  um certificado emitido de acordo com o RBAC nº 119. Nesta IS, abrange também o solicitante
  de um certificado a ser emitido de acordo com o RBAC nº 119. Também é denominado “operador”
  ou “empresa”;'
