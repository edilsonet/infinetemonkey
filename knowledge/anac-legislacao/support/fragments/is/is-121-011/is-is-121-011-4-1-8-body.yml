text: '4.1.8 segmento de qualificação: parte do treinamento composta pelos exames e verificações
  requeridos.

  4.2 Lista de abreviaturas:

  APU - Auxiliary power unit (unidade auxiliar de energia)

  AVSEC - Aviation security (segurança contra atos de interferência ilícita)

  CBT - Computer based training (treinamento baseado em computador)

  CENIPA - Centro de Investigação e Prevenção de Acidentes Aeronáuticos

  CPR - Cardiopulmonary resuscitation (ressuscitação cardiopulmonar)

  CRM - Crew resource management (gerenciamento de recursos de tripulação)

  ELT - Emergency localizer transmitter (transmissor localizador de emergência)

  FAC - Ficha de avaliação de comissário de voo

  GRF - Gerenciamento do risco à fadiga

  FCD - Fligh Crew Data (dados relevantes à operação para pilotos)

  ICAO - International Civil Aviation Organization (Organização da Aviação Civil Internacional)

  IATA - International Air Transport Association (Associação Internacional de Transporte Aéreo)

  MCmsV - Manual de comissários de voo

  MDR - Master difference requirements (requisitos de diferença master)

  MGO - Manual geral de operações

  ODR - Operator difference requirements (requisitos de diferença do operador)

  PA - Passenger address (sistema sonoro de aviso aos passageiros)

  PBE - Protective breathing equipment (equipamento protetor de respiração)

  PNAE - Passageiro(s) com necessidade de assistência especial

  PSU - Passenger service unit (unidade de serviço do passageiro)

  PPSP - Programa de Prevenção do Risco Associado ao Uso Indevido de Substâncias Psicoativas

  UTC - Coordinated Universal Time (Tempo Universal Coordenado)

  VIP - Very Important Person (pessoa muito importante)'
