text: '5.1.3 Esta IS não se aplica à elaboração de um programa de qualificação avançada (AQP),
  tratado na subparte Y do RBAC nº 121.

  5.1.4 É de responsabilidade do operador manter um programa de treinamento completo, atualizado
  e em conformidade com a legislação em vigor. O operador deverá revisar seu programa de treinamento
  sempre que adquirir um novo modelo/tipo de aeronave, introduzir um novo tipo de operação
  que implique em mudança de procedimentos já estabelecidos em seus manuais ou por ocasião
  de novos requisitos regulamentares aprovados pela ANAC.

  5.2 Introdução

  5.2.1 Existem cinco categorias de treinamento aplicáveis ao programa de treinamento de comissários
  de voo: inicial de nova contratação, inicial de equipamento, transição, periódico e requalificação.'
