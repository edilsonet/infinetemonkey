title: Avaliação das diferenças
text: '5.10.5 Avaliação das diferenças

  5.10.5.1 Os dados relevantes operacionais para comissários disponibilizados pela ANAC contêm
  MDR para as variantes envolvidas. Quando dados relevantes operacionais para comissários
  são disponibilizados pela ANAC e contêm MDR para as variantes envolvidas, o treinamento
  de diferenças proposto pelo operador deve cumprir os requisitos deste documento. Os operadores
  devem usar tabelas de Requisitos de Diferença do Operador (ODR) para mostrar como o programa
  aborda diferenças por meio de descrições dos métodos de treinamento e exames para cada variante.
  As tabelas ODR fornecem um meio uniforme para os operadores gerenciarem de forma abrangente
  o treinamento de diferenças e fornecem uma base para a aprovação da ANAC. Os ODR devem cumprir
  e ser tão ou mais restritivos do que os MDR e outras recomendações do documento.

  5.10.5.2 Os dados relevantes operacionais para comissários disponibilizados pela ANAC não
  existem ou não contêm MDR para as variantes envolvidas. Recomenda-se que o operador que
  pretende propor treinamento de diferenças para o qual dados relevantes operacionais para
  comissários não foram disponibilizados pela ANAC ou não contêm MDR para as variantes envolvidas
  tenha como referência os documentos análogos emitidos pela EASA (CS-CCD). A análise pode
  assumir qualquer forma, desde que identifique com precisão todas as diferenças de projeto
  que afetem as características do voo, as habilidades e/ou procedimentos dos tripulantes.'
