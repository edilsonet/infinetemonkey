title: Exames e treinamento de diferenças periódicos
text: '5.10.6 Exames e treinamento de diferenças periódicos

  5.10.6.1 Quando os operadores designam os tripulantes em múltiplas variantes de uma aeronave,
  algumas formas de treinamento de diferenças devem ser incluídas no currículo de treinamento
  periódico. A quantidade e tipo necessário de treinamento e exame dependem do grau de diferenças
  envolvidas e das circunstâncias do operador.

  5.11 Currículo de treinamento de requalificação'
