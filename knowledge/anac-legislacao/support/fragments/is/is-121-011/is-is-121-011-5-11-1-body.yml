text: '5.11.1 Generalidades

  5.11.1.1 Esta seção contém informações, diretrizes e orientações a serem usadas pelos operadores
  para elaboração e aprovação dos currículos de treinamento de requalificação. Nesta seção,
  uma definição formal de treinamento de requalificação é fornecida. Uma vez que tripulantes
  qualificados para operações comerciais segundo o RBAC nº 121 às vezes perdem sua qualificação,
  é útil para os operadores ter uma definição de treinamento de requalificação, incluindo
  seus motivos e objetivos.

  5.11.1.2 Definição. Para os propósitos desta IS, o treinamento de requalificação é definido
  como aquela categoria de treinamento conduzida especificamente para restabelecer o status
  de qualificação de um comissário previamente qualificado. O currículo de treinamento de
  requalificação do operador deve conter a função a bordo específica e o tipo de aeronave
  para as operações aplicáveis. Para ser elegível para treinamento em um currículo de requalificação,
  um comissário deve ter sido previamente qualificado nesse tipo de aeronave e, posteriormente,
  perdido essa qualificação.

  5.11.1.3 Motivos para os comissários perderem a qualificação. Um comissário pode ser simultaneamente
  qualificado em uma aeronave e não qualificado em outra. Um comissário pode perder o estado
  de qualificação e se tornar "não qualificado" por qualquer das seguintes razões:'
