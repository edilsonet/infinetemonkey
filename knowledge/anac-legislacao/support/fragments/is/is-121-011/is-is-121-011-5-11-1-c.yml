text: 'c) reprovação em um exame.

  5.11.1.4 Objetivos do treinamento de requalificação. Os comissários atingem os objetivos
  de treinamento de requalificação ao completar uma combinação dos segmentos de currículo
  de solo e qualificação, conforme aplicável. Os segmentos de currículo de treinamento e qualificação
  necessários para a requalificação de um tripulante são determinados pelos motivos e pela
  duração da perda de qualificação. A requalificação de um tripulante após a perda de experiência
  recente pode ser tão simples quanto a realização dos eventos cujos prazos foram perdidos.
  No entanto, a requalificação pode ser tão complexa quanto o tripulante ter que realizar
  os eventos da categoria de treinamento inicial de equipamento, quando ele perdeu sua qualificação
  por um longo período de tempo. O treinamento corretivo após a perda de qualificação deve
  ser adaptado ao caso específico.'
