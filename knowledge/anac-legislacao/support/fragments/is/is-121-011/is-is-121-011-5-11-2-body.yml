title: Restabelecimento da experiência recente
text: '5.11.2 Restabelecimento da experiência recente

  5.11.2.1 O parágrafo 121.439(a) do RBAC nº 121 exige que cada comissário operando segundo
  o RBAC nº 121 tenha realizado, dentro dos 12 meses calendáricos precedentes à operação,
  pelo menos 10 ciclos (pouso e decolagem) em cada tipo de avião em que trabalha. O comissário
  que falha em cumprir esse requisito não está qualificado para operar segundo o RBAC nº 121.
  Para recuperar a qualificação, o comissário, além de estar em dia com todos os treinamentos
  e exames requeridos pelo RBAC nº 121, deverá realizar 4 ciclos (pouso e decolagem) no tipo
  de avião sob supervisão de um instrutor, examinador credenciado ou servidor designado da
  ANAC. Deve se avaliar a necessidade de realização do segmento de currículo de solo, caso
  este já não esteja mais válido.'
