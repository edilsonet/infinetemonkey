text: '5.11.3 Requalificação por falha em completar o treinamento periódico dentro do período
  de elegibilidade

  5.11.3.1 Um segmento de currículo de requalificação é exigido quando um comissário não conseguir
  completar o treinamento periódico durante um período de elegibilidade pré- estabelecido.
  A quantidade mínima de treinamento requerida em cada segmento de currículo é determinada
  pelo período em que o tripulante de voo estiver não qualificado. Os comissários devem ser
  treinados até atingirem a proficiência e completar um módulo de qualificação antes de retornarem
  às operações comerciais. As ementas do currículo de requalificação devem especificar os
  eventos e carga horária mínimos. O RBAC nº 121 permite que os comissários sejam treinados
  até atingirem o nível requerido de proficiência. Em casos particulares, podem ser necessárias
  mais horas de treinamento com relação ao previsto na ementa do currículo. A tabela abaixo
  contém os critérios básicos de requalificação para os comissários que excederam os respectivos
  períodos de elegibilidade dos treinamentos ou exames necessários.

  Tabela 4 - Critérios básicos de requalificação para comissários que excederam os períodos
  de elegibilidade

  Tempo decorrido desde o mês de vencimento

  Segmento de solo

  Segmento de qualificação

