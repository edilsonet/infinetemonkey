title: Requalificação de comissários que reprovaram em um exame
text: '5.11.4 Requalificação de comissários que reprovaram em um exame

  5.11.4.1 Um comissário que reprovar em um exame requerido deve ser inserido no treinamento
  de requalificação. O segmento do treinamento de requalificação deve consistir, pelo menos,
  do treinamento periódico necessário para restaurar a competência do tripulante nos eventos
  malsucedidos. O treinamento pode consistir apenas em um esclarecimento detalhado, ou pode
  ser bastante extenso. Treinamento adicional deve ser dado para fortalecer o desempenho geral
  do comissário. Os motivos para a perda de qualificação e o treinamento fornecido devem ser
  inseridos nos registros do tripulante.

  5.11.4.2 Certificação da proficiência do tripulante. O instrutor ou examinador credenciado
  conduzindo esse treinamento devem certificar a proficiência do tripulante antes que ele
  refaça o exame. Esta certificação não se limita aos eventos em que o tripulante falhou,
  mas engloba todos os eventos do módulo de qualificação.

  5.11.4.3 Notificação para ANAC. O operador deve notificar a gerência da ANAC responsável
  pela supervisão de suas operações sobre todas as reprovações em exames. A notificação deve
  ser oportuna, de modo que a ANAC possa providenciar um servidor para realizar ou observar
  o módulo de qualificação quando, no seu julgamento, essa ação for necessária. Os operadores
  podem realizar quanto treinamento de requalificação for necessário antes de agendar e realizar
  um novo módulo de qualificação.

  5.12 Instrutores e examinadores credenciados'
