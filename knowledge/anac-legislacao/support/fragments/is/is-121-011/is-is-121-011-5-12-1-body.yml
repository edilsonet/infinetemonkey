title: Generalidades
text: '5.12.1 Generalidades

  5.12.1.1 Esta seção contém orientações sobre os instrutores e examinadores credenciados
  dos programas de treinamento de comissários de voo do RBAC nº 121, incluindo as funções
  e propósitos desses profissionais, bem como requisitos regulamentares, qualificações e responsabilidades
  funcionais.

  5.12.1.2 As orientações desta seção não se aplicam aos segmentos de currículo que possuem
  requisitos específicos para a qualificação de instrutores (exemplos: AVSEC, artigos perigosos).
  Neste caso, aplicam-se as disposições dos normativos específicos que tratam de cada um dos
  assuntos.'
