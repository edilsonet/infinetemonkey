section_title: 'Os requisitos de qualificação e treinamento de instrutores e examinadores
  credenciados de comissários de voo segundo o RBAC nº 121 são:'
subsection_id: b
cite: 5.12.2.1(b)
title: 5.12.2.1(b)
text: b) o parágrafo 121.401(a)(4) do RBAC nº 121 estabelece que os operadores devem prover
  número suficiente de instrutores e examinadores credenciados comissários de voo qualificados
  para conduzir os treinamentos e exames requeridos pelo RBAC nº 121;
