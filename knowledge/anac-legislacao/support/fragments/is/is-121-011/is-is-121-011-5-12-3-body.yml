title: Definições
text: '5.12.3 Definições

  5.12.3.1 Examinador credenciado comissário. Um examinador credenciado comissário é um tripulante
  aprovado pela ANAC que possui conhecimento, treinamento e experiência adequados e demonstrada
  capacidade para avaliar e certificar os conhecimentos e habilidades de outros comissários.

  5.12.3.2 Instrutor comissário. Um instrutor comissário é uma pessoa selecionada e qualificada
  por um operador sob o RBAC nº 121 que possui o conhecimento, treinamento e experiência adequados
  e demonstrada capacidade para treinar comissários nos segmentos de currículo do programa
  de treinamento aprovado do operador.'
