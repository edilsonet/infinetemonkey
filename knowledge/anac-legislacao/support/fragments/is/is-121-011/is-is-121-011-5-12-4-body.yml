title: Função e características dos examinadores credenciados
text: '5.12.4 Função e características dos examinadores credenciados

  5.12.4.1 A função dos examinadores credenciados é garantir que os comissários tenham atingido
  os padrões de competência antes que sejam liberados do treinamento, bem como garantir que
  os comissários mantenham esses padrões durante as operações de linha. Treinamento e uso
  efetivo dos examinadores credenciados pelos operadores deve garantir que os comissários
  estejam padronizados no desempenho de seu trabalho. Os examinadores credenciados devem estar
  bem informados sobre os requisitos aplicáveis dos RBAC e outras políticas aplicáveis da
  ANAC, sobre práticas operacionais seguras e sobre as políticas e procedimentos do operador.
  Os examinadores credenciados devem atingir e manter registros positivos como comissários.
  Uma vez aprovados, a conduta e o profissionalismo dos examinadores credenciados devem sempre
  refletir positivamente sobre o operador e a ANAC.

  5.12.4.2 Diretrizes e orientações sobre seleção e elegibilidade dos candidatos a examinador,
  bem como sobre o processo de credenciamento, recredenciamento e descredenciamento dos examinadores
  estão estabelecidos na IS nº 121-002.'
