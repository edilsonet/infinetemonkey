section_id: 5.12.6.2
section_title: 'Atividades autorizadas. Um instrutor de solo, quando qualificado e autorizado
  pelo titular do certificado, pode conduzir o seguinte:'
subsection_id: b
cite: 5.12.6.2(b)
title: 5.12.6.2(b)
text: 'b) certificação da proficiência e conhecimentos satisfatórios dos comissários após
  a conclusão de um segmento de currículo ou módulo de treinamento no solo.

  5.12.6.3 Registros de treinamento e qualificação. O operador deve manter a documentação
  do treinamento e qualificação de cada instrutor de solo e deve disponibilizar essa documentação
  para inspeção da ANAC sempre que solicitado.'
