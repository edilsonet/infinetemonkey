section_title: 'Atividades autorizadas. Um instrutor de rota, quando qualificado e autorizado
  pelo operador, pode realizar o seguinte:'
subsection_id: b
cite: 5.12.7.2(b)
title: 5.12.7.2(b)
text: 'b) certificação da proficiência e conhecimentos satisfatórios dos comissários após
  a conclusão da experiência de operação.

  5.12.7.3 Registros de treinamento e qualificação. O operador deve manter a documentação
  do treinamento e qualificação de cada instrutor de rota e deve disponibilizar essa documentação
  para inspeção da ANAC sempre que solicitado.'
