title: Instrutor de rota
text: '5.12.7 Instrutor de rota

  5.12.7.1 Treinamento e qualificação. Os operadores do RBAC nº 121 envolvidos em operações
  de transporte de passageiros devem estabelecer e manter um programa para treinar e qualificar
  os instrutores de rota. Um indivíduo deve completar com sucesso o currículo de treinamento
  apropriado e o exame de competência necessário para se qualificar como um instrutor de rota.
  Para manter a qualificação, os instrutores de rota devem concluir com êxito o treinamento
  periódico, incluindo exames de competência. Adicionalmente, devem, a cada 24 meses, conduzir
  satisfatoriamente instrução sob observação de um servidor designado da ANAC ou um examinador
  credenciado do operador.'
