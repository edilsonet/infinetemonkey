kind: is
document: is-121-011
family: '121'
section_id: 5.2.2
section_title: 'Para composição dos currículos de treinamento associados a essas categorias
  de treinamento, os seguintes segmentos de currículo se aplicam:'
subsection_id: l
cite: 5.2.2(l)
title: 5.2.2(l)
text: 'l) Segmento de currículo GRF - RBAC nº 117.61 (conforme aplicável).

  5.2.3 Esta IS fornece diretrizes e orientações para desenvolvimento e aplicação dos segmentos
  de currículo listados nos parágrafos a) até f) do parágrafo 5.2.2.

  5.2.4 Orientações sobre os segmentos de currículo listados nos parágrafos g) até l) do parágrafo
  5.2.2 estão estabelecidas em outros normativos específicos publicados pela ANAC.

  5.2.5 Esta IS ainda estabelece orientações sobre qualificações de instrutores e examinadores
  credenciados designados para atuar em um programa de treinamento de comissários.

  5.3 Requisitos para completar um segmento de currículo

  5.3.1 A conclusão de um segmento de currículo deve estar documentada por uma certificação
  do instrutor, que garanta que o tripulante concluiu o treinamento com êxito, conforme o
  parágrafo 121.401(f) do RBAC nº 121. Esta certificação geralmente está baseada nos resultados
  de provas escritas aplicadas ao final do curso. Em alguns métodos de treinamento, a certificação
  pode estar baseada em avaliações de progresso do tripulante feitas durante o treinamento.'
