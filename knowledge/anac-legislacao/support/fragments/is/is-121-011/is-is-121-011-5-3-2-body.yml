text: '5.3.2 Cabe ao operador descrever, em seu programa de treinamento, o método de avaliação
  utilizado.

  5.4 Quantidade de alunos por instrutor

  5.4.1 Recomenda-se que o operador estabeleça um limite adequado de alunos por instrutor
  em seu programa de treinamento, de forma que seja possível ao instrutor acompanhar o progresso
  de cada aluno durante a instrução.'
