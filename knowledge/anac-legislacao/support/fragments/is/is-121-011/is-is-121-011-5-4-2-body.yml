text: '5.4.2 Essa proporção deve considerar o método de treinamento aplicado como, por exemplo,
  CBT, aula expositiva, dinâmicas ou aulas práticas.

  5.4.3 Como regra geral, a ANAC recomenda um máximo de 20 alunos para um instrutor no caso
  de aulas teóricas, e de 10 alunos para um instrutor no caso dos exercícios de emergência
  práticos ou nas visitas de familiarização à aeronave.

  5.5 Segmento de currículo de doutrinamento básico'
