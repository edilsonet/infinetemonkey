family: '121'
section_id: 5.5.1.4
section_title: 'O parágrafo 121.415(a)(1), do RBAC nº 121, requer que o segmento de currículo
  de doutrinamento básico inclua treinamento sobre os seguintes assuntos:'
subsection_id: d
cite: 5.5.1.4(d)
title: 5.5.1.4(d)
text: 'd) noções básicas sobre aviões, teoria do voo e atmosfera.

  5.5.1.5 Em adição aos assuntos listados no parágrafo anterior, convém que os operadores
  incluam outros no segmento de currículo de doutrinamento básico. Existem informações que
  os tripulantes recém-contratados devem conhecer antes de serem designados para o serviço
  que não se encaixam nos segmentos de currículo de emergências gerais ou de solo da aeronave.
  Tais assuntos devem ser inseridos no segmento de currículo de doutrinamento básico, mas
  não podem ser creditados dentro das 40 horas requeridas pelo RBAC nº 121.'
