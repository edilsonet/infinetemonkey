text: '5.5.1 Generalidades

  5.5.1.1 O parágrafo 121.415(a), do RBAC nº 121, requer que todos os comissários de voo recém-contratados
  completem o segmento de currículo de doutrinamento básico na categoria de treinamento inicial
  de nova contratação.

  5.5.1.2 O segmento de currículo de doutrinamento básico é único para a categoria de treinamento
  inicial de nova contratação. Este treinamento serve para o tripulante recém-contratado como
  uma introdução ao operador e aos requisitos operacionais do RBAC nº 121, e também como base
  para o treinamento subsequente do comissário de voo nos demais segmentos de currículo.

  5.5.1.3 O parágrafo 121.415(a)(1), do RBAC nº 121, requer que os comissários recém-contratados
  completem 40 horas de treinamento de doutrinamento básico, a menos que a ANAC autorize uma
  redução das horas programadas, de acordo com a seção 121.405 do RBAC nº 121. Um exemplo
  seria uma situação de fusão ou de aquisição, em que os tripulantes que trabalhavam na empresa
  que foi comprada ou absorvida realizariam somente os módulos do doutrinamento básico do
  operador. Outro exemplo seria um operador que estabelece como pré-requisito de admissão
  somente tripulantes com experiência prévia em operações sob o RBAC nº 121.'
