section_title: 'Os módulos do segmento de currículo de doutrinamento básico para os comissários
  de voo podem ser agrupados em duas áreas de treinamento:'
subsection_id: b
cite: 5.5.2.1(b)
title: 5.5.2.1(b)
text: 'b) Doutrinamento básico aeronáutico: inclui treinamento sobre deveres e responsabilidades
  do comissário; sobre todos os requisitos regulamentares pertinentes aos comissários, como
  por exemplo o requisito que estabelece que os tripulantes devem ter acesso aos manuais a
  bordo da aeronave (seção 121.137 do RBAC nº 121); e informações gerais sobre os aviões e
  aeronáutica que os comissários precisam conhecer no desempenho de suas funções.'
