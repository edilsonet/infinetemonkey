title: 5.5.3.3(a)
text: a) os módulos do doutrinamento básico para tripulantes com experiência significativa
  em operações sob o RBAC nº 121 podem ser menos extensos do que aqueles ministrados a tripulantes
  sem essa experiência. Normalmente esse é o caso para operadores que contratam apenas tripulantes
  com experiência prévia em operações sob o RBAC nº 121;
