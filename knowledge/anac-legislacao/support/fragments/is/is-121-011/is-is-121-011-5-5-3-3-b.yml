text: b) os módulos de treinamento requeridos pelo RBAC nº 121 para o doutrinamento básico
  devem ser incluídos na ementa do segmento de currículo e computados dentro da carga horária
  regulamentar deste segmento. A sequência do treinamento real, no entanto, pode ser determinada
  pelo operador; e
