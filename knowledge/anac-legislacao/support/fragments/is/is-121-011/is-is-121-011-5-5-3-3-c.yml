id: is-is-121-011-5-5-3-3-c
kind: is
document: is-121-011
family: '121'
section_id: 5.5.3.3
section_title: 'O operador possui certa flexibilidade na organização dos módulos de treinamento
  do doutrinamento básico, como segue:'
subsection_id: c
cite: 5.5.3.3(c)
title: 5.5.3.3(c)
text: c) o operador pode optar, para fins de aprovação, por inserir um módulo de treinamento
  em mais de um segmento de currículo, desde que tal módulo de treinamento esteja inserido
  pelo menos no segmento de currículo designado nesta IS. Por exemplo, o módulo de treinamento
  sobre primeiros socorros requerido pela seção 121.805, do RBAC nº 121, deve ser inserido
  no segmento de currículo de emergências gerais; no entanto, por opção do operador, este
  módulo também pode ser coberto no segmento de currículo de doutrinamento básico, desde que
  não seja considerado para cômputo da carga horária mínima requerida de 40 horas.
