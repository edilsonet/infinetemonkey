title: Módulos de treinamento do segmento de currículo de doutrinamento básico
text: '5.5.3 Módulos de treinamento do segmento de currículo de doutrinamento básico

  5.5.3.1 O segmento de currículo de doutrinamento básico para comissários deve incluir quantos
  módulos forem necessários para garantir um treinamento adequado. Cada ementa de módulo de
  treinamento deve fornecer, pelo menos, um título descritivo do módulo e a lista dos eventos
  ou elementos que deverão ser apresentados durante a instrução.

  5.5.3.2 Os módulos de treinamento devem conter eventos ou elementos suficientes para garantir
  que o tripulante receba treinamento adequado nas áreas de doutrinamento básico do operador
  e doutrinamento básico aeronáutico. Para a aprovação inicial, não é necessário incluir descrições
  detalhadas de cada evento ou elemento dentro da ementa do módulo de treinamento. Essas descrições
  detalhadas são mais apropriadas quando incluídas no material didático do operador. Durante
  o processo de aprovação, a ANAC avaliará o material didático para garantir que o alcance
  e a profundidade dos módulos de treinamento sejam adequados.'
