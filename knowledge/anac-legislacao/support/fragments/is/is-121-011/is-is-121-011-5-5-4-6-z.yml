title: 5.5.4.6(z)
text: 'z) Procedimentos pré-voo; e

  aa) Políticas e procedimentos que disciplinem a interação com passageiros, incluindo:

  I. recusar o embarque de determinados passageiros;

  II. passageiros armados;

  III. transporte de presos e da respectiva escolta;

  IV. pessoas não autorizadas a bordo;

  V. passageiros apreensivos;

  VI. procedimentos para servir bebidas alcoólicas, bem como identificar e lidar com passageiros
  alcoolizados;

  VII. passageiros inconvenientes, tais como aqueles que aparentem estar mentalmente perturbados,
  violentos, ofensivos ou agressivos em relação a outros passageiros ou tripulantes, fumando
  ou realizando outros comportamentos não autorizados a bordo, etc.

  VIII. passageiros que transportam oxigênio para uso medicinal a bordo;

  IX. passageiros doentes ou feridos a bordo; e

  X. PNAE.'
