text: '5.5.4 Conteúdo dos módulos da área de doutrinamento básico do operador

  5.5.4.1 A área de doutrinamento básico do operador tem por objetivo instruir o comissário
  sobre as políticas e procedimentos do operador, os métodos utilizados pelo operador para
  cumprir com os apropriados regulamentos e as informações gerais que os comissários precisam
  conhecer a fim de desempenhar suas funções adequadamente.'
