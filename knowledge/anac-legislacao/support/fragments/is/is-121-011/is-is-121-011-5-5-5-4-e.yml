title: 5.5.5.4(e)
text: 'e) Padronização dos procedimentos e sinais entre os tripulantes na cabine de passageiros
  e na cabine de comando, incluindo:

  I. responsabilidades pré-voo;

  II. sinais sonoros;

  III. sinais para evacuação;

  IV. sinais para cabine de comando estéril;

  V. procedimentos contra atos de interferência ilícita;

  VI. procedimentos para início da evacuação;

  VII. procedimentos para notificação de emergências;

  VIII. atribuições em emergências;

  IX. procedimentos para notificar a cabine de comando que todos os passageiros estão sentados
  antes da decolagem ou pouso da aeronave;

  X. fechamento da porta da cabine de comando antes do início do voo;

  XI. procedimentos para entrada de comissários na cabine de comando; e

  XII. aviso para os comissários assumirem suas posições nos assentos antes da decolagem;'
