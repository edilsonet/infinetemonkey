title: Generalidades
text: '5.6.1 Generalidades

  5.6.1.1 As seções 121.417 e 121.805, do RBAC nº 121, estabelecem os requisitos do treinamento
  de emergências para tripulantes. Os requisitos podem ser divididos em dois tipos de treinamento,
  que serão tratados nesta IS como “treinamento de emergências gerais” e “treinamento de emergências
  específico da aeronave”. O treinamento de emergências gerais é aquele sobre itens de emergências
  comuns a todas as aeronaves. Um exemplo é o treinamento sobre extintores de incêndio e procedimentos
  de combate a incêndios que são aplicáveis a todas as aeronaves da frota do operador. Já
  o treinamento de emergências específico da aeronave é aquele sobre itens que são específicos
  a cada modelo de aeronave. Um exemplo é o treinamento sobre localização dos equipamentos
  de emergências e atribuições dos tripulantes em emergências para um modelo específico de
  aeronave.

  5.6.1.2 O objetivo do treinamento de emergências gerais é prover os comissários de voo com
  o conhecimento necessário sobre equipamentos, situações e procedimentos de emergência, em
  nível suficiente para permitir que estes atuem com segurança e assertividade em caso de
  uma emergência real.

  5.6.1.3 Quando um operador usa diferentes modelos de aeronaves em sua frota, é vantajoso
  obter a aprovação de currículos de treinamento que possuem os segmentos de treinamento de
  emergências gerais e emergências específico da aeronave separados. No entanto, para um operador
  que usa um único modelo de aeronave, pode ser aceitável a elaboração de um currículo de
  treinamento que não faça distinção entre os treinamentos de emergências gerais e emergências
  específico da aeronave.

  5.6.1.4 O treinamento de emergências gerais é requerido para as categorias de treinamento
  inicial, periódico e requalificação, mas não de transição. Apenas o treinamento de emergências
  específico da aeronave é requerido para a categoria de treinamento de transição. Um operador
  pode optar por limitar o treinamento inicial de nova contratação a um modelo específico
  de aeronave, e então realizar treinamento de transição para qualificar seus comissários
  em cada modelo de aeronave adicional. Quando o comissário completa o treinamento inicial
  de nova contratação, um mês de referência é estabelecido, e o segmento de emergências gerais
  é requerido novamente apenas no próximo ciclo de treinamento periódico.

  5.6.1.5 O operador pode optar em treinar seus comissários em todos os modelos de aeronave
  de sua frota durante o treinamento inicial de nova contratação. Neste caso, o segmento de
  currículo de emergências gerais fornece a base para aplicação dos diferentes treinamentos
  de emergências específicos. Pode ser aceitável que o operador não defina um segmento de
  currículo de emergências gerais, desde que este treinamento seja replicado para cada modelo
  de aeronave.'
