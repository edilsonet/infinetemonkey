title: 5.6.10.2(a)
text: a) o nível básico de complexidade considerado para a categoria de treinamento inicial
  de nova contratação são as “operações terrestres”. É aceitável para esse tipo de operação
  uma carga horária de 14h, divididas em 10h para os módulos de situações de emergência e
  equipamentos de emergências, e 4h para os exercícios práticos de emergência;
