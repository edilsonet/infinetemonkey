title: Carga horária
text: '5.6.10 Carga horária

  5.6.10.1 O RBAC nº 121 não estabelece uma carga horária mínima de treinamento para os segmentos
  de currículo de emergências gerais. No entanto, ao elaborar a ementa de tais segmentos de
  currículo, os operadores devem estabelecer as cargas horárias, considerando a complexidade
  da aeronave utilizada e do tipo de operação realizada. A seguir são fornecidas orientações
  para a definição da carga horária do segmento de currículo de emergências gerais para a
  categoria de treinamento inicial de nova contratação. Para um tipo complexo de operação,
  pode ser necessária uma carga horária maior do que a referência, enquanto para uma operação
  menos complexa uma carga horária menor pode ser aceitável.'
