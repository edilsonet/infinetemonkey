text: '5.6.11 Uso de dispositivos de treinamento

  5.6.11.1 Os exercícios práticos de emergência para itens como saídas de emergência e sistema
  de oxigênio para passageiros devem ser conduzidos em aeronave estática ou em dispositivo
  de treinamento aprovado de cabine ou de saídas de emergência (mockups). Os mockups de cabine
  e de saídas de emergência devem ser representativos de uma seção em escala real da aeronave.
  Os mockups de cabine devem incluir portas operacionais, saídas nas janelas, escorregadeiras,
  botes salva-vidas e quaisquer outros equipamentos utilizados durante os exercícios. Os mockups
  de cabine e de saídas de emergência não devem ser usados a menos que sejam avaliados e considerados
  adequados pela ANAC. Os mockups de cabine e de saídas de emergência são aceitáveis se cumprirem
  com os seguintes critérios:'
