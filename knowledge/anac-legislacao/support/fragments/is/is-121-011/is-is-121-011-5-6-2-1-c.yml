section_title: 'Os módulos do segmento de currículo de emergências gerais para os comissários
  de voo podem ser agrupados em três áreas de treinamento:'
subsection_id: c
cite: 5.6.2.1(c)
title: 5.6.2.1(c)
text: 'c) Exercícios práticos de emergência: fornece aos comissários de voo a oportunidade
  de executar procedimentos de emergência com manuseio real dos equipamentos de emergência,
  tais como exercícios de combate ao fogo com uso do extintor de incêndio e do equipamento
  protetor de respiração (PBE).

  5.6.2.2 O treinamento de emergências gerais deve ser adequado ao tipo de operação conduzido
  pelo operador. Por exemplo, se a empresa opera aeronaves acima de 25 mil pés, os tripulantes
  devem receber treinamento em temas como: fisiologia do voo, hipóxia, enfermidade por despressurização
  e quaisquer procedimentos correlacionados. Em outro exemplo, uma empresa que não é certificada
  para operações sobre grandes extensões de água não precisa conduzir treinamento sobre o
  uso de botes salva-vidas.'
