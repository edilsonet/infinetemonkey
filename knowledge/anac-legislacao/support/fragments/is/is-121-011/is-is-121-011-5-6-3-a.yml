cite: 5.6.3(a)
title: 5.6.3(a)
text: a) os módulos de treinamento de emergências gerais exigidos pelo RBAC nº 121 devem ser
  incluídos na ementa do segmento de currículo de emergências gerais e computados dentro do
  requisito de carga horária deste segmento. O operador pode determinar a sequência do treinamento
  real. Por exemplo, enquanto um módulo sobre despressurização deve estar inserido na ementa
  do segmento de currículo de emergências gerais, o operador pode, na prática, realizar o
  treinamento sobre procedimentos de despressurização imediatamente antes ou depois de realizar
  o treinamento em um módulo específico da aeronave estabelecido no segmento de currículo
  de solo; e
