section_title: Módulos de treinamento de emergências gerais
subsection_id: b
cite: 5.6.3(b)
title: 5.6.3(b)
text: b) o operador pode optar por inserir um módulo de treinamento em mais de um segmento
  de currículo. No entanto, para fins de aprovação, esse módulo de treinamento deve ser inserido
  no segmento de currículo apontado nesta IS. Por exemplo, a seção 121.805, do RBAC nº 121,
  exige que o módulo de treinamento sobre primeiros socorros seja inserido no segmento de
  currículo de emergências gerais. Porém, a critério do operador, esse módulo de treinamento
  também poderia ser abordado no segmento de currículo de doutrinamento básico.
