title: Módulos de treinamento de emergências gerais
text: '5.6.3 Módulos de treinamento de emergências gerais

  5.6.3.1 O segmento de currículo de emergências gerais deve incluir quantos módulos forem
  necessários para garantir um treinamento adequado. Cada módulo proposto deve conter pelo
  menos um título descritivo e uma lista dos eventos ou elementos que serão apresentados durante
  a instrução do módulo.

  5.6.3.2 Os módulos de treinamento devem conter eventos ou elementos suficientes para garantir
  que o comissário de voo receba treinamento adequado nas áreas de equipamentos de emergência,
  situações de emergência e exercícios práticos de emergência. Para a aprovação inicial, não
  é necessário incluir descrições detalhadas de cada evento ou elemento dentro da ementa do
  módulo de treinamento. Essas descrições detalhadas são mais apropriadas quando incluídas
  no material didático do operador. Durante o processo de aprovação, a ANAC avaliará o material
  didático para garantir que o alcance e a profundidade dos módulos de treinamento sejam adequados.

  5.6.3.3 Os módulos de treinamento designados para para cumprir os requisitos das seções
  121.417 e 121.805, do RBAC nº 121, estão contidos tanto no segmento de currículo de emergências
  gerais quanto no segmento de currículo de solo da aeronave. Os operadores possuem flexibilidade
  na organização dos módulos de treinamento de emergências gerais como segue:'
