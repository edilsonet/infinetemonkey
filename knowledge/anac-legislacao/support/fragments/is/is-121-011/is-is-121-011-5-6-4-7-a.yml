title: 5.6.4.7(a)
text: 'a) Saídas com escorregadeiras ou escorregadeiras-bote: fechamento da saída antes do
  voo; integridade e condição das barras de fixação (girt bar) e suportes; indicadores de
  pressão e conexão das escorregadeiras e escorregadeiras-bote; mecanismo de engate e desengate
  das escorregadeiras e escorregadeiras-bote; marcações e placares; controles de abertura
  da porta; sinais; luzes; alças; função; operação, inclusive sob condições adversas; impacto
  do clima, vento e fogo nas escorregadeiras;'
