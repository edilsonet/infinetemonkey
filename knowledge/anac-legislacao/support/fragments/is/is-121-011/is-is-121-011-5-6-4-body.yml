text: '5.6.4 Conteúdo dos módulos da área de equipamentos de emergência

  5.6.4.1 A área de equipamentos de emergência tem por objetivo fornecer aos comissários instrução
  sobre a função e operação dos equipamentos de emergência comuns a todas as aeronaves em
  que o tripulante está se qualificando. O treinamento de equipamentos de emergência deve
  fornecer demonstração de equipamentos que são representativos dos equipamentos de emergência
  reais das aeronaves. Por exemplo, se a frota do operador possui aeronaves equipadas com
  garrafas de oxigênio portáteis e com geradores químicos de oxigênio, então ambos os tipos
  de dispositivos devem ser usados durante a instrução. Quaisquer informações pertinentes
  à função de um equipamento de emergência também devem ser abordadas durante o treinamento.
  Por exemplo, informações sobre os diferentes tipos de fogo devem ser transmitidas antes
  que possa ser dado o treinamento sobre a seleção dos extintores de incêndios apropriados
  a cada situação.

  Nota: detalhes específicos tais como a localização e tipo exato dos equipamentos de emergência
  a bordo das aeronaves não precisam necessariamente ser abordados no treinamento de emergências
  gerais, uma vez que esse assunto será tratado no treinamento de solo da aeronave.

