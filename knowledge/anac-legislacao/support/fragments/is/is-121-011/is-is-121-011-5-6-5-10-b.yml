subsection_id: b
cite: 5.6.5.10(b)
title: 5.6.5.10(b)
text: 'b) Emergências e incidentes médicos em voo: reconhecimento e exame de sintomas de doença
  ou lesão; tentativa de obter histórico médico; avaliação do passageiro; tratamentos médicos
  apropriados; manuseio de passageiros; limitações das aeronaves; incapacitação de tripulantes;
  óbito em voo; localização, revisão do conteúdo, função e uso dos equipamentos de primeiros
  socorros.'
