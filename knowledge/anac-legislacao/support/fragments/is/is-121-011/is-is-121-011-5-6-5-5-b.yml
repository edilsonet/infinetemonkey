title: 5.6.5.5(b)
text: 'b) Despressurização rápida (Procedimentos de ação imediata / ação secundária): causas
  possíveis; efeitos de cabine; efeitos fisiológicos; procedimentos de coordenação da tripulação;
  "Procedimentos de ação imediata", incluindo reconhecer os sinais de despressurização, tomar
  a máscara de oxigênio mais próxima, sentar-se ou segurar em algo sólido e aguardar a notificação
  da cabine de comando antes de se deslocar; "Procedimentos de ação secundária", incluindo
  obter e colocar oxigênio portátil, verificar outros comissários, auxiliar passageiros, tratar
  lesões e avaliar e controlar danos;'
