text: 'a) Princípios de combustão e classes de incêndios: características do incêndio de uma
  aeronave, incluindo descargas elétricas e elemento do tempo; fumaças tóxicas e irritantes
  químicos; revisão da função e uso dos equipamentos de combate a incêndios; técnicas de combate
  a incêndios; fatores especiais, incluindo inflamabilidade e toxicidade do material da cabine;
  espaço confinado; ventilação da cabine;'
