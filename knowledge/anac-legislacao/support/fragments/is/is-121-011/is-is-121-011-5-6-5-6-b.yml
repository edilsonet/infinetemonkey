title: 5.6.5.6(b)
text: 'b) Prevenção de incêndios: prontidão dos comissários; verificações da cabine, incluindo
  armazenamento de artigos que possam contribuir para o fogo; verificação dos lavatórios,
  incluindo a condição do recipiente de lixo, porta, detectores de fumaça e extintores de
  incêndio; verificação das galleys, incluindo fornos e equipamentos elétricos; aplicação
  da legislação sobre proibição do fumo; procedimentos para uso dos disjuntores (circuit breakers);'
