title: 5.6.5.7(a)
text: 'a) Práticas básicas: Descrição da amaragem e pousos não antecipados na água (antes
  do impacto / após o impacto); notificação da tripulação, incluindo tempo antes do pouso,
  tipo de pouso, sinal para assumir a posição de impacto; coordenação da tripulação, incluindo
  a preparação da cabine e dos passageiros; briefing aos passageiros; briefing aos passageiros
  auxiliares; posições de impacto dos passageiros; posições de impacto dos comissários (jump
  seats dianteiros e traseiros); impacto na água; avaliação das condições; comandos; abertura
  das saídas primárias e secundárias; uso de dispositivos de flutuação; evacuação nas saídas
  sobre as asas, incluindo o uso de cordas de escape; técnicas de redirecionamento; evacuação
  de pessoas que precisam de assistência; controle de passageiros;'
