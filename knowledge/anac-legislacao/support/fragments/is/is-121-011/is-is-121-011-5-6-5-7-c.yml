title: 5.6.5.7(c)
text: 'c) Após o impacto - não antecipado: avaliação das condições; procedimentos de coordenação
  de tripulação; liberação dos cintos de segurança dos comissários; ativação de luzes de emergência;
  comando aos passageiros para soltar os cintos de segurança e usar dispositivos de flutuação
  individuais; avaliação das saídas; técnicas de redirecionamento; abertura das saídas, incluindo
  acionamento de dispositivos de flutuação e comando aos passageiros auxiliares; comando aos
  passageiros para sair, enchimento dos coletes e uso dos dispositivos de flutuação; assistência
  a passageiros e tripulantes incapacitados; remoção do equipamento de emergência apropriado
  da aeronave;'
