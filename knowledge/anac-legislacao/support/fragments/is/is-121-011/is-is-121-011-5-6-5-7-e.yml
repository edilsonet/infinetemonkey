title: 5.6.5.7(e)
text: 'e) Após impacto - antecipado: avaliação das condições; procedimentos de coordenação
  de tripulação; liberação dos cintos de segurança dos comissários; ativação de luzes de emergência;
  comando aos passageiros para soltar os cintos de segurança; avaliação das saídas; técnicas
  de redirecionamento; abertura das saídas, incluindo lançamento dos botes salva-vidas ou
  acionamento das escorregadeiras-bote e comando aos passageiros auxiliares; comando aos passageiros
  para sair, enchimento dos coletes salva-vidas e embarque nos botes; assistência a passageiros
  e tripulantes incapacitados; remoção do equipamento de emergência apropriado da aeronave;'
