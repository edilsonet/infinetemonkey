section_title: 'Módulo: Evacuação de emergência no solo:'
subsection_id: a
cite: 5.6.5.8(a)
title: 5.6.5.8(a)
text: 'a) Práticas básicas: descrição de evacuações antecipadas e não antecipadas (antes do
  impacto / após o impacto); notificação da tripulação, incluindo tempo antes do pouso, tipo
  de pouso, sinal para assumir a posição de impacto; coordenação da tripulação, incluindo
  a preparação da cabine e dos passageiros; briefing aos passageiros; briefing aos passageiros
  auxiliares; posições de impacto dos passageiros; posições de impacto dos comissários (nas
  diferentes posições dos jump seats); impacto e fogo posterior; avaliação das condições;
  comandos; abertura das saídas primárias e secundárias; evacuação nas saídas sobre as asas,
  incluindo o uso de cordas de escape; técnicas de redirecionamento; evacuação de pessoas
  que precisam de assistência; controle de passageiros;'
