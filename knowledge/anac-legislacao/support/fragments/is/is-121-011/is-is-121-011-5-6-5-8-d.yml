title: 5.6.5.8(d)
text: 'd) Após o impacto - antecipado ou não antecipado: avaliação das condições; procedimentos
  de coordenação de tripulação; liberação dos cintos de segurança dos comissários; ativação
  de luzes de emergência; início da evacuação, incluindo decisões e sinais para evacuar ou
  não evacuar; comando aos passageiros para soltar os cintos de segurança e sair; avaliação
  das saídas; técnicas de redirecionamento; abertura das saídas, incluindo acionamento das
  escorregadeiras; comando aos passageiros auxiliares; comando aos passageiros para sair e
  se distanciar da aeronave; assistência a passageiros e tripulantes incapacitados; remoção
  do equipamento de emergência apropriado da aeronave;'
