text: '5.6.5 Conteúdo dos módulos da área de situações de emergência

  5.6.5.1 Os módulos do treinamento de situações de emergência consistem em instrução, demonstração
  e prática no tratamento de situações de emergência comuns a todas as aeronaves da frota
  do operador em que o comissário está se qualificando. O treinamento de situações de emergência
  fornece a oportunidade para o comissário correlacionar os conceitos desenvolvidos no treinamento
  de equipamentos de emergência com a aplicação dos procedimentos dos vários tipos de situações
  que podem ocorrer. Por exemplo, este treinamento pode incluir instrução sobre o uso de um
  extintor de água em fogo nos assentos. Para reforçar o desenvolvimento desses conceitos,
  o treinamento em situações de emergência deve incorporar atividades de resolução de problemas
  que representem emergências em voo. Essas simulações devem ser tão realistas quanto possível
  e devem refletir o tipo de operação do operador.

  5.6.5.2 O treinamento de situações de emergência deve ser desenvolvido para garantir que
  os comissários satisfaçam os seguintes critérios de conhecimento e habilidades:'
