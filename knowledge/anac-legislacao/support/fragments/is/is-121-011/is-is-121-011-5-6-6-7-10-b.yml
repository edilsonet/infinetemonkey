title: 5.6.6.7.10(b)
text: 'b) executar os procedimentos para aplicação de ressuscitação cardiopulmonar.

  Nota 1: oferecer aos membros da equipe a oportunidade de vivenciar a coordenação e trabalho
  em equipe durante simulações de treinamento é altamente desejável. A ANAC reconhece o valor
  de todas as atividades que incentivam a comunicação e coordenação entre os membros da equipe.
  Isso incluiria treinamento conjunto de CRM, treinamento conjunto de evacuação, escalas que
  permitem que pilotos e comissários de bordo permaneçam juntos como uma equipe durante a
  sequência de sua viagem para garantir a padronização de procedimentos. É importante que
  operadores estejam cientes da desejabilidade de tripulação de voo e comissários de bordo
  realizarem simulações de evacuação de emergência e amaragem juntos. Quando isso não for
  possível, é desejável que os operadores estabeleçam programas de treinamento que incluam
  informações abordando os papéis de outros membros da equipe durante evacuações de emergência
  e amaragens.

  Nota 2: é incentivado que os operadores forneçam ambientes realistas para treinamento e
  simulações de amaragem. Os objetivos de treinamento devem ser alcançados em piscinas ou
  outros ambientes aquáticos seguros, utilizando os dispositivos de flutuação exigidos a bordo
  da aeronave.'
