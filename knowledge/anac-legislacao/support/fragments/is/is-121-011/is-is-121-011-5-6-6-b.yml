cite: 5.6.6(b)
title: 5.6.6(b)
text: 'b) Operação: capacidade de operar corretamente cada tipo de extintor de incêndio portátil
  e implementar procedimentos adequados de combate a incêndios; localizar a fonte de fogo
  ou fumaça e identificar a classe de incêndio; selecionar o extintor apropriado e removê-lo
  do dispositivo de segurança; preparar o extintor para uso; realmente operar e descarregar
  o extintor; usar técnicas corretas de combate a incêndio para o tipo de incêndio; e

  Nota: a utilização de extintores de incêndio do tipo halon durante as práticas de combate
  ao fogo não é apropriada a menos que exista uma área de treinamento que tenha sido projetada
  e planejada para prevenir os danos ao meio ambiente decorrente de descargas de halon. Quando
  não forem utilizadas essas instalações, preferencialmente outros agentes extintores de fogo
  não danosos ao meio ambiente devem ser utilizados durante as práticas.'
