text: '5.6.6 Conteúdo dos módulos da área de exercícios práticos de emergência

  5.6.6.1 Os módulos de exercícios práticos de emergência fornecem aos comissários a oportunidade
  de adquirir experiência no desempenho de procedimentos de emergência com a operação real
  dos equipamentos de emergência ou segurança.

  5.6.6.2 Os exercícios práticos de emergência consistem numa integração dos treinamentos
  de equipamentos de emergência, situações de emergência e emergências específico da aeronave.
  Esses exercícios podem ser ministrados como gerais para todas as aeronaves ou como específico
  para as aeronaves. Por exemplo, se todas as aeronaves da frota do operador forem equipadas
  com o mesmo tipo de cilindro de oxigênio portátil, o exercício prático pode ser ensinado
  como "geral" para todas as aeronaves. Se, no entanto, as aeronaves da frota forem equipadas
  com diferentes tipos de cilindros de oxigênio portáteis, o exercício prático deve ser ensinado
  como "específico da aeronave".

  5.6.6.3 A sequência dos exercícios práticos de emergência deve ser ajustada de acordo com
  a complexidade do tipo e número de aeronaves, mockups de treinamento e outros dispositivos
  de treinamento. Para determinados exercícios, é apropriado ministrar os exercícios práticos
  após o treinamento de emergências específico da aeronave. Por exemplo, o exercício prático
  sobre saídas de emergência é mais eficaz após o treinamento sobre as funções e controles
  das saídas de emergência específico da aeronave.

  5.6.6.4 Os exercícios práticos de emergência são a fase de desempenho e demonstração do
  treinamento de emergência. O objetivo deste treinamento é treinar cada comissário para a
  proficiência, reforçando os conceitos desenvolvidos na fase de instrução do treinamento
  de emergência. Os exercícios requerem o uso do tipo específico de equipamento de emergência
  que está instalado nas aeronaves do operador. O equipamento deve ter as mesmas dimensões,
  pesos, forças e especificações. Cada um dos exercícios deve ser o mais realista possível.
  Por exemplo, se fumaça artificial não for usada em uma simulação de evacuação de emergência,
  devem ser feitas tentativas para simular condições de escuridão.

  5.6.6.5 Os exercícios práticos de emergência devem ser desenvolvidos para garantir que os
  comissários obtenham proficiência em situações de emergência e tenham a capacidade de fazer
