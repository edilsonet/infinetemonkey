cite: 5.6.6(c)
title: 5.6.6(c)
text: 'c) Lançamento dos botes das saídas nas janelas: remoção e posicionamento do bote do
  compartimento para a janela de saída; remoção do cordão de segurança dos botes; fixação
  do cordão de segurança do bote ao interior da aeronave; garantia de que a janela de saída
  esteja aberta e utilizável; remoção da corda de escape e anexação à asa; carregamento do
  bote sobre a asa e lançamento a partir do bordo de ataque da asa para a água; enchimento
  do bote; comando aos passageiros para sair da janela, caminhada sobre a asa usando a corda
  de escape e embarque no bote; separação dos botes da aeronave; comando aos passageiros auxiliares.

  5.6.6.7.7 Exercício: Transferência das escorregadeiras-bote (se aplicável). Durante este
  exercício, os alunos devem observar a transferência de cada tipo de escorregadeira-bote
  de uma porta inutilizável para uma porta utilizável:'
