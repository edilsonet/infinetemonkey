text: 'd) Técnicas especiais de deslizamento: conscientização dos métodos de assistência a
  PNAE e pessoas em estado de pânico.

  5.6.6.7 Requisitos para exercícios práticos de emergência adicionais. Os alunos devem realizar
  os seguintes exercícios práticos de emergência durante o treinamento inicial e uma vez a
  cada 24 meses durante o treinamento periódico. Para cada exercício de emergência, estão
  listados elementos ou eventos que os comissários devem ser capazes de demonstrar satisfatoriamente.

  5.6.6.7.1 Exercício: Uso das saídas de emergência. Durante este exercício, os alunos devem
  operar cada tipo de saída de emergência nos modos normal e de emergência, incluindo as ações
  e forças necessárias para o acionamento das escorregadeiras:'
