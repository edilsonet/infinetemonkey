title: 5.6.6(e)
text: 'e) Embarque de passageiros e tripulantes nos botes ou escorregadeiras-bote: capacidade
  de comandar os passageiros a saírem da aeronave, encherem os coletes salva-vidas e embarcarem
  nos botes adequadamente; iniciar procedimentos de gerenciamento dos botes, inclusive desconectar
  os botes da aeronave, aplicar primeiros socorros imediatos, resgatar pessoas na água, resgatar
  rações e equipamentos flutuantes, posicionar âncoras marítimas, amarrar os botes juntos,
  ativar e garantir um ELT em operação; iniciar procedimentos básicos de sobrevivência, incluindo
  remover e usar itens do conjunto de sobrevivência, consertar e manter o bote, garantir proteção
  contra exposição, erguer a capota, comunicar a localização e fornecer primeiros socorros
  contínuos; e'
