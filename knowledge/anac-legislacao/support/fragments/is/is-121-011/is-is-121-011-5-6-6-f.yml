text: 'f) comunicar-se efetivamente com os demais tripulantes e os passageiros em uma situação
  de emergência.

  5.6.6.6 Requisitos para exercícios práticos de emergência uma única vez. O RBAC nº 121 exige
  que os tripulantes realizem os seguintes exercícios pelo menos uma vez durante o treinamento
  inicial. Para cada exercício de emergência, estão listados elementos ou eventos que os comissários
  devem ser capazes de demonstrar satisfatoriamente.

  5.6.6.6.1 Exercício: Combate ao fogo com o uso de PBE. Durante este exercício, o aluno deve
  combater um incêndio real ou simulado descarregando um extintor de incêndio carregado com
  o agente retardante de fogo apropriado enquanto estiver usando PBE. O aluno deve usar PBE
  enquanto combate o fogo. Os seguintes elementos e eventos se aplicam ao exercício:'
