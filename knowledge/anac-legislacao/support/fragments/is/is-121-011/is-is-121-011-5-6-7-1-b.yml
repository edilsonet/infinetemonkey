section_title: 'Durante investigação de incidente grave ocorrido em fevereiro de 2017 com
  aeronave em operação segundo o RBAC nº 121, o CENIPA constatou que:'
subsection_id: b
cite: 5.6.7.1(b)
title: 5.6.7.1(b)
text: b) a emissão de faíscas ocasionou a queima de uma parte da lateral da parede esquerda
  da aeronave. Este episódio foi rapidamente identificado pelos comissários, que avisaram
  o piloto em comando da aeronave e iniciaram o combate ao fogo, de acordo com o previsto
  no manual de comissários do operador;
