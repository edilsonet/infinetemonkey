section_id: 5.6.7.1
section_title: 'Durante investigação de incidente grave ocorrido em fevereiro de 2017 com
  aeronave em operação segundo o RBAC nº 121, o CENIPA constatou que:'
subsection_id: f
cite: 5.6.7.1(f)
title: 5.6.7.1(f)
text: 'f) o fogo foi extinto e a aeronave pousou em segurança.

  5.6.7.2 Em que pese o combate bem sucedido ao princípio de incêndio, o CENIPA identificou
  o perigo nas possíveis consequências do uso da machadinha em atingir uma área mais sensível
  durante a busca por acesso ao fogo.

  5.6.7.3 O local onde a machadinha foi usada na ocorrência era uma área onde passam diversos
  cabos de energia dos sistemas eletroeletrônicos da aeronave. Um eventual corte de uma destas
  cablagens, pela ação da machadinha, poderia ocasionar uma ocorrência de maiores proporções.

  5.6.7.4 Durante a investigação, o CENIPA ainda concluiu que os normativos da ANAC, bem como
  os manuais de treinamento de comissários do operador e do fabricante da aeronave não especificavam
  como usar a machadinha.

  5.6.7.5 Assim, para atender às recomendações de segurança do CENIPA, os operadores devem,
  durante o treinamento, implementar medidas de forma a garantir que todos os tripulantes
  de aeronaves equipadas com machadinha estejam proficientes com relação à sua adequada utilização
  como equipamento para o combate ao fogo no interior das aeronaves, de maneira que o uso
  não venha a degradar as condições de voo e também nas demais condições de operação com a
  aeronave no solo.'
