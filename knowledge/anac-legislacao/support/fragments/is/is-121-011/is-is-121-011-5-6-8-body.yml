text: '5.6.8 Orientações para o treinamento de comissários designados para operar mais de
  uma porta durante uma evacuação de emergência

  5.6.8.1 O treinamento do controle de fluxo de passageiros é especialmente importante quando
  um único comissário é designado para abrir mais de uma saída. O controle de fluxo dos passageiros
  é uma parte importante de qualquer evacuação de emergência ou amaragem e deve ser incluído
  em todos os treinamentos de emergência de comissários. O programa de treinamento deve enfatizar
  aos comissários que a ação adequada pode garantir que todas as saídas disponíveis sejam
  usadas de forma eficiente. Os comissários devem ser treinados para avaliar o uso das saídas
  pelos passageiros e direcioná-los para outra saída de forma a aumentar o número pessoas
  evacuando o avião. Além disso, os comissários devem ser treinados para avaliar continuamente
  a condição das saídas e sinalizar e direcionar os passageiros para as saídas disponíveis.
  O programa de treinamento deve incluir técnicas de gerenciamento de fluxo durante os exercícios
  práticos.

  5.6.8.2 Nos casos em que o operador possui um mockup em escala real, que contém duas saídas
  no nível do assoalho opostas, o programa de treinamento deve exigir que os alunos abram
  as duas portas e demonstrem o controle do fluxo de passageiros por essas duas portas.

  5.6.8.3 Quando o operador treina seus comissários em um mockup que não tem ambas as saídas
  designadas, o programa de treinamento deve incluir uma simulação em que o comissário conclua
