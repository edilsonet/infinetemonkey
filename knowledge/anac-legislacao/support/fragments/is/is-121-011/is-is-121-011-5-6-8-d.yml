section_title: Orientações para o treinamento de comissários designados para operar mais de
  uma porta durante uma evacuação de emergência
subsection_id: d
cite: 5.6.8(d)
title: 5.6.8(d)
text: 'd) demonstrar controle do fluxo de passageiros.

  5.6.8.4 Quando o operador faz todo o seu treinamento em um avião real e possui procedimentos
  de emergência que exigem que um único comissário abra mais de uma porta, seu programa de
  treinamento deve incluir um exercício que requer que os comissários abram as duas portas
  e pratiquem o controle do fluxo de passageiros, incluindo os sinais e comandos necessários
  para maximizar a evacuação dos passageiros da aeronave.'
