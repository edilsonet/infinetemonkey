subsection_id: body
cite: 5.6.9.1
title: 'O segmento de currículo de emergências gerais é requerido para as seguintes categorias
  de treinamento: inicial, periódico e requalificação.'
text: '5.6.9.1 O segmento de currículo de emergências gerais é requerido para as seguintes
  categorias de treinamento: inicial, periódico e requalificação.

  5.6.9.2 Treinamento inicial: Os operadores devem elaborar e obter aprovação de um segmento
  de currículo de emergências gerais para a categoria de treinamento inicial de nova contratação.
  Para operadores que operam aeronaves tanto do Grupo I (propelidas a hélice) quanto do Grupo
  II (propelidas a jato), pode ser necessária a elaboração de segmentos de currículo de emergências
  gerais específicos para a categoria de treinamento inicial de equipamento apropriada a esses
  tipos de aeronave.

  5.6.9.3 Treinamento de transição: Não há requisito para um segmento de currículo de emergências
  gerais em separado para a categoria de treinamento de transição. Para esta categoria de
  treinamento, os comissários devem ter recebido previamente o treinamento de emergências
  gerais durante o treinamento inicial (nova contratação ou inicial de equipamento). O treinamento
  de emergências “específico da aeronave” deve estar incluído no segmento de currículo de
  solo da aeronave. Ainda, o treinamento de emergências “específico da aeronave” pode exigir
  elementos que normalmente são inseridos no segmento de emergências gerais. Por exemplo,
  o operador pode operar uma aeronave que não está equipada com botes salva-vidas; se posteriormente
  uma aeronave com tal equipamento for adicionada à frota, o treinamento sobre uso dos botes
  deve ser incluído no treinamento de transição.

  5.6.9.4 Treinamento periódico: Os operadores devem desenvolver e obter aprovação de um segmento
  de currículo de emergências gerais em separado para a categoria de treinamento periódico.
  Neste caso, os operadores poderão ter dois segmentos de currículo de emergências gerais,
  um que reflete um ciclo de 12 meses para os treinamentos sobre situações de emergências
  e equipamentos de emergências, e outro que reflete um ciclo de 24 meses para o treinamento
  de exercícios práticos de emergência. Também é aceitável incorporar todos os módulos de
  treinamento num único segmento de currículo, desde que haja no programa de treinamento a
  exigência para que os comissários realizem os exercícios práticos de emergência uma vez
  a cada 24 meses.

  5.6.9.5 Treinamento de requalificação: Um segmento de currículo de emergências gerais é
  requerido para a categoria de treinamento de requalificação dependendo da finalidade desse
  treinamento. Se o propósito do treinamento envolver a requalificação de comissários que
  perderam a qualificação no segmento de emergências gerais, então a aplicação de um novo
  segmento de emergências gerais deve ser requerida.'
