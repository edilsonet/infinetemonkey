title: Generalidades
text: '5.7.1 Generalidades

  5.7.1.1 Esta seção especifica os objetivos e orienta sobre estrutura e o conteúdo do segmento
  de currículo de solo para comissários. Este segmento está composto por duas áreas de treinamento,
  identificadas como: assuntos gerais operacionais e emergências específicas da aeronave.
  Estas áreas de treinamento devem satisfazer os requisitos do RBAC nº 121.

  5.7.1.2 O objetivo do segmento de currículo de solo de aeronave é fornecer aos comissários
  conhecimentos básicos da aeronave a que serão designados. Esses conhecimentos são necessários
  para os comissários desempenharem as funções e procedimentos requeridos em situações normais,
  anormais e emergência. O termo “treinamento de solo” usado nesta seção significa o treinamento
  específico para uma aeronave. O operador pode utilizar muitos métodos ao ministrar o treinamento
  de solo da aeronave, incluindo instrução em sala de aula, dispositivos de treinamento, instrução
  em computador (CBT) e aeronave estática'
