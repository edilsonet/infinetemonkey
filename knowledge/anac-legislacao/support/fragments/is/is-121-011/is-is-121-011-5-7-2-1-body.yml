text: '5.7.2.1 A ementa do segmento de currículo de solo da aeronave deve incluir tópicos
  que sejam pertinentes ao tipo de operação de cada operador.

  5.7.2.2 Módulos de treinamento devem ser desenvolvidos para cada uma das áreas. A ementa
  dos módulos deve conter um título descritivo e a lista dos eventos ou elementos que serão
  apresentados durante a instrução. Os módulos, elementos e eventos relacionados a cada área
  de treinamento devem conter detalhamento suficiente para garantir conformidade com o treinamento
  requerido pelo RBAC nº 121.

  5.7.2.3 Para a aprovação inicial, não é necessário incluir descrições detalhadas de cada
  evento ou elemento dentro da ementa do módulo de treinamento. Essas descrições detalhadas
  são mais apropriadas quando incluídas no material didático do operador. Durante o processo
  de aprovação, a ANAC avaliará o material didático para garantir que o alcance e a profundidade
  dos módulos de treinamento sejam adequados.'
