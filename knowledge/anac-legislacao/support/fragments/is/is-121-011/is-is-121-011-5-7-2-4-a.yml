title: 5.7.2.4(a)
text: a) Carga horária. A carga horária deve estar especificada em todas as ementas de segmento
  de currículo de solo da aeronave. Baseado em suas próprias experiências, bem como na experiência
  conhecida dos demais operadores, o operador deve usar um julgamento razoável ao determinar
  se o treinamento pode ser cumprido adequadamente dentro da carga horária proposta. A carga
  horária deve incluir períodos, dentro da instrução, para intervalos razoáveis; e
