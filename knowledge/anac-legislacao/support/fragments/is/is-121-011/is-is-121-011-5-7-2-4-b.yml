section_title: 'O operador possui certa flexibilidade na construção dos módulos do treinamento
  de solo da aeronave, como segue:'
subsection_id: b
cite: 5.7.2.4(b)
title: 5.7.2.4(b)
text: b) Sequência do treinamento. O operador pode determinar a sequência real do treinamento
  e, se julgar apropriado, inserir um módulo de treinamento em mais de um segmento de currículo.
  No entanto, o operador deve inserir tal módulo de treinamento pelo menos no segmento de
  currículo indicado nesta IS. Por exemplo, a seção 121.421 do RBAC nº 121 requer que haja
  um módulo de treinamento sobre o equipamento elétrico das galleys no segmento de currículo
  de solo. A critério do operador, esse módulo de treinamento também pode ser ministrado no
  segmento de currículo de emergências gerais em conjunto com o módulo de combate ao fogo.
