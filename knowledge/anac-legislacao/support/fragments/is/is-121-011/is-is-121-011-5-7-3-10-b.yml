text: 'b) Sinais e procedimentos de comunicação de rotina: localização, função e operação
  dos sistemas de comunicação conforme aplicável à aeronave específica, incluindo procedimentos
  específicos para avisos sonoros e sinais de interfone em situações de rotina:

  I. notificação aos comissários para permanecerem sentados durante movimentação no solo;

  II. notificação aos comissários das fases críticas do voo; e

  III. notificação aos tripulantes de voo ao solicitar acesso à cabine de comando; e'
