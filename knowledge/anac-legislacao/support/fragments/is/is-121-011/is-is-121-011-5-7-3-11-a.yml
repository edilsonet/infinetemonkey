title: 5.7.3.11(a)
text: 'a) Responsabilidades gerais dos tripulantes:

  I. comunicação e coordenação entre tripulantes enquanto executando as atribuições, funções
  e procedimentos aplicáveis a cada fase do voo; e

  II. descrição das políticas do operador e requisitos regulamentares pertinentes às funções
  dos tripulantes em cada aeronave;'
