title: 5.7.3.11(b)
text: 'b) Atribuições e procedimentos para aeronave específica:

  I. identificação dos tripulantes requeridos a bordo quando a aeronave estiver estacionada;

  II. descrição das atribuições e responsabilidades pré-voo e em voo;

  III. descrição dos procedimentos de embarque dos passageiros;

  IV. procedimentos de acomodação da bagagem de mão;

  V. garantia de conformidade com os requisitos de ocupação dos assentos das saídas de emergência;

  VI. condução do briefing entre os tripulantes de voo e comissários; e

  VII. garantia de posse de todos os equipamentos pessoais requeridos para o voo, incluindo:

  - manuais;

  - lanternas; e

  - chaves da cabine de comando;'
