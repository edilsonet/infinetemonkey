title: 5.7.3.11(c)
text: 'c) Atribuições e procedimentos antes do embarque de passageiros:

  I. descrição das atribuições e procedimentos relativos às verificações de segurança pré-voo;
  e

  II. revisão das responsabilidades pré-voo aplicáveis a cada aeronave específica:

  - verificação dos sistemas de retração, travamento e oxigênio de emergência dos assentos
  de comissário;

  - localização e inspeção de todos os equipamentos de emergência, incluindo controles e interruptores;

  - localização e garantia que os cartões de instrução de segurança são aplicáveis ao modelo,
  tipo e série da aeronave;

  - preparação dos equipamentos de demonstração e briefing com informações de segurança aos
  passageiros; e

  - garantia de que as chaves da cabine de comando estão seguras, de acordo com a política
  do operador;'
