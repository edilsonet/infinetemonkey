title: 5.7.3.11(d)
text: 'd) Atribuições e procedimentos de embarque de passageiros: garantir aderência aos regulamentos
  e políticas do operador aplicáveis a cada aeronave:

  I. garantia que o número mínimo de comissários está nas posições de trabalho no momento
  do embarque;

  II. implementação de procedimentos de security;

  III. monitoramento do embarque e acomodação dos passageiros;

  IV. realização dos anúncios adequados;

  V. avaliação dos passageiros para identificar possíveis auxiliares em caso de emergência;

  VI. identificação e gerenciamento de passageiro inconveniente;

  VII. verificação das bagagens de mão;

  VIII. verificação dos passageiros sentados nos assentos das saídas de emergência;

  IX. garantia que os dispositivos de acomodação de crianças e crianças de colo são adequados
  para a aeronave e estão fixados adequadamente; e

  X. condução de briefing individual a qualquer pessoa que necessite de assistência de outra
  pessoa para sair rapidamente da aeronave em caso de emergência;'
