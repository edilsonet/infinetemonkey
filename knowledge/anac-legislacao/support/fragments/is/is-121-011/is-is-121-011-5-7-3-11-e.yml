title: 5.7.3.11(e)
text: 'e) Atribuições e procedimentos antes da movimentação em solo:

  I. verificação de passageiros clandestinos; e

  II. verificação:

  - requisitos de bagagem de mão e ocupação dos assentos das saídas de emergência estão sendo
  cumpridos;

  - compartimentos de acondicionamento de objetos estão fechados;

  - nenhuma bagagem, carga ou lixo está em receptáculo não autorizado;

  - galley e os equipamentos de serviço estão guardados e travados;

  - portas, cortinas, e divisórias da galley estão abertas;

  - galleys e lavatórios estão desocupados; e

  - funcionamento adequado de portas e airstairs, incluindo travamento e armamento antes do
  início da movimentação;'
