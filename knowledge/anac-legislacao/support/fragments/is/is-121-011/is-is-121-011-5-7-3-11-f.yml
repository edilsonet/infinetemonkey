title: 5.7.3.11(f)
text: 'f) Atribuições e procedimentos antes da decolagem: descrição das atribuições e procedimentos
  antes da decolagem conforme aplicável a cada modelo de aeronave:

  I. tomada das posições para demonstração;

  II. realização do briefing e demonstração com instruções de segurança aos passageiros ou
  liberação de vídeo com as instruções e demonstrações;

  III. realização individual do briefing e demonstração com instruções de segurança aos passageiros
  em assentos com visão bloqueada dos comissários ou vídeos;

  IV. realização da inspeção de segurança e cabine de passageiros para verificar:

  - proibição do fumo;

  - cintos de segurança afivelados;

  - crianças de colo adequadamente acomodadas no colo dos responsáveis ou em assentos aprovados;

  - encosto da poltrona e bandejas na posição vertical; e

  - toda bagagem de mão, incluindo dispositivos de contenção de crianças de colo, adequadamente
  acondicionados; e

  V. coordenação com cabine de comando relativa aos procedimentos de security para a decolagem;'
