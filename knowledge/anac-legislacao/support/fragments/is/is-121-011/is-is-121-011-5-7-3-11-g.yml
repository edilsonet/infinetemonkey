title: 5.7.3.11(g)
text: 'g) Atribuições e procedimentos em voo: descrição da realização de tarefas, atribuições
  e procedimentos de rotina durante o voo aplicáveis a cada modelo de aeronave:

  I. procedimento de cabine de comando estéril;

  II. acondicionamento do sistema de travamento após deixar o assento de comissário;

  III. implementação de procedimentos apropriados para gerenciamento de emergências ou situações
  anormais, incluindo turbulências;

  IV. imobilização de cada equipamento da galley e cada carrinho de serviço quando fora de
  uso; e

  V. implementação de procedimentos de segurança de galleys e elevadores de acesso da seção
  inferior da aeronave (se aplicável);'
