title: 5.7.3.11(h)
text: 'h) Atribuições e procedimentos antes do pouso: descrição de atribuições e procedimentos
  aplicáveis a cada aeronave específica:

  I. reporte de discrepâncias na cabine de passageiros à cabine de comando;

  II. procedimentos de cabine de comando estéril, exceto para comunicações relativas à segurança;

  III. realização da inspeção de segurança e cabine de passageiros para verificar:

  - proibição do fumo;

  - cintos de segurança afivelados;

  - crianças de colo adequadamente acomodadas no colo dos responsáveis ou em assentos aprovados;

  - encosto da poltrona e bandejas na posição vertical;

  - toda bagagem de mão, incluindo dispositivos de contenção de crianças de colo e objetos
  soltos, adequadamente acondicionados;

  - todos os compartimentos de acondicionamento de objetos devidamente fechados; e

  - nenhuma bagagem, carga ou lixo em receptáculo não autorizado;

  IV. acondicionamento e fixação de todo o equipamento de serviço e das galleys; e

  V. portas, cortinas e divisórias da galley abertas;'
