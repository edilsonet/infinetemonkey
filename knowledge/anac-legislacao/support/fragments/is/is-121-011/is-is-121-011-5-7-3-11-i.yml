title: 5.7.3.11(i)
text: 'i) Atribuições e procedimentos na movimentação no solo após o pouso e na chegada: descrição
  conforme aplicável a cada aeronave específica:

  I. uso do sistema de comunicação para instruir os passageiros a permanecerem sentados com
  o cinto afivelado até a parada total do avião;

  II. desarme manual ou automático da barra de fixação após escadas ou pontes de embarque
  serem posicionadas junto à aeronave;

  III. verificação do desengate da barra de fixação;

  IV. abertura de portas e airstairs; e

  V. verificação de portas e airstairs abertas e travadas adequadamente;'
