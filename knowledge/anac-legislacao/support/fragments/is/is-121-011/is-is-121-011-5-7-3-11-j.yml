title: 5.7.3.11(j)
text: 'j) Atribuições e procedimentos após a chegada:

  I. garantia da quantidade mínima de comissários nas posições de trabalho; e

  II. revisão das responsabilidades pós desembarque, conforme aplicável a cada aeronave:

  - implementação dos procedimentos de security;

  - garantia de que os comissários estejam uniformemente distribuídos ao longo da cabine conforme
  os requisitos regulamentares e política do operador;

  - monitoramento do desembarque dos passageiros para garantir aderência aos regulamentos
  e procedimentos do operador;

  - confirmação de que todos os equipamentos elétricos estão desligados; e

  - inspeção de áreas específicas da cabine de passageiros e galleys para garantir as precauções
  de segurança específicas da aeronave; e'
