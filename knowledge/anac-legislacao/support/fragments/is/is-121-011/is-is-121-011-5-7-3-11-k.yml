title: 5.7.3.11(k)
text: 'k) Paradas intermediárias:

  I. determinação da quantidade mínima de comissários a bordo em paradas intermediárias com
  passageiros embarcados;

  II. garantia de que os comissários estejam devidamente posicionados em seus postos; e

  III. implementação de procedimentos que garantam a segurança dos passageiros durante abastecimento,
  incluindo procedimentos para evacuação de emergência com aeronave parada no pátio;'
