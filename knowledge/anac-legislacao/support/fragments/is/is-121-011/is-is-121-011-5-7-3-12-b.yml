title: 5.7.3.12(b)
text: 'b) Crianças, crianças de colo e menor desacompanhado: procedimentos específicos para
  cada aeronave:

  I. designação apropriada de assentos;

  II. designação de máscaras de oxigênio adicionais e localização dos coletes salva-vidas
  para crianças;

  III. designação de assentos para carrinhos e berços de crianças; e

  IV. descrição de requisitos de reporte de ocorrências;'
