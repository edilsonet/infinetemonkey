title: 5.7.3.12(c)
text: 'c) Passageiros com necessidade de assistência especial (PNAE): procedimentos específicos
  para cada aeronave:

  I. procedimentos para gerenciamento de cadeiras de rodas e acomodações especiais a bordo,
  tais como lavatórios acessíveis e apoios para os braços móveis nas poltronas;

  II. procedimentos para o transporte de macas e incubadoras;

  III. métodos e procedimentos para o transporte de passageiros que requerem oxigênio para
  uso pessoal;

  IV. descrição de lugares recomendados para administração de assistência médica; e

  V. descrição de rotas de fuga e métodos de evacuação de passageiros com limitação física;'
