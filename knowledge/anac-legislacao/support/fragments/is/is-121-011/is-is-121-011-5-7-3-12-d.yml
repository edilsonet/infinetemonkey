text: 'd) Passageiros com necessidade de acomodação especial: procedimentos específicos para
  cada aeronave:

  I. VIP’s;

  II. menores desacompanhados;

  III. passageiros armados;

  IV. escoltas;

  V. prisioneiros;

  VI. deportados ou inadmitidos;

  VII. passageiros viajando sem visto;

  VIII. emissários ou mensageiros diplomáticos; e

  IX. outros indivíduos que requerem tratamento especial;'
