text: 'e) Requisitos de acondicionamento da bagagem de mão: procedimentos específicos para
  cada aeronave:

  I. requisitos de posição para itens superdimensionados na cabine;

  II. áreas designadas para o transporte de animais domésticos; e

  III. áreas designadas para o acondicionamento de objetos de auxílio a passageiros, tais
  como cadeiras de rodas, muletas e bengalas;'
