text: 'f) Requisitos para os assentos de passageiros: procedimentos específicos para cada
  aeronave:

  I. localização dos assentos das saídas de emergência;

  II. localização de assentos para acomodar passageiros incapacitados de se sentar de forma
  ereta por razões médicas; e

  III. áreas designadas para passageiros com cão guia; e'
