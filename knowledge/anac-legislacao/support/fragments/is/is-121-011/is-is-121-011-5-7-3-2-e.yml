title: 5.7.3.2(e)
text: 'e) utilização apropriada do equipamento elétrico das galleys e dos controles de condicionamento
  e de ventilação da cabine dos passageiros.

  5.7.3.3 Os módulos de treinamento sobre assuntos gerais operacionais devem também incluir
  informações sobre requisitos operacionais específicos da aeronave em que o treinamento está
  sendo conduzido. Essas informações podem incluir atribuições e procedimentos designados
  aos comissários, coordenação entre tripulantes e responsabilidades de comunicação dos tripulantes
  nas diferentes fases do voo.'
