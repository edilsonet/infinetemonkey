text: 'b) Configuração da cabine de comando: descrição e localização do seguinte:

  I. assentos dos tripulantes de voo e observadores;

  II. equipamentos de emergência portáteis;

  III. áreas de acondicionamento de objetos; e

  IV. operação da porta da cabine de comando, incluindo abertura em emergência;'
