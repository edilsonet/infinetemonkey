text: 'c) Configuração da cabine de passageiros: descrição e localização do seguinte:

  I. assentos dos comissários;

  II. assentos dos passageiros;

  III. galleys;

  IV. lavatórios;

  V. áreas de acondicionamento de objetos;

  VI. saídas de emergência;

  VII. compartimento das máscaras de oxigênio;

  VIII. unidades de serviço dos passageiros (PSU);

  IX. painéis de conveniência dos passageiros;

  X. sinais de informações aos passageiros;

  XI. placares requeridos; e

  XII. configuração passageiros/carga (combi);'
