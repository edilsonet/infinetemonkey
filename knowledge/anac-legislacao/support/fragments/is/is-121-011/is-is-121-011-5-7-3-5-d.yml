text: 'd) Galleys: descrição, localização, funções e operação dos equipamentos da galley,
  incluindo:

  I. fornos;

  II. refrigeradores;

  III. compartimentos de acondicionamento de objetos e dispositivos de travamento;

  IV. carrinhos, mecanismos de freios e dispositivos de contenção;

  V. disjuntores e painéis de controle elétricos;

  VI. sistema de água e válvulas de fechamento;

  VII. compartimento das máscaras de oxigênio; e

  VIII. galleys localizadas na seção inferior da aeronave, incluindo operação dos elevadores
  de acesso e das saídas para rotas de fuga (se aplicável);'
