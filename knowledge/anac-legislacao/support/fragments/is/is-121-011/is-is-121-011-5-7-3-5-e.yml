text: 'e) Lavatórios: descrição e localização dos equipamentos, incluindo:

  I. lavabos;

  II. compartimentos de acondicionamento de objetos e dispositivos de travamento;

  III. compartimento das máscaras de oxigênio;

  IV. sinais de informação aos passageiros;

  V. placares;

  VI. extintores de incêndio automáticos;

  VII. detectores de fumaça;

  VIII. válvulas de fechamento da água;

  IX. chaves e indicadores de aquecimento da água;

  X. sinais e mecanismos internos de fechamento da porta; e

  XI. mecanismos externos de abertura e fechamento da porta; e'
