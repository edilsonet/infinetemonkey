text: 'a) Assentos dos comissários:

  I. procedimentos para verificação pré-voo dos assentos de comissário, tais como: retratação
  automática do assento, apoio para cabeça e integridade do sistema de travamento;

  II. descrição da função e operação do sistema de travamento; e

  III. proteção do sistema de travamento quando não está sendo usado;'
