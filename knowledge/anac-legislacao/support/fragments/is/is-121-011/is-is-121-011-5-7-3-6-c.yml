title: 5.7.3.6(c)
text: 'c) Assentos dos passageiros: descrição dos assentos e da área no entorno, tais como:

  I. cintos de segurança;

  II. apoio para os braços, apoio para os pés e comando de reclinar assento;

  III. bandejas;

  IV. unidades de serviço dos passageiros (PSU);

  V. painéis de conveniência dos passageiros nos apoios de braço (se aplicável);

  VI. sinais de informação aos passageiros;

  VII. placares; e

  VIII. sistemas de conveniência e entretenimento dos passageiros;'
