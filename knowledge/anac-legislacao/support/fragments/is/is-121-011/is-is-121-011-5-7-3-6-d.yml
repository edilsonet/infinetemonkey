title: 5.7.3.6(d)
text: 'd) Unidades de serviço e painéis de conveniência dos passageiros: descrição do uso
  e função do seguinte:

  I. controles nas unidades de serviço dos passageiros, tais como luzes de leitura e respectivos
  interruptores;

  II. saídas do ar-condicionado;

  III. indicador luminoso de chamada do comissário e respectivo interruptor;

  IV. sinais luminosos de “não fumar” e “atar cintos”; e

  V. saídas de oxigênio de emergência;'
