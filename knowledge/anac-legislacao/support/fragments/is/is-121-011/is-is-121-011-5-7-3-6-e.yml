text: 'e) Sinais de informação aos passageiros: descrição da localização, propósito e indicador
  sonoro dos seguintes sinais:

  I. “Não fumar”;

  II. “Atar cintos”;

  III. “Lavatório ocupado”;

  IV. “Retornem aos assentos” no lavatório; e

  V. “Saída”;'
