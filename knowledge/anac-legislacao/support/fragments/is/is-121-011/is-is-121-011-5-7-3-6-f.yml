title: 5.7.3.6(f)
text: 'f) Marcações da aeronave: descrição, localização e propósito das seguintes marcações:

  I. marcações internas das saídas de emergência, indicando localização da saída de emergência
  de cada passageiro;

  II. marcações das alavancas de operação das saídas de emergência, indicando localização
  da alavanca e instruções para abertura da saída;

  III. marcações dos equipamentos de emergência, identificando o tipo de equipamento; e

  IV. marcações dos compartimentos ou recipientes dos equipamentos de emergência, identificando
  seu conteúdo;'
