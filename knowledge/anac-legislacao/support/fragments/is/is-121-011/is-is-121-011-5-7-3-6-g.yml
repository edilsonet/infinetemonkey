text: 'g) Placares da aeronave: descrição, localização e propósito dos seguintes placares:

  I. placares em cada anteparo dianteiro e parte traseira dos assentos de passageiro: “atar
  cintos enquanto sentado”; e

  II. placares em cada lavatório: “proibido impedir ou tentar impedir o funcionamento do detector
  de fumaça deste lavatório”; e'
