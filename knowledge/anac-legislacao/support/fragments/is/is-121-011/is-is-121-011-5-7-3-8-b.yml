text: 'b) Comunicações - sistema de chamada de comissários: descrição, localização, função
  e operação do seguinte:

  I. interruptores das luzes de chamada;

  II. indicadores sonoros e luminosos quando a chamada é iniciada;

  III. identificação das luzes de chamada em situações de rotina e emergência; e

  IV. procedimentos de reconfiguração dos indicadores das luzes de chamada;'
