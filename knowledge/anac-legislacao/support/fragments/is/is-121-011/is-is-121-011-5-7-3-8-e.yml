text: 'e) Sistemas elétrico e de iluminação:

  I. descrição e localização das luzes internas e externas;

  II. função e operação das luzes internas de cabine, incluindo: controles, interruptores
  e procedimentos de testes; e

  III. descrição e localização dos disjuntores (circuit breakers), incluindo: meios de acesso,
  interruptores, indicadores, procedimentos para reconfiguração;'
