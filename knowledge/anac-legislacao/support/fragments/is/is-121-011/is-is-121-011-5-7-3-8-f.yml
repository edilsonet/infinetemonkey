text: 'f) Oxigênio - sistema de oxigênio para tripulante de voo e observador: descrição e
  função do sistema, incluindo:

  I. localização dos reguladores de oxigênio e máscaras de oxigênio de colocação rápida;

  II. operação e indicações do regulador de fluxo de oxigênio;

  III. diferença entre fluxo de oxigênio “sob demanda” e “sob pressão”; e

  IV. uso adequado das máscaras de oxigênio;'
