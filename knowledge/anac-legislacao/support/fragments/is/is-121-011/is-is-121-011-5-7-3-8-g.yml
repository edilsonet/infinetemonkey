title: 5.7.3.8(g)
text: 'g) Oxigênio - sistema de oxigênio para passageiros:

  I. descrição e localização de cada tipo de máscara de oxigênio;

  II. localização de máscaras extras;

  III. descrição e localização dos indicadores de travamento dos compartimentos das máscaras
  de oxigênio;

  IV. instruções para abertura manual de cada tipo de compartimento de máscara de oxigênio;

  V. restrições para reembalagem dos compartimentos das máscaras de oxigênio; e

  VI. função do sistema automático de oxigênio aos passageiros, incluindo:

  - meios de ativação automática e manual do sistema;

  - indicadores da ativação do sistema de oxigênio;

  - procedimentos para iniciar o fluxo de oxigênio para a máscara; procedimentos para colocação
  adequada da máscara e teste do fluxo de oxigênio;

  - procedimentos para reconfiguração do sistema de oxigênio caso o sistema não seja projetado
  para desligar automaticamente; e

  - procedimentos para ativação do sistema para oxigênio de primeiros socorros;'
