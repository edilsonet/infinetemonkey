title: 5.7.3.9(b)
text: 'b) Saídas com escorregadeiras ou escorregadeiras-bote - pré-voo:

  I. identificação e função dos controles e indicadores de abertura das portas;

  II. procedimentos para verificar no pré-voo as vedações das portas; e

  III. integridade e condição de:

  - suportes e barras de fixação;

  - indicadores de pressão e conexão das escorregadeiras;

  - mecanismos de engate e desengate das escorregadeiras;

  - alavancas de acesso de emergência ao cone de cauda (se aplicável);

  - placares e marcações nas saídas;

  - sinais;

  - luzes; e

  - alavancas;'
