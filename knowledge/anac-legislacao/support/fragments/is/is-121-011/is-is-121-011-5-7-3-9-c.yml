title: 5.7.3.9(c)
text: 'c) Saídas com escorregadeiras ou escorregadeiras-bote - operação normal:

  I. procedimentos para abertura da saída em condição normal, incluindo:

  - desarmamento da porta manual ou automaticamente;

  - verificação do desengate da barra de fixação;

  - posição correta do corpo para abertura da porta;

  - operação correta dos controles da porta;

  - fixação da porta na posição aberta e travada; e

  - fixação da tira de segurança (se aplicável); e

  II. procedimentos para fechamento da saída em condição normal, incluindo:

  - remoção da tira de segurança (se aplicável);

  - liberação do mecanismo de travamento da porta;

  - posição correta do corpo para fechamento da porta;

  - operação correta dos controles da porta; e

  - fixação da saída na posição fechada e travada;'
