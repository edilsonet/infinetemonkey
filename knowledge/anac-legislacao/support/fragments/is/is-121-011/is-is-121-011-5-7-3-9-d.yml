text: 'd) Saídas sem escorregadeiras - pré-voo:

  I. identificação e função dos controles e indicadores da porta; e

  II. procedimentos para verificação pré-voo:

  - vedação das portas;

  - placares e marcações de saída;

  - sinais;

  - luzes;

  - alavancas; e

  - airstairs (se aplicável).'
