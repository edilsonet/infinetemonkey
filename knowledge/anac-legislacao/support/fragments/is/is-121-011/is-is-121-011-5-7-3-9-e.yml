title: 5.7.3.9(e)
text: 'e) Saídas sem escorregadeiras - operação normal:

  I. procedimentos para abertura da saída, incluindo:

  - posição correta do corpo para abertura da porta;

  - operação correta dos controles da porta;

  - fixação da saída na posição fechada e travada; e

  - fixação da tira de segurança e abaixamento das airstairs (se aplicável); e

  II. procedimentos para fechamento da saída, incluindo:

  - remoção da tira de segurança e subida das airstairs (se aplicável).

  - liberação do mecanismo de travamento da porta;

  - posição correta do corpo para fechamento da porta;

  - operação correta dos controles da porta; e

  - fixação da saída na posição fechada e travada; e'
