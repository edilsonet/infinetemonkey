title: 5.7.3.9(f)
text: 'f) Saídas nas janelas - pré-voo:

  I. identificação e funcionamento dos controles e indicadores das saídas nas janelas; e

  II. procedimentos para verificação pré-voo:

  - vedações das janelas;

  - marcações;

  - placares;

  - sinais;

  - luzes; e

  - indicadores táteis para condições não visuais.'
