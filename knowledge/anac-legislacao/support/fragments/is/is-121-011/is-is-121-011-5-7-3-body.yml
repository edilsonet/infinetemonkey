text: '5.7.3 Módulos de treinamento da área de assuntos gerais operacionais

  5.7.3.1 Os módulos de treinamento sobre assuntos gerais operacionais consistem em instrução
  sobre descrição geral, equipamentos, acessórios e sistemas da aeronave; procedimentos de
  coordenação e comunicação entre tripulantes; funções e procedimentos operacionais de rotina
  específicos de cada aeronave para cada fase do voo; responsabilidades para lidar com passageiros
  específicas da aeronave em que o comissário esteja se qualificando.'
