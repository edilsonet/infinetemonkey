title: 5.7.4(a)
text: 'a) Geral: tipos de emergência específicos de cada aeronave, incluindo:

  I. padronização de procedimentos entre tripulantes;

  II. coordenação e comunicação entre tripulantes; e

  III. utilização de equipamentos de emergência e implementação de procedimentos de emergência
  apropriados à aeronave específica;'
