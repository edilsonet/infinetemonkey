title: 5.7.4(b)
text: 'b) Saídas com escorregadeiras ou escorregadeiras-bote - operação de emergência:

  I. procedimentos para armar a saída no modo de emergência, incluindo:

  - garantia de que as portas estão completamente fechadas e travadas;

  - verificação de que a soleira da porta está livre de detritos;

  - armação da porta manual ou automaticamente; e

  - verificação do engate da barra de fixação; e

  II. procedimentos para abertura da saída no modo de emergência, incluindo:

  - avaliação das condições externas antes da abertura das saídas;

  - posição de proteção do corpo correta para abrir a porta;

  - operação dos controles da porta corretamente;

  - verificação de que a porta está na posição aberta e travada;

  - uso do sistema de enchimento manual para realizar ou garantir o acionamento da escorregadeira
  ou escorregadeira-bote;

  - avaliação das condições e estabilização da escorregadeira ou escorregadeira-bote;

  - uso da escorregadeira como dispositivo de escape manual;

  - operação das saídas em condições adversas, como vento, tempestades e fogo na escorregadeira;

  - passagem rápida pela saída; e

  - identificação e uso de uma rota de fuga segura;'
