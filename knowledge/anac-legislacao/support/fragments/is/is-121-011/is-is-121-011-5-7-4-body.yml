text: '5.7.4 Módulos de treinamento da área de emergências específicas da aeronave

  5.7.4.1 Módulos do treinamento de emergências específicas da aeronave consistem em instrução
  sobre localização, função e operação dos equipamentos de emergência; atribuições e procedimentos
  em situações de emergência, incluindo coordenação e comunicação entre tripulantes; gerenciamento
  da emergência e outras situações anormais; e exercícios práticos de emergência específicos
  da aeronave em que o tripulante estiver se qualificado.

  5.7.4.2 A instrução sobre equipamentos de emergência específicos da aeronave e os exercícios
  práticos de emergência específicos da aeronave devem ser ministrados sob a área de treinamento
  de emergências específicas da aeronave somente se não tiverem sido previamente ensinados
  no segmento de currículo de emergências gerais. Por exemplo, se toda a frota do operador
  estiver equipada com o mesmo tipo de extintor de incêndio, este extintor de incêndio poderá
  ensinado como “geral” para todas as aeronaves no segmento de currículo de emergências gerais.
  Entretanto, se as diferentes aeronaves da frota do operador forem equipadas com diferentes
  tipos de extintores de incêndio, então cada tipo de extintor pode ser ensinado como “específico
  da aeronave” no segmento de currículo de solo de aeronave.

  5.7.4.3 O treinamento específico de aeronave deve incluir treinamento nos seguintes assuntos,
  para cada modelo, tipo, série e configuração de aeronave; cada tripulante requerido; e cada
