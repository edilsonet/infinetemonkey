cite: 5.7.4(c)
title: 5.7.4(c)
text: 'c) Escorregadeiras ou escorregadeiras-bote em pouso na água:

  I. identificação de saídas e escorregadeiras usáveis em um pouso na água;

  II. desativação de escorregadeiras ou escorregadeiras-bote inoperantes;

  III. acionamento, enchimento e desprendimento de escorregadeiras ou escorregadeiras-bote
  da aeronave;

  IV. procedimentos de evacuação sobre as asas, incluindo operação da escorregadeira ou escorregadeira-bote.

  V. movimento de escorregadeiras ou escorregadeiras-bote de porta a porta; uso de escorregadeiras
  montadas nas portas como plataformas de embarque nos botes;

  VI. uso de escorregadeiras montadas nas portas como dispositivos de flutuação; técnicas
  de embarque; e

  VII. destacamento do cabo de amarração da aeronave;'
