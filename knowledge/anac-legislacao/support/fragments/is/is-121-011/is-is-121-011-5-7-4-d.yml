title: 5.7.4(d)
text: 'd) Saídas sem escorregadeira - operação em emergência:

  I. avaliação das condições externas antes da abertura;

  II. posição de proteção do corpo correta para abrir a porta;

  III. operação dos controles da porta corretamente;

  IV. fixação da saída na posição aberta e travada;

  V. uso do sistema de emergência da airstair para descer as escadas (se aplicável);

  VI. operação das saídas em condições adversas;

  VII. passagem rápida pelas saídas; e

  VIII. identificação e uso de uma rota de fuga segura;'
