title: 5.7.4(e)
text: 'e) exercícios práticos de emergência.

  5.7.4.4 Módulos de treinamento aceitáveis estão descritos a seguir. Esses módulos de treinamento
  englobam diferentes tipos de operação e podem não ser aplicáveis ao tipo específico de operação
  de cada operador.

  5.7.4.5 Módulo: Equipamentos de emergência. Os elementos e eventos sobre equipamentos de
  emergência devem ser ministrados apenas se não tiverem sido cumpridos anteriormente no segmento
  de currículo de emergências gerais. Apenas os elementos e eventos aplicáveis a um modelo
  específico de aeronave ou tipo de operação devem ser realizados.'
