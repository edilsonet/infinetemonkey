title: 5.7.4(f)
text: 'f) Saídas pelo cone de cauda - operação em emergência (se aplicável):

  I. procedimentos para armar a saída no modo emergência, se aplicável; e

  II. procedimentos de abertura da saída, incluindo:

  - avaliação das condições externas antes da abertura;

  - remoção do dispositivo de proteção da alavanca de emergência (conforme aplicável);

  - posição de proteção do corpo correta para abrir a saída;

  - operação correta dos controles da porta e alavanca de emergência;

  - garantia de que a porta está na posição aberta e travada ou de que a trava está posicionada
  para impedir obstrução da evacuação, se aplicável;

  - caminhada em espaço estreito;

  - localização e uso da alavanca de alijamento para garantir alijamento do cone de cauda
  ou como procedimento de contingência;

  - uso do sistema de enchimento manual para realizar ou garantir o acionamento da escorregadeira;

  - avaliação das condições e estabilização da escorregadeira;

  - operação da saída em condições adversas, como vento, tempestades e fogo na escorregadeira;

  - posição de proteção correta do corpo na plataforma;

  - passagem rápida pela saída; e

  - identificação e uso de uma rota de fuga segura;'
