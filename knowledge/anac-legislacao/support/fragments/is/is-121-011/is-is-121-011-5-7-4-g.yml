title: 5.7.4(g)
text: 'g) Saídas da cabine de comando - operação em emergência. Procedimentos para abertura
  da saída, incluindo:

  I. avaliação das condições externas antes da abertura;

  II. posição de proteção do corpo correta para abrir a saída;

  III. operação correta dos controles da saída;

  IV. uso de cordas de escape;

  V. operação da saída em condições adversas;

  VI. passagem rápida pela saída; e

  VII. identificação e uso de uma rota de fuga segura;'
