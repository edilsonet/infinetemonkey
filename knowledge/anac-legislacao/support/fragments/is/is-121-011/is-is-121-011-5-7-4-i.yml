text: 'i) Exercício de evacuação de emergência com escorregadeira: durante este exercício,
  os alunos devem observar o acionamento e enchimento de uma escorregadeira, incluindo a saída
  de participantes da cabine de passageiros ou dispositivo de treinamento pela escorregadeira.'
