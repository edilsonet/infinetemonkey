title: 5.7.4(j)
text: 'j) Situações anormais envolvendo passageiros ou tripulantes: atribuições, procedimentos
  e comandos dos tripulantes envolvendo:

  I. passageiros maltratando comissários;

  II. passageiros aparentando estar sob influência de substâncias psicoativas; e

  III. passageiros que podem ameaçar a segurança da aeronave e de outros passageiros;'
