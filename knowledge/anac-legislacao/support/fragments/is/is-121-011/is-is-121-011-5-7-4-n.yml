title: 5.7.4(n)
text: 'n) Equipamento de emergência adicional: Conforme aplicável, descrição da localização,
  função, verificação pré-voo, remoção e operação de outros equipamentos de emergência.

  5.7.4.6 Módulo: Atribuições e procedimentos em emergência. Este módulo deve ser realizado
  em conjunto com os módulos de treinamento de situações de emergência do segmento de currículo
  de emergências gerais. Apenas os eventos e elementos específicos da aeronave e tipo de operação
  devem ser realizados.'
