  5.7.4.7 Módulo: Exercícios práticos de emergência. Os exercícios a seguir devem ser realizados
  somente se não tiverem sido realizados sob o segmento de currículo de emergências gerais.
  Os exercícios práticos de emergência específicos da aeronave devem ser realizados em conjunto
  com os exercícios práticos de emergência do segmento de currículo de emergências gerais:'
