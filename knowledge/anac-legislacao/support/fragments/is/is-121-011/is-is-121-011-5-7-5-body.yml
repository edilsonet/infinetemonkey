title: Relação entre o segmento de currículo de solo da aeronave e as categorias de treinamento
text: '5.7.5 Relação entre o segmento de currículo de solo da aeronave e as categorias de
  treinamento

  5.7.5.1 O segmento de currículo de solo de aeronave é requerido para as seguintes categorias
  de treinamento: inicial, transição, periódico e requalificação. Treinamento de diferenças
  para as diferentes variantes de um particular tipo de aeronave pode ser incluído no segmento
  de currículo de solo nos currículos inicial, transição e periódico. O treinamento de diferenças
  é requerido quando a ANAC determina que as diferenças entre a variante de um tipo e a aeronave
  base são tão grandes a ponto deste treinamento se tornar necessário. Como exemplo, um treinamento
  de diferenças pode ser apropriado quando as portas da cabine em diferentes aeronaves operam
  da mesma maneira, mas estão posicionadas em lugares significativamente diferentes. Quando
  for necessário o treinamento de diferenças, as horas programadas de treinamento devem ser
  especificadas pelo operador.'
