subsection_id: b
cite: 5.7.6.2(b)
title: 5.7.6.2(b)
text: b) o treinamento para uma operação complexa pode requerer uma carga horária além do
  exigido pelo RBAC nº 121, enquanto para operações menos complexas uma redução da carga horária
  pode ser aceitável (desde que aprovado pela ANAC, conforme a seção 121.405);
