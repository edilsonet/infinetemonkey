title: Carga horária
text: '5.7.6 Carga horária

  5.7.6.1 A seção 121.421, do RBAC nº 121, estabelece 8 horas programadas de treinamento inicial
  de solo para aviões do grupo I (motores convencionais e turboélices) e 16 horas para aviões
  do grupo II (jatos). A seção 121.427, do RBAC nº 121, estabelece 4 horas programadas de
  treinamento periódico de solo para aviões do grupo I com motores convencionais, 5 horas
  para aviões do grupo I com motores turboélice e 12 horas para aviões do grupo II.'
