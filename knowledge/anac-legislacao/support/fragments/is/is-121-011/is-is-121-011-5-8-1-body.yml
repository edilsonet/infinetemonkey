text: '5.8.1 Generalidades

  5.8.1.1 O parágrafo 121.421(b) do RBAC nº 121 requer, nas categorias de treinamento inicial
  e de transição, a realização de um exame de competência para determinar a capacidade do
  comissário na execução de seus deveres e responsabilidades. O parágrafo 121.433(c) do RBAC
  nº 121 requer que cada comissário complete treinamento periódico de solo e um exame de competência
  a cada 12 meses.

  5.8.1.2 A seção 121.434 do RBAC nº 121 estabelece que nenhum operador pode empregar um comissário
  como tripulante requerido em um tipo de avião, a menos que tenha completado, no específico
  tipo de avião e na específica função a bordo, a experiência de operação requerida pelo regulamento.'
