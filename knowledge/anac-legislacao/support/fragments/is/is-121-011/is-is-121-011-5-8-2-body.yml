title: Exame de competência
text: '5.8.2 Exame de competência

  5.8.2.1 O parágrafo 121.421(b), do RBAC nº 121, requer que o comissário demonstre seus conhecimentos
  e habilidades a um servidor designado da ANAC ou examinador credenciado do operador durante
  o exame de competência. Durante o exame, o candidato deverá demonstrar sua capacidade relativa
  às aeronaves e aos tipos de operação em que está se qualificando.'
