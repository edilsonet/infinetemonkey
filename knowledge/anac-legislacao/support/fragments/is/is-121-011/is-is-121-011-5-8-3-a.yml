cite: 5.8.3(a)
title: 5.8.3(a)
text: a) os mockups de cabine e dispositivos de treinamento de operação das portas em tamanho
  real devem ser avaliados e aprovados pela ANAC como parte do programa de treinamento do
  operador. A aprovação dos mockups de cabine e dispositivos de treinamento de operação das
  portas é concomitante com a aprovação do programa de treinamento dos comissários. Os mockups
  de cabine e os dispositivos de treinamento de operação das portas devem estar listados no
  programa de treinamento. Se o operador optar pelo uso de uma aeronave estática como dispositivo
  de treinamento, ela também deve estar listada no programa de treinamento. Se o operador
  utilizar uma aeronave real para treinamento, a ANAC irá avaliar o treinamento que será aplicado
  na aeronave antes de conceder crédito de horas. Os comissários alunos devem realmente utilizar
  os equipamentos e praticar os procedimentos normalmente esperados de um comissário requerido
  durante um voo. Este é também o tipo de prática que deve ser executada nos mockups de cabine
  e dispositivos de treinamento de operação das portas;
