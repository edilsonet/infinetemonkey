title: 5.8.3(b)
text: b) o princípio da utilização de mockups de cabine e dispositivos de treinamento de operação
  das portas é prover realismo durante o treinamento de situações de emergência. A ANAC irá
  avaliar o programa de treinamento do operador para determinar se os procedimentos (prática,
  carga horária, e cenários de voo realistas) realizados em mockup de cabine e outros dispositivos
  de treinamento estão adequados para permitir autorizar sua utilização;
