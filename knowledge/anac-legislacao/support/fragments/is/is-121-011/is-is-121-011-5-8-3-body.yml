title: Experiência de operação
text: '5.8.3 Experiência de operação

  5.8.3.1 O RBAC nº 121 requer que os comissários adquiram experiência de operação em rota
  - com exceção de comissários que tenham anteriormente adquirido tal experiência em qualquer
  outro grande avião do mesmo grupo transportando passageiros, desde que o detentor de certificado
  demonstre para a ANAC (e obtenha sua anuência) que esse comissário recebeu um treinamento
  de solo suficiente para assegurar competência no avião onde irá trabalhar. Os alunos devem
  executar, por no mínimo 5 horas, as atribuições de um comissário sob a supervisão direta
  e pessoal de um comissário instrutor de rota, qualificado segundo o regulamento. Para alunos
  em processo de obtenção da licença de comissário, esta experiência pode ser utilizada simultaneamente
  também para cumprimento dos requisitos da seção 63.77 do RBAC nº 63, desde que cumpridas
  as condições ali estabelecidas. A experiência de operação é requerida para os comissários
  se tornarem plenamente qualificados para trabalhar em operações sob o RBAC nº 121.

  5.8.3.2 A experiência de operação fornece ao operador aéreo a oportunidade de familiarizar
  os comissários sob qualificação com sons e manobras da aeronave associadas a operações de
  rotina, enfatizando as sequências normais de tempo disponíveis durante o voo e proporcionando
  aos comissários experiência prática no desempenho de tarefas e procedimentos rotineiros.
  A experiência de operação também fornece ao operador a chance de garantir que o comissário
  seja capaz de aplicar as lições aprendidas durante o treinamento inicial e que ele tenha
  a capacidade de assumir deveres durante um voo.

  5.8.3.3 A experiência de operação deverá ser obtida após conclusão satisfatória do treinamento
  apropriado, que inclui os segmentos de currículo aplicáveis ao comissário listados no parágrafo
  5.2.2 desta IS - à exceção do próprio segmento de currículo de qualificação, do qual a experiência
  de operação faz parte.

  5.8.3.4 Os operadores devem prover experiência de operação durante operações comerciais
  de transporte de passageiros sob RBAC nº 121. Esses voos devem ser representativos da estrutura
  de rotas e horários do operador e, quando possível, devem consistir em pelo menos dois pousos
  e decolagens. Os operadores devem descrever no programa de treinamento sua política de escolha
  dos voos que serão utilizados para aquisição de experiência operacional. De forma a permitir
  o devido acompanhamento do instrutor, recomenda-se que sejam escolhidos voos com pelo menos
  2h de duração, quando a estrutura de rotas do operador permitir.

  5.8.3.5 Os comissários sob qualificação que estão adquirindo experiência de operação devem
  ser designados como membros da tripulação, porém devem estar além do número mínimo de comissários
  plenamente qualificados (conforme definido nos manuais do operador). Comissários em experiência
  de operação não devem ocupar um assento de comissário requerido. Os assentos de comissários
  requeridos são aqueles estabelecidos quando o operador conduz uma demonstração parcial de
  evacuação de emergência para obter a autorização para operar a aeronave. Para alterar a
  localização das posições de comissários, a seção 121.291 do RBAC nº 121 determina que o
  operador deve realizar uma nova demonstração parcial de evacuação.

  5.8.3.6 Apesar de os comissários sob qualificação não poderem ser designados como membros
  da tripulação requerida, eles devem ter a oportunidade de praticar todos os deveres de um
  comissário enquanto sob supervisão de um instrutor de rota. Para os operadores que operam
  aviões com requisito para apenas um único comissário e são equipados com apenas um assento
  de comissário, recomenda-se o desenvolvimento de um programa que permita a um comissário
  recém-qualificado, que já completou a experiência de operação, a oportunidade de exercer,
  sob supervisão, seus deveres a partir do assento de comissário requerido.

  5.8.3.7 Após completar a experiência de operação, os comissários alunos devem participar
  de um debriefing, incluindo a discussão de questões de segurança operacional observadas.
  No mínimo, o debriefing deve incluir a discussão sobre quaisquer verificações ou usos dos
  equipamentos de emergência; as instruções de segurança aos passageiros; uso do cinto de
  segurança pelos passageiros; aplicação das regras sobre bagagem de mão; coordenação entre
  tripulantes; e gerenciamento de situações anormais com passageiros.

  5.8.3.8 Os operadores devem desenvolver procedimentos para garantir que um instrutor de
  rota que irá supervisionar um voo de experiência de operação de um comissário receba e esteja
  ciente do histórico prévio dos outros voos de experiência de operação desse comissário.
  Dessa forma, o instrutor de rota pode avaliar mais adequadamente o comissário e, especialmente,
  o último instrutor de rota pode certificar a conclusão da experiência de operação. Um método
  de garantir esse acompanhamento é adotar uma escala casada entre instrutor e aluno, de forma
  que o mesmo instrutor acompanhe toda a experiência de operação do aluno.

  5.8.3.9 O parágrafo 121.434(e) do RBAC nº 121 requer que os comissários em qualificação
  adquiram experiência de operação exercendo as atribuições de um comissário sob supervisão
  de um instrutor de rota qualificado segundo o RBAC nº 121. Os operadores devem designar
  os instrutores de rota, ou seja, as pessoas autorizadas a realizar essa função de supervisão.
  Esses instrutores devem ser experientes nos deveres e responsabilidades de um comissário
  e qualificados para instruir e avaliar os comissários alunos. Os operadores devem fornecer
  aos instrutores treinamento adicional e/ou orientações específicas sobre como conduzir voos
  de aquisição de experiência de operação. Os instrutores devem estar qualificados no tipo
  de aeronave. Os pré-requisitos sobre os instrutores autorizados a supervisionar a aquisição
  de experiência de operação devem ser incluídos no programa de treinamento do operador, incluindo
  a descrição do treinamento adicional e/ou orientações específicas que devem ser fornecidas
  a esses profissionais.

  5.8.3.10 Novos operadores ou operadores introduzindo um novo modelo de aeronave na frota
  estão na condição particular de não possuírem comissários plenamente qualificados para as
  operações. Tais operadores devem designar uma turma inicial de comissários para atuar como
  instrutores de rota enquanto ministram a aquisição de experiência de operação uns aos outros.
  Esses comissários já devem possuir experiência prévia em operações segundo o RBAC nº 121
  e em aeronaves do mesmo grupo que está sendo introduzido na frota. A aquisição de experiência
  de operação dessa turma inicial de comissários deve ocorrer durante voos de translado ou
  voos de avaliação operacional. O número de comissários em experiência de operação em voos
  de translado ou voos de avaliação operacional não deve exceder o número de comissários requeridos
  pelos manuais do operador. Os integrantes dessa turma inicial de comissários devem ser posteriormente
  designados como instrutores da aquisição de experiência de operação dos demais comissários
  em voos comerciais sob o RBAC nº 121.

  5.8.3.11 Segundo os RBAC nº 63 e 121, os alunos devem adquirir um total de 5 horas de experiência
  de operação. Pode ser autorizada a realização de até 50% dessas horas em um mockup de cabine
  ou um dispositivo de treinamento aprovado, se a ANAC determinar que o operador possui mockups
  de cabine e dispositivos de treinamento que forneçam a qualidade de experiência necessária
  para simular um voo real. O tempo de experiência de operação no mockup de cabine pode ser
  utilizado na realização de atividades como uso do sistema sonoro de aviso aos passageiros
  (public address system - PA), briefings pré-voo, instruções de segurança, utilização de
  assentos nas saídas de emergência e procedimentos com bagagens de mão. A autorização para
  realização de 50% de experiência de operação em mockup de cabine ou um dispositivo de treinamento
  pode ser concedida se o operador dispuser de um mockup de cabine nível 5 e a ANAC determinar
  que o restante do programa de treinamento é de qualidade adequada. Eventuais autorizações
  deverão ser baseadas na qualidade dos mockups, como segue:'
