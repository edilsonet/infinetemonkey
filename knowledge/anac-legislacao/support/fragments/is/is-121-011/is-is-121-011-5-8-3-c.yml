title: 5.8.3(c)
text: 'c) aos mockups de cabine e dispositivos de treinamento de operação das portas são atribuídos
  níveis de acordo com sua aproximação ao realismo. O nível 1 é o mais básico, e o operador
  recebe menos crédito em um mockup nível 1 do que em um mockup nível 5. Para receber crédito
  de um mockup nível 5, todas as características listadas na Tabela 1 devem estar presentes.
  No entanto, se o dispositivo não possuir todas as características indicadas na Tabela 1,
  a ANAC pode considerar outras características listadas na Tabela 2 e Tabela 3 para decidir
  qual nível de crédito é apropriado para o tipo de experiência que pode ser adquirida no
  mockup de cabine ou dispositivo de treinamento de operação das portas do operador.

  Tabela 1 - Orientação para avaliação de um mockup de cabine em tamanho real (exceto no comprimento)
  para fins de crédito da carga horária de experiência de operação.

