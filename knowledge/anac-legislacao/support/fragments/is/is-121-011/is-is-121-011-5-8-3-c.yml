  Tabela 2 - Avaliação de dispositivo de treinamento de portas

  Dispositivo de porta

  Critérios

  Escala da porta/ saída

  Tamanho e peso projetados de acordo com as alavancas reais das portas

  Movimento da saída

  Reproduz a amplitude total da aeronave para incluir abertura, fechamento e operação de emergência.

  Saída inoperante

  Método de demonstração de que está inoperante.

  Assento de comissário

  Localização real na aeronave.

  Painel de comissário

  Posição aproximada em relação à saída e ao assento de comissário.

  Escorregadeira ou escorregadeira-bote simulada

  Forças similares às necessárias para abrir numa situação de emergência

  Meios de enchimento manual

  Podem ser posicionadas para simular diferentes localizações causadas por um acidente.

  Saída da janela

  Peso e tamanho reais


  Tabela 3 - Avaliação de outros dispositivos de treinamento

  Outros dispositivos/simuladores

  Critérios

  Simulação de combate ao fogo.

  O equipamento deve ter meios para demonstrar que o fogo foi extinto.

  Sistema de comunicação (interfone/PA)

  Similaridade com os equipamentos da aeronave real.

  Computador de simulação de evacuação

  Precisão e complexidade dos modelos computacionais

  Suportes e equipamentos de emergência portáteis funcionais

  Forças necessárias para remover e recolocar o equipamento são representadas acuradamente.

  Assentos de comissários equipados com retração

  Sistema de retração real, espaço real para usar o sistema (por exemplo, duas pessoas em
  um assento duplo ou quando o assento está localizado em área confinada).

  Equipamento para simular despressurização

  Capacidade para acionar as máscaras manualmente e automaticamente e/ou simular sinais de
  despressurização (ruído e vapor).

  Programa de treinamento adicional baseado em computador

  Adequação do programa.


