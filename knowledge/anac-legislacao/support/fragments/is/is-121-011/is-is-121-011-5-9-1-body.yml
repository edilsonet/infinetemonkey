text: '5.9.1 Generalidades

  5.9.1.1 Esta seção contém diretrizes e orientações a serem utilizadas pelos operadores para
  elaboração e aprovação dos segmentos de currículo especiais. Para esse fim, os operadores
  devem estar cientes da seguinte distinção entre treinamento básico e treinamento especial:

  5.9.1.2 Treinamento básico. As cinco categorias de treinamento definidas no RBAC nº 121
  (inicial de nova contratação, inicial de equipamento, transição, periódico e requalificação)
  contêm o treinamento básico necessário para comissários se qualificarem numa aeronave específica.
  Todos os operadores devem fornecer esse treinamento básico. Os métodos e eventos de treinamento
  estão especificados nos regulamentos ou em outros normativos específicos e são bem compreendidos
  na indústria de transporte aéreo.

  5.9.1.3 Treinamento especial. O treinamento "especial" é o conduzido por um operador para
  qualificar tripulantes e despachantes além do escopo do treinamento básico. Cada operador
  é obrigado a realizar apenas o treinamento especial necessário para as suas operações específicas.
  Elementos e eventos de treinamentos especiais podem ser integrados em uma ou mais das cinco
  categorias de treinamento definidas ou conduzidos como um segmento de currículo separado.
  Normalmente é necessário treinamento especial para operações que exigem autorização específica
  nas EO ou que são aplicáveis para um grupo limitado de aeronaves e/ou tripulantes. Situações
  que podem demandar a realização de treinamento especial incluem, mas não se limitam a:'
