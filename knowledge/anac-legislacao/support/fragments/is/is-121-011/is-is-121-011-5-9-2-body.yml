title: Conteúdo do treinamento especial
text: '5.9.2 Conteúdo do treinamento especial

  5.9.2.1 Os operadores devem garantir que seus treinamentos especiais contenham os elementos
  e eventos necessários e apropriados para qualificar seus tripulantes numa determinada operação
  específica. Uma vez que os operadores podem desenvolver treinamento especial para atingir
  quase qualquer objetivo, o conteúdo do currículo deve ser resultado do objetivo específico
  e não deve ser mais ou menos do que o necessário para alcançar esse objetivo. Os treinamentos
  especiais devem ser desenvolvidos a partir de objetivos claramente definidos, análise das
  tarefas e padrões de desempenho estabelecidos. O treinamento especial deve ser elaborado
  para desenvolver os conhecimentos, as habilidades e os julgamentos de cada tripulante no
  desempenho das tarefas determinadas. O treinamento especial deve conter critérios de qualificação
  para a avaliação da habilidade de cada tripulante para executar as tarefas indicadas dentro
  do padrão estabelecido. Dependendo do caso, segmentos de currículo de treinamentos especiais
  devem ser aplicados de forma periódica.'
