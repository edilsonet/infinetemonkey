title: APÊNDICE B - PROCEDIMENTOS PARA REALIZAÇÃO DE EXAME DE COMPETÊNCIA PARA COMISSÁRIOS
  DE VOO
text: 'APÊNDICE B - PROCEDIMENTOS PARA REALIZAÇÃO DE EXAME DE COMPETÊNCIA PARA COMISSÁRIOS
  DE VOO

  B1. Este apêndice estabelece os procedimentos para realização dos exames de competência
  para comissários de voo, em atendimento aos parágrafos 121.421(b), 121.427(b)(3) e 121.7433(c)(1)(ii)
  do RBAC nº 121.

  B2. O examinador credenciado deve preparar o exame utilizando-se dessas orientações, porém
  os procedimentos a serem verificados devem estar em conformidade com os manuais do detentor
  de certificado, como o MGO, MCmsV e o programa de treinamento aprovado.

  B3. Estrutura do exame de competência

  B3.1. O exame de competência consiste em duas partes: demonstração de conhecimentos inerentes
  ao exercício da função (arguição oral) e demonstração prática com realização de tarefas
  (aplicação de seu conhecimento e sua habilidade).

  3.2. O teste de conhecimento consiste em perguntas orais feitas ao candidato.

  B3.3. Tais questões devem ser elaboradas a partir dos manuais, leis e regulamentos estabelecidos
  para a atividade em questão ou outra bibliografia com a qual o candidato esteja familiarizado.

  B3.4. As perguntas devem ser formuladas com clareza, não cabendo dúvida quanto ao que se
  espera do candidato.

  B3.5. Caso o candidato responda seguidamente de maneira confusa ou incorreta, o examinador
  deve descontinuar o exame e considerá-lo como reprovado.

  B3.6. O examinador deve anotar os itens deficientes do teste de conhecimento do candidato,
  para identificar possíveis deficiências que possam afetar seu desempenho durante a execução
  das tarefas na operação da aeronave. Esses pontos devem ser detalhados no aviso de reprovação
  para que sejam sanadas as deficiências em treinamento de requalificação.

  B3.7. A demonstração prática deve ser realizada em aeronave estática ou em um dispositivo
  de treinamento aprovado. Nessa demonstração o candidato deve aplicar seu conhecimento e
  sua habilidade na realização das tarefas pertinentes à sua atividade de trabalho.

  B3.8. O examinador deve observar cuidadosamente as situações simuladas, anotando com o maior
  acuracidade possível a habilidade do candidato, indicando e comentando as deficiências,
  caso existam.

  B3.9. Quando houver modelos de aeronaves com configurações diferentes, as diferenças entre
  as configurações devem ser abordadas pelo examinador durante o exame.

  B4. Realização do exame de competência

  B4.1. Preparação para o exame

  B4.1.1. É recomendável, sempre que possível, conhecer os registros individuais dos candidatos,
  como os registros do treinamento inicial ou dos treinamentos e exames anteriores. Este procedimento
  permite que seja feita uma rápida análise do candidato, verificando se há alguma deficiência
  que possa ser identificada durante o exame.

  B4.2. Briefing

  4.2.1. O examinador deve conduzir um briefing antes do exame de competência, definindo os
  procedimentos de segurança, as tarefas e responsabilidades durante o exame. Recomendações
  do fabricante ou do operador devem ser discutidas durante o briefing. e Devem ser discutidos
  os métodos a serem utilizados no exame, indicando os parâmetros que orientam a avaliação.

  B4.2.2. O briefing deve ocorrer independentemente da experiência e habilidade do aluno.

  B4.3. Debriefing

  B4.3.1. O debriefing é parte importante do exame, na qual deve ser realizada uma explanação
  geral do exame realizado, indicando primeiramente os aspectos positivos. Caso haja aspectos
  negativos, estes devem ser passados ao candidato, devendo o examinador ser claro e objetivo,
  explicando os erros e justificando suas críticas. Posteriormente, o examinador pode também
  comentar dos resultados com a chefia responsável pela instrução.

  B4.3.2. A avaliação deve ser destituída de qualquer caráter pessoal, tais como simpatia
  ou antipatia pelo candidato.

  B4.3.3. As pessoas são diferentes e assumem posturas diversas na avaliação. Cabe ao Examinador
  interpretar cada uma delas no seu julgamento.

  B4.4. Ficha de avaliação de comissário (FAC)

  B4.4.1. O preenchimento da ficha de avaliação de Comissário (conforme modelo disponível
  em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios)
  deve ser realizado em um local apropriado para que não haja a quebra de sigilo, evitando
  assim um possível constrangimento do candidato. A FAC deve, ainda, ser preenchida sem rasura
  e com detalhamento capaz de identificar os pontos fracos do candidato, facilitando posteriormente
  a recuperação das deficiências pelo setor de instrução.

  B4.4.2. Não devem ser omitidas informações quando for preenchida a FAC, pois elas são de
  grande valia na próxima verificação do candidato.

  B4.4.3. O examinador deve entregar a FAC ao setor responsável.

  B4.5. Reprovação de candidato

  B4.5.1. O examinador credenciado deve preencher aviso de reprovação (conforme modelo disponível
  em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios),
  detalhando os itens deficientes.

  B4.5.2. O examinador deve entregar o aviso de reprovação, junto da FAC, ao setor responsável,
  de modo a viabilizar a notificação à ANAC, conforme o parágrafo 5.11.4.3 desta IS.

  B4.5.3. O solicitante que não obtiver aprovação na verificação de competência somente pode
  requerer autorização para realizar nova verificação após ter comprovado ter feito um novo
  treinamento corretivo das deficiências que provocaram sua reprovação, conforme o parágrafo
  5.11.4 desta IS. Novas tentativas posteriores com meta à aprovação devem seguir o mesmo
  procedimento.

  B5. Detalhamento da avaliação

  B5.1. Visando condução de exames de competência de forma padronizada por todos os examinadores
  do detentor de certificado, o detentor de certificado deve estabelecer especificamente quais
  procedimentos devem ser avaliados para cada item da FAC (conforme exemplo disponível em
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios),
  em conformidade com o previsto nos manuais do detentor de certificado (como o MCmsV). Tal
  detalhamento deve se iniciar, quando possível, com um verbo no infinitivo (detalhar, utilizar,
  manusear, verificar etc...). Deve ainda estabelecer nível de desempenho associado ao procedimento,
  conforme B5.3.3 deste Apêndice.

  B5.2. Cabe ao examinador analisar os itens, comparando-os com os procedimentos dos manuais
  do detentor de certificado. Caso o examinador observe alguma discrepância, ele deve informar
  ao setor de instrução e proceder às modificações imediatamente.

  B5.3. Competência

  B5.3.1. Competência é definida como a combinação de conhecimento, habilidades e atitudes
  requeridas para desempenhar uma tarefa no padrão requerido pela empresa. Os padrões de competência
  especificam todas as habilidades que devem ser demonstradas pelos profissionais na sequência
  desejada para obter uma licença ou um certificado. Com este propósito são definidos cinco
  níveis de desempenho para melhor avaliar o profissional.

  B5.3.2. A competência para a profissão do comissário de bordo requer, além dos requisitos
  de conhecimento, práticas e atitudes, capacidades de relacionar causas e consequências,
  discernir situações de perigo eminente, organizar os dados relacionados aos passageiros,
  comunicar-se com outros membros da equipe responsável pelo voo e, sobretudo, uma atuação
  pautada pelos padrões exigidos pela autoridade aeronáutica e pela empresa.

