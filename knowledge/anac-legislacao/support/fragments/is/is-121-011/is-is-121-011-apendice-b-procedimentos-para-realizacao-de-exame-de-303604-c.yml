text: 'c) abrangência: a avaliação deve fornecer uma amostra de todos os conhecimentos que
  estão sendo medidos, ou seja, ela deve ser representativa de forma a abranger todos os objetivos
  da avaliação.

  B5.4.2. Um dos maiores obstáculos a uma avaliação perfeita está na subjetividade que envolve
  o julgamento. Quando se avaliam conhecimentos nos quais se podem empregar testes escritos,
  os resultados podem ser praticamente isentos de interpretações pessoais. Isso não ocorre
  quando se analisam itens para os quais o julgamento está sujeito às influências psicológicas
  do examinador. Nestes casos, as avaliações podem ser “contaminadas” pelo que chamamos de
  erros de apreciação, classificados da seguinte forma:'
