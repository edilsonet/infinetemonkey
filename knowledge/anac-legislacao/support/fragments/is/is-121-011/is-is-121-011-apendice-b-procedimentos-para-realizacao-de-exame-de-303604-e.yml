text: 'e) nível 5 - atividade de trabalho de substancial autonomia e responsabilidade sobre
  recursos humanos e materiais. Compreende competências que implicam na aplicação de uma significativa
  amplitude de princípios fundamentais e técnicas complexas ao longo de uma vasta e imprevisível
  variedade de contextos.

  B5.4. Princípios básicos sobre avaliação

  B5.4.1. Na prática, a avaliação dos conhecimentos técnicos de um comissário se faz por meio
  da observação do seu desempenho operacional, na demonstração prática com realização de tarefas
  em situações normais e anormais de voo e na arguição oral durante o exame. Para que essa
  avaliação seja um eficiente instrumento de medida, é preciso cumprir três requisitos básicos:'
