title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, no RBAC
  nº 121, na IS nº 121-006 e as seguintes definições:

  4.1.1 airstairs: conjunto de degraus embutidos em uma aeronave que permitem o embarque e
  desembarque dos passageiros. As escadas são normalmente construídas em uma porta em estilo
  concha na aeronave, eliminando a necessidade de uso de uma ponte ou escada móvel para embarque
  e desembarque dos passageiros;'
