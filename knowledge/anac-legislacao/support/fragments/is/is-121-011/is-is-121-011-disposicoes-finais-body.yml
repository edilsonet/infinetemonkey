title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 O detentor de certificado pode utilizar um programa de treinamento operacional aprovado
  anteriormente à vigência desta revisão da IS. Esse programa de treinamento operacional deve
  ser revisado caso a ANAC considere ser necessária a adequação do programa às disposições
  desta revisão da IS.

  7.2 Os casos omissos serão dirimidos pela SPO.'
