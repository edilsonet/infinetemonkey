section_title: Ponto de entrada ETOPS significa o primeiro ponto da rota em um voo ETOPS que
  seja parte de uma área de operações ETOPS.
subsection_id: a
cite: 4.1.10(a)
title: 4.1.10(a)
text: 'a) grupo 1: sistema significativo que:

  i. tenha características de operação segura diretamente relacionadas ao grau de redundância
  provido pelo número de motores do avião;

  ii. seja um sistema cuja falha ou mau funcionamento pode resultar em uma parada de motor
  em voo (IFSD), perda de controle de empuxo ou outra perda de potência;

  iii. contribua significativamente para a segurança de um desvio para alternativa ETOPS,
  por prover redundância adicional para uma perda de uma fonte de potência, como resultado
  de um motor inoperante; e

  iv. seja essencial para a operação do avião por um período prolongado a altitudes de voo
  com um motor inoperante; e'
