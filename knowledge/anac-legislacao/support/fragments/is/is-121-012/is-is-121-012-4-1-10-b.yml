cite: 4.1.10(b)
title: 4.1.10(b)
text: 'b) grupo 2: sistema significativo que não é do grupo 1. Falhas de sistemas do grupo
  2 não resultam em perda de desempenho do avião nem em problemas no ambiente da cabine, mas
  podem resultar em desvios para alternativa ou retornos do voo.'
