text: '4.1.10 Ponto de entrada ETOPS significa o primeiro ponto da rota em um voo ETOPS que
  seja parte de uma área de operações ETOPS.

  4.1.11 Ponto equidistante em tempo (ETP - Equal-time point) significa um ponto na rota do
  voo a partir do qual o tempo de voo para dois aeródromos, considerando as condições atmosféricas
  (como vento e temperatura) e os níveis de voo utilizados, é igual.

  4.1.12 Sistema significativo ETOPS significa um sistema do avião, incluindo o sistema de
  propulsão, cuja falha ou mau funcionamento pode afetar adversamente a segurança de um voo
  ETOPS, ou a continuação segura do voo e pouso do avião durante um desvio para alternativa
  ETOPS. Subdivide-se em:'
