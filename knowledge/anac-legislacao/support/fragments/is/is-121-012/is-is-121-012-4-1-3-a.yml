section_title: 'Área de operações ETOPS significa área formada pela região que atende simultaneamente
  os dois requisitos a seguir:'
subsection_id: a
cite: 4.1.3(a)
title: 4.1.3(a)
text: 'a) distante mais de:

  i. 75 minutos de um aeródromo adequado, considerando a velocidade de cruzeiro com um motor
  inoperante sob atmosfera padrão e ar calmo, para aviões com dois motores a turbina; ou

  ii. 180 minutos de um aeródromo adequado, considerando a velocidade de cruzeiro com um motor
  inoperante sob atmosfera padrão e ar calmo, para aviões com mais de dois motores a turbina
  em operações de transporte de passageiros; e'
