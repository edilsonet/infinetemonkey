id: is-is-121-012-4-1-3-b
kind: is
document: is-121-012
family: '121'
section_id: 4.1.3
section_title: 'Área de operações ETOPS significa área formada pela região que atende simultaneamente
  os dois requisitos a seguir:'
subsection_id: b
cite: 4.1.3(b)
title: 4.1.3(b)
text: 'b) dentro do tempo de desvio máximo aprovado para o detentor de certificado, para a
  operação sendo conduzida, considerando a velocidade de cruzeiro com um motor inoperante
  sob atmosfera padrão e ar calmo.

  Nota 1: para operações cargueiras com aviões com mais de dois motores não é definida área
  de operações ETOPS, pois os requisitos ETOPS não se aplicam a tais operações.

  Nota 2: para o cálculo da área de operações, essa distância é considerada entre um ponto
  da rota e o sobrevoo do aeródromo adequado, sem considerar a necessidade de cumprir rotas
  de voo específicas ou de realizar perfil de descida ou procedimentos de aproximação para
  o aeródromo adequado.'
