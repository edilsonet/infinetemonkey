text: '4.1.6 Despacho de voo, apenas para os fins desta IS, inclui também a liberação de voo
  (aplicável a operações não regulares).

  4.1.7 Documento de configuração, manutenção e procedimentos (CMP) significa um documento
  aprovado pela ANAC que contém configuração mínima, requisitos de operação e de manutenção,
  limites de tempo de hardware e restrições da MMEL necessárias para uma combinação avião-motor
  atender os requisitos de aprovação de projeto de tipo ETOPS.

  4.1.8 Manutenções concomitantes significa ações de manutenção realizadas no mesmo elemento
  de sistemas significativos ETOPS iguais ou similares, embora separados, durante manutenção
  programada ou não programada.

  4.1.9 Operação prolongada (ETOPS - Extended operations) significa uma operação de voo com
  um avião, exceto um avião com mais de dois motores em operações cargueiras, em que uma parte
  do voo é operada em área de operações ETOPS.'
