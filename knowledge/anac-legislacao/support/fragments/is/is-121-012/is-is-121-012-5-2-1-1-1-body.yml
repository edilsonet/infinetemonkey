  5.2.1.1.1.8 Da tabela, vê-se que a distância de desvio máxima depende do peso do avião no
  ponto em que se inicia o desvio (ponto crítico). Para uma estimativa conservadora, pode-se
  considerar o peso esperado do avião assumindo que o avião decolou com o peso máximo de decolagem
  certificado, descontando-se o consumo de combustível esperado desde a decolagem até o ponto
  crítico. Para uma dada velocidade escolhida, quanto maior o peso, menor a distância de desvio
  máxima, ou seja, menor a área de operações ETOPS. O detentor de certificado deve atentar
  para essa relação no seu planejamento de voo de forma a garantir que, para o peso com que
  o avião for despachado (que determina o peso com que o avião deverá chegar no ponto crítico),
  os aeródromos de alternativa ETOPS estarão, de fato, na área de operações ETOPS correspondente.'
