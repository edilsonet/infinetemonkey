title: Área de operações ETOPS.
text: '5.2.1.1.3 Área de operações ETOPS.

  5.2.1.1.3.1 O detentor de certificado deve obter a área de operações ETOPS com base nos
  aeródromos adequados e na distância de desvio máxima (por sua vez obtida com base na velocidade
  com um motor inoperante aprovada e no tempo de desvio máximo autorizado).

  5.2.1.1.3.2 Para as operações ETOPS 240 minutos e ETOPS além de 240 minutos, o detentor
  de certificado deve considerar as áreas autorizadas nas EO, conforme Seção I, (i) e (j)
  do Apêndice P do RBAC nº 121.

  5.2.1.1.3.3 Caso o detentor de certificado opte por realizar seus voos com procedimentos
  específicos para cada tempo de desvio máximo autorizado (conforme Nota 2 ao parágrafo 5.2
  desta IS), deve ser identificada a área de operações ETOPS associada a cada tempo de desvio
  máximo.'
