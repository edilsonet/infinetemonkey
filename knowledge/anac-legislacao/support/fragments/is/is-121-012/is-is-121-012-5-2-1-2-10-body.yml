title: Sistemas de navegação
text: '5.2.1.2.10 Sistemas de navegação

  5.2.1.2.10.1 O detentor de certificado deve verificar que instalações de navegação adequadas
  à rota estão disponíveis, considerando a precisão de navegação requerida para a rota e altitude
  do voo, incluindo os desvios para os aeródromos de alternativa ETOPS e as navegações para
  aproximação e pouso (121.103 e 121.607 para operações regulares; e 121.121 e 121.609 para
  operações não regulares) e são adequadas para uso pelo sistema de navegação do avião requerido
  pela seção 121.349 do RBAC nº 121.'
