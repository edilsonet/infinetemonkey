text: 'c) deve atender aos mínimos meteorológicos aplicáveis aos aeródromos de alternativa
  ETOPS (121.624), considerando todo o período em que é previsto pouso naquele aeródromo.

  Nota: o parágrafo 5.2.1.2.4.4.1 desta IS esclarece como calcular o período em que é previsto
  pouso em um aeródromo de alternativa.

  5.2.1.2.4.2 Critérios para escolha de aeródromo de alternativa ETOPS. Entre os aeródromos
  que cumpram os requisitos, devem ser selecionados os seguintes como aeródromos de alternativa
  ETOPS:'
