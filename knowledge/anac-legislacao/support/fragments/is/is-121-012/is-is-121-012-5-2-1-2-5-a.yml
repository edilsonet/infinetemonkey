title: 5.2.1.2.5(a)
text: a) o tempo de desvio máximo autorizado para o voo. Esse tempo deve ser limitado pelo
  tempo de desvio máximo autorizado para o detentor de certificado para a combinação avião-motor
  específica e, se aplicável, área de operações específica. A existência de itens inoperantes
  é um exemplo de fator que pode fazer com que o tempo de desvio máximo autorizado para o
  voo seja inferior ao tempo máximo autorizado para o detentor de certificado;
