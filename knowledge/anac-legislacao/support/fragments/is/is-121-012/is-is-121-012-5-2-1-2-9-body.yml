text: '5.2.1.2.9 Cálculo de combustível (121.646(b)).

  5.2.1.2.9.1 No cálculo do combustível, devem ser consideradas todas as condições meteorológicas
  esperadas, incluindo especificamente o vento. Os requisitos de combustível para operações
  ETOPS devem ser calculados em paralelo aos requisitos aplicáveis às operações não ETOPS,
  ou seja, não são parcelas adicionais de combustível. A quantidade de combustível deve ser
  igual ao maior valor entre:'
