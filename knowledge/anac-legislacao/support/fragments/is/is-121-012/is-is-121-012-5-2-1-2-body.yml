title: Planejamento de voo.
text: '5.2.1.2 Planejamento de voo.

  5.2.1.2.1 O detentor de certificado deve garantir que apenas aviões autorizados a conduzir
  operações ETOPS, conforme estabelecido em sua Lista de Matrículas Autorizadas, podem ser
  despachados para operações ETOPS.

  5.2.1.2.2 O detentor de certificado deve garantir que todos os tripulantes que realizem
  operações ETOPS, bem como os DOVs responsáveis por esses voos, sejam treinados, e permaneçam
  treinados, nos aspectos únicos dessas operações.

  Nota: o programa de treinamento é descrito no parágrafo 5.2.7 desta IS.

  5.2.1.2.2.1 Conforme descrito no parágrafo 5.2.7.2 desta IS, essa verificação pode ser realizada
  pelo menos de duas formas: com o treinamento de todos os tripulantes/DOVs do detentor de
  certificado que trabalham com determinado modelo de aeronave; ou com o treinamento apenas
  de um grupo específico desses tripulantes/DOVs. Nesse último caso, o detentor de certificado
  deve ter procedimentos para registrar quais tripulantes e DOVs cumpriram o programa de treinamento
  específico para operações ETOPS e para garantir que tripulantes e DOVs somente serão designados
  para um voo ETOPS se for verificado que cada tripulante e cada DOV cumpriu o programa de
  treinamento específico para operações ETOPS.'
