section_title: 'Documentação do despacho (121.687 e 121.689). O despacho de voo deve incluir
  as seguintes informações:'
subsection_id: b
cite: 5.2.1.3(b)
title: 5.2.1.3(b)
text: b) ilustração gráfica, com os aeródromos de origem, destino e os aeródromos adequados;
  os círculos de 75 minutos (ou 180, conforme aplicável) em torno de cada aeródromo; os círculos
  associados ao tempo de desvio máximo autorizado; e a rota propriamente dita, incluindo os
  pontos de entrada e saída ETOPS e os pontos equidistantes em tempo (ETP).
