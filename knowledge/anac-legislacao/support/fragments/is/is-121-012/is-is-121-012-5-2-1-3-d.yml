section_title: 'Documentação do despacho (121.687 e 121.689). O despacho de voo deve incluir
  as seguintes informações:'
subsection_id: d
cite: 5.2.1.3(d)
title: 5.2.1.3(d)
text: 'd) os aeródromos de alternativa ETOPS, conforme requerido por 121.624(a), 121.687(a)(3)
  e 121.689(a)(5) do RBAC nº 121.

  Nota: o DOV deve ter acesso à Lista de Aeródromos Regulares e de Alternativa do detentor
  de certificado e às informações de serviço de prevenção, salvamento e combate a incêndio
  de cada aeródromo (para cumprimento do parágrafo 5.2.1.2.4.1b) desta IS).

  5.2.1.3.1 O despacho deve conter, ou ter anexado a ele, informação meteorológica e disponibilidade
  dos serviços e instalações de todos os aeródromos adequados que estejam acima dos mínimos
  meteorológicos e que estejam dentro do tempo de desvio máximo autorizado para a operação
  (incluindo os aeródromos adequados não escolhidos como aeródromos de alternativa ETOPS).'
