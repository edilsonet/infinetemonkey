title: 5.2.1.4.11(a)
text: a) a natureza do defeito e as possíveis dificuldades que possam ocorrer se for dada
  sequência ao voo. O piloto em comando deve considerar os riscos associados a uma outra falha
  de motor ou em sistemas do avião, que pode complicar a parada de motor ou compor com ela
  para aumentar o risco à operação, aumentando a carga de trabalho da tripulação. Outras ocorrências,
  como o mal estar de um passageiro, podem também aumentar a carga de trabalho da tripulação;
