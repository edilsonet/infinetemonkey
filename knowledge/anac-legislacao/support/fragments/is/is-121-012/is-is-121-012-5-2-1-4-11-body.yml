text: '5.2.1.4.11 Parada de motor

  5.2.1.4.11.1 A seção 121.565 do RBAC nº 121 requer que, após uma falha de motor ou quando
  o motor for cortado em voo para prevenir danos maiores, o piloto em comando de um avião
  com dois motores pouse no aeródromo adequado mais próximo (em termos de tempo de voo) no
  qual um pouso seguro possa ser executado. Esse julgamento é especialmente crítico para operações
  ETOPS. Alguns dos fatores para determinar se um pouso seguro pode ser executado são:'
