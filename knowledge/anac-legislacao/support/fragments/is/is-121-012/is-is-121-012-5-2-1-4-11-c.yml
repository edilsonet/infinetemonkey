  5.2.1.4.11.3 Em um avião de três ou mais motores, se apenas um motor falhar ou for cortado,
  o piloto em comando pode prosseguir além do aeródromo adequado mais próximo (em termos de
  tempo de voo) se o piloto em comando considerar que o pouso em tal aeródromo é tão seguro
  quanto no aeródromo adequado mais próximo. Os seguintes fatores devem ser considerados:'
