title: Procedimentos em voo.
text: '5.2.1.4 Procedimentos em voo.

  5.2.1.4.1 Os pilotos e o DOV responsável pelo voo devem monitorar os aeródromos localizados
  na área de operações ETOPS e que poderiam ser utilizados para desvio com relação a deteriorações
  nas condições meteorológicas, nas condições da pista de pouso ou limitações nas instalações
  e serviços que poderiam tornar o aeródromo inadequado para pouso.

  5.2.1.4.2 Em voo, os aeródromos de alternativa ETOPS devem manter continuamente os requisitos
  verificados para emissão do despacho original, com exceção de que os mínimos meteorológicos
  considerados passam a ser os mínimos de operação - e não mais os mínimos de planejamento
  (121.624(c) e 121.631(c) do RBAC nº 121).

  5.2.1.4.3 Durante o voo, o DOV (ou a pessoa responsável pelo controle operacional, no caso
  de operações não regulares) deve informar os pilotos sobre alterações significativas nas
  condições nos aeródromos de alternativa ETOPS, utilizando os sistemas de comunicação do
  detentor de certificado.'
