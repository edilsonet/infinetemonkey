title: ETOPS 138 minutos.
text: '5.2.1.5.1 ETOPS 138 minutos.

  5.2.1.5.1.1 Por se tratar de uma extensão à aprovação de ETOPS 120 minutos, o detentor de
  certificado somente pode utilizar a autorização de ETOPS 138 minutos caso não seja possível
  realizar o voo com a autorização de ETOPS 120 minutos (Seção I, (e)(1)(i) do Apêndice P
  do RBAC nº 121).'
