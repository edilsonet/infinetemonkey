title: ETOPS 207 minutos.
text: '5.2.1.5.2 ETOPS 207 minutos.

  5.2.1.5.2.1 Esses procedimentos somente podem ser utilizados caso, temporariamente, não
  haja aeródromo de alternativa ETOPS disponível a um tempo de desvio máximo de até 180 minutos,
  seja por razões políticas ou militares, atividades vulcânicas, condições temporárias de
  aeródromos e condições meteorológicas nos aeródromos abaixo das requeridas para despacho
  ou ainda outros eventos climáticos relevantes (Seção I, (h)(1) do Apêndice P do RBAC nº
  121). Portanto, para fins de engenharia de operações, deve ser possível que a rota seja
  voada utilizando-se autorização ETOPS 180 minutos. Apenas circunstancialmente, no momento
  do despacho de voo em dias específicos, pode ser necessário utilizar essa exceção.

  5.2.1.5.2.2 O detentor de certificado deve considerar a rota preferencial indicada pelo
  ATC (Seção I, (h)(3) do Apêndice P do RBAC nº 121).

  5.2.1.5.2.3 Por se tratar de uma extensão à aprovação de ETOPS 180 minutos, o detentor de
  certificado deve estabelecer um sistema de registro para anotar sempre que essa autorização
  for utilizada (Seção I, (h)(5) do Apêndice P do RBAC nº 121).

  5.2.1.5.2.3.1 A utilização da autorização de ETOPS 207 minutos se caracteriza quando, no
  despacho do voo, é listado aeródromo de alternativa entre 180 e 207 minutos, independentemente
  de ter havido efetivamente desvio para esse aeródromo de alternativa.

  5.2.1.5.2.3.2 O registro deve permitir identificar o voo específico que utilizou essa autorização.

  5.2.1.5.2.3.3 O registro deve ser mantido por cinco anos.'
