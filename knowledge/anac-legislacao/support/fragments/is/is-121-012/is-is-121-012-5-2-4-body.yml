text: '5.2.4 Guia de rota

  5.2.4.1 Os dados requeridos pela IS nº 121-001 devem ser inseridos no guia de rota para
  todos os aeródromos adequados e aeródromos de alternativa ETOPS utilizados nas operações
  ETOPS.

  Nota 1: deve-se atentar, na confecção do guia de rota, que os requisitos de aeródromos sejam
  cumpridos, como, por exemplo, o nível do serviço de prevenção, salvamento e combate a incêndio.

  Nota 2: os mínimos meteorológicos específicos para o planejamento de voo de operações ETOPS
  podem constar apenas no MGO, como previsto nesta IS (como um valor adicional ao mínimo meteorológico
  previsto na carta), não sendo necessário repetir tal informação no guia de rota.'
