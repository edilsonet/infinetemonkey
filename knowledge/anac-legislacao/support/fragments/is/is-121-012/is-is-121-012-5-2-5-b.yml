title: 5.2.5(b)
text: 'b) Sistema de comunicação requerido por 121.99(d) ou 121.122(c) do RBAC nº 121, conforme
  aplicável.


  Nota 1: nas MMEL publicadas pelo FAA, em geral, as operações ETOPS são identificadas como
  “ER operations” (referente a “extended range”). Nas MMEL aprovadas pela EASA, se utiliza
  “ETOPS” ou “ER operations”.

  Nota 2: a título de informação, as MMEL publicadas pelo FAA em geral consideram a MMEL Policy
  Letter 40 para definição dos critérios de despacho em operações ETOPS e em operações em
  áreas polares. Destaca-se, no entanto, que o detentor de certificado deve sempre considerar
  a MMEL para elaboração de sua MEL.'
