section_title: 'O plano para continuação de viagem dos passageiros é requerido para:'
subsection_id: c
cite: 5.2.6.1(c)
title: 5.2.6.1(c)
text: 'c) operações na área polar norte. Uma vez que também é requerida autorização para operações
  na área polar norte, conforme a seção 121.161 do RBAC nº 121, esta IS utiliza o mesmo critério
  de aprovação válido para as operações na área polar sul.

  5.2.6.2 Esse plano objetiva documentar a preparação do detentor de certificado para que,
  no evento de um desvio para alternativa ETOPS, os passageiros e tripulantes sejam assistidos
  no local de pouso (garantindo-se o bem-estar dos passageiros, incluindo a proteção contra
  elementos da natureza, como frio, calor, chuva etc), com as instalações do aeródromo ou
  de área imediatamente próxima, até que possam ser levados para o aeródromo de destino originalmente
  previsto.

  Nota: a proteção ao público é um dos aspectos que devem ser considerados quando se avalia
  a qualidade dos aeródromos utilizados numa rota, conforme requerido pelas seções 121.97
  e 121.117 do RBAC nº 121.'
