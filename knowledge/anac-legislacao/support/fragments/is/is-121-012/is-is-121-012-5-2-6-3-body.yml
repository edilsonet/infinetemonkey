text: '5.2.6.3 O plano deve prever que os passageiros sejam levados para o aeródromo de destino
  originalmente previsto em até 48 horas.

  5.2.6.4 Um plano para continuação de viagem dos passageiros deve ser elaborado especificamente
  para cada aeródromo de alternativa ETOPS utilizado nas operações, incluindo os aeródromos
  regulares utilizados pelo detentor de certificado como aeródromos de alternativa ETOPS.'
