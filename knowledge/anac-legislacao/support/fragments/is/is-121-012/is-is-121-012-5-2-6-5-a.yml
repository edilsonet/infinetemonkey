section_title: 'O plano deve incluir:'
subsection_id: a
cite: 5.2.6.5(a)
title: 5.2.6.5(a)
text: 'a) uma lista das instalações disponíveis no aeródromo, ou em sua vizinhança, suficientes
  para assistir os passageiros e os tripulantes durante o tempo previsto para que possam ser
  levados ao aeródromo de destino originalmente previsto, considerando pelo menos as necessidades
  fisiológicas como comida, abrigo e segurança, bem como atendimento médico e meios de comunicação.
  De acordo com o ambiente do aeródromo, pode ser necessário detalhar diferentes preocupações,
  como provisão de sombra em locais abertos ou provisão de roupas e aquecimento em regiões
  polares;

  Nota: se o detentor de certificado planeja utilizar o próprio avião como forma de prover
  assistência (total ou parcial) aos passageiros, devem ser consideradas as limitações de
  capacidade do avião, especialmente quanto ao tempo pelo qual se consegue manter tal assistência.'
