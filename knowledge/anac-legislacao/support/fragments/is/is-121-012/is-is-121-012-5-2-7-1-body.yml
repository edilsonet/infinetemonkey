cite: 5.2.7.1
title: O programa de treinamento deve incluir treinamento inicial e periódico (a cada 12 meses),
  para todas as categorias de tripulante e DOV.
text: '5.2.7.1 O programa de treinamento deve incluir treinamento inicial e periódico (a cada
  12 meses), para todas as categorias de tripulante e DOV.

  5.2.7.2 O detentor de certificado pode, a seu critério, optar por ministrar esse treinamento
  junto aos demais treinamentos requeridos (como parte dos treinamentos iniciais, periódicos,
  de transição etc) a todos os tripulantes e DOVs que trabalham com o modelo de aeronave,
  de forma a não precisar segregá-los; ou pode optar por ministrar o treinamento a um grupo
  específico de tripulantes e DOVs que trabalham com o modelo de aeronave (como treinamento
  especial), de modo que apenas esse grupo treinado pode trabalhar com os voos ETOPS. Nesse
  último caso, o detentor de certificado deve estabelecer procedimentos para escala de tripulantes
  e DOV no MGO conforme o parágrafo 5.2.1.2.2 desta IS.

  5.2.7.3 O detentor de certificado deve prever ainda o treinamento que será realizado pelos
  tripulantes e DOVs que perderem a qualificação ETOPS. Essa requalificação ETOPS também pode
  ser ministrada junto aos demais treinamentos requeridos (como treinamento de requalificação)
  ou como um treinamento especial. A carga horária deve ser superior à do treinamento periódico,
  podendo ser inferior à do treinamento inicial.

  5.2.7.4 No caso de detentor de certificado em operação e que obtenha aprovação para operações
  ETOPS, o programa de treinamento deve prever como serão treinados os tripulantes e DOVs
  que já operam outros voos. Isso é especialmente crítico no caso de o detentor de certificado
  optar por incluir os treinamentos sobre ETOPS como parte dos treinamentos iniciais e periódicos,
  pois o tripulante e DOV apenas pode passar a atuar em operações ETOPS após ter cumprido
  satisfatoriamente o treinamento específico sobre ETOPS e, portanto, pode não ser interessante
  ao detentor de certificado aguardar o tripulante ou DOV cumprir sua programação de treinamento
  periódico para passar a poder operar ETOPS.

  5.2.7.5 O treinamento deve conter o conceito geral de operações ETOPS e os procedimentos
  específicos do detentor de certificado para condução de suas operações ETOPS. Assim, deve
  ser observado que, embora esta IS estabeleça os elementos e eventos que devem, como mínimo,
  compor o programa de treinamento, a forma como efetivamente os tópicos serão abordados dependerá
  dos procedimentos específicos do detentor de certificado.

  5.2.7.6 Quando houver alterações da regulamentação ou dos procedimentos do detentor de certificado,
  tais alterações devem ser enfatizadas nos treinamentos periódicos - ainda que não seja necessário
  revisar o programa de treinamento aprovado, já que os tópicos poderão eventualmente ser
  mantidos. Tais alterações podem ser enfatizadas também pela distribuição de boletins ou
  circulares, conforme o sistema de documento de segurança operacional do detentor de certificado.'
