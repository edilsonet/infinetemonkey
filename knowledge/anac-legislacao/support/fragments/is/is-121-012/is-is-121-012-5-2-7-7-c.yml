section_id: 5.2.7.7
section_title: 'O treinamento para tripulantes de voo deve abranger treinamento de solo (teórico)
  e treinamento de voo em simulador, abrangendo os seguintes assuntos:'
subsection_id: c
cite: 5.2.7.7(c)
title: 5.2.7.7(c)
text: 'c) planejamento de voo, incluindo:

  i. informações sobre contingências, como falha de motor, despressurização e ponto equidistante
  em tempo (ETP) de desvio para alternativa;

  ii. escolha de aeródromos de alternativa ETOPS;

  iii. cálculo de combustível para voo ETOPS;

  iv. considerações sobre sistemas de tempo limite;

  v. restrições operacionais associadas ao despacho de voo ETOPS, conforme lista de equipamentos
  mínimos (MEL); e

  vi. despacho de voo ETOPS;'
