section_id: 5.2.7.7
section_title: 'O treinamento para tripulantes de voo deve abranger treinamento de solo (teórico)
  e treinamento de voo em simulador, abrangendo os seguintes assuntos:'
subsection_id: d
cite: 5.2.7.7(d)
title: 5.2.7.7(d)
text: 'd) procedimentos em voo, incluindo:

  i. procedimentos operacionais padrão (SOP), incluindo:

  1) uso de equipamento especificamente requerido para operações ETOPS, como SATCOM; e

  2) compreensão e uso efetivo de equipamentos adicionais ou modificados requeridos para operações
  ETOPS;

  ii. monitoramento do progresso do voo e gestão de combustível;

  iii. considerações sobre desvio para alternativa; e

  iv. procedimentos não normais, incluindo:

  1) procedimentos anormais e de emergência;

  2) procedimentos a serem seguidos no caso de mudanças nas condições em aeródromo de alternativa
  ETOPS listado no despacho de voo que poderiam impedir uma aproximação e pouso seguros;

  3) procedimentos a serem seguidos no caso de mudanças nas condições de outros aeródromos,
  potencialmente utilizados para desvio em rota, que poderiam impedir uma aproximação e pouso
  seguros;

  4) desvio para alternativa;

  5) incapacitação de tripulantes; e

  6) simulação de aproximação e de aproximação perdida com apenas uma fonte de potência alternativa
  disponível, se a perda das duas fontes principais de potência elétrica alternada e sem APU
  disponível resultar em degradação significativa dos instrumentos para algum dos pilotos;'
