title: 5.2.7.8(d)
text: 'd) procedimentos em rota normais:

  i. entrada em área ETOPS;

  ii. procedimentos de monitoramento em rota;

  iii. procedimentos com o FMS (como aplicável); e

  iv. navegação e comunicação, incluindo uso dos equipamentos especificamente requeridos para
  voos ETOPS;'
