section_title: 'O treinamento de voo para tripulantes de voo deve conter os seguintes eventos:'
subsection_id: e
cite: 5.2.7.8(e)
title: 5.2.7.8(e)
text: 'e) procedimentos em rota não normais:

  i. procedimentos de contingência;

  ii. condições e itens de checklist não normais;

  iii. processo de decisão para desvio para alternativa;

  iv. procedimentos com o FMS (como aplicável);

  v. desvio para alternativa em rota;

  vi. falhas de sistemas e capacidade do avião com os sistemas remanescentes e sua relação
  com a decisão de prosseguir o voo ou desviar para alternativa;

  vii. simulação de aproximação e de aproximação perdida com apenas uma fonte de potência
  alternativa disponível, se a perda das duas fontes principais de potência elétrica alternada
  e sem APU disponível resultar em degradação significativa dos instrumentos para algum dos
  pilotos; e

  viii. incapacitação de tripulantes; e'
