section_title: 'O treinamento de voo para tripulantes de voo deve conter os seguintes eventos:'
subsection_id: f
cite: 5.2.7.8(f)
title: 5.2.7.8(f)
text: 'f) procedimentos pós-voo.

  5.2.7.9 O treinamento de voo para tripulantes de voo é normalmente conduzido como um exercício
  LOFT, em simulador de voo, incluindo procedimentos normais e não normais. Diferentes cenários
  não normais de LOFT podem ser alternados a cada edição do treinamento periódico. Nesse caso,
  o registro de treinamento deve permitir a identificação do cenário treinado, para que cenários
  diferentes possam ser selecionados nos treinamentos periódicos subsequentes, de acordo com
  o histórico do piloto.

  5.2.7.10 Para operações ETOPS, o treinamento para DOVs deve abranger treinamento de solo
  teórico e sobre as ferramentas e métodos utilizados para despacho e monitoramento de voo
  ETOPS.

  5.2.7.11 O treinamento para DOVs deve abranger treinamento prático com as ferramentas e
  métodos utilizados para despacho e monitoramento de voo ETOPS, incluindo demonstração dos
  procedimentos operacionais. Para operações ETOPS 138 minutos, deve abranger as diferenças
  entre ETOPS 138 minutos e ETOPS 120 minutos.'
