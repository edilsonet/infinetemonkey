text: '5.3.4 Certificação do Conjunto Aeronave/Motor para Operações ETOPS

  5.3.4.1 A empresa deverá demonstrar que o conjunto aeronave/motor não possui restrição à
  operação ETOPS pretendida nas respectivas bases de certificação (RBAC nº 25/33).

  5.4 Processo de aprovação'
