text: '5.4.10.1 Treinamento

  5.4.10.1.1 Os tripulantes e DOVs devem cumprir o programa de treinamento aprovado. Para
  que o treinamento possa ser ministrado, é necessário que os procedimentos já estejam estabelecidos
  nos demais manuais, de forma que o treinamento seja efetivamente sobre os procedimentos
  que serão utilizados nas operações.

  5.4.10.1.2 O detentor de certificado deve notificar a ANAC da realização do treinamento,
  para que a ANAC possa acompanhá-lo. Caso o detentor de certificado tenha optado por incluir
  o treinamento ETOPS apenas como parte dos currículos iniciais ou periódicos, deve indicar
  como serão treinados os funcionários que já realizaram tais treinamentos (vide o parágrafo
  5.2.7.4 desta IS).'
