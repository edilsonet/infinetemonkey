title: Voos de avaliação operacional
text: '5.4.10.2 Voos de avaliação operacional

  5.4.10.2.1 O detentor de certificado deve realizar voos de avaliação operacional reais,
  com a combinação avião-motor pretendida, nas rotas propostas, dentro da área de operações
  ETOPS solicitada, de forma a garantir que os procedimentos estabelecidos nos manuais e os
  treinamentos realizados, nas áreas de operações e de manutenção, são satisfatórios para
  permitir a condução segura das operações (121.162(b)).

  5.4.10.2.2 O número de voos e a forma de realização (voos comerciais com passageiros, voos
  comerciais somente cargueiros ou apenas voos não comerciais) serão determinados pela ANAC,
  de acordo com o nível de experiência do detentor de certificado com outras operações ETOPS
  e com as rotas propostas.

  5.4.10.2.2.1 Para detentores de certificado solicitando a primeira autorização ETOPS, devem
  ser realizados 2 trechos de voos ETOPS não comerciais.

  5.4.10.2.2.2 Para detentores de certificado que já possuem autorização ETOPS e estejam adicionando
  uma nova combinação avião-motor, aumentando o tempo de desvio máximo autorizado ou incluindo
  uma nova área de operações, devem ser realizados pelo menos 2 trechos de voos ETOPS, podendo
  ser aproveitados voos comerciais.

  5.4.10.2.2.3 A simulação de cenários pode ser utilizada para demonstrar que os processos
  e procedimentos foram estabelecidos e funcionam adequadamente, de forma a complementar a
  quantidade de voos reais requeridos.'
