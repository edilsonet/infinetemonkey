title: 5.4.11(b)
text: 'b) No caso de detentores de certificado que possuem aprovação ETOPS, a verificação
  pode concluir que os procedimentos específicos de operações ETOPS são necessários para aquele
  voo.

  Nota: a incapacidade do detentor de certificado em demonstrar que seus voos não são ETOPS
  pode fazer com que o voo inadvertidamente entre em área de operações ETOPS, o que compromete
  a segurança das operações e a garantia de cumprimento dos requisitos regulamentares aplicáveis
  à operação.'
