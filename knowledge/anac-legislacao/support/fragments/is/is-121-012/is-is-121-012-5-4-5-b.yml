section_id: 5.4.5
section_title: 'O detentor de certificado deve informar, em sua solicitação formal:'
subsection_id: b
cite: 5.4.5(b)
title: 5.4.5(b)
text: b) rotas ETOPS propostas e tempo de desvio necessário para suportar essas rotas. Para
  cada rota, o operador deve incluir uma ilustração com os aeródromos de origem, destino e
  possíveis alternativas (incluindo alternativas em rota), os círculos de 75 minutos (ou 180
  minutos, conforme aplicável) e do tempo de desvio máximo a ser autorizado em torno de cada
  aeródromo, a rota propriamente dita e os pontos de entrada ETOPS e de saída ETOPS (o ponto
  em que o avião sai da área ETOPS);
