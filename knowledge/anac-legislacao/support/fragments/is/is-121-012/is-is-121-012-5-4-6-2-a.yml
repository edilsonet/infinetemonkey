section_id: 5.4.6.2
section_title: 'O documento CMP aplicável é estabelecido pela seção 121.162 do RBAC nº 121,
  conforme a seguir:'
subsection_id: a
cite: 5.4.6.2(a)
title: 5.4.6.2(a)
text: 'a) para aviões com dois motores:

  i. ETOPS 90 e 120 minutos. Combinação deve ser aprovada para ETOPS de pelo menos 120 minutos
  (seção I, (c)(1) e (d)(1) do Apêndice P do RBAC nº 121);

  ii. ETOPS 138 minutos. Combinação deve ser aprovada para ETOPS de pelo menos 120 minutos
  e a capacidade dos sistemas de tempo limite deve ser de, pelo menos, 138 minutos, calculado
  de acordo com a seção 121.633 do RBAC nº 121 (seção I, (e)(1)(ii) do Apêndice P do RBAC
  nº 121);

  iii. ETOPS 180, além de 180 e 207 minutos. Combinação deve ser aprovada para ETOPS de pelo
  menos 180 minutos (seção I, (f)(1), (g)(1) e (h)(4) do Apêndice P do RBAC nº 121). Para
  ETOPS 207 minutos, o tempo limite do sistema significativo ETOPS mais limitante (incluindo
  o sistema de supressão de fogo do avião para os compartimentos de carga e bagagem que sejam
  requeridos possuir tal sistema) deve ser de pelo menos 222 minutos; e

  iv. ETOPS 240 e além de 240 minutos. Combinação deve ser aprovada para ETOPS além de 180
  minutos (seção I, (i)(3) e (j)(4) do Apêndice P do RBAC nº 121); e'
