text: b) para aviões com dois motores cuja combinação avião-motor não tenha recebido a aprovação
  da ANAC para ETOPS até 180 minutos antes de 15 de fevereiro de 2007, o documento CMP para
  a combinação avião-motor emitida de acordo com a seção 25.3(b)(1) do RBAC nº 25;
