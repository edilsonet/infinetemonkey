title: 5.4.6.2(d)
text: 'd) para aviões com mais de dois motores fabricados em ou após 17 de fevereiro de 2015,
  o documento CMP para a combinação de avião-motor emitido de acordo com a seção 25.3(c) do
  RBAC nº 25.

  5.4.6.3 A aprovação da combinação avião-motor deve atender a critérios específicos de acordo
  com o tempo de desvio máximo a ser autorizado, conforme estabelecido no Apêndice P do RBAC
  nº 121:'
