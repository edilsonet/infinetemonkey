section_title: 'O Apêndice P do RBAC nº 121 ainda estabelece requisitos de experiências específicos
  para algumas operações:'
subsection_id: a
cite: 5.4.7.2(a)
title: 5.4.7.2(a)
text: a) para ETOPS além de 180 minutos com aviões de dois motores, o detentor de certificado
  deve possuir autorização ETOPS 180 minutos para a combinação avião-motor, com experiência
  prévia satisfatória para a ANAC (seção I, (j)(2) do Apêndice P do RBAC nº 121). Considera-se
  com experiência satisfatória o detentor de certificado que possua autorização e efetivamente
  realizou operações ETOPS 180 minutos por pelo menos 6 meses consecutivos; e
