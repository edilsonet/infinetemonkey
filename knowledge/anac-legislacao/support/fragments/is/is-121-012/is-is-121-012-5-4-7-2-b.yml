id: is-is-121-012-5-4-7-2-b
kind: is
document: is-121-012
family: '121'
section_id: 5.4.7.2
section_title: 'O Apêndice P do RBAC nº 121 ainda estabelece requisitos de experiências específicos
  para algumas operações:'
subsection_id: b
cite: 5.4.7.2(b)
title: 5.4.7.2(b)
text: 'b) para ETOPS além de 240 minutos com aviões de dois motores, o detentor de certificado
  deve possuir autorização e ter efetivamente operado com ETOPS 180 minutos (ou além de 180
  minutos) por, pelo menos, 24 meses consecutivos, dos quais pelo menos 12 meses devem ser
  com ETOPS 240 minutos para a combinação aviação-motor pretendida (seção I, (j)(2) do Apêndice
  P do RBAC nº 121).

  Nota 1: para se considerar a efetiva operação com ETOPS 180 minutos, não são considerados
  voos para os quais uma autorização de até 120 minutos seria suficiente.

  Nota 2: para se considerar que houve operação em determinado mês, deve haver uma rota com
  programação pelo menos semanal na qual usualmente se utiliza a autorização ETOPS, ainda
  que tal programação semanal não se concretize em todas as semanas do mês ou que não se opere
  efetivamente com ETOPS 180 minutos (ou além de 180 minutos) em todos os voos do mês. No
  entanto, deve ter havido pelo menos um voo em que efetivamente se operou com ETOPS 180 minutos
  (ou além de 180 minutos) a cada mês.

  Nota 3: não se aplica o método de “ETOPS acelerado”, descrito no Apêndice C desta IS, para
  os casos em que o RBAC requer experiência específica, conforme descrito no parágrafo 5.4.7.2
  desta IS, devendo prevalecer o requisito de experiência previsto no RBAC.

  5.4.7.3 Para operações ETOPS com aviões de mais de dois motores, não há requisito de experiência
  em serviço. Os detentores de certificado que pretenderem tal operação devem utilizar o método
  de ETOPS acelerado descrito no Apêndice C desta IS.'
