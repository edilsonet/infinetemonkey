title: Experiência requerida.
text: '5.4.7 Experiência requerida.


  5.4.7.1 Para as operações ETOPS com aviões de dois motores, conforme a seção I, (a)(1) do
  Apêndice P do RBAC nº 121, o detentor de certificado deve ser capaz de demonstrar sua habilidade
  para atingir e manter um nível de confiabilidade do sistema de propulsão requerido pelo
  parágrafo 21.4(b)(2) do RBAC nº 21 para cada combinação avião-motor a ser utilizada. Os
  métodos para demonstrar essa habilidade são detalhados no Apêndice C desta IS.'
