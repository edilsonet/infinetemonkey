cite: 5.4.8(a)
title: 5.4.8(a)
text: 'a) para aviões com dois motores, ETOPS 240 minutos é autorizado somente nas seguintes
  áreas, no hemisfério sul (Seção I, (i)(1) do Apêndice P do RBAC nº 121):

  i. Oceano Pacífico (inclui área oceânica entre Austrália e América do Sul);

  ii. Oceano Atlântico; e

  iii. Oceano Índico; e'
