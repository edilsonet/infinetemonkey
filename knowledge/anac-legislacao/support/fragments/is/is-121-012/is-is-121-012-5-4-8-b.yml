section_id: 5.4.8
section_title: 'Área de operação. Algumas autorizações ETOPS são limitadas a determinadas
  áreas:'
subsection_id: b
cite: 5.4.8(b)
title: 5.4.8(b)
text: 'b) para aviões com dois motores, ETOPS além de 240 minutos é autorizado somente entre
  pares específicos de aeródromos de origem e destino, com rotas nas seguintes áreas (Seção
  I, (j)(1) do Apêndice P do RBAC nº 121):

  i. Oceano Pacífico (inclui área oceânica entre Austrália e América do Sul);

  ii. Oceano Atlântico Sul; e

  iii. Oceano Índico.

  Nota: a limitação de que determinadas autorizações sejam restritas a áreas específicas de
  operação se justifica para que, em outras áreas, onde não foi identificada a necessidade
  de tempos de desvio máximos tão extensos, a operação seja conduzida necessariamente sob
  um nível de segurança mais adequado a essas áreas, considerando que um tempo de desvio máximo
  maior está associado a uma maior exposição ao risco.

  5.4.9 Detentores de certificado já autorizados a realizar operações ETOPS e que pretendam
  passar a operar novos aviões, de combinação avião-motor já aprovada, devem verificar que
  cada avião de marcas de nacionalidade e matrícula específicas cumpre com os requisitos aplicáveis
  desta IS.'
