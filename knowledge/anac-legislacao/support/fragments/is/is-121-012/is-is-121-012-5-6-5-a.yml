section_id: 5.6.5
section_title: 'Essa comprovação pode ser feita pela combinação de trabalhos em dois níveis:'
subsection_id: a
cite: 5.6.5(a)
title: 5.6.5(a)
text: 'a) nível de engenharia de operações:

  i. o detentor de certificado deve identificar os aeródromos adequados (ou seja os que permitem
  o atendimento aos requisitos de desempenho de pouso da seção 121.197 do RBAC nº 121, considerando
  ar calmo, condições normalmente encontradas no aeródromo e peso normalmente encontrado no
  pouso) que se situam a menos de 75 minutos de voo (ou 180, conforme aplicável), à velocidade
  de cruzeiro com um motor inoperante e sob atmosfera padrão e ar calmo, da rota;

  ii. o método recomendado para essa comprovação é o uso de ilustração gráfica da rota a ser
  voada; os aeródromos de origem, destino e os aeródromos adequados; e os círculos de 75 minutos
  (ou 180, conforme aplicável) em torno de cada aeródromo. O detentor de certificado pode
  fazer tal ilustração individualmente para cada rota operada; ou pode fazer uma única ilustração
  para toda sua área de operações desde que garanta que sua área de operações é completamente
  coberta pelos círculos em torno de cada aeródromo e que suas rotas se limitam a tal área
  de operações; e

  iii. no caso de operações regulares, caso os aeródromos adequados necessários para cobrir
  todas as rotas operadas não se encontrem na Lista de Aeródromos Regulares e de Alternativa
  como aeródromos regulares ou de alternativa, o detentor de certificado deve incluir tais
  aeródromos como aeródromos adequados; e'
