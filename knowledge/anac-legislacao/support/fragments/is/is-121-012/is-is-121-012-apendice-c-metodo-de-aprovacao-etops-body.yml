title: Apêndice C - Método de aprovação ETOPS
text: 'Apêndice C - Método de aprovação ETOPS

  Dsposições Finais


  7.1 Os casos omissos serão dirimidos pela SPO.

  7.2 Os detentores de certificado autorizados a realizarem operações prolongadas (ETOPS),
  assim como os detentores de certificado que já realizam operações em áreas polares com ou
  sem autorização a realizá-las, na data de publicação desta IS podem manter suas operações
  por um período de 12 (doze) meses, com base nos procedimentos já estabelecidos em seus manuais.
  Para manutenção das operações após esse prazo, deve ser realizada adequação a esta IS.'
