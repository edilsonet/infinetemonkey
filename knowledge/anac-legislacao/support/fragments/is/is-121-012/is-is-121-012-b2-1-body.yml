id: is-is-121-012-b2-1-body
kind: is
document: is-121-012
family: '121'
section_id: B2.1
section_title: 'Designação de aeródromos de alternativa. O detentor de certificado deve designar
  um conjunto de aeródromos de alternativa, independentemente de suas distâncias em relação
  à rota planejada, de tal forma que seja razoável esperar que um ou mais estarão disponíveis
  para pouso em uma variedade de condições meteorológicas. A quantidade de combustível deve
  permitir um pouso seguro em cada aeródromo de alternativa, incluindo o taxiamento do avião
  para livrar a pista. O aeródromo deve possuir capacidade de receber o avião de recuperação
  dos passageiros, mesmo no caso de o avião original bloquear a pista: isso pode ser conseguido
  com uma segunda pista ou com a capacidade de mover o avião original. Adicionalmente, os
  aeródromos designados devem oferecer proteção aos passageiros e tripulantes da seguinte
  forma (121.97 e 121.117):'
