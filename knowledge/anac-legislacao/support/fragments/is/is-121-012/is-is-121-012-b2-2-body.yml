family: '121'
section_id: B2.2
section_title: Plano para continuação de viagem dos passageiros. Exceto para operações exclusivamente
  cargueiras, o detentor de certificado deve desenvolver um plano para continuação de viagem
  dos passageiros para cada aeródromo de alternativa designado, conforme descrito no parágrafo
  5.2.6 desta IS. Adicionalmente, para as áreas polares, o plano deve considerar a possibilidade
  de temperaturas extremamente baixas, instalações limitadas para os passageiros e a necessidade
  de iniciar o plano o mais rápido possível.
