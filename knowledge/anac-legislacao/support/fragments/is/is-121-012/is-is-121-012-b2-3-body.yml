id: is-is-121-012-b2-3-body
kind: is
document: is-121-012
family: '121'
section_id: B2.3
section_title: Estratégia para lidar com o congelamento do combustível e procedimentos para
  monitorar essa situação. O detentor de certificado pode querer desenvolver uma estratégia
  para lidar com o congelamento de combustível e um programa de monitoramento (por exemplo,
  determinação da temperatura de congelamento do combustível com base em medições reais do
  combustível carregado) em vez de utilizar temperatura mínima padrão para congelamento de
  combustível para o tipo de combustível utilizado. Caso o detentor de certificado desenvolva
  seu programa, ele estará sujeito à aprovação da ANAC. O detentor de certificado deve estabelecer
  procedimentos de coordenação entre manutenção, despacho e tripulantes de voo para informar
  a temperatura de congelamento de combustível a bordo da aeronave.
