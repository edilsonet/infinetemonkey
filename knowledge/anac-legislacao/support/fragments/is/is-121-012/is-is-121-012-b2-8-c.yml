section_id: B2.8
section_title: Equipamento especial para operações polares. Um mínimo de duas roupas antiexposição
  a baixas temperaturas deve estar a bordo do avião, para proteção dos tripulantes durante
  atividades externas em um aeródromo de alternativa com condições meteorológicas extremas.
  Um prazo curto pode ser concedido na MEL para esse item desde que o detentor de certificado
  garanta a disponibilidade de tais roupas nos aeródromos de alternativa designados. A ANAC
  poderá não exigir o cumprimento deste parágrafo se for demonstrado que na época do ano do
  voo o equipamento torna-se desnecessário.
