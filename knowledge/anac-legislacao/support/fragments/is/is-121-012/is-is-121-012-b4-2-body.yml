id: is-is-121-012-b4-2-body
kind: is
document: is-121-012
family: '121'
section_id: B4.2
section_title: Como parte da validação, o detentor de certificado deve executar seu plano
  para continuação de viagem dos passageiros. O exercício pode ser realizado anteriormente
  ao voo de avaliação operacional; nesse caso, deve ser obtido resultado satisfatório para
  o exercício antes da realização do voo de avaliação operacional. Se o detentor de certificado
  escolhe demonstrar o exercício juntamente com o voo de avaliação operacional, o voo não
  poderá transportar passageiros de forma comercial. No entanto o transporte comercial de
  cargas é permitido e encorajado por conta do peso e balanceamento.
