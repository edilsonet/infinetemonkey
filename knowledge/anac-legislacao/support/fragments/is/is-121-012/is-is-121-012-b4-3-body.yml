text: 'B4.3 O detentor de certificado deve notificar a ANAC pelo menos 60 dias de antecedência
  da data de realização do voo.

  Nota: recomenda-se que a antecedência seja coordenada com a ANAC, sendo avaliada a possibilidade
  de sua ampliação, de forma a aumentar a possibilidade de conclusão do processo no prazo
  esperado.'
