section_id: C2.1
section_title: Pelo método da experiência em serviço, o detentor de certificado deve demonstrar
  que atingiu e mantém o nível de confiabilidade dos motores requerido pelo parágrafo 21.4(b)(2)
  do RBAC nº 21 para cada combinação avião-motor a ser utilizada, por meio de experiência
  operacional apropriada à operação proposta. Adicionalmente, a ANAC avaliará os registros
  gerais de segurança operacional do detentor de certificado.
