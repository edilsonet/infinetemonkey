document: is-121-012
family: '121'
section_id: C2.3
section_title: Os valores de experiência estabelecidos a seguir podem ser aumentados pela
  ANAC ou diminuídos, por solicitação do detentor de certificado e aceitação da ANAC, baseando-se
  em uma análise da capacidade do detentor de certificado em atingir o nível de confiabilidade
  necessário para a combinação avião-motor a ser utilizada. Por exemplo, uma redução pode
  ser considerada para um detentor de certificado que demonstre ter extensa experiência em
  serviço com o mesmo motor em um outro avião, com confiabilidade aceitável. Por outro lado,
  um aumento pode ser considerado nos casos em que houver pouca experiência com manutenção
  e poucos voos realizados no período.
