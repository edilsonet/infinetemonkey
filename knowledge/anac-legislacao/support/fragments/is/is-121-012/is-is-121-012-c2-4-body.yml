cite: C2.4
title: Aprovações específicas.
text: 'C2.4 Aprovações específicas.

  C2.4.1 ETOPS 90 minutos. Considerando fatores como a área de operações, a capacidade do
  detentor de certificado de introduzir aviões em sua frota e a qualidade dos procedimentos
  de operações e manutenção, a operação ETOPS 90 minutos pode ser aprovada para um detentor
  de certificado sem experiência em serviço, ou com mínima experiência, para a combinação
  avião-motor a ser utilizada.

  C2.4.2 ETOPS 120 minutos. O detentor de certificado deve ter experiência em serviço de 12
  meses consecutivos em operações com a combinação avião-motor a ser utilizada.

  C2.4.3 ETOPS 180 minutos. O detentor de certificado deve ter experiência em serviço de 12
  meses consecutivos em operações ETOPS 120 minutos com a combinação avião-motor a ser utilizada.
  Nesse período, o detentor de certificado deve ter demonstrado capacidade para conduzir com
  segurança suas operações ETOPS 120 minutos.

  C3 ETOPS acelerado.'
