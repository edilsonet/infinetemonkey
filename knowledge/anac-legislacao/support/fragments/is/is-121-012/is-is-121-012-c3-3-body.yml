title: Processo de validação
text: 'C3.3 Processo de validação

  C3.3.1 O detentor de certificado deve estabelecer o processo que será validado, incluindo
  um fluxograma dos vários elementos do processo, papéis e responsabilidades com relação aos
  procedimentos e treinamentos requeridos e a existência de um controle que permita a revisão
  desses procedimentos e treinamentos com base na experiência em serviço. A validação consiste
  na demonstração de que o processo está apto a ser implementado e funciona corretamente,
  seja por análise documental ou por demonstração real em avião.

  C3.3.2 Os seguintes elementos devem ser considerados na avaliação da extensão do processo
  de validação requerido:'
