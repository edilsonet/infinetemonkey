text: 'd) experiência dos tripulantes, despachantes e pessoal de manutenção com operações
  ETOPS, em outros detentores de certificado.

  C3.3.2.1 Se o detentor de certificado já conduzir operações ETOPS com uma combinação avião-motor
  diferente, o processo de validação pode ser simplificado, por meio de documentação de que
  possui procedimentos ETOPS testados.

  C3.3.2.2 Se o detentor de certificado conduzir operações não ETOPS com combinação avião-motor
  similar e puder utilizar, ou simular, procedimentos ETOPS nessas operações, o processo de
  validação pode considerar tal situação como crédito.

  C3.3.3 O plano de validação deve incluir:'
