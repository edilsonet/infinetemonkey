title: fundamentos(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento à seção 121.161 e ao
  Apêndice P do RBAC nº 121.

  3.6 Esta IS se relaciona ainda às seções 121.7, 121.97, 121.99, 121.103, 121.106, 121.117,
  121.121, 121.122, 121.135, 121.162, 121.163, 121.191, 121.193, 121.197, 121.333, 121.374,
  121.565, 121.569, 121.607, 121.609, 121.624, 121.625, 121.631, 121.633, 121.646, 121.687,
  121.689 e 121.703 do RBAC nº 121.'
