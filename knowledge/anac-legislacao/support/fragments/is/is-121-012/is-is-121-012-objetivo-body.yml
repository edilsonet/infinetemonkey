title: OBJETIVO
text: 'OBJETIVO

  1.1 Esta Instrução Suplementar (IS) objetiva estabelecer os critérios para obtenção de aprovação
  e para condução de operações prolongadas (ETOPS) e operações em áreas polares para detentores
  de certificado que operam segundo o RBAC nº 121, abrangendo os aspectos operacionais e de
  manutenção, incluindo treinamentos.

  1.2 Objetiva ainda fornecer orientações para os detentores de certificado não autorizados
  a conduzir operações ETOPS, de forma a garantir que não entrem inadvertidamente em rotas
  ETOPS.'
