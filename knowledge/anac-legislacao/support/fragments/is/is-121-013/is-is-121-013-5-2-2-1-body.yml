title: 'Os currículos de treinamento destinados às funções a seguir devem contemplar também
  os assuntos específicos listados para cada função:'
text: '5.2.2.1 Os currículos de treinamento destinados às funções a seguir devem contemplar
  também os assuntos específicos listados para cada função:

  a. Encarregado de rampa:

  I. interpretação das informações necessárias ao carregamento da aeronave; e

  II. documentação de despacho, incluindo procedimentos para obtenção e entrega à tripulação.

  b. Balanceador

  I. elaboração de manifesto de carga.

  c. DOV do centro de despacho secundário

  I. os DOV do centro de despacho secundário devem cumprir o mesmo programa de treinamento
  aplicável aos DOVs do centro de despacho principal do detentor de certificado.

  5.3. Recursos da estação de linha

  5.3.1. Manuais de procedimentos e publicações

  5.3.1.1. O detentor de certificado deve contemplar em seu sistema de manuais os procedimentos
  e orientações necessários à operação da Estação de linha.

  5.3.1.2. Os procedimentos descritos no sistema de manuais devem contemplar, no mínimo:

  a. procedimentos de reabastecimento;

  b. Manual de peso e balanceamento;

  c. Manual de orientação a operações no solo;

  d. Programa de treinamento do pessoal da estação;

  e. Manual de procedimento contra atos de interferência ilícita;

  f. procedimento para carregamento e manuseio de bagagens;

  g. Programa de degelo e antigelo no solo (deicing e anti-icing);

  h. procedimentos para retirada de calços das aeronaves;

  i. procedimentos de verificação de rampa, incluindo prevenção de FOD, inspeção, limpeza
  e verificação da pintura das áreas de rampa;

  j. procedimentos para aceitação de cargas; e

  k. procedimentos para tratamento de artigos perigosos.

  5.3.1.3. Recomenda-se que cada função estabelecida na estrutura orgânica tenha orientações
  e procedimentos específicos previstos nesse sistema de manuais.

  5.3.1.4. Além dos manuais de procedimentos específicos da estação de linha, devem estar
  disponíveis para utilização do pessoal da estação todas as publicações necessárias às funções
  desempenhadas, incluindo legislação, manuais do detentor de certificado, publicações aeronáuticas
  (se houver procedimentos de despacho que utilizem tais publicações na estação) e outros
  documentos necessários.

  5.3.1.5 Os manuais de procedimentos e publicações devem ser disponibilizados de maneira
  adequada aos usuários a que se destinam, incluindo aspectos como idioma, mídia, formato,
  equipamento necessário, quantidade e facilidade de uso.

  5.3.2. Controle de documentos

  5.3.2.1 A estação de linha deve dispor ou estar integrada a um sistema de documentos que
  contemple procedimentos e estrutura para controle, geração, consulta e guarda de documentos
  produzidos ou utilizados nas operações.

  5.3.3. Comunicações

  5.3.3.1 A estação de linha deve dispor de recursos e procedimentos para comunicação entre
  esta e a base principal do operador, aeronaves e outros interlocutores, conforme as operações
  e atividades realizadas.'
