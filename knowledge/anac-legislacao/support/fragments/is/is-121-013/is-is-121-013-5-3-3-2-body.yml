  5.3.4. Tratamento de artigos perigosos

  5.3.4.1 Em caso de transporte de cargas, a estação de linha deve dispor de facilidades para
  tratamento de artigos perigosos, incluindo área delimitada para cargas contendo artigos
  perigosos, embalagens aprovadas para artigos perigosos e demais recursos requeridos ao manuseio
  desse tipo de carga.'
