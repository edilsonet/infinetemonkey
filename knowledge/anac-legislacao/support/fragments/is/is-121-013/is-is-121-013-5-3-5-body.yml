title: Outros recursos
text: '5.3.5 Outros recursos

  5.3.5.1 A estação de linha deve dispor de recursos materiais necessários às suas operações,
  incluindo formulários, material de escritório, computadores, equipamento de comunicação,
  equipamentos de proteção individual etc.

  5.4. Terceirização de serviços

  5.4.1 O detentor de certificado é o responsável pelas ações, atividades e procedimentos
  realizados pelas pessoas da estação de linha visando manter as operações nessa estação,
  independentemente do tipo de vínculo firmado (empregatício, contrato de trabalho, terceirização
  de serviços ou outro formato).

  5.4.2 Em caso de terceirização de serviços, o detentor de certificado deve estabelecer contratos
  formais com o detalhamento do serviço, condições e restrições da terceirização.

  5.4.3 O detentor de certificado deve estabelecer procedimentos para assegurar que as atividades
  desempenhadas por meio de terceirização sejam monitoradas quanto a possíveis impactos na
  segurança operacional e, se necessário, implementar as medidas mitigadoras necessárias.

  5.5. Centro de despacho secundário

  5.5.1. Caso o operador mantenha um centro de despacho secundário na estação de linha, esse
  centro deverá adotar os mesmos procedimentos e padrões do centro de despacho principal,
  além de atender aos mesmos requisitos.

  5.5.2. Composição do Despacho de Voo

  5.5.2.1 O despacho de voo realizado no centro de despacho secundário deve atender aos mesmos
  requisitos e padrões utilizados no despacho realizado no centro de despacho principal do
  detentor de certificado.

  5.6. Auditorias internas'
