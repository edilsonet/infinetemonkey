title: DESENVOLVIMENTO DO ASSUNTO
text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1 Funções e responsabilidades

  5.1.1. Uma estação de linha deve possuir estrutura orgânica e pessoal em número suficiente
  e em condições de desempenhar adequadamente as funções descritas no Manual Geral de Operações
  ou em outro manual específico do detentor de certificado (como Manual de Aeroportos).

  5.1.2. A estrutura orgânica deve ser claramente definida, explicitando as linhas de responsabilidade
  estabelecidas e visando permitir o fluxo eficiente das informações.

  5.1.3. A estrutura orgânica deve contemplar, no mínimo, as seguintes funções:

  a. Gerente da estação

  I. função responsável pela coordenação geral das atividades da estação, vigilância das condições
  que afetem a segurança operacional das operações do detentor do certificado na localidade
  da estação, além de ser o representante do detentor de certificado perante a ANAC; e

  II. é recomendado que a designação para essa função de gerente da estação considere a necessidade
  de conhecimentos sobre a legislação, manuais do detentor de certificado aplicáveis às operações
  realizadas na estação e Especificações Operativas do detentor de certificado. Em caso de
  estações no exterior, recomenda-se também a necessidade de conhecimentos sobre a legislação
  local bem como o Anexo 6, Parte I - Operation of aircraft: International Commercial Air
  Transport - Aeroplanes e o Doc 8335 - Manual of Procedures for Operations Inspection, Certification
  and Continued Surveillance, ambos publicados pela OACI.

  b. Encarregado de rampa

  I. função responsável pela conferência dos procedimentos e da documentação produzida para
  o voo, incluindo: abastecimento, carregamento em conformidade com o previsto no cálculo
  de peso e balanceamento e verificação final da condição de cargas consideradas artigos perigosos.

  c. Encarregado de passageiros

  I. função responsável pelo embarque e desembarque de passageiros, incluindo o “check-in”,
  a aceitação de bagagens e a condução segura dos passageiros entre o terminal do aeródromo
  e a aeronave; e

  II. os encarregados de passageiros devem ter conhecimento suficiente sobre o ambiente operacional
  para que possam conduzir os passageiros com segurança, ter conhecimentos básicos sobre artigos
  perigosos e interferência ilícita, incluindo o reconhecimento de condições suspeitas em
  passageiros e bagagens. Em operações no exterior, de acordo com as exigências locais, podem
  ser requeridos conhecimentos sobre procedimentos para seleção de passageiros de origem suspeita.

  d. Balanceador

  I. função responsável pela montagem do manifesto de carga do voo.

  e. Encarregado pelo reabastecimento

  I. função responsável pela observância do grau de segurança operacional no abastecimento
  das aeronaves em uma estação, quando estiver disponível tal facilidade.

  f. Despachante operacional de voo (DOV) do centro de despacho secundário (se aplicável)

  I. a função de DOV do centro de despacho secundário possui as mesmas responsabilidades e
  atribuições da função de DOV do centro de despacho principal do detentor de certificado;
  e

  II. os DOV devem atender aos requisitos de qualificação constantes na seção 121.463 do RBAC
  nº 121.

  5.2 Treinamento

  5.2.1. Requisitos gerais

  5.2.1.1. O detentor de certificado deve estabelecer e aprovar um programa de treinamento
  formal que contemple cada uma das funções previstas na estrutura orgânica da estação, visando
  capacitar as pessoas de maneira a desempenhar essas funções de maneira adequada.

  5.2.1.2. O programa de treinamento deve estabelecer:

  a. os currículos de treinamento inicial e periódico aplicáveis a cada função;

  b. as disciplinas constantes de cada currículo;

  c. a carga horária e ementa de cada disciplina; e

  d. a periodicidade do treinamento.

  5.2.1.3. Cabe ao detentor do certificado a responsabilidade pela qualidade e efetividade
  do treinamento das pessoas que executam funções na estação, independentemente de esse treinamento
  ser aplicado com recursos próprios ou de terceiros.

  5.2.1.4 O programa de treinamento é aplicável a todas as pessoas que exerçam funções na
  estação de linha, independentemente do tipo de vínculo estabelecido entre o detentor de
  certificado e essas pessoas.

  5.2.1.5 Para as disciplinas nas quais a atividade de instrução seja regulamentada, a instrução
  deve seguir a regulamentação específica, incluindo, conforme aplicável, a necessidade de
  autorização para instrução, a qualificação dos instrutores, o conteúdo e carga horária etc.

  5.2.1.6 Os currículos de treinamento devem contemplar, no nível de profundidade e detalhamento
  adequado à função a ser desempenhada, os assuntos listados a seguir, mas não se limitando
  a esses:

  a. deveres e responsabilidades;

  b. artigos perigosos (conforme a função);

  c. proteção e trato de passageiros;

  d. instruções de carregamento (formulários e procedimentos);

  e. procedimentos de peso e balanceamento;

  f. procedimentos manuais para todos os procedimentos computadorizados;

  g. procedimentos de comunicação;

  h. serviços de aeronave e de rampa;

  i. primeiros socorros e de emergência;

  j. Manual de Aeroportos ou equivalente;

  k. SGSO;

  l. PRE do detentor de certificado; e

  m. PLEM do aeródromo.

  5.2.2. Conteúdo específico por função'
