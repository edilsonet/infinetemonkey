text: '121.133

  A empresa deve encaminhar à ANAC uma cópia de sua proposta de MCmsV com o nome e assinatura
  de aprovação do diretor de operações ou do gestor responsável, no início do manual e em
  sua lista de páginas efetivas (LEP).

  3'
