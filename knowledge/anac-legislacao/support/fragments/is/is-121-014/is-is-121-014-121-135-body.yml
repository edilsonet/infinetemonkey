text: '121.135 (b)(25)

  Procedimentos e instruções sobre o reconhecimento, guarda, manuseio e transporte de artigos
  perigosos, de acordo com a Subparte Z do RBAC nº 121, incluindo ações a serem tomadas em
  caso de emergência.

  Os procedimentos devem conter menção sobre o tratamento de contingências que podem vir a
  ocorrer com baterias, em especial baterias de lítio transportadas como bagagem de mão na
  cabine de passageiros.

  Nota: orientações sobre o desenvolvimento de políticas e procedimentos para lidar com ocorrências
  com artigos perigosos a bordo de aeronaves constam no RBAC nº 175 e suas instruções suplementares
  correlacionadas.

  13

  121.135(c)(2)

  Caso seja utilizada cópia de publicações originais do fabricante dos aviões e equipamentos,
  o texto deve estar em português ou inglês. Se for em inglês, o detentor de certificado deve
  demonstrar que o pessoal ao qual as cópias serão distribuídas será capaz de ler e entender,
  perfeitamente, as instruções nelas contidas, antes de assumir as funções.

  14

  121.137, 121.135(d)

  Listagem dos detentores das cópias controladas do MCmsV, assim como a forma de disponibilização
  e/ou distribuição do manual, incluindo as estações de linha, para o pessoal de operações
  de solo, pessoal de manutenção, tripulações e órgãos determinados pela ANAC. Vide o item
  5.4 desta IS.

  15'
