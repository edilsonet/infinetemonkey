  91.17

  Procedimentos do operador para garantir que um comissário não atue sob efeito de álcool
  ou fazendo uso de bebida alcoólica, sob efeito ou fazendo uso de substância psicoativa,
  ou possuindo qualquer concentração de álcool no organismo.

  Procedimentos do operador para garantir que um comissário não atue imediatamente após doar
  sangue ou realizar atividades de mergulho, ou após qualquer outra atividade que possa degradar
  temporariamente a aptidão psicofísica da pessoa para o exercício da função de comissário.

