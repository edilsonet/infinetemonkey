text: 'k) outros, a critério do operador.

  92

  Res. 280/2013, arts. 17 e 18

  Transporte de PNAE. Procedimentos para garantir que o PNAE seja embarcado antes de todos
  os demais passageiros e que seja desembarcado, após a viagem, após o desembarque de todos
  os demais passageiros, exceto quando o tempo disponível para a conexão ou outra circunstância
  justificarem a priorização.

  93

  Res. 280/2013, art. 20

  Transporte de PNAE. Procedimentos para o embarque de PNAE que utilizem cadeira de rodas
  ou maca, utilização de equipamentos de ascenso e descenso ou outro meio, quando for o caso,
  desde que garantida a segurança e dignidade do PNAE, e vedação expressa a que se carregue
  manualmente o PNAE, exceto nas situações que exijam a evacuação de emergência da aeronave.

  94

  Res. 280/2013, arts. 29 e 30

  Transporte de PNAE. Procedimentos para verificar as condições de embarque e lidar com cães
  guias no interior da cabine.

  95

  Res. 280/2013, art. 32

  Transporte de PNAE. Procedimento de verificação para assegurar que nenhum outro passageiro
  ocupe assento localizado imediatamente atrás ou assento que tenham acesso ao(s) corredor(es)
  da aeronave obstruídos pelo assento com encosto na posição reclinada, em caso de PNAE que
  precise manter a posição de seu assento com encosto na posição reclinada em todas as fases
  do voo.

  96

  Res. 400/2016, art. 15, § 2º

  Procedimentos para o transporte de animais na cabine de passageiros.'
