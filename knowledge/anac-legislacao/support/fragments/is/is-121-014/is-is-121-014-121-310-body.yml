text: '121.310 (d)(1)(i) e (d)(2)

  Luzes de emergência e da cabine de passageiros. Descrição e procedimentos para a operação
  adequada das luzes de emergência operáveis da cabine de passageiros e das luzes da cabine
  de passageiros durante a rolagem, decolagem e pouso, e durante alertas de segurança (incluindo
  previsão para antecipada evacuação de emergência).

  21

  121.311(b), (c)

  Disciplina quanto ao uso do cinto de segurança por tripulantes e passageiros e procedimento
  para crianças desacompanhadas.

  22

  121.311(e)

  Disciplina quanto ao posicionamento dos assentos de passageiros na posição vertical.

  23

  121.311(h)

  Disciplina quanto a uso pelos tripulantes do cinto de segurança ou cinto de ombro.

  24

  121.311(i)

  Verificação dos cintos de segurança ou cintos de ombro em assentos desocupados de tripulantes,
  para que estejam seguros de modo a não interferir com tripulantes na execução de suas obrigações
  ou com a saída rápida de ocupantes em uma emergência.

  25

  121.317(a)

  Procedimentos para operação dos avisos luminosos aos passageiros.

  26'
