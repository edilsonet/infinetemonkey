text: '121.337

  Descrição e procedimentos para uso do equipamento protetor de respiração (PBE) pelo tripulante
  em combate a incêndio e outras situações de fumaça ou vapor.

  31

  121.391(a), (b) e (c)

  Conhecimento do número de comissários que deve haver a bordo, conforme as EO, assim como
  a descrição das suas funções e responsabilidades em cada posição (chefe de equipe, chefe
  de serviço, auxiliar 1, auxiliar 2, etc.).

  32

  121.391(e) e (f)

  Posicionamento dos comissários. Distribuição uniforme pela aeronave. Tratar o caso de assento
  de comissário inoperante em caso de desembarque de um comissário ou no caso de um comissário
  ficar responsável por mais de uma saída.

  Procedimento para substituição de comissário em caso de necessidade.

  Procedimento detalhado sobre as possíveis reduções de comissários por adoecimento fora de
  base conforme o parágrafo 121.391(f) e a readequação dos procedimentos operacionais e de
  segurança para tal.

  33'
