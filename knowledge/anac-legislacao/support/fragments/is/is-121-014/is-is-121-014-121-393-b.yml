title: 121.393(b)
text: 'b) Nos procedimentos deverão constar o método de comunicação com outros membros da
  tripulação que estão lidando com os sequestradores.

  Nota: detalhes não podem estar contidos no manual e os procedimentos gerais inscritos no
  manual deverão estar limitados (podendo ainda estar codificados).'
