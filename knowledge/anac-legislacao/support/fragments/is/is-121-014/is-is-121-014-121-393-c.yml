text: 'c) Deverão constar também procedimentos a serem tomados em caso de suspeita ou evidência
  de bomba a bordo, em solo e em voo.

  43

  121.421(a)(1)(i)

  Autoridade do piloto em comando - sucessão de comando.

  44

  121.421(a)(1)(ii)

  Procedimentos para orientação e controle dos passageiros, incluindo prestação de assistência
  adequada a PNAEs (vide Res. 280/2013) e procedimentos a serem seguidos no caso de pessoas
  desordeiras ou pessoas cuja conduta possa prejudicar a segurança (gerenciamento do comportamento
  inconveniente - GCI).

  Descrição e procedimentos para operação de equipamentos de segurança da aeronave para contenção
  em indisciplina.

  45'
