text: '121.563

  Procedimento para lançamento de panes correspondentes ao logbook de cabine de passageiros
  e notificação ao comandante.

  50

  121.571(a) e (c)

  121.573(a) e (b)

  Procedimentos que garantam que cada comissário conhecerá e possuirá, por escrito, nas línguas
  em que deverá utilizar, as orientações verbais que deverá fornecer aos passageiros sobre
  fumo, saídas, cintos, dispositivos de flutuação, uso das máscaras de oxigênio em caso de
  despressurização, referência ao cartão de informações, utilização de equipamentos eletrônicos
  portáteis a bordo, dentre outras.

  Nota: na entrevista (auditoria), o comissário deve demonstrar conhecer as referidas orientações.

  51

  121.571(a)(1), (d), (e)

  Procedimentos para as instruções verbais, em português e/ou outra língua, inclusive por
  meios audiovisuais, que deverão ser dadas aos passageiros antes da decolagem, abordando
