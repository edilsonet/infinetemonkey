text: 'c) uma referência às tarefas a serem executadas estabelecidas no parágrafo 121.585(d).

  Nota: se a localização de algum dos itens variar de um avião para outro, N-números com localização
  especificada deverão constar no Manual.

  55

  121.573(a), (c), (d), (e)

  Procedimentos para as instruções verbais, em português e/ou outra língua, inclusive por
  meios audiovisuais, que deverão ser dadas aos passageiros antes da decolagem (ou após, cf.
  121.573(c)), caso o avião opere sobre grandes extensões de água, abordando a localização
  e a operação de coletes salva-vidas, botes e outros meios de flutuação, incluindo uma demonstração
  de como vestir e inflar os coletes.

  56

  121.574(a) a (d), Res. 280/2013, art. 10, II

  Procedimentos para verificação se o equipamento para armazenar, gerar ou fornecer oxigênio,
  portado e operado pelo passageiro, atende aos parágrafos (a) até (d) da seção 121.574 do
  RBAC nº 121.

  57

  121.574(a) a (e) , Res. 280/2013, art. 10, II

  Procedimentos para verificação se o concentrador de oxigênio portátil, portado e operado
  pelo passageiro, atende aos parágrafos (b) até (e) da seção 121.574 do RBAC nº 121.

  58

  121.575(a)

  Procedimentos para a abordagem do comissário ao passageiro flagrado consumindo bebida alcóolica
  outra que não a fornecida pela tripulação.

  59

  121.575(b)

  Procedimentos para o reconhecimento de passageiro que possa estar embriagado, que esteja
  escoltando alguém ou que esteja sendo escoltado, ou que tenha uma arma perigosa ou mortal
  ao seu alcance enquanto a bordo do avião, ao qual não poderá ser servida qualquer bebida
  alcóolica.

  60

  121.575(c)

  Procedimentos para o reconhecimento, no embarque, de passageiro que possa estar embriagado,
  que não poderá ser admitido a bordo no avião.

  61'
