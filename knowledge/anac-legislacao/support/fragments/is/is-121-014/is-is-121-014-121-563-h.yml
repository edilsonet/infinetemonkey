text: 'h) instruções sobre a utilização de equipamentos eletrônicos portáteis a bordo.

  52

  121.571(a)(2), (d), (e)

  Procedimentos para as instruções verbais, em português e/ou outra língua, inclusive por
  meios audiovisuais, que deverão ser dadas aos passageiros após da decolagem, imediatamente
  antes ou após o apagamento do aviso de atar cintos, avisando-os que, enquanto sentados,
  mesmo com o aviso apagado, todos devem conservar os cintos de segurança atados e ajustados.

  53

  121.571(a)(3), (d), (e)

  Procedimentos para as instruções verbais, em português e/ou outra língua, inclusive por
  meios audiovisuais, que deverão ser dadas aos passageiros que possam necessitar do auxílio
  de outra pessoa para deslocar-se mais rapidamente para uma saída em caso de emergência (notadamente,
  os PNAE previstos na Resolução nº 280/2013), e seus acompanhantes, antes da decolagem, abordando
  minimamente os seguintes assuntos:'
