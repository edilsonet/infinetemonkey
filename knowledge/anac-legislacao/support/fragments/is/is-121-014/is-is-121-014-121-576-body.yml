text: '121.576

  Procedimentos para a guarda apropriada de cada item de equipamentos de "galley", de cada
  carrinho de serviço e de cada item de bagagem de tripulantes transportado na cabine, para
  que não se tornem perigosos sob o impulso dos fatores de carga correspondentes às condições
  de pouso em emergência sob as quais o avião foi certificado.

