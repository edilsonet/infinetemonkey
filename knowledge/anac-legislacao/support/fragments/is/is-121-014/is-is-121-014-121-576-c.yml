text: 'c) A acomodação adequada de toda a bagagem de mão antes do fechamento das portas.

  69

  121.589(b), (g)

  Procedimento para verificação da adequada acomodação de toda a bagagem de mão antes do fechamento
  das portas de entrada de passageiros.

  70

  121.589(c), (g)

  Procedimento para verificação da adequada acomodação de toda a bagagem de mão antes da decolagem
  do avião.

  71

  121.589(d)

  Procedimento para verificação de ocorrência de peças soltas (exceto peças de vestuário),
  em prateleiras sem portas aprovadas ou dispositivos de amarração, sobre a cabeça dos passageiros,
  assim como para o saneamento de tal ocorrência durante a operação e especialmente antes
  da movimentação do avião na superfície, decolagem ou pouso.

  72

