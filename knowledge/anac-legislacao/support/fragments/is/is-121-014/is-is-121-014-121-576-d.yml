  Art. 28, §§1° e 2° da Res. 461/2018

  Procedimentos para lidar com passageiro(s) que não obedeça(m) às instruções da tripulação,
  ou que agrida(m), ameace(m), intimide(m) ou perturbe(m) um tripulante exercendo os deveres
  de tripulante a bordo.

  64

  121.585(a), (b), (d), (g), (k), (l)

  Procedimentos para definição de quais pessoas não podem ocupar um assento de saída, de acordo
  com os critérios do parágrafo 121.585(b), assim como para orientar o comandante do avião
  de que não existe assento de saída ocupado por uma pessoa que esse tripulante julgue ser
  incapaz de executar uma das tarefas aplicáveis listadas no parágrafo 121.585(d), de modo
  que não haja óbice a que se inicie a movimentação do avião na superfície por este motivo.

  65

  121.585(i), (j)

