text: 'e) deverá ser informado ao passageiro armado os procedimentos de identificação para
  acesso à sala de embarque.

  73

  121.590a

  Res. 461/2018, art. 19, art. 28, §§ 1° e 2°, e art. 38, § 2°

  Transporte de passageiro armado. Procedimento a ser tomado em caso de suspeita de descumprimento
  da norma, para a notificação da autoridade competente que emitiu o formulário de autorização
  de embarque armado ou do formulário de autorização de despacho de arma de fogo e, se for
  o caso, para o desembarque compulsório do passageiro armado ou recusa do despacho das armas
  e munições.

  74

  121.590a

  Res. 461/2018, art. 20

  Transporte de passageiro armado. Procedimento para informar toda a tripulação da aeronave
  sobre o embarque de passageiro armado de forma discreta, limitando-se ao nome do passageiro
  e número do seu assento, de forma a resguardar o sigilo da existência de arma a bordo e
  da condição de seu detentor.

  75

  121.590a

  Res. 461/2018, art. 21

  Transporte de passageiro armado. Procedimento para informar, de forma reservada, ao passageiro
  que embarcar armado, a existência e o local de assento de outros passageiros que se encontrem
  nessa mesma condição.

  76

  121.590a

  Res. 461/2018, art. 22

  Transporte de passageiro armado. Procedimento para notificação da tripulação da outra aeronave
  sobre a presença e identificação do(s) passageiro(s) armado(s), caso haja a transferência
  desse passageiro armado de uma aeronave para outra.

  77

  121.590a

  Res. 461/2018, art. 25

  Transporte de passageiro armado. Procedimento para embarque de passageiro armado de forma
  discreta e sem alarde.

  78

  121.590a

  Res. 461/2018, art. 36, §§1° ao 3°

  Despacho de arma de fogo - check-in. Devem ser detalhados procedimentos para solicitação
