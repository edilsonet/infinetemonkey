text: '121.701

  121.703(a)(20)

  Livro de reportes e relatórios de cabine. Responsabilidade e procedimentos para preenchimento
  e modelo de formulários para reportes.

  Relatório sobre eventos médicos a bordo, incluindo falecimento, identificando óbito a bordo
  e procedimentos de registro.

  81

  Res. 461/2018, art. 64, Parágrafo único.

  Transporte aéreo de passageiro sob custódia. Procedimento para ser concedido atendimento
  prioritário à equipe de escolta no procedimento de check-in presencial, exceto em relação
  aos PNAE.

  82

  Res. 461/2018, art. 68

  Transporte aéreo de passageiro sob custódia. Procedimento para embarque e o desembarque
  de passageiro custodiado de forma discreta, evitando alarde e transtornos aos outros passageiros.

  83

  Res. 461/2018, art. 69

  Transporte aéreo de passageiro sob custódia. Procedimento de verificação se a equipe de
  escolta não for composta por, no mínimo, dois profissionais por passageiro custodiado, e
  para a respectiva negativa de embarque caso esse critério não esteja sendo observado.

  84

  Res. 461/2018, art. 71

  Transporte aéreo de passageiro sob custódia. Procedimento para restringir ao passageiro
  sob custódia o acesso, no serviço de bordo, de bebidas alcoólicas, utensílios de metal ou
  instrumentos perfurantes ou cortantes

  85

  Res. 461/2018, art. 73

  Transporte aéreo de passageiro sob custódia. Procedimentos para orientar a equipe de escolta
  de passageiro custodiado acerca dos procedimentos e condutas adequados a bordo da aeronave,
  previamente à decolagem.

  86

  Res. 461/2018, art. 76

  Procedimentos para transporte de passageiros impedidos, repatriados, deportados ou expulsos.

  87'
