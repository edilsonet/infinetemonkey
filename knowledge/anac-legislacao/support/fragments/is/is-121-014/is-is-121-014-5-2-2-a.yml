cite: 5.2.2(a)
title: 5.2.2(a)
text: 'a) Estrutura única: neste caso, o MCmsV é composto de um volume único, com exatamente
  a mesma estrutura do Apêndice B, na sequência em que são apresentados. Todo o conteúdo é
  desenvolvido dentro dessa estrutura, de forma que este volume seja completo e suficiente
  para demonstrar atendimento às diretrizes desta IS;'
