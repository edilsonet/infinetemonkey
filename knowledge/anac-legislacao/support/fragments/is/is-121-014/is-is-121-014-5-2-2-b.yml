section_title: 'Quanto à estrutura do MCmsV, o operador poderá adotar uma das opções abaixo:'
subsection_id: b
cite: 5.2.2(b)
title: 5.2.2(b)
text: 'b) Estrutura mista: neste caso, o MCmsV é composto de um volume principal e complementado
  por publicações produzidas por outras organizações (governamentais ou comerciais) e por
  outros manuais ou trechos de manuais publicados pelo operador. O volume principal do MCmsV
  mantém a estrutura estabelecida no Apêndice B e, quando aplicável, indica no local correspondente
  onde a informação está disponível no documento ou manual complementar. Parte do conteúdo
  do MCmsV é desenvolvida no volume principal, e parte é desenvolvida nos manuais e documentos
  complementares.'
