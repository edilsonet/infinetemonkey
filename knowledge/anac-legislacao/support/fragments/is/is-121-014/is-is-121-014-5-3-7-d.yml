section_id: 5.3.7
section_title: 'O MCmsV deve ser aprovado em qualquer uma das condições abaixo:'
subsection_id: d
cite: 5.3.7(d)
title: 5.3.7(d)
text: 'd) quando por iniciativa do operador pelo menos um dos assuntos abaixo for alterado:

  I - transporte de PNAEs;

  II - transporte de passageiro armado, custodiado ou despacho de armas;

  III - procedimentos em emergências; e

  IV - procedimentos relacionados à segurança de voo ou de verificação de equipamentos de
  emergência.

  5.4 Uso do MCmsV em serviço

  5.4.1 O operador deve manter o MCmsV e demais manuais e documentos que o complementam em
  sua base principal de operações. Além disso, cada operador deve fornecer o MCmsV ou as partes
  aplicáveis do MCmsV a todos os comissários de voo e todas as pessoas que precisam tomar
  ciência do conteúdo do manual. O MCmsV pode ser confeccionado no formato convencional em
  papel ou em outro formato que seja conveniente para seus usuários. Todos os comissários
  de voo que receberam uma cópia do manual devem mantê-lo atualizado. Cada comissário de voo
  deve ter acesso ao MCmsV ou às partes apropriadas do MCmsV enquanto estiver executando suas
  tarefas.

  5.4.2 Uma cópia impressa do MCmsV deve ser levada a bordo de todas as aeronaves do operador
  com até 2 (dois) comissários. Para aeronaves com mais de 2 comissários, deve ser levada
  a bordo duas cópias do MCmsV, um posicionado na parte dianteira e outro na parte traseira
  da aeronave.

  5.4.3 O operador deve fornecer um QRH (Quick Reference Handbook), contendo um resumo dos
  procedimentos de emergência, que deve estar presente em local estratégico no avião.'
