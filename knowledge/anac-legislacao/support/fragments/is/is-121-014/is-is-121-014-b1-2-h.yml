text: '(h) descrição do sistema de distribuição, emendas e revisões dos manuais.

  B2. CONTEÚDO DO MCMSV

  Cada coluna da tabela abaixo traz uma informação específica sobre requisitos de manual de
  comissários de voo (MCmsV).

  Não existe diferenciação entre os MCmsV de empresas regulares ou não-regulares.

  Coluna “Seção do RBAC ou art. da Resolução” - indicação da seção(ões) ou parágrafo(s) do
  RBAC, ou art. da Resolução, que contém o requisito para o MCmsV.

  Coluna “Explicação do Requisito” - contém explicação mais detalhada sobre o que deve ser
  preenchido para o requisito da linha.

  Seção do RBAC ou art. da Resolução Explicação do Requisito


  Seção do RBAC ou art. da Resolução

  Explicação do Requisito

  1'
