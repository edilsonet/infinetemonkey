title: Demonstração de evacuação de emergência (DEE)
text: '5.1.1 Demonstração de evacuação de emergência (DEE)

  5.1.1.1 Procedimentos efetivos de evacuação de emergência têm reduzido significativamente
  o número de vítimas em acidentes aeronáuticos com sobreviventes. A ANAC considera que a
  proficiência de um operador em realizar tais procedimentos é um importante fator de segurança
  de voo.

  5.1.1.2 Nas situações em que os aviões que o operador venha a operar possuam equipamentos
  que possam ser utilizados em uma evacuação de emergência, mas que não sejam requeridos para
  a certificação e que já tenha ocorrido uma DEE satisfatória, não será requerida a realização
  de uma nova DEE, desde que esses equipamentos não impactem os procedimentos demonstrados.
  O operador deverá adotar as medidas necessárias para viabilizar o emprego correto de tais
  equipamentos, incluindo, conforme aplicável, treinamentos adicionais aos tripulantes, disponibilização
  de informações e instruções aos passageiros e demais medidas necessárias.'
