title: Pessoas presentes na DEE
text: '5.1.10 Pessoas presentes na DEE

  5.1.10.1 Apesar de não haver proibição, por parte da ANAC, de que pessoas empregadas do
  operador (tais como comissários, mecânicos e técnicos de segurança) alheias à DEE assistam
  o exercício, é responsabilidade do operador que tais pessoas não sejam elementos de distração
  ou impedimento de realização da DEE, devendo o operador garantir-lhes segurança e um afastamento
  mínimo do local da DEE.

  5.1.10.2 Pessoas que não sejam empregadas do operador que não tenham tarefas específicas
  na DEE (exceção: equipe de filmagem, equipe de segurança, médicos, representantes do fabricante
  ou de outros operadores e outros) estão proibidas de permanecerem no local da DEE.

  5.1.10.3 É responsabilidade do operador, caso opte por contratar uma equipe de filmagem,
  que ela esteja devidamente orientada a não distrair nem atrapalhar sua tripulação ou os
  servidores participantes da DEE. A DEE pode ser considerada insatisfatória caso a equipe
  de filmagem impeça a visualização da DEE por parte de algum servidor presente.

  5.2 Processo para demonstração de evacuação de emergência'
