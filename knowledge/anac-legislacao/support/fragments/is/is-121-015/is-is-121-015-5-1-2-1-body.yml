title: A demonstração real de evacuação de emergência deve ser realizada conforme determinado
  pelo parágrafo 121.291(a) do RBAC n° 121.
text: '5.1.2.1 A demonstração real de evacuação de emergência deve ser realizada conforme
  determinado pelo parágrafo 121.291(a) do RBAC n° 121.

  5.1.2.2 Uma demonstração real de evacuação de emergência simula uma decolagem abortada.
  Antes do início de uma demonstração, um passageiro deve ocupar cada assento instalado.

  5.1.2.3 No caso de uma DREE, o operador está proibido de praticar ou descrever aos passageiros
  da simulação detalhes sobre a demonstração e nenhum dos passageiros da simulação poderá
  ter participado de exercício semelhante nos últimos 6 (seis) meses.'
