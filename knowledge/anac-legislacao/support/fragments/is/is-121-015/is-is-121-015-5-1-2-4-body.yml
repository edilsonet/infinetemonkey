text: '5.1.2.4 O parágrafo (a) do Apêndice D do RBAC nº 121 descreve os detalhes requeridos
  para esse tipo de demonstração.

  5.1.2.5 Quando se utiliza uma demonstração por terceiros para cumprimento do requisito,
  conforme permitido pelo parágrafo 121.291(a)(1) do RBAC nº 121, seja um outro operador do
  avião, seja o fabricante, durante o processo de certificação, o operador deve adotar, em
  seu treinamento e em seus procedimentos operacionais, os mesmos padrões considerados na
  demonstração efetuada pelo terceiro, incluindo o número e a posição de comissários utilizados.
  Qualquer revisão posterior nesses treinamentos e procedimentos deve considerar o possível
  impacto na capacidade de evacuação em emergência do avião.'
