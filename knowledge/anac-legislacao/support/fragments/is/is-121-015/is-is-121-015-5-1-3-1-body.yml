text: '5.1.3.1 A demonstração parcial de evacuação de emergência deve ser realizada conforme
  determinado pelo parágrafo 121.291(b) do RBAC nº 121.

  5.1.3.2 A DPEE pode ser dispensada nas situações previstas nos parágrafos 121.291(b)(2)
  e 121.291(b)(3) do RBAC nº 121, caso seja possível demonstrar por outros meios que tais
  alterações não prejudicam uma evacuação de emergência.'
