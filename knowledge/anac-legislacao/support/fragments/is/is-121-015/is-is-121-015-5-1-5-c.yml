section_title: 'Todas as demonstrações avaliarão, especificamente, as seguintes áreas:'
subsection_id: c
cite: 5.1.5(c)
title: 5.1.5(c)
text: 'c) a confiabilidade e a capacidade dos equipamentos de emergência do avião, e a eficácia
  da manutenção destes equipamentos, caso o operador já opere.

  5.1.6 Gerentes (tais como o gerente/diretor de operações e o gerente/diretor de manutenção
  ou representantes destes) do operador devem estar presentes às DEE. Estes gerentes devem
  dispor de autoridade suficiente para autorizar, em nome do operador, quaisquer detalhes
  da DEE a ser realizada. Devem também ter condições de responder e justificar possíveis não-conformidades
  ocorridas durante a DEE.'
