text: '5.1.7 O operador deve nomear um coordenador do operador da DEE, que será o ponto focal
  para toda a comunicação necessária à execução da demonstração.

  5.1.8 O número de comissários a bordo para a DEE deve ser o número mínimo que o operador
  tenha intenção de disponibilizar a cada voo e não pode ser menor que o requerido pela seção
  121.391 do RBAC nº 121.

  5.1.9 O avião deve estar posicionado em configuração normal para uma decolagem e as portas
  e persianas das janelas devem estar fechadas. Caso as portas do avião não possuam meios
  de impedir a visão do exterior, um anteparo deverá ser colocado para este fim.'
