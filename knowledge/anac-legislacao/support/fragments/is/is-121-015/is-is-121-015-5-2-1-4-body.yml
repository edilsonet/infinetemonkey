text: '5.2.1.4 PlanDemo.

  5.2.1.4.1 O parágrafo 121.291(c)(2) do RBAC nº 121 requer que o operador solicite acompanhamento
  da ANAC para uma DEE. O operador deve submeter o PlanDemo à apreciação da ANAC o mais cedo
  possível, sendo o prazo mínimo para solicitação de uma DEE o previsto na IS nº 119-001.'
