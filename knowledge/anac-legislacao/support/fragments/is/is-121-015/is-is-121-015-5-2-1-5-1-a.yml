section_title: 'O PlanDemo deverá conter os seguintes documentos:'
subsection_id: a
cite: 5.2.1.5.1(a)
title: 5.2.1.5.1(a)
text: 'a) o Formulário F-291 preenchido (disponível no site da ANAC em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios).
  O coordenador da DEE deve ser especificamente indicado neste formulário. A parte indicada
  como “Descrição das características da demonstração” deve conter:

  I) como o operador planeja o início da DEE ou sinal de início da DEE (queda de força, sinal
  de “EVAC” ou ordem verbal);

  II) o modo de bloqueio das portas que não serão abertas;

  III) como o operador planeja simular as condições de “noite escura” ou “escuridão da noite”;
  e

  IV) a localização planejada do avião, de forma a garantir áreas desimpedidas para a abertura
  de escorregadeiras e botes;'
