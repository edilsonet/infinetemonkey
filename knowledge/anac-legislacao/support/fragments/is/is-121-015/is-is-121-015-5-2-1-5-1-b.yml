section_title: 'O PlanDemo deverá conter os seguintes documentos:'
subsection_id: b
cite: 5.2.1.5.1(b)
title: 5.2.1.5.1(b)
text: 'b) uma planta baixa representativa do avião alvo da DEE, que deve incluir:

  I) a localização e designação de todas as saídas de emergência e a correspondência entre
  posição de cada comissário e a saída pela qual ele é responsável;

  II) os assentos designados para cada integrante da tripulação no momento da decolagem e
  designação do tripulante (por exemplo: comissário-chefe ou auxiliar 01);

  III) a configuração interna da cabine de passageiros detalhando “galleys”, corredores, lavatórios
  e outros compartimentos; e

  IV) o tipo e localização de cada equipamento de emergência do avião, incluindo:

  A) extintor(es) de incêndio;

  B) cilindros e máscaras de oxigênio;

  C) megafones;

  D) machadinhas;

  E) cordas de emergência;

  F) escorregadeiras e botes de emergência;

  G) coletes salva-vidas; e

  H) conjuntos médicos e de primeiros socorros;'
