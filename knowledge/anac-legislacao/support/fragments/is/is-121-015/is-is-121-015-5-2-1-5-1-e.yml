title: 5.2.1.5.1(e)
text: 'e) lista com 4 tripulações completas (tripulantes técnicos e comissários) com qualificações
  para participação na DEE, conforme o seguinte:

  I) os pilotos devem ter concluído o programa de treinamento do operador no avião;

  II) os comissários devem ter cumprido o programa de treinamento aprovado do operador e não
  podem ter sido submetidos a nenhum treinamento específico para a DEE além do especificado
  nesse programa de treinamento;

  III) não pode constar da lista os tripulantes envolvidos com o treinamento de pessoal, exceto
  se a quantidade total de tripulantes do operador impossibilitar o cumprimento deste item;
  e

  IV) todos os tripulantes envolvidos devem estar com suas habilitações válidas. O operador
  deve considerar em seu cronograma de início das operações, o tempo para inclusão de nova
  habilitação, se for este o caso.'
