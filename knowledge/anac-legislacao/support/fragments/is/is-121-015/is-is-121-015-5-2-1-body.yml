title: 'Fase 1: reunião de orientação prévia'
text: '5.2.1 Fase 1: reunião de orientação prévia

  5.2.1.1 Nesta fase a ANAC determina a necessidade de realizar uma demonstração de evacuação
  de emergência (DEE), bem como identifica, diante dos requisitos do RBAC nº 121, qual tipo
  de DEE deverá ser realizada, se real (DREE) ou parcial (DPEE).

  5.2.1.2 Uma vez comunicado durante a reunião de orientação prévia de certificação, o operador
  deverá desenvolver um planejamento detalhado (o PlanDemo), descrevendo como pretende realizar
  a demonstração.

  5.2.1.3 Devem ser realizadas tantas reuniões quanto o necessário entre o operador e a GCTA
  de forma a assegurar que o operador compreendeu todos os requisitos e obrigações referentes
  à DEE.'
