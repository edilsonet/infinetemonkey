text: '5.2.2 Fase 2: entrega do PlanDemo

  5.2.2.1 Nesta fase, o coordenador da DEE do operador entrega o PlanDemo para avaliação da
  ANAC. Se for possível resolver pequenas pendências imediatamente, tais como falta de datas
  ou telefones de contato, estas falhas poderão ser solucionadas pelo próprio coordenador,
  no momento da entrega do PlanDemo.'
