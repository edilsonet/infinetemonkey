section_title: 'Nesta fase será realizada uma avaliação detalhada do PlanDemo, incluindo:'
subsection_id: f
cite: 5.2.3.1(f)
title: 5.2.3.1(f)
text: 'f) se o operador propõe ou está providenciando medidas aceitáveis de segurança para
  os participantes da DEE.

  5.2.3.2 Não-conformidades detectadas durante esta fase do processo e comunicadas ao operador
  deverão ser corrigidas na forma e prazo definidos pelas instruções que regem o processo
  de certificação.

  5.2.3.3 Caso o PlanDemo esteja conforme o requerido e reflita todas as informações necessárias
  de forma correta, o operador será notificado deste fato. Desta notificação constarão a confirmação
  da data, hora e local da DEE, equipe de servidores designada para a demonstração e a listagem
  de 2 tripulações formadas a partir das 4 tripulações fornecidas no PlanDemo.'
