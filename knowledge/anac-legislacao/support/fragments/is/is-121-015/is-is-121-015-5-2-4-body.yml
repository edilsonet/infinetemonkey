title: 'Fase 4: demonstração'
text: '5.2.4 Fase 4: demonstração

  5.2.4.1 Durante esta fase a ANAC acompanha e avalia a DEE. O planejamento desta fase é primordial
  para o sucesso de todo o processo. Uma descrição dos procedimentos relativos a esta fase
  se encontra detalhada no item 5.3 desta IS. Caso a DEE não seja bem-sucedida, o processo
  retorna à Fase 1, com entrega de novo PlanDemo.

  5.2.4.2 A DEE não deve ser repetida de imediato depois de uma demonstração insatisfatória,
  uma vez que qualquer falha demonstra um problema do operador solicitante, seja na área de
  treinamento, manutenção ou na própria elaboração dos procedimentos. O operador solicitante
  deve reiniciar a contagem de prazo de análise e de entrega de planos, pesquisando os motivos
  e corrigindo as falhas observadas e comunicando estas correções em documento anexado ao
  novo PlanDemo.'
