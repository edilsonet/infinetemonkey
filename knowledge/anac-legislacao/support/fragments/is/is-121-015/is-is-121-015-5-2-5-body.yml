title: 'Fase 5: certificação'
text: '5.2.5 Fase 5: certificação

  5.2.5.1 Uma vez confirmada a eficácia e eficiência do operador para condução de uma evacuação
  de emergência, o operador será notificado deste fato, por meio de documento que detalhe
  o número de passageiros autorizado e o número mínimo de comissários requerido para sua operação.'
