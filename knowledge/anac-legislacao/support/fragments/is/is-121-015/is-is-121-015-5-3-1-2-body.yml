text: '5.3.1.2 Escadas ventrais e de cauda não devem ser usadas, a menos que o coordenador
  da equipe da GCTA considere haver motivo para tanto.

  5.3.1.3 Apenas as saídas cuja abertura é função de um comissário segundo os procedimentos
  de emergência aprovados do operador devem ser selecionadas para abertura na DEE.'
