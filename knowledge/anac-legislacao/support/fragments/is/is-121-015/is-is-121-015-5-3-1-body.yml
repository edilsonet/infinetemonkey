title: Seleção de saídas
text: '5.3.1 Seleção de saídas

  5.3.1.1 Para aviões com um número par de saídas, 50% das portas e escorregadeiras devem
  ser abertas. Para aviões com um número ímpar de portas, deve-se subtrair uma e abrir 50%
  das restantes.'
