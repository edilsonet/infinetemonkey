title: 5.3.2.2(c)
text: 'c) posicionar um anteparo por fora das janelas de cada uma das portas, sendo que este
  será puxado quando do início da demonstração e as saídas a serem abertas ficarão sendo as
  portas sem o anteparo.

  5.3.2.3 Note-se, porém, que a escolha de qualquer uma destas opções não dispensa a necessidade
  da presença de integrante da equipe da GCTA a bordo, para checar os procedimentos dos comissários.'
