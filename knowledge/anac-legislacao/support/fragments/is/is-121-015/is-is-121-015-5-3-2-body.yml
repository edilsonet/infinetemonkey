title: Bloqueio de saídas
text: '5.3.2 Bloqueio de saídas

  5.3.2.1 A orientação geral da ANAC é de realizar o bloqueio de saídas de emergência por
  meio da presença de um integrante da equipe da GCTA em frente a cada porta, impedindo sua
  operação.'
