section_title: 'Alguns exemplos de sinal de início de evacuação são:'
subsection_id: c
cite: 5.3.3.3(c)
title: 5.3.3.3(c)
text: 'c) comando verbal da cabine de pilotos.

  5.3.3.4 Em todos os casos é responsabilidade do operador verificar que este sinal é claramente
  perceptível por sua tripulação e não demanda perda de tempo desnecessária.

  5.3.3.5 Deve-se orientar o operador que o sinal de início da DEE não precisa ser necessariamente
  igual ao previsto pelo programa de treinamento aprovado do operador, porém é recomendável
  que a situação se aproxime tanto quanto possível destes procedimentos, sem prejuízo dos
  15 segundos requeridos.'
