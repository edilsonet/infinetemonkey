title: Sinal de início
text: '5.3.3 Sinal de início

  5.3.3.1 A orientação geral da ANAC é de iniciar a cronometragem dos 15 segundos requeridos
  a partir do corte de energia externa do avião, uma vez que é um sinal perceptível de dentro
  do avião (para os tripulantes envolvidos) e de fora (para os integrantes da equipe da GCTA
  que marcarão o tempo). Caso julgue interessante, o coordenador GCTA tem liberdade para discutir
  com o operador algum melhor indicador de início.

  5.3.3.2 O operador deverá indicar ao coordenador GCTA o sinal de início de evacuação que
  será instruído aos tripulantes para que estes iniciem seus procedimentos.'
