title: Seleção de tripulantes para a DEE
text: '5.3.4 Seleção de tripulantes para a DEE

  5.3.4.1 São duas as seleções de tripulantes para a DEE. A primeira é realizada quando do
  envio da confirmação da data e local da DEE ao final da fase três do processo. Devem ser
  escolhidos tripulantes que reflitam as características médias do operador, tais como: gênero
  dos comissários e antiguidade dos tripulantes.

  5.3.4.2 A segunda é realizada após o briefing sobre a DEE com os tripulantes, e deve ser,
  preferencialmente, realizada por meio de sorteio, em frente aos tripulantes selecionados.
  O coordenador GCTA tem liberdade para escolher determinado tripulante, caso considere haver
  algum motivo pelo qual deva fazer isso.

  5.3.4.3 Caso seja interesse do operador, os tripulantes não selecionados para a DEE poderão
  ser autorizados a acompanharem a mesma, após o fechamento das portas do avião. Nessa situação,
  caso ocorra algum problema com a equipe embarcada no avião que impeça a continuação da DEE,
  é responsabilidade do operador disponibilizar outro tripulante com a mesma função, que não
  faça parte da relação de tripulantes inicialmente listados e que ainda atenda ao descrito
  no item 5.2.1.e) desta IS.'
