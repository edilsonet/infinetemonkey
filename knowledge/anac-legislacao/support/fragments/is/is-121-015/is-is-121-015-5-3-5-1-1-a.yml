section_title: 'Com relação ao briefing aos tripulantes envolvidos:'
subsection_id: a
cite: 5.3.5.1.1(a)
title: 5.3.5.1.1(a)
text: 'a) o coordenador do operador deve realizar um briefing com todos os tripulantes disponibilizados
  para a DEE, com a presença do coordenador GCTA, abordando os seguintes assuntos:

  I) propósito e objetos da avaliação;

  II) treinamento da tripulação;

  III) procedimentos do operador;

  IV) eficácia e eficiência dos equipamentos de emergência;

  V) sinal de início da evacuação;

  VI) o significado dos 90 segundos (DREE) ou 15 segundos (DPEE);

  VII) a finalidade da demonstração (avisar que se trata de uma simulação de decolagem abortada
  com fins à certificação, e que todos os procedimentos normais antes de uma decolagem, incluindo
  briefings, anúncios e demonstrações, devem ser realizados); e

  VIII) a importância da segurança durante a realização da demonstração; e'
