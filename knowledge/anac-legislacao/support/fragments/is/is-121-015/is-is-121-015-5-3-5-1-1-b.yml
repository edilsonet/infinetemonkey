title: 5.3.5.1.1(b)
text: 'b) este briefing é de responsabilidade do operador e o coordenador GCTA só deverá se
  pronunciar caso exista possibilidade de alguma confusão devido ao briefing do coordenador
  do operador ou caso exista dúvidas da tripulação que não possam ser sanadas pelo coordenador
  do operador.

  5.3.5.1.2 Com relação ao briefing aos passageiros participantes, se aplicável, este briefing
  tem teor parecido com o do briefing aos tripulantes e é realizado pelo operador.'
