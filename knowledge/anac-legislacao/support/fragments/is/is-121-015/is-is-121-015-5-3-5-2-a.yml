section_title: 'Conduzindo a DEE. A seguinte sequência de procedimentos é um meio aplicável
  de se conduzir uma DPEE:'
subsection_id: a
cite: 5.3.5.2(a)
title: 5.3.5.2(a)
text: 'a) os comissários devem:

  I) preparar-se para uma decolagem normal de acordo com os procedimentos previstos no MCmsV
  aceito para o operador, incluindo o fechamento de todas as saídas, travando as galleys e
  carrinhos, e armando o sistema de emergência do avião para decolagem;

  II) realizar o briefing aos passageiros de acordo com o MCmsV do operador; e

  III) sentar-se e afivelar-se em seus assentos designados, de acordo com os procedimentos
  normais de decolagem;'
