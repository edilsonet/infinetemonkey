section_title: 'Conduzindo a DEE. A seguinte sequência de procedimentos é um meio aplicável
  de se conduzir uma DPEE:'
subsection_id: e
cite: 5.3.5.2(e)
title: 5.3.5.2(e)
text: e) depois de ciente de que a tripulação está pronta para a decolagem, o coordenador
  GCTA confere se todos os membros da equipe da GCTA estão posicionados e se há algum impedimento
  para o início da demonstração. O coordenador GCTA deverá emitir um sinal sonoro (buzina
  ou apito) avisando que a DEE está prestes a iniciar e cerca de 30 segundos depois, dar o
  sinal de início, normalmente, cortando a força externa do avião;
