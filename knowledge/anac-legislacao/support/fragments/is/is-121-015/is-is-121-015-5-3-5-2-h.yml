section_title: 'Conduzindo a DEE. A seguinte sequência de procedimentos é um meio aplicável
  de se conduzir uma DPEE:'
subsection_id: h
cite: 5.3.5.2(h)
title: 5.3.5.2(h)
text: 'h) durante a DPEE, cada membro da equipe da GCTA designado para o interior do avião
  verifica os procedimentos dos tripulantes e sua posição antes do início da DPEE. Devem verificar
  também se todos os equipamentos (luzes e avisos) funcionam corretamente durante a emergência.
  São problemas que podem acontecer:

  I) o tripulante antecipar-se ao sinal de início, abrindo a porta de emergência antes do
  sinal; e

  II) o tripulante não se amarrar corretamente, devendo este ser considerado incapaz durante
  a emergência simulada e invalidando a DPEE.

  5.4 Demonstração de amerissagem (DEA)'
