text: '5.3.5 nbsp; Briefings antes da DEE

  5.3.5.1 Antes do início da DEE, três briefings devem ser realizados, separadamente: briefing
  aos tripulantes envolvidos, briefing aos passageiros participantes e briefing da equipe
  GCTA.'
