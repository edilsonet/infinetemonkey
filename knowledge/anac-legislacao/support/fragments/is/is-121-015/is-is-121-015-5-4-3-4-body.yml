text: '5.4.3.4 Os requisitos para as tripulações qualificadas a participar da DEA são os mesmos
  descritos para a DEE.

  5.4.3.5 Alguns manuais do fabricante determinam o uso de passageiros para auxiliar a tripulação
  após a amerissagem, principalmente no lançamento e na montagem dos botes salva-vidas. Nestes
  casos, o operador pode solicitar que a tripulação técnica auxilie os comissários. Um integrante
  da GCTA se certificará de que, nestes casos, os pilotos não tomem parte ativa da demonstração
  e apenas obedeçam às orientações do comissário responsável pelo bote.

  5.4.3.6 Caso o fabricante do avião tenha realizado ensaios com a escorregadeira-bote que
  comprovem que esta não precisa da força correspondente ao próprio peso para inflar a contento,
  comprovações deste ensaio poderão ser utilizadas para uma solicitação específica de isenção
  da montagem da plataforma referenciada no item 5.4.3.3.e). Caso o avião utilize apenas botes
  salva-vidas, o operador também poderá solicitar esta isenção.'
