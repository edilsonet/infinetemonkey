text: '5.4.3 Plano de DEA

  5.4.3.1 As DEA são normalmente conduzidas durante o dia ou em ambiente claro de luminosidade
  controlada, na mesma oportunidade que a DEE. Nestas situações, o coordenador GCTA coordena
  a DEA.

  5.4.3.2 Caso o operador já tenha experiência de voo no avião, mas não tenha executado voos
  sobre água afastado mais de 93 km (50 NM) da costa mais próxima, ele deve conduzir uma DEA
  antes de receber este tipo de autorização.

  5.4.3.3 O operador deve preencher uma cópia do Formulário F-291 (disponível no site da ANAC
  em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios),
  de acordo com as instruções contidas nesta IS, porém com o detalhamento relativo à DEA.
  Além disso, os seguintes itens devem ser inseridos no PlanDemo:'
