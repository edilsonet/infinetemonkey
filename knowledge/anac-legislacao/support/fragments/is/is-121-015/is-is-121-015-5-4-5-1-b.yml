text: b) o coordenador GCTA se assegura de que todos os membros da tripulação estão em suas
  posições e que os integrantes da equipe da GCTA (um para cada estação de comissários, um
  na cabine de comando do avião) estão posicionados de acordo com a necessidade de medição
  dos parâmetros da demonstração;
