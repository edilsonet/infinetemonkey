text: e) durante um certo período (de 5 a 10 minutos), a tripulação permanece em simulação
  de “voo em cruzeiro”. Durante este período, os integrantes da equipe da GCTA poderão arguir
  os tripulantes mais próximos à sua posição sobre assuntos relacionados a equipamentos e
  procedimentos de amerissagem;
