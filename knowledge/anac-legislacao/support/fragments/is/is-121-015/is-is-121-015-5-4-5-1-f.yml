section_id: 5.4.5.1
section_title: 'A seguinte sequência de procedimentos é um meio aplicável de se conduzir uma
  DEA:'
subsection_id: f
cite: 5.4.5.1(f)
title: 5.4.5.1(f)
text: 'f) o comandante inicia a DEA comunicando à tripulação (de acordo com os procedimentos
  previstos no MGO e no MCmsV do operador) para se preparar para a DEA;

  Nota: é imperativo que o equipamento de emergência, a habilidade da tripulação e os procedimentos
  de emergência sejam suficientes para uma evacuação rápida, uma vez que, durante uma situação
  real de evacuação de emergência na água o avião flutua por um período bastante curto. Durante
  a DEA, deve ser dada ênfase à habilidade e eficiência da tripulação no período entre a comunicação
  da pane e a comunicação de impacto de pouso. O tempo máximo aceitável para toda a preparação
  de amerissagem desde o anúncio da pane é de 6 minutos. Como preparação para amerissagem,
  se considera a colocação por parte de todos os membros da tripulação dos coletes de flutuação,
  anúncio aos passageiros, trancamento da cabine, e o término de todos os checklists e procedimentos
  requeridos para a amerissagem. Qualquer falha na preparação de cabine corresponderá a uma
  demonstração não-satisfatória.'
