text: h) ao final dos 6 minutos de preparação, a tripulação deverá estar pronta para a amerissagem.
  O comandante, orientado pelo integrante da equipe da GCTA posicionado na cabine de comando,
  anuncia “IMPACTO, IMPACTO, IMPACTO” e declara qual porta deverá ser aberta (o comissário
  responsável por esta saída passa a ser o elemento avaliado para o restante do processo e
  o integrante da equipe da GCTA mais próximo à estação deste comissário é o responsável pela
  avaliação do tripulante);
