section_title: 'A seguinte sequência de procedimentos é um meio aplicável de se conduzir uma
  DEA:'
subsection_id: i
cite: 5.4.5.1(i)
title: 5.4.5.1(i)
text: 'i) após a amerissagem simulada, todos os botes salva-vidas devem ser retirados do avião
  pela tripulação de comissários. Esta ação não tem prazo determinado, porém, os comissários
  devem demonstrar que possuem capacidade de remover tais equipamentos do avião em tempo razoável.
  Para demonstrações completas (DREA), todos os botes salva-vidas (ou escorregadeiras-bote)
  devem ser lançados e inflados sobre a plataforma. Para demonstrações parciais (DPEA), apenas
  uma saída será sorteada. Para os propósitos desta demonstração, “lançar” um bote salva-vidas
  significa removê-lo de sua posição no avião, retirá-lo do avião e posicioná-lo na plataforma
  antes de inflá-lo. “Lançar” uma escorregadeira-bote significa inflá-la normalmente sobre
  a plataforma (se aplicável);

  Nota: para DEA em aviões configurados com escorregadeiras-bote, não é necessário desconectar
  a escorregadeira da porta. No entanto, cada escorregadeira-bote deve ser inspecionada sobre
  sua aeronavegabilidade. Qualquer bote salva-vidas armazenado no interior do avião deve ser
  removido e colocado no chão da cabine para inspeção.'
