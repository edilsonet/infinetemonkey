title: 5.4.5.1(j)
text: 'j) os tripulantes designados para o bote inflado serão entrevistados sobre os procedimentos
  reais de lançamento de botes salva-vidas e depois entrarão no bote, descrevendo cada equipamento
  de emergência presente; e

  Nota: durante o “teste do bote”, apenas o tripulante designado pelo MCmsV será avaliado
  e apenas as respostas vindas deste tripulante serão consideradas para avaliação. Caso seja
  previsto o auxílio de passageiros pelo manual do fabricante, outros tripulantes poderão
  ser selecionados pelo integrante da equipe da GCTA designado para a porta escolhida para
  o ensaio para efetuar este auxílio, porém qualquer ação destes tripulantes deverá ser controlada
  efetivamente pelo tripulante designado para aquele bote.'
