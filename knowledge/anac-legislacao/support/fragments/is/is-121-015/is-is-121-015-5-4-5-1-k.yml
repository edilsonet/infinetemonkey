title: 5.4.5.1(k)
text: 'k) a DEA será considerada terminada apenas após o final da montagem da cobertura do
  bote e término da descrição de todos os equipamentos de emergência.

  Nota: caso seja notado pelo coordenador GCTA que o tripulante não tem treinamento adequado
  para a correta montagem do bote lançado, a DEA será imediatamente desconsiderada e considerada
  insatisfatória.

  5.5 Avaliação de DEE e DEA'
