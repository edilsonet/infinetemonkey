text: a) eficiência e conformidade dos tripulantes no cumprimento de seus deveres e responsabilidades
  (por exemplo, a eficiência de um comissário em abrir portas e comandar os passageiros em
  caso de evacuação; a orientação a passageiros na montagem de botes salva-vidas durante uma
  demonstração completa - DREE; tudo em conformidade ao prescrito no MCmsV);
