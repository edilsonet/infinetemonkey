section_title: 'Durante a fase 4 da DEE ou da DEA, as áreas a serem avaliadas incluem:'
subsection_id: e
cite: 5.5.1.1(e)
title: 5.5.1.1(e)
text: e) no caso de uma DREE, se todas as saídas e escorregadeiras foram operadas corretamente
  e todos os passageiros e tripulantes foram corretamente evacuados em 90 segundos. Para uma
  DEE, cada escorregadeira deve ter sido completamente inflada e deve ter tocado no solo,
  estando pronta para a utilização. Caso o avião possua apenas portas com escadas para a evacuação,
  a escada deverá estar pronta para uso para a finalização da cronometragem; e
