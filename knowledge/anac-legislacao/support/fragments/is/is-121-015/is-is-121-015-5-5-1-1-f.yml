title: 5.5.1.1(f)
text: f) para DEA, que a cabine, os passageiros e os comissários estejam prontos para a amerissagem
  no prazo de 6 minutos e que os botes salva-vidas foram corretamente retirados de suas posições
  de armazenamento e que todas os coletes tenham inflado após a saída do avião e os botes
  tenham sido corretamente inflados e montados.
