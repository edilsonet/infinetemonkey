title: Se o tempo estipulado para a demonstração for ultrapassado, o seu resultado será insatisfatório.
text: '5.5.2.1 Se o tempo estipulado para a demonstração for ultrapassado, o seu resultado
  será insatisfatório.

  5.5.2.2 Deficiências em outras áreas, como eficiência da tripulação, falhas do equipamento
  que tenham ocorrido mesmo quando o critério de tempo foi atingido, podem ser fatores que
  tornam a demonstração insatisfatória. Neste caso, devem ser analisadas a gravidade da deficiência
  e a causa básica desta. Um exemplo seria o caso de uma escorregadeira ter sido inflada no
  tempo correto, apesar de o sistema automático não ter funcionado corretamente. Se a causa
  básica for identificada como treinamento deficiente ou manutenção inadequada do operador,
  a demonstração deverá ser considerada insatisfatória. Outro exemplo é o caso em que uma
  escorregadeira não funciona. Também neste caso a demonstração deve ser considerada insatisfatória.'
