title: Falha na demonstração
text: '5.5.3 Falha na demonstração

  5.5.3.1 No caso de falha da demonstração o operador será notificado dessa classificação
  (demonstração insatisfatória), seguindo o rito do processo de certificação.

  5.5.3.2 A apresentação de um novo PlanDemo deverá ser acompanhada de um relatório elaborado
  pelo operador no qual sejam listadas as causas da falha da demonstração realizada e respectivas
  ações corretivas adotadas.'
