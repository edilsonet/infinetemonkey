cite: 5.1.4(b)
title: 5.1.4(b)
text: 'b) aeródromos de alternativa de destino (121.619), conforme parágrafo 5.6 desta IS.

  Nota: os requisitos de aeródromos de alternativa em rota (121.624), aplicáveis a operações
  prolongadas (ETOPS), são tratados em mais detalhe na IS nº 121-012.

  5.1.5 Por fim, considerando que as informações podem ser alteradas durante a execução do
  voo, requerendo uma alteração no plano operacional de voo, esta IS aborda os requisitos
  de acompanhamento de voo (121.631), conforme parágrafo 5.7 desta IS.

  5.2 Aplicação das informações meteorológicas para fins de planejamento de voo.

  5.2.1 Os parágrafos 121.611(a), 121.613(a), 121.617(a) e (b), 121.619(a) e (b) e 121.624(b)
  estabelecem requisitos ou condições para seleção de aeródromos de decolagem, de destino
  e de alternativa (de decolagem, em rota e de destino), para fins de planejamento de voo,
  que se baseiam nas informações meteorológicas.

  5.2.2 Por sua vez, a Subparte I do RBAC nº 121 estabelece requisitos para o planejamento
  de voo, associados ao cálculo de desempenho do avião, que também dependem de informações
  meteorológicas.'
