section_title: 'Para efeito de planejamento de voo, os indicadores de mudanças significativas
  previstas no TAF devem ser aplicados da seguinte forma:'
subsection_id: a
cite: 5.2.3(a)
title: 5.2.3(a)
text: 'a) FM e BECMG:

  I. no caso de deterioração da condição, esta deve ser considerada a partir do início do
  período associado; e

  II. no caso de melhoria da condição, esta pode ser considerada a partir do final do período
  associado;'
