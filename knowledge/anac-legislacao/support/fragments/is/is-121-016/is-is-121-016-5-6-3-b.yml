title: 5.6.3(b)
text: b) o aeródromo disponha de pistas de pouso separadas, ou seja, duas ou mais pistas configuradas
  de forma que, se uma pista estiver fechada, as operações para a(s) outra(s) pista(s) ainda
  podem ser conduzidas. Duas pistas que se cruzam podem ser consideradas separadas, mas as
  duas cabeceiras da mesma pista não podem ser consideradas separadas; e
