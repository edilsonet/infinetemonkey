section_title: 'Voos sem designação de aeródromo de alternativa de destino: maior garantia
  de pouso no aeródromo de destino (121.619(a)(1))'
subsection_id: c
cite: 5.6.3(c)
title: 5.6.3(c)
text: 'c) as informações meteorológicas e demais informações operacionais relevantes para
  o voo permitam previsão de que:

  I. a aproximação e o pouso poderão ser conduzidos sob condições meteorológicas visuais (VMC);
  e

  II. pelo menos duas pistas de pouso separadas estarão utilizáveis, com pelo menos uma pista
  tendo um procedimento de aproximação por instrumentos operacional.'
