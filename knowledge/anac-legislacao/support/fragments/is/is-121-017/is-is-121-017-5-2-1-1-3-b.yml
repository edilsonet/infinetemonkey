text: b) caso a velocidade indicada esteja acima das limitações de vento do avião, o voo não
  pode ser despachado/liberado. Caso o indicador possua um valor máximo indicado, abaixo da
  limitação do avião (especialmente para vento de través), e não haja outro meio de garantir
  que as condições de vento estão dentro das limitações do avião, o voo não pode ser despachado/liberado;
