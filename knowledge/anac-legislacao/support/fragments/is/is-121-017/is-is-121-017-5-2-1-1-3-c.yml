section_title: 'Para o planejamento da decolagem:'
subsection_id: c
cite: 5.2.1.1.3(c)
title: 5.2.1.1.3(c)
text: c) o cálculo do desempenho de decolagem deve ser feito considerando o uso de ambas as
  cabeceiras, assumindo ar calmo. Caso se verifique que somente uma cabeceira específica permitiria
  a operação (por exemplo, por haver limitação por obstáculos no entorno do aeródromo ou por
  procedimentos do controle de tráfego aéreo que exijam a decolagem em uma cabeceira específica),
  a operação somente poderá ocorrer se houver ar calmo ou vento de proa para decolagem a partir
  dessa cabeceira, em atendimento ao parágrafo 5.2.1.1.4 desta IS.
