title: 5.2.1.1(c)
text: 'c) estação de radiodifusão automática de aeródromo.

  Nota 1: o parágrafo 154.301(a) do RBAC nº 154 também estabelece, para os aeródromos aos
  quais se aplica, a obrigatoriedade de o aeródromo estar equipado com, no mínimo, um indicador
  de direção de vento. Conforme 154.301(a)(3), o indicador deve fornecer uma clara indicação
  de direção de vento de superfície e uma indicação genérica da velocidade do vento.

  Nota 2: quando a informação é provida pelo órgão ATS de aeródromo ou por estação de radiodifusão
  automática de aeródromo, em conformidade com o estabelecido pelo órgão competente, entende-se
  que as informações meteorológicas atendem ao previsto nas seções 121.101 e 121.119 do RBAC
  nº 121, não sendo necessário o uso dos meios alternativos citados no parágrafo 121.173(h)
  e, consequentemente, não sendo aplicável esta IS. Dessa forma, para esta IS, considera-se
  que o aeródromo possui somente o indicador de direção de vento.'
