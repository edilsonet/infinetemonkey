title: 5.2.1.2.6(d)
text: d) caso a velocidade indicada esteja acima das limitações de vento do avião, o pouso
  não pode ser realizado. Caso o indicador possua um valor máximo indicado, abaixo da limitação
  do avião (especialmente para vento de través), e não haja outro meio de garantir que as
  condições de vento estão dentro das limitações do avião, a tripulação de voo deve considerar
  postergar o pouso ou pousar em outro aeródromo.
