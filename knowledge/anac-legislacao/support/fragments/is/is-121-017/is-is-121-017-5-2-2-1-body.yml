text: '5.2.2.1 Decolagem

  5.2.2.1.1 Para a decolagem, deve ser considerada a pressão indicada nos instrumentos do
  avião. Caso haja divergência entre os instrumentos, dentro da margem de tolerância, deve
  ser considerado aquele que indicar a menor pressão atmosférica (maior altitude-pressão).'
