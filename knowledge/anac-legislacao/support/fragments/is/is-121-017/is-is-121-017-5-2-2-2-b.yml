id: is-is-121-017-5-2-2-2-b
kind: is
document: is-121-017
family: '121'
section_id: 5.2.2.2
section_title: 'Pouso. Para pouso, o próprio TAF não fornece uma previsão de pressão. O planejamento
  de voo deve considerar:'
subsection_id: b
cite: 5.2.2.2(b)
title: 5.2.2.2(b)
text: 'b) caso o aeródromo não disponha de informes meteorológicos que atendam às seções 121.101
  ou 121.119: podem se utilizar um dos seguintes métodos:

  I. a pressão referente à elevação do aeródromo, considerando atmosfera padrão, reduzida
  de uma margem de segurança de 10 hPa; ou

  II. a menor pressão atmosférica entre:

  A. a pressão referente à elevação do aeródromo, considerando atmosfera padrão; e

  B. a menor pressão prevista por métodos numéricos para o aeródromo (vide parágrafo 5.3 desta
  IS), considerando-se um período de 3h antes e 3h depois do horário estimado de utilização.
  Ainda, deve se aplicar uma redução de 2 hPa como margem de segurança.


  5.2.2.3 Para a execução do pouso, caso o aeródromo disponha de informes meteorológicos,
  se forem reportados valores de pressão atmosférica menores do que os considerados no planejamento
  de voo, a tripulação de voo deve realizar um cálculo de desempenho de pouso em voo, com
  base nos valores reportados e nos dados de desempenho em voo estabelecidos de acordo com
  a AC 25-32 do FAA (usualmente denominados in-flight landing distance, Landing Performance
  Data for Time-of-Arrival Landing Performance Assessments ou similar). Neste cálculo, a distância
  disponível para pouso deve ser de, no mínimo, 115% da distância de pouso para o horário
  estimado de pouso na pista pretendida.'
