section_title: 'Na ausência de informações meteorológicas, no planejamento de voo:'
subsection_id: b
cite: 5.2.4.1.2(b)
title: 5.2.4.1.2(b)
text: 'b) pode se estabelecer um sistema para que funcionários no aeródromo informem ao DOV
  responsável pelo planejamento de voo se a pista está molhada. No caso de decolagens que
  sejam realizadas em sequência a pousos, é possível concluir que a pista estaria seca se
  o piloto do voo anterior realizou o pouso em pista seca e, por meio de observação, não houve
  chuva no aeródromo após o pouso.

  5.2.4.1.3 Na execução da decolagem, a tripulação de voo deve confirmar que as condições
  da superfície da pista são iguais ou melhores do que as consideradas no planejamento.'
