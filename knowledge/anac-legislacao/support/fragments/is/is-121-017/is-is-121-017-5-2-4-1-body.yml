text: '5.2.4.1 Decolagem

  5.2.4.1.1 Para a decolagem, se o AFM contiver informações sobre desempenho com pista molhada,
  o parágrafo 121.189(e) requer que se considerem as condições da superfície da pista (se
  seca ou molhada).'
