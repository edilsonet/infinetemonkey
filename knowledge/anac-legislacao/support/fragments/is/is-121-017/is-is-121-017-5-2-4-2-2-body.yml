text: '5.2.4.2.2 Na ausência de informações meteorológicas que atendam às seções 121.101 ou
  121.119 no aeródromo de destino, deve se considerar a pista molhada.

  5.3 Uso de métodos numéricos

  5.3.1 Para os casos em que não se dispõe de informações meteorológicas que atendam às seções
  121.101 ou 121.119, esta IS prevê a possibilidade de uso de métodos numéricos para as informações
  de temperatura e pressão atmosférica.

  Nota: um exemplo de informações meteorológicas por métodos numéricos é o Inmet, conforme
  disponibilizado em https://mapas.inmet.gov.br/#.'
