text: '5.2.4.2 Pouso

  5.2.4.2.1 Para o pouso, o parágrafo 121.195(d) do RBAC nº 121 requer que, para aviões a
  reação, quando informações meteorológicas indicarem que a pista do aeródromo de destino
  poderá estar molhada ou escorregadia, o comprimento efetivo da pista do aeródromo tenha,
  pelo menos, 115% do comprimento de pista requerido para pista seca - a menos que, baseado
  em demonstração de operações reais com técnicas de pouso em pistas molhadas, se uma distância
  de pouso menor (mas nunca menor do que a requerida para pista seca) tenha sido aprovada
  para um específico tipo e modelo de avião e incluída em seu AFM.'
