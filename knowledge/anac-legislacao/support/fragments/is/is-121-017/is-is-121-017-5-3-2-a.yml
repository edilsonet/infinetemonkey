section_id: 5.3.2
section_title: 'Para o uso de métodos numéricos, o detentor de certificado deve avaliar a
  confiabilidade do método. Para tanto:'
subsection_id: a
cite: 5.3.2(a)
title: 5.3.2(a)
text: a) tomando como base aeródromos que dispõem de informação meteorológica que atenda às
  seções 121.101 ou 121.119, o detentor de certificado deve confirmar se as informações providas
  pelos métodos numéricos, em conjunto com as margens de segurança estabelecidas por esta
  IS, proveem níveis equivalentes de segurança aos obtidos com o uso da informação meteorológica
  que atenda às seções 121.101 ou 121.119;
