family: '121'
section_id: 5.3.2
section_title: 'Para o uso de métodos numéricos, o detentor de certificado deve avaliar a
  confiabilidade do método. Para tanto:'
subsection_id: b
cite: 5.3.2(b)
title: 5.3.2(b)
text: b) essa avaliação deve ser feita considerando-se diferentes períodos do ano e diferentes
  aeródromos, de regiões do país representativas da área de operações do detentor de certificado.
  Devem se abranger no mínimo 30 aeródromos, incluindo sempre os dois aeródromos mais próximos
  daqueles aeródromos para os quais se pretendam utilizar os métodos numéricos;
