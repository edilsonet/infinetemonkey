text: '5.3.5 O detentor de certificado deve incluir em seu Manual Geral de Operações o(s)
  provedor(es) dos métodos numéricos utilizados.

  5.4 Monitoramento das operações

  5.4.1 Independentemente das características do avião utilizado, o detentor de certificado
  deve possuir um programa de acompanhamento e análise de dados de voo (PAADV).'
