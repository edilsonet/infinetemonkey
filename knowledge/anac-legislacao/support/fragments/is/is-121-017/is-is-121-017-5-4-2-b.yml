section_title: 'O detentor de certificado deve monitorar, por meio do PAADV:'
subsection_id: b
cite: 5.4.2(b)
title: 5.4.2(b)
text: 'b) o desempenho real dos aviões na execução de decolagens e pousos nos aeródromos que
  não disponham de informações meteorológicas que atendam às seções 121.101 ou 121.119, comparando
  as distâncias efetivamente utilizadas com as consideradas no planejamento dos voos, de forma
  a avaliar continuamente se as margens de segurança são suficientes. O detentor de certificado
  deve considerar como referência a sua operação nos aeródromos nacionais que possuem informações
  meteorológicas que atendam às seções 121.101 ou 121.119.

  5.4.3 Se, no processo de monitoramento, for identificado que os valores efetivamente encontrados
  para os parâmetros são menos críticos do que os valores considerados no planejamento de
  voo, o detentor deve rever seus processos de forma a garantir a correção dessa situação.
  Devem ser considerados gatilhos para a revisão do processo, pelo menos, as seguintes situações:'
