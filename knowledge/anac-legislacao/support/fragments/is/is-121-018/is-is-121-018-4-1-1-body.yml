text: '4.1.1 Altura de referência (RDH) significa a altura da projeção da trajetória de planeio
  ou de uma trajetória vertical nominal na cabeceira da pista.

  4.1.2 Aproximação para circular significa uma extensão de um procedimento de aproximação
  por instrumentos que estabelece uma manobra visual para circular o aeródromo antes de pousar.

  4.1.3 Aproximação estabilizada significa uma aproximação que é voada de maneira controlada
  e apropriada em termos de configuração, energia e controle da trajetória de voo a partir
  de um ponto ou uma altitude/altura predeterminados até um ponto 50 pés acima da cabeceira
  ou até o ponto em que a manobra de arredondamento é iniciada, o que for maior.'
