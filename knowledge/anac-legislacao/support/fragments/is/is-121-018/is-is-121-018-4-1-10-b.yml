title: 4.1.10(b)
text: 'b) pista de aproximação de precisão, Categoria I: pista provida de auxílios visuais
  e não visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo B com uma altura de decisão (DH) não inferior a 60 m (200 ft) e com visibilidade não
  inferior a 800 m ou alcance visual de pista não inferior a 550 m;'
