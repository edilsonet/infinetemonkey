title: 4.1.10(c)
text: 'c) pista de aproximação de precisão, Categoria II: pista provida de auxílios visuais
  e não visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo B com uma altura de decisão (DH) inferior a 60 m (200 ft), mas não inferior a 30 m
  (100 ft), e alcance visual de pista não inferior a 300 m;'
