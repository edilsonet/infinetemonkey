title: 4.1.10(d)
text: 'd) pista de aproximação de precisão, Categoria III: pista provida de auxílios visuais
  e não-visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo B com altura de decisão (DH) inferior a 30 m (100 ft), ou operações sem altura de decisão
  (DH) e com alcance visual da pista inferior a 300m ou sem limitações de alcance visual de
  pista.

  4.1.12 Pista para operação visual significa a pista de pouso e decolagem para a operação
  de aeronaves utilizando procedimento de aproximação visual ou procedimento de aproximação
  por instrumento até um ponto além do qual a aproximação possa continuar em condições meteorológicas
  visuais (VMC).

  Nota: as condições meteorológicas visuais (VMC) são definidas, no âmbito do Brasil, na ICA
  100-12, publicada pelo DECEA; e, no âmbito da OACI, no Anexo 2. Não devem ser confundidas
  aqui com a mera obtenção das referências visuais requeridas, visto que essa obtenção pode
  ocorrer mesmo em condições inferiores à VMC.

  4.1.13 Ponto de aproximação perdida (MAPt) significa o ponto em um procedimento de aproximação
  por instrumento em ou antes do qual o procedimento de aproximação perdida prescrito deve
  ser iniciado de forma a garantir o livramento mínimo de obstáculo.

  4.1.14 Referência visual requerida significa a seção dos auxílios visuais ou da área de
  aproximação que deve se manter à vista por tempo suficiente para que o piloto faça uma avaliação
  da posição da aeronave e da razão de alteração dessa posição, em relação à trajetória de
  voo desejada. No caso de aproximação para circular, a referência visual requerida é o entorno
  da pista.

  Nota: no escopo desta IS, que não inclui operações que requerem autorização específica,
  as referências visuais requeridas para aproximações IFR são estabelecidas no parágrafo 121.651(c)(3)
  do RBAC nº 121.

  4.1.15 Velocidade indicada na cabeceira (Vat) é igual à velocidade de estol Vso multiplicada
  por 1,3 ou à velocidade de estol Vs1g multiplicada por 1,23 na configuração de pouso e com
  o peso máximo de pouco certificado. Se tanto Vso quanto Vs1g forem disponibilizadas, o maior
  valor resultante de Vat deve ser usado.

