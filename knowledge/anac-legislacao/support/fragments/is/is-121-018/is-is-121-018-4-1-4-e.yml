title: 4.1.4(e)
text: 'e) Categoria E: velocidade indicada de 166 kt a 211 kt (não incluído).

  4.1.5 Aproximação final com descida contínua (continuous descent final approach - CDFA)
  significa uma técnica, consistente com os procedimentos de aproximação estabilizada, para
  voar o segmento de aproximação final de um procedimento de aproximação por instrumentos
  de não precisão como uma descida contínua, sem nivelamento, de uma altitude/altura igual
  ou acima da altitude/altura do fixo de aproximação final:'
