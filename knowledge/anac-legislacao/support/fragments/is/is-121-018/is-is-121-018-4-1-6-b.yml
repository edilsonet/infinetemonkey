section_id: 4.1.6
section_title: 'Mínimos operacionais de aeródromo significa os limites de utilização de um
  aeródromo para:'
subsection_id: b
cite: 4.1.6(b)
title: 4.1.6(b)
text: 'b) operação de aproximação por instrumentos tridimensional (3D), que utiliza guia lateral
  e vertical.

  Nota: as operações de aproximação por instrumentos são classificadas com base nos menores
  mínimos operacionais para os quais foram elaboradas, abaixo dos quais uma operação de aproximação
  somente pode ser continuada com a referência visual requerida. São classificadas em tipo
  A e tipo B.

  4.1.8 Operações de aproximação por instrumentos de tipo A significa operações de aproximação
  por instrumentos com uma altura mínima de descida ou altura de decisão igual ou superior
  a 75 m (250 pés).

  4.1.9 Operações de aproximação por instrumentos de tipo B significa operações de aproximação
  por instrumentos com uma altura de decisão inferior a 75 m (250 pés). São classificadas
  em CAT I, CAT II e CAT III.'
