title: 4.1.6(c)
text: 'c) pouso em operações de aproximação por instrumentos 3D, expressos em termos de visibilidade
  e/ou RVR e altitude/altura de decisão (DA/H) como apropriado para o tipo e/ou categoria
  da operação, conforme 121.648a(f) do RBAC nº 121.

  4.1.7 Operações de aproximação por instrumentos significa uma aproximação e pouso utilizando
  instrumentos para orientação de navegação baseada em um procedimento de aproximação por
  instrumentos. Há dois métodos para executar operações de aproximação por instrumentos:'
