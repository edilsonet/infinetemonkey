section_id: 5.1.10
section_title: 'Para o estabelecimento de mínimos operacionais de aeródromo, os valores considerados
  aceitáveis conforme esta IS devem considerar:'
subsection_id: e
cite: 5.1.10(e)
title: 5.1.10(e)
text: 'e) as políticas, procedimentos e treinamentos operacionais estabelecidas pelo detentor
  de certificado, em conformidade com o Apêndice C desta IS.

  Nota: isso significa que, para poder estabelecer como mínimos os valores resultantes dos
  métodos listados no parágrafo 5.1.3 desta IS, o detentor de certificado deve garantir que
  cada um desses elementos permita a adoção desses mínimos. Por exemplo, o treinamento para
  os pilotos deve permitir a execução dos procedimentos com esses mínimos.'
