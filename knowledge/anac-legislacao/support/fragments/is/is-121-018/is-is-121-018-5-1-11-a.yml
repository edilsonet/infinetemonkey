text: a) planejamento de voo, conforme requerido pelas seções 121.613, 121.617 e 121.624 do
  RABC nº 121. Para mínimos de planejamento para aeródromos de alternativa, deve ser consultada
  adicionalmente a IS nº 121-016 e, no caso de operações ETOPS, a IS nº 121-012;
