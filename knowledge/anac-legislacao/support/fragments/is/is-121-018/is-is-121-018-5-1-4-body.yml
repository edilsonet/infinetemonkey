text: '5.1.4 O detentor de certificado deve indicar, em seu Manual Geral de Operações, qual(is)
  método(s) utiliza.

  5.1.5 Conforme a IS nº 121-001, os mínimos operacionais de aeródromo estabelecidos pelo
  detentor de certificado devem constar em seu guia de rotas, não sendo requerida aprovação
  da ANAC para os valores estabelecidos.

  Nota 1: observa-se que, conforme a IS nº 121-001, publicações produzidas por ouras organizações
  (governamentais ou comerciais) podem compor o guia de rota do detentor de certificado. Dessa
  forma, os mínimos operacionais de aeródromo podem constar nas cartas contidas nessas publicações.

  Nota 2: algumas organizações comerciais provedoras de publicações aeronáuticas fornecem
  os valores dos mínimos operacionais de aeródromo de acordo com alguns métodos pré-estabelecidos,
  à escolha do detentor de certificado contratante. Neste caso, o detentor de certificado
  deve informar no MGO o(s) método(s) utilizado(s), em conformidade com o parágrafo 5.1.4
  desta IS, e a organização comercial responsável pela execução do método.

  5.1.6 O parágrafo 121.648a(b) do RBAC nº 121 estabelece os fatores que devem ser considerados
  pelo detentor de certificado em seu método de determinação dos mínimos operacionais de aeródromo.
