title: 5.1.4(j)
text: 'j) os mínimos estabelecidos pelo Estado do Aeródromo.

  5.1.7 Em particular, destacam-se os mínimos estabelecidos pelo Estado do Aeródromo (121.648a(b)(10)).
  Conforme o parágrafo 121.648a(a)(2), os mínimos operacionais de aeródromo estabelecidos
  pelo detentor de certificado não podem ser inferiores a qualquer mínimo que tenha sido estabelecido
  para o aeródromo pelo Estado do Aeródromo, exceto quando for especificamente aprovado por
  esse Estado.

  Nota: os Estados dos Aeródromos não são obrigados a estabelecer mínimos operacionais de
  aeródromo. Embora alguns Estados o façam, e nesse caso os mínimos estabelecidos precisem
  ser considerados, como prescrito acima, a responsabilidade pelo estabelecimento de mínimos
  operacionais de aeródromo é do detentor de certificado.'
