text: '5.1.8 Qualquer incremento aos mínimos estabelecidos pelo Estado do Aeródromo deve ser
  considerado no mínimo estabelecido pelo detentor de certificado.

  Nota: exemplos de situações em que o Estado do Aeródromo eventualmente publica incrementos
  aos mínimos são aproximações executadas sem a técnica CDFA ou aproximações pela perna do
  vento.

  5.1.9 Os mínimos operacionais são estabelecidos para decolagem, aproximação e pouso. Podem
  também vir a ser estabelecidos para movimentação na superfície; porém esses mínimos para
  movimentação na superfície não estão no escopo desta IS.'
