  Nota 1: a fonte de ajuste do altímetro normalmente é o aeródromo, a menos que de outra forma
  especificado.

  Nota 2: essa tabela representa valores para uma fonte de ajuste de altímetro (aeródromo)
  no nível do mar. Para fontes de ajuste de altímetro (aeródromos) mais elevadas, os valores
  são conservadores.

  Nota 3: para aeródromos específicos ou para valores não tabulados, pode ser consultado o
  PANS-OPS (Doc 8168), Volume III.

  Nota 4: como exemplo de uso dessa tabela, se a fonte de ajuste do altímetro está no aeródromo;
  o mínimo operacional de aeródromo prevê uma MDH de 600 pés sobre o aeródromo; e a temperatura
  do aeródromo está em -20ºC, deve se aplicar uma correção de 90 pés, passando a se considerar
  uma MDH de 690 pés.

  5.3 Incrementos aos mínimos operacionais de aeródromo, para operações específicas

  5.3.1 Algumas situações requerem mínimos operacionais de aeródromo específicos, conforme
  indicado nos parágrafos seguintes. Neste caso, pode não ser viável que os mínimos sejam
  apresentados diretamente na carta. Ainda assim, é responsabilidade do detentor de certificado
  estabelecer procedimentos e informar as pessoas envolvidas (em especial, tripulação de voo
  e DOV) de quando a situação ocorre e dos mínimos aplicáveis.

  Nota: o estabelecimento de mínimos de planejamento para aeródromos de alternativa, conforme
  requerido pelo parágrafo 121.613(b) do RBAC nº 121, não se enquadra nessa situação, pois
  os mínimos operacionais de aeródromo, ou seja, os limites de utilização do aeródromo para
  execução de uma operação de pouso ou decolagem, não são alterados. Trata-se somente de um
  incremento para fins de planejamento.'
