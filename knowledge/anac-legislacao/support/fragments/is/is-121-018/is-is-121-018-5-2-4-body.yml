title: Relação com a OCA/H
text: '5.2.4 Relação com a OCA/H

  5.2.4.1 Os valores de OCA/H são responsabilidade do Estado do aeródromo, com base nos métodos
  estabelecidos no PANS-OPS (Doc 8168), Volume II, ou regulamentação nacional equivalente.

  5.2.4.2 Embora o estabelecimento do valor de DA/H e MDA/H seja responsabilidade do operador
  da aeronave, a partir do valor da OCA/H publicado pelo provedor dos serviços de navegação
  aérea, no Brasil, o valor da OCA/H não é publicado e os valores de DA/H e MDA/H são publicados
  e correspondem ao valor da OCA/H definido para o segmento de aproximação final.

  5.2.4.3 Os procedimentos e os valores estabelecidos nesta IS se aplicam para operadores
  aéreos brasileiros, em operações tanto no território nacional quanto no exterior. Assim,
  para cada aeródromo, o operador deve entender como o Estado do aeródromo publica as informações
  pertinentes (OCA/H, MDA/H e DA/H), para que o operador possa estabelecer seus mínimos corretamente.

  5.2.5 Na aplicação da DA/H e MDA/H, se for usada uma DA/H ou MDA/H barométrica, ela deve
  ser ajustada quando a temperatura ambiente for significativamente abaixo da ISA. A Tabela
  1 apresenta uma correção em razão de baixas temperaturas para ajuste das altitudes/alturas
  mínimas publicadas.


