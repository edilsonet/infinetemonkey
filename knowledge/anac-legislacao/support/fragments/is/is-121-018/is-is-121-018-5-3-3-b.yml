cite: 5.3.3(b)
title: 5.3.3(b)
text: 'b) 900 m na visibilidade (ou um equivalente, em termos de RVR).

  Nota 1: os valores não se aplicam para pouso no aeródromo de alternativa. No entanto, ressalta-se
  que, para aeródromos de alternativa em rota e de alternativa de destino, conforme requerido
  pelo parágrafo 121.613(b), deve ser estabelecido o mínimo de planejamento para aeródromo
  de alternativa.

  Nota 2: para efeitos desse requisito, considera-se “tipo de avião” a habilitação de tipo
  necessária para operação do avião, conforme estabelecido pela ANAC.

  Nota 3: para efeitos desse requisito, consideram-se “horas de experiência como piloto em
  comando” as horas realizadas por um piloto em processo de atendimento aos requisitos de
  piloto em comando a título de experiência de operação e consolidação de conhecimentos e
  habilidades, para cumprimento da seção 121.434 do RBAC nº 121. Esse piloto, embora esteja
  trabalhando como segundo em comando, para fins de composição da tripulação (conforme expresso
  em 121.434(a)(2)), já deve executar as tarefas de piloto em comando, conforme requerido
  em 121.434(b)(1)(i), de forma que essas horas contam para a experiência requerida pela seção
  121.652.

  Nota 4: conforme o parágrafo 5.1.11 desta IS, esse requisito se aplica para planejamento
  de voo, acompanhamento do voo e execução do procedimento.

  5.3.3.2 Os valores equivalentes de RVR que devem ser aplicados se o piloto em comando possui
  menos de 100 horas de experiência como piloto em comando segundo o RBAC nº 121 no tipo de
  avião sendo operado são indicados na Tabela 2.

  Tabela 2 - RVR mínimo equivalentes pilotos em comando com menos de 100 horas de experiência
  como piloto em comando segundo o RBAC nº 121 no tipo de avião sendo operado

