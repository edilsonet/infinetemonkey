  5.3.3.3 Conforme o parágrafo 121.652(b) do RBAC nº 121, as 100 horas de experiência como
  piloto em comando podem ser reduzidas se o piloto em comando possuir 100 horas de experiência
  como piloto em comando em outros tipos de avião de porte semelhante em operações segundo
  o RBAC nº 121. A redução pode ser feita em até 50% das 100 horas requeridas, pela substituição
  de 1 hora de operação por 1 pouso no mesmo tipo de avião, na função de piloto em comando
  e em operações segundo o RBAC nº 121.

  Nota 1: para efeito dessa redução, considera-se de porte semelhante avião com mesma motorização
  (entre convencional, turboélice ou a reação) e com a mesma característica de cabine de passageiros,
  entre estreita ou larga (narrow ou wide body). A critério da ANAC, pode ser requerido, ainda,
  número similar de passageiros transportados.

  Nota 2: a título de exemplo, se um piloto já possui 100 horas de experiência como piloto
  em comando no avião tipo ICAO B738 em operações segundo o RBAC nº 121 e passa a operar um
  avião tipo ICAO A320, esse piloto iniciará suas operações nesse novo avião com os mínimos
  acrescidos, conforme o parágrafo 5.8.1 desta IS. Após esse piloto alcançar o mínimo de 50
  horas de experiência como piloto em comando no tipo ICAO A320 em operações segundo o RBAC
  nº 121, ele poderá passar a deixar de utilizar os mínimos acrescidos desde que tenha realizado
  X pousos e possua (100-X) horas de experiência como piloto em comando no tipo ICAO A320
  em operações segundo o RBAC nº 121, conforme a Tabela 3.

  Tabela 3 - Relação entre pousos realizados e experiência requerida para um piloto deixar
