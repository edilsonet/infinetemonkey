  5.3.3.4 Conforme o parágrafo 121.652(c) do RBAC nº 121, os mínimos para pousos especialmente
  regulamentados, como para operações ILS CAT II ou CAT III, somente se aplicam caso o piloto
  em comando possua pelo menos 100 horas de experiência como piloto em comando segundo o RBAC
  nº 121 no tipo de avião sendo operado. Para esse requisito, não se aplicam as reduções do
  parágrafo 5.3.3.3 desta IS.

  5.4 Efeitos de falhas ou rebaixamentos temporários de equipamentos de solo nos mínimos operacionais
  de aeródromo

  5.4.1 Esta seção da IS apresenta como considerar os efeitos de falhas ou rebaixamentos temporários
  de equipamentos de solo nos mínimos operacionais de aeródromo. Essa orientação deve ser
  utilizada tanto para o planejamento de voo quanto na execução da operação - com a ressalva
  do parágrafo 5.4.3 desta IS para a execução de pouso.

  Nota: conforme o parágrafo 5.1.15 desta IS, esta IS não se aplica a operações em baixa visibilidade,
  que requerem aprovação da ANAC, como operações CAT II ou CAT III. Tais operações podem ter
  critérios adicionais sobre o funcionamento dos equipamentos de solo.

  5.4.2 Para operações de decolagem noturnas, as luzes de superfície da pista prescritas devem
  estar operacionais. Caso contrário, deve ser utilizado o mínimo que seria aplicável na ausência
  dessas luzes.

  5.4.3 Os efeitos de falhas ou rebaixamentos temporários de equipamentos nos mínimos operacionais
  de pouso são apresentados na Tabela 4. No entanto, os pilotos não devem consultar essa orientação
  após passarem de 1000 pés sobre o aeródromo, em uma aproximação. Se falhas nos equipamentos
  de solo forem anunciadas após essa marca, a aproximação pode ser continuada, a critério
  do piloto em comando. Se falhas forem anunciadas antes dessa marca, seu efeito deve ser
  considerado conforme a Tabela 4, e o procedimento pode precisar ser abandonado.

  Tabela 4 - Efeitos nos mínimos operacionais de pouso de falhas ou rebaixamentos temporários
