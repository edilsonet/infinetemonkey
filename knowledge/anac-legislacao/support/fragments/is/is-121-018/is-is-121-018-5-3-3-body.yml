text: '5.3.3 Mínimos operacionais de aeródromo para pousos IFR. Consideração sobre o piloto
  em comando

  5.3.3.1 Conforme o parágrafo 121.648a(b)(2) e a seção 121.652 do RBAC nº 121, se o piloto
  em comando possui menos de 100 horas de experiência como piloto em comando segundo o RBAC
  nº 121 no tipo de avião sendo operado, os mínimos operacionais para pouso no aeródromo de
  destino devem ser acrescidos dos seguintes valores:'
