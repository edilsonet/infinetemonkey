section_title: 'Condições aplicáveis à Tabela 4:'
subsection_id: c
cite: 5.4.5(c)
title: 5.4.5(c)
text: 'c) falhas que não sejam associadas ao ILS, GLS ou MLS afetam somente o RVR, mas não
  a DH.

  5.4.6 As autoridades competentes do Estado do Aeródromo podem estabelecer critérios mais
  restritivos do que os constantes nesta IS para que se permita a execução de uma operação.
  Por exemplo, a autoridade competente pode determinar a proibição da operação, quando um
  equipamento estiver inoperante, enquanto a Tabela 4 permitiria a operação. Nesses casos,
  o detentor de certificado deve atender conjuntamente às determinações desta IS e da autoridade
  competente, ficando, assim, proibido de realizar a operação.

  Nota: no Brasil, as restrições operacionais e os critérios para considerar luzes inoperantes
  constam na ICA 100-16, publicada pelo DECEA.'
