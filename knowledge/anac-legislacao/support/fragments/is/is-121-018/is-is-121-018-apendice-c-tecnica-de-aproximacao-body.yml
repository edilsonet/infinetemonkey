title: APÊNDICE C - TÉCNICA DE APROXIMAÇÃO
text: 'APÊNDICE C - TÉCNICA DE APROXIMAÇÃO

  C1 Conforme estabelecido no parágrafo 5.1.10e) desta IS, o operador deve considerar as políticas,
  procedimentos e treinamentos operacionais, para utilizar os mínimos operacionais estabelecidos
  em conformidade com esta IS.

  C2 Todas as operações de aproximação devem ser executadas como operações de aproximação
  estabilizada, exceto se de outra forma autorizado pela autoridade competente para uma aproximação
  específica de uma pista específica.'
