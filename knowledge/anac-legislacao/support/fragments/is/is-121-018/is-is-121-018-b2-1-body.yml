document: is-121-018
family: '121'
section_id: B2.1
section_title: Os mínimos operacionais para decolagem devem ser expressos como limites de
  visibilidade ou RVR, considerando todos os fatores relevantes para a pista a ser utilizada
  e as características da aeronave e de seus equipamentos. Onde houver necessidade específica
  para ver e evitar obstáculos na decolagem e/ou para um pouso forçado, condições adicionais,
  como por exemplo o teto, devem ser especificadas.
