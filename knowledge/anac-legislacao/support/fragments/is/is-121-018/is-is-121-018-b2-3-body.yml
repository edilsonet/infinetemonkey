text: 'B2.3 Os mínimos operacionais para decolagem devem ser expressos por valores de visibilidade
  ou RVR pelo menos iguais aos da Tabela B1.


  Tabela B1 - Mínimos de visibilidade ou RVR para decolagem

  Recursos da pista de pouso e decolagem

  Visibilidade / RVR

  Nenhum

  1600 m

  Marcação de eixo de pista

  800 m

  Operações diurnas:

  - Marcação de eixo de pista; e

  - 1 RVR

  500 m

  Operações diurnas:

  - Marcação de eixo de pista, luzes de eixo de pista ou luzes de pista de alta intensidade;
  e

  - 2 RVR (zona de ponto de toque e fim de pista);

  400 m

  Operações noturnas:

  - Luzes de eixo de pista ou luzes de pista de alta intensidade; e

  - 2 RVR (zona de ponto de toque e fim de pista);

  400 m'
