id: is-is-121-018-b2-4-body
kind: is
document: is-121-018
family: '121'
section_id: B2.4
section_title: Observa-se que os mínimos operacionais para decolagem, aplicáveis para a realização
  da decolagem, não devem ser confundidos com os mínimos necessários para o início do voo.
  Para o início do voo, se as condições meteorológicas no aeródromo de decolagem estiverem
  abaixo dos mínimos operacionais para pouso estabelecidos pelo operador (ou se não for possível
  retornar para o aeródromo de decolagem por qualquer razão), deve-se selecionar e especificar
  no despacho ou liberação de voo um aeródromo de alternativa de decolagem, conforme a seção
  121.617 do RBAC nº 121.
