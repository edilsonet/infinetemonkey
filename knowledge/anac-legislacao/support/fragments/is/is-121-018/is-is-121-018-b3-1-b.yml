section_id: B3.1
section_title: 'A DH para uma operação de aproximação 3D ou para uma operação de aproximação
  2D executada com a técnica CDFA deve ser de, pelo menos, o maior dos seguintes valores:'
subsection_id: b
cite: B3.1(b)
title: B3.1(b)
text: b) a DH ou a MDH publicada no procedimento de aproximação, se aplicável. No caso de
  operação de aproximação 2D executada com a técnica CDFA, o detentor de certificado deve
  avaliar o incremento necessário à MDH publicada para determinar a DH de forma a prevenir
  uma descida abaixo da MDH/OCH;
