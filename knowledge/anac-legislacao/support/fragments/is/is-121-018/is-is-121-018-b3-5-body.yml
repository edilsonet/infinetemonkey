  Notas:

  (1) - CAT I com luzes de zona de toque da pista e luzes de eixo de pista

  (2) - CAT I sem luzes de zona de toque da pista ou luzes de eixo de pista, autorizado quando
  o comprimento mínimo da pista é de 1500 m e com aproximação utilizando diretor de voo, piloto
  automático ou HUD até a DA

  (3) - Para DH/MDH inferior a 200 pés, consultar a tabela B6


