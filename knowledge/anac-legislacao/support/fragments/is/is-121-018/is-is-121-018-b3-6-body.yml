document: is-121-018
family: '121'
section_id: B3.6
section_title: Quando uma aproximação é conduzida com um motor inoperante, para garantir o
  cumprimento do gradiente de aproximação perdida do procedimento e livrar os obstáculos,
  pode ser necessário aumentar a DA/H. Nesse sentido, algumas cartas estabelecem mínimos distintos
  de acordo com o gradiente de aproximação perdida, que devem ser incorporados nos mínimos
  operacionais de aeródromo do detentor de certificado. Além disso, uma perda de altura superior
  à normal é esperada no início do “go around”, quando o trem de pouso e os flapes são recolhidos.
  Nesse caso, a DA/H não pode ser menor que a altura contida no AFM/AOM que indica a altura
  mínima para um pouso em seguida a uma aproximação com um motor inoperante.
