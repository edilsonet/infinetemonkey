section_title: 'Recomenda-se a inclusão de valores adicionais nos seguintes casos:'
subsection_id: a
cite: B3.7(a)
title: B3.7(a)
text: a) se a altura de referência (RDH) do ILS/MLS/GLS/LPV for menor que 15 m (50 ft), pode
  ser necessário aumentar a visibilidade/RVR e prover treinamento para os pilotos de forma
  a garantir livramento adequado sobre a cabeceira. Isso pode ser dispensado se houver deslocamento
  da cabeceira ou superfície anterior à pista com resistência suficiente;
