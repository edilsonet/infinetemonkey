cite: B3.7(c)
title: B3.7(c)
text: 'c) quando é esperado que condições anormais possam ocorrer, pode ser necessário aumentar
  a DA/H. Por exemplo, em um ambiente propício para ocorrência de downdrafts na área de aproximação,
  pode ser necessário aumentar a DA/H por 50 pés para aeronaves turboélice e 100 pés para
  aviões a jato (ou mais, se o downdraft for severo).

  B4 Mínimos para operações para circular'
