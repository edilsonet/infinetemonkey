document: is-121-018
family: '121'
section_id: B5.2
section_title: No caso de aeródromos situados fora do Brasil, o operador deve se certificar
  dos mínimos estabelecidos pela autoridade competente do Estado do aeródromo. Se, em conformidade
  com as regras locais, forem estabelecidos mínimos meteorológicos menores do que os previstos
  pelo DECEA, o operador pode utilizá-los desde que o RVR mínimo estabelecido seja de pelo
  menos 800 m. Para utilizar esses mínimos menores, o operador deve prover treinamento adequado
  para os tripulantes.
