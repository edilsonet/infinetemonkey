text: 'C2.2 Em condições VMC, o voo deve ser estabilizado até se chegar à altura de 500 pés
  sobre a cabeceira.

  C3 A técnica de CDFA deve ser usada para operações de aproximação que utilizem procedimentos
  de não precisão, exceto se de outra forma autorizado. Se não for utilizada a técnica de
  CDFA, aplicam-se incrementos à visibilidade/RVR, em conformidade com o parágrafo 5.3.2 desta
  IS.'
