family: '121'
section_id: C3.1
section_title: A execução de um procedimento de aproximação de não precisão com a técnica
  CDFA com guia vertical calculada por equipamentos a bordo da aeronave é considerada uma
  operação de aproximação por instrumentos 3D. Dependendo das limitações do equipamento e
  das fontes de informação usadas para a guia vertical, pode ser necessário que o piloto faça
  um cross-check da guia com outras fontes de navegação durante a aproximação, para garantir
  que seja observada a altura/altitude mínima sobre os fixos publicados.
