section_title: O operador deve estabelecer procedimentos e instruções para voo de aproximações
  com (e, se aplicável, também sem) o uso da técnica CDFA. Esses procedimentos devem ser incluídos
  no manual de operações e devem incluir as tarefas da tripulação de voo durante a condução
  dessas operações.
