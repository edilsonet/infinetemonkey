title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 Conforme o parágrafo 121.648a(a) do RBAC nº 121, o detentor de certificado deve estabelecer
  mínimos operacionais de aeródromo para cada aeródromo a ser utilizado. A regra se aplica
  a aeródromos de decolagem, de destino e de alternativa (de decolagem, em rota e de destino),
  tanto para operações regulares quanto para não regulares.

  5.1.2 Conforme o parágrafo 121.648a(a)(1) do RBAC nº 121, o método de determinação desses
  mínimos deve ser aprovado pela ANAC. Conforme a IS nº 121-005, o método deve constar no
  Manual Geral de Operações (MGO) do detentor de certificado.

  5.1.3 Como forma de atendimento ao parágrafo 121.648a(a)(1) do RBAC nº 121, os detentores
  de certificado podem utilizar os seguintes métodos de determinação de mínimos operacionais
  de aeródromo, sujeitos às condições adicionais estabelecidas nesta IS:'
