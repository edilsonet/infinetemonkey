title: desenvolvimento-do-assunto(c)
text: 'c) os métodos constantes no Doc 9365 - All Weather Operations Manual, publicado pela
  OACI.

  Nota 1: observa-se que é responsabilidade do operador determinar se está capacitado a conduzir
  suas operações com os mínimos operacionais estabelecidos, com relação aos fatores indicados
  nos parágrafos 5.1.6 e 5.1.10 desta IS, em especial com relação às capacidades da aeronave,

  Nota 2: entre as condições adicionais estabelecidas, que devem ser consideradas pelo operador
  independentemente do método escolhido, constam a necessidade de cumprir com os mínimos operacionais
  publicados pelo Estado do Aeródromo (parágrafos 5.1.7 e 5.1.8 desta IS) e os incrementos
  em situações específicas (parágrafo 5.3 desta IS).'
