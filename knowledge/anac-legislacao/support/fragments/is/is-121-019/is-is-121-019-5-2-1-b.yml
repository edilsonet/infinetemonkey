section_title: 'Os seguintes mínimos de RVR se aplicam para as operações de decolagem em baixa
  visibilidade:'
subsection_id: b
cite: 5.2.1(b)
title: 5.2.1(b)
text: 'b) houver procedimentos operacionais para, em condições de RVR inferior a 550 metros,
  limitar a quantidade de:

  I. aeronaves na área de manobras a uma por vez; e

  II. veículos na área de manobras ao mínimo essencial.

  5.3.3 Os aeródromos em que o Sistema de Orientação e Controle da Movimentação no Solo (SOCMS)
  já esteja implementado estão isentos dos requisitos anteriores do parágrafo 5.3 desta IS.

  5.4 Procedimentos operacionais'
