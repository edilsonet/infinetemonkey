title: 'Os seguintes mínimos de RVR se aplicam para as operações de decolagem em baixa visibilidade:'
text: '5.2.1 Os seguintes mínimos de RVR se aplicam para as operações de decolagem em baixa
  visibilidade:

  Tabela 1 - Mínimos de RVR para operações de decolagem em baixa visibilidade

  Recursos da pista de pouso e decolagem

  RVR

  Operações diurnas:

  - Marcação de eixo de pista, luzes de eixo de pista ou luzes de pista de alta intensidade;
  e

  - 2 RVR (zona de ponto de toque e fim de pista).

  350 m

  Operações noturnas:

  - Luzes de eixo de pista ou luzes de pista de alta intensidade; e

  - 2 RVR (zona de ponto de toque e fim de pista).

  350 m

  - Luzes de eixo de pista;

  - Luzes de pista de alta intensidade; e

  - 2 RVR (zona de ponto de toque e fim de pista).

  150 m

  5.2.2 Conforme o parágrafo 121.648a(a)(2) do RBAC nº 121, os mínimos operacionais de aeródromo
  não podem ser inferiores a qualquer mínimo que tenha sido estabelecido para o aeródromo
  pelo Estado do Aeródromo, exceto quando for especificamente aprovado por esse Estado. Assim,
  ainda que um aeródromo possua os recursos indicados na primeira coluna da Tabela, o uso
  do RVR mínimo constante na segunda coluna somente é possível se o valor for maior ou igual
  ao mínimo estabelecido pelo Estado do Aeródromo.

  5.2.3 Valores de RVR abaixo de 150 m não são admitidos para operações no Brasil, sem obtenção
  de créditos operacionais em razão do uso de HGS. Para operações no exterior em que o Estado
  do aeródromo permita tais operações, caso um operador solicite, a ANAC poderá exigir o cumprimento
  de requisitos adicionais.

  5.2.4 O RVR mínimo especificado deve ser obtido para todos os pontos de reporte representativos
  de partes da pista, desde o ponto em que a aeronave começa a decolagem, até a distância
  de aceleração e parada calculada, incluindo pelo menos dois RVR (zona de ponto de toque
  e fim de pista), conforme apresentado na Tabela 1.

  5.3 Elegibilidade do aeródromo

  5.3.1 Para as operações de decolagem em baixa visibilidade, o aeródromo deve possuir procedimentos
  de operação em baixa visibilidade, detalhados em Carta de Acordo Operacional, a serem adotados
  na operação do aeroporto pelas áreas de controle de tráfego aéreo, gerenciamento do pátio,
  controle de veículos, controle de acesso, manutenção, serviço de emergência e contra incêndio
  e serviço de veículo siga-me (follow me).

  5.3.2 Em conformidade com o RBAC nº 154 e com o AIP Brasil, uma barra de parada deve ser
  instalada em todas as posições de espera da pista que servirem a uma pista de pouso e decolagem,
  quando esta for destinada ao uso em condições de RVR inferiores a 350 metros, salvo quando:'
