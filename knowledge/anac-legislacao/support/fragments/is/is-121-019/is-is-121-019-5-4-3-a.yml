section_title: 'O SOP deve incluir:'
subsection_id: a
cite: 5.4.3(a)
title: 5.4.3(a)
text: 'a) antes da partida:

  a. verificação de que o RVR reportado atende ao mínimo autorizado;

  b. no briefing:

  i. confirmação da necessidade de aeródromo de alternativa de decolagem e verificação da
  informação no plano operacional de voo;

  ii. uso do antigelo, se aplicável;

  iii. velocidade máxima de táxi;

  iv. verificação dos controles de voo com a aeronave parada;

  v. considerações sobre a não utilização das luzes externas (luzes de táxi, decolagem e strobe),
  conforme descrito nos procedimentos abaixo; e

  vi. auxílio do PM para a navegação durante o táxi;'
