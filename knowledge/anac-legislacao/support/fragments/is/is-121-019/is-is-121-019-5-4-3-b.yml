section_title: 'O SOP deve incluir:'
subsection_id: b
cite: 5.4.3(b)
title: 5.4.3(b)
text: 'b) táxi:

  a. verificação dos controles de voo antes do início do táxi;

  b. avaliar a necessidade de se utilizarem ou não as luzes de táxi, considerando que as luzes
  refletidas podem diminuir a visibilidade;

  c. velocidade máxima de 10 kt;

  d. auxílio do PM no acompanhamento das pistas de táxi; e

  e. em caso de falhas durante o táxi, parar a aeronave e avisar o ATC. Nesse caso, ligar
  luzes externas;'
