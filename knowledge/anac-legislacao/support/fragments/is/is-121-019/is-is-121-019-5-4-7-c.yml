text: 'c) os membros da tripulação de voo estão apropriadamente qualificados.

  5.5 Treinamento e qualificação da tripulação

  5.5.1 O operador deve se assegurar que cada tripulante de voo completou os treinamentos
  e exames previstos nesta IS antes de ser autorizado a conduzir operações de decolagem em
  baixa visibilidade.'
