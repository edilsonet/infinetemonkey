section_title: 'O treinamento de solo deve incluir:'
subsection_id: c
cite: 5.5.3(c)
title: 5.5.3(c)
text: 'c) decolagem com o RVR mínimo aprovado, com uma falha de motor antes da V1, resultando
  em uma rejeição de decolagem.

  5.5.4.1 O treinamento deve abranger funções de PF e PM, tanto para o piloto em comando quanto
  para o segundo em comando - a menos que haja restrição explícita a que o segundo em comando
  assuma a função de PF.'
