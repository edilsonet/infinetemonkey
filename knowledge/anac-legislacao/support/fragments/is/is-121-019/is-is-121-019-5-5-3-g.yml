text: g) procedimentos a serem seguidos, e precauções a serem tomadas, com relação ao movimento
  na superfície durante operações em que o RVR é de 400m ou menos e quaisquer procedimentos
  adicionais para decolagens com RVR abaixo de 150 m (ou 200m para aviões categoria D). Deve
  ser dada ênfase à prevenção de incursões na pista de pouso e decolagem;
