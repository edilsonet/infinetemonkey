section_title: 'O exame prático deve incluir:'
subsection_id: b
cite: 5.5.5(b)
title: 5.5.5(b)
text: 'b) pelo menos uma decolagem rejeitada com RVR mínimo aprovado.

  5.5.6 O treinamento de voo e o exame podem ser incorporados ao treinamento de voo e exame
  normalmente requerido, desde que sejam atendidos os critérios estabelecidos.

  5.5.7 Os instrutores e examinadores credenciados utilizados nos treinamentos e exames requeridos
  por esta IS devem ter recebido esses mesmos treinamentos e exames, de forma satisfatória
  e dentro da validade.'
