text: '5.5.8 O operador deve manter registros do treinamento e da qualificação de seus tripulantes
  de voo para as operações de decolagem em baixa visibilidade.

  5.6 Monitoramento das operações

  5.6.1 O operador deve monitorar as operações de decolagem em baixa visibilidade para validar
  a efetividade dos procedimentos e treinamentos implementados e para identificar riscos.

  5.6.2 Os dados devem ser colhidos para as operações em que prevalecem condições de baixa
  visibilidade, tenha sido realizada uma decolagem ou tenha se decidido por não realizá-la
  (incluindo casos de decolagem rejeitada).'
