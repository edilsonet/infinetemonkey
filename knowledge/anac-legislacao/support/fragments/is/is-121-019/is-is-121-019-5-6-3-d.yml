text: 'd) dados de pagamento ou comprovante de pagamento da TFAC relativa à alteração das
  EO.

  5.7.2 Para a Fase 4 - demonstrações e inspeções do processo de certificação, devem ser realizadas,
  em voo real ou simulador, no mínimo, 3 (três) operações de decolagem com o uso destes procedimentos
  estabelecidos nesta IS. No entanto, se os procedimentos estabelecidos para operações de
  decolagem em baixa visibilidade não forem significativamente diferentes daqueles utilizados
  para operações normais de decolagem, pode ser realizada somente 1 (uma) operação.

  5.7.2.1 Com vistas a permitir melhor avaliação dos procedimentos, deve se buscar realizar
  as operações requeridas para a fase 4 em aeródromos e estações do ano em que seja esperada
  uma visibilidade mais baixa. Caso seja utilizado simulador, devem-se utilizar aeródromos
  que mais comumente apresentam condições de baixa visibilidade.

  5.7.2.2 Operadores que possuem aprovação para um tipo de aeronave e estejam requerendo aprovação
  para outro tipo podem utilizar, para efeito de fase 4, dados de operações conduzidas no
  tipo já autorizado considerando a similaridade de:'
