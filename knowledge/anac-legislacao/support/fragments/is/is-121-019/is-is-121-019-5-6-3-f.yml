section_title: 'Especificamente, pelos menos os seguintes eventos devem ser registrados:'
subsection_id: f
cite: 5.6.3(f)
title: 5.6.3(f)
text: 'f) qualquer outro evento que ocorra repetidamente e interfira na execução das operações
  de decolagem em baixa visibilidade. Esses eventos podem incluir ações incorretas ou inadequadas
  da tripulação, fenômenos meteorológicos, ocorrência de feixe de laser, interferências eletromagnéticas
  etc.

  5.6.4 Os dados devem ser coletados por meio do programa de análise de dados de voo, suplementado
  por outros meios, incluindo reportes dos pilotos. Caso o operador não possua programa de
  análise de dados de voo, pode utilizar os reportes de pilotos como principal meio de coleta
  de dados.

  5.7 Processo de aprovação

  5.7.1 O operador deve enviar à ANAC uma solicitação de alteração de Especificações Operativas,
  na forma estabelecida na IS nº 119-001, para inclusão de operações de decolagem em baixa
  visibilidade para cada tipo de aeronave, informando o RVR mínimo pretendido. O operador
  deve anexar a seguinte documentação que comprove o atendimento desta IS:'
