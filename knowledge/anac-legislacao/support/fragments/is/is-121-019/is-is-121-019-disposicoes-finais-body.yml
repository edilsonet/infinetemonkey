cite: disposicoes-finais
title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 Operadores que já conduziam operações de decolagem em baixa visibilidade antes de 2
  de maio de 2023 podem conduzir as demonstrações da fase 4 com somente 1 (uma) operação real
  de decolagem em baixa visibilidade, por tipo de aeronave, desde que a fase 4 seja realizada
  antes dessa data.

  7.2 Pilotos que já conduziam operações de decolagem em baixa visibilidade antes de 2 de
  maio de 2023 podem continuar a realizar essas operações antes da realização do treinamento
  requerido por esta IS. Porém, a partir da aprovação do programa de treinamento em conformidade
  com esta IS, devem realizar os treinamentos e exames requeridos pelo programa de treinamento,
  em conjunto com o próximo treinamento periódico.

  7.3 Os casos omissos serão dirimidos pela ANAC.'
