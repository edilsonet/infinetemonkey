id: is-is-121-020-5-1-4-c
kind: is
document: is-121-020
family: '121'
section_id: 5.1.4
section_title: 'Por sua vez, a seção 121.445 do RBAC nº 121 estabelece requisitos para aeródromos
  e áreas especiais. Esse requisito tem o seguinte escopo:'
subsection_id: c
cite: 5.1.4(c)
title: 5.1.4(c)
text: 'c) qualificação e manutenção da qualificação requerida para pilotos em operação nesses
  aeródromos ou áreas especiais.

  5.1.5 Para atendimento aos requisitos das seções 121.443 e 121.445 do RBAC nº 121, o operador
  deve possuir um sistema para disseminação das informações requeridas aos pilotos e ao pessoal
  de operações, conforme requerido pelo parágrafo 121.443(a) do RBAC nº 121.

  5.1.6 Esta IS apresenta uma metodologia segundo a qual os próprios operadores devem avaliar
  e classificar os aeródromos nos quais operam ou pretendem operar. A IS trata também dos
  procedimentos operacionais e qualificações de pilotos necessários para operação nesses aeroportos
  de acordo com sua classificação. A implementação dessa classificação de aeródromos, e o
  respectivo desenvolvimento e aplicação de procedimentos operacionais e qualificações de
  pilotos, nos termos desta IS, são considerados meio de cumprimento aceitável para os parágrafos
  121.97(a), 121.117(a), 121.443(a) e (b) e 121.445(a), (b) e (c) do RBAC nº 121.'
