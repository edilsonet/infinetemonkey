text: '5.1.7 Os critérios desta IS são adicionais aos estabelecidos para gerenciamento de
  aeródromos utilizados em operações regulares constantes na IS nº 121-005.

  5.1.8 Não é escopo desta IS a apresentação de meio de cumprimento aceitável para os requisitos
  relativos a áreas especiais constantes na seção 121.445 do RBAC nº 121.

  5.2 Classificação de aeródromos

  5.2.1 O operador é responsável por classificar todos os aeródromos nos quais opere ou pretenda
  operar, inclusive os de alternativa, em um dos três grupos, considerando, pelo menos, os
  seguintes critérios:'
