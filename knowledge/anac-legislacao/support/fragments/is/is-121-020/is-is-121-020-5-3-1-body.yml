title: Aeródromos do Grupo A
text: '5.3.1 Aeródromos do Grupo A

  5.3.1.1 Para operação que tenha como destino ou alternativa aeródromo do Grupo A, o operador
  deve fornecer informações atualizadas pertinentes a cada aeródromo e respectiva área terminal
  na qual o piloto em comando irá operar. Além disso, o operador deve assegurar-se que o piloto
  em comando tem o conhecimento adequado das informações constantes no Guia de Rotas e em
  NOTAM e tem capacidade para usá-las.'
