cite: 5.3.3(b)
title: 5.3.3(b)
text: 'b) o piloto em comando tenha se qualificado para o aeródromo usando um meio aceitável
  pela ANAC. Podem ser utilizados dispositivos de treinamento ou o acompanhamento de voos
  na cabine como observador.

  Nota 1: embora o parágrafo 121.445(c) do RBAC nº 121 permita uma exceção a essa regra, ela
  pode ser de pouco uso prático, pois exige que a operação (pouso ou decolagem, conforme aplicável)
  ocorra com um teto de pelo menos 1000 pés acima da menor altitude mínima em rota em voo
  IFR (MEA) ou altitude mínima livre de obstáculos (MOCA) ou da altitude estabelecida para
  aproximação inicial para um procedimento IFR; e uma visibilidade de pelo menos 4800 metros.
  No entanto, no momento da designação da tripulação, normalmente não é possível garantir
  essas condições - o que dificulta a utilização dessa exceção, especialmente para operações
  regulares.

  Nota 2: no caso de operações não regulares ou no caso de início das operações regulares
  para um novo aeródromo, pode não ser possível o cumprimento dessas condições adicionais
  previstas para aeródromos do Grupo C. Assim, é aceitável que o operador, além de cumprir
  o requerido para aeródromos do Grupo B, utilize tripulações com ao menos um piloto instrutor
  de voo ou examinador credenciado entre os membros da tripulação requerida, até que haja
  pilotos qualificados em quantidade suficiente para a condução das operações normais no aeródromo.

  5.3.3.2 A realização da qualificação descrita em 5.3.3.1 para cada aeródromo e para cada
  piloto deve ser registrada. Esse registro deve ser recuperável para controle próprio do
  operador, e para eventual apresentação à ANAC quando solicitado. É aceitável que esse registro
  seja mantido juntamente com os demais registros de treinamento do respectivo piloto conforme
  requerido pela seção 121.683 do RBAC nº 121.

  5.3.3.3 A qualificação de pilotos em comando em aeródromos do Grupo C tem validade de 12
  meses. A qualificação pode ser renovada ou, no caso de perda da qualificação, recuperada
  conforme descrito em 5.3.3.1. O operador deve implementar um controle da validade dessas
  qualificações de forma a não permitir a operação de pilotos em comando em aeródromos para
  os quais não estejam com qualificação válida.

  5.4 Conteúdo dos manuais do operador'
