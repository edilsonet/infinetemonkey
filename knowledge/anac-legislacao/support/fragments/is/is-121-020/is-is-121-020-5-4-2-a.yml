section_id: 5.4.2
section_title: 'O seguinte conteúdo deve ser incluído no PTO:'
subsection_id: a
cite: 5.4.2(a)
title: 5.4.2(a)
text: 'a) descrição da forma de qualificação de pilotos em comando em aeródromos, assim como
  do registro dessa qualificação.

  Nota 1: exceto para os aeródromos com especificidades para qualificação do piloto em comando,
  conforme estabelecido nos apêndices desta IS, é aceitável que o PTO identifique a forma
  de qualificação e do registro por grupo de aeródromo, sem a necessidade de especificar os
  aeródromos pertencentes a cada grupo.

  Nota 2: exceto para os aeródromos com especificidades para qualificação do piloto em comando,
  conforme estabelecido nos apêndices desta IS, é aceitável que a obtenção da qualificação
  requerida pelo parágrafo 5.3 desta IS ocorra sem o envio de notificação de realização de
  treinamento (NRT).'
