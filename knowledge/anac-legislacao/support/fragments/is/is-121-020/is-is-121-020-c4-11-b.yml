title: C4.11(b)
text: b) procedimentos normais de decolagem, pouso e arremetida, para todas as cabeceiras,
  utilizando os pesos máximos permissíveis, incluindo em condições IMC e VMC diurnas e noturnas,
  com pista seca e pista molhada. Não é necessário realizar todas as possíveis combinações
  de cenários; no entanto, dentre os cenários amostrados, cada característica deve estar presente
  em pelo menos um cenário;
