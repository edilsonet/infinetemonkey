cite: C4.11(f)
title: C4.11(f)
text: 'f) aproximação e pouso com falha de motor.

  Nota: as manobras de emergência devem ser realizadas simulando as condições mais críticas
  de desempenho e meteorologia.

  C4.11.3 É aceitável que o treinamento em simulador de voo para pilotos seja realizado em
  simulador de voo de um modelo diferente do que será efetivamente operado, desde que o relatório
  de avaliação operacional estabeleça o nível de diferenças entre os modelos como A, B ou
  C para treinamento e exame.

  C4.11.4 Os treinamentos de solo e o treinamento em simulador de voo tem validade de 12 meses.

  C4.11.5 A qualificação para pilotos deve ser realizada da seguinte forma:

  C4.11.5.1 Os pilotos devem realizar ao menos 10 pousos e 10 decolagens no aeródromo SBRJ
  sob supervisão de um instrutor ou examinador credenciado. Ao menos 2 pousos e 2 decolagens
  devem ser realizados em período noturno.

  C4.11.5.2 Ao final da qualificação, o operador deve revisar o desempenho do piloto, e decidir
  pela realização de novas operações supervisionadas ou liberação para operação sem supervisão.

  C4.11.5.3 Instrutores e examinadores somente poderão supervisionar pilotos durante a qualificação
  se já tiverem passado pela qualificação para operação no aeródromo SBRJ. Para formação da
  primeira turma de instrutores e examinadores, é aceitável que sua qualificação seja realizada
  em simulador ou em avião em operações não produtivas (ou seja, sem transporte de passageiros
  ou carga pagos), mesmo sem a supervisão de um instrutor ou examinador qualificado no respectivo
  aeródromo.

  C4.11.5.4 A qualificação de pilotos no aeródromo SBRJ tem validade de 60 dias. A qualificação
  pode ser renovada por meio da operação, em avião ou em simulador de voo, no respectivo aeródromo
  como membro requerido da tripulação. No caso de perda da qualificação até 60 dias após seu
  vencimento, a renovação da qualificação pode ocorrer por meio da realização, em avião ou
  em simulador de voo, de 2 pousos e 2 decolagens sob supervisão de um instrutor ou examinador
  credenciado. No caso de perda da qualificação além de 60 dias após seu vencimento, a renovação
  da qualificação deve ser obtida por meio da reaplicação dos treinamentos de solo e em simulador
  de voo, conforme C4.11.1 e C4.11.2 respectivamente.

  C4.11.5.5 O operador deve implementar um controle da validade dessas qualificações de forma
  a não permitir a operação de pilotos que não estejam com qualificação válida.

  C5 Processo de autorização'
