title: Adequação da MEL/CDL
text: 'C4.2 Adequação da MEL/CDL

  C4.2.1 O operador deve avaliar a necessidade de alterações na MEL/CDL, em especial com relação
  a partes, equipamentos e sistemas que, caso inoperantes, possam dificultar o controle da
  aeronave durante a aproximação e pouso ou prejudicar o desempenho de frenagem ou o desempenho
  de decolagem.

  C4.2.2 Os procedimentos operacionais requeridos pela MEL no caso de equipamento inoperante
  que afete a controlabilidade ou o desempenho da aeronave em pousos e decolagens devem ser
  descritos detalhadamente no treinamento de pilotos e DOV.'
