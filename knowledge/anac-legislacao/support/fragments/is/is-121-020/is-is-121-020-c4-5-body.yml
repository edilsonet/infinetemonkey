cite: C4.5
title: Atualização da base de dados e do software do EGPWS
text: 'C4.5 Atualização da base de dados e do software do EGPWS

  C4.5.1 O operador deve implementar nas aeronaves utilizadas nas operações e nos simuladores
  utilizados para treinamento dos pilotos, em até 60 dias de sua emissão, as atualizações
  da base de dados e/ou software do EGPWS que impactem aproximações ou saídas do aeródromo
  SBRJ. A operação durante esse período de até 60 dias é condicionada a uma avaliação de risco
  realizada pelo operador.

  C4.5.2 Aeronaves que não estejam com a base de dados e o software atualizados nos termos
  especificados acima não podem ser empregadas em condições IMC ou em operações noturnas.'
