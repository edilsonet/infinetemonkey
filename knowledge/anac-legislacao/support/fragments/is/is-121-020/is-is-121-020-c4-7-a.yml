title: C4.7(a)
text: a) para simuladores qualificados pela ANAC, por meio do certificado de qualificação
  do simulador, que deve conter esse aeródromo como avaliado na qualificação. Nesse caso,
  com a identificação do simulador de voo no PTO a ANAC irá verificar internamente se o mesmo
  possui o aeródromo no certificado de qualificação;
