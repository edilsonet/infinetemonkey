title: Implementação de PAADV
text: 'C4.8 Implementação de PAADV

  C4.8.1 Independentemente das características do modelo de aeronave autorizada ou para o
  qual se busca autorização para operação no aeródromo SBRJ, o operador deve possuir um PAADV
  implementado para o respectivo modelo de aeronave.

  C4.8.2 Por meio do PAADV o operador deve monitorar ao menos os padrões de operação de pouso
  e decolagem, e o desempenho de frenagem.'
