cite: C4.9(b)
title: C4.9(b)
text: 'b) por meio de dados de desempenho em voo estabelecidos de acordo com a AC 25-32 do
  FAA (usualmente denominados in-flight landing distance, Landing Performance Data for Time-of-Arrival
  Landing Performance Assessments ou similar), desde que a distância disponível para pouso
  seja de, no mínimo, 115% da distância de pouso para o horário estimado de pouso na pista
  pretendida.

  Nota: a avaliação normalmente é realizada antes do início da descida, durante a preparação
  para a aproximação. A altura de 1000 ft AFE determina até quando, ao longo da aproximação,
  os pilotos devem monitorar as condições de forma a se assegurar que não degradem abaixo
  das condições mínimas aceitáveis, como determinado previamente.'
