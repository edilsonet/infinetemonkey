family: '121'
section_id: C5.3
section_title: 'O operador deve enviar os seguintes manuais revisados com conteúdo específico
  sobre operações com aeronaves à reação no aeródromo SBRJ:'
subsection_id: a
cite: C5.3(a)
title: C5.3(a)
text: 'a) MGO:

  I - orientações gerais para operação com procedimentos de decolagem por instrumentos com
  motor inoperante (EOSID), conforme C4.4;

  II - definição de operação exclusiva do comandante, conforme C4.9.2;

  III - limitações e orientações relativas à operação com vento de cauda e de través, conforme
  C4.9.3;

  IV - proibição e orientações relativas à operação com chuva forte ou pista contaminada,
  conforme C4.9.4;

  V - proibição de decolagem a partir de intersecções que não as das extremidades da pista,
  conforme C4.9.5;

  VI - critérios de aproximação estabilizada e ponto de toque, conforme C4.9.6; e

  VII - orientações para tratamento de panes ocorridas em voo para o aeródromo SBRJ, conforme
  C4.10.4;'
