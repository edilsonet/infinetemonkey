subsection_id: d
cite: C5.3(d)
title: C5.3(d)
text: 'd) MGM/Programa de Manutenção/Programa de Treinamento de Manutenção:

  I - procedimentos para atualização da base de dados e do software do EGPWS;

  II - monitoramento e reporte de eventos conforme C3.2 e C3.3; e

  III - outras alterações definidas pelo operador para operação no aeródromo SBRJ.'
