section_title: 'Durante a fase de demonstrações do processo de autorização:'
subsection_id: a
cite: C5.7(a)
title: C5.7(a)
text: 'a) o operador deve demonstrar à ANAC ser capaz de conduzir com segurança operações
  no aeródromo SBRJ. Essa demonstração deve ser realizada em simulador de voo aprovado para
  o treinamento, contendo ao menos as seguintes manobras:

  I - pouso com frenagem máxima;

  II - decolagem com falha de motor na V1;

  III - rejeição de decolagem por falha de motor próximo à V1, com pista seca e com pista
  molhada;

  IV - arremetida/aproximação perdida em todas as cabeceiras; e

  V - falha dos freios e/ou reversos após o pouso da aeronave;

  Nota: devido a eventuais peculiaridades identificadas no processo, como características
  atípicas da aeronave ou de procedimentos operacionais, a ANAC poderá requerer outras manobras
  na demonstração em simulador de voo.'
