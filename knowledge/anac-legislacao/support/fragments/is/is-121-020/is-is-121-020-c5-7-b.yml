section_title: 'Durante a fase de demonstrações do processo de autorização:'
subsection_id: b
cite: C5.7(b)
title: C5.7(b)
text: 'b) o operador deve realizar demonstração em operações com a aeronave no aeródromo SBRJ
  nos seguintes casos:

  I - autorização de operador sem experiência prévia em operações no aeródromo SBRJ com aeronaves
  a reação;

  II - autorização de tipo de aeronave a reação nunca operada no SBRJ; e

  III - autorização de modelo de aeronave que não possua simulador de voo; e'
