section_id: C5.7
section_title: 'Durante a fase de demonstrações do processo de autorização:'
subsection_id: c
cite: C5.7(c)
title: C5.7(c)
text: 'c) a demonstração em operações com a aeronave no aeródromo SBRJ consiste na realização
  de 4 pousos, 4 decolagens, e 2 arremetidas/aproximações perdidas, sem realização de manobras
  de emergência. Essas operações devem ser acompanhadas por servidor da ANAC. Esses voos não
  podem ter passageiros, e devem ser realizados em período diurno e em condições VMC. Os pousos,
  decolagens e arremetidas devem ser distribuídos em todas as cabeceiras, utilizando procedimentos
  de aproximação e saída determinados previamente pela ANAC.

  C5.7.1 Não obstante o previsto em C5.7, a fase de demonstrações operacionais poderá ser
  reduzida ou dispensada, a critério da ANAC, considerando-se a experiência prévia do operador
  em SBRJ com modelos similares.

  Nota: para avaliação do nível de similaridade entre modelos, considera-se normalmente o
  relatório de avaliação operacional, incluindo as tabelas de MDR e ODR.'
