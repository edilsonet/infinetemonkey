text: 'D2.2 Para aeronaves Airbus da família A320, são elegíveis as aeronaves que possuam
  instalado flight warning computer (FWC) com funcionalidade de alarme que permita à tripulação
  identificar quando houver posicionamento equivocado dos manetes dos motores e tomar as ações
  corretivas necessárias para manter a segurança da operação.

  Nota: para atendimento a este parágrafo, o FWC deve possuir instalado o software H2-F3 (tipicamente
  conhecido como FW3) ou de outra forma prover nível de segurança equivalente ao proporcionado
  pelo uso desse software.

  D3 Critérios de aeronavegabilidade'
