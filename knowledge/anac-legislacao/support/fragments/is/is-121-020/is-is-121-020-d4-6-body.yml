title: Implementação de PAADV
text: 'D4.6 Implementação de PAADV

  D4.6.1 Independentemente das características do modelo de aeronave autorizada ou para o
  qual se busca autorização para operação no aeródromo SBSP, o operador deve possuir um PAADV
  implementado para o respectivo modelo de aeronave.

  D4.6.2 Por meio do PAADV o operador deve monitorar ao menos os padrões de operação de pouso
  e decolagem, e o desempenho de frenagem.'
