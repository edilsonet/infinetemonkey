section_title: Limitações operacionais para operação no aeródromo SBSP
subsection_id: b
cite: D4.7(b)
title: D4.7(b)
text: 'b) o piloto esteja em fase de qualificação, supervisionado por um instrutor ou examinador
  credenciado.

  D4.7.3 O operador deve estabelecer limites de operação com vento de cauda e com vento de
  través, em conformidade com os manuais de cada modelo de aeronave. Ao estabelecer esses
  limites, devem ser desenvolvidas orientações aos pilotos sobre como identificar as condições
  de vento no aeródromo e seu entorno, além das informações fornecidas pela torre de controle.
  Para pista molhada, é proibida a operação com vento de cauda reportado superior a 6 KT e/ou
  vento de través reportado maior que o valor do limite previsto no AOM reduzido de 5 KT.

  D4.7.4 São proibidas operações de pouso ou decolagem com chuva forte, com pista contaminada
  ou com reporte de windshear. O operador deve estabelecer orientações aos pilotos sobre como
  identificar tais condições.

  D4.7.5 São proibidas operações de decolagens no aeródromo SBSP a partir de intersecções
  da pista que não sejam as mais extremas de cada cabeceira, exceto em situações específicas
  como interdição de pistas de táxi ou de parte da pista de pouso e decolagem. Nesse caso,
  a decolagem somente pode ser realizada a partir da interseção caso as dimensões da pista
  disponíveis (ASDA, TORA, TODA) tenham sido consideradas pelo DOV na documentação de despacho.

