text: 'D4.7 Limitações operacionais para operação no aeródromo SBSP

  D4.7.1 São elegíveis para operação no aeródromo SBSP pilotos em comando (PIC) com ao menos
  100 horas de experiência na função em aeronaves abrangidas pela mesma habilitação de tipo.

  D4.7.2 Os pousos e decolagens no aeródromo SBSP são de operação exclusiva do PIC, exceto
  nos seguintes casos:'
