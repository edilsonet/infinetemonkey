  continue ou permita a continuação de uma aproximação para pouso abaixo de 1000 ft AFE, a
  menos que o piloto em comando se assegure de que, de acordo com a última informação disponível
  sobre a condição da pista de pouso e decolagem, os dados de desempenho do avião indiquem
