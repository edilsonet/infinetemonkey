title: Considerações operacionais
text: 'D4.8 Considerações operacionais

  D4.8.1 Características do aeródromo e de obstáculos no seu entorno

  D4.8.1.1 As características do aeródromo, de suas pistas e RESA, e dos obstáculos, assim
  como mitigações operacionais de risco implementadas pelo operador, devem ser abordadas de
  forma minuciosa no treinamento dos pilotos.

  D4.8.2 Alertas de TCAS

  D4.8.2.1 As características de tráfego aéreo no entorno do aeródromo SBSP, em especial as
  relativas a circulação de helicópteros, assim como mitigações operacionais de risco implementadas
  pelo operador, devem ser abordadas no treinamento dos pilotos.

  D4.8.3 Panes ocorridas em voo

  D4.8.3.1 O operador deve estabelecer orientações para o caso de ocorrência de panes em equipamentos
  ou sistemas da aeronave durante o voo com destino ao aeródromo SBSP.

  D4.8.3.2 As orientações devem ter como objetivo auxiliar o processo de decisão dos pilotos
  quanto à continuação do voo para o aeródromo SBSP ou ao prosseguimento para aeródromo de
  alternativa.

  D4.8.3.3 É aceitável que a decisão de continuação para o aeródromo SBSP seja tomada em casos
  onde a pane pode ser inequivocamente identificada, e para a qual o manual de operações da
  aeronave (AOM) estabeleça que não há prejuízo de controlabilidade, e que não há prejuízo
  de desempenho de desaceleração na aproximação e pouso, ou esse prejuízo pode ser avaliado
  antes do início da aproximação por meio de dados de desempenho estabelecidos de acordo com
  a AC 25-32 do FAA.

  D4.8.3.4 O processo de decisão no caso de panes ocorridas em voos com destino ao aeródromo
  SBSP deve ser abordado no treinamento de pilotos.'
