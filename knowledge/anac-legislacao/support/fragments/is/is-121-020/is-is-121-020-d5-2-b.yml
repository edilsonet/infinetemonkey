section_title: 'O operador, para requerer autorização para operação com aeronaves a reação
  no aeródromo SBSP, deve enviar à ANAC FOP 119 devidamente preenchido e contendo as seguintes
  informações:'
subsection_id: b
cite: D5.2(b)
title: D5.2(b)
text: b) análises de pista e demonstração da capacidade da aeronave em cumprir com as restrições
  existentes em cartas de navegação ou devido a obstáculos/relevo no entorno do aeródromo,
  e eventuais limitações operacionais que devem ser implementadas para que as restrições possam
  ser cumpridas, conforme D4.3; e
