document: is-121-020
family: '121'
section_id: D5.2
section_title: 'O operador, para requerer autorização para operação com aeronaves a reação
  no aeródromo SBSP, deve enviar à ANAC FOP 119 devidamente preenchido e contendo as seguintes
  informações:'
subsection_id: c
cite: D5.2(c)
title: D5.2(c)
text: 'c) declaração de conformidade em relação a este apêndice:

  I - a declaração de conformidade em relação ao item D4.2 deste apêndice (adequação da MEL/CDL)
  deve listar os equipamentos que não podem estar inoperantes para operações no aeródromo
  SBSP, caso haja; e

  II - a declaração de conformidade em relação ao item D4.8.3 deste apêndice (panes ocorridas
  em voo) deve listar as panes que, caso ocorram em voo, permitem a continuação do voo para
  o aeródromo SBSP e as panes que requerem que o voo seja desviado para o aeródromo de alternativa.'
