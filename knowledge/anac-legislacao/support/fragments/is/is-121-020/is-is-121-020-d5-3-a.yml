family: '121'
section_id: D5.3
section_title: 'O operador deve enviar os seguintes manuais revisados com conteúdo específico
  sobre operações com aeronaves à reação no aeródromo SBSP:'
subsection_id: a
cite: D5.3(a)
title: D5.3(a)
text: 'a) MGO:

  I - orientações gerais para operação com procedimentos de decolagem por instrumentos com
  motor inoperante (EOSID), conforme D4.4;

  II - definição de operação exclusiva do comandante, conforme D4.7.2;

  III - limitações e orientações relativas a operação com vento de cauda e de través, conforme
  D4.7.3;

  IV - proibição e orientações relativas a operação com chuva forte ou pista contaminada,
  conforme D4.7.4;

  V - condições para decolagem a partir de intersecções que não as das extremidades da pista,
  conforme D4.7.5;

  VI - critérios de aproximação estabilizada e ponto de toque, conforme D4.7.6; e

  VII - orientações para tratamento de panes ocorridas em voo para o aeródromo SBSP, conforme
  D4.8.3;'
