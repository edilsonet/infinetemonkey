section_title: 'O operador deve enviar os seguintes manuais revisados com conteúdo específico
  sobre operações com aeronaves à reação no aeródromo SBSP:'
subsection_id: d
cite: D5.3(d)
title: D5.3(d)
text: 'd) MGM/Programa de Manutenção/Programa de Treinamento de Mecânicos:

  I - procedimentos para atualização da base de dados e do software do EGPWS;

  II - monitoramento e reporte de eventos conforme D3.2 e D3.3; e

  III - outras alterações definidas pelo operador para operação no aeródromo SBSP.'
