title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 As seções 121.97 e 121.117 do RBAC nº 121, aplicáveis respectivamente para operações
  regulares e não regulares, estabelecem que devem ser utilizados aeródromos adequados à operação
  proposta considerando diversos fatores, como características da pista, obstruções, auxílios
  à aproximação, entre outros.

  5.1.2 A exigência de procedimentos para gerenciamento de aeródromos utilizados em operações
  regulares é tratada na IS nº 121-005 (que trata do Manual Geral de Operações) e na IS nº
  121-001 (que trata do Guia de Rotas). Entretanto, essas IS não tratam especificamente de
  procedimentos operacionais e qualificação de pilotos para operação em aeródromos com características
  especiais.

  5.1.3 A seção 121.443 do RBAC nº 121 estabelece requisitos de qualificação de piloto em
  comando para rotas e aeródromos. Especificamente quanto aos aeródromos, tem-se que o detentor
  de certificado deve fornecer ao piloto em comando informações atualizadas sobre cada aeródromo,
  além de se assegurar que o piloto tem conhecimento adequado das informações e capacidade
  para usá-las corretamente.'
