title: disposicoes-finais(c)
text: 'c) aos procedimentos estabelecidos no Apêndice D desta IS a partir da entrada em vigor
  da Resolução nº 787, de 16 de dezembro de 2025, e consequente revogação da Instrução de
  Aviação Civil (IAC) 121-1013, intitulada “Procedimentos e requisitos técnico-operacionais
  complementares para operação no Aeroporto de Congonhas”.

  Nota: especificamente para a adequação aos Apêndices C e D desta IS, será considerado que
  o operador aéreo se adequou quando da emissão de ofício pela ANAC confirmando a adequação
  e a manutenção das autorizações nas Especificações Operativas.

  7.2 Exceto como previsto nos parágrafos 7.3 e 7.4 desta IS, a partir de 1º de março de 2024,
  os pilotos que tiverem operado em determinado aeródromo, em determinado tipo de avião, nos
  últimos 12 meses são considerados qualificados para esse aeródromo, com data de obtenção
  da qualificação considerada como a data da última operação. Dessa forma, esses pilotos ficam
  dispensados dos procedimentos de obtenção de qualificação previstos em 5.3.2 e 5.3.3, devendo
  atender somente os requisitos para renovação ou recuperação da qualificação, nos prazos
  aplicáveis.

  7.3 Para as operações no aeródromo de SBRJ, a partir do prazo estabelecido no parágrafo
  7.1(b) desta IS, serão considerados qualificados os pilotos que tiverem operado em SBRJ,
  em avião ou simulador de voo, nos últimos 60 dias. A data de obtenção da qualificação será
  considerada como a data da última operação. Dessa forma, esses pilotos ficam dispensados
  dos procedimentos de obtenção de qualificação previstos no parágrafo C4.11.5 desta IS devendo
  atender somente os requisitos para renovação ou recuperação da qualificação, nos prazos
  aplicáveis.

  7.4 Para as operações no aeródromo de SBSP, a partir do prazo estabelecido no parágrafo
  7.1(c) desta IS, serão considerados qualificados os pilotos que tiverem operado em SBSP,
  em avião ou simulador de voo, nos últimos 12 meses. A data de obtenção da qualificação será
  considerada como a data da última operação. Dessa forma, esses pilotos ficam dispensados
  dos procedimentos de obtenção de qualificação previstos no parágrafo D4.9.5 desta IS, devendo
  atender somente os requisitos para renovação ou recuperação da qualificação, nos prazos
  aplicáveis.

  7.5 Os casos omissos serão dirimidos pela ANAC.'
