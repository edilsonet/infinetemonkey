text: '4.1.10 Distração. O desvio da atenção da tarefa principal de voar.

  4.1.11 Encontro com esteira de turbulência. Ocorre quando a aeronave experimenta os efeitos
  da turbulência produzida pela ponta da asa ou dos vórtices de exaustão dos motores de outra
  aeronave.'
