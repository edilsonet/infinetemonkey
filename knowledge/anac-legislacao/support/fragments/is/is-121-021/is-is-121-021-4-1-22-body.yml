text: '4.1.22 FSTD não específico do tipo. O FSTD representa com fidelidade adequada uma aeronave
  de um tipo diferente do operado pelas tripulações envolvidas.

  4.1.23 Gerenciamento das ameaças e erros (TEM). Detecção de ameaças ou erros e resposta
  a eles com contramedidas que reduzem ou eliminam suas consequências e reduzem a possibilidade
  de erros ou estados indesejados da aeronave.

  4.1.24 Gerenciamento da trajetória de voo. Manipulação ativa, usando sistemas aviônicos
  a bordo ou manuseio manual, para comandar os controles de voo da aeronave para direcioná-la
  ao longo de uma trajetória desejada nos planos lateral e vertical.

  4.1.25 Instrução baseada em manobras. Instrução que se concentra em um único evento ou manobra
  isoladamente. A ênfase está no desenvolvimento das habilidades motoras necessárias para
  uma recuperação bem-sucedida.

  4.1.26 Instrutor. Uma pessoa autorizada a dar treinamento teórico ou prático a um aluno
  para obter uma licença de aviação, qualificação, endosso ou acreditação.

  4.1.27 Manobras. Sequência deliberada de ações para alcançar a trajetória de voo desejada.
  O controle disso pode ser alcançado por vários meios, incluindo o controle manual da aeronave
  e o uso de sistemas automáticos de controle de voo.

  4.1.28 Mau funcionamento de sistemas críticos. Casos de mau funcionamento dos sistemas de
  aviação que exigem exigências consideráveis para uma tripulação competente.'
