text: '4.1.3 Ângulo de ataque crítico. Ângulo de ataque que produz o coeficiente de sustentação
  máximo, além do qual ocorrerá um estol.

  4.1.4 Auxílio ao treinamento de prevenção e recuperação da perda de controle da aeronave.
  O auxílio ao treinamento de recuperação da perda de controle da aeronave (AURTA) foi desenvolvido
  pela OACI e representantes da indústria e lançado em sua segunda edição em 2008. Esta publicação
  é fundamental para os programas UPRT e, conforme revisada, é o principal treinamento e documento
  de implementação do UPRT referido no Doc 10011 da OACI. A terceira edição, Revisão 3, foi
  criada por grupos de trabalho da Airbus, Avions de transport régional (ATR), Boeing, Bombardier,
  Embraer e OACI e adicionada ao material fornecido pela Revisão 2. Além disso, o nome foi
  alterado para Airplane Upset, Prevention and Recovery Training Aid (AUPRTA) em reconhecimento
  da importância da tarefa de prevenção e a redefinição do termo “upset” para incluir o conceito
  abrangente de estado indesejado da aeronave.'
