text: '4.1.39 Regime pós-estol. Condições de voo com ângulo de ataque maior que o ângulo de
  ataque crítico.

  4.1.40 Stick pusher. Dispositivo usado em algumas aeronaves que aplica automaticamente um
  movimento do nariz para baixo e uma força de inclinação aos joysticks da aeronave na tentativa
  de diminuir o ângulo de ataque da aeronave. Em algumas aeronaves, o dispositivo vibra automaticamente
  a coluna de controle para alertar o piloto sobre a aproximação de um estol. A ativação do
  dispositivo pode ocorrer antes ou depois de um estol, dependendo do tipo de aeronave.'
