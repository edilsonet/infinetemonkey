text: '4.1.41 Surpresa. O reconhecimento emocional de uma diferença entre o esperado e o real.

  4.1.42 Susto (startle). Reações iniciais de curta duração e involuntárias, de natureza fisiológica
  e cognitiva, referentes a um evento inesperado e que originam a resposta humana normal ao
  estresse.

  4.1.43 Trajetória de voo (flight path). A trajetória de uma aeronave no ar, definida em
  três dimensões, normalmente por referência ao ponto inicial da rolagem de decolagem, ou
  a cabeceira de pouso.

  4.1.44 Transferência de treinamento. A capacidade de um treinando de aplicar conhecimentos,
  habilidades e comportamentos adquiridos em um ambiente de aprendizagem (por exemplo, uma
  sala de aula, um FSTD) para outro ambiente (por exemplo, voo). Nesse contexto, “transferência
  negativa de treinamento” refere-se à generalização inadequada de conhecimentos ou habilidades
  aprendidas em treinamento para as operações de linha.

  4.1.45 Treinamento baseada em cenário. Instrução que incorpora manobras em experiências
  do mundo real para cultivar habilidades práticas de voo em um ambiente operacional. O objetivo
  é desenvolver habilidades de percepção e tomada de decisão relacionadas à prevenção, reconhecimento
  e recuperação.

  4.1.46 Treinamento de prevenção e recuperação da perda de controle da aeronave (UPRT). Um
  programa de treinamento teórico e prático que fornece exposição a condições de perda de
  controle do avião, conforme definido na Revisão 3 do Auxílio ao Treinamento de Prevenção
  e Recuperação de Perda de Controle da Aeronave.

  4.1.47 Treinamento de voo orientado para operações em rota (LOFT). Treinamento e avaliação
  em simulação realística, "em tempo real" de uma missão completa em cenários representativos
  das operações de linha.

  4.1.48 Treinamento e avaliação baseados em competências. Um treinamento orientado para o
  desempenho, para determinados padrões de desempenho, em que as avaliações buscam determinar
  se as competências foram alcançadas.

  4.1.49 Treinamento prático. Instrução que enfatiza o desenvolvimento de habilidades técnicas
  ou práticas específicas e geralmente é precedida por treinamento teórico.

  4.1.50 Treinamento teórico. Instrução que enfatiza os aspectos de estudo e raciocínio e
  visa melhorar os níveis de conhecimento de um determinado assunto, ao invés de desenvolver
  habilidades técnicas ou práticas específicas.

  4.1.51 Treinamento voltado para a competência. Treinamento autorizado destinado a atingir
  os objetivos finais da ação, e que fornece garantia suficiente de que o indivíduo em formação
  é capaz de desempenhar de forma contínua e eficaz as suas tarefas específicas em condições
  seguras.

  4.1.52 Treinamento negativo. Instrução que introduz inadvertidamente informações incorretas
  ou conceitos inválidos, que podem prejudicar em vez de aumentar a segurança operacional.

  4.1.53 Vibrações na inversão do movimento. Fenômeno relacionado aos atuadores de movimento
  do FSTD quando seu sentido de deslocamento é invertido, resultando em picos de aceleração
  que podem ser sentidos pelo piloto, dando-lhe assim uma falsa referência de movimento.

