title: 6.1.3(b)
text: 'b) treinamento prático - destinado a desenvolver as habilidades dos pilotos, necessárias
  para o emprego efetivo de estratégias de prevenção de estol e, quando necessário, a efetiva
  recuperação do avião para a trajetória de voo originalmente pretendida.

  6.1.4 Cada componente da atividade integrada deve ser construído e apresentado de forma
  a garantir que as lições corretas tenham sido aprendidas e que os níveis necessários de
  competência do piloto tenham sido alcançados. Em particular, se o UPRT não for desenvolvido
  como um programa de treinamento baseado em competências (CBT), os objetivos de cada parte
  do treinamento e as referências de desempenho que possam constituir níveis “aceitáveis”
  de competência devem ser determinados. A determinação de um nível aceitável de competência
  deve, em todos os casos, basear-se na demonstração do aluno da capacidade de empregar consistentemente
  estratégias eficazes em tempo hábil para prevenção ou, se não for razoavelmente antecipada,
  a recuperação de uma perda de controle da aeronave durante a qual a segurança da aeronave
  não foi comprometida.

  6.2 Elementos curriculares do UPRT

  6.2.1 Um modelo genérico do programa UPRT para tripulações de voo é fornecido no Apêndice
  A, dividindo os elementos de treinamento em uma lista não exaustiva de 11 tópicos separados
  e indicando o componente UPRT no qual cada elemento de treinamento deve ser abordado (consulte
  de A a K na tabela). A primeira coluna da tabela indica os tópicos e os respectivos elementos
  de formação, enquanto a segunda e terceira colunas indicam a que componentes UPRT se aplicam,
  considerando-se que para o componente do treinamento prático se requer um FSTD específico.

  TREINAMENTO

  7.1 Generalidades

  7.1.1 O programa previsto nesta IS é de natureza orientadora e fornece os critérios necessários
  para o desenvolvimento dos currículos de instrução inicial do UPRT para as tripulações de
  voo. Relativamente à formação periódica, estas podem ser desenvolvidas em ciclos de tal
  forma que, considerando um ciclo de instrução de 24 meses, após a conclusão de 2 períodos
  de formação e verificações periódicas, todos os elementos que compõem a abordagem total
  à formação tenham sido revistos. A instrução inicial do UPRT deve ser dada a todos os tripulantes
  de voo, tanto os que já operam um determinado tipo de aeronave quanto os que vão começar
  a operá-lo. Também deve ser ministrado no caso de treinamento de transição, treinamento
  de elevação de nível, treinamento de requalificação e treinamento de diferenças, se a ANAC
  considerar que essas diferenças podem afetar a competência das tripulações de voo para proceder
  de acordo com o UPRT.

  7.1.2 Os operadores aos quais esta IS se aplica devem desenvolver seus programas UPRT com
  base nas disposições deste documento, especialmente as disposições dos Parágrafos 7.2 e
  7.3, a fim de obter a aprovação da ANAC. Nos parágrafos 7.4 e 7.5, há informações complementares
  a esses parágrafos. No desenvolvimento dos programas de treinamento, devem ser citadas as
  fontes de informação dos textos, exemplos, figuras, procedimentos etc., de onde a informação
  foi retirada. Os programas devem conter uma descrição de todos os elementos que os compõem.'
