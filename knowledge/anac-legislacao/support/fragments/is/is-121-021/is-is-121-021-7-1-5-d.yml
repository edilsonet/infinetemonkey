title: 7.1.5(d)
text: 'd) cópia do certificado de qualificação desses FSTD e data de vigência.

  7.1.6 Esta IS foi elaborada com o entendimento de que o UPRT terá como foco o “treinamento
  voltado para a competência” do aluno com base na obtenção de níveis de desempenho em termos
  de conhecimentos e habilidades determinados nos programas de UPRT. Consequentemente, a ANAC
  não irá estabelecer ações de fiscalização voltadas diretamente ao aluno, como parte de seu
  processo de vigilância.

  7.2 Treinamento teórico

  7.2.1 O conhecimento desempenha um papel fundamental na estrutura do UPRT. Os fundamentos
  da prevenção ou recuperação das perdas de controle do avião podem ser ensinados teoricamente.
  É essencial para a prevenção das perdas de controle que o piloto tenha uma compreensão da
  aerodinâmica, dinâmica de voo e princípios de projeto da aeronave em relação ao manuseio
  da aeronave e recuperação das perdas de controle. Igualmente essencial é uma compreensão
  abrangente das limitações humanas e como elas podem afetar a capacidade do piloto de prevenir,
  reconhecer e se recuperar de perdas de controle da aeronave. Combinado com o treinamento
  prático, a teoria irá aprimorar e reforçar ainda mais o UPRT.

  7.2.2 O material de cunho teórico utilizado no treinamento teórico deve indicar aos pilotos
  que as perdas de controle da aeronave são uma ameaça natural à operação dos aviões e, principalmente,
  que a automação, por si só, pode não ajudar a prevenir tais eventos. Os textos do curso
  que descrevem as várias causas de perda de controle de aeronaves de uma perspectiva baseada
  em evidências ajudam a construir uma compreensão mais profunda das áreas de ameaça. As estratégias
  teóricas de recuperação devem ser ensinadas imediatamente antes da instrução prática.

  7.2.3 As sessões de treinamento teórico devem ser ministradas por um instrutor UPRT qualificado
  em solo ou em voo, em sala de aula adequada ou por meio de ensino à distância com um instrutor
  qualificado disponível para responder a questões e complementar a apresentação, bem como
  para garantir a compreensão precisa dos textos.

  7.2.4 Consulte o Apêndice A para obter uma lista de tópicos a serem abordados no treinamento
  teórico; o Apêndice B também contém informações úteis para estes treinamentos.

  7.3 Treinamento prático

  7.3.1 Embora a instrução teórica seja fundamental para promover uma abordagem acadêmica
  para prevenção e recuperação de perdas de controle, uma abordagem puramente teórica sem
  desenvolvimento de habilidades práticas tem eficácia limitada. Em situações de ameaça grave,
  como perda de controle da aeronave, a capacidade mental pode ser muito diminuída pelo medo.
  A exposição prática sob condições controladas é essencial para complementar a instrução
  teórica e melhorar a capacidade do piloto de gerenciar ameaças.

  7.3.2 Ao introduzir um evento de estol no treinamento, os pilotos devem ser expostos tanto
  à aproximação do estol quanto ao próprio estol. Durante o treinamento, não deve ser colocada
  indevidamente a ênfase em como o evento começou. O treinamento deve enfatizar que a recuperação
  de qualquer dessas condições seja realizada da mesma maneira imediatamente após o piloto
  ter reconhecido o evento de estol resultante.

  7.3.3 Uma preocupação primordial na execução do UPRT em FSTD é a aderência ao envelope de
  treinamento válido (ETV) para um dispositivo específico. Embora vários níveis de dispositivos
  instrucionais possam ser apropriados para a ilustração e prática de uma variedade de elementos
  UPRT, eles devem sempre ser qualificados adequadamente para fornecer instruções específicas
  do UPRT. O emprego de FSTD em regiões do envelope de voo além da capacidade dos FSTD de
  fornecer fidelidade precisa tem o potencial de introduzir conceitos enganosos ou uma compreensão
  inadequada de técnicas que podem resultar em uma experiência de treinamento negativo.'
