subsection_id: a
cite: 7.3.4(a)
title: 7.3.4(a)
text: a) Com base na manobra. Esta instrução se concentra no domínio da tarefa. Deve incluir
  treinamento de prevenção e recuperação com ênfase no desenvolvimento de habilidades motoras
  necessárias para uma recuperação bem-sucedida. Uma ênfase limitada deve ser colocada nas
  habilidades de tomada de decisão durante o treinamento baseado em manobras.
