section_title: Este treinamento aborda todos os objetivos de treinamento de tripulações, incluindo
  operações em grandes altitudes.
subsection_id: b
cite: 7.3.4(b)
title: 7.3.4(b)
text: b) Com base em cenários. O objetivo é desenvolver habilidades perceptivas e de tomada
  de decisão relacionadas à prevenção, reconhecimento e recuperação, ao mesmo tempo em que
  dá ao piloto a oportunidade de usar as habilidades aprendidas na instrução baseada em manobras
  em um cenário realista. Deve ser administrado após o treinamento baseado em manobras.
