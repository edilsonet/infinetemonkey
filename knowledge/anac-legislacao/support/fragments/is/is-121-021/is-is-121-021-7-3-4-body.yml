text: '7.3.4 Este treinamento aborda todos os objetivos de treinamento de tripulações, incluindo
  operações em grandes altitudes.

  7.3.5 O treinamento prático deve incluir treinamento baseado em manobras e baseado em cenários.
  Os operadores são encorajados a consultar o fabricante do avião durante o desenvolvimento
  do treinamento em FSTD.'
