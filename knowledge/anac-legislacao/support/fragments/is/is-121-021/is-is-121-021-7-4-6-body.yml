text: '7.4.6 Para esses cenários, o Apêndice C contém as sequências de treinamento recomendadas
  pelos OEM.

  7.5 Recomendações OEM - Técnicas de Recuperação de Perda de Controle

  7.5.1 As técnicas de recuperação recomendadas nesta seção foram desenvolvidas em conjunto
  por representantes da Airbus, ATR, Boeing, Bombardier e Embraer e são extraídas dos resultados
  do LOCART.

  7.5.2 Esta seção contém as recomendações para recuperação de perdas de controle da aeronave
  que devem ser aplicadas como modelo para o desenvolvimento e revisões da orientação UPRT
  para tripulações de voo. Nos casos em que um operador deseja aplicar uma técnica diferente
  da publicada nesta seção, uma determinação de “sem objeções técnicas” deve ser obtida do
  OEM apropriado, a menos que a técnica específica seja publicada no manual de voo do avião
  apropriado.

  7.5.3 Estas técnicas de recuperação também serão oportunamente atualizadas nos respectivos
  manuais das OEM que contribuíram para o seu desenvolvimento e permanecerão consistentes
  com as informações contidas em AURTA, Revisão 2, e AUPRTA, Revisão 3. É importante ressaltar
  que a correta interpretação e aplicação de técnicas e recomendações só podem ser determinadas
  quando as informações por trás delas são bem compreendidas.

  7.5.4 As técnicas recomendadas descritas no Apêndice D representam uma progressão lógica
  para a recuperação do avião. Eles não têm necessariamente um caráter processual. A sequência
  de ações é apresentada apenas para fins de orientação e representa uma série de opções para
  o piloto considerar e usar dependendo da situação. Nem todas as ações podem ou devem ser
  necessárias uma vez que a recuperação esteja em andamento. Se necessário, a compensação
  de inclinação deve ser usada com moderação. O uso cuidadoso do controle direcional para
  auxiliar o controle de rolagem só deve ser considerado se o controle de rolagem for ineficaz
  e o avião não tiver estolado.

  7.5.5 Estas técnicas assumem que a aeronave não está paralisada. Uma condição de estol pode
  existir em qualquer atitude e pode ser reconhecida pela ativação contínua do aviso de estol
