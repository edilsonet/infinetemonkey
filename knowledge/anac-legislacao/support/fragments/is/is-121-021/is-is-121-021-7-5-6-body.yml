text: '7.5.6 Se a aeronave estiver em estol, a recuperação do estol deve primeiro ser obtida
  aplicando-se o procedimento de recuperação de estol no Apêndice E.

  7.5.7 Os operadores devem trabalhar em conjunto com os fabricantes de seus aviões para garantir
  que tenham em seus manuais de operação as orientações e técnicas aprovadas pelo fabricante
  para prevenção e recuperação de perdas de controle específicas do avião.'
