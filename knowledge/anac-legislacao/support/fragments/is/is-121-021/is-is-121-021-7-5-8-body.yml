text: '7.5.8 Os procedimentos desenvolvidos pelo fabricante têm precedência sobre as recomendações
  que se seguem.

  INSTRUTORES UPRT

  As considerações de segurança do UPRT e as consequências da aplicação de técnicas de treinamento
  inadequadas ou desinformação são muito mais importantes do que em algumas outras áreas de
  treinamento da tripulação de voo. Portanto, um componente crítico para a condução eficaz
  do UPRT é um instrutor devidamente treinado e qualificado que possua sólido conhecimento
  teórico e operacional relevantes para o conteúdo dos cursos de UPRT.

  8.1 Qualificação dos instrutores'
