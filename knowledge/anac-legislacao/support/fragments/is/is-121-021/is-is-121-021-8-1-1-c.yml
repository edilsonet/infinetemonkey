section_id: 8.1.1
section_title: 'Os instrutores do UPRT devem:'
subsection_id: c
cite: 8.1.1(c)
title: 8.1.1(c)
text: 'c) ter concluído com sucesso, como aluno, o programa de treinamento inicial do operador
  em UPRT, no máximo 3 meses antes de iniciar o curso de treinamento e qualificação como instrutor
  UPRT. Isso permitirá uma revisão completa de todos os elementos de treinamento do Apêndice
  A.

  8.1.2 Independentemente do histórico individual, todos os instrutores designados para fornecer
  instrução em um programa UPRT devem concluir com êxito um curso inicial de treinamento e
  qualificação de instrutor do programa UPRT aprovado pela ANAC. Uma lista de elementos mínimos
  de treinamento apropriados ao nível de envolvimento de um instrutor na condução de um programa
  UPRT é fornecida no Apêndice F.

  8.1.3 Os programas de treinamento periódicos para instrutores devem abranger todos esses
  elementos para garantir que o instrutor designado para o UPRT mantenha os níveis de conhecimento
  e conjuntos de habilidades necessários para tal treinamento. Esse treinamento periódico
  deve ser realizado em conjunto com o treinamento geral dos instrutores.'
