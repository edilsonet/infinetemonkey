section_title: Instrutores teóricos
subsection_id: a
cite: 8.1.4(a)
title: 8.1.4(a)
text: a) Após concluir seus estudos, os instrutores que ministrarão cursos teóricos UPRT devem
  ser avaliados em sua capacidade de ensinar com precisão tais cursos e de avaliar o nível
  de compreensão do aluno usando técnicas de ensino bem estabelecidas antes de receber autorização
  final para ensinar sem supervisão. Essas avaliações devem permitir uma padronização dos
  instrutores.
