cite: 8.1.5(a)
title: 8.1.5(a)
text: 'a) Além de preparar o instrutor para ministrar o curso de forma eficaz, o treinamento
  prático do instrutor para UPRT deve se concentrar em:

  1. compreender as capacidades e limitações dos FSTD específicos usados ​​para UPRT;

  2. compreender o ETV do dispositivo em uso e apreciar a possibilidade de treinamento negativo
  que possa existir quando a instrução ultrapassar os limites deste ETV;

  3. funcionalidade específica relacionada ao UPRT da estação de operação do instrutor (IOS)
  e outras ferramentas;

  4. distinguir entre estratégias genéricas de UPRT e recomendações específicas do OEM com
  relação à sua relevância para as capacidades e limitações do dispositivo; e

  5. compreender a importância de aderir aos cenários UPRT que foram validados pelo preparador
  de um programa instrucional durante a aula.'
