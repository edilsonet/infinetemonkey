title: 8.1.5(b)
text: 'b) Após a conclusão de seus estudos, e como forma de permitir a padronização, os instrutores
  que ministrarão cursos práticos na UPRT devem ser avaliados quanto à demonstração satisfatória
  de sua competência em:

  1. fornecer instruções com precisão usando técnicas de instrução robustas e garantir que
  a fidelidade do dispositivo seja adequada ao conteúdo do curso que está sendo ministrado;

  2. avaliar com precisão os níveis de desempenho dos alunos e fornecer correções efetivas;
  e

  3. operar efetivamente o dispositivo e todas as suas ferramentas de informação disponíveis.'
