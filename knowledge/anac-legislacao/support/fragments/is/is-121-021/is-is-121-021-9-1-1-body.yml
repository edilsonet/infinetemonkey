text: '9.1.1 Esta seção descreve as áreas que requerem consideração para permitir o desempenho
  efetivo do UPRT em um FSTD.

  9.1.2 A preocupação mais importante em relação ao desempenho do UPRT em FSTD é a possibilidade
  de introdução de treinamento negativo, que pode ser devido a vários fatores, incluindo simulação
  inadequada da condição de perda de controle, comportamento inadequado do FSTD em uma condição
  de perda de controle, resposta inadequada de referências críticas de feedback (de movimento,
  visuais, sonoras) durante a condição de perda de controle ou instrução inadequada. Melhorias
  nas seguintes áreas ajudam a garantir que o FSTD esteja adequadamente equipado para fornecer
  este treinamento:'
