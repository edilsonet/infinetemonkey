text: 'c) requisitos para a estação de operação do instrutor UPRT.

  9.1.3 A menos que o modelo de simulação do UPRT para o FSTD represente satisfatoriamente
  o comportamento e o desempenho do avião durante o estol, as condições de demonstração de
  treinamento além do ângulo crítico de ataque podem criar percepções errôneas prejudiciais
  sobre esses casos e da experiência de recuperação.

  9.2 Considerações sobre requisitos de fidelidade para UPRT'
