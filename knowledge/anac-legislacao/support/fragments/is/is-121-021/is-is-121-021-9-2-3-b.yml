title: 9.2.3(b)
text: b) Alguns FSTD podem permitir que o piloto aplique empuxo total e se recupere razoavelmente
  de um estol em alta altitude quando não é possível fazê-lo no avião real. As qualificação
  dos FSTD, quando usadas para UPRT, devem verificar essas características.
