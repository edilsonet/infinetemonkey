text: 'APÊNDICE C - SEQUÊNCIAS DE INSTRUÇÕES RECOMENDADAS PELO OEM

  C1. As sequências de treinamento recomendadas pelo OEM são agrupadas por tópicos indutores
  de perda de controle da aeronave, cada um consistindo em condições de exercício, descrição
  de instruções e justificativa. Os exemplos dados não pretendem ser limitantes de forma alguma.
  Eles são fornecidos como uma estrutura para o desenvolvimento de um currículo de treinamento.

  C1.1. Capacidades de Pitch'
