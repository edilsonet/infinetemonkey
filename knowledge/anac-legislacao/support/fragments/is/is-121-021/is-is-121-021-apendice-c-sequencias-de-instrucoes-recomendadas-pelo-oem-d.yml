title: apendice-c-sequencias-de-instrucoes-recomendadas-pelo-oem(d)
text: 'd) Estol iminente - outros cenários sugeridos.

  I. Depois de nivelado após uma descida com empuxo em marcha lenta, o piloto se esquece de
  aumentar a empuxo ou, em aviões equipados com aceleração automática (A/T), não aumenta o
  empuxo.

  II. Enquanto em baixa altitude e manobrando, se aumenta a inclinação lateral a baixas velocidades.

  III. Durante a aproximação, enquanto diminui a velocidade de aproximação, o piloto não adiciona
  flapes na sequência ou não observa de perto a tendência da energia.

  IV. A tripulação de voo é instruída a subir a uma altitude dentro do limite de certificação
  do avião, mas que não é possível de ser mantida devido ao peso e às condições de temperatura.

  C1.8. Demonstração do stick pusher'
