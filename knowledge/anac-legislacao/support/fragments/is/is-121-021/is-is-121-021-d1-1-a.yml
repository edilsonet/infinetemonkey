title: D1.1(a)
text: 'a) Reconhecer e confirmar a situação em evolução. Qualquer um dos dois pilotos: anunciar:
  "nose up”.


  Explicação: um elemento crítico no reconhecimento e confirmação é a compreensão clara do
  estado de energia da aeronave e a velocidade na qual esse estado está mudando, pois isso
  afetará a forma como a recuperação é tratada. Isso é feito referindo-se a atitude de pitch
  e/ou vetor de trajetória de voo, velocidade indicada e sua tendência e a altitude e a velocidade
  vertical do PFD (ou ADI). Isso ocorre porque o diretor de voo (FD) pode estar fornecendo
  orientação incorreta.'
