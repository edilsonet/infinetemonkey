title: D1.1(c)
text: 'c) Pitch: Aplicar tanta entrada no comando e de compensação de pitch com nose down
  quanto se requeira para obter uma razão de descida com nose down.


  Explicação: isso pode exigir a entrada do comando de inclinação total do nose down. As entradas
  adicionais de compensação de inclinação do nose down podem melhorar a eficácia do controle
  do profundor e reduzir as forças de controle de inclinação, mas o uso excessivo pode dificultar
  a fase de recuperação.'
