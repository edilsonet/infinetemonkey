title: D1.1(d)
text: 'd) Potência: ajuste (se necessário).


  Explicação: selecione até o empuxo/potência máximo disponível, desde que o controle de passo
  adequado seja mantido. Para aeronaves com motores montados sob as asas, aumentar o empuxo
  pode reduzir a eficácia do controle de inclinação nose down. Pode ser necessário limitar
  ou reduzir o empuxo até o ponto em que o controle adequado do passo seja alcançado.'
