title: D2.1(a)
text: 'a) Reconhecer e confirmar a situação em evolução. Qualquer um dos dois pilotos: anunciar:
  "nose down".


  Explicação: um elemento crítico no reconhecimento e confirmação é a compreensão clara do
  estado de energia da aeronave e a velocidade na qual esse estado está mudando, pois isso
  afetará a forma como a recuperação é tratada. Isso é feito referindo-se ao pitch e/ou vetor
  de trajetória de voo, velocidade no ar e sua tendência e a altitude a velocidade vertical
  do PFD (ou ADI). Isso ocorre porque o sistema FD pode estar fornecendo uma orientação incorreta.'
