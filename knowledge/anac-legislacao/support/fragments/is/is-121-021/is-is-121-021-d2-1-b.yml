title: D2.1(b)
text: 'b) Desconectar A/P e A/T Off (se necessário).


  Explicação: o A/P e/ou A/T devem ser desconectados se não estiverem interrompendo a divergência.
  No entanto, se eles estiverem respondendo corretamente para interromper a divergência, pode
  ser apropriado manter o nível atual de automação.'
