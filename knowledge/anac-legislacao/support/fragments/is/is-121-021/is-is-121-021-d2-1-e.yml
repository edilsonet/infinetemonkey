title: D2.1(e)
text: 'e) Rolamento: nivelar as asas na direção mais curta.


  Explicação: em geral, a situação de nariz para baixo e grande inclinação requer ação rápida,
  pois a mudança de altitude está aumentando rapidamente a velocidade. O aumento da velocidade
  resultará também no aumento da geração de carga g. A diminuição da carga g será alcançada
  aplicando o controle de pitch para frente, que é contraintuitivo em uma condição nose down,
  mas criticamente importante. Se o controle de rolagem não for eficaz após o descarregamento,
  a entrada do leme pode ser necessária para reduzir o ângulo de inclinação. Apenas uma pequena
  quantidade de entrada de leme é necessária. Muito leme aplicado muito rapidamente ou mantido
  por muito tempo pode causar perda de controle lateral e direcional e causar danos estruturais.'
