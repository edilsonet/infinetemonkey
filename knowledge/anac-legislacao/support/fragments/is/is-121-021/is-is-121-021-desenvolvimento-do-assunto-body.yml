title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Treinamento para a prevenção e recuperação da perda de controle da aeronave (UPRT) -
  Origens.

  5.1.1 O número de fatalidades devido a eventos de perda de controle em voo (LOC-I) envolvendo
  aeronaves de transporte aéreo comercial levou várias organizações a examinar as práticas
  atuais de treinamento e várias iniciativas que buscam reduzir o número de eventos de LOC-I.
  Comitês e forças-tarefa foram formados para estudar tendências da indústria, avanços na
  tecnologia de simulação, requisitos de treinamento, projeto de equipamentos de aeronaves
  e desempenho humano.

  5.1.2 Essas iniciativas incluíram um Comitê de Regulamentação de Aviação (ARC) estabelecido
  em 2011 pela Administração Federal de Aviação dos EUA (FAA). Em 2012, a Organização Internacional
  da Aviação Civil (OACI) e a FAA reuniram muitos dos grupos envolvidos nessas iniciativas
  para participar de discussões adicionais no que ficou conhecido como treinamento de prevenção
  e recuperação da perda de controle (Loss of Control Prevention and Recovery Training - LOCART).
  As Autoridades de Aviação Civil (CAA), representantes de pilotos, fabricantes de aeronaves
  e especialistas na área foram incentivados a participar das discussões específicas.

  5.1.3 O LOCART revelou que algumas das práticas existentes não eram apenas ineficazes, mas
  também eram vistas como fatores contribuintes para respostas inadequadas por parte de algumas
  tripulações de voo. Por exemplo, em certos casos, as metodologias aplicadas no treinamento
  e na verificação de proficiência de uma recuperação de estol foram baseadas na capacidade
  do piloto de realizar a recuperação com perda mínima de altitude. Como resultado, as práticas
  de treinamento enfatizaram a importância da aplicação de potência rápida com a menor redução
  possível no ângulo de ataque (AOA) para minimizar a perda de altitude em vez de apreciar
  a importância de reduzir o ângulo de ataque (AOA) para restaurar efetivamente a capacidade
  da asa de gerar sustentação. Medidas estão sendo tomadas por reguladores e provedores de
  treinamento para alterar esses procedimentos com novos requisitos de treinamento e avaliação
  que enfatizam que a recuperação efetiva de um estol iminente requer principalmente uma redução
  imediata e deliberada do ângulo de ataque. As tripulações também devem estar cientes de
  que essa redução necessária do ângulo de ataque, sempre que a aeronave encontra estados
  de baixa potência enquanto opera em grandes altitudes, também pode exigir uma perda considerável
  de altitude para garantir que seja alcançada uma recuperação efetiva de um estol iminente
  ou já estabelecido.

  5.1.4 As análises dos dados de acidentes de LOC-I indicaram que os fatores contribuintes
  podem ser categorizados como induzidos por sistemas de aeronaves, induzidos pelo ambiente,
  induzidos por pilotos/humanos ou qualquer combinação desses três. Destes, os acidentes induzidos
  por pilotos representaram a causa mais frequentemente identificada do evento em questão,
  principalmente devido a um ou mais dos seguintes motivos:'
