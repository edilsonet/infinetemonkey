text: 'Fundamento

  Durante a recuperação do estol, o empuxo máximo não é necessariamente requerido. Um estol
  pode ocorrer tanto em alto empuxo quanto em marcha lenta. Portanto, o empuxo deve ser ajustado
  durante a recuperação. Para aeronaves com motores sob as asas, o empuxo máximo pode gerar
  um forte momento de nariz para cima se a velocidade do ar for baixa. Na situação oposta,
  motores sobre as asas, a aplicação de empuxo produz um viés útil de nariz para baixo. Para
  aeronaves movidas a hélice, a aplicação de empuxo aumenta o fluxo de ar sobre as asas, auxiliando
  na recuperação.

