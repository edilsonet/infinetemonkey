title: OBJETIVO
text: 'OBJETIVO

  1.1 Esta instrução suplementar (IS) estabelece os métodos aceitáveis ​​de conformidade para
  a aprovação do programa de treinamento para a prevenção e recuperação da perda de controle
  da aeronave (UPRT) para tripulações de voo de operadores que realizam operações de acordo
  com o RBAC nº 121, em aviões que possuem dispositivos de treinamento de simulação de voo
  (FSTD) específicos para o tipo de avião a ser operado e qualificado para UPRT. No entanto,
  também são fornecidas orientações para os casos em que os operadores usam aeronaves que
  não possuem um FSTD qualificado para o UPRT.

  1.2 A fim de alcançar um UPRT eficiente em um FSTD e que isso não resulte em instrução negativa,
  esta IS fornece orientação sobre os requisitos de fidelidade necessários para que o dispositivo
  de simulação represente satisfatoriamente o comportamento e desempenho do avião durante
  o regime pós-estol ou quando o envelope de voo normal da aeronave é excedido.'
