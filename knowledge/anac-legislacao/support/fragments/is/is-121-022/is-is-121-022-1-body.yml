title: Preencha todos os campos do cabeçalho abaixo;
text: '1. Preencha todos os campos do cabeçalho abaixo;

  2. Avalie o desempenho dos conhecimentos e das habilidades do candidato relacionados a cada
  Tarefa Específica em cada

  Área de Operação, conforme a Padronização do Exame Prático DOV da Anac publicada na IS nº
  121-022;

  3. O preenchimento dos campos “Avaliação” deverá ser feito com os critérios: (CF) Conforme
  (NC) Não Conforme (NA) Não

  Aplicável (NO) Não Observado. Informações sobre o desenvolvimento de um item em particular
  ou sobre o andamento do

  exame poderão ser inseridas no campo “Comentários”, em caso de NC justificar a avaliação
  dada.

  4. Preencha os dados completos do examinador, registre o resultado do exame e colha a assinatura
  do examinando para registrar

  a sua ciência. A FAD preenchida deve ser encaminhada ao setor de licenças da Anac pelo sistema
  SACI.

  Dados do Exame

  CONTRATAÇÃO: ( X ) Sem CHT

  ( ) Com CHT EXAME:

  ( X ) Inicial/Transição

  ( ) Periódico

  ( ) Requalificação

  EQUIPAMENTO: B733

  Dados do Examinando DOV

  NOME: FULANO DE TAL

  CANAC: 123456 CPF: 987.654.32.10 EMPRESA: BRASIL CGO - BRC'
