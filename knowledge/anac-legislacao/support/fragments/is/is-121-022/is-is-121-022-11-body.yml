text: '11. Realize o briefing para o inspetor DOV na função de “piloto em comando”. (15 min)

  12. Considerando que a aeronave tenha decolado há 15min., você recebeu informações meteorológicas

  indicando que as condições mudaram drasticamente deixando seu alternado abaixo dos mínimos
  para

  pouso, e que devido a uma aeronave acidentada há interdição de todas as pistas no aeródromo
  de destino.

  Que atitude você deve tomar, e que informações deve fornecer ao PIC? (15 min)Data de emissão:
  2 de junho de 2025 IS nº 121-022

