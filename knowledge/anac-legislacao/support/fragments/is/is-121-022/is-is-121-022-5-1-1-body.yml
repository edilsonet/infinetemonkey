title: A Superintendência de Padrões Operacionais da Anac estabeleceu esta padronização que
text: '5.1.1 A Superintendência de Padrões Operacionais da Anac estabeleceu esta padronização
  que

  deve ser utilizada pelos examinadores, ao realizar exames de competência, também

  chamados de exames práticos, para despachantes operacionais de voo, durante processo

  de qualificação dos currículos de treinamento inicial, de transição, periódico, ou de

  requalificação, conforme PTO DOV aprovado. Os instrutores das empresas aéreas

  também poderão usar esta IS ao preparar os seus candidatos para os exames práticos a

  serem realizados pelos examinadores.'
