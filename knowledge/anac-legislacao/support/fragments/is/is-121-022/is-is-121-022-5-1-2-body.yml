title: A palavra “examinador” é usada nesta IS para identificar tanto um servidor designado
text: '5.1.2 A palavra “examinador” é usada nesta IS para identificar tanto um servidor designado

  DOV qualificado da Anac, como um examinador DOV da empresa aérea, credenciado

  pela Anac, que conduz o exame prático. Se necessário, o contexto explicitará qual é a

  pessoa responsável por determinada ação. A palavra “candidato” se refere ao aluno,

  examinando ou DOV que será avaliado.'
