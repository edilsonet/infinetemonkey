text: '5.1.3 Informações essenciais são descritas nos itens a seguir em termos tais como "deve"
  e

  "devem", indicando que as ações são obrigatórias. Informações de orientação são

  descritas em termos como "pode" e "podem", e indicam as ações que são desejáveis ou

  permitidas, mas não obrigatórias.

  5.2 Conceito e padronização do exame prático'
