title: Quando houver reprovação, o examinador deverá registrar os itens que obtiveram
text: '5.10.1 Quando houver reprovação, o examinador deverá registrar os itens que obtiveram

  desempenho insatisfatório do candidato em termos de áreas de operação reprovadas e de

  tarefas específicas não cumpridas no exame prático que foi realizado. A indicação “NC”

  (não conforme) deverá ser registrada na FAD nas subtarefas, nas tarefas específicas e na

  área de operação, e informações adicionais deverão ser inseridas em “Observações” e/ou

  “Comentários” para esclarecimento de como ocorreu a falha ou deficiência. As áreas de

  operação e as tarefas específicas não testadas, registradas pelas indicações “NA” (Não

  aplicável) e “NO” (Não observado), e o número de falhas de exame prático também

  devem ser registrados, utilizando os campos apropriados da ficha. A FAD deverá ser

  utilizada pelo examinador durante todo o exame prático e para o registro da reprovação

  do candidato, e após o exame, será encaminhada à Anac, conforme a IS nº 61-007. No

  âmbito da empresa aérea, deverá ser utilizada para a programação do treinamento

  adicional necessário para sanar as dificuldades identificadas pelo exame prático.

  5.11 Descontinuação do exame prático'
