title: Quando um exame prático é suspenso por outras razões que não o desempenho
text: '5.11.1 Quando um exame prático é suspenso por outras razões que não o desempenho

  insatisfatório (por exemplo, por falha de equipamento, de condições materiais ou por

  doença), o examinador deverá preparar, assinar (conforme necessário) e enviar uma

  comunicação, juntamente com a FAD até então preenchida ao setor de treinamento. A

  comunicação e a FAD devem identificar quais áreas de operação e quais tarefas

  especificas associadas foram concluídas com êxito. O setor de treinamento encaminhará

  a FAD ao examinador quando o exame prático for retomado, que poderá ser pelo mesmo

  examinador ou não. O examinador responsável pelo reexame deverá adotar os

  procedimentos descritos no parágrafo 5.9.2 desta IS.

  5.12 Gerenciamento de Recursos de Despacho (DRM)'
