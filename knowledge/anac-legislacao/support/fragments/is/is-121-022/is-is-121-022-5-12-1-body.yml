title: O controle operacional inadequado e a falta de tomada de decisão colaborativa têm
text: '5.12.1 O controle operacional inadequado e a falta de tomada de decisão colaborativa
  têm

  contribuído para os acidentes aéreos. O gerenciamento eficaz dos recursos disponíveis

  aos despachantes operacionais de voo é um elemento essencial para impedir esses

  acidentes. Ao exercer o controle operacional, o despachante coordena-se com os

  tripulantes de voo, controladores de tráfego aéreo (ATC) e outros membros de uma vasta

  equipe, a fim de atender aos requisitos das operações de voo diárias. É incentivado que
  o

  despachante operacional de voo obtenha o conhecimento sobre as funções dos outros

  participantes em todo o ambiente de operação. Dois benefícios esperados para os

  despachantes são: (1) melhor manuseio das informações que afetam a segurança das

  operações de voo; e (2) uma melhor interface com cada piloto em comando (PIC),

  consistente com o requisito de responsabilidade compartilhada delineado pelo RBAC nºData
  de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  121. Recomenda-se a consulta à IS nº 00-010 - Treinamento de Gerenciamento de

  Recursos de Equipes (Corporate Resource Management - CRM).'
