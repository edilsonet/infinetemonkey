title: O examinador deve avaliar a capacidade do candidato de usar bons procedimentos de
text: '5.13.1 O examinador deve avaliar a capacidade do candidato de usar bons procedimentos
  de

  tomada de decisão aeronáutica para avaliar os riscos ao longo do exame prático. O

  examinador deve cumprir esse requisito desenvolvendo cenários que incorporem o maior

  número possível de tarefas para avaliar as habilidades de gerenciamento de risco do

  candidato ao tomar decisões aeronáuticas seguras. Por exemplo, o examinador pode

  desenvolver um cenário que incorpore decisões sobre o clima e planejamento de

  performance. A capacidade do requerente de utilizar todos os recursos disponíveis ao

  fazer uma análise de risco para determinar o curso de ação mais seguro é essencial para

  um desempenho satisfatório. Os cenários devem ser realistas e dentro das capacidades

  das operações da empresa e da aeronave usada para o exame prático. Recomenda-se a

  consulta à IS nº 00-010 (CRM) e, complementarmente, ao material do FAA AC 60-22

  Aeronautical Decision-Making.

  6 ÁREAS DE OPERAÇÃO

  6.1 Planejamento de voo e autorização de despacho de voo'
