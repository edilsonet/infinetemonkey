title: O RBAC nº 121, em seus parágrafos 121.422(b), sobre treinamento inicial, e
text: '5.2.1 O RBAC nº 121, em seus parágrafos 121.422(b), sobre treinamento inicial, e

  121.427(b)(3), sobre treinamento periódico, requerem a realização de um exame de

  competência, visando determinar a proficiência (grau do conhecimento e da habilidade)

  de cada despachante no desempenho dos seus deveres, no âmbito do Programa de

  Treinamento da empresa aérea. Adicionalmente, o RBAC nº 65, seção 65.59, menciona

  esse mesmo exame de competência (tratado como “exame prático”) como requisito para

  as concessões de licença de DOV e de habilitações técnicas de equipamento (habilitações

  de tipo), bem como para as revalidações de habilitação de tipo; e especifica as áreas em

  que o requerente deve demonstrar conhecimento e habilidade durante a realização deste

  exame.'
