text: '5.3.2 As áreas de operação são as fases do exame prático dispostas em uma sequência
  lógica

  dentro do padrão aqui estabelecido. Elas começam com “planejamento de voo e

  autorização de despacho de voo” e terminam com “procedimentos anormais e de

  emergência”. O examinador, no entanto, pode conduzir o exame prático em qualquer

  sequência que resulte em uma avaliação completa e eficiente.'
