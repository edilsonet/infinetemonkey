title: As referências identificam as publicações que descrevem a tarefa. As descrições das
text: '5.3.4 As referências identificam as publicações que descrevem a tarefa. As descrições
  das

  tarefas não estão incluídas nesta IS porque essas informações podem ser encontradas na

  edição atual da referência listada. Publicações diferentes das listadas podem ser usadas

  para pesquisa se o seu conteúdo tiver substancialmente o mesmo significado das

  publicações referenciadas. Exceto quando apropriado (quando por exemplo, se tratar de

  regulamentos), as referências listadas neste documento não pretendem substituir

  informações do fabricante ou outros dados aceitos ou aprovados pela Anac. Referências

  servem como informação geral e fonte de materiais de estudo.'
