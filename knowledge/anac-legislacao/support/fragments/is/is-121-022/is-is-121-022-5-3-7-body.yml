title: O examinador deve determinar se o candidato cumpre uma tarefa específica, verificando
text: '5.3.7 O examinador deve determinar se o candidato cumpre uma tarefa específica, verificando

  se os objetivos da tarefa foram atingidos, por meio da demonstração de competência em

  todos os elementos de conhecimento e/ou habilidade da tarefa. Os objetivos das tarefas

  específicas de certas áreas de operação, como, por exemplo, “procedimento de chegada,

  aproximação e pouso”, podem incluir apenas elementos de conhecimento. O examinador

  pode introduzir erros comuns, como parte de uma tarefa particular, que inclui elementos

  de habilidade, bem como de conhecimento. Para cumprir a tarefa, o candidato deve ser

  capaz de reconhecer, analisar e corrigir os erros.'
