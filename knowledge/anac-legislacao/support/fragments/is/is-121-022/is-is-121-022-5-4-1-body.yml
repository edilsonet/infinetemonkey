text: '5.4.1 Os candidatos devem ser avaliados em todas as tarefas especificas incluídas em
  cada área

  de operação, salvo indicação em contrário. Deve-se avaliar o conhecimento e habilidade

  do candidato em profundidade suficiente para determinar se são cumpridas todas as

  tarefas. Entretanto, quando um determinado elemento não é apropriado para a aeronave,

  seu equipamento ou capacidade operacional, esse elemento, a critério do examinador,

  pode ser omitido. Não se pretende que o examinador siga a ordem precisa em que as áreas

  de operação e tarefas específicas aparecem na padronização desta IS. O examinador pode

  alterar a sequência ou combinar tarefas com objetivos semelhantes para economizar

  tempo.Data de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A'
