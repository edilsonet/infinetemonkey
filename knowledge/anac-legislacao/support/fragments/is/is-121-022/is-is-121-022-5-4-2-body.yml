title: Em preparação para cada exame prático, o examinador deverá elaborar um “cenário”, ou
text: '5.4.2 Em preparação para cada exame prático, o examinador deverá elaborar um “cenário”,
  ou

  “plano de ação”, escrito. O cenário incluirá todas as tarefas necessárias em cada área de

  operação. Se os elementos de uma tarefa já tiverem sido avaliados em outra tarefa, eles

  não necessitarão ser repetidos. Por exemplo, o cenário não precisa incluir a avaliação do

  candidato sobre as condições meteorológicas adversas no final do exame prático se o

  conhecimento desse elemento estiver suficientemente demonstrado no início do exame.

  Um ou mais cenários podem ser usados no exame do candidato. O cenário deve ser escrito

  na ordem em que a avaliação pretende ser conduzida, mas deve manter a flexibilidade

  para ser alterado em função de situações inesperadas à medida que estas surgirem. Deve

  ser completo o suficiente para garantir que todas as tarefas selecionadas sejam avaliadas.

  Qualquer tarefa selecionada para avaliação durante um exame prático deve ser avaliada

  em sua totalidade.'
