title: Em um ambiente computadorizado, o examinador deve exigir que o candidato demonstre
text: '5.4.4 Em um ambiente computadorizado, o examinador deve exigir que o candidato demonstre

  conhecimento e habilidade adequada nos processos de planejamento de voo e de despacho

  manuais. A preparação de um formulário de Plano de Voo manual (IEPV 100-20) é

  obrigatória durante o exame prático. Além disso, um examinador pode solicitar ao

  candidato a conferência manual de uma navegação computadorizada e da autorização de

  despacho de voo (ou do OFP) como um meio para garantir que o requerente é capaz de

  decifrar e de verificar os cálculos produzidos por computador.

  5.5 Áreas para ênfase especial'
