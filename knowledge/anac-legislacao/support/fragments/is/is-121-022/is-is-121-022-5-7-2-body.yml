title: Não há divisão formal entre as partes do exame prático para verificação do conhecimento
text: '5.7.2 Não há divisão formal entre as partes do exame prático para verificação do conhecimento

  (oral) e para verificação da habilidade (demonstração). A parte do exame dedicada ao

  planejamento manual de um voo pode ser considerada uma demonstração de habilidade;

  no entanto, o examinador deve testar o candidato em seu conhecimento do processo de

  planejamento de voo manual e dos cálculos envolvidos. A avaliação dos candidatos deve

  ser um processo contínuo ao longo do exame. O questionamento oral, para determinar o

  conhecimento de tarefas e de seus fatores de segurança relacionados, deve ser usado com

  prudência em todos os momentos. Examinadores devem testar no máximo que for

  possível as habilidades do candidato durante todo o exame prático.'
