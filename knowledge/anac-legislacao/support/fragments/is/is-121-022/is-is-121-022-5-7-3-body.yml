title: O examinador deve conduzir o exame inteiramente no idioma português. A adequada
text: '5.7.3 O examinador deve conduzir o exame inteiramente no idioma português. A adequada

  coordenação do voo e a clara comunicação do candidato com a tripulação, exercendo a

  função de despachante operacional de voo, nunca pode ficar em dúvida para o resultado

  satisfatório do exame. A reformulação normal de perguntas, como seria feito para um

  candidato nativo brasileiro, ainda é permitida e não é motivo para desqualificação.'
