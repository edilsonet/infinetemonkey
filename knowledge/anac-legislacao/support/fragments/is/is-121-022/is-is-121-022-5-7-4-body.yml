title: Se o examinador determinar que uma tarefa está incompleta ou que o resultado é incerto,
text: '5.7.4 Se o examinador determinar que uma tarefa está incompleta ou que o resultado
  é incerto,

  o examinador pode exigir que o candidato repita essa tarefa ou partes dela. Esta medida

  leva em conta o bom senso e não significa que a instrução, a prática ou a repetição de

  uma tarefa insatisfatória seja permitida a qualquer momento durante o exame. Quando

  for possível, as tarefas restantes dessa fase do exame devem ser concluídas antes da

  repetição da tarefa questionável.Data de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  5.8 Desempenho satisfatório e aprovação do exame prático'
