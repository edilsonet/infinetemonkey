title: O examinador ou candidato podem interromper o exame prático a qualquer momento em
text: '5.9.2 O examinador ou candidato podem interromper o exame prático a qualquer momento
  em

  que a falha em uma área de operação resultar em reprovação. O exame pode ser

  prosseguido apenas com o consentimento do candidato. Se o exame for descontinuado, o

  candidato tem direito a crédito apenas das áreas de operação em que suas tarefas

  associadas foram satisfatoriamente realizadas. No entanto, durante o reexame e a critério

  do examinador, qualquer tarefa poderá ser reavaliada, incluindo aquelas previamente

  aprovadas.'
