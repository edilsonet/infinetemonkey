text: 'b) apresenta conhecimento adequado dos elementos do planejamento de voo, e da

  autorização de despacho de voo (Dispatch Release), preparando um plano de voo

  ATC, navegação aérea, manifesto de carga, preenchendo as informações do take off

  data card e compondo a documentação de despacho, o plano de voo operacional

  (OFP) para um voo entre aeroportos designados;'
