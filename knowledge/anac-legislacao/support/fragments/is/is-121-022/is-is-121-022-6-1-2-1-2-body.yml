text: '6.1.2.1.2 Para conhecimento de meteorologia aeronáutica: recomenda-se o conteúdo do
  FAA-H-

  8083-28 Aviation Weather Handbook, ou similar. Consulte também a página de

  meteorologia aeronáutica no site da Anac (https://www.gov.br/anac/pt-

  br/assuntos/seguranca-operacional/meteorologia-aeronautica), e a página de artigos na

  seção Facilidades do site Redemet (https://www.redemet.aer.mil.br/).'
