text: 'b) demonstra conhecimento adequado dos tipos de clima regionais e locais, estruturas
  e

  características da atmosfera, aplicação no exercício no despacho de voo e no seu

  briefing, incluindo os itens:

  I- pressão;

  II- vento;

  III- nuvens;

  IV- névoa;

  V- gelo;

  VI- massas de ar; e

  VII- frentes.'
