title: 'Nota de ênfase: Quando as informações meteorológicas atuais, previsões ou outras'
text: '6.1.3.2 Nota de ênfase: Quando as informações meteorológicas atuais, previsões ou outras

  informações pertinentes não estiverem disponíveis, essas informações devem ser

  simuladas pelo examinador de forma a avaliar adequadamente a competência do

  candidato. Exemplos de informações meteorológicas são indicados entre parênteses

  abaixo, conforme apropriado.'
