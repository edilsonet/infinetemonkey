text: 'a) exibe conhecimento adequado dos elementos da informação meteorológica da

  aviação, obtendo, lendo e analisando os itens aplicáveis, tais como:Data de emissão: 2 de
  junho de 2025 IS nº 121-022

  Revisão A

  I- relatórios e previsões meteorológicas da aviação (ATIS, METAR, SPECI,

  TAF, FA, FB, CWSU, MIS, GTG-2, CWA, WH, AC, WW, AWW);

  II- relatórios de piloto e de radar (PIREPS, SD, imagens de satélite, RADATs);

  III- cartas de análise de superfície;

  IV- carta de tempo significativo (SIG WX);

  V- carta de ventos (Winds and temperatures aloft);

  VI- cartas de nível de congelamento (FB, RADATs, FA, gráfico de análise de

  superfície, gráficos de pressão constante);

  VII- carta de composição de estabilidade de umidade;

  VIII- carta de representação do clima;

  IX- carta de análise de pressão constante;

  X- tabelas e gráficos de conversão;

  XI- Previsões de condições adversas à aviação, como: SIGMETs, AIRMETs

  (WS, WA, WST), Aviso de Cinzas Vulcânicas e Carta de Previsão de

  Movimentação de Cinzas Vulcânicas e Dispersão (VAAS e VAFTAD);

  XII- Relatórios de condição de aeródromo;

  XIII- Sistemas NOTAM; e

  XIV- EWINS (sistema aprimorado de informações meteorológicas - enhanced

  weather information system); e'
