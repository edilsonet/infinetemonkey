title: 6.1.3.3(b)
text: 'b) analisa corretamente as informações meteorológicas pertencentes à rota proposta
  de

  voo e ao aeroporto de destino, e determina qual aeroporto de alternativa é necessário,

  e informa adequadamente o examinador. Mesmo que uma alternativa adicional seja

  necessária, determina se as alternativas selecionadas atendem aos requisitos mínimos

  meteorológicos para pousos e decolagens.'
