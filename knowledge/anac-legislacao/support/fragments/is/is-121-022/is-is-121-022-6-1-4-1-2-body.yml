title: Para conhecimento do efeito do gelo na aeronave e sistemas antigelo da aeronave,
text: '6.1.4.1.2 Para conhecimento do efeito do gelo na aeronave e sistemas antigelo da aeronave,

  recomenda-se o conteúdo da AC 20-117 Hazards Following Ground Deicing and Ground

  Operations in Conditions Conducive to Aircraft Icing, e da AC 91-74 Pilot Guide Flight

  in Icing Conditions, ou similares.'
