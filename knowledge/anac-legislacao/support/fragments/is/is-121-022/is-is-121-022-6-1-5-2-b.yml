text: 'b) demonstra conhecimento adequado dos tipos de clima regionais e locais, estruturas
  e

  características da atmosfera, aplicação no exercício no despacho de voo e no seu

  briefing, incluindo os itens:

  I- accelerate-stop distance;

  II- accelerate-go distance;

  III- takeoff performance - todos os motores e com motor inoperante;

  IV- climb performance - todos os motores e com motor inoperante;

  V- teto operacional - todos os motores e com motor inoperante;

  VI- performance de cruzeiro;

  VII- consumo de combustível, alcance e autonomia;

  VIII- descent performance;

  IX- arremetida;

  X- landing performance;

  XI- quick turnaround performance; e

  XII- drift down;'
