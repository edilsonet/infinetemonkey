title: 6.1.5.2(i)
text: 'i) demonstra e aplica, usando a terminologia correta, conhecimentos adequados sobre

  sistemas de aeronaves relacionados a:

  I- controles de voo;

  II- piloto automático;

  III- hidráulica;

  IV- elétrico;

  V- ar-condicionado e pressurização;

  VI- proteção contra gelo e chuva;

  VII- aviônica, comunicação e navegação;

  VIII- motorização e unidades auxiliares de potência;

  IX- sistemas e fontes de combustível;

  X- sistema de óleo;

  XI- trem de pouso e freios;

  XII- detecção e proteção contra incêndio;

  XIII- procedimentos de emergência e procedimentos anormais; e

  XIV- lista de equipamentos mínimos (MEL) / lista de desvio de configuração

  (CDL).'
