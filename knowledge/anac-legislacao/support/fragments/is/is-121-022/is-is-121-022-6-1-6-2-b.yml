section_title: 'Objetivo: determinar se o candidato demonstra conhecimento adequado sobre
  navegação'
subsection_id: b
cite: 6.1.6.2(b)
title: 6.1.6.2(b)
text: 'b) demonstra conhecimento adequado dos tipos de clima regionais e locais, estruturas
  e

  características da atmosfera, aplicação no exercício no despacho de voo e no seu

  briefing, incluindo os itens:

  I- cartas de navegação, símbolos e o sistema nacional de espaço aéreo;

  II- instrumentos de navegação aérea instalados na aeronave e sistemas

  automatizados de banco de dados:

  A. sistema eletrônico de instrumentos de voo (EFIS); e

  B. sistema de gerenciamento de voo (FMS);Data de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  III- operações de navegação especiais e sua performance:

  A. RVSM (Mínimos de Separação Vertical Reduzida);

  B. ETOPS (operações estendidas);

  C. RNP (Desempenho de Navegação Requerido);

  D. rotas RNAV (Área de Navegação):

  i. GNSS (Sistema Global de Navegação por Satélite) - WAAS (Wide

  Area Augmentation System) e Sistema de Posicionamento Global

  (GPS - Global Positioning System); e

  ii. Sistemas Baseados em Inercial; e

  E. FMS (Sistema de Gerenciamento de Voo);

  IV- definições de navegação, referências de tempo e localização (longitude 0°,

  UTC);

  V- sistemas de navegação, incluindo:

  A. Faixa Omnidirecional VHF (VOR - VHF Omnidirectional Range);

  B. Equipamento de Medição de Distância (DME - Distance Measuring

  Equipment);

  C. Sistema de pouso por instrumento (ILS - Instrument Landing System);

  D. Receptor de marcação de balizador (Marker Beacon Receiver);

  E. codificação de transponder / altitude;

  F. procura automática de direção (ADF - Automatic Direction Finding).

  G. navegação de longo alcance (LORAN - Long Range Navigation).

  H. Sistema de Navegação Inercial (INS - Inertial Navigation System).

  I. Sistema de Referência Inercial (IRS - Inertial Reference System).

  J. Navegação de Área (RNAV - Area Navigation).

  K. Radar Doppler.

  L. Sistema de Posicionamento Global (GPS - Global Positioning System).'
