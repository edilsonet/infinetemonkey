title: Tique com um “X” em “CONTRATAÇÃO ( ) Sem CHT”, quando o examinando for
text: '7.2.2 Tique com um “X” em “CONTRATAÇÃO ( ) Sem CHT”, quando o examinando for

  contratado inicialmente na empresa aérea sem CHT, e tiver realizado a experiencia prática

  na empresa aérea (OJT ou “estágio operacional”) com 40 despachos reais, ou “( ) Com

  CHT”, quando o examinando recém-contratado já tiver experiência anterior como DOV

  em outra empresa, e realizar o OJT com 10 despachos. Além disso, tique no campo

  apropriado em “EXAME ( ) Inicial/Transição ( ) Periódico ( ) Requalificação”,

  conforme a categoria e o currículo de treinamento cumprido pelo DOV e o segmento de

  qualificação no qual o exame prático que está sendo aplicado está inserido. Para mais

  detalhes, veja IS nº 121-008.'
