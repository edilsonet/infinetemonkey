title: O campo “EQUIPAMENTO” deve conter a designação do modelo da aeronave em
text: '7.2.3 O campo “EQUIPAMENTO” deve conter a designação do modelo da aeronave em

  conformidade com o descrito pela IS nº 61-004 (Lista de habilitações averbadas pela Anac

  nas licenças de pilotos), em sua edição mais recente.'
