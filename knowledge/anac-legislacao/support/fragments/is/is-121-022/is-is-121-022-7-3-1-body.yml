title: O examinador deverá descrever de forma sucinta o que aconteceu durante o exame
text: '7.3.1 O examinador deverá descrever de forma sucinta o que aconteceu durante o exame

  prático. Caso tenham sido observados pontos fracos, o examinador não poderá omiti-los,

  escrevendo, porém, de uma forma polida, por exemplo: ‘Há espaço para melhoria em

  análise meteorológica’ ou ‘bom desempenho, mas pode ser melhorado se aumentar o

  conhecimento sobre sistemas’. Desta forma, no próximo ano, o examinador poderáData de emissão:
  2 de junho de 2025 IS nº 121-022

  Revisão A

  consultar o ‘file’ do examinando e constatar se houve evolução nos conhecimentos do

  examinando.

  7.4 Rodapé'
