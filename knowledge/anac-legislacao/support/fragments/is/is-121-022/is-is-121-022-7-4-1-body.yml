title: O examinador deve registrar o resultado do exame prático no campo “Conceito final”
text: '7.4.1 O examinador deve registrar o resultado do exame prático no campo “Conceito final”

  ticando em Aprovado ou Reprovado. O examinando deve dar prova de sua ciência do

  resultado apondo sua assinatura em “Assinatura do Examinando”. Além disso o

  examinador deve se identificar com seu nome completo, registrar seu código Anac e apor

  sua assinatura ou rubrica no campo “Assinatura do Examinador”.'
