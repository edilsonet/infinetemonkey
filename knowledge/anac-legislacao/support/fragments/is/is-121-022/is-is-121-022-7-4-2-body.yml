title: Para o caso de a FAD ser preenchida diretamente no computador e/ou assinada
text: '7.4.2 Para o caso de a FAD ser preenchida diretamente no computador e/ou assinada

  eletronicamente, ou digitalmente, o campo de assinatura tanto do examinador como do

  examinando deve ser de acordo com as orientações oficiais da página da Anac sobre

  Documentos com Assinatura Digital nesse endereço https://www.gov.br/anac/pt-

  br/assuntos/regulados/profissionais-da-aviacao-civil/habilitacao/documentos-com-

  assinatura-digital, e também do site Gov.br, nesse endereço

  https://www.gov.br/governodigital/pt-br/identidade/assinatura-eletronica.'
