text: '8. Qual o máximo peso de decolagem e de pouso limitados por performance? (15 min)

  9. Qual é o peso atual de decolagem, considerando as condições meteorológicas atuais (ou
  as informadas

  pelo inspetor DOV)? (15 min)

  10. Prepare a documentação completa do voo que deve conter além deste questionário (30 min):

  a. Navegação;

  b. Manifesto de Peso e Balanceamento - preenchido manualmente;

  c. Plano de Voo ATC - preenchido manualmente;

  d. Meteorologia;

  e. NOTAM;

  f. Informações adicionais que o despachante julgar necessárias para a operação segura do
  voo.'
