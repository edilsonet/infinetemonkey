title: 9.1.2(b)
text: 'b) caso contrário, poderão seguir a certificação com base nos procedimentos já

  apresentados, sem atender à padronização estabelecida por esta IS. Neste caso,

  aplicam-se os prazos de 9.1.1, mas considerados a partir da data de emissão do

  Certificado de Operador Aéreo (COA).'
