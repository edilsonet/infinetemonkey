text: 'APÊNDICE B - EXEMPLO DE CENÁRIO DE EXAME PRÁTICO

  B.1 Este apêndice exemplifica uma das diversas formas possíveis de confecção de um “cenário”

  ou “plano de ação” para a aplicação do exame prático DOV. A seguir vemos uma página com
  o

  cenário e as duas páginas da MEL para utilização no exame.

  Exame Prático de Despachante Operacional de Voo

  São Paulo, 28 de março de 2025.

  Nome: FULANO DE TAL

  ANAC: 123456 CPF: 987.654.321-00

  ACFT: B737

  Cenário:

  a. Aeronave: PR-BRA

  b. Passageiros: máximo possível e suas bagagens.

  c. Carga: COMAT avulso (revistas): 500kg.

  d. Trecho: SBGR-SBGL, ETD: 2100 UTC.

  e. Item MEL 21-01-01-01. Air Conditioning Pack inoperative. Pack#1 inop.

  (2ª opção 24-01-01A Engine Driven Generator #1 inop.)

  Instruções: Responda primeiramente as questões abaixo, de 1-9, sem a utilização de sistemas
  de navegação

  computadorizados. Após, para as questões 10 e 11, utilize os sistemas de navegação autorizados
  na empresa. A

  duração do exame é de aproximadamente 3 a 4 horas. Questões orais adicionais serão fornecidas
  a qualquer

  momento durante o exame para verificação de conhecimentos e deverão ser respondidas corretamente.'
