text: 'APÊNDICE F - LISTA CONSOLIDADA DE REFERÊNCIAS TÉCNICAS

  INTERNACIONAIS

  F.1 A padronização do exame prático DOV do FAA-S-8081-10D Aircraft Dispatcher Practical

  Test Standards foram baseados nas publicações a seguir e quando consultadas devem ser utilizadas

  em última versão. O objetivo desta tabela é fornecer fontes de consulta e estudo, para comparação

  com a regulamentação nacional e ampliação de conhecimentos.

