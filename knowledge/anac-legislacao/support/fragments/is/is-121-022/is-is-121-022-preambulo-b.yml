text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,

  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve

  garantir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos adicionais ou contrariar requisitos estabelecidos em
  RBAC

  ou outro ato normativo.

  4 DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01,

  e nos RBAC nº 65, 91 e 121.Data de emissão: 2 de junho de 2025 IS nº 121-022

  Revisão A

  4.2 Abreviaturas

  As abreviaturas utilizadas nessa IS são explicadas no próprio desenvolvimento do assunto

  e nos materiais de referência.

  5 DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução'
