text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 121-022

  Revisão A

  Aprovação: Portaria nº 17.094/SPO, de 28 de maio de 2025

  Assunto: Padrões para a realização de exames práticos (exames de

  competência) de despachantes operacionais de voo (DOV)

  1 OBJETIVO

  1.1 Estabelecer parâmetros para realização dos exames práticos (exames de competência) de

  despachantes operacionais de voo, conforme previstos pelo RBAC nº 121.

  2 REVOGAÇÃO

  N/A

  3 FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar

  - IS, norma suplementar de caráter geral editada pelo Superintendente da área

  competente, objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto

  em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de

