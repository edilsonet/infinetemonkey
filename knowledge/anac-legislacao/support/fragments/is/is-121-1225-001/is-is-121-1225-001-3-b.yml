title: 3(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,

  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3. O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve

  garantir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.

  3.4. A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou

  outro ato normativo.

  3.5. Esta IS fundamenta-se também na seção 121.1225 do RBAC 121 e na NSCA 3-3,

  intitulada “Gestão da segurança de voo na aviação brasileira”, editada pelo Comando da

  Aeronáutica (COMAER).18 de julho de 2014 IS Nº 121.1225-001

  Revisão A'
