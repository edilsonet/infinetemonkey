title: 5.1.3(a)
text: 'a) inclusão de novo modelo de aeronave:

  I - formulário devidamente preenchido e assinado, conforme parágrafo 5.2.8.3 desta IS;

  II - as EO emitidas pelo Estado do operador aplicáveis ao modelo de aeronave, conforme o
  parágrafo 5.2.4.4(b) desta IS;

  III - informações sobre aeronaves, conforme o parágrafo 5.2.4.4(c) desta IS;

  IV - informações sobre aeronaves abrangidas por acordo sob o artigo 83 bis, se aplicável,
  conforme o parágrafo 5.2.4.4(d) desta IS;

  V - informações sobre aeronaves em regime de intercâmbio, se aplicável, conforme o parágrafo
  5.2.4.4(e) desta IS;

  VI - plano operacional dos voos de/para Brasil, conforme o parágrafo 5.2.4.4(f) desta IS.
  Este item pode ser dispensado se a empresa já operar aeronaves de porte similar, em termos
  de largura da cabine (narrow ou wide body); e

  VII - informações sobre serviços de manutenção, conforme o parágrafo 5.2.4.4(h) desta IS;'
