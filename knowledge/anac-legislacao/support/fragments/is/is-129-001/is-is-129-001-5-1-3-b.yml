title: 5.1.3(b)
text: 'b) estar disponível e acessível durante esse período para a eventualidade de a ANAC
  decidir verificar a capacidade da empresa de conduzir operações seguras.

  Nota: não é requerida uma manifestação formal da ANAC para a retomada das operações. Assim,
  15 dias após a notificação, a empresa estrangeira pode retomar suas operações regulares,
  desde que a ANAC não tenha apresentado impedimento.

  5.3. Operações Não Regulares

  5.3.1. Uma empresa estrangeira de transporte aéreo que pretenda realizar somente voos não
  regulares no Brasil deve obter autorização prévia da ANAC para realização desses voos. O
  processo de tem início com a solicitação de autorização para operar serviço de transporte
  aéreo não regular, nos termos da Resolução nº 692, de 21 de setembro de 2022 (ou norma que
  vier a substituí-la), e da Portaria SAS/SIA/SPO nº 9715, de 7 de novembro de 2022 (ou norma
  que vier a substituí-la).

  5.3.2. Esta solicitação deve ser apresentada por meio de formulário devidamente preenchido
  e assinado pelo representante legal da empresa.

  Nota: o modelo de formulário encontra-se disponível no sítio da ANAC, no endereço eletrônico
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

