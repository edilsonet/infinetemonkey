text: 'c) a empresa estrangeira de táxi aéreo e da aviação geral.

  Nota: empresas estrangeiras de táxi aéreo, nesse contexto, são aquelas que se dediquem somente
  a realizar operações de serviço de transporte aéreo internacional não regular, com aviões
  com configuração máxima certificada de assentos para passageiros de até 19 (dezenove) assentos
  e capacidade máxima de carga paga de até 3.400 kg (três mil e quatrocentos quilogramas)
  (7.500 lb - sete mil e quinhentas libras), ou com helicópteros. Essas empresas devem cumprir
  os requisitos de operações do RBAC nº 129, porém, conforme o parágrafo 129.12(a)(1), não
  necessitam solicitar autorização nos termos desta IS, uma vez que já seguem os procedimentos
  estabelecidos pela Resolução nº 178, de 21 de dezembro de 2010 (ou norma que venha a substituí-la).

  5.2. Operações regulares

  5.2.1. Para fins de cumprimento do requisito da seção 129.11 do RBAC nº 129, cada empresa
  estrangeira de transporte aéreo que pretenda conduzir suas operações regulares no Brasil
  deve obter autorização da ANAC, por meio de um processo de homologação descrito no item
  5.2.4 desta IS.

  5.2.2. O processo de homologação para obtenção de autorização para operações regulares tem
  o objetivo de reconhecer como válidos o COA e EO, emitidos pela Autoridade de Aviação Civil
  do Estado do operador, segundo preconiza o Anexo 6 à Convenção de Aviação Civil Internacional
  e o Doc. 8335 da OACI.

  5.2.3. No contexto das empresas estrangeiras de transporte aéreo, o processo de homologação
  definido nesta IS não tem o mesmo significado que o processo de certificação de um operador
  nacional, conforme definido no RBAC nº 119.

  5.2.4. Descrição do processo de homologação

  5.2.4.1. O processo de homologação de empresa estrangeira de transporte aéreo tem início
  com a solicitação de autorização para operar serviço de transporte aéreo regular, nos termos
  da Resolução nº 692, de 21 de setembro de 2022 (ou norma que vier a substituí-la), e da
  Portaria SAS/SIA/SPO nº 9715, de 7 de novembro de 2022 (ou norma que vier a substituí-la).

  5.2.4.2. A solicitação deve ser protocolada pelo menos 30 dias antes do início pretendido
  das operações no Brasil, conforme previsto no parágrafo 129.11(b) do RBAC nº 129.

  5.2.4.3. Esta solicitação deve ser apresentada por meio de formulário devidamente preenchido
  e assinado pelo representante legal da empresa.

  Nota: o modelo de formulário encontra-se disponível no sítio da ANAC, no endereço eletrônico
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.4.4. Os documentos a serem anexados ao formulário, no âmbito da verificação dos requisitos
  operacionais, são:'
