text: 'd) informações sobre aeronaves em regime de intercâmbio, se aplicável.

  5.3.4. Não obstante o parágrafo 5.3.3 desta IS, a ANAC poderá, mediante solicitação, requerer
  a apresentação de quaisquer outros documentos e manuais que considere necessários a fim
  de assegurar que a operação prevista se realize de forma segura em pleno cumprimento de
  leis, padrões e práticas recomendadas pelos Anexos da Convenção de Aviação Civil Internacional.

  5.3.4.1. Conforme o parágrafo 129.33(a) do RBAC nº 129, caso, por razões de segurança operacional,
  a ANAC entenda que alguma autorização, aprovação, limitação ou isenção concedida pela Autoridade
  de Aviação Civil do Estado do operador não possa ser utilizada nas suas operações de ou
  para o Brasil, poderá limitar a autorização ou indeferir uma solicitação. Para essa avaliação,
  a ANAC considerará fatores como:'
