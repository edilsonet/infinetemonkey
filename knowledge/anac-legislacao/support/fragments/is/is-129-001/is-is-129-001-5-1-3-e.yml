text: 'e) atualização do Manual Geral de Operações não necessita ser enviada, exceto em caso
  de ser requerido por alteração significativa.

  5.2.8. Implementação de alterações significativas

  5.2.8.1. Caso a empresa estrangeira de transporte aéreo pretenda implementar alterações
  significativas em suas operações internacionais no Brasil, deve notificar a ANAC pelo menos
  30 dias antes da data pretendida da entrada em vigor da alteração, em conformidade com a
  Portaria SAS/SIA/SPO nº 9715, de 7 de novembro de 2022 (ou norma que vier a substituí-la).

  5.2.8.2. Consideram-se alterações significativas quaisquer alterações nas prerrogativas
  de operação da empresa, quando tais alterações afetarem as operações da empresa de ou para
  o Brasil.

  São exemplos de alterações significativas:'
