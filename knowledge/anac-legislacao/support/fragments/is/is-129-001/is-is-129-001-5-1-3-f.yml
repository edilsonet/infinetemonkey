title: 5.1.3(f)
text: 'f) Plano operacional dos voos de/para o Brasil

  Refere-se ao planejamento e ao controle operacional dos voos das empresas nos quais garantem
  aos seus pilotos a familiarização com as facilidades de navegação e de comunicação, com
  o controle de tráfego aéreo e com outros procedimentos das áreas a serem voadas dentro do
  Brasil.

  A empresa estrangeira de transporte aéreo deve apresentar cópia do plano operacional de
  voo (OFP) dos seus voos com origem e destino no Brasil, os quais demonstram que a empresa
  possui procedimentos técnico-operacionais para operações regulares no Brasil.

  O OFP não é o mesmo plano de voo ATC previsto na ICA 100-11 do DECEA.'
