title: 5.1.3(g)
text: 'g) Informações sobre prestadores de serviço de handling

  As empresas estrangeiras de transporte aéreo devem apresentar cópia dos contratos ou cartas
  de intenção com empresas prestadoras de serviço de handling que serão as responsáveis pela
  execução dos serviços de carregamento/descarregamento de cargas, atendimento a passageiros
  e outros serviços essenciais para o atendimento de voos em território brasileiro.

  Serão aceitos os contratos do tipo SGHA da IATA.'
