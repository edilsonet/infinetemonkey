title: 5.1.3(h)
text: 'h) Informações sobre serviços de manutenção

  A empresa estrangeira de transporte aéreo deve apresentar informações referentes aos serviços
  de atendimento e manutenção de suas aeronaves em território brasileiro de acordo com o Capítulo
  8 do Anexo 6, Parte I, ou Capítulo 6 do Anexo 6, Parte III, Seção II, conforme aplicável,
  à Convenção de Aviação Civil Internacional, com seu programa de manutenção aprovado pela
  Autoridade de Aviação Civil do Estado de registro da aeronave.

  No caso de manutenção com mecânicos próprios contratados no Brasil, a empresa deve comunicar
  a ANAC no campo correspondente do formulário referido no parágrafo 5.2.4.3 desta IS.

  Caso os serviços de manutenção sejam executados por outras empresas, os contratos ou cartas
  de intenção devem ser apresentados.'
