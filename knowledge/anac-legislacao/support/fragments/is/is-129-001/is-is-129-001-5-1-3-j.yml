text: 'j) Isenções, se aplicável

  A empresa estrangeira de transporte aéreo deve apresentar as isenções que tenham sido emitidas
  em favor da empresa e que afetem as operações de ou para o Brasil. Incluem-se as isenções
  com relação aos regulamentos do Estado do operador e, ademais, para cada aeronave, as isenções
  com relação aos regulamentos do Estado de registro.

  A empresa deve apresentar o documento que permitiu a isenção e, caso tais informações não
  constem no documento, detalhar:

  I - os requisitos que foram isentados;

  II - o prazo pelo qual a isenção foi concedida; e

  III - a abrangência da isenção (em termos de aeronaves, pilotos, operações específicas etc).

  Caso a empresa não informe alguma isenção à ANAC, entende-se que essa isenção não poderá
  ser utilizada em suas operações sob o RBAC nº 129.

  5.2.4.5. Não obstante o parágrafo 5.2.4.4 desta IS, a ANAC poderá, mediante solicitação,
  requerer a apresentação de quaisquer outros documentos e manuais que considere necessários
  a fim de assegurar que a operação prevista se realize de forma segura em pleno cumprimento
  de leis, padrões e práticas recomendadas pelos Anexos da Convenção de Aviação Civil Internacional.

  5.2.5. Representantes e pessoas de contato da organização requerente

  5.2.5.1. O representante legal, conforme regulamento aplicável, deve conhecer a regulamentação
  pertinente às operações pretendidas, assim como as IS que lhes sejam relacionadas, incluindo
  esta, a fim de que o processo de homologação seja agilizado.

  5.2.5.2. As comunicações, interações e documentos necessários ao processo de homologação
  somente serão aceitos se realizados pelas pessoas legalmente designadas pela organização
  requerente, respeitadas as respectivas áreas de atuação. Os representantes não-técnicos,
  legalmente estabelecidos, podem receber orientações gerais sobre a documentação encaminhada
  à ANAC pela organização requerente.

  5.2.5.3. Não obstante o item 5.2.5.2 desta IS, e visando otimizar as interações entre a
  ANAC e a organização requerente, detalhes envolvendo o atendimento de requisitos técnicos
  poderão ser solicitados pela ANAC diretamente ao pessoal da direção da organização requerente
  no Estado de origem do operador, respeitadas as respectivas áreas de atuação encarregadas
  de providenciar o cumprimento do requisito técnico.

  5.2.6. Encerramento compulsório do processo de homologação

  5.2.6.1. A organização requerente de uma autorização para operações regulares terá sempre
  o prazo de 60 (sessenta) dias para apresentar as ações requeridas durante o processo ou
  as respostas a cada comunicação de não-conformidade.

  5.2.6.2. Caso esse prazo se encerre sem manifestação conclusiva por parte da organização
  requerente, o processo será compulsoriamente encerrado e considerado insatisfatoriamente
  concluído. Esta situação será informada à organização requerente pela ANAC.

  5.2.7. Homologação

  5.2.7.1. Após a conclusão da análise de toda a documentação encaminhada, caso seja considerada
  aprovada, a ANAC emitirá o documento de validação do COA.

  5.2.7.2. Conforme o parágrafo 129.33(a) do RBAC nº 129, caso, por razões de segurança operacional,
  a ANAC entenda que alguma autorização, aprovação, limitação ou isenção concedida pela Autoridade
  de Aviação Civil do Estado do operador não possa ser utilizada nas suas operações de ou
  para o Brasil, poderá limitar a autorização ou indeferir uma solicitação. Para essa avaliação,
  a ANAC considerará fatores como:'
