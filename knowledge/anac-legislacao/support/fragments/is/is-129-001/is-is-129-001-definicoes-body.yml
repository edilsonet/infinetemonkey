title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1. No escopo da presente IS, são válidas todas as definições contidas no RBAC nº 01 e
  no RBAC nº 129, e as seguintes definições:

  4.2. Certificado de Operador Aéreo (COA): é o documento emitido por uma Autoridade de Aviação
  Civil que certifica que determinada empresa passou por um processo de certificação técnica
  e cumpre os requisitos mínimos estabelecidos;

  4.3. Contrato de intercâmbio de aeronave (aircraft interchange agreement): acordo entre
  operadores aéreos que viabilize o serviço, com uma única aeronave, ligando a rota de uma
  empresa aérea à rota de outra empresa aérea em um ponto de intercâmbio, de forma que o controle
  operacional e as responsabilidades dele decorrentes, bem como a tripulação competem à empresa
  aérea operando em cada rota. Neste tipo de contrato, o último operador assume o controle
  operacional da aeronave, no momento da transferência;

  4.4. Plano operacional de voo: é o plano do operador para a condução segura do voo, considerando
  o desempenho da aeronave, outras limitações operacionais e as condições relevantes esperadas
  na rota e nos aeródromos envolvidos;

  4.5. Representante legal: é a pessoa nomeada pela empresa estrangeira de transporte aéreo
  nos termos da Portaria SAS/SIA/SPO nº 9715, de 7 de novembro de 2022 (ou norma que vier
  a substituí-la);

  4.6. Wide body: é avião comercial de fuselagem larga com mais de um corredor; e

  4.7. Narrow Body: é avião comercial de fuselagem estreita com único corredor.

  4.8. Lista de abreviaturas em ordem alfabética:

  AOC - Air Operator Certificate

  AR - Authorization Required

  ATC - Air Traffic Control

  AVSEC - Aviation Security

  CC - Compliance Checklist

  COA - Certificado de Operador Aéreo

  DECEA - Departamento e Controle do Espaço Aéreo

  EDTO - Extended Diversion Time Operations

  EFOD - Electronic Filling Of Differences

  EO - Especificações Operativas

  ETOPS - Extended Operations (Operação Prolongada)

  IATA - International Air Transport Association

  ICA - Instrução do Comando da Aeronáutica

  IDIRS - Intercambio de datos de inspecciones de seguridad en rampa

  OACI - Organização da Aviação Civil Internacional

  OFP - Operational Flight Plan

  PBN - Performance Based Navigation

  RVSM - Reduced Vertical Separation Minima (Separação Vertical Mínima Reduzida)

  SAFA - Safety Assessment of Foreign Aircraft

  SGHA - Standard Ground Handling Agreement

  SPO - Superintendência de Padrões Operacionais

  USOAP - Universal Safety Oversight Audit Programme'
