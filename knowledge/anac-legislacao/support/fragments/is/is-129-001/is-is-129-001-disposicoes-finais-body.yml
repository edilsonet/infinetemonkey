cite: disposicoes-finais
title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1. Os casos omissos serão dirimidos pela SPO.

  7.2. Os operadores aéreos que possuam processo de solicitação de alteração de EO em análise
  pela ANAC na data de vigência desta IS ou que iniciem um processo no prazo de até 60 dias
  após a data de vigência desta IS poderão optar pela continuidade do processo em conformidade
  com a Revisão B da IS nº 129-001 ou por início de novo processo seguindo o disposto nesta
  Revisão C.

  7.3. Os operadores aéreos que possuam EO aprovadas pela ANAC anteriormente à publicação
  desta IS consideram-se autorizados, no âmbito dos requisitos operacionais, de acordo com
  as condições e limitações estabelecidas nas EO aprovadas. Assim, devem considerar essas
  EO como base para determinação de se as alterações que desejam implementar são significativas.

  7.4. A documentação a ser encaminhada pelos operadores para ANAC será aceita somente nos
  idiomas português, inglês ou espanhol.'
