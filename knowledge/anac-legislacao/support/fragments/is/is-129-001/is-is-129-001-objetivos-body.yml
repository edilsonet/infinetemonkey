title: OBJETIVOS
text: 'OBJETIVOS

  1.1. Oferecer a uma empresa estrangeira de transporte aéreo que opere ou pretenda operar
  serviço de transporte aéreo internacionais no Brasil, um método de cumprimento para os requisitos
  estabelecidos pelo RBAC nº 129.

  1.2. Apresentar procedimentos para a obtenção de autorização, segundo os requisitos do RBAC
  nº 129, para uma empresa estrangeira de transporte aéreo que pretenda realizar operações
  regulares no Brasil.

  1.3.Apresentar procedimentos para alteração de operações já autorizadas segundo o RBAC nº
  129.

  1.4. Apresentar procedimentos para obtenção de autorização, segundo os requisitos do RBAC
  nº 129, para realização de voos não regulares para uma empresa estrangeira de transporte
  aéreo.'
