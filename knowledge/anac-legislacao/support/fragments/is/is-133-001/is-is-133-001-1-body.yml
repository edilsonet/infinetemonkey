title: Certificação.
text: '1. Certificação.

  Nenhuma pessoa pode operar esta aeronave com uma carga externa, a menos que essa pessoa
  possua uma Autorização para Operação com Carga Externa emitida pela Anac e tenha uma declaração
  atestando sua competência ou um registro em sua caderneta de voo indicando que atende ao
  previsto no parágrafo 133.37(a)(1) do RBAC n° 133. A declaração de competência ou o registro
  do teste de habilidade e conhecimento em sua caderneta de voo deve estar na posse dessa
  pessoa durante a realização das operações sob o RBAC nº 133.'
