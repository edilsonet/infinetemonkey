section_title: Tripulantes e não tripulantes.
subsection_id: a
cite: 2(a)
title: 2(a)
text: 'a) equipe de solo. Instrua os atendentes da rampa e o pessoal de manutenção de helicópteros
  sobre meios seguros de realizar suas tarefas específicas. Isso inclui:

  i. manter as pessoas programadas para embarcar e as pessoas não autorizadas longe das áreas
  de pouso e decolagem do helicóptero; e

  ii. instruir o pessoal de embarque sobre a melhor maneira de se aproximar e embarcar em
  um helicóptero cujos rotores estão girando;'
