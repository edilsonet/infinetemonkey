title: 2(b)
text: 'b) manutenção. Os procedimentos adequados para manutenção de aeronaves de asas rotativas
  incluem o seguinte:

  i. pare as pás do rotor do helicóptero e aterre adequadamente o helicóptero e a unidade
  de reabastecimento antes de qualquer operação de reabastecimento. O piloto deve garantir
  o uso do tipo de combustível adequado e quaisquer aditivos necessários;

  ii. reabastecer o helicóptero enquanto as pás dos rotores estão girando (reabastecimento
  a quente) pode ser prático para certos tipos de operações. No entanto, isso pode ser extremamente
  perigoso quando os procedimentos de segurança não são seguidos. O piloto em comando deve
  permanecer no posto de pilotagem durante o abastecimento; O pessoal de reabastecimento deve
  ter conhecimento sobre os procedimentos adequados de reabastecimento e ser devidamente informados
  sobre as particularidades das marcas e modelos específicos de helicópteros. O pessoal de
  reabastecimento deve comunicar-se com o piloto por rádio ou sinais manuais durante o reabastecimento
  a quente (parágrafo 133.47(c)(3) do RBAC n° 133);

  iii. posicione as unidades de reabastecimento para garantir uma folga adequada das pás do
  rotor; mantenha as pessoas não envolvidas na operação de reabastecimento longe da área.
  Verifique a desconexão e a segurança de todos os equipamentos de reabastecimento longe do
  helicóptero antes do movimento do helicóptero. Sempre se certifique de que o equipamento
  de extinção de incêndio adequado esteja disponível ao reabastecer; e

  iv. proibir fumar dentro e ao redor da aeronave rotativa durante todas as operações de reabastecimento;'
