title: Pessoas a bordo.
text: '2. Pessoas a bordo.

  Nenhuma pessoa que não seja um membro requerido da tripulação pode voar a bordo da aeronave,
  a menos que essa pessoa execute uma função essencial em conexão com a operação de carga
  externa. Quando a aeronave usada requerer um operador de guincho, ele deve usar um cinto
  de segurança de operador de guincho aprovado enquanto não estiver sentado com um cinto de
  segurança preso (parágrafo 133.47(c)(3) do RBAC nº 133).'
