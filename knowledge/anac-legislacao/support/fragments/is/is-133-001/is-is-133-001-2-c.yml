cite: 2(c)
title: 2(c)
text: 'c) os sinalizadores de carga externa devem ser treinados quanto ao seguinte:

  i. a capacidade de carga dos helicópteros envolvidos. Esse conhecimento é essencial porque
  alguns operadores possuem modelos de helicópteros com características físicas quase idênticas,
  mas diferentes capacidades de carga;

  ii. os pilotos. Revisão dos procedimentos de coordenação com a tripulação. Procedimentos
  padronizados para coleta e liberação de cargas externas. Procedimentos de emergência a serem
  adotados pelo piloto;

  iii. a carga. Muitos itens transportados externamente são muito frágeis. O enganchador deve
  estar familiarizado com materiais potencialmente perigosos (artigos perigosos) e ciente
  da natureza do perigo potencial. Explosivos, materiais radioativos e produtos químicos tóxicos
  são exemplos de possíveis artigos perigosos. A Subparte C do RBAC nº 175 contêm a Classificação
  dos Artigos Perigosos. O transporte de artigos perigosos nas operações conforme RBAC n°
  133 requer autorização da Anac. Além de conhecer a natureza da carga, o enganchador deve
  receber treinamento para manusear e estar familiarizado com os tipos de equipamentos de
  proteção, roupas e ações que são necessárias para uma operação segura;

  iv. os sinais manuais apropriados. Revisão dos procedimentos de comunicação normais e de
  emergência. Quando as comunicações de rádio diretas entre o pessoal de solo e de voo forem
  necessárias, esclareça o significado específico de todos os sinais manuais necessários antes
  do início das operações;

  v. procedimentos de emergência. O pessoal de solo e de voo deve concordar totalmente e compreender
  todas as ações necessárias a serem tomadas por todos os envolvidos em caso de emergência.
  Esse planejamento prévio é essencial para evitar lesões em caso de emergência;

  vi. todos os aspectos da operação de carga externa sendo conduzida. O piloto conduzindo
  a operação de carga externa deve completar um briefing detalhado para todo o pessoal, não
  importa o quão remotamente envolvido na operação, antes de iniciar a operação;

  vii. posicionamento. O sinalizador deve estar em uma posição visível para o piloto e para
  o enganchador, localizado em um lado da trajetória de voo e o mais próximo possível da área
  de operação com as costas para o vento;

  viii. uso de equipamentos de segurança pessoal, como capacetes, luvas e óculos de proteção;

  ix. revisão dos procedimentos de comunicação normais e de emergência, incluindo sinais manuais;

  x. revisão dos procedimentos de coordenação da tripulação;

  xi. execução de inspeção de pré-voo do equipamento de elevação;

  xii. utilização de um dispositivo de elevação de pessoal aprovado;

  xiii. operação do guincho, incluindo limitações e procedimentos normais e de emergência;

  xiv. as partes apropriadas do MVCAC;

  xv. reconhecimento de situações perigosas; e

  xvi. reconhecimento do início da oscilação perigosa da carga.'
