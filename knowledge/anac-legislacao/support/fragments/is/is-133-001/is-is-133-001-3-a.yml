section_title: Segurança em torno de helicópteros.
subsection_id: a
cite: 3(a)
title: 3(a)
text: 'a) embarque:

  i. fique longe da parte traseira do helicóptero;

  ii. agache-se antes de caminhar sob o rotor principal;

  iii. aproximação lateral ou frontal, mas nunca fora da linha de visão do piloto, e apenas
  quando o piloto ou o pessoal de solo em contato com o piloto autorizar;

  iv. segure firmemente em chapéus e artigos soltos;

  v. nunca alcance ou corra atrás de um chapéu ou outro objeto que se desprenda;

  vi. proteja seus olhos protegendo-os com as mãos ou semicerrando os olhos; e

  vii. se repentinamente cego por poeira ou um objeto soprado, pare, abaixe-se ou sente-se
  e espere ajuda. Não tente tatear ou encontrar o caminho em direção a ou para longe de um
  helicóptero;'
