section_title: Segurança em torno de helicópteros.
subsection_id: b
cite: 3(b)
title: 3(b)
text: 'b) briefing. O piloto ou seu designado deve fazer o briefing antes da decolagem (parágrafo
  133.47(c)(3)). O tipo de operação determinará que tipo de briefing é dado, mas o briefing
  deve sempre incluir:

  i. o uso e operação de cintos de segurança para decolagem, rota e pouso. Dê ênfase a como
  liberar o tipo específico de cinto de segurança instalado no helicóptero em particular.
  Os helicópteros nem sempre usam cintos do tipo automotivo; por exemplo, alguns cintos usam
  fivelas que giram para abrir;

  ii. a localização e o uso de equipamento de flutuação e outros equipamentos de sobrevivência
  que possam estar a bordo, e como e quando abandonar a aeronave se for necessário um pouso
  na água;

  iii. para voos em terrenos acidentados ou isolados, informe a todos os ocupantes onde os
  mapas e equipamentos de sobrevivência estão localizados;

  iv. instrua cada pessoa a bordo sobre as ações e precauções a serem tomadas durante uma
  emergência, e como e quando sair após o pouso em caso de emergência. Certifique-se de que
  os passageiros estejam cientes da localização de extintores de incêndio, dispositivos de
  sinalização pirotécnica, salva-vidas e outros equipamentos de sobrevivência. Explique a
  localização e os métodos de abertura normais e de emergência das portas. A Anac incentiva
  o uso de um diagrama ou exibição pictórica em um cartão de instruções ao passageiro;

  v. proibição de fumo a bordo e a menos de 15 m (50 pés) do helicóptero; e

  vi. as condições de pouso determinam o que as pessoas devem ouvir em um briefing de partida.
  Por exemplo, se estiver em uma colina, saia em declive. Se isso envolver caminhar ao redor
  do helicóptero, para evitar a área de menor altura do rotor, sempre dê a volta pela frente,
  nunca por trás. O operador pode produzir e adaptar diagramas para incluir em um cartão de
  instruções.'
