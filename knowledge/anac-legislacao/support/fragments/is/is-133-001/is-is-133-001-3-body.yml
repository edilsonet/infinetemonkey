text: '3. Segurança em torno de helicópteros.

  Instrua todas as pessoas que embarcarem em um helicóptero enquanto seus rotores estiverem
  girando sobre o meio mais seguro de fazê-lo. Se estiver nos controles, o piloto pode não
  ser capaz de conduzir um briefing de embarque. Portanto, a pessoa que providenciou o transporte
  do pessoal ou a pessoa designada como atendente da rampa deve fazer isso. Os procedimentos
  exatos podem variar ligeiramente de um modelo de helicóptero para outro, mas em geral, o
  seguinte deve ser suficiente:'
