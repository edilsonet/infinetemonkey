text: '4.1.1 Para os efeitos desta IS, são válidas as definições contidas nos RBAC nº 01,
  61, 91, 133 e na Resolução nº 659, de 2 de fevereiro de 2022.

  4.2 Lista de abreviaturas:

  Anac - Agência Nacional de Aviação Civil

  CG - Centro de Gravidade

  CHT - Certificado de Habilitação Técnica

  GTCE - Gerência Técnica de Certificação de Empresas

  HEC - Carga Externa Humana (Human External Cargo)

  IS - Instrução Suplementar

  IFR - Regras de Voo por Instrumentos

  IMC - Condições Meteorológicas por Instrumentos

  MVCAC - Manual de Voo da Combinação Aeronave-Carga

  RBAC - Regulamento Brasileiro de Aviação Civil

  RFM - Manual de Voo de Helicóptero (Rotorcraft Flight Manual)

  RFMS - Suplemento ao Manual de Voo de Helicóptero (Rotorcraft Flight Manual Supplement)

  SAE - Serviço Aéreo Especializado

  TCDS - Especificação de Tipo (Type Certificate Data Sheet)


  Descrição do processo de autorização

  5.1 Geral

  5.1.1 O processo de autorização (doravante simplesmente chamado de “processo”) é projetado
  para garantir que a organização solicitante (doravante simplesmente chamada de “organização”,
  “requerente” ou “solicitante”) atenda aos requisitos de autorização sob o RBAC nº 133. Se
  concluído de forma satisfatória, o processo resultará na emissão de uma Autorização de Operação
  de Aeronaves com Carga Externa.

  5.1.2 O processo possui cinco fases, com duração total média de 90 dias (dependendo da agilidade
  da apresentação e precisão dos documentos e respostas da organização requerente à Anac),
  cuja descrição resumida é:'
