title: 4.1.1(e)
text: 'e) Fase 5 - Emissão da autorização.

  5.2 Regime de portais de processo

  5.2.1 O processo adotado pela Anac impõe um regime de portais, ou seja, somente se pode
  considerar que uma fase esteja encerrada, o que possibilita passar à fase seguinte, caso
  todos os requisitos da fase tenham sido cumpridos.

  5.2.2 Se houver não-conformidades na documentação apresentada pela organização requerente,
  o processo será sobrestado até a regularização. Caso o requerente, a seu critério, retire
  a documentação, o cronograma para o cumprimento da fase específica apenas voltará a ser
  observado a partir do novo protocolo da apresentação da nova documentação.

  5.2.3 Se o requerente deixar de atender um ou mais requisitos anteriormente atendidos que
  lhe permitiram o prosseguimento de fase, o processo pode retornar à fase anterior até a
  satisfação dos referidos requisitos.

  5.2.4 Se a organização requerente fizer alterações nas características do processo em curso,
  o processo pode retornar a fases anteriores, dependendo da complexidade da alteração.

  5.3 Fases do processo de autorização'
