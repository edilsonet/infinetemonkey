cite: 4(b)
title: 4(b)
text: 'b) Para cada um dos pilotos envolvidos nas operações de helicópteros com carga externa,
  devem estar arquivados:

  i. habilitações do piloto;

  ii. histórico dos treinamentos pelos quais o piloto passou, tanto dos treinamentos providos
  pelo próprio operador quanto dos realizados em outras instituições;

  iii. currículo de cada piloto;

  iv. uma listagem das aeronaves, classes de combinação aeronave-carga e tipos de operação
  que o piloto está autorizado a realizar, bem como as datas em que o mesmo foi designado
  e exonerado de cada operação; e

  v arquivo das avaliações realizadas, excetuando-se os exames de proficiência para fins de
  emissão e/ou revalidação de CHT.'
