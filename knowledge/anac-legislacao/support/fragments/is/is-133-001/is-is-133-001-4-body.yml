text: '4. Conhecimento e habilidades.

  Nenhuma pessoa pode servir como piloto desta aeronave durante as operações com carga externa,
  a menos que essa pessoa tenha passado nos testes de conhecimento e habilidade exigidos pela
  seção 133.37 do RBAC nº 133 para a classe de operação que está sendo conduzida.'
