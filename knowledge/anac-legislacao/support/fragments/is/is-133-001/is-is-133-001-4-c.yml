title: 4(c)
text: 'c) Para operações com combinações classe D, também devem estar arquivados:

  i. histórico do treinamento descrito no Programa de Treinamento de Carga Externa; e

  ii. histórico das operações conduzidas em classe D nos últimos 12 (doze) meses, de modo
  a demonstrar que o piloto está corrente nestas operações.'
