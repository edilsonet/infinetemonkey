title: 4(d)
text: 'd) Para os demais tripulantes envolvidos nas operações de helicópteros com carga externa,
  devem estar arquivados:

  i. histórico dos treinamentos pelos quais o tripulante passou, tanto dos treinamentos providos
  pelo próprio operador quanto dos realizados em outras instituições;

  ii. currículo de cada tripulante; e

  iii. uma listagem das aeronaves, classes de combinação aeronave-carga e tipos de operação
  que o tripulante está autorizado a realizar, bem como as datas em que o mesmo foi designado
  e exonerado de cada operação.'
