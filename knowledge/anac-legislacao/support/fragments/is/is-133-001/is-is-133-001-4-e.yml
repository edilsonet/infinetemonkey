title: 4(e)
text: 'e) Para a equipe de solo envolvido nas operações de helicópteros com carga externa,
  devem estar arquivados:

  i. histórico dos treinamentos pelos quais cada indivíduo da equipe de solo passou, tanto
  dos treinamentos providos pelo próprio operador quanto dos realizados em outras instituições;
  e

  ii. currículos individuais da equipe de solo.'
