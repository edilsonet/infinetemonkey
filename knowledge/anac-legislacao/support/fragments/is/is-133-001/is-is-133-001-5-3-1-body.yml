title: Fase 1 - Solicitação prévia
text: '5.3.1 Fase 1 - Solicitação prévia

  5.3.1.1 É facultado à organização solicitar à Anac informações sobre o processo. Esta solicitação
  serve também para informar quanto a sua intenção de obter a autorização. Este contato inicial
  deverá ser feito por meio dos canais oficiais de comunicação, que podem ser acessados por
  meio do endereço eletrônico https://www.gov.br/anac/pt-br/canais_atendimento/fale-com-a-anac.
  Dentre as opções disponibilizadas, há o agendamento de reunião técnica virtual, por meio
  do endereço eletrônico: https://www.gov.br/anac/pt-br/canais_atendimento/reuniao-virtual.'
