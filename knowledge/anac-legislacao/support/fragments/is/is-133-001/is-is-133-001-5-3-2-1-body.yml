text: '5.3.2.1

  Retirada da previsão do preenchimento e protocolo do formulário disponível no site, para
  inclusão preenchimento de formulário específico diretamente no SEI.

  5.3.2.1.b

  Retirada a explicação sobre o preenchimento do formulário disponível no site, que foi substituído
  por formulário específico diretamente no SEI.

  5.3.2.1.d

  Inclusão da previsão de envio do currículo do piloto-chefe assistente.

  5.3.2.1.f

  Ajuste editorial - Retirada do termo "Externa" do nome por extenso do MVCAC. Inclusão do
  hífen no nome.'
