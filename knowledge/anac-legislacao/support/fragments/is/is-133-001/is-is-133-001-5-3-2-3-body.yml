text: '5.3.2.3 Caso haja erros ou omissões, o processo será sobrestado até a regularização
  e a organização requerente será informada das razões do sobrestamento.

  5.3.2.4 A Anac notificará a organização requerente sobre a aceitação da solicitação formal.
  A notificação da aceitação da solicitação formal é o ato que marca o encerramento da Fase
  2 do processo de autorização.'
