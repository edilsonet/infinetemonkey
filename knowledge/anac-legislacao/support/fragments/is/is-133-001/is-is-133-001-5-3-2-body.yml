text: '5.3.2 Fase 2 - Solicitação formal

  5.3.2.1 A solicitação formal de abertura do processo de autorização para operação de helicópteros
  com carga externa é a demonstração da real intenção da organização em obter tal autorização.
  A organização deve preencher o formulário específico e protocolar seu pedido diretamente
  pelo sistema de protocolo digital do SEI, endereçado à Gerência Técnica de Certificação
  de Empresas - GTCE. Além do formulário digital preenchido e assinado, a petição deve ser
  acompanhada das seguintes comprovações:

  Nota: o processo eletrônico da Anac está previsto na Resolução nº 520/2019, ou norma que
  venha a substituí-la, e maiores informações podem ser consultadas no seguinte endereço eletrônico:
  https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.'
