cite: 5.3.2(f)
title: 5.3.2(f)
text: 'f) caso o operador pretenda prestar serviços aéreos especializados de carga externa
  (e não somente operações privadas), plano de implementação do sistema de gerenciamento da
  segurança operacional (SGSO), incluído em manual de gerenciamento de segurança operacional
  (MGSO), elaborado segundo os requisitos constantes na Resolução nº 106, de 30 de junho de
  2009, ou o que venha a substituí-la, a ser analisado e aceito pela Anac. Caso o operador
  já possua um MGSO aceito, este pode ser adaptado à operação com carga externa.

  Nota: é esperado que os operadores desenvolvam seu MGSO contemplando capítulos dedicados
  às especificidades da operação de aeronaves com carga externa.

  5.3.2.2 Durante esta fase, a Anac conduz uma avaliação preliminar dos documentos apresentados,
  com o objetivo de verificar se todos os manuais e documentos requeridos foram entregues
  e se a organização requerente, ao elaborar tais manuais e documentos, abordou todos os aspectos
  relevantes dos regulamentos aplicáveis.'
