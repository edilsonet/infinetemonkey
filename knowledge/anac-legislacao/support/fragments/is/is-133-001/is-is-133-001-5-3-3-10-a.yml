section_id: 5.3.3.10
section_title: 'Programa de Treinamento Classe D (se aplicável): um programa de treinamento
  inicial e recorrente para a Classe D deve conter os seguintes elementos:'
subsection_id: a
cite: 5.3.3.10(a)
title: 5.3.3.10(a)
text: 'a) O treinamento de solo para pilotos deve incluir:

  i. revisão do conteúdo da autorização Classe D;

  ii. cálculo de peso e balanceamento longitudinal e lateral;

  iii. determinação de desempenho em voo pairado, com um motor inoperante e fora do efeito
  solo, considerando peso e condições ambientais (conforme parágrafo 133.45(e)(1) do RBAC
  nº 133);

  iv. revisão dos procedimentos de comunicação normais e de emergência, incluindo sinais manuais;

  v. revisão dos procedimentos de coordenação da tripulação;

  vi. revisão dos procedimentos de pré-voo para todos os equipamentos;

  vii. revisão dos requisitos do plano de área congestionada;

  viii. briefing de todas as pessoas envolvidas com a operação com carga externa;

  ix. utilização de dispositivos aprovados de elevação de pessoas;

  x. operação do guincho, incluindo peso, centro de gravidade longitudinal e lateral (CG),
  limitações operacionais, pré-voo, procedimentos normais e de emergência;

  xi. revisão de considerações, limitações e procedimentos de mitigação de risco para operações
  noturnas (se aplicável);

  xii. evitando colisões e obstáculos, e

  xiii. revisão de outras informações necessárias para garantir a competência do piloto. Por
  exemplo, para cada marca e modelo de helicóptero usado, examine o programa de treinamento
  para obter informações sobre o seguinte:

  1) principais sistemas de helicópteros;

  2) limitações do modelo do helicóptero;

  3) características de desempenho;

  4) consumo e gerenciamento de combustível;

  5) Manual de voo aprovado, MVCAC aprovado e suplementos aprovados;

  6) procedimentos para situações normais e de emergência;

  7) explicações das causas da perda de eficácia do rotor de cauda e procedimentos para recuperação;
  e

  8) evitando condições meteorológicas potencialmente perigosas.'
