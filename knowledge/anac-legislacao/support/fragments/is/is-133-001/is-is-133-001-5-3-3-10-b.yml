section_title: 'Programa de Treinamento Classe D (se aplicável): um programa de treinamento
  inicial e recorrente para a Classe D deve conter os seguintes elementos:'
subsection_id: b
cite: 5.3.3.10(b)
title: 5.3.3.10(b)
text: 'b) O treinamento de voo para pilotos que pretendam carregar uma carga simulada (lastro)
  no dispositivo de elevação de pessoal deve incluir:

  i. cálculo de peso e balanceamento longitudinal e lateral e planejamento de desempenho;

  ii. realização de decolagens e pousos;

  iii. manutenção do controle direcional no voo pairado;

  iv. aceleração a partir do voo pairado;

  v. execução de aproximações para pouso ou para áreas de trabalho;

  vi. operação do guincho, se equipado;

  vii. utilização de dispositivos de segurança que impeçam a liberação inadvertida da carga;

  viii. liberação da carga em caso de emergência;

  ix. voo pairado e manobra para pouso com um único motor;

  x. treinamento de voo noturno (se aplicável); e

  xi. evitando colisões e obstáculos.'
