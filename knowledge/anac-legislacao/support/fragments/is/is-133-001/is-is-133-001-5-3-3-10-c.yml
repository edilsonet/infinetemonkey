section_title: 'Programa de Treinamento Classe D (se aplicável): um programa de treinamento
  inicial e recorrente para a Classe D deve conter os seguintes elementos:'
subsection_id: c
cite: 5.3.3.10(c)
title: 5.3.3.10(c)
text: 'c) O treinamento em solo para o pessoal de apoio a bordo (por exemplo, operadores de
  guincho) deve incluir:

  i. revisão dos procedimentos de comunicação normais e de emergência, incluindo sinais manuais;

  ii. operação do guincho, incluindo peso e limitações operacionais, pré-voo, procedimentos
  normais e de emergência;

  iii. as partes apropriadas do MVCAC;

  iv. revisão dos procedimentos de coordenação da tripulação;

  v. execução de inspeção de pré-voo do equipamento de elevação;

  vi. utilização dos dispositivos de elevação de pessoal aprovados;

  vii. utilização dos equipamentos de segurança pessoal, como cintos, roupas e luvas;

  viii. reconhecimento do início de oscilações perigosas da carga;

  ix. reconhecimento de outras situações perigosas;

  x. considerações de operação noturna, limitações e procedimentos de mitigação de risco (se
  aplicável); e

  xi. evitando colisões e obstáculos.'
