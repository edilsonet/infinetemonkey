section_title: 'Programa de Treinamento Classe D (se aplicável): um programa de treinamento
  inicial e recorrente para a Classe D deve conter os seguintes elementos:'
subsection_id: d
cite: 5.3.3.10(d)
title: 5.3.3.10(d)
text: 'd) O treinamento de voo para o pessoal de apoio a bordo (por exemplo, operadores de
  guincho) que pretendam carregar uma carga simulada (lastro) deve incluir:

  i. operação do guincho, se equipado;

  ii. comunicação entre os membros da tripulação, incluindo sinais manuais, bem como procedimentos
  de comunicação normais e de emergência;

  iii. utilização de dispositivos de segurança que impeçam a liberação inadvertida da carga;

  iv. liberação da carga em caso de emergência;

  v. utilização de dispositivo de elevação de pessoal aprovado;

  vi. utilização de equipamentos de segurança pessoal, como cintos, roupas e luvas;

  vii. estabilização de cargas oscilantes no guincho;

  viii. treinamento de voo noturno (se aplicável); e

  ix. evitando colisões e obstáculos.'
