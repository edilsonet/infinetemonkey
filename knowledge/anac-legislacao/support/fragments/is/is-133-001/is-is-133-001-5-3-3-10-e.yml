section_id: 5.3.3.10
section_title: 'Programa de Treinamento Classe D (se aplicável): um programa de treinamento
  inicial e recorrente para a Classe D deve conter os seguintes elementos:'
subsection_id: e
cite: 5.3.3.10(e)
title: 5.3.3.10(e)
text: 'e) O treinamento de solo e de voo para o pessoal de solo (por exemplo, enganchadores
  e sinalizadores) que pretenda atuar com o transporte de uma carga simulada (lastro) deve
  incluir:

  i. revisão dos procedimentos de comunicação normais e de emergência, incluindo sinais manuais;

  ii. revisão dos procedimentos de coordenação da tripulação;

  iii. execução de inspeção de pré-voo do equipamento de elevação;

  iv. utilização de um dispositivo de elevação de pessoal aprovado;

  v. operação do guincho, incluindo limitações e procedimentos normais e de emergência;

  vi. as partes apropriadas do MVCAC;

  vii. reconhecimento de situações perigosas;

  viii. reconhecimento do início de oscilações perigosas da carga; e

  ix. uso de equipamentos de segurança pessoal, como capacetes, luvas e óculos de proteção.'
