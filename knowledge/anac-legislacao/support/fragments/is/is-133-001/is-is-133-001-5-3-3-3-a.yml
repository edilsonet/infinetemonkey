section_title: Gerenciamento da frota de aeronaves
subsection_id: a
cite: 5.3.3.3(a)
title: 5.3.3.3(a)
text: a) O suplemento aplicável a cada combinação aeronave-carga externa deve ser avaliado,
  em especial, quanto a sua aprovação e quanto as limitações. Por exemplo, se limitações operacionais,
  marcas ou placares previstos no Manual de Voo (RFM) ou Suplemento (RFMS) contiverem informações
  que proíbem o uso para transporte de carga externa humana (HEC), os operadores devem cumprir
  essas limitações de acordo com o parágrafo 91.9(a) do RBAC n° 91 (por exemplo, uma limitação
  RFMS tal como, “o gancho de carga é aprovado para carga não humana, apenas combinações aeronave-carga
  Classe B”). O RFM ou RFMS também pode incluir limitações adicionais indicando a autorização
  para HEC (por exemplo, "o sistema de carga externa atende aos requisitos de certificação
  do RBAC n° 27 para HEC").
