title: 5.3.3.3(b)
text: 'b) Transporte de carga externa com linha longa (long line): as operações de transporte
  de carga externa com linha longa, comumente chamadas de long line, são caracterizadas pelo
  uso de um cabo de comprimento superior a 30 metros, sendo que na sua ponta inferior há outro
  gancho de carga, onde é efetivamente conectada a carga a ser transportada. A combinação
  aeronave-carga deve ser tal que permita o alijamento tanto da carga transportada quanto
  do conjunto linha-carga como um todo. Os procedimentos de pilotagem diferem em muitos pontos
  da operação com linha curta, pois o piloto deve manter contato visual com a carga, de modo
  a controlá-la, e deve ser capaz de eliminar os movimentos pendulares característicos deste
  tipo de operação. A operação é realizada sem a porta do lado do piloto, o que pode implicar
  em penalização no desempenho do helicóptero. O apoio às operações sísmicas é comumente feito
  utilizando este tipo de operação.'
