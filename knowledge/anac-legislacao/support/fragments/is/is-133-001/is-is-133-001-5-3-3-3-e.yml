title: 5.3.3.3(e)
text: 'e) Descida de rapel:

  i. Este tipo de operação é um tipo especial de operação com carga externa, em que a carga
  externa é composta por pessoas e não pode ser transportada em movimento horizontal. A característica
  desta operação é a descida de pessoas, devidamente qualificadas, por um cabo, devendo ser
  utilizado equipamento adequado para tal. Esta descida deve ser executada com a aeronave
  em voo pairado e com a presença de um auxiliar a bordo, que será responsável pelo controle
  da operação. Deverá haver intercomunicação deste auxiliar com o piloto do helicóptero, para
  que tal controle seja efetivo.

  ii. O ideal é que tais operações sejam conduzidas com uma combinação aeronave-carga classe
  D; porém as operações com descida de rapel podem ser autorizadas com uma combinação aeronave-carga
  classe B. Para tanto, os seguintes itens devem ser verificados:

  1) a operação do helicóptero deve ser realizada com peso limitado a 90% do peso máximo de
  decolagem previsto para a combinação aeronave-carga;

  2) deverá haver um meio de alijamento rápido do equipamento de rapel durante a operação;
  e

  3) cada pessoa que for executar a descida de rapel somente a pode iniciar após receber a
  autorização do piloto em comando, feita por meio do intercomunicador com o auxiliar a bordo.'
