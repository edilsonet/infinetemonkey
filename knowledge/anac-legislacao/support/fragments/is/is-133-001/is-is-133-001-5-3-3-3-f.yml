title: 5.3.3.3(f)
text: 'f) Operação Tipo MCGUIRE (“MAGUARI”): este é outro tipo de operação especial de carga
  externa em que pessoas comporão a carga externa. Diferentemente das operações de descida
  de rapel, existe o deslocamento horizontal do helicóptero com pessoas fora da aeronave.
  As pessoas devem ter treinamento adequado, de modo a não desestabilizar o voo. Os operadores
  para os quais o RBAC nº 133 é aplicável não podem realizar este tipo de operação.'
