title: 5.3.3.3(h)
text: h) Caso um detentor de autorização não apresente a listagem solicitada pela Anac e/ou
  falhe em demonstrar que o seu processo de gerenciamento da frota está documentado e efetivo
  estará sujeito às sanções administrativas previstas na Resolução Anac nº 761 e 762/2025,
  conforme aplicável, incluindo o disposto na seção 133.13 do RBAC nº 133.
