cite: 5.3.3.3(i)
title: 5.3.3.3(i)
text: 'i) Caso o detentor de autorização deixe de possuir direitos de uso e operação sobre
  pelo menos uma aeronave de um determinado modelo e/ou com determinada autorização operacional
  por mais de 30 (trinta) dias, deve solicitar à Anac a revisão de sua autorização para retirada
  do modelo de aeronave ou para atualização das autorizações afetadas.

  5.3.3.4 Suplementos do Manual de Voo (RFMS): Cada aeronave do requerente deve possuir um
  Manual de Voo (RFM) e seus suplementos, que devem ter sido aprovados pela Autoridade de
  Aviação Civil competente. Para tanto, cabe lembrar que as aeronaves certificadas no Brasil
  devem ter seu RFM e o referido suplemento aprovados pela Anac. As aeronaves certificadas
  fora do Brasil devem ter seu RFM e o referido suplemento aprovados pela autoridade de aviação
  civil do país de certificação.'
