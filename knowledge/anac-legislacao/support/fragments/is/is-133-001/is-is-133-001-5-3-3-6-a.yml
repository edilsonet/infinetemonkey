title: 5.3.3.6(a)
text: a) Caso o piloto-chefe não tenha habilitação em todas as aeronaves, o requerente deve
  apresentar um ou mais pilotos habilitados nas aeronaves em que o piloto-chefe não seja habilitado,
  conforme descrito no parágrafo 133.21(a) do RBAC nº 133.
