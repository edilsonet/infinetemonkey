title: 5.3.3.6(b)
text: b) Requisito. A Seção 133.47 do RBAC n° 133 requer que o operador desenvolva um MVCAC.
  O parágrafo 133.47(a) do RBAC nº 133 exige que o MVCAC inclua as limitações operacionais,
  procedimentos (normais e de emergência), desempenho e outras informações estabelecidas segundo
  a subparte D desse RBAC. Isso inclui as informações estabelecidas durante as verificações
  operacionais de voo realizadas de acordo com a seção 133.41 do RBAC n° 133. O operador deve
  colocar no MVCAC limitações, procedimentos, desempenho e outras informações não incluídas
  no manual de voo do helicóptero (RFM) aprovado.
