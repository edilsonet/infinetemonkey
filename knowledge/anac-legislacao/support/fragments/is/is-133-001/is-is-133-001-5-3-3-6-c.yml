title: 5.3.3.6(c)
text: c) Conteúdo. A seção 133.47 do RBAC nº 133 descreve as instruções e especificações para
  o conteúdo do MVCAC. A Subparte G do RBAC nº 27 ou do RBAC n° 29, conforme o caso, exige
  o estabelecimento de limitações operacionais e outras informações necessárias para uma operação
  segura. O MVCAC fornece um meio de transmitir essas informações aos tripulantes.
