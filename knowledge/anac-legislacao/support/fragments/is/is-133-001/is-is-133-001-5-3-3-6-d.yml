text: d) Caso a Anac verifique que o piloto-chefe ou o(s) piloto(s) chefe assistente(s) designado(s)
  pelo requerente não atende, no todo ou em parte, às qualificações requeridas, deve informar
  oficialmente ao requerente, solicitando a designação de novo profissional ao respectivo
  cargo.
