title: 5.3.3.6(e)
text: 'e) A designação do piloto-chefe e piloto(s) chefe assistente(s) deve atender aos requisitos
  da seção 133.21 do RBAC n° 133. Esses aeronautas devem passar pelo teste de conhecimento
  e habilidade para operações com carga externa. A Anac pode considerar que o conhecimento
  e a habilidade do candidato são adequados, baseada em suas experiências prévias e no histórico
  de segurança em operações de carga externa de aeronaves de asas rotativas. Para isso, o
  piloto-chefe e o(s) piloto(s) chefe assistente(s) deve(m) ter passado previamente em um
  teste de conhecimento e habilidade para a mesma classe de operações de carga externa de
  aeronaves de asas rotativas.

  Nota: caso seja necessário administrar o teste de conhecimento e habilidade para o piloto-chefe
  e seus assistentes, ele será conduzido durante a fase de demonstração e inspeção.'
