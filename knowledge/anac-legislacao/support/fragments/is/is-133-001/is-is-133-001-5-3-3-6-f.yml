title: 5.3.3.6(f)
text: 'f) Conteúdo da Seção 1 - Limitações de operação

  i. Certificação - Informações sobre requisitos para operar helicópteros com carga externa,
  abordando necessidade de autorização da Anac e comprovação de competência do operador.

  ii. Pessoas a bordo - Informações sobre restrições para transporte de pessoas durante operações
  com carga externa, permitindo apenas funções essenciais e estabelecendo requisitos de segurança
  para operadores de guincho.

  iii. Operações em áreas congestionada (densamente povoada) - Informações sobre restrições
  para operações em áreas congestionadas, exigindo aprovação da Anac conforme plano específico
  desenvolvido pelo operador.

  iv. Conhecimentos e habilidades - Informações sobre requisitos para qualificação de pilotos
  em operações com carga externa, incluindo necessidade de aprovação em testes de conhecimento
  e habilidade conforme a classe de operação.

  v. Documentação necessária - Informações sobre documentação obrigatória a bordo durante
  operações com carga externa, incluindo autorização específica e manual de voo da combinação
  aeronave-carga.

  vi. Combinação aeronave-carga e velocidades - Informações sobre limites operacionais para
  peso e velocidade em combinações aeronave-carga, conforme classe da carga externa e especificações
  do fabricante.

  vii. Centro de Gravidade (CG) - Informações sobre requisitos para manutenção do centro de
  gravidade dentro dos limites de certificação da aeronave, incluindo cuidados específicos
  para combinações aeronave-carga Classe C.

  viii. Informações sobre outras limitações - Conforme seção 133.45 do RBAC nº 133, descrever
  as limitações das operações com combinações aeronave-carga, incluindo restrições de peso,
  centro de gravidade, velocidade, áreas de operação e requisitos específicos para Classe
  D, como certificação, capacidade de voo pairado, comunicação entre tripulantes e dispositivos
  de içamento aprovados com liberação de emergência.'
