text: 'h) Conteúdo da Seção 3 - Informações


  i. Geral - Introdução sobre os métodos para evitar acidentes durante as operações de carga
  externa.

  ii. Tripulantes e não tripulantes - Informações sobre treinamento e procedimentos para equipes
  envolvidas em operações com helicópteros - incluindo tripulantes, equipe de solo, pessoal
  de manutenção e sinalizadores de carga externa - abordando práticas seguras para embarque,
  manutenção, reabastecimento, manuseio de cargas externas, comunicação eficaz, uso de equipamentos
  de proteção e ações de emergência.

  iii. Segurança em torno de helicópteros - Informações sobre procedimentos seguros para embarque
  em helicópteros com rotores girando e orientações de briefing pré-voo, incluindo aproximação
  correta, uso de cintos de segurança, equipamentos de sobrevivência, ações em emergências
  e proibição de fumar, direcionadas a passageiros, pilotos e atendentes de rampa.

  iv. Arquivo operacionais - Informações sobre manutenção de arquivo operacional na base principal,
  contendo registros obrigatórios para pilotos, demais tripulantes e equipe de solo envolvidos
  em operações com carga externa, incluindo habilitações, histórico de treinamentos, currículos,
  autorizações, avaliações e histórico de operações específicas.

  v. Procedimentos de avaliação de pilotos - Informações sobre procedimentos para avaliação
  de conhecimento e habilidade dos pilotos, conduzida pelo piloto-chefe ou assistente quando
  autorizada pela Anac, seguindo os critérios da IS, com exigência de que o operador detalhe
  as particularidades do processo de avaliação aplicáveis ao operador.'
