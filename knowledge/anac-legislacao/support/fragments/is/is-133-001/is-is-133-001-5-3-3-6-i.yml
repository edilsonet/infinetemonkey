cite: 5.3.3.6(i)
title: 5.3.3.6(i)
text: i) Desenvolvimento de um MVCAC. O MVCAC deve cobrir cada classe de operação com carga
  externa conduzida com uma aeronave de asas rotativas específica. O operador deve preparar
  um MVCAC para que inclua cada aeronave de asas rotativas, mesmo que algumas marcas e modelos
  sejam semelhantes. O cálculo do fabricante dos dados de desempenho e limitações operacionais
  pode ser exclusivo para cada aeronave de asas rotativas. Um operador que planeja adicionar
  ou excluir uma classe de carga deve revisar o MVCAC adequadamente para refletir as considerações
  de segurança.
