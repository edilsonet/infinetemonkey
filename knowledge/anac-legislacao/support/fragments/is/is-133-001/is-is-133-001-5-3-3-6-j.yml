title: 5.3.3.6(j)
text: 'j) Aprovação. O requerente de uma autorização de operação de carga externa conforme
  RBAC nº 133 deve enviar uma cópia eletrônica do seu MVCAC para revisão e aprovação pela
  Anac. O requerente deve preparar o MVCAC em conformidade com a Subparte G do RBAC nº 27
  ou do RBAC nº 29, conforme o caso. Todas as não conformidades encontradas devem ser informadas
  ao requerente por meio de documento oficial. O MVCAC será, após todas as não conformidades
  serem corrigidas pelo requerente, aprovado pela Anac por meio de um documento de aprovação.

  5.3.3.7 Carta de designação do piloto-chefe e, se aplicável, do(s) piloto(s)-chefe(s) assistente(s)
  (conforme modelo disponível em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios):
  Após a emissão e aceitação da carta de designação, tanto o operador quanto o piloto-chefe
  ou piloto-chefe assistente devem assiná-la.

  5.3.3.8 Qualificação do piloto-chefe e piloto(s) chefe assistente(s): a Anac deve analisar
  tanto o piloto-chefe quanto o(s) piloto(s) chefe assistente(s) de carga externa quanto às
  suas habilitações e quanto ao(s) seu(s) currículo(s). Deverá ser verificado se este(s) possui(em),
  no mínimo, uma licença válida de piloto comercial ou de piloto de linha aérea, com as apropriadas
  qualificações em pelo menos uma das aeronaves que o requerente pretende empregar nas operações
  em pauta, emitida pela Anac.'
