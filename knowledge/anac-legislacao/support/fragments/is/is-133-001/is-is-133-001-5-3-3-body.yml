text: '5.3.3 Fase 3 - Análise da documentação

  5.3.3.1 O passo seguinte é a análise detalhada da solicitação e da documentação apresentada
  pelo requerente quanto ao seu conteúdo. Neste ponto do processo a Anac tem atenção especial
  aos tipos de operação requeridos, para determinar o que será exigido do requerente nas demonstrações
  e nos equipamentos. Todas as não-conformidades devem ser comunicadas oficialmente à empresa,
  a qual deve cuidar de corrigi-las e apresentar tais correções à Anac. Após a correção de
  todas as não-conformidades a Anac pode passar à fase seguinte, de auditorias e demonstrações.
  O detalhamento desta fase, bem como as instruções para sua realização, está abaixo especificado.'
