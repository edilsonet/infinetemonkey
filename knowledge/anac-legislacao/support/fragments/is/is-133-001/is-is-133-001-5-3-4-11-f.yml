title: 5.3.4.11(f)
text: 'f) documento de gerenciamento da frota.

  5.3.4.13 Arquivos operacionais: o requerente deve manter em sua base principal de operação
  um arquivo operacional, o qual deve conter as informações e os documentos relacionados neste
  item. Para cada um dos pilotos envolvidos nas operações de helicópteros com carga externa,
  devem estar arquivados:

  a. Habilitações do piloto;

  b. Histórico dos treinamentos pelos quais o piloto passou, tanto dos treinamentos providos
  pelo próprio operador quanto dos realizados em outras instituições;

  c. Currículo de cada piloto;

  d. Uma listagem das aeronaves, classes de combinação aeronave-carga e tipos de operação
  que o piloto está autorizado a realizar, bem como as datas em que ele foi designado e exonerado
  de cada operação;

  e. Arquivo das avaliações realizas, excetuando-se os exames de proficiência para fins de
  emissão e/ou revalidação de CHT;

  f. Para operações com combinações classe D, também devem estar arquivados:

  i. histórico do treinamento descrito no Programa de Treinamento de Carga Externa;

  ii. histórico das operações conduzidas em classe D nos últimos 12 (doze) meses, de modo
  a demonstrar que o piloto está corrente nestas operações.'
