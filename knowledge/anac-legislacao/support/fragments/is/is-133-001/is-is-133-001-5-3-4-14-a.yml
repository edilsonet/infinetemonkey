title: 5.3.4.14(a)
text: 'a) Teste de conhecimento. A critério da Anac, o teste pode ser oral ou escrito, devendo
  abranger pelo menos as seguintes áreas:

  i. o piloto deve ser capaz de descrever ou responder perguntas sobre procedimentos para
  inspeção pré-voo de aeronaves, meios de fixação e dispositivos de içamento de pessoal, se
  apropriado (parágrafo 133.23(b)(1));

  ii. o piloto deve ser capaz de realizar um levantamento preciso das áreas de voo a serem
  utilizadas, incluindo o local de coleta, a rota e o local de pouso. O piloto deve indicar
  que as rotas de aproximação e saída de cada local devem ser sobre o obstáculo mais baixo
  e na direção do vento predominante (parágrafo 133.23(b)(1));

  iii. o piloto deve ser capaz de calcular peso e balanceamento com ênfase em um CG lateral.
  O piloto também deve descrever corretamente como preparar a carga, verificar o cordame e
  anexar essa carga ao helicóptero (parágrafo 133.23(b)(1));

  iv. o piloto deve ser capaz de identificar os diferentes tipos de correias, cordas de náilon,
  cadeiras, manilhas e elos de conexão. O piloto deve ter um conhecimento geral da capacidade
  de levantamento de peso e da amarração de cada um (parágrafo 133.23(b)(2));

  v. para autorizações de Classe D, o piloto deve saber como operar o dispositivo de içamento
  de pessoal e estar ciente de suas limitações (parágrafo 133.23(b)(2));

  vi. o piloto deve ter profundo conhecimento e compreensão da capacidade de desempenho, procedimentos
  operacionais e limitações do helicóptero a ser usado. O piloto deve ser capaz de calcular
  o desempenho do peso bruto ajustado quando a temperatura e / ou altitude-densidade muda
  (parágrafo 133.23(b)(3));

  vii. o piloto deve demonstrar compreensão dos sinais manuais da tripulação de solo, pois
  a comunicação entre a tripulação de voo e a tripulação de solo é crítica para garantir a
  segurança das pessoas no solo e no helicóptero. A autorização de Classe D requer comunicação
  de rádio entre os tripulantes de voo e de solo, e, se apropriado, o piloto deve demonstrar
  que está familiarizado com a fraseologia padrão de rádio e com a fraseologia desenvolvida
  para a operação (parágrafo 133.23(b)(4));

  viii. o piloto deve ter conhecimento completo de todo o MVCAC aprovado;

  ix. o pessoal de apoio pode passar por avaliação visando verificar o nível de conhecimento,
  treinamento e padronização das pessoas envolvidas diretamente na operação, tanto em solo
  quanto a bordo. Do mesmo modo que a verificação de conhecimentos dos pilotos, a verificação
  de conhecimentos do pessoal de apoio pode ser realizada oralmente ou por escrito. Os assuntos
  que devem ser abordados são os assuntos relacionados à boa condução da operação e aos procedimentos
  de emergência, não deixando de lado a operação de quaisquer equipamentos necessários à operação;
  e

  x. quando todos os requisitos são satisfeitos, o teste de habilidade é realizado.'
