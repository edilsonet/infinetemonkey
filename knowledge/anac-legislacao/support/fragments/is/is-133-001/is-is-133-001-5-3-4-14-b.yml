title: 5.3.4.14(b)
text: b) Teste de habilidade. O piloto deve executar com êxito as operações de voo para a
  classe de carga apropriada no helicóptero para o qual a autorização é solicitada. Para fins
  de demonstração de habilidade, o peso da carga externa, incluindo os meios de fixação da
  carga externa, deve ser o peso máximo para o qual a autorização é solicitada. A Anac pode
  optar por conduzir o teste de habilidade no helicóptero com o candidato ou observar do solo.
  Os itens a serem avaliados encontram-se nos parágrafos 133.23(c) e 133.33(c) do RBAC nº
  133.
