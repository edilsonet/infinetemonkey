title: 5.3.4.14(c)
text: 'c) Cada dispositivo de liberação rápida deve ter sido aprovado conforme o parágrafo
  133.43(b) do RBAC nº 133.

  5.3.4.15 Testes de conhecimento e habilidade. Os testes de conhecimentos e habilidades requeridos
  pelas seções 133.23 e 133.37 do RBAC nº 133 serão administrados, a menos que a Anac considere,
  baseada na experiência prévia e no histórico de segurança do requerente (ou de seu piloto-chefe)
  em operações com cargas externas, que seus conhecimentos e habilidades são adequados. A
  experiência prévia e o histórico de segurança devem ter sido para a mesma classe de carga
  externa e para a mesma marca e modelo de helicóptero.'
