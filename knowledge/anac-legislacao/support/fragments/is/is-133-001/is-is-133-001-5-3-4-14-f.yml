title: 5.3.4.14(f)
text: f) Antes da realização das demonstrações, deve ocorrer um briefing com os pilotos a
  serem avaliados, para passar informações sobre a execução das demonstrações. Antes de encerrar
  tal reunião, o servidor designado deve certificar-se que todos compreenderam as instruções
  e estão cientes do que realizarão.
