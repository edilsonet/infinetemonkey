title: 5.3.4.14(g)
text: 'g) Para uma carga externa de Classe A, o teste de habilidade deve consistir no seguinte:

  i. antes da decolagem, o piloto deve fazer uma verificação de segurança e amarração adequada
  da carga;

  ii. o helicóptero e a carga devem ser içados a uma altitude de voo pairado apropriada, onde
  o piloto determina se a potência está disponível para a decolagem;

  iii. durante um voo pairado, o piloto deve demonstrar que o controle direcional adequado
  está disponível, fazendo mudanças de rumo de 180 graus para cada lado da rota de decolagem
  proposta;

  iv. o piloto deve demonstrar uma aceleração suave de um voo pairado para um voo ascendente
  para a frente. Potência suficiente, que não exceda o máximo permitido, deve ser aplicada
  na decolagem para garantir que a aeronave ultrapasse o obstáculo imediato mais alto com
  segurança; e

  v. o piloto deve demonstrar voo horizontal na velocidade operacional máxima para a qual
  a autorização foi requerida.'
