cite: 5.3.4.14(h)
title: 5.3.4.14(h)
text: 'h) Para uma carga externa de Classe B, o teste de habilidade deve consistir no seguinte:

  i. durante o pré-voo, o piloto deve demonstrar que as funções elétricas e manuais do sistema
  de fixação do helicóptero operam corretamente;

  ii. antes da decolagem, o piloto deve fazer uma verificação de segurança e amarração adequada
  da carga;

  iii. o piloto deve demonstrar a captura da carga externa. A carga deve ser levantada lentamente
  em uma subida vertical até que a linha fique esticada e centralizada. A carga é então elevada
  a uma altitude de pairado apropriada, onde o piloto determina se a potência está disponível
  para a decolagem;

  iv. a aproximação para a carga deve ser feita em coordenação com o sinalizador;

  v. a ascensão somente pode ser iniciada com a sinalização correspondente do sinalizador;

  vi. durante a ascensão vertical, a carga não pode ser arrastada em solo, devendo subir tão
  verticalmente quanto possível;

  vii. ao pairar, o piloto deve demonstrar que o controle direcional adequado está disponível,
  fazendo mudanças de rumo de 180 graus para cada lado da rota de decolagem proposta;

  viii. o piloto deve demonstrar uma aceleração suave de um voo pairado para um voo ascendente
  para a frente. Potência suficiente, que não exceda o máximo permitido, deve ser aplicada
  na decolagem para garantir que a carga ultrapasse o obstáculo imediato mais alto com segurança;

  ix. o piloto deve demonstrar voo horizontal na velocidade para a qual a autorização foi
  requerida. À medida que a velocidade aumenta, as cargas leves de baixa densidade geralmente
  tendem a se deslocar mais para trás e podem se tornar instáveis. Quando a carga é de maior
  densidade, mais compacta e mais bem equilibrada, a viagem é mais estável e a velocidade
  no ar pode ser aumentada com segurança. Qualquer carga instável pode flutuar, oscilar ou
  girar, resultando na redução do controle da aeronave e estresse indevido no helicóptero.
  Uma redução na velocidade para a frente geralmente permitirá a recuperação do controle da
  aeronave e estabilização da carga. Se a carga começar a oscilar para frente e para trás
  ou tremulando, é especialmente importante que a velocidade do helicóptero seja reduzida;

  x. o piloto deve manobrar a carga externa para a posição de liberação e liberá-la, em condições
  normais de voo, usando os controles normais e, se possível, de liberação de emergência;

  xi. a colocação da carga deve ser feita em um alvo previamente demarcado, cujas dimensões
  lineares não excedam 150% das dimensões lineares da projeção horizontal da carga;

  xii. nas operações em linha longa, o piloto deve efetuar o voo normal com a linha e a carga
  conectada e, também, com a linha sozinha;

  xiii. ainda nas operações com linha longa, o piloto deve demonstrar ser capaz de eliminar
  o movimento pendular da carga;

  xiv. o piloto deve demonstrar a operação do guincho se um guincho for usado para levantar
  as cargas externas. O piloto e o operador do guincho, se apropriado, devem operar o guincho
  durante o teste. Sempre que a localização ou função da chave de punho cíclico for modificada,
  o piloto deve demonstrar a capacidade de acionar a chave em operações normais e emergências
  simuladas sem ter que assumir uma posição incomum do dedo ou polegar que pode induzir entrada
  de controle indesejada; e

  xv. operações de combate a incêndios: na demonstração da operação de combate a incêndios
  com uso de recipiente apropriado (water bucket), além dos itens descritos acima, deve ser
  observada a habilidade do piloto em liberar a água no local certo, que pode ser simulado
  por um alvo previamente demarcado, e na captação da água, que será demonstrada inteiramente.
  No caso do uso de linha curta, o pouso com o recipiente conectado deve ser avaliado também
  (o piloto deve encostar o recipiente no solo e pousar o helicóptero deslocando-se para trás,
  com o recipiente à sua frente e à sua vista).'
