cite: 5.3.4.14(i)
title: 5.3.4.14(i)
text: 'i) Para uma carga externa de Classe C, o teste de habilidade deve consistir no seguinte:

  i. o piloto deve fazer uma verificação pré-voo das funções elétricas e mecânicas do sistema
  de fixação do helicóptero;

  ii. o piloto deve levantar uma parte da carga se a intenção for arrastá-la, ou levantar
  toda a carga se for lastro para uma operação de esticamento de fios, colocação de cabos,
  ou operações similares;

  iii. o piloto deve demonstrar voo lateral (deslocamento lateral) com velocidade, controle
  de rumo e suavidade adequados;

  iv. se o operador planeja rebocar (barcos, barcaças), o piloto deve demonstrar voo para
  frente; e

  v. se um guincho for instalado, o piloto ou operador de guincho deve demonstrar seu uso.'
