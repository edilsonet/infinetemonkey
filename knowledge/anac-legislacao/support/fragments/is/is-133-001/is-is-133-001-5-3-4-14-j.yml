title: 5.3.4.14(j)
text: 'j) Para verificações de voo de autorização de carga de Classe D, o piloto deve demonstrar
  as mesmas manobras indicadas para Classe B, incluindo operações de guincho, se aplicável.
  O teste deve incluir pegar uma carga fictícia, mover essa carga para uma área predeterminada
  e liberar a carga em circunstâncias normais.

  5.3.4.16 Resultados das inspeções e testes. Todas as não-conformidades devem ser comunicadas
  oficialmente ao requerente, o qual deve cuidar da sua correção. Caso alguma demonstração
  em voo seja julgada não-satisfatória pela Anac, isto também deve ser comunicado oficialmente
  ao requerente. A critério da Anac, pode ser agendada nova demonstração.'
