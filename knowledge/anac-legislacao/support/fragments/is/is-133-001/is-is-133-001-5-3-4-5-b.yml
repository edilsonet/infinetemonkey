section_title: 'Para a etapa de demonstrações documentais, a empresa requerente será solicitada
  a enviar a seguinte lista não exaustiva de evidências:'
subsection_id: b
cite: 5.3.4.5(b)
title: 5.3.4.5(b)
text: 'b) aeródromo: devem ser enviadas evidências fotográficas do aeródromo utilizado pela
  empresa, incluindo controle de acesso, pistas de pouso e decolagem, pista de táxi, pátio
  de manobra, hangares, e demais facilidades utilizadas;'
