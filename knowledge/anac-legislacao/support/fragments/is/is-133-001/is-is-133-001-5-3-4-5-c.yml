section_title: 'Para a etapa de demonstrações documentais, a empresa requerente será solicitada
  a enviar a seguinte lista não exaustiva de evidências:'
subsection_id: c
cite: 5.3.4.5(c)
title: 5.3.4.5(c)
text: 'c) aeronave: devem ser encaminhadas evidências fotográficas que mostrem a matrícula
  e a inscrição "SAE", placas de identificação à prova de fogo, conforme requerido pela seções
  45.11, 45.12-I, 45.13 e pela Subparte C do RBAC nº 45, bem como demais equipamentos;'
