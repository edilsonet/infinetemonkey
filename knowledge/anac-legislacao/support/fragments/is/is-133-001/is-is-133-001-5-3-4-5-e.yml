section_title: 'Para a etapa de demonstrações documentais, a empresa requerente será solicitada
  a enviar a seguinte lista não exaustiva de evidências:'
subsection_id: e
cite: 5.3.4.5(e)
title: 5.3.4.5(e)
text: 'e) controle operacional: devem ser encaminhadas evidências fotográficas e/ou documentais
  de ferramentas de controle de tripulação e aeronaves (planilhas de Excel, quadros, etc.),
  ferramentas para planejamento de voo, exemplos de planejamentos de voo (plano de voo, peso
  e balanceamento, rotas, etc.) de operações representativas do tipo de modalidade solicitada
  pelo requerente;'
