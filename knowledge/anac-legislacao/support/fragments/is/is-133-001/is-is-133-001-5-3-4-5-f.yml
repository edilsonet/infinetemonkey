subsection_id: f
cite: 5.3.4.5(f)
title: 5.3.4.5(f)
text: 'f) SGSO: quando aplicável, devem ser encaminhadas evidências documentais das ferramentas
  de informática, equipamentos de comunicação, relatórios, reuniões periódicas, que mostrem
  que o requerente tem condições de implementar o SGSO de acordo com a Resolução nº 106, de
  30 de junho de 2009; e'
