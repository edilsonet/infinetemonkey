text: '5.3.4.6 A Anac pode complementar ou reduzir a lista de evidências dependendo da complexidade
  das operações pretendidas, do porte e do histórico do operador.

  5.3.4.7 Para a etapa de demonstrações operacionais e entrevistas por videoconferência, a
  empresa requerente será solicitada a informar datas disponíveis para agendamento de vídeo
  conferência com a participação do pessoal de administração chave da empresa. Nessa oportunidade,
  serão realizadas entrevistas com o objetivo de realizar verificações adicionais sobre o
  cumprimento de requisitos previstos na legislação aplicável a cada classe de combinação
  aeronave-carga.

  5.3.4.8 A critério da Anac, dependendo das classes de combinação aeronave-carga solicitadas,
  poderão ser definidos procedimentos para o agendamento de demonstração real da operação,
  na modalidade à distância, por plataforma de videoconferência.

  5.3.4.9 Para a etapa de inspeções e demonstrações presenciais, a empresa requerente será
  solicitada a informar datas disponíveis para agendamento de uma inspeção in loco nas dependências
  do operador, ou nos locais de operação, dependendo das classes de combinação aeronave-carga
  solicitadas e das características da empresa.

  5.3.4.10 O agendamento das inspeções e demonstrações remotas ou presenciais dos itens anteriores
  se dará de acordo com a disponibilidade e conveniência da empresa requerente e da equipe
  de servidores da Anac.'
