title: Fase 4 - Auditorias e demonstrações
text: '5.3.4 Fase 4 - Auditorias e demonstrações

  5.3.4.1 A fase de auditorias e demonstrações visa verificar o atendimento às seções 133.23,
  133.41, 133.43 e 133.45 do RBAC nº 133. Nesta fase não se inclui a vistoria na aeronave
  (se necessária), a qual deve ser feita antes da auditoria e cuja realização é responsabilidade
  total do requerente. Alternativamente, pode a auditoria ser dividida em duas etapas, a critério
  da Anac, para a verificação de aspectos referentes à área de aeronavegabilidade e à área
  de operações. A Fase 4 pode ser documental, à distância, presencial, ou uma combinação dessas
  modalidades.

  5.3.4.2 A fase de inspeções e demonstrações previstas para o processo será composta por
  3 etapas distintas, sendo prerrogativa da Anac determinar, ao longo do processo quais etapas
  serão aplicáveis em cada processo considerando fatores como, mas não limitados a: porte
  da empresa requerente, modelos das aeronaves envolvidas, das classes de combinação aeronave-carga
  solicitadas, histórico do requerente e/ou do pessoal de administração, desempenho do requerente
  ao longo do processo, entre outros.

  5.3.4.3 Ao final da análise dos documentos, a Anac informará a organização requerente sobre
  as etapas aplicáveis, bem como as evidências que serão solicitadas durante a fase de inspeções
  e demonstrações.'
