text: '5.3.5.2

  Inclusão do item mencionando a obrigatoriedade das empresas SAE possuirem a portaria para
  a exploração dos serviços aéreos especializados, conforme previsto na resolução 659/2002.

  6.1.1.4.a

  Retirada da previsão do preenchimento e protocolo do formulário disponível no site, para
  inclusão preenchimento de formulário específico diretamente no SEI.'
