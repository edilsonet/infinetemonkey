title: Fase 5 - Emissão da autorização
text: '5.3.5 Fase 5 - Emissão da autorização

  5.3.5.1 No momento em que as demonstrações tiverem sido consideradas satisfatórias e todos
  os demais itens tiverem sido atendidos, a autorização para operação com carga externa pode
  ser emitida. A Anac deve detalhar todas as informações importantes na referida autorização.

  5.3.5.2 Caso o operador pretenda prestar serviços aéreos especializados de carga externa
  (e não somente operações privadas), deverá existir portaria que torna público o cumprimento
  dos requisitos para a exploração do serviço aéreo, conforme previsto na Resolução nº 659/2022.
  A portaria abrange qualquer modalidade de SAE autorizada para o operador. Assim, se o operador
  já era autorizado a prestar outra modalidade de SAE, não é necessária emissão de nova portaria;
  por outro lado, se é a primeira autorização, deverá ser emitida a portaria para conclusão
  do processo.

  Nota: somente após a publicação da Portaria no Diário Oficial da União, a empresa poderá
  dar início à prestação dos serviços aéreos especializados.

  5.3.5.3 A autorização tem a validade expirando no final do vigésimo quarto mês subsequente
  ao mês em que foi emitida, conforme estabelecido na seção 133.13 do RBAC nº 133. O operador
  deve, com antecedência mínima de 60 (sessenta) dias, solicitar renovação da autorização,
  de acordo com o disposto no item 6.3 desta IS.'
