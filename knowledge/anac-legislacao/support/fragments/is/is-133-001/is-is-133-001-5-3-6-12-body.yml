text: '5.3.6.12 Em caso de não recepção do recurso, o requerente será comunicado sobre a decisão
  e ratificação de indeferimento e arquivamento do processo.

  5.3.6.13 Caso exista interesse da organização requerente, esta deve dar início a um novo
  processo, que será conduzido em conformidade com os procedimentos apresentados nesta IS.

  5.3.6.14 Não serão aproveitados quaisquer atos praticados no curso do processo encerrado,
  embora não sejam vedados ao requerente a apresentação e o aproveitamento do conteúdo dos
  manuais, programas, documentos e informações apresentados no processo encerrado, desde que
  devidamente atualizados.

  5.3.6.15 As ações requeridas em relação a aeronaves, cujos atos já tenham sido concluídos
  pelo Registro Aeronáutico Brasileiro, antes do indeferimento do processo, ficam desobrigadas
  no novo processo.


  Modificações, revogação e renovação

  6.1 Modificações

  Quaisquer modificações que venham a ser realizadas pelo operador devem ser previamente solicitadas
  à Anac que adotará os procedimentos de acordo com cada caso. Sugere-se, para tal, uma antecedência
  mínima de 30 (trinta) dias no caso de qualquer inclusão e/ou de exclusão de informações.
  A validade de uma autorização alterada permanece a mesma da autorização original.'
