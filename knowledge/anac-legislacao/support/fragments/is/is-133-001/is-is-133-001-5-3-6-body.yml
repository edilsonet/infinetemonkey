title: Encerramento compulsório do processo de autorização
text: '5.3.6 Encerramento compulsório do processo de autorização

  5.3.6.1 Caso seja considerado pela Anac que o processo contém não-conformidade insanável,
  após a avaliação preliminar ou análise, independentemente do número de iterações, o processo
  será indeferido e arquivado compulsoriamente, e o requerente formalmente comunicado.

  5.3.6.2 Para cada manual, programa ou documento, caso uma proposta seja rejeitada pela 3ª
  vez durante a análise, o processo relacionado a essa proposta será indeferido e arquivado
  compulsoriamente, independentemente do prazo.

  5.3.6.3 Nos casos em que a rejeição de um documento, manual ou programa for motivada pela
  atualização de um regulamento, publicação técnica do fabricante ou autoridade de aviação
  civil, ou qualquer documento de referência para análise do material, não haverá contabilização
  dessa iteração para fins de arquivamento do processo específico.

  5.3.6.4 Quando o arquivamento de um determinado manual ou programa, conforme descrito no
  parágrafo anterior, ocorrer 2 (duas) vezes durante o processo de autorização, este será
  indeferido e arquivado compulsoriamente, independentemente do prazo.

  5.3.6.5 Caso a demonstração da execução de um determinado procedimento ou operação, bem
  como testes de validação, seja rejeitada pela 3ª vez por não-conformidade ou incapacidade
  de demonstração por parte do requerente, o processo será indeferido e arquivado compulsoriamente,
  independentemente do prazo.

  5.3.6.6 A organização requerente de uma autorização terá sempre o prazo de 90 (noventa)
  dias para apresentar as ações requeridas durante qualquer fase do processo ou às respostas
  a cada comunicação de não-conformidade.

  5.3.6.7 A não observância do prazo de 90 (noventa) dias, ou outro prazo eventualmente definido,
  sem qualquer manifestação por parte do requerente para a apresentação das ações requeridas,
  caracterizará desistência e ensejará o encerramento do processo.

  5.3.6.8 A descontinuidade ou desistência do processo, em qualquer de suas fases, implicará
  o seu indeferimento e arquivamento, inclusive de processos correlatos, tornando nula qualquer
  autorização que já tenha sido concedida pela Anac durante o processo.

  5.3.6.9 Um processo encerrado não pode ser reaberto, tampouco documentos contidos nele podem
  ser reutilizados, salvo por decisão de reconsideração, assegurado o direito de ampla defesa
  e do contraditório.

  5.3.6.10 Para as decisões da Anac, é assegurado ao requerente o direito de ampla defesa
  e do contraditório. Os recursos devem ser direcionados à autoridade que emitiu a decisão,
  que pode remetê-los às instâncias superiores.

  5.3.6.11 O prazo para a apresentação de recurso contra as decisões da Anac, é de 10 dias
  a contar da ciência da decisão, conforme previsto na Lei nº 9.784/99 (Lei do processo administrativo).'
