text: '5. Procedimentos de avaliação de pilotos

  A avaliação de conhecimento e habilidade dos pilotos, quando autorizado pela Anac, será
  efetuada pelo piloto-chefe ou por um piloto-chefe assistente. Serão adotados os procedimentos
  previstos no item 6.1 da IS.

  [Descreva particularidades do processo de avaliação aplicáveis à empresa]

  Seção 4. Anexos

  [Anexo ao manual devem estar os modelos de formulários utilizados pelo operador, os documentos
  que comprovem a certificação dos meios de fixação, os sinais manuais utilizados na operação
  e qualquer outro documento que o operador utilize em sua rotina.]'
