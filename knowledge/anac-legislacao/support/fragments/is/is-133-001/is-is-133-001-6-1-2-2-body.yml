text: '6.1.2.2 e 6.1.2.2.a

  Ajuste do título e retirada da previsão do preenchimento e protocolo do formulário disponível
  no site, para inclusão preenchimento de formulário específico diretamente no SEI.

  6.1.3.2.a

  Retirada da previsão do preenchimento e protocolo do formulário disponível no site, para
  inclusão preenchimento de formulário específico diretamente no SEI.

  6.1.3.2.b

  Alteração do texto, visando solicitar as informações dos pilotos-chefes Assistentes, excluindo
  o termo pilotos auxiliares.

  6.1.4.2.a

  Retirada da previsão do preenchimento e protocolo do formulário disponível no site, para
  inclusão preenchimento de formulário específico diretamente no SEI.

  6.1.4.2.c

  Retirada do termo "auxiliares".

  6.1.5, 6.1.5.1 e 6.1.5.2

  Inclusão do termo "piloto-chefe assistente", único piloto com nome na autorização passível
  de remoção.

  6.1.5.2.a

  Retirada da previsão do preenchimento e protocolo do formulário disponível no site, para
  inclusão preenchimento de formulário específico diretamente no SEI.

  6.1.5.2.b

  Previsão para preenchimento do(s) modelo(s) de aeronave(s) que será(ão) removido(s) diretamente
  no formulário específico no SEI.

  6.1.5.2.c

  Previsão para preenchimento do(s) nome(s) do(s) piloto(s)-chefe assistente(s) que será(ão)
  removido(s) diretamente no formulário específico no SEI.'
