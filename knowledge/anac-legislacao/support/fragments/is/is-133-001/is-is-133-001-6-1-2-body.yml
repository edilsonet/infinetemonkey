title: Inclusão de piloto-chefe assistente.
text: '6.1.2 Inclusão de piloto-chefe assistente.

  6.1.2.1 A inclusão de um piloto-chefe assistente, sem que haja a inclusão de aeronave ou
  de tipo de operação, deve ser feita com a avaliação dos seus conhecimentos e habilidades.
  Para tanto, devem ser seguidas as orientações contidas no item 5.3.4.15. A Anac poderá autorizar
  que a avaliação seja realizada pelo piloto-chefe, desde que haja solicitação formal no peticionamento.
  Após a autorização, a Ficha de Avaliação de Habilidades (conforme modelo disponível em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios)
  e as anotações do teste de conhecimentos deverão ser encaminhadas à Agência.'
