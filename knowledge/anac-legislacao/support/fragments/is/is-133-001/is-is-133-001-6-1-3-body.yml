title: Inclusão de tipo de operação
text: '6.1.3 Inclusão de tipo de operação

  6.1.3.1 A inclusão de um ou mais tipos de operação pode tornar necessário fazer o processo
  completo, somente para o tipo de operação pretendido. Quaisquer diferenças no processo poderão
  ser autorizadas, a critério da Anac.'
