title: 6.1.5.2(b)
text: 'b) currículo dos piloto-chefe a ser alterado, com comprovantes de treinamentos e de
  habilitações.

  6.1.5.3 O candidato a piloto-chefe deverá ser submetido a avaliação teórica e prática por
  servidor da Anac conforme seção 136.23 do RBAC nº 133. Caso a Anac julgue pertinente, poderá
  dispensar esta avaliação, de acordo com o parágrafo 133.23(d) do RBAC nº 133.

  6.2 Revogação ou suspensão da autorização

  6.2.1 A suspensão da autorização pode ocorrer a qualquer momento, desde que julgado necessário
  pela Anac para garantir a segurança de voo ou em decorrência de contínuo descumprimento
  da regulamentação em vigor ou por solicitação do operador.

  6.2.2 O prazo da suspensão é indeterminado, não podendo ser superior a 180 (cento e oitenta)
  dias, podendo ser prorrogada uma vez por igual período. Após esse período, caso as condições
  que levaram a suspensão não sejam sanadas, a Anac iniciará o processo de revogação.'
