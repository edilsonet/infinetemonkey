text: '6.2.3 A revogação da autorização ocorrerá a critério da Anac, que informará ao operador
  os motivos que levaram a essa revogação.

  6.2.4 Caso o operador, por outras razões, resolva descontinuar as operações durante a validade
  da autorização, deverá informar à Anac, que adotará as devidas providências para a revogação.

  6.2.5 O operador poderá solicitar a suspensão de sua autorização, sendo o processo de revogação
  deste tipo de suspensão avaliado caso a caso, podendo ser levado em conta o tempo que o
  operador ficou suspenso.

  6.3 Renovação da autorização

  6.3.1 A renovação da autorização deve ser solicitada pelo operador à Anac, sendo que, no
  caso de não requerer alguma modificação, não necessitará repetir todas as informações sobre
  a operação realizada. O operador deve verificar o prazo mínimo de 60 (sessenta) dias antes
  da data de expiração da validade da autorização. Caso a solicitação não seja feita neste
  prazo, pode ocorrer de a validade expirar durante o processo de renovação, caso em que o
  operador deve interromper toda a sua operação com carga externa até a emissão da nova autorização.'
