title: 6.3.5(b)
text: 'b) Ficha de Avaliação de Habilidades e as anotações referentes aos últimos testes vigentes
  de conhecimentos dos pilotos.


  Orientações especiais para Classe “D” e IFR

  7.1 Geral

  7.1.1 A pessoa ou empresa que requerer a autorização para operar segundo o RBAC nº 133 com
  uma combinação aeronave-carga externa classe D deve apresentar à Anac uma descrição completa
  da operação pretendida, os cuidados a serem tomados durante a operação e os motivos pelos
  quais tal operação é necessária. Caso venha a requerer mais de um tipo de operação classe
  D, deve apresentar estes dados para cada um dos tipos.

  7.1.2 As operações de aeronaves com cargas externas realizadas com uma combinação aeronave-carga
  não enquadrada nas classes A, B ou C são consideradas classe D, devendo ser analisadas caso
  a caso pela Anac. Adicionalmente aos requisitos apresentados anteriormente nesta IS, o requerente
  deve cumprir alguns itens a mais, específicos para operações classe D.'
