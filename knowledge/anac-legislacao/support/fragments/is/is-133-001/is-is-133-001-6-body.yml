text: '6. Combinação aeronave-carga.

  O peso total deste helicóptero e combinação de carga não pode exceder: _____________


  Fabricante e modelo __________________________ Matrícula _________________


  Peso máximo da carga Classe A ________ # não pode exceder o peso bruto máximo de _________

  Velocidade máxima a frente (em nós) ____________ Outros ___________________


  Fabricante e modelo __________________________ Matrícula _________________

  Peso máximo da carga Classe B ________ # não pode exceder o peso bruto máximo de _________

  Velocidade máxima a frente (em nós) ____________ Outros ___________________

  Nota: tenha muito cuidado ao transportar cargas externas Classe B, pois o tamanho e a forma
  da carga podem afetar a capacidade de controle.


  Fabricante e modelo __________________________ Matrícula _________________

  Peso máximo da carga Classe C ________ # não pode exceder o peso bruto máximo de _________

  Velocidade máxima a frente (em nós) ____________ Outros ___________________'
