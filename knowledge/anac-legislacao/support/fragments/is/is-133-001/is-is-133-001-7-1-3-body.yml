text: '7.1.3 Operar sob regras de voo por instrumentos também requer cuidados adicionais,
  os quais também estão descritos neste capítulo.

  7.2 Aeronave

  7.2.1 A aeronave utilizada para operações classe D deve ter sido certificada na categoria
  transporte A, o que no Brasil equivale a dizer que o helicóptero foi certificado segundo
  o RBAC nº 29 na categoria A, para o peso da operação. Em hipótese alguma serão autorizadas
  operações classe D com aeronaves certificadas na categoria normal ou transporte B.'
