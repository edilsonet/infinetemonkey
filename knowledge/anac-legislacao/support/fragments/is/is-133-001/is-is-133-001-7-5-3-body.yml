text: '7.5.3 Todos os pilotos devem ser treinados pelo operador segundo o previsto nos parágrafos
  133.37(b) e 133.37(c) do RBAC nº 133.

  7.6 Operações IFR

  7.6.1 Ninguém pode conduzir operações de aeronaves com cargas externas sob IFR, a menos
  que expressamente autorizado pela Anac. Entretanto, em nenhuma hipótese, uma pessoa pode
  ser transportada, como parte da carga externa, em um voo IFR.

  7.6.2 Após a autorização da Anac, as operações IFR somente podem ser conduzidas com aeronaves
  certificadas para tal e cumprindo as regras contidas no RBAC n° 91, ICA 100-12 e ICA 100-4.

  7.7 Operação IFR em condições IMC

  7.7.1 A operação de transporte de carga externa em operações IFR sob condições IMC não será
  permitida. Somente pode haver voos IFR sob condições IMC para o transporte de pessoas de
  e para a base de operações, dentro da aeronave, atendendo às regras contidas no RBAC 91.


  Supervisão continuada dos operadores

  8.1 Os operadores, uma vez autorizados, devem realizar suas operações sempre de acordo com
  as provisões contidas na autorização emitida pela Anac. Para verificar se isto foi feito,
  a Anac pode, a seu critério, realizar inspeções, vistorias e auditorias nas operações com
  carga externa dos operadores. Estas atividades constituem a supervisão continuada dos operadores
  de carga externa.

  8.2 Há, basicamente, dois tipos de supervisão continuada: a supervisão de operadores e as
  vistorias de rampa.

  8.3 Ademais, a Anac pode realizar inspeções, vistorias e auditorias especiais, para verificar
  itens isolados da operação. O conteúdo destas será determinado pela Anac.'
