title: Centro de gravidade (CG).
text: '7. Centro de gravidade (CG).

  A localização do CG para esta aeronave deve, para todas as condições de carregamento, ficar
  dentro dos limites estabelecidos para a aeronave durante sua certificação de tipo. Para
  combinações aeronave-carga Classe C, os valores da magnitude e da direção da força de carga
  devem ser aqueles valores para os quais a localização efetiva do centro de gravidade permanece
  dentro da faixa estabelecida.'
