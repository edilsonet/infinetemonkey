title: 8(d)
text: d) Ninguém pode conduzir uma operação segundo o RBAC n° 133, com um tipo de aeronave
  de asas rotativas certificada na categoria restrita conforme a seção 21.25 do RBAC nº 21,
  sobre uma área densamente povoada, dentro de uma aerovia congestionada ou nas proximidades
  de um aeródromo com tráfego intenso no qual sejam realizadas operações de transporte de
  passageiros; e
