cite: 8(e)
title: 8(e)
text: 'e) As operações com combinações aeronave-carga Classe D só podem ser conduzidas de
  acordo com o seguinte:

  i. a aeronave a ser usada deve ter sido certificada na categoria A das aeronaves categoria
  transporte, para o peso da operação e deve ter capacidade de executar voo pairado com um
  motor não operante com o peso e na altitude da operação;

  ii. a aeronave deve ser equipada de modo a permitir intercomunicação rádio entre os membros
  da tripulação requeridos;

  iii. equipamentos para içamento de pessoas devem ser aprovados pela Anac; e

  iv. o dispositivo de levantamento deve ter um dispositivo de liberação em emergência requerendo
  duas ações distintas.

  [Outras limitações consideradas necessárias pelo operador ou contidas no Manual de Voo (RFM)
  ou nos Suplementos RFM (RFMS).]

  Seção 2. Informações operacionais de combinação aeronave-carga'
