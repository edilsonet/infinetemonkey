title: 9(a)
text: a) Se realizar uma conexão sem o auxílio de um sinalizador e sem o uso de contato visual
  direto, um tripulante deve deitar-se no chão e olhar para baixo, a partir da porta de entrada
  principal, para observar as ações dos sinalizadores. Este tripulante pode direcionar o piloto
  por meio do sistema de intercomunicação a bordo.
