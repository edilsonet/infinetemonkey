title: 9(b)
text: b) É relativamente comum, entretanto, um piloto pairar enquanto o enganchador engancha
  a linha no gancho de carga. Independentemente de haver ou não membros extras da tripulação
  para atuar como observadores, um briefing completo entre o piloto e o enganchador é extremamente
  importante. O enganchador deve se aproximar e prosseguir por baixo do helicóptero diretamente
  pela frente, entre os esquis ou o trem de pouso. Se o helicóptero sofrer uma falha catastrófica
  e for forçado a pousar, o enganchador deve recuar diretamente para a frente. Essa técnica
  evita a confusão de "você vai para a direita e eu irei para a esquerda".
