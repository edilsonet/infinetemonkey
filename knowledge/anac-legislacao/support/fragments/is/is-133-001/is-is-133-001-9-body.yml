title: Procedimentos operacionais.
text: '9. Procedimentos operacionais.

  Depois de direcionar o helicóptero para a posição, o sinalizador deve permanecer à vista
  do piloto para direcioná-lo com sinais manuais, ou permanecer em contato de rádio direto
  com o piloto, enquanto um número apropriado de enganchadores cuidam da conexão da carga.
  Apresse todas as conexões feitas com o helicóptero enquanto ele está pairando para minimizar
  o tempo que os enganchadores passam embaixo do helicóptero.'
