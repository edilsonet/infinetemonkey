title: Disposições Finais
text: 'Disposições Finais

  10.1 Nenhuma pessoa, física ou jurídica, pode conduzir operações de helicópteros com carga
  externa, remuneradas ou não, sem possuir a autorização tratada nesta IS, emitida pela ANAC.
  Exceção é feita somente àquelas instituições previstas no parágrafo 133.1(c) do RBAC nº
  133 ou nos casos previstos no parágrafo 137.1(f) do RBAC nº 137.

  10.2 As empresas aéreas certificadas sob o RBAC nº 119 e que operem segundo o RBAC nº 135
  ou certificadas para efetuar Serviços Aéreos Especializados poderão receber a autorização
  para operação de helicópteros com carga externa, sem prejuízo de sua certificação anterior.
  A solicitação deve ser feita à Anac, que será responsável pelo processo descrito nesta IS.
  Neste caso, e quando a empresa solicitar autorização para operação com classe D, deve ser
  feita uma revisão no Programa de Treinamento aprovado, de modo a inserir neste o treinamento
  específico para as operações com carga externa.

  10.3 Cabe relembrar que o transporte de passageiros não será permitido em qualquer hipótese,
  nas operações de helicópteros com carga externa, mesmo nas operações com classe D. A classe
  D permite apenas que sejam transportadas pessoas na aeronave, até mesmo externamente à mesma,
  as quais devem obrigatoriamente fazer parte da atividade fim na qual o transporte de carga
  externa esteja envolvido.

  10.4 As operações tratadas nesta IS que venham a ser realizadas sobre áreas densamente povoadas,
  ou sobre áreas urbanas, devem ser solicitadas com antecedência à Anac.

  10.5 Conforme seção 133.14 do RBAC nº 133, a autorização emitida segundo este regulamento
  pode ser suspensa ou cassada se o seu detentor transportar ou permitir que seja transportado
  artigo perigoso, proibido ou restrito, em desacordo com as normas que os regulam, por qualquer
  aeronave de sua propriedade ou por ele operada. A Subparte C do RBAC n° 175 e a IS nº 175-001
  contêm a Classificação dos Artigos Perigosos. O transporte de artigos perigosos nas operações
  conforme RBAC nº 133 requer autorização da Anac.

  10.6 Os casos omissos serão dirimidos pela Anac.'
