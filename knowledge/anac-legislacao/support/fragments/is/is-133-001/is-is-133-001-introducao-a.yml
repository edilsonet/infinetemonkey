title: introducao(a)
text: (a) Em uma emergência envolvendo a segurança de pessoas ou propriedades, o detentor
  de uma autorização para operação com cargas externas pode desviar-se das regras do RBAC
  nº 133, na extensão requerida para fazer face à emergência, conforme seção 133.31.
