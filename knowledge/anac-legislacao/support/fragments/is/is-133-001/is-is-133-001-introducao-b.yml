text: '(b) Cada pessoa que, nessas condições, desviar-se das regras do RBAC nº 133 deve notificar
  o fato à Anac, no prazo de 10 dias após a ocorrência. Caso requerido, a pessoa deve fornecer
  à Anac um relatório completo da operação envolvida, incluindo uma descrição dos desvios
  ocorridos e a razão de tais desvios.

