title: 135.338(a)
text: a) o modelo de manifesto deve ser elaborado em conformidade com o manual de voo aprovado
  da aeronave, sendo incluído na seção de anexos do MGO. Cada tipo de configuração aprovada
  da aeronave enseja em um modelo diferente de manifesto de carga. A fim de otimizar a análise,
  solicita-se a remessa das fichas de pesagem das aeronaves e as páginas do AFM relacionadas
  à elaboração do manifesto de carga para cada aeronave e configuração pretendidas;
