text: 'b) houver necessidade de evitar colisões com outras aeronaves e a utilização do sistema
  de anticolisão a bordo (ACAS II/TCAS II), conforme requisito constante da seção 135.180
  do RBAC nº 135;

  6.12.5. Uso do cinto de segurança e de ombro por parte da tripulação e dos passageiros:
  deve incluir os requisitos para o uso dos cintos de segurança e de ombro por parte dos membros
  da tripulação e dos passageiros durante as distintas fases de voo ou quando se considere
  necessário, em benefício da segurança operacional conforme requisitos constantes das seções
  135.128 e 135.171 do RBAC nº 135;

  6.12.6. Admissão à cabine de pilotos: deve incluir as condições para admissão de pessoas
  que não sejam parte da tripulação de voo à cabine de pilotos, incluindo o requisito da seção
  135.75 do RBAC nº 135. Deve, ainda, apresentar uma descrição dos procedimentos para acesso
  à cabine de pilotos, principalmente no caso de acesso de INSPAC, que deve conter os seguintes
  aspectos:'
