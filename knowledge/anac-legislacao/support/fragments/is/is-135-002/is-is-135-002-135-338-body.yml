text: '135.338

  6.6. Seção 05 - Procedimentos para cumprimento da jornada de trabalho

  Esta seção deve conter:

  6.6.1. Escalas planejadas: descrição dos procedimentos, responsáveis e meios de elaboração,
  divulgação e conservação das escalas planejadas, assim como das eventuais alterações nas
  escalas planejadas;

  6.6.2. Escalas realizadas: descrição dos procedimentos e os responsáveis pela elaboração
  e guarda dos registros das escalas realizadas;

  6.6.3. Comunicação com a ANAC quando da ocorrência de extrapolação de tempo de voo: descrição
  do procedimento quando ocorrer extrapolação de tempo de voo; e

  6.6.4. Gerenciamento da fadiga: somente se o operador possuir tal procedimento, descrever
  o método, os responsáveis e meio de execução desse modelo.

  6.7. Seção 06 - Procedimentos com os passageiros

  Esta seção deve conter:

  6.7.1. Procedimentos de segurança para a aeronave e passageiros: descrever os procedimentos
  empregados para designar assentos e embarcar e desembarcar passageiros, bem como, procedimentos
  adicionais para garantir a segurança enquanto a aeronave estiver em rampa. Estes procedimentos
