title: 135.338(c)
text: 'c) caso sejam utilizados comissários de voo:

  I - comunicações com a cabine de pilotos;

  II - códigos e chamadas; e

  III - medidas de segurança por parte dos comissários;

  6.12.7. Uso de assentos vazios da tripulação por passageiros: o operador deve descrever
  as condições e os procedimentos para o uso, por parte de passageiros, de assentos vazios
  normalmente destinados à tripulação, atendendo ao e previsto nas seções 135.113 e 135.115
  do RBAC nº 135;

  6.12.8. ETOPS (se aplicável): o operador deve apresentar descrição dos procedimentos de
  navegação de grandes distâncias, como os procedimentos ETOPS. O operador deve apresentar
  descrição dos procedimentos operacionais de ETOPS, incluindo o procedimento em caso de falha
  de motor para ETOPS e a designação e utilização de aeródromos em caso de desvio;

  6.12.9. Procedimentos para voos internacionais: descrição de procedimentos para solicitação
  de autorização de sobrevoo, procedimentos de contingência, travessia das cordilheiras dos
  Andes e/ou outras regiões montanhosas, prestação de apoio ao passageiro;

  6.12.10. Procedimentos para operação em condições de gelo: deve incluir as instruções para
  a realização de operações em condição de gelo, conforme a seção 135.227 do RBAC nº 135 e
  a IS nº 119-005. O cumprimento do parágrafo 135.227(b) pode ocorrer por meio do detalhamento
  de um programa aprovado de degelo/antigelo (135.227(b)(3)) ou por meio dos procedimentos
  alternativos de verificação previstos nos parágrafos 135.227(b)(1) ou (2) do RBAC nº 135.
  Identificar as responsabilidades dos tripulantes e coordenação com equipe de solo;

  6.12.11. Rotas, aeródromos e helipontos para operações regulares: listar as características
  básicas dos aeródromos de destino e possíveis alternativas;

  6.12.12. Uso de head-up display (HUD)/enhanced vision systems (EVS): apresentar as características
  desses equipamentos, descrever os procedimentos de uso e contingências em caso de falha
  e/ou mal funcionamento;

  6.12.13. Procedimentos para registro e reporte de condições atmosféricas e de comunicação
  e navegação, conforme requisito constante da seção 135.67 do RBAC nº 135: descrever os procedimentos
  para registro e reporte, por parte das tripulações, de condições atmosféricas potencialmente
  perigosas e de irregularidades de facilidades de comunicações e navegação, atentando especificamente
  para:'
