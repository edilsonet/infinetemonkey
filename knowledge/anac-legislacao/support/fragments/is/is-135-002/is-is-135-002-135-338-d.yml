text: 'd) procedimentos para avaliar um passageiro com suspeita de doença contagiosa, incluindo
  os procedimentos de comunicação ao órgão ATC. Esta comunicação com o órgão ATC deve conter
  as seguintes informações: identificação da aeronave, aeródromo de partida, aeródromo de
  destino, horário estimado de chegada, número de pessoas a bordo, número de casos suspeitos
  a bordo e natureza do risco à saúde pública (se conhecido);

  6.7.5. Procedimentos para negar o embarque, incluindo o parágrafo 135.121(c) do RBAC nº
  135: deve descrever procedimentos para assegurar que se negue o embarque a pessoas que pareçam
  estar intoxicadas ou que mostrem, por seu comportamento ou indicações físicas, que estejam
  sob a influência de drogas, exceto pacientes médicos sob cuidados adequados; e

  6.7.6. Transporte de pessoas sem atender às provisões de transporte de passageiros, conforme
  descrito na seção 135.85 do RBAC nº 135: descrever as características para cada um dos envolvidos
  neste tipo de operação e a forma de lançamento no diário de bordo.

  6.8. Seção 07 - Transporte de carga e de materiais de características especiais

  Esta seção deve conter:

  6.8.1. Transporte de carga: descrever procedimentos de despacho, recebimento na aeronave,
  qualquer peculiaridade com relação ao manifesto de carga, fixação da carga nos compartimentos
  da aeronave e responsáveis pela acomodação do material na aeronave. Identificar o responsável
  pelo carregamento e conferência do carregamento, inclusive de artigos perigosos, e posterior
  aceitação por parte do comandante assim como identificar os responsáveis para atuar em caso
  de emergências no embarque e/ou transporte de cargas; e

  6.8.2. Transporte de materiais de características especiais: descrever os procedimentos
  para despacho e fixação da carga na aeronave, além da documentação necessária, caso o operador
  tenha interesse em transportar um dos seguintes itens relacionados a seguir:'
