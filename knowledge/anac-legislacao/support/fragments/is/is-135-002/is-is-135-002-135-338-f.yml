text: f) deve ser estabelecido critério para definição do peso de tripulantes e passageiros.
  Para tripulantes, pode ser feito uso ou dos pesos dispostos na definição de “Capacidade
  máxima de carga paga” do RBAC nº 01, ou do peso real dos tripulantes;
