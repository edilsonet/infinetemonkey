text: 'g) utilização de sistema para registrar abastecimento e consumo.

  6.11. Seção 10 - Diário de bordo

  Esta seção deve conter:

  6.11.1. Procedimentos para preenchimento do diário de bordo: o operador deve estabelecer
  métodos para preenchimento do diário de bordo, bem como uma explanação de cada um dos campos
  constantes. Incluir, também, um método para aceitação de correção no preenchimento do diário
  de bordo. Ainda, deve descrever procedimentos para reporte e lançamento de irregularidades
  mecânicas por parte do piloto (não se trata de explicar a utilização da MEL, mas sim a forma
  e o momento de verificação, lançamento e consulta do ACR, RTA e MEL pelos pilotos); e

  6.11.2. Modelo de diário de bordo: o operador deve submeter para análise o modelo de folha
  de diário de bordo que irá empregar. O modelo de diário de bordo de cada operador deve atender
  aos requisitos previstos na Portaria nº 2.050/SPO/SAR, de 29 de junho de 2018, ou dispositivo
  correspondente que vier a substituí-la. Para o caso de o operador propor um modelo diverso
  da Portaria nº 2.050/SPO/SAR, deve atentar para que o modelo proposto possua todas as informações
  definidas na citada portaria. Nestes casos, a utilização do modelo proposto fica sujeito
  às regras de aprovação da referida seção do MGO.

  6.12. Seção 11 - Procedimentos de voo

  Esta seção deve conter:

  6.12.1. Planejamento de voo: o operador deve descrever os procedimentos de planejamento
  de voo, atentando para os requisitos estabelecidos na seção 91.103 do RBAC nº 91;

  6.12.2. Plano de voo ATS: o operador deve descrever procedimentos e responsabilidades pelo
  planejamento de voo e preparação e apresentação do plano de voo aos serviços de tráfego
  aéreo. Os fatores a se considerar, no tocante ao plano de voo, incluem: o meio de apresentação
  para os planos de voo individuais e/ou repetitivos, bem como o sistema utilizado para a
  confecção do plano de voo, a depender da complexidade da operação;

  6.12.3. Documentação: descrição da documentação que deve ser levada a bordo de acordo com
  o tipo de voo e a rota voada, incluindo método e responsáveis por verificar sua vigência,
  atualização e formato de uso. Este item deve conter:'
