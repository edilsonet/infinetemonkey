text: 'h) assentos de saída, conforme requisito constante da seção 135.129 do RBAC nº 135:
  esta seção aplica-se somente para operações com helicópteros com mais de 19 assentos para
  passageiros ou operações regulares com aeronaves tendo 10 ou mais assentos para passageiros
  (cf. o parágrafo 135.129(a)(1) do RBAC nº 135); e'
