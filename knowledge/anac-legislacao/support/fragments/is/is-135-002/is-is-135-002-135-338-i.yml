text: 'i) bagagem: descrever os procedimentos e responsáveis para pesagem e acomodação de
  bagagem de passageiros e bagagem de mão;

  6.7.2. Lista de passageiros, conforme Art. 20 do CBA: descrever o método de preenchimento,
  conferência e os responsáveis pela elaboração. Inserir modelo da lista no anexo do MGO;

  6.7.3. Procedimentos e modelos de aviso (briefings) aos passageiros: deve incluir o conteúdo,
  meios e o momento de aviso aos passageiros de acordo com os regulamentos vigentes e com
  a aeronave nas seguintes fases do voo: antes do voo, antes da aterrissagem e depois da aterrissagem,
  tanto para a realização dos procedimentos normais quanto os de emergência. Descrever modelos
  de briefings a serem realizados aos passageiros;

  6.7.4. Requisitos de segurança na cabine de passageiros: deve contemplar os procedimentos
  que incluam os seguintes aspectos:'
