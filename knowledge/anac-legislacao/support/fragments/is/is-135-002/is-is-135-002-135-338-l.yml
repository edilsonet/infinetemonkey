text: 'l) caso o operador se utilize de Electronic Flight Bag - EFB para suporte da atividade
  de preenchimento de manifesto de carga, este deve descrever o procedimento de assinatura
  do manifesto de carga pelo piloto em comando do voo a se realizar e o procedimento de envio
  deste manifesto aprovado para a base operacional do operador.

  6.10. Seção 09 - Abastecimento de combustível e fluidos

  Esta seção deve conter:

  6.10.1. Método para determinar as quantidades de combustível, óleo e outros fluidos a serem
  abastecidos nas aeronaves: o operador deve detalhar metodologia para determinar as quantidades
  de combustível, óleo e outros fluidos a serem abastecidos nas aeronaves, considerando os
  mínimos previstos em seus manuais e a autonomia mínima necessária para cada tipo de operação,
  conforme a IS nº 135-006. Estas instruções deverão considerar todas as circunstâncias que
  provavelmente se encontrem durante o voo, incluindo a possibilidade de alterações da rota
  planejada em voo e a falha de um ou mais motores; e

  6.10.2. Procedimentos de abastecimento de aeronaves: o operador deve especificar seu procedimento
  de abastecimento de aeronaves, considerando os seguintes fatores:'
