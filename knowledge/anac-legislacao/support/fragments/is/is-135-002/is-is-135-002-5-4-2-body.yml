text: '5.4.2 os demais capítulos apresentarão o caráter de aceitação, conforme IS nº 119-004;

  5.4.3 os itens aceitos poderão ser colocados em prática a partir do momento do protocolo
  do documento na Agência, exceto para as empresas em processo de certificação e revogação
  de suspensão, não sendo, entretanto, autorizado o desvio de qualquer requisito ou legislação
  em vigor, estando o operador totalmente responsável pela verificação do cumprimento das
  normas;'
