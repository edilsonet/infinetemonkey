text: '5.4.7 o MGO deverá refletir os procedimentos adotados pela empresa em suas operações
  de voo; e

  5.4.8 o MGO não pode contrariar nenhuma legislação brasileira, estrangeira ou internacional
  que afete as operações da empresa realizadas tanto no Brasil como no exterior.

  5.5 Serviços de solo (ground handling). O operador que optar por utilizar provedores terceirizados
  de serviços de solo para cumprir com uma ou mais responsabilidades presentes no MGO deverá
  descrever, na seção correspondente do MGO, conforme item 6 desta IS, como garantirá que
  as atividades terceirizadas seguirão as políticas e procedimentos apresentados no MGO.

  5.5.1 Essa descrição deve incluir o atendimento aos requisitos de treinamento, às políticas
  de subcontratação e aos processos, políticas e procedimentos de manuseio, explicando quais
  são os responsáveis pela garantia ao atendimento das políticas e procedimentos do MGO em
  cada uma das seções aplicáveis

  Nota: um operador que opte por subcontratar um serviço de abastecimento de combustível,
  pode, por exemplo, descrever em seu MGO que o piloto em comando ou outro funcionário que
  detenha o conhecimento será responsável por garantir o atendimento dos requisitos de abastecimento
  presentes na seção 09 do MGO, quando tal atividade for realizada por terceiros.'
