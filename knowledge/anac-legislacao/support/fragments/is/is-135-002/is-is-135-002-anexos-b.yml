text: 'b) pilotos e comissários, incluindo o requisito constante da seção 135.100 do RBAC
  nº 135.

  Nota: na descrição de responsabilidades acima citada, atentar para especificar, a quem de
  direito na estrutura organizacional do operador, a responsabilidade de manutenção dos registros,
  documentos e relatórios relativos às operações da empresa, conforme definido nos requisitos
  constantes das seções 135.63, 135.64 e 135.65 do RBAC nº 135 e do parágrafo 119.59(b)(1)(ii)
  do RBAC nº 119.

  6.4. Seção 03 - Controle operacional

  Nota: conforme definição do RBAC nº 01, controle operacional significa, referindo-se a um
  voo, o exercício da autoridade sobre seu início, continuação, desvios e o seu término, visando
  à segurança da aeronave e à regularidade e eficiência do voo. De forma generalizada, em
  detentores de certificados regidos pelo RBAC nº 135, o controle operacional existe em dois
  níveis - o primeiro nível (no âmbito da empresa) e o segundo nível (no âmbito do voo).

  No primeiro nível (no âmbito da empresa) ocorre a designação da tripulação e da aeronave,
  bem como a especificação do tipo e características gerais do voo a ser realizado para serviço
  remunerado. Essa designação é responsabilidade direta do detentor de certificado, e deve
  ser feita pelo pessoal de administração requerido ou por pessoas por eles delegadas.

  Para delegar a autoridade de tomada de decisões, as pessoas a quem foi delegado o Controle
  Operacional em Primeiro Nível (no âmbito da empresa), ou partes dele, devem ser treinadas,
  avaliadas e designadas para tal pelo detentor de certificado. Independentemente de delegação
  de autoridade, a responsabilidade é intransferível e recai sobre o pessoal de administração
  requerido e sobre o detentor de certificado.

  Esta seção deve conter:

  6.4.1. Lista de pessoas ou cargos autorizados e responsáveis pelo exercício de controle
  operacional, conforme requisito constante do item 135.77 do RBAC nº 135: para tal listagem,
  podem ser referenciadas as especificações operativas da empresa. No entanto, a responsabilidade
  de cada pessoa ou cargo deve ser descrita no MGO. No caso de delegação de autoridade, as
  pessoas para quem autoridade foi delegada devem ser listadas no MGO. Além da listagem dos
  nomes, o operador deve listar as atribuições delegadas a tais pessoas;

  6.4.2. Lista de instalações e localização das instalações utilizados pelo operador no exercício
  do controle operacional: o operador deve listar os locais de onde exerce controle operacional.
  O detentor de certificado deve garantir que as pessoas do primeiro nível de controle operacional
  ou seus delegados tenham acesso às informações atualizadas, necessárias ao exercício do
  controle operacional, de maneira rápida e em qualquer momento. Listar os meios de comunicação
  utilizados;

  6.4.3. Descrição dos métodos e procedimentos empregados para iniciar, continuar, desviar
  e terminar voos: tal descrição pode ocorrer em forma de narrativa, devendo-se ficar claras
  as atribuições de cada pessoa que participa do processo. Os seguintes processos devem ser
  abordados:

  6.4.3.1. Designação da operação: descrever método e procedimento para garantir que a operação
  possa ser realizada em concordância com o requisito previsto no item 119.63 - Operação recente,
  do RBAC nº 119;

  6.4.3.2. Designação de tripulação: descrever os seguintes aspectos relacionados à designação
