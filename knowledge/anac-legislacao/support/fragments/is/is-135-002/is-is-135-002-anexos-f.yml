text: 'f) descrição do sistema para anotação das páginas e suas datas de efetiva entrada em
  vigor; e tabela de revisões efetuadas para cada manual que compõe o MGE;

  6.2.3.2. Procedimento de distribuição dos manuais que compõem o MGE do operador: descrever
  o procedimento de como se realizará sua distribuição aos envolvidos nas operações aéreas
  e o sistema de controle de entrega das versões atualizadas, conforme requisitos constantes
  dos itens 135.21(c), (e) e (f) do RBAC nº 135;

  6.2.4. Abreviaturas e acrônimos: listar e definir as abreviaturas necessárias para o entendimento
  dos assuntos tratados no MGO. Identificar no MGO apenas as abreviaturas e os acrônimos presentes
  no documento; e

  6.2.5. Definição de termos: glossário de termos utilizados no MGO. Acrescentar apenas as
  definições afetas a este manual.

  6.3. Seção 02 - Estrutura e Organização

  Esta seção deve conter:

  6.3.1. Estrutura organizacional: descrição da estrutura organizacional do operador, incluindo
  o organograma geral da empresa e o organograma do departamento de operações. O organograma
  deve ilustrar as relações entre o departamento de operações e os demais departamentos da
  empresa (como manutenção e comercial, por exemplo). Em particular, devem ser apresentadas
  as relações de subordinação e fluxo de informação de todas as divisões, departamentos e
  afins que tenham relação com a segurança das operações de voo;

  6.3.2. Definição de responsabilidades - cargos de gestão: descrição detalhada de todas as
  funções e responsabilidades de cada membro da estrutura organizacional. Os nomes de cada
  ocupante dos cargos constarão apenas nas especificações operativas do operador. A lista
  de cargos de gestão abaixo não é exaustiva e depende do tipo de operação e complexidade
  do operador:'
