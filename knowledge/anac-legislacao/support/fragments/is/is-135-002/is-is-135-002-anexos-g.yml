title: anexos(g)
text: 'g) métodos e procedimentos para garantir a conformidade dos itens acima elencados quando
  início de voo em áreas remotas, onde não seja possível contato com a base operacional. Neste
  caso, deve ocorrer a delegação de controle operacional para o comandante do voo;

  6.4.4. Sistema de supervisão de voo: descrever os métodos e procedimentos para localização
  de voos, conforme requisito constante da seção 135.79 do RBAC nº 135. O MGO deve listar
  as atribuições da pessoa responsável pela localização dos voos, bem como garantir que informações
  sobre origem, destino, alternativa, pessoas a bordo e horários estimados sejam fornecidos
  quando do despacho de um voo, seja da base operacional da empresa ou de localidade remota.
  O processo deve fornecer também o horário estimado de reestabelecimento de comunicações
  caso não existam meios na localidade de operação, além de métodos para fornecimento de informações,
  em tempo útil, para os serviços de busca e salvamento. O modelo de quadro, formulário ou
  sistema utilizado deve ser incluído na seção de anexos do MGO. Uma listagem dos equipamentos
  de sobrevivência e emergência e características de aeronave e uma cópia do PRE devem ser
  mantidas junto ao setor de supervisão de voos, a fim de fornecerem informações na eventualidade
  de acionamento de serviços de busca e salvamento.

  Nota: não há no RBAC nº 135 qualquer definição de período mínimo para realização de contato
  entre a base de operação e a aeronave em voo. Tal período deve ser definido pelo próprio
  operador, considerando seus procedimentos operacionais estabelecidos.

  6.5. Seção 04 - Tripulação

  Esta seção deve conter:

  6.5.1. Requisitos de qualificação da tripulação, incluindo o parágrafo 135.23(a)(14) do
  RBAC nº 135: descrição dos requisitos da empresa com relação a licença, habilitações, qualificações
  e competência (por exemplo, capacitação e qualificação de zonas, rotas e de aeródromos/helipontos),
  experiência, treinamento, verificações e experiência recente requeridos para que o pessoal
  de operações execute suas funções. Os requisitos da empresa não podem ser inferiores aos
  requisitos constantes do RBAC nº 135 conforme a seguir:

  COMPONENTE DE TRIPULAÇAO

  REQUISITOS - ITENS DO RBAC nº 135

  Piloto em comando

  135.243, 135.244 e'
