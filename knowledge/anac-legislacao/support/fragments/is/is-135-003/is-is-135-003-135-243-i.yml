title: 135.243(i)
text: '(i) atribuições e responsabilidades do

  tripulante, conforme aplicável;

  (ii) as apropriadas provisões deste

  regulamento;

  (iii) conteúdo do certificado e das

  especificações operativas (não aplicável a

  comissários de bordo);

  (iv) apropriadas partes do manual de

  operações do detentor de certificado;'
