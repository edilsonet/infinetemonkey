text: '(v) para comissários de bordo, noções básicas

  sobre aeronaves e teoria do voo;

  (vi) a segurança do transporte de artigos

  perigosos por via aérea;

  (vii) o sistema de gerenciamento de segurança

  operacional (SGSO);

  (viii) segurança da aviação civil (AVSEC); e

  (ix) fatores humanos e CRM.

  12 horas (piloto);

  16 horas (comissário).

  5.2.4.5.1.5 O currículo de doutrinamento básico de solo deve observar a carga horária mencionada.'
