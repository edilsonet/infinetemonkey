text: '135.339 (e)(1)

  a (4)

  (1) as medidas de segurança para

  situações de emergência que possam

  ocorrer durante um exame;

  (2) os resultados potenciais de medidas

  de segurança não tomadas, tomadas

  fora de tempo ou impróprias;

  (3) treinamento e prática na condução

  de exames em voo a partir dos

  assentos de pilotagem esquerdo e

  direito, realizando os procedimentos

  normais, anormais e de emergência

  requeridos, visando assegurar

  competência na condução de exames

  em voo de pilotos requeridos por este

  regulamento; e

  (4) as medidas de segurança a serem

  tomadas, de qualquer dos dois assentos

  para piloto, para situações de

  emergência que possam se

  desenvolver durante a instrução.

  3 voos x

  1 hora

  Este módulo o

  examinador-aluno

  deve realizar 1

  (uma) hora de'
