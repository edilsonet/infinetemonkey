title: 135.339(c)
text: '(c)(1) a (3)

  (1) atribuições,

  responsabilidades e funções de

  um piloto examinador;

  (2) as aplicáveis provisões deste

  regulamento, dos regulamentos

  aeronáuticos e das políticas e

  procedimentos do detentor de

  certificado;

  (3) os apropriados métodos,

  procedimentos e técnicas para

  conduzir os exames requeridos;

  2 horas (se

  instrutor da

  empresa) ou

  8 horas (se não

  instrutor da

  empresa)

  Este módulo deve

  abranger instruções

  referentes elaboração e

  leitura das Fichas de

  avaliação,'
