title: (e)
text: '135.340 (e)

  (1) a (4)

  (1) as medidas de segurança para

  situações de emergências que

  possam desenvolver-se durante a

  instrução;

  (2) os resultados potenciais de

  medidas de segurança impróprias

  ou inoportunas tomadas durante a

  instrução;

  (3) treinamento e prática, a partir

  dos assentos de pilotagem

  esquerdo e direito, das manobras

  normais, anormais e de

  emergência requeridas, visando

  assegurar competência na

  condução da instrução em voo

  requerida por este regulamento; e

  (4) as medidas de segurança a

  serem tomadas, de qualquer dos

  dois assentos para piloto, para

  situações de emergência que

  possam se desenvolver durante a

  instrução.

  1 sessão de

  simulador na

  direita;

  OU

  1 sessão de

  simulador na

  esquerda + 1

  voo de

  adaptação na

  direita(**);

  OU

  Carga de voo

  de adaptação

  na direita(*)

  Neste módulo o

  instrutor-aluno deve

  realizar 1 (uma) hora de

  procedimentos normais

  e 2 (duas) horas de

  procedimentos não

  normais e de

  emergência. O instrutor-

  aluno deve ser avaliado

  pelo instrutor na

  realização dos briefings

  e debriefings e no

  preenchimento das

  fichas.

  (*) Carga de voo de adaptação na direita:

  - para aeronaves classe: 2 horas de voo de repasse na direita, contemplando as seguintes

  manobras: aproximação perdida, stol, emergências e toque/arremetida;

  - para aeronaves tipo: 2 horas voando na direita.

  (**) Em se utilizando 1 sessão de simulador na esquerda, a carga de voo de adaptação na
  direita

  pode ser reduzida à metade.'
