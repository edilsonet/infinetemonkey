text: '4.1.11 período de elegibilidade: de acordo com os parágrafos 135.301(a), 135.323(b),

  135.337(g), 135.338(g), 135.339(b), 135.340(b) e 135.505(d) do RBAC nº 135, é o

  período composto por 3 meses (o mês anterior ao mês de referência, o próprio mês de

  referência e o mês posterior ao mês de referência) onde, caso o empregado complete o

  treinamento ou o exame neste período de elegibilidade, independentemente do mês,

  deverá ser considerado que o treinamento ou o exame foi completado no mês de

  referência;'
