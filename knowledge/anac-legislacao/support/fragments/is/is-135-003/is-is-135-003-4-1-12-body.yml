title: 'programa de treinamento operacional (PrTrnOp): material que descreve os'
text: '4.1.12 programa de treinamento operacional (PrTrnOp): material que descreve os

  treinamentos a serem ministrados pelo operador para seus tripulantes nas diferentes fases

  de sua carreira na empresa e que visa garantir que cada tripulante seja adequadamente

  treinamento para cada aeronave, cada função e cada tipo de operação em que será

  empregado. O PrTrnOp deve observar os requisitos dos regulamentos aplicáveis a um

  determinado tipo de treinamento, bem como, apresentar outros tipos de treinamento que

  o operador ache relevante para o tipo de operação pretendida/executada. É relevante

  mencionar que o treinamento de artigos perigosos, deve ser estendido para todos os

  funcionários do operador aéreo estabelecidos na IS nº 175-007 não se limitando apenas

  aos tripulantes;'
