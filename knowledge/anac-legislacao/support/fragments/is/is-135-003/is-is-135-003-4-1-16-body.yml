title: 'treinamento modular: metodologia utilizada na elaboração do PrTrnOp, na qual'
text: '4.1.16 treinamento modular: metodologia utilizada na elaboração do PrTrnOp, na qual

  subdivisões lógicas são desenvolvidas, elaboradas, revisadas e aprovadas como se fossem

  unidades individuais, de forma que segmentos de currículos e módulos de treinamentos

  possam ser utilizados em vários currículos, facilitando a elaboração e as revisões do

  programa de treinamento.

