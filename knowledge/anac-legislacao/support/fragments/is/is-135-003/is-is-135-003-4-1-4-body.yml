title: 'material didático: material instrutivo desenvolvido para cada tipo de currículo,'
text: '4.1.4 material didático: material instrutivo desenvolvido para cada tipo de currículo,

  compreendendo planos de aula, guias dos instrutores, manuais de treinamento, programas

  de computador (software), recursos audiovisuais, livros, apostilas e manuais das

  aeronaves. O material didático deve refletir, exatamente, o requerido nos currículos de

  treinamento e estar de acordo com os métodos de instrução adotados;'
