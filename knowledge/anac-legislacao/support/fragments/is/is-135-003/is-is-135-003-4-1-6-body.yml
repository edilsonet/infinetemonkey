text: '4.1.6 métodos de instrução: metodologia de ensino empregada para transmitir informações

  aos tripulantes mediante aulas, conferências, demonstrações, apresentações multimídia e

  estudos dirigidos. Podem ser utilizados na instrução, entre outros equipamentos,

  computadores, dispositivos de treinamento, simuladores de voo e aeronaves;'
