title: 'módulo de treinamento: subparte de um segmento de currículo que contém elementos'
text: '4.1.8 módulo de treinamento: subparte de um segmento de currículo que contém elementos

  ou eventos relacionados diretamente com um assunto específico. Um módulo de

  treinamento inclui conteúdo programático, carga horária, material didático, método de

  instrução, instrutores e normalmente é ministrado numa simples sessão de treinamento.

  O conteúdo programático de um módulo deve conter somente a relação dos principais

  assuntos a serem tratados, não sendo aplicável um detalhamento maior, que deve constar

  nos manuais da empresa e planos de aula. Por exemplo: o segmento de currículo de solo

  de uma aeronave pode ser subdividido em módulos para cada sistema (hidráulico,

  pneumático e elétrico), entre outros; um segmento de currículo de voo pode ser separado

  em missões de voo, ou sessões de simulador, cada uma constituindo um módulo;Data de emissão:
  12 de junho de 2020.

  IS nº 135-003

  Revisão D'
