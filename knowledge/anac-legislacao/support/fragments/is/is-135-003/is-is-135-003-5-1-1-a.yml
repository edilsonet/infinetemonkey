text: 'a) operadores que realizem operações complementares com aviões com configuração

  para passageiros com mais de 19 assentos, excluindo-se os assentos para tripulantes,

  que, conforme o parágrafo 135.3(b) do RBAC nº 135, devem atender aos requisitos

  de treinamento e qualificação de tripulantes estabelecidos nas subpartes N e O do

  Para estes operadores, devem ser elaborados programas de treinamento que

  atendam aos requisitos do RBAC nº 121, o que não está no escopo desta IS;Data de emissão:
  12 de junho de 2020.

