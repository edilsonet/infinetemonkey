subsection_id: b
cite: 5.1.1(b)
title: 5.1.1(b)
text: 'b) operadores que, conforme o parágrafo 135.3(c) do RBAC nº 135, tenham

  solicitados e tenham sido autorizados a atender aos requisitos de treinamento e

  qualificação de tripulantes estabelecidos nas subpartes N e O do RBAC nº 121, em

  lugar dos requisitos das subpartes E, G e H do RBAC nº 135 - sendo opcional

  atender aos requisitos de experiência operacional da seção 135.244 do RBAC nº

  135 ou da seção 121.434 do RBAC nº 121. Para estes operadores, devem ser

  elaborados programas de treinamento que atendam aos requisitos do RBAC nº 121

  (com possível exceção aos requisitos de experiência operacional), o que não está

  no escopo desta IS; e'
