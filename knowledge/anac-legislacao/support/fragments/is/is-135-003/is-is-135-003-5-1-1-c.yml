text: 'c) operadores que adotem programa de treinamento baseado em um programa de

  qualificação avançada (AQP), conforme autorizado pelos parágrafos 135.1(a)(4) e

  (5) do RBAC nº 135. A elaboração e aprovação de um AQP não está no escopo

  desta IS.

  5.2 Elaboração do PrTrnOp'
