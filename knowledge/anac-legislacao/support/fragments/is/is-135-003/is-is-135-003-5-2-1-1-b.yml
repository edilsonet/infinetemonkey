title: 5.2.1.1(b)
text: 'b) declaração de conformidade e comprometimento: página com assinatura dos

  responsáveis (gestor responsável e/ou pessoa designada conforme

  responsabilidades descritas no MGO) pela declaração que o programa cumpre com

  a legislação aplicável e as condições do COA e especificações operativas, bem

  como o comprometimento na adoção e execução.'
