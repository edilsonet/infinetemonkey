text: 'f) definições: devem ser definidos os termos utilizados no PrTrnOp, visando a

  garantir sua correta interpretação. As definições contidas na seção 4 desta IS e as

  contidas nos demais materiais de referência, se aplicáveis ao operador, podem ser

  usadas como base para elaboração desta seção;Data de emissão: 12 de junho de 2020.

