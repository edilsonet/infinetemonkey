title: 5.2.1.1(g)
text: 'g) descrição do treinamento: deve descrever a política e diretivas de treinamento

  adotadas pela empresa, o objetivo geral do PrTrnOp, estabelecer os tripulantes e

  demais funcionários do operador para os quais o treinamento se aplica considerando

  a função desempenhada a bordo, rotina operacional da empresa e os modelos de

  aeronaves operadas, informar a regulamentação aeronáutica que fundamenta o

  programa e definir as responsabilidades dos setores envolvidos no treinamento, de

  forma a assegurar que cada tripulante seja adequadamente treinado e qualificado

  para um determinado tipo de operação, função específica e tipo de equipamento, de

  acordo com os requisitos estabelecidos pelo RBAC nº 135. Intrínseco à descrição,

  deve ser apresentada quais as competências que são esperadas ao término do

  treinamento. A empresa também deverá descrever qual é a metodologia que

  pretende adotar visando alcançar as competências esperadas ao término do

  treinamento. São exemplos de metodologia o seminário, a aula expositiva, a aula

  dialógica, a aula demonstrativa e a aula prática;'
