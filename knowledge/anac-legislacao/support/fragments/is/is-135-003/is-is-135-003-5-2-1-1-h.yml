title: 5.2.1.1(h)
text: 'h) distribuição: contém a lista de detentores, o responsável pela atualização e pela

  distribuição e o sistema de distribuição. Caso o sistema de distribuição de manuais

  da empresa para todos os manuais esteja definido no MGO, é suficiente fazer

  referência à seção apropriada do MGO. A lista de detentores deve incluir, além do

  pessoal próprio do operador, a ANAC;'
