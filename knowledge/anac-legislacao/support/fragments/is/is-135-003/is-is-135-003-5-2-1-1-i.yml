title: 5.2.1.1(i)
text: 'i) generalidades: deve proporcionar uma visão geral da empresa, permitindo aos

  tripulantes e demais funcionários do operador familiarizarem-se com as práticas

  organizacionais e administrativas da empresa, procedimentos para tratamento de

  artigos perigosos, políticas do operador, tipos de operação e deveres e

  responsabilidades dos tripulantes, de forma a assegurar que o tripulante adquira os

  conhecimentos necessários à introdução aos diversos tipos de treinamentos

  requeridos para o exercício de sua função; e'
