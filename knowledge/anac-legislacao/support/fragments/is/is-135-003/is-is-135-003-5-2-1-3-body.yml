title: Desse modo, o programa deve adotar um sistema de numeração de páginas independente
text: '5.2.1.3 Desse modo, o programa deve adotar um sistema de numeração de páginas independente

  para cada currículo de treinamento. Ainda, segmentos de currículo ou módulos de

  treinamento que sejam utilizados em mais de um currículo podem ser dispostos a parte,

  sendo incluídos em cada currículo por referência.'
