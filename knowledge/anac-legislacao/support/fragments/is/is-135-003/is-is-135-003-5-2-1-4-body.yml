title: Pela estrutura modular, os programas de treinamento são compostos por currículos de
text: '5.2.1.4 Pela estrutura modular, os programas de treinamento são compostos por currículos
  de

  treinamento, constituídos por segmentos de currículos, que podem ser divididos em

  módulos de treinamento, que por sua vez são formados por elementos e/ou eventos,

  conforme abaixo.Data de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  Figura 1 - Representação esquemática do programa de treinamento

