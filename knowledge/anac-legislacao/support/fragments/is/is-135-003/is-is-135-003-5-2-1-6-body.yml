text: '5.2.1.6 A seu critério, o operador pode optar por elaborar um programa de treinamento,

  organizando-o de modo a representar um grupo de aeronaves que compõe a frota daData de emissão:
  12 de junho de 2020.

  IS nº 135-003

  Revisão D

  empresa, por exemplo, um para aviões classe, outro para helicópteros classe, ou

  segregando-o por tipo aplicável. Neste caso, se considera que cada um destes documentos

  compõe um volume do PrTrnOp requerido pelo regulamento. Cada volume deverá ser

  claramente identificado pelo seu título na capa e ter controle de revisões e lista de páginas

  efetivas próprios.'
