title: O programa de treinamento de artigos perigosos deverá constar como uma seção
text: '5.2.1.7 O programa de treinamento de artigos perigosos deverá constar como uma seção

  específica do PrTrnOp e deve contemplar, além dos currículos de treinamento para os

  tripulantes, os currículos aplicáveis a outras classes de funcionários do detentor de

  certificado ligados à preparação para transporte, aceitação, recusa, carga, descarga

  armazenagem e manuseio de carga, COMAT, passageiros, bagagem e mala postal,

  conforme estabelecido pela IS nº 175-007.'
