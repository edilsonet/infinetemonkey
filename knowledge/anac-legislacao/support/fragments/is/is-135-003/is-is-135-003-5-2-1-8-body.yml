text: '5.2.1.8 A elaboração do programa de treinamento de artigos perigosos deve seguir as
  instruções

  da IS nº 175-007, a qual poderá conter orientações mais restritivas do que aquelas

  estabelecidas para outros tipos de treinamento, que não o treinamento de transporte aéreo

  de artigos perigosos, contemplados pela presente IS.'
