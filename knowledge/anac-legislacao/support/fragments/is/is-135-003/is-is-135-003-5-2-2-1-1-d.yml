title: 5.2.2.1.1(d)
text: 'd) fichas de instrução de voo: utilizadas individualmente por voo, relacionando todas

  as manobras realizadas e o grau de aprendizado e incluindo, pelo menos,

  informações como matrícula da aeronave e página do diário de bordo com o registro

  do voo. A ficha de instrução deverá identificar o aluno e o instrutor e ser assinada

  por ambos; e'
