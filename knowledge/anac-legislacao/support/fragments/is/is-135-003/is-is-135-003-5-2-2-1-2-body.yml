text: '5.2.2.1.2 Conforme o parágrafo 119.59(b)(1)(ii) do RBAC nº 119, o detentor de certificado
  deve

  estabelecer a localização e as pessoas responsáveis pela conservação dos registros dos

  tripulantes, especialmente os requeridos pelos parágrafos 135.63(a)(4), 135.63(a)(5),

  135.323(c) e pela seção 135.507 do RBAC nº 135, bem como os registros adicionaisData de
  emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  estabelecidos pelo PrTrnOp. A informação sobre a localização dos registros, pessoas

  responsáveis e suporte administrativo provido para a realização do treinamento e guarda

  dos registros devem constar no PrTrnOp do detentor de certificado.'
