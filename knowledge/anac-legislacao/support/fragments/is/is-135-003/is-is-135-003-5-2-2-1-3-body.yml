title: A empresa deve ser capaz de, a qualquer tempo, reconstituir integralmente os
text: '5.2.2.1.3 A empresa deve ser capaz de, a qualquer tempo, reconstituir integralmente
  os

  treinamentos executados por seus tripulantes observando as informações requeridas nas

  seções 135.63 e 135.507 do RBAC nº 135. Deverá constar dessas informações as pessoas

  físicas e/ou jurídicas contratadas ou designadas para ministrar treinamento e/ou exame

  em nome da empresa. A empresa deverá possuir listagem de instrutores e examinadores

  à parte do PrTrnOp.'
