title: A empresa deverá descrever os procedimentos para a condução dos exames, treinamento
text: '5.2.2.2.1 A empresa deverá descrever os procedimentos para a condução dos exames, treinamento

  corretivo, condições para repetições de manobras e tolerâncias quanto à falha em

  manobras observando as limitações dispostas no manual da aeronave e na IS nº 00-002.

  O procedimento proposto visa garantir que um determinado piloto cujo exame foi

  autorizado pelo instrutor, possua reais condições de êxito na avaliação.'
