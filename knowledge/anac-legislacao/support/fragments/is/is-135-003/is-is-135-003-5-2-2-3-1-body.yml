title: Uma vez que um tripulante conclua de forma satisfatória um currículo de treinamento,
text: '5.2.2.3.1 Uma vez que um tripulante conclua de forma satisfatória um currículo de treinamento,

  incluindo os exames requeridos, antes de o detentor de certificado empregar tal tripulante

  em suas operações, é necessário que seja feita a designação do tripulante para a função.

  Uma vez que tenha se certificado de que o tripulante cumpre os requisitos para atuar em

  determinada função em determinada equipamento, o detentor de certificado deverá

  atualizar o registro individual do tripulante com a data de sua designação para a função

  em determinado equipamento (cf. RBAC nº 135.63(a)(4)(iv)), podendo passar, assim, a

  utilizar o tripulante nesta função. Deverão ser atualizados no registro também a data e
  o

  resultado dos exames realizados (cf. RBAC nº 135.63(a)(4)(vi)) e a data de término do

  treinamento (cf. RBAC nº 135.63(a)(4)(x)).'
