title: Deve constar no programa de treinamento o método de controle da validade dos
text: '5.2.2.4.1 Deve constar no programa de treinamento o método de controle da validade
  dos

  treinamentos realizados pelos tripulantes, estabelecendo-se procedimentos que garantam

  a realização no período de elegibilidade de todos os treinamentos previstos para os

  tripulantes do detentor do certificado, de acordo com as aeronaves operadas e sua função

  a bordo. O controle deve garantir ainda que nenhuma pessoa trabalhe como tripulante em

  operação segundo o RBAC nº 135 sem ter completado as apropriadas fases do programaData de
  emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  de treinamento aprovado do detentor do certificado, estabelecido para a aeronave e para

  a função que a pessoa exercer a bordo, conforme a seção 135.343 do RBAC nº 135.'
