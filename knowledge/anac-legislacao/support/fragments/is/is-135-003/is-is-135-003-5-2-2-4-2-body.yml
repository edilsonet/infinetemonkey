text: '5.2.2.4.2 A validade dos treinamentos é definida considerando-se sempre o mês de conclusão
  do

  treinamento. Por exemplo, se um treinamento é requerido periodicamente a cada 12 meses

  e, em 2014, tal treinamento foi concluído no mês de junho, a validade deste treinamento

  será junho de 2015 (mês de referência).'
