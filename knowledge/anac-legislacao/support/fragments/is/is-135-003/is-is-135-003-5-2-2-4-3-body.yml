title: Deve-se atentar que os treinamentos e exames requeridos periodicamente possuem um
text: '5.2.2.4.3 Deve-se atentar que os treinamentos e exames requeridos periodicamente possuem
  um

  intervalo de 3 meses para sua realização, definido como o período de elegibilidade, sem

  prejuízo à validade do treinamento. Assim, o tripulante pode continuar operando por mais

  um mês após o final da validade do treinamento. No exemplo do parágrafo anterior, o

  período de elegibilidade abrangeria os meses de maio a julho, e o tripulante poderia operar

  normalmente até julho de 2015, ficando impedido de operar a partir de 1 de agosto de

  2015, caso não conclua o treinamento periódico requerido até esta data.'
