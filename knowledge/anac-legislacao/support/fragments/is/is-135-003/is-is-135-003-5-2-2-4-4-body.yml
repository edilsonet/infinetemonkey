title: O tripulante também pode se utilizar do mês anterior ao de referência. Mantendo o
text: '5.2.2.4.4 O tripulante também pode se utilizar do mês anterior ao de referência. Mantendo
  o

  exemplo anterior, caso o tripulante realize o treinamento periódico requerido em maio de

  2015, manterá junho como mês de referência. Isto significa que, mesmo realizando

  treinamento em maio de 2015, o tripulante poderia realizar o treinamento de 2016 entre

  os meses de maio a julho. No entanto, caso o treinamento seja realizado antes de maio de

  2015 (por exemplo, em março de 2015), este novo mês de realização passará a ser o novo

  mês de referência para este treinamento.'
