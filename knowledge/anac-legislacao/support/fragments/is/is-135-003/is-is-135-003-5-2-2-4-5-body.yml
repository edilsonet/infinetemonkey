title: É importante ainda destacar que a validade dos treinamentos não está vinculada
text: '5.2.2.4.5 É importante ainda destacar que a validade dos treinamentos não está vinculada

  diretamente à validade da habilitação do tripulante. A validade da habilitação é definida

  a partir da data de realização do exame, enquanto a validade do treinamento é definida a

  partir da data de conclusão do segmento de currículo específico. Isto é especialmente

  relevante nos casos de treinamentos iniciais, que normalmente levam mais tempo para ser

  concluídos. Se um tripulante conclui o segmento de currículo de emergências gerais em

  junho de 2014 e realiza o exame em agosto de 2014, deverá, no ano seguinte, realizar o

  currículo de emergências gerais no período de elegibilidade de maio a julho de 2015 e

  realizar o exame no período de elegibilidade de julho a setembro de 2015.'
