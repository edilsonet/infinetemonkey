text: '5.2.2.4.6 O detentor de um certificado deve atentar-se aos treinamentos cuja validade
  e/ou

  periodicidade é estabelecido em regulamento específico. A validade dos treinamentos de

  transporte aéreo de artigos perigosos segue o definido na IS nº 175-007, não se aplicando

  o período de elegibilidade.'
