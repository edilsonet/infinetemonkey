title: O detentor de um certificado deve prover instalações adequadas que propiciem ambiente
text: '5.2.2.5.1 O detentor de um certificado deve prover instalações adequadas que propiciem
  ambiente

  favorável à instrução e aprendizagem independentemente se próprias ou de terceiros,

  considerando o tipo de treinamento a ser ministrado. Por recursos adequados exemplifica-

  se: salas de aulas devidamente climatizadas, isoladas de sons altos, iluminadas e limpas,

  adequadas ao número de alunos, mesas, cadeiras, quadro, computador, projetor,

  equipamentos de áudio e qualquer outro equipamento que corrobore positivamente à

  instrução.Data de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D'
