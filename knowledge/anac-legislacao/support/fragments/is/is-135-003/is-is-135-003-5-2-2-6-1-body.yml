title: Conforme o parágrafo 135.324(a) do RBAC nº 135, apenas podem ser contratados para
text: '5.2.2.6.1 Conforme o parágrafo 135.324(a) do RBAC nº 135, apenas podem ser contratados
  para

  prover treinamentos, testes ou exames outros detentores de certificado que operem sob o

  de artigos perigosos, para atendimento ao RBAC nº 175, devem ser contratadas entidades

  de ensino autorizadas segundo o próprio RBAC nº 175 e a IS nº 175-007. Da mesma

  forma, admitem-se outros casos em que as entidades sejam expressamente autorizadas

  pela ANAC para ministrar determinada instrução, como ocorre como os facilitadores de

  CRM e com os cursos de AVSEC (vide o disposto no RBAC nº 110 e IS nº 110-001).'
