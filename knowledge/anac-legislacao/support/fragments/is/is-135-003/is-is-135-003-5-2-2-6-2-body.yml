text: '5.2.2.6.2 Ao contratar pessoa jurídica para ministrar treinamento, o detentor de certificado
  deve

  verificar previamente se o contratado possui as qualificações e autorizações requeridas

  para ministrar o treinamento desejado, armazenando cópia de todos os documentos que

  permitam ao contratado ministrar o referido treinamento, bem como, o contrato ou

  registro de outra forma de acordo estabelecido, conforme o parágrafo 135.324(a) do

  de acompanhamento, que o treinamento foi realizado em conformidade com os requisitos

  aplicáveis, em especial, os dos parágrafos/seções 135.323(a)(3), 135.338 e 135.340 do'
