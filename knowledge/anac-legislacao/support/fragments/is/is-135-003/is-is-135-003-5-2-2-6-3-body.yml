text: '5.2.2.6.3 A utilização de examinadores credenciados de outros detentores de certificados
  que

  operem sob o RBAC nº 135 é sujeita à aprovação prévia da ANAC, devendo ser

  comunicada e formalizada entre as partes mediante contrato de prestação de serviços de

  instrução e exame.'
