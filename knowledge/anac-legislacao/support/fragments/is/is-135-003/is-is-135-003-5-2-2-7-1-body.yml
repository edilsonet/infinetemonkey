title: Conforme o parágrafo 135.323(a)(3), os instrutores de solo devem ser adequadamente
text: '5.2.2.7.1 Conforme o parágrafo 135.323(a)(3), os instrutores de solo devem ser adequadamente

  qualificados para os treinamentos que serão ministrados. Os instrutores de voo devem

  atender aos requisitos das seções 135.338 e 135.340 do RBAC nº 135, que incluem a

  realização de treinamentos e exames específicos para o exercício dessa função numa

  determinada aeronave. De forma geral, não há requisitos equivalentes para instrutores

  teóricos - com exceção, por exemplo, aos treinamentos de artigos perigosos regidos pelo

  disposto no RBAC nº 110 e IS nº 110-001.'
