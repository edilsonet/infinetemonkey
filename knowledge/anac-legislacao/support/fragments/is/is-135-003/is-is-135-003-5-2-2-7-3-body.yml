title: Solicitações de procedimento alternativo, para utilização de instrutores que não atendam
text: '5.2.2.7.3 Solicitações de procedimento alternativo, para utilização de instrutores
  que não atendam

  ao estabelecido nesta IS, poderão ser submetidas por meio de FOP 108, com a devida

  fundamentação, contendo qualificação e currículos do instrutor proposto. Nestes casos, é

  recomendável que o primeiro treinamento do instrutor seja acompanhado por servidor

  designado da ANAC, para avaliação.'
