title: Cada currículo é vinculado a um tipo de treinamento, a uma aeronave e a uma função
text: '5.2.3.2 Cada currículo é vinculado a um tipo de treinamento, a uma aeronave e a uma
  função

  específica. Assim, um piloto que assumirá a função de piloto em comando deve cumprir

  um currículo diferente do piloto que assumirá a função de segundo em comando na

  mesma aeronave. Para fins de apresentação, o detentor de certificado por combinar os

  dois currículos em um mesmo trecho do programa de treinamento. Porém, deve deixar

  claro quais as diferenças entre ambos, como, por exemplo, qual a carga horária aplicada

  a cada função ou quais os segmentos de currículo aplicáveis a cada função.'
