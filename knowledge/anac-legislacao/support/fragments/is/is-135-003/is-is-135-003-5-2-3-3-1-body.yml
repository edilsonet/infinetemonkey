title: Por exemplo, se um tripulante faz o treinamento inicial para segundo em comando em
text: '5.2.3.3.1 Por exemplo, se um tripulante faz o treinamento inicial para segundo em comando
  em

  uma aeronave em janeiro de 2014, incluindo o treinamento inicial de artigos perigosos,

  e, posteriormente, em julho de 2014 faz um treinamento de elevação de nível para piloto

  em comando desta aeronave, não precisaria realizar o treinamento de artigos perigosos

  neste treinamento de elevação de nível. No entanto, neste caso, enquanto os treinamentos

  de solo e de voo passarão a ter julho como mês de referência, o treinamento de artigos

  perigosos manterá janeiro como mês de referência, devendo ser repetidos entre dezembro

  de 2014 e fevereiro de 2015 - já considerando o período de elegibilidade.Data de emissão:
  12 de junho de 2020.

  IS nº 135-003

  Revisão D'
