title: Em alguns casos, segmentos de currículos podem ser aplicáveis a mais de uma aeronave,
text: '5.2.3.3 Em alguns casos, segmentos de currículos podem ser aplicáveis a mais de uma
  aeronave,

  como, por exemplo, o treinamento de artigos perigosos. De qualquer forma, o

  treinamento, por ser requerido para que o tripulante exerça suas funções, deve ser listado

  em cada currículo. No entanto, pode ser incluída observação de que o tripulante não

  precisará realizar novamente este segmento de currículo caso ainda esteja válido, de

  acordo com o parágrafo 135.323(d) do RBAC nº 135. Especial atenção deve ser dada à

  validade deste segmento de currículo, pois ele deverá ser realizado de forma periódica

  dentro de seu período de elegibilidade específico.'
