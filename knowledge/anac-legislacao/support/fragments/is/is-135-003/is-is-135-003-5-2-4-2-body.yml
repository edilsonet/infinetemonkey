title: Eventualmente nem todos os tipos de treinamentos serão aplicáveis a todos os detentores
text: '5.2.4.2 Eventualmente nem todos os tipos de treinamentos serão aplicáveis a todos os
  detentores

  de certificado. Por exemplo, caso um operador possua apenas um modelo de aeronave,

  não precisará desenvolver o treinamento de transição; ou caso um operador utilize apenas

  piloto em comando em suas operações, não precisará desenvolver treinamento de

  elevação de nível.'
