title: A seu critério, o detentor de certificado pode escolher não desenvolver algumas
text: '5.2.4.3 A seu critério, o detentor de certificado pode escolher não desenvolver algumas

  combinações de currículos. Por exemplo, um detentor de certificado pode ter como

  política que todo piloto, ao ingressar na empresa, operará primeiramente determinado

  modelo de aeronave. Apenas após ser qualificado neste modelo de aeronave, o tripulante

  poderá realizar treinamento de transição para passar a operar as aeronaves mais

  complexas do operador. Neste caso, o operador pode optar por não desenvolver o

  treinamento inicial completo para estas aeronaves mais complexas.'
