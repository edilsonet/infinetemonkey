title: O detentor de certificado pode também, a seu critério, optar por desenvolver currículos
text: '5.2.4.4 O detentor de certificado pode também, a seu critério, optar por desenvolver
  currículos

  de treinamento diferentes para um mesmo tipo de treinamento, mesma função a bordo e

  mesma aeronave, adaptando o treinamento a ser ministrado de acordo com a experiência

  prévia do tripulante. Por exemplo, um operador poderia desenvolver um treinamento

  inicial completo para um tripulante recém-contratado que possui licença de PLA e já foi

  habilitado na aeronave anteriormente e outro treinamento inicial completo para um

  tripulante recém-contratado que possui apenas licença de PC e nunca foi habilitado na

  aeronave. No treinamento para o piloto mais experiente, pode ser reduzida a carga horária

  ou pode ser alterada a ênfase do treinamento. Porém, o treinamento deve conter todos os

  elementos e eventos do currículo completo.'
