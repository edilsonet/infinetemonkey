title: 5.2.4.5.1(c)
text: 'c) piloto designado para uma aeronave de categoria, classe ou tipo para a qual não
  foi

  previamente treinado pelo operador.

  5.2.4.5.1.2 Antes do treinamento inicial, é importante que o detentor de certificado garanta
  que o

  tripulante atenda às qualificações requeridas para operações segundo o RBAC nº 135,

  conforme descritas na seção 135.243 para piloto em comando, e na seção 135.245 para

  segundo em comando. A experiência aeronáutica do tripulante deve ser comprovada por

  registros de horas oficiais, como a caderneta individual de voo (CIV), declaração de

  empresa aérea, emitida conforme a IAC 3252 ou dispositivo normativo que venha a

  substituí-la, ou ainda declaração online de experiência de voo, conforme IS nº 61-001.

  Estes documentos devem constar no registro do tripulante, requerido pelo parágrafo

  135.63(a)(4)(iii) do RBAC nº 135. Currículos e declarações do próprio tripulante não são

  documentos aceitos para comprovar a experiência aeronáutica prévia do tripulante.

  5.2.4.5.1.3 O treinamento inicial deverá cobrir, ao menos, as seguintes seções do RBAC nº
  135:

  Currículos Aplicáveis Regulamento de referência

  Doutrinamento básico de solo* Seção 135.329(a)(1)

  Treinamentos específicos

  Artigos Perigosos - RBAC nº 135, RBAC nº 175, IS

  nº 175-007;

  SGSO - RBAC nº 135 Apêndice H, IS nº 119-002;

  CRM - parágrafo 135.329(a)(1)(ix) e IS nº 00-010; e

  AVSEC - parágrafo 135.329(a)(1)(viii) do RBAC nº

  135, RBAC nº 110, IS nº 110-001.

  Conhecimentos gerais de aeronave Parágrafos 135.345(a), (b)(6) a (b)(9) do RBAC nº

  135 para pilotos, seção 135.349 para comissários.

  Operações autorizadas nas

  especificações operativas

  Seção 119.49 do RBAC nº 119;

  Parágrafo 135.329(e)(2) e seção 135.3 do RBAC nº

  135;

  IS nº 119-004;

  Resolução nº 221/2011, etc.

  Emergências gerais Seção 135.331 do RBAC nº 135.

  Treinamento de solo específico da

  aeronave Parágrafos 135.345(b)(1) a (b)(5), (b)(10) e (b)(11).

  Voo Seção 135.347 e parágrafo 135.341(e) do RBAC nº

  135.

  *currículo aplicável somente para novos empregados

  5.2.4.5.1.4 Assim, no PrTrnOp apresentado por um dado operador, para cada tipo de treinamento

  haverá a divisão por currículos conforme apresentado no RBAC e, para cada um destes,

  a apresentação da ementa do curso, carga horária, metodologia que a empresa entende ser

  mais pertinente ao conteúdo ministrado, dos pré-requisitos estabelecidos em regulamento

  ou pelo detentor do certificado para matrícula neste currículo; dos objetivos do currículo,

  incluindo tipo de treinamento, aeronave e função; segmentos de currículo que compõemData
  de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  o currículo e módulos de verificação (exames) que compõe o currículo conforme descrito

  no item 5.2.3 dessa IS. Exemplo:

  - Treinamento Inicial Completo

  - Currículo de Doutrinamento Básico de Solo

  • Objetivo: apresentação das responsabilidades do tripulante da empresa quando

  desempenhando a função de PIC e/ou SIC, apresentação de partes pertinentes à operação dos

  regulamentos que as afetam, em especial do RBAC nº 135, introdução ao sistema de

  gerenciamento de segurança operacional da empresa (SGSO), introdução a fatores humanos

  e CRM, introdução ao transporte de artigos perigosos e segurança da aviação civil (AVSEC).

  • Aplicabilidade: tripulantes recém contratados e que não tenham recebido qualquer

  treinamento prévio em empresa operando segundo previsões do RBAC nº 135.

  • Pré-requisitos: possuir licença mínima de PC, atender aos requisitos dos parágrafos'
