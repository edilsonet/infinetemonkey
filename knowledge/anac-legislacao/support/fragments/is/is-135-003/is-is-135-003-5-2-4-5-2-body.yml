title: Treinamento periódico
text: '5.2.4.5.2 Treinamento periódico

  5.2.4.5.2.1 O treinamento periódico é o treinamento requerido para que um tripulante permaneça

  adequadamente treinado e permanentemente proficiente em cada aeronave, função a

  bordo e tipo de operação em que o tripulante trabalha. Esse treinamento deve ser anual e

  encontra respaldo na seção 135.351 do RBAC nº 135. É composto pelos seguintes

  currículos:

  Currículos Aplicáveis Regulamento de referênciaData de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  Treinamentos específicos*

  Artigos Perigosos - RBAC nº 135, RBAC nº 175, IS

  nº 175-007;

  SGSO - RBAC nº 135 Apêndice H, IS nº 119-002;

  CRM - parágrafo 135.329(a)(1)(ix) e IS nº 00-010; e

  AVSEC - parágrafo 135.329(a)(1)(viii) do RBAC nº

  135, RBAC nº 110, IS nº 110-001, para pilotos.

  Seção 135.349 para comissários de voo.

  Conhecimentos gerais de aeronave Parágrafos 135.345(a), (b)(6) a (b)(9) do RBAC nº

  135.

  Operações autorizadas nas

  especificações operativas

  Seção 119.49 do RBAC nº 119;

  Parágrafo 135.329(e)(2) e seção 135.3 do RBAC nº

  135;

  IS nº 119-004;

  Resolução nº 221/2011, etc.

  Emergências gerais Seção 135.331 do RBAC nº 135.

  Treinamento de solo específico da

  aeronave Parágrafos 135.345(b)(1) a (b)(5), (b)(10) e (b)(11).

  Voo Seção 135.347 e parágrafo 135.341(e) do RBAC nº

  135.

  * Conforme validade especificada nos regulamentos que versam sobre o currículo de treinamento

  5.2.4.5.2.2 Cabe ao operador propor a carga horária e abrangência dos segmentos de currículo
  que

  compõe o treinamento periódico considerando a experiência pregressa do tripulante.

  Relevante mencionar que há treinamentos cuja periodicidade é estabelecida em seções

  distintas como artigos perigosos. O operador deve garantir que todos os treinamentos

  aplicáveis foram devidamente realizados dentro dos prazos regulamentares.'
