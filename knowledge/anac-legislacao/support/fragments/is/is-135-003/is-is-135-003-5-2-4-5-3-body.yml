title: Treinamento de transição
text: '5.2.4.5.3 Treinamento de transição

  5.2.4.5.3.1 É o treinamento para uma função requerido para um tripulante que foi qualificado
  e

  trabalhou na mesma função em outra aeronave da empresa. Não deve ser confundido com

  o treinamento inicial.

  5.2.4.5.3.2 É composto pelos seguintes currículos:

  Currículos Aplicáveis Regulamento de referência

  Emergências gerais Seção 135.331 do RBAC nº 135.

  Treinamento de solo específico da

  aeronave Parágrafos 135.345(b)(1) a (b)(5), (b)(10) e (b)(11).

  Voo Seção 135.347 e parágrafo 135.341(e) do RBAC nº 135.'
