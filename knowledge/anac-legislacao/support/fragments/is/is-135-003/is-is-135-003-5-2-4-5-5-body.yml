title: Treinamento de diferenças
text: '5.2.4.5.5 Treinamento de diferenças

  5.2.4.5.5.1 O treinamento de diferenças é requerido de acordo com os critérios do programa
  de

  treinamento aprovado pela autoridade primária de certificação ou da IS nº 61-004. Cabe

  ao detentor de um certificado propor esse currículo prevendo cargas horárias e demais

  informações apresentadas no item 5.2.3. O currículo desenvolvido deve ser

  suficientemente detalhado de modo a permitir atestar a eficiência com vistas à aquisição

  da aprovação final do treinamento.

  5.2.4.5.5.2 O treinamento de diferenças pode ser realizado em um currículo separado ou,
  quando as

  diferenças forem mínimas, de forma simultânea em outro currículo (inicial ou periódico,

  por exemplo). Neste último caso, o currículo deve prever explicitamente, nos pontos em

  que houver diferença entre os modelos de aeronaves operados pelo detentor de

  certificado, que será tratada tal diferença. Esta opção pode ser utilizada em casos em que

  não houver exigência específica de treinamento de diferenças entre os modelos operados

  na IS nº 61-004 ou no currículo aprovado pela autoridade primária de certificação, mas,

  ainda, assim, os modelos possuam certas diferenças, como pode ocorrer com as variantes

  de PA34 (PA34-200/PA34-200T/PA34-220T) e EMB-810 (EMB-810C/EMB-810D); ou

  de AS350A/B2 e HB-350B.'
