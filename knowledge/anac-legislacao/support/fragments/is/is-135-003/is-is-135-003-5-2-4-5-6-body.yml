title: Treinamento de requalificação
text: '5.2.4.5.6 Treinamento de requalificação

  5.2.4.5.6.1 Treinamento de requalificação é o treinamento requerido para tripulantes previamente

  treinados e qualificados para determinada função a bordo de determinado tipo de

  aeronave, mas que tenham perdido a qualificação por não terem cumprido quaisquer dos

  requisitos necessários para operar segundo o RBAC nº 135. Estes requisitos incluem osData
  de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  exames em voo requeridos pelas seções 135.293, 135.297 e 135.299 do RBAC nº 135,

  conforme citados no parágrafo 135.231(a)(8) do RBAC nº 135.

  5.2.4.5.6.2 A perda de qualificação também ocorre quando o tripulante deixa de cumprir os
  requisitos

  de experiência recente estabelecidos na seção 135.247 do RBAC nº 135 e na seção 61.21

  do RBAC nº 61. Neste caso, a perda de qualificação e a necessidade de requalificação

  não necessariamente devem ser avaliadas para cada tipo de aeronave, devendo ser

  observados os requisitos dos regulamentos (considerando separadamente, por exemplo,

  qualificação para voo noturno e para voo diurno; para voo VFR ou IFR; além do fato de

  a aeronave ter bequilha de cauda ou não, conforme parágrafo 135.247(b) do RBAC nº

  135). Conforme a seção 61.23 do RBAC nº 61, a requalificação para recuperação de

  experiência recente deve incluir no mínimo 1 hora de treinamento em solo e 1 hora de

  instrução em voo. Este voo deve ter como única finalidade a instrução de voo, não sendo

  permitido o transporte de passageiros e/ou cargas ou outros serviços aéreos durante os

  voos. Ainda, conforme o parágrafo 135.247(c) do RBAC nº 135, deve incluir pelo menos

  3 pousos e 3 decolagens no período considerado (diurno ou noturno) e ser ministrada por

  piloto instrutor qualificado segundo o RBAC nº 135 no mesmo tipo de aeronave. Se a

  tripulação mínima da aeronave for de 2 pilotos, deverá haver, além do instrutor e do

  tripulante a ser requalificado, um piloto de segurança devidamente habilitado e

  qualificado para a aeronave. Deverá constar no registro do tripulante as certificações

  pelos instrutores do treinamento de solo e do treinamento de voo, incluindo as fichas de

  instrução de voo.

  5.2.4.5.6.3 O treinamento de requalificação também deve ser realizado pelo tripulante que
  não

  demonstre desempenho satisfatório em um exame. Conforme o parágrafo 135.301(b) do

  poder realizar novo exame em voo, ficando impedido de voar como membro da tripulação

  mínima requerida em operações segundo o RBAC nº 135 até a conclusão satisfatória do

  novo exame. O treinamento, neste caso, deve abranger, no mínimo, os assuntos

  necessários para corrigir o que foi apontado como deficiente no exame anterior. A

  certificação requerida pelo parágrafo 135.323(c), no entanto, deve demonstrar que o

  tripulante está apto a realizar novamente o exame em voo. Relevante mencionar que a

  reprovação impossibilita que o tripulante opere qualquer das aeronaves que comumente

  opera no ambiente 135, ou seja, os efeitos da reprovação não se limitam apenas à aeronave

  em que ocorreu a reprovação.

  5.2.4.5.6.4 O treinamento de requalificação deve incluir todos os treinamentos e exames
  necessários

  para o tripulante voltar a estar qualificado, incluindo o treinamento de emergências gerais,

  de artigos perigosos, de solo e de voo da aeronave e treinamentos especiais, conforme

  aplicável. A carga horária dos segmentos de currículos requeridos do treinamento de

  requalificação dependerá da extensão do período após a perda da qualificação. Caso o

  tripulante tenha perdido a qualificação há mais de 36 meses, deverá ser realizado o

  treinamento inicial completo. A carga horária deve ser sempre superior à carga horária

  do mesmo segmento de currículo no treinamento periódico, podendo ser inferior à carga

  horária do treinamento inicial. Os conteúdos abrangidos deverão atender, no mínimo, aos

  requisitos regulamentares associados a cada segmento de currículo.Data de emissão: 12 de
  junho de 2020.

  IS nº 135-003

  Revisão D

  5.2.4.5.6.5 Caso o detentor de certificado decida não estabelecer treinamentos de requalificação
  em

  seu programa de treinamento, qualquer tripulante deverá realizar treinamento inicial

  completo após perder a qualificação.'
