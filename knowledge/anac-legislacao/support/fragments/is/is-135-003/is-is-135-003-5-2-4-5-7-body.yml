title: Avaliação de experiência prévia do tripulante, para redução do treinamento inicial
text: '5.2.4.5.7 Avaliação de experiência prévia do tripulante, para redução do treinamento
  inicial

  5.2.4.5.7.1 A princípio, todos os treinamentos são válidos apenas para operações do próprio
  detentor

  de certificado, podendo a habilitação concedida a partir destes treinamentos ser usada

  também para operações segundo o RBHA 91, ou o RBAC que vier a substituí-lo. Dessa

  forma, é esperado que todos os tripulantes passem por treinamento inicial completo ao

  ingressar em uma nova empresa aérea. Porém, em situações específicas, poderá ser

  avaliado o aproveitamento dos treinamentos realizados por outro detentor de certificado

  ou outras entidades reconhecidas pela ANAC.

  5.2.4.5.7.2 Quando for apresentado pela empresa evidências que o piloto já seja habilitado
  na

  aeronave que irá voar na empresa, possua experiência prévia de voo neste equipamento e

  comprove que tenha realizado treinamento compatível com o treinamento da empresa, a

  ANAC, após avaliação, poderá conceder a redução da abrangência e/ou carga horário ou

  reconhecer o currículo de treinamento feito previamente em outro operador. A empresa

  deve externar sua opção através de FOP 108, apresentando documentos que permitam

  atestar a viabilidade do pedido. A ANAC, após proceder as análises pertinentes,

  comunicará a aceitação do pedido à empresa. Além da redução do treinamento de solo e

  de voo da aeronave, poderá haver redução ou abono de treinamentos como, por exemplo,

  de artigos perigosos, CRM, Sobrevivência no Mar, caso o piloto tenha realizado em outra

  empresa aérea e ainda tenham validade até o próximo treinamento periódico da empresa.

  5.2.4.5.7.3 Relevante mencionar que, nos casos em que houver abono do currículo de voo,
  a validade

  da habilitação previamente emitida será mantida o que poderá ensejar na necessidade de

  realização de treinamento periódico em prazo inferior aos 12 meses regulamentares.

  5.2.4.5.7.4 O doutrinamento básico de solo e a experiência operacional em rota nunca poderão
  ser

  dispensados, pois são treinamentos com particularidades de cada empresa.

  5.2.4.5.7.5 Recontratação de tripulante. A princípio, todo tripulante recém-contratado pelo

  detentor de certificado deverá receber o treinamento inicial completo. Porém,

  considerando-se o período em que o tripulante ficou desligado das operações do detentor

  de certificado, poderá ser solicitado procedimento alternativo, por meio de FOP 108. Caso

  o tripulante tenha se desligado por menos de 90 dias, pode não ser requerido nenhum

  treinamento adicional, devendo ser observado pelo detentor de certificado a validade de

  todos os treinamentos e exames realizados pelo tripulante. Caso algum treinamento não

  esteja mais válido, deverá ser realizado o respectivo treinamento de requalificação. Para

  desligamentos superiores a 90 dias, deverá ser exigido como procedimento alternativo,

  no mínimo, o treinamento de requalificação aplicável, além de uma revisão dos

  procedimentos operacionais do detentor de certificado, como MGO e SOP.'
