text: '5.2.4.6.2 Da mesma forma que os demais currículos de treinamento, o treinamento de
  instrutor de

  voo é específico para um determinado tipo de aeronave. Após ser qualificado para

  determinado tipo de aeronave por um detentor do certificado, caso se pretenda que o

  instrutor seja designado para outro tipo de aeronave, deverá ser realizado treinamento de

  transição. Tanto o treinamento de solo, quanto o treinamento de voo e o exame em voo

  são específicos para o tipo da aeronave.'
