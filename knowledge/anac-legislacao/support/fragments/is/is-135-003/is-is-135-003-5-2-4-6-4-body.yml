text: '5.2.4.6.4 Conforme disposto no parágrafo 135.340 (a)(2) do RBAC nº 135, a manutenção
  da

  proficiência como instrutor de voo se dá mediante condução satisfatória de instrução sob

  observação de um servidor designado da ANAC ou examinador credenciado empregado

  da empresa. O exame de observação pode ser acompanhado em parte ou no todo em uma

  aeronave, em um simulador de voo ou em um dispositivo de treinamento de voo.'
