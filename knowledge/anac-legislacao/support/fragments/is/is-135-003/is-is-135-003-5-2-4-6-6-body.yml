title: Após a realização satisfatória do treinamento para instrutor e do exame de observação
  por
text: '5.2.4.6.6 Após a realização satisfatória do treinamento para instrutor e do exame de
  observação por

  servidor designado da ANAC ou examinador credenciado, a designação do instrutor é

  completada pelo próprio detentor de certificado. Uma vez que tenha se certificado de que

  o instrutor cumpre os requisitos, conforme parágrafo anterior, o detentor de certificado

  deverá atualizar o registro individual do tripulante com a data de sua designação para a

  função de instrutor em determinado equipamento (cf. RBAC nº 135.63(a)(4)(iv)),

  podendo passar, assim, a utilizar o tripulante nesta função. Deverá ser atualizada no

  registro também a data de término do treinamento (cf. RBAC nº 135.63(a)(4)(x)).'
