title: A manutenção da proficiência como instrutor comissário de voo se dá mediante condução
text: '5.2.4.7.4 A manutenção da proficiência como instrutor comissário de voo se dá mediante
  condução

  satisfatória de instrução sob observação de um servidor designado da ANAC. O exame

  de observação pode ser acompanhado em parte ou no todo em uma aeronave, em um

  simulador de voo ou em um dispositivo de treinamento de voo.'
