title: Após a realização satisfatória do treinamento para instrutor e do exame de observação
  por
text: '5.2.4.7.6 Após a realização satisfatória do treinamento para instrutor e do exame de
  observação por

  servidor designado da ANAC, a designação do instrutor é completada pelo próprio

  detentor de certificado. Uma vez que tenha se certificado de que o instrutor cumpre os

  requisitos, conforme parágrafo anterior, o detentor de certificado deverá atualizar o

  registro individual do tripulante com a data de sua designação para a função de instrutor

  em determinado equipamento, podendo passar, assim, a utilizar o tripulante nesta função.

  Deverá ser atualizada no registro requerido pelo parágrafo 135.63(a)(5) do RBAC nº 135,

  a data de término do treinamento.'
