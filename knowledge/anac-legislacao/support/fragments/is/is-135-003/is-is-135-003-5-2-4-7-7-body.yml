title: As prerrogativas do tripulante como instrutor comissário de voo apenas são válidas
text: '5.2.4.7.7 As prerrogativas do tripulante como instrutor comissário de voo apenas são
  válidas

  enquanto o tripulante atender aos requisitos estabelecidos para a função, ainda que o

  treinamento e o exame para a função de instrutor estejam válidos. Caso, por exemplo, o

  tripulante deixe de realizar um treinamento ou exame periódico para comissário no

  período de elegibilidade, o tripulante não poderá mais ser utilizado como instrutor, até

  que volte a atender aos requisitos.'
