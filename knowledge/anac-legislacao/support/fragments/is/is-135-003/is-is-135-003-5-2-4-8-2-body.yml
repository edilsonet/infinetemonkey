title: Da mesma forma que os demais currículos de treinamento, o treinamento de examinador
text: '5.2.4.8.2 Da mesma forma que os demais currículos de treinamento, o treinamento de
  examinador

  credenciado é específico para um determinado tipo de aeronave. Após ser qualificado

  para determinado tipo de aeronave por um detentor do certificado, caso se pretenda que

  o examinador seja designado para outro tipo de aeronave, deverá ser realizado

  treinamento de transição. Tanto o treinamento de solo para pilotos e comissários, quanto

  o treinamento de voo para pilotos e o exame em voo são específicos para o tipo da

  aeronave.'
