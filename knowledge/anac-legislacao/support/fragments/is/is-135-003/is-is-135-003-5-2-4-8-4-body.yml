title: Conforme disposto na seção 135.339 (a)(2) do RBAC nº 135, a manutenção da
text: '5.2.4.8.4 Conforme disposto na seção 135.339 (a)(2) do RBAC nº 135, a manutenção da

  proficiência como examinador de voo se dará mediante a realização de um exame de

  proficiência ou competência conduzido sob a observação de servidor designado da

  ANAC ou examinador credenciado da empresa a cada 24 meses. O exame de observação

  pode ser realizado em parte ou no todo em uma aeronave, em um simulador de voo ou

  em um dispositivo de treinamento de voo.'
