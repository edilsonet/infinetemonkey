title: O treinamento para examinador credenciado é finalizado com um exame de observação,
text: '5.2.4.8.6 O treinamento para examinador credenciado é finalizado com um exame de observação,

  a ser realizado em voo. O exame de observação de examinador credenciado deverá ser

  realizado com um servidor designado da ANAC observando o examinador credenciado

  conduzir um exame com um terceiro piloto, que exercerá o papel de examinando. O

  examinador deverá proceder normalmente durante todo o exame, incluindo o briefing, o

  voo e o debriefing. O servidor designado da ANAC avaliará se o examinador conduz o

  exame de forma satisfatória, preenchendo a ficha de observação de examinador

  credenciado. A ficha de avaliação de piloto do examinando será preenchida, a princípio,

  pelo servidor designado da ANAC, porém poderá ser preenchida pelo examinador

  credenciado que estiver sendo observado, desde que este se encontre com seu

  credenciamento válido no momento do exame (caso se trate de um recredenciamento, por

  exemplo).'
