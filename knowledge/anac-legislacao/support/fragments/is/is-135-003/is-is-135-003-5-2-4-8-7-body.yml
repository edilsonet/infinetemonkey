title: Uma vez que o documento de credenciamento deve descrever os exames em voo que o
text: '5.2.4.8.7 Uma vez que o documento de credenciamento deve descrever os exames em voo
  que o

  piloto foi qualificado para aplicar conforme apresentado no parágrafo 135.303(a) do

  examinador, caso considere haver alguma limitação ao credenciamento. Caso o servidor

  designado da ANAC não registre qualquer limitação, considerar-se-á que o examinador

  poderá realizar todos os tipos de exame, com exceção do exame de observação de outro

  examinador credenciado. A atividade do examinador credenciado é restrita à condução

  dos exames de tripulantes contratados do próprio detentor de certificado pelo qual o

  examinador foi credenciado, exceto se de outra forma autorizado pela ANAC.'
