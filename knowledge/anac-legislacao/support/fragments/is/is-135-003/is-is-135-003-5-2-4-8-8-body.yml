title: Conforme seção 135.303 do RBAC nº 135, após a realização satisfatória do treinamento
text: '5.2.4.8.8 Conforme seção 135.303 do RBAC nº 135, após a realização satisfatória do
  treinamento

  para examinador credenciado, o detentor do certificado deve apresentar a petição de

  credenciamento para o escritório de certificação que o supervisiona. Uma vez analisada

  e sendo considerada hábil, os inspetores focais cadastrarão a demanda pelo exame de

  observação para credenciamento junto à Escala. Feito o exame, o detentor de certificado

  deverá apresentar a FAP com o resultado obtido para que, em sendo satisfatório, emita-

  se o ofício de credenciamento como examinador do tripulante. O ofício de

  credenciamento deverá descrever a categoria, classe ou tipo de aeronave, conforme

  aplicável, em que o piloto credenciado estiver qualificado (de acordo com o treinamentoData
  de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  e o exame apresentados) e os exames em voo que o piloto estiver qualificado (a princípio,

  todos os tipos de exame, com exceção do exame de observação de examinador

  credenciado, a não ser que o servidor designado da ANAC observador do exame tenha

  estabelecido limitações adicionais). Após receber o ofício de credenciamento, o detentor

  de certificado deverá atualizar o registro individual do tripulante com a data de sua

  designação para a função de examinador em determinado equipamento (cf. RBAC nº

  135.63(a)(4)(iv)), incluindo no registro uma cópia do ofício de credenciamento.'
