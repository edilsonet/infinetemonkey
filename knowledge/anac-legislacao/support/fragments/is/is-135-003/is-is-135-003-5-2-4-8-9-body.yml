title: As prerrogativas do tripulante como examinador credenciado apenas são válidas
text: '5.2.4.8.9 As prerrogativas do tripulante como examinador credenciado apenas são válidas

  enquanto o tripulante atender aos requisitos estabelecidos para a função - ainda que o

  treinamento e o exame para a função de examinador credenciado e o credenciamento

  estejam válidos. Caso, por exemplo, o tripulante deixe de realizar um treinamento ou

  exame periódico para piloto em comando no período de elegibilidade ou deixe de cumprir

  com os requisitos de experiência recente, o tripulante não poderá mais ser utilizado como

  examinador credenciado, até que volte a atender aos requisitos.'
