text: '5.2.5.1.1 O RBAC nº 135 estabelece os requisitos mínimos de conteúdo dos segmentos
  de

  currículo. Porém, a ANAC poderá requerer a inclusão de assuntos adicionais caso

  constate, por meio de auditorias nos detentores de certificado, publicações de novas

  avaliações operacionais de aeronaves, publicações de novos programas de treinamento

  aprovados pelas autoridades primárias de certificação, recomendações de segurança de

  voo (RSV) do Cenipa, ou outras evidências objetivas, que é necessária a inclusão de

  assuntos adicionais no programa de treinamento.'
