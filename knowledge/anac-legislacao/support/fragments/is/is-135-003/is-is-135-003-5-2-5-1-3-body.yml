text: '5.2.5.1.3 O escopo de cada segmento de currículo, representado pelo número de módulos
  e pelos

  elementos/eventos que os compõem, depende do tipo de treinamento sendo ministrado.

  Por exemplo, o segmento de currículo de solo de um treinamento de elevação de nível

  não precisa ser tão extenso e completo quanto o segmento de currículo de solo de um

  treinamento inicial. O nível de detalhe de cada módulo determina a carga horária

  requerida para completar o segmento de currículo.'
