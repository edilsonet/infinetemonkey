text: '5.2.5.1.4 O segmento de currículo não precisa detalhar, com texto descritivo, todo
  o conteúdo que

  será abordado no treinamento. Em vez disso, deve identificar os tópicos que serão

  ministrados com detalhes suficientes para garantir que as principais características serão

  cobertas durante a instrução e que os requisitos serão atendidos. O conteúdo sobre estes

  tópicos será melhor desenvolvido no material didático a ser utilizado no treinamento.'
