text: '5.2.5.1.5 Embora associado ao conteúdo do programa de treinamento, o material didático
  não faz

  parte do programa de treinamento. Assim, alterações no material didático podem ser

  realizadas sem necessidade de aprovação prévia por parte da ANAC, desde que

  mantenham vínculo com o programa de treinamento aprovado, não exigindo a remoção

  ou inserção de novos elementos ou eventos na descrição dos módulos de treinamento.'
