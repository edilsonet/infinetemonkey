section_title: 'Cada segmento de currículo deve incluir, pelo menos:'
subsection_id: d
cite: 5.2.5.1(d)
title: 5.2.5.1(d)
text: 'd) descrições detalhadas ou cartazes pictóricos das manobras, funções e

  procedimentos normais, anormais e de emergência que serão executados em cada

  fase de treinamento e de exames em voo, indicando as manobras, funções e

  procedimentos a serem desempenhados durante o treinamento e exames de voo. O

  detentor do certificado pode optar por apresentar as manobras, funções e

  procedimentos em outros manuais, porém, neste caso, como é parte do currículo de

  treinamento requerida pela seção 135.327 do RBAC nº 135, as manobras, funções

  e procedimentos devem ser submetidas como parte do currículo ou

  apropriadamente referenciadas no currículo;'
