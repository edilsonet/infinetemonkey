text: '5.2.5.4.1 A seguintes vias podem ser utilizadas por um detentor de certificado para
  a criação e

  apresentação dos currículos de solo da aeronave: utilizar o currículo de treinamento

  aprovado pela autoridade de certificação primária da aeronave, o que deve ser adotado e

  considerado como mínimo proposto para a elaboração dos currículos de treinamento

  sempre que existir, conforme parágrafo 135.341 (e) do RBAC nº 135, utilizar-se deData de
  emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  currículo de solo proposto e aprovado para outro operador 135 como base para a

  elaboração dos currículos, conforme o parágrafo 135.324(a) do RBAC nº 135, refletindo

  as particularidades de sua operação, ou propor seu próprio currículo de solo baseando-se

  no AFM/RFM, somente se não houver previsão de treinamento aprovado pela autoridade

  certificadora. Esta última opção pode ser utilizada nos casos em que nenhuma das

  possibilidades anteriores seja conveniente.'
