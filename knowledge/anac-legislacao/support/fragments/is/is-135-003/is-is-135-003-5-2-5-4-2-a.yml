title: 5.2.5.4.2(a)
text: 'a) conhecimentos técnicos da aeronave:

  I. características gerais e limitações dos sistemas da aeronave;

  II. princípios de funcionamento, operação e limitações operacionais dos motores

  da aeronave; influência das condições atmosféricas no desempenho dos

  motores; informações operacionais constantes do manual de voo;

  III. procedimentos operacionais normais, anormais e de emergência, conforme

  padrões estabelecidos no SOP;

  IV. limitações da aeronave; influência das condições atmosféricas no

  desempenho da aeronave de acordo com as informações do manual de voo;

  V. operação dos instrumentos da aeronave e procedimentos em caso de mau

  funcionamento;

  VI. prevenção de colisões em voo e uso do ACAS, se aplicável;

  VII. prevenção de CFIT e uso do GPWS/EGPWS, se aplicável;

  VIII. uso do piloto automático e outros sistemas de automação; e

  IX. procedimentos para a manutenção da aeronavegabilidade da aeronave, tais

  como verificações pré-voo, inspeções periódicas, verificação dos registros de

  manutenção, boletins de serviço e diretrizes de aeronavegabilidade em vigor;'
