text: '5.2.5.4.3 A ANAC não estabelece duração mínima ou máxima para o treinamento de solo.
  É de

  responsabilidade do detentor de certificado propor carga horária compatível com o perfil

  de seus tripulantes de modo a garantir a eficiência do treinamento. O instrutor deve liberar

  o aluno para o treinamento de voo após cumprida a carga horária e houver evidências

  objetivas de que este demonstrou possuir todo o conhecimento teórico necessário para

  realizar um voo seguro.'
