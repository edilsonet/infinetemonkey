text: '5.2.5.5.1 As seguintes vias podem ser utilizadas por um detentor de certificado para
  a criação e

  apresentação dos currículos de voo: utilizar o currículo de treinamento aprovado pela

  autoridade de certificação primária da aeronave, conforme o parágrafo 135.341 (e) do

  135 como base para a elaboração dos currículos, conforme parágrafo 135.324 (a) do

  currículo de voo, somente se não houver previsão de treinamento aprovado pela

  autoridade certificadora. Esta última opção pode ser utilizada nos casos em que nenhuma

  das possibilidades anteriores seja conveniente.'
