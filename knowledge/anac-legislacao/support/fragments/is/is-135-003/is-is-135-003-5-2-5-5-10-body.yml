text: '5.2.5.5.10 Embora o exame de competência em voo, requerido pelo parágrafo 135.293(b)
  do RBAC

  nº 135, possa ser único para diferentes aeronaves monomotoras que não sejam à reação,

  o treinamento de solo e de voo deve ser realizado para cada aeronave, conforme os

  parágrafos 135.345(b) e 135.347(a) do RBAC nº 135.'
