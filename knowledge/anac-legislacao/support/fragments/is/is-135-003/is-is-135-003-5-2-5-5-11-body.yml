text: '5.2.5.5.11 Nota-se que muitas avaliações operacionais não versam sobre todos os tipos
  de

  treinamento e currículos de voo aplicáveis. Tipos de treinamento que se encaixem nessa

  categoria, como por exemplo, treinamento de elevação de nível, transição, instrutor e

  examinador, devem ter seus currículos de voo desenvolvidos pelo operador que,

  considerando viável, poderá adotar currículos já existentes, ou seja, o currículo de voo
  do

  treinamento inicial, pode ser realizado para o treinamento de elevação de nível por

  exemplo.'
