title: Nos casos em que existir currículo de treinamento aprovado pela autoridade de
text: '5.2.5.5.2 Nos casos em que existir currículo de treinamento aprovado pela autoridade
  de

  certificação primária da aeronave, este passa a tornar-se o currículo mínimo. Ou seja,

  carga horária, matérias, metodologias, auxílios à instrução, simuladores etc deverão ser

  seguidas integralmente. Não há necessidade de ser transcrito no PrTrnOp, o currículo

  completamente, no entanto, o operador deve encaminhar o material usado como

  referência para a ANAC.

  5.2.5.5.2.1 Define-se que tal currículo de treinamento se refere, exclusivamente, à Avaliação

  Operacional (AVOP) do modelo de aeronave em análise (mesmo que este modelo de

  aeronave seja enquadrado como aeronave Classe no RBAC nº 61 em vigência), nãoData de emissão:
  12 de junho de 2020.

  IS nº 135-003

  Revisão D

  cabendo a verificação de qualquer outro currículo de treinamento aprovado pela

  autoridade primária de certificação da aeronave.

  5.2.5.5.2.2 Nos casos em que não houver AVOP emitida por parte da autoridade de certificação

  primária da aeronave mas existir AVOP emitida pela ANAC, essa passa a ser a baliza

  para análise do PrTrnOp proposto.'
