text: 'a) As cargas horárias a seguir definidas devem ser aplicadas a cada família de

  aeronaves acima definidas e ao tipo de operação realizado pelo operador.

  Carga Horária - Solo - aeronaves monomotoras

  Inicial Periódico Transição Elevação de nível

  Sob demanda VFR 4 4 4 4

  Sob demanda IFR 8 4 8 4

  LAS e op. complementar

  (somente asa fixa) 24 8 24 16Data de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

