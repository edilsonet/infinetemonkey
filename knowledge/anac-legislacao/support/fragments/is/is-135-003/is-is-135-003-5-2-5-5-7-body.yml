text: '5.2.5.5.7 Caso o detentor de certificado pretenda realizar treinamentos que tenham
  por finalidade

  conceder habilitações de classe aos seus pilotos, deve-se observar as cargas horárias e

  conteúdos constantes da Subparte J do RBAC nº 61.Data de emissão: 12 de junho de 2020.

