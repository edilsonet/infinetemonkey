title: A aquisição de experiência operacional é requerida de todos os tripulantes que irão
  atuar
text: '5.2.5.6.1 A aquisição de experiência operacional é requerida de todos os tripulantes
  que irão atuar

  como piloto em comando. Deve ser completada sob supervisão de um instrutor de voo do

  detentor de certificado (ou de entidade contratada, se for o caso), em operações

  comerciais segundo o RBAC nº 135. Porém, em caso de aeronaves em processo de

  inclusão nas especificações operativas, podem ser utilizados voos de traslado ou voos de

  avaliação operacional, desde que sejam realizados sob as regras do RBAC nº 135,

  simulando uma operação comercial.'
