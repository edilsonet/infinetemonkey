text: '5.2.5.6.2 Na aquisição de experiência operacional, o piloto sendo qualificado para
  piloto em

  comando deve ocupar a posição de piloto em comando, enquanto o instrutor deve ocupar

  a posição de segundo em comando. O piloto sendo qualificado deve exercer as funções

  de piloto em comando.'
