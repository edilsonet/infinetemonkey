title: 5.2.5.6.5(b)
text: 'b) tripulação da empresa acompanhada por piloto 91 habilitado na aeronave e com

  experiência recente comprovada:

  I. realização de voos com navegação para verificação do atendimento aos

  procedimentos operacionais da empresa, constantes de seu MGO e SOP. Os

  voos com navegação devem ser realizados até que se complete a carga horária

  relacionada definida no RBAC nº 135.'
