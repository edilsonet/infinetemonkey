text: '5.2.5.6.5 Para viabilização de aquisição de experiência operacional em rota para operadores
  135,

  quando da formação da primeira tripulação da nova aeronave da empresa, exclusivamente

  nos casos em que restaram exauridas as opções de contratação de piloto instrutor do

  fabricante da aeronave ou de piloto instrutor de congênere, os voos de teste de validação

  devem ser considerados para que a primeira tripulação do operador 135 adquira

  experiência operacional.

  5.2.5.6.5.1 Os voos de teste de validação devem ser conduzidos das seguintes maneiras:'
