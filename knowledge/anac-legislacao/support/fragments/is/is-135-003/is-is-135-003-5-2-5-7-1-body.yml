title: Os treinamentos especiais são os treinamentos requeridos para um tripulante qualificar-
text: '5.2.5.7.1 Os treinamentos especiais são os treinamentos requeridos para um tripulante
  qualificar-

  se para realizar determinados tipos de operação as quais a empresa está autorizada em

  suas especificações operativas, conforme requerido pelo parágrafo 135.329(e) do RBAC

  nº 135. Aqui encaixam-se, dentre outros, os treinamentos sobre PBN, RVSM, tráfego

  aéreo internacional, degelo, ETOPS, CAT II, HUET, sobrevivência na selva, etc.'
