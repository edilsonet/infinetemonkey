title: Cabe ao operador garantir que seus pilotos estejam treinados como condição para realizar
text: '5.2.5.7.2 Cabe ao operador garantir que seus pilotos estejam treinados como condição
  para realizar

  uma dada operação especial, podendo, para tal, treinar todo o grupo de pilotos ou partes

  dele conforme a necessidade. A carga horária e a periodicidade também devem ser

  propostas pelo operador.'
