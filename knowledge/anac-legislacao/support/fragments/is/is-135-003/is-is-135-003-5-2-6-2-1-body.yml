text: '5.2.6.2.1 O exame de competência é requerido para todos os pilotos, sejam pilotos em
  comando ou

  segundos em comando. O exame é composto por duas partes: teste oral ou escrito (cf.

  135.293(a)) e o exame de competência em voo (cf. 135.293(b)).'
