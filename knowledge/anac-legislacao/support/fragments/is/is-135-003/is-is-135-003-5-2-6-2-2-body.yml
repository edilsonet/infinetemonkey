title: O exame de competência é requerido para cada tipo de aeronave que o piloto pretenda
text: '5.2.6.2.2 O exame de competência é requerido para cada tipo de aeronave que o piloto
  pretenda

  operar pela empresa, com exceção de aviões monomotores que não sejam a reação (ou

  seja, com motor convencional ou turboélice), caso em que basta um exame na classe da

  aeronave.'
