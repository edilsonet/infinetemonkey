title: Conforme parágrafo 135.297(a) do RBAC nº 135, pilotos em comando de aeronaves que
text: '5.2.6.3.1 Conforme parágrafo 135.297(a) do RBAC nº 135, pilotos em comando de aeronaves
  que

  operem IFR precisam realizar um exame de proficiência em voo por instrumentos nos 6

  meses calendáricos precedentes à operação. O parágrafo 135.297(b) estabelece ainda que

  a realização de determinado procedimento de aproximação de precisão por instrumentos

  em condições IMC está condicionada à demonstração de proficiência na realização deste

  procedimento nos 6 meses calendários precedentes. Assim, no exame de proficiência em

  voo por instrumentos, devem ser realizados todos os procedimentos que o tripulante

  pretenda utilizar em suas operações pelo detentor de certificado. Caso algum

  procedimento não seja realizado no exame de proficiência em voo por instrumentos, o

  tripulante fica impedido de realizá-lo nas operações pelo detentor de certificado.'
