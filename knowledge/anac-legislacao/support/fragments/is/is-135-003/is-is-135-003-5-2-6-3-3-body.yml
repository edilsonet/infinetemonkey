text: '5.2.6.3.3 O exame deve incluir pelo menos um procedimento de aproximação direta, um

  procedimento com aproximação circulando para pouso e uma aproximação perdida. Cada

  tipo de aproximação deve ser conduzido até os mínimos aprovados para o procedimento

  sendo executado. Deve ainda incluir navegação por instrumentos, recuperação deData de emissão:
