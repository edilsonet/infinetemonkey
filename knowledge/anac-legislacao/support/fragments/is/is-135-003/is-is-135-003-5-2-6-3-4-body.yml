title: Conforme o parágrafo 135.297(c)(1) do RBAC nº 135, se o tripulante for operar um avião
text: '5.2.6.3.4 Conforme o parágrafo 135.297(c)(1) do RBAC nº 135, se o tripulante for operar
  um avião

  a reação ou um avião possuindo uma configuração para passageiros, excluído qualquer

  assento para tripulante, igual ou superior a 10 assentos, ou, ainda, um avião empregado

  em operações complementares, o exame de proficiência em voo por instrumentos deve

  incluir procedimentos e manobras requeridos pela seção 61.143 e, se aplicável, pelo

  parágrafo 61.213(a)(3) do RBAC nº 61. Para os demais, o exame de proficiência em voo

  por instrumentos deve incluir procedimentos e manobras requeridos pela seção 61.103 e,

  se aplicável, pelo parágrafo 61.213(a)(3) do RBAC nº 61.'
