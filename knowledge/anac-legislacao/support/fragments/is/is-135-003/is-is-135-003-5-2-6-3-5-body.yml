text: '5.2.6.3.5 Caso o exame de proficiência em voo por instrumentos seja utilizado para
  substituir o

  exame de competência, requerido pela seção 135.293 do RBAC nº 135, o servidor

  designado da ANAC ou o examinador credenciado deverão realizar o teste, oral ou

  escrito, abrangendo o conteúdo estabelecido no parágrafo 135.293(a) do RBAC nº 135.

  Ainda, poderá incluir qualquer das manobras e procedimentos normalmente requeridos

  para a emissão original da particular licença de piloto requerida para as operações

  autorizadas e apropriadas para a categoria, classe ou tipo da aeronave envolvida.'
