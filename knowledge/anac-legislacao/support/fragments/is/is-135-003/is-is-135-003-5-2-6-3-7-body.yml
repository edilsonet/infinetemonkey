title: O exame de proficiência em voo por instrumentos não é específico por aeronave. Os
text: '5.2.6.3.7 O exame de proficiência em voo por instrumentos não é específico por aeronave.
  Os

  parágrafos 135.297(d), (e) e (f) estabelecem os tipos de aeronaves que poderão ser

  utilizados para realização do exame de proficiência em voo por instrumentos.

  Basicamente, o tripulante precisa realizar o exame a cada 6 meses. Caso voe mais de um

  tipo de aeronave, não é necessário fazer um exame em cada aeronave a cada 6 meses:

  basta fazer o exame em uma das aeronaves. Porém, os próximos exames deverão ser

  realizados, rotativamente, nas outras aeronaves. Caso o tripulante opere aeronaves

  monomotoras e multimotoras, deverá iniciar a alternância pela aeronave multimotora.'
