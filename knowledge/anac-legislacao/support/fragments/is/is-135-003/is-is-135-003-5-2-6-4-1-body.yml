title: O exame em rota é requerido de todos os tripulantes que atuarão como piloto em
text: '5.2.6.4.1 O exame em rota é requerido de todos os tripulantes que atuarão como piloto
  em

  comando. É requerido, em um treinamento inicial ou de transição, ao final do período de

  aquisição de experiência operacional, como verificação final antes da designação do

  tripulante como piloto em comando da aeronave pelo detentor de certificado. Após o

  tripulante estar qualificado, o exame em rota deve ser repetido a cada 12 meses.'
