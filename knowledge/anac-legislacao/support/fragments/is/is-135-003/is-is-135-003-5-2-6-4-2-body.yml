title: O exame em rota não é específico por aeronave. Assim, na realização do exame em rota
text: '5.2.6.4.2 O exame em rota não é específico por aeronave. Assim, na realização do exame
  em rota

  periódico, o tripulante pode utilizar qualquer das aeronaves para as quais esteja

  qualificado. Recomenda-se que seja feito um rodízio entre as aeronaves operadas, da

  mesma forma que é requerido para o exame de proficiência em voo por instrumentos,Data de
  emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D

  especialmente se houver diferenças significativas entre os modelos (por exemplo, uma

  aeronave monomotora de motor convencional e um avião a reação; ou um avião e um

  helicóptero). Caso a ANAC detecte que o tripulante realizou os dois últimos exames em

  aeronaves similares e deixou de realizar em aeronave de características diversas, a ANAC

  pode determinar o modelo de aeronave a ser utilizado no próximo exame em rota.'
