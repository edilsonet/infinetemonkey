text: '5.2.6.4.4 Preferencialmente, o exame em rota deveria ser realizado em operações comerciais.

  Quando isto não for possível, em razão de ausência de demanda ou de incompatibilidade

  de agendas, por exemplo, o exame deve simular uma operação comercial.'
