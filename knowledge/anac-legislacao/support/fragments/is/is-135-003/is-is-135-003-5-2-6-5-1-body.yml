title: O exame de observação de instrutor de voo é realizado com o instrutor ministrando
text: '5.2.6.5.1 O exame de observação de instrutor de voo é realizado com o instrutor ministrando

  treinamento de voo em aeronave ou simulador, sob a observação de um servidor

  designado da ANAC ou de um examinador credenciado.'
