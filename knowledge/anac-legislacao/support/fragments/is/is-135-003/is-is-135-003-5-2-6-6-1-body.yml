title: O exame de observação de examinador credenciado é realizado com o examinador
text: '5.2.6.6.1 O exame de observação de examinador credenciado é realizado com o examinador

  conduzindo um exame de competência (cf. 135.293) ou proficiência em voo por

  instrumentos (cf. 135.297) em aeronave ou simulador, sob a observação de um servidor

  designado da ANAC ou de um examinador credenciado da empresa.'
