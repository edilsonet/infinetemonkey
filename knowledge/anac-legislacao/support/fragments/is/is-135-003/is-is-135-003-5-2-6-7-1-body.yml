title: O exame de observação de examinador credenciado OPS é realizado com o examinador
text: '5.2.6.7.1 O exame de observação de examinador credenciado OPS é realizado com o examinador

  conduzindo um exame em rota (cf. 135.299), sob a observação de um servidor designado

  da ANAC ou de um examinador credenciado ou examinador credenciado OPS da

  empresa.Data de emissão: 12 de junho de 2020.

  IS nº 135-003

  Revisão D'
