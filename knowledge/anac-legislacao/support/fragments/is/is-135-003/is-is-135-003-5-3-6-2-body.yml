title: Aprovação inicial é o documento emitido pela ANAC que autoriza o detentor de
text: '5.3.6.2 Aprovação inicial é o documento emitido pela ANAC que autoriza o detentor de

  certificado a ministrar treinamento para qualificar seu pessoal de acordo com os

  currículos apresentados, condicionado a uma avaliação da efetividade desse treinamento.

  A aprovação inicial estende-se a todos os treinamentos propostos no PrTrnOp e é o

  reconhecimento que o programa não contradiz qualquer requisito dos RBACs aos quais

  a empresa é afeta.'
