title: A aprovação final é o documento emitido pela ANAC que autoriza o detentor de
text: '5.3.6.3 A aprovação final é o documento emitido pela ANAC que autoriza o detentor de

  certificado a continuar ministrando um treinamento de acordo com os currículos

  aprovados, desde que não haja alterações nas especificações operativas, nos requisitos

  aplicáveis ou a introdução de novo treinamento que demande modificações no PrTrnOp.

  Para conceder a aprovação final de um programa que já possua aprovação inicial, a

  ANAC procederá a uma campanha de acompanhamentos de treinamento de modo a

  atestar a eficiência do treinamento. Para tanto, um número representativo de diferentes

  tipos de treinamento deverá ser acompanhado na íntegra pelo período de 24 meses. A

  aprovação final é emitida para determinados tipos de treinamento conforme os mesmos

  forem sendo executados pelo operador e avaliados pela ANAC.'
