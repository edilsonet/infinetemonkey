text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 135-003

  Revisão D

  Aprovação: Portaria nº 1495/SPO, de 5 de junho de 2020.

  Assunto: Procedimentos para elaboração e efetivação de programas

  de treinamento operacional (PrTrnOp) para operações

  conduzidas segundo o RBAC nº 135

  1 OBJETIVO

  1.1 Apresentar uma metodologia que propicie a elaboração de programa de treinamento

  operacional (PrTrnOp) aceitável pela ANAC, que assegure treinamento adequado ao

  desempenho das atribuições de cada tripulante, instrutor de voo, examinador credenciado

  e pessoa executando ou supervisionando diretamente qualquer das funções de trabalho

  envolvendo o transporte de artigos perigosos: aceitação; rejeição; manuseio; armazenagem

  suplementar; embalagem de material da empresa; ou carregamento, e que conduzam

  operações segundo o RBAC nº 135, em consonância ao requerido nas subpartes E, G, H

  e K do RBAC nº 135.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação e revisão do PrTrnOp,

  desde sua submissão à análise da ANAC até a emissão de aprovação inicial e final.

  2 REVOGAÇÃO

  Esta IS revoga a IS nº 135-003 Revisão C.

  3 FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução

  Suplementar - IS, norma suplementar de caráter geral editada pelo Superintendente da

  área competente, objetivando esclarecer, detalhar e orientar a aplicação de requisito

  previsto em RBAC.

