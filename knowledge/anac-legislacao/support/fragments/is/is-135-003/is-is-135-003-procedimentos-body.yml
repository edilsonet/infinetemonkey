title: procedimentos
text: 'procedimentos

  normais e 2 (duas)

  horas de

  procedimentos não

  normais e de

  emergência. O

  examinador-aluno

  deve ser avaliado

  pelo instrutor na

  realização dos

  briefings e

  debriefings e o

  preenchimento das

  fichas.

  Solo - Inicial Examinador Comissário

  Requisito Ementa Carga

  horária Observações

  Método

  aceitável

  (1) atribuições, responsabilidades e

  funções de um examinador comissário

  de voo;

  (2) as aplicáveis provisões deste

  regulamento, dos regulamentos

  aeronáuticos e das políticas e

  procedimentos do detentor de

  certificado;

  (3) os apropriados métodos,

  procedimentos e técnicas para

  conduzir os exames requeridos;

  (4) a adequada avaliação do

  desempenho de um comissário de voo,

  incluindo a identificação de: (i)

  treinamento inadequado ou

  insuficiente; e (ii) características

  pessoais de um requerente que possam

  afetar adversamente a segurança.

  (5) as ações corretivas no caso de

  exames insatisfatórios; e

  (6) os métodos, procedimentos e

  limitações aprovados para a execução

  dos procedimentos normais, anormais

  e de emergência da aeronave.

  2 horas (se

  instrutor da

  empresa)

  ou 8 horas

  (se não

  instrutor da

  empresa)

  Este módulo deve

  abranger instruções

  referentes

  elaboração e leitura

  das Fichas de

  avaliação,'
