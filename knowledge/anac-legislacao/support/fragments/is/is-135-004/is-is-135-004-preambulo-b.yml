text: 'b) Certificado de conclusão

  e aprovação.

  Certificado médico

  aeronáutico válido, se o

  exame ou parte dele for

  realizado em voo.

  Não Aplicável Não é aplicável o envio de

  documento comprobatório.

  Licença e habilitação na

  classe/tipo de aeronave. Não Aplicável Não é aplicável o envio de

  documento comprobatório.

  Curso de examinador

  credenciado da ANAC.

  Certificado de conclusão e

  aprovação.

  O curso aceito de examinador

  credenciado é o relativo ao RBAC nº

  135 ou ao RBAC nº 121.

  Serão aceitos certificados emitidos

  há, no máximo, quatro anos da data

  de solicitação do credenciamento.

  5.2 Cada solicitação de credenciamento de comissário examinador deve englobar, no

  máximo, uma habilitação de classe/tipo (cf. o RBAC nº 61.5 (b)(2) e (b)(3)).

  5.3 Os processos de renovação de credenciamento serão tratados de forma idêntica aos

  processos de concessão inicial de credenciamento.

  5.4 Durante a avaliação da solicitação de credenciamento de comissário examinador, é

  estabelecido o limite de 3 iterações. Caso a resposta a uma mesma não-conformidade em

  manifestação conclusiva da organização requerente seja rejeitada pela 3ª vez, o processo

  de credenciamento será arquivado compulsoriamente, independentemente de prazo.

  5.5 No caso de serem identificadas não conformidades, o operador deve encaminhar as

  correções ao EsEC utilizando o modelo de ofício do Apêndice C desta IS, observando-se

  o prazo máximo de resposta de 90 (noventa) dias, após o qual o processo será

  automaticamente arquivado.

  5.6 Após a verificação dos requisitos e documentos comprobatórios, o EsEC preencherá uma

  autorização para a realização do exame prático. Ressalta-se que o exame prático somente

  poderá ser realizado após a autorização emitida pelo EsEC e executado por quem o EsEC

  determinar (examinador credenciado ou servidor designado da ANAC).

  5.7 A Ficha de Observação de Examinador deve ser enviada ao EsEC que procederá com a

  análise final para a emissão do credenciamento.Data de emissão: 29 de setembro de 2017 IS
  nº 135-004

  Revisão A

  5.8 No caso de reprovação no exame prático, o comissário de voo candidato a examinador

  credenciado só poderá ser novamente indicado pela empresa após:'
