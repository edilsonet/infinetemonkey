text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS No 135-004

  Revisão A

  Aprovação: Portaria nº 3.226/SPO, de 22 de setembro de 2017.

  Assunto: Procedimentos para credenciamento de comissário de voo

  como examinador em operador sob o RBAC nº 135.

  1 OBJETIVO

  Estabelecer o procedimento de credenciamento de comissário de voo como examinador

  em um operador regido pelo RBAC nº 135, para realizar os exames de comissário de voo

  permitidos por aquele Regulamento.

  2 REVOGAÇÃO

  Não aplicável.

  3 FUNDAMENTOS

  3.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar

  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,

  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.2 O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de

  requisito previsto em RBAC, poderá:'
