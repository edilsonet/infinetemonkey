cite: preambulo(i)
title: preambulo(i)
text: 'i) anunciar, sugerir ou permitir aos examinandos se utilizarem de métodos ilícitos
  para

  a aprovação no exame;

  ii) exercer suas prerrogativas durante o prazo de suspensão de sua licença, habilitação

  ou credenciamento;

  iii) impedir o acesso dos servidores designados da ANAC a quaisquer das fases do

  exame ou a qualquer documento a ele relacionado;

  iv) tiver conduta inidônea em seu relacionamento com a administração pública ou com

  o público em geral;'
