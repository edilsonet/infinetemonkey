cite: preambulo(v)
title: preambulo(v)
text: 'v) fornecer informações falsas, negar-se a prestar informações quando requerido ou

  obstar a fiscalização da ANAC;

  vi) valer-se da função para obter ou tentar obter vantagens para si ou para terceiros;

  vii) deixar de fazer cumprir regulamentação da ANAC durante atividade de

  examinador;

  viii) tiver sofrido, nos últimos 5 (cinco) anos ou após o credenciamento, por decisão

  administrativa transitada em julgado, sanção por descumprimento a preceitos contidos

  na Lei nº 7.565, de 19 de dezembro de 1986; ou

  ix) tiver reincidência de aplicação do exame em desacordo com os critérios

  estabelecidos pela ANAC, após primeira advertência.Data de emissão: 29 de setembro de 2017
  IS nº 135-004

  Revisão A

  7 APÊNDICES

  7.1 Apêndice A - Controle de alterações

  7.2 Apêndice B - Modelo de requerimento de credenciamento de comissário examinador

  7.3 Apêndice C - Modelo de ofício de encaminhamento das correções das não conformidades

  8 DISPOSIÇÕES FINAIS

  8.1 Os casos omissos serão dirimidos pela SPO.

  8.2 Esta IS entra em vigor na data de sua publicação.Data de emissão: 29 de setembro de
  2017 IS nº 135-004

  Revisão A'
