text: '5.2.3 A tripulação deve ter treinamento específico para a condução das operações aeromédicas
  do operador aéreo, conforme estabelecido nesta IS.


  5.3 Treinamento de Tripulantes

  5.3.1 Além das habilitações, qualificações e treinamentos requeridos para os tripulantes
  pelos demais regulamentos aplicáveis, o operador aéreo deve elaborar e implementar um programa
  de treinamento específico para as operações aeromédicas.'
