text: 'c) ser registrada em formulário próprio e arquivada na pasta individual do tripulante;


  5.3.6 O operador aéreo deverá definir a carga horária mínima para cada componente curricular
  e para os exercícios práticos, observado o seu ambiente operacional e o nível de tolerabilidade
  do risco à segurança operacional.

  5.3.7 Conforme atribuição específica do tripulante, os currículos de treinamento poderão
  ser complementados com instruções de solo e de voo, exercícios práticos ou outros procedimentos
  julgados pertinentes.

  5.3.8 Para o exercício da função em outro operador aéreo, é recomendável que o tripulante
  realize treinamento de ambientação, caso este operador aéreo considere pertinente, após
  análise comparativa dos componentes curriculares dos programas de treinamento envolvidos.


