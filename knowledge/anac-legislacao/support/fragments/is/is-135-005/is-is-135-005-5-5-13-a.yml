title: 5.5.13(a)
text: a) sistema de intercomunicação que permita a comunicação entre a tripulação e os profissionais
  de saúde, quando aplicável. Este sistema é particularmente importante se o nível de ruído
  da cabine estiver acima de 72dB e para aqueles casos em que o profissional de saúde precise
  falar imediatamente com a tripulação de voo sobre a condição médica de um paciente; e
