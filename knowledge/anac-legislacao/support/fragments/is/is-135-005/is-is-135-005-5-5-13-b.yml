section_id: 5.5.13
section_title: 'É recomendável a utilização dos equipamentos e acessórios abaixo:'
subsection_id: b
cite: 5.5.13(b)
title: 5.5.13(b)
text: 'b) sistema suplementar de iluminação interna para o cuidado adequado do paciente, observado
  que não haja interferência na condução da aeronave durante operações noturnas, quando aplicável.

  Nota 1: Qualquer instalação de equipamento na aeronave deve ser feita conforme dados técnicos
  aceitos ou aprovados pela ANAC.

  Nota 2: Não é permitido utilizar ou autorizar a utilização de qualquer dispositivo eletrônico
  portátil, incluindo equipamentos eletrônicos médicos portáteis, em qualquer aeronave civil
  registrada no Brasil operando segundo o RBAC nº 135, exceto se o detentor de certificado
  emitido segundo o RBAC nº 119 tiver determinado que o equipamento não cause interferência
  nos sistemas de navegação ou de comunicações da aeronave na qual ele será utilizado, conforme
  estabelecido na seção 135.144 do RBAC nº 135.

  5.6 Procedimentos para a Operação Aeromédica

  5.6.1 Além dos itens requeridos pelas seções 135.21 e 135.23 do RBAC nº 135, o operador
  aéreo deverá incluir, em seu Manual Geral de Operações (MGO), nos procedimentos operacionais
  padronizados (SOP), no Programa de Treinamento Operacional (PTO) e no Manual Geral de Manutenção
  (MGM) os procedimentos, as instruções detalhadas de atividades, dos equipamentos, treinamentos,
  documentações e ações específicas e necessárias para a realização das operações aeromédicas,
  bem como qualquer outra instrução de responsabilidade do operador aéreo vinculada à operação,
  manutenção e treinamento. Alternativamente e a critério do operador, os procedimentos e
  instruções podem ser consolidados em um manual dedicado à operação aeromédica.'
