title: 5.6.2(f)
text: 'f) ações e procedimentos especiais que possam ser requeridos no transporte de pacientes,
  tais como:

  i. procedimentos que requeiram coordenação entre os profissionais de saúde e os tripulantes;

  ii. emergências em voo e evacuação de emergência, quando conduzindo pacientes a bordo; e

  iii. procedimentos especiais de solo (embarque, rolagem, carga, descarga, etc.).

  5.6.3 Recomenda-se que sejam desenvolvidos procedimentos para notificar o operador aeroportuário
  quando a operação aeromédica envolver agentes QBRN (Químico, Biológico, Radiológico e Nuclear).

  5.7 Instruções Específicas - Peso e Balanceamento

  5.7.1 O programa de peso e balanceamento deve considerar o peso real dos profissionais de
  saúde, dos tripulantes e dos pacientes. Alternativamente, é aceitável a utilização de pesos
  médios se o procedimento for aprovado no MGO do operador aéreo.

  5.8 Pouso ou Decolagem em Local não Cadastrado pela ANAC

  5.8.1 As operações de pouso e decolagem em áreas não cadastradas pela ANAC são permitidas
  para helicópteros nas condições previstas no parágrafo 135.229(d) do RBAC n° 135, devendo
  ser obedecido também o disposto nas seções 91.329 e 91.331 do RBAC nº 91. Aplica-se ainda
  a seção 135.77 do RBAC n° 135 no que concerne às responsabilidades envolvidas quanto ao
  controle operacional.

  5.8.2 Nas situações previstas no item 5.8.1, não há vedação para a realização de remoção
  de pacientes segundo as condições regidas pelo RBAC nº 135, como por exemplo a partir de
  uma estrada ou rodovia, desde que se cumpra com o parágrafo 135.229(d) do RBAC nº 135 e
  o resgate do paciente ocorra dentro de um contexto de risco controlado, ou seja, não estejam
  presentes circunstâncias ativas de risco como incêndios, tumulto, tiroteio, dentre outras.

  Nota: Em situações em que estejam presentes condições ativas de risco como incêndios, tumulto,
  tiroteio, dentre outras, a operação deve ser feita por uma UAP, em consonância com as regras
  previstas no RBAC nº 90.

  5.8.3 Adicionalmente, a Resolução nº 623, de 7 de junho de 2021, estabeleceu regras específicas
  para a utilização de áreas não cadastradas, em terra, situadas na Amazônia Legal para pouso
  e decolagem de aviões, o que pode incluir operações aeromédicas. A Resolução tem caráter
  transitório, podendo ser revogada a qualquer tempo.

