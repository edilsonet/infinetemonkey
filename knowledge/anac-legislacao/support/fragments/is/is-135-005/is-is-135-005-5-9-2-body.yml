text: '5.9.2 A aprovação operacional para operações aeromédicas será realizada seguindo os
  procedimentos contidos no item 5.3.9 da IS nº 119-004.

  5.9.3 A aprovação de uma operação aeromédica para detentores de certificado que operem sob
  as regras do RBAC n°135 dá-se por meio da revisão das suas Especificações Operativas.

  5.9.4 Nas próximas seções desta IS são citados formulários FOP, os quais são referenciados
  no item 5.2.5 da IS nº 119-004. Os respectivos modelos de formulários, em sua versão mais
  atualizada, estão disponíveis para o usuário em formato editável no sítio eletrônico da
  ANAC na rede mundial de computadores, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.'
