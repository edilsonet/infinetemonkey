section_id: 5.9.6.3
section_title: 'A solicitação formal para obtenção de aprovação para a condução de operações
  aeromédicas deve conter as seguintes informações e documentação:'
subsection_id: b
cite: 5.9.6.3(b)
title: 5.9.6.3(b)
text: b) documentação de aeronavegabilidade que indique que os equipamentos instalados na
  aeronave para suporte à atividade aeromédica foram instalados de acordo com um projeto de
  tipo aprovado pela ANAC por meio da emissão de um Certificado de Tipo (CT), de um Certificado
  Suplementar de Tipo (CST), de uma emenda ao CT original ou por meio de aprovação em Campo
  3 do formulário F-400-04 (SEGVOO 001) ou similar;
