title: 5.9.6.3(e)
text: e) revisão do MGO, MGM, SOP, PTO e outros manuais ou programas, conforme necessário,
  ou envio de um manual aeromédico dedicado com descrição de como serão realizadas as atividades
  de planejamento e liberação de voo nas operações aeromédicas, assim como políticas, procedimentos
  e treinamentos relacionados à operação aeromédica;
