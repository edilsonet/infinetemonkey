section_id: 5.9.6.3
section_title: 'A solicitação formal para obtenção de aprovação para a condução de operações
  aeromédicas deve conter as seguintes informações e documentação:'
subsection_id: g
cite: 5.9.6.3(g)
title: 5.9.6.3(g)
text: g) caso possua programação de manutenção aprovada, comprovação de que a programação
  foi revisada para contemplar as tarefas previstas na documentação referente à grande alteração
  da aeronave (CT, CST, STC, SEGVOO 001, etc.) e tenha sido submetida à aprovação da ANAC,
  em linha com o previsto na IS n° 120-016. Em todos os casos, o operador aéreo deverá demonstrar
  que atualizou o seu controle de manutenção com as tarefas previstas na documentação referente
  à grande alteração da aeronave;
