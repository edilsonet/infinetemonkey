section_title: 'A solicitação formal para obtenção de aprovação para a condução de operações
  aeromédicas deve conter as seguintes informações e documentação:'
subsection_id: h
cite: 5.9.6.3(h)
title: 5.9.6.3(h)
text: 'h) comprovação de que o operador tem controle sobre as Instruções para Aeronavegabilidade
  Continuada (ICA) e que todas essas instruções foram controladas e cumpridas conforme previsto;

  i ) ficha de pesagem e balanceamento, juntamente com a planta baixa na configuração desejada,
  assinadas por pessoa autorizada, conforme previsto no RBAC n° 43 e conforme a seção 135.185
  do RBAC n° 135;'
