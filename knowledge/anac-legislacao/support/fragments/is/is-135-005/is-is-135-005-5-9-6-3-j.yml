section_id: 5.9.6.3
section_title: 'A solicitação formal para obtenção de aprovação para a condução de operações
  aeromédicas deve conter as seguintes informações e documentação:'
subsection_id: j
cite: 5.9.6.3(j)
title: 5.9.6.3(j)
text: 'j) proposta de plano para demonstração da capacidade do operador de executar operações
  aeromédicas. O plano deve abordar, no mínimo, os seguintes itens:


  equipamentos aeromédicos que serão utilizados;

  treinamento para tripulação, pessoal de manutenção, pessoal de solo e demais profissionais
  envolvidos; e

  . procedimentos de despacho e liberação de voo para operações aeromédicas.'
