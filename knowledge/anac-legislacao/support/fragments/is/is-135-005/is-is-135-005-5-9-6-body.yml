title: Fase 2 - Solicitação Formal para Condução de Operações Aeromédicas
text: '5.9.6 Fase 2 - Solicitação Formal para Condução de Operações Aeromédicas

  5.9.6.1 Essa fase se inicia quando o operador entrega a sua solicitação formal para condução
  de operações aeromédicas, acompanhada de todos os documentos que foram estabelecidos durante
  a Fase 1.

  5.9.6.2 Durante essa fase, o servidor responsável pelo processo de aprovação da operação
  aeromédica do operador aéreo analisa previamente a documentação acordada a fim de se certificar
  de que toda ela foi entregue e que não existem erros óbvios que impediriam a sua aceitação.'
