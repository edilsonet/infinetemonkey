title: A critério da ANAC, a fase 4 poderá ser dispensada.
text: '5.9.8.4 A critério da ANAC, a fase 4 poderá ser dispensada.

  5.9.8.5 Se os equipamentos aeromédicos não estiverem disponíveis e totalmente operacionais
  ou se ocorrer um número excessivo de dificuldades operacionais ou falhas durante a fase
  de demonstração, uma ação que atenda diretamente às deficiências deve ser considerada pelo
  operador aéreo. Essa ação pode incluir ajustes em procedimentos ou treinamento para pilotos,
  tripulantes, pessoal de manutenção ou profissionais autorizados a exercer o controle operacional.'
