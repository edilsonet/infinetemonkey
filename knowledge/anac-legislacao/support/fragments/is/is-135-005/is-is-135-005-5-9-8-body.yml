title: FASE 4 - Demonstrações e Inspeções
text: '5.9.8 FASE 4 - Demonstrações e Inspeções

  5.9.8.1 Durante a fase 4, os servidores da ANAC avaliarão a efetividade das políticas, métodos,
  procedimentos e instruções aplicáveis conforme descrito nos manuais, programas e documentos
  apresentados para a operação aeromédica.

  5.9.8.2 A Fase 4 poderá ser composta de atividades de verificação documental, atividades
  à distância e atividades de campo. A modalidade das atividades que irão compor a Fase 4
  será determinada pela ANAC de acordo com as características da operação proposta e de acordo
  com o andamento do processo de autorização.

  5.9.8.3 Durante a Fase 4 poderá ser solicitada ao operador aéreo a comprovação de treinamento
  da tripulação de voo para operações aeromédicas com apresentação de cópias dos certificados,
  e respectivos currículos, obtidos por cada um dos tripulantes nos treinamentos realizados
  de acordo com seção 5.3 desta IS.'
