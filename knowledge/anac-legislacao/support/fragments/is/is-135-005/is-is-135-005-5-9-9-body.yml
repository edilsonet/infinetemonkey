title: FASE 5 - Certificação
text: '5.9.9 FASE 5 - Certificação

  5.9.9.1 Quando todos os itens pendentes das fases 3 e 4 forem solucionados, a ANAC emitirá
  uma emenda às Especificações Operativas para permitir a realização de operações aeromédicas.

  5.9.9.2 Somente a partir deste momento os operadores aéreos sob o RBAC n° 135 poderão iniciar
  as suas operações aeromédicas. As Especificações Operativas devem ser mantidas a bordo da
  aeronave para eventuais fiscalizações da ANAC e de outras Autoridades de Aviação Civil (AAC).'
