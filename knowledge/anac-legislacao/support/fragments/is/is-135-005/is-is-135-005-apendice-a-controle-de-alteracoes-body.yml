text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES

  DISPOSIÇÕES TRANSITÓRIAS E FINAIS

  7.1 Novas solicitações para autorização de realização de operação aeromédica protocoladas
  após a vigência desta IS serão avaliadas sob as suas diretrizes, não sendo mais utilizada
  a IAC 3134-0799.

  7.1.2 O operador que já possua autorização para realização de operação aeromédica emitida
  conforme a IAC 3134-0799 poderá manter as suas operações por um período de 12 (doze) meses
  após a vigência desta IS, com base nos procedimentos já estabelecidos em seus manuais. Para
  a manutenção da autorização após esse prazo, deve ser realizada adequação ao previsto nesta
  IS.

  7.3 Os casos omissos serão dirimidos pela ANAC.


  APÊNDICE A - CONTROLE DE ALTERAÇÕES

  Não aplicável a Revisão A'
