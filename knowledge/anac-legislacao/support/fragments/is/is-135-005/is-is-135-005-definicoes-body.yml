title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidas as definições listadas na seção 01.1 do RBAC nº
  01 e as definições a seguir:

  4.1.1 Ambulância aérea: aeronave de asa fixa ou rotativa, de suporte avançado de vida, configurada
  com equipamentos médicos, fixos ou removíveis, com insumos mínimos necessários para o nível
  de atendimento a ser prestado por profissional de saúde capacitado para exercer função a
  bordo.'
