title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Aplicabilidade

  5.1.1 Esta Instrução Suplementar (IS) estabelece regras e orientações aplicáveis aos operadores
  aéreos que pretendam obter autorização para a realização de operações aeromédicas de transporte
  de pacientes (enfermos), por meio de ambulância área de suporte avançado de vida, em consonância
  com os requisitos estabelecidos em RBAC e com a legislação e/ou regulamentação específica
  vigente.

  5.1.2 A operação aeromédica deve ser realizada por um detentor de Certificado de Operador
  Aéreo (COA), certificado segundo o RBAC nº 119 para operar de acordo com as regras do RBAC
  nº 135. Tal detentor de certificado é referenciado nesta IS simplesmente como “operador
  aéreo".

  5.1.3 Um operador aéreo deve obter e manter Especificações Operativas (EO) para cada operação
  a ser conduzida, para cada modelo de aeronave a ser operado. O operador aéreo deve obter
  a autorização para realizar operação aeromédica para cada modelo de aeronave que pretenda
  usar nesse tipo de operação.

  5.1.4 Esta IS não se aplica a operações em situações de risco ativas (ex: incêndios, tumulto,
  tiroteio, etc.), as quais devem ser realizadas por Unidade Aérea Pública (UAP), conforme
  os requisitos estabelecidos no RBAC n° 90. Entretanto, não há impedimento para a realização
  de resgate de paciente segundo as condições regidas pelo RBAC nº 135, desde que não haja
  situações ativas de risco, e contanto que se cumpra com o previsto no parágrafo 135.229(d)
  do RBAC nº 135, conforme detalhado no item 5.8 desta IS.


  5.2 Pessoal Requerido para a Operação Aeromédica

  5.2.1 O pessoal de administração requerido para um detentor de certificado que opere segundo
  o RBAC n° 135, incluindo o operador aeromédico, está estabelecido na seção 119.69 do RBAC
  n° 119, e deve cumprir com as qualificações previstas na seção 119.71 daquele regulamento.

  5.2.2 Além das funções requeridas pela ANAC, pode haver outras funções definidas pelo operador
  aéreo ou requeridas pelos conselhos profissionais de saúde (CFM e COFEN) ou por outras entidades
  de saúde. Contudo, funções ou posições que não tenham relação direta com a segurança operacional
  não são submetidas ao crivo da ANAC e não constarão nas Especificações Operativas do operador
  aeromédico.'
