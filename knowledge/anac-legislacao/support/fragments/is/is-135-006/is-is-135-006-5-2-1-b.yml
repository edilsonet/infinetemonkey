cite: 5.2.1(b)
title: 5.2.1(b)
text: 'b) requisitos de suprimento de combustível e óleo lubrificante: 135.209.

  Nota: embora não constem requisitos de aeródromos de alternativa para voos VFR explicitamente
  na Subparte B do RBAC nº 135, pode ocorrer de um aeródromo de alternativa de destino ser
  requerido pelos requisitos de desempenho da Subparte I do RBAC nº 135, como, por exemplo,
  pelos parágrafos 135.375(b) e 135.385(c) e (g).'
