title: 5.2.2(a)
text: a) a seção 135.207, aplicável para operações com helicópteros, estabelece que o piloto
  deve ter, a todo momento, referências visuais da superfície sob o helicóptero suficientes
  para controlar o voo com segurança. Nos trechos de voo noturno, as referências visuais devem
  ser luminosas; e
