cite: 5.2.2(b)
title: 5.2.2(b)
text: 'b) a seção 135.211, aplicável para operações transportando passageiros, estabelece
  que, a qualquer momento: (1) caso ocorra falha de motor crítico, uma aeronave multimotora
  deve poder descer para um aeródromo de alternativa ou continuar o voo sob VMC; e (2) caso
  ocorra falha do motor, uma aeronave monomotora deve descer para pouso sob VMC. Em ambos
  os casos, devem ser considerados, no planejamento do voo, a capacidade da aeronave e as
  informações meteorológicas disponíveis para garantir o cumprimento deste requisito.

  5.2.2.3 Conforme a seção 135.213, para o cumprimento dos requisitos que requerem a utilização
  de informações meteorológicas, o piloto deve utilizar informações providas pelo órgão competentes
  do país sobrevoado (ou por provedor reconhecido por esse órgão) ou, caso tais informações
  não estejam disponíveis, informações baseadas em observações próprias ou de outros pilotos.
  Na aplicação das informações meteorológicas publicadas, deve-se considerar o Apêndice B
  desta IS.'
