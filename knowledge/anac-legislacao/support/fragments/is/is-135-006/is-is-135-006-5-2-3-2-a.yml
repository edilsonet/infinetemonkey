title: 5.2.3.2(a)
text: 'a) para aviões, conforme o parágrafo 135.209(a), deve-se ter, no planejamento de voo,
  combustível e óleo lubrificante suficiente para, considerando as informações meteorológicas
  disponíveis (incluindo o vento):

  a. voar até o aeródromo de destino; e

  b. voar, considerando consumo normal de combustível e óleo lubrificante, em velocidade de
  cruzeiro:

  i. durante o dia, pelo menos mais 30 minutos; e

  ii. durante a noite, pelo menos mais 45 minutos.

  Para efeito de cumprimento deste requisito, considera-se como “voo durante a noite”, qualquer
  voo que seja realizado parcialmente no período noturno;'
