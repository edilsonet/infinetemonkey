section_title: 'Há requisitos diferenciados para avião e helicópteros:'
subsection_id: b
cite: 5.2.3.2(b)
title: 5.2.3.2(b)
text: 'b) para helicópteros, conforme o parágrafo 135.209(b), deve-se ter, no planejamento
  de voo, combustível e óleo lubrificante suficientes para, considerando as informações meteorológicas
  disponíveis (incluindo o vento):

  a. voar até o aeródromo de destino;

  b. voar pelo menos mais 20 minutos, considerando consumo normal de combustível e óleo lubrificante,
  em velocidade de cruzeiro que proveja o melhor alcance em distância; e

  c. compensar o aumento de consumo em caso de possíveis contingências. Para esse fator, deve-se
  considerar, pelo menos:

  i. para voos que sobrevoem ambientes hostis, 10% do combustível e óleo suficiente requerido
  para voar até o aeródromo de destino; e

  ii. para os demais voos, 5% do combustível e óleo suficiente requerido para voar até o aeródromo
  de destino.

  Nota: possíveis contingências podem vir de fatores imprevistos que podem ter uma influência
  no consumo de combustível até o aeródromo de destino, tais como variações de um helicóptero
  específico com relação aos dados de consumo de combustível esperados, variações com relação
  às condições meteorológicas previstas, atrasos prolongados e desvios da rota ou do nível
  de cruzeiro planejados.

  5.2.3.3 Embora não conste explicitamente na seção 135.209, o combustível para voar até o
  aeródromo de destino deve incluir o combustível para o táxi, ou seja, o combustível que
  se espera que seja consumido antes da decolagem, levando em consideração condições locais
  no aeródromo de decolagem e, caso aplicável, consumo de combustível pela unidade auxiliar
  de energia (APU).

  5.3 Voos IFR'
