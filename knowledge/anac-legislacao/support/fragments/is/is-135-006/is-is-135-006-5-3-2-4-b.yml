title: 5.3.2.4(b)
text: 'b) para helicópteros, na Tabela 2:

  Tabela 2 - Mínimos de planejamento para aeródromos de alternativa - helicópteros

  Tipo de aproximação

  MDA/H ou DA/H

  Visibilidade mínima

  Operação de aproximação por instrumentos

  Adicione 200 pés

  Adicione 1500 m

  Aeródromo não possui procedimento de aproximação por instrumentos

  Mínimos devem permitir a descida a partir da altitude mínima em rota (MEA), aproximação
  e pouso em condições meteorológicas de voo visual (VMC).


  5.3.2.4.6 Para avaliação de se um aeródromo pode ser utilizado como aeródromo de alternativa,
  o valor de teto previsto deve ser igual ou superior ao valor de MDA/H ou DA/H constante
  no mínimo de planejamento.

  5.3.2.4.7 Algumas cartas podem trazer requisitos específicos de mínimos de planejamento
  para aeródromo de alternativa. Nesse caso, o operador deve cumprir adicionalmente a restrição
  prevista na carta.

  5.3.2.4.8 Algumas cartas podem trazer a restrição de que aquele procedimento não pode ser
  considerado para a seleção do aeródromo como alternativa (indicado na carta como “Alternate
  minimums not authorized”, conforme símbolo ). Nesse caso, o operador deve selecionar outro
  procedimento como base para a determinação dos mínimos de planejamento para aeródromo de
  alternativa. Se todos os procedimentos publicados para o aeródromo trouxerem essa restrição,
  o operador deve escolher outro aeródromo como alternativa.'
