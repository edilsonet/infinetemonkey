cite: 5.3.2.5(b)
title: 5.3.2.5(b)
text: b) para um aeródromo de alternativa de destino, esse horário considera o horário previsto
  de decolagem, o tempo de voo previsto até o pouso no destino, a execução de aproximação
  perdida no aeródromo de destino e, então, o tempo de voo previsto até o aeródromo de alternativa
  de destino. Caso haja mais de um aeródromo de alternativa de destino requerido, esse cálculo
  deve ser feito de forma independente para cada um deles;
