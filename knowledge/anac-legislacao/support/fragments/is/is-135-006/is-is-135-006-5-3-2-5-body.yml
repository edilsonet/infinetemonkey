text: '5.3.2.5 Margem de tempo apropriada para o horário estimado de utilização (135.219(c))

  5.3.2.5.1 O parágrafo 135.219(c) do RBAC nº 135 requer que o detentor de certificado estabeleça
  uma margem de tempo apropriada para o horário estimado de utilização de um aeródromo.

  5.3.2.5.2 Para atender a esse requisito, inicialmente é necessário estabelecer o horário
  previsto de utilização, o que depende do tipo de aeródromo sendo considerado:'
