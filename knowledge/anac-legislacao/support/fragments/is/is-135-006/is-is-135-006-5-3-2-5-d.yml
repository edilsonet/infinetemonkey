cite: 5.3.2.5(d)
title: 5.3.2.5(d)
text: 'd) para um aeródromo de alternativa em rota ETOPS, esse horário abrange todo o período
  em que o aeródromo é a principal alternativa em caso de desvio, desde um desvio a partir
  do ponto equidistante em tempo anterior até um desvio a partir do ponto equidistante em
  tempo posterior.

  5.3.2.5.3 A margem de tempo é um valor a ser adicionado ao horário previsto de utilização,
  de forma a considerar atrasos em solo ou em voo, bem como incertezas nos horários das previsões
  meteorológicas.'
