section_title: 'O parágrafo 135.217(a) do RBAC nº 135 requer que o detentor de certificado
  selecione um aeródromo de alternativa de decolagem se:'
subsection_id: a
cite: 5.3.3.2.1(a)
title: 5.3.3.2.1(a)
text: 'a) Para aviões monomotores ou helicópteros: velocidade normal de cruzeiro, determinada
  a partir do manual de operações da aeronave, em condições de atmosfera padrão e ar calmo,
  considerando o peso de decolagem real;'
