title: Aeródromo de alternativa de destino (135.218)
text: '5.3.3.3 Aeródromo de alternativa de destino (135.218)

  5.3.3.3.1 Por padrão, os voos IFR sob o RBAC nº 135 devem ter pelo menos um aeródromo de
  alternativa de destino. No entanto, há duas situações em que não se requer a designação
  de aeródromo de alternativa de destino, conforme detalhado a seguir em 5.3.3.3.3 e 5.3.3.3.4.
  Ainda, há uma situação em que podem ser requeridos dois aeródromos de destino, conforme
  detalhado em 5.3.3.3.5.

  5.3.3.3.2 Observa-se que, além dos requisitos da seção 135.218 do RBAC nº 135, um aeródromo
  de alternativa de destino pode ser requerido pelos requisitos de desempenho da Subparte
  I do RBAC nº 135, como, por exemplo, pelos parágrafos 135.375(b) e 135.385(c) e (g). Uma
  vez que esses aeródromos de alternativa de destino sejam requeridos, também se aplicam a
  tais aeródromos os requisitos de mínimos meteorológicos do parágrafo 135.219(a)(2).'
