section_title: 'O suprimento de combustível utilizável inclui as seguintes parcelas:'
subsection_id: b
cite: 5.3.4.2(b)
title: 5.3.4.2(b)
text: 'b) em compensação, o RBAC nº 121 estabelece requisitos de combustível de contingência
  (121.645(c)(3)) e combustível adicional (121.645(c)(6)), que não constam no RBAC nº 135.
  Com relação ao combustível de contingência, observa-se que o RBAC nº 121 permite ainda o
  planejamento de voo com redespacho, que envolve um planejamento inicial para um aeródromo
  intermediário (e, conforme aplicável, um aeródromo de alternativa para esse aeródromo intermediário)
  para o cálculo do suprimento de combustível pré-voo e, posteriormente, em voo, um redespacho
  da aeronave, para o aeródromo de destino, caso a aeronave possua, no ponto de redespacho,
  combustível suficiente para a realização desse voo.

  5.3.4.4 Para avaliação da autorização, a ANAC considerará se o detentor de certificado possui
  capacidade de calcular o suprimento de combustível em atendimento aos requisitos do RBAC
  nº 121. Em razão da maior complexidade, é esperado que o detentor de certificado possua
  ferramentas automatizadas para efetuar esses cálculos.'
