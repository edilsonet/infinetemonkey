title: 5.3.4.2(d)
text: 'd) combustível de reserva final (135.223(a)(4)), que deve ser a quantidade de combustível
  a seguir, calculada usando o peso estimado para a aeronave no momento da chegada ao aeródromo
  de alternativa de destino, ou ao aeródromo de destino quando nenhum aeródromo de alternativa
  de destino for requerido:

  a. para aviões, a quantidade de combustível requerida para voar por 45 minutos em velocidade
  normal de cruzeiro; ou


  b. para helicópteros, a quantidade de combustível requerida para voar por 30 minutos em
  velocidade normal de cruzeiro.

  5.3.4.3 O parágrafo 135.223(b) permite que um detentor de certificado solicite à ANAC aprovação
  para utilizar os requisitos de suprimento de combustível da seção 121.645 do RBAC nº 121,
  em suas operações com aviões, desde que demonstre que níveis de segurança aceitáveis serão
  obtidos. Basicamente, as principais diferenças entre os requisitos são:'
