title: 5.3.4.5(b)
text: 'b) dois aeródromos de alternativa de destino são requeridos: o combustível para o aeródromo
  de alternativa deve ser a quantidade de combustível requerida para permitir à aeronave cumprir
  com o parágrafo 5.3.4.5.1(a) para o aeródromo de alternativa que requer a maior quantidade
  de combustível.'
