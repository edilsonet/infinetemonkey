text: '5.3.4.5 Combustível para o aeródromo de alternativa (135.223(a)(3))

  5.3.4.5.1 Embora o nome dessa parcela se refira a “aeródromo de alternativa”, a parcela
  é requerida mesmo quando não há aeródromo de alternativa de destino. O cálculo dessa parcela
  é feito de acordo com um dos quatro cenários a seguir, dependendo dos requisitos de seleção
  de aeródromos de alternativa:'
