cite: 5.3.4.5(c)
title: 5.3.4.5(c)
text: 'c) voos sem designação de aeródromo de alternativa de destino: maior garantia de pouso
  no aeródromo de destino (135.218(a)(1) e parágrafo 5.3.3.3.3 desta IS): o “combustível para
  o aeródromo de alternativa” deve ser a quantidade de combustível requerida para permitir
  à aeronave voar por 15 minutos a velocidade de espera a 450 m (1500 pés) sobre a elevação
  do aeródromo de destino em condição de atmosfera padrão; e'
