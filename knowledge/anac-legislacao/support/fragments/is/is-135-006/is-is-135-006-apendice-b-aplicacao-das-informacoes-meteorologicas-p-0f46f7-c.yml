title: apendice-b-aplicacao-das-informacoes-meteorologicas-p-0f46f7(c)
text: 'c) os dados de vento devem ser considerados da seguinte forma:

  a. a direção média e a velocidade média do vento devem ser consideradas, devendo estar abaixo
  dos limites do avião; e

  b. valores de rajadas podem ser desconsiderados.'
