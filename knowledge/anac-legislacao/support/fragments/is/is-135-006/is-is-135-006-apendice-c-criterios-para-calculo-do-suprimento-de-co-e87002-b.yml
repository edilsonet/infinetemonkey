title: apendice-c-criterios-para-calculo-do-suprimento-de-co-e87002(b)
text: 'b) com relação às condições de operações para o voo planejado:

  a. peso previsto da aeronave;

  b. NOTAM;

  c. uma combinação de informes e previsões meteorológicos atualizados;

  d. procedimentos dos serviços de tráfego aéreo, bem como suas restrições e atrasos previstos;

  e. os efeitos de itens com ação corretiva retardada e/ou desvios de configuração, conforme
  previsto em MEL ou lista de desvios de configuração (CDL); e

  f. quaisquer outras condições que possam atrasar o pouso ou aumentar o consumo de combustível
  e/ou óleo lubrificante.'
