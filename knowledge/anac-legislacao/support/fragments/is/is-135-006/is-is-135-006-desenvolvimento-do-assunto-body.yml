title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Introdução

  5.1.1 Com vistas à proteção dos voos, o RBAC nº 135 estabelece requisitos de planejamento,
  que incluem requisitos de seleção de aeródromos de alternativa, requisitos de suprimento
  de combustível e óleo lubrificante (autonomia) e requisitos de condições meteorológicas,
  tanto sobre os aeródromos envolvidos (de origem, de destino e de alternativa) quanto sobre
  a rota.

  5.1.2 Como esses requisitos dependem principalmente de se o voo é VFR ou IFR, esta introdução
  sobre o conjunto de requisitos é dividida pelo tipo de operação: VFR ou IFR.

  5.2 Voo VFR'
