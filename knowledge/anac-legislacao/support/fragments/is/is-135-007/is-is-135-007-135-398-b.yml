title: 135.398(b)
text: 'b) se o aeródromo de destino não possuir informações meteorológicas que atendam à seção
  135.213:

  a. para fins de planejamento, deve ser atendido o parágrafo 135.218(b) do RBAC nº 135; e

  b. o pouso deve ser realizado em VFR.

  Nota: a operação segundo o parágrafo 135.218(b) requer ainda a seleção de dois aeródromos
  de alternativa de destino e o cumprimento de requisitos específicos de suprimento de combustível.
  Esses requisitos não são tratados nesta IS.

  5.1.10 Nesta IS, se considera de forma geral que os parâmetros listados em 5.1.3 não estão
  disponíveis de forma alguma por fontes de informações meteorológicas que atendam à seção
  135.213. No entanto, pode ocorrer de o aeródromo não possuir alguma das informações, mas
  possuir outras. Quando isso ocorrer, as informações que atendam à seção 135.213 podem ser
  utilizadas normalmente, ficando os procedimentos desta IS restritos às situações em que
  essas informações não estejam disponíveis.

  5.1.11 Observa-se que os requisitos de desempenho da Subparte I do RBAC nº 135 devem ser
  cumpridos integralmente, uma vez que não se trata de isenção ou desvio do cumprimento dos
  requisitos. O parágrafo 135.363(l) do RBAC nº 135 e esta IS se referem somente à possibilidade
  de utilizar meios alternativos aos normalmente utilizados para considerar os parâmetros
  necessários. O detentor de certificado deve, com base nesses meios alternativos, verificar
  o cumprimento dos requisitos de desempenho da Subparte I.

  5.1.12 Deve-se ter claro que os requisitos de desempenho da Subparte I do RBAC nº 135 discutidos
  nesta IS se aplicam à decolagem - e, por consequência, ao planejamento de voo. Não são requisitos
  para a execução da operação. Por exemplo, não se caracteriza uma infração à seção 135.385
  se, na execução do pouso, um avião a reação utiliza mais do que 60% do comprimento efetivo
  de pista; por outro lado uma infração existiria se o voo fosse despachado/liberado e, no
  planejamento do voo, considerando os parâmetros estimados para o horário do pouso, se previsse
  que o avião precisaria de mais de 60% do comprimento efetivo de pista para pousar.

  5.1.13 De qualquer maneira, ressalta-se que há uma conexão entre os requisitos de planejamento
  e a operação do avião propriamente dita. Assim, é importante que, ao se realizar tal consideração
  no planejamento de voo, seja viável que o piloto tome suas decisões de acordo com as mesmas
  considerações. Por exemplo, se assumimos no planejamento de voo que o avião realizará pouso
  com vento de proa (ou com ar calmo), deve ser possível, na execução do pouso, que o piloto
  consiga avaliar a direção do vento e de fato pousar com vento de proa (ou com ar calmo)
  - ou ao menos identificar que tal previsão não se concretizou e reanalisar a situação, para
  confirmar se o pouso ainda pode ser feito em condição distinta da considerada no planejamento.
  Por esse motivo, esta IS inclui algumas informações relativas à execução da operação.

  5.2 Parâmetros que podem ser considerados de acordo com 135.363(l)'
