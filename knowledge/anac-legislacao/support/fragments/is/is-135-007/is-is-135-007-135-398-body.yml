text: '135.398 e, por referência, 135.385 e 135.387

  Pequeno avião não incluído na categoria transporte e:

  - certificado na categoria normal antes de 1/7/1970 e que atenda aos requisitos especiais
  do RBAC nº 135, conforme o parágrafo 135.169(b)(2); ou

  - certificado na categoria normal antes de 19/7/1970 e que atenda aos requisitos especiais
  do SFAR 23, da FAA, conforme o parágrafo 135.169(b)(3).


  Pequeno avião não incluído na categoria transporte e:

  - certificado na categoria normal e que atenda aos requisitos do Apêndice A do RBAC nº 135,
  conforme o parágrafo 135.169(b)(4); ou

  - certificado na categoria normal e que atenda aos requisitos da seção 1.(b) do SFAR 41
  da FAA, conforme o parágrafo 135.169(b)(5).


  Pouso (no aeródromo de destino ou de alternativa)


  Pequeno avião não incluído na categoria transporte, certificado na categoria normal e que
  atenda aos requisitos da seção 1.(b) do SFAR 41 da FAA, conforme o parágrafo 135.169(b)(6).


  Pouso (no aeródromo de destino ou de alternativa)

  135.399(b) e, por referência, 135.385 e 135.387

  Nota: para os aviões não listados na Tabela 1, não se aplicam os requisitos de desempenho
  da Subparte I do RBAC nº 135 e, consequentemente, não se aplica esta IS. No entanto, nessas
  operações:'
