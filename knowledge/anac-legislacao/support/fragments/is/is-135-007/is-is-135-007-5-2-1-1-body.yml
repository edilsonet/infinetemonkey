text: '5.2.1.1 Decolagem

  5.2.1.1.1 O vento é um parâmetro necessário no cálculo do desempenho de decolagem. Os aviões
  normalmente decolam com vento de proa, a menos que obstáculos no entorno do aeródromo ou
  procedimentos do controle de tráfego aéreo exijam algo diferente. Dessa forma, a consideração
  do vento na decolagem tende a ser um fator benéfico ao desempenho do avião.

  5.2.1.1.2 Conforme o item 3.1.1 da ICA 100-1, para operações VFR, e o item 4.1.1, para operações
  IFR, é requerido que o aeródromo disponha de informações meteorológicas relativas ao vento
  de superfície por, pelo menos, um dos seguintes meios:'
