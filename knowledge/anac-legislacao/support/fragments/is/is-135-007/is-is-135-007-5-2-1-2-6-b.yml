title: 5.2.1.2.6(b)
text: b) caso haja vento, a tripulação de voo deve normalmente utilizar a cabeceira que resultaria
  em um pouso com vento de proa. Somente pode ser utilizada a cabeceira que resultaria em
  um pouso com vento de cauda se for calculado que, em razão das diferenças entre as cabeceiras,
  seria utilizado um percentual menor da distância de pouso disponível; e
