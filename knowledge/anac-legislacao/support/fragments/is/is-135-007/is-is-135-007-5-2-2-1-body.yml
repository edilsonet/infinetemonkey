title: Decolagem
text: '5.2.2.1 Decolagem

  5.2.2.1.1 Para decolagem, deve ser considerada a pressão indicada nos instrumentos do avião.
  Caso haja divergência entre os instrumentos, dentro da margem de tolerância, deve ser considerado
  aquele que indicar a menor pressão atmosférica (maior altitude-pressão).

  5.2.2.1.2 Para que esse parâmetro seja considerado no planejamento do voo, o operador pode
  estabelecer um valor específico a ser considerado (como, por exemplo, uma margem com relação
  à elevação do aeródromo, considerando atmosfera padrão). Na execução da decolagem, se os
  instrumentos do avião indicarem uma pressão atmosférica menor que a considerada, os cálculos
  de desempenho devem ser refeitos com os valores atualizados.'
