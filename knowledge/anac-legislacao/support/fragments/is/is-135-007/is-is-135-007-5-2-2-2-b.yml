id: is-is-135-007-5-2-2-2-b
kind: is
document: is-135-007
family: '135'
section_id: 5.2.2.2
section_title: 'Pouso. Para pouso, o próprio TAF não fornece uma previsão de pressão. O planejamento
  de voo deve considerar:'
subsection_id: b
cite: 5.2.2.2(b)
title: 5.2.2.2(b)
text: 'b) caso o aeródromo não disponha de informes meteorológicos que atendam à seção 135.213:
  podem se utilizar um dos seguintes métodos:

  a. a pressão referente à elevação do aeródromo, considerando atmosfera padrão, reduzida
  de uma margem de segurança de 10 hPa; ou

  b. a menor pressão atmosférica entre:

  i. a pressão referente à elevação do aeródromo, considerando atmosfera padrão; e

  ii. a menor pressão prevista por métodos numéricos para o aeródromo, considerando-se um
  período de 3h antes e 3h depois do horário estimado de utilização. Ainda, deve se aplicar
  uma redução de 4 hPa como margem de segurança.

  Nota: o Inmet fornece previsões por métodos numéricos em https://mapas.inmet.gov.br/. A
  ANAC pode avaliar o uso de outros fornecedores de dados equivalentes, desde que o operador
  demonstre que os dados proveem nível de segurança equivalente ao previsto nesta IS com uso
  de dados do Inmet.

  5.2.2.3 Para a execução do pouso, caso o aeródromo disponha de informes meteorológicos e
  caso haja dados de desempenho em voo estabelecidos de acordo com a AC 25-32 do FAA (usualmente
  denominados in-flight landing distance, Landing Performance Data for Time-of-Arrival Landing
  Performance Assessments ou similar), quando forem reportados valores de pressão atmosférica
  menores do que os considerados no planejamento de voo, a tripulação de voo deve realizar
  um cálculo de desempenho de pouso em voo, com base nos valores reportados e nos dados de
  desempenho em voo. Neste cálculo, a distância disponível para pouso deve ser de, no mínimo,
  115% da distância de pouso para o horário estimado de pouso na pista pretendida.'
