title: Temperatura
text: '5.2.3 Temperatura

  5.2.3.1 Para temperatura, a medição pelos instrumentos da aeronave pode não ser representativa
  da temperatura utilizada para o cálculo de desempenho. Dessa forma, tanto para decolagem,
  quanto para o pouso, é necessário trabalhar com margem de segurança sobre os dados meteorológicos
  utilizados como meios alternativos para considerar a temperatura.'
