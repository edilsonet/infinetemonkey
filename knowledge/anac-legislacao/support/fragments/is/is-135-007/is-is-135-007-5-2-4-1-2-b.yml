title: 5.2.4.1.2(b)
text: 'b) pode se estabelecer uma forma de avaliação das condições da pista, por pessoas no
  próprio aeródromo. No caso de decolagens que sejam realizadas em sequência a pousos, é possível
  concluir que a pista estaria seca se o piloto do voo anterior realizou o pouso em pista
  seca e, por meio de observação, não houve chuva no aeródromo após o pouso.

  5.2.4.1.3 Na execução da decolagem, a tripulação de voo deve confirmar que as condições
  da superfície da pista são iguais ou melhores do que as consideradas no planejamento.'
