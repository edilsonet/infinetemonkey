title: 5.2.4.2(b)
text: 'b) o desempenho real dos aviões na execução de decolagens e pousos nos aeródromos que
  não disponham de informações meteorológicas que atendam à seção 135.213, comparando as distâncias
  efetivamente utilizadas com as consideradas no planejamento dos voos, de forma a avaliar
  continuamente se as margens de segurança são suficientes. O detentor de certificado deve
  considerar como referência a sua operação nos aeródromos nacionais que possuem informações
  meteorológicas que atendam à seção 135.213.

  5.3.3 Caso o detentor de certificado não possua PAADV, deve monitorar reportes de pilotos
  acerca das operações de decolagens e pousos em aeródromos que não disponham de informações
  meteorológicas que atendam à seção 135.213, buscando identificar perigos associados a essas
  operações. De acordo com a disponibilidade das informações (por exemplo, a partir de METAR,
  caso disponível, ou de indicadores dos próprios aviões), os pilotos devem informar discrepâncias
  entre os valores considerados no planejamento e os efetivamente encontrados.

  5.3.4 Se, no processo de monitoramento, for identificado que os valores efetivamente encontrados
  para os parâmetros são menos críticos do que os valores considerados no planejamento de
  voo, o detentor deve rever seus processos de forma a garantir a correção dessa situação.
  Devem ser considerados gatilhos para a revisão do processo, pelo menos, as seguintes situações:'
