  5.4.2 Caso existam aeródromos que possuam informações meteorológicas parciais, conforme
  descrito no parágrafo 5.1.10 desta IS, o detentor de certificado deve detalhar o método
  específico que se aplica para esses aeródromos, considerando as informações meteorológicas
  disponíveis.'
