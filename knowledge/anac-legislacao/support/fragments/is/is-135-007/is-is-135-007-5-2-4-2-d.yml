text: 'd) erros de magnitude inferior aos anteriores, porém que apresentem frequência acima
  de 1%.

  5.3.5 No caso das situações descritas em 5.3.4a) e b), a revisão do processo por meio da
  inclusão de margens adicionais de segurança, deve ser imediata, com aplicação para os voos
  seguintes, uma vez que é provável que esses voos enfrentem condições similares.

  5.3.6 O detentor de certificado deve registrar previamente ao voo os valores utilizados
  como meio alternativo para considerar os parâmetros necessários para o cálculo de desempenho.

  5.4 Processo de aprovação

  5.4.1 O detentor de certificado deve enviar à ANAC uma solicitação de alteração de Especificações
  Operativas, na forma estabelecida na IS nº 119-004, para inclusão de aprovação para uso
  de meios alternativos para considerar os parâmetros necessários para cumprimento dos requisitos
  de desempenho da Subparte I do RBAC nº 135. O detentor de certificado deve anexar:'
