  4.1.11 Procedimentos Operacionais Padronizados (SOP - Standard Operational Procedures).
  Procedimentos escritos e testados que são aplicados de forma uniforme e consistente dentro
  de uma operação e envolvem todos os aspectos das operações de voo: normais, anormais e de
  emergência.'
