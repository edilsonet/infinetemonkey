text: '4.1.8 Piloto Voando ou Pilot Flying (PF). O piloto que controla a trajetória e a configuração
  da aeronave a qualquer tempo, seja em voo ou em solo.

  4.1.9 Piloto Monitorando ou Pilot Monitoring (PM). O piloto que monitora o status da aeronave
  e dos sistemas, e verbaliza quaisquer desvios percebidos ou potenciais na trajetória de
  voo pretendida, intervindo quando necessário.'
