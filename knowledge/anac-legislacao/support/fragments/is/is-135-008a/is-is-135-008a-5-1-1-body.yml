text: '5.1.1 Esta IS se aplica aos detentores ou requerentes de um Certificado de Operador
  Aéreo emitido segundo o RBAC nº 119 para operação segundo o RBAC nº 135.

  5.2 Introdução

  5.2.1 Mesmo os SOP sendo universalmente reconhecidos como fundamentais para operações seguras
  na aviação, acidentes e incidentes continuam a ocorrer como um resultado direto ou relacionado
  às falhas das tripulações em seguir os SOP, principalmente durante as fases críticas do
  voo.

  5.2.2 Esta IS fornece orientação para o projeto, desenvolvimento, implementação, avaliação
  e atualização de SOP. Enfatiza, também, que os SOP devem ser claros, abrangentes e estar
  prontamente disponíveis na cabine de pilotos do avião em cada voo.'
