title: Os SOP podem fazer parte do AOM em conformidade com a IS nº 135-009.
text: '5.2.3 Os SOP podem fazer parte do AOM em conformidade com a IS nº 135-009.

  5.2.4 O SOP é um documento aceito. Isso significa que poderá ser colocado em uso pelo detentor
  de certificado, assim que for encaminhado para análise da ANAC, sem que seja necessário
  aguardar a manifestação da ANAC.'
