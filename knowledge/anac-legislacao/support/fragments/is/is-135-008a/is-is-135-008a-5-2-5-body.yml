text: '5.2.5 O SOP terá sua efetividade avaliada pela ANAC em inspeções, exames de proficiência,
  competência e/ou exames em rota.

  5.2.6 Em qualquer momento, caso seja detectada qualquer irregularidade nos SOP utilizados
  pelo operador, a ANAC definirá um prazo para que o manual seja corrigido.

  5.2.7 Antes da elaboração do SOP, recomenda-se a participação ou reunião dos membros do
  detentor do certificado, tais como diretor de operações, piloto chefe, coordenador de voo
  e pilotos com vasta experiência na aeronave objeto de confecção do SOP.

  5.2.8 O SOP deve ser redigido de forma concisa, passo a passo, de fácil leitura e entendimento.
  Suas informações devem evitar a ambiguidade. A voz ativa e os verbos no imperativo devem
  ser utilizados. Evite o uso de frases na negativa, pois podem causar confusão ou interpretações
  equivocadas. Caso sejam necessárias, assegure-se de especificar claramente o que está sendo
  negado. A informação deve ser clara e explícita, de forma que não exista qualquer dúvida
  quando aplicada.'
