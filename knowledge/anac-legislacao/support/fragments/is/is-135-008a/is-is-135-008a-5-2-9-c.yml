section_title: 'Um SOP aceitável pela ANAC é aquele que atenda, no mínimo, aos seguintes critérios:'
subsection_id: c
cite: 5.2.9(c)
title: 5.2.9(c)
text: c) são necessários SOP distintos quando houver diferenças significativas na operação
  dos diversos modelos ou tipos de aeronave da frota do operador, independentemente da habilitação
  requerida para sua pilotagem. O operador poderá consultar a ANAC sobre a possibilidade de
  utilização de um SOP único para os diferentes modelos de sua frota;
