section_title: 'Um SOP aceitável pela ANAC é aquele que atenda, no mínimo, aos seguintes critérios:'
subsection_id: d
cite: 5.2.9(d)
title: 5.2.9(d)
text: d) é desejável que os SOP de diferentes modelos de aeronaves do mesmo operador mantenham
  uma filosofia operacional única, limitando as diferenças às especificidades de cada modelo
  ou tipo, a fim de facilitar a transição dos pilotos de um tipo para outro. Isso é especialmente
  necessário para operadores em que um mesmo piloto opera mais de um tipo de aeronave;
