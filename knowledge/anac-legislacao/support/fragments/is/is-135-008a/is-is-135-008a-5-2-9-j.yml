family: '135'
section_id: 5.2.9
section_title: 'Um SOP aceitável pela ANAC é aquele que atenda, no mínimo, aos seguintes critérios:'
subsection_id: j
cite: 5.2.9(j)
title: 5.2.9(j)
text: 'j) o SOP deve refletir a operação padrão do detentor do certificado, bem como seu dia
  a dia, não devendo seu uso ser relegado apenas a treinamento e exames de proficiência/competência/rota.

  5.2.10 O SOP deve ser constantemente avaliado e revisto pelos pilotos do detentor do certificado.
  O detentor do certificado deve incentivar seus pilotos a reportarem discrepâncias, melhorias
  e melhores práticas para a implantação desse manual.

  5.2.11 A coordenação efetiva da tripulação e o seu desempenho dependem do compartilhamento
  de um modelo mental de cada tarefa a ser desempenhada. Esse modelo mental, por sua vez,
  é baseado em SOP. Os SOP visam fornecer um modelo consistente e padronizado de cada tarefa
  que deve ser realizada por cada piloto durante cada fase de voo e durante qualquer situação
  normal, anormal ou de emergência. Os SOP devem ser mantidos atualizados e podem ser desenvolvidos
  individualmente pelo operador ou incorporar os procedimentos encontrados nos manuais de
  operação de suas aeronaves em suas operações diárias. Uma vez estabelecidos, os SOP devem
  ser aplicados com consistência e uniformidade ao longo da operação.'
