title: Requisitos para procedimentos
text: '5.3.1 Requisitos para procedimentos

  5.3.1.1 Os operadores são obrigados a estabelecer SOP de acordo com o parágrafo 135.23(a)(35)
  do RBAC nº 135. Embora um fabricante de equipamentos originais (OEM) costumeiramente proveja
  seus operadores com procedimentos sugeridos e listas de verificação para o seu equipamento,
  é facultado aos operadores desenvolver ou modificar os procedimentos e listas de verificação
  fornecidos pelo OEM. Alguns dos procedimentos podem exigir uma "nenhuma objeção técnica"
  do OEM para que sejam modificados.

  5.3.1.2 Ademais, algumas modificações no procedimento podem exigir aceitação da ANAC. Os
  operadores devem trabalhar com o OEM e a ANAC para determinar se é necessário o desenvolvimento
  de uma modificação no SOP.'
