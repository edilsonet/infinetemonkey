title: Modificando os procedimentos do OEM
text: '5.3.2 Modificando os procedimentos do OEM

  5.3.2.1 Procedimentos e listas de verificação publicados pelo OEM são concebidos para refletir
  o projeto e os procedimentos operacionais do equipamento desse fabricante. Esses promovem
  o uso ideal da aeronave, conforme previsto pelos projetistas, mas podem ser genéricos em
  sua aplicabilidade. Fatores que podem potencialmente motivar modificações nos procedimentos
  e listas de verificação incluem a mudança ou inclusão de equipamentos novos, mudanças operacionais,
  procedimentos mandatórios da empresa, padronização entre frotas, problemas operacionais
  observados, incidentes, acidentes ou fusões entre empresas aéreas.

  5.4 Criando um processo de desenvolvimento de procedimento'
