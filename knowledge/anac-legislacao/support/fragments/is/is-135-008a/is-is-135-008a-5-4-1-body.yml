title: Características desejáveis de procedimentos
text: '5.4.1 Características desejáveis de procedimentos

  5.4.1.1 Um procedimento bem projetado ajuda as tripulações, uma vez que especifica uma sequência
  de ações que, se seguidas, ajudam a garantir que a tarefa principal será realizada de forma
  a atender às diretrizes básicas de clareza, confiabilidade e robustez.'
