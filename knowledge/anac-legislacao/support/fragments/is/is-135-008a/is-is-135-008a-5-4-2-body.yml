title: Colaborando para SOP efetivos
text: '5.4.2 Colaborando para SOP efetivos

  5.4.2.1 A colaboração pode melhorar a eficácia dos SOP. Parceiros na colaboração podem incluir
  representantes do fabricante, pilotos com experiência na aeronave ou com o tipo de operações
  planejadas pelo operador, organizações de treinamento e representantes da autoridade aeronáutica.
  Os desenvolvedores dos procedimentos devem atentar ao manual de voo da aeronave (AFM/RFM),
  bem como às suas revisões e boletins de operações emitidos pelo fabricante. É especialmente
  importante para um novo operador estabelecer um processo de revisão periódica que inclua
  as tripulações de voo. Juntos, gerentes e pilotos são capazes de revisar a eficácia dos
  SOP e chegar a conclusões válidas para revisões. Um período experimental pode ser implementado,
  seguido de feedback e revisão, na qual os SOP poderão ser aperfeiçoados. O processo de revisão
  será significativo e efetivo quando os gerentes forem capazes de promover a rápida implementação
  das revisões dos SOP, sempre que necessário.'
