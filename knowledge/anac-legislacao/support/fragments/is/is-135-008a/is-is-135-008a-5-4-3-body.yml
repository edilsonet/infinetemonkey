title: Recursos para desenvolver SOP
text: '5.4.3 Recursos para desenvolver SOP

  5.4.3.1 O processo de desenvolvimento dos SOP deve começar com uma análise cuidadosa dos
  fatores que impulsionam a necessidade de desenvolver ou modificar um procedimento, e as
  implicações desses fatores.

  5.4.3.2 Os desenvolvedores dos SOP devem pesquisar todas as fontes de informação disponíveis
  referentes ao processo ou procedimento a ser desenvolvido ou revisado. Isso pode incluir
  a revisão de dados do SGSO ou do PAADV. Os desenvolvedores dos SOP também devem entender
  profundamente o sistema de procedimentos e como eles se enquadram nas políticas existentes,
  assim como na orientação e filosofia operacional do operador. Qualquer novo processo ou
  procedimento deve ser consistente com esse quadro.

  5.4.3.3 As demais áreas dos operadores que serão afetadas pelos procedimentos em questão
  também podem agregar valor no processo de desenvolvimento dos SOP. Procedimentos que se
  relacionam com outras áreas devem ser coordenados em conjunto.

  5.5 Elaboração de procedimentos'
