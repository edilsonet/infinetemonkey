cite: 5.5.1.1
title: Após o seu desenvolvimento, os procedimentos devem ser efetivamente comunicados e treinados.
text: '5.5.1.1 Após o seu desenvolvimento, os procedimentos devem ser efetivamente comunicados
  e treinados.

  5.5.1.2 Informações a serem incluídas. Inclua somente as informações necessárias para validar
  o procedimento e as informações necessárias para executá-lo corretamente. Embora seja importante
  expor o raciocínio que fundamenta o desenvolvimento do procedimento, essas informações devem
  ser fornecidas em um manual de treinamento separado ou outro documento específico.

  5.5.1.3 Evite confusão visual. Inclua detalhes adicionais somente quando necessário. Quando
  for necessária a adição de informações suplementares, coloque-as separadas da apresentação
  dos procedimentos a serem realizados.

  5.5.1.4 Use uma linguagem simples. Utilize o vernáculo de forma simples. O uso de formulários
  sem complicações aumentará a compreensão, enquanto reduz a ambiguidade.'
