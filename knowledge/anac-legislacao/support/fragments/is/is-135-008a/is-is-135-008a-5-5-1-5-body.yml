text: '5.5.1.5 Utilize sentenças curtas. Quebre frases longas em frases curtas e use sentenças
  de estrutura simples.

  5.5.1.6 Utilize a voz ativa e verbos no imperativo. Redija sentenças de forma concisa, passo
  a passo, de fácil leitura e entendimento. A informação deve ser clara e explícita, de forma
  que não exista qualquer dúvida quando aplicada.'
