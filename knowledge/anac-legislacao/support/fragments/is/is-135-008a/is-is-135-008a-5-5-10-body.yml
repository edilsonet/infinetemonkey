title: Avisos e indicações de cuidado
text: '5.5.10 Avisos e indicações de cuidado

  5.5.10.1 Avisos e cuidados em procedimentos devem ser usados com moderação. O uso excessivo
  de avisos diminui a sua eficácia. Muitas vezes, os avisos são utilizados para transmitir
  uma questão mais urgente ou crítica.

  5.5.10.2 Conteúdo dos avisos e cuidados. Cada aviso ou cuidado deve identificar um único
  perigo, as consequências do perigo e quaisquer limitações de tempo críticas. As ações a
  serem tomadas não devem aparecer nos indicativos de avisos ou precauções.

  5.5.10.3 Alocação. Avisos e cuidados devem ser colocados na mesma página e antes dos procedimentos
  a que serão aplicáveis. Os fluxos de ações devem ser separados dos avisos e cuidados.

  5.6 Desenvolvimento de listas de verificação'
