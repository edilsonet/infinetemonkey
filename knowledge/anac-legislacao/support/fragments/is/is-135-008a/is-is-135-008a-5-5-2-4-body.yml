text: '5.5.2.4 Referências. As referências a outros procedimentos ou apêndices devem ser evitadas,
  a menos que necessárias para a conclusão do procedimento.

  5.5.2.5 Itens de memória. Os itens de memória devem ser evitados sempre que possível. Se
  o procedimento necessitar incluir itens de memória, eles devem ser claramente identificados
  e enfatizados nos programas de treinamento, e não devem conter itens condicionais.

  5.5.2.6 Índices. Um índice deve ser fornecido em cada manual de procedimento. Ao projetar
  o índice, certifique-se de que o formato reflete com precisão a filosofia e o treinamento
  aprovado do operador. Se um procedimento é identificado de mais de uma maneira (por exemplo,
  se houver várias indicações), devem-se incluir todos os parâmetros prováveis ​​no índice.'
