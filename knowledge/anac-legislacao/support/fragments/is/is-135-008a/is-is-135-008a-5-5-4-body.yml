title: Números
text: '5.5.4 Números

  5.5.4.1 Utilize algarismos arábicos. Os números árabes (por exemplo: 0, 1, 2 ...) são mais
  fáceis de ler do que os números que são escritos por extenso (por exemplo: um, dois). No
  entanto, use números escritos por extenso para referências quando dois ou mais valores diferentes
  são apresentados em proximidade de outros números (por exemplo, use "uma massa de 10 kg",
  em vez de "1 massa de 10 kg").'
