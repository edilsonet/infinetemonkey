text: '5.5.7 Ênfase

  5.5.7.1 Cuidados e avisos (por exemplo: CAUTION, WARNING), palavras condicionais (por exemplo:
  SE, ENTÃO), e notas importantes (por exemplo, NOTA) ou eventos cronometrados devem ser enfatizados.
  Itens irreversíveis devem ser enfatizados antes da ação a ser tomada. Técnicas para chamar
  a atenção para certas palavras ou frases devem ser usadas ​​com moderação, mas de forma
  consistente. O uso excessivo de ênfase reduz a sua eficácia e torna o procedimento difícil
  de ler. Técnicas para ênfase podem incluir:'
