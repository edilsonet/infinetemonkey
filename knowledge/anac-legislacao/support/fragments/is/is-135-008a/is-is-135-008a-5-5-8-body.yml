title: Tarefas condicionais
text: '5.5.8 Tarefas condicionais

  5.5.8.1 Em determinados procedimentos alguns passos devem ser executados somente quando
  condições específicas ocorrerem. Tarefas condicionais são uma fonte frequente de confusão,
  principalmente em procedimentos pouco utilizados. Esse problema pode ser mitigado ao se
  utilizarem sentenças bem estruturadas, claramente formuladas e tão concisas quanto possível.

  5.5.8.2 Instruções condicionais devem apresentar claramente todas as condições para que
  o correto fluxo de ações seja tomado. Os passos que estão associados a cada condição devem
  ser agrupados de forma clara. O final do bloco de ações deve ser bem definido, e a ação
  ou procedimento a ser realizado após a conclusão do bloco deve ser claramente especificado.
  Caso haja opções incorporadas, então essas também devem ser claramente explicitadas e os
  passos associados agrupados de forma inequívoca.'
