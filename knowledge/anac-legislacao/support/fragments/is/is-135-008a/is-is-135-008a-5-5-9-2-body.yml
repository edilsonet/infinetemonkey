text: '5.5.9.2 Referência explícita. Quando utilizadas, referências cruzadas devem ser explícitas
  em texto claro.

  5.5.9.3 Controle de versão. Quando forem necessárias referências a outros procedimentos,
  deve ser criado um sistema de controle de atualizações que incorpore tais mudanças. Mudanças
  no procedimento que referencia, ou que é referenciado, podem afetar a execução desses procedimentos.'
