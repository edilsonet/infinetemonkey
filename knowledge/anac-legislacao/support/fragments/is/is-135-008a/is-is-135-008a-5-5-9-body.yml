title: Referências cruzadas
text: '5.5.9 Referências cruzadas

  5.5.9.1 As referências cruzadas a outros procedimentos devem ser sempre evitadas. De maneira
  geral, recomenda-se que cada procedimento seja completo por si só e não invoque a leitura
  de outros procedimentos.'
