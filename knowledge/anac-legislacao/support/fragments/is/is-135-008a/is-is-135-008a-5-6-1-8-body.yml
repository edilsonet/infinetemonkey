section_title: No caso da utilização de checklists automatizados ou em meio diferente que
  o impresso, o operador deverá descrever o procedimento no SOP.
subsection_id: body
cite: 5.6.1.8
title: No caso da utilização de checklists automatizados ou em meio diferente que o impresso,
  o operador deverá descrever o procedimento no SOP.
text: '5.6.1.8 No caso da utilização de checklists automatizados ou em meio diferente que
  o impresso, o operador deverá descrever o procedimento no SOP.

  5.6.1.9 O operador não deve se limitar a apresentar uma cópia simples das listas de verificação
  dentro do SOP. Para que um procedimento seja efetivo, o piloto deve saber a razão de sua
  existência. Quando existirem opções para diferentes procedimentos, como, por exemplo, diferentes
  configurações de flap ou métodos de partida dos motores, o operador indicará o padrão de
  escolha e tomada de decisão adotado na empresa.

  5.6.1.10 Ao responderem os itens de uma lista de verificação, os pilotos devem reportar
  o parâmetro do item que está sendo verificado, em vez de meramente anunciar “checked” ou
  “set”. Por exemplo: “flaps 30” em vez de “flaps set”.

  5.6.1.11 As listas de verificação não são úteis se as tripulações de voo não estiverem comprometidas
  com a sua utilização. Sem disciplina e dedicação no uso das listas de verificação nos momentos
  adequados, os erros inevitavelmente ocorrem.

  5.6.1.12 Embora possam ser publicadas em um manual, as listas de verificação são projetadas
  para uso independente, de modo que os usuários raramente serão solicitados a fazer referência
  a quaisquer manuais de voo, especialmente depois de terem sido treinados sobre o seu conteúdo.
  Listas de verificação são utilizadas para assegurar que determinadas séries de ações especificadas
  sejam realizadas na sequência correta e para verificar que a aeronave foi configurada corretamente
  para cada fase do voo.

  5.6.1.13 As listas de verificação têm sido uma parte significativa da base de padronização
  de procedimentos dos tripulantes técnicos durante anos. Tais procedimentos, quando aplicados
  de forma disciplinada e padronizada, destinam-se a apoiar o desempenho humano, independentemente
  da circunstância. As listas de verificação são uma ajuda para a memória e garantem que os
  itens críticos necessários para a operação segura de aeronaves não serão negligenciados
  ou esquecidos.

  5.6.1.14 As listas de verificação devem ser de fácil acesso, fáceis de ler e fáceis de usar.
  Elas devem fornecer informações suficientes para assegurar que a tripulação verifique se
  determinada lista de verificação é a correta a ser utilizada antes de iniciar seu uso. As
  instruções devem ser concisas, mas com informações suficientes para que as ações sejam corretamente
  executadas.

  5.6.1.15 As listas de verificação devem acomodar as demandas das fases de alta carga de
  trabalho e as limitações de desempenho experimentadas por seres humanos quando estão sob
  estresse. Elas devem responder às especificidades de cada situação, mas também ajudar as
  tripulações na gestão da tarefa global.

  5.6.1.16 Consistência. Os operadores devem padronizar os itens das listas de verificação
  e a sequência dos itens ao máximo, considerando os fabricantes, modelos, variantes e diferenças
  em toda a frota.

  5.6.1.17 Tipos de lista e modo de execução. Para a maioria dos procedimentos normais nos
  postos de pilotagem, uma sequência de ações e verificações é conduzida de memória para configurar
  a aeronave e seus sistemas. O fluxo de memória é seguido por uma lista de verificação contendo
  os seus itens mais críticos e que confirmam se o fluxo foi feito corretamente.

  5.6.1.18 Sincronismo. Dada a criticidade do processo de verificação, é crucial considerar
  a capacidade dos pilotos em focar sua atenção na execução. Os momentos dedicados às leituras
  das listas de verificação devem ser tais que minimizem as distrações e outras tarefas simultâneas.
  O tempo alocado para as listas de verificação deve ser pensado de forma a não interferir
  com outras tarefas e evitar a interrupção.

  5.6.1.19 Papéis. O papel de fornecer a sugestão correta no momento certo para iniciar a
  lista de verificação é sempre atribuído a um dos dois pilotos; geralmente, o PIC no solo
  e o PF no ar. Normalmente, a sugestão vem na forma de uma chamada verbal (por exemplo, "before
  start checklist") e serve para solicitar ao outro piloto para pegar a lista de verificação.
  Supondo que uma lista de verificação para operação normal envolva os dois membros da tripulação
  em um método de challenge-response, ambos os pilotos deveriam dirigir sua atenção para a
  tarefa da lista de verificação. O piloto responsável pela liderança da lista de verificação
  começa por chamar (ou "desafiar") o primeiro item da lista. O outro piloto verifica se o
  item foi feito corretamente e fornece a resposta relevante. Existem diversas variações do
  método challenge-response: após a resposta do piloto respondente, o piloto desafiante pode
  verificar o estado do item desafiado, podendo ou não fornecer uma resposta verbal ou podendo
  passar diretamente a desafiar o próximo item. A verificação pode ou não envolver gestos
  específicos, como apontar para o interruptor relevante, alavanca ou indicação.

  5.6.1.20 Âncora de iniciação. O início de uma lista de verificação é melhor ancorado em
  uma sugestão ou indicação clara que não pode ser facilmente removida, obstruída ou esquecida,
  como a ocorrência de um evento específico (por exemplo, a chegada em um ponto 500 metros
  antes da barra de parada indica a iniciação da lista de verificação antes da decolagem).
  Muitas vezes, o início de uma lista de verificação é deixado em aberto, apenas limitado
  por um intervalo de tempo (por exemplo, a lista de verificação de táxi para ser concluída
  a qualquer momento durante o táxi) e circunstâncias aceitáveis ​​(por exemplo, quando ambos
  os pilotos estão livres de outras funções). As sugestões para iniciar listas de verificação
  nessas situações são muitas vezes apenas uma técnica pessoal entre os pilotos, que usam
  sugestões internas e externas à cabine de comando, para ajudá-los a lembrar-se de iniciar
  a lista de verificação no momento certo. No entanto, tais iniciações "flutuantes" de lista
  de verificação criam um alto risco de não se iniciar a lista de verificação no momento correto
  e, portanto, obrigando-os a ter que lê-la correndo ou até mesmo nem iniciar a lista de verificação.
  A importância de ter sugestões externas claras e confiáveis ​​para desencadear o início
  do procedimento da lista de verificação no ponto certo deve ser sempre enfatizada.

  5.6.1.21 Sinal de conclusão. O sinal de conclusão da lista de verificação indica que a lista
  de verificação efetivamente foi realizada na sua totalidade e leva ao próximo segmento de
  atividades. O sinal de conclusão mais comum é um anúncio verbal, como a frase "Before Taxi
  checklist completed" expressa pelo piloto que foi responsável por liderar a respectiva lista
  de verificação. A chamada de conclusão deve ser escrita como o item da última linha ou centralizada
  abaixo de cada lista de verificação. Quando a chamada de conclusão não está explicitamente
  exposta na lista de verificação, uma camada de redundância é removida e o risco de omissões
  aumenta.

  5.6.1.22 Observância da lista de verificação. Durante a execução da lista de verificação,
  é importante ter em mente que essa execução está sujeita a erros humanos. Os membros da
  tripulação podem omitir ou ignorar itens da lista de verificação ou às vezes responder erroneamente
  a uma lista de verificação acreditando que um item ou uma tarefa foi realizada quando não
  foi. Em outros momentos, os membros da tripulação podem ver o que eles esperam ver, em vez
  do que realmente está indicado ou foi realizado. Uma estratégia que ajuda a superar o erro
  humano é desenvolver políticas para o uso de listas de verificação que exijam rigorosas
  verificações ou verificações cruzadas e reforçar essas políticas por meio de programas de
  treinamento da tripulação. Os procedimentos destinados ao uso das listas de verificação
  devem ser claramente escritos no manual de operação do operador e devem ser compatíveis
  com a filosofia de CRM do operador.'
