title: 5.6.3(d)
text: 'd) ser curto.

  5.6.3.6 Essa ordem ajuda na aprendizagem e aumenta a facilidade de uso. Outra consideração
  possível na ordem é a prioridade do item. A probabilidade de interrupções e distrações aumenta
  com a extensão da lista de verificação e com o tempo necessário para executá-la. Assim,
  mesmo que as listas de verificação contenham principalmente itens importantes, esses podem
  ser priorizados, de forma que os itens com maior criticidade podem ser colocados em primeiro
  na lista de verificação.'
