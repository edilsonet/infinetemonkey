title: Fraseologia
text: '5.6.4 Fraseologia

  5.6.4.1 A parte do desafio de um item da lista de verificação é melhor formulada quando
  reproduz o rótulo usado na cabine de comando para o interruptor, alavanca, indicador ou
  sistema correspondente. A parte da resposta é melhor formulada em termos do status real
  do sistema, posição do interruptor ou da alavanca, ou o valor do parâmetro específico. Por
  exemplo, o sistema de freio automático pode ser configurado para RTO, OFF, ARM, DISARM,
  1, 2, 3, etc. O desafio para esse sistema pode ser "Autobrake" e a resposta pode ser "RTO".
  O PF e o PM só devem usar as frases listadas no SOP ou na lista de verificação para ajudar
  a reduzir qualquer ambiguidade ou confusão.

  5.6.4.2 As respostas genéricas de "set" ou "checked" podem não ser muito informativas e
  não fornecem uma oportunidade tão boa para confirmar a ação correta quanto a indicação real.'
