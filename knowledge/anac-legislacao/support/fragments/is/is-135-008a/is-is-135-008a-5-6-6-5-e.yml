text: 'e) reinicie a leitura do checklist desde o começo, quando interrompido.

  5.7 Briefings

  5.7.1 O SOP deve fornecer aos pilotos linhas gerais para a condução dos briefings, com o
  conteúdo que deve ser abordado. Os briefings devem, idealmente, começar antes mesmo da aceitação
  da aeronave pelo comandante, com o levantamento das condições da rota a ser voada e informações
  sobre a aeronave e tripulação, assim como verificação da documentação de voo em geral.

  5.7.2 A função dos briefings é estabelecer uma consciência situacional conjunta e unificada
  para os tripulantes, criando expectativas e definindo critérios e regras para a boa condução
  do voo. Para tanto, os tripulantes devem saber não só como conduzir um briefing, mas também
  o melhor momento para fazê-lo.'
