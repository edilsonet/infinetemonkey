text: '5.7.3 Quando em solo, devem ser evitados briefings com a aeronave em movimento, a fim
  de evitar perda da consciência situacional da tripulação.

  5.7.4 Quando em voo, deve-se preferir a realização dos briefings em momentos de menor carga
  de trabalho, evitando-se o acúmulo de tarefas e a perda da consciência situacional. Dessa
  forma, em voos muito curtos, recomenda-se que o briefing de aproximação seja executado ainda
  em solo.

  5.7.5 Um bom briefing deve revisar os procedimentos a serem realizados e as condições que
  serão encontradas, na ordem em que ocorrerão, bem como elementos particulares de risco para
  a operação a ser conduzida, e como esses riscos serão mitigados, de forma clara, objetiva
  e funcional.

  5.7.6 Apesar das recomendações aqui apresentadas, não é necessário que os briefings sejam
  eventos estritamente rígidos e formais. De fato, é melhor que sejam conduzidos de maneira
  natural pela tripulação.

  5.8 O piloto monitorando (PM)'
