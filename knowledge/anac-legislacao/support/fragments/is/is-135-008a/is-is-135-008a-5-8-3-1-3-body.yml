title: Design dos SOP. Os SOP podem deixar de abordar explicitamente tarefas de monitoramento.
text: '5.8.3.1.3 Design dos SOP. Os SOP podem deixar de abordar explicitamente tarefas de
  monitoramento.

  5.8.3.1.4 Modelo mental inadequado do piloto a respeito dos modos dos sistemas de piloto
  automático. Os pilotos podem não ter uma compreensão completa ou exata de todas as funções
  e comportamentos do sistema de piloto automático. Alguns aspectos de sistemas automáticos
  de gestão do voo não são bem combinados com as características humanas de processamento
  de informações.

  5.8.3.1.5 Treinamento. O treinamento pode ignorar a importância do monitoramento e como
  fazê-lo de forma efetiva. A falta de ênfase no monitoramento pode ocorrer no treinamento
  e na avaliação.'
