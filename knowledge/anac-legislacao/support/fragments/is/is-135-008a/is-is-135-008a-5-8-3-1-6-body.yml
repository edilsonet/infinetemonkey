text: '5.8.3.1.6 Desempenho do piloto. Alta carga de trabalho, distração e desatenção podem
  levar a erros de monitoramento.

  5.8.3.2 Além disso, as limitações de desempenho humano devem ser reconhecidas como potenciais
  desafios para um monitoramento eficaz. O cérebro humano tem dificuldade com uma longa e
  sustentada vigilância e tem uma capacidade de exercer multitarefas muito limitada. Os pilotos
  são vulneráveis ​​a interrupções, distrações e a limitações cognitivas que afetam o que
  eles percebem e não percebem.

  5.8.3.3 Pode ser difícil para os seres humanos monitorar erros e desvios de maneira contínua
  quando erros e desvios raramente ocorrem. Isso é verdade para a gama de condições de carga
  de trabalho experimentadas pelos membros da tripulação de voo. O monitoramento durante os
  períodos de elevada carga de trabalho é importante, já que esses períodos apresentam situações
  num fluxo rápido, e porque a alta carga de trabalho aumenta a vulnerabilidade a erros. No
  entanto, estudos mostram que o mau desempenho no monitoramento pode estar presente também
  durante períodos de baixa carga de trabalho. Lapsos no desempenho do monitoramento durante
  períodos de menor carga de trabalho estão frequentemente associados com o tédio, complacência
  ou ambos.'
