title: 'Há vários potenciais desafios e barreiras para o monitoramento eficaz:'
text: '5.8.3.1 Há vários potenciais desafios e barreiras para o monitoramento eficaz:

  5.8.3.1.1 Pressão do tempo. A pressão do tempo pode agravar a alta carga de trabalho e aumentar
  os erros dos pilotos. Pode também levá-los a executar as tarefas sem a atenção necessária.

  5.8.3.1.2 Falta de feedback aos pilotos quando lapsos de monitoramento ocorrem. Os pilotos
  muitas vezes não estão cientes que o desempenho do monitoramento se degradou.'
