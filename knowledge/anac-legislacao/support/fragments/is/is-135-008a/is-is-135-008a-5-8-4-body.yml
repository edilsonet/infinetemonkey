text: '5.8.4 Definindo as tarefas de monitoramento do piloto

  5.8.4.1 Em uma operação de dois pilotos, um piloto é designado como PF e um piloto é designado
  como PM. Uma análise dos manuais dos operadores indica que os papéis e tarefas associados
  ao PF e ao PM nem sempre são claramente definidos. Cada operador deve definir explicitamente
  as funções do PF e do PM, inclusive:'
