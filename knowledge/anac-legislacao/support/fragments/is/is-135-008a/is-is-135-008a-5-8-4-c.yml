section_title: Definindo as tarefas de monitoramento do piloto
subsection_id: c
cite: 5.8.4(c)
title: 5.8.4(c)
text: c) o PF está sempre engajado em voar a aeronave (mesmo quando a aeronave está sob controle
  do piloto automático) e evita tarefas ou atividades que o distraiam desse compromisso. Se
  o PF tem de se envolver em atividades que o distraiam do controle da aeronave, o PF deve
  transferir o controle da aeronave para o outro piloto e, em seguida, assumir o papel do
  PM;
