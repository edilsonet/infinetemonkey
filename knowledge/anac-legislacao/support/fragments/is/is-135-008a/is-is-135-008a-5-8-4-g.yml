text: g) o PF fornece um briefing para o piloto que está voltando de uma pausa. O briefing
  deve conter informações adequadas para assegurar ao piloto que está retornando uma atualização
  sobre o estado da aeronave e dos sistemas e instruções atuais do ATC.
