title: Políticas e procedimentos operacionais
text: '5.8.5 Políticas e procedimentos operacionais

  5.8.5.1 Políticas e procedimentos operacionais devem ser desenvolvidos ou revistos para
  garantir que a divisão de tarefas e responsabilidades entre os membros da tripulação de
  voo proteja a capacidade do PF de controlar a trajetória de voo. Deve se evitar atribuir
  tarefas não relacionadas à trajetória de voo ao PF. Dados operacionais devem ser coletados
  e usados ​​para revisar definições dos papéis e responsabilidades do PF e do PM para garantir
  a eficácia de cada função. Os operadores são incentivados a adotar uma abordagem integrada
  em operações e treinamento (incluindo inicial e periódico) para enfatizar as responsabilidades
  e a importância dos papéis do PF e do PM.

  5.8.5.2 Um aspecto crítico das tarefas de monitoramento inclui a intervenção quando um desvio
  é identificado. As políticas, procedimentos e treinamento do operador devem cobrir adequadamente
  a intervenção na trajetória de voo, incluindo a intervenção de humano para humano.'
