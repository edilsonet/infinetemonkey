title: Estratégias de intervenção
text: '5.8.6 Estratégias de intervenção

  5.8.6.1 Uma intervenção assume que um problema real ou potencial foi detectado. Um PM eficaz
  pode ajudar a detectar um problema, o que é necessário antes que uma intervenção possa começar.
  Esse é um ponto importante, pois o piloto não pode intervir a menos que uma condição que
  exija uma intervenção seja corretamente reconhecida. Se a atividade de monitoramento for
  bem-sucedida (condição problemática é reconhecida), então o piloto deve saber qual intervenção
  é apropriada para essa situação.'
