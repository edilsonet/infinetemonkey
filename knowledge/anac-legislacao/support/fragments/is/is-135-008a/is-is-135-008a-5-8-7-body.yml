cite: 5.8.7
title: Treinamento para PM
text: '5.8.7 Treinamento para PM

  5.8.7.1 Um operador deve treinar seus pilotos em todas as políticas e procedimentos relacionados
  ao monitoramento da trajetória de voo (por exemplo, call-outs, dupla chamada etc.). Esse
  treinamento também deve incluir qualquer uma das práticas recomendadas pelo operador.

  5.8.7.2 Os pilotos devem ser treinados sobre as responsabilidades do PM em monitorar a trajetória
  de voo. Em particular, os pilotos devem ser treinados para reconhecer quando o PF não está
  controlando adequadamente a trajetória de voo ou quando o PM não está monitorando adequadamente
  a trajetória de voo. Esse treinamento deve incluir o acúmulo de carga de trabalho do piloto
  e diminuição do desempenho. Alguns exemplos incluem a falta de comunicação, atenção canalizada
  e incapacidade de fazer call-outs necessários.

  5.8.7.3 Os pilotos devem ser treinados sobre os erros comuns relacionados ​​ao monitoramento
  da trajetória de voo. Isso inclui treinamento em métodos apropriados de reconhecimento de
  precursores e sinais de degradação do monitoramento e resolução de erros ou lapsos de monitoramento.

  5.8.7.4 Os pilotos devem ser treinados no conceito de que existem situações previsíveis
  durante cada fase de voo, quando o risco de desvio da trajetória de voo é aumentado, elevando
  a importância da gestão adequada da carga de trabalho. Se o PM é treinado para reconhecer
  as fases de voo ou situações em que a tripulação está mais vulnerável ​​a desvios da trajetória
  de voo (inclusive quando existe pouco tempo para corrigir desvios), ele poderia planejar
  estrategicamente as tarefas e a carga de trabalho para maximizar o monitoramento durante
  aquelas fases.

  5.8.7.5 Os pilotos devem ser treinados em princípios de CRM/TEM (gerenciamento de erros
  e ameaças) e vulnerabilidades do desempenho humano relacionados: ao monitoramento, à importância
  do monitoramento e às práticas aprovadas do operador que alcancem um monitoramento eficaz
  da trajetória de voo.'
