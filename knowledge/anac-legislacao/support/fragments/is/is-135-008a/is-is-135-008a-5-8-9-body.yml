text: '5.8.9 Considerações sobre o piloto automático.

  5.8.9.1 Confusão de modo de piloto automático. Dados de segurança operacional (incluindo
  acidentes, incidentes, LOSA, FOQA e dados do SGSO) têm mostrado que a confusão de modo de
  piloto automático é uma vulnerabilidade potencial em operações de voo e merece atenção especial
  durante as tarefas de monitoramento. Os pilotos devem ser capazes de demonstrar o conhecimento
  e a habilidade necessários para corretamente selecionar, interpretar e antecipar os modos
  normais de piloto automático, bem como devem ser capazes de demonstrar ações corretivas
