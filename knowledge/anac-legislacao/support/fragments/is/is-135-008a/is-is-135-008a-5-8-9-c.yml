text: 'c) compreender anúncios de modo de pitch e suas relações com a potência disponível,
  bem como o estado de energia da aeronave (por exemplo, o risco de utilizar o modo de vertical
  speed para subir em altitudes elevadas com potência disponível limitada).

  5.8.9.2 O equipamento e a cultura do operador podem influenciar na forma como protocolos
  de conscientização dos modos de piloto automático são concebidos e implementados. Portanto,
  um operador deve criar procedimentos de conscientização dos modos que reflitam o equipamento
  e como o operador emprega o equipamento, treina os pilotos e avalia os procedimentos. Ao
  formular SOP de conscientização dos modos de piloto automático, o operador deve considerar
