text: '5.9.1 Esta seção apresenta o conteúdo mínimo necessário para um SOP efetivo e aceitável
  pela ANAC, conforme a operação requerida pelo detentor de certificado.

  5.9.2 Caso o operador opte por ter um AOM (Manual de Operações da Aeronave), o SOP deverá
  ser elaborado levando-se em consideração as orientações da IS nº 135-009.

  5.9.3 O SOP deve conter no mínimo procedimentos e responsabilidades em situações normais
  atribuídos à tripulação, incluindo as listas de verificação correspondentes, o procedimento
  de como e quando usá-los e os procedimentos de coordenação necessários entre as tripulações
  de voo e cabine.'
