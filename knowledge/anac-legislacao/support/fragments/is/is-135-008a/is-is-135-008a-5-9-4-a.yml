subsection_id: a
cite: 5.9.4(a)
title: 5.9.4(a)
text: 'a) procedimentos pré-voo:

  I - condições técnicas da aeronave (MEL);

  II - database EFB/FMS/GNSS;

  III - NOTAM;

  IV - meteorologia;

  V - navegação e combustível requerido;

  VI - inspeção externa;

  VII - briefing aos passageiros; e

  VIII - análise de performance requerida para decolagem;'
