section_id: 5.9.4
section_title: 'Os procedimentos e responsabilidades normais devem incluir, pelo menos:'
subsection_id: b
cite: 5.9.4(b)
title: 5.9.4(b)
text: 'b) procedimentos para partida e táxi:

  I - autorização de tráfego;

  II - briefing do plano de voo autorizado;

  III - briefing da saída (SID) (se aplicável);

  IV - briefing dos procedimentos para atenuação de ruído (se aplicável);

  V - briefing de saída em condições VFR (se aplicável);

  VI - briefing das condições da pista (meteorológicas e NOTAM);

  VII - briefing de emergência e procedimentos de contingência;

  VIII - briefing do procedimento de táxi autorizado ou que será executado (taxiways, hot
  spots, cruzamento de pista, incursão de pista);

  IX - configuração da aeronave para táxi (monomotor);

  X - ajuste dos instrumentos de navegação;

  XI - ajuste do FMS/GNSS (se aplicável);

  XII - velocidades aplicáveis às condições de decolagem;

  XIII - ajuste e verificação (cheque cruzado) dos altímetros;

  XIV - verificação de motores (se aplicável);

  XV - verificação de comandos;

  XVI - configuração da aeronave para decolagem - flapes;

  XVII - configuração da aeronave para decolagem - compensadores;

  XVIII - procedimentos para troca de cabeceira; e

  XIX - execução, leitura e conferência dos itens da lista de verificação (checklist de táxi);'
