section_title: 'Os procedimentos e responsabilidades normais devem incluir, pelo menos:'
subsection_id: c
cite: 5.9.4(c)
title: 5.9.4(c)
text: 'c) decolagem e subida:

  I - cheque de motores (se aplicável e não realizado anteriormente);

  II - cheque de comandos (se não realizado anteriormente);

  III - configuração da aeronave para decolagem - flapes (se não realizado anteriormente);

  IV - configuração da aeronave para decolagem - compensadores (se não realizado anteriormente);

  V - procedimentos para troca de cabeceira (se não realizado anteriormente);

  VI - execução, leitura e conferência dos itens da lista de verificação (checklist de decolagem);
  e

  VII - call-outs de velocidades (se aplicável);

  VIII - call-outs de altitudes (transição e altitude mínima de segurança) (se aplicável);

  IX - uso do automatismo/piloto automático;

  X - procedimento sterile cockpit;

  XI - uso do radar meteorológico; e

  XII - transferência de controle da aeronave;'
