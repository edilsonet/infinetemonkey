section_title: 'Os procedimentos e responsabilidades normais devem incluir, pelo menos:'
subsection_id: g
cite: 5.9.4(g)
title: 5.9.4(g)
text: 'g) aproximação perdida:

  I - configuração da aeronave no procedimento de arremetida (flapes de arremetida, call-outs,
  recolhimento do trem de pouso (se aplicável), aceleração e recolhimento dos flapes, setagem
  das altitudes e uso do automatismo/piloto automático (se aplicável);

  II - preparação para novo procedimento; e

  III - preparação para desvio ao aeroporto de alternativa;'
