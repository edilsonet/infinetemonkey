section_title: 'Os procedimentos e responsabilidades normais devem incluir, pelo menos:'
subsection_id: i
cite: 5.9.4(i)
title: 5.9.4(i)
text: 'i) procedimentos após o pouso:

  I - transferência de controles da aeronave; e

  II - comunicação com os órgãos ATS.

  5.9.5 Caso o operador não possua um AOM, o SOP também deverá incluir procedimentos e tarefas
  em situações anormais e de emergência atribuídos à tripulação, incluindo as listas de verificação
  correspondentes, o procedimento de como e quando usá-los e os procedimentos de coordenação
  necessários entre as tripulações de voo e cabine.'
