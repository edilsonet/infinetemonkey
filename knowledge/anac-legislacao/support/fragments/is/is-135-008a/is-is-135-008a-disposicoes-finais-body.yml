title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 Os operadores aéreos devem apresentar os SOP à SPO, conforme as orientações dispostas
  nesta IS, em um período de até 1 (um) ano a partir da vigência desta IS, ou em período inferior
  caso haja alguma alteração nos SOP neste período.

  7.2 Os casos omissos serão dirimidos pela SPO.'
