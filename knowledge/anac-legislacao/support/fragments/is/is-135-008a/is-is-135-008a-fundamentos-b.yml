text: 'b) RBAC nº 135 - Operações de transporte aéreo público com aviões com configuração
  máxima certificada de assentos para passageiros de até 19 assentos e capacidade máxima de
  carga paga de até 3.400 kg (7.500 lb), ou helicópteros.

  3.4 Esta IS apresenta meios aceitáveis de cumprimento para o parágrafo 135.23(a)(35) do
  RBAC nº 135.'
