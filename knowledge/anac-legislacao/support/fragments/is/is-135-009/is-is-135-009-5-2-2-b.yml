cite: 5.2.2(b)
title: 5.2.2(b)
text: 'b) identificar explicitamente os procedimentos críticos do operador que necessitem
  cotejamento; deve também estar claro qual o tripulante responsável pela confirmação da ação.
  Os tipos de procedimentos que requerem cotejamento incluem, mas não se limitam a:

  I - ações que resultem no corte de um motor;

  II - ações que resultem na desativação de algum controle de voo;

  III - ações que, se realizadas incorretamente, na sequência errada ou em momento inoportuno,
  possam produzir um resultado catastrófico, mesmo que tais ações sejam improváveis; e

  IV - ações que, por meio de experiência ou análise, demonstraram grande probabilidade de
  erro, resultando em uma situação de perigo;'
