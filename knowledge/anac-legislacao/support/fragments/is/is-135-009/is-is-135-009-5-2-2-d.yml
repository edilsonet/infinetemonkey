section_title: 'Além disso, o AOM deve:'
subsection_id: d
cite: 5.2.2(d)
title: 5.2.2(d)
text: 'd) possuir linguagem e estruturas claras e acessíveis ao público-alvo do manual, isto
  é, tripulantes e outras pessoas envolvidas diretamente na operação da aeronave e no controle
  operacional. O operador é responsável por assegurar-se de que o idioma utilizado no AOM
  é compreendido satisfatoriamente por todas as pessoas que irão utilizá-lo.

  5.2.3 Em função do tamanho e da complexidade do operador e das aeronaves da sua frota, o
  AOM pode ser composto por volumes adicionais ao seu volume principal. Estes volumes deverão
  manter a estrutura de capítulos e seções estabelecida nesta IS.'
