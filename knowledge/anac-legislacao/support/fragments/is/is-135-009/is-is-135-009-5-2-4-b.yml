section_title: 'Exemplos de manuais comumente usados para complementar o AOM são:'
subsection_id: b
cite: 5.2.4(b)
title: 5.2.4(b)
text: 'b) Manual de Procedimentos Operacionais Padronizados (SOP).

  5.2.5 A referência deve ser exata, ou seja, deve trazer a seção, capítulo e item do manual
  referenciado. O operador também deverá citar no AOM qual a revisão e data de efetividade
  de cada manual referenciado em seu AOM.

  5.2.6 Além disso, é importante ressaltar que o(s) manual(is) referenciado(s) passa(m) a
  ser parte(s) integrante(s) do AOM. Dessa forma, quaisquer alterações neste(s) manual(is)
  implica(m) em revisão do AOM, estando assim o AOM sujeito à aceitação ou aprovação da ANAC,
  conforme os casos indicados no item seguinte.

  5.3 Processo de aceitação e aprovação do manual

  5.3.1 Formalmente, o procedimento administrativo a ser seguido para a aceitação da revisão
  original e de posteriores alterações do AOM é aquele previsto na IS nº 119-004.'
