section_title: 'As revisões do AOM são divididas em dois níveis:'
subsection_id: b
cite: 5.3.3(b)
title: 5.3.3(b)
text: 'b) partes aceitas: partes que podem ser revisadas e colocadas em prática pelo operador
  sem que haja necessidade de aval prévio da ANAC, sendo obrigatório apenas o envio de uma
  cópia do manual revisado à ANAC. Caso a ANAC, posteriormente, identifique deficiências nas
  partes aceitas, o operador deverá corrigi-las nos prazos e condições estabelecidos.'
