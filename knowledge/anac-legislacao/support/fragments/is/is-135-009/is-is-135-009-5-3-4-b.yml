section_id: 5.3.4
section_title: 'Para identificar esses dois níveis, a revisão do AOM deve ser identificada
  por dois números, no formato “N1.N2”, sendo que:'
subsection_id: b
cite: 5.3.4(b)
title: 5.3.4(b)
text: 'b) N2 é o número da revisão das partes aceitas, iniciando-se por 0 (zero) na revisão
  original e sendo incrementado por 1 (um) a cada alteração do conteúdo do manual, exceto
  se houver revisão das partes aprovadas, quando voltará a zero.

  Exemplo: caso a revisão atual do AOM seja a “01.12”, quando da próxima alteração apenas
  de partes aceitas, esta revisão será a “01.13”. Quando da próxima alteração de alguma parte
  aprovada, esta revisão será a “02.00” (sempre que houver revisão das partes aprovadas, o
  número N2 voltará a zero).

  Nota: no caso de revisão de partes aprovadas do AOM, todas as páginas do documento deverão
  receber o número da revisão que está sendo solicitada. Usando como referência o exemplo
  acima, todas as páginas deverão receber a revisão “02.00”'
