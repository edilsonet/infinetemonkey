section_title: 'As seguintes alterações ao AOM deverão ser aprovadas pela ANAC:'
subsection_id: c
cite: 5.3.5(c)
title: 5.3.5(c)
text: 'c) alterações solicitadas ou determinadas por ações de fiscalização e vigilância continuada
  pela ANAC.

  Nota: o material técnico de engenharia utilizado como referência para escrever os procedimentos
  ou dados de desempenho, quando diferente do AFM ou RFM, deve ser anexado ao processo.

  5.3.6 A revisão original do AOM é integralmente aprovada, ou seja, todos os capítulos e
  informações devem ser aprovados pela ANAC, antes de o AOM ser colocado em uso pelo operador.'
