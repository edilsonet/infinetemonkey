text: 'd) peso operacional seco e seu centro de gravidade ou índice correspondente.

  B9. CARREGAMENTO

  B9.1. Procedimentos e instruções para carregar, afixar e descarregar a carga.

  B10. MATERIAIS DE SOBREVIVÊNCIA E EMERGÊNCIA, INCLUINDO OXIGÊNIO

  B10.1. Lista de verificação de equipamentos de sobrevivência, emergência e segurança transportados
  para rotas a serem voadas, incluindo procedimentos para verificar antes que o equipamento
  é adequado para o serviço, bem como localização, acesso e uso de equipamentos de sobrevivência,
  emergência e segurança e listas de verificação associadas.

  B10.2. Procedimentos para determinar a quantidade de oxigênio requerida e a quantidade disponível,
  tendo em conta o perfil de voo, o número de ocupantes e a possível descompressão da cabine.

  B11. PROCEDIMENTOS DE EVACUAÇÃO DE EMERGÊNCIA

  B11.1. Instruções para a preparação da evacuação de emergência, incluindo a coordenação
  com a tripulação.

  B12. SISTEMAS DA AERONAVE

  B12.1. Descrição dos sistemas de aeronave, controles associados e indicações e instruções
  operacionais.'
