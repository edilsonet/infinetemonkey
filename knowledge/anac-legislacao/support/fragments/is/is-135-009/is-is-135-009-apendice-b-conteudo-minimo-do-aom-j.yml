text: 'j) velocidades aplicáveis às diferentes fases do voo (considerando pistas secas, molhadas
  ou contaminadas).

  B6.3. Dados suplementares para voos sob condições de gelo, incluindo dados de desempenho
  para as configurações em que algum desvio é permitido pelo fabricante (ex: antiskid inoperante).

  B6.4. Se os dados de desempenho requeridos para a apropriada classe de performance da aeronave
  não estiverem disponíveis no AFM/RFM, outros dados de desempenho, e suas respectivas referências
  técnicas, podem ser inseridos no AOM.

  Nota: o material técnico de engenharia utilizado como referência para escrever os procedimentos
  ou dados de desempenho, quando diferente do AFM ou RFM, deve ser anexado ao processo.

  B6.5. O AOM pode apenas referenciar dados do AFM/RFM, quando tais dados provavelmente não
  forem utilizados com frequência ou em uma situação de emergência.

  B6.6. Dados de desempenho adicionais, incluindo:'
