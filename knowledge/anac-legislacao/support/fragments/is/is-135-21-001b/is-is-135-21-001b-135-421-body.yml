text: '135.421

  ANV''s <= 9 PAX devem usar um programa de manutenção do fabricante ou aprovado (135.419)

  MGM


  43.9

  Conteúdo, forma e disposição de registros de manutenção, manutenção preventiva, reconstrução
  e alteração (exceto inspeções realizadas conforme o RBAC nº 91 ou conforme o parágrafo 135.411(a)(1)
  ou a seção 135.419 do RBAC nº 135)

  MGM


  43.11(a)

  Anotação nos registros de manutenção

  MGM


  43.13(a)

  Utilização de ferramentas, equipamentos e aparelhos de teste de qualidade para manutenção

  MGM


  43.13(b)

  Utilização de materiais de qualidade para manutenção

  MGM


  43.13 (d-I)

  Provisões especiais para reaproveitamento de partes, componentes e equipamentos provenientes
  de aeronaves perecidas. (Ver IS nº 43.13-004)

  MGM


  43.15 (a)(b)

  Regras adicionais para execução de inspeções

  MGM


  43.15(c)(1)(2)

  Inspeção anual e inspeção de 100 h (Apêndice D do RBAC nº 43)

  MGM


  43.15(c)(3)

  Teste de desempenho dos motores a turbina, após inspeção de 100 h

  MGM


  91.171

  Verificação do equipamento de VOR para voo IFR

  MGM


  91.203

  Aeronave civil - documentos requeridos

  MGM


  91.207(c)/(d)

  Transmissores localizadores de emergência (ELT) e Personal Locator Beacon (PLB)


  91.207 (e)/(f)

  Condições para translado com ELT inoperante ou prazo para correção do ELT fixo que está
  em pane. (Colocar na MEL)

  MGM


  91.403 (a)

  Operador/Proprietário é o responsável primário pela aeronavegabilidade

  MGM


  91.403(b)(c)

  Manutenção de acordo com regulamentos, inclusive RBAC nº 43, e em cumprimento com as limitações
  de aeronavegabilidade

  MGM


  91.405

  Manutenção requerida

  MGM


  91.407

  Operação após manutenção, manutenção preventiva, reconstrução ou alterações

  MGM


  91.411

  Equipamentos de testes e inspeções em sistema de altímetro e em equipamento automático de
  informação de altitude (Modo C)

  MGM


  91.413

  Testes e inspeções do transponder. (Apêndice F do RBAC nº 43)

  MGM


  91.417

  Registros de manutenção

  MGM


  91.419

  Transferência de registros de manutenção

  MGM'
