title: 5.2.2.3(a)
text: a) Organização do Sistema de Manuais. Sob este título deverão ser discriminados todos
  os manuais que compõem o manual de empresa requerido pela seção 135.21, do RBAC nº 135,
  e de que forma o MGM se relaciona com cada um deles. Também deverão ser descritos os critérios
  utilizados para organizar o MGM, especificando as divisões em capítulos, seções e numeração
  de páginas.
