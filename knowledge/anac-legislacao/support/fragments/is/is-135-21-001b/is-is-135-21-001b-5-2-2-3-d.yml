section_title: 'Sistema de controle do MGM:'
subsection_id: d
cite: 5.2.2.3(d)
title: 5.2.2.3(d)
text: d) Revisão/Distribuição. Deverão ser estabelecidos procedimentos para revisão do MGM
  e uma descrição do sistema de distribuição aos seus detentores, ou seja, aquelas pessoas
  ou órgãos cujo manual ou partes apropriadas do mesmo (incluindo correções e alterações)
  devem ser colocadas à disposição. Tal sistema de distribuição deve atender aos requisitos
  aplicáveis da seção 135.21, do RBAC nº 135, incluindo o que dispõe que a Anac é uma das
  detentoras do manual.
