cite: 5.2.2.4(b)
title: 5.2.2.4(b)
text: b) Apresentar um organograma mostrando as linhas e os níveis de autoridade da estrutura
  de manutenção e de suporte. O diretor ou gerente de manutenção deve ter o mesmo nível de
  autoridade que o diretor ou gerente de operações. Se for proposta uma estrutura de manutenção
  com um setor de inspeção separado do setor de manutenção (condição não requerida pelo RBAC
  nº 135 para os operadores enquadrados na aplicabilidade desta IS), a separação deve ser
  feita imediatamente abaixo do nível administrativo com responsabilidade geral pelas atividades
  de inspeção e manutenção, normalmente o diretor ou gerente de manutenção.
