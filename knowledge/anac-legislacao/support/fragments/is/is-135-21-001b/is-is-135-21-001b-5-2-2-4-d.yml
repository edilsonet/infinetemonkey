title: 5.2.2.4(d)
text: 'd) Descrever a autoridade e responsabilidade de cada pessoa envolvida nas atividades
  de manutenção.

  I- A autoridade e responsabilidade previstas no MGM devem englobar, por exemplo, quem será
  o responsável direto pela biblioteca técnica, se será o diretor ou gerente de manutenção
  ou uma outra pessoa designada.

  II- O MGM deve, ainda, definir claramente que o diretor ou gerente de manutenção requerido
  pelo RBAC nº 119 é o responsável técnico da empresa perante a Anac.'
