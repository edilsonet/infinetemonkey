section_title: Aprovação para retorno ao serviço
subsection_id: d
cite: 5.2.3.3(d)
title: 5.2.3.3(d)
text: d) Descrever como é feito no livro de bordo (referenciado na Seção 135.65, do RBAC nº
  135) o registro da aprovação para retorno ao serviço após manutenção de menor periodicidade
  (por exemplo inspeções diárias, de trânsito etc.), inclusive quanto à descrição da manutenção
  realizada, a data de execução e assinatura e identificação do executante.
