section_title: Inspeções de partes e materiais
subsection_id: a
cite: 5.2.3.4(a)
title: 5.2.3.4(a)
text: 'a) Estabelecer procedimentos para inspeção de recebimento de materiais e partes, incluindo
  a verificação das condições do material quanto a danos, corrosão, deterioração e outros
  defeitos. Deverão englobar ainda, conforme aplicável, a documentação associada à aquisição
  do material, tal como: ordem de compra, FORM 8130, ordem de remessa, laudo de revisão ou
  reparo, número da Technical Standard Order (TSO) ou Parts Manufacturer Approval (PMA) da
  Federal Aviation Administration (FAA) ou equivalente, e Ordem Técnica Padrão (OTP) ou Atestado
  de Produto Aeronáutico Aprovado (APAA) emitido pela Anac.'
