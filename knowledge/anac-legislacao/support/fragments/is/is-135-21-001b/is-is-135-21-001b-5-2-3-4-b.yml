title: 5.2.3.4(b)
text: 'b) Estabelecer procedimentos para que nenhum material ou parte seja enviado para o
  estoque sem que esteja adequadamente identificado. Poderão ser utilizados nesta identificação,
  conforme aplicável, procedimentos de etiquetagem que identifiquem: limite de vida estabelecido,
  data de vencimento de calibração, ou outros limites, atestando sua condição aeronavegável,
  não aeronavegável, ou de peça condenada.'
