title: 5.2.3.5(c)
text: c) Estabelecer que os equipamentos, testes e ferramentas, para os quais a calibração
  é requerida, deverão ser calibrados em intervalos previstos nos manuais dos fabricantes,
  ou, na ausência de orientação do fabricante, em intervalos previstos em normas técnicas
  estabelecidas ou consagradas. Adicionalmente, cada um destes equipamentos deve ser recalibrado
  sempre que o item sofrer danos ou mau manuseio, ou quando houver suspeita de que não esteja
  em condições adequadas de uso.
