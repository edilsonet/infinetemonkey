title: 5.2.3.6(a)
text: 'a) Estabelecer procedimentos e responsabilidades em relação a voos de experiência.

  I- Os procedimentos devem abranger o contido na seção 91.407, do RBAC nº 91.

  II- Deverão ser definidas as situações, de acordo com a seção 91.407, RBAC nº 91, nas quais
  serão requeridos os voos de experiência. Por exemplo, após a conclusão de cheques C, inspeção
  de 1.200 horas, CVA ou serviços de periodicidade ou complexidade tais que requeiram voo
  de experiência.'
