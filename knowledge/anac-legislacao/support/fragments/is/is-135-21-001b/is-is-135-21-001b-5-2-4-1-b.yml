title: 5.2.4.1(b)
text: 'b) Descrever procedimentos quanto à confecção e atualização da presente situação das
  diretrizes de aeronavegabilidade aplicáveis de acordo com o requerido na seção 91.417, do
  RBAC nº 91.

  5.2.4.2 Boletins e cartas de serviço. Descrever procedimentos e responsabilidades relativas
  à aquisição, ao recebimento, atualização, análise e avaliação, garantindo que aqueles boletins
  de caráter mandatório serão cumpridos conforme requerido.

  5.2.4.3 Programa de manutenção. Procedimentos e responsabilidades relativas à execução e
  acompanhamento da programação de manutenção das aeronaves, motores, rotores, hélices, componentes
  e equipamento de emergência de acordo com o previsto na seção 91.409, do RBAC nº 91, e na
  seção 135.421, do RBAC nº 135.'
