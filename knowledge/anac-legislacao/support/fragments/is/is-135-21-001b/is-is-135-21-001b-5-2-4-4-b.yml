title: 5.2.4.4(b)
text: b) Deverão ser definidos procedimentos garantindo que após a execução de uma grande
  alteração ou de um grande reparo será preenchido o formulário SEGVOO 001, de acordo com
  a IS nº 43.9-001, com remessa da competente via à Anac, antes da aprovação da aeronave para
  retorno ao serviço.
