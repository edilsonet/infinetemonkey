title: 5.2.4.5(b)
text: b) O MGM deverá conter procedimentos que garantam que as aeronaves da frota sejam repesadas
  sempre que houver dúvidas quanto à exatidão de seu peso e balanceamento; após ter sido submetida
  a serviços de manutenção, alterações e reparos que possam ter alterado seu peso, incluindo
  pintura geral, grandes reparos, grandes alterações, mudanças de configuração etc.
