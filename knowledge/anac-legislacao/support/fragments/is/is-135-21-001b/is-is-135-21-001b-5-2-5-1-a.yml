title: 5.2.5.1(a)
text: 'a) O MGM deverá assegurar que o diretor ou gerente de manutenção mantenha os dados
  abaixo para planejar e disponibilizar as aeronaves para as operações de voo, estabelecendo
  as coordenações necessárias com outros setores do operador ou empresas contratadas.

  I- Os tipos e configurações de cada aeronave (número de assentos, configurações de cabine
  aprovadas, etc.).

  II- Manutenções previstas para cada aeronave.

  III- Capacidade de manutenção de cada base ou provedor de manutenção, se aplicável.'
