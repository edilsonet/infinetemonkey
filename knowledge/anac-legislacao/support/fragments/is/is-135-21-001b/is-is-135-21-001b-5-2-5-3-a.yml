text: a) O MGM deve prover procedimentos que assegurem que a disponibilização constante sobre
  a condição dos materiais ao diretor ou gerente de manutenção de todo o material aeronáutico
  da empresa. Por exemplo, adequabilidade para uso, validade, quantidade, etc.
