title: 5.2.5.3(b)
text: b) O MGM deve conter procedimentos de forma a assegurar que o diretor ou gerente de
  manutenção disporá das informações relativas à disponibilidade de partes, componentes, consumíveis,
  ferramentas e equipamentos de apoio necessários à execução da manutenção requerida, em tempo
  hábil, de forma a permitir a adequada programação. Informações sobre elegibilidade de peças
  e inspeções de recebimento podem ser encontradas na IS nº 43-001.
