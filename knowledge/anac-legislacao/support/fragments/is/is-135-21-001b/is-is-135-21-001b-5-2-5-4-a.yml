section_title: Controle Técnico de Manutenção (CTM)
subsection_id: a
cite: 5.2.5.4(a)
title: 5.2.5.4(a)
text: 'a) O MGM deve descrever como será feito o controle da manutenção das aeronaves, motores,
  rotores, hélices e componentes e equipamentos de emergência incluindo, no mínimo, os seguintes
  itens:

  I- A indicação da presente situação de partes com tempo de vida limitado, de cada célula,
  motor, hélice, rotor e equipamentos;

  II- O tempo desde a última revisão geral de cada item aplicável instalado em cada aeronave;

  III- A indicação da presente situação de inspeções nas aeronaves, incluindo tempo desde
  a última inspeção requerida pelo programa de manutenção;

  IV- A situação corrente das diretrizes de aeronavegabilidade aplicáveis, incluindo data
  e métodos de conformidade, se a diretriz envolve ações periódicas, tempo e data para a próxima
  ação requerida; e

  V- Uma lista atualizada de grandes alterações e grandes reparos de cada célula, motor, hélice,
  rotor e equipamento.'
