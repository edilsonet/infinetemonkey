cite: 5.2.5.4(b)
title: 5.2.5.4(b)
text: b) Nos casos em que serviços de processamento de informações técnicas forem contratados,
  tais serviços devem estar minuciosamente detalhados no MGM, e os procedimentos e responsabilidades
  devem estar claramente definidos, principalmente quanto ao fluxo de informações, tipo das
  informações, monitoramentos necessários, a frequência com que cada uma das partes contratadas
  deve tomar providências e a natureza de tais providências. O MGM deve exemplificar, por
  meio de formulários padronizados, toda a rotina dos serviços contratados.
