section_title: Execução e aprovação dos serviços
subsection_id: b
cite: 5.2.6.2(b)
title: 5.2.6.2(b)
text: b) O MGM deverá estabelecer procedimentos que garantam que uma OS só poderá ser considerada
  encerrada quando da assinatura do inspetor autorizado, aprovando o produto para retorno
  ao serviço. Para tal aprovação deverá ser verificado que não existem condições conhecidas
  que impeçam a aeronavegabilidade do produto e, no que diz respeito ao trabalho executado,
  que o produto está em condições de operar com segurança. Adicionalmente, devem existir procedimentos
  que assegurem que o trabalho seja realizado em conformidade com os requisitos do manual
  da empresa.
