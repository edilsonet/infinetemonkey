section_title: Manutenção não programada. O MGM deve estabelecer procedimentos para a execução
  de manutenção não programada.
subsection_id: a
cite: 5.2.6.3(a)
title: 5.2.6.3(a)
text: a) Exceto para aquelas discrepâncias registradas no livro de bordo, conforme previsto
  em 5.2.6.4, todas as discrepâncias encontradas durante a manutenção devem ser registradas
  em reportes de inspeção. Desta forma, as discrepâncias encontradas durante uma inspeção
  de 600 horas, por exemplo, devem ser registradas nos respectivos reportes de inspeção. Deverá
  ser assegurado que a falta da correção das discrepâncias registradas nos reportes de inspeção
  será impeditiva para o fechamento da ordem de serviço correspondente, caso estejam fora
  do previsto nos manuais aplicáveis dos fabricantes ou no MGM.
