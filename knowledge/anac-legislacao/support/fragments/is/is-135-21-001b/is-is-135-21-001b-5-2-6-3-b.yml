section_id: 5.2.6.3
section_title: Manutenção não programada. O MGM deve estabelecer procedimentos para a execução
  de manutenção não programada.
subsection_id: b
cite: 5.2.6.3(b)
title: 5.2.6.3(b)
text: b) O livro de bordo deve ter provisão para os registros necessários de forma a permitir
  ao piloto em comando a verificação de aeronavegabilidade prevista na Seção 135.71, do RBAC
  nº 135. Por exemplo, tais registros poderão conter a correspondente aprovação para retorno
  ao serviço, incluindo o tipo da última inspeção prevista executada, e da parada programada
  seguinte da aeronave para inspeção.
