section_id: 5.2.6.3
section_title: Manutenção não programada. O MGM deve estabelecer procedimentos para a execução
  de manutenção não programada.
subsection_id: c
cite: 5.2.6.3(c)
title: 5.2.6.3(c)
text: 'c) O MGM deve incluir os modelos de reportes de inspeção a serem adotados pela empresa,
  descrevendo a forma de preenchimento e o seu respectivo trâmite.

  5.2.6.4 Livro de bordo. Devem ser estabelecidos procedimentos assegurando que todas as discrepâncias
  que ocorram durante a operação das aeronaves (por exemplo, em voo, em cheques de trânsito,
  pré-voo ou durante manutenção contratada em caráter emergencial) devem ser registradas no
  livro de bordo. Tais discrepâncias podem incluir falhas e/ou mau funcionamento de equipamentos,
  bem como ocorrências anormais durante o voo, como pouso duro, danos por objetos estranhos
  (FOD), raios etc.'
