title: 5.2.6.3(d)
text: d) Deverá ser assegurado que sempre que um mecânico receber uma aeronave da tripulação
  ele verificará o livro de bordo, tomando todas as medidas necessárias, inclusive junto aos
  tripulantes, para garantir o adequado processamento de todos os reportes encontrados em
  aberto.
