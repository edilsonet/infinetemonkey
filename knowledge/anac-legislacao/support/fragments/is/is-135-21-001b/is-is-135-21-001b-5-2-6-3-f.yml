section_title: Manutenção não programada. O MGM deve estabelecer procedimentos para a execução
  de manutenção não programada.
subsection_id: f
cite: 5.2.6.3(f)
title: 5.2.6.3(f)
text: 'f) Procedimentos alternativos para o livro de bordo poderão ser aceitos, desde que
  seja demonstrado que os objetivos do subparágrafo 5.2.6.4 desta IS são adequadamente atingidos
  pelo operador.

  5.2.6.5 Manutenção postergada. O MGM deve conter procedimentos de forma a assegurar que
  o postergamento da correção de uma discrepância será feito apenas de acordo com uma Lista
  de Equipamentos Mínimos (MEL), uma Configuration Deviation List (CDL), manuais de manutenção,
  de revisão ou reparos, ou outro documento técnico aceitável, e com as disposições contidas
  no próprio MGM.'
