title: Manutenção das aeronaves
text: '5.2.6 Manutenção das aeronaves

  5.2.6.1 Organização. O MGM deve especificar onde será executada a manutenção de cada modelo
  de aeronave, motor, hélice, rotor e equipamentos da empresa. A lista deve abranger todos
  os níveis de manutenção previstos no programa de manutenção utilizado, especificando qual
  a organização executante.'
