title: Instalações e facilidades
text: '5.2.7 Instalações e facilidades

  5.2.7.1 O MGM deve apresentar procedimentos e critérios que garantam que toda a manutenção,
  manutenção preventiva, alterações ou reparos executados pela empresa operadora serão realizados
  em instalações adequadas, incluindo aspectos quanto a proteção, isolamento, iluminação e
  ventilação, conforme aplicável, de acordo com legislação aplicável.

  5.2.7.2 Os detentores de certificado que executam manutenção devem apresentar em seu MGM
  procedimento, a ser expressamente aprovado pela Anac, para gerir uma Lista de Bases de Manutenção
  (LBM).'
