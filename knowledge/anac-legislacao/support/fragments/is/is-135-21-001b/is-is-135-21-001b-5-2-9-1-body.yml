text: '5.2.9.1 O MGM deve conter modelos e instruções para preenchimento e trâmite de todos
  os formulários utilizados, relativos aos assuntos contidos nesta IS.

  5.2.9.2 No caso de necessidade de revisão ou alteração em qualquer dos formulários contidos
  no MGM, devem ser definidos procedimentos que assegurem a apropriada revisão do MGM e a
  distribuição aos usuários de tais formulários.'
