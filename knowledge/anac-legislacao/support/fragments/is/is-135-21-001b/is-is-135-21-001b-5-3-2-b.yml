section_id: 5.3.2
section_title: 'Para identificar esses dois níveis, a revisão do MGM pode ser identificada
  por dois números, no formato “N1.N2”, sendo que:'
subsection_id: b
cite: 5.3.2(b)
title: 5.3.2(b)
text: 'b) N2 é o número da revisão das partes aceitas, iniciando-se por 0 (zero) na revisão
  original e sendo incrementado por 1 (um) a cada alteração do conteúdo do manual, exceto
  se houver revisão das partes aprovadas, quando voltará a zero.

  Exemplo: caso a revisão atual do MGM seja a “01.12” e haja alteração apenas de partes aceitas,
  a próxima revisão será a “01.13”. Caso haja alteração de alguma parte aprovada, a próxima
  revisão será a “02.00” (sempre que houver revisão das partes aprovadas, o número N2 voltará
  a zero).

  Nota 1: idealmente, o operador não deve encaminhar partes revisadas para aprovação e aceitação
  ao mesmo tempo. Caso sejam encaminhadas juntas, as partes revisadas para aceitação só serão
  validadas após aprovação.

  Nota 2: no caso de revisão de partes aprovadas do MGM, todas as páginas do documento deverão
  receber o número da revisão que está sendo solicitada. Usando como referência o exemplo
  acima, todas as páginas deverão receber a revisão “02.00”.'
