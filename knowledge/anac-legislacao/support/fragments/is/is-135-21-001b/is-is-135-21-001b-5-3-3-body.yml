text: '5.3.3 O operador deve ter uma política de revisão clara e detalhada, de modo a identificar
  todas as alterações efetuadas a cada revisão, aceita ou aprovada.

  5.3.4 O MGM deve ser enviado à Anac em formato digital, pesquisável, acompanhado do formulário
  FOP 207 (previsto na IS nº 119-004). O FOP 207 deverá indicar claramente quais seções do
  manual foram alteradas, de modo que seja possível identificar rapidamente se a nova revisão
  irá requerer aprovação ou apenas aceitação. A documentação também deverá estar acompanhada
  dos dados do pagamento da TFAC ou de cópia do respectivo comprovante de pagamento.'
