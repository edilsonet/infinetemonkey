section_title: 'O MGM deve ser aprovado em qualquer uma das condições abaixo:'
subsection_id: c
cite: 5.3.6(c)
title: 5.3.6(c)
text: 'c) quando, por iniciativa do operador, for alterada a seção dos procedimentos para
  Gestão de Lista de Bases de Manutenção - LBM.

  5.3.7 Para as demais situações, os MGM, incluindo os procedimentos referenciados, podem
  ser submetidos para aceitação, e devem ser encaminhados em até 5 dias desde sua publicação
  e revisão.'
