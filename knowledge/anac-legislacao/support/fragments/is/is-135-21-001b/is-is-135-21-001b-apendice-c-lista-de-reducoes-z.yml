text: 'z) RBAC - Regulamento Brasileiro da Aviação Civil

  aa) SB - Service Bulletin

  bb) SL - Service Letter


  C2. ABREVIATURAS - N/AAPÊNDICE D - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO B

  Item

  Alteração realizada

  1.

  Alteração na designação do operador (de “táxi aéreo” para “operador”) e ajuste na redação
  relativa à configuração máxima.

  3.

  Ampliação dos fundamentos, conferindo maior flexibilidade para a apresentação de procedimentos
  alternativos, desde que justificados.

  4.

  Inclusão de nova definição e detalhamento ampliado, especialmente quanto ao “livro de bordo”.

  5.1

  Ampliação do escopo de aplicação e inclusão de novas condições para aeronaves certificadas
  sob normas internacionais.

  5.2

  Atualização da redação, reorganização e maior detalhamento dos procedimentos e controles
  do MGM.'
