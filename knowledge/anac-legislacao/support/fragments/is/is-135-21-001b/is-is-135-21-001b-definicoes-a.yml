title: definicoes(a)
text: 'a) livro de bordo: também chamado de diário de bordo ou livro de registro, é usado
  para lançamento de informações sobre a tripulação, horas de voo, irregularidades de funcionamento
  observadas em cada voo e registro das ações corretivas tomadas ou postergamento de correção.
  Trata-se do registro requerido pela seção 135.65 do RBAC nº 135.'
