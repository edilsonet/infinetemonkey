title: OBJETIVO
text: 'OBJETIVO

  1.1 Prover instruções para a elaboração do manual requerido pela seção 135.21, do RBAC nº
  135, no que se refere à manutenção das aeronaves, denominado Manual Geral de Manutenção
  (MGM), para operadores sob o RBAC nº 135 operando exclusivamente aeronaves com configuração
  máxima certificada de assentos para passageiros de até 9 (nove) assentos, conforme aplicável.'
