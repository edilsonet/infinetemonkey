title: OBJETIVO
text: '1. OBJETIVO

  1.1 Estabelecer orientações quanto à instalação de equipamentos dispersores em aviões e

  helicópteros de categoria restrita destinados a operações aéreas agrícolas, tais como a

  aplicação em voo de fertilizantes, sementes, inseticidas, herbicidas e outros

  defensivos.'
