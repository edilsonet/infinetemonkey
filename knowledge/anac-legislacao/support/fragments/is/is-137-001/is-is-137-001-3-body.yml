title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 Conforme o parágrafo 43.7(i)-I, do RBAC 43, grandes alterações e reparos devem

  ser executados com base em dados técnicos aprovados.

  3.2 Conforme estabelecido no parágrafo 43.9(a), do RBAC 43, cada pessoa que execute

  manutenção, manutenção preventiva, reconstrução ou alteração em uma aeronave,

  célula, motor, hé1ice, rotor, equipamento ou parte dos mesmos, deve fazer uma

  anotação no registro de manutenção desse equipamento contendo a descrição do

  trabalho, data de conclusão, nome da pessoa que executou e assinatura e número da

  licença da pessoa que aprovou.'
