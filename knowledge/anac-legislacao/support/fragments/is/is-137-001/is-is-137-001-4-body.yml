text: '4. DEFINIÇÕES

  4.1 Equipamento dispersor: Para efeito desta IS, é considerado equipamento dispersor

  todo aquele que, instalado em avião ou helicóptero voltado a operação agrícola, se

  destina ao lançamento de carga sólida ou líquida com emprego específico na aviação

  agrícola (defensivos agrícolas, fertilizantes, sementes e outros produtos correlatos).

  Compreende seus componentes, tais como: bombas, válvulas, barras de pulverização,

  tubos em geral, filtros para fluxômetro, caixa de alijamento, atomizadores rotativos,

  barras aerofólicas, seus subconjuntos e conjuntos.

  4.2 Pequena alteração: Para efeito desta IS, é considerada pequena alteração uma

  alteração que é executada de acordo com práticas aceitáveis ou utilizando operações

  elementares e não afeta apreciavelmente o peso, o balanceamento, a resistência

  estrutural, as características de voo e de manobrabilidade ou qualquer outra

  característica ligada à aeronavegabilidade.'
