title: Um operador de avião ou helicóptero destinado a operação agrícola somente poderá
text: '5.1.1 Um operador de avião ou helicóptero destinado a operação agrícola somente poderá

  utilizar um equipamento específico em operações aeroagrícolas se a instalação desse

  equipamento no avião ou helicóptero tiver sido aprovada pela ANAC. Quaisquer

  modificações ou adaptações devem ser executadas de acordo com a regulamentação

  em vigor;'
