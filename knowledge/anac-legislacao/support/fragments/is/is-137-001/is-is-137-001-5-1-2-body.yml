title: Ao instalar um equipamento dispersor, os manuais ou documentos técnicos,
text: '5.1.2 Ao instalar um equipamento dispersor, os manuais ou documentos técnicos,

  adequados ao avião ou helicóptero no qual será instalado, necessários para os

  procedimentos de instalação e manutenção deverão estar à disposição dos

  responsáveis pela manutenção ou instalação; da mesma forma, os respectivos

  documentos e manuais necessários para a operação do equipamento devem estar

  disponíveis para o piloto;'
