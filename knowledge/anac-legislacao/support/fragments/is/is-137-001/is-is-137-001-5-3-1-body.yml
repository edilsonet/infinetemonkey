cite: 5.3.1
title: Uma vez obtida aprovação da ANAC para instalação de mais de uma configuração
text: '5.3.1 Uma vez obtida aprovação da ANAC para instalação de mais de uma configuração

  de equipamento dispersor para um dado avião ou helicóptero, a conversão de uma

  configuração para outra é um procedimento operacional, não constituindo execução

  de manutenção e, por conseguinte, não necessitando de registro, nem de nenhum

  outro requisito do RBAC 43.'
