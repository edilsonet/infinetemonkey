title: A conversão de uma configuração para outra poderá ser realizada pelo operador
text: '5.3.3 A conversão de uma configuração para outra poderá ser realizada pelo operador

  desde que executada de acordo com a instrução de conversão que trate da instalação

  e remoção dos componentes. Essas instruções de conversão são aprovadas, em geral,

  conjuntamente com a aprovação original da instalação. Caso o operador não possua

  uma instrução de conversão, deverá desenvolver essa instrução.'
