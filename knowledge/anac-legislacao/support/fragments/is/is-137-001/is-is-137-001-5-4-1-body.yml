text: '5.4.1 Alterações simples na configuração do equipamento instalado, incluindo substituição

  e rearranjo de componentes (bem como alteração do número e posicionamento de

  bicos / atomizadores, ou substituição na mesma barra de um tipo de bico por outro,Data de
  emissão: 23 de novembro de 2018 IS nº 137-001

  Revisão C

  ou substituição de pás dos atomizadores por outras de diâmetro diferente, entre

  outras), podem ser realizadas por organização de manutenção certificada, desde que

  sigam os seguintes métodos, técnicas e práticas aceitáveis (uma descrição contendo

  os itens abaixo deve ser mantida junto aos registros de manutenção):'
