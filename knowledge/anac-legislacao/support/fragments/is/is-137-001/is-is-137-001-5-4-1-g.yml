cite: 5.4.1(g)
title: 5.4.1(g)
text: 'g) Os cabos elétricos utilizados sejam de uso aeronáutico, com especificação

  igual ou melhor que os usados originalmente no avião ou helicóptero, adequados às

  características da instalação, sejam instalados de modo que estejam protegidos contra

  altas temperaturas e contra a ação de contaminantes como combustível, óleo, água e

  abrasivos e sejam instalados e fixados lateralmente, ou sempre acima, de linhas ou

  equipamentos contendo óleo, combustível, fluidos hidráulicos ou oxigênio. Em

  nenhuma hipótese os cabos podem estar fixados às linhas de óleo, de combustível, de

  fluidos hidráulicos ou de oxigênio. As fixações das cablagens deverão ser feitas por

  meio de braçadeiras instaladas em cavernas, ou em tubos, quando a estrutura do

  avião ou helicóptero for do tipo tubular. Os furos existentes ou eventualmente feitos

  em cavernas para a passagem dos cabos devem estar protegidos por grommets, após

  a restauração da proteção contra corrosão, conforme recomendação do fabricante do

  avião ou helicóptero. Tanto quanto possível devem ser utilizados os

  encaminhamentos já consagrados pelo fabricante do avião ou helicóptero;'
