title: Caso a alteração atenda ao descrito no parágrafo 5.4.1 desta IS, pode ser considerada
text: '5.4.2 Caso a alteração atenda ao descrito no parágrafo 5.4.1 desta IS, pode ser considerada

  uma pequena alteração, por se estar alterando a configuração de equipamento

  dispersor tendo como referência um avião ou helicóptero que já possui um

  equipamento dispersor aprovado e por estarem sendo utilizadas práticas consideradas

  aceitáveis pela ANAC. A alteração do avião ou helicóptero deverá atender aos

  requisitos aplicáveis do RBAC 43, inclusive àqueles referentes a registros de

  manutenção.'
