cite: 5.4.3
title: Caso um operador possua uma alteração aprovada para um dado avião ou
text: '5.4.3 Caso um operador possua uma alteração aprovada para um dado avião ou

  helicóptero, poderá reproduzir essa alteração em outros aviões ou helicópteros de sua

  frota, desde que sejam do mesmo tipo e modelo e seja determinado que a alteração

  não interfere com qualquer outra alteração aprovada instalada no avião ou

  helicóptero a ser alterado. Nesse caso acima, os dados técnicos serão considerados

  aprovados para reprodução, segundo esta IS, caso sejam cumpridos os itens dos

  parágrafos 5.4.4 a 5.4.6. A alteração do avião ou helicóptero deverá atender aos

  requisitos aplicáveis do RBAC 43, inclusive àqueles referentes a registros de

  manutenção.'
