title: Um engenheiro, registrado no CREA e com atribuição profissional adequada, deve
text: '5.4.4 Um engenheiro, registrado no CREA e com atribuição profissional adequada, deve

  avaliar os aspectos técnicos para instalações conforme o parágrafo 5.4.3 desta IS e

  documentar seu parecer na forma de um relatório técnico ou similar. Esse parecer (ou

  cópia dele) deve ser mantido nos registros de manutenção do avião ou helicóptero.'
