title: Em seu conteúdo, esse parecer deve identificar suficientemente a configuração avião-
text: '5.4.5 Em seu conteúdo, esse parecer deve identificar suficientemente a configuração
  avião-

  equipamento ou helicóptero-equipamento dispersor aprovada usada para reprodução,

  além de incluir a identificação do engenheiro, sua assinatura e o número de registro

  no CREA. O engenheiro que assina deve verificar se suas atribuições, definidas pelo

  CREA, permitem se responsabilizar pela aprovação do documento em questão.'
