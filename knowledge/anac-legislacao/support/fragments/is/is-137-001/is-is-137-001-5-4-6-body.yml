title: É importante que esse engenheiro tenha razoável conhecimento do avião ou
text: '5.4.6 É importante que esse engenheiro tenha razoável conhecimento do avião ou

  helicóptero em questão e dos equipamentos a serem instalados. Portanto, além dos

  representantes técnicos dos fabricantes dos aviões ou helicópteros, engenheiros de

  organizações de manutenção dos aviões ou helicópteros destinados a operação

  agrícola em análise ou engenheiros dos fabricantes dos equipamentos dispersores são

  boas alternativas para realizar tal avaliação e assumir a responsabilidade técnica da

  instalação.'
