title: A alteração deverá ser realizada utilizando-se os materiais fornecidos e seguindo-se
text: '5.4.7 A alteração deverá ser realizada utilizando-se os materiais fornecidos e seguindo-se

  as instruções especificadas pelo fabricante do componente, do equipamento dispersor

  e do avião ou helicóptero, bem como as práticas e métodos recomendados pela AC

  43.13-1 e AC 43.13-2 da FAA. Todos os métodos, técnicas e práticas aceitáveis

  presentes no item 5.4.1 desta IS podem ser encontrados nos manuais e AC descritos

  acima.'
