title: apendice-a-desta-is(i)
text: 'i) Não impliquem em alimentação de seus componentes pela barra de

  emergência, quando o sistema elétrico do avião ou helicóptero possuir barras

  principal e de emergência (ou possua um método para desligar o sistema em caso de

  emergência elétrica, não sendo aceitável a utilização de disjuntor para essa função);'
