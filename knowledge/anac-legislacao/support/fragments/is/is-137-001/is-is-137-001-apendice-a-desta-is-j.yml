title: apendice-a-desta-is(j)
text: 'j) Os componentes instalados, bem como a proteção do circuito elétrico (CB ou

  fusível) funcionem adequadamente, e seu funcionamento não interfira na operação de

  bússolas ou outros equipamentos do avião ou helicóptero, o que deve ser

  demonstrado realizando-se um procedimento de teste de EMC.Data de emissão: 23 de novembro
  de 2018 IS nº 137-001

  Revisão C'
