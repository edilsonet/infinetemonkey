text: 'APÊNDICE C - LISTA DE REFERÊNCIAS

  [1] RBAC 137 - Certificação e Requisitos Operacionais: Operações Aeroagrícolas.

  [2] IS nº 21-004 - Aprovação de Grandes Modificações em aeronaves com marcas

  brasileiras, ou que venham a ter marcas brasileiras.

  [3] Decreto 86.765, dezembro de 1981, Art. 16 - Regulamentação do Decreto-Lei nº 917, de

  07 de outubro de 1969, que dispõe sobre o emprego da aviação agrícola no país.

  [4] Instrução Normativa Nº 2, de 3 de Janeiro de 2008 - Ministério da Agricultura, Pecuária

  e Abastecimento (MAPA), Art. 2˚.

  [5] RBAC 43 - Manutenção, Manutenção Preventiva, Reconstrução e Alteração.

  [6] FAA Order 8900.1 Vol. 2 - Air Operator and Air Agency Certification and Application

  Process - Chapter 8 Certification of a Part 137 Operator - Section 4 - Restricted Category

  Agricultural Airplanes.

  [7] FAA AC 43.13-1 - Acceptable Methods, Techniques, and Practices - Aircraft Inspection

  and Repair.

  [8] FAA AC 43.13-2 - Acceptable Methods, Techniques, and Practices - Aircraft

  Alterations.

  [9] RBAC 21 - Certificação de Produto Aeronáutico.

  [10] IS nº 21-021 - Apresentação de Dados Requeridos para Certificação Suplementar de

  Tipo.Data de emissão: 23 de novembro de 2018 IS nº 137-001

  Revisão C'
