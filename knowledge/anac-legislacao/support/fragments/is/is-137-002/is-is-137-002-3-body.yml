title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 Conforme o parágrafo 137.203(a) do RBAC 137, a manutenção das aeronaves engajadas nas

  operações aeroagrícolas deve ser executada de acordo com os requisitos dos RBAC 43 e

  145, bem como da subparte E do RBHA 91, ou disposições correspondentes do RBAC que

  venha a substituí-lo.

  3.2 Conforme estabelecido no parágrafo 21.93(a) do RBAC 21, as modificações ao projeto de

  tipo são classificadas em grandes e pequenas. A “pequena modificação” é aquela que não

  tem apreciável efeito no peso, no balanceamento, na resistência estrutural, na confiabilidade,

  em características operacionais e em outras características que afetem a aeronavegabilidade

  do produto.

  3.3 Conforme estabelecido na seção 21.95, do RBAC 21, pequenas modificações podem ser

  aprovadas, segundo um método aceitável pela ANAC, sem apresentação prévia de quaisquer

  dados comprobatórios.

  3.4 Conforme estabelecido na seção 21.97, do RBAC 21, no caso de grandes modificações,

  devem ser apresentados à ANAC dados que substanciem e descrevam a modificação

  proposta, para sua incorporação ao projeto de tipo.

  Nota - as atividades e critérios para aprovação de grandes modificações são objeto da IS

  nº 21-004.

  3.5 Conforme estabelecido no parágrafo 43.7(i)-I, do RBAC 43, grandes alterações e reparos

  devem ser executados com base em dados técnicos aprovados.

  3.6 Conforme estabelecido no parágrafo 43.9(a), do RBAC 43, cada pessoa que execute

  manutenção, manutenção preventiva, reconstrução ou alteração em uma aeronave, célula,

  motor, hé1ice, rotor, equipamento ou parte deles, deve fazer uma anotação no registro de

  manutenção desse equipamento contendo a descrição do trabalho, data de início e término,

  nome da pessoa que executou e assinatura e tipo de licença da pessoa que aprovou.Data de
  emissão: 24 de agosto de 2018. IS nº 137-002

  Revisão C'
