title: DEFINIÇÕES
text: '4. DEFINIÇÕES

  4.1 Equipamento DGPS: Para efeito desta IS, é considerado equipamento DGPS todo sistema

  GPS com correção diferencial. Compreende seus componentes, tais como: antena, barra de

  luzes, display, proteção da alimentação elétrica, interruptores, computador, receptores
  GPS,

  receptor diferencial, controladores de vazão e seus subconjuntos e conjuntos.

  4.2 Equipamento dispersor: Para efeito desta IS, é considerado equipamento dispersor todo

  aquele que instalado em aeronave engajada em operação agrícola se destina ao lançamento

  de carga sólida ou líquida com emprego específico na aviação agrícola (defensivos agrícolas,

  fertilizantes, sementes e outros produtos correlatos). Compreende seus componentes, tais

  como: bombas, válvulas, barras de pulverização, tubos em geral, filtros para fluxômetro,

  caixa de alijamento, atomizadores rotativos, barras aerofólicas, seus subconjuntos e

  conjuntos.

  Nota - a instalação e alteração de equipamentos dispersores é objeto da IS nº 137-001.'
