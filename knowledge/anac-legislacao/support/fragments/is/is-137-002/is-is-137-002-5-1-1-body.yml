title: Um operador de aeronave destinada a operações aéreas agrícolas ou a treinamento nessas
text: '5.1.1 Um operador de aeronave destinada a operações aéreas agrícolas ou a treinamento
  nessas

  operações somente poderá utilizar um equipamento DGPS em operações aeroagrícolas se a

  instalação desse equipamento na aeronave tiver sido aprovada pela ANAC, exceto quando

  atender ao item 5.2.1 desta IS. Quaisquer modificações ou adaptações devem ser executadas

  de acordo com a regulamentação em vigor.'
