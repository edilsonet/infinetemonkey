text: '5.1.2 Ao instalar um equipamento DGPS, os manuais ou documentos técnicos, adequados
  à

  aeronave na qual será instalado, necessários para os procedimentos de instalação e

  manutenção deverão estar à disposição do pessoal da oficina responsável; da mesma forma,

  os respectivos documentos e manuais necessários para a operação do equipamento devem

  estar disponíveis para o piloto.'
