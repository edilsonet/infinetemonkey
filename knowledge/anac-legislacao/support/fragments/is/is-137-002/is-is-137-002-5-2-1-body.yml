text: '5.2.1 A instalação de um equipamento DGPS em aeronave destinada a operações aéreas
  agrícolas

  ou a treinamento nessas operações pode ser considerada uma pequena alteração, e não se

  requer que a aprovação dessa instalação seja obtida como parte do Certificado de Tipo -
  CT,

  emenda ao CT, por meio de Certificado Suplementar de Tipo - CST ou formulário F-400-

  04 (SEGVOO 001), se todas as condições seguintes forem atendidas quanto à instalação do

  equipamento DGPS:'
