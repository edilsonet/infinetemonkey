title: A instalação de um equipamento DGPS em aeronave destinada a operações aéreas agrícolas
text: '5.2.2 A instalação de um equipamento DGPS em aeronave destinada a operações aéreas
  agrícolas

  ou a treinamento nessas operações é considerada uma grande alteração se não atender a todos

  os critérios do item 5.2.1 desta IS; nesse caso, a instalação requer dados técnicos aprovados

  pela ANAC. A aprovação dessa instalação pode ser obtida como parte do CT, emenda ao

  CT, por meio de CST ou formulário F-400-04 (SEGVOO 001).'
