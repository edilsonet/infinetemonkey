title: Esta IS estabelece um meio de cumprimento para modificação incorporada em uma única
text: '5.2.3 Esta IS estabelece um meio de cumprimento para modificação incorporada em uma
  única

  aeronave, caracterizada por seu tipo, modelo e número de série, o que não autoriza o

  requerente a incorporar a modificação em outras aeronaves do mesmo tipo e modelo.'
