text: '5.2.4 Com base no parágrafo 21.93(a), do RBAC 21, caso a modificação atenda ao descrito
  no

  parágrafo 5.2.1 desta IS, pode ser considerada uma pequena modificação. A alteração da

  aeronave deverá atender aos requisitos aplicáveis do RBAC 43, inclusive àqueles referentes

  a registros de manutenção.'
