text: '5.3.1 Esta IS é aplicável a alterações incorporadas em aeronaves categoria normal ou
  restrita cuja

  base de certificação seja o RBAC 23, o RBAC 27, ou equivalentes, não pressurizadas e

  destinadas a operação aérea agrícola ou a treinamento nessa operação.'
