family: '137'
section_id: 5.3.2
section_title: 'A instalação de equipamento DPGS poderá ser realizada conforme esta IS, desde
  que:'
subsection_id: s
cite: 5.3.2(s)
title: 5.3.2(s)
text: 's) os cabos elétricos utilizados sejam de uso aeronáutico, com especificação igual
  ou

  superior que os usados originalmente na aeronave, adequados às características da

  instalação, sejam instalados de modo que estejam protegidos contra altas temperaturas

  e contra a ação de contaminantes como combustível, óleo, água e abrasivos e sejam

  instalados e fixados lateralmente, ou sempre acima, de linhas ou equipamentos contendo

  óleo, combustível, fluidos hidráulicos ou oxigênio. Em nenhuma hipótese os cabosData de
  emissão: 24 de agosto de 2018. IS nº 137-002

  Revisão C

  podem estar fixados às linhas de óleo, de combustível, de fluidos hidráulicos ou de

  oxigênio. As fixações das cablagens deverão ser feitas por meio de braçadeiras

  instaladas em cavernas, ou em tubos, quando a estrutura da aeronave for do tipo tubular.

  Os furos existentes ou eventualmente feitos em cavernas para a passagem dos cabos

  devem estar protegidos por grommets, após a restauração da proteção contra corrosão,

  conforme recomendação do fabricante da aeronave. Tanto quanto possível devem ser

  utilizados os encaminhamentos especificados pelo fabricante da aeronave;'
