title: APÊNDICE C - LISTA DE REFERÊNCIAS
text: 'APÊNDICE C - LISTA DE REFERÊNCIAS

  [1] Decreto 86.765, dezembro de 1981, Art. 16 - Regulamentação do Decreto-Lei nº 917, de
  07

  de outubro de 1969, que dispõe sobre o emprego da aviação agrícola no país.

  [2] FAA AC 43.13-1 -Acceptable Methods, Techniques, and Practices - Aircraft Inspection
  and

  Repair.

  [3] FAA AC 43.13-2 - Acceptable Methods, Techniques, and Practices - Aircraft Alterations.

  [4] FAA Order 8300.16 - Major Repair and Alteration Data Approval.

  [5] FAA Order 8900.1 Vol. 2 - Air Operator and Air Agency Certification and Application

  Process - Chapter 8 Certification of a Part 137 Operator - Section 4 - Restricted Category

  Agricultural Airplanes.

  [6] RBAC 01 - Definições, Regras de Redação e Unidades de Medida.

  [7] RBAC 21 - Certificação de Produto Aeronáutico.

  [8] RBAC 23 - Requisitos de aeronavegabilidade: aviões categoria normal, utilidade, acrobática

  e transporte regional.

  [9] RBAC 27 - Requisitos de aeronavegabilidade: aeronaves de asas rotativas categoria normal.

  [10] RBAC 43 - Manutenção, Manutenção Preventiva, Reconstrução e Alteração.

  [11] RBAC 137 - Certificação e Requisitos Operacionais: Operações Aeroagrícolas.

  [12] RBAC 145 - Organizações de Manutenção de Produto Aeronáutico.

  [13] RBHA 91 - Regras gerais de operação para aeronaves civis.

  [14] Instrução Normativa Nº 2, de 3 de Janeiro de 2008 - Ministério da Agricultura, Pecuária
  e

  Abastecimento (MAPA), Art. 2˚.

  [15] IS nº 21-004 - Aprovação de Grandes Modificações em aeronaves com marcas brasileiras,
  ou

  que venham a ter marcas brasileiras.

  [16] IS nº 21-013 - Instruções para obtenção de aprovação de instalação de equipamentos
  GNSS

  (Global Navigation Satellite Systems) stand alone para operações VFR e IFR PBN

  (Performance-Based Navigation).

  [17] IS nº 21-021 - Apresentação de Dados Requeridos para Certificação Suplementar de Tipo.

  [18] IS nº 137-001 - Orientações relativas a equipamentos dispersores.

  [19] MPR-900 Volume 04 - Manual do Inspetor - Equipamentos de Aeronave e Autorizações

  Operacionais.Data de emissão: 24 de agosto de 2018. IS nº 137-002

  Revisão C'
