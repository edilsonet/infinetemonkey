title: 5.1.2(a)
text: a) de acordo com os parágrafos 137.1(e) e (f) do RBAC nº 137, os operadores certificados
  para operar segundo o RBAC nº 133 estão dispensados de cumprir a Subparte B do RBAC nº 137
  quando conduzindo operação aeroagrícola de combate a incêndio, e os operadores de helicópteros
  conduzindo exclusivamente operações aeroagrícolas com dispensadores externos fixos instalados
  na aeronave não necessitam cumprir com os requisitos do RBAC nº 133; e
