subsection_id: b
cite: 5.1.2(b)
title: 5.1.2(b)
text: 'b) de acordo com o parágrafo 137.1(c)(1) do RBAC nº 137, operadores que utilizem aeronaves
  remotamente pilotadas em suas operações sob o RBAC nº 137 estão dispensados de cumprir as
  Subpartes C, D e F do RBAC nº 137; no entanto, devem cumprir a Subparte B do RBAC nº 137
  e obter um CDAG em conformidade com esta IS se operarem ou pretenderem operar sob o RBAC
  nº 137 em operações aeroagrícolas remuneradas ou em proveito de terceiros.

  5.1.3 Caso uma organização requerente solicite um processo de cadastramento com método alternativo
  ao proposto por esta IS, a ANAC aprovará, a seu critério, o referido método alternativo,
  caso entenda que este seja capaz de atender a todos os requisitos do processo de cadastramento
  com eficiência e/ou eficácia igual ou superior ao método estabelecido nesta IS.'
