title: Descrição do processo de cadastro
text: '5.2.1 Descrição do processo de cadastro

  5.2.1.1 O processo de cadastro de operador aeroagrícola envolve o preenchimento do Formulário
  de Cadastro de Aeroagrícola- FCDAG, em modelo eletrônico disponível no sistema SEI, e a
  entrega dos documentos necessários, a análise da documentação apresentada e a emissão do
  CDAG pela ANAC. Documentos e esclarecimentos adicionais podem ser solicitados a qualquer
  tempo durante o processo.

  5.2.1.2 O pessoal de administração requerido, conforme previsto na seção 137.127 do RBAC
  nº 137, deve conhecer a regulamentação pertinente às operações pretendidas, assim como as
  IS que lhes sejam relacionadas, em especial esta IS.'
