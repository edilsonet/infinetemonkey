title: Representantes e pessoas de contato da organização requerente
text: '5.2.2 Representantes e pessoas de contato da organização requerente

  5.2.2.1 A adequada condução do processo depende da efetividade da comunicação entre a ANAC
  e o interessado. Portanto, é importante que o interessado realize e mantenha atualizado
  seu cadastro no protocolo eletrônico da ANAC, bem como as indicações dos representantes
  legais e procuradores especiais no sistema SEI.

  5.2.2.2 As comunicações oficiais acerca do processo serão encaminhadas, por meio eletrônico
  no sistema SEI, para os representantes legais ou procuradores cadastrados para o CNPJ ou
  CPF do interessado no sistema.

  5.2.2.3 O processo eletrônico da ANAC está previsto na Resolução nº 520/2019 e maiores informações
  podem ser consultadas no seguinte endereço: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.2.2.4 Todas as comunicações, interações e documentos necessários ao processo somente serão
  aceitos se realizados pelas pessoas legalmente designadas pelo interessado.

  5.2.2.5 São consideradas pessoas legalmente designadas pelo interessado o gestor responsável,
  os procuradores cadastrados no SEI como procuradores especiais ou pessoas legalmente constituídas,
  que apresentem procuração, contrato de trabalho ou prestação de serviços ou outro documento
  que comprove a legalidade e efetividade da representação.'
