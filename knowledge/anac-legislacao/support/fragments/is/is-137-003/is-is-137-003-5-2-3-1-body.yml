text: '5.2.3.1 A organização requerente deve designar um gestor responsável conforme requerido
  pela seção 137.127 do RBAC nº 137.

  Nota: as referências às sanções administrativas capituladas no art. 299, incisos I, V, VI
  ou VII, da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica - CBA),
  contidas no parágrafo 137.127(d)(2) do RBAC nº 137, se referem a enquadramentos de infrações
  como "procedimento ou prática, no exercício das funções, que revelem falta de idoneidade
  profissional para o exercício das prerrogativas dos certificados de habilitação técnica",
  "fornecimento de dados, informações ou estatísticas inexatas ou adulteradas", "recusa de
  exibição de livros, documentos contábeis, informações ou estatísticas aos agentes da fiscalização"
  ou "prática reiterada de infrações graves", ainda que, em razão da inclusão do § 3º do art.
  288 do CBA, promovida pela Lei nº 14.368, atualmente o art. 299 não se aplique às atribuições
  da ANAC.'
