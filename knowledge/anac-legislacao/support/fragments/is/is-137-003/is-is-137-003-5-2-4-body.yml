title: Informações sobre aeronave
text: '5.2.4 Informações sobre aeronave

  Durante o processo de cadastro inicial, é solicitado no preenchimento do FCDAG a informação
  de ao menos uma aeronave para verificação de adequação à seção 137.201 do RBAC nº 137. Esta
  informação não constará no CDAG, de modo que alterações na frota do operador não ensejam
  a necessidade de atualização do cadastro.'
