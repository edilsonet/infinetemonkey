title: 5.2.5.1(a)
text: a) De acordo com o parágrafo 137.107(b) do RBAC nº 137, a ANAC requer, por meio desta
  IS, que a solicitação para obtenção do CDAG seja realizada por meio do FCDAG, disponível
  através do Sistema SEI, assinado por pessoa legalmente designada.
