title: 5.2.5.1(b)
text: 'b) Em adição ao FCDAG, os seguintes documentos devem ser apresentados:

  I - procuração ou outro instrumento de mandato, caso necessário, de acordo com o item 5.2.2
  desta IS;

  II - última versão do ato constitutivo ou alterador (ata, estatuto, contrato social ou equivalente);

  III - documento que evidencie o endereço designado como sede administrativa, em que seja
  possível identificar vínculo com a pessoa física ou jurídica requerente. Para comprovar
  endereço, são aceitos: contrato de locação de imóvel em vigor, contas de consumo (como água,
  luz, telefone, gás, celular, internet, etc.), IPTU, ITR, boleto de condomínio, correspondência
  originária de instituições financeiras (públicas ou privadas,) ou órgãos públicos e correspondência
  postada e enviada pelos Correios; e

  IV - solicitações de isenções de cumprimento de regra, se houver (a serem encaminhadas por
  meio do FOP 108-137).'
