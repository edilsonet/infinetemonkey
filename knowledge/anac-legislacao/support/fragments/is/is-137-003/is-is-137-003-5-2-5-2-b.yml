title: 5.2.5.2(b)
text: b) A organização requerente será formalmente notificada se um documento for considerado
  incompleto ou deficiente ou, ainda, se for detectada alguma não-conformidade. As devidas
  correções deverão ser entregues à ANAC pela organização requerente por meio de documento
  detalhando as correções efetuadas e, caso aplicável, documentação complementar.
