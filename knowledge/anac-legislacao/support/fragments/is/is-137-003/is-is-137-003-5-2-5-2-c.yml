title: 5.2.5.2(c)
text: c) Nesta etapa são previstas até três iterações, cada uma composta por um ciclo de comunicação
  de não-conformidade e resposta da organização requerente. Caso, após a terceira iteração,
  a solicitação e demais documentos sejam considerados insatisfatórios pela ANAC, o processo
  será arquivado. A informação sobre o arquivamento do processo será encaminhada via ofício.
