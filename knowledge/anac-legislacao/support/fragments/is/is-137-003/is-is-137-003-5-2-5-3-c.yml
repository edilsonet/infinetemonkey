title: 5.2.5.3(c)
text: c) Após a emissão do CDAG, a ANAC procederá à verificação dos demais requisitos necessários
  para exploração dos serviços aéreos previstos na Resolução nº 659, de 2 de fevereiro de
  2022, ou norma que venha a substituí-la. A publicação, no Diário Oficial da União, de Portaria
  dando a publicidade do cumprimento dos requisitos desta Resolução encerra o processo de
  cadastro. A partir dessa publicação, pode ser iniciada a exploração do serviço aéreo.
