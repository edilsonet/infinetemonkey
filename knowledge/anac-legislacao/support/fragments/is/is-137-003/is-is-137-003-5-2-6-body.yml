title: Encerramento compulsório do processo de cadastro
text: '5.2.6 Encerramento compulsório do processo de cadastro

  5.2.6.1 A organização requerente de um CDAG terá, por padrão, o prazo de 30 (trinta) dias
  para apresentar as ações requeridas durante o processo ou as respostas a cada comunicação
  de não-conformidade. A ANAC poderá determinar prazos diferentes em razão da complexidade
  do tema a ser corrigido.

  5.2.6.2 A não observância do prazo de 30 (trinta) dias, ou outro prazo eventualmente definido,
  sem qualquer manifestação por parte do requerente para a apresentação das ações requeridas,
  caracterizará desistência e ensejará o encerramento do processo de cadastro. Esta situação
  será informada à organização requerente mediante emissão de ofício.

  5.2.6.3 Uma vez encerrado o processo de cadastro, não é possível a sua reabertura. Caso
  exista interesse da organização requerente, esta deverá dar início a um novo processo de
  cadastro a ser conduzido em conformidade com os procedimentos apresentados nesta IS. Não
  serão aproveitados, pela nova equipe de cadastro, quaisquer atos praticados no curso do
  processo encerrado, embora não seja vedado à organização requerente o aproveitamento do
  conteúdo dos documentos e informações apresentados no processo encerrado, desde que devidamente
  atualizados. A apresentação de um documento ou informação em um processo encerrado não garante,
  automaticamente, a sua aceitação no novo processo.

  5.3 Gerenciamento de frota de aeronaves'
