text: '5.3.1.2 Dessa maneira, é responsabilidade do operador possuir e formalizar processos
  e procedimentos para gerenciamento de sua frota.

  5.3.1.3 De acordo com a seção 137.201 do RBAC nº 137 é responsabilidade do operador garantir
  que cada aeronave esteja em situação aeronavegável e compatível com as operações pretendidas.

  5.3.1.4 Para cumprimento desta seção, os operadores deverão manter atualizada a listagem
  de cada aeronave (tipo, matrícula e número de série) operada, de forma a garantir que somente
  aeronaves capacitadas são utilizadas nas operações aeroagrícolas.'
