text: '5.3.1.6 As listas de aeronaves devem possuir um controle formal de revisões.

  5.3.1.7 Caso um operador não apresente a listagem solicitada pela ANAC e/ou falhe em demonstrar
  que o seu processo de gerenciamento da frota é efetivo, estará sujeito às sanções administrativas
  previstas na Resolução ANAC nº 472/2018, incluindo o disposto nos itens 5.5.2 e 5.7 desta
  IS.

  5.4 Atualização do CDAG'
