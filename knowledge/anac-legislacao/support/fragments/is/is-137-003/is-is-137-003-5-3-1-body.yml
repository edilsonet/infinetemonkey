title: Listagem de aeronaves
text: '5.3.1 Listagem de aeronaves

  5.3.1.1 Os CDAG dos operadores aeroagrícolas trazem as informações básicas para a realização
  de operações remuneradas ou em proveito de terceiros. Não são listadas as marcas de nacionalidade
  e matrícula das aeronaves.'
