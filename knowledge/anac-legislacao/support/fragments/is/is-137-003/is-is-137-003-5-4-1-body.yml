title: Disposições gerais
text: '5.4.1 Disposições gerais

  5.4.1.1 O processo de atualização do CDAG é similar ao processo de cadastro de operador
  aeroagrícola, guardadas as proporções, podendo ser menos complexo dependendo do tipo de
  alteração pretendida.

  5.4.1.2 Quando houver simultaneidade de modificações, devem ser atendidas as exigências
  descritas de cada uma delas, podendo ser solicitado em um único processo administrativo
  e sem a necessidade de duplicidade de documentos.'
