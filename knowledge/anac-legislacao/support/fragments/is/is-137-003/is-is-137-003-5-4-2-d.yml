cite: 5.4.2(d)
title: 5.4.2(d)
text: 'd) em caso de alteração de endereço da sede administrativa, documento que evidencie
  o novo endereço designado como sede administrativa, em que seja possível identificar vínculo
  com a pessoa física ou jurídica. Para comprovar endereço, são aceitos: contrato de locação
  de imóvel em vigor, contas de consumo (como água, luz, telefone, gás, celular, internet,
  etc.), IPTU, ITR, boleto de condomínio, correspondência originária de instituições financeiras
  (públicas ou privadas) ou órgãos públicos e correspondência postada e enviada pelos Correios.'
