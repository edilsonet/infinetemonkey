title: 5.4.3.1(c)
text: 'c) caso também não se enquadre em (b) (por exemplo, se o FCDAG for assinado por procurador),
  deve ser apresentada, em complemento ao FCDAG, uma designação assinada em conformidade com
  os atos constitutivos.

  Nota: uma vez que, no caso de pessoa física, o gestor responsável deve ser a própria pessoa
  física, não é possível a alteração do gestor responsável. Caso outra pessoa física tenha
  interesse em obter o CDAG, deve iniciar o processo de cadastro.

  5.5 Suspensão do CDAG'
