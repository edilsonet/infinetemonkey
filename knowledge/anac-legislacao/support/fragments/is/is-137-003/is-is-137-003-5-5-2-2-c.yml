title: 5.5.2.2(c)
text: 'c) imposição de dificuldade ou impedimento (intencional ou por não cumprimento de norma)
  às atividades de fiscalização da ANAC.

  5.5.2.3 A ANAC também poderá suspender o CDAG de um operador aeroagrícola em decorrência
  de processo sancionatório instaurado nos termos da Resolução ANAC nº 472/2018 ou norma que
  vier a substituí-la.'
