title: Suspensão do CDAG pela ANAC
text: '5.5.2 Suspensão do CDAG pela ANAC

  5.5.2.1 A ANAC poderá suspender cautelarmente o CDAG de um operador aeroagrícola, sem a
  prévia manifestação do interessado, de acordo com as seções 137.107 e 137.113 do RBAC nº
  137, e o art. 45 da Lei nº 9.784/1999, caso constate o não cumprimento de requisitos técnico-operacionais
  que configurem risco iminente à segurança operacional.'
