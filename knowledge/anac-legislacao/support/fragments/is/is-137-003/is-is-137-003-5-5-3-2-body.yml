text: '5.5.3.2 A critério da ANAC, ouvidos os setores envolvidos, pode ser solicitada a realização
  de uma reunião para esclarecimento e ajustes do processo;

  Nota: o processo de revogação da suspensão do CDAG pode ser tanto a comprovação da solução
  da não-conformidade como uma revisão completa no processo de cadastro.'
