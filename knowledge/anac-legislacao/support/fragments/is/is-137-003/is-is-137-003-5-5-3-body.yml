title: Revogação da suspensão do CDAG
text: '5.5.3 Revogação da suspensão do CDAG

  5.5.3.1 Para ter revogada a suspensão de seu CDAG, o operador aeroagrícola deverá solicitá-la
  em documento no SEI direcionado para a GOAG, além da demonstração da correção das não-conformidades,
  caso o CDAG tenha sido suspenso pela ANAC por ocorrência de não-conformidade.'
