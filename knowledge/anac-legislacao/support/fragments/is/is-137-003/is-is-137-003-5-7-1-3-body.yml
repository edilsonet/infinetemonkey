text: '5.7.1.3 Um CDAG cassado não pode ser restaurado. Se a organização desejar operar novamente,
  deverá iniciar um novo processo de cadastro.

  5.8 Modelos de formulários

  Os formulários e documentos padronizados a serem utilizados serão sempre os disponibilizados
  pela ANAC no Sistema Eletrônico de Informações (SEI) e deverão sempre ser preenchidos e
  assinados no próprio SEI.

