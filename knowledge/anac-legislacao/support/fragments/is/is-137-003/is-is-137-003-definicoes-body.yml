title: DEFINIÇÕES
text: 'DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas na seção 137.3 do RBAC nº 137,
  as definições listadas no RBAC nº 01, e as seguintes definição e abreviaturas:

  organização significa qualquer pessoa física ou jurídica que opere ou pretenda operar sob
  o RBAC nº 137 em operações aeroagrícolas remuneradas ou em proveito de terceiros.

  CBA - Código Brasileiro de Aeronáutica

  CDAG - Cadastro de Aeragrícola

  FCDAG - Formulário de Cadastro de Aeroagrícola

  IPTU - Imposto Predial e Territorial Urbano

  IS - Instrução Suplementar

  ITR - Imposto sobre a Propriedade Territorial Rural

  RBAC - Regulamento Brasileiro da Aviação Civil

  SEI - Sistema Eletrônico de Informações

  SPO - Superintendência de Padrões Operacionais'
