title: OBJETIVO
text: 'OBJETIVO

  Oferecer a uma organização que opere ou pretenda operar sob o RBAC nº 137 em operações aeroagrícolas
  remuneradas ou em proveito de terceiros, um método de cumprimento para que obtenha, altere,
  suspenda, solicite revogação de uma suspensão ou solicite a revogação de um Cadastro de
  Aeroagrícola (CDAG), de acordo com os requisitos estabelecidos pela Subparte B do RBAC nº
  137.'
