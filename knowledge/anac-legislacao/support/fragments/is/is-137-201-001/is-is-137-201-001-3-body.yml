text: '3. FUNDAMENTOS

  3.1 O art. 202 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prescreve que as operações
  aeroagrícolas obedecerão a regulamento especial.

  3.2 O Regulamento Brasileiro da Aviação Civil nº 21 - RBAC 21, “Certificação de Produto
  e Artigo Aeronáutico”, trata da emissão de certificados de tipo para aeronaves categoria
  restrita e categoria normal, modificações desses certificados e emissão de certificados
  de aeronavegabilidade para essas aeronaves.

  3.3 O RBAC 137, “Certificação e Requisitos Operacionais: Operações Aeroagrícolas”, parágrafo
  137.201(e), estabelece que um operador agrícola pode utilizar combustível não previsto no
  projeto de tipo aprovado da aeronave agrícola desde que sejam seguidos critérios aceitáveis
  pela ANAC.

  3.4 Esta IS provê orientação e condições aceitáveis pela ANAC sob as quais um avião agrícola
  pode operar na categoria restrita ou na categoria normal, se seu motor, certificado para
  outro combustível, for alimentado com etanol.'
