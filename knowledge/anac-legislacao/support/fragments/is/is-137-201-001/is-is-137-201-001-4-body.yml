text: '4. DEFINIÇÕES - N/A


  5.DESENVOLVIMENTO DO ASSUNTO

  5.1 Aplicabilidade

  5.1.1 As disposições desta IS aplicam-se somente aos aviões agrícolas certificados na categoria
  restrita ou na categoria normal, equipadoss com motores convencionais e que operam segundo
  o RBAC 137. Para os propósitos desta IS, a palavra aeronave refere-se apenas a avião.'
