id: is-is-137-201-001-5-1-2-a
kind: is
document: is-137-201-001
family: '137'
section_id: 5.1.2
section_title: Esta IS não autoriza nenhuma outra modificação além daquela relacionada à conversão
  do avião e motor para o uso do etanol.
subsection_id: a
cite: 5.1.2(a)
title: 5.1.2(a)
text: 'a) As seguintes marcas e placas devem ser instaladas:

  I - No painel de instrumentos:

  “Esta aeronave deve ser operada com etanol (Álcool Etílico Hidratado Combustível - AEHC).”

  II - Na cabine, bem à vista do piloto:

  “Esta aeronave não é elegível para uma aprovação para operação sobre áreas densamente povoadas
  sob a seção 137.211 do RBAC 137 ou para um desvio de qualquer limitação da seção 91.313
  do RBAC 91.

  “O motor, Número de Série (N/S) __________, instalado nesta aeronave e operado com o combustível
  etanol pode ser instalado somente em aeronave a ser operada com uma autorização especial
  de voo sob a IS 137.201-001, a menos que seja submetido a uma revisão geral.”

  III - Na tampa do bocal de abastecimento de combustível (ou próximo a ela):

  “Etanol (Álcool Etílico Hidratado Combustível - AEHC)”'
