section_title: Esta IS não autoriza nenhuma outra modificação além daquela relacionada à conversão
  do avião e motor para o uso do etanol.
subsection_id: b
cite: 5.1.2(b)
title: 5.1.2(b)
text: 'b) O seguinte registro deve ser efetuado em local apropriado da caderneta do motor:

  “Este motor, Número de Série (N/S) ________, foi operado com combustível etanol e pode ser
  instalado somente em aeronave a ser operada com uma autorização especial de voo sob a IS
  137.201-001, a menos que seja submetido a uma revisão geral.”'
