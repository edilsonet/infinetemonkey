text: '5.6.3 Para aeronaves com certificado de aeronavegabilidade suspenso, também deverá
  ser apresentada comprovação de correção das pendências, conforme aplicável.

  5.6.4 Aeronaves para as quais a ANAC não tenha emitido nenhum certificado de aeronavegabilidade,
  e que tenham sido submetidas às alterações em pauta, somente receberão o AEV após aprovação
  em vistoria técnica inicial.'
