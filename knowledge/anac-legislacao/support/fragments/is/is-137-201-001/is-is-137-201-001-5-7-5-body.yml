title: É recomendado avaliar a necessidade de instalação de um sistema de partida a frio.
text: '5.7.5 É recomendado avaliar a necessidade de instalação de um sistema de partida a
  frio.

  5.7.6 Considerando que o etanol é uma substância higroscópica e um combustível primariamente
  de uso automotivo, sem controle de qualidade equivalente àquele de uso aeronáutico, é recomendado
  avaliar o impacto no desempenho do motor em função do nível de hidratação do etanol além
  do especificado.

  5.7.7 É recomendado que publicações técnicas, especificações da indústria, manuais militares
  e modificações prévias satisfatórias sejam usados como referência nas referidas modificações.

  5.7.8 Recomenda-se a elaboração de instruções de operação da aeronave com as limitações,
  condições e procedimentos acrescentados ou modificados em decorrência da modificação da
  aeronave para utilização do etanol. Marcas e placas adicionais àquelas estabelecidas no
  item 5.4 desta IS podem ser necessárias informando eventuais limitações operacionais em
  razão da modificação da aeronave.'
