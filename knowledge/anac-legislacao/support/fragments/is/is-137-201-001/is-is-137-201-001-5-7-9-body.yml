text: '5.7.9 Recomenda-se ainda a elaboração de procedimentos de manutenção específicos para
  a operação da aeronave com etanol.

  5.7.10 O cumprimento das recomendações anteriores não é mandatório. Contudo, essas recomendações
  devem ser avaliadas criteriosamente pelo requerente, o qual deve atentar para os riscos
  relacionados ao não cumprimento de qualquer uma delas.'
