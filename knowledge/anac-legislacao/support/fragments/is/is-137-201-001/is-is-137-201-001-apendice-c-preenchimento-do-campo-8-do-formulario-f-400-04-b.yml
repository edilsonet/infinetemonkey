title: apendice-c-preenchimento-do-campo-8-do-formulario-f-400-04(b)
text: 'b) Na cabine, bem à vista do piloto:

  “Esta aeronave não é elegível para uma aprovação para operação sobre áreas densamente povoadas
  sob a seção 137.211 do RBAC 137 ou para um desvio de qualquer limitação da seção 91.313
  do RBAC91.

  “O motor, Número de Série (N/S) __________, instalado nesta aeronave e operado com o combustível
  etanol pode ser instalado somente em aeronave a ser operada com uma autorização especial
  de voo sob a IS 137.201-001, a menos que seja submetido a uma revisão geral.”'
