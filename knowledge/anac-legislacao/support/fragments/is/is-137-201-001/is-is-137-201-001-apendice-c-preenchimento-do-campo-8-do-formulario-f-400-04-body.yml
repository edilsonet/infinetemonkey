text: 'APÊNDICE C - PREENCHIMENTO DO CAMPO 8 DO FORMULÁRIO F-400-04


  C1. O campo 8 do F-400-04 deve ser preenchido como mostrado no quadro a seguir, com os espaços
  em branco adequadamente preenchidos:


  Os procedimentos e modificações cobertos por este formulário F-400-04 foram considerados
  aceitáveis pela ANAC, de acordo com a Instrução Suplementar no 137.201-001, “Uso de etanol
  em aeronaves agrícolas”, para demonstração de cumprimento com a seção 43.13 do RBAC 43,
  o parágrafo 91.407(a)(1) do RBAC 91 e o parágrafo 137.201(e) do RBAC 137. A aeronave e o
  motor identificados nos campos 1 e 4 deste formulário podem ser aprovados para retorno ao
  serviço por uma pessoa autorizada de acordo com a seção 43.7 do RBAC 43, quando as seguintes
  condições forem satisfeitas:

