text: 'c) Na tampa do bocal de abastecimento de combustível (ou próximo a ela):

  “Etanol (Álcool Etílico Hidratado Combustível - AEHC)”

  2) O seguinte registro for efetuado em local apropriado da caderneta do motor:


  “Este motor, Número de Série (N/S) _________, foi operado com combustível etanol e pode
  ser instalado somente em aeronave a ser operada com uma autorização especial de voo sob
  a IS 137.201-001, a menos que seja submetido a uma revisão geral.”

  3) A seguinte declaração for emitida por um piloto habilitado para a aeronave:

  “Eu declaro que a combinação aeronave/motor/hélice foi avaliada em voo em todas as manobras
  típicas da operação agrícola usando etanol e que o motor operou sem evidência de mau funcionamento
  e dentro das limitações estabelecidas nas especificações: Especificação da Aeronave nº____________;
  Especificação do Motor nº_____________; Especificação da Hélice nº____________; Nome do
  Piloto:_______________________ Certificado de Habilitação Técnica nº____________.”'
