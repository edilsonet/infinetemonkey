title: 'Os perigos na aviação civil costumam ser de dois tipos: naturais e técnicos.'
text: '5.3.1 Os perigos na aviação civil costumam ser de dois tipos: naturais e técnicos.

  5.3.2 Na identificação dos perigos naturais, é necessário avaliar o ambiente operacional
  do operador, considerando a possibilidade de eventos meteorológicos ou climáticos adversos,
  eventos geofísicos, condições geográficas, obstáculos e eventos ambientais ou de saúde pública.

  5.3.3 Na identificação dos perigos técnicos, é necessário avaliar as aeronaves e seus componentes,
  sistemas, subsistemas e equipamentos, instalações de uma organização, ferramentas e equipamentos,
  bem como as instalações, sistemas, subsistemas e equipamentos fora da organização, deficiências
  de treinamento e desvios de padrões operacionais esperados por parte dos colaboradores.
  Devem ser considerados também fatores de projeto, procedimentos e práticas operacionais,
  comunicações, fatores organizacionais, fatores do ambiente de trabalho, fatores regulamentares,
  defesas existentes e aspectos relacionados ao desempenho humano.

  5.3.4 É importante que fique claro que não é atribuição do responsável pelo gerenciamento
  do risco tomar as medidas de mitigação, mas do gestor responsável. No entanto, é obrigação
  do responsável pelo gerenciamento do risco dar ciência ao gestor responsável sobre os perigos
  identificados no operador e propor alternativas de ação.

  5.3.5 Nesse sentido, as interações entre o responsável pelo gerenciamento do risco e o gestor
  responsável acerca dos riscos do operador devem ser de modo completo, formal e rastreável
  (por exemplo, e-mails, áudios e mensagens em aplicativos de mensagens, documentos protocolados
  na empresa, etc.), e não em comunicações meramente verbais ou não rastreáveis. Comunicação
  completa significa dizer que deve ser assegurado que o receptor recebeu e compreendeu a
  mensagem encaminhada pelo emissor (por exemplo, não basta apenas encaminhar um e-mail e
  não receber uma confirmação de recebimento).'
