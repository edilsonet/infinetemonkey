title: OBJETIVO
text: 'OBJETIVO

  Oferecer a uma organização que opere ou pretenda operar sob o RBAC nº 137 em operações aeroagrícolas,
  um método para o gerenciamento do risco das operações, conforme exigido pela seção 135.215
  do RBAC nº 137.'
