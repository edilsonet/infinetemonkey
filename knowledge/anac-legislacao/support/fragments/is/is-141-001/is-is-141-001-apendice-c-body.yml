text: 'Apêndice C

  Inclusão para seguir o padrão de outras IS


  ALTERAÇÕES REALIZADAS NA REVISÃO D

  A aprovação do RBAC 141 e a necessidade de desenvolvimento de um novo sistema foram os fatores
  fundamentais para a reedição de todo o conteúdo da IS 141-001 Revisão C.'
