title: OBJETIVO
text: 'OBJETIVO

  Apresentar os procedimentos de comunicação das informações dos instrutores dos Centros de
  Instrução de Aviação Civil (Ciacs) e dos alunos matriculados nos cursos teóricos e práticos
  de maneira individualizada, em atendimento ao parágrafo 141.79(g) do RBAC nº 141, utilizando-se
  o Sistema S141.'
