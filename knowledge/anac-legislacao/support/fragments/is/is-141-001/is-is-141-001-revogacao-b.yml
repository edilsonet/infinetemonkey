title: revogacao(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normatizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS é fundamentada e objetiva oferecer método de cumprimento ao parágrafo 141.79(g)
  do RBAC nº 141.'
