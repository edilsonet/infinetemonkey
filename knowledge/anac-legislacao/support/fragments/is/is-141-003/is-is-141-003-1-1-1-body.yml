text: '1.1.1 Padrão de Desempenho: Um valor ou uma referência mensurável e observável, estabelecido
  para avaliar

  uma tarefa/atividade, o qual deverá servir como um referencial para comparação entre diferentes
  graus de

  efetividade na realização de uma tarefa/atividade.

  B2. Tabela de competências

  1

  Comunicações aeronáuticas

  Descrição: Conhecimentos e habilidades necessários para se comunicar de forma eficaz com
  todas as partes

  interessadas dentro de um ambiente operacional e para garantir que as mensagens são claramente
  entendidas

  e respondidas de forma adequada.

  1.1 Realiza comunicação bilateral'
