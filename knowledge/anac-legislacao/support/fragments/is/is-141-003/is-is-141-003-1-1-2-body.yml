title: Principais elementos a serem determinados para o
text: '1.1.2 Principais elementos a serem determinados para o

  deslocamento sobre a superfície da Terra: posição, direção,Data de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  • Citar a importância, para a navegação aérea, de cada um dos

  principais elementos a serem determinados para o

  deslocamento sobre a superfície da Terra.

  1.2

  • Identificar a forma real da Terra e a forma da Terra para fins

  de navegação.

  • Definir movimento de rotação, movimento de translação,

  movimento de precessão, movimento de nutação e

  movimento de revolução.

  • Explicar o movimento de rotação real da Terra.

  • Explicar o movimento aparente do sol.

  • Definir os termos trânsito do Sol, sol médio e dia solar.

  1.3

  • Reconhecer mapas, cartas e globo terrestre como

  representações gráficas da Terra.

  • Definir os termos círculos máximos e círculos menores ou

  mínimos.

  • Identificar círculos máximos e círculos menores ou mínimos

  em representação gráfica do globo terrestre.

  • Definir arco, grau de arco, sentido e direção.

  • Identificar, em representação gráfica do globo terrestre,

  deslocamento em graus, direção e sentido.

  • Definir Equador, hemisférios, polos geográficos ou

  verdadeiros da Terra como esfera perfeita e eixo imaginário.

  • Identificar, em representação gráfica do globo terrestre, o

  Equador, os hemisférios, os polos geográficos ou

  verdadeiros da Terra como esfera perfeita e o eixo

  imaginário.

  • Definir diâmetro equatorial e diâmetro polar.

  • Identificar os valores do diâmetro equatorial e do diâmetro

  polar.

  • Definir paralelos, latitude e paralelos de latitude.

  • Identificar, em representação gráfica do globo terrestre,

  paralelos, latitude e paralelos de latitude.

  • Efetuar leitura de latitude.

  • Definir colatitude.

  • Calcular colatitude.

  • Definir meridianos, meridiano de origem (meridiano de

  Greenwich) e antimeridianos.

  • Identificar, em representação gráfica do globo terrestre,

  meridianos, o meridiano de origem (meridiano de

  Greenwich) e antimeridianos.

  • Definir longitude e meridianos de longitude.

  • Efetuar leitura de longitude.

  • Definir antimeridiano.

  • Descrever a composição do sistema de coordenadas

  geográficas.

  • Explicar a utilização do sistema de coordenadas geográficas.

  • Plotar a posição de um ponto ou lugar na superfície da Terra

  através do sistema de coordenadas geográficas.

  • Obter as coordenadas geográficas de um ponto ou lugar na

  superfície da Terra através do sistema de coordenadas

  geográficas.

  • Determinar em mapas a posição geográfica das principais

  cidades do Brasil e do mundo.

  1.4

  • Evidenciar a importância, para a navegação aérea, da Tabela

  do Nascer e Pôr do Sol.

  • Consultar a Tabela do Nascer e Pôr do Sol.

  distância, tempo e velocidade -- Definições. Importância para a

  navegação aérea. Aplicações

  1.2 Planeta Terra'
