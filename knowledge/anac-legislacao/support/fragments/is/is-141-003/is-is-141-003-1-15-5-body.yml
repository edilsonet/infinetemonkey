text: '1.15.5 Carta de Aproximação por Instrumentos (Instrument Approach Chart -

  IAC)

  2 Leitura e interpretação

  Objetivos Específicos Subunidades

  • Ler e reconhecer textos gerais sobre aviação,

  veiculados pela mídia.

  • Ler e interpretar textos básicos em inglês sobre as

  aeronaves típicas com as quais um DOV trabalha.

  • Ler, reconhecer e extrair informações dos manuais

  em inglês das aeronaves típicas com as quais um

  DOV trabalha.

  2.1 Tipologia textual (Text types)

  2.2 Gêneros textuais (Text genres)

  2.3 Estratégias de leitura: objetivos da leitura, atualização de

  conhecimentos prévios, previsão, inferência e resumo (Reading

  strategies)'
