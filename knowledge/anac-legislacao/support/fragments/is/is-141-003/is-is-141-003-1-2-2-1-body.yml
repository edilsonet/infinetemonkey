title: 'Coeficientes aerodinâmicos: coeficiente de sustentação'
text: '1.2.2.1 Coeficientes aerodinâmicos: coeficiente de sustentação

  (Cl), coeficiente de arrasto (Cd) e coeficiente de momento (Cm) -

  DefiniçõesData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar a influência exercida na sustentação pelos tipos de

  aerofólios, pelos ângulos de ataque, pela velocidade

  aerodinâmica e pela densidade do ar.

  • Explicar a influência do ângulo de ataque no coeficiente de

  sustentação.

  • Citar as características aerodinâmicas do aerofólio de perfil

  simétrico.

  • Citar as características aerodinâmicas do aerofólio de perfil

  assimétrico.

  • Distinguir os efeitos da variação do ângulo de ataque sobre a

  posição do centro de pressão (CP), em um aerofólio de perfil

  simétrico e em um aerofólio de perfil assimétrico.

  1.3

  • Definir as partes constituintes e os parâmetros de uma asa.

  • Explicar como se distribui a força de sustentação em uma asa.

  • Descrever os fatores que influenciam os coeficientes de

  sustentação, arrasto e momento.

  1.4

  • Definir arrasto.

  • Identificar os grupos básicos de arrasto.

  • Definir arrasto induzido e efeito de vórtice.

  • Citar os meios utilizados para redução do arrasto induzido.

  • Definir arrasto parasita.

  • Enunciar as diferenças existentes entre arrasto de atrito, arrasto

  de pressão ou de forma e arrasto de interferência.

  • Definir área plana equivalente.

  • Definir arrasto total e coeficiente de arrasto.

  1.5

  • Definir estol em um aerofólio.

  • Explicar a influência da velocidade e do ângulo de ataque sobre

  o estol em um aerofólio.

  • Definir estol com potência, estol sem potência, estol na raiz da

  asa e estol na ponta da asa.

  • Citar as características do estol com potência, do estol sem

  potência, do estol na raiz da asa e do estol na ponta da asa.

  • Caracterizar os dispositivos de aviso de estol quanto à finalidade

  e à localização.

  • Citar os meios utilizados para prevenir o estol.

  1.6

  • Definir tração.

  • Enunciar as diferenças existentes entre a tração obtida pelos

  motores convencionais, a tração obtida pelos turboélices e a

  tração obtida pelos motores a reação.

  • Explicar a relação da potência efetiva e nominal nos motores

  convencionais com as variações da RPM do motor, da pressão

  de admissão e da altitude pressão.'
