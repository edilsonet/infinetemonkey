title: Interceptação de parte da energia irradiada pelo fio paralelo
text: '1.2.3 Interceptação de parte da energia irradiada pelo fio paralelo

  remotoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar como se processa a transmissão e a propagação

  dos sinais de rádio.

  • Definir os termos: modulação, sincronismo e

  codificação de pulsos.

  • Explicar a finalidade do Código Morse internacional.

  • Reconhecer as características de propagação das ondas

  de rádio em diferentes frequências.

  1.4

  • Definir radionavegação.

  • Evidenciar a importância da radionavegação para a

  navegação aérea no voo visual e por instrumentos.

  • Explicar o funcionamento e a utilização dos radares

  terrestres e das estações de identificação de direções.

  • Definir cada uma das estações rádio de solo: Rádio Farol

  não Direcional (NDB), Rádio Farol Omnidirecional

  (VOR) e Equipamento Medidor de Distância ou

  Equipamento Radiotelemétrico (DME).

  • Identificar cada uma das estações rádio de solo.

  • Explicar o funcionamento e a utilização de cada uma das

  estações rádio de solo.

  • Reconhecer os conceitos básicos de sistemas de

  navegação por satélites.

  • Explicar o funcionamento e a utilização dos sistemas de

  navegação por satélites.

  • Identificar cada um dos equipamentos de

  radionavegação de bordo.

  • Explicar o funcionamento e a utilização de cada um dos

  equipamentos de radionavegação de bordo.'
