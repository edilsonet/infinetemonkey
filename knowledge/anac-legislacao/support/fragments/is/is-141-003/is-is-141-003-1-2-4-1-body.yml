text: '1.2.4.1 Conjunto dos números racionais não negativos: conjunto

  Q+ - Conceituação de fração. Frações próprias, impróprias e

  aparentes. Frações equivalentes. Simplificação de frações.

  Redução de frações ao mesmo denominador. Operações de

  adição, subtração, multiplicação e divisão de frações. Decimais.

  Transformação de frações em decimais e vice-versa. Operações

  de adição, subtração, multiplicação e divisão de decimais. Média

  aritmética e média ponderada.'
