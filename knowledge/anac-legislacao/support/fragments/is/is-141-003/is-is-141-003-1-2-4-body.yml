text: '1.2.4 RBAC 129 -- Aplicabilidade. Definições

  2 Regras gerais de operação para aeronaves civis - RBHA/RBAC 91

  Objetivos Específicos Subunidades

  2.1

  • Explicar os requisitos relativos à responsabilidade e à autoridade

  do piloto em comando.

  • Resumir os requisitos relativos a: i) aeronavegabilidade de

  aeronave civil; e ii) manual de voo, marcas e letreiros de aviões

  civis

  • Explicar as regras relativas a: i) operação descuidada ou

  negligente; ii) queda de objetos; iii) álcool e drogas; e transporte

  de substâncias entorpecentes ou que possam determinar

  dependência física ou psíquica.

  2.2

  • Definir espaço aéreo NAT-MNPS.

  2.1 Subparte A - Geral'
