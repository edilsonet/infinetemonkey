  2 Sistema de controle de voo

  Objetivos específicos Subunidades

  2.1

  • Caracterizar, quanto às finalidades e ao funcionamento de cada um, o

  estabilizador horizontal rotativo e o estabilizador horizontal com

  ângulo de incidência ajustável.

  2.2

  • Descrever o funcionamento dos flapes do bordo de ataque, dos flapes

  do bordo de fuga, dos slats e dos slots (fendas).

  • Citar os diferentes tipos de sistemas operacionais de acionamento dos

  flapes do bordo de ataque, dos flapes do bordo de fuga, dos slats e dos

  slots.

  • Relacionar, às respectivas proteções, as mais comuns limitações

  operacionais da atuação dos flapes do bordo de ataque, dos flapes do

  bordo de fuga, dos slats e dos slots.

  • Discorrer sobre a utilização dos controles dos flapes do bordo de

  ataque, dos flapes do bordo de fuga, dos slats e dos slots.

  • Caracterizar, quanto à finalidade e ao funcionamento, os ailerons

  conjugados com os flapes.

  • Caracterizar, quanto à finalidade e ao funcionamento, os flapes

  ailerons.

  2.3

  • Descrever o funcionamento dos spoilers como freio aerodinâmico em

  voo (speed brake).

  • Descrever o funcionamento dos spoilers no controle de rolagem em

  voo, em conjunto com os ailerons e isoladamente.

  • Descrever o funcionamento dos spoilers nas rejeições de decolagem e

  nas paradas de pouso, operando no modo automático e no modo

  manual.

  2.1 Estabilizadores'
