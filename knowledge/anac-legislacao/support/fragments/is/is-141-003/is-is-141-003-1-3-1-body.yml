text: '1.3.1 Modelo SCHELL - Versão expandida do modelo

  SHEL:

  S = software: os procedimentos e outros aspectos do

  projeto de trabalho

  C = culture: as culturas organizacionais e nacionais que

  influenciam as interações

  H = hardware: equipamentos, ferramentas e tecnologia

  utilizadae no trabalho

  E = enviroment: as condições ambientais em que ocorre o

  trabalho

  L = liveware: os aspectos humanos do sistema de trabalho

  L = liveware: as inter-relações entre os seres humanos no

  trabalho'
