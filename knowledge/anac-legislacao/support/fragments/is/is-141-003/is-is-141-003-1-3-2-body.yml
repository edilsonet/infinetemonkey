title: Disponibilidade de manutenção e serviços em aeródromo
text: '1.3.2 Disponibilidade de manutenção e serviços em aeródromo

  alternativo -- Efeito sobre outros sistemas. Considerações ETOPS.

  Potencial emergência

  1.4 Mudanças climáticas em rota

  • ventos

  • condições meteorológicas nos aeródromos alternativos (incluindo

  ETOPS)

  • turbulência

  • formação de gelo

  • desvios de rota sugeridos pelo DOV

  1.5 Situações anormais e de emergência

  • relatório de posição em atraso

  • atraso no destino

  • falta de combustível

  • falha de comunicação terra-ar

  • condições inseguras para a continuidade da operação

  • fogo a bordo

  • perda de motor (es)

  • despressurização da cabine

  • ato de interferência ilícita

  • incapacidade de tripulante

  • amerissagem / pouso de emergência

  • coordenação de resgate

  • coordenação e notificação ATC

  2 Recursos de monitoramento de voo

  Objetivos Específicos Subunidades

  2.1 2.1 Relatórios de posição

  -- do sistema de comunicação do transportador aéreoData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Identificar os recursos disponíveis para obter dados para

  monitorar a aeronave durante o voo.

  2.2

  • Reconhecer as fontes e empregar todos os recursos disponíveis

  para o monitoramento de um voo.

  -- Aeronautical Radio Incorporated (ARINC)

  -- Aircraft Situation Display (ASD)

  -- da estação de partida e de destino

  -- dos órgãos ATC

  -- dos sistemas de satélites

  2.2 Disponibilidade de recursos no solo

  -- manutenção

  -- analistas de sistemas

  -- meteorologistas

  -- engenharia de operações

  -- recursos médicos

  -- escala de tripulantes

  -- regulamentação

  -- gestão da empresa

  -- disponibilidade de aeródromo

  -- assistência em terra

  -- informações de atividade vulcânica

  -- informações sobre o serviço de passageiros'
