title: Responsabilidades do DOV
text: '1.3.3 Responsabilidades do DOV

  2 Momentos e equilíbrio da aeronave

  Objetivos Específicos Subunidades

  2.1

  • Definir os termos: equilíbrio e centro de gravidade (CG).

  • Explicar as condições para o equilíbrio de uma aeronave no

  solo.

  • Definir os termos: centro de pressão, corda média

  aerodinâmica, ponto de referência (linha datum), momento e

  braço de momento.

  • Explicar a relação entre os vários componentes que

  permitem a estabilidade longitudinal da aeronave em voo.

  • Explicar a função dos estabilizadores horizontais e

  profundores nas aeronaves com estabilizadores horizontais

  fixos.

  • Explicar a função dos estabilizadores horizontais e

  profundores nas aeronaves com estabilizadores variáveis.

  2.2

  • Identificar onde podem ser encontrados um dado momento e

  braços de momento em uma aeronave.

  • Determinar o momento em uma aeronave a partir de uma

  linha datum.

  • Estabelecer a relação entre momento e linha datum.

  2.3

  • Identificar as unidades de medidas utilizadas para o cálculo

  do CG.

  • Efetuar cálculos utilizando polegadas e quilogramas.

  • Explicar os pressupostos práticos para o cálculo do CG.

  • Explicar o princípio do método aritmético.

  • Calcular a posição CG de uma aeronave através do uso de

  fórmula: CG = soma dos Momentos / massa total.

  • Explicar o princípio do método gráfico de cálculo do CG.

  • Determinar a posição do CG da aeronave com o uso de dados

  de gráficos de balanceamento.

  • Explicar o princípio do método de índice.

  • Extrair dados apropriados para os cálculos a partir de

  determinados documentos.

  • Calcular o CG de uma aeronave com os compartimentos de

  passageiros e carga totalmente carregados.

  • Calcular a quantidade de carga que pode ser transportada no

  compartimento de carga traseiro, sem exceder os limites do

  CG da aeronave.

  • Calcular o CG depois de determinar locais finais de peso

  individual dentro de limites pré-determinados.

  • Calcular o CG para uma determinada carga usando dados de

  datum e braço para uma dada aeronave com vários

  compartimentos e seções.

  • Calcular o CG para a mesma carga na mesma aeronave

  utilizando método gráfico do operador.

  2.1 Equilíbrio e estabilidade longitudinal da aeronave'
