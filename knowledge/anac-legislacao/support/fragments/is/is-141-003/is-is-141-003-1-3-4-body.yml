title: 'Serviços operacionais de Meteorologia: Instituto Nacional'
text: '1.3.4 Serviços operacionais de Meteorologia: Instituto Nacional

  de Meteorologia (INMET); Diretoria de Hidrografia e Navegação

  (DHN) da Marinha do Brasil e Departamento de Controle do

  Espaço Aéreo (DECEA) do Comando da Aeronáutica -- Atuação

  de cada um em Meteorologia Aeronáutica

  2 Atmosfera: temperatura e umidade

  Objetivos Específicos Subunidades

  2.1

  • Citar os principais componentes da atmosfera.

  • Identificar cada uma das camadas (divisões verticais) da

  atmosfera e suas características.

  • Definir atmosfera padrão OACI (ICAO Standard Atmosphere

  - ISA).

  • Citar os padrões de valores utilizados pela atmosfera padrão

  OACI.

  2.2

  • Reconhecer as principais unidades utilizadas para medir

  temperatura, bem como seus respectivos símbolos.

  • Citar as utilizações dos termômetros na aviação.

  • Citar as utilizações das escalas termométricas Celsius,

  Fahrenheit e escala absoluta (Kelvin).

  • Realizar cálculos de transformação de escalas termométricas

  2.3

  • Identificar os processos físicos relacionados com a

  transferência de calor e umidade na atmosfera.

  • Definir radiação, condução, advecção, radiação solar e

  radiação terrestre.

  • Explicar os mecanismos de transferência de calor na

  atmosfera.

  2.4

  • Explicar as influências exercidas na variação da temperatura

  na superfície terrestre pelo ângulo de incidência solar, pela

  natureza da superfície, pela cobertura de nuvens e pelo vento.

  • Identificar os processos físicos relacionados com a variação e

  a transferência de calor na atmosfera.

  • Relacionar a variação vertical da temperatura do ar (ou

  gradiente térmico vertical) com a variação da altitude.

  • Relacionar a variação horizontal da temperatura do ar com a

  variação da latitude.

  • Descrever os motivos das variações de temperatura e umidade

  horizontal e verticalmente.

  • Citar as causas e os efeitos das camadas isotérmicas da

  atmosfera.

  2.5

  • Explicar a origem do vapor d’água na atmosfera.

  • Definir evaporação, condensação, sublimação e saturação.

  • Explicar o ciclo hidrológico.

  • Definir temperatura do ponto de orvalho.

  • Definir umidade do ar.

  • Explicar a influência da umidade do ar no desempenho do voo.

  • Definir umidade relativa do ar e umidade absoluta do ar.

  • Explicar o processo de determinação da umidade relativa do

  ar.

  2.1 Atmosfera'
