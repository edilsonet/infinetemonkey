title: Preenchimento e apresentação do plano de voo ATC ao órgão AIS
text: '1.3.8 Preenchimento e apresentação do plano de voo ATC ao órgão AIS

  -- Regulamentação aplicável: ICA 100-11 e MCA 100-11

  2 Cálculo de combustível para elaboração do planejamento de voo

  Objetivos específicos Subunidades

  2.1

  • Identificar os requisitos de suprimento de combustível em

  aviões turboélice, nas operações domésticas, de bandeira e

  suplementares.

  • Identificar os requisitos de suprimento de combustível em

  aviões com motores a reação, nas operações domésticas,

  de bandeira e suplementares.

  • Identificar os requisitos para que o peso zero combustível

  e o peso estrutural de pouso possam ser aumentados acima

  do máximo aprovado, nos aviões categoria transporte.

  • Identificar os requisitos de suprimento de combustível

  para despachar ou autorizar um voo de um avião com

  motores à reação com mais de dois motores para um voo

  de mais de 90 minutos de um aeródromo.

  2.2

  • Identificar os fatores a serem considerados para calcular a

  quantidade mínima de combustível com base no manual de

  voo.

  • Calcular o combustível mínimo requerido para cada etapa

  de um determinado voo.

  • Calcular o uso de combustível total previsto para o voo,

  consultando as tabelas de utilização de combustível e / ou

  gráficos no manual da aeronave.

  • Completar um log de combustível a partir de itens de

  tabelas e / ou gráficos de combustível ou outros dados

  apropriados.

  2.1 Requisitos de suprimento de combustível (RBAC 121)'
