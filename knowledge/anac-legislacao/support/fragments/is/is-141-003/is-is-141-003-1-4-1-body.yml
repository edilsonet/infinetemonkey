title: Condições para sobrevoar o espaço aéreo de um Estado
text: '1.4.1 Condições para sobrevoar o espaço aéreo de um Estado

  Contratante, sem permissão especial ou acordo para aeronaves que

  não estejam envolvidas no serviço de transporte aéreo ( passageiros,

  carga , correio, etc) - Disposições da Convenção. Direitos de fazer

  paradas para fins não comerciais. Possibilidades de privilégio de

  assumir carga. Aeronaves excluídas ( aeronave de Estado , tais como

  aeronaves militares )'
