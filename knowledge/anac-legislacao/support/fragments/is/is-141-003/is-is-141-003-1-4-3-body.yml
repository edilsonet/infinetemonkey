title: Graus direcionais -- Leitura de mapas no sentido
text: '1.4.3 Graus direcionais -- Leitura de mapas no sentido

  horizontal, com o norte como referênciaData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Identificar, com base no nascer e pôr do sol, os pontos

  cardeais, os pontos colaterais, os pontos subcolaterais e os

  quadrantes.

  • Efetuar leitura de direção tomando por base a Rosa dos

  Ventos.

  • Efetuar leitura de sentido e direção nas cartas.

  • Definir rota, rota loxodrômica e rota ortodrômica.

  1.5

  • Aplicar o sistema de unidades padronizado pela OACI.

  • Converter quilômetros em milhas náuticas e vice-versa.

  • Definir diferença da latitude (DLA), diferença de longitude

  (DLO), latitude média (LM) e longitude média (LOM).

  • Calcular a distância de um ponto a partir da relação entre

  latitude e distância e longitude e distância.

  • Solucionar problemas de navegação aérea que envolvam

  cálculo de distância aplicando os métodos de determinar

  distâncias.

  1.6

  • Definir fuso horário.

  • Explicar a formação dos fusos horários.

  • Justificar a finalidade do padrão internacional de medição de

  horas para a aviação

  • Explicar a relação existente entre a longitude de lugar e a

  hora.

  • Transformar graus de longitude em horas.

  • Citar o número de fusos horários existentes em cada um dos

  lados do globo terrestre a partir do meridiano de Greenwich.

  • Identificar as letras e os números correspondentes a cada

  fuso do lado leste e do lado oeste da Terra.

  • Identificar, entre várias longitudes, aquela que corresponde

  ao fuso central de uma localidade.

  • Definir linha internacional de data, hora legal (HLE), hora

  local (HLO) e hora universal coordenada (UTC).

  • Determinar a hora legal (HLE) e a hora local (HLO) a partir

  da hora universal coordenada (UTC).

  • Identificar os fusos horários na representação gráfica do

  globo terrestre e nos mapas.

  • Resolver situações-problema relacionadas a fusos horários.'
