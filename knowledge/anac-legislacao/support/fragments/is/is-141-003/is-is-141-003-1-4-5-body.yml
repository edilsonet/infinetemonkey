title: 'Equipamentos de bordo: Localizador Automático de Direção'
text: '1.4.5 Equipamentos de bordo: Localizador Automático de Direção

  (ADF), Indicador Rádiomagnético (RMI), Indicador de Radial (CI),

  leitor do Equipamento Medidor de Distância ou Equipamento

  Radiotelemétrico (DME), Indicador de Situação Horizontal (HSI) e

  leitor do Sistema de Navegação Global por Satélite (GNSS) --

  Definições. Características. Interpretação das indicações. Utilizações

  2 Navegação baseada em NDB/ADF

  Objetivos Específicos Subunidades

  2.1

  • Identificar as definições e respectivas abreviaturas dos

  termos listados na AIC N07/09 do DECEA.

  • Definir os termos: marcação relativa (MR), marcação

  magnética (QDM), marcação verdadeira (MV) e linha de

  posição magnética (QDR).

  • Efetuar leitura de: marcação relativa; marcação

  magnética; marcação verdadeira e linha de posição

  magnética.

  • Determinar marcação relativa; marcação magnética;

  marcação verdadeira e linha de posição magnética.

  2.2

  • Identificar os receptores ADF e RMI instalados a bordo

  de aeronaves.

  2.1 Conceitos básicos'
