title: 'Principais órgãos: International Air Transport Association'
text: '1.6.1 Principais órgãos: International Air Transport Association

  (IATA); Comissão Latino-Americana de Aviação Civil (CLAC) e

  Associação Latino-Americana dos Transportadores Aéreos

  (ALTA) - Caracterização. Objetivos. Dados significativos

  2 O sistema de aviação civil brasileiro

  Objetivos Específicos Subunidades

  2.1

  • Identificar o documento normativo através do qual foi criado o

  Sistema de Aviação Civil brasileiro.

  • Caracterizar o Sistema de Aviação Civil Brasileiro quanto às

  suas estrutura e abrangência.

  • Citar a finalidade do Sistema de Aviação Civil.

  2.2

  • Identificar a Agência Nacional de Aviação Civil (ANAC) como

  autoridade de Aviação Civil.

  • Identificar o documento normativo através do qual foi criada a

  ANAC.

  • Identificar o documento normativo através do qual foi aprovado

  o regimento interno da ANAC.

  • Citar a competência da União exercida através da ANAC.

  • Identificar as diferentes publicações normativas da ANAC.

  • Identificar os principais órgãos responsáveis pela administração

  da Aviação Civil antes da criação da ANAC.

  • Identificar, historicamente, a finalidade do Departamento de

  Aviação Civil (DAC) como órgão subordinado ao Ministério da

  Aeronáutica (MAer), posteriormente denominado Comando da

  Aeronáutica (COMAER).

  • Identificar os órgãos da estrutura organizacional da ANAC.

  • Descrever, sumariamente, as atribuições das diferentes unidades

  organizacionais da ANAC.

  • Identificar as Superintendências da ANAC que detêm

  competências com relação à formação, capacidade física e

  mental e habilitação de tripulantes e à segurança das operações

  aéreas, bem como suas atribuições pertinentes a essas

  competências.

  2.3

  • Identificar como entidades integrantes do Sistema de Aviação

  Civil brasileiro: a Secretaria de Aviação Civil, as empresas de

  transporte aéreo, os operadores da aviação geral, as empresas

  prestadoras de serviços auxiliares de transporte aéreo, as

  empresas de serviços aéreos especializados, as empresas de táxi

  aéreo, as administrações aeroportuárias, as escolas de Aviação

  Civil/Centros de Instrução de Aviação Civil (CIAC), as

  entidades de ensino superior, as oficinas de manutenção de

  aeronaves, as empresas pertencentes à indústria aeronáutica e as

  entidades aerodesportivas, bem como o Departamento de

  Controle do Espaço Aéreo (DECEA), o Centro de Investigação

  e Prevenção de Acidentes Aeronáuticos (CENIPA), a Diretoria

  de Saúde da Aeronáutica (DIRSA), a Diretoria de Engenharia da

  Aeronáutica (DIRENG), o Departamento de Ciência e

  Tecnologia Aeroespacial (DCTA) e o Comando Aéreo Regional

  (COMAR) e seus respectivos órgãos subordinados.

  2.1 Sistema de Aviação Civil'
