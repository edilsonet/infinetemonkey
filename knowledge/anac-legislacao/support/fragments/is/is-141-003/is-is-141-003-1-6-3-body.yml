title: Relacionamento da potência efetiva e nominal nos motores
text: '1.6.3 Relacionamento da potência efetiva e nominal nos motores

  convencionais com as variações da RPM do motor, da pressão de

  admissão e da altitude pressão

  2 Hélices

  Objetivos Específicos Subunidades

  2.1

  • Definir cada uma das forças produzidas pela hélice: força de

  tração, força centrífuga e força de torção.

  • Citar os fatores que interferem na eficiência de uma hélice.

  • Definir cada um dos efeitos gerados por uma hélice: esteira

  aerodinâmica da hélice, torque, efeitos giroscópicos e tração

  assimétrica.

  • Explicar a interferência, no voo, de cada um dos efeitos gerados

  por uma hélice.

  2.2

  • Citar a influência e a correlação com o desempenho de um avião

  das hélices de passo variável.

  • Comparar o desempenho das hélices de passo variável com as

  hélices de passo fixo nas diversas fases do voo.

  • Descrever o funcionamento das hélices de passo variável nas

  diversas fases do voo.

  • Caracterizar o passo chato, o passo reverso e o passo bandeira

  quanto à finalidade e ao funcionamento.

  2.1 Funcionamento das hélices'
