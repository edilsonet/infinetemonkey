text: '1.6.7 Situações-problema relacionadas a fusos horários

  2 Magnetismo terrestre e navegação aérea

  Objetivos Específicos Subunidades

  3.1

  • Definir magnetismo e magnetismo terrestre.

  • Explicar a influência do magnetismo terrestre na navegação

  aérea.

  • Explicar a origem do campo magnético terrestre.

  • Explicar a relação existente entre os movimentos de

  precessão e nutação e as variações do campo magnético.

  • Evidenciar a importância da variação do campo magnético

  da Terra para a navegação.

  • Definir componente vertical e componente horizontal do

  campo magnético terrestre.

  • Explicar a variação de intensidade entre as componentes

  vertical e horizontal no Equador e nos polos e sua influência

  na inclinação magnética.

  • Localizar o Polo Norte e o Polo Sul.

  • Definir polos magnéticos da Terra.

  3.1 A Terra como ímã'
