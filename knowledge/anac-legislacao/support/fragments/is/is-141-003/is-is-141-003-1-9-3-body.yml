title: Lista no Anexo I deste documento
text: '1.9.3 Lista no Anexo I deste documento

  2 Leitura e compreensão

  Objetivos específicos Subunidades

  • Ler e interpretar esquemas, gráficos, tabelas ilustrações,

  diagramas, etc. veiculados em língua inglesa, em especial

  aqueles presentes nos manuais das aeronaves típicas com as

  quais um DOV trabalha.

  • Ler, identificar e interpretar os itens da MEL (Minimum

  Equipment List) das aeronaves típicas com as quais um DOV

  trabalha.

  • Estabelecer a diferença entre MMEL (Master Minimum

  Equipment List) e MEL (Minimum Equipment List).

  2.1 Esquemas (Schemes)

  2.2 Gráficos (Graphs)

  2.3 Tabelas (Tables)

  2.4 Ilustrações (Illustrations)

  2.5 Diagramas (Diagrams)

  2.6 Títulos e subtítulos (Titles and subtitles)

  2.7 MEL (Minimum Equipment List)

  2.8 MMEL (Master Minimum Equipment List)

  3 Compreensão auditiva

  Objetivos específicos Subunidades

  3.1

  • Escutar e identificar mensagens gravadas em inglês,

  veiculadas em aeródromos.

  • Interpretar mensagens gravadas em inglês, veiculadas em

  aeródromos.

  3.2

  • Escutar e identificar mensagens gravadas em inglês,

  veiculadas pelos serviços de controle de tráfego aéreo.

  3.3

  • Escutar e identificar mensagens meteorológicas gravadas em

  língua inglesa

  • Interpretar mensagens meteorológicas gravadas em língua

  inglesa.

  3.4

  • Escutar e identificar mensagens narradas por controladores de

  voo e pilotos em língua inglesa.

  • Interpretar mensagens narradas por controladores de voo e

  pilotos em língua inglesa.

  • Escutar e identificar diálogos relativos a situações de

  emergência.

  3.1 Mensagens gravadas em inglês, veiculadas em aeródromos

  (Aerodrome information messages)'
