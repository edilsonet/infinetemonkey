title: Riscos e cuidados no manuseio do sistema de
text: '10.1.4 Riscos e cuidados no manuseio do sistema de

  oxigênio no solo

  10.2 Procedimentos do DOV para correções no

  planejamento do voo

  11 Sistema propulsor do avião - motor convencional

  Objetivos específicos Subunidades

  11.1

  • Identificar os tipos de motores aeronáuticos convencionais e motores

  aeronáuticos a reação.

  11.2

  • Citar as características dos motores aeronáuticos convencionais a

  quatro tempos.

  • Identificar os principais componentes dos motores aeronáuticos

  convencionais a quatro tempos do Ciclo Otto.

  • Descrever o funcionamento do ciclo teórico e do ciclo prático ou real.

  • Identificar os principais componentes dos motores convencionais a

  dois tempos.

  • Descrever o funcionamento dos motores convencionais a dois tempos.

  • Definir torque e cada uma das diferentes denominações de potências.

  • Definir cilindrada, taxa de compressão e rendimento térmico.

  • Citar as características de cada uma das fases de operação ou regimes

  do motor convencional de um avião.

  11.3

  • Evidenciar a importância do sistema de lubrificação do motor

  convencional de um avião.

  • Citar os possíveis danos causados ao motor por falta de lubrificação

  ou lubrificação inadequada.

  • Identificar os principais componentes do sistema de lubrificação do

  motor aeronáutico convencional.

  • Citar as características dos diferentes tipos de lubrificação.

  • Citar as principais propriedades dos óleos lubrificantes.

  • Evidenciar a importância da classificação SAE dos óleos lubrificantes.

  • Citar as finalidades do uso de aditivos e de detergentes na composição

  de óleos lubrificantes.

  11.4

  • Evidenciar a importância do arrefecimento para o funcionamento do

  motor.

  • Descrever os possíveis danos causados ao motor por falta de

  arrefecimento ou arrefecimento inadequado.

  • Identificar os tipos de sistemas de arrefecimento/resfriamento

  encontrados nos motores aeronáuticos convencionais.

  • Identificar os principais componentes do sistema de arrefecimento do

  motor aeronáutico convencional.

  11.5

  • Caracterizar o sistema de indução do motor aeronáutico convencional

  quanto à finalidade e à importância.

  11.1 Tipos de motores aeronáuticos: convencionais e a

  reação

  11.2 Motores aeronáuticos convencionais'
