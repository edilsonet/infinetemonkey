text: '10.2.3 Coordenação referente à prestação do

  serviço de controle de tráfego aéreo -- Divisão de

  controle, transferência de controle e troca de

  informações sobre o controle

  -- coordenação entre centros de controle de área

  adjacentes

  -- coordenação entre centro de controle de área e

  controle de aproximação

  -- coordenação entre controle de aproximação e

  torre de controle de aeródromo

  -- coordenação entre posições de controle de um

  mesmo órgão

  -- transferência de controle entre as posições

  operacionais “torre” e “controle de solo”.'
