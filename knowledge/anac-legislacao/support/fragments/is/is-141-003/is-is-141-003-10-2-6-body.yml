title: Coordenação entre órgãos ATS e a
text: '10.2.6 Coordenação entre órgãos ATS e a

  administração do aeroporto -- Acordos

  operacionais

  11 Sistema de Gerenciamento de Fluxo de Tráfego Aéreo

  Objetivos específicos Subunidades

  11.1

  • Identificar a finalidade e o âmbito da ICA 100-22.

  • Identificar o significado dos termos e abreviaturas utilizados na ICA 100-22.

  11.2

  • Apontar o Diretor-Geral do DECEA como a autoridade responsável pela

  administração geral do Serviço ATFM no Brasil.

  • Identificar a área do território nacional sob a responsabilidade do serviço

  ATFM.

  • Identificar o órgão responsável por centralizar a prestação do serviço ATFM.

  • Identificar as atribuições de cada um dos órgãos envolvidos no serviço

  ATFM.

  11.3

  • Identificar as situações em que as aeronaves não devem ser atingidas pelas

  medidas ATFM de controle da demanda de tráfego aéreo.

  • Identificar as situações em que cada tipo de medida ATFM deve ser aplicada.

  11.1 Documento básico - ICA 100-22'
