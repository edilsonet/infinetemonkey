title: Procedimentos para obtenção
text: '10.4.1 Procedimentos para obtenção

  10.4.2. Interpretação. Utilização

  11 Frentes e ciclones

  Objetivos Específicos Subunidades

  11.1

  • Definir frente.

  • Descrever as propriedades gerais das frentes.

  • Explicar a formação e o ciclo de vida de uma frente.

  • Definir depressão frontal, superfície frontal e declive frontal

  • Definir áreas frontogenéticas (ou áreas de frontogênese).

  • Descrever a variação da localização das áreas frontogenéticas

  conforme as diferentes estações do ano.

  • Identificar a influência da área frontogenética nas

  características da frente.

  • Definir áreas frontolíticas (ou áreas de frontólise).

  • Descrever a variação da localização das áreas frontolíticas

  conforme as diferentes estações do ano.

  • Identificar a influência da área frontolítica no processo de

  dissipação da frente.

  11.2

  • Enunciar a origem das frentes frias.

  • Explicar o deslocamento das frentes frias.

  • Citar as características das frentes frias rápidas e das frentes

  frias lentas.

  • Citar os efeitos dos ventos, da temperatura e da pressão

  atmosférica em uma frente fria.

  • Definir linhas isalobáricas (ou isalóbaras).

  • Definir frente polar antártica e frente polar ártica.

  • Definir tempo frontal em uma frente fria.

  11.3

  • Enunciar a origem das frentes quentes.

  • Explicar o deslocamento das frentes quentes.

  • Citar os efeitos dos ventos e da temperatura em uma frente

  quente.

  • Definir tempo frontal em uma frente quente.

  11.4

  • Definir frente estacionária.

  • Citar as características das frentes estacionárias.

  11.5

  • Enunciar a origem das frentes oclusas (ou oclusões).

  • Citar as características de uma oclusão de frente fria e de uma

  oclusão de frente quente.

  11.6

  11.1 Frentes'
