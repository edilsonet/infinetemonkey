text: '11.3.2 Tipos de medidas ATFM

  -- Esperas em voo

  -- Restrição em altitude

  -- Balanceamento na entrada ou saída de TMA

  -- Espera no solo (GS)

  -- Separação por milhas (MIT)

  -- Separação por minutos (MINIT)

  -- Rerroteamento

  -- Programa de sequenciamento

  -- Setorização dinâmica

  12 Fraseologia de tráfego aéreo

  Objetivos específicos Subunidades

  12.1

  • Identificar a finalidade e o âmbito do MCA 100-16.

  12.2

  • Conceituar fraseologia.

  • Identificar os princípios adotados pela OACI, na definição das palavras e

  expressões da fraseologia.

  • Identificar os procedimentos a serem seguidos ao transmitir-se uma

  mensagem.

  • Definir autorização condicional.

  • Identificar a ordem das informações a serem dadas nas autorizações

  condicionais.

  • Identificar as autorizações e instruções relacionadas à segurança,

  transmitidas de forma oral, as quais o piloto em comando deverá cotejar

  (repetir).

  • Identificar as situações em que os idiomas português, inglês e espanhol

  devem ser utilizados.

  • Reconhecer a palavra e a pronúncia utilizadas para cada letra do alfabeto

  fonético.

  • Reconhecer a pronúncia utilizada, em português e inglês, para cada

  algarismo.

  • Reconhecer a pronúncia utilizada, em português e inglês, para cada número

  inteiro ou número decimal.

  • Reconhecer a forma de serem transmitidas as horas, em português e inglês.

  • Reconhecer a forma de serem transmitidas as informações sobre nível de

  voo, velocidade, marcação, rumo e proa, em português e inglês.

  • Reconhecer a forma de serem transmitidas as informações sobre ajuste de

  altímetro, pista em uso e transponder , em português e inglês.

  • Reconhecer a forma de serem transmitidas as informações sobre direção e

  velocidade do vento, em português e inglês.

  • Identificar a escala de clareza que deve ser usada ao se efetuarem testes dos

  equipamentos radiotelefônicos, em português e inglês.

  • Identificar a composição dos indicativos de chamada das aeronaves.

  12.1 Documento básico - MCA 100-16'
