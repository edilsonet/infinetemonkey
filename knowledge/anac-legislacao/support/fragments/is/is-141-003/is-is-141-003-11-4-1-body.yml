title: Definição e características
text: '11.4.1 Definição e características

  13.5 Frentes oclusas (ou oclusões)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  áreas de frontogênese, áreas de frontólise, e aos diferentes

  tipos de frentes.

  • Interpretar as informações meteorológicas concernentes a

  áreas de frontogênese, áreas de frontólise, e aos diferentes

  tipos de frentes.

  • Utilizar as informações meteorológicas concernentes a áreas

  de frontogênese, áreas de frontólise, e aos diferentes tipos de

  frentes.

  11.7

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes das influências dos diferentes tipos de frentes na

  operação de aviões.

  11.8

  • Definir ciclone.

  • Identificar ciclones com diferentes tamanhos, velocidades e

  trajetórias de deslocamento.

  • Citar as diferentes denominações do ciclone.

  • Descrever os processos de formação do ciclone frontal, do

  ciclone térmico, do ciclone orográfico, do ciclone superior e

  do ciclone tropical.

  • Citar as principais categorias de ciclones tropicais conforme a

  velocidade dos ventos.

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  ciclones.

  • Interpretar as informações meteorológicas concernentes a

  ciclones.

  • Utilizar as informações meteorológicas concernentes a

  ciclones.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência de ciclone na operação de aviões.'
