title: Principais componentes do sistema e seu
text: '11.4.3 Principais componentes do sistema e seu

  funcionamento.

  11.5 Sistema de indução do motor aeronáutico

  convencionalData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Citar as características, os principais componentes e a utilização de

  cada um dos tipos de sistema de indução do motor aeronáutico

  convencional.

  • Caracterizar o sistema de aquecimento quanto à finalidade e à

  utilização.

  • Evidenciar a influência da utilização inadequada do sistema de

  aquecimento no funcionamento do motor aeronáutico convencional.

  11.6

  • Caracterizar o sistema de formação de mistura do motor aeronáutico

  convencional quanto à finalidade e à importância.

  • Indicar a relação existente entre cada um dos tipos de mistura ar-

  combustível e o desempenho do motor aeronáutico convencional nas

  diferentes fases de operação.

  • Definir carburação, injeção indireta e injeção direta.

  • Explicar o funcionamento dos carburadores.

  • Citar os principais componentes de cada um dos tipos de carburadores.

  • Caracterizar o corretor altimétrico quanto à finalidade e ao

  funcionamento.

  • Caracterizar o sistema de injeção indireta quanto ao funcionamento e

  aos principais componentes.

  • Caracterizar o sistema de injeção direta quanto aos principais

  componentes e ao funcionamento.

  • Discorrer sobre a utilização dos controles de potência do motor

  aeronáutico convencional.

  • Interpretar as indicações de potência do motor aeronáutico

  convencional.

  11.7

  • Definir alimentação por gravidade e alimentação por pressão.

  • Citar os principais componentes da alimentação por gravidade e da

  alimentação por pressão.

  • Interpretar as indicações do funcionamento do sistema de combustível

  do motor aeronáutico convencional.

  • Caracterizar o Primer quanto à finalidade e ao funcionamento.

  • Discorrer sobre a utilização dos controles do sistema de combustível

  do motor aeronáutico convencional.

  11.8

  • Caracterizar o sistema de ignição do motor aeronáutico convencional

  quanto aos principais componentes e ao funcionamento.

  • Discorrer sobre a utilização dos controles do sistema de ignição do

  motor aeronáutico convencional.

  • Citar a finalidade do cheque de magnetos e as formas de verificação

  do funcionamento do sistema de ignição do motor aeronáutico

  convencional.

  • Citar as prováveis causas do mau funcionamento do sistema de ignição

  do motor aeronáutico convencional.

  • Citar os itens a serem verificados na inspeção pré-voo e na inspeção

  pós-voo do motor convencional do avião.

  • Citar a finalidade de cada um dos controles de potência e de cada uma

  das indicações de potência dos motores aeronáuticos convencionais.

  • Discorrer a respeito da influência exercida sobre o rendimento dos

  motores aeronáuticos convencionais pela pressão atmosférica, pela

  umidade relativa do ar, pela temperatura do ar e pela altitude.'
