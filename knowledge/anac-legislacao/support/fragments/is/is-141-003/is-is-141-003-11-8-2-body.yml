text: '11.8.2 Controles - UtilizaçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  12 Sistema propulsor do avião - motor a reação

  Objetivos específicos Subunidades

  12.1

  • Caracterizar o motor a reação como um motor térmico de combustão

  interna.

  • Citar as características de cada um dos tipos de motores a reação.

  • Enunciar os princípios básicos de funcionamento de um motor a

  reação.

  • Descrever o ciclo de funcionamento de um motor a reação Ciclo de

  Brayton.

  • Definir empuxo (tração).

  • Definir torque.

  • Explicar a aplicação do empuxo e do torque aos motores a reação.

  • Interpretar os diversos tipos de indicações referentes ao empuxo e ao

  torque dos motores a reação.

  • Discorrer a respeito da influência que a pressão atmosférica, a umidade

  relativa do ar, a temperatura do ar e a altitude exercem sobre o

  rendimento dos motores a reação.

  • Identificar a simbologia aplicada aos motores a reação.

  12.2

  • Caracterizar, quanto à finalidade e ao funcionamento, o sistema de

  indução dos motores a reação.

  • Descrever as formas de entrada de ar para os motores a reação.

  • Descrever o funcionamento de cada um dos tipos de proteção de

  ingestão, pelo motor, de partículas abrasivas.

  • Citar as finalidades do compressor de ar dos motores a reação.

  • Diferenciar o compressor centrífugo do compressor axial com relação

  ao funcionamento, aos principais componentes e às demais

  características.

  • Definir instabilidade aerodinâmica do compressor (estol do

  compressor).

  • Citar os meios utilizados para a redução da instabilidade aerodinâmica

  do compressor (estol do compressor).

  • Definir a taxa de compressão dos compressores de ar dos motores a

  reação.

  • Citar os cuidados quanto à prevenção da ingestão de objetos estranhos

  (foreign object damage - FOD) pelo motor.

  • Caracterizar a câmara de combustão quanto à finalidade e ao

  funcionamento.

  • Citar as características de cada um dos tipos de câmara de combustão.

  • Caracterizar o bico injetor de combustível quanto à finalidade e ao

  funcionamento.

  • Caracterizar a vela de ignição quanto à finalidade e ao funcionamento.

  • Caracterizar a turbina quanto à finalidade e ao funcionamento.

  • Citar as características dos diferentes tipos de turbinas.

  • Citar os principais componentes de uma turbina.

  • Caracterizar o duto de descarga quanto à finalidade e ao

  funcionamento.

  • Caracterizar o bocal propulsor quanto à finalidade e ao funcionamento.

  12.1 Noções gerais'
