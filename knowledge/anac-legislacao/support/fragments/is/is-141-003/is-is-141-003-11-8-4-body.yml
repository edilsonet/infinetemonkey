title: Influência de ciclone na operação de aviões. Restrições e
text: '11.8.4 Influência de ciclone na operação de aviões. Restrições e

  riscos para a segurança de voo, em razão de prejuízos à

  integridade do avião e à visibilidade.

  12 Tempestades com descarga elétrica

  Objetivos Específicos Subunidades

  • 12.1

  • Definir descarga elétrica atmosférica, raio, relâmpago, trovão

  e trovoada.

  • 12.2

  • Citar as condições atmosféricas que propiciam as descargas

  elétricas e as trovoadas.

  • Citar as condições atmosféricas que podem estar associadas às

  trovoadas.

  • Citar as características de cada um dos estágios de vida de uma

  trovoada.

  12.3

  • Explicar a formação das trovoadas de massa de ar.

  • Citar as características das trovoadas térmicas (convectivas ou

  termais), das trovoadas orográficas e das trovoadas advectivas

  (ou noturnas).

  • Explicar a formação das trovoadas dinâmicas.

  • Citar as características das trovoadas de frentes frias, das

  trovoadas de frentes quentes, das trovoadas oclusas e das

  trovoadas estacionárias.

  • Definir trovoadas não frontais.

  • Definir tornado e tromba d´água.

  12.1 Conceitos básicos'
