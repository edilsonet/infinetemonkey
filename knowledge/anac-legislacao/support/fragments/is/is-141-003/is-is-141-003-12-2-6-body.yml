text: '12.2.6 Bocal propulsor - Finalidade. FuncionamentoData de emissão: 22 de dezembro de
  2017. IS nº 141-003

  Revisão A

  • Caracterizar o reversor de tração ou empuxo quanto à finalidade e ao

  funcionamento.

  12.3

  • Caracterizar o sistema de lubrificação dos motores a reação quanto à

  finalidade, ao funcionamento e aos principais componentes.

  • Citar as características dos diferentes tipos de lubrificações utilizados

  nos motores a reação.

  • Citar as propriedades dos óleos lubrificantes utilizados nos motores a

  reação.

  • Descrever o processo de controle de temperatura do óleo lubrificante

  dos motores a reação.

  • Caracterizar o sistema de combustível do motor a reação quanto à

  finalidade, ao funcionamento e aos principais componentes.

  • Caracterizar o sistema de partida e de ignição quanto à finalidade, ao

  funcionamento e aos principais componentes.

  • Caracterizar, quanto ao acionamento, cada um dos diferentes tipos de

  motores de partida.

  • Relacionar, às respectivas proteções, as mais comuns limitações

  operacionais do sistema de partida e de ignição dos motores a reação.

  • Discorrer sobre a utilização dos controles do sistema de partida e de

  ignição dos motores a reação.

  • Descrever o ciclo de partida normal dos motores a reação.

  • Definir partida quente (hot start), partida afogada (wet start) e partida

  falsa, enforcada ou estagnada (hung start).

  • Caracterizar o sistema de proteção contra gelo no motor quanto à

  finalidade e ao funcionamento.

  • Identificar os tipos de sistema de proteção contra gelo no motor.

  • Relacionar, às respectivas proteções, as mais comuns limitações

  operacionais do sistema de proteção contra gelo no motor.

  12.4

  • Citar a finalidade de cada um dos tipos de indicações dos motores a

  reação.

  • Citar a finalidade de cada um dos tipos de avisos básicos de mau

  funcionamento dos motores a reação.

  • Discorrer sobre a finalidade e a utilização dos controles de tração e de

  torque dos motores a reação.

  • Citar os itens a serem verificados na inspeção pré-voo e na inspeção

  pós-voo dos motores a reação.'
