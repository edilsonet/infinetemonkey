text: '12.4.2 Controles de tração e de torque -- Finalidade

  13 Hélices de passo variável

  Objetivos específicos Subunidades

  13.1

  • Caracterizar a hélice de passo variável quanto às finalidades, ao

  funcionamento e aos principais componentes.

  • Comparar o desempenho das hélices de passo variável com o

  desempenho dos demais tipos de hélices.

  • Discorrer sobre a utilização dos controles das hélices de passo variável.

  13.2

  • Citar as finalidades do passo bandeira, do passo reverso e do passo chato.

  • Relacionar, às respectivas proteções, as limitações operacionais do

  passo bandeira, do passo reverso e do passo chato.

  13.1 Noções gerais'
