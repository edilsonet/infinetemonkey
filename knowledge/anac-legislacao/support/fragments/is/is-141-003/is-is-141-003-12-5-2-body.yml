text: '12.5.2 Interpretação. Utilização

  13 Tempestades de areia e tempestades de poeira

  Objetivos Específicos Subunidades

  13.1

  • Citar as características das tempestades de areia.

  • Citar os fatores geradores de tempestades de areia.

  • Citar as características das áreas propícias à formação de

  tempestades de areia.

  • Evidenciar a importância da estimativa do alcance de uma

  tempestade de areia.

  13.2

  • Citar as características das tempestades de poeira.

  • Citar os fatores geradores de tempestades de poeira.

  • Citar as características das áreas propícias à formação de

  tempestades de poeira.

  • Evidenciar a importância da estimativa do alcance de uma

  tempestade de poeira.

  13.3

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência de tempestade de areia e de poeira na

  operação de aviões.

  13.4

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  tempestades de areia e tempestades de poeira.

  • Interpretar as informações meteorológicas concernentes a

  tempestades de areia e de poeira.

  • Utilizar as informações meteorológicas concernentes a

  tempestades de areia e de poeira.

  13.1 Tempestades de areia'
