text: '13.4.2 Interpretação. Utilização

  14 Formação de gelo na atmosferaData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Objetivos Específicos Subunidades

  14.1

  • Definir temperatura estática do ar e temperatura total do ar.

  • Identificar as condições propícias para a formação de gelo na

  atmosfera.

  • Identificar os fatores que afetam a intensidade da formação de

  gelo

  14.2

  • Identificar o gelo claro (ou cristal ou liso), o gelo amorfo (ou

  opaco ou escarcha ou granulado) e a geada.

  • Citar os tipos de gelos quanto à intensidade de sua formação.

  • Caracterizar o gelo de massa de ar e o gelo frontal quanto à

  origem.

  14.3

  • Explicar as influências exercidas no acúmulo de gelo em um

  avião pelo tamanho e quantidade de gotículas de água

  presentes no ar, pela temperatura do ar, pelos aspectos externos

  do avião, pelas superfícies expostas do avião e pela velocidade

  do avião.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes do acúmulo de gelo em avião em voo e no solo.

  • Identificar os requisitos regulamentares relativos a operação

  em condições de gelo

  14.4

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  formação de gelo na atmosfera.

  • Interpretar as informações meteorológicas concernentes a

  formação de gelo na atmosfera.

  • Utilizar as informações meteorológicas concernentes a

  formação de gelo na atmosfera.

  14.1 Conceitos básicos'
