text: '13.5.1 Finalidade. Tipos

  14 Instrumentos e dispositivos eletrônicos a bordo do avião

  Objetivos específicos Subunidades

  14.1

  • Identificar os principais instrumentos de dados de voo.

  • Citar as finalidades dos seguintes instrumentos: sistemas pitot e

  estático; altímetro; indicador de velocidade; indicador de número

  Mach; indicador de velocidade vertical (Vertical Speed Indicator -

  VSI); Computador de dados de voo (Air Data Computer - ADC).

  • Descrever o funcionamento dos seguintes instrumentos: sistemas pitot

  e estático; altímetro; indicador de velocidade; indicador de número

  Mach; indicador de velocidade vertical (Vertical Speed Indicator -

  VSI); Computador de dados de voo (Air Data Computer - ADC)

  • Identificar os principais instrumentos giroscópicos.

  • Citar as finalidades do girodirecional, do horizonte artificial e do

  indicador de curva.

  • Descrever o funcionamento do girodirecional, do horizonte artificial e

  do indicador de curva.

  • Descrever o funcionamento da bússola magnética.

  • Descrever o funcionamento do radioaltímetro (radio altimeter).

  • Caracterizar, quanto à finalidade e ao funcionamento, o sistema de

  gerenciamento de voo (Flight Management System - FMS).

  14.2

  • Caracterizar o diretor de voo (flight director) quanto à finalidade, ao

  funcionamento e aos modos operacionais.

  • Caracterizar o piloto automático quanto à finalidade, ao

  funcionamento e aos modos operacionais.

  • Descrever o funcionamento do indicador diretor de atitude (attitude

  director indicator - ADI).

  • Descrever o funcionamento do indicador de situação horizontal

  (horizontal situation indicator - HSI).

  • Caracterizar o transponder quanto à finalidade e ao princípio de

  funcionamento.

  • Citar a finalidade do transmissor localizador de emergência

  (emergency locator transmitter - ELT).

  • Mencionar a existência da possibilidade de remoção do transmissor

  localizador de emergência (emergency locator transmitter - ELT) em

  caso de emergência.

  14.3

  14.1 Instrumentos de voo'
