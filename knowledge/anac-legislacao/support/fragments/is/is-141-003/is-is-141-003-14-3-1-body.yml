text: '14.3.1 Localizador automático de direções (ADF),

  indicador rádio magnético (RMI), rádio farol

  omnidirecional (VOR), equipamento medidor deData de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  • Caracterizar, quanto à finalidade e ao funcionamento, o localizador

  automático de direções (ADF), o indicador rádio magnético (RMI), o

  rádio farol omnidirecional (VOR), o equipamento medidor de

  distância (DME) e o indicador de curso (CI).

  • Citar a finalidade do sistema de pouso por instrumentos (instrument

  landing system - ILS).

  • Explicar o funcionamento do localizador (localizer), da rampa de

  planeio (glide slope) e dos marcadores e balizadores externos, médios

  e internos (marker beacon).

  distância (DME) e indicador de curso (CI) - Finalidade.

  Funcionamento'
