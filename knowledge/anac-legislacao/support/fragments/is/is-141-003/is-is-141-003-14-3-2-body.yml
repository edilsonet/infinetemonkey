title: Sistema de pouso por instrumentos (instrument
text: '14.3.2 Sistema de pouso por instrumentos (instrument

  landing system - ILS): Localizador (localizer), rampa de

  planeio (glide slope), marcadores e balizadores externos,

  médios e internos (marker beacon) - Finalidade.

  Funcionamento

  15 Manutenção da aeronave

  Objetivos específicos Subunidades

  15.1

  • Caracterizar a lista de equipamentos mínimos do avião (MEL) quanto à

  finalidade e à importância.

  • Utilizar a lista de equipamentos mínimos (MEL), deviation dispatch

  procedure guide (DDPG) e configuration deviation list (CDL)

  • Discorrer sobre as responsabilidades do DOV quanto à verificação da

  existência, na biblioteca técnica, da lista de equipamentos mínimos (MEL),

  deviation dispatch procedure guide (DDPG) e configuration deviation list

  (CDL), bem como quanto à verificação da atualização desses documentos.

  • Justificar a importância da aprovação, pela ANAC, da lista de

  equipamentos mínimos do avião (MEL), deviation dispatch procedure

  guide (DDPG) e configuration deviation list (CDL) e de suas revisões.

  15.2

  • Identificar os principais serviços que podem ser realizados por uma

  oficina de manutenção aeronáutica, conforme o(s) padrão(ões), a(s)

  classe(s) e a(s) limitação(ões) referida(s) no respectivo certificado de

  homologação de empresa (CHE).

  • Evidenciar a responsabilidade do piloto com relação à escolha correta

  da oficina de manutenção, quanto tal lhe couber.

  • Evidenciar a importância dos registros nos livros de controle de

  manutenção do avião, pela oficina.

  • Evidenciar a importância dos laudos técnicos dos serviços executados

  pelas oficinas de manutenção aeronáutica.

  15.3

  • Citar a finalidade da inspeção anual de manutenção (IAM).

  • Citar as características da inspeção anual de manutenção (IAM).

  • Citar a finalidade da inspeção progressiva.

  • Citar as características da inspeção progressiva.

  • Identificar os principais documentos gerados pelas inspeções de

  manutenção que acompanham o avião.

  • Discorrer sobre os procedimentos que o DOV deve realizar após tomar

  conhecimento de avaria e/ou discrepância no avião.

  • Justificar a importância da inspeção, por pessoal técnico certificado,

  de avarias e/ou discrepâncias verificadas no avião.

  15.1 Documentos de manutenção da aeronave'
