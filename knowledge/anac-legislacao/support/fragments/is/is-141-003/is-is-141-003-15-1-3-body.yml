text: '15.1.3 Diferentes estados físicos dos materiais expelidos: gasoso,

  líquido, sólido e plasmáticoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  15.2

  • Citar as alterações ocorridas nas condições atmosféricas em

  razão de atividade vulcânica.

  • Identificar os problemas causados às aeronaves pelas cinzas

  vulcânicas.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência exercida na operação de aviões pelas

  alterações atmosféricas originadas por atividade vulcânica.

  15.3

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  atividade vulcânica.

  • Interpretar as informações meteorológicas concernentes a

  atividade vulcânica.

  • Utilizar as informações meteorológicas concernentes a

  atividade vulcânica.'
