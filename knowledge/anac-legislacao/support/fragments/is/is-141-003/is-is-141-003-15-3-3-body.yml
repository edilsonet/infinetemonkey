title: ICAO International Airways Volcano Watch (IAVW) --
text: '15.3.3 ICAO International Airways Volcano Watch (IAVW) --

  Volcanic Ash Advisory Centers (VAACs). ASHTAN

  16 Climatologia geral e tropical

  Objetivos Específicos Subunidades

  16.1

  • Justificar a variação de aquecimento da Terra conforme a

  latitude.

  • Demonstrar s circulação de calor entre equador e polos.

  • Reconhecer as modificações na circulação em função da

  rotação terrestre.

  • Identificar ventos predominantes, sistemas de pressão, frentes

  e tropopausa.

  16.2

  • Reconhecer a influência na modificação das zonas climáticas

  pelos seguintes fatores: intensidade de luz solar e sua variação

  com a latitude; distribuição de terras e águas; ventos

  predominantes; barreiras montanhosas; posição das principais

  áreas de alta e de baixa pressão.

  16.3

  • Levantar informações meteorológicas concernentes a:

  - distribuição de pressão na superfície e correspondente

  padrão de vento

  - posições de zonas frontais principais

  - causa e frequência de falta de visibilidade da superfície

  - variações na temperatura do ar na superfície nas

  camadas altas

  - variações nos ventos superiores

  - frequência e intensidade de precipitação e trovoadas

  - frequência e gravidade das condições favoráveis para

  formação de gelo nas aeronaves

  - frequência e gravidade das condições em que ocorre

  turbulência de céu claro

  16.4

  • Descrever as características climáticas das regiões as quais o

  DOV poderá assumir responsabilidades.

  16.5

  16.1 Circulação geral idealizada (Idealized general

  circulation)'
