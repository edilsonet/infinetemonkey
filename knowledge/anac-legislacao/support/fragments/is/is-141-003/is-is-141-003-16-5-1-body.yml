text: '16.5.1 CaracterísticasData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Identificar as características principais do clima tropical

  • Citar os fenômenos meteorológicos tropicais cíclicos que

  interferem nas condições meteorológicas.

  • Discorrer sobre as interferências exercidas nas condições

  meteorológicas pelos seguintes fenômenos: linhas de

  instabilidade e de cortante, calmarias doldrums, Zona de

  Convergência Intertropical (Intertropical Convergence Zone -

  ITCZ), ondas de leste, inversão dos ventos alíseos, Zona de

  Convergência do Atlântico Sul (ZCAS), monções e fenômeno

  El Niño. e La Niña.

  • Reconhecer os fenômenos meteorológicos tropicais mais

  comuns no Brasil, suas áreas de incidência e períodos do ano

  de maior ocorrência'
