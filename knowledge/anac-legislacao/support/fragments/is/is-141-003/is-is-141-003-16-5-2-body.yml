text: '16.5.2 Fenômenos meteorológicos tropicais cíclicos que

  interferem nas condições meteorológicas: linhas de instabilidade

  e de cortante, calmarias doldrums, Zona de Convergência

  Intertropical (Intertropical Convergence Zone - ITCZ), ondas de

  leste, inversão dos ventos alíseos, Zona de Convergência do

  Atlântico Sul (ZCAS), monções e fenômeno El Niño e La Niña -

  - Principais características. Interferências nas condições

  meteorológicas'
