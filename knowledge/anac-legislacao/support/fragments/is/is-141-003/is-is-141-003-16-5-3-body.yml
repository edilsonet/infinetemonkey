text: '16.5.3 Fenômenos meteorológicos tropicais mais comuns no

  Brasil -- áreas de incidência e períodos do ano de maior

  ocorrência

  17 Aspectos fundamentais relativos a informações meteorológicas

  Objetivos Específicos Subunidades

  17.1

  • Analisar os resultados das observações meteorológicas obtidas

  através de diferentes fontes.

  • Identificar os meios utilizados para busca das informações

  meteorológicas.

  • Justificar a obrigatoriedade de ser informada à estação rádio de

  solo, pelo piloto em voo, sempre que julgar essencial à

  segurança de outros voos, qualquer condição meteorológica

  potencialmente perigosa encontrada em voo.

  • Identificar a validade das informações meteorológicas.

  • Explicar a importância, para a segurança de voo, da

  verificação, pelo DOV, da validade de cada fonte.

  17.2

  • Identificar e citar a finalidade de cada informe meteorológico.

  • Identificar os relatórios de meteorologia aeronáutica e

  descrever a sua decodificação e interpretação.

  17.3

  • Identificar as formas de apresentação do METAR.

  • Interpretar e utilizar os códigos METAR.

  17.4

  • Associar as informações meteorológicas obtidas de diversas

  fontes com os dados observados em cartas meteorológicas, a

  fim de obter uma visão tridimensional do tempo.

  17.5

  • Levantar informações meteorológicas atualizadas, produzidas

  pelos órgãos oficiais brasileiros e internacionais.

  • Identificar e interpretar todos os tipos de previsões

  meteorológicas aeronáuticas, a fim de elaborar o planejamento

  de voo.

  17.6

  • Citar a finalidade do apronto meteorológico de voo.

  • Evidenciar a importância do apronto meteorológico para a

  segurança, a economia e a eficiência do voo.

  • Elaborar apronto meteorológico de voo visual e por

  instrumentos.

  17.1 Observações meteorológicas'
