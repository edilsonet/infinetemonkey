title: Previsões meteorológicas -- Utilização
text: '17.5.3 Previsões meteorológicas -- Utilização

  -- para a decolagem: necessárias para planejar peso máximo de

  decolagem permitido e outros parâmetros mínimos de operação

  -- previsões do tempo em rota: necessárias para planejamento de

  voo, pelo menos, duas horas antes. Cartas SIGWX. Informações

  SIGMET, em particular as relacionados com ciclones tropicais e

  cinzas vulcânicas. Questões específicas relacionadas com ETOPS

  -- previsões para pouso no destino / alternativo: alternativas em

  rota; METAR ou SPECI; TAF'
