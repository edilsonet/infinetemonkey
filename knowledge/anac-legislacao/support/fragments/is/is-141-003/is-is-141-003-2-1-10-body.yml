text: '2.1.10 Dispositivos eletrônicos portáteisData de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  • Resumir os requisitos de navegação do espaço aéreo NAT-

  MNPS.

  • Especificar níveis de cruzeiro apropriados para voos normais

  IFR de longo alcance e para quem opera na estrutura da via

  operacional do Atlântico Norte.

  2.3

  • Explicar o significado do termo espaço aéreo com separação

  vertical mínima reduzida (RVSM).

  • Explicar o significado do termo envelope de voo RVSM.

  • Resumir os requisitos de operações RVSM.

  2.2 Apêndice C - Operações no espaço aéreo sobre o Atlântico

  Norte denominado "NAT-MNPS"'
