text: '2.1.2 Definições e padrões de nomenclaturaData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Ler, identificar e interpretar os itens da MEL (Minimum

  Equipment List) das aeronaves típicas com as quais um DOV

  trabalha.

  2.2

  • Utilizar a lista de equipamentos mínimos (MEL) da aeronave

  durante o planejamento de voo.

  • Descrever as ações a serem tomadas pelo DOV em casos de

  componentes e sistemas inoperantes.

  • Descrever os procedimentos e itens da MEL que requerem

  ações da tripulação, da manutenção, ou de ambos.

  2.2 Uso da MEL'
