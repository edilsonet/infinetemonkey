text: '2.1.3 Distribuição do peso e as forças que produzem flexão na estrutura

  da aeronave (bending moments)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  2.2

  • Definir os termos: velocidade indicada, velocidade

  calibrada, velocidade equivalente, velocidade aerodinâmica

  ou verdadeira, velocidade em relação ao solo, número Mach

  e velocidade de estol.

  • Identificar as limitações de velocidades máximas para flap,

  trem de pouso e outras.'
