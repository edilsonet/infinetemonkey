title: Participação do despachante operacional de voo na
text: '2.1.4 Participação do despachante operacional de voo na

  segurança operacional: conhecimento do conteúdo do MGO da

  empresa, cumprimento das diretrizes contidas no MGO e

  fornecimento de informações sobre anormalidades observadas

  3 Prevenção e investigação de acidentes aeronáuticos

  Objetivos Específicos Subunidades

  4.1

  • Descrever a Filosofia SIPAER.

  • Descrever o Código de Ética SIPAER.

  • Descrever a estrutura e atribuições dos elementos constitutivos

  do SIPAER.

  4.2

  • Identificar as principais normas e recomendações do Programa

  de Prevenção de Acidentes Aeronáuticos - PPAA.

  4.3

  • Identificar as principais normas e recomendações das

  publicações do CENIPA referentes à gestão da segurança de voo

  e ao Plano de Emergência Aeronáutica em Aeródromo.

  • Identificar as principais normas e recomendações contidas na

  publicação do CENIPA referente aos protocolos de investigação

  de ocorrências aeronáuticas da aviação civil conduzidas pelo

  Estado Brasileiro.

  • Explicar o conteúdo e a forma de divulgação das

  Recomendações de Segurança Operacional emitidas pelo

  SIPAER.

  • Explicar a responsabilidade dos operadores de aeronaves em

  caso de acidente e incidente aeronáutico e ocorrência de solo.

  • Explicar de que forma são realizadas a notificação e a

  confirmação de ocorrências no âmbito do SIPAER.

  4.1 Sistema de Investigação e Prevenção de Acidentes

  Aeronáuticos - SIPAER'
