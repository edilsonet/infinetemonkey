title: 'Verifica, nos aeródromos de destino e alternativa:'
text: '2.1.8 Verifica, nos aeródromos de destino e alternativa:

  - a compatibilidade da aeronave com as características de pista;

  - os auxílios de navegação e comunicação providos aos operadores;

  - a disponibilidade de combustível adequado para reabastecimento;

  - identificação e informações do aeródromo (localização, contatos e facilidades);

  - condições meteorológicas (VMC ou IMC);

  - condições operacionais;

  - obstáculos existentes'
