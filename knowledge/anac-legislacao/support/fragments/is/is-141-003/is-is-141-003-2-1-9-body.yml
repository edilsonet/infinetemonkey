text: '2.1.9 Classe 9 - Substâncias diversasData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  3 Responsabilidades do operador

  Objetivos específicos Subunidades

  3.1

  • Apontar as responsabilidades do operador (empresa aérea)

  relacionadas a artigos perigosos.

  • Identificar as formas pelas quais os artigos perigosos devem ser

  armazenados e carregados para que substâncias incompatíveis sejam

  mantidas à parte e de forma que haja distâncias de separação corretas

  entre artigos perigosos, seres humanos e animais.

  • Justificar a necessidade de inspeção dos volumes contendo artigos

  perigosos quanto a sinais de danos ou vazamento antes do

  carregamento.

  3.2

  • Enfatizar a importância da rotulagem correta e manuseio de artigos

  perigosos, bem como a importância do briefing da tripulação relativo

  a artigos perigosos e de qualquer outra carga especial em um

  determinado voo.

  • Justificar a necessidade de, antes da partida, serem fornecidas ao piloto

  em comando as informações necessárias sobre quaisquer artigos

  perigosos a bordo.

  3.3

  • Justificar a necessidade de os relatórios de incidentes envolvendo

  artigos perigosos serem preparados imediatamente.

