text: '2.2.1 Perguntas aos passageirosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever a assistência que cada Estado contratante deve fornecer a

  uma aeronave submetida a um ato de interferência ilícita.

  • Explicar as circunstâncias que podem impedir um Estado de deter

  uma aeronave no solo depois de ser submetida a um ato de

  interferência ilícita.

  • Explicar em que mais fontes de informações relativas à segurança

  da aviação além do Anexo 17 da OACI, estão disponíveis para fazer

  frente a situações em que a interferência ilícita ocorre a uma

  aeronave.

  2.2

  • Citar os objetos não permitidos a bordo de uma aeronave envolvida

  em aviação civil internacional, por razões de segurança da aviação.

  • Descrever os procedimentos para evitar que objetos não permitidos

  sejam introduzidos a bordo de uma aeronave envolvida em voo

  internacional.

  2.3

  • Justificar os procedimentos adotados por autoridades aeroportuárias

  relativas ao controle de itens vendidos em lojas duty-free, à

  vigilância dos limites de lado ar/lado terra, aos controles para o

  manuseio de bagagem, carga, correio, etc e à segurança de serviços

  de catering.

  2.4

  • Descrever o que o piloto em comando deve fazer caso a aeronave

  deva se afastar da pista ou nível de cruzeiro atribuído.

  • Explicar os procedimentos que o piloto em comando deve utilizar

  no que diz respeito a transmitir avisos e a responder a contingências

  em voo.

  • Descrever os procedimentos especiais referentes às portas do

  compartimento da tripulação de voo no que diz respeito à segurança

  da aviação.

  • Explicar o que o operador deve fazer para minimizar as

  consequências de atos de interferência ilícita.

  • Explicar o que o operador deve fazer para treinar funcionários que

  possam contribuir para a prevenção de atos de sabotagem ou de

  outras formas de interferência ilícita.'
