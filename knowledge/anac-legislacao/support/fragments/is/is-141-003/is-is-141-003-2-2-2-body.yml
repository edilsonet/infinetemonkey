title: 'Definições:'
text: '2.2.2 Definições:

  - velocidade máxima de mergulho (design diving speed - VD)

  - velocidade máxima de operação (maximum operating limit speed -

  VMO)

  - velocidade normal de operação (normal operating speed)

  - velocidade máxima de flapes estendidos (maximum flap extended

  speed - VFE )

  - velocidade máxima de operação de trem de pouso

  estendendo/recolhendo (maximum landing gear extended speed- VLE)

  - velocidade máxima de operação de trem de pouso estendido (means

  maximum landing gear operating speed- VLO)

  3 Performance de decolagem

  Objetivos Específicos Subunidades

  3.1

  • Definir os termos clearway (CWY) e stopway (STW).

  • Definir os termos Take-off Run Available (TORA), Take-off

  Distance Available (TODA), Accelerate Stop Distance

  Available (ASDA).

  • Definir pista balanceada e pista não balanceada.

  • Listar e explicar as velocidades de decolagem.

  • Definir motor crítico.

  • Explicar o efeito do motor crítico inoperante sobre a potência

  necessária e o arrasto total da aeronave.

  • Explicar o efeito de falha do motor na controlabilidade da

  aeronave sob determinadas condições.

  3.2

  • Explicar os efeitos das seguintes variáveis da pista (RWY)

  sobre distâncias de decolagem: comprimento da pista

  utilizável, elevação, inclinação e condições da superfície

  (seca, molhada ou contaminada).

  • Explicar os efeitos das seguintes variáveis das aeronaves nas

  distâncias de decolagem: peso e configuração de decolagem.

  • Explicar os efeitos das seguintes variáveis meteorológicas

  sobre as distâncias de decolagem: vento, temperatura e

  altitude de pressão.

  • Explicar o efeito de condições da pista na distância de

  decolagem.

  • Explicar as distâncias de decolagem para condições

  específicas e de configuração para todos os motores

  operacionais ou para um motor inoperante.

  3.3

  • Definir as seguintes distâncias:

