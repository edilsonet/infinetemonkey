text: '2.2.3 Ilusões perceptivas - Conceitos básicosData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Explicar a base do processo de percepção.

  • Descrever o mecanismo do processo de percepção.

  • Descrever a subjetividade da percepção e indicar os fatores relevantes

  que influenciam a interpretação da informação percebida.

  • Descrever algumas ilusões perceptivas básicas.

  • Ilustrar alguns conceitos básicos de percepção.

  • Dar exemplos de como a percepção desempenha um papel decisivo na

  segurança de voo.

  • Ressaltar como uma percepção equivocada pode manifestar-se de

  forma persuasiva e convincente, tanto em um indivíduo como em um

  grupo.

  2.3

  • Definir cada um dos tipos de memória estudados.

  • Explicar a relação existente entre os tipos de memória.

  • Descrever as diferenças entre os tipos de memória em termos de tempo

  e de capacidade de retenção.

  • Justificar a importância de memórias sensoriais no processamento de

  informações.

  • Indique o número médio máximo de itens separados que podem ser

  retidos na memória de curto prazo.

  • Explicar como uma interrupção pode afetar a memória de curto prazo.

  • Dar exemplos de itens que são importantes para o DOV para manter

  na memória de curto prazo durante o desempenho de sua atividade.

  • Descrever como a capacidade de armazenamento da memória de curto

  prazo pode ser aumentada.

  • Identificar e descrever as subdivisões da memória de longo prazo e

  dar exemplos de seu conteúdo.

  • Identificar os fatores que possam afetar a memória de longo prazo.

  • Explicar que as habilidades são mantidas principalmente na memória

  de longo prazo.

  • Explicar as seguintes fases relacionadas à aquisição de comportamento

  automatizado: fase cognitiva; fase associativa e fase automática.

  • Discutir formas de facilitar a memorização de informações com o uso

  de mnemônicos, de associação e de treinamento mental.

  2.4

  • Definir o termo "aprendizagem".

  • Diferenciar os seguintes tipos básicos de aprendizagem: clássico e

  condicionamento operante; aprendizagem por insight e aprendizagem

  por imitação.

  • Listar fatores que são necessários para promover a qualidade da

  aprendizagem.

  • Descrever as vantagens do planejamento e antecipação de ações

  futuras.

  • Definir o termo ''habilidades''.

  • Identificar as fases de aprendizagem de uma habilidade

  (ANDERSON).

  2.5

  • Definir motivação.

  • Explicar as influências dos diferentes níveis de motivação no

  desempenho humano, considerando a dificuldade das tarefas.'
