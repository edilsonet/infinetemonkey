title: Uso problemático de substâncias
text: '2.2.7 Uso problemático de substâncias

  psicoativasData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Justificar a necessidade da constante vigilância exercida pela tripulação a bordo

  das aeronaves, sejam quais forem as regras de voo ou a classe do espaço aéreo

  na qual a aeronave está operando e, ainda, quando operando na área de

  movimento de um aeródromo.

  • Explicar a necessidade de limitação de proximidade entre uma aeronave e outra

  e as regras para o direito de passagem, incluindo os procedimentos de posições

  de taxi e de espera em área de manobras de um aeródromo.

  • Identificar os procedimentos a serem adotados por uma aeronave que tenha o

  direito de passagem e pela aeronave que esteja obrigada pelas regras a manter-

  se fora da trajetória da outra.

  • Identificar os procedimentos constantes nos regulamentos da ANAC e na ICA

  100-12 relacionados com as luzes que devem ser exibidas pelas aeronaves.

  • Descrever o significado de sinais de luz exibidos por e para uma aeronave.

  • Identificar as situações nas quais seja permitido aos pilotos reduzirem a

  intensidade ou apagarem as luzes a bordo.

  • Identificar as regras básicas para operações de aeronaves em aeródromos ou em

  suas imediações.

  • Identificar as condições estabelecidas pelas regras para a obrigatoriedade de

  apresentação do plano de voo.

  • Identificar as condições estabelecidas pelas regras para a dispensa de

  apresentação do plano de voo.

  • Descrever o conteúdo de um plano de voo.

  • Descrever as possíveis razões para alterações do plano de voo.

  • Identificar as regras estabelecidas para o encerramento do plano de voo.

  • Identificar as regras estabelecidas para o fornecimento, a observação e a

  recepção dos sinais descritos no Anexo A da ICA 100-12.

  • Diferenciar sinais de socorro de sinais de urgência.

  • Descrever o tempo padrão usado na aviação.

  • Estabelecer para que tipos de voos deve ser obtida uma autorização de órgão

  ATC.

  • Descrever como um piloto pode solicitar uma autorização de órgão ATC.

  • Descrever as medidas a serem tomadas se uma autorização de órgão ATC não

  for satisfatória para um piloto em comando.

  • Justificar a necessidade de solicitar ao órgão ATC a modificação de um plano de

  voo em vigor.

  • Descrever as possíveis razões para a não observância a um plano de voo em

  vigor.

  • Descrever os desvios de voo pertinentes que devem ser comunicados ao órgão

  ATS apropriado.

  • Descrever as ações que devem ser realizadas em caso de mudanças inadvertidas

  no plano de voo.

  • Descrever as ações que devem ser realizadas em caso de mudanças intencionais

  no plano de voo.

  • Descrever as ações que devem ser realizadas quando se tornar evidente não ser

  exequível o voo em VMC, de acordo com o plano de voo em vigor.

  • Descrever as disposições a respeito das comunicações entre uma aeronave e o

  órgão ATC.

  • Descrever as medidas necessárias quando há falha de comunicação em uma

  aeronave.

  • Descrever as regras para transmissão de um relatório de posição para o órgão

  ATS apropriado, incluindo o tempo de transmissão e o conteúdo normal da

  mensagem.

  2.3 Regras gerais'
