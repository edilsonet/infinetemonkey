title: Operações RVSM
text: '2.3.2 Operações RVSM

  3 Certificação: operadores regulares e não-regulares - RBAC 119

  Objetivos Específicos Subunidades

  3.1

  • Explicar o significado dos seguintes termos: i) operação

  cargueira; ii) operação complementar; iii) operação de bandeira;

  iv) operação doméstica; v) operação por demanda; e vi) operação

  suplementar.

  • Caracterizar os operadores aéreos regulares e os não regulares.

  • Explicar as condições para uma pessoa obter um Certificado de

  Empresa de Transporte Aéreo (Certificado ETA).

  • Explicar o significado de uma autorização concedida a um

  detentor de um Certificado ETA.

  • Explicar o significado de especificações operativas (EO).

  • Explicar o significado de Manual Geral de Operações (MGO).

  • Explicar as condições para utilização do nome comercial de um

  operador aéreo.

  3.2

  • Associar as operações domésticas, de bandeira e suplementares

  aos requisitos do RBAC 121.

  • Associar as operações complementares e por demanda aos

  requisitos do RBAC 135.

  3.3

  • Identificar a aplicabilidade da Subparte C do RBAC 119.

  • Listar os requisitos gerais para a operação de transporte aéreo

  público de passageiros ou de cargas e/ou malas postais, segundo o

  RBAC 121 ou 135.

  • Definir o termo “voo de avaliação operacional”.

  • Explicar os requisitos relativos a demonstrações necessárias para

  o requerente de um Certificado ETA ou para o requerente de

  especificações operativas autorizando uma nova espécie de

  operação.

  • Citar as condições necessárias para a ANAC emitir a carta de

  autorização (Letter of Authorization - LOA) para um operador

  aéreo.

  • Listar as informações que devem constar no Certificado ETA.

  • Citar as condições para emissão, renovação ou indeferimento de

  um certificado ETA.

  • Citar as condições para um certificado ETA ser considerado

  válido.

  • Citar as condições para emendas em um certificado ETA.

  • Reconhecer as obrigações do detentor de certificado em relação às

  suas especificações operativas.

  • Descrever o conteúdo de uma especificação operativa

  • Citar as condições para emendas em uma EO e o prazo para uma

  emenda entrar em vigor.

  3.1 Subparte A - Geral'
