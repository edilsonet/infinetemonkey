text: '2.3.3 Limitações operacionais mais comuns e respectivas

  proteçõesData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Discorrer sobre a utilização do controle dos spoilers.

  • Relacionar, às respectivas proteções, as mais comuns limitações

  operacionais da atuação dos spoilers.

  3 Sistema de trem de pouso do avião

  Objetivos específicos Subunidades

  3.1

  • Caracterizar o sistema antiskid quanto à finalidade e ao

  funcionamento.

  • Relacionar, às restrições correspondentes, as mais comuns limitações

  operacionais da atuação do sistema antiskid.

  • Descrever os procedimentos a serem executados pelo DOV com

  relação às correções inerentes ao sistema antiskid.

  • Caracterizar o sistema de freio automático quanto à finalidade e ao

  funcionamento.

  • Relacionar, às restrições correspondentes, as mais comuns limitações

  operacionais da atuação do sistema de freio automático.

  • Discorrer sobre a utilização do controle do sistema de freio automático.

  3.2

  • Relacionar, às restrições correspondentes, as mais comuns limitações

  operacionais da atuação do sistema de trem de pouso.

  3.1 Freios'
