  3 Compreensão auditiva

  Objetivos Específicos Subunidades

  • Escutar fraseologia padrão OACI narrada em língua

  inglesa.

  • Identificar fraseologia padrão OACI narrada em

  língua inglesa.

  • Reconhecer fraseologia padrão OACI narrada em

  língua inglesa.

  • Escutar áudios em língua inglesa referentes a níveis

