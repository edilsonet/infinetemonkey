  altímetro, pista em uso, transponder, direção do

  vento, NOTAM, SNOWTAM e ASHTAM e fixos

  de aproximação.

  • Identificar informações presentes em áudios em

  língua inglesa referentes a níveis de voo, horários,

  velocidades, rumo e proa, altímetro, pista em uso,

  3.1 Alfabeto fonético da OACI (ICAO Phonetic alphabet)

  3.2 Números em inglês, de acordo com a padronização da OACI

  (Numbers)'
