title: Mínimos de visibilidade e de distância de
text: '2.3.9 Mínimos de visibilidade e de distância de

  nuvens em VMC - Tabela 2 da ICA 100-12Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever os procedimentos pelos quais uma aeronave sendo objeto de

  interferência ilícita deve informar ao órgão ATS apropriado.

  • Descrever os procedimentos relativos a interceptações de aeronaves civis.

  • Listar as possíveis razões para interceptar uma aeronave civil além de determinar

  a sua identidade.

  • Identificar a reação primária esperada de uma aeronave interceptada.

  • Reconhecer os limites de velocidade estabelecidos de acordo com os mínimos

  de visibilidade e de distância de nuvens em VMC e com as classes de espaço

  aéreo, de acordo com a Tabela 2 da ICA 100-12 .

  • Descrever as informações a serem transmitidas imediatamente pelo piloto ao

  órgão ATS tão logo a tripulação de uma aeronave em rota identifique, a bordo,

  um ou vários casos suspeitos de doença transmissível, ou outro risco à saúde

  pública.

  2.4

  • Listar as condições mínimas necessárias para um voo visual.

  • Identificar os níveis mínimos a serem respeitados em voo VFR para a rota a ser

  voada.

  • Citar as condições necessárias para a mudança de voo VFR para voo IFR.

  • Reconhecer a obrigatoriedade de notificação, ao órgão ATS, de mudança de voo

  VFR para IFR.

  • Discorrer sobre as condições necessárias para a realização de voos IFR no

  período diurno.

  • Discorrer sobre as condições necessárias para a realização de voos IFR no

  período noturno.

  2.5

  • Citar as regras de voo por instrumentos relacionadas a equipamentos das

  aeronaves.

  • Identificar os níveis mínimos a serem respeitados em voo IFR para a rota a ser

  voada.

  • Selecionar o nível de voo VFR ou IFR com a utilização da tabela de níveis de

  cruzeiro.

  • Citar as condições necessárias para a mudança de voo IFR para voo VFR.

  • Reconhecer a obrigatoriedade de notificação, ao órgão ATS, de mudança de voo

  IFR para VFR.

  • Citar a regra relativa a notificação de posição aplicável aos voos IFR efetuados

  fora do espaço aéreo controlado.

  • Discorrer sobre as condições necessárias para a realização de voos IFR no

  período diurno.

  • Discorrer sobre as condições necessárias para a realização de voos IFR no

  período noturno.

  • Calcular a autonomia mínima requerida para voo IFR de avião.'
