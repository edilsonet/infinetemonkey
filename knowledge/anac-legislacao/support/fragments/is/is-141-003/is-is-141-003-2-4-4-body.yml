title: 'Disposições relativas ao direito de propriedade quanto a:'
text: '2.4.4 Disposições relativas ao direito de propriedade quanto a:

  sobrevoo, pouso de emergência ou pouso forçado, lançamento de

  coisas e alijamento

  3 Aeronave

  Objetivos específicos Subunidades

  3.1

  • Definir aeróstato e descrever seus princípios de

  funcionamento.

  • Definir aeródino e descrever seus princípios de

  funcionamento.

  • Citar tipos de aeródinos e de aeróstatos.

  • Definir aeronave de acordo com o conceito jurídico.

  3.2

  • Definir aeronaves civis e aeronaves militares de acordo

  com o conceito jurídico.

  • Definir aeronaves públicas e aeronaves privadas de acordo

  com o conceito jurídico.

  • Classificar as aeronaves, conforme a legislação de

  certificação de produto em vigor.

  3.3

  • Citar as funções do Registro Aeronáutico Brasileiro

  (RAB).

  • Citar os meios através dos quais se adquire a propriedade

  de uma aeronave.

  • Citar os meios através dos quais de perde a propriedade de

  uma aeronave.

  • Identificar a nacionalidade de uma aeronave em função do

  Estado em que está matriculada.

  • Identificar uma aeronave brasileira pelas marcas de

  nacionalidade e de matrícula.

  • Citar a finalidade do Certificado de Matrícula e

  Nacionalidade.

  • Citar a finalidade do Certificado de Aeronavegabilidade.

  3.4

  • Citar os requisitos para que uma aeronave possa voar no

  espaço aéreo brasileiro, aterrissar no território subjacente

  ou dele decolar.

  • Citar os requisitos para que uma aeronave possa entrar e

  sair do espaço aéreo brasileiro.

  3.5

  • Definir proprietário de aeronave e operador ou explorador

  segundo o conceito jurídico.

  • Descrever as formas de se adquirir propriedade de

  aeronave, segundo o CBA.

  • Descrever as formas de operar uma aeronave, segundo o

  CBA.

  3.1 Definições de aeronave'
