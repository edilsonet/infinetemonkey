title: Mudança de QDM e mudança de QDR -- Finalidade
text: '2.4.9 Mudança de QDM e mudança de QDR -- Finalidade

  3 Radionavegação por VOR/DME

  Objetivos Específicos Subunidades

  3.1

  • Definir VHF (Very High Frequency).

  • Citar as características de cada uma das faixas em que se

  subdivide a VHF.

  3.2

  • Definir Radio Farol Omnidirecional (VOR).

  • Explicar o funcionamento do Radio Farol

  Omnidirecional (VOR).

  • Identificar o transmissor VOR a partir de representação

  gráfica e sinais sonoros.

  • Identificar a finalidade do Indicador Radiomagnético

  (RMI).

  • Definir Indicador de Situação Horizontal (HSI).

  • Identificar as características do Indicador de Situação

  Horizontal (HSI).

  • Citar a finalidade do Indicador de Situação Horizontal

  (HSI).

  • Listar as vantagens da utilização do VOR sobre o NDB.

  3.3

  • Definir arco DME.

  • Identificar o símbolo que representa o DME nas cartas

  aeronáuticas.

  • Explicar o funcionamento do DME.

  • Indicar o alcance e a precisão do DME.

  • Identificar o equipamento DME instalado nas aeronaves.

  3.4

  • Definir radial.

  3.1 VHF (Very High Frequency)'
