text: '2.5.14 Apresenta o plano de voo ao órgão ATS.

  3

  Ações pré e pós-voo

  Descrição: Conhecimentos e habilidades para obter informações e autorizações necessárias,
  garantir o

  cumprimento dos requisitos e executar funções antes e após o voo para garantir que a aeronave
  se encontra

  em condições de voo e de acordo com os requisitos de segurança.

  3.1 Prepara a documentação de despacho da aeronave'
