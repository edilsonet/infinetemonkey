text: '2.5.2 Utiliza gráficos de desempenho de aeronaves, tabelas, gráficos ou outros dados
  relativos a itens como:

  - distâncias de aceleração e de parada;

  - desempenho de decolagem, subida, e teto de serviço com todos os motores, e com motor(s)

  inoperante(s);

  - desempenho de cruzeiro, de descida e de pouso;

  - consumo, alcance e reserva de combustível;

  - aproximações perdidas;

  - procedimentos de espera; e

  - drift down.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
