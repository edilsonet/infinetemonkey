text: '2.5.4.2 Período noturno

  3 Serviços de Tráfego Aéreo - ATS

  Objetivos específicos Subunidades

  3.1

  • Identificar a ICA 100-37 como a publicação que tem por finalidade

  regulamentar, no Brasil, os Serviços de Tráfego Aéreo previstos no Anexo 11 à

  Convenção de Aviação Civil Internacional e no Documento 4444,

  Gerenciamento de Tráfego Aéreo, da OACI.

  • Identificar as abreviaturas utilizadas na ICA 100-37.

  • Definir os termos relacionados a tráfego aéreo listados na ICA 100-37.

  3.2

  3.1 Documento normativo: ICA 100-37'
