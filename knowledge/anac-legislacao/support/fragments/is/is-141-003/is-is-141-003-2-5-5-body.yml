text: '2.5.5 Excesso de motivaçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar o “Modelo de Necessidades Humanas" de Maslow e sua

  relação com a aviação.

  • Descrever e enumerar exemplos de motivadores fisiológicos e

  psicológicos.

  • Explicar as influências dos diferentes níveis de motivação sobre o

  desempenho e os efeitos na execução da tarefa.

  • Explicar a relação entre motivação e aprendizagem.

  • Explicar os problemas de excesso de motivação, em particular no

  contexto da extrema necessidade de realização.

  2.6

  • Explicar as vantagens de comunicação bilateral, em oposição à

  comunicação unilateral.

  • Distinguir entre a comunicação verbal e não-verbal.

  • Nomear as funções de comunicação não-verbal.

  • Descrever os aspectos gerais da comunicação não-verbal.

  • Descrever as vantagens e desvantagens da comunicação implícita e da

  explícita.

  • Indicar os atributos e possíveis problemas do uso de linguagem

  ''profissional''.

  • Nomear e explicar os principais obstáculos para uma comunicação

  eficaz.

  • Dar exemplos de acidentes aeronáuticos decorrentes de falhas de

  comunicações.

  2.7

  • Explicar a diferença entre o conflito intra e interpessoal.

  • Listar consequências típicas de conflitos entre os membros de um

  ambiente operacional.

  • Explicar os seguintes termos como parte da prática de comunicação

  em relação à prevenção ou resolução de conflitos: questionamento;

  escuta ativa; advocacia; comentários; metacomunicação e negociação.

  2.6 Comunicação'
