title: Umidade relativa do ar e umidade absoluta do ar --
text: '2.5.6 Umidade relativa do ar e umidade absoluta do ar --

  Definições. Mensuração. Influência no desempenho do voo

  3 Pressão atmosférica

  Objetivos Específicos Subunidades

  3.1

  • Definir pressão atmosférica.

  3.2

  • Identificar as unidades de medida da pressão atmosférica e

  seus respectivos símbolos.

  • Citar as finalidades do barômetro e do barógrafo.

  • Identificar cada um dos tipos de barômetros.

  • Identificar o barógrafo.

  3.3

  • Definir cartas sinóticas e horários sinóticos.

  • Identificar como distribuições de pressão são mostrados em

  gráficos meteorológicos.

  • Definir linhas isóbaras.

  • Identificar as mudanças de pressão na superfície terrestre, em

  função das variações diurna e sinótica.

  3.4

  • Identificar variações horizontais e verticais na pressão

  atmosférica.

  • Relacionar as variações da pressão atmosférica com a

  temperatura, a densidade e a umidade do ar; o período do dia,

  a altitude, a latitude e as condições meteorológicas.

  • Explicar a influência das variações da pressão atmosférica no

  rendimento aerodinâmico de uma aeronave.

  3.5

  • Definir sistema de pressão atmosférica (sistema bárico), centro

  de alta pressão atmosférica (anticiclone), centro de baixa

  pressão atmosférica (ciclone), cavado de pressão e crista ou

  cunha de pressão.

  • Explicar as influências exercidas nas condições de voo pelo

  centro de alta pressão atmosférica (anticiclone), pelo centro de

  baixa pressão atmosférica (ciclone), pelo cavado de pressão e

  pela crista ou cunha de pressão.

  3.6

  • Definir altimetria.

  • Caracterizar o altímetro quanto à finalidade e à constituição.

  • Identificar as graduações e os ajustes do altímetro.

  • Aplicar o conceito de gradiente de pressão.

  • Diferenciar altitude real e altitude padrão.

  • Definir altitude, altura, nível de voo, elevação, elevação do

  aeródromo, altitude de pressão indicada, altitude de pressão

  calibrada (ou básica), altitude indicada, altitude calibrada,

  altitude densidade, altitude absoluta e altitude verdadeira.

  • Citar as aplicações da altitude, da altura, do nível de voo, da

  elevação, da elevação do aeródromo, da altitude de pressão

  indicada, da altitude de pressão calibrada (ou básica), da

  altitude indicada, da altitude calibrada, da altitude densidade,

  da altitude absoluta e da altitude verdadeira.

  3.1 Definição

  3.2 Medição da pressão atmosférica'
