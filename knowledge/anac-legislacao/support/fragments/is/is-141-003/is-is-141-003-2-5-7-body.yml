text: '2.5.7 Demonstra e aplica, usando a terminologia correta, o conhecimento dos sistemas
  da aeronave relacionados

  a:

  - comandos de voo;

  - piloto automático;

  - sistema hidráulico;

  - sistema elétrico;

  - ar condicionado e pressurização;

  - proteção contra chuva e gelo;

  - aviônicos, comunicação e navegação;

  - motores e unidades de potência auxiliares;

  - sistema de combustível;

  - sistema de óleo;

  - trem de pouso e freios;

  - emergências e procedimentos anormais; e

  - Lista de Equipamento Mínimo (MEL) / lista de desvios de configuração (CDL).'
