text: '2.6.3 Sistema CNS/ATM (Comunications, navigation and

  survellance/Air traffic management) - FinalidadeData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Explicar a finalidade do Sistema CNS/ATM.

  • Explicar a finalidade da Rede ATN.

  2.7

  • Identificar os equipamentos utilizados para os serviços de

  radionavegação.

  • Identificar os princípios de funcionamento e a utilização dos

  radares primário e secundário.

  • Identificar os objetivos operacionais dos equipamentos CAT

  I, CAT II e CAT III.

  • Explicar os princípios gerais de funcionamento do ILS, do

  MLS, do VOR/DME, do NDB e do ADF.

  • Descrever os equipamentos de bordo e o equipamento ILS

  terrestre.

  • Explicar como é realizada a aproximação controlada pelo

  solo.

  • Explicar as características e a utilização do NDB.

  • Explicar os princípios gerais de funcionamento do radiofarol

  direcional e das radiobalizas.'
