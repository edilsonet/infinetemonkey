title: Radiobalizas - Princípios gerais. Cobertura
text: '2.7.10 Radiobalizas - Princípios gerais. Cobertura

  3 Transmissão de Mensagens

  Objetivos Específicos Subunidades

  3.1

  • Nomear as letras do alfabeto fonético usado em

  radiotelefonia.

  • Identificar as situações em que as palavras devem ser

  soletradas.

  • Descrever o método de transmissão de números.

  • Descrever as formas de transmissão de horas.

  • Identificar a fraseologia correta, de acordo com o MCA 100-

  16.

  • Identificar as abreviaturas mais comuns utilizadas pelos

  serviços de controle do espaço aéreo.

  • Definir os grupos do código Q comumente usados em

  radiotelefonia nas comunicações aeroterrestres.

  3.2

  • Identificar técnicas e procedimentos para transmissão de

  mensagens de radiotelefonia.

  • Explicar as técnicas utilizadas para fazer as transmissões

  corretas de radiotelefonia no acompanhamento de um voo

  normal.

  • Explicar como testar a transmissão e a recepção de rádio.

  • Identificar a escala de inteligibilidade das mensagens e

  explicar o seu significado.

  3.3

  • Descrever o procedimento para transferência de

  comunicações, partindo de uma estação de solo ou de uma

  aeronave.

  • Identificar a composição do sinal de chamada de uma

  estação aeronáutica.

  • Transmitir e interpretar mensagens de telecomunicações,

  aplicando os códigos, as abreviaturas, palavras e frases

  padronizadas.

  • Listar as categorias de mensagens em ordem de prioridade.

  • Identificar os tipos de mensagens apropriadas para cada

  categoria.

  3.4

  3.1 Códigos e abreviaturas da radiotelefonia'
