title: 'Prevenção e resolução de conflitos - Ações:'
text: '2.7.3 Prevenção e resolução de conflitos - Ações:

  questionamento, escuta ativa, advocacia, comentários,

  metacomunicação e negociação

  3 Erros humanos e confiabilidade

  Objetivos específicos Subunidades

  3.1

  • Nomear e explicar os fatores que influenciam a confiabilidade

  humana.

  3.2

  • Justificar a necessidade de estar consciente do próprio desempenho e

  limitações antes e durante a execução de uma tarefa.

  • Definir o termo "consciência situacional ".

  • Listar pistas que indicam a perda de consciência situacional e

  descrever os passos para recuperá-la.

  • Listar os fatores que influenciam a própria consciência situacional

  tanto positiva como negativamente, sublinhando a importância da

  consciência situacional no contexto da segurança de voo.

  • Listar as pistas que indicam uma perda de consciência situacional.

  • Citar os passos para recuperar a consciência situacional perdida.

  • Justificar a necessidade de estar consciente não só do próprio

  desempenho, mas no dos outros, e as possíveis consequências e / ou

  riscos antes e durante o voo sob sua responsabilidade.

  3.1 Confiabilidade do comportamento humano -

  Fatores influentes

  3.2 Modelos mentais e consciência situacional'
