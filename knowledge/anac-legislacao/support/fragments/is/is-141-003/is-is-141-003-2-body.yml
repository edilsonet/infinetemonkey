text: '2. REVOGAÇÃO

  2.1 Esta IS revoga a Portaria nº 210/DGAC, de 3 de julho de 1991, que aprovou o MMA 58-

  10: Manual de Curso de Despachante Operacional de Voo, publicado no Diário Oficial

  [da] República Federativa do Brasil, de 25 jul. 1991, Seção 1, p. 14837 e no Boletim do

  Ministério da Aeronáutica, 31 jul. 1991, n. 113-7.'
