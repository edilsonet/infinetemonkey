title: Requisitos de pista
text: '3.1.1 Requisitos de pista

  - Zonas livres de obstáculos (clearway - CWY). Zona de Parada

  (stopway - STW). Distâncias necessárias

  - Percurso de decolagem disponível (Take-off Run Available -

  TORA); Distância disponível para decolagem (Take-off Distance

  Available - TODA); distância disponível para aceleração e parada

  (Accelerate Stop Distance Available - ASDA) -Definição

  - Balanceamento de pista - Definição'
