title: Planejamento da melhor distribuição e separação de carga,
text: '3.1.2.3 Planejamento da melhor distribuição e separação de carga,

  correio e bagagem e definição de seu posicionamento na aeronave

  em função de:

  - limitações volumétricas, da resistência do piso e do CG da

  aeronave;

  - economia de tempo e de esforço para descarregar / recarregar em

  escalas/paradas intermediárias; e

  - requisitos e limitações relativos a artigos perigosos.

  3.2 Carga paga máxima (maximum payload)'
