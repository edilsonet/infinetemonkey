text: '3.1.2 Velocidades de decolagem - Definições

  - Velocidade de falha do motor crítico (VEF)

  - Velocidade mínima de controle no solo (VMCG)

  - Velocidade mínima de controle no ar (VMCA)

  - Velocidade de decisão (V1)

  - Velocidade de rotação (VR)

  - Velocidade de estol (VS)

  - Velocidade de pré-estol (VMU)

  - Velocidade de despegue (lift-off speed - VLOF), na qual o trem de

  pouso principal deixa de ter contato com a pista

  - Velocidade máxima de pneu

  - Velocidade de máxima energia no freio (Vmbe)

  - Velocidade de decolagem e subida (V2)'
