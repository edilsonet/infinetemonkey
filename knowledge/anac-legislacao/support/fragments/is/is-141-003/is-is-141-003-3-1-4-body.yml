text: '3.1.4 Choque mecânico -- Definição.

  4 Movimento ondulatório

  Objetivos específicos Subunidades

  4.1

  • Caracterizar movimento ondulatório, suas grandezas e os fenômenos

  decorrentes de sua propagação.

  4.2

  • Identificar o som como um movimento ondulatório, indicando sua

  velocidade e condições de variação.

  • Indicar as condições de ressonância.

  4.3

  • Identificar a luz como um movimento ondulatório.

  • Identificar as características das lentes e prismas.

  • Reconhecer o aspecto eletromagnético da propagação luminosa.

  4.1. Caracterização'
