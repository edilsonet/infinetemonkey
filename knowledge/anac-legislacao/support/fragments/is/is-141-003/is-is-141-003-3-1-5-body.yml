text: '3.1.5 PolinômiosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Simplificar frações algébricas.

  • Efetuar operações com frações algébricas.

  • Simplificar frações algébricas.

  3.3

  • Resolver equações de 1º grau em R.

  • Resolver equações fracionárias redutíveis ao 1º grau.

  • Resolver expressões algébricas polinomiais de 1º grau.

  3.4

