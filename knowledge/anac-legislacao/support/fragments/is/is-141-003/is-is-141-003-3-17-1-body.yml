title: Procedimentos
text: '3.17.1 Procedimentos

  3.19 MensagensData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever as medidas a serem adotadas pelos órgãos ATS depois de ter

  verificado que uma aeronave está extraviada, não identificada ou fora da área de

  responsabilidade.

  3.16

  • Descrever as autorizações e os procedimentos necessários para uma aeronave

  voando sob regras de voo por instrumentos em espaço aéreo controlado.

  • Descrever os procedimentos necessários para uma aeronave voando sob regras

  de voo por instrumentos fora do espaço aéreo controlado.

  3.17

  • Descrever os procedimentos a serem seguidos para operações em aeródromo não

  controlado, considerando-se também o cumprimento das Regras do Ar, bem

  como dos requisitos de voo relacionados com a classificação dos espaços aéreos

  ATS utilizados.

  3.18

  • Descrever os procedimentos a serem seguidos pelos os órgãos ATS quando

  acontecer ou se houver suspeita de uma interferência ilícita com uma aeronave.

  3.19

  • Justificar a finalidade da mensagem de posição.

  • Justificar a responsabilidade do piloto em comando pela confecção e transmissão

  das mensagens de posição ao órgão ATS responsável pelo espaço aéreo em que

  voe a aeronave.

  • Descrever as situações em que são exigidas as mensagens de posição.

  • Reconhecer a forma de divulgação da mensagem de posição.

  • Identificar os elementos que devem compor a mensagem de posição.

  • Descrever as informações operacionais e meteorológicas a serem transmitidas e

  registradas, dispostas no Anexo B da ICA 100-37.

  • Caracterizar a Mensagem de Informação Operacional e Meteorológica (AIREP)

  quanto à finalidade, ao conteúdo e ao formato.

  • Citar as responsabilidades do piloto com relação à Mensagem de Informação

  Operacional Meteorológica (AIREP).

  • Diferenciar a AIREP da AIREP especial.

  • Descrever os procedimentos de encaminhamento das mensagens de

  aeronotificação AIREP de rotina e AIREP especial.

  3.20

  • Citar os três efeitos básicos da esteira de turbulência sobre as aeronaves.

  • Identificar as três categorias de aeronaves de acordo com o peso máximo de

  decolagem certificado, nas quais se baseiam os mínimos de separação da esteira

  de turbulência.

  • Descrever os mínimos de separação radar de esteira de turbulência para

  aeronaves nas as fases de pouso e de decolagem, quando uma aeronave está

  operando diretamente atrás de outra, na mesma altitude ou a menos de 300 m

  (1.000 pés) abaixo.

  3.21

  • Descrever os objetivos e os procedimentos de ajuste de velocidade horizontal e

  vertical.

  3.22

  • Descrever os procedimentos de espera e de entrada no circuito de espera

  publicados pelo DECEA.

  3.23

  • Reconhecer as circunstâncias que possam impedir que um controlador de voo se

  comunique com uma aeronave sob seu controle.'
