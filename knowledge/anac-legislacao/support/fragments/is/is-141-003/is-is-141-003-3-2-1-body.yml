title: Direção verdadeira medida em relação ao meridiano em
text: '3.2.1 Direção verdadeira medida em relação ao meridiano em

  mapas e cartas.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar a diferença existente entre os polos magnéticos e os

  polos verdadeiros da Terra.

  • Definir norte verdadeiro, norte magnético e norte bússola.

  3.2

  • Medir a direção verdadeira em relação ao meridiano em

  cartas e globos.

  • Justificar o uso do sistema de navegação inercial (inertial

  navigation system - INS), do sistema de referência inercial

  (inertial reference system - IRS) e do sistema global de

  navegação por satélite (global navigation satellite system -

  GNSS) para a mensuração da direção em voo.

  • Identificar as mudanças de direção verdadeira em função da

  convergência de meridiano em um grande círculo.

  • Identificar as limitações de uso da bússola magnética na

  vizinhança dos polos geográficos.

  3.3

  • Definir linha agônica, linha isogônica e linha isoclínica.

  • Identificar, nas cartas, linhas agônicas, linhas isogônicas e

  linhas isoclínicas.

  • Determinar o posicionamento dos polos magnéticos, campo

  magnético e linhas representativas das Dmg agônica e

  isogônica;

  • Definir declinação magnética (Dmg).

  • Citar a finalidade da Planilha de Planejamento de Voo

  (Calunga) e do “Pé de Galinha”.

  • Definir rumo e proa.

  • Diferenciar rumo de proa.

  • Definir rumo verdadeiro (RV), proa verdadeira (PV), rumo

  magnético (RM) e proa magnética (PM).

  • Traçar, nas cartas WAC e ENRC, rumo verdadeiro (RV),

  proa verdadeira (PV), rumo magnético (RM) e proa

  magnética (PM).

  • Transformar, com utilização da declinação magnética, rumo

  verdadeiro (RV) em rumo magnético (RM) e vice-versa.

  • Transformar, com a utilização do método gráfico, rumo

  verdadeiro (RV) em rumo magnético (RM).

  • Transformar, com a utilização da declinação magnética, proa

  verdadeira (PV) em proa magnética (PM).

  3.4

  • Citar a finalidade da bússola.

  • Interpretar as indicações da bússola.

  • Citar as características de cada uma das três partes da

  bússola: estrutura, cartão de desvio e linha de fé.

  • Interpretar as indicações do cartão desvio.

  • Definir proa bússola (PB).

  • Definir desvio de bússola (DB).

  • Citar os fatores contribuintes do desvio de bússola.

  • Explicar o emprego do desvio de bússola na proa.

  • Descrever os procedimentos utilizados para calibração

  manual da bússola.

  • Converter direção por bússola para direção magnética e vice-

  versa.

  • Converter direção por bússola para direção verdadeira e

  vice-versa.

  • Solucionar problemas de navegação aérea que envolvam

  cálculo de direção.'
