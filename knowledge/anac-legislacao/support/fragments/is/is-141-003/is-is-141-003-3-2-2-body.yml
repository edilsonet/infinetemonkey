text: '3.2.2 Provisão dos serviços de tráfego aéreoData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Nomear os objetivos dos serviços de tráfego aéreo.

  • Identificar a área em que os serviços de tráfego aéreo são prestados.

  • Identificar as atribuições dos diferentes serviços de tráfego aéreo.

  3.3

  • Identificar as divisões do espaço aéreo.

  • Identificar os limites vertical superior, vertical inferior e laterais do espaço aéreo

  superior.

  • Identificar os limites vertical superior, vertical inferior e laterais do espaço aéreo

  inferior.

  • Identificar as características dos espaços aéreos não controlados, dos controlados

  e dos condicionados.

  3.4

  • Definir Regiões de Informação de Voo (FIR).

  • Definir Áreas de Controle e Zonas de Controle.

  • Identificar cada uma das áreas de controle: UTA, CTA e TMA.

  • Definir Zonas de Tráfego de Aeródromo (ATZ).

  • Definir aeródromo controlado.

  3.5

  • Distinguir entre as várias classes de espaço aéreo (de A a G) e explicar se são

  permitidos voos VFR ou IFR nessas classes.

  • Nomear todas as classes de espaço aéreo em que serão fornecidas autorizações

  ATC.

  • Localizar, no Anexo A da ICA 100-37, os requisitos para os voos dentro de

  determinada classe de espaço aéreo ATS.

  • Identificar a responsabilidade do piloto em comando caso esteja voando em uma

  classe de espaço aéreo em que o órgão ATC não tenha responsabilidade de

  prover a separação em relação às demais aeronaves.

  3.6

  • Identificar os limites vertical superior, vertical inferior e laterais das aerovias

  superiores.

  • Identificar os limites vertical superior, vertical inferior e laterais das aerovias

  inferiores.

  3.7

  • Definir Rotas de Navegação de Área (RNAV).

  • Citar os equipamentos mínimos necessários para utilização da Rota de

  Navegação de Área (RNAV).

  • Citar as disposições estabelecidas nas publicações para a utilização de

  equipamento RNAV.

  3.8

  • Identificar os órgãos responsáveis pela prestação dos seguintes serviços de

  tráfego aéreo: serviço de controle de área, serviço de controle de aproximação,

  serviço de controle de aeródromo, serviço de informação de voo e serviço de

  alerta.

  • Identificar os tipos de voos e respectivos espaços aéreos aos quais é

  proporcionado o serviço de controle de tráfego aéreo.

  • Listar as ações a serem tomadas por um órgão ATC para proporcionar o serviço

  de controle de tráfego aéreo.

  3.9

  • Identificar as formas de separação entre voos providas pelas autorizações e

  instruções emitidas pelos órgãos ATC.'
