text: '3.2.3 Manobras no solo

  4 Sistema hidráulico do avião multimotor

  Objetivos específicos Subunidades

  4.1

  • Caracterizar o sistema hidráulico principal do avião multimotor quanto

  à finalidade, ao funcionamento e aos principais componentes.

  • Identificar as unidades acionadas pelo sistema hidráulico principal do

  avião multimotor.

  • Caracterizar o sistema hidráulico secundário ou de emergência do

  avião multimotor quanto à finalidade, ao funcionamento e aos

  principais componentes.

  • Identificar as unidades acionadas pelo sistema hidráulico secundário

  ou de emergência do avião multimotor.

  4.2

  • Discorrer sobre a utilização dos controles do sistema hidráulico do

  avião multimotor.

  • Discorrer sobre as mais comuns limitações operacionais da atuação do

  sistema hidráulico do avião multimotor.

  • Discorrer sobre as consequências das deficiências de funcionamento

  em voo do sistema hidráulico do avião multimotor.

  4.1 Sistemas hidráulicos'
