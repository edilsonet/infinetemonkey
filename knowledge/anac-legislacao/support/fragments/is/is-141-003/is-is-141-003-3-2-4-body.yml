text: '3.2.4 Informações fornecidas pela empresa aérea em

  caso de acidente/incidente da aeronave

  3.3 Reporte de acidentes/incidentes envolvendo

  artigos perigosos

  4 Documentação

  Objetivos específicos Subunidades

  4.1

  • Listar as informações a serem incluídas na Notificação ao Comandante

  (NOTAC) a respeito dos artigos perigosos a bordo.

  • Identificar os documentos envolvidos no transporte aéreo de artigos

  perigosos.

  4.2

  • Identificar a finalidade dos seguintes documentos: DACTE e AWB.

  4.3

  • Descrever os procedimentos de preenchimento da instrução de

  carregamento e da loadsheet quando a carga envolver artigos

  perigosos.

  4.1 Notificação ao Comandante - NOTAC'
