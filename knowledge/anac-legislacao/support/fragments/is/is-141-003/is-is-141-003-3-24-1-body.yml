title: Medidas a serem adotadas pelos órgãos
text: '3.24.1 Medidas a serem adotadas pelos órgãos

  ATS.

  3.25 Combustível mínimo e emergência por

  combustívelData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever os procedimentos a serem empregados nos casos de contingências

  ATC.

  3.24

  • Identificar as medidas aplicáveis a serem adotadas por um órgão ATS caso tenha

  conhecimento de que uma aeronave está sendo interceptada em sua área de

  responsabilidade.

  • Identificar as medidas aplicáveis a serem adotadas por um órgão ATS caso tenha

  conhecimento de que uma aeronave está sendo interceptada fora de sua área de

  responsabilidade.

  3.25

  • Identificar as medidas aplicáveis a serem adotadas por um órgão ATS quando

  um piloto notificar uma situação de combustível mínimo.

  4 Serviço de controle de área

  Objetivos específicos Subunidades

  4.1

  • Justificar a finalidade do serviço de controle de área.

  • Nomear e identificar as siglas dos órgãos ATS que prestam serviço ATC (ACC,

  APP, TWR).

  • Descrever a jurisdição de um ACC.

  • Descrever a subordinação dos APP e das TWR.

  4.2

  • Definir espaço aéreo RVSM.

  • Descrever como é definida a separação vertical.

  • Descrever a separação vertical mínima exigida,

  • Descrever como as altitudes mínimas e menores níveis de voo utilizáveis

  correspondem um ao outro

  • Descrever como os níveis de cruzeiro de aeronaves voando para o mesmo

  destino na sequência de aproximação esperada estão correlacionados entre si.

  • Descrever as condições que devem ser observadas, quando duas aeronaves estão

  habilitadas para manter uma separação vertical especificada entre elas durante a

  subida ou a descida.

  • Definir nível mínimo de aerovia.

  • Calcular os níveis mínimos IFR fora de aerovia.

  • Definir os termos: separação horizontal, separação lateral e separação

  longitudinal

  • Descrever os métodos de separação lateral.

  • Identificar a finalidade do ajuste de velocidade.

  • Citar os cuidados do piloto em relação ao ajuste de velocidade para separação

  longitudinal.

  • Citar os mínimos de separação longitudinal baseados em intervalos de tempo

  para aeronaves no mesmo nível de cruzeiro seguindo a mesma rota, para

  aeronaves no mesmo nível de cruzeiro seguindo rotas que se cruzam, para

  aeronaves subindo ou descendo e para aeronaves seguindo rotas opostas.

  • Citar os mínimos de separação longitudinal baseados em intervalos de tempo e

  obtidos com a técnica do Número Mach.

  • Citar os mínimos de separação longitudinal baseados no uso da distância RNAV

  e obtidos com a técnica do Número Mach.

  4.3

  • Descrever o propósito de autorizações e informações emitidas por um órgão

  ATC.

  4.1 Visão geral'
