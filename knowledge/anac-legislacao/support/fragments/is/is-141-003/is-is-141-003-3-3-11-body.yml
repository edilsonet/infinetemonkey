text: '3.3.11 Validade das especificações operativasData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  • Citar as condições para uma EO ser considerada válida.

  4 Operações domésticas, de bandeira e suplementares - RBAC 121

  Objetivos Específicos Subunidades

  4.1

  • Explicar os requisitos relativos à responsabilidade e à autoridade

  do piloto em comando.

  • Listar os requisitos para o equipamento de rádio para voos por

  referências visuais.

  • Listar os requisitos de comunicações e equipamento de

  navegação para operações em IFR ou VFR, em rotas não

  navegadas por referências visuais.

  • Descrever as responsabilidades do operador em matéria de rotas

  e áreas de atuação.

  • Listar os fatores a serem considerados para a seleção de uma

  rota.

  • Descrever as limitações impostas pela regulamentação em

  operações de alcance prolongado com aviões bimotores com e

  sem aprovação ETOPS.

  • Justificar a obrigatoriedade de cada detentor de certificado ETA,

  conduzindo operações domésticas ou de bandeira demonstrar

  que possui centros de despacho de voo em número suficiente

  para atender as operações a serem conduzidas e que tais centros

  estão localizados nos pontos necessários ao controle operacional

  de cada voo.

  4.2

  • Identificar a aplicabilidade e os requisitos gerais das aeronaves

  contidos na Subparte H do RBAC.

  • Reconhecer a proibição de operação de aviões monomotores

  segundo o RBAC 121.

  • Explicar o significado do termo "aeródromo adequado".

  • Explicar as limitações a serem respeitadas nas operações de

  aviões nas seguintes áreas: i) polar norte; ii) polar sul; e iii)

  grandes extensões de água.

  • Descrever as limitações impostas pela regulamentação para que

  sejam conduzidas operações ETOPS.

  • Explicar o significado do termo “avião materialmente

  modificado”.

  4.3

  • Identificar a aplicabilidade e os requisitos gerais contidos na

  Subparte I do RBAC 121.

  • Descrever as limitações de peso e de decolagem para aviões com

  motores convencionais.

  • Descrever as limitações em rota para aviões com motores

  convencionais com todos os motores operando e com um motor

  inoperante.

  • Descrever as limitações em rota para aviões categoria transporte

  com quatro ou mais motores convencionais, com dois motores

  inoperantes.

  • Descrever as limitações de pouso em aeródromo de destino e em

  aeródromo de alternativa para aviões com motores

  convencionais.

  • Reconhecer os mínimos de operação de um aeródromo.

  • Descrever as limitações de decolagem para aviões com motores

  a turbina.

  4.1 Subparte E - Aprovação de rotas para operações

  domésticas e de bandeira'
