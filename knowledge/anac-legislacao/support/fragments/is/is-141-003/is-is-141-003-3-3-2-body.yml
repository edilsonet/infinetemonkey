text: '3.3.2 Princípios dos transmissores e receptores de rádio

  2 Regulamentação e Serviços de Comunicações Aeronáuticas

  Objetivos Específicos Subunidades

  2.1

  • Reconhecer a UIT como o organismo responsável pelos

  sistemas de telecomunicações.

  • Identificar o Anexo 10 e os DOC 4444 e DOC 9432 como

  documentos que regulam as comunicações aeronáuticas.

  2.2

  • Identificar os requisitos de certificação em radiotelefonia

  estabelecidos pelo Anexo 1 da OACI e pela Convenção da

  UIT, Nairobi, 1982.

  2.3

  • Identificar o DECEA como órgão mantenedor do Serviço

  Fixo Aeronáutico e do Serviço Móvel Aeronáutico.

  • Identificar as características do Serviço Fixo Aeronáutico.

  • Descrever o funcionamento do Serviço Fixo Aeronáutico.

  • Identificar a finalidade da Rede Internacional de

  Comunicações Fixas Aeronáuticas.

  2.4

  • Identificar as características do Serviço Móvel Aeronáutico.

  • Descrever o funcionamento do Serviço Móvel Aeronáutico.

  • Identificar a rede DATACOM como o sistema pelo qual

  operadores das empresas aéreas possam se comunicar com

  suas aeronaves, visando à veiculação de mensagens de

  interesse da aviação civil ao sobrevoarem o espaço aéreo

  brasileiro.

  2.5

  • Identificar os meios e serviços de radiodifusão aeronáutica.

  • Explicar o funcionamento dos equipamentos de

  radiotelefonia VHF, HF e UHF.

  • Explicar o funcionamento do serviço de Radiodifusão de

  Informações Meteorológicas Aeronáuticas - VOLMET.

  • Explicar o funcionamento do serviço de Radiodifusão de

  Informações para a Navegação Aérea - ATIS.

  2.6

  • Citar as características das estações de telecomunicações

  aeronáuticas.

  • Explicar a finalidade das estações de telecomunicações

  aeronáuticas.

  • Identificar as frequências principal e secundária de uma

  estação de telecomunicações aeronáuticas.

  • Descrever os procedimentos em caso de falha de

  comunicação das estações de telecomunicações

  aeronáuticas.

  2.1. União Internacional de Telecomunicações - UIT'
