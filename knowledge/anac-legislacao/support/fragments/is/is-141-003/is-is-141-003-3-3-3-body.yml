title: 'Potenciais problemas associados com:'
text: '3.3.3 Potenciais problemas associados com:

  - não comparecimento ao embarque de passageiros confirmados

  - quebra de compromissos contratuais para correio e carga

  - falha no embarque de animais vivos ou de carga perecível.

  4 Cálculo da carga paga e preparação da loadsheet e da instrução de carregamento

  Objetivos Específicos Subunidades

  4.1

  • Definir os seguintes termos: peso máximo de taxi, peso

  máximo de decolagem, peso máximo de pouso e peso

  máximo zero combustível.

  • Definir carga paga e carga útil.

  • Definir os termos: combustível de calços-fora, combustível

  de taxi, combustível de decolagem, combustível de consumo

  da etapa, combustível mínimo requerido, combustível de

  reserva regulamentar e combustível extra.

  • Identificar os elementos constituintes dos seguintes pesos de

  aeronaves:

  • Explicar a relação entre os diferentes componentes de peso

  e carga listados acima.

  4.2

  • Identificar as limitações restritivas ao peso de aeronaves a

  serem consideradas no cálculo de peso e balanceamento.

  4.3

  • Explicar o procedimento e os regulamentos gerais para pesagem

  de aeronaves.

  • Extrair e interpretar dados a partir de relatório de peso de uma

  aeronave.

  • Calcular peso e posição do CG de uma aeronave utilizando

  dados de pesagem.

  • Extrair valores para BEW e/ou DOW a partir de determinados

  documentos.

  • Extrair valores para a posição do CG e momento em BEW e/ou

  DOW a partir de determinados documentos.

  • Extrair valores a partir de dados de documentos para o desvio

  de configuração padrão como um resultado da variação de

  tripulação, equipamento opcional, tanques de combustível

  opcionais etc.

  4.4

  • Calcular o peso padrão dos passageiros com base nos

  parâmetros estabelecidos

  4.5

  • Converter peso, volume e densidade de combustível em

  diferentes unidades de medida utilizadas em aviação.

  4.1 Conceitos básicos'
