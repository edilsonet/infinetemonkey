text: '3.3.4.3 Spoilers - Princípio de funcionamento.

  4 Cargas estáticas e cargas dinâmicas

  Objetivos Específicos Subunidades

  4.1

  • Definir cargas dinâmicas.

  • Definir fator de carga.

  • Definir cargas dinâmicas horizontais e cargas dinâmicas

  verticais.

  • Explicar a variação do fator de carga nos voos nivelados, nas

  curvas niveladas e nas diversas manobras de voo.

  • Explicar a influência das rajadas de vento no fator de carga.

  • Explicar a influência da turbulência no fator de carga.

  • Definir velocidade máxima de penetração em turbulência.

  • Explicar a atuação do fator de carga nas recuperações de perdas.

  • Explicar a relação do estol de velocidade com o fator de carga.

  • Explicar cada uma das limitações operacionais do fator de carga.

  • Citar as diferentes categorias de aviões quanto aos limites do

  fator de carga.

  4.2

  • Definir cargas estáticas.

  • Explicar a influência das cargas estáticas na estrutura da

  aeronave.

  • Explicar a influência das cargas adicionais durante o pouso da

  aeronave.

  • Identificar os limites das cargas laterais no trem de pouso da

  aeronave, durante o táxi e nas curvas no solo.

  4.1 Cargas dinâmicas'
