title: Cartas de radionavegação -- Propósito. Elementos. Projeção.
text: '3.3.5 Cartas de radionavegação -- Propósito. Elementos. Projeção.

  Cobertura e escala. Graduações. Dados aeronáuticos. UtilizaçãoData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  • Explicar as características da projeção Estereográfica ou

  Polar.

  • Explicar os critérios utilizados para a escolha da projeção.

  3.3

  • Identificar as cartas recomendadas pela OACI a serem

  utilizadas no planejamento e na realização de voos.

  • Reconhecer as especificações gerais contidas nas

  diferentes cartas aeronáuticas.

  • Explicar o propósito de cada uma das cartas de navegação.

  • Identificar elementos contidos em cada uma das cartas de

  navegação.

  • Identificar os tipos de escalas contidos em cada uma das

  cartas de navegação.

  • Interpretar as legendas de cada uma das cartas de

  navegação.

  • Identificar o tipo de relevo representado nas cartas e sua

  elevação.

  3.4

  • Identificar as fontes das cartas aeronáuticas mais utilizadas

  pelos operadores aéreos.

  • Buscar informações nas cartas aeronáuticas apropriadas.

  3.5

  • Utilizar corretamente compasso de ponta-seca, régua,

  transferidor e computadores manuais no manuseio das

  cartas aeronáuticas.

  • Determinar posições, medições e traçados de distâncias em

  cartas, conforme projeções de Mercator e Lambert.'
