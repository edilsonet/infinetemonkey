text: '3.3.6 Limitações individuais como possíveis fontes de

  erro

  4 Processo de tomada de decisão

  Objetivos específicos Subunidades

  4.1

  • Definir e distinguir os termos "personalidade", "atitude" e

  "comportamento".

  • Indicar a origem da personalidade e das atitudes.

  • Resumir a influência dos traços de personalidade de um DOV em sua

  performance.

  • Discutir a genética e as influências ambientais sobre o

  desenvolvimento da personalidade.

  • Identificar atitudes perigosas que, se prevalentes em um membro do

  ambiente operacional, podem representar um perigo para a segurança

  de voo.

  • Descrever atitudes e comportamentos ideais em um membro do

  ambiente operacional.

  • Descrever as diferenças individuais de personalidade por meio de um

  modelo de traço comum (de Hans Eysenk fatores de personalidade).

  • Identificar o mais importante traço de personalidade para a tomada de

  decisão eficaz.

  • Definir "auto-conceito" e sua influência na personalidade.

  4.1 Personalidade, atitude e comportamento'
