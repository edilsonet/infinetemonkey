text: '3.4.1 Aeronaves turbo-hélice e turborreatoras -- Dados de manuais

  de voo e de tabelas e gráficos para calcular:

  -- limitações de pista devidas a: componentes de vento (proa, cauda

  e través); contaminação (chuva, lama, neve e outros)

  -- V1, VR e V2 para diferentes tipos de aeronaves

  -- comprimento da pista necessário para diferentes tipos de aeronaves

  -- velocidades de decolagem considerando todos os motores

  operantes ou falha do motor crítico

  4 Performance de subida

  Objetivos Específicos SubunidadesData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  4.1

  • Definir os termos: trajetória de decolagem, ângulo e gradiente,

  ajustes de potência e ajustes de flape;

  • Explicar a diferença entre ângulo e gradiente.

  • Definir os termos ângulo de subida e gradiente de subida.

  • Explicar o efeito de ajustes de potência selecionados,

  configurações de flape e peso da aeronave na razão de subida.

  4.2

  • Definir cada segmento da sequência de subida.

  • Identificar os parâmetros mínimos a serem cumpridos em

  cada segmento de subida

  4.3

  • Explicar o efeito do peso da aeronave sobre a velocidade de

  melhor ângulo e a melhor razão de subida.

  • Explicar o efeito do vento sobre a velocidade de máximo

  alcance e velocidade para o ângulo máximo de subida.

  • Explicar o efeito da seleção do flape na corrida de decolagem.

  • Para hélices de passo fixo/variável, explicar o efeito da

  velocidade do ar na tração durante a corrida de decolagem.

  • Explicar o efeito da altitude pressão sobre o peso de

  decolagem limitado pelo comprimento de pista.

  • Explicar o efeito da pista contaminada sobre a distância de

  decolagem.

  • Determinar os requisitos para a decolagem de acordo com a

  regulamentação.

  • Explicar os efeitos dos componentes de vento de proa e de

  cauda, em consonância com a regulamentação vigente.

  • Explicar o efeito de ajustes de potência selecionados,

  configurações de flape e peso do avião na razão de subida.

  • Descrever o efeito de uma falha de motor na decolagem.

  4.4

  • Descrever o efeito da perda de potência do motor no

  desempenho de subida.

  4.1 Definições

  - Trajetória de decolagem (climb limit)

  - Ângulo e gradiente

  - Ajustes de potência

  - Ajustes de flape

  4.2 Sequência de subida - Definições

  - primeiro segmento

  - segundo segmento

  - terceiro segmento

  - quarto segmento

  4.3 Limites de peso / altitude / temperatura para a subida'
