title: Diálogos não usuais, anormais, relativos a situações de
text: '3.4.3 Diálogos não usuais, anormais, relativos a situações de

  emergência produzidos pelos diversos profissionais da aviação

  civil (Non-standard, abnormal emergency situations dialogues)Data de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  • Interpretar diálogos relativos a situações de emergência.

  4 Produção oral

  Objetivos específicos Subunidades

  4.1

  • Narrar no passado, presente e futuro.

  4.2

  • Reportar informações sobre o peso e balanceamento da

  aeronave.

  • Esclarecer mal-entendidos e dúvidas dos seus pares e do piloto

  em comando sobre peso e balanceamento.

  4.3

  • Produzir diálogos simulando a comunicação no solo e em voo.

  • Esclarecer mal-entendidos e situações complexas.

  • Expressar-se oralmente para auxiliar em situações de

  emergência.

  4.4

  • Comunicar-se de forma eficaz utilizando fraseologia padrão

  OACI.

  4.1 Briefing e debriefing das atividades (Briefing and

  debriefing)

  4.2 Informações sobre o peso e balanceamento da aeronave

  (Weight and balance)

  4.3 Comunicação no solo e em voo'
