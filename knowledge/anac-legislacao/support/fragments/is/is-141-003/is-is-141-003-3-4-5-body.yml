title: Conversão de direção por bússola para direção verdadeira e
text: '3.4.5 Conversão de direção por bússola para direção verdadeira e

  vice-versa

  3 Mapas e cartasData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Objetivos Específicos Subunidades

  3.1

  • Definir globo terrestre, mapa e carta.

  • Definir cartas.

  • Identificar as propriedades desejáveis em uma carta de

  navegação.

  • Relatar problemas associados com a impossibilidade da

  representação correta de uma esfera em superfície plana.

  • Descrever os métodos utilizados para projetar a forma

  redonda da Terra em um papel plano.

  3.2

  • Definir projeção cartográfica.

  • Citar as diferentes origens das projeções.

  • Explicar a causa das distorções nas projeções.

  • Classificar as projeções cartográficas quanto ao tipo e

  quanto à tangência.

  • Definir projeção plana, projeção cilíndrica, projeção

  cônica, projeção azimutal ou zenital.

  • Definir projeção equatorial, projeção polar, projeção

  oblíqua.

  • Identificar projeção gnomônica como aquela na qual os

  grandes círculos terrestres são representados como linhas

  retas.

  • Identificar a representação gráfica da projeção cilíndrica,

  da projeção cônica, da projeção azimutal ou zenital, da

  projeção equatorial, da projeção polar, da projeção

  oblíqua, da projeção ortográfica, da projeção

  estereográfica e da projeção gnomônica.

  • Citar a aplicação da projeção cilíndrica, da projeção

  cônica, da projeção azimutal ou zenital, da projeção

  equatorial, da projeção polar, da projeção oblíqua, da

  projeção ortográfica, da projeção estereográfica e da

  projeção gnomônica.

  • Citar os tipos de cartas WAC (World Aeronautical Chart)

  quanto à projeção.

  • Citar as características da projeção Mercator.

  • Citar as vantagens e as desvantagens da projeção

  Mercator.

  • Citar as características da projeção Lambert.

  • Citar as vantagens e as desvantagens da projeção Lambert.

  • Citar as características da projeção Estereográfica ou

  Polar.

  • Citar os critérios utilizados para a escolha da projeção.

  • Citar os tipos de cartas quanto à projeção.

  • Listar as características da projeção Mercato.

  • Explicar as vantagens e as desvantagens da projeção

  Mercator.

  • Listar as características da projeção Lambert.

  • Explicar as vantagens e as desvantagens da projeção

  Lambert.

  3.1 Representação da Terra'
