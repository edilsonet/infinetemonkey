text: '3.4.6 Fixo de posição por cruzamento de radiais

  4 Sistema de pouso por instrumentos (ILS)

  Objetivos Específicos Subunidades

  4.1

  • Definir sistema de pouso por instrumentos.

  • Descrever o equipamento de terra utilizado para o ILS.

  4.2

  • Descrever cada um dos componentes básicos do ILS:

  localizador, glide slope e marcadores.

  • Explicar a finalidade dos marcadores.

  4.3

  • Justificar a razão da divisão do ILS em categorias.

  • Identificar as características e os mínimos operacionais

  normais de cada categoria ILS.

  • Descrever os requisitos adicionais para as aproximações

  de Categorias II e III.

  4.4

  • Explicar a função dos instrumentos de bordo na recepção

  dos sinais ILS

  4.1 Sistema de pouso por instrumentos (instrument landing system

  - ILS)'
