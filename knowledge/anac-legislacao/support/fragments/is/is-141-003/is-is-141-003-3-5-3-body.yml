text: '3.5.3 Cartas para utilização dos radio-auxílios -- Facilidade de

  projeção. Simplicidade e rapidez do manuseio

  4 Navegação Estimada

  Objetivos Específicos Subunidades

  4.1

  • Definir o ponto de não retorno (PNR) na navegação de

  aeronaves.

  • Realizar estimativa de PNR utilizando dados reais de voos.

  • Calcular PNR por fórmula básica para as condições sem

  vento, com rajadas de vento e com vento forte de cauda.

  • Estabelecer a condição de vento para máximo PNR.

  4.1 Ponto de não retorno (Point of no return - PNR)'
