title: Documentos de existência obrigatória a bordo das aeronaves
text: '3.6.1.3 Documentos de existência obrigatória a bordo das aeronaves

  civis brasileiras: Certificado de Aeronavegabilidade (C.A.) e

  Certificado de Matrícula e Nacionalidade válidos, emitidos pelo

  Registro Aeronáutico Brasileiro (RAB); Manual de Voo atualizado,

  contendo a última revisão do fabricante e incluindo a lista de

  verificações (check-list); apólice de seguro da aeronave ou certificado

  de seguro da aeronave com comprovante de pagamento; Licença de

  Estação da Aeronave (FISTEL); Ficha de Inspeção Anual de

  Manutenção (FIAM) ou registro dos últimos serviços de manutenção

  que atestaram a Inspeção Anual de Manutenção (IAM); Diário de

  Bordo; Manual Geral de Operações, incluindo as operações

  pertinentes a itens, equipamentos e instrumentos instalados

  posteriormente à aquisição da aeronave; NSCMA 3-135 e NSMA 3-

  7, expedidas pelo CENIPA; bem como as Especificações Operativas

  (EOs) requeridas no caso das aeronaves cujas operações são regradas

  através dos RBHA/RBAC 121 e 135 -- Finalidade'
