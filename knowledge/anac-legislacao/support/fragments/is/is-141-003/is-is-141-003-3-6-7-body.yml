text: '3.6.7 Ajustes altimétricos: QNE, QFE e QNH - Utilizações.

  CálculosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar as influências exercidas no voo pelas variações da

  altitude densidade em função das variações da pressão

  atmosférica, da altitude e da temperatura.

  • Citar a utilização de cada um dos ajustes altimétricos: QNE,

  QFE e QNH.

  • Determinar a altitude pressão, a altitude indicada, a altitude

  densidade, a altitude verdadeira, a altitude absoluta ou altura e

  a altitude calibrada.

  • Resolver problemas altimétricos por meio de fórmulas e

  relações matemáticas existentes.

  • Citar as causas dos erros meteorológicos do altímetro.

  • Citar os riscos para a segurança de voo decorrentes dos erros

  meteorológicos do altímetro.'
