text: '3.6.8 Erros meteorológicos do altímetro -- Causas. Riscos para a

  segurança de voo

  4 Equilíbrio atmosférico

  Objetivos Específicos Subunidades

  4.1

  • Definir cada um dos tipos de equilíbrios da atmosfera.

  • Relacionar cada um dos tipos de equilíbrios da atmosfera à

  previsão meteorológica.

  4.2

  • Definir processo adiabático, razão adiabática e razão

  adiabática úmida.

  4.3

  • Definir gradiente térmico vertical, gradiente isotérmico,

  gradiente negativo, gradiente superadiabático, gradiente

  autoconvectivo e gradiente do ponto de orvalho.

  • Aplicar, nos prognósticos meteorológicos, o gradiente térmico

  vertical, o gradiente isotérmico, o gradiente negativo, o

  gradiente superadiabático, o gradiente autoconvectivo e o

  gradiente do ponto de orvalho.

  4.4

  • Definir nível de condensação convectiva (NCC).

  • Relacionar cada um dos níveis de condensação convectiva

  (NCC) à previsão meteorológica.

  4.5

  • Citar as características da condição de tempo com

  instabilidade.

  • Citar as características da condição de tempo com estabilidade.

  • Citar as características da estabilidade do ar.

  • Citar as características da instabilidade condicional do ar.

  4.1 Estabilidade da atmosfera'
