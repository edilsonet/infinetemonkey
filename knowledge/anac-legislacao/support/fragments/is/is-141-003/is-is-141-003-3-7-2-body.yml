text: '3.7.2 Penhora e apreensão -- Casos em que podem ocorrer

  4 Infraestrutura aeronáutica

  Objetivos específicos Subunidades

  4.1

  • Definir aeródromos e helipontos de acordo com os

  respectivos conceitos jurídicos.

  • Classificar juridicamente os aeródromos e os helipontos.

  • Classificar juridicamente os aeródromos civis.

  • Indicar os tipos de aeródromos que podem ser utilizados

  por aeronaves civis.

  • Citar as restrições ao uso de aeródromos públicos e

  privados.

  • Definir aeroporto, heliporto e aeroporto internacional de

  acordo com os respectivos conceitos jurídicos.

  4.2

  4.1 Sistema aeroportuário'
