title: Divisão dos serviços de tráfego aéreo
text: '3.8.1.1 Divisão dos serviços de tráfego aéreo

  - serviço de controle de tráfego aéreo,

  compreendendo o serviço de controle de área, o

  serviço de controle de aproximação e o serviço

  de controle de aeródromo;

  - serviço de informação de voo; e

  - serviço de alerta.'
