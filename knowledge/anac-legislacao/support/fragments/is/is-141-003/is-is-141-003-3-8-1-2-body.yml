title: Voos para os quais é proporcionado o
text: '3.8.1.2 Voos para os quais é proporcionado o

  serviço de controle de tráfego aéreoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar como a separação entre aeronaves deverá ser efetuada por um órgão

  ATC.

  • Descrever como é obtida a separação vertical.

  • Explicar os termos separação vertical, separação horizontal e separação

  composta.

  • Identificar a separação vertical mínima exigida.

  • Descrever como as altitudes mínimas e menores níveis de voo utilizáveis

  correspondem um ao outro.

  • Descrever como os níveis de cruzeiro de aeronaves voando para o mesmo

  destino na sequência de aproximação e espera estão correlacionados entre si.

  • Identificar as condições que devem ser observadas, quando duas aeronaves estão

  habilitadas para manter uma separação vertical especificada entre elas durante a

  subida ou descida.

  • Citar os dois principais métodos para a separação horizontal.

  • Descrever como pode ser obtida a separação lateral de aeronaves no mesmo

  nível.

  • Descrever as circunstâncias sob as quais uma redução de mínimos de separação

  pode ser permitida.

  • Identificar as condições para as autorizações de controle de tráfego aéreo

  relativas à fase de aceleração transônica de um voo supersônico.

  • Listar as autorizações e instruções transmitidas de forma oral, relacionadas com

  a segurança, que o piloto em comando deverá cotejar (repetir) para o controlador

  de tráfego aéreo.

  • Justificar a finalidade do cotejamento das autorizações e instruções fornecidas

  pelos órgãos ATC.

  3.10

  • Explicar a forma estabelecida pela regulamentação para a utilização do Tempo

  Universal Coordenado (UTC) pelos órgãos ATS, tripulações e demais pessoas

  envolvidas com a operação de aeronaves.

  3.11

  • Definir “operação militar” para fins de tráfego aéreo.

  • Descrever as regras estabelecidas para aeronaves em operação militar.

  3.12

  • Definir tráfego essencial.

  • Descrever as regras estabelecidas para o tráfego essencial.

  3.13

  • Identificar o modo e o código do equipamento transponder um piloto pode operar

  em um estado geral de emergência ou, especificamente, no caso de a aeronave

  estar sujeita a interferência ilícita.

  • Identificar os direitos especiais que uma aeronave em estado de emergência pode

  esperar dos órgãos ATC.

  • Descrever a ação esperada de uma aeronave depois de receber uma transmissão

  de ATS sobre a descida de emergência.

  3.14

  • Citar as medidas a serem tomadas quando os órgãos ATC não puderem manter

  comunicação bilateral com uma aeronave em voo.

  • Descrever os procedimentos constantes na publicação específica do DECEA

  sobre as Regras do Ar a serem executados pelas aeronaves no caso de falha de

  comunicação.

  3.15'
