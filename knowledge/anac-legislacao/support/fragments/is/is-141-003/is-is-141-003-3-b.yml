title: 3(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,

  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir

  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou

  outro ato normativo.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  3.5 A concessão da aprovação de curso depende do atendimento integral, pela instituição

  solicitante, dos requisitos previstos na legislação aplicável, em especial no CBA (art.
  98)

  e RBAC nº 141.'
