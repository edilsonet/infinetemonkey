text: '4.1.1 Conteúdo: tipo, uma descrição completa, como

  indicado nas Instruções Técnicas da OACI e/ou nos

  regulamentos sobre artigos perigosos da IATA,

  rotulagem, quantidade, número da ONU, classificação,

  localização no avião e (se aplicável) detalhes de

  acessibilidade em voo.

  4.2 Conhecimento aéreo'
