text: '4.1.3 Usos práticos do PNR: no plano de voo, em rotaData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  • Demonstrar a aplicação do PNR nos casos que envolvem

  retornar ao aeroporto de partida e proceder ao aeroporto

  alternativo, com todos os motores operacionais ou com

  falha de motor.

  4.2

  • Identificar o significado do ponto crítico na navegação de

  aeronaves.

  • Realizar estimativa de ponto crítico utilizando dados reais

  de voos.

  • Calcular PC por fórmula básica para as condições sem

  vento, com rajadas de vento e com vento forte de cauda.

  • Estabelecer a condição de vento para máximo PC

  • Demonstrar a aplicação do PC nos casos que envolvem

  retornar ao aeroporto de partida e proceder ao aeroporto

  alternativo, com todos os motores operacionais ou com

  falha de motor.

  4.3

  • Descrever Sistema de Navegação Inercial, Sistema Global

  de navegação por satélite (GNSS), sistema de navegação

  visual.

  • Identificar os métodos gerais de fixação da posição.

  • Descrever e aplicar as formas de se obter os fixos de

  posição.

  4.2 Ponto crítico (PC)'
