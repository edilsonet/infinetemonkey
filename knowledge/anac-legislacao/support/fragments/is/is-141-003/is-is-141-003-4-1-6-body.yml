title: 'Atitudes de riscoData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '4.1.6 Atitudes de riscoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Discutir a provável influência da promoção na carreira (por exemplo,

  de copiloto para comandante) no auto-conceito de um indivíduo.

  • Definir "auto-disciplina" e justificar a sua importância para a

  segurança de voo.

  • Citar exemplos de estados mentais e comportamentos que ponham em

  risco a segurança de voo.

  • Resumir como a atitude de uma pessoa influencia no desempenho de

  sua tarefa.

  4.2

  • Definir os termos "decisão" e "tomada de decisão".

  • Descrever a estrutura (fases) do processo de tomada de decisão na

  aviação.

  • Descrever as capacidades positivas do ser humano na tomada de

  decisão.

  • Descrever as principais fontes de erro e limites no mecanismo de

  decisão de um indivíduo.

  • Descrever as influências negativas e positivas exercidas por outros

  membros do ambiente operacional no processo decisório de um

  indivíduo.

  • Identificar os fatores sobre os quais se baseia a avaliação de risco de

  um indivíduo.

  • Explicar a relação entre a avaliação de risco, compromisso e pressão

  do tempo sobre as estratégias de tomada de decisão.

  • Enfatizar a necessidade de profissionais DOV em contribuir

  ativamente para aumentar a sua habilidade de avaliação de risco.

  • Descrever os principais fatores em que a tomada de decisão deve ser

  baseada no decorrer de um voo.

  • Explicar a ideia geral por trás da criação de um modelo para a tomada

  de decisão com base em:

  •

  4.2 A tomada de decisão'
