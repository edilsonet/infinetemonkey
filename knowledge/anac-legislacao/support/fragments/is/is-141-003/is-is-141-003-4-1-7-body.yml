text: '4.1.7 Uso das cartas oficiais no planejamento: FPC (Flight Planning

  Chart) e ENRC (Enroute Chart). Cartas DECEA e cartas

  Jeppesen.

  4.2 Círculo máximo (great circle) em relação à trajetória de

  tempo mínimo (minimum time track - MTT)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Utilizar, na determinação de distâncias mínimas e

  trajetórias de voo, as correções requeridas pela altitude do

  aeródromo, gradiente efetivo de pista, temperatura

  ambiente e componente do vento no momento da

  decolagem.

  4.3

  • Desenhar trajetória de tempo mínimo na carta de

  navegação, considerando as limitações do espaço aéreo.'
