text: '4.2.2 Programas relacionados à prevenção de acidentes

  aeronáuticos: Programa de Controle do Risco Aviário e Fauna;

  Programa de Gerenciamento dos Recursos da Tripulação

  (CRM); Programa de Gerenciamento do Risco Operacional

  (PGRO); Programa de Prevenção contra a Utilização de Drogas

  e Álcool; Programa de Prevenção de Colisão com o

  Solo em Voo Controlado (CFIT); Programa de Prevenção de

  Acidentes com Carga Perigosa; Programa de Prevenção de

  Incursão em Pista; Programa de Prevenção de Danos Causados

  por Objetos Estranhos (FOD) -- Visão geral. Normas vigentesData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  4.3 Normas do CENIPA'
