text: '4.2.3 Relação entre linha reta e círculo máximo

  4.3 Seleção de trajetória de tempo mínimo a partir de

  alternativas

  -- Cálculo do componente médio do vento para cada rota.

  5 Planejamento das fases de um voo

  Objetivos específicos Subunidades

  5.1

  • Citar as finalidades da subida de maior ângulo, da subida

  de maior razão, da subida de menor consumo, da subida de

  menor tempo e da subida econômica.

  • Citar a finalidade da velocidade de subida que assegura a

  penetração em turbulência.

  • Citar as informações encontradas nas tabelas e gráficos de

  subida em rota contidos nos manuais de voo.

  • Interpretar as informações encontradas nas tabelas e

  gráficos de subida em rota contidos nos manuais de voo.

  5.2

  • Definir atitude ótima de cruzeiro, altitude ideal de cruzeiro

  para distâncias curtas, altitude máxima de cruzeiro

  limitada pelos motores e altitude para proteção de estol.

  • Explicar a importância da aplicação, no planejamento de

  voo, dos diferentes níveis de cruzeiro.

  • Determinar os níveis de cruzeiro com auxílio de tabelas e

  gráficos dos manuais de voo.

  • Definir regime de máximo alcance, regime de longo

  alcance, regime de máxima autonomia, regime de

  velocidade máxima, regime de velocidade constante e

  regime econômico.

  • Explicar a importância da aplicação, no planejamento de

  voo, dos diferentes regimes de cruzeiro.

  • Determinar os regimes de cruzeiro com auxílio de tabelas

  e gráficos dos manuais de voo.

  • Definir step climb.

  • Explicar a importância da utilização do step climb no

  planejamento de voo.

  • Determinar o setp climb com auxílio de tabelas e gráficos

  dos manuais de voo.

  • Evidenciar a importância da velocidade de cruzeiro que

  assegura a penetração em turbulência.

  • Definir alcance específico.

  • Descrever as influências exercidas, no rendimento da

  aeronave em diferentes regimes de cruzeiro, pelo vento,

  pela temperatura do ar, pela turbulência, pelo peso da

  aeronave, pelo nível a ser voado, pela velocidade da

  aeronave, pela configuração da aeronave e pelos limites do

  motor.

  5.1 Subida'
