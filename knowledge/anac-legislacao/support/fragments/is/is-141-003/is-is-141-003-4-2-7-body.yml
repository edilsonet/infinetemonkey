text: '4.2.7 Criação de um modelo de tomada de decisão com

  base em:

  -- definição do objetivo,

  -- coleta de informações,

  -- avaliação de risco,

  -- desenvolvimento de opções,

  -- avaliação de opções,

  -- decisão,

  -- implementação,

  -- consequências,

  -- revisão e feedback

  5 Gerenciamento da carga de trabalho

  Objetivos específicos Subunidades

  • 5.1

  • Citar alguns ritmos internos do corpo.

  • Explicar o termo "ritmo circadiano".

  • Estabelecer a duração aproximada de um ritmo circadiano normal.

  • Identificar o efeito dos ritmos circadianos de temperatura corporal

  sobre o desempenho de um indivíduo e em seus padrões de sono.

  • Listar e descrever os estágios do sono e diferenciar entre sono REM e

  sono não-REM.

  • Explicar as funções do sono REM o do não-REM.

  • Explicar os efeitos do déficit de sono sobre o desempenho de um

  indivíduo.

  • Reconhecer que o déficit de sono pode ser cumulativo.

  • Concluir que a atitude de um DOV deve ser proativa em relação ao

  sono, considerando próximos períodos de trabalho e planejando o sono

  em conformidade.

  • 5.2

  • Definir ''excitação''.

  • Descrever a relação entre excitação e desempenho.

  5.1Ritmos do corpo e sono'
