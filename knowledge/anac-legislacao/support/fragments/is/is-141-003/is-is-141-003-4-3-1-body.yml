text: '4.3.1 Aplica as regras de controle do tráfego aéreo relativas a:

  - procedimentos de transição;

  - rotas de chegada padrão do terminal (STAR);

  - cartas e procedimentos de aproximação por instrumentos;

  - procedimentos de aproximação de precisão e de não precisão.'
