title: Autorizações para voar mantendo a
text: '4.3.10 Autorizações para voar mantendo a

  própria separação quando em condições

  meteorológicas visuais

  5 Serviço de controle de aproximação

  Objetivos específicos Subunidades

  5.1

  • Citar as atribuições e os objetivos dos órgãos de controle de aproximação (APP).

  • Listar as obrigações dos pilotos em comando das aeronaves quando estiverem

  voando com plano IFR dentro de CTR ou TMA.

  • Reconhecer a existência da obrigatoriedade da autorização do APP para entrada,

  em CTR ou em TMA, de qualquer aeronave com Plano de Voo IFR.

  • Identificar a jurisdição e a subordinação operacional de um APP.

  5.2

  • Descrever o que deve ser especificado nas autorizações de controle de tráfego

  aéreo para as aeronaves que saem.

  • Citar a separação vertical mínima entre aeronaves requerida em voo IFR.

  • Evidenciar, com relação à separação vertical mínima entre as aeronaves voando

  IFR e os obstáculos no solo, a importância do cumprimento dos procedimentos

  de aproximação e de saída publicados pelo DECEA.

  • Reconhecer a possibilidade de um APP dar autorização a uma aeronave que parte

  para que suba, cuidando da sua própria separação em condições meteorológicas

  de voo visual, até uma hora ou um lugar especificado, se as informações

  existentes indicarem que é possível.

  • Reconhecer as informações que devem ser fornecidas pelo APP após estabelecer

  comunicação com as aeronaves que saem.

  5.3

  • Descrever os procedimentos gerais para as aeronaves que chegam.

  • Descrever o que deve ser especificado nas autorizações de controle de tráfego

  aéreo para as aeronaves que chegam.

  • Descrever as informações que o, o APP deverá transmitir às aeronaves ao iniciar

  e durante a aproximação final.

  • Definir aproximação visual.

  5.1 Visão Geral'
