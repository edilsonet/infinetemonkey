title: Protocolos de investigação de ocorrências aeronáuticas da
text: '4.3.3 Protocolos de investigação de ocorrências aeronáuticas da

  aviação civil conduzidas pelo Estado Brasileiro - NSCA 3-13 -

  - Visão geral. Recomendações de Segurança Operacional

  emitidas pelo SIPAER. Responsabilidade dos operadores de

  aeronaves em caso de acidente e incidente aeronáutico e

  ocorrência de solo. Notificação e confirmação de ocorrências

  no âmbito do SIPAER

  4 Sistema de Gerenciamento de Segurança Operacional - SGSO

  Objetivos Específicos Subunidades

  4.1

  • Definir o Sistema de Gerenciamento de Segurança Operacional

  (SGSO).

  • Definir nível aceitável de segurança operacional (NASO).

  • Definir gerenciamento de risco.

  • Identificar os objetivos e as diretrizes estabelecidos no Programa

  Brasileiro para a Segurança Operacional da Aviação Civil (PSO-

  BR) e no Programa de Segurança Operacional Específico da

  4.2

  • Sumariar a atuação das empresas de transporte aéreo no

  gerenciamento da segurança operacional.

  • Listar os itens requeridos para o Manual Geral de Operações

  (MGO)

  • Identificar os requisitos mínimos de um Sistema de

  Gerenciamento de Segurança Operacional (SGSO) de empresa

  de transporte aéreo.

  4.1 Sistema de Gerenciamento de Segurança Operacional -

  SGSO (Safety Management System - SMS)'
