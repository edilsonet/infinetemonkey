title: 'Coordenação das autorizações ATCData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '4.3.8 Coordenação das autorizações ATCData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  • Descrever a responsabilidade de cada órgão quanto à emissão de autorizações

  ATC para as aeronaves partindo.

  • Descrever os procedimentos para emissão de autorizações ATC para as

  aeronaves em rota.

  • Descrever os procedimentos a serem executados pelos pilotos para comunicar

  mudança de nível ou de altitude de voo autorizado.

  • Listar as informações contidas nas autorizações ATC.

  • Explicar como limite de autorização deve ser descrito, de acordo com a ICA 100-

  37.

  • Explicar o significado de ponto limite de autorização.

  • Explicar de que forma a rota de voo é detalhada na autorização.

  • Explicar em que consistem as instruções incluídas nas autorizações referentes a

  níveis.

  • Descrever o conteúdo das autorizações para modificação do plano de voo

  • Explicar de que forma a autorização ATC é coordenada entre os órgãos ATC

  para abranger a rota inteira da aeronave ou uma parte específica dela.

  • Identificar o órgão que emite e o conteúdo da autorização padronizada para

  aeronaves partindo.

  • Descrever os procedimentos a serem adotados pelo piloto no caso de

  autorizações para voar mantendo a própria separação quando em condições

  meteorológicas visuais.'
