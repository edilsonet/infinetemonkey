cite: 4.4.2
title: Instrumentos e equipamentos que devem ser aprovados e
text: '4.4.2 Instrumentos e equipamentos que devem ser aprovados e

  instalados segundo os requisitos de aeronavegabilidade

  aplicáveisData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descrever as limitações de rota com um motor inoperante para

  aviões com motores a turbina.

  • Descrever as limitações de rota com dois motores inoperantes

  para aviões categoria transporte com motores a turbina.

  • Descrever as limitações de pouso no aeródromo de destino e no

  aeródromo de alternativa para aviões com motores a turbina.

  • Descrever os requisitos de aumento dos pesos zero combustível

  e de pouso para aviões categoria transporte cargueiros.

  4.4

  • Explicar a aplicabilidade da Subparte K do RBAC 121.

  • Listar os equipamentos e instrumentos de voo e de navegação

  que devem estar instalados em aeronaves que operem sob os

  requisitos do RBAC 121.

  • Listar os dispositivos eletrônicos portáteis permitidos a bordo de

  aeronaves que operem sob o RBAC 121.

  • Listar os instrumentos do motor que devem estar instalados em

  aeronaves que operem sob os requisitos do RBAC 121.

  • Descrever os requisitos de proteção contra fogo nas aeronaves.

  • Descrever os requisitos relativos aos equipamentos de

  emergência nas aeronaves.

  • Descrever os requisitos relativos ao compartimento de carga das

  aeronaves.

  • Detalhar as regras relativas ao transporte e utilização de oxigênio

  nas aeronaves.

  • Descrever os requisitos mínimos de oxigênio suplementar a ser

  fornecido em aviões pressurizados durante e após uma descida

  de emergência.

  • Listar os objetivos do gravador de dados de voo. (FDR).

  • Listar os objetivos do gravador de voz.

  • Reconhecer a responsabilidade do operador em relação à

  preservação de documentos e gravações.

  • Descrever os procedimentos relativos a tesouras de ventos.

  4.5

  • Identificar a aplicabilidade da Subparte M do RBAC 121.

  • Identificar os documentos legais que regulam a composição de

  tripulações de voo.

  • Descrever as funções do DOV.

  • Justificar a obrigatoriedade de cada detentor de certificado ETA,

  conduzindo operações domésticas ou de bandeira manter em

  cada escritório ou centro de despacho uma quantidade suficiente

  de DOV.

  4.6

  • Identificar a aplicabilidade da Subparte N do RBAC 121.

  • Explicar o significado dos termos associados a treinamento.

  • Definir as responsabilidades do operador aéreo no que se refere

  aos programas de treinamento de pessoal.

  • Descrever os requisitos relativos aos programas de treinamento

  dos operadores aéreos.

  • Listar as qualificações necessárias para o instrutor e o

  examinador credenciado para DOV.

  • Definir treinamento inicial, de transição, de diferenças e

  periódico.

  4.7

  • Identificar a aplicabilidade da Subparte P do RBAC 121.

  • Listar as qualificações necessárias para o trabalho do DOV.

  -- Equipamentos de voo e de navegação

  -- Dispositivos eletrônicos portáteis

  -- Instrumentos do motor

  -- Equipamentos de emergência

  -- Equipamento adicional de emergência

  -- Compartimentos de carga e bagagem

  -- Tanques de combustível

  -- Instrumentos e equipamentos para operação noturna

  -- Instrumentos e equipamentos para operações IFR

  -- Oxigênio suplementar: aviões com motores convencionais

  -- Oxigênio suplementar para subsistência. Aviões com

  motores a turbina

  -- Requisitos de oxigênio suplementar para aviões com cabine

  pressurizada. Aviões com motores convencionais

  -- Oxigênio suplementar para descidas de emergência e para

  primeiros socorros. Aviões pressurizados com motores a

  turbina

  -- Padrão dos equipamentos de oxigênio

  -- Equipamento protetor de respiração (PBE - protective

  breathing equipment)

  -- Equipamento de emergência para operações sobre grandes

  extensões de água

  -- Meios de flutuação requeridos

  -- Equipamento para operação em condições de gelo

  -- Sistema de indicação do aquecimento do pitot

  -- Gravador de dados de voo

  -- Gravadores digitais de dados de voo para aviões categoria

  transporte

  -- Equipamento-rádio

  -- Equipamento-rádio requerido para operações VFR em rotas

  onde a navegação por contato é autorizada'
