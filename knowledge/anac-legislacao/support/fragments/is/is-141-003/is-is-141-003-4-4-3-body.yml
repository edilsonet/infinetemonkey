title: Equipamento de navegação e comunicações
text: '4.4.3 Equipamento de navegação e comunicações

  -- Requisitos gerais

  -- Equipamento-rádio para operação sobre grandes extensões

  de água e para outras operações

  -- Equipamento de emergência para operação sobre terreno

  desabitado; operações suplementares, de bandeira e algumas

  operações domésticas

  -- Sistema de percepção e alarme de proximidade do solo

  -- Equipamento para operações nas quais meios especializados

  de navegação são utilizados

  -- Sistema embarcado de prevenção de colisões (ACAS)

  -- Requisitos para radar meteorológico de bordo

  -- Requisitos para sistema de detecção de tesouras de vento

  ("windshear") em baixa altitude

  -- Gravadores de voz na cabine de comando

  4.5 Subparte M - Requisitos de tripulantes, despachantes e

  mecânicos'
