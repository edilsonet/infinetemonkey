text: '4.4.5 Acoplamento do piloto automático

  5 Navegação Aérea Baseada em Desempenho (PBN)

  Objetivos Específicos Subunidades

  5.1

  • Identificar a finalidade do CNS-ATM e do Projeto

  SIRIUS.

  • Descrever as novas tecnologias empregadas na aviação:

  CPDLC e ADS e sua utilização.

  • Definir Navegação Aérea Baseada em Desempenho

  (PBN)

  • Definir os seguintes termos: Navegação de Área

  (RNAV); Performance de Navegação Requerida (RNP);

  Separação Vertical Mínima Reduzida (RVSM); Sistema

  de Navegação Inercial (Inertial Navigation System -

  5.1 Comunicação, Navegação, Vigilância e Gerenciamento de

  Tráfego Aéreo - CNS-ATM'
