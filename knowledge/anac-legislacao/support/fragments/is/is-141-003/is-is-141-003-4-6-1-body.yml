title: Determinação dos seguintes itens para as condições
text: '4.6.1 Determinação dos seguintes itens para as condições

  específicas de cada voo:

  - peso operacional máximo permitido para decolagem (maximum

  permissible take-off operating mass -MPTOW) e peso restrito de

  decolagem (regulated take-off weight - RTOW)

  - combustível mínimo (minimum fuel - MF)

  - combustível de taxi (taxi fuel - TF).'
