title: Programa de treinamento -- Requisitos gerais. Regras
text: '4.6.2 Programa de treinamento -- Requisitos gerais. Regras

  especiais. CurrículosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Descever os requisitos de limitação de tempo de serviço para o

  DOV, nas operações domésticas e de bandeira.

  4.8

  • Identificar a aplicabilidade da Subparte T do RBAC 121.

  • Reconhecer as responsabilidades do operador em relação às

  operações das aeronaves.

  • Indicar a regulamentação relativa ao transporte de pessoas em

  um avião.

  • Reconhecer as responsabilidades do operador e do piloto em

  comando sobre o acesso à cabine de voo e o transporte de

  pessoas não autorizadas ou carga.

  • Reconhecer a responsabilidade dos operadores, relativa aos

  dispositivos eletrônicos portáteis.

  • Indicar os regulamentos relativos à segurança em situações de

  perigo.

  • Lista os documentos a serem produzidos para cada voo.

  • Reconhecer a responsabilidade do operador sobre os manuais da

  aeronave.

  • Listar as informações e formulários adicionais a serem

  transportados a bordo.

  • Listar as informações e os documentos relevantes a serem

  mantidos no solo pelo operador.

  • Reconhecer a responsabilidade do operador sobre inspeções de

  manutenção.

  • Detalhar os itens a serem verificados pelo piloto em comando no

  registro de manutenção, antes da aceitação para o voo.

  • Apontar a responsabilidade do operador e do piloto em comando

  em relação à produção e ao acesso aos registros e documentos da

  aeronave.

  • Apontar a responsabilidade do operador e do comandante em

  relação à produção e ao acesso aos registros e documentos

  relativos à operação da aeronave.

  • Relacionar as regras de conformidade / não conformidade com

  os mínimos de operação do aeródromo.

  • Indicar a quem e em que circunstâncias é permitido o transporte

  de armas a bordo de um avião.

  4.9

  • Listar os fatores considerados no estabelecimento da altitude

  mínima de voo.

  • Especificar a altitude de cruzeiro ideal para uma aeronave e

  indicar o efeito de selecionar uma altitude maior ou menor.

  • Utilizar a tabela para calcular a altitude de cruzeiro ideal.

  • Descrever os requisitos do RBAC 121 relativos ao

  estabelecimento de altitude mínima de voo.

  • Identificar as circunstâncias em que um aeródromo alternativo

  de decolagem deve ser selecionado.

  • Especificar as condições a serem satisfeitas para que um

  aeródromo a ser considerado adequado como um aeródromo

  alternativo de decolagem.

  • Identificar a distância máxima de voo de um aeródromo

  alternativo para: i) avião com dois motores; ii) avião com

  ETOPS aprovado; e iii) avião com três ou quatro motores.

  • Indicar quando dois aeródromos alternativos de destino devem

  ser selecionados.

  • Listar os fatores a serem considerados na seleção de um

  alternativo de descolagem.

  • Listar os fatores a serem considerados na seleção de um

  aeródromo alternativo de destino.'
