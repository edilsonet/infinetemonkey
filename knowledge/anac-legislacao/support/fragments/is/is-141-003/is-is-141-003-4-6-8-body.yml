text: '4.6.8 Direção e velocidade do vento (Wind direction and speed)

  5 Produção escrita

  Objetivos Específicos Subunidades

  • Produzir pequenos textos em inglês destinados à

  comunicação eletrônica simples, observando os

  princípios da coesão e coerência.

  • Produzir pequenos textos em inglês sobre assuntos

  dos manuais das aeronaves típicas com as quais um

  DOV trabalha, observando os princípios da coesão e

  coerência.

  • Produzir pequenos textos em inglês relativos aos

  voos, aeronaves e aeródromos, observando os

  princípios da coesão e coerência.

  5.1 Saudações e despedidas (Opening and closing messages)

  5.2 Textos para solicitação de procedimentos (Texts about procedures)

  5.3 Textos informativos destinados aos seus pares e aos pilotos em

  comando (Informative texts)

  5.4 Relatórios breves (Brief reports)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
