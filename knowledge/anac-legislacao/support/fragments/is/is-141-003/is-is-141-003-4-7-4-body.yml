text: '4.7.4 Base de cálculo para centro de gravidade na decolagem e no

  pouso

  5 Aspectos estruturais do carregamento de aeronaves

  Objetivos Específicos Subunidades

  5.1

  • Identificar as limitações estruturais da fuselagem e do piso que

  devem ser observadas no carregamento de uma aeronave.

  • Explicar a finalidade da amarração e da fixação da carga nos

  pisos da aeronave.

  • Descrever as forças desenvolvidas pela carga durante o voo.

  5.2

  • Citar os elementos constituintes do compartimento de carga.

  • Descrever os efeitos das forças desenvolvidas pela carga

  durante o voo: na fuselagem, nas asas e no trem de pouso.

  5.3

  • Definir resistência local do piso.

  • Calcular o peso e o volume de carga que possa ser suportada

  pelo piso de cada setor do porão de uma aeronave.

  • Utilizar tabelas de volumes máximos ou de cubagem

  fornecidas pelos fabricantes das aeronaves para calcular o

  5.1 Resistência da fuselagem'
