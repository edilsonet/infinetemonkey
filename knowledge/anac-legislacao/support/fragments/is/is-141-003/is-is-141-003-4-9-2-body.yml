title: Operações domésticas e de bandeira -- Autoridade de
text: '4.9.2 Operações domésticas e de bandeira -- Autoridade de

  despacho de voo. Responsabilidade pelo despacho de voo.Data de emissão: 22 de dezembro de
  2017. IS nº 141-003

  Revisão A

  • Indicar os fatores a serem considerados na escolha de um

  aeródromo alternativo em rota.

  • Indicar o requisito operacional sobre o percentual máximo da

  distância disponível para aterrissagem que pode ser planejado ou

  replanejado em voo a ser utilizada no destino e em qualquer

  aeródromo alternativo por: i) um avião turbo-jato com

  desempenho classe A; ii) um avião turboélice com desempenho

  classe A; iii) um avião de desempenho B; e iv) um avião de

  desempenho C.

  • Indicar quando um destino alternativo não precisa ser

  selecionado.

  • Especificar os requisitos de combustível e de óleo para o voo

  para aviões a hélice ou aviões turbo-reatores, com ou sem um

  destino alternativo indicado.

  • Especificar as considerações para o cálculo de combustível e

  óleo.

  • Indicar as regras a serem obedecidas durante o reabastecimento

  com passageiros a bordo.

  • Descrever os requisitos relativos ao plano de voo operacional.

  4.10

  • Listar as informações obrigatórias que devem fazer parte dos

  documentos de despacho de voo, nas operações domésticas e de

  bandeira.

  • Listar as informações obrigatórias que devem fazer parte dos

  documentos de liberação de voo, nas operações suplementares.

  • Listar as informações obrigatórias que devem fazer parte do

  manifesto de carga.

  • Listar os documentos obrigatórios a serem mantidos a bordo pelo

  piloto em comando, até o destino.

  4.11

  • Explicar a finalidade do Programa de Qualificação Avançada

  (AQP).

  • Identificar os requisitos gerais para o AQP descritos no RBAC

  121.

  • Explicar o significado dos termos relacionados ao AQP.

  4.12

  • Identificar os requisitos para operações ETOPS para aviões com

  dois motores, com mais de dois motores e para as operações de

  rotas de aviões que planejem atravessar a área polar sul.

  Informações do despachante para o piloto em comando.

  Facilidades de comunicações e de navegação'
