title: Requisitos para despacho ou liberação de voo
text: '4.9.6 Requisitos para despacho ou liberação de voo

  -- Despacho ou liberação de voo: sob regras visuais (VFR); sob

  regras de voo por instrumentos (IFR); sobre grandes extensões

  de água

  -- Despacho ou liberação inicial de voo, redespacho e

  modificação de despacho ou de liberação de voo

  -- Despacho após, ou antes de, um reabastecimento em

  aeródromos não listados nas E.O. do detentor de certificado.'
