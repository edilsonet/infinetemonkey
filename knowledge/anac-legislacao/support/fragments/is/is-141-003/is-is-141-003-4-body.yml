title: DEFINIÇÕES
text: '4. DEFINIÇÕES

  4.1 Para os propósitos desta IS, são empregadas as definições contidas nos seguintes

  Regulamentos Brasileiros de Aviação Civil (RBAC) e Regulamentos Brasileiros de

  Homologação Aeronáutica (RBHA), ou documentos que venham a substituí-los: RBAC

  nº 01, RBHA 65, RBHA 91, RBAC nº 121, RBAC nº 129, RBAC nº 135 e RBAC nº 141

  e, complementarmente, em futura Instrução Suplementar que tratará Princípios e

  Orientações Pedagógicas para a Formação Baseada em Competências na Aviação Civil.'
