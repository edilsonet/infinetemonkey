title: A Organização da Aviação Civil Internacional (OACI) desenvolveu as chamadas
text: '5.1.1.1 A Organização da Aviação Civil Internacional (OACI) desenvolveu as chamadas

  Normas e Práticas Recomendadas (SARP), que são detalhadas em 18 anexos. O

  conteúdo é vinculativo para todos os Estados contratantes, com exceção das "práticas

  recomendadas", que não são obrigatórias. As disposições aplicáveis aos despachantes

  operacionais de voo podem ser encontradas no Anexo 1 - Licenciamento de Pessoal e

  no Anexo 6 - Operação de Aeronaves.'
