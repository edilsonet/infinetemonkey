text: '5.1.1.6 Esta IS foi elaborada com base nos documentos citados e na experiência de uma
  equipe

  multidisciplinar formada por Especialistas e Técnicos em Regulação da ANAC, nas áreas

  de Pedagogia e Linguística, Despachantes Operacionais de Voo e Pilotos com ampla

  experiência profissional. Este documento estabelece o currículo mínimo para a formação

  teórica e prática do DOV.'
