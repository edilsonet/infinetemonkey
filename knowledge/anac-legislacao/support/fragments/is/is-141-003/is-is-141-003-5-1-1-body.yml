title: Motor de partida/gerador - Finalidade.
text: '5.1.1 Motor de partida/gerador - Finalidade.

  Funcionamento. Limitações operacionais mais comuns e

  respectivas proteções operacionaisData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Citar as funções exercidas pelos acumuladores de tensão (baterias) no

  sistema elétrico.

  • Relacionar, às restrições correspondentes, as mais comuns limitações

  operacionais da atuação dos acumuladores de tensão (baterias).

  5.2

  • Citar as finalidades do sistema elétrico principal e do sistema elétrico

  alternativo ou de emergência.

  • Descrever o funcionamento do sistema elétrico principal.

  • Descrever o funcionamento do sistema elétrico alternativo ou de

  emergência.

  • Identificar os principais componentes do sistema elétrico do avião

  multimotor.

  • Identificar as unidades acionadas pelo sistema elétrico do avião

  multimotor.

  • Discorrer sobre as consequências das deficiências de funcionamento

  do sistema elétrico de uma aeronave em voo.'
