cite: 5.1.2.2(c)
title: 5.1.2.2(c)
text: '(c) O despachante operacional de voo é responsável por:

  (1) acompanhamento do progresso de cada voo;

  (2) emissão de informações necessárias à segurança do voo; e

  (3) cancelamento ou redespacho do voo se, em sua opinião ou na opinião do piloto em

  comando, o voo não puder ser realizado ou continuado com a segurança com que foi

  originalmente planejado ou liberado.”

  [...]

  121.593'
