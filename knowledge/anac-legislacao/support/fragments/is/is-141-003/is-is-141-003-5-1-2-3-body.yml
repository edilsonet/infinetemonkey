title: Pelo exposto, percebe-se que a regulamentação nacional confere ao DOV uma posição de
text: '5.1.2.3 Pelo exposto, percebe-se que a regulamentação nacional confere ao DOV uma posição
  de

  destaque, com deveres que vão além das tarefas de apoio e auxílio descritas no Anexo 6

  da OACI. Os RBAC atribuem um alto grau de responsabilidade ao DOV, interligando-a

  com a responsabilidade do piloto em comando. Neste sistema, o DOV é colocado no cerne

  das operações, já que ele é o centro da informação que flui de e para a tripulação da

  aeronave, e provém dos órgãos de controle de tráfego aéreo, dos escritórios

  meteorológicos e do controle de operações da companhia aérea.

  5.2 Definição do perfil de conclusão'
