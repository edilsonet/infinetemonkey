title: 'Direção, velocidade e caráter - Medição: unidades de'
text: '5.1.2 Direção, velocidade e caráter - Medição: unidades de

  medida. Métodos de medição de velocidade dos ventos

  5.2 Forças que atuam sobre os ventosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Definir cada uma das forças atuantes sobre o vento.

  • Explicar as interferências de cada uma das forças atuantes

  sobre os ventos na formação, na intensidade e na trajetória dos

  mesmos.

  • Definir vento barostrófico e vento geostrófico.

  5.3

  • Explicar a movimentação dos ventos nas áreas de alta pressão

  e nas áreas de baixa pressão.

  • Citar as características do voo de uma alta pressão para uma

  baixa pressão.

  • Citar as características do voo de uma baixa pressão para uma

  alta pressão.

  5.4

  • Definir zona de transição, circulação nos níveis inferiores e

  circulação superior.

  • Citar as características da zona de transição, da circulação

  inferior e da circulação superior.

  • Definir ventos contra-alíseos, jatos de este, corrente de Berson,

  vórtices polares e corrente de jato (jet stream).

  • Caracterizar a corrente de jato (jet stream) quanto às

  dimensões, à velocidade, à direção geral, à estrutura, à

  flutuação, à duração, à jatogênese, à jatólise, à frequência com

  que ocorre, à nebulosidade, à isotermia e também, quanto à

  turbulência que produz (Clear Air Turbulence - CAT).

  5.5

  • Definir brisas marítimas, brisas terrestres, ventos de vale,

  ventos de montanha, ventos anabáticos, ventos catabáticos,

  ventos constantes, ventos de rajada, ventos alinhados com a

  pista e ventos de través (ou ventos cruzados).

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes das influências exercidas nas decolagens e nos

  pousos de aviões pelos diversos tipos de ventos em seus

  diferentes níveis de intensidade.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes das influências exercidas nos voos em rota de

  aviões pelos diversos tipos de ventos em seus diferentes níveis

  de intensidade.

  5.6

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  ventos.

  • Interpretar e utilizar as informações meteorológicas

  concernentes a ventos.'
