text: '5.2.1 Razão de subida e ângulo de subida - DefiniçõesData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  - Definir velocidade de máxima razão de subida e velocidade de

  máximo ângulo de subida.

  - Citar os fatores que influenciam a razão de subida e o ângulo de

  subida.

  - Explicar a relação existente entre a potência disponível, a

  potência necessária e a velocidade de máxima razão de subida.

  - Definir teto máximo absoluto e teto prático ou de serviço.

  - Citar os fatores externos que influem nas variações da potência

  disponível.

  5.3

  - Definir voo reto horizontal com velocidade constante e voo reto

  horizontal com velocidade variável e suas forças.

  - Explicar a relação existente entre a potência disponível e a

  potência necessária.

  - Definir velocidade máxima, velocidade de máximo alcance,

  velocidade de máxima autonomia, velocidade mínima e

  velocidade de estol.

  - Descrever a influência da velocidade da aeronave e da altitude

  no arrasto em um voo reto horizontal.

  5.4

  - Definir voo em curva.

  - Explicar as influências da força centrífuga e da força centrípeta

  sobre a aeronave em uma curva.

  - Explicar a relação existente entre o ângulo de inclinação da

  aeronave e a variação da velocidade e do raio de uma curva.

  - Definir curva coordenada, glissada e derrapagem.

  - Explicar a relação existente entre o raio limite de uma curva e a

  potência disponível, o peso da aeronave, a altitude e a

  velocidade.

  - Explicar a utilização dos controles de voo durante as curvas.

  - Descrever as características do estol em curva.

  - Aplicar cada tabela e gráfico de performance das diversas fases

  do voo encontrado no manual de voo da aeronave.

  5.5

  - Definir voo planado.

  - Definir velocidade de planeio e ângulo de planeio.

  - Definir razão de descida.

  - Interpretar as indicações do variômetro ou indicador de subida e

  de descida (climb).

  - Definir velocidade de menor razão de descida (mínimo

  afundamento).

  - Definir velocidade final no planeio vertical.

  - Explicar a relação existente entre a velocidade final e a

  velocidade limite no planeio vertical.

  - Descrever a influência do peso da aeronave, do vento e da

  altitude no ângulo de planeio, na velocidade e na razão de

  descida.

  - Descrever a influência do uso dos flapes na trajetória de descida

  da aeronave.

  5.6

  - Descrever o perfil de pouso.

  - Explicar as influências exercidas nos limites de um pouso pelo

  peso da aeronave, pela elevação da pista, pelas condições

  meteorológicas, pelas características da pista e pela configuração

  da aeronave.'
