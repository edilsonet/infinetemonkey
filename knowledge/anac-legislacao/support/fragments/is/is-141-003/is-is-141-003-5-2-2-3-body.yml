text: '5.2.2.3 O conjunto de conhecimentos e habilidades descritos nos documentos acima citados

  resume as competências mínimas necessárias ao DOV para exercer sua atividade. A partir

  delas, foi estabelecido o perfil de conclusão do curso, apresentado na Tabela de

  Competências para o Curso de DOV, no Apêndice B desta IS.'
