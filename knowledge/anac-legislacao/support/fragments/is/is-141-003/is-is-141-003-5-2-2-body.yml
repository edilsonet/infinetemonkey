text: '5.2.2 Estresse - Definição. Tipos: fisiológico e

  psicológico. Relação entre estresse e performance.

  Fatores de estresseData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Definir o termo “estresse”.

  • Explicar por que o estresse é uma reação natural do ser humano.

  • Diferenciar entre o estresse fisiológico e psicológico.

  • Estabelecer a relação entre estresse e performance.

  • Descrever as categorias básicas de fatores de estresse.

  • Identificar os principais fatores de estresse.

  • Listar as principais fontes ambientais de estresse.

  • Citar as principais causas de estresse interno.

  • Reconhecer que fatores de estresse são subjetivos e cumulativos.

  • Explicar a relação entre estresse e ansiedade.

  • Descrever os efeitos da ansiedade sobre o desempenho humano.

  • Listar os efeitos fisiológicos e psicológicos do estresse de curto prazo

  e estresse crônico em um indivíduo.

  • Explicar como a conclusão de uma tarefa estressante pode reduzir a

  quantidade de estresse, quando uma situação semelhante surge no

  futuro.

  • Listar e descrever as estratégias de enfrentamento para lidar com

  fatores de estresse e reações de estresse.

  • Citar exemplos de gestão do stress (incluindo os programas de saúde e

  fitness, técnicas de relaxamento, práticas religiosas e técnicas de

  aconselhamento).

  • Listar as fontes e sintomas de subcarga humana.

  • Descrever o efeito da sobrecarga humana e da subcarga sobre o

  desempenho de um indivíduo.

  • Definir o termo "fadiga" e diferenciar entre a fadiga de curto prazo e

  fadiga crônica.

  • Identificar os sinais e sintomas de fadiga.

  • Identificar as causas mais comuns de fadiga.

  • Descrever os efeitos da fadiga.

  • Listar estratégias que impeçam ou retardem o aparecimento da fadiga

  e da baixa vigilância.

  • 5.3

  • Definir “equipe” e “grupo”.

  • Explicar a diferença entre grupo e equipe.

  • Discorrer sobre a influência dos relacionamentos interpessoais no

  clima do grupo.

  • Distinguir entre a cooperação e a co-ação.

  • Ilustrar a influência da interdependência em um grupo.

  • Listar as vantagens e desvantagens do trabalho em equipe.

  • Definir “sinergia”.

  • Definir o termo "coesão".

  • Definir o termo "pensamento de grupo" .

  • Discorrer sobre os fatores que dificultam a formação de equipes.

  • Indicar as condições essenciais para uma boa equipe

  • Explicar a função das normas e dos papéis em um grupo.

  • Reconhecer os diferentes padrões de papéis que ocorrem em uma

  situação de grupo

  • Explicar como o comportamento pode ser afetado pelos seguintes

  fatores: persuasão, conformidade, cumprimento e obediência.'
