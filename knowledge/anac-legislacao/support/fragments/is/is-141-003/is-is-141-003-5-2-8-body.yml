title: Informações encontradas nas tabelas e gráficos de cruzeiro
text: '5.2.8 Informações encontradas nas tabelas e gráficos de cruzeiro

  contidos nos manuais de vooData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Interpretar as informações encontradas nas tabelas e

  gráficos de cruzeiro contidos nos manuais de voo.

  5.3

  • Descrever as influências exercidas, na descida, pela

  velocidade, pelo peso, pela altitude, pelo vento, pela

  temperatura, pela tração dos motores, pelo arrasto, pelas

  sangrias de ar do motor e pelas condições adversas.

  • Definir as velocidades de descida: velocidade econômica

  e velocidade de penetração em turbulência.

  • Interpretar as informações encontradas nas tabelas e

  gráficos de descida contidos nos manuais de voo.

  5.4

  • Citar os requisitos de espera utilizados no planejamento de

  voo: requisitos de autonomia, de regime dos motores, de

  altura sobre o aeródromo de alternativa, de velocidade

  mínima e de trajetória.

  • Interpretar as informações encontradas nas tabelas e

  gráficos de espera contidos nos manuais de voo.

  • Determinar, em um planejamento de voo, o tempo de voo,

  o consumo de combustível (combustível requerido), a

  autonomia mínima, o alcance requerido, a altitude a ser

  voada e o teto operacional, com a utilização de tabelas e

  gráficos contidos nos manuais de voo da aeronave.

  5.3 Descida'
