cite: 5.3.1.1
title: Notificação de espera prolongada
text: '5.3.1.1 Notificação de espera prolongada

  devido às condições de tráfegoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Citar as condições requeridas para que o APP autorize a aproximação visual.

  • Citar a atuação do APP em caso de notificação, pelo piloto, de sua não

  familiarização com os procedimentos de aproximação IFR.

  • Explicar e que forma é estabelecida a sequência de aproximação.

  • Citar as situações em deve ser dada que prioridade especial a uma aeronave na

  aproximação.

  • Citar as condições para que aeronaves sucessivas sejam autorizadas para a

  aproximação.

  • Definir procedimentos de espera.

  • Citar os procedimentos para uma APP determinar a hora estimada de

  aproximação de uma aeronave chegando e sujeita a uma espera.

  • Citar os níveis e as respectivas velocidades utilizadas no circuito de espera sob

  condições normais e sob condições de turbulência.

  • Descrever os procedimentos de entrada paralela, os procedimentos de entrada

  deslocada e os procedimentos de entrada direta.

  • Citar os tempos na perna de afastamento em função do nível de voo.

  • Citar o ponto de início da cronometragem no circuito de espera.

  • Justificar a necessidade de correções nos procedimentos de entrada em espera,

  em razão do efeito do vento.

  • Citar os valores de razão de subida e de descida utilizados na mudança de nível

  em circuito de espera.

  • Citar o procedimento do APP em caso de previsão de espera mínima de trinta

  minutos.

  • Definir nível mínimo de espera.

  5.4

  • Explicar os procedimentos aplicados, quando a autorização de decolagem for

  baseada na posição de alguma aeronave que está chegando.

  • Descrever os procedimentos de separação ente aeronaves que saem e que

  chegam.

  5.5

  • Listar as informações meteorológicas que devem constar nas mensagens

  transmitidas para as aeronaves que chegam ou saem.

  5.6

  • Citar os procedimentos do piloto para ajuste do altímetro na aproximação e no

  pouso.

  • Definir aproximação perdida.

  • Citar a regra aplicável à atuação do piloto de aeronave impossibilitada de

  completar aproximação e pouso.

  5.7

  • Descrever o objetivo de autorizações emitidas pelos órgãos ATC em relação a

  voos VFR ou voos especiais VFR referentes a diferentes classes de espaço aéreo.'
