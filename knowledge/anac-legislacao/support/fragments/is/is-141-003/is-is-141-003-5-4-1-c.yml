cite: 5.4.1(c)
title: 5.4.1(c)
text: 'c) biblioteca, cujo funcionamento deverá facilitar a consulta e os empréstimos aos

  membros do corpo docente e do corpo discente, dotada de:

  I. livros especializados para cada componente curricular;

  II. periódicos;

  III. catálogos;

  IV. apostilas;

  V. obras de cultura geral de interesse para o futuro profissional;

  VI. manuais de operação e de voo, que incluam cartas de controle de voo de

  cruzeiro e tabelas de limites de desempenho;Data de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  VII. Guia de Rotas;

  VIII. exemplares de AIP e NOTAM de auxílios à navegação e de serviços dos

  aeroportos;

  IX. cartas meteorológicas de superfícies e de níveis, prognósticos e dados

  meteorológicos;

  X. formulários de operação de voo, inclusive planos de voo e formulários de

  mensagem;

  XI. mapas de rota, de área terminal, de pouso e de aproximação de aeroportos;

  XII. minimum equipment list - MEL e configuration deviation list - CDL.'
