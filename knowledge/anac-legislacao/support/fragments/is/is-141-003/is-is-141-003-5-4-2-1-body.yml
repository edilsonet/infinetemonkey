text: '5.4.2.1 Sistema de navegação inercial - Plataforma estabelecida

  com orientação para o norte. Dois acelerômetros. Integração das

  acelerações fornecida pela leitura contínua do curso verdadeiro e da

  velocidade do solo fornecida pela CPU (control and display unit).

  Aplicação em linha aéreas'
