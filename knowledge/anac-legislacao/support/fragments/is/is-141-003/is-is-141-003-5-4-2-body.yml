title: 'Principais estilos de liderança: orientação para a'
text: '5.4.2 Principais estilos de liderança: orientação para a

  tarefa, orientação para o relacionamento e orientação para

  a tarefa e o relacionamento.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Distinguir entre status e papel.

  • Salientar os perigos inerentes de uma situação onde há uma mistura de

  papel e status dentro do cockpit.

  • Explicar o conceito de "Procedimentos Operacionais Padrão" (SOP).

  • Ilustrar o propósito e os procedimentos de briefings da tripulação.

  • Ilustrar o propósito e os procedimentos de listas de verificação.

  • Descrever a função da comunicação em uma equipe coordenada.

  • 5.4

  • Definir liderança, autoridade e autoritarismo.

  • Explicar cada um dos principais estilos de liderança: a orientação para

  a tarefa, a orientação para o relacionamento e a orientação para a tarefa

  e o relacionamento.

  • Reconhecer os atributos mais importantes para um estilo de liderança

  positiva.

  • Relacionar os diferentes tipos de líder.

  • Discorrer sobre a responsabilidade do líder na formação e na

  manutenção de equipes.

  • Citar os procedimentos que cabem ao líder na formação e na

  manutenção de equipes.

  • 5.5

  • Citar os fatores individuais que intervêm no resultado do trabalho da

  equipe.

  • Explicar a influência da motivação no resultado do trabalho da equipe.

  • Evidenciar a diferença entre motivação e incentivação.

  • Definir cooperação.

  • Explicar a influência da cooperação no resultado do trabalho da

  equipe.

  • Definir comprometimento com a tarefa.

  • Explicar a influência do comprometimento com a tarefa no resultado

  do trabalho da equipe.

  • Definir resignação.

  • Explicar a influência da resignação no resultado do trabalho da equipe.

  • Definir transferência de responsabilidade.

  • Explicar a influência da transferência de responsabilidade no resultado

  do trabalho da equipe.'
