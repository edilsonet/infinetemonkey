title: Aprovação das aeronaves RVSM -- Finalidade
text: '5.4.4 Aprovação das aeronaves RVSM -- Finalidade

  6 Cartas aeronáuticas e procedimentos de navegação por instrumentos

  Objetivos Específicos Subunidades

  6.1

  • Identificar a finalidade dos procedimentos de saída

  padrão por instrumentos (SID).

  • Definir os termos: razão/gradiente de subida; saída

  direta; saída em curva.

  • Identificar os auxílios utilizados para os procedimentos

  SID

  • Descrever os requisitos a serem observados pelo piloto

  em comando durante a execução de uma SID.

  • Interpretar as representações e legendas das cartas SID.

  • Utilizar a Carta de Saída por Instrumentos (SID).

  6.2

  • Descrever os procedimentos de saídas (SID) baseadas

  em navegação de área (RNAV), suportadas pelo GNSS.

  • Interpretar as representações e legendas da Carta de

  Saída por Instrumentos RNAV.

  • Utilizar a Carta de Saída por Instrumentos RNAV.

  6.3

  • Identificar os auxílios à navegação aérea utilizados vas

  aerovias e nas rotas de navegação aérea.

  • Identificar as radiais voadas com referência ao indicador

  de situação horizontal (horizontal situation indicator -

  HSI) ou ao indicador radiomagnético (radio magnetic

  indicator - RMI).

  • Identificar o princípio do rastreamento de indicador

  automático de direção (ADF) usando RMI.

  • Identificar as condições para a autorização do uso de

  sistema de navegação inercial (SNI) em aerovias.

  • Interpretar as representações e legendas da Carta de

  Rotas (ERC).

  • Utilizar a Carta de Rotas (ERC).

  6.4

  • Explicar a finalidade do procedimento de espera.

  • Explicar o significado de cada um dos elementos de uma

  espera: ponto de referência, curva de afastamento, curva

  de aproximação; perna de afastamento; perna de

  aproximação.

  • Identificar em uma representação gráfica, cada um dos

  elementos de uma espera.

  • Definir espera padrão e espera não-padrão.

  • Identificar os setores de uma espera, determinando os

  valores de cada um.

  • Representar graficamente os setores na espera padrão e

  na espera não-padrão.

  • Descrever os procedimentos de entrada por cada um dos

  setores da espera.

  • Descrever os procedimentos de ajuste de espera em caso

  de vento cruzado, vento de proa e vento de cauda.

  • Descrever os procedimentos de descida no padrão de

  espera.

  • Descrever os procedimentos de transição para o controle

  de aproximação.

  6.1 Saídas padrão por instrumentos (standard instrument

  departures - SID)'
