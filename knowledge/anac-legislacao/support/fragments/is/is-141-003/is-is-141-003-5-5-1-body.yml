text: '5.5.1 O corpo docente do curso teórico de DOV deve ser constituído de profissionais
  detentores

  de qualificação técnica e experiência comprováveis para o exercício da função de

  professores ou instrutores de cada um dos componentes curriculares constantes do plano

  de unidades didáticas da parte teórica deste curso.'
