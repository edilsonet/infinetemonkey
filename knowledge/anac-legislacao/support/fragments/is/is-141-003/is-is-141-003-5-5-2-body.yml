title: Métodos de contenção de carga a granel no compartimento de
text: '5.5.2 Métodos de contenção de carga a granel no compartimento de

  carga e na cabine de passageiros

  6 Instruções de carregamento

  Objetivos Específicos Subunidades

  6.1

  • Identificar as limitações estabelecidas pela regulamentação para

  o carregamento de aeronaves.

  • Reconhecer os requisitos de manuseio e alocação de cargas

  especiais na aeronave.

  • Justificar a finalidade do controle sobre artigos perigosos, para:

  - garantir segurança da aeronave, dos passageiros, da tripulação

  e de outras cargas; e

  - prevenir efeitos de materiais radioativos e magnéticos.

  • Identificar os requisitos para o transporte de animais vivos

  relativos a:

  - temperatura, ventilação e proteção, incluindo aeronave,

  passageiros e tripulação;

  - manuseio e tratamento, inclusive nas paradas

  intermediárias.

  • Identificar cargas compatíveis e cargas incompatíveis.

  • Identificar cargas incompatíveis e os cuidados de

  acondicionamento.

  • Justificar a finalidade do planejamento e da alocação da carga.

  • Identificar a numeração padronizada pela IATA para as

  posições nos compartimentos de carga.

  6.2

  • Explicar a finalidade das instruções de carregamento.

  • Explicar os métodos de avaliação e distribuição da carga.

  • Definir instruções especiais de carregamento.

  • Definir mudanças de última hora (LMC).

  • Apontar os limites das mudanças de última hora definidos pela

  regulamentação vigente.

  • Reconhecer as responsabilidades do DOV quanto à elaboração

  das instruções de carregamento

  6.3

  • Identificar a finalidade da loadsheet final.

  • Explicar os procedimentos de preparação da loadsheet final.

  6.1 Considerações gerais'
