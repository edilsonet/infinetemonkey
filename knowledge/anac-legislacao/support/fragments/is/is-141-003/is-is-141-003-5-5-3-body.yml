title: Para ministrar aulas em cada componente curricular é proposta uma formação mínima
text: '5.5.3 Para ministrar aulas em cada componente curricular é proposta uma formação mínima

  requerida para o instrutor. O Apêndice C desta IS apresenta o Perfil do Instrutor do Curso

  de Formação de DOV, que resume a qualificação mínima necessária a cada instrutor, a

  ser comprovada pelo candidato à organização de instrução através de certificados de

  cursos e, quando aplicável, licenças e habilitações correspondentes a cada componente

  curricular. Ressalta-se que a formação proposta não esgota as possibilidades de outras

  qualificações a serem apresentadas para aprovação da ANAC.

  5.6 Estrutura do curso de DOVData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
