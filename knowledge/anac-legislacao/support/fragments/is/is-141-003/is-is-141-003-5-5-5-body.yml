text: '5.5.5 Transferência de responsabilidade - Definição.

  Influência no resultado do trabalho da equipe

  6 Gerenciamento de ameaças e erros

  Objetivos específicos Subunidades

  • Explicar os três componentes do Modelo TEM proposto pela OACI.

  • Explicar e dar exemplos de ameaças latentes.

  • Explicar e dar exemplos de ameaças ambientais.

  • Explicar e dar exemplos de ameaças organizacionais.

  • Explicar e dar uma definição de erro de acordo com o modelo TEM.

  • Explicar e dar exemplos de erro procedimental.

  • Explicar e dar exemplos de “condições indesejadas da aeronave”.

  • Dar exemplos de diferentes medidas preventivas, que podem ser

  utilizadas a fim de gerir as ameaças, erros e condições indesejadas da

  aeronave.

  6.1 Modelo de Gerenciamento de Ameaças e Erros

  (Threat and Error Management - TEM)'
