title: 'Aplicação do triângulo do vento:'
text: '5.5.6 Aplicação do triângulo do vento:

  -- Primeiro caso (primeiro tipo): Planejamento - Cálculos com o

  uso de gráfico

  -- Segundo caso (segundo tipo): Consequência - Cálculos com o

  uso de gráfico

  -- Terceiro caso (terceiro tipo): Execução - Cálculos com o uso de

  gráfico

  5.6 Métodos comuns para seguir os rumos desejados

  5.6.1. Automaticamente ou por indicação direta do piloto no rumo

  inserido no CDU ou no INS

  5.6.2. Automaticamente ou por indicação direta do piloto no rumo

  no Sistema Doppler de navegação

  5.6.3. Automaticamente ou por indicação direta do piloto no rumo

  definido por: VOR (VHF omdirectional radio range) ou

  localizadores ILS (Instrument Landing System).'
