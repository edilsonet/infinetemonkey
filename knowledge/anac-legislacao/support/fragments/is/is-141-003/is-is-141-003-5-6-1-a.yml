text: 'a) Instrução teórica, dividida em dois módulos:

  I. Módulo I - composto de 11 (onze) componentes curriculares, com carga

  horária total de 363 (trezentos e sessenta e três) horas-aula;

  II. Módulo II - composto de 12 (doze) componentes curriculares, com carga

  horária total de 317 (trezentos e dezessete) horas-aula; e'
