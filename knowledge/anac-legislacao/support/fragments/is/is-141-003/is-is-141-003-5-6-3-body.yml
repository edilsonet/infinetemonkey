text: '5.6.3 Dinâmica de pouso - Atuação das forças aerodinâmicasData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  - Explicar a atuação das forças aerodinâmicas na dinâmica do

  pouso das aeronaves.

  6 Estabilidade

  Objetivos Específicos Subunidades

  6.1

  - Definir estabilidade.

  - Definir equilíbrio estável, equilíbrio instável e equilíbrio

  indiferente.

  6.2

  - Definir estabilidade estática.

  - Identificar cada um dos tipos de estabilidade estática.

  6.3

  - Definir estabilidade dinâmica.

  - Identificar cada um dos tipos de estabilidade dinâmica.

  6.4

  - Definir estabilidade longitudinal.

  - Citar as influências exercidas na estabilidade longitudinal pelas

  variações de posição do centro de pressão da asa (CP), do centro

  de gravidade da aeronave (CG), do ângulo de ataque do perfil e

  da tração do motor.

  - Citar os recursos utilizados na constituição da aeronave para a

  obtenção da estabilidade longitudinal.

  6.5

  - Definir estabilidade lateral.

  - Citar a influência exercida pelo centro de gravidade (CG) na

  estabilidade lateral.

  - Citar os recursos utilizados na constituição da aeronave para

  obtenção da estabilidade lateral.

  6.6

  - Definir estabilidade direcional.

  - Citar os recursos utilizados na constituição da aeronave para

  obtenção da estabilidade direcional.

  - Descrever os recursos utilizados na constituição da eronave

  relacionados à estabilidade direcional.

  6.1 Equilíbrio e estabilidade'
