title: 5.6.3(f)
text: 'f) Plano das Unidades Didáticas, indicando:

  I. objetivos específicos, que indicam, sinteticamente, as principais

  aprendizagens a serem realizadas pelos alunos e que devem ser objeto de

  avaliação, tanto na própria organização de instrução, como nos exames teóricos

  da ANAC, para obtenção da licença de DOV;

  II. conteúdo programático mínimo, detalhado em unidades e subunidades

  didáticas, a fim de proporcionar maior homogeneização no desenvolvimento dos

  assuntos pelas diferentes organizações de instrução.Data de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A'
