text: '5.6.7 Aproximação perdida

  5.7 Autorização para voos VFR especiais

  6 Serviço de controle de aeródromo

  Objetivos específicos Subunidades

  6.1

  • Descrever a tarefa geral de uma TWR que diz respeito à emissão de informações

  e autorizações para aeronaves sob seu controle.

  • Reconhecer a TWR como o órgão oficial de informação a respeito das horas de

  saída e de chegada das aeronaves e de encaminhar essas e outras informações

  necessárias ao ACC ao qual estiver subordinado.

  6.2

  6.1 Funções de uma torre de controle de

  aeródromo (TWR)'
