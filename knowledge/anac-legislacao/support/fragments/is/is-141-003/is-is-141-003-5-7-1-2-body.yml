text: '5.7.1.2 A avaliação do desempenho do aluno é parte integrante do processo de formação.
  Os

  instrumentos de avaliação devem ser sempre preparados com o único propósito de avaliar

  se o aluno alcançou ou não o objetivo instrucional e os objetivos específicos traçados para

  cada componente curricular.'
