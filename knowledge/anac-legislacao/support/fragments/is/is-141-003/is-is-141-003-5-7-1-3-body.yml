title: Para maior adequação do conteúdo programático de cada componente curricular, ao
text: '5.7.1.3 Para maior adequação do conteúdo programático de cada componente curricular,
  ao

  iniciar a respectiva aula, o professor/instrutor poderá aplicar um teste abrangendo os

  conteúdos considerados pré-requisitos para o referido componente. Tal procedimento terá

  o objetivo único de realizar uma avaliação diagnóstica, de forma a dar mais atenção aos

  assuntos em que os alunos evidenciaram maior dificuldade. Por ser diagnóstico, esse pré-

  teste não deve ter nenhuma influência concreta na indicação de valores para a avaliação

  do desempenho dos alunos. Não pode ser considerado para o cálculo da média final.'
