title: Os alunos devem ser sempre informados sobre a forma como estão sendo avaliados, a fim
text: '5.7.1.4 Os alunos devem ser sempre informados sobre a forma como estão sendo avaliados,
  a fim

  de que possam orientar os seus esforços para um melhor desempenho. A informação deve

  incluir as condições que existirão durante a avaliação, o desempenho que se espera do

  aluno, os padrões de desempenho que devem ser cumpridos e as consequências de um

  desempenho inadequado. Recomenda-se que os erros nos exames de conhecimentos e

  testes de habilidades sejam revistos com os alunos para que reflitam sobre seus erros. Os

  alunos devem ser informados do resultado da sua avaliação e os instrutores devem

  comentar com eles as respostas impróprias e suas correções.'
