text: '5.7.3.2 Avaliação formativa. O instrutor deve aplicar várias provas, testes e outros
  instrumentos

  de avaliação durante o desenvolvimento do conteúdo programático, com uma frequência

  proporcional ao volume de assuntos estudados. A análise dos resultados permitirão

  detectar as dificuldades dos alunos em tempo de saná-las antes de estenderem a uma área

  maior. Além disso, não adianta o instrutor avançar no desenvolvimento dos assuntos se

  não sabe onde as dificuldades estão ocorrendo.'
