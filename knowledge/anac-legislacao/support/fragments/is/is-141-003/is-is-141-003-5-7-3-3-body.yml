text: '5.7.3.3 Avaliação somativa. Ao final do Módulo 1, o aluno deve ser avaliado pela organizaçãoData
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  de instrução em todos os componentes curriculares desse módulo. Somente após a

  aprovação no Módulo 1, o aluno poderá iniciar as aulas do Módulo 2. Para realizar o

  exame teórico da ANAC, o aluno deve ter sido aprovado pela organização de instrução

  no módulo correspondente.'
