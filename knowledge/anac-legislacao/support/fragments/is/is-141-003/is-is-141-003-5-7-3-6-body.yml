title: Comunicação dos resultados. Após a correção das provas, o instrutor deve comentar os
text: '5.7.3.6 Comunicação dos resultados. Após a correção das provas, o instrutor deve comentar
  os

  erros com a turma, sem identificar os alunos que os cometeram, apresentando a resposta

  correta e as explicações cabíveis, certificando-se de que houve a compreensão desejada.

  Os erros dos alunos devem ser encarados pelo instrutor como meios de aperfeiçoar sua

  própria ação docente. Com base na análise dos erros, o instrutor deve tipificá-los,

  empregando recursos auxiliares à instrução mais adequados ou novas formas de

  abordagem dos assuntos.'
