title: Os resultados da avaliação do rendimento dos alunos devem ser anotados pelo instrutor
text: '5.7.4.3 Os resultados da avaliação do rendimento dos alunos devem ser anotados pelo
  instrutor

  no diário de classe, depois de corrigir as provas e comentá-las com os alunos. Após

  preenchido, o diário de classe deve ser encaminhado à secretaria da organização de

  instrução.'
