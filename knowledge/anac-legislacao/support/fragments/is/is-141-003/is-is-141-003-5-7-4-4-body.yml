text: '5.7.4.4 Na secretaria, o registro das notas de rendimento deve ser feito na ficha individual
  do

  aluno, à medida em que forem sendo recebidos os diários de classe contendo as notas

  atribuídas aos alunos por todos os instrutores. Após preenchida, esta ficha deverá compor

  a pasta individual do aluno.'
