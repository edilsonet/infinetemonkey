title: Os desempenhos avaliados como muito inadequados (1) e inadequados (2) constituem
text: '5.7.5.4 Os desempenhos avaliados como muito inadequados (1) e inadequados (2) constituem

  comportamentos inaceitáveis, que apontam para a necessidade de um treinamento

  centrado nas deficiências do aluno. São aceitáveis os níveis de 3 a 5.'
