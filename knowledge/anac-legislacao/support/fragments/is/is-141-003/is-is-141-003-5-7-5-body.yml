text: '5.7.5 Plotagem dos triângulos de velocidade nas cartas -- Escala.

  Símbolos convencionais

  6 Medida da altitude

  Objetivos Específicos Subunidades

  6.1

  • Identificar sistemas de altimetria de aeronaves e seus usos,

  erros, correções e terminologia.

  6.2

  • Efetuar ajustes de altímetro de acordo com o manual das

  aeronaves.

  • Calcular a altitude verdadeira acima do nível médio do mar

  e a altura acima do solo para uma gama de temperaturas,

  altitudes de pressão e altitudes indicadas.

  • Fazer estimativas de erros do altímetro, utilizando os

  conjuntos de sub-escalas e tabelas de atmosfera padrão.

  6.3

  • Explicar de que forma é feita a correção dos erros do

  altímetro de pressão.

  6.4

  6.1 Tipos de altímetro'
