title: Plano das unidades e subunidades didáticas
text: '5. Plano das unidades e subunidades didáticas

  Componente Curricular: PESO E BALANCEAMENTO

  MÓDULO 2 Carga Horária: 30 h-a

  Unidades Didáticas

  1 Introdução ao peso e balanceamento

  Objetivos Específicos Subunidades

  1.1

  • Definir os seguintes termos relativos ao peso de uma

  aeronave:

  - Peso básico da aeronave/fábrica

  - Peso básico operacional (Basic operating weight - BOW)

  - Peso Operacional (Operating weight - OW)

  - Peso Zero Combustível (zero-fuel weight - ZFW)

  - Peso de Rampa ou Peso de Táxi

  - Peso de Decolagem (take-off weight - TOW)

  - Peso de Pouso (landing weight)

  • Identificar os elementos constituintes dos seguintes pesos de

  aeronaves: peso básico operacional, peso operacional, peso

  de táxi, peso de decolagem, peso de pouso e peso zero

  combustível.

  • Explicar a relação entre os vários componentes de cada um dos

  pesos acima enumerados.

  • Comparar as definições apresentadas pela OACI com outras

  definições relativas a peso e balanceamento utilizadas por

  fabricantes de aeronaves e empresas aéreas.

  1.2

  • Descrever a relação entre o peso da aeronave e estresse

  estrutural.

  • Descrever a relação entre peso e desempenho de aeronaves.

  • Reconhecer que o peso real da aeronave deve ser conhecido

  durante o voo, como base para a tomada de decisões do

  piloto em comando relacionadas com o desempenho.

  • Justificar a importância de serem considerados os limites de

  fator de carga.

  • Concluir que o peso deve ser limitado para garantir margens

  adequadas de desempenho e segurança da aeronave.

  1.3

  • Reconhecer as responsabilidades dos operadores aéreos

  sobre o controle de peso e balanceamento.

  • Reconhecer as responsabilidades do DOV sobre o controle

  de peso e balanceamento.

  1.1 Conceitos básicos'
