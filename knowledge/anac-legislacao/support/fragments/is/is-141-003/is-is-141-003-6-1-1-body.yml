title: Requisitos para garantir uma margem adequada de desempenho
text: '6.1.1 Requisitos para garantir uma margem adequada de desempenho

  durante a descida e a aproximaçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Identificar os requisitos para garantir uma margem adequada

  de desempenho durante a descida e a aproximação.

  • Identificar os requisitos de performance em aproximação

  perdida com um motor inoperante e arremetida com todos os

  motores.

  6.2

  • Explicar o efeito do peso da aeronave sobre a velocidade de

  melhor ângulo e a melhor razão de descida.

  • Explicar o efeito da massa, altitude, vento, velocidade e

  configuração na descida.

  • Exemplificar algumas limitações que estão incluídas no

  manual de voo a serem observadas pelo DOV.'
