title: Alertas e notificações sobre falhas ou
text: '6.1.2 Alertas e notificações sobre falhas ou

  irregularidade no funcionamento de

  equipamentosData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Reconhecer a necessidade da suspensão das operações VFR sempre que as

  condições meteorológicas estiverem abaixo dos mínimos prescritos para a

  operação VFR

  • Descrever os procedimentos a serem observados pela TWR sempre que as

  operações VFR são suspensas.

  6.3

  • Justificar a existência de mínimos meteorológicos de pouso e decolagem

  associados a cada categoria de aeronave e publicados nas cartas de aproximação

  e pouso.

  • Associar à Categoria A de aeronaves os mínimos meteorológicos de aeródromo

  regulares para decolagem IFR.

  • Localizar no AIP-MAP os mínimos meteorológicos de aeródromo regulares para

  decolagem, bem como os superiores aos regulares e os inferiores aos regulares.

  • Citar os critérios para redução dos mínimos meteorológicos de aeródromo para

  decolagem.

  6.4

  • Descrever os procedimentos do piloto para aproximação IFR quando em

  condições meteorológicas adversas, em face de informação do órgão ATS sobre

  mínimos meteorológicos inferiores aos estabelecidos na Carta de Aproximação

  e Pouso por Instrumentos (IAC).

  6.5

  • Citar o órgão responsável pela decisão de suspensão das operações de decolagem

  IFR.

  • Citar as providências a cargo da TWR com relação à suspensão das operações

  de decolagem IFR.

  6.6

  • Listar as ações de responsabilidade do piloto em comando da aeronave quando

  em voo VFR, nas proximidades de um aeródromo ou durante o táxi.

  • Reconhecer a obrigatoriedade de se obter autorização da TWR, antes de iniciar

  o táxi, a decolagem e o pouso.

  6.7

  • Reconhecer que autorizações e informações emitidas pela TWR se baseiam nas

  condições conhecidas de tráfego e do aeródromo e se aplicam ao tráfego de

  aeródromo, bem como a veículos e pessoas na área de manobras.

  6.8

  • Listar a série de informações que a TWR devem dar para as aeronaves: antes de

  taxiar para decolar; antes de decolar e antes de entrar no circuito do tráfego.

  6.9

  • Explicar o significado dos elementos básicos do circuito de tráfego.

  • Identificar a posição do circuito de tráfego em que, normalmente, a aeronave

  recebe da TWR o número de sequência de pouso.

  • Identificar a altura do circuito de tráfego padrão para aeronaves a hélice e para

  aeronaves a jato.

  6.10

  • Explicar o termo "pista em uso".

  • Explicar as razões que poderiam, eventualmente, levar à decisão de usar outra

  direção de decolagem ou pouso do que o contra o vento.

  • Listar os fatores a serem considerados pela TWR na seleção da pista em uso.

  • Listar as possíveis consequências para o piloto em comando se a pista em uso

  não é considerada adequada para a operação.

  6.11

  • Listar as informações que a TWR deve transmitir às aeronaves antes de iniciar o

  táxi para a decolagem.

  • Listar as informações que a TWR deve transmitir às aeronaves antes da

  decolagem.

  6.2 Suspensão das operações VFR'
