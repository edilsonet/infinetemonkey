title: 'Informação essencialData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '6.12.1 Informação essencialData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Listar as informações que a TWR deve transmitir às aeronaves antes de entrar

  no circuito de tráfego.

  • Reconhecer a responsabilidade do piloto por evitar a colisão com outra aeronave

  quando operando em VMC.

  • Explicar o significado da expressão "tráfego essencial local ".

  • Explicar os procedimentos a serem adotados no caso de serem verificadas ou

  informadas configurações ou condições anormais em uma aeronave.

  6.12

  • Listar o que deve conter a informação essencial sobre as condições do

  aeródromo.

  6.13

  • Descrever a sequência de prioridade entre aeronave pousando (ou na fase final

  de uma aproximação de aterrissaagem) e aeronave com a intenção de partir.

  • Indicar a ordem de prioridade de aeronaves na sequência de decolagem.

  • Indicar a ordem de prioridade de aeronaves na sequência de pouso.

  • Listar os procedimentos básicos de controle que deverão ser observados pela

  TWR em coordenação com o APP, no caso de aeronave de inspeção em voo.

  6.14

  • Citar as condições para uma aeronave ser autorizada a taxiar na pista em uso.

  • Citar as condições para uma aeronave ser autorizada a a ultrapassar outra durante

  o táxi.

  • Citar as distâncias mínimas da posição de espera para a pista em uso.

  6.15

  • Citar os casos em que não se aplicam as separações mínimas entre aeronaves.

  • Citar os procedimentos para a entrada de aeronaves no circuito de rtáfego.

  • Citar os casos em que pode ser dada autorização especial para uso da área de

  manobras.

  6.16

  • Descrever os limites de posição que devem ser alcançados por uma aeronave

  pousada para que uma outra seja autorizada a iniciar a decolagem.

  • Descrever a ação necessária quando, no interesse de agilizar o tráfego, uma

  autorização de decolagem imediata tenha sido emitida para uma aeronave antes

  de entrar na pista de decolagem.

  • Descrever os procedimentos de partida para aeronaves com Plano de Voo IFR.

  • Descrever os procedimentos de partida para aeronaves com Plano de Voo VFR.

  6.17

  • Descrever as condições básicas que devem ser cumpridas antes de uma aeronave

  em pouso seja normalmente autorizada a cruzar o início da pista em sua

  aproximação final .

  6.18

  • Descrever as providências a serem tomadas pelo órgão responsável pelo ATS no

  aeródromo nos casos de aeronave em emergência.

  6.19

  • Descrever as providências a serem tomadas pela TWR nos casos de aeronave

  sob interferência ilícita.

  6.20

  • Citar as atribuições da TWR com relação ao controle de pessoas, veículos e

  aeronaves no solo, em condições normais e em caso de baixa visibilidade.

  6.21

  • Descrever os procedimentos a serem executados pelo piloto para obtenção da

  autorização ATC e para o acionamento dos motores da aeronave.

  6.22

  • Descrever os procedimentos relativos à intensidade, ao acendimento e ao

  desligamento das luzes aeronáuticas de superfície.

  6.13 Ordem de prioridade correspondente às

  aeronaves que chegam e que partem'
