title: Itens a serem considerados, além das exigências normais de
text: '6.2.2 Itens a serem considerados, além das exigências normais de

  despacho:

  -- MMEL

  -- facilidades de comunicação e de navegação

  -- suprimento de combustível e óleo

  -- requisitos para aeroportos alternativos: serviços aeroportuários e

  de instalações, mínimos meteorológicos

  -- requisitos de previsão meteorológica

  -- controle operacionalData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  6.3

  • Explicar a importância de ser focalizada, no planejamento

  de voo, a possibilidade de perda de motores.

  • Explicar a importância, para o planejamento de voo, da

  verificação de obstáculos e/ou restrições na rota que

  possam limitar o voo nivelado de um avião com um motor

  inoperante (net level off).

  • Citar os requisitos mínimos adotados no planejamento de

  voo, para um avião com um motor inoperante ultrapassar

  verticalmente os obstáculos nas trajetórias positivas, nas

  negativas e nas niveladas.

  • Descrever as influências exercidas, no voo nivelado de um

  avião com um motor inoperante, pelo peso da aeronave,

  pelas condições meteorológicas, pelas sangrias de ar do

  motor e pelas condições adversas da aeronave.

  • Definir altitude máxima de cruzeiro limitada para motor

  inoperante (altitude capability long range cruise - one

  engine inoperative).

  • Explicar a importância da utilização, no planejamento de

  voo, da altitude máxima de cruzeiro limitada para motor

  inoperante,

  • Definir equal time point (ETP), ponto de não retorno (point

  of no return - PNR) e ponto seguro de retorno (point of

  safe return - PSR).

  • Citar a finalidade da trajetória de afundamento de um avião

  com um motor inoperante (net drift down profile).

  • Descrever as influências exercidas, na trajetória de

  afundamento de um avião com um motor inoperante, pelo

  peso da aeronave, pelo nível de voo, pela velocidade, pelas

  condições meteorológicas, pelas sangrias de ar do motor e

  pelas condições adversas da aeronave.

  • Citar a finalidade da trajetória líquida (net gradient).

  • Explicar a importância da utilização da trajetória líquida

  (net gradient) no planejamento de voo.

  • Citar os requisitos de redução do gradiente da trajetória

  líquida aplicados à trajetória real (gross gradient),

  considerando-se o número de motores instalados.

  • Interpretar as informações encontradas nas tabelas e

  gráficos para motor inoperante contidos nos manuais de

  voo.

  -- dados de desempenho do avião com um motor inoperante

  abrangendo: descida progressiva (drift down), cobertura de altitude

  de cruzeiro, incluindo 10 000 pés; espera; aproximação perdida

  -- dados de desempenho do avião com todos os motores funcionando

  para as condições atmosféricas padrão e não padrão, em cruzeiro e

  em espera

  -- detalhes de quaisquer outras condições relevantes para operações

  de alcance prolongado que podem causar a deterioração significativa

  de desempenho da aeronave'
