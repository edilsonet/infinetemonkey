title: Procedimentos para os veículos em área
text: '6.20.5 Procedimentos para os veículos em área

  de manobras

  6.21 Procedimento para obtenção da

  autorização ATC e acionamento dos motoresData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  • Listar as luzes que compõem a iluminação de aproximação.

  • Listar as luzes que compõem a iluminação de pista.

  • Descrever de que forma a iluminação será proporcionada no caso de a

  iluminação da pista não funcionar continuamente.

  • Descrever as condições de funcionamento da iluminação da zona de parada, da

  pista de táxi, das barras de parada, dos obstáculos e do farol rotativo de

  aeródromo.

  6.23

  • Descrever os procedimentos de utilização das pistolas de sinais luminosos.

  • Identificar o significado das cores dos sinais luminosos para o movimento de

  pessoas e veículos, para as aeronaves no solo e para as aeronaves em voo

  • Descrever as formas de notificação de recebimento dos sinais de tráfego por

  parte das aeronaves em solo e por parte das aeronaves em voo.

  6.22 Luzes aeronáuticas de superfície'
