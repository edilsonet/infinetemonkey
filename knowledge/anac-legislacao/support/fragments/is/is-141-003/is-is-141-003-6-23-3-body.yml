text: '6.23.3 Notificação de recebimento

  7 Serviço de informação de voo (Flight Information Service - FIS)

  Objetivos específicos Subunidades

  7.1

  • Reconhecer a aplicabilidade e o alcance do serviço de informação de voo

  (FIS).

  • Listar as informações que devem ser fornecidas pelo FIS à aeronaves.

  • Reconhecer o significado e o conteúdo das informações SIGMET e

  AIRMET.

  • Indicar a situação em que o FIS deve incluir informações sobre o risco de

  colisão de aeronaves.

  • Indicar como são registradas e transmitidas informações relativas à

  progressão efetiva dos voos não controlados

  7.2

  • Citar os três principais meios de transmissões operacionais FIS.

  • Identificar a cobertura que deve ser dada às aeronaves pela transmissão da

  informação SIGMET.

  • Citar os três principais meios de transmissão dos informes especiais

  selecionados e as correções em previsão de aeródromo.

  • Explicar o significado de ATIS.

  • Demonstrar familiarização com as condições básicas para a transmissão de

  um ATIS, conforme indicado na ICA 100-37.

  • Citar as quatro mensagens possíveis compreendidas pelas transmissões do

  ATIS.

  • Listar as informações sobre transmissões ATIS básicas (por exemplo,

  frequências utilizadas, número de avisos incluído, atualização, identificação,

  aviso de recepção, linguagem e canais, ajuste de altímetro).

  7.3

  • Identificar o objetivo e os princípios básicos do Serviço de Assessoramento

  de Tráfego Aéreo.

  • Indicar a cobertura dada pelo serviço às aeronaves.

  • Indicar o que compete aos órgãos ATS que prestam o serviço de

  assessoramento de tráfego aéreo.

  7.4

  • Justificar a finalidade do AFIS.

  • Citar a abrangência do AFIS.

  • Listar os elementos básicos de informação para as aeronaves que são

  proporcionados pela estação de telecomunicações aeronáuticas.

  • Citar os casos em que é permitida a operação de aeronaves sem equipamento

  rádio ou com este inoperante em aeródromos providos de AFIS.

  • Citar os procedimentos operacionais que não são permitidos em aeródromos

  providos de AFIS.

  7.1 Visão geral'
