text: '6.3.3.2 Trajetória líquida (net gradient)

  -- Finalidade. Importância da utilização no planejamento de vooData de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  -- Requisitos de redução do gradiente da trajetória líquida aplicados

  à trajetória real (gross gradient), considerando-se o número de

  motores instalados

  7 Preenchimento do plano de voo - ICA 100-11

  Objetivos específicos Subunidades

  7.1

  • Conceituar plano de voo segundo a ICA 100-11.

  • Identificar os tipos de plano de voo e seus respectivos

  formulários.

  • Citar a finalidade de cada tipo de plano de voo.

  • Identificar o formulário utilizado para cada tipo de plano

  de voo.

  • Explicar a forma de apresentação do plano de voo.

  • Identificar as situações em que a apresentação do plano de

  voo é compulsória.

  • Identificar as situações em que a apresentação do plano de

  voo é dispensada.

  • Identificar o prazo de validade estabelecido pela ICA 100-

  11 para o plano de voo.

  • Identificar o DOV e o piloto em comando como os

  responsáveis pelo preenchimento do plano de voo.

  • Identificar quem pode ser autorizado a preencher o plano

  de voo repetitivo.

  • Identificar o documento que regula o preenchimento do

  plano de voo.

  • Identificar as condições impostas pela regulamentação

  para a elaboração de um plano de voo com mudança de

  regras.

  • Citar as regras específicas para Plano de Voo com

  mudança de VFR pata IFR.

  • Citar as regras específicas para Plano de Voo com

  mudança de IFR para VFR.

  7.2

  • Identificar o formulário a ser preenchido para o plano de

  voo completo.

  • Identificar o local em que o formulário de plano de voo

  completo pode ser apresentado.

  • Identificar o tempo de antecedência mínimo e máximo em

  que o formulário de plano de voo completo deve ser

  apresentado.

  • Explicar como devem ser notificadas as mensagens de

  cancelamento, modificação ou atraso de um plano de voo

  completo.

  7.3

  • Identificar as situações em que se aplica o Plano de Voo

  Repetitivo (RPL).

  • Identificar os tipos de voos e a frequência mínima de

  realização para voos que utilizem o plano de voo

  repetitivo.

  • Identificar o órgão ao qual o formulário RPL deve ser

  apresentado.

  7.1 Regras gerais'
