text: '6.3.4 O instrumental de trabalho - Computador manual, instruções,

  livros técnicos, terminal de computador, transmissor/receptor da SSB,

  VHF e UHF, interfone, telefone, manuais, formulários, fichas,

  normas da OACI, da ANAC e da empresa

  7 Transporte aéreo

  Objetivos específicos Subunidades

  7.1

  • Definir serviços aéreos privados e serviços aéreos

  públicos.

  • Identificar as normas para a exploração dos serviços

  aéreos.

  • Citar as atividades aéreas específicas compreendidas pelos

  serviços aéreos privados.

  • Explicar a diferença entre os serviços aéreos privados e os

  serviços aéreos públicos quanto à exigência de

  autorização.

  7.2

  • Definir transporte aéreo regular doméstico, transporte

  aéreo regular internacional e transporte aéreo não regular.

  •

  • 7.3

  • Caracterizar transporte aéreo regular internacional e

  doméstico.

  • Identificar os requisitos básicos para a autorização de

  operação de serviço aéreo de transporte comercial.

  • 7.5

  • Reconhecer o sistema de controle e fiscalização dos

  serviços aéreos públicos.

  7.1 Classificação dos serviços aéreos'
