title: 'Procedimentos de ajuste de espera:Data de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '6.4.7 Procedimentos de ajuste de espera:Data de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  6.5

  • Definir chegada padrão por instrumentos (standard

  instrument arrivals - STAR).

  • Descrever os procedimentos de chegada padrão por

  instrumentos.

  • Interpretar as informações da Carta de Chegada Padrão

  por Instrumentos (STAR) e a Carta de Área (ARC).

  • Utilizar a Carta de Chegada Padrão por Instrumentos

  (STAR) e a Carta de Área (ARC).

  6.6

  • Definir o procedimento de aproximação por

  instrumentos (IAC).

  • Explicar o significado de cada um dos segmentos de

  aproximação.

  • Explicar o procedimento de reversão.

  • Definir os termos: curva base e curva de procedimento.

  • Definir procedimento tipo hipódromo.

  • Explicar os procedimentos de transição para

  aproximação, trajetória de planeio e trajetória final da

  aproximação por instrumentos.

  • Explicar os procedimentos de descida e de pouso da

  aproximação por instrumentos.

  • Interpretar as informações das Cartas de Aproximação

  por Instrumentos (IAC).

  • Utilizar as Cartas de Aproximação por Instrumentos

  (IAC).

  6.7

  • Descrever os procedimentos de transição para

  localizador ILS

  • Descrever os procedimentos de aproximação ILS com

  transição RNAV (GNSS)

  • Descrever os procedimentos de interceptação da

  trajetória de planeio.

  • Indicar os valores mínimos e máximos de altitude sobre

  marcadores.

  • Explicar os procedimentos de monitoramento radar.

  • Descrever os procedimentos de transição de indicações

  de instrumentos para planeio e pouso visuais

  • Descrever os procedimentos de aproximação manual,

  aproximação automática e de pouso automático usando

  aproximação automática.

  • Interpretar as informações da Carta de Aproximação por

  Instrumentos ILS/RNAV (GNSS).

  • Utilizar a Carta de Aproximação por Instrumentos

  ILS/RNAV (GNSS).

  6.8

  • Definir aproximação de não-precisão.

  • Identificar as instalações e os auxílios utilizados para

  aproximação de não precisão.

  • Descrever os procedimentos de rastreamento e de

  descida nas aproximações de não-precisão.

  • Interpretar as informações da Carta de Aproximação por

  Instrumentos (IAC).

  • Utilizar a Carta de Aproximação por Instrumentos (IAC)

  em aproximações de não precisão por NDB, por VOR,

  por VOR/DME, por ARCO/DME e por GPS.

  6.9

  -- Correção em razão de vento cruzado

  -- Correção em razão de vento de proa

  -- Correção em razão de vento de cauda'
