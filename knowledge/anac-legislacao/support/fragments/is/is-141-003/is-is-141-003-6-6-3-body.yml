title: Cálculos de altitude com temperaturas abaixo do padrão pela
text: '6.6.3 Cálculos de altitude com temperaturas abaixo do padrão pela

  tripulação de voo

  7 Computador de voo

  Objetivos Específicos Subunidades

  7.1

  • Explicar a importância do uso do computador de voo para

  a navegação aérea.

  • Identificar os tipos de computadores de voo e seus

  respectivos modelos.

  7.2

  • Identificar os diferentes indicadores que compõem a face

  de cálculo do computador de voo.

  • Converter as unidades de medida de capacidade

  volumétrica, de massa e de distância.

  • Explicar a relação existente entre a regra de três simples e

  a operação do computador.

  • Calcular cada um dos elementos da navegação estimada

  em função dos demais: tempo, distância, velocidade e

  consumo.

  • Determinar a altitude verdadeira e a altitude densidade.

  • Determinar a velocidade aerodinâmica (VA) por métodos

  diversos.

  7.3

  • Identificar os diferentes indicadores que compõem a face

  do vento do computador de voo.

  • Explicar a relação existente entre o método gráfico de

  aplicação do triângulo do vento e a operação no

  computador.

  • Determinar, com a utilização do computador de voo, a

  proa verdadeira (PV), a velocidade em relação ao solo

  (VS) e o ângulo de correção de deriva (ACD).

  7.1 Cálculos de navegação aérea'
