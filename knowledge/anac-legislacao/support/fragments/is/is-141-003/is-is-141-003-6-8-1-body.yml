title: 'DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '6.8.1 DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Identificar os instrumentos de bordo e os auxílios

  utilizados na aproximação controlada pelo solo.

  6.10

  • Explicar o significado dos termos: aproximação com

  guia vertical (APV); navegação lateral (LNAV) e

  navegação vertical (VNAV).

  • Descrever os procedimentos de Aproximação com guia

  vertical barométrico (APV BARO-VNAV).

  • Identificar os mínimos operacionais (LNAV/VNAV)

  estabelecidos.

  • Interpretar as informações da Carta de Aproximação por

  Instrumentos Baro/VNAV

  • Utilizar a Carta de Aproximação por Instrumentos

  Baro/VNAV.'
