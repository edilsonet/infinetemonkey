text: '7.1.2 Movimentação vertical ampla (widespread vertical

  motion): papel da convergência/divergência -- Causas.

  Influência na operação de aeronaves.

  8 Nuvens, nevoeiro e precipitações

  Objetivos Específicos Subunidades

  8.1

  • Identificar os processos envolvidos na formação de nuvens e

  de nevoeiros.

  • Explicar a formação de nevoeiros e nuvens através de radiação

  terrestre, de convecção, de advecção, de influência orográfica

  e de efeito dinâmico.

  8.2

  • Definir nuvem.

  • Explicar as condições gerais para a formação das nuvens.

  • Identificar cada um dos aspectos básicos das nuvens.

  • Citar as características da nuvem líquida, da nuvem sólida e da

  nuvem mista.

  • Classificar as nuvens quanto à altura das bases.

  • Identificar cada um dos tipos de nuvens baixas.

  • Identificar cada um dos tipos de nuvens médias.

  • Identificar cada um dos tipos de nuvens altas.

  • Identificar cada um dos tipos de nuvens baixas com

  desenvolvimento vertical.

  • Identificar cada um dos tipos de nuvens especiais.

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  nuvens.

  • Interpretar as informações meteorológicas concernentes a

  nuvens.

  • Utilizar as informações meteorológicas concernentes a nuvens.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência de cada um dos tipos de nuvens na

  operação de aviões.

  8.3

  8.1 Processos físicos de formação'
