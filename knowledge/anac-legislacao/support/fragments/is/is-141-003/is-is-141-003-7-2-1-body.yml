title: 'Fatores a serem considerados :'
text: '7.2.1 Fatores a serem considerados :

  - peso

  - altitude pressão

  - temperatura

  - componente de vento de cauda ou de proa

  - contaminação da pista

  - posição dos flapes

  - manutenção de freios, spoilers, reversores

  - obstáculos na trajetória de voo de aterrissagem'
