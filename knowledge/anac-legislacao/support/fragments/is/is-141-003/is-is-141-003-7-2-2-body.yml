title: Efeito da compressibilidade na aerodinâmica de alta
text: '7.2.2 Efeito da compressibilidade na aerodinâmica de alta

  velocidade

  7.3 Velocidade do somData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  - Descrever a influência exercida pelas variações da temperatura

  do ar na propagação da velocidade do som no ar.

  - Explicar a ocorrência dos impulsos de pressão gerados pelo

  deslocamento de um corpo no ar nas diversas velocidades.

  7.4

  - Definir número de Mach.

  - Citar as aplicações do número de Mach.

  - Citar, com base no número de Mach, os limites do voo

  subsônico, do voo transônico, do voo supersônico e do voo

  hipersônico.

  - Citar a utilização da velocidade máxima operacional em número

  de Mach (maximum Mach operating speed - MMO).

  7.5

  - Definir ondas de choque no ar.

  - Citar as características do estol de compressibilidade ou estol de

  Mach.

  - Definir Mach crítico, pré-estol (buffet), limite de buffet (buffet

  limit) e coffin corner.

  - Citar as consequências do estol de compressibilidade no voo de

  um avião.

  - Citar os cuidados a serem tomados pelos pilotos quanto ao

  respeito aos limites operacionais da aeronave para evitar o estol

  de compressibilidade nos voos em grande altitude e velocidade.

  - Citar as características do arrasto de onda ou arrasto de

  compressibilidade.

  - Explicar a variação do centro de pressão da asa na presença das

  ondas de choque.

  - Definir downwash, rolloff e tendência de picar (tuck under).

  - Explicar a ocorrência de vibrações, de perda da eficiência dos

  controles de voo e de atitudes anormais (tendência de mergulho),

  como consequências do efeito das ondas de choque no voo de

  um avião em alta velocidade.

  7.6

  - Definir voo transônico.

  - Caracterizar o enflechamento da asa quanto à finalidade e à

  atuação nos aviões transônicos.

  - Explicar a ocorrência da sustentação reduzida em baixa

  velocidade, do movimento transversal dos filetes de ar, do estol

  de ponta de asa e do dutch roll, como consequência do

  enflechamento da asa.

  - Explicar a atuação dos flapes do bordo de ataque e de fuga, dos

  slats, dos slots, dos wing fences, dos pylons dos motores, da

  torção da asa (washing out) e do yaw dumper com a finalidade

  de atenuar os efeitos indesejáveis causados pela asa enflechada.

  - Caracterizar, quanto à finalidade e à atuação, os aerofólios com

  perfil supercrítico dos aviões transônicos.

  - Citar a finalidade da regra de área (area rule).

  - Caracterizar quanto à finalidade, à atuação e à localização, os

  geradores de vórtices (vortex generators) dos aviões transônicos.

  - Caracterizar, quanto à finalidade e ao funcionamento, os

  estabilizadores horizontais rotativos e os estabilizadores

  horizontais com ângulo de incidência ajustável dos aviões

  transônicos.

  - Caracterizar, quanto à finalidade e ao funcionamento, o

  compensador de Mach (Mach trimmer) dos aviões transônicos.

  7.7'
