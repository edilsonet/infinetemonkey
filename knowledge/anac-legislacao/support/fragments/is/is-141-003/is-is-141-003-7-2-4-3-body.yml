text: '7.2.4.3 Contrato de transporte de carga, encomenda ou mala postal -

  Responsabilidades.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  7.3 Controle e fiscalização dos serviços aéreos públicos

  8 Infrações e providências administrativas

  Objetivos específicos Subunidades

  8.1

  • Citar os tipos de providências administrativas aplicáveis

  pela autoridade de Aviação Civil em caso de infração

  praticada por operadores de aeronaves.

  • Citar as infrações cuja prática, por operadores de

  aeronaves ou por DOV, está sujeita à aplicação de

  providências administrativas pela autoridade de Aviação

  Civil.

  • Citar o procedimento executado pela autoridade de

  Aviação Civil quando a infração constituir crime.

  • Identificar a autoridade competente para a cassação de

  licenças e certificados.

  • Mencionar a existência do inquérito administrativo como

  ferramenta obrigatória para a cassação de licenças e

  certificados.

  • Mencionar a existência do direito de defesa assegurado

  àquele que responder a inquéritos administrativos.

  8.2

  • Identificar as providências administrativas relacionadas às

  infrações na atividade aérea e suas implicações legais.

  8.1 Infrações'
