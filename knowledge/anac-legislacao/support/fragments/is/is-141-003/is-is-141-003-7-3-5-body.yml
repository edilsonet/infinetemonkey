title: 'Cálculo da execução -- Terceiro caso (terceiro tipo):'
text: '7.3.5 Cálculo da execução -- Terceiro caso (terceiro tipo):

  determinação da direção do vento (DV) e da velocidade do vento

  (VV) que provocou o desvio

  8 Planejamento de voo por navegação estimada

  Objetivos Específicos Subunidades

  8.1

  • Determinar nas cartas WAC: a posição e a elevação da

  pista de partida, da pista de destino e da pista alternativa;

  e os pontos de partida, de nivelamento, de sobrevoo, de

  destino e de alternativa e, conforme o caso, consulta de

  corredores visuais.

  • Obter as informações necessárias através de consulta às

  cartas e códigos meteorológicos.

  • Determinar a velocidade aerodinâmica (VA).

  • Determinar o estimado no ponto de nivelamento, o

  estimado e a hora em pontos determinados da rota, o

  destino e a alternativa.

  • Determinar o estimado de pouso em diferentes fusos

  horários.

  • Determinar o combustível necessário, o consumo de

  combustível durante o voo e para eventual alternativa e o

  combustível remanescente na aeronave após o pouso.

  • Determinar o vento e suas correções.

  • Determinar a deriva e sua correção.

  • Preencher folha de planejamento com os dados obtidos.

  • Preencher Formulário de Plano de Voo Completo relativo

  a voo visual.

  8.2

  • Solucionar, com a utilização do computador de voo,

  problemas de navegação que envolvam a utilização de

  cartas de voo visual e variações do planejamento causadas

  por alterações de proas e rumos, de horas estimadas, de

  consumo de combustível e de informações

  meteorológicas.

  8.1 Cálculos para o planejamento'
