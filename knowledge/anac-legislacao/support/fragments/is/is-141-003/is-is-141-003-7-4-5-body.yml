text: '7.4.5 Responsabilidade do piloto em comandoData de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  8 Serviço de vigilância ATS

  Objetivos específicos Subunidades

  8.1

  • Justificar a finalidade das informações provenientes do Sistema de

  Vigilância ATS, incluindo alertas e avisos relativos à segurança.

  • Descrever as limitações de emprego do Sistema de Vigilância ATS no

  provimento dos serviços de tráfego aéreo.

  8.2

  • Identificar as classes de espaço aéreo onde é obrigatório que as aeronaves

  possuam a bordo equipamento transponder.

  • Citar os espaços aéreos onde, excepcionalmente, não será exigido o

  equipamento transponder.

  • Identificar os códigos transponder que são reservados internacionalmente

  para uso dos pilotos que se encontrem, respectivamente, em estado de

  emergência, de falha de radiocomunicação ou de interferência ilícita.

  • Indicar em que modo e código o piloto deve operar o transponder, antes de

  receber orientações dos órgãos ATC.

  • Indicar em que circunstâncias o piloto deve operar o modo C, salvo indicado

  pelo ATC, desde que o transponder da aeronave esteja equipado com o Modo

  C.

  • Descrever o procedimento de verificação do funcionamento do transponder

  que deve ser executado pelo piloto.

  • Descrever os procedimentos de identificação e de operação de aeronaves

  equipadas com ADS-B.

  8.3

  • Descrever o procedimento de verificação da informação de níveis, derivada

  da informação de altitude de pressão, apresentada pelo piloto ao controlador

  de voo.

  8.4

  • Explicar, de forma sucinta, os diferentes procedimentos de identificação de

  aeronaves constantes ne regulamentação.

  8.5

  • Identificar as diferentes circunstâncias em que o piloto deverá ser informado

  sobre sua posição.

  • Identificar as diferentes maneiras de ser transmitida ao piloto a informação

  de posição.

  • Citar as informações que o piloto fica dispensado de reportar quando estiver

  sob vigilância radar.

  8.6

  • Listar os objetivos da vetoração de aeronaves.

  • Identificar os diferentes métodos através dos quais deverá ser proporcionada

  a vetoração.

  • Citar as informações a serem prestadas ao piloto na vetoração de aeronave

  para fora de uma rota pré-estabelecida.

  • Citar em que momento terminará a vetoração na aproximação final.

  • Citar em que momento terminará a vetoração em procedimento ILS.

  • Citar em que momento terminará a vetoração em aproximação visual.

  • Citar as informações a serem passadas ao piloto antes do início da

  aproximação radar.

  8.7

  • Salientar a obrigatoriedade de uma aeronave identificada ser avisada

  adequadamente quando estiver se desviando, significativamente, da rota ou

  do circuito de espera.

  • Identificar as circunstâncias em que o piloto de uma aeronave pode solicitar

  assistência para sua navegação ao órgão de controle de tráfego aéreo.

  8.1 Visão geral'
