text: '7.5.2 Procedimentos geraisData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Explicar a forma de apresentação do plano de voo

  repetitivo.

  • Explicar de que forma são processados os planos de voo

  repetitivos.

  • Identificar os períodos de vigência das listagens de planos

  de voo repetitivos.

  • Explicar como devem ser notificadas as mensagens de

  cancelamento, modificação ou atraso temporários de um

  plano de voo repetitivo.

  • Explicar como devem ser notificadas as modificações

  permanentes de um plano de voo repetitivo.

  • Identificar os critérios para suspensão ou cancelamento de

  um plano de voo repetitivo.

  7.4

  • Identificar as situações em que se aplica o Plano de Voo

  Simplificado (PVS).

  • Identificar os órgãos e os meios pelos quais o formulário

  de PVS deve ser apresentado.

  • Identificar o tempo de antecedência mínimo em que o

  formulário de PVS deve ser apresentado.

  • Identificar o local e o tempo máximo em que devem ser

  notificados cancelamentos, modificações e atrasos relativos a

  um PVS.

  7.5

  • Identificar a finalidade e o âmbito do MCA 100-11.

  • Identificar o significado dos termos, abreviaturas e siglas

  utilizados no MCA 100-11.

  • Identificar os procedimentos gerais de prenchimento dos

  planos de voo.

  • Identificar as informações a serem preenchidas em cada

  campo de um formulário de plano de voo.

  • Identificar os procedimentos de inserção e os dados a

  serem inseridos em um plano de voo completo.

  • Identificar os procedimentos de inserção e os dados a

  serem inseridos em um plano de voo repetitivo.

  • Preencher um formulário de plano de voo de acordo com

  as instruções contidas no MCA 100-11.

  • Preencher formulário de Plano de Voo com mudança de

  VFR para IFR.

  • Preencher formulário de Plano de Voo com mudança de

  IFR para VFR.'
