title: 'DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '7.7.1 DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  - Definir efeito aeroelástico nos voos de alta velocidade.

  - Descrever os efeitos indesejáveis da inversão da ação dos

  ailerons nos voos de alta velocidade.

  - Caracterizar, quanto à finalidade e ao funcionamento, os ailerons

  internos e os ailerons externos dos aviões velozes.

  - Caracterizar, quanto à finalidade e ao funcionamento, os spoilers

  no controle da rolagem dos aviões velozes.

  7.8

  - Definir voo supersônico.

  - Caracterizar cada um dos tipos de ondas supersônicas.

  - Descrever o processo de sustentação realizado por um perfil

  supersônico.'
