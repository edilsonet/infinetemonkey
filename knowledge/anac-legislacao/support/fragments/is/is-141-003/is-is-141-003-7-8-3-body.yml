title: Perfis supersônicos - Obtenção da sustentação
text: '7.8.3 Perfis supersônicos - Obtenção da sustentação

  8 Atitudes anormais da aeronave

  Objetivos Específicos Subunidades

  8.1

  - Definir parafuso.

  - Identificar cada um dos tipos de parafusos.

  - Citar os fatores que contribuem para um parafuso acidental.

  - Descrever as características de um avião em voo quando em

  estol.

  - Citar os fatores contribuintes do estol de um avião em voo.

  - Citar os meios de prevenção do estol de um avião em voo.

  - Interpretar os limites operacionais contidos nos manuais de voo.

  8.2

  - Reconhecer os riscos para a operação de aeronaves associados

  com cinzas vulcânicas ou poeira.

  - Reconhecer os riscos para a operação de aeronaves associados à

  formação de gelo nas asas e nas superfícies de controle.

  - Reconhecer as superfícies críticas de aeronaves e os perigos para

  o voo associados à contaminação dessas superfícies.

  - Reconhecer as condições com maior probabilidade de produzir

  contaminação das superfícies de uma aeronave.

  - Reconhecer o papel do DOV na identificação e na comunicação

  à tripulação a respeito das deficiências observadas na aeronave

  antes do voo.

  8.1 Parafuso e estol'
