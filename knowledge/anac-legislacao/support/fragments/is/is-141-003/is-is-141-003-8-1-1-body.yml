title: Providências administrativas aplicáveis pela autoridade de
text: '8.1.1 Providências administrativas aplicáveis pela autoridade de

  Aviação Civil em caso de infrações cometidas por operadores de

  aeronaves e despachantes operacionais de voo -- Tipos: multa;

  suspensão de certificados; cassação de licenças e certificados;

  detenção, interdição ou apreensão de aeronave ou do material

  transportado; intervenção nas empresas concessionárias ou

  autorizadas.'
