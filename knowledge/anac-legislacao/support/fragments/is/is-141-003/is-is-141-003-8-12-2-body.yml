text: '8.12.2 No serviço de informação de voo

  9 Serviço de alerta

  Objetivos específicos Subunidades

  9.1

  • Identificar as situações em que o serviço de alerta deve ser prestado.

  9.2

  • Identificar as características de cada uma das fases de emergência e quando

  cada uma delas se inicia.

  9.3

  • Identificar a sequência que deve ser efetuada a PRECOM quando se tomar

  conhecimento de que uma aeronave se encontra na fase de incerteza.

  9.4

  • Reconhecer a responsabilidade dos órgãos ATS no sentido de empregar

  todos os meios de comunicação disponíveis para estabelecer e manter

  comunicação com qualquer aeronave que se encontre em situação de

  emergência.

  9.5

  • Identificar o procedimento de notificação ao explorador, por parte dos

  órgãos ACC e ARCC, quando uma aeronave se encontrar em estado de

  incerteza, alerta ou perigo.

  9.1 Aplicação

  9.2 Fases de emergência'
