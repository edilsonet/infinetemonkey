title: 'DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003'
text: '8.3.1 DefiniçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Definir nevoeiro.

  • Citar as condições gerais para a formação de nevoeiro.

  • Definir saturação por resfriamento.

  • Definir nevoeiros de massas de ar e nevoeiros frontais.

  • Citar as características do nevoeiro de radiação, do nevoeiro

  de vapor, do nevoeiro marítimo, do nevoeiro orográfico (ou de

  encosta), do nevoeiro de brisa, do nevoeiro pré-frontal e do

  nevoeiro pós-frontal.

  • Citar as condições favoráveis para a ocorrência do nevoeiro de

  radiação, do nevoeiro de vapor, do nevoeiro marítimo, do

  nevoeiro orográfico (ou de encosta), do nevoeiro de brisa, do

  nevoeiro pré-frontal e do nevoeiro pós-frontal.

  • Explicar os processos de formação do nevoeiro de radiação, do

  nevoeiro de vapor, do nevoeiro marítimo, do nevoeiro

  orográfico (ou de encosta), do nevoeiro de brisa, do nevoeiro

  pré-frontal e do nevoeiro pós-frontal.

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  nevoeiros.

  • Interpretar as informações meteorológicas concernentes a

  nevoeiros.

  • Utilizar as informações meteorológicas concernentes a

  nevoeiros.

  • Explicar a influência do nevoeiro leve, do nevoeiro moderado

  e do nevoeiro forte nas operações de pouso e decolagem de

  aviões.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência de nevoeiros na operação de aviões.

  8.4

  • Definir precipitação atmosférica, precipitação atmosférica

  sólida e precipitação atmosférica líquida.

  • Citar as finalidades do pluviômetro e do pluviógrafo.

  8.5

  • Definir hidrometeoros

  • Identificar hidrometeoros depositados, hidrometeoros em

  suspensão e hidrometeoros precipitados.

  • Diferenciar hidrometeoros contínuos, hidrometeoros

  intermitentes e pancadas.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes das influências exercidas na operação de aviões

  aos diversos tipos de hidrometeoros

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  hidrometeoros.

  • Interpretar as informações meteorológicas concernentes aos

  diversos tipos de hidrometeoros.

  • Utilizar as informações meteorológicas concernentes aos

  diversos tipos de hidrometeoros.

  8.6

  • Definir litometeoros.

  • Identificar os diferentes tipos de litometeoros.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes das influências exercidas na operação de aviões

  aos diversos tipos de litometeoros.

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  litometeoros.

  • Interpretar as informações meteorológicas concernentes aos

  diversos tipos de litometeoros.'
