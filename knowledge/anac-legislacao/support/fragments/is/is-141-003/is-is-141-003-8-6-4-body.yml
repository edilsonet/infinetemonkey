text: '8.6.4 Informações específicas sobre cinzas vulcânicas - ICAO

  International Airwais Volcano Watch (IAVW). Detecção.

  Relatório, incluindo código de cores. Movimentação de nuvens

  de cinzas vulcânicasData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  • Utilizar as informações meteorológicas concernentes aos

  diversos tipos de litometeoros.

  9 Visibilidade

  Objetivos Específicos Subunidades

  9.1

  • Definir visibilidade horizontal, visibilidade vertical,

  visibilidade oblíqua, visibilidade de aproximação e alcance

  visual da pista.

  • Identificar os limites mínimos, para voo visual, de visibilidade

  horizontal, de visibilidade vertical, de visibilidade oblíqua, de

  visibilidade de aproximação e de alcance visual da pista.

  9.2

  • Identificar os processos e condições que resultam em reduções

  significativas de visibilidade.

  • Citar as restrições e os riscos para a segurança de voo

  decorrentes da influência de baixos níveis de visibilidade.

  9.3

  • Citar os recursos utilizados para obtenção da visibilidade.

  • Identificar os limites mínimos de teto e de visibilidade para a

  operação de aeronaves.

  • Descrever os procedimentos preventivos a serem executados

  pelo DOV com relação a baixos níveis de visibilidade.

  9.4

  • Descrever os procedimentos a serem executados pelo DOV

  para obtenção das informações meteorológicas concernentes a

  visibilidade.

  • Interpretar as informações meteorológicas concernentes a

  visibilidade.

  • Utilizar as informações meteorológicas concernentes a

  visibilidade.

  9.1 Definição e tipos'
