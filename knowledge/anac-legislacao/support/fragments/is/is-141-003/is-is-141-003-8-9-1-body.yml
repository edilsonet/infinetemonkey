title: Notificação de informações meteorológicas
text: '8.9.1 Notificação de informações meteorológicas

  importantes para os órgãos meteorológicosData de emissão: 22 de dezembro de 2017. IS nº
  141-003

  Revisão A

  8.8

  • Salientar a importância de que o piloto seja informado sobre a interrupção

  ou o término da provisão do Serviço de Vigilância ATS.

  8.9

  • Reconhecer a importância da notificação, por parte do piloto aos órgãos

  meteorológicos, sobre as condições meteorológicas observadas durante o

  voo.

  8.10

  • Listar as funções para as quais as informações proporcionadas por um

  Sistema de Vigilância ATS e apresentadas em uma tela de vigilância podem

  ser usadas.

  • Citar o mínimo de separação horizontal padrão.

  • Citar o mínimo de separação horizontal com a utilização exclusiva do radar

  de rota em operação na TMA ou CTR.

  • Mencionar a possibilidade de redução, pelo DECEA, dos mínimos de

  separação horizontal quando as especificações técnicas e operacionais

  permitirem.

  8.11

  • Identificar as circunstâncias em que ocorre a orientação sobre a conveniência

  de executar uma aproximação radar.

  • Identificar as circunstâncias em que ocorre a instrução ao piloto para

  executar uma aproximação perdida.

  8.12

  • Identificar as funções que o sistema de vigilância ATS pode desempenhar

  no serviço de controle de aeródromo e no serviço de informação ao voo.

  8.10 Emprego do sistema de vigilância ATS no

  serviço de controle de tráfego aéreo'
