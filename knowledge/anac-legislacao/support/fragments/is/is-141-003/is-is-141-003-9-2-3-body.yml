title: Fase de Perigo (DETRESFA)
text: '9.2.3 Fase de Perigo (DETRESFA)

  9.3 Busca preliminar por comunicações

  (PRECOM)

  9.4 Emprego de circuitos de comunicação

  9.5 Informação para o explorador

  -- Responsabilidades do Centro de Controle de

  Área (ACC) e do Centro de Coordenação de

  Salvamento Aeronáutico (ARCC)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  10 Coordenação ATS

  Objetivos específicos Subunidades

  10.1

  • Identificar o significado da coordenação de tráfego aéreo, sua finalidade e

  de que forma é executada.

  10.2

  • Identificar os procedimentos de coordenação entre os órgãos no que se refere

  à prestação do serviço de informação de voo e do serviço de alerta.

  • Listar as informações a serem transmitidas entre os órgãos responsáveis pelo

  serviço de informação de voo e do serviço de alerta.

  • Justificar a necessidade de a coordenação ser completada antes que uma

  aeronave sob controle de um órgão, ou posição de controle, penetre em

  espaço aéreo sob jurisdição de outro órgão, ou posição de controle.

  • Identificar os procedimentos de coordenação entre os órgãos no que se refere

  à prestação do serviço de controle de tráfego aéreo.

  • Identificar os procedimentos de transferência de controle entre as posições

  operacionais “torre” e “controle de solo” para aeronaves que chegam e

  aeronaves que partem.

  • Identificar o conteúdo das informações a serem prestadas pelos órgãos ATC

  às estações de telecomunicações aeronáuticas, nas transferências de

  comunicações das aeronaves.

  • Citar os objetivos da coordenação entre os órgãos ATS e o serviço de

  meteorologia.

  • Citar a finalidade dos Acordos Operacionais estabelecidos entre os órgãos

  ATS e a Administração Aeroportuária.

  10.1 Finalidade e execução

  10.2 Procedimentos de coordenação'
