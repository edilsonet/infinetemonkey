text: '9.4.2 Interpretação e utilização

  10 Massas de ar

  Objetivos Específicos Subunidades

  10.1

  • Definir massa de ar.

  • Citar as características das massas de ar tropicais, equatoriais,

  polares, árticas, antárticas, continentais secas, marítimas

  úmidas, quentes e frias.

  • Citar as características das massas de ar continentais e das

  massas de ar marítimas.

  • Citar as características das massas de ar quentes e das massas

  de ar frias.

  10.2

  • Explicar as influências exercidas sobre as condições básicas

  das massas de ar pela radiação, pela convecção, pela

  condensação e pela evaporação.

  • Explicar as influências exercidas sobre as condições básicas

  das massas de ar pelo tipo de superfície, pela temperatura e

  pela pressão atmosférica.

  10.3

  • Explicar as modificações de natureza termodinâmica e de

  natureza mecânica ocorridas nas massas de ar.

  10.1 Definição e classificação das massas de ar'
