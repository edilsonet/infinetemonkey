text: 'APÊNDICE A - SIGLAS E ABREVIATURAS

  AFM = Aircraft Flight Manual

  AIP = Aeronautical Information Publication

  ASHTAM = Volcanic Ash NOTAM

  ATS = Air Traffic Service

  CBA = Código Brasileiro de Aeronáutica

  CBT = Competency Based Training and Assessment

  DOV = Despachante Operacional de Voo

  ETOPS/EDTO = Extended Operations/ Extended Diversion Time Operations

  EZFW = Estimated Zero Fuel Weight

  FCOM = Flight Crew Operations Manual

  FIR = Flight Information Region

  FPPM = Flight Planning and Performance Manual

  ICAO = International Civil Aviation Organization

  MEL = Minimum Equipment List

  MGO = Manual Geral de Operações

  NOTAM = Notice to Airman

  OACI = Organização de Aviação Civil Internacional

  PBN = Performance Based Navigation

  RBAC = Regulamento Brasileiro de Aviação Civil

  RBHA = Regulamento Brasileiro de Homologação Aeronáutica

  RVSM = Reduced Vertical Separation Minimum

  SARP = Standard and Recommended Practices (Normas e Práticas Recomendadas)

  SNOWTAM = Snow NOTAMData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
