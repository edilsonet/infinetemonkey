text: 'APÊNDICE AA - MÓDULO 2 -- SEGURANÇA DA AVIAÇÃO CIVIL CONTRA ATOS

  DE INTERFERÊNCIA ILÍCITA

  AA1. Introdução

  A segurança da aviação contra atos de interferência ilícita (AVSEC) tem sido uma das

  principais preocupações dos Estados e da indústria do transporte aéreo nos últimos anos,

  principalmente após os ataques ocorridos ao World Trade Center, em Nova Iorque, e ao

  Pentágono, em Washington, em 11 de setembro de 2001. Pelo fato de o DOV ser um dos

  elementos-chave na operação de aeronaves e, em particular, responsável por auxiliar o

  piloto em comando em todas as fases do voo, ele tem um papel vital a desempenhar em

  assuntos que afetem a segurança de voo (safety) ou que representem uma ameaça à

  segurança de uma aeronave (security), tanto em terra como no ar.

  Este componente curricular destina-se a apresentar aos alunos a regulamentação básica e

  os procedimentos para o gerenciamento de ameaças à segurança na operação de

  aeronaves.

  Por se tratar de um assunto em constante atualização, dado o possível surgimento de

  novos atos de interferência ilícita, os assuntos tratados por este componente curricular

  poderão, futuramente, sofrer alterações.

  AA2. Pré-requisitos

  Para o completo entendimento destes assuntos, o instrutor deve ministrá-los após terem

  sido vivenciados os assuntos referentes ao componente curricular Segurança de Voo.Data de
  emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  AA3. Objetivos instrucionais

  Condição O aluno deve ter acesso a cópias de documentos, diretrizes aeroportuárias e

  anexos da OACI relevantes para a segurança. Ele também deve ser familiarizado

  com sistemas de segurança utilizados para os voos nacionais e internacionais.

  Desempenho

  esperado

  O aluno deverá ser capaz de identificar um problema de segurança (security) e

  saber a quem contatar e onde obter informações e instruções sem demora.

  Padrão de

  desempenho

  O aluno deverá demonstrar compreensão adequada dos procedimentos de

  segurança em voos nacionais e internacionais, de modo que ele reaja de uma

  maneira eficiente e lógica a situações que envolvam questões de segurança contra

  atos de interferência ilícita.

  AA4. Orientações didáticas

  Os Anexos e Documentos publicados pela Organização de Aviação Civil Internacional

  (OACI) devem ser apresentados aos alunos de forma sucinta, em painéis, para que eles

  adquiram uma compreensão geral da regulamentação internacional relativa a AVSEC.

  Quanto à regulamentação nacional, é importante que os alunos aprofundem o

  conhecimento do Programa Nacional de Segurança da Aviação Civil Contra Atos de

  Interferência Ilícita (PNAVSEC) - Decreto Nº 7.168, de 5 de maio de 2010, ou legislação

  que venha a substituí-lo.

  O estudo de casos relacionados a ameaças a aeronaves, instalações aeroportuárias e áreas

  de segurança são de grande valor para que os alunos compreendam a importância dos

  procedimentos a serem adotados por todos os envolvidos nas operações com aeronaves.

  AA5. Ementa

  O conteúdo programático deste componente curricular está subdividido em três Unidades

