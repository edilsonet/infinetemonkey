title: apendice-aa-modulo-2-seguranca-da-aviacao-civil-contra-atos(c)
text: '(c) Unidade 3 -- Ameaças e sequestro de aeronave

  AA6. Plano das unidades e subunidades didáticas

  Componente Curricular: SEGURANÇA DA AVIAÇÃO CIVIL CONTRA ATOS DE

  INTERFERÊNCIA ILÍCITAData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Módulo 2 Carga Horária: 9 h-a

  Unidades Didáticas

  1 Noções gerais

  Objetivos Específicos Subunidades

  1.1

  • Definir ato de interferência ilícita.

  • Estabelecer a diferença entre os dois conceitos de segurança

  propostos pela OACI: safety e security.

  • Reconhecer a finalidade dos procedimentos AVSEC.

  1.2

  • Reconhecer as Convenções de Chicago (1944), de Tóquio (1963),

  de Haia (1970) e de Montreal (1971 e 1999), e o Protocolo

  Complementar à Convenção de Montreal (1988) como instrumentos

  internacionais que estabelecem, entre outros temas, normas

  relacionadas a ofensas sofridas por aeronaves, aeroportos e demais

  instalações aeronáuticas.

  • Resumir as principais normas e orientações da OACI em relação a

  atos de interferência ilícita.

  1.3

  • Reconhecer o Programa Nacional de Segurança da Aviação Civil

  Contra Atos de Interferência Ilícita (PNAVSEC) e o Plano Nacional

  de Contingência (PNCAVSEC) como os documentos nacionais que

  normatizam a participação dos diversos órgãos envolvidos na

  proteção e nas ações de resposta a atos de interferência ilícita.

  1.1 Atos de interferência ilícita'
