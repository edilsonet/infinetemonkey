text: 'APÊNDICE AB - PRÁTICA DE DESPACHO NA ORGANIZAÇÃO DE INSTRUÇÃO

  AB1. Introdução

  AB1.1. A parte prática do curso de DOV deve ser desenvolvida na organização de instrução
  sob

  a forma de uma série de exercícios supervisionados pelo instrutor, em que seja oferecida

  aos alunos a oportunidade de desenvolver habilidades de tomada de decisão através da

  aplicação do conhecimento adquirido na parte teórica do curso. Os exercícios consistem

  em um planejamento de voo operacional com base em análise de condições

  meteorológicas, cálculo de combustível e de carga, seleção de auxílios à navegação, em

  conformidade com os regulamentos, procedimentos e, quando aplicável, suas alterações.

