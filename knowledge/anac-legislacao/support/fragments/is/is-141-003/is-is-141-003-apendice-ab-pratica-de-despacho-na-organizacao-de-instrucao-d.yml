text: '(d) aplicar os conhecimentos aeronáuticos.

  AB4.6. Desempenho não satisfatório do aluno

  AB4.6.1. Se, no julgamento do instrutor, o aluno não cumprir o objetivo de qualquer tarefa

  realizada, o instrutor deve esclarecer, no debriefing individual do aluno, quais foram as

  falhas apresentadas e quais tarefas ou partes delas devem ser refeitas, a fim de que o aluno

  obtenha um desempenho satisfatório segundo a escala de avaliação descrita no item 5.7.3

  desta IS.

  AB4.6.2. O instrutor deve preencher tantas fichas de avaliação quantas forem necessárias,
  a fim de

  manter os registros do progresso do aluno nas áreas de operação e respectivas tarefas, até

  que sejam executadas de forma satisfatória.

  AB4.6.3. Baixo desempenho, erros e/ou falhas do aluno em qualquer área devem ser considerados

  desempenho não satisfatório, tais como:'
