text: '(f) Proporcionar a proficiência em tomada de decisões e na elaboração detalhada de

  autorizações e planos de voo, utilizando informações disponíveis normalmente

  apenas para o despachante operacional de voo.

  AB1.3. Portanto, o foco da instrução prática é o planejamento do voo, cujo objetivo é o
  de

  produzir um plano de voo operacional que combine tempo mínimo de voo, aliado com

  combustível mínimo, na melhor rota possível, evitando más condições atmosféricas,

  seguindo todos os procedimentos de segurança e cumprindo com as normas e os

  regulamentos de tráfego aéreo. Para realizar um planejamento de voo, o DOV deve usar

  todas as habilidades aprendidas e os conhecimentos adquiridos na parte teórica deste

  curso, incluindo navegação aérea, performance da aeronave, meteorologia, legislação e

  regulamentação, peso e balanceamento e regulamentos de tráfego aéreo (serviços).

  Apresentará o plano de voo ATC e tomará decisões operacionais.

  AB2. Pré-requisitos

  AB2.1 Para iniciar a instrução prática, o aluno deve ter sido aprovado na parte teórica
  do curso

  de DOV.

  AB3. Objetivos instrucionais

  Condições Cada aluno deve ter acesso, na sala de aula, a cópias de tabelas de

  subida, cruzeiro e descida, cartas de navegação, bem como perfis de

  subida, aproximação e descida, e gráficos, com acesso aos dados

  de desempenho aplicáveis, informação de peso e balanceamento e

  quaisquer outras informações consideradas necessárias para a

  preparação de um planejamento operacional de voo. Os formandos

  devem portar uma calculadora científica, computador de navegação

  e também um conjunto de régua, transferidor, canetas e lápis.

  Desempenho

  esperado

  Considerando os dados apropriados e o acesso a seções apropriadas

  do manual da aeronave, o aluno será capaz de elaborar um plano de

  voo operacional, de acordo com as regras e normas estabelecidas.

  Padrão de

  desempenho

  Ao final deste módulo, o aluno estará preparado a acompanhar um

  treinamento inicial e posteriormente ao estágio operacional em uma

  empresa aérea.

  AB4. Orientações didáticas

  AB4.1. Considerações gerais

  AB4.1.1. Devem ser criadas situações idênticas a um ambiente de Centro de Despacho de Voo

  (CDV) e/ou Centro de Controle Operacional (CCO), como uma representação dasData de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  operações, com alunos nas posições de coordenação de aviões, escala de tripulantes

  (aplicando a regulamentação do aeronauta), Coordenação de manutenção ( informando

  itens MEL), despacho operacional e estação rádio.

  AB4.1.2. Condições operacionais simuladas ou reais para cada exercício devem ser claramente

  especificadas pelo instrutor. Os exercícios devem ser feitos da forma mais realista

  possível. Registros de voo anteriores, previsões meteorológicas, mapas, observações

  meteorológicas, etc, podem ser usados. A discussão em grupo após cada exercício será

  benéfica para esclarecer possíveis equívocos.

  AB4.1.3. Na definição das condições para o exercício, o instrutor deve incluir para cada
  caso,

  conforme aplicável:'
