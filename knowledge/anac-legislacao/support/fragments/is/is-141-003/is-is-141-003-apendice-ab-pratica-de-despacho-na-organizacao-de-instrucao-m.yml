text: '(m) parada intermediária, reabastecimento, movimentação de passageiros, redespacho

  do voo, condições meteorológicas.

  AB4.4. Responsabilidades do instrutor

  AB4.4.1. O instrutor é responsável pelo fornecimento de informações meteorológicas e NOTAM

  atualizadas, bem como por verificar se o aluno preenche os padrões aceitáveis de

  conhecimentos e habilidades para cada tarefa dentro dos padrões de desempenho

  estabelecidos para cada componente curricular do curso teórico. Não há divisão formal

  entre conhecimentos (avaliação oral) e habilidades (demonstração). Ambas, avaliação

  oral e demonstração, devem estar presentes durante a execução das tarefas.

  AB4.4.2. As tarefas dedicadas ao planejamento de voo manual podem ser consideradas uma

  demonstração de habilidade; no entanto, o instrutor deve verificar se o aluno evidencia

  seu conhecimento do processo de planejamento de voo manual e dos cálculos envolvidos.

  AB4.4.3. O tempo de duração de cada atividade prática fica a critério do instrutor.

  AB4.4.4. A avaliação dos alunos deve ser um processo contínuo ao longo da parte prática
  do curso

  de DOV. Avaliação oral para determinar o conhecimento do aluno a respeito das tarefas

  a serem desenvolvidas e dos fatores de segurança relacionados deve ser usada com

  prudência em todos os momentos. O instrutor deve testar, na medida do possível,Data de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  habilidades correlatas do aluno, ao invés de memorização de fatos, durante todo o

  exercício prático. Para avaliar as atividades, devem ser usadas as fichas de avaliação

  constantes no Apêndice AC e os critérios descritos no item 5.7.5 desta IS.

  AB4.4.5. Caso o instrutor julgue que uma tarefa esteja incompleta ou o resultado seja incerto,
  pode

  exigir que o aluno repita essa tarefa, ou partes dela.

  AB4.5. Desempenho satisfatório do aluno

  AB4.5.1. Um desempenho satisfatório significa que, no julgamento do instrutor, o aluno é
  capaz

  de demonstrar habilidade e responder corretamente às perguntas feitas pelo instrutor em,

  pelo menos, 70 por cento do tempo.

  AB4.5.2. Desempenho satisfatório para atender às exigências da certificação do DOV se baseia
