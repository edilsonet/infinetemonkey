  AB4.3. Prática de planejamento de voo

  AB4.3.1. O conteúdo do planejamento do aluno para um determinado voo irá necessariamente
  variar

  dependendo do caráter do voo estabelecido pelo instrutor. A seguir, são pontos de

  interesse primário que devem ser incluídos, se possível:'
