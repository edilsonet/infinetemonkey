text: 'APÊNDICE B - PERFIL DE CONCLUSÃO DO CURSO DE DOV

  B1. Estrutura básica

  1. Unidade de Competência: Descrição de uma tarefa ou parte dela que pode ser efetivamente
  avaliada no local

  onde é desempenhada.

  1.1 Elemento de Competência: Subconjunto de conhecimentos, habilidades, e atitudes necessárias
  para

  desempenhar uma parte específica de determinada tarefa/atividade.'
