title: APÊNDICE C - PERFIL DO INSTRUTOR DO CURSO DE DOV
text: 'APÊNDICE C - PERFIL DO INSTRUTOR DO CURSO DE DOV

  Perfil do instrutor para a parte teórica do curso de formação de DOV

  Componente

  Curricular

  Código Formação mínima requerida para o instrutor

  Fundamentos de

  Matemática

  FMA Licenciado em Matemática ou Física, ou graduado em Engenharia.

  Fundamentos de

  Física

  FFI Licenciado em Física, ou graduado em Engenharia.

  Inglês Básico INB Licenciado em Língua Inglesa ou profissional com experiência

  comprovada de, pelo menos, cinco anos no ensino de língua inglesa.

  Inglês Técnico INT Licenciado em Língua Inglesa, com curso de graduação, extensão ou

  especialização na área de aviação ou de inglês aeronáutico; ou detentor

  da licença de DOV ou de Piloto Comercial emitidas pela ANAC, com

  Licenciatura em Língua Inglesa; ou detentor de licença de Piloto

  Comercial emitida pela ANAC, com aprovação Nível 6 no Santos

  Dumont English Assessment .

  Conhecimentos

  Técnicos de

  Aeronaves

  CTA Detentor de licença de Piloto Comercial - Avião com habilitação de

  instrutor de voo ou de licença de Mecânico de Voo ou de Manutenção

  Aeronáutica (com as três habilitações), ou de licença de Despachante

  Operacional de Voo concedidas pela ANAC; Engenheiro Aeronáutico,

  Tecnólogo em Pilotagem Profissional de Aeronaves, ou Tecnólogo em

  Manutenção de Aeronaves.

  Teoria de voo TV Detentor de licença de Piloto Comercial - Avião com habilitação em

  instrutor de voo ou de licença de Despachante Operacional de Voo

  concedidas pela ANAC; Engenheiro Aeronáutico, ou Tecnólogo em

  Pilotagem Profissional de Aeronaves.

  Peso e

  Balanceamento

  P&B Detentor de licença de Piloto de Linha Aérea - Avião ou de Despachante

  Operacional de Voo concedidas pela ANAC; ou Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea), ou Engenheiro Aeronáutico

  com experiência no setor de operações de empresa aérea.

  Peso e

  Performance

  PER Detentor de licença de Piloto de Linha Aérea - Avião ou de Despachante

  Operacional de Voo concedidas pela ANAC; Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea) ou Engenheiro Aeronáutico.

  Planejamento de

  Voo

  PLAN Detentor de licença de Piloto de Linha Aérea - Avião ou de Despachante

  Operacional de Voo concedidas pela ANAC.

  Navegação Aérea

  I - Visual e

  Estimada

  NAV I Detentor de licença de Piloto Comercial com habilitação em instrutor de

  voo ou de licença de Despachante Operacional de Voo concedidas pela

  ANAC; Bacharel em Ciências Aeronáuticas (nível Piloto de Linha

  Aérea), ou Tecnólogo em Pilotagem Profissional de Aeronaves.

  Navegação Aérea

  II-

  Radionavegação

  NAV II Detentor de licença de Piloto de Linha Aérea ou de licença de

  Despachante Operacional de Voo concedidas pela ANAC; Bacharel em

  Ciências Aeronáuticas (nível Piloto de Linha Aérea), ou Tecnólogo em

  Pilotagem Profissional de Aeronaves.

  Monitoramento

  de Voo

  MON Detentor de licença de Piloto de Linha Aérea ou de licença de

  Despachante Operacional de Voo concedidas pela ANAC.

  Meteorologia

  Aeronáutica

  MET Detentor de licença de Piloto Comercial ou de licença de Despachante

  Operacional de Voo concedidas pela ANAC; Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea), Tecnólogo em Pilotagem

  Profissional de Aeronaves, ou profissional com formação em nível

  técnico ou superior em Meteorologia.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Fatores

  Humanos na

  Aviação Civil

  FH Bacharel em Psicologia ou detentor de licença de Piloto Comercial -

  Avião ou de licença de Despachante Operacional de Voo concedidas

  pela ANAC, todos com curso de Gerenciamento de Recursos da

  Tripulação (CRM).

  Regulamentos do

  Tráfego Aéreo

  RTA Detentor de licença de Piloto Comercial ou de licença de Despachante

  Operacional de Voo concedidas pela ANAC; Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea), Tecnólogo em Pilotagem

  Profissional de Aeronaves, ou profissional com formação em Controle

  de Tráfego Aéreo.

  Regulamentação

  do Transporte

  Aéreo

  RTR Detentor de licença de Piloto Comercial ou de licença de Despachante

  Operacional de Voo concedidas pela ANAC; Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea), Tecnólogo em Pilotagem

  Profissional de Aeronaves, ou profissional com formação em Controle

  de Tráfego Aéreo.

  Comunicações

  Aeronáuticas

  COM Detentor de licença de Piloto Comercial ou de licença de Despachante

  Operacional de Voo concedidas pela ANAC; Bacharel em Ciências

  Aeronáuticas (nível Piloto de Linha Aérea), Tecnólogo em Pilotagem

  Profissional de Aeronaves, ou profissional com formação em Controle

  de Tráfego Aéreo.

  Legislação

  Aeronáutica

  LEG Bacharel em Direito, com curso de extensão ou especialização em

  legislação aeronáutica; Bacharel em Ciências Aeronáuticas (nível Piloto

  de Linha Aérea), Tecnólogo em Pilotagem Profissional de Aeronaves ou

  detentor de licença de Despachante Operacional de Voo concedida pela

  ANAC.

  Segurança de

  Voo

  SEG Detentor de licença de Piloto Comercial ou de Despachante Operacional

  de Voo concedidas pela ANAC; Bacharel em Ciências Aeronáuticas

  (nível Piloto de Linha Aérea), Tecnólogo em Pilotagem Profissional de

  Aeronaves. Todos devem ser elementos credenciados em segurança de

  voo pelo CENIPA, com curso de SGSO.

  Segurança

  contra Atos de

  Interferência

  Ilícita

  SAI Detentor de licença de Piloto Comercial ou de Despachante Operacional

  de Voo concedidas pela ANAC; Bacharel em Ciências Aeronáuticas

  (nível Piloto de Linha Aérea), ou Tecnólogo em Pilotagem Profissional

  de Aeronaves. Todos deverão possuir curso específico da área de

  Security.

  Transporte

  Aéreo de Artigos

  Perigosos

  TAP Detentor de licença de Despachante Operacional de Voo ou de Piloto

  Comercial concedida pela ANAC, que tenha certificado válido,

  conforme RBAC 175 e IS 175-002, no curso de Transporte Aéreo de

  Artigos Perigosos - Chave 10; ou profissional que tenha certificado

  válido conforme, RBAC 175 e IS 175-002, no curso de Transporte Aéreo

  de Artigos Perigosos - Chave 6.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A'
