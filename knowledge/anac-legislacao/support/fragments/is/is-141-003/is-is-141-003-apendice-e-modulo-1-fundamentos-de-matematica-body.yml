  Revisão A

  E3. Objetivos instrucionais

  Condição Com base nos materiais de referência relativos aos fundamentos de matemática

  aplicados à aviação,

  Desempenho

  esperado

  o aluno deverá:

  - interpretar e utilizar diferentes formas de representação (tabelas, gráficos,

  sistemas de medidas, abreviaturas, acrônimos e siglas);

  - analisar qualitativamente dados quantitativos representados graficamente

  relacionados à operação de aeronaves.

  - desenvolver modelos explicativos para sistemas tecnológicos e naturais

  relacionados à operação de aeronaves;

  - utilizar instrumentos de medição e de cálculo;

  - procurar e sistematizar informações relevantes para a compreensão de uma

  situação-problema apresentada;

  - formular hipóteses e prever resultados;

  - interpretar e criticar resultados a partir de experimentos, simulações e

  demonstrações; e

  Padrão de

  desempenho

  O aluno será capaz de fazer uso dos conhecimentos da Matemática para planejar,

  executar e avaliar intervenções práticas em sua área de atuação, em especial, as

  habilidades de:

  - realizar cálculos com a presteza indispensável às condições em operacionais

  em que irá atuar, incluindo as emergências;

  - interpretar gráficos e tabelas

  E4. Orientações didáticas

  Embora seja uma revisão dos assuntos tratados no ensino médio, o programa de

  Matemática sugerido para o curso deve merecer atenção do instrutor que, certamente,

  encontrará grande heterogeneidade no desempenho dos alunos. Uma avaliação

  diagnóstica é necessária para verificar o nível dos alunos e os assuntos que precisarão
  ser

  mais ou menos aprofundados no desenvolvimento deste componente curricular.

  As situações-problema a serem apresentadas pelo instrutor devem se referir a situações

  vividas no meio aeronáutico, a fim de acentuar o caráter instrumental deste componente

  curricular.

  E5. Ementa

