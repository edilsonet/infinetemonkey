title: APÊNDICE E - MÓDULO 1 - FUNDAMENTOS DE MATEMÁTICA
text: 'APÊNDICE E - MÓDULO 1 - FUNDAMENTOS DE MATEMÁTICA

  E1. Introdução

  Na concepção deste componente curricular para o curso teórico de DOV, deseja-se

  oportunizar aos alunos uma visão dos conhecimentos da matemática aplicados à atividade

  de voo.

  Com o estudo de Matemática aplicado à aviação, pretende-se desenvolver

  conhecimentos, habilidades e atitudes que sirvam para o exercício de intervenções e

  julgamentos práticos pertinentes à atividade do DOV. Isso significa, por exemplo,

  propiciar os fundamentos capazes de permitir o entendimento de equipamentos e de

  procedimentos técnicos, bem como a obtenção e a análise de informações. O caráter

  multifacetado da aviação demanda a integração desses saberes.

  A Matemática tem um valor formativo, que ajuda a estruturar o pensamento e o raciocínio

  lógico-dedutivo, porém também desempenha um papel instrumental, pois é uma

  ferramenta que serve para muitas tarefas específicas relacionadas à atividade aérea -

  navegação, por exemplo.

  Em seu papel formativo, a Matemática contribui para o desenvolvimento de processos de

  pensamento e a aquisição de atitudes, cuja utilidade e alcance transcendem o âmbito da

  própria Matemática, podendo formar no aluno a capacidade de resolver problemas

  genuínos, gerando hábitos de investigação, proporcionando confiança e desprendimento

  para analisar e enfrentar situações novas, propiciando a formação de uma visão ampla e

  científica da realidade.

  No que diz respeito ao caráter instrumental da Matemática, ela deve ser vista pelo aluno

  como um conjunto de técnicas e estratégias a serem aplicadas em outras áreas do

  conhecimento. Não se trata de o aluno possuir muitas e sofisticadas estratégias, mas sim

  de desenvolver a iniciativa e a segurança para adaptá-las a diferentes contextos, usando-

  as adequadamente no momento oportuno.

  Na aviação, poderia se destacar a necessidade de conhecimento de sistemas de localização

  geográfica (sistema cartesiano) para a navegação; a leitura e interpretação de informações

  dos diversos instrumentos de auxílio à navegação; os cálculos envolvendo relações

  trigonométricas para o traçado das rotas; o domínio sobre medidas, unidades (metros, pés,

  milhas, etc. ); enfim, muitas são as situações no âmbito da aviação em que a matemática

  é altamente necessária.

