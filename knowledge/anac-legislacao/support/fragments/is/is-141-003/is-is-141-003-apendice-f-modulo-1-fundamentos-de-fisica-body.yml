title: APÊNDICE F - MÓDULO 1 - FUNDAMENTOS DE FÍSICA
text: 'APÊNDICE F - MÓDULO 1 - FUNDAMENTOS DE FÍSICA

  F1. Introdução

  Assim como ocorre com a Matemática, este componente curricular objetiva permitir ao

  aluno a consolidação dos conceitos e as ferramentas necessárias à interpretação dos fatos,

  fenômenos e processos naturais e propicia a compreensão dos princípios que regulam

  esses fenômenos, como meios de prepará-los para as aprendizagens posteriores, incluídas

  na preparação do DOV: Meteorologia, Conhecimentos Técnicos das Aeronaves, Teoria

  de Voo e Navegação Aérea.

  F2. Pré-requisitos - Não há

  F3. Objetivos instrucionais

  Condição Com base nos materiais de referência acerca dos fundamentos física aplicados à

  aviação,

  Desempenho

  esperado

  o aluno deverá:

  • interpretar e utilizar diferentes formas de representação (tabelas, gráficos,

  sistemas de medidas, abreviaturas, acrônimos e siglas);

  • analisar qualitativamente dados quantitativos representados graficamente

  relacionados à operação de aeronaves.

  • desenvolver modelos explicativos para sistemas tecnológicos e naturais

  relacionados à operação de aeronaves;

  • utilizar instrumentos de medição e de cálculo;

  • procurar e sistematizar informações relevantes para a compreensão de uma

  situação-problema apresentada;

  • formular hipóteses e prever resultados; e

  • interpretar e criticar resultados a partir de experimentos, simulações e

  demonstrações.

  Padrão de

  desempenho

  O aluno será capaz de fazer uso dos conhecimentos da Física para planejar,

  executar e avaliar intervenções práticas em sua área de atuação, em especial, as

  habilidades de:

  • realizar cálculos com a presteza indispensável às condições em operacionais

  em que irá atuar, incluindo as emergências; e

  • interpretar gráficos e tabelas.

  F4. Orientações didáticas

  Embora seja uma revisão dos assuntos tratados no ensino médio, o programa de FisicaData
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  sugerido para o curso deve merecer atenção do instrutor que, certamente, encontrará

  grande heterogeneidade no desempenho dos alunos. Uma avaliação diagnóstica é

  necessária para verificar o nível dos alunos e os assuntos que precisarão ser mais ou

  menos aprofundados no desenvolvimento deste componente curricular, sem o objetivo de

  atribuir-lhes nota.

  As situações-problema a serem apresentadas pelo instrutor devem se referir a situações

  vividas no meio aeronáutico, a fim de acentuar o caráter instrumental deste componente

  curricular.

  F5. Ementa

  O conteúdo programático deste componente curricular está subdividido em sete Unidades

  Didáticas , conforme abaixo'
