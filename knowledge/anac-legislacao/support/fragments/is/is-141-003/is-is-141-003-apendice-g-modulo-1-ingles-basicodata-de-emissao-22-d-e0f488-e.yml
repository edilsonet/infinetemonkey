text: '(e) Unidade 5 -- Produção escrita

  5. Plano das unidades e subunidades didáticasData de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  Componente Curricular: INGLÊS BÁSICO

  Módulo 1 Carga Horária: 30 h-a

  Unidades Didáticas

  1 Vocabulário

  Objetivos Específicos Subunidades

  • Identificar vocabulário básico da área de aviação.

  • Reconhecer vocabulário básico da área de aviação.

  • Praticar vocabulário básico da área de aviação.

  • Identificar vocabulário característico dos manuais

  das aeronaves típicas com as quais um DOV

  trabalha.

  • Identificar o significado do vocabulário

  característico dos manuais das aeronaves típicas com

  as quais um DOV trabalha.

  • Praticar vocabulário característico dos manuais das

  aeronaves típicas com as quais um DOV trabalha.

  • Identificar vocabulário relativo a aeródromos,

  emergências da aviação, segurança operacional,

  procedimentos operacionais básicos e circuito de

  tráfego aéreo.

  • Identificar o significado do vocabulário relativo a

  aeródromos, emergências da aviação, segurança

  operacional, procedimentos operacionais básicos e

  circuito de tráfego aéreo.

  • Praticar vocabulário relativo a aeródromos,

  emergências da aviação, segurança operacional,

  procedimentos operacionais básicos e circuito de

  tráfego aéreo.

  • Identificar as abreviaturas, as siglas e os acrônimos

  em inglês mais comumente utilizados na aviação.

  • Identificar o significado das abreviaturas, as siglas e

  os acrônimos em inglês mais comumente utilizados

  na aviação.

  • Utilizar as abreviaturas, as siglas e os acrônimos em

  inglês mais comumente utilizados na aviação

  1.1 Verbos importantes para compreensão de publicações da aviação civil

  em língua inglesa (Important verbs)'
