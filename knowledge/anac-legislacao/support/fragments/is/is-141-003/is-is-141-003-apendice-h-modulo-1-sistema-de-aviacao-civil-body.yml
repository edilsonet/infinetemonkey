title: APÊNDICE H - MÓDULO 1 -- SISTEMA DE AVIAÇÃO CIVIL
text: 'APÊNDICE H - MÓDULO 1 -- SISTEMA DE AVIAÇÃO CIVIL

  H1. Introdução

  O componente curricular Sistema de Aviação Civil procura desenvolver nos alunos uma

  visão sistematizada da Aviação Civil Internacional e Brasileira, indispensável à

  compreensão da finalidade da OACI (segurança, economia e eficiência do transporte

  aéreo), e pretende situar o aluno no contexto em que vai atuar, caracterizando-o quanto
  à

  finalidade, estrutura e funcionamento, abrangência e interação.

  Iniciando-se com breve sequência histórica do desenvolvimento da Aviação Civil desde

  seus primórdios, pretende-se situar o aluno no amplo contexto em que atuará, além de

  despertá-lo para perceber o quanto a aviação está sujeita a influências de diferentes

  origens, em razão de constituir poderoso recurso para a consecução dos intentos do ser

  humano, sejam eles voltados para a destruição ou para o progresso da humanidade.

  H2. Pré-requisitos

  Por abordar conhecimentos básicos indispensáveis à compreensão das atividades da

  OACI e da ANAC em relação à segurança, economia e eficiência do transporte aéreo, e

  por ser constituído de conteúdos que possibilitam uma visão geral da Aviação Civil, este

  componente curricular deve ser apresentado no início do curso.

  H3. Objetivos instrucionais

  Condição Contando com uma descrição geral dos requisitos regulamentares a serem

  cumpridos por um operador envolvido no transporte aéreo comercial e

  delineando documentos regulamentares significativos para o DOV, incluindo

  conceitos de controle operacional que ilustram a aplicação de requisitos

  regulamentares para o trabalho do DOV,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar o papel dos organismos internacionais e

  nacionais reguladores da aviação, identificar a importância da regulamentação

  aplicável à operação de aeronaves e aplicar regulamentos relativos à operação da

  aeronave nas áreas que se enquadram os deveres e responsabilidades do DOV.

  Padrão de

  desempenho

  Os regulamentos e legislação aplicável ao sistema de aviação civil deve ser

  completamente identificado e as suas disposições e aplicações práticas

  compreendidas e implementadas, conforme necessário.Data de emissão: 22 de dezembro de 2017.
  IS nº 141-003

  Revisão A

  H4. Orientações didáticas

  O instrutor deve ir além da simples informação sobre fatos, enfatizando, com os alunos,

  a inter-relação entre os temas a serem abordados. Entre eles, por exemplo, a importância

  do Sistema de Aviação Civil, com suas organizações, conferências e demais eventos

  internacionais, através dos quais representantes de diferentes países têm a possibilidade

  de refletir em conjunto e criar mecanismos reguladores indispensáveis ao

  desenvolvimento da Aviação Civil em uma perspectiva global.

  Os assuntos podem ser tratados, basicamente, por meio da exposição oral dialogada. No

  entanto, devido ao grande número de informações que não se relacionam, ainda, com a

  experiência dos alunos e, por isso, podem tornar a instrução cansativa e desinteressante,

  devem ser apresentadas situações ocorridas ou que podem ocorrer, que envolvam a

  atividade do DOV. A análise e a discussão de tópicos pela turma, em conjunto com o

  instrutor, favorecem a compreensão em detrimento da simples memorização, facilitando,

  assim, a construção e a fixação dos conhecimentos relevantes.

  O instrutor deve valer-se de uma “linha do tempo”, sobre a qual poderá assinalar os fatos

  e respectivas épocas na medida em que os assuntos vão sendo tratados, o que contribuirá

  para que os alunos acompanhem com facilidade o desenvolvimento da Aviação Civil e

  compreendam e fixem as relações de causa e efeito.

  Como recursos auxiliares da instrução, serão também especialmente úteis gravuras,

  slides, CDs, DVDs, vídeos ou partes de vídeos, organogramas, fluxogramas, quadros

  sinóticos e exemplares de publicações, tais como os Anexos à Convenção sobre a Aviação

  Civil Internacional e documentos normativos relacionados à estrutura, à organização e ao

  funcionamento da ANAC.

  H5. Ementa

  O conteúdo programático deste componente curricular está subdividido em duas

