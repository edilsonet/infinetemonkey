text: 'APÊNDICE J - MÓDULO 1 -- SEGURANÇA DE VOO

  J1. Introdução

  No Brasil, o Código Brasileiro de Aeronáutica (CBAer), Lei 7.565, de 19 de dezembro

  de 1986, em seu artigo 25, estabelece que a infraestrutura aeronáutica é também destinada

  a promover a segurança, a regularidade e a eficiência da aviação civil.

  A Lei 11.182, de 27 de setembro de 2005, estabelece que a ANAC é responsável por

  promover a segurança, a regularidade e a eficiência em todos os aspectos da aviação civil,

  exceto os relativos ao sistema de controle do espaço aéreo e do sistema de investigação

  de acidentes aeronáuticos.

  O sistema de controle do espaço aéreo segue vários Anexos da Convenção, dentre os

  quais tem-se: Anexo 3 (Meteorologia), Anexo 4 (Cartas Aeronáuticas), Anexo 10

  (Telecomunicações), Anexo 11 (Tráfego aéreo), Anexo 12 (Busca e salvamento) e Anexo

  15 (Serviços de informação). No Brasil, o assunto está a cargo do Departamento de

  Controle do Espaço Aéreo (DECEA) do Comando da Aeronáutica.

  O sistema de investigação e prevenção de acidentes aeronáuticos segue o Anexo 13 da

  Convenção, que fornece as diretrizes para a atuação dos organismos encarregados pelas

  investigações de acidentes em cada país. No Brasil, o órgão responsável pela investigação

  de acidentes é o Centro de Investigação e Prevenção de Acidentes (CENIPA) do

  Comando da Aeronáutica. Na ANAC, a Gerência Geral de Investigação e Prevenção de

  Acidentes Aeronáuticos (GGIP) assessora a Agência e centraliza as informações relativas

  a acidentes, atuando em coordenação com o CENIPA.

  Em 1° de janeiro de 2009, a OACI implantou efetivamente o Safety Management System

  (SMS), traduzido no Brasil como Sistema de Gerenciamento da Segurança Operacional

  (SGSO), através de alterações nos Anexos 6, 11 e 14 da Convenção. Com o SGSO, o

  conceito de segurança de voo amplia-se para uma abordagem sistêmica e ampla,

  considerando todos os aspectos que envolvem a segurança na operação de uma aeronave

  e promovendo a melhoria continua dos níveis de segurança.

  O SGSO é implantado no Brasil por meio do do Programa Brasileiro de Segurança

  Operacional (PSO-BR), o qual estabelece como estratégia para a segurança operacional

  da aviação civil a elaboração e implantação de programas específicos para a ANAC e o

  COMAER.

  Na ANAC, o Programa de Segurança Operacional Específico da ANAC - PSOE-ANAC

  contempla as diretrizes e requisitos para orientar a implantação e desenvolvimento de

  Sistemas de Gerenciamento da Segurança Operacional - SGSO por parte de seus entes

  regulados.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  O DOV é um elemento-chave na operação de aeronaves e, em particular, é responsável

  por auxiliar o piloto em comando em todas as fases do voo. Portanto, ele tem um papel

  vital a desempenhar em assuntos que afetem a segurança de voo (safety).

  No âmbito nacional, o Sistema de Investigação e Prevenção de Acidentes Aeronáuticos

  (SIPAER) encontra-se regulamentado pelas seguintes publicações do Comando da

  Aeronáutica, ou documentos que venham a substituí-los:'
