text: 'APÊNDICE L - MÓDULO 1 -- CONHECIMENTOS TÉCNICOS DE AERONAVES

  L1. IntroduçãoData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  A formação do DOV deve incluir, além dos temas que se referem diretamente a suas

  responsabilidades, incluir o conhecimento de outros aspectos das operações da aviação,

  tais como os conhecimentos técnicos das aeronaves. Esses conhecimentos contribuem

  para oferecer aos alunos uma compreensão mais completa de seu futuro ambiente de

  trabalho.

  No âmbito deste tema geral, os alunos aprenderão terminologias da aviação comumente

  utilizadas e serão capazes de aplicá-las no contexto apropriado, conforme necessário, no

  intuito de desenvolver a consciência geral das operações de transporte aéreo e melhorar

  a comunicação com os membros da tripulação e com o pessoal de manutenção,

  melhorando assim a segurança da operação da aeronave.

  L2. Pré-requisitos - N/A

  L3. Objetivos instrucionais

  Em relação ao sistema propulsor das aeronaves:

  Condições Cada aluno deve ter acesso a material de referência adequado e, se possível, que

  participar em uma inspeção real de um motor de avião.

  Desempenho

  esperado

  O aluno deve ser capaz de identificar as principais características e diferenças

  entre os diversos tipos de sistemas de propulsão de aeronaves e sua influência

  na operação das aeronaves.

  Padrão de

  desempenho

  Os princípios dos sistemas de propulsão de aeronaves devem ser completamente

  entendidos e o aluno deve ser capaz de descrever o significado para a operação

  de voo dos vários tipos de sistemas de propulsão de aeronaves.

  Em relação aos demais sistemas das aeronaves:

  Condições De posse de material de referência adequado e de manuais de aeronaves de

  diversos modelos,

  Desempenho

  esperado

  o aluno deve ser capaz de compreender o funcionamento dos principais sistemas

  da aeronave e os efeitos da deficiência desses sistemas no desempenho das

  aeronaves.

  Padrão de

  desempenho

  O aluno deve demonstrar a compreensão adequada dos sistemas básicos e

  explicar satisfatoriamente os efeitos de sua falha no desempenho da aeronave.

  L4. Orientações didáticas

  É imprescindível a utilização de peças de aeronaves inteiras ou em corte, bem como o

  contato direto com aeronaves para familiarização do aluno. É válida também a utilização

  de modelos, ilustrações, gráficos, bem como o manuseio de manuais de aeronaves.Data de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  L5. Ementa

