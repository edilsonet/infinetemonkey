title: apendice-l-modulo-1-conhecimentos-tecnicos-de-aeronaves(o)
text: '(o) Unidade 15 - Manutenção da aeronave

  L6. Plano das unidades e subunidades didáticas

  Componente Curricular: CONHECIMENTOS TÉCNICOS DE AERONAVES

  Módulo 1 Carga Horária: 42 h-a

  Unidades DidáticasData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1 Constituição básica de um avião

  Objetivos específicos Subunidades

  1.1

  • Definir célula.

  • Definir grupo motopropulsor.

  • Definir aviônicos.

  1.2

  • Caracterizar as asas quanto à função e aos elementos estruturais.

  • Caracterizar a fuselagem quanto à função, bem como quanto aos tipos

  e suas respectivas características.

  • Caracterizar a empenagem quanto à função e aos elementos

  estruturais.

  • Citar as avarias das partes constituintes da célula das aeronaves que

  comprometem ou podem comprometer a eficiência e/ou a segurança

  de voo.

  • Citar os itens a serem verificados na inspeção pré-voo e na inspeção

  pós-voo das partes constituintes da célula das aeronaves.

  1.1 Partes principais da aeronave'
