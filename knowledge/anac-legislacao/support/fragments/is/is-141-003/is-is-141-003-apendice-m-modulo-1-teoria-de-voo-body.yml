title: APÊNDICE M - MÓDULO 1 -- TEORIA DE VOO
text: 'APÊNDICE M - MÓDULO 1 -- TEORIA DE VOO

  M1. Introdução

  Assim como ocorre com os conhecimentos técnicos das aeronaves, o ensino da teoria e

  da fisiologia do voo destina-se a apresentar os princípios de voo, a familiarizar os alunos

  com a terminologia comumente utilizada e a aplicá-la no contexto apropriado, conforme

  necessário. Os conhecimentos obtidos pelo DOV nessa área vão permitir uma

  compreensão operacional mais abrangente, desenvolver a consciência geral da operação

  de transporte aéreo e contribuir para melhorar a comunicação com os membros da

  tripulação e o pessoal de manutenção.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  M2. Pré-requisitos

  O conteúdo programático deste componente curricular será melhor compreendido pelos

  alunos se for ministrado após concluídos os programas de Fundamentos de Matemática e

  de Fundamentos de Física.

  M3. Objetivos instrucionais

  Condição Usando modelos em escala, fotografias ou desenhos de aeronaves, ou

  diante uma aeronave real,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar e descrever os componentes básicos

  de uma aeronave, a sua utilização e funcionamento, e o efeito desses

  componentes nas condições de voo e da cabine. Deve demonstrar uma

  compreensão clara da teoria de voo e do ambiente básico relativo às

  operações de aeronaves.

  Padrão de

  desempenho

  Componentes básicos das aeronaves devem ser corretamente associados

  ao seu funcionamento básico e à operação. Itens de segurança

  relacionados, tais como superfícies críticas, a formação de gelo, e

  contaminação das superfícies devem ser inteiramente compreendidos pelo

  aluno.

  M4. Ementa

  O conteúdo programático deste componente curricular está subdividido em oito Unidades

  Didáticas , conforme abaixo:'
