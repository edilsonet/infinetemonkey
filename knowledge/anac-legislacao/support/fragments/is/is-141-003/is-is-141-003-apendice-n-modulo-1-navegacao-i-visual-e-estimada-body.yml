text: 'APÊNDICE N - MÓDULO 1 -- NAVEGAÇÃO I: VISUAL E ESTIMADA

  N1. Introdução

  Navegação Aérea é a ciência da localização da posição e do traçado do rumo de

  aeronaves, contribuindo para que cada uma delas voe de um lugar para outro, de forma

  mais eficiente e segura e dentro de um determinado tempo. O conhecimento de navegação

  aérea é um requisito essencial para os candidatos à profissão de DOV.

  Através deste componente curricular, os alunos irão adquirir conhecimentos sobre os

  princípios básicos de navegação e práticas exigidas para o planejamento e monitoramentoData
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  de voo. Dada a extensão e a complexidade dos assuntos, a Navegação Aérea foi dividida

  em duas partes: Navegação I - Visual e estimada, abordada no Módulo I, e Navegação II

  - Radionavegação, no Módulo II.

  N2. Pré-requisitos

  O conteúdo programático deste componente curricular será melhor compreendido pelos

  alunos se for desenvolvido após concluídos os programas de Fundamentos de

  Matemática, pois envolve conhecimentos de trigonometria básica, equações do segundo

  grau e o uso de calculadoras científicas e computadores de navegação.

  N3. Objetivos instrucionais

  Condição Usando materiais instrucionais adequados, livros didáticos, documentação da

  OACI, cartas aeronáuticas publicadas pelo DECEA e outras fontes, incluindo

  representação realista da Terra e instrumentos de navegação (tais como

  indicadores de velocidade e altímetros), se necessário,

  Desempenho

  esperado

  o aluno deverá ser capaz de aplicar os conhecimentos, habilidades e atitudes

  indicados nos objetivos específicos de cada Unidade Didática e demonstrar a

  capacidade de executar a ação necessária da maneira mais eficiente e eficaz.

  Padrão de

  desempenho

  Conceitos (posição, distância, tempo, etc.), propriedades, tais como as das

  diferentes cartas de navegação, normas e práticas recomendadas da OACI

  (SARP) relativas à navegação aérea, a interpretação de gráficos etc., tais como

  definidos nos objetivos específicos devem ser bem entendidos, e o aluno deve

  demonstrar a capacidade tanto para converter, medir e determinar (tempo,

  distância, títulos, altitude, velocidade, etc.), como é exigido pelos assuntos

  específicos como usar gráficos, calculadoras , computadores de navegação,

  quando apropriado e necessário ao exercício das funções do DOV.

  N4. Orientações didáticas

  Para que os alunos participem ativamente do curso, recomenda-se que eles disponham de

  calculadoras científicas, computadores de navegação, transferidores, compassos e réguas

  com escalas.

  Exemplos reais dos diferentes gráficos de projeção para todas as regiões (equatorial, de

  latitudes médias e polares) devem ser usados para a prática dos alunos em sala de aula,

  incluindo a medição de distâncias, medição de grande círculo, plotagem de linhas e fixos

  de grande círculo, traçado de rotas de grande círculo como determinado em cartas

  gnomônicas e comparando-as com as linhas retas de gráficos derivados de outros métodos

  de projeção (Mercator, Lambert etc.), medição de faixas de grade, convertendo-as para

  rumos verdadeiros e magnéticos.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  N5. Ementa

  O conteúdo programático deste componente curricular está subdividido em oito Unidades

  Didáticas , conforme abaixo:'
