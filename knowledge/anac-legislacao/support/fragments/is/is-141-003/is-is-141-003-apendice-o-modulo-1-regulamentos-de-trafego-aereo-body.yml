text: 'APÊNDICE O - MÓDULO 1 -- REGULAMENTOS DE TRÁFEGO AÉREO

  O1. Introdução

  O Serviço de Tráfego Aéreo (Air Traffic Service - ATS) é fornecido pelos Estados para

  garantir um fluxo seguro, ordenado e eficiente do tráfego aéreo. Além disso, ele tem

  vários objetivos menos conhecidos, tais como: economia de combustível, redução do

  ruído, perturbação ambiental mínima, relação custo-benefício, imparcialidade em relação

  a todos os usuários dentro das regras e regulamentos, bem como o atendimento às

  necessidades dos usuários, sempre que possível. Esses objetivos evidenciam a

  importância da responsabilidade do DOV no que se refere ao planejamento e

  monitoramento de voo e coordenação dentro das companhias aéreas.

  Como o Serviço de Tráfego Aéreo é um elemento de extrema importância na operação

  de uma aeronave, o DOV deve assimilar conhecimento substancial do que é, como

  funciona e como esse serviço se relaciona com as suas responsabilidades. Este

  componente curricular foi projetado para fornecer aos alunos um conhecimento profundo

  da organização e funcionamento do gerenciamento do tráfego aéreo no Brasil e deData de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  algumas das instalações necessárias para a operação segura e eficiente de serviços de

  transporte aéreo comercial.

  O2. Pré-requisitos

  O conteúdo programático deste componente curricular será melhor compreendido pelos

  alunos se for ministrado após concluídos os programas de Legislação e Regulamentação.

  O3. Objetivos instrucionais

  Condição De posse de informações pertinentes e das publicações aeronáuticas e dos

  materiais de referência sobre serviços de tráfego aéreo, incluindo, quando

  possível, visitas a diferentes tipos de unidades de serviço de tráfego aéreo,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar os princípios básicos de

  gerenciamento do tráfego aéreo e aplicar tais princípios no planejamento e

  monitoramento de operações de voo.

  Padrão de

  desempenho

  Os princípios de gerenciamento do tráfego aéreo devem ser completamente

  entendidos e o aluno deve ser capaz de aplicar o conhecimento no

  planejamento e monitoramento de operações de voo.

  O4. Orientações didáticas

  Os documentos fundamentais a serem estudados em sala de aula são as publicações

  oficiais do DECEA devendo o instrutor ficar atento a suas constantes atualizações:'
