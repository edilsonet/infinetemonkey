text: '(j) NSCA 351-1: Sistema de Controle do Espaço Aéreo Brasileiro.Data de emissão: 22
  de dezembro de 2017. IS nº 141-003

  Revisão A

  Com o estudo desses documentos, ou quaisquer outros que venham a substituí-los, os

  alunos serão capazes de identificar os diferentes tipos de serviços de tráfego aéreo

  prestados e descrever a relação entre o despacho de voo e do fluxo de tráfego aéreo na

  área de sua responsabilidade.

  Para alcançar satisfatoriamente o objetivo do curso de formação de DOV, recomenda-se

  uma visita a uma unidade de gerenciamento do tráfego aéreo bem equipada e uma unidade

  de serviços de informação aeronáutica, a fim de permitir que os alunos observem a

  prestação dos serviços em tempo real. Essa visita pode ser realizada durante a parte

  prática do curso.

  O5. Ementa

  O conteúdo programático deste componente curricular está subdividido em doze

  Unidades Didáticas , conforme abaixo:'
