text: '(l) Unidade 12 - Fraseologia de tráfego aéreo

  O6. Plano das unidades e subunidades didáticasData de emissão: 22 de dezembro de 2017. IS
  nº 141-003

  Revisão A

  Componente Curricular: REGULAMENTOS DE TRÁFEGO AÉREO

  Módulo 1 Carga Horária: 48 h-a

  Unidades Didáticas

  1 Sistema de Controle do Espaço Aéreo Brasileiro - SISCEAB

  Objetivos específicos Subunidades

  1.1

  • Identificar a Norma de Sistema do Comando da Aeronáutica - NSCA 351-1

  como documento normativo do SISCEAB.

  • Justificar a finalidade do SISCEAB.

  • Citar os objetivos do SISCEAB.

  1.2/ 1.3

  • Identificar os componentes da estrutura do SISCEAB e suas respectivas

  atribuições e responsabilidades.

  1.1 Documento normativo: Norma de

  Sistema do Comando da Aeronáutica -

  NSCA 351-1'
