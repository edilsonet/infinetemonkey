text: 'APÊNDICE P - MÓDULO 2 -- FATORES HUMANOS NA AVIAÇÃO CIVIL

  P1. Introdução

  O objetivo deste componente curricular é apresentar aos alunos do curso de DOV os

  conceitos fundamentais de Fatores Humanos na aviação e fornecer diretrizes para a

  introdução dos conceitos básicos de Gerenciamento de Recursos de Equipes (Corporate

  Resource Management - CRM) na sua formação.

  A Organização da Aviação Civil Internacional (ICAO, 1998, p. D3-94) propõe para o

  DOV a formação em Gerenciamento de Recursos de Despacho (Dispatch resource

  management - DRM) como uma aplicação prática de Fatores Humanos derivada do

  modelo de gerenciamento de recursos de equipes (CRM).

  A abordagem do DRM apresenta algumas características essenciais:'
