text: '(c) o programa deve também ensinar ao DOV que seu comportamento duranteData de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  circunstâncias normais de rotina pode ter um forte impacto sobre a segurança na

  condução das operações aéreas, cuja responsabilidade é com ele compartilhada.

  Pretende-se, assim, preparar o futuro profissional DOV a lidar de maneira mais

  competente com situações reais de estresse características de seu ambiente de trabalho.

  P2. Pré-requisitos - N/A

  P3. Objetivos instrucionais

  Condição Utilizando orientações já desenvolvidas para os membros da tripulação de

  voo (CRM) e outros grupos no que diz respeito à formação em

  gerenciamento de recursos e técnica de role-playing simulando condições

  que exigem a aplicação de conceitos de DRM,

  Desempenho

  esperado

  o aluno deverá ser capaz de aplicar os conceitos aprendidos no treinamento

  DRM no exercício das suas funções e responsabilidades, de desenvolver a

  consciência do bom desempenho, a aceitar a necessidade de inter-relações

  de apoio e de cooperação entre DOV, tripulantes, e pessoal do ambiente

  operacional para lidar com situações normais e de emergência.

  Padrão de

  desempenho

  Os conceitos básicos de Fatores Humanos devem ser bem compreendidos

  e o aluno deve ser capaz de, durante o treinamento, apresentar desempenho

  compatível com os modelos fornecidos como referências.

  P4. Orientações didáticas

  Os alunos precisam de tempo, consciência, prática, feedback e reforço contínuo para

  aprenderem lições que perdurarão por muito tempo. O ensino de Fatores Humanos e, em

  especial, o treinamento em DRM, abordam o desafio de otimizar a interface pessoa /

  máquina e as questões interpessoais relacionadas. Essas questões incluem a construção

  efetiva e manutenção de equipes, a transferência de informações, a resolução de

  problemas e a tomada de decisão, desenvolvendo a consciência situacional e capacidade

  de lidar com sistemas automatizados. Assim, para ser eficaz, a formação em DRM deve

  ser realizada em várias fases e ao longo de vários anos, ou seja, não se esgota neste curso.

  Cabe ao instrutor sensibilizar seus alunos para que procurem desenvolver essas

  habilidades. É importante reconhecer que a consciência é apenas um primeiro passo. As

  experiências em sala de aula provavelmente não vão alterar significativamente atitudes e

  comportamentos do aluno a longo prazo, mas devem proporcionar o desenvolvimento de

  uma tomada de consciência sobre a importância do papel que o DOV desempenha no

  âmbito das operações aéreas.

  No contexto da formação do DOV, a formação de uma cultura organizacional deve ser

  incentivada. No entanto, as diferenças culturais individuais devem ser respeitadas e

  analisadas de forma a não criar mal-entendidos entre pessoas de diferentes origens

  culturais que possam resultar em falhas de comunicação e coordenação. Ao abordar esta

  questão, o instrutor deve dar ênfase ao desenvolvimento de uma cultura organizacional

  que incentive o trabalho em equipe e o compartilhamento de responsabilidades entre

  DOV, membros da tripulação de voo e demais pessoas envolvidas na operação aérea.Data de
  emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Técnicas de trabalho de grupo como o role-playing são indicadas para desenvolver

  habilidades de relacionamento interpessoal e de liderança, necessárias ao desempenho

  das funções do DOV.

  O feedback através de filmagem em vídeo é particularmente eficaz porque a perspectiva

  de terceira pessoa cria um nível de consciência difícil de ser atingido com outras técnicas.

  Esta perspectiva fornece aos alunos insights e desenvolve a auto-crítica, que costuma ser

  um forte estímulo para mudanças de atitude e comportamento. Fica mais fácil identificar

  o que precisa ser corrigido nas habilidades de gestão ou interpessoais se a pessoa puder

  vê-lo por si mesma. Além disso, estes exercícios de feedback em vídeo oferecem

  oportunidades para as críticas entre pares. Se o feedback por vídeo não for possível, cada

  exercício de trabalho em grupos deve ser seguido por um debriefing guiado com cuidado

  pelo instrutor. Os participantes deverão ser capazes de identificar os objetivos de cada

  exercício e encorajados a fornecer feedback construtivo sobre seu desempenho,

  identificar os pontos fortes e fracos, propor alternativas e relacionar os exercícios à

  experiência prática.

  P5. Ementa

