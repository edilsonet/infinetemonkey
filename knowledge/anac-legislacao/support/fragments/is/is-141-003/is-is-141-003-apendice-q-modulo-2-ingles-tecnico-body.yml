title: APÊNDICE Q - MÓDULO 2 -- INGLÊS TÉCNICO
text: 'APÊNDICE Q - MÓDULO 2 -- INGLÊS TÉCNICO

  Q1. Introdução

  Na continuação da formação do DOV e objetivando a aquisição de conhecimentos em

  inglês necessários ao melhor desempenho de suas atividades, o componente curricular

  INGLÊS TÉCNICO tem por finalidade complementar o componente INGLÊS BÁSICO,

  e aprofundar os estudos em língua inglesa, priorizando o vocabulário técnico e as

  interações mais características das atividades rotineiras de um DOV.

  Q2. Pré-requisitos - N/A

  Q3. Objetivos instrucionais

  Condição Com base nos materiais de referência utilizados para o estudo de inglês

  aeronáutico,

  Desempenho

  esperado

  o aluno deverá:

  • reconhecer e utilizar fraseologia básica no padrão OACI (Organização de

  Aviação Civil Internacional);

  • ler e reconhecer as principais informações veiculadas em textos gerais sobre

  a aviação civil e em textos básicos sobre aeronaves;

  • reconhecer e utilizar vocabulário relativo às atividades desempenhadas no

  aeroporto; às atividades relacionadas ao transporte aéreo de cargas; aos

  requisitos para o voo e para aeronavegabilidade; aos sistemas de uma

  aeronave; à cabine e ao cockpit; e ao ambiente operacional;Data de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  • identificar e utilizar apropriadamente as siglas mais comuns do trabalho

  cotidiano do DOV e do ambiente da aviação;

  • ler e interpretar esquemas, gráficos, tabelas ilustrações, diagramas, etc.;

  • ler, identificar e interpretar os itens da MEL e estabelecer a diferença entre

  MMEL e MEL;

  • decodificar mensagens de áudio veiculadas em aeródromos, mensagens de

  áudio veiculadas pelos órgãos de controle de tráfego aéreo, informativos

  meteorológicos, mensagens narradas por controladores de voo e pilotos e

  diálogos relativos a situações de emergência;

  • narrar breves situações no passado, presente e futuro; reportar informações

  sobre peso e balanceamento da aeronave; esclarecer mal-entendidos e

  dúvidas dos seus pares e do piloto em comando sobre peso e balanceamento

  da aeronave;

  • produzir diálogos simulando a comunicação no solo e em voo;

  • esclarecer mal-entendidos em situações complexas; e

  • expressar-se oralmente para auxiliar em situações de emergência.

  Padrão de

  desempenho

  O vocabulário básico e os termos técnicos da aviação civil, em especial

  vocabulário característico das atividades diárias do DOV deverão ser

  compreendidos e empregados pelo aluno, em situações de produção oral e

  escrita.

  Q4. Orientações didáticas

  Para alcançar os objetivos propostos, são pertinentes técnicas de instrução centradas no

  contexto. Considera-se apropriada a abordagem comunicativa no ensino de idiomas, por

  focar em atividades que requerem o uso efetivo da língua, adequadas para o ensino do

  conteúdo deste componente curricular. O estímulo à produção centrada nos alunos é

  sempre preferível à pura exposição oral do instrutor.

  São bem-vindas as contribuições dos alunos em sala de aula no que se refere à

  apresentação de materiais técnicos rotineiramente utilizados na atividade de DOV,

  atualizações de documentação e manuais, textos lúdicos, sugestões de leitura, listas de

  equipamentos, etc. Ou seja, estimula-se a participação ativa do aluno em sala de aula,

  como agente construtor de seu conhecimento.

  Ao final deste Apêndice estão listadas as principais siglas e abreviaturas utilizadas pelo

  DOV. Ressalta-se que as listas de termos apresentadas nas subunidades didáticas não são

  exaustivas.

  Q5. Ementa

