text: '(d) Unidade 4 -- Produção oral

  Q6. Plano das Unidades e Subunidades didáticas

  Componente Curricular: INGLÊS TÉCNICO

  Módulo 2 Carga Horária: 39 h-a

  Unidades Didáticas

  1 Vocabulário

  Objetivos específicos Subunidades

  1.1

  • Interpretar fraseologia nos padrões OACI.

  • Praticar fraseologia nos padrões OACI.

  1.2

  • Identificar vocabulário relativo a atividades

  desempenhadas no aeroporto.

  • Praticar vocabulário relativo a atividades

  desempenhadas no aeroporto.

  1.3

  • Identificar vocabulário relativo a atividades

  relacionadas ao transporte de carga.

  • Praticar vocabulário relativo a atividades

  relacionadas ao transporte de carga.

  1.4

  • Reconhecer vocabulário relativo a requisitos para o

  voo e aeronavegabilidade.

  • Praticar vocabulário relativo a requisitos para o voo

  e aeronavegabilidade.

  1.5

  • Reconhecer vocabulário relativo a sistemas de uma

  aeronave.

  • Praticar vocabulário relativo a sistemas de uma

  aeronave.

  1.6

  • Reconhecer vocabulário relativo a uma cabine de

  aeronave.

  • Praticar vocabulário relativo a uma cabine de

  aeronave.

  1.7

  • Reconhecer vocabulário relativo ao cockpit de uma

  aeronave.

  1.1 Fraseologia (Phraseology)'
