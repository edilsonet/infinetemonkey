text: 'APÊNDICE R - MÓDULO 2 -- NAVEGAÇÃO II: POR INSTRUMENTOS E

  RADIONAVEGAÇÃO

  R1. Introdução

  Dando continuidade ao programa de Navegação Aérea, o Módulo II do curso teórico de

  DOV apresenta a Radionavegação, ou seja, o processo de navegação que se baseia em

  sinais recebidos de transmissores de ondas de rádio e os demais sistemas de navegação

  por instrumentos em uso na aviação. Também são apresentados aos alunos os demais

  sistemas ou métodos de navegação por instrumentos em uso ou em implantação no Brasil,

  como a Navegação de Área (RNAV), o Sistema Global de Navegação por Satélite

  (GNSS) e a Navegação Aérea Baseada em Desempenho (PBN).

  R2. Pré-requisitos

  O conteúdo programático deste componente curricular será melhor compreendido pelos

  alunos se for desenvolvido após concluído o Módulo 1, em especial o componente

  curricular Navegação I: Visual e estimada.

  R3. Objetivos instrucionaisData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Condição Usando materiais instrucionais adequados, livros didáticos, documentação da

  OACI, cartas aeronáuticas publicadas pelo DECEA e outras fontes, incluindo

  representação realista da Terra e instrumentos de navegação, se necessário,

  Desempenho

  esperado

  o aluno deverá ser capaz de:

  • identificar os componentes e os princípios de operação da radionavegação;

  • identificar os procedimentos de radionavegação e de voo por instrumentos

  utilizados nos voos comerciais;

  • interpretar e traçar rotas de navegação nas cartas aeronáuticas utilizadas em

  voos por instrumentos.

  Padrão de

  desempenho

  Conceitos (posição, distância, tempo, etc.), propriedades, tais como as das

  diferentes cartas de navegação, normas e práticas recomendadas da OACI

  (SARP) relativas à navegação aérea, a interpretação de gráficos etc., tais como

  definidos nos objetivos específicos devem ser bem entendidos, e o aluno deve

  demonstrar a capacidade tanto para converter, medir e determinar (tempo,

  distância, títulos, altitude, velocidade, etc.), como é exigido pelos assuntos

  específicos como usar gráficos, calculadoras, computadores de navegação,

  quando apropriado e necessário ao exercício das funções do DOV.

  R4. Orientações didáticas

  Para reforçar a aplicação prática dos conceitos desenvolvidos em sala de aula, o instrutor

  deve programar visitas orientadas a salas de operações de voo, torres de controle de

  aeródromo, centros de controle de tráfego aéreo, centros de informação aeronáutica,

  dentre outros. Também poderão ser reproduzidas situações operacionais simuladas de

  Navegação Aérea com o objetivo de integrar os diferentes conceitos com o manuseio do

  Manual de Operações de aeronaves e da documentação operacional consultada em

  situações reais.

  Para o ensino de Navegação Aérea, o instrutor pode se valer do treinador sintético de voo,

  levando os alunos a observarem os diferentes aspectos do voo, como o tempo despendido

  nas manobras, o uso de auxílios específicos à navegação, os procedimentos de aeródromo

  etc.

  A familiarização com as rotas é considerada parte fundamental da instrução, por permitir

  uma apreciação realista das características das rotas em determinadas áreas de operação,

  como por exemplo, as diferenças nos procedimentos e serviços disponíveis nas diversas

  etapas das rotas e nos diferentes aeródromos, os efeitos das condições meteorológicas

  predominantes, aspectos topográficos e dificuldades causadas por condições ambientais.

  R5. EmentaData de emissão: 22 de dezembro de 2017. IS nº 141-003

