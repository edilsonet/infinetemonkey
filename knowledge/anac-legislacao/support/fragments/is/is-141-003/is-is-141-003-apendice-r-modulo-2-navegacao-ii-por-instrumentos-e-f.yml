text: '(f) Unidade 6 - Cartas aeronáuticas e procedimentos de navegação por instrumentos

  R6. Plano das unidades e subunidades didáticas

  Componente Curricular:

  NAVEGAÇÃO 2: POR INSTRUMENTOS E RADIONAVEGAÇÃO

  MÓDULO 2 Carga Horária: 42 h-a

  Unidades Didáticas

  1 Noções de Radionavegação

  Objetivos Específicos Subunidades

  1.1

  • Definir ondas eletromagnéticas.

  • Definir comprimento de onda, frequência de onda, ciclo

  de onda e trajetória de onda.

  • Definir variação de ondas e perda de ondas.

  • Definir antenas transmissoras e antenas receptoras.

  • Definir bloqueio de estação e cone de silêncio.

  1.2

  • Identificar os princípios e as propriedades fundamentais

  de transmissão de rádio e sua aplicação na

  radionavegação.

  1.3

  1.2 Ondas eletromagnéticas'
