text: 'APÊNDICE S - MÓDULO 2 -- PESO E BALANCEAMENTO

  S1. Introdução

  O controle de peso e balanceamento afeta a operação e a e segurança da aeronave, assim

  como contribui para a otimização da carga útil e a economia de combustível de aviação.

  Uma aeronave com excesso de carga ou mesmo mal carregada é extremamente perigosa.

  Acidentes e incidentes podem ser atribuídos a uma sobrecarga, a carregamento

  descuidado ou por instruções de carregamento pouco claras.

  É difícil, se não impossível, controlar uma aeronave com o seu centro de gravidade (CG)

  localizado fora dos seus limites. A localização do CG pode ser mudada dramaticamente

  pelo movimento de uma carga não segura o suficiente. Gerenciamento incorreto de

  combustível também pode afetar negativamente o CG. Embora o gerenciamento do

  combustível não seja uma responsabilidade primordial do DOV, a compreensão dos

  efeitos da má distribuição de combustível é necessária, sobretudo no que se refere ao uso

  correto de cálculos e gráficos de combustível quando completar a documentação de peso

  e balanceamento (exemplos: loadsheets, trimsheets, balance manifest, loadplan). O

  carregamento da aeronave deve ser planejado e realizado de forma a assegurar que o CG

  permaneça dentro dos limites da aeronave, em todas as fases do voo.

  Peso, balanceamento e planejamento de carga não correspondem apenas à distribuição

  correta do peso e da carga, a fim de alcançar a localização ideal do CG. Devem serData de
  emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  igualmente considerados os limites estruturais tais como resistência do piso e suas

  variáveis. Outro fator a ser considerado é a compatibilidade ou não entre substâncias e

  cargas perigosas. Como exemplos, não se pode posicionar animais vivos perto de

  alimentos, filmes sensíveis perto de material radioativo, ou aparelhos eletrônicos

  próximos de material magnético. Danos potenciais ou interferência nos equipamentos das

  aeronaves por substâncias ou materiais devem ser considerados, como por exemplo:

  material magnético pode interferir com bússolas das aeronaves se colocado na área errada

  ou se a sua força exceder os limites. Material radioativo deve ser corretamente localizado

  e não deve exceder os limites, quer por valores reais, quer por efeitos cumulativos.

  Incorretamente manuseado ou carregado, ele pode constituir um perigo para os

  passageiros, tripulantes e pessoal de terra. O planejamento de carga também deve

  considerar a sequência de carregamento e descarregamento. Uma aeronave com muitas

  etapas a serem voadas deve ser carregada de forma a minimizar o tempo de carregamento

  e descarregamento nas paradas intermediárias.

  Em resumo, tem-se como objetivos do planejamento de peso e de balanceamento das

  aeronaves:'
