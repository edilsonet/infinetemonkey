text: '(f) planejar de modo eficiente a distribuição de carga, bagagens e malotes de correio.

  S2. Pré-requisitos

  O conteúdo programático deste componente curricular deve ser desenvolvido após

  concluído o Módulo 1 do curso teórico de DOV.

  S3. Objetivos instrucionais

  Condição Com base nos materiais de referência, na documentação necessária, loadsheets

  em branco, bem como dados de carregamento de mais de uma aeronave,Data de emissão: 22 de
  dezembro de 2017. IS nº 141-003

  Revisão A

  Desempenho

  esperado

  O aluno deverá demonstrar conhecimento adequado do planejamento de carga,

  cálculo da carga útil, incluindo:

  - as razões do controle de peso e balanceamento e os métodos para a sua

  realização.

  - o uso ideal de espaço de carga disponível, a preparação da loadsheet,

  balanceamento da aeronave e estabilidade longitudinal;

  - o cálculo do centro de gravidade, os aspectos estruturais de aviões de carga;

  e

  - a emissão de instruções de carregamento dentro das restrições e limitações

  estabelecidas, incluindo as impostas por aspectos relativos a artigos

  perigosos.

  Padrão de

  desempenho

  O aluno deverá:

  - descrever os procedimentos de planejamento de carga e explicar como o

  espaço de carga é determinado com antecedência e como os problemas são

  resolvidos durante a preparação de um voo real;

  - calcular com precisão a carga máxima permitida e demonstrar proficiência

  no preenchimento de formulários de carregamento.

  - apontar as limitações estruturais que devem ser observadas durante o

  carregamento de uma aeronave e explicar a necessidade evitar os efeitos da

  movimentação da aeronave sobre a carga;

  - preparar as instruções de carregamento de forma clara, concisa e correta para

  o pessoal da área de cargas.

  S4. Orientações didáticas

  O aluno deve ser proficiente em todos os aspectos dos sistemas de cálculos aritméticos,

  incluindo o uso da calculadora, antes de ser introduzido ou permitido o uso de um sistema

  computadorizado para cálculos de peso e balanceamento. Conhecimentos de informática

  devem ser desenvolvidos, mas somente depois que o aluno tenha alcançado conhecimento

  e compreensão aprofundados dos princípios básicos de peso e balanceamento.

  Os princípios de braços e momentos devem ser claramente entendidos antes que o aluno

  pratique o preenchimento de loadsheets. É recomendado que um exercício de

  carregamento seja completado, inicialmente usando o conceito de momento e os dados

  de carregamento e finalmente pela utilização da folha de carregamento adequada, como

  utilizada por um transportador típico. Isso servirá para demonstrar claramente a lógica

  matemática existente entre massa (peso) e equilíbrio (balanceamento).

  É necessário demonstrar que os princípios e a lógica da localização do CG se aplicam

  igualmente a todas as aeronaves, seja um grande jato comercial, seja um monomotor

  usado para treinamento de pilotos.

  Devem ser realizadas discussões dirigidas pelo instrutor em sala de aula a respeito das

  possíveis soluções para vários problemas de carregamento, através das quais a classe deve

  ser orientada para a solução ideal, com explicações sobre as considerações práticas de

  carregamento, bem como economia de combustível. Deve ser reservado tempo suficiente

  para que o instrutor dirija a discussão e analise os exercícios individuais dos alunos,
  a fimData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  de obter um consenso sobre o melhor planejamento.

  Para ilustrar as possibilidades de carregamento de uma aeronave, o instrutor pode usar

  um diagrama que divida a fuselagem em compartimentos superior e inferior, anterior e

  posterior. Nesse diagrama, pode ser demonstrada a carga máxima admissível em cada

  compartimento, através de exemplos de cargas reais. Havendo a possibilidade, instruções

  de carregamento utilizadas por operadores poderão ser utilizadas.

  4.4 Exercícios em sala de aula podem ser utilizados para:'
