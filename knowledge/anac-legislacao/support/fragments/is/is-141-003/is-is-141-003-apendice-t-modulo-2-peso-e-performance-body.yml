text: 'APÊNDICE T - MÓDULO 2 - PESO E PERFORMANCE

  T1. Introdução

  A evolução da tecnologia na aviação tem permitido aos fabricantes a concepção e a

  produção de aeronaves cujo desempenho é projetado para atender as exigências do

  mercado. Ao longo dos anos, o desempenho de aeronaves tem sido aperfeiçoado a tal

  ponto que literalmente se tornou o núcleo para o crescimento da indústria de transporte

  aéreo. Quando o desempenho da aeronave é melhorado ou quando aviões são projetados

  para satisfazerem a um determinado mercado, o custo da operação é reduzido, o que se

  traduz em tarifas mais baixas, criando a possibilidade de transportar mais passageiros.

  Evidentemente, a operação de aeronaves comerciais modernas exige que um elevado

  nível de desempenho seja alcançado sem prejudicar a segurança operacional.

  O valor comercial de uma aeronave com melhor desempenho depende principalmente da

  eficiência com a qual ela é operada. Uma das principais responsabilidades do operador e

  do DOV é garantir que as aeronaves sejam operadas dentro das limitações de seu peso e

  de sua performance.

  No contexto operacional, cabe ressaltar as responsabilidades do DOV, no que se refere à

  performance da aeronave:'
