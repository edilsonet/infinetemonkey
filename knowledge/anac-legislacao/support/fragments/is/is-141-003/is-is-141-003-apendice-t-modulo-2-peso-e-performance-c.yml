title: apendice-t-modulo-2-peso-e-performance(c)
text: '(c) Garantir que são considerados todos os fatores importantes, desde a decolagem à

  aterrissagem.

  Por meio deste componente curricular, o aluno será apresentado à performance da

  aeronave, destacando alguns dos fatores que devem ser considerados pelo DOV durante

  o planejamento de voo. O aluno também deverá se capaz de determinar o peso máximo

  permitido para decolagem e pouso de uma aeronave, sob condições operacionais

  variáveis, utilizando dados do manual de voo.

  T2. Pré-requisitos

  Para compreender plenamente os assuntos tratados no componente curricular Peso e

  Performance, o aluno deverá ter vivenciado por completo os conteúdos do Módulo 1.

  T3. Objetivos instrucionais

  Condições Dispondo de dados de performance da aeronave e material de referência

  adequado e pertinente,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar:

  - os princípios básicos de segurança relativos a limitações de peso e de

  desempenho das aeronaves;

  - as razões para o estabelecimento de limitações de uma aeronave relativas a

  peso e velocidade;

  - os fatores considerados necessários para o estabelecimento de requisitos de

  comprimento da pista de decolagem e para calcular com precisão os requisitos,

  dentro de um prazo razoável;

  - os requisitos de desempenho ao longo do voo que devem ser considerados

  pelo DOV durante o planejamento do voo para o cálculo do desempenho de

  subida;

  - os fatores necessários para o estabelecimento de requisitos e de cálculo do

  comprimento da pista de pouso; e

  - as características de vibração (buffet) de aeronaves que devem ser

  consideradas durante o planejamento de voo.

  Padrão de

  desempenho

  - Os princípios básicos para a segurança de voo devem ser bem compreendidos

  e o aluno deve ser capaz de determinar os pesos máximos de decolagem e de

  pouso, em condições operacionais variáveis, utilizando dados do manual da

  aeronave;

  - As principais razões para o peso básico e limitações de velocidade de uma

  aeronave devem ser completamente entendidas e o aluno deverá ser capaz de

  determinar limitações de peso e velocidade de uma aeronave em condições

  operacionais variáveis utilizando dados do manual de voo;

  - Todos os fatores envolvidos no estabelecimento do comprimento da pista de

  decolagem devem ser bem entendidos e o aluno deve ser capaz de determinar

  o comprimento requerido para a pista de decolagem usando dados do manual

  de voo e de operações de aeronaves;Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  - Todos os fatores envolvidos no estabelecimento de limitações de desempenho

  de subida de aeronaves devem ser bem entendidos e o aluno deve ser capaz de

  aplicar dados do desempenho de subida obtidos no planejamento do voo;

  - Todos os fatores envolvidos no estabelecimento do comprimento da pista de

  pouso devem ser bem entendidos e o aluno deve ser capaz de determinar o

  comprimento necessário da pista de pouso usando dados do manual de voo e

  de operações de aeronaves; e

  - Efeitos de buffet de baixa e alta velocidade para uma ampla gama de dados

  referentes a peso, altitudes e acelerações normais devem ser bem entendidos e

  o aluno deve ser capaz de determinar as velocidades em que o buffet ocorre.

  T4. Orientações didáticas

  Por envolver uma infinidade de cálculos e procedimentos, este componente curricular

  deve ser desenvolvido gradualmente, da forma mais concreta possível. O instrutor deve

  enfatizar os exercícios práticos, nos quais podem ser utilizados gráficos, tabelas e

  formulários existentes nos manuais de operação dos fabricantes de aeronaves.

  T5. Ementa

  O componente curricular Peso e Performance está dividido em oito Unidades Didáticas,

  conforme abaixo:'
