text: 'APÊNDICE V - MÓDULO 2 -- REGULAMENTAÇÃO DO TRANSPORTE AÉREO

  V1. Introdução

  O objetivo maior da regulamentação do transporte aéreo é unificar os procedimentos,

  visando a propiciar um melhor funcionamento do sistema, no que se refere a padrões de

  economia, eficiência e segurança.

  O conteúdo programático deste componente curricular se baseia no conhecimento e na

  aplicação da legislação específica que regulamenta o transporte aéreo. Os assuntos

  abordados são basicamente os que fazem parte do Anexo 6 da OACI e que se traduzem

  nos seguintes Regulamentos Brasileiros, ou documentos que venham a substituí-los:'
