text: '(f) Unidade 6 -- Operações de empresas estrangeiras - RBAC 129

  V6. Plano das unidades e subunidades didáticas

  Componente Curricular: REGULAMENTAÇÃO DO TRANSPORTE AÉREO

  Módulo 2 Carga Horária: 36 h-a

  Unidades Didáticas

  1 Regulamentação da operação de aeronaves civis

  Objetivos Específicos Subunidades

  1.1

  • Identificar a aplicabilidade do Anexo 6 da OACI.

  • Listar as definições contidas no Capítulo 1 do Anexo 6.

  1.2

  • Identificar a aplicabilidade dos seguintes Regulamentos

  Brasileiros de Aviação Civil: RBHA/RBAC 91, RBAC 119,

  RBAC 121, RBAC 135 e RBAC 129

  • Explicar as definições contidas nos RBAC estudados.

  1.1 Anexo 6 da OACI'
