text: 'APÊNDICE W - MÓDULO 2 -- PLANEJAMENTO DE VOO

  W1. Introdução

  O objetivo de um bom planejamento de voo é produzir um plano de voo que preveja

  economia de tempo aliado a consumo mínimo combustível, sobre a melhor rota possível,

  evitando más condições meteorológicas e seguindo todos os requisitos e procedimentos

  de segurança das regras do ar e do gerenciamento do tráfego aéreo. A atuação do DOV

  nas questões relativas à segurança operacional e ao carregamento de artigos perigosos nas

  aeronaves, fortalece o seu papel como elemento chave no intercâmbio de informações

  dentro da empresa aérea. Ressalta-se que o controle operacional não pode ser realizado

  sem acesso a detalhes do plano de voo.

  W2. Pré-requisitos

  A fim de executar o planejamento de voo, o DOV deve usar todos os conhecimentos e

  habilidades adquiridos a partir de outros componentes curriculares deste curso, incluindo

  navegação aérea, performance da aeronave, meteorologia, regras do ar, peso e

  balanceamento e serviços ligados ao gerenciamento do tráfego aéreo.

  W3. Objetivo instrucional

  Condição Dispondo de dados atualizados e acesso às seções apropriadas do Manual de

  Operações,Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Desempenho

  esperado

  O aluno deve ser capaz de completar um plano de voo operacional, em

  conformidade com as regras e normas estabelecidas pelos órgãos

  reguladores.

  Padrão de

  desempenho

  Todos os requisitos para planejamento de voo devem ser facilmente

  identificados pelo aluno. Ele deve apontar os procedimentos mais

  imperativos, as informações mais importantes, bem como apresentar um

  plano de voo e procedimentos para monitorar o progresso do voo, de acordo

  com o plano de voo elaborado.

  W4. Orientações didáticas

  O instrutor deve disponibilizar aos alunos cópias de tabelas de subida, cruzeiro e descida,

  cartas aeronáuticas, mapas de rotas, gráficos de aproximação e de saída; bem como acesso

  aos dados de desempenho aplicáveis, dados de peso e balanceamento e quaisquer outras

  informações consideradas necessárias para a elaboração de um plano de voo. Os alunos

  devem estar equipados com uma calculadora científica, computador de navegação e

  material para efetuar suas anotações.

  Exercícios práticos de planejamento de voo devem ser proporcionados pelo instrutor, com

  o propósito de simular situações operacionais típicas em que seja exigida ao aluno a

  proficiência na tomada de decisões operacionais e que o levem a aplicar e integrar os

  conhecimentos e habilidades na preparação detalhada de planos de voo, usando

  informações normalmente à disposição do DOV.

  Os Manuais pertinentes a este componente curricular, e que deverão ser consultados

  durante as atividades, são os Manuais regularmente utilizados por Despachantes

  Operacionais de Voo:'
