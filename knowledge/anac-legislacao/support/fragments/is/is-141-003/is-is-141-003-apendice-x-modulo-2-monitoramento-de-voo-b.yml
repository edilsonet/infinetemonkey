text: '(b) Unidade 2 -- Recursos de monitoramento de voo

  X6. Plano das unidades e subunidades didáticas

  Componente Curricular: MONITORAMENTO DE VOO

  Módulo 2 Carga Horária: 12 h-a

  Unidades Didáticas

  1 Princípios de monitoramento de voo

  Objetivos Específicos SubunidadesData de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1.1

  • Calcular, para um dado voo, a quantidade de combustível

  utilizado e restante tendo como referência pontos de controle de

  navegação e indicações do medidor de combustível da aeronave.

  • Calcular a taxa de consumo real a partir dos dados: combustível

  utilizado, tempo de voo.

  • Comparar consumo de combustível planejado e o real por meio

  de cálculo ou de gráfico de progressão de voo.

  • Comparar a quantidade de combustível restante com o

  necessário para a conclusão do voo.

  • Analisar TAF e METAR e determinar as condições atmosféricas

  dos aeródromos de destino e alternativos, considerando os

  seguintes elementos: vento, visibilidade, alcance visual da pista.

  • Calcular o tempo estimado para o próximo fixo, com base em

  dados como velocidade de solo, ventos, velocidade verdadeira e

  curso da aeronave.

  1.2

  • Explicar os efeitos dos desvios de rota para a operação das

  aeronaves.

  1.3

  • Analisar as falhas dos equipamentos das aeronaves em voo e

  sugerir atitudes que minimizem seus efeitos.

  • Avaliar as condições dos aeródromos alternativos, a fim de optar

  por aquele que ofereça manutenção e serviços dos quais a

  aeronave, tripulação e passageiros possam necessitar no caso de

  falhas de equipamentos em vooo.

  1.4

  • Analisar cartas meteorológicas, localizar e nomear os diferentes

  sistemas do tempo na rota, como frentes quentes e frias, frentes

  oclusas, depressões, áreas de alta pressão, dentre outras.

  • Analisar o vento e a temperatura relevantes para o nível de voo

  ao longo da rota.

  • Analisar as condições meteorológicas existentes no destino e

  possíveis alternados.

  1.5

  • Identificar as atitudes a serem adotadas pelo DOV em situações

  anormais e de emergência envolvendo aeronave em voo.

  1.1 Posição da aeronave'
