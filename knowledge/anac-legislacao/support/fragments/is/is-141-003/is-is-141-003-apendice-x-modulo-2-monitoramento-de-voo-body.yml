title: APÊNDICE X - MÓDULO 2 -- MONITORAMENTO DE VOO
text: 'APÊNDICE X - MÓDULO 2 -- MONITORAMENTO DE VOO

  X1. Introdução

  Embora o despachante operacional de voo (DOV) dispense a maior parte de seu tempo e

  energia fazendo com que seu planejamento de voo proporcione segurança e viabilidade

  econômica aos voos comerciais, uma tarefa igualmente importante é o monitoramento de

  voo. O DOV deve reunir os conhecimentos e os recursos disponíveis para fornecer ao

  piloto em comando as informações necessárias para a condução segura do voo. Embora

  os serviços de tráfego aéreo sejam responsáveis pela separação de tráfego, muitas vezes

  não têm as informações ou os meios para avaliar mudanças nas condições operacionais.

  Essas condições são afetadas pelas mudanças de rota e tempo de voo, ventos de altitude,

  turbulência repentina, mudança na capacidade e disponibilidade dos aeródromos, o

  rendimento do combustível com base em performance, peso e balanceamento e muitas

  outras considerações operacionais. O DOV, portanto, deve agregar as informações e os

  recursos disponíveis para efetivamente avaliar alterações nas condições dos voos por ele

  despachados.

  O Anexo 6 da OACI, Parte I - Operação de Aeronaves, Transporte Aéreo Comercial

  Internacional - Aviões, item 4.6.1 exige que o DOV forneça ao piloto em comando

  durante o voo informações que podem ser necessárias para a condução segura do voo.

  Vários Estados vão além e exigem que o DOV e o piloto em comando, no interesse de

  manter o mais elevado nível de segurança, compartilhem a responsabilidade para a

  condução segura de cada voo, exceto em situações de emergência, quando o piloto em

  comando será sempre o responsável pela tomada de decisão. No caso de uma emergência,Data
  de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  o Anexo 6, Parte I, 4.6.1 exige que o DOV inicie os procedimentos descritos no manual

  de operações do transportador aéreo. Ao longo dos anos, esta responsabilidade solidária,

  quando aplicada, tem servido aos interesses do mais alto nível de segurança.

  O DOV deve ser pró-ativo. É sua responsabilidade atentar para os problemas, sondando

  para obter informações, soluções e opções para apresentar ao piloto em comando durante

  as operações normais e anormais. Ele deve saber a localização de cada voo e quanto

  combustível resta, estar familiarizado com as condições em rota e terminais e preparado

  para intervir quando se torna evidente que o voo não será capaz de continuar a operar sob

  as condições de seu despacho original. Para que o DOV atue em conformidade com os

  requisitos do Anexo 6, cabe ao piloto em comando consultá-lo a qualquer tempo,

  especialmente quando é necessária uma mudança substancial no encaminhamento do

  voo. O DOV deve avaliar todos os fatores envolvidos, a fim de confirmar que o voo possa

  prosseguir na nova rota com segurança. Caso o voo não possa prosseguir com segurança,

  o DOV deve comunicar o fato ao piloto em comando, a quem caberá concordar com o

  novo planejamento ou adotar outras ações.

  X2. Pré-requisitos

  A fim de executar o monitoramento do voo, o DOV deve usar todos os conhecimentos e

  habilidades adquiridos a partir de outros componentes curriculares deste curso, incluindo

  navegação aérea, performance da aeronave, meteorologia, regras do ar, peso e

  balanceamento, serviços ligados ao gerenciamento do tráfego aéreo e planejamento de

  voo.

  X3. Objetivos instrucionais

  Condição Dispondo dos recursos necessários para proporcionar um ambiente seguro, o

  acompanhamento efetivo do voo e o controle operacional em situações normais

  e de emergência em voo,

  Desempenho

  esperado

  o aluno deverá ser capaz de identificar e avaliar situações de rotina e de

  emergência relacionadas ao monitoramento de voo e de aplicar os

  conhecimentos e habilidades adquiridos para efetivamente manter esse

  monitoramento, permanecendo atento às condições meteorológicas em rota,

  incluindo ventos; monitorar o consumo de combustível, o desempenho da

  aeronave, incluindo as limitações impostas por restrições da MEL, falhas nos

  equipamentos de bordo, problemas relacionados a interferência ilícita e os

  efeitos produzidos ou sofridos pela carga a bordo. Deve estar familiarizado com

  as ferramentas de comunicação adequadas, incluindo VHF / HF, ACARS/data

  link, SATCOM, e códigos de transponder, incluindo os vários códigos de

  segurança, com as condições climáticas e a disponibilidade de facilidades dos

  aeródromos em rota, quando uma alternativa for necessária.Data de emissão: 22 de dezembro
  de 2017. IS nº 141-003

  Revisão A

  O aluno deve ser capaz de consultar, de forma eficaz, os diversos serviços de

  tráfego aéreo em relação a potenciais redirecionamentos de rota e atrasos,

  recomendando opções dentro das capacidades da aeronave que minimizem

  possíveis desvios, as operações fora do horário previsto, e eventos que possam

  comprometer a segurança, o conforto e a economia da operação.

  Padrão de

  desempenho

  O aluno deve ser capaz de demonstrar efetivamente o conhecimento e as

  habilidades necessárias para participar do controle operacional dos voos através

  do monitoramento de voo e da mobilização de ações para minimizar os efeitos

  de eventos que afetem a segurança nas operações de voo.

  X4. Orientações didáticas

  O instrutor deve salientar a importância das atividades previstas no monitoramento de

  voo, tais como acompanhamento de voo, cálculo de redespacho, cálculo de plano de voo

  para alternativa, cálculo de tempo máximo de espera e informações meteorológicas feitas

  através de equipamentos de comunicação das empresas aéreas.

  É recomendada análise de casos reais ou simulados envolvendo os fatores influentes nas

  modificações das condições de voo em rota, a fim de que o aluno desenvolva sua

  capacidade de analisar a situação e adotar as medidas adequadas.

  X5. Ementa

  O conteúdo programático deste componente curricular está subdividido em duas

  Unidades Didáticas, conforme abaixo:'
