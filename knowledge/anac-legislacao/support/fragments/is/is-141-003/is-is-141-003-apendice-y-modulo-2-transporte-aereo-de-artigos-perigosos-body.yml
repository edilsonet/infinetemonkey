text: 'APÊNDICE Y - MÓDULO 2 -- TRANSPORTE AÉREO DE ARTIGOS PERIGOSOS

  Y1. Introdução

  O Anexo 18 - Transporte Seguro de Mercadorias Perigosas por Modal Aéreo, adotado

  pelo Conselho da ICAO/OACI em 1981, contém as normas gerais e práticas

  recomendadas que regem o transporte aéreo de artigos perigosos. Um artigo é classificado

  como perigoso se estiver listado no Doc 9284-NA/905 - Instruções Técnicas para o

  Transporte Seguro de Mercadorias Perigosas por Modal Aéreo (ICAO, 2013-2014),

  publicado a cada dois anos a fim de manter sempre atualizada a lista das substâncias

  perigosas, bem como as instruções sobre embalagem, rotulagem e carregamento. Essas

  Instruções Técnicas fornecem instruções detalhadas que devem ser seguidas

  obrigatoriamente por todos os Estados.

  A Associação Internacional de Transporte Aéreo (International Air Transport

  Association - IATA) também publica a cada dois anos regulamentos sobre artigos

  perigosos que são amplamente utilizados pelos operadores e transportadores. No entanto,

  deve ser lembrado que o manual IATA baseia-se nos requisitos do Anexo 18 e no Doc

  9284 da ICAO, sendo que o último contém as disposições juridicamente vinculativas para

  o transporte aéreo de artigos perigosos.

  O treinamento estabelecido pela ICAO/OACI apresenta modalidades específicas para

  cada profissional que atua na aviação. Para o profissional que tem a função de manusear,

  armazenar e carregar artigos perigosos, a ICAO/OACI determina uma forma mais

  abrangente de curso sobre artigos perigosos, com duração de vários dias.Data de emissão:
  22 de dezembro de 2017. IS nº 141-003

  Revisão A

  A proposta do componente curricular “Transporte Aéreo de Artigos Perigosos” é de

  familiarizar o DOV com a regulamentação pertinente, mas não o isenta de realizar o curso

  específico para sua atividade quando estiver empregado em uma empresa de transporte

  aéreo.

  Y2. Pré-requisitos - N/A

  Y3. Objetivos instrucionais

  Condição Cada aluno deve ter acesso, na sala de aula, a um resumo das normas

  internacionais que regem artigos perigosos e a uma cópia da versão vigente do

  RBAC 175 e das Instruções Suplementares correspondentes a artigos perigosos.

  Desempenho

  esperado

  O aluno deverá ser capaz de reconhecer que há artigos perigosos em um

  determinado voo, e que requerem a verificação por pessoas qualificadas.

  Padrão de

  desempenho

  O aluno deve efetivamente demonstrar conhecimentos e habilidades necessárias

  à compreensão da classificação das mercadorias perigosas listadas nas Instruções

  Técnicas da OACI e da IATA e na regulamentação nacional sobre transporte

  aéreo de artigos perigosos.

  Y4. Orientações didáticas

  Problemas práticos devem ser usados para ilustrar a aplicação dos regulamentos

  internacionais e nacionais sobre artigos perigosos. Amostras de caixas de papelão,

  apresentando etiquetas corretas e incorretas, também podem ser mostradas para que o

  aluno as identifique e organize de acordo com a regulamentação. Todas as práticas de

  segurança relevantes devem ser observadas pelo instrutor ao desenvolver os conteúdos

  deste componente curricular.

  Y5. Ementa

  O conteúdo programático deste componente curricular está subdividido em cinco

