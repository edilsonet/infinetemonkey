title: APÊNDICE Z - MÓDULO 2 -- COMUNICAÇÕES AERONÁUTICAS
text: 'APÊNDICE Z - MÓDULO 2 -- COMUNICAÇÕES AERONÁUTICAS

  Z1. Introdução

  As radiocomunicações são um dos meios disponíveis para o DOV efetivar o planejamento

  do voo e as funções de monitoramento, nas situações normais, anormais e de emergência.

  Como tal, é imperativo que o DOV seja treinado para uma proficiência aceitável no uso

  de equipamentos de radiocomunicações e seja capaz de comunicar-se de forma clara e

  concisa no idioma utilizado para tais fins.

  Z2. Pré-requisitos - N/A

  Z3. Objetivos instrucionais

  Condição Com base nos regulamentos relevantes, nas informações essenciais e nas

  condições reais ou simuladas em que o uso de um microfone e da terminologia

  de rádio, incluindo o alfabeto fonético, possam ser praticadas sob supervisão,

  Desempenho

  esperado

  O aluno deverá ser capaz de comunicar-se de forma clara e concisa, usando a voz

  e a transmissão de dados.

  Padrão de

  desempenho

  O aluno deve efetivamente demonstrar conhecimentos e habilidades necessárias

  à operação dos serviços de radiotelefonia que satisfaçam as exigências da

  regulamentação nacional e internacional, usando a fraseologia da OACI, o

  alfabeto fonético e os procedimentos do Anexo 10, Doc 4444 e Doc 9432.Data de emissão: 22
  de dezembro de 2017. IS nº 141-003

  Revisão A

  Z4. Orientações didáticas

  As Comunicações ocupam lugar de destaque na atividade profissional de um DOV e,

  portanto, este componente curricular reúne informações de diversos outros componentes.

  É necessário que o instrutor adote uma metodologia bastante dinâmica e prática para

  desenvolver nos alunos as habilidades necessárias para a operação segura dos serviços de

  radiotelefonia.

  Como recurso auxiliar à instrução, sugere-se o emprego de equipamentos de rádio

  portátil.

  Z5. Ementa

  O conteúdo programático deste componente curricular está subdividido em quatro

  Unidades Didáticas , conforme abaixo'
