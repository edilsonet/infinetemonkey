title: Os dados de manuais das aeronaves mais utilizadas no Brasil foram compilados pela
text: 'U1.2 Os dados de manuais das aeronaves mais utilizadas no Brasil foram compilados pela

  ANAC em um único manual para orientar os estudos do DOV.

  U2. Pré-requisitos - N/A

  U3. Objetivos instrucionais

  Condições Dispondo de exigências regulatórias a serem cumpridas por um operador

  envolvido no transporte aéreo comercial e dos manuais regulamentares

  significativos para o trabalho do DOV,

  Desempenho

  esperado

  O aluno deverá:

  - descrever o conteúdo de um manual de voo e identificar limitações de

  aeronaves que são de grande importância para o DOV;

  - utilizar a lista de equipamentos mínimos da aeronave (MEL), durante o

  planejamento de voo;

  - descrever o conteúdo de um manual de voo; e

  - buscar informações em todos os manuais disponíveis, a fim de planejar o

  voo.Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  Padrão de

  desempenho

  A regulamentação aplicável aos manuais de despacho operacional deverá ser

  completamente identificada e suas disposições e aplicações práticas

  compreendidas e implementadas, conforme necessário.

  U4. Orientações didáticas

  O instrutor deve ficar atento ao fato de que, além de atender às exigências do Estado, o

  operador aéreo pode incluir detalhes de políticas e procedimentos corporativos no manual

  de operações. Outros detalhes podem ser incluídos em outros manuais, tais como o

  manual de manutenção, manual de informação aeronáutica, e manual de controle de peso

  e balanceamento, conforme aplicável. Se esses manuais são utilizados pelo operador, os

  instrutores devem familiarizar os alunos com o conteúdo deles.

  Os dados básicos para cada aeronave são disponibilizados no Manual Técnico para o

  Curso de DOV e o aluno deve se habituar a aplicar esses dados em todos os cálculos

  necessários, tais como peso e balanceamanto.

  U5. Ementa

  Este componente curricular Peso e Performance está dividido em quatro Unidades

  Didáticas, conforme abaixo:'
