text: '(d) Unidade 4 -- Publicações de Informações Aeronáuticas - AIP e ROTAER

  U6. Plano das unidades e subunidades didáticas

  Componente Curricular: MANUAIS DE DESPACHO OPERACIONAL

  Módulo 2 Carga Horária: 12h-a

  Unidades Didáticas

  1 Manual de voo do avião (AFM)

  Objetivos específicos Subunidades

  1.1

  • Explicar os requisitos regulamentares acerca do Manual de

  Voo (AFM).

  1.1 Regulamentação acerca do manual de voo (airplane flight

  manual - AFM)Data de emissão: 22 de dezembro de 2017. IS nº 141-003

  Revisão A

  1.2

  • Descrever o conteúdo de um manual de voo típico.

  • Identificar, no AFM, as limitações da aeronave que são de

  importância para o DOV.

  1.3

  • Comparar e estabelecer semelhanças e diferenças entre os

  manuais AFM, FCOM, QRH e AOM.'
