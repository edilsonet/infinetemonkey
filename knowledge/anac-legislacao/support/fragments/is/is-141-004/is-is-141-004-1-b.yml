title: 1(b)
text: 'b) alteração das informações contidas em um certificado de CIAC e/ou EI, emitidos

  conforme RBAC nº 141, seja para inclusão ou exclusão de pessoal, aeronaves,

  cursos, etc. ou quaisquer modificações que se façam necessárias, mediante emenda

  às EI aprovadas ou ao próprio certificado de CIAC emitido.'
