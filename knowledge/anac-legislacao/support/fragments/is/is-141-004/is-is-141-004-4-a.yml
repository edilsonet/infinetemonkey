title: 4(a)
text: 'a) certificação: situação em que a organização requerente está em processo de

  obtenção de seu certificado, conforme as disposições desta IS ou procedimento

  alternativo, conforme mencionado no parágrafo 3.2 (b). Todo processo que envolva

  alteração ou emenda do certificado de CIAC, das EI ou de ambos, é análogo ao

  processo de certificação, guardadas as suas proporções;'
