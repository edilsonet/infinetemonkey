title: 4(b)
text: 'b) instrução teórica para todos os outros cursos.

  4.1.6. CIAC Tipo 2: organização que desenvolve exclusivamente instrução prática de voo,

  incluindo treinamento de solo complementar.

  4.1.7. CIAC Tipo 3: organização que desenvolve instrução em ambas as modalidades previstas

  para os CIAC Tipo 1 e 2.

  4.1.8. Controle operacional: conforme definição do RBAC nº 01, controle operacional

  significa, referindo-se a um voo (inclusive em simulador ou FTD), o exercício da

  autoridade sobre seu início, continuação, desvios, e o seu término, visando à segurança

  operacional e à qualidade da atividade instrucional.

  4.1.9. Curso aprovado, curso homologado ou curso de formação: são expressões utilizadas

  nos RBAC nº 61 ou 65 ou RBHA 63 para se referir a um curso ministrado por um CIAC

  conforme um programa de instrução aprovado pelo RBAC nº 141 e listado em suas

  especificações de instrução.

  4.1.10. E-mail oficial: endereço eletrônico do requerente definido por este e devidamente

  informado à ANAC. Este endereço deverá ser mantido em pleno funcionamento para as

  comunicações de e para a ANAC.

  4.1.11. Equipe de certificação: equipe de servidores designados pela ANAC, para conduzir
  o

  processo de certificação.

  4.1.12. Especificações de instrução (EI): documento emitido pela ANAC que detalha os termos

  e as condições de operação de um CIAC certificado. A revisão mais recente das EI revoga

  as revisões anteriores a partir da data de emissão, integra o certificado de CIAC e vincula

  as características deste operador às definições conforme nela descritas.

  4.1.13. Formulário de análise de impacto (FAI): documento por meio do qual a organização

  requerente descreve o estudo realizado, de forma abrangente, acerca do planejamento e

  impactos da certificação, ou de cada solicitação de alteração ou emenda ao certificado de

  CIAC, às EI ou ambos.

  4.1.14. Formulário padronizado (FOP): documento que tem como objetivo delimitar

  informações por assuntos específicos de forma padronizada em substituição a cartas,

  memorandos e ofícios. Os FOP são utilizados nas interações entre o requerente e a

  ANAC, inclusive nas comunicações internas da Agência.

  4.1.15. Inspeções e demonstrações: qualquer demonstração de ensaios, voos, provas,

  documentos, registros ou evidências que a ANAC julgar necessária à validação de uma

  autorização ou certificação. É a comprovação de atendimento aos requisitos técnicos

  aplicáveis.Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  4.1.16. Iteração: ciclo de avaliação documental sobre uma proposta solicitada pela organização

  requerente, a qual é requerida uma avaliação preliminar, uma aceitação ou aprovação de

  manuais ou programas. As iterações estão relacionadas a quaisquer documentos que

  instruam o processo de certificação e que atestem o cumprimento de requisitos, inclusive

  em alterações ou emendas ao certificado de CIAC e às EI.

  4.1.17. Manifestação conclusiva: entende-se por uma resposta com todas as informações

  solicitadas pela equipe de certificação, ainda que os itens possam conter incorreções ou

  inconformidades a serem observadas durante sua análise.

  4.1.18. Material técnico: são documentos, manuais, programas, certificados, declarações,

  contratos, etc., necessários à instrução do processo de outorga e/ou certificação, conforme

  requerido nas fases aplicáveis.

  4.1.19. Notificação: comunicado destinado ao requerente informando ações ou solicitações
  da

  Agência necessárias ao processo em andamento. A inclusão da notificação no processo

  eletrônico expressa o tácito conhecimento do notificado.

  4.1.20. Pacote de solicitação formal (PSF): conjunto de documentos requeridos para

  certificação ou para determinada solicitação de alteração, emenda ou inclusão de

  autorização proposta pelo operador, tais como: FOP, FAI, material técnico, inclusive

  documentos comprobatórios, declaração de conformidade etc. conforme aplicável.

  4.1.21. Peticionamento eletrônico: método de envio eletrônico de documentos, por meio de

  acesso ao sistema SEI!. O acesso ao sistema SEI! permite ao usuário, ainda, consultar o

  andamento de seus respectivos processos junto à ANAC.

  4.1.22. Processo de certificação: conjunto de ações administrativas com vistas ao recebimento,

  análise e avaliação final de proposta do interessado quanto à obtenção, alteração ou

  emenda de certificado de CIAC ou de EI.

  4.1.23. Reunião de certificação (RC): audiência entre a organização requerente e a ANAC,
  que

  tem por finalidade a explanação e/ou esclarecimento de dúvidas, de ambas as partes,

  relativas ao processo de certificação, conforme definido nesta IS, acerca das

  particularidades da operação à qual o requerente se propõe. A RC pode ser realizada a

  qualquer tempo, para qualquer dos assuntos de que trata a presente IS, no interesse da

  ANAC e em detrimento das necessidades do requerente. Para essas audiências, poderá

  ser utilizado um FOP 400, ou carta, observado o disposto no Decreto nº 4.334, de 12 de

  agosto de 2002, da Presidência da República.

  4.1.24. Sistema SEI!: Sistema Eletrônico de Informações, o qual viabiliza o processo eletrônico

  no âmbito da ANAC.'
