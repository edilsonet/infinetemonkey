text: '4. DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidas as definições listadas na seção 141.3 do RBAC
  nº

  141, as definições listadas no RBAC nº 01 e as seguintes definições.

  4.1.1. Aceitação: procedimento segundo o qual a ANAC autoriza a utilização de um

  documento, manual, programa, etc., ou suas revisões, sem que necessariamente seja

  realizada avaliação prévia do cumprimento dos requisitos regulamentares. Nesse caso, o

  operador atua sob sua própria responsabilidade, até que a ANAC avalie a conformidade

  desse documento, manual, programa, etc. Cabe à organização requerente a execução dos

  procedimentos para obtenção do comprovante de aceitação da publicação proposta.

  4.1.2. Aprovação: procedimento segundo o qual a ANAC autoriza a utilização de um

  documento, manual, programa, etc. ou suas revisões, mediante avaliação prévia do

  cumprimento dos requisitos regulamentares. Nesse caso, a vigência da autorização terá

  início na data definida no documento de aprovação emitido pela Agência.

  4.1.3. Avaliação preliminar de documentos: verificação admissional dos documentos que

  devem ser apresentados pelo requerente, de acordo com as operações propostas, e que

  devem compor o Pacote de Solicitação Formal (PSF).

  4.1.4. Certificado de centro de instrução de aviação civil (certificado de CIAC):

  nomenclatura atualizada do Certificado de Autorização para Funcionamento, conforme

  definição constante no RBAC nº 141. Documento por meio do qual a ANAC atesta que

  uma organização está certificada para promover a formação e qualificação de aeronautas

  postulantes a uma licença, habilitação ou certificado requeridos pelo RBAC nº 61, RBHA

  63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65, após ter demonstrado possuir

  condições técnico-operacionais, conforme a legislação vigente e de acordo com os

  procedimentos estabelecidos em seus manuais e programas, autorizados ou limitados em

  suas especificações de instrução (EI). O certificado de CIAC pode estar em contexto de

  sua:'
