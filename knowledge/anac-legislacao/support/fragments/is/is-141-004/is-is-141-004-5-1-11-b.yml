  ▪ FOP 411 - Aprovação de material técnico

  (se aplicável, conforme 6.8.8);

  ▪ FOP 412 - Aceitação de material técnico

  (se aplicável, conforme 6.8.8);

  ▪ FOP 405.4 - Termo de encerramento de

  fase.

  Organização requerente - Documentação

  requerida para sanar pendências

  Organização requerente - sem pendências

  em aberto

  ▪ FOP 415 - Resposta às não-conformidades

  de inspeção;

  ▪ FOP 407 - Encaminhamento de material

  para análise (para cada manual ou

  programa, se necessários ajustes em

  manuais ou programas, conforme item

  5.1.8.8).

  Nota: A critério da equipe de certificação, se

  necessária nova auditoria para avaliação das

  correções das não-conformidades, a fase 4

  será reiniciada com a apresentação de novo

  FOP 413.

  Apta para a fase 5.

  5.1.8.11. A emissão do FOP 405.4 encerra formalmente a fase 4 de certificação.

  5.1.9. Fase 5 - Certificação

  5.1.9.1. A emissão do certificado de CIAC e das especificações de instrução (EI) conclui
  a fase 5

  do processo de certificação.

  5.1.10. Não obstante a conclusão do processo de Certificação, a prestação do serviço de
  CIAC

  tipo 2 ou tipo 3 somente poderá ser iniciada após a outorga da autorização operacional,Data
  de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  que será emitida pela Superintendência de Acompanhamento dos Serviços Aéreos.

  5.1.10.1. O processo de outorga seguirá o estabelecido na Resolução nº 377/16 e Portaria
  nº

  616/SAS/16 ou regras que vierem a substituí-las. Para mais informações sobre a

  continuidade do processo, o proponente deverá entrar em contato através do e-mail

  gtos@anac.gov.br.

  5.1.10.2. Para CIAC tipo 2 ou tipo 3, com a publicação da autorização operacional no Diário
  Oficial

  da União e de posse do certificado de CIAC e das EI, a organização requerente poderá

  iniciar a exploração do serviço de formação de pessoal da aviação civil segundo as regras

  do RBAC nº 141, conforme as autorizações e limitações contidas em suas EI.

  5.1.10.3. De posse do certificado de CIAC e das EI, o CIAC tipo 1 poderá iniciar a exploração
  do

  serviço de formação de pessoal da aviação civil segundo as regras do RBAC nº 141,

  conforme as autorizações e limitações contidas em suas EI.

  5.1.10.4. Os documentos aplicáveis a esta fase são:

