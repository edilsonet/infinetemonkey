text: 'b) O impedimento por parte do requerente à realização da demonstração pode incidir

  no indeferimento e arquivamento do processo.

  5.1.8.4. Durante esta fase, os manuais e programas apresentados serão avaliados na sua aplicação

  quanto à aderência, eficácia e efetividade de seu conteúdo.

  5.1.8.5. Após as demonstrações, a equipe de certificação produzirá um relatório com os resultados

  de cada demonstração.

  5.1.8.6. Caso sejam detectadas não-conformidades ou necessidade de ajustes, a equipe de

  certificação emitirá um FOP 414 detalhando os procedimentos que deverão ser corrigidos

  acerca das demonstrações, inclusive considerações para cada manual ou programa, que

  necessite de ajuste ou correção.Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.1.8.7. Neste caso, a organização requerente responderá o FOP 414 por meio de um FOP 415,

  apresentando as ações e correções realizadas, respeitando-se o limite de iterações

  estabelecido no item 5.1.12.2.

  5.1.8.8. Para cada manual ou programa que necessite ajuste ou correção, deverá ser apresentado

  novo material por meio de um FOP 407, conforme descrito no item 5.1.2.3 desta IS.

  5.1.8.9. A equipe de certificação poderá solicitar novo agendamento (FOP 413), conforme

  descrito no item 5.1.8.2, caso seja necessária nova demonstração para a conclusão

  satisfatória da fase.

  5.1.8.10. Os documentos aplicáveis à esta fase são:

  Fase 4 - Demonstrações e inspeções

  Organização requerente - Documentação requerida

  ▪ FOP 413 - Solicitação de Inspeção e/ou Demonstração;

  Equipe de certificação - Documentos emitidos

  ▪ Notificação de auditoria (após confirmação de agendamento de auditoria e escopo).

  Equipe de certificação - Documentos

  emitidos se constatada pendência durante

