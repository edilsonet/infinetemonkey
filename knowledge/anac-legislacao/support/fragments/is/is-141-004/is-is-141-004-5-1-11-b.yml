  ▪ Emissão do certificado de CIAC e EI.

  5.1.11. Prazos de referência do processo

  5.1.11.1. A organização proponente terá o prazo de 30 (trinta) dias para apresentar as ações

  requeridas durante o processo de certificação e as respostas a cada comunicação de não-

  conformidade, salvo disposição contrária.

  5.1.11.2. Caso esse prazo se encerre sem manifestação conclusiva por parte da organização

  requerente, em qualquer fase, o processo será compulsoriamente encerrado e considerado

  insatisfatoriamente concluído.

  5.1.11.3. Por manifestação conclusiva entende-se uma resposta com todas as informações

  solicitadas pela equipe de certificação, ainda que os itens possam conter incorreções ou

  não conformidades a serem observadas durante sua análise.

  5.1.11.4. Após a avaliação preliminar de uma resposta a incorreções ou não-conformidades,
  se for

  detectada a falta ou omissão de alguma informação requerida, a manifestação será

  considerada não-conclusiva e a contagem do prazo voltará a ser contabilizada a partir da

  emissão de documento que informou as pendências à organização requerente. Neste caso,

  a equipe de certificação informará à organização requerente acerca da omissão das

  informações na manifestação entregue.

  5.1.11.5. Os prazos concedidos são contabilizados em dias corridos após a ciência do documento

  pelo interessado, comprovada por meio eletrônico ou físico, ou por publicação em Diário

  Oficial.

  5.1.12. Encerramento compulsório do processo de certificaçãoData de emissão: 24 de maio
  de 2019. IS nº 141-004

  Revisão A

  5.1.12.1. Caso seja considerado pela ANAC que o processo contém não-conformidade insanável,

  após a avaliação preliminar ou análise, independentemente do número de iterações, o

  processo será indeferido e arquivado.

  5.1.12.2. Para cada manual, programa, documento ou resultado de inspeção, caso uma proposta

  seja rejeitada pela terceira vez durante a análise, o processo relacionado a essa proposta

  será indeferido e arquivado compulsoriamente, independente do prazo.

  5.1.12.3. Caso não seja possível encerrar a fase 4 após a realização de 2 (duas) inspeções
  ou

  demonstrações de mesmo escopo, o processo será indeferido.

  5.1.12.4. A não observância dos prazos sem qualquer manifestação por parte do requerente
  para a

  apresentação das ações requeridas, caracterizará desistência e ensejará o encerramento do

  processo de certificação.

  5.1.12.5. A descontinuidade ou desistência do processo de certificação, implicará o seu

  indeferimento e arquivamento.

  5.1.12.6. O indeferimento de um processo implica na anulação das autorizações emitidas pela

  ANAC no decorrer daquele processo.

  5.1.12.7. Um processo encerrado não pode ser reaberto, tampouco documentos contidos nele

  podem ser reutilizados, salvo por decisão de reconsideração, assegurado o direito de

  ampla defesa e do contraditório.

  5.1.12.8. Para as decisões da ANAC, é assegurado ao requerente o direito de ampla defesa
  e do

  contraditório. Os recursos deverão ser direcionados à autoridade que emitiu a decisão,

  que poderá remetê-los às instâncias superiores.

  5.1.12.9. O prazo para a apresentação de recurso contra as decisões da ANAC, é de 10 dias
  a contar

  da ciência da decisão, conforme previsto na Lei 9.784/99 (Lei do Processo

  Administrativo).

  5.1.12.10. Em caso de rejeição do recurso, o requerente será comunicado sobre a decisão
  e

  ratificação de indeferimento e arquivamento do processo.

  5.1.12.11. Caso exista interesse da organização requerente, esta deverá dar início a um
  novo

  processo, que será conduzido em conformidade com os procedimentos apresentados nesta

  IS.

  5.2. PROCESSOS DE ALTERAÇÃO DAS ESPECIFICAÇÕES DE INSTRUÇÃO

  E/OU DO CERTIFICADO DE CIAC

  5.2.1. Disposições gerais

  5.2.1.1. Uma vez certificadas, as organizações que necessitem realizar alterações em seu

  certificado de CIAC, ou em suas EI, para inclusões, modificações e/ou exclusões, deverão

  solicitar à gerência responsável por sua supervisão operacional as modificações conforme

  definidas nesta IS.Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.2.1.2. O processo de alteração do certificado de CIAC ou das EI, é análogo ao processo
  de

  certificação, podendo ser simplificado, a depender da característica da alteração

  pretendida.

  5.2.1.3. Aplicam-se a todos os processos o disposto nos itens 5.1.11 e 5.1.12 desta IS.

  5.2.1.4. Uma alteração ou emenda do certificado de CIAC, das EI, ou em ambos, com previsão

  nesta Instrução Suplementar, somente entrará em vigor após a emissão da revisão do

  certificado de CIAC e/ou EI, contendo a referida alteração.

  5.2.1.5. Para cada alteração solicitada, é necessário que a organização elabore um estudo

  abrangente acerca do planejamento e impacto da proposta, por meio do FAI, devidamente

  preenchido, levando em consideração as informações apresentadas no item 5.1.6.3 desta

  IS.

  5.2.1.6. Dependendo da alteração proposta, poderão sofrer modificação o certificado de CIAC
  e

  as EI, ou somente as EI, ficando esta decisão a cargo da ANAC.

  5.2.1.7. Para cada tipo de alteração solicitada, o operador deverá apresentar um FOP 406,

  acompanhado da documentação necessária em anexo, documentos comprobatórios e

  outros, formando um pacote tal qual o PSF, pelo menos 60 (sessenta) dias antes da data

  pretendida da entrada em vigor da alteração, exceto para solicitações exclusivamente

  referentes ao pessoal de administração requerido.

  5.2.1.8. Por solicitação do operador e/ou a critério da ANAC, poderá ser requerido o agendamento

  de uma RC para esclarecimentos e ajustes no processo de alteração das EI e/ou certificado

  de CIAC.

  5.2.1.9. As revisões e elaborações de manuais e programas ou qualquer documentação requerida,

  como também os procedimentos operacionais, devem seguir as mesmas orientações

  estabelecidas na seção 5.1 desta IS.

  5.2.1.10. A apresentação de proposta de alteração de um programa de instrução já aprovado
  pela

  ANAC, ou de qualquer informação listada nas EI, pode implicar na necessidade de

  alteração de outros manuais, e na necessidade de realização de novas inspeções ou

  demonstrações. A título de exemplo, alterações nas sessões de treinamento ou no uso de

  FSTDs ou ainda na classe de aeronave usada em um determinado programa de instrução

  são consideradas alterações que podem requerer novas inspeções ou novos procedimentos

  no MIP ou MGQ.

  5.2.2. Alteração de endereço da sede do CIAC

  5.2.2.1. Para alteração de endereço da sede do CIAC, a seguinte documentação é necessária:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP contendo datas sugeridas para realização de RC.

  II- FOP 406 Preencher o FOP explicitando a alteração solicitada de maneira detalhada.

  III- Anexos Alvará de funcionamento.Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  IV- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar um

  estudo abrangente acerca do planejamento e impacto da proposta.

  V- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  VI- FOP 413 Após a aprovação e aceitação dos manuais/programas modificados, deverá

  preencher e apresentar o FOP para a auditoria necessária à verificação de

  requisitos in loco.

  5.2.3. Inclusão ou alteração de endereço de CIAC satélite

  5.2.3.1. Para efetuar a inclusão ou alteração de endereço de CIAC satélite, a seguinte

  documentação deverá ser apresentada:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP contendo datas sugeridas para realização de RC.

  II- FOP 406 Preencher o FOP explicitando a alteração solicitada.

  III- Anexo Documento que informe o CNPJ da filial.

  Alvará de funcionamento da filial.

  IV- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar um

  estudo abrangente acerca do planejamento e impacto da proposta.

  V- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  VI- FOP 413 A critério da ANAC, após a aprovação e aceitação dos manuais/programas

  requeridos, deverá preencher e apresentar, com referência ao processo, o

  FOP para a auditoria necessária à verificação de requisitos in loco incluindo

  testes de validação.

  5.2.4. Alteração da razão social e ou nome fantasia

  5.2.4.1. Para alteração da razão social e/ou nome fantasia, a seguinte documentação é necessária:

  Item Documento Orientação

  I- FOP 406 Preencher o FOP explicitando a alteração solicitada de maneira

  detalhada.

  II- Anexo Contrato Social ou Estatuto.

  III- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  IV- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.2.5. Alteração de pessoal da administração requerida - coordenador de curso, gerente

  de segurança operacional ou gerente da qualidade

  5.2.5.1. Para alteração do pessoal da administração requerida, à exceção do gestor responsável,
  a

  seguinte documentação é necessária:

  Item Documento Orientação

  I- FOP 406 Preencher o FOP explicitando a alteração solicitada.

  II- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.Data de emissão: 24 de
  maio de 2019. IS nº 141-004

  Revisão A

  III- FOP 402 Especificação das informações do candidato ao cargo e documentação

  comprobatória que satisfaça os requisitos da seção 141.61 do RBAC nº

  141. No caso de acúmulo, atender o disposto no item 5.1.4.

  IV- Anexo Documentos que evidenciem o atendimento ao item 5.1.4 desta IS.

  V- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.2.6. Alteração de pessoal da administração requerida - gestor responsável

  5.2.6.1. Para alteração do gestor responsável, a seguinte documentação é necessária:

  Item Documento Orientação

  I- FOP 406 Preencher o FOP explicitando a alteração solicitada.

  II- Anexo Contrato social ou estatuto autorizando o candidato ao cargo a tomar

  decisões pela organização;

  No caso em que o candidato ao cargo que não faça parte da organização

  como sócio, procuração com a nomeação do candidato, autorizando-o

  a tomar decisões pela organização de forma autônoma, acompanhado

  de ata ou estatuto de indicação para demonstrar conformidade de sua

  indicação com os atos constitutivos da organização.

  III- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  IV- FOP 402 Especificação das informações do candidato ao cargo.

  V- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.2.7. Inclusão ou exclusão de examinador credenciado

  5.2.7.1. Para efetuar a inclusão ou alteração de examinador credenciado, a seguinte documentação

  deverá ser apresentada:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP contendo datas sugeridas para realização de RC.

  II- FOP 406 Preencher o FOP explicitando a alteração solicitada.

  III- Anexo Certificado de aprovação em curso de examinador (somente para

  inclusão).

  Currículo que comprove os requisitos para a atividade (somente para

  inclusão).

  IV- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da

  proposta.

  V- FOP 402 Especificação das informações do candidato ao cargo.

  VI- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.2.8. Inclusão/alteração de oficinas ou convênios dos cursos de mecânico ou comissárioData
  de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.2.8.1. A inclusão ou alteração de oficinas ou laboratórios nos cursos para MMA, ou convênios

  de terceirização de qualquer tipo, equivale a uma alteração de recursos instrucionais do

  seu programa de instrução. Vide item 5.2.10.

  5.2.9. Inclusão ou exclusão de aeronaves

  5.2.9.1. Para inclusão ou exclusão de aeronaves nas EI, o operador deverá apresentar documentos

  conforme o quadro abaixo:

  Item Documento Orientação

  I- FOP 406 Preencher o FOP explicitando a alteração solicitada, detalhando o

  fabricante, modelo, número de série e marcas de nacionalidade e

  matrícula.

  II- Anexo Seguro com cobertura abrangente ao tipo de operação (somente para

  inclusão).

  III- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  A análise deve levar em consideração se a alteração proposta

  modificará a classificação do CIAC.

  IV- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.2.10. Inclusão de curso nas EI / aprovação ou alteração significativa de programa de

  instrução

  5.2.10.1. Considera-se um curso aprovado (conforme 5.1.9) aquele listado nas EI e ministrado

  conforme um programa de instrução aprovado. O CIAC deve possuir um programa de

  instrução para cada curso aprovado.

  5.2.10.2. O programa de instrução de cada curso deve atender aos requisitos aplicáveis para
  a

  obtenção da respectiva licença ou habilitação nos RBAC 61, 65 ou RBHA 63 ou RBAC

  que vier a substituí-los.

  5.2.10.3. É facultado ao CIAC aprovar diferentes programas de instrução que resultem na
  mesma

  licença ou habilitação.

  5.2.10.4. Para obter a aprovação de um programa de instrução, o CIAC deverá apresentar

  documentos conforme o quadro abaixo:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP contendo datas sugeridas para realização de RC.

  II- FOP 402 Especificação das informações do candidato ao cargo de coordenador

  de curso e documentação comprobatória que satisfaça os requisitos

  da seção 141.61 do RBAC nº 141.

  Caso haja mudança de tipo de CIAC, incluir informações do item 5.2.5

  para os novos cargos.

  III- FOP 406 Preencher o FOP explicitando a solicitação.

  IV- Anexos

  (conforme

  aplicáveis)

  Documentação referente às aeronaves, FSTD e outros recursos

  instrucionais utilizados (incluindo seguro com cobertura abrangente

  ao tipo de operação).Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  Documentação referente às instalações utilizadas (incluindo alvará de

  funcionamento).

  Termo de Convênio com oficina certificada pela ANAC.

  Lista de recursos conforme Apêndice G da IS nº 141-002 em vigor.

  V- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  No caso de necessidade de adequação do quadro de pessoal de

  administração requerido, as instruções apropriadas para cada cargo

  devem ser seguidas.

  A análise deve levar em consideração se a alteração proposta

  modificará a classificação do CIAC.

  VI- FOP 407 Para cada manual/programa afetado.

  Sempre apresentar o programa de instrução relacionado à proposta.

  VII- FOP 413 Após a aprovação e aceitação dos manuais/programas requeridos,

  deverá preencher e apresentar, com referência ao processo, o FOP

  para as inspeções e demonstrações aplicáveis.

  5.2.11. Aceitação ou aprovação de material técnico (MGSO, MGQ, MIP, programa de

  instrução ou MEL)

  5.2.11.1. Para obter a aceitação de um MGSO, MGQ ou MIP, ou ainda a aprovação de uma revisão

  não significativa de um programa de instrução ou de uma MEL, o CIAC deverá apresentar

  documentos conforme o quadro abaixo:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP contendo datas sugeridas para realização de RC.

  II- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  No caso de necessidade de adequação do quadro de pessoal de

  administração requerido, as instruções apropriadas para cada cargo

  devem ser seguidas.

  A análise deve levar em consideração se a alteração proposta

  modificará a classificação do CIAC.

  III- FOP 407 Para cada manual/programa afetado.

  5.2.11.2. Considera-se uma revisão não significativa de um programa de instrução uma revisão
  que

  não altere a forma como um curso é ministrado, incluindo seu coordenador designado,

  aeronaves, instalações ou equipamentos utilizados, ou no conteúdo ou sequência das

  aulas. Exemplos: alterações de nome ou razão social ou alterações de procedimentos

  simples.

  5.2.11.3. Se a revisão do programa de instrução for considerada significativa, inclusive
  a critério

  da ANAC, deve-se seguir o procedimento do item 5.2.10.

  5.2.12. Exclusão de autorizações previstas nas EIData de emissão: 24 de maio de 2019. IS
  nº 141-004

  Revisão A

  5.2.12.1. Caso o operador tenha a intenção de revogar uma autorização específica prevista
  em suas

  EI, inclusive exclusão de aeronaves ou de instalações físicas, deverá apresentar a seguinte

  documentação:

  Item Documento Orientação

  I- FOP 406 Especificação das alterações pretendidas.

  II- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  as alterações ou inclusões que serão necessárias nos

  manuais/programas em decorrência da solicitação, no tocante a

  treinamento, manutenção e procedimentos. No caso de necessidade

  de adequação do quadro de pessoal de administração requerido, as

  instruções apropriadas para cada cargo devem ser seguidas.

  A análise deve levar em consideração se a alteração proposta

  modificará a classificação do CIAC, e possíveis impactos associados.

  III- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.3. SUSPENSÃO DO CERTIFICADO DE CIAC

  5.3.1. Suspensão do certificado de CIAC por solicitação do operador

  5.3.1.1. O operador poderá solicitar a suspensão de seu certificado de CIAC por meio do
  FOP

  420, que deverá ser encaminhado à área da ANAC responsável por sua supervisão

  operacional.

  5.3.2. Suspensão do certificado de CIAC pela ANAC

  5.3.2.1. A ANAC poderá suspender cautelarmente o certificado de CIAC sem a prévia

  manifestação do interessado, de acordo com a seção 141.9 (b) do RBAC nº 141 e o Art.

  45 da Lei nº 9784/1999 caso constate, o não cumprimento de requisitos técnico-

  operacionais que configurem risco iminente à segurança operacional.

