text: '5.1.11 desta IS, ou outro definido pela ANAC, para operadores já certificados, quando
  se

  tratar de requisito regulamentar.

  5.1.7.3. São motivos para indeferimento e arquivamento compulsório do processo de avaliação

  de documentos: a rejeição da proposta por 3 (três) vezes (incluindo as respostas a não

  conformidades ou pendências); a comunicação de desistência por parte do proponente;

  e/ou a decisão da ANAC embasada por motivo prejuízo à segurança operacional.

  Nota: nos casos em que a rejeição de um documento, manual ou programa for motivada pela

  atualização de um regulamento, publicação técnica do fabricante ou autoridade de aviação

  civil, ou qualquer documento de referência para análise do material, não haverá

  contabilização desta iteração para fins de arquivamento do processo específico.

  5.1.7.4. As respostas por meio de um FOP 409, deverão estar referenciadas a cada não-

  conformidade indicada no FOP 408, e o material técnico deverá ser apresentado por

  completo, conservando a numeração de revisão, porém com atualização de sua data.

  5.1.7.5. A qualquer tempo durante a fase 3, enquanto o processo de análise de um determinado

  manual ou programa estiver em curso, a organização requerente que perceber a

  necessidade de ajustes no material técnico, poderá fazê-lo apresentando novo material

  ajustado por meio de um FOP 409, com referência ao processo em curso desse manual

  ou programa específico. Para esses casos, as iterações de que trata o item 5.1.7.3 não

  serão contabilizadas.

  5.1.7.6. Os manuais e programas que requerem aprovação receberão FOP 411. Este FOP deverá

  ser anexado a cada manual e/ou programa correspondente.

  5.1.7.7. Os manuais e programas que requerem aceitação receberão um FOP 412. Este FOP

  deverá ser anexado a cada manual e/ou programa correspondente, comprovando a

  apresentação do material à ANAC antes da entrada em vigor das alterações porventura

  propostas.

  5.1.7.8. Os manuais ou partes dos manuais sujeitos à aceitação poderão ser revisados pelo

  operador, sendo obrigatório o envio da publicação integral, com clara indicação das

  alterações propostas e sua motivação.

  5.1.7.9. Os documentos aplicáveis a esta fase são:Data de emissão: 24 de maio de 2019. IS
  nº 141-004

  Revisão A

  Fase 3 - Avaliação de documentos Equipe de certificação - Documentação

  emitida após a análise se constatadas

  não-conformidades

  Equipe de certificação - Documentação

  emitida após análise satisfatória conforme

  aplicável

  ▪FOP 408 - Ofício de comunicação de

  não-conformidades processuais

  ▪ FOP 411 - Aprovação de material técnico

  ▪ FOP 412 - Aceitação de material técnico

  ▪ FOP 405.3 - Termo de encerramento de fase.

  Organização requerente -

  Documentação requerida para sanar

  pendências

  Organização requerente - sem pendências em

  aberto

  FOP 409 - Resposta às não-

  conformidades processuais

  Apta para a fase 4.

  5.1.7.10. A emissão do FOP 405.3, e dos FOP 411 e 412 aplicáveis, encerra formalmente a
  fase 3

  de certificação.

  5.1.8. Fase 4 - Demonstrações e inspeções

  5.1.8.1. A fase 4 tem como objetivo avaliar a aderência dos procedimentos, equipamentos,

  instalações e facilidades propostos pelo requerente, na documentação apresentada nas

  fases anteriores, à realidade da organização. As verificações nas áreas de operações e

  instrução serão realizadas in loco no(s) CIAC(s) estabelecido(s) pela organização, com a

  finalidade de comprovar a capacidade de desempenho real das atividades ou operações

  propostas.

  5.1.8.2. Em até 30 dias após a emissão do FOP 405.3, ou do FOP 414 quando aplicável, o

  requerente deverá apresentar o FOP 413 sinalizando que está apto a demonstrar sua

  capacidade técnico-operacional. O prazo poderá ser estendido por mais 30 dias, mediante

  justificativa prévia. Não havendo comunicação por parte do requerente, o processo será

  indeferido e arquivado.

  5.1.8.3. A ANAC agendará as demonstrações, preferencialmente em comum acordo com o

  proponente. Serão considerados aspectos logísticos e orçamentários, dentre outros.'
