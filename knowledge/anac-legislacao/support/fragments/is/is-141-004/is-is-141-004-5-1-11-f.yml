text: 'f) a vacância por mais de 60 dias de qualquer dos cargos de administração requerida

  pelo RBAC nº 141.Data de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.3.2.3. A ANAC poderá suspender o certificado de CIAC da organização em decorrência de

  processo sancionatório instaurado nos termos da Resolução ANAC nº 472/2018, ou

  norma que vier a substituí-la, como previsto no Código Brasileiro de Aeronáutica.

  5.3.2.4. Em todos os casos o CIAC será informado da suspensão por meio de um FOP 421.

  5.3.2.5. A ANAC dará publicidade da decisão no Diário Oficial da União.

  5.3.3. Revogação da suspensão do certificado de CIAC

  5.3.3.1. O processo de revogação da suspensão do certificado de CIAC incide na comprovação
  da

  solução das não-conformidades apontadas pela ANAC, podendo ser exigida uma revisão

  completa no processo de certificação.

  5.3.3.2. O processo de revogação da suspensão do certificado de CIAC será conduzido de acordo

  com um processo de 5 fases apresentado no capítulo 6 desta IS, dependendo da

  complexidade do processo de revogação da suspensão.

  5.3.3.3. Aplicam-se a todos os processos o disposto nos itens 5.1.11 e 5.1.12 desta IS.

  5.3.3.4. O insucesso na revogação da suspensão implica a cassação do certificado.

  5.3.3.5. A revogação da suspensão do certificado de CIAC, caso aceita pela ANAC, será

  informada ao detentor do Certificado por meio de FOP 423, complementado pelas

  respectivas EI, quando aplicável.

  5.3.3.6. A ANAC dará publicidade da decisão no Diário Oficial da União.

  5.3.3.7. A revogação da suspensão decorrente de um processo punitivo (item 5.3.2.3) se dará

  automaticamente no fim do período sancionatório, não necessitando envio de qualquer

  documentação.

  5.3.3.8. Para os outros casos de revogação da suspensão de seu certificado de CIAC, a organização

  deverá fazer a solicitação à ANAC apresentando os seguintes documentos:

  Item Documento Orientação

  I- FOP 400 Preencher o FOP solicitando a realização de RC (opcional, a critério da

  ANAC).

  II- FAI Preencher o formulário de análise de impacto (FAI), que deve detalhar

  um estudo abrangente acerca do planejamento e impacto da proposta.

  No caso de necessidade de adequação do quadro de pessoal de

  administração requerido, as instruções apropriadas para cada cargo

  devem ser seguidas.

  A análise deve levar em consideração se a alteração proposta

  modificará a classificação do CIAC.

  III- FOP 402 Para cada cargo requerido, especificando as informações do

  candidato ao cargo e documentação comprobatória que satisfaça os

  requisitos da seção 141.61 do RBAC nº 141, conforme aplicável (se

  houver alteração).

  IV- FOP 422 Preencher o FOP solicitando a revogação da suspensão.

  V- FOP 406 Preencher o FOP explicitando a alteração solicitada, se aplicável.Data de emissão:
  24 de maio de 2019. IS nº 141-004

  Revisão A

  VI- Anexo Documentação complementar ao FOP 406, conforme aplicável.

  Evidências do saneamento de não-conformidades que levou à

  suspensão, se aplicável.

  VII- FOP 407 Para cada manual/programa cuja alteração implique mudança.

  5.4. REVOGAÇÃO DO CERTIFICADO DE CIAC

  5.4.1. Revogação do certificado de CIAC por solicitação do operador

  5.4.2. O operador poderá solicitar a revogação de seu certificado de CIAC por meio do FOP

  420, que deverá ser encaminhado à área da ANAC responsável por sua supervisão

  operacional.

  5.4.3. A ANAC dará publicidade da decisão no Diário Oficial da União.

  5.4.4. Um certificado de CIAC revogado não pode ser restaurado. Se a organização desejar

  operar novamente, deverá iniciar um novo processo de certificação.

  5.5. CASSAÇÃO DO CERTIFICADO DE CIAC

  5.5.1. A ANAC poderá cassar o certificado de CIAC de uma organização, em decorrência de

  processo sancionatório instaurado nos termos da Resolução ANAC nº 472/2018, ou

  norma que vier substituí-la, como previsto no Código Brasileiro de Aeronáutica.

  5.5.2. A ANAC cassará o certificado de CIAC em caso de dissolução, extinção ou liquidação

  da entidade.

  5.5.3. A ANAC cassará o certificado de CIAC se não houver manifestação da entidade em até

  365 (trezentos e sessenta e cinco) dias contados da publicação da suspensão no Diário

  Oficial da União.

  5.5.4. A organização será informada da cassação por meio do FOP 421.

  5.5.5. A ANAC dará publicidade da decisão no Diário Oficial da União.

  5.5.6. Um certificado de CIAC cassado não pode ser restaurado. Se uma organização desejar

  operar novamente, deverá iniciar um novo processo de certificação, atendidos os

  requisitos de pessoal da administração requerido.'
