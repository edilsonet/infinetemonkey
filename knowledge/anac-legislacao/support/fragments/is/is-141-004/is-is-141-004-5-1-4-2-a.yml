text: 'a) Impactos de tempo e custo da proposta: considerando o tempo necessário à

  certificação ou alteração, no caso de CIAC já certificada. A organização deverá

  informar, por exemplo, que calculou os custos de capital necessários e que dispõe

  destes recursos, e que está ciente que o montante poderá ficar bloqueado por

  extensos períodos de tempo;'
