title: 5.1.4.2(b)
text: 'b) carga horária do profissional estabelecida no seu contrato de trabalho compatível

  entre os CIAC para o exercício de suas funções sem sobreposições. Deve ser

  considerando, inclusive, o eventual deslocamento do profissional entre instalações

  sediadas em localidades diferentes.

  5.1.4.7. O pessoal de administração requerido, conforme a seção 141.61 do RBAC nº 141, deve

  demonstrar familiaridade com toda a regulamentação pertinente às operações pretendidas.

  5.1.4.8. A comprovação dos conhecimentos requeridos para o exercício de cada cargo, poderá

  ocorrer por meio da aplicação de entrevistas, testes ou exames a critério da equipe de

  certificação durante a fase 4.

  5.1.4.9. As comunicações, interações e documentos necessários ao processo de certificação

  somente serão aceitos se realizados pelas pessoas legalmente designadas pela organização

  requerente, respeitadas as respectivas áreas de atuação. Os representantes não-técnicos,

  legalmente estabelecidos, podem receber informações gerais sobre o andamento do

  processo de certificação e da documentação encaminhada à ANAC pela organização

  requerente.

  5.1.5. Fase 2 - Solicitação formal

  5.1.5.1. O proponente, necessariamente portador de acesso ao Protocolo Eletrônico SEI!,
  deverá

  apresentar um FOP 401 juntamente com o PSF completo. A ausência de qualquer dos

  itens que compõem o PSF pode, a critério da ANAC, incidir no indeferimento e

  arquivamento do processo. Os formulários que compõem o PSF devem ser preenchidos

  no sistema SEI!. É responsabilidade do requerente possuir acesso à rede mundial de

  computadores.'
