text: 'd) É dever do requerente consultar periodicamente seus processos em andamento.

  5.1.5.2. A organização requerente deverá preencher os FOP 401 e 402 (para cada cargo) e

  protocolar o material no sistema SEI!. As informações referentes à experiência pregressa

  dos ocupantes dos cargos da administração requerida, contida em cada FOP 402 para cada

  cargo a ser exercido na organização, deverão ser apresentadas juntamente com

  documentos registrados em cartório, com firma reconhecida, ou com autenticação por

  certificado digital, que comprovem a experiência requerida no RBAC nº 141.

  5.1.5.3. O quadro abaixo apresenta, em termos gerais, a documentação requerida para a fase
  2 de

  certificação e os documentos que serão emitidos pela equipe de certificação após a

  realização da avaliação preliminar e da RC (caso tenha sido realizada):

  Fase 2 - Solicitação Formal

  Organização requerente - Documentação requerida

  ▪ FOP 401 - Declaração de intenções do requerente;

  ▪ FOP 402 - Documento de cadastro de pessoal da organização requerente - Para cada

  cargo, com a documentação comprobatória em anexo.

  ▪ PSF, composto de:

  o FAI;

  o FOP 407 acompanhado de cada manual ou programa afetado pela solicitação;

  o Anexos (vide 6.6.3.1).

  Equipe de certificação - Documentação emitida após avaliação preliminar

  ▪ FOP 405.2 - Termo de encerramento de fase.

  5.1.5.4. Se, após uma avaliação preliminar, a documentação mínima requerida para cada

  solicitação do requerente não estiver completa, o requerente será informado da decisão

  de indeferimento e arquivamento do processo.

  5.1.5.5. A seção 5.2 desta IS apresenta a relação mínima de documentos do PSF para os

  requerimentos mais comuns também entendidos como processos de certificação.

  5.1.6. Preparação do PSF e Requerimento de Certificação - FOP 401

  5.1.6.1. A solicitação formal para obtenção do certificado de CIAC deve ser realizada por
  meio

  de um FOP 401 assinado pelo gestor responsável e um PSF a ele anexado. O material

  técnico a ser anexado ao FOP 401 inclui:'
