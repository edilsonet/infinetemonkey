title: 5.1.4.2(e)
text: 'e) Consideração sobre serviços terceirizados: havendo necessidade de contratação

  de serviços de terceiros para a operação pretendida, apresentar o levantamento de

  possibilidades de contratação, e a maneira de assegurar a qualidade do serviço

  prestado. Indicar que está ciente que a organização solicitante continua com todas

  as responsabilidades legais pela operação.'
