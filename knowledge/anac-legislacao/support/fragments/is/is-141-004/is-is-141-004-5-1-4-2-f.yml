text: 'f) Segurança operacional: deverá apresentar análise com evidências objetivas de que

  a organização planejou as ações para conduzir com segurança as operações

  propostas.

  5.1.6.2.3. A empresa poderá, caso julgue necessário, fazer uso de ferramentas como análise
  SWOT,

  gráficos Butterfly ou Bowtie, gráfico de Ishikawa, Balanced Scorecard, etc.Data de emissão:
  24 de maio de 2019. IS nº 141-004

  Revisão A

  5.1.6.2.4. O formulário deve refletir os estudos realizados por todo o pessoal de administração

  requerido.

  5.1.6.2.5. Sendo este bem elaborado, estima-se diminuição considerável na probabilidade
  de

  incorrer em não conformidades ou de indeferimento do pleito. Caso a proposta da qual

  versa o FAI possua procedimentos descritos nas publicações da organização, esses

  procedimentos e suas respectivas referências devem constar no FAI.

  5.1.6.2.6. A ANAC não emitirá documento de aprovação ou aceitação do FAI.

  5.1.6.3. Documentação comprobatória

  5.1.6.3.1. Como parte do PSF, todos os procedimentos estabelecidos em manuais e programas,

  contratos formais de treinamento, manutenção e outros serviços terceirizados, cartas de

  intenção ou outros documentos demonstrando acordos já firmados devem ser

  apresentados.

  5.1.6.3.2. Alguns exemplos de equipamentos e serviços que devem ter comprovação por

  documentos deste tipo são os seguintes:'
