text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1. PROCESSO DE CERTIFICAÇÃO

  5.1.1. Descrição do processo de certificaçãoData de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.1.1.1. Para fins de demonstração do cumprimento dos requisitos da seção 141.5 do RBAC
  nº

  141, a certificação de CIAC deverá ser iniciada, preferencialmente, após a realização da

  RC, ainda na fase 1 daquele processo. Esta reunião deve ser formalmente agendada em

  atendimento às regras em vigor de audiências com o poder público. A ANAC entende

  que a participação do proponente neste momento é primordial para o bom andamento do

  processo solicitado.

  5.1.1.2. O processo para a obtenção de certificado de CIAC é destinado a pessoa jurídica

  constituída para a atividade de que trata o RBAC nº 141.

