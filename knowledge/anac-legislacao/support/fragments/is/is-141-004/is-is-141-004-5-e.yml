text: 'e) Fase 5 - Certificação.

  FIGURA 1 - PROCESSO DE CERTIFICAÇÃO DE CINCO FASES

  5.1.2. Regime de portais de processo

  5.1.2.1. O processo de certificação adotado pela ANAC impõe um regime de portais, ou seja,

  somente se pode considerar uma fase como encerrada, caso todos os requisitos dessa fase

  tenham sido cumpridos.

  5.1.2.2. A critério da equipe de certificação, e dependendo da criticidade das pendências
  na

  documentação apresentada pela organização requerente, mediante justificativa prévia,

  poderá ser concedido prazo, conforme definido no item 5.1.11 desta IS, para apresentação

  da documentação requerida, período em que o processo permanecerá sobrestado.

  5.1.2.3. Se a organização requerente deixar de atender um ou mais requisitos anteriormente

  atendidos que lhe permitiram o prosseguimento de fase, o processo retornará à fase

  anterior até a satisfação dos requisitos aplicáveis àquela fase.

  5.1.2.4. Se a organização requerente pretender realizar alterações nas características do
  processo

  de certificação em curso, o processo poderá retornar às fases anteriores, a critério da

  equipe de certificação e considerando a complexidade da alteração. Caso essas alterações

  sejam significativas, o processo poderá retornar à fase 1 ou mesmo descontinuado.

  5.1.2.5. São meios formais de comunicação com o requerente: o acesso ao processo eletrônico,

  correio eletrônico, correspondência convencional, reuniões de certificação, publicação no

  Diário Oficial da União.

  Fase 1 - Contato

  inicial

  Fase 2 -

  Solicitação

  formal

  Fase 3 -

  Avaliação de

  documentos

  Fase 4 -

  Demonstrações

  e inspeções

  Fase 5 -

  CertificaçãoData de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.1.2.6. A descontinuidade ou desistência do processo de certificação em qualquer de suas
  fases,

  implicará o seu indeferimento.

  5.1.2.7. A ausência de documentos ou informações requeridos pode, a critério da ANAC, incidir

  no encerramento do processo de certificação.

  5.1.2.8. Os requerimentos entre o interessado e a ANAC ocorrem por meio dos formulários

  padronizados (FOP). Os FOP aplicáveis aos processos de organizações que operem ou

  pretendam operar segundo o RBAC nº 141, sinalizados como de uso externo (Ext.) ou

  uso interno (Int.), são:'
