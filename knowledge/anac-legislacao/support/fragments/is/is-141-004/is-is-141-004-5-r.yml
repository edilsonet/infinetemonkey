text: 'r) FOP 425 - Solicitação de encerramento de processo (Ext.).

  5.1.3. Fase 1 - Contato inicial

  5.1.3.1. Manifestação da organização requerente à ANAC com a finalidade de anunciar a intenção

  de certificação, a explanação e/ou esclarecimento de dúvidas relativas ao processo deData
  de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  certificação, conforme definido nesta IS, tendo como escopo as particularidades da

  operação à qual o requerente se propõe.

  5.1.3.2. Por manifestação da organização requerente entende-se qualquer contato formal

  (eletrônico ou físico) no qual seja possível identificar o proponente e suas intenções junto

  à ANAC.

  5.1.3.3. A ANAC responderá à manifestação requerente podendo, caso julgue necessário,

  determinar a realização de Reunião de Certificação - RC.

  5.1.3.4. A critério da ANAC, poderá ser dispensada a fase 1 do processo de certificação.

  5.1.3.5. Para a RC de proponente em fase inicial de Certificação, preferencialmente todo
  o quadro

  administrativo requerido deverá comparecer e estar preparado para discutir, em termos

  gerais, os planos e aspectos relevantes da operação pretendida, momento em que a

  organização receberá instruções sobre a elaboração do PSF que deve ser apresentado para

  a fase 2 do processo.

  5.1.3.6. O quadro abaixo, apresenta a documentação requerida para a fase 1 de certificação
  e os

  documentos que serão emitidos pela equipe de certificação após a realização da avaliação

  preliminar e da RC (caso tenha sido realizada):

  Fase 1 - Contato Inicial Organização Requerente - Documentação requerida (caso opte pela
  RC)

  ▪ Correspondência eletrônica (e-mail) para reunioes.gcoi@anac.gov.br declarando o

  interesse em iniciar processo junto à ANAC incluindo:

  ▪ FOP 400 - Solicitação de reunião de certificação.

  Equipe de certificação - Documentação emitida ao final da fase 1

  ▪ Ata de reunião de certificação (quando realizada).

  ▪ FOP 405.1 - Termo de encerramento de fase

  5.1.3.7. A emissão do FOP 405.1 encerra formalmente a fase 1 de certificação.

  5.1.3.8. A ANAC realizará abertura de Processo, cabendo ao proponente o envio dos documentos

  necessários conforme fase 2, em prazo certo. Não havendo manifestação formal, o

  Processo será arquivado compulsoriamente.

  5.1.4. Pessoal de administração requerido e representantes da organização requerente

  5.1.4.1. O proponente deve apresentar à ANAC, mediante FOP 402, a relação de pessoal de

  administração requerido e seus respectivos currículos, de forma a evidenciar que esses

  profissionais possuem as competências necessárias para cumprir com exatidão as

  atribuições de cada cargo.

  5.1.4.2. Os postulantes a cargos de administração requerida deverão estar legalmente registrados

  na organização requerente conforme preconiza a Lei nº 10.406, de 10 de janeiro de 2002

  (Código Civil).

  5.1.4.3. A ANAC poderá determinar a substituição de qualquer ocupante de cargo de

  administração requerido quando evidenciado descumprimento do que preconizam os

  parágrafos 141.61(c) ou 141.61(h) do RBAC nº 141.Data de emissão: 24 de maio de 2019. IS
  nº 141-004

  Revisão A

  5.1.4.4. O proponente que tenha a intenção de promover o acúmulo de cargos em sua estrutura

  organizacional deve apresentar, ainda, o formulário de análise de impacto (FAI), versando

  sobre as medidas para que as funções sejam desempenhadas a contento. A ANAC pode,

  a qualquer tempo, considerando aspectos de segurança operacional e qualidade das

  instruções, indeferir o acúmulo.

  5.1.4.5. O interesse em promover o acúmulo de funções de administração requerida entre CIACs

  deve ser informado previamente à ANAC, conforme procedimentos dos itens 5.1.4.1 e'
