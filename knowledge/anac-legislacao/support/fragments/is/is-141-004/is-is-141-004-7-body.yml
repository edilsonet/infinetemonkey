text: '7. DISPOSIÇÕES FINAISData de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  7.1. Os modelos de FAI e FOPs estão disponíveis para o usuário no sítio da ANAC, no

  endereço eletrônico:

  https://www.anac.gov.br/assuntos/setor-regulado/empresas/acesso-rapido/modelos-e-

  formularios

  7.2. Os casos omissos serão dirimidos pela SPO.

  7.3. As disposições contidas nesta IS entram em vigor a partir da data de sua publicação.Data
  de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A'
