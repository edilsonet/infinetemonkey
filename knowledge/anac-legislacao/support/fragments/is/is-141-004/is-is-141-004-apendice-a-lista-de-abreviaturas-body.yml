text: 'APÊNDICE A - LISTA DE ABREVIATURAS

  CIAC - centro de instrução de aviação civil

  EI - especificações de instrução

  FAI - formulário de análise de impacto

  FOP - formulário padronizado

  GCOI - Gerência de Certificação de Organizações de Instrução

  GTOF - Gerência Técnica de Organizações de Formação

  IS - Instrução Suplementar

  MGSO - manual de gerenciamento de segurança operacional

  MEL - minimum equipment list

  PSF - pacote de solicitação formal

  RBAC - Regulamento Brasileiro da Aviação Civil

  RBHA - Regulamento Brasileiro de Homologação Aeronáutica

  RC - reunião de certificação

  SGSO - sistema de gerenciamento de segurança operacional

  SPO - Superintendência de Padrões Operacionais

  SAS - Superintendência de Acompanhamento dos Serviços AéreosData de emissão: 24 de maio
  de 2019. IS nº 141-004

  Revisão A'
