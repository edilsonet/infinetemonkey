text: 'APÊNDICE B - EXEMPLO DE CERTIFICADO DE CIAC

  CERTIFICADO DE CENTRO DE INSTRUÇÃO DE AVIAÇÃO CIVIL

  PILOT SCHOOL CERTIFICATE

  REPÚBLICA FEDERATIVA DO BRASIL

  FEDERATIVE REPUBLIC OF BRAZIL

  NATIONAL CIVIL AVIATION AGENCY

  Data de vencimento

  (Expiry Date):

  Este certificado, emitido de acordo com a legislação em vigor, terá

  validade ilimitada, salvo em caso de cancelamento, suspensão ou

  revogação pela Autoridade de Aviação Civil Brasileira.This Certificate Shall remain valid
  for an unlimited duration, unless

  the approval is cancelled, suspended or revoked by Brazilian Civil

  Aviation Authority.

  Razão Social

  (OperatorName)

  YXZ ESCOLA DE AVIAÇÃO S.A

  CNPJ: 00.000.000/0001-00

  Nome Fantasia

  (Dba Trading Name)

  YXZ ESCOLA

  Endereço da SEDE

  (Adress): Av. Aeroporto, Hangar A, Voelândia-SP

  CEP: 01000-000

  Telefone

  (telephone): +55 11-5555-4444

  Email: escola@aprendaavoar.com.br

  PONTOS DE CONTATO OPERACIONAL

  Informações detalhadas para contatos, a qualquer momento, com o pessoal

  de administração do CIAC estão listadas no seguinte:

  OPERATIONAL POINTS OF CONTACT

  Contact details, at which operational and administrative management can be contacted

  without undue delay, are listed in following document:

  Manual de Instruções e Procedimentos

  (Procedures and Instruction Manual)

  O presente documento certifica que a YXZ ESCOLA DE AVIAÇÃO S.A está autorizada a realizar
  a formação e qualificação de pilotos, comissários de voo, mecânicos de voo, despachantes
  operacionais de voo e mecânicos de

  manutenção aeronáutica postulantes a uma licença, habilitação ou certificado requeridos
  pelo RBAC nº 61, RBHA 63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65. , segundo o Regulamento
  Brasileiro de Aviação Civil (RBAC)

  nº 141, conforme definido nas Especificações de Instrução em anexo, de acordo com o Manual
  de Instruções e Procedimentos aceito e em conformidade com as demais normas, regulamentos
  e padrões estabelecidos pela Agência

  Nacional de Aviação Civil.This certificate certifies that YXZ ESCOLA DE AVIAÇÃO S.A

  is authorized to perform aeronaut training under the requirements of the Brazilian Civil
  Aviation Regulation (RBAC) nº 141, as defined in the attached instruction

  specifications, in accordance with the procedures and instruction manual and compliance
  with rules, requirement and standards established by the National Civil Aviation Agency
  - Brazil.

  Local e data da emissão

  (Place and date of issued)

  Rio de Janeiro, 26 de junho de 2019.

  Rio de Janeiro, June 26th, 2019.

  Nome, Título e Assinatura

  (Name, Title and Signature)

  Nome do GCOI

  Gerente de Certificação de Organizações de Instrução

  OperationalSafetySuperintendentData de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A'
