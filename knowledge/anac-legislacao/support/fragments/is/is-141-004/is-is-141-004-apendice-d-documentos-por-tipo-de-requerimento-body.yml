text: 'APÊNDICE D - Documentos por tipo de requerimento

  Tipo de Requerimento Composição sugerida do PSF Resultado esperado

  Aceitação ou aprovação

  de material técnico

  FAI, Manuais afetados, Programas de instrução afetados FOP dos manuais e programas aceitos
  ou aprovados

  Alteração de endereços FAI, Manuais afetados, Programas de Instrução afetados,

  Contrato Social (CIAC Sede), Alvará de Funcionamento

  EI revisada, certificado de CIAC revisado

  Alteração na frota do

  requerente

  FAI, Manuais afetados, Programas de instrução afetados,

  FOP para alteração na frota

  EI revisada, certificado de CIAC revisado (se houve

  alteração no tipo do CIAC), FOP dos manuais e

  programas aceitos ou aprovados

  Alteração no quadro de

  pessoal requerido

