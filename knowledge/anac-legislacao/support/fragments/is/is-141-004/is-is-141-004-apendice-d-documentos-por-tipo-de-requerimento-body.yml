  Certificado de CIAC e EI

  Credenciamento de

  Examinador

  FAI, Manuais afetados, Programas de instrução afetados,

  FOP para credenciamento de Examinador

  EI revisada, FOP dos manuais e programas aceitos ou

  aprovados, Ofício de Credenciamento de Examinador

  Exclusão de CIAC

  Satélite

  FAI, Manuais afetados, Programas de Instrução afetados EI revisada

  Inclusão de CIAC

  Satélite

  FAI, Manuais afetados, Programas de Instrução afetados,

  Alvará de Funcionamento

  EI revisada

  Inclusão, alteração ou

  exclusão de cursos ou

  programas de instrução

  FAI, Manuais afetados, Programas de Instrução afetados,

  FOP para inclusão ou exclusão de Coordenador de Curso

  EI Revisada, certificado de CIAC revisado (se houve

  alteração no tipo do CIAC), FOP dos manuais e

  programas aceitos ou aprovados

  Observação: a critério da ANAC poderão ser requeridos outros documentos não listados no
  quadro acima.'
