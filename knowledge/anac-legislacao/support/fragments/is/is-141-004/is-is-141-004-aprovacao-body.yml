title: Aprovação
text: 'Aprovação

  MGSO Manual de

  Gerenciamento

  da Segurança

  Operacional

  CIAC tipo 2 ou 3. Inclui a descrição, o

  planejamento e a execução do Sistema de

  Gerenciamento de Segurança Operacional

  (SGSO) do operador aéreo e o Plano de

  Resposta a Emergências, dentre outros

  requisitos.

  Aceitação

  MGQ Manual de

  Garantia da

  Qualidade

  Exceto instituições enquadradas no

  parágrafo 141.21(b). Apresenta garantias de

  que a instrução ministrada pelo CIAC atinja

  os objetivos propostos e que todos os

  procedimentos do CIAC se mantenham de

  acordo com os requisitos estabelecidos

  neste Regulamento. Referenciar à IS própria.

  Aceitação

  5.1.6.5.5. Cada manual ou programa deve ser acompanhado do respectivo FOP 407.

  5.1.6.5.6. Os CIAC tipo 2 e 3 estão sujeitos, em seu contexto de operação, à aplicabilidade,
  dentre

  outros, do RBAC nº 117 (gerenciamento de fadiga) e RBAC nº 120 (PPSP).

  5.1.6.5.7. Todo o conjunto de publicações de que trata o RBAC nº 141 será analisado no processo

  de certificação inicial.

  5.1.6.5.8. Visando a verificação da aderência, eficácia e efetividade dos manuais ou programas

  passíveis de aceitação, é previsto que o seu conteúdo e aplicação seja avaliado

  preferencialmente na fase 4, salvo por imposição de legislação específica sobre o tema,

  ou a critério da equipe de certificação.

  5.1.6.5.9. A qualquer momento, se a ANAC identificar que partes da publicação não são

  satisfatórias, o operador deverá revisar tais partes no prazo determinado pela Agência.Data
  de emissão: 24 de maio de 2019. IS nº 141-004

  Revisão A

  5.1.6.6. A emissão do FOP 405.2, encerra formalmente a fase 2 de certificação.

  5.1.7. Fase 3 - Avaliação de documentos

  5.1.7.1. A fase 3 tem como objetivo, a verificação de cumprimento dos requisitos regulamentares

  relacionados à solicitação do requerente por meio da análise dos formulários e

  documentos apresentados no PSF.

  5.1.7.2. Durante esta fase, na avaliação dos documentos, caso sejam encontradas não-

  conformidades nos manuais ou programas, o requerente será notificado por meio de um

  FOP 408, que deverá ser respondido por um FOP 409 no prazo máximo definido no item'
