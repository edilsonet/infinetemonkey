title: APÊNDICE C - ORIENTAÇÕES PARA ELABORAÇÃO DO MGSO
text: 'APÊNDICE C - ORIENTAÇÕES PARA ELABORAÇÃO DO MGSO

  C1.

  Recomenda-se que os CIAC adotem o modelo de MGSO disponibilizado pela ANAC, preenchendo
  os campos conforme necessário. Cada CIAC poderá adotar um formato próprio, desde que contemple
  todas as disposições contidas nesta IS.

  C2.

  O PRE deverá estar integrado em um dos capítulos do MGSO, não sendo necessário seu envio
  separadamente.

  C3.

  De modo a evitar que o documento fique desatualizado e demande constantes revisões, não
  é recomendada a inclusão no MGSO de datas precisas de planejamento e/ou realização de eventos
  promoção de segurança operacional, treinamentos, vistorias, auditorias, simulados etc. Quando
  pertinente, sugere-se, no máximo, indicar os períodos do ano (meses, bimestres, trimestres,
  semestres etc.) nos quais é planejada a realização de tais eventos. Assim, confere-se maior
  perenidade ao documento, fazendo com que o seu conteúdo seja aplicável de forma continuada
  após a aceitação do manual.

  C4.

  Não é necessário incluir no MGSO a comprovação de vínculo do GSO com o CIAC.

  C5.

  Recomenda-se que o CIAC acrescente dados e eventos de acordo com sua operação, como por
  exemplo, indicadores de desempenho da segurança operacional adicionais, níveis de tolerabilidade
  de risco, situações necessárias para gestão da mudança, eventos de promoção e treinamento,
  dentro outros.

  C6.

  O CIAC é encorajado a elaborar um MGSO que aprofunde e detalhe seu SGSO sem se limitar ao
  modelo proposto pela ANAC.

  C7. O

  modelo de MGSO proposto pela ANAC pode ser acessado em:

  https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-instrucao/formacao-e-qualificacao-de-pessoas/modelos-e-formularios'
