title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  O último relatório mensal requerido pela

  revisão A desta IS

  , referente ao mês de dezembro de 2024 deverá ser enviado até o dia 08 de janeiro de 2025,
  quinto dia útil do mês subsequente, com os indicadores previstos naquela revisão da IS.

  Os CIAC já certificados têm até o dia 31 de julho de 2025 para fazer e aprovar as adequações
  necessárias em seus MGSO para refletir as mudanças trazidas em esta revisão da IS. Importante
  notar que se o MGSO aprovado não é impactado pela presente versão da IS não é necessária
  sua revisão.

  Para os CIAC que ainda estejam em funcionamento conforme o antigo RBHA 141, caberá, durante
  o seu processo de certificação pelo novo regulamento, apresentar uma análise do faltante
  (

  Gap Analysis

  ), caso necessário. Durante a inspeção de fase 4, o CIAC deverá comprovar que possuí todos
  os componentes do SGSO implementados na organização.

  Já para os novos CIAC, um plano de implementação do SGSO deve ser apresentado durante o
  processo de certificação, prevendo o estabelecimento de todos os componentes do SGSO até
  a inspeção de fase 4.

  A ANAC disponibiliza e encoraja a utilização de materiais instrucionais relativos ao SGSO
  na página

  https://www.gov.br/anac/pt-br/assuntos/seguranca-operacional

  .

  Os casos omissos serão dirimidos pela SPL.'
