title: INTRODUÇÃO (OPCIONAL)
text: '1. INTRODUÇÃO (OPCIONAL)

  1.1 OBJETIVOS DO MANUAL DE GARANTIA DA QUALIDADE

  Não há modelo pré-definido para este item do manual, pois cada CIAC possui políticas específicas
  em

  relação às suas particularidades. Sugerimos apresentar neste item a formalização resumida
  dos objetivos

  (metas) e compromissos assumidos do SGQ perante ANAC.

  1.2 IDENTIFICAÇÃO DA EMPRESA

  [RAZÃO SOCIAL DO CIAC]

  [NOME FANTASIA DO CIAC]

  CNPJ: XX.XXX.XXX/0001-XX

  Autorização ANAC: (identificação do Ato Normativo publicado pela ANAC, com data)

  Telefone: (XX) XXXX-XXXX

  E-mail: xxxxxx@xxxx.com.br

  Site na internet: www.xxxx.com.br

  Localização:

  (sede do CIAC)

  Endereço: XXXXXXXXXXXXX

  Município / UF

  CEP: XX.XXX-XXX - Caixa Postal nº XX (se possuir)

  CIAC satélite: Endereço: XXXXXXXXXXXXX

  Município / UF

  CEP: XX.XXX-XXX - Caixa Postal nº XX

  E designativos ICAO dos aeródromos homologados que

  fizer uso.

  1.3 PESSOAL DE ADMINISTRAÇÃO

  GESTOR RESPONSÁVEL

  NOME: [NOME E SOBRENOME]

  CPF: XXX.XXX.XXX-XX

  TELEFONE /

  CELULAR: (XX) XXXX-XXXX / (XX) XXXX-XXXX

  E-MAIL: xxxxxx@xxxx.com.br

  GERENTE DA QUALIDADE (GQ)

  NOME: [NOME E SOBRENOME]

  CPF: XXX.XXX.XXX-XX

  TELEFONE /

  CELULAR: (XX) XXXX-XXXX / (XX) XXXX-XXXX

  E-MAIL: xxxxxx@xxxx.com.brData de emissão: 8 de julho de 2019 IS nº 141-006

  Revisão A

  1.4 ORGANOGRAMA

  [incluir o organograma do CIAC indicando apenas o cargo dos envolvidos, não sendo nominal.
  Devem

  constar, no mínimo, os cargos aplicáveis previstos na seção 141.61(b) do RBAC 141. No caso
  de CIAC com

  satélites, deve constar o organograma completo.'
