title: PROGRAMA DE AUDITORIA DA QUALIDADE
text: '4. PROGRAMA DE AUDITORIA DA QUALIDADE

  4.1 DESCREVER O PROGRAMA DE AUDITORIA DA QUALIDADE DESENVOLVIDO, CONFORME

  OBJETIVOS E ASPECTOS LISTADOS NO ITEM 5.2.8.3 DESSA IS.

  4.2 SEGUEM EXEMPLOS, NÃO OBRIGATÓRIOS, DE INDICADORES DE DESEMPENHO A SEREM

  MONITORADOS PELO CIAC EM AUDITORIAS DE SGQ:

  Indicadores do SGQ:

  - quantidade de alunos com nota de prova inferior ao estabelecido no Programa de Instrução

  para a sua aprovação.

  - quantidade de alunos que refizeram a prova e mantiveram a reprovação.

  - quantidade de alunos desistentes.

  - quantidade de alunos transferidos para outra escola.

  - quantidade de alunos transferidos de outra escola.

  - quantidade de avaliações insatisfatórias referente a cada Programa de Instrução de curso

  prático.

  - quantidade de reprovação em exame prático (cheque) referente a cada Programa de Instrução

  de curso prático.

  - média de horas para a realização do exame prático (cheque) referente a cada Programa de

  Instrução de curso prático.

  - possuir FOP 411 para cada Manual aceito.

  - possuir FOP 412 para cada Programa de Instrução aprovada.

  Indicadores de MGQ:

  Nota: considerar como indicadores os eventos observados e corrigidos ao que tange cada item

  “Cumprimento”, o que demonstra a implementação do SGQ.Data de emissão: 8 de julho de 2019
  IS nº 141-006

  Revisão A

  - cumprimento das auditorias independentes;

  - cumprimento das ações necessárias com vistas à Qualidade;

  Indicadores do MGSO:

  Nota: considerar como indicadores os eventos observados e corrigidos ao que tange cada item

  “Cumprimento”, o que demonstra a implementação do SGQ.

  - cumprimento de gestão de safety após recebimento de RAC.

  - ciência e aprovação do gestor responsável pelas ações de mitigação ou de paralização de

  operação e/ou determinadas atividades.

  - cumprimento do monitoramento dos indicadores de SGSO.

  - implementação de programas para atingimento de metas.

  - cumprimento das metas estabelecidas.

  - cumprimento do envio de relatórios mensais à ANAC.

  - cumprimento do prazo de 10 dias para envio de emenda à ANAC antes da entrada em vigor

  do Manual.

  - quantidade de alteração de GSO.

  Indicadores de MIP:

  Nota: considerar como indicadores os eventos observados e corrigidos ao que tange cada item

  “Cumprimento”, o que demonstra a implementação do SGQ.

  - cumprimento da capacitação dos instrutores antes de iniciar a instrução na entidade.

  - cumprimento da capacitação Periódica.

  - cumprimento da capacitação pós incidente/acidente de instrutor.

  - cumprimento do controle de capacitação e registros nas pastas individuais.

  - cumprimento do prazo de 10 dias para envio de emenda à ANAC antes da entrada em vigor

  do Manual.

  - pessoal da administração requerido cumpre com as atribuições e responsabilidades.

  - desvio das regras de operação do CIAC.

  Indicadores dos PROGRAMAS DE INSTRUÇÃO

  Nota: considerar como indicadores os eventos observados e corrigidos ao que tange cada item

  “Cumprimento”, o que demonstra a implementação do SGQ.

  - cumprimento do conteúdo programático.

  - cumprimento da carga horária.

  - cumprimento dos procedimentos/manobras previstos.

  - cumprimento dos registros necessários (fichas de instrução, diários de classe, certificado,

  matrícula, fichas de avaliação).

  - utilização de Programa de Instrução aprovado pela ANAC.Data de emissão: 8 de julho de
  2019 IS nº 141-006

  Revisão A'
