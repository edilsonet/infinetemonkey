title: 5(b)
text: 'b) a definição das partes e elementos do relatório, considerando, como exemplo tais

  pontos:

  I - objetivos da auditoria;

  II - escopo;

  III - período coberto da auditoria;

  IV - identificação da parte auditada;

  V - identificação da chefia e equipe de auditoria;

  VI - datas, locais;

  VII - critérios específicos da auditoria;

  VIII - constatações; e

  IX - conclusões; dentre outros;'
