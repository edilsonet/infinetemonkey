text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1. Disposições iniciais

  5.1.1. A finalidade do SGQ é aumentar a conscientização do CIAC sobre seus deveres e

  comprometimento em atender às necessidades e expectativas de seus clientes e partes

  interessadas, alcançando a satisfação em suas atividades de treinamento. Essa satisfação

  é atingida garantindo-se que a instrução ministrada atinja os objetivos propostos e que

  todos os procedimentos do CIAC se mantenham de acordo com os requisitos

  estabelecidos no RBAC nº 141.

  5.1.2. Assim, o SGQ objetiva avaliar e melhorar processos e procedimentos relacionados com

  as atividades de treinamento do CIAC por meio da identificação, prevenção, ou mesmo,

  minimização de questões relacionadas com suas atividades de instrução. Ao mesmo

  tempo permite verificar a adesão a padrões de qualidade e requisitos técnicos aplicáveis

  durante o desenvolvimento dessas atividades por meio de pontos de verificação e

  controles estabelecidos.

  5.1.3. Como requerido pela seção 141.29 do RBAC nº 141, o SGQ é a formulação e reunião de

  políticas, processos, procedimentos e recursos requeridos e associados com a condução

  das atividades de treinamento do CIAC, que atinjam e mantenham os mais elevados

  padrões de qualidade e requisitos técnicos aplicáveis. Os processos e procedimentos

  configuram-se como medidas de controle de qualidade que servem como guia para a

  condução de tais atividades, assim como referências para verificação da efetividade e

  adequação dos processos do CIAC.Data de emissão: 8 de julho de 2019 IS nº 141-006

  Revisão A

  5.1.4. Determinadas instruções e procedimentos que orientem os integrantes do CIAC no

  desempenho adequado de suas atividades, assim como determinam suas obrigações e

  responsabilidades, podem estar dispostos no MIP sem prejuízo da elaboração do MGQ,

  desde que haja a devida correlação do(s) processo(s) e/ou procedimento(s).

  5.1.5. O(s) auditor(es) selecionado(s) para o programa de auditorias independentes não pode(m)

  estar envolvido(s) com as áreas ou atividades a serem auditadas. Não é proibido utilizar

  auditores do próprio CIAC para a realização das auditorias independentes, no entanto, o

  CIAC deve garantir, por meio de procedimentos apropriados, que as pessoas diretamente

  responsáveis pelas áreas a serem auditadas não sejam selecionadas como parte da equipe

  de auditoria.

  5.1.6. Caso sejam utilizados auditores de um departamento de qualidade independente ou

  mesmo haja a contratação de outro CIAC ou pessoa para desempenhar tal atividade,

  conforme o parágrafo 141.29(b)(3) do RBAC nº 141, tal condição deve estar claramente

  disposta no MGQ.

  5.1.7. O CIAC deve adaptar as orientações aqui propostas conforme a complexidade das suas

  atividades.

  5.2. Manual de garantia da qualidade

  5.2.1. Determinadas partes do MGQ são textuais, ou seja, trazem termos e/ou afirmações para

  atendimento aos requisitos aplicáveis. No entanto, a formatação do MGQ pode trazer

  tabela de referência e/ou outro meio que elenque toda cadeia de eventos, ou seja, os

  processos e procedimentos em ordem lógica que culminem e/ou contribuam para a

  execução das atividades de instrução do CIAC e que atinjam o objetivo do SGQ.

  5.2.1.1. A proposta de formatação acima visa facilitar o uso do MGQ por parte dos funcionários

  do CIAC e favorece possíveis revisões dos processos e procedimentos associados de

  forma prática e independente.

  5.2.2. A edição dos processos e procedimentos no MGQ e de algum outro documento associado

  deve evitar a cópia dos requisitos regulamentares, devendo dispor ações e/ou tarefas

  existentes para cumprimento da condição ou informação dos requisitos do RBAC nº 141

  e desta IS. Desta forma, preferencialmente, os textos a serem elaborados para compor os

  procedimentos devem, ao menos, destacar os seguintes elementos:'
