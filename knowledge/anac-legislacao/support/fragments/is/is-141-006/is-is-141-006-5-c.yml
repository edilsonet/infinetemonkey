text: 'c) o CIAC só poderá ministrar instrução se uma auditoria de todo o SGQ tiver sido

  realizada nos últimos 12 meses calendáricos.Data de emissão: 8 de julho de 2019 IS nº 141-006

  Revisão A

  Nota: instruções eventualmente ministradas, para além do período de 12 meses calendáricos
  da

  realização da última auditoria, sujeitará o CIAC a providências administrativas da ANAC,

  porém não necessariamente invalidará as instruções realizadas no período, caso a ANAC

  entenda que seja provável que o nível de qualidade da instrução não tenha sofrido

  deterioração significativa.

  5.2.8.3.4. Os procedimentos de planejamento e preparação das auditorias deve considerar,
  no

