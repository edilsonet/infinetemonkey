text: 'e) V - Registros do SGQ.

  5.2.5. Com o propósito de promover a implementação do SGQ de modo compatível com os

  diferentes contextos do CIAC, o sistema deve ser adequado ao porte de cada organização

  e à complexidade das atividades desenvolvidas.

  5.2.6. Ressalta-se que o escopo do SGQ deve abranger todas as atividades do CIAC aprovadas

  ou autorizadas pela ANAC, assim como processos e procedimentos associados a elas.

  Quaisquer modificações nas atividades devem desencadear a revisão do SGQ e sua

  adequação, conforme necessário.

  5.2.7. O CIAC pode considerar informações e subsídios do SGSO, conforme seção 141.27 do

  5.2.8. Visando o atendimento da seção 141.29 do RBAC nº 141, a elaboração do MGQ deve

  considerar, para cada ponto do item 5.2.4 desta IS, os elementos elencados nos subitens

  abaixo.

  5.2.8.1. Elemento I - Política da qualidade. Deve ser considerada a definição de uma política
  de

  qualidade, que:'
