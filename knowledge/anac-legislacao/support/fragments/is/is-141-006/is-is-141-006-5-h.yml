title: 5(h)
text: 'h) a revisão e melhoria contínua das políticas, processos e procedimentos do SGQ por

  meio da utilização das informações e registros disponíveis.

  5.2.8.5. Elemento V - Registros do SGQ.

  5.2.8.5.1. Deve haver a descrição de um processo que defina os controles necessários para
  a

  identificação, armazenamento, proteção, recuperação, retenção e disposição dos dados de

  qualidade de forma clara, precisa, completa e facilmente acessível.

  5.2.8.5.2. Deve haver a constituição de um sistema de informação essencial que permita a
  análise e

  determinação da causa raiz de condições e/ou não-conformidades a fim de determinar as

  áreas onde pode ocorrer falhas ou o não cumprimento de requisitos para que sejam

  tomadas as ações necessárias.

  5.2.8.5.3. O relatório final das auditorias independentes realizadas no CIAC deve ser emitido
  até 1

  mês calendárico depois do fim do ciclo das auditorias independentes.

  5.2.8.5.4. Os dados relevantes para o SGQ, assim como o relatório final das auditorias

  independentes realizadas, devem ser mantidos no CIAC por, no mínimo, 60 meses

  calendáricos.

  5.2.8.5.5. O CIAC deve disponibilizar à ANAC os registros do SGQ, sempre que solicitado.

  5.3. Relatório do SGQ

  5.3.1. O CIAC deve encaminhar relatório das auditorias independentes à GTOF por meio do

  Sistema Eletrônico de Informação (SEI!) no site da ANAC:

  https://www.anac.gov.br/acesso-a-informacao/protocolo-eletronico/

  5.3.2. Para envio do relatório, deverá ser escolhido no SEI o tipo de processo:

  CERTIFICAÇÃO RBAC 141: Relatório de SGQ, e documento: RBAC 141 -Data de emissão: 8 de julho
  de 2019 IS nº 141-006

  Revisão A

  Relatório de SGQ. Não será aceito o envio dos relatórios por outro meio, sendo o modelo

  disposto no SEI! aquele previsto para uso pelo CIAC.

  5.3.3. Apenas o gestor responsável, o gerente da qualidade ou um terceiro devidamente indicado

  em instrumento de procuração podem encaminhar o relatório das auditorias

  independentes por meio do SEI!.

  5.3.4. Um relatório deve ter sido encaminhado nos últimos 13 meses calendáricos para que
  o

  CIAC possa ministrar instrução prevista nas suas EI.

  Nota: instruções eventualmente ministradas, para além do período de 13 meses calendáricos
  do

  envio do último relatório, sujeitará o CIAC a providências administrativas da ANAC,

  porém não necessariamente invalidará as instruções realizadas no período, caso a ANAC

  entenda que seja provável que o nível de qualidade da instrução não tenha sofrido

  deterioração significativa.

  5.3.5. Caso o CIAC necessite retificar alguma informação constante em um relatório

  encaminhado à ANAC, este deverá encaminhar um novo relatório referente ao período a

  ser corrigido.

  5.3.6. Registros dessas auditorias independentes que contenham informações sobre não-

  conformidades regulamentares que tenham sido identificadas e resolvidas pelo próprio

  CIAC, antes de uma fiscalização da ANAC, não serão objetos de autos de infração, em

  acordo com o § 2º do art. 88-I da Lei nº 7.565/1986 (CBA).

  5.3.7. O não envio das informações requeridas nos prazos estabelecidos pode indicar falha
  no

  gerenciamento da qualidade por parte do CIAC, podendo levar à suspensão de instruções

  autorizadas nas especificações de instrução.

  5.4. Critérios para designação do gerente da qualidade

  5.4.1. O CIAC deve designar um profissional que possua competências específicas para lidar

  com a implementação e execução do SGQ do CIAC para a função de gerente da

  qualidade.

  5.4.2. Para atender ao disposto na seção 141.61(o) do RBAC nº 141, o candidato a gerente
  da

  qualidade deve evidenciar à ANAC ter participado com aproveitamento em cursos da área

  de gestão da qualidade.

  5.4.3. Os cursos listados abaixo, ou similares, são considerados aceitáveis pela ANAC:'
