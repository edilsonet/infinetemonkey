title: DISPOSIÇÕES FINAIS
text: '7. DISPOSIÇÕES FINAIS

  7.1. O SGQ é dispensável ao CIAC que ministra apenas curso prático para piloto de balão

  livre, curso prático para piloto de planador, curso prático para licença de piloto privado

  e/ou curso prático de piloto aerodesportivo.

  7.2. O modelo de MGQ constante no Apêndice A contempla as disposições previstas nesta

  IS. Sua utilização é recomendada, sendo permitido ao CIAC a utilização de formato e

  conteúdo próprios, desde que contemple todas as disposições contidas nesta IS e no

  7.3. No caso de revisões do MGQ, o mesmo deverá ser encaminho à ANAC conforme

  procedimentos e formulários previstos na IS nº 141-004.

  7.4. Conforme previsto na seção 141.29 do RBAC nº 141, o requerente ou detentor de

  certificado de CIAC deverá possuir um SGQ implementado.

  7.5. A entrada em vigor de um MGQ não depende de aprovação prévia da ANAC.

  7.6. Quaisquer emendas realizadas no MGQ devem ser encaminhadas à ANAC em, no

  mínimo, 10 (dez) dias corridos antes da data prevista para sua entrada em vigor, que deve

  estar explícita no MGQ.

  7.7. Uma vez encaminhado o MGQ, o CIAC terá mais 6 meses calendáricos para realizar a

  sua primeira atividade de auditoria independente segundo esta IS.

  7.8. O CIAC que possuir uma certificação ISO 9001 que abranja os cursos requeridos pelo

  tendo um SGQ implementado para efeitos de cumprimento da seção 141.29 do RBAC nº

  141, bastando apenas demonstrar que a sua certificação está e esteve válida durante os

  períodos em que ministrou instruções.

  7.8.1. O manual da qualidade produzido no âmbito da certificação ISO 9001 vale como MGQ

  e deve ser encaminhado para a ANAC, assim como suas emendas em, no mínimo, 10

  (dez) dias corridos antes da data prevista para sua entrada em vigor, em cumprimento ao

  parágrafo 141.29(d) do RBAC nº 141.

  7.8.2. As renovações periódicas da certificação ISO 9001 devem ser reportadas à ANAC, em

  cumprimento ao parágrafo 141.29(c)(1)(ii) do RBAC nº 141.

  7.9. Os casos omissos serão dirimidos pela SPO.

  7.10. Esta IS entra em vigor na data de sua publicação.Data de emissão: 8 de julho de 2019
  IS nº 141-006

  Revisão A'
