text: 'APÊNDICE A - MODELO DE MANUAL DE GARANTIA DA QUALIDADE

  A1 Recomenda-se que seja adotado o presente modelo de MGQ pelo CIAC, preenchendo os

  campos conforme necessário. O CIAC poderá adotar um formato próprio, desde que

  contemple todas as disposições contidas nesta IS e no RBAC nº 141.

  A2 O CIAC é encorajado a elaborar um MGQ que aprofunde e detalhe seu SGQ sem se

  limitar ao modelo proposto neste Apêndice.

  A3 Não é necessário incluir no MGQ a previsão de envio dos relatórios à ANAC. Tal

  previsão já consta no RBAC nº 141 e nesta IS.

  A4 Não é necessário incluir no MGQ a comprovação de vínculo do GQ com o CIAC.

  A5 Recomenda-se que o CIAC apresente a correlação entre seu SGSO e seu SGQ.Data de emissão:
  8 de julho de 2019 IS nº 141-006

