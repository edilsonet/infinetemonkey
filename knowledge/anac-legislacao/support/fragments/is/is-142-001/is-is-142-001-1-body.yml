title: OBJETIVO
text: '1. OBJETIVO

  Oferecer a um requerente de Certificado de Centro de Treinamento de Aviação Civil (CTAC)

  e de suas respectivas Especificações de Treinamento, um método de cumprimento dos

  requisitos que regem a certificação e o funcionamento de CTAC para que se solicite, emita,

  emende, suspenda, revogue ou casse um certificado de CTAC e suas respectivas

  Especificações de Treinamento de acordo com os requisitos estabelecidos pelo RBAC 142.'
