text: '11. MODELOS DE FORMULÁRIOS E MODELOS DE CURRÍCULOS

  11.1. Disposições gerais

  11.1.1. O formulários FOP-CT e os modelos de currículos apresentados neste capítulo têm
  por

  finalidade padronizar o fluxo de informações dos usuários da aviação civil para a ANAC,
  e

  vice-versa, assim como padronizar o fluxo de informações entre setores internos da ANAC,
  a

  fim de agilizar o processo de certificação.

  11.1.2. Os respectivos modelos de formulários e currículos, em sua versão mais atualizada,
  estão

  disponíveis para o usuário em formato “.doc”, no site da ANAC na rede mundial de

  computadores, no endereço eletrônico http://www2.anac.gov.br/biblioteca/formularioSSO.asp'
