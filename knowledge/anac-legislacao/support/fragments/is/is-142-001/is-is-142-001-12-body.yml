text: '12. DISPOSIÇÕES FINAIS

  12.1. Todos os requerentes que estejam em processo de certificação iniciado antes da data
  de

  publicação desta IS, mas não finalizados, poderão dar continuidade a seu processo sem adesão

  à todas as instruções e procedimentos desta IS.

  12.2. Os casos omissos serão dirimidos pelo SPO.

  12.3. Esta IS entra em vigor na data de sua publicação.11 de julho de 2014 IS Nº 142-001

  Revisão A'
