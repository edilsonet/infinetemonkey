title: 142.21(a)
text: 'a) A edição de cada manual ou algum outro documento a ser enviado deve evitar a cópia

  dos requisitos regulamentares. O manual ou algum outro documento a ser enviado deve

  dispor os procedimentos existentes para cumprimento da condição ou informação

  disposta nos requisitos do RBAC. Desta forma, preferencialmente, os textos a serem

  elaborados para comporem os procedimentos devem, ao menos, destacar os seguintes

  elementos:'
