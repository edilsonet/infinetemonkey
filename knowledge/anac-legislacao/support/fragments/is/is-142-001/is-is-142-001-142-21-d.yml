title: 142.21(d)
text: 'd) A ROP somente será considerada bem sucedida se a equipe do setor pertinente da ANAC

  e todos os representantes do requerente estiverem convencidos de que compreenderam

  plenamente suas responsabilidades e o processo de certificação a ser conduzido pelo setor

  pertinente da ANAC.'
