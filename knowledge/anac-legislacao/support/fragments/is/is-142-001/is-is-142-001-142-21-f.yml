title: 142.21(f)
text: 'f) Outros documentos ou manuais solicitados pelo gerente do projeto de certificação,

  durante a ROP ou a critério do requerente.

  6.5.3. Fase 3 - Avaliação de documentos

  6.5.3.1. Depois da aceitação do PSF para análise, os inspetores designados para compor a
  equipe de

  certificação darão início a uma avaliação aprofundada de todos os manuais e documentos

  exigidos pelo setor pertinente da ANAC e que foram apresentados pelo requerente.

  6.5.3.2. Os manuais e documentos requeridos serão aqueles dispostos conforme a Seção 8 desta
  IS.'
