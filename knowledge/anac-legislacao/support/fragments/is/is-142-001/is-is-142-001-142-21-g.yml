cite: 142.21(g)
title: 142.21(g)
text: 'g) A aceitação dos documentos pelo setor pertinente da ANAC indica que o requerente
  pode

  proceder à Fase 2 do processo de certificação, conforme o item 6.5.2 desta IS, e será feita

  por meio de ofício enviado ao requerente. A partir deste momento, o requerente deverá

  proceder à elaboração de todos os manuais e demais documentos requeridos para a

  certificação, conforme Seção 142.21 do RBAC 142 e instruções e procedimentos desta

  IS.'
