title: 142.21(h)
text: 'h) Reuniões adicionais poderão ser solicitadas pelo gerente do projeto de certificação
  ou

  pelo requerente ao longo de todo o processo de certificação.

  6.5.2. Fase 2 - Solicitação formal

  6.5.2.1. Em atendimento aos parágrafos 142.7(a); e 142.7(b) do RBAC 142, uma solicitação
  formal

  para obtenção de certificado de CTAC e de suas respectivas Especificações de Treinamento
  é

  realizada mediante protocolo de FOP-CT 104 devidamente preenchido com os devidos

  anexos, compondo o PSF.11 de julho de 2014 IS Nº 142-001

  Revisão A'
