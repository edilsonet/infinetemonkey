title: 142.21(i)
text: 'i) “O que deve ser feito” (em termos de procedimento, para atingir o requisito

  regulamentar);

  ii) “Por quem” (classe de funcionário que desempenhará o procedimento);11 de julho de 2014
  IS Nº 142-001

  Revisão A

  iii) “Como” (etapas e tarefas a serem desempenhadas no procedimento); e

  iv) “Em qual oportunidade/momento tal(is) procedimento(s) deve(m) ser

  desempenhado(s)” (etapa dentro da cadeia de atividades da organização).

  6.5.3.3. O envio de cada volume do conjunto de manuais e documentos do requerente deverá
  ser

  encaminhado para protocolo na ANAC, por meio de FOP-CT 107 exclusivo com referências

  ao número do processo já informado. Caso o manual ou algum outro documento for

  considerado incompleto, deficiente, ou ainda, se for detectada alguma não conformidade nos

  procedimentos propostos com os regulamentos, o requerente será devidamente notificado por

  meio do FOP-CT 124. As devidas correções deverão ser entregues ao setor pertinente da

  ANAC pelo requerente, por meio do FOP-CT 125, para o bom andamento e conclusão das

  etapas seguintes do processo de certificação.

  6.5.3.4. Se os manuais e programas forem considerados satisfatórios, eles serão aceitos
  ou aprovados,

  conforme o caso, por meio do FOP-CT 111(anexo 1.8), emitido exclusivamente para cada

  documento avaliado, à medida que os inspetores forem encerrando seus trabalhos de

  avaliação. No caso do PT, a aprovação será considerada inicial a partir da sua aprovação
  por

  meio do FOP-CT 111, até que seja concluída a demonstração da eficácia do treinamento,

  quando será emitida sua aprovação final.

  6.5.3.5. A aceitação ou aprovação concedida individualmente ao manual ou algum outro documento

  analisado não implica em aceitação ou aprovação final de parte ou de todo o PSF. Tampouco

  é garantia que o requerente concluiu a Fase 3 do processo de certificação, ou que receberá
  seu

  certificado de CTAC e respectivas Especificações de Treinamento. A aceitação ou aprovação

  emitida somente terá caráter de aprovação ou aceitação final após a conclusão da Fase 5
  do

  processo de certificação.

  6.5.3.6. Após as avaliações realizadas nesta fase, a declaração de conformidade inicial
  evolui para a

  declaração de conformidade final. Esta última deve estar aprovada ao final da fase de

  avaliação de documentos, a fim de garantir que cada requisito regulamentar aplicável à

  operação de treinamento pretendida foi adequadamente tratado pelos manuais e demais

  documentos apresentados pelo requerente.

  6.5.3.7. A aprovação e aceitação de todos os manuais e documentos representa a conclusão
  da Fase 3

  do processo de certificação. O gerente de projeto então informará a sua conclusão por meio
  de

  ofício ao requerente. Com isso, o requerente deverá estar preparado para proceder às

  demonstrações requeridas na Fase 4 do processo de certificação, conforme o descrito no item'
