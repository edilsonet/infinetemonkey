  .h Aeronaves utilizadas (Aircraft Authorization)

  O detentor deste certificado está autorizado a conduzir treinamento, exame e verificação
  de proficiência

  conforme aprovado no seu Programa de Treinamento nas seguintes aeronaves:

  (The certificate holder is authorized to conduct training, testing, and/or checking, as
  described in their approved

  training program, in the following aircraft.)

  Fabricante

