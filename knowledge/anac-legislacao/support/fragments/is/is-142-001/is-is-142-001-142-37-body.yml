  .k Instrutores (Instructors)

  O detentor deste certificado deve manter uma lista de instrutores aprovados em cada centro
  satélite e

  remoto (.f).

  (The certificate holder shall maintain a current list of instructors approved for use in
  each satellite and remote

  training center (.f)

  O detentor deste certificado deve prover uma cópia de cada lista na sede principal do CTAC.

  (The certificate holder shall provide a copy of this list to the principal Training Center.)

  Esta listagem deve incluir informações de tipo de aeronave, curso específico e localização
  de onde atua

  para cada instrutor autorizado a conduzir treinamentos (.j).

  (This listing shall include the aircraft type, specific curriculum and location where operates
  in which each instructor is

  authorized to conduct training. (.j))

  O detentor deste certificado deve prover à sede principal do CTAC atualizações da lista
  de instrutores.

  (The certificate holder shall provide, to the CHDO, updates to the instructor listing.)

  .l Examinadores Credenciados (Designated Evaluators)

  O detentor deste certificado está autorizado a conduzir atividades sob o RBAC 142 utilizando

  examinadores credenciados. Somente os examinadores autorizados pela ANAC, afiliados ao centro
  de

  treinamento e identificados na listagem são autorizados a conduzir avaliações para o centro
  de

  treinamento.

  (The certificate holder is authorized to conduct operations under RBAC 142 using designated
  evaluators. Only those

  ANAC authorized evaluators, affiliated with the training center, are authorized to conduct
  evaluations for the training

  center.)

  O detentor deste certificado deve manter uma lista de examinadores credenciados aprovados
  em cada

  centro satélite e remoto (.f).

  (The certificate holder shall maintain a current list of designed examiners approved for
  use in each satellite and

  remote training center (.f)

  O detentor deste certificado deve prover uma cópia de cada lista na sede principal do CTAC.

  (The certificate holder shall provide a copy of this list to the principal Training Center.)

  Esta listagem deve incluir informações de tipo de aeronave, curso específico e localização
  de onde atua

  cada examinador credenciado autorizado a conduzir avaliações (.j).

  (This listing shall include the aircraft type, specific curriculum and location where operates
  in which each authorized

  designed evaluator to conduct evaluations (.j))

