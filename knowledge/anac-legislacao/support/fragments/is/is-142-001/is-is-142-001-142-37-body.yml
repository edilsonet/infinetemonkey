  .i Dispositivos de treinamento para simulação de voo utilizados (Flight Simulators Authorization)

  O detentor deste certificado está autorizado a conduzir treinamentos, exames e/ou verificações
  de

  proficiência, conforme aprovado no seu Programa de Treinamento, nos seguintes simuladores
  de voo

  pertencentes ao próprio centro ou utilizados sob contrato.

  (The certificate holder is authorized to conduct training, testing, and/or checking activities,
  as described in the

  approved training program, in the following flight simulators by using his own flight simulator
  or under contract.)

  O uso do simulador de voo é exclusivo, por períodos de tempo e localização aprovada pela
  ANAC

  conforme listagem abaixo.

  (The use of flight Simulator is exclusive by periods of time and location approved by ANAC
  following list below.)

  O detentor deste certificado deve garantir que o simulador se mantém qualificado e validado
  pela ANAC e

  com sua manutenção e controle operacional garantidos por seu proprietário.

  (The certificate holder must ensure that the flight simulators remains qualified and validated
  by ANAC and with its

  maintenance and operational control assured by the flight training device owner.)11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  O detentor deste certificado deve informar a ANAC antes de conduzir qualquer treinamento,
