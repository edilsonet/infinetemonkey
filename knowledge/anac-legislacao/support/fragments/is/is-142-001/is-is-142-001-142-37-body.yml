  .j Atividades de treinamento autorizadas - Currículo Base e Currículo Especializado.

  (Authorized Training Activities - Core Curriculum and Specialty Curriculum)

  O detentor deste certificado está autorizado a conduzir os seguintes treinamentos, conforme
  aprovado no

  seu Programa de Treinamento:

  (The certificate holder is authorized to conduct the following training as authorized in
  their Approved Training

  Program:)

  O detentor deste certificado deve garantir e certificar que cada aluno dos cursos listados
  nas tabelas J1, J2

  e J3 são elegíveis e detêm os requisitos de experiência aeronáutica das regulamentações
  aplicáveis antes

  de iniciar qualquer treinamento ou exame associado ao currículo. Esta certificação deve
  estar disposta nos

  registros de treinamento dos alunos.

  (The certificate holder shall ensure and certify that each applicant entered into the authorized
  core curriculums listed

  in Table J1, J2 and J3 meets the aeronautical experience requirements of the applicable
  regulation(s) prior to

  beginning any training or testing associated with the assigned curriculum. Such certification
  shall be placed in the

  trainee’s training records.)

