text: 'a) Deve ser apresentado o contrato com o fabricante da aeronave, dispositivo de treinamento

  de simulação de voo, como anexo ao MIP, com a finalidade de garantir os requisitos

  dispostos nos parágrafos 142.25(a) e 142.25(e) do RBAC 142.

  8.2.6.10. A apresentação do sistema de garantia da qualidade proposto, em concordância com
  a Seção'
