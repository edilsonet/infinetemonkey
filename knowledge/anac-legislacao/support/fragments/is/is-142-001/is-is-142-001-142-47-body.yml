text: '142.47 e Subparte C do RBAC 142.

  8.2.2. A estrutura do MIP deve ser de fácil entendimento, contendo informações que sejam

  claramente identificadas por meio de títulos e formatos adequados. A estrutura do MIP deve

  estar identificada desde o início, com uma explicação sobre os elementos utilizados para
  sua

  organização, tais como volumes, títulos e seu esquema de numeração, as partes principais
  dos

  volumes, anexos e outros recursos de codificação e agrupação.

  8.2.2.1. A linguagem simples deve ser utilizada, se possível, desde o início. A terminologia
  utilizada

  para determinados elementos ou procedimentos deve ser mantida igual em todo o MIP,

  evitando qualquer mal entendido ou confusão. A terminologia deve ser clara e de fácil

  entendimento, assim como o estilo da escrita, formatação, utilização de gráficos e símbolos,

  devendo ser concordante em todo o MIP.

  8.2.3. O MIP deve incluir um glossário de termos, siglas e abreviaturas e definições associadas.
  O

  glossário deve ser atualizado de maneira regular para assegurar a utilização de terminologias

  recentes em concordância com o disposto no item 7.3.4 desta IS.11 de julho de 2014 IS Nº
  142-001

  Revisão A

  8.2.4. O MIP deve ser um meio eficaz para orientar o pessoal envolvido com as atividades
  do CTAC

  que assegure, da melhor maneira possível, por meio das instruções e procedimentos dispostos,

  o desempenho adequado das atividades operacionais de treinamento.

  8.2.5. O MIP deve determinar de forma clara e precisa as obrigações e responsabilidades
  de cada um

  dos integrantes do CTAC - a fim de se manter um nível de qualidade do treinamento - assim

  como deve especificar as políticas, objetivos e procedimentos que, inclusive, se relacionem

  com o sistema de garantia de qualidade e o Sistema de Gerenciamento da Segurança

  Operacional (SGSO).

  8.2.5.1. Deve desta forma dispor aspectos que, por sua importância, devem ser de conhecimento
  do

  gestor responsável e de todos os funcionários do CTAC.

  8.2.6. Visando o atendimento das seções 142.21 e 142.27 do RBAC 142, a elaboração do MIP
  deve

  considerar os seguintes itens, a saber:

  8.2.6.1. A descrição da estrutura organizacional do CTAC que considere, pelo menos, todo
  o pessoal

  disposto na Seção 142.43 do RBAC 142, onde exista referência direta com os seguintes

  elementos:'
