cite: 142.47(f)
title: 142.47(f)
text: 'f) distinção de localização, conforme especificado no certificado de CTAC e respectivas

  especificações de treinamento, se considerando a Seção 142.37 do RBAC 142.

  8.2.6.5. A apresentação do PT proposto, seus currículos, cursos e segmentos associados,
  assim como

  de todos os aspectos dispostos no parágrafo 142.25(f) do RBAC 142. Destaca-se que esta

  apresentação pode ser feita em volume separado, conforme item 8.1 desta IS, utilizando-se
  as

  informações pertinentes do item 8.3 desta IS para sua composição.'
