cite: 142.47(i)
title: 142.47(i)
text: 'i) O MIP deve ser revisado e examinado considerando-se aspectos realísticos e

  operacionais do CTAC antes de sua utilização. Este processo deve considerar a

  utilização de aspectos críticos da informação, a fim de verificar sua efetividade.

  Além disso, uma interação rotineira de grupos dentro do CTAC deve ser considerada

  dentro de tal processo.

  ii) A revisão final do MIP deve assegurar que todos os temas requeridos tenham sido

  desenvolvidos com um nível adequado de detalhe aos usuários. Também deve

  assegurar o cumprimento dos requisitos estabelecidos relacionados com a

  padronização operacional da ANAC, recomendações do fabricante das aeronaves e11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  dispositivos para simulação de voo utilizados, além da filosofia, políticas, processos

  e procedimentos específicos do CTAC.

  iii) No que se refere às alterações do MIP, o CTAC deve desenvolver uma sistemática

  adequada de controle para a coleta de informações, estudo e distribuição que permita

  processar informações obtidas de diversas fontes relacionadas com a organização e

  dispô-las em prática. As fontes não estão limitadas somente à ANAC, devendo

  considerar os diversos requisitos operacionais e de segurança dos fabricantes e dos

  provedores das aeronaves e dispositivos para simulação de voo utilizada.

  8.2.6.9. A apresentação de procedimentos relacionados com a identificação e controle de
  todo o

  material instrucional disponibilizado para o pessoal de instrução, exame e alunos elaborado
  e

  utilizado pelo CTAC para consecução do PT.'
