cite: 142.49(a)
title: 142.49(a)
text: 'a) Quando forem utilizados auditores externos é essencial que o especialista comprove
  que

  está familiarizado com as atividades operacionais de treinamento conduzidos pelo CTAC

  auditado.

  8.5.7.2. Quando a estrutura e dimensões do CTAC não justificarem o estabelecimento de auditores
  em

  período integral, as funções de auditoria podem ser realizadas com pessoal em tempo parcial

  do próprio CTAC ou de serviço externo, sendo neste último caso mediante termos de contrato

  e procedimentos claramente dispostos no MIP ou volume do sistema de garantia da qualidade.

  8.5.8. Uma capacitação adequada e completa é indispensável para melhorar e aperfeiçoar a

  qualidade de um CTAC. Para se garantir resultados apropriados a esta instrução, o CTAC

  deve assegurar-se que todos os funcionários compreendam os objetivos da qualidade

  estabelecidos no MIP ou volume do sistema de garantia da qualidade.

  8.5.8.1. Os responsáveis pela gestão do sistema de garantia da qualidade devem receber instrução
  que

  considere, no mínimo, os seguintes temas:'
