  segurança operacional do detentor do certificado.

  8.4.10. O elemento “gestão da mudança” do CTAC deve:

  8.4.10.1. desenvolver e manter processos para identificar as mudanças que possam afetar
  a segurança

  operacional do detentor de certificado; e

  8.4.10.2. gerenciar os riscos decorrentes dessas mudanças.

  8.4.11. O elemento “melhoria contínua do SGSO” do CTAC deve:

  8.4.11.1. estabelecer e manter processos para monitorar a eficácia do seu SGSO; e11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  8.4.11.2. buscar, de forma contínua, a melhora do desempenho da segurança operacional.

  8.4.12. O elemento “treinamento e qualificação” do CTAC deve:

  8.4.12.1. desenvolver um programa de treinamento específico que assegure que o pessoal do
  detentor

  do certificado esteja adequadamente qualificado e treinado para exercer as funções e

  atribuições estabelecidas pelo SGSO;

  8.4.12.2. adequar o conteúdo e a carga horária do treinamento para cada função prevista
  pelo SGSO.

