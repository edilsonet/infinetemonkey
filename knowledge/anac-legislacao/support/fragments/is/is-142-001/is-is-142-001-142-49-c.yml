text: 'c) descrição de diferente metodologia apropriada que garanta o monitoramento do

  desempenho do aluno durante o treinamento.

  8.3.7. A declaração relacionada aos requisitos do parágrafo 142.25(f)(12) do RBAC 142 deve
  ser

  feita no MIP, conforme item 8.2.6.13 desta IS.

  8.3.8. A disposição dos requisitos do parágrafo 142.25(g) do RBAC 142 deve ser feita no
  MIP,

  conforme item 8.2.8 desta IS.

  8.3.9. Para a devida composição de determinados cursos de um currículo especializado, deve
  haver

  a especificação dos requisitos e demais aspectos específicos contidos em Instruções de

  Aviação Civil (IAC), Instruções Suplementares (IS) e demais legislações aplicáveis a tais

  treinamentos específicos que não sejam requeridos pelos RBHA 63, 65 e 91, ou RBAC que

  venham a substituí-los, e pelos RBAC 61, 121 e 135. (exemplo: artigos perigosos, Corporate-

  CRM, RNAV e RNP, treinamento de aeronaves específicas, entre outros.)

  8.4. Sistema de gerenciamento de segurança operacional - SGSO

  8.4.1. O SGSO do CTAC deve respeitar a estrutura de 12 elementos distribuídos em 4 componentes,

  conforme Subparte E do RBAC 142 e itens 8.4.1.2 a 8.4.1.5 desta IS.

  8.4.1.1. Quando se tratar da apresentação de quaisquer procedimentos requeridos deste item
  8.4, os

  mesmos devem ser dispostos conforme orientações do item 6.5.3.2.

  8.4.1.2. Política e objetivos de Segurança Operacional, considerando os seguintes itens:'
