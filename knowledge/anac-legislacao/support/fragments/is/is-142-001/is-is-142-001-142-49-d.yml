title: 142.49(d)
text: 'd) explicar porque são introduzidos ou modificados procedimentos operacionais.

  8.4.14. O Manual de Gerenciamento de Segurança Operacional (MGSO) é o documento que

  concentra as diretrizes, regras, processos e procedimentos que estruturam o SGSO do CTAC
  e

  as seguintes disposições se aplicam:11 de julho de 2014 IS Nº 142-001

  Revisão A

  8.4.14.1. o MGSO deve descrever a política e objetivos da segurança operacional do detentor
  de

  certificado, bem como os processos adotados para a garantia dessa segurança durante a

  realização de suas atividades diárias;

  8.4.14.2. o MGSO deve apresentar os compromissos do gestor responsável de um detentor e/ou

  requerente de um certificado em relação à implantação e operação de seu SGSO;

  8.4.14.3. o MGSO deve divulgar as medidas de segurança operacional adotadas para o atendimento
  à

  política estabelecida, de forma a envolver a todos da organização e aos seus parceiros e

  terceirizados;

  8.4.14.4. o GSO do CTAC é responsável por elaborar e atualizar o MGSO, bem como garantir
  que seu

  conteúdo esteja adequado ao regulamento;

  8.4.14.5. cada revisão do MGSO deve ser formalmente aprovada pelo gestor responsável;

  8.4.14.6. o conteúdo do MGSO torna-se aplicável e mandatório ao CTAC a partir do momento
  em que

  o gestor responsável o aprova, devendo ser respeitado e cumprido por todos os funcionários
  e

  colabores do CTAC. O não cumprimento às regras estabelecidas pelo MGSO será

  caracterizado como implantação e/ou operação deficiente do SGSO;

  8.4.14.7. o MGSO não isenta o CTAC de nenhuma regra aplicável, sob nenhuma hipótese;

  8.4.14.8. caso a ANAC venha a detectar não-conformidades ou a necessidade de correção do
  MGSO,

  essa informará a não-conformidade ou correção a ser efetuada ao CTAC, que, por sua vez,

  deverá sanar a não-conformidade ou efetuar a correção dentro do prazo estabelecido pela

  comunicação; e

