text: 'e) os produtos do SGSO;11 de julho de 2014 IS Nº 142-001

  Revisão A

  8.4.6.2. desenvolver um plano de implantação do SGSO, formalmente aprovado pelo gestor

  responsável, que defina a qual será a abordagem de gerenciamento de segurança adotada para

  atingir os objetivos de segurança operacional;

  8.4.6.3. garantir que a documentação acima referida permaneça adequada à operação do detentor
  de

  certificado; e

  8.4.6.4. arquivar, por um prazo mínimo de 5 anos, os documentos e registros gerados durante
  a

  implantação, operação e manutenção do SGSO, permitindo sua rastreabilidade.

  8.4.7. O elemento “identificação de perigos” do CTAC deve:

  8.4.7.1. estabelecer processos que assegurem a identificação dos perigos associados à sua
  atividade; e

  8.4.7.2. utilizar métodos reativos, pró-ativos e preditivos em seus processos de identificação
  de

  perigos.

  8.4.8. O elemento “avaliação e mitigação dos riscos” do CTAC deve:

  8.4.8.1. estabelecer processos que assegurem a avaliação, classificação e mitigação dos
  riscos

