cite: 142.49(f)
title: 142.49(f)
text: 'f) relatórios de revisão de gestão e análise.

  8.5.5. A qualificação e reciclagem das pessoas encarregadas pelas auditorias e demais atividades,

  conforme parágrafo 142.51(c) do RBAC 142 e item 8.5.2.4 desta IS deve considerar a

  complexidade das atividades operacionais de treinamento desenvolvidas pelo CTAC. Deve-se

  estabelecer a conveniência de se contar com um auditor ou uma equipe de auditores. Em

  qualquer dos casos, o auditor ou a equipe deve ter treinamento e experiência operacional

  adequada.

  8.5.6. As responsabilidades do(s) auditor(es) devem estar claramente definidas no MIP ou
  volume

  do sistema de garantia da qualidade conforme estabelecido.

  8.5.7. O(s) auditor(es) selecionado(s) não deve(m) estar envolvido(s) com as áreas ou atividades
  a

  serem auditadas. Desta forma, O CTAC deve garantir, por meio de procedimentos

  apropriados, que a as pessoas diretamente responsáveis pelas áreas a serem auditadas não

  sejam selecionadas como parte da equipe de auditoria.

  8.5.7.1. Caso sejam utilizados auditores de um departamento de qualidade independente ou
  mesmo

  haja a contratação de outro CTAC ou pessoa para desempenhar tal atividade, conforme

  parágrafo 142.51(b)(1) do RBAC 142, tal condição deve estar claramente disposta no MIP ou

  volume do sistema de garantia da qualidade conforme estabelecido, sem prejuízo do

  comprometimento da efetividade do monitoramento das áreas específicas.'
