title: 142.49(i)
text: 'i) Em observação, destaca-se que as cargas-horárias e elementos curriculares dos

  cursos propostos devem seguir, preferencialmente, aqueles definidos nas publicações

  emitidas pela ANAC, pela autoridade primária de certificação do modelo ou pelo

  fabricante.

  8.3.5.4. As descrições detalhadas, conforme parágrafo 142.25(f)(4) do RBAC 142, são aplicáveis

  somente aos segmentos de voo de um curso. Devem abordar todas as manobras requeridas ao

  treinamento proposto, de forma a permitir a compreensão do conteúdo a ser ministrado em

  cada sessão, não sendo necessário o detalhamento de procedimentos de pilotagem requeridos

  para cada manobra.

  8.3.5.5. Método de treinamento.'
