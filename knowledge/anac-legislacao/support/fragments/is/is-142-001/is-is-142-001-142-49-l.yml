  8.5. Sistema de garantia da qualidade

  8.5.1. Independentemente do disposto no item 8.1.2 desta IS, para sua aceitação, o sistema
  de

  garantia da qualidade pode se configurar por meio da disposição das informações e

  procedimentos pertinentes no decorrer do MIP, conforme item 8.1.2.1(a), não necessitando

  estarem reunidos em volume separado.

  8.5.1.1. As informações e procedimentos, quando dispostos dentro do MIP, conforme destacado

  acima, devem estar devidamente destacados para facilitar sua identificação.

  8.5.1.2. O objetivo do sistema de garantia da qualidade é permitir, por meio de um programa
  de

  auditorias, a avaliação da efetividade dos procedimentos utilizados, dos recursos disponíveis,

  da conformidade das atividades operacionais de treinamento com os requisitos aplicáveis,
  da

  especificidade e adequação dos objetivos de qualidade requeridos assim como da qualificação

  e capacitação do pessoal do CTAC.

  8.5.2. As auditorias requeridas devem ser independentes e, para que alcancem os requisitos

  dispostos na Seção 142.51 do RBAC 142, devem ser apresentadas por meio de um programa

  que inclua todas as ações planejadas e sistematicamente necessárias para garantir que todas
  as

  atividades operacionais de treinamento se desenvolvam de acordo com os requisitos técnicos

  e procedimentos aplicáveis.

  8.5.2.1. O programa deve considerar, no mínimo, os seguintes aspectos:'
