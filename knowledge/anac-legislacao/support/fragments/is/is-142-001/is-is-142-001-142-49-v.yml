title: 142.49(v)
text: 'v) estabelecimento dos objetivos e metas de segurança operacional;

  vi) responsabilidade final por solucionar todos os problemas de segurança operacional; e

  vii) estabelecimento e manutenção da capacidade do CTAC em aprimorar a segurança

  operacional por meio das informações coletadas pelo seu sistema de reportes;

  8.4.3.3. não delegar a outras pessoas as responsabilidades (no sentido de “accountability”)
  do gestor

  responsável;

  8.4.3.4. identificar as responsabilidades pelo desempenho do SGSO atribuídas ao pessoal
  do detentor

  do certificado, independente de outras atribuições que possuam;

  8.4.3.5. documentar e comunicar, a toda a organização, as responsabilidades, atribuições
  e

  prerrogativas estabelecidas pelo SGSO; e

  8.4.3.6. definir claramente quem possui autoridade de decisão sobre o nível aceitável de
  segurança

  operacional.

  8.4.4. O elemento “designação do pessoal chave de segurança operacional” do CTAC deve:

  8.4.4.1. designar formalmente um gerente de segurança operacional (GSO) que atenda aos requisitos

  estabelecidos pela ANAC e que terá as seguintes responsabilidades:'
