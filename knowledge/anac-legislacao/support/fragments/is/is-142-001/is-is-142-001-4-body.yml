text: '4. DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidas as definições listadas no RBAC 001, Seção 142.3
  do

  RBAC 142, e as seguintes definições:

  4.2. Requerente significa a organização que solicita o Certificado de Centro de Treinamento
  de

  Aviação Civil (CTAC) e respectivas Especificações de Treinamento.

  4.3. Setor pertinente da ANAC significa o setor específico, dentro da estrutura organizacional
  da

  ANAC, que gerencia o processo de certificação e alteração de Especificação de Treinamento

  de um CTAC.'
