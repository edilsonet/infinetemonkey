title: DESENVOLVIMENTO DO ASSUNTO
text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1. Os níveis de segurança das atividades aéreas desempenhadas pelos operadores aéreos
  são

  alcançados por meio da utilização de tripulantes com treinamento de alto nível para o

  desempenho de suas funções com um mínimo de proficiência técnica exigida para operação

  dos equipamentos. Tal nível de exigência é conseguido somente por meio da realização de

  treinamentos de qualidade.

  5.2. Para que existam treinamentos de qualidade, deve-se exigir dos CTAC o cumprimento de

  requisitos mínimos estabelecidos em regulamentos específicos. Com a finalidade de garantir
  o

  atendimento dos requisitos relacionados, é exigido, igualmente, que o requerente passe por

  processo de certificação que, por meio de um método de avaliação ordenado, assegure o

  cumprimento dos requisitos de segurança operacional estabelecidos no RBAC 142 e em

  outros regulamentos pertinentes. Isto faz com que os CTAC disponibilizem treinamentos com

  o nível de qualidade exigido pelos operadores aéreos e demais entes do Sistema de Aviação

  Civil Brasileiro (SAC).

  5.3. Esta IS apresenta informações necessárias e um método, mas não somente o único, para
  que o

  requerente demonstre os procedimentos de como atenderá os requisitos estabelecidos no

  RBAC 142 e assim se demonstre hábil, competente e qualificado para receber o certificado
  de

  CTAC e suas respectivas Especificações de Treinamento.

  5.4. De forma alguma se deve certificar um CTAC sem que haja segurança de que o requerente
  é

  capaz de cumprir suas responsabilidades e requisitos regulamentares de maneira adequada,

  contínua e que garanta o desempenho dos treinamentos propostos com o nível de segurança

  requerido.'
