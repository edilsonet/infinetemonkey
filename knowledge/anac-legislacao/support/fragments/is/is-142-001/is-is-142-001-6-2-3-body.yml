text: '6.2.3 desta IS.

  7.2.3.3. No caso da alteração proposta se relacionar com a revisão de PT com aprovação final
  será

  necessário a realização de um novo processo. Para tanto será concedida uma aprovação inicial

  conforme item 6.2.3 desta IS e, após a realização de uma inspeção que ateste o atendimento

  dos requisitos pertinentes, será concedida a nova aprovação final.

  7.2.4. Cada alteração obedecerá as disposições de trâmites estabelecidas nos itens 6.5.3.3
  a 6.5.3.5

  desta IS.11 de julho de 2014 IS Nº 142-001

  Revisão A

  7.2.5. Caso o requerente solicite um processo de alteração de Especificação de Treinamento
  com

  método alternativo às instruções e procedimentos propostos nesta IS, o SPO aceitará o

  referido método alternativo caso entenda que este seja capaz de atender a todos os requisitos

  do processo de certificação com eficiência e/ou eficácia igual ou superior ao método proposto

  por esta IS, mediante embasamento feito por meio de NT emitida pelo setor pertinente da

  ANAC.

  7.2.5.1. A NT em referência deve abranger, no mínimo, os seguintes aspectos:'
