text: 'f) recomendação.

  7.2.5.2. A aceitação, ou não, do método alternativo proposto será informada pelo gerente
  do projeto,

  por meio de ofício, ao requerente.

  7.3. Requerimento de alterações de um certificado de CTAC e de suas respectivas

  Especificações de Treinamento, MIP e outros documentos

  7.3.1. Toda solicitação de alteração de Especificação de Treinamento deve ser encaminhada,
  por

  meio do protocolo da ANAC, ao setor pertinente responsável pela condução do processo de

  certificação de um CTAC, conforme o item 6.5.9 desta IS, por meio do FOP-CT 107,

  conforme o anexo 1.4, pertinente com a documentação necessária em anexo, pelo menos 90

  dias antes da data pretendida da entrada em vigor da alteração. Somente após a distribuição
  do

  processo aos seus respectivos setores, haverá interação diretamente do setor da área específica

  com o requerente.

  7.3.1.1. Apresentar qualquer outro documento que possa dar suporte às alterações propostas
  no

  requerimento. Por exemplo:'
