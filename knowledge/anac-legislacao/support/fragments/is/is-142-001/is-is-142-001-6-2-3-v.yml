title: 6.2.3(v)
text: 'v) documentos e publicações de referência;

  vi) notas fiscais e outros comprovantes de pagamento; e

  vii) outros.

  7.3.1.2. Caso o manual ou algum outro documento encaminhado por meio do respectivo FOP-CT
  107

  for considerado incompleto, deficiente, ou ainda, se for detectada alguma não conformidade

  nos procedimentos propostos com os regulamentos, o requerente será devidamente notificado

  por meio do FOP-CT 124. As devidas correções deverão ser entregues ao setor pertinente da

  ANAC pelo requerente, por meio do FOP-CT 125, para a conclusão das etapas seguintes do

  processo de alteração.

  7.3.2. Cada requerimento deve ser feito destacando quais dos elementos de confecção de uma

  Especificação de Treinamento estão sendo alterados, conforme o item 6.5.5.3 desta IS.

  7.3.3. Cada manual, algum outro documento ou seus respectivos volumes que forem apresentados

  para alteração devem informar um número de revisão novo e sequencial, que será atualizado

  para as devidas referências no documento de aprovação.

  7.3.4. Quando houver simultaneidade de alterações, deverão ser atendidas as exigências descritas
  de

  cada uma delas, sem, no entanto, haver necessidade de duplicidade de documentos.'
