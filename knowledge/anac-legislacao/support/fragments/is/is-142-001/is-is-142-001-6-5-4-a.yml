title: 6.5.4(a)
text: 'a) O processo de certificação será considerado concluído mediante a aprovação inicial
  do

  PT, seus currículos, cursos e segmentos associados, conforme o item 6.5.4.8. Sua

  aprovação final será emitida após a certificação do CTAC, com base nos resultados de

  inspeções realizadas durante o andamento do Plano de Vigilância Continuada (PVC) da

  ANAC, se comprovada a competência dos treinandos em desempenhar as funções

  treinadas, conforme parágrafo 142.23(c) do RBAC 142.

  6.5.5.2. O certificado de CTAC será emitido contendo as seguintes informações:'
