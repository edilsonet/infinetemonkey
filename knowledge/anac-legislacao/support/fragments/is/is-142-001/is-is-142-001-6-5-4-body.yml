text: '6.5.4 desta IS.

  6.5.4. Fase 4 - Demonstrações e inspeções

  6.5.4.1. O parágrafo 142.7(c) do RBAC 142 estabelece que o requerente deve assegurar que
  as

  instalações e equipamentos descritos em sua solicitação estejam instalados e operacionais
  no

  local proposto e disponíveis para inspeção antes de sua certificação.

  6.5.4.2. Esta fase se inicia quando o requerente solicita as demonstrações e/ou inspeções
  do CTAC ao

  gerente do projeto, por meio do FOP-CT 116, conforme o anexo 1.11.

  6.5.4.3. As inspeções serão feitas, mediante observação de demonstrações e vistorias, pelos
  INSPAC

  da equipe de certificação que conduzirão avaliações “in loco”, conforme Seção 142.13 do11
  de julho de 2014 IS Nº 142-001

  Revisão A

  RBAC 142. Os INSPAC darão ênfase à avaliação da efetividade do sistema de gerenciamento

  adotado para garantir a efetividade da implementação das políticas, métodos, procedimentos
  e

  instruções aplicáveis conforme descrito nos manuais e demais documentos apresentados para

  a certificação.

  6.5.4.4. Deverão ser recolhidas as Taxas de Fiscalização de Aviação Civil (TFAC) correspondentes
  a

  cada demonstração ou inspeção da Fase 4, conforme anexo III da Lei 11.182 de 2005 ou ato

  que venha a substituí-la ou emendá-la.

  6.5.4.5. As demonstrações e inspeções são aplicáveis também aos CTAC satélites, remotos
  e

  estrangeiros, conforme seções 142.37; 142.39; e 142.41 do RBAC 142 e incluem os seguintes

  aspectos:'
