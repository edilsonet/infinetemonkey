text: 'f) verificação da disponibilidade e atuação do pessoal técnico e administrativo requerido
  no

  desempenho de suas funções, conforme Seção 142.43 do RBAC 142. Esta verificação

  também considera os requisitos para instrutores e examinadores credenciados, conforme

  seções 142.45; e 142.47 do RBAC 142;'
