cite: 6.5.4(i)
title: 6.5.4(i)
text: 'i) A apresentação de um manual, algum outro documento ou informação em um

  processo de certificação encerrado não garante a sua aceitação pela nova equipe de

  certificação no novo processo.

  6.5.7.6. O requerente do processo de certificação de CTAC pode solicitar o cancelamento
  do

  processo, a qualquer momento e por motivos próprios, ao setor pertinente da ANAC mediante

  FOP-CT 110, conforme o anexo 1.7.

  6.5.8. Interações do processo

  6.5.8.1. Caso a resposta a uma mesma não conformidade em manifestação conclusiva da organização

  requerente seja rejeitada pela terceira vez, o processo de certificação será encerrado

  compulsoriamente, independentemente de prazo e fase do processo de certificação.

  6.5.9. Responsabilidade pelos processos de certificação

  6.5.9.1. A SPO é o superintendência responsável da ANAC pela condução do processo de certificação

  de um CTAC.

  6.5.9.2. Dentro da estrutura atual da SPO, o setor encarregado de conduzir o processo de
  certificação

  de um CTAC é a Gerência de Certificação de Organizações de Instrução (GCOI), por meio de

  sua Coordenação de CTAC. Entretanto, sempre que julgar necessário e de acordo com a

  complexidade do processo a SPO poderá solicitar a participação de outras áreas da ANAC.

  6.5.9.3. A ANAC é representada em fiscalizações e inspeções pelos INSPAC qualificados na
  área

  específica de inspeção.

  6.5.9.4. O setor da ANAC encarregado de estabelecer requisitos e qualificar os dispositivos
  de

  treinamento para simulação de voo, utilizados conforme seções 142.31 e 142.35 do RBAC

  142 é a GCOI, por meio de sua Coordenação de Qualificação de Simuladores de Voo.

  6.5.9.5. O setor da ANAC encarregado de realizar a avaliação operacional de aeronaves, assim
  como

  destacar a aprovação de programa de treinamento de aeronaves por parte dos fabricantes é
  a

  GCOI, por meio de sua Coordenação de Avaliação Operacional de Aeronaves.

  6.5.9.6. Acerca do Contrato Social apresentado pelo requerente, a GCOI somente avaliará
  a

  aplicabilidade da natureza da atividade, proposta em seus atos constitutivos, em relação
  ao

  RBAC 142. Qualquer outra análise, julgada necessária, poderá ser feita pelo setor pertinente

  da Superintendência de Regulação Econômica (SRE).

  6.5.9.7. O setor da ANAC encarregado de estabelecer requisitos de aeronavegabilidade; certificar
  e

  inspecionar aeronaves; suspender, cassar ou revalidar certificados de aeronavegabilidade11
  de julho de 2014 IS Nº 142-001

  Revisão A

  (CA); e conduzir todos os requisitos relativos à aeronavegabilidade de aeronaves utilizadas

  conforme Seção 142.33 do RBAC 142 é a Superintendência de Aeronavegabilidade (SAR).'
