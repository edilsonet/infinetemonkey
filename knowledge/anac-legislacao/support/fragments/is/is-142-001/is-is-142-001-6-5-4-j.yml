cite: 6.5.4(j)
title: 6.5.4(j)
text: 'j) verificação de registros e evidências que comprovem a implantação e o funcionamento
  do

  Plano de Resposta à Emergência (PRE) associado ao SGSO, quando aplicável, conforme

  Seção 142.125 do RBAC 142.11 de julho de 2014 IS Nº 142-001

  Revisão A

  6.5.4.6. As verificações relacionadas no item 6.5.4.5 serão feitas sempre se considerando
  os limites

  das regras de operação do CTAC, dispostos em seus manuais ou algum outro documento

  estabelecido, conforme requisitos da Subparte C do RBAC 142.

  6.5.4.7. Como resultado das inspeções realizadas, não conformidades poderão ser verificadas.
  As não

  conformidades encontradas serão levadas ao conhecimento do requerente por meio do FOP-

  CT 109, conforme anexo 1.6. As mesmas deverão ser respondidas pelo requerente dentro do

  prazo estipulado, apresentando Plano de Ações Corretivas (PAC) e evidências de implantação

  das mesmas, por meio do FOP-CT 123, conforme anexo 1.14.

  6.5.4.8. Todas as não conformidades, de cada uma das inspeções realizadas, deverão estar
  corrigidas

  para permitir a aprovação do requerente na Fase 4. Somente depois de ter sido aprovado em

  todas as demonstrações e inspeções a que foi submetido, o requerente terá demonstrado

  satisfatoriamente sua capacidade de operar com segurança cumprindo os requisitos de

  certificação.

  6.5.4.9. O gerente de projeto informará esta condição ao requerente por meio de ofício,
  comunicando

  o encerramento da Fase 4 do processo de certificação. Desta forma o requerente está pronto

  para a Fase 5, conforme descrito no item 6.5.5 desta IS.

  6.5.4.10. Para aprovação inicial ou final de PT incluindo redução de horas conforme autorizado
  pelo

  RBAC 142, deverão ser utilizadas todas as etapas e fases, assim como critérios do processo
  de

  certificação.

  6.5.5. Fase 5 - Certificação

  6.5.5.1. Após a conclusão das quatro fases anteriores, o setor pertinente da ANAC emitirá
  o

  certificado de CTAC e as respectivas Especificações de Treinamento, conforme os Apêndices

  B e C desta IS, com todas as autorizações e limitações dentro das quais o CTAC poderá

  conduzir cursos, treinamentos, aplicação de exames e verificações de competência de acordo

  com o programa de treinamento.'
