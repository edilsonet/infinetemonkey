text: 'm) aprovação.

  6.5.5.4. Com a publicação de portaria no Diário Oficial da União (DOU) e com a entrega do

  certificado de CTAC e das respectivas Especificações de Treinamento, feita por meio de

  ofício ao CTAC recém-certificado, o processo de certificação estará oficialmente encerrado.

  6.5.6. Prazos de referência do processo

  6.5.6.1. A tabela 2 apresenta diversos prazos referentes às atividades do setor pertinente
  da ANAC na

  condução do processo de certificação. Todavia, seu conteúdo não se constitui como prazo11
  de julho de 2014 IS Nº 142-001

  Revisão A

  regulamentar, devendo apenas ser encarado pelo requerente como parâmetro de planejamento

  das atividades, conforme item 6.5.1.2(a).

  Tabela 2 - Prazos médios para processamento das atividades do setor pertinente da ANAC.

  FASE PRAZO

  (dias) EVENTO INICIAL EVENTO FINAL

  1.1 05

  Informação de intenção de requerer CTAC

  e apresentação da solicitação de

  informações.

  Prestação das informações básicas por

  parte da ANAC em reunião informal.

  1.2 15 Envio do pedido de agendamento de ROP

  e entrega de FOP-CT 101 e 102. ROP bem sucedida.

  2 20 Apresentação do PSF.

  (FOP 102, 104 e anexos)

  Emissão de ofício comunicando o

  resultado da avaliação preliminar dos

  documentos e encerramento da fase 2.

  3 60

  Emissão de ofício comunicando o

  encerramento da fase 2 e apresentação dos

  manuais e documentos para protocolo na

  ANAC.

  Emissão de ofício comunicando o

  encerramento da fase 3.

  4 60 Emissão de ofício comunicando o

  encerramento da fase 3.

  Emissão de ofício comunicando o

  encerramento da fase 4.

  5 10 Emissão de ofício comunicando o

  encerramento da fase 4.

  Emissão do certificado de CTAC e

  respectivas Especificações de

  Treinamento.

  6.5.6.2. Os prazos de processamento estimados devem ser considerados sempre a partir do

  recebimento do material para análise.

  6.5.7. Encerramento compulsório do processo de certificação

  6.5.7.1. O requerente terá sempre o prazo de 90 dias, a contar da data da última comunicação
  de não

  conformidade, para apresentar as ações requeridas durante todas as fases do processo,

  respeitando-se tanto quanto possível a cronologia de eventos de certificação.

  6.5.7.2. Caso esse prazo se encerre sem manifestação conclusiva por parte do requerente,
  em qualquer

  fase, o processo será compulsoriamente encerrado e considerado insatisfatoriamente

  concluído e arquivado. Esta situação será informada mediante emissão de ofício por parte
  do

  setor pertinente da ANAC.

  6.5.7.3. Por manifestação conclusiva entende-se uma resposta com todas as informações solicitadas

  pelo setor pertinente da ANAC, ainda que os itens possam conter incorreções ou não

  conformidades a serem observadas durante sua análise aprofundada.

  6.5.7.4. No caso de entrega de qualquer manifestação por parte do requerente ao setor pertinente
  da

  ANAC, nos termos aqui definidos, a contagem de tempo dos 90 (noventa) dias será

  interrompida quando da entrega da documentação. Caso a informação fornecida seja

  pertinente, o requerente terá a contagem dos 90 (noventa) dias reiniciada a partir dessa

  entrega. Entretanto, se for detectada a falta ou omissão de alguma informação requerida,
  a

  manifestação será considerada não conclusiva e a contagem terá como referência a data de

  emissão do documento pelo setor pertinente da ANAC ao requerente.

  6.5.7.5. Uma vez encerrado o processo de certificação por arquivamento compulsório, não
  é possível

  a sua reabertura. Caso exista interesse do requerente, este deverá dar início a um novo

  processo de certificação a ser conduzido em conformidade com os procedimentos11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  apresentados nesta IS, ou procedimentos alternativos que venham a ser aprovados a critério

  do setor pertinente da ANAC, conforme previsto no item 6.2.8 desta IS.'
