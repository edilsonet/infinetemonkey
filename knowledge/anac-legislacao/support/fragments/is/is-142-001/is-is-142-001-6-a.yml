section_title: PROCESSO DE CERTIFICAÇÃO DE CENTROS DE TREINAMENTO DE
subsection_id: a
cite: 6(a)
title: 6(a)
text: 'a) Os detentores de certificado de CTAC poderão ter seus certificados validados se

  comprovada sua certificação pela autoridade de aviação civil do país e conforme

  instruções e procedimentos dispostos em IS aplicável.

  6.1.2.3. Aos operadores de transporte aéreo público, que operam segundo o RBAC 121 ou 135,
  que

  efetuem qualquer atividade de treinamento por conta da execução do próprio Programa de

  Treinamento (PT) aprovado, conforme parágrafo 142.23(e) do RBAC 142.

  6.2. Disposições gerais

  6.2.1. Qualquer processo de certificação de CTAC se inicia quando um requerente apresenta
  uma

  proposta a ser avaliada pela ANAC quanto a sua habilidade, competência e qualificação para

  atuar como CTAC.

  6.2.2. O processo de certificação é um método ordenado de avaliação que assegura o cumprimento

  de requisitos regulamentares e garante os aspectos de segurança operacional relacionados
  com

  o treinamento de pessoal da aviação civil. A condução do processo destina-se a evitar que
  um

  requerente a certificação seja incompatível, ou mesmo, contenha falta de capacidade de

  cumprir com os requisitos regulamentares ou de se adaptar às práticas de instrução,

  treinamento e segurança operacional estabelecidas.

  6.2.3. O processo de certificação de CTAC, conforme disposto na Seção 142.21 do RBAC 142,

  deve, no mínimo, compreender um Programa de Treinamento (PT) para aprovação, estando

  de acordo com os requisitos estabelecidos nas Subpartes B; C; e E do RBAC 142. No caso de

  atendimento dos requisitos pertinentes, será concedida a aprovação inicial do PT com prazo

  de validade definido conforme item 6.5.3.4 e Seção 8 desta IS - Fase 3 do Processo de

  Certificação e Organização dos Requisitos de Certificação respectivamente.

  6.2.3.1. Ao final do prazo de validade da aprovação inicial e atendendo os requisitos pertinentes,

  inclusive mediante realização de inspeções e vistorias conforme Seção 142.13 do RBAC 142,

  será concedida a aprovação final com prazo de validade indefinido, conforme item 6.5.5.1(a)

  desta IS - Fase 5 do Processo de Certificação.

  6.2.4. Para fins de demonstração do cumprimento dos requisitos estabelecidos na Seção 142.21
  do

  RBAC 142, o processo de certificação que leva à emissão de um certificado de CTAC e de

  suas respectivas Especificações de Treinamento, a ser solicitado conforme Seção 142.7 do11
  de julho de 2014 IS Nº 142-001

  Revisão A

  RBAC 142, será dividido em cinco fases, conforme descrito no item 6.5 desta IS, dividindo-se

  nas seguintes fases:'
