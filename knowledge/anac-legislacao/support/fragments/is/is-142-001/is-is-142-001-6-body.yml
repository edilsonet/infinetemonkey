title: PROCESSO DE CERTIFICAÇÃO DE CENTROS DE TREINAMENTO DE
text: '6. PROCESSO DE CERTIFICAÇÃO DE CENTROS DE TREINAMENTO DE

  AVIAÇÃO CIVIL

  6.1. Aplicabilidade

  6.1.1. Esta Seção especifica as instruções e procedimentos para um requerente de um certificado
  de

  CTAC e de suas respectivas Especificações de Treinamento, de acordo com os modelos

  expostos nos Apêndices B e C desta IS, para que conduza treinamentos como CTAC

  conforme os requisitos de Aplicabilidade da Seção 142.1 e demais requisitos pertinentes
  do

  RBAC 142.11 de julho de 2014 IS Nº 142-001

  Revisão A

  6.1.2. Esta Seção não se aplica:

  6.1.2.1. Aos CTAC certificados pelo Sistema Regional de Cooperação para a Vigilância da
  Segurança

  Operacional (SRVSOP) sob as regras do Regulamento Aeronáutico Latino-Americano 142

  (LAR 142).'
