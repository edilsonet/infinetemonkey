text: 'e) Fase 5 - Certificação.

  6.2.5. As 5 fases do processo são simples, diretamente relacionadas e configuram um processo

  dinâmico que está ordenado num sentido cronológico que proporciona um guia de ação passo

  a passo para que o requerente e o Inspetor de Aviação Civil da ANAC (INSPAC) conduzam

  as tarefas específicas dentro de tal processo.

  6.2.6. O fluxograma detalhado do processo de certificação em 5 fases está apresentado no
  Apêndice

  A desta IS.

  6.2.7. As interações entre o requerente e o setor pertinente da ANAC deverão ser feitas
  mediante

  seus representantes, conforme subseção 6.4 desta IS, utilizando os modelos dispostos no'
