text: '7. PROCESSO DE ALTERAÇÃO DAS RESPECTIVAS ESPECIFICAÇÕES DE

  TREINAMENTO DE UM CERTIFICADO DE CTAC, MIP E OUTROS

  DOCUMENTOS

  7.1. Aplicabilidade

  7.1.1. Esta Seção especifica instruções e procedimentos para alteração das respectivas

  Especificações de Treinamento de um Certificado de um CTAC, assim como do MIP e outros

  documentos para a correta condução dos treinamentos propostos, conforme os requisitos de

  aplicabilidade da Seção 142.1 e demais requisitos pertinentes do RBAC 142.

  7.1.1.1. Para efeito de aplicabilidade, esta Seção considera as alterações propostas para
  o CTAC em

  sua sede principal de funcionamento, CTAC satélite, CTAC remoto e CTAC estrangeiro

  conforme seções 142.37; 142.39; e 142.41 do RBAC 142 e atribuições de emenda ao

  certificado de CTAC conforme parágrafo 142.7(h)(2) do RBAC 142.

  7.2. Disposições gerais

  7.2.1. O processo de alteração das respectivas Especificações de Treinamento de um certificado
  de

  CTAC, MIP e de outros documentos é similar ao processo de certificação de um CTAC,

  guardadas as devidas proporções, podendo ser menos complexo e demorado dependendo do

  tipo de alteração pretendida.

  7.2.2. Qualquer alteração no Certificado de um CTAC implica também alteração nas suas

  respectivas Especificações de Treinamento, conforme os procedimentos apresentados na

  Seção 6 desta IS.

  7.2.3. A alteração das Especificações de Treinamento de um CTAC pode requerer alterações
  do

  MIP e seus volumes e outros documentos, conforme disposto na Seção 8 desta IS.

  7.2.3.1. Neste caso, o requerente deverá encaminhar a(s) revisão(ões) proposta(s) por meio
  do mesmo

  FOP-CT107, conforme o anexo 1.4, que solicite a alteração das Especificações de

  Treinamento do CTAC preenchendo seus campos específicos.

  7.2.3.2. No caso da alteração proposta se relacionar com a revisão de PT com aprovação inicial
  e,

  houver atendimento dos requisitos pertinentes será concedida uma nova aprovação inicial

  com mesmo prazo de validade definido em aprovação anterior, conforme previsto no item'
