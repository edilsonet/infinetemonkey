text: 'd) registros de todas as informações, conforme item 8.2.6.6 desta IS.

  8.2.6.13. A apresentação de uma declaração de compromisso, em nome do gestor responsável
  do

  CTAC, de que haverá, para a escolha dos locais das aulas teóricas, obediência aos limitantes

  dispostos nos parágrafos 142.25(f)(12) e 142.27(b)(13) do RBAC 142, que se relacionem

  também às características das edificações e instalações de que o CTAC dispõe, conforme

  Seção 142.29 do RBAC 142.

  8.2.6.14. A apresentação do SGSO quando o CTAC utilizar aeronaves, conforme parágrafo 142.111(a)

  do RBAC 142. Destaca-se que esta apresentação pode ser feita em volume separado,

  utilizando-se as informações pertinentes, conforme item 8.4 desta IS. Deve haver a inclusão

  do plano de implantação do SGSO de acordo com o parágrafo 142.21(a)(14); e Subparte E do

  RBAC 142.

  8.2.6.15. A apresentação de uma declaração de conformidade, conforme parágrafo 142.21(a)(11)
  do

  RBAC 142, utilizando-se os elementos de composição e formatação conforme item 6.5.2.5(c)

  desta IS.

  8.2.6.16. A apresentação de seguro, conforme parágrafo 142.21(a)(13) do RBAC 142, no caso
  de

  utilização de aeronaves para treinamento de voo, por meio de anexo ao MIP.

  8.2.7. Os requisitos estabelecidos na Seção 142.29 do RBAC 142 devem estar descritos

  objetivamente no MIP de forma a garantir respeito aos mesmos para a execução das

  atividades de treinamento do CTAC.

  8.2.7.1. Objetivando demonstração da condição pode-se contar de forma adicional com a utilização
  de

  plantas baixas, fotos e outros meios de constatação, devendo estar dispostos em anexo ao

  MIP.

  8.2.8. Os equipamentos e materiais de ensino e apoio de treinamento a serem utilizados conforme

  parágrafo 142.25(g) e Seção 142.31 do RBAC 142 devem estar dispostos em listagem

  exclusiva no MIP.

  8.2.8.1. Esta disposição em listagem exclusiva não exime a necessidade de disposição de
  critérios de

  utilização dos mesmos, devendo ser relacionados em cada segmento de curso pertinente.

  8.2.9. Os requisitos de aeronaves, estabelecidos na Seção 142.33 do RBAC 142, devem constar
  no

  MIP por meio da apresentação de tabelas, certificados pertinentes, programas ou qualquer

  outro documento reconhecido, ou mesmo relacionado no MIP, que os demonstre claramente.11
  de julho de 2014 IS Nº 142-001

  Revisão A

  8.2.9.1. Quaisquer procedimentos necessários para o seu cumprimento devem estar relacionados
  às

  regras de operação do CTAC, conforme Subparte C do RBAC 142.

  8.2.10. Os detalhes da qualificação ou validação, assim como as capacidades de cada um dos

  dispositivos de treinamento para simulação de voo utilizados para treinamentos e exames,

  conforme Seção 142.35 do RBAC 142 devem ser evidenciados por meio da apresentação do

  certificado e relatório estabelecido pelo setor pertinente da ANAC.

  8.2.10.1. A garantia da manutenção, modificação e operacionalidade dos mesmos, assim como
  suas

  regras de operação, conforme parágrafo 142.35(c) do RBAC 142, devem estar relacionadas

  nas regras de operação do CTAC, conforme Subparte C do RBAC 142.

  8.2.10.2. A garantia de operacionalidade de cada componente essencial que esteja envolvido
  no

  treinamento ou exame de pilotos, de um dispositivo de treinamento para simulação de voo

  utilizado, e os termos de que somente tais dispositivos de treinamento qualificados ou

  validados pela ANAC, possam ser utilizados, deve estar relacionada nas regras de operação

  do CTAC, conforme Subparte C do RBAC 142.

  8.2.10.3. Caso o CTAC opte por contratar a utilização do(s) dispositivo(s) de treinamento
  para

  simulação de voo, deverá dispor procedimentos claros e distintos em seu MIP relacionados

  com a sua contratação e utilização, considerando no mínimo os seguintes aspectos:'
