text: 'e) ciência sobre a possibilidade de indeferimento de certificação ou suspensão do certificado

  de CTAC pelo não cumprimento das condições deste item, mediante inspeção da ANAC.

  8.2.11. Os procedimentos relacionados com a garantia da efetividade do controle de todos
  os níveis

  da organização, por parte da direção do CTAC, da notificação e autorização da delegação
  de

  funções, da quantidade de instrutores qualificados e da presença de coordenadores para

  realização e supervisão de treinamentos, conforme parágrafos 142.43(h); 142.43(i);

  142.43(k); e 142.43(o) do RBAC 142, devem estar relacionados nas regras de operação do

  CTAC, conforme Subparte C do RBAC 142.

  8.2.12. Em atendimento a Subparte C do RBAC 142, a descrição dos diversos procedimentos

  operacionais de treinamento e as regras diversas de operação do CTAC deve ser feita de

  forma simples e direta, evitando cópia dos requisitos.11 de julho de 2014 IS Nº 142-001

  Revisão A

  8.2.12.1. Deve-se utilizar os elementos listados abaixo, tal como já disposto no item 6.5.3.2
  desta IS,

  para auxiliar a composição dos diversos procedimentos que atendam a todos os requisitos,
  a

