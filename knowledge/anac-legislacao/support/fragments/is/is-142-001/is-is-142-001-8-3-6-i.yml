cite: 8.3.6(i)
title: 8.3.6(i)
text: 'i) Conforme definido pela Seção 142.23(g) do RBAC 142, a solicitação para aprovação

  de um PT deve informar quais cursos fazem parte do currículo base, do currículo11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  especializado e do currículo de outros cursos autorizados. A proposta de PT deve

  apresentar, em sua parte introdutória, a relação dos cursos que o CTAC ministrará,

  divididos nos três grupos e destacar qual habilitação será emitida para cada curso do

  currículo base; e o(s) requisito(s) atendido(s) por cada curso do currículo

  especializado.

  ii) Conforme as definições do parágrafo 142.3(a)(10) do RBAC 142, entende-se como

  curso um programa de instrução que satisfaça requisitos específicos de treinamento

  para obtenção e revalidação de uma habilitação, qualificação ou autorização de

  tripulantes. É a agenda completa específica para um determinado treinamento, tipo

  de aeronave e função de um tripulante, como exemplo da Figura 1.

  iii) Em adição às definições apresentadas entende-se que “cursos do currículo base” são

  aqueles cujo cumprimento é requerido para a obtenção ou revalidação de uma

  habilitação (por exemplo: um curso de treinamento inicial para a aeronave SK-76 ou

  um curso de treinamento periódico para a aeronave B737-300). Um curso do

  currículo base compreende uma agenda completa (“parte teórica” + “parte

  prática”) específica para um determinado treinamento, tipo de aeronave e função de

  um tripulante.

  iv) Em adição às definições apresentadas entende-se que “cursos do currículo

  especializado” são aqueles que têm por objetivo o atendimento a requisitos

  específicos, definidos nos RBAC/RBHA (por exemplo: cursos relacionados com

  operações ETOPS e RVSM e curso para formação de instrutores oferecidos a

  operadores aéreos em atendimento a requisitos dos RBAC 121 e 135). Cursos que

  não tenham previsão específica em regulamento não são considerados como cursos

  do currículo especializado.'
