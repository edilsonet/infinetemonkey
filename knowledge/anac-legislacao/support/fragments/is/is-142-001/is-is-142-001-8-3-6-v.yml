text: 'v) Em adição às definições apresentadas entende-se que “cursos do currículo ‘outros

  cursos autorizados’” são aqueles vinculados à execução de funções ligadas à aviação

  civil, que podem ser ministrados a todas as carreiras aprovadas pela ANAC, em

  atendimento aos requisitos do RBAC 142 (por exemplo: curso de “introdução ao

  jato” relacionado à desempenho/performance de aeronaves com motores à jato e

  curso de Tráfego Aéreo Internacional (TAI) entre outros). As autorizações para esses

  cursos poderão ser concedidas à critério da ANAC, conforme previsto na Seção'
