title: ORGANIZAÇÃO DOS REQUISITOS DE CERTIFICAÇÃO
text: '8. ORGANIZAÇÃO DOS REQUISITOS DE CERTIFICAÇÃO

  8.1. Disposições gerais

  8.1.1. Esta Seção destaca as condições gerais e esclarece aspectos relacionados com a metodologia
  e

  a organização necessária para a elaboração e alteração da coletânea de manuais e quaisquer

  outros documentos requeridos, que disponham todas as informações relacionadas para o

  cumprimento dos requisitos de certificação de um CTAC, conforme Seção 142.21 do RBAC

  142.

  8.1.2. Para efeitos desta IS, a coletânea de todos os manuais e documentos elaborados por
  um

  CTAC é considerada “filosoficamente” como Manual de Instruções e Procedimentos (MIP).

  Com o objetivo de facilitar a distinção de assuntos correlatos, assim como o manuseio das

  partes inerentes a cada assunto, o MIP pode ser disponibilizado em volumes separados.

  Destaca-se que esta metodologia é considerada como uma sugestão, ficando o requerente livre

  para organizar a disposição de todas as informações pertinentes ao cumprimento dos

  requisitos de certificação e ao MIP, conforme Seção 142.27 do RBAC 142.11 de julho de 2014
  IS Nº 142-001

  Revisão A

  8.1.2.1. De acordo com esta metodologia, os manuais e documentos elaborados podem ser

  subdivididos em volumes, a saber:'
