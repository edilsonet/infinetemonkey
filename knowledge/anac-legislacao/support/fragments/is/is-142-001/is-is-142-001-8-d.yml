title: 8(d)
text: 'd) Sistema de Gerenciamento de Segurança Operacional (SGSO), conforme Subparte E do

  RBAC 142.

  8.1.3. Quando o MIP for emitido em volumes separados, deve-se incluir um índice original
  que

  permita localizar facilmente qualquer informação em outro volume associado. Este índice

  original deve ser disposto no início de cada volume.

  8.1.4. O MIP dever ser coerente com a filosofia, políticas, processos e procedimentos operacionais

  de treinamento do CTAC.

  8.1.5. O MIP deve estar organizado de acordo com critérios de informação, importância e
  utilização

  mais conveniente ao CTAC. As informações devem estar estruturadas e ordenadas de maneira

  tal, que possa ser fácil seu manejo pelo pessoal do CTAC. Estes princípios ajudarão a

  determinar a conveniência de emitir o MIP num só documento ou em volumes separados.

  8.2. Manual de instruções e procedimentos - MIP

  8.2.1. O MIP é o documento que descreve os métodos de condução das atividades do CTAC, com

  definição das responsabilidades e procedimentos em cumprimento das Especificações de

  Treinamento e do RBAC 142. Seu conteúdo deve abranger os requisitos dispostos nas seções

  142.21; 142.27; 142.29; 142.31; 142.33; 142.35; 142.37; 142.39; 142.41; 142.43; 142.45;'
