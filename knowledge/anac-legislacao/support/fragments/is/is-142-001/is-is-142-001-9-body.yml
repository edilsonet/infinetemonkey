text: '9. SOLICITAÇÃO, EMISSÃO, EMENDA, SUSPENSÃO, REVOGAÇÃO OU

  CASSAÇÃO DE CERTIFICADO DE CTAC

  9.1. Solicitação

  9.1.1. A solicitação de um certificado de CTAC ocorre quando satisfeitas as condições dispostas
  nos

  parágrafos 142.7(a); 142.7(b); 142.7(c); e 142.7(d) do RBAC 142.

  9.1.1.1. A solicitação de um certificado de CTAC deve ser feita mediante condução de processo

  estabelecido na Seção 6 desta IS.

  9.2. Emissão

  9.2.1. A emissão de um certificado de CTAC ocorre ao final do processo estabelecido na Seção
  6,

  mediante conclusão da Fase 5 do processo, conforme item 6.5.5.

  9.3. Emenda

  9.3.1. A solicitação de emenda a um certificado de CTAC ocorre quando satisfeitas quaisquer
  das

  condições dispostas no parágrafo 142.7(h) do RBAC 142.

  9.3.1.1. A solicitação de emenda de um certificado de CTAC deve ser feita mediante condução
  de

  processo, conforme a Seção 7 desta IS.

  9.4. Suspensão e revogação

  9.4.1. A suspensão e a revogação de um certificado de CTAC pode ocorrer quando forem

  observadas quaisquer das condições dispostas no parágrafo 142.7(f) do RBAC 142.

  9.4.1.1. Será aberto processo administrativo que comprove e fundamente todas as ações tomadas
  pelo

  SPO ou setor pertinente da ANAC e que garantam o direito de ampla defesa do requerente.

  9.4.2. A suspensão ou revogação de um certificado de CTAC e suas Especificações de Treinamento

  podem ser requeridas pelo gestor responsável da organização a qualquer momento por meio

  de ofício.11 de julho de 2014 IS Nº 142-001

  Revisão A

  9.4.2.1. Será aberto processo administrativo que comprove e fundamente todas as ações tomadas
  pelo

  SPO ou setor pertinente da ANAC, sendo emitido o FOP-CT 121 ao final do processo,

  conforme o anexo 1.12.

  9.5. Cassação

  9.5.1. A cassação de um certificado de CTAC ocorre quando satisfeitas quaisquer das condições

  dispostas no parágrafo 142.7(g) do RBAC 142.

  9.5.1.1. Será aberto processo administrativo que comprove e fundamente todas as ações tomadas
  pelo

  SPO ou setor pertinente da ANAC.'
