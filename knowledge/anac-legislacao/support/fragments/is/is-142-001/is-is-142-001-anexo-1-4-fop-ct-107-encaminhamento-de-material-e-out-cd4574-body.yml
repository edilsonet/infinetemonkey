title: ANEXO 1.4 - FOP-CT 107 Encaminhamento de material e outros documentos para análise
text: 'ANEXO 1.4 - FOP-CT 107 Encaminhamento de material e outros documentos para análise

  e/ou alteração de Especificação de Treinamento

  Não preencher os campos sombreados

  Caso falte espaço para inserir os dados, destacar informações anexas Rev. Original

  Logotipo da

  empresa

  (OPCIONAL)

  FOP-CT 107

  ENCAMINHAMENTO DE MATERIAL E OUTROS DOCUMENTOS

  PARA ANÁLISE E/OU ALTERAÇÃO DE ESPECIFICAÇÃO DE

  TREINAMENTO

  À (SPO - Setor pertinente): Número:

  Data: Página:

  DADOS DA ORGANIZAÇÃO REQUERENTE

  Nome da organização requerente: CNPJ:

  Endereço do CTAC principal:

  Encaminhamento de material e outros documentos para análise.

  Alteração de Especificação de Treinamento.

  DESCRIÇÃO DO MATERIAL

  (um formulário para cada material a ser analisado)

  Tipo: Processo ANAC de referência (informar quando conhecido):

  Número da revisão: Data da revisão:

  RESPONSÁVEL NA ORGANIZAÇÃO PELO MATERIAL

  Nome: Cargo:

  Telefone: Fax: Celular: E-mail:

  MODIFICAÇÕES NESTA REVISÃO (PARA AS REVISÕES)

  Observações: 1. Os tópicos da revisão devem indicar a parte do índice original que permita
  localizar facilmente a

  modificação em todos os volumes associados;

  2. O texto alterado no manual, documento ou volume do MIP afetado deve ser destacado (barra
  de

  alteração).'
