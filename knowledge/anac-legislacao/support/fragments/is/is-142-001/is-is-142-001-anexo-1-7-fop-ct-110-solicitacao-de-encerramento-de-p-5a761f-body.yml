text: 'ANEXO 1.7 - FOP-CT 110 Solicitação de encerramento de processo de certificação de CTAC

  Não preencher os campos sombreados

  Caso falte espaço para inserir os dados, destacar informações anexas Rev. Original

  Logotipo da

  empresa

  (OPCIONAL)

  FOP-CT 110

  SOLICITAÇÃO DE ENCERRAMENTO DE PROCESSO DE

  CERTIFICAÇÃO DE CTAC

  À (SPO - Setor pertinente): Número:

  Data:

  DADOS DA ORGANIZAÇÃO REQUERENTE

  Nome da organização: CNPJ:

  Gestor responsável: Endereço do CTAC principal:

  Telefone: Fax: Celular: E-mail:

  IDENTIFICAÇÃO DO PROCESSO

  NUMERO DE PROTOCOLO DO PROCESSO:

  CERTIFICAÇÃO INICIAL ALTERAÇÃO DE CTAC E ESPECIFICAÇÕES DE TREINAMENTO

  OUTROS (especificar):

  Motivo da solicitação:

  REQUERIMENTO

  Solicito o encerramento do processo acima identificado.

  Atesto estar ciente de que o reinício do processo não será possível, devendo, caso haja
  interesse

  em sua retomada, solicitar a abertura de novo processo.

  RESPONSÁVEL DA ORGANIZAÇÃO REQUERENTE

  Nome / cargo do solicitante: Assinatura:11 de julho de 2014 IS Nº 142-001

  Revisão A'
