title: anexo-1-desta-is(a)
text: 'a) A etapa de solicitação de informações, que antecede a solicitação de certificado
  de

  CTAC, conforme disposto nos parágrafos 142.7(a); e 142.7(b) do RBAC 142, se

  configura quando o requerente entra em contato com o setor pertinente da ANAC

  informando-o de sua intenção em obter um certificado de CTAC. Este contato inicial

  pode ser realizado por meio de carta, correio eletrônico, telefone, fax, visita (mediante

  contato prévio), etc., a fim de realizar o agendamento de reunião para o fornecimento das

  informações básicas e gerais sobre o processo de certificação objeto desta IS.'
