title: anexo-1-desta-is(b)
text: 'b) Esta primeira reunião tem caráter informal e também opcional. Caso o requerente
  julgue

  oportuno, serve como oportunidade para que o INSPAC explique ao requerente todos os

  requisitos pertinentes estabelecidos no RBAC 142, assim como explique sobre as

  instruções e procedimentos desta IS - tal como também disposto na página da internet na

  ANAC (www.anac.gov.br). Ademais, a reunião serve para que o INSPAC tenha um

  contato inicial com o requerente para que, caso o mesmo solicite alguma operação

  complexa de treinamento, possa reforçar sobre a necessidade de realização de estudo

  detalhado da proposta para definir todos os documentos e requisitos pertinentes.'
