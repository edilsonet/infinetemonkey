title: Anexo 1 desta IS.
text: 'Anexo 1 desta IS.

  6.2.8. Caso o requerente solicite um processo de certificação com método alternativo às
  instruções e

  procedimentos propostos nesta IS, o Superintendente de Padrões Operacionais (SPO) aceitará

  o referido método alternativo caso entenda que este seja capaz de atender a todos os requisitos

  do processo de certificação com eficiência e/ou eficácia igual ou superior ao método proposto

  por esta IS, mediante embasamento feito por meio de Nota Técnica (NT) emitida pelo setor

  pertinente da ANAC.

  6.2.8.1. A NT em referência deve abranger, no mínimo, os aspectos abaixo.'
