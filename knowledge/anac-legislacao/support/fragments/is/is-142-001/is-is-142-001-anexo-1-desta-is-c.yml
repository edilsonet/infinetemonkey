text: 'c) Se após esse contato inicial o requerente mantiver sua intenção e pretender avançar
  no

  processo de certificação, o INSPAC apresentará todas as informações sobre a necessidade

  de preenchimento dos formulários FOP-CT 101 e 102 conforme os anexos 1.1 e 1.2, para

  apresentação em reunião conforme o item 6.5.1.2 desta IS. Os currículos do pessoal

  técnico e administrativo, requeridos pela Seção 142.43 do RBAC 142, devem constar em'
