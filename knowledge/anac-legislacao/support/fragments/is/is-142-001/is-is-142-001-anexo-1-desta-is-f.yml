text: 'f) Recomendação.

  6.2.8.2. A aceitação, ou não, do método alternativo proposto será informada pelo gerente
  do projeto,

  por meio de ofício, ao requerente.

  6.2.9. Em hipótese alguma deve haver a certificação de um CTAC sem que o setor pertinente
  da

  ANAC tenha segurança absoluta que o requerente seja capaz de cumprir com suas11 de julho
  de 2014 IS Nº 142-001

  Revisão A

  responsabilidades e requisitos regulamentares de maneira adequada e contínua, garantindo
  a

  condução de treinamentos com o nível de segurança operacional requerido.

  6.3. Regime de portais de processo

  6.3.1. O processo de certificação de CTAC adotado por esta IS impõe um regime de portais.

  Somente pode se considerar que uma fase esteja encerrada caso todos os requisitos pertinentes

  à fase, dispostos na Seção 142.21 do RBAC 142 e detalhados na subseção 6.5 desta IS,

  tenham sido cumpridos.

  6.3.2. Se houver não conformidades na documentação apresentada pelo requerente, ou nas inspeções

  realizadas, tal condição será comunicada ao requerente por meio de ofício ou modelo

  aprovado e o processo será sobrestado até a regularização e continuidade do processo. Caso
  o

  requerente, a seu critério, retire a documentação, o prazo para o cumprimento da fase

  específica apenas voltará a ser observado a partir do novo protocolo da apresentação da
  nova

  documentação, conforme item 6.5.7 desta IS.

  6.3.2.1. A análise da documentação apresentada pelo requerente, assim como as respostas
  às não-

  conformidades, será feita respeitando-se a ordem cronológica de protocolo e chegada da

  mesma ao setor pertinente da ANAC.

  6.3.3. Se o requerente deixar de atender um ou mais requisitos que lhe permitiram o prosseguimento

  de fase, o processo poderá retornar à fase em questão até que seja comprovado novamente
  o

  atendimento dos referidos requisitos.

  6.3.4. Se o requerente pretender fazer alterações nas características do processo de certificação
  em

  curso acerca de quaisquer requisitos estabelecidos na Seção 142.21 do RBAC 142, o processo

  poderá retornar a fases anteriores, dependendo da complexidade da alteração.

  6.3.5. Durante o processo de certificação de CTAC ou no processo de alteração das respectivas

  Especificações de Treinamento de um certificado de CTAC, Manual de Instruções e

  Procedimentos (MIP) e outros documentos, respectivamente conforme seções 6 e 7 desta IS,

  deverá ser respeitado o máximo de três (3) interações de análise de material enviado nas
  fases

  2 e 3 do processo conforme os itens 6.5.2 e 6.5.3.

  6.4. Representantes e pessoas de contato da organização requerente

  6.4.1. As comunicações, interações e documentos inerentes ao processo de certificação, para
  todas

  as fases dispostas no item 6.5 desta IS, somente serão aceitos se realizados e assinados
  pelo

  gestor responsável pelo CTAC, conforme parágrafo 142.43(a)(1) do RBAC 142, utilizando os

  modelos dispostos no Anexo 1 desta IS.

  6.4.1.1. A apresentação das pessoas designadas como pessoal técnico e administrativo requerido
  deve

  ser feita por meio de relação contendo designação, instruções e procedimentos específicos
  no

  MIP, conforme o item 8.2.6.1 desta IS.

  6.4.2. O fornecimento de detalhes envolvendo atendimento de requisitos técnicos somente
  será feito

  ao gestor responsável ou coordenador de treinamento do CTAC, conforme parágrafos

  142.43(a)(1) e 142.43(a)(2) do RBAC 142.11 de julho de 2014 IS Nº 142-001

  Revisão A

  6.5. Descrição do processo de certificação

  6.5.1. Fase 1 - Solicitação Prévia

  6.5.1.1. Fase 1.1 - Solicitação de Informações'
