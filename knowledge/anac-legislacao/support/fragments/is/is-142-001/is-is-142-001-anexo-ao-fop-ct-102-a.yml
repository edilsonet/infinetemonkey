title: anexo-ao-fop-ct-102(a)
text: 'a) O objetivo da ROP é confirmar as informações fornecidas pelo requerente por meio
  dos

  FOP-CT 101 e 102, além de prover-lhe informações críticas sobre o processo e questões

  práticas. Ademais, também se constitui na oportunidade de esclarecer quaisquer dúvidas

  de ambas as partes relativas ao Pacote de Solicitação Formal (PSF), a ser entregue na

  Fase 2 do processo de certificação, conforme previsto no item 6.5.2 desta IS. Tanto o

  gestor responsável da empresa, como todo o pessoal administrativo requerido devem

  obrigatoriamente comparecer à ROP. Além disso, estes profissionais devem estar

  preparados para discutir, em termos gerais, os planos, os aspectos específicos das

  operações de treinamento pretendidas e, em especial, as datas propostas pelo requerente

  que serão acordadas para a condução do processo.11 de julho de 2014 IS Nº 142-001

  Revisão A'
