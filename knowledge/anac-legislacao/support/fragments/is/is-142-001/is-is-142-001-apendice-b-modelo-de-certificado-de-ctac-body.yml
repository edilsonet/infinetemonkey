text: 'APÊNDICE B - Modelo de certificado de CTAC.

  REPÚBLICA FEDERATIVA DO BRASIL

  FEDERATIVE REPUBLIC OF BRAZIL

  NACIONAL CIVIL AVIATION AGENCY - ANAC

  CERTIFICADO DE CENTRO DE TREINAMENTO

  TRAINING CENTER CERTIFICATE

  NÚMERO/NUMBER: XXXX-ANAC-YYY/ZZZZ

  BASE DE CERTIFICAÇÃO - RBAC 142

  CERTIFICATION BASIS - RBAC 142

  Este Certificado, emitido em favor do ABC, estabelecida na ABC, atesta que a Empresa cumpriu
  as normas,

  requisitos, regulamentos e padrões estabelecidos pela Agência Nacional de Aviação Civil
  - ANAC para certificação

  de Centro de Treinamento, segundo o RBAC 142.

  This Certificate, issued to ABC, whose business address is ABC, certifies that its organization
  has met the

  requirements established by the National Civil Aviation Agency to conduct training according
  to RBAC 142.

  O detentor deste Certificado deve conduzir seus treinamentos de acordo com o Código Brasileiro
  de Aeronáutica,

  as normas e os regulamentos aeronáuticos, bem como, com as condições e limitações contidas
  nas Especificações

  de Treinamento aprovadas.

  The Certificate holder shall conduct its training in accordance with the Brazilian Air Code,
  aeronautical rules and

  regulations, conditions and limitations contained in the approved Training Specifications.

  Este Certificado, emitido de acordo com a legislação em vigor, é válido até XX de XX de
  20XX, salvo em caso de

  cancelamento, suspensão ou revogação.

  This Certificate, issued according to the applicable aeronautical regulation, expires on
  XX XXst, 20XX, unless it is

  canceled, suspended or revoked.

  Local de emissão, data.

  Place of issue, date.

  __________________________________

  ABC Nome do responsável / Name of responsible

  ABC Função do responsável / Manager in Charge11 de julho de 2014 IS Nº 142-001

  Revisão A'
