text: 'APÊNDICE C - Modelo de Especificações de Treinamento.

  REPÚBLICA FEDERATIVA DO BRASIL

  (NATIONAL CIVIL AVIATION AGENCY- BRAZIL)

  ESPECIFICAÇÕES DE TREINAMENTO

  (TRAINING SPECIFICATIONS)

  .a Número:

  (Number) XXXX-ANAC-SPO/201X Revisão nº:

  (Revision #) XXX Data de aprovação:

  (Date of issue)

  DD-MM-AAAA

  MMM, DDth YYYY

  .b Localização, endereço do CTAC principal

  (Localization of principal training center)

  Estas Especificações de Treinamento são concedidas ao XXX, localizada no XXX, cuja base
  principal de

  treinamento está situada em:

  (These Training Specifications are issued to XXX, placed in XXX, whose principal Approved
  Training Center is situated

  in at:)

  Endereço do CTAC principal:

  (Primary Business Address)

  Endereço X.

  (Address X).

  .c Gestor responsável pelo CTAC

  (Primary point of contact)

  Nome

  (Name)

  Número de Telefone

  (Telephone number)

  Número de Fax

  (Fax-Símile number)

  Endereço de e-mail

  (e-mail address)

  X +XX-XX-XXXXXXXX +XX-XX-XXXXXXXX X

  .d Pessoal técnico e administrativo requerido

  (Management Personnel)

  O detentor deste certificado utiliza o pessoal técnico e administrativo requerido listado
  abaixo, conforme

  RBAC 142:

  (The certificate holder uses the following named personnel in the Title 14 Code of Federal
  Regulations (CFR) Part 142

  management positions listed below:)

  Cargo

  (Position title)

  Nome

  (Name)

  Número de Telefone

  (Telephone number)

  Endereço de e-mail

  (e-mail address)

  Coordenador de

  Treinam. X X X

  Gerente de Qualidade X X X

  Gerente SGSO X X X

  .e Atividades de Treinamento - RBAC

  (Training Activities - RBAC/FAR)

  O detentor destas Especificações de Treinamento é detentor do certificado de Centro de Treinamento
  de

  Aviação Civil nº XXXX-ANAC-SPO/201X, emitido em XX de XX de 201X, e será referenciado a
  seguir como

  detentor deste certificado.

  (The holder of this Training Specifications is the owner of Certified Training Center Certificate
  # XXXX-ANAC-

  SPO/201X, issued on MMM, DDth, YYYY and shall hereafter be referred to as the certificate
  holder.)

  Estas Especificações de Treinamento foram concedidas de acordo com a Seção 142.5, do RBAC
  142.

  (These Training Specifications are issued in accordance with RBAC 142 chapter 142.5.)

  O detentor deste Certificado deve conduzir suas operações conforme as autorizações, limitações
  e

  procedimentos constantes dessas especificações de treinamento e de acordo com a regulamentação

  vigente.11 de julho de 2014 IS Nº 142-001

  Revisão A

  (The certificate holder must conduct the training in accordance with the authorizations,
  limitations and procedures in

  these training specifications, and all effective regulations.)

  O detentor deste certificado está autorizado a conduzir as seguintes atividades de treinamento,
  conforme

  os regulamentos:

  (The certificate holder is authorized to conduct the following kinds of training activities,
  pursuant to listed Parts of the

  RBAC:)

  Atividades

  (Activities)

  Treinamentos de Solo e Voo

  (Ground School and Flight Training)

  Exames

  (Testing)

  Verificação de Proficiência

  (Checking)

  RBAC (FAR) XX - XX - XX

  .f Centros de Treinamento Satélites e Remotos Autorizados

  (Authorized Satellite and Remote Training Centers)

  O detentor deste certificado é autorizado nos seguintes centros de treinamento satélites
  de acordo com a

  Seção 142.37 do RBAC 142 e estas especificações de treinamento:

  (The certificate holder is authorized the following satellite training centers in accordance
