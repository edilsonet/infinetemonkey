title: OBJECTIVE
text: '1. OBJECTIVE

  Descrever o procedimento aceitável pela ANAC para a validação de centros de treinamento
  de aviação civil, localizados no exterior, certificados por autoridade de aviação civil
  estrangeira (CTAC estrangeiro), nos termos do RBAC nº 142.


  Describe the acceptable procedure by ANAC for validation of civil aviation training centers,
  located abroad, certified by foreign civil aviation authority (foreign CTAC) under the terms
  of RBAC No. 142.'
