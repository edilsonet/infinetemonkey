title: FINAL PROVISIONS
text: '11. FINAL PROVISIONS

  11.1 Os exames de proficiência de piloto realizados pelo CTAC validado conforme essa IS,
  são considerados como método alternativo ao previsto na IS 00-002 - Padrões para realização
  de exames de proficiência de pilotos ou documento que venha a substitui-la.


  11.1 Pilot proficiency checks conducted by the validated CTAC in accordance with this IS
  are considered as an alternative method to that provided for in Supplementary Instruction
  No. 00-002- “Standards for conducting pilot proficiency checks” or document that may replace
  it.

  11.2 O CTAC estrangeiro ou CTAC validado, conforme aplicável, que estiver em processo de
  validação ou renovação ou alteração do certificado de validação e/ou das especificações
  de treinamento, deverá se adequar até 120 dias da publicação desta IS.


  11.2 The foreign CTAC or validated CTAC, as applicable, that is in process of validation
  or renewal or amending the validation certificate and/or training specifications, shall
  comply with the provisions of this IS within 120 days from de date of the publication.

  11.3 Orientações preliminares podem ser obtidas por meio do correio eletrônico centrosdetreinamento@anac.gov.br.


  11.3. Preliminary guidelines can be obtained through the electronic mail centrosdetreinamento@anac.gov.br.

  11.4 Os casos omissos serão dirimidos pela SPL.


  11.4 Cases not covered by this IS will be resolved by the Department of Civil Aviation Personnel
  (SPL).

  11.5 Essa IS entra em vigor em .


  11.5 This Supplementary Instruction takes effect on dd/mm/yyyy.'
