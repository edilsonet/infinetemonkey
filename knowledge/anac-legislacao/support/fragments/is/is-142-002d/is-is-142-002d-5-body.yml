title: PURPOSES OF VALIDATION
text: '5. PURPOSES OF VALIDATION

  5.1 A validação de CTAC estrangeiros pela ANAC é um dispositivo previsto no RBAC 142.


  5.1 The validation of foreign training centers carried out by ANAC is provided for in RBAC
  142.

  5.2 Por meio do processo de validação, a ANAC reconhece a certificação estrangeira como
  equivalente à certificação brasileira, e autoriza o CTAC validado a ministrar treinamentos
  e exames que tenham por fim a concessão ou revalidação de habilitações brasileiras ou qualificação
  de tripulantes.


  5.2 Through the validation process, ANAC recognizes the foreign training center certification
  as equivalent to the Brazilian certification and authorizes the validated CTAC to conduct
  trainings and examinations which aim the granting or renewal of Brazilian ratings or crewmember
  qualifications.

  5.3 O examinador designado por autoridade de aviação civil estrangeira vinculado a um CTAC
  validado, possui as prerrogativas do examinador credenciado pela ANAC somente para conduzir
  exames de proficiência que tenham a finalidade de concessão ou revalidação de habilitações
  brasileiras ou qualificação de tripulantes.


  5.3 The examiner designated by foreign civil aviation authority related to a validated CTAC,
  has the privileges of accredited examiner appointed by ANAC only to conduct proficiency
  checks aimed at granting or revalidating Brazilian ratings or crew member qualification.

  5.4 O processo de validação fundamenta-se na similaridade entre a regulamentação brasileira
  e a regulamentação estrangeira sob a qual o CTAC estrangeiro se encontra originalmente certificado.


  5.4 The validation process is based on the similarity between Brazilian regulations and
  foreign regulations under which the foreign CTAC is originally certified.


  5.5 Considera-se similar, a regulamentação estrangeira que não apresente, em relação à regulamentação
  brasileira, diferenças capazes de implicar em redução da qualidade ou da segurança do treinamento
  ministrado.


  5.5 It is considered similar, the foreign regulations that do not present, in relation to
  Brazilian regulations, differences capable of implying in reducing the quality or safety
  of the training performed.'
