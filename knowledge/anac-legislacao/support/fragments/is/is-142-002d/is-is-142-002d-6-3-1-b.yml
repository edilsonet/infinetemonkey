title: 6.3.1(b)
text: '(b) A ANAC ao receber os documentos realiza a análise prévia.

  I- Se a análise for favorável, a ANAC informará ao CTAC estrangeiro para prosseguir para
  a FASE II.

  II- Caso a documentação não esteja em conformidade com o previsto nesta IS, a ANAC informará
  ao CTAC estrangeiro o motivo do indeferimento do processo.'
