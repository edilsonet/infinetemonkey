cite: 6.3.2(a)
title: 6.3.2(a)
text: 'a) O CTAC estrangeiro encaminha a ANAC via e-mail centrosdetreinamento@anac.gov.br
  os documentos listados abaixo:

  I - Cópia do certificado de CTAC estrangeiro válido;

  II - Cópia das especificações de treinamento ou documento equivalente, que indique os treinamentos
  que o CTAC estrangeiro está autorizado a realizar;

  III - Disponibilização de acesso à lista atualizada dos Equipamentos de Treinamento utilizados
  em seu programa de treinamento;

  IV - Lista dos instrutores que atuam no CTAC estrangeiro nos treinamentos a serem validados;

  V - Disponibilização de acesso à lista atualizada dos examinadores designados para atuarem
  junto ao CTAC estrangeiro nos treinamentos a serem validados, contendo as informações referentes
  às cartas de autorização ou designação válidas;

  VI - Cópia eletrônica ou disponibilização de acesso aos programas de treinamento relativos
  aos currículos para os quais se requer a validação;

  VII - Cópia eletrônica da ficha de avaliação de piloto aprovada pela autoridade de aviação
  civil estrangeira, caso o CTAC estrangeiro prefira utilizá-la em Exames de Proficiência,
  ao invés da ficha de avaliação de piloto da ANAC constante na Apêndice D dessa IS, ou constante
  na IS 00-002.'
