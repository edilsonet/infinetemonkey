title: 6.3.3(a)
text: 'a) Upon receiving the documents provided for in item 6.3.2(a), ANAC begins the analysis
  and:

  I - If the documentation is complete and acceptable, the process advances to phase IV or
  V, as applicable.

  II - If the verified documentation does not comply with the provisions o of this Supplementary
  Instruction-IS, the foreign CTAC will be informed of the verified non-compliance, requesting
  its adequacy within 30 days, if applicable, after which the process will be rejected.

  III - In case ANAC decides to reject the validation request, the decision will be communicated
  to the foreign CTAC.'
