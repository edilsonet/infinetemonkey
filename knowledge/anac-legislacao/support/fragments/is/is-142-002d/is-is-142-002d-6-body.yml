text: '6. VALIDATION PROCESS

  6.1 O processo de validação de CTAC estrangeiro será realizado em cinco fases, conforme
  descrito nessa seção.


  6.1 Foreign CTAC validation process will be carry out in five phases, as described in this
  section.

  6.2 Em qualquer fase poderá ser solicitado ao CTAC estrangeiro ou à autoridade de aviação
  civil responsável por sua certificação, quaisquer informações ou documentos adicionais que
  se façam necessários à análise do pedido de validação.


  6.2 At any phase, it may be requested from the foreign CTAC or the civil aviation authority
  responsible for its certification, any additional information or documents that may be necessary
  for the analysis of the validation request.

