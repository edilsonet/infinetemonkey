title: 7(b)
text: (b) Permitir à ANAC, durante atividades de vigilância presencial acesso às suas instalações,
  documentações e sistemas informatizados, conforme requerido, a fim de possibilitar a verificação
  dos treinamentos e exames de proficiência de tripulantes brasileiros, bem como dos equipamentos
  de treinamento utilizados;
