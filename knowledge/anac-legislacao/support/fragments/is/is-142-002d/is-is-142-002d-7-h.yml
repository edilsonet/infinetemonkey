section_title: DUTIES OF THE VALIDATED CTAC
subsection_id: h
cite: 7(h)
title: 7(h)
text: h) Ao término dos treinamentos, com aproveitamento satisfatório, que tenham por fim
  a concessão ou revalidação de habilitações brasileiras ou qualificação de tripulante, fornecer
  ao aluno, em via impressa ou digital, um certificado de conclusão de treinamento e respectivos
  registros, informando a duração do treinamento de solo e as horas de voo realizadas na função
  de piloto em comando (PF) e/ou segundo em comando (PM), ambos em idioma inglês ou português
  e a ficha de avaliação de piloto dos exame de proficiência, conforme mencionado no item
  anterior. A emissão dos documentos acima deve significar que os conhecimentos teóricos e
  a proficiência técnica do aluno foram examinados pelo CTAC validado.
