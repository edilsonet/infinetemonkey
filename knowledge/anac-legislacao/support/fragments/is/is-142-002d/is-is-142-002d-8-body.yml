title: VALIDITY OF THE CERTIFICATE
text: '8. VALIDITY OF THE CERTIFICATE

  8.1 O Certificado de validação de CTAC e as respectivas especificações de treinamento emitidos
  pela ANAC, possuem a validade prevista no RBAC 142, contadas a partir da data da emissão
  do Certificado.


  8.1 CTAC validation certificate and the respective training specifications issued by ANAC,
  have the validity provided for in RBAC 142, counted from the date of issue of the Certificate.

  8.2 A realização de treinamentos que tenham por fim a concessão ou revalidação de habilitações
  brasileiras ou qualificação de tripulantes, condiciona-se sempre à validade e às limitações
  do certificado de validação e respectivas especificações de treinamento emitidos pela ANAC.


  8.2 Conducting training aimed at granting or revalidating Brazilian ratings or flight crew
  qualification is always conditioned to the validity and limitations of the validation certificate
  and respective training specifications issued by ANAC.

  8.3 Caso o certificado de CTAC estrangeiro emitido pela respectiva autoridade de aviação
  civil estrangeira, incluindo suas autorizações e limitações seja suspenso, revogado, cassado
  ou perca seus efeitos por qualquer motivo, o CTAC validado fica impedido de ministrar treinamentos
  que tenham por fim a concessão ou revalidação de habilitações brasileiras ou qualificação
  de tripulantes. Quaisquer treinamentos ministrados sob tais condições serão considerados
  inválidos para todos os fins perante a ANAC.


  8.3 If the foreign CTAC certificate issued by the respective foreign civil aviation authority,
  including its authorizations and limitations, is suspended, revoked, or has been render
  ineffective for any reason, the validated CTAC is prevented from providing training aimed
  at granting or revalidating Brazilian ratings or crew members qualifications. Any training
  given under such conditions will be considered invalid by ANAC for all purposes.

  8.4 A ANAC pode, a qualquer momento, revogar unilateralmente o certificado de CTAC validado,
  caso considere que a segurança ou a qualidade do treinamento esteja comprometida, ou caso
  haja evidências de que o CTAC tenha apresentado informações falsas, incompletas ou deixado
  de fornecer informações relevantes à ANAC.


  8.4 At any time ANAC may revoke the validated CTAC Certificate if the Agency considers that
  safety or quality of the training is jeopardized, or if there are evidences that training
  center has submitted false or incomplete information, or it has ceased to provide relevant
  information to ANAC.'
