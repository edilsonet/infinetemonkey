title: 9(b)
text: 'b) Documents listed in paragraph 6.3.2(a) affected by changes.

  9.5 Nos casos previstos em 9.1 e 9.4 a ANAC poderá realizar uma inspeção presencial conforme
  previsto no RBAC 142 e, neste caso, será informada ao CTAC validado.


  9.5 In the cases provided for in items 9.1 and 9.4, ANAC may carry out an on-site inspection
  in accordance with RBAC No.142. In this situation, the validated CTAC is informed.

  9.6 Caso seja verificada alguma não conformidade conforme o previsto nesta IS, será informada
  ao CTAC validado a não conformidade verificada, solicitando sua adequação no prazo de 30
  dias, findo o qual o processo será indeferido.


  9.6 If any non-compliance is verified as provided for in this IS, the foreign CTAC is notified
  and a period of 30 days is given for adequacy. Failure to comply with the deadline results
  in process rejection.'
