text: '9. RENEWAL / AMENDMENT OF CERTIFICATE and/or TRAINING SPECIFICATIONS

  9.1 RENOVAÇÃO

  O CTAC validado deverá solicitar a renovação do Certificado de Validação até 60 dias antes
  do vencimento, devendo preencher e encaminhar a ANAC via e-mail centrosdetreinamento@anac.gov.br
  os seguintes documentos:


  9.1 RENEWAL

  The validated CTAC must request the renewal of the Validation Certificate up to 60 days
