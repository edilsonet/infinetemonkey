text: c) Cópia das especificações de treinamento ou documento equivalente, que indique todos
  os treinamentos que o CTAC validado está autorizado a realizar, bem como informação dos
  Dispositivos de Treinamento Para Simulação de Voo - FSTD utilizados em seu programa de treinamento,
  além de quaisquer demais autorizações, limitações, validades e condições especiais às quais
  o CTAC estrangeiro esteja sujeito;
