title: 9(f)
text: 'f) Electronic copy or means for the access to training programs related to the curriculum
  for which validation is required.


  9.2 Caso o CTAC validado solicite a renovação do Certificado de Validação com antecedência
  menor do que 60 dias para a data de vencimento, a emissão do novo certificado poderá ocorrer
  somente após a da data de vencimento do certificado vigente.


  9.2 If the validated CTAC requests the renewal of the Validation Certificate with less than
  60 days before the expiration date, the issue of the new certificate may occur only after
  the expiration date of the current certificate.

  9.3 Caso a validade do Certificado de Validação tenha expirado, o CTAC validado para solicitar
  a sua renovação deverá cumprir o previsto em 9.1 desta IS, podendo a ANAC solicitar quaisquer
  documentos adicionais como requerido no item 6.


  9.3 If the validity of the Validation Certificate has expired, the validated CTAC to request
  its renewal, must comply with the provisions of 9.1 of this IS, and ANAC may request any
  additional documents as required in item 6.

  9.4 ALTERAÇÃO: Para solicitar uma alteração no Certificado de Validação e / ou nas Especificações
  de Treinamento emitidas pela ANAC, o CTAC validado deverá encaminhar a ANAC, via e-mail
  centrosdetreinamento@anac.gov.br, os seguintes documentos:


