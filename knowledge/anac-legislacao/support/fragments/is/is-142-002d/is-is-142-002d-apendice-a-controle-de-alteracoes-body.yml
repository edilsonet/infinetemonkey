title: APÊNDICE A - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES

  APPENDIX A - AMENDMENT CONTROL


  ALTERAÇÕES REALIZADAS NA REVISÃO C

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  4

  Inclusão de definições.

  5.2

  Texto alterado para melhor clareza e definição.

  5.3

  Texto alterado para melhor clareza e definição.

  5.4

  Texto alterado para melhor clareza e definição.

  6.1

  Alteração no texto com a inclusão de processo de 5 fases para validação de CTAC, conforme
  estabelecido no DOC 9841. A fase de solicitação é tratada nos parágrafos 6.3.1 e 6.3.2 da
  Rev. D.

  6.2

  A fase de análise é tratada nos parágrafos 6.3.3 e 6.3.4 da Rev. D.

  6.3

  A fase de Decisão é tratada no parágrafo 6.3.5. da Rev. D.

  7.

  Inclusão de novos deveres do CTAC.

  8

  Texto alterado para melhor clareza e definição

  9.

  Os Apêndices na rev. D são apresentados na seção 10. A seção 9 da rev. D provê instruções
  para alteração e renovação do Certificado e Especificação de Treinamento.

  10

  As Disposições Finais são apresentadas na seção 11 da rev. D.

  Ap. A

  Texto alterado.

  Ap. B

  Texto alterado.

  Ap. C

  Texto alterado para incluir o modelo de Declaração de Conformidade. .

  -

  Inclusão do Apêndice D contendo um modelo de FAP.'
