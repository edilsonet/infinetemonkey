text: 'APÊNDICE C - DECLARAÇÃO DE CONFORMIDADE

  APPENDIX C - STATEMENT OF COMPLIANCE


  To initiate the validation process to obtain a foreign CTAC certificate and respective Training
  Specifications, the applicant must inform ANAC that it complies with the initial requirements
  listed in this Statement of Compliance.

  This Statement of Compliance also serves as a gap analysis between Brazilian Regulation
  and the National Regulation of the country responsible for the foreign CTAC primary certification.


  The Statement of Compliance is divided in:

  Item 1 General Information

  Item 2 Instructor and Evaluator Training and Qualification

  Item 3 Courseware

  Item 4 Training Programs

  Item 5 Flight Training Equipment

  Item 6 Records

  Item 7 Quality Control Program

  Item 8 Proficiency Check


  Filling Instructions

  For each item in the table below, please evaluate the Brazilian requirement and inform in
  column “National Regulation” the correspondent regulation, guidance or other regulatory
  material of the country responsible for the foreign CTAC primary certification.


  The Compliance column shall be filled as follows:

  Y (Yes): In case Brazilian regulation and National regulation are similar and the foreign
  CTAC totally complies with that requirement.

  P (Partially): In case Brazilian regulation and National regulation are not similar, but
  the foreign CTAC may still comply with Brazilian regulation.

  N (No): In case there is no correspondent requirement in National regulation, or the foreign
  CTAC does not comply with the requirement.

  NA (Not applicable): In case the requirement is not applicable for the CTAC.

  For P, N and NA, use the column “Additional Information” to explain the differences or to
  provide any additional information.


  Please contact centrosdetreinamnto@anac.gov.br should you have any difficulty when filling
  this form.'
