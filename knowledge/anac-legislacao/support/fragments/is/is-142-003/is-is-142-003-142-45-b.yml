title: 142.45(b)
text: 'b) documentação comprobatória da realização do curso inicial ou periódico de

  examinador, conforme aplicável.

  Após a análise dos documentos acima, o processo seguirá os trâmites internos da ANAC

  para a programação do voo de observação.

  5.4. UTILIZAÇÃO DO SISTEMA SISHAB

  5.4.1. Todos os treinamentos iniciais e periódicos envolvendo instrutores e examinadores

  devem ser cadastrados pelo CTAC no sistema SISHAB disponível em:

  https://sistemas.anac.gov.br/SACI/Index.asp.

  5.4.2. As orientações para utilização do SISHAB estão dispostas na IS n° 61-007.

  5.5. SANÇÕES ADMINISTRATIVASData de emissão: 15 de maio de 2020 IS nº 142-003

  Revisão B

  5.5.1. A atuação de instrutor ou examinador em desacordo com as provisões do RBAC nº 142

  sujeitará o CTAC e o instrutor/examinador às sanções previstas no Compêndio de

  Elementos de Fiscalização do RBAC nº 142.

  5.5.2. A ANAC pode suspender ou revogar as prerrogativas de um instrutor ou examinador

  quando constatar que este não desempenhou adequadamente suas atividades, conforme

  procedimentos e limitações definidos pela ANAC ou em violação a algum regulamento.'
