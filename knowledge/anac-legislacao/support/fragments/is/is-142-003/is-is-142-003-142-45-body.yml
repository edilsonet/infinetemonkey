text: '142.45 do RBAC nº 142.

  5.3.4. Processo de credenciamento de examinadores: o CTAC deve encaminhar a solicitação
  de

  credenciamento de examinadores à Coordenadoria de Centros de Treinamento de

  Aviação Civil (CCTAC/GCOI/SPO), via protocolo do sistema SEI. O formulário

  eletrônico deve informar o número da notificação de treinamento (NRT) cadastrada no

  SISHAB, a data proposta para a realização do exame de observação, e apresentar os

  seguintes documentos:'
