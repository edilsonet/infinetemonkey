text: '4. DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidas as definições listadas no RBAC nº 01, RBAC nº
  142

  e as seguintes definições.

  4.1.1. Instrutor de solo. Significa uma pessoa vinculada a um CTAC, aprovada pela ANAC

  para ministrar instrução, não caracterizada como treinamento de voo, em parte ou na

  totalidade de um currículo aprovado (base, especializado ou outros cursos).Data de emissão:
  15 de maio de 2020 IS nº 142-003

  Revisão B

  4.1.2. Instrutor de voo. Significa uma pessoa vinculada a um CTAC, aprovada pela ANAC

  para ministrar treinamento do voo em FSTD ou em aeronave. Os instrutores de voo

  possuem a prerrogativa de ministrar instrução de solo nos cursos relacionados a

  equipamentos para os quais estão autorizados a ministrar instrução de voo.

  4.1.3. Colaborador com notório conhecimento. Pessoa com notório conhecimento em área

  específica, designada pelo Coordenador de Treinamento, a fim de dar suporte em parte

  de uma instrução teórica.'
