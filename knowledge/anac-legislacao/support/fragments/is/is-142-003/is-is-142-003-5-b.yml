title: 5(b)
text: 'b) Os assuntos apresentados em 142.45(d)(3) (vi), (vii), (viii), (ix) e (x) são aplicáveis

  apenas à instrutores de voo que ministram instrução em aeronave.

  5.1.6.4. A carga horária de oito horas estabelecida no parágrafo (3) da seção 142.45(d)
  visa

  atender aos dez assuntos contidos nesse parágrafo. A depender do tipo de instrução a qual

  o instrutor se habilitará, a carga horária pode ser reduzida, na proporção adequada, a fim

  de atender ao estabelecido no item 5.1.6.3 acima.Data de emissão: 15 de maio de 2020 IS
  nº 142-003

  Revisão B

  5.1.6.5. O parágrafo 142.45(d)(4) estabelece a obrigatoriedade do curso de IOS (Instructor

  Operation Station) a todos os instrutores de voo que utilizam FSTD. A instrução de IOS

  nos treinamentos iniciais deve ser ministrada em sessões dedicadas à essa finalidade.

  Durante os treinamentos recorrentes de IOS a instrução poderá ser ministrada durante a

  aplicação de um programa de treinamento aprovado.

  5.1.6.6. O parágrafo 142.45(d)(5) é aplicável exclusivamente à instrutores de voo que ministram

  instrução em aeronave.

  5.1.7. Da Cronologia dos prazos

  5.1.7.1. A demonstração de competência estabelecida em 142.45(d)(2) deve ser realizada após
  a

  conclusão satisfatória das demais etapas de treinamento, uma vez que os elementos de

  competências avaliados pelo observador estão relacionados às etapas de treinamento.

  Nota: o treinamento orientado para operação em rota (LOFT) estabelecido em 142.45(f) pode

  ser ministrado após o exame de observação sem prejuízo ao item 5.1.7.1.

  5.1.7.2. Para alinhamento de eventuais defasagens nas datas de conclusão das etapas de

  treinamento e exame estabelecidas em 142.45(c), (d) e (e) e o prazo de vencimento da

  aprovação de instrutor emitida pela ANAC considera-se que a conclusão de todas as

  etapas de treinamento coincide com a data do exame de observação do instrutor.

  5.1.7.3. As etapas de qualificação do candidato à instrutor, descritas em 142.45(c), (d)
  e (e),

  devem ser concluídas dentro do período de 90 dias contados a partir do início da primeira

  etapa do treinamento.

  5.2. TREINAMENTO REQUERIDO PARA O CREDENCIAMENTO DE

  EXAMINADORES

  5.2.1. Esta seção destaca os elementos necessários para a elaboração dos procedimentos a
  serem

  dispostos no manual de instruções e procedimentos (MIP) do CTAC, a fim de garantir a

  qualificação dos examinadores credenciados vinculados a um CTAC.

  5.2.2. Os examinadores credenciados devem atender aos requisitos estabelecidos aos instrutores

  de voo, conforme estabelecidos na seção 142.45 do RBAC nº 142 e no item 5 desta IS.

  5.2.3. A aprovação requerida em 142.47(b)(1) está condicionada a realização de um voo de

  observação em que o candidato deve demonstrar a um examinador designado pela ANAC,

  a competência para execução de um exame conforme os padrões apresentados na IS 00-

  002.

  Nota: O exame de observação acima citado pode, excepcionalmente, ser realizado por outro

  examinador credenciado vinculado ao mesmo CTAC desde que autorizado previamente

  pela ANAC.

  5.2.4. A carga horária do treinamento estabelecido no parágrafo 142.47(b)(4) não é passível
  de

  redução. Ao término do treinamento o candidato deve ser submetido a uma avaliação que

  contemple os assuntos apresentados no parágrafo citado.Data de emissão: 15 de maio de 2020
  IS nº 142-003

  Revisão B

  5.3. SOLICITAÇÃO DE APROVAÇÃO DE INSTRUTORES E CREDENCIAMENTO

  DE EXAMINADORES À ANAC

  5.3.1. As solicitações de aprovação de instrutores de voo e de credenciamento de examinadores

  devem ser apresentadas individualmente para cada tripulante, podendo agrupar mais de

  um equipamento.

  5.3.2. As solicitações de aprovação de instrutores de solo devem ser individuais, contemplando

  todos os cursos para os quais o candidato terá designação.

  5.3.3. Processo de aprovação de instrutores: o CTAC deve encaminhar a solicitação de

  aprovação de instrutores à Coordenadoria de Centros de Treinamento de Aviação Civil

  (CCTAC/GCOI/SPO), via protocolo do sistema SEI. O formulário eletrônico deve

  informar os números da notificação de treinamento (NRT) e da solicitação de exame

  (SAE) cadastradas no SISHAB e apresentar os seguintes documentos:'
