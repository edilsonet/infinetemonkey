title: DESENVOLVIMENTO DO ASSUNTO
text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1. TREINAMENTO REQUERIDO PARA APROVAÇÃO DE INSTRUTORES

  5.1.1. Esta seção destaca os elementos necessários para a elaboração dos procedimentos a
  serem

  dispostos no Manual de Instruções e Procedimentos (MIP) do CTAC, a fim de garantir a

  qualificação dos seus instrutores.

  5.1.2. Todos os instrutores devem ser aprovados pela ANAC, conforme estabelecido no

  parágrafo (l) da seção 142.43 do RBAC nº 142.

  5.1.3. O gestor responsável deve designar cada instrutor individualmente, especificando
  em que

  curso será alocado, conforme estabelecido no parágrafo (b) da seção 142.45 do RBAC nº

  142.

  5.1.4. O emprego de Colaborador com Notório Conhecimento não substitui o instrutor de solo,

  e tem caráter complementar em uma instrução teórica. Se faz mediante designação do

  Coordenador de Treinamento, não sendo necessária sua aprovação junto à ANAC.

  Exemplo de utilização: é possível designar um médico para detalhar procedimentos de

  primeiros socorros ou designar um despachante operacional de voo para expor

  informações complementares ou experiências a fim de enriquecer o curso.

  5.1.5. Aplicabilidade do parágrafo 142.45(c):

  5.1.5.1. O parágrafo 142.45 (c) estabelece assuntos necessários para a qualificação inicial
  dos

  instrutores de CTAC. A seguir são apresentadas informações complementares acerca

  desses assuntos, de modo a permitir a aplicabilidade e a distinção entre eles:

  (1) Métodos e técnicas de instrução. Trata das questões relacionadas aos aspectos

  didáticos da instrução.

  (2) Treinamento de normas e procedimentos. Trata das políticas adotadas pelo

  CTAC relativas à condução de seus treinamentos, como por exemplo, uso de

  formulários e suas distribuições, condução de briefings e debriefings, orientações

  acerca do desempenho insatisfatório do aluno, limitações e regras para composição

  de tripulações, duração máxima do dia de treinamento, uso de listas de verificação,

  manuseio dos material instrucional dos clientes, entre outros assuntos relacionados,

  à critério do CTAC, e que devem ser listados como tópicos na descrição do assunto.

  (3) Princípios fundamentais do processo de aprendizagem. Trata de questões

  pedagógicas e podem estar relacionadas ao assunto “métodos e técnicas de

  instrução”. O programa deve descrever os tópicos sobre o assunto.Data de emissão: 15 de
  maio de 2020 IS nº 142-003

  Revisão B

  (4) Deveres, prerrogativas, responsabilidades e limitações do instrutor. Aborda as

  relações com o cliente, agendamentos e escala, regulamentos e normas

  complementares da ANAC relacionados à sua função, etc.

  (5) Operação de controles e sistemas de simulação. Trata da operação adequada do

  FSTD, incluindo seus controles, limitações, registros de utilização, discrepâncias e

  MEL.

  (6) Operação de controle ambiental. Aborda assuntos relacionados à operação

  adequada dos controles de ajuste das condições ambientais nos cenários de

  simulação (por exemplo, pressão atmosférica, direção e velocidade do vento,

  visibilidade, condições de pista, chuva, neve, entre outros parâmetros) e dos painéis

  de programação de falhas;

  (7) Limitações de simulação. Aborda tópicos relacionados, entre outros, a

  movimentos da aeronave que não podem ser fielmente reproduzidos no simulador

  e aos efeitos fisiológicos que podem ser causados em função da simulação

  (diferença entre o que se vê e o que se sente).

  (8) Requisitos de equipamentos mínimos para cada currículo. Aborda tópicos

  relacionados aos recursos instrucionais de sala de aula, operação de computadores

  e sistemas audiovisuais, procedimentos em caso de recurso instrucional

  indisponível, métodos de apresentação alternativos aceitáveis, etc.

  (9) Revisões de cursos. Aborda procedimentos para que o instrutor conheça e revise

  periodicamente o conteúdo de cada currículo de treinamento no qual atua (por

  exemplo: lições, áreas de ênfase, exercícios, etc.). Inclui também instruções sobre

  como solicitar alterações nos cursos, processo de alteração, como verificar a

  vigência do material instrucional do CTAC ou do cliente, etc.

  (10) Gerenciamento de recursos de cabine (CRM) e coordenação de tripulação.

  Aborda conceitos e noções gerais sobre o assunto.

  (11) Objetivos e resultados a atingir ao finalizar cada curso aprovado para o qual

  for designado. Aborda a avaliação do desempenho do aluno (o que se espera dele

  ao final do curso); política do CTAC sobre relatórios de desempenho do aluno;

  política do cliente sobre relatórios de desempenho do aluno, ações corretivas no

  caso de desempenho abaixo do padrão, etc.

  (12) Provisões aplicáveis a este Regulamento, aos RBAC nº 61 e nº 65, ao RBHA 63,

  ou RBAC que venham a substituí-lo, e a outros regulamentos pertinentes,

  conforme correspondam aos cursos a desenvolver. Aborda noções sobre os

  regulamentos e normas complementares que têm impacto direto na atividade do

  instrutor - relaciona-se com o conteúdo do item (4).

  5.1.5.2. Considerando a descrição dos assuntos apresentados em 5.1.5.1, infere-se que os
  assuntos

  descritos em 142.45(c)(5), (6) e (7) são aplicáveis exclusivamente à instrutores de voo

  que ministram instrução em FSTD, mas podem ser requeridos à um instrutor de solo

  quando este utilizar recursos de FSTD (instrução prática não caracterizada como

  treinamento de voo).

  5.1.5.3. Os demais assuntos, descritos em 142.45(c) (1), (2), (3), (4), (8), (9), (10),
  (11) e (12) são

  aplicáveis a todos os instrutores - seja de solo ou de voo.Data de emissão: 15 de maio de
  2020 IS nº 142-003

  Revisão B

  5.1.5.4. A carga horária de oito horas estabelecida no parágrafo (c) da seção 142.45 visa
  atender

  aos doze assuntos contidos nesse parágrafo. A depender do tipo de instrução a qual o

  instrutor se habilitará, a carga horária pode ser reduzida, na proporção adequada, a fim
  de

  atender aos assuntos citados em 5.1.5.1.

  5.1.6. Aplicabilidade do parágrafo 142.45(d)

  5.1.6.1. O exame teórico e a demonstração de competência requeridos em 142.45(d)(1) e 142.45'
