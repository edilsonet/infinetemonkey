text: '(d)(2), respectivamente, estão relacionados exclusivamente as atividades do instrutor
  de

  voo.

  5.1.6.2. Parte significante dos assuntos descritos no parágrafo 142.45(c) está contida no
  parágrafo

  142.45(d), exceção aos itens (9), (11) e (12). Diante disso, os créditos obtidos através
  do

  atendimento aos itens listados em 142.45 (c), no que forem equivalentes, devem ser

  considerados para o cumprimento dos itens previstos em 142.45(d) e vice-versa,

  conforme a tabela de correspondência abaixo:

  142.45(c) 142.45(d)

  (1) métodos e técnicas de instrução (3)(ii) elementos de ensino efetivo, métodos

  e técnicas de treinamento

  (2) treinamento de normas e procedimentos (3)(iv) política e procedimentos do

  treinamento

  (3) princípios fundamentais do processo de

  aprendizagem

  (3)(i) princípios fundamentais do processo

  de aprendizagem

  (4) deveres, prerrogativas, responsabilidades

  e limitações do instrutor

  (3)(iii) deveres, prerrogativas,

  responsabilidades e limitações do instrutor

  (5) operação de controles e sistemas de

  simulação

  (4)(i) operação, controles e sistemas do

  dispositivo de treinamento para simulação

  de voo

  (6) operação de controle ambiental (4)(ii) operação adequada do ambiente da

  cabine e painéis de pane

  (7) limitações de simulação (4)(iii) limitações de simulação

  (8) requisitos de equipamentos mínimos para

  cada currículo

  (4)(iv) equipamentos mínimos requeridos

  para cada currículo

  (10) gerenciamento de recursos de cabine

  (CRM) e coordenação de tripulação

  (3)(v) gerenciamento dos recursos de cabine

  (CRM) e coordenação de tripulação

  5.1.6.3. O parágrafo 142.45(d)(3) apresenta assuntos requeridos à formação e à requalificação
  de

  instrutores de solo e instrutores de voo, sem especificar sua aplicabilidade. Desta forma

  faz-se necessário relacionar os assuntos às funções exercidas pelos instrutores:'
