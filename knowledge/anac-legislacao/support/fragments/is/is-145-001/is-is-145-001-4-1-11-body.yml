text: '4.1.11 Requerente: uma pessoa, ao aplicar um processo de certificação junto à ANAC,
  é denominada “requerente”.

  4.1.12 Responsável Técnico(a) em uma OM - RT: pessoa com registro no respectivo conselho
  de fiscalização da profissão que assume responsabilidade técnica por serviços realizados
  por uma pessoa jurídica, conforme previsto pelos Conselhos e, para efeitos do RBAC nº 145,
  está em conformidade com os requisitos adicionais estabelecidos no Apêndice A-I do RBAC
  nº 145.

  4.1.13 Revisão geral: serviço realizado em uma aeronave ou uma célula, motor, hélice, acessório,
  componente ou parte de uma aeronave, desde que o artigo tenha sido:'
