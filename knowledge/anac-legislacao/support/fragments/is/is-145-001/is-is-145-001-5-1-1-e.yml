title: 5.1.1(e)
text: 'e) FASE 5 - Certificação.

  5.2 FASE 1 - Contato Inicial

  5.2.1 O requerente deve, inicialmente, fazer um contato com a Superintendência de Padrões
  Operacionais - SPO, por meio da Gerência Técnica de Certificação de Organizações de Manutenção
  - GTOM. Nesta fase podem ser dirimidas dúvidas e indicadas as referências básicas (regulamentares,
  normas técnicas) pertinentes para a abertura do processo de certificação. A pessoa interessada
  em explorar serviços de manutenção, manutenção preventiva e alterações, segundo os requisitos
  do RBAC nº 145, deve agendar diretamente com a GTOM uma data para a reunião inicial/abertura
  do processo. A critério da ANAC, a reunião poderá ser realizada de forma virtual.

  5.3 FASE 2 - Reunião Inicial/Abertura do Processo'
