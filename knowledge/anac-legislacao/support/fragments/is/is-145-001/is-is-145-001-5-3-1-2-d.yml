section_id: 5.3.1.2
section_title: 'A reunião inicial visa:'
subsection_id: d
cite: 5.3.1.2(d)
title: 5.3.1.2(d)
text: 'd) a previsão de entrega do documento de solicitação formal de abertura do processo
  de certificação, com seus anexos aplicáveis.

  5.3.1.3 O(a) GR, o(a) RT e o(a) GSO devem estar preparados para discutir, durante a reunião
  inicial, todos os aspectos concernentes à certificação da OM e devem estar familiarizados
  com os RBAC e IS aplicáveis.

  NOTA: o(a) GR, o(a) RT e o(a) GSO devem, já no momento da reunião inicial, apresentar a
  forma de vínculo com o requerente.

  5.3.1.4 Caso sejam contratadas assessorias para a confecção dos manuais da OM, as pessoas
  dessas assessorias podem participar do processo somente como ouvintes. Entretanto, em nenhum
  momento, as pessoas dessas assessorias podem participar do processo de certificação. Após
  a emissão do Certificado, todos os contatos com a ANAC, solicitações e respostas, envolvendo
  assuntos constantes dos RBAC e IS aplicáveis, devem ser feitos diretamente pelo(a) GR ou
  o(a) RT, de acordo com um procedimento descrito nos manuais da OM.

  5.3.1.5 Conforme previsto na seção 145.151 do RBAC nº 145, a qualquer tempo a ANAC pode
  não aceitar o Gestor Responsável, Gestor do SGSO e RT, nos casos de comprovado histórico
  de conduta ou desempenho inadequados. O detentor de certificado (ou candidato a um certificado)
  deve, mediante determinação da ANAC, no prazo de 30 (trinta) dias, extensível pela ANAC
  por igual período, substituir qualquer pessoa que ocupe uma posição de Gestor Responsável,
  Gestor do SGSO e RT, e que possua comprovado histórico de conduta e/ou desempenho inadequados,
  conforme os critérios estabelecidos na seção 145.151 do RBAC nº 145. O item 5.3.2.2 g) desta
  IS apresenta informações detalhadas sobre o cadastro dos profissionais GR, RT e GSO.'
