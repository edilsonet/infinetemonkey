title: Reunião inicial
text: '5.3.1 Reunião inicial

  5.3.1.1 A reunião inicial deve ser realizada com a GTOM. Essa reunião somente pode ocorrer
  com a presença das demais pessoas que são indicadas pelo requerente. Obrigatoriamente essas
  pessoas são: o Gestor(a) Responsável - GR, Responsável Técnico(a) - RT e Gestor(a) do SGSO
  - GSO. Também podem comparecer outros profissionais que ocupam altas funções administrativas
  na empresa (Presidente, Vice-Presidente, Diretor(a) Técnico(a), etc.).'
