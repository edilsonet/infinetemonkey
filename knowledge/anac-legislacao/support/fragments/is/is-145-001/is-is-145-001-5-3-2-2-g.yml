section_title: 'O documento de solicitação formal deve conter:'
subsection_id: g
cite: 5.3.2.2(g)
title: 5.3.2.2(g)
text: 'g) Informações dos profissionais GR e RT requeridos pela seção 145.151 do RBAC nº 145
  (Formulários F-143-01 e F-143-03), incluindo as respectivas declarações de responsabilidade
  (Formulários F-143-01_2 e F-143-03_2), e informações do(a) GSO (nome e CPF). Os(As) profissionais
  devem atender ao estabelecido na seção 145.151, inclusive quanto ao histórico de conduta
  ou desempenho, e Apêndices A-I e B-I do RBAC nº 145. A comprovação da coerência das atribuições
  profissionais do(a) RT com a atividade desempenhada pode ser feita por uma das seguintes
  formas:

  - consulta feita pela ANAC junto ao respectivo conselho, baseada no CPF do RT;

  - apresentação de cópia atualizada do registro do RT, caso o tenha à mão; ou

  - apresentação de declaração escrita e assinada pelo RT, nos termos do art. 3º, parágrafo
  único, do Decreto n° 9.094/2017;

  NOTA: com respeito ao histórico de conduta ou desempenho dos profissionais citado neste
  item, as referências às sanções administrativas capituladas no art. 299, incisos I, V, VI
  ou VII, da Lei nº 7.565, de 19 de dezembro de 1986 (CBAer), presentes no parágrafo 145.151(a)-V(2)(ii)
  do RBAC nº 145, se referem a enquadramentos de infrações como "procedimento ou prática,
  no exercício das funções, que revelem falta de idoneidade profissional para o exercício
  das prerrogativas dos certificados de habilitação técnica", "fornecimento de dados, informações
  ou estatísticas inexatas ou adulteradas", "recusa de exibição de livros, documentos contábeis,
  informações ou estatísticas aos agentes da fiscalização" ou "prática reiterada de infrações
  graves", ainda que, em razão da inclusão do §3º do art. 288 do CBAer, promovida pela Lei
  nº 14.368/2022, atualmente o art. 299 não se aplique às atribuições da ANAC.'
