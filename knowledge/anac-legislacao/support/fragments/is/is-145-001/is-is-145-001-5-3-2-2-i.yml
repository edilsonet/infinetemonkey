section_title: 'O documento de solicitação formal deve conter:'
subsection_id: i
cite: 5.3.2.2(i)
title: 5.3.2.2(i)
text: 'i) Descrição das instalações e recursos da OM, que pode constar no MOM, incluindo as
  instalações fixas adicionais e a qual base estão vinculadas;

  NOTA: a Anac pode conceder autorização para instalações fixas adicionais se as instalações
  estiverem localizadas dentro de uma área definida no mesmo aeródromo, mesmo município ou
  regiões próximas à base à qual estão vinculadas. No caso de inclusão de novas instalações
  que não se enquadrem nas situações acima, o requerente deverá solicitar a certificação de
  cada base seguindo os requisitos aplicáveis do RBAC nº 145, e de acordo com os critérios
  estabelecidos nesta IS.'
