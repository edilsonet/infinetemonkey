section_title: 'O documento de solicitação formal deve conter:'
subsection_id: p
cite: 5.3.2.2(p)
title: 5.3.2.2(p)
text: 'p) Comprovante de recolhimento da Taxa de Fiscalização da Aviação Civil (TFAC) aplicável;
  e

  NOTA: de acordo com a Resolução ANAC n° 653/2021, o comprovante de recolhimento da TFAC
  aplicável poderá ser apresentado pelo requerente a qualquer tempo ao longo do processo,
  sem prejuízo à continuidade das atividades previstas nas Fases 3 e 4. No entanto, a apresentação
  do comprovante de recolhimento da TFAC aplicável é condição necessária para a certificação
  da organização na Fase 5.'
