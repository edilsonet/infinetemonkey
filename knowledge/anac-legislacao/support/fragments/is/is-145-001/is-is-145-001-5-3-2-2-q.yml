title: 5.3.2.2(q)
text: 'q) Outras informações consideradas convenientes pelo requerente, além daquelas requeridas
  por esta IS.

  5.3.2.3 A solicitação formal deve ser entregue à ANAC, no mínimo, 90 (noventa) dias antes
  da data do início pretendido das atividades, embora uma antecedência maior seja recomendada,
  considerando que a duração do processo pode variar significativamente conforme a complexidade
  do escopo de manutenção pretendido e conforme a capacidade do requerente em demonstrar satisfatoriamente
  o cumprimento dos requisitos estabelecidos pela ANAC.

  5.4 FASE 3 - Análise de Documentação

  5.4.1 Uma vez realizada a solicitação formal de certificação, após a constatação de que
  todos os documentos requeridos foram devidamente encaminhados à ANAC, é feita a avaliação
  abrangente do seu conteúdo. Depois de efetuar a análise, se for necessário, a ANAC encaminha
  ao requerente uma comunicação com as não conformidades encontradas.

  5.4.2 O requerente que receber uma comunicação de não conformidades deve apresentar as ações
  corretivas necessárias, conforme as orientações constantes da comunicação, dentro do prazo
  estabelecido pela ANAC de até 30 (trinta) dias corridos.

  5.4.3 O prazo de que trata o parágrafo anterior poderá ser prorrogado mediante manifestação
  expressa do requerente, limitado a 90 (noventa) dias corridos a contar da data de comunicação
  da não conformidade. Decorrido esse prazo, a menos que de outra forma determinado pela ANAC,
  tal fato é considerado razão suficiente para o cancelamento e o arquivamento do processo.'
