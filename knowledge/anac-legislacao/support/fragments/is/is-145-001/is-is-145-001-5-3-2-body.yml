text: '5.3.2 Abertura do processo de certificação

  5.3.2.1 A abertura do processo de certificação é feita a partir do momento em que é protocolado
  o documento de solicitação formal (Formulário F-143-07), acompanhado de todos os documentos,
  manuais ou informações requeridas.

  NOTA: no endereço eletrônico da ANAC, na página dedicada a assuntos relacionados às organizações
  de manutenção, são disponibilizados formulários e modelos aplicáveis às OM (https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-manutencao).'
