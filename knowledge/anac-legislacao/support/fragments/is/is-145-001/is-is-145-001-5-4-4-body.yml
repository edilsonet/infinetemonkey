text: '5.4.4 A qualquer tempo, o requerente ou a ANAC poderão solicitar reunião entre as partes
  para esclarecimentos técnicos relativos ao processo, caso necessário.

  5.5 FASE 4 - Demonstração e Auditorias

  5.5.1 A fase 4 tem início após ter sido concluído que os documentos entregues estão conformes
  com a regulamentação vigente, e necessariamente, após os manuais terem sido considerados
  satisfatórios por atender aos requisitos aplicáveis dos RBAC. Entretanto, os manuais somente
  são aceitos ao final do processo, após ter sido verificada a adequabilidade destes à realidade
  do requerente, por ocasião da auditoria técnica.

  5.5.2 Durante a fase 4 é realizada auditoria para certificação inicial. O objetivo é verificar
  se o requerente está preparado para prestar seus serviços de manutenção, manutenção preventiva
  e alterações de acordo com os seus manuais, seguindo o estabelecido pelos RBAC. É verificado
  se todas as pessoas do requerente, envolvidas nas atividades de manutenção, manutenção preventiva
  ou alterações possuem conhecimento aplicável dos manuais do requerente, e se os procedimentos
  são seguidos. Durante a auditoria, a empresa deverá estar apta a demonstrar conformidade
  por meio de execução simulada, por amostragem, dos serviços pretendidos, comprovando, tanto
  quanto possível, a aderência aos procedimentos previstos nos seus manuais, aos dados técnicos
  aprovados ou aceitáveis pela ANAC e aos respectivos requisitos legais.

  5.5.3 Quando solicitado, o requerente deve informar a data a partir da qual estará apto
  a receber a auditoria de certificação inicial, devendo disponibilizar para a ANAC, nesta
  ocasião, os equipamentos, ferramentas, pessoal qualificado, dados técnicos, instalações
  e demais recursos requeridos conforme o escopo de manutenção a ser certificado.

  5.5.4 Após a auditoria, se necessário, a ANAC informará as não conformidades identificadas
  em relação aos requisitos dos RBAC aplicáveis e em relação aos procedimentos dos manuais,
  visando possibilitar ao requerente providenciar as ações corretivas necessárias.

  5.5.5 A demonstração de correção das não conformidades indicadas poderá exigir do requerente
  a apresentação de evidências complementares (por exemplo: registros, declarações, alteração
  de manuais, fotos, vídeos etc.). A critério da ANAC, pode ser necessária a realização de
  uma nova auditoria.

  5.6 FASE 5 - Certificação'
