title: Emissão do Certificado
text: '5.6.1 Emissão do Certificado

  5.6.1.1 Caso a OM ainda não tenha enviado nas fases anteriores o comprovante de recolhimento
  da TFAC aplicável, deverá fazê-lo na Fase 5, sendo condição necessária para a emissão do
  Certificado da Organização de Manutenção - COM.

  5.6.1.2 Uma vez considerada satisfatória a auditoria de certificação inicial (incluindo
  as soluções corretivas decorrentes das não conformidades encontradas), é emitido, em formato
  eletrônico, o COM.'
