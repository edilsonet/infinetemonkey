title: Juntamente com o Certificado da OM, é emitido, em formato eletrônico, o documento Especificações
  Operativas.
text: '5.6.2.1 Juntamente com o Certificado da OM, é emitido, em formato eletrônico, o documento
  Especificações Operativas.

  5.6.2.2 Devem ser apresentados nas Especificações Operativas as aeronaves, motores, e hélices
  discriminando os seus fabricantes, modelos e limitações. Para uma certificação na Categoria
  Serviços Especializados, as Especificações Operativas da organização de manutenção devem
  conter as especificações usadas para executar o serviço especializado conforme previsto
  na seção 145.61-I do RBAC n° 145. Outras autorizações emitidas pela ANAC em favor da OM
  também poderão constar nas Especificações Operativas.

  5.6.2.3 A partir da entrega do Certificado, a OM passa a ser responsável pelo correto e
  contínuo cumprimento das autorizações, limitações, e instruções específicas contidas nas
  Especificações Operativas.'
