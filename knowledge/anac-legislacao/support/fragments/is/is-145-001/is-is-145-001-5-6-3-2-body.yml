title: Podem constar da LC apenas artigos contidos nas categorias Rádio, Instrumento e Acessório.
text: '5.6.3.2 Podem constar da LC apenas artigos contidos nas categorias Rádio, Instrumento
  e Acessório.

  5.6.3.3 A LC deve ser mantida atualizada e deve possuir controle de revisões que permita
  identificar a data em que cada artigo foi inserido ou excluído da lista.

  5.6.3.4 A LC deverá ser apresentada em formato eletrônico, conforme modelo disponibilizado
  no endereço eletrônico da ANAC, na página dedicada a assuntos relacionados às organizações
  de manutenção: https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-manutencao/formularios-padronizados.

  5.7 Prerrogativas do detentor de um Certificado'
