title: Lista de Capacidade
text: '5.6.3 Lista de Capacidade

  5.6.3.1 O objetivo da Lista de Capacidade é discriminar os artigos para os quais a OM está
  certificada a fornecer manutenção, manutenção preventiva e alterações. A LC é um documento
  emitido e mantido pela OM, submetido à aprovação da ANAC, a menos que a OM possua autorização
  em sua EO para execução de autoinclusão.

  NOTA: para a obtenção de autorização para a realização de autoinclusão em LC, a OM deve
  observar as instruções e os procedimentos apresentados no APÊNDICE B desta IS.'
