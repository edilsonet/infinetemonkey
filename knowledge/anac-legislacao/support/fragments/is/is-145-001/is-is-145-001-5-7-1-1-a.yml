section_title: 'Uma OM certificada segundo o RBAC nº 145 pode:'
subsection_id: a
cite: 5.7.1.1(a)
title: 5.7.1.1(a)
text: 'a) manter, modificar e alterar uma aeronave, motor, hélice, rotor, instrumento, equipamento
  de rádio navegação/comunicação, acessórios ou partes dos mesmos;

  NOTA: uma OM tem a prerrogativa de executar todos os serviços listados em suas Especificações
  Operativas, de acordo com as respectivas limitações previstas, e com os procedimentos estabelecidos
  em seus manuais. A OM poderá subcontratar funções de manutenção, conforme aceito pela ANAC,
  devendo para esse fim estabelecer procedimentos específicos em seus manuais.'
