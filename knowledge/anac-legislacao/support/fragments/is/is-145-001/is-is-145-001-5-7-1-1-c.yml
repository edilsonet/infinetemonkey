section_title: 'Uma OM certificada segundo o RBAC nº 145 pode:'
subsection_id: c
cite: 5.7.1.1(c)
title: 5.7.1.1(c)
text: c) no caso de uma OM certificada na Categoria Célula, executar a inspeção anual (conforme
  prevista no RBAC nº 91 e RBAC n° 43), realizar verificação de aeronavegabilidade e emitir
  o Certificado de Verificação de Aeronavegabilidade (CVA) ou executar inspeção progressiva
  e aprovar o retorno ao serviço dos modelos de aeronave para os quais foi certificada; e
