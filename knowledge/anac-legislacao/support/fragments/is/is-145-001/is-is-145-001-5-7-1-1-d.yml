section_id: 5.7.1.1
section_title: 'Uma OM certificada segundo o RBAC nº 145 pode:'
subsection_id: d
cite: 5.7.1.1(d)
title: 5.7.1.1(d)
text: d) manter ou alterar, em outra localidade, em caráter excepcional e temporário, ou recorrente
  qualquer artigo para o qual tenha sido certificada desde que o trabalho seja executado da
  mesma maneira que seria executado na sede da OM e que todo pessoal necessário, equipamento,
  materiais e informações técnicas sejam colocadas à disposição no local onde o trabalho será
  realizado e que os manuais da OM estabeleçam os procedimentos detalhados e aceitos.
