section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Célula:'
subsection_id: a
cite: 5.7.2.2(a)
title: 5.7.2.2(a)
text: a) possuir ou ter acesso ao Manual de Manutenção da Aeronave (Aircraft Maintenance Manual
  - AMM), e possuir ou ter acesso aos Manuais de Manutenção do Motor, Hélice e/ou componente
  (conforme aplicável), sempre que as instruções de aeronavegabilidade para a execução das
  tarefas de manutenção do Grupo Motopropulsor, Hélice e/ou componente não estiverem descritas
  no Manual de Manutenção da Aeronave (Aircraft Maintenance Manual - AMM). Os referidos manuais
  devem estar atualizados de acordo com o último índice emitido pelos fabricantes. A OM deve
  possuir autorização para atualização, ou, se requerido, contrato com os respectivos fabricantes
  ou com entidade autorizada pelos fabricantes (ver IS n° 145.109-001);
