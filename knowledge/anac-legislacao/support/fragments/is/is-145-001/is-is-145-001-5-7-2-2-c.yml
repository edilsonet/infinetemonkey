section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Célula:'
subsection_id: c
cite: 5.7.2.2(c)
title: 5.7.2.2(c)
text: c) possuir pessoal adequado, com vínculo contratual, com licença de MMA emitida pela
  ANAC e habilitação em célula (CEL) treinado e qualificado na aeronave relacionada. Adicionalmente
  e conforme aplicável, possuir pessoal com habilitação em grupo motopropulsor (GMP) e /ou
  aviônico (AVI), treinado e qualificado na aeronave relacionada e no grupo motopropulsor
  - motor e/ou hélice, ou componente.
