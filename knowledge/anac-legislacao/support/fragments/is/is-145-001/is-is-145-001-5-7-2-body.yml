title: Categoria Célula
text: '5.7.2 Categoria Célula

  5.7.2.1 Cada OM certificada na Categoria Célula possui a prerrogativa de executar as tarefas
  previstas no Programa de Manutenção recomendado pelo detentor do projeto de tipo da aeronave,
  ou outro aprovado pela ANAC, listadas em suas Especificações Operativas e dentro das limitações
  previstas nestas, podendo incluir manutenção preventiva, inspeções, revisão geral da célula,
  manutenção em rotores (principal e de cauda) e ações corretivas como reparos, alterações,
  conforme aplicável. Adicionalmente, pode incluir tarefas do grupo motopropulsor (motor e/ou
  hélice, conforme aplicável) e/ou de componente, desde que a tarefa possa ser executada no
  artigo enquanto instalado na aeronave. Em todo caso, a tarefa deve ser executada conforme
  as Instruções de Aeronavegabilidade Continuada aplicáveis e a aprovação para retorno ao
  serviço é emitida para a aeronave, e não para o artigo específico.'
