section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Motor:'
subsection_id: a
cite: 5.7.3.2(a)
title: 5.7.3.2(a)
text: a) possuir ou ter acesso ao Manual de Manutenção da Aeronave (Aircraft Maintenance Manual
  - AMM), ata referente ao motor, e/ou possuir ou ter acesso ao Manual de Manutenção do Motor
  (Engine Maintenance & Overhaul Manual - EMM), conforme limitações previstas em suas Especificações
  Operativas. Para remoção/instalação de motor em aeronave, deve possuir ou ter acesso aos
  manuais aplicáveis ao serviço pretendido. Os manuais devem estar atualizados de acordo com
  o último índice emitido pelos fabricantes (ver IS n° 145.109-001);
