section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Motor:'
subsection_id: b
cite: 5.7.3.2(b)
title: 5.7.3.2(b)
text: b) possuir ou ter acesso aos equipamentos de apoio ao solo, ferramentas comuns, ferramentas
  especiais e ferramentas de teste e medição calibradas, aplicáveis, conforme estabelecido
  pelo detentor do projeto de tipo do motor. Para a remoção/instalação de motor em aeronave,
  a OM deve possuir ou ter acesso às ferramentas adequadas, conforme aplicável ao serviço
  pretendido;
