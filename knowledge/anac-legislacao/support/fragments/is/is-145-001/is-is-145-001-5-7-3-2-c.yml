title: 5.7.3.2(c)
text: c) possuir pessoal adequado, com vínculo contratual, com licença de MMA emitida pela
  ANAC e habilitação em GMP, treinado e qualificado no(s) motor(es) relacionado(s). Para a
  remoção/instalação de motor em aeronave, a OM deve possuir pessoal detentor de licença de
  MMA emitida pela ANAC e habilitação em CEL e com qualificação na aeronave; e
