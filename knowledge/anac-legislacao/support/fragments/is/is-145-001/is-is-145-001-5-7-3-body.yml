title: Categoria Motor
text: '5.7.3 Categoria Motor

  5.7.3.1 Cada OM certificada na Categoria Motor possui a prerrogativa de executar as tarefas
  previstas no Programa de Manutenção recomendado pelo detentor do projeto de tipo do motor,
  ou previstas em outro programa aprovado pela ANAC, listadas em suas Especificações Operativas
  e dentro das limitações previstas nestas, podendo incluir manutenção preventiva, manutenção
  com o motor instalado na aeronave (inclui a remoção e instalação da hélice, mas, exclui-se
  revisão geral - Overhaul de hélice), até o nível de revisão geral de motores.'
