section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Hélice:'
subsection_id: a
cite: 5.7.4.2(a)
title: 5.7.4.2(a)
text: a) possuir ou ter acesso ao Manual de Manutenção da Aeronave (Aircraft Maintenance Manual
  - AMM), capítulo referente à hélice, aplicável à aeronave em questão, e/ou possuir ou ter
  acesso ao Manual de Manutenção da Hélice (Propeller Maintenace Manual - PMM), os quais devem
  estar atualizados de acordo com o último índice emitido pelos fabricantes (ver IS n° 145.109-001);
