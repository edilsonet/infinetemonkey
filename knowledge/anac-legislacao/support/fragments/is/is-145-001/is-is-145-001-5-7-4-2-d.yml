title: 5.7.4.2(d)
text: 'd) para a remoção e instalação da hélice em aeronave, possuir as ferramentas, equipamentos,
  instalações físicas adequadas e pessoal adequadamente treinado no tipo de serviço.

  NOTA: a OM deve contemplar em seu Programa de Treinamento em Manutenção (PTM) provisões
  de capacitação suficientes para os mecânicos de forma a garantir que na execução de instalações
  e remoções de hélices haja adequada aderência ao que preveem as instruções do fabricante
  ou do detentor do Certificado Suplementar de Tipo (CST).'
