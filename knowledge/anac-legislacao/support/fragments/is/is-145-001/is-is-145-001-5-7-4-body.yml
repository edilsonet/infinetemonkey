title: Categoria Hélice
text: '5.7.4 Categoria Hélice

  5.7.4.1 Cada OM certificada na Categoria Hélice possui a prerrogativa de executar as tarefas
  previstas no Programa de Manutenção recomendado pelo detentor do projeto de tipo da hélice,
  ou previstas em outro programa aprovado pela ANAC, listadas em suas Especificações Operativas
  e dentro das limitações previstas nesta, podendo incluir manutenção preventiva, manutenção
  com a hélice instalada na aeronave, remoção e instalação da hélice e revisão geral da hélice.'
