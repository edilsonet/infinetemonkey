text: b) possuir ou ter acesso aos equipamentos, bancadas de testes e medição calibradas,
  ferramentas comuns e ferramentas especiais, aplicáveis, conforme estabelecidas pelos fabricantes.
  Para instalações e remoções de artigos da Categoria Rádio em aeronaves, possuir ou ter acesso
  às ferramentas necessárias para a execução dessa atividade;
