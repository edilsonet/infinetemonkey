title: Categoria Rádio
text: '5.7.5 Categoria Rádio

  5.7.5.1 Cada OM certificada na Categoria Rádio possui a prerrogativa de executar as tarefas
  de manutenção/revisão geral estabelecidas pelo fabricante de equipamentos de comunicação,
  de navegação e de radar, com base no Manual de Revisão Geral (Component Maintenance & Overhaul
  Manual) do respectivo fabricante. Tais tarefas são referentes aos programas de manutenção
  dos equipamentos listados em sua LC, e dentro das limitações previstas nesta.

  5.7.5.2 Pode, inclusive, instalar e remover artigos da Categoria Rádio em aeronave e realizar
  os testes de funcionamento necessários, desde que atendidas as condições previstas no item
  5.7.5.3.

  NOTA: a instalação de artigos da Categoria Rádio pode incluir a instalação de itens como
  antenas, suportes e outros elementos que fazem parte do sistema completo a ser inserido
  na aeronave.'
