title: 5.7.6.3(b)
text: b) possuir ou ter acesso aos equipamentos, bancadas de testes e medição calibradas,
  ferramentas comuns e ferramentas especiais, aplicáveis, conforme estabelecidas nos manuais
  aplicáveis. Para instalações e remoções de artigos da Categoria Instrumento em aeronaves,
  possuir ou ter acesso às ferramentas necessárias para a execução dessa atividade;
