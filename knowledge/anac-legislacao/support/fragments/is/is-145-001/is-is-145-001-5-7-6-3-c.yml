section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Instrumento:'
subsection_id: c
cite: 5.7.6.3(c)
title: 5.7.6.3(c)
text: 'c) para manutenções internas nos artigos da Categoria Instrumento, possuir pessoal
  adequado, com vínculo contratual, com licença de MMA emitida pela ANAC e habilitação em
  AVI, treinado e qualificado (com curso no instrumento que pretende manter). Para instalações
  e remoções de artigos da Categoria Instrumento em aeronaves, possuir pessoal, com vínculo
  contratual, com licença de MMA emitida pela ANAC e habilitação em AVI ou CEL, com qualificação
  no modelo de artigo a ser instalado ou removido, e estar adequadamente qualificado para
  realizar a instalação ou remoção na aeronave; e

  NOTA: a OM deve contemplar em seu Programa de Treinamento em Manutenção (PTM) provisões
  de capacitação suficientes para os mecânicos de forma a garantir que na execução de instalações
  e remoções haja adequada aderência ao que preveem as instruções do fabricante ou do detentor
  do Certificado Suplementar de Tipo (CST).'
