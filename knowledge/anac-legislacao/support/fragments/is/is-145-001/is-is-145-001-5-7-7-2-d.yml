section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Acessório:'
subsection_id: d
cite: 5.7.7.2(d)
title: 5.7.7.2(d)
text: 'd) para instalações e remoções de artigos da Categoria Acessório, possuir ou ter acesso
  aos manuais atualizados necessários, que podem incluir manual de manutenção da aeronave,
  manual de manutenção do motor, entre outros, instalações físicas adequadas, conforme aplicável
  ao serviço pretendido, acesso ao ferramental e equipamentos requeridos e vínculo com pessoal
  qualificado no modelo de artigo a ser instalado ou removido e adequadamente treinado no
  tipo de serviço.

  NOTA: a OM deve contemplar em seu Programa de Treinamento em Manutenção (PTM) provisões
  de capacitação suficientes para os mecânicos de forma a garantir que na execução de instalações
  e remoções de acessórios haja adequada aderência ao que preveem as instruções do fabricante
  ou do detentor do Certificado Suplementar de Tipo (CST).'
