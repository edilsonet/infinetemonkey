title: Categoria Acessório
text: '5.7.7 Categoria Acessório

  5.7.7.1 Cada OM certificada na Categoria Acessório possui a prerrogativa de executar as
  tarefas de manutenção estabelecidas pelo fabricante de acessórios mecânicos, elétricos e
  eletrônicos, com base no Manual de Revisão Geral (Component Maintenance & Overhaul Manual)
  do respectivo fabricante. Tais tarefas são referentes aos programas de manutenção dos acessórios
  listados em sua LC, e dentro das limitações previstas nesta.

  NOTA: serviços de manutenção em Unidade Auxiliar de Potência (APU) serão enquadrados na
  Categoria Acessórios, Classe 1 (acessórios mecânicos). Entretanto, para a concessão da prerrogativa
  de autoinclusão de APU que opere como fonte de alimentação em voo (elétrica, hidráulica
  ou pneumática), é necessário que a OM atenda os critérios estabelecidos no APÊNDICE B desta
  IS referentes à categoria Motor.'
