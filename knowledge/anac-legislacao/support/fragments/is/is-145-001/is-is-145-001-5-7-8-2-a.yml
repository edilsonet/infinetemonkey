section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Serviços
  Especializados:'
subsection_id: a
cite: 5.7.8.2(a)
title: 5.7.8.2(a)
text: a) possuir ou ter acesso às normas técnicas (especificações) do serviço especializado
  que pretende executar, ao Manual de Revisão Geral do artigo que contém as instruções do
  serviço especializado que pretende executar, os quais devem estar atualizados de acordo
  com o último índice emitido pelo fabricante desse artigo ou provedor de norma, e possuir
  contrato de atualização com o respectivo fabricante, provedor de norma, ou com entidade
  autorizada pelo fabricante, conforme previsto na IS n° 145.109-001;
