section_title: 'Requisitos a serem demonstrados pela OM certificada na Categoria Serviços
  Especializados:'
subsection_id: d
cite: 5.7.8.2(d)
title: 5.7.8.2(d)
text: 'd) possuir os equipamentos, bancadas de testes e medição calibradas, ferramentas comuns
  e ferramentas especiais, aplicáveis, conforme estabelecido pelos fabricantes.

  5.7.8.3 Os serviços de manutenção, manutenção preventiva e alterações em que é aplicável
  uma certificação em serviços especializados são, dentre outros: ensaios não destrutivos,
  serviços de soldagem, pintura, pesagem de aeronaves, trabalhos em revestimentos de tela,
  serviços especializados em pás de rotores, análises de vibração e balanceamento dinâmico,
  análises de performance, serviços de tapeçaria e interiores, inspeções e testes do sistema
  anemométrico, inspeção boroscópica, lavagem de compressores de motores à turbina, banhos
  galvânicos, shotpeening, limpeza por jateamento abrasivo, inspeção por ataque ácido, inspeções/ensaios
  de vasos de pressão, quando tais serviços não puderem ser incluídos nas demais categorias
  e classes, por determinação da ANAC, ou pela necessidade de se prestar serviços em artigos
  não listados nas EO ou na LC.

  5.8 Validade do Certificado

  5.8.1 Um Certificado é válido até que seja solicitado o seu cancelamento pelo seu detentor
  e este seja aceito pela ANAC, ou até que seja suspenso ou cassado pela ANAC.

  5.9 Vigilância Continuada da OM

  5.9.1 Conforme preconiza a seção 145.223 do RBAC nº 145, a organização de manutenção certificada
  deve permitir inspeções da ANAC a qualquer tempo para que seja verificado o cumprimento
  com os RBAC, o que pode ocorrer, dentre outras formas possíveis, por meio de solicitação
  de documentos, auditorias remotas e presenciais.

  5.9.2 A ANAC pode estabelecer limitações adicionais ou mesmo a suspensão do certificado
  caso, a qualquer tempo, seja constatado que a OM não apresenta condições de manter essa
  certificação.

  5.10 Processos de Emenda ao Certificado

  5.10.1 No contexto desta seção, um certificado se refere ao conjunto de documentos que compõem
  as especificações da organização: Certificado da Organização de Manutenção (COM) juntamente
  com as Especificações Operativas (EO) e/ou Lista de Capacidade (LC) a ele associadas.'
