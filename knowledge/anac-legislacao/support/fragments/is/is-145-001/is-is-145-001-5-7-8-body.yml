title: Categoria Serviços Especializados
text: '5.7.8 Categoria Serviços Especializados

  5.7.8.1 Cada OM certificada na Categoria Serviços Especializados possui a prerrogativa de
  executar a função de manutenção requerida, com base no Manual de Manutenção ou de Revisão
  Geral do respectivo fabricante, ou em um processo desenvolvido pela OM (processo proprietário).
  Os Serviços Especializados são listados em sua EO, podendo ser executados dentro das limitações
  previstas nesta.'
