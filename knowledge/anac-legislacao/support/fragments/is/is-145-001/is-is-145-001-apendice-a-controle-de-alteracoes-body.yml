title: APÊNDICE A - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES


  ALTERAÇÕES REALIZADAS NA REVISÃO H

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA 4.1.6 Atualizada definição de Manual da Organização de Manutenção -
  MOM para alinhamento com a IS 145-009 4.1.8 Atualizada definição pela terminologia utilizada
  pela Anac. 5.3.1.5 Incluído esclarecimento quanto a possibilidade de Anac qualquer tempo
  não aceitar o Gestor Responsável, Gestor do SGSO e RT, conforme previsto no RBAC 145 item
  145.151(a)-V (1). 5.3.2.2 i) Incluído parágrafo esclarecendo sobre possibilidade do regulado
  solicitar instalações fixas adicionais já na fase 2 (solicitação formal). 5.6.1.7 Incluído
  parágrafo com detalhamento das condições para solicitação de instalações fixas adicionais
  5.6.3.2 Explicitada as categorias que podem ser incluídas na LC. O RBAC 145 item 145.215-I
  (d) estabelece que um artigo só pode ser incluído na LC se precedido de aprovação da Anac,
  ou de outra forma estabelecido. 5.7.4.1 Incluída prerrogativa de instalação de remoção de
  hélices 5.7.4.2 d) Incluído item com esclarecimento quanto a requisitos a serem demonstrados
  por OM certificadas na categoria hélice que desejem realizar a instalação e remoção de hélice
  na aeronave. 5.7.5.1, 5.7.6.1 Explicitado que rádios e instrumentos devem estar listados
  na LC. 5.7.7.1 Explicitado que acessórios devem estar listados na LC. Incluído esclarecimento
  para autoinclusão de APU que opere como fonte de alimentação em voo (elétrica, hidráulica
  ou pneumática). 5.7.7.2 d) Incluído esclarecimento quanto a requisitos a serem demonstrados
  por OM certificadas na categoria acessórios que desejem realizar a instalação e remoção
  de artigos na aeronave 5.10.3 Incluída Nota para lembrar o leitor de que há possiblidade
  de instalações fixas adicionais sem necessidade de certificação de base secundária B.2.1
  O texto foi revisado para esclarecer os critérios de autoinclusão para o caso de APU que
  funcione como fonte de alimentação. Tabela B.4.3 Revisado os critérios de autoinclusão para
  o caso de APU que funcione como fonte de alimentação.'
