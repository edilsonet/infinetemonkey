title: APÊNDICES
text: 'APÊNDICES

  6.1 Apêndice A - Controle de Alterações

  6.2 Apêndice B - Procedimentos para Autoinclusão de Artigos em Lista de Capacidade ou em
  Especificações Operativas

  6.3 Apêndice C - Sistema de monitoramento com auditoria interna independente

  DISPOSIÇÕES transitórias e FINAIS

  7.1 As Organizações de Manutenção que possuam autorização nas Especificações Operativas
  para a execução de autoinclusão em Lista de Capacidade até 1º de dezembro de 2023 permanecem
  autorizadas. Tais OMs deverão, a partir de 1º de junho de 2024, estar aderentes aos critérios
  aplicáveis presentes no item B.2.1 do Apêndice B da IS para que permaneçam autorizadas.

  7.2 A partir de 1º de dezembro de 2023, novas solicitações de autorização para execução
  de autoinclusão devem seguir as diretrizes e instruções presentes nesta IS.

  7.3 As alterações trazidas pela revisão F desta IS entraram em vigor em 1º de dezembro de
  2023, exceto quanto aos itens B.4.3 e B.4.4 do Apêndice B e ao Apêndice C, que entrarão
  em vigor em 2 de dezembro de 2024.

  7.4 Os casos omissos serão dirimidos pela ANAC.'
