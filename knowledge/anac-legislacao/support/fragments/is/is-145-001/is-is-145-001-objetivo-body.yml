title: OBJETIVO
text: 'OBJETIVO

  1.1 Fornecer procedimentos e orientações àqueles que desejam certificar, junto à ANAC, uma
  organização de manutenção de produto aeronáutico localizada em território nacional, para
  prestar serviços de manutenção, manutenção preventiva e alterações, de acordo com os requisitos
  do RBAC nº 145.'
