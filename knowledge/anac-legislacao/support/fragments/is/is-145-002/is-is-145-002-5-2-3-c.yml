section_id: 5.2.3
section_title: 'This IS presents the procedures for a foreign AMO to obtain an Anac AMO certificate,
  covering the following:'
subsection_id: c
cite: 5.2.3(c)
title: 5.2.3(c)
text: 'c) certification amendment (in accordance with RBAC No. 145, section 145.57).

  5.2.4 To receive and analyze the process, Anac uses the SEI electronic protocol system (SEI!).
  Through this system representatives of foreign maintenance organizations can obtain access
  to the Anac services portfolio. The use of the Anac SEI! is made upon prior registration.
  Guidance for foreign maintenance organizations representatives to register in the Anac SEI!
  is available at Ref. 03 of the table IS No. 145-002C - LINKS AND REFERENCES, found at the
  topic “Useful links” at following Anac website: https://www.gov.br/anac/en/topics/approved-maintenance-organization/useful-links.

  Note: from now on, any references listed in Table IS No. 145-002C - Links and References,
  located under the “Useful Links” section on the following ANAC webpage: https://www.gov.br/anac/en/topics/approved-maintenance-organization/useful-links
  will be cited simply as “Ref X”.'
