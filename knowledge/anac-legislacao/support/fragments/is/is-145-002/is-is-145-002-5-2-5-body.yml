text: '5.2.5 Communication. For questions related to the processes covered by this IS, the
  AMO can contact Anac via email at foreign145@anac.gov.br.

  Note 1: the foreign145@Anac.gov.br is not the appropriate mean to receive documents related
  to these processes but remains the main contact for questions.

  Note 2: in any communication with Anac, the AMO must identify itself by providing its name
  and its Anac COM (Certificado de Organização de Manutenção) number, in case the AMO already
  has one.

  5.3 Acceptance of maintenance tasks performed by foreign AMO without Anac certification
  (except for complete aircraft, aircraft engine, and propeller services)

  5.3.1 In accordance with RBAC No. 43, paragraph 43.17(b)-I, a foreign AMO that is not certified
  by Anac may perform maintenance, preventive maintenance, rebuild and alteration and approve
  the article to return to service, not including complete aircraft, aircraft engine and propeller,
  if, among other requirements detailed on the referred paragraph:'
