text: '5.3.2 The AMO complying with the conditions of paragraph 5.3.1 above are not required
  to be certified according to the instructions described on this IS.

  5.3.3 It is important to emphasize that regulatory similarity must be formally declared
  by Anac. This declaration is made by Anac through Ordinances (Portarias - published only
  in Portuguese).

  Note: the CAA whose regulatory systems have been considered similar by Anac as well as respective
  Ordinances can be found at Ref. 04 (check note at 5.2.4). Additional questions can be directed
  to: foreign145@anac.gov.br.

  5.4 Certification process'
