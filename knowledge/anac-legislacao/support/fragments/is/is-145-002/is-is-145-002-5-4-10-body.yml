title: Expedited Certification
text: '5.4.10 Expedited Certification

  5.4.10.1 As defined in RBAC No. 43, paragraph 43.1(e)-I, Anac may, upon request, carry out
  expedited certification, issuing authorization on a case-by-case basis for persons holding
  certificates or licenses issued by other countries to perform specific, individually identified
  maintenance, preventive maintenance, rebuilt or alteration services of articles, within
  or outside the national territory, if there is no organization certified and qualified according
  to RBAC No. 145 to perform the intended services.

  5.4.10.2 The performance of a service based on expedited certification will only be possible
  upon demonstration of the unavailability of an AMO certified in accordance with RBAC No.
  145 and with the capacity to perform the service.'
