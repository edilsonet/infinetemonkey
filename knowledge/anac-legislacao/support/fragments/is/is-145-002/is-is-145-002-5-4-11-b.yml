title: 5.4.11(b)
text: 'b) already have an article similar to the one for which authorization for exceptional
  service is being requested in the AMO''s operations specifications (EO) or capability list
  (LC), as applicable. (Ex.: the applicant has a Cessna 172M aircraft in its EO and requests
  authorization for service on a Cessna 172N aircraft).

  Note 1: the authorization is exceptional and will not be granted for the same applicant
  to perform a service on a particular model of article again. If the AMO wishes to perform
  further maintenance services on the model in question, it must ask for the inclusion of
  this article in the AMO''s Anac operations specifications (EO) or capability list (LC),
  as applicable.

  Note 2: further information on this topic can be found at Ref. 08 (check note at 5.2.4).

  5.5 Certification renewal process'
