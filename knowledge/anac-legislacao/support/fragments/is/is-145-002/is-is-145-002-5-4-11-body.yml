text: '5.4.11 Authorization for exceptional service

  An AMO with a valid Anac RBAC No. 145, wishing to carry out services on articles for which
  it is not certified by Anac, may request the performance of an exceptional service. To do
  so, the AMO must technically demonstrate compliance with the RBAC No. 43 requirements necessary
  for maintenance (technical personnel, tools, technical publications, adequate facilities,
  etc.), in addition to meeting at least one of the following situations:'
