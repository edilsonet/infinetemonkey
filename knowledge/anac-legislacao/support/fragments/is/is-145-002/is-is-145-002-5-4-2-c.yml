id: is-is-145-002-5-4-2-c
kind: is
document: is-145-002
family: '145'
section_id: 5.4.2
section_title: 'Submission of the certification application and documents:'
subsection_id: c
cite: 5.4.2(c)
title: 5.4.2(c)
text: 'c) together with the certification application form - Anac Form F-143-30, foreign AMOs
  must also submit all the documents listed below, for analysis of Anac''s technical team
  from the Department of Flight Standards (Superintendência de Padrões Operacionais - SPO):

  I- AMO certificate proposal ("Certificado de Organização de Manutenção - COM" proposal)
  - Anac Form F-900-71 - available at Ref. 05 (check note at 5.2.4), including the ratings
  the AMO intend to perform maintenance, preventive maintenance, rebuild and alteration, under
  Anac certification, according to definitions given in section 145.59 of RBAC No. 145;

  Note 1: the COM proposed to Anac cannot include ratings other than those already certified
  by its local CAA, except the specialized services rating from section 145.59 of the RBAC
  No. 145. Specialized service rating, as described on RBAC No. 145, will be evaluated to
  be equivalent to the respective AMO limited rating certification obtained with its local
  CAA.

  Note 2: for Anac certification purposes, an auxiliary power unit (APU), when used to supply
  power (electrical, hydraulic or pneumatic), is considered an accessory and is therefore
  classified in the Accessories Category, Class 1 (mechanical accessories), according to section
  145.59 of RBAC No. 145.

  II- Operations specifications proposal ("especificações operativas - EO" proposal) - Anac
  form F-900-72, available at Ref. 05 (check note at 5.2.4), listing the aircraft models,
  engines, propellers, rotors, equipment and/or specialized services, and their limitations,
  on which the AMO intends to perform maintenance, preventive maintenance, rebuilding and
  alteration, according to definitions given in section 145.59 of RBAC No. 145;

  Note: an EO submitted to Anac must not contain aircraft, engine, propeller, equipment, and/or
  specialized services other than those already under the capability certified by its local
  CAA.

  III- Capability list proposal ("lista de capacidade - LC" proposal), listing all the components,
  parts, accessories, radios, instruments, except aircraft, engine, and propellers (APUs being
  considered as accessories) the AMO intends to add to its Anac certification;

  Note 1: the Anac only grants limited certification to AMOs (equivalent to FAA´s "limited
  rating"). Therefore, when requesting Anac certification, even foreign AMOs that have a certification
  that allows a wide work scope within a category (equivalent to FAA´s "class rating") granted
  by their local CAA, must prepare and submit a capability list, containing all the articles
  to which the AMO intends to perform maintenance under the Anac certification.

  Note 2: if the AMO already has a capability list accepted or approved by its local CAA,
  then the section related to parts, components, instruments, and accessories may be deemed
  approved by Anac, limited to the classes and ratings contained in the Anac certificate.
  In this case, the AMO does not need to submit a proposal for a new capability list, it must
  only submit the capability list already accepted/approved by its authority, and proof of
  formal acceptance/approval by the local authority of this document.

  Note 3: if the AMO does not have a capability list accepted or approved by its local CAA,
  in addition to the capability list proposal, the AMO will need to develop an article self-inclusion
  procedure to be included in the Anac supplement (see IS No. 145-001 revision H, item 5.6.3,
  or equivalent item in future revisions). In this case, whenever the AMO makes modifications
  to its capability list, the new revision must be forwarded to Anac by a means described
  in the supplement and accepted by Anac. The example of supplement, available at Ref. 10
  (check note at 5.2.4), presents an acceptable means of compliance for the submission of
  the capability. If AMO does not have an LC in an already defined format, Anac recommends
  the use of the format defined in IS No. 145-001, revision H item 5.6.3, or equivalent item
  in future revisions.

  IV- list of technical personnel (roster), including each license number, when applicable;

  Note 1: in accordance with paragraph 145.151(e)-I of RBAC No. 145, a foreign AMO must have
  personnel qualified who demonstrate to be able to read and understand Portuguese language
  whenever it is necessary to accomplish tasks that must comply with the Brazilian regulations.
  This requirement is also important with respect to the documentation and maintenance records
  written in Portuguese language.

  Note 2: it should be noted that a professional with proficiency in the Portuguese language
  is necessary, not only during the initial certification process, but also throughout the
  entire time that the AMO exercises the prerogatives of an Anac certification, in situations
  such as those in which it is necessary to serve Brazilian customers or understand Anac documents.

  V- designation of the employee who will technically represent the organization for interactions
  with Anac, as required by RBAC No. 145, paragraph 145.151(a)-IV;

  Note 1: paragraph 145.151(a)-IV of RBAC No. 145 requires foreign AMO to present an employee
  who will technically represent it before Anac, similarly as required by paragraph 145.151(a)-II
  to Brazilian based AMO.

  Note 2: the person required in RBAC No. 145.151(a)-IV is the one to be indicated as "focal
  point" for communications with Anac for technical matters associated with certification
  of the AMO. Therefore, he / she must be a person whose functions are linked to the performance
  of the AMO''s maintenance prerogatives. Ex: technical director, quality assurance manager,
  or chief inspector, etc.

  Note 3: this person must be the same person indicated as "equivalent to accountable technician
  (RT)" on the initial certification request form - Form F-143-30.

  VI- statement indicating that it has all the tools, equipment, test equipment, bench tests,
  etc. and technical documentation necessary for the safe performance of work. This declaration
  must be accompanied by:

  A- a list of all tools, equipment, test equipment, bench tests necessary for the safe performance
  of work; and

  B- a list of the technical documents necessary for the safe performance of work;

  Note: items 5.5.2.1 e) and f) of IS No. 145-009, revision E, or equivalent items in future
  revisions, provide an acceptable way to demonstrate compliance with tools and technical
  documentation requirements.

  VII- copy of Foreign AMO certificate and operations specifications (Ops. Specs.) or equivalents,
  issued by primary local CAA;

  VIII- demonstration of need, stating the intent of a client to use the applicant AMO services,
  in accordance with paragraph 145.51(c)(1) of RBAC No. 145, issued by:

  A- a Brazilian registered aircraft operator;

  B- a Brazilian registered aircraft owner;

  C- an AMO certified by Anac;

  D- a foreign AMO approved by Anac by means of an agreement; or

  E- other person who may need the AMO services under the Anac certification, as long as it
  is duly justified;

  IX- compliance checklist regarding the requirements of RBAC No. 43 and RBAC No. 145 with
  the cross-reference to the AMO manuals and to the Brazilian supplement;

  Note: the compliance checklist is a fundamental tool to Anac assess the AMO eligibility
  to receive a Brazilian COM, as it provides means for the AMO to show how it will comply
  with the applicable Brazilian requirements to its operation with its manuals, accepted or
  approved by its own local CAA, and Brazilian supplement. IS No. 145-001 provides guidance
  for its elaboration. Also Form F-143-40, available at Ref. 05 (check note at 5.2.4), is
  a guide for it.

  X- copy of all manuals required in a certification process by the local CAA. The AMO must
  submit a copy of the current revision of all manuals that, in its local initial certification
  process, received the formal acceptance or approval from its local CAA (ex.: handbook or
  manuals of maintenance organization; manuals of quality control; training programs; safety
  management system manuals);

  Note 1: the manuals that received formal acceptance or approval from its local CAA may be
  considered acceptable by Anac.

  Note 2: if the AMO does not have a safety management system (SMS) manual accepted or approved
  by its local CAA, it must prepare and submit to Anac an SMS manual in accordance with the
  characteristics specified in Supplementary Instruction IS No. 145.214-001 (Portuguese only).
  A template for this manual (Portuguese only) can be found at Ref. 06 (check note at 5.2.4).

  Note 3: similarly, if the AMO does not have a training program accepted or approved by its
  local CAA, it must prepare and submit to Anac a manual in accordance with the characteristics
  specified in Supplementary Instruction IS No. 145-010 (Portuguese only).

  XI- a Brazilian supplement to the existing manual (or manuals) required by the local CAA
  covering all regulatory requirements applicable to maintain a Brazilian aeronautical product
  not covered by the original manual (or manuals). The Ref. 10 (check 5.2.4 at 5.2.4) could
  be used as a guidance for the development of the Brazilian supplement to the manual (or
  manuals) of AMO;

  Note 1: the Brazilian supplement may be provided in English, Spanish or Portuguese as well,
  as long as the chosen language is fully understood by the personnel required to use the
  supplement.

  Note 2: the existing manual (or manuals), accepted or approved by the local CAA, to be used
  by the AMO in addition to the Brazilian supplement to demonstrate compliance with all regulatory
  requirements applicable to the Brazilian certification should be published in English, Spanish
  or Portuguese; otherwise the AMO must submit an English, Spanish or Portuguese version of
  the applicable manuals to Anac.

  Note 3: the set of manuals to be submitted to Anac for analysis must show elements that
  reflect compliance to each requirement listed on the compliance checklist. Therefore, they
  should not include only general policies and directives but sufficiently detailed procedures
  to show requirements compliance. The IS No. 145-009 (Portuguese only) provides guidance
  for compliance with requirements related to manual.

  Note 4: Anac must be notified whenever there are revisions to the supplement, whether for
  analysis and formal acceptance or just for knowledge and updating of the database. The procedures
  applied to this notification are the same as those described in IS No. 145-009, revision
  E, item 5.3.5.1, or equivalent item in future revisions.

  XII- list of subcontracted maintenance functions, as applicable: if the AMO intends to subcontract
  maintenance functions from other maintenance organizations (certified by its local CAA or
  even from those that do not hold a certification), it must submit a list in the format indicated
  in F-143-42, available at Ref. 05 (check note at 5.2.4);

  Note 1: if the AMO already has a list of subcontracted maintenance functions approved by
  its local CAA, then this list may be considered acceptable by Anac. In this case, the AMO
  does not need to submit a proposal for a new list of subcontracted maintenance functions
  list, it must only submit the one already approved by its authority, and proof of formal
  approval by the local authority of this document.

  Note 2: for the purpose of accepting a list of subcontracted maintenance functions from
  a foreign maintenance organization, as per RBAC No. 145, section 145.217, Anac considers
  as a "certified" person ONLY those that hold an Anac authorization/certification as per
  RBAC No. 43, OR those that, as per item 43.17(b)-I of RBAC No. 43, even without an Anac
  certification, may perform maintenance on aeronautical parts to be installed on Brazilian
  registered aircraft. Except from these two cases, foreign maintenance organizations, even
  if certified by their local CAA, or by third CAAs (as FAA, EASA, TCCA, for example), are
  considered as "non certified" by Anac.

  XIII- accepted procedure for using the electronic maintenance documents and records system
  - SDRMe, if the AMO uses one; and

  Note 1: for foreign AMOs that have their SDRMe accepted or approved by any CAA which has
  an aviation regulation system recognized by Anac as similar, as described in item 5.3, above,
  Anac will consider it as an acceptable means of compliance, as an alternative to the method,
  defined in Anac Resolution No. 458, dated December 20th, 2017.

  Note 2: if the AMO does not have its SDRMe accepted/approved, as per note 1 above, it must
  be submitted for Anac acceptance, in accordance with IS No. 43.9-004.

  XIV- the Anac civil aviation inspection fee (TFAC) proof of payment, in case it was paid
  in advance.

  Note 1: the TFAC fee was established by Law No. 11.182/2005, article 29 and its annex III
  lists the situations that require its payment. The matter is dealt in Resolution No. 653,
  dated December 20th, 2021, regulated by Ordinance No. 8.676, dated July 25th, 2022, or other
  rules that may come to replace them.

  Note 2: the procedures and information regarding TFAC fee value is found at Ref. 07 (check
  note at 5.2.4).

  Note 3: payment of the TFAC is not compulsory prior to the initial application process.
  Once the applicable process (example: initial, renewal or amendment) has been created by
  the applicant, on first contact, Anac will provide detailed information on the corresponding
  fee and how to make the payment, by issuing an Invoice Order Letter.'
