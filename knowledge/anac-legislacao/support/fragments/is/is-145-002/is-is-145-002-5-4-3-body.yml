title: Certification application and documents analysis
text: '5.4.3 Certification application and documents analysis

  5.4.3.1 Upon receipt of the certification application and documents, the technical personnel
  of the Anac''s Department of Flight Standards (Superintendência de Padrões Operacionais
  - SPO) will analyze the application documents. If all the required documents are not included
  in the package or nonconformities have been found, the Anac will issue a document (ofício)
  stating the pending items and with information about the corresponding fee and how to make
  the payment. Missing documents may lead Anac to conclude that the application was not initiated.

  Note: each pending item and nonconformities requires corrective action by the applicant.

  5.4.3.2 The applicant who receives a notification of nonconformities must submit the necessary
  corrective actions, in accordance with the guidelines contained in the notification, within
  the deadline established by Anac of up to 30 (thirty) calendar days.

  Note: the deadline referred to in this item may be extended upon express request by the
  applicant, limited to 90 (ninety) calendar days from the date of notification of the nonconformity.
  After this deadline, unless otherwise determined by Anac, such fact shall be considered
  sufficient reason for cancellation and archiving of the process.

  5.4.3.3 This activity will be closed when, in the final phase, Anac issues a document (ofício)
  stating that all application documents are ready to be accepted or approved (as the case)
  by Anac. In addition, Anac will ask the applicant to provide proposed dates for the Anac
  audit.'
