title: Audit scheduling
text: '5.4.4 Audit scheduling

  This phase initiates with the foreign AMO audit dates proposal received by Anac. The AMO
  must propose a convenient schedule to Anac audit in a written document, to be attached to
  the certification process. The document must include the proposed dates for a working week.

  Note: although AMO proposes a date for the audit, Anac will assess its internal availability
  and confirm a specific date later.'
