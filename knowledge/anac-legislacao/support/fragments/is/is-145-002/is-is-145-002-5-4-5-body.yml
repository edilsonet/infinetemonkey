title: Audit scheduling confirmation
text: '5.4.5 Audit scheduling confirmation

  A document (ofício) will be sent to the AMO, informing the Anac audit team members, the
  date of the audit, including the audit sequence. A document (ofício) will also be sent to
  the national CAA of the country where the AMO is located, informing the Anac audit schedule.'
