text: '5.4.6.3 At the end of the audit, the Anac audit team will have an internal meeting.
  The AMO must provide an appropriate room for the meeting.

  5.4.6.4 Soon after, a final meeting with the AMO accountable manager will finish the audit
  process with the release of a nonconformity preliminary report (resumo das não conformidades
  - RNC). At this meeting, the Anac audit team leader will deliver to the AMO all nonconformity
  then identified (if detected) and necessary observations. Any discussions raised during
  the meeting must be registered by the Anac audit team and presented to Anac’s office manager.

  Note: the nonconformity preliminary report will inform that a final report, containing all
  nonconformities, will be issued later via official communication from Anac (ofício).'
