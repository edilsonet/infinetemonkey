title: Audit report
text: '5.4.7 Audit report

  After the Anac audit team return to Brazil, all internal pertinent documents will be filled
  out. The audit report will be analyzed, and a document (ofício) will be issued by the Anac’s
  Department of Flight Standards (Superintendência de Padrões Operacionais - SPO). Any nonconformity
  item found will need a formal answer from the AMO including the necessary corrective action
  plan (plano de ações corretivas - PAC) before issuing the certification document. If nonconformity
  items are not raised, the certification documents will be issued.'
