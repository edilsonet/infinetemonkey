title: Corrective action plan
text: '5.4.8 Corrective action plan

  If any nonconformity item is presented in the document (ofício) with the audit results,
  the AMO must address all the nonconformity items with a corrective action plan. This plan
  must present the correction to the nonconformity raised, identify the (likely) root causes
  of each item, and a proposal of corrective actions for the root causes.'
