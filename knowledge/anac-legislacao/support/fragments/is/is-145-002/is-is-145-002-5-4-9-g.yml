title: 5.4.9(g)
text: 'g) official communication from Anac to the foreign AMO primary CAA to inform the certification.

  5.4.9.2 The certification expiration date will be stated in the COM, which shall remain
  in force until the last day of the twenty-fourth month, counting from the date of the initial
  certification issuance, unless it is sooner suspended, revoked or canceled. The COM will
  also state the address of the main base audited during the certification process. Other
  addresses, such as secondary bases or additional fixed locations, will be identified on
  the EO, provided that they are certified under the same certificate issued by the local
  CAA and provided that they have been included in the initial petition to Anac.'
