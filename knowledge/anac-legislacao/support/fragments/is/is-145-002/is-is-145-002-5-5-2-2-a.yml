text: 'a) the certification renewal application form - Anac Form F-143-30 must be submitted
  by the AMO representative;

  Note: the Anac Form F-143-30 is available as principal document for initial, renewal and
  amendment process. It must be filled out and signed inside the Anac electronic protocol
  system (SEI!).'
