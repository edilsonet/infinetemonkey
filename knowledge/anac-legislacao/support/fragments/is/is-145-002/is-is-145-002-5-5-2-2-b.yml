title: 5.5.2.2(b)
text: 'b) the current version of the maintenance organization certificate, operations specifications
  and capability list, or equivalent documents, accepted/approved by the local CAA;

  Note: if there have been changes to these documents that could impact Brazilian certification,
  the AMO must clearly inform what these impacts were.'
