section_id: 5.5.2.2
section_title: 'The application for certificate renewal must include the following documents:'
subsection_id: c
cite: 5.5.2.2(c)
title: 5.5.2.2(c)
text: 'c) letter indicating whether or not the AMO intends to make any changes to its Brazilian
  certification, during the renewal process. If the intention is to make such changes (Examples:
  deletion/addition of an aeronautical product model in the operations specifications; change
  of AMO address; change of AMO name; changes of class or ratings; etc.), and these changes
  impact the Brazilian maintenance organization certificate, operations specifications or
  capability list approval, all pertinent documents listed in section 5.4.2 of this IS must
  be updated and presented;'
