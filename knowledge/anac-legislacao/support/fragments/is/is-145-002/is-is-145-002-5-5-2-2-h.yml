section_title: 'The application for certificate renewal must include the following documents:'
subsection_id: h
cite: 5.5.2.2(h)
title: 5.5.2.2(h)
text: 'h) the Anac fee (TFAC) payment receipt, in case it has already been paid.

  Note 1: the TFAC fee was established by Law No. 11.182/2005, article 29 and its annex III
  lists the situations that require its payment. The matter is dealt in Resolution No. 653,
  dated December 20th, 2021, regulated by Ordinance No. 8.676, dated July 25th, 2022, or other
  rules that may come to replace them.


  Note 2: the procedures and information regarding TFAC fee value is found at Ref. 07 (check
  note at 5.2.4).

  Note 3: payment of the TFAC is not compulsory prior to the initial application process.
  Once the process has been created by the applicant, on first contact, Anac will provide
  detailed information on the corresponding fee and how to make the payment, by issuing an
  Invoice Order Letter.'
