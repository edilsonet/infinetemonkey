title: Submission of the certification renewal application and documents
text: '5.5.2 Submission of the certification renewal application and documents

  5.5.2.1 A foreign AMO certified by the Anac which intends to have its certification renewed
  must submit, at least 60 (sixty) days prior to the certification expiration, the renewal
  certificate application and corresponding documents, in the same way as for the certification
  application defined in section 5.4.2 of this IS. Those 60 days are necessary for Anac internal
  procedures to process the application, preventing the COM expiration.

  Note: if the AMO does not submit its renewal application before the COM expiration date,
  it will be considered revoked. To recover the certification, the AMO should apply for a
  new certificate, in accordance with section 5.4.2 of this IS.'
