title: Renewal application and documents analysis
text: '5.5.3 Renewal application and documents analysis

  5.5.3.1 After receiving the renewal certificate application, the Anac will perform a technical
  analysis of the renewal application and documents. All pertinent details of the technical
  analysis will be stated in a document (ofício), issued by the Anac’s Department of Flight
  Standards (Superintendência de Padrões Operacionais - SPO).'
