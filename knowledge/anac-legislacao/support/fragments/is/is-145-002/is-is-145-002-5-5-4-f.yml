text: 'f) acceptance of safety management system manual, if such a document was not previously
  accepted / approved by the local CAA.

  5.5.4.2 The Certification expiration date will be stated in the COM, which shall remain
  in force until the last day of the twenty-fourth month, counting from the expiration date
  of the last COM issued, unless it is suspended, revoked or canceled. The COM and EO will
  state the address(es) of the facilities considered during the initial certification process.

  Note: the issuance of the certificate may occur without a prior audit. This is usually done
  to avoid lack of support to Brazilian operators while the renewal process is taking place.
  However, as part of the renewal process or even as surveillance action, the AMO must be
  available for Anac audit whenever requested, which may occur before or even after the issuance
  of the certificate. In this case, the procedures mentioned in 5.4.4 to 5.4.8 will be applied.
  If the AMO does not make itself available to receive the audit or in case of non-compliance
  with any other requirements of the current Brazilian regulations, according to RBAC No.
  145 section 145.55, the certificate may be suspended or revoked by the Anac, at any time.

  5.6 Certification amendment process'
