cite: 5.6.2(a)
title: 5.6.2(a)
text: 'a) Ownership transfer:

  I- the property alteration must be submitted to Anac 30 (thirty) days before the intended
  effective day;

  II- together with Anac Form F-143-30, the application must include a letter detailing the
  amendment;

  III- the AMO must identify the new accountable manager, if there has been a change; and

  IV- a copy of the certificate amended by its local civil aviation authority has to be sent
  together with the certificate proposal to be amended by Anac. The new proprietary / owner
  has to be the same listed at the certificate emitted by its local CAA.'
