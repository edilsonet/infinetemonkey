cite: 5.6.2(b)
title: 5.6.2(b)
text: 'b) Certificate amendments - in the following cases:

  I- change and addition of new locations:

  A- the change of address must be submitted to Anac 30 (thirty) days before the intended
  effective day;

  B- the application must be accompanied by AMO''s local CAA certificate and operations specifications,
  containing information about the new address;

  C- if AMO''s local manuals have been revised, those revisions must also be sent along with
  the application; and

  D- additional steps and conditions are shown below, for each of the specified cases:

  i. change of address indicated on the Anac certificate:

  The application must be accompanied by a proposal for the new Anac certificate (Anac Form
  F-900-71), indicating the new address, as described in section 5.4.2 c) I- of this Supplementary
  Instruction.

  Note 1: the change of address of the main base in the Anac Certificate may involve an audit
  to verify AMO''s new facilities, in accordance with section 5.4.4 of this IS.

  Note 2: other addresses, such as secondary bases or additional fixed locations, will be
  identified in Anac operations specifications, provided they are under the same certificate
  issued by the local CAA for the main base.

  ii. inclusion of additional fixed locations in existing Anac operations specifications:
  depending on the geographical location (usually at the same aerodrome, in the same municipality,
  or in regions close to the base to which they are linked), the AMO may have additional fixed
  facilities included in an existing Anac operations specifications, without the need to certify
  each facility individually as an independent workshop or secondary base. For this to occur,
  the following conditions must be met:

  1. the application must be accompanied by a proposal for the new Anac operations specifications
  (EO) (Anac Form F-900-72), indicating the new address, as described in section 5.4.2 c)
  II- of this Supplementary Instruction;

  2. the AMO must present evidence that the additional fixed facilities remain under the full
  control of the base to which they are linked; and

  3. the AMO manual must clearly describe the services performed at each additional fixed
  facility and detail how the control and transport of materials, technical data, personnel,
  and tools between these facilities will be managed.

  Note 1: Anac will evaluate the location (distance between facilities), the level of maintenance
  performed, and whether inspection of additional fixed facilities can be performed during
  the base audit. If the conditions outlined above are met, the authorization for the use
  of additional fixed facilities will be included in the AMO''s Anac operations specifications
  (EO).

  Note 2: if the new facilities do not qualify as an "additional fixed location", operations
  specifications (EO) will be issued, categorizing them as a secondary base.

  iii. adding a secondary base with issuance of an additional Anac operations specifications
  (EO):

  1. the application must be accompanied by a proposal for the new Anac operations specifications
  (EO) (Form F-900-72), indicating the new address, as described in section 5.4.2 c) I- of
  this Supplementary Instruction;

  2. the AMO must present evidence that the secondary base facilities remain under the full
  control of the main base to which they are linked; and

  3. the secondary base must use and be included in the same manuals and procedures as of
  the main base.


  II- adding or amending classes or ratings - may occur in the following cases:

  capability decrease: in accordance with section 145.57 of RBAC No. 145, an AMO capability
  decrease must be informed to Anac in 5 (five) business days and Anac may establish additional
  limitations or even a suspension if it’s found that the AMO has no condition to sustain
  its certification;

  capability increase: in accordance with section 145.57 of RBAC No. 145, the application
  for adding capabilities must be made by an application to amend the AMO''s Anac operations
  specifications (EO) and / or Anac maintenance organization certificate (COM).

  A- Anac operations specifications (EO) amendments:

  i. each application for EO amendments has to be made 30 (thirty) days before its intended
  EO effective date;

  ii. the application must be accompanied by the following documentation:

  1. AMO''s local CAA certificate and operations specifications, containing information about
  the intended capacity;

  2. a letter describing, in detail, all intended changes (See note 2, below);

  3. a description of all requirements for the AMO to be considered capable of exercising
  the new capacity: installations, special tools, technical data access, personnel qualification,
  manual revision, as required; and

  4. the applicable fee (TFAC) payment receipt.

  Note 1: this process follows the same activities of section 5.4.2 of this IS.

  Note 2: to describe the intended changes, as required above, it is recommended that AMO
  use, as a reference, the current version of its Anac operations specifications (EO), and
  include highlights on the items modified / added / removed. Also remember: if the new EO
  proposal omits a rating previously included, this will be considered as a request to remove
  the item, therefore, pay close attention to the details informed in your application.

  B- Capability list (LC) amendments:

  In this case the application for amendment is not applicable, since Anac defines only two
  cases in which a foreign AMO may change its LC:

  i. when the AMO already has a capability list accepted or approved by its local civil aviation
  authority, and the section referring to parts, components, instruments and accessories is
  deemed approved by Anac, limited to class and rating contained in the AMO RBAC No. 145 certificate.
  In this case, the AMO does not need to submit the revision of the capability list; or

  ii. when the AMO does not have a capability list accepted or approved by its local CAA,
  but has incorporated an article self-inclusion procedure in its Anac Brazilian supplement.
  In this case, whenever the AMO makes modifications to its capability list, the new revision
  must be forwarded to Anac, for simple information, according to the self-inclusion communication
  procedures accepted in the AMO Brazilian supplement manual.

  Note: in case of amendments in the capability list that imply in Anac certification class
  or ratings changes, the AMO must apply for amending those class or ratings, as per 5.6 b)
  II -, sending the documentation listed in that item, except for that referring to installations,
  special tools, technical data access, etc.

  5.7 Brazilian supplement revisions (or revisions of other manuals that required acceptance
  / approval by Anac)'
