text: '5.6.2 Information, as type of process, fees, etc. related to certificate amendment
  is available on Ref. 01 (check note at 5.2.4).

  5.6.3 For AMOs certified by Anac, it is mandatory to submit a certificate amendment request,
  using the Anac form F-143-30, whenever the situations listed below occur, observing the
  minimum notice periods defined in RBAC No. 145, section 145.57 (Portuguese only), as appropriate:

  Note: the Anac Form F-143-30 is available as principal document for initial, renewal and
  amendment process. It must be filled out and signed inside the Anac electronic protocol
  system (SEI!).'
