section_title: 'Manuals should be submitted for simple information (and not for acceptance/approval),
  to update the Anac database in the following cases:'
subsection_id: b
cite: 5.7.2(b)
title: 5.7.2(b)
text: 'b) when the change to the manual does not include the situations listed above.

  Note 1: payment of fees is only applicable for revisions of Anac supplement (as described
  in item 5.7.1), and other manuals, such as SMS Manual and training program, that required
  acceptance/approval by Anac, because they were not accepted/approved by the local authority.
  In these cases, a TFAC will be charged. Information regarding TFAC fee value is found at
  Ref. 07 (check note at 5.2.4). There are no fees for the cases defined in 5.7.2.

  Note 2: whenever manuals are revised, they must be submitted to Anac. Instructions on how
  to proceed can be found at Ref. 09 (check note at 5.2.4).

  APPENDIX

  APPENDIX A - ACRONYMS LIST

  APPENDIX B - CHANGE CONTROL

  FINAL CONSIDERATIONS

  7.1 The changes markups were intentionally hidden, due to the extension of the changes implemented
  in this revision.

  7.2 The AMO must work with a term of 90 (ninety) days to present evidence of required actions
  during all the process phases as well as the answers for each communication of nonconformity,
  following as much as possible, the chronology of events as agreed in the certification schedule.
  Any process with pending items, left without communication from the AMO for more than 90
  (ninety) days will be cancelled. If the answer to a same nonconformity is rejected for the
  third time, the certification process will be terminated, regardless of the previous term.

  7.3 Revision C of IS 145-002, does not require that foreign AMO already Anac certified revise
  its documents (example: manuals, forms, etc.) before a renewal certificate process.

  7.4 Infraction to provisions of the Brazilian Aeronautical Code - CBAer: Infractions to
  provisions of CBAer, including the obligation to comply with regulations issued by Anac,
  can motivate the application of administrative penalties. In that case, Anac will issue
  an “auto de infração - AI".

  7.5 The cases not addressed by this IS shall be resolved by Anac.


