title: Supervisionar todo pessoal da inspeção;
text: '1. Supervisionar todo pessoal da inspeção;

  2. Manter uma lista atualizada de dados técnicos pertinentes, incluindo os RBAC, especificações,
  manuais de manutenção dos fabricantes, boletins de serviço (BS), Diretrizes de Aeronavegabilidade
  (DA), e outros dados técnicos aceitos ou aprovados pela ANAC;

  3. Assegurar o cumprimento adequado da emissão do formulário ANAC F-400-04 para aprovação
  de Grandes Alterações e Grandes Reparos (Célula, GMP, Hélice ou Acessório), quando requerido;'
