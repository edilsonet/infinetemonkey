text: '4.1.13 Manual da Organização de Manutenção - MOM: um manual que descreve a política
  e os procedimentos da OM.

  4.1.14 Procedimento: um roteiro com orientações para executar uma atividade ou uma série
  de etapas, tal como um roteiro que descreve os métodos, etapas ou meios de cumprir um processo
  ou uma política.

  4.1.15 Subcontrato: acordo entre uma OM e outra pessoa, para executar funções de manutenção
  de um artigo. A OM exercerá as prerrogativas do seu certificado e assumirá a responsabilidade
  do trabalho executado pela(s) pessoa(s) subcontratada(s).

  4.1.16 Supervisor: uma pessoa que orienta o trabalho executado de acordo com o certificado
  da OM e suas Especificações Operativas e está disponível fisicamente na OM quando o trabalho
  está sendo executado. (Ver seções 43.3 do RBAC nº 43 e 145.153 do RBAC nº 145 quanto aos
  requisitos do pessoal de supervisão.)

