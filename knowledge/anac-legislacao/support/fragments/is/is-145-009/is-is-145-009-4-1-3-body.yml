text: '4.1.3 Ação Preventiva: uma ação tomada para eliminar a causa de uma não conformidade
  potencial ou outra situação potencial indesejável.

  4.1.4 Aprovado: significa, quando seguido do termo “pela ANAC”, que o documento (ou informação)
  foi analisado e aprovado pela ANAC. A aprovação é concedida a uma OM quando a informação,
  tal como uma especificação de processo ou categoria, é listada nas Especificações Operativas
  - EO ou em outro documento específico.

  4.1.5 Autoinclusão: é um processo em que a OM, previamente autorizada pela ANAC em suas
  Especificações Operativas, realiza uma autoavaliação de sua capacidade frente aos requisitos
  regulamentares presentes no RBAC nº 145 para executar serviços de manutenção em determinado
  artigo sem a necessidade de análise e aprovação prévia por parte da ANAC.

  4.1.6 Categoria: a parte no certificado da OM que descreve as condições especiais, prerrogativas
  ou limitações emitidas de acordo com as seções 145.59 e/ou 145.61-I do RBAC nº 145.'
