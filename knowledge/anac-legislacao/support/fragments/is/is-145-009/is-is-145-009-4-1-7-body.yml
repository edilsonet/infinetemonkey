text: '4.1.7 Correção: uma ação tomada para eliminar uma não conformidade constatada.

  4.1.8 Dado técnico: para os efeitos desta IS, é um documento emitido pelo detentor do projeto
  de tipo do produto aeronáutico (aeronave, motor, hélice, equipamento ou componente), que
  fornece métodos, técnicas e práticas aceitáveis para a execução de manutenção, manutenção
  preventiva e alterações. Esses documentos incluem, mas não estão limitados a ICA (Instruções
  de Aeronavegabilidade Continuada), manuais de manutenção (inclusive de componentes), boletins
  de serviço, manuais de reparos estruturais, cartas de serviço, etc.'
