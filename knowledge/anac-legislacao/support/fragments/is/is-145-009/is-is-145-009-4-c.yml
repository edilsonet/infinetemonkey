title: 4(c)
text: 'c) Formato Industrial/ISO - Os deveres e responsabilidades podem ser cobertos na seção
  de responsabilidade da administração do MOM. As seguintes questões ou considerações são
  oferecidas como um guia, e pretendem auxiliar a OM a iniciar a criação dos procedimentos
  no seu MOM. Não se deve considerar, entretanto, que elas incluem tudo. Cada OM é única e,
  por isso, pode requerer procedimentos adicionais para validar os requisitos regulatórios
  e as necessidades da OM:

  I- Os deveres e responsabilidades incluem as áreas de responsabilidades designadas para
  cada posição da administração?

  II- Os deveres e responsabilidades indicam a estrutura de subordinação (a qual posição cada
  um reporta)?

  III- A narrativa descreve a(s) função(ões) de trabalho que a pessoa executa (i.e., calibração,
  treinamento, administração de pessoal)?

  IV- Os procedimentos asseguram que todos os deveres e responsabilidades da pessoa de supervisão
  e inspeção são executados na sua ausência?

  V- O MOM tem um procedimento para verificar se um supervisor ou inspetor está qualificado
  para assumir as obrigações delegadas?'
