title: 4(d)
text: 'd) Considerar as seguintes questões quando delegar deveres e responsabilidades em uma
  OM:

  I- Os supervisores da OM são todos detentores de licença emitida pela ANAC de acordo com
  o RBAC nº 65?

  II- Os inspetores da OM compreendem, leem e escrevem na língua portuguesa e no idioma em
  que são apresentados os dados técnicos (ver seção 145.155 do RBAC nº 145 para OM no exterior)?

  III- As pessoas que aprovam artigos para retorno ao serviço são autorizadas formalmente
  pela OM e são detentoras de licença emitida de acordo com o RBAC nº 65?

  5.5 Elementos do MOM e do MCQ

  5.5.1 Procedimentos para manter e revisar a Lista do pessoal autorizado da OM: a lista do
  pessoal autorizado é uma lista de pessoas da OM que são designadas pelo GR ou RT e são autorizadas
  a executar certas funções, tais como aprovação para retorno ao serviço, inspeção de itens
  de inspeção obrigatória IIO (por delegação de um operador), serviços de soldagem, usinagem,
  limpeza, etc., ou até de pessoas que detém certas posições de gerência técnica ou supervisão.
  Essa lista pode ser mantida em formato eletrônico ou em papel, mas deve estar acessível
  para análise e inspeção pela ANAC.'
