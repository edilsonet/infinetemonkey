title: 5.2.7.5(b)
text: 'b) Análise do Modelo 1

  I- Vantagens: o modelo 1 inclui cada um dos elementos requeridos de um procedimento em um
  formato narrativo. Esse modelo é fácil de escrever, desde que o autor se lembre de incluir
  todos os elementos. Esse modelo é normalmente de fácil entendimento ao leitor e não requer
  treinamento especial do autor ou do leitor.

  II- Desvantagens: o formato narrativo pode facilmente se tornar muito complexo ou prolixo.
  O autor pode se esquecer de incluir todos os elementos requeridos em um procedimento. A
  narrativa deve ser apresentada em uma sequência lógica de modo que leitor possa facilmente
  entender o fluxo do procedimento.'
