title: 5.2.7.5(e)
text: 'e) Aprovação do pessoal interno responsável pelo manual e suas revisões.

  5.2.7.6 Combinações Adicionais: combinações adicionais que efetivamente funcionem na OM,
  e sejam aceitáveis pela ANAC, podem ser incluídas no sistema do manual.

  5.2.7.7 Modelos de procedimento: os exemplos seguintes são fornecidos para auxiliar o elaborador
  do manual a definir um possível formato para os procedimentos no sistema do manual. São
  apresentados apenas quatro exemplos dos muitos formatos possíveis. O RBAC nº 145 estabelece
  os requisitos para o conteúdo, e não a formatação. O formato usado para os procedimentos
  no manual deve se adequar ao tamanho e complexidade da OM.'
