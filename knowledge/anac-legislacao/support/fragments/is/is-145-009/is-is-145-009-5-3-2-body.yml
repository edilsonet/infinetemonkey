text: '5.3.2 Requisitos: os manuais devem conter procedimentos para revisão e notificação
  das revisões à ANAC.

  NOTA 1: Os regulamentos não requerem que a ANAC analise e aceite todas as revisões antes
  da sua implementação. A OM deve seguir os procedimentos de revisão descritos em seus manuais.
  O parágrafo 5.3.5.1 desta IS contém informações adicionais sobre a revisão de manuais.

  5.3.3 Controle das submissões e revisões: esta seção deve conter procedimentos para controlar
  a submissão dos manuais e as subsequentes revisões. Os procedimentos devem assegurar que
  as pessoas recebam as revisões. Os empregados de uma OM podem requerer treinamento no conteúdo
  das revisões, especialmente se um procedimento operacional padrão ou procedimento de inspeção
  for modificado.

  NOTA 1: Os empregados de uma OM precisam ter conhecimento dos procedimentos estabelecidos
  nos manuais na extensão das suas responsabilidades.

  5.3.4 Descrição do sistema de controle: os manuais devem incluir uma descrição do sistema
  utilizado para identificar e controlar suas seções. O regulamento não especifica o formato
  e/ou a estrutura desse sistema. Essa flexibilidade acomoda os avanços tecnológicos que permitem
  as OM manter e revisar os manuais em diferentes formatos e maneiras.'
