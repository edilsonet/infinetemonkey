text: '5.3.5.1

  Incluído.

  5.3.7.2, NOTA 1

  Excluída, pois foi integrada ao item 5.3.5.1.

  5.5.3.4-III

  Alterado.

  5.5.3.5f)

  Alterado.

  7.1

  Alterado.


  ALTERAÇÕES REALIZADAS NA REVISÃO D

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  Título

  Atualizado com a remoção da expressão “Declaração de Conformidade”.

  1.1

  Excluída a menção ao modelo de Declaração de Conformidade. Feitos ajustes editoriais.

  1.2

  Item excluído. Feitos ajustes editorais na Nota 1. Excluída a Nota 2.

  Seção 2

  Seção atualizada.

  Seção 3

  Texto da seção “Fundamentos” foi substituído por texto padrão utilizado nas IS emitidas
  pela SPO.

  4.1

  Incluído item estabelecendo como válidas as definições presentes nos RBAC nº 01, 43 e 145,
  além das definições da IS. As definições foram renumeradas como subitens do item 4.1.'
