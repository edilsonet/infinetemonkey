section_id: 5.3.5
section_title: 'Procedimentos: independentemente do método utilizado para a elaboração dos
  manuais, os procedimentos para efetuar revisões devem incluir:'
subsection_id: b
cite: 5.3.5(b)
title: 5.3.5(b)
text: 'b) Aceitação formal: após análise do conteúdo, a ANAC aceita ou rejeita a revisão dos
  manuais, informando à OM por ofício. O ofício conterá o título do manual aceito ou não,
  a sua data e número da revisão. A OM só poderá utilizar a nova versão do manual após a análise
  e aceitação formal por parte da ANAC. Se o manual for rejeitado, serão informadas detalhadamente
  as deficiências, e recomendar-se-á à OM não executar manutenção, caso o procedimento rejeitado
  esteja em uso.

  Nos termos dos parágrafos 145.207(a) e 145.211(a) do RBAC nº 145, o MOM e MCQ devem ser
  submetidos à ANAC para análise e aceitação formal apenas nas seguintes situações:

  I- certificação inicial da OM;

  II- inclusão de novos procedimentos decorrentes de isenção de requisitos ou procedimentos
  alternativos de cumprimento de IS;

  NOTA 1: nos casos de isenção de requisito, a OM deve seguir o disposto no RBAC nº 11. Nos
  casos de procedimento alternativo, a OM deve seguir o disposto na Resolução nº 30. A simples
  aceitação do manual não constitui aprovação de isenção ou meio alternativo.

  III- reedição completa do manual;

  NOTA 1: no caso de reedição completa do manual, é necessária apresentação de comprovante
  de pagamento da TFAC aplicável.

  IV- inserção de procedimentos com o objetivo de cumprir requisitos estabelecidos em acordos
  internacionais de manutenção; e

  V- outras situações conforme determinadas pela ANAC em processo específico.'
