section_id: 5.3.5
section_title: 'Procedimentos: independentemente do método utilizado para a elaboração dos
  manuais, os procedimentos para efetuar revisões devem incluir:'
subsection_id: c
cite: 5.3.5(c)
title: 5.3.5(c)
text: 'c) Submissão somente para conhecimento: nos seguintes casos, não é necessária a aceitação
  formal por parte da ANAC, devendo o manual ser enviado somente para conhecimento:

  I- adequação dos procedimentos descritos à realidade da OM e às mudanças na legislação;
  e

  II- quando a alteração do manual não constar das situações descritas no parágrafo 5.3.5.1b)
  desta IS.

  NOTA 1: um MOM/MCQ original é submetido à aceitação da ANAC no momento da certificação da
  OM. Após a submissão do MOM/MCQ original, a OM pode optar em seguir as instruções do parágrafo
  5.3.5.1 desta IS, que define as situações nas quais é necessário enviar a revisão do manual
  para aceitação da ANAC e, consequentemente, as situações em que a OM pode apenas comunicar
  a ANAC da revisão do manual.'
