  5.3.5.1 Procedimentos para submissão à ANAC: a ANAC deve ser notificada de todas as revisões
  dos manuais (MOM e MCQ), seja para análise e aceitação formal, seja somente para conhecimento
  e atualização do banco de dados. Os seguintes procedimentos se aplicam para esta notificação:'
