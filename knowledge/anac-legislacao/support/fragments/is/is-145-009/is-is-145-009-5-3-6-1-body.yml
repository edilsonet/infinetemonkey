text: '5.3.6.1 Revisões: procedimentos para revisar os manuais e notificar a ANAC das revisões,
  incluindo como a ANAC será notificada das revisões.

  5.3.6.2 Detalhes: provisões para indicar o número da revisão, a data da revisão, a página
  revisada, e o local onde a pessoa que faz a revisão irá assinar ou rubricar.

  5.3.6.3 Número de controle do manual e a destinação: cada cópia dos manuais deve ter um
  número único designativo e o nome da pessoa, departamento ou grupo a quem ele é destinado.
  Deve existir um procedimento para identificar quem manterá a lista de distribuição (que
  contém cada pessoa detentora de uma cópia dos manuais, e o status da revisão).

  NOTA 1: Um protocolo (recibo) é um método comum para rastrear o recebimento e a inserção
  da revisão pelo detentor de cada cópia do manual, o que confere responsabilidade de atualização
  do manual a esse detentor. Com esse método, após receber uma revisão, cada detentor de uma
  cópia de manual insere as páginas revisadas no manual apropriado, registra a incorporação
  da revisão no registro de revisões, e devolve o recibo assinado para a pessoa responsável
  pelo controle da lista de distribuição.

  5.3.7 Formato eletrônico: Os manuais podem ser mantidos em uma rede informatizada ou em
  outro meio eletrônico. A AC 120-78 - Electronic Signatures, Electronic Recordkeeping, and
  Electronic Manuals, da FAA pode ser utilizada para orientação adicional para sistemas eletrônicos,
  especificamente para a manutenção dos manuais em formato digital.'
