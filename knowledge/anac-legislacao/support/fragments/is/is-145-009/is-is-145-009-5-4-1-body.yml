text: '5.4.1 Referência: RBAC nº 145 - Parágrafo 145.209(a).

  5.4.2 Autoridade: um organograma identifica (somente pelo título) cada posição de gerência
  com autoridade para agir em nome da OM. Se a OM executa serviços para um transportador aéreo
  ou operador aéreo de acordo com a seção 145.205 do RBAC nº 145, e está executando inspeção
  em IIO para o operador, a ANAC sugere que o organograma reflita a separação entre os departamentos
  de manutenção e de inspeção.'
