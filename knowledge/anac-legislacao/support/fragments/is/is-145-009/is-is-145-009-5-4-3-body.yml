  MOM:'
text: '5.4.3 Detalhes: assegurar que os seguintes detalhes estão cobertos nos procedimentos
  do MOM:

  I- Os títulos e a estrutura apresentada no organograma são adequados?

  II- Os títulos para as posições são as mesmas ao longo de todos os manuais?

  III- Cada posição de gerência com autoridade para responder em nome da OM, está identificada?

  IV- Está designado um GR?'
