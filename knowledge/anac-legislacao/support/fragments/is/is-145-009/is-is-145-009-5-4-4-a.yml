title: 5.4.4(a)
text: 'a) Exemplo: Modelo 1 - Formato Narrativo:

  Gestor Responsável: responsável pela totalidade da operação da (nome da organização), de
  acordo com os regulamentos aplicáveis. Os deveres do Gestor Responsável incluem manter uma
  equipe adequada e com conhecimentos para planejar, executar, supervisionar e inspecionar
  os trabalhos sendo executados em artigos da aviação civil. O Gestor Responsável pode delegar
  todos os deveres a pessoas qualificadas conforme necessário. Entretanto, tal delegação não
  exime o Gestor Responsável da total responsabilidade.'
