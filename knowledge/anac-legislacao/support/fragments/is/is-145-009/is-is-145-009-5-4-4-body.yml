title: Deveres e responsabilidades
text: '5.4.4 Deveres e responsabilidades

  5.4.4.1 Organização: esta seção pode ser combinada com o organograma como uma seção/capítulo
  de um sistema do MOM. Se a OM documenta seus procedimentos em um formato que inclui uma
  seção relativa às responsabilidades em cada procedimento, não será necessário existir uma
  seção separada para deveres e responsabilidades (ver parágrafo 5.2.7.7 desta IS, Procedimentos
  Modelos 2 e 3).

  5.4.4.2 Área de responsabilidade: esta seção inclui, para cada posição gerencial, os deveres,
  responsabilidades e abrangência da autoridade. A OM deve assegurar que os deveres e responsabilidades
  são apropriados, e que essas posições existem dentro da organização. Embora não seja requerido
  pelo regulamento, muitas OM optam por incluir deveres e responsabilidades além do requerido
  para o pessoal de gerência. Posições descritas no organograma devem ser incluídas na seção
  de deveres e responsabilidades para garantir consistência.

  5.4.4.3 Responsabilidades adicionais: deveres e responsabilidades que estejam fora do escopo
  da gerência, mas são parte dos requisitos dos regulamentos, devem ser descritos nesta seção
  do MOM. Por exemplo, manutenção de equipamento, aprovação para retorno ao serviço, etc.

  NOTA 1: Somente títulos, e não nomes, devem aparecer nesta seção. Os títulos devem ser os
  mesmos do organograma e das outras partes do MOM.

  NOTA 2: Títulos usados nos seguintes modelos de formato são somente exemplos.'
