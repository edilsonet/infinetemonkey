text: '5.5.1.1 Referências: RBAC nº 145, parágrafos 145.161(a)(1), 145.161(a)(2), 145.161(a)(3)
  e 145.209(b).

  5.5.1.2 Formato da Lista do pessoal autorizado: a OM deve ter procedimentos para manter
  a lista e pode desenvolver seu próprio formato da lista, desde que ela contenha todos os
  nomes pertinentes.

  5.5.1.3 Inclusão no Manual: o procedimento deve descrever como a lista será alterada, dentro
  de 5 (cinco) dias úteis a partir de uma revogação de designação, nova designação, mudança
  de obrigações ou do escopo de designação, ou inclusão de outra pessoa.

  5.5.1.4 Lista combinada do pessoal autorizado: pode ser conveniente para a OM desenvolver
  uma lista combinada, que inclua as rubricas e/ou assinaturas e/ou número dos carimbos, números
  das licenças de MMA, ou qualquer outra informação usada para designar a autoridade das pessoas
  da inspeção e supervisão que pode assinar e/ou carimbar documentos de trabalho ou aprovar
  artigos para retorno ao serviço.

  NOTA 1: Algumas OM desenvolvem carimbos personalizados para identificar as pessoas com autorização.
  As pessoas autorizadas na lista podem utilizar-se destes carimbos, em substituição a assinaturas
  e rubricas desde que seja assegurado que estes carimbos sejam pessoais e intransferíveis.
  Entretanto, a ANAC alerta que esse procedimento deve ser verificado entre contratante e
  contratado de serviços de manutenção, pois alguns contratantes podem requerer rubrica e
  carimbo em sua documentação.

  5.5.1.5 Sumário histórico de trabalho: a OM deve manter um resumo do(s) emprego(s) anteriores,
  descrevendo as atividades desenvolvidas de cada pessoa cujo nome esteja relacionado na Lista.
  O sumário histórico dos supervisores, inspetores e pessoas responsáveis pelo retorno ao
  serviço podem ser feitos no idioma do país onde está localizada a OM, se esta está fora
  do Brasil. Tais OMs devem descrever em seus manuais como elas proverão a ANAC com a versão
  em português ou inglês dos sumários. Os requisitos do conteúdo dos sumários estão no parágrafo
  145.161(a)(4) do RBAC nº 145.

