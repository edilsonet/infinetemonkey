text: h) As pessoas autorizadas a aprovar artigos para retorno ao serviço são certificadas?
  (Todas as pessoas autorizadas a aprovar artigos para retorno ao serviço devem ser certificadas
  de acordo com o RBAC nº 65, exceto para as oficinas localizadas fora do Brasil).
