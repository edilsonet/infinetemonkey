section_title: Aprovação para retorno ao serviço e Certificado de Liberação Autorizada (Formulário
  ANAC F-100-01)
subsection_id: a
cite: 5.5.11.16(a)
title: 5.5.11.16(a)
text: a) A aprovação para retorno ao serviço deve atender aos requisitos das seções 43.9 e
  43.11 do RBAC nº 43. Conforme prevê o parágrafo 43.9(d)-I do RBAC nº 43, um artigo que não
  esteja instalado em uma aeronave deve ter o registro da sua aprovação para retorno ao serviço
  em um formulário, conforme estabelecido pela ANAC. O formulário F-100-01 é o meio aceitável
  estabelecido pela Agência para o registro de manutenção, referente a motores de aeronaves,
  hélices ou outros artigos. Os procedimentos e instruções para o preenchimento e emissão
  do formulário F-100-01 estão descritos na IS nº 43.9-002.
