title: 5.5.11.16(c)
text: c) Se a manutenção for executada em um artigo com limite de vida, incluir o tempo total
  e ciclo total. Se o artigo requer revisão periódica, de acordo com o programa de manutenção
  do operador, incluir o tempo desde a revisão.
