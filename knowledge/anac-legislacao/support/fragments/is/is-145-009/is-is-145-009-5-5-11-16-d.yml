section_title: Aprovação para retorno ao serviço e Certificado de Liberação Autorizada (Formulário
  ANAC F-100-01)
subsection_id: d
cite: 5.5.11.16(d)
title: 5.5.11.16(d)
text: d) Se a OM executou manutenção para um transportador aéreo, ela deve seguir os procedimentos
  de aprovação para retorno ao serviço descritos no manual do transportador aéreo. Os formulários
  e procedimentos do operador podem diferir daqueles que a OM normalmente utiliza.
