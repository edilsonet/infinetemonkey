section_title: Aprovação para retorno ao serviço e Certificado de Liberação Autorizada (Formulário
  ANAC F-100-01)
subsection_id: f
cite: 5.5.11.16(f)
title: 5.5.11.16(f)
text: 'f) Os procedimentos de aprovação para retorno ao serviço devem incluir o seguinte (conforme
  aplicável):

  I- Quem (por título) está autorizado a preencher o formulário? Como essa pessoa foi autorizada?

  II- A pessoa está certificada conforme o RBAC nº 65, se ela for empregada de uma OM localizada
  no Brasil?

  III- Os procedimentos asseguram que uma pessoa qualificada e autorizada pode assumir as
  responsabilidades desta tarefa, se a pessoa que normalmente executa essa tarefa não estiver
  disponível (exemplos: doença, férias, etc.)?

  IV- A aprovação para retorno ao serviço inclui ou referencia uma lista de partes aprovadas?

  V- Como a OM assegura que ela aprova para retorno ao serviço somente aqueles artigos para
  os quais ela está certificada?

  VI- Como a OM determina se uma alteração é maior? Se a manutenção foi um grande reparo ou
  uma grande alteração, como ele/ela será registrado(a)?

  VII- Quem (por título) está autorizado a preencher o Formulário ANAC F-400-04, e como essa
  pessoa é autorizada?

  VIII- Quais registros são entregues ao cliente, e quais registros são mantidos no arquivo
  da OM?

  IX- As pessoas que efetuam a aprovação para o retorno ao serviço foram treinadas para essa
  posição?'
