section_title: 'Sistema e procedimentos: esta seção do MCQ deve incluir a descrição do sistema
  e procedimentos usados para:'
subsection_id: a
cite: 5.5.11.2(a)
title: 5.5.11.2(a)
text: a) Os procedimentos devem incluir inspeção visual da embalagem (caixa ou recipiente)
  e do conteúdo, quanto a avarias de transporte e documentação apropriada. Esta seção deve
  incluir procedimentos para ajudar o pessoal de recebimento na execução do seu trabalho,
  quer o artigo esteja em condições satisfatórias, quer avariado quando foi recebido. O procedimento
  deve incluir como o pessoal de recebimento documenta ou registra uma avaria devido ao manuseio
  inadequado, e o título da pessoa notificada da avaria. A descrição do procedimento pode
  incluir como se faz o encaminhamento de materiais e artigos;
