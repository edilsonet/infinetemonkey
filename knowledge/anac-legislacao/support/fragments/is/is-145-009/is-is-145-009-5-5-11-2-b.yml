cite: 5.5.11.2(b)
title: 5.5.11.2(b)
text: b) O pessoal de recebimento pode precisar analisar a documentação recebida com os artigos
  mantidos por outras empresas subcontratadas pela OM, ou partes recebidas de fornecedores
  do exterior. Todos os motores, hélices e partes/componentes/LRU (Line Replaceable Unit)
  fabricados no exterior e recebidos por uma organização RBAC nº 145, devem cumprir integralmente
  a seção 21.305 do RBAC nº 21;
