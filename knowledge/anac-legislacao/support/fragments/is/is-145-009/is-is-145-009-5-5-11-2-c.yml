section_title: 'Sistema e procedimentos: esta seção do MCQ deve incluir a descrição do sistema
  e procedimentos usados para:'
subsection_id: c
cite: 5.5.11.2(c)
title: 5.5.11.2(c)
text: 'c) Artigos produzidos no Brasil e exportados para instalação em aeronaves não registradas
  no Brasil estão sob o controle ou jurisdição da autoridade do país importador e não sob
  a jurisdição do sistema regulatório da ANAC. Até que esses artigos retornem ao controle
  do sistema regulatório do Brasil, eles não podem retornar ao serviço sob as provisões dos
  RBAC nº 43 e 145. Se a OM tiver certificação dupla (também sob outra autoridade de aviação
  civil) ela poderia efetuar a aprovação usando a certificação de outras autoridades, tais
  como: FAA, EASA, etc.;'
