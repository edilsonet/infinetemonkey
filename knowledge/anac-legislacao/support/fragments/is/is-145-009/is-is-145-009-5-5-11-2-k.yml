title: 5.5.11.2(k)
text: 'k) A anotação nos registros da descrição do trabalho executado contém o resultado das
  medições realizadas (por exemplo, dimensões de um dano na hélice, quantidade de combustível
  vazando)?

  5.5.11.14 Inspeção final: esta inspeção é executada em cada artigo antes de sua aprovação
  para retorno ao serviço, via aprovação para retorno ao serviço ou pelo Certificado de Liberação
  Autorizada - Formulário ANAC F-100-01. A inspeção final deve incluir uma análise dos documentos
  usados durante a manutenção (fichas de acompanhamento, folhas de inspeção, folhas de discrepâncias,
  etc.), bem como uma inspeção do artigo. A OM pode elaborar uma lista de verificação para
  assegurar que todas as atividades relacionadas à inspeção final foram executadas. A pessoa
  efetuando essa inspeção deve atender aos requisitos da seção 145.155 do RBAC nº 145, que
  requer que a pessoa esteja inteiramente familiarizada com os regulamentos aplicáveis e os
  métodos, técnicas, práticas, auxílios, equipamentos e ferramentais usados para determinar
  a aeronavegabilidade de um artigo. A pessoa deve ser proficiente em utilizar os vários tipos
  de equipamentos de inspeção e apropriados auxílios de inspeção visual para o artigo sendo
  inspecionado. A pessoa deve ser capaz de entender, ler e escrever a língua portuguesa e
  capaz de entender o idioma no qual os dados técnicos são produzidos. Conforme estabelecido
  na seção 145.213 do RBAC nº 145, exceto para pessoas empregadas em OM localizada fora do
  Brasil, somente uma pessoa detentora de licença de acordo com o RBAC nº 65 e habilitada,
  conforme aplicável, será autorizada pela OM a assinar inspeções finais e aprovação para
  retorno ao serviço - o que inclui assinar o formulário ANAC F-100-01 - em nome da OM. Os
  procedimentos em manual para realização da inspeção final devem conter:'
