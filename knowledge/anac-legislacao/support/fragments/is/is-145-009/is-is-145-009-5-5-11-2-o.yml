text: 'o) Se a manutenção executada foi um grande reparo/alteração, foram incluídos procedimentos
  para assegurar que o inspetor que inspecionou o artigo e o aprovou para retorno ao serviço
  está treinado, qualificado, autorizado e conduziu o trabalho conforme dados técnicos aprovados
  e aplicáveis?

  5.5.11.15 Utilização de carimbos: em muitas OM são utilizados carimbos em vez de assinaturas
  de próprio punho, para anotar a conclusão de um trabalho na ficha de trabalho, ordem de
  serviço, folha de processo, folha de inspeção, ou documento similar. A intenção do carimbo,
  assinatura, ou outras formas, é de assegurar rastreabilidade ao nome das pessoas que executaram
  e inspecionaram o trabalho. Se a OM optar por usar carimbos, ela deve ter um programa de
  controle cobrindo o seguinte:'
