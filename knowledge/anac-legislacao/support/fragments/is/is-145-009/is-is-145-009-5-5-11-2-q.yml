text: 'q) Existe um procedimento para reportar falhas, mau funcionamento ou defeitos de um
  artigo?

  5.5.11.12 Inspeções de danos ocultos: esta inspeção é requerida em peças provenientes de
  aeronaves que se envolveram em acidente ou em ocorrências que possam ter afetado a sua aeronavegabilidade
  (exemplo: incidentes, queda de hangar, enchente, colisões de aeronaves, pouso duro, etc.).
  A inspeção inclui uma pesquisa por avarias secundárias que poderia resultar de um acidente/ocorrência,
  tal como avaria por fogo, por calor, abrasão, corrosão, ataque químico, etc. Esta inspeção
  é frequentemente registrada no mesmo formulário usado para inspeção preliminar. Algumas
  vezes a OM não é notificada que um artigo esteve envolvido em um acidente ou em ocorrência.
  O pessoal da inspeção deve ser experiente o suficiente para reconhecer um artigo proveniente
  de acidente/ocorrência. A OM pode trocar informações com o cliente relativo ao histórico
  de avarias daquele artigo. O procedimento de inspeção de danos ocultos deve cobrir no mínimo
  o seguinte:'
