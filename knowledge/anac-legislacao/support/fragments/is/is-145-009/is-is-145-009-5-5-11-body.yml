text: '5.5.11 e subitens

  Antigo 5.5.10. Item 5.5.11.2 c) foi revisado incluindo menção a outras ocorrências que possam
  afetar a aeronavegabilidade. Item 5.5.11.5 (antigo 5.5.10.5) foi revisado para alinhamento
  com a Resolução nº 714/2023. Item 5.5.11.10 (antigo 5.5.10.10) foi revisado para mencionar
  exemplo de quebra de lote e sob o item k) foi incluída a Nota 1 com o exemplo referenciado.
  O item 5.5.11.11 (antigo 5.5.10.11) foi revisado. O item 5.5.11.12 foi revisado para mencionar
  ocorrências que possam afetar a aeronavegabilidade e foi incluída a pergunta b), com re-identificação
  das perguntas subsequentes. O item 5.5.11.14 foi revisado na pergunta o) com inserção de
  instrução de que serviço tenha sido conduzido conforme dados técnicos aprovados e aplicáveis.
  O item 5.5.11.16 a) foi revisado para ajustar a redação ao previsto no parágrafo 43.9(d)-I
  do RBAC nº 43.'
