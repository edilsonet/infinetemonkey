section_title: Sistema de Arquivamento de Registro Eletrônico.
subsection_id: a
cite: 5.5.12.10(a)
title: 5.5.12.10(a)
text: a) Na construção de um sistema de arquivamento eletrônico de registros de manutenção,
  vários elementos devem ser considerados e cobertos no MOM ou instruções para utilização
  do sistema eletrônico. Essas instruções devem estar disponíveis para cada pessoa que utiliza
  o sistema. O sistema eletrônico deve assegurar que a informação é controlada e não pode
  ser alterada sem autorização.
