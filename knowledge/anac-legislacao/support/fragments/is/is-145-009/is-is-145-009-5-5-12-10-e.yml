cite: 5.5.12.10(e)
title: 5.5.12.10(e)
text: 'e) Quem, (por título) é responsável por manter o sistema de arquivamento de registros?

  I- Quais documentos são incluídos em um pacote de serviços típico? Quais documentos adicionais
  podem ser incluídos?

  II- Onde ficam arquivados os registros?

  III- Qual método é usado para organizar os registros?

  IV- Os registros são facilmente recuperáveis?

  V- Como se dá a recuperação de arquivos perdidos ou danificados?

  VI- Quem, (por título), revisa os registros quanto à exatidão e integridade antes de aprovar
  para retorno ao serviço? Essa pessoa é treinada?

  VII- Se a OM utiliza o formulário ANAC F-100-01, ela inclui uma cópia preenchida nos “pacotes”
  de registros?

  VIII- Caso sejam utilizados registros eletrônicos, devem ser estabelecidos procedimentos
  de segurança, cópia de segurança e recuperação de arquivos.

  IX- Os registros são feitos em português, e eles atendem (no mínimo) aos requisitos da seção
  43.9 do RBAC nº 43? Quais registros serão entregues ao proprietário/operador?

  X- Como a OM processa os registros recebidos das pessoas subcontratadas?

  XI- Existem procedimentos no manual para distribuição e arquivamento do formulário ANAC
  F-400-04? e

  XII- Como a OM documenta quaisquer inspeções especiais, tais como testes hidrostáticos,
  testes funcionais, END, etc.?'
