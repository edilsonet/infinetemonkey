section_title: Registros de calibração periódica
subsection_id: b
cite: 5.5.13.13(b)
title: 5.5.13.13(b)
text: b) Os resultados da calibração devem incluir a leitura real da medida nos pontos do
  teste. Se a organização pretende revisar o intervalo entre calibrações periódicas, a anotação
  de aprovado ou rejeitado não será suficiente. O intervalo entre calibrações não pode ser
  aumentado sem dados de pontos registrados (histórico de calibração), para justificar a alteração.
  Os procedimentos devem declarar o título da pessoa responsável em manter os registros e
  onde os registros ficarão arquivados.
