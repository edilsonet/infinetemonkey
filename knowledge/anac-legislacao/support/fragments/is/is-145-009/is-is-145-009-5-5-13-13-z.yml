text: 'z) Se a OM inclui um banco de prova de motor ou APU (Auxiliary Power Unit), o manual
  inclui procedimentos para correlação, calibração e limitações, se aplicável?

  aa) Para organizações que efetuam END, o manual inclui procedimentos para certificação de
  blocos de referência de END de fabricação própria (se algum é usado)? e

  bb) Os procedimentos tratam da aceitação no inventário de novos “blocos de referência” de
  END?'
