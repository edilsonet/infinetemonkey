text: '5.5.13 e subitens

  Antigo 5.5.12. Item 5.5.13.1 (antigo 5.5.12.1) foi revisado com atualização das referências.
  O item 5.5.13.2 (antigo 5.5.12.2) recebeu revisão editorial. O item 5.5.13.4 (antigo 5.5.12.4)
  foi revisado quanto ao nome do INMETRO. O item 5.5.13.5 (antigo 5.5.12.5) foi revisado estabelecendo
  diretrizes sobre os intervalos de calibração para ferramentas propostos pela OM. A Nota
  3 foi transformada no item 5.5.13.6 com instruções revisadas estabelecendo a ISO 17025 como
  a referência para as OM que calibram instrumentos. Os itens subsequentes foram renumerados.
  Item 5.5.13.10 e 5.5.13.12 foram revisados com alterações editorais. Perguntas do item 5.5.13.15
  (antigo 5.5.12.14) foram atualizadas nos itens t), v) e w).'
