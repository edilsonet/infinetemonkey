text: 'a) O procedimento que deveria ser utilizado está no MOM, mas:

  I- O procedimento está descrito, mas não é seguido pois está defasado da realidade da OM
  e o MOM não foi atualizado; ou

  II- O procedimento está descrito, mas não é seguido por outras razões.'
