text: 'b) O procedimento que deveria ser utilizado não está no MOM, por ser novo e o MOM não
  foi atualizado.

  5.5.14.3 Classificação das não conformidades. A ANAC recomenda à OM estabelecer um critério
  de classificação para as não conformidades identificadas em auditorias internas. A ANAC,
  por exemplo, classifica as não conformidades em críticas e não críticas.

  5.5.14.4 Ações decorrentes das não conformidades. No caso de auditorias internas, a ANAC
  recomenda que a OM elabore um plano de ação corretiva (PAC) entre o setor auditado e o auditor,
  levando em consideração a classificação da não conformidade. Para auditorias da ANAC, após
  tomar ciência das não conformidades através de documento enviado pela ANAC, a OM deverá
  definir um Plano de Ação Corretiva (PAC), que deverá ser apresentado à ANAC dentro do prazo
  estabelecido no documento de comunicação das não conformidades.

  5.5.14.5 Conteúdo do plano de ações corretivas: o parágrafo 145.211(c)(1)(ix) do RBAC nº
  145 estabelece que o MCQ deve incluir procedimentos para a tomada de ação corretiva de deficiências
  (não conformidades). A ação corretiva é tomada para corrigir uma situação indesejável. A
  correção de deficiência é normalmente uma parte integral da melhoria do processo de uma
  OM e pode incluir revisões aos procedimentos, que não estão produzindo os resultados adequados.
  A ANAC recomenda que o PAC da OM possua ações semelhantes àquelas que seriam submetidas
  à ANAC, e neste sentido, deverá:'
