text: '5.5.14 e subitens

  Antigo 5.5.13. Item 5.5.14.4 (antigo 5.5.13.4) foi alterado para constar que a OM deverá
  apresentar um plano de ações corretivas à ANAC dentro do prazo estabelecido pela Agência
  no documento de comunicação das não conformidades. Item 5.5.14.7 foi revisado para constar
  que fatores humanos, assim como fatores físicos, devem ser considerados e incluída a Nota
  1 ao item b).'
