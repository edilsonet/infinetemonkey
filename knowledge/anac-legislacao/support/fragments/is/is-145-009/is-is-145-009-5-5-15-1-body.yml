title: 'Referência: RBAC nº 145, seção 145.221-I.'
text: '5.5.15.1 Referência: RBAC nº 145, seção 145.221-I.

  5.5.15.2 Procedimentos: A seção 145.221-I do RBAC nº 145 estabelece que, a menos que de
  outra forma especificado pela ANAC, cada organização de manutenção certificada deve encaminhar
  até o último dia útil do mês subsequente um relatório mensal contendo os serviços de manutenção
  executados naquele mês ou informando, se for o caso, a não execução de quaisquer serviços
  e um relatório trimestral contendo a relação do pessoal técnico vinculado à organização
  de manutenção e, se aplicável, as alterações ocorridas no trimestre anterior.

  5.5.15.3 Conteúdo do relatório mensal: o número da ordem de serviço, descrição resumida
  do serviço, identificação da aeronave ou artigo trabalhado, data de início e fim do serviço.
  Caso aplicável, também uma indicação se o serviço foi feito em sede ou fora de sede, indicando
  o local fora da sede.

  5.5.15.4 Conteúdo do relatório trimestral: o nome, cargo ou função, CANAC (se aplicável),
  data de admissão e data de demissão. Deve ser informado todo o pessoal envolvido com a manutenção
  ou atividades de suporte à manutenção (MMA, auxiliares, CTM, inspetores, supervisores, pessoas
  autorizadas a retorno ao serviço, responsável técnico, etc.).

  5.5.15.5 Forma de envio: Os relatórios devem ser enviados à ANAC por meio do Sistema de
  Gestão de Relatórios de Aeronavegabilidade Continuada - SIGRAC, ou sistema eletrônico que
  venha a substituí-lo.

  NOTA 1: Em situações excepcionais, a ANAC pode aceitar outras formas e frequências para
  o recebimento dos relatórios periódicos.'
