title: 5.5.2.1(a)
text: 'a) Operações: esta seção do MOM deve incluir uma descrição geral das operações da OM.
  O manual deve descrever como a OM opera, desde o recebimento do artigo para manutenção até
  o seu retorno ao serviço, via formulário ANAC F-100-01 ou por uma aprovação para retorno
  ao serviço. A descrição pode ser em formato narrativo, por fluxograma ou outro meio. Todo
  e qualquer procedimento operacional desenvolvido para a OM pode ser incluído, tais como
  análise de ordem de compra/contrato, recursos humanos, manutenção dos equipamentos e das
  facilidades, dados técnicos, controle de documentos e assim por diante.'
