title: 5.5.2.1(b)
text: 'b) Instalações e recursos: esta seção deve incluir uma descrição das instalações e
  recursos, além de uma planta baixa das instalações. A planta baixa deve incluir a(s) entrada(s),
  áreas de estacionamento e a localização na rua. A planta baixa e a descrição podem incluir
  o tipo de aquecimento/refrigeração (se existir), iluminação, localização dos equipamentos/ferramentas
  ou dispositivos, áreas das oficinas, sistema elétrico e tomadas de ar comprimido, sistemas
  de combate a incêndio. Na descrição devem ser incluídas instalações de pintura, oficinas
  de aviônica, etc., revisão/reparo de motor ou célula, END, ou qualquer outro trabalho que
  exija requisitos especiais.

  NOTA 1: Materiais inflamáveis - A regra geral de segurança é a de que todos os produtos
  inflamáveis sejam armazenados em locais afastados, e fora das dependências do hangar ou
  oficinas. Entretanto, deve ser observado com bom senso o volume desses produtos. É admissível
  que pequenas quantidades de óleo lubrificante, desengraxante, tinta, thinner, etc. sejam
  armazenados em locais apropriados dentro das dependências do hangar e/ou oficinas da OM,
  como armários de metal projetados especificamente para guardar uma variedade de materiais
  inflamáveis em pequenas quantidades. A ANAC sugere a leitura das normas: Norma Regulamentadora
  NR-20 - Segurança e Saúde no Trabalho com Inflamáveis e Combustíveis do Ministério do Trabalho
  e Emprego e Norma Brasileira NBR 17505:2006 - Armazenamento de Líquidos Inflamáveis e Combustíveis
  editada pela Associação Brasileira de Normas Técnicas - ABNT.'
