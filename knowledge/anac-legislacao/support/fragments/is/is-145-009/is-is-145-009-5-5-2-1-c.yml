title: 5.5.2.1(c)
text: 'c) Equipamentos, ferramentas e materiais: a OM deve possuir ou ter acesso aos equipamentos/ferramentas/materiais
  necessários para executar a manutenção conforme o RBAC nº 43. Os equipamentos/ferramentas/materiais
  devem estar localizados no local e sob o controle da OM quando o trabalho estiver sendo
  executado. Se a OM não possui os equipamentos/ferramentas/materiais ou esses não são mantidos
  nas instalações da OM, o MOM deve descrever como os equipamentos/ferramentas/materiais são
  obtidos (i.e., arrendado, alugado, etc.). O MOM deve também descrever o procedimento para
  assegurar que os equipamentos/ferramentas/materiais estejam no local, e sob o controle da
  OM, na ocasião em que o trabalho estiver sendo executado.

  NOTA 1: Calibração periódica - vide parágrafo 5.5.13 desta IS.'
