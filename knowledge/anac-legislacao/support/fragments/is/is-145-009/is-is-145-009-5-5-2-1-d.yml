title: 5.5.2.1(d)
text: 'd) Equipamentos/ferramentas/materiais equivalentes: a regra geral é que os equipamentos,
  ferramentas e materiais sejam aqueles recomendados pelo fabricante do artigo. No entanto,
  é aceitável pela ANAC que os equipamentos, ferramentas e materiais demonstrados como equivalentes
  àqueles recomendados pelo fabricante sejam utilizados (Ver IS nº 43.13-005 sobre a metodologia
  aceitável para a demonstração de equivalência entre ferramentas).'
