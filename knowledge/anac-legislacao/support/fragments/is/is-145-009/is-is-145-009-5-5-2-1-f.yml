title: 5.5.2.1(f)
text: 'f) A ANAC estabelece como um modelo aceitável de listagem de ferramentas o formulário
  F-143-41, disponível na página de formulários padronizados da Agência (https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-manutencao/formularios-padronizados).

  NOTA 1: A OM pode optar por utilizar uma listagem distinta do modelo estabelecido pela ANAC
  contanto que seja capaz de prover, no mínimo, as mesmas informações sem que seja necessário
  extensa consulta a documentos externos à listagem.

  NOTA 2: A organização poderá apresentar um sistema computadorizado que cumpra com o mesmo
  objetivo da listagem descrita nesta seção.'
