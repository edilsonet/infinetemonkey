title: 5.5.2.1(g)
text: 'g) As seguintes questões ou aspectos são sugeridos, com a finalidade de auxiliar a
  OM a iniciar a criação do procedimento para descrição das instalações, facilidades e equipamentos
  no MOM. Elas não devem ser consideradas como tendo abrangido todos os aspectos necessários.
  Cada OM é única, e por isso pode requerer procedimentos adicionais para validar os requisitos
  regulatórios e as necessidades da OM:

  I- O MOM inclui uma descrição de como a OM opera?

  II- O MOM inclui uma planta das instalações, identificando as várias facilidades de trabalho
  dentro do(s) edifício(s) e faz uma descrição da construção das instalações e facilidades?

  III- A descrição e/ou o layout identifica áreas com requisitos especiais?

  IV- A descrição inclui uma visão geral dos equipamentos?

  V- Quando arrendar ou alugar equipamentos/ferramentas ou dispositivos, o MOM contém procedimentos
  que descrevem o processo de arrendamento/aluguel, incluindo quem é o responsável pelo procedimento,
  os requisitos de inspeção de recebimento, calibração e outras verificações, e respectivos
  registros?

  VI- Como a OM assegura que o equipamento está no local e sob o controle da organização quando
  o serviço é executado?

  VII- Se a OM está utilizando ferramentas/equipamentos ou dispositivos diferentes daqueles
  recomendados pelo fabricante, próprios ou obtidos de terceiros, o manual inclui procedimentos
  para determinar a equivalência e garantir que o pessoal técnico está apto a utilizá-los?

  VIII- O MOM inclui uma descrição do almoxarifado, como o material é requisitado para determinados
  serviços, e como a vida em prateleira é controlada?'
