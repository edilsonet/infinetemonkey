text: '5.5.3.1 Referências: RBAC nº 145, parágrafo 145.209(d) e seção 145.215-I.

  5.5.3.2 Introdução: uma OM certificada pode executar manutenção, manutenção preventiva ou
  alteração em um artigo, se esse artigo estiver contido nas Especificações Operativas ou
  em uma Lista de Capacidade da OM. As Especificações Operativas são um documento emitido
  pela ANAC enquanto a Lista de Capacidade é um documento emitido pela OM, devendo ser mantida
  atualizada pela organização. Cada artigo somente pode estar contido nas Especificações Operativas
  ou na Lista de Capacidade se precedido de aprovação da ANAC, exceto se a OM possuir autorização
  para realizar autoinclusão.'
