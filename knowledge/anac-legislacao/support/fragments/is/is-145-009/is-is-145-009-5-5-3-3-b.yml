title: 5.5.3.3(b)
text: b) uma organização de manutenção poderá autoincluir artigos relativos a categorias e
  classes constantes em seu COM (com exceção de Serviços Especializados). Os procedimentos
  devem prever que, caso pretenda incluir uma nova categoria ou classe, a organização deve
  necessariamente encaminhar um processo de solicitação de emenda de certificado para análise
  e aprovação prévia da ANAC;
