text: '5.5.3.3 Autoinclusão

  5.5.3.3-I Uma OM que cumpra com os critérios previstos na IS nº 145-001 pode ser autorizada
  pela ANAC a realizar uma inclusão “automática” em sua capacidade, procedimento referenciado
  como autoinclusão. Uma vez autorizada pela ANAC, após executar uma autoavaliação bem-sucedida,
  a OM pode propor a revisão das suas Especificações Operativas ou emendar sua Lista de Capacidade
  para introduzir a manutenção em um artigo, enviar à ANAC a documentação prevista em seus
  procedimentos e iniciar o serviço sem a anuência prévia da Agência. Caso a OM não possua
  uma autorização para autoinclusão, uma adição em sua capacidade somente poderá ser executada
  após a aprovação pela ANAC.

  5.5.3.3-II Procedimentos no manual: Os procedimentos no MOM devem direcionar a empresa a
  manter um alto grau de controle sobre os seus processos, fornecendo os mecanismos para uma
  verificação periódica quanto ao cumprimento dos critérios previstos na IS nº 145-001, que
  são a base para a concessão da prerrogativa de autoinclusão. Os procedimentos devem orientar
  a empresa quanto às prerrogativas e limitações aplicáveis à autoinclusão. O desenvolvimento
  dos procedimentos no manual deve considerar os seguintes aspectos:'
