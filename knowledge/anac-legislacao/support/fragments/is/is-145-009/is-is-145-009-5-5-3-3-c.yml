text: 'c) Conhecimento dos requisitos de manutenção do modelo do artigo a ser adicionado à
  capacidade da OM.

  5.5.3.4-II Critérios de execução: para executar e registrar a autoavaliação, a pessoa deve
  seguir os procedimentos do MOM, podendo utilizar o formulário F-143-05, disponibilizado
  pela ANAC, ou formulário próprio da organização. A autoavaliação deve identificar claramente
  os artigos avaliados (modelo ou P/N), assim como as tarefas e possíveis limitações de serviços
  aplicáveis, e deve assegurar, com base em evidências, que a organização possui o seguinte:'
