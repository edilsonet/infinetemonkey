title: 5.5.3.3(e)
text: 'e) suficiente pessoal qualificado. A OM deve dispor da lista dos treinamentos requeridos
  e uma avaliação que comprove que ela possuiu pessoal com treinamento/experiência para executar
  as tarefas pretendidas;

  5.5.3.4-III Registrar e reportar os resultados: a pessoa efetuando a autoavaliação deve
  registrar os resultados, e reportá-los ao Responsável Técnico para a sua análise e aprovação,
  antes do envio à ANAC. Os procedimentos devem descrever o processo de aceitação pelas chefias/encarregados
  da OM e pela ANAC. Quaisquer deficiências encontradas durante a autoavaliação devem ser
  corrigidas antes de propor adicionar o artigo às Especificações Operativas ou à Lista de
  Capacidade. Quando a autoavaliação estabelece que um resultado é satisfatório, a OM poderá
  dar início à solicitação de adição ou alteração de sua capacidade. Sempre que houver a revisão
  da LC, conforme um procedimento de autoinclusão aceito nos manuais da empresa e aprovado
  em EO, a OM deve encaminhar à ANAC a última versão da LC antes do início dos serviços incluídos
  ou alterados. A OM deve manter os registros da autoavaliação arquivados por um período mínimo
  de 5 (cinco) anos.

  NOTA 1: Para o arquivamento dos registros de autoavaliação, podem ser utilizados os procedimentos
  já estabelecidos pela OM para a guarda dos demais registros produzidos na organização.

  5.5.3.4-IV Avaliação Periódica: A OM deve apresentar um procedimento em seu MOM para avaliar
  se a organização continua a ter as edificações, instalações, equipamentos, ferramentas,
  materiais, dados técnicos e pessoal qualificado que satisfazem a todos os requisitos necessários
  para a execução dos serviços listados em suas Especificações Operativas e Lista de Capacidade.
  O procedimento deve descrever como e quem efetuará a avaliação, a frequência, a forma de
  registro e qual o escopo da verificação (exemplo: a execução de autoavaliação quando do
  recebimento de artigos para os quais a OM esteja certificada, mas não tenha realizado serviços
  nos últimos 3 anos).

  5.5.3.5 Orientação para procedimentos no MOM: as seguintes questões ou aspectos são sugeridos
  como uma orientação com a finalidade de auxiliar a OM a iniciar a criação dos procedimentos
  no manual. Eles não devem ser considerados como tendo abrangido todos os aspectos necessários.
  Cada OM é única, e por isso pode requerer procedimentos adicionais para validar os requisitos
  regulatórios e as necessidades da organização:'
