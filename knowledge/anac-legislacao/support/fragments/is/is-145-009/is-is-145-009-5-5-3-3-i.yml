text: i) Foi definida uma frequência de avaliação periódica para verificar se a organização
  continua a ter a capacidade para realização de manutenção nos artigos presentes nas Especificações
  Operativas e na Lista de Capacidade? Caso constatada perda de capacidade, os procedimentos
  preveem forma de recuperação da capacidade ou comunicação à ANAC para remoção da capacidade
  perdida?
