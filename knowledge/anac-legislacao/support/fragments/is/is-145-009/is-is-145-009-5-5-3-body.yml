text: '5.5.3 e subitens

  Seção e subitens reestruturados como resultado da Ação 5.02 do Prog. Voo Simples. Na seção
  foi incluída “Especificações Operativas”. Revisado o conceito de autoinclusão, autoavaliação,
  qualificação dos executores de autoavaliação, critérios de execução, registro e reporte
  de resultados, avaliação periódica e perguntas que orientam os procedimentos do MOM.'
