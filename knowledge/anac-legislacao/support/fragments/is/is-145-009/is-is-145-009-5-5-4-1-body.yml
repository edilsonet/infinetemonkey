text: '5.5.4.1 Referências: RBAC nº 145, parágrafo 145.215-I(d), IS nº 145-001 Apêndice C
  e norma ABNT NBR ISO 19011.

  5.5.4.2 Sistema de monitoramento, informações gerais: a auditoria interna é um processo
  objetivo de verificações de amostragem de rotina que cobre todos os aspectos da capacidade
  da organização para realizar as manutenções de acordo com os padrões exigidos, de forma
  a garantir que os artigos sejam aprovados em condição aeronavegável. A auditoria interna
  deve garantir que todos os aspectos de conformidade com o RBAC nº 145 sejam verificados
  periodicamente, abrangendo os procedimentos estabelecidos pela organização e verificações
  de serviços em execução. A IS nº 145-001 fornece diretrizes gerais para o desenvolvimento
  de um sistema aceitável de monitoramento com auditorias internas independentes. A utilização
  de um sistema com auditorias internas pode auxiliar a OM na melhoria dos seus processos,
  provendo mecanismos para a correção de deficiências e para a melhoria contínua da organização.

  5.5.4.3 Estrutura do sistema: o sistema de monitoramento normalmente é estruturado como
  uma auditoria ou um conjunto de auditorias realizadas dentro do intervalo máximo estabelecido
  pela empresa. Recomenda-se que a estruturação do sistema observe as diretrizes apresentadas
  na norma ABNT NBR ISO 19011 (“Diretrizes para auditoria de sistemas de gestão”), com as
  adequações necessárias ao porte e à complexidade da OM.

  5.5.4.4 Escopo: os procedimentos do manual devem estabelecer que todos os requisitos do
  RBAC nº 145 aplicáveis sejam avaliados dentro do intervalo definido, o qual não deve exceder
  24 meses. Os procedimentos devem prever que toda a capacidade autorizada da OM seja auditada
  nesse intervalo, o que inclui auditoria em processos e produtos abrangendo a manutenção
  em artigos de todas as categorias e classes presentes no COM da OM.

  5.5.4.4-I Os procedimentos da empresa devem estabelecer que todas as suas bases sejam auditadas,
  o que inclui a base principal da OM e as bases secundárias, quando houver.

  5.5.4.4-II O manual deve estabelecer procedimentos para que as auditorias possam ser executadas
  com dois enfoques específicos: amostragem de processos e amostragem de produtos (artigos).
  A auditoria em processos deve abordar a avaliação de procedimentos que são transversais
  na OM e, portanto, comuns a várias linhas de produtos (exemplo: procedimentos de controle
  de calibração de ferramentas, inspeções de recebimento, estoque, ferramentaria, etc.). A
  auditoria de produtos aborda a observação direta de uma amostra de artigo em que o auditor
  testemunha as principais etapas do fluxo de trabalho que envolve a manutenção, desde a entrada
  até a aprovação para retorno ao serviço e envio do artigo ao seu destino final. A auditoria
  de produto pode envolver o testemunho de qualquer atividade de manutenção, testes e etapas
  de inspeção usadas durante o serviço de manutenção. O critério de escolha do procedimento
  ou dos produtos a serem auditados deve levar em consideração aqueles para os quais o SGSO
  da OM tenha identificado algum aspecto de maior risco e que requeira ações para a sua mitigação.
  Devem também ser considerados, para fins de definição da amostragem para a auditoria, produtos
  que tenham sido autoincluídos pela OM em sua EO ou LC, ou serviços fora de sede, sem prejuízo
  à amostragem dos demais artigos mantidos pela OM.

  5.5.4.5 Métodos de auditoria: o manual deve estabelecer os métodos de auditoria a serem
  utilizados pela OM, que poderão ser auditoria presencial, remota ou híbrida. Uma vez que
  as auditorias, em geral, envolvem o acompanhamento da execução de serviços de manutenção,
  o testemunho e visualização de testes, montagens e desmontagens, a abordagem presencial
  deve ser priorizada pela OM. Excepcionalmente, pode ser utilizado o método de auditoria
  remota ou uma abordagem híbrida (remota/presencial) em situações como auditoria de registros,
  quando a presença física dos auditores não for essencial para a verificação do processo
  avaliado ou quando os prejuízos com tal abordagem forem mínimos. O manual da empresa deve
  prever as limitações de cada um dos métodos disponíveis, de forma a instruir a OM na escolha
  da abordagem mais adequada ao cenário concreto de auditoria.

  5.5.4.6 Qualificação dos auditores: a OM pode utilizar pessoas de sua própria estrutura
  dedicadas total ou parcialmente às auditorias independentes, ou pode optar por contratar
  a auditoria independente em uma organização externa que possua corpo técnico com conhecimento
  apropriado e experiência satisfatória. O manual da OM deve prever os critérios de qualificação
  dos auditores que fazem parte do quadro da organização, ou, estabelecer os critérios de
  avaliação e qualificação da organização externa, quando ela for utilizada.

  5.5.4.7 Execução da auditoria: os procedimentos para a execução da auditoria devem ser apresentados
  no manual. Deve ser prevista execução de auditorias em artigos em manutenção e após a finalização
  dos serviços. Os procedimentos de execução devem estabelecer a observação direta da manutenção
  em um artigo, o que envolve acompanhar testes e inspecionar visualmente o artigo e a documentação
  associada. A execução da auditoria pressupõe a observação das principais etapas dos processos
  envolvidos na manutenção. Além disso, os procedimentos devem prever a auditoria de serviços
  realizados durante a noite, quando houver turno noturno, o acompanhamento de serviços fora
  de sede executados pela OM, e o acompanhamento de serviços subcontratados. Os procedimentos
  do manual devem estabelecer que, ao final da execução de uma auditoria, seja elaborado um
  relatório descrevendo o escopo de verificação e as constatações resultantes em relação aos
  requisitos, procedimentos e artigos auditados.

  5.5.4.8 Gestão dos resultados: o manual deve prever procedimentos para que os resultados
  sejam informados aos gestores apropriados (Gestor Responsável e Responsável Técnico), bem
  como qual posição na OM será responsável por essa comunicação. O informe de resultados aos
  gestores pode ser, no caso de OMs de maior porte e com grande número de auditorias, um sumário
  com um resumo das constatações e resultados. Os procedimentos devem estabelecer que a OM
  investigue as não conformidades quanto a causas e impactos em segurança operacional, bem
  como proponha um plano de ações corretivas, definindo os responsáveis (ou setores responsáveis)
  e os prazos para sua execução. Os procedimentos devem definir, ainda, a posição na OM ou
  a área responsável pelo acompanhamento das ações corretivas (follow-up) e pela atualização
  do seus status.

  5.5.4.9 Modelos de documentos utilizados: o manual deve conter modelos dos documentos utilizados
  para o planejamento, execução e acompanhamento das auditorias internas. Tais modelos podem
  incluir: cronograma, checklists para execução de atividades, plano de ações corretivas,
  etc., bem como orientações para o seu uso.

  5.5.4.10 Orientação para o sistema de monitoramento: as seguintes questões ou aspectos são
  sugeridos como uma orientação, com a finalidade de auxiliar a OM a iniciar a criação dos
  procedimentos para o sistema de monitoramento. Elas não devem ser consideradas como tendo
  abrangido todos os aspectos necessários. Cada OM é única, e por isso pode requerer procedimentos
  adicionais:'
