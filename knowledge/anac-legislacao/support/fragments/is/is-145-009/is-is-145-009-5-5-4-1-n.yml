title: 5.5.4.1(n)
text: 'n) Foram definidos procedimentos garantindo o arquivamento dos registros de auditoria
  por no mínimo 5 (cinco) anos contados a partir da data em que a auditoria foi considerada
  encerrada?

  NOTA 1: Para o arquivamento dos registros de auditoria, podem ser utilizados os procedimentos
  já estabelecidos pela OM para a guarda dos demais registros produzidos na organização.'
