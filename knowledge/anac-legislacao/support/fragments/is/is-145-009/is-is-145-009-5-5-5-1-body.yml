text: '5.5.5.1 Referências: RBAC nº 145, Seção 145.163 e Parágrafo 145.209(e).

  5.5.5.2 Programa de treinamento, informações gerais: a IS nº 145-010 (Programa de Treinamento
  de Organização de Manutenção) fornece informações para desenvolver o programa de treinamento
  para os empregados de uma OM, conforme requerido pela seção 145.163 do RBAC nº 145.'
