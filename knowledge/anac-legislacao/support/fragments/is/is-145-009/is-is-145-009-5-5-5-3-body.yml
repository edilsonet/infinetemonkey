text: '5.5.5.3 Procedimentos requeridos: o MOM pode incluir procedimentos para revisar o programa
  de treinamento e submeter aquelas revisões à aprovação da ANAC.

  NOTA 1: Uma OM localizada fora do Brasil pode submeter o programa de treinamento em língua
  inglesa.

  5.5.5.4 Responsabilidade pelas revisões: os procedimentos devem indicar quem será responsável
  por assegurar que as revisões serão submetidas à ANAC para análise e aprovação. Os procedimentos
  devem incluir instruções para aprovação pela OM antes da submissão à ANAC, bem como provisões
  para o posterior envio do programa à ANAC, incluindo as revisões.

  5.5.5.5 Frequência de análise: os procedimentos devem indicar a frequência com que o programa
  será revisado para verificar se ele está atualizado e adequado para o tipo de manutenção
  que está sendo executado. Como o progresso tecnológico pode causar rápida mudança nas técnicas
  de manutenção de aeronaves, é conveniente uma análise periódica das necessidades de treinamento.

  NOTA 1: A evolução do programa de manutenção das aeronaves também impacta a análise da OM
  com relação à revisão do programa de treinamento. As instruções de aeronavegabilidade continuada
  e demais documentos de serviço e dados técnicos (exemplo: Service Bulletins) gerados pelos
  detentores de projeto e muitas vezes tornados mandatórios por diretrizes de aeronavegabilidade
  frequentemente introduzem requisitos adicionais de treinamento em função de técnicas e/ou
  equipamentos específicos para cumprir com esses documentos.

  5.5.5.6 Orientação para o programa de treinamento: as seguintes questões ou aspectos são
  sugeridos como uma orientação, com a finalidade de auxiliar a organização a iniciar a criação
  dos procedimentos nos seus manuais. Elas não devem ser consideradas como tendo abrangido
  todos os aspectos necessários, e são complementadas pelas instruções contidas na IS nº 145-010.
  Cada OM é única, e por isso pode requerer procedimentos adicionais para validar os requisitos
  regulatórios e as necessidades da organização:'
