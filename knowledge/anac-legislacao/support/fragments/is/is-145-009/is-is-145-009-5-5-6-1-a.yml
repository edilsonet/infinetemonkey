cite: 5.5.6.1(a)
title: 5.5.6.1(a)
text: 'a) Descrever as preparações e condições a atender antes de executar qualquer trabalho
  fora da base certificada da organização, incluindo o título da pessoa responsável por e
  o método usado para executar e registrar a avaliação dos recursos que deverão ser disponibilizados
  para cada serviço a ser executado em outra localidade. Os registros devem incluir informações
  sobre a identificação do cliente, as tarefas de manutenção que serão executadas, o local
  onde o trabalho será executado, os dados técnicos a serem disponibilizados, o tipo de material,
  equipamentos/ferramentas e o pessoal que será necessário para executar o trabalho;

  NOTA 1: A OM pode referenciar ou adaptar para o contexto desta seção os procedimentos e
  formulários de autoavaliação requeridos pelo RBAC nº 145 para revisar as Especificações
  Operativas e a Lista de Capacidade, descritos na seção 5.5.3.4 desta IS.'
