title: 5.5.6.1(b)
text: b) O título da pessoa responsável por e o meio pelo qual os dados técnicos, o material,
  equipamentos/ferramentas e pessoal serão transportados, e os cuidados que serão tomados
  para assegurar que os dados técnicos, o material e equipamentos/ferramentas são adequados
  para o trabalho. Se materiais, ferramentas e equipamentos devem ser transportados, como
  a sua calibração será assegurada?
