title: 'Referência: RBAC nº 145, parágrafo 145.209(f).'
text: '5.5.6.1 Referência: RBAC nº 145, parágrafo 145.209(f).

  5.5.6.2 Circunstâncias para a concessão: o trabalho executado em outra localidade é uma
  concessão. Ela permite que uma OM execute trabalho em outra localidade, diferente daquela
  que foi certificada (também chamada de sede ou base principal) nas seguintes condições:
  devido a uma circunstância especial (um serviço de oportunidade e temporário e em certas
  emergências), e o recorrente (quando é necessário executar repetidamente tal trabalho em
  outras localidades, durante certos intervalos de tempo).

  NOTA 1: A ANAC esclarece que o trabalho “em outra localidade” significa ser executado em
  local fora e distante, tal como o trabalho executado em outro aeroporto, cidade, estado
  ou país. O trabalho exercido próximo, ou em local externo às instalações da OM (tal como
  nas cercanias do mesmo aeroporto ou no lado externo das do hangar ou oficina) não se enquadra
  na definição de “em outra localidade”, não se enquadrando no que prevê a seção 145.203 do
  RBAC nº 145. Portanto, a OM não necessita requerer concessão para essas situações.

  NOTA 2: A manutenção proporcionada por OM em bases secundárias não se enquadra na definição
  de “manutenção fora de sua localidade”. As bases secundárias possuem certificação da ANAC
  e são consideradas uma extensão da base principal.

  NOTA 3: Exceto se de outra forma estabelecido pela ANAC, para as OM que possuam em seus
  manuais procedimentos de acordo com esta seção, a autorização prévia da ANAC para a execução
  de serviços em outra localidade é dispensada no caso de trabalho devido a uma circunstância
  especial. Nesse caso, a execução do serviço em outra localidade deve ser informada à ANAC
  no relatório mensal de serviços previsto na seção 145.221-I(a) do RBAC nº 145.

  NOTA 4: A ANAC poderá, a qualquer tempo, suspender as prerrogativas relativas à execução
  de serviços em outra localidade quando houver evidências de que a OM é incapaz de garantir
  em outra localidade o nível de segurança da manutenção para o qual foi certificada.

  NOTA 5: Nas circunstâncias em que a ANAC constatar que a OM atestou como de sua responsabilidade
  serviços executados em outra localidade por terceiros não abrangidos pelo seu sistema de
  controle de qualidade, com o objetivo de dar suposta legitimidade a serviço executado por
  pessoa não certificada, a Agência poderá suspender ou cancelar a autorização da organização
  para o trabalho em outra localidade, sem prejuízo às demais sanções administrativas previstas
  no Código Brasileiro de Aeronáutica (CBAer), Lei nº 7.565, de 19 de dezembro de 1986, e
  na Resolução nº 472, de 6 de junho de 2018 ou norma que vier a substituí-la.

  5.5.6.3 Trabalho devido a uma circunstância especial: o parágrafo 145.203(a) do RBAC nº
  145 permite o trabalho temporário fora do local certificado da OM devido a uma circunstância
  especial (ou extraordinária), conforme determinado pela ANAC. Cada circunstância especial
  é um evento executado em outra localidade. Um exemplo seria ser uma OM contratada por um
  operador para atender uma aeronave no solo em condição AOG (Aircraft on Ground). Outro exemplo,
  uma OM ser contratada por um operador para atender uma aeronave que tenha pousado em um
  aeroporto onde não há OM disponíveis para a manutenção, ou para extensos trabalhos como
  recuperação de uma aeronave acidentada. Normalmente, o trabalho executado em outra localidade
  não inclui trabalho fora do país onde a OM está localizada. Entretanto, o trabalho executado
  fora do país em uma circunstância especial pode ser autorizado de acordo com o parágrafo
  145.203(a) do RBAC nº 145 e a OM deve obter aprovações requeridas pelo país onde o serviço
  será executado. Se o procedimento de serviço em outra localidade está previsto no MOM aceito
  pela ANAC, este deve conter procedimentos para notificar a ANAC quando essas circunstâncias
  especiais surgirem. Se o procedimento de serviço em outra localidade não está previsto no
  MOM aceito pela ANAC, a OM fica impedida de executar esse tipo de atividade.

  5.5.6.4 Serviços de longo prazo ou repetitivos. Uma autorização para execução dos serviços
  fora de sua localidade é concedida sempre considerando ser em caráter excepcional e temporário.
  Ainda assim, a ANAC pode conceder autorizações de até 6 meses, podendo ser prorrogada por
  mais 6 meses. A ANAC pode estabelecer condições específicas antes de autorizar a execução
  de serviços longos ou repetitivos incluindo, mas não limitadas à apresentação dos registros
  de uma autoavaliação realizada, demonstração de que os riscos relacionados à atividade são
  adequadamente gerenciados, limitação do número de localidades não certificadas atendidas
  simultaneamente pela OM, dentre outras.

  5.5.6.5 Trabalho Recorrente: o parágrafo 145.203(b) do RBAC nº 145 permite o trabalho fora
  do local de certificação da OM, em caráter recorrente (mas não em caráter contínuo e ininterrupto
  em uma mesma localidade). O trabalho recorrente não pode ser evidenciado como contínuo e
  ininterrupto, ou declarado recorrente pela OM para evitar os custos da certificação de uma
  base em outra localidade. Exemplos de trabalhos recorrentes: manutenção em tanque de combustível,
  instalação em aeronaves de assentos revisados após a reforma destes, OM que presta serviços
  de END para vários clientes, ou manutenção programada para operadores aeroagrícolas que
  realizam serviços durante a safra. Esses são apenas exemplos. Outras OM podem ter circunstâncias
  únicas que requerem a execução de manutenção fora da sua localidade original. É necessário
  que haja, no manual, um procedimento para “trabalho executado em outra localidade” se a
  OM executa ou pretende executar serviços de manutenção de modo recorrente.

  NOTA 1: A regra não permite operação “contínua e ininterrupta” em outra localidade, pois
  isso requer a certificação de uma base de manutenção da OM naquela localidade. A combinação
  de equipamentos/ferramentas/materiais, partes, etc. e pessoal da OM permanentemente posicionado
  em outra localidade, executando manutenção de forma diária, indica uma operação “contínua
  e ininterrupta”. Uma OM que opere dessa maneira, não atende a intenção da seção 145.203
  do RBAC nº 145. Se a OM deseja operar desta maneira, então ela deve requerer certificação
  como uma base secundária ou como uma OM independente.

