title: 5.5.6.1(k)
text: 'k) Foi definido o título da pessoa responsável por garantir que os serviços executados
  serão comunicados à ANAC de acordo com o disposto na seção 145.221-I do RBAC nº 145?

  5.5.6.7 Supervisão Remota por Mecânico de Manutenção Aeronáutica. Para os operadores aeroagrícolas
  certificados pelo RBAC nº 137, considerando que a operação realizada por eles é peculiar
  e geralmente realizada em localidades de difícil acesso, quando uma pessoa estiver trabalhando
  sob a supervisão de um mecânico de manutenção aeronáutica, como auxiliar do mecânico, e
  ambos estiverem vinculados a uma Organização de Manutenção Aeronáutica sob o RBAC nº 145
  ou a um Operador Aeroagrícola sob o RBAC nº 137, conforme RBAC nº 43, parágrafo 43.3(d),
  essa supervisão pode ser realizada remotamente, desde que utilizadas tecnologias de comunicação
  remotas que permitam observar se a execução do trabalho foi realizada apropriadamente, e
  que o supervisor esteja prontamente disponível para responder a consultas do executante,
  durante o período de execução das atividades que devem ser supervisionadas.

  NOTA 1: Nesta situação, a aprovação para retorno ao serviço será autorizada e deve seguir
  o requerido pelo RBAC 43.5, e realizado por pessoa autorizada conforme RBAC 43.7.'
