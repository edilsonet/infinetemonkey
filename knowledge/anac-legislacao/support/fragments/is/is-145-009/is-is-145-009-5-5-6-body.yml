text: '5.5.6 e subitens

  Antigo 5.5.5, foram revisadas as Notas 1 e 2 do item 5.5.6.2 (antigo 5.5.5.2), e inseridas
  as Notas 3, 4 e 5. Item 5.5.6.3 (antigo 5.5.5.3) foi revisado, e itens de a) a e) foram
  excluídos. Item 5.5.6.4 (antigo 5.5.5.4) foi revisado com inclusão de instruções sobre estabelecimento
  de condições específicas como autoavaliação, gerenciamento de risco, limitação de número
  de localidades, dentre outras. No item 5.5.6.6 (antigo 5.5.5.5) as perguntas que orientam
  o desenvolvimento dos procedimentos foram revisadas e concentradas sob um único item.'
