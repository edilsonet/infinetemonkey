cite: 5.5.7.1(a)
title: 5.5.7.1(a)
text: a) Os inspetores da OM executando inspeção em item IIO para um operador devem ser qualificados
  e autorizados pelo operador. Essa autorização é usualmente em formato escrito, frequentemente
  um cartão/crachá específico, de posse do inspetor. A autorização pode precisar ser renovada,
  dependendo dos procedimentos do operador. Os procedimentos no MOM devem incluir quem mantém
  uma lista dos inspetores IIO atualizada, como um inspetor é adicionado à lista, e onde a
  lista fica arquivada.
