text: '5.5.7 e subitens

  Antigo 5.5.6, foi revisado no item 5.5.7.2 (antigo 5.5.6.2), com inclusão de informações
  sobre o PMAC e a IS nº 120-016, e simplificação do texto. A Nota 1 do item 5.5.7.3 foi excluída.
  O item III do item 5.5.7.4 b) foi excluído. A Nota 1 do item 5.5.7.4 b) IV foi revisada.
  O antigo item 5.5.6.5 sobre autorização para execução de manutenção de linha foi excluído.
  O item 5.5.7.5 (antigo 5.5.6.6) foi simplificado, com adequações de termos e remoção de
  referências a manutenção de linha. As perguntas do item 5.5.7.6 (antigo 5.5.6.7) foram atualizadas.'
