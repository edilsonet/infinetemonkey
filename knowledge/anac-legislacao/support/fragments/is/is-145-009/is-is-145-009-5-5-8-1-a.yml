title: 5.5.8.1(a)
text: 'a) Elaborar uma lista das funções de manutenção para as quais:

  I- está certificada para executar, e opta por subcontratar; e

  II- assume responsabilidade regulatória em emitir uma aprovação para retorno ao serviço
  pelo trabalho subcontratado sob sua certificação (aprovação para retorno ao serviço ou o
  Formulário ANAC F-100-01, conforme aplicável).'
