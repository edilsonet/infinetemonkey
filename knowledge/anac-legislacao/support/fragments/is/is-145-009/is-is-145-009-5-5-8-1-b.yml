title: 5.5.8.1(b)
text: 'b) Funções de manutenção para as quais ela tem as edificações, instalações, facilidades,
  materiais, equipamento/ferramentas e dispositivos próprios, mas pode precisar contratar
  de outra OM, devido a carga de trabalho ou situações de emergência. Por exemplo, uma OM
  certificada na categoria Célula pode ter a capacidade de executar manutenção ou alterações
  em trem de pouso, mas se estiver incapacitada de executar o serviço dentro do tempo especificado,
  ela pode desejar subcontratar o trabalho de outra OM certificada.

  NOTA 1: A OM somente pode subcontratar serviços que estão no escopo do seu certificado.'
