title: 5.5.8.1(c)
text: 'c) Assegurar que ela qualifica as pessoas não certificadas pela ANAC às quais ela subcontrata
  funções de manutenção, de acordo com o parágrafo 145.201(a)(2) do RBAC nº 145 (sistema da
  qualidade).

  NOTA 1: A OM pode se basear nos procedimentos descritos nesta IS relativos a auditorias
  internas independentes para qualificar pessoas não certificadas pela ANAC.'
