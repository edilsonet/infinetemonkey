text: 'g) Procedimentos para cumprir os requisitos de inspeção e/ou teste requeridos pela
  seção 145.217, quando subcontratar uma pessoa não certificada.

  5.5.8.6 Subcontratar OM certificada pela ANAC: Se a OM subcontratada optar por exercer as
  prerrogativas de seu certificado emitindo uma aprovação para retorno ao serviço de uma função
  de manutenção, a OM (contratante) deve assegurar-se que a OM (subcontratada) está devidamente
  certificada para executar a manutenção subcontratada. Uma OM pode emitir uma aprovação para
  retorno ao serviço “adicional” quanto ao serviço executado de acordo com suas prerrogativas,
  como por exemplo, etiquetando um artigo previamente mantido ou inspecionado por uma subcontratada,
