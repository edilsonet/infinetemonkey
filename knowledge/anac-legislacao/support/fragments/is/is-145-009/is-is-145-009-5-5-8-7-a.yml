section_title: Subcontratar funções de manutenção com pessoas não certificadas.
subsection_id: a
cite: 5.5.8.7(a)
title: 5.5.8.7(a)
text: 'a) Se a OM subcontrata serviços de pessoas não certificadas, a OM deve assegurar que:

  I- a pessoa não certificada segue um sistema de qualidade equivalente ao da OM, conforme
  requerido pela seção 145.217 do RBAC nº 145;

  II- a OM permanece diretamente responsável pelo trabalho executado;

  III- a OM verifica por inspeção ou teste, se o trabalho foi executado satisfatoriamente;
  e

  IV- o artigo está aeronavegável com respeito ao trabalho executado por pessoa não certificada,
  e isso é garantido pela OM.'
