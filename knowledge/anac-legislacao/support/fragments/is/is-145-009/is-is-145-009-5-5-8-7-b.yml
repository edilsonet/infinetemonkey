text: 'b) A OM deve verificar, por teste ou inspeção, que o trabalho foi executado satisfatoriamente,
  e que o artigo está aeronavegável antes de aprová-lo para retorno ao serviço.

  5.5.8.8 Procedimentos: os procedimentos no MOM devem incluir o título da pessoa responsável
  pela contratação de manutenção subcontratada. Os procedimentos devem também incluir provisões
  por manter essas informações em um formato aceitável à ANAC que identifique:'
