cite: 5.5.8.7(c)
title: 5.5.8.7(c)
text: 'c) O tipo de certificado e categorias, se existente, detida por cada fonte.

  5.5.8.9 Qualificação inicial: os procedimentos no MOM devem descrever como uma pessoa não
  certificada é inicialmente qualificada. Ele deve também descrever como a OM assegura que
  a pessoa não certificada continua a seguir um sistema de qualidade equivalente ao da OM
  para o trabalho que está sendo executado, em nome da OM.

  5.5.8.10 Coordenação de Comunicações: devem ser estabelecidos procedimentos para coordenação
  do intercâmbio de informações entre a OM e a subcontratada. Se a OM executar qualquer manutenção
  para um operador, os procedimentos do MOM devem explicar quaisquer requisitos especiais
  (tal como executar o trabalho de acordo com o programa de manutenção do transportador aéreo).
  Os procedimentos devem descrever como a OM trata quaisquer problemas de qualidade ou de
  liberação. Quaisquer problemas recorrentes devem ser tratados em um programa de ação corretiva.

  5.5.8.11 Fiscalização pela ANAC: os contratos de manutenção com pessoas não certificadas
  devem incluir provisões que permitam à ANAC observar o serviço no artigo trabalhado pela
  pessoa não certificada. O MOM deve incluir procedimentos para assegurar que os contratos
  contenham provisões para fiscalização pela ANAC. A pessoa encarregada do programa de manutenção
  contratada, ou o assistente/auditor delegado, pode ser requisitado para acompanhar a ANAC
  durante o processo. Essas inspeções irão determinar se a OM é capaz de continuar subcontratando
  a função de manutenção de uma pessoa não certificada.

  5.5.8.12 Procedimentos Iniciais: as seguintes questões ou aspectos são sugeridos como uma
  orientação, com a finalidade de auxiliar a OM a iniciar a criação dos procedimentos no MOM.
  Elas não devem ser consideradas como tendo abrangido todos os aspectos necessários. Cada
  OM é única, e por isso, pode requerer procedimentos adicionais para validar os requisitos
  regulatórios e as necessidades da OM:'
