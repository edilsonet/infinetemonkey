text: '5.5.8 e subitens

  Antigo 5.5.7. Item 5.5.8.2 (antigo 5.5.7.2), bem como subitens a) a f) foram revisados,
  e inseridas as Notas 1 do item c) e Notas 2 e 3 do item f). Item 5.5.8.3 (antigo 5.5.7.3)
  foi revisado para instruir que as informações de manutenção subcontratadas devem estar em
  formato recomendado pela ANAC. Algumas perguntas do item 5.5.8.5 (antigo 5.5.7.5) foram
  revisadas. Itens 5.5.8.6 e 5.5.8.7 (antigos 5.5.7.6 e 5.5.7.7) foram revisados. Item 5.5.8.8
  foi revisado removendo a informação de que cópias dos contratos estejam no manual. As perguntas
  d) e h) do item 5.5.8.12 (antigo 5.5.7.12) foram revisadas e foi inserida a pergunta r).'
