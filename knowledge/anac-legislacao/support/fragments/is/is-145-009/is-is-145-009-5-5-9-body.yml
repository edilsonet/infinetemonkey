text: '5.5.9 e subitens

  Antigo 5.5.8. Na Nota 3 do item 5.5.9.2 (antigo 5.5.8.2) foi corrigida a referência à IS
  nº 43.13-003. Foi revisado o item 5.5.9.6 (antigo 5.5.8.6) incluindo informação sobre aprovação
  em caderneta ou outro documento. As perguntas do item 5.5.9.7 (antigo 5.5.8.7) foram revisadas
  para incluir os aprovadores para retorno ao serviço.'
