section_title: A seção 145.211(c)(3) requer que o MCQ contenha amostras de formulários de
  inspeção e de manutenção e instruções para o seu preenchimento. Alternativamente, o MCQ
  pode referenciar um manual separado de formulários, que apresente amostras de formulários
  com instruções.
