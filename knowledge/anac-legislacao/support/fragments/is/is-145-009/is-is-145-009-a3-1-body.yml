family: '145'
section_id: A3.1
section_title: Os formulários incluídos nesta seção devem ser amostras de quaisquer formulários,
  etiquetas e adesivos descritos nos procedimentos dentro do MCQ. As instruções para preenchimento
  do formulário podem estar no formulário ou em um documento separado. O número e o conteúdo
  dos formulários vão depender do tamanho da organização e da complexidade e a variedade dos
  artigos para os quais a organização está certificada. Revisões ou adições à seção de formulário
  do manual devem seguir os procedimentos de revisão documentados.
