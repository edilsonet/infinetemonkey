title: APÊNDICES
text: 'APÊNDICES

  6.1 APÊNDICE A - FORMULÁRIOS.

  6.2 APÊNDICE B - LISTA DE VERIFICAÇÃO.

  6.3 APÊNDICE C - CONTROLE DE ALTERAÇÕES.


  DISPOSIÇÕES TRANSITÓRIAS E FINAIS

  7.1 As OMs que executam a calibração de seus equipamentos deverão, até 1º de junho de 2024,
  estar aderentes às instruções presentes no item 5.5.13.6 desta IS. A partir de 1º de dezembro
  de 2023, OMs que ainda não realizavam esses serviços e que pretendam realizá-los, deverão
  seguir as instruções presentes no item 5.5.13.6 desta IS antes do início dessa atividade.

  7.2 Os casos omissos serão dirimidos pela ANAC.'
