text: 'h) Análise do Modelo 4

  I- O modelo 4 requer que o leitor tenha alguma familiaridade com fluxogramas, mas pode ser
  facilmente compreensível por alguém que entenda o formato. Como os fluxogramas contêm menos
  palavras do que outros formatos, o processo pode ser lido e compreendido rapidamente. Esse
  formato leva mais tempo para ser desenvolvido, a menos que o autor tenha um programa específico
  para essa finalidade.

  5.3 Procedimentos para revisão e controle dos manuais'
