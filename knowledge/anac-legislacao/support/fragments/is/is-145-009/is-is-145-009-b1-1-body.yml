section_title: A lista a seguir é provida apenas como uma orientação para a verificação dos
  manuais MOM e MCQ frente aos requisitos regulamentares e à IS. Esta lista não foi desenvolvida
  com a intenção de endereçar todo o universo de itens possíveis e deve ser modificada para
  se ajustar à complexidade e ao tipo de operação da OM. Alguns dos itens sugeridos podem
  não se aplicar a todas as OMs. A ANAC sugere que a lista a seguir seja considerada como
  uma base para que a OM desenvolva a sua própria lista de verificação.
