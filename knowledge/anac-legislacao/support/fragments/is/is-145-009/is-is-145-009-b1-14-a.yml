text: 'a) Geral

  I- O MCQ inclui procedimentos para reportar mau funcionamentos ou defeitos?

  II- O MCQ contém procedimentos que asseguram continuidade de responsabilidade da inspeção?

  III- O MCQ contém procedimentos para segregação de artigos reparáveis dos não reparáveis?

  IV- O MCQ inclui procedimentos para etiquetagem ou identificação de artigos, incluindo artigos
  reparáveis e não reparáveis?'
