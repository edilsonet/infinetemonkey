text: 'e) Inspeção Quanto a Danos Ocultos

  I- Quem (por título) irá executar a inspeção?

  II- Como a inspeção será executada?

  III- Como a inspeção será registrada?

  IV- Se forem constatados defeitos, onde eles serão registrados?

  V- A inspeção inclui áreas adjacentes à área da avaria óbvia?

  VI- Quem irá comunicar ao cliente?

  VII- O registro dessa inspeção fará parte do arquivo da ordem de serviço?'
