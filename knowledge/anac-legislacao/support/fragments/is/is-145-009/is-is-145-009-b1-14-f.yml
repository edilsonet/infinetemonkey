title: B1.14(f)
text: 'f) Inspeção do Serviço em Andamento.

  I- Quem (por título) irá executar a inspeção, e como ela é executada?

  II- Como a inspeção será registrada?

  III- Se forem constatados defeitos ou discrepâncias, onde eles serão registrados?

  IV- Os procedimentos permitem etapas serem executadas fora da sequência?

  V- Se os resultados da inspeção de serviço em andamento não forem satisfatórios, o manual
  tem procedimentos para determinar o retrabalho?

  VI- Os formulários utilizados no sistema de inspeção registram ambos, o nome da pessoa que
  executou o trabalho e do inspetor?

  VII- Os registros dessa inspeção fazem parte da ordem de serviço (pacote de serviços)?

  VIII- Quem determina quando uma inspeção de serviço em andamento é executada, e como ela
  é determinada?'
