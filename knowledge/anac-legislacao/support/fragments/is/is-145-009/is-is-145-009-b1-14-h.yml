title: B1.14(h)
text: 'h) Inspeção Final

  I- Quem (por título) irá executar a inspeção?

  II- Como a inspeção será registrada?

  III- Se a inspeção final não for satisfatória, o MCQ tem procedimentos para determinar o
  retrabalho?

  IV- Antes da determinação final de aeronavegabilidade ser feita, todos os outros registros
  de manutenção e formulários de inspeção são verificados quanto ao completo preenchimento?
  Como isso é indicado?

  V- Como a inspeção é executada?

  VI- Depois de concluída a inspeção final, como são identificados os artigos?

  VII- O manual inclui procedimentos para quando a inspeção final resulta na aceitação ou
  rejeição do artigo?

  VIII- Se a OM executa uma inspeção de 100h e/ou atividades para a emissão de um Certificado
  de Verificação de Aeronavegabilidade (CVA), o MCQ inclui procedimento indicando o uso de
  cartões/etiquetas de inspeção, e/ou formulários, listas de verificações, etc., para registrar
  a inspeção e a correção de quaisquer discrepâncias? O manual inclui também procedimentos
  para deferir equipamentos inoperantes da aeronave se o operador possui uma lista de equipamentos
  mínimos - MEL, aprovada pela ANAC?

  IX- Se a manutenção executada foi um grande reparo/alteração, o manual inclui procedimentos
  para assegurar que o inspetor que inspecionou o artigo e o aprovou para retorno ao serviço
  está treinado, qualificado, autorizado e realizou o serviço com base em dados técnicos aprovados
  e aplicáveis?'
