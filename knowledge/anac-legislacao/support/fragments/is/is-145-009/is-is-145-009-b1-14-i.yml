title: B1.14(i)
text: 'i) Conclusão do Trabalho.

  I- Quem (por título) emite os carimbos, crachás ou autorizações?

  II- Os procedimentos asseguram que o método usado pode ser rastreado ao indivíduo que emitiu
  a autorização (uma lista de nomes e carimbos ou documento similar)?

  III- O MCQ inclui procedimentos para verificar se os carimbos (se utilizados) ainda estão
  legíveis?

  IV- Os procedimentos asseguram que o carimbo, crachá ou autorização são devolvidos, ou revogados
  pelo gerente responsável, após o término ou nova designação de um empregado?

  V- O programa de treinamento inclui procedimentos de segurança para o sistema utilizado
  (carimbos ou eletrônico)?'
