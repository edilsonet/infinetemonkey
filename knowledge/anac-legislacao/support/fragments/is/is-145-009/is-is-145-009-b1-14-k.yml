title: B1.14(k)
text: 'k) Registros Requeridos e Arquivamento dos Registros.

  I- Quem (por título) é responsável por manter o sistema de arquivamento dos registros?

  II- Quais documentos são incluídos em um típico pacote de serviços? Quais formulários adicionais
  podem ser incluídos?

  III- Onde os registros são conservados?

  IV- Quem (por título) analisa os registros quanto à exatidão e completo preenchimento antes
  da aprovação para retorno ao serviço? Essa pessoa é treinada?

  V- Se a OM utiliza registros eletrônicos, o manual descreve os procedimentos, incluindo
  segurança, cópia de segurança, e recuperação?

  VI- Os registros são em português, e eles atendem (a pelo menos) os requisitos das seções
  43.9 e 43.11 do RBAC nº 43?

  VII- Quais registros serão entregues ao proprietário/operador?

  VIII- Como a OM processa os registros recebidos das organizações subcontratadas?

  IX- Os procedimentos para distribuição e conservação do formulário ANAC F-400-04 estão incluídos?'
