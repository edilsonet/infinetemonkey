title: B1.14(n)
text: 'n) Tomar Ações Corretivas Quanto a Deficiências.

  I- Quem (por título) é responsável pelo programa?

  II- Como é determinada a causa raiz do problema?

  III- Quem (por título) inicia a ação corretiva?

  IV- Quanto tempo é permitido para implementar a ação corretiva?

  V- Quem (por título) executa a auditoria de acompanhamento da ação corretiva para assegurar
  que ela foi efetiva?

  VI- Quais registros são conservados, da causa e da ação corretiva tomada?'
