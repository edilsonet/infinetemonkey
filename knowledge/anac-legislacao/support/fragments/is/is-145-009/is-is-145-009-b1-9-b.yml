section_title: Trabalho Executado em Outra Localidade
subsection_id: b
cite: B1.9(b)
title: B1.9(b)
text: 'b) Se a OM pretende executar trabalho em outra localidade regularmente, o manual inclui
  procedimentos que enderecem as seguintes questões:

  I- As preparações e condições a atender antes de executar qualquer trabalho?

  II- Quem é responsável por supervisionar a manutenção executada em outra localidade?

  III- É assegurado que as seções aplicáveis do MOM/MCQ estão disponíveis no local remoto?

  IV- É assegurado que ferramentas, equipamentos e dados técnicos atualizados estão disponíveis
  no local?

  V- Quando e como o artigo é inspecionado?

  VI- Como o trabalho é registrado? Os registros atendem aos requisitos das seções 43.9 e
  43.11 do RBAC nº 43? Os formulários utilizados no local remoto são os mesmos usados na OM?
  Quem é o responsável pelo transporte e conservação dos registros? Onde serão conservados?'
