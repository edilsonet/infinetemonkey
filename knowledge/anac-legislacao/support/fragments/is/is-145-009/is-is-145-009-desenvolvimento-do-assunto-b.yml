title: desenvolvimento-do-assunto(b)
text: 'b) Elementos do MCQ:

  I- Procedimentos de revisão e notificação à ANAC;

  II- Qualificação e fiscalização de pessoas não certificadas executando manutenção, manutenção
  preventiva ou alterações para a OM;

  III- Estabelecer e manter proficiência do pessoal de inspeção e do pessoal de aprovação
  para retorno ao serviço;

  IV- Obter e manter atualizados os dados técnicos;

  V- Sistema de Inspeção

  i. Inspeção de recebimento de matéria prima e de artigos que entram na organização de manutenção;

  ii. Inspeção preliminar;

  iii. Inspeção quanto a danos ocultos;

  iv. Inspeção final e retorno ao serviço.

  VI- Calibração de equipamentos de medida e teste, incluindo intervalos de calibração;

  VII- Ação corretiva;

  VIII- Modelos de formulários de inspeção e instruções para o seu preenchimento (pode ser
  um manual separado).'
