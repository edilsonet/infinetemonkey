title: desenvolvimento-do-assunto(c)
text: 'c) Partes recomendadas para a maioria dos manuais:

  I- Índice;

  II- Lista de páginas efetivas;

  III- Registro de revisões.

  NOTA 1: Sobre as demais normas que indiretamente afetem a segurança da aviação civil, a
  ANAC esclarece que a OM deve verificar o cumprimento com todas as normas de segurança, operacionais,
  inclusive relativas ao trabalho e saúde do trabalhador, sejam municipais, estaduais, federais,
  etc., incluindo os requisitos referentes às atividades regidas por Conselhos Regionais,
  Federais, etc. A ANAC leva em consideração o impacto indireto desses assuntos na segurança
  da aviação civil.'
