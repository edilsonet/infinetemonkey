title: OBJETIVO
text: 'OBJETIVO

  1.1 Esta Instrução Suplementar - IS estabelece, detalha, orienta e provê informações adicionais
  aos detentores de certificados de Organização de Manutenção de Produto Aeronáutico - OM
  e aos requerentes a certificação conforme o RBAC nº 145, descrevendo um meio aceitável,
  mas não único, para elaborar o Manual da Organização de Manutenção - MOM e o Manual de Controle
  da Qualidade - MCQ.

  NOTA 1: Além do MOM e do MCQ, é requerido a cada organização de manutenção a elaboração
  e manutenção de um programa de treinamento e um manual do sistema de gerenciamento da segurança
  operacional - SGSO. Cada um desses assuntos está detalhado em IS específica.'
