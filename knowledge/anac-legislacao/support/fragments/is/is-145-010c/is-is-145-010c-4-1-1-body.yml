text: '4.1.1 Competência: conhecimentos, habilidades e atitudes requeridas para executar adequadamente
  uma tarefa.

  4.1.2 Doutrinação: tipo de treinamento inicial fornecido por uma OM contendo conhecimentos
  básicos a serem ministrado a seus funcionários, sobre a OM, como ela é estabelecida, como
  funciona, seus procedimentos, suas prerrogativas, limitações, seus manuais, a regulamentação
  aplicável etc.

  4.1.3 Função de Manutenção: uma etapa, ou uma série de etapas, no processo de execução de
  manutenção, manutenção preventiva ou alteração e funções de inspeção, que pode resultar
  na aprovação de um artigo para retorno ao serviço, e funções de registro de manutenção.'
