text: '4.1.4 Funcionário Técnico: pessoa com Competência para executar Funções de Manutenção.

  4.1.5 Instituição de Ensino: é qualquer entidade que oferece educação formal, como centros
  de treinamento, escolas, universidades, faculdades, centros universitários, com um sistema
  estruturado de ensino, que segue um currículo padronizado e leva à obtenção de diplomas
  ou certificados. Ela é caracterizada por ser planejada, organizada e avaliada de forma sistemática,
  com o objetivo de transmitir conhecimentos e habilidades específicas.

  4.1.6 Requisitos de Treinamento: quaisquer necessidades relativas a treinamento, seja para
  uma pessoa, uma OM, um curso, ou uma Função de Manutenção. Exemplos: Competências necessárias
  para uma pessoa (ou para uma Função de Manutenção), tipo do treinamento necessário para
  executar uma tarefa, cursos necessários para uma pessoa etc.'
