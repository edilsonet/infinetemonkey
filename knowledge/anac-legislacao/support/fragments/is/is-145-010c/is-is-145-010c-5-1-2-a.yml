cite: 5.1.2(a)
title: 5.1.2(a)
text: 'a) aprovação formal: nos termos do parágrafo 145.163(a) RBAC nº 145, o PTM deve ser
  submetido à Anac para análise e aprovação formal apenas nas seguintes situações:

  I - certificação inicial da OM;

  II - inclusão de novos procedimentos decorrentes de isenção de requisitos ou procedimentos
  alternativos de cumprimento de IS;

  Nota: nos casos de isenção de requisito, a OM deve seguir o disposto no RBAC nº 11. Nos
  casos de procedimento alternativo, a OM deve seguir o disposto na Resolução nº 30/2008.
  A simples aprovação do manual não constitui aprovação de isenção ou meio alternativo.

  III - reedição completa do manual;

  Nota: no caso de reedição completa do manual, é necessária apresentação de comprovante de
  pagamento da TFAC aplicável.

  IV - inserção/remoção de procedimentos com o objetivo de cumprir requisitos estabelecidos
  em acordos internacionais de manutenção; e

  V - outras situações conforme determinadas pela Anac em processo específico.

  Nota: nesses casos, a OM só poderá utilizar a nova versão do manual após a análise e aprovação
  formal por parte da Anac. Se o manual for rejeitado, serão informadas detalhadamente as
  deficiências, e recomendar-se-á à OM não executar manutenção, caso o procedimento rejeitado
  esteja em uso.'
