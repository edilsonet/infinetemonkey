cite: 5.1.2(b)
title: 5.1.2(b)
text: 'b) submissão somente para conhecimento: nos seguintes casos, não é necessária a aprovação
  formal por parte da Anac, devendo o manual ser enviado somente para conhecimento:

  I - adequação dos procedimentos descritos à realidade da OM e às mudanças na legislação;
  e

  II - quando a alteração do manual não constar das situações descritas na alínea (a) acima.

  Nota: um PTM original é submetido à aprovação da Anac no momento da certificação da OM.
  Após a submissão do manual original, a OM pode optar em seguir as instruções da seção 5.1.2
  desta IS, que define as situações nas quais é necessário enviar a revisão do manual para
  aprovação da Anac e as situações em que a OM pode apenas comunicar a Anac da revisão do
  manual.'
