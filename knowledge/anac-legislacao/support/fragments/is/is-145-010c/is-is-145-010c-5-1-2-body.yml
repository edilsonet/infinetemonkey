text: '5.1.2 Procedimentos para submissão à Anac

  5.1.2.1 A Anac deve ser notificada de todas as revisões do PTM, sem exceção. Na carta ou
  outro documento que envia o PTM revisado como anexo, a OM deve identificar e informar à
  Anac qual tipo de revisão foi realizada, enquadrando-a entre uma das alíneas a seguir:'
