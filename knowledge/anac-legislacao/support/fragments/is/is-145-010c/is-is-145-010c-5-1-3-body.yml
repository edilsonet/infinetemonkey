title: Requisitos relativos aos manuais da OM
text: '5.1.3 Requisitos relativos aos manuais da OM

  5.1.3.1 A Anac aceita que o programa de treinamento seja parte integrante do MOM, mas devidamente
  identificado como um capítulo específico, embora recomende ser apresentado como um manual
  separado.

  5.1.3.2 Se o programa de treinamento for parte do MOM, os procedimentos do programa de treinamento
  devem ser enviados para a Anac por ocasião de suas revisões, independente do próprio MOM,
  que não é aprovado pela Anac, mas aceito.

  5.1.3.3 Se o programa de treinamento estiver contido em um manual separado, deve incluir
  as provisões de revisão e submissão requeridas pelo parágrafo 145.209(e) do RBAC nº 145
  e detalhadas na seção 5.1.2 desta IS.'
