section_title: 'O programa de treinamento de uma OM deve incluir o seguinte:'
subsection_id: e
cite: 5.1.4.5(e)
title: 5.1.4.5(e)
text: 'e) treinamento corretivo, customizado para corrigir deficiências de Competência detectadas
  pela OM (ver subseção 5.2.6 desta IS).

  5.1.4.6 Os PTM de diferentes OMs podem variar em número de cursos, conteúdo, carga horária,
  intervalo para recorrência determinado em dias, meses ou anos, métodos de treinamento e
  fontes. Por exemplo, uma OM de grande porte pode ter cursos de Doutrinação separados para
  técnicos, inspetores, gerentes e supervisores enquanto outra OM, de pequeno porte, poderia
  ter somente um curso de Doutrinação que seja adequado para todo o seu pessoal, inclusive
  pessoal temporário.

  5.1.4.7 Como produto do PTM, a Anac recomenda que a OM inclua no documento uma tabela com
  a grade dos treinamentos e cursos definidos, com seus respectivos conteúdos, carga horária
  método de ensino e de avaliação. Os modelos de programa de treinamento apresentam um exemplo
  de grade de treinamentos que pode ser usado como referência.

  5.1.4.8 A Anac estabelece as seguintes questões para verificar se o programa de treinamento
  está em conformidade com o requisito de assegurar que cada pessoa que executa Função de
  Manutenção esteja treinada ou seja capaz de executar o que lhe foi designado:'
