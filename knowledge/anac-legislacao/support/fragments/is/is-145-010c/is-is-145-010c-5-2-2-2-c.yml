section_id: 5.2.2.2
section_title: 'Os seguintes assuntos de Doutrinação inicial devem ser incluídos no PTM, independentemente
  do tamanho ou categoria da OM:'
subsection_id: c
cite: 5.2.2.2(c)
title: 5.2.2.2(c)
text: 'c) familiarização quanto a artigos perigosos, com relação a manuseio, carregamento
  e transporte (apenas para as organizações que desempenham atividade relacionada);

  Nota: não confundir treinamento e familiarização em artigos perigosos com:

  I - treinamento para executar ou diretamente supervisionar funções de trabalho relacionadas
  ao transporte aéreo de artigos perigosos para um detentor de certificado segundo os RBAC
  nº 121 ou RBAC nº 135, ou em nome dele, inclusive carregamento de itens para transporte
  em uma aeronave operada por um detentor de certificado segundo esses RBAC, de acordo com
  o programa de treinamento em artigos perigosos do próprio operador; ou

  II - requisitos tais com os, da Seção 171.8, do DOT 49 CFR - Treinamento padronizado em
  “artigos perigosos”, que requer o treinamento obrigatório para o pessoal engajado em embarque
  de materiais perigosos em aeronaves.'
