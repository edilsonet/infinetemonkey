section_title: 'Os seguintes assuntos de Doutrinação inicial devem ser incluídos no PTM, independentemente
  do tamanho ou categoria da OM:'
subsection_id: e
cite: 5.2.2.2(e)
title: 5.2.2.2(e)
text: 'e) fatores humanos na manutenção: a Anac (tal como as demais Autoridades de Aviação
  Civil) requer o treinamento em fatores humanos relacionados com as práticas de manutenção,
  pois esse treinamento provê uma margem adicional de segurança. O programa de treinamento
  em fatores humanos deve ser relacionado às práticas de manutenção de aeronaves, segurança,
  legislação vigente, sempre que possível. Os seguintes elementos de fatores humanos devem
  estar presentes nesse treinamento:

  I - introdução a fatores humanos;

  II - cultura de segurança e fatores organizacionais;

  III - erros humanos;

  IV - desempenho humano e limitações;

  V - ambiente;

  VI - procedimentos, informações, ferramentas e práticas;

  VII - comunicação;

  VIII - equipe de trabalho;

  IX - profissionalismo e integridade; e

  X - programa de fatores humanos da organização.

  Nota: alguns dos assuntos listados acima não estão diretamente sob a esfera de ação da Anac;
  entretanto, a Anac reconhece que as OM possam desejar ter um único programa de treinamento
  para todo o seu pessoal. As OM são encorajadas a distinguir o treinamento requerido para
  cumprir o RBAC nº 145 de outros treinamentos que serão providos ao pessoal, e descritos
  em seu manual ou programa de treinamento.'
