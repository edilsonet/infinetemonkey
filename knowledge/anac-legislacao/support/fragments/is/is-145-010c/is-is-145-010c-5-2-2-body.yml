text: '5.2.2 Treinamento de Doutrinação inicial

  5.2.2.1 O treinamento de Doutrinação é um treinamento essencial para todo o pessoal da OM.
  O objetivo e a complexidade desse treinamento podem variar, baseado na posição, cargo ou
  atividade designada para cada pessoa. A OM deve determinar a complexidade requerida nesse
  treinamento para cada posição, cargo ou atividade por meio do processo de avaliação de necessidades,
  descrito na subseção 5.3.2 desta IS.'
