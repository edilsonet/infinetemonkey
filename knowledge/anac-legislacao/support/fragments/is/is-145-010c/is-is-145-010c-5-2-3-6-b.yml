id: is-is-145-010c-5-2-3-6-b
kind: is
document: is-145-010c
family: '145'
section_id: 5.2.3.6
section_title: 'Sempre que uma nova informação for introduzida nos temas de treinamento técnico
  inicial, a OM deverá:'
subsection_id: b
cite: 5.2.3.6(b)
title: 5.2.3.6(b)
text: 'b) para os já contratados, prover treinamento adicional contendo a nova informação.
  Alternativamente, a informação adicional pode ser dada ao pessoal existente por meio de
  treinamento técnico recorrente contendo a nova informação.

  5.2.3.7 O tempo dedicado ao treinamento técnico inicial pode variar, dependendo do nível
  de experiência das pessoas e das Competências associadas ao trabalho ou tarefas designadas.
  Assim, a OM deve: estabelecer uma carga horária mínima para todas as pessoas de um cargo
  específico, seja por treinamento dado pela OM, seja para conhecimento adquirido por meio
  de outras fontes; ou, em vez de estabelecer uma carga horária mínima para treinamento técnico
  inicial, avaliar a necessidade de treinamento técnico inicial baseado em resultados dos
  testes de habilidade e conhecimento. Em qualquer caso, o programa de treinamento da OM deve
  assegurar que a pessoa seja capaz de executar satisfatoriamente os trabalhos ou tarefas
  a ela designados.'
