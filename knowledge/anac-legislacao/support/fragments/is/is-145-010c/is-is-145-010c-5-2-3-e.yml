title: 5.2.3(e)
text: 'e) treinamento específico de um trabalho ou tarefa.

  5.2.3.5 Por outro lado, o treinamento técnico inicial para novos Funcionários Técnicos com
  experiência prévia pode incluir uma revisão geral dos mesmos temas, conforme necessário,
  e uma abordagem mais detalhada para os trabalhos ou tarefas a serem designados. Entretanto,
  deve ser estabelecido um treinamento técnico específico para cada Funcionário Técnico baseado
  na avaliação das suas necessidades individuais.'
