title: Nem todas as tarefas designadas terão os mesmos Requisitos de Treinamento.
text: '5.2.5.3 Nem todas as tarefas designadas terão os mesmos Requisitos de Treinamento.

  5.2.5.4 A OM pode também querer dispor de um procedimento para determinar quando um treinamento
  recorrente não é necessário para a execução de determinadas tarefas.

  Nota 1: para certas tarefas de manutenção que o pessoal técnico da OM esteja constantemente
  executando, e para as quais o fabricante do artigo não tenha desenvolvido novos procedimentos,
  novas técnicas, novos materiais ou novo ferramental, a OM poderá estabelecer em seu PTM
  critérios específicos para determinar que para esse tipo de atividade um treinamento recorrente
  não se faz necessário.

  Nota 2: para treinamentos relacionados à manutenção de produtos aeronáuticos é aceitável
  considerar a equivalência com cursos em artigos similares. A similaridade aceita refere-se
  a produtos com a mesma tecnologia, mesmo tipo, mesma classe de certificação, mesma motorização,
  método construtivo, entre outros. Nesse caso, a OM deverá estabelecer no seu PTM procedimentos
  específicos para avaliação e aceitação de treinamentos considerados similares.

  5.2.5.5 A OM deve ter procedimentos para determinar o tipo e a frequência (em dias, meses
  ou anos) do treinamento recorrente para cada um dos seus Funcionários Técnicos por meio
  da avaliação de necessidades.'
