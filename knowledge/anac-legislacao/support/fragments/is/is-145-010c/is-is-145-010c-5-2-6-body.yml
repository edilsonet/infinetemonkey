title: Treinamento recorrente - Corretivo
text: '5.2.6 Treinamento recorrente - Corretivo

  5.2.6.1 Uma OM deve ter procedimentos para determinar os Requisitos de Treinamento individual,
  inclusive os casos de necessidade de treinamento corretivo. A OM deve utilizar os procedimentos
  de treinamento corretivo para retificar, o quanto antes, a falta de habilidade ou conhecimento
  demonstrada por um Funcionário Técnico.

  5.2.6.2 O treinamento corretivo deve consistir em uma pessoa com conhecimentos adequados
  repassando todos os procedimentos por meio de treinamento em serviço (on-the-job-training
  - OJT). Esse treinamento poderá ser complementado por instruções teóricas em sala de aula.

  5.2.6.3 O treinamento corretivo deve ser utilizado para imediata correção de uma deficiência
  de habilidade ou conhecimento, e pode ser focado em apenas um Funcionário Técnico. Dado
  o caráter imediato, a OM não necessita, por exemplo, esperar formar um grupo para executar
  treinamento corretivo.

  5.2.6.4 Um treinamento corretivo eficaz deve mostrar à pessoa o que aconteceu, por que aconteceu
  e, de um modo positivo, como deveria ter sido feito e como evitar que o erro aconteça novamente.

  5.3 Componentes básicos do programa de treinamento'
