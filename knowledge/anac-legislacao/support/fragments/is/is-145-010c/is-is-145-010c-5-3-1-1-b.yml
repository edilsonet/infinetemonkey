section_id: 5.3.1.1
section_title: 'Um programa efetivo de treinamento deve conter os seguintes elementos:'
subsection_id: b
cite: 5.3.1.1(b)
title: 5.3.1.1(b)
text: b) matérias e estruturação dos cursos. O programa de treinamento deve incluir os procedimentos
  utilizados para definir cada matéria ou curso. Isso inclui a definição da finalidade e dos
  objetivos específicos do curso, de quaisquer pré-requisitos, matérias requeridas, tempo
  empreendido e o resultado desejado em termos de ganho de habilidade ou conhecimento técnico.
  Para cada curso, o programa deve incluir uma descrição detalhada de informações ou habilidades
  técnicas que serão ministradas, além de material de referência, ferramentas, equipamentos
  ou procedimentos que serão usados, métodos e fontes de treinamento disponíveis, qualificações
  do instrutor e método para registrar o desempenho do Funcionário Técnico;
