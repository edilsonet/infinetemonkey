section_title: 'Um programa efetivo de treinamento deve conter os seguintes elementos:'
subsection_id: e
cite: 5.3.1.1(e)
title: 5.3.1.1(e)
text: e) documentação do treinamento. A OM deve ter procedimentos para documentar o treinamento
  de cada pessoa para assegurar o cumprimento da seção 145.163(c) do RBAC nº 145. Isso inclui
  estabelecer o conteúdo dos registros de treinamento e de um sistema para registrar, acessar
  e reter os registros de treinamento por, no mínimo, 5 (cinco) anos após o término do vínculo
  contratual;
