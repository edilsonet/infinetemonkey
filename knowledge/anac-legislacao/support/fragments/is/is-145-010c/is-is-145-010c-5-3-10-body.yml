title: Considerações especiais para OM localizada fora do Brasil
text: '5.3.10 Considerações especiais para OM localizada fora do Brasil

  5.3.10.1 Não é requerido de uma OM localizada fora do Brasil ter seu pessoal certificado
  conforme o RBAC nº 65. Entretanto, o conhecimento técnico, habilidades e competências mínimas
  devem ser os mesmos para qualquer pessoa que executa Função de Manutenção, independentemente
  de onde a OM esteja localizada. Consequentemente, a Anac espera que toda OM tenha programas
  de treinamento que incluam os elementos básicos descritos nesta IS, inclusive um requisito
  abrangente de avaliação de necessidades.

  5.3.10.2 Ao efetuar a avaliação de necessidades de treinamento, a OM no exterior deve colocar
  ênfase especial na competência do pessoal de inspeção e supervisão em ler, escrever e entender
  o idioma dos manuais técnicos relacionados às tarefas e registros de manutenção do produto
  sendo trabalhado.

  5.3.10.3 Uma OM localizada fora do Brasil que também detenha aprovação de outra autoridade
  de aviação civil pode ter um programa de treinamento que satisfaça tanto os requisitos do
  RBAC nº 145 quanto os da outra autoridade. Requisitos adicionais ou diferentes não interferem
  com a aprovação do programa de treinamento pela Anac, desde que o programa atenda a todos
  os requisitos do RBAC nº 145. Nesse caso, portanto uma OM localizada fora do Brasil não
  precisa ter diversos programas de treinamento. De qualquer modo, o programa de treinamento
  deve ser submetido à Anac para aprovação conforme estabelecido no RBAC nº 145, ou de acordo
  com os procedimentos de um acordo internacional.'
