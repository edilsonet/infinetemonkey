title: 5.3.2.4(b)
text: b) Mesmo que uma OM tenha apenas um Funcionário Técnico, ela deve avaliar a Competência
  deste e determinar se seu treinamento atual é adequado ou se é necessário um treinamento
  adicional para executar as tarefas para as quais ele tem autorização da OM.
