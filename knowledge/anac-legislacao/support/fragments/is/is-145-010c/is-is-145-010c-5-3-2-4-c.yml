section_title: Avaliação das necessidades de uma OM
subsection_id: c
cite: 5.3.2.4(c)
title: 5.3.2.4(c)
text: c) A avaliação de necessidades de treinamento é uma análise metódica das tarefas associadas
  com as Funções de Manutenção. Essa análise envolve a identificação das Competências necessárias
  para o adequado preenchimento dos cargos com Funções de Manutenção. Adicionalmente, na determinação
  dos Requisitos de Treinamento, uma OM deve analisar a natureza da estrutura de seu negócio
  e seus clientes.
