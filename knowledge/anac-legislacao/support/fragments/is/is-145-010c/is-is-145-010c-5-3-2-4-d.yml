section_title: Avaliação das necessidades de uma OM
subsection_id: d
cite: 5.3.2.4(d)
title: 5.3.2.4(d)
text: 'd) Na identificação das necessidades gerais de treinamento, a OM deve considerar:

  I - as tarefas associadas com cada cargo com Função de Manutenção, assim como as Competências
  necessárias para executá-las;

  II - as habilidades, experiência e treinamento de pessoal novo e os já existentes;

  III - como serão feitas as avaliações de pessoas ao serem autorizadas para tarefas novas;

  IV - o retorno de uma pessoa para realizar tarefas, após um longo período sem executá-las;

  V - introdução de novos regulamentos, procedimentos, equipamento ou requisitos de arquivamento
  de registros de manutenção; e

  VI - preparação para mudança na natureza da capacidade da OM.'
