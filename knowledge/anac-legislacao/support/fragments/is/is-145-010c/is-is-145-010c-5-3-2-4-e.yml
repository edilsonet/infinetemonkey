section_title: Avaliação das necessidades de uma OM
subsection_id: e
cite: 5.3.2.4(e)
title: 5.3.2.4(e)
text: e) A avaliação de necessidades repassa os Requisitos de Treinamento da OM dentro do
  contexto da Competência do pessoal existente e das tarefas associadas com autorizações de
  trabalho específicas. Baseado no resultado da avaliação de necessidade, a OM pode desenvolver
  e revisar suas matérias e seus cursos.
