title: 5.3.2.5(b)
text: b) O programa de treinamento deve descrever como a OM mantém o funcionário atualizado,
  e como ele recebe o treinamento inicial, recorrente e corretivo de acordo com o parágrafo
  145.163(a) do RBAC nº 145. Esses procedimentos devem ser documentados e formar a base do
  programa de treinamento.
