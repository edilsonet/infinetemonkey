cite: 5.3.2.5(f)
title: 5.3.2.5(f)
text: f) A OM deve também ter procedimentos para aceitar conhecimento, treinamento ou experiência
  prévia comprovada para estabelecer a Competência de uma pessoa. Por exemplo, uma OM pode
  aceitar os certificados de um CIAC ou instituição voltada à manutenção de produtos aeronáuticos
  (existem operadores e fabricantes que fornecem treinamento direto ou por terceiros, tais
  como a Boeing, Lufthansa, Cessna etc. Incluem-se aqui os certificados fornecidos pelas organizações
  militares) ou uma licença de MMA emitida pela Anac como evidências aceitáveis de conhecimento
  e nível de habilidade básicos em uma área específica. Porém, por ser responsável pelo produto
  da execução da manutenção, é recomendável que a OM procure validar esses conhecimentos,
  treinamentos ou experiências prévias por métodos de avaliação prática, por exemplo.
