section_title: 'Cada curso ou módulo (um curso completo pode consistir de vários módulos)
  deve incluir, conforme aplicável, o seguinte:'
subsection_id: a
cite: 5.3.3.3(a)
title: 5.3.3.3(a)
text: a) os pré-requisitos mínimos ou a qualificação mínima exigida pelos regulamentos, ou
  requerida pela OM, para o funcionário poder frequentar o curso. Por exemplo, o tipo de licença,
  aeronaves, qualificações para produtos ou artigos, treinamento prévio, experiência com outros
  operadores e requisitos de experiência recente;
