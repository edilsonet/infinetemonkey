title: Definição dos cursos
text: '5.3.3 Definição dos cursos

  5.3.3.1 Uma vez definidos os Requisitos de Treinamento, incluindo o tipo de treinamento
  que cada pessoa necessita, a OM deve estabelecer, para cada curso, seu título, o conteúdo
  (tal como estrutura, matérias, módulos, capítulos, grade), e qual o nível de tratamento
  é adequado (tal como introdutório ou avançado, inicial ou recorrente). A elaboração de um
  curso deve levar em conta a avaliação de necessidades para as tarefas e o nível de experiência
  das pessoas a serem treinadas.

  5.3.3.2 A OM pode desenvolver seus próprios cursos ou prover a seu pessoal cursos de fontes
  externas. Se a OM escolher desenvolver os cursos, cada curso deve incluir objetivos, resultados
  desejados e uma lista de módulos disponíveis.'
