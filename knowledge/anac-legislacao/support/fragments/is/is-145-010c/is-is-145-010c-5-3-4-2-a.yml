section_title: 'Segue abaixo um resumo de diferentes métodos para ministrar treinamento:'
subsection_id: a
cite: 5.3.4.2(a)
title: 5.3.4.2(a)
text: 'a) Treinamento formal em sala de aula. O treinamento pode ser provido por um curso
  formal ministrado por um instrutor em sala de aula.

  I - Para assegurar a eficácia desse método de treinamento, devem ser incluídos na definição
  do curso: o objetivo, o roteiro definindo os tópicos e o resultado esperado, lista de material
  de referência, lista de material a ser usado no treinamento, a qualificação do instrutor,
  um resumo do conhecimento ou habilidade a ser obtido e o método usado para assegurar que
  ele seja absorvido pelo funcionário.

  II - Neste método de treinamento, a interação dos funcionários da OM com o instrutor é importante
  para que as informações sejam transferidas com sucesso.'
