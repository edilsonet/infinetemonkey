section_title: 'Segue abaixo um resumo de diferentes métodos para ministrar treinamento:'
subsection_id: b
cite: 5.3.4.2(b)
title: 5.3.4.2(b)
text: 'b) Treinamento em serviço (OJT). Neste tipo de treinamento, o conhecimento é obtido
  pela participação do Funcionário Técnico na execução de uma tarefa sob orientação de uma
  pessoa qualificada, ou observando outra pessoa demonstrando a tarefa ou atividade e, então,
  executar a mesma ação sob supervisão até que sejam obtidos resultados satisfatórios.

  I - É um método eficaz de treinamento para habilidades práticas e para tarefas e assuntos
  difíceis de entender somente pela descrição, ou para os quais a demonstração da Competência
  seja essencial para a correta conclusão da tarefa.

  II - Para tornar este método de treinamento mais eficaz, deve-se prover uma informação padronizada,
  utilizando, para uma determinada tarefa, dados aprovados do manual de manutenção do artigo
  e ferramentas e equipamentos referenciados.

  III - O processo deve documentar nos registros do OJT que o Funcionário Técnico demonstrou
  a habilidade para executar a tarefa adequadamente, tal como requerido.

  IV - Mesmo com um instrutor muito capaz, a OM deve assegurar que qualquer OJT seja bem estruturado,
  estabelecendo que os mesmos elementos-chave (alínea II acima) sejam incluídos em cada treinamento.'
