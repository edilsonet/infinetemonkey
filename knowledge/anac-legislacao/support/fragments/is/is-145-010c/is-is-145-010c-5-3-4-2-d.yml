title: 5.3.4.2(d)
text: d) Treinamento a distância. Treinamento a distância se aplica a situações em que o instrutor
  não está na mesma localidade que o pessoal. Ele pode tomar a forma de videoconferência,
  teleconferência ou uma combinação de ambos, denominada algumas vezes de aulas “virtuais”;
  ou instruções baseadas em internet ou intranet, que permite ao pessoal interagir com um
  instrutor ou com material de treinamento similar ao CBT. A vantagem deste método de treinamento
  é que os cursos podem ser feitos sob medida para necessidades específicas de uma OM e o
  instrutor pode responder a questões individuais. É recomendado ainda complementar o treinamento
  com uma avaliação prática ou OJT visando assegurar a eficácia do treinamento.
