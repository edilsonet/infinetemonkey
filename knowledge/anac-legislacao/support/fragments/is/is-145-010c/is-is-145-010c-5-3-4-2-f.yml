section_title: 'Segue abaixo um resumo de diferentes métodos para ministrar treinamento:'
subsection_id: f
cite: 5.3.4.2(f)
title: 5.3.4.2(f)
text: 'f) Outros métodos. Incluem o autodidatismo, o baseado em estudos de caso e os seminários.

  I - Esses métodos de treinamento, ou de aquisição de conhecimento, podem ser aceitos por
  uma OM desde que as informações obtidas se apliquem às funções de trabalho e às Competências
  requeridas para executar o trabalho com competência.

  II - O programa de treinamento deve assegurar que quaisquer processos usados para transmitir
  informações sejam estabelecidos por requisitos e padrões objetivos. Qualquer aula, curso
  ou lição deve ter um objetivo escrito, material de curso, ferramentas e equipamentos identificados,
  e uma avaliação do conhecimento absorvido pelo funcionário.

  III - Por ser responsável pelo produto da execução da manutenção, é recomendável que a OM
  procure validar esses conhecimentos, treinamentos ou experiências prévias por métodos de
  avaliação prática ou OJT, por exemplo.

  5.3.4.3 A OM deve selecionar o método de transmissão do conhecimento com base em suas avaliações
  de necessidades. Ela também deve ter um método para verificar se a técnica de transmissão
  de conhecimento escolhida é eficaz para o funcionário em treinamento.'
