text: '5.3.5.1 Existem inúmeras fontes para o treinamento e a OM deve ter um processo para
  selecionar as que satisfarão seus Requisitos de Treinamento.

  5.3.5.2 Os Requisitos de Treinamento de uma OM podem ser cumpridos por meio de treinamentos
  ministrados pela própria OM, por instituições de ensino, pelos fabricantes, por outras OMs
  e por operadores aéreos certificados segundo o RBAC nº 119.

  5.3.5.3 Para gerenciar custos, várias OMs que tenham necessidades similares podem organizar
  e realizar cursos de forma conjunta, rateando os custos de treinamento. OMs também podem
  funcionar como entidades de treinamento ou trabalhar com instituições de ensino para desenvolver
  cursos. Tais instituições de ensino e OMs podem formalizar acordos de cooperação.'
