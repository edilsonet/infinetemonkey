cite: 5.3.5.4(a)
title: 5.3.5.4(a)
text: a) fabricante original do equipamento (Original Equipment Manufacturer - OEM). Os OEM
  podem transmitir informações técnicas com relação à manutenção e alteração de seus artigos
  por meio de instrução formal em sala de aula, OJT, ensino a distância, tecnologia embutida
  ou material de CBT. Os instrutores do OEM podem vir à OM para ministrar o treinamento no
  local, ou transmitir informações em outras localidades, por meio de seminários, sessões
  ou estudos. O treinamento pela OEM na OM possibilita ratear os custos de treinamento com
  outras OM da mesma localidade. Se a OM selecionar um curso da OEM, ela deve assegurar que
  seus Funcionários Técnicos já possuam os pré-requisitos necessários, tais como experiência
  prévia, para o curso ser mais eficaz. Além disso, a OM deve verificar se o conteúdo do curso,
  seu objetivo, o material didático e instrutores designados pelo OEM atendem aos requisitos
  estabelecidos no programa de treinamento da OM;
