title: 5.3.5.4(b)
text: b) Centro de Instrução de Aviação Civil (CIAC). Um CIAC certificado de acordo com o
  RBAC nº 141 pode ser uma fonte eficaz de treinamento para uma OM, particularmente para Competências
  básicas. O treinamento pode precisar ser suplementado por informações particulares às tarefas
  e aos equipamentos da OM;
