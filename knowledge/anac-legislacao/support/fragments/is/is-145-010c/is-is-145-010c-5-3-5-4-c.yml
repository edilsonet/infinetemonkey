section_title: 'Algumas fontes comuns de treinamento são:'
subsection_id: c
cite: 5.3.5.4(c)
title: 5.3.5.4(c)
text: c) operadores aéreos ou outras organizações de manutenção. Operadores e outras OM podem
  ter programas de treinamento para fornecer treinamento a terceiros mediante contrato. Operadores
  aéreos podem prover a Funcionários Técnicos específicos da OM o treinamento em itens de
  inspeção obrigatória (IIO) e no programa de treinamento do operador. O operador pode também
  prover outros treinamentos gerais, tais como requisitos dos regulamentos;
