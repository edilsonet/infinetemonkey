section_title: 'Algumas fontes comuns de treinamento são:'
subsection_id: f
cite: 5.3.5.4(f)
title: 5.3.5.4(f)
text: 'f) outras fontes. Existe uma variedade de outras fontes de treinamento que incluem,
  dentre outros, seminários independentes, instruções baseadas em computador, vídeos e fabricantes
  de equipamentos. Todas as fontes de informações devem ser consideradas como fontes potenciais
  de treinamento. O programa de treinamento da OM deve ter um método para incorporar tais
  oportunidades de treinamento para assegurar que cada Funcionário Técnico seja capaz de executar
  a tarefa para a qual foi designado.

  5.3.5.5 Independentemente da fonte do treinamento, a OM permanece responsável pela administração,
  adequação e atualização do seu programa de treinamento e pelo arquivamento dos registros
  de treinamento.'
