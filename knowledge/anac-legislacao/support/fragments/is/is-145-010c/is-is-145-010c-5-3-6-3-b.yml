section_id: 5.3.6.3
section_title: 'Os seguintes critérios devem ser considerados como regras de qualificação
  mínima para verificar se o instrutor é capacitado:'
subsection_id: b
cite: 5.3.6.3(b)
title: 5.3.6.3(b)
text: 'b) para assunto diretamente relacionado à manutenção de produto aeronáutico (aeronave,
  motor ou hélice, assim como seus componentes e partes) - o instrutor deve ser mecânico de
  manutenção aeronáutica (MMA) com habilitação correspondente ao tema a ser ministrado ou
  ter formação em engenharia com experiência comprovada no assunto a ser ministrado, e atender
  a um dos itens abaixo:

  I - ter recebido treinamento no produto aeronáutico em questão, no fabricante ou entidade
  certificada por este;

  II - ter recebido treinamento no produto aeronáutico em questão em instituição de ensino;

  III - ter recebido treinamento no produto aeronáutico em questão em organização de manutenção
  aprovada pela Anac conforme RBAC nº 145 ou operador aéreo certificado conforme RBAC nº 119;
  ou

  IV - ter experiência prática comprovada de no mínimo 3 anos, nos últimos 6 anos, em atividades
  de manutenção diretamente relacionadas ao produto aeronáutico no qual pretende ministrar
  o curso; e

  Nota: os treinamentos recebidos conforme itens I, II e III acima, realizados há mais de
  5 anos, não poderão ser aceitos caso o instrutor, durante esse período, não tenha exercido
  atividades profissionais relacionadas ao treinamento recebido. As atividades profissionais
  aqui mencionadas incluem: execução de manutenção, supervisão técnica e gerencial da manutenção
  e realização de treinamentos.'
