text: '5.3.6.3

  Atualizada lista com os critérios que devem ser considerados como regras de qualificação
  mínima para verificar se o instrutor é capacitado, com inclusão da possibilidade de ter
  recebido treinamento no produto aeronáutico em questão (item III da lista). Incluída nota
  explicativa quanto a treinamentos realizados há mais de 5 anos.'
