section_id: 5.3.6.3
section_title: 'Os seguintes critérios devem ser considerados como regras de qualificação
  mínima para verificar se o instrutor é capacitado:'
subsection_id: c
cite: 5.3.6.3(c)
title: 5.3.6.3(c)
text: 'c) para outros assuntos que não tratam diretamente da manutenção de produto aeronáutico
  o instrutor deve ter conhecimento adequado sobre o tema, comprovado por meio de:

  I - certificado de treinamento formal e tempo de experiência mínimo de 1 ano em atividade
  relacionada ao assunto; ou

  II - tempo de experiência mínimo de 3 anos em atividade relacionada ao assunto, na aviação
  civil.'
