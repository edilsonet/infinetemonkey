title: Qualificação de instrutores
text: '5.3.6 Qualificação de instrutores

  5.3.6.1 A OM deve estabelecer padrões básicos para qualquer instrutor, seja funcionário,
  alguém admitido temporariamente ou um instrutor externo que ministre um treinamento.'
