section_title: Medição da eficácia do treinamento
subsection_id: b
cite: 5.3.7(b)
title: 5.3.7(b)
text: 'b) a segunda é uma medição da eficácia na aplicação em tarefas reais do que foi aprendido.
  A OM deve medir essa parte avaliando o trabalho e determinando se, como resultado, produziu-se
  a competência aprendida no ambiente de trabalho real (por exemplo, por meio de uma demonstração
  da competência pelo Funcionário Técnico durante a execução de uma tarefa).

  5.3.7.2 O processo para medir a eficácia do treinamento deve estar relacionado ao processo
  para definir e atualizar os Requisitos de Treinamento, visto que lições e tarefas não bem
  aprendidas indicam necessidades de treinamento de reforço, repetição ou readequação do treinamento.'
