title: Medição da eficácia do treinamento
text: '5.3.7 Medição da eficácia do treinamento

  5.3.7.1 Para validar que os Funcionários Técnicos da OM são capazes de executar as tarefas
  designadas, o programa de treinamento deve ter um método para medir a eficácia do treinamento.
  Essa medição tem duas partes.'
