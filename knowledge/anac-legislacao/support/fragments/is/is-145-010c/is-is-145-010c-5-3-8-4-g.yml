section_title: 'Os registros de cada Funcionário Técnico devem conter, pelo menos:'
subsection_id: g
cite: 5.3.8.4(g)
title: 5.3.8.4(g)
text: 'g) lista de treinamentos cumpridos, com a inclusão de informações suficientes para
  determinar se o treinamento é aplicável à Competência do Funcionário Técnico para executar
  as tarefas a ele designadas:

  I - título ou descrição do curso;

  II - objetivo do curso;

  III - data de conclusão;

  IV - conteúdo programático;

  V - método de avaliação;

  VI - resultado da avaliação;

  VII - horas totais de treinamento;

  VIII - local do treinamento;

  IX - nome do instrutor;

  X - qualificações do instrutor que o certificam como detentor dos requisitos mínimos aceitáveis
  para dar o treinamento; e

  XI - assinatura do Funcionário Técnico;'
