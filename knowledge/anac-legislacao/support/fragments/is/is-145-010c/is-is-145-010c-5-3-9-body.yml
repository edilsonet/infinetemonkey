title: Interfaces com o programa de treinamento
text: '5.3.9 Interfaces com o programa de treinamento

  5.3.9.1 O parágrafo 145.163(b) do RBAC nº 145 requer que a OM assegure que cada pessoa que
  executa Função de Manutenção seja capaz de executá-las adequadamente. Uma das medidas para
  determinar a Competência é o treinamento que cada pessoa recebe. Quando os supervisores
  ou gerentes designam tarefas, eles devem ter um procedimento para verificar se a pessoa
  designada já demonstrou a Competência necessária para executar adequadamente o trabalho.
  Consequentemente, a OM deve definir claramente, na sua descrição do programa de treinamento,
  as interfaces entre as Competências individuais do Funcionário Técnico, seus registros de
  treinamento e o processo de planejamento da manutenção.'
