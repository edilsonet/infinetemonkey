text: 'APÊNDICE C - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO C

  ITEM

  ALTERADO

  ALTERAÇÃO

  Capítulo 1-Objetivo

  - Removida a aplicabilidade desta instrução suplementar para operadores aéreos, que deverão
  considerar a nova IS 119-010.

  - Removidos parágrafos não relacionados aos objetivos e realocados nas seções apropriadas.

  Capítulo 2-Revogação


  Atualizada r revogação.

  Capítulo 3 -Fundamentos


  - Atualizado o capítulo fundamentos para conformidade com padrão utilizado nas instruções
  suplementares atuais.

  - Removida aplicabilidade desta IS para operadores aéreos. Detalhada a aplicabilidade para
  organizações de manutenção conforme RBAC 145 item 145.163.'
