text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  3.5 A seção 145.163 do RBAC nº 145 estabelece os requisitos de treinamento para assegurar
  que cada pessoa designada para executar manutenção, manutenção preventiva ou alteração e
  funções de inspeção e de registro seja capaz de executar as tarefas a ela designadas; e
  a seção 145.165, os requisitos de treinamento em artigos perigosos para uma OM certificada.

  3.6 Conforme a seção 145.163, cada organização de manutenção certificada deve ter um programa
  de treinamento de pessoal, que consiste de treinamento inicial e recorrente.'
