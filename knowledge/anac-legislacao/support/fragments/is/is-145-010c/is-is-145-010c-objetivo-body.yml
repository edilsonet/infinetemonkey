title: OBJETIVO
text: 'OBJETIVO

  Esclarecer, detalhar e orientar a aplicação dos requisitos previstos no Regulamento Brasileiro
  da Aviação Civil - RBAC nº 145, aos detentores de certificado de organização de manutenção
  de produto aeronáutico - OM, descrevendo um meio aceitável, mas não único, para elaborar
  o programa de treinamento (PTM) para o pessoal de uma OM, tal como requerido pela seção
  145.163 do RBAC nº 145.'
