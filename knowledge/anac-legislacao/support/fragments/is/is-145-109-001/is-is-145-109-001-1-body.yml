title: OBJETIVO
text: '1. OBJETIVO

  1.1 Esta IS orienta, esclarece e estabelece critérios aceitáveis, mas não únicos, no desenvolvi-

  mento de processos para a obtenção e controle de publicações técnicas por organizações de

  manutenção de produto aeronáutico - OM, essenciais para a execução de manutenção, ma-

  nutenção preventiva e alterações de acordo com os regulamentos aplicáveis.

  NOTA 1 - Um meio ou procedimento alternativo ao apresentado nesta IS, desde que devi-

  damente justificado, pode ser utilizado, exigindo-se, nesse caso, a análise e concordância

  expressa do órgão competente da ANAC. O meio ou procedimento alternativo mencionado

  deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável

  ou concretizar o objetivo do procedimento normatizado nesta IS.

  NOTA 2 - Embora esta IS seja voltada ao assunto publicações técnicas no âmbito de OMs,

  as orientações, esclarecimentos e critérios estabelecidos por esta instrução também podem

  ser utilizados, quando aplicável, a todas as pessoas que executam manutenção, manutenção

  preventiva e alterações sob as regras do RBAC 43.

  1.2 Esta IS também estabelece e esclarece a utilização do termo “publicações técnicas”,
  uma vez

  que esses documentos podem ter denominações diversas entre os detentores de projeto de

  tipo.'
