text: '5.1.1 Os requisitos estabelecem que nos manuais da OM estejam descritos os procedimentos
  para

  a obtenção, atualização e controle das publicações técnicas - PT, se esses documentos são

  obtidos, atualizados e controlados pela OM. As questões mais comuns a serem abordadas

  são: Como se obtém acesso às publicações técnicas? Como é feito o acesso? Quem será a

  pessoa responsável pelo acesso e manipulação de tais informações, tais como pesquisa,

  download (ou outras formas de obtenção), controle e atualização sistemática das PT que

  afetam os produtos listados na Especificação Operativa - EO e/ou Lista de Capacidade -

  LC? Como será registrado que a consulta foi realizada? Quais as ações após a consulta?'
