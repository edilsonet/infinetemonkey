text: '5.1.2 O pessoal de manutenção deve ser capaz de ler e entender o(s) idioma(s) em que
  são apre-

  sentadas as publicações técnicas (português, inglês e/ou francês são os idiomas mais co-

  muns). É previsto que o programa de treinamento das empresas aéreas e das OM descreva

  os requisitos de treinamento necessários para assegurar que cada pessoa designada para exe-

  cutar manutenção, manutenção preventiva ou alteração e funções de inspeção e de registro

  seja capaz de executar as tarefas a ela designadas.

  5.2 Proprietário das publicações técnicas'
