title: O detentor de um projeto aprovado, incluindo tanto um certificado de tipo ou um certificado
text: '5.2.1 O detentor de um projeto aprovado, incluindo tanto um certificado de tipo ou
  um certificado

  suplementar de tipo (CST) de uma aeronave, motor ou hélice é obrigado pelo RBAC 21,

  seção 21.50, parágrafo (b), a fornecer pelo menos um conjunto completo das instruções para

  aeronavegabilidade continuada para o proprietário de cada aeronave, cada motor ou cada

  hélice, quando de sua entrega ou quando da emissão do primeiro certificado de aeronavega-

  bilidade padrão para a aeronave envolvida, o que ocorrer depois. Isto geralmente é feito

  através da publicação de um conjunto de publicações técnicas associadas ao projeto. Uma

  vez protegidas por direitos autorais, as referidas publicações técnicas devem ter observadas

  suas reprodução e comercialização, da forma como definido pelo fabricante.'
