text: '5.3.1 Os operadores de um produto aeronáutico devem obter as DAs (incluindo as Diretrizes
  de

  Aeronavegabilidade de Emergência - DAE) emitidas para produtos aeronáuticos nacionais

  e importados que operam para atendimento aos requisitos aplicáveis do RBAC 39, conforme

  estabelece os parágrafos 91.403(a) do RBHA 91, 121.363(a)(1) e 121.380(a)(2)(v) do RBAC

  121, e 135.413(a) e 135.439(a)(2)(v) do RBAC 135. As OMs certificadas pelo RBAC 145

  também devem manter atualizadas e acessíveis as diretrizes de aeronavegabilidade emitidas

  paras os produtos listados em suas Especificações Operativas para atendimento ao RBAC

  39, conforme estabelece o parágrafo 145.109(d)(1) do RBAC 145.'
