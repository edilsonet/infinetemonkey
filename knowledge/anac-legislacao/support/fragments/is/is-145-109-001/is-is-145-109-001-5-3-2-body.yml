text: '5.3.2 Devido à criticidade dos assuntos tratados nas DAs e sua direta relação com a
  operação

  segura dos produtos aeronáuticos, a metodologia de obtenção das DAs emitidas tanto pela

  ANAC quanto pelas Autoridades Primárias dos produtos aeronáuticos registrados no Brasil,

  deve ser realizada por meio de um método eficaz e expedito, tão rápido e eficiente quanto
  à

  metodologia empregada pela AAC emitente da diretriz para torná-la disponível ao público

  requerido. Isso é especialmente importante para o caso das DAE, que podem oferecer um

  impacto imediato no produto aeronáutico aplicável;'
