title: As Diretrizes (inclusive as de emergência) emitidas por outras AAC (autoridades primárias)
text: '5.3.4 As Diretrizes (inclusive as de emergência) emitidas por outras AAC (autoridades
  primárias)

  para produtos registrados no Brasil também podem ser obtidas diretamente nos sites dessas

  autoridades. Para auxiliar os proprietários/operadores na sua obtenção, atualização e con-

  trole, a ANAC disponibiliza em sua página web o caminho para o endereço eletrônico de

  diversas autoridades;'
