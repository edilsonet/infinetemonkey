title: Caso o operador, proprietário ou OM, não possua acesso à internet, especial atenção
  deve
text: '5.3.5 Caso o operador, proprietário ou OM, não possua acesso à internet, especial atenção
  deve

  ser dada à metodologia de obtenção das DAE, uma vez que o método alternativo para sua

  obtenção deve ser eficaz, expedito e aplicável a todas as AAC responsáveis pelos produtos

  no qual operam ou constam listados em suas EO, de forma a não afetar a segurança de voo;'
