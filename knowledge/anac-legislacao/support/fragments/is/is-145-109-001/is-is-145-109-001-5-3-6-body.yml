title: Nos casos em que o proprietário/operador contrate uma OM para realizar manutenção em
text: '5.3.6 Nos casos em que o proprietário/operador contrate uma OM para realizar manutenção
  em

  sua aeronave, é de responsabilidade do operador definir quais diretrizes devem ser aplicadas

  à aeronave quando esta for executar manutenção, manutenção preventiva e alterações.

  NOTA 1 - Uma OM não é responsável por controlar ou verificar o status de cumprimento

  de Diretrizes nas aeronaves em que fazem manutenção, sendo esta responsabilidade de seus

  operadores.

  5.4 Aspectos de obtenção, atualização e controle de publicações técnicas'
