title: O operador, ou OM, que emprega em sua organização métodos remotos de acesso às PT (por
text: '5.4.3 O operador, ou OM, que emprega em sua organização métodos remotos de acesso às
  PT (por

  exemplo: uma biblioteca eletrônica, ou um acesso centralizado às PT atualizadas via termi-

  nais remotos por rede/intranet) necessita desenvolver métodos que garantam a forma segura,

  acessível e atualizada de disponibilizá-las a quem é requerido acessá-las;'
