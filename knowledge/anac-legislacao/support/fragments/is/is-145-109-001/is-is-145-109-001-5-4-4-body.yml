  as
text: '5.4.4 Para a manutenção de aeronaves, um proprietário/operador de uma aeronave pode
  ceder as

  PT das quais seja proprietário às OM para que seja realizada a manutenção, manutenção

  preventiva e alterações em sua aeronave. A seção 145.109(a) do RBAC 145 estabelece que

  é necessário haver uma autorização ou contrato de uso exclusivo entre a OM e o proprietá-

  rio/operador da aeronave. A OM só pode manter os produtos de quem cedeu as publicações

  técnicas, ou seja, não pode utilizar as publicações técnicas para manter aeronaves de tercei-

  ros;

  NOTA 1 - A OM deve garantir que, ao utilizar as publicações técnicas do operador/propri-

  etário, do artigo para o qual irá executar manutenção, manutenção preventiva ou alteração,

  elas estejam disponíveis no momento em que o serviço for executado e na última revisão

  disponibilizada pelo detentor do projeto de tipo ou fabricante (considerando o prazo defi-

  nido no parágrafo 5.4.2 desta IS). Um contrato entre a OM e o operador para o forneci-

  mento de publicações técnicas é aceitável como forma de garantia de disponibilidade.'
