title: A OM que executa manutenção, manutenção preventiva ou alterações seja em aeronaves,
text: '5.4.5 A OM que executa manutenção, manutenção preventiva ou alterações seja em aeronaves,

  motores, hélices, e/ou equipamentos (componentes) necessita requerer acesso às publicações

  técnicas relacionadas a cada artigo listado em suas Especificações Operativas - EO ou Lista

  de Capacidade - LC, respeitando os serviços autorizados e limitações listadas nesses docu-

  mentos (geralmente, manuais de reparo - Shop & Overhaul Manual - OHM e/ou de manu-

  tenção de componentes - Component Maintenance Manual - CMM);'
