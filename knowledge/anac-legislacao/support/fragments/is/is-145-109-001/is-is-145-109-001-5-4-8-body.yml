title: A ANAC recomenda que, antes de se oferecer para realizar a manutenção, manutenção pre-
text: '5.4.8 A ANAC recomenda que, antes de se oferecer para realizar a manutenção, manutenção
  pre-

  ventiva e alterações em um artigo, a OM verifique se estão disponíveis as ICAs/DTs atuali-

  zadas. Questões puramente comerciais entre a OM e o detentor do projeto de tipo ou fabri-

  cante não são objeto de atuação da ANAC. A ANAC não intercede junto às demais AACs

  na tentativa de obter, para uma OM interessada, acesso às ICAs/DTs que um detentor do

  projeto de tipo, fabricante ou seu autorizado não tenha disponibilizado.'
