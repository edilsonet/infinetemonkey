  cações técnicas e não possui informação da última revisão deve manter a última revisão

  disponibilizada pelo detentor do projeto de tipo ou fabricante. Além disso, a OM deve con-

  tinuar com a atualização da publicação técnica, no sentido de verificar se ela continua
  em

  vigor, ou seja, se não foi revogada, por exemplo, por uma diretriz de aeronavegabilidade.

