title: Toda PT é produzida com foco em um modelo de artigo ou uma família de modelos de um
text: '5.5.1 Toda PT é produzida com foco em um modelo de artigo ou uma família de modelos
  de um

  artigo. Isto quer dizer que toda publicação técnica possui atrelada a si uma aplicabilidade

  que define quais artigos foram considerados pelo fabricante no momento de confeccioná-la.

  Dessa forma, algumas publicações técnicas são emitidas com aplicabilidade a apenas um

  modelo de artigo; outras podem conter diversos modelos de uma mesma família de artigos;

  podem ser emitidas para um conjunto específico de artigos, identificados pelo seu número

  de série; ou até serem emitidas para um único artigo identificado pelo seu número de série.'
