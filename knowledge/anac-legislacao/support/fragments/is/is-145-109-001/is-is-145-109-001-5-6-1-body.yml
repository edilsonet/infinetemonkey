title: As seções 145.153, 145.155 e 145.157 do RBAC 145 requerem que as pessoas que utilizam
text: '5.6.1 As seções 145.153, 145.155 e 145.157 do RBAC 145 requerem que as pessoas que
  utilizam

  ou que precisam ter acesso ao conteúdo de cada publicação técnica sejam capazes de ler e

  entender o idioma no qual estas lhes são disponibilizadas. Isto não quer dizer necessaria-

  mente que os mecânicos, inspetores e demais pessoas envolvidas na manutenção tenham que

  ser fluentes em todas as línguas nas quais as PT são publicadas, mas sim que é permitido

  que a empresa/organização desenvolva um sistema de acesso às informações necessárias à

  manutenção que esteja em um idioma no qual o pessoal que precisa acessá-las seja profici-

  ente.'
