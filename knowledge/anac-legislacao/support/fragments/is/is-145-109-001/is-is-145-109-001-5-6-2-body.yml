text: '5.6.2 A tradução das PTs (ou de parte delas) para o português, por exemplo, é aceitável
  desde que

  se garanta que a tradução respeitou os termos técnicos presentes no original e que nenhuma

  modificação nos procedimentos ou interpretação destes foi alterada. Isto pode ser obtido,
  por

  exemplo, por meio da avaliação da publicação traduzida por pessoa técnica proficiente no

  idioma original da PT. Este procedimento, ou outro similar que seja desenvolvido e utilizadoData
  de emissão: 16 de junho de 2017. IS Nº 145.109-001

  Revisão C

  por uma OM, deve estar descrito no Manual da Organização de Manutenção, incluindo a

  identificação da pessoa responsável pela avaliação da tradução.

  5.7 Classificação, guarda, atualização, recolhimento e descarte das publicações técnicas

  5.8 É previsto que os manuais da OM descrevam os procedimentos para o recolhimento, classi-

  ficação, guarda e descarte (quando obsoleta) de toda PT. Publicações técnicas desatualizadas

  (com ressalva à situação descrita no parágrafo 5.4.2) ou cópias não controladas pela OM
  não

  devem estar acessíveis ao pessoal responsável pela manutenção, para evitar a utilização
  de

  procedimentos obsoletos ou dados desatualizados na execução da manutenção, manutenção

  preventiva ou alteração.'
