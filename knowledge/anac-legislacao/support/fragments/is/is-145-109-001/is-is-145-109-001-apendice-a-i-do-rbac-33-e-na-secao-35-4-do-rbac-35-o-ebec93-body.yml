text: 'Apêndice A-I do RBAC 33 e na seção 35.4 do RBAC 35 (O Apêndice B desta IS contém

  alguns exemplos de ICA);Data de emissão: 16 de junho de 2017. IS Nº 145.109-001

  Revisão C

  3.3 Os parágrafos 91.403(a) do RBAC 91, 121.363(a)(1), 121.380(a)(2)(v) e 121.709(b)(2)(ii)

  do RBAC 121, e 135.413(a), 135.439(a)(2)(v) e 135.443(b)(2)(ii) do RBAC 135 estabele-

  cem que o proprietário ou o operador de uma aeronave é primariamente o responsável pela

  conservação dessa aeronave em condições aeronavegáveis, incluindo o atendimento aos re-

  quisitos aplicáveis do RBAC 39;

  3.4 Os regulamentos operacionais, seções 135.412 do RBAC 135 e 121.362 do RBAC 121 es-

  tabelecem as condições especiais relativas à manutenção, tomando os requisitos do RBAC

  145 como referência;

  3.5 O parágrafo 137.203(a) da RBAC 137 estabelece que a manutenção das aeronaves engajadas

  nas operações aeroagrícolas deve ser executada de acordo com os requisitos dos RBAC 43

  e 145, bem como da subparte E do RBHA 91, ou disposições correspondentes do RBAC que

  venha a substituí-lo;

  3.6 O parágrafo 145.209(m)-I do RBAC 145 estabelece requisitos de procedimentos de recebi-

  mento, acesso, emenda e distribuição dentro da OM, de todos os dados de aeronavegabili-

  dade necessários, oriundos da ANAC e do detentor do projeto de tipo ou fabricante do artigo;

  3.7 O parágrafo 145.109(d) do RBAC 145 estabelece que cada OM deve possuir, quando apli-

  cável, a assinatura ou autorização de uso por parte do proprietário da documentação técnica.

  Estabelece também os seguintes documentos e dados técnicos que devem ser mantidos atu-

  alizados e acessíveis, quando o trabalho de manutenção, manutenção preventiva e alteração

  estiver sendo executado:'
