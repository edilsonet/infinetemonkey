text: 'a) Informações de escalamento de manutenção para cada parte da aeronave, motores, APU,

  hélices, acessórios, instrumentos e demais equipamentos que forneçam os períodos reco-

  mendados nos quais estes devem ser limpos, inspecionados, ajustados, testados e lubrifi-

  cados e forneçam o nível de complexidade das inspeções, as tolerâncias no desgaste e os

  retrabalhos recomendados nesses escalamentos;'
