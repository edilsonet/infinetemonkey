text: 'd) Outras instruções gerais que incluam procedimentos de teste durante o funcionamento
  de

  motores no solo, cheques de simetria, pesagem, determinação do centro de gravidade,

  macaqueamento, amarração ao solo e limitações de armazenagem em hangar.

  B3. Diagramas e painéis de acesso às partes estruturais necessárias a serem inspecionadas,
  e como

  ganhar acesso a essas partes quando painéis não são fornecidos;

  B4. Detalhamento das técnicas especiais de inspeção, incluindo os ensaios não destrutivos;

  B5. Informações necessárias de como aplicar tratamento de proteção à estrutura após as inspeções;

  B6. Informações relativa aos fixadores estruturais, tais como identificação, recomendações
  de des-

  carte, e valores de torque.

  B7. Lista de ferramentas especiais requeridas à manutenção;

  B8. Para aeronaves turboélices, adicionalmente:'
