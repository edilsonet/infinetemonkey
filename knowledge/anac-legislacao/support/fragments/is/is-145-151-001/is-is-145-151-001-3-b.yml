cite: 3(b)
title: 3(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS apresenta meios aceitáveis de cumprimento para os seguintes requisitos da seção
  145.151 e do Apêndice A-I do RBAC nº 145.

  3.6 Segundo o parágrafo 145.151(a)-II do RBAC nº145, cada organização de manutenção certificada
  localizada no Brasil deve prover o cadastramento de pelo menos um RT vinculado a ela, o
  qual poderá representar tecnicamente o Gestor Responsável perante a Anac.

  3.7 E, de acordo com o Apêndice A-I do RBAC nº 145, para que um RT regularmente registrado
  pelo conselho de fiscalização da profissão seja cadastrado na Anac, ele deve possuir título
  e atribuição profissional coerentes com a atividade desempenhada e atender a requisitos
  adicionais, que incluem experiência e conhecimentos adequados, conforme o requisito em questão.'
