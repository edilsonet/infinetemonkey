cite: 5.1.1
title: O RT assume a responsabilidade técnica pela manutenção de artigos realizada pela organização
  de manutenção.
text: '5.1.1 O RT assume a responsabilidade técnica pela manutenção de artigos realizada pela
  organização de manutenção.

  5.1.2 É importante ressaltar que não é requerido que o profissional exerça efetivamente
  o cargo de diretor de manutenção, mas a função de direção de manutenção. Para tanto, o RT
  deve ocupar uma posição suficientemente alta na estrutura organizacional que permita que
  ele possa se responsabilizar tecnicamente pelos serviços realizados pela organização de
  manutenção. Por exemplo, o RT deve estar hierarquicamente acima (ou até no mesmo nível no
  caso de empresas com estruturas organizacionais simplificadas) do pessoal que é responsável
  ou que executa a manutenção, pessoal de supervisão, pessoal de inspeção e pessoal que aprova
  para retorno ao serviço.'
