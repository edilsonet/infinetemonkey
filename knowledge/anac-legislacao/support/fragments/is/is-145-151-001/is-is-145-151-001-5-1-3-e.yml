section_title: 'É responsabilidade do profissional investido no cargo de RT:'
subsection_id: e
cite: 5.1.3(e)
title: 5.1.3(e)
text: e) assegurar que exista número suficiente de pessoal com vínculo contratual com treinamento
  ou conhecimento, e experiência na execução da manutenção, manutenção preventiva ou alteração,
  conforme autorizada no certificado de organização de manutenção e respectivas especificações
  operativas, para assegurar que todo serviço seja executado de acordo com o RBAC n° 43;
