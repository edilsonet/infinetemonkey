section_title: 'É responsabilidade do profissional investido no cargo de RT:'
subsection_id: h
cite: 5.1.3(h)
title: 5.1.3(h)
text: h) assegurar que todos os equipamentos e ferramentas de teste e inspeção (que sejam
  de propriedade da organização ou não) utilizados para a determinação de aeronavegabilidade
  de um artigo sejam periodicamente avaliados, mantidos e, quando aplicável, calibrados de
  acordo com as instruções do fabricante do equipamento, conforme requerido pelo RBAC nº 145;
