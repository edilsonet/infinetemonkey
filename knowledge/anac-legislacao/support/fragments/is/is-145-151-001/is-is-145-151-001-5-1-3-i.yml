section_title: 'É responsabilidade do profissional investido no cargo de RT:'
subsection_id: i
cite: 5.1.3(i)
title: 5.1.3(i)
text: i) possuir domínio dos requisitos brasileiros de aviação civil aplicáveis à manutenção
  e às organizações de manutenção. Caso a organização de manutenção execute serviços em produtos
  aeronáuticos aplicáveis às empresas aéreas certificadas que operam segundo os RBAC nº 135
  e 121, também deverá ter domínio dos requisitos relacionados à aeronavegabilidade continuada
  desses regulamentos;
