section_title: 'É responsabilidade do profissional investido no cargo de RT:'
subsection_id: m
cite: 5.1.3(m)
title: 5.1.3(m)
text: 'm) atuar perante a Agência como representante técnico da organização de manutenção
  no tratamento das questões afetas à aeronavegabilidade, sendo o responsável final pelo acompanhamento
  das atividades de certificação e fiscalização realizadas pela Anac bem como pela apresentação
  tempestiva e implementação efetiva dos planos de ações corretivas elaboradas como resposta
  às não conformidades identificadas pela agência.

  5.1.4 Dependendo do porte e complexidade das empresas em que atua é possível que o RT delegue
  a execução de funções a outras pessoas dentro da estrutura da empresa. Contudo, ele permanece
  com a responsabilidade técnica final pelas atividades da organização de manutenção.

  5.2 Critérios de elegibilidade

  5.2.1 Para que um RT seja aceito para cadastramento na Anac, em conformidade com a seção
  145.151 e o Apêndice A-I do RBAC nº 145, deve atender aos seguintes critérios de elegibilidade:'
