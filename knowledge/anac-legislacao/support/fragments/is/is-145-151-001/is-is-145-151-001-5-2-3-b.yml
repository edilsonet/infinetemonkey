section_id: 5.2.3
section_title: É importante ressaltar que essa tabela não representa o único meio de cumprimento
  aceitável pela Anac, conforme o art. 14 da Resolução no 30, de 2008.
subsection_id: b
cite: 5.2.3(b)
title: 5.2.3(b)
text: 'b) responsável no conselho pela atividade de manutenção de aeronaves.

  Nota: normalmente essas informações constam da CRPJ e do registro de atribuições do RT no
  conselho, porém, como o conteúdo da CRPJ não é necessariamente uniforme entre conselhos
  regionais diferentes, podem ser necessários outros documentos, inclusive declaração do conselho
  complementando as informações necessárias. Exemplos de atribuições típicas compatíveis são
  apresentados no Apêndice B.

  5.4 Limitações de cadastramento

  5.4.1 O profissional a ser cadastrado como RT, conforme previsto nesta IS, poderá ser cadastrado
  em mais de uma empresa, desde que seja comprovada compatibilidade de tempo para a sua atuação.
  Além do cadastro como RT de organização de manutenção, o mesmo profissional pode atuar,
  p.ex., em empresas que operam segundo os RBAC nº 91, ou RBAC nº 135, nas várias modalidades
  de cadastramento, ou seja, Diretor de Manutenção ou Mecânico de Manutenção Aeronáutica -
  MMA autônomo, para realizar manutenção conforme previsto no RBAC nº 43, desde que registrado
  para a mesma atividade pelo respectivo conselho de fiscalização da profissão, se aplicável.

  Nota: a Anac pode considerar, para empresas regidas pelo RBAC nº 121, que o Diretor ou Gerente
  de Manutenção deva ter dedicação exclusiva naquela empresa (vide IS nº 119-001). Entretanto,
  caso o tamanho e complexidade da empresa permita, a Anac pode aceitar que se acumule também
  a função de RT, ou seja, um mesmo profissional assuma um cargo na empresa que satisfaça
  as funções requeridas de Diretor ou Gerente de Manutenção segundo o RBAC nº 119 e Responsável
  Técnico segundo o RBAC nº 145.

  5.4.2 De acordo com o parágrafo A145.1(g)(3) do Apêndice A-I do RBAC nº 145, a Anac deverá,
  ainda, ao analisar a solicitação de cadastramento, avaliar se o profissional terá condições
  de ser cadastrado como RT em mais de uma organização, em função da quantidade, da complexidade
  dos serviços realizados pelas organizações de manutenção e empresas e, também, da área geográfica
  de atuação do profissional a ser credenciado.

  5.4.3 Com o objetivo da melhoria contínua da segurança operacional e manutenção da qualidade
  dos serviços realizados em artigos, nenhum dos profissionais a ser cadastrado como RT, conforme
  previsto nesta IS, poderá ser cadastrado em mais de 3 (três) organizações.

  Nota 1: o número máximo de 3 (três) organizações, que a Anac usa como critério de aceitação
  de cadastramento de RT é com base na sua experiência na supervisão continuada das organizações
  de manutenção e no artigo 18 da Resolução nº 336 de 27 de outubro de 1989, do CONFEA, que
  afirma que é possível que um RT se responsabilize por até 03 (três) pessoas jurídicas, em
  casos excepcionais, desde que haja compatibilização de tempo e área de atuação.

  Nota 2: para empresas que acumulem a prerrogativa de operador aéreo segundo o RBAC nº 121
  ou 135 e de organização de manutenção de artigos segundo o RBAC nº 145, o RT poderá ser
  a mesma pessoa que o Diretor ou Gerente de Manutenção, desde que sejam respeitados os limites
  definidos pelo conselho de fiscalização da profissão e atendidos os requisitos do RBAC nº
  145 e do regulamento operacional.

  5.4.4 Conforme previsto no parágrafo 145.151(a)-IV do RBAC nº 145, as organizações de manutenção
  localizadas fora do Brasil devem designar pessoa de forma a assegurar um nível de segurança
  equivalente ao provido pelo RT nas organizações de manutenção nacionais. O detalhamento
  dos critérios para tal designação se encontram na IS nº 145-002.

  5.4.5 Conforme prevê o parágrafo 145.151(a)-V do RBAC nº 145, a Anac poderá, a qualquer
  tempo, não aceitar um pedido de cadastramento de RT ou ainda revogar um cadastramento já
  autorizado nos casos de comprovado histórico de conduta ou desempenho inadequados do profissional.

  Nota: com respeito ao histórico de conduta ou desempenho dos profissionais citados neste
  item, as referências às sanções administrativas capituladas no art. 299, incisos I, V, VI
  ou VII, da Lei nº 7.565, de 19 de dezembro de 1986 (CBAer), presentes no parágrafo 145.151(a)-V(2)(ii)
  do RBAC nº 145, se referem a enquadramentos de infrações como "procedimento ou prática,
  no exercício das funções, que revelem falta de idoneidade profissional para o exercício
  das prerrogativas dos certificados de habilitação técnica", "fornecimento de dados, informações
  ou estatísticas inexatas ou adulteradas", "recusa de exibição de livros, documentos contábeis,
  informações ou estatísticas aos agentes da fiscalização" ou "prática reiterada de infrações
  graves", ainda que, em razão da inclusão do §3º do art. 288 do CBAer, promovida pela Lei
  nº 14.368/2022, atualmente o art. 299 não se aplique às atribuições da Anac.

  5.5 Não cumprimento com as atribuições e responsabilidades do Responsável Técnico

  5.5.1 Caso a Anac constate que o RT não está cumprindo com suas atribuições e responsabilidades
  poderá atuar sobre a certificação da organização de manutenção da forma prevista no parágrafo
  145.55(e)-I do RBAC nº 145.

  5.6 Descadastramento

  5.6.1 Conforme prevê o parágrafo 145.161(c)-I do RBAC nº 145, caso o profissional perca
  o vínculo com a empresa, deverá comunicar sua desvinculação à Anac em até 10 dias úteis.
  Neste caso, a organização de manutenção terá o prazo regulamentar de 30 (trinta) dias, a
  contar da ciência da desvinculação do profissional, para solicitar à Anac o cadastramento
  de novo RT que atenda ao RBAC nº 145, estando sujeita à suspensão do COM caso descumpra
  o prazo.

  5.6.2 Adicionalmente, em casos de ausência de um RT, conforme prazo regulamentar previsto,
  a OM deve estabelecer procedimentos específicos que garantam a correta execução dos trabalhos
  e manutenção do seu sistema de controle da qualidade, previsto na seção 145.211 do RBAC
  nº 145, para as situações que demandam supervisão ou atuação direta do Responsável Técnico.
  A Anac poderá solicitar a apresentação desses procedimentos a qualquer tempo.'
