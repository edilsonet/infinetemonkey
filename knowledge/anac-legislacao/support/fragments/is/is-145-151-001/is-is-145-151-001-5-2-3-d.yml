section_title: É importante ressaltar que essa tabela não representa o único meio de cumprimento
  aceitável pela Anac, conforme o art. 14 da Resolução no 30, de 2008.
subsection_id: d
cite: 5.2.3(d)
title: 5.2.3(d)
text: d) cópia do contrato de trabalho entre o RT e a organização da manutenção ou comprovação
  do vínculo contratual, de acordo com a legislação trabalhista em vigor, caso aplicável,
  ou cópia do contrato social ou ato constitutivo da organização de manutenção que demonstre
  que o profissional é sócio ou proprietário da mesma;
