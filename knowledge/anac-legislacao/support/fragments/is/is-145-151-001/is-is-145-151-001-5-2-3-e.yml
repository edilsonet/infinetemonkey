title: 5.2.3(e)
text: e) cópia de documentos de comprovação de curso em pelo menos um dos artigos mais complexos
  incluídos no certificado da organização de manutenção e suas especificações operativas,
  ou experiência prática compatível com os tipos de serviços de manutenção relacionados ao
  certificado e especificações operativas da organização de manutenção, conforme aceito pela
  Anac;
