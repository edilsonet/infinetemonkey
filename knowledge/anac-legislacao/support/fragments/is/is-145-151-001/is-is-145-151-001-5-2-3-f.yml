section_title: É importante ressaltar que essa tabela não representa o único meio de cumprimento
  aceitável pela Anac, conforme o art. 14 da Resolução no 30, de 2008.
subsection_id: f
cite: 5.2.3(f)
title: 5.2.3(f)
text: 'f) cópia de documentos para comprovação de pelo menos 3 (três) anos de experiência,
  dentro dos últimos 6 anos, em atividades profissionais relacionadas à manutenção de artigos;
  e

  Nota 1: para o cumprimento do requisito da "experiência em atividades profissionais relacionadas
  à manutenção de produtos aeronáuticos" pode ser considerada, não apenas a experiência em
  organizações de manutenção certificadas pelo RBAC nº 145 ou em operadores aéreos certificados
  segundo os RBAC nº 121 ou 135, mas também experiência em atividades de manutenção como MMA
  autônomo e em outras empresas, com funções relacionadas, como projeto de tipo, certificado
  suplementar de tipo, controle de qualidade em manutenção, atividades de manutenção nas forças
  armadas, etc.

  Nota 2: independentemente da empresa em que a experiência tenha sido adquirida, essa experiência
  deve estar relacionada à manutenção de produtos aeronáuticos. Por exemplo, não serão considerados
  como experiência relacionada à manutenção de produtos aeronáuticos: estágios curriculares,
  atividades administrativas, atividades exercidas em almoxarifado e ferramentaria de organizações
  de manutenção ou operadores aéreos.'
