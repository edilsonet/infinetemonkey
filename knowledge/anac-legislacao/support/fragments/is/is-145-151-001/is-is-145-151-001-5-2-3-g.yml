section_title: É importante ressaltar que essa tabela não representa o único meio de cumprimento
  aceitável pela Anac, conforme o art. 14 da Resolução no 30, de 2008.
subsection_id: g
cite: 5.2.3(g)
title: 5.2.3(g)
text: 'g) caso pretenda atuar em mais de uma empresa, demonstração de compatibilidade de tempo
  e área geográfica de atuação. O profissional deve enviar à Anac a proposta de como pretende
  conciliar as cargas horárias nas respectivas empresas, incluindo os traslados quando elas
  não forem localizadas na mesma cidade. A comprovação da compatibilidade de tempo para a
  atuação pode ser feita enviando à Anac cópias dos contratos de trabalho nos quais conste
  a carga horária em cada empresa.

  5.3.2 A OM requerente deve ainda estar registrada no respectivo conselho de fiscalização
  da profissão de seu RT para exercer a atividade de manutenção de aeronaves e comprovar que
  possui ao menos um RT:'
