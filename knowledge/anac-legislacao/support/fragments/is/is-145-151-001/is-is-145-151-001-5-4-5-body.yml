title: 5.4.5
text: '5.4.5

  Criado o item 5.4.5 e Nota específica com informações relativas à prerrogativa de a Anac
  não aceitar ou revogar um cadastramento de RT quando comprovado histórico de conduta ou
  desempenho inadequado do profissional, nos termos do parágrafo 145.151(a)-V do RBAC nº 145.

  5.6

  Criado o item 5.6 com as informações sobre o descadastramento do RT e da necessidade de
  a OM estabelecer procedimentos específicos nos casos de ausência desse profissional.'
