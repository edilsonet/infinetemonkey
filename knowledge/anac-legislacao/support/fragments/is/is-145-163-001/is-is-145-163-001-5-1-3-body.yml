text: '5.1.3

  Esclarecido que o programa de treinamento deve ser constituído pelas etapas de qualificação
  e etapa de autorização. Adicionalmente, incluídos esclarecimentos sobre qualificação e autorização.

  5.1.17

  Substituição do RBHA 65 pelo RBAC nº 65.'
