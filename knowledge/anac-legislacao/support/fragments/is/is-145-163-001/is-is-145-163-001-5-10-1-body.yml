title: 5.10.1
text: '5.10.1

  Explicitado que pessoas qualificadas no Nível 1 podem realizar END somente sob supervisão
  de profissional qualificado e autorizado no Nível 2 ou 3 no método, para coerência com o
  (*) do parágrafo 5.6.2

  5.10.4 Esclarecido que profissional qualificado e autorizado nos níveis 2 e 3 é aceito como
  meio de cumprimento com os requisitos aplicáveis do RBAC nº 43 e RBAC nº 145 como o executante
  do serviço, em relação às tarefas END.'
