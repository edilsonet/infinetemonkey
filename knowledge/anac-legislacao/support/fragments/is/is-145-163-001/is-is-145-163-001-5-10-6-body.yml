text: '5.10.6

  Feita correção sobre o processo de OJT indicando que o cumprimento é em duas fases: supervisão
  "contínua e direta" e sob supervisão "contínua".

  5.10.11, 5.10.13, 5.10.15

  Correção ortográfica.

  5.10.16

  Removida referência à AC 120-016, porque é uma referência incorreta para exemplo.

  5.12

  Substituição do RBHA 65 pelo RBAC nº 65.

  7.3

  Exclusão.'
