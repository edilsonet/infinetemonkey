text: 'APÊNDICE A - SUGESTÃO DE CONTEÚDO MÍNIMO RECOMENDADO DOS CURSOS DE QUALIFICAÇÃO

  A1. SUGESTÃO DE CONTEÚDO MÍNIMO DOS CURSOS DE QUALIFICAÇÃO

  Esta orientação, por método, é uma sugestão da ANAC para orientar o profissional qualificado
  no Nível 3 Responsável na elaboração da grade mínima dos cursos de qualificação, ou para
  a avaliação de cursos oferecidos por terceiros. Como esperado, cada método consiste de aulas
  de instrução básica, demonstrações práticas para assegurar completa compreensão do método.

  NOTA - os cursos devem ser montados visando os produtos aeronáuticos constantes nas especificações
  operativas da Organização de Manutenção, e com base em suas características gerais, modos
  de falha previstos e demais informações dos manuais de serviço destes.

  A2. CURSO DE OPERAÇÃO DO EQUIPAMENTO DE RADIOGRAFIA E INSTRUÇÕES DE EMERGÊNCIA

  NOTA 1 - o estagiário deve possuir qualificação em radioproteção industrial ou ser treinado
  em radioproteção industrial em organização ou instituição reconhecida pela CNEN e obter
  a qualificação CNEN, ANTES de executar serviços de radiografia. Esta parte do treinamento
  NÃO é regulada pela ANAC.

  NOTA 2 - os tópicos indicados por (*) podem ser excluídos se as radiografias são feitas
  apenas com equipamentos geradores de Raios X.

  NOTA 3 - as horas de treinamento para radiografia podem ser reduzidas a um total de 40h
  se o estagiário não usará métodos que empreguem radioisótopos. Se o estagiário usará radioisótopos,
  haverá um adicional de 40h de teoria do emprego e prática com radioisótopos.'
