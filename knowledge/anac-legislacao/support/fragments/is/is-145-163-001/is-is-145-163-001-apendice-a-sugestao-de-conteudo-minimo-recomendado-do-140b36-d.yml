text: 'd) Tipos de radiação

  (1) Propriedades da radiação corpuscular: alpha, beta, nêutron;

  (2) Radiação eletromagnética: Raios X, Raios Gama;

  (3) Produção dos Raios X;

  (4) Produção dos Raios Gama;

  (5) Energia dos Raios Gama;

  (6) Energia característica de fontes seladas comuns; e

  (7)Energia característica de equipamentos de Raios X.'
