text: 'f) Efeitos Biológicos da Radiação

  (1) Radiação natural;

  (2) A unidade de dose de radiação - REM;

  (3) A diferença entre radiação e contaminação;

  (4) Limites permitidos de exposição pessoal e o conceito estocástico;

  (5) Teoria da dose admissível;

  (6) Danos por radiações - conceito de recuperação;

  (7) Sintomas da exposição por radiação;

  (8) Exposição aguda e danos somáticos;

  (9) Monitoração pessoal para monitorar as doses;

  (10) Radiosensibilidade dos órgãos.'
