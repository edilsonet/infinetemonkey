title: APÊNDICE C - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE C - CONTROLE DE ALTERAÇÕES


  ALTERAÇÕES REALIZADAS NA REVISÃO B

  ITEM

  ALTERADO

  ALTERAÇÃO REALIZADA

  Cabeçalho

  Atualização da letra de revisão, da Portaria Regulatória de aprovação e da unidade de origem.

  2

  Atualização da seção Revogação.

  3.2

  Atualização de terminologias.

  3.3

  Ajuste na forma de contagem do prazo de guarda de registro de treinamento, conforme requisito
  no RBAC nº 145.

  3.4

  Atualização de referência a RBAC.

  3.6

  Atualização do histórico da norma, incluindo novo item para esta revisão e ajustando os
  referentes à revisão A desta IS.

  4.16

  Correção ortográfica.'
