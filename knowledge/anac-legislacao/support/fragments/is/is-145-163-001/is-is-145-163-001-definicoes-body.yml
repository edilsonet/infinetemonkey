title: DEFINIÇÕES
text: 'DEFINIÇÕES

  Ajuste ou verificação: ajuste ou verificação do desempenho do sistema de inspeção por END
  (equipamento, instrumento ou acessório de END, em conjunto ou em separado) com um valor
  de referência, geralmente um bloco de referência ou corpo de prova - CDP, antes da sua utilização
  na inspeção de artigos. Também denominado de calibration ou system calibration nos documentos
  de serviço de END.

  Avaliação de uma indicação: confrontação de uma indicação relevante com um parâmetro estabelecido
  em norma ou procedimento específico, com a finalidade de classificar o artigo sob um critério
  de aceitação/rejeição.

  Calibração:'
