title: definicoes(c)
text: 'c) Prático: avaliação da habilidade de uma pessoa na prática de um método de END utilizado
  pela OM. Respostas escritas não são necessárias, mas as observações e os resultados devem
  ser documentados.

  Experiência: aquisição de conhecimento e habilidade obtida no desempenho real de uma tarefa
  de inspeção por END. Não está incluído o conhecimento ou habilidade obtida nas aulas teóricas
  e/ou práticas, mas inclui o treinamento em serviço (On the Job Training - OJT).

  Indicação: evidência obtida ou observada que ocorre durante um END.

  Interpretação: determinação se uma indicação é relevante ou não relevante.

  Organização de Manutenção de Produto Aeronáutico - OM: organização detentora de certificado
  de acordo com o RBAC nº 145.

  Organização de Treinamento - OT: pessoa com experiência aceitável pela ANAC e/ou de notória
  especialização no que se refere à END com aplicação na aviação civil, externa e independente
  da OM, e que fornece a qualificação de pessoal em END. Instrutores e consultores autônomos
  estão incluídos nesta definição.

  Procedimento:'
