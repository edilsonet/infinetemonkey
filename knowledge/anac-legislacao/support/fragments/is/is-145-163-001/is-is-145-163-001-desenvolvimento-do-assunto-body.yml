  1 também denominados de métodos emergentes: Os parâmetros mínimos devem ser estabelecidos
  pelo profissional qualificado no Nível 3 da OM.

  Qualificação no Nível 3. É aceitável pela ANAC um programa de treinamento da OM que considere
  qualificável ao Nível 3 uma pessoa que apresente:

  I - graduação em nível superior, preferencialmente em engenharia mecânica, metalúrgica ou
  aeronáutica, mais 1 (um) ano de experiência em END como profissional Nível 2 qualificado
  e autorizado pela OM, no método;

  II - graduação em até o 2º ano do nível superior, preferencialmente em engenharia mecânica,
  metalúrgica ou aeronáutica, ou graduação em nível técnico, preferencialmente técnico em
  manutenção de aeronaves; e mais 2 (dois) anos de experiência em END como profissional Nível
  2, qualificado e autorizado pela OM, no método;

  III - 4 (quatro) anos de experiência como profissional qualificado no Nível 2, no método;
  ou

  IV - certificado de conclusão de curso de profissional qualificado no Nível 3, no método,
  pelo IFI do DCTA.

  NOTA - um profissional qualificado no Nível 3, por método, que execute inspeções para determinar
  a aeronavegabilidade de artigos deve comprovar proficiência em inspeção, de uma forma aceitável
  pela ANAC. Os procedimentos para estabelecer essa proficiência devem estar descritos no
  programa de treinamento da OM.

  Exames, pontuação e reexame

  O programa de treinamento da OM deve estabelecer a metodologia para os exames de qualificação,
  que são os seguintes:

  Exames de conhecimentos teóricos: gerais e específicos:

  I - sem consulta, consistindo de questões que abrangem os princípios básicos do ensaio,
  relativo ao método aplicável, aos equipamentos, procedimentos de operação e técnicas que
  o candidato pode encontrar em suas atividades diárias;

  II - seleção de questões pertinentes que abrangem o método aplicável;

  III - utilização de um mínimo de 40 (quarenta) questões gerais e 30 (trinta) específicas;

  IV - inclusão de questões sobre detecção de descontinuidades, interpretação de indicações,
  conhecimento de normas, etc.;

  V - inclusão das normas/especificações usadas nos procedimentos de END da OM;

  VI - disponibilização das normas relevantes e documentos nos quais os exames são feitos
  com base no idioma usado na documentação utilizada pela OM; e

  VII - ministrados em Português.

  Exames de conhecimentos práticos, que tem por função avaliar os conhecimentos obtidos no
  treinamento prático:

  I - a pessoa deve satisfatoriamente demonstrar que está familiarizada com e pode operar
  os equipamentos e interpretar as informações resultantes ao grau requerido pelo instrutor;
  e

  II - se não for incluído um critério de aceitação (por exemplo: radiografias de referência,
  CDP, etc.) no procedimento ou na norma utilizada, este deve ser fornecido em separado para
  o exame prático.

  Exames oftalmológicos: tem por função avaliar a capacidade de uma pessoa de ver com clareza,
  e poder interpretar os resultados obtidos:

  I - acuidade visual: um exame que assegure acuidade próxima de pelo menos um olho, corrigido
  ou não, tal que a pessoa possa enxergar equivalente a Snellen 20/25. O exame pode ser repetido
  anualmente; e

  II - percepção de cores: para o método de inspeção para o qual a qualificação é pretendida,
  é necessária a distinção e diferenciação entre cores. O exame pode ser repetido a cada 5
  anos.

  NOTA - no Brasil, por força da regulamentação, os exames oftalmológicos não podem ser ministrados
  pelo profissional qualificado no Nível 3, nem da OM nem tampouco da OT.

  Exames físico-clínicos: os exames físico-clínicos normalmente estabelecidos pelas OM para
  contratação de seus funcionários geralmente são considerados suficientes.

  NOTA - OM que empregam métodos que utilizam radiações ionizantes possuem requisitos adicionais
  de exames admissionais, periódicos e demissionais. Consulte a legislação aplicável de CNEN/CRTR/CONTER.

  Pontuação nos exames de conhecimento e prático: um profissional qualificado no Nível 3,
  no método, (ou pessoa delegada por este) da OM ou OT deve conduzir e avaliar os exames de
  qualificação para cada Nível. Os exames administrados para a qualificação devem ter resultado
  composto com média de pelo menos 80% (oitenta por cento), com nota de corte mínima individual
  de 70% (setenta por cento).

  Reexame após falha em exame: é aceitável que o programa de treinamento da OM estabeleça
  uma oportunidade adicional de estudo e nova avaliação para as pessoas que falharem no exame
  de conhecimentos teóricos e/ou prático, sem que haja a necessidade de novo treinamento técnico
  especializado. Por razões óbvias, o novo exame não pode incluir as mesmas questões ou CDP
  do exame em que o candidato tenha falhado e a ANAC recomenda que o novo exame seja efetuado
  após 30 (trinta) dias da tentativa falhada e contenha mais 25% (vinte e cinco por cento)
  em número de questões. No caso de reincidência de falha, o processo de qualificação deve
  ser reiniciado.

  A autorização para executar um serviço

  Geral. Em uma OM, algumas pessoas podem ser apenas qualificadas. Pessoas qualificadas conhecem
  um método, vantagens e limitações. Porém, ainda não possuem a experiência necessária para
  inspecionar artigos de forma independente e completa. Pessoas qualificadas podem realizar
  END (no caso de pessoas qualificadas no Nível 1, somente sob supervisão de profissional
  qualificado e autorizado no Nível 2 ou 3, no método), sem, no entanto, determinar a aeronavegabilidade
  de um artigo. Dentre as qualificadas, a OM necessita autorizar algumas (ou todas). Uma pessoa
  autorizada pode realizar a determinação de aeronavegabilidade de artigos frente a critérios
  de aceitação/rejeição, isto é, assinar laudos de inspeção por END, ou assinar fichas de
  inspeção como “executante”. Autorizar uma pessoa qualificada é um processo que depende de
  formação adicional.

  A Autorização. Cabe à OM reconhecer, por meio da autorização, que o processo de qualificação
  em END e de formação adicional (estabelecido a seguir) atende ao processo administrativo
  estabelecido no programa de treinamento da OM. A autorização deve ser em formato aceitável
  pela ANAC. Em geral, a autorização é uma declaração formal e/ou uma credencial para a pessoa
  executar todas as atividades em END. Pessoas autorizadas em END possuem o nome listado na
  lista de pessoas autorizadas (roster) da OM. Os Níveis de autorização aceitos pela ANAC
  para a execução completa de END são equivalentes aos Níveis de qualificação, e correspondendo
  à qualificação obtida. A autorização é um procedimento que aumenta a segurança na aviação
  civil.

  Níveis e Autorizações. Uma pessoa pode ser autorizada em mais de um método, com o Nível
  equivalente e correspondente para cada um.

  Prerrogativa do profissional qualificado e autorizado nos níveis 2 e 3, por método. Um profissional
  qualificado e autorizado em END no Nível 2 ou 3 pela OM, no método, é aceito como meio de
  cumprimento com os requisitos aplicáveis dos RBAC nº 43 e 145 sobre o “executante do serviço”
  em relação às tarefas em END. Cabe ao profissional qualificado no Nível 2 ou 3, no método,
  quando autorizado pela OM, realizar a inspeção END e determinar se, em relação ao END, o
  artigo está em condições de ser aprovado para retorno ao serviço. Contudo, essa pessoa autorizada
  em END não pode emitir APRS.

  O MMA e a APRS. O executante do serviço não aprova para o retorno ao serviço (APRS) o artigo
  inspecionado por END. APRS é somente por detentor de licença de MMA, com autorização da
  OM para APRS, conforme a seção 145.157 do RBAC nº 145. A APRS em uma OM pode ser por meio
  de um formulário ANAC F-100-01, ou pela assinatura de uma liberação de manutenção (maintenance
  release).

  NOTA 1 - o MMA APRS não precisa constantemente observar fisicamente a execução do END por
  profissionais qualificados no Nível, 2 ou 3, no método, mas deve sempre estar disponível
  para consulta sobre assuntos que requeiram instruções ou decisões de hierarquia superior.

  NOTA 2 - a APRS de um artigo, que não seja uma aeronave completa, é segundo o formulário
  ANAC F-100-01 e deve ser emitida por pessoa autorizada conforme a seção 43.7 do RBAC nº
  43. Para as inspeções de END em outra localidade que não requeiram intervenções na aeronave
  ou motor como remoção e instalação de partes, a APRS pode ser feita em sede tendo por base
  o laudo de inspeção por END emitido por profissionais qualificados no Nível 2 ou 3, no método.

  Conhecer e estar familiarizado. Para que uma OM autorize um profissional qualificado no
  Nível 2 ou 3, no método, o mesmo deve, além de “conhecer e estar familiarizado” com o método,
  provido pela qualificação, “conhecer e estar familiarizado” com o artigo, para que possa
  desempenhar adequadamente a atividade para a qual foi designado (autorizado). A ANAC justifica
  que o processo de “autorização” da OM seja mais completo que o estabelecido como “certificação”
  na AIA-NAS-410. No programa de treinamento da OM, “conhecer e estar familiarizado” é em
  parte, cumprido com o treinamento em serviço (On the Job Training - OJT). O OJT é cumprido
  em duas fases: sob supervisão “contínua e direta” e sob supervisão “contínua”. O programa
  OJT é um meio de ambientar e criar intimidade da pessoa qualificada com os vários aspectos
  de END, no método. O treinamento complementar, que veremos a seguir, supre o treinamento
  equivalente ao submetido aos MMA, que um profissional somente qualificado no Nível 2 e 3
  geralmente não possui.

  OJT, horas totais mínimas. A Tabela 2, abaixo, estabelece uma relação de totais de horas
  mínimas aceitável pela ANAC, e que estão em harmonia com as normas citadas na subseção 5.4
