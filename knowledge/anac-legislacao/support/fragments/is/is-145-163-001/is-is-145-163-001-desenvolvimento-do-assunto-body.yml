  1 OM e pessoas qualificadas em método ou técnicas que empregam as radiações ionizantes possuem
  requisitos adicionais junto ao CNEN/CONTER/CRTR, assuntos que estão além do âmbito desta
  IS. O princípio normativo "As Low As Reasonably Achievable"(ALARA) impede a exposição desnecessária
  de pessoas às radiações ionizantes, e treinamento prático pode ser considerado como fonte
  de exposição desnecessária. Consulte a legislação aplicável de CNEN/CRTR/CONTER.

  2 também denominados de métodos emergentes: Os parâmetros mínimos devem ser estabelecidos
  pelo profissional qualificado no Nível 3 da OM.

  Como completar o programa OJT. O período recomendado de OJT na Tabela 2 pode ser composto
  de vários OJT, referentes a várias inspeções END, em artigos diferentes. Esse é o treinamento
  mínimo em horas totais de OJT estimado como aceitável pela ANAC para que uma pessoa qualificada
  desenvolva intimidade adequada em END, por método. O processo de OJT deve ser documentado.

  OJT conjugada de métodos e demais atividades. Pode ser obtido o tempo total de OJT realizando
  OJT em 2 (dois) ou mais métodos (simultaneamente), devidamente documentado.

  OJT em inspeção, por método(s) e em atividades complementares. A ANAC considera aceitável
  que uma pessoa qualificada permaneça pelo menos 50% (cinquenta por cento) do tempo documentado
  diretamente em inspeções END em cada método, para o qual a autorização é pretendida, e o
  restante do tempo de trabalho pode ser documentado em atividades relacionadas a END e definidas
  no programa de treinamento da OM, pois essas atividades são parte integrante dos processos
  de END. Tais atividades incluem, por exemplo, a manutenção dos equipamentos, materiais e
  acessórios, a calibração (ajuste) antes da inspeção efetiva de um artigo, a preparação da
  sala de revelação e dos filmes, realização de controles dos processos, etc..

  OJT, redução de tempo total para pessoa detentora de licença ANAC (MMA). Um profissional
  qualificado no Nível 2 ou 3, no método, pode ter ou ser requerido pela OM a ser detentor
  de uma licença de MMA. De qualquer forma, é aceitável pela ANAC que se uma pessoa qualificada
  é MMA (por requisito da OM ou não), os requisitos de experiência prática podem ser reduzidos
  em até 50% (cinquenta por cento). Essa concessão é feita com base no tempo de experiência
  e formação que tal pessoa possui como MMA e está alinhado com o mesmo princípio utilizado
  nos requisitos de treinamento técnico especializado para profissional qualificado no Nível
  3 (vide seção 5.8(b) desta IS).

  Supervisão “contínua e direta”. O programa de treinamento da OM deve estabelecer que o OJT
  de um profissional qualificado no Nível 2 ou 3 necessita ser realizado no local de trabalho,
  com artigos reais, sob circunstâncias normais de trabalho e sob supervisão de profissional
  qualificado no Nível 3 da OM (ou da OT), no método. Um profissional qualificado no Nível
  2 ou 3, no método, sob treinamento OJT, observa pelo menos um END em um artigo sendo realizado
  por um profissional qualificado Nível 2 ou 3, no método. Após absorver como o END é realizado,
  em outras oportunidades realiza o mesmo END sob supervisão “direta e continua” de um profissional
  qualificado no Nível 3 da OM (ou da OT), no método, em artigos iguais ou equivalentes. Nesse
  sentido, supervisão “continua e direta” significa que o profissional qualificado no Nível
  3, no método, instrui e acompanha o END realizado pelo profissional qualificado no Nível
  2 ou 3, também no método. O programa de treinamento deve determinar o número de inspeções
  (geralmente o END é um serviço de inspeção) que deve ser repetido sob essas condições -
  e esse número de vezes depende, entre outras coisas, do método e complexidade do END. O
  profissional qualificado e autorizado no Nível 3, no método, é a pessoa que pode fazer essa
  determinação. Existem serviços em que a complexidade é tal que pelo menos 2 (duas) pessoas
  são necessárias. A pessoa qualificada pode participar de tais END como treinando em OJT,
  mas o profissional qualificado e autorizado no Nível 3 necessita estar sempre exercendo
  a supervisão “contínua e direta” nesta fase.

  Supervisão “contínua”. Após o período sob supervisão contínua e direta, e durante um prazo
  estabelecido pelo programa de treinamento da OM, a pessoa pode realizar o mesmo END ou equivalentes
  - ainda sob OJT - mas com supervisão de forma contínua. A forma contínua significa que o
  profissional qualificado e autorizado no Nível 3 está nas proximidades, à disposição, agora
  com o intuito de sanar possíveis dúvidas. Após a repetição da mesma inspeção em artigos
  iguais ou equivalentes, e de forma aceitável, o OJT sob supervisão está concluído. O OJT
  deve ser documentado. O programa de treinamento deve determinar o número de inspeções que
  deve ser repetido - e esse número de vezes depende, entre outras coisas, do método e complexidade
  do END. O profissional qualificado no Nível 3 e autorizado da OM é a pessoa que pode fazer
  essa determinação.

  OJT, considerações adicionais. Não há equivalência entre métodos diferentes, o que se justifica
  pelas qualificações específicas para cada método. Uma pessoa pode ser qualificada em mais
  de um método e pode desenvolver OJT simultaneamente nesses métodos. O programa OJT é utilizado
  para autorizar uma pessoa qualificada em 2 (duas) ocasiões:

  na autorização inicial, quando a pessoa qualificada cumpre com as recomendações em horas
  totais (ref. Tabela 2), conforme descrito e justificado acima; e

  em autorizações subsequentes, quando novas técnicas ou procedimentos específicos são introduzidos
  na OM, e o programa de treinamento estabelece OJT conforme a Tabela 2 (novos métodos) ou
  OJT otimizado (horas adicionais para novas técnicas).

  Devido ao vasto número de inspeções (END) em artigos (aeronaves, motores, hélices, partes
  e componentes destes) e devido ao número razoável de métodos de inspeção END nesses artigos,
  faz-se necessário estabelecer o que é aceitável para compor as horas totais de um OJT, por
  método, que são registradas para efeito da autorização. As considerações a seguir orientam
  o profissional qualificado no Nível 3 da OM a compor o programa de treinamento, por método.
  Exemplos:

  LP - Em uma OM que revise motores à reação, é aceitável que as 270h (ou 400h) sejam compostas
  de inspeções realizadas em blades, discos, carcaças e demais componentes de um motor. Existem
  precedentes para aceitar que esse período registrado seja suficiente para autorizar, sem
  acréscimo de OJT, as inspeções por esse método a todas as outras blades, discos, carcaças
  e demais componentes de outros motores à reação que vierem a ser inspecionados por LP, desde
  que a tecnologia de materiais, construção, defeitos esperados e técnica de LP sejam semelhantes.
  Se existem casos onde existem variações na técnica, tal como Spot Check em alumínio, aço
  ou titânio, e se essa técnica não havia sido incluída nas horas totais, a ANAC recomenda
  OJT otimizado para essa técnica, que pode validar todas as aplicações dessa técnica e para
  cada um desses materiais (separadamente). Outro caso que necessita OJT otimizado, caso não
  esteja documentado nas horas totais precedentes é a variação entre técnicas como de LP lavável
  a água e pós-emulsificável, hidrofílico, ou variações do tipo de revelador. Existem também
  raríssimos casos em que os documentos de serviço do detentor do projeto de tipo não permitem
  a remoção da tinta que recobre a peça; casos como esse também requerem OJT otimizado. A
  ANAC recomenda OJT (otimizado) para os ensaios de controle do processo de LP, caso não estejam
  incluídos nas 270h (ou 400h). Não é necessário repetir as 270h (ou 400h) no OJT otimizado
  (para novas técnicas), mas o profissional qualificado e autorizado no Nível 3 necessita
  avaliar quantas horas são necessárias para cada novo OJT requerido.

  PM - Em uma OM que revise motores convencionais, é aceitável que as 400h (ou 530h) sejam
  compostas de inspeções realizadas em inspeções por PM de eixos de manivela, bielas, parafusos,
  engrenagens, etc. É possível admitir a semelhança entre todos os motores alternativos, já
  que basicamente são fabricados com materiais, técnica e acabamento semelhante, inclusive
  nos defeitos possíveis de serem encontrados. Existem inspeções que, mesmo por semelhança
  nos artigos, requerem OJT otimizado, caso não incluídas nas horas totais precedentes registradas,
  tais como a utilização de equipamentos, em campo (Yoke e Encircling Coil), mesmo que a técnica
  principal seja por PM fluorescentes, via úmida, método contínuo. A ANAC recomenda ainda
  OJT otimizado para os ensaios de controle do processo de PM. Não é necessário repetir as
  400h (ou 530h) no OJT otimizado (para novas técnicas), mas o profissional qualificado e
  autorizado no Nível 3 necessita avaliar quantas horas são necessárias para cada novo OJT
  requerido.

  CP - Em uma OM que revise aeronaves, é aceitável que as 1200h (ou 1600h) sejam compostas
  de inspeções realizadas em fuselagens, estruturas, portas, rodas, etc. No caso de CP, os
  ensaios de alta frequência, que é a grande maioria das inspeções de célula, se registrados
  nas horas totais precedentes, podem ser considerados validados para todas as células, desde
  que as condições de ensaio sejam semelhantes e sobre os mesmos materiais e com os mesmos
  equipamentos. Entretanto, se a alta frequência for aplicada em peças de titânio ou aço,
  e essas técnicas não estiverem registradas nas horas totais precedentes, recomenda-se um
  OJT otimizado, para cada um desses materiais, uma vez que os blocos de referência e as técnicas
  apresentam grandes variações em relação ao primeiro. Quando a técnica empregada é a média
  frequência em carreiras de rebites de células, é possível admitir a semelhança entre essa
  aplicação em aeronaves diferentes e, portanto, uma vez concluído OJT otimizado nessa técnica,
  caso não incluída nas horas totais precedentes, pode valer para todas as outras. Idem a
  técnica de Rototest em carreiras de rebites em células. A técnica MOI necessita OJT otimizado
  caso não incluída nas horas totais precedentes. Por outro lado, como um caso mais complexo,
  ensaios em baixa frequência, ou por sliding probe em fuselagem, cada inspeção tem um bloco
  de referência e particularidades únicas. A ANAC recomenda um OJT otimizado para cada inspeção,
  caso não incluída nas horas totais precedentes. O mesmo critério pode ser utilizado para
  avaliação de corrosão em painéis de ALCLAD. Entretanto, o profissional qualificado e autorizado
  no Nível 3 deve observar com certa reserva as validações se aparelhos diferentes forem utilizados.
  Não é necessário repetir as 1200h (ou 1600h) nos OJT otimizado (para novas técnicas), mas
  o profissional qualificado e autorizado no Nível 3 necessita avaliar quantas horas são necessárias
  para cada novo OJT requerido.

  US - Em uma OM que revise aeronaves ou componentes, é aceitável que as 1200h (ou 1600h)
  sejam compostas de inspeções realizadas em fuselagens, estruturas, janelas, trens de pouso,
  componentes de trens de pouso, etc., pois cada inspeção por US tem características únicas
  e bem específicas, tal como CP de baixa frequência. A ANAC também recomenda OJT para cada
  calibração em bloco de referência para inspeção, tal como as feitas com base em blocos V1,
  V2, etc.

  RI - Em uma OM que revise aeronaves ou componentes, é aceitável que as 1200h (ou 1600h)
  sejam compostas de inspeções realizadas em asa, estabilizadores, fuselagens estruturas,
  portas e componentes. No caso de RI, a ANAC recomenda OJT para cada inspeção, para a inspeção
  de cada filme revelado, seja em filme, seja no formato digital, o que por si só, requer
  um OJT otimizado em separado, incluído a utilização dos softwares, a operação e posicionamento
  do canhão, seleção, manuseio, revelação e secagem de filmes, operação e medição de densidade,
  seleção de penetrâmetros, etc. A ANAC recomenda ainda OJT otimizado para os ensaios de controle
  do processo de RI e para as ações de radioproteção, tal como a utilização correta de dosímetros,
  canetas dosimétricas, verificação e operação de monitores de área, monitores, portáteis
  de radiação, etc.

  SG e TG. No caso de SG e TG, cada uma, a ANAC repete as recomendações tal como EC de baixa
  frequência, US e RI.

  A norma AIA-NAS-410 descreve os procedimentos para estabelecer a autorização (certificação)
  de uma forma “geral” para a indústria e a manutenção. A ANAC considera que um treinamento
  adicional é altamente recomendável para que uma pessoa possa “conhecer e estar familiarizado”
  com a OM, os artigos, os equipamentos de END, etc., de forma a ser autorizada pela OM. A
  ANAC recomenda que o programa de treinamento da OM inclua:

  o treinamento nos artigos em que será executado o serviço de END, normalmente um curso de
  familiarização. Esse curso de familiarização pode conter e explicar tarefas específicas
  de END;

  o treinamento nos equipamentos/materiais e acessórios utilizados para as inspeções, normalmente
  ministrado pelo fabricante do equipamento. Em alguns casos, as tarefas são simples e em
  outros, há a necessidade de especialização adicional que requer treinamento adicional ao
  de qualificação básica;

  o treinamento nos manuais da OM;

  o treinamento específico fornecido pela empresa “operadora” certificada conforme o RBAC
  nº 121 e RBAC nº 135, tal como itens de inspeção obrigatória (IIO), caso aplicável. Neste
  caso, a pessoa da OM que recebe uma delegação IIO da operadora necessita possuir licença
  MMA da ANAC; e

  outros requisitos que a OM defina em seu programa de treinamento (determinados pelo profissional
  qualificado no Nível 3 responsável).

  Profissional Qualificado no Nível 3 Responsável

  Uma OM pode ter mais de profissional qualificado e autorizado no Nível 3. Nesse caso, a
  OM necessita delegar a uma pessoa com mais métodos registrados e/ou mais experiência, a
  responsabilidade e autoridade para assegurar que as recomendações desta IS sejam observadas
  e incorporadas na elaboração dos manuais aplicáveis. Para essa finalidade, a OM deve estabelecer
  em seu manual como vai selecionar o profissional qualificado no Nível 3 Responsável.

  Instrutor

  É uma pessoa qualificada de acordo com esta IS e designada por um profissional qualificado
  e autorizado no Nível 3 Responsável para fornecer treinamento em sala de aula (treinamento
  teórico) e prático (laboratório) para o pessoal de END. Os Instrutores não são requeridos
  a possuir as habilitações conforme o RBAC nº 65, a menos que seja pré-requisito da OM.

  Auditor

  A pessoa que faz auditoria externa na OM e interna (self audit) da OM onde se executa END
  deve ter treinamento, conhecimento e capacidade para compreender os processos e procedimentos
  utilizados na aplicação de END e deve estar familiarizada com a aplicação de códigos, normas
  e outros documentos contratuais de controle, por método aplicável. Para o atendimento a
  esta finalidade, a ANAC recomenda que estes auditores tenham, no mínimo, treinamento teórico
  e prático equivalente ao fornecido ao profissional qualificado no Nível 1, a nível informativo
  (sem fins de qualificação).

  Registros e práticas administrativas da OM

  A OM deve:

  incluir em seu manual uma descrição dos detalhes a serem registrados para cada pessoa qualificada
  e identificar os responsáveis por desenvolver, administrar e manter o programa de treinamento
  e qualificação;

  estabelecer por meio do programa de treinamento o controle e administração, avaliação escrita,
  qualificação e documentação. Este programa deve incluir o método para manter a proficiência,
  incluindo a revogação, o treinamento recorrente e os passos para o cancelamento e a revalidação
  da qualificação e autorização, conforme requerido; e

  manter os registros apropriados de treinamento das pessoas, de acordo com seu programa de
  treinamento. Os registros devem ser disponibilizados para fiscalização e auditorias e devem
  especificar o Nível, limitações, normas de qualificação usadas, a data, local da qualificação
  e nome da OT (se aplicável).

  Disposições adicionais para o método radiográfico

  O desenvolvimento de trabalhos relacionados com equipamentos ou fontes que emitem radiações
  ionizantes implica em requisitos legais adicionais para a OM, bem como para as pessoas,
  em termos de treinamento, qualificação e autorização para a execução dos serviços.

  As pessoas treinadas, qualificadas e autorizadas pela OM em radiografia industrial só podem
  desempenhar as atividades que envolvam a utilização de radiações ionizantes por END, tal
  como com Raios X ou Gama se apropriadamente treinadas, qualificadas e certificadas em radioproteção
  industrial pela CNEN e registrados no CRTR/CONTER. O profissional qualificado e autorizado
  no Nível 3 em RI é a pessoa adequada para verificar os requisitos adicionais.

  Requalificação, revogação, treinamento recorrente, cancelamento da qualificação/autorização

  A qualificação/autorização (inicial e recorrente) deve ser estabelecida no programa de treinamento
  da OM. Um processo de treinamento recorrente aceitável pela ANAC segue os provisionamentos
  da subseção 5.8 desta IS.

  Os exames de treinamentos recorrentes de qualificação (de conhecimentos teóricos gerais,
  específicos e práticos) permitem avaliar a manutenção da proficiência da pessoa e manter
  a autorização, no método.

  A recorrência de qualificação/autorização deve ocorrer no período estabelecido no programa
  de treinamento da OM. A ANAC considera aceitáveis os processos recorrentes a intervalos
  de, no máximo, a cada 5 (cinco) anos.

  NOTA 1 - algumas normas de “qualificação e certificação”, tal como a AIA-NAS-410, estabelecem
  um sistemas de pontuação para profissionais anteriormente qualificados/autorizados no Nível
  3. O sistema de pontuação é opcional, mas, se optar por esse sistema, cabe à OM estabelecê-lo
  em seu programa de treinamento .

  NOTA 2 - o conceito de treinamento recorrente para a qualificação/autorização não deve ser
  utilizado para simplesmente repetir os mesmos conceitos anteriormente ministrados, a menos
  que alguns tópicos sejam necessários para manter o desejado grau de competência do pessoal.

  A qualificação/autorização é automaticamente revogada (suspensa) na data imediatamente posterior
  à validade do exame de acuidade visual descrito na seção 5.9.1 ou conforme estabelecido
  no manual da OM.

  Uma pessoa deve ter sua qualificação/autorização suspensa e ser requerida a receber treinamento
  recorrente para qualificação/autorização, quando esta pessoa:

  não demonstra desempenho satisfatório, ou quando há registros de desempenho insatisfatório.
  O desempenho insatisfatório dever ser determinado pela pessoa responsável pela qualificação/autorização
  deste, ou por um método documentado aprovado pela OM;

  tenha ficado inativo por um período superior a 6 (seis) meses, ou por um período menor a
  ser estipulado pelo programa de treinamento, qualificação e autorização da OM; ou

  falha ao ser avaliado por um profissional qualificado e autorizado no Nível 3 ou outra pessoa
  designada por este, no intervalo estipulado.

  Uma pessoa deve ter sua qualificação/autorização extinta, se demonstrada conduta profissional
  antiética ou negligente. A ANAC recomenda que esta pessoa não seja mais qualificada/autorizada
  pela OM.

  NOTA - como esse é caso grave contra a segurança da aviação civil, a ANAC recomenda que
  a OM elabore e forneça para a ANAC uma analise relacionada às atividades da pessoa com a
  qualificação/autorização cancelada, demonstrando se há risco para a aviação, relacionado
  com as tarefas recentes de END executadas por essa pessoa.

  Métodos emergentes, considerações finais

  Revisões da norma AIA-NAS-410 podem conter informações adicionais para métodos emergentes
  (além dos 7 métodos já listados na seção 5.5 desta IS).'
