title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  Conceitos gerais sobre a qualificação

  A qualificação em END tratada nesta IS visa a aplicação específica na aviação civil.

  A qualificação em END é a somatória e comprovação (avaliação) do: treinamento técnico especializado,
  conhecimento, habilidade prática e, quando aplicável, a acuidade visual requerida para o
  desempenho apropriado de um Nível em particular. A qualificação em END é por método de ensaio.

  O programa de treinamento deve ser constituído de duas etapas: a etapa de qualificação e
  a etapa de autorização. A etapa de qualificação é a mais simples (vide seções 5.7 a 5.9
  desta IS), sendo pré-requisito para a etapa de autorização. A finalidade da qualificação
  é propiciar que uma OM autorize uma pessoa a exercer as atividades de END em seu nome, embora
  a autorização ainda dependa da satisfação de requisitos adicionais (vide seção 5.10 desta
  IS), como a realização de treinamento em serviço (On the Job Training - OJT); somente um
  profissional qualificado e autorizado no Nível 3, por método de ensaio, da OM pode determinar
  esses requisitos adicionais. Um profissional somente qualificado pode realizar os procedimentos
  de END (sujeito a limitações, como nos parágrafos 5.6.2 e 5.10.1 desta IS), mas não pode
  determinar a aeronavegabilidade de um artigo e se responsabilizar pelo END. Somente após
  cumprir a etapa de autorização é que ele estará apto para tal.

  NOTA 1 - as expressões “no método” e “por método” de END, utilizada nesta IS ressaltam que
  uma pessoa somente pode exercer as prerrogativas e limitações no método em que foi qualificada.
  Uma pessoa qualificada em, por exemplo, Líquidos Penetrantes, não pode exercer prerrogativas
  e limitações nos outros métodos, a menos que também seja qualificada nesses outros métodos.
  Não é admitida equivalência de qualificação entre os métodos, a não ser entre as várias
  técnicas de um mesmo método.

  NOTA 2 - existem técnicas dentro de um método que necessitam treinamento complementar ou
  especial. Por exemplo, os detentores do projeto de tipo ou fabricantes dos artigos muitas
  vezes fornecem kits específicos para certas inspeções determinadas em seus documentos de
  serviço, inclusive oferecendo um treinamento especificamente dirigido para essas técnicas.
  A ANAC recomenda fortemente que, nesses casos especiais, a OM envie as pessoas adequadamente
  autorizadas (como profissional qualificado no Nível 2 e/ou no 3) para esse tipo de treinamento.

  A execução e a interpretação de resultados requerem pessoas qualificadas e autorizadas para
  a prática confiável de END. Durante o processo de qualificação, as pessoas conhecem as aplicações
  e as limitações dos vários métodos de END utilizados para identificar e avaliar descontinuidades
  em artigos aeronáuticos.

  No caso da qualificação por experiência prévia, uma pessoa demonstra proficiência, competência
  e experiência.

  Durante um processo de qualificação ao Nível 1, uma pessoa é considerada apenas estagiária
  em END. Uma pessoa considerada estagiária ou uma pessoa já qualificada no Nível 1 não pode
  determinar a aeronavegabilidade de artigos na OM.

  A licença de mecânico de manutenção para uma pessoa conforme o RBAC nº 65 com habilitação
  em célula e/ou grupo motor propulsor pode ser considerada como parte da experiência requerida
  pelo programa de treinamento em END da OM. Fica a critério do profissional qualificado no
  Nível 3 da OM avaliar esta conveniência.

  Para uma OM certificada pela ANAC no exterior, a licença de mecânico de manutenção para
  uma pessoa emitida por sua autoridade de aviação civil com habilitação em célula e/ou grupo
  motor propulsor, conforme aplicável, pode ser pré-requisito, dependendo do sistema (Norma)
  que a OM estabeleceu em seu MOM.

  A ANAC recomenda que, no programa de treinamento, o idioma inglês seja critério para a qualificação,
  uma vez que a maioria dos documentos de serviço é disponibilizada nesse idioma.

  A ANAC recomenda que, no programa de treinamento, a formação técnica, técnica superior e
  superior com ênfase em aeronáutica, mecânica, metalúrgica, de manutenção de aeronaves, etc.,
  seja critério para a qualificação.

  Qualificação Interna e por OT

  A responsabilidade pela qualificação e autorização em END é sempre da OM. O programa de
  qualificação e autorização está estabelecido no programa de treinamento da OM. O programa
  de treinamento é submetido à aprovação da ANAC. Um profissional qualificado no Nível 3,
  no método, é a pessoa com a visão geral e específica em END, por método, que pode treinar,
  elaborar procedimentos e estabelecer o programa de treinamento em END.

  A ANAC recomenda que uma OM tenha pelo menos um profissional qualificado e autorizado no
  Nível 3 no(s) método(s) utilizado(s) pela OM.

  Por opção, e desde que esteja descrito em seu manual, a OM pode contratar uma OT para ser
  responsável por elaborar a parte referente ao END do programa de treinamento técnico especializado
  da OM (teórico, prático, supervisionar o treinamento em serviço ou desenvolver procedimentos
  de END). A qualificação pode ser nas instalações da OM ou da OT, no todo ou em parte.

  Caso seja utilizada uma OT, a ANAC recomenda que esta seja selecionada entre pessoas (físicas
  ou jurídicas, públicas ou privadas - definição de acordo com o RBAC nº 01) que comprovem
  notória e reconhecida experiência ou especialização em END na aviação civil. Como meio de
  quantificar/qualificar a notória e reconhecida experiência ou especialização, a ANAC considera
  aceitáveis as seguintes pessoas para a qualificação no Brasil:

  o Instituto de Fomento e Coordenação Industrial - IFI do Departamento de Ciência e Tecnologia
  Aeroespacial - DCTA;

  os profissionais qualificados no Nível 3, por método, formados pelo Instituto de Fomento
  e Coordenação Industrial - IFI do Departamento de Ciência e Tecnologia Aeroespacial - DCTA;

  os profissionais qualificados no Nível 3, por método, designados pelos detentores do projeto
  de tipo ou fabricantes dos artigos; ou

  a Associação do Comitê Brasileiro Aeroespacial de Ensaios Não Destrutivos - CBRAEND, reconhecida
  pela ANAC para exercer, no âmbito da aviação civil, a função de Comitê Nacional Aeroespacial
  de END (National Aerospace Nondestructive Testing Board - NANDTB), nos termos da AIA-NAS-410.

  NOTA 1 - os profissionais qualificados no Nível 3 designados pelos fabricantes dos equipamentos
  de inspeção somente podem fornecer treinamento referente a uma técnica ou equipamento.

  NOTA 2 - OM e pessoas qualificadas em método ou técnicas que empregam as radiações ionizantes,
  no Brasil, possuem requisitos adicionais junto ao CNEN/CONTER/CRTR, assuntos que estão além
  do âmbito desta IS.

  Como a responsabilidade final pelo treinamento sempre é da OM, caso seja utilizada uma OT,
  a OM deve ter procedimentos para garantir que a grade curricular mínima de qualificação
  aprovada em seu programa de treinamento seja mantida, mediante procedimentos aceitáveis
  pela ANAC. O Apêndice A desta IS fornece um exemplo de grade curricular.

  Para que a qualificação ministrada totalmente na OT seja eficiente, deve haver igualdade
  ou equivalência de equipamentos, manuais, procedimentos e blocos de referência na OT. A
  ANAC recomenda que o profissional qualificado no Nível 3 da OM analise e aceite a equivalência
  mediante procedimentos aceitáveis pela ANAC.

  Uma OM ou uma OT que deseja qualificar uma pessoa necessita possuir ou ter à disposição:

  equipamentos de END e seus manuais (para cada método);

  materiais consumíveis, e seus dados técnicos (para cada método e técnica);

  acessórios, catálogos e especificações (específicos para cada método e técnica);

  blocos de referência gerais e específicos para a calibração (para cada método);

  exemplos de procedimentos específicos de artigos aeronáuticos; e

  artigos reais aos inspecionados na OM, ou partes similares destes (CDP).

  A ANAC recomenda que as aulas práticas sejam ministradas com os equipamentos, materiais
  e acessórios que a OM normalmente utiliza, o que contribui para a ambientação das pessoas
  sob treinamento, aumentando a segurança da aviação civil através de um treinamento otimizado.

  NOTA - o princípio normativo "As Low As Reasonably Achievable" (ALARA) impede a exposição
  desnecessária de pessoas às radiações ionizantes. O treinamento prático pode ser considerado
  como fonte de exposição desnecessária. Consulte a legislação aplicável CNEN/CRTR/CONTER.

  Qualificação com base em experiência prévia

  Um processo de qualificação fornecido por uma OM tem a finalidade de prover pessoal que
  possa ser autorizado a realizar END em seu nome. A formação de pessoal autorizado em END
  é um processo que depende, entre outras coisas, de prévia experiência em serviço. Como a
  realização de serviços com END por um novo requerente somente poderia ser iniciada após
  a ANAC emitir o certificado para a OM, o processo de autorização seria inviável sem o sistema
  da qualificação feito com base em experiência prévia. Para viabilizar o processo, o requerente
  que inicia atividades em END pode selecionar pessoas que apresentem uma documentação que
  comprove experiência e treinamento prévio equivalente ao requerido pelo processo de qualificação
  proposto em seu programa de treinamento. A equivalência será estabelecida pelo profissional
  qualificado no Nível 3 da OM, no método, em função da documentação e dos requisitos do programa
  de treinamento da OM.

  Norma de “qualificação e certificação” em END

  A certificação de uma OM em Serviços Especializados é feita com base no estabelecimento
  de normas ou especificações da indústria, adotadas ou desenvolvidas pela OM, aceitas pela
  ANAC. As pessoas que executam END (NDT, NDI, NDE) podem ser qualificadas de acordo com uma
  norma aceitável pela ANAC. Após a ANAC analisar as normas internacionais, estabeleceu que
  a norma aceitável para as OM certificadas no Brasil é a AIA-NAS-410, Aerospace Industries
  Association, National Aerospace Standard, NAS Certification & Qualification of Nondestructive
  Test Personnel, ou NBR equivalente.

  NOTA - o profissional qualificado no Nível 3, por método, que elabora o programa de treinamento
  em END de ou para uma OM deve observar a aplicabilidade da NBR equivalente à AIA-NAS-410.
  A ANAC recomenda para OM certificadas por ela no Brasil, se também certificadas por autoridades
  estrangeiras, que a NBR equivalente seja acordada entre a OM e a autoridade estrangeira.

  Outros programas de “qualificação e certificação” para END, aceitos pelas autoridades da
  aviação civil em estado estrangeiro, podem ser aceitos, mediante análise pela ANAC na certificação
  de OM estrangeiras, no exterior. Por exemplo, OM certificadas pela ANAC no exterior eventualmente
  podem utilizar as seguintes normas:

  ATA Specification 105* - Air Transport Association, Guidelines for Training and Qualifying
  Personnel in Nondestructive Testing Methods;

  (*) Pode ser aplicável em OM também certificadas conforme o RBAC nº 121 ou RBAC nº 135.

  CAN/CGSB-48.9712-95 - Canadian National Regulations contained in, Qualification and Certification
  of Nondestructive Testing Personnel;

  SNT-TC-1A** - American Society for Nondestructive Testing, Inc - ASNT, Recommended Practice,
  Personnel Qualification and Certification in Nondestructive Testing;

  (**) Este documento é um guia de como as OM devem estabelecer seus próprios procedimentos
  escritos para a qualificação de pessoas em END. Não foi elaborado para ser uma especificação,
  mas pode ser usado como.

  EN4179 - Qualification and Approval of Personnel for Nondestructive Testing; e

  ISO 9712 - International Standards Organization (ISO) document, Nondestructive Testing -
  Qualification and Certification of Personnel.

  Outros programas de “qualificação e certificação” para END, aceitos por organizações militares,
  podem ser aceitos, mediante análise pela ANAC. Por exemplo, OM de organizações militares
  certificadas pela ANAC eventualmente podem utilizar a seguinte norma:

  MIL-STD-410E*** - Military Standard, Nondestructive Testing Personnel Qualification and
  Certification.

  (***) ainda aceitável, embora essa norma MIL esteja cancelada.

  Métodos de END objetos de treinamento e qualificação

  Ensaios por Líquidos Penetrantes - LP;

  Ensaios por Partículas Magnéticas - PM;

  Ensaios por Correntes Parasitas - CP;

  Ensaios por Ultrassom - US;

  Ensaios por Radiográficos - RI;

  Ensaios por Termografia - TG;

  Ensaios por Shearografia - SG; e

  Outros métodos (emergentes).

  NOTA 1 - a NAS 410 abrange os métodos de a) até g). Outros métodos, também denominados de
  métodos emergentes (inovações ainda em desenvolvimento para a aviação), tais como Emissão
  Acústica, Radiografia com Nêutrons, Tomografia, Aniquilação de Pósitron por Indução por
  Fóton - PIPA, etc. podem ser agregados a esta lista se os detentores do projeto de tipo
  ou fabricantes dos artigos aeronáuticos recomendarem a metodologia de treinamento, qualificação
  e certificação da NAS 410 em documentos de serviço. O programa de treinamento da OM pode
  utilizar a metodologia recomendada por esta IS, independentemente de atualizações desta
  Lista.

  NOTA 2 - o método visual com ou sem auxílio de lentes de aumento (incluindo o boroscópico),
  inspeção de riscos em juntas sobrepostas de fuselagens (lap-joints) por microscopia óptica
  ou LASER, testes de vazamento, entre outros, não são objetos desta IS, embora necessitem
  de treinamento e qualificação adequado para seu apropriado desenvolvimento.

  NOTA 3 - equipamento de remoção de mossas por CP não é um ensaio por CP e, portanto, não
  é objeto desta IS.

  NOTA 4 - o MOI é uma técnica inclusa no Ensaio por CP.

  Níveis de qualificação e atribuições

  O programa de treinamento de uma OM pode estabelecer pelo menos 3 Níveis de qualificação,
  por método. A ANAC recomenda que os três Níveis básicos assim sejam mantidos. Estagiários,
  aprendizes, alunos e demais pessoas em treinamento inicial não são consideradas profissionais
  qualificados no Nível 1 antes de completar os requisitos de treinamento e obter a qualificação.

  Profissionais somente qualificados no Nível 1(*), 2 ou 3, no método, podem realizar os procedimentos
  de END, sem no entanto proceder a determinação de aeronavegabilidade. Somente os profissionais
  qualificados e autorizados no Nível 2 ou 3, no método, como será visto e justificado adiante,
  podem, além de realizar o END, realizar a determinação da aeronavegabilidade de um artigo.

  (*) somente sob supervisão de um profissional qualificado e autorizado no Nível 2 ou 3,
  no método.

  As atribuições para cada Nível de qualificação aceitáveis pela ANAC são:

  Nível 1

  I - ter o conhecimento necessário de toda a preparação das peças antes e após o ensaio;

  II - ser capaz de seguir os procedimentos de preparação do método para o qual é qualificado;

  III - ser capaz de receber orientação ou supervisão de um profissional qualificado e autorizado
  nos Níveis 2 ou 3, no método; e

  IV - quando expressamente permitido por uma pessoa qualificada e autorizada como Nível 3
  da OM, no método, executar um ensaio simples, em um determinado método de ensaio, desde
  que não implique na determinação da aeronavegabilidade.

  Nível 2: (adicionalmente às atribuições para o Nível 1)

  I - ter conhecimento e habilidade para montar, ajustar e calibrar os instrumentos/equipamentos
  de END;

  II - coordenar e conduzir END segundo os procedimentos específicos, organizar, interpretar,
  avaliar pelo critério de aceitação/rejeição, e documentar os resultados do método utilizado;

  III - estar completamente familiarizado com o escopo e com as limitações do método para
  o qual está qualificado;

  IV - ser capaz de fornecer OJT para estagiários ou profissionais qualificados no Nível 1;
  e

  V - estar familiarizado com os códigos, normas e outros documentos regulatórios que controlam
  o(s) método(s) usado(s) pela OM.

  Nível 3: (adicionalmente às atribuições para o Nível 2)

  I - ser capaz de fornecer OJT para o profissional qualificado no Nível 2 (desde que esta
  competência esteja incluída na sua qualificação);

  II - ser capaz de selecionar o método e a técnica para inspeções específicas;

  III - ser capaz de selecionar e ou projetar equipamentos e blocos de referência;

  IV - interpretar códigos, normas, e outros documentos regulatórios do método;

  V - elaborar procedimentos em métodos nos quais é qualificado e verificar se os procedimentos
  são/estão adequados;

  VI - ter conhecimento geral de todos os outros métodos de ensaio, incluindo os utilizados
  pela OM; e

  VII - ser capaz de ministrar ou coordenar o treinamento e avaliação escrita de pessoas no
  Nível 1, 2 e 3, no método no qual é qualificado e autorizado.

  As fases da qualificação

  O programa de treinamento da OM inclui as seguintes fases:

  Treinamento técnico especializado (partes: geral, específico e prático);

  Exames teóricos (geral e específico);

  Exames práticos; e

  Exames médicos.

  Treinamento técnico especializado, quantidade de horas de treinamento

  Qualificação no Nível 1 e Nível 2. É aceitável pela ANAC um programa de treinamento da OM
  que considere qualificável ao Nível 1 e 2 a pessoa que apresente as seguintes horas mínimas
