title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  Uma OM anteriormente certificada pela ANAC em END conforme o RBAC nº 145 deve verificar
  se as recomendações desta IS estão incorporadas nos seus manuais.

  Os casos omissos serão dirimidos pela ANAC.'
