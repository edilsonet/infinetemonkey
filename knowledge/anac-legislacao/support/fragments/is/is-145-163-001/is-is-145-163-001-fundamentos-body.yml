title: FUNDAMENTOS
text: 'FUNDAMENTOS

  O parágrafo 145.163(a) do RBAC nº 145 estabelece que uma OM deva ter um programa de treinamento
  de seus profissionais, aprovado pela ANAC, que consiste em treinamento inicial e recorrente.

  O parágrafo 145.163(b) do RBAC nº 145 estabelece que o programa de treinamento deve assegurar
  que cada pessoa designada para executar manutenção, manutenção preventiva ou alterações,
  e funções de inspeção e de registro, seja capaz de executar as tarefas a ele designadas.

  O parágrafo 145.163(c) do RBAC nº 145 estabelece que uma OM deva documentar, em formato
  aceitável à ANAC, o treinamento de cada pessoa requerido pelo parágrafo 145.163(a) do RBAC
  nº 145. Esses registros devem ser retidos por, no mínimo 5 (cinco) anos após o término do
  vínculo contratual.

  O parágrafo 145.163(d) do RBAC nº 145 estabelece que uma OM deva submeter revisões do seu
  programa de treinamento à ANAC, de acordo com os procedimentos requeridos pelo parágrafo
  145.209(e) do mesmo RBAC.

  A qualificação em END na manutenção de aeronaves, assunto tratado nesta IS, determina a
  confiabilidade de um artigo submetido a END e consequentemente exerce profundo impacto na
  segurança da aviação civil, dada a vasta quantidade de inspeções END realizadas tanto na
  fabricação de produtos, mas principalmente, e esse é o foco desta IS, quanto na manutenção
  de tais artigos (artigos, referente ao RBAC nº 145 e produtos, referente ao RBAC 21, possuem
  conotação semelhante). Por outro lado, tanto os cursos de formação de mecânicos de manutenção
  aeronáutica - MMA, quanto a própria licença emitida para os MMA pela ANAC não são especificamente
  voltados para a qualificação das pessoas que realizam END. Eventos ocorridos na aviação
  civil mundial e notadamente no voo 243 da Aloha Airlines em 28 de abril de 1988, repetidamente
  citado como “um marco na aviação civil”, ressaltam a importância do desempenho e do adequado
  processo de qualificação e autorização em END.'
