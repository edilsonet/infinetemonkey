title: OBJETIVO
text: 'OBJETIVO

  Esta IS estabelece critérios aceitáveis, mas não únicos, para detalhar e orientar a forma
  de cumprimento do estabelecido pela seção 145.163 do RBAC nº 145, com as recomendações da
  ANAC em relação à qualificação e autorização de pessoas em Ensaios Não Destrutivos - END
  na manutenção aeronáutica. Essa IS é um tutorial feito com base na AIA-NAS-410, rev 3.

  Esta IS também esclarece qual a natureza e como se elabora o processo de autorização que
  uma Organização de Manutenção de Produto Aeronáutico - OM necessita estabelecer para as
  pessoas que realizam END na manutenção de produto aeronáutico.

  Este documento aplica-se às pessoas diretamente responsáveis pela adequação técnica do treinamento
  nos métodos de END, utilizados em uma OM detentora de Especificações Operativas de acordo
  com o RBAC nº 145, tanto quanto a pessoas ou Organizações de Treinamento de pessoal em END.'
