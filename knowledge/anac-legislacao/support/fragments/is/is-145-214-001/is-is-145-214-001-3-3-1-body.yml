title: Em consonância com as diretrizes da OACI para implementação do SGSO, dentro do PSOE-
text: '3.3.1 Em consonância com as diretrizes da OACI para implementação do SGSO, dentro do
  PSOE-

  ANAC foi definida a aplicabilidade do SGSO para o universo de PSAC cujas atividades são

  diretamente afetadas pelas SARPs constantes dos Anexos 1 - Licenças de Pessoal, 6 -

  Operação de Aeronaves, 8 - Aeronavegabilidade e 14 - Aeródromos, cuja incorporação à

  regulamentação aeronáutica brasileira é de competência da ANAC. Dentre os PSAC acimaData
  de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  mencionados encontram-se as Organizações de Manutenção de Produto Aeronáutico

  certificadas pelo RBAC 145, cuja fiscalização é de responsabilidade da Superintendência
  de

  Aeronavegabilidade - SAR.'
