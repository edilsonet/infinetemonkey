text: 'f) treinamento ou experiência nos métodos e ferramentas de identificação de perigos
  e de

  avaliação e controle de riscos.

  B4.3. Devem participar do GASO representantes de todas as áreas responsáveis pela execução,
  super-

  visão e inspeção das atividades sensíveis para a segurança operacional, conforme definido
  no

  subparágrafo 5.2.1.2 desta IS.

  B4.4. A composição do GASO deve, portanto, ser permanente. Recomenda-se que, sempre que
  possí-

  vel, os representantes sejam voluntários. Na ausência de voluntários, os representantes
  devem

  ser formalmente designados pelo RSO.

  B4.5. O RSO, caso aplicável, deve convocar reuniões do GASO com periodicidade, no mínimo,
  quin-

  zenal. Adicionalmente, o RSO deve assegurar a realização de convocações extraordinárias

  quando situações de riscos considerados críticos ou muito relevantes forem detectadas e
  levadas

  a seu conhecimento por qualquer setor da organização.Data de emissão: 8 de junho de 2018.
  IS nº 145.214-001

  Revisão B

  INTENCIONALMENTE EM BRANCOData de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B'
