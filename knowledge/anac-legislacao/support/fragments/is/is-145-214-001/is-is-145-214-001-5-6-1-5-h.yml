text: 'h) No caso de organizações que, além da base principal, possuam bases secundárias,
  que

  apresentem características particulares, e que requeiram processos ou procedimentos

  específicos para seu adequado tratamento dentro do escopo de SGSO, devem discriminarData
  de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  claramente essas situações em seu MGSO. Portanto, é recomendável que as mesmas

  sejam apresentadas em suplementos ou seções especiais do MGSO, para cada uma dessas

  bases secundárias.'
