section_title: Elemento 3.2 - Processo de gerenciamento de mudanças
subsection_id: a
cite: 5.6.3.2(a)
title: 5.6.3.2(a)
text: 'a) A organização deve desenvolver e manter um processo que assegure a identificação
  de

  mudanças que podem afetar a segurança operacional de suas atividades, e ainda

  identificar os perigos relacionados a essas mudanças e gerenciar seus riscos potenciais,
  e

  que seja compatível com os critérios de escalabilidade estabelecidos na subseção 5.2 desta

  IS.'
