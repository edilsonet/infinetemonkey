title: Todo o pessoal da organização definido no subparágrafo 5.2.1.2 desta IS deve possuir
text: '5.6.4.4 Todo o pessoal da organização definido no subparágrafo 5.2.1.2 desta IS deve
  possuir

  treinamento ou familiarização em SGSO, de acordo com o definido no subparágrafo 5.6.4.3

  desta IS, conforme suas responsabilidades e atribuições estabelecidas pelo RSO com relação

  ao SGSO.'
