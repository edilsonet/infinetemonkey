title: O RSO e demais membros do GASO devem possuir treinamento em SGSO, de acordo com
text: '5.6.4.6 O RSO e demais membros do GASO devem possuir treinamento em SGSO, de acordo
  com

  o definido na alínea “a” do subparágrafo 5.4.6.3 desta IS. Também devem possuir

  treinamentos adicionais definidos pelo próprio RSO, a fim de que exerçam de modo

  proficiente suas responsabilidades e atribuições com relação ao SGSO.Data de emissão: 8
  de junho de 2018. IS nº 145.214-001

  Revisão B'
