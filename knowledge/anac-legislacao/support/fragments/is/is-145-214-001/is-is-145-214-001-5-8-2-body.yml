title: Dentro dessa metodologia é apresentada a lista de verificação de implementação do SGSO,
text: '5.8.2 Dentro dessa metodologia é apresentada a lista de verificação de implementação
  do SGSO,

  denominada Evaluation Tool. Esta lista de verificação consiste na única ferramenta aceita
  e

  validada pela ANAC/SAR para a análise e aceitação do SGSO dos PSAC por ela regulados.

  Seu uso é recomendado também aos PSAC, a fim de realizarem a autoanálise da

  implementação do SGSO.'
