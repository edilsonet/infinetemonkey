title: Diante do exposto no parágrafo 5.9.1 desta IS, cada uma dessas organizações deve apontar
text: '5.9.2 Diante do exposto no parágrafo 5.9.1 desta IS, cada uma dessas organizações deve
  apontar

  um único Gestor Responsável e um único Representante da Direção para o SGSO, se

  aplicável, sendo este último equivalente ao Diretor ou Gerente de Segurança Operacional,

  conforme aplicável.'
