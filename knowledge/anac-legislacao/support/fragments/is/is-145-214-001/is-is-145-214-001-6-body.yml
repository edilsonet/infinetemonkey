title: Falha do sistema de fornecimento de combustível para o motor 2 (6,7%)
text: '6. Falha do sistema de fornecimento de combustível para o motor 2 (6,7%)

  GI2.2. Árvore de problemas (adaptação da Árvore de falhas - Fault Tree Analysis - FTA)

  Gi2.2.1. A Árvore de falhas é ferramenta de análise de risco típica da área de projetos
  de equipamentos

  ou sistemas, concebida para avaliar o impacto de falhas simples ou múltiplas na operação
  de

  sistemas mais complexos, a partir do conhecimento das taxas de falhas de componentes, equi-

  pamentos ou diversos sistemas que operam conjuntamente.

  Gi2.2.2. Devido à sua praticidade de permitir o estudo probabilístico de ocorrência de eventos
  indese-

  jados, essa ferramenta tem sido adaptada para avaliar as probabilidades de ocorrência de
  even-

  tos adversos à segurança operacional, a partir do conhecimento das probabilidades de falhas

  na execução de processos, procedimentos, tarefas, etc.. Por isso, tal aplicação tem sido
  comum

  por parte de operadores aéreos.

  Gi2.2.3. A seguir é apresentado um exemplo simples de utilização da árvore de falhas em
  casos de

  aeronavegabilidade, para analisar casos de motores aeronáuticos revisados em uma OM. Os

  motores foram reprovados no banco de provas, devido a problemas inerentes ao próprio teste.

  Isso implica em assumir que o processo de revisão foi feito de forma adequada.

