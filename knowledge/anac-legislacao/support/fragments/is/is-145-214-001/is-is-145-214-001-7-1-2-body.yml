title: Todos os itens definidos como recomendações são de adoção facultativa pelas organizações
text: '7.1.2 Todos os itens definidos como recomendações são de adoção facultativa pelas organizações

  atingidas por esta IS. Portanto, cabe às mesmas a responsabilidade de evidenciar para a

  ANAC/SAR o nível equivalente de segurança operacional alcançado pelos métodos deData de
  emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  cumprimento eventualmente diferentes por ela adotados, visando subsidiá-la na decisão

  quanto à sua aceitação.

  7.2 Os casos eventualmente omissos serão dirimidos pela SAR/ANAC.

  7.3 Esta IS entra em vigor na data de sua publicação.Data de emissão: 8 de junho de 2018.
  IS nº 145.214-001

  Revisão B'
