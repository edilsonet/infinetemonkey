text: '9. Aloque os recursos; e

  10. Defina que relatórios são importantes e necessários para acompanhar o andamento do projeto.LOGO
  DA

  EMPRESA GERENCIAMENTO DE MUDANÇAS ÁREA:

  .......

  PÁGINA

  ...../.....

  REV. Nº ....... APROVAÇÃO: ... / ... /.... FORMULÁRIO REF: ................

  4

  Implemente a mudança

  Somente após o minucioso planejamento feito nas etapas anteriores, é que a mudança deve
  ser

  efetivamente implementada. O ritmo das mudanças deve ser considerado e está relacionado
  com a

  complexidade das mudanças. A cultura organizacional também é um aspecto importante a ser

  considerado na definição desse ritmo de implementação das mudanças. Dois aspectos relevantes
  para

  o sucesso desse tipo de empreendimento são o comprometimento e a comunicação.'
