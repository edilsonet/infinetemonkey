text: 'APÊNDICE A - TABELA GERAL DE ESCALABILIDADE DAS ORGANIZAÇÕES DE MANUTENÇÃO CERTIFICADAS
  PELO

  RBAC 145

  Critérios de escalabilidade

  OBS.: 1) Os prazos para a fase de implantação do SGSO são apresentados nos subparágrafos
  5.4.1.1 e 5.4.2.1 desta IS.

  2) As OM estrangeiras devem adotar os mesmos critérios de escalabilidade descritos neste
  apêndice, em relação à sua estrutura

  organizacional.

  Complexi-

  dade

  Porte

  Alta - executam serviços se-

  gundo o RBAC 43 em aerona-

  ves operadas segundo o RBAC

  121, e/ou em seus motores.

  Média - executam serviços segundo o

  RBAC 43 em aeronaves com capacidade

  certificada para 19 ou mais assentos de

  passageiros operadas segundo o RBAC

  135, e/ou em seus motores.

  Baixa - demais OM que não se enquadram nos grupos an-

  teriores.

  Grande: mais de 50

