title: apendice-b-compatibilizacao-da-estrutura-organizacional-e(b)
text: 'b) seja exclusivo, mas a empresa possua várias bases de operação.

  B1.8. Não é permitido que uma pessoa seja designada como RSO por mais de uma OM.

  B1.9. Cada OM deve possuir uma única pessoa identificada como GR. Entretanto, é permitido
  que o

  GR responda perante a ANAC por mais de uma OM.

  B1.10. O GR e o RT podem eventualmente ser a mesma pessoa, conforme previsto na seção 145.151'
