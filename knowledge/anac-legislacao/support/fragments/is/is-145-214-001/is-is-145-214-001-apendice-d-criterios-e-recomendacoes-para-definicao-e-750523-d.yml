  D3.7.3. Exemplo para definição de política, objetivos e indicadores.

  D3.7.4. A política geral de uma empresa deve ser composta pelos fatores relevantes para
  o sucesso

  da organização como: Segurança, qualidade, resultado financeiro, cultura, postura ética,
  sa-

  tisfação dos colaboradores e clientes, responsabilidade social, meio ambiente e outros.
  O

  quadro a seguir exemplifica a forma como foi definida a política de meio-ambiente de uma

  empresa fictícia, os objetivos e os indicadores.

  1

  Fato que deu origem a um dos componentes da política

  Em uma viagem a uma feira internacional do segmento em que atua a empresa XYZ, o diretor

  presidente detectou uma clara tendência de que nos próximos anos o mercado estará priorizando

  fornecedores com ações efetivas voltadas à proteção do meio ambiente. De volta ao Brasil
  re-

  passou a informação a todos os demais diretores e solicitou que fossem adotadas medidas
  nesse

  sentido nos próximos cinco anos, de forma que a empresa mantivesse sua cartela de clientes
  a

  ainda conseguisse um crescimento de dez por cento. O diretor da qualidade ficou responsável

  por incluir na política geral da empresa e no planejamento estratégico essa nova diretriz.

  2

  Documentação da política de meio ambiente

  A empresa XYZ ampliará suas ações voltadas à proteção do meio ambiente nos próximos anos.

  As iniciativas deverão incluir a obtenção de uma certificação específica, priorização de
  forne-

  cedores com certificação ISO 14001, fomento na área de meio-ambiente para os fornecedores

  não certificados e adequação de todos os processos da organização com impacto ambiental.
  Pa-

  ralelamente a essas ações, um programa de marketing e comunicação deverá ser desenvolvido
  eIT TÍTULO SIGLA DESCRIÇÃO / OBJETIVO DO INDICADOR ÁREA /

