text: 'd) Dimensionamento da mão de obra (%) - DMO

  D3.6.5. Já a Alta Direção, considera importante ter uma noção geral de como anda o gerenciamento

  de seu pessoal. Para isso, poderia ser criado um “indicador estratégico da área de gestão
  de

  pessoas” a partir dos “indicadores setoriais” já existentes.

  - Indicador de gestão de pessoas - IGP

  Onde:

  Figura 06 - Cálculo do IGP

  Nota 01 - O uso dos “pesos” serve somente para indicar que os especialistas consideraram
  deter-

  minados aspectos mais críticos ou relevantes do que outros.

  Nota 02 - Um “índice” é um valor numérico que tem significado dentro de um contexto. No
  caso da

  rotatividade (RTE), quanto mais próximo de zero, melhor para a segurança (se a empresa tem
  bons

  profissionais, vai querer uma baixa rotatividade). Já uma rotatividade de cerca de 20% (ou
  mais),

  seria com certeza negativa para o aspecto segurança, que é o foco do indicador.

