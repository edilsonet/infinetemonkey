text: 'b) aqueles que, embora não requeridos pela estruturação do SGSO, produzem resultados
  e im-

  pactos que afetam:

  I- o desenvolvimento, a implementação ou a manutenção do SGSO;

  II- o equilíbrio entre o gerenciamento da segurança operacional e o gerenciamento finan-

  ceiro da organização; e

  III- o desempenho da segurança operacional da organização no exercício de suas ativida-

  des ou prestação de serviços.

  E1.4. É recomendável que a descrição formal de um processo organizacional(descritivo do
  pro-

  cesso),conforme estabelecido na subseção 1.2 deste Apêndice, seja acompanhado de:Data de
  emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B'
