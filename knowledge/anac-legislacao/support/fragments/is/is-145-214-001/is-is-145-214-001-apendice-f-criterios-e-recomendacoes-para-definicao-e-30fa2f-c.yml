text: 'c) conduzida adequadamente, porém as novas barreiras ou o reforço daquelas preexisten-

  tes não são efetivamente implementados.

  F1.3. Nesse contexto, o presente Apêndice trata especificamente do Elemento 2.1 do Componente
  2,

  e apresenta critérios e recomendações consideradas eficazes no contexto da aviação civil
  inter-

  nacional no que se refere ao processo de identificação de perigos pelos PSAC.

  Componente 2 - Gerenciamento de riscos à segurança operacional

  2.1 Processo de identificação de perigos

  2.2 Processo de avaliação e controle de riscos à segurança operacional

  F2. DEFINIÇÃO DOS SETORES E PESSOAS RESPONSÁVEIS PELA IDENTIFICAÇÃO DE

  PERIGOS

  F2.1. Diferentemente do processo de gerenciamento de riscos que requer competências e treinamentos

  mais específicos, a identificação de perigos requer, sobretudo, capilaridade, a fim de cobrir
  o

  ambiente operacional enfrentado pela organização de forma abrangente e contínua.Data de
  emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  F2.2. As melhores práticas apontam no sentido de que os profissionais das áreas que estiverem
  sendo

  avaliadas são as pessoas mais indicadas para reconhecer de forma mais eficaz os perigos
  carac-

  terísticos daquele ambiente.

  F2.3. Mesmo que a organização defina que uma pessoa em especial irá centralizar e repassar
  as infor-

  mações relativas aos perigos, a detecção não deve nunca ser restringida, de forma a garantir
  essa

  característica da capilaridade, principalmente se a organização possuir várias bases.

  F3. OCASIÕES PARA APLICAÇÃO DOS PROCESSOS DE IDENTIFICAÇÃO DE PERIGO E

  GERENCIAMENTO DE RISCOS

  F3.1. A identificação de perigos e o processo decorrente, que é o gerenciamento de riscos,
  devem

  ocorrer de forma contínua. Porém, cabe ressaltar algumas circunstâncias especiais que obrigato-

  riamente disparam tais processos:'
