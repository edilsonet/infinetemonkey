text: 'APÊNDICE I - CRITÉRIOS E RECOMENDAÇÕES PARA DEFINIÇÃO E IMPLEMEN-

  TAÇÃO DO PROCESSO DE MELHORIA CONTÍNUA DO SGSO

  I1. CONSIDERAÇÕES GERAIS SOBRE O PROCESSO DE MELHORIA CONTÍNUA DO SGSO

  I1.1. Garantir que uma organização ou sistema está melhorando continuamente não é uma tarefa
  muito

  fácil, e muito menos estabelecer uma metodologia para quantificar essa melhoria. Por essa
  razão,

  o presente Apêndice fornece alguns subsídios para auxiliar na estruturação e implementação
  do

  processo de melhoria do SGSO.

  I1.2. O alcance da melhoria contínua depende essencialmente da atuação eficaz da Alta Direção
  da

  organização, ou seja, de que forma ela define suas políticas, estabelece os níveis de comprome-

  timento para si e seus colaboradores com essas políticas, e finalmente direciona recursos
  e ações

  para a concretização das políticas em questão.

  I1.3. Os esforços da organização nesse sentido e os resultados alcançados podem ser mensurados
  e

  avaliados por um conjunto de métricas (indicadores), tal como apresentado no Apêndice D
  desta

  IS.

  I1.4. Entretanto, cabe ressaltar que o requisito de melhoria do SGSO é focado na constatação
  de que

  a organização possui um processo de melhoria contínua efetivamente implementado. Tal pro-

  cesso visa fornecer subsídios à Alta Direção quanto à decisão de alocar recursos na melhoria
  do

  gerenciamento da segurança operacional. Essa decisão depende da avaliação de que os recursos

  alocados de fato resultam em melhoria mensurável do gerenciamento da segurança operacional

  em equilíbrio com o gerenciamento financeiro da organização.

  I2. ELEMENTOS QUE CONTRIBUEM PARA A MELHORIA CONTÍNUA DO SGSO

  I2.1. Tomando-se por referência a Norma ABNT NBR ISO 9001:2008, na qual são estabelecidos

