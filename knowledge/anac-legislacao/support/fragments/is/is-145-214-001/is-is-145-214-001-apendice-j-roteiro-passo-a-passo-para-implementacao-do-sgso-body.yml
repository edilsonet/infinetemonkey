  PASSOS PARA A IMPLEMENTAÇÃO DO SGSO

  1º passo: Familiarizar-se com a seção 145.214-I do RBAC 145 e com a IS 145.214-001 e seus
  Apên-

  dices;

  2º passo: Enquadrar a organização de acordo com o critério de escalabilidade, conforme estabelecido

  no parágrafo 5.2.1 desta IS;

  3º passo: Identificar o Gestor Responsável - GR da organização, conforme estabelecido no
  subpará-

  grafo 5.6.1.2 desta IS;

  4º passo: Designar o Representante da Alta Direção para o SGSO - RSO, conforme estabelecido
  no

  subparágrafo 5.6.1.3 desta IS;

  5º passo: Rever e adequar a estrutura organizacional, conforme estabelecido nos parágrafos
