text: 'G1.1 Neste Apêndice é apresentado de forma detalhada o processo de avaliação e controle
  de riscos,

  que se segue ao processo de identificação de perigos visto no Apêndice F desta IS Portanto
  são

  definidos os critérios e recomendações considerados eficazes no contexto da aviação civil
  in-

  ternacional no que se refere ao Elemento 2.2 do Componente 2 do SGSO.'
