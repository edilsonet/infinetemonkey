cite: G4.5
title: As organizações atingidas por esta IS devem levar em consideração os aspectos apresentados
text: 'G4.5 As organizações atingidas por esta IS devem levar em consideração os aspectos
  apresentados

  nas subseções 4.3 e 4.4 deste Apêndice para o estabelecimento das estratégias de mitigação
  e

  tipos de defesas das quais devem dispor, a fim de responder de modo proativo e eficaz às
  poten-

  ciais consequências adversas associadas aos perigos inerentes às suas atividades e operações,

  conforme os resultados de seu processo de avaliação e controle de riscos.'
