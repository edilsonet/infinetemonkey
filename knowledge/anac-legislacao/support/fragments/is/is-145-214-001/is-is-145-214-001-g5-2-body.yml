text: 'G5.2 O modelo descreve os ciclos realizados dentro dos Componentes 2 e 3 do SGSO. Destaca-se
  que

  o ponto principal do modelo é a interação entre esses dois componentes. A identificação
  dos

  perigos é considerada uma “peça móvel” entre os dois componentes. Isso implica em assumir

  que a coleta de dados realizada pelo GSO pode resultar na identificação de perigos e dar
  início

  ao processo de avaliação e controle de riscos.'
