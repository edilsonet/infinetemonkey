cite: G5.3
title: Destaca-se ainda que a descrição do ambiente operacional e o gerenciamento de mudanças
  são
text: 'G5.3 Destaca-se ainda que a descrição do ambiente operacional e o gerenciamento de
  mudanças são

  apresentados fora dos respectivos ciclos. Isso se deve ao fato de que, diferente das demais,
  essas

  não são atividades continuamente realizadas. Entre elas ocorre a seguinte interação: durante
  o

  ciclo da GSO pode ser apontada a necessidade de implementação de mudanças de qualquer na-

  tureza na organização. Ao serem implementadas, ocorre alteração do ambiente operacional,
  cuja

  descrição precisa ser novamente realizada. Concluída essa nova descrição, reinicia-se o
  ciclo do

  GRSO e sua interação com a GSO, mantendo-se a continuidade do gerenciamento da segurança

  operacional.'
