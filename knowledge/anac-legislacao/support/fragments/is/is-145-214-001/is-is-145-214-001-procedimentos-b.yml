text: 'b) análise dos processos.

  F4.3.4. O processo deve ser estruturado de forma a permitir que toda manifestação, de qualquer
  fonte,

  encontre sempre um caminho para se tornar conhecida pela organização, e seja analisada com

  seriedade e sem represália ou crítica negativa.

  F5. METODOLOGIA PARA CLASSIFICAÇÃO DE PERIGOS E TAXONOMIA

  F5.1. Devido à diversidade e complexidade do ambiente da aviação civil, a identificação
  e registro de

  perigos pode resultar na construção de um banco de dados inconsistente e confuso, devido
  a

  informações redundantes ou conflitantes. Esse resultado indesejado pode ser evitado com
  a ado-

  ção de regras claras, que visam à padronização dos registros, permitindo entre outras facilidades

  sua classificação em “famílias” de perigos.

  F5.2. Essas “famílias” são formadas com diversos perigos que podem ter em comum a causa,
  o tipo

