  F5.3. Essa padronização dos registros de perigos é comumente denominada taxonomia de perigos
  e

  sua utilização é fortemente recomendada por parte das organizações afetadas por esta IS,
  em face

  dos benefícios acima citados, uma vez que colabora com a eficácia e melhoria contínua dos

  processos de identificação de perigos e controle de riscos.

  F5.4. A taxonomia adotada deve ser clara e objetiva, porém possuir flexibilidade suficiente
  para reco-

  nhecer similaridade entre os termos adotados no registro e na busca, como nos exemplos a
  seguir:Data de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  “ferramenta”, “ferramental”, “instrumento” ou “manual”, “publicação” ou “componente”,

  “parte”, “acessório”.

  F6. EXEMPLO DE TAXONOMIA DE PERIGOS

  Com o propósito de favorecer o intercâmbio de dados e informações sobre perigos entre a
  ANAC e

  as organizações afetadas por esta IS, bem como entre essas mesmas organizações, recomenda-se
  a

  adoção da taxonomia e agrupamento dos perigos (“famílias”) com base nas recomendações do
  SM-

  ICG, conforme exemplos a seguir:

