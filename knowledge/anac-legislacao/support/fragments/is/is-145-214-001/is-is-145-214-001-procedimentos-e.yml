  áreas de pintura, uso de solventes, exposição a

  produtos químicos ou biológicos, ruído, vibra-

  ções e distrações.

  Falhas latentes relaciona-

  dos ao homem / má-

  quina / processo de in-

  terface

  Fatores humanos relacionados com o projeto, fa-

  bricação, manutenção e operações.

  MEIO AMBIENTE

  Fatores climáticos

  Tempestades e raios.

  Chuva de granizo.

  Nevoeiro (visibilidade reduzida).

  Tempestade de areia.

  Tempestades de neve e gelo.

  Vento forte.

  Furacão, tsunami, furacão ou inundações.

  Fumaça vulcânica.

  Gelo e neve nas superfícies da aeronave.

  Ambiente com salinidade elevada (maresia).

  Ambientes selvagens ou

  inóspitos

  Animais selvagens próximos às áreas de operação /

  manutenção

  Operações próximas a grandes concentrações de

  pássaros

  Nota 01 - O foco é sempre o risco para a segurança operacional, e não a segurança do trabalho
  que

  obedece à legislação específica e deve ter processos dedicados e estruturados. Entretanto,
  é possível

  observar claramente que aspectos relacionados à segurança do trabalho interferem nitidamente
  na

  segurança operacional, por afetarem diretamente nas condições de trabalho dos profissionais
  de

  manutenção em tarefas críticas.Data de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B

  Nota 02 - Manutenibilidade é uma característica inerente a um projeto de sistema ou produto,
  e se

  refere à facilidade, precisão, segurança e economia na execução de ações de manutenção nesse
  sis-

  tema ou produto.

  Nota 03 - Nesse grupo foram incluídas condições relacionadas à saúde dos profissionais que
  de

  alguma forma possam afetar à atividade de manutenção, gerando consequências adversas para
  a

  segurança operacional.

  Nota 04 - A tabela original proposta pelo SM-ICG sugere grupos de perigos para diversas
  áreas

  como aeroportos, navegação aérea, projeto / fabricação, operadores aéreos e manutenção.
  As famí-

  lias de perigos apresentadas no presente adendo referem-se apenas as condições potencias
  associa-

  das à atividade de aeronavegabilidade / manutenção, ou seja, aquelas que estão de alguma
  forma

  cobertas pelo RBAC 145.Data de emissão: 8 de junho de 2018. IS nº 145.214-001

  Revisão B'
