  ALOCAÇÃO DE AERONAVES NO PÁTIO

  12.1 A Seção 153.119 do RBAC nº 153 traz requisitos atinentes à alocação de aeronaves no
  pátio.

  12.2 O parágrafo 153.119(a) do RBAC nº 153 define que o operador de aeródromo deve coordenar
  o pátio de maneira a alocar, na área da posição de estacionamento, aeronave compatível com
  o grupo (mix) de aeronaves previsto para nela estacionar.

  12.3 [Recomendação] É aconselhável que o operador de aeródromo preveja, quando houver demanda,
  posição de estacionamento específica para aeronave militar ou em operação de transporte
  de autoridades.

  12.4 [FC 153.119(a)] O operador de aeródromo deve definir, quando houver movimento extraordinário,
  requisitos específicos para processamento de aeronaves maiores que a de referência (aeronave
  crítica de projeto), de maneira a garantir a distância mínima entre qualquer construção
  adjacente, aeronave em posição de estacionamento e outros objetos.

  12.5 A necessidade de alocar aeronaves para outras áreas que não sejam posições de estacionamento
  ou de pátio pode surgir em situações como desvios em massa, eventos especiais, condições
  meteorológicas adversas, exigências de contingência, ocorrência de obras, entre outros.

  12.6 [Recomendação] É recomendável fazer uma avaliação de risco ser realizada caso haja
  necessidade de alocar o estacionamento de aeronaves em áreas diferentes das posições de
  estacionamento ou das áreas de pátio.

