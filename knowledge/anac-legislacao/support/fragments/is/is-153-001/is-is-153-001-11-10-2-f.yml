text: 'f) Proteção contra os jatos dos motores.

  12.8 O parágrafo 153.119(b) do RBAC nº 153 determina que o operador de aeródromo deve manter
  o órgão ATS, quando houver, informado quanto às posições que receberão as aeronaves em aproximação
  ou pousadas, bem como as posições inoperantes.

  12.9 [Recomendação] Recomenda-se o estabelecimento de meios para garantir a distribuição
  efetiva e rápida de informações relevantes entre o Centro de Operações Aeroportuárias (COA),
  quando houver, a Torre de Controle do Aeródromo (TWR), se aeródromo controlado, e a área
  de operações, tais como:'
