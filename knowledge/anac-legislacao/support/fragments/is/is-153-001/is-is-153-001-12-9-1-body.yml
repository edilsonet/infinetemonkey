text: '12.9.1 As informações devem estar disponíveis para o pessoal do COA de maneira que
  seja facilmente transmitida para as turmas de todos os turnos.

  12.10 O parágrafo 153.119(c) do RBAC nº 153 determina que o operador de aeródromo deve manter
  o controle e o registro de movimentos quanto ao processamento de aeronaves, passageiros,
  carga aérea e mala postal.

  12.11 [Recomendação] Para facilitar a definição de procedimentos, delimitação de responsabilidades
  e desenvolvimento de atividades de monitoramento, sugere-se que o operador de aeródromo
  estabeleça em desenho adequado:'
