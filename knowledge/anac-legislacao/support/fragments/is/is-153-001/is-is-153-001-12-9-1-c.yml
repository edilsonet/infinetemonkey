title: 12.9.1(c)
text: 'c) a sinalização horizontal, com cotas que permitam a verificação da conformidade com
  as distâncias mínimas de separação de aeronaves (espaço livre entre as extremidades das
  aeronaves) definidas no parágrafo 154.303(m) do RBAC nº 154.

  ESTACIONAMENTO DE AERONAVES NO PÁTIO

  13.1 A Seção 153.121 do RBAC nº 153 traz requisitos atinentes ao estacionamento de aeronaves
  no pátio.

  13.2 O parágrafo 153.121(a) do RBAC nº 153 determina que o operador de aeródromo deve assegurar
  orientação capaz de nortear o correto estacionamento da aeronave.

  13.3 Os meios de orientação citados no parágrafo 153.121(a)(1) podem ser sistema de orientação
  visual de estacionamento, sinaleiro, luzes e sinalização horizontal.

  13.3.1 Os meios de orientação têm como funções orientar o piloto durante o procedimento
  de estacionamento, norteando o correto estacionamento da aeronave e durante a execução de
  manobras no pátio de aeronaves.'
