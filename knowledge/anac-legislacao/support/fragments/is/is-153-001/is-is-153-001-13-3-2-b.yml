  PROCESSAMENTO DE PASSAGEIROS, BAGAGENS, MALA POSTAL E CARGA AÉREA

  16.1 A Seção 153.127 apresenta requisitos referentes ao processamento de passageiros, bagagens,
  mala postal e carga aérea.

  16.2 O parágrafo 153.127(a) do RBAC nº 153 define que o deslocamento de passageiros pelo
  pátio de aeronaves deve ser feito com o acompanhamento do operador aéreo, o qual é responsável
  solidário no que tange a este procedimento.

  16.3 O parágrafo 153.127(b) do RBAC nº 153 apresenta os requisitos quanto ao deslocamento
