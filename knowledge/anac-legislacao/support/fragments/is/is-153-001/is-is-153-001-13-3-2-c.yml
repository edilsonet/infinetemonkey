text: 'c) necessário para dar um uso mais eficiente do espaço disponível para estacionamento
  de aeronaves.

  13.6 Os operadores de aeródromo devem considerar o tipo de aeronave e suas características
  na definição das posições de estacionamento, de modo a alocar pontos de amarração, quando
  disponíveis, às posições adequadas para aeronaves de pequeno porte.

  ABORDAGEM À AERONAVE

  14.1 A Seção 153.123 do RBAC nº 153 traz requisitos atinentes a abordagem à aeronave.

  14.2 O parágrafo 153.123(a) do RBAC nº 153 estabelece que todas as atividades de abordagem
  à aeronave, antes de seu início, devem aguardar a parada completa dos motores, o apagamento
  das luzes anticolisão e a colocação dos calços na aeronave, exceto se for essencial à execução
  da atividade.

  14.3 O parágrafo 153.123(b) do RBAC nº 153 determina que o operador de aeródromo deve garantir,
  após a colocação dos calços, a imediata sinalização para proteção dos motores e extremidades
  da aeronave.

  14.4 O parágrafo 153.123(c) do RBAC nº 153 preleciona que o profissional responsável pela
  limpeza ou manutenção da aeronave não deve efetuar despejo de materiais no pátio de aeronaves.

  14.5 [FC 153.109(d)] O parágrafo 153.123(d) do RBAC nº 153 define que o profissional responsável
  pela operação da ponte de embarque e desembarque deve respeitar regras de conduta, as quais
  se encontram a seguir estabelecidas:'
