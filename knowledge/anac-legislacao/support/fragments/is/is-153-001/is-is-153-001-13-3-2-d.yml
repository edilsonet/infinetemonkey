text: 'd) manter o interior da zona desobstruída da ponte de embarque e desembarque livre
  da presença de veículos, equipamentos e pessoas.

  14.6 O parágrafo 153.123(e) do RBAC nº 153 determina que o operador de aeródromo deve manter,
  durante serviço de rampa, pessoal treinado e equipamento acessível para utilização na intervenção
  inicial caso ocorra princípio de incêndio.

  14.7 [FC 153.123(e)] O operador de aeródromo deve manter, durante serviço de rampa, equipamento
  de extinção de incêndio acessível para utilização na intervenção inicial.

  14.8 [FC 153.123(e)] Para a definição do tipo e da quantidade de equipamento de extinção
  de incêndio necessário para intervenção inicial deverão ser considerados pelo operador de
  aeródromo a infraestrutura existente, bem como o gerenciamento do risco associado à execução
  de serviço de solo.

  14.9 [FC 153.123(e)] A atividade de intervenção inicial para combate a princípio de incêndio
  deve ser realizada por pessoal treinado nos termos dispostos na Instrução Suplementar -
  IS nº 153.37-001, em parte que trata do treinamento geral. (Vide IS nº 153.37-001)

  14.10 [FC 153.123(e)] Em caso de princípio de incêndio durante serviço de rampa, a equipe
  contraincêndio do aeródromo deve ser imediatamente acionada.

  14.11 Para a finalidade de intervenção inicial, quando do abastecimento da aeronave, os
  requisitos dispostos na Seção 153.125 do RBAC nº 153 são considerados suficientes.

  14.12 [Recomendação] É aconselhável que o responsável pela remoção dos calços não efetue
  tal procedimento até que a operação seja autorizada pelo comandante da aeronave.

  ABASTECIMENTO E TRANSFERÊNCIA DO COMBUSTÍVEL DA AERONAVE

  15.1 A Seção 153.125 do RBAC nº 153 apresenta requisitos referentes ao abastecimento e transferência
  de combustível da aeronave.

  15.2 O parágrafo 153.125(a) do RBAC nº 153 define que o operador de aeródromo deve garantir
