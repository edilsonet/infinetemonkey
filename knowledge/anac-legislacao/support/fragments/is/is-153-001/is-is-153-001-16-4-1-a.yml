section_title: '[FC 153.127(c)] As cargas aéreas, enquanto não embarcadas ou quando já liberadas,
  devem ser armazenadas em locais apropriados para este fim.'
subsection_id: a
cite: 16.4.1(a)
title: 16.4.1(a)
text: 'a) os meios e procedimentos necessários para a coordenação de todas as atividades relacionadas
  ao fluxo de aeronaves, veículos, equipamentos e pessoas na área de movimento, delimitando
  a responsabilidade de cada um dos entes envolvidos e incluindo:

  I) procedimentos para operação em baixa visibilidade, se cabível;

  II) procedimentos de emergência aeroportuária; e

  III) procedimentos de contingência.'
