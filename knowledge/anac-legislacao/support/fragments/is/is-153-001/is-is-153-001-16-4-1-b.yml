section_id: 16.4.1
section_title: '[FC 153.127(c)] As cargas aéreas, enquanto não embarcadas ou quando já liberadas,
  devem ser armazenadas em locais apropriados para este fim.'
subsection_id: b
cite: 16.4.1(b)
title: 16.4.1(b)
text: 'b) quando houver responsáveis distintos para pátio de aeronaves e área de manobras,
  a definição dos seguintes requisitos:

  I) responsabilidades e procedimentos operacionais cabíveis ao ente responsável pelo gerenciamento
  do pátio;

  II) os pontos de transferência (handover points) e os procedimento necessários para a transição
  ordenada da aeronave;

  III) horários de funcionamento do gerenciamento do pátio;'
