text: '16.4.1 [FC 153.127(c)] As cargas aéreas, enquanto não embarcadas ou quando já liberadas,
  devem ser armazenadas em locais apropriados para este fim.

  16.5 [Recomendação] É importante que o operador de aeródromo observe ainda, quando cabível,
  os requisitos constantes em regulamentação específica da ANAC sobre transporte de artigos
  perigosos em aeronaves civis, bem como requisitos de segurança da aviação civil contra atos
  de interferência ilícita. (Vide RBAC nº 107 e RBAC nº 175)

  LIBERAÇÃO DA AERONAVE

  17.1 A Seção 153.129 do RBAC nº 153 refere-se à liberação da aeronave.

  17.2 O parágrafo 153.129(a) do RBAC nº 153 determina que o operador de aeródromo deve assegurar
  o desacoplamento da ponte de embarque e desembarque somente após o fechamento das portas
  da aeronave e conclusão de seu abastecimento.

  17.3 Quando da utilização de escada de embarque/desembarque de pessoas, define o parágrafo
  153.129(b) do RBAC nº 153 que o operador de aeródromo deve assegurar a retirada do equipamento
  somente após a conclusão do abastecimento da aeronave.

  17.4 O parágrafo 153.129(c) do RBAC nº 153 define que o operador de aeródromo deve assegurar
  que veículos, equipamentos e pessoas estejam a uma distância segura de aeronave para que
  não sofram os efeitos da exaustão de gases provenientes dos motores da aeronave quando em
  manobra.

  OPERAÇÃO EM BAIXA VISIBILIDADE

  18.1 Conforme parágrafo 153.1(a)(44) do RBAC nº 153, operação em baixa visibilidade é a
  operação aeroportuária executada em condição de alcance visual de pista de pouso e decolagem
  (RVR) inferior a 350 m (trezentos e cinquenta metros).

  18.2 Os parágrafos 153.131(a) e (h) do RBAC nº 153 definem que o operador de aeródromo que
  pretende operar em condição de baixa visibilidade deve estabelecer um SOCMS com procedimentos
  específicos para tal condição e submetê-lo à autorização da ANAC antes de sua entrada em
  operação.

