title: 16.4.1(d)
text: 'd) definir procedimentos específicos quanto a: (parágrafo 153.131(e)):

  I) especificação dos padrões de movimentação de aeronaves em solo;

  II) medição e divulgação do RVR e de dados meteorológicos;

  III) definição do momento de início da operação com baixa visibilidade;

  IV) fases do processo: preparação, entrada e término;

  V) vistoria de área de movimento para início da operação com baixa visibilidade;

  VI) operação de auxílios luminosos e de docagem;

  VII) restrição de acesso a veículos, equipamentos e pessoas, bem como execução de atividades,
  ao mínimo necessário à execução de operação em baixa visibilidade;

  VIII) adoção de medidas adicionais no caso de aeródromos com configuração complexa.

  18.4 [FC 153.131(e)(1)] Como parte da definição de padrões de movimentação, o operador de
  aeródromo deve estabelecer rotas padronizadas, as quais devem ser publicadas como informações
  aeronáuticas, contendo pelo menos as seguintes informações:'
