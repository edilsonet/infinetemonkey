text: 'f) operação e manutenção das luzes e do sistema de docagem.

  ACORDO OPERACIONAL

  19.1 O parágrafo 153.109(d) do RBAC nº 153 define que o operador de aeródromo e o órgão
  de controle de tráfego aéreo devem estabelecer acordo operacional, o qual conterá procedimentos
  necessários para um fluxo ordenado de aeronaves, veículos, equipamentos e pessoas na área
  de movimento, indicando a responsabilidade de cada um dos entes envolvidos.

  19.2 [FC 153.109(d)] O acordo operacional deve conter pelo menos:'
