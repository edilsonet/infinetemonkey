title: 16.4.1(l)
text: 'l) características únicas do aeródromo e/ou procedimentos locais.

  18.4.1 [Recomendação] Sugere-se que cada rota padronizada seja identificada por designador
  diferente, que varie de acordo com a cabeceira utilizada para decolagem ou pouso e com as
  pistas de táxis utilizadas na rota.

  18.5 [FC 153.131(e)(8)] Em caso de aeródromo com configuração complexa, o operador de aeródromo
  deve determinar, dentro de seus procedimentos específicos do SOCMS para operação em baixa
  visibilidade, qual a pista de pouso e decolagem será utilizada para as operações em tal
  condição, bem como as pistas de táxi utilizadas para estabelecer as rotas padronizadas.

  18.6 [FC 153.109(d)] O acordo operacional para operação em baixa visibilidade deve abordar,
  além do quanto estabelecido para qualquer acordo operacional (vide Seção 19 desta Instrução
  Suplementar) pelo menos os seguintes aspectos:'
