text: '4.1.11 Noite: período compreendido entre as horas do pôr do sol e do nascer do sol.

  4.1.12 Ponto de transferência (handover point): local geográfico na área de movimento que
  estabelece o limite da área de responsabilidade da Torre de Controle de Aeródromo (TWR)
  e do controle de pátio e que define o limite de autorização da movimentação das aeronaves,
  veículos, equipamentos e pessoas.'
