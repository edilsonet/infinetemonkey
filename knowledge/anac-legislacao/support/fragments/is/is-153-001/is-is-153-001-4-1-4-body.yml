text: '4.1.4 Centro de Operações Aeroportuárias (COA): órgão do operador de aeródromo dedicado
  à alocação de aeronaves no pátio.

  4.1.5 Controle de Pátio (Apron Control): serviço estabelecido para controlar as atividades
  e o movimento de aeronaves, veículos, equipamentos e pessoas no pátio de aeronaves.

  4.1.6 Gerenciamento do pátio: conjunto de ações para garantir um movimento seguro e ordenado
  de aeronaves, veículos, equipamentos e pessoas no pátio, tais como provimento de posições
  de estacionamento para as aeronaves, delimitação das áreas para o estacionamento de equipamentos
  e movimentação de veículos e pessoas, orientação dos pilotos durante o estacionamento da
  aeronave e controle da movimentação de aeronaves e veículos.

  4.1.7 Fillet: pavimento adicional provido na junção ou interseção entre pistas de táxi,
  pista de táxi e pátio ou pista de táxi e pista de pouso e decolagem destinado a atender
  aos afastamentos mínimos entre a roda externa do trem de pouso principal e a borda da pista
  de táxi.

  4.1.8 Judgmental Over-Steering: quando uma sinalização horizontal de eixo de pista de táxi
  não prover um raio adequado para a realização da curva por uma dada aeronave, o piloto pode
  intencionalmente direcionar o trem do nariz da aeronave além da sinalização para manter
  o trem de pouso principal dentro dos limites da largura da pista de táxi.'
