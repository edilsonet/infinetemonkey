subsection_id: a
cite: 5.1.5(a)
title: 5.1.5(a)
text: 'a) a quantidade e localização das sinalizações horizontal e vertical, luzes, equipamentos
  de auxílio à navegação aérea e demais facilidades que compõem o SOCMS devem estar adequadas
  à:

  I) condição de visibilidade mais restritiva em que o aeródromo opera;

  II) densidade de tráfego aéreo na hora-pico; e

  III) complexidade de configuração (leiaute) do aeródromo.'
