text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS.

  MOVIMENTAÇÃO NO SOLO

  6.1 A movimentação na área operacional do aeródromo, seja por aeronaves, veículos, equipamentos
  ou pessoas, encontra-se regulamentada nas Seções 153.109 a 153.131 do RBAC nº 153.

  6.2 A depender da classificação dada ao aeródromo pelo Apêndice A do RBAC nº 153, a movimentação
  em solo deve ocorrer de maneira estruturada, por meio de um Sistema de Orientação e Controle
  da Movimentação no Solo (SOCMS).

  6.3 As Seções seguintes desta Instrução Suplementar trazem formas de cumprimento e recomendações
  associadas a cada uma dessas Seções do RBAC nº 153, as quais podem se dar de maneira independente
  ou dentro de um SOCMS, como acima mencionado.

  6.4 Encontra-se disponível no sítio eletrônico da ANAC o “Manual sobre Critérios de Movimentação
  no Solo e o SOCMS”, o qual traz de maneira mais detalhada orientações e melhores práticas
  em relação a todo o conteúdo abordado por esta Instrução Suplementar.

