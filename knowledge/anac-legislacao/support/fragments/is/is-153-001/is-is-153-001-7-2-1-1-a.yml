subsection_id: a
cite: 7.2.1.1(a)
title: 7.2.1.1(a)
text: 'a) Condição 1: visibilidade suficiente para o piloto taxiar e evitar colisão com outro
  tráfego em pistas de táxi e em interseções somente por referência visual e para que o pessoal
  da Torre de Controle do Aeródromo (TWR), caso existente no aeródromo, possa exercer o controle
  sobre todo o tráfego com base apenas em referência visual;'
