text: 'c) Condição 3: condição de alcance visual da pista de pouso e decolagem (RVR) inferior
  a 350 m (trezentos e cinquenta metros), o que corresponde a condição de baixa visibilidade.

  7.2.1.2 O operador de aeródromo deve utilizar a classificação contida no RBAC nº 154, a
  seguir transcrita, em relação à densidade de tráfego aéreo na hora-pico, considerando a
  de maior intensidade caso se enquadre em mais de um critério:'
