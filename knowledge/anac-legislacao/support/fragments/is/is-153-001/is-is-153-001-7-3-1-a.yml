section_title: '[FC 153.109(a)] O SOCMS deve conter pelo menos:'
subsection_id: a
cite: 7.3.1(a)
title: 7.3.1(a)
text: 'a) a responsabilidade dos entes envolvidos na execução dos procedimentos definidos
  para o Sistema, com destaque para os seguintes atores, quando presentes no aeródromo:

  I) operador de aeródromo;

  II) órgão de controle de tráfego aéreo;

  III) Centro de Operações Aeroportuárias (COA);

  IV) motoristas e demais profissionais que atuam na área operacional;

  V) pilotos;

  VI) operadores de hangares e condôminos.'
