family: '153'
section_id: 7.3.1
section_title: '[FC 153.109(a)] O SOCMS deve conter pelo menos:'
subsection_id: b
cite: 7.3.1(b)
title: 7.3.1(b)
text: 'b) procedimentos definidos em relação a:

  I) cumprimento dos requisitos trazidos pelo RBAC nº 153;

  II) comunicação entre órgão de controle de tráfego aéreo, profissionais em solo (do aeródromo
  ou terceiros) e pilotos;

  III) definição e divulgação da condição meteorológica existente no aeródromo, bem como estabelecimento
  dos procedimentos cabíveis quando presente cada uma delas;

  IV) orientação da aeronave desde o início do procedimento de táxi após o pouso completado
  até a posição de estacionamento, bem como da posição de estacionamento até o alinhamento
  na pista de pouso e decolagem para início da decolagem;

  V) movimentação de pessoas, equipamentos e veículos de solo, com especial atenção àquelas
  que possam conflitar com a movimentação de aeronaves;

  VI) definição e divulgação de hot spots;

  VII) procedimentos em caso de emergência aeroportuária, especialmente no que tange à rota
  a ser seguida por veículo de emergência, a qual deve estar desobstruída e ser de fácil acesso
  e identificação, e a prioridade de tráfego desses veículos em relação a qualquer outro e
  a aeronaves.'
