section_id: 7.3.1
section_title: '[FC 153.109(a)] O SOCMS deve conter pelo menos:'
subsection_id: c
cite: 7.3.1(c)
title: 7.3.1(c)
text: 'c) a definição da infraestrutura necessária para dar suporte aos procedimentos e atendimento
  dos objetivos do SOCMS, especialmente no que tange à melhor orientação a pilotos, motoristas
  e pessoas que transitam na área operacional.

  7.3.1.1 [Recomendação] Para facilitar o entendimento do SOCMS por seus usuários, bem como
  a identificação e monitoramento dos elementos aeroportuários, sugere-se que o operador de
  aeródromo estabeleça em desenho adequado o posicionamento dos equipamento, sinalizações
  horizontal e vertical, luzes e demais auxílios e facilidades que compõem o Sistema.

  7.3.2 [Recomendação] Para o estabelecimento do SOCMS recomenda-se que operador de aeródromo
  considere ainda as normas estabelecidas pelo Comando da Aeronáutica, com especial destaque
  para a “ICA 100-12 - Regras do Ar” e “ICA 100-37 - Serviços de Tráfego Aéreo”.

  7.3.3 Encontra-se disponível no sítio eletrônico da ANAC o “Manual sobre Critérios de Movimentação
  no Solo e o SOCMS”, o qual traz de maneira mais detalhada a conceituação do Sistema e orientações
  para sua elaboração e implementação. (clique para acessar o Manual)

  7.4 Elementos do SOCMS'
