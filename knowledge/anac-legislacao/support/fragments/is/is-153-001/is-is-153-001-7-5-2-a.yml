cite: 7.5.2(a)
title: 7.5.2(a)
text: a) o equipamento de radiocomunicação é operacional - quando permite manter comunicação
  bilateral permanente com o órgão ATS, na frequência designada pelo operador de aeródromo,
  ou, no caso de aeródromo não controlado ou naquele que o órgão ATS opere em tempo parcial,
  durante o seu período de indisponibilidade, na Frequência de Coordenação entre Aeronaves
  (FCA) definida nas informações aeronáuticas para o aeródromo;
