title: 7.5.2(b)
text: 'b) acesso e cruzamento de pessoas, veículos e equipamentos na pista de pouso e decolagem
  aberta ao tráfego aéreo.

  10.4 O parágrafo 153.115(c) do RBAC nº 153 determina que operador de aeródromo garanta que
  pessoas, veículos e equipamentos aguardem para o cruzamento ou ingresso em uma pista de
  pouso e decolagem fora da área protegida.

  10.4.1 [FC 153.115(c)] O operador de aeródromo deve delimitar os limites da área protegida,
  sendo sinalizada na parte gramada para que os motoristas e pedestres saibam onde ela termina.

  10.5 O “Manual para Prevenção de Incursão em Pista” traz maior detalhamento e boas práticas
  sobre o tema. (Clique aqui para acessar)

  10.6 [Recomendação] Em complemento aos requisitos desta Seção, recomenda-se que o operador
  de aeródromo considere ainda as normas estabelecidas pelo Comando da Aeronáutica, com especial
  destaque para a “ICA 81-4 - Programa para prevenção de ocorrências de incursão em pista
  na prestação dos serviços de tráfego aéreo”.

  10.7 [Recomendação] Recomenda-se que o operador de aeródromo estabeleça um Runway Safety
  Team (RST) com reuniões periódicas e extraordinárias para analisar e propor soluções para
  os perigos relacionados com a operação na pista de forma integrada e colaborativa com todos
  os envolvidos. Maiores informações sobre o RST podem ser obtidas no sítio eletrônico da
  ANAC, na rede mundial de computadores. (Clique aqui para acessar a página do RST)

  GERENCIAMENTO DO PÁTIO DE AERONAVES

  11.1 A Seção 153.117 do RBAC nº 153 traz requisitos atinentes ao gerenciamento do pátio
  de aeronaves.

  11.2 O parágrafo 153.117(a) do RBAC nº 153 determina que o operador de aeródromo garanta
  a segurança operacional e o funcionamento das atividades descritas nas Seções 153.119 a
  153.129 do RBAC nº 153, mantendo supervisão permanente das atividades desenvolvidas no(s)
  pátio(s) de estacionamento de aeronaves.

  11.3 O parágrafo 153.117(b) do RBAC nº 153 define que o operador de aeródromo deve manter
  comunicação permanente com o órgão ATS do aeródromo, quando houver, com vistas a manter
  coordenação das atividades de auxílio ao tráfego de aeronaves, veículos ou pessoas na área
  de manobras e demais providências necessárias para a segurança operacional das atividades.

  11.4 [FC 153.117(a)] A supervisão das atividades desenvolvidas nos pátios de estacionamento
  pode ser mantida por meio de fiscais ou de forma remota, a fim de garantir o afastamento
  mínimo recomendado entre aeronaves ou entre uma aeronave e outro objetivo.

  11.5 O uso de uma posição de estacionamento por determinada aeronave pode limitar a capacidade
  das posições adjacentes, especialmente quando uma mesma posição utilizar múltiplas linhas
  de roda (“T”), o que interfere no espaçamento entre aeronaves e objetos.

  11.6 [FC 153.117(b)] No caso de implementação do SOCMS, as regras e procedimentos relacionados
  à comunicação permanente com o órgão ATS devem estar materializadas em acordo operacional
  definido pelo parágrafo 153.109(d) do RBAC nº 153 e melhor detalhado em Seção específica
  desta Instrução Suplementar.

  11.7 O parágrafo 153.117(c) do RBAC nº 153 estabelece que o operador de aeródromo deve manter
  supervisão permanente sobre todos os processos e atividades no(s) pátio(s) de estacionamento
  de aeronaves, tomando as providências cabíveis sempre que a segurança operacional for comprometida
  ou algum regulamento descumprido.

  11.8 O parágrafo 153.117(d) do RBAC nº 153 determina que o operador de aeródromo deve manter
  supervisão permanente, quanto a condições operacionais e de credenciamento, de todos os
  veículos e equipamentos que atuem ou trafeguem no(s) pátio(s) de estacionamento de aeronaves,
  tomando as providências cabíveis sempre que a segurança operacional for comprometida ou
  algum regulamento descumprido.

  11.9 O parágrafo 153.117(e) do RBAC nº 153 preleciona que o operador de aeródromo deve manter
  supervisão permanente quanto ao credenciamento e à conduta de todas as pessoas que exerçam
  atividades ou circulem no(s) pátio(s) de estacionamento de aeronaves, tomando as providências
  cabíveis sempre que a segurança operacional for comprometida ou algum regulamento descumprido.

  11.10 [Recomendação] Em virtude de condições operacionais locais, o operador de aeródromo
  poderá estabelecer um Controle de Pátio, cuja área de atuação e responsabilidades serão
  definidas em acordo operacional.'
