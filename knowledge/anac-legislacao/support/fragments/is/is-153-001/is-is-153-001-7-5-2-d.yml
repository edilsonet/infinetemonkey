cite: 7.5.2(d)
title: 7.5.2(d)
text: 'd) comportamento da movimentação de aeronaves e veículos, com a sujeição aos seguintes
  requisitos:

  I) veículos e veículos rebocando aeronaves devem dar passagem a aeronaves em procedimento
  de pouso, decolagem ou taxiamento; e

  II) veículos devem dar passagem a veículos rebocando aeronaves.'
