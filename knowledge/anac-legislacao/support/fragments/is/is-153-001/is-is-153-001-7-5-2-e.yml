text: 'e) publicar a rota padronizada como informação aeronáutica quando a operação de determinada
  aeronave estiver condicionada ao seu uso.

  8.8 [Recomendação] Com o intuito de facilitar a consciência situacional e a atividade de
  monitoramento, sugere-se que seja feita representação em desenho adequado das vias de circulação
  para pedestres e veículos, com indicação de sentidos e velocidades, dentro da área operacional.

  8.9 [Recomendação] Para auxiliar o motorista na manutenção de sua consciência situacional,
  recomenda-se disponibilizar dentro do veículo um mapa exibindo os limites da área de manobras
  e os pontos (realçados) de cruzamento da pista de pouso e decolagem.

  ACESSO E PERMANÊNCIA NA ÁREA DE MANOBRAS

  9.1 A Seção 153.113 do RBAC nº 153 traz requisitos atinentes ao acesso e permanência na
  área de manobras.

  9.2 O parágrafo 153.113(a) do RBAC nº 153 define que o operador de aeródromo deve proibir
  o acesso e a permanência de pessoas não autorizadas na área de manobras.

  9.3 [FC 153.113(a)] O acesso, a permanência e a saída de pessoa, equipamento ou veículo
  da área de manobras deve se dar somente quando autorizado pelo órgão de tráfego aéreo, caso
  existente no aeródromo.

  9.4 [FC 153.113(a)] Em aeródromo não controlado, a pessoa, equipamento ou veículo que pretenda
  acessar ou cruzar a pista de pouso e decolagem deve transmitir tal informação via radiofonia
  na Frequência de Coordenação entre Aeronaves (FCA) designada quando estiver na posição de
  espera de pista de pouso e decolagem. Os procedimentos de comunicação para acessar e livrar
  a pista aplicáveis à FCA são os mesmos utilizados no caso de Torre de Controle.

  9.5 [FC 153.113(a)] Quando parte da área de manobras estiver fechada para obras, os veículos
  poderão atravessá-la sem solicitar autorização, desde que o procedimento esteja previamente
  coordenado com a Torre de Controle do Aeródromo (TWR), no caso de aeródromo controlado.
  No entanto, os veículos da obra devem ser comboiados se o percurso demandar o cruzamento
  de parte da área de manobras que estiver ativa.

  9.6 [Recomendação] Em aeródromos com configuração complexa, sugere-se que o operador de
  aeródromo estabeleça credenciais com diferentes níveis de acesso dentro da área de movimento,
  havendo uma credencial especial para acesso à área de manobras.

  9.7 O parágrafo 153.113(b) do RBAC nº 153 estabelece que o operador de aeródromo deve permitir
  o tráfego e a permanência na área de manobras somente de pessoas que atendam aos requisitos
  de qualificação e treinamento estabelecidos, respectivamente, nas Seções 153.35 e 153.37
  daquele Regulamento e demais normas vigentes e que pessoa sem qualificação e treinamento
  exigidos somente transite ou permaneça na área de manobras com o acompanhamento e supervisão
  de pessoa capacitada.

  9.8 O parágrafo 153.113(d) do RBAC nº 153 define que o operador de aeródromo deve assegurar
  que as pessoas envolvidas em atividades de operação na área de manobras estejam capacitadas
  a usar a radiocomunicação e utilizem fraseologia por radiotelefonia (RTF).

  9.9 [Recomendação] É importante que pessoa que acesse ou permaneça na área de manobras esteja
  permanentemente atenta a todas as instruções advindas da Torre de Controle (TWR), se aeródromo
  controlado, ou da FCA, em caso de aeródromo não controlado, e não somente àquelas instruções
  relacionadas à sua própria solicitação, estando, assim, ciente de todos os movimentos que
  estão ocorrendo, bem como daqueles pretendidos, em toda área de movimento. Tal conduta visa
  reduzir o risco de conflito de tráfego e aumenta sua consciência situacional.

  9.10 O parágrafo 153.113(e) do RBAC nº 153 estabelece que pessoa, veículo ou equipamento
  deve manter, durante a execução de sua atividade na área de manobras, comunicação bilateral
  permanente com o órgão ATS, na frequência designada pelo operador de aeródromo, ou, no caso
  de aeródromo não controlado ou naquele que o órgão ATS opere em tempo parcial, durante o
  seu período de indisponibilidade, na Frequência de Coordenação entre Aeronaves (FCA) definida
  nas informações aeronáuticas para o aeródromo.

  9.11 [FC 153.113(e)] O equipamento de radiocomunicação ligado na frequência do canal de
  comunicação com o órgão ATS, se aeródromo controlado, ou na FCA, em caso de aeródromo não
  controlado ou no período de indisponibilidade do órgão ATS se aeródromo controlado, deve
  permanecer com o indivíduo que acessar ou se mantiver na área de manobras, ainda que seja
  necessária sua saída de veículo ou equipamento.

  9.12 O parágrafo 153.113(c) do RBAC nº 153 define que o operador de aeródromo deve proibir
  o acesso e permanência na área de manobras de pessoas, veículos e equipamentos que não portem
  ou possuam equipamento de radiocomunicação operante, com alcance em toda a área operacional
  do aeródromo e clareza de áudio.

  9.13 [FC 153.113(c)] O equipamento de radiocomunicação, portátil e móvel veicular, atende
  aos requisitos de operacionalidade, alcance em toda área operacional e clareza de áudio
