  de exaustão de gases dos motores das aeronaves posicionadas em direção a edificações, equipamentos,
  veículos e pessoas, durante operações aéreas, não ultrapasse 56 km/h quando atingir estes
  elementos (parágrafo 153.111(h) do RBAC nº 153).

