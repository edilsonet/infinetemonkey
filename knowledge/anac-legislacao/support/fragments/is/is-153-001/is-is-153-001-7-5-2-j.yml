text: 'j) respeito aos auxílios visuais e regras de tráfego no aeródromo, a menos que autorizado
  de maneira diversa pelo órgão de controle de tráfego aéreo, se na área de manobras, ou pelo
  operador de aeródromo no restante da área operacional.

  8.5 [FC 153.109(a) e 153.111(a) e (g)] O operador de aeródromo deve definir procedimentos
  a serem seguidos por pessoa, equipamento ou veículo em caso de perda da consciência situacional
  na área de movimento ou de falha de comunicação, devendo informar sempre que estiver perdido
  ou inseguro quanto à sua exata localização.

