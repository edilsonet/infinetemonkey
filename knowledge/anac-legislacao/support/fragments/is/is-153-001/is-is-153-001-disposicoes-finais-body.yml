title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  21.1 Os casos omissos serão dirimidos pela ANAC.

  21.2 Esta IS entra em vigor em 2 de maio de 2023.

  REFERÊNCIAS BIBLIOGRÁFICAS

  22.1 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil Nº 153 -
  Aeródromos - operação, manutenção e resposta à emergência. Emenda nº 07, de 14 de abril
  de 2023. Brasília: ANAC, 2023. Disponível em https://www.anac.gov.br/assuntos/legislacao/
  legislacao-1/rbha-e-rbac. Acesso em: 20 abr. 2023.

  22.2 Departamento de Controle de Tráfego Aéreo. CIRCEA 100-86 - Fraseologia aeronáutica
  a ser utilizada nas comunicações entre o controle de aeródromo e os condutores de veículos
  ou outros serviços para operar na área de manobras. Aprovada pela Portaria DECEA nº 265
  / DGCEA, de 13 de novembro de 2020, publicada no BCA nº 210, de 19 de novembro de 2020.
  Brasil: DECEA, 2020. 20 p. Disponível em: <https://publicacoes.decea.mil.br/publicacao/circea-100-86..
  Acesso em: 04 nov. 2021.

  22.3 Departamento de Controle de Tráfego Aéreo. ICA 100-37 - Serviços de tráfego aéreo.
  Aprovada pela PORTARIA DECEA nº 256/DGCEA, de 10 de novembro de 2020, publicada no BCA nº
  210, de 19 de novembro de 2020. Brasil: DECEA, 2020. Disponível em: <https://publicacoes.decea.mil.br/publicacao/ica-100-37>.
  Acesso em: 04 nov. 2021.

  22.4 Departamento de Controle de Tráfego Aéreo. ICA 100-12 - Regras do ar. Aprovada pela
  Portaria DECEA nº 204/DGCEA, de 8 de novembro de 2018, publicada no BCA nº 212, de 5 de
  dezembro de 2018. Brasil: DECEA, 2018. Disponível em: <https://publicacoes.decea.mil.br/publicacao/ica-100-12>.
  Acesso em: 04 nov. 2021.

  22.5 Departamento de Controle de Tráfego Aéreo. MCA 100-16 - Fraseologia de tráfego aéreo.
  Portaria DECEA nº 290 /DGCEA, de 1º de dezembro de 2020. Republicado no BCA nº 225 de 10
  de dezembro de 2020. Brasil: DECEA, 2018 Disponível em: <https://publicacoes.decea.mil.br/publicacao/ica-100-37>.
  Acesso em: 04 nov. 2021.

  22.6 International Civil Aviation Organization. Annex 14 to the Convention on International
  Civil Aviation: Aerodromes - Volume I, Aerodrome Design and Operations. 8th ed. Montréal:
  ICAO, July 2018.

  22.7 International Civil Aviation Organization. DOC 9476-AN/927 - Manual of Surface Movement
  Guidance and Control Systems (SMGCS). 1st ed. Montréal: ICAO, 1986.

  22.8 International Civil Aviation Organization. DOC 9830-AN/452 -Advanced Surface Movement
  Guidance and Control Systems (A-SMGCS) Manual. 1st ed. Montréal: ICAO, 2004.

  22.9 International Civil Aviation Organization. DOC 9432-AN/925 - Manual of Radiotelephony.
  4th ed. Montréal: ICAO, 2007.'
