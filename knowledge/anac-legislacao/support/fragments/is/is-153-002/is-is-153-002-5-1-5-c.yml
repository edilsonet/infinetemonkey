text: 'c) manutenção corretiva.

  6.1.4 [Recomendação] Com vistas a facilitar a atividade de monitoramento, recomenda-se que
  o operador de aeródromo elabore desenho onde sejam evidenciados os elementos do sítio aeroportuário
  que compõem os subsistemas ou programas de manutenção.

  6.1.5 [FC 153.201(b) e (c)] O sistema de manutenção aeroportuária deve ser dividido em subsistemas
  ou programas, de maneira a abordar minimamente as áreas definidas no parágrafo 153.201(b)
  do RBAC nº 153 e reproduzidas no parágrafo 6.1.2 desta Instrução Suplementar, bem como as
  atividades de monitoramento, manutenção preventiva e manutenção corretiva exigidas pelo
  parágrafo 153.201(c) do Regulamento e mencionadas no parágrafo 6.1.3, acima.

  6.1.5.1 Cada programa de manutenção referente a elementos elencados no parágrafo 153.201(b)
  do RBAC nº 153 (vide parágrafo 6.1.2 desta Instrução Suplementar) deve atender aos seguintes
  requisitos:'
