title: 6.1.5.2(b)
text: 'b) os dados obtidos e armazenados, decorrentes dos processos constantes nos programas
  de manutenção, podem ser encaminhados para:

  I) o órgão responsável por divulgá-los como informações aeronáuticas;

  II) o responsável pelo gerenciamento da segurança operacional no aeródromo;

  III) as demais atividades operacionais do aeródromo; e

  IV) outros que o operador de aeródromo julgar pertinente.

  6.1.6 A seguir serão detalhadas as áreas que devem ser abordadas no sistema de manutenção,
  tal como preconiza o parágrafo 153.201(b) do RBAC nº 153, reproduzido no parágrafo 6.2 desta
  Instrução Suplementar.

  6.1.7 Destaca-se, ainda, que os elementos a seguir definidos poderão também ser tratados
  de maneira individualizada, desde que permitido pelo Apêndice A do RBAC nº 153.

  6.2 Área pavimentada - generalidades

  6.2.1 A Seção 153.203 do RBAC nº 153 traz requisitos aplicáveis a áreas pavimentadas de
  maneira geral, incluindo, portanto, pista de pouso e decolagem, pista de táxi, estacionamento
  de aeronaves e vias de circulação de veículos, equipamentos e pessoas.

  6.2.2 O parágrafo 153.203(a) do RBAC nº 153 determina que o operador de aeródromo deve manter
  as áreas pavimentadas em condições operacionais visando à adequada operação e à proteção
  de:'
