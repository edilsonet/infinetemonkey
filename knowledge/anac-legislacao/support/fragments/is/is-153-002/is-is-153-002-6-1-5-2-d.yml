text: 'd) equipamentos aeronáuticos e aeroportuários.

  6.2.3 O parágrafo 153.203(b)(1)(i)(A) do RBAC nº 153 estabelece que o operador de aeródromo
  deve manter as condições estruturais das áreas pavimentadas inseridas na área operacional,
  devendo apresentar avaliação estrutural específica quando identificado risco operacional
  específico por meio de seu gerenciamento de risco ou pela ANAC.

  6.2.4 O parágrafo 153.203(b)(1)(i)(B) do RBAC nº 153 preleciona que o operador de aeródromo
  deve manter as condições funcionais das áreas pavimentadas inseridas na área operacional.

  6.2.4.1 Em relação à funcionalidade do pavimento, deve ser observado, além do que consta
  nos parágrafos 153.203(b)(1)(ii) a (v) do RBAC nº 153, também o que versa a Instrução Suplementar
  - IS nº 153.203-001, que apresenta formas de cumprimento e recomendações atinentes ao parágrafo
  153.203(b)(1)(i)(B). (Vide IS nº 153.203-001)

  6.2.5 O parágrafo 153.203(b)(2) do RBAC nº 153 define que o operador de aeródromo deve manter
  a superfície das áreas pavimentadas livre de defeitos que possam causar FOD, perda do controle
  direcional das aeronaves e danos à integridade dos equipamentos aeronáuticos, devendo monitorar
  os defeitos no pavimento por meio de inspeções visuais regulares.

  6.2.6 O parágrafo 153.203(b)(3) do RBAC nº 153 trata de desníveis, depressões e deformações
  no pavimento, estabelecendo que o operador de aeródromo deve manter:'
