section_title: 'O parágrafo 153.219(a) do RBAC nº 153 determina que o operador de aeródromo
  deve manter o sistema elétrico em condições operacionais, objetivando:'
subsection_id: a
cite: 6.10.2(a)
title: 6.10.2(a)
text: 'a) manter a entrada de energia secundária de maneira a:

  I) atender aos requisitos estabelecidos na Tabela F-1 do RBAC nº 154; e

  II) garantir a contínua disponibilidade dos recursos do SESCINC mencionados no parágrafo
  153.425(b) e na Seção 153.427, ambos do RBAC nº 153;'
