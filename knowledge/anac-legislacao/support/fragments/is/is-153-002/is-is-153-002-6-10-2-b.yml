section_title: 'O parágrafo 153.219(a) do RBAC nº 153 determina que o operador de aeródromo
  deve manter o sistema elétrico em condições operacionais, objetivando:'
subsection_id: b
cite: 6.10.2(b)
title: 6.10.2(b)
text: 'b) a continuidade da alimentação dos equipamentos essenciais à navegação aérea.

  6.10.3 O parágrafo 153.219(b) do RBAC nº 153 destaca que o sistema elétrico que constitui
  o escopo daquela Seção do Regulamento é aquele que alimenta os equipamentos que auxiliam
  a navegação aérea, a movimentação de aeronaves e as instalações da Seção Contraincêndio
  (SCI) e, onde existir, do Posto Avançado Contraincêndio (PACI).

  6.10.4 Os parágrafos 153.219(c) e (d) do RBAC nº 153 determinam que operador de aeródromo
  deve atender ao estabelecido no parágrafo 153.219(a), reproduzido no parágrafo 6.10.2 desta
  Instrução Suplementar, e aos seguintes requisitos:'
