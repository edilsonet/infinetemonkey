section_id: 6.10.2
section_title: 'O parágrafo 153.219(a) do RBAC nº 153 determina que o operador de aeródromo
  deve manter o sistema elétrico em condições operacionais, objetivando:'
subsection_id: c
cite: 6.10.2(c)
title: 6.10.2(c)
text: 'c) manter ações de monitoramento e manutenção preventiva para os circuitos e componentes
  dos sistemas elétricos de modo a preservar a eficácia e a continuidade da energia fornecida.

  6.10.5 [Recomendação] Sugere-se que, em relação à manutenção da condição operacional dos
  sistemas elétricos, o operador de aeródromo observe as orientações trazidas pelo “Manual
  de Sistemas Elétricos em Aeródromos” disponível no sítio eletrônico da ANAC, na rede mundial
  de computadores. (Vide Manual de Sistemas Elétricos)

  6.11 Proteção da área operacional

  6.11.1 A Seção 153.221 do RBAC nº 153 refere-se à manutenção do sistema de proteção da área
  operacional em condições físicas e de funcionamento, de modo a atender aos requisitos estabelecidos
  na Seção 153.107 de sobredito Regulamento.'
