text: '6.12.1 A Seção 153.223 do RBAC nº 153 apresenta requisitos referentes a equipamentos,
  veículos e sinalização viária da área operacional.

  6.12.2 Destacam os parágrafos 153.223(a)(1)(i) e (ii) do RBAC nº 153 que os equipamentos
  e veículos que contemplam o programa de manutenção do aeródromo são aqueles usados nos serviços
  exclusivos do operador de aeródromo. Devem, porém, os serviços terceirizados terem seus
  programas de manutenção de equipamentos e veículos que atuam na área operacional compatíveis
  com o do operador de aeródromo.

  6.12.3 O parágrafo 153.223(c)(2) do RBAC nº 153 define que a sinalização viária a que se
  refere a Seção 153.223 do Regulamento mencionado são aquelas que se encontram nas vias de
  circulação de veículos, equipamentos e pessoas dentro da área de movimento ou adjacentes
  a esta.

  6.12.3.1 Requisitos de sinalização horizontal viária definidos na Seção 153.223 do Regulamento
  não são aplicáveis às vias não-pavimentadas de circulação de veículos, equipamentos e pessoas.

  6.12.4 Quanto aos equipamentos e veículos que atuam na área operacional, estabelecem o parágrafo
  153.223(a) do RBAC nº 153 que o operador de aeródromo deve manter:'
