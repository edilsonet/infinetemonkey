  6.12.5 No que tange aos Trajes de Proteção (TP) e aos Equipamentos de Proteção Respiratória
  (EPR), define o parágrafo 153.223(b)(1) do RBAC n º153 que o operador de aeródromo deve
  mantê-los de maneira a garantir sua operacionalidade em conformidade com os requisitos estabelecidos
  no manual do fabricante.

  6.12.6 A sinalização viária inserida na área operacional encontra-se disciplinada no parágrafo
