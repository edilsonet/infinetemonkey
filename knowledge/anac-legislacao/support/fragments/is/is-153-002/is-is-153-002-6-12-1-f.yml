title: 6.12.1(f)
text: 'f) quanto à sinalização vertical viária:

  I) manter condições adequadas de visibilidade e contraste da placa informativa; e

  II) manter integridade do suporte, da fixação e da placa informativa.

  6.12.7 Em relação à manutenção dos equipamentos de comunicação, deve o operador de aeródromo
  observar o quanto estabelecido em Instrução Suplementar nº 153-001. (Vide IS nº 153-001)

  6.13 Não conformidade com determinados requisitos da Subparte E do RBAC nº 153

  6.13.1 Estabelece o parágrafo 153.201(f) do RBAC nº 153 que, quando as finalidades estabelecidas
  nos parágrafos 153.203(a), 153.205(a), 153.207(a), 153.211(a), 153.211(b), 153.217(a), 153.219(a)
  e 153.221(a) daquele Regulamento não forem atendidas, o operador de aeródromo deve realizar
  uma avaliação técnica e de segurança operacional, tendo como possíveis ações, sem prejuízo
  de aplicação das eventuais sanções previstas no Código Brasileiro de Aeronáutica e nos demais
  regulamentos:'
