section_title: 'O parágrafo 153.203(b)(4) do RBAC nº 153 trata de juntas no pavimento, estabelecendo
  que o operador de aeródromo deve:'
subsection_id: c
cite: 6.2.7(c)
title: 6.2.7(c)
text: 'c) monitorar as juntas do pavimento por meio de inspeções regulares.

  6.2.8 O parágrafo 153.203(b)(5)(i) do RBAC nº 153 determina que o operador de aeródromo
  deve remover contaminantes do pavimento sempre que identificado por meio de processo de
  monitoramento contido no parágrafo 153.133(b)(2) daquele Regulamento, não utilizando, para
  tanto, produtos químicos que possam ter efeitos nocivos sobre as aeronaves, ao pavimento
  ou ao meio ambiente

  6.2.9 [Recomendação] Quando presente grooving no pavimento aeroportuário, é aconselhável
  que o operador de aeródromo observe as orientações trazidas pelo “Manual de Projeto, Execução
  e Manutenção de Grooving em Pavimentos Aeroportuários” disponível no sítio eletrônico da
  ANAC na rede mundial de computadores. (Vide Manual de Grooving)

  6.2.10 O parágrafo 153.203(c) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  e documentar requisitos e procedimentos de monitoramento e avaliação do estado do pavimento
  baseados em metodologia de sistema de gerenciamento de pavimentos, a fim de manter as condições
  estruturais e funcionais e cumprir os requisitos estabelecidos nas Seções 153.203, 153.205,
  153.207 e 153.215 daquele Regulamento.

  6.2.11 [Recomendação] Para os aeródromos cuja aplicabilidade do parágrafo 153.203(c) do
  RBAC nº 153 é obrigatória, sugere-se que o operador de aeródromo observe as orientações
  trazidas pelo “Manual de Sistema de Gerenciamento de Pavimentos Aeroportuários - SGPA”,
  disponível no sítio eletrônico da ANAC na rede mundial de computadores. (Vide Manual do
  SGPA)

  6.2.12 [Recomendação] É importante que, ao elaborar seu sistema de manutenção aeroportuária,
  o operador de aeródromo também considere aspectos atinentes ao planejamento e execução de
  serviços de manutenção ou de obra necessária ao restabelecimento da condição física e operacional
  do elemento aeroportuário. Para tanto, deve ser observado o disposto nas Seções 153.225
  a 153.229 do RBAC nº 153, recomendando-se, ainda, leitura do conteúdo do “Manual de Obras
  e Serviços de Manutenção”. (Vide Manual de Obras e Serviços)

  6.3 Área pavimentada - pista de pouso e decolagem

  6.3.1 A Seção 153.205 do RBAC nº 153 é voltada especificamente para as áreas pavimentadas
  das pistas de pouso e decolagem, trazendo requisitos complementares aos já exigidos na Seção
  153.203.

  6.3.2 O parágrafo 153.205(a) do RBAC nº 153 determina que o operador de aeródromo deve manter
  a pista de pouso e decolagem em condições operacionais visando à resistência à derrapagem,
  ao controle direcional das aeronaves e à integridade dos equipamentos aeronáuticos, devendo,
  para tanto, considerar os aspectos definidos no parágrafo 153.203(b) daquele Regulamento
