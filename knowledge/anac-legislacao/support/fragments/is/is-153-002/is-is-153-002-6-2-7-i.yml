section_title: 'O parágrafo 153.203(b)(4) do RBAC nº 153 trata de juntas no pavimento, estabelecendo
  que o operador de aeródromo deve:'
subsection_id: i
cite: 6.2.7(i)
title: 6.2.7(i)
text: 'i) drenagem do pavimento.

  6.3.3 O parágrafo 153.205(e) do RBAC nº 153 estabelece que o operador de aeródromo deve
  manter a pista de pouso e decolagem livre de desníveis, depressões ou deformações que alterem
  suas declividades transversais ou longitudinais originais, propiciando o acúmulo de água
  e a perda do controle direcional das aeronaves.

  6.3.3.1 Se a profundidade média de água exceder 3 mm (três milímetros) numa região de 150
  m (cento e cinquenta metros) de comprimento por 12 m (doze metros) de largura na porção
  central em relação ao eixo da pista, o operador de aeródromo deve providenciar ações corretivas
  na referida região, a fim de garantir que a pista tenha drenagem suficiente para não acumular
  água acima do valor de 3 mm (três milímetros).

  6.3.4 Os parágrafos 153.205(f), (g) e (h) do RBAC nº 153 regulamentam, respectivamente,
  aspectos atinentes à irregularidade longitudinal, atrito e macrotextura da pista de pouso
  e decolagem. A Instrução Suplementar nº 153.205-001 vem disciplinar tal conteúdo, trazendo
  formas de cumprimento e recomendações. (Vide IS nº 153.205-001)

  6.3.5 O parágrafo 153.205(i) do RBAC nº 153 apresenta requisitos relacionados ao acúmulo
  de borracha na pista de pouso e decolagem, os quais definem que o operador de aeródromo
  deve:'
