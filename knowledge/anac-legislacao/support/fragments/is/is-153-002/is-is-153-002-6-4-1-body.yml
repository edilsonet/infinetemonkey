title: A Seção 153.207 do RBAC nº 153 é voltada especificamente para as áreas pavimentadas
  das pistas de táxi e dos pátios de estacionamento de aeronaves.
text: '6.4.1 A Seção 153.207 do RBAC nº 153 é voltada especificamente para as áreas pavimentadas
  das pistas de táxi e dos pátios de estacionamento de aeronaves.

  6.4.2 O parágrafo 153.207(a) do RBAC nº 153 define que o operador de aeródromo deve manter
  pista de táxi e pátio de estacionamento de aeronaves em condições de segurança operacional
  visando ao controle direcional das aeronaves e à integridade dos equipamentos aeronáuticos.

  6.4.3 Os demais requisitos se encontram estabelecidos na Seção 153.203 daquele Regulamento,
  os quais se encontram dispostos na Seção 6.2 desta Instrução Suplementar.

  6.5 Área pavimentada - vias de circulação de veículos, equipamentos e pessoas

  6.5.1 A Seção 153.209 do RBAC nº 153 é voltada especificamente para as áreas pavimentadas
  das vias de circulação de veículos, equipamentos e pessoas, trazendo requisitos complementares
  aos já exigidos na Seção 153.203 daquele Regulamento.

  6.5.2 O parágrafo 153.209(a) do RBAC nº 153 determina que o operador de aeródromo deve manter
  as condições de trafegabilidade das vias pavimentadas de circulação de veículos, equipamentos
  e pessoas.

  6.5.3 O parágrafo 153.209(b) do RBAC nº 153 estabelece que o operador de aeródromo deve
  manter as vias de circulação de veículos, equipamentos e pessoas livre de desníveis, depressões
  ou deformações que alterem suas declividades transversais ou longitudinais originais ou
  propiciem a perda do controle direcional dos veículos e equipamentos.

  6.6 Área não pavimentada'
