section_title: 'A pista de pouso e decolagem não pavimentada composta por cascalho deve ser:'
subsection_id: c
cite: 6.6.6.1.1(c)
title: 6.6.6.1.1(c)
text: 'c)mantida com a superfície compactada, reduzindo a passagem de fluidos e aumentando
  sua capacidade de impermeabilidade.

  6.6.6.1.2 [Recomendação] Para atendimento ao exigido no item anterior, relativo à pista
  de pouso e decolagem não pavimentada formada por cascalho, recomenda-se a adoção das faixas
  granulométricas indicadas na tabela a seguir:


  Tabela 1 - Faixas granulométricas

  Passar na Peneira (mm)

  %

  25

  100

  19

  entre 70 e 100

  2

  entre 40 e 70

  0,425

  entre 20 e 45

  0,075

  entre 10 e 20

  6.6.6.1.3 [Recomendação] Com vistas a manter regularizada e compactada a superfície da pista
  de pouso e decolagem composta por cascalho, mantendo-a o mais impermeável possível, sugere-se
  que o operador de aeródromo considere possíveis complementações de materiais para manutenção
  de espessura de materiais agregados, com as devidas compactações.'
