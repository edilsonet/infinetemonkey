title: Demais tipos de superfície
text: '6.6.6.3 Demais tipos de superfície

  6.6.6.3.1 No caso de utilização de outros tipos de superfície, tais como saibro e areia,
  o operador de aeródromo deve avaliar questões técnicas, principalmente quanto a aderência,
  suporte e deformabilidade da superfície.

  6.6.7 Estabelece o parágrafo 153.211(d) do RBAC nº 153 que as vias de circulação de veículos,
  equipamentos e pessoas devem ser mantidas de maneira a preservar as condições de trafegabilidade
  e o atendimento das finalidades definidas no parágrafo 153.211(a) do RBAC nº 153 e reproduzidas
  no item 6.6.2 desta Instrução Suplementar.

  6.6.8 O parágrafo 153.211(e) do RBAC nº 153 define que a faixa preparada e a área de segurança
  de fim de pista (RESA) devem ser mantidas niveladas, sem sulcos, saliências, depressões
  ou outras variações de superfície que possam comprometer as finalidades definidas no parágrafo
  153.211(a) e reproduzidas no item 6.6.2 desta Instrução Suplementar.

  6.6.9 O parágrafo 153.211(f) do RBAC nº 153 determina que o operador de aeródromo deve monitorar
  a pista de pouso e decolagem, pista de táxi e pátio de estacionamento de aeronaves por meio
  de inspeções regulares.

  6.7 Áreas verdes'
