section_title: 'O parágrafo 153.213(a) do RBAC nº 153 define que o operador de aeródromo deve
  manter as áreas verdes inseridas na área operacional de maneira a:'
subsection_id: d
cite: 6.7.2(d)
title: 6.7.2(d)
text: 'd) não comprometer o fluxo do sistema de drenagem.

  6.7.3 O parágrafo 153.213(b) do RBAC nº 153 estabelece que o operador de aeródromo deve
  observar, no que tange à manutenção das áreas verdes por meio do controle de vegetação,
  o que determina a Subparte H do RBAC nº 153 e a Instrução Suplementar nº 153.501-001. (Vide
  IS nº 153.501-001)

  6.8 Sistema de drenagem'
