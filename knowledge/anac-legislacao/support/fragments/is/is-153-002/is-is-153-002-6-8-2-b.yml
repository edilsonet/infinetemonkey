section_id: 6.8.2
section_title: 'O parágrafo 153.215(a) do RBAC nº 153 determina que o operador de aeródromo
  deve manter o sistema de drenagem visando:'
subsection_id: b
cite: 6.8.2(b)
title: 6.8.2(b)
text: 'b) manter as ranhuras transversais (grooving), quando houver, em condições que não
  comprometam a drenabilidade da pista; (Vide IS nº 153.205-001)

  I) Caso a as ranhuras transversais (grooving) estejam em condições que comprometam a drenabilidade
  da pista, o operador de aeródromo deve solicitar divulgação de informação aeronáutica de
  indisponibilidade das ranhuras transversais (grooving).'
