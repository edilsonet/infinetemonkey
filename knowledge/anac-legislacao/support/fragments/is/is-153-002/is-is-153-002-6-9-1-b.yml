kind: is
document: is-153-002
family: '153'
section_id: 6.9.1
section_title: A Seção 153.217 do RBAC nº 153 traz requisitos atinentes aos auxílios visuais
  para navegação aérea e indicação de áreas de uso restrito.
subsection_id: b
cite: 6.9.1(b)
title: 6.9.1(b)
text: 'b) manter a integridade da sinalização horizontal quanto à sua visualização, de maneira
  a não propiciar as seguintes condições:

  I) em 20 m (vinte metros) consecutivos longitudinais às linhas ou faixas - perda de pigmentação
  da sinalização, desagregação parcial da sinalização ou depósito de material não original
  sobre a sinalização, de forma a não permitir sua perfeita visualização, excetuando-se a
  sinalização de ponto de visada quanto ao acúmulo de borracha;

  II) em 5 m (cinco metros) consecutivos longitudinais às linhas ou faixas - desagregação
  total da sinalização de forma a não permitir sua perfeita visualização;'
