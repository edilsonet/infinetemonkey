text: '6.9.1 A Seção 153.217 do RBAC nº 153 traz requisitos atinentes aos auxílios visuais
  para navegação aérea e indicação de áreas de uso restrito.

  6.9.2 O parágrafo 153.217(a) do RBAC nº 153 define que o operador de aeródromo deve manter
  os auxílios visuais em condições físicas e operacionais, objetivando a visualização, identificação
  e entendimento do auxílio visual por parte do piloto e pessoal em solo, bem como da infraestrutura
  ao qual estiver associado, se for o caso, trazendo em seu subparágrafo 153.217(a)(1) a lista
  de auxílios visuais sobre os quais tal comando não se aplica.

  6.9.3 O parágrafo 153.217(b) do RBAC nº 153 elenca os auxílios visuais a serem considerados,
  os quais são descritos conforme requisitos constantes na Subparte D e Subparte E do RBAC
  nº 154:'
