section_title: A Seção 153.217 do RBAC nº 153 traz requisitos atinentes aos auxílios visuais
  para navegação aérea e indicação de áreas de uso restrito.
subsection_id: d
cite: 6.9.1(d)
title: 6.9.1(d)
text: 'd) manter ações de monitoramento e manutenção preventiva, de modo a preservar a eficácia
  e continuidade das informações.

  6.9.9 O parágrafo 153.217(g) do RBAC nº 153 determina que o operador de aeródromo deve,
  quanto às balizas, atender aos requisitos apontados no parágrafo 153.217(a) daquele Regulamento,
  transcrito no 6.9.2 desta Instrução Suplementar, bem como preservar sua integridade física
  e sua fixação no solo.

  6.9.10 O parágrafo 153.217(h) do RBAC nº 153 estipula que o operador de aeródromo deve,
  para indicadores de áreas de uso restrito, atender aos requisitos apontados no parágrafo
  153.217(a) do Regulamento, reproduzidos no 6.9.2 desta Instrução Suplementar, bem como:'
