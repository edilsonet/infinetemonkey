text: 'e) manter o grau de contraste (conspicuidade) entre a sinalização horizontal e o pavimento
  de modo a possibilitar sua integral visualização pelo piloto e demais usuários da área operacional.

  6.9.6 [FC 153.217(d)(1)(v)] Para manter o grau de contraste (conspicuidade) entre a sinalização
  horizontal e o pavimento, de modo a possibilitar sua integral visualização pelo piloto e
  demais usuários da área operacional, deve o operador de aeródromo atender ao quanto disposto
  no “RBAC nº 154 - Projeto de Aeródromos”.

  6.9.6.1 Encontra-se disponível no sítio eletrônico da ANAC o “Manual sobre critérios de
  movimentação no solo e o SOCMS”, o qual traz de maneira mais detalhada, em seu Apêndice
  A, considerações sobre o grau de contraste entre a sinalização horizontal e o pavimento.
  (clique para acessar o Manual)

  6.9.7 Em relação às luzes, define o parágrafo nº 153.217(e) do RBAC nº 153 que o operador
  de aeródromo deve atender aos requisitos apontados no parágrafo 153.217(a) do Regulamento,
  transcrito no 6.9.2 desta Instrução Suplementar, bem como:'
