title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  8.1 Os casos omissos serão dirimidos pela ANAC.

  8.2 Esta IS entra em vigor em 2 de maio de 2023.

  REFERÊNCIAS BIBLIOGRÁFICAS

  9.1 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil Nº 153 -
  Aeródromos - operação, manutenção e resposta à emergência. Emenda nº 07, de 14 de abril
  de 2023. Brasília: ANAC, 2023. Disponível em https://www.anac.gov.br/assuntos/legislacao/
  legislacao-1/rbha-e-rbac. Acesso em: 20 abr. 2023.

  9.2 Transport Canada Civil Authority. Advisory Circular (AC) 300-004, Unpaved Runway Surfaces.
  Canada: TCCA, 2017. 21 p. Disponível em: <https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-300-004>.
  Acesso em: 09 nov. 2021.

  9.3 Transport Canada Civil Authority. Advisory Circular (AC) 300-004, Unpaved Runway Surfaces.
  Canada: TCCA, 2017. 21 p. Disponível em: <https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-300-004>.
  Acesso em: 09 nov. 2021.

  9.4 Transport Canada Civil Authority. Circular (AC) 700-011, Operations on Runways with
  Unpaved Surfaces. Canada: TCCA, 2012, 11 p. Disponível em: <https://tc.canada.ca/en/aviation/reference-centre/advisory-circulars/advisory-circular-ac-no-700-011>.
  Acesso em: 09 nov. 2021.'
