cite: 5.1.5(b)
title: 5.1.5(b)
text: 'b) contenção de acesso não autorizado, premeditado ou inadvertido, de veículos e pessoas.

  6.1.2 Estabelece o parágrafo 153.107(b) do RBAC nº 153 que a definição das características
  e do tipo de sistema ou da infraestrutura de proteção à operação aeroportuária deve ser
  estabelecida pelo operador do aeródromo de acordo com a complexidade e o risco específico
  do seu aeródromo, desde que sejam capazes de atender às finalidades descritas no parágrafo
  153.107(a) e acima reproduzidas.'
