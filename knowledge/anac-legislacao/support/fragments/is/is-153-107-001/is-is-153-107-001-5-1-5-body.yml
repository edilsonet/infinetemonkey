  CARACTERÍSTICAS FÍSICAS DAS BARREIRAS DE PROTEÇÃO DA ÁREA OPERACIONAL

  6.1 Generalidades

  6.1.1 O parágrafo 153.107(a) do RBAC nº 153 determina que o operador de aeródromo deve implantar
  e manter um sistema de proteção da área operacional do aeródromo e suas respectivas operações
  aéreas, composto de infraestrutura e procedimentos adequados ao entorno urbano no qual o
  sítio aeroportuário encontra-se, para:'
