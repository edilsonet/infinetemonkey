section_title: '[FC 153.107(b)] A infraestrutura do sistema de proteção da área operacional
  deve ser composta por um ou mais dos seguintes elementos:'
subsection_id: c
cite: 6.1.3(c)
title: 6.1.3(c)
text: 'c) impedir que se passe por baixo, com sua base fortemente fixada ou rente ao solo.

  6.2.2 [FC 153.107(a)] As barreiras de segurança artificiais devem ser instaladas por toda
  a extensão do perímetro operacional do sítio aeroportuário, podendo ser dispensadas onde
  houver barreiras de segurança naturais, conforme tratado no parágrafo 6.3 desta Instrução
  Suplementar.'
