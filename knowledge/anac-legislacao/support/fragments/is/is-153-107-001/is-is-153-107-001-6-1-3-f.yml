title: 6.1.3(f)
text: 'f) postos de controle de acesso.

  6.1.4 [FC 153.107(b)] As características físicas das barreiras de segurança, como elementos
  construtivos, altura e materiais empregados, devem ser estabelecidas pelo operador de aeródromo
  utilizando-se de análise de risco.

  6.1.4.1 [Recomendação] Por exercer influência sobre as barreiras de segurança do aeródromo,
  o tipo de área adjacente ao perímetro do sítio aeroportuário é um fator que deve ser levado
  em consideração pelo operador de aeródromo ao fazer a análise de risco, o planejamento e
  o monitoramento das características físicas e de desempenho das barreiras de segurança.

  6.1.5 [FC 153.107(a)(1) e 153.107(b)] Em aeródromos localizados em áreas rurais dedicadas
  à agropecuária ou somente à pecuária, a barreira de segurança, para ser considerada compatível
  com o tipo de área adjacente ao aeródromo, deve ter uma estrutura física com resistência
  suficiente para impedir o seu rompimento por animais de médio e grande porte e dificultar
  a passagem de animais de pequeno porte por baixo.

  6.1.6 [FC 153.107(a) e 153.107(b)] Em aeródromos localizados em áreas densamente urbanizadas,
  além de ser capaz de dificultar a passagem por baixo e de resistir às pressões de corte
  ou de dobragem, a barreira de segurança, para ser considerada compatível com o tipo de área
  adjacente ao aeródromo, deve ter altura que seja capaz de dificultar a passagem de pessoas
  por cima.

  6.1.7 A seguir são apresentados aspectos específicos a serem observados para os elementos
  de infraestrutura do sistema de proteção da área operacional mencionados no parágrafo 6.1.3
  desta Instrução Suplementar.

  6.1.8 [Recomendação] Para os aeródromos das classes AP-1, AP-2 e AP-3, no tocante ao Regulamento
  Brasileiro da Aviação Civil nº 107, o operador de aeródromo deve observar ainda as disposições
  contidas naquele Regulamento ou Instrução Suplementar relacionada.

  6.2 Barreiras de segurança artificiais e edificações

  6.2.1 [FC 153.107(a)] Para prevenir a entrada de animais terrestres ou objetos e conter
  o acesso não autorizado, premeditado ou inadvertido, de pessoas e veículos, as barreiras
  de segurança artificiais e edificações devem ser constituídas por estruturas que sejam capazes
