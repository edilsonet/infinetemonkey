text: 'b) realizar a vigilância remota ou presencial da barreira de segurança natural.

  6.4 Postos de controle de acesso

  6.4.1 [FC 153.107(a) e 153.107(b)] Os postos de controle de acesso devem ser construídos
  e mantidos de maneira que, quando fechados, apresentem características de segurança equivalentes
  às barreiras artificiais que protegem a área operacional.

  6.4.2 [FC 153.107(a)(2) e 153.107(b)] Para conter o acesso não autorizado, premeditado ou
  inadvertido de pessoas e veículos, os postos de controle de acesso devem ser constituídos
  por portões de acesso de veículos e pessoas, cujas características físicas devem ser estabelecidas
  pelo operador do aeródromo após análise de risco.

  6.4.3 [FC 153.107(a)(2) e 153.107(b)] O operador de aeródromo deve definir pelo menos 1
  (um) local do sistema de proteção da área operacional onde será realizado o controle de
  entrada e saída de pessoas e de veículos da área operacional.

  6.4.4 [Recomendação] Caso não seja possível controlar o acesso de pessoas e de veículos
  pelo mesmo local do sistema de proteção da área operacional, recomenda-se que o operador
  de aeródromo defina os locais que serão utilizados para controlar o acesso de pessoas e
  os locais que serão utilizados para controlar o acesso de veículos.

  6.4.5 [FC 153.107(a)(2) e 153.107(b)] Os postos de controle de acesso devem possuir placas,
  contendo avisos de alerta quanto à restrição de acesso às áreas aeroportuárias, ao risco
  à integridade física e à possibilidade de aplicação de sanções legais, no caso de acesso
  não autorizado.

  6.4.6 [FC 153.107(a)(2) e 153.107(b)] Os locais do sistema de proteção da área operacional
  utilizados para controle de acesso devem possuir, além da infraestrutura, procedimentos
  de controle de entrada e saída que sejam capazes de prevenir e conter o acesso não autorizado,
  premeditado ou inadvertido, de pessoas e de veículos.

  6.4.7 [FC 153.107(a)(2)] Os procedimentos de controle de entrada e saída de pessoas e de
  veículos devem ser executados por funcionários, que podem atuar de forma presencial ou remota
  no local do controle de acesso.

  6.4.7.1 Os procedimentos de controle de acesso podem ser executados por funcionário localizado
  em uma central de monitoramento de sistema de Circuito Fechado de TV (CFTV), com infraestrutura
  e recursos tecnológicos que possibilitem a identificação de pessoas e de veículos e a autorização
  de sua entrada e/ou saída da área operacional.

  6.4.8 [FC 153.107(a)(2)] Para evitar a entrada sem autorização de pessoas e veículos na
  área operacional, o funcionário responsável pela execução dos procedimentos de controle
  de acesso deve manter o portão de acesso à área operacional fechado e trancado quando não
  estiver em uso.

  6.4.9 [Recomendação] O operador de aeródromo pode utilizar sistema de alarme sonoro e comunicação
  no portão de acesso para acionamento do funcionário responsável pelo controle de entrada
  e saída de pessoas e de veículos.

  6.4.10 [FC 153.107(a)(2)] O operador de aeródromo deve aplicar medidas de pronta resposta
  que sejam suficientes para bloquear e/ou impedir a continuidade de acesso ou de tentativa
  de acesso não autorizado, premeditado ou inadvertido, de pessoas e de veículos à área operacional,
  incluindo, quando necessário, a comunicação aos órgãos de segurança pública responsáveis
  pelas atividades de policiamento das áreas adjacentes ao perímetro do sítio aeroportuário.

  6.4.10.1 As medidas de pronta resposta devem ser aplicadas ainda que o acesso ou tentativa
  de acesso não autorizado, premeditado ou inadvertido, de pessoas e de veículos à área operacional
  tenha ocorrido por meio dos portões de acesso de explorador de área aeroportuária.

  6.4.11 [FC 153.107(a)(2)] O operador de aeródromo deve supervisionar os procedimentos de
  controle de acesso de pessoas e veículos à área operacional executados por explorador de
  área aeroportuária.

  6.4.12 [Recomendação] Sugere-se que o operador de aeródromo realize reuniões com representantes
  dos exploradores de área aeroportuária para orientar que sejam adotados procedimentos adequados
  de controle de entrada de pessoas e de veículos na área operacional por meio de seus portões
  de acesso e buscar a contribuição de toda a comunidade aeroportuária para o bom desempenho
  do sistema de proteção da área operacional.

