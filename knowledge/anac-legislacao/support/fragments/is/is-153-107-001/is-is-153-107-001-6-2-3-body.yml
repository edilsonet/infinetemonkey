text: '6.2.3 [Recomendação] Quando a topografia do terreno permitir, recomenda-se que as barreiras
  artificiais sejam construídas em linha reta.

  6.2.4 [Recomendação] Em aeródromos localizados em áreas urbanas densamente povoadas, recomenda-se
  que o operador de aeródromo enterre ou afixe a barreira artificial em uma base de concreto,
  ou similar, para garantir que seja capaz de prevenir que pessoa ou animal de pequeno porte
  passem por baixo dela, rastejando ou cavando.

  6.3 Barreiras de segurança naturais

  6.3.1 [FC 153.107(a) e (b)] O sistema de proteção da área operacional pode ser composto
  por obstáculos naturais, desde que tais obstáculos sejam capazes de proporcionar um nível
  de segurança equivalente ou superior ao nível de segurança proporcionado por barreiras de
  segurança artificiais.

  6.3.1.1 Considera-se que um obstáculo natural proporciona um nível de segurança equivalente
  ao nível de segurança operacional proporcionado por barreiras de segurança artificiais quando
  é capaz de atender ao estabelecido no parágrafo 153.107(a) do RBAC nº 153, qual seja:'
