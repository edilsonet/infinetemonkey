title: 6.5.2.1(b)
text: 'b) execute ações de pronta resposta nas situações necessárias.

  6.5.2.7 [Recomendação] Em aeródromos onde o sistema de vigilância presencial é prestado
  no período noturno, recomenda-se que o operador de aeródromo mantenha os locais sensíveis
  do sistema de proteção da área operacional e os portões de acesso com iluminação adequada
  à atividade de vigilância.

  6.5.2.8 [Recomendação] Se o operador de aeródromo julgar que é necessário solicitar apoio
  de órgãos de segurança pública para impedir a continuidade do acesso indevido em locais
  sensíveis do sistema de proteção da área operacional, sugere-se disponibilizar para as equipes
  de vigilância presencial os telefones de contato das autoridades públicas que realizam o
  patrulhamento nas áreas adjacentes ao perímetro do sítio aeroportuário.

  6.5.2.9 [FC 153.107(a) e 153.107(b)] Quando ocorrerem transformações ou alterações nas áreas
  adjacentes ao perímetro do sítio aeroportuário que sejam capazes de proporcionar o perigo
