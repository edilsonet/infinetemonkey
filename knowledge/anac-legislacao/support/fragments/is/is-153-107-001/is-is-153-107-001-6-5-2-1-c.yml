section_id: 6.5.2.1
section_title: '[FC 153.107(a) e 153.107(b)] A vigilância presencial, caso necessária, deve
  ser realizada por meio de ações que sejam capazes de:'
subsection_id: c
cite: 6.5.2.1(c)
title: 6.5.2.1(c)
text: 'c) diminuir os seus efeitos negativos.

  6.5.2.2 [Recomendação] Em aeródromos onde são realizadas operações apenas no período diurno,
  o sistema de vigilância presencial pode ser realizado somente durante o horário de funcionamento
  do aeródromo.

  6.5.2.3 [Recomendação] Em aeródromos onde são realizadas operações noturnas, é importante
  que o operador de aeródromo mantenha em funcionamento um sistema de vigilância presencial
  também durante o período noturno ou que possa ser acionado para realizar a vigilância presencial
  durante as operações de pouso e/ou decolagem noturnas.

  6.5.2.4 [Recomendação] O operador de aeródromo deve mitigar o risco ao desenvolver um sistema
  de vigilância focado nas áreas onde há maior probabilidade de ocorrerem invasões.

  6.5.2.5 [Recomendação] É importante que a equipe de vigilância presencial seja capaz de
  reconhecer os locais sensíveis do sistema de proteção da área operacional. Para tanto, recomenda-se
  que o operador de aeródromo os identifique e demarque em desenhos que contenham o sítio
  aeroportuário e seu entorno, possibilitando, assim, que a equipe de vigilância os visualize
  claramente.

  6.5.2.6 [FC 153.107(a) e 153.107(b)] Quando o operador de aeródromo identificar, por meio
  de análise de risco, locais sensíveis do sistema de proteção da área operacional, deve solicitar
