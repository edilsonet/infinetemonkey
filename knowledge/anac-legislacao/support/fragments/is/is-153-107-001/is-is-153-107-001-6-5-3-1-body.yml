text: '6.5.3.1 [FC 153.107(a) e 153.107(b)] O sistema de vigilância remota, quando necessário,
  deve ser realizado durante o horário de funcionamento do aeródromo.

  6.5.3.2 [Recomendação] Se o monitoramento remoto for feito por Circuito Fechado de TV (CFTV),
  é importante que o operador de aeródromo estabeleça, por meio de análise de risco, as áreas
  a serem monitoradas.

  6.5.3.3 [Recomendação] É aconselhável que as câmeras permitam, no mínimo, a visualização
  dos portões de acesso à área operacional do aeródromo, da área correspondente à pista de
  pouso e decolagem e do pátio de aeronaves.

  DESEMPENHO DAS BARREIRAS DE PROTEÇÃO DA ÁREA OPERACIONAL

  7.1 Generalidades'
