section_title: '[FC 153.221] O desempenho do sistema de proteção da área operacional deve
  ser avaliado pelo operador de aeródromo sob dois aspectos:'
subsection_id: b
cite: 7.1.1(b)
title: 7.1.1(b)
text: 'b) funcionamento do sistema de vigilância e do controle de acesso.

  7.1.2 [Recomendação] Para os aeródromos das classes AP-1, AP-2 e AP-3, no tocante ao Regulamento
  Brasileiro da Aviação Civil nº 107, o operador de aeródromo deve observar ainda as disposições
  contidas naquele Regulamento ou Instrução Suplementar relacionada.

  7.2 Manutenção das condições físicas das barreiras de segurança

  7.2.1 [FC 153.107(a) e 153.221] O operador de aeródromo deve verificar se a infraestrutura
  das barreiras de segurança possui defeitos que podem permitir ou facilitar a entrada de
  objetos, bem como de animais terrestres de pequeno ou de grande porte, e/ou o acesso não
  autorizado, premeditado ou inadvertido, de pessoas e de veículos.

  7.2.1.1 Tais defeitos podem estar relacionados a componentes, instalação, uso ou conservação
  da infraestrutura da barreira de segurança e devem ser reparados o mais rápido possível
  para não comprometer o sistema de proteção da área operacional.

  7.2.2 [FC 153.221] O operador do aeródromo deve planejar e executar ações mitigadoras relacionadas
  a perigos identificados por falhas nas condições físicas e funcionais das barreiras de segurança
  de acordo com as características operacionais do aeródromo e das áreas adjacentes ao perímetro
  do sítio aeroportuário, monitorando a eficácia das ações mitigadoras que foram executadas.

  7.2.3 [FC 153.221] O operador do aeródromo deve realizar ações corretivas tão logo surjam
  defeitos ou falhas nas barreiras de segurança, devendo priorizar a correção caso isso se
  constitua em um perigo que possa expor as operações de taxiamento e de pouso e decolagem
  ao risco de incursão em pista ou de colisão de aeronaves com fauna terrestre ou objeto estranho
  que possa causar danos a aeronave (FOD).

  7.2.4 [FC 153.221] O operador de aeródromo deve realizar o monitoramento e a manutenção
