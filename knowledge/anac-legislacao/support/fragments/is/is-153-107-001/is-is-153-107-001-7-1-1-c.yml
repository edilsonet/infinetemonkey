section_title: '[FC 153.221] O desempenho do sistema de proteção da área operacional deve
  ser avaliado pelo operador de aeródromo sob dois aspectos:'
subsection_id: c
cite: 7.1.1(c)
title: 7.1.1(c)
text: 'c) causa provável para o acesso indevido ou entrada de animais.

  8.1.4 [Recomendação] Um determinado ponto do perímetro do sítio aeroportuário não deve ser
  considerado um local sensível do sistema de proteção da área operacional, se não houver
  registros históricos de acessos indevidos de pessoas e/ou de entrada de animais naquele
  local, a menos que o local possa ser considerado vulnerável.

  8.1.5 [Recomendação] A falta de dados históricos sobre os perigos ao sistema de proteção
  da área operacional não elimina a necessidade de identificação dos perigos e não impede
  que a base histórica seja iniciada a qualquer tempo, eis que é de grande valia à análise
  de risco e à avaliação de tendências e falhas no sistema.

  8.1.6 [FC 153.107(a)] O operador de aeródromo deve monitorar periodicamente a eficácia do
  seu sistema de proteção da área operacional e das ações mitigadoras por ventura executadas
  para corrigir falhas detectadas.

  8.1.6.1 O intervalo de tempo deve ser definido de acordo com o objetivo da ação mitigadora
  que foi executada e dos riscos de incursão em pista, de colisão de aeronaves com fauna terrestre
  ou de colisão ou absorção pela aeronave de objeto estranho que lhe possa causar danos (FOD).

  8.1.6.2 [Recomendação] Sugere-se que o operador de aeródromo estabeleça intervalos de tempo
  pré-definidos (3 meses, 6 meses ou 1 ano, por exemplo) para monitorar a eficácia das ações
  mitigadoras que foram executadas.

  8.1.7 [Recomendação] É aconselhável que o operador se utilize dos resultados do gerenciamento
  de risco na elaboração de estudos e projetos que tenham por finalidade reforma, modernização
  ou ampliação da infraestrutura e instalações aeroportuárias.

  8.2 Sistema de proteção da área operacional e a segurança operacional

  8.2.1 [Recomendação] O operador de aeródromo deve mitigar o risco ao desenvolver um sistema
  de vigilância focado nas áreas onde há maior probabilidade de ocorrerem invasões.

  8.2.2 [Recomendação] O operador de aeródromo deve adotar medidas para contribuir para a
  redução dos eventos de colisão com fauna terrestre ocasionados por falhas no sistema de
  proteção da área operacional.

  8.3 Posturas a serem adotadas face a condições operacionais do aeródromo

  8.3.1 [Recomendação] Em aeródromos onde são realizadas somente operações sob regras de voo
  visuais (VFR) diurno, recomenda-se que o operador de aeródromo realize, eventualmente, vistorias
  adicionais antes das operações de pouso e decolagem para verificar se a pista de pouso e
  decolagem está livre de pessoas, veículos, animais ou objetos.

  8.3.2 [Recomendação] Em aeródromos onde são realizadas operações noturnas e/ou operações
  sob regras de voo por instrumentos (IFR), é importante que a equipe de vigilância verifique
  a presença de pessoas ou animais terrestres na área operacional, com especial atenção para
  os locais sensíveis do sistema de proteção da área operacional, antes do início das operações
  noturnas e/ou operações sob condições meteorológicas adversas.

  8.4 Identificação de perigos ao sistema de proteção da área operacional'
