  GERENCIAMENTO DO RISCO DO SISTEMA DE PROTEÇÃO DA ÁREA OPERACIONAL

  8.1 Generalidades

  8.1.1 [FC 153.107(a)] O operador de aeródromo deve manter um processo contínuo de análise
  de risco, alinhado com o quanto designado na Subparte C do RBAC nº 153, com o objetivo de
  assegurar a proteção da área operacional do aeródromo.

  8.1.2 [Recomendação] É importante que o operador de aeródromo utilize o histórico de acessos
  indevidos de pessoas e/ou de entrada de animais terrestres na área operacional como uma
  ferramenta para auxiliar a análise e o gerenciamento do risco do sistema de proteção da
  área operacional e para identificar locais sensíveis do sistema de proteção da área operacional.

  8.1.3 [FC 153.107(a) e 153.107(b)] Quando os serviços de vigilância presencial ou remota
  do aeródromo identificarem acessos indevidos de pessoas ou entrada de animais na área operacional,
  o operador de aeródromo deve registrar esses eventos, após coletar as seguintes informações:'
