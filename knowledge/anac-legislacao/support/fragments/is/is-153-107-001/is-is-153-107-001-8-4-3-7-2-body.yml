text: '8.4.3.7.2 Após o registro, sugere-se que esses pontos sejam considerados como locais
  sensíveis do sistema de proteção da área operacional.

  8.4.3.7.3 Pode ser necessário realizar vistorias após a ocorrência de chuvas fortes e ventos
  com velocidade muito elevada para verificar se houve dano à infraestrutura das barreiras
  de segurança.

  8.4.3.8 [Recomendação] Para garantir que as barreiras de segurança do aeródromo também exerçam
  a função de barreira psicológica, o operador de aeródromo deve instalar placas, no máximo
  a cada 300m (trezentos metros), contendo avisos de alerta quanto à restrição de acesso às
  áreas aeroportuárias, ao risco à integridade física e à possibilidade de aplicação de sanções
  legais, no caso de acesso não autorizado.'
