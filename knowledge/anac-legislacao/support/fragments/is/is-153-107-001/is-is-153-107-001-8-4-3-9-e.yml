document: is-153-107-001
family: '153'
section_id: 8.4.3.9
section_title: '[FC 153.221] O operador de aeródromo deve realizar inspeções periódicas para
  verificar:'
subsection_id: e
cite: 8.4.3.9(e)
title: 8.4.3.9(e)
text: 'e) a necessidade de realizar campanhas de conscientização destinadas à população local
  vizinha ao sítio aeroportuário para evitar ações de vandalismo.

  8.4.3.10 [FC 153.221] Se o operador de aeródromo verificar que galhos de árvores ou arbustos
  existentes nas proximidades da cerca operacional estão facilitando o acesso ao interior
  da área operacional, deve reduzir a altura dessa vegetação ou retirá-la, caso seja necessário.

  8.4.3.11 [Recomendação] Recomenda-se que o operador de aeródromo incentive que qualquer
  pessoa que esteja dentro ou fora do sítio aeroportuário reporte situações de perigo real
  ou potencial de invasão da área operacional, nos moldes definidos pelo sistema de relatos,
  parte do seu gerenciamento de risco, conforme disposto na Subparte C do RBAC nº 153.

  8.4.3.12 [FC 153.107(a)(2)] Em caso de acesso ou tentativa de acesso indevido por pessoas
  à área operacional, o operador de aeródromo deve aplicar medidas de pronta resposta que
  sejam suficientes para bloquear e/ou impedir a continuidade do acesso, incluindo, quando
  necessário, a comunicação aos órgãos de segurança pública responsáveis pelas atividades
  de policiamento no entorno do aeródromo.

  8.4.3.13 [FC 153.221] O operador de aeródromo deve verificar, por meio de inspeções periódicas,
  se a infraestrutura da cerca operacional está danificada em alguns trechos ou com elementos
  construtivos que não são capazes de impedir a entrada de objetos ou animais.

  8.4.3.14 [FC 153.107(a)(1)] Em caso de entrada de fauna na área operacional, o operador
  de aeródromo deve aplicar medidas de pronta resposta que sejam suficientes para bloquear
  e/ou afugentar o animal invasor, respeitando as regras impostas pela legislação ambiental.'
