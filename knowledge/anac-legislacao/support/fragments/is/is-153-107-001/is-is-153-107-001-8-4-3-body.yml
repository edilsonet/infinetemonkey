text: '8.4.3 Barreira de segurança operacional não é capaz de impedir a passagem de pessoas,
  objetos e animais

  8.4.3.1 [Recomendação] Se houver uma grande extensão do perímetro da cerca operacional em
  que os elementos construtivos não são capazes de impedir a entrada de objetos e animais
  ou o acesso não autorizado, inadvertido ou premeditado, de pessoas, recomenda-se que este
  risco seja considerado como risco inaceitável.

  8.4.3.2 [Recomendação] Recomenda-se que a existência de cerca danificada em alguns trechos
  seja considerada como um risco inaceitável se for verificada pelo menos uma das seguintes
  situações:'
