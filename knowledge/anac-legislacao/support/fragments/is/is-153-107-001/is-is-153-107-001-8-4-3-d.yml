id: is-is-153-107-001-8-4-3-d
kind: is
document: is-153-107-001
family: '153'
section_id: 8.4.3
section_title: Barreira de segurança operacional não é capaz de impedir a passagem de pessoas,
  objetos e animais
subsection_id: d
cite: 8.4.3(d)
title: 8.4.3(d)
text: 'd) há evidências de invasão da área operacional por pessoas e/ou animais.

  8.4.3.3 [FC 153.221] O operador de aeródromo deve reforçar a estrutura da cerca operacional
  nos pontos em que haja indícios de que seus elementos construtivos permitem a passagem de
  pessoas, objetos e/ou animais ou adotar medidas mitigadoras para garantir que não haverá
  entrada de animais, objetos ou acesso não autorizado, inadvertido ou premeditado, de pessoas.

  8.4.3.4 [FC 153.221] Se os danos na cerca operacional tiverem sido ocasionados por tentativas
  de cortar ou dobrar os seus elementos construtivos, o operador de aeródromo deve verificar
  se existem avisos de alerta sobre restrição de acesso afixados na cerca operacional e, se
  julgar necessário, deve providenciar a instalação de mais avisos de alerta sobre restrição
  de acesso ou, caso infrutífero, solicitar auxílio da força de segurança competente pelas
  áreas adjacentes ao aeródromo.

  8.4.3.5 [FC 153.221] O operador de aeródromo deve reforçar os componentes da cerca operacional
  e verificar se a instalação está adequada para suportar condições meteorológicas adversas.

  8.4.3.6 [FC 153.107(a) e 153.221] O operador de aeródromo deve realizar o reparo dos trechos
  da infraestrutura da cerca operacional que estejam danificados ou com cerca inexistente,
  bem como adotar medidas mitigadoras para garantir que não haverá entrada de animais, objetos
  ou acesso não autorizado, inadvertido ou premeditado, de pessoas até que o reparo esteja
  concluído.

  8.4.3.7 [Recomendação] Recomenda-se que o operador de aeródromo realize vistorias periódicas
  na cerca operacional para identificar e registrar (por exemplo, por fotografias) pontos
  em que os elementos construtivos da cerca operacional permitem a passagem de pessoas, objetos
  e/ou animais.'
