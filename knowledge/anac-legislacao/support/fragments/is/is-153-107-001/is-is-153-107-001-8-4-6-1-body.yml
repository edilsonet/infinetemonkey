title: Realização de obras e serviços de manutenção
text: '8.4.6.1 Realização de obras e serviços de manutenção

  8.4.6.1.1 [FC 153.107(a)(2) e 153.225] Se durante a realização de obras ou serviços de manutenção
  for necessário manter algum local da cerca operacional aberto e não houver controle de acesso
  neste local, o operador de aeródromo deve solicitar ao sistema de vigilância presencial
  que mantenha vigilância permanente do local, de modo a garantir a proteção adequada da área
  operacional e que execute ações de pronta resposta nas situações necessárias.

  8.4.6.1.2 [FC 153.107(a)(2) e 153.225] O operador de aeródromo deve realizar o controle
  de acesso dos funcionários de obras e serviços de manutenção e conscientizá-los a respeito
  do risco de incursão em pista, especialmente quando forem utilizados veículos dentro da
  área operacional para a execução dos serviços.

  8.4.6.1.3 [FC 153.107(a)(2) e 153.225] O operador de aeródromo deve informar aos funcionários
  de obras e serviços de manutenção quais são os procedimentos adotados para o controle de
  entrada e/ou saída de pessoas e veículos na área operacional.'
