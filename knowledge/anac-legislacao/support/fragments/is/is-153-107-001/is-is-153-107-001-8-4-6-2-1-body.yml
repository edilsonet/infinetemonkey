text: '8.4.6.2.1 [FC 153.107(a)(2)] O operador de aeródromo deve manter os portões de acesso
  que estão fora de operação fechados e trancados.

  8.4.6.2.2 [FC 153.133(a)(3)] O operador de aeródromo deve realizar inspeções periódicas
  para verificar se os elementos construtivos dos portões que estão fora de operação são capazes
  de impedir o acesso indevido de pessoas à área operacional.

  8.4.6.2.3 [Recomendação] É aconselhável que o operador de aeródromo providencie a instalação
  de avisos de alerta quanto à restrição de acesso às áreas aeroportuárias, ao risco à integridade
  física e à possibilidade de aplicação de sanções legais no caso de acesso não autorizado
  de pessoas ou veículos e/ou providenciar a iluminação desses portões para inibir a ação
  de intrusos.

  8.5 Priorização e registro das ações mitigadoras

  8.5.1 [Recomendação] Caso o operador de aeródromo identifique mais de um perigo ao sistema
  de proteção da área operacional ou a necessidade de execução de mais de uma ação mitigadora
  para os perigos que foram identificados e não disponha de pessoal ou de recursos financeiros
  suficientes para execução de várias ações ao mesmo tempo, recomenda-se que elabore um plano
  de ações mitigadoras, cujo cronograma estabeleça prioridade para os perigos que representam
  riscos mais significativos para a segurança operacional do aeródromo.

  8.6 Riscos inaceitáveis

  8.6.1 [FC 153.107(a)] O operador de aeródromo deve considerar como intoleráveis ou inaceitáveis
  os riscos ao sistema de proteção da área operacional quando houver falha ou inexistência
  de barreiras de segurança operacional em alguns trechos sem a devida vigilância destes locais.'
