title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  10.1 Os casos omissos serão dirimidos pela ANAC.

  10.2 Esta IS entra em vigor em 2 de maio de 2023.

  REFERÊNCIAS BIBLIOGRÁFICAS

  11.1 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil Nº 153 -
  Aeródromos - operação, manutenção e resposta à emergência. Emenda nº 07, de 14 de abril
  de 2023. Brasília: ANAC, 2023. Disponível em https://www.anac.gov.br/assuntos/legislacao/
  legislacao-1/rbha-e-rbac. Acesso em: 20 abr. 2023.

  11.2 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil nº 107 -
  Segurança da aviação civil contra atos de interferência ilícita - operador de aeródromo.
  Emenda nº 04. Brasília: ANAC, 2021. Disponível em: <https://www.anac.gov.br/assuntos/legislacao/legislacao-1/rbha-e-rbac/rbac/rbac-107>.
  Acesso em: 03 nov. 2021.

  11.3 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Instrução Suplementar nº 153.501-001 - Procedimentos
  básicos de gerenciamento do risco da fauna. Revisão A. Brasília: ANAC, 2021. Disponível
  em: <https://www.anac.gov.br/assuntos/legislacao/legislacao-1/iac-e-is/is/is-153-501-001>.
  Acesso em: 10 nov. 2021.

  11.4 CIVIL AVIATION SAFETY AUTHORITY. SMS 3 - Safety Risk Management. 2nd ed. Canberra:
  CASA, Dec. 2014. Disponível em: <https://www.casa.gov.au/files/2014-sms-book3-safety-risk-managementpdf>.
  Acesso em: 10 nov. 2021.

  11.5 International Civil Aviation Organization. Safety Management Manual (SMM): Doc. 9859
  AN/474. 4rd ed. Montréal: ICAO, 2018.

  11.6 International Civil Aviation Organization. Doc 8973 - Restricted - Aviation Security
  Manual. 12th ed. Montréal: ICAO, 2020.

  11.7 NATIONAL ACADEMIES OF SCIENCES, ENGINEERING, AND MEDICINE. ACRP REPORT 131 - A Guidebook
  for Safety Risk Management for Airports. Washington: The National Academies Press, 2015.
  206 p. Disponível em: <https://www.trb.org/Publications/Blurbs/172635.aspx>. Acesso em:
  03 nov. 2021.'
