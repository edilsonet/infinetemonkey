title: TERMOS E DEFINIÇÕES
text: 'TERMOS E DEFINIÇÕES

  4.1 Para os efeitos desta Instrução Suplementar aplicam-se os termos e as definições estabelecidas
  a seguir, bem como aqueles disponíveis no RBAC nº 01, denominado “Definições, Regras de
  Redação e Unidades de Medida para Uso nos Normativos da ANAC”, na Seção 153.1 do RBAC nº
  153 e em demais normas relacionadas à matéria.

  4.1.1 Explorador de área aeroportuária: toda pessoa física ou jurídica que, mediante delegação
  do operador de aeródromo, explora instalações ou áreas aeroportuárias.

  4.1.2 Gerenciamento do risco do sistema de proteção da área operacional: identificação de
  situações ou defeitos que constituem perigos ao sistema de proteção da área operacional
  para planejar e executar ações mitigadoras que sejam capazes de reduzir o risco de acesso
  não autorizado, premeditado ou inadvertido, de veículos ou pessoas à área operacional, ou
  de entrada de animais terrestres ou objetos que constituam perigo às operações aéreas, de
  acordo com as características da operação do aeródromo e as áreas adjacentes ao perímetro
  do sítio aeroportuário, bem como monitorando a eficácia das ações mitigadoras que foram
  executadas.

  4.1.3 Local sensível do sistema de proteção da área operacional: qualquer ponto do perímetro
  operacional do sítio aeroportuário que, por algum motivo, está mais suscetível a invasões
  por pessoas e/ou animais.

  ESTRUTURA DO DOCUMENTO

  5.1 Esta IS está estruturada da seguinte forma:

  5.1.1 Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo, a
  notação “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que correspondem. Sua
  observância é obrigatória, mas pode o regulado submeter à aprovação da Superintendência
  de Infraestrutura Aeroportuária (SIA) - previamente à sua adoção - meio ou procedimento
  alternativo, na forma prevista na Resolução ANAC nº 30, artigo 14, § 1º e 2º.

  5.1.2 Sempre que um item for classificado como “FC” (Forma de Cumprimento), todos os seus
  subitens, exceto aqueles que tratarem expressamente de uma recomendação, fazem parte do
  conjunto de informações que compõem a forma de cumprimento.

  5.1.3 Os itens que se iniciam com a notação “Recomendação”, apesar de não trazerem comando
  obrigatório, representam as práticas que a ANAC entende como desejáveis para o aumento da
  segurança e da eficiência das operações, merecendo os melhores esforços dos operadores de
  aeródromo para sua consecução.'
