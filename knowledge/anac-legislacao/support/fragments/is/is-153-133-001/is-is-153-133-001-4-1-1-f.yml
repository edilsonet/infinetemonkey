title: 4.1.1(f)
text: 'f) Neve fundente sobre gelo.

  4.1.3 Cinza: resíduo sólido acinzentado originário de combustão, normalmente de material
  em partículas pulverizadas e, no caso em que atinge as pistas dos aeroportos, ejetado por
  erupção vulcânica.

  4.1.4 Código de Condição de Pista (Runway Condition Code - RWYCC): o código de condição
  da pista (RWYCC) descreve a condição da pista de pouso e decolagem com base nos contaminantes
  encontrados em cada terço da pista. O uso de RWYCC fornece um formato padronizado de números
  (por exemplo, 4/3/2) úteis às empresas aéreas nas avaliações de desempenho de pouso e decolagem.

  4.1.5 Contaminante: depósito de material no pavimento em que os efeitos podem ser prejudiciais
  para as características de atrito da superfície do pavimento, podendo prejudicar o desempenho
  de frenagem da aeronave. São tipos de contaminante:'
