text: 's) Fluido.

  4.1.6 Geada: consiste em cristais de gelo formados a partir da umidade do ar que se condensa
  em uma superfície cuja temperatura está abaixo de zero. A geada difere do gelo, na medida
  em que os cristais de geada crescem independentemente e, portanto, têm uma textura mais
  granular.'
