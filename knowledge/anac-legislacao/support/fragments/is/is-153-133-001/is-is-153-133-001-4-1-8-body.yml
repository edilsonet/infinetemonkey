title: 'Gelo molhado: gelo que está derretendo ou gelo com uma camada de água (qualquer espessura)
  por cima.'
text: '4.1.8 Gelo molhado: gelo que está derretendo ou gelo com uma camada de água (qualquer
  espessura) por cima.

  4.1.9 Matriz de Avaliação de Condição de Pista (Runway Condition Assessment Matrix - RCAM):
  ferramenta pela qual um operador de aeródromo avalia uma superfície da pista de pouso e
  decolagem quando contaminantes estiverem presentes. A RCAM está disponível no Apêndice B
  desta Instrução Suplementar.

  4.1.10 Múltiplos contaminantes: combinação de contaminantes (como identificado na RCAM)
  observados em superfícies pavimentadas. Ao relatar vários contaminantes, apenas os dois
  contaminantes mais prevalentes são relatados. Ao reportar sobre as pistas, até dois tipos
  de contaminantes podem ser reportados para cada terço da pista. O Código de Condição de
  Pista (Runway Condition Code - RWYCC), quando aplicável, será baseado no contaminante mais
  perigoso, quando ambos os contaminantes não são da mesma categoria na RCAM.

  4.1.11 Neve compactada: neve que foi consolidada em uma forma sólida que resiste a uma compressão
  adicional, de modo que um avião permanecerá em sua superfície sem deslocar a placa de neve.

  4.1.12 Neve fundente: neve que tem grãos revestidos com água líquida, que une a massa, mas
  que não tem excesso de água nos espaços dos poros. Uma bola de neve bem compactada e sólida
  pode ser feita, sem que água escorra para fora.

  4.1.13 Neve seca: neve que tem água livre insuficiente para fazê-la ficar unida. Isso geralmente
  ocorre em temperaturas bem abaixo de 32° F (0° C). Se ao fazer uma bola de neve, ela se
  desfaz, a neve é considerada seca.

  4.1.14 Neve semiderretida (slush): neve que tem conteúdo de água excedendo uma condição
  livremente drenada, de tal forma que assume propriedades fluidas (por exemplo, escorrendo
  e espalhando). No caso de neve semiderretida, a água escorrerá da mão quando um punhado
  for recolhido.

  4.1.15 Pista contaminada: a situação em que uma porção significativa da área da superfície
  da pista (em áreas isoladas ou não), dentro do comprimento e da largura que estão sendo
  utilizados, é coberta por um ou mais contaminantes.'
