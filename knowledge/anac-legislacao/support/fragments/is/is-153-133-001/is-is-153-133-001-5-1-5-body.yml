text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS.

  PROCEDIMENTOS PARA MONITORAMENTO DA ÁREA OPERACIONAL

  6.1 Generalidades

  6.1.1 O parágrafo 153.133(a) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  e implementar procedimentos de monitoramento na área operacional com vistas a identificar
  condições de perigo para as operações aéreas e aeroportuárias.'
