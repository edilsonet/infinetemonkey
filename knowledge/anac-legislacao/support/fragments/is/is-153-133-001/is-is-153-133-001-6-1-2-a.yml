section_title: '[FC 153.133(a)] O monitoramento exigido pelo parágrafo 153.133(a) do RBAC
  nº 153 deve atender pelo menos a seguinte finalidade:'
subsection_id: a
cite: 6.1.2(a)
title: 6.1.2(a)
text: 'a) condições físicas e de funcionamento dos seguintes elementos:

  I) pavimento aeroportuário da área de movimento do aeródromo com especial atenção às irregularidades
  ou superfícies danificadas deste pavimento;

  II) sinalização horizontal e vertical;

  III) sinalização luminosa;

  IV) sinalização provisória e definitiva;

  V) sistemas de isolamento;

  VI) faixa de pista de pouso e decolagem, de pista de táxi e as áreas de segurança de fim
  de pista (RESA);

  VII) vegetação;

  VIII) sistema de proteção da área operacional;

  IX) veículos e equipamentos;

  X) edificações e abrigos;

  XI) padrões de movimentação no solo;

  XII) auxílios à navegação; e

  XIII) sistemas elétricos, em especial:'
