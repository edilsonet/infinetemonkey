section_id: 6.1.2
section_title: '[FC 153.133(a)] O monitoramento exigido pelo parágrafo 153.133(a) do RBAC
  nº 153 deve atender pelo menos a seguinte finalidade:'
subsection_id: i
cite: 6.1.2(i)
title: 6.1.2(i)
text: 'i) água, neve, neve semiderretida, gelo ou geada na pista de pouso e decolagem, na
  pista de táxi ou no pátio de aeronaves;

  ii) produtos químicos líquidos anticongelantes ou outros contaminantes em pista de pouso
  e decolagem, pista de táxi ou pátio de aeronaves;

  iii) bancos de neve ou neve acumulada nas proximidades da pista de decolagem, pista de táxi
  ou pátio de aeronaves;

  II) FOD (Foreign Object Debris) - Objeto estranho que possa causar danos a aeronave);

  III) obstruções;

  IV) fauna;

  V) obstáculos; e

  VI) eventuais perigos temporários;'
