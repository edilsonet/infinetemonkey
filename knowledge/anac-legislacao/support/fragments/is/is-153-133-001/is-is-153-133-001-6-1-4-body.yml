  6.2 Monitoramento da área operacional - procedimentos:

  6.2.1 [Recomendação] Ao desenvolver os procedimentos de monitoramento da área operacional
  exigidos para o escopo definido pelo parágrafo 153.133(a) do RBAC nº 153 e a finalidade
  trazida em 6.1.2 desta Instrução Suplementar, baseados nos elementos de verificação listados
  no parágrafo 153.133(b) daquele Regulamento (reproduzidos no item 6.1.3, acima), bem como
  outros que julgar necessário, é essencial que o operador de aeródromo considere os seguintes
  aspectos:'
