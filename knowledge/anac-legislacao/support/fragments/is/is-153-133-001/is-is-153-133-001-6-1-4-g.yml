text: 'g) a realização das providências cabíveis.

  6.2.2 O parágrafo 153.133(c) do RBAC nº 153 estabelece que o operador de aeródromo deve
  estabelecer monitoramento diário da área de movimento, conforme periodicidade definida no
  Apêndice A daquele Regulamento.

  6.2.2.1 Havendo mais de um monitoramento diário, o operador de aeródromo deve estabelecer
  que as atividades de monitoramento ocorram em períodos distintos do dia (manhã, tarde ou
  noite).

  6.2.2.2 Para as pistas de pouso e decolagem, inspeções adicionais à estabelecida no parágrafo
  153.133(c) do RBAC nº 153 deverão ser realizadas se as condições da superfície da pista
  de pouso e decolagem mudarem significativamente devido às condições meteorológicas.

  6.2.3 [Recomendação] Com vistas a auxiliar a atividade de monitoramento da área operacional,
  recomenda-se que sejam elaborados desenhos com rota(s) padronizada(s), os quais devem conter
  todo o sistema de pistas de pouso e decolagem, pistas de táxi e pátio de aeronaves.

  6.2.3.1 É possível também o estabelecimento de desenho(s) distinto(s) para cada rota padronizada,
  ou que traga maior detalhamento em relação a uma atividade específica de monitoramento a
  ser desempenhada.

  6.2.4 [Recomendação] Com vistas a aumentar a segurança operacional, é aconselhável que ao
  final da atividade de monitoramento da área de movimento seja efetuado reporte ao órgão
  de controle de tráfego aéreo, se presente no aeródromo, informando a condição da pista de
  pouso e decolagem ou pista de táxi. O reporte deve ser feito em fraseologia padronizada
  e, se aeródromo certificado segundo o “RBAC nº 139 - Certificação Operacional de Aeroportos”,
  o procedimento deve fazer parte do seu Manual de Operações do Aeródromo (MOPS).

  6.2.5 O parágrafo 153.133(e) do RBAC nº 153 estabelece que informações sobre eventuais falhas
  ou operações irregulares que possam afetar as operações aéreas detectadas no pavimento,
  na sinalização horizontal e vertical, na sinalização luminosa, nos padrões de movimentação
  no solo e nos auxílios à navegação, bem como a presença de eventuais perigos temporários,
  deverão ser disponibilizadas pelo operador de aeródromo aos pilotos, aos operadores aéreos
  e, quando existir, ao órgão de Serviço de Tráfego Aéreo do aeródromo.

  6.2.6 O parágrafo 153.133(f) do RBAC nº 153 determina que informações sobre a presença na
  área de movimento de contaminantes que possam afetar as operações aéreas deverão ser disponibilizadas
  pelo operador de aeródromo aos pilotos, aos operadores aéreos e, quando existir, ao órgão
  de Serviço de Tráfego Aéreo do aeródromo.

  6.2.6.1 Em casos de relevância significativa à segurança das operações, o operador deverá
  avaliar a necessidade de divulgação de informações aeronáuticas, desde que cabível segundo
  as normas de responsabilidade da Autoridade Aeronáutica.

