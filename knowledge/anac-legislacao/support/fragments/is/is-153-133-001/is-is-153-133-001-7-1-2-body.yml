text: '7.1.2 O parágrafo 153.133(b)(2)(i) do RBAC n º 153 define que deve ser verificada a
  presença, na área de movimento, de contaminantes no pavimento.

  7.1.3 O parágrafo 153.133(d) do RBAC nº 153 determina que o operador de aeródromo monitore
  a condição da superfície da pista de pouso e decolagem e mantenha rotina de medição de contaminantes,
  informando ao órgão de controle de tráfego aéreo o código de condição da pista de pouso
  e decolagem (Runway Condition Code - RWYCC) sempre que houver alterações nas condições de
  superfície da pista.

  7.1.4 [FC 153.133(d)] O operador de aeródromo deve assegurar que o procedimento seja executado
  por profissionais que tenham treinamento nos moldes definidos pelo parágrafo 153.37(d)(9)
  do RBAC nº 153 e detalhado em IS nº 153.37-001. (Vide IS nº 153.37-001)

  7.1.5 [Recomendação] Apesar de obrigatório somente para aeródromos Classe IV, segundo classificação
  disposta no RBAC nº 153, recomenda-se como boa prática a implementação da metodologia para
  emissão do Runway Condition Code (RWYCC) para os aeródromos da Classe III e para os aeródromos
  internacionais da Classe I e II, desde que disponham de Torre de Controle (TWR).

