title: Quando a faixa central definida estiver contaminada, todo o terço avaliado deverá ser
  considerado como contaminado.
text: '7.2.1.1 Quando a faixa central definida estiver contaminada, todo o terço avaliado
  deverá ser considerado como contaminado.

  7.2.1.2 Para fins de geração de um código de condição de pista (RWYCC) para cada terço da
  pista de pouso e decolagem deverá ser considerado a porcentagem constante no Apêndice C
  desta Instrução Suplementar.

  7.2.2 [FC 153.133(b)(2)(i)] Se a pista for considerada contaminada, essa informação deve
  ser comunicada pelo operador de aeródromo ao órgão ATS, para que seja divulgada aos aeronavegantes.

  7.2.3 [Recomendação] Poderá ser estabelecido acordo operacional entre o operador de aeródromo
  e o órgão ATS, a fim de operacionalizar procedimentos de inspeção de verificação da profundidade
  da lâmina d’água sobre a pista.

  7.2.4 [Recomendação] É aconselhável que o operador de aeródromo estabeleça procedimentos
  de classificação da condição de pista em função do acúmulo de água mensurável sobre a mesma,
  definindo situações práticas para a verificação da profundidade da lâmina d’água sobre a
  pista.

  7.3 Preparação para a inspeção e avaliação

  7.3.1 [FC 153.133(d)] A pista a ser avaliada deve ter seu comprimento dividido em três partes,
  conhecidos como terços da pista, conforme definição apresentada no Capítulo 4 desta Instrução
  Suplementar.

  7.3.1.1 Os limites dos terços da pista devem ser delimitados, com marcadores próprios ou
  estruturas existentes (início de pistas de táxi, por exemplo), de modo que o profissional
  que realizar a inspeção tenha fácil conhecimento de onde inicia cada terço.'
