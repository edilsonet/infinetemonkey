section_title: '[FC 153.133(b)(2)(i)] A determinação da condição de pista contaminada deve
  considerar o seguinte parâmetro:'
subsection_id: a
cite: 7.2.1(a)
title: 7.2.1(a)
text: 'a) exista 25% da área de uma faixa central dentro de um terço da pista de pouso e decolagem
  coberto com lâmina d’água com espessura superior a 3mm (três milímetros), ou, ainda, geada,
  gelo ou neve com qualquer profundidade;

  I) a determinação dessa faixa central deve considerar o disposto na tabela a seguir:

  Tabela 1 - Largura mínima da faixa central.

  Letra do código de referência do aeródromo

  (conforme o RBAC nº 154)

  Maior envergadura dentre o mix de aeronaves do aeródromo

  Largura mínima da faixa

  A, B ou C


  Menor que 36m

  6m (3m para cada lado, a partir do eixo da pista) por toda a extensão do terço.

  D, E ou F

  Maior ou igual que 36m

  12m (6m para cada lado, a partir do eixo da pista) por toda a extensão do terço.'
