section_id: 7.3.2
section_title: '[FC 153.133(d)] O operador de aeródromo deve definir, como parte de seu procedimento
  de monitoramento (inspeção, avaliação e reporte):'
subsection_id: d
cite: 7.3.2(d)
title: 7.3.2(d)
text: 'd) o roteiro de inspeção, o qual deve definir:

  I) a rota a ser seguida, considerando que o início da atividade se dará sempre na cabeceira
  de menor designativo e seguirá até a cabeceira oposta, retornando para a cabeceira de partida;

  II) a relação de itens a serem verificados durante a execução da atividade de inspeção;'
