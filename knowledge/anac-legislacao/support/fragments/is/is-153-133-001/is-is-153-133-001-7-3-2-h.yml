section_id: 7.3.2
section_title: '[FC 153.133(d)] O operador de aeródromo deve definir, como parte de seu procedimento
  de monitoramento (inspeção, avaliação e reporte):'
subsection_id: h
cite: 7.3.2(h)
title: 7.3.2(h)
text: 'h) providências adicionais a serem tomadas a depender da condição da pista de pouso
  e decolagem.

  7.3.3 [Recomendação] Para que o monitoramento da condição da superfície da pista de pouso
  e decolagem obtenha resultados satisfatórios é aconselhável que seja feito de maneira coordenada
  entre operador de aeródromo, órgão de controle de tráfego aéreo, no caso representado pela
  Torre de Controle (TWR), e as empresas aéreas (pilotos e despachante de voo), incentivando
  a participação ativa dos agentes envolvidos.

  7.4 Inspeção e avaliação da pista de pouso e decolagem'
