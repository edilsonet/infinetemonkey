text: '7.4.1 [FC 153.133(d)] Início da inspeção da pista quando da incidência de geada, gelo,
  neve ou lama

  7.4.1.1 O operador de aeródromo deve iniciar procedimento de inspeção quando numa pista
  de pouso e decolagem houver indícios de que mais de 10% de sua área está coberta por geada
  ou gelo de qualquer profundidade, ou, ainda, quando houver neve ou lama com mais de 3 (três)
  milímetros de espessura.'
