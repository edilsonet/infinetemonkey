text: '7.4.2 [FC 153.133(d)] Início da inspeção da pista quando da incidência de chuva

  7.4.2.1 O operador de aeródromo deve estabelecer, com base em observações históricas e no
  conhecimento do perfil da pista, o momento apropriado para começo das inspeções após início
  de ocorrência de chuva.

  7.4.2.2 As condições meteorológicas que indicam a necessidade de início das inspeções devem
  se basear, dentre outros parâmetros, no nível de precipitação pluviométrica e no tempo decorrido
  de chuva.

  7.4.2.3 A combinação de nível de precipitação, tempo de chuva e perfil do pavimento da pista
  indicará quando poderá ocorrer formação de poças de água com espessura média superior a
  3 (três) milímetros, momento em que deverão ser iniciadas as inspeções.

  7.4.2.4 [Recomendação] Na falta de indicativo estabelecido para início do processo de inspeção
  no aeródromo, poderá seu operador utilizar o valor recomendado pelo “Manual de Avaliação
  e Reporte das Condições de Superfície de Pista”, que é a ocorrência de chuva com precipitação
  igual ou superior a 30 mm/h ou 0,5 mm/minuto. (Clique aqui para ver o Manual)

  7.4.2.5 [Recomendação] Para medir a lâmina d´água sobre o pavimento podem ser utilizados
  diversos tipos de equipamentos. Para maiores informações sobre estes tipos de medidores
  consultar o “Manual de Avaliação e Reporte da Condição de Superfície da Pista”. (Clique
  aqui para ver o Manual)'
