text: '7.4.3 [FC 153.133(d)] Início da inspeção da pista a partir de um Reporte de Ação de
  Frenagem (Report of Breaking Action - RBA)

  7.4.3.1 O operador de aeródromo deve iniciar a inspeção na pista a partir de um RBA que
  informe condição de frenagem mais degradada que a esperada para o RWYCC em uso (vide Apêndice
  B), dificuldade de manutenção do controle direcional da aeronave ou quando relatado pista
  escorregadia.'
