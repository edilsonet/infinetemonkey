section_id: 7.4.4.1
section_title: A inspeção deve ter início na cabeceira de menor designativo e seguir até a
  cabeceira oposta, retornando para a cabeceira de partida.
subsection_id: a
cite: 7.4.4.1(a)
title: 7.4.4.1(a)
text: 'a) medidores analógicos:

  I) verificar visualmente onde há formação de poças d´água na pista de pouso e decolagem;

  II) parar o veículo nos locais das poças e medir a espessura da lâmina d´água, registrando
  os locais onde encontrar profundidade maior que 3 (três) milímetros;

  III) avaliar visualmente a extensão da poça d´água que apresenta profundidade maior que
  3 (três) milímetros e registrar na ficha de inspeção o percentual do terço da pista que
  está contaminado;

  IV) repetir este procedimento para cada um dos terços da pista.'
