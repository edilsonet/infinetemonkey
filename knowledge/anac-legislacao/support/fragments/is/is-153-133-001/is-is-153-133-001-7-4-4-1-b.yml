kind: is
document: is-153-133-001
family: '153'
section_id: 7.4.4.1
section_title: A inspeção deve ter início na cabeceira de menor designativo e seguir até a
  cabeceira oposta, retornando para a cabeceira de partida.
subsection_id: b
cite: 7.4.4.1(b)
title: 7.4.4.1(b)
text: 'b) equipamento eletrônico acoplado em veículo:

  I) posicionar o veículo em local anterior à cabeceira de menor designativo, de modo que,
  quando atingir a área da cabeceira, o veículo já tenha alcançado a velocidade exigida pelo
  fabricante para início da medição;

  II) iniciar o processo de medição do contaminante quando o veículo estiver em velocidade
  exigida pelo fabricante do equipamento;

  III) seguir em linha reta da cabeceira de menor numeração para a de maior numeração, a uma
  distância de 3m (três metros) da linha de eixo da pista (ou distância equivalente ao local
  de toque/passagem do trem de pouso das aeronaves predominantes no aeródromo), mantendo o
  veículo em velocidade constante, conforme recomendação do fabricante do equipamento medidor;

  IV) posicionar o veículo na cabeceira de maior numeração para a de menor numeração e repetir
  o procedimento descrito no tópico III (acima);

  V) apresentar o resultado das medições da espessura da lâmina d´água feito pelo equipamento
  medidor por terço da pista.'
