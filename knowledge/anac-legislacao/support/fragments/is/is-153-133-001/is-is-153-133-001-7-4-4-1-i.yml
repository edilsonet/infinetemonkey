document: is-153-133-001
family: '153'
section_id: 7.4.4.1
section_title: A inspeção deve ter início na cabeceira de menor designativo e seguir até a
  cabeceira oposta, retornando para a cabeceira de partida.
subsection_id: i
cite: 7.4.4.1(i)
title: 7.4.4.1(i)
text: i) para a estimação da área coberta pelo contaminante, um dos profissionais responsáveis
  pela inspeção deve visualizar as dimensões das poças que apresentarem pontos com espessura
  maior que 3mm (três milímetros), comparando a área total dessas poças com a área total do
  terço da pista para estimar o percentual do terço da pista que pode estar contaminado.
