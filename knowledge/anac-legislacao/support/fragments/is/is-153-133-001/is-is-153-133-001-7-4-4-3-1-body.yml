text: '7.4.4.3.1 Se 25% ou menos da área de um terço da pista estiver molhada ou coberta por
  um poluente, atribuir um RWYCC 6.

  7.4.4.3.2 Se houver múltiplos poluentes e a cobertura total for superior a 25%, mas nenhum
  poluente sozinho cobrir mais de 25% de qualquer terço da pista, o RWYCC deve ser baseado
  no julgamento dos profissionais que realizaram a inspeção da pista, que deverão levar em
  consideração o poluente que poderá afetar mais fortemente o desempenho da aeronave.'
