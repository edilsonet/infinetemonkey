section_title: 'Os seguintes critérios devem ser observados ao alterar o RWYCC:'
subsection_id: b
cite: 7.4.4.3.3(b)
title: 7.4.4.3.3(b)
text: 'b) para trocar RWYCC 1 ou 0 por um superior ao RWYCC 3 devem ser utilizados os critérios
  descritos a seguir:

  I) a decisão de alterar um RWYCC 1 ou 0 para um superior deve ser baseada nos métodos disponíveis
  para avaliar o quanto a pista está escorregadia para justificar a decisão;

  II) a superfície da pista deve ser frequentemente avaliada durante a vigência do RWYCC superior
  para garantir que o estado de superfície da pista não se deteriore abaixo do código atribuído.'
