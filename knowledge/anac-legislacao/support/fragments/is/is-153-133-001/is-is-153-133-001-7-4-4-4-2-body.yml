text: '7.4.4.4.2 A Figura 1, a seguir, apresenta um exemplo de Reporte de Condição de Pista
  (RCR):

  Figura 1 - Exemplo de Reporte de Condição de Pista (RCR)


  7.5 Reporte da condição da superfície de pouso e decolagem

  7.5.1 [FC 153.133(d)] O operador de aeródromo deve prontamente informar à Torre de Controle
  (TWR), via fonia, o código de condição de pista (RWYCC) para cada terço da pista, observando,
  para tanto, as normas e orientações advindas do órgão de controle de tráfego aéreo.

  7.5.1.1 As informações mencionadas acima serão divulgadas pelo órgão de tráfego aéreo aos
  aeronavegantes, que poderão utilizá-las (tripulação da aeronave ou despachante de voo) para
  calcular o desempenho da aeronave durante pousos ou decolagens, uma vez que o RWYCC reflete,
  em função das condições da superfície da pista, a capacidade de frenagem da aeronave.

  7.5.1.2 [FC 153.133(a)] O operador de aeródromo deve manter atualizadas, além do RWYCC para
  cada terço da pista, todas as demais informações referentes ao estado da superfície da pista
  de pouso e decolagem, bem como qualquer mudança nas suas condições devem ser notificadas
  imediatamente.'
