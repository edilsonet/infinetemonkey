section_id: 7.4.4.4
section_title: 'O operador de aeródromo deve preencher o Reporte de Condição de Pista (RCR),
  o qual deve conter os seguintes elementos:'
subsection_id: h
cite: 7.4.4.4(h)
title: 7.4.4.4(h)
text: 'h) Largura utilizada no processo obtenção do RWYCC para cada terço da pista quando
  a largura utilizada para medição for inferior à largura publicada em informações aeronáuticas.

  7.4.4.4.1 Se a distribuição do contaminante não for uniforme, a localização da área molhada
  ou coberta pelo contaminante deve ser descrita nas observações da seção sobre a consciência
  situacional do RCR.'
