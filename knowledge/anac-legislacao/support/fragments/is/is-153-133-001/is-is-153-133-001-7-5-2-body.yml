text: '7.5.2 [FC 153.133(d)] O operador de aeródromo deve incluir nas informações aeronáuticas
  o RCR, conforme orientações do órgão de navegação aérea.

  7.5.3 [FC 153.133(d)] A notificação da condição da superfície da pista deve continuar a
  refletir mudanças significativas até que a pista não esteja mais contaminada.

  7.5.3.1 Uma mudança no estado da superfície da pista é considerada significativa e deve
  gerar novo processo de inspeção, avaliação e reporte da condição da superfície da pista
  de pouso e decolagem quando existir:'
