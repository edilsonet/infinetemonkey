section_title: 'Devem ser consideradas pelo menos os seguintes parâmetros que podem causar
  mudança significativa na condição da superfície da pista:'
subsection_id: e
cite: 7.5.3.2(e)
title: 7.5.3.2(e)
text: 'e) características das aeronaves que operam na pista.

  7.5.4 RBA com reações de frenagem reduzidas ou com perda de controle direcional sem que
  haja contaminantes na pista, ou seja, em razão de outras circunstâncias (vento de cauda
  ou través; desgaste de mecanismo de freios ou de pneus, etc.) não ensejarão a obrigatoriedade
  de reavaliar do RWYCC.

  7.5.5 [Recomendação] O processo de reavaliação das condições de superfície de pista pode
  ser realizado pelo operador de aeródromo quando houver apenas 1 (um) reporte ou alguns reportes
  intercalados ou consecutivos de RBA inferiores ao esperado com o RWYCC, conforme Apêndice
  B ou quando houver reportes consecutivos ou espaçados a critério do operador de aeródromo
  em conjunto com a Torre de Controle (TWR), conforme acordo operacional do aeródromo.

  7.5.6 [Recomendação] No caso de RBA incompatível com o esperado pelo Apêndice B podem ser
  consideradas pelo operador de aeródromo medidas restritivas com vistas à segurança, tais
  como a suspensão temporária das operações.

  7.6 Considerações finais

  7.6.1 [Recomendação] Para maiores informações sobre o monitoramento da condição da superfície
  da pista de pouso e decolagem recomenda-se que seja consultado o “Manual de Avaliação e
  Reporte das Condições de Superfície da Pista” disponível no sítio eletrônico da ANAC, na
  rede mundial de computadores. (Clique aqui para ver o Manual)

  7.6.2 [Recomendação] É importante que o operador de aeródromo consulte as normas do Comando
  da Aeronáutica para a definição de procedimentos que envolvam informações aeronáuticas ou
  que estejam sob a guarda do órgão de controle de tráfego aéreo.'
