text: 'APÊNDICE D - CRITÉRIOS DE ATRIBUIÇÃO DO RWYCC


  Critérios de Atribuição do RWYCC a partir da Descrição da Superfície da Pista

  RWYCC

  Descrição de cada terço da superfície da pista

  6

  SECA (DRY): O terço da pista pode estar coberto por um contaminante em até 10% de sua área.

  5

  MOLHADA (WET): a superfície da pista está coberta por qualquer umidade ou água com até 3
  mm de profundidade, inclusive, e com nível de atrito acima do mínimo.

  NEVE SEMIDERRETIDA (SLUSH): até 3 mm de profundidade, inclusive.

  NEVE SECA (DRY SNOW): até 3 mm de profundidade, inclusive.

  NEVE UMIDA (WET SNOW): até 3 mm de profundidade, inclusive.

  GEADA (FROST)

  4

  NEVE COMPACTADA (COMPACT SNOW): temperatura externa do ar de -15°C ou mais baixa.

  3

  MOLHADA (WET): a superfície da pista está coberta por qualquer umidade visível ou água até
  3 mm de profundidade, com nível de atrito abaixo do mínimo (pista escorregadia quando molhada).

  NEVE SECA SOBRE NEVE COMPACTADA (DRY SNOW ON TOP OF COMPACTED SNOW): qualquer profundidade.

  NEVE UMIDA SOBRE NEVE COMPACTADA (WET SNOW ON TOP OF COMPACTED SNOW): qualquer profundidade.

  NEVE COMPACTADA (COMPACTED SNOW): temperatura do ar maior que -15°C (quinze graus Celsius
  negativos). A temperatura da superfície da pista deve ser preferivelmente utilizada, onde
  disponível.

  2

  ÁGUA EMPOÇADA (STANDING WATER): profundidade maior do que 3 mm. Reportar a profundidade
  média da lâmina d’água de cada terço

  NEVE SEMIDERRETIDA (SLUSH): profundidade maior que 3 mm. Reportar a profundidade do contaminante
  de cada terço.

  1

  GELO (ICE): qualquer profundidade.

  0

  GELO ÚMIDO (WET ICE)

  ÁGUA SOBRE NEVE COMPACTADA (WATER ON TOP OF COMPACTED SNOW)

  NEVE SECA SOBRE GELO (DRY SNOW ON TOP OF ICE)'
