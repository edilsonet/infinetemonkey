title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  9.1 Os casos omissos serão dirimidos pela ANAC.

  9.2 Esta IS entra em vigor em 2 de maio de 2023.

  REFERÊNCIAS BIBLIOGRÁFICAS

  10.1 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil Nº 153 -
  Aeródromos - operação, manutenção e resposta à emergência. Emenda nº 07, de 14 de abril
  de 2023. Brasília: ANAC, 2023. Disponível em https://www.anac.gov.br/assuntos/legislacao/
  legislacao-1/rbha-e-rbac. Acesso em: 20 abr. 2023.

  10.2 Federal Aviation Administration. Advisory Circular nº 150/5200-30D: Airport Field Condition
  Assessments and Winter Operations Safety. Washington: FAA, Oct. 2020. Disponível em: <https://www.faa.gov/airports/resources/advisory_circulars/index.cfm/go/document.current/documentNumber/150_5200-30>.
  Acesso em: 09 nov. 2021.

  10.3 International Civil Aviation Organization. Doc 9981, Procedures for Air Navigation
  Services - Aerodromes. 3rd ed. Montréal: ICAO, 2020.

  10.4 International Civil Aviation Organization. Circular 355 - Assessment, Measurement and
  Reporting of Runway Surface Conditions. Montréal: ICAO, 2019. 90 p.'
