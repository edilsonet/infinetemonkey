text: '4. TERMOS E DEFINIÇÕES

  4.1 Para os efeitos desta IS, são válidos os termos e definições apresentados na seção 153.1
  do

  4.2 Pavement condition index (PCI) é um índice de serventia da condição geral da superfície
  do

  pavimento, no qual os valores variam de 0 (representando um pavimento na condição de

  ruptura) até 100 (representando um pavimento numa condição excelente).'
