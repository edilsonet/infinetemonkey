text: '5.1.1 Os itens que detalham o cumprimento de requisito trazem, no início do parágrafo,
  a notação

  “FC” (Forma de Cumprimento), seguida do parágrafo do RBAC a que correspondem. Sua

  observância é obrigatória, mas pode o administrado submeter à aprovação da

  Superintendência de Infraestrutura Aeroportuária (SIA) - previamente à sua adoção - meio

  ou procedimento alternativo, na forma prevista na Resolução ANAC nº 30, artigo 14, § 1º
  e

  2º;Data de emissão: 23 de setembro de 2020.

  IS nº 153.203-001

  Revisão A'
