title: O parágrafo 153.203(b)(1)(ii) do RBAC nº 153 requer que o operador de aeródromo
text: '6.1.2 O parágrafo 153.203(b)(1)(ii) do RBAC nº 153 requer que o operador de aeródromo

  monitore a condição funcional do pavimento por meio de medições que representem

  numericamente um índice de serventia que indique a condição geral da superfície do

  pavimento da pista de pouso e decolagem, da pista de táxi e do pátio de estacionamento de

  aeronaves.'
