text: 'h) Descrição da rede:

  1) Tabela resumo para cada área típica (colocar a identificação e o tipo de uso e área),

  indicando a suas seções (identificação, data de construção, tipo de pavimento, área,

  largura e comprimento, data da inspeção) e para cada seção, indicar as unidades

  amostrais (identificação, tamanho da unidade, indicar se é aleatória ou adicional).'
