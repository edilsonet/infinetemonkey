text: '6.1.1 O parágrafo 153.205(f) do RBAC nº 153 dispõe sobre o monitoramento da irregularidade
  longitudinal do pavimento.

  6.1.2 O parágrafo 153.205(f)(1) do RBAC nº 153 requer que o operador de aeródromo avalie
  a irregularidade longitudinal do pavimento por meio de medições que representem numericamente
  o desvio da superfície do pavimento em relação a um plano de referência.'
