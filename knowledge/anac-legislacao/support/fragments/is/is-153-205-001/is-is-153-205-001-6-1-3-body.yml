text: '6.1.3 As frequências mínimas de medição da irregularidade longitudinal são definidas
  na Tabela 153.205-1 do RBAC nº 153.

  6.2 Medição da irregularidade longitudinal

  6.2.1 [FC 153.205(f)(1)] O operador de aeródromo deve monitorar a irregularidade longitudinal
  do pavimento por meio de medições com equipamento que permita a obtenção de valores expressos
  segundo a escala internacional de irregularidade (IRI - International Roughness Index).'
