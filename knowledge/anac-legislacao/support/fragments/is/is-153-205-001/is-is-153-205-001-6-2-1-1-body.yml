text: '6.2.1.1 A medição de irregularidade longitudinal do pavimento deve ser realizada ao
  longo de toda a extensão da pista, conforme definido na Tabela 1.

  Tabela 1 - Localização das medições de irregularidade longitudinal

  Letra do Código

  (vide RBAC nº 154)

  [1]

  Localização da medição

  [2]

  Quantidade Mínima

  [3]

  A, B ou C

  A 3m do eixo da pista

  Uma vez de cada lado em relação ao eixo da pista

  D, E ou F

  A 3m e 6m do eixo da pista

  Uma vez de cada lado em relação ao eixo da pista, para cada distância da coluna [2]'
