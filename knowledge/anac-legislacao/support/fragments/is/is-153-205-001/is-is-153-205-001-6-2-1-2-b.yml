section_id: 6.2.1.2
section_title: 'O equipamento a ser utilizado nas medições de irregularidade deve ser:'
subsection_id: b
cite: 6.2.1.2(b)
title: 6.2.1.2(b)
text: 'b) capaz de realizar pelo menos 4 (quatro) linhas de medição de irregularidade para
  cada faixa de 3 m (três metros) de pavimento.

  6.2.1.3 Aeródromos que obtiverem resultados de medição de IRI menor ou igual a 2,0 m/km
  (dois metros por quilômetro) podem realizar a próxima medição na frequência estabelecida
  na Tabela 153.205-1 do RBAC nº 153 acrescida de 12 (doze) meses.

  6.2.1.4 [FC 153.205(f)(1)(i)] A cada medição da irregularidade longitudinal do pavimento,
  o operador de aeródromo deve encaminhar à ANAC um relatório nos moldes do Apêndice D desta
  Instrução Suplementar.

  6.2.2 [FC 153.205(f)(4)] O parâmetro de irregularidade longitudinal do pavimento, segundo
  a escala internacional de irregularidade, deve ser igual ou inferior a 2,5 m/km (dois vírgula
  cinco metros por quilômetro), reportado a cada 200 m (duzentos metros).

  6.2.3 [FC 153.205(f)(5)] Quando o IRI for superior ao parâmetro de referência disposto no
  parágrafo 6.2.2 deste Regulamento, o operador de aeródromo deve informar à ANAC, juntamente
  com o envio do relatório de medição da irregularidade longitudinal do pavimento, quais ações
  foram ou serão adotadas para restabelecer valores que atendam ao requisito previsto no parágrafo
  6.2.2.

  ATRITO

  7.1 Generalidades'
