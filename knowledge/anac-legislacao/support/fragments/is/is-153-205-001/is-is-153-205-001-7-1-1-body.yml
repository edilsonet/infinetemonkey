text: '7.1.1 O parágrafo 153.205(g) do RBAC nº 153 dispõe sobre o monitoramento do coeficiente
  de atrito do pavimento.

  7.1.2 O parágrafo 153.205(g)(1) do RBAC nº 153 requer que o operador de aeródromo avalie
  o coeficiente de atrito do pavimento por meio de medições dinâmicas que representem numericamente
  o coeficiente de atrito entre pneu e pavimento.'
