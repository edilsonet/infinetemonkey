text: '7.1.3 As frequências mínimas de medição de atrito são definidas na Tabela 153.205-2
  do RBAC nº 153.

  7.2 Medição do coeficiente de atrito

  7.2.1 [FC 153.205(g)(1)] O operador de aeródromo deve monitorar o coeficiente de atrito
  do pavimento por meio de medições, utilizando um dos equipamentos listados na Tabela 2,
  e atestadas por responsável técnico habilitado, devidamente registrado no conselho profissional
  competente.

  7.2.1.1 O valor do coeficiente de atrito do pavimento deve ser igual ou superior aos parâmetros
  estabelecidos na Tabela 2, em função do tipo de equipamento de medição (coluna [1]) e respectivas
  condições (colunas [2] a [5]).'
