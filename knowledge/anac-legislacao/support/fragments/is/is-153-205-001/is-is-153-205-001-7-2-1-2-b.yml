text: 'b) capaz de adquirir e registrar valores de atrito em intervalo máximo de 10 m (dez
  metros).

  7.2.1.3 A medição de atrito deve ser iniciada pela cabeceira com maior quantidade de pousos,
  em toda a extensão operacional da pista, excetuando-se os trechos para aceleração e desaceleração
  do equipamento de medição, e considerando:'
