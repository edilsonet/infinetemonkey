text: 'c) quantidades mínimas de medições, segundo especificado na coluna [3] da Tabela 3.

  Tabela 3 - Localização das medições de atrito

  Letra do Código

  (vide RBAC nº 154)

  [1]

  Localização da medição

  [2]

  Quantidade Mínima

  [3]

  A, B ou C

  A 3m do eixo da pista

  Uma vez de cada lado em relação ao eixo da pista

  D, E ou F

  A 3m e 6m do eixo da pista

  Uma vez de cada lado em relação ao eixo da pista, para cada distância da coluna [2]

  7.2.1.4 [FC 153.205(g)(1)(i)] A cada medição do coeficiente de atrito do pavimento, o operador
  de aeródromo deve encaminhar à ANAC um relatório nos moldes do Apêndice B desta Instrução
  Suplementar.'
