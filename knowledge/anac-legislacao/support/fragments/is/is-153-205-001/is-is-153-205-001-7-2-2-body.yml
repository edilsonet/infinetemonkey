text: '7.2.2 [FC 153.205(g)(5)] Os parâmetros de referência, nível de manutenção e nível mínimo,
  para a medição de atrito estão dispostos no parágrafo 7.2.1.1.

  7.2.3 [FC 153.205(g)(6)] Quando o valor do coeficiente de atrito for inferior ao nível de
  manutenção indicado na coluna [6] da Tabela 2, o operador de aeródromo deve informar à ANAC,
  juntamente com o envio do relatório de medição de atrito, quais ações foram ou serão adotadas
  para restabelecer valores iguais ou superiores ao nível de manutenção.'
