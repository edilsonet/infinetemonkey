section_title: '[FC 153.205(g)(7)] Quando o valor do coeficiente de atrito for inferior ao
  nível mínimo indicado na coluna [7] da Tabela 2, o operador de aeródromo deve:'
subsection_id: c
cite: 7.2.4(c)
title: 7.2.4(c)
text: 'c) solicitar divulgação de informação aeronáutica de que a pista de pouso e decolagem
  contém trecho(s) passível(eis) de estar(em) escorregadio(s) quando molhado(s), com a localização
  e extensão do(s) trecho(s) da pista que apresenta(m) valor do coeficiente de atrito inferior
  ao mínimo.

  MACROTEXTURA

  8.1 Generalidades'
