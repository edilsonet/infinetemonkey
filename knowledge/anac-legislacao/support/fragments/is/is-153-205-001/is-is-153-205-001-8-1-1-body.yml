text: '8.1.1 O parágrafo 153.205(h) do RBAC nº 153 dispõe sobre o monitoramento da profundidade
  da macrotextura do pavimento.

  8.1.2 O parágrafo 153.205(h)(1) do RBAC nº 153 requer que o operador de aeródromo avalie
  a profundidade de macrotextura do pavimento por meio de medições que representem numericamente
  a profundidade média da macrotextura da superfície do pavimento.'
