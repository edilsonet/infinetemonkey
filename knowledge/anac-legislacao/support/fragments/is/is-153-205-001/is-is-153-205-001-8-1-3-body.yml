text: '8.1.3 As frequências mínimas de medição de macrotextura são definidas na Tabela 153.205-3
  do RBAC nº 153.

  8.2 Medição da macrotextura

  8.2.1 [FC 153.205(h)(1)] O operador de aeródromo deve monitorar a profundidade da macrotextura
  do pavimento por meio de medições, conforme ensaio volumétrico tipo mancha de areia descrito
  na seção 8.3.'
