  8.3 Método da mancha de areia para medição da textura superficial de pavimentos

  8.3.1 Consiste no espalhamento uniforme de um volume conhecido de areia sobre uma área da
  superfície do pavimento da pista de pouso e decolagem, e na determinação da distância média
  entre os picos e vales da macrotextura do pavimento (profundidade da macrotextura) mediante
  a divisão do volume de areia utilizado pela área de espalhamento.

  8.3.2 O equipamento utilizado consiste em um cilindro metálico com volume interno de 24cm³
  (vinte e quatro centímetros cúbicos) e de um espalhador tipo carimbo manual (vide Figura
  01). A areia a ser utilizada deve possuir granulometria contida entre as peneiras nº 50
  e nº 100 (conforme classificação da Associação Brasileira de Normas Técnicas - ABNT), isto
  é, passando na peneira nº 50 e sendo retida pela peneira nº 100.


  Cilindro Metálico Carimbo (espalhador)

  Volume = 24 cm3

  Figura 1 - Equipamentos utilizados no ensaio tipo mancha de areia.

  8.3.3 Para efetuar a medição, o cilindro metálico deve ser enchido completamente com a areia
  especificada. Derrama-se a areia do cilindro sobre o local escolhido do pavimento e espalha-se
  a areia o mais uniformemente possível sobre a superfície do pavimento, procurando formar
  uma figura geométrica conhecida, por exemplo, um círculo. Feito isso, o próximo passo é
  o cálculo da área dessa figura geométrica, sendo que o instrumento utilizado para medir
  as dimensões da referida figura geométrica deve ter precisão milimétrica.

