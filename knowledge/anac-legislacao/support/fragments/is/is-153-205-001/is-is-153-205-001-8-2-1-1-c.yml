  8.3.5 No mínimo três tomadas de profundidade da macrotextura de cada medição, conforme a
  equação (1), devem ser realizadas nas áreas consideradas deterioradas. Um maior número de
  tomadas deve ser feito sempre que deficiências da macrotextura superficial do pavimento
  forem observadas.'
