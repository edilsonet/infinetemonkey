title: 17(f)
text: 'f) procedimentos operacionais do SESCINC em baixa visibilidade.

  6.8.4.3 [Recomendação] Durante o treinamento “2. Familiarização com as aeronaves que operam
  com regularidade no aeródromo” da Tabela 01, recomenda-se que sejam realizadas visitas orientadas
  às aeronaves, em coordenação com os operadores aéreos.

  6.8.4.4 [Recomendação] Para uma maior eficiência no fluxo de informações, é importante haver
  uma padronização da fraseologia utilizada pelos interlocutores. Por isso, recomenda-se que
  durante o treinamento “6. Sistemas de comunicação e alarme” da Tabela 01 seja abordada a
  fraseologia padronizada para utilização no aeródromo.

  6.8.4.5 [Recomendação] Durante o treinamento “7. Sistemas de combate a incêndio” da Tabela
  01, sugere-se que seja abordada a utilização de mangueiras, mangotes esguichos e canhões
  monitores, além de equipamentos necessários para a montagem das linhas, como chaves e conectores.

  6.8.4.6 [Recomendação] Durante o treinamento “11. Reabastecimento do CCI com água” da Tabela
  01, é aconselhável que seja abordada, onde aplicável, a utilização de fontes alternativas
  de água previstas.

  6.8.4.7 [Recomendação] Quando for definido no PCINC que os Bombeiros de Aeródromo efetuem
  procedimentos de balizamento de emergência no aeródromo, recomenda-se que sejam realizados
  treinamentos específicos para a tarefa.

  6.8.5 [Recomendação] Com vistas à melhoria contínua do PTR-BA e da proficiência dos Bombeiros
  de Aeródromo, recomenda-se que sejam estabelecidos mecanismos de avaliação do desempenho
  em cada treinamento.

  6.8.6 [Recomendação] Questões de ordem psicológica podem impactar negativamente no rendimento
  de um profissional nos treinamentos do PTR-BA. Quando for levantada suspeita de que algum
  profissional esteja enfrentando problemas desse tipo, recomenda-se o encaminhamento para
  avaliação por profissionais da área da saúde.

  6.8.7 O parágrafo 6.8.3 desta Instrução Suplementar requer que o PTR-BA contemple atividades
  voltadas à manutenção do condicionamento físico (aeróbico e anaeróbico) dos profissionais
  em exercício nas funções operacionais do SESCINC descritas nos parágrafos 153.415(a)(1)
  a 153.415(a)(5).

  6.8.7.1 [FC 153.37(d)(6)] O operador do aeródromo deve promover, anualmente, avaliações
  periódicas da capacidade física dos profissionais em exercício das funções operacionais
  descritas nos parágrafos 153.415(a)(1) a 153.415(a)(5) do RBAC nº 153, contemplando condicionamento
  aeróbico e anaeróbico.

  6.8.7.2 [Recomendação] Para que os objetivos dos exercícios sejam alcançados de maneira
  mais efetiva, mantendo, assim, o condicionamento físico dos profissionais definidos nos
  parágrafos 153.415(a)(1) a 153.415(a)(5) do RBAC nº 153, recomenda-se o estabelecimento
  de um programa de treinamento físico para os Bombeiros de Aeródromo (BA).

  6.8.7.3 [Recomendação] Sugere-se que a avaliação da aptidão física seja realizada com base
  nas seguintes atividades, cujos parâmetros foram estabelecidos para profissionais com até
  40 (quarenta anos de idade). Para profissionais com idade superior, é possível definir limites
  menos exigentes e, ainda, ser mais restritivo para profissionais mais novos.

