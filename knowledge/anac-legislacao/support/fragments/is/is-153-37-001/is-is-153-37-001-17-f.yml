  6.8.7.4 [Recomendação] Recomenda-se a realização de exercícios, no âmbito do PTR-BA, para
  manutenção ou melhoria da flexibilidade dos Bombeiros de Aeródromo, uma vez se tratar de
  parâmetro físico que pode causar impacto no desempenho de suas funções.

  6.8.7.5 [Recomendação] É aconselhável que os Bombeiros de Aeródromo sejam submetidos a exames
  médicos periódicos para verificação de condições latentes, em especial antes da realização
  de avaliações físicas.

  6.8.8 [FC 153.37(d)(6)] O PTR-BA pode ser realizado enquanto a equipe estiver em serviço
  no aeródromo, porém os treinamentos não devem impedir o acionamento do SESCINC e o atendimento
  a possível emergência no aeródromo.

  6.8.9 [FC 153.37(d)(6)] O operador de aeródromo deve manter os registros de todos os treinamentos
  e avaliações de condicionamento físico que compõem o PTR-BA segundo conteúdo estabelecido
  no parágrafo 6.8.3 desta Instrução Suplementar'
