text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS.

  ELABORAÇÃO E IMPLEMENTAÇÃO DE TREINAMENTOS

  6.1 Generalidades

  6.1.1 O parágrafo 153.37(a) do RBAC nº 153 dispõe que o operador de aeródromo deve implementar
  e monitorar a realização de treinamentos voltados à segurança das operações de solo para
  os profissionais que trabalham na área operacional do aeródromo ou em atividades relacionadas
  com a segurança operacional.

  6.1.1.1 [FC 153.37(a)] O operador de aeródromo deve monitorar a realização dos treinamentos
  definidos na Seção 153.37 do RBAC nº 153 e desenvolvidos ao longo desta Instrução Suplementar
  com o objetivo de verificar se estão apropriados aos objetivos pretendidos, com destaque
  para sua adequação às características do aeródromo e às atividades desenvolvidas na área
  operacional dentro dos padrões de comportamento aceitáveis para a garantia da segurança
  operacional, revisando tais treinamentos sempre que não se mostrarem adequados para atender
  ao quanto esperado.'
