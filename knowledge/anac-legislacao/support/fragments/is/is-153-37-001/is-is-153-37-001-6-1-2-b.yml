text: 'b) a segurança operacional das atividades desenvolvidas na área operacional.

  6.1.3 O parágrafo 153.37(d) do RBAC nº 153 define que o operador de aeródromo deve implementar
  e monitorar os treinamentos a seguir reproduzidos, de acordo com o exigível para a sua classificação
  segundo o Apêndice A do Regulamento:'
