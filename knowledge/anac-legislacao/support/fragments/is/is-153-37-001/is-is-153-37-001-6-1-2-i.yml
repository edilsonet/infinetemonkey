section_title: 'O parágrafo 153.37(c) do RBAC nº 153 define que os treinamentos devem ter
  como objetivos:'
subsection_id: i
cite: 6.1.2(i)
title: 6.1.2(i)
text: 'i) Treinamento para avaliação e reporte de condição de pista de pouso e decolagem.

  6.1.3.1 O conteúdo programático dos treinamentos listados no parágrafo 153.37(d) do RBAC
  nº 153 se encontram detalhados a seguir, em tópicos específicos desta Instrução Suplementar.

  6.1.3.2 O operador de aeródromo pode definir pela inclusão de outros treinamentos, em decorrência
  das características de sua operação e conforme resultados do levantamento periódico das
  necessidades de qualificação e treinamento.

  6.2 Programa de Instrução de Segurança Operacional (PISOA)

  6.2.1 O parágrafo 153.37(b) do RBAC nº 153 preleciona que o operador de aeródromo deve estabelecer
  e manter um Programa de Instrução de Segurança Operacional (PISOA), o qual abordará, de
  maneira estruturada, todos os treinamentos necessários para que o desempenho das atividades
  pelos profissionais que atuam na área operacional ou que estejam a ela vinculadas ocorra
  com segurança operacional e de maneira adequada às características do aeródromo.'
