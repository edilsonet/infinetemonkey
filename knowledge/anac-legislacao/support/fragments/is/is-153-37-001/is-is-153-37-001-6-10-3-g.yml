  6.11 Treinamento para avaliação e reporte de condição de pista de pouso e decolagem

  6.11.1 O treinamento para avaliação e reporte de condição de pista de pouso e decolagem,
  estabelecido pelo parágrafo 153.37(d)(9) do RBAC nº 153 e parte do PISOA, deve ser direcionado
  a todos os profissionais que estejam direta ou indiretamente envolvidos na atividade de
  monitoramento estabelecida no parágrafo 153.133(d) do RBAC nº 153.

  6.11.2 [FC 153.37(d)(9)] O treinamento para avaliação e reporte de condição de pista de
