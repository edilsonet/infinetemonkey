section_id: 6.2.2
section_title: 'O parágrafo 153.37(b) estabelece também que o PISOA deve possuir as seguintes
  características:'
subsection_id: c
cite: 6.2.2(c)
title: 6.2.2(c)
text: 'c) ser adequados e estabelecidos, em seu conteúdo programático, aos diversos públicos-alvo
  que o aeródromo possa ter.

  6.2.3 [FC 153.37(b) e (c)] O PISOA deve ser desenvolvido em função das características do
  aeródromo e complexidade de suas operações, sendo cada um de seus treinamentos estabelecido
  com base em tais parâmetros, no objetivo pretendido para cada treinamento e moldado para
  o público-alvo que se pretende atingir.

  6.2.4 [FC 153.107, IS 153.107-001 e 153.37(b) e (c)] O operador de aeródromo deve prever
  no PISOA a vinculação de cada um dos treinamentos obrigatórios descritos no parágrafo 153.37(d)
  do RBAC nº 153 e reproduzidos no parágrafo 6.1.3 desta Instrução Suplementar, com exceção
  do PTR-BA, a cada tipo de credenciamento do aeródromo, sendo tal treinamento condicionante
  para a obtenção da respectiva credencial.

  6.2.5 Destaca o parágrafo 153.37(f) do RBAC nº 153 que o operador de aeródromo deve realizar
  periodicamente levantamento das necessidades de treinamento para o pessoal envolvido com
  atividades relacionadas à segurança operacional, descrevendo no PISOA como é realizado esse
  levantamento, devendo os conteúdos programáticos dos treinamentos serem apropriados às funções
  de cada profissional no SGSO.

  6.2.5.1 [Recomendação] É aconselhável que no levantamento de necessidades de treinamento
  seja considerada uma série de informações, tais como alterações no contexto operacional,
  nas configurações do aeródromo, novos procedimentos, mudanças organizacionais, mudanças
  das instruções de trabalho, mudanças na legislação, dados de ocorrências no aeródromo, dentre
  outros fatores.

  6.2.5.2 [Recomendação] Recomenda-se que o operador de aeródromo considere no levantamento
  de necessidades de treinamento as análises de risco elaboradas no âmbito do Sistema de Gerenciamento
  da Segurança Operacional (SGSO). Um perigo identificado pode ser mitigado com uma mudança
  em treinamentos já existentes ou com a proposta de novos treinamentos.

  6.2.5.3 [Recomendação] O estabelecimento de procedimento para aferir a efetividade dos treinamentos
  como, por exemplo, avaliação de aprendizagem, de reação, de transferência em amplitude,
  de transferência em profundidade ou de valor final, é essencial para que o operador do aeródromo
  garanta a efetividade do treinamento como instrumento de mitigação de riscos, permitindo,
  ainda, uma melhor alocação dos recursos disponíveis para essa finalidade.

  6.2.6 [FC 153.37(b) e 153.39] O operador de aeródromo deve registrar as alterações realizadas
  no seu PISOA e as respectivas justificativas para essas alterações.

  6.2.7 [Recomendação] Para maiores informações sobre como elaborar e implementar um PISOA,
  consulte o “Manual de Orientações para Elaboração e Avaliação de Eficácia do Programa de
  Instrução em Segurança Operacional (PISOA)” disponível no sítio eletrônico da ANAC na rede
  mundial de computadores. (clique para acessar o Guia)

  6.3 Treinamento geral

  6.3.1 O treinamento geral, definido pelo parágrafo 153.37(d)(1) do RBAC nº 153, deve ser
  direcionado a todos os profissionais que atuam ou influenciam diretamente na área operacional.

  6.3.2 O treinamento geral deve ter como objetivo a familiarização com o aeródromo de todos
  os profissionais que atuam ou influenciam diretamente na área operacional.'
