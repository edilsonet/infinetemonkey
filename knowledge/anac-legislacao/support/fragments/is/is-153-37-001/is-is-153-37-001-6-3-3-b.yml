section_title: '[FC 153.37(d)(1)] O treinamento geral deve conter pelo menos:'
subsection_id: b
cite: 6.3.3(b)
title: 6.3.3(b)
text: 'b) comportamento na área operacional, o que inclui:

  I) produção de faíscas e similares;

  II) uso de celular;

  III) comportamentos seguros, com enfoque às regras de tráfego na área operacional em geral
  e área de manobras em específico;

  IV) recolhimento de objeto estranho que possa causar dano a aeronave (Foreign Object Debris
  - FOD);

  V) necessidade de relatar situações que afetem ou possam afetar a segurança operacional;'
