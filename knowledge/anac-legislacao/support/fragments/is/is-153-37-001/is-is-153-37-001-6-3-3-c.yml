section_title: '[FC 153.37(d)(1)] O treinamento geral deve conter pelo menos:'
subsection_id: c
cite: 6.3.3(c)
title: 6.3.3(c)
text: 'c) posturas em situações de emergência, em especial:

  I) procedimentos para intervenção inicial no caso de princípio de incêndio durante serviço
  de solo com acionamento imediato da equipe contraincêndio do aeródromo;

  II) atividades gerais do aeródromo.

  6.4 Treinamento básico para a segurança operacional

  6.4.1 O treinamento básico para a segurança operacional, estabelecido pelo parágrafo 153.37(d)(2)
  do RBAC nº 153 e parte do PISOA, deve ser direcionado a todos os profissionais que tenham
  acesso à área operacional.'
