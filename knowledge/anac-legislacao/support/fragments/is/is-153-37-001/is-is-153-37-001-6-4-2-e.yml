section_id: 6.4.2
section_title: '[FC 153.37(d)(2)] O treinamento básico de segurança operacional deve incluir
  os seguintes conteúdos:'
subsection_id: e
cite: 6.4.2(e)
title: 6.4.2(e)
text: 'e) demais assuntos de relevância para o desenvolvimento e melhoria contínua do SGSO
  do aeródromo.

  6.4.2.1 O conteúdo do treinamento básico de segurança operacional a ser ministrado no âmbito
  do PISOA deve ter como foco as especificidades e peculiaridades do SGSO do aeródromo, não
  se limitando a repassar os princípios básicos e aspectos gerais de todo e qualquer SGSO.

  6.4.3 O operador de aeródromo poderá, a seu critério, consolidar em um único treinamento
  o quanto exigido pelo treinamento geral, detalhado em 6.3 desta Instrução Suplementar, e
  pelo treinamento básico de segurança operacional, contido no 6.4 deste mesmo Instrumento.

  6.5 Treinamento para condução de veículos na área operacional

  6.5.1 O treinamento para condução de veículos na área operacional, estabelecido pelo parágrafo
  153.37(d)(3) do RBAC nº 153 e parte do PISOA, deve ser destinado a todos os profissionais
  autorizados a conduzir veículos na área operacional.

  6.5.2 O objetivo do treinamento para condução de veículos na área operacional deve ser a
  familiarização e padronização dos procedimentos para condução de veículos na área operacional.'
