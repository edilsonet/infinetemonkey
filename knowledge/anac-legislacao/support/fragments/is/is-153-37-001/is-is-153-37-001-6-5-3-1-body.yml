text: '6.5.3.1 [Recomendação] Sugere-se que no treinamento para condução de veículos na área
  operacional sejam considerados aspectos teóricos e práticos.

  6.5.4 [Recomendação] Para o estabelecimento do treinamento para condução de veículos na
  área operacional, é importante que o operador de aeródromo considere as normas advindas
  do órgão de controle de tráfego aéreo, especialmente em relação à fraseologia adotada para
  comunicação na área operacional, bem como os termos de acordos operacionais por ventura
  celebrados no aeródromo.

  6.5.5 [Recomendação] É aconselhável que para a elaboração do treinamento para condução de
  veículos na área operacional, o operador de aeródromo consulte o “Manual sobre Critérios
  de Movimentação no Solo e o SOCMS”, disponível no sítio eletrônico da ANAC na rede mundial
  de computadores. (clique para acessar o Manual)

  6.6 Treinamento para acesso e permanência na área de manobras

  6.6.1 O treinamento para acesso e permanência na área de manobras, estabelecido pelo parágrafo
  153.37(d)(4) do RBAC nº 153 e parte do PISOA, deve ser direcionado a todos os profissionais
  que atuam na área de manobras.'
