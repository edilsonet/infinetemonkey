section_title: '[FC 153.37(d)(3)] O treinamento para condução de veículos na área operacional
  deve conter pelo menos o seguinte conteúdo:'
subsection_id: c
cite: 6.5.3(c)
title: 6.5.3(c)
text: 'c) atividades relacionadas à condução de veículos, que incluem:

  I) comunicação e fraseologia em radiocomunicação; e

  II) atribuições do serviço de tráfego aéreo (Air Traffic Service - ATS) do aeródromo.'
