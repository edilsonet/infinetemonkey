section_id: 6.6.2
section_title: '[FC 153.37(d)(4)] O treinamento para acesso e permanência na área de manobras
  deve conter pelo menos o seguinte conteúdo:'
subsection_id: d
cite: 6.6.2(d)
title: 6.6.2(d)
text: 'd) funções do órgão ATS, no caso de aeródromo controlado, ou da Frequência de Coordenação
  entre Aeronaves (FCA), se aeródromo não controlado ou controlado com operação em tempo parcial.

  6.6.3 [Recomendação] Sugere-se que no treinamento para acesso e permanência na área de manobras
  sejam considerados aspectos teóricos e práticos, incluindo, se possível, exame prático nos
  treinamentos dos motoristas, com atualizações periódicas em fraseologia.

  6.6.4 [Recomendação] Para o estabelecimento de treinamento para acesso e permanência na
  área de manobras, é importante que o operador de aeródromo considere as normas advindas
  do órgão de controle de tráfego aéreo, especialmente em relação à fraseologia adotada para
  comunicação na área operacional e conduta na área de manobras.

  6.6.5 [Recomendação] Sugere-se que para a elaboração do treinamento para acesso e permanência
  na área de manobras, o operador de aeródromo consulte o “Manual para Prevenção de Incursão
  em Pista no Aeródromo”, disponível no sítio eletrônico da ANAC na rede mundial de computadores.
  (clique aqui para acessar o Manual)

  6.6.6 [Recomendação] Para a avaliação do treinamento para acesso à área de manobras, sugere-se
  a utilização do documento contido no seguinte endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/aerodromos/seguranca-operacional/runway-safety/QuestionriodeAvaliaodoTreinamentodosMotoristasqueAcessamareadeManobras.xlsx

  6.7 Treinamento para operações em baixa visibilidade

  6.7.1 O treinamento para operações em baixa visibilidade, estabelecido pelo parágrafo 153.37(d)(5)
  do RBAC nº 153 e parte do PISOA, deve ser direcionado a todos os profissionais autorizados
  a ingressar, permanecer ou conduzir veículos na área de manobras em condições de baixa visibilidade.'
