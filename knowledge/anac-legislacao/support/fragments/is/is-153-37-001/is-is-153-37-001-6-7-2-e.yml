section_id: 6.7.2
section_title: '[FC 153.37(d)(5)] O treinamento para operações em baixa visibilidade deve
  abordar pelo menos o seguinte conteúdo:'
subsection_id: e
cite: 6.7.2(e)
title: 6.7.2(e)
text: 'e) atividades relacionadas à operação em baixa visibilidade, que compreendem:

  I) preparação para operação em baixa visibilidade (área de operações, manutenção e resposta
  à emergência); e

  II) procedimentos de emergência.

  6.7.3 O parágrafo 153.131(c) do RBAC nº 153 estabelece que o operador de aeródromo deve
  treinar os profissionais que atuam na área de movimento para utilizar apenas uma frequência
  de radiotelefonia (RTF) para comunicação com o órgão ATS durante operação em baixa visibilidade.

  6.7.4 [Recomendação] Tendo em vista operações em baixa visibilidade nem sempre serem frequentes
  no aeródromo, recomenda-se que seja prevista a realização periódica de exercícios simulados
  das operações em baixa visibilidade, a fim de preparar os envolvidos para as situações reais,
  mantendo-os familiarizados com os procedimentos específicos do Sistema de Orientação e Controle
  da Movimentação em Solo (SOCMS) para tal condição.

  6.7.5 [Recomendação] É aconselhável que para a elaboração do treinamento para condução de
  veículos na área operacional, o operador de aeródromo consulte o “Manual sobre Critérios
  de Movimentação no Solo e o SOCMS”, disponível no sítio eletrônico da ANAC na rede mundial
  de computadores. (clique para acessar o Manual)

  6.8 Treinamento recorrente para bombeiros de aeródromo - PTR-BA

  6.8.1 O treinamento recorrente para bombeiro de aeródromo, estabelecido pelo parágrafo 153.37(d)(6)
  do RBAC nº 153, parte do PISOA e delineado no Programa de Treinamento para Bombeiro de Aeródromo
  (PTR-BA), deve ser destinado aos profissionais do Serviço de Salvamento e Combate a Incêndio
  (SESCINC).

  6.8.2 O objetivo do PTR-BA deve ser a manutenção do nível de proficiência adquirido durante
  o processo de habilitação dos profissionais do SESCINC e a familiarização com as particularidades
  do aeródromo, das aeronaves que nele operam e dos procedimentos previstos na planificação
  de emergência.'
