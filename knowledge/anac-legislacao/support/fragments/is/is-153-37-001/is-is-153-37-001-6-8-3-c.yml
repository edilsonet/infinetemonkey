section_title: '[FC 153.37(d)(6)] O PTR-BA deve contemplar pelo menos o seguinte:'
subsection_id: c
cite: 6.8.3(c)
title: 6.8.3(c)
text: 'c) para os Bombeiros de Aeródromos Classe IV, para o ano seguinte ao da aprovação em
  curso de habilitação ou de atualização, a realização dos exercícios práticos previstos no
  “Módulo Resgate e Combate a Incêndio em Aeronaves” do “Curso de Atualização para Bombeiro
  de Aeródromo” em área que atenda ao disposto no item 6.3.2.1 do Apêndice ao Anexo da Resolução
  nº 279, de 10 de julho de 2013.

  6.8.4 [FC 153.37(d)(6)] O parágrafo 6.8.3 desta Instrução Suplementar requer que o PTR-BA
  contemple atividades planejadas para cada membro da equipe de serviço nas diversas situações
  de emergência. Para tanto, devem ser realizados pelo menos os treinamentos descritos na
  Tabela 01, a seguir, considerando a função operacional desempenhada por cada profissional
  da equipe de serviço do SESCINC.

  Tabela 01 - Treinamentos de PTR-BA

  Treinamento

  Funções no SESCINC

  BA-CE

  BA-MC

  BA-1/ BA-2

  BA-LR

  BA-RE

  OC'
