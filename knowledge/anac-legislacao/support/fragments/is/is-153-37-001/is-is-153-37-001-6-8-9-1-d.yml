  6.9 Treinamento básico para operações

  6.9.1 O treinamento básico para operações, estabelecido pelo parágrafo 153.37(d)(7) do RBAC
  nº 153 e parte do PISOA, deve ser destinado aos profissionais que irão atuar na área operacional,
  que executem tarefas de supervisão das atividades desenvolvidas em pátio de aeronaves, conforme
  Seção 153.117 do RBAC nº 153, e atividades de monitoramento das condições do aeródromo,
  segundo Seção 153.133.

  6.9.2 [FC 153.37(d)(7)] O treinamento básico para operações deve abordar os seguintes conteúdos
  mínimos, adequados às características físicas e operacionais de cada aeródromo:'
