text: 'v) tratamento e controle de FOD.


  6.9.3 [Recomendação] Para o estabelecimento do treinamento básico para operações, é importante
  que o operador de aeródromo considere as normas advindas do órgão de serviço de tráfego
  aéreo, especialmente em relação à fraseologia adotada para comunicação na área operacional,
  bem como os termos de acordos operacionais em vigor.

  6.9.4 [Recomendação] Sugere-se que na elaboração do treinamento básico para operações, o
  operador de aeródromo considere as normas advindas dos demais órgãos públicos que atuam
  no aeródromo.

  6.9.5 [Recomendação] É aconselhável que para a elaboração do treinamento básico para operações,
  o operador de aeródromo consulte o “Manual sobre Critérios de Movimentação no Solo e o SOCMS”
  e o “Manual sobre gerenciamento de risco associado ao FOD”, disponíveis no sítio eletrônico
  da ANAC na rede mundial de computadores. (clique para acessar os manuais)

  6.10 Treinamento para o gerenciamento do risco da fauna

  6.10.1 O treinamento para o gerenciamento do risco da fauna, estabelecido pelo parágrafo
  153.37(d)(8) do RBAC nº 153 e parte do PISOA, deve ser direcionado a todos os profissionais
  que estejam direta ou indiretamente envolvidos em ações de gerenciamento do risco da fauna
  no aeródromo.

  6.10.2 O objetivo do treinamento para gerenciamento de risco de fauna deve ser a familiarização
  com os procedimentos para gerenciamento do risco de fauna, de acordo com as responsabilidades
  e capacidades específicas de cada profissional envolvido nessas atividades, sendo coordenado
  pelo responsável por ações de gerenciamento do risco da fauna no aeródromo.'
