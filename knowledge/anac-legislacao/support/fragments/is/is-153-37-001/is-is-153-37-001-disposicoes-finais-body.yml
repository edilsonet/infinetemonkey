title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  8.1 Os casos omissos serão dirimidos pela ANAC.

  8.2 Esta IS entra em vigor em 2 de maio de 2023.

  REFERÊNCIAS BIBLIOGRÁFICAS

  9.1 AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL. Regulamento Brasileiro da Aviação Civil nº 153, Emenda
  nº 07, de 14 de ABRIL de 2023. Aeródromos - operação, manutenção e resposta à emergência.
  Brasília: ANAC, 2023 Disponível em: https://www.anac.gov.br/assuntos/legislacao/ legislacao-1/rbha-e-rbac.
  Acesso em: 20 abr. 2023

  9.2 International Civil Aviation Organization. DOC 9137-AN/898 - Airport Services Manual
  Part 1 - Rescue and Firefighting. 4rd ed., Montréal: ICAO, 2015.

  9.3 International Civil Aviation Organization. Doc 9859, Safety Management Manual (SMM).
  4rd ed., Montréal: ICAO, 2018.

  9.4 International Civil Aviation Organization. DOC 9981 - Procedures for Air Navigation
  Services (PANS) - Aerodromes. 3rd ed., Montréal: ICAO, 2020.'
