text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS.

  DIVULGAÇÃO DE REDUÇÃO TEMPORÁRIA DE CAT

  6.1 Generalidades

  6.1.1 A Seção 153.403 do RBAC nº 153 descreve os procedimentos para determinação da categoria
  contraincêndio do aeródromo (CAT) e a necessidade de divulgação desta informação por meio
  do órgão de divulgação de informações aeronáuticas.

  6.1.2 Considerando o descrito no parágrafo 153.403(c)(2), quando há redução nos recursos
  do aeródromo que indique a alteração de sua CAT, o operador de aeródromo deve declarar essa
  redução e tomar providências para sua divulgação.

  6.1.3 Há que se considerar, contudo, que é da essência do serviço a utilização dos equipamentos
  e materiais em atividades ordinárias, na rotina normal do Serviço de Salvamento e Combate
  a Incêndio em Aeródromos Civis (SESCINC), como, por exemplo, as relacionadas ao treinamento
  de pessoal e à manutenção preventiva e teste dos equipamentos, troca de pneus, óleo ou reabastecimento
  dos Carro Contraincêndio de Aeródromo (CCI). Nessas situações, é esperada a redução temporária
  desses recursos (no curso do treinamento, por exemplo, os tanques dos agentes extintores
  deixam de estar em sua capacidade máxima, o que, em tese, estaria em desacordo com o disposto
  no parágrafo 153.407(b)(5) do RBAC nº 153).

  6.1.4 Tendo em conta que essas atividades são planejadas pelo operador do aeródromo, ou
  se encontram na rotina normal de funcionamento do SESCINC, elas alteram as quantidades de
  recursos disponíveis somente conjunturalmente, não significando uma alteração estrutural
  no serviço prestado.

  6.1.5 Dessa forma, há que se considerar como passíveis de reduzirem a CAT do aeródromo somente
  as reduções estruturais nos recursos do SESCINC, essas tidas como aquelas que não podem
  ser prontamente solucionadas pelo operador do aeródromo.'
