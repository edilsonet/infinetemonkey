title: 6.1.6(d)
text: 'd) redução da quantidade de bombeiros de aeródromo habilitados e equipados para compor
  as equipagens mínimas dos CCI.

  6.2 Meios de divulgação da redução temporária de CAT

  6.2.1 Ao constatar que a CAT do aeródromo sofreu redução por uma indisponibilidade estrutural
  nos recursos do SESCINC, o operador de aeródromo deve fazer com que a informação desta redução
  seja comunicada aos órgãos e entidades responsáveis pelo controle de tráfego aéreo e pela
  divulgação de informações aeronáuticas.

  6.2.2 [FC 153.403(c)] Além de comunicar os órgãos e entidades responsáveis pelo controle
  de tráfego aéreo e pela divulgação de informações aeronáuticas sobre a redução da CAT, o
  operador do aeródromo deve informar a ANAC, por meio do endereço de correio eletrônico gtop@anac.gov.br,
  as razões que levaram à redução da CAT, bem como as ações tomadas pelo operador de aeródromo
  e o prazo previsto para retorno à CAT previamente divulgada.'
