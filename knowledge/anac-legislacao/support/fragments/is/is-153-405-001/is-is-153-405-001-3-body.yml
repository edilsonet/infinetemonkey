title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Organização da Aviação Civil Internacional (OACI), Annex 14 to the Convention on

  International Civil Aviation, Volume I - Aerodrome Design and Operations - 7ª Edição

  - 2016.

  3.4. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  3.5. Associação Brasileira de Normas Técnicas (ABNT), NBR 15511: Líquido Gerador de

  espuma (LGE), de baixa expansão, para combate a incêndio em combustíveis líquidos -

  2008.

  3.6. Associação Brasileira de Normas Técnicas (ABNT), NBR 9695: Pó para extinção de

  incêndio - 2012.'
