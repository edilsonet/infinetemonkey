title: 6(a)
text: 'a) O ensaio tem o objetivo de avaliar a capacidade do LGE para:

  • Extinção de fogo com área de:

  o 4,5 m², para testes de eficácia nível “B”; ou

  o 7,3 m², para testes de eficácia nível “C”.

  • Resistência à reignição devida à presença de combustível e calor.'
