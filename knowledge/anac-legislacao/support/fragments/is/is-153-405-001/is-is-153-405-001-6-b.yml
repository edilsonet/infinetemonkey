cite: 6(b)
title: 6(b)
text: 'b) Caso seja utilizado LGE de eficácia nível “C”, a água para produção de solução de

  espuma e o regime de descarga mínimos para cada CAT são apresentados,

  respectivamente, nas colunas [4] e [5] do Tabela 153.403-1.

  6.2.4. [Recomendação] - A disponibilização ao SESCINC de LGE com diferentes eficácias

  pode gerar dificuldades no cálculo da quantidade necessária de agente extintor principal

  para a CAT, além de criar a necessidade de controles para evitar a mistura em um mesmo

  CCI. Assim, recomenda-se que não sejam disponibilizados LGE com eficácias diferentes

  em um mesmo SESCINC.

  6.2.5. Caso seja utilizada pelo SESCINC uma combinação de LGE com eficácias níveis “B” e

  “C”, a água para produção de solução de espuma e o regime de descarga mínimos para

  cada CAT devem ser calculados conforme quantidade disponibilizada de cada agente.

  6.2.6. [Recomendação] - Em aeródromos onde operem aeronaves que utilizam solventes

  polares como combustível, recomenda-se a avaliação da necessidade de disponibilização

  de LGE polivalente, tipos 6 ou 7 (que atendem classes AV e AR), conforme ABNT/NBR

  15511.

  6.3. Agente extintor complementar

  6.3.1. Conforme descrito no parágrafo 153.405(b), o agente extintor complementar deve ser
  o

  Pó Químico BC (classe B - líquidos inflamáveis e classe C - materiais elétricos) à baseData
  de emissão: 15 de maio de 2019 IS nº 153.405-001

  Revisão A

  de bicarbonato de sódio, ou de outra composição com capacidade equivalente de extinção

  de incêndio.

  6.3.2. [FC 153.405(b)] - As propriedades físico-químicas e de desempenho do agente

  complementar devem atender ao disposto na ABNT/NBR 9695.

  6.4. Avaliação do nível de eficácia do agente extintor principal

  6.4.1. [FC 153.405(a)] - Para verificar a eficácia da solução de espuma produzida pelo LGE,

  podem ser realizados ensaios de fogo, conforme descrito nessa IS.'
