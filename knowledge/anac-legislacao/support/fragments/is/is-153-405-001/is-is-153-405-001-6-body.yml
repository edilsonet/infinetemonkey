title: AGENTES EXTINTORES
text: '6. AGENTES EXTINTORES

  6.1. Generalidades

  6.1.1. A seção 153.403 do RBAC nº 153 indica que a quantidade e regime de descarga dos

  agentes extintores principal e complementar é critério para definição da Categoria

  Contraincêndio do Aeródromo (CAT), conforme Tabela 153.403-1.

  6.1.2. [Recomendação] - A manutenção da operacionalidade dos sistemas de combate a

  incêndio é responsabilidade do operador do aeródromo. Para manutenção das

  características técnicas dos agentes extintores, recomenda-se que o operador do

  aeródromo observe todas as recomendações dos fabricantes de LGE e PQ.

  6.1.3. [Recomendação] - Para permitir a manutenção da operacionalidade do SESCINC após

  utilização dos agentes extintores dos CCI em um atendimento, recomenda-se a

  disponibilização em estoque quantidade de LGE, PQ e agente propulsor para o sistema

  de PQ correspondente a 100% das quantidades efetivamente transportadas no(s) CCI em

  linha.

  6.1.4. Apesar de não haver obrigatoriedade de disponibilização de estoques de LGE e PQ,

  durante inspeções da ANAC, pode ser necessária a realização de testes para verificação

  da operacionalidade de sistemas dos CCI. Para que o aeródromo não tenha redução de

  sua CAT em razão dos testes, é necessário que o operador disponibilize quantidades

  suficientes para reposição nos CCI após avaliação.Data de emissão: 15 de maio de 2019 IS
  nº 153.405-001

  Revisão A

  6.1.5. [Recomendação] - Recomenda-se que sejam disponibilizados estoques também para

  treinamentos e testes de equipamentos a serem realizados pelo operador do aeródromo.

  6.2. Agente extintor principal

  6.2.1. Conforme descrito no parágrafo 153.405(a), o agente extintor principal deve ser a
  solução

  de espuma de eficácia nível “B” ou “C”, Classe AV, em soluções de 1, 3 ou 6%.

  6.2.2. Para garantir a correta utilização do agente extintor, os componentes dos sistemas
  de

  geração de solução de espuma, em especial os proporcionadores e dosadores de LGE dos

  CCI devem estar calibrados e adequados ao tipo de LGE definido para a utilização no

  aeródromo.

  6.2.3. As quantidades de água e regime de descarga do agente extintor principal, apresentadas

  na Tabela 153.403-1, dependem do tipo de LGE utilizado.'
