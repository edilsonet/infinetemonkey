title: 6(c)
text: 'c) Combustível:

  • 100 litros de Avtur (Jet A1) ou querosene, para testes de eficácia nível “B”; ou

  • 157 lirtos de Avtur (Jet A1) ou querosene, para testes de eficácia nível “C”.

  Para testes em solventes polares, deve ser utilizado álcool etílico anidro com teor

  alcoólico mínimo de 99° INPM.Data de emissão: 15 de maio de 2019 IS nº 153.405-001

  Revisão A'
