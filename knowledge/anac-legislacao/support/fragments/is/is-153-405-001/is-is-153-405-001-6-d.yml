title: 6(d)
text: 'd) Condições de teste:

  • Temperatura do ar: ≥ 15 °C;

  • Temperatura da solução de espuma: ≥ 15 °C;

  • Velocidade do vento: ≤ 3 m/s; e

  • Caso o teste seja realizado ao ar livre, não deve ocorrer em condições de

  precipitação.'
