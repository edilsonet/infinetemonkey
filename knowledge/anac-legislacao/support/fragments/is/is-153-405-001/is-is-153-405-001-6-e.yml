cite: 6(e)
title: 6(e)
text: 'e) Procedimentos de teste:

  • Posicionar a câmara com a mistura de água e LGE a favor do vento em relação

  ao tanque de ensaio.

  • Posicionar o esguicho na horizontal a uma altura de 1 metro acima da borda

  superior do tanque de ensaio e a uma distância que garanta que a espuma caia

  no centro do tanque.

  • Testar os equipamentos para produção de espuma para garantir a pressão de 7

  bar no esguicho e o regime de descarga de 11,4 litros por minuto.

  • Abastecer o tanque de teste com:

  o 100 litros de água e 100 litros de combustível, para testes de eficácia

  nível “B”; ou

  o 157 litros de água e 157 litros de combustível, para testes de eficácia

  nível “C”.

  • Registrar a temperatura do ar, combustível, água e mistura de espuma e checar

  se estão dentro da faixa correta.

  • Registrar a velocidade do vento e checar se está dentro da faixa correta.

  • Iniciar a chama e permitir uma pré-queima de 60 segundos após as chamas

  tomarem toda a superfície líquida do tanque.

  • Após os 60 segundos, aplicar espuma continuamente, com a pressão e regime

  de descarga definidos, por 120 segundos.

  • Registrar o tempo de extinção.

  • Posicionar o tanque de reignição no centro do tanque de ensaio.

  • Iniciar a chama no tanque de ignição 120 segundos após o fim da aplicação de

  espuma.

  • Registrar quando 25% do combustível no tanque de ensaio estiver novamente

  em chamas.'
