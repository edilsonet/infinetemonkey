section_title: AGENTES EXTINTORES
subsection_id: f
cite: 6(f)
title: 6(f)
text: 'f) O LGE atende ao nível de eficácia testado se:

  • O tempo de extinção do fogo na superfície do tanque de ensaio for igual ou

  inferior a 60 segundos; e

  • O tempo de reignição de 25% da superfície do tanque de ensaio for igual ou

  superior a 5 minutos.

  6.4.2. Mais informações relativas aos ensaios para avaliação do atendimento aos níveis de

  eficácia podem ser verificadas no capítulo 8 do DOC 9137 - Part 1.Data de emissão: 15 de
  maio de 2019 IS nº 153.405-001

  Revisão A

  6.4.3. A ABNT/NBR 15511 utiliza a metodologia de cálculo descrita para avaliação da eficácia

  nível “B”. Assim, testes realizados conforme ABNT/NBR 15511 serão aceitos para

  demonstração desta eficácia.

  6.4.4. [Recomendação] - Recomenda-se que os testes sejam realizados por laboratório

  competente, conforme ABNT NBR ISO/IEC 17025.

  6.4.5. Para garantir a eficácia da mistura de LGE de diferentes fabricantes e/ou composições

  químicas, é necessário que o operador do aeródromo verifique a miscibilidade dos

  produtos.

  6.4.6. A ABNT/NBR 15511 apresenta critérios de testes para avaliação da miscibilidade de

  LGE.

  6.4.7. Caso não seja apresentado laudo de miscibilidade mencionado no item 6.4.5, para

  garantia de que a eficácia seja mantida, o operador do aeródromo deve estabelecer

  procedimentos para utilização segregada (em diferentes CCI) dos LGE disponibilizados.'
