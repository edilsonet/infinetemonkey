title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1. Regulamento Brasileiro da Aviação Civil nº 153: Aeródromos - operação, manutenção e

  resposta à emergência.

  3.2. Resolução nº 30, de 21 de maio de 2008, artigo 14 e seguintes.

  3.3. Organização da Aviação Civil Internacional (OACI), DOC 9137-NA/898: Airport

  Services Manual, Part 1 - Rescue and Firefighting, 4ª Edição - 2015.

  3.4. National Fire Protection Association (NFPA), NFPA 414: Standard for Aircraft Rescue

  and Fire-Fighting Vehicles - 2017.'
