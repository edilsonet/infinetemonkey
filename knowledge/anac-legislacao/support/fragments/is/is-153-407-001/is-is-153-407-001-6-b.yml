text: 'b) Fabricante, Lote e Validade para o agente extintor complementar

  6.2. Carro Contraincêndio (CCI)

  6.2.1. Os CCI são veículos projetados para operações de combate a incêndio em aeronaves.

  Considerando as especificidades do atendimento a emergências em aeronaves, espera-se

  que os CCI possuam rápida locomoção e grande capacidade de descarga de agentes

  extintores.

  6.2.2. [FC 153.407(c)] - Para garantir o transporte com segurança e permitir uma rápida

  equipagem dos BA, os CCI devem contar com suporte nos bancos para os EPR previstos

  no parágrafo 153.421(b).

  6.2.3. [Recomendação] - Além dos itens obrigatórios descritos na Tabela 153.407-1,

  recomenda-se que os CCI apresentem as seguintes características:

  Parâmetro

  Capacidade do tanque de água do CCI (litros)

  < 2.000 ≥ 2.000 até

  ≤ 6.000 > 6.000

  Capacidade do tanque disponível -

  veículo nivelado (%) 100 100 100

  Capacidade do tanque disponível -

  20º de inclinação lateral (%) 85 85 85

  Capacidade do tanque disponível -

  30º de inclinação ascendente ou

  descendente (%)

  85 85 85

  Capacidade de descarga Alta

  Alta e Baixa

  (para canhões com regime de descarga a

  partir de 2.800 l/min)

  Aceleração 0 a 80 km/h (s) ≤ 30 ≤ 25 ≤ 35

  Velocidade máxima (km/h) ≥ 110 ≥ 110 ≥ 110

  Ângulo de ataque e saída (graus) 30 30 30

  6.2.4. [Recomendação] - Recomenda-se que os CCI possuam rodagem simples na traseira e

  transmissão automática ou semiautomática.Data de emissão: 15 de maio de 2019 IS nº 153.407-001

  Revisão A

  6.2.5. A NFPA 414 - Standard for Aircraft Rescue and Fire-Fighting Vehicles apresenta as

  características técnicas e de desempenho desejáveis para os CCI.

  6.2.6. [Recomendação] - Recomenda-se que, na aquisição dos CCI para utilização no

  aeródromo, o operador observe o descrito na NFPA 414.

  6.2.7. Um guia adicional para características desejáveis em um CCI é apresentado no capítulo

  5 do DOC 9137-NA/898: Airport Services Manual, Part 1 - Rescue and Firefighting.

