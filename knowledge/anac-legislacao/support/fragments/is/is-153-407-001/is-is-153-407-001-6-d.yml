section_title: CARRO CONTRAINCÊNDIO E DEMAIS VEÍCULOS DO SESCINC
subsection_id: d
cite: 6(d)
title: 6(d)
text: 'd) Carro de Regate e Salvamento (CRS): veículo utilizado para transporte da equipe

  de resgate, seus equipamentos de proteção (TP e EPR), além dos equipamentos de

  apoio às operações de resgate.

  6.3.2. [Recomendação] - Com o objetivo de dar maior agilidade e mobilidade ao BA-CE no

  cenário de emergência, recomenda-se que seja disponibilizado CACE para transporte

  exclusivo desse profissional, em especial nos aeródromos Classe IV ou Classe III com

  CAT 8 ou superior.

  6.3.3. [Recomendação] - A condução de veículos em um cenário de emergência requer

  extrema atenção, considerando a possível existência de riscos associados a esse cenário,

  além de trânsito de pessoas e outros veículos. Durante o atendimento a emergências,

  espera-se que o BA-CE realize a avaliação inicial do cenário, indicando o melhor

  posicionamento para os CCI, assim como efetue a coordenação dos trabalhos da equipe,

  inclusive em contato por rádio. Para reduzir o risco de acidentes e possíveis prejuízos
  à

  função exercida, quando for disponibilizado CACE, recomenda-se que a condução do

  veículo não seja realizada pelo BA-CE.

  6.3.4. [Recomendação] - Caso seja disponibilizado CACE, recomenda-se que o veículo não

  seja utilizado para rebocar outros veículos ou equipamentos existentes no SESCINC.

  6.3.5. [Recomendação] - Recomenda-se que a equipe de resgate e os equipamentos de apoio

  as operações de resgate sejam transportados em veículo próprio denominado CRS.

  6.3.6. [Recomendação] - Caso seja disponibilizado CRS, recomenda-se que o veículo não seja

  utilizado para transporte de acidentados.Data de emissão: 15 de maio de 2019 IS nº 153.407-001

  Revisão A'
