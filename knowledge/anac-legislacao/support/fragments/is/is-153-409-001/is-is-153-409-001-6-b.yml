title: 6(b)
text: 'b) Rotas de uso dos veículos do SESCINC desimpedidas e livres de contaminantes

  (água ou outras substâncias que reduzam o coeficiente de atrito).

  6.3.3. [Recomendação] - Para que o objetivo operacional de dois minutos seja factível em

  aeródromos em que haja recorrência de condições degradadas de visibilidade e de

  superfície de pista, recomenda-se que o operador de aeródromo considere a utilização de

  equipamentos ou procedimentos mitigadores.

  6.4. Aferição do Tempo-resposta

  6.4.1. O parágrafo 153.409(c) requer que o operador do aeródromo realize aferições de tempo-

  resposta, no mínimo, trimestralmente.

  6.4.2. [Recomendação] - Os testes de tempo-resposta envolvem o deslocamento de veículos

  em alta velocidade pela área de movimento de aeronaves. Recomenda-se a realização de

  reuniões iniciais com as equipagens dos veículos envolvidos antes de cada exercício,

  enfatizando os riscos e discutindo medidas de segurança.

  6.4.3. Não é recomendada a realização de exercícios de tempo-resposta sem aviso prévio aos

  profissionais do SESCINC envolvidos.

  6.4.4. [FC 153.409(c)] - O tempo de chegada de cada CCI deve ser contado a partir do

  acionamento inicial do SESCINC até a estabilização jato de água do canhão monitor do

  veículo, na cabeceira mais distante ou qualquer outro local das pistas de pouso e

  decolagem que apresente maior dificuldade de acesso.

  6.4.5. Para a realização dos testes referidos em 6.4.1, não é necessária a utilização de
  LGE ou a

  descarga de todo o tanque de água.

  6.4.6. [Recomendação] - Durante a realização dos testes de tempo-resposta, recomenda-se
  a

  utilização de sinais luminosos (giroflex) e sonoros (sirene) dos veículos de emergência.

  6.4.7. [FC 153.409(c)] - O registro do tempo-resposta deve conter, no mínimo:'
