title: TEMPO-RESPOSTA
text: '6. TEMPO-RESPOSTA

  6.1. Generalidades

  A seção 153.409 do RBAC nº 153 dispõe sobre o tempo-resposta. Nesta IS estão contidas

  recomendações e especificações adicionais sobre o tempo-reposta e o tempo de chegada

  dos CCI mencionados no parágrafo 153.409(b).

  6.2. Objetivo operacional

  6.2.1. [Recomendação] - Recomenda-se que o SESCINC estabeleça, como objetivo

  operacional, a execução de um exercício tempo-resposta de 2 (dois) minutos para

  qualquer ponto de cada pista de pouso e decolagem operacional do aeródromo.

  6.2.2. [Recomendação] - Recomenda-se que qualquer outro CCI, que não o(s) responsável(is)

  por cumprir o disposto no parágrafo 153.409(a), necessário à aplicação dos agentes

  extintores na quantidade mínima especificada na Tabela 153.403-1 para a categoria do

  aeródromo, chegue a qualquer ponto de cada pista de pouso e decolagem operacional do

  aeródromo em até 3 (três) minutos.

  6.2.3. [Recomendação] - Recomenda-se que o SESCINC estabeleça, como objetivo

  operacional, a execução de um exercício tempo-resposta de três minutos para qualquer

  ponto da área de movimento de aeronaves.

  6.3. Condições de visibilidade e de superfície de pista

  6.3.1. O RBAC 153.409(a) dispõe que o tempo-resposta em condições ótimas de visibilidade
  e

  de superfície de pista não deve exceder 3 (três) minutos.Data de emissão: 15 de maio de
  2019 IS nº 153.409-001

  Revisão A

