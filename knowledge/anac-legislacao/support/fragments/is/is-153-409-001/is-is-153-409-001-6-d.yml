section_title: TEMPO-RESPOSTA
subsection_id: d
cite: 6(d)
title: 6(d)
text: 'd) Tempo de chegada de cada veículo, em minutos e segundos, conforme critérios

  estabelecidos em 6.4.4.

  6.4.8. [Recomendação] - Recomenda-se que seja registrado o tempo entre o acionamento do

  SESCINC e o início da movimentação de cada veículo.

  6.4.9. [Recomendação] - Recomenda-se a realização de exercícios específicos para redução

  do tempo decorrido desde o acionamento do alarme até o início da movimentação dos

  veículos. Tais exercícios podem ser realizados desvinculados do tempo-resposta

  completo, não gerando necessidade de entrar nas pistas de pouso e decolagem ou de táxi.

  6.4.10. [Recomendação] - Recomenda-se o estabelecimento de procedimentos para controle do

  desempenho dos testes de tempo-resposta.'
