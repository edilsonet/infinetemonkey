title: OPERAÇÕES COMPATÍVEIS COM A CAT
text: '6. OPERAÇÕES COMPATÍVEIS COM A CAT

  6.1. Generalidades

  6.1.1. A seção 153.413 do RBAC nº 153 descreve quais operações do transporte aéreo público

  de passageiros ou carga podem ser autorizadas pelo operador em relação à Categoria

  Contraincêndio do Aeródromo - CAT.

  6.1.2. Operações que não se enquadrem no transporte aéreo público de passageiros e/ou carga

  não requerem avaliação do operador do aeródromo quanto à CAT ou disponibilização do

  SESCINC.

  6.1.3. Considerando o descrito no parágrafo 153.413(c)(3), a obrigatoriedade de cancelamento

  de autorizações descrita no parágrafo 153.413(d) não tem impacto em aeródromos Classe

  I.

  6.2. Avaliação da compatibilidade da operação

  6.2.1. Ao avaliar a compatibilidade de uma operação solicitada, para fins da Subparte G
  do

  RBAC 153, é necessário que o operador verifique a CAT-AV da aeronave e a

  movimentação do aeródromo em cada período de três meses, além da Classe do

  aeródromo.

  6.2.2. Cada pouso ou decolagem é considerado um movimento. Assim, cada frequência (pouso

  mais decolagem) é composta por dois movimentos.

  6.2.3. A avaliação da movimentação será realizada considerando qualquer período de três

  meses consecutivos. Em nenhum conjunto de três meses, a movimentação de aeronaves

  pode ultrapassar o definido nos critérios de compatibilidade do RBAC 153.Data de emissão:
  15 de maio de 2019. IS nº 153.413-001

  Revisão A

  6.2.4. A seguir são apresentados alguns exemplos para auxiliar operadores de aeródromo na

  avaliação da compatibilidade.

  6.2.5. [Exemplo 1] - Aeródromo Classe II (ou Classe III), com CAT 5 (cinco).

  Operação pretendida no mês atual:

  Aeronave Comprimento

  total (m)

  Largura da

  fuselagem'
