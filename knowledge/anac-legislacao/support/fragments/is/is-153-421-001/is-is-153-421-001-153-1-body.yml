title: 'do RBAC nº 153, os seguintes:'
text: '153.1 do RBAC nº 153, os seguintes:

  4.1.1. Certificado de Aprovação (CA) significa o certificado emitido pelo Ministério do

  Trabalho e Emprego que garante a qualidade, a funcionalidade e a segurança dos

  equipamentos de proteção individual.

  4.1.2. Cilindro de Ar Respirável significa reservatório utilizado para armazenar ar respirável

  sob alta pressão.

  4.1.3. Pressão Positiva significa o equipamento em que a pressão dentro da peça facial do
  EPR,

  durante a inalação, é maior do que a pressão atmosférica.

  INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 153.421-001

  Revisão A

  Aprovação: Portaria nº 1.409/SIA, de 9 de maio de 2019.

  Assunto: Equipamentos de Proteção Origem: SIAData de emissão: 15 de maio de 2019. IS nº
  153.421-001

  Revisão A'
