title: EQUIPAMENTOS DE PROTEÇÃO
text: '6. EQUIPAMENTOS DE PROTEÇÃO

  6.1. Generalidades

  6.1.1. [Recomendação] - Recomenda-se a disponibilização de protetor auricular aos

  profissionais do SESCINC para utilização durante o serviço.

  6.1.2. [Recomendação] - Recomenda-se sejam estabelecidos procedimentos para higienização

  e verificação do estado de conservação tanto do Traje de Proteção (TP) quanto do

  Equipamento de Proteção Respiratória (EPR).

  6.2. Traje de Proteção

  6.2.1. [FC 153.421(a)] - Todos os equipamentos que compõem o TP devem possuir CA

  específico para utilização em operações de combate a incêndio.

  6.2.2. [Recomendação] - Recomenda-se manter o TP em local de fácil acesso próximo aos

  veículos de combate a incêndio.

  6.2.3. [Recomendação] - Recomenda-se a utilização de botas feitas de material leve, flexível

  e que permitam a mobilidade adequada do bombeiro.

  6.2.4. [Recomendação] - Recomenda-se a utilização de luvas que permitam o manuseio com

  precisão, segurança e flexibilidade das ferramentas de trabalho e sistemas do CCI.

  6.3. Equipamento de Proteção RespiratóriaData de emissão: 15 de maio de 2019. IS nº 153.421-001

  Revisão A

  6.3.1. [Recomendação] - Recomenda-se seguir a norma ABNT NBR 13716 para os

  equipamentos que irão fazer parte do EPR.

  6.3.2. A forma correta de utilização do capuz do tipo “balaclava”, componente do TP, é a

  colocação por cima da peça facial do EPR. Isso permite a vedação necessária para o

  correto funcionamento da máscara autônoma.

  6.3.3. [Recomendação] - Para facilitar a movimentação do BA enquanto estiver utilizando
  o

  EPR, recomenda-se que o cilindro de ar respirável seja feito de material leve.

  6.3.4. [Recomendação] - Recomenda-se a utilização de sensor de movimento acionado pela

  inércia (sensor “homem-morto”), cujo objetivo é indicar por meio de alarme sonoro que

  um membro da equipe parou de movimentar-se durante uma operação de resgate e

  combate a incêndio.

  6.3.5. Considerando a necessidade de manter os EPR abastecidos conforme parágrafo

  153.421(b)(1), deve ser estabelecido procedimento para reabastecimento.

  6.3.6. [Recomendação] - Para manutenção da continuidade da operacionalidade do SESCINC,

  recomenda-se que sejam disponibilizados cilindros reservas para serem utilizados

  enquanto os outros estiverem sendo reabastecidos.

  6.3.7. [Recomendação] - Para permitir treinamentos com menor impacto, recomenda-se que

  seja disponibilizado um cilindro em estoque para cada componente das equipagens de

  um turno.

  6.3.8. [Recomendação] - Recomenda-se que haja sistema de reabastecimento de ar respirável

  no aeródromo, em especial para aqueles que requerem maior quantidade de EPR para o

  SESCINC.'
