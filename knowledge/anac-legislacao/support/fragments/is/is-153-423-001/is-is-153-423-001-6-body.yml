text: '6. EQUIPAMENTOS DE APOIO ÀS OPERAÇÕES DE RESGATE

  6.1. Generalidades

  6.1.1. A seção 153.423 do RBAC nº 153 dispõe que, no mínimo, os equipamentos de apoio às

  operações de resgate descritos na Tabela 153.423-1 devem estar disponíveis à equipagem

  que está atendendo à ocorrência.

  6.1.2. Os tipos e quantidades de equipamentos de apoio às operações de resgate indicados
  na

  Tabela 153.423-1 foram estabelecidos tendo como parâmetro a Categoria Contraincêndio

  - CAT do aeródromo.

  6.1.3. [Recomendação] - Considerando a necessidade de que os equipamentos de apoio

  estejam em condições para uso, recomenda-se o estabelecimento de procedimentos de

  testes e manutenção.

  6.1.4. A torre de iluminação, equipamento autônomo transportável destinado a fornecer

  iluminação em locais de atendimento de ocorrências, é de disponibilização obrigatória

  para aeródromos Classes III e IV com CAT 6 ou superior.

  6.1.5. [Recomendação] - Devido à importância de prover iluminação durante o atendimento
  a

  emergências, recomenda-se a disponibilização de torre de iluminação em todos os

  aeródromos com SESCINC, em especial nos locais onde ocorram operações noturnas.

  6.1.6. Para permitir o cumprimento do requisito de disponibilização das linhas de mangueira,

  descritas na Tabela 153.407-1, podem ser necessários equipamentos para montagem, tais

  como:'
