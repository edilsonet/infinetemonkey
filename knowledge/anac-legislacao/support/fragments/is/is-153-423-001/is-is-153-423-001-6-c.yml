text: 'c) Derivantes.

  6.1.7. [Recomendação] - Recomenda-se a disponibilização de linhas de mangueira

  sobressalentes para permitir rápida substituição no caso de dano.

  6.1.8. [Recomendação] - Recomenda-se que o “gancho ou garra para salvamento”

  disponibilizado para o SESCINC, descrito na Tabela 153.423-1, seja do tipo “gancho

  croque”, utilizado por equipes de bombeiros.

  6.2. Outros equipamentos recomendados

  6.2.1. [Recomendação] - Além dos equipamentos mínimos obrigatórios, descritos na Tabela

  153.423-1, recomenda-se que sejam disponibilizados ainda:'
