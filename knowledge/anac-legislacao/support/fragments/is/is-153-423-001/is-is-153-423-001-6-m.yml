text: 'm) Extintores portáteis de Pó Químico e CO2.

  6.2.2. [Recomendação] - Caso seja disponibilizado desfibrilador portátil, recomenda-se que
  os

  bombeiros de aeródromo sejam treinados para utilização do equipamento.

  6.2.3. [Recomendação] - Em conjunto com a equipe do SESCINC, recomenda-se que o

  operador de aeródromo verifique outros equipamentos de apoio a serem disponibilizados,

  de acordo com suas necessidades operacionais.Data de emissão: 15 de maio de 2019 IS nº 153.423-001

  Revisão A'
