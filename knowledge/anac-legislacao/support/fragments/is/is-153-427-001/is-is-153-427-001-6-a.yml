title: 6(a)
text: 'a) Estações Fixas - São aquelas instaladas nas dependências dos prédios, com o uso

  de antenas externas apropriadas. São utilizadas como a estação base de um sistema

  de comunicação por possuírem maior potência e cobrirem uma área maior do que

  as estações portáteis.'
