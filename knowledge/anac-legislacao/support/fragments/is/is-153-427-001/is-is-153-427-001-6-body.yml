title: SISTEMAS DE COMUNICAÇÃO E ALARME
text: '6. SISTEMAS DE COMUNICAÇÃO E ALARME

  6.1. Generalidades

  6.1.1. A seção 153.427 do RBAC nº 153 dispõe que operador do aeródromo deve disponibilizar

  sistema de comunicação que permita o fluxo contínuo de informações entre os

  envolvidos no atendimento às emergências e sistema de alarme que permita o

  acionamento imediato do SESCINC.

  6.2. Sistema de Comunicação

  O sistema de comunicação por estações rádio se constitui, normalmente, no meio que

  permite maior flexibilidade e rapidez de comunicação em situações de emergência. Isso

  se deve ao fato de que o equipamento rádio permite comunicação instantânea com todos

  os envolvidos na ocorrência, além de ser o principal meio de comunicação utilizado em

  operações e situações onde o deslocamento e a movimentação ágil se fazem necessários.

  6.2.1. As estações rádio apresentam-se em 3 (três) tipos:'
