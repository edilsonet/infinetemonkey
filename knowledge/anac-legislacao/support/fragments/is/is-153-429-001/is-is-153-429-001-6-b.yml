section_title: VIAS DE ACESSO DE EMERGÊNCIA
subsection_id: b
cite: 6(b)
title: 6(b)
text: 'b) Curvas com raios projetados de forma a permitir rápido e seguro deslocamento do(s)

  CCI pelas mesmas.

  6.2.2. [Recomendação] - Caso sejam estabelecidas vias de acesso de emergência às áreas

  externas ao sítio aeroportuário, recomenda-se que cópias das chaves dos portões estejam

  em posse dos profissionais em exercício das funções de Bombeiro de Aeródromo Gerente

  da SCI e do Bombeiro de Aeródromo Chefe de Equipe de Serviço. Além disto,

  recomenda-se que esses portões sejam construídos de forma que possam ser rompidos

  pelo(s) CCI em atendimento a emergência.

  6.2.3. [Recomendação] - Recomenda-se que o operador de aeródromo realize gestões junto à

  autoridade de trânsito local para que as vias de acesso de emergência, em seus trechos

  situados fora da área patrimonial do aeródromo, recebam sinalização especial indicando

  sua função e a proibição do estacionamento de veículos em sua proximidade.'
