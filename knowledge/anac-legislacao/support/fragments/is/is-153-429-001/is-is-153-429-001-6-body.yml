title: VIAS DE ACESSO DE EMERGÊNCIA
text: '6. VIAS DE ACESSO DE EMERGÊNCIA

  6.1. Generalidades

  6.1.1. A seção 153.429 do RBAC nº 153 dispõe que o operador do aeródromo deve estabelecer

  e delimitar vias de acesso de emergência da SCI às pistas de pouso e decolagem. O

  objetivo dessa delimitação é promover o acesso seguro, rápido e sem obstáculos dos

  veículos de emergência do SESCINC, bem como para o atendimento ao tempo-resposta.

  6.1.2. [FC 153.429(a)] - Quando a superfície da via de acesso de emergência estiver

  indistinguível das áreas adjacentes, deve ser delimitada por sinalizadores laterais em

  intervalos de no máximo 15 (quinze) metros.

  6.1.3. Conforme estabelecido no parágrafo 153.429(b), as vias de acesso de emergência devem

  ter largura e capacidade de suporte de carga suficiente para o trânsito dos veículos do

  SESCINC, com o objetivo de conferir maior segurança do trânsito dos veículos, bem

  como para evitar que a degradação do pavimento se constitua em obstáculo à rapidez no

  atendimento.

  6.1.4. Para permitir o trânsito dos veículos, é necessário ainda que a via possua desobstrução

  vertical e horizontal suficiente para passagem do maior veículo de emergência.

  6.1.5. [Recomendação] - Desde que viáveis, do ponto de vista da resistência e acessibilidade

  do terreno adjacente às cabeceiras, recomenda-se que as vias de acesso de emergência

  sejam implantadas, a partir de cada cabeceira, até uma distância de 1000 (mil) metros.

  6.2. Características Desejáveis para Vias de Acesso de Emergência

