title: SERVIÇO ESPECIALIZADO DE SALVAMENTO AQUÁTICO
text: '6. SERVIÇO ESPECIALIZADO DE SALVAMENTO AQUÁTICO

  6.1. Generalidades

  6.1.1. Conforme consta nos parágrafos 153.301(d)(2), 153.325(a)(1) e 153.325(a)(4) do RBAC

  nº 153, os operadores de aeródromos em que existam superfícies aquáticas ou terrenos de

  difícil acesso a até 1000 (mil) metros de qualquer cabeceira da(s) pista(s) de pouso e

  decolagem, devem considerar no seu PLEM, os elementos, suas responsabilidades e ações

  voltadas ao atendimento a emergências aeronáuticas nessas áreas.

  6.1.2. Tais serviços visam o pronto atendimento a emergências aeronáuticas nas vizinhanças
  do

  aeródromo e não devem ser confundidos com o Serviço de Busca e Salvamento (SAR)

  descrito no Anexo 12 à Convenção Internacional de Aviação Civil.

  6.1.3. Especificamente para atendimento a emergências aeronáuticas em superfícies aquáticas,

  a Seção 153.433 define o Serviço Especializado de Salvamento Aquático (SESAQ).

  6.1.4. O SESAQ tem como objetivo criar condições que possibilitem a sobrevivência dos

  passageiros e tripulantes vítimas do acidente aeronáutico, até que uma maior força de

  resgate chegue ao local.

  6.1.5. [Recomendação] - É desejável que o primeiro estágio do atendimento tenha como

  objetivo a remoção de perigos imediatos às vítimas, sua proteção e a identificação exata

  do local da ocorrência para permitir o deslocamento das forças de resgate.

  6.1.6. [Recomendação] - A despeito de não serem estabelecidas obrigatoriedades específicas

  para o serviço, recomenda-se aos operadores de aeródromo realizar uma avaliação deData:
  15 de maio de 2019 IS nº 153.433-001

  Revisão A

  risco para verificação da necessidade de disponibilização de equipamentos específicos

  para atendimento a emergências aeronáuticas na água.

  6.1.7. [Recomendação] - É desejável a realização de exercícios simulados, práticos e teóricos

  (“table-top”), de atendimento de emergências aeronáuticas na água para o SESAQ, em

  especial quando o serviço envolver órgãos externos ao aeródromo.

  6.2. Considerações sobre o atendimento

  6.2.1. A rápida resposta de uma equipe de resgate capacitada e a disponibilidade de

  equipamentos de resgate em número suficiente são fatores que tem impacto direto na

  probabilidade de sobrevivência de vítimas de acidentes em superfícies aquáticas.

  6.2.2. Vítimas de acidentes aeronáuticos em água podem estar sujeitas a reduções na

  temperatura corporal devido à evaporação de combustível que tenha vazado da aeronave.

  É prudente que a equipe de resgate considere que todos os sobreviventes apresentem

  quadro de hipotermia até que uma avaliação médica determine o contrário. Dessa forma,

  a rápida retirada dos acidentados da água é uma importante medida para a redução do

  risco de morte por hipotermia.

  6.2.3. [Recomendação] - Outro aspecto a ser considerado é a descontaminação das vítimas.

  Em especial, recomenda-se a definição de procedimentos e equipamentos para remover

  combustível dos olhos dos sobreviventes.

  6.2.4. [Recomendação] - Certos corpos d’água podem apresentar perigos específicos, como
  a

  presença de animais, rápidas variações de maré ou a existência de correnteza, que

  aumentam o risco às vítimas e resgatistas e deveriam ser considerados na definição do

  serviço especializado.

  6.2.5. Espera-se que embarcações particulares próximas à cena do acidente tentem participar
  no

  auxílio ao resgate de pessoas. Porém, a falta de treinamento e familiaridade com o

  atendimento a emergências, pode aumentar o risco de outros acidentes durante a

  operação.

  6.2.6. [Recomendação] - Para reduzir o risco de acidentes por participação de pessoas

  inexperientes, recomenda-se a definição de procedimentos para controle de acesso ao

  cenário de emergência e identificação de veículos e pessoas com autorização.

  6.2.7. Em acidentes na água, a probabilidade de incêndio é reduzida devido à supressão de

  fontes de ignição. Porém, considerando a possível existência de combustível, a utilização

  de embarcações com parte do sistema de exaustão do(s) motor(es) na superfície da água

  pode gerar um risco de ignição.

  6.2.8. Quando o fogo estiver presente, poderão existir problemas incomuns para controle
  e

  extinção, a não ser que equipamentos apropriados estejam disponíveis.Data: 15 de maio de
  2019 IS nº 153.433-001

  Revisão A

  6.2.9. Na presença de fogo, a aproximação dos veículos de resgate deve ser realizada após

  avaliação da direção e velocidade do vento, além da possibilidade de existência de

  correnteza no local do acidente.

  6.2.10. [Recomendação] - É desejável o estabelecimento de um posto de comando em margem

  próxima ao cenário do acidente, em posição que facilite a entrada e saída de veículos de

  resgate aquático.

  6.3. Recursos materiais

  6.3.1. [Recomendação] - É desejável que o operador do aeródromo, em conjunto com os outros

  órgãos envolvidos, efetue uma avaliação dos tipos e quantidades de equipamentos

  requeridos para o atendimento a emergências em superfícies aquáticas, de forma a auxiliar

  na efetividade do resgate.

  6.3.2. [Recomendação] - É desejável a disponibilização de equipamentos salva-vidas

  flutuantes em quantidade suficiente, considerando a capacidade da maior aeronave em

  utilização no aeródromo.

  6.3.3. [Recomendação] - É desejável que os veículos disponibilizados tenham capacidade de

  acomodar, fora da água, as vítimas do acidente aeronáutico.

  6.3.4. A utilização de botes ou plataformas de resgate infláveis rebocáveis, para a remoção
  de

  vítimas da água, pode ser uma forma de redução do custo de implantação e manutenção

  do SESAQ, diminuindo ou eliminando a necessidade de embarcações com maior

  capacidade de acomodação de sobreviventes.

  6.3.5. Em geral, a primeira resposta para o atendimento a emergências na água é dada por

  embarcações, porém outros veículos, como helicópteros, podem ser utilizados.

  6.3.6. [Recomendação] - Considerando a possibilidade de hipotermia, recomenda-se a

  disponibilização de cobertores para as vítimas.

  6.3.7. [Recomendação] - É desejável disponibilizar ao SESAQ, equipamentos de resgate,

  como ganchos e cordas, para auxiliar na retirada das pessoas da água.

  6.3.8. [Recomendação] - Em aeródromos com operação noturna, é desejável a disponibilização

  de equipamentos de iluminação, tanto nos veículos designados para o resgate, quanto nos

  locais de coordenação e triagem de vítimas.

  6.4. Recursos humanosData: 15 de maio de 2019 IS nº 153.433-001

  Revisão A

  6.4.1. [Recomendação] - É desejável que o número de profissionais designados ao atendimento

  a emergências seja estabelecido com base nos equipamentos disponíveis ao SESAQ e na

  capacidade das aeronaves que operam no aeródromo.

  6.4.2. [Recomendação] - Quando possível, é desejável considerar a participação de equipes
  de

  mergulhadores nas operações de resgate na água.

  6.4.3. O atendimento adequado a emergências aeronáuticas depende da disponibilização de

  pessoal com capacidade física e treinamentos específicos.

  6.4.4. [Recomendação] - É desejável o estabelecimento, pelo operador de aeródromo, de

  programas de treinamento inicial e recorrente específicos para os profissionais do

  SESAQ.

