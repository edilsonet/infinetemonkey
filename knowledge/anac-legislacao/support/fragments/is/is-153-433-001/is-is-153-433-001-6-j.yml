text: 'j) Técnicas de resgate a nado e mergulho, para profissionais com essas atribuições.

  6.5. Comunicação

  6.5.1. Considerando a possibilidade de envolvimento de diversos órgãos e pessoas, a

  disponibilização de sistemas de comunicação adequados é importante para garantir um

  atendimento adequado a emergências em superfícies aquáticas.

  6.5.2. [Recomendação] - A utilização de equipamentos de rádio é recomendada por permitir

  comunicação instantânea com os envolvidos na ocorrência, além de ser o principal meio

  de comunicação utilizado em operações e situações onde o deslocamento e a

  movimentação ágil se fazem necessários.Data: 15 de maio de 2019 IS nº 153.433-001

  Revisão A

  6.5.3. [Recomendação] - Quando for utilizada a comunicação por rádio, é desejável que as

  frequências estejam definidas no PLEM e sejam de conhecimento de todos os envolvidos.

  6.6. Coordenação com órgãos externos

  6.6.1. O SESAQ pode ser prestado pelo operador do aeródromo, por órgãos externos ou ambos,

  em coordenação.

  6.6.2. [Recomendação] - Quando estiverem previstas ações no âmbito do SESAQ a serem

  realizadas por órgãos externos não administrados pelo operador do aeródromo,

  recomenda-se o estabelecimento de instrumentos formais de coordenação entre as partes.

  6.6.3. [Recomendação] - Quando forem estabelecidos instrumentos formais, recomenda-se

  que os documentos incluam a definição:'
