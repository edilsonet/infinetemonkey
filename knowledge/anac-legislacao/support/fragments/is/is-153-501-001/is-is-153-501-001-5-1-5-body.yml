text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS.

  MEDIDAS A SEREM CONTEMPLADAS NOS PROCEDIMENTOS BÁSICOS DE GERENCIAMENTO DO RISCO DA FAUNA
  NO SÍTIO AEROPORTUÁRIO

  6.1 Generalidades

  6.1.1 O parágrafo 153.501(b) do RBAC nº 153 dispõe sobre as medidas a serem contempladas
  nos procedimentos básicos de gerenciamento de risco da fauna no sítio aeroportuário.

  6.1.2 Os parágrafos 153.501(b)(1) a 153.501(b)(8) do RBAC nº 153 determinam quais as medidas
  devem ser contempladas nos procedimentos básicos de gerenciamento de risco da fauna no sítio
  aeroportuário.'
