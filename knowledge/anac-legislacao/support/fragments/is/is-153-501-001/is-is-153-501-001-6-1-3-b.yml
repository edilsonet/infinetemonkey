  6.1.4 O parágrafo 153.501(d) do RBAC nº 153 determina que o operador de aeródromo estabeleça
  e implemente procedimentos de gerenciamento do risco da fauna associados ao Gerenciamento
  de Segurança Operacional do aeródromo, que abordem as seguintes medidas:'
