document: is-153-501-001
family: '153'
section_id: 6.1.3
section_title: 'O parágrafo 153.501(c) do RBAC nº 153 estabelece que estes procedimentos devem
  ser capazes de:'
subsection_id: c
cite: 6.1.3(c)
title: 6.1.3(c)
text: 'c) avaliação do perigo da fauna, com especial análise sobre as colisões entre aeronaves
  e a fauna.

  6.1.5 [FC 153.501(d)(1)] A investigação dos focos de atração de fauna no sítio aeroportuário
  e na ASA consistirá na realização de vistorias periódicas e, no caso da ASA, também motivadas
  por relatos e denúncias.

  6.1.6 [FC 153.501(d)(2)] A identificação de vulnerabilidade em relação a acesso de fauna
  terrestre ao aeródromo deve ser feita por ocasião das inspeções periódicas no sítio aeroportuário.

  6.1.7 [FC 153.501(d)(3)] A avaliação do perigo da fauna será feita com base no resultado
  dos registros das inspeções, bem como com base nos registros de eventos de segurança operacional
  envolvendo fauna.

  6.1.8 [FC 153.501(b)(1) e 153.501(b)(7)] O operador de aeródromo deve atuar criando medidas
  mitigadoras para controlar os focos localizados no sítio aeroportuário e mediante a gestão
  junto aos órgãos externos para a mitigação do risco provocado pela presença de focos atrativos
  de fauna e com potencial atrativo de fauna em área externa ao sítio aeroportuário.

  6.2 [FC 153.501(b)] Procedimentos básicos de gerenciamento do risco da fauna

  6.2

  6.2.1 O operador de aeródromo deve elaborar um mapeamento do sítio aeroportuário e da ASA,
  para servir de base para a localização dos focos de atração ou com potencial atrativo de
  fauna, dispostos em quadrículas ou grade.'
