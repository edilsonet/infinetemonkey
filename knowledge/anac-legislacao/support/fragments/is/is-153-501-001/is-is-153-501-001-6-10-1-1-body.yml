text: '6.10.1.1 O operador de aeródromo deve dificultar o acesso em galerias de águas pluviais
  para fauna que gera risco às operações aéreas.

  6.10.1.1.1 [Recomendação] Podem ser empregadas tiras plásticas, correntes ou grades de proteção,
  contanto que o emprego de tais dispositivos não altere a vazão prevista para o sistema de
  drenagem.'
