text: '6.10.1.2 Mensalmente e sempre após período chuvoso, o operador de aeródromo deve realizar
  inspeções nos sistemas de drenagem e galerias de águas pluviais.

  6.10.1.2.1 Uma vez identificado acúmulo de água e/ou matéria orgânica que influam direta
  ou indiretamente na atração de fauna, o operador de aeródromo deve tomar ações específicas
  para que a água seja drenada e/ou matéria orgânica seja eliminada.

  6.10.1.2.2 A frequência da inspeção deverá ser maior, caso as condições climáticas e ambientais
  do sítio intensifiquem o acúmulo de água, vegetação, matéria orgânica e sedimentos nesses
  dispositivos.'
