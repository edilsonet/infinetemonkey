title: Dispositivos de esgotamento sanitário
text: '6.10.2 Dispositivos de esgotamento sanitário

  6.10.2.1 O operador de aeródromo deve tomar medidas para que estruturas de esgotamento sanitário
  não exerçam atração de animais que possam provocar risco às operações aéreas, evitando a
  existência de estruturas que depositem e transportem o esgoto a céu aberto, como valões,
  fazendo uso de encanamentos e outras estruturas de forma que fiquem fechadas, sempre que
  possível.'
