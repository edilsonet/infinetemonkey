title: 6.10.3(b)
text: b) [Recomendação] No caso de existência de lagoa, que se encontre na sua totalidade
  inserida na área patrimonial do aeródromo, caso seja possível ou viável, a mesma deve ser
  drenada ou, alternativamente, recoberta com fios/redes para evitar a atratividade de fauna
  com angulação de bordas superior a 60º;
