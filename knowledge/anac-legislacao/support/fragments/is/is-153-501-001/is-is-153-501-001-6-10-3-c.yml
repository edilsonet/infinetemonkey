cite: 6.10.3(c)
title: 6.10.3(c)
text: c) [Recomendação] Canais de drenagem com fluxo perene de água devem ter suas margens
  anguladas, preferencialmente com inclinação superior a 60º. Quando não for possível manter
  as margens anguladas, devem ser empregadas redes ou fios para evitar o acesso da fauna à
  água. Caso sejam empregados fios, será considerado o adequado espaçamento entre fios, a
  fim de inibir o acesso de fauna que possa vir a gerar riscos às operações aéreas, em função
  da envergadura da espécie considerada, assim como bandeiras de 10x6 cm² para demarcar a
  localização dos fios.
