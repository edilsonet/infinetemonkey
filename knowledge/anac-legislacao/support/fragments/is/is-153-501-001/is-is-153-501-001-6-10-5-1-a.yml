section_id: 6.10.5.1
section_title: 'As medidas mitigadoras empregadas no aeródromo para evitar a presença ou atração
  de fauna nas edificações e equipamentos presentes no sítio são:'
subsection_id: a
cite: 6.10.5.1(a)
title: 6.10.5.1(a)
text: a) [Recomendação] o emprego de grades ou telas de proteção, para que a fauna que possa
  vir a gerar risco às operações aéreas não tenha acesso aos espaços entre lajes e telhados
  existentes nas edificações e demais construções presentes na área patrimonial do aeródromo;
