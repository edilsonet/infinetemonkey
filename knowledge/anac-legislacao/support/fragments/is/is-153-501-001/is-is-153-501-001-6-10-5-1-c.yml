section_id: 6.10.5.1
section_title: 'As medidas mitigadoras empregadas no aeródromo para evitar a presença ou atração
  de fauna nas edificações e equipamentos presentes no sítio são:'
subsection_id: c
cite: 6.10.5.1(c)
title: 6.10.5.1(c)
text: 'c) a eliminação, caso seja possível ou viável, de estruturas de alvenaria, edificações,
  equipamentos e demais implantações verticalizadas que não possuam funcionalidade no lado
  ar do aeródromo.

  6.10.5.2 [Recomendação] O operador de aeródromo deve realizar inspeções mensais nas edificações
  existentes na área patrimonial do aeródromo (hangares, terminal de passageiro, torre de
  controle, etc.), com vistas a verificar nidificação e/ou abrigo de fauna que possa gerar
  risco às operações aéreas.

  6.10.5.3 Nas áreas ou locais de difícil acesso das edificações e demais estruturas (telhados,
  etc.), o operador de aeródromo deve realizar inspeções bimestrais, a fim de detectar abrigos
  de fauna que cause riscos às operações aéreas.

  6.10.5.4 [Recomendação] No caso de estruturas, as antenas devem receber cortinas, com vista
  a inibir presença da fauna. Semestralmente, devem ser realizadas vistorias, com vista a
  avaliar a integridade física das cortinas.

  6.11 [FC 153.501(b)(8)] Informações a respeito de técnicas de manejo permitidas

  6.11.1 O afugentamento de aves deve ser realizado de modo a promover o voo das aves para
  áreas de menor prioridade de dispersão (além da área de manobra do aeródromo), evitando
  cruzamentos de pistas.'
