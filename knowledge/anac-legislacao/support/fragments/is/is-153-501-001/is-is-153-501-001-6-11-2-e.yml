  6.12 [FC 153.501(d)(1)] Gestões junto aos órgãos externos para eliminação de focos atrativos
  de fauna na ASA

  6.12.1 Assim que tomar conhecimento da existência de foco atrativo ou com potencial atrativo
  de fauna na ASA, o operador de aeródromo deve tomar as providências para informar à administração
  municipal responsável, além dos demais órgãos considerados pertinentes pela legislação em
  vigor, para a mitigação do risco da fauna.

  6.12.2 [Recomendação] O operador do aeródromo poderá instituir uma Comissão de Gerenciamento
  do Risco da Fauna (CGRF) nos moldes da Seção 153.507 do RBAC nº 153.

  6.12.3 Para fins de registro, uma cópia da comunicação aos órgãos competentes deve ser disponibilizada
  nos arquivos do aeródromo (cópia de ofício, ata de reunião, mensagem de correio eletrônico,
  etc.).'
