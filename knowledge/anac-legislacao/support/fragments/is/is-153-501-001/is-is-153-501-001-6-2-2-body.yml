text: '6.2.2 Por meio de inspeções periódicas, o operador de aeródromo deve obter dados a
  respeito dos focos e localizá-los no mapa de grade.

  6.2.3 A partir da identificação destes focos, o operador de aeródromo deve proceder a análise
  da criticidade destes, analisando fatores como o tipo da espécie atraída, sua massa corporal
  e quantidade, comportamento de voo, proximidade da área operacional e variação da atratividade
  ao longo do dia, por exemplo.

  6.2.4 A partir desta análise de criticidade, o operador de aeródromo deve instituir procedimentos
  específicos e/ou rotineiros para mitigar o risco causado pelo foco atrativo ou com potencial
  de atração.

  6.2.4.1 Entre os procedimentos rotineiros a serem adotados pelos operadores de aeródromos
  indiscriminadamente temos: a manutenção das áreas verdes, do sistema de drenagem e do sistema
  de proteção.

  6.2.5 A partir da instituição destes procedimentos, o operador de aeródromo deve monitorar
  as condições de risco mediante inspeções rotineiras, que irão determinar a possibilidade
  de instituição de novos procedimentos ou a manutenção daqueles inicialmente previstos.

  6.2.6 Além das inspeções rotineiras, o operador de aeródromo deve instituir uma rotina de
  armazenamento e análise de dados relacionados aos eventos Eventos de Segurança Operacional
  (ESO) envolvendo fauna (colisões, quase colisões e avistamentos), objeto de notificação
  ao Centro de Investigação e Prevenção de Acidentes Aeronáuticos (CENIPA), que passarão a
  integrar o Sistema de Gerenciamento de Risco Aviário (SIGRA). A análise da evolução e da
  severidade destes eventos de segurança operacional (ESO) deve fornecer subsídios para que
  o operador do aeródromo estabeleça a implementação de procedimentos adicionais ou recomende
  a necessidade de realização de uma Identificação do Perigo da Fauna (IPF) e de um Programa
  de Gerenciamento do Risco da Fauna (PGRF), por profissional habilitado, conforme parágrafo
  153.35(d) do RBAC nº 153.

  6.3 [FC 153.501(b)(1)] Controle de focos de atração de fauna no sítio aeroportuário

  6.3.1 O operador de aeródromo deve providenciar medidas a serem contempladas nos procedimentos
  básicos de gerenciamento de risco da fauna no sítio aeroportuário com respeito ao controle
  de focos de atração de fauna, de forma a eliminar os focos atrativos ou mitigar seu efeito
  na segurança operacional do aeródromo, por meio da utilização de técnicas de operação e
  manejo, que podem incluir, mas não se limitam a: manutenção de rotina, inspeções, catalogação
  de espécies, observação e registro de dados relativos a presença de fauna no sítio aeroportuário,
  em especial na proximidade da área operacional e também na ASA, registro e análise de dados
  sobre eventos de segurança operacional envolvendo fauna, entre outras.

  6.3.2 O operador de aeródromo deve implementar procedimentos de controle de focos direcionando
  especial atenção nos seguintes focos potencialmente atrativos de fauna: vegetação, focos
  secundários (colmeias, cupinzeiros, formigueiros e demais insetos, répteis, anfíbios e pequenos
  mamíferos que provoquem atração de fauna), valas de drenagem e galerias de água pluvial,
  dispositivos de esgotamento sanitário, lagos, áreas alagadiças e demais áreas de acúmulo
  de água, coleta de resíduos sólidos, edificações, equipamentos e demais implantações que
  possam servir de abrigo e poleiro e sistemas de proteção.

  6.3.3 Caso o diagnóstico do controle da fauna identifique, por meio do gerenciamento da
  segurança operacional do aeródromo ou de equipe especializada em gerenciamento do risco
  da fauna, situação de risco à segurança das operações, o operador de aeródromo deve providenciar
  a implementação de um procedimento adicional para mitigação do risco e/ou a realização de
  uma IPF e um PGRF, conforme o parágrafo 153.501(c) do RBAC nº 153, sendo recomendado a contratação
  de profissional habilitado conforme o parágrafo 153.35(d) do RBAC nº 153.

  6.3.4 Como parte inserida nas ações de controle de focos de atração de fauna e da situação
  de risco no aeródromo, o operador de aeródromo deve realizar a coleta de dados a respeito
  de eventos de segurança operacional e reportá-la ao CENIPA, por meio de relatos e denúncias.
  A sistematização destas informações objetiva a criação de indicadores que apontem para a
  evolução do risco e como consequência a elaboração e tomada de medidas efetivas para sua
  mitigação.

  6.3.4.1 Ocorrências referentes à presença de fauna que cause risco às operações aéreas,
  tanto no sítio aeroportuário quanto no seu entorno, e/ou à ocorrência de eventos de segurança
  operacional (ESO) envolvendo fauna e aeronaves devem ser relatadas e registradas.'
