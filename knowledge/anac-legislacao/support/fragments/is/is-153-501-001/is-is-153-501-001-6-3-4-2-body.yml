text: '6.3.4.2 O reporte de eventos com fauna deve ser efetuado por meio de formulário próprio
  disponibilizado pelo CENIPA.

  6.4 [FC 153.501(b)(2)] Manutenção das áreas verdes

  6.4.1 O operador de aeródromo deve providenciar medidas a serem contempladas nos procedimentos
  básicos de gerenciamento de risco da fauna no sítio aeroportuário com respeito a manutenção
  das áreas verdes de forma que estas não se constituam em focos de atração de fauna, mediante
  o oferecimento de condições de abrigo, dessedentação e alimentação de espécies de fauna.

  6.4.2 As medidas referentes a manutenção das áreas verdes no sítio aeroportuário, para fins
  de gerenciamento de risco da fauna, devem contemplar as áreas gramadas, aparas de vegetação
  e controle das demais áreas verdes.'
