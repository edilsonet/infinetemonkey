cite: 6.4.3(c)
title: 6.4.3(c)
text: 'c) Nas áreas gramadas, o operador de aeródromo deve realizar a roçagem nos horários
  em que identifique menor risco de colisão com as espécies-problema identificadas no aeródromo,
  assim como definir a altura da grama, obedecendo aos requisitos definidos na Seção 153.213
  e Subparte H do RBAC nº 153;

  I) Quando não for possível definir altura da grama mais adequada às espécies-problema presentes
  no aeródromo, deve o operador aeroportuário manter a altura da vegetação da faixa de pista
  menor ou igual a 15 cm (quinze centímetros).'
