text: d) [Recomendação] Na existência de áreas alagadiças, onde há difícil acesso dos equipamentos
  de roçagem, o operador de aeródromo deve realizar periodicamente o corte baixo, com altura
  de 10 a 15 cm, sobretudo imediatamente antes das estações chuvosas;
