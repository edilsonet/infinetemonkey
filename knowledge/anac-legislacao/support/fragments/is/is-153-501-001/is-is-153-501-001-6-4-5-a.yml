title: 6.4.5(a)
text: a) O operador de aeródromo deve estabelecer procedimentos permanentes de verificação
  da vegetação em todo o sítio aeroportuário, de modo a verificar e registrar a atração e/ou
  nidificação de espécies de fauna que possam provocar risco às operações aéreas;
