cite: 6.4.5(b)
title: 6.4.5(b)
text: b) Para as árvores frutíferas existentes no aeródromo que atraiam fauna que possam gerar
  risco às operações aéreas, o operador de aeródromo deve realizar aparas e/ou retirada dos
  frutos mensalmente durante o período de frutificação das espécies, buscando minimizar a
  quantidade de frutos disponíveis no sítio aeroportuário, reduzindo assim o potencial atrativo
  de fauna;
