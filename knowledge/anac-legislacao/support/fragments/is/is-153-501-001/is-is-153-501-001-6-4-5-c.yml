section_title: 'Controle das demais áreas verdes:'
subsection_id: c
cite: 6.4.5(c)
title: 6.4.5(c)
text: 'c) Desde que não sejam consideradas como obstáculos às operações aéreas, as demais
  espécies de árvores devem ser monitoradas de modo que não se constituam em focos atrativos
  de fauna (empoleiramento, nidificação e abrigo).

  6.4.6 [Recomendação] Se comprovadamente for verificado que as árvores não atraem direta
  ou indiretamente fauna que cause riscos às operações aéreas, não há a necessidade de realizar
  as aparas e/ou retirada dos frutos das árvores frutíferas.'
