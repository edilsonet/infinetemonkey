title: 6.4.7(a)
text: 'a) Estabelecer procedimentos permanentes de manutenção de valas de drenagem e galerias,
  de modo a evitar o acúmulo de água e/ou matéria orgânica que influam direta ou indiretamente
  na atração e/ou permanência de fauna que possa provocar risco às operações aéreas.

  6.5.3 [Recomendação] O monitoramento do sistema de drenagem deve ser realizado durante as
  vistorias da área de movimento a serem realizadas nos diferentes dispositivos.

  6.6 [FC 153.501(b)(4)] Garantia que o sistema de proteção da área operacional não permita
  a presença de animais na área operacional

  6.6.1 O operador de aeródromo deve providenciar medidas a serem contempladas nos procedimentos
  básicos de gerenciamento de risco da fauna no sítio aeroportuário com respeito a garantia
  de que o sistema de proteção da área operacional não permita a presença de animais na área
  operacional, devendo:'
