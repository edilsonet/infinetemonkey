cite: 6.4.7(b)
title: 6.4.7(b)
text: 'b) Estabelecer rotinas de manutenção corretiva e preventiva no sistema de proteção
  incluindo saídas de drenagem e cercas, que possibilitem a entrada de animais no sítio aeroportuário
  que possam provocar risco às operações aéreas.

  6.6.2 [Recomendação] O monitoramento do sistema de proteção deve ser realizado por intermédio
  de inspeções periódicas diárias com o objetivo de verificar a integridade das instalações.

  6.6.3 O operador de aeródromo deve realizar inspeções especiais em caso de relato de anormalidade
  ou pela ocorrência de evento incomum, como condição climática severa, acidente, incidente
  ou atos de interferência ilícita.

  6.7 [FC 153.501(b)(5)] Vistorias periódicas com o objetivo de identificar fauna e focos
  atrativos no sítio aeroportuário

  6.7.1 Diariamente, preferencialmente antes do início das operações, o operador de aeródromo
  deve efetuar vistoria no sítio aeroportuário com especial atenção a área operacional, repetindo-a
  quantas vezes julgar necessárias, em função dos horários de maior movimento do aeródromo
  e também conforme o comportamento de atividade das espécies, registrando a presença de aglomeração
  de aves na aproximação da pista de pouso e decolagem ou presença de animais na área operacional
  que possam colocar em risco as operações aéreas, bem como a presença de focos atrativos.

  6.7.2 O operador de aeródromo, por ocasião das vistorias, deve registrar o recolhimento
  de carcaças e animais em decomposição localizados em até 60 metros do(s) eixo(s) da(s) pista(s)
  de pouso e decolagem, dispondo de recursos para recolhimento e armazenamento adequados e
  em condições sanitárias seguras, promovendo a identificação específica do animal, quando
  possível.'
