text: '6.7.4 O operador deve localizar os animais/focos de atração em planta do aeroporto,
  organizada em “grade”.

  6.8 [FC 153.501(b)(6)] Identificação das espécies de fauna no sítio aeroportuário

  6.8.1 A partir da vigência do Manual de Operações do Aeródromo (MOPS) do aeródromo, o operador
  de aeródromo deve providenciar a elaboração de um mapa de grade com as espécies de fauna
  avistadas no sítio aeroportuário que possam provocar risco às operações aéreas, conforme
  esquematizado na Figura 01, a seguir:

  Figura 01 - Mapa de grade - Fauna avistada no aeródromo'
