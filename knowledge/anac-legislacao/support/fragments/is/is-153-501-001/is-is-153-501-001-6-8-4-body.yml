title: O mapa de grade de fauna avistada no aeródromo deve ser mantido atualizado.
text: '6.8.4 O mapa de grade de fauna avistada no aeródromo deve ser mantido atualizado.

  6.8.5 O mapa de grade mais recente deve estar disponível na sala do responsável pelo gerenciamento
  do risco da fauna, bem como em quadro de avisos para visualização e consulta pelo pessoal
  operacional.

  6.9 [FC 153.501(b)(6)] Identificação das espécies de fauna na Área de Segurança Aeroportuária
  (ASA)

  6.9.1 No máximo a cada 6 meses ou quando vier a ter ciência de potencial foco atrativo de
  fauna que gere risco às operações aéreas, o operador de aeródromo deve instituir inspeção
  que percorra a ASA, a fim de avaliar a existência de possíveis focos de atração de fauna
  que possam vir a gerar riscos às operações aéreas.

  6.9.2 Assim que tomar ciência de algum novo foco, o operador de aeródromo deve tomar as
  providências previstas na seção “6.12. Gestões junto aos órgãos externos para eliminação
  de focos atrativos de fauna na ASA”.

  6.9.3 Para fins de registro e arquivo, o operador de aeródromo deve manter em relatório
  próprio o monitoramento realizado, informando qual o trajeto realizado, se utilizou equipamentos
  (por exemplo, binóculo), a observância de focos de atração, quais foram os tipos de focos
  observados (exemplo: abatedouros, lixão, etc.), localização dos focos, se foram observadas
  aves no local, o quantitativo de aves em cada foco, se foi possível identificar as espécies
  de aves, dentre outros.

  6.9.4 O operador de aeródromo deve conceber um mapa com a ASA do aeroporto, abrangendo todos
  os municípios que se encontrem num raio de 20 quilômetros do centro geométrico do aeródromo.
  Deve, ainda, elaborar uma tabela onde sejam relacionados todos os focos identificados, contendo
  as coordenadas geográficas, localização, tipo de foco, espécie e quantidade de aves estimada.

  6.9.5 O mapa e a tabela devem ser atualizados à medida que sejam identificados, por meio
  das inspeções, novos usos e ocupação do solo sujeitos a restrições especiais em função da
  natureza atrativa de fauna, o surgimento de novos focos e/ou a eliminação dos focos preexistentes
  na ASA.

