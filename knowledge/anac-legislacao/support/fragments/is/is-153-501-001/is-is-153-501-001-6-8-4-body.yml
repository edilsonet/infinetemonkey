  6.9.6 O operador de aeródromo deve providenciar medidas a serem contempladas nos procedimentos
  básicos de gerenciamento de risco da fauna no sítio aeroportuário com respeito a identificação
  das espécies em mapa de grade no sítio aeroportuário e na ASA.

  6.9.7 O operador de aeródromo deve analisar a existência de foco atrativo correlacionado
  as espécies identificadas no mapa de grade para que possa atuar na eliminação do foco atrativo
  ou na mitigação do risco à segurança operacional.'
