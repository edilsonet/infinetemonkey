text: '6.9.10 O monitoramento de focos que atraiam espécies, cuja análise de risco considere
  mais perigosas, deve ser feito com maior frequência.

  6.9.11 [Recomendação] O operador de aeródromo deve elaborar um relatório que abranja a evolução
  do potencial atrativo das atividades atrativas ou com potencial de atração de fauna identificadas.

  6.10 [FC 153.501(b)(7)] Ações mitigadoras a serem adotadas'
