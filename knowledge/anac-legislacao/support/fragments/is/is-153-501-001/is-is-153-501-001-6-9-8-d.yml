kind: is
document: is-153-501-001
family: '153'
section_id: 6.9.8
section_title: 'O operador de aeródromo deve identificar focos atrativos ou com potencial
  de atração de fauna na ASA por intermédio de:'
subsection_id: d
cite: 6.9.8(d)
title: 6.9.8(d)
text: 'd) relatos sobre perigo provocado pela fauna recebidos pelos operadores de aeronaves
  ou outras fontes.

  6.9.9 Uma vez identificados os focos atrativos e/ou com potencial de atração de fauna, o
  operador de aeródromo deve monitorá-los com regularidade, de modo a acompanhar a evolução
  de seu potencial atrativo ao longo do tempo, nos termos do parágrafo 6.12 desta Instrução
  Suplementar, bem como da legislação em vigor.'
