title: OBJETIVO
text: 'OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a
  aplicação dos requisitos dispostos nos parágrafos 153.501(b), 153.501(c) e 153.501(d) do
  Regulamento Brasileiro da Aviação Civil - RBAC nº 153.

  1.2 Os procedimentos básicos apresentados nesta IS visam essencialmente à mitigação do risco
  da fauna às operações aéreas no aeródromo até que sejam encaminhados a Identificação do
  Perigo da Fauna (IPF) e o Programa de Gerenciamento do Risco da Fauna (PGRF) a serem submetidos
  à avaliação da ANAC devendo ser incorporados ao Manual de Operações do Aeródromo (MOPS)
  do operador de aeródromo, assim como à incorporação de práticas recomendadas aos operadores
  aeroportuários que não se enquadrem na obrigação de elaboração de IPF e PGRF.'
