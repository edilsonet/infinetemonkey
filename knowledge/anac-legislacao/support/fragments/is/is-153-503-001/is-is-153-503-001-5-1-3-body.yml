text: '5.1.3 Os itens que se iniciam com a notação “Recomendação”, Apesar de não trazerem
  comando

  obrigatório, representam as práticas que a ANAC entende como desejáveis para o aumento

  da segurança e da eficiência das operações, merecendo os melhores esforços dos

  administrados para sua consecução;'
