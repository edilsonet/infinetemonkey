text: '6.2.2 [FC 153.503(e)(4) e 153.505(l)] A ARF deve ser aplicada quando da elaboração
  de uma

  Identificação do Perigo da Fauna - IPF, e sempre que o Programa de Gerenciamento do

  Risco da Fauna - PGRF do aeródromo for atualizado, conforme preconizado pelos

  parágrafos 153.503(e)(4) e 153.505(l) do RBAC nº 153.'
