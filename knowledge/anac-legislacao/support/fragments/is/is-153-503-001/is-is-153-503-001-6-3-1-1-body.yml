text: '6.3.1.1 Contagem populacional das espécies-problema presentes no sítio aeroportuário.
  A contagem

  deve ser feita de forma sistemática e periódica, no âmbito do monitoramento de fauna do

  aeródromo (vistorias), conforme determinado pela seção 153.505 do RBAC nº 153.'
