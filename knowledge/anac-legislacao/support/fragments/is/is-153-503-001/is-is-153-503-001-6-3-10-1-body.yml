text: '6.3.10.1 Certas espécies, uma vez afugentadas, podem demorar dias ou meses para serem
  novamente

  registradas em determinada área do aeródromo, outras costumam retornar no mesmo dia ou

  sequer deixam de fato o local. Pelo diagnóstico realizado na IPF e considerando o quotidiano

  operacional do aeródromo, o grau de susceptibilidade ao afugentamento das espécies deve

  ser estabelecido.

  6.4 [FC 153.503(e)(4) e 153.505(l)] Formulação da Análise do Risco da Fauna'
