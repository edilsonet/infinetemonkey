text: '6.3.3.1 Sempre que forem avistadas espécies-problema, no âmbito das vistorias periódicas,
  deve ser

  registrado se formam ou não bandos, bem como a quantidade de indivíduos identificados,

  de modo a se calcular a quantidade média de indivíduos nos bandos presentes no sítio

  aeroportuário.IS nº 153.503-001

  Revisão A'
