text: '6.3.7.1 O tempo gasto em voo, para aves, ou em intensa atividade, para demais animais,
  implica em

  maior risco potencial às operações de aeronaves. Via de regra, espécies que passam grande

  parte do tempo em voo, como por exemplo planando em térmicas, tendem a causar maior

  risco às operações aéreas que espécies que passam a maior parte do tempo em voo curto,

  forrageando ou empoleiradas. Analogamente, mamíferos frequentemente vistos em

  atividade cruzando a pista de pouso e decolagem podem provocar mais risco que espécies

  que, por exemplo, dormem ao longo do dia no sítio aeroportuário. Assim, este fator deve

  ser observado quando das vistorias periódicas no sítio aeroportuário (por exemplo: a

  “Espécie A” foi observada “voando” em 70% das vistorias realizadas).'
