text: '6.3.9.1 Nem todas as espécies-problema presentes no aeródromo são igualmente capazes
  de evitar

  uma colisão com aeronave. De acordo com variáveis que podem ser massa, comportamento,

  velocidade e manobrabilidade do voo, certas espécies são mais suscetíveis de serem

  colididas do que outras. Cabe ao profissional responsável pela elaboração da IPF estabelecer

  tais diferenças, conforme realidade existente no aeródromo.IS nº 153.503-001

  Revisão A'
