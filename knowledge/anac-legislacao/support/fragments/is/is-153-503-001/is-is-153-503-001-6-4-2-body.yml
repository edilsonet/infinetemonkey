title: Cada um dos fatores de risco elencados na subseção 6.3 deve ser avaliado para cada
  espécie
text: '6.4.2 Cada um dos fatores de risco elencados na subseção 6.3 deve ser avaliado para
  cada espécie

  e ranqueados proporcionalmente em uma escala de 1 (valor mínimo) a 100 (100% sendo a

  ameaça mais significativa para aquele fator presente no aeródromo; para todas as outras

  espécies, o valor será uma percentagem relativa à espécie de maior risco). Por exemplo:
  se

  o fator a ser calculado for a “massa”, a espécie-problema de maior massa terá o valor “100”.

  As demais espécies terão seu valor calculado como uma proporção da primeira (exemplo,

  se a massa média de uma outra espécie for ¼ da massa média da espécie mais pesada, seu

  valor será 25).'
