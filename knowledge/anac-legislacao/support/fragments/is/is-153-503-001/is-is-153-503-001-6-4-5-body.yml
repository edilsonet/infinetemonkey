text: '6.4.5 A fórmula apresentada no parágrafo 6.4.4, conforme mencionado no parágrafo 6.2.2.4

  permite ao operador de aeródromo conhecer, com relativa precisão, a diferença do risco

  provocado entre as espécies-problema presentes, tornando possível o direcionamento mais

  racional de recursos para a mitigação do risco. No Apêndice B é apresentado um exemplo

  da aplicação desta metodologia.

  6.5 [FC 153.503(e)(4) e 153.505(l)] Classificação do risco provocado pelas espécies-

  problema'
