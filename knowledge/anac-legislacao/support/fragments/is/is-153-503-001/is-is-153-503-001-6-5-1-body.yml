text: '6.5.1 Para obtenção de uma classificação das espécies entre “muito alto”, “alto”, “médio”
  e

  “baixo” risco, aplica-se a matriz representada pelo Apêndice A, adaptada de VILLAREAL

  (2008). As variáveis utilizadas se equivalem às do método definido na subseção 6.4, com

  exceção das duas últimas, por serem de caráter mais arbitrário. Os dados para a produção

  da tabela devem ser provenientes do monitoramento de fauna realizado pelo operador de

  aeródromo (vistorias).IS nº 153.503-001

  Revisão A'
