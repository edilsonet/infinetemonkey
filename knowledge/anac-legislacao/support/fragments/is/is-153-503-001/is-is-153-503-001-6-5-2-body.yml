title: As espécies classificadas como risco “alto” e “muito alto” requerem que medidas imediatas
text: '6.5.2 As espécies classificadas como risco “alto” e “muito alto” requerem que medidas
  imediatas

  (ou novas medidas mitigadoras, no caso de uma revisão do PGRF) sejam aplicadas, de modo

  a reduzir o nível de risco.'
