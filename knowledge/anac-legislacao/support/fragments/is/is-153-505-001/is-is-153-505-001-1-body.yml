title: OBJETIVO
text: '1. OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem o objetivo de esclarecer, detalhar e orientar a
  aplicação

  dos requisitos dispostos nos parágrafos 153.505(f), 153.505(g) e 153.505(m)(1) do

  Regulamento Brasileiro da Aviação Civil nº 153.

  1.2 Os procedimentos apresentados nesta IS visam essencialmente à identificação dos perigos

  da fauna presentes no sítio aeroportuário, ao monitoramento da fauna no sítio aeroportuário

  e na ASA e à implementação de técnicas para exclusão/modificação de habitat atrativo de

  animais.'
