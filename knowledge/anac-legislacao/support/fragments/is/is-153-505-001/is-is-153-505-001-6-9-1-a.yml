cite: 6.9.1(a)
title: 6.9.1(a)
text: 'a) Estabelecer procedimentos permanentes para a identificação de eventuais rupturas
  no sistema

  de proteção do aeródromo, especialmente em pontos suscetíveis, como saídas de drenagem e

  cercas, que possibilitem a entrada de animais no sítio aeroportuário que possam provocar
  risco

  às operações aéreas.'
