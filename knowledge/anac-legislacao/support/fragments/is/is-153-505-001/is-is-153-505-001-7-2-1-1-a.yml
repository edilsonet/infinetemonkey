title: 7.2.1.1(a)
text: 'a) O operador de aeródromo deve observar e registrar se há aglomeração de aves na aproximação

  da pista de pouso e decolagem ou presença de animais na área operacional que possam colocar

  em risco as operações aéreas, bem como a presença de possíveis focos atrativos de animais;'
