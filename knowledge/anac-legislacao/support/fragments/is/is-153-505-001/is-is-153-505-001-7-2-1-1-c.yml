text: 'c) O operador de aeródromo deve manter registro do recolhimento de carcaças e animais
  em

  decomposição localizados em até 60 metros do(s) eixo(s) da(s) pista(s) de pouso e decolagem,

  dispondo de recursos para recolhimento e armazenamento adequados e em condições

  sanitárias seguras, promovendo a identificação específica do animal, quando possível; e'
