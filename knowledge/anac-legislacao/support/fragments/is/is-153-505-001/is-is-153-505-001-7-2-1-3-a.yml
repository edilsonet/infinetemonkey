title: 7.2.1.3(a)
text: 'a) O operador de aeródromo deve identificar focos atrativos ou com potencial de atração
  de

  fauna na ASA por intermédio de:

  • observação de fauna deslocando-se através do aeródromo, entre fontes atrativas

  separadas;

  • observação de aves sobrevoando, com frequência, o espaço aéreo do aeródromo;

  • observação, quando do monitoramento do sítio aeroportuário, de usos do solo

  inapropriados na vizinhança adjacente ao aeródromo; e

  • relatos sobre perigo provocado pela fauna recebidos pelos operadores de aeronaves ou

  outras fontes.'
