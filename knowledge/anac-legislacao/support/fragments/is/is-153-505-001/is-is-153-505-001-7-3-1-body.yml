text: '7.3.1 [FC 153.505(g)(2)] O operador de aeródromo deve dispor de recursos e procedimentos
  para

  promover, junto a seu corpo de funcionários, tripulantes e demais profissionais da aviação,

  o preenchimento e registro de relatos relativos à presença de fauna que cause risco àsIS
  nº 153.505-001

  Revisão A

  operações aéreas, tanto no sítio aeroportuário quanto no seu entorno, e/ou à ocorrência
  de

  eventos de segurança operacional envolvendo fauna e aeronaves.'
