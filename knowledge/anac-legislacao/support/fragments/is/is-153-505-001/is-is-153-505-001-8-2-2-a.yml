title: 8.2.2(a)
text: 'a) A cobertura vegetal e o regime de corte da grama devem ser implantados de modo a
  não

  favorecer a proliferação de invertebrados, répteis, roedores e demais mamíferos de pequeno

  porte e/ou produzir sementes e forragem que atraiam fauna que possam provocar risco às

  operações aéreas;'
