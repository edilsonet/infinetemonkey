title: 8.2.3(a)
text: 'a) O operador de aeródromo deve informar destinação provisória e final das aparas de
  vegetação,

  sempre que a IPF ou o próprio identificar que a manutenção dos resíduos vegetais no sítio

  aeroportuário constituem-se focos de atração de animais e agregam risco às operações aéreas.'
