title: 8.2.4(a)
text: 'a) O operador de aeródromo deve evitar que demais áreas verdes no sítio aeroportuário
  exerçam

  atração de aves e outros animais que possam causar risco às operações aéreas, para fins
  de

  alimentação, nidificação, empoleiramento, dentre outros.

  8.3 Focos secundários'
