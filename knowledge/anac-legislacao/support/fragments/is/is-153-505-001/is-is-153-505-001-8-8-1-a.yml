text: 'a) Estabelecer procedimentos para que as estruturas físicas existentes dentro da área
  patrimonial,

  como hangares, terminais, galpões, estruturas e instrumentos de navegação aérea, torres
  de

  iluminação, aeronaves desativadas, dentre outras, não exerçam atração de aves e outros

  animais que possam provocar risco às operações aéreas.IS nº 153.505-001

  Revisão A

  8.9 Sistema de proteção'
