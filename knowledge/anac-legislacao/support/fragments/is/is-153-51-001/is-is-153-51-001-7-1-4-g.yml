section_title: '[FC 153.53(a)(2)] Os objetivos de segurança operacional estabelecidos devem:'
subsection_id: g
cite: 7.1.4(g)
title: 7.1.4(g)
text: 'g) considerar as prioridades de segurança operacional definidas pelas autoridades de
  aviação civil, incluindo suas iniciativas e ações relacionadas às prioridades definidas
  pela ANAC e pelo COMAER.

  7.1.5 [Recomendação] Os objetivos devem ser declarações curtas e de alto nível das prioridades
  de segurança operacional da organização, abordando os riscos de segurança mais significativos.

  7.1.6 O parágrafo 153.53(a)(3) do RBAC nº 153 estabelece que o operador de aeródromo deve
  divulgar o conteúdo da política e dos objetivos de segurança operacional entre os membros
  da organização e comunidade aeroportuária.

  7.1.7 O parágrafo 153.53(a)(4) do RBAC nº 153 determina que o operador de aeródromo estabeleça
  procedimentos para revisar o conteúdo da política e dos objetivos de segurança operacional
  periodicamente ou sempre que necessário para adequar às mudanças na regulamentação aplicável,
  na infraestrutura aeroportuária, na estrutura organizacional ou na prestação dos serviços.

  7.2 Responsabilidade primária acerca da segurança operacional'
