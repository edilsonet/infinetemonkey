text: 'e) responsável pela resposta à emergência aeroportuária.

  7.2.1.3 O parágrafo 153.53(b)(2) do RBAC nº 153 estipula que operador de aeródromo deve
  estabelecer as atribuições e nomear um gestor responsável do aeródromo que, independentemente
  de outras funções, é responsável em nome da organização, pela implementação e manutenção
  de um SGSO efetivo, conforme 153.15(a)(1) e 153.23 do Regulamento.

  7.2.1.4 [Recomendação] É recomendado que o operador do aeródromo considere para o estabelecimento
  dos critérios de qualificação do responsável pelo gerenciamento da segurança operacional,
  disposto no parágrafo 153.15(a) do RBAC nº 153, pelo menos as seguintes competências:'
