text: 'c) executar ações que garantam a segurança das operações aéreas e aeroportuárias.

  7.3 Designação do pessoal-chave de segurança operacional

  7.3.1 Estabelece o parágrafo 153.53(c)(1) do RBAC nº 153 que o operador de aeródromo deve
  designar um profissional responsável pelo gerenciamento da segurança operacional para coordenar
  a implementação, manutenção e melhoria contínua do SGSO, conforme 153.15(a)(2) e 153.25
  deste Regulamento.

  7.3.2 O parágrafo 153.15(a)(2) do RBAC nº 153 determina que o operador de aeródromo deve
  designar um gestor responsável pelo gerenciamento da segurança operacional, cujas responsabilidades
  se encontram definidas no parágrafo 153.25(a) daquele Regulamento e a seguir transcritas:'
