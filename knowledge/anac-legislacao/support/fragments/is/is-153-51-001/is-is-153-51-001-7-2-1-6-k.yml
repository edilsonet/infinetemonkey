cite: 7.2.1.6(k)
title: 7.2.1.6(k)
text: 'k) assegurar a integridade e o desempenho do SGSO, em face de mudanças internas (na
  organização ou no SGSO) ou mudanças externas que tenham impactos potenciais sobre a operação
  do operador de aeródromo.

  7.2.1.7 As Seções 153.27 a 153.31 do RBAC nº 153 estabelecem as responsabilidades dos demais
  gestores, elencados nas alíneas “c”, “d” e “e” do 7.2.1.2 acima (responsável pelas operações
  aeroportuárias; responsável pela manutenção do aeródromo e responsável pela resposta à emergência
  aeroportuária) no que tange ao SGSO:'
