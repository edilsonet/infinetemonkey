text: '7.2.1 Responsáveis operacionais - prerrogativas e responsabilidades

  7.2.1.1 O parágrafo 153.53(b)(1) do RBAC nº 153 estipula que o operador de aeródromo deve
  definir claramente as linhas de responsabilidade pela segurança operacional em toda a organização
  em especial as atribuídas ao corpo gerencial definido em seu parágrafo 153.15(a), bem como
  dos funcionários, em relação ao desempenho de segurança, conforme 153.25, 153.27, 153.29,
  153.31, 153.33 e 153.35 do Regulamento.'
