section_title: '[FC 153.53(c)(2)] A CSO deve atender aos seguintes objetivos:'
subsection_id: d
cite: 7.3.5.2(d)
title: 7.3.5.2(d)
text: 'd) definição de rotina para elaboração de pareceres periódicos sobre o desempenho da
  segurança operacional no aeródromo para apresentação ao gestor responsável do aeródromo.

  7.3.5.4 [Recomendação] Em complemento às ações estratégicas definidas na CSO, o operador
  de aeródromo pode estabelecer grupos operacionais para coordenar a implementação destas
  ações de acordo com o escopo de cada atividade.'
