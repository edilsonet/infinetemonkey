title: 7.3.5.4.2(d)
text: 'd) procedimentos, processos, programas e metodologias definidas para o SGSO, com destaque
  para os que envolvem:

  I) promoção da comunicação acerca da segurança operacional;

  II) promoção de treinamentos dos profissionais envolvidos com a segurança operacional, nos
  moldes estabelecidos pela Seção 153.37 e Instrução Suplementar correlata;

  III) identificação de perigos;

  IV) sistema de relatos;

  V) investigações internas de eventos de segurança operacional;

  VI) gerenciamento do risco;

  VII) monitoramento e medição do desempenho da segurança operacional, incluindo indicadores
  e metas;

  VIII) auditoria interna;

  IX) gestão da mudança;

  X) procedimentos de documentação; e

  XI) coordenação entre suas atividades e aquelas estabelecidas para o Sistema de Resposta
  à Emergência Aeroportuária (SREA).

  7.5.4 [Recomendação] Encontra-se disponível no sítio eletrônico da ANAC, na rede mundial
  de computadores, “Modelo de MGSO”, o qual pode ser utilizado pelo operador de aeródromo
  como referência para desenvolvimento do documento personalizado ao porte de seu aeródromo
  e complexidade de suas operações. (Clique aqui para acessar o modelo)

