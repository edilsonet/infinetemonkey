text: '7.3.5 O parágrafo 153.53(c)(2) do RBAC nº 153 determina que o operador de aeródromo
  deve instituir, por ato oficial, Comissão de Segurança Operacional (CSO).

  7.3.5.1 A CSO deve ser composta pelos profissionais designados como responsáveis pelas atividades
  elencadas no parágrafo 153.15(a) do RBAC nº 153, mencionados no 7.2.1.2 acima, e membros
  de outras áreas da estrutura organizacional do operador de aeródromo relacionadas à segurança
  operacional.'
