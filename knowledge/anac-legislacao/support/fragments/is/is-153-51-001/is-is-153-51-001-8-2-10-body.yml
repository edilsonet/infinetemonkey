  8.3 Avaliação e controle de riscos

  8.3.1 O parágrafo 153.55(c)(1) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  um processo contínuo e formal para o gerenciamento do risco associado à realização de suas
  atividades que assegure a avaliação dos riscos e proposição de ações adicionais para controle
  dos riscos.

  8.3.2 [FC 153.55(c)(1)] O operador de aeródromo deve estabelecer, conforme apresentado em
  Apêndice C desta Instrução Suplementar, metodologia para avaliação e controle do risco à
  segurança operacional em suas operações, a qual deve possuir:'
