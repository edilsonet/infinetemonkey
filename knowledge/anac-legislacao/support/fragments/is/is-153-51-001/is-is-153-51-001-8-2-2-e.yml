section_title: '[FC 153.55(b)(1)] O processo de identificação de perigos deve ser composto
  pelas seguintes etapas:'
subsection_id: e
cite: 8.2.2(e)
title: 8.2.2(e)
text: 'e) distribuição de informações de segurança operacional resultantes dos dados coletados
  e analisados.

  8.2.3 [FC 153.55(b)(1)] O operador de aeródromo deve definir em seu MGSO o prazo para a
  análise dos perigos identificados, conforme cada tipo de dado de entrada.

  8.2.4 O parágrafo 153.55(b)(2) do RBAC nº 153 determina que o operador de aeródromo deve
  estabelecer procedimentos, fontes de dados e recursos a serem utilizados para identificação
  de perigos referentes às abordagens reativa e proativa, conforme a complexidade de suas
  operações.'
