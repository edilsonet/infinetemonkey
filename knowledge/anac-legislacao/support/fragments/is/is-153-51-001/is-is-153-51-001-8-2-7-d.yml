section_id: 8.2.7
section_title: 'Determina o parágrafo 153.55(b)(5) do RBAC nº 153 que o operador de aeródromo
  deve estabelecer um sistema de relatos de aviação civil que:'
subsection_id: d
cite: 8.2.7(d)
title: 8.2.7(d)
text: 'd) seja acessível a toda a comunidade aeroportuária.

  8.2.8 [Recomendação] Em caso de relato anônimo, é importante que sejam divulgadas para toda
  a comunidade aeroportuária as ações estabelecidas com relação ao relato.

  8.2.9 O parágrafo 153.55(b)(6) determina que o operador de aeródromo deve manter atualizada
  uma biblioteca dos perigos identificados, apresentando as ações estabelecidas para o controle
  dos riscos associados a cada um dos perigos.'
