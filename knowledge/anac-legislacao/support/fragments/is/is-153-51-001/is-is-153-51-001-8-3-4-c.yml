text: 'c) melhoria contínua do SGSO.

  9.2 Monitoramento e medição do desempenho da segurança operacional

  9.3 O parágrafo 153.57(b)(1) do RBAC nº 153 determina que o operador de aeródromo deve monitorar
  continuamente a segurança operacional em seu aeródromo com o objetivo de verificar o desempenho
  da segurança operacional e a eficácia dos controles de riscos à segurança operacional implantados.

  9.4 [FC 153.57(b)(1)] Devem ser definidos os responsáveis, os métodos e a frequência do
  processo de avaliação da eficácia dos controles de risco à segurança operacional implantados.

  9.4.1 [Recomendação] Para verificar o desempenho da segurança operacional e validar a eficácia
  dos controles de riscos implantados, é recomendado que se realize uma combinação de achados
  de auditorias internas e de monitoramento de indicadores de desempenho de segurança operacional.

  9.4.2 O parágrafo 153.57(b)(1)(i) do RBAC nº 153 define que o operador de aeródromo deve
  estabelecer indicadores mensuráveis de desempenho da segurança operacional e metas associadas
  aos objetivos de segurança operacional estabelecidos.'
