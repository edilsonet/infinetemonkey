text: 'j) assinatura pelo gestor responsável do aeródromo.

  8.3.5 Os parágrafos 153.55(c)(3) e (4) do RBAC nº 153 determinam que o operador de aeródromo
  deve detalhar as defesas existentes e medidas adicionais para eliminação ou mitigação dos
  riscos em um documento denominado Procedimentos Específicos de Segurança Operacional (PESO),
  sendo dispensado de sua apresentação caso já implementadas como rotina da organização.

