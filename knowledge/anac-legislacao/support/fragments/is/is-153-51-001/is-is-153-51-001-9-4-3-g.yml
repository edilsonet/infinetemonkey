section_title: '[Recomendação] É recomendável que na definição dos indicadores de segurança
  operacional sejam registradas pelo menos as seguintes informações:'
subsection_id: g
cite: 9.4.3(g)
title: 9.4.3(g)
text: 'g) recomendações de segurança operacional derivadas de acidentes ou incidentes aeronáuticos.

  9.4.5 O parágrafo 153.57(b)(1)(ii) do RBAC nº 153 define que o operador de aeródromo deve
  estabelecer um programa de auditorias periódicas de segurança operacional para avaliar a
  eficácia do SGSO e identificar pontos de melhoria.'
