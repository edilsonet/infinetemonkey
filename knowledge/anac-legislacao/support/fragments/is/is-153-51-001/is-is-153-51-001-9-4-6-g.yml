cite: 9.4.6(g)
title: 9.4.6(g)
text: 'g) as propostas de ações corretivas e preventivas.

  9.4.7 O parágrafo 153.57(b)(2) do RBAC nº 153 define que o operador de aeródromo deve enviar
  para a ANAC, até o dia 20 dos meses de janeiro, maio e setembro, relatórios quadrimestrais
  do SGSO, conforme modelo disponibilizado pela ANAC.

  9.4.7.1 O parágrafo 153.57(b)(2)(i) do RBAC nº 153 estabelece que Eventos de Segurança Operacional
  (ESO) que sejam de reporte mandatório pelo operador de aeródromo devem ser comunicados à
  ANAC conforme normativo específico.

  9.4.7.2 O parágrafo 153.57(b)(3) do RBAC nº 153 determina que o operador de aeródromo deve
  definir e implantar ações para correção de desvios verificados na avaliação de desempenho
  da organização frente aos objetivos, metas e indicadores estabelecidos previamente.

  9.5 Gerenciamento de mudanças

  9.5.1 O parágrafo 153.57(c)(1) do RBAC nº 153 determina que o operador de aeródromo deve
  estabelecer procedimentos para identificar as mudanças que possam afetar a segurança das
  operações e para gerenciar os riscos associados a estas mudanças.

  9.5.2 [FC 153.57(c)(1)] Ao definir os procedimentos de gerenciamento de mudanças, o operador
  de aeródromo deve considerar se a mudança pode afetar a eficácia dos controles de risco
  existentes ou se novos perigos e riscos à segurança operacional podem ser introduzidos inadvertidamente.

  9.5.2.1 Uma vez identificados perigos relacionados a determinada mudança, os riscos associados
  devem ser controlados, conforme critérios de identificação de perigos e gerenciamento de
  riscos da organização.

  9.5.2.2 O procedimento de gerenciamento da mudança deve incluir ações de acompanhamento
  que avaliem se a mudança está sendo implementada conforme gerenciamento de risco e controles
  de risco estabelecidos.'
