text: 'b) Divulgação do SGSO e comunicação acerca da segurança operacional.

  10.2 Treinamento e qualificação

  10.2.1 O parágrafo 153.59(b) do RBAC nº 153 define que operador de aeródromo deve estabelecer
  e manter um PISOA, a fim de assegurar que o pessoal envolvido com atividades relacionadas
  à segurança operacional esteja qualificado e treinado para desempenhar suas funções, conforme
  disposto no parágrafo 153.37(b).

  10.2.2 A Instrução Suplementar - IS nº 153.37-001 esclarece, detalha e orienta a aplicação
  dos requisitos estabelecidos no parágrafo 153.37(b) do RBAC nº 153, acima mencionado. (Vide
  IS nº 153.37-001)

  10.3 Divulgação do SGSO e comunicação acerca da segurança operacional

  10.3.1 O parágrafo 153.59(c) do RBAC nº 153 determina que o operador de aeródromo deve estabelecer
  meios para a difusão e comunicação da segurança operacional para toda a comunidade aeroportuária
  com vistas a:'
