title: APÊNDICE B - MODELO DE BIBLIOTECA DE PERIGOS
text: 'APÊNDICE B - MODELO DE BIBLIOTECA DE PERIGOS


  B.1 Generalidades

  B.1.1 A biblioteca de perigos é um mecanismo de armazenamento de informações de perigos
  e riscos à segurança operacional do aeródromo e tem a finalidade de desenvolver, prover
  e compartilhar informações para mitigação dos riscos e da melhoria contínua do gerenciamento
  da segurança operacional.

  B.1.2 A biblioteca de perigos também deve ser usada como mecanismo para avaliar e acompanhar
  a evolução de um perigo, o que pode ser feito mantendo-se um histórico dos registros dos
  perigos e suas modificações ou eliminação, bem como da eficácia das medidas mitigadoras
  adotadas.

