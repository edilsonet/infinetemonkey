title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  12.1 Os casos omissos serão dirimidos pela ANAC.

  12.2 Esta IS entra em vigor em 2 de maio de 2023

  REFERÊNCIAS BIBLIOGRÁFICAS

  13.1 GRUPO BRASILEIRO DE SEGURANÇA OPERACIONAL DE INFRAESTRUTURA AEROPORTUÁRIA. Guia de
  boas práticas para elaboração de indicadores de segurança operacional. Brasil, [201-]. 35
  p. Disponível em: https://www.anac.gov.br/assuntos/paginas-tematicas/gerenciamento-da-seguranca-operacional/baist/trabalhos-realizados.
  Acesso em: 09 nov. 2021.

  13.2 International Civil Aviation Organization. Annex 14 to the Convention on International
  Civil Aviation: Aerodromes - volume I, Aerodrome Design and Operations. 8th ed. Montréal:
  ICAO, July 2018.

  13.3 International Civil Aviation Organization. Annex 19 to the Convention on International
  Civil Aviation: Safety Management. 2nd ed. Montréal: ICAO, July 2016.

  13.4 International Civil Aviation Organization. Safety Management Manual (SMM): Doc. 9859
  AN/474. 4rd ed. Montréal: ICAO, 2018.

  13.5 International Civil Aviation Organization. Doc 9981, Procedures for Air Navigation
  Services - Aerodromes. 3rd ed. Montréal: ICAO, 2020.'
