title: GENERALIDADES
text: 'GENERALIDADES

  6.1 A Seção 153.51 do RBAC nº 153 define em seu parágrafo 153.51(a) que o operador de aeródromo
  deve manter e garantir a melhoria contínua de um Sistema de Gerenciamento da Segurança Operacional
  (SGSO) compatível com o porte do aeródromo e adequado à complexidade das operações realizadas
  sob sua responsabilidade, bem como que esteja alinhado ao Programa de Segurança Operacional
  Específico da ANAC (PSOE/ANAC).

  6.2 O parágrafo 153.51(c) do RBAC nº 153 determina que o operador de aeródromo considere
  os seguintes componentes, bem como outros regulamentos pertinentes, para estruturação do
  SGSO:'
