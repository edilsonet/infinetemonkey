  POLÍTICA E OBJETIVOS DE SEGURANÇA OPERACIONAL

  7.1 Responsabilidade e comprometimento da Alta Direção

  7.1.1 Estabelece o parágrafo 153.53(a)(1) do RBAC nº 153 que a política de segurança operacional
  deve refletir o compromisso da organização em relação à segurança operacional, incluindo
  a melhoria contínua do SGSO e a promoção de uma cultura positiva de segurança, contendo
  ainda uma declaração expressa do comprometimento do operador de aeródromo com a garantia
  da segurança operacional.

  7.1.2 [FC 153.53(a)(1)] A política de segurança operacional deve apresentar o comprometimento
  do operador de aeródromo com a segurança operacional, como mencionado no parágrafo 153.53(a)(1)
