title: generalidades(l)
text: 'l) ser assinada pelo gestor responsável pelo aeródromo.

  7.1.3 O parágrafo 153.53(a)(2) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  objetivos relacionados com a melhoria do desempenho da segurança operacional, mensuráveis
  e compatíveis com a complexidade do aeródromo, que reflitam o compromisso de manter ou melhorar
  continuamente a eficácia geral do SGSO e o que se pretende alcançar em relação aos resultados
  de segurança operacional.'
