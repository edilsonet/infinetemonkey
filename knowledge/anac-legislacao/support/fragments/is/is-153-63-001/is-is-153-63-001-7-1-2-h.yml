text: 'h) ser assinada pelo gestor responsável pelo aeródromo.

  7.2 Objetivos de segurança operacional

  7.2.1 O parágrafo 153.65(a)(2) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  objetivos relacionados com a segurança operacional, que sejam mensuráveis e compatíveis
  com a complexidade do aeródromo.'
