text: 'b) ter acesso aos dados e informações de segurança operacional necessários ao exercício
  das responsabilidades citadas na Seção 153.25 do RBAC nº 153.

  7.3.1.7 As Seções 153.27 a 153.31 do RBAC nº 153 estabelecem as responsabilidades dos demais
  gestores, elencados nas alíneas “c”, “d” e “e” do 7.3.1.2 acima (responsável pelas operações
  aeroportuárias; responsável pela manutenção do aeródromo e responsável pela resposta à emergência
  aeroportuária), no que tange ao PGSO:'
