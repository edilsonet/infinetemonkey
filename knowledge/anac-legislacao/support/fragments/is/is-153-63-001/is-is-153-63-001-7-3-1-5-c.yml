section_title: 'O parágrafo 153.25(a) do RBAC nº 153 elenca as responsabilidades do responsável
  pelo gerenciamento da segurança operacional, que são:'
subsection_id: c
cite: 7.3.1.5(c)
title: 7.3.1.5(c)
text: 'c) executar ações que garantam a segurança das operações aéreas e aeroportuárias.

  7.4 Sistema de documentação do PGSO

  7.4.1 O parágrafo 153.65(c)(1) do RBAC nº 153 define que o operador de aeródromo deve, em
  harmonia ao quanto estabelecido na Seção 153.39 do mencionado Regulamento, estabelecer os
  requisitos de controle da documentação e dos registros relacionados ao PGSO, compreendendo
  identificação, armazenamento, distribuição, atualização, revisão e descarte.

  7.4.2 O parágrafo 153.65(c)(2) do RBAC nº 153 impõe ao operador de aeródromo a obrigação
  de, como parte da documentação controlada do PGSO, documentar o Plano de Gerenciamento da
  Segurança Operacional (PGSO).'
