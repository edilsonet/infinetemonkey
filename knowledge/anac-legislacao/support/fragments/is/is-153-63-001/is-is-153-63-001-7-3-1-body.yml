title: Responsáveis operacionais - prerrogativas e responsabilidades
text: '7.3.1 Responsáveis operacionais - prerrogativas e responsabilidades

  7.3.1.1 O parágrafo 153.65(b)(1) do RBAC nº 153 estipula que o operador de aeródromo deve
  estabelecer as atribuições dos responsáveis elencados no parágrafo 153.15(a) e demais membros
  de sua equipe quanto à segurança operacional e, especificamente, quanto ao PGSO, sendo cabível
  ao gestor do aeródromo a responsabilidade pela implementação e manutenção do PGSO.'
