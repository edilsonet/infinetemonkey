text: 'b) avaliação e controle de riscos.

  8.2 Identificação de perigos

  8.2.1 O parágrafo 153.67(b)(1) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  um processo contínuo e formal para identificar perigos existentes ou potenciais que possam
  impactar a segurança operacional das atividades e das operações desenvolvidas em todas as
  áreas do aeródromo.'
