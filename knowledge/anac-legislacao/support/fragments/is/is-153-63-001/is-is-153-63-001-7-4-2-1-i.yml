  7.4.3 [Recomendação] Encontra-se disponível no sítio eletrônico da ANAC, na rede mundial
  de computadores, o “Manual para Implementação do Plano de Gerenciamento da Segurança Operacional
  (PGSO)”, o qual pode ser utilizado pelo operador de aeródromo como referência para desenvolvimento
  do documento personalizado ao porte de seu aeródromo e complexidade de suas operações. (inserir
  link para o Manual - em elaboração)

