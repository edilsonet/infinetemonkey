section_title: '[FC 153.67(b)(1)] O processo de identificação de perigos deve ser composto
  pelas seguintes etapas:'
subsection_id: c
cite: 8.2.2(c)
title: 8.2.2(c)
text: 'c) armazenamento de dados e informação de segurança operacional.

  8.2.3 O parágrafo 153.67(b)(2) do RBAC nº 153 determina que o operador de aeródromo deve
  manter atualizada uma biblioteca dos perigos identificados, que contenha as ações estabelecidas
  para o controle dos riscos associados a cada um deles.'
