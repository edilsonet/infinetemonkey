section_title: 'Determina o parágrafo 153.67(b)(3) do RBAC nº 153 que o operador de aeródromo
  deve estabelecer um sistema de relatos de aviação civil que:'
subsection_id: e
cite: 8.2.6(e)
title: 8.2.6(e)
text: 'e) requisitos para divulgação das ações para controle dos riscos.

  8.3.3 O parágrafo 153.67(c)(2) do RBAC nº 153 estabelece que o resultado do processo de
  gerenciamento de risco deve ser consolidado em um formulário padronizado de Análise de Impacto
  sobre a Segurança Operacional (AISO).'
