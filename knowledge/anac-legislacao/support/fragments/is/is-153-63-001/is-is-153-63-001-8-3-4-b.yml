text: 'b) Divulgação do PGSO e comunicação da segurança operacional.

  10.2 Treinamento e qualificação

  10.2.1 O parágrafo 153.71(b) do RBAC nº 153 define que operador de aeródromo deve estabelecer
  e implementar os treinamentos exigidos pela Seção 153.37 do RBAC nº 153, a fim de assegurar
  que o pessoal envolvido com atividades relacionadas à segurança operacional esteja qualificado
  e treinado para desempenhar suas funções.

  10.2.2 A Instrução Suplementar - IS nº 153.37-001 esclarece, detalha e orienta a aplicação
  dos requisitos estabelecidos na Seção 153.37 do RBAC nº 153, acima mencionado. (Vide IS
  nº 153.37-001)

