text: 'c) melhoria contínua do PGSO.

  9.2 Monitoramento e medição do desempenho da segurança operacional

  9.2.1 O parágrafo 153.69(b)(1) do RBAC nº 153 determina que o operador de aeródromo deve
  monitorar continuamente a segurança operacional em seu aeródromo com o objetivo de verificar
  o desempenho da segurança operacional e a eficácia dos controles de riscos à segurança operacional
  implantados.

  9.2.2 O parágrafo 153.69(b)(2) do RBAC nº 153 define que o operador de aeródromo deve estabelecer
  indicadores mensuráveis de desempenho da segurança operacional e metas associadas aos objetivos
  de segurança operacional estabelecidos.

  9.2.3 [FC 153.69(b)(2)] O operador de aeródromo deve utilizar pelo menos uma das informações
  para monitoramento e medição de desempenho da segurança operacional, considerando a complexidade
  de suas operações e o desempenho da segurança operacional aferido anteriormente:'
