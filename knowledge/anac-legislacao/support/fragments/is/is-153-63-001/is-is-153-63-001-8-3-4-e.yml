section_title: '[FC 153.67(c)(2)] O formulário padronizado de Análise de Impacto sobre a Segurança
  Operacional (AISO) deve apresentar:'
subsection_id: e
cite: 8.3.4(e)
title: 8.3.4(e)
text: 'e) relatórios de inspeção da ANAC.

  9.2.4 O parágrafo 153.69(b)(3) do RBAC nº 153 determina que o operador de aeródromo deve
  definir e implantar ações para correção de desvios verificados na avaliação de desempenho
  da organização frente aos objetivos, metas e indicadores estabelecidos previamente.

  9.2.5 [Recomendação] O responsável pelo gerenciamento da segurança operacional deve avaliar
  periodicamente o desempenho da segurança operacional no aeródromo frente aos objetivos,
  metas e indicadores estabelecidos, definindo prazo para tomada de ações corretivas por ventura
  necessárias.

  9.3 Gerenciamento de mudanças

  9.3.1 O parágrafo 153.69(c)(1) do RBAC nº 153 determina que o operador de aeródromo estabeleça
  procedimentos para identificar as mudanças que possam afetar a segurança das operações e
  para gerenciar os riscos associados a essas mudanças.

  9.3.2 [FC 153.69(c)(1)] O operador de aeródromo deve considerar junto à equipe operacional
  do aeródromo os potenciais impactos da mudança no risco à segurança operacional, identificando
  ações necessárias à manutenção da segurança operacional.

  9.4 Melhoria contínua do SGSO

  9.4.1 O parágrafo 153.69(d)(1) do RBAC nº 153 determina que o operador de aeródromo deve
  periodicamente avaliar os processos associados ao PGSO quanto à manutenção ou melhoria da
  efetividade do PGSO.

  9.5 Comunicação de Eventos de Segurança Operacional (ESO)

  9.5.1 O parágrafo 153.69(e) do RBAC nº 153 estabelece que Eventos de Segurança Operacional
  (ESO) que sejam de reporte mandatório pelo operador de aeródromo devem ser comunicados à
  ANAC conforme normativo específico.

