section_id: 8.3.4
section_title: '[FC 153.67(c)(2)] O formulário padronizado de Análise de Impacto sobre a Segurança
  Operacional (AISO) deve apresentar:'
subsection_id: j
cite: 8.3.4(j)
title: 8.3.4(j)
text: 'j) assinatura pelo gestor responsável do aeródromo.

  8.3.5 [Recomendação] O Apêndice D desta Instrução Suplementar apresenta modelo de AISO a
  ser utilizado pelo operador de aeródromo com vistas a atender ao disposto no parágrafo 8.3.3
  e 8.3.4, acima.

  8.3.6 Os parágrafos 153.67(c)(3) e (3)(i) do RBAC nº 153 determinam que o operador de aeródromo
  deve detalhar e documentar as defesas existentes e medidas adicionais para controle dos
  riscos em um documento denominado Procedimentos Específicos de Segurança Operacional (PESO),
  sendo dispensado de sua apresentação caso já implementadas como rotina da organização e
  desde que mantidas as condições executivas e operacionais do aeródromo.

  8.3.7 [Recomendação] O Apêndice E desta Instrução Suplementar apresenta modelo de PESO a
  ser utilizado pelo operador de aeródromo com vistas a atender ao disposto no parágrafo 8.3.6,
  acima.

