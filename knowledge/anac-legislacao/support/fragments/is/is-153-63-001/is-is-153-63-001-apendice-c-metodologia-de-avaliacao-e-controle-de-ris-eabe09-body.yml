cite: apendice-c-metodologia-de-avaliacao-e-controle-de-ris-eabe09
title: APÊNDICE C - METODOLOGIA DE AVALIAÇÃO E CONTROLE DE RISCO À SEGURANÇA OPERACIONAL
text: 'APÊNDICE C - METODOLOGIA DE AVALIAÇÃO E CONTROLE DE RISCO À SEGURANÇA OPERACIONAL


  C.1 Objetivo

  C.1.1 O objetivo do processo de avaliação de risco é permitir a avaliação do nível de risco
  associado ao perigo identificado, em termos de danos potenciais. Os riscos devem ser avaliados
  em termos de probabilidade e severidade. Depois de avaliado o risco, uma matriz de avaliação
  de risco será utilizada para determinar o nível global de risco.

  C.2 Critérios para estimar a probabilidade

  C.2.1 A Tabela C.1, a seguir, apresenta os critérios a serem adotados para estimar a probabilidade
  de ocorrência de determinada consequência associada aos perigos identificados.

  Tabela C.1 - Critérios para estimar a probabilidade de ocorrência de determinado evento

  Probabilidade do evento

  Definição qualitativa

  Significado

  Valor

  Frequente

  Provável que ocorra muitas vezes

  (tem ocorrido frequentemente).

  5

  Ocasional

  Provável que ocorra algumas vezes

  (tem ocorrido com pouca frequência).

  4

  Remoto

  Improvável que ocorra, mas possível

  (ocorre raramente).

  3

  Improvável

  Bastante improvável que ocorra

  (não se tem notícia de que tenha ocorrido).

  2

  Muito Improvável

  Quase improvável que o evento ocorra.

  1


  C.3 Critérios para estimar a severidade

  C.3.1 Na Tabela C.2, a seguir, são apresentados critérios a serem adotados para estimar
  a severidade das consequências de determinado evento.

  Tabela C.2 - Critérios para estimar a severidade das consequências de determinado evento

  Severidade dos eventos

  Definição na aviação

  Significado

  Valor

  Catastrófico

  ü Destruição de equipamento

  ü Múltiplas mortes

  A

  Crítico

  ü Uma redução importante das margens de segurança operacional, dano físico ou uma carga
  de trabalho tal que os operadores não podem desempenhar suas tarefas de forma precisa e
  completa.

  ü Lesões sérias

  ü Grave dano ao equipamento

  B

  Significativo

  ü Uma redução significativa das margens de segurança operacional, uma redução na habilidade
  do operador em responder a condições operacionais adversas como resultado do aumento da
  carga de trabalho ou como resultado de condições que impedem sua eficiência.

  ü Incidente sério

  ü Lesões às pessoas

  C

  Pequeno

  ü Interferência

  ü Limitações operacionais

  ü Utilização de procedimentos de emergência

  ü Incidentes menores

  D

  Insignificante

  ü Consequências leves

  E


  C.4 Critérios para determinar a tolerabilidade do risco

  C.4.1 Uma vez obtida a probabilidade e a severidade, o índice de avaliação do risco é obtido
  pela combinação destas duas medidas.


  Tabela C.3 - Definição do índice de classificação do risco - matriz probabilidade x severidade


  C.4.2 Uma vez obtido o índice de avaliação do risco pela Tabela C.3, é possível inferir
  sua tolerabilidade, conforme critérios sugeridos na Tabela C.4.

  Tabela C.4 - Critérios para definir a tolerabilidade dos riscos de determinado evento analisado


  C.5 Critérios para consultar partes externas

  C.5.1 Serão convidadas a participar do processo de avaliação e mitigação de risco partes
  externas ao aeródromo, tais como companhias áreas e empresas prestadoras de serviço quando
  estas forem responsáveis diretas por ações necessárias ao controle do risco.

  C.6 Requisitos para divulgação das ações para controle dos riscos

  C.6.1 As ações de controle dos riscos identificados devem ser cientificadas aos responsáveis
  por essas ações.

  C.6.2 O processo de controle dos riscos é consolidado em formulário padronizado de Análise
  de Impacto sobre a Segurança Operacional (AISO) e as ações decorrentes deste processo são
  formalizadas em um documento denominado Procedimentos Específicos de Segurança Operacional
  (PESO).

  C.6.3 As ações referentes ao controle dos riscos definidas no PESO devem ser monitoradas
  com vistas a avaliar sua eficácia e, caso necessário, buscar novas soluções para preservar
  a segurança operacional no aeródromo.'
