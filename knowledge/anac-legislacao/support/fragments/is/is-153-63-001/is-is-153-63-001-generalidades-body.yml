title: GENERALIDADES
text: 'GENERALIDADES

  6.1 A Seção 153.63 do RBAC nº 153 define em seu parágrafo 153.63(a) que o operador de aeródromo
  deve manter um Plano de Gerenciamento da Segurança Operacional (PGSO) compatível com o porte
  do aeródromo e com a complexidade das operações realizadas sob sua responsabilidade.

  6.2 O parágrafo 153.63(b) do RBAC nº 153 determina que o operador de aeródromo considere
  os seguintes componentes, bem como outros regulamentos pertinentes, para estruturação do
  PGSO:'
