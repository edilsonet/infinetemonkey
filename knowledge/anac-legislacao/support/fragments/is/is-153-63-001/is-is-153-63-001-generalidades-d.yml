text: 'd) promoção da segurança operacional.

  6.3 O parágrafo 153.63(c) do RBAC nº 153 define que o operador de aeródromo deve monitorar
  periodicamente as condições operacionais do aeródromo e, quando necessário, adotar as ações
  e medidas mitigadoras cabíveis.

  6.4 As Seções seguintes desta Instrução Suplementar detalham cada um dos componentes listados
  no parágrafo 153.63(b) do RBAC nº 153, reproduzidos em 6.2 acima.

  POLÍTICA E OBJETIVOS DE SEGURANÇA OPERACIONAL

  7.1 Política de segurança operacional

  7.1.1 O parágrafo 153.65(a)(1) do RBAC nº 153 estabelece que a política de segurança operacional
  deve refletir o compromisso da organização em relação à segurança operacional, contendo
  ainda uma declaração expressa do comprometimento do operador de aeródromo com a garantia
  da segurança operacional em seu aeródromo.'
