title: Sistema de pistas e pátios
text: '1. Sistema de pistas e pátios

  (Caso seja pista pavimentada) 1.1 O pavimento da pista de pouso e decolagem, pista de taxi
  ou pátio de aeronaves possui defeitos graves em sua superfície como buracos ou grande desagregação
  de pedras.

  · Perda do controle direcional da aeronave;

  · Danos às aeronaves.

  · Buracos: suspensão imediata das operações ou interdição das áreas com defeitos até sua
  correção.

  · Desagregação: limpeza do material solto (desagregado), suspensão das operações de aeronaves
  à reação ou interdição das áreas com defeitos até sua correção.

  (Caso seja pista não pavimentada) 1.1.b A superfície da pista de pouso e decolagem, pista
  de taxi ou pátio de aeronaves possui defeitos graves em sua superfície como sulcos feitos
  pela aeronave, desprendimento ou acumulação de material na superfície que possa prejudicar
  o controle direcional da aeronave?

  · Perda do controle direcional da aeronave;

  · Danos às aeronaves.

  · suspensão imediata das operações ou interdição das áreas com defeitos até sua correção.

  1.2. Foi constatado que em dias de chuva aparecem poças d''água maiores que 1m de diâmetro
  na superfície da pista de pouso e decolagem.

  · Perda do controle direcional da aeronave.

  · Correção da declividade;

  · Monitoramento do defeito até sua correção.

  1.3. Foi observado na superfície da pista de pouso e decolagem a presença de objetos que
  não fazem parte da operação, tais como plásticos, vidros, pedras, metais ou qualquer tipo
  de objeto (FOD).

  · Perda do controle direcional da aeronave;

  · Danos às aeronaves.

  · Retirada imediata dos objetos que não fazem parte da operação (FOD).'
