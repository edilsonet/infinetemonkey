title: Auxílios visuais à navegação aérea e sistemas elétricos
text: '2. Auxílios visuais à navegação aérea e sistemas elétricos

  2.1. O cone da biruta do aeródromo está rasgado, perdeu completamente sua cor ou não está
  girando na direção do vento.

  · Saída de aeronave da pista.

  · Conserto da biruta.

  2.2. Para aeródromos com operação noturna, a iluminação da biruta está queimada ou quebrada,
  não permitindo que seja vista à noite.

  · Saída de aeronave da pista;

  · Toque da aeronave antes da pista durante o pouso.

  · Correção da iluminação da biruta.

  2.3. Para aeródromos com operação noturna, a sinalização luminosa da pista de pouso e decolagem
  não está funcionando.

  · Saída de aeronave da pista;

  · Toque da aeronave antes da pista durante o pouso.

  · Suspensão imediata das operações noturnas até sua correção.'
