title: Áreas verdes e sistema de drenagem
text: '3. Áreas verdes e sistema de drenagem

  3.1. A altura vegetação das áreas verdes nas laterais da pista de pouso e decolagem ou da
  pista de táxi está maior do que 15 cm.

  * Se houver valor específico definido em Programa de Gerenciamento do Risco da Fauna, considerar
  este último.

  · Colisão de aeronaves com aves.

  · Roçagem da vegetação.

  3.2. Existe algum arbusto, moita ou árvore na lateral da pista de pouso e decolagem com
  a vegetação maior do que 1 metro de altura, ou menor que um metro mas que tenha porte que
  possa causar dano à aeronave que sair da pista?.

  · Perda de controle direcional da aeronave;

  · Danos às aeronaves que saírem da pista.

  · Eliminação do arbusto, moita ou árvore.

  3.3. Existe obstrução (vegetação ou acúmulo de detritos/terra) de alguma canaleta do sistema
  de drenagem do aeródromo.

  · Perda de controle direcional da aeronave;

  · Danos às aeronaves que saírem da pista;

  · Colisão de aeronaves com aves.

  · Limpeza do sistema de drenagem'
