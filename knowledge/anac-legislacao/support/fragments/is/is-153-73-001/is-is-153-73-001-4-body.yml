title: Verificação da fauna
text: '4. Verificação da fauna

  4.1. Existe lixão, matadouro ou pontos de descarte irregular de lixo nas áreas vizinhas
  ao aeródromo

  · Colisão de aeronaves com aves.

  · Atuar mediante a gestão junto aos órgãos externos (município, população do entorno do
  aeródromo, guarda municipal ou polícia local, etc) para a mitigação do risco provocado pela
  presença de focos atrativos de fauna ou com potencial atrativo de fauna em área externa
  ao sítio aeroportuário.


  4.2. Existem animais sendo criados dentro das áreas do aeródromo.

  · Colisão de aeronaves com animais.

  · Atuar mediante gestão junto aos concessionários e demais pessoas que atuam no aeródromo
  para a mitigação do risco provocado pela presença de fauna no sítio aeroportuário.


  4.3. Existem no aeródromo equipamentos, edificações ou instalações abandonadas que possam
  servir de abrigo para animais terrestres ou aves.

  · Colisão de aeronaves com aves e animais terrestres.

  · Controlar ou monitorar os elementos que constituem em foco atrativo e abrigo de animais.

  · Avaliar a possibilidade de eliminação desses equipamentos, edificações ou instalações
  abandonadas.'
