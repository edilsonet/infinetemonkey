title: Verificação da fauna
text: '5. Verificação da fauna

  5.1. Dentro do sítio aeroportuário é possível identificar grande presença de pássaros.

  · Colisão de aeronaves com aves.

  · Controlar os focos atrativos de fauna (animais, especialmente pássaros), tais como vegetação
  (principalmente tamanho da grama), focos secundários (colmeias, cupinzeiros, formigueiros
  e demais insetos, répteis, anfíbios e pequenos mamíferos que provoquem atração de fauna),
  valas de drenagem e galerias de água pluvial, dispositivos de esgotamento sanitário, lagos,
  áreas alagadiças e demais áreas de acúmulo de água, coleta de resíduos sólidos, edificações,
  equipamentos e demais locais que possam servir de abrigo e poleiro e sistemas de proteção.

  5.2. Foi identificado neste dia a presença de animal na área operacional ou o fato foi relatado
  por algum piloto ou usuário do aeródromo.

  · Colisão de aeronaves com animais terrestres.

  · Monitorar as barreiras de segurança;

  · Controlar os focos atrativos de fauna.'
