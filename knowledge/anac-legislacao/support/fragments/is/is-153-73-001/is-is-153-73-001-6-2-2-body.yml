text: '6.2.2 [Recomendação] É recomendado que o operador de aeródromo considere abranger novos
  perigos não contidos nos Apêndice A, C e E mencionados acima.

  6.3 O parágrafo 153.73(b) do RBAC nº 153 determina que o operador de aeródromo deve definir
  e implantar ações para eliminação dos perigos ou mitigação das consequências associadas.

  6.4 [Recomendação] Os Apêndices B, D e F desta Instrução Suplementar trazem recomendações
  para adoção de ações compatíveis com as consequências relacionadas a cada perigo listado
  nos Apêndice A, C e E.

  6.5 O parágrafo 153.73(c) do RBAC nº 153 determina que o operador de aeródromo deve manter
  registro das condições operacionais verificadas e as ações adotadas para a eliminação dos
  perigos ou mitigação das consequências associadas.

  6.6 [FC 153.73(c)] O registro da verificação deve ser mantido por no mínimo 6 (seis) meses,
  abrangendo pelo menos o descrito nos Apêndices A, C e E desta Instrução Suplementar.

  6.6.1 O registro das ações adotadas para a eliminação dos perigos ou mitigação das consequências
  associadas deve ser mantido por no mínimo 12 (doze) meses, conforme Apêndice G desta Instrução
  Suplementar.'
