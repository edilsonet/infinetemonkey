title: GENERALIDADES
text: 'GENERALIDADES

  6.1 O parágrafo 153.73(a) do RBAC nº 53 define que o operador de aeródromo deve verificar
  periodicamente as condições operacionais do aeródromo, identificando os perigos existentes
  ou potenciais que possam impactar a segurança operacional das atividades e das operações
  desenvolvidas no aeródromo.

  6.2 [FC 153.73(a)] O operador deve avaliar as condições operacionais englobando:'
