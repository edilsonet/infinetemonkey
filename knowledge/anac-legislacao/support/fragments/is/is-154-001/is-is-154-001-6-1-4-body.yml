text: '6.1.4 Para a sinalização horizontal do pátio de aeronaves, emprega-se a codificação
  de cores apresentada na Tabela 1.


  6.1.5 Salvo quando expressamente contrário nesta IS, as linhas da sinalização horizontal
  do pátio de aeronaves devem possuir, no mínimo, 15 centímetros de largura.

  6.1.6 Quando for necessário aumentar o contraste entre a sinalização horizontal e a superfície
  do pavimento ou quando for necessário aumentar a visibilidade em operações noturnas ou de
  baixa visibilidade, deve-se acrescentar, em ambos os lados, um contorno às sinalizações
  horizontais. O contorno deve ser preto em caso de sinalizações amarelas ou brancas sobre
  pavimentos claros e deve ser branco em caso de sinalizações vermelhas sobre pavimentos escuros,
  conforme Figura 1. O contorno deve ter, em cada lado, 10 centímetros de largura.


  Figura 1 - Contornos em sinalizações horizontais de pátio de aeronaves'
