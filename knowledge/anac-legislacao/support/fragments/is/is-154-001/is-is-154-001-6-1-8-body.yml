  6.2. Sinalização horizontal e vertical para aeronaves

  6.2.1 [FC 154.303(m)(3)] - Os principais elementos que compõem a sinalização horizontal
  de posição de estacionamento de aeronaves são: linha de entrada, identificação da posição
  de estacionamento, barra de virada, linha de virada, barra de alinhamento, linha de parada
  e linha de saída. Esses elementos podem ser omitidos, a depender da configuração do pátio
  e da forma como a aeronave acessa a posição de estacionamento e sai dela, se por meios próprios
  ou rebocada.

  6.2.1.1 A linha de entrada indica a trajetória a ser percorrida pela aeronave, por meios
  próprios ou por meio de reboque, ao sair da pista de táxi em direção à posição de estacionamento,
  de forma a manter distâncias seguras em relação aos obstáculos.

  6.2.1.1.1 A linha de entrada pode ser contínua desde a linha de eixo de pista de táxi até
  o final da posição de estacionamento ou pode ser descontínua com seta de indicação de continuidade,
  conforme exemplos (a) e (b), respectivamente, da Figura 4.


  Figura 4 - Linha de entrada completa (a) e com seta de indicação de continuidade (b)

  6.2.1.1.2 O traçado da linha de entrada a partir da linha de eixo da pista de táxi pode
  ser reto ou curvo, conforme exemplos da Figura 5. Quando curvo, o raio de curvatura deve
  ser compatível com a envergadura da aeronave crítica à qual a posição é destinada.

  6.2.1.1.3 Em posições de estacionamento atendidas por sistema de orientação visual de estacionamento
  ou atividade de sinaleiro (marshaller), recomenda-se o emprego da linha de entrada reta,
  conforme exemplos (a) e (b) da Figura 5.


  Figura 5 - Exemplos de linha de entrada

  6.2.1.2 A identificação da posição de estacionamento auxilia o piloto no reconhecimento
  da posição de estacionamento adequada antes do início da manobra para entrada na posição.

  6.2.1.2.1 Essa sinalização deve ser composta por um número, por uma letra ou pela combinação
  de um número e uma letra. Quando combinados, o número deve, preferencialmente, anteceder
  a letra, para evitar possíveis confusões com as designações das pistas de táxi.'
