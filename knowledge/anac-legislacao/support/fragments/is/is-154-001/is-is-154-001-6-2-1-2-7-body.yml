text: '6.2.1.2.7 A opção (c) da Figura 6, por sua vez, pode ser utilizada em qualquer ocasião,
  desde que respeitadas as dimensões ilustradas na Figura 9.


  Figura 9 - Localização da identificação de posição de estacionamento (c) em relação à linha
  de entrada

  6.2.1.3 A barra de virada indica ao piloto o ponto em que a aeronave deve começar a virar
  durante a manobra de entrada na posição de estacionamento ou saída dela, conforme Figura
  10. O uso dessa sinalização é indicado quando a aeronave acessa a posição ou sai dela por
  meios próprios, sem auxílios externos.'
