text: '6.2.1.3.1 A barra de virada deve formar ângulo reto em relação à linha de entrada,
  do lado do piloto à esquerda, e ter, no mínimo, 6 metros de comprimento.

  6.2.1.3.2 A distância entre a barra de virada e a linha de entrada ou saída deve ser determinada
  em função da aeronave crítica à qual a posição de estacionamento é destinada, de modo que
  sempre seja visível da posição do piloto, com distância mínima de 2 metros.'
