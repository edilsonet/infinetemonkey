title: A seta da barra de virada deve indicar o sentido de virada da aeronave.
text: '6.2.1.3.3 A seta da barra de virada deve indicar o sentido de virada da aeronave.


  Figura 10 - Barra de virada

  6.2.1.3.4 Caso uma posição de estacionamento seja regularmente utilizada por aeronaves que
  iniciam a virada em posições distintas, pode-se empregar mais de uma barra de virada.

  6.2.1.3.5 Quando houver mais de uma barra de virada na mesma posição de estacionamento,
  elas devem ser codificadas com uma sinalização horizontal de identificação, conforme exemplificado
  na Figura 11. No entanto, se a distância entre eixos de duas barras de virada for menor
  que 3 metros, somente a barra de virada referente à aeronave crítica que utiliza a posição
  deve permanecer.


  Figura 11 - Codificação de barras de virada'
