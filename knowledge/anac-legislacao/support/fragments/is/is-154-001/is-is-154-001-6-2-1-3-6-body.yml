text: '6.2.1.3.6 As características da sinalização horizontal de identificação de barra de
  virada estão dispostas no item 6.2.4.2 desta IS.

  6.2.1.4 A linha de virada guia o piloto quando da entrada na posição de estacionamento e/ou
  saída dela por meios próprios, de forma a manter distâncias seguras em relação aos obstáculos.
  O raio de curvatura deve estar de acordo com a envergadura da aeronave crítica à qual a
  posição de estacionamento é destinada.

  6.2.1.4.1 As aeronaves devem percorrer uma linha reta de, no mínimo, 3 metros depois de
  acabarem a manobra de virada de entrada ou antes de iniciarem a manobra de virada de saída,
  a fim de minimizar os esforços sobre o trem de pouso de nariz, conforme Figura 12.


  Figura 12 - Linha de virada

  6.2.1.5 A barra de alinhamento auxilia o piloto a alinhar a aeronave ao final da manobra
  de estacionamento e, também, quando movida por meios próprios, antes de deixar a posição
  de estacionamento.

  6.2.1.5.1 Recomenda-se o uso de barra de alinhamento em posições de estacionamento utilizadas
  por aeronaves de código E e F ou em posições em que a aeronave entra ou das quais a aeronave
  sai por meios próprios, conforme exemplos (a) e (b), respectivamente, da Figura 13.'
