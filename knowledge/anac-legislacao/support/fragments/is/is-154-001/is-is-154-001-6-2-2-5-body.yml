text: '6.2.2.5 O item 6.4.1 desta IS indica a configuração das luzes de eixo de pista de táxi
  para as taxilanes alternativas.

  6.2.3 [Recomendação] - Uma sinalização horizontal de borda de pátio, conforme Figura 29,
  deve ser empregada para delimitar a borda de um pátio de aeronaves ou de uma pista de táxi
  de pátio, quando a borda do pavimento com capacidade de suporte não puder ser facilmente
  distinguida da superfície ao redor.


  Figura 29 - Sinalização horizontal de borda de pátio de aeronaves

  6.2.3.1 Adicionalmente, quando o pátio de aeronaves possuir acostamento sem capacidade de
  suporte, faixas transversais devem ser empregadas, como demonstrado na Figura 30. A largura
  das faixas deve ser igual a 0,9 metro e o comprimento deve ser igual a 7,5 metros ou igual
  à largura do acostamento menos 1,5 metro, o que resultar na menor medida. O espaçamento
  entre elas deve ser, no máximo, 30 metros em trechos retilíneos e, no máximo, 15 metros
  em trechos curvos.


  Figura 30 - Sinalização de acostamento de pátio sem capacidade de suporte'
