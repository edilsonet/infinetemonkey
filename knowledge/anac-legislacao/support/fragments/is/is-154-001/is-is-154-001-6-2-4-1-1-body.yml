text: '6.2.4.1.1 As dimensões da sinalização de designação da posição de estacionamento devem
  estar de acordo com a Figura 31 e a Tabela 5.


  Figura 31 - Sinalização de designação da posição de estacionamento


  Tabela 5 - Dimensões da sinalização de designação da posição de estacionamento. Dimensões
  A B C Valores (m) 4 5 0,5 3 4 0,5


  6.2.4.1.2 A sinalização de designação da posição de estacionamento pode ou não ser situada
  sobre o eixo da linha de entrada, conforme exemplos (a) e (b), respectivamente, da Figura
  32. Em qualquer um dos casos, deve-se garantir que ela seja visível da posição do piloto
  à esquerda quando a aeronave estiver corretamente estacionada.


  Figura 32 - Localização da sinalização de designação da posição de estacionamento sem linha
  de parada.

  6.2.4.2 A sinalização horizontal de identificação de barra de virada e de linha de parada
  indica o tipo de aeronave a que corresponde cada barra de virada ou linha de parada, quando
  houver mais de uma.'
