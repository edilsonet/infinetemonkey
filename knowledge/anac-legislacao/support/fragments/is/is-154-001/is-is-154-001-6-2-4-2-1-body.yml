title: As dimensões dessa sinalização devem estar de acordo com a Figura 33.
text: '6.2.4.2.1 As dimensões dessa sinalização devem estar de acordo com a Figura 33.


  Figura 33 - Sinalização horizontal de identificação de barra de virada e de linha de parada.

  6.2.4.3 As sinalizações horizontais de localização de “STOP” e de “MAX SPAN”, cujas aplicações
  são explicadas nos itens 6.2.1.6.3 e 6.2.2.3, respectivamente, desta IS, devem seguir as
  dimensões apresentadas nas Figura 34 e 35.


  Figura 34 - Sinalização horizontal de localização de “STOP”


  Figura 35 - Sinalização horizontal de localização de "MAX SPAN"

  6.2.4.4 A sinalização horizontal de frequência de comunicação indica ao piloto que a frequência
  de comunicação deve ser trocada a partir de certo ponto do pátio, como, por exemplo, quando
  se sai da área de atuação da torre de controle e entra na área de controle de pátio (Apron
  Control). Essas fronteiras devem ser estabelecidas com uma sinalização horizontal de posição
  intermediária de espera - de acordo com o parágrafo 154.303(k) do RBAC nº 154 -, como exemplificado
  na Figura 36.


  Figura 36 - Sinalização horizontal de frequência de comunicação

  6.2.4.5 As sinalizações horizontais de direção de posição de estacionamento indicam ao piloto
  a direção que deve ser tomada para acessar a posição de estacionamento designada para parada
  da aeronave. Essa sinalização pode indicar uma posição de estacionamento específica ou um
  conjunto de posições, conforme exemplos (a) e (b), respectivamente, da Figura 37.


  Figura 37 - Sinalizações horizontais de direção de posição de estacionamento'
