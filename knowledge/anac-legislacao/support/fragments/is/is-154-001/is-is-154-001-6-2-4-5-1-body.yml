text: '6.2.4.5.1 Essas sinalizações devem ser dispostas antes do início da manobra para acesso
  à direção desejada, como na Figura 38.


  Figura 38 - Localização das sinalizações horizontais de direção de posição de estacionamento

  6.2.4.6 A sinalização horizontal de direção de “MAX SPAN” indica a envergadura máxima permitida
  na pista de táxi a ser acessada na direção indicada. Essa sinalização deve ser disposta
  antes do início da manobra para acesso à direção desejada. A Figura 39 indica as dimensões
  da sinalização horizontal de direção de “MAX SPAN” e a Figura 40 indica a localização.


  Figura 39 - Sinalização horizontal de direção de “MAX SPAN”


  Figura 40 - Localização da sinalização horizontal de direção de “MAX SPAN”

  6.2.5 [Recomendação 154.307(c)] - De modo a facilitar a identificação da posição de estacionamento,
  recomenda-se o emprego de sinalização vertical de designação de posição de estacionamento,
  sobretudo nas posições atendidas por ponte de embarque.'
