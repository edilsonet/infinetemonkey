cite: 6.2.4(a)
title: 6.2.4(a)
text: (a) De localização, as quais são constituídas por caracteres amarelos sobre fundo preto
  e, quando necessário para dar contraste, borda amarela. Incluem sinalização de designação
  da posição de estacionamento, de identificação de barra de virada e de linha de parada,
  de “STOP”, de “MAX SPAN” e de frequência de comunicação.
