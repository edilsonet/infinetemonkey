cite: 6.2.4(b)
title: 6.2.4(b)
text: '(b) De direção, as quais são constituídas por caracteres pretos sobre fundo amarelo
  e, quando necessário para dar contraste, borda preta. Incluem sinalização de direção de
  posições de estacionamento e de “MAX SPAN”.

  6.2.4.1 A sinalização horizontal de designação da posição de estacionamento é utilizada
  para confirmar ao piloto que ele está na posição correta. Preferencialmente, essa informação
  deve constar em uma sinalização vertical, disposta conforme o item 6.2.5 desta IS. Quando
  o emprego da sinalização vertical não for possível, ou quando for necessária sua complementação,
  deve-se incorporar a sinalização horizontal.'
