text: '6.2.5.2 Opcionalmente, as coordenadas da posição de estacionamento podem ser incluídas,
  conforme Figura 41.


  Figura 41 - Sinalização vertical de designação de posição de estacionamento com e sem coordenadas

  6.2.5.3 Essa sinalização de localização deve ser posicionada de modo a ser claramente visível
  da cabine de uma aeronave estacionada na posição de estacionamento identificada.

  6.2.5.4 Em posições de estacionamento nas quais as aeronaves ficam de frente para o terminal
  de passageiros (posições do tipo nose in), essa sinalização pode ser apoiada na estrutura
  do terminal, como no exemplo da Figura 42.


  Figura 42 - Sinalização vertical de designação de posição de estacionamento posicionada
  no terminal de passageiros'
