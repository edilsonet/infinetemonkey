title: Essa sinalização pode ser utilizada em conjunto com um sistema avançado de orientação
  visual de estacionamento.
text: '6.2.5.5 Essa sinalização pode ser utilizada em conjunto com um sistema avançado de
  orientação visual de estacionamento.

  6.3. Sinalização horizontal e vertical para veículos

  6.3.1 [FC 154.303(n)] - As linhas de segurança de pátios de aeronaves delimitam as áreas
  de movimentação das aeronaves em pistas de táxi de pátio e pistas de táxi de acesso ao estacionamento
  de aeronaves, separando-as das áreas que são destinadas a outros propósitos e que podem
  conter obstáculos para as aeronaves, como, por exemplo, as posições de estacionamento de
  aeronaves e as áreas para guarda de equipamentos, como ilustrado na Figura 43. Usualmente,
  as linhas de segurança demarcam os limites entre as áreas sob responsabilidade do operador
  aeroportuário e as áreas sob responsabilidade do controle de tráfego local (torre ou, quando
  houver, apron control).


  Figura 43 - Linhas de segurança de pátio

  6.3.1.1 A linha de segurança deve ter, no mínimo, 10 centímetros de largura. No entanto,
  recomenda-se que ela tenha 30 centímetros de largura e, quando necessário, contorno de acordo
  com item 6.1.6 desta IS.

  6.3.2 [Recomendação] - As linhas de restrição delimitam as áreas que devem permanecer livres
  de pessoas, veículos ou equipamentos (“envelope”) durante a manobra da aeronave, por meios
  próprios ou não, para entrada na posição, ou após a partida dos motores para saída da posição.
  A delimitação dessas áreas deve garantir os espaçamentos mínimos entre aeronaves e objeto
  de acordo com a aeronave crítica à qual se destina a posição de estacionamento, conforme
  Tabela C-7 do RBAC nº 154. Deve-se atentar, também, para as áreas de segurança necessárias
  para proteção dos motores das aeronaves, de acordo com diretrizes estabelecidas pelos fabricantes
  de aeronaves.

  6.3.2.1 A linha de restrição deve ter, no mínimo, 10 centímetros de largura. No entanto,
  recomenda-se que ela tenha 15 centímetros de largura e, quando necessário, contorno de acordo
  com o item 6.1.6 desta IS.

  6.3.2.2 Em posições de estacionamento das quais as aeronaves possam sair por meios próprios,
  pode-se delimitar áreas para posicionamento temporário de pessoas, equipamentos e veículos.
  Essas áreas devem estar de acordo com o item 6.3.2 desta IS.

  6.3.2.3 Nos casos citados no item acima, a linha de restrição deve ser interrompida e nas
  cores vermelha e branca, de acordo com a Figura 44. Já a Figura 45 e a Figura 46 ilustram
  a situação mencionada.


  Figura 44 - Linha de restrição para áreas para posicionamento temporário de pessoas, veículos
  e equipamentos


  Figura 45 - Áreas para posicionamento temporário de pessoas, veículos e equipamentos


  Figura 46 - Áreas para posicionamento temporário de pessoas, veículos e equipamentos

  6.3.2.4 Antes do início da saída da aeronave da posição de estacionamento, as áreas para
  posicionamento temporário de pessoas, veículos e equipamentos devem estar completamente
  livres.

  6.3.2.5 Quando houver sobreposição de dois conjuntos de sinalização horizontal de posição
  de estacionamento, como disposto no item 6.2.1.10 desta IS, pode ser empregada uma linha
  de restrição interrompida, conforme Figura 47, para delimitar a divisão entre as posições
  secundárias adjacentes.


  Figura 47 - Linha de restrição interrompida para delimitar divisão entre posições secundárias

  6.3.2.6 Nessas situações, as linhas de restrição interrompidas devem assegurar os critérios
  estabelecidos no item 6.3.2 desta IS para as aeronaves que utilizam as posições de estacionamento
  secundárias, como ilustrado na Figura 48.


  Figura 48 - Delimitação das áreas livres de pessoas, veículos ou equipamentos das posições
  de estacionamento secundárias

  6.3.3 [Recomendação] - Áreas nas quais o estacionamento de veículos é proibido devem ser
  demarcadas com hachura vermelha e delimitadas por linhas vermelhas nas bordas, conforme
  Figura 49.


  Figura 49 - Área de estacionamento proibido de veículos

  6.3.3.1 A área de movimentação de uma ponte de embarque e desembarque deve ser desobstruída
  e, conforme parágrafo 153.123(f) do RBAC n° 153, mantida livre de veículos, equipamentos
  e pessoas. Para tanto, essa área pode ser demarcada com a sinalização apresentada na Figura
  49.

  6.3.3.2 A posição de origem da passarela móvel de uma ponte de embarque e desembarque, que
  indica o posicionamento das suas rodas quando a ponte estiver recolhida, deve ser definida
  por um círculo, um retângulo ou outra forma que melhor se ajuste conforme Figura 50.


  Figura 50 - Demarcação da posição de origem das rodas da ponte de embarque e desembarque

  6.3.4 [Recomendação] - Demais instalações de pátio como hidrantes, aterramentos, tampas
  de poço de visita, pontos de amarração de aeronaves, entre outras, devem ser indicadas com
  um contorno vermelho, cujas dimensões dependem do tamanho da instalação, como exemplificado
  na Figura 51. Sugere-se que qualquer instalação que se projete acima do solo, como os hidrantes,
  seja pintada de vermelho.


  Figura 51 - Identificação de instalação de pátio

  6.3.5 [Recomendação] - Em posições de estacionamento em que a manobra a ser realizada pelo
  veículo de pushback ao retirar uma aeronave seja complexa ou deva ser muito precisa, pode-se
  implementar uma sinalização horizontal de guia para o condutor do veículo.

  6.3.5.1 Para evitar confusão com sinalizações horizontais para aeronaves, essa sinalização
  deve ser composta por uma linha branca interrompida e uma barra transversal, que indica
  onde o trem de pouso da aeronave deve ser posicionado antes do desacoplamento. Quando necessário
  aumentar o contraste entre a sinalização e o pavimento, deve ser utilizado contorno preto.
  A Figura 52 apresenta as dimensões e a aplicação dessa sinalização.


  Figura 52 - Linha de guia de pushback

  6.3.5.2 Essa sinalização só deve ser utilizada se realmente necessária, uma vez que o seu
  uso extensivo pode causar perda de consciência situacional. Quando empregada, a largura
  da linha de guia de pushback apresentada na Figura 52 é considerada suficiente para que
  seja visível para os motoristas dos veículos que realizam a operação. O emprego de larguras
  maiores não é recomendado, pois pode causar confusão para os pilotos.

  6.3.6 [Recomendação] - Linhas brancas contínuas podem ser utilizadas para delimitar as áreas
  nas quais veículos e equipamentos podem ser estacionados livremente sem infringir as áreas
  de segurança de posições de estacionamento e pistas de táxi. A Figura 53 ilustra o uso dessa
  sinalização e a sua dimensão.

  6.3.6.1 Quando for operacionalmente necessário, a sinalização horizontal de posição de estacionamento
  de aeronaves pode ser complementada com a identificação da posição de estacionamento do
  Caminhão de Abastecimento de Aeronaves (CTA) durante a operação de abastecimento.

  6.3.6.2 A sinalização de identificação da posição de estacionamento do CTA deve estar localizada
  dentro do envelope da posição de estacionamento de aeronaves, fora da área de sombra da
  aeronave estacionada, à frente da asa esquerda da aeronave.

  6.3.6.3 A sinalização horizontal de posição de estacionamento de CTA deve incluir os elementos
  necessários para fornecer a orientação adequada para o veículo até a posição de estacionamento
  e incluir elementos tais como as linhas de afastamento de ponta de asa e linhas de contorno.'
