text: '6.3.6.4 Tal sinalização deve ser contínua em extensão e ter, no mínimo, 10 cm de largura
  na cor branca.


  Figura 53 - Área de estacionamento de equipamentos e veículos

  6.3.7 [Recomendação] - As vias de serviço em pátios de aeronaves devem ser demarcadas por
  sinalizações horizontais brancas. A largura de cada faixa de uma via de serviço deve ser
  suficiente para acomodar o veículo mais largo que a utilizará. Salvo quando expressamente
  contrário nesta IS, as dimensões das sinalizações horizontais de vias de serviço devem estar
  de acordo com o Código de Trânsito Brasileiro.

  6.3.7.1 As linhas de eixo da via de serviço devem ser interrompidas e as linhas de borda
  de via de serviço, contínuas. Como exemplificado na Figura 54, quando a borda da via de
  serviço não puder ser atravessada, isto é, quando ela for também o limite da atividade de
  um veículo no pátio de aeronaves, deve ser utilizada linha contínua dupla, exceto quando
  a borda for adjacente a uma linha de segurança ou de restrição, como demonstrado no exemplo
  (a) da Figura 55. Quando empregada, a linha contínua dupla, o espaçamento entre as linhas
  deve ser igual à largura destas. Já quando a borda puder ser trespassada, deve ser utilizada
  linha contínua simples.


  Figura 54 - Via de serviço'
