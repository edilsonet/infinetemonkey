text: '6.3.7.2 Quando a via de serviço cruzar uma área destinada ao tráfego de aeronaves,
  a sinalização de borda deve seguir o padrão da Figura 55.


  Figura 55 - Via de serviço em área de tráfego de aeronaves

  6.3.7.3 Faixas de pedestre devem ser dispostas em vias de serviço em locais designados para
  passagem de pessoas. As suas dimensões devem estar de acordo com o Código de Trânsito Brasileiro.

  6.3.7.4 Para auxiliar os motoristas, indicações das posições de estacionamento podem ser
  incluídas nas faixas das vias de serviço que margeiam as posições de estacionamento de aeronaves,
  conforme Figura 56.


  Figura 56 - Indicação de posição de estacionamento de aeronaves em via de serviço

  6.3.7.5 As rotas definidas para movimentação de passageiros no pátio devem ser demarcadas
  por faixas azuis com bordas brancas, com indicações específicas a cada 30 metros, no máximo,
  conforme Figura 57. Tendo em vista critérios de acessibilidade, recomenda-se que essas faixas
  tenham 1,5 metro de largura.


  Figura 57 - Faixa de movimentação de passageiros

  6.3.8 [Recomendação] - Sinalizações horizontais de informação para os motoristas de veículos
  e equipamentos podem ser dispostas nas vias de serviço. As indicações de “PARE”, dê a preferência,
  limite de velocidade, curva obrigatória, entre outras, devem seguir as disposições do Código
  de Trânsito Brasileiro. Especificamente para pátios de aeronaves, podem ser utilizadas as
  sinalizações da Figura 58.


  Figura 58 - Sinalizações de informação para motoristas de veículos e equipamentos

  6.3.8.1 A sinalização (a) da Figura 58 indica atenção ao cruzamento de aeronaves e deve
  ser colocada em vias de serviço antes do cruzamento de pistas de táxi de pátio ou pistas
  de táxi de acesso ao estacionamento de aeronaves, como exemplificado na Figura 59.

  6.3.8.2 Já a sinalização (b) da Figura 58 indica ao motorista o perigo de jet blast em um
  determinado trecho. Ela deve ser disposta em situações apropriadas, como em vias de serviço
  que passam atrás de posições de estacionamento de aeronaves, como exemplificado na Figura
  59.


  Figura 59 - Exemplo de uso das sinalizações horizontais de informação para motoristas de
  veículos e equipamentos

  6.3.9 [Recomendação] - Todas as sinalizações horizontais mencionadas no item 6.3.8 desta
  IS devem, sempre que possível, ser complementadas por sinalizações verticais de mesmo conteúdo.

  6.4. Sinalização luminosa para aeronaves

  6.4.1 [Recomendação 154.305(w)] - Recomenda-se que a sinalização luminosa de eixo de táxi
  das pistas de táxi de acesso ao estacionamento de aeronaves (taxilanes) alternativas de
  cores diferentes do amarelo, conforme item 6.2.2 desta IS, seja composta por luzes verdes
  alternadas com luzes da mesma cor da sinalização horizontal (azul ou laranja), conforme
  Figura 60.


  Figura 60 - Luzes de eixo de taxilanes alternativas'
