text: '6.4.1.1 O posicionamento dessas luzes deve estar de acordo com os parágrafos 154.305(w)(1)(iii)
  e 154.305(w)(2)(i) do RBAC n° 154.

  6.4.2 [FC 154.305(ff)] - As luzes de orientação de manobras de estacionamento de aeronaves
  são luzes embutidas no pavimento para indicar, em uma posição de estacionamento, as linhas
  de entrada, virada e saída e a posição de parada.'
