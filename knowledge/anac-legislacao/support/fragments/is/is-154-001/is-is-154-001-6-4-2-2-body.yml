text: '6.4.2.2 Em posições atendidas por sinaleiro ou por sistema de orientação visual de
  estacionamento, a luz indicadora de posição de parada pode ser omitida.

  6.4.2.3 Recomenda-se que o circuito de iluminação dessa sinalização seja projetado de modo
  a permitir que as luzes sejam ligadas para indicar que uma posição de estacionamento pode
  ser utilizada e desligadas para indicar que ela não pode ser utilizada, conforme ilustrado
  na Figura 62.


  Figura 62 - Sistema de luzes de orientação de manobras de estacionamento de aeronaves

  6.5. Exemplos de configuração de pátio de aeronaves

  6.5.1 As figuras a seguir apresentam exemplos de aplicação dos elementos de sinalização
  horizontal apresentados nesta IS. Os exemplos, no entanto, não são exaustivos e não apresentam
  todas as combinações e aplicações possíveis.


  Figura 63 - Exemplo 1


  Figura 64 - Exemplo 2


  Figura 65 - Exemplo 3'
