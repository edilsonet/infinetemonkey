text: 'DISPOSIÇÕES FINAIS

  7.1. Os casos omissos serão dirimidos pela ANAC.

  7.2. Esta IS entra em vigor em 17 de julho de 2026.

  Referências bibliográficas

  ACI, Airports Council International. Apron Markings and Signs Handbook. Geneve, Switzerland,
  Third Edition, 2017.

  AENA, Aeropuertos Españoles y Navegación Aérea. Manual Normativo de Señalización en el Área
  de Movimiento. Barcelona, España, Edición 2006.'
