title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1. Os casos omissos serão dirimidos pela ANAC.

  7.2. Esta IS entra em vigor em 17 de julho de 2026.

  Referências bibliográficas

  FAA, Federal Aviation Administration. Advisory Circular (AC) 150/5300-13A - Airport Design.
  February 2014.

  FAA, Federal Aviation Administration. Advisory Circular (AC) 150/5320-6F - Airport Pavement
  Design and Evaluation. October 2016.

  ICAO, International Civil Aviation Organization. Annex 14 to the Convention on International
  Civil Aviation, Aerodromes - Volume I, Aerodrome Design and Operations. Montréal, Quebec,
  Canada, Eighth Edition, July 2018.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  1 - Runways. Montréal, Quebec, Canada, Third Edition, 2006.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  2 - Taxiways, Aprons and Holding Bays. Montréal, Quebec, Canada, Fifth Edition, 2020.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  3 - Pavements. Montréal, Quebec, Canada, Third Edition, 2017.'
