title: Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos -
  para o melhor entendimento do conteúdo do RBAC e desta IS;
text: '5.1.5 Os demais itens trazem orientações e esclarecimentos - algumas vezes com exemplos
  - para o melhor entendimento do conteúdo do RBAC e desta IS;

  5.1.6 As Figuras contidas nesta IS têm caráter exemplificativo e visam a auxiliar o entendimento
  deste documento, bem como dos requisitos do RBAC nº 154 aqui abordados.

  auxílios visuais em pistas de pouso e decolagem e pistas de táxi

  6.1. Generalidades

  6.1.1. A metodologia aplicada nesta IS adotou, com as devidas adaptações, o que consta no
  Anexo 14 à Convenção de Chicago e nas Partes 1, 2 e 4 do DOC 9157 da Organização da Aviação
  Civil Internacional (OACI), além das Advisory Circular (AC) nº 150/5300-13B, nº 150/5340-1M,
  nº 150/5340-18G e nº 150/5340-30J da Federal Aviation Administration (FAA).

  6.2. Indicadores e dispositivos de sinalização

  6.2.1. [FC 154.301(a)(3)(ii)] - O cone do indicador de direção de vento deve ter comprimento
  não inferior a 3,6 metros. Na maior extremidade, deve ter diâmetro não inferior a 0,9 metro
  e, na menor extremidade, diâmetro não inferior a 0,25 metro, conforme Figura 1.

  6.2.2. [Recomendação 154.301(a)(3)(iii)] - A cor do cone do indicador de direção de vento
  deve ser branca ou laranja, e a escolha deve depender da cor que melhor contrastar com o
  fundo.

  6.2.2.1. Quando for necessário aumentar o contraste em relação ao fundo, pode-se utilizar
  combinação de duas cores. Nesse caso, utilizam-se as cores laranja e branco, vermelho e
  branco ou preto e branco. Elas devem ser organizadas em cinco faixas alternadas, com a primeira
  e a última faixa na cor mais escura, conforme Figura 1.


  Figura 1 - Cores e dimensões do indicador de direção de vento.

  6.3. Sinalização horizontal

  6.3.1. [FC 154.303(b)(3)(iii)] - Quando a designação da pista de pouso e decolagem for incluída
  na sinalização horizontal de cabeceira, deve ter as dimensões demonstradas na Figura 2.


  Figura 2 - Dimensões da sinalização horizontal de designação da pista de pouso e decolagem
  quando incluída na sinalização horizontal de cabeceira.


  6.3.2. [Recomendação 154.303(c)(3)(i)] - A extensão das faixas da sinalização horizontal
  de eixo de pista de pouso e decolagem e dos intervalos entre elas devem ser constantes.
  No entanto, em uma das extremidades da pista, para acomodar a sinalização horizontal de
  eixo ao espaço disponível, o comprimento da faixa pode ser reduzido, conforme demonstrado
  na Figura 3.


  Figura 3 - Sinalização horizontal de eixo de pista de pouso e decolagem.


  6.3.3. A Figura 4 esclarece sobre a extensão lateral das faixas da sinalização horizontal
  de cabeceira, conforme disposto no parágrafo 154.303(d)(3)(ii) do RBAC nº 154.


  Figura 4- Extensão lateral das faixas da sinalização horizontal de cabeceira.


  6.3.4. [Recomendação 154.303(d)(4)(i)] - Quando a pista de pouso e decolagem for precedida
  por plataforma contra os efeitos da exaustão de gases proveniente dos motores das aeronaves
  (blast pad), por zona de parada (stopway) ou por área pavimentada não adequada para o uso
  normal por aeronaves, uma faixa transversal deve ser adicionada à sinalização horizontal
  de cabeceira, conforme Figura 18.

  6.3.4.1. A Figura 5 ilustra a utilização da faixa transversal em caso de pistas que possuem
  cabeceira deslocada precedida por plataforma contra os efeitos da exaustão de gases proveniente
  dos motores das aeronaves (blast pad), por zona de parada (stopway) ou por área pavimentada
  não adequada para o uso normal por aeronaves.


  Figura 5 - Pista de pouso e decolagem com blast pad ou zona de parada e cabeceira deslocada.


  6.3.5. [FC 154.303(d)(5)(i)] - Seta com comprimento reduzido não deve ser utilizada se o
  final da pista de pouso e decolagem não dispuser de espaço suficiente para uma seta completa,
  conforme Figura 6.


  Figura 6 - Setas de sinalização horizontal de cabeceira deslocada.


  6.3.6. [FC 154.303(f)(2)(ii)] - Quando adotado o padrão demonstrado na Figura D-5 (B) do
  RBAC nº 154 e quando o comprimento disponível para pouso não for suficiente para dispor
  os seis pares de sinalização horizontal de zona de toque, deve-se remover os conjuntos de
  pares a partir da cabeceira em direção ao centro da pista, conforme Tabela 1 e Figura 7.

  6.3.6.1. Se um dos pares da sinalização horizontal de zona de toque coincidir ou estiver
  localizado a menos de 50 metros da sinalização horizontal de ponto de visada, deve ser apagado.


  Figura 7 - Padrão (B) da sinalização horizontal de zona de toque, de acordo com distância
  disponível para pouso.


  Tabela 1- Forma de utilização do Padrão (B) da Sinalização Horizontal de Zona de Toque

  Distância de pouso disponível

  Pares de sinalização horizontal de zona de toque

  Especificação

  Menor que 900 m

  1

  Um conjunto com um retângulo

  900 m até 1200 m, exclusive

  2

  Dois conjuntos com um retângulo

  1200 até 1500 m, exclusive

  3

  Um conjunto com dois retângulos e dois conjuntos com um retângulo

  1500 até 2400 m, exclusive

  4

  Dois conjuntos com dois retângulos e dois conjuntos com um retângulo

  2400 ou maior

  6

  Sinalização completa: dois conjuntos com três retângulos, dois conjuntos com dois retângulos
  e dois conjuntos com um retângulo


  6.3.7. [Recomendação 154.303(g)(1)] - Quando a cabeceira da pista for deslocada, a sinalização
  horizontal de borda de pista de pouso e decolagem deve se estender pela área pavimentada
  anterior à cabeceira, especialmente quando esse trecho for usado para corrida de decolagem,
  conforme Figura 6.

  6.3.8. [FC 154.303(j)(1)] - Quando, em uma pista de táxi, a distância entre uma posição
  de espera de pista de pouso e decolagem (Padrão A) e a distância entre uma posição de espera
  de pista de pouso e decolagem que delimita a área crítica sensível do ILS/MLS (Padrão B)
  for igual ou inferior a 15 metros, somente uma das posições de espera deve ser estabelecida.
  Nesse caso, a posição de espera Padrão A deve ser instalada na posição em que seria colocada
  a posição de espera Padrão B.

  6.3.9. A Figura 8 ilustra a utilização da sinalização horizontal de posição de espera de
  pista de pouso e decolagem padrão B e dos termos “CAT II” ou “CAT III” em uma área que excede
  60 metros de largura, conforme disposto no parágrafo 154.303(j)(2)(iv) do RBAC nº 154.


  Figura 8- Sinalização horizontal de posição de espera de pista de pouso e decolagem padrão
  B em área que excede 60 metros de largura.


  6.3.10. [FC 154.303(k)(1)(ii)] - A distância da posição intermediária de espera até o eixo
  da pista de táxi interceptada, conforme Figura 9, não deve ser inferior às distâncias especificadas
  na coluna 11 da Tabela C-5 do RBAC nº 154.

  6.3.11. [FC 154.303(k)(2)] - O intervalo, em ambos os lados, entre a sinalização horizontal
  de posição intermediária de espera e a sinalização horizontal de eixo de pista de táxi deve
  ser de 0,90 metro, conforme Figura 10.


  Figura 9 - Localização da sinalização horizontal de posição intermediária de espera.


  Figura 10 - Posição intermediária de espera.


  6.3.12. [FC 154.303(p)(1)(iii)] - A sinalização horizontal de instrução obrigatória de entrada
  proibida deve ser situada no início da área em que a entrada é proibida, transversalmente
  à pista de táxi, sobre a sinalização horizontal de eixo de pista de táxi e centrada em relação
  a esta, conforme Figura 11.


  Figura 11- Localização da sinalização horizontal de instrução obrigatória


  6.3.13. [Recomendação 154.303(q)(2)] - A localização das sinalizações horizontais de informação
  (de direção ou de localização) deve observar os seguintes critérios:

  6.3.13.1. A sinalização horizontal de direção deve ser localizada no ponto de tangência
  e no lado para o qual a curva é indicada. Assim, quando indicar que a aeronave deve virar
  à direita, a sinalização horizontal de direção deve ser colocada à direita do eixo da pista
  de táxi. Quando indicar que a aeronave deve virar à esquerda, deve ser colocada à esquerda
  do eixo da pista de táxi, conforme Figura 12.

  6.3.13.2. A sinalização horizontal de localização deve ser localizada no lado esquerdo da
  pista de táxi, na direção da aeronave que se aproxima, conforme Figura 12.

  6.3.13.3. A borda lateral da sinalização horizontal de informação deve estar localizada,
  preferencialmente, a 0,9 metro do eixo da pista de táxi, conforme exemplo (a) da Figura
  12. Quando não for possível localizá-la em apenas um dos lados da pista de táxi, a sinalização
  horizontal de informação pode ser colocada sobre a sinalização horizontal de eixo de pista
  de táxi e centrada em relação a esta, conforme exemplo (b) da Figura 13.


  Figura 12 - Localização das sinalizações horizontais de informação (de direção e de localização).


  Figura 13- Localização das sinalizações horizontais de informação em relação ao eixo da
  pista de táxi.


  6.4. Luzes

  6.4.1. [FC 154.305(a)(4)(i)] - As luzes embutidas na superfície de pistas de pouso e decolagem,
  zonas de parada (stopways), pistas de táxi e pátios de aeronaves não devem se projetar mais
  de 12 milímetros em relação à superfície do pavimento.

  6.4.2. [FC 154.305(g)(2)(i)] - As luzes de um sistema de aproximação simples devem ser luzes
  de cor branca.

  6.4.3. [Recomendação 154.305(p)(2)(ii)] - Em pistas destinadas a aeronaves a jato, as luzes
  de borda de pista de pouso e decolagem devem ser situadas a 3 metros da borda da pista,
  para evitar possíveis danos causados pelo efeito de jet blast. Já em pistas não destinadas
  a aeronaves a jato, as luzes de borda de pista de pouso e decolagem devem estar situadas
  a 0,6 metro da borda da pista.

  6.4.4. [FC 154.305(p)(2)(iii)] - Quando, em interseções de pistas de aproximação por instrumento,
  o intervalo entre as luzes de borda de pista de pouso e decolagem ultrapassar o dobro do
  intervalo padrão entre as luzes, devem ser instaladas luzes embutidas no pavimento de forma
  a manter o espaçamento uniforme, conforme Figura 14.


  Figura 14- Luzes de borda de pista de pouso e decolagem.


  6.4.5. [Recomendação 154.305(p)(3)(i)(B)] - As luzes amarelas de borda de pista de pouso
  e decolagem devem ser empregadas em pistas de aproximação de precisão ou quando, devido
  ao perfil longitudinal da pista, não for possível visualizar, a partir do ponto médio, a
  sua extremidade.

  6.4.6. A Figura 15 ilustra a configuração das luzes de borda de pista de pouso e decolagem
  em caso de cabeceira recuada, conforme disposto nos parágrafos 154.305(p)(3)(i)(A) e 154.305(p)(3)(i)(B)
  do RBAC nº 154.


  Figura 15 - Configuração das luzes de borda de pista de pouso e decolagem em casos de cabeceira
  recuada.


  6.4.7. [Recomendação 154.305(s)(2)(i)] - Quando não for possível situar as luzes de eixo
  de pista de pouso e decolagem sobre o eixo da pista, elas devem ser deslocadas para o lado
  oposto ao da maioria das pistas de táxi de saída.

  6.4.8. A Figura 16 ilustra a configuração das luzes de eixo de pista de pouso e decolagem,
  conforme disposto nos parágrafos 154.305(s)(2)(i) e 154.305(s)(3)(i) do RBAC nº 154.


  Figura 16 - Luzes de eixo de pista de pouso e decolagem.


  6.4.9. A Figura 17 ilustra a configuração das luzes de zona de toque, conforme disposto
  na seção 154.305(t) do RBAC nº 154.

  6.4.10. [FC 154.305(v)(2)] - O intervalo entre as luzes de zona de parada deve ser uniforme
  e não superior ao intervalo entre as luzes de borda de pista de pouso e decolagem.

  6.4.10.1. A extremidade da zona de parada deve ser indicada por pelo menos duas luzes dispostas
  em intervalos uniformes entre o último par de luzes da zona de parada, conforme Figura 18.


  Figura 17 - Luzes de zona de toque.


  Figura 18- Luzes de zona de parada.


  6.4.11. [Recomendação 154.305(x)(2)(i)] - O espaçamento das luzes de borda de pista de táxi
  em uma curva deve ser determinado com base no raio da curva, conforme a Figura 19 e a equação
  a seguir, em que “R” representa o raio da curva e “Z” o espaçamento entre as luzes, ambos
  em metros.


  6.4.11.1. Curvas com raio inferior a 30 metros devem possuir pelo menos três luzes, incluindo
  aquelas situadas no ponto de tangência.

  6.4.11.2. Para curvas com raio superior a 300 metros, devem ser mantidos os espaçamentos
  máximos de 60 metros entre as luzes de borda de pista de táxi.


  Figura 19 - Espaçamento das luzes de borda de pista de táxi em curvas.


  6.4.12. [FC 154.305(bb)(1)(i)] - As luzes de proteção de pista, configuração A, devem ser
  usadas quando a pista de táxi possuir largura igual ou inferior a 45 metros e não possuir
  luzes de eixo de pista de táxi. Já as luzes de proteção de pista, configuração B, devem
  ser usadas quando a pista de táxi possuir largura superior a 45 metros ou possuir luzes
  de eixo de pista de táxi.

  6.4.13. [FC 154.305(bb)(2)(i)] - As luzes de proteção de pista, configuração A, devem ser
  situadas a uma distância não inferior a 3 metros e não superior a 5 metros da borda da pista
  de táxi, conforme exemplo (a) da Figura 20.

  6.4.14. [FC 154.305(bb)(2)(i)] - As luzes de proteção de pista, configuração B, devem ser
  paralelas à posição de espera de pista de pouso e decolagem e situadas a 60 centímetros
  em relação a esta, conforme exemplo (b) da Figura 20.

  6.4.14.1. Se houver conflito entre luzes de proteção de pista e juntas de pavimento rígido,
  tanto a sinalização horizontal de posição de espera de pista de pouso e decolagem quanto
  as luzes de proteção de pista devem ser movidas em direção oposta à pista de pouso e decolagem
  e o mínimo possível para resolver o conflito.


  Figura 20 - Luzes de proteção de pista.

  6.4.15 [Recomendação 154.305(gg)(1)(i)] Uma luz de posição de espera em via de serviço deve
  ser instalada em cada posição de espera que atenda a uma pista de pouso e decolagem, quando
  se pretender que tal pista seja utilizada em condições de alcance visual de pista com valores
  entre 300 m e 550 m.


  6.5. Sinalização vertical

  6.5.1. [FC 154.307(b)(1)(iii)] - Em interseções de pista de táxi com pista de pouso e decolagem,
  a sinalização vertical de designação de pista deve estar situada em ambos os lados da posição
  de espera de pista de pouso e decolagem.

  6.5.1.1. A sinalização vertical de designação de pista deve estar alinhada com a sinalização
  horizontal de posição de espera e voltada para a direção de aproximação para a pista de
  pouso e decolagem, conforme Figura 21.

  6.5.1.2. A distância entre a sinalização vertical de designação de pista e a borda da pista
  de táxi deve respeitar as dimensões especificadas na Tabela D-8 do RBAC nº 154.


  Figura 21 - Sinalização vertical em interseções de pista de táxi e pista de pouso e decolagem.


  6.5.2. O exemplo (a) da Figura 22 ilustra a utilização da sinalização vertical de pista
  livre, conforme disposto no parágrafo 154.307(c)(1)(iv) do RBAC nº 154. Essa sinalização
  pode ser instalada na parte de trás dos painéis de sinalização vertical de posição de espera
  de pista de pouso e decolagem.

  6.5.3. [Recomendação 154.307(c)(1)(xiii)] - Em interseções de pistas de táxi em “T”, podem
  ser usadas as soluções 1 ou 2 do exemplo (b) da Figura 22. Se existir tráfego de aeronaves
  no sentido da pista de táxi C para a pista de táxi A, a solução 2 possui a vantagem de permitir
  a utilização da parte de trás do painel para prover informação.


  Figura 22 - Sinalização vertical de pista livre (a) e sinalização vertical em pistas de
  táxi com interseção em "T" (b).


  6.5.4. As sinalizações verticais de direção indicam, em interseções de pistas de táxi, as
  possíveis direções a serem seguidas. Já as sinalizações verticais de destino indicam o sentido
  em que a aeronave deve seguir para se chegar a um determinado local do aeródromo, como a
  cabeceira da pista de pouso e decolagem ou o pátio de aeronaves. A Figura 23 exemplifica
  a utilização dessas sinalizações verticais, conforme disposto no parágrafo 154.307(c)(2)(ix)
  do RBAC nº 154.


  Figura 23 - Uso das sinalizações verticais de direção e de destino. À esquerda, utilização
  incorreta (em conjunto) e, à direita, utilização correta (em separado) das sinalizações
  verticais de direção e de destino.


  6.5.5. A Figura 24 ilustra a utilização da sinalização vertical de localização para pistas
  de táxi com mais de uma posição intermediária de espera, conforme disposto no parágrafo
  154.307(c)(3)(ix) do RBAC nº 154.


  Figura 24 - Sinalização vertical em pistas de táxi com mais de uma posição intermediária
  de espera.


  6.6. Balizas

  6.6.1. [FC 154.309(b)(2)] - Onde não houver luzes de pista de pouso e decolagem, as balizas
  de borda de pista de pouso e decolagem não pavimentada devem ser instaladas em ambos os
  lados da pista e uniformemente espaçadas em intervalos não superiores a 60 metros para uma
  pista para operação por instrumento e não superiores a 100 metros para uma pista de não
  instrumento. As balizas nos lados opostos devem ser equidistantes e perpendicularmente alinhadas
  em relação ao eixo da pista, conforme Figura 25.

  6.6.1.1. As extremidades da pista de pouso e decolagem devem ser demarcadas por grupos de
  três balizas dispostas em formato de “L”, conforme mostrado na Figura 25.

  6.6.1.2. Quando houver cabeceira deslocada, o início da porção da pista disponível para
  pouso deve ser demarcado por fileiras de três balizas dispostas perpendicularmente ao eixo
  da pista, conforme mostrado na Figura 25.


  Figura 25 - Localização das balizas de borda de pista de pouso e decolagem e borda de pista
  de táxi não pavimentadas.

  6.6.2. [FC 154.309(b)(3)] - Balizas cônicas com 50 centímetros de altura devem ter base
  com diâmetro de 75 centímetros. Para balizas com altura inferior a 50 centímetros, a mesma
  proporção deve ser mantida.

  6.6.2.1. As balizas de borda de pista de pouso e decolagem não pavimentada planas e cônicas
  devem ter cor branca. Quando for necessário aumentar o contraste com a superfície ao redor,
  podem ser acrescentadas faixas na cor preta, alternadas com as faixas brancas. As faixas
  brancas e pretas devem ter a mesma largura, conforme exemplo (b) da Figura 26 e da Figura
  27.


  Figura 26 - Balizas cônicas de borda de pista de pouso e decolagem e borda de pista de táxi
  não pavimentadas.


  Figura 27 - Balizas planas de borda de pista de pouso e decolagem não pavimentada.

  6.6.3. [FC 154.309(d)(3)(iii)] - As balizas de borda de pista de táxi devem ter altura máxima
  de 50 cm.

  6.6.4. [FC 154.309(f)(2)] - Onde não houver luzes de pista de táxi, as balizas de borda
  de pista de táxi não pavimentada devem ser instaladas em ambos os lados da pista de táxi
  e uniformemente espaçadas em intervalos não superiores a 60 metros. As balizas nos lados
  opostos devem ser equidistantes e perpendicularmente alinhadas em relação ao eixo da pista,
  conforme Figura 25.

  6.6.4.1. O início da pista de táxi, tanto a partir da pista de pouso e decolagem quanto
  a partir do pátio de aeronaves, deve ser demarcado por grupos de três balizas dispostas
  em formato de “L”, conforme Figura 25.

  6.6.4.2. As balizas devem ter formato cônico, com altura de até 50 centímetros.

  6.6.4.3. Para balizas com altura de 50 centímetros, a base deve ter diâmetro de 75 centímetros.
  Para balizas com altura inferior a 50 centímetros, a mesma proporção deve ser seguida.

  6.6.4.4. As balizas de borda de pista de táxi não pavimentada devem ser amarelas. Quando
  for necessário aumentar o contraste com a superfície ao redor, pode ser acrescentada faixa
  na cor preta, conforme exemplo (d) da Figura 26.

  6.7. Superfícies sem capacidade de suporte

  6.7.1. [Recomendação 154.403(c)] - Em interseções de pistas de táxi ou em outras áreas onde
  puder haver confusão entre a pista de táxi e o acostamento pavimentado, sem capacidade de
  suporte, recomenda-se o emprego de faixas transversais, como demonstrado na Figura 28.

  6.7.1.1. A cor das faixas deve ser amarela.

  6.7.1.2. A largura das faixas deve ser igual a 0,9 metro e o comprimento deve ser igual
  a 7,5 metros ou igual à largura do acostamento menos 1,5 metro, o que resultar na menor
  medida.

  6.7.1.3. O espaçamento entre elas deve ser, no máximo, 30 metros em trechos retilíneos e,
  no máximo, 15 metros em trechos curvos.


  Figura 28 - Faixas transversais em superfícies sem capacidade de suporte.'
