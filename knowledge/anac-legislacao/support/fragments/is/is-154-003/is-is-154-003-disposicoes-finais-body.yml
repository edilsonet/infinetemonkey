text: 'DISPOSIÇÕES FINAIS

  7.1. Os casos omissos serão dirimidos pela ANAC.

  Referências bibliográficas

  AENA, Aeropuertos Españoles y Navegación Aérea. Manual Normativo de Señalización en el Área
  de Movimiento. Barcelona, España, Edición 2006.

  CASA, Civil Aviation Safety Authority. Part 139 (Aerodromes) Manual of Standards 2019. August
  2020.

  CASA PNG, Civil Aviation Safety Authority Papua New Guinea. Advisory Circular (AC) 139-6.
  Aerodrome design, Aeroplanes at or below 5700 kg MCTOW. February 2015.

  ICAO, International Civil Aviation Organization. Annex 14 to the Convention on International
  Civil Aviation, Aerodromes - Volume I, Aerodrome Design and Operations. Montréal, Quebec,
  Canada, Eighth Edition, July 2018.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  1 - Runways. Montréal, Quebec, Canada, Fourth Edition, 2020.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  2 - Taxiways, Aprons and Holding Bays. Montréal, Quebec, Canada, Fifth Edition, 2020.

  ICAO, International Civil Aviation Organization. Doc 9157 - Aerodrome Design Manual, Part
  4 -Visual Aids. Montréal, Quebec, Canada, Fifht Edition, 2021.

  FAA, Federal Aviation Administration. Advisory Circular (AC) 150/5300-13B - Airport Design.
