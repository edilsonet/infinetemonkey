title: Generalidades
text: 'Generalidades

  O método ACR-PCR é aplicável em pavimentos destinados a pouso e decolagem de aeronaves com
  peso de rampa superior a 5.700 kg.

  A resistência de pavimentos destinados a aeronaves com peso de rampa igual ou inferior a
  5.700 kg deve ser definida por meio do peso máximo permitido da aeronave e da pressão máxima
  permitida dos pneus.

  Considera-se Índice de Classificação de Aeronave - ACR o número que expressa o efeito relativo
  de uma aeronave sobre um pavimento para uma categoria padrão de subleito especificada.

  O ACR varia de acordo com o peso e a configuração da aeronave (tipo de trem-de-pouso, pressão
  de pneu, entre outros), o tipo de pavimento e a resistência do subleito.

  Considera-se Índice de Classificação de Pavimento - PCR o número que expressa a capacidade
  de suporte de um pavimento.

  O método ACR-PCR tem por finalidade a aferição da resistência do pavimento em função das
  características da aeronave (expressa pelo ACR) e do pavimento (expressa pelo PCR), sendo
  estruturado de maneira que um pavimento com um determinado valor de PCR seja capaz de suportar,
  sem restrições, uma aeronave que tenha um valor de ACR inferior ou igual ao valor do PCR
  do pavimento, obedecidas as limitações relativas à pressão dos pneus.

  [FC 154.111(b)(1)] Instruções para determinação do ACR

  O procedimento de determinação do ACR envolve as seguintes etapas:

  Dada uma aeronave, determina-se uma estrutura capaz de suportar a carga oriunda da aeronave
  de projeto;

  Uma vez obtida a espessura do pavimento, determina-se qual a carga isolada que, com pressão
  de 1,50 MPa nos pneus, é capaz de demandar a mesma espessura de pavimento determinada no
  dimensionamento, etapa anterior, considerando-se 36.500 passagens da aeronave sobre o pavimento.
  É o que se chama de Derived Single Wheel Load (DSWL);

  O valor numérico do ACR é duas vezes a carga determinada na etapa anterior.

  Com relação aos pavimentos rígidos, considera-se uma tensão padronizada de 2,75 MPa na fibra
  inferior da placa de concreto. Importante destacar que a tensão utilizada para avaliação
  da capacidade de suporte de pavimentos rígidos não possui relação com a tensão padrão utilizada
  no procedimento de dimensionamento desse tipo de estrutura.

  [Recomendação] Os valores de ACR podem ser obtidos utilizando-se o programa ICAO-ACR, também
  integrado no programa FAARFIELD, da FAA.

  [FC 154.111(b)(1)] Instruções para determinação e apresentação do PCR

  A determinação do PCR deve ser realizada a partir de um dos seguintes métodos:

  Método de avaliação técnica: utilizado quando for conhecida, de forma confiável, a estrutura
  do pavimento e uma análise das tensões e deformações tiver sido realizada. As avaliações
  estruturais dos pavimentos com foco na determinação do PCR devem ser conduzidas de modo
  a se obter as informações sobre as espessuras das camadas e materiais constituintes, o módulo
  de elasticidade de cada camada, incluindo o módulo do subleito, e o coeficiente de Poisson
  de cada camada. O PCR é calculado de modo que haja compatibilidade entre o projeto e a operação
  do mix de aeronaves ao longo da vida útil definida; ou

  Método da aeronave: utilizado quando as informações disponíveis sobre o solo (espessura
  das camadas ou características) não forem confiáveis ou forem desconhecidas. Nesse caso,
  avaliam-se as aeronaves que até então tenham operado no aeródromo sem que danos à estrutura
  tenham sido associados. O resultado da avaliação nada mais é que a seleção do maior ACR
  que operou no pavimento sem que danos à estrutura tenham sido identificados. Com isso, o
  PCR será o maior ACR encontrado.

  O método de avaliação técnica para determinação do PCR envolve as seguintes etapas:

  Definição da aeronave mais exigente (maior CDF);

  Considerando apenas a aeronave mais exigente, encontrar o número de partidas anuais que
  corresponda ao CDF total do mix de aeronaves;

  Alterar o peso bruto de táxi (gross taxi weigth) da aeronave mais exigente, de modo que
  o CDF iguale-se à 1,00;

  Encontrar o ACR da aeronave mais exigente para o peso bruto de táxi (gross taxi weigth)
  determinado na etapa anterior;

  Comparar o ACR da aeronave mais exigente com os demais ACR das aeronaves do mix. Caso alguma
  aeronave do mix apresente ACR superior ao encontrado na etapa anterior, a aeronave mais
  exigente ora analisada será desconsiderada e, então, a segunda aeronave mais exigente deve
  fazer parte do cálculo, repetindo-se as etapas até aqui mostradas;

  O valor do PCR é o maior valor de ACR encontrado, após as iterações necessárias.

  [Recomendação] Os valores de PCR pelo método de avaliação técnica também podem ser obtidos
  utilizando-se o programa FAARFIELD da FAA.

  O PCR de um pavimento é apresentado por meio de código que utiliza, nesta ordem, os seguintes
  elementos:

  valor numérico do PCR;

  tipo de pavimento;

  resistência do subleito;

  pressão máxima admissível dos pneus; e

  método de avaliação.

  O valor numérico do PCR é uma indicação da capacidade de suporte de um pavimento em termos
  de uma carga de roda simples padrão, a uma pressão de pneus normalizada.

  O valor numérico do PCR deve ser determinado como múltiplo de 10 imediatamente superior
  ao resultado obtido. Para pavimentos de resistência variável, o valor numérico de PCR deve
  ser o correspondente ao segmento com menor resistência do pavimento.

  O método de determinação do valor numérico do PCR considera pressão de 1,50 MPa para os
  pneus, a tensão padronizada de 2,75 MPa na fibra inferior da placa de concreto para pavimentos
  rígidos e quatro categorias de resistência de subleito, conforme apresentado na Tabela 6.3-1.

  O tipo de pavimento deve ser classificado:

  Pelo código “R”, para pavimentos rígidos; ou

  Pelo código “F”, para pavimentos flexíveis.

  A resistência do subleito deve ser classificada pelo código correspondente da coluna [4]
  da Tabela 6.3-1, para pavimentos flexíveis e rígidos.

  Tabela 6.3-1 - Valores de resistência de subleito para aplicação do método ACR-PCR em pavimentos
  flexíveis e rígidos

