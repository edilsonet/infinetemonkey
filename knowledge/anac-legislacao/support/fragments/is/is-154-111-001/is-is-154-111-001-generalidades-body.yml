  No cálculo do PCR pelo método ACR-PCR poderão ser utilizados ensaios previamente existentes,
  desde que estes tenham sido conduzidos no período de 60 (sessenta) meses anteriores à data
  do cálculo do PCR.

  O método de avaliação do PCR deve ser classificado:

  Pelo código “T”, se adotado o método de avaliação técnica; ou

  Pelo código “U”, se adotado o método da aeronave.'
