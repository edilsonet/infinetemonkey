  A pressão dos pneus deve ser classificada pelo código correspondente da coluna [2] da Tabela
  6.3-2, para pavimentos flexíveis e rígidos.

  Tabela 6.3-2 - Código de pressão dos pneus para aplicação do método ACR-PCR

