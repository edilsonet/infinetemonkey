text: 'OBJETIVO

  Esta Instrução Suplementar - IS orienta quanto ao método ACR-PCR, utilizado para estabelecer
  a resistência de pavimentos destinados a aeronaves de mais de 5.700 kg, referido na Seção
  154.111 do Regulamento Brasileiro de Aviação Civil - RBAC nº 154.'
