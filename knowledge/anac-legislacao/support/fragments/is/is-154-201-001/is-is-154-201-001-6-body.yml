title: CRITÉRIOS DE PROJETO PARA RANHURAS TRANSVERSAIS (GROOVING) EM
text: '6. CRITÉRIOS DE PROJETO PARA RANHURAS TRANSVERSAIS (GROOVING) EM

  PAVIMENTOS AEROPORTUÁRIOS

  6.1. [FC 154.201(h)(2)] - Além de perpendiculares ao eixo da pista de pouso e decolagem,
  as

  ranhuras devem ser projetadas de acordo com as especificações apresentadas na Tabela 1.

  Tabela 1 - Especificações para o projeto de ranhuras transversais (grooving) em pavimentos
  aeroportuários.

  # ELEMENTO ESPECIFICAÇÃO

  Grooving em pista de pouso e decolagem

  1 Largura da ranhura transversal 6 mm

  1.1 Tolerância - 0 mm, + 1,6 mm

  1.2 Resultado 6 mm - 7,6 mm

  2 Profundidade da ranhura transversal 6 mm

  2.1 Tolerância - 1,6 mm, + 1,6 mm

  2.2 Resultado

  4,4 mm - 7,6 mm

  (Obs.: pelo menos 60% das ranhuras

  transversais devem possuir profundidade

  maior ou igual a 6 mm).

  3 Distância entre as ranhuras transversais 38 mm

  3.1 Tolerância - 3 mm, + 0 mm

  3.2 Resultado 35 mm - 38 mm

  4 Distância entre as extremidades das

  ranhuras e a borda da pista

  No máximo 3 metros.

  (recomenda-se 1 metro)

  5 Distância entre a extremidade (início/fim)

  da pista e a primeira/última ranhura

  No máximo 3 metros.

  (recomenda-se 1 metro)

  6 Alinhamento das ranhuras

  Variação máxima de 8 cm no

  alinhamento para um comprimento de

  25 metros ao longo da pista.

  Realinhar a cada 150 metros de

  extensão.

  7 Distância em relação às juntas de concreto

  em pavimentos rígidos Mínimo de 8 cm e máximo de 20 cm.

  8 Distância em relação às fiações e às luzes

  embutidas Mínimo de 15 cm e máximo de 45 cm.Data de emissão: 19 de fevereiro de 2021.

  Revisão A

  6.1.1. A Figura 1 ilustra a geometria da ranhura transversal, conforme as especificações

  estabelecidas na tabela 1:

  Figura 1 - Dimensões das ranhuras transversais (grooving).

  6.1.2. Em interseções entre pistas de pouso e decolagem, as ranhuras devem ser perpendiculares

  ao eixo da pista de pouso e decolagem principal. A definição da pista principal depende,

  nessa ordem:

  6.1.2.1. do sentido de escoamento da água na superfície das pistas, sendo a pista principal
  aquela

  onde o escoamento for o mais paralelo possível ao sentido das ranhuras transversais;

  6.1.2.2. do regime de velocidade das aeronaves no solo, ou seja, deve-se dar preferência
  à pista

  em que as aeronaves usualmente alcançam maiores velocidades na interseção;

  6.1.2.3. das áreas de toque, uma vez que deve ser dada preferência às pistas nas quais a
  interseção

  faz parte da zona de toque das aeronaves; e

  6.1.2.4. de uma avaliação de risco específica, caso os demais critérios não sejam suficientes,

  considerando o uso de cada pista (se mais frequente para pouso, por exemplo), a extensão

  de cada pista, a disponibilidade de áreas de segurança de fim de pista (RESA), a

  densidade operacional e as particularidades de cada uma.

  6.1.3. Nas interseções, a distância entre as extremidades das ranhuras da pista principal
  e a linha

  imaginária que limita as ranhuras da pista secundária deve ser de, no máximo, 3 metros,

  sendo recomendado 1,0 metro. A Figura 2 ilustra esse arranjo.Data de emissão: 19 de fevereiro
  de 2021.

  Revisão A

  Figura 2 - Ranhuras em interseção entre pistas de pouso e decolagem.

  6.1.4. O padrão “serrilhado” ou “escada” resultante da interrupção do conjunto de ranhuras
  na

  pista secundária deve respeitar o disposto na Figura 2 (ver detalhe).

  6.1.5. Os critérios apresentados para as pistas de pouso e decolagem secundárias podem ser

  replicados para pistas de táxi de saída rápida que sejam dotadas de ranhuras transversais.'
