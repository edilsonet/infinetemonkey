title: OBJETIVO
text: '1. OBJETIVO

  1.1. A presente Instrução Suplementar - IS tem o objetivo de detalhar e estabelecer a forma

  preferencial de cumprimento dos requisitos associados ao projeto de sistemas de

  desaceleração de aeronaves para proteção dos eventos de excursão longitudinal de pista

  (overrun).'
