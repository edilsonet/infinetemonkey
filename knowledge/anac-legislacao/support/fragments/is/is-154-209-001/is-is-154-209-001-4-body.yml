title: TERMOS E DEFINIÇÕES
text: '4. TERMOS E DEFINIÇÕES

  4.1. Para os efeitos desta IS, são válidos os termos e definições apresentados na seção
  154.15 do

  4.2. Overrun significa o evento onde a aeronave ultrapassa a extremidade longitudinal da
  pista

  de pouso e decolagem. Também é conhecido como saída de final da pista.

  4.3. Undershoot significa o evento onde a aeronave realiza o toque antes de alcançar a cabeceira.'
