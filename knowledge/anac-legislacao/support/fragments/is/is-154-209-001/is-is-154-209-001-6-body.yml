title: CRITÉRIOS DE PROJETO PARA SISTEMAS DE DESACELERAÇÃO DE
text: '6. CRITÉRIOS DE PROJETO PARA SISTEMAS DE DESACELERAÇÃO DE

  AERONAVES

  6.1. Áreas de segurança de fim de pista (RESA) têm como objetivo a redução do risco de danos

  a aeronaves que, em aproximação, realizem o toque antes de alcançar a cabeceira

  (undershoot) ou que, em solo, ultrapassem acidentalmente o fim da pista de pouso e

  decolagem (overrun).

  6.2. Por serem localizadas após a faixa de pista de pouso e decolagem, há dificuldade em
  se

  prover essas áreas em aeródromos com limitações físicas do sítio aeroportuário e/ou do

  entorno.

  6.3. Nessas situações, podem ser implantados sistemas de desaceleração de aeronaves, que
  são

  projetados para desacelerar uma aeronave que ultrapasse acidentalmente o fim da pista de

  pouso e decolagem (overrun).

  6.4. Dessa forma, as disposições desta IS são focadas nas características físicas do sistema
  para

  proteção dos eventos de overrun.

  6.5. Tendo em vista as funções das RESA descritas no item 6.1 acima, devem ser observadas
  as

  disposições contidas no parágrafo 154.207(b) e na seção 154.209 para a proteção dos eventos

  undershoot, sendo que o sistema de desaceleração de aeronaves pode ser contabilizado como

  parte dessa área.

  6.5.1. Caso essa área não possa ser provida, a questão será tratada em processo específico,

  mediante análise de risco para o caso concreto.

  6.6. Devem ser observadas as disposições contidas na seção 154.405 do RBAC n° 154 para a

  implementação da sinalização horizontal de área anterior à cabeceira.

  6.7. [FC 154.209(b)(3), G.7(d), G.7(e), G.7(f) e G.7(g)] As dimensões do sistema de

  desaceleração de aeronaves devem obedecer aos seguintes parâmetros:

  6.7.1. O sistema deve possuir comprimento suficiente para parar a aeronave mais exigente
  em

  excursão longitudinal de pista a:

  6.7.1.1. 50 nós para uma RESA equivalente de 90 m de comprimento;

  6.7.1.2. 54 nós para uma RESA equivalente de 120 m de comprimento; ouData de emissão: 24
  de dezembro de 2021 IS nº 154.209-001

  6.7.1.3. 70 nós para uma RESA equivalente de 240 m de comprimento.

  6.7.2. Para outros comprimentos de RESA equivalente, a velocidade (𝑣) de projeto do sistema

  pode ser calculada, em nós, pela expressão a seguir, em que 𝐿𝑅𝐸𝑆𝐴 é o comprimento da

  RESA equivalente, em metros.

  𝑣 = 4,012 ∙ √(60 + 𝐿𝑅𝐸𝑆𝐴)

  6.7.3. O sistema deve possuir largura mínima igual à largura de pista requerida para a aeronave

  crítica associada.

  6.7.4. O início do sistema de desaceleração deve ser recuado em relação à extremidade da
  pista

  de pouso e decolagem de uma distância suficiente para que a sua estrutura não seja

  danificada pelos gases de exaustão (jet blast) das aeronaves.

  6.7.4.1. [Recomendação] Recomenda-se que esse recuo seja de, pelo menos, 23 m, conforme

  Figura 1.

  6.7.5. Devem ser providas, nas laterais do sistema, áreas que permitam o acesso de pessoas
  e

  que ofereçam espaço e suporte para a passagem de veículos para atividades de

  manutenção, resgate e combate a incêndio.

  6.7.5.1. [Recomendação] Recomenda-se que a largura dessas áreas seja dimensionada

  considerando o dobro da largura do maior veículo que acessará essas áreas e mais uma

  margem de segurança de no mínimo 1,8m para cada lado.

  Figura 1 - Acessos às laterais e recuo do sistema de desaceleração de aeronaves em relação
  à

  extremidade da pista de pouso e decolagem

  6.8. [FC 154.209(b)(3), G.7(d), G.7(e), G.7(f) e G.7(g)] O material constitutivo de um sistema

  de desaceleração de aeronaves deve obedecer aos seguintes parâmetros:

  6.8.1. Ter um comportamento tensão-deformação tal que garanta comportamento uniforme e

  previsível quando sob esforços de uma aeronave que venha a utilizar o sistema;Data de emissão:
  24 de dezembro de 2021 IS nº 154.209-001

  6.8.2. Ser resistente à água, ou seja, seu comportamento mecânico - e por consequência o

  desempenho do sistema - não pode ser afetado quando em contato com água;

  6.8.3. Não atrair fauna, em especial aves;

  6.8.4. Possuir propriedades físicas e comportamento mecânico constante em todas as condições

  climáticas e em faixa de temperatura compatível com a localidade onde o sistema foi

  empregado;

  6.8.5. Não causar ofuscamento aos pilotos;

  6.8.6. Ser compatível com a instalação de um sistema de luzes de aproximação;

  6.8.7. Ser compatível com a operação de rádio-altímetro;

  6.8.8. Não causar interferência com os auxílios à navegação;

  6.8.9. Ser concebido de forma a evitar o acúmulo de água na superfície; e

  6.8.10. Ser projetado de forma a permitir o reparo e o retorno ao serviço, de forma segura
  e em

  prazo razoavelmente célere, nos casos de danificação devido a um incidente ou acidente.

  6.9. [Recomendação] O operador de aeródromo, com base em análise de risco sobre a segurança

  operacional, pode implementar balizas de proteção no perímetro do sistema de desaceleração

  de aeronaves de modo a indicar o sistema aos veículos no solo, conforme Figura 2, devendo

  obedecer aos seguintes parâmetros:

  6.9.1. As balizas devem ser frangíveis, retrorrefletivas e suficientemente baixas para preservar

  a desobstrução das hélices ou naceles dos motores das aeronaves;

  6.9.2. A cor das balizas no lado da pista de pouso e decolagem deve ser amarela; e

  6.9.3. A cor das balizas nos demais lados do sistema de desaceleração de aeronaves deve
  ser

  vermelha.Data de emissão: 24 de dezembro de 2021 IS nº 154.209-001

  Figura 2 - Balizas de proteção de sistema de desaceleração de aeronaves'
