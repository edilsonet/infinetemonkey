title: A quais distâncias do eixo da pista de pouso e decolagem estão os obstáculos?
text: '1. A quais distâncias do eixo da pista de pouso e decolagem estão os obstáculos?

  2. Em quais pontos ao longo da pista de pouso e decolagem estão os obstáculos? Os obstáculos
  se estendem ao longo da pista em ambos os lados? De que natureza são os obstáculos? São
  naturais, edificações, pátio, etc.?

  3. Em que pontos ao longo da pista de pista de pouso e decolagem a faixa preparada é violada?

  4. A quais distâncias do eixo da pista de pouso e decolagem estão as violações da faixa
  preparada?

  5. Considerar o histórico de ocorrências de desvio lateral de aeronaves em procedimento
  de pouso (durante a aproximação perdida) ou decolagem nos aeroportos brasileiros e no aeroporto
  em estudo. Em que pontos as aeronaves pararam?

  6. Considerar o histórico de ocorrências de excursão de pista nos aeroportos brasileiros
  e no aeroporto em estudo. Em que pontos as aeronaves pararam?'
