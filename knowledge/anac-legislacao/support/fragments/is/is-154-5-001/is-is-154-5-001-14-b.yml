cite: 14(b)
title: 14(b)
text: 'b) Caso haja espaço físico para a construção de um novo sistema de pistas de táxi e
  pátio de aeronaves (por exemplo, nos sítios onde exista espaço desocupado na outra lateral
  da pista de pouso e decolagem):

  ✔ Seria aceitável uma isenção permanente desde que a operação pretendida não tenha sido
  rejeitada nos Testes de Rejeição e passe no Teste de Aceitação.

  ✘ Caso contrário, não será aceito pedido de isenção permanente.'
