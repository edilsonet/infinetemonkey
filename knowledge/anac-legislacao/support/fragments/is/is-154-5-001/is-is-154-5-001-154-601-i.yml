cite: 154.601(i)
title: 154.601(i)
text: '(i) a ANAC poderá estabelecer que a RESA seja parcial ou integralmente adequada ao
  disposto na seção 154.209, para pistas não-instrumento com código de referência de aeródromo
  1 ou 2;

  (ii) a RESA deverá atender ao disposto nos parágrafos 154.209(c) a 154.209(f), com comprimento
  igual ou superior a 90 m e largura igual ou superior ao dobro da largura de pista requerida
  para a aeronave crítica associada, para pistas com código de referência de aeródromo 3 ou
  4 e para pistas instrumento com código de referência de aeródromo 1 ou 2;

  (3) na hipótese descrita no parágrafo 154.601(a)(1), a pista de pouso e decolagem poderá
  ser mantida com RESA nas mesmas dimensões previstas no respectivo cadastro, devendo ser
  atendido o disposto nos parágrafos 154.209(c) a 154.209(f); e

  (4) enquanto o aeródromo não se enquadrar nas hipóteses dos parágrafos 154.601(a)(1) a 154.601(a)(5),
  a RESA poderá ser mantida nas condições do respectivo cadastro.

  Deste modo, o RBAC 154 determina que as pistas construídas depois da publicação do regulamento
  (12 de maio de 2009) têm como compulsório o provimento da RESA.

  Já as pistas construídas até a data de 12 de maio de 2009, “enquanto o aeródromo não se
  enquadrar nas hipóteses dos parágrafos 154.601(a)(1) a 154.601(a)(5)”, não necessitam, de
  imediato, implementar a RESA.

  O RBAC 154 estabelece, na NOTA 4 do item 154.209(b) que “a obtenção de um nível equivalente
  de segurança operacional à implantação de RESA pode se dar por meio de deslocamento da cabeceira
  e redução das distâncias declaradas TORA, ASDA e LDA na dimensão longitudinal faltante para
  a RESA”.

  Este apêndice estabelece, portanto, uma metodologia para a avaliação da implantação da RESA
  nos aeroportos, quais são as outras formas de cumprimento do requisito que garantam um nível
  equivalente de segurança operacional e elenca ações que o operador de aeródromo pode escolher
  para mitigar o risco às operações até que as Áreas de Segurança de Fim de Pista venham a
  ser implantadas.


  ANÁLISE DAS ÁREAS DE SEGURANÇA DE FIM DE PISTA

  As Áreas de Segurança de Fim de Pista preconizadas no RBAC 154.209 podem ser observadas
  na Figura 17.


  Figura 17 - Área de Segurança de Fim de Pista (RESA)

  Todas as pistas construídas após a data de publicação do RBAC 154 devem prover essas áreas
  em conformidade com o 154.209 ou garantir um nível equivalente de segurança operacional
  a ser demostrado pelo operador de aeródromo, não cabendo, nestes casos, ao operador apenas
  mitigar os riscos às operações.

  MITIGAÇÃO DO RISCO À SEGURANÇA OPERACIONAL

  Para os aeroportos que foram construídos antes da data de 12 de maio de 2009, é possível
  a mitigação de risco através da redução das distâncias declaradas, doravante denominada
  Medida Mitigadora, para que o operador garanta a mitigação ao risco às operações até que
  a infraestrutura seja adequada ao requisito de RESA.

  MEDIDA MITIGADORA

  Esta redução das distâncias declaradas visa mitigar o risco de excursão de fim de pista
  (overrun) das aeronaves, fazendo com que haja uma distância segura, com as dimensões de
  acordo com o requisito 154.209, após o final das distâncias declaradas.

  Para definir quais distâncias declaradas devem ser reduzidas, é necessário avaliar o objetivo
  da RESA e a operação das aeronaves. O overrun pode acontecer tanto na decolagem, quanto
  no pouso. Na decolagem, essa excursão pode acontecer no caso de uma decolagem abordada ou
  em uma decolagem normal.

  Desse modo, no caso da não existência de RESA em conformidade com requisito 154.209, é necessária
  a redução das distâncias TORA (Pista Disponível para Corrida de Decolagem), ASDA (Distância
  Disponível para Aceleração e Parada) e LDA (Distância Disponível para Pouso) na dimensão
  faltante para o provimento completo da RESA da pista em análise. A TODA (Distância Disponível
  para Decolagem) não precisa obrigatoriamente ser reduzida visto que toda a extensão da pista
  de pouso e decolagem, ou a clearway, se houver, necessariamente é uma área livre de obstáculos.

  Deve-se avaliar o comprimento da RESA de 90 metros (na hipótese descrita no parágrafo 154.601(a)(2)),
  somado ao comprimento da faixa de pista anterior à cabeceira de 60 metros, totalizando 150
  metros.

  A ilustração da redução das distâncias declaradas prevista na Medida Mitigadora pode ser
  observada na Figura 18.


  Figura 18 - Medida Mitigadora


  NÍVEL EQUIVALENTE DE SEGURANÇA OPERACIONAL - NESO

  Os operadores de aeródromo podem demostrar que mantêm um nível equivalente de segurança
  operacional de alguma outra forma que não seja implantação da RESA conforme especificado
  no 154.209 e ilustrada na Figura 17.

  Para isso, existe a possibilidade de deslocamento de cabeceira e redução das Distâncias
  Declaradas, doravante denominada Medida Alternativa.


  MEDIDA ALTERNATIVA

  A Medida Alternativa é uma solução que, através do deslocamento de cabeceira e redução das
  Distâncias Declaradas, o operador de aeródromo provê uma área de mesma dimensão ao requisito
  da RESA com função de proteger o overrun e o undershoot, atendendo a função prevista à RESA
  no RBAC 154. Para isso, é necessário o deslocamento físico da cabeceira, e a consequente
  adequação dos auxílios à navegação.

  Esquematicamente, a Medida Alternativa pode ser visualizada na Figura 19.


  Figura 19 - Medida Alternativa


  A Medida Alternativa é, portanto, a combinação da redução das distâncias declaradas prevista
  na Medida Mitigadora, com o deslocamento da cabeceira. O cálculo das distâncias declaradas
  para proteção do overrun é o mesmo do caso da Medida Mitigadora. As sinalizações horizontais
  e luminosas devem estar de acordo com a figura prevista no Apêndice D desta IS.

  CONCLUSÃO

  O provimento de RESA nos aeroportos brasileiros é extremamente importante para a garantia
  da segurança operacional. O RBAC 154 estabelece que este requisito se aplica aos aeroportos
  construídos até mesmo antes da data de publicação do regulamento (como previsto na subparte
  G). Assim, apresentam-se formas alternativas de cumprimento e mitigação de risco até que
  a RESA venha a ser implantada.

  O operador de aeródromo, ao propor a adoção da Medida Mitigadora, ou de qualquer outra solução
  que não atenda ao requisito ou que não seja um Nível Equivalente de Segurança Operacional,
  deve demonstrar o motivo do não atendimento, de imediato, do requisito supracitado, bem
  como propor um prazo apropriado para a adequação definitiva.

  Os prazos propostos devem ser proporcionais e razoáveis, de modo que não é aceitável um
  prazo demasiadamente longo para o provimento definitivo da RESA. Aeroportos distintos podem
  ter prazos diferentes para a implantação da RESA considerando o grau de não conformidade,
  o volume das operações (exposição ao risco) e o impacto operacional da redução da pista
  de pouso e decolagem.'
