text: '7. Quais as rotas de táxi das aeronaves?


  DEFESAS E MEDIDAS MITIGADORAS ADICIONAIS

  As defesas existentes e as medidas mitigadoras indicadas ou propostas na análise de risco
  devem estar relacionadas aos procedimentos de aproximação e de decolagem. Eventualmente,
  pode não ser necessária a adoção de medidas mitigadoras tendo em vista a existência de defesas
  que enfrentam os riscos inerentes à operação com separação de TWY/RWY reduzida.

  A seguir uma lista não exaustiva de possíveis defesas existentes ou medidas mitigadoras
  adicionais:'
