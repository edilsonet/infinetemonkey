title: APÊNDICE E - BIBLIOGRAFIA RECOMENDADA
text: 'APÊNDICE E - BIBLIOGRAFIA RECOMENDADA

  AUSTRALIA, Civil Aviation Safety Authority, Advisory Circular AC 71-1(0), Guidelines for
  Airspace Risk Management and Associated Aeronautical Study Methodology, Fev/2002.

  AYRES Jr. M. et. al., ACRP Report 50: Improved Models for Risk Assessment of Runway Safety
  Areas, Transportation Research Board of the National Academies, Washington, D.C, 2011.

  AYRES Jr. M. et. al., ACRP Report 107: Development of a Runway Veer-Off Location Distribution
  Risk Assessment Model and Reporting Template, Transportation Research Board of the National
  Academies, Washington, D.C, 2014.

  CAA. CAP 168. Licensing of Aerodromes. Edition 10, 2014. Disponível em http://publicapps.caa.co.uk/modalapplication.aspx?appid=11&mode=detail&id=6114,
  acessado em 09/01/2017.

  CASA. Manual of Standards Part 139. Aerodromes. Version 1.8, 2012. Disponível em https://www.legislation.gov.au/Details/F2012C00095/Download,
  acessado em 22/12/2016.

  CENIPA. Painel SIPAER - Ocorrências Aeronáuticas na Aviação Civil Brasileira. Disponível
  em http://painelsipaer.cenipa.aer.mil.br/QvAJAXZfc/opendoc.htm?document=SIGAER%2Fg ia%2Fqvw%2Fpainel_sipaer.qvw&host=QVS%40cirros31-37&anonymous=true.
  Acesso em 23/02/2018.

  CENIPA, Saída de Pista na Aviação Civil Brasileira - Estatísticas 2004 a 2013. Disponível
  em http://sistema.cenipa.aer.mil.br/cenipa/paginas/arquivos/Saida_de_Pista_2004_a_2013.pdf
  , acessado em 18/04/2018.

  Eddowes, M., Hancox, J., MacInnes, A., Final Report on the Risk Analysis in Support of Aerodrome
  Design Rules, Report AEAT/RAIR/RD02325/R/002 for the Norwegian Civil Aviation Authority,
  Dez./2001.

  Emery S. et. Al., Design Aeronautical Study for Broome International Airport Terminal Airspace,
  Mar/2004.

  EUROCONTROL. European Action Plan for the Prevention of Runway Excursions, 2013. Disponível
  em http://www.eurocontrol.int/sites/default/files/publication/files/2012european-action-plan-prevention-runway-excursions.pdf,
  acessado em 10/01/2017.

  FAA. AC 150/5300-13A. Airport Design (includes change 1), 2012. Disponível em https://www.faa.gov/documentLibrary/media/Advisory_Circular/150-5300-13A-chg1interactive-201612.pdf,
  acessado em 22/12/2016.

  FLIGHT SAFETY FOUNDATION. Reducing the Risk of Runway Excursion, 2009. Disponível em https://flightsafety.org/wp-content/uploads/2016/09/fsf-runwayexcursions-report.pdf,
  acessado em 13/01/2017.

  FAA. AC 150/5300-13A - Airport Design. Disponível em https://www.faa.gov/documentLibrary/media/Advisory_Circular/150-5300-13A-chg1interactive-201705.pdf.
  Acesso em 12/04/2018.

  HALL, J. W. et. al., ACRP Report 51: Risk Assessment Method to Support Modification of Airfield
  Separation Standards, Transportation Research Board of the National Academies, Washington,
  D.C, 2011.

  International Business Aviation Council, Guidelines for the Conduct of Risk Analyses by
  Business Aircraft Operators, Mai/2003.

  NEUBAUER, K. et. al., ACRP Report 131: A Guidebook for Safety Risk Management for Airports,
  Transportation Research Board of the National Academies, Washington, D.C, 2015.

  OACI. Circular 301, AN/174. New Larger Aeroplanes - Infringement of the Obstacle Free Zone:
  Operational Measures and Aeronautical Study, 2005.

  OACI. Convenção sobre a Aviação Civil Internacional. Anexo 14. Aeródromos - Design e Operações
  de Aeródromos, Vol. 1. 7ª Edição, 2016.

  OACI. Circular 305, AN/177. Operation of New Larger Aeroplanes at Existing Aerodromes, 2004.

  OACI. Doc 9981. Procedures for Air Navigation Services - Aerodromes (PANSAerodromes), 2016.

  OACI. Aerodrome Design Manual Part 1, Runways, Doc 9157AN/901, 3a Edição, 2006.

  OACI. Aerodrome Design Manual Part 2, Taxiways, Aprons and Holding Bays, Doc 9157AN/901,
  4a Edição, 2005.

  TCCA. TP 312. Aerodrome Standards and Recommended Practices - Land Aerodromes,

  5th Edition, 2015. Disponível em https://www.tc.gc.ca/eng/civilaviation/publications/tp312-menu-4765.htm,
  acessado em 22/12/2016.


  ____________________________

  [1] Destaca-se que o requisito australiano na verdade aponta para pistas de código 3 com
  30m de largura. Como o requisito de largura de pista é de 30m de largura para os códigos
  3A, 3B e 3C, apresentamos desta forma para poder apresentar a correlação direta entra as
  normas brasileira e australiana. Observa-se ainda que, para os códigos 3 e 4 e operações
  IFR não-precisão, a norma australiana menciona ainda a possibilidade de utilizar larguras
  menores quando for impraticável adotar estes valores de 150m e 300m, mas com ajustes nos
  mínimos operacionais de pouso. Como não há uma definição de qual a penalização nos mínimos
  operacionais nestas situações, esta possibilidade não foi considerada para a aplicação deste
  teste de rejeição.

  [2] Para fins de exemplo, são consideradas nesta classificação as seguintes aeronaves: A318,
  A319, A320, A321, B737-100 até B737-700, EMB 190 e EMB 195.

  [3] Para consultar se existe estação meteorológica no aeroporto, consultar a seção 7 “OBSERVAÇÕES
  E INFORMES METEOROLÓGICOS” do GEN 3.5 SERVIÇOS DE METEOROLOGIA do AIP-Brasil.

  [4] Falhas mecânicas são um fator de acidente frequente em excursões de pista durante a
  decolagem, enquanto condições meteorológicas perigosas tais como trovoadas estão mais frequentemente
  presentes em acidentes ou incidentes durante o pouso. Falhas de frenagem ou mal funcionamento
  do sistema de reverso dos motores também tem sido fatores contribuintes num número significativo
  de veer-offs após o pouso.

  [5] Para consultar se existe estação meteorológica no aeroporto, consultar a seção 7 “OBSERVAÇÕES
  E INFORMES METEOROLÓGICOS” do GEN 3.5 SERVIÇOS DE METEOROLOGIA do AIP-Brasil.'
