title: APLICABILIDADE
text: 'APLICABILIDADE

  Este apêndice apresenta uma metodologia para a avaliação de faixa de pista de pouso e decolagem
  que pode ser utilizada como guia para análise de risco quando do não atendimento das especificações
  da seção 154.207 do RBAC 154.

  Este guia aplica-se à avaliação de não conformidades associadas aos seguintes requisitos
  da seção 154.207 do RBAC 154: (c) Largura de faixas de pista de pouso e decolagem; (d) Objetos
  em faixas de pista de pouso e decolagem; e (e) Faixa preparada.

  CONTEXTUALIZAÇÃO

  O propósito da faixa de pista pode ser divido em dois aspectos:

  • reduzir o risco de dano a uma aeronave em caso de saída de pista, por meio do provimento
  de uma área nivelada e preparada com capacidade de suporte e declividades longitudinais
  e transversais adequadas para suportar e suavizar o deslocamento da aeronave;

  • proteger uma aeronave no sobrevoo durante o pouso, decolagem ou pouso interrompido, por
  meio do provimento de uma área livre de obstáculos com exceção dos auxílios à navegação
  permitidos pelo regulamento.

  Portanto, a análise de risco de uma situação de não conformidade da faixa de pista deve
  contemplar uma avaliação desses dois aspectos.

  CRITÉRIOS PARA A AVALIAÇÃO DE UMA ANÁLISE DE RISCO

  Apresenta-se, a seguir, critérios para a análise e aceitação de uma análise de risco. Porém,
  a elaboração de uma análise de risco não se resume aos critérios aqui apresentados. Ou seja,
  o operador de aeródromo deve realmente entender a análise de risco como uma ferramenta de
  compreensão da sua operação e uma forma de avaliar melhorias, sejam operacionais ou de infraestrutura.

  Os seguintes critérios foram estabelecidos pela Agência para a avaliação de uma análise
  de risco proposta por um operador de aeródromo:

  TESTE DE REJEIÇÃO

  É um critério que dá indícios que a “exposição ao risco” é inaceitável. Ou seja, caso a
  infraestrutura seja rejeitada no critério, a proposta operacional não seria aceitável a
  não ser que uma avaliação mais robusta ateste que um nível aceitável de segurança operacional
  foi alcançado. No entanto, caso a infraestrutura passe nos testes de rejeição, não é possível
  afirmar apenas por essa avaliação que a operação é aceitável. Visualmente, o Teste de Rejeição
  pode ser entendido de acordo com a Figura 1.


  Figura 1 - Teste de Rejeição

  TESTE DE ACEITAÇÃO

  É um teste mais detalhado que considera características específicas da infraestrutura, meteorologia
  e operações do aeroporto. Caso o cenário operacional proposto passe no teste, a operação
  seria atestada como aceitável de acordo com parâmetros de segurança aceitos pela ANAC. Porém,
  caso o cenário não passe no teste, não se pode necessariamente afirmar que a operação é
  inaceitável (ou seja, pode ser aceito um ALARP - As Low As Reasonably Practicable). Visualmente,
  o Teste de Aceitação pode ser entendido de acordo com a Figura 2.


  Figura 2 - Teste de Aceitação

  TESTES DE REJEIÇÃO

  FAIXA DE PISTA - 154.207(C) E (D)

  Teste de Rejeição nº 1 - Requisito FAA

  O requisito faixa de pista da FAA é menos restritivo que o preconizado pela OACI para os
  códigos 3 e 4 e operações IFR. A norma da FAA (AC 150/5300-13A - “Airport Design”) apresenta
  duas áreas, a RSA (Runway Safety Area) e a ROFA (Runway Obstacle Free Area). Pelas definições
  e especificações da norma, pode-se considerar que estas áreas são compatíveis, respectivamente,
  à faixa preparada e à faixa de pista do RBAC 154.

  Considerando que esse requisito é mais flexível na norma norte-americana que no RBAC 154
  (para a combinação de códigos e operação apresentados na Tabela 1), deve-se diferenciar
  os casos em que a infraestrutura atenda o requisito norte americano e os casos em que nem
  este é atendido. A comparação entre requisitos é apresentada na Tabela 1.


  Tabela 1 - Requisitos de Largura de faixa de pista (medida a partir do eixo) Largura da
  Faixa de Pista OACI FAA OACI (Cód. 3 e 4, IFR) FAA C III 140 M 122 M D IV 140 M 122 M E
  V 140 M 122 M F VI 140 M 122 M

  Caso o aeródromo em avaliação não possua uma largura de faixa de pista que atenda ao requisito
  da FAA, diz-se que que a separação está na região de rejeição, ou seja, o cenário operacional
  foi rejeitado no Teste de Rejeição nº 1.

  Importante destacar que este teste de rejeição só é aplicável para operações de aeronaves
  código 3 ou 4, código C ou superior e operações IFR. Para demais situações, não apresentadas
  na Tabela 1, deve-se verificar na norma da FAA se é possível a aplicação do teste, isto
  é, se a norma da FAA é mais flexível que a norma da ANAC (não foi apresentado aqui toda
  a combinação de códigos, uma vez que não é possível fazer a correlação direta entre os códigos
  da OACI e da FAA).


  Teste de Rejeição nº 2 - Requisito TCCA - Canadá

  O requisito da largura de faixa de pista adotado pelo TCCA (em sua norma TP312 - “Aerodrome
  Standards and Recommended Practices - Land Aerodromes - 5th Edition”) é menos restritivo
  que o preconizado pela OACI. Considerando que esse requisito é mais flexível que o do RBAC
  154, deve-se diferenciar os casos em que a infraestrutura atenda o requisito canadense e
  os casos em que nem este é atendido.

  Como a correlação entre os códigos do TP312 e do RBAC 154 não é simples, isto é, não é válida
  para todas as aeronaves de cada código, a Tabela 2 apresenta apenas o requisito canadense
  (sem fazer a correlação com o requisito do RBAC 154), apresentando também aeronaves típicas
  de cada código.

