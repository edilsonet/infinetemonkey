  Caso o cenário operacional em avaliação não possua uma largura de faixa preparada que atenda
  ao requisito do TCCA, diz-se que que a largura está na região de rejeição, ou seja, o cenário
  operacional foi rejeitado no Teste de Rejeição nº 2.

  Teste de Rejeição nº 3 - Separação trem-de-pouso principal a objetos fixos

  Este teste consiste em avaliar a separação entre a borda externa do trem de pouso principal
  de aeronaves localizadas no eixo da RWY a um obstáculo localizado após o término da faixa
  preparada, e compará-la com a distância mínima prevista para atendimento ao requisito do
  RBAC 154. Para aeroportos que operam aeronaves dos códigos de referência 4C, 4D e 4E, compara-se
  a distância existente entre a borda externa do trem de pouso principal e o término da faixa
  preparada, com a distância mínima prevista para o código 4E, conforme mostrado na Figura
  5.


  Figura 5 - Distância entre borda externa do trem de pouso principal e o limite da Faixa
  Preparada

  Como a distância regulamentar entre o eixo da pista de pouso e decolagem e o término da
  faixa preparada para o código 4E é de 75 metros (considerando pistas para operações IFR
  não precisão) e de 105 metros (considerando pistas para operações IFR precisão), tem-se
  que a separação mínima entre a borda externa do trem de pouso principal e o limite da faixa
  preparada é de 67,5m (IFR não precisão) ou 97,5m (IFR precisão), considerando a largura
  máxima do trem de pouso de 15m, conforme a tabela C-2 do RBAC 154. Por meio desse parâmetro,
  calculam-se as larguras mínimas necessárias para a faixa preparada para códigos 4C e 4D.
  Considerando o limite dos códigos das aeronaves, a análise pode ser feita pela Tabela 7.

  Caso a distância existente entre a borda externa do trem de pouso e objetos fixos seja inferior
  a 67,5 metros (IFR não-precisão) ou 97,5 metros (IFR precisão), diz-se que que a separação
  está na região de rejeição, ou seja, o cenário operacional foi rejeitado no Teste de Rejeição
  nº 3.


