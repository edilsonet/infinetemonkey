  Caso o cenário operacional em avaliação não possua uma largura de faixa de pista que atenda
  ao requisito da CASA, diz-se que que a largura está na região de rejeição, ou seja, o cenário
  operacional foi rejeitado no Teste de Rejeição nº 3.

  Importante destacar que este teste de rejeição só é aplicável para a combinação de códigos
  e operação realçados em verde na Tabela 3.

  Teste de Rejeição nº 4 - Separação pontas de asa - objetos fixos

  Este teste consiste em avaliar a separação entre a ponta de asa de aeronaves localizadas
  no eixo da RWY e de um obstáculo localizado após o término da faixa de pista, e compará-la
  com a distância mínima prevista para atendimento ao requisito do RBAC 154. Para aeroportos
  que operam aeronaves dos códigos de referência 4C, 4D e 4E, compara-se a distância existente
  entre a ponta de asa e o término da faixa de pista, com a distância mínima prevista para
  o código 4E, conforme mostrado na Figura 4.


  Figura 4 - Distância entre ponta de asa e o limite da Faixa de Pista

  Como a distância regulamentar entre o eixo da RWY e o término da faixa de pista para o código
  4E é de 140 metros (considerando pistas para operações IFR), tem-se que a separação mínima
  entre ponta de asa e o limite da faixa de pista é de 107,5m. Por meio desse parâmetro, calculam-se
  as larguras mínimas necessárias para a faixa de pista para códigos 4C e 4D. Considerando
  o limite dos códigos das aeronaves, a análise pode ser feita pela Tabela 4.

  Caso a distância existente entre a ponta de asa e objetos fixos seja inferior a 107,5 metros,
  diz-se que que a separação está na região de rejeição, ou seja, o cenário operacional foi
  rejeitado no Teste de Rejeição nº 4.

