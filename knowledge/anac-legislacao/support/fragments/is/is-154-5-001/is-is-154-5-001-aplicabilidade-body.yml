  Na análise de risco específica, pode-se avaliar pela envergadura de uma aeronave específica
  e não necessariamente pelo limite do código.


  FAIXA PREPARADA - 154.207(E)

  Teste de Rejeição nº 1 - Requisito FAA

  O requisito faixa de pista da FAA é menos restritivo que o preconizado pela OACI para os
  códigos 3 e 4 e operações IFR. A norma da FAA (AC 150/5300-13A - “Airport Design”) apresenta
  duas áreas, a RSA (Runway Safety Area) e a ROFA (Runway Obstacle Free Area). Pelas definições
  e especificações da norma, pode-se considerar que estas áreas são compatíveis, respectivamente,
  à faixa preparada e à faixa de pista do RBAC 154.

  Considerando que esse requisito é mais flexível na norma norte-americana que no RBAC 154
  (para a combinação de códigos e operação apresentados na Tabela 5), deve-se diferenciar
  os casos em que a infraestrutura atenda o requisito norte americano e os casos em que nem
  este é atendido. A comparação entre requisitos é apresentada na Tabela 5.


  Tabela 5 - Requisitos de Largura de faixa preparada (medida a partir do eixo)


