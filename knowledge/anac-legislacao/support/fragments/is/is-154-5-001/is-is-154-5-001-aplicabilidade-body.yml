  Caso o aeródromo em avaliação não possua uma largura de faixa preparada que atenda ao requisito
  da FAA, diz-se que que a largura está na região de rejeição, ou seja, o cenário operacional
  foi rejeitado no Teste de Rejeição nº 1.

  Importante destacar que este teste de rejeição só é aplicável para operações de aeronaves
  código 3 ou 4, código C ou superior e operações IFR precisão. Para demais situações, não
  apresentadas na Tabela 5, deve-se verificar na norma da FAA se é possível a aplicação do
  teste, isto é, se a norma da FAA é mais flexível que a norma da ANAC (não foi apresentado
  aqui toda a combinação de códigos, uma vez que não é possível fazer a correlação direta
  entre os códigos da OACI e da FAA).

  Teste de Rejeição nº 2 - Requisito TCCA - Canadá

  O requisito da largura de faixa preparada adotado pelo TCCA (em sua norma TP312 - “Aerodrome
  Standards and Recommended Practices - Land Aerodromes - 5th Edition”) é menos restritivo
  que o preconizado pela ANAC para algumas combinações de código e tipo de operação. Considerando
  que esse requisito é mais flexível que o do RBAC 154, deve-se diferenciar os casos em que
  a infraestrutura atenda o requisito canadense e os casos em que nem este é atendido.

  Como a correlação entre os códigos do TP312 e do RBAC 154 não é simples, isto é, não é válida
  para todas as aeronaves de cada código, a Tabela 6 apresenta apenas o requisito canadense
  (sem fazer a correlação com o requisito do RBAC 154), apresentando também aeronaves típicas
  de cada código.


