text: '(c) Todo operador de aeródromo pode solicitar à ANAC isenção de requisito deste Regulamento,
  nos moldes do RBAC n° 11, denominado “Regras gerais para petição de emissão, alteração,
  revogação ou isenção de cumprimento de regra” ou norma que o substitua ou atualize, por
  meio da apresentação de Estudo Aeronáutico que demonstre que as operações podem ser mantidas
  em um nível aceitável de segurança operacional.

  Resolução nº 30, de 21 de maio de 2008, que institui a Instrução Suplementar - IS, norma
  suplementar de caráter geral editada pelo Superintendente da área competente, objetivando
  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou RBHA. Da Resolução,
  transcreve-se:

  Art. 14 Fica instituída a Instrução Suplementar - IS, norma suplementar de caráter geral
  editada pelo Superintendente da área competente, objetivando esclarecer, detalhar e orientar
  a aplicação de requisito previsto em RBAC.

  § 1º O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de
  requisito previsto em RBAC, poderá:

  I - adotar os meios e procedimentos previamente especificados em IS; ou

  II - apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se, nesse
  caso, a análise e concordância expressa do órgão competente da ANAC.

  § 2° O meio ou procedimento alternativo mencionado no § 1° deste artigo deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  §3° A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.'
