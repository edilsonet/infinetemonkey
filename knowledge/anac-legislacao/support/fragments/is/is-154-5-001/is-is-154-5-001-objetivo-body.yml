title: OBJETIVO
text: 'OBJETIVO

  A presente Instrução Suplementar - IS tem por objetivo estabelecer orientações e procedimentos
  para a realização de análises de risco acerca da incompatibilidade da operação de aeronaves
  em infraestruturas aeroportuárias existentes, de acordo com os padrões de projeto definidos
  no RBAC 154 - Projeto de Aeródromos, com a finalidade de se demonstrar que as operações
  podem ser mantidas em um nível aceitável de segurança operacional.'
