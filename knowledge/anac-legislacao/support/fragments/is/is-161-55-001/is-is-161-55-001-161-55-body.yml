title: (a) O operador do aeródromo que apresente média anual de
text: '161.55 (a) O operador do aeródromo que apresente média anual de

  movimento de aeronave nos últimos três anos acima de 120.000 (cento e

  vinte mil) e que possua regiões de uso residencial ou misto em mais de

  50% das áreas definidas pelas curvas de ruído 65-75, 75-80 e 80-85 e

  acima de 85 dB de seu PEZR, isoladas ou conjuntamente, deverá

  apresentar à ANAC, para análise e aceitação, um projeto de

  monitoramento de ruído.'
