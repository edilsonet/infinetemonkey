title: Características do aeródromo
text: '2. Características do aeródromo

  <Esta seção deverá conter as informações a seguir.>

  2.1. Informações gerais

  - Nome do Aeródromo;

  - Endereço;

  - Nome e razão social do Operador;

  - Responsável/Superintendente;

  - Planta atualizada do Plano Específico de Zoneamento de Ruído - PEZR;

  - Mapa baseado nas informações e reclamações recebidas pela Comissão de Gerenciamento de

  Ruído Aeronáutico - CGRA, indicando os equipamentos urbanos mais sensíveis ao ruído

  aeronáutico.

  2.2. Características físicas

  - Número de pistas existentes e planejadas;

  - Dimensões das pistas existentes e planejadas;

  - Coordenadas geográficas das cabeceiras das pistas existentes e planejadas;

  - Elevação do aeródromo;

  - Temperatura de referência do aeródromo;

  - Coordenadas geográficas da área de teste de motores e orientação da aeronave.

  2.3. Características operacionais

  - Número de movimentos por cabeceira: registro do percentual médio de utilização (pousos
  e

  decolagens) no mês de referência, para o mês anterior e uma média de utilização nos últimos

  12 meses, para todas as horas do dia e noite para todos os tipos de aeronaves;

  - Tipos de aeronaves que operam no aeródromo;31/05/2013 IS nº 161.55-001

  Revisão A

  - Trajetórias de pouso e decolagem específicas para o aeródromo, conforme cartas de

  navegação visual e/ou por instrumento;

  - Movimentos por tipo de aeronave em cada rota, segregadas em período diurno e noturno;

  - Curvas de ruído da operação atual do aeródromo.'
