title: Análise e monitoramento
text: '3. Análise e monitoramento

  <Nesta seção deverão ser abordados os seguintes aspectos:>

  3.1. Cronograma

  <Deverá conter datas, tarefas e produtos, compreendendo as fases de implementação do sistema
  de

  monitoramento.>

  3.2. Análise teórica

  <Deverá conter a análise das curvas de ruído do PEZR e da operação atual do aeródromo e
  ainda os

  equipamentos urbanos sensíveis ao ruído nessas áreas, como hospitais, escolas, creches e

  bibliotecas, bem como os pontos obtidos através de informações e reclamação recebidas pela

  CGRA.>

  3.3. Campanha de monitoramento

  <Deverá conter, no mínimo:>

  - Métodos de trabalho;

  - Escolha de pontos de medição;

  - Características dos equipamentos utilizados;

  - Análise dos resultados obtidos.'
