title: Relatório de Monitoramento
text: '4. Relatório de Monitoramento

  <O relatório deverá apresentar como conteúdo mínimo os seguintes itens:>

  - Pontos escolhidos para o monitoramento, com a devida justificativa;

  - Resumo das medições e registros realizados contendo o valor médio ponderado de ruído

  aferido na medição em cada ponto de recepção instalado, em associação comparativa com os

  valores predefinidos pelas curvas de ruído correspondentes aos limites inferior e superior
  da

  faixa de ruído onde os equipamentos permanecerem instalados;

  - Análise de confronto dos dados obtidos com as condições de contorno do PEZR em vigor;

  - Mapa da área afetada contendo a indicação dos pontos com registro de reclamações quanto

  aos níveis de ruído e/ou em que a medição de ruído identificar valores de DNL superiores

  aos previstos nas respectivas curvas do PEZR em vigor, e a identificação e descrição de

  eventos singulares constatados;

  - Gráficos contendo registros nos últimos 12 meses do número total de chamadas recebidas,

  natureza, horário e local da reclamação, o número de chamadas por comunidade ou região,

  para cada mês de referência;31/05/2013 IS nº 161.55-001

  Revisão A

  - Gráficos contendo registro nos últimos 12 meses do percentual médio de utilização (pousos
  e

  decolagens) para cada pista, para todas as horas do dia e noite e para todos os tipos de

  aeronaves;

  - Resultados da análise da associação das reclamações da comunidade relativas a ruído aos

  eventos monitorados nas regiões correspondentes;

  - Descrição das medidas eventualmente tomadas no âmbito de suas atribuições e

  responsabilidades administrativas para correção ou mitigação do ruído nestes pontos,

  sobretudo no que concerne às ações previstas na Subparte E do RBAC 161;

  - Indicação de medidas complementares a serem sugeridas aos operadores aéreos e/ou aos

  organismos gestores do tráfego aéreo na região do aeródromo para a mitigação dos eventuais

  desvios identificados em relação ao PEZR em vigor.'
