cite: 5.1.1
title: O PMR visa prover a avaliação continuada do impacto ambiental produzido e, para tanto,
text: '5.1.1 O PMR visa prover a avaliação continuada do impacto ambiental produzido e, para
  tanto,

  deve possibilitar a gravação e registro sistemático e permanente, durante todo o período
  de

  operação do aeródromo, dos dados referentes às características de cada evento gerador de

  ruído e de todas as demais informações relacionadas.'
