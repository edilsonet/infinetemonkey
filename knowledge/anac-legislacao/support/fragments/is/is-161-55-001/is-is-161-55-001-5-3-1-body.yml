title: Os pontos de monitoramento deverão ser posicionados e distribuídos de modo que captem,
text: '5.3.1 Os pontos de monitoramento deverão ser posicionados e distribuídos de modo que
  captem,

  com precisão e confiabilidade, todo o ruído gerado pelas aeronaves na região abrangida pelas

  curvas elaboradas de acordo com o parágrafo 5.2.1 da presente IS.'
