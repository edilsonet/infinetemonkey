text: '5.3.2 Os critérios para definição e localização dos pontos de monitoramento deverão
  contemplar o

  perfil operacional do aeródromo, as características do “ruído de fundo” (todo o ambiente

  medido excetuando as próprias aeronaves) e o uso do solo predominante em cada região

  monitorada.'
