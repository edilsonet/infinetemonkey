title: Para definição dos pontos de monitoramento também deverão ser considerados os registros
  de
text: '5.3.3 Para definição dos pontos de monitoramento também deverão ser considerados os
  registros de

  informações recebidos pela Comissão de Gerenciamento de Ruído Aeronáutico - CGRA,

  conforme parágrafo 161.53 (c) do RBAC 161, referentes às áreas com maior índice de

  reclamações por parte da população residente no entorno do aeródromo.'
