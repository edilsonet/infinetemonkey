title: O escopo do monitoramento e controle acústico não deverá limitar-se ao registro de
  eventos
text: '5.3.4 O escopo do monitoramento e controle acústico não deverá limitar-se ao registro
  de eventos

  relacionados às aeronaves em voo, mas também deve incluir o ruído proveniente de operações

  de aeronaves no solo, especialmente as realizadas no período noturno, no pátio de

  estacionamento de aeronaves, nos pontos de testes de motores e demais instalações

  aeroportuárias localizadas próximas a áreas urbanas habitadas no entorno do aeródromo.'
