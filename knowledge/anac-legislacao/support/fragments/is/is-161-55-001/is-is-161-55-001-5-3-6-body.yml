title: O operador de aeródromo deve demarcar os locais de instalação dos instrumentos receptores
text: '5.3.6 O operador de aeródromo deve demarcar os locais de instalação dos instrumentos
  receptores

  que constituem os pontos de monitoramento em planta ou carta elaborada de acordo com o

  parágrafo 161.33 (c) do RBAC 161.

  5.4. Objeto do monitoramento'
