cite: 5.5.1(b)
title: 5.5.1(b)
text: 'b) Os valores dos índices acústicos obtidos devem ser determinados de acordo com os

  procedimentos e critérios de medição indicados nesta IS e processados por meio de

  programa computacional que utilize metodologia matemática correspondente à utilizada

  para a geração das curvas dos PEZR, na métrica DNL, conforme a seção 161.31 do

  RBAC 161.'
