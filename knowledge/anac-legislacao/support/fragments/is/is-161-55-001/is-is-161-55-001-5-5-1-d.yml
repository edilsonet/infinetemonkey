cite: 5.5.1(d)
title: 5.5.1(d)
text: 'd) Sempre que possível, deve ser realizada a integração automática do sistema de

  monitoramento com o sistema de radar primário ou outra fonte de informações que

  forneça dados sobre cada aeronave e seu posicionamento, de forma a estabelecer a

  relação direta entre o ruído e a aeronave emissora.'
