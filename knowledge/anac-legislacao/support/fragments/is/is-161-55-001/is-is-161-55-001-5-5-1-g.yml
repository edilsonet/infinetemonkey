title: 5.5.1(g)
text: 'g) Os operadores aeroportuários devem assegurar que as entidades responsáveis pela

  realização de avaliações acústicas, sejam elas integrantes de suas respectivas estruturas

  administrativas ou terceirizadas, possuam capacidade técnica adequada e compatível com

  a exigida pelos órgãos reguladores da atividade profissional de seus respectivos

  responsáveis técnicos, comprovada por documentação hábil, na forma da legislação

  vigente.31/05/2013 IS nº 161.55-001

  Revisão A'
