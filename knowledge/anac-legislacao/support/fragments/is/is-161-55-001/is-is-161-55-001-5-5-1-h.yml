text: 'h) Salvo indicação em contrário expressa nesta IS ou no RBAC 161, os procedimentos
  de

  avaliação do ruído, constantes dos projetos de monitoramento de ruído, devem cumprir os

  critérios, orientações e requisitos das normas aplicáveis em vigor publicadas ou validadas

  pela ANAC.'
