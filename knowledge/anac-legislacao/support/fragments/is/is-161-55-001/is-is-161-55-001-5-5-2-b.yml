title: 5.5.2(b)
text: 'b) Os registros devem abranger o número total de chamadas recebidas, natureza, horário
  e

  local da reclamação, o número de chamadas por comunidade ou região, para cada mês de

  referência, para o mês anterior e a média nos últimos 12 (doze) meses.'
