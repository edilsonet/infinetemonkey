section_title: 'Registro e tratamento de informações obtidas pela CGRA:'
subsection_id: c
cite: 5.5.2(c)
title: 5.5.2(c)
text: 'c) O operador de aeródromo deve manter ainda um registro do percentual médio de

  utilização (pousos e decolagens) para cada pista, para todas as horas do dia e noite e para

  todos os tipos de aeronaves no mês de referência, para o mês anterior e uma média de

  utilização nos últimos 12 (doze) meses.'
