title: 5.5.2(d)
text: 'd) As reclamações da comunidade relativas a ruído, recebidas pela CGRA, deverão ser

  associadas aos eventos monitorados nas regiões correspondentes, de forma a permitir a

  análise de correlação entre as operações e o nível de incômodo produzido.

  5.6. Relatórios dos Projetos de Monitoramento de Ruído'
