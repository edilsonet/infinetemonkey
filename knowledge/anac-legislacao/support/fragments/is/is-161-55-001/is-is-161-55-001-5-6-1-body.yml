title: Os relatórios a que se refere o parágrafo 161.55 (c) (3) do RBAC 161 destinam-se a
text: '5.6.1 Os relatórios a que se refere o parágrafo 161.55 (c) (3) do RBAC 161 destinam-se
  a

  caracterizar o ambiente sonoro de regiões potencialmente afetadas ou de equipamentos

  urbanos sensíveis ao ruído. Esses relatórios devem apresentar a tabulação contendo o valor

  médio ponderado de ruído, em métrica DNL, aferido na medição em cada ponto de recepção

  instalado, em associação comparativa com os valores pré-definidos pelas curvas de ruído

  correspondentes aos limites inferior e superior da faixa de ruído onde os equipamentos forem

  instalados.'
