text: '7.1.1 Caso sejam identificadas infrações relativas ao não cumprimento de restrições
  operacionais,

  rotas ou procedimentos preestabelecidos nas cartas aeronáuticas do aeródromo e nos PEZR,
  o

  operador de aeródromo deverá comunicar os órgãos responsáveis pelas respectivas

  fiscalizações.'
