text: '7.1.6 As informações e documentação citadas no item anterior deverão ser mantidas à
  disposição da

  fiscalização e dos demais interessados durante o prazo mínimo de 2 (dois) anos após a

  conclusão de cada período de vigência dos PMR, nas hipótese em que venha a ocorrer

  atualização ou revisão, sem prejuízo de outras disposições legais em vigor, referentes à

  preservação de informações de interesse público.'
