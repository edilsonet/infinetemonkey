text: '7.1.7 Sempre que for viável e contribua para o aperfeiçoamento das práticas de gestão
  ambiental, a

  Anac recomenda e incentiva a divulgação das informações mencionadas na seção 7.1.5,

  preferencialmente disponibilizadas e atualizadas em tempo real, em sítio na rede mundial
  de

  computadores e canais especiais de divulgação orientados para as autoridades locais e grupos

  de interesse específicos identificados pelas CGRA.'
