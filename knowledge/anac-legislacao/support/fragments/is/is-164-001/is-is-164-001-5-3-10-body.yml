title: Susceptibilidade às ações de controle de fauna
text: '5.3.10 Susceptibilidade às ações de controle de fauna

  Certas espécies, uma vez afugentadas, podem demorar dias ou meses para serem

  novamente registradas em determinada área do aeródromo, outras costumam retornar no

  mesmo dia ou sequer deixam de fato o local. Pelo diagnóstico realizado na IPF e

  considerando o quotidiano operacional do aeródromo, o grau de susceptibilidade ao

  afugentamento das espécies deve ser estabelecido.

  5.4 Formulação da Análise do Risco da Fauna'
