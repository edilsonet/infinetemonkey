title: Quantidade média de indivíduos nos bandos
text: '5.3.3 Quantidade média de indivíduos nos bandos

  Sempre que forem avistadas espécies-problema, no âmbito das vistorias periódicas, deve

  ser registrado se formam ou não bandos, bem como a quantidade de indivíduos

  identificados, de modo a se calcular a quantidade média de indivíduos nos bandos

  presentes no sítio aeroportuário.'
