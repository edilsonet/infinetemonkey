title: Quantidade de tempo presente no aeródromo
text: '5.3.4 Quantidade de tempo presente no aeródromo

  Deve ser medida, para cada espécie-problema, a quantidade média de tempo em que se

  encontra presente no aeródromo. Este valor deve ser obtido como uma porcentagem das

  vistorias em que a espécie foi identificada.'
