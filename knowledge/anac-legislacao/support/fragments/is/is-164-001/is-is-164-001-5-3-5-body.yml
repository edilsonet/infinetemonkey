text: '5.3.5 Período do dia em que o aeródromo apresenta maior atividade

  Devem ser identificados os períodos do dia em que cada espécie-problema é mais ativa. As

  espécies presentes nos períodos de maior movimento no aeródromo implicam, no que se

  refere a este fator, em um risco maior que as demais.'
