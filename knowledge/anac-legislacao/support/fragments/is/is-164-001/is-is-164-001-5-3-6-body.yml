title: Localização com relação às operações de voo
text: '5.3.6 Localização com relação às operações de voo

  Espécies-problema localizadas nas proximidades das pistas de pouso e decolagem, bem

  como na direção das rampas de decolagem e aproximação, tendem a provocar um risco

  maior às operações aéreas que as demais. Cabe ao operador de aeródromo, com base nas

  operações aéreas existentes (como, por exemplo, utilização de cabeceiras e rotas de pouso

  e decolagem), determinar as áreas do sítio aeroportuário e de seu entorno mais sensíveis
  ao

  risco provocado pela fauna.'
