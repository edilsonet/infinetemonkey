text: '5.4.5 A fórmula apresentada no parágrafo 5.4.4, conforme mencionado no parágrafo 5.2.6

  permite ao operador de aeródromo conhecer, com relativa precisão, a diferença do risco

  provocado entre as espécies-problema presentes, tornando possível o direcionamento mais

  racional de recursos para a mitigação do risco. No Apêndice C é apresentado um exemplo

  da aplicação desta metodologia.

  5.5 Classificação do risco provocado pelas espécies-problema'
