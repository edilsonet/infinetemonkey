title: As espécies classificadas como “médio risco” requerem que medidas mitigadoras menos
text: '5.5.3 As espécies classificadas como “médio risco” requerem que medidas mitigadoras
  menos

  prementes e/ou de menor intensidade sejam implantadas (ou, no caso de revisão do PGRF,

  que as medidas mitigadoras já existentes devem ser mantidas e possivelmente

  incrementadas, e devem ser acompanhadas com frequência de modo a não permitir o

  aumento do risco).'
