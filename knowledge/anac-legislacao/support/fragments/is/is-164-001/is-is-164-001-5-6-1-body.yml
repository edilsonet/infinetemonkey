text: '5.6.1 As duas metodologias expostas por esta IS são complementares. Contudo, embora
  elas

  utilizem mesmas variáveis, é possível que haja distorções quando da aplicação de ambas,

  uma vez que a tabela apresentada no Apêndice B apresenta faixas absolutas de risco, ao

  passo que o método apresentado na subseção 5.4 é relativo, sem apresentar uma

  classificação pré-determinada de risco.31/07/2015 IS nº 164-001

  Revisão A'
