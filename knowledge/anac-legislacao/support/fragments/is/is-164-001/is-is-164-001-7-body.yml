title: DISPOSIÇÕES FINAIS
text: '7. DISPOSIÇÕES FINAIS

  7.1 O operador do aeródromo pode definir metodologia diferente da exposta nesta IS, desde

  que devidamente fundamentada e aceita pela ANAC conforme parágrafos 164.13(a)(4)(i) e

  164.35(a)(1) do RBAC 164.

  7.2 A ANAC poderá emitir parecer sobre qualquer análise de risco apresentada.

  7.3 Os casos omissos serão dirimidos pela ANAC.

  7.4 Esta IS entra em vigor na data de sua publicação.'
