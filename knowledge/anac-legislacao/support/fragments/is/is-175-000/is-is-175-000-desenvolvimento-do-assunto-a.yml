title: desenvolvimento-do-assunto(a)
text: '(a) a auditoria interna deverá ser realizada por pessoa(s) com curso de artigos perigosos

  válido na Categoria 6, conforme IS nº 175-002, e experiência na área. A organização

  requerente deverá descrever a experiência do(s) auditor(es), assim como comprovar seu

  treinamento;

  Nota: O(s) auditor(es) poderá(ão) ser funcionário(s) da própria organização requerente,

  desde que atenda(m) aos pré-requisitos descritos nesta IS. Caso contrário ou quando julgar

  necessário, a organização requerente poderá contratar um ou mais auditores externos

  (exemplo: instrutor credenciado de artigos perigosos).'
