title: desenvolvimento-do-assunto(b)
text: '(b) políticas referentes ao treinamento de artigos perigosos em seu PTO ou PTAP elaborados

  em conformidade com a IS nº 175-007.

  Tabela 1 - Documentos a serem entregues em função do tipo de operação

  OPERAÇÃO DOCUMENTOS

  Operador aéreo RBAC n° 121

  (independentemente da intenção de

  transportar ou não artigos perigosos como

  carga)

  • MAP elaborado em conformidade com a IS nº 175-006; e

  • PTAP elaborado em conformidade com a IS nº 175-007.

  Operador aéreo RBAC n° 135

  (que pretende transportar artigos perigosos

  como carga)

  • MAP elaborado em conformidade com a IS nº 175-006; e

  • PTAP elaborado em conformidade com a IS nº 175-007.

  Operador aéreo RBAC n° 135

  (que NÃO pretende transportar artigos

  perigosos como carga)

  • Políticas e procedimentos referentes à identificação e recusa de

  artigos perigosos não declarados e ao reporte de ocorrências

  com artigos perigosos em seu MGO elaborado em

  conformidade com a IS nº 135-002; e

  • Políticas referentes ao treinamento de artigos perigosos em seu

  PTO ou PTAP elaborados em conformidade com a IS nº 175-

  007.

  Operadores aéreos que estejam na condição elencada em A1.1.1.1.1(c) poderão apresentar

  apenas a atualização do documento que julgarem necessário. Por exemplo, um operador

  aéreo que deseje alterar ou atualizar apenas um procedimento de aceitação de artigo

  perigoso, que não gere impacto em assuntos relacionados a treinamento, deve apresentar

  apenas uma nova revisão de seu MAP, não sendo necessária a apresentação de uma nova

  revisão de seu PTAP.

  Durante esta fase, a ANAC irá conduzir uma avaliação preliminar dos documentos

  apresentados, com o objetivo de verificar se todos os manuais, programas e documentos

  requeridos foram entregues e se estão de acordo com o requerido pelos regulamentos

  aplicáveis. A lista completa de documentos encontra-se disponível nas IS nº 175-006 e 175-

  007.

  5.8 Fase 3 - Avaliação de documentos

  Durante a fase 3, a ANAC dará início a uma análise detalhada de todos os manuais,

  programas e documentos que foram apresentados pela organização requerente.

  A organização requerente será devidamente notificada, por meio de FOP 124 ou 224,

  conforme aplicável, ou outro meio de comunicação oficial, caso um manual, programa ouData
  de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  documento seja considerado incompleto ou deficiente ou, ainda, se for detectada alguma

  não-conformidade com relação à regulamentação aplicável e aos demais documentos de

  referência. As devidas correções deverão ser enviadas pela organização requerente à ANAC

  por meio de FOP 125 ou 225, conforme aplicável.

  Se os manuais, programas e documentos forem considerados satisfatórios, eles serão aceitos

  ou aprovados, conforme o caso, por meio de FOP 111 ou 211, conforme aplicável, ou outro

  meio de comunicação oficial, emitido separadamente para cada manual, programa ou

  documento avaliado, à medida que os servidores encarregados da análise do material forem

  encerrando seus trabalhos de avaliação.

  A emissão do FOP 111 ou 211, conforme aplicável, não significa que a organização

  requerente esteja autorizada para o início de suas operações de acordo com as políticas
  e

  procedimentos estabelecidos no manual ou programa aprovado. A autorização para o início

  das operações de acordo com o manual ou programa aprovado somente pode ocorrer após

  conclusão da fase 5 do processo de certificação.

  O prazo para análise e eventual aceitação ou aprovação de determinado manual, programa

  ou documento dependerá do atendimento satisfatório, em termos de conteúdo e tempo, pela

  organização requerente, das deficiências e não-conformidades apontadas pela ANAC.

  Nota: Respostas insatisfatórias às deficiências e não-conformidades apontadas pela ANAC

  poderão gerar atrasos na certificação.

  5.9 Fase 4 - Demonstrações e inspeções

  Durante a fase 4, a ANAC constatará se uma organização requerente de um processo de

  certificação para o transporte de artigos perigosos consegue demonstrar sua capacidade de

  cumprir com os requisitos regulamentares e com as práticas operacionais seguras antes de

  iniciar suas operações relacionadas ao transporte de artigos perigosos.

  Não haverá inspeção de certificação específica para o transporte de artigos perigosos no
  caso

  de organizações requerentes que optem por não transportar artigos perigosos como carga.

  Sendo assim, os itens desta IS referentes às atividades da Fase 4 não são aplicáveis a estas

  organizações requerentes. Entretanto, outras inspeções de certificação da ANAC poderão

  verificar aspectos relacionados a artigos perigosos, como treinamento, emergência, dentre

  outros.

  Para organizações requerentes que optarem pelo transporte de artigos perigosos como carga,

  a fase 4 inicia-se com o encerramento formal da fase 3. A ANAC entrará em contato com a

  organização requerente por meio de comunicação oficial, informando sobre a documentação

  que deverá ser encaminhada.

  A organização requerente deverá, então, protocolar os seguintes documentos para a

  continuidade do processo:'
