title: DESENVOLVIMENTO DO ASSUNTO
text: 'DESENVOLVIMENTO DO ASSUNTO

  5.1 Aplicabilidade

  Esta IS define e estabelece as etapas do processo de certificação de operadores aéreos para

  o transporte de artigos perigosos.

  Esta IS aplica-se a todos os operadores aéreos certificados segundo o RBAC n° 119,

  independentemente de sua intenção de pleitear uma autorização para o transporte de artigos

  perigosos como carga.

  A expressão “certificação para o transporte de artigos perigosos” é ampla e não se restringe

  ao processo de autorização para transportar artigos perigosos como carga, incluindo também

  o transporte de carga não classificada como artigo perigoso e ainda o transporte de artigos

  perigosos sob regime de exceção por passageiros, tripulantes e como mala postal.

  Todo operador aéreo segundo o RBAC n° 119 deve possuir procedimentos específicos para

  o transporte de artigos perigosos, mesmo que opte por não transportar artigos perigosos

  como carga. Isso se deve ao fato de artigos perigosos estarem sempre presentes na operação

  (exemplo: artigos perigosos transportados pelos passageiros ou tripulantes sob regime de

  exceção, tais como telefones celulares e notebooks).

  O operador aéreo regido por outros regulamentos, como o RBAC n° 90, o RBAC n° 91, o

  RBAC-E 94, dentre outros, pode estar sujeito a um ou mais procedimentos definidos nesta

  IS quando solicitar à ANAC qualquer tipo de autorização, em caráter especial, para o

  transporte de artigos perigosos.Data de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  Esta IS não se aplica a operadores aéreos regidos pelo RBAC n° 129. O processo de

  certificação de artigos perigosos de operadores aéreos estrangeiros, assim como a análise
  de

  seus manuais, é realizado pelo país daquele operador aéreo.

  Conforme determina o RBAC n° 175, em 175.397(a), artigos perigosos somente podem ser

  transportados como carga em conformidade com autorização descrita nas EO (ou em outro

  documento aplicável, no caso de serviços aéreos privados). Esta autorização é dada por meio

  de um processo de certificação para o transporte de artigos perigosos como carga.

  O processo de certificação para a organização requerente que opte pelo transporte de artigos

  perigosos como carga possui maior grau de complexidade e envolve uma análise mais

  detalhada de suas políticas e procedimentos por parte da ANAC.

  Operadores aéreos que pretendam incluir ou já possuam em suas EO autorização para o

  transporte de artigos perigosos como carga podem solicitar que essa autorização seja restrita

  a algumas classes ou divisões de perigo, a alguns artigos perigosos ou a condições

  específicas. Por exemplo:'
