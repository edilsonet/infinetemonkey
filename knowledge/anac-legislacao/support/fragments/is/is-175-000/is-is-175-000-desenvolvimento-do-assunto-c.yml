text: '(c) quando a organização requerente, um operador aéreo já constituído e autorizado
  pela

  ANAC anteriormente, pleiteia apenas a alteração de suas políticas e procedimentos sem a

  necessidade de alteração de suas EO (exemplo: operador aéreo já autorizado para o

  transporte de artigos perigosos como carga quer atualizar um ou mais procedimentos em seu

  MAP).

  O processo de certificação para o transporte de artigos perigosos possui cinco fases e tem

  duração variável, de acordo com a complexidade da operação escolhida e com a agilidade

  da apresentação e precisão dos documentos e respostas da organização requerente a

  solicitações, questionamentos e não-conformidades apontadas pela ANAC. Sua descrição

  resumida é:'
