title: desenvolvimento-do-assunto(h)
text: '(h) a equipe de auditoria interna deverá avaliar se a organização requerente possui

  funcionários treinados em artigos perigosos conforme preconiza o seu PTAP. As evidências

  do treinamento deverão ser anexadas ao relatório de auditoria interna, incluindo-se o controle

  de treinamento e os certificados dos funcionários em atendimento à IS nº 175-007.

  (1) Deve haver no mínimo um funcionário com treinamento para aceitação de artigos

  perigosos;

  (2) todos os tripulantes deverão possuir treinamento de artigos perigosos;

  (3) todos os funcionários de manuseio e carregamento deverão possuir treinamento de

  artigos perigosos;Data de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  (4) caso o operador aéreo tenha optado pela expedição de COMAT classificado como

  artigo perigoso, deve haver no mínimo um funcionário com treinamento para expedição de

  artigos perigosos; e

  (5) o treinamento deve seguir o PTAP aprovado;'
