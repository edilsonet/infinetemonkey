title: desenvolvimento-do-assunto(k)
text: '(k) a equipe de auditoria interna deverá verificar se os funcionários da organização

  requerente são capazes de lidar com emergência com artigos perigosos. Isso inclui verificar

  o conhecimento dos funcionários a respeito dos procedimentos de emergência disponíveis

  no MAP e também a disponibilidade dessa informação à tripulação durante o voo;'
