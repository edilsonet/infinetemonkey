title: desenvolvimento-do-assunto(p)
text: '(p) o relatório de auditoria interna deverá ser datado e assinado pela(s) pessoa(s)
  definida(s)

  no item 5.9.4A1.1.1.1.1(a).

  Após o recebimento da documentação, a ANAC avaliará o conteúdo e as evidências que

  comprovem as afirmativas encaminhadas no relatório de auditoria interna. A presença de

  não conformidades poderá exigir ações corretivas, emissão de autorização parcial ou o

  encerramento do processo de certificação sem a emissão de autorização para o transporte
  de

  artigos perigosos como carga.

  Com base na documentação recebida, a ANAC definirá a necessidade de uma inspeção de

  certificação in loco.Data de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  A execução da inspeção de certificação in loco estará sujeita à cobrança de TFAC, que será

  informada no momento de seu agendamento.

  As demonstrações devem representar, no cenário mais próximo possível da realidade, as

  atividades que o operador aéreo poderá realizar após a certificação para o transporte de

  artigos perigosos como carga.

  Durante as demonstrações e inspeções, os servidores da ANAC avaliarão a efetividade das

  políticas, métodos, procedimentos e instruções aplicáveis, com ênfase na efetividade do

  sistema de gerenciamento adotado, conforme descrito nos manuais, programas e documentos

  apresentados para a certificação.

  As deficiências e não-conformidades identificadas durante as demonstrações serão

  comunicadas por meio de FOP 109 ou 209, conforme aplicável, ou outro meio de

  comunicação oficial à organização requerente. As correções deverão ser apresentadas por

  meio de FOP 123 ou 223, conforme aplicável, e, eventualmente, será requerida nova

  demonstração para comprovação da efetividade das correções. Todas as deficiências e não-

  conformidades deverão estar corrigidas para permitir a aprovação na respectiva inspeção
  na

  qual foram identificadas.

  Nos casos em que seja necessária a inspeção de certificação in loco, somente depois de ter

  sido aprovada em todas as demonstrações e inspeções a que foi submetida pela ANAC, uma

  organização requerente terá demonstrado satisfatoriamente sua capacidade de operar com

  segurança conforme requerido.

  5.10 Fase 5 - Certificação

  Após as quatro fases anteriores terem sido concluídas, a ANAC incluirá as informações

  sobre a certificação para o transporte de artigos perigosos nas EO, o que representa

  efetivamente a autorizaçao da organização requerente para a realização do transporte de

  artigos perigosos.

  No caso de organizações requerentes que se enquadrem em A1.1.1.1.1(c), não há

  necessidade de alteração de EO.

  Caso a ANAC entenda que há um ou mais procedimentos descritos no MAP que não possam

  ser executados pelo operador aéreo em certificação, devido a suas características

  operacionais, a autorização poderá ser negada ou emitida de forma parcial. Caso contrário,

  será emitida uma autorização integral, sempre restrita às políticas e procedimentos dispostos

  no MAP do operador aéreo.

  Após a alteração das EO na fase 5, o operador aéreo poderá transportar artigos perigosos
  em

  conformidade com os requisitos da regulamentação vigente e com os procedimentos

  aprovados em seus manuais e programas e estará sujeito às atividades de vigilância

  continuada referente a artigos perigosos realizadas pela ANAC.

  A partir desse momento, o operador aéreo poderá distribuir, inclusive em outros manuais
  e

  programas da empresa, as políticas e procedimentos relacionados ao transporte aéreo de

  artigos perigosos, garantindo que reflitam sempre o aprovado na revisão mais recente dos

  manuais e programas aprovados ou aceitos pela ANAC.Data de emissão: 17 de março de 2021

  IS nº 175-000

  Revisão B

  O operador aéreo autorizado a transportar artigos perigosos como carga que não observar
  os

  requisitos da regulamentação em vigor, incluindo a não notificação do transporte de artigos

  perigosos, o uso de funcionários não treinados na operação e a não atualização de seu MAP,

  dentre outros, poderá ter sua autorização suspensa cautelarmente a qualquer momento, nos

  termos da Resolução nº 472, de 06 de junho de 2018.

  5.11 Encerramento compulsório do processo de certificação

  Qualquer processo relacionado à certificação para o transporte de artigos perigosos,

  incluindo-se o de análise de MAP ou de PTAP, seguirá estritamente as regras de

  encerramento compulsório definidas nas IS nº 119-001 ou 119-004, conforme aplicável.'
