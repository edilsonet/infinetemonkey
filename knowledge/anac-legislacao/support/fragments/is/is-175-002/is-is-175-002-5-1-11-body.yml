text: '5.1.11 Padrão de competência: nível de desempenho definido como aceitável ao avaliar
  se as competências foram ou não atingidas.

  5.1.12 Tarefa de artigos perigosos: trabalho, manual ou intelectual, que se faz necessário
  para que os artigos perigosos sejam devidamente classificados, documentados, certificados,
  descritos, embalados, marcados, etiquetados, aceitos, manuseados e transportados de acordo
  com a procedimentos estabelecidos pela regulamentação vigente.

  5.1.13 Treinamento de artigos perigosos: processo de capacitação no qual um conteúdo teórico
  sobre transporte aéreo de artigos perigosos é apresentado, em consonância com determinado
  modelo de competências adaptado, adequado à(s) função(ões) e competências esperadas de cada
  indivíduo, juntamente com o conteúdo prático e procedimental, em conformidade com as políticas
  e instruções de trabalho adotadas pela organização em nome da qual o indivíduo exerça as
  funções sob sua responsabilidade.

  5.1.14 Treinamento e avaliação baseados em competência: treinamento e avaliação que são
  caracterizados pela orientação em desempenho, ênfase nos padrões de desempenho e em sua
  mensuração e no desenvolvimento de treinamento para os padrões de desempenho especificados.

  5.1.15 Treinamento inicial: treinamento de artigos perigosos ministrado para indivíduos
  que nunca tenham realizado o treinamento de artigos perigosos, que não tenham o treinamento
  correspondente às funções pelas quais são responsáveis, ou que possuam certificado vencido
  há mais de 30 (trinta) dias.

  5.1.16 Treinamento periódico: treinamento de artigos perigosos ministrado para indivíduos
  que tenham realizado o treinamento inicial correspondente às funções pelas quais são responsáveis,
  e que possuam certificado válido, ou que esteja vencido há menos de 30 dias, assegurando
  que o conhecimento se mantenha atualizado.

  Nota: os 30 dias mencionados nas definições anteriores dizem respeito à possibilidade de
  o aluno realizar ou não um treinamento periódico no momento da renovação de um certificado
  vencido ou que está prestes a vencer. Um certificado é considerado vencido a partir do momento
  de sua expiração, não existindo prorrogação.'
