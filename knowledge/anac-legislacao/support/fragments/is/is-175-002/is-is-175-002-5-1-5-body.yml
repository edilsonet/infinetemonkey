text: '5.1.5 Condições: qualquer aspecto que possa qualificar um ambiente específico no qual
  a competência será demonstrada.

  5.1.6 Critérios de desempenho: parâmetros usados para avaliar se os níveis de desempenho
  exigidos para uma determinada competência foram alcançados. O critério de desempenho compreende
  comportamento observável (vide item 5.1.4), condições (vide item 5.1.5) e padrão de competência
  (vide item 5.1.10).

  5.1.7 Empregador: a empresa, individual ou coletiva, que, assumindo os riscos da atividade
  econômica, admite, assalaria e dirige a prestação pessoal de serviço relacionado, mas não
  limitado à classificação, marcação, etiquetagem, embalagem, documentação, aceitação, armazenamento,
  carregamento, descarregamento, inspeção e transporte de artigos perigosos.

  5.1.8 Estrutura de competências da ANAC: grupo selecionado de competências para uma determinada
  disciplina da aviação. Cada competência possui uma descrição associada e comportamentos
  observáveis.

  5.1.9 Instrutor de artigos perigosos: pessoa física credenciada pela ANAC, de acordo com
  o RBAC nº 175 e IS nº 175-013, responsável por ministrar o treinamento e avaliação de artigos
  perigosos baseados em competência de acordo com os requisitos estabelecidos pela ANAC e
  com o Programa de Treinamento e Avaliação de Artigos Perigosos (PTAP) da organização contratante,
  quando aplicável.

  5.1.10 Modelo de competências adaptado: grupo de competências com suas descrições associadas
  e critérios de desempenho adaptados a partir de uma estrutura de competências definida pela
  ANAC que uma organização utiliza para desenvolver o treinamento e avaliação baseados em
  competência para uma determinada função.'
