text: '6.2.5 Nas recomendações se utiliza o termo “deveria” ou “recomenda-se”, ou “não deveria”,
  no caso negativo.

  6.2.6 Toda referência feita a qualquer parte desta Instrução Suplementar ou de outro documento
  internacional, identificada por um número, uma letra ou um título, compreende todas as subdivisões
  dessa parte.'
