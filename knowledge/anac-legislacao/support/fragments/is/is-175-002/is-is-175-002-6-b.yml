title: 6(b)
text: 'b) são utilizados números seguidos por hífen e número romano (em letra maiúscula).

  6.2.4 No texto desta IS, o uso do verbo “deve” (ou “não pode”, no caso negativo) indica
  os meios e procedimentos previamente especificados de cumprimento do RBAC nº 175. Este verbo
  não constitui impedimento a que seja apresentado meio ou procedimento alternativo, devidamente
  justificado, exigindo-se, nesse caso, a análise e concordância expressa do órgão competente
  da ANAC, em conformidade com a seção 3 desta IS. Observa-se que, em alguns casos, como o
  texto provém do RBAC (conforme indicado pela referência ao parágrafo do RBAC, entre colchetes,
  ao final do texto), pode ser requerida uma autorização especial nos termos do parágrafo
  175.1(d) do RBAC nº 175 ou uma isenção de acordo com o RBAC nº 11.'
