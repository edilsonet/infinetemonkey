text: '6. DESENVOLVIMENTO DO ASSUNTO

  6.1 Disposições Gerais

  6.1.1 Um sistema seguro e eficiente de transporte aéreo depende de uma força de trabalho
  competente. Isso pode ser atingido por meio da implementação de uma abordagem baseada em
  competência para o treinamento e avaliação.

  6.1.2 O RBAC nº 175, parágrafo 175.53(a), requer que os empregadores garantam que seus funcionários
  sejam competentes para desempenhar cada função pela qual são responsáveis antes de desempenhar
  essa função. A abordagem baseada em competência para o treinamento e avaliação é o meio
  aceitável para garantir que tal requisito seja observado.

  6.1.3 A aplicação bem-sucedida da regulamentação referente ao transporte aéreo de artigos
  perigosos e a realização dos seus objetivos dependem, em grande parte, de que todas as pessoas
  envolvidas compreendam devidamente os riscos relacionados a esse transporte, bem como da
  compreensão detalhada dos regulamentos. Isso só pode ser alcançado por meio de treinamento
  e avaliação eficientes.

  6.2 Introdução

  6.2.1 Conforme previsto no parágrafo 175.1(a)(1) do RBAC nº 175, esta IS está alinhada com
  os padrões estabelecidos pela Organização da Aviação Civil Internacional - OACI, exceto
  se de outra forma determinado pela ANAC.

  6.2.2 Os apêndices A a F desta IS correspondem, respectivamente, aos Capítulos 1 a 5 e ao
  Apêndice A do Capítulo 5 do Doc 10147 - Guidance on a Competency-based Approach to Dangerous
  Goods Training and Assessment da OACI, com variações pontuais de conteúdo (tais como as
  necessárias para implementação das variações de país declaradas pelo Brasil) ou de apresentação.

  6.2.3 A numeração dos itens dentro de cada apêndice busca ser equivalente à numeração do
  Doc 10147 da OACI. Nos casos em que se utilizem textos que não possuem correspondente no
  Doc 10147 da OACI:'
