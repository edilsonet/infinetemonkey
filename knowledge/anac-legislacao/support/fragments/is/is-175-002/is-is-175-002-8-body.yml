title: DISPOSIÇÕES FINAIS
text: '8. DISPOSIÇÕES FINAIS

  8.1 Todos os treinamentos de artigos perigosos ministrados de acordo com qualquer modelo
  anterior permanecem aceitos e válidos até a data de vencimento de seus certificados.

  8.2 As disposições previstas nesta IS podem, a critério do empregador, serem implementadas
  antecipadamente ao período de vigência desta norma.

  8.3 Os casos omissos serão dirimidos pela SPO.'
