title: Objetivo
text: 'A2.1 Objetivo

  A2.1.1 O objetivo do treinamento e avaliação baseados em competência é garantir uma força
  de trabalho competente ao ministrar treinamentos focados. Isso ocorre por meio da identificação
  de competências chave que devem ser alcançadas, determinando-se a forma mais efetiva de
  alcançá-las e estabelecendo-se ferramentas válidas e confiáveis, para avaliar se essas competências
  foram alcançadas.'
