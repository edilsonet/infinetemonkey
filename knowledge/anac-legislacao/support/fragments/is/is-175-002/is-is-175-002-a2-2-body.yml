title: Histórico
text: 'A2.2 Histórico

  A2.2.1 O treinamento baseado em competência é uma metodologia desenvolvida na década de
  1950, tendo sua aplicação em maior escala iniciada somente a partir da década de 1980. O
  treinamento baseado em competência foi aplicado em diferentes contextos e áreas de trabalho
  e, por esse motivo, é comum haver diferentes definições para os termos “competência” e “treinamento
  baseado em competência”. Esta Seção descreve os conceitos de competências que serão utilizados
  ao longo desta IS.'
