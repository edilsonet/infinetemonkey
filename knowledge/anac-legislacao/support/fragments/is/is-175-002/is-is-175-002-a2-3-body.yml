title: O que é uma competência
text: 'A2.3 O que é uma competência

  A2.3.1 Uma competência é uma dimensão de desempenho humano utilizada para prever, de maneira
  confiável, um desempenho bem-sucedido na execução de tarefas. É manifestada e observada
  por meio de comportamentos que mobilizam os conhecimentos, habilidades e atitudes relevantes
  para o desempenho de atividades ou tarefas em determinadas situações específicas.

  Nota: para maiores informações consultar a definição contida no item 5.1.3.

  A2.3.2 Um padrão de competência é um nível de desempenho definido como aceitável ao avaliar
  se uma competência foi ou não alcançada.'
