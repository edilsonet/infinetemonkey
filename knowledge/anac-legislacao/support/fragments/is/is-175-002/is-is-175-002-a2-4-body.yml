title: Conhecimentos, habilidades e atitudes
text: 'A2.4 Conhecimentos, habilidades e atitudes

  A2.4.1 Desenvolver as competências (Conhecimentos, Habilidades e Atitudes - CHA) necessárias
  para executar determinada tarefa é essencial para o treinamento e avaliação baseados em
  competência.

  A2.4.2 Conhecimento - Informação específica necessária para permitir que um aprendiz desenvolva
  e aplique habilidades e atitudes para recordar fatos, identificar conceitos, aplicar normas
  ou princípios, resolver problemas e pensar de maneira criativa no contexto de seu trabalho.
  O conhecimento é o resultado do processo de aprendizado, independentemente de o aprendizado
  ter ocorrido de maneira formal ou informal. Existem diferentes tipos de conhecimento: declarativo
  (exemplo: fatos e dados não manipulados), procedimental (exemplo: categorizado/contextualizado
  e aplicação de regras do tipo se/então), estratégico (exemplo: síntese, inferência para
  coordenar alocação de recursos para tomada de decisão, resolução de problemas e ação comportamental)
  e adaptativo (exemplo: generalização, inovação e invenção)

  A2.4.3 Habilidade - Habilidade de se executar uma atividade ou ação. Normalmente se divide
  em três tipos: motora, cognitiva e metacognitiva. Uma habilidade motora é um movimento intencional,
  envolvendo um componente motor ou muscular, que deve ser aprendido e voluntariamente produzido
  para executar, de forma proficiente, uma tarefa orientada para um objetivo. Uma habilidade
  cognitiva é qualquer habilidade mental utilizada no processo de aquisição de conhecimento,
  como raciocínio, percepção e intuição. Uma habilidade metacognitiva está relacionada à habilidade
  de um aprendiz em monitorar e direcionar seus próprios processos de aprendizado (“thinking
  about thinking”), por exemplo, o planejamento de como realizar o aprendizado de uma tarefa
  que se deve aprender a realizar, o monitoramento da compreensão e a avaliação do progresso
  de uma tarefa.

  A2.4.4 Atitude - Estado ou disposição mental persistente interno que influencia nas escolhas
  de um indivíduo com relação às suas ações pessoais sobre determinados objetos, pessoas ou
  eventos que podem ser aprendidos. Atitudes possuem componentes afetivos, aspectos cognitivos
  e consequências comportamentais. Para demonstrar a atitude “correta”, um aprendiz necessita
  saber como se portar em determinado contexto.

  A2.4.5 Exemplos de CHA aplicáveis ao pessoal envolvido com o transporte de artigos perigosos
  incluem:

  Conhecimento

  - As nove classes de artigos perigosos

  - Informação requerida na declaração do expedidor para artigos perigosos.

  - Componentes de um checklist de aceitação

  Habilidades

  - Como determinar se a substância ou material é classificado como artigo perigoso

  - Como preencher a documentação de artigos perigosos

  - Como verificar um volume (exemplo: o volume pode ser aceito para transporte?)

  Atitudes

  - Estar motivado para garantir a segurança operacional e cumprir a regulamentação

  aplicável

  - Querer aderir à regulamentação ao realizar questionamentos relevantes e efetivos

  - Receber feedback de membros da equipe (exemplo: adaptar-se perante uma situação para a
  qual não haja procedimento definido)

  A2.4.6 A execução de uma tarefa de artigos perigosos pode requerer diferentes níveis de
  CHA, dependendo da complexidade da tarefa específica e do ambiente operacional. Um nível
  de proficiência é uma forma de determinar o quão crítico é o conhecimento, a habilidade
  ou a atitude para que se complete uma tarefa com sucesso. Quando utilizado, o conceito de
  nível de proficiência pode ser bastante útil para determinar as áreas principais que devem
  ser enfatizadas durante o treinamento e avaliação. Para definir o nível proficiência do
  conhecimento, habilidade ou atitude do funcionário, o empregador deve levar em consideração
  a complexidade da tarefa ou subtarefa, sua criticalidade e a autonomia do funcionário ao
  executá-la. Conhecimentos, habilidades e atitudes podem se desenvolver ao longo do tempo
  e com a prática, possibilitando que pessoal qualificado realize tarefas mais difíceis e
  que exijam mais responsabilidades.'
