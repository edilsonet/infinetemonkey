text: 'A2.6 Estrutura de competências adotada pela ANAC, modelo de competências adaptado e
  lista de tarefas

  A2.6.1 A abordagem tradicional para o desenvolvimento de treinamentos envolve a divisão
  das atividades em tarefas. Para cada tarefa há um objetivo relacionado, uma avaliação e
  elementos associados a um plano ou plano de treinamento. A limitação dessa abordagem é que
  cada tarefa deve ser ensinada e avaliada. Em sistemas complexos ou quando as atividades
  evoluem rapidamente, pode não ser possível ensinar e avaliar cada tarefa. Adicionalmente,
  os aprendizes podem demonstrar a habilidade de executar tarefas isoladamente sem serem competentes
  para executar a atividade como um todo. O treinamento e avaliação baseados em competência
  estão pautados no conceito de que as competências são transferíveis. No projeto de um programa
  de treinamento e avaliação baseados em competência, o objetivo do treinamento e das tarefas
  associadas com esse propósito são identificados e um número limitado de competências é definido.
  No projeto de treinamento e da avaliação, tarefas e atividades são incorporadas porque são
  úteis para facilitar, desenvolver ou avaliar uma ou diversas competências. De maneira geral,
  uma tarefa envolve diversas competências e as competências podem ser aplicáveis a um contexto
  de várias tarefas e configurações. Tarefas específicas podem ser utilizadas para desenvolver
  competências específicas. A ausência de competências específicas pode ser identificada como
  a causa raiz da falha de desempenho de uma tarefa. Uma lista genérica de tarefas normalmente
  executadas por pessoal de artigos perigosos está disponível no Apêndice D. Os empregadores
  podem usar essa lista para desenvolver especificações de treinamento para seu pessoal. Os
  registros de treinamento e avaliação exigidos pelo parágrafo 175.57 do RBAC nº 175, detalharão
  as tarefas e subtarefas da lista de tarefas para as quais as competências tenham sido demonstradas,
  de forma a facilitar uma verificação de que treinamento e avaliação apropriados foram realizados.

  A2.6.2 O modelo de competências provê formas de definir competências identificando aquelas
  que são necessárias para uma determinada função, descrevendo-as e fornecendo critérios para
  cada uma delas. A estrutura de competências adotada pela ANAC para o pessoal de artigos
  perigosos está disponível no Apêndice C desta IS. Essa lista traz o conjunto de competências
  normalmente necessárias para executar as tarefas de artigos perigosos identificadas na lista
  de tarefas disponível no Apêndice D desta IS. Os empregadores podem adaptar essa estrutura
  em outros modelos de competência que atendam ao ambiente regulatório, operacional técnico
  e organizacional no qual seus funcionários executam as tarefas. Esse modelo customizado
  é chamado nesta IS de “modelo de competências adaptado”, que é, dessa forma, utilizado para
  desenvolver o treinamento e avaliação baseados em competência para uma dada função. Orientações
  sobre como desenvolver um modelo de competências adaptado estão disponíveis no Apêndice
  B desta IS.

  A3. Desenvolvimento do treinamento e avaliação baseados em competência'
