id: is-is-175-002-a3-1-body
kind: is
document: is-175-002
family: '175'
section_id: A3.1
section_title: O Desenho de Sistema Instrucional (DSI) é um processo sistemático para projetar
  e desenvolver treinamentos. Existem diversos modelos DSI que podem ser utilizados para projetar
  o treinamento e avaliação baseados em competência. A estrutura ADDIE (análise, desenho,
  desenvolvimento, implementação e avaliação) é comum a todos os modelos DSI. O Apêndice B
  desta IS orienta como projetar treinamento e avaliação de artigos perigosos baseados em
  competência utilizando-se a estrutura de competências da ANAC para o pessoal de artigos
  perigosos e o modelo ADDIE.
