title: Empregador
text: 'A4.1 Empregador

  A4.1.1 O programa de treinamento inclui elementos como a metodologia de projeto, treinamento
  inicial e periódico, avaliação, qualificações e competências do instrutor, registro de treinamento
  e avaliação da efetividade. Os empregadores necessitam determinar qual o propósito e objetivo
  do programa de treinamento baseado em competência, com base nas funções pelas quais seus
  funcionários são responsáveis. Os empregadores devem garantir que o treinamento seja projetado
  e desenvolvido para estabelecer ligações claras entre as competências a serem alcançadas,
  os objetivos da aprendizagem, os métodos de avaliação e os materiais didáticos.

  A4.1.2 O empregador deve estudar qual o público-alvo (futuros alunos) tendo em mente identificar
  as CHA que ele já possui, coletar informação sobre o método preferido de aprendizado e sobre
  o ambiente social e linguístico dos alunos. O público-alvo pode ser uma mistura de pessoal
  mais experiente e pessoal recém-contratado, grupos de diferentes idades etc. Todos esses
  componentes podem ter impacto no projeto do treinamento. Empregadores devem também considerar
  os requisitos regulatórios nacionais e internacionais aplicáveis a suas operações.

  A4.1.3 Alguns empregadores podem utilizar terceiros para auxiliá-los. Essa pode ser a abordagem
  mais indicada para aqueles que não possuem instrutores de artigos perigosos para treinar
  seu próprio pessoal. Por mais efetiva que venha a ser em termos de custo, a decisão de utilizar
  instrutores de artigos perigosos externos deve ser tomada levando-se em conta se as necessidades
  do treinamento serão atendidas e não somente com base no custo. Deve se levar em consideração
  a possibilidade de que um instrutor de artigos perigosos externo, que atenda às necessidades
  de treinamento de múltiplos empregadores, acabe por não direcionar todas as competências
  necessárias de cada funcionário, de forma específica. Os empregadores continuam sendo responsáveis
  por garantir que seu pessoal seja competente para cumprir suas funções antes de executá-las,
  mesmo que alguns aspectos do programa de treinamento venham a ser delegados a terceiros.

  A4.1.4 Empregadores devem estar a par das normas da ANAC, de forma a garantir que os requisitos
  mais recentes sejam atendidos antes de começar a desenvolver um treinamento baseado em competência.'
