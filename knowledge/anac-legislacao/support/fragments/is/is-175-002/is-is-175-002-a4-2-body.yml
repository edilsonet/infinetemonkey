title: Instrutor
text: 'A4.2 Instrutor

  A4.2.1 No treinamento baseado em competência, os instrutores são responsáveis por facilitar
  o progresso do aluno na conquista das competências. Os instrutores também devem apoiar a
  melhoria contínua ao coletar informações sobre a efetividade dos materiais de treinamento.
  As competências dos instrutores podem ser encontradas no item 6.2 da 175-013.'
