title: Aluno
text: 'A4.3 Aluno

  A4.3.1 No treinamento baseado em competência, os alunos são participantes ativos em seu
  próprio processo de aprendizagem e na conquista de competências, ao invés de simplesmente
  atuarem como receptores passivos de conhecimento. O programa de treinamento baseado em competência
  deve fornecer aos alunos uma ideia clara de seu processo de aprendizagem para atingir as
  competências. O treinamento baseado em competência deve contribuir de forma direta para
  a melhoria de desempenho em suas atividades. O feedback dos alunos é essencial para garantir
  que o treinamento baseado em competência seja efetivo.'
