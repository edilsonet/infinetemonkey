text: 'A4.4 ANAC

  A4.4.1 A ANAC passa a avaliar o programa de treinamento de modo a garantir que ele forme
  pessoal que possa executar as funções pelas quais são responsáveis em um ambiente operacional
  específico e de acordo com o arcabouço regulamentar.

  Nota: a IS nº 175-007 estabelece orientações para o desenvolvimento de programas de treinamento
  de artigos perigosos.

  A5. Relação entre o treinamento e avaliação baseados em competência e o gerenciamento da
  segurança operacional'
