section_id: A5.1
section_title: Antes de discutir sobre o treinamento e avaliação baseados em competência,
  é importante entender sua relação com o gerenciamento da segurança operacional. A base para
  o gerenciamento da segurança operacional é a implementação do Programa Brasileiro para a
  Segurança Operacional da Aviação Civil (PSO-BR) no Brasil e o Sistema de Gerenciamento da
  Segurança Operacional (SGSO) de cada um dos Provedores de Serviço de Aviação Civil (PSAC),
  onde estão incluídos operadores aéreos de aeronaves autorizados a conduzir operações de
  serviço de transporte aéreo. O SGSO dos operadores deve endereçar as atividades de aviação
  relacionadas à operação segura da aeronave nos termos dos RBAC nº91, RBAC nº 121 e RBAC
  nº 135. Dentre essas atividades, inclui-se o transporte de artigos perigosos. É recomendável
  a implementação de um SGSO por parte de outras entidades envolvidas no transporte aéreo,
  tais como agências de carga aérea e empresas de ground handling. Outras entidades podem
  voluntariamente implementar o SGSO.
