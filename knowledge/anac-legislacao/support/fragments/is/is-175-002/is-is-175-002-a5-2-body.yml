id: is-is-175-002-a5-2-body
kind: is
document: is-175-002
family: '175'
section_id: A5.2
section_title: A implantação do SGSO requer que todo o pessoal entenda a filosofia de segurança
  operacional e defenda uma abordagem disciplinada e padronizada ao SGSO. Todos devem compreender
  suas funções e responsabilidades e possuir as competências necessárias para realizar suas
  funções dentro do SGSO. Para garantir que o pessoal tenha o conhecimento, as habilidades
  e as atitudes necessárias para apoiar o SGSO, as atividades de treinamento devem seguir
  a abordagem de treinamento por competências. A ANAC recomenda que outras entidades da cadeia
  de suprimentos de transporte de artigos perigosos também implementem um sistema similar
  de segurança operacional.
