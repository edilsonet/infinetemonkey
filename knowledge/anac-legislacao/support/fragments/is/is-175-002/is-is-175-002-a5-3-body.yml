section_id: A5.3
section_title: O modelo “queijo suíço” de causalidade de acidentes propõe que sistemas complexos
  de aviação são extremamente bem defendidos por barreiras, fazendo com que falhas em pontos
  específicos raramente gerem consequências nesses sistemas. O modelo demonstra que acidentes
  envolvem sucessivas falhas em múltiplas barreiras e que todos os acidentes incluem uma combinação
  de condições ativas (ações ou omissões que tenham um efeito imediato adverso) e de condições
  latentes (condições que existem no sistema de aviação muito antes de um efeito danoso ocorrer).
  O treinamento é uma das barreiras principais para os sistemas de aviação, e as deficiências
  de treinamento são consideradas como condições latentes.
