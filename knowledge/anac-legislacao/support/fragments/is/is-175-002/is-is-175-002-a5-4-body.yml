document: is-175-002
family: '175'
section_id: A5.4
section_title: A melhoria contínua é um componente comum tanto ao gerenciamento da segurança
  operacional quanto ao treinamento e avaliação baseados em competência. Dados de diferentes
  fontes deveriam ser utilizados para melhorar o programa de treinamento e solucionar quaisquer
  deficiências. Para entidades que possuem um Sistema de Gerenciamento da Segurança Operacional
  (SGSO), seu programa de treinamento e avaliação baseados em competência deveria estar integrado
  ao ciclo de melhoria contínua de seu SGSO.
