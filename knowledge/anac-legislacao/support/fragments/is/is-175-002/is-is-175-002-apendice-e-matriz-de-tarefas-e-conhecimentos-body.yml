title: APÊNDICE E - MATRIZ DE TAREFAS E CONHECIMENTOS
text: 'APÊNDICE E - MATRIZ DE TAREFAS E CONHECIMENTOS

  E1. Este Apêndice apresenta a matriz de tarefas e conhecimentos que pode ser utilizada como
  ferramenta para mapear o conhecimento necessário para executar certas tarefas. Tarefas correspondentes
  àquelas que foram apresentadas no Apêndice D são listadas ao longo das colunas da tabela
  e os elementos de conhecimento estão listados nas linhas. O empregador deve indicar quais
  conhecimentos são necessários para cada uma das tarefas da organização em particular. Isso
  deve ser feito marcando-se um “X” nos pontos em que há interseção entre determinada tarefa
  e o conhecimento necessário para executá-la. Para facilitar esse processo, alguns componentes
  foram marcados na cor cinza, caso tenha se considerado que eles são conhecimentos irrelevantes
  para as tarefas indicadas.'
