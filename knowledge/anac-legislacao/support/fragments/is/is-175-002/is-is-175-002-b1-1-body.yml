  B2. Componentes do programa de treinamento e avaliaç&aatilde;o baseados em competência

  B2.1.1 O objetivo do treinamento e avaliação de artigos perigosos baseados em competência
  é prover uma força de trabalho competente para o transporte seguro e eficiente de artigos
  perigosos por via aérea. Os seguintes componentes, que são ilustrados na Figura 1, são essenciais
  para que seja atingido tal objetivo:'
