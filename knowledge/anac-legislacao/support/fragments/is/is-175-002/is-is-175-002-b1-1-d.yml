section_title: Este Apêndice apresenta um passo a passo para o estabelecimento do treinamento
  e avaliação baseados em competência que seja específico para o ambiente e condições de cada
  organização. É utilizada a estrutura de competências adotada pela ANAC e o modelo instrucional
  ADDIE.
subsection_id: d
cite: B1.1(d)
title: B1.1(d)
text: d) um plano de treinamento que descreva o treinamento requerido para que as competências
  sejam alcançadas. Isso inclui, mas não se limita a um programa de estudos (incluindo as
  CHA, etapas, planos de aula e programações); e
