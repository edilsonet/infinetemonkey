text: 'B3.1 Disposições gerais

  B3.1.1 O modelo ADDIE é um processo comum utilizado por designers instrucionais para desenvolver
  ferramentas de treinamento efetivas. O modelo consiste em cinco fases: analisar, projetar,
  desenvolver, implementar e avaliar. Esta IS referir-se-á a essas fases como “fluxos de trabalho”,
  conforme ilustrado na Figura 2. Essa Seção provê uma análise mais detalhada dos dois primeiros
  fluxos de trabalho (analisar e projetar) e uma análise mais superficial dos três remanescentes
  (desenvolver, implementar e avaliar).


  Figura 2: Modelo ADDIE'
