title: Fluxo de Trabalho 1 - Analisar as necessidades de treinamento
text: 'B3.2 Fluxo de Trabalho 1 - Analisar as necessidades de treinamento

  B3.2.1 A primeira fase no desenvolvimento e implementação de um programa de treinamento
  baseado em competência é determinar quais são as necessidades de treinamento específicas
  para o ambiente e requisitos do empregador, por meio de uma análise de necessidade de treinamento.
  A Figura 3 ilustra uma visão global deste fluxo de trabalho. O resultado deste fluxo de
  trabalho é a especificação de treinamento, que deve incluir o objetivo do treinamento e
  o detalhamento dos requisitos operacionais, técnicos, regulatórios e organizacionais que
  necessitam ser atendidos ao projetar o treinamento.

  B3.2.2 Esta etapa inclui o desenvolvimento de uma lista de tarefas. Uma lista genérica de
  tarefas e subtarefas normalmente executadas por pessoal que executa funções de artigos perigosos
  está disponível no Apêndice D desta IS. Pode ser necessário que o empregador adapte a lista
  de tarefas disponível naquele Apêndice de forma a melhor refletir as tarefas específicas
  executadas por seu pessoal.


  Figura 3: Fluxo de Trabalho 1 - Analisar'
