cite: B3.3(a)
title: B3.3(a)
text: 'a) Os seguintes princípios da avaliação baseada em competências:

  1) Critérios de desempenho claros são usados para avaliar as competências. O modelo de competências
  adaptado estabelece esses critérios de desempenho.

  2) O desempenho integrado das competências é verificado. O aluno submetido à avaliação deve
  demonstrar todas as competências e a perfeita interação entre elas.

  3) Múltiplas análises são realizadas. Várias análises devem ser realizadas para determinar
  se um aluno atingiu ou não o padrão de competência provisório e/ou final.

  4) As avaliações são válidas. Todas as competências que compõem o modelo de competências
  adaptado devem ser avaliadas. Deve haver evidências suficientes para garantir que o aluno
  alcance a competência e atenda ao padrão de competência provisório e/ou ao padrão de competência
  final.

  5) Avaliações são confiáveis. Os avaliadores de artigos perigosos devem chegar às mesmas
  conclusões ao realizar uma avaliação. Os avaliadores de artigos perigosos devem ser treinados
  e monitorados para que se atinja e se mantenha um nível aceitável de confiabilidade.'
