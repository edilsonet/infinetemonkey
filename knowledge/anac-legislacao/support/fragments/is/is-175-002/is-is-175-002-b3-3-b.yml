  B3.3.3 Projetando o plano de avaliação

  B3.3.3.1 O treinamento baseado em competência requer avaliação do progresso dos alunos até
  que eles sejam competentes para realizar as funções para as quais estarão designados. Uma
  avaliação dos alunos pode ser realizada utilizando diversas ferramentas incluindo observações
  durante a execução de atividades, testes ou outros exercícios práticos. Para que as ferramentas
  de avaliação sejam efetivas, elas devem ser válidas e confiáveis, medindo de forma apropriada
  as competências que estiverem sendo avaliadas e obtendo resultados consistentes, mesmo que
  realizadas por diferentes avaliadores de artigos perigosos.

  B3.3.3.2 O objetivo do plano de avaliação é detalhar como as competências serão observadas.
