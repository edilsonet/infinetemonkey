title: B3.3(b)
text: 'b) Critérios de desempenho para avaliar as competências, incluindo:

  1) Comportamentos observáveis para cada competência. A matriz genérica de competências fornecida
  pela ANAC descreve uma lista abrangente de comportamentos observáveis associados com cada
  uma das competências. Comportamentos observáveis apropriados podem ser selecionados dessa
  lista, adaptados dela ou adicionados a ela.

  2) Padrões de competência e condições utilizadas para avaliá-los. Padrões de competência
  são aplicáveis para todos os comportamentos observáveis e estão relacionados com o cumprimento
  das normas, procedimentos, requisitos e regulamentos descritos na lista de documentos relevantes
  (exemplos: RBAC nº 175 e suas Instruções Suplementares, Instruções Técnicas, Manual de Artigos
  Perigosos etc.) Em alguns casos, pode haver padrões específicos associados com um comportamento
  observável em particular.

  B3.3.2.2 Pode ser necessário considerar condições específicas do ambiente no qual o desempenho
  será demonstrado em relação ao padrão de competência. Isso inclui a natureza e complexidade
  das atividades, condições relacionadas às ferramentas e sistemas ou equipamentos e condições
  relacionadas ao nível de suporte ou assistência que um aluno deve esperar de um instrutor
  de artigos perigosos ou de um avaliador de artigos perigosos.

  B3.3.2.3 Durante os estágios iniciais do treinamento, alunos devem esperar ensinamentos
  mais ativos por parte do instrutor de artigos perigosos. Todavia, quando os alunos avançam
  no treinamento no sentido da conquista do padrão de competência e ganham mais confiança
  para agir de forma independente, o instrutor de artigos perigosos passa a atuar de forma
  mais passiva e a fornecer conselhos ocasionais sobre como melhorar a eficiência ou a intervir
  em casos em que a segurança operacional possa ser comprometida. Consequentemente, na descrição
  do padrão de competência final pode-se esperar que o aluno atue de forma independente sem
  assistência do instrutor de artigos perigosos.

  B3.3.2.4 Como parte do progresso para o padrão de competência final, pode ser necessário
  estabelecer padrão de competência provisório.

