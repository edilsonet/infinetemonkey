  B3.3.2 Projetando o modelo de competências adaptado

  B3.3.2.1 O modelo de competências para artigos perigosos deveria ser adaptado a partir do
  modelo genérico proposto pela ANAC no Apêndice C desta IS, de forma a atender os requisitos
  de competências de cada organização. Isso deve ser feito utilizando-se as especificações
  de treinamento. O modelo adaptado deve incluir os seguintes elementos (a Tabela 1 deve ser
  utilizada para preparar o modelo de competências adaptado):'
