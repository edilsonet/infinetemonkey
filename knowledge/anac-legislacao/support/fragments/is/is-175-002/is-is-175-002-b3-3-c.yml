text: 'c) o projeto de um plano de treinamento que possibilitará o desenvolvimento e a entrega
  do treinamento.

  A Figura 4 e a Figura 5 ilustram esse Fluxo de Trabalho em duas partes: a primeira parte
  trata do projeto do modelo de competências adaptado e a segunda parte trata do projeto dos
  planos de avaliação e treinamento.


  Figura 4: Fluxo de Trabalho 2, Parte I - Projetar


