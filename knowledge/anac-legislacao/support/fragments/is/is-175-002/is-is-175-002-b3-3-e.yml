  B3.3.4.2 O plano de treinamento será usado pelo designer instrucional para criar os materiais
  de treinamento e avaliação.

  B3.3.5 Relação entre o modelo de competências adaptado e os planos de avaliação e treinamento

  B3.3.5.1 A especificação de treinamento mencionada no Fluxo de Trabalho 1 serve como base
  para o desenvolvimento do modelo de competências adaptado e dos planos de treinamento e
  avaliação. A lista de tarefas é normalmente utilizada para auxiliar na seleção dos comportamentos
  observáveis a partir da matriz genérica de competências descrita no Apêndice C desta IS.
  Os requisitos operacionais, técnicos, regulatórios e organizacionais auxiliam o desenvolvimento
  das condições e padrões que serão aplicados às competências e comportamentos observáveis.

  B3.3.5.2 A mesma lista de tarefas e os mesmos requisitos são usados para desenvolver o plano
  de treinamento. O plano de treinamento é usado para preparar os alunos a serem avaliados
  com objetivo de determinar se são competentes de acordo com o modelo de competências adaptado.
  O modelo de competências adaptado e o plano de treinamento são usados para o desenvolvimento
  do plano de avaliação.

  B3.3.5.3 O programa de estudos contido no plano de treinamento é composto por objetivos
  do treinamento derivados das tarefas e subtarefas e deve identificar os CHA necessários
  para executá-las. Os CHA são determinados com base na lista de tarefas, em conjunto com
  os requisitos operacionais, técnicos, regulatórios e organizacionais. O Apêndice E apresenta
  a matriz de tarefas e conhecimentos genéricos que podem ser usados como ferramenta para
  mapear os conhecimentos necessários para executar certas tarefas. As tarefas correspondentes
  à lista fornecida no Apêndice C são listadas nas colunas da matriz e os assuntos (conhecimentos)
  são listados nas linhas. O empregador deve indicar qual conhecimento é necessário para cada
  tarefa em particular, dentro da organização, marcando-se um “X” nos pontos em que há interseção
  entre determinada tarefa e o conhecimento necessário para executá-la. Para facilitar esse
  processo, alguns componentes foram marcados na cor cinza caso tenha se considerado que eles
  são conhecimentos irrelevantes para as tarefas indicadas. O nível de conhecimento e/ou habilidades
  necessárias podem diferir, dependendo da tarefa. Por exemplo, uma pessoa aceitando artigos
  perigosos não requer o mesmo nível de conhecimento e/ou habilidades relacionadas à classificação
  do que uma outra pessoa que esteja efetivamente classificando artigos perigosos.

  B3.3.5.4 Ao avaliar se as competências foram atingidas, deve ser utilizado o modelo de competências
  adaptado - e não o programa de estudos. Consequentemente, os critérios de desempenho são
  usados para avaliar se as competências foram atingidas, e as tarefas e subtarefas que serão
  executadas pelos alunos são meios que possibilitam que a avaliação seja conduzida. A Figura
  6 ilustra a relação entre o Fluxo de Trabalho 1 e o Fluxo de Trabalho 2.


