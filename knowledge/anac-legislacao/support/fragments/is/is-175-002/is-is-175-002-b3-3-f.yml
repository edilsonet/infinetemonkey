text: 'f) ações que devem ser tomadas caso um aluno não seja aprovado na avaliação de competências.

  Nota: normalmente, esses são procedimentos descritos em um programa de treinamento.

  B3.3.3.5 A avaliação do pessoal de artigos perigosos pode ser realizada de inúmeras formas.
  Alguns exemplos comuns incluem a utilização de provas teóricas, provas online, avaliações
  orais, exercícios práticos observados, exercícios práticos online e a observação do desempenho
  em serviço por outro profissional que esteja totalmente treinado.

  B3.3.3.6 O empregador de pessoal que desempenha funções relacionadas a artigos perigosos
  pode optar por utilizar um método de avaliação ou uma combinação de métodos, contanto que
  sua escolha garanta que o pessoal atinja as competências necessárias para desempenhar as
  funções a eles designadas. Dessa forma, o empregador deve estabelecer o plano de avaliação
  contendo todos os detalhes específicos que devem ser atendidos para que se determine se
  as competências foram atingidas pelo aluno.

  B3.3.3.7 Empregadores que tenham optado por utilizar instrutores de artigos perigosos externos
  também devem estabelecer um plano de avaliação para garantir que as competências sejam atingidas
  pelos alunos. O empregador pode incorporar a avaliação realizada pelo instrutor de artigos
  perigosos externo ao seu plano de avaliação. Mesmo que o empregador, por meio de instrutores
  de artigos perigosos próprios, não ministre nenhuma parte do treinamento, ele ainda pode
  escolher realizar a avaliação dos alunos no local de trabalho, de forma a garantir que possam
  executar as tarefas a eles designadas de forma competente. Isso pode ser feito incorporando-se
  essa atividade ao plano de avaliação.

