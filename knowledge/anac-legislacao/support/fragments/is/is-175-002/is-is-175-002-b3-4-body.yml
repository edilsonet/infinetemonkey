text: 'B3.4 Fluxo de Trabalho 3 - Desenvolver os materiais de treinamento e avaliação

  B3.4.1 A terceira fase do desenvolvimento e implantação do programa de treinamento e avaliação
  baseados em competência é o desenvolvimento dos materiais de treinamento e avaliação. O
  desenvolvimento deve ocorrer com base no modelo de competências adaptado e nos planos de
  treinamento e avaliação. Os materiais de treinamento e avaliação podem incluir, mas não
  se limitam a anotações de treinamento, briefings dos exercícios, exercícios práticos, estudos
  de caso, apresentações, vídeos, questionários, provas, avaliações e ferramentas de avaliação.
  A Figura 7 ilustra esse fluxo de trabalho.


  Figura 7: Fluxo de Trabalho 3 - Desenvolver'
