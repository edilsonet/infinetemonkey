section_id: B3.6
section_title: A quarta fase do desenvolvimento e implantação do programa de treinamento e
  avaliação baseados em competência é a condução do treinamento de acordo com os planos de
  treinamento e avaliação. Isso envolve ministrar o treinamento, monitorar o progresso dos
  alunos, dar feedback de maneira rápida e contínua sobre seu progresso, diagnosticar deficiências
  no treinamento e resolvê-las de maneira rápida e realizar avaliações de acordo com o plano
  de avaliação. O objetivo dessa etapa é formar funcionários competentes. A Figura 8 ilustra
  esse fluxo de trabalho.
