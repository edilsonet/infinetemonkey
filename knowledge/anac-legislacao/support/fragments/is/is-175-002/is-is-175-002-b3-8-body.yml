id: is-is-175-002-b3-8-body
kind: is
document: is-175-002
family: '175'
section_id: B3.8
section_title: O empregador é responsável por garantir a efetividade do programa de treinamento.
  Ao final do período de treinamento, deve ser consolidado feedback sobre o desempenho em
  serviço dos alunos, instrutores de artigos perigosos, avaliadores de artigos perigosos e
  funcionários de forma a determinar a efetividade do treinamento e da avaliação no que diz
  respeito ao progresso do aprendizado em direção à formação das competências no ambiente
  de trabalho. A avaliação do treinamento deve ser baseada em evidências válidas e confiáveis
  como, por exemplo, os resultados do treinamento, o feedback dos alunos, o feedback dos instrutores
  de artigos perigosos, relatórios de auditorias e relatórios de ocorrências. Essa avaliação
  pode levar a mudanças ou melhorias a serem realizadas no projeto do treinamento e avaliação
  baseados em competência. A Figura 9 ilustra esse fluxo de trabalho.
