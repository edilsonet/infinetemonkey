text: 'C1.1 Este Apêndice apresenta a matriz genérica de competências para pessoal de artigos
  perigosos utilizada pela ANAC. Empregadores, ao implementarem treinamento e avaliação baseados
  em competência, devem adaptar a matriz em um modelo de competências adaptado que seja baseado
  em seus requisitos específicos. O modelo de competências adaptado deve incluir os elementos
  listados na Tabela 2.

  Tabela 2: Matriz genérica de competências para pessoal de artigos perigosos utilizada pela
  ANAC

  Competência genérica

  Descrição

  Comportamento Observável

  Aplicar procedimentos e cumprir a regulamentação

  Identificar e aplicar os procedimentos apropriados de acordo com o Manual de Artigos Perigosos
  e cumprir a regulamentação vigente aplicável

  Identificar onde encontrar procedimentos e a regulamentação

  Seguir os procedimentos relevantes de maneira rápida

  Seguir a regulamentação vigente aplicável

  Demonstrar conhecimento relevante acerca dos procedimentos

  Comunicar

  Comunicar-se utilizando meios apropriados no ambiente de trabalho, tanto em situações normais
  como em situações adversas

  Assegurar que as pessoas estão prontas para receber a informação

  Escolher de maneira correta o que, quando, como e com quem se comunicar

  Enviar mensagens de maneira clara, exata e concisa

  Confirmar que o destinatário compreendeu corretamente informações importantes

  Ouvir de maneira ativa e demonstra compreensão da informação ao recebê-la

  Realizar questionamentos relevantes e efetivos

  Preencher relatórios com exatidão conforme requeridos pelos procedimentos operacionais

  Declarar desvios em relação a condições normais ou esperadas

  Utilizar e interpretar corretamente a comunicação não verbal.

  Liderar, trabalhar em equipe e autogerenciar

  Demonstrar liderança, trabalho em equipe e autogerenciamento efetivos

  Estimular participação da equipe e a comunicação aberta

  Demonstrar iniciativa e fornecer orientações quando necessário

  Engajar-se com outras pessoas durante o planejamento

  Considerar os feedbacks recebidos

  Dar e receber feedback de forma construtiva

  Endereçar e resolver conflitos e discordâncias de maneira construtiva

  Exercer liderança decisiva

  Admitir os erros e se responsabilizar por seu próprio desempenho, detectando e resolvendo
  seus próprios erros

  Executar as instruções e aplicar, de maneira eficaz, estratégias de intervenção quando necessário

  Intervir com confiança em assuntos de importância para a segurança operacional

  Autoavaliar a efetividade de suas ações

  Resolver problemas e tomar decisões

  Identificar precursores de problemas e resolver problemas existentes utilizando técnicas
  de tomada de decisão de maneira veloz

  Buscar informação exata e adequada a partir das fontes apropriadas

  Identificar e verificar os problemas e por que eles ocorreram

  Utilizar de maneira correta estratégias de resolução de problemas

  Ser perseverante ao lidar com problemas em busca da prioridade na segurança operacional

  Utilizar técnicas de tomada de decisão apropriadas e velozes

  Definir prioridades adequadamente

  Identificar e considerar as opções conforme apropriado

  Monitorar, revisar e adaptar as decisões conforme requerido

  Identificar, avaliar e gerenciar riscos e ameaças à segurança operacional de forma efetiva

  Conseguir adaptar-se a situações em que não haja nenhuma instrução ou procedimento vigente

  Reconhecer e gerenciar a situação, ao detectar um evento propício a se transformar em um
  problema

  Gerenciar carga de trabalho

  Manter a capacidade disponível da carga de trabalho, priorizando e distribuindo tarefas
  utilizando os recursos apropriados

  Possuir autocontrole em todas as situações

  Planejar, priorizar e programar as tarefas de forma efetiva

  Gerenciar o tempo de forma eficiente ao executar tarefas

  Oferecer ajuda e delegar, quando necessário

  Buscar e aceitar auxílio, quando necessário

  Monitorar, revisar e cruzar ações de maneira consciente

  Verificar se o resultado esperado foi atingido ao completar tarefas

  Gerenciar e se recuperar após interrupções, distrações, variações e falhas de maneira efetiva
  durante a execução de tarefas'
