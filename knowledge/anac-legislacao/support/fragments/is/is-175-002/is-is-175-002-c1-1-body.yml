section_title: Este Apêndice apresenta a matriz genérica de competências para pessoal de artigos
  perigosos utilizada pela ANAC. Empregadores, ao implementarem treinamento e avaliação baseados
  em competência, devem adaptar a matriz em um modelo de competências adaptado que seja baseado
  em seus requisitos específicos. O modelo de competências adaptado deve incluir os elementos
  listados na Tabela 2.
