section_id: D1.1
section_title: Este Apêndice apresenta a lista genérica de tarefas de artigos perigosos normalmente
  executadas pelo pessoal de artigos perigosos conforme descrito em A2.6. A lista é indicativa,
  ou seja, mais tarefas podem ser incluídas ou removidas, dependendo do escopo de operação
  do empregador. O empregador deveria, desta forma, adaptar a lista de tarefas, de maneira
  a refletir as tarefas específicas executadas por seus funcionários.
