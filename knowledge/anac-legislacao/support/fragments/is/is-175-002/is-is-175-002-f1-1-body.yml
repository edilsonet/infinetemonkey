section_id: F1.1
section_title: Este Apêndice apresenta exemplos que indicam as tarefas, a partir da lista
  de tarefas descrita no Apêndice D, executadas comumente pelo pessoal responsável por diversas
  funções normalmente utilizadas, sendo, dessa forma, necessário o treinamento e avaliação.
  A matriz de tarefas e conhecimentos apresentada no Apêndice E deve ser utilizada como base
  para determinar quais conhecimentos são necessários para uma dada tarefa. Os exemplos deste
  Apêndice e a matriz de tarefas e conhecimentos apresentada no Apêndice E devem ser utilizados
  para projetar programas de treinamento. Apesar disso, eles não são considerados mandatórios,
  haja vista que podem ser alterados de acordo com a necessidade do treinamento e avaliação.
  Treinamento e avaliação adicionais podem ser necessários para pessoal que assuma responsabilidades
  adicionais. Ao mesmo tempo, menos treinamento e avaliação podem ser necessários para pessoal
  que assuma menos responsabilidades que as apresentadas nas listas deste Apêndice. O empregador
  é responsável por garantir que os funcionários se tornem competentes para executar as funções
  pelas quais eles são responsáveis e, dessa forma, devem garantir que os programas de treinamento
  sejam projetados para que se atinja esse objetivo.
