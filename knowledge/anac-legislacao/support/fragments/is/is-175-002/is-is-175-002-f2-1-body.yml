family: '175'
section_id: F2.1
section_title: O treinamento e avaliação do pessoal responsável pela preparação de remessas
  de artigos perigosos podem ser adaptados para endereçar apenas as classes, divisões ou até
  mesmo números UN que o público-alvo prepara para transporte. O treinamento e avaliação podem
  também estar limitados às tarefas específicas executadas por essas pessoas. Por exemplo,
  onde o pessoal é responsável apenas por embalar, marcar e etiquetar volumes e sobrembalagens,
  o treinamento e avaliação podem ser ajustados para que somente essas tarefas sejam tratadas.
  O pessoal necessita do conhecimento relevante para executar essas funções de forma competente.
  A matriz de tarefas e conhecimentos apresentada no Apêndice E deve ser utilizada como base
  para determinar quais conhecimentos são necessários. A lista a seguir apresenta as tarefas
  que normalmente são executadas pelo pessoal responsável pela preparação de remessas de artigos
  perigosos.
