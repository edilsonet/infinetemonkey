id: is-is-175-002-f3-1-body
kind: is
document: is-175-002
family: '175'
section_id: F3.1
section_title: O pessoal responsável pelo processamento ou aceitação de carga comum deve ser
  competente para executar tarefas que visem prevenir que artigos perigosos não declarados
  sejam carregados numa aeronave. Eles podem ser funcionários de agências de carga, empresas
  de ground handling ou operadores aéreos. O pessoal necessita do conhecimento relevante para
  executar essas funções de forma competente. A matriz de tarefas e conhecimentos, apresentada
  no Apêndice E, deve ser utilizada como base para determinar quais conhecimentos são necessários.
  Treinamento e avaliação adicionais podem ser necessários para o pessoal que assuma responsabilidades
  adicionais. A lista a seguir apresenta as tarefas que normalmente são executadas pelo pessoal
  responsável pelo processamento ou aceitação de carga comum.
