text: 'G2.10 Emissão de certificado para a etapa final

  G2.10.1 Cada aluno aprovado na etapa final do treinamento e avaliação de artigos perigosos,
  conforme item G2.2.3 b), receberá um certificado atestando sua competência.

  G2.10.2 O certificado será preenchido por um avaliador de artigos perigosos e conterá, no
  mínimo, as seguintes informações:'
