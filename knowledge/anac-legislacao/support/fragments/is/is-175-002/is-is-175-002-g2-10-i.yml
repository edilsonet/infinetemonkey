section_id: G2.10
section_title: Emissão de certificado para a etapa final
subsection_id: i
cite: G2.10(i)
title: G2.10(i)
text: 'i) nome e assinatura do avaliador de artigos perigosos.

  Nota: um modelo opcional de certificado é disponibilizado no site da ANAC, em: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos/formularios-preenchiveis.

  G2.10.3 O certificado estará anexado a uma ficha de avaliação, preenchida por um avaliador
  de artigos perigosos indicando a competência do aluno em cada um dos comportamentos observáveis
  exigidos por seu PTAP.

  Nota 1: um modelo opcional de ficha de avaliação é disponibilizado no site da ANAC, em:
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos/formularios-preenchiveis.

  Nota 2: a ficha de avaliação pode, a critério do avaliador de artigos perigosos, ser inserida
  no verso do certificado da etapa final.

  G2.10.4 No caso descrito em G2.2.12, o instrutor de artigos perigosos poderá emitir um único
  certificado para as duas etapas, desde que contenha todas as informações necessárias para
  as ambas as etapas, de acordo com esta IS.

  G2.10.5 Nos casos descritos em G2.2.10 e G2.2.11, o certificado da etapa final poderá, excepcionalmente,
  ser substituído por outro documento (exemplo: certificado, Ficha de Avaliação de Piloto
  - FAP, Ficha de Avaliação de Comissário - FAC, dentre outros) emitido na respectiva categoria
  de treinamento aplicável ao seu programa de treinamento, desde que contenha informações
  em seu conteúdo ou anexo que comprovem que cada uma das avaliações indicadas no PTAP ocorreram
  e que o aluno atingiu ou não o padrão de competências final para cada item.'
