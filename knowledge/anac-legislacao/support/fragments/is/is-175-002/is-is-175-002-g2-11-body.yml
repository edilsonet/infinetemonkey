cite: G2.11
title: Arquivamento da documentação pelo empregador
text: 'G2.11 Arquivamento da documentação pelo empregador

  G2.11.1 O empregador manterá, sob seu controle, cópia de ambos os certificados indicados
  em G2.8 e em G2.10, anexados um ao outro, por um prazo de 36 (trinta e seis) meses contados
  a partir do mês de conclusão do treinamento ou avaliação mais recente, conforme exigido
  no item 175.57b) do RBAC nº 175.

  G2.11.2 O empregador manterá, sob seu controle, evidências, tais como comprovações de matrícula
  e avaliações, de todos os treinamentos (etapa final) ministrados nos últimos 36 (trinta
  e seis) meses.

  G2.11.3 Não é necessário que os certificados e as evidências mencionados em G2.11.1 e em
  G2.11.2 contenham dados de alunos que não tenham sido aprovados.

  G2.11.4 Os certificados e as evidências mencionados em G2.11.1 e em G2.11.2 poderão ser
  solicitados pela ANAC a qualquer momento e seu não envio no prazo solicitado poderá acarretar
  providências administrativas.

  G3. Procedimentos adicionais específicos - treinamento não presencial síncrono'
