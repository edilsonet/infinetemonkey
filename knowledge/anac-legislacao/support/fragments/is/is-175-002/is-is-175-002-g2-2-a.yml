title: G2.2(a)
text: 'a) Etapa inicial - Treinamento e avaliação de base: treinamento e avaliações, normalmente,
  mas não exclusivamente, teóricos, em uma das modalidades descritas em G2.2.1, composto pela
  execução de uma ou mais atividades de treinamento e avaliação ministradas por um ou mais
  instrutores de artigos perigosos.'
