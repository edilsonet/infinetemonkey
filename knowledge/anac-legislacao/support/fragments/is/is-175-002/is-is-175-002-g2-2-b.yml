id: is-is-175-002-g2-2-b
kind: is
document: is-175-002
family: '175'
section_id: G2.2
section_title: Disposições iniciais sobre o treinamento de artigos perigosos baseado em competências
subsection_id: b
cite: G2.2(b)
title: G2.2(b)
text: 'b) Etapa final - Treinamento e avaliação complementar: treinamento e avaliação que
  visam suplementar e mensurar o conhecimento de base obtido anteriormente, que será acompanhado
  por um ou mais avaliadores de artigos perigosos.

  Nota: a etapa inicial, descrita em G2.2.3 a), não deve ser confundida com o termo “treinamento
  teórico”, assim como a etapa final, descrita em G2.2.3 b), não deve ser confundida com os
  termos “avaliação final” e “avaliação prática”. A avaliação de forma prática, por exemplo,
  é um método que pode ser utilizado tanto na etapa inicial, quanto na etapa final.

  G2.2.4 Cada uma das etapas descritas no item G2.2.3 poderá ser subdividida em diversos marcos
  provisórios, cada um com seus padrões de competências provisórios, conforme conceito descrito
  no item B3.3.3.2 desta IS.

  G2.2.5 A avaliação de uma determinada competência nunca poderá ocorrer antes que o aluno
  receba o treinamento naquela competência, exceto se tal avaliação tiver como objetivo o
  nivelamento de competências antes que o treinamento em uma determinada competência seja
  iniciado. A avaliação poderá, todavia, ocorrer em momento concomitante ao treinamento, nos
  casos em que se queira avaliar o padrão de competências enquanto o conteúdo estiver sendo
  ministrado.

  Nota: instruções específicas sobre a avaliação de artigos perigosos baseada em competências
  estão dispostas no item G2.3.

  G2.2.6 A separação entre as etapas inicial e final visa meramente facilitar situações como,
  por exemplo, aquela em que um instrutor de artigos perigosos externo é contratado para ministrar
  um treinamento e avaliação de artigos perigosos baseados em competência. Em alguns desses
  casos, principalmente quando há turmas mistas com funcionários de diversos empregadores,
  pode ficar inviável que o instrutor de artigos perigosos seja capaz de avaliar todas as
  competências de todos os alunos, considerando as características específicas dos PTAP de
  cada um de seus empregadores. Portanto, em casos como esse, a etapa final visa complementar
  o treinamento de base, permitindo que o próprio empregador, por meio de seus avaliadores
  de artigos perigosos, possa apresentar e avaliar, em um segundo momento, as competências
  mais específicas, como, por exemplo, restrições operacionais ou restrições particulares
  referentes aos procedimentos específicos do empregador.

  G2.2.7 Um determinado funcionário somente poderá executar as funções pelas quais é responsável
  após concluído seu treinamento e avaliação nas duas etapas descritas no item G2.2.3.

  G2.2.8 A definição de treinamento de artigos perigosos apresentada no item 5.1.12 preconiza
  a necessidade de que haja conformidade com as políticas e instruções de trabalho adotadas
  pela organização em nome da qual o indivíduo exerce as funções sob sua responsabilidade.
  Dessa forma, para que esse objetivo seja atingido, o empregador fornecerá ao(s) instrutor(es)
  de artigos perigosos e ao(s) avaliador(es) de artigos perigosos o seu Manual de Artigos
  Perigosos (MAP) e seu Programa de Treinamento de Artigos Perigosos (PTAP), quando aplicáveis.

  Nota: em caso de terceirização de atividades entende-se que a “organização em nome da qual
  o indivíduo exerce as funções sob sua responsabilidade” é aquela que possui atribuições
  na regulamentação. Por exemplo, em caso de terceirização ou subcontratação de ground handling,
  o operador aéreo permanece sendo o responsável pela conformidade com suas próprias políticas
  e instruções de trabalho.

  G2.2.9 As políticas e instruções de trabalho serão discutidas ao longo de ao menos uma das
  etapas descritas em G2.2.3.

  G2.2.10 Exceção para o treinamento de tripulantes de voo

  G2.2.10.1 Para tripulantes de voo, a etapa descrita em G2.2.3 b) poderá, a critério do operador
  aéreo, ser substituída por treinamento em qualquer uma das categorias aplicáveis ao programa
  de treinamento de tripulantes de voo, de acordo com o descrito na IS nº 121-007 ou 135-003,
  conforme aplicável, desde que tal treinamento esteja válido e inclua todos os conhecimentos
  referentes a artigos perigosos da etapa descrita em G2.2.3 b).

  G2.2.10.2 No caso descrito em G2.2.10.1, a etapa indicada em G2.2.3 b) poderá, excepcionalmente,
  ocorrer antes da etapa indicada em G2.2.3 a).

  Nota: apesar da possibilidade de inversão da ordem das etapas, permanece obrigatória a ordem
  entre treinamento e avaliação descrita no item G2.2.5.

  G2.2.11 Exceção para o treinamento tripulantes de cabine

  G2.2.11.1 Para tripulantes de cabine, a etapa descrita em G2.2.3 b) poderá, a critério do
  operador aéreo, ser substituída por treinamento em qualquer uma das categorias aplicáveis
  ao programa de treinamento de comissários de voo, de acordo com o descrito na IS nº 121-011
  ou 135-003, conforme aplicável, desde que tal treinamento esteja válido e inclua todos os
  conhecimentos referentes a artigos perigosos da etapa descrita em G2.2.3 b).

  G2.2.11.2 Nos caso descrito em G2.2.11.1, a etapa indicada em G2.2.3 b) poderá, excepcionalmente,
  ocorrer antes da etapa indicada em G2.2.3 a).

  Nota: apesar da possibilidade de inversão da ordem das etapas, permanece obrigatória a ordem
  entre treinamento e avaliação descrita no item G2.2.5.

  G2.2.12 Exceção para a realização de treinamento em uma única etapa

  G2.2.12.1 A exceção descrita neste item é aplicável a qualquer uma das funções envolvidas
  com o transporte de artigos perigosos.

  G2.2.12.2 Unicamente nos casos em que todos os alunos de uma mesma turma, tanto na etapa
  inicial quanto na etapa final, sejam funcionários de um mesmo empregador, executem a mesma
  função e sigam os mesmos procedimentos, as etapas inicial e final poderão ocorrer concomitantemente,
  desde que sejam observadas as demais instruções desta IS e desde que o treinamento e avaliação
  ocorram de maneira alinhada com as políticas aprovadas pela ANAC em seu PTAP.

  G2.2.12.3 Tal exceção ao item G2.2.3 deverá ser declarada no PTAP e, a partir disso, o empregador
  deverá sempre seguir o mesmo modelo de treinamento, não podendo migrar para outro modelo,
  com mais marcos de treinamento, sem antes obter a aprovação da ANAC, quando aplicável.

  G2.2.12.4 Na situação descrita neste item, o instrutor de artigos perigosos deverá ser responsável
  por todos os marcos do treinamento e avaliação de artigos perigosos baseados em competências,
  não sendo aceita a figura do avaliador de artigos perigosos.'
