cite: G2.3
title: Disposições iniciais sobre a avaliação de artigos perigosos baseada em competências
text: 'G2.3 Disposições iniciais sobre a avaliação de artigos perigosos baseada em competências

  G2.3.1 A avaliação baseada em competência seguirá todas as etapas de planejamento, desenvolvimento,
  controle e execução dispostas nos Apêndices desta IS.

  G2.3.2 Pelo menos uma das avaliações somativas, conforme conceito descrito no item B3.3.3
  desta IS, da etapa inicial descrita no item G2.2.3 a) será suplementada por, no mínimo,
  um exame utilizado para avaliar o conhecimento teórico. Tais exames poderão ser realizados
  por escrito ou com o auxílio de equipamento digital e/ou plataformas online.

  G2.3.3 A avaliação a que se refere o item G2.3.2 será realizada por instrutor de artigos
  perigosos.

  G2.3.4 Para os demais marcos do treinamento, incluindo-se aquele descrito no item G2.2.3
  b), as avaliações de artigos perigosos, entretanto, serão planejadas e executadas por avaliador
  de artigos perigosos.

  G2.3.5 A frequência e nota mínimas para aprovação serão estabelecidas durante o planejamento
  a ser realizado no “fluxo de trabalho 2” do modelo ADDIE, conforme item B3.3 desta IS.

  G2.3.6 A frequência e nota mínimas para aprovação constarão no plano de avaliação.

  G2.3.7 A frequência mínima será estipulada considerando-se a quantidade mínima de horas
  a serem ministradas para que o aluno seja considerado competente.

  G2.3.8 A frequência mínima definida não poderá ser inferior a 80%.

  G2.3.9 A avaliação da etapa inicial, descrita em G2.2.3 a), será desenvolvida levando-se
  em consideração que, em caso de uma nota mínima inferior a 70%, o aluno não seja considerado
  competente para executar as funções pelas quais é responsável.

  Nota: fica a critério do instrutor de artigos perigosos e/ou do empregador, em conforme
  com o PTAP, estabelecer frequência e nota de aprovação superiores às indicadas, caso se
  julgue necessário.

  G2.3.10 A avaliação da etapa final, descrita em G2.2.3 b), será desenvolvida levando-se
  em consideração que o aluno será avaliado como competente perante diversos padrões de competência
  a serem listados pelo empregador em seu modelo de competências adaptado, seguindo-se a metodologia
  descrita em B3.3.3.

  G2.3.11 Para funcionários que se enquadrem nas funções de Pessoal responsável pela preparação
  de remessas de artigos perigosos (F2), Pessoal responsável pelo processamento ou aceitação
  de remessas de artigos perigosos (F4) ou quaisquer funções similares a essas, ao menos uma
  avaliação realizada na etapa final, descrita em G2.2.3 b), ocorrerá sob condições reais
  de operação e sob supervisão direta, em local de trabalho que possua características similares
  àquelas apresentadas na organização e localidade em que o aluno exercerá suas funções.

  Nota: dentre as características similares, deve-se considerar os sistemas e procedimentos
  utilizados pela organização e as classes, divisões ou números UN dos artigos perigosos que
  serão normalmente expedidos ou aceitos.

  G2.3.12 O empregador poderá realizar a avaliação descrita em G2.3.11 fora das condições
  reais de operação e/ou do local de trabalho, para determinadas situações definidas em seu
  plano de avaliação, mediante critério baseado em risco. Nesse caso, é recomendado que tal
  avaliação seja realizada utilizando-se outros métodos que permitam similaridade com as condições
  reais de operação e com seu local de trabalho, tais como simulações, mockups, dentre outros.

  Nota: funcionários que atuam em bases que não aceitam artigos perigosos ou que aceitam artigos
  perigosos de baixo risco em quantidade não significativa, funcionários que estejam realizando
  treinamento periódico e que possuam vasta experiência, dentre outras situações, são exemplos
  de casos que podem, após avaliação do empregador, enquadrar-se no regime descrito em G2.3.12.

  G2.3.13 O uso de ambientes virtuais ou plataformas de avaliação é permitido para as funções
  mencionadas no item G2.3.12, desde que tais ambientes ou plataformas simulem práticas e
  condições reais de operação. Tais ambientes virtuais ou plataformas deverão verificar não
  apenas as competências referentes a conhecimentos teóricos, mas também aquelas referentes
  à execução de tarefas e subtarefas de artigos perigosos definidas pelo empregador, de forma
  que, ao final do processo de treinamento e avaliação, o aluno não somente detenha o conhecimento
  sobre essas tarefas e subtarefas, mas seja capaz de executá-las corretamente. No entanto,
  somente podem ser utilizados de maneira acessória e complementar aos tipos de avaliação
  exigidos nos itens G2.3.11 e G2.3.12. Dessa forma, para essas funções, é necessário haver
  ao menos uma atividade presencial na etapa final, descrita em G2.2.3 b).

  G2.3.14 Para quaisquer outras funções normalmente utilizadas listadas no Apêndice F que
  não sejam as elencadas em G2.3.11, é recomendável que as avaliações realizadas na etapa
  final, descrita em G2.2.3 b), ocorram sob condições reais de operação e sob supervisão direta,
  em local de trabalho que possua características similares àquelas apresentadas na organização
  e localidade em que o aluno exercerá suas funções. No entanto, em alguns casos, quando isso
  não for possível, essas avaliações poderão ser realizadas por meio de simulações, mockups,
  dentre outros métodos que sejam realizados fora das condições reais de operação e/ou do
  local de trabalho.

  G2.3.15 O uso de ambientes virtuais ou plataformas de avaliação é permitido para as funções
  mencionadas no item G2.3.14, desde que tais ambientes ou plataformas simulem práticas e
  condições reais de operação. Tais ambientes virtuais ou plataformas deverão verificar não
  apenas as competências referentes a conhecimentos teóricos, mas também aquelas referentes
  à execução de tarefas e subtarefas de artigos perigosos definidas pelo empregador, de forma
  que, ao final do processo de treinamento e avaliação, o aluno não somente detenha o conhecimento
  sobre essas tarefas e subtarefas, mas seja capaz de executá-las corretamente.

  G2.3.16 Os ambientes e plataformas mencionados nos itens G2.3.13 e G2.3.15 deverão seguir
  as orientações descritas nos itens G3 e G4, conforme aplicável.'
