title: Carga horária mínima (padrão) para a etapa inicial
text: 'G2.4 Carga horária mínima (padrão) para a etapa inicial

  G2.4.1 A Tabela 3 indica a carga horária estipulada para a etapa inicial (G2.2.3 a) de treinamentos
  iniciais e periódicos de artigos perigosos para cada uma das funções normalmente utilizadas
  que estejam atuando na operação.

  G2.4.2 A carga horária mínima estipulada para cada tipo de treinamento inicial ou periódico
  está indicada nas colunas intituladas como “carga horária mínima (padrão)”.

  G2.4.3 Caso o funcionário, em treinamento, receba funções que não se enquadrem em nenhuma
  daquelas listadas na Tabela 3, as cargas horárias mínimas observarão as da função que mais
  se assemelha com aquelas que serão executadas pelo aluno.

  G2.4.4 Caso o funcionário, em treinamento, seja responsável por funções que se enquadrem
  em mais de uma dentre as listadas na Tabela 3 (exemplo: um tripulante de voo que também
  é responsável pelo processamento ou aceitação de remessas de artigos perigosos e pela aceitação
  de bagagem de passageiros e tripulantes), as cargas horárias mínimas observarão as da função
  que possua o maior valor, aumentando-se uma quantidade de horas que seja suficiente para
  o treinamento e avaliação das subtarefas adicionais.'
