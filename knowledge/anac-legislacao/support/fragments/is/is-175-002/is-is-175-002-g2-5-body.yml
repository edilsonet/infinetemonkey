title: Carga horária mínima (reduzida) para a etapa inicial
text: 'G2.5 Carga horária mínima (reduzida) para a etapa inicial

  G2.5.1 Em situações especiais e, sob um regime de exceção, o treinamento poderá ter sua
  carga horária reduzida para atender a demandas específicas. Isso é possível dado que o conceito
  de treinamento e avaliação por competências considera que o treinamento será adaptado às
  funções executadas pelos funcionários.

  G2.5.2 A redução de carga horária somente poderá ocorrer quando observado o disposto em
  todos os subitens do item G2.5.

  G2.5.3 É permitida a redução ou incremento das cargas horárias descritas na Tabela 3, caso
  o funcionário seja responsável, respectivamente, por menos ou mais funções.

  G2.5.4 A carga horária reduzida, quando utilizada, não poderá ser menor do que a indicada
  nas colunas intituladas como “carga horária mínima (reduzida)”.

  G2.5.5 A redução de carga horária para valores abaixo da carga horária padrão somente poderá
  ocorrer nas situações em que a atuação do funcionário possua algum tipo de limitação de
  escopo que justifique um treinamento com menor duração. São citados alguns exemplos em que
  isso pode ocorrer:'
