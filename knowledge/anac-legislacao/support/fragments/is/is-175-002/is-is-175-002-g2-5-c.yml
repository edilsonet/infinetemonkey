section_title: Carga horária mínima (reduzida) para a etapa inicial
subsection_id: c
cite: G2.5(c)
title: G2.5(c)
text: 'c) Tripulantes de voo ou despachantes operacionais de voo que sejam empregados exclusivamente
  por operadores aéreos que não possuam autorização para o transporte de artigos perigosos
  como carga.

  G2.5.6 A carga horária reduzida, quando utilizada, será calculada mediante análise que identifique
  qual a quantidade de horas necessárias para desenvolver as competências do aluno, seguindo-se
  o plano de treinamento e o plano de avaliação estabelecidos. Sendo assim, a carga horária
  não necessariamente será reduzida até o seu limite mínimo, podendo ser estabelecida uma
  carga horária com valor menor do que a “carga horária mínima (padrão)”, mas que seja maior
  que a “carga horária mínima (reduzida)”.

