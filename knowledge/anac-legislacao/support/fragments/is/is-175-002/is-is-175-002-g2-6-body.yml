title: Disponibilização de material
text: 'G2.6 Disponibilização de material

  G2.6.1 O treinamento de artigos perigosos utilizará como base de consulta o(s) documento(s)
  (Instruções Técnicas, manual equivalente e/ou RBAC nº 175 e suas IS associadas) utilizado(s)
  na operação pela organização onde o aluno exerça as funções pelas quais é responsável.

  Nota: não é permitido utilizar edição não vigente, edição desatualizada ou cópia não autorizada
  dos regulamentos supracitados.

  G2.6.2 Será disponibilizado um exemplar do documento mencionado em G2.6.1 para cada participante
  de treinamentos que se enquadre nas funções normalmente utilizadas abaixo:'
