title: G2.6(c)
text: 'c) Categoria A para o operador postal designado.

  Nota: a utilização exclusiva do RBAC nº 175 está condicionada à disponibilização das Instruções
  de Embalagem necessárias, que não estejam presentes naquele Regulamento ou em suas IS.

  G2.6.3 O exemplar mencionado em G2.6.2 pode ser digital, desde que seu acesso seja provido
  ao aluno durante todo o treinamento.

  G2.6.4 Embora não requerido, recomenda-se disponibilizar um exemplar para participantes
  de treinamentos que se enquadrem em funções normalmente utilizadas não listadas no item
  G2.6.2.'
