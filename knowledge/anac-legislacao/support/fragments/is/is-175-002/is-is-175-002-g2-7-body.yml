cite: G2.7
title: Validade e renovação
text: 'G2.7 Validade e renovação

  G2.7.1 Cada pessoa receberá treinamento e avaliação periódicos dentro do prazo de 24 meses
  a partir, respectivamente, do treinamento e da avaliação anteriores para assegurar que se
  mantém competente, conforme a seção 175.55 do RBAC nº 175.

  G2.7.2 Entretanto, se o treinamento ou a avaliação periódicos forem concluídos dentro dos
  últimos três meses de validade do treinamento ou da avaliação anteriores, o período de validade
  se estende a partir do mês em que o treinamento ou avaliação periódico for concluído até
  24 meses do mês de vencimento do treinamento ou avaliação anterior.

  G2.7.3 O prazo do treinamento será contado a partir da data de finalização e aprovação da
  etapa final, descrita em G2.2.3 b).

  G2.7.4 Somente poderão participar do treinamento periódico de artigos perigosos os indivíduos
  que possuam o certificado válido, ou com até 30 (trinta) dias de vencido. Expirado este
  prazo, será realizado o treinamento inicial.

  Nota: para o cumprimento deste item, o instrutor de artigos perigosos exigirá, no momento
  da inscrição, a apresentação do certificado do aluno no treinamento anterior de artigos
  perigosos em função idêntica ou similar.'
