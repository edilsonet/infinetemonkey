title: Emissão de certificado para a etapa inicial
text: 'G2.8 Emissão de certificado para a etapa inicial

  G2.8.1 Cada aluno aprovado na etapa inicial do treinamento e avaliação de artigos perigosos,
  conforme item G2.2.3 a), receberá um certificado atestando sua competência.

  G2.8.2 É vedada a emissão de qualquer tipo de certificado a alunos que não tenham sido aprovados
  e que, por consequência, não tenham adquirido as competências necessárias para executar
  as funções pelas quais serão responsáveis.

  G2.8.3 Todo certificado de treinamento de artigos perigosos será emitido por instrutor de
  artigos perigosos e conterá, no mínimo, as seguintes informações:'
