title: Arquivamento da documentação pelo instrutor de artigos perigosos
text: 'G2.9 Arquivamento da documentação pelo instrutor de artigos perigosos

  G2.9.1 O instrutor de artigos perigosos manterá, sob seu controle, relatório de todos os
  treinamentos da etapa inicial ministrados nos últimos 36 (trinta e seis) meses, no formato
  eletrônico estabelecido pela ANAC no site https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos/treinamento-de-artigos-perigosos.

  G2.9.2 O instrutor de artigos perigosos manterá, sob seu controle, evidências, tais como
  comprovações de matrícula, avaliações e listas de presença, de todos os treinamentos da
  etapa inicial ministrados nos últimos 36 (trinta e seis) meses.

  G2.9.3 Não é necessário que o relatório e as evidências mencionados em G2.9.1 e em G2.9.2
  contenham dados de alunos que não tenham sido aprovados.

  G2.9.4 O relatório e as evidências mencionados em G2.9.1 e em G2.9.2 poderão ser solicitados
  pela ANAC a qualquer momento e seu não envio no prazo solicitado poderá acarretar suspensão
  ou revogação do credenciamento do instrutor de artigos perigosos nos termos da IS nº 175-013.'
