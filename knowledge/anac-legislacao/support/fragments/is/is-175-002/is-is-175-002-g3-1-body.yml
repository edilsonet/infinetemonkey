title: Disposições gerais
text: 'G3.1 Disposições gerais

  G3.1.1 Neste item são dispostos procedimentos adicionais aos que já foram apresentados anteriormente
  nesta IS, exclusivamente para casos de treinamento não presencial síncrono.

  G3.1.2 Os procedimentos adicionais dispostos neste item dizem respeito apenas à etapa inicial
  do treinamento e avaliação de artigos perigosos, conforme definido em G2.2.3 a).

  G3.1.3 A ANAC não avaliará a ferramenta de ensino para a modalidade de treinamento não presencial
  síncrono, cabendo ao instrutor de artigos perigosos em conjunto com o empregador garantir
  que a ferramenta atenda aos requisitos dispostos na regulamentação.'
