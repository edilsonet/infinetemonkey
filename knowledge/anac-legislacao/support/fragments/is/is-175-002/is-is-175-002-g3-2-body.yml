title: Características da ferramenta de ensino
text: 'G3.2 Características da ferramenta de ensino

  G3.2.1 O instrutor de artigos perigosos utilizará uma ferramenta de ensino que seja capaz
  de garantir que os alunos estão presentes durante todo o treinamento (exemplo: webcam ou
  qualquer outro tipo de validação eficaz).

  G3.2.2 A ferramenta permitirá a comunicação bidirecional entre aluno e instrutor de artigos
  perigosos.

  G3.2.3 A ferramenta possibilitará que o instrutor de artigos perigosos possua meios que
  garantam a qualidade da conexão com os alunos durante todo treinamento.

  G3.2.4 A apresentação do conteúdo didático (exemplo: apresentação de slides) ocorrerá concomitantemente
  com interface audiovisual em tempo real do próprio instrutor de artigos perigosos (exemplo:
  webcam).'
