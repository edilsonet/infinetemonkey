title: Quantidade de alunos
text: 'G3.3 Quantidade de alunos

  G3.3.1 O instrutor de artigos perigosos decidirá qual é o limite de alunos aplicável para
  cada turma, com base em critérios que visem garantir a qualidade do treinamento e avaliação
  e a transmissão eficiente do conhecimento, objetivando que os alunos sejam competentes para
  executarem as funções pelas quais serão responsáveis.'
