title: Disponibilização de material
text: 'G3.4 Disponibilização de material

  G3.4.1 O aluno receberá acesso a todo o material utilizado durante o treinamento, previamente
  ao seu início. Isso inclui a regulamentação, os manuais e programas da organização onde
  desempenha suas atividades e qualquer outra documentação de suporte utilizada.'
