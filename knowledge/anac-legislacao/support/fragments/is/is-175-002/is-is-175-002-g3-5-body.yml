title: Avaliação do aprendizado
text: 'G3.5 Avaliação do aprendizado

  G3.5.1 O sistema de avaliação do treinamento estará hospedado em plataforma que contenha
  um banco de questões.

  G3.5.2 A avaliação pode ser realizada ao longo do treinamento, quando durante seu desenvolvimento
  tiver sido identificada a necessidade de divisão em diversos marcos e da medição da conquista
  de padrões de competências provisórios, ou ao término das atividades do treinamento, para
  medição dos padrões de competências finais.

  G3.5.3 As questões serão apresentadas de maneira randômica para os participantes.

  G3.5.4 As questões somente podem ser disponibilizadas quando o instrutor de artigos perigosos
  decidir que é o momento de todos os alunos serem avaliados.

  G3.5.5 A avaliação medirá o conhecimento de todas as áreas discutidas durante o treinamento.

  G4. Procedimentos adicionais específicos - treinamento não presencial assíncrono'
