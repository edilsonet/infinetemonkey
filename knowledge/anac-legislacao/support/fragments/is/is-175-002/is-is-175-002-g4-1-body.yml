title: Disposições gerais
text: 'G4.1 Disposições gerais

  G4.1.1 Neste item são dispostos procedimentos adicionais aos que já foram apresentados anteriormente
  nesta IS, exclusivamente para casos de treinamento não presencial assíncrono.

  G4.1.2 Os procedimentos adicionais dispostos neste item dizem respeito apenas à etapa inicial
  do treinamento e avaliação de artigos perigosos, conforme definido em G2.2.3 a).'
