title: Características da plataforma de ensino
text: 'G4.2 Características da plataforma de ensino

  G4.2.1 A plataforma de ensino contará com formas efetivas de controle da assiduidade, participação
  e avaliação dos alunos.

  G4.2.2 A plataforma de ensino possuirá meios de controle que busquem evitar que o treinamento
  seja realizado com ajuda externa.

  G4.2.3 A plataforma de ensino registrará a identificação do aluno que está realizando cada
  acesso.

  G4.2.4 A plataforma de ensino controlará as estatísticas do treinamento, incluindo quanto
  tempo o aluno despendeu em cada módulo ou disciplina do treinamento de artigos perigosos.

  G4.2.5 A plataforma de ensino garantirá que o aluno acessou e obteve conhecimento de todo
  o conteúdo na ordem que está sendo apresentado.'
