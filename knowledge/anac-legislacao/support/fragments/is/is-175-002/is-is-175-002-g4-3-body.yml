title: Avaliação do aprendizado
text: 'G4.3 Avaliação do aprendizado

  G4.3.1 Ao final de cada módulo ou disciplina, serão apresentados exercícios de fixação que
  visem a avaliar se o aluno adquiriu os conhecimentos da maneira correta. Os exercícios serão
  compatíveis com o público-alvo e com o conteúdo apresentado.

  G4.3.2 Caso o aluno não seja capaz de responder aos questionamentos de forma correta, a
  plataforma de ensino não permitirá que o aluno realize os próximos módulos ou disciplinas
  do treinamento de artigos perigosos. Nesse caso, o aluno será conduzido a rever o módulo
  ou disciplina e realizar novos exercícios de fixação.

  G4.3.3 A avaliação pode ser realizada ao longo do treinamento, quando durante seu desenvolvimento
  tiver sido identificada a necessidade de divisão em diversos marcos e da medição da conquista
  de padrões de competências provisórios, ou ao término das atividades do treinamento, para
  medição dos padrões de competências finais.

  G4.3.4 O sistema de avaliação do treinamento será baseado em um banco de questões.

  G4.3.5 As questões serão apresentadas de maneira randômica para os participantes.

  G4.3.6 A avaliação medirá o conhecimento de todas os aspectos técnicos curriculares discutidos
  durante o treinamento.'
