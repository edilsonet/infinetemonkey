title: Acompanhamento do treinamento
text: 'G4.4 Acompanhamento do treinamento

  G4.4.1 O treinamento será acompanhado em todos os momentos, por um ou mais instrutores de
  artigos perigosos nos termos da IS nº 175-013.

  G4.4.2 Os instrutores de artigos perigosos estarão credenciados de acordo com as tarefas
  de artigos perigosos que correspondam às tarefas e subtarefas de artigos perigosos que serão
  ministradas para que o aluno se torne competente.

  G4.4.3 Ao longo do treinamento, haverá meios eficazes de comunicação (exemplo: fóruns ou
  ferramenta de troca de mensagens) entre o aluno e o instrutor de artigos perigosos, para
  sanar dúvidas e incentivar a aprendizagem.

  G4.4.4 Os questionamentos realizados pelo aluno serão respondidos pelo instrutor de artigos
  perigosos com a maior brevidade possível, de forma a não impactar na qualidade do treinamento.'
