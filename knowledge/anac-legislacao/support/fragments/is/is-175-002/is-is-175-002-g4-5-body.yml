title: Procedimentos de aprovação da plataforma junto à ANAC
text: 'G4.5 Procedimentos de aprovação da plataforma junto à ANAC

  G4.5.1 A plataforma de treinamento na modalidade não presencial assíncrona será avaliada
  e aprovada pela ANAC antes de ser disponibilizada ao mercado.

  G4.5.2 O procedimento de aprovação consiste no agendamento junto à ANAC, por correio eletrônico,
  de uma data para apresentação do treinamento.

  G4.5.3 Durante o processo de aprovação, o requerente deverá informar qual o nome de sua
  plataforma e a numeração da versão ou revisão que será apresentada à ANAC.

  G4.5.4 Exceto em casos extraordinários (por exemplo, questões de saúde e calamidade pública),
  não será aceita a ausência bem como pedido de reagendamento para a atividade de avaliação
  da plataforma de ensino. O instrutor de artigos perigosos que faltar na data agendada para
  a apresentação e não encaminhar à ANAC, em até cinco dias úteis a partir da data agendada,
  justificativa acompanhada de documentos comprobatórios (por exemplo, atestado médico), terá
  a avaliação reprovada e o processo será encerrado e arquivado.

  G4.5.5 No caso de reprovação nos termos do item G4.5.4, um novo processo de aprovação somente
  poderá ser iniciado após um período de 3 (três) meses após a data previamente agendada.

  G4.5.6 Durante a atividade, a ANAC avaliará se o treinamento está de acordo com a regulamentação,
  em especial com os procedimentos desta IS.

  G4.5.7 A apresentação será conduzida por, no mínimo, um instrutor de artigos perigosos com
  credenciamento válido de acordo com as tarefas de artigos perigosos que correspondam às
  tarefas e subtarefas de artigos perigosos que serão ministradas na plataforma.

  G4.5.8 O instrutor de artigos perigosos será capaz de mostrar todas as funcionalidades da
  plataforma utilizada, assim como o conteúdo dos módulos solicitados pelos avaliadores da
  ANAC.

  G4.5.9 Caso a ANAC não aprove a plataforma durante a atividade, será estabelecido um prazo
  de até 90 (noventa) dias para apresentação das ações corretivas. A apresentação poderá,
  a critério da ANAC, ocorrer mediante um novo agendamento junto à Agência ou apenas mediante
  o envio das comprovações das correções realizadas.

  G4.5.10 Fica estabelecido um limite de 3 (três) iterações para as atividades dispostas nos
  procedimentos de aprovação da plataforma de ensino.

  G4.5.11 No caso de reprovação por ter excedido o número máximo de iterações nos termos do
  item G4.5.10, um novo processo de aprovação somente poderá ser iniciado após um período
  de 3 (três) meses após a data previamente agendada.

  G4.5.12 A plataforma será aprovada levando-se em consideração as subtarefas de artigos perigosos
  listadas no Apêndice D.

  G4.5.13 A plataforma não estará vinculada ao(s) instrutor(es) de artigos perigosos que participarem
  de seu processo inicial de aprovação.

  G4.5.14 Após aprovação da plataforma, cabe aos instrutores de artigos perigosos que a utilizarem
  mantê-la atualizada e de acordo com todos os requisitos normativos da ANAC.

  G4.5.15 Qualquer instrutor de artigos perigosos com credenciamento válido nas mesmas tarefas
  ou subtarefas de artigos perigosos aprovadas para a plataforma poderá lecionar por meio
  desta.

  G4.5.16 A ANAC poderá, a qualquer momento, revogar a aprovação do uso de plataformas que
  se tornem desatualizadas ou que deixem de obedecer a um ou mais requisitos.

  G5. Procedimentos adicionais específicos - treinamento misto'
