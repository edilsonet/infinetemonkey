section_title: 'São aceitos, automaticamente, certificados de treinamentos de artigos perigosos
  realizados no exterior para funcionários em atuação, em bases no exterior, de operadores
  aéreos brasileiros, desde que o treinamento e avaliação tenham sido ministrados de acordo
  com o PTAP aprovado pela ANAC e que o treinamento tenha sido ministrado:'
subsection_id: b
cite: G6.1(b)
title: G6.1(b)
text: b) por instrutor de artigos perigosos e/ou entidade reconhecidos pela autoridade de
  aviação civil do país em que se localiza a base de operação, caso um processo de reconhecimento
  seja exigido por esta autoridade;
