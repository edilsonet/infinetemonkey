text: 'Anexo 18 à Convenção sobre Aviação Civil Internacional: Transporte Seguro de Artigos
  Perigosos por Via Aérea - The Safe Transport of Dangerous Goods by Air;

  Doc 9284 da OACI: Instruções Técnicas para o Transporte Seguro de Artigos Perigosos por
  Via Aérea - Technical Instructions for Safe Transport of Dangerous Goods by Air;

  Ajuste SINIEF 09, de 25 de outubro de 2007, que institui o Conhecimento de Transporte eletrônico
