text: '1.2.4

  Detalhamento do conteúdo das amostras de pacientes, incluindo a quantidade

  líquida. Devem-se deixar claro quais mecanismos de avaliação (tipos de

  exames) serão realizados em cada uma das amostras, garantindo assim que o

  material transportado realmente se enquadra como espécime humano/animal

  de risco mínimo.

  S N'
