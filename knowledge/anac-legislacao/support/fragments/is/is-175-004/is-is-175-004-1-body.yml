title: OBJETIVO
text: '1. OBJETIVO

  Estabelecer orientações quanto aos procedimentos para a expedição de substâncias biológicas

  e infectantes em aeronaves civis baseadas nos requisitos presentes no RBAC nº 175, na IS
  nº

  175-001 e nas Instruções Técnicas para identificar, classificar, embalar, marcar, etiquetar,

  documentar, aceitar, manusear e transportar esses artigos perigosos, sem prejuízo do disposto

  em outras normas vigentes peculiares ao transporte desses materiais.'
