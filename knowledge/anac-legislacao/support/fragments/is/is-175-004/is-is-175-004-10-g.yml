title: 10(g)
text: 'g) bolsa de sangue total ou hemocomponentes que tenham sido liberados para fins de

  transfusão; e

  Nota: a bolsa de sangue total e hemocomponentes com resultados negativos ou não

  reagentes para marcadores de agentes infecciosos transmissíveis pelo sangue é classificada

  também, para fins de transporte, como material biológico isento.'
