title: 11(b)
text: 'b) aqueles que não se enquadram no item 11.1(a) desta IS e sabe-se, ou suspeita-se,
  que

  contenham substâncias infectantes e que atendam aos critérios para sua inclusão na

  Categoria A ou B. As substâncias deste grupo devem ser alocadas aos números UN 2814,

  UN 2900 ou UN 3373, conforme apropriado.

  11.2 É possível que alguns produtos biológicos licenciados apresentem perigo biológico só
  em

  determinadas partes do mundo. Nesses casos, as autoridades nacionais apropriadas poderão

  exigir que esses produtos biológicos atendam às disposições locais aplicáveis às substâncias

  infectantes ou impor outras restrições.Data de emissão: 15 de março de 2021

  IS nº 175-004

  Revisão D'
