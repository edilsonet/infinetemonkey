text: '12. ORGANISMOS E MICRO-ORGANISMOS GENETICAMENTE MODIFICADOS

  12.1 Organismos e micro-organismos geneticamente modificados que não se enquadrem na

  definição de substância infectante devem ser considerados para classificação de acordo com

  os requisitos estabelecidos para a Classe 9 de artigos perigosos.'
