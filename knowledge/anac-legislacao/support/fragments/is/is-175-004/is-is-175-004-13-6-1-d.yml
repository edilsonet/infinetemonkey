subsection_id: d
cite: 13.6.1(d)
title: 13.6.1(d)
text: 'd) documento de aprovação da embalagem e declaração de conformidade, em conformidade

  com o parágrafo 175.267(a) do RBAC nº 175:

  (1) documento de aprovação da ANAC e a declaração de conformidade emitida pelo

  fabricante, no caso de embalagem nacional com marcação UN; ou

  (2) documento de embalagem aprovada por outra autoridade de aviação civil ou órgão

  competente para essa aprovação, no caso de outras embalagens com marcação UN.'
