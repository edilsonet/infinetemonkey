title: 13(d)
text: 'd) Resíduos médicos regulamentados, n.e., em português, ou Regulated medical waste,

  n.o.s., em inglês.

  13.3 Os resíduos médicos ou clínicos que estejam sob suspeita razoável de possuir uma pequena

  probabilidade de conter substâncias infectantes devem ser atribuídos ao número UN 3291.

  Para fins de atribuição, podem ser utilizados como referência catálogos de resíduos de âmbito

  internacional, regional ou nacional.

  13.4 Os resíduos médicos ou clínicos descontaminados que contiveram anteriormente substâncias

  infectantes não estão sujeitos a outras disposições da regulamentação, a menos que atendam

  aos critérios para sua inclusão em outra classe de perigo.

  13.5 Instrução de embalagem 621'
