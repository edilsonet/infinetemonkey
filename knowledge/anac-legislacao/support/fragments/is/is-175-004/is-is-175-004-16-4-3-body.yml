text: '16.4.3 O gelo seco deve ser embalado obedecendo aos requisitos gerais de embalagem
  do item D1

  da IS nº 175-001 e utilizando embalagens projetadas e construídas para permitir a liberação

  do gás de dióxido de carbono de forma a evitar um acúmulo de pressão que poderia rompê-

  las.'
