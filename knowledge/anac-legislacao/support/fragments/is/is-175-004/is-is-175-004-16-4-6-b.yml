section_title: O gelo seco utilizado para refrigerar outros produtos que não sejam artigos
  perigosos pode ser
subsection_id: b
cite: 16.4.6(b)
title: 16.4.6(b)
text: 'b) o ULD não contenha outros artigos perigosos além de UN 3373, Substância biológica,

  Categoria B, ou ID 8000, Artigo de consumo. Se o ULD contiver UN 3373 ou ID 8000, as

  provisões do RBAC nº 175 e da IS nº 175-001 que se aplicam a essas substâncias devem

  ser cumpridas em adição às provisões da Instrução de Embalagem 954 aqui descritas;'
