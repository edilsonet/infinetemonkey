title: Quando o gelo seco for usado como um refrigerante para artigos que não sejam perigosos
text: '16.6.2 Quando o gelo seco for usado como um refrigerante para artigos que não sejam
  perigosos

  carregados numa ULD, os limites de quantidade por volume apresentados para gelo seco não

  se aplicam. Em tal caso, a ULD deve ser identificada para o operador aéreo e deve permitir
  a

  ventilação do gás dióxido de carbono para evitar um acúmulo perigoso de pressão.

  16.7 Etiquetagem'
