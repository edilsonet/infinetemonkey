text: '16. MATERIAL REFRIGERANTE - GELO SECO

  16.1 Comumente, materiais refrigerantes estão presentes na mesma embalagem que as substâncias

  biológicas e infectantes. Quando esses materiais são classificados como artigos perigosos,

  devem obedecer aos requisitos do RBAC nº 175 e da IS nº 175-001.Data de emissão: 15 de março
  de 2021

  IS nº 175-004

  Revisão D

  16.2 O gelo seco é o artigo perigoso mais utilizado como material refrigerante.

  16.3 O gelo seco é identificado com o número UN 1845 e com os nomes apropriados para embarque

  Dióxido de carbono, sólido ou Gelo seco, em português, ou Carbon dioxide, solid ou Dry

  ice, em inglês, respectivamente.

  16.4 Instrução de embalagem 954'
