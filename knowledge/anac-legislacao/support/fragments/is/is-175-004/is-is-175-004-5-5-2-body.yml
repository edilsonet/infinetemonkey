title: Exceções a essas responsabilidades encontram-se dispostas nas Instruções de Embalagem
text: '5.5.2 Exceções a essas responsabilidades encontram-se dispostas nas Instruções de Embalagem

  aplicáveis a cada artigo perigoso, que estão reproduzidas nesta IS.

  5.6 Esta IS é aplicável aos expedidores, aos operadores aéreos regidos pelo RBAC nº 121
  e pelo

  substâncias biológicas e infectantes.

  5.7 Apenas operadores aéreos que possuam autorização para o transporte de artigos perigosos
  em

  suas Especificações Operativas - EO - podem transportar os artigos perigosos dispostos nesta

  IS.'
