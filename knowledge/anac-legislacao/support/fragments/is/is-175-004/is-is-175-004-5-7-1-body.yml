text: '5.7.1 Não obstante o disposto no parágrafo 5.7 desta IS, os demais operadores aéreos,
  que não

  possuem autorização para o transporte de artigos perigosos em suas EO, somente podem

  realizar o transporte quando a carga for classificada como material biológico isento ou
  como

  espécime humano/animal de risco mínimo, desde que sigam as instruções desta IS, uma vez

  que esses materiais não estão sujeitos a outras disposições da regulamentação vigente.'
