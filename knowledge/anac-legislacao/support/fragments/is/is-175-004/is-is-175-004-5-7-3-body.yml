text: '5.7.3 Ainda, seguindo a IS nº 175-000, a organização requerente ou o operador aéreo
  poderá optar

  pela solicitaçao de autorização parcial de transporte de artigos perigosos como carga, como

  por exemplo artigos perigosos da Divisão 6.2.'
