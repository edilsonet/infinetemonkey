text: '5.7.4 A autorização para o transporte de artigos perigosos está diretamente relacionada
  à análise e

  à aprovação do Manual de Artigos Perigosos - MAP, conforme determina o parágrafo

  175.377(a) do RBAC nº 175.

  5.8 O Conhecimento de Transporte eletrônico - CT-e deve ser emitido para todos os transportes

  domésticos de substâncias biológicas e infectantes de acordo com a IS nº 175-003.

  5.9 Os passageiros e os tripulantes estão proibidos de transportar substâncias infectantes
  na

  bagagem de mão, na bagagem despachada ou junto ao corpo.

  5.10 As substâncias infectantes são classificadas como artigo perigoso da Divisão 6.2 e
  atribuídas,

  conforme apropriado, aos seguintes números ONU: UN 2814, UN 2900, UN 3291, UN 3373

  ou UN 3549.

  5.11 As substâncias classificadas na Divisão 6.2 são divididas em Categoria A ou em Categoria
  B.

  5.12 Esta IS está dividida da seguinte forma:Data de emissão: 15 de março de 2021

  IS nº 175-004

  Revisão D'
