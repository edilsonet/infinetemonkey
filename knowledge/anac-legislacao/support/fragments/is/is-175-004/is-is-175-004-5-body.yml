title: INTRODUÇÃO
text: '5. INTRODUÇÃO

  5.1 O transporte aéreo de artigos perigosos pode ser realizado com segurança desde que se

  obedeça aos requisitos dispostos no RBAC nº 175, na IS nº175-001 e nas demais IS

  relacionadas. Esses regramentos se destinam a viabilizar o transporte por via aérea ao impor

  um nível de segurança tal que os artigos perigosos possam ser transportados sem colocar
  a

  aeronave ou seus ocupantes em risco.

  5.2 Devem ser cumpridos os procedimentos presentes nesta IS de forma a reduzir a possibilidade

  de contaminação como resultado da exposição a substâncias infectantes que podem escapar

  das embalagens devido à quebra, vazamento ou acondicionamento inadequado. O transporte

  de maneira adequada visa a garantir a integridade e estabilidade do material biológico

  transportado.

  5.3 Não obstante ao disposto no RBAC nº 175 e nesta IS, o transporte deve obedecer os requisitos

  e procedimentos definidos por outros órgãos, incluindo aqueles publicados pela Agência

  Nacional de Vigilância Sanitária (ANVISA), que podem ser encontrados em:

  http://antigo.anvisa.gov.br/transporte-de-material-biologico.

  5.4 A segurança, assim como o sucesso da operação, somente será alcançada por meio doData
  de emissão: 15 de março de 2021

  IS nº 175-004

  Revisão D

  cumprimento das responsabilidades por parte do expedidor, do operador aéreo e dos demais

  envolvidos no transporte aéreo dispostos na regulamentação vigente.

  5.5 Todas as responsabilidades previstas para a expedição de artigos perigosos classificados
  como

  substâncias biológicas ou infectantes obedecem aos mesmos requisitos dos artigos perigosos

  dispostos no RBAC nº 175 e na IS nº 175-001.'
