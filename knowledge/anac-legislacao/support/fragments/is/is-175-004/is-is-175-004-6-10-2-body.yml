text: '6.10.2 Como regra geral, a etiqueta apresentada na Figura 1 deve estar na forma de
  um losango com

  dimensões mínimas de 100 mm x 100 mm. Aceita-se, entretanto, cada um dos lados com um

  comprimento de pelo menos 50 mm quando a embalagem for de dimensões tais que suportem

  somente etiquetas menores.'
