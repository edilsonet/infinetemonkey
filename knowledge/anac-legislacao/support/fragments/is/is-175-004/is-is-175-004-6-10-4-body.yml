  a
text: '6.10.4 Quando as embalagens contendo artigos perigosos são colocadas em uma sobrembalagem,
  a

  etiqueta de perigo presente na Figura 1 de cada embalagem deve estar claramente visível.
  Se

  não for possível, a sobrembalagem deve ter afixada a etiqueta da Figura 1 além de ser

  marcada com o termo “Sobrembalagem”, em português, ou “Overpack”, em inglês.'
