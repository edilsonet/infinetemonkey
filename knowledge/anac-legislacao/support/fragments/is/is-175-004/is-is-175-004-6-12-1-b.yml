title: 6.12.1(b)
text: 'b) a substância infectante é carregada em um dispositivo de carga fechado e o animal,

  alimento, ração ou outras substâncias comestíveis destinadas ao consumo por seres

  humanos ou por animais são carregados em outro dispositivo de carga fechado.'
