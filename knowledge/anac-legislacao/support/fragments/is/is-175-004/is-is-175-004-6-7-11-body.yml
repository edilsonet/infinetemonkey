text: '6.7.11 Independentemente da temperatura prevista para a expedição, o recipiente primário
  ou a

  embalagem secundária deve ser capaz de suportar, sem vazamentos, uma pressão interna

  produzindo uma pressão diferencial de pelo menos 95kPa. O recipiente primário ou a

  embalagem secundária deve ser capaz também de suportar temperaturas entre -40ºC e 55 ºC.'
