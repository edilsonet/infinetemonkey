text: '6.7.12 A capacidade de uma embalagem de resistir sem vazamentos a uma pressão interna
  que

  produza a pressão diferencial especificada deve ser determinada por testes de amostras de

  recipientes primários ou de embalagens secundárias. A pressão diferencial é a diferença
  entre

  a pressão exercida no interior do recipiente ou da embalagem e a pressão exercida no exterior.

  O método de teste apropriado deve ser selecionado com base no tipo de recipiente ou

  embalagem. Métodos de teste aceitáveis incluem qualquer método que produza a pressão

  diferencial requerida entre o interior e o exterior de um recipiente primário ou de uma

  embalagem secundária. O teste pode ser conduzido utilizando os métodos de ensaio de pressão

  interna hidráulica ou pneumática (manométrica) ou vácuo externo. A pressão interna

  hidráulica ou pneumática pode ser aplicada na maioria dos casos, já que a pressão diferencial

  requerida pode ser atingida em quase todas as circunstâncias. Um ensaio em vácuo externo

  não é aceitável se a pressão diferencial especificada não é atingida e mantida. O ensaio
  em

  vácuo externo é um método geralmente aceitável para os recipientes e embalagens rígidos,

  mas não é normalmente aceitável para:'
