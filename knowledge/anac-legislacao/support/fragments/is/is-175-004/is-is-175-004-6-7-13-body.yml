text: '6.7.13 Outros artigos perigosos não devem ser acondicionados na mesma embalagem que
  os

  pertencentes à Divisão 6.2 de substâncias infectantes, a menos que sejam necessários para

  mantê-las viáveis, estabilizá-las, evitar a sua degradação ou para neutralizar os seus perigos.

  Nestes casos:'
