title: Expedidores de substâncias infectantes devem assegurar que as embalagens sejam preparadas
text: '6.7.15 Expedidores de substâncias infectantes devem assegurar que as embalagens sejam
  preparadas

  de tal maneira que elas cheguem ao seu destino em boas condições e não apresentem perigo

  para pessoas ou animais durante o transporte.'
