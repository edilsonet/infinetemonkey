text: '6.7.18 Quando as substâncias infectantes a serem transportadas forem desconhecidas,
  mas se tiver

  suspeita de que atendam aos critérios para inclusão na Categoria A, as palavras “Substância

  infectante com suspeita de Categoria A”, em português, ou “Suspected Category A

  infectious substance”, em inglês, devem ser apresentadas, entre parênteses, após o nome

  apropriado para embarque na lista detalhada do conteúdo, mas não devem aparecer na

  embalagem externa.'
