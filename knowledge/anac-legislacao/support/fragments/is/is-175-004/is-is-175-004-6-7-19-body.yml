cite: 6.7.19
title: Antes de uma embalagem vazia ser devolvida para o expedidor, ou enviada para outro
  local,
text: '6.7.19 Antes de uma embalagem vazia ser devolvida para o expedidor, ou enviada para
  outro local,

  ela deve ser desinfetada ou esterilizada para anular qualquer perigo. Qualquer etiqueta
  ou

  marca indicando que ela continha uma substância infectante deve ser removida ou inutilizada.'
