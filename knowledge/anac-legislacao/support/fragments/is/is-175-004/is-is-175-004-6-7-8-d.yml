section_title: 'Substâncias expedidas refrigeradas ou congeladas:'
subsection_id: d
cite: 6.7.8(d)
title: 6.7.8(d)
text: 'd) se for utilizado dióxido de carbono sólido (gelo seco):

  i. a embalagem externa deve ser projetada e construída para permitir a saída do

  gás de dióxido de carbono para evitar um acúmulo de pressão que possa romper

  a embalagem; e

  ii. deve-se seguir as instruções dispostas no item 16 desta IS; e'
