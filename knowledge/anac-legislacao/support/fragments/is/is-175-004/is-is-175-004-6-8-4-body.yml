text: '6.8.4 Quando as substâncias infectantes a serem transportadas forem desconhecidas,
  mas se tiver

  suspeita que atendem aos critérios para inclusão na Categoria A e atribuição à UN 2814 ou
  à

  UN 2900, as palavras “Substância infectante com suspeita de Categoria A”, em português,

  ou “Suspected Category A infectious substance”, em inglês, devem ser apresentadas, entre

  parêntesis, após o nome apropriado para embarque na declaração do expedidor de artigos

  perigosos.

  6.9 Limitação de quantidade'
