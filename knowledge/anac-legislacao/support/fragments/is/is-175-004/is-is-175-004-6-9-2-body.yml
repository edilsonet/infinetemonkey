title: A quantidade máxima permitida tanto em aeronave de passageiros como aeronave cargueira
text: '6.9.2 A quantidade máxima permitida tanto em aeronave de passageiros como aeronave
  cargueira

  exclui o peso do gelo, do gelo seco ou do nitrogênio líquido utilizado para refrigerar o
  artigo

  perigoso.'
