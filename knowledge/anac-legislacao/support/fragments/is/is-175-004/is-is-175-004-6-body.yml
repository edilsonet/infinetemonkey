text: '6. CATEGORIA A

  6.1 Substância infectante da Categoria A é a substância infectante transportada de forma
  que, em

  caso de exposição, é capaz de causar uma incapacidade permanente, colocar em risco a vida

  ou constituir uma enfermidade mortal em seres humanos ou em animais saudáveis.

  6.2 Considera-se exposição quando uma substância infectante vaza da sua embalagem protetora,

  resultando em contato físico com os seres humanos ou com os animais.

  6.3 Substâncias infectantes que se enquadrem na Categoria A e que causem doenças apenas
  em

  seres humanos, ou em seres humanos e em animais, são atribuídas ao número UN 2814 e

  identificadas com o nome apropriado para embarque Substância infectante que afeta seres

  humanos, em português, ou Infectious substance, affecting humans, em inglês.

  6.4 Substâncias infectantes que se enquadrem na Categoria A e que causem doenças apenas
  em

  animais são atribuídas ao número UN 2900 e identificadas com o nome apropriado para

  embarque Substância infectante que afeta apenas animais, em português, ou Infectious

  substance, affecting animals only, em inglês.

  6.5 A atribuição aos números UN 2814 ou UN 2900 deve ser baseada no histórico médico

  conhecido e nos sintomas da fonte humana ou animal da qual procede a substância, nas

  condições endêmicas locais ou no julgamento profissional sobre as circunstâncias individuais

  dessa fonte humana ou animal.

