cite: 7.3.12(d)
title: 7.3.12(d)
text: 'd) material absorvente deve ser colocado entre o(s) recipiente(s) primário(s) e a embalagem

  secundária. O material absorvente deve ser em quantidade suficiente para absorver todo o

  conteúdo do(s) recipiente(s) primário(s) de modo que qualquer vazamento da substância

  líquida não comprometa a integridade do material acolchoante ou da embalagem externa;'
