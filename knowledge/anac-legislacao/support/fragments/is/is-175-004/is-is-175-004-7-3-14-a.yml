text: 'a) quando o gelo seco ou o nitrogênio líquido for usado para manter amostras resfriadas,
  todos

  os requisitos do RBAC nº 175 e da IS nº 175-001 devem ser atendidos (identificação,

  classificação, embalamento, marcação, etiquetagem, documentação, aceitação, manuseio e

  transporte);'
