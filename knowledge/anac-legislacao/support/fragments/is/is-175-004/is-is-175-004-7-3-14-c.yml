section_title: 'Amostras refrigeradas ou congeladas - gelo, gelo seco e nitrogênio líquido:'
subsection_id: c
cite: 7.3.14(c)
title: 7.3.14(c)
text: 'c) quando utilizados, o gelo ou o gelo seco devem ser colocados fora da embalagem

  secundária, dentro da embalagem externa ou dentro da sobrembalagem. Suportes internos

  devem ser colocados para garantir que as embalagens secundárias se mantenham na

  posição original após o gelo seco sublimar ou o gelo derreter;'
