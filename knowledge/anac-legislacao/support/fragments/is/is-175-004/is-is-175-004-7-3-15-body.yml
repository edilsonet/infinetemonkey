title: Quando os volumes forem colocados em uma sobrembalagem, as marcas de embalagem
text: '7.3.15 Quando os volumes forem colocados em uma sobrembalagem, as marcas de embalagem

  requeridas nesta IS devem ser claramente visíveis ou reproduzidas no lado de fora da

  sobrembalagem, a qual deve ser marcada também com o termo Sobrembalagem, em

  português, ou Overpack, em inglês, em letras de pelo menos 12 mm de altura.'
