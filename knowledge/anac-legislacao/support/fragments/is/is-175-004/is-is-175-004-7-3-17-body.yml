title: Quando o expedidor ou o destinatário também for a pessoa responsável pelo conteúdo
text: '7.3.17 Quando o expedidor ou o destinatário também for a pessoa responsável pelo conteúdo

  transportado, o nome e endereço precisam ser marcados apenas uma vez, a fim de satisfazer

  as disposições dos itens 7.3.16(a) e 7.3.16(b) desta IS.'
