text: '7.3.18 Instruções claras sobre o envasamento e fechamento de tais volumes devem ser
  fornecidas ao

  expedidor ou à pessoa que prepara o volume, por parte dos fabricantes e distribuidores de

  embalagem, para permitir que o volume seja corretamente preparado para o transporte.'
