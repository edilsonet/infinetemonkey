text: '7.3.8 Para o transporte, a marca ilustrada na Figura 4 deve ser exibida na superfície
  externa da

  embalagem externa sobre um fundo de uma cor contrastante e deve ser claramente visível e

  legível. A marca ter a forma de um quadrado fixado a um ângulo de 45° (em forma de

  diamante, de losango) com cada lado com um comprimento de pelo menos 50 mm. A largura

  da linha deve ser de pelo menos 2 mm, e as letras e números devem ter pelo menos 6 mm de

  altura. A marca inteira deve aparecer em um lado do volume.'
