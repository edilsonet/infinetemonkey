title: CATEGORIA B
text: '7. CATEGORIA B

  7.1 Substância infectante da Categoria B é a substância infectante que não se enquadra nos

  critérios para inclusão na Categoria A.

  7.2 Substâncias infectantes da Categoria B são atribuídas ao número UN 3373 e identificadas
  com

  o nome apropriado para embarque Substâncias biológicas, Categoria B, em português, ou

  Biological substances, Category B, em inglês.

  7.3 Instrução de embalagem 650'
