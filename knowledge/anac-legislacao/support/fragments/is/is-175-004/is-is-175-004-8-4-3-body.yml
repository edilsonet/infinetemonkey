text: '8.4.3 Para os líquidos, material absorvente em quantidade suficiente para absorver
  a totalidade do

  conteúdo deve ser colocado entre o(s) recipiente(s) primário(s) e a embalagem secundária

  para que, durante o transporte, qualquer liberação ou vazamento de uma substância líquida

  não atinja a embalagem externa e não comprometa a integridade do material acolchoante.Data
  de emissão: 15 de março de 2021

  IS nº 175-004

  Revisão D'
