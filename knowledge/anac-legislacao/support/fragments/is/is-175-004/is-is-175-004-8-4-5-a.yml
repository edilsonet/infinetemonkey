section_id: 8.4.5
section_title: Se amostras refrigeradas ou congeladas forem transportadas, as seguintes condições
  devem
subsection_id: a
cite: 8.4.5(a)
title: 8.4.5(a)
text: 'a) quando gelo seco ou nitrogênio líquido for usado para manter amostras resfriadas,
  todos

  os requisitos aplicáveis do RBAC nº 175 devem ser atendidos. Quando utilizados, o gelo

  ou o gelo seco devem ser colocados fora da embalagem secundária ou dentro da

  embalagem externa. Suportes internos devem ser colocados para garantir que as

  embalagens secundárias se mantenham na posição original após o gelo seco sublimar ou

  o gelo derreter. Se for utilizado gelo, a embalagem externa deve ser à prova de vazamento.

  Se for utilizado dióxido de carbono sólido (gelo seco), a embalagem deve ser projetada e

  construída para permitir a saída do gás de dióxido de carbono para evitar um acúmulo de

  pressão que possa romper a embalagem; e'
