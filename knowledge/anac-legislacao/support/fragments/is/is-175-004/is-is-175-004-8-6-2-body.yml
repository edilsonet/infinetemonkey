text: '8.6.2 Recomenda-se que o espécime humano/animal de risco mínimo seja aceito pelo operador

  aéreo mediante a utilização de lista de verificação. Um modelo de lista de verificação com
  os

  requisitos mínimos a serem conferidos pelo operador aéreo para o transporte aéreo de

  espécimes humanos/animais de risco mínimo encontra-se no Apêndice B desta IS.

  8.7 Limitação de quantidade'
