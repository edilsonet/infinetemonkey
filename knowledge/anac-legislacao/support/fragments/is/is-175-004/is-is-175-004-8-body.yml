text: '8. ESPÉCIME HUMANO/ANIMAL DE RISCO MÍNIMO

  8.1 Amostras de pacientes para as quais há probabilidade mínima de presença de agentes

  patogênicos são consideradas espécimes humanos/animais de risco mínimo desde que

  obedeçam ao disposto nesta IS.

  8.2 Amostras de pacientes consideradas espécimes humanos/animais de risco mínimo não estão

  sujeitas aos requisitos da regulamentação de artigos perigosos, desde que obedeçam ao

  disposto nesta IS.

  8.3 Exemplos de amostras de pacientes que podem ser consideradas como espécimes

  humanos/animais de risco mínimo desde que possuam julgamento profissional:'
