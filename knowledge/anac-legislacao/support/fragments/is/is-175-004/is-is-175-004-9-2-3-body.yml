title: Os equipamentos ou dispositivos médicos devem ser acondicionados em uma embalagem
text: '9.2.3 Os equipamentos ou dispositivos médicos devem ser acondicionados em uma embalagem

  externa forte e rígida com material acolchoante suficiente de forma a prevenir o movimento

  no interior da embalagem externa.'
