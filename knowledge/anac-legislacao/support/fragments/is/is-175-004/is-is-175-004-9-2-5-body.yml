title: Se a embalagem externa não for resistente a líquido e os dispositivos ou equipamentos
text: '9.2.5 Se a embalagem externa não for resistente a líquido e os dispositivos ou equipamentos

  médicos estiverem contaminados por ou contiverem substâncias infectantes líquidas, um meio

  de conter o líquido em caso de vazamento deve ser providenciado na forma de um

  revestimento estanque, uma bolsa plástica ou de outro meio eficaz de contenção.'
