title: EQUIPAMENTO MÉDICO USADO
text: '9. EQUIPAMENTO MÉDICO USADO

  9.1 Equipamentos ou dispositivos médicos que possam conter substâncias infectantes ou possam

  estar contaminados com substâncias infectantes e que são transportados para fins de

  desinfecção, limpeza, esterilização, reparo ou avaliação não são considerados artigos

  perigosos se forem embalados em uma embalagem projetada e construída de modo que, em

  condições normais de transporte, não possa ser quebrada, perfurada nem ter seu conteúdo

  vazado.'
