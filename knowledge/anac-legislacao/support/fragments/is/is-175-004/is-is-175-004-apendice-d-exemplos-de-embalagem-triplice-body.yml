text: 'APÊNDICE D - EXEMPLOS DE EMBALAGEM TRÍPLICE

  As imagens a seguir mostram exemplos de embalagens tríplices utilizadas para alguns dos
  artigos perigosos

  mencionados nesta IS e representam formas diferentes de cumprimento dos requisitos propostos
  pela regulamentação.

  Destaca-se que o expedidor, ao embalar o artigo perigoso, deve sempre utilizar como base
  os requisitos dispostos na

  regulamentação como um todo. As imagens são apenas ilustrativas.Data de emissão: 15 de março
  de 2021

  IS nº 175-004

  Revisão D'
