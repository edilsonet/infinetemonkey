text: '3.5.4 Documento 9859-AN/474 da OACI: Manual de Gerenciamento da Segurança Operacional
  - Safety Management Manual (SMM);

  3.5.5 Resolução nº 352/ANAC de 18 de fevereiro de 2015: Aprova o Programa de Segurança Operacional
  Específico da Agência Nacional de Aviação Civil (PSOE-ANAC); e

  3.5.6 Resolução nº 472/ANAC de 6 de junho de 2018: Estabelece providências administrativas
  decorrentes do exercício das atividades de fiscalização sob competência da ANAC.

  3.5.7 Resolução nº 714/ANAC, de 26 de abril de 2023: Aprova o Programa de Reportes Mandatórios
  de Segurança Operacional no âmbito da ANAC e emendas os RBACs nº 01, 121, 135, 145 e 175'
