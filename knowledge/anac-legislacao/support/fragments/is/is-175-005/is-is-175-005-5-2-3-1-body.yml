title: De acordo com o RBAC n° 175, seção 175.381, a notificação de acidentes e incidentes
  com artigos perigosos é obrigatória para operadores aéreos.
text: '5.2.3.1 De acordo com o RBAC n° 175, seção 175.381, a notificação de acidentes e incidentes
  com artigos perigosos é obrigatória para operadores aéreos.

  5.2.3.2 Para quaisquer outras entidades envolvidas direta ou indiretamente com o transporte
  aéreo, incluindo expedidores, agências de carga, autoridades alfandegárias, operadores de
  aeródromos e provedores de serviços auxiliares ao transporte aéreo, recomenda-se a notificação
  de acidentes e incidentes com artigos perigosos à ANAC

  5.2.3.3 Acidentes e incidentes com artigos perigosos ocorridos em território brasileiro
  ou que estejam relacionados a operadores aéreos brasileiros serão notificados à ANAC de
  acordo com os procedimentos estabelecidos nesta IS.

  5.2.3.4 No caso de o transporte estar relacionado a operadores aéreos estrangeiros, a notificação
  também deve ser encaminhada à autoridade apropriada do país do operador aéreo, de acordo
  com os requisitos de notificação de tal autoridade.

  5.2.3.5 É importante destacar que a definição de acidentes e incidentes com artigos perigosos
  indica que eles não necessariamente precisam ocorrer a bordo de uma aeronave. Dados de acidentes
  e incidentes com artigos perigosos que não tenham ocorrido a bordo de uma aeronave são importantes
  porque podem revelar uma deficiência de segurança operacional que poderia ter resultado
  em um acidente ou incidente com artigos perigosos a bordo de uma aeronave.'
