title: Artigo perigoso não declarado e mal declarado
text: '5.2.4 Artigo perigoso não declarado e mal declarado

  5.2.4.1 De acordo com a Resolução nº 714, de 26 de abril de 2023, Anexo I, a notificação
  da descoberta de artigos perigosos não declarados e mal declarados é obrigatória tanto para
  operadores de aeronave do Grupo A, quanto para operadores de aeronave do Grupo B.

  5.2.4.2 Para quaisquer outras entidades envolvidas direta ou indiretamente com o transporte
  aéreo, incluindo expedidores, agências de carga, autoridades alfandegárias, operadores de
  aeródromos e provedores de serviços auxiliares ao transporte aéreo, recomenda-se a notificação
  de ocorrências que estejam relacionadas à descoberta de artigos perigosos não declarados
  e mal declarados à ANAC.

  5.2.4.3 Artigos perigosos não declarados e mal declarados descobertos em itens de carga
  ou mala postal em território brasileiro ou que estejam relacionados a operadores aéreos
  brasileiros serão notificados à ANAC de acordo com os procedimentos estabelecidos nesta
  IS.

  5.2.4.4 No caso de o transporte estar relacionado a operadores aéreos estrangeiros, a notificação
  também deve ser encaminhada à autoridade apropriada do país do operador aéreo, de acordo
  com os requisitos de notificação de tal autoridade.

  5.2.4.5 Situações em que artigos perigosos em de bagagem de mão e despachada estejam em
  desacordo com o parágrafo 175.11(c) do RBAC nº 175, com o apêndice H da IS nº 175-001 ou
  ainda com a tabela apresentada no Manual de Artigos Perigosos (MAP) do operador aéreo, quando
  descobertas em território brasileiro, serão notificadas à ANAC de acordo com os procedimentos
  estabelecidos nesta IS.'
