text: '5.2.5 Como notificar ocorrências com artigos perigosos no sistema mandatório

  5.2.5.1 As ocorrências com artigos perigosos inseridas no sistema mandatório de notificação
  de segurança operacional, descritas nos itens 5.2.3 e 5.2.4, devem obedecer aos prazos para
  encaminhamento de notificações descritos no parágrafo 175.395 do RBAC nº 175, conforme a
  tabela a seguir:

  Tipo de ocorrência

  Referência na IS nº 175-001

  Referência na IS nº 175-005

  Prazo para encaminhamento de notificações (175.395)

  Acidente'
