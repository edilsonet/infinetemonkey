cite: 5.2.6(b)
title: 5.2.6(b)
text: 'b) transporte de cargas: ocorrências identificadas antes de a carga passar pelo processo
  de aceitação por parte do operador aéreo; e

  Nota: o disposto acima não inclui COMAT, uma vez que o operador, neste caso, figura também
  como expedidor, tendo, portanto, a obrigação de notificar à ANAC toda ocorrência com artigo
  perigoso, independentemente da etapa do processo em que seja identificada.'
