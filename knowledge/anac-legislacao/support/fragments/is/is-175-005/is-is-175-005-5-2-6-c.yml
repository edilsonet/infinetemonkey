text: 'c) transporte de mala postal: ocorrências identificadas antes de a carga passar pelo
  processo de aceitação para o transporte aéreo por parte do operador postal designado.

  5.2.6.2 Recomenda-se a outras entidades, como expedidores e agências de carga, que, no momento
  em que descubram uma ocorrência com artigo perigoso, independentemente da etapa do processo
  em que seja identificada, notifiquem à ANAC de acordo com as instruções contidas nesta IS.

  5.2.6.3 Casos que não coloquem em risco a segurança operacional não necessitam ser notificados
  à ANAC, seja no sistema mandatório ou no sistema voluntário de notificação de segurança
