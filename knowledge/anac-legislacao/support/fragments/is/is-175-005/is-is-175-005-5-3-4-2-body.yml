text: '5.3.4.2 As condições latentes deveriam ser notificadas à ANAC preferencialmente no
  prazo de 30 dias.

  5.3.4.3 Os operadores aéreos e quaisquer outras entidades envolvidas direta ou indiretamente
  com o transporte de artigos perigosos por via aérea devem permitir que seus funcionários
  enviem informações para o sistema voluntário de notificação de segurança operacional diretamente
  à ANAC. Isso significa que não pode haver procedimento que obrigue os funcionários a enviarem
  a notificação a algum setor da empresa para análise prévia, que condicione o envio à ANAC.

  5.3.4.4 A informação, apesar de ser classificada como reporte voluntário, deve ser registrada
  como reporte mandatório, escolhendo-se a opção NOCLAP, por meio do Portal Único de Notificação,
  que poderá ser acessado em https://santosdumont.anac.gov.br/menu/r/api/portal_unico_notificacao.'
