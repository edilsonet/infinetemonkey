text: '5.3.4.6 A falta de evidências documentais não é fator impeditivo para o envio da notificação
  à ANAC.

  5.4 Penalidades e providências administrativas sancionatórias

  5.4.1 O propósito principal dos sistemas de notificação descritos nesta IS é a segurança
  operacional no transporte - e não a penalização dos envolvidos. Consequentemente, assegura-se
  a livre notificação de ocorrências e de condições latentes relativas a artigos perigosos,
  sejam elas inseridas em um sistema mandatório de notificação de segurança operacional ou
  em um sistema voluntário de notificação de segurança operacional.

  5.4.2 Os operadores aéreos e quaisquer outras entidades envolvidas direta ou indiretamente
  com o transporte de artigos perigosos devem garantir a não penalização de seus funcionários
  que cumpram com suas responsabilidades de notificar.

  5.4.3 A proteção e o tratamento de maneira justa e consistente de funcionários que reportam
  situações relacionadas à segurança operacional é fundamental para que eles se sintam incentivados
  e encorajados a notificar situações que possam colocar em risco as operações aéreas, de
  forma a colaborar com a ANAC e com a própria empresa no gerenciamento efetivo de riscos.

  5.4.4 A ANAC não adotará providências administrativas sancionatórias, nos termos da Resolução
  n° 472, de 6 de junho de 2018 (ou norma que vier a substituí-la), contra o notificante de
  condições latentes ou ocorrências relacionadas a não conformidades inadvertidas ou não premeditadas
  com as exigências da regulamentação vigente, exceto nos seguintes casos:'
