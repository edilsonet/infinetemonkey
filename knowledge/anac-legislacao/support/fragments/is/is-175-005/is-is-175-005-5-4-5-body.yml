text: '5.4.5 As instruções dispostas neste item são garantidas pelo art. 4º da Resolução n°
  714, de 26 de abril de 2023.

  5.4.6 A ausência de resposta a quaisquer questionamentos ou solicitações realizados pela
  ANAC após o início da investigação é passível de aplicação de medidas administrativas sancionatórias,
  nos termos do RBAC n° 175 e da Resolução n° 472, de 6 de junho de 2018 (ou norma que vier
  a substituí-la).

  5.4.7 De acordo com o Art. 5º da Resolução n° 714, de 26 de abril de 2023, o descumprimento
  da obrigação de reportar a ocorrência no prazo determinado ensejará a aplicação de providências
  administrativas. Isso ocorrerá nos casos de reporte obrigatório.

  5.5 Providências administrativas preventivas

  5.5.1 A ANAC poderá, nos termos da Resolução n° 472, de 6 de junho de 2018 (ou norma que
  vier a substituí-la), adotar providências administrativas preventivas contra o notificante
  nos casos em que fique comprovada que a deficiência em um ou mais procedimentos sob sua
  responsabilidade tenha contribuído para a causa da ocorrência.

  5.5.2 Independentemente de solicitação da ANAC, o notificante, sempre que informar uma ocorrência
  com artigos perigosos relacionada a uma situação que poderia ter sido evitada pela adequada
  execução de seus procedimentos operacionais, deve apresentar à ANAC um Plano de Ações Corretivas
  (PAC) ou documento similar contendo o conjunto de ações propostas e adotadas de forma a
  evitar a ocorrência de situações similares.

  5.5.3 O PAC descrito no item 5.5.2 deve, sempre que necessário, ser apresentado anexo à
  notificação, indicando quais ações foram ou estão sendo tomadas pelo operador aéreo para
  evitar recorrência do problema, assim como suas evidências. Alguns exemplos de situação
  que exigem a apresentação de PAC são:'
