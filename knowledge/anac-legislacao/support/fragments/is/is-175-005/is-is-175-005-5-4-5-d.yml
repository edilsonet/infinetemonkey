text: 'd) outros tipos de ocorrência relacionadas a erros por parte do operador aéreo ou do
  operador postal designado.

  5.6 Sistema de Gerenciamento da Segurança Operacional

  5.6.1 O Sistema de Gerenciamento da Segurança Operacional (SGSO) é exigido para operadores
  aéreos certificados pela ANAC segundo o RBAC nº 119, exceto se de outra forma estabelecido
  pela ANAC.

  5.6.2 Toda ocorrência com artigos perigosos inserida no sistema mandatório e toda condição
  latente com artigos perigosos inserida no sistema voluntário notificada pelo operador aéreo
  deve ser tratada dentro de seu SGSO.

  5.6.3 Toda ocorrência com artigos perigosos inserida no sistema mandatório e toda condição
  latente com artigos perigosos inserida no sistema voluntário notificada por terceiros que
  chegar ao conhecimento do operador aéreo e que possua relação direta com sua operação deve
  ser tratada dentro de seu SGSO.

  5.6.4 O tratamento de ocorrências e condições latentes com artigos perigosos dentro do SGSO
  deve ser similar ao tratamento dado a outros tipos de situações. Para isso, a Subparte BB
  do RBAC nº 121 e a Subparte M do RBAC nº 135 devem ser observadas, conforme aplicável.

  5.7 Tratamento das notificações recebidas

  5.7.1 A ANAC, em consonância com o Art. 4º da Resolução n° 714, de 26 de abril de 2023,
  protegerá a identidade do notificante, tratando todas as notificações de segurança operacional
  relacionadas a artigos perigosos em caráter restrito.

  5.7.2 O acesso a um ou mais documentos do processo administrativo de investigação estará
  disponível apenas às suas partes interessadas e poderá ser restringido de forma a não causar
  interferências no processo de investigação.

  5.7.3 Após o recebimento da notificação, a ANAC realizará uma análise para determinar a
  necessidade de investigação, incluindo eventual inspeção in loco para coleta de dados e
  informações.

  5.7.4 Todas as entidades, independentemente de terem sido responsáveis pela notificação,
  devem colaborar com a investigação, no que couber, fornecendo dados, informações, documentos
  e quaisquer outras evidências solicitadas pela Agência.

  5.7.5 A ANAC utilizará dados e informações provenientes das notificações e de suas investigações
  para planejamento de atividades que visem a redução de riscos e a melhoria da segurança
  operacional, tais como: publicação de novas normas e atualização daquelas já existentes,
  treinamentos, auditoria específicas, dentre outras.'
