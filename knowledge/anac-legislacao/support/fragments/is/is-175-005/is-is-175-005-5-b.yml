text: 'b) sistema voluntário de notificação de segurança operacional.

  5.2 Sistema mandatório de notificação de segurança operacional

  5.2.1 O sistema mandatório de notificação de segurança operacional visa obter informações
  relativas a perigos específicos que são conhecidamente capazes de contribuir para acidentes.

  5.2.2 Dentro do escopo de artigos perigosos, o sistema mandatório de notificação de segurança
  operacional deve capturar ocorrências com artigos perigosos, sejam elas:'
