title: PROCEDIMENTOS
text: '5. PROCEDIMENTOS

  5.1 Disposições gerais

  5.1.1 Os requisitos acerca do transporte de artigos perigosos por via aérea existentes na
  regulamentação nacional (RBAC nº 175 e suas IS) e internacional (Anexo 18 e Instruções Técnicas
  da OACI) permitem que o transporte desse tipo de material seja efetuado de forma segura.

  5.1.2 A não observação desses requisitos por qualquer entidade envolvida direta ou indiretamente
  no sistema de aviação civil pode causar ocorrências com artigos perigosos.

  5.1.3 Qualquer entidade que esteja envolvida direta ou indiretamente no transporte aéreo
  que se encontre na posição de notificante de determinada ocorrência com artigos perigosos
  deve se utilizar dos procedimentos contidos nesta IS.

  5.1.4 Os sistemas de notificação de artigos perigosos são necessários tanto para o órgão
  regulador, quanto para a entidade regulada. A ANAC necessita dos dados para que estes sejam
  base para a identificação de perigos e para o monitoramento do desempenho de segurança operacional
  dentro do sistema de aviação civil brasileiro. A entidade regulada, por sua vez, necessita
  coletar os dados para que estes sejam base para a identificação de perigos e para o monitoramento
  do desempenho de segurança operacional associado com suas próprias atividades.

  5.1.5 A notificação contendo dados e informações de segurança operacional por indivíduos
  e organizações no sistema de aviação civil é fundamental para o gerenciamento da segurança
  operacional, viabilizando a realização de investigações a fim de compreender a causa raiz
  dos problemas e, posteriormente, atuar, mitigando riscos, a fim de reduzir sua possibilidade
  de recorrência. Além disso, os dados coletados são usados para identificar tendências, analisar
  a performance da segurança operacional e avaliar riscos, de forma a obter um panorama da
  situação do transporte de artigos perigosos por via aérea no Brasil.

  5.1.6 A ANAC adota como padrão os sistemas de notificação definidos no Anexo 19 à Convenção
  de Chicago - “Gerenciamento da Segurança Operacional”, no Doc 9859 - “Manual de Gerenciamento
  da Segurança Operacional” da Organização de Aviação Civil Internacional (OACI) e ainda no
  Programa de Segurança Operacional Específico da Agência Nacional de Aviação Civil (PSOE-ANAC).

  5.1.7 O Anexo 19 estabelece dois tipos de sistemas de notificação envolvendo os diversos
  aspectos e áreas relacionados à segurança operacional, dentro dos quais podem ser também
  inseridas as notificações relativas a artigos perigosos:'
