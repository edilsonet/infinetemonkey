title: OBJETIVO
text: '1. OBJETIVO

  Estabelecer orientações aos operadores aéreos regidos pelo RBAC nº 135 que transportam

  artigos perigosos como carga e a todos os operadores aéreos regidos pelo RBAC nº 121

  para elaborar os procedimentos que compõem o Manual de Artigos Perigosos - MAP.

  Ainda, estabelecer orientações aos operadores aéreos regidos pelo RBAC nº 135 que não

  transportam artigos perigosos como carga para elaborar os procedimentos referentes a

  artigos perigosos em seu MGO.'
