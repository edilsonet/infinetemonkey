text: 'd) Detenção, interdição ou apreensão de aeronave, ou do material transportado;

  1.9

  Informar que o não cumprimento dos procedimentos presentes no MGO poderá ocasionar

  processo criminal, de acordo com o Art. 261 do Código Penal, ao funcionário e ao operador

  aéreo.

  Nota: Art. 261 - Expor a perigo embarcação ou aeronave, própria ou alheia, ou praticar qualquer

  ato tendente a impedir ou dificultar navegação marítima, fluvial ou aérea:

  Pena - reclusão, de dois a cinco anos.

  Art. 263 - Se de qualquer dos crimes previstos nos arts. 260 a 262, no caso de desastre
  ou sinistro,

  resulta lesão corporal ou morte, aplica-se o disposto no art. 258.

  Art. 258 - Se do crime doloso de perigo comum resulta lesão corporal de natureza grave,
  a pena

  privativa de liberdade é aumentada de metade; se resulta morte, é aplicada em dobro. No
  caso

  de culpa, se do fato resulta lesão corporal, a pena aumenta-se de metade; se resulta morte,

  aplica-se a pena cominada ao homicídio culposo, aumentada de um terço.

  1.10

  Informar que a atualização dos procedimentos presentes no MGO ocorrerá:'
