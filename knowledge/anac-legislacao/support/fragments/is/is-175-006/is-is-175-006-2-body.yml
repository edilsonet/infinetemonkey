text: '2. Disposições gerais

  Item Conteúdo Localização no

  MAPData de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  2.1

  Explicitar que possui na EO autorização para o transporte de passageiros, de

  carga e de artigo perigoso.

  Nota: se o operador aéreo possui autorização para transporte de apenas

  algumas classes de artigos perigosos ou alguns artigos perigosos específicos,

  deve-se explicitar essa limitação. Por exemplo:

  • Autorizado a transportar passageiro, carga e artigos perigosos das classes

  3, 6 e 9;

  • Autorizado a transportar passageiros, carga e artigos perigosos (somente

  baterias de íon lítio dentro do equipamento ou embaladas junto ao

  equipamento - UN 3481).

  2.2 Explicitar se o COMAT e o AOG classificados como artigo perigoso poderão ou

  não ser transportados.

  2.3

  Informar que os procedimentos presentes no MAP servem para:'
