text: 'c) Notificar ocorrências envolvendo artigos perigosos.

  2.4

  Informar que todos os funcionários do operador aéreo e os que atuam em seu

  nome (terceirizados, subcontratados e eventuais) terão conhecimento dos

  procedimentos presentes no MAP.

  2.5

  Informar que todos os funcionários do operador aéreo e os que atuam em seu

  nome (terceirizados, subcontratados e eventuais) são obrigados a cumprir

  com os procedimentos presentes no MAP.

  2.6

  Informar que qualquer funcionário do operador aéreo, ou que atue em seu

  nome (terceirizado, subcontratado e eventual), ao identificar um artigo

  perigoso, deverá rejeitar o transporte do material ou impedir o seu transporte

  em qualquer aeronave da frota.

  2.7

  Explicar como o operador aéreo informará aos funcionários de outras

  empresas que atuam em seu nome (terceirizados, subcontratados e

  eventuais) sobre os procedimentos aprovados no MAP, assim como suas

  alterações.

  Nota: não é necessário apresentar todo o MAP para essa outra empresa,

  apenas os procedimentos relacionados às funções que ela exerce.Data de emissão: 22 de março
  de 2024

  IS nº 175-006

  Revisão E

  2.8

  Informar que o não cumprimento dos procedimentos presentes no MAP

  poderá ocasionar penalidades administrativas ao funcionário e ao operador

  aéreo como:'
