title: Reconhecimento de marcas, etiquetas e documentos
text: '3. Reconhecimento de marcas, etiquetas e documentos

  Item Conteúdo Localização no

  MAP

  3.1

  Descrever procedimentos de forma a garantir que qualquer funcionário do

  operador aéreo, ou que atue em seu nome (terceirizado, subcontratado e

  eventual), seja capaz de identificar um artigo perigoso ao verificar uma

  etiqueta de risco ou de manuseio, uma marca ou um documento relacionado

  ao transporte aéreo de artigo perigoso.Data de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  3.2

  Descrever procedimentos de forma a garantir que qualquer funcionário do

  operador aéreo, ou que atue em seu nome (terceirizado, subcontratado e

  eventual), ao identificar uma etiqueta de risco ou de manuseio, um rótulo de

  identificação de artigo perigoso em ULD, uma marca ou um documento em

  desacordo com a regulamentação de transporte aéreo de artigos perigosos

  vigente rejeite o transporte do material ou impedir o seu transporte em

  qualquer aeronave da frota.'
