text: '5.2.1 O transporte aéreo de artigos perigosos pode ser realizado com segurança desde
  que se

  obedeça aos requisitos dispostos no RBAC nº 175, na IS nº 175-001 e demais IS

  relacionadas. Esses regulamentos se destinam a viabilizar o transporte por via aérea aoData
  de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  impor um nível de segurança tal que os artigos perigosos possam ser transportados sem

  colocar a aeronave ou seus ocupantes em risco.'
