section_title: 'A atualização dos procedimentos presentes no MAP deve ocorrer:'
subsection_id: c
cite: 5.2.13(c)
title: 5.2.13(c)
text: 'c) por solicitação da ANAC.

  Nota 1: o ciclo da regulamentação de artigos perigosos é de dois anos, com a entrada em

  vigor de nova edição das Instruções Técnicas em 1º de janeiro dos anos ímpares, com

  consequente revisão da IS nº 175-001. Então, no mínimo, a atualização deve ocorrer com

  essa frequência, sujeito à Nota 2.

  Nota 2: caso o operador aéreo verifique que não é necessária qualquer atualização, ele

  deve declarar formalmente à ANAC que as mudanças da regulamentação não impactaram

  os procedimentos aprovados em edição do MAP aprovada anteriormente.'
