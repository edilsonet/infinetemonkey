title: O operador aéreo que possua qualquer tipo de autorização para o transporte de artigos
text: '5.2.14 O operador aéreo que possua qualquer tipo de autorização para o transporte de
  artigos

  perigosos e que ficar por período superior a dois anos sem realizar nenhuma atualizaçãoData
  de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  do seu MAP e sem declarar formalmente à ANAC que a atualização não é necessária,

  conforme Nota 2 do item 5.2.13 poderá sofrer restrições no transporte de artigos perigosos

  ou até mesmo perder sua autorização para o transporte de artigos perigosos.

  5.3 Declaração de Conformidade'
