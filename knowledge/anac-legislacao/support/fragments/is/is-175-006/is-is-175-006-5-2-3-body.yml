title: Dessa forma, o operador aéreo deverá desenvolver procedimentos relacionados ao
text: '5.2.3 Dessa forma, o operador aéreo deverá desenvolver procedimentos relacionados ao

  transporte aéreo de artigos perigosos de forma a garantir que seus funcionários e aqueles

  que atuam em seu nome, conforme item 5.2.11, obedeçam a uma padronização

  determinada pela empresa e em conformidade com a regulamentação aplicável.'
