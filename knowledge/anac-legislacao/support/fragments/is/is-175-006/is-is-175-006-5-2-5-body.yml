cite: 5.2.5
title: O detalhamento das informações e dos procedimentos exigidos dependerá da
text: '5.2.5 O detalhamento das informações e dos procedimentos exigidos dependerá da

  complexidade operacional intencionada pelo operador aéreo. Isso também inclui o

  operador aéreo que possua quaisquer situações específicas de operação, tais como, mas

  não limitadas a: operações off-shore; operações em locais remotos onde não há

  infraestrutura aeroportuária; operações em locais onde não há estrutura de aceitação do

  operador aéreo; operações com helicópteros; operações com aeronaves pequenas,

  operações com aeronaves que não possuam compartimento de carga classificado, dentre

  outras.'
