title: Nos casos descritos em 5.2.5, o operador aéreo que não dispuser de procedimentos para
text: '5.2.6 Nos casos descritos em 5.2.5, o operador aéreo que não dispuser de procedimentos
  para

  lidar com situações específicas de operação, poderá receber autorizações para o transporte

  de artigos perigosos apenas em algumas localidades, rotas, aeronaves ou de acordo com

  o que o procedimento disposto no MAP permitir para o atendimento à regulamentação.

  Isso será verificado na fase 4 do processo de certificação, conforme descrito na IS nº 175-

  000.'
