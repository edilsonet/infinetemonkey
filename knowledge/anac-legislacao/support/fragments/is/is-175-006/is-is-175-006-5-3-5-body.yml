title: Dependendo da política adotada, da operação desenvolvida ou dos tipos de aeronaves
text: '5.3.5 Dependendo da política adotada, da operação desenvolvida ou dos tipos de aeronaves

  utilizadas pelo operador aéreo, alguns itens da Declaração de Conformidade não são

  aplicáveis. Nesse caso, o operador aéreo deve indicar no campo de localização no MAP,

  o texto “não aplicável” ou “N/A” e a devida justificativa no campo observações.'
