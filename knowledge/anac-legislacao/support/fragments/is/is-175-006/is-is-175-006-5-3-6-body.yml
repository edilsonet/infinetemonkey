text: '5.3.6 Operadores aéreos que pretendam incluir ou já possuam em suas EO autorização
  para o

  transporte de artigos perigosos restritos a algumas classes de risco ou a alguns artigos

  perigosos específicos devem desenvolver o MAP utilizando o Apêndice C desta IS deData de
  emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  forma a conter principalmente os procedimentos para os artigos perigosos presentes na

  autorização.'
