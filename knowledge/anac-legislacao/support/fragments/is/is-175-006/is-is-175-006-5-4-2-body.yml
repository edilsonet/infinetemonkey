title: A Resolução nº 653, de 20 de dezembro de 2021, prevê o pagamento da Taxa de
text: '5.4.2 A Resolução nº 653, de 20 de dezembro de 2021, prevê o pagamento da Taxa de

  Fiscalização da Aviação Civil (TFAC) para diferentes situações. O requerente deverá

  analisar se é exigido o pagamento de TFAC e em qual etapa do processo de certificação

  isso se faz necessário. Mais informações podem ser encontradas em:

  https://www.gov.br/anac/pt-br/sistemas/novas-tfac.'
