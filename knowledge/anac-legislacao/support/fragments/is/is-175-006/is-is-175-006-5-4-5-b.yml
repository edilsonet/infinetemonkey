title: 5.4.5(b)
text: 'b) o operador aéreo deverá enviar diretamente à gerência responsável pelo operador

  aéreo o MAP revisado juntamente com o FOP 125 ou o FOP 225, conforme

  aplicável, informando quais foram as alterações realizadas, com base nas não

  conformidades evidenciadas no respectivo FOP 124 ou FOP 224, conforme

  aplicável.'
