title: Procedimento de atendimento ao passageiro
text: '5. Procedimento de atendimento ao passageiro

  Item Conteúdo Localização no

  MAP

  5.1

  Descrever procedimentos de forma a garantir que o passageiro seja

  notificado, no momento da compra da passagem ou da contratação do serviço

  de transporte (pessoalmente, por contrato, por telefone, pela internet, por

  aplicativo, por dispositivo móvel etc.) sobre os tipos de artigos perigosos que

  são proibidos para transporte em aeronaves.

  5.2

  Descrever procedimentos de forma a garantir que o passageiro seja

  notificado, no momento do despacho (check-in) ou outro momento anterior

  ao embarque, sobre os artigos perigosos que são permitidos e os que são

  proibidos para transporte.

  5.3

  Descrever procedimentos de forma a garantir o questionamento ao

  passageiro sobre itens suspeitos, de forma a impedir que artigos perigosos

  proibidos sejam despachados como bagagem (Por exemplo: caixas de

  papelão, embalagens de free shop etc.)

  5.4

  Descrever procedimentos de forma a garantir o questionamento ao

  passageiro sobre o excesso de bagagem despachado como carga, de forma a

  impedir que artigos perigosos proibidos sejam transportados.

  5.5

  Descrever procedimentos de forma a garantir o questionamento ao

  passageiro sobre artigos perigosos caso sua bagagem de mão torne-se

  bagagem despachada no portão de embarque.

  Nota: o procedimento deverá possuir foco nos itens que são permitidos na

  bagagem de mão, mas que não são permitidos na bagagem despachada.

  5.6 Descrever procedimentos de identificação e recusa de transporte de material

  classificado como artigo perigoso não permitido.

  5.7

  Descrever procedimentos para aceitação de artigos que dependam da

  autorização do operador aéreo, incluindo descrição do cargo do responsável

  pela autorização.Data de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E'
