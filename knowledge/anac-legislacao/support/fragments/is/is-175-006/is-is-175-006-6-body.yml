title: Procedimento para expedição de COMAT e de AOG
text: '6. Procedimento para expedição de COMAT e de AOG

  Item Conteúdo Localização no

  MAP

  6.1

  Descrever procedimentos de expedição de COMAT e AOG contendo artigo

  perigoso, incluindo identificação, classificação, embalagem, marcação,

  etiquetagem e documentação do artigo perigoso.

  6.2

  Desenvolver o fluxo do transporte de COMAT e de AOG classificado como

  artigo perigoso.

  Nota: o fluxo deve apresentar os setores da empresa que serão envolvidos e

  as atividades que serão desenvolvidas. Por exemplo:

  • A expedição do COMAT ou do AOG classificado como artigo perigoso será

  realizada pelos funcionários do setor de manutenção da base de origem;

  • A aceitação para transporte e a emissão do conhecimento de transporte

  (AWB ou CT-e) do COMAT ou do AOG classificado como artigo perigoso

  ocorrerá pelos funcionários do setor de carga da base de origem;

  • O carregamento e o descarregamento do COMAT ou do AOG classificado

  como artigo perigoso ocorrerá pelos funcionários do setor de rampa das

  respectivas bases;

  • A entrega do COMAT ou do AOG classificado como artigo perigoso ocorrerá

  diretamente aos funcionários do setor de manutenção da base de destino.

  6.3

  Descrever procedimentos de forma a garantir que a aceitação para transporte

  do COMAT ou do AOG classificado como artigo perigoso não seja realizada

  pelo mesmo funcionário que efetuou a expedição.'
