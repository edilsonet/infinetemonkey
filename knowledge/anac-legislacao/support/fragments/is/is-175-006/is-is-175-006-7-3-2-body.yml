text: '7.3.2 Descrever os procedimentos de emergência específicos em ocorrência que envolva
  fogo em

  bateria de lítio na bagagem de mão durante o voo.

  8. Notificação de ocorrências - discrepâncias, incidentes e acidentes - com artigos perigosos

  Item Conteúdo

  8.1

  Descrever procedimentos de forma a garantir que a notificação à ANAC de ocorrência com

  artigo perigoso seja realizada de acordo com a IS nº 175-005.

  Nota: apesar de não possuir autorização para o transporte de artigo perigoso, há situações
  que

  requerem notificação de ocorrência com artigos perigosos.

  8.2

  Descrever procedimentos para comunicação da ocorrência desses eventos entre os

  funcionários de outras empresas que atuam em seu nome (terceirizados, subcontratados e

  eventuais) e o operador aéreo.

  8.3

  Descrever procedimentos de forma a garantir que funcionários do operador aéreo, ou que

  atuem em seu nome (terceirizados, subcontratados e eventuais), sejam incentivados a notificar

  ocorrências à ANAC e não sejam penalizados por essa ação.

  8.4 Descrever procedimentos para o desenvolvimento de medidas de mitigação do risco e

  correções necessárias, objetivando evitar ocorrências similares com artigos perigosos.Origem:
  SPO 39/45'
