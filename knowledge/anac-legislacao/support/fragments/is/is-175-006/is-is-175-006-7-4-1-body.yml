title: 7.4.1
text: '7.4.1

  Descrever procedimentos de forma a garantir que o funcionário que realizar

  a aceitação para transporte de artigo perigoso utilize obrigatoriamente uma

  lista de verificação para aceite de artigos perigosos (check-list), quando

  aplicável, de forma a constatar se o artigo perigoso está conforme os

  requisitos determinados na IS nº 175-001. Informar que essa verificação será

  realizada item por item, seguindo-se a lista de verificação.'
