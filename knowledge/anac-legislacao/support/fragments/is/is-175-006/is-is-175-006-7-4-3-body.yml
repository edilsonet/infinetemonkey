title: 7.4.3
text: '7.4.3

  Descrever procedimentos de forma a garantir que caso um ou mais itens da

  lista de verificação obtenham resposta negativa, o transporte deve ser

  recusado e uma via da lista de verificação deve ser entregue ao expedidor,

  devidamente assinada, identificando o(s) motivo(s) da recusa.'
