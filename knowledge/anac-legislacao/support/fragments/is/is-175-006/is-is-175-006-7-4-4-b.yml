title: 7.4.4(b)
text: 'b) Cópia da documentação entregue pelo expedidor.

  Nota: o arquivamento dos documentos pode ser eletrônico desde que possa

  ser impresso ou disponibilizado a qualquer momento.

  7.10

  Descrever procedimentos de forma a garantir que os funcionários de cada

  base de operações deverão preencher uma lista contendo os artigos

  perigosos aceitos para transporte de forma a ser compilado no Relatório

  Mensal para notificar à ANAC.

  Nota: incluem-se nessa lista os COMAT classificados como artigo perigoso.

  7.11

  Descrever procedimentos de forma a garantir o preenchimento das

  informações referentes aos artigos perigosos em Relatório Mensal a ser

  encaminhado à ANAC, na forma e no prazo determinados pela IS nº 175-009.'
