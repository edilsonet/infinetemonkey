text: 'c) Equipamento com bateria de lítio (celular, notebook, tabletes, câmeras,

  relógios etc.)

  Nota: não é necessário descrever os procedimentos para cada um dos itens

  apontados anteriormente. O objetivo deste item é apenas informar que

  diversos itens possuem alívios no cumprimento de requisitos (exemplos: em

  alguns casos pode não ser necessária a apresentação de declaração do

  expedidor, ou uso de embalagens homologadas, ou preenchimento de

  NOTOC, conforme indicado na regulamentação).

  7.6

  Descrever procedimentos de forma a garantir o adequado preenchimento do

  conhecimento aéreo:'
