text: 'e) Outros documentos requeridos.

  Nota: o arquivamento dos documentos pode ser eletrônico desde que possa

  ser impresso ou disponibilizado a qualquer momento.

  7.9

  Descrever procedimentos que garantam o arquivamento na área de

  aceitação, pelo período mínimo de três meses, da documentação de artigos

  perigosos rejeitados para transporte devido a erro ou omissão do expedidor

  com relação a embalagem, a etiquetagem, a marcação ou a documentação.'
