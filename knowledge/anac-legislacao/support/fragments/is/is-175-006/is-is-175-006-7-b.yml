title: 7(b)
text: 'b) Para transporte internacional: AWB conforme padrão aceito

  internacionalmente.

  7.5

  Descrever método que será utilizado para marcação ou identificação dos

  volumes, caso o DACTE não seja impresso e acompanhe fisicamente o

  transporte.

  Nota: O procedimento deverá estar alinhado com as instruções definidas nos

  itens 5.2.16 a 5.2.18 da IS nº 175-003.'
