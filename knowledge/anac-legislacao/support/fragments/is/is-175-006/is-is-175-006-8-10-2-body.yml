text: '8.10.2

  Descrever procedimentos de forma a garantir que se houver volume com a

  etiqueta “Somente em Aeronave Cargueira” (Cargo Aircraft Only - CAO), a

  etiqueta esteja visível ou o rótulo de identificação de artigo perigoso em ULD

  indique que a ULD deve ser carregada somente em aeronave cargueira.'
