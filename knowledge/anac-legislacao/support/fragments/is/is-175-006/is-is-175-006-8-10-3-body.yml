title: 8.10.3
text: '8.10.3

  Descrever procedimentos de forma a garantir que o rótulo de identificação

  de artigo perigoso em ULD deve ser removido da ULD imediatamente após o

  a retirada do artigo perigoso.

  8.11

  Descrever procedimentos de forma a garantir que o carregamento de

  materiais magnéticos seja realizado de acordo com o estabelecido pela

  regulamentação vigente.

  8.12

  Descrever procedimentos de forma a garantir que o carregamento de gelo

  seco seja realizado de acordo com o estabelecido pela regulamentação

  vigente.

  8.13

  Descrever procedimentos de forma a garantir que durante todo o transporte,

  incluindo a armazenagem, o manuseio, o carregamento e o descarregamento,

  um volume ou uma ULD contendo substância auto reativa da divisão 4.1 ou

  peróxido orgânico da divisão 5.2 seja protegido da luz solar direta,

  armazenado longe de qualquer fonte de calor em uma área bem ventilada.

  8.14'
