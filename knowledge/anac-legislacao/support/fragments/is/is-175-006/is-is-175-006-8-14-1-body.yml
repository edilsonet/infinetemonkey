text: '8.14.1

  Descrever procedimentos de forma a garantir que que um artigo perigoso

  seja inspecionado imediatamente antes de ser carregado em uma aeronave

  ou dentro de uma ULD assegurando que não haja evidência de dano,

  incluindo amassados, ou de vazamento.'
