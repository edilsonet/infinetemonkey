title: 8.14.4
text: '8.14.4

  Descrever procedimentos de forma a garantir que sempre que um volume

  contendo artigo perigoso apresente sinais que esteja danificado ou vazando,

  este seja retirado da aeronave, ou seja providenciada sua remoção por pessoa

  ou autoridade competente, e, posteriormente, proceda-se à sua eliminação

  de forma segura.'
