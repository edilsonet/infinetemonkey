title: 8.14.5
text: '8.14.5

  Descrever procedimentos de forma a garantir que ao ser constatado que um

  volume contendo artigo perigoso vazou dentro de uma aeronave, o restante

  da remessa esteja em condições adequadas para o transporte por via aérea e

  que nenhum outro volume, bagagem ou carga tenha sido contaminado.'
