title: Descrever os procedimentos de emergência específicos em ocorrência que
text: '8.3.2 Descrever os procedimentos de emergência específicos em ocorrência que

  envolva fogo em bateria de lítio na bagagem de mão durante o voo.

  9. Notificação de ocorrências - discrepâncias, incidentes e acidentes - com artigos perigosos

  Item Conteúdo Localização no

  MAPData de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  9.1

  Descrever procedimentos de forma a garantir que a notificação à ANAC de

  ocorrência com artigo perigoso seja realizada de acordo com a IS nº 175-005.

  Nota: apesar de não possuir autorização para o transporte de artigo perigoso,

  há situações que requerem notificação de ocorrência com artigos perigosos.

  9.2

  Descrever procedimentos para comunicação da ocorrência desses eventos

  entre os funcionários de outras empresas que atuam em seu nome

  (terceirizados, subcontratados e eventuais) e o operador aéreo.

  9.3

  Descrever procedimentos de forma a garantir que funcionários do operador

  aéreo, ou que atuem em seu nome (terceirizados, subcontratados e

  eventuais), sejam incentivados a notificar ocorrências à ANAC e não sejam

  penalizados por essa ação.

  9.4

  Descrever procedimentos para o desenvolvimento de medidas de mitigação

  do risco e correções necessárias, objetivando evitar ocorrências similares com

  artigos perigosos.

  Observações

  Declaro que os procedimentos apresentados no Manual de Artigos Perigosos - MAP - estão devidamente

  contemplados nesta Declaração de Conformidade nos termos da IS nº 175-006.

  Data:

  Nome e assinatura do responsável técnico (se aplicável):

  Nome e assinatura do responsável legal do operador aéreo:Origem: SPO 15/45'
