title: 8.7.1
text: '8.7.1

  Descrever procedimentos de forma a garantir que atenção especial ocorra na

  manipulação dos volumes contendo artigos perigosos, considerando o tipo de

  aeronave em que serão carregados e o método de carregamento necessário,

  de modo que danos acidentais não sejam causados por arrasto ou manuseio

  incorreto.

  Nota: inclui-se neste item a paletização de volumes contendo artigos

  perigosos por parte do operador aéreo.'
