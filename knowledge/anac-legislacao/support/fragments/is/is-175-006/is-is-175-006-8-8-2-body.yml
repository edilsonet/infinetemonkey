title: 8.8.2
text: '8.8.2

  Descrever procedimentos de forma a garantir que nenhum funcionário

  encoberte total ou parcialmente, tampe ou obscureça uma marcação, uma

  etiqueta de risco ou uma etiqueta de manuseio de artigo perigoso.

  Nota: inclui-se nesse item a proibição de tampar uma marca ou etiqueta de

  artigo perigoso por uma marca, uma etiqueta, uma fita adesiva ou qualquer

  outro material, mesmo que seja do operador aéreo ou do operador do

  terminal de carga.

  8.9'
