text: '8.9.1

  Descrever procedimentos de forma a garantir que quando for verificado que

  uma etiqueta de risco ou de manuseio de artigos perigosos se perder, se

  descolar ou ficar ilegível, o funcionário do operador aéreo faça a substituição

  por uma etiqueta adequada, conforme as informações apresentadas na DGD.'
