title: 8.9.2
text: '8.9.2

  Descrever procedimentos de forma a garantir que nenhum funcionário do

  operador aéreo retire uma marcação ou uma etiqueta de risco ou de

  manuseio, ou troque etiquetas que, a princípio, estejam erradas, seja na

  aceitação do artigo perigoso para transporte ou em qualquer outro momento

  do transporte aéreo.

  8.10'
