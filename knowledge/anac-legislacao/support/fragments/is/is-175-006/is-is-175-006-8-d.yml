section_title: Procedimento para manuseio, armazenagem, carregamento e descarregamento
subsection_id: d
cite: 8(d)
title: 8(d)
text: 'd) Como carga externa em um helicóptero

  Nota: somente deverão ser inseridas no MAP as opções possíveis em relação

  às autorizações para transporte de artigo perigoso e as características das

  aeronaves da empresa. Uma ou mais opções listadas acima podem não ser

  aplicáveis.

  8.3

  Descrever procedimentos de forma a garantir que que volumes que

  contenham artigos perigosos incompatíveis, isto é, que possam reagir

  perigosamente entre si, não sejam armazenados, manuseados e carregados

  em uma aeronave próximos um ao outro ou em uma posição que permita

  interação entre eles em caso de vazamento, em observância à Tabela G-1 da

  IS nº 175-001.

  8.4

  Descrever procedimentos de forma a garantir que durante todo o transporte

  aéreo, incluindo a armazenagem, o manuseio, o carregamento e o

  descarregamento, um volume que contenha artigo perigoso líquido

  devidamente etiquetado com a etiqueta de manuseio “Este lado para cima”,

  também conhecida como “Setas para cima”, seja transportado conforme a

  orientação descrita na etiqueta de manuseio.

  8.5

  Descrever procedimentos de forma a garantir que os artigos perigosos

  estejam devidamente afixados na aeronave de forma a impedir qualquer

  movimento durante o voo.

  8.6

  Descrever procedimentos de forma a garantir que quando houver artigos

  perigosos carregados em uma aeronave, os volumes contendo artigos

  perigosos sejam protegidos contra danos, inclusive pela movimentação de

  bagagem, de mala postal ou de carga.

  8.7'
