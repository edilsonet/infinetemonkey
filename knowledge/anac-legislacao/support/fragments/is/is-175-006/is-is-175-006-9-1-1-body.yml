title: 9.1.1
text: '9.1.1

  Descrever procedimentos de forma a garantir que o piloto em comando seja

  informado por meio da Notificação ao Comandante - NOTOC - sobre o

  transporte de artigo perigoso como carga ou como COMAT antes da aeronave

  iniciar os procedimentos de decolagem, conforme requisitos estabelecidos na

  regulamentação vigente.'
