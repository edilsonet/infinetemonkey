text: '9.1.2

  Descrever procedimentos de forma a garantir que o funcionário responsável

  pelo controle operacional da aeronave receba a mesma NOTOC apresentada

  ao piloto em comando.

  Nota: o nome do cargo ou da função exercida por esse funcionário deve ser

  descrito neste item, por exemplo: White Cap, Despachante de Voo,

  Despachante de Operações Terrestres, Supervisor de Rampa etc.

  9.2 Descrever procedimentos de forma a garantir o preenchimento da NOTOC

  obedecendo as exigências apresentadas no item G4.1 da IS nº 175-001.

  9.3

  Descrever procedimentos de forma a garantir que o funcionário responsável

  pelo carregamento da aeronave assine a NOTOC, confirmando não haver

  dano ou vazamento de artigo perigoso.Data de emissão: 22 de março de 2024

  IS nº 175-006

  Revisão E

  9.4 Descrever procedimentos de forma a garantir que a NOTOC esteja disponível

  ao piloto em comando durante todo o voo.

  9.5

  Descrever procedimentos de forma a garantir que o piloto em comando

  confirme em uma via da NOTOC, por meio de identificação e assinatura, que

  as informações sobre o artigo perigoso foram recebidas.

  9.6'
