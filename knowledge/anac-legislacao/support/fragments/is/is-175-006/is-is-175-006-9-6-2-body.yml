text: '9.6.2

  Descrever procedimentos de forma a garantir que as informações presentes

  na NOTOC sejam imediatamente acessadas por qualquer setor responsável

  pelas operações de voo, se necessário, até que a aeronave chegue ao seu

  destino.'
