title: da IS nº 175-001 rejeite o transporte do material ou impeça o seu transporte em qualquer
text: 'A2.3 da IS nº 175-001 rejeite o transporte do material ou impeça o seu transporte em
  qualquer

  aeronave da frota.

  Nota: mesmo não possuindo autorização para o transporte de artigos perigosos na EO, o

  operador aéreo pode transportar mala postal (correio) que contenha os artigos perigosos

  listados no item A2.3 da IS nº 175-001.'
