text: 'APÊNDICE B - DECLARAÇÃO DE CONFORMIDADE PARA OPERADOR AÉREO

  REGIDO PELO RBAC Nº 121 QUE TRANSPORTA PASSAGEIRO E CARGA, MAS NÃO

  TRANSPORTA ARTIGO PERIGOSO

  Declaração de Conformidade

  Esta organização requerente apresenta o Manual de Artigos Perigosos - MAP - contendo os
  procedimentos acerca do

  transporte aéreo de artigos perigosos, considerando-se as seguintes características:

  1 - Autorizado a transportar passageiro e carga.

  2 - Não autorizado a transportar artigo perigoso, seja como carga ou COMAT/AOG.

  Instruções de preenchimento:

  A descrição dos procedimentos apresentados no MAP deve estabelecer uma sequência lógica
  das tarefas ou ações para a

  realização de uma determinada atividade e devem definir:'
