text: 'APÊNDICE D - ASSUNTOS QUE COMPÕEM O MGO DE UM OPERADOR AÉREO

  REGIDO PELO RBAC Nº 135 QUE TRANSPORTA APENAS PASSAGEIRO

  MGO

  OPERADOR AÉREO REGIDO PELO RBAC Nº 135 QUE TRANSPORTA APENAS

  PASSAGEIRO

  Esta lista detalha o conteúdo requerido para o MGO contendo os procedimentos acerca do transporte
  aéreo de artigos

  perigosos, considerando-se as seguintes características:

  1 - Autorizado a transportar somente passageiro e suas bagagens.

  2 - Não autorizado a transportar carga.

  3 - Não autorizado a transportar artigo perigoso, seja como carga ou COMAT/AOG.

  Instruções de preenchimento:

  A descrição dos procedimentos apresentados no MGO deve estabelecer uma sequência lógica
  das tarefas ou ações para

  a realização de uma determinada atividade e devem definir:'
