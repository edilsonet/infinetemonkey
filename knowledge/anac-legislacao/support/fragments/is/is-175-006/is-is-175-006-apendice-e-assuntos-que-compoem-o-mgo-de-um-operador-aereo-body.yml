text: 'APÊNDICE E - ASSUNTOS QUE COMPÕEM O MGO DE UM OPERADOR AÉREO

  REGIDO PELO RBAC Nº 135 QUE TRANSPORTA PASSAGEIRO E CARGA, MAS NÃO

  TRANSPORTA ARTIGO PERIGOSO

  MGO

  OPERADOR AÉREO REGIDO PELO RBAC Nº 135 QUE TRANSPORTA

  PASSAGEIRO E CARGA, MAS NÃO TRANSPORTA ARTIGO PERIGOSO

  Esta lista detalha o conteúdo requerido para o MGO contendo os procedimentos acerca do transporte
  aéreo de artigos

  perigosos, considerando-se as seguintes características:

  1 - Autorizado a transportar passageiro e carga.

  2 - Não autorizado a transportar artigo perigoso, seja como carga ou COMAT/AOG.

  Instruções de preenchimento:

  A descrição dos procedimentos apresentados no MGO deve estabelecer uma sequência lógica
  das tarefas ou ações para

  a realização de uma determinada atividade e devem definir:'
