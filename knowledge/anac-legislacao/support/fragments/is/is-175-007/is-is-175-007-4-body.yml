title: REFERÊNCIAS
text: '4. REFERÊNCIAS

  4.1. Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica
  - CBA.

  4.2. Regulamento Brasileiro de Aviação Civil nº 121 - RBAC nº 121.

  4.3. Regulamento Brasileiro de Aviação Civil nº 135 - RBAC n° 135.

  4.4. Regulamento Brasileiro de Aviação Civil nº 175 - RBAC n° 175.

  4.5. Anexo 6 à Convenção sobre Aviação Civil Internacional: Operação de aeronaves - Operation
  of Aircraft.

  4.6. Anexo 18 à Convenção sobre Aviação Civil Internacional: Transporte Seguro de Artigos
  Perigosos por Via Aérea - The Safe Transport of Dangerous Goods by Air.

  4.7. Doc 9284 da Organização da Aviação Civil Internacional - OACI: Instruções Técnicas
  para o Transporte Seguro de Artigos Perigosos por Via Aérea - Technical Instructions for
  Safe Transport of Dangerous Goods by Air.

  4.8. Suplemento ao Doc 9284 da OACI: Instruções Técnicas para o Transporte Seguro de Artigos
  Perigosos por Via Aérea - Suplemento - Technical Instructions for Safe Transport of Dangerous
  Goods by Air - Supplement.

  4.9. Doc 10147 da Organização da Aviação Civil Internacional - OACI: Orientações sobre a
  Abordagem Baseada em Competências para o Treinamento e Avaliação sobre Artigos Perigosos
  - Guidance on a Competency-based Approach to Dangerous Goods Training and Assessment.'
