title: 6(b)
text: 'b) Caso a política esteja presente em partes distintas do PTAP, devem-se informar todas
  as localizações.

  6.4.2. O envio da Declaração de Conformidade é de caráter essencial e sua ausência caracteriza
  uma não conformidade no processo, além de impedir a análise e aprovação do PTAP por parte
  da ANAC.

  6.4.3. A Declaração de Conformidade possui o conteúdo mínimo a ser desenvolvido e apresentado
  no PTAP pelo operador aéreo à ANAC e seu modelo está disponível no Apêndice A desta IS.

  6.4.4. A Declaração de Conformidade deve ser devidamente preenchida e assinada pelo responsável
  técnico que elaborou o PTAP, se aplicável, e pelo representante legal do operador aéreo.

  6.4.5. Dependendo da política adotada, da operação desenvolvida ou dos tipos de aeronaves
  utilizadas pelo operador aéreo, alguns itens da Declaração de Conformidade não são aplicáveis.
  Nesse caso, o operador aéreo deve indicar no campo de localização no PTAP, o texto “não
  aplicável” ou “N/A” e a devida justificativa no campo observações.

  6.4.6. Modelos editáveis dos Apêndices desta IS encontram-se disponíveis no endereço eletrônico
  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos.

  6.5. Encaminhamento de documentação para análise do PTAP

