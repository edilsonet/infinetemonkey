text: '6. DESENVOLVIMENTO DO ASSUNTO

  6.1. Disposições gerais

  6.1.1. Um sistema seguro e eficiente de transporte aéreo depende de uma força de trabalho
  competente. Isso pode ser atingido por meio da implementação de uma abordagem baseada em
  competência para o treinamento e avaliação.

  6.1.2. O RBAC nº 175, parágrafo 175.51(a), requer que os empregadores estabeleçam e mantenham
  um PTAP.

  6.1.3. Em consonância com o disposto na IS nº 175-002, a abordagem baseada em competência
  para o treinamento e avaliação é o meio aceitável para garantir que tal requisito seja observado.

  6.1.4. A aplicação bem sucedida da regulamentação referente ao transporte aéreo de artigos
  perigosos e a realização dos seus objetivos dependem, em grande parte, de que todas as pessoas
  envolvidas compreendam devidamente os riscos relacionados a esse transporte, bem como da
  compreensão detalhada dos regulamentos. Isso só pode ser alcançado por meio de treinamento
  e avaliação eficientes.

  6.1.5. Esta Instrução Suplementar é aplicável a qualquer entidade envolvida no transporte
  de artigos perigosos e a todos os seus funcionários, incluindo aqueles que atuam em seu
  nome, tais como terceirizados, subcontratados, eventuais, dentre outros, sejam eles:'
