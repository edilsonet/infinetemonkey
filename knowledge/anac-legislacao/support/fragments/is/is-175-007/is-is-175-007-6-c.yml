text: 'c) quaisquer outros que exerçam funções que envolvam direta ou indiretamente as responsabilidades
  do empregador.

  6.1.6. Esta IS descreve o PTAP de todas as entidades envolvidas com o transporte de artigos
  perigosos, exceto aquele aplicável ao operador postal designado, devendo este aprovar seu
  PTAP de acordo com as orientações fornecidas pela ANAC durante seu processo de certificação.

  6.1.7. Especificamente para operadores aéreos, esta IS insere-se no contexto do processo
  de certificação para o transporte de artigos perigosos, sendo complementar à IS nº 175-000
  - Processo de certificação para o transporte de artigos perigosos. Dessa forma, a autorização
  para o transporte de passageiros, de carga e/ou de artigos perigosos está diretamente relacionada
  à análise e à aprovação das políticas de treinamento e avaliação contidas no PTAP.

  6.1.8. A análise e a aprovação das políticas de treinamento e avaliação relacionadas ao
  transporte aéreo de artigos perigosos presentes no PTAP compõem o processo de certificação
  do operador aéreo e seguem as orientações da IS nº 119-001, da IS nº 119-004 e da IS nº
  175-000, conforme aplicável.

  6.2. Registro de treinamento e avaliação

  6.2.1. Conforme os parágrafos 175.51(a) e 175.57(a) do RBAC nº 175 e conforme item A4.4
  da IS n° 175-001, todas as pessoas jurídicas, nacionais ou estrangeiras, envolvidas com
  expedição, transporte, manuseio, movimentação e armazenagem de carga aérea, bem como aquelas
  envolvidas com a segurança e inspeção de passageiros e bagagens, devem possuir registros
  de controle de treinamento de artigos perigosos de todos os seus funcionários e terceirizados.

