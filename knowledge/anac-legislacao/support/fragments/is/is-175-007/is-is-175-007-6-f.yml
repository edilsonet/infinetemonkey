title: 6(f)
text: 'f) certificados que comprovem que o funcionário foi avaliado como competente tanto
  na etapa inicial quanto na etapa final do treinamento.

  6.2.3. Os certificados mencionados no item 6.2.2.f) devem ser arquivados por 36 meses da
  data de realização do treinamento de artigos perigosos.

  6.2.4. Os certificados mencionados no item 6.2.2.f) devem ser disponibilizados aos funcionários
  que os solicitarem.

  6.2.5. Os certificados mencionados no item 6.2.2.f) devem ser disponibilizados à ANAC na
  localidade de atuação dos funcionários ou em qualquer situação em que a ANAC os solicite.

  Nota: em alguns casos específicos, conforme disposto na IS nº 175-002, poderá ser emitido
  um único certificado para as diferentes etapas.

  6.3. Programa de treinamento de artigos perigosos - PTAP

  6.3.1. Segundo o RBAC nº 175, parágrafo 175.51(a), todos os empregadores de pessoas que
  desempenham funções relacionadas com o transporte de artigos perigosos devem estabelecer
  e manter um PTAP. Isso inclui qualquer pessoa que esteja envolvida com uma ou mais responsabilidades
  do expedidor descritas no Apêndice E da IS nº 175-001 e com uma ou mais responsabilidades
  do operador aéreo descritas no Apêndice G da IS nº 175-001.

  6.3.2. Segundo o RBAC nº 175, parágrafo 175.51(b), somente o PTAP das seguintes entidades
  deve ser submetido à análise e aprovação da ANAC:'
