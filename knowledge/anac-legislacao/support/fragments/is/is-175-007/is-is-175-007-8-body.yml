text: '8. DISPOSIÇÕES FINAIS

  8.1. Os PTAP aprovados pela ANAC antes da publicação desta IS permanecem aceitos e válidos
  até que uma nova revisão seja aprovada de acordo com cronograma a ser publicado em Portaria
  específica.

  8.2. Os operadores aéreos deverão se adequar às disposições desta IS, tendo apresentado
  à ANAC os seus PTAP, até o prazo definido pelo cronograma a seguir:'
