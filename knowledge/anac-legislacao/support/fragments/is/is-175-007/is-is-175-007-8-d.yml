cite: 8(d)
title: 8(d)
text: 'd) 3 de maio de 2024, para operadores aéreos regidos pelo RBAC nº 135 que não possuem
  aprovação específica para o transporte de artigos perigosos como carga.

  Nota: os prazos indicados anteriormente foram previamente definidos por meio da publicação
  da Portaria nº 11.954/SPO, de 21 de julho de 2023.

  8.3. As demais entidades não listadas anteriormente deverão se adequar às disposições desta
  IS, tendo elaborado os seus PTAP, até 1º de outubro de 2023.

  Nota: o prazo indicado anteriormente foi previamente definido por meio da publicação da
  Portaria nº 11.954/SPO, de 21 de julho de 2023.

  8.4. O operador aéreo que não se adequar às disposições desta IS, em conjunto com as disposições
  da IS nº 175-002, dentro dos prazos estabelecidos, poderá perder sua aprovação específica
  para o transporte de artigos perigosos como carga.

  8.5. Os casos omissos serão dirimidos pela ANAC.'
