title: Justificativa de autorização especial solicitada
text: '1. Justificativa de autorização especial solicitada

  (Type of Exemption requested)

  Extrema urgência (conforme o item 11.6 da IS nº175-008)

  (Extreme urgency, according to item 11.6 of Supplementary Instructions 175-008)

  Outros modos de transporte são inapropriados (conforme o item 11.8 da IS nº 175-008)

  (Other forms of transport are inappropriate, according to item 11.8 of Supplementary Instructions
  175-008)

  Cumprimento da regulamentação é contrário ao interesse público (conforme o item 11.9da IS
  nº 175-008)

  (Full compliance with regulation is contrary to the public interest, according to item 11.9
  of Supplementary Instructions 175-008)Data de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  FORMULÁRIO DE SOLICITAÇÃO DE APROVAÇÃO/AUTORIZAÇÃO ESPECIAL

  PARA TRANSPORTE DE ARTIGOS PERIGOSOS POR VIA AÉREA

  (REQUEST FORM FOR DANGEROUS GOODS APPROVAL/EXEMPTION) PÁGINA 11 DE 12

  2. Descrever as razões para cada informação marcada acima, justificando por que o artigo
  perigoso deve ser

  transportado por via aérea

  (Describe the reasons for each information marked above, explaining why the article or substance
  needs to be transported by air)

  G. OUTRAS CONSIDERAÇÕES RELEVANTES

  (OTHER RELEVANT CONSIDERATIONS)

  Descreva qualquer consideração adicional ou relacionada aos itens preenchidos neste formulário.

  (Describe any additional considerations or any considerations related to the information
  filled in this form)Data de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  FORMULÁRIO DE SOLICITAÇÃO DE APROVAÇÃO/AUTORIZAÇÃO ESPECIAL

  PARA TRANSPORTE DE ARTIGOS PERIGOSOS POR VIA AÉREA

  (REQUEST FORM FOR DANGEROUS GOODS APPROVAL/EXEMPTION) PÁGINA 12 DE 12

  H. DOCUMENTOS ANEXOS, DATA E ASSINATURA (ATTACHED FILES, DATE AND SIGNATURE)'
