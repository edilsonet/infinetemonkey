text: '10. APROVAÇÃO (APPROVAL)

  10.1. Quando esteja especificamente previsto no RBAC nº 175 e na IS nº 175-001, os países

  interessados poderão outorgar uma aprovação, sempre que em tais casos se atinja um

  nível geral de segurança operacional no transporte que seja equivalente àquele previsto

  no RBAC nº 175 e na IS nº 175-001.

  10.2. Uma aprovação, conforme definida nesta IS, é requerida e poderá ser outorgada para
  os

  seguintes casos:'
