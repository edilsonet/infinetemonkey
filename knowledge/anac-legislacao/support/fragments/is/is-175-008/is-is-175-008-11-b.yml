section_title: AUTORIZAÇÃO ESPECIAL (EXEMPTION)
subsection_id: b
cite: 11(b)
title: 11(b)
text: 'b) um exame do possível aumento do risco para a segurança operacional ou para os bens

  que pode resultar do desvio das disposições em questão, e a identificação das medidas

  consideradas necessárias ou apropriadas para abordar o risco. Isso deveria incluir provas

  de análise ou avaliações aplicáveis para demonstrar que as medidas adicionais propostas

  permitirão atingir um nível de segurança operacional no mínimo igual ao que se requer

  na regulamentação vigente;'
