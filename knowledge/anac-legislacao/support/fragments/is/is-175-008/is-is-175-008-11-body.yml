title: AUTORIZAÇÃO ESPECIAL (EXEMPTION)
text: '11. AUTORIZAÇÃO ESPECIAL (EXEMPTION)

  Nota: a autorização especial (exemption), anteriormente denominada “isenção

  (exemption)”, não se confunde com a figura da isenção prevista no RBAC nº 11. A

  autorização especial corresponde à figura da exemption das Instruções Técnicas e se

  limita às situações previstas detalhadas em 175.1(d) e (e) do RBAC nº 175, podendo ser

  aprovada no âmbito da Superintendência de Padrões Operacionais. Já a isenção pode ser

  solicitada para qualquer requisito estabelecido pela ANAC e precisa ser aprovada pela

  Diretoria. Esta IS não se aplica à solicitação de isenção prevista no RBAC nº 11, para a

  qual devem ser observados o próprio RBAC nº 11 e a Instrução Normativa nº 154.

  11.1. Em casos de extrema urgência, ou quando outros modos de transporte sejam

  inapropriados, ou quando o total cumprimento dos requisitos descritos seja contrário ao

  interesse público, os países interessados poderão outorgar uma autorização especial.

  11.2. Para a emissão de uma autorização especial, todos os esforços devem ser tomados para

  atingir um nível geral de segurança operacional no transporte equivalente ao nível provido

  pelo total cumprimento da regulamentação vigente.

  11.3. Em voos internacionais envolvendo o Brasil, além da autorização especial emitida pela

  ANAC, requer-se autorização especial emitida pelo país do operador aéreo, país de

  origem, países de trânsito, país de sobrevoo e país de destino da remessa, conforme

  aplicável.

  11.4. Para o Brasil como país de sobrevoo, se nenhum dos critérios para emissão de uma

  autorização especial for relevante, uma autorização especial poderá ser outorgada desde

  que identificado um nível equivalente de segurança operacional para o transporte aéreo.

  11.5. São exemplos de autorização especial: volumes acima do tamanho ou peso permitido pelo

  na instrução de embalagem do artigo perigoso, transporte de artigos perigosos proibidos

  sob circunstâncias normais etc.

  11.6. Ao solicitar uma autorização especial, deve-se considerar a razão pela qual é importante

  que uma remessa chegue rapidamente ao seu destino ou a razão pela qual tenha sido

  necessário apresentar uma solicitação com pouca antecedência. Sob a alegação de

  extrema urgência, os artigos perigosos podem ter que ser transportados devido às

  seguintes razões:Data de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C'
