text: 'c) melhorias em questões de segurança operacional.

  11.10. Ao solicitar uma autorização especial, o requerente deverá informar a razão pela
  qual é

  indispensável que o artigo ou substância seja transportado por via aérea, em conformidade

  com os itens 11.6, 11.8 e 11.9.Data de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  11.11. Não serão concedidas autorizações especiais para transporte de artigos perigosos

  assinalados como proibidos sob quaisquer circunstâncias, conforme estabelecido em 6.4.

  Para artigos perigosos proibidos em aeronaves de passageiros e de carga, normalmente se

  considerará somente o transporte em aeronaves de carga. O transporte de artigos

  perigosos sob autorização especial em aeronaves de passageiros somente será

  considerado em situações excepcionais.

  11.12. Passageiros e membros da tripulação de cabine não poderão ser transportados em uma

  aeronave transportando artigos perigosos sob uma autorização especial, a menos que as

  condições de tal autorização especial garantam um nível de segurança operacional

  equivalente àquele provido pela regulamentação vigente.

  11.13. O transporte de artigo perigoso indicado como "Proibido" ("Forbidden") nas colunas
  10

  a 13 da Lista de Artigos Perigosos, ainda que as Provisões Especiais A1 ou A2 não

  estejam atribuídas à sua entrada na coluna 5 da Lista, pode ser autorizado por meio da

  outorga de uma autorização especial por parte da autoridade nacional apropriada dos

  países interessados.

  11.14. Ao se solicitar uma autorização especial para o transporte de artigo perigoso indicado

  como "Proibido" ("Forbidden") nas colunas 10 a 13 da Lista de Artigos Perigosos, as

  limitações de quantidade a serem permitidas serão aquelas indicadas nas Tabelas S-3-2 e

  S-3-3 do Suplemento, quando aplicável.

  11.15. O requerente da autorização especial será aquele cujas responsabilidades são mais

  pertinentes. Por exemplo, para uma autorização especial para o transporte de artigos

  perigosos proibidos em circunstâncias normais, o mais apropriado é que a solicitação

  parta do expedidor. Não obstante, a autorização especial deverá incluir todos os afetados.

  Independentemente de quem seja o responsável, o operador aéreo deverá estar em posse

  da confirmação de que foram outorgadas as autorizações especiais necessárias antes de

  aceitar os artigos perigosos para transporte.

  11.16. Em geral, cada autorização especial será outorgada para uma ocasião determinada.
  Porém

  pode ser necessário outorgar autorizações especiais por períodos que contemplem

  ocasiões múltiplas ou compreendam expedidores distintos.

  11.17. O requerente tem a responsabilidade de especificar os requisitos do RBAC nº 175 e
  da IS

  nº 175-001 que intenciona não cumprir e deverá assegurar-se de proporcionar informação

  de apoio para demonstrar que, com as condições de transporte propostas, todo o esforço

  foi feito para se atingir um nível de segurança operacional igual ou superior àquele

  prescrito na regulamentação vigente.

