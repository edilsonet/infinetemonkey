section_title: AUTORIZAÇÃO ESPECIAL (EXEMPTION)
subsection_id: d
cite: 11(d)
title: 11(d)
text: 'd) quando aplicável, os fatores de mitigação de risco e a análise da segurança operacional

  podem basear-se em uma analogia com os requisitos existentes para tecnologias que

  representam riscos similares, com o fim de garantir consistência da segurança operacional

  e da regulamentação.

  11.19. Uma cópia do documento de autorização especial deverá ser proporcionada ao operador

  aéreo interessado, caso este não seja um dos requerentes.

  11.20. Ao receber uma solicitação de outorga de autorização especial por parte de um operador

  aéreo, seja esta uma solicitação original, a renovação de uma autorização especial ou a

  revisão de uma autorização especial existente, a ANAC analisará a solicitação e verificará

  a competência e os antecedentes de cumprimento dos regulamentos por parte do

  requerente.

  11.21. Ao solicitar uma autorização especial que envolva o transporte de artigos perigosos
  de

  alta consequência, o requerente deverá adicionalmente cumprir com os requisitos

  aplicáveis do RBAC n° 108.'
