title: FASES DO PROCESSO
text: '12. FASES DO PROCESSO

  12.1. Fase 1 - Orientação Prévia

  12.1.1. O interessado em obter uma aprovação ou autorização especial para o transporte de
  artigo

  perigoso deverá proceder com a leitura desta IS e o estudo dos requisitos aplicáveis

  presentes nos regulamentos nacionais e internacionais sobre o transporte de artigos

  perigosos por via aérea.

  12.2. Fase 2 - Solicitação Formal

  12.2.1. Todas as solicitações de aprovação e autorização especial devem ser submetidas por

  protocolo eletrônico, para a gerência responsável pelo operador na Superintendência de

  Padrões Operacionais, seja a Gerência de Operações de Empresas de Transporte Aéreo

  (GCTA), seja a Gerência de Operações da Aviação Geral (GOAG).

  12.2.2. Nos casos em que o requerente não tenha sede administrativa em território brasileiro,
  aData de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  solicitação de aprovação ou autorização especial poderá ser encaminhada via e-mail, para

  artigo.perigoso@anac.gov.br.

  12.2.3. Antes de requerer uma aprovação ou autorização especial, o expedidor, ou pessoa
  atuando

  em seu nome, deveria selecionar um operador aéreo apropriado que possua autorização

  geral ou específica adequada para transportar artigos perigosos.

  12.2.4. A solicitação de aprovação e autorização especial deverá ser feita por meio do formulário

  disponível no Apêndice A desta IS.

  12.2.5. Quando uma pessoa solicita uma autorização especial para transportar artigos perigosos

  por via aérea, informações específicas deverão ser providas pelo requerente. É

  responsabilidade do requerente:'
