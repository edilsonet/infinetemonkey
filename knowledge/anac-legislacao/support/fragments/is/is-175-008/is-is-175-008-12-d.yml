title: 12(d)
text: 'd) prover uma explicação de como as ações tomadas garantem um nível de segurança

  operacional equivalente àquele estabelecido pela regulamentação vigente.

  12.2.7. Quando um nível de segurança operacional equivalente àquele provido pela

  regulamentação vigente não for atingível por meio de procedimentos de embalagem e

  manuseio e, ainda assim, a emissão de uma autorização especial for justificada sob as

  condições do item 11.1, alguns procedimentos operacionais adicionais da aeronave queData
  de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  possam ser necessários para garantir a segurança da população poderão ser estabelecidos.

  Tais procedimentos podem incluir: restrições no uso de determinados aeródromos e pistas

  de pouso e decolagem, limitações nas direções de pouso e decolagem, definição de rotas

  específicas para o transporte dos artigos perigosos, etc.

  12.2.8. De acordo com a natureza da aprovação ou autorização especial requerida, a ANAC

  poderá solicitar do requerente:'
