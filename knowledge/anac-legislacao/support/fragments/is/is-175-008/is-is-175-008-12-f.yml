text: 'f) condução de demonstração.

  12.2.9. O requerente deverá enviar solicitação de aprovação ou de autorização especial com

  antecedência mínima de 30 dias da data de início de sua vigência, exceto em casos de

  extrema urgência, conforme item 11.6 desta IS, quando a solicitação poderá ser enviada

  em prazo inferior.

  Nota: ainda que não seja requerida extrema urgência para a outorga de uma aprovação,

  os casos de aprovação que envolvam extrema urgência poderão se valer da redução de

  prazo prevista neste item.

  12.2.10. A solicitação de aprovação e autorização especial deveria ser feita pelo expedidor
  em

  conjunto com o operador aéreo.

  12.3. Fase 3 - Análise de Procedimentos

  12.3.1. Nas análises de solicitação de aprovação e autorização especial, a ANAC levará em

  consideração a segurança das operações aéreas, bem como a segurança de terceiros e os

  riscos a funcionários de manuseio, carregamento e resposta a emergências.

  12.3.2. Na análise da solicitação de aprovação ou autorização especial, a ANAC levará em

  consideração a segurança da população bem como a disponibilidade prática de métodos

  alternativos para o transporte, a menos que um nível de segurança operacional equivalente

  àquele provido pela regulamentação vigente possa ser atingido por meio de

  procedimentos adequados de embalagem e manuseio.

  12.3.3. Pesquisas e investigações adicionais poderão ser realizadas antes da determinação
  de um

  parecer sobre a solicitação de aprovação ou autorização especial.

  12.3.4. Na análise das solicitações de aprovação e autorização especial, a ANAC consideraráData
  de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  todas as informações providas bem como dados e informações presentes em seus registros

  sobre o requerente.

  12.3.5. Caso o requerente tenha possuído uma aprovação ou autorização especial que tenha
  sido

  revogada, a ANAC levará em consideração os motivos para tal revogação, bem como as

  evidências de que o requerente possui capacidade de executar suas funções necessárias

  para o recebimento da aprovação ou autorização especial.

  12.3.6. Caso as informações no formulário de solicitação não estejam precisas e totalmente

  completas, a solicitação poderá ser negada.

  12.4. Fase 4 - Demonstrações e Inspeções

  12.4.1. Poderão ser utilizados métodos baseados em simulações para a fase de demonstrações
  e

  inspeções das solicitações de aprovação e autorização especial.

  12.5. Fase 5 - Outorga

  12.5.1. A ANAC notificará o requerente por escrito sobre sua decisão a respeito da outorga
  ou

  não da aprovação ou autorização especial requerida de acordo com a presente IS.

  12.5.2. O requerente e outras pessoas que se beneficiem de uma aprovação ou autorização

  especial deverão cumprir com as condições especiais necessárias para garantir que a

  segurança operacional seja mantida. Tais condições podem envolver meios alternativos

  de cumprimento para que a segurança operacional não seja comprometida.

  12.5.3. O não cumprimento com as condições impostas em uma aprovação ou autorização

  especial constituem descumprimento com os regulamentos de aviação civil e,

  consequentemente, com a Lei 7.565/86, o que poderá ensejar em providências

  administrativas em conformidade com a Resolução nº 472/ANAC, de 6 de junho de 2018,

  sem prejuízo de quaisquer penalidades penais.

  12.5.4. Mesmo que uma aprovação ou autorização especial estabeleça que determinados artigos

  perigosos possam ser transportados sob suas condições, todos os outros requisitos do

  12.5.5. Para qualquer aprovação e autorização especial emitida, uma cópia do documento de

  aprovação ou autorização especial, conforme aplicável, deverá ser mantida pelo

  requerente, expedidor e/ou operador aéreo, anexa a seu manual de procedimentos e dentro

  de cada aeronave que transporte artigos perigosos sob as condições de tal aprovação ou

  autorização especial, podendo estar em formato eletrônico.

  12.5.6. A aprovação e a autorização especial iniciarão sua vigência no momento estabelecido
  no

  documento ou na data de emissão do documento.

  12.5.7. O requerente deverá observar a data e as circunstâncias em que se expira a aprovação
  ou

  autorização especial, que poderá ocorrer após um número de horas de operação, após uma

  data específica ou após um evento específico.Data de emissão: 15 de março de 2021

