title: RENOVAÇÃO
text: '14. RENOVAÇÃO

  14.1. Uma pessoa poderá requerer a renovação de uma aprovação ou autorização especial que

  esteja vigente ou que tenha sido emitida em momento anterior. Tal renovação poderá ser

  solicitada sob as mesmas condições providas na solicitação original, entretanto, quando

  as quantidades, tipos ou embalagens de artigos perigosos forem alterados, ou ainda

  quando o tipo de aeronave ou operador aéreo forem diferentes da solicitação original,

  uma nova solicitação e a provisão de dados e informações relacionados a essa nova

  solicitação deverão ser fornecidos.

  14.2. A existência de uma aprovação ou autorização especial prévia não garante ao requerente

  a renovação ou emissão de uma aprovação ou autorização especial futura nos mesmos ou

  similares termos da anterior. Cada solicitação será julgada em seu mérito no momento em

  que for requerida.'
