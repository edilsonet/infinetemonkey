title: Especificar as condições adicionais a serem aplicadas durante a operação
text: '2. Especificar as condições adicionais a serem aplicadas durante a operação

  (Specify the considerations that will be applied during operation)

  a. Planejamento de voo para evitar zonas densamente povoadas

  (Flight planning to avoid population-dense areas)

  b. Transporte de equipamento adicional de extinção de fogo

  (Carriage of additional firefighting equipment)

  c. Requisitos adicionais de segregação

  (Additional segregation requirements)

  d. Outras condições não listadas anteriormente

  (Other considerations not listed above)

  3. Para cada condição informada nos itens D.2.1 e D.2.2, informar o item e descrever as
  modificações, limitações,

  restrições ou equipamentos impostos para possibilitar a equivalência no nível de segurança
  operacional

  (For each consideration marked on the items D.2.1 and D.2.2, inform the item and describe
  the modifications, limitations, restrictions or

  equipment imposed to make the equivalency)

  4. Explicação de como as ações tomadas garantem um nível de segurança operacional equivalente
  àquele

  estabelecido pela regulamentação vigente.

  (Explain how the actions taken provide an equivalent level of safety to those intended by
  the regulation.)Data de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  FORMULÁRIO DE SOLICITAÇÃO DE APROVAÇÃO/AUTORIZAÇÃO ESPECIAL

  PARA TRANSPORTE DE ARTIGOS PERIGOSOS POR VIA AÉREA

  (REQUEST FORM FOR DANGEROUS GOODS APPROVAL/EXEMPTION) PÁGINA 8 DE 12'
