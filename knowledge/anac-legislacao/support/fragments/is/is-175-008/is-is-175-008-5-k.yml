title: 5(k)
text: 'k) Classe 7 - materiais radioativos em quantidades superiores a 3 000 A1 (em forma

  especial) ou 3 000 A2 conforme seja aplicado em embalagens do Tipo B e Tipo C.

  5.1.2. autorização para transportar artigos perigosos: autorização emitida pela autoridade

  de aviação civil do país do operador aéreo que lhe permite transportar artigos perigosos

  permitidos em suas aeronaves;

  Nota 1: para operadores aéreos brasileiros que operam conforme os requisitos do RBAC

  n° 121 ou RBAC n° 135, esta autorização é dada em suas especificações operativas.

  Nota 2: esta autorização pode ser geral, para todos os tipos de artigos perigosos

  permitidos, ou específica, por exemplo, somente Divisão 6.2 e Classe 9; somente

  Substâncias Biológicas, Categoria B, UN 3373; somente COMAT; somente artigos

  perigosos em quantidades excetuadas; ou uma combinação delas.'
