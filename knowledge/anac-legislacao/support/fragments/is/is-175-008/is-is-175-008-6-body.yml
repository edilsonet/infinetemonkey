title: INTRODUÇÃO
text: '6. INTRODUÇÃO

  6.1. As Instruções Técnicas, no âmbito internacional, e o RBAC nº 175 e a IS nº 175-001,
  no

  âmbito da ANAC, estabelecem condições para transportar artigos perigosos por via aérea

  de maneira segura. Tais condições são frequentemente mais rigorosas do que aquelas

  aplicáveis a outros modos de transporte, tendo em vista a natureza única e a sensibilidade

  do transporte aéreo.

  6.2. Esta IS provê informação a pessoas que requeiram autorização para expedir ou transportar

  artigos perigosos a bordo de aeronaves civis quando tal transporte não seja normalmente

  e automaticamente permitido sob uma autorização geral ou específica para transportar

  artigos perigosos e quando uma aprovação ou autorização especial for requerida de

  acordo com o RBAC nº 175 e a IS nº 175-001.

  6.3. Na aplicação desta IS, devem-se considerar as disposições contidas no RBAC nº 175 e
  a

  IS nº 175-001, nas Instruções Técnicas e/ou no Suplemento, dependendo de cada caso

  específico.

  6.4. Alguns artigos perigosos são considerados demasiadamente perigosos para serem

  transportados por aeronaves e, por isso, seu transporte é proibido sob quaisquer

  circunstâncias. Entre esses artigos incluem-se objetos ou substâncias que, na forma

  apresentada para transporte, são suscetíveis a explodir, reagir perigosamente, produzir

  chamas ou evolução perigosa de calor ou, ainda, emissão perigosa de gases ou vapores

  tóxicos, corrosivos ou inflamáveis, sob condições normalmente encontradas no

  transporte. Certos artigos que se enquadram nessa descrição aparecem na Lista de Artigos

  Perigosos (Tabela C-1 da IS nº 175-001) com a palavra "Proibido" ("Forbidden”) na

  coluna 3, mas não necessariamente se incluem nessa lista todos os casos possíveis.

  6.5. Alguns artigos perigosos são proibidos em circunstâncias normais, mas podem ser

  transportados sob condições especiais de uma aprovação outorgada pelos países

  interessados, seguindo-se as disposições das Instruções Técnicas e do Suplemento,Data de
  emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  sempre que possível. Alguns desses artigos podem ter seu transporte restrito a aeronaves

  unicamente de carga e outros podem ser transportados tanto em aeronaves de carga quanto

  de passageiros, sempre que se cumpram com as condições requeridas.

  6.6. Para os casos em que se intencione transportar artigos perigosos proibidos em

  circunstâncias normais, mas que as Instruções Técnicas não determinem que possam ser

  transportados sob uma aprovação, pode-se solicitar uma autorização especial aos países

  interessados, sujeito aos casos estabelecidos no RBAC n° 175.

  6.7. O parágrafo 175.1(c) do RBAC n° 175 estabelece os casos em que artigos perigosos

  requerem uma aprovação para serem transportados, enquanto os parágrafos 175.1(d) e (e)

  estabelecem os casos em que artigos perigosos podem ser transportados mediante uma

  autorização especial.'
