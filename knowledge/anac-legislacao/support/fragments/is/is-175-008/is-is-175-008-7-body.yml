text: '7. CONDIÇÕES GERAIS

  7.1. Qualquer pessoa pode requerer uma aprovação ou autorização especial da ANAC para

  expedir ou transportar por via aérea, por meio de aeronave civil, artigos perigosos que

  não sejam permitidos em condições normais sob uma autorização geral ou específica para

  transportar artigos perigosos.

  7.2. A responsabilidade pela obtenção de uma aprovação ou autorização especial pode ser
  do

  expedidor, do operador aéreo, ou de ambos, ou ainda das pessoas atuando em seu nome,

  dependendo da natureza do artigo perigoso a ser transportado.

  7.3. Dependendo de cada caso, a ANAC poderá exigir o envolvimento do expedidor ou do

  operador aéreo na solicitação de uma aprovação ou autorização especial submetida à

  análise da Agência.

  7.4. A obtenção de uma aprovação ou autorização especial outorgada por outros países

  interessados, que não o Brasil, pode ser de responsabilidade do expedidor e/ou do

  operador aéreo, de acordo com os regulamentos de cada país.

  7.5. Uma aprovação ou autorização especial emitida pela ANAC não confere direitos ao

  requerente sobre o transporte de artigos perigosos em território de outros países que não

  o Brasil.

  7.6. Quando se requeira uma aprovação ou autorização especial de mais de um país, o

  requerente deverá considerar solicitar a autorização inicial ao país de origem, uma vez

  que o expedidor está localizado em território sob sua jurisdição e possui mais

  conhecimento sobre os termos e condições sob os quais se expedirão os artigos perigosos.

