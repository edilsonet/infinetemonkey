title: 7(f)
text: 'f) uma combinação de itens acima.

  7.8. Uma aprovação ou autorização especial para transportar artigo perigoso proibido somente

  pode ser requerida para aqueles artigos perigosos que possuam número UN atribuído,

  ainda que sejam identificados com a palavra “Proibido” (“Forbidden”) nas colunas 10 e

  11 ou 12 e 13 da Lista de Artigos Perigosos, conforme cada caso específico.

  7.9. Aplica-se uma aprovação ou autorização especial também aos artigos ou substâncias não

  listados mas que possuam propriedades correspondentes às daqueles artigos presentes na

  Lista de Artigos Perigosos.

  7.10. Salvo em situação excepcional, uma aprovação ou autorização especial não será

  outorgada para transporte de artigos perigosos a um operador aéreo que não possua

  autorização geral ou específica para transportar artigos perigosos, o que pressupõe a

  existência de procedimentos e treinamentos aprovados pela autoridade de aviação civil

  do seu país.

  7.11. Independentemente de quem seja o responsável pela obtenção de uma aprovação ou

  autorização especial, o operador aéreo deverá estar em posse da confirmação de que todas

  aprovações ou autorizações especiais requeridas foram obtidas, seja da ANAC, de outros

  países interessados e/ou de outros órgãos aplicáveis, antes da aceitação dos artigos

  perigosos.

  7.12. Quando artigos perigosos forem transportados sob as condições de uma aprovação ou

  autorização especial, uma cópia do documento de aprovação ou autorização especial,

  conforme aplicável, deve acompanhar a remessa até seu destino final. Para transporte

  internacional, aplica-se uma cópia de cada um dos documentos de aprovação ou

  autorização especial emitidos por todos os países interessados.

  7.12.1. Os documentos de aprovação ou autorização especial poderão estar em formato

  eletrônico, contanto que estejam disponíveis ao operador aéreo a todo momento durante

  o transporte até seu destino final e que seja possível reproduzi-los em formato impresso

  imediatamente.'
