text: '8. CONDIÇÕES ADICIONAIS RELACIONADAS À SEGURANÇA

  OPERACIONALData de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  8.1. Ao solicitar uma aprovação, o requerente deve comprovar que se mantém um nível de

  segurança operacional equivalente.

  8.2. Ao solicitar uma autorização especial, o requerente deve fazer todo o esforço para
  se

  manter um nível de segurança operacional equivalente, exceto que, no caso do item 11.4,

  o nível equivalente deve ser comprovado.

  8.3. Um nível de segurança operacional equivalente se mantém quando, mediante medidas

  compensatórias, se garante um nível geral de segurança operacional que equivale àquele

  previsto na regulamentação vigente, incluindo o RBAC nº 175 e a IS nº 175-001.

  8.4. Ao solicitar uma aprovação ou autorização especial, o operador aéreo deve considerar

  algumas restrições e condições adicionais, além daquelas já descritas nos regulamentos e

  no documento de aprovação ou autorização especial, tais como:'
