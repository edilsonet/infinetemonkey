cite: 8(i)
title: 8(i)
text: 'i) requisitos adicionais de segregação.

  8.5. Esta lista de condições não é exaustiva. É necessário que se identifiquem todos os
  perigos

  e que se faça uma avaliação dos riscos antes de obter uma aprovação ou autorização

  especial.

  8.6. Quando uma entrada na Tabela S-3-1 do Suplemento tiver um número entre parêntesis

  após a palavra "Proibido" ("Forbidden"), este refere-se à Instrução de Embalagem que

  contém o método de embalagem que deve ser seguido pelo requerente de uma aprovação

  ou autorização especial. Na medida do possível, os números apropriados das instruções

  de embalagem estão indicados nas colunas 10 e 12 da Tabela S-3-1 do Suplemento e os

  requisitos detalhados associados a essas aparecerão na Parte S-4, quando houver

  requisitos adicionais àqueles descritos no RBAC nº 175 e na IS nº 175-001. A ausência

  de artigos ou substâncias naquela tabela ou a ausência de informações completas naData de
  emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  mesma tabela não eximem a necessidade de uma aprovação ou autorização especial,

  quando aplicável.

  8.7. A fim de garantir a segurança operacional de artigos perigosos sob uma aprovação ou

  autorização especial e, ainda, para prover informação ao piloto em comando em caso de

  uma emergência envolvendo tais artigos, poderá ser permitida ou exigida pela ANAC a

  presença de uma pessoa para acompanhar a remessa a bordo da aeronave.'
