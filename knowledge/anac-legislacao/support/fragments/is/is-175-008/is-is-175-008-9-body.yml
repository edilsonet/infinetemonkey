title: CONDIÇÕES ESPECIAIS PARA EXPLOSIVOS
text: '9. CONDIÇÕES ESPECIAIS PARA EXPLOSIVOS

  9.1. Normalmente, não se permite o transporte por via aérea da maioria das divisões e grupos

  de compatibilidade de explosivos que aparecem na Lista de Artigos Perigosos. No caso

  em que se requeira outorga de uma aprovação ou autorização especial para o transporte

  de explosivos proibidos em circunstâncias normais, a menos que se autorize de outra

  maneira, o requerente deve cumprir com as instruções da Tabela S-3-1 do Suplemento

  das Instruções Técnicas referente ao artigo específico que se intencione transportar.

  9.2. A expedição e transporte por via aérea de explosivos em quantidades superiores àquelas

  autorizadas pelo RBAC nº 175 e pela IS nº 175-001 somente poderão ser realizados

  mediante as disposições de uma autorização especial.

  9.3. A emissão de uma aprovação ou autorização especial para transporte de explosivos não

  exime o operador aéreo de cumprir com qualquer outra norma de outro órgão relacionada

  com a custódia, armazenagem, manuseio ou transporte de tais explosivos, ou quaisquer

  outros requisitos ou limitações impostas pela administração dos aeródromos envolvidos

  na operação.

  9.4. Em todos os casos envolvendo o transporte de explosivos em que uma aprovação ou

  autorização especial não atinja um nível de segurança operacional equivalente àquele

  provido pela regulamentação vigente, requisitos adicionais de carregamento, manuseio,

  armazenagem, segregação e outros apropriados ao tipo de explosivo a ser transportado

  serão especificados a fim de reduzir, tanto quanto possível, a probabilidade e os efeitos

  de uma detonação acidental. Tais requisitos podem incluir o transporte de uma pessoa,

  além dos membros da tripulação, a qual tenha conhecimento suficiente sobre as

  características dos explosivos transportados a fim de assessorar o piloto em comando com

  ações adequadas a serem tomadas em qualquer circunstância que afete a segurança dos

  explosivos. Em situações que a presença dessa pessoa não seja apropriada, o piloto em

  comando deverá obter, antes do voo, detalhes necessários sobre os explosivos que o

  permitam tomar ações adequadas que possam ser necessárias.

  9.5. Os operadores dos aeródromos de origem, destino, trânsito e alternativa deverão ser

  contatados para assegurar que estes podem aceitar e facilitar o carregamento,

  descarregamento, abastecimento e suporte técnico à aeronave que esteja transportando

  explosivos sob uma aprovação ou autorização especial.

  9.6. Quando as condições de uma autorização especial não atingirem o nível de segurança

  operacional provido pela regulamentação vigente, o operador aéreo transportando

  explosivos deverá notificar os aeródromos de origem, destino, trânsito e alternativa sobreData
  de emissão: 15 de março de 2021

  IS nº 175-008

  Revisão C

  detalhes dos explosivos e dos voos no qual estes serão transportados, antes que tais

  explosivos cheguem ao aeródromo de origem.

  9.7. O operador aéreo será responsável pela segurança dos explosivos, estando ou não a bordo

  da aeronave o proprietário da remessa ou um funcionário atuando em seu nome.'
