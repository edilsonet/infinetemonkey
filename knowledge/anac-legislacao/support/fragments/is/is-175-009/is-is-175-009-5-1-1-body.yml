title: Esta IS estabelece o preenchimento do Relatório de Transporte de Artigos Perigosos,
text: '5.1.1 Esta IS estabelece o preenchimento do Relatório de Transporte de Artigos Perigosos,

  incluindo as regras para notificação à ANAC e as regras de preenchimento dos campos

  do relatório. O objetivo é a padronização do preenchimento dos dados pelos diferentes

  operadores aéreos, assim como a clarificação dos procedimentos de envio desses dados à

  ANAC.'
