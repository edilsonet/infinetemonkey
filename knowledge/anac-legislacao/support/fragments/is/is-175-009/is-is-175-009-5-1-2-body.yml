title: Conforme determina o parágrafo 175.399(a) do RBAC nº 175, o transporte de todos os
text: '5.1.2 Conforme determina o parágrafo 175.399(a) do RBAC nº 175, o transporte de todos
  os

  volumes de artigos perigosos, como carga ou COMAT, que tenham origem ou destino no

  território brasileiro deve ser informado à ANAC - o que é feito por meio do Relatório de

  Transporte de Artigos Perigosos. Isso abrange o transporte de artigos perigosos realizados

  por operadores aéreos regidos por qualquer regulamento da ANAC, incluindo o RBAC

  nº 91, o RBAC nº 121, o RBAC nº 129 e o RBAC nº 135. Isso também abrange qualquer

  situação de celebração de contrato de fretamento ou arrendamento de aeronaves e de

  prestação de serviços aéreos. Isso abrange, ainda, o transporte de artigos perigosos por

  mala postal ou encomenda.

  5.2 Dos artigos perigosos a serem reportados no Relatório de Transporte de Artigos

  Perigosos'
