title: As informações declaradas pelo operador aéreo no Relatório de Transporte de Artigos
text: '5.2.3 As informações declaradas pelo operador aéreo no Relatório de Transporte de Artigos

  Perigosos devem estar consoantes com as informações presentes no Conhecimento de

  Transporte Eletrônico (CT-e) para operações domésticas e no Airway Bill (AWB) para

  operações internacionais.

  5.3 Do preenchimento do Relatório de Transporte de Artigos Perigosos'
