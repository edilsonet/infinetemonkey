title: O Relatório de Transporte de Artigos Perigosos deve ser preenchido conforme o modelo
text: '5.3.1 O Relatório de Transporte de Artigos Perigosos deve ser preenchido conforme o
  modelo

  de planilha definido pela ANAC, não podendo o mesmo ser alterado pelo operador aéreo.

  O modelo de arquivo a ser utilizado encontra-se disponível em

  https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos.'
