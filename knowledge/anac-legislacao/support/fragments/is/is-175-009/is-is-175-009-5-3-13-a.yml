section_title: O campo “Número operacional do CT-e” deve ser preenchido com o número de controle
subsection_id: a
cite: 5.3.13(a)
title: 5.3.13(a)
text: 'a) Operadores aéreos que utilizam o padrão de numeração do conhecimento aéreo

  composto de onze dígitos devem, obrigatoriamente, preencher esse campo. O

  preenchimento eletrônico deve ser apenas com números, sem espaços ou símbolos.'
