section_title: O campo “Número operacional do CT-e” deve ser preenchido com o número de controle
subsection_id: b
cite: 5.3.13(b)
title: 5.3.13(b)
text: 'b) Não são permitidos truncamentos do número operacional do conhecimento aéreo,

  ou seja, o número inserido no sistema deve conter apenas os 11 dígitos, de maneira

  que todos esses dígitos sejam incluídos no CT-e.'
