title: O campo “Número do AWB (Master)” deve ser preenchido com o número do Airway Bill
text: '5.3.15 O campo “Número do AWB (Master)” deve ser preenchido com o número do Airway
  Bill

  ou Master Airway Bill. Quando o transporte for doméstico, o campo deve ser preenchido

  com “N/A”. Não pode haver espaços ou hífens.'
