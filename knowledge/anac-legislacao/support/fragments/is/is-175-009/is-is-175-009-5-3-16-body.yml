title: O campo “Número do AWB (House)” deve ser preenchido com o número do House
text: '5.3.16 O campo “Número do AWB (House)” deve ser preenchido com o número do House

  Airway Bill. Quando o transporte for doméstico ou quando não houver House Airway

  Bill, o campo deve ser preenchido com “N/A”. Não pode haver espaços ou hífens.'
