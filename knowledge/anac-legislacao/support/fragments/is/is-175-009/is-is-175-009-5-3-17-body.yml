title: O campo “Número UN ou ID” deve ser preenchido com o número das Organizações das
text: '5.3.17 O campo “Número UN ou ID” deve ser preenchido com o número das Organizações
  das

  Nações Unidas - UN - ou o número de identificação provisório - ID - de quatro dígitos.

  Não é permitido usar os textos “UN” ou “ID” além dos quatro dígitos que designam o

  artigo perigoso.'
