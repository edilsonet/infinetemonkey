title: O campo “Quantidade total” deve indicar a quantidade total do artigo perigoso, ou seja,
text: '5.3.19 O campo “Quantidade total” deve indicar a quantidade total do artigo perigoso,
  ou seja,

  o somatório das quantidades de cada volume declarado, tendo como base a unidade

  referenciada na Tabela C-1 da IS nº 175-001, por exemplo: litros; quilogramas;

  quilograma bruto etc. O preenchimento não deve incluir a unidade de medida. O campo

  não deve indicar a quantidade do artigo perigoso por volume.'
