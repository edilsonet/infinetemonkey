title: O preenchimento do Relatório de Transporte de Artigos Perigosos deve levar em
text: '5.3.2 O preenchimento do Relatório de Transporte de Artigos Perigosos deve levar em

  consideração os volumes que são transportados em cada voo. Se houver conexão ou

  escala, os mesmos volumes, indicados por seu número de conhecimento aéreo, deverão

  aparecer mais de uma vez, constando em todos os voos em que forem transportados.'
