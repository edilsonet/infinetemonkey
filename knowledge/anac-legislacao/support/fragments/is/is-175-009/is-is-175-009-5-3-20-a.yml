section_title: O campo “Unidade de medida” deve indicar a unidade de medida utilizada no campo
subsection_id: a
cite: 5.3.20(a)
title: 5.3.20(a)
text: 'a) Deve ser escolhida uma das seguintes opções: KG; KG G (quilograma bruto);

  LITROS; TI (índice de transporte para radioativos); UNIDADES (apenas para

  artigos perigosos medidos em unidades que não se enquadram nos itens acima.

  Exemplo: baterias, celulares, equipamentos, veículos, dentre outros).'
