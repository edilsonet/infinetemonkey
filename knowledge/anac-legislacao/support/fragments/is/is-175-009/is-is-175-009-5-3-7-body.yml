title: O campo “Número do voo” deve ser preenchido com os algarismos que representam o
text: '5.3.7 O campo “Número do voo” deve ser preenchido com os algarismos que representam
  o

  voo do operador aéreo. Não se deve utilizar letras que indiquem o trigrama ou código do

  operador aéreo. Não pode haver espaços ou hífens.'
