text: '5.4.3 O operador aéreo que possui autorização para o transporte de artigos perigosos
  em suas

  Especificações Operativas, mas que não transportar artigos perigosos em determinado

  mês deverá encaminhar correio eletrônico, conforme instruções do site

  http://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/artigos-perigosos

  informando que não houve transporte em determinado mês.'
