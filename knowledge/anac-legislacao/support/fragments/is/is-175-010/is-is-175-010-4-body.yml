title: REFERÊNCIA
text: '4. REFERÊNCIA

  4.1. Lei n° 7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica
  - CBA.

  4.2. Regulamento Brasileiro de Aviação Civil n° 175 - RBAC n° 175.

  4.3. Anexo 18 à Convenção sobre Aviação Civil Internacional: Transporte Seguro de Artigos
  Perigosos por Via Aérea - The Safe Transport of Dangerous Goods by Air.

  4.4. Doc 9284 da OACI: Instruções Técnicas para o Transporte Seguro de Artigos Perigosos
  por Via Aérea - Technical Instructions for Safe Transport of Dangerous Goods by Air.

  4.5. Doc 9481 da OACI: Guia de Resposta a Emergências para Incidentes Aeronáuticos Envolvendo
  Artigos Perigosos - Emergency Response Guidance for Aircraft Incidentes Involving Dangerous
  Goods.'
