title: 6(a)
text: 'a) quando carregados:

  1) em compartimento de carga Classe C;

  2) em uma ULD equipada com sistema de supressão/detecção de fogo equivalente àquele requerido
  pelos requisitos de certificação de compartimentos de carga Classe C, conforme determinado
  pela autoridade nacional apropriada;

  3) como carga externa por um helicóptero; ou

  4) com aprovação do País do Operador Aéreo, para operações de helicópteros, na cabine; ou'
