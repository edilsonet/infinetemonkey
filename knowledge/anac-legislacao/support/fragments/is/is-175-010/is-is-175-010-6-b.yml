text: 'b) quando classificados como:

  1) líquidos inflamáveis (Classe 3), Grupo de Embalagem III, salvo aqueles com perigo secundário
  na Classe 8;

  2) substâncias tóxicas (Divisão 6.1) sem perigo secundário ou com perigo secundário na Classe
  3;

  3) substâncias infectantes (Divisão 6.2);

  4) material radioativo (Classe 7);

  5) artigos perigosos diversos (Classe 9);

  6) UN 3528 - Motores, combustão interna, movidos a líquido inflamável, Motores, células
  de combustível, movidos a líquido inflamável, Maquinaria, combustão interna, movida a líquido
  inflamável e Maquinaria, células de combustível, movida a líquido inflamável; ou

  7) UN 3529 - Motores, combustão interna, movidos a gás inflamável, Motores, células de combustível,
  movidos a gás inflamável, Maquinaria, combustão interna, movida a gás inflamável ou Maquinaria,
  células de combustível, movida a gás inflamável.

  6.5.2. Para outros artigos perigosos (que não estejam afixados com a etiqueta de manuseio
  “somente em aeronave de carga”), não há exigência de acessibilidade.

  6.5.3. O item G2 da IS nº 175-001 estabelece os requisitos de acessibilidade completos sobre
  artigos perigosos em aeronave de carga.

  6.6. Kit de resposta a emergência

  6.6.1. Alguns operadores aéreos disponibilizam kits de resposta a emergência com artigos
  perigosos para o uso a bordo da aeronave e também provêm treinamento para os membros da
  tripulação de cabine sobre o uso do kit em incidentes com artigos perigosos. Tipicamente,
