text: '6. INFORMAÇÕES GERAIS

  6.1. Classificação de compartimentos de carga

  6.1.1. Os compartimentos de carga são classificados de acordo com requisitos de aeronavegabilidade
  descritos no RBAC nº 25 e no item 5.5 da IS nº 23-002. As informações sobre os compartimentos
  de carga apresentadas nesta IS são complementares a esses regulamentos, não os sobrepondo.

