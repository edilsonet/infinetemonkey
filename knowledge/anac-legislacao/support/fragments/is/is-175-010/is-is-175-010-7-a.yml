text: a) aqueles que são permitidos tanto em aeronave de passageiro quanto somente em aeronaves
  de carga (CAO) ou aqueles cuja quantidade não está sujeita a requisitos adicionais de carregamento
  aplicáveis a artigos perigosos permitidos somente em aeronave de carga. Dependendo das circunstâncias
