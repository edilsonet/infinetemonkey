text: 'b) aqueles que somente podem ser transportados por aeronave de carga e estão sujeitos
  a requisitos adicionais de carregamento descritos em G2.4.1 da IS nº 175-001. Esses artigos
  perigosos possuem requisitos para que estejam acessíveis, o que significa que devem ser
  carregados de forma que os membros da tripulação possam manuseá-los e, quando o tamanho
  e a massa permitirem, possam separar os volumes e as sobrembalagens de outras cargas. No
  evento de um incidente envolvendo esses artigos perigosos, uma avaliação deve ser feita
  sobre a praticidade de tentar uma intervenção física direta. Em qualquer evento, tanto para
  artigos perigosos acessíveis quanto para não acessíveis, os procedimentos padronizados de
  emergência em aeronave deveriam sempre ser seguidos.

  7.5.4. Uma tentativa deveria ser realizada para identificar a causa do incidente ocorrido
  no compartimento de carga principal. As seguintes ações podem ser consideradas:'
