title: CONSIDERAÇÕES GERAIS
text: '7. CONSIDERAÇÕES GERAIS

  7.1. Generalidades

  7.1.1. Os itens que se seguem são informações que precisam ser levadas em consideração na
  avaliação das ações a serem tomadas durante a ocorrência de um incidente envolvendo artigos
  perigosos. Essas considerações aplicam-se a qualquer aeronave envolvida que esteja transportando
  passageiros, cargas ou ambos.

  7.1.2. Deveria sempre se levar em consideração pousar o mais breve possível. Se a situação
  permitir, o serviço de tráfego aéreo relevante deveria ser informado sobre os artigos perigosos
  a bordo, como indicado no item G4 da IS nº 175-001.

  7.1.3. O procedimento adequado de remoção de fogo ou de fumaça aprovado para o tipo da aeronave
  deveria sempre ser realizado. Máscaras e reguladores de oxigênio dos membros da tripulação
  de voo devem estar ligados e selecionados na posição de 100% de oxigênio de forma a prevenir
  a inalação de fumaça ou de fumos (material sólido em suspensão no ar). Utilizar o procedimento
  de emergência adequado de remoção de fumaça possivelmente reduzirá a concentração da contaminação
  e ajudará a evitar a recirculação do ar contaminado. Sistemas de ar-condicionado deveriam
  ser operados na capacidade máxima e todo o ar deveria ser exalado da cabine (sem recirculação
  de ar) de forma a reduzir a concentração de qualquer contaminação no ar e evitar a recirculação
  de ar contaminado.

  7.1.4. Reduzir a altitude reduzirá a taxa de vaporização de líquido e também poderá diminuir
  a taxa de vazamento, mas, em contrapartida, poderá aumentar a taxa de queima. O oposto também
  é válido, ou seja, aumentar a altitude poderá reduzir a taxa de queima, mas poderá aumentar
  a taxa de vaporização ou de vazamento. Se houver risco de dano estrutural ou de explosão,
  deveria se considerar a manutenção da pressão diferencial mais baixa possível.

  7.1.5. A taxa de ventilação não deveria ser reduzida com a intenção de extinguir o fogo,
  pois isso terá uma efeito incapacitante nos passageiros sem afetar significativamente o
  fogo. Os passageiros provavelmente se sufocarão antes de o fogo ser extinto. As chances
  de sobrevivência dos passageiros são aumentadas ao se manter a ventilação máxima na cabine.

  7.1.6. Equipamento de respiração estanque a gás deveria sempre ser usado no atendimento
  de um incidente envolvendo fogo ou fumo. O uso de máscaras terapêuticas com garrafas de
  oxigênio portátil ou do sistema de oxigênio dos passageiros em uma cabine repleta de fumaça
  ou de fumo não deveria ser considerado, pois quantidades consideráveis de fumo ou de fumaça
  podem ser inalados por meio das válvulas ou dos orifícios das máscaras. Uma medida mais
  efetiva para os passageiros em ambiente repleto de fumaça ou de fumo seria usar uma toalha
  ou um pano molhado envolvendo a boca e o nariz. A toalha ou o pano molhado age como filtro
  e é mais efetivo que uma toalha ou um pano seco. A tripulação de cabine deveria tomar ações
  imediatas ao se detectar a presença de fumaça ou de fumo, deveria deslocar os passageiros
  para longe da área afetada e, se necessário, providenciar toalhas ou panos molhados, além
  de dar instruções aos passageiros para respirar através deles.

  7.1.7. Geralmente, a água não deveria ser utilizada em um derramamento ou quando fumos estiverem
  presentes, pois ela pode espalhar o material derramado ou deixá-lo mais fumegante. Deveria
  se considerar também se há possibilidade de presença de componentes elétricos quando usados
  extintores a base de água. Ver 7.1.11.

  7.1.8. Além dos equipamentos obrigatórios de emergência transportados na aeronave e do kit
  de resposta a emergência providenciado por alguns operadores aéreos, vários outros itens
  podem ser encontrados e utilizados. Esses itens incluem:'
