title: 7(d)
text: 'd) após identificar o artigo perigoso, verificar na própria NOTOC o código de resposta
  a emergências (drill code) do artigo perigoso ou, se não houver na NOTOC, consultar o Doc
  9481 da OACI e verificar na lista de artigos perigosos o código do item em particular; e

  Nota: o código de resposta a emergência também pode ser encontrado na Tabela C-1 da IS nº
  175-001, embora o uso operacional dessa lista seja menos recomendado, em razão do conjunto
  mais amplo de informações.'
