text: 'e) toalhas.

  7.1.9. As mãos deveriam sempre estar protegidas antes de tocar volumes ou garrafas suspeitos.
  Luvas resistentes ao fogo ou luvas de forno cobertas com bolsas de polietileno possivelmente
  darão proteção adequada.

  7.1.10. Deveria sempre se atentar ao limpar qualquer derramamento ou vazamento de forma
  a assegurar que não haverá qualquer reação entre o material que está sendo utilizado para
  limpar e o artigo perigoso. Se houver suspeita de reação, não se deveria tentar limpá-lo,
  mas o derramamento deveria ser coberto com bolsas de polietileno. Se as bolsas de polietileno
  não estiverem disponíveis, deveria se tomar cuidado para assegurar que não haverá qualquer
  reação entre o que estiver sendo utilizado para conter o produto e o próprio produto.

  7.1.11. No caso de derramamento em forma de pó de artigo perigoso conhecido ou material
  suspeito de ser artigo perigoso, tudo que foi afetado deveria ser mantido intocado. Esse
  tipo de derramamento não deveria ser coberto com agente extintor ou diluído com água. Os
  passageiros deveriam ser movidos para longe da área. Deveria se considerar desligar os ventiladores
  de circulação de ar. A área do derramamento deveria ser coberta utilizando bolsas de polietileno
  ou outras bolsas plásticas e cobertores. A área deveria ser mantida isolada. Após o pouso,
  apenas especialistas qualificados deveriam lidar com a situação.

  7.1.12. Se o fogo foi combatido com sucesso e é evidente que a embalagem interna permaneceu
  intacta, deveria se considerar utilizar água para resfriar o volume e, assim, evitar a possibilidade
  de reignição do fogo. Ver 7.1.7.

  7.1.13. O aviso de proibição de fumar deveria ser acionado quando fumos ou vapores estiverem
  presentes.

  7.1.14. Em qualquer incidente em que funcionário do serviço de salvamento e combate a incêndio
  entre na aeronave, seja quando o artigo perigoso for o causador do incidente ou quando ele
  apenas estiver sendo transportado não tendo envolvimento direto no incidente, deveria se
  desenvolver um procedimento de forma a assegurar que a NOTOC esteja imediatamente disponível
  para o serviço de salvamento e combate a incêndio. Esse procedimento pode determinar que
  um membro da tripulação de voo deixe a aeronave em caso de evacuação de emergência para
  entregar a NOTOC ao responsável pelo serviço de salvamento e combate a incêndio.

  7.1.15. Se o incidente envolver uma substância química que possa ser identificada (pelo
  nome apropriado para embarque, pelo número UN, ou por outra forma), é possível, em algumas
  circunstâncias, obter informações úteis de diversos bancos de dados químicos. Esses bancos
  de dados normalmente estão disponíveis por telefone 24 horas por dia.

  Exemplos de banco de dados:

  United States - CHEMTREC

  www.chemtrec.com

  Canada - CANUTEC

  www.tc.gc.ca/eng/canutec/menu.htm

  7.2. Artigos perigosos na cabine de passageiros

  7.2.1. Com exceção dos itens listados no Apêndice H da IS nº 175-001, artigos perigosos
  não são permitidos na cabine de passageiros. Entretanto, pode ocorrer de artigos perigosos
  serem levados por passageiros desavisados ou que deliberadamente ignoram os requisitos do
  RBAC nº 175 e da IS nº 175-001 relacionados aos passageiros e suas bagagens. Também é possível
  que um item que um passageiro leve em conformidade com o regulamento (por exemplo um item
  de uso médico) possa causar um incidente.

  Nota: ver 8.3 - Procedimentos da tripulação de cabine para incidentes com artigos perigosos
  durante o voo.

  7.3. Artigos perigosos em compartimentos de carga embaixo do piso

  7.3.1. Artigos perigosos podem ser transportados como carga no compartimento embaixo do
  piso. Derramamentos ou vazamentos são improváveis de serem detectados durante o voo a não
  ser que fumos sejam notados na cabine de passageiros ou na cabine de comando. No caso do
  vazamento, o ar na cabine de passageiros e na cabine de comando pode ter se tornado inflamável,
  irritante ou tóxico. Dispositivos eletrônicos não essenciais deveriam ser desligados e fumar
  deveria ser proibido. Além disso, os membros da tripulação devem utilizar máscaras que cubram
  o rosto todo (100% de oxigênio) ou máscaras antifumaça. Quando possível, os passageiros
  deveriam receber toalhas ou panos molhados para cobrir o nariz e a boca.

  7.3.2. Fumaça ou fogo no compartimento de carga embaixo do piso podem não ser originados
  por um artigo perigoso carregado nesse compartimento. Tais artigos perigosos, entretanto,
  podem ser afetados por qualquer incêndio. Procedimentos padronizados de emergência em aeronaves
  deveriam sempre ser seguidos para combater a fumaça ou o fogo.

  7.3.3. Em algumas aeronaves, existe um acesso pelo lado de dentro da aeronave para compartimentos
  de carga embaixo do piso. Geralmente, mesmo que o acesso seja possível, não se deveria entrar,
  pois isso permite a entrada de ar no compartimento, o que pode piorar a situação.

  7.3.4. Se um incidente surgiu no compartimento de carga embaixo do piso, os tripulantes
  e os passageiros deveriam ser evacuados da aeronave antes que se tente abrir as portas do
  compartimento de carga. A portas do compartimento de carga deveriam ser abertas somente
  com os serviços de emergência a postos.

  7.4. Artigos perigosos no compartimento principal de aeronaves “combi”

  7.4.1. Derramamentos ou vazamentos de artigos perigosos que gerem fumos podem ser detectados
  na cabine de passageiros ou na cabine de comando. Fumaça ou fogo detectados podem não ter
  sido originados por nenhum artigo perigoso carregado no compartimento de carga, mas esses
  artigos perigosos podem ser afetados por algum incêndio.

  7.4.2. O procedimento de emergência em aeronave recomendado para fumaça e para fogo deveria
  sempre ser obedecido. Entretanto, uma ação tomada para eliminar a fumaça não necessariamente
  pode ajudar a controlar o fogo.

  7.4.3. Apesar de ser possível entrar no compartimento de carga de dentro da aeronave, isso
  deveria ser feito com muita cautela de forma a não permitir que fumaça ou fumos entrem na
  cabine de passageiros ou na cabine de comando.

  7.4.4. Entretanto, se a decisão de entrar no compartimento de carga for tomada e a causa
  do incidente for descoberta como sendo artigo perigoso, deveria se consultar o Doc 9481
  da OACI, que contém uma lista de artigos perigosos e os respectivos códigos de resposta
  a emergências (drill code), assim como orientações para lidar com o incidente, que estão
  disponíveis nesta IS.

  7.4.5. Fumaça ou fumos podem entrar na cabine de passageiros ou na cabine de comando. Se
  isso ocorrer, os membros da tripulação deveriam considerar que a atmosfera da aeronave tem
  a possibilidade de estar contaminada com fumos irritantes, inflamáveis ou tóxicos e que
  a ação apropriada deveria ser tomada. Essa ação deveria incluir o uso pela tripulação de
  máscaras que cubram o rosto todo (100% de oxigênio) ou máscaras antifumaça, conforme apropriado.
  Assim que possível, os passageiros deveriam receber toalhas molhadas ou panos molhados com
  instruções para colocá-los sobre o nariz e a boca. Todos os dispositivos eletrônicos não
  essenciais deveriam ser desligados e fumar deveria ser proibido. Procedimentos de evacuação
  de fumaça deveriam ser feitos assim que possível, de forma a ventilar a cabine ao máximo
  possível.

  7.4.6. Se um incidente surgiu no compartimento de carga principal, os membros da tripulação
  e os passageiros deveriam ser evacuados da aeronave antes que se tente abrir as portas do
  compartimento de carga. A portas do compartimento de carga deveriam ser abertas somente
  com os serviços de emergência a postos.

  7.5. Artigos perigosos em aeronave de carga

  7.5.1. Artigos perigosos podem ser carregados em aeronave de carga tanto no compartimento
  de carga embaixo do piso quanto no compartimento de carga principal.

  7.5.2. Incidentes no compartimento de carga embaixo do piso. Ver 7.3.

  7.5.3. Incidentes no compartimento de carga principal. Artigos perigosos transportados no
  compartimento de carga principal se enquadram em duas grandes categorias:'
