title: EXEMPLOS DE PROCEDIMENTOS PARA INCIDENTES COM ARTIGOS PERIGOSOS
text: '8. EXEMPLOS DE PROCEDIMENTOS PARA INCIDENTES COM ARTIGOS PERIGOSOS

  8.1. Procedimentos para incidentes com artigos perigosos

  Passo

  Ação

  1.

  Seguir os procedimentos adequados de emergência em aeronave para combate ao fogo ou para
  remoção de fumaça

  2.

  Aviso de não fumar aceso

  3.

  Considerar o pouso assim que possível

  4.

  Considerar a necessidade de desligar as fontes de energia não essenciais

  5.

  Determinar a origem da fumaça, dos fumos ou do fogo

  6.

  Para incidentes envolvendo artigos perigosos dentro da cabine de passageiros, consultar
  os procedimentos de responsabilidade dos membros da tripulação de cabine e coordenar as
  ações tomadas pelos membros da tripulação de voo e de cabine

  7.

  Determinar o código de resposta a emergências (drill code)

  8.

  Utilizar o guia de resposta a emergência em aeronaves com base na tabela de código de resposta
  a emergências (drill code) para ajudar a lidar com o incidente

  9.

  Se a situação permitir, notificar o controle de tráfego aéreo sobre os artigos perigosos
  que estão sendo transportados

  Após o pouso

  1.

  Desembarcar todos os passageiros e os membros da tripulação antes da abertura de qualquer
  porta do compartimento de carga

  2.

  Informar ao pessoal de solo ou aos serviços de emergência as características do artigo perigoso
  e sua localização

  3.

  Fazer o reporte apropriado no registro de manutenção

  8.2. Procedimentos amplificados para incidentes com artigos perigosos

  Passo

  Ação

  1.

  Seguir os procedimentos adequados de emergência em aeronave para combate ao fogo ou para
  remoção de fumaça (autoexplicativo)

  2.

  Aviso de não fumar aceso

  O aviso de proibição de fumar deveria ser acionado quando fumos ou vapores estiverem presentes
  e deveria continuar acionado por todo o restante do voo.

  3.

  Considerar o pouso assim que possível

  Por causa das dificuldades e das consequências possivelmente desastrosas de um incidente
  com artigos perigosos, deveria se considerar o pouso o quanto antes. A decisão de pousar
  no aeródromo adequado mais próximo deveria ser tomada antes que seja tarde demais, momento
  em que um incidente pode ter evoluído para um estágio crítico, restringindo severamente
  a flexibilidade operacional.

  4.

  Considerar a necessidade de desligar as fontes de energia não essenciais

  Desligar todos os equipamentos elétricos não essenciais ao voo, como sistema de entretenimento,
  tomadas e galleys tendo em vista que o incidente pode ter sido causado por problemas elétrico,
  que os sistemas elétricos podem ter sido afetados pelo incidente ou mesmo outras situações
  como o próprio combate ao fogo, que pode danificar os sistemas elétricos. Manter a fonte
  de energia somente para os instrumentos, os sistemas e os controles necessários para a segurança
  contínua da aeronave. Não religar a fonte de energia enquanto não for nitidamente seguro.

  5.

  Determinar a origem da fumaça, dos fumos ou do fogo

  A origem da fumaça, dos fumos ou do fogo pode ser difícil de determinar. Procedimentos efetivos
  de combate ao fogo ou de contenção podem ser melhor realizados quando a origem do incidente
  é identificada.

  6.

  Para incidentes envolvendo artigos perigosos dentro da cabine de passageiros, consultar
  os procedimentos de responsabilidade dos membros da tripulação de cabine e coordenar as
  ações tomadas pelos membros da tripulação de voo e de cabine

  Incidentes na cabine de passageiros deveriam ser resolvidos pelos membros da tripulação
  de cabine com o auxílio dos procedimentos apropriados. É indispensável que os membros da
  tripulação de cabine e de voo coordenem suas ações e que cada um se mantenha plenamente
  informado das ações e das intenções dos demais.

  7.

  Determinar o código de resposta a emergências (drill code)

  Quando o artigo perigoso estiver identificado, a entrada correspondente na NOTOC deveria
  ser encontrada. O código de resposta a emergências aplicável é encontrado na NOTOC e pode
  ser encontrado também na lista de artigos perigosos. Se o artigo perigoso que causou o incidente
  não estiver descrito na NOTOC, deveria se tentar determinar o nome ou a natureza da substância.
  Nesse caso, a lista de artigo perigoso poderá ser usada para determinar o código de resposta
  a emergências.

  Nota: a lista de artigos perigosos e dos códigos de resposta a emergências (drill codes)
  associados, organizada por ordem numérica e alfabética dos artigos perigosos, está disponível
  no Doc 9481 da OACI. A informação também pode ser encontrada na Tabela C-1 da IS nº 175-001
  - embora seu uso operacional seja menos recomendado, em razão do conjunto mais amplo de
  informações nessa lista.

  8.

  Utilizar o guia de resposta a emergência em aeronaves com base na tabela de códigos de resposta
  a emergências (drill code) para ajudar a lidar com o incidente

  O código de resposta a emergências (drill code) designado para um artigo perigoso consiste
  em um número de 1 a 12 e uma ou duas letras. Na tabela de códigos de resposta a emergências
  (drill code), cada número do código de resposta a emergências (drill code) corresponde a
  uma linha com informações sobre os perigos apresentados por essa substância e orientações
  sobre a ação mais recomendada a ser tomada. A letra do código de resposta a emergências
  (drill code) é mostrada separadamente na tabela; ela indica outros possíveis perigos da
  substância. Em alguns casos, a orientação dada pelo número do código de resposta a emergências
  (drill code) pode ser aperfeiçoada pela informação dada pela(s) letra(s) do código de resposta
  a emergências (drill code).

  9.

  Se a situação permitir, notificar o controle de tráfego aéreo sobre os artigos perigosos
  que estão sendo transportados

  Se uma emergência em voo ocorrer e a situação permitir, o piloto em comando deveria informar
  ao controle de tráfego aéreo apropriado sobre os artigos perigosos a bordo da aeronave.
  Sempre que possível, essa informação deveria incluir:

  - o nome apropriado para embarque ou o número UN;

  - a classe ou a divisão de perigo (e, para a Classe 1, o grupo de compatibilidade);

  - o perigo secundário, se houver;

  - a quantidade; e

  - a localização a bordo da aeronave.

  Quando não for possível incluir todos esses itens, as informações julgadas mais relevantes
  deveriam ser comunicadas.

  Após o pouso

  1.

  Desembarcar todos os passageiros e os membros da tripulação antes da abertura de qualquer
  porta do compartimento de carga

  Mesmo que não seja necessário fazer a evacuação completa após o pouso, passageiros e membros
  da tripulação deveriam desembarcar antes de se abrir o compartimento de carga e antes de
  se tomar qualquer outra ação para lidar com um incidente envolvendo artigo perigoso. As
  portas dos compartimentos de carga deveriam ser abertas com o serviço de emergência presente.

  2.

  Informar ao pessoal de solo ou aos serviços de emergência as características do artigo perigoso
  e sua localização

  Após a chegada, tomar as medidas necessárias para identificar ao pessoal de solo onde os
  artigos perigosos então localizados. Passar pelo meio mais rápido possível todas as informações
  sobre o artigo perigoso, incluindo, quando for o caso, uma cópia da NOTOC.

  3.

  Fazer o reporte apropriado no registro de manutenção

  Um reporte deveria ser feito no registro de manutenção para que seja verificado se algum
  vazamento ou derramamento não danificou a estrutura da aeronave ou seus sistemas e se algum
  equipamento da aeronave precisa ser reabastecido ou substituído (tais como extintores de
  incêndio, kit de resposta a emergência etc.).

