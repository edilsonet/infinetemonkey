id: is-is-175-010-8-c
kind: is
document: is-175-010
family: '175'
section_id: '8'
section_title: EXEMPLOS DE PROCEDIMENTOS PARA INCIDENTES COM ARTIGOS PERIGOSOS
subsection_id: c
cite: 8(c)
title: 8(c)
text: 'c) Não use gelo ou gelo seco para resfriar o dispositivo. Gelo ou outros materiais
  podem isolar o dispositivo, aumentando a possibilidade das outras células entrarem em disrupção
  térmica (thermal runaway).

  6.

  Quando o dispositivo esfriar (por exemplo: aproximadamente 10 a 15 minutos)

  O dispositivo pode ser movido com cautela após um determinado período de tempo, uma vez
  que tenha sido resfriado e desde que não haja indícios de fumaça ou calor, ou desde que
  haja redução no ruído de crepitação ou som sibilante geralmente associado a incêndio de
  bateria de lítio (por exemplo, após aproximadamente 10 a 15 minutos). O tempo de espera
  pode variar dependendo do tipo de dispositivo e do seu tamanho. As diferentes circunstâncias
  (tais como: tipos de dispositivos, fases do voo etc.) deveriam ser abordadas no programa
  de treinamento do operador aéreo.

  Um recipiente vazio adequado, como por exemplo um vaso, jarra, itens de cozinha ou lixeira,
  deve ser preenchido com uma quantidade suficiente de água ou de outro líquido não inflamável
  para submergir completamente o dispositivo. É importante utilizar os equipamentos de proteção
  disponíveis (tais como: equipamento protetor de respiração, luvas resistentes ao fogo) ao
  movimentar qualquer dispositivo envolvido no incêndio. Assim que o dispositivo estiver completamente
  submerso, o recipiente utilizado deve ser colocado em local adequado e, se possível, protegido
  para evitar derramamento.

  7.

  Monitorar o dispositivo e a área ao redor durante o restante do voo

  Monitore o dispositivo e a área ao redor durante o restante do voo de forma a garantir que
  o dispositivo não apresente perigo adicional.

  8.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.

  8.4.3. Fogo ou fumaça relacionado com bateria ou com dispositivo eletrônico portátil no
  compartimento superior

  PROCEDIMENTOS PARA FOGO OU FUMAÇA RELACIONADO COM BATERIA OU COM DISPOSITIVO ELETRÔNICO
  PORTÁTIL NO COMPARTIMENTO SUPERIOR - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Aplicar procedimento de combate ao fogo

  Qualquer ocorrência envolvendo fogo na cabine deveria ser imediatamente comunicada ao piloto
  em comando, que deveria ser mantido informado de todas as ações tomadas e de seus resultados.
  É essencial que os membros das tripulações de cabine e de voo coordenem suas ações e que
  estejam totalmente informados das respectivas ações e intenções.

  Procedimentos apropriados de combate a incêndio e de emergência devem ser utilizados para
  lidar com qualquer fogo. Em uma operação com mais de um membro da tripulação de cabine,
  as ações detalhadas no procedimento de combate ao fogo deveriam ser executadas simultaneamente.
  Em aeronaves com apenas um membro de tripulação de cabine, deveria se buscar ajuda de um
  passageiro para lidar com a situação.

  Halon, substituto de halon ou extintor de água deveriam ser utilizados para extinguir o
  fogo e prevenir que se espalhe para outros materiais inflamáveis. É importante que se use
  equipamento de proteção disponível (tais como: equipamento protetor de respiração, luvas
  resistentes ao fogo) no combate ao fogo.

  Se o incêndio se espalhar, os membros da tripulação de cabine deveriam tomar ações imediatas
  para deslocar os passageiros para locais distantes da área afetada e, se necessário, providenciar
  toalhas ou panos molhados e instruí-los a respirar através deles.

  Minimizar a propagação da fumaça e do fumo dentro da cabine de comando é fundamental para
  a continuidade da operação com segurança da aeronave; por isso é essencial manter a porta
  da cabine de comando fechada durante todo o tempo. A comunicação e a coordenação entre os
  membros da tripulação são de extrema importância. O interfone é o meio primário de comunicação,
  exceto se o sistema deixar de funcionar.

  2.

  Identificar o objeto

  Pode ser que não seja possível identificar o objeto imediatamente, especialmente se o fogo
  tiver se iniciado no compartimento superior e se o dispositivo não estiver prontamente acessível.

  Se o dispositivo estiver visível e acessível ou se ele estiver na bagagem e suas chamas
  estiverem visíveis, os procedimentos de combate ao fogo deveriam ser aplicados primeiramente.

  Se a fumaça vier do compartimento superior, mas o dispositivo não estiver visível ou acessível,
  ou se não houver indicação de fogo, os procedimentos de combate ao fogo deveriam ser aplicados
  primeiramente.

  Em seguida, todas as bagagens deveriam ser removidas do compartimento superior com cautela
  até que seja possível identificar o objeto. Assim que o objeto for identificado, proceder
  com os passos 3 a 5.

  Atenção:

  Para evitar danos por incêndio repentino, não é recomendado abrir a bagagem afetada quando
  houver qualquer indicação de fumaça ou de chamas. Entretanto, em certas situações os membros
  da tripulação de cabine podem avaliar o caso e julgar necessário realizar uma pequena abertura
  da bagagem de forma a permitir a entrada do agente extintor e do líquido não inflamável.
  Essa ação deveria ser realizada de maneira extremamente cautelosa e apenas após se terem
  colocado os equipamentos de proteção apropriados disponíveis na aeronave.

  3.

  Resfriar o dispositivo (bagagem) com água (ou outro líquido não inflamável)

  Deve-se utilizar água (ou outro líquido não inflamável) para resfriar a bateria que tenha
  sido incendiada de forma a evitar que o calor se propague a outras células da bateria. Se
  água não estiver disponível, pode-se utilizar qualquer outro líquido não inflamável para
  resfriar o dispositivo.

  Nota. - O líquido pode evaporar ao ser aplicado sobre uma bateria quente.

  4.

  Quando o dispositivo esfriar

  O dispositivo deveria ser retirado do compartimento de bagagem superior para evitar a possibilidade
  de que se desenvolva fogo de maneira não evidente. O dispositivo pode ser movido com cautela
  após um determinado período de tempo, uma vez que tenha sido resfriado e desde que não haja
  indícios de fumaça ou calor, ou desde que haja uma redução no ruído de crepitação ou som
  sibilante geralmente associado a incêndio de bateria de lítio. O tempo de espera pode variar
  dependendo do tipo de dispositivo e do seu tamanho. Distintas circunstâncias (tais como:
  tipos de dispositivos, fases do voo, etc.) deveriam ser abordadas no programa de treinamento
  do operador aéreo.

  Um recipiente vazio adequado, como por exemplo um vaso, jarra, itens de cozinha ou lixeira,
  deve ser preenchido com uma quantidade suficiente de água ou de outro líquido não inflamável
  para submergir completamente o dispositivo. É importante utilizar os equipamentos de proteção
  disponível (tais como: equipamento protetor de respiração, luvas resistentes ao fogo) ao
  movimentar qualquer dispositivo envolvido no incêndio. Assim que o dispositivo estiver completamente
  submerso, o recipiente utilizado deve ser colocado em um local adequado e, se possível,
  protegido para evitar derramamento.

  5.

  Monitorar o dispositivo e a área ao redor durante o restante do voo

  Monitore o dispositivo e a área ao redor durante o restante do voo de forma a garantir que
  o dispositivo não apresente perigo adicional.

  6.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.

  8.4.4. Bateria superaquecida ou cheiro de queimado de origem elétrica relacionado com dispositivo
  eletrônico portátil- fogo ou fumaça não visíveis

  PROCEDIMENTOS PARA BATERIA SUPERAQUECIDA OU CHEIRO DE QUEIMADO DE ORIGEM ELÉTRICA RELACIONADO
  COM DISPOSITIVO ELETRÔNICO PORTÁTIL - FOGO OU FUMAÇA NÃO VISÍVEIS - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Identificar o objeto

  Identifique a origem do superaquecimento ou cheiro de queimado de origem elétrica. Solicite
  ao passageiro que identifique o objeto.

  2.

  Instruir o passageiro a desligar o dispositivo imediatamente

  É importante instruir o passageiro a desligar o dispositivo imediatamente.

  3.

  Remover a fonte de energia

  É importante instruir o passageiro ou membro da tripulação a desconectar o dispositivo da
  fonte de energia, se for considerado seguro. A bateria tem uma maior probabilidade de pegar
  fogo devido ao superaquecimento durante ou imediatamente após o ciclo de carregamento, embora
  os efeitos possam acontecer após um certo período de tempo. Ao remover a fonte externa de
  energia do dispositivo, assegura-se que a bateria não será alimentada por energia adicional
  que pode incentivar a geração de fogo.

  Desligue a fonte de energia dos assentos restantes até que se possa assegurar que o mau
  funcionamento dos sistemas da aeronave não contribua para falhas adicionais aos dispositivos
  eletrônicos portáteis dos passageiros.

  Verifique visualmente se a energia dos circuitos elétricos restantes permanece desligada
  até que se possa determinar se o sistema da aeronave está livre de falhas, caso o dispositivo
  tenha sido conectado anteriormente.

  A remoção da energia pode ocorrer simultaneamente a outras ações dos membros da tripulação
  de cabine (por exemplo, obter água para resfriar o dispositivo). Dependendo do tipo de aeronave,
  a fonte de energia dos assentos deve ser desligada pelos membros da tripulação de cabine.

  É importante verificar que o dispositivo se mantenha desconectado durante o período restante
  do voo.

  Atenção:

  Não tente remover a bateria do dispositivo.

  4.

  Instruir o passageiro a manter o dispositivo visível e monitorar atentamente

  O dispositivo deve permanecer visível (não armazenado na bagagem, no bolsão do assento ou
  junto à pessoa (bolso)) e deveria ser monitorado atentamente. Baterias instáveis podem incendiar-se
  mesmo após o equipamento ter sido desligado. Verifique se o dispositivo está armazenado
  adequadamente para o pouso.

  5.

  Se fumaça ou chamas aparecerem

  Se fumaça ou chamas aparecerem, utilize os procedimentos para fogo ou fumaça relacionado
  com bateria ou com dispositivo eletrônico portátil - amplificados (ver 8.4.2).

  6.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.

  8.4.5. Dispositivo eletrônico portátil inadvertidamente esmagado ou danificado em assento
  ajustado eletricamente

  Devido ao design de alguns assentos ajustados eletricamente, o dispositivo eletrônico portátil
  pode escorregar para baixo do assento e/ou almofada, atrás do descanso de braço ou embaixo
  da lateral do assento. Um esmagamento inadvertido do dispositivo representa um perigo de
  incêndio.

  PROCEDIMENTOS PARA DISPOSITIVO ELETRÔNICO PORTÁTIL INADVERTIDAMENTE ESMAGADO OU DANIFICADO
  EM ASSENTO AJUSTADO ELETRICAMENTE - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Notificar o piloto em comando/outros membros da tripulação de cabine

  Qualquer ocorrência referente a um perigo de incêndio na cabine deveria ser notificada imediatamente
  para o piloto em comando, que deveria ser informado de todas as ações tomadas e de seus
  resultados. É essencial que os membros das tripulações de cabine e de voo coordenem as suas
  ações e se mantenham totalmente informados das respectivas ações e intenções.

  2.

  Obter informações do passageiro

  Peça ao passageiro para identificar o objeto e pergunte onde ele suspeita que este possa
  ter caído ou escorregado e se ele moveu o assento desde o desaparecimento do objeto.

  3.

  Recuperar e utilizar equipamentos de proteção, se estiverem disponíveis

  Se disponíveis, a tripulação de cabine deveria utilizar luvas resistentes ao fogo antes
  de tentar recuperar o objeto.

  4.

  Recuperar o objeto

  Para evitar o esmagamento de dispositivos eletrônicos portáteis e reduzir o perigo potencial
  de incêndio do dispositivo e da área ao redor, membros da tripulação de cabine e/ou passageiros
  não podem usar as funções elétricas ou mecânicas dos assentos na tentativa de recuperar
  o objeto. Mova o passageiro e, se for o caso, o passageiro sentado ao lado do assento afetado
  para outra área, a fim de facilitar a procura. Não mova o assento. Se o membro da tripulação
  de cabine não conseguir recuperar o objeto, pode ser necessário mover o passageiro para
  outro assento.

  5.

  Se fumaça ou chamas aparecerem

  Se fumaça ou chamas aparecerem, utilize os procedimentos para fogo ou fumaça relacionado
  com bateria ou com dispositivo eletrônico portátil - amplificados (ver 8.4.2).

  6.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.

  8.4.6. Fogo Envolvendo Artigos Perigosos

  PROCEDIMENTOS PARA INCIDENTES COM FOGO ENVOLVENDO ARTIGOS PERIGOSOS - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Identificar o objeto

  Peça ao passageiro envolvido que identifique o objeto. O passageiro poderá dar alguma informação
  sobre o perigo ou os perigos que possam ocorrer e a forma de combatê-los. Se o passageiro
  puder identificar o objeto, deve-se informar ao piloto em comando e seguir suas instruções.

  Pode ser que não seja possível identificar o objeto imediatamente, especialmente se a origem
  do fogo é desconhecida ou se o objeto não está prontamente acessível. Nesse caso, os procedimentos
  de combate ao fogo deveriam ser aplicados primeiramente. Quando for possível, deve-se identificar
  o objeto após controlar o fogo. Se o objeto estiver dentro de uma bagagem, as ações tomadas
  pelos membros da tripulação devem ser similares às de quando o objeto está visível ou prontamente
  acessível.

  Atenção:

  Para evitar danos por incêndio repentino, não é recomendado abrir a bagagem afetada quando
  houver qualquer indicação de fumaça ou chamas. Entretanto, em certas situações os membros
  da tripulação de cabine podem avaliar o caso e julgar necessário realizar uma pequena abertura
  da bagagem de forma a permitir a entrada do agente extintor e do líquido não inflamável.
  Essa ação deveria ser realizada de maneira extremamente cautelosa e apenas após se terem
  colocado os equipamentos de proteção apropriados, disponíveis na aeronave.

  2.

  Aplicar o procedimento de combate ao fogo

  Qualquer ocorrência relacionada com fogo na cabine deveria ser notificada imediatamente
  ao piloto em comando, que deveria ser informado de todas as ações tomadas e de seus resultados.
  É essencial que os membros das tripulações de cabine e de voo coordenem suas ações e se
  mantenham totalmente informados das respectivas ações e intenções.

  Procedimentos apropriados de combate ao fogo e de emergência devem ser utilizados para lidar
  com qualquer fogo. Em uma operação com mais de um membro da tripulação de cabine, as ações
  detalhadas no procedimento de combate ao fogo deveriam ser executadas simultaneamente. Em
  aeronaves com apenas um membro de tripulação de cabine de apenas um membro, deveria se buscar
  ajuda de um passageiro para lidar com a situação.

  Geralmente, a água não deveria ser utilizada em um derramamento ou quando fumos estiverem
  presentes, pois ela pode espalhar o material derramado ou deixá-lo mais fumegante. Deveria
  se considerar também se há possibilidade de presença de componentes elétricos quando usados
  extintores a base de água.

  Em caso de fogo, os membros da tripulação de cabine deveriam tomar ações imediatas para
  deslocar os passageiros para locais distantes da área afetada e, se necessário, providenciar
  toalhas ou panos molhados, e instruí-los a respirar através deles.

  Minimizar a propagação de fumaça e do fumo dentro da cabine de comando é fundamental para
  a continuidade da operação com segurança da aeronave; por isso, é essencial manter a porta
  da cabine de comando fechada durante todo o tempo. A comunicação e a coordenação entre os
  membros da tripulação são de extrema importância. O interfone é o meio primário de comunicação,
  exceto se o sistema deixar de funcionar.

  3.

  Monitorar uma possível reignição

  Verifique regularmente a área para conferir se ainda há perigo de fogo. Se houver fumaça
  ou indicação de fogo, continue aplicando o procedimento de combate ao fogo.

  4.

  Quando o fogo estiver extinto

  Em caso de fogo relacionado com artigos perigosos, pode ser necessário aplicar os procedimentos
  para derramamento ou vazamento de artigos perigosos - amplificados (ver 8.4.7) uma vez que
  o fogo esteja extinto.

  5.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.

  8.4.7. Derramamento ou Vazamento de Artigos Perigosos

  PROCEDIMENTOS PARA DERRAMAMENTO OU VAZAMENTO DE ARTIGOS PERIGOSOS - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Notificar o piloto em comando e outros membros da tripulação de cabine

  Qualquer ocorrência relacionada com fogo na cabine deveria ser notificada imediatamente
  ao piloto em comando, que deveria ser informado de todas as ações tomadas e de seus resultados.
  É essencial que os membros das tripulações de cabine e de voo coordenem suas ações e se
  mantenham totalmente informados das respectivas ações e intenções.

  Minimizar a propagação de fumaça e do fumo dentro da cabine de comando é fundamental para
  a continuidade da operação com segurança da aeronave; por isso, é essencial manter a porta
  da cabine de comando fechada durante todo o tempo. A comunicação e a coordenação entre os
  membros da tripulação são de extrema importância. O interfone é o meio primário de comunicação,
  exceto se o sistema deixar de funcionar.

  2.

  Identificar o objeto

  Peça ao passageiro envolvido que identifique o objeto. O passageiro poderá dar alguma informação
  sobre o perigo ou os perigos que possam ocorrer e a forma de combatê-los. Se o passageiro
  puder identificar o objeto, deve-se informar ao piloto em comando e seguir suas instruções.

  Em aeronaves com apenas um membro de tripulação de cabine, consulte o piloto em comando
  se a ajuda do passageiro deveria ser considerada para lidar com o incidente.

  3.

  Pegar o kit de resposta a emergência ou outros itens que possam ser úteis

  Para combater o derramamento ou vazamento, pegue o kit de resposta de emergência, se disponível,
  ou os itens a seguir:

  - Toalhas de papel ou jornais ou outro papel ou tela absorvente (tais como: cobertores,
  cabeçotes de assentos);

  - Luvas de cozinha ou luvas resistentes ao fogo, se houver;

  - Ao menos dois sacos de lixo grandes de polietileno; e

  - Ao menos três sacos de polietileno menores, como as que se usam para vendas de duty free
  ou, se não estiverem disponíveis, sacos de enjoo.

  4.

  Colocar luvas de borracha e máscara antifumaça

  As mãos deveriam sempre estar protegidas ao tocar em elementos suspeitos. As luvas resistentes
  ao fogo ou luvas de cozinha cobertas com sacos de polietileno possivelmente proporcionarão
  a proteção adequada.

  Ao responder a um incidente com fumaça, fumos ou fogo, sempre se deveria estar munido de
  equipamento hermético aos gases.

  5.

  Deslocar os passageiros para longe da área e distribuir toalhas ou panos molhados

  Não se deveriam utilizar as garrafas de oxigênio terapêutico nem o gerador químico de oxigênio
  aos passageiros para auxiliar os passageiros em uma cabine cheia de fumaça e fumos, pois
  os passageiros inalariam um volume considerável de fumos e de fumaça através das válvulas
  ou orifícios das máscaras. Uma ajuda mais efetiva aos passageiros em um ambiente cheio de
  fumaça ou fumo seria o uso de toalha ou pano molhados em volta da boca e do nariz. A toalha
  ou pano molhados ajudam a filtrar o ar com mais eficácia do que se estivessem secos. A tripulação
  de cabine deve tomar medidas imediatas e coordenadas se a fumaça ou o fumo aumentarem, e
  deslocar os passageiros para longe da área afetada e, se possível, deveria se providenciar
  panos ou toalhas molhados aos passageiros, pedindo que eles respirem através desses materiais.

  6.

  Colocar os artigos perigosos em sacos de polietileno.

  Nota: caso haja derramamento em estado de pó, de artigos que sejam ou possam ser perigosos:

  - Não toque em nada;

  - Não use agentes de extinção de incêndio ou água;

  - Cubra a área com saco de polietileno ou outros sacos plásticos e cobertores; e

  - Mantenha a área isolada até a aterrissagem.

  Se houver kit de resposta a emergência

  Se houver certeza absoluta de que o artigo não causará problemas, a melhor decisão pode
  ser não movê-lo. Entretanto, na maior parte dos casos, é melhor mover o artigo procedendo
  conforme a seguir. Coloque o artigo em um saco de polietileno da seguinte forma:

  - Prepare dois sacos, abra-os enrolando suas bordas para fora e colocando-os sobre o piso;

  - Coloque o objeto dentro do primeiro saco, deixando para cima a tampa do objeto ou o lugar
  por onde esteja vazando;

  - Remova as luvas, evitando o contato da pele com qualquer contaminante que possa existir
  nelas;

  - Coloque as luvas no segundo saco;

  - Feche o primeiro saco, removendo o excesso de ar de dentro;

  - Reforce a parte aberta do primeiro saco e feche com a fita adequada, ajustando-a de maneira
  segura, porém não excessiva, a fim de equilibrar a pressão;

  - Coloque o primeiro saco (que contém o objeto) no segundo saco, onde estão depositadas
  as luvas, e feche da mesma forma que o primeiro saco.

  Se não houver kit de resposta a emergência

  Recolha o objeto e coloque-o em um saco de polietileno. Assegure-se de que o recipiente
  com o objeto se mantenha na posição vertical ou que o orifício pelo qual ocorra o vazamento
  esteja na parte superior. Remova a umidade superficial da substância derramada utilizando
  toalhas de papel, jornais etc., depois de assegurar-se de que não haverá reação alguma entre
  os objetos utilizados para remover a umidade e o artigo perigoso. Coloque as toalhas sujas
  etc. em outro saco de polietileno. Coloque as luvas e sacos utilizados para proteger as
  mãos em outro saco de polietileno pequeno ou junto às toalhas sujas. Se não houver sacos
  adicionais, coloque as toalhas e luvas no mesmo saco que o objeto. Remova o excesso de ar
  dos sacos e feche-os adequadamente de maneira segura, porém não excessiva, a fim de equilibrar
  a pressão.

  7.

  Armazenar os sacos de polietileno em um local adequado

  Se houver recipiente ou caixa a bordo, esvazie seu conteúdo e coloque-o no piso, com a abertura
  para cima. Ponha o(s) saco(s) que contenha(m) o objeto e as toalhas etc. na caixa e feche
  a tampa. Leve a caixa, ou se não houver caixa, o(s) saco(s), ao ponto mais distante da cabine
  de comando e passageiros. Se a galley ou algum lavatório estiver livre, leve a caixa ou
  saco(s) a este local, se não for próximo à cabine de comando. Se possível, utilize a galley
  ou lavatório da parte posterior, sem colocar a caixa ou saco próximo à válvula de pressão
  nem contra a parede da fuselagem. Caso a galley seja utilizada, a caixa ou saco pode ser
  colocado em uma lixeira vazia. No caso de um lavatório, a caixa pode ser colocada no piso
  ou o(s) saco(s) em uma lixeira vazia. A porta do lavatório deveria ser mantida fechada por
  fora. Em uma aeronave pressurizada, caso um lavatório seja utilizado, não pode haver pressão
  positiva no lavatório para evitar a entrada de fumos na cabine de passageiros.

  Ao movimentar a caixa, assegure-se de manter sua tampa para cima. Quando movimentar um saco,
  assegure-se de que o recipiente que contém os artigos perigosos se mantenha na posição vertical
  ou que o orifício pelo qual ocorra o vazamento esteja na parte superior.

  Seja qual for o local onde a caixa ou saco(s) foi(ram) colocado(s), apoie-o(s) firmemente
  no local para evitar que se movimente(m) e mantenha o objeto na posição vertical. Assegure-se
  de que o desembarque da aeronave não será obstruído pela posição onde a caixa ou saco(s)
  foi(ram) colocado(s).

  8.

  Tratar os assentos e os cobertores afetados da mesma maneira que o artigo perigoso

  Os assentos, encostos de assentos e outras partes que tenham sido atingidas por uma substância
  derramada deveriam ser retirados de seus lugares e colocados em um saco grande para resíduos
  ou outro saco grande de polietileno, junto aos sacos utilizados inicialmente para cobri-los.
  Deveriam ser armazenados da mesma forma que o artigo perigoso que provocou o incidente.

  9.

  Cobrir a substância derramada no carpete ou no piso

  Cubra todo o derramamento sobre carpete ou outras partes com um saco para resíduos ou com
  outro saco de polietileno, se disponível. Caso contrário, use sacos de enjoo cortados e
  abertos para cobrir o derramamento pelo lado plastificado, ou utilize cartões de segurança
  plastificados.

  O carpete contaminado por uma substância derramada, que siga fumegando apesar de ter sido
  coberto, deveria ser enrolado, se possível, e colocado em um saco grande para resíduos ou
  outro saco de polietileno. Este saco deveria ser colocado em um depósito de resíduos e,
  se possível, levado a um lavatório ou galley posterior. Se o carpete não pode ser retirado,
  deveria se mantê-lo coberto com um saco grande para resíduos ou com sacos de polietileno,
  e deveriam se usar mais sacos para atenuar os fumos.

  10.

  Inspecionar periodicamente os objetos armazenados e os elementos contaminados

  Os artigos perigosos, as partes ou equipamentos contaminados que tenham sido retirados de
  seus lugares e colocados em um lugar adequado ou coberto como medida de segurança, deveriam
  ser submetidos a inspeções periódicas.

  11.

  Após o pouso no próximo destino

  Após a chegada, aplique os procedimentos pós incidente específicos do operador aéreo. Esses
  podem incluir informar à equipe de solo onde o objeto está armazenado e fornecer todas as
  informações sobre o objeto.

  Conforme os procedimentos do operador aéreo, complete a documentação requerida, de modo
  que o operador aéreo seja notificado da ocorrência, sejam tomadas as ações de manutenção
  apropriadas e se reabasteça ou substitua o kit de resposta a emergência ou qualquer outro
  equipamento da aeronave utilizado, conforme aplicável.


  9. TABELA DE CÓDIGOS DE RESPOSTA A EMERGÊNCIAS (DRILL CODE) E LISTA DE ARTIGOS PERIGOSOS
  COM CÓDIGOS DE REFERÊNCIA

  9.1. Código de resposta a emergências

  9.1.1. Os códigos de emergência da aeronave, como mostrados na Tabela 9-1, são orientações
  para os membros da tripulação quando um incidente ocorrer em voo que seja, ou possa ser,
  relacionado a um volume em particular ou volumes contendo artigos perigosos.

  9.1.2. Quando tal volume for identificado, o registro correspondente na Notificação ao Piloto
  em Comando (NOTOC) deveria ser encontrado. O código de resposta a emergências (drill code)
  aplicável poderá constar na Notificação ao Piloto em Comando (NOTOC) ou, se não constar,
  pode ser encontrado pelo nome apropriado para embarque ou pelo número UN, constantes na
  NOTOC, e pelo uso da lista alfabética ou numérica de artigos perigosos dada nas Tabelas
  4-2 e 4-3 do Doc 9481 da OACI, respectivamente.

  Nota: o código de resposta a emergência também pode ser encontrado na Tabela C-1 da IS nº
  175-001, embora o uso operacional dessa lista seja menos recomendado, em razão do conjunto
  mais amplo de informações.

  9.1.3. O código de resposta a emergências (drill code) designado a um artigo perigoso consiste
  em um número de 1 a 12 e uma ou duas letras. Na tabela de códigos de emergência, cada número
  do código de resposta a emergências (drill code) corresponde a uma linha com informações
  sobre o perigo apresentado pela substância e orientações sobre a ação mais recomendada a
  ser tomada. A letra do código de resposta a emergências (drill code) é mostrada separadamente
  na tabela; ela indica outros possíveis perigos da substância. Em alguns casos, a orientação
  dada pelo número do código de resposta a emergências (drill code) pode ser mais aperfeiçoada
  pela informação dada pela(s) letra(s) do código de resposta a emergências (drill code).

  9.2. Lista alfabética de artigos perigosos com códigos de resposta a emergências (drill
  code)

  9.2.1. A lista de nomes apropriados para embarque usados para artigos perigosos, classificada
  em ordem alfabética, é mostrada na Tabela 4-2 do Doc 9481 da OACI. Para cada registro, um
  código de resposta a emergências (drill code) é dado e essa informação deveria ser usada
  para encontrar o código de resposta a emergências (drill code) apropriado na tabela de códigos
  de resposta a emergências (drill code). O número de identificação das Nações Unidas (UN)
  também é listado para oferecer confirmação de que o registro correto foi selecionado.

  9.2.2. Em alguns casos, além do nome apropriado para embarque, o número UN, o grupo de embalagem
  e/ou perigo secundário também devem ser usados para identificar o código de resposta a emergências
  (drill code) apropriado. Quando isso for necessário, os possíveis números UN, grupos de
  embalagem e/ou perigos secundários são mostrados embaixo do nome apropriado para embarque
  e, assim, o código de resposta a emergências (drill code) apropriado pode ser selecionado.
  Esses detalhes adicionais são mostrados na Notificação ao Piloto em Comando (NOTOC).

  9.2.3. Na determinação da ordem alfabética de nomes apropriados para embarque, números e
  os termos n.o.s., alfa-, beta-, meta-, ômega-, sec-, tert-, a-, b-, m-, N-, n-, O-, o- e
  p- foram ignorados. Quando os nomes são formados por mais de uma palavra, eles foram ordenados
  como se fossem uma única palavra.

  9.3. Lista numérica de artigos perigosos com código de resposta a emergências (drill code)

  9.3.1. A lista de nomes apropriados para embarque usados para artigos perigosos, ordenadas
  numericamente a partir do número UN associado, é mostrada na Tabela 4-3 do Doc 9481 da OACI.
  Para cada registro, um código de resposta a emergências (drill code) é dado e essa informação
  deveria ser usada para encontrar o código de resposta a emergências (drill code) apropriado
  na tabela de códigos de resposta a emergências (drill code).

  9.3.2. Em alguns casos, além do número UN, a classe ou divisão, o grupo de embalagem ou
  o perigo secundário devem também ser utilizados para identificar o código de resposta a
  emergências (drill code) correto. Quando isso for necessário, a possível classe ou divisão,
  grupo de embalagem ou perigo secundário são mostrados embaixo do número UN e, assim, o código
  de resposta a emergências (drill code) apropriado pode ser selecionado. Esses detalhes adicionais
  são mostrados na Notificação ao Piloto em Comando (NOTOC).

  9.3.3. Os artigos perigosos que ainda não foram alocados a um número UN estão listados primeiro.

  9.4. Códigos de resposta a emergências (drill code) para artigos perigosos n.e. (n.o.s.)

  9.4.1. O código de resposta a emergências atribuído à lista de artigos perigosos a seguir
  é baseado em seu perigo primário. A chave alfabética pode precisar ser alterada se houver
  perigos secundários a serem considerados. Perigos secundários, quando aplicáveis, são atribuídos
  de acordo com o item B0.6 da IS nº 175-001.

  UN 3537 - Objetos contendo gás inflamável, n.e.*

  UN 3538 - Objetos contendo gás não-inflamável, não-tóxico, n.e.*

  UN 3539 - Objetos contendo gás tóxico, n.e.*

  UN 3540 - Objetos contendo líquido inflamável, n.e.*

  UN 3541 - Objetos contendo sólido inflamável, n.e.*

  UN 3542 - Objetos contendo uma substância passível de combustão espontânea, n.e.*

  UN 3543 - Objetos contendo uma substância que emite gás inflamável em contato com água,
  n.e.*

  UN 3544 - Objetos contendo substância oxidante, n.e.*

  UN 3545 - Objetos contendo peróxido orgânico, n.e.*

  UN 3546 - Objetos contendo substância tóxica, n.e.*

  UN 3547 - Objetos contendo substância corrosiva, n.e.*

  UN 3548 - Objetos contendo artigos perigosos diversos, n.e.*

