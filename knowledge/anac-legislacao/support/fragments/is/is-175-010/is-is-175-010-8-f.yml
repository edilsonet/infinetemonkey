text: 'f) derramamento ou vazamento de artigos perigosos (ver 8.4.7).

  Nota: apesar de essa IS apresentar uma sequência de tarefas, algumas dessas ações ocorrem
  simultaneamente entre os membros da tripulação.

  8.4.2. Fogo ou fumaça relacionado com bateria ou com dispositivo eletrônico portátil

  PROCEDIMENTOS PARA FOGO OU FUMAÇA RELACIONADO COM BATERIA OU COM DISPOSITIVO ELETRÔNICO
  PORTÁTIL - AMPLIFICADOS

  Passo

  Ação da tripulação de cabine

  1.

  Identificar o objeto

  Pode ser que não seja possível identificar o objeto (origem do fogo) imediatamente, especialmente
  se o fogo tiver se iniciado no bolso dos assentos ou se o dispositivo não estiver prontamente
  acessível. Nesse caso, os procedimentos de combate ao fogo deveriam ser aplicados primeiramente.
  Se o objeto estiver dentro de uma bagagem, as ações tomadas pelos membros da tripulação
  serão similares às de quando o objeto está visível ou prontamente acessível.

  Atenção: para evitar danos por incêndio repentino, não é recomendado abrir a bagagem afetada
  quando houver qualquer indicação de fumaça ou de chamas. Entretanto, em certas situações
  os membros da tripulação de cabine podem avaliar o caso e julgar necessário realizar uma
  pequena abertura da bagagem de forma a permitir a entrada do agente extintor e do líquido
  não inflamável. Essa ação deveria ser realizada de maneira extremamente cautelosa e apenas
  após se terem colocado os equipamentos de proteção apropriados disponíveis na aeronave.

  2.

  Aplicar procedimento de combate ao fogo

  Qualquer ocorrência envolvendo fogo na cabine deveria ser notificada imediatamente ao piloto
  em comando, que deveria ser mantido informado de todas as ações tomadas e de seus resultados.
  É essencial que os membros das tripulações de cabine e de voo coordenem suas ações e se
  mantenham totalmente informados das respectivas ações e intenções.

  Procedimentos apropriados de combate ao fogo e de emergência devem ser utilizados para lidar
  com qualquer fogo. Em uma operação com mais de um membro da tripulação de cabine, as ações
  detalhadas no procedimento de combate ao fogo deveriam ser executadas simultaneamente. Em
  aeronaves com apenas um membro de tripulação de cabine, deveria se buscar ajuda de um passageiro
  para lidar com a situação.

  Halon, substituto de halon ou extintor de água deveriam ser utilizados para extinguir o
  fogo e prevenir que se espalhe para outros materiais inflamáveis. É importante que se use
  equipamento de proteção disponível (tais como: equipamento protetor de respiração, luvas
  resistentes ao fogo) no combate ao fogo.

  Em caso de fogo, os membros da tripulação de cabine deveriam tomar ações imediatas para
  deslocar os passageiros para locais distantes da área afetada e, se necessário, providenciar
  toalhas ou panos molhados e instruí-los a respirar através deles.

  Minimizar a propagação da fumaça e do fumo dentro da cabine de comando é fundamental para
  a continuidade da operação com segurança da aeronave; por isso é essencial manter a porta
  da cabine de comando fechada durante todo o tempo. A comunicação e a coordenação entre os
  membros da tripulação são de extrema importância. O interfone é o meio primário de comunicação,
  exceto se o sistema deixar de funcionar.

  3.

  Remover a fonte de energia

  É importante instruir o passageiro a desconectar o dispositivo da fonte de energia, se for
  considerado seguro. A bateria tem uma maior possibilidade de pegar fogo devido ao superaquecimento
  durante ou imediatamente após o ciclo de carregamento, embora os efeitos possam acontecer
  após um certo período de tempo. Ao remover a fonte externa de energia do dispositivo, assegura-se
  que a bateria não será alimentada por energia adicional que pode incentivar a geração de
  fogo.

  Desligue a fonte de energia dos assentos restantes até que se possa assegurar que o mau
  funcionamento do sistema da aeronave não contribua para falhas adicionais dos dispositivos
  eletrônicos portáteis dos passageiros.

  Verifique visualmente se a energia dos circuitos elétricos restantes permanece desligada
  até que se possa determinar se o sistema da aeronave está livre de falhas, caso o dispositivo
  tenha sido conectado anteriormente.

  A remoção da energia pode ocorrer simultaneamente a outras ações dos membros da tripulação
  de cabine (por exemplo, obter água para resfriar o dispositivo). Dependendo do tipo de aeronave,
  a fonte de energia dos assentos deve ser desligada pelos membros da tripulação de cabine.

  Atenção: não tente retirar a bateria do dispositivo.

  4.

  Resfriar o dispositivo com água (ou outro líquido não inflamável)

  Deve-se utilizar água (ou outro líquido não inflamável) para resfriar a bateria que tenha
  sido incendiada de forma a evitar que o calor se propague a outras células da bateria. Se
  água não estiver disponível, pode-se utilizar qualquer outro líquido não inflamável para
  resfriar o dispositivo.

  Nota: o líquido pode evaporar ao ser aplicado sobre uma bateria quente.

  5.

  Manter o dispositivo em seu local de origem e monitorar uma possível reignição

  Uma bateria envolvida em um fogo pode sofrer reignição e emitir chamas diversas vezes à
  medida que o calor é transferido para outras células da bateria. Portanto, o dispositivo
  deve ser monitorado regularmente para identificar se há qualquer indicação de que o perigo
  de incêndio ainda existe. Se houver qualquer fumaça ou indicação de fogo, o dispositivo
  deve ser resfriado com mais água (ou qualquer líquido não inflamável).

  Atenção:'
