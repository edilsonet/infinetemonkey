title: OBJETIVO
text: '1. OBJETIVO

  Estabelecer um modelo e orientações de preenchimento para o documento de transporte

  de artigos perigoso, definido na Parte 5 das Instruções Técnicas, aos expedidores de

  artigos perigosos, bem como diretrizes aos operadores aéreos regidos pelo RBAC nº 121

  e pelo RBAC nº 135 sobre a verificação do referido documento no momento da aceitação

  de artigos perigosos.'
