title: O transporte aéreo de artigos perigosos pode ser realizado com segurança desde que
  se
text: '5.1.1 O transporte aéreo de artigos perigosos pode ser realizado com segurança desde
  que se

  obedeça aos requisitos dispostos no RBAC nº 175, na IS nº 175-001 e demais IS

  associadas. Esses regulamentos se destinam a viabilizar o transporte por via aérea ao

  impor um nível de segurança tal que os artigos perigosos possam ser transportados sem

  colocar a aeronave ou seus ocupantes em risco.'
