  por
text: '5.1.2 Uma das responsabilidades das pessoas que realizam a expedição de artigos perigosos
  por

  via aérea é declarar corretamente o objeto ou substância a ser expedido. Sendo assim, faz-

  se necessário, nas situações previstas na regulamentação, o preenchimento da

  documentação adequada, incluindo o documento de transporte de artigos perigoso,

  conforme definido na definido no Apêndice E da IS nº 175-001.'
