text: '5.1.3 Esta Instrução Suplementar é aplicável a expedidores de artigos perigosos, a
  operadores

  aéreos regidos pelo RBAC nº 121 e pelo RBAC nº 135 e a todos os seus funcionários,

  incluindo aqueles que atuam em seu nome, tais como terceirizados, subcontratados,

  eventuais, dentre outros, sejam eles:'
