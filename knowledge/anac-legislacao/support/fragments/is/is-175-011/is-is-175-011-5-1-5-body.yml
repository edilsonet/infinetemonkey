title: Esta Instrução Suplementar estabelece que uma das formas de cumprimento do conjunto
text: '5.1.5 Esta Instrução Suplementar estabelece que uma das formas de cumprimento do conjunto

  de requisitos referentes ao documento de transporte de artigos perigosos está relacionada

  ao preenchimento da Declaração do Expedidor para Artigos Perigosos. Portanto, entende-

  se que o documento de transporte de artigos perigosos a que se refere a regulamentação

  vigente, incluindo o RBAC nº 175 e a IS nº 175-001, é a Declaração do Expedidor para

  Artigos Perigosos estabelecida nesta IS.

  5.2 Requisitos gerais - Documentação requerida'
