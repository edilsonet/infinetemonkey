text: '5.10.1 Modelos de formulário são mostrados nos Apêndices desta IS. Os Apêndices A e
  B foramData de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  criados para o preenchimento computadorizado em portugês e inglês, respectivamente.

  Os Apêndices C e D foram criados para o preenchimento manual, em portugês e inglês,

  respectivamente. Ambos podem ser preenchidos de maneira manual ou mecânica.'
