title: Os formulários de Declaração do Expedidor para Artigos Perigosos deveriam ser
text: '5.4.1.1 Os formulários de Declaração do Expedidor para Artigos Perigosos deveriam ser

  impressos nos formatos apresentados pelo item 5.10 desta IS, mantendo sua redação nos

  padrões dos termos e nomenclaturas definidas pelo RBAC nº 175 e pela IS nº 175-001.

  Adicionalmente, se requerido, o texto em inglês pode ser suplementado com uma

  tradução precisa para outro idioma. O espaçamento de colunas e caixas que estejam

  presentes nos campos de “Natureza e Quantidade de Artigos Perigosos” e delineado por

  linhas tracejadas pode ser alterado para acomodar os requisitos de expedidor.'
