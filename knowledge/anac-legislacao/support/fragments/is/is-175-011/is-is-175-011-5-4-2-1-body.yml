title: O formulário da Declaração do Expedidor para Artigos Perigoso pode ser impresso em
text: '5.4.2.1 O formulário da Declaração do Expedidor para Artigos Perigoso pode ser impresso
  em

  preto e vermelho sobre papel branco, conforme modelos apresentados pelo item 5.10, ou

  pode ser impresso somente em vermelho sobre papel branco. As linhas diagonais

  impressas verticalmente nas margens esquerda e direita deveriam ser impressas em

  vermelho.Data de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B'
