text: '5.5.2.1 A informação específica a ser provida em cada campo do formulário está disposta
  no item

  5.9. Adicionalmente às provisões contidas nesta IS, outros elementos de informações

  podem ser exigidos por autoridades nacionais apropriadas ou para certos modos de

  transporte (exemplo: ponto de fulgor para o transporte marítimo). Exceto se for permitido

  ou exigido pelo RBAC nº 175 ou por Instrução Suplementar, informações adicionais

  devem ser colocadas após a descrição dos artigos perigosos.'
