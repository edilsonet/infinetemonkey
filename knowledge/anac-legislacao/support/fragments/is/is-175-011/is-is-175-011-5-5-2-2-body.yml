title: Um formulário de Declaração do Expedidor para Artigos Perigosos contendo
text: '5.5.2.2 Um formulário de Declaração do Expedidor para Artigos Perigosos contendo

  informações que não sejam relevantes para uma expedição de artigos perigosos específica

  ou para artigos perigosos contidos em uma remessa não é aceitável. Se artigos perigosos

  estiverem listados na Declaração do Expedidor para Artigos Perigosos juntamente com

  outras cargas não classificadas como artigos perigosos, os artigos perigosos devem ser

  listados primeiro ou enfatizados de outra maneira.'
