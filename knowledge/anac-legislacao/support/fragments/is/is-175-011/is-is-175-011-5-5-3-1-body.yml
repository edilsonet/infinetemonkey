title: Quando um documento impresso for usado, o expedidor deve fornecer 2 (duas) vias da
text: '5.5.3.1 Quando um documento impresso for usado, o expedidor deve fornecer 2 (duas)
  vias da

  Declaração do Expedidor para Artigos Perigosos preenchidas e assinadas, contendo

  assinatura conforme especificado no item 5.7.1, para apresentação ao operador aéreo

  junto da expedição. Uma via assinada deve ser retida pelo operador aéreo que realizar a

  aceitação. A outra via deve ser encaminhada junto com a remessa até o seu destino. Uma

  das vias, incluindo a assinatura, pode estar em cópia de carbono. (Ver item 5.7.1)

  Nota: somente o operador inicial é requerido a arquivar uma via original da Declaração do

  Expedidor para Artigos Perigosos. Uma cópia da Declaração do Expedidor para Artigos

  Perigosos original pode ser arquivada quando uma remessa sofre transbordo.'
