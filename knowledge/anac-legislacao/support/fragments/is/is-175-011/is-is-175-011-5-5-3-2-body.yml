title: Quando a informação de uma Declaração do Expedidor para Artigos Perigosos for
text: '5.5.3.2 Quando a informação de uma Declaração do Expedidor para Artigos Perigosos for

  fornecida por meio de técnicas de PED ou IED, o operador deve ser capaz de reproduzir

  prontamente, em um documento impresso, os dados na sequência requerida por esta IS.Data
  de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  Nota: o propósito deste requisito é facilitar auditorias e inspeções e investigações de
  ocorrências

  pela ANAC ou outro órgão competente.'
