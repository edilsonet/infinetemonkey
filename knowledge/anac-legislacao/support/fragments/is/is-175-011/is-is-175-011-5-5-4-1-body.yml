title: Para fins desta IS, uma consolidação ou uma expedição consolidada é uma remessa de
text: '5.5.4.1 Para fins desta IS, uma consolidação ou uma expedição consolidada é uma remessa
  de

  múltiplos volumes originários de mais de um expedidor, que realizaram acordos para

  transporte aéreo com um intermediário que não seja um operador aéreo.

  Nota: nestes casos, considera-se que o intermediário pode assumir uma ou mais

  responsabilidades dos expedidores, nos termos da legislação em vigor.'
