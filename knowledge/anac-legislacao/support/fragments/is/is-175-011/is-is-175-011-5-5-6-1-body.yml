text: '5.5.6.1 O operador não aceitará um formulário de declaração que foi alterado ou corrigido,
  a não

  ser que a alteração ou correção a um campo tenha sido assinada pelo expedidor com a

  mesma assinatura utilizada para assinar o documento. As alterações do “Número do

  Conhecimento Aéreo”, do “Aeroporto de Origem” e do “Aeroporto de Destino” são

  desconsideradas nesta provisão.'
