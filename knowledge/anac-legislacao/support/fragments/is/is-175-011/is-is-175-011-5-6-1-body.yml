text: '5.6.1 Cada artigo ou substância oferecido para transporte deve ser declarado pelo seu
  “NomeData de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  Apropriado para Embarque”. O nome apropriado para embarque é considerado como

  aquele que descreve de forma mais precisa os artigos perigosos da Lista de Artigos

  Perigosos (Tabela C-1 da IS nº 175-001) e é mostrado em negrito. O nome apropriado

  para embarque na descrição dos artigos perigosos deve ser suplementado conforme

  explicado nos itens 5.6.1 a 5.6.8, conforme aplicável.

  Nota 1: texto adicional explicativo mostrado em caracteres normais na Lista de Artigos Perigosos

  não é parte do nome apropriado para embarque, mas pode ser usado em adição a ele.

  Nota 2: para explosivos da Classe 1, o nome apropriado para embarque pode ser complementado

  por texto adicional explicativo para indicar os nomes comerciais e militares.

  Nota 3: pequenas discrepâncias, tais como a omissão de pontos e vírgulas no nome apropriado

  para embarque que aparece no documento de transporte ou em marcas nos volumes não

  são consideradas como erros, caso não comprometam a segurança operacional.'
