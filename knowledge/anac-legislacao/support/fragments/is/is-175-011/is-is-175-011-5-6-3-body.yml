title: A palavra de qualificação “mistura” ou “solução” deve ser adicionada ao nome
text: '5.6.3 A palavra de qualificação “mistura” ou “solução” deve ser adicionada ao nome

  apropriado para embarque quando uma mistura ou solução contiver uma substância

  apresentada na Lista de Artigos Perigosos com um ou mais artigos não perigosos e o

  estado físico e grupo de embalagem não mudarem. Quando uma mistura ou solução

  contiver dois ou mais artigos perigosos, listados ou não, a palavra de qualificação

  “mistura” ou “solução”, conforme aplicável, deveria ser adicionada aos nomes técnicos

  mostrados entre parênteses.'
