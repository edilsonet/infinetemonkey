text: '5.6.4 Para os resíduos de artigos perigosos (exceto resíduos radioativos) transportados
  para

  eliminação, ou para o processamento para eliminação, o nome apropriado para embarque

  deve ser antecedido da palavra "Resíduo", exceto se esse termo já fizer parte do nome

  apropriado para embarque.'
