title: Nomes apropriados para embarque podem figurar no singular ou no plural, conforme
text: '5.6.5 Nomes apropriados para embarque podem figurar no singular ou no plural, conforme

  apropriado. Adicionalmente, quando palavras de qualificação forem usadas como parte

  do nome apropriado para embarque, sua sequência na documentação ou nas marcas do

  volume é opcional. Como exemplo, “Dimetilamina solução aquosa” pode

  alternativamente ser mostrada como “Solução aquosa de Dimetilamina”. No entanto, a

  sequência definida na Lista de Artigos Perigosos reflete a melhor forma. Grafias

  alternativas de uso comum ao redor do mundo ssão aceitáveis para trocas de letras em

  palavras como “caesium” por “caesium”, “sulfur” por “sulphur”, “aluminum” por

  “aluminium”, etc. Entretanto, a grafia da Lista de Artigos Perigosos é a recomendada.'
