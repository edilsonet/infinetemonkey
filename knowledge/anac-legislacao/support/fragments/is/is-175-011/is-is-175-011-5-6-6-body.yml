title: Quando uma substância sólida, de acordo com a definição de líquido contida na IS nº
text: '5.6.6 Quando uma substância sólida, de acordo com a definição de líquido contida na
  IS nº

  175-001 (ver A3.1), for oferecida para o transporte aéreo no estado fundido, a palavra

  “fundido” deve ser acrescentada ao nome apropriado para embarque mostrado na Lista

  de Artigos Perigosos, exceto se a palavra já estiver incluída. Um exemplo deste tipo de

  nome próprio para embarque seria “Alquilofenol, sólido, n.e., fundido”.Data de emissão:
  14 de abril de 2021.

  IS nº 175-011

  Revisão B'
