text: '5.6.8 Com exceção de substâncias autorreagentes e peróxidos orgânicos e, exceto se
  já estiver

  incluída em negrito no nome indicado na Lista de Artigos Perigosos, a palavra

  “estabilizado” deve ser adicionada como parte do nome apropriado para embarque de

  uma substância que sem estabilização seja proibida para transporte, de acordo com o item'
