cite: 5.7.1.1
title: O formulário de declaração deve ser assinado e datado pelo expedidor ou representante
text: '5.7.1.1 O formulário de declaração deve ser assinado e datado pelo expedidor ou representante

  designado conforme descrito a seguir. Uma assinatura escrita por digitação em

  computador não é aceitável. É aceitável que pessoas ou organizações (incluindo

  consolidadores e agências de carga) contratadas pelo expedidor para agirem em seu nome

  assumam suas responsabilidades no preparo da remessa, desde que estes estejam

  treinados de acordo com o estabelecido na IS nº 175-002 para assinar a Declaração do

  Expedidor para Artigos Perigosos.'
