title: Caso a Declaração do Expedidor para Artigos Perigosos seja apresentada para o operador
text: '5.7.1.2 Caso a Declaração do Expedidor para Artigos Perigosos seja apresentada para
  o operador

  aéreo por meio de técnicas de PED ou IED, a(s) assinatura(s) pode(m) ser assinatura(s)

  eletrônica(s) ou podem ser substituídas pelo(s) nome(s), em letras maiúsculas, da pessoa

  autorizada a assinar. Quando uma remessa original é reexpedida para um operador aéreo

  que requeira documentação em papel, o operador aéreo deve garantir que tal documento

  seja produzido nos formatos definidos pelos Apêndices A a D desta IS. A Declaração do

  Expedidor para Artigos Perigosos deve indicar o texto “Original recebido por via

  eletrônica”, em letras maiúsculas, ao lado da assinatura e do nome do signatário.'
