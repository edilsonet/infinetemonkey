title: O operador aéreo pode requerer que o expedidor certifique que uma expedição não
text: '5.7.3.1 O operador aéreo pode requerer que o expedidor certifique que uma expedição
  não

  contenha artigos perigosos, caso o expedidor declare que a mesma não é assim

  classificada. Nesse caso, o operador aéreo pode também requerer que o expedidor possua

  uma confirmação de uma autoridade indicada pelo operador aéreo.'
