text: '5.7.4.1 Quando for necessário que uma expedição de diversas partes seja realizada em
  mais de

  um lote, em mais de uma aeronave, o primeiro operador aéreo deve obter do expedidor,Data
  de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  ou prover, uma cópia da Declaração do Expedidor para Artigos Perigosos para que cada

  parte da expedição seja transportada em cada aeronave.

  Nota: é aceitável que uma fotocópia da Declaração do Expedidor para Artigos Perigosos

  acompanhe cada parte da expedição.

  5.8 Declaração do Expedidor para Artigos Perigosos - Instruções gerais de

  preenchimento'
