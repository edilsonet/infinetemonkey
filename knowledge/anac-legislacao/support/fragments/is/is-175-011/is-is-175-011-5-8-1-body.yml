title: A Declaração do Expedidor para Artigos Perigosos deve ser preenchida estritamente de
text: '5.8.1 A Declaração do Expedidor para Artigos Perigosos deve ser preenchida estritamente
  de

  acordo com as instruções a seguir. Campos do “Número do Conhecimento Aéreo”,

  “Aeroporto de Origem” e “Aeroporto de Destino” podem ser inseridos ou alterados tanto

  pelo expedidor, seus agentes, ou pelo operador aéreo que realizar a aceitação. Entretanto,

  todas as outras informações devem ser preenchidas somente pelo expedidor ou pessoas

  ou organizações contratadas pelo expedidor para agir em seu nome, assumindo suas

  responsabilidades.'
