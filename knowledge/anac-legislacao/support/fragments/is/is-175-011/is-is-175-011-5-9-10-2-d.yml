text: 'd) Passo 4. O(s) número(s) da(s) classe(s) ou da(s) divisão(ões) de perigo secundário,

  correspondente(s) à(s) etiqueta(s) de perigo secundário, quando houver, deve(m)

  ser preenchido(s) após a classe ou divisão de perigo primário e deve(m) estar entre

  parênteses.

  Nota: um perigo secundário deve ser preenchido quando uma etiqueta de perigo secundário
  for

  requerida por uma provisão especial. As palavras “Classe’ ou “Divisão” podem ser

  incluídas precedendo os números da classe ou divisão de perigo secundário.'
