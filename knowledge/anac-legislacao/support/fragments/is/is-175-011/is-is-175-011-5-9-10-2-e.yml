text: 'e) Passo 5. Para materiais radioativos que possuam perigo secundário, o grupo de

  embalagem aplicável para o objeto ou substância que pode ser precedido por ”GE”

  (p. ex., “GE II”).

  Nota: as descrições para artigos perigosos radioativos acima apresentadas devem estar na
  ordem

  descrita sem nenhuma informação intercalada, exceto quando permitido. Exemplos desse

  preenchimento são:

  • UN 2978, Material radioativo, hexafluoreto de urânio, 7 (6.1, 8)

  • UN 2683, Material radioativo, hexafluoreto de urânio, Classe 7 (Divisão 6.1, Classe

  8)'
