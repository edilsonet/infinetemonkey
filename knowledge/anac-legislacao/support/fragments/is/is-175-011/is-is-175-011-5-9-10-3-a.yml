title: 5.9.10.3(a)
text: 'a) Passo 6.

  I. O nome ou o símbolo de cada radionuclídeo ou, para as misturas de

  radionuclídeos, uma descrição geral apropriada ou uma lista dos nuclídeos

  mais restritivos.

  II. Uma descrição das formas química e física do material radioativo ou

  informação de que se trata de material radioativo sob forma especial (não

  requerido para UN 3332 e UN 3333) ou material radioativo de baixa

  dispersividade.

  Nota: para volumes vazios Tipo B(U) e Tipo B(M), conforme especificado na Nota de

  2;7.2.4.1.1.7 das Instruções Técnicas ou equivalente em norma da CNEN, o nome ou o

  símbolo do radionuclídeo do material de proteção seguido pela forma física e química

  deve ser incluído (p. ex., urânio empobrecido, sólido, óxido de metal), caso em que o

  radionuclídeo indicado pode diferir do(s) radionuclídeo(s) autorizado(s) no certificado
  do

  projeto do volume.'
