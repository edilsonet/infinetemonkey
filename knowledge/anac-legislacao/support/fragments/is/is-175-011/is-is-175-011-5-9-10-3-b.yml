text: 'b) Passo 7. Número de volumes (do mesmo tipo e conteúdo), seu tipo de volume e

  atividade em becquerel ou seus múltiplos (a unidade deve estar claramente

  identificada) do conteúdo radioativo em cada volume, incluindo os volumes emData de emissão:
  14 de abril de 2021.

  IS nº 175-011

  Revisão B

  cada sobrembalagem. (A atividade em Curie ou seus múltiplos, desde que a unidade

  esteja claramente identificada, pode ser adicionada entre parênteses após a unidade

  em becquerel). Para material físsil, o peso total de material físsil (ou o peso de cada

  nuclídeo físsil para misturas, quando apropriado) em gramas ou quilogramas pode

  ser utilizado em vez da atividade (em todos os casos, a unidade deve estar

  claramente identificada).

  Para radionuclídeos diferentes embalados no mesmo volume, a atividade de cada

  radionuclídeo.

  As palavras “Todos embalados em um(a) (descrição do tipo de volume)” devem ser

  inseridas logo após as entradas relevantes.'
