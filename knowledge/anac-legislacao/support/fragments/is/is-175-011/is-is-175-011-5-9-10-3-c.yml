title: 5.9.10.3(c)
text: 'c) Passo 8. Quando uma sobrembalagem for utilizada, as palavras ”Sobrembalagem

  utilizada” devem ser incluídas no formulário de declaração imediatamente após

  todas as entradas relevantes referentes aos volumes que estiverem contidos na

  sobrembalagem. Em tais casos, volumes dentro de sobrembalagens devem ser

  listados primeiro.

  I. Quando uma remessa consistir em múltiplas sobrembalagens, a marca de

  identificação (que pode ser em formato alfanumérico) mostrada na

  sobrembalagem ser incluída na Declaração do Expedidor para Artigos

  Perigosos. As marcas de identificação devem ser mostradas em conjunto com

  as palavras “Sobrembalagem utilizada”.

  II. Sobrembalagens múltiplas com conteúdo idêntico devem ser identificadas

  conforme a seguir: “Sobrembalagem utilizada x (número de sobrembalagens

  idênticas)”.

  III. Sobrembalagens múltiplas com conteúdo distinto devem ser listadas

  separadamente.

  Para volumes em uma sobrembalagem ou contêiner de carga, uma descrição

  detalhada do conteúdo de cada volume e, quando apropriado, de cada

  sobrembalagem ou contêiner de carga deve ser incluída.

  Nota: quando for utilizado modelo de Declaração do Expedidor para Artigos Perigosos

  diferente do apresentado nesta IS, as palavras “Sobrembalagem utilizada” aparecerão

  após todas as informações associadas com os artigos perigosos, incluindo o número da

  instrução de embalagem e quaisquer autorizações.'
