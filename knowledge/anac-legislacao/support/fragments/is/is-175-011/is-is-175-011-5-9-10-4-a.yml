title: 5.9.10.4(a)
text: 'a) Passo 9. Categoria do(s) volume(s) e sobrembalagem ou contêiner de carga:

  I. a categoria dos volumes, por exemplo, “I-Branca” ou “II-Amarela” ou “III-

  Amarela”. Quando os volumes estivem em uma sobrembalagem, a categoria

  da sobrembalagem também deve ser informada;Data de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  II. para a categoria “II-Amarela” e “III-Amarela” somente, o Índice de

  Transporte do volume. Quando os volumes estivem em um a sobrembalagem,

  o Índice de Transporte da sobrembalagem também deve ser informado;

  III. para as categorias “II-Amarela” e “III-Amarela” somente, dimensões,

  incluindo as unidades de dimensão de cada volume ou as dimensões da

  sobrembalagem ou contêiner de carga, quando utilizado. As dimensões

  devem ser mostradas na forma comprimento x largura (ou diâmetro para

  volumes em formato de tambor) x altura. “C” ,“L” (ou “D”),“A” podem ser

  mostradas imediatamente antes de cada dimensão. Caso seja disposto em

  ordem diferente que C x L x A, o significado de cada dimensão deve estar

  claramente identificado. O Índice de Transporte deve ser arredondado para a

  primeira casa decimal superior;

  IV. para material físsil:

  • expedido como exceptivo, conforme 2;7.2.3.5.1 a) a f) das Instruções

  Técnicas ou equivalente em norma da CNEN, deve-se indicar o

  requisito de referência;

  • expedido conforme 2;7.2.3.5.1 c) a e) das Instruções Técnicas ou

  equivalente em norma da CNEN, deve-se indicar a massa total dos

  nuclídeos físseis;

  • contido num volume para o qual um dos requisitos de 6;7.10.2 a) a c)

  ou 6;7.10.3 das Instruções Técnicas, ou equivalente em norma da

  CNEN, se aplica, deve-se indicar o requisito de referência; e

  • deve-se citar o índice de segurança de criticalidade, quando aplicável.'
