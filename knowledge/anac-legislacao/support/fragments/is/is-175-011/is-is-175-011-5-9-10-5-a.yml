title: 5.9.10.5(a)
text: 'a) Passo 10 (se relevante). Caso um ou mais documentos listados a seguir, emitidos

  por uma autoridade competente, estejam acompanhando a remessa, deve constar na

  Declaração do Expedidor uma lista das marcas de identificação de cada um, junto

  com uma declaração que tais documentos estão anexados ao formulário:

  • certificado de forma especial;

  • certificado de material de baixa dispersividade;

  • certificado de aprovação do projeto do volume Tipo B;

  • certificado de aprovação da expedição do volume Tipo B(M);

  • certificado de aprovação do projeto do volume e de aprovação da expedição

  do volume Tipo C;

  • certificado de aprovação do projeto do volume de material físsil;

  • certificado de aprovação da expedição do volume de material físsil;

  • material físsil sob exceção conforme item 2; 7.2.3.5.1 f) das Instruções

  Técnicas;Data de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  • certificado de aprovação para arranjo especial; e

  • quaisquer documentos similares.'
