title: 5.9.10.5(c)
text: 'c) Passo 12. Para BAE-II, BAE-III, OCS-I e OCS-II, a atividade total da remessa

  como um múltiplo de A2. Para os materiais radioativos para os quais o valor de A2

  for ilimitado, o múltiplo de A2 deve ser zero.

  O expedidor pode inserir um número de referência ou de identificação do volume

  no formulário de declaração como o último item da quarta sequência.'
