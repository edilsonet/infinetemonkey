title: Preencher com qualquer informação especial de manuseio relevante para a expedição.
text: '5.9.12.1 Preencher com qualquer informação especial de manuseio relevante para a expedição.

  Por exemplo, para substâncias autorreagentes da Divisão 4.1, peróxidos orgânicos da

  Divisão 5.2 ou outras substâncias com propriedades semelhantes que forem oferecidas

  para o transporte, o expedidor deve indicar que os volumes que contenham tais

  substâncias devem ser protegidos da luz solar direta e de todas as fontes de calor e devem

  ser colocados em áreas adequadamente ventiladas.'
