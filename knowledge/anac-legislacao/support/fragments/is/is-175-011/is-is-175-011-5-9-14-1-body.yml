title: Quando geradores químicos de oxigênio contidos em equipamento respiratório de
text: '5.9.14.1 Quando geradores químicos de oxigênio contidos em equipamento respiratório
  de

  proteção (PBE) forem transportados sob a Provisão Especial A144, a expressão

  “Equipamento respiratório de proteção da tripulação (máscara antifumaça), de acordo

  com a Provisão Especial A144” deve ser incluída no campo “Informações Adicionais de

  Manuseio” da Declaração do Expedidor para Artigos Perigosos.'
