text: '5.9.15.1 Devem ser informados o nome e o número de telefone de uma pessoa responsável
  nos

  casos em que alguma lei nacional ou uma convenção internacional proíba a divulgação

  do nome técnico após o termo “n.e.*” e para as substâncias infectantes, UN 2814 e UN

  2900.'
