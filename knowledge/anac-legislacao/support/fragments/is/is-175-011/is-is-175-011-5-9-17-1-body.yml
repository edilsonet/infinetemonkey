title: Quando líquidos viscosos inflamáveis estiverem associados com o Grupo de Embalagem
text: '5.9.17.1 Quando líquidos viscosos inflamáveis estiverem associados com o Grupo de Embalagem

  III de acordo com as provisões de B3.2.2 da IS nº 175-001, uma declaração deve ser

  incluída na Declaração do Expedidor para Artigos Perigosos, por exemplo: “UN xxxx

  2;3.2.2”, onde xxxx é o número UN do líquido viscoso inflamável. Essa declaração

  deveria ser incluída no campo “Informações Adicionais de Manuseio” da Declaração do

  Expedidor para Artigos Perigosos.'
