title: O documento de transporte artigos perigosos deve incluir uma certificação ou uma
text: '5.9.19.1 O documento de transporte artigos perigosos deve incluir uma certificação
  ou uma

  declaração de que a remessa é aceitável para o transporte e que os artigos perigosos estão

  devidamente classificados, embalados, marcados, etiquetados e em condições adequadas

  para o transporte em conformidade com os regulamentos aplicáveis. O texto para essa

  certificação ou declaração é o seguinte:

  “Declaro que o conteúdo desta remessa está completa e precisamente descrito acima pelo nome

  apropriado para embarque, que está classificado, embalado, marcado, etiquetado/sinalizado
  e que

  está, em todos os aspectos, em condições adequadas ao transporte de acordo com os regulamentos

  governamentais nacionais e internacionais aplicáveis.”'
