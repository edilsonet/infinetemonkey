title: Preencher com o número do Conhecimento Aéreo (CT-e ou AWB) que será anexado
text: '5.9.3.1 Preencher com o número do Conhecimento Aéreo (CT-e ou AWB) que será anexado

  junto à Declaração do Expedidor para Artigos Perigosos. Esse campo pode ser preenchido

  ou alterado pelo expedidor, seus agentes ou pelo operador aéreo ou seu agente de

  handling. No caso de uma remessa consolidada internacional, preencher com o número

  do House Air Waybill após o número do Air Waybill separado por “/”.Data de emissão: 14 de
  abril de 2021.

  IS nº 175-011

  Revisão B'
