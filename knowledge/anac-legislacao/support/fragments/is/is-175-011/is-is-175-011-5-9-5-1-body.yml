title: Em uma Declaração do Expedidor para Artigos Perigosos pré-impressa, o expedidor deve
text: '5.9.5.1 Em uma Declaração do Expedidor para Artigos Perigosos pré-impressa, o expedidor
  deve

  apagar o campo “Aeronave de Passageiros e Carga” ou o campo “Aeronave Somente de

  Carga” para indicar se a expedição está preparada para cumprir com as limitações

  descritas para aeronaves de passageiros e carga ou com as limitações de aeronaves

  somente de carga. Quando uma Declaração do Expedidor para Artigos Perigosos for

  gerada por um sistema de computador, é suficiente que somente uma das duas

  informações seja mostrada, ou seja, aceita-se que seja impresso apenas o campo

  “Aeronave de Passageiros e Carga” ou o campo “Aeronave Somente de Carga”.'
