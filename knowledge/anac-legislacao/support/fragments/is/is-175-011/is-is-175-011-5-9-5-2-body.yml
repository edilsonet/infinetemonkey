title: Quando o número da instrução de embalagem e a quantidade permitida por volume são
text: '5.9.5.2 Quando o número da instrução de embalagem e a quantidade permitida por volume
  são

  idênticos para aeronaves de passageiros e para aeronaves de carga, a limitação “Aeronave

  Somente de Carga” não deve ser utilizada. A etiqueta de manuseio “Aeronave Somente

  de Carga” não deve ser usada para volumes preparados de acordo com as limitações de

  aeronaves de passageiros, mesmo que esteja em uma Declaração do Expedidor para

  Artigos Perigosos marcada como “Aeronave Somente de Carga”, devido a outros artigos

  perigosos da consolidação.'
