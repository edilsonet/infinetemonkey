title: Quando uma remessa consistir de embalagens de recuperação contendo artigo perigoso
text: '5.9.5.3 Quando uma remessa consistir de embalagens de recuperação contendo artigo perigoso

  restrita ao transporte em aeronaves cargueiras, a Declaração do Expedidor para Artigos

  Perigosos deve conter a indicação “Aeronave Somente de Carga”.'
