title: Aeroporto de destino
text: '5.9.7 Aeroporto de destino

  Preencher com o nome completo do aeroporto ou cidade de destino, que pode ser alterado

  ou corrigido pelo expedidor, seus agentes ou pelo operador aéreo ou seu agente de

  handling.

  Nota: essa informação é opcional e pode ser deixada em branco.'
