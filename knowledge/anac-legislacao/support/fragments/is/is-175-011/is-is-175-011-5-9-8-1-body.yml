text: '5.9.8.1 Em uma Declaração do Expedidor para Artigos Perigosos pré-impressa, o expedidor
  deve

  apagar “Radioativo” para indicar que a expedição não contém material radioativo ou

  apagar “Não Radioativo” para indicar que a expedição contém material radioativo.Data de
  emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B'
