text: 'e) Passo 5. O grupo de embalagem aplicável para o objeto ou substância, que pode ser

  precedido por ”GE” (p. ex., “GE II”). Para estojos químicos e estojos de primeiros

  socorros, o grupo de embalagem mais restritivo das substâncias contidas no estojo.

  Para amostras transportadas de acordo com a provisão do item B0.5 da IS nº 175-

  001, o grupo de embalagem mais restritivo para o nome apropriado para embarque.

  Nota: independentemente de ser requerido a um volume ter uma performance de um grupo de

  embalagem superior, para os propósitos de identificação e documentação, o grupo de

  embalagem mostrado na Lista de Artigos Perigosos se aplica e deve ser usado ao

  preencher a Declaração do Expedidor para Artigos Perigosos.

  Exemplos desse preenchimento são:

  • UN 2683, Sulfeto de amônio solução, 8 (3, 6.1), II

  • UN 2683, Sulfeto de amônio solução, Classe 8 (Classe 3, Divisão 6.1), GE II'
