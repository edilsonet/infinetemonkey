cite: 5.9.9.4(a)
title: 5.9.9.4(a)
text: 'a) Passo 6. Número de volumes (do mesmo tipo e conteúdo), seu tipo de embalagem

  (ex.: “1 caixa de papelão”, “3 tambores de aço”, “quatro IBC compostos” etc.) e:

  I. a quantidade líquida de artigos perigosos em cada volume (por volume ou

  peso, conforme apropriado) deve ser indicada para cada item de artigo

  perigoso que possua um diferente nome apropriado para embarque, número

  UN/ID ou grupo de embalagem. Abreviaturas podem ser utilizadas para

  especificar a unidade de medida para a quantidade. Para volumes que

  contenham os mesmos artigos perigosos e quantidades por volume, um

  múltiplo da quantidade pode ser usado. Por exemplo:

  • UN 1263, Tinta, 3, PG II, 5 caixas de papelão x 5 L

  Remessa composta por embalagens de diferentes quantidades do mesmo

  artigo perigoso deve ser claramente identificada. Por exemplo:

  • UN 1263, Tinta, 3, PG II, 5 caixas de papelão x 5 L, 10 caixas de

  papelão x 10 L

  Códigos de embalagem ONU só podem ser utilizados para complementar a

  descrição do tipo de embalagem (ex.: um tambor de aço (1A1)).

  Para quantidades limitadas, onde a letra “G” segue a quantidade na Lista deData de emissão:
  14 de abril de 2021.

  IS nº 175-011

  Revisão B

  Artigos Perigosos e para as remessas realizadas conforme as disposições da

  Seção IB da Instrução de Embalagem 965 (UN 3480, Baterias de íon lítio) e

  da Instrução de Embalagem 968 (UN 3090, Baterias de lítio metálico) das

  Instruções Técnicas, a massa bruta de cada volume deve ser indicada ao invés

  da quantidade líquida (exceto quando houver diferentes artigos perigosos

  embalados em uma mesma embalagem externa, que nesse caso deve ser

  descrita como mostrado no item 5.9.9.4 a) IV;

  II. embalagens de contenção vazias que contenham resíduo de artigos perigosos,

  que não sejam da Classe 7, devem ser descritas como tal, por exemplo,

  colocando as palavras “Vazia e não limpa” ou “Resíduos do último conteúdo”

  antes ou depois da descrição dos artigos perigosos especificada em 5.9.9.3.

  Não há requisito para mostrar a quantidade, apenas o número e tipo de

  embalagem;

  Nota: independentemente da permissão de usar as palavras "Vazia e não limpa" ou "Resíduos

  do último conteúdo" antes ou após a primeira sequência, é recomendado que as palavras

  sejam inseridas após a primeira sequência, por exemplo, “1 tambor de aço, vazio e não

  limpo”.

  III. para artigos perigosos em maquinaria e aparelhos, as quantidades totais

  individuais de artigos perigosos em estado sólido, líquido ou gasoso contidas

  no objeto devem ser preenchidas;

  IV. para artigos perigosos em quantidades limitadas com limite de até 30 kg G na

  Lista de Artigos Perigosos e para as remessas realizadas conforme as

  disposições da Seção IB da Instrução de Embalagem 965 (UN 3480, Baterias

  de íon lítio) e da Instrução de Embalagem 968 (UN 3090, Baterias de lítio

  metálico) das Instruções Técnicas, quando houver diferentes artigos

  perigosos embalados em uma mesma embalagem externa, a quantidade

  líquida de cada artigo perigoso deve ser preenchida. A massa bruta do volume

  completo deve ser preenchida após o valor de Q (ver Apêndice G desta IS);

  V. para estojos químicos e estojos de primeiros socorros, a massa líquida total,

  incluindo a unidade de medida, de artigos perigosos contida em cada volume

  de artigos perigosos deve ser preenchida. Quando os estojos contiverem

  sólidos e/ou líquidos, a massa líquida dos líquidos dentro dos estojos deve ser

  calculada na relação de 1:1 de seu volume, ou seja, 1 litro igual a 1

  quilograma;

  VI. quando dois ou mais artigos perigosos estiverem embalados na mesma

  embalagem externa, as palavras “Todos embalados em um(a) (descrição do

  tipo de volume)” devem constar imediatamente após as entradas relevantes.

  Se a expedição contiver mais de um volume e cada um contiver a mesma

  seleção e quantidades de itens de consumo compatíveis, então as palavras que

  constam imediatamente após as entradas relevantes devem ser: “Todos

  embalados em um(a) (inserir a descrição do tipo de volume) x .... (inserir o

  número atual de volumes)”;Data de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  VII. quando dois ou mais artigos perigosos as substâncias estiverem embalados na

  mesma embalagem externa, em conformidade com o item C4.3.3 ou

  D1.1.9(e) da IS nº 175-001, o valor de “Q” arredondado para a primeira casa

  decimal acima;

  Nota: o valor de “Q” não precisa ser mostrado na Declaração do Expedidor para Artigos

  Perigosos para dióxido de carbono, sólido (gelo seco), para artigos perigosos que figurem

  como “Sem Limite” na Lista de Artigos Perigosos ou para aqueles que possuam o mesmo

  número UN, grupo de embalagem e estado físico.

  VIII. para artigos perigosos transportados em embalagens de recuperação, uma

  estimativa da quantidade restante deve ser preenchida e as palavras

  “Embalagem de recuperação” devem ser incluídas; e

  IX. para artigos explosivos da Classe 1, a quantidade líquida indicada para cada

  volume deve ser complementada com a massa explosiva líquida (ver item

  A3.1.1 da IS nº 175-001s para a definição de massa explosiva líquida (NEM) )

  contida no volume seguida pela unidade de medida. A abreviatura “NEQ”,

  “NEM” ou “NEW” pode ser indicada em associação ao valor fornecido.'
