title: 5.9.9.4(b)
text: 'b) Passo 7. Quando uma sobrembalagem for utilizada, as palavras ”Sobrembalagem

  utilizada” devem ser incluídas no formulário de declaração imediatamente após

  todas as entradas relevantes referentes aos volumes que estiverem contidos na

  sobrembalagem. Em tais casos, volumes dentro de sobrembalagens devem ser

  listados primeiro.

  I. Quando uma remessa consistir em múltiplas sobrembalagens, cada

  sobrembalagem identificada na Declaração do Expedidor para Artigos

  Perigosos deve incluir uma marca de identificação (que pode ser em formato

  alfanumérico) e a quantidade total de artigos perigosos dentro de cada

  sobrembalagem, incluindo a unidade de medida e, quando aplicável, a letra

  “G”. As marcas de identificação devem ser mostradas em conjunto com as

  palavras “Sobrembalagem utilizada”. As quantidades totais e marcas de

  identificação mostradas na Declaração do Expedidor para Artigos Perigosos

  devem corresponder às quantidades totais e às marcas de identificação

  presentes na sobrembalagem.

  II. Sobrembalagens múltiplas com conteúdo idêntico devem ser identificadas

  conforme a seguir: “Sobrembalagem utilizada x (número de sobrembalagens

  idênticas)”.

  III. Sobrembalagens múltiplas com conteúdo distinto devem ser listadas

  separadamente.

  Nota 1: quando uma sobrembalagem contiver mais de um número UN, a quantidade total de

  artigos perigosos deve ser mostrada por número UN.

  Nota 2: quando for utilizado modelo de Declaração do Expedidor para Artigos Perigosos

  diferente do apresentado nesta IS, as palavras “Sobrembalagem utilizada” aparecerãoData
  de emissão: 14 de abril de 2021.

  IS nº 175-011

  Revisão B

  após todas as informações associadas com os artigos perigosos, incluindo o número da

  instrução de embalagem e quaisquer autorizações.'
