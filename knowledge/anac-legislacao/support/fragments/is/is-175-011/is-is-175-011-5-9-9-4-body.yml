text: '5.9.9.4 Segunda Sequência - Número e Tipo de Embalagens, Quantidade de Artigos Perigosos

  Grafia alternativa, refletindo o uso comum ao redor do mundo, é aceitável para palavras

  como “fiberboard” para “fibreboard” etc. Entretanto, a grafia que figura na tabela 6-2 das

  Instruções Técnicas é a preferida.

  O número de volumes pode ser preenchido de forma numérica (ex.: 1,2, 3) ou por extenso

  (ex.: um, dois, três). O tipo de embalagem pode estar no singular ou no plural,

  independentemente do real número de volume, por exemplo “4 tambor de aço”, “1 caixas

  de papelão”.'
