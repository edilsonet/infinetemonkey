title: 5.9.9.5(a)
text: 'a) Passo 8. Número da instrução de embalagem ou da instrução de embalagem para

  quantidades limitadas (com o prefixo “Y”). Para expedições de baterias de lítio

  preparadas de acordo com a Seção IB da Instrução de Embalagem 965 ou da

  Instrução de Embalagem 968 das Instruções Técnicas, as letras “IB” devem ser

  adicionadas após o número de Instrução de Embalagem.

  Nota 1: para se qualificar como aceitável para o transporte em aeronaves de passageiros,
  o número

  da instrução de embalagem para aeronave de passageiros deve ser utilizado e o volume

  não pode conter a etiqueta “Somente em aeronave de carga”

  Nota 2: para se qualificar como aceitável para o transporte em aeronaves de carga existem
  duas

  possibilidades: na primeira, o número da instrução de embalagem para aeronave de carga

  deve ser utilizado e o volume deve conter a etiqueta “Somente em aeronave de carga”; na

  segunda, o número da instrução de embalagem para aeronave de passageiros deve ser

  utilizado e o volume não pode conter a etiqueta “Somente em aeronave de carga”.

  Nota 3: não é necessário que as letras “IB” estejam inseridas na coluna da Instrução de

  Embalagem no formato de coluna da Declaração do Expedidor para Artigos Perigosos.

  Dado que ela deve seguir o número da Instrução de Embalagem, é igualmente aceitável

  que ela seja preenchida na coluna de autorizações.'
