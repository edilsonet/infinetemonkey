title: 5.9.9.6(a)
text: 'a) Passo 9. Conforme aplicável:

  I. o número da Provisão Especial se a provisão especial for: A1, A2, A4, A5,

  A51, A78, A190, A191, A201, A202, A208, A211 ou A212;

  Nota: outras provisões especiais que tenham sido utilizadas pelo expedidor podem ser inseridas

  na coluna de autorizações.

  II. uma declaração de que o documento de Aprovação ou Autorização Especial

  foi anexado ao formulário de declaração caso a remessa seja expedida sob

  alguma autorização governamental, como, por exemplo A1 ou A2. A

  autorização deve incluir:

  • Limitação de quantidade;

  • Requisitos de embalagem;

  • Tipo de aeronave, caso aplicável; e

  • Outras informações relevantes;

  III. quando os artigos perigosos estivem em tanques portáteis, eles devem estar

  acompanhados por uma cópia do documento de aprovação da autoridadeData de emissão: 14 de
  abril de 2021.

  IS nº 175-011

  Revisão B

  competente;

  IV. quando artigos perigosos estiverem sendo expedidos em embalagens

  autorizadas pelo item D2.8 da IS nº 175-001, eles devem acompanhar uma

  cópia do documento de Aprovação da autoridade nacional competente;

  V. para substâncias explosivas onde a Instrução de Embalagem 101 das

  Instruções Técnicas tenha sido adotada pela autoridade nacional competente,

  a sigla do país para uso no tráfego internacional prescrita pela Convenção

  sobre Trânsito Viário (Convention on Road Traffic, Viena, 1968) do país em

  que a autoridade tenha jurisdição deve ser marcada no documento de

  transporte de artigos perigosos da seguinte forma: “Embalagem aprovada pela

  autoridade competente de ….”;

  VI. quando peróxidos orgânicos e substâncias autorreagentes forem transportados

  em condições em que seja exigida Aprovação (para os peróxidos orgânicos,

  ver item B5.3.2.4 da IS nº 175-001, para as substâncias autorreagentes, ver

  item B4.2.3.2.5 da IS nº 175-001), uma declaração a esse respeito deve ser

  incluída no Declaração do Expedidor para Artigos Perigosos. Uma cópia da

  Aprovação e as condições de transporte para os peróxidos orgânicos e

  substâncias autorreagentes não listados devem ser anexadas ao documento de

  transporte de artigos perigosos; e

  VII. quando uma substância for classificada de acordo com o itemB0.1.2 da IS nº

  175-001, a seguinte declaração deve ser incluída na Declaração do Expedidor

  para Artigos Perigosos: “Classificado de acordo com 2;0.1.2 das Instruções

  Técnicas”. Uma cópia da Aprovação deve acompanhar a remessa e o número

  da Aprovação devem ser inseridos na Declaração do Expedidor para Artigos

  Perigosos.

  Nota 1: para o transporte internacional, Autorizações, Aprovações e/ou Autorizações Especiais

  que devem acompanhar a Declaração do Expedidor para Artigos Perigosos e que estivem

  em outro idioma que não o Inglês devem ser traduzidas para esse idioma.

  Nota 2: o expedidor deve preencher a referência ou número de identificação da Autorização,

  Aprovação e/ou Autorização Especial antes da palavra “anexa”, quando tais documentos

  devem acompanhar a remessa.

  Nota 3: o expedidor pode inserir uma referência ou número de identificação do volume no

  formulário de declaração como o último item da quarta sequência.'
