title: ART de projeto assinada pelo responsável técnico habilitado.
text: '12. ART de projeto assinada pelo responsável técnico habilitado.


  Figura 1 - Fluxograma do processo de aprovação de embalagem UN.


  5.6 Apresentação da documentação técnica e procedimentos de ensaios

  5.6.1 O requerente só deve submeter à ANAC o requerimento para a aprovação de projeto de
  embalagem, se já tiver evidências do atendimento a todos os requisitos aplicáveis previstos
  na Subparte G do RBAC 175, nas Instruções Técnicas e nas normas complementares associadas.

  5.6.2 A embalagem já deve ter sido desenvolvida e testada internamente pelo requerente antes
  de sua apresentação à ANAC para aprovação, devendo ter apresentado resultados satisfatórios
  em todos os testes aplicáveis ao tipo de embalagem e ao tipo de artigo perigoso que será
  transportado. A empresa deve declarar que já realizou todos os ensaios conforme as Propostas
  de Ensaios apresentadas, e que o resultado de todos os ensaios foi satisfatório.

  5.6.3 O Memorial descritivo deve apresentar a descrição completa da embalagem (com dados
  suficientes para permitir, por comparação, a determinação de que a embalagem está de acordo
  com o projeto), do processo de fabricação, da especificação dos materiais, dos componentes
  e acessórios, a definição do grupo de embalagem, das classes e subdivisões de risco dos
  artigos perigosos permitidos para transporte, as dimensões, o peso de cada um dos componentes,
  a sugestão de marcação UN e qualquer outra informação relevante para a definição do projeto,
  conforme item 4.6. O documento deve ser controlado, com identificação única (numeração e
  versionamento) e aprovado pelo responsável técnico. Quando a embalagem for destinada a artigos
  da classe 1, é necessário incluir a listagem com todos os artigos que serão transportados,
  especificado a sua composição, a quantidade de material explosivo/pirotécnico, e contendo
  um identificador único (Número de Parte) que permita ao expedidor determinar, por simples
  análise visual do artigo, se ele pode ser transportado na embalagem.

  5.6.4 A Proposta de Ensaios deve conter os ensaios a serem realizados de acordo com o tipo
  de embalagem, grupo de embalagem e classe(s) de risco, mencionando a referência no regulamento,
  das normas e dos padrões aplicados, o descritivo de cada teste, cálculos dos parâmetros
  de teste quando aplicável. Além dos parâmetros de testes, deve-se incluir o procedimento
  que será utilizado para a realização de cada teste, material de envase (quando aplicável),
  tempo de condicionamento, forma de fechamento/selagem, critério de aprovação, tempo de espera
  para avaliação de determinado ensaio (ex. empilhamento), entre outros. O procedimento deve
  conter todos os detalhes necessários para que ele seja repetido sem consultar informações
  em documentos externos e, ao se repetir, o mesmo resultado seja obtido. A Proposta de Ensaios
  deve apresentar ainda o local pretendido para a realização dos ensaios, número de revisão
  e assinatura do responsável técnico.

  5.6.5 Desenhos técnicos devem ter identificação única, legenda, cabeçalho, quadro de revisão,
  tolerâncias, especificações de cotas, vistas necessárias para definição do produto e qualquer
  outra informação relevante para a definição do projeto. Os desenhos devem ser assinados
  e aprovados pelo responsável técnico.

  5.6.6 A Instrução de Uso deve conter uma descrição detalhada e ilustrada da montagem da
  embalagem, informativo com os acessórios e componentes inclusos, as condições de armazenamento
  da embalagem, validade (se aplicável), limitações e restrições de uso e aplicabilidade (condições
  de uso permitidas, incluindo a indicação dos artigos que podem ser transportados) e número
  de revisão (identificação única) e assinatura do responsável técnico.

  5.6.7 Declaração de Conformidade de Projeto. A conformidade da embalagem com o projeto deve
  ser determinada considerando todo os processo de fabricação das amostras/protótipos, ou
  seja, deve-se verificar a conformidade das matérias primas, a conformidade dos parâmetros
  dos processos produtivos (ex. sopro, estampagem, solda, conformação, rotomoldagem etc.),
  a obediência à sequência de fabricação, e também, quando aplicável, a realização de ensaios
  destrutivos para medição de dimensões ou pontos de controle críticos de projeto em embalagens
  do mesmo lote, para que se possa atestar a conformidade dos produtos. Notar que declaração
  de conformidade é diferente de inspeção de conformidade. A declaração de conformidade é
  feita no momento que a empresa fabrica e disponibiliza as amostras para ensaio. A inspeção
  de conformidade é feita antes da realização dos ensaios por uma terceira parte que irá avaliar
  e testar o projeto.

  5.6.8 Inspeção de conformidade. O procedimento para inspeção deve ser descrito no plano
  de ensaio de forma clara e objetiva, de maneira que o laboratório responsável pelos testes
  consiga executá-los sem o auxílio de qualquer uma das partes envolvidas. O número mínimo
  de amostras requeridas para os ensaios deve ser acrescido de pelo menos 3 amostras extras
  para a avaliação de conformidade e devem ser do mesmo lote de fabricação utilizado nos demais
  ensaios, sendo que a embalagem e seus acessórios precisam ser conformizados antes do acondicionamento
  ou da realização dos ensaios. Caso seja identificado alguma não conformidades nas amostras,
  o laboratório deverá interromper a realização dos ensaios ou acondicionamento das amostras
  e comunicar assim que possível o contratante e a ANAC.

  5.6.9 Envio das amostras para teste. Um número suficiente de amostras deve ser enviado para
  a realização dos ensaios e inspeções necessárias. É recomendado o envio de amostras sobressalentes
  no caso de ocorrência de qualquer eventualidade. As amostras para testes devem representar
  a situação mais crítica para o ensaio, ou seja, devem ser fabricadas na faixa de tolerância
  situada entre o limite nominal e inferior das especificações de projeto e quando aplicável,
  com o maior percentual de material reprocessado ou reciclado previsto no projeto.

  5.6.10 Um cronograma para a realização dos ensaios conforme Proposta de Ensaios deverá ser
  apresentado à ANAC após a realização da etapa de coleta de amostras. Este documento deve
  detalhar o número de dias necessários para a realizações dos ensaios, tendo em vista que
  as atividades deverão ocorrer em dia útil e serem executadas de forma sequencial no menor
  número de dias possível, de acordo com a disponibilidade técnica do laboratório, da equipe
  da ANAC e do tempo de preparação e acondicionamento necessários.'
