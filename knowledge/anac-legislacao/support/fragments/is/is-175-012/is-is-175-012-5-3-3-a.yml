section_id: 5.3.3
section_title: 'Quedas em uma superfície rígida, não-flexível e horizontal, de uma altura
  de 1,8 m:'
subsection_id: a
cite: 5.3.3(a)
title: 5.3.3(a)
text: 'a) quando a amostra tiver formato de caixa, ela deve sofrer queda em cada uma das seguintes
  orientações:

  I - paralela ao chão com a base voltada para baixo;

  II - paralela ao chão com o topo voltado para baixo;

  III - paralela ao chão com o lado maior voltado para baixo;

  IV - paralela ao chão com o lado menor voltado para baixo; e

  V - com um dos cantos voltado para baixo.'
