id: is-is-175-012-5-3-3-b
kind: is
document: is-175-012
family: '175'
section_id: 5.3.3
section_title: 'Quedas em uma superfície rígida, não-flexível e horizontal, de uma altura
  de 1,8 m:'
subsection_id: b
cite: 5.3.3(b)
title: 5.3.3(b)
text: 'b) quando a amostra tiver formato de tambor, deve sofrer queda em cada uma das seguintes
  orientações:

  I - diagonalmente sobre borda do tampo superior, com o centro de gravidade imediatamente
  acima do ponto de impacto;

  II - diagonalmente sobre a borda da base; e

  III - paralela ao chão com o lado voltado para baixo.

  NOTA 1 - cada uma das quedas acima pode ser conduzida em volumes diferentes, contanto que
  sejam idênticos.

  5.3.4 Resistir a uma força aplicada na superfície superior por um período de 24 horas, equivalente
  ao peso total de volumes idênticos empilhados a uma altura de 3 m (incluindo a amostra testada).

  5.3.5 Os testes acima descritos devem seguir os critérios estabelecidos na Parte 6, Capítulo
  4 das Instruções Técnicas, no que tange ao número de amostras, à forma de preparação e à
  execução para os testes de queda e empilhamento.

  5.3.6 Para propósitos de teste, as substâncias a serem transportadas na embalagem podem
  ser substituídas por outras substâncias, exceto em casos em que isso possa invalidar os
  resultados dos testes. Para sólidos, quando uma outra substância for utilizada, ela deve
  possuir as mesmas características físicas (massa, granulometria etc.) da substância a ser
  transportada. Nos testes de queda para líquidos, quando outra substância for utilizada,
  sua densidade relativa (massa específica) e viscosidade devem ser similares às da substância
  a ser transportada.

  5.3.7 Testes adicionais podem ser exigidos dependendo do produto a ser transportado. É dever
  do responsável pela execução dos testes verificar a necessidade, o cumprimento e aplicabilidade
  de quaisquer demonstrações adicionais que se façam necessárias.

  5.3.8 Os testes devem ser executados em laboratórios de primeira ou terceira parte que sejam
  acreditados pelo Instituto Nacional de Metrologia, Qualidade e Tecnologia - INMETRO - ou
  outro órgão governamental reconhecido para ensaios em embalagens para produtos perigosos.

  5.3.9 O documento comprobatório emitido deverá conter, dentre outras informações, a descrição
  completa da embalagem (com dados suficientes para permitir, por comparação, a determinação
  de que a embalagem está de acordo com o projeto), um número de identificação e rastreio,
  período de validade que não deverá ser superior a 3 anos e ainda dispor de uma forma para
  verificação de autenticidade. A embalagem deve ser identificada de forma a permitir sua
  rastreabilidade ao documento comprobatório dos ensaios.

  5.3.10 As embalagens deverão ser avaliadas sempre que ocorram modificações dimensionais,
  de especificação de material, de componentes ou de processos de fabricação. O laboratório
  emissor do documento comprobatório dos ensaios deverá verificar o impacto e extensão da
  modificação. Caso a alteração de algum dos componentes implique em retestagem completa ou
  parcial da embalagem ou em sua inexigibilidade, o laboratório avaliador deverá registrar
  a análise realizada e reemitir o documento comprobatório dos ensaios com as devidas alterações
  e registros.

  5.3.11 Os relatórios de testes devem cumprir com os requisitos mínimos de informações previsto
  na Parte 6, Capítulo 4, Seção 4.7 das Instruções Técnicas (Doc. 9284-AN/905).

  5.3.12 Os documentos comprobatórios dos testes das embalagens (relatórios, certificados,
  etc.) devem compor a documentação de embarque e estar prontamente disponíveis para consulta.

  5.4 Embalagem para artigos perigosos infectantes da Classe 6, Divisão 6.2, Categoria B (UN
  3373).

  5.4.1 As embalagens de fabricação nacional destinadas ao transporte aéreo de artigos perigosos
  infectantes da Classe 6, Divisão 6.2, categoria B (UN 3373) devem ser testadas e aprovadas
  segundo os critérios previstos na Instrução de Embalagem 650 das Instruções Técnicas (Doc.
  9284-AN/905) e com os procedimentos descritos nessa IS.

  5.4.2 Os testes devem ser executados em laboratórios de primeira ou terceira parte que sejam
  acreditados pelo Instituto Nacional de Metrologia, Qualidade e Tecnologia - INMETRO - ou
  outro órgão governamental reconhecido para ensaios em embalagens para produtos perigosos.

  5.4.3 O documento comprobatório emitido deverá conter, dentre outras informações, a descrição
  completa da embalagem (com dados suficientes para permitir, por comparação, a determinação
  de que a embalagem está de acordo com o projeto), um número de identificação e rastreio,
  período de validade que não deverá ser superior a 3 anos e ainda dispor de uma forma para
  verificação de autenticidade. A embalagem deve ser identificada de forma a permitir sua
  rastreabilidade ao documento comprobatório dos ensaios.

  5.4.4 As embalagens deverão ser avaliadas sempre que ocorram modificações dimensionais,
  de especificação de material, de componentes ou de processos de fabricação. O laboratório
  emissor do documento comprobatório dos ensaios deverá verificar o impacto e extensão da
  modificação. Caso a alteração de algum dos componentes implique em retestagem completa ou
  parcial da embalagem ou em sua inexigibilidade, o laboratório avaliador deverá registrar
  a análise realizada e reemitir o documento comprobatório dos ensaios com as devidas alterações
  e registros.

  5.4.5 Os documentos comprobatórios dos testes das embalagens (relatórios, certificados,
  etc.) devem compor a documentação de embarque e estar prontamente disponíveis para consulta.

  5.4.6 Os relatórios de testes devem cumprir com os requisitos mínimos de informações previsto
  na Parte 6, Capítulo 6, Seção 6.5.5 das Instruções Técnicas (Doc. 9284-AN/905).

  5.5 Embalagem com o símbolo da ONU (marcação UN).

  5.5.1 A embalagem com marcação UN deve ser testada exatamente na forma em que será utilizada
  para o transporte e deve demonstrar cumprimento com os requisitos técnicos aplicáveis, estabelecidos
  nas partes 4 e 6 das Instruções Técnicas e no RBAC 175.

  5.5.2 A embalagem importada destinada ao transporte aéreo de artigos perigosos da Classe
  1 cujo embarque tenha como origem ou destino o Brasil devem demostrar o cumprir com os testes
  previstos no RBAC 175.307(d). Os documentos comprobatórios requeridos no RBAC 175.307(e)
  devem cumprir com os requisitos mínimos de informações previsto na Parte 6, Capítulo 4,
  Seção 4.7 das Instruções Técnicas (Doc. 9284-AN/905) e Parte I, seção 10.5 do Manual de
  Testes e Critérios da ONU.

  5.5.3 O processo de aprovação de projeto de embalagem consiste na aprovação da documentação
  técnica, coleta de amostra, demonstração de cumprimento com os requisitos aplicáveis através
  de ensaios de classificação e performance e apresentação e aprovação de relatório final.'
