title: 'As etapas do processo para a aprovação de projeto de embalagem e suas modificações
  são:'
text: '5.5.4 As etapas do processo para a aprovação de projeto de embalagem e suas modificações
  são:

  I - Protocolo eletrônico do formulário de requerimento e anexos;

  II - Análise documental;

  III - Amostragem, inspeção de conformidade e agendamento de ensaios;

  IV - Execução dos ensaios requeridos;

  V - Elaboração e encaminhamento de relatório de testes pelo solicitante à ANAC; e

  VI - Emissão do certificado de aprovação de projeto após aprovação do sistema da qualidade
  da empresa conforme RBAC 175.315.

  5.5.5 Para o requerimento do serviço, os documentos listados a seguir devem ser submetidos
  via protocolo eletrônico por meio do Sistema eletrônico de Informações - SEI, utilizando
  o tipo de processo "Certificação de Produto: Embalagem para Transporte Aéreo de Artigo Perigoso
  e Congêneres":'
