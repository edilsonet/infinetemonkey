text: '5.6.11 Durante o período de realização dos ensaios, não serão permitidas alterações
  no projeto.

  5.6.12 Relatório de Ensaios. Após a conclusão dos ensaios, deverá ser elaborado um relatório
  detalhado e individualizado por modelo de embalagem com todos os ensaios e inspeções realizadas,
  com os critérios de aprovação e normas utilizadas como referência, com o local, data, número
  de controle (identificação única) e responsáveis pela condução e acompanhamento dos ensaios.
  O documento ainda deverá conter uma conclusão e ser assinado pelo responsável técnico do
  laboratório executante.

  5.6.13 Havendo reprovação em qualquer um dos ensaios aplicáveis, a embalagem será considerada
  reprovada e o ensaio encerrado. Quando o ensaio realizado conforme a Proposta de Ensaios
  apresentar resultado diferente daquele declarado pela empresa, a ANAC irá avaliar se houve
  fornecimento de informação inexata na declaração emitida pela empresa.

  5.6.14 A repetição de ensaios deverá ser necessariamente precedida de apresentação de estudo
  de causa raiz da falha, com apresentação de proposta de ação corretiva, e consequente modificação
  no projeto, que deverão ser aceitas pela ANAC.'
