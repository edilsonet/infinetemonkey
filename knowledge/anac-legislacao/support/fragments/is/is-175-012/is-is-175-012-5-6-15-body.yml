text: '5.6.15 Finalizada a etapa de ensaios, os certificados dos produtos só serão emitidos
  após a conclusão da avaliação do sistema da qualidade.

  5.7 Processo de aprovação de produção de embalagem para transporte aéreo de artigos perigosos
  com marcação UN.

  5.7.1 O requerimento para a obtenção de uma aprovação de produção de embalagens para transporte
  de produtos perigosos pelo modal aéreo, deve ser realizado via SEI - Sistema Eletrônico
  de Informação da ANAC, juntamente com a solicitação de aprovação de projeto de embalagem.
  Neste sistema o solicitante escolherá a opção: Certificação de Produto > Organizações de
  Produção > Certificação.

  5.7.2 O APÊNDICE B desta IS fornece ao requerente a relação de documentos que precisam ser
  anexadas ao processo de aprovação de produção. Em alguns casos, o processo pode ocorrer
  de forma concomitante com a aprovação de projeto de embalagens ou iniciar após a aprovação
  nos ensaios de certificação de pelo menos um dos projetos submetidos.'
