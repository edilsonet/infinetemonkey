title: O APÊNDICE C apresenta as etapas do processo de aprovação de produção.
text: '5.7.3 O APÊNDICE C apresenta as etapas do processo de aprovação de produção.

  5.8 Meios aceitáveis de cumprimento com requisitos de fabricação de embalagem.

  5.8.1 O RBAC 175.315(a) requer um documento que informe as responsabilidades atribuídas,
  a autoridade delegada e a relação funcional dos responsáveis pela gestão da qualidade tal
  documento pode ser um organograma da empresa que contenha o nome de cada responsável por
  cada processo juntamente com a descrição da responsabilidade e autoridade atribuída a cada
  um dos responsáveis. É importante que o responsável pela gestão da qualidade tenha independência
  do responsável pela fabricação para que se minimize possíveis conflitos de interesse.

  5.8.2 O RBAC 175.315(b) requer o estabelecimento de um sistema de qualidade que garanta
  que cada embalagem esteja de acordo com seu projeto aprovado e esteja em uma condição de
  utilização segura. A norma ISO 9001 estabelece um modelo de sistema de gestão da qualidade.
  O cumprimento com seus requisitos não é obrigatório, mas é uma forma aceitável de cumprir
  com grande parte dos requisitos do sistema da qualidade exigidos. No entanto, é importante
  observar que o RBAC 175.315(b) requer controles adicionais aos estabelecidos pela ABNT NBR
  ISO 9001 a saber: controle de dados de projeto, controle de recebimento de materiais e requisitos
  para inspeções e testes, descritos respectivamente nas alíneas 5.8.4(a), 5.8.4(c) e 5.8.4(e)
  desta IS.

  5.8.3 Para requerentes detentores de uma certificação ISO 9001 a ANAC pode, no momento da
  avaliação inicial do manual e dos procedimentos da qualidade, verificar apenas se existem
  procedimentos para cumprimento com as alíneas 5.8.4(a), 5.8.4(c) e 5.8.4(e) desta IS. Para
  os demais requerentes serão avaliados todos os procedimentos requeridos nos itens das subseções
  5.8 e 5.9 desta IS.'
