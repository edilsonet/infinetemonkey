text: '5.8.10 Uma aprovação de produção é válida até ser suspensa, revogada, ou até a data
  determinada pela ANAC em cada autorização.

  5.8.11 A aprovação de produção de embalagens não pode ser transferida. Ou seja, é vinculada
  ao endereço das instalações de fabricação e não pode ser transferida para outra unidade
  fabril.

  5.9 Responsabilidades inerentes a um detentor de aprovação de produção:

  5.9.1 Manter os dados da organização atualizados junto a ANAC. Isto inclui qualquer alteração
  nas responsabilidades, autoridades, organograma e endereço da empresa.'
