section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: b
cite: 5.8.4(b)
title: 5.8.4(b)
text: b) Procedimento de controle de documentos, registros, dados do sistema de qualidade
  e alterações subsequentes para assegurar que somente documentos e dados atuais, corretos
  e aprovados sejam utilizados. É importante que este procedimento preveja a comunicação prévia
  à ANAC de alterações ocorridas no sistema da qualidade relativas aos meios aceitáveis de
  cumprimento com o RBAC 175.315 descritos nas subseções 5.8 e 5.99 desta IS.
