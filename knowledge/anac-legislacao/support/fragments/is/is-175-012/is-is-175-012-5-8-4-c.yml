section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: c
cite: 5.8.4(c)
title: 5.8.4(c)
text: c) A forma de controle de recebimento que assegure que cada material a ser utilizado
  na fabricação de embalagens seja inspecionado de modo a garantir que apenas materiais que
  estejam conforme os dados do projeto sejam utilizados. Caso seja pertinente, métodos estatísticos
  estabelecidos em normas técnicas podem ser utilizados a fim de adotar métodos de inspeção
  por amostragem. Estas inspeções são necessárias para se verificar principalmente as características
  definidas em projeto consideradas chave para fabricação e uso seguro das embalagens.
