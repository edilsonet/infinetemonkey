section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: d
cite: 5.8.4(d)
title: 5.8.4(d)
text: d) O método de controle dos processos de fabricação para assegurar que cada embalagem
  aprovada seja produzida conforme os dados de projeto aprovados. É importante que seja possível
  a identificação e rastreabilidade dos materiais utilizados em cada lote de embalagem e que
  sejam estabelecidas instruções de fabricação e montagem juntamente com a especificação dos
  materiais utilizados em cada processo de fabricação de cada embalagem.
