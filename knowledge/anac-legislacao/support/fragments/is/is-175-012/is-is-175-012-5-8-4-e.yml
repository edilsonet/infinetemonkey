section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: e
cite: 5.8.4(e)
title: 5.8.4(e)
text: e) As inspeções, testes de produção e inspeções finais necessárias para garantir que
  cada embalagem fabricada está conforme os dados de projeto aprovados e cumprem com os requisitos
  de resistência estabelecidos pela ANAC conforme prevê a Parte 6, capítulo 4, item 4.1.8
  do Doc. 9284/AN905 da ICAO que dá instruções técnicas para o transporte seguro de produtos
  perigosos pelo modal aéreo.
