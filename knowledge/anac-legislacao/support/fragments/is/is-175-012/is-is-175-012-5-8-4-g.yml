title: 5.8.4(g)
text: g) A forma de identificação, registro, avaliação, segregação e disposição de materiais
  não conformes. Consideram-se parte deste controle, materiais liberados pelo sistema de qualidade
  não conforme com os dados do projeto aprovado. Para tratar destes casos, é importante que
  se descreva o procedimento para retirar estas embalagens do mercado.
