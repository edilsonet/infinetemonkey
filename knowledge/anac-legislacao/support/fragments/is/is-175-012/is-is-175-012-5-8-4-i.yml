section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: i
cite: 5.8.4(i)
title: 5.8.4(i)
text: i) Procedimento de manuseio e armazenamento de matérias primas e produtos acabados a
  fim de evitar danos e deterioração destes materiais durante o manuseio, armazenamento, a
  preservação e a expedição. Para tanto é preciso especificar as condições ambientais, como
  temperatura, umidade, entre outras, necessárias para se preservar cada tipo de material
  utilizado, além da forma de controle destas condições ambienteis.
