section_title: 'Um sistema de qualidade aceitável pela ANAC estabelece:'
subsection_id: j
cite: 5.8.4(j)
title: 5.8.4(j)
text: 'j) O planejamento, registro e realização de auditorias internas e da subsequente avaliação
  dos resultados e tomadas de ações necessárias para assegurar a manutenção e melhoria contínua
  do sistema de qualidade aprovado. É importante que se mantenha o registro das avaliações
  dos resultados das auditorias e das ações subsequentes.

  5.8.5 Um manual da qualidade que descreva o sistema da qualidade deve ser fornecido incluindo
  todos os procedimentos e meios aceitáveis mencionados na seção 5.8 desta IS.'
