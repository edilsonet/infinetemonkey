title: Antes de qualquer alteração da localização de suas instalações de fabricação é necessária
  obtenção formal de aprovação da ANAC.
text: '5.8.6 Antes de qualquer alteração da localização de suas instalações de fabricação
  é necessária obtenção formal de aprovação da ANAC.

  5.8.7 A ANAC tem a prerrogativa de realizar, a qualquer momento, inspeções e testes nas
  embalagens aprovadas. Tais inspeções e testes podem ser conduzidos ou acompanhados pela
  ANAC a fim de verificar se as embalagens produzidas continuam atendendo aos requisitos de
  projeto e de fabricação das embalagens aprovadas.

  5.8.8 A ANAC emitirá uma aprovação de produção de embalagens depois de verificar que o requerente
  cumpre com os requisitos do RBAC 175.315 e, caso pertinente, com as normas complementares.
  Esta verificação de cumprimento consiste na avaliação e aprovação do manual da qualidade,
  respectivos procedimentos e uma auditoria na empresa a fim de verificar se o sistema da
  qualidade apresentado está realmente implementado e garantindo a fabricação de embalagens
  conforme seus dados de projeto aprovados.

  5.8.9 Juntamente com a aprovação de produção de embalagens, a ANAC emitirá uma relação de
  embalagens aprovadas. Nesta relação constam o número do certificado de aprovação, o modelo
  de cada embalagem que seu detentor está autorizado a fabricar e a validade da autorização.'
