title: Manter o sistema de qualidade em conformidade com os dados e procedimentos aprovados
  pela ANAC para a produção.
text: '5.9.2 Manter o sistema de qualidade em conformidade com os dados e procedimentos aprovados
  pela ANAC para a produção.

  5.9.3 Assegurar que cada embalagem para a qual uma aprovação de produção tenha sido emitida
  está em conformidade com os dados de projeto aprovados e em condição de utilização segura.
  Para tanto, o atendimento com todos os requisitos do RBAC 175.315, juntamente com a emissão
  de uma declaração de conformidade para qualquer embalagem produzida é um meio aceitável
  de atendimento com este requisito.

  5.9.4 Marcar apropriadamente a embalagem para a qual uma aprovação de produção de embalagens
  tenha sido emitida. O meio aceito de cumprimento com este requisito é a marcação de cada
  embalagem conforme os dados de projeto aprovados.

  5.9.5 Emitir uma declaração de conformidade de fabricação da embalagem conforme projeto
  aprovado para toda embalagem produzida. Esta declaração deve ser rastreável ao lote, data
  de fabricação e data de venda das embalagens produzidas. Um modelo de declaração de conformidade
  está apresentado no apêndice F desta IS.

  5.9.6 O detentor de aprovação de produção de embalagens deve fornecer ao cliente/usuário
  a correta instrução de utilização da embalagem aprovada pela ANAC junto com a declaração
  de conformidade do produto e a cópia da aprovação da embalagem. O meio aceitável para evidenciar
  o fornecimento destes documentos aos clientes, é o preenchimento de um checklist de inspeção
  final de qualidade com a indicação de execução das inspeções de conformidade, com a indicação
  do envio da instrução de utilização da embalagem, do envio da declaração de conformidade
  da embalagem e de uma cópia da aprovação da embalagem ao comprador. Tal checklist deve ser
  assinado por pessoa membro da qualidade da empresa.

  5.9.7 O detentor de aprovação de produção de embalagens é responsável por manter o sistema
  de qualidade em conformidade com os dados e procedimentos aprovados pela ANAC e por comunicar
  qualquer mudança no sistema de qualidade que possa afetar a inspeção, a conformidade ou
  uso da embalagem. Também deve comunicar qualquer alteração no manual da qualidade e respectivos
  procedimentos aprovados que altere a forma de cumprimento com o RBAC 175.315 descritas no
  parágrafo 5.8 e subseção 5.9. A comunicação deve ser realizada previamente via SEI - Sistema
  Eletrônico de Informações da ANAC no seguinte processo: Certificação de Produto > Organizações
  de Produção > Alterações no Sistema da Qualidade.'
