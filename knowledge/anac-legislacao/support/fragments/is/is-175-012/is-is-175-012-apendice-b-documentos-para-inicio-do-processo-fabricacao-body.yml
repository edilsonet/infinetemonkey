text: 'APÊNDICE B - DOCUMENTOS PARA INÍCIO DO PROCESSO FABRICAÇÃO

  B1. O fabricante detentor de projeto ou de um contrato de licença de uso de projeto deve
  solicitar a aprovação de produção de embalagens para transporte aéreo de artigos perigosos,
  via SEI juntamente com todos os dados técnicos e cadastrais descritos a seguir:'
