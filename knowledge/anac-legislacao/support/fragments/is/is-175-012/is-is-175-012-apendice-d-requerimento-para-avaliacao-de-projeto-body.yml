  no conselho de classe)


  E-MAILS E TELEFONES PARA CONTATO​ E CORRESPONDÊNCIA


  INFORMAÇÕES BÁSICAS SOBRE O PROJETO DA EMBALAGEM​


  16.1 DESENHOS DE PROJETO

  (Informar o número, revisão e designação dos desenho de conjunto, desenho da embalagem e
  de cada um dos acessórios e componentes)

  Observação: os desenhos devem ser assinados pelo responsável técnico com o registro da referida
  ART.


  16.2 ESPECIFICAÇÃO DE MATERIAL

  (Especificar o material de cada item do conjunto - embalagens, acessórios e componentes).

  Observação: Todas as características necessárias para garantir o desempenho do projeto devem
  ser especificadas. Além disso:

  Cada item de papelão deve ter especificado, ao menos: Coluna mínima, tipo de onda e faixa
  de Cobb.


  Cada item de plástico deve ter especificado, ao menos: Resina, espessura, e tipo de solda/fechamento.


  DOCUMENTOS REQUERIDOS (documentos que devem ser anexados junto com este requerimento. Cada
  item tem que ser um documento separado)


  Memorial Descritivo;

  Procedimento detalhado de Ensaios (não é aceitável a simples menção ao requisito da norma
  aplicável, o ensaio deve ser descrito de forma que o método possa ser reproduzido);

  Desenhos técnicos e especificações;

  Instrução de Uso/Montagem;

  Declaração de conformidade de Projeto (conforme modelo);

  Relação dos materiais, componentes e equipamentos utilizados na fabricação;

  Ficha técnica de produção, com os parâmetros de processo por sopradora para embalagens plásticas
  (quando aplicável);

  Especificação de cada dispositivo, artigo ou substância passíveis de classificação na classe
  1.

  DECLARAÇÃO DE VERACIDADE DAS INFORMAÇÕES E AUTENTICIDADES DOS DOCUMENTOS APRESENTADOS

  Declaro, na qualidade de representante legal da empresa (Razão social da empresa), a veracidade
  e a integridade das informações e documentos submetidos através deste requerimento à ANAC.

  Nada mais a declarar, e ciente das responsabilidades pelas declarações prestadas, firmamos
  a presente.


  Local e data: _______________________, ______ de ______________ de 20 ___.


