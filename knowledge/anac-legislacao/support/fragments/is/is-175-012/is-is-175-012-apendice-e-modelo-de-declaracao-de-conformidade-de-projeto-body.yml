text: 'APÊNDICE E - MODELO DE DECLARAÇÃO DE CONFORMIDADE DE PROJETO


  DECLARAÇÃO DE CONFORMIDADE DE PROJETO

  À AGÊNCIA NACIONAL DE AVIAÇÃO CIVIL - ANAC

  ATESTAMOS QUE O MODELO DE EMBALAGEM “____________” ESTÁ CONFORME COM OS DADOS DE PROJETO
  ESPECIFICADOS NO DESENHOS “__”, “__” E “____”, REVISÕES (“___”, “___”, “___”, ETC.) E MEMORIAL
  DESCRITIVO Nº “___” , “VER./REV. ___”. E AINDA QUE AMOSTRAS DO LOTE “XYZ” FORAM SUBMETIDAS
  A ENSAIOS DE DESENVOLVIMENTO CONFORME PROPOSTA DE TESTE No “______” “VER./VER.____” E O
  RESULTADO DE TODOS OS ENSAIOS FOI CONFORME AO REQUERIDO NO RBAC 175, NAS INSTRUÇÕES TÉCNICAS
  PARA O TRANSPORTE SEGURO DE ARTIGOS PERIGOSOS PELO MODAL AÉREO - DOC. 9284-AN/905 E REGULAMENTAÇÃO
  COMPLEMENTAR APLICÁVEL, PODENDO O PROJETO SER APRESENTADO PARA CERTIFICAÇÃO JUNTO À ANAC.


  LOTE DO PRODUTO FABRICADO E SUBMETIDO A PRÉ-TESTE.

  MODELO DE EMBALAGEM: “___________________”


  TIPO DE MATERIAL

