  Esta declaração somente é válida para as embalagens que estiverem em conformidade com o
  projeto testado. A utilização inadequada, em desacordo com a instrução de uso, ou alteração
  não prevista de quaisquer componentes, a torna inválida.

  (PREENCHER OS CAMPOS ALTERANDO O TIPO DE MATERIAL QUANDO NECESSÁRIO)


  LOCAL E DATA:


  (INCLUIR)

