text: 'APÊNDICE F -MODELO DE DECLARAÇÃO DE CONFORMIDADE DE FABRICAÇÃO


  DECLARAÇÃO DE CONFORMIDADE DE FABRICAÇÃO


  ATESTAMOS QUE O(S) LOTE(S) DO MODELO DE EMBALAGEM “____________”, ABAIXO RELACIONADO(S)
  FOI(RAM) FABRICADO(S) DE ACORDO COM O CERTIFICADO Nº “____________” E ESTA(ÃO) CONFORME
  O REQUERIDO NO RBAC 175, NAS INSTRUÇÕES TÉCNICAS PARA O TRANSPORTE SEGURO DE ARTIGOS PERIGOSOS
  PELO MODAL AÉREO, DOC. 9284-AN/905, E REGULAMENTAÇÃO COMPLEMENTAR APLICÁVEL.


  PRODUTO FABRICADO

  MARCAÇÃO UN: “___________________”

  MODELO DE EMBALAGEM: “___________________”

  CLIENTE: “___________________”

  MATERIAL FORNECIDO

