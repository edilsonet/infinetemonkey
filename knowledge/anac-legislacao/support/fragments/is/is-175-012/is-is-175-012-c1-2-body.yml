section_title: Caso o processo de aprovação de produção ocorra de forma concomitante com o
  processo de aprovação de projeto da embalagem, e o requerente não possa apresentar todos
  os documentos do apêndice B no momento do requerimento, ele deve apresentar um plano de
  para obtenção da aprovação de produção, que contenha todos os documentos que serão entregues
  até o final do processo.
