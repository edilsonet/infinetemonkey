text: 'C1.3 Antes de passar para a próxima etapa, a ANAC/SAR/GTCO confere se o requerente
  é elegível à solicitação pretendida e se os documentos necessários foram enviados.

  C2 Análise e adequação de documentos.

  C.2.1 Os documentos enviados pelo requerente são analisados para verificar o atendimento
  a esta IS.

  C.2.2 O requerente deve corrigir eventual falha na documentação e fornecer informações adicionais
  solicitadas pela ANAC nesta etapa.

  C3 Avaliação Inicial.

  C.3.1 Após o envio e análise de todos os documentos necessários, a ANAC realiza uma auditoria
  de avaliação inicial nas instalações do requerente, para verificar a implementação do sistema
  da qualidade apresentado e a capacidade de fabricação de embalagens em conformidade com
  os dados de projeto aprovados.

  C.3.2 O requerente deve tomar as ações corretivas apropriadas para eventuais não conformidades
  identificadas pela ANAC nesta etapa.

  C4 Emissão da aprovação de produção.

  C.4.1 A conformidade do Sistema da Qualidade com esta IS é condição fundamental para a emissão
  da aprovação de produção de embalagem para transporte aéreo de artigos perigosos com marcação
  UN.

  C.5 Vigilância continuada.

  C.5.1 Concluído o processo de aprovação de produção, inicia-se a vigilância continuada realizada
  pela ANAC. Destacam-se dentre as atividades de vigilância continuada realizadas pela ANAC:'
