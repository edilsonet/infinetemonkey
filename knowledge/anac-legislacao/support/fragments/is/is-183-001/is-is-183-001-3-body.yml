text: '3. ATIVIDADE

  A Entidade Credenciada de Proficiência Linguística aplicou o Santos Dumont English Assessment
  com equipe contendo no mínimo um(a) Avaliador(a) com Experiência Linguística - English Language
  Expert (ELE), responsável pela condução da entrevista, e um(a) Avaliador(a) com Experiência
  Operacional - Subject Matter Expert (SME). A interação foi gravada em áudio e vídeo para
  fins de fiscalização do processo de exame e posterior avaliação da produção oral.


  4 . AVALIAÇÃO

  Foi realizada escuta da gravação imediatamente após a entrevista, com a coleta individual
  das evidências de nível. As habilidades avaliadas foram pronúncia, estrutura gramatical,
  vocabulário, fluência, compreensão e interações. A avaliação baseou-se nos descritores holísticos
  e na escala de níveis de proficiência linguística determinada pela OACI, que consta no Apêndice
  A do RBAC nº 61.


