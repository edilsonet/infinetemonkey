text: '4.1.9 Examinador de Proficiência Linguística da ANAC: servidor da ANAC qualificado
  para aplicar o Santos Dumont English Assessment.

  4.1.10 Santos Dumont English Assessment (SDEA): exame de proficiência linguística desenvolvido
  pela ANAC com objetivo de aferir o nível de proficiência linguística dos pilotos portadores
  de licença brasileira, de acordo com os requisitos estabelecidos no Anexo 1 da Convenção
  de Aviação Civil Internacional e no RBAC nº 61. Exame para fins específicos que avalia a
  habilidade de pilotos para usar com eficácia a língua inglesa apropriada ao contexto operacional,
  suficiente para comunicações radiotelefônicas eficientes e seguras.'
