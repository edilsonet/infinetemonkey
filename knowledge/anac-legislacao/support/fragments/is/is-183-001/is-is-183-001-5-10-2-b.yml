section_title: 'Nas fiscalizações correntes, a ANAC verificará se:'
subsection_id: b
cite: 5.10.2(b)
title: 5.10.2(b)
text: 'b) os avaliadores preencheram de maneira correta todos os dados solicitados no Relatório
  de Avaliação, tais como: CANAC do piloto, a versão utilizada, número do candidato válido,
  data e assinatura do examinador, nível final equivalente ao nível mais baixo obtido, descritores
  da Escala de Níveis da OACI correspondentes aos níveis concedidos, comentários gerais apropriados
  ao nível concedido e exemplos do desempenho do candidato em cada área avaliada;'
