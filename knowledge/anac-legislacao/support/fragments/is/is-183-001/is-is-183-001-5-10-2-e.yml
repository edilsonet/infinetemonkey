section_title: 'Nas fiscalizações correntes, a ANAC verificará se:'
subsection_id: e
cite: 5.10.2(e)
title: 5.10.2(e)
text: 'e) os avaliadores com experiência linguística e operacional estão atribuindo os níveis
  de proficiência linguística de forma apropriada, de acordo com o parágrafo 5.6.3 desta IS
  e com os Códigos de Ética e de Prática constantes do Guidelines for Interlocutor Behaviour,
  bem como com o Rating Manual, por meio da verificação da coerência dos relatórios de avaliação
  produzidos e encaminhados para a ANAC com o desempenho do candidato durante o exame, por
  meio da análise, por amostragem, das gravações do SDEA enviadas.

  5.10.3 A ANAC poderá alterar, a qualquer tempo, o nível de proficiência linguística concedido
  pelos avaliadores da unidade executiva do detentor de credenciamento de pessoa jurídica
  após a realização de fiscalizações correntes ou após a análise de recursos interpostos pelos
  candidatos.

  5.10.4 Caso a ANAC verifique que resultados concedidos pelo mesmo avaliador sejam objeto
  de um número de alterações de nível de proficiência linguística acima do desejável, este
  será convocado a comparecer à Agência, em data a ser definida, para que as deficiências
  na aplicação da Escala de Níveis da OACI sejam sanadas.

  5.10.5 Durante a realização das fiscalizações correntes bem como quando a ANAC julgar necessário,
  poderá ser solicitado o envio das gravações em vídeo de qualquer exame realizada pelo detentor
  de credenciamento de pessoa jurídica.'
