text: '5.10.7 Para a condução das vistorias, o servidor designado pela ANAC utilizará um checklist
  específico.

  5.10.8 Um Termo de Inspeção será preparado pelos servidores designados pela ANAC e será
  lido para todos os participantes durante a reunião final da inspeção, na qual devem estar
  presentes o administrador do credenciamento de pessoa jurídica e todos os demais profissionais
  especializados envolvidos nas atividades autorizadas.

  5.10.9 A ANAC é responsável por notificar o detentor de credenciamento de pessoa jurídica
  das não conformidades encontradas durante as vistorias, por meio de documento apropriado,
  definindo inclusive a necessidade de vistoria complementar. A entidade deve se comunicar
  com a ANAC no sentido de corrigir todas as não conformidades constatadas durante as vistorias
  como também solicitar uma nova vistoria, por meio de documentação formal.

  5.11 Providências administrativas

  5.11.1 A ANAC poderá, em decisão motivada, suspender temporariamente, revogar ou cassar
  o credenciamento de pessoa jurídica para aplicação do SDEA, conforme o parágrafo 183.67(c)
  do RBAC nº 183.'
