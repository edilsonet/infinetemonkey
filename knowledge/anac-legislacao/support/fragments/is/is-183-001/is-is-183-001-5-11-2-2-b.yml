section_title: 'a suspensão do credenciamento poderá ser aplicada ao detentor de credenciamento
  de pessoa física ou jurídica nos seguintes casos:'
subsection_id: b
cite: 5.11.2.2(b)
title: 5.11.2.2(b)
text: 'b) quando, mesmo após atendimento à convocação da ANAC para sanar as deficiências na
  aplicação da Escala de Níveis da OACI, resultados do mesmo avaliador forem objeto de três
  alterações de nível de proficiência linguística em dez fiscalizações correntes e/ou recursos.

  NOTA: Nesse caso, o examinador deve se submetido a um treinamento individual na ANAC.'
