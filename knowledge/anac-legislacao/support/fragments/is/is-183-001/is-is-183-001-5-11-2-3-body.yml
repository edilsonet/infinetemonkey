text: '5.11.2.3 a suspensão será aplicada por período não superior a 180 dias, podendo ser
  prorrogada uma vez por igual período;

  5.11.2.4 a suspensão será comunicada ao detentor de credenciamento de pessoa física ou jurídica
  por meio de documento oficial. Nos casos de entidades credenciadas, detentoras de certificado
  emitido pela ANAC, a suspensão também será comunicada ao setor de controle da certificação;
  e

  5.11.2.5 caso a entidade credenciada, detentora de certificado emitido pela ANAC (sob os
  RBAC nº 121, 135, 141 ou 142), seja objeto de suspensão pelo setor de controle da certificação,
  as atividades de proficiência linguística também ficarão suspensas.

  5.11.2.6 a revogação de credenciamento poderá ser aplicada a um dos entrevistadores ou avaliadores
  pertencentes à unidade executiva do detentor de credenciamento de pessoa jurídica autorizado
  pela ANAC para aplicar o SDEA nos seguintes casos:


  quando houver indícios, ainda que em processo de apuração, do descumprimento de quaisquer
  responsabilidades atribuídas aos entrevistadores ou avaliadores;


  quando o examinador aplicar SDEA mesmo sem estar cumprindo o requisito de experiência recente,
  conforme estabelecido no parágrafo 5.8.2.(k) desta IS;


  quando, após procedimento descrito no item 5.11.2.2.(b) desta IS, houver reincidência na
  alteração de nível de proficiência linguística em menos de seis meses conduzirá ao descredenciamento
  do examinador;


  quando houver atraso em mais de 30 (trinta) dias na entrega dos relatórios até que a situação
  que motivou a suspensão seja regularizada. Se forem identificadas mais de três suspensões
  no período de um ano, o examinador poderá ter seu credenciamento revogado;


  quando após envio de ofício de advertência, forem detectados erros recorrentes no preenchimento
  dos relatórios de avaliação de proficiência linguística;


  quando após envio de ofício de advertência, forem detectados problemas recorrentes nos arquivos
  de áudio ou vídeo;


  quando após envio de ofício de advertência, forem detectados atrasos recorrentes no envio
  de todo material relativo aos exames de proficiência linguística; ou


  a pedido do detentor de credenciamento de pessoa física ou jurídica, por escrito, nos casos
  de licença médica ou licença maternidade, comprovada por meio de atestado médico.


  quando o examinador incorrer em erros administrativos no preenchimento dos formulários de
  cada exame, em períodos de seis meses, que signifiquem existência de erro sistêmico


  a qualquer momento, por motivação técnica ou administrativa da ANAC não listada anteriormente,
  devidamente documentada e comprovada em processo administrativo espec&iaciacute;fico.'
