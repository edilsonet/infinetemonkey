text: '5.11.2.7 a revogação do credenciamento será efetivada por meio de Portaria emitida
  pela ANAC, publicada no D.O.U;

  5.11.2.8 a revogação será comunicada à entidade credenciada por meio de documento oficial.
  Nos casos de detentores de credenciamento de pessoa física ou jurídica, detentores de certificado
  emitido pela ANAC, a revogação também será comunicada ao setor de controle da certificação;
  e

  5.11.2.9 caso a entidade credenciada, detentora de certificado emitido pela ANAC (sob os
  RBAC nº 121, 135, 141 ou 142) seja objeto de revogação ou cassação do certificado pelo setor
  de controle da certificação, o credenciamento para exames de proficiência linguística será
  automaticamente revogado.'
