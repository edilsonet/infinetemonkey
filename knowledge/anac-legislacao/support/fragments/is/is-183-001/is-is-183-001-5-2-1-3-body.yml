text: '5.2.1.3 CTAC certificado segundo o RBAC nº 142, que esteja com seu certificado válido;

  5.2.1.4 instituição de ensino da língua inglesa que seja detentora de autorização válida
  para administração, coordenação e aplicação de pelo menos um dos testes reconhecidos internacionalmente,
  citados no subparágrafo 5.3.2.1 desta IS;

  5.2.1.5 entidade estrangeira, certificada pela autoridade de aviação civil do respectivo
  país para aplicação de exame de proficiência linguística, selecionada pela ANAC, observado
  o pressuposto do interesse público, após consulta oficial à respectiva autoridade, desde
  que esteja com seu certificado válido; e'
