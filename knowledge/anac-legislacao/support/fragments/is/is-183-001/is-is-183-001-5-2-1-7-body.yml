text: '5.2.1.7 organizações representativas do sistema de aviação civil.

  5.2.1.8 São elegíveis para o credenciamento para aplicação do SDEA as pessoas físicas que
  atendam aos parâmetros técnicos estabelecidos nas seções 5.3.2.1 e 5.3.2.2. desta IS, sejam
  formadas e treinadas recorrentemente pela ANAC, conforme estabelecido nas seções 5.4.4.2
  e 5.5 desta IS.

  NOTA: Os examinadores credenciados pessoas físicas não podem aplicar o SDEA isoladamente.
  A esses examinadores, só é permitido compor equipe de aplicação de SDEA das pessoas jurídicas
  credenciadas para este fim.5.2.2 As pessoas jurídicas candidatas ao credenciamento pela
  ANAC para realizar exames de proficiência linguística não poderão:

  indicar um piloto do quadro de tripulantes, instrutores de voo ou que ocupe um cargo gerencial/administrativo
  da própria instituição como candidato a examinador credenciado de proficiência linguística
  (no caso de instituições certificadas segundo o RBAC nº 121, 135, 141 ou 142);

  oferecer o serviço de exame de proficiência linguística para pilotos que não façam parte
  do seu quadro de tripulantes (no caso de instituições certificadas segundo o RBAC nº 121
  ou 135); ou

  indicar o administrador e/ou o sócio como um dos seus examinadores.

  5.2.3 É considerada filial a unidade executiva situada em municípios diferentes da sede
  administrativa, que atendam ao disposto nas seções 5.3 e 5.4 desta IS e cujas atividades
  sejam supervisionadas pela sede da unidade executiva credenciada.

