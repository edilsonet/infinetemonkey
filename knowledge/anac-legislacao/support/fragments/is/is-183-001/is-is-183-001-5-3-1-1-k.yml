section_title: 'uma sala destinada à aplicação do SDEA que deverá possuir:'
subsection_id: k
cite: 5.3.1.1(k)
title: 5.3.1.1(k)
text: k) uma câmera filmadora portátil tipo digital com suporte para fixação em tripé, sensor
  de imagem CMOS, gravação em cartão de memória ou disco rígido, zoom ótico e digital, visor
  LCD para prévia da imagem, foco automático, microfone embutido, saída de áudio e vídeo analógica
  com cabo incluso e conexão USB com cabo incluso, para gravação do candidato, interlocutor
  e avaliador, em vídeo, durante toda a aplicação do SDEA;
