title: 5.3.2.1(a)
text: 'a) diploma universitário (Letras - Português/Inglês) ou Certificado em TESL (CELTA
  - Universidade de Cambridge; Certificado TESOL - Trinity College of London; SIT TESOL -
  Alumni) ou mestrado ou doutorado em Linguística Aplicada ou em Avaliação de Idiomas;

  &nnbsp; b) certificado de proficiência linguística reconhecido internacionalmente, válido
  e obtido nos últimos cinco anos ou, caso obtido anteriormente, anexar comprovação de experiência
  recente no ensino e/ou testagem da língua inglesa: CPE (pontuação mínima C), CAE (pontuação
  mínima B), IELTS (pontuação mínima 7,0) - Cambridge University; TOEFL (pontuação mínima:
  paper-based: 560; computer-based: 220; internet-based: 110) - Educational Testing Service;
  ECPE (pontuação mínima: low pass) - Michigan University);'
