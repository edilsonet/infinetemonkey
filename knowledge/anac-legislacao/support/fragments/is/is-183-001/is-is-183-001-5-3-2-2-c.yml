title: 5.3.2.2(c)
text: 'c) possuir experiência internacional:

  I - para pilotos: ter composto tripulação em 50 voos internacionais, regidos pelo RBAC nº
  91, 121, 129 ou 135 e para fora da América Latina, ou ter composto tripulação em 50 voos
  de empresa aérea estrangeira, excluindo América Latina;

  II - para controladores de tráfego aéreo: experiência em órgãos ATC brasileiros que gerenciem
  tráfego aéreo internacional, com experiência mínima de três anos na Torre TWR ou APP, ou
  tráfego aéreo doméstico em outros países, exceto América Latina, incluindo TWR ou APP, e
  totalizando no mínimo dois anos de serviço nessas funções operacionais;

  5.3.3 Caso o avaliador com experiência operacional não mantiver o nível 5 quando da revalidação
  de sua averbação de proficiência linguística, ficará automaticamente desqualificado para
  aplicar o SDEA.

  5.3.6 A entidade solicitante deverá observar as restrições para indicação dos profissionais,
  que deverão ser mantidas durante toda a vigência do credenciamento:'
