text: e) instrumento de nomeação do administrador do credenciamento de pessoa jurídica que
  atuará como seu representante legal, do qual devem constar poderes para aceitar as condições
  em que é concedido o credenciamento, tratar quaisquer assuntos relativos à proficiência
  linguística e resolvê-los definitivamente, inclusive para efeito de ser demandado e receber
  citações iniciais pelo detentor de credenciamento de pessoa jurídica;
