title: 5.4.2(h)
text: 'h) para entidades estrangeiras, todos os documentos devem estar autenticados na conformidade
  da lei nacional da entidade requerente e legalizados no Consulado Brasileiro da sede respectiva,
  incluindo cópia da documentação que comprove a certificação emitida pela autoridade de aviação
  civil concedente. Com os documentos citados, deverão ser fornecidas as respectivas traduções
  em vernáculo feitas por tradutor público juramentado;

  5.4.2.2 caso o requerente ofereça ou pretenda oferecer cursos de inglês para pilotos, de
  qualquer modalidade, ele deverá, de acordo com o parágrafo 183.53(c)(15) do RBAC nº 183,
  documentar em seu manual de procedimentos a separação clara das atividades de exame e instrução,
  indicando como as atividades de instrução são realizadas dentro da sua estrutura organizacional;
