section_title: 'do Curso Inicial de Examinador Credenciado de Proficiência Linguística:'
subsection_id: c
cite: 5.4.4.2(c)
title: 5.4.4.2(c)
text: 'c) será oferecido um curso para capacitar os entrevistadores e avaliadores com experiência
  linguística (ELE) a desenvolver uma série de competências e ainda:

  I - interagir com o candidato durante o SDEA de acordo com os procedimentos e princípios
  estabelecidos pela ANAC;

  II - aplicar a Escala de Níveis da OACI de forma eficiente e justificar o julgamento sobre
  a proficiência linguística do candidato com base na mesma, fornecendo exemplos de todas
  as áreas analisadas; e

  III - fornecer feedback e relatórios para o setor responsável da ANAC.'
