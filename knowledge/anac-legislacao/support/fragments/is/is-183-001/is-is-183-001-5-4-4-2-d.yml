subsection_id: d
cite: 5.4.4.2(d)
title: 5.4.4.2(d)
text: 'd) será oferecido um curso para capacitar os avaliadores com experiência operacional
  (SME) a desenvolver uma série de competências e ainda:

  I - aplicar a Escala de Níveis da OACI de forma eficiente e justificar o julgamento sobre
  a proficiência linguística do candidato com base na mesma, fornecendo exemplos de todas
  as áreas analisadas; e

  II - fornecer feedback e relatórios para o setor responsável da ANAC.'
