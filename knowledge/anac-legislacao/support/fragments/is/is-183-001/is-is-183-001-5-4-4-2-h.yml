title: 5.4.4.2(h)
text: h) a ANAC oferecerá o Curso Inicial de Examinador Credenciado de Proficiência Linguística,
  em data e com critérios de prioridade para inscrição de candidato a examinador credenciado
  a serem divulgados em seu site, e só terá garantida a participação dos indicados, o requerente
  que já tiver cumprido com os requisitos desta IS, aplicáveis até esta fase.
