section_title: 'do Curso Inicial de Examinador Credenciado de Proficiência Linguística:'
subsection_id: i
cite: 5.4.4.2(i)
title: 5.4.4.2(i)
text: 'i) conhecimento acerca dos requisitos de proficiência linguística estabelecidos no
  Anexo 1 da Convenção de Aviação Civil Internacional e no RBAC nº 61, bem como dos procedimentos
  e orientações contidos na Instrução Suplementar correspondente (a ser comprovado durante
  a pré-avaliação); e

  ii) conhecimento acerca do DOC 9835 da OACI - Manual on the Implementation of ICAO Language
  Proficiency Requirements, dos requisitos estabelecidos no RBAC nº 183, bem como dos procedimentos
  e orientações contidos nesta Instrução Suplementar (a ser comprovado durante a pré-avaliação).'
