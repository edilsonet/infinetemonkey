text: '5.4.5.4 a CAS será avaliada conforme relatórios de avaliação emitidos de acordo com
  os modelos constantes nos Apêndices D e E desta IS;

  5.4.5.5 caso a entidade e/ ou o(s) examinador(es) indicado(s) não consiga(m) demonstrar
  o atendimento a todos os requisitos necessários em uma única inspeção, poderá ser realizada
  até uma inspeção adicional para o cumprimento das normas vigentes;

  5.4.5.6 a ANAC é responsável por notificar à entidade as não conformidades encontradas durante
  as inspeções, por meio de documento apropriado, definindo inclusive a necessidade de inspeção
  complementar. A entidade deve se comunicar com a ANAC no sentido de corrigir todas as não
  conformidades constatadas durante as inspeções como também solicitar nova inspeção, por
  meio de documentação formal; e

  5.4.5.7 o encerramento desta fase se dá com a aprovação do Manual de Procedimentos proposto
  pelo requerente e o parecer favorável ou desfavorável da ANAC ao credenciamento da entidade.'
