section_title: 'Fase 4 - inspeção inicial e capacitação em serviço (CAS):'
subsection_id: b
cite: 5.4.5(b)
title: 5.4.5(b)
text: 'b) arquivamento de registros na entidade, conforme seção 183.61 do RBAC nº 183;

  5.4.5.3 adicionalmente, por ocasião da inspeção inicial, os candidatos a examinador credenciado
  serão submetidos a um treinamento em serviço (Capacitação em Serviço - CAS), conduzido por
  servidores do setor de proficiência linguística da ANAC, durante o qual deverão demonstrar
  suas aptidões e aplicar os conhecimentos adquiridos no curso por meio da condução de pelo
  menos dois exames de proficiência linguística, considerando-se os aspectos pertinentes ao
  SDEA. O treinamento em serviço - CAS é totalmente prático, realizado em atividade real de
  avaliação. Ainda nesta etapa serão verificados os procedimentos para envio dos relatórios
  de avaliação, gravações e preenchimento do SySDEA;'
