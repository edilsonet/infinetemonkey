text: '5.4.5 Fase 4 - inspeção inicial e capacitação em serviço (CAS):

  5.4.5.1 cada requerente ao credenciamento de pessoa jurídica deverá permitir que a ANAC
  inspecione suas instalações, facilidades, equipamentos e arquivos, que devem estar disponíveis
  e em lugares de fácil acesso;

  5.4.5.2 durante a inspeção inicial, os servidores designados pela ANAC verificam se o requerente
  cumpre com todos os itens descritos no seu Manual de Procedimentos, conforme seção 183.53
  do RBAC nº 183, bem como a demonstração dos seguintes procedimentos relativos à aplicação
  do SDEA que competem ao pessoal administrativo:'
