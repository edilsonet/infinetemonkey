text: '5.4.6.3 nos casos de entidades já detentoras de certificado emitido pela ANAC, o credenciamento
  também será comunicado ao setor de controle da certificação;

  5.4.6.4 o credenciamento da entidade será concedido inicialmente em caráter provisório,
  por um período de um ano a contar da data da publicação da Portaria no DOU, a menos que
  seja suspenso ou revogado/cassado antes deste período pela ANAC. Durante este período a
  ANAC acompanhará as atividades autorizadas;

  5.4.6.5 após este período, será realizada uma inspeção para verificar se foram mantidas
  as condições que possibilitaram o credenciamento e a ANAC julgará se o detentor de credenciamento
  provisório tem condições de receber o credenciamento definitivo, que permanecerá válido
  até que seja suspenso ou revogado/cassado pela ANAC;

  5.4.6.6 a validade do credenciamento de pessoa jurídica está condicionada à manutenção do
  vínculo de pelo menos dois avaliadores, um com experiência linguística e outro com experiência
  operacional, ambos com o treinamento da ANAC em dia; e'
