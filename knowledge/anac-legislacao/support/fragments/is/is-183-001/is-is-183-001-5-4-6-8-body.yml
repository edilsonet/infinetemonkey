text: '5.4.6.8 a entidade credenciada deve ser capaz de aplicar o SDEA para verificação do
  nível 6 ICAO.

  5.4.7 A ANAC se reservará o direito de arquivar o processo de credenciamento de pessoa jurídica
  de um requerente que ficar mais de 120 dias sem atender a uma solicitação da ANAC, qualquer
  que seja a fase em que se encontrar o processo.

  5.5 Do Curso de Atualização dos Examinadores Credenciados de Proficiência Linguística

  5.5.1 Visando a atualização constante de conhecimentos e a manutenção da padronização dos
  procedimentos de exame, os examinadores credenciados deverão realizar anualmente um treinamento
  periódico, em data a ser comunicada pela ANAC.

  5.5.2 Quando a ANAC julgar necessário, outros eventos de capacitação poderão ser realizados,
  de forma individual ou com todo o time de examinadores, para dirimir dúvidas e corrigir
  deficiências na aplicação da Escala de Níveis da OACI.

  5.5.3 É obrigatória a participação de todos os examinadores nos cursos de atualização e
  demais eventos de capacitação, quando necessários, para continuarem aptos a aplicar o SDEA.

  5.7 Do Código de Ética e do Código de Prática

  5.7.1 Os exames de proficiência linguística devem ser conduzidos em conformidade com os
  Códigos de Ética e de Prática, referenciados no DOC 9835 da OACI - Manual on the Implementation
  of ICAO Language Proficiency Requirements - Ed. 2004.

  5.7.2 Com base no Código de Ética elaborado pela Associação Internacional de Teste de Idiomas
  (ILTA - International Language Testing Association, cf. Doc 9835 da OACI), a ANAC desenvolveu
  o Código de Ética dos Examinadores Credenciados de Proficiência Linguística. É um conjunto
  de princípios que serve de guia para uma boa conduta profissional, indicado para esclarecer
  como deve ser um comportamento ético satisfatório a ser praticado por todos os examinadores
  credenciados. Este código está amparado por um código de prática contido no Guidelines for
  Interlocutor Behaviour e disponibilizado aos examinadores.

  5.8 Responsabilidades

  5.8.1 O detentor de credenciamento de pessoa jurídica autorizado pela ANAC para aplicar
  o SDEA deve cumprir com as responsabilidades previstas na seção 183.57 do RBAC nº 183, e
  ainda:'
