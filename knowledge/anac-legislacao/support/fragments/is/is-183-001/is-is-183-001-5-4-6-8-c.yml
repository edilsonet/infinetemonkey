text: 'c) aplicar o exame SDEA, caso o examinador tenha sido instrutor do candidato.

  5.8.4 Qualquer dos casos identificados no parágrafo anterior ensejará o descredenciamento
  da pessoa jurídica e/ou do examinador, após apuradas as responsabilidades cabíveis.

  5.8.5 É facultado ao Examinador Credenciado de Proficiência Linguística aplicar o SDEA em
  mais de uma Entidade Credenciada de Proficiência Linguística, desde que não haja conflito
  de horários e que todos os demais requisitos desta Instrução Suplementar sejam atendidos.

  5.9 Registros

