kind: is
document: is-183-001
family: '183'
section_id: 5.4.6.8
section_title: a entidade credenciada deve ser capaz de aplicar o SDEA para verificação do
  nível 6 ICAO.
subsection_id: d
cite: 5.4.6.8(d)
title: 5.4.6.8(d)
text: d) enviar os relatórios de avaliação assinados e digitalizados em formato PDF-A, os
  formulários de solicitação de serviço digitalizados, e os arquivos de áudio dos exames,
  que devem conter a gravação completa das entrevistas no formato “mp3” e estar em bom estado
  (claramente audível), para o setor de proficiência linguística da ANAC, no prazo máximo
  de 5 (cinco) dias úteis após a realização do exame, por meio do SySDEA e do SEI. Os documentos
  arquivísticos digitais de áudio e vídeo devem ser gravados em formato de compressão que
  garanta o menor tamanho de arquivo possível, mantendo-se sua inteligibilidade, de forma
  que cada arquivo não ultrapasse o limite de 30 Mb;
