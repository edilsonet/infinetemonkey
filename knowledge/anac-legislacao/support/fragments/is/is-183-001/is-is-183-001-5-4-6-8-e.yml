cite: 5.4.6.8(e)
title: 5.4.6.8(e)
text: 'e) manter afixado em local visível e acessível ao público, a portaria de autorização
  para aplicação do exame SDEA, o quadro de endereços e contatos da ANAC e os certificados
  dos examinadores atualizados.

  5.9.2 Conforme previsto na seção 183.61 do RBAC nº 183, o detentor de credenciamento de
  pessoa jurídica deverá entregar todos os registros e dados à ANAC após a desistência ou
  cancelamento do credenciamento, incluindo os descritos no parágrafo 5.9.1 desta IS.

  5.10 Processo de fiscalização

  5.10.1 A ANAC, a seu critério, poderá a qualquer tempo e por qualquer razão, fiscalizar
  as entidades credenciadas por meio de fiscalização corrente e vistorias/inspeções, com o
  objetivo de verificar o cumprimento de todos os itens relacionados às atividades autorizadas
  ou requeridas pelo detentor de credenciamento de pessoa jurídica para aplicação do SDEA.'
