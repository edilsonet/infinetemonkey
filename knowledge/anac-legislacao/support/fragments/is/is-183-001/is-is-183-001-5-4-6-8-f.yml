section_title: a entidade credenciada deve ser capaz de aplicar o SDEA para verificação do
  nível 6 ICAO.
subsection_id: f
cite: 5.4.6.8(f)
title: 5.4.6.8(f)
text: f) notificar a ANAC, no prazo de dois dias úteis, de qualquer alteração no quadro de
  pessoal da unidade executiva, encaminhando a documentação necessária e, no caso de um dos
  entrevistadores e/ou avaliadores deixar de fazer parte deste quadro de pessoal, devolver
  todo material relativo à aplicação do SDEA sob sua cautela, devidamente lacrado, no prazo
  máximo de cinco dias úteis do desligamento do profissional; e
