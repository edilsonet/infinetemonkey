section_id: 5.4.6.8
section_title: a entidade credenciada deve ser capaz de aplicar o SDEA para verificação do
  nível 6 ICAO.
subsection_id: h
cite: 5.4.6.8(h)
title: 5.4.6.8(h)
text: h) entregar ao detentor de credenciamento de pessoa jurídica todo material relativo
  à aplicação do SDEA, devidamente lacrado, no prazo de no máximo dois dias úteis do seu afastamento
  do quadro de pessoal da unidade executiva ou do recebimento da comunicação do cancelamento
  do credenciamento;
