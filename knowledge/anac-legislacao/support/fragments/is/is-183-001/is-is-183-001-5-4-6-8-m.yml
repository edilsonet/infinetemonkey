title: 5.4.6.8(m)
text: 'm) refazer relatórios sempre que solicitado pela ANAC.

  5.8.2.1 Os entrevistadores devem, ainda, manter válido e atualizado a cada cinco anos o
  certificado de proficiência linguística reconhecido internacionalmente: CPE (pontuação mínima
  C), CAE (pontuação mínima B), IELTS (pontuação mínima 7,0) - Cambridge University; TOEFL
  (pontuação mínima: paper-based: 560; computer-based: 220; internet-based: 110) - Educational
  Testing Service; ECPE (pontuação mínima: low pass) &nndash; Michigan University).

  5.8.3 É vedado ao detentor de credenciamento de pessoa jurídica e aos entrevistadores e
  avaliadores pertencentes à unidade executiva do detentor de credenciamento de pessoa jurídica
  autorizado pela ANAC para aplicar o SDEA:'
