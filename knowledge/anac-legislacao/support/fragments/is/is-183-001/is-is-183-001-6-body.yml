title: CONCLUSÃO
text: '6. CONCLUSÃO

  Considerando a avaliação dos aspectos de pronúncia, estrutura, vocabulário, fluência, compreensão
  e interações, foram atribuídos os resultados para cada habilidade, de acordo com os critérios
  expostos no Apêndice A do RBAC N° 61. O nível de proficiência linguística final considerado
  para a averbação em licença foi o menor obtido no exame das habilidades.

  Nível final: Escolher'
