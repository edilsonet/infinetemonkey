title: 'Anexos:'
text: 'Anexos:

  Referentes ao requerente:

  1 - cópias de documentos que comprovam que a pessoa jurídica é elegível ao credenciamento,
  conforme previsto no parágrafo 5.2.1 da IS nº 183-001;

  2 - documento descrevendo a estrutura organizacional do requerente, incluindo o detalhamento
  de como a unidade executiva se insere e se relaciona na estrutura organizacional;

  3 - proposta de Manual de Procedimentos, conforme descrito na seção 183.53 do RBAC nº 183;


  Referentes ao avaliador com experiência linguística:

  4 - curriculum vitae;

  5 - diploma universitário (Letras - português/inglês) ou Certificado TESL;

  6 - certificado de proficiência linguística reconhecido internacionalmente, válido e obtido
  nos últimos cinco anos ou, caso obtido anteriormente, anexar comprovação de experiência
  recente no ensino e/ou testagem da língua inglesa;

  7 - declaração ou carteira de trabalho que comprove experiência de pelo menos dois anos
  no ensino/testagem da língua inglesa;

  8 - certificado de curso de familiarização com radiotelefonia com carga horária mínima de
  30 horas;

  9 - cópia do contrato de prestação de serviços/carteira de trabalho assinada pelo requerente;


  Referentes ao avaliador com experiência operacional:

  10 - curriculum vitae;

  11 - Número do CANAC de piloto (no mínimo, piloto comercial de avião ou helicóptero), ou
  cópia* da licença de controlador de tráfego aéreo, com averbação de proficiência linguística
  English Level 5 válida ou English Level 6;

  * A cópia da licença de controlador de tráfego aéreo pode ser substituída pelo Número da
  Licença ou CPF e o Código de Verificação para viabilizar a consulta de autenticidade na
  página do DECEA.

  12 - comprovação de experiência internacional, conforme estabelecido no parágrafo 5.3.2.2
  da IS nº 183-001;

  13 - cópia do contrato de prestação de serviço/carteira de trabalho assinada pelo requerente.


  Prezado Sr. Gerente,


  Em atenção ao disposto na IS nº 183-001, informo a Vossa Senhoria que o/a ___________________________
  (nome do requerente) tem interesse em obter o credenciamento de pessoa jurídica para aplicação
  do Santos Dumont English Assessment.

  Informo também que o/a __________________________________ (nome do requerente) tem instalações,
  recursos e pessoal suficientes para realizar as atividades para as quais o credenciamento
  é solicitado.


  Para tanto, indicamos o(s)/a(s) profissionais _______________________________ e _______________________________
  (nomes completos dos profissionais) para ser(em) capacitado(s) para atuar como avaliador
  com experiência linguística (ELE) e o(s)/a(s) profissionais _______________________________
  e _______________________________ (nomes completos dos profissionais) para ser(em) capacitado(s)
  para atuar como avaliador com experiência operacional (SME), contratados conforme o estabelecido
  nos contratos de prestação de serviços/carteiras de trabalho em anexo.


  Adicionalmente, indicamos o/a ________________________________ (nome completo do profissional),
  que ocupa o cargo de ______________________________ (nome do cargo) para ser o administrador
  do credenciamento de pessoa jurídica.


  Conforme documentação em anexo, tanto referente a essa instituição, quanto referente aos
  profissionais indicados a examinadores, informamos que possuímos experiência suficiente
  para desempenhar as atividades para as quais o credenciamento é solicitado.


  Informo ainda que esta pessoa jurídica requerente está ciente, de acordo e cumprirá com
  os procedimentos adotados por esta Agência Nacional de Aviação Civil.


  [Cidade], ____ de ________ de 20__.


  [Assinatura]

  [Cargo]'
