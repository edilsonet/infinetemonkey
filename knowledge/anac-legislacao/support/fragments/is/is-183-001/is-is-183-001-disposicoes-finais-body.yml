title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 A ANAC não se responsabilizará por nenhuma despesa dos profissionais especializados
  indicados pelo requerente ou já autorizados a aplicar o SDEA nos detentores de credenciamento
  de pessoa jurídica decorrentes de convocação da Agência para realização de quaisquer atividades
  previstas nesta IS.

  7.2 Os casos omissos serão dirimidos pela SPL.

  7.3 Esta IS entra em vigor na data de sua publicação.'
