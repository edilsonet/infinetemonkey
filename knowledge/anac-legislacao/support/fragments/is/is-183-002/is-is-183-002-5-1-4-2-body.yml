text: '5.1.4.2

  Remoção dos itens (c) e (d) sobre examinador de MMA, com readequação da numeração.

  5.1.4.4(c)(I)

  Remoção do termo "ou Relatório de Atividades do Examinador de MMA Credenciado".

  5.1.4.6(a)

  Alteração da validade de 2 para 3 anos.

  5.1.4.7(a)

  Remoção do exemplo "PCA Empregado e Examinador de MMA", com renumeração dos itens subsequentes.

  5.1.6.2(a)

  Inclusão da Área Técnica Responsável, adicionalmente ao Orientador. ​​​​​​

  5.1.7.2(l)

  Remoção do termo "ou o Relatório de Atividades do Examinador de MMA".'
