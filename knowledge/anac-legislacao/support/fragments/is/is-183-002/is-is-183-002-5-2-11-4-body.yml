text: '5.2.11.4

  Alteração da responsabilidade de submissão dos dados para o PCP e inclusão de nota detalhando
  quando aquela submissão é necessária.

  5.4.1.1(a)

  Inclusão do subitem IV com possibilidade de vínculo do PCA Empregado a fabricante de Aeronave
  Leve Esportiva. ​​​

  5.4.2.1(a)

  Adequação na forma de referência a itens de RBAC.'
