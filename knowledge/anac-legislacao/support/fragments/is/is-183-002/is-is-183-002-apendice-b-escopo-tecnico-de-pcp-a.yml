title: apendice-b-escopo-tecnico-de-pcp(a)
text: a) Inclui a asa propriamente dita, com suas nervuras, reforçadores, longarinas, bordo
  de ataque, pontos de junção e fixação; pontos de fixação de trens de pouso, de superfícies
  de comando e de aumento e controle de sustentação (tais como flapes, slats, freios aerodinâmicos,
  etc.), de atuadores de superfícies de comando e de aumento e controle de sustentação (tais
  como flapes, slats, freios aerodinâmicos, etc.), pilones, naceles e grupo motopropulsor;
  carenagem aerodinâmica; estrutura dos tanques de combustível.
