  B.15 - ENGENHARIA DE PROCESSOS DE SOFTWARE, AEH E SISTEMAS

  B.15.1 - Descrição geral

  B.15.1.1 - Aspectos de integridade de itens de software ou AEH presentes em sistemas e equipamentos
  embarcados em aeronaves e avaliação de processos de desenvolvimento aplicado a sistemas,
  incluindo avaliação específica para sistemas IMA (Integrated Modular Avionics). As atividades
  incluem substanciações analíticas e avaliações de processos, incluindo avaliação de relatórios
  de certificação e auditorias.

  B.15.1.2 - No contexto deste documento, AEH (Airborne Electronic Hardware) é um termo geral
  que abrange tanto os itens de hardware eletrônico simples (SEH) quanto os itens de hardware
  eletrônico complexos (CEH), limitado aos dispositivos eletrônicos customizados por microcodificação,
  tais como: ASIC (Application Specific Integrated Circuits), PLD (Programmable Logic Devices),
  e FPGA (Field Programmable Gate Arrays).

