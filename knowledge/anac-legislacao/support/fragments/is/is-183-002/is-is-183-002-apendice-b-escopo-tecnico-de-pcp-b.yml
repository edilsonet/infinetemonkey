text: 'b) tomadas elétricas de assentos.

  B.7.2.3 - Iluminação Externa e de cockpit: Sistemas de luzes de posição, anticolisão, inspeção
  de asa e faróis de pouso e táxi, bem como suas proteções e indicações; sistema de iluminação
  normal de cockpit, incluindo suas proteções e indicações.

  B.7.2.4 - Compatibilidade Eletromagnética: Compatibilidade eletromagnética entre os diversos
  sistemas eletroeletrônicos da aeronave, incluindo a avaliação de acoplamentos e possíveis
  interferências eletromagnéticas entre equipamentos, cablagens e antenas (por exemplo, o
  escopo dos parágrafos 25.1353(a) e 25.1431(c) do RBAC 25,).

  B.7.2.5 - Metalização Elétrica e Eletricidade Estática: Principalmente o escopo da seção
  25.899 e do parágrafo 25.1353(c) do RBAC 25.

  B.7.2.6 - Proteção de Sistemas Eletroeletrônicos contra HIRF: Proteção dos sistemas eletrônicos
  da aeronave contra efeitos adversos de campos eletromagnéticos irradiados de alta intensidade,
  por exemplo, o escopo da seção 25.1317 do RBAC 25.

  B.7.2.7 - Proteção de Sistemas Eletroeletrônicos contra Raios: Proteção dos sistemas eletroeletrônicos
  contra efeitos adversos de raios (por exemplo, o escopo da seção 25.1316 do RBAC 25).

  B.7.2.8 - Proteção de Estruturas de Aeronaves contra Raios: Trata-se de toda a proteção
  da aeronave contra efeitos adversos de raios, excetuando-se apenas a proteção de sistemas
  eletroeletrônicos (Área do item B7.2.8) e a proteção de sistemas de combustível (Área do
  item B7.2.10), tratadas por requisitos de certificação e áreas de credenciamento específicas.
  Aplica-se, por exemplo, à proteção de estruturas da aeronave e aos sistemas ou partes de
  sistemas que não sejam eletroeletrônicos. Ex.: no RBAC 25 refere-se ao escopo do requisito
  da subseção 25.581.

  B.7.2.9 - Proteção de Estruturas de Tanques e Sistemas de Combustível contra Raios: Trata-se
  da proteção do sistema de combustível (incluindo a estrutura dos tanques de combustível)
  contra fontes de ignição causadas por raios. Ex. no RBAC 25 refere-se principalmente ao
  requisito da seção 25.954, sendo atualmente aplicável também o requisito da seção 25.981(a)(3)
  referente a fontes de ignição causadas por raios.

  B.7.2.10 - EWIS

  B.7.2.11 - Especiais: Esta Área de Atuação é destinada a designações específicas deste quadro
  área função.

  B.7.2.12 - Iluminação de cabine, luzes de serviço e luzes de emergência: Sistema de iluminação
  normal e de emergência da cabine de passageiros, iluminação de compartimentos de carga e
  seus painéis de controle, bem como suas proteções e indicações.

  B.7.2.13 - Sistemas e equipamentos diversos: Trata de requisitos de certificação da subparte
  F (“Electrical System and Equipment”) que são aplicáveis a componentes elétricos dos diversos
  sistemas das aeronaves, como por exemplo, dispositivos de proteção elétrica; motores e atuadores
  elétricos; baterias dedicadas.

  B.8 - ENGENHARIA DE INTEGRAÇÃO DE SISTEMAS (NÍVEL AERONAVE)

  B.8.1 - Descrição Geral

  B.8.1.1 - Avaliação de segurança de sistemas no nível aeronave; avaliação de segurança da
  aeronave quanto ao risco de fluidos inflamáveis, falhas não contidas de rotores, fogo que
  atravessa a carcaça do motor e APU, e falhas de pneus e rodas; avaliação de sobrevivência
  dos sistemas da aeronave a ameaças físicas externas; proteção de segurança da informação
  de sistemas da aeronave (cyber security).

  B.8.2 - Áreas de Atuação

  B.8.2.1 - Desenvolvimento integrado de sistemas: avaliação integrada de segurança dos sistemas
  da aeronave incluindo atividades como: Aircraft Funcional Hazard Assessment (AFHA), Preliminary
  Aircraft Safety Assessment (PASA), Aircraft Safety Assessment (ASA), Zonal Safety Analysis
  (ZSA), Particular Risk Analysis (PRA), Common Mode Analysis (CMA).

  B.8.2.2 - Proteção de áreas com fluidos inflamáveis: avaliação da segurança da aeronave
  quanto ao risco de fogo devido à presença de fluidos inflamáveis.

  B.8.2.3 - Falhas não contidas de rotores (rotor burst): avaliação da segurança da aeronave
  quanto ao risco de falhas não contidas de rotores do motor e APU.

  B.8.2.4 - Proteção contra fogo que atravessa a carcaça do motor e APU (burnthrough): avaliação
  da segurança da aeronave quanto ao risco de fogo que atravessa a carcaça do motor e APU
  (burnthrough).

  B.8.2.5 - Falhas de pneus e rodas (tire burst, tire thread flailing, wheel rim release):
  avaliação da segurança da aeronave quanto ao risco de falhas de pneus e rodas tais como
  tire burst, tire thread flailing, e wheel rim release.

  B.8.2.6 - Sobrevivência de Sistemas (Survivability of Systems): avaliação da segurança da
  aeronave quanto ao risco de dano físico aos sistemas devido a atos de interferência ilícita.

  B.8.2.7 - Proteção e Segurança da Informação de Sistemas (Cyber Security): avaliação da
  segurança da aeronave quanto ao risco de comprometimento de sistemas eletroeletrônicos devido
  a atos de interferência ilícita.

