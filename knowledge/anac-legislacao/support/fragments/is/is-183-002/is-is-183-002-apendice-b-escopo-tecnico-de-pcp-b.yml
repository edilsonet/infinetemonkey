  B.16 - ENGENHARIA DE INTERIORES

  B.16.1 - Descrição geral

  B.16.1.1 - Arranjos de interior de aeronave: Inclui crashworthiness; flutuação e pouso forçado
  na água; perfil de tolerância humana; inflamabilidade; informações e instruções para os
  passageiros; sistemas de proteção contra fogo e equipamentos e saídas de emergência.

  B.16.2 - Áreas de Atuação

  B.16.2.1 - Inflamabilidade de Materiais Interiores: Inclui análise e acompanhamento de ensaios
  de materiais utilizados nos compartimentos de interior das aeronaves, mantas de insonorização
  e cablagem da fuselagem, bem como ensaios de contenção de fogo em lixeiras.

  B.16.2.2 - Portas, Escotilhas e Saídas de Emergência: Incluem todas as portas e acessos
  da aeronave, no que se refere aos aspectos de análise e avaliação de mecanismos de portas
  e saídas de emergência em seu arranjo, sinalização, funcionalidade e acessos.

