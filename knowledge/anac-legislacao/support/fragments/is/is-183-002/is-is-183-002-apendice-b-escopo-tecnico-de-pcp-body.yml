title: APÊNDICE B - ESCOPO TÉCNICO de PCP
text: 'APÊNDICE B - ESCOPO TÉCNICO de PCP

  B.1 - O Escopo Reconhecido de um PCP é estabelecido pela definição de Áreas de Atuação e
  de funções indicadas nos quadros do Apêndice C desta IS. Existem várias funções comuns a
  todas as especialidades descritas neste Apêndice. Dentre essas funções estão: a emissão
  de parecer de cumprimento de requisitos; o testemunho de ensaios (ou execução, no caso de
  PC como piloto de ensaios em voo), incluindo os de qualificação; e análise para aprovação
  (ou recomendando aprovação) pela ANAC de dados técnicos, de propostas de ensaio, de instruções
  para aeronavegabilidade continuada, e de informações de plano de certificação, de Manual
  de Voo, de MMEL e de Relatório de Inspeção de Tipo.

  B.2 - Este apêndice descreve todo o escopo técnico de especialidades de PCP previsto no
  RBAC 183. Cada especialidade é descrita por meio de uma:

  descrição geral da especialidade;

  descrição das Áreas de Atuação;

  descrição das funções específicas a determinada especialidade, caso existam; e

  descrição de procedimentos específicos a uma determinada especialidade, caso existam.

  B.3 - ENGENHARIA ESTRUTURAL

  B.3.1 - Descrição geral

  B.3.1.1 - Avaliação de cargas e resistência estrutural da aeronave e seus componentes, incluindo:
  aspectos estáticos e dinâmicos; falhas; fadiga e tolerância ao dano; materiais e processos
  utilizados; aeroelasticidade; itens de massa; flutuação e pouso forçado na água; peso e
  balanceamento.

  B.3.2 - Áreas de Atuação

  B.3.2.1 Estruturas - Geral'
