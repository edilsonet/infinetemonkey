text: 'c) Plano de certificação para a condução de uma demonstração de evacuação e análise
  para qualquer outra configuração diferente daquela aprovada pela evacuação demonstrada.

  B.16.2.5 -Equipamentos e Sistemas de Segurança: Incluem os aspectos de adequabilidade da
  instalação e acessibilidade para todos os equipamentos de segurança e de emergência requeridos
  e instalados.

  B.16.2.6 - Flutuabilidade e Pouso Forçado na Água: Incluem análise e avaliação das configurações
  e rotas de escape da saída de emergência para o caso de um pouso forçado na água, advinda
  das análises de flutuabilidade da aeronave; acessibilidade das saídas de emergência e correspondentes
  procedimentos para as condições de flutuação da aeronave durante um pouso forçada na água.

  B.16.2.7 - Marcas e Placares - Incluem:'
