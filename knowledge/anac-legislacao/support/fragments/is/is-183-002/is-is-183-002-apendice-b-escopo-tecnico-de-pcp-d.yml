text: 'd) Rodas, pneus e câmaras de ar.

  B.3.2.6 - Estrutura - Comandos de Voo: Aspectos estruturais referentes a todos os sistemas
  mecânicos, hidráulicos e elétricos relacionados aos comandos de voo e dispositivos de aumento
  ou controle de sustentação; e elementos estruturais como: cabos e seus acessórios (esticadores,
  polias, etc.), hastes, atuadores, motores e seus respectivos mecanismos e suportes.

  B.3.2.7 - Análise Estrutural de Mecanismos: Mecanismos aplicados aos sistemas da aeronave
  passíveis de carregamento em operação e, por conseguinte, de análise estrutural.

  B.3.2.8 - Materiais Metálicos e Processos: Inclui os aspectos de aplicação, métodos e processos
  de fabricação, de proteção contra degradação, características e comportamento físico e mecânico
  dos materiais metálicos e suas ligas, tais como ligas de alumínio, aço, titânio, bronze,
  magnésio, etc.

  B.3.2.9 - Materiais Não Metálicos Convencionais e Processos: Inclui os aspectos de aplicação,
  métodos e processos de fabricação, de proteção contra degradação, características e comportamento
  físico e mecânico dos materiais não metálicos tais como policarbonatos, acrílicos, vidro,
  silicone, borrachas, etc. e suas combinações.

  B.3.2.10 - Materiais Compostos e Processos: Inclui os aspectos de aplicação, métodos e processos
  de fabricação, de proteção contra degradação, características e comportamento físico e mecânico
  dos materiais compostos tais como fibras de reforço (vidro, carbono, aramida, etc.), matrizes
  (resinas epoxílicas, fenólicas, etc.), adesivos e suas combinações.

  B.3.2.11 - Proteção contrafogo: Caracterização de estruturas como resistentes ou a prova
  de fogo quando estas são sujeitas a condição de fogo, passíveis de carregamento em operação
  e cuja falha pode contribuir para a perda da integridade estrutural.

  B.3.2.12 - Especiais: Esta Área de Atuação é destinada a designações específicas deste quadro
  área função.

  B.4 - ENGENHARIA DE PROPULSÃO

  B.4.1 - Descrição geral

  B.4.1.1 - Grupo motopropulsor, incluindo: sua instalação e montagem, falhas, controle, e
  sistemas associados.

  B.4.2 - Áreas de Atuação

  B.4.2.1 - Grupo motopropulsor a turbina para aviões - Inclui:'
