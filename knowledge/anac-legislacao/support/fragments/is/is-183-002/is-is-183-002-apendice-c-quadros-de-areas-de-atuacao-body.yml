  Quadro C4: Profissional Credenciado em Integração de Sistemas (Nível Aeronave)

  Funções e Áreas de Atuação

  NOTA 1: São passíveis de credenciamento as áreas de atuação e funções indicadas pela letra
  "X" na tabela.

  ÁREAS DE ATUAÇÃO

  Desenvolvimento integrado de sistemas*

  Proteção de áreas com fluídos inflamáveis

  Falhas não contidas de rotores (rotorburst)

  Proteção contra fogo que atravessa a carcaça do motor e APU (burnthrough)

  Falhas de pneus e rodas (tire burst, tire thread flailing, wheel rim release)

  Proteção e Segurança da Informação de Sistemas (Cyber Security)

  Sobrevivência de Sistemas (Survivability of Systems)

