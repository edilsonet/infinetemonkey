text: 'l) aprovação no campo 3 do formulário F-400-04 (SEGVOO 001)

  D.2 - ITENS RESERVADOS À ANAC

  D.2.1 - A ANAC pode autorizar qualquer análise, inspeção e ensaio necessário para emissão
  de um certificado. A decisão de autorizar é influenciada por diversos fatores. São alguns
  dos fatores críticos: o conhecimento e experiência detidos pelo corpo técnico da ANAC e
  pelo PCP em potencial, o impacto da tarefa autorizada em termos de segurança e de sensibilidade
  frente à opinião pública. Dentro desta ótica, a ANAC geralmente reserva para si a aprovação
  dos seguintes itens:

  D.2.1.1 - Estruturas'
