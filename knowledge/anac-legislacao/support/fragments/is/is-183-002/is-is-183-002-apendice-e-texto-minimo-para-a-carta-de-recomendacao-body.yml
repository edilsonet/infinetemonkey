title: APÊNDICE E - TEXTO MÍNIMO PARA A CARTA DE RECOMENDAÇÃO
text: 'APÊNDICE E - TEXTO MÍNIMO PARA A CARTA DE RECOMENDAÇÃO


  Carta de Recomendação


  Eu, [nome completo do preposto da empresa], inscrito no CPF sob o nº [XXX.YYY.ZZZ-DV], ocupante
  do cargo [cargo do preposto da empresa] na empresa [razão social da empresa], inscrita sob
  o CNPJ nº [XX.YYY.ZZZ/WWWW-DV], recomendo o credenciamento do senhor(a) [nome completo do
  profissional candidato ao credenciamento], inscrito no CPF sob o nº [AAA.BBB.CCC-DV], como
  profissional credenciado em [tipo de credenciamento solicitado] do tipo Empregado.

  Confirmo que o(a) profissional acima citado(a) possui vínculo com a empresa desde [data
  de início do vínculo do candidato ao credenciamento com a empresa] e possui [tempo, em anos,
  de experiência na área do credenciamento solicitado] anos de experiência na área do credenciamento.

  Informo, ainda, que o(a) profissional terá acesso aos dados e documentos técnicos necessários
  para a plena realização dos serviços, bem como será concedida autonomia suficiente para
  a tomada de decisões técnicas pelo(a) profissional.


  [Local da assinatura da carta], [Data da assinatura da carta].


  [Assinatura do preposto da empresa]

  ___________________________________________________

  [Nome completo do preposto da empresa]'
