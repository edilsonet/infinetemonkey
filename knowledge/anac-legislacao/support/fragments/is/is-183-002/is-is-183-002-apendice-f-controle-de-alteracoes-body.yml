title: APÊNDICE F - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE F - CONTROLE DE ALTERAÇÕES


  ALTERAÇÕES REALIZADAS NA REVISÃO I

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  Título

  Remoção do termo "e de examinadores credenciados".

  Origem

  Alteração de SAR/SPL para SAR.

  1

  Adequação do item 1.1 e remoção do item 1.2, devido a remoção de examinadores credenciados
  de MMA do escopo da IS. Atualização da revisão na referência à IS 183-005.

  2.1

  Atualização da revisão da IS revogada.

  3.3

  Remoção da referência ao §183.11(b) do RBAC 183, bem como o texto correspondente. No item
  3.3, substituição do termo "As seções" por "Os parágrafos".

  3.4

  Remoção da referência à seção 183.25 do RBAC 183, bem como o texto correspondente.

  3.7

  Removido, com readequação da numeração dos itens subsequentes.

  3.9 (antigo 3.10)

  Ajustada a referência aos artigos do Decreto n° 10.178/2019, incluindo o artigo 6°.

  4

  Remoção das definições sobre "Autorização para realização de Exame Prático de MMA por Profissional
  Credenciado", "Exame Prático de MMA", "Examinador de MMA", "Habilitação" e "Licença", com
  readequação da numeração.

  4.3

  Incluída a função de orientação na definição de "Área Técnica Responsável"

  4.9 (antigo 4.14)

  Complementação da definição de "Monitoramento"

  4.11 (antigo 4.16)

  Atualização da definição de "Orientador", que passou a ser aplicável apenas a PCP

  5.1.2.1(g)(h)(i)

  Substituição o termo "Orientador" por "Área Técnica Responsável".

  5.1.2.1(j)

  Remoção do termo "Orientador".'
