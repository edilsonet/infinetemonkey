text: 'a) Neste caso, a critério da ANAC, e quando pleiteado pelo PCF no ato da solicitação
  de renovação, poderá ser aplicada Ordem de Avaliação (OA) para verificar a proficiência
  do profissional e, caso a OA tenha sido concluída com êxito, renovar o Credenciamento.

  Autorização de Atividades do PC - AAPC

  A AAPC é o instrumento que a ANAC utiliza para autorizar um PCF a realizar, pontualmente,
  atividades de inspeção e de certificação, de acordo com determinadas instruções, quando
  solicitado pelo requerente.

  NOTA: O disposto acima não se aplica aos PCF credenciados no grupo B.

  A AAPC é geralmente emitida utilizando-se o formulário padrão adotado pela ANAC, sendo que
  outro meio formal autorizado pela ANAC também pode ser utilizado.

  A AAPC normalmente é nominal. Em caso de PCF Empregado, a ANAC pode emitir uma AAPC à empresa
  especificando o Escopo Reconhecido, acrescentando eventuais restrições técnicas adicionais
  que garantam a especialização do PC necessária para a realização da atividade. É de responsabilidade
  da empresa a escolha de um profissional dentro desses parâmetros.

  Certificado de aeronavegabilidade para exportação

  A ANAC emite certificados para exportação de produtos que não sejam aeronave completa, ou
  para motor, hélice ou artigos, somente após o PCF do fabricante ter emitido laudo ou parecer
  quanto à observância de cumprimento com o RBAC 21, Subparte L; portanto, para um fabricante
  certificado obter aprovação para exportação desses produtos, ele deve ter, entre seus empregados,
  um PCF autorizado pela ANAC para executar tais atividades.

  Um PCF não pode emitir um Certificado de Liberação Autorizada ou Etiqueta de Aprovação de
  Aeronavegabilidade para componentes de aeronaves e peças de modificação ou substituição
  que tenham sido fabricados antes da concessão do COP para fabricação dessas peças ou componentes.

  Coordenação de programas de inspeção

  A forma de trabalho de um PCF de coordenação de programas de inspeção deve estar prevista
  em um procedimento elaborado pela empresa abrangendo aspectos tais como responsabilidades
  e formas de controle da documentação gerada pelos PCFs.

  Procedimentos internacionais para PCF

  A ANAC normalmente credencia pessoas para exercerem suas funções autorizadas em território
  brasileiro. Entretanto, a ANAC pode autorizar, caso a caso, a execução de atividades fora
  do Brasil por um PCF, quando existir a necessidade e a capacidade da ANAC para supervisionar
  o PCF.

  Comunicação às autoridades estrangeiras: Ao conduzir atividades em instalações estrangeiras
  que detêm uma aprovação de sua autoridade local, o PCF pode encontrar problemas, evidenciando
  uma possível deficiência sistêmica ou algo mais sério. Nestes casos, o PCF deve relatar
  tais problemas à ANAC, fornecendo detalhes desses problemas. Caberá à ANAC determinar se
  tais problemas devem ou não ser informados à autoridade local.

  Relatório de Atividades

  O PCF deve fornecer à ANAC relatórios periódicos ou específicos com informações relativas
  às suas atividades como PCF durante o período considerado. A renovação do Credenciamento
  depende do nível de atividade executado pelo PCF, o qual é evidenciado por meio desses relatórios.

  A critério da ANAC, os relatórios poderão simplesmente conter dados estatísticos relativos
  às atividades, tais como a quantidade de inspeções realizadas, quantidade de certificados
  e registros emitidos, nome do destinatário e país de destino, etc.

