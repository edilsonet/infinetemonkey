title: aplicabilidade(b)
text: 'b) A atividade suficiente pode ser comprovada através de, pelo menos, uma vistoria
  nos últimos dois anos anteriores à renovação, em quaisquer dos grupos de credenciamento
  do PCA. No entanto, a ANAC poderá renovar o credenciamento do PCA, mesmo que ele não tenha
  realizado vistorias nos últimos dois anos anteriores à renovação, caso haja a possibilidade
  de vistorias no futuro, como, por exemplo, nos casos de PCA que trabalhem em operadores
  aéreos.

  Procedimentos internacionais para PCA

  O PCA pode exercer atividades fora do Brasil. Na hipótese de haver acordo internacional
  com a autoridade do país que contenha procedimentos a esse respeito, tais procedimentos
  devem ser observados.

  Relatório de Atividades

  O PCA deve fornecer à ANAC relatórios periódicos ou específicos com informações relativas
  às suas atividades como PCA durante o período considerado. A renovação do Credenciamento
  depende do nível de atividade executado pelo PCA, o qual é evidenciado por meio desses relatórios.

  A critério da ANAC, os relatórios poderão conter, simplesmente, dados estatísticos relativos
  às atividades, tais como a quantidade de inspeções realizadas.'
