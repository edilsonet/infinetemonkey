text: 'Aplicabilidade

  Qualquer empregado qualificado de empresas de transporte aéreo certificadas conforme RBAC
  121 ou 135, organizações de manutenção certificadas conforme o RBAC 145 ou empresas certificadas
  fabricantes de produtos aeronáuticos é elegível ao Credenciamento como PCF, com a finalidade
  de realizar tarefas de inspeção e de certificação, de acordo com as disposições do RBAC
  183.

  NOTA: Para efeito apenas desta parte específica relativa a PCF, entende-se por fabricante
  certificado uma empresa detentora de um COP válido, incluindo suas filiais ou subsidiárias.

  Qualificação

  Além dos critérios de qualificação exigidos na Parte Comum desta IS, a fim de demonstrar
  sua Notória Especialização junto à ANAC, todo Candidato ao Credenciamento como PCF deve
