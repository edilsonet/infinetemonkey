cite: aplicabilidade(c)
title: aplicabilidade(c)
text: 'c) Para Candidatos ao Grupos E, ter no mínimo 5 (cinco) anos de experiência comprovada
  trabalhando em uma posição de responsabilidade na aprovação para retorno ao serviço ou determinando
  elegibilidade para emissão de certificado de aeronavegabilidade padrão para aeronaves do
  mesmo grupo para o qual solicita Credenciamento. A experiência deve ter sido obtida em aeronaves
  registradas no Brasil detentoras de certificado de aeronavegabilidade padrão, ou aeronaves
  envolvidas em um processo de nacionalização que resultou na emissão de certificado de aeronavegabilidade
  padrão. A experiência mais recente não pode ter sido adquirida há mais de 2 (dois) anos
  da data da solicitação do Credenciamento. São exemplos da citada experiência em posição
  de responsabilidade:

  I - especialista em regulação de aviação civil ou técnico em regulação de aviação civil
  na ANAC, com experiência, como líder de equipe, na realização de vistorias técnicas em aeronaves
  para emissão de certificado de aeronavegabilidade padrão;

  II - diretor de manutenção, responsável técnico ou inspetor chefe de um operador aéreo certificado
  conforme o RBAC 121 ou 135, ou de uma organização de manutenção certificada conforme o RBAC
  145, que emite aprovação para retorno ao serviço de aeronave completa e que tenha experiência
  em atividades relacionadas ao Escopo Reconhecido pretendido;

  III - supervisor de turno, mecânico líder ou inspetor designado por operador aéreo certificado
  conforme RBAC 121, RBAC 135, ou organização de manutenção certificada conforme RBAC 145,
  autorizado pelo detentor do certificado, que emite aprovação para retorno ao serviço de
  aeronave completa e que tenha experiência em atividades relacionadas ao Escopo Reconhecido
  pretendido;

  IV - mecânico de manutenção aeronáutica que é responsável pela emissão de Certificado de
  Verificação de Aeronavegabilidade (CVA) - ou executava Inspeção Anual de Manutenção (IAM),
  ou então executa ou supervisiona inspeções progressivas como requerido pela seção 43.15
  do RBAC 43, e que tenha experiência em atividades relacionadas ao Escopo Reconhecido pretendido.'
