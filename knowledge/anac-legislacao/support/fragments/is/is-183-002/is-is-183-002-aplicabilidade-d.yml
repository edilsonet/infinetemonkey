text: 'd) O profissional pode ser credenciado e executar as atividades fora do Brasil sob
  as seguintes condições:

  I - a ANAC poderá emitir o Credenciamento do PCF neste caso, somente quando houver condições
  adequadas para supervisionar, monitorar, orientar e acompanhar a atividade. A solicitação
  será negada se essas condições não puderem ser adequadamente mantidas;

  II - a ANAC poderá solicitar informações para a autoridade estrangeira do país pretendido
  para determinar se o Candidato não tem nenhum histórico de violações regulatórias nesse
  país. Se o Candidato tiver histórico de violação, uma avaliação deverá ser conduzida para
  verificar o tipo e as circunstâncias de cada violação, e sua atitude quanto aos regulamentos
  daquela autoridade estrangeira. A seleção e o processo de Credenciamento continuarão de
  acordo com o descrito nesta IS; e

  III - o Candidato a PCF deverá falar e escrever na língua portuguesa, de maneira que possa
  ler e entender os procedimentos da ANAC, bem como melhor se comunicar com os servidores
  da ANAC.

  Ordem de Instrução (OI)

  A Ordem de Instrução é um treinamento prático de vistoria de aeronave, que visa a capacitar
  os Candidatos a PCF quanto aos procedimentos de vistoria realizados pela ANAC. É ministrada
  por um servidor da equipe de vistorias da ANAC, técnico ou especialista em regulação, que
  possua conhecimento quanto ao tipo de vistoria.

  NOTA - O Candidato a PCF, além de deter domínio do assunto, precisa compreender o relacionamento
  dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave, bem como a
  maneira e a razão de serem estabelecidas essas exigências. Para tal, é imperativo que receba
  da ANAC as instruções necessárias quanto aos procedimentos aplicáveis.

  A Área Técnica Responsável determinará a quantidade de OIs que o Candidato deverá cumprir
  satisfatoriamente para ter o seu Credenciamento concedido.

  A OI será ministrada em aeronave operando ou que se pretenda operar conforme o RBAC 91.

  Durante a OI, o servidor da ANAC deve tomar nota dos itens avaliados e confeccionar um parecer
  recomendando ou não a continuidade da aplicação de OIs (estabelecidas no item 5.3.4.2),
  bem como a aprovação ou não do Candidato naquela OI.

  Independentemente da quantidade estabelecida de OIs, o fato de o Candidato cumpri-las não
  garante seu Credenciamento, estando condicionado ao parecer final favorável do servidor.

  Ordem de Avaliação (OA)

  A OA é um instrumento que consiste em uma avaliação prática do PCF, realizada numa vistoria
  de aeronave. É realizada por um servidor da equipe de vistorias da ANAC, técnico ou especialista
  em regulação, que possua conhecimento quanto ao tipo de vistoria.

  A OA tem como objetivo verificar se o avaliado tem domínio do assunto, compreende o relacionamento
  dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave, e as razões
  de serem estabelecidas essas exigências.

  A OA é aplicável ao PCF já credenciado. Durante a análise da renovação do Credenciamento,
  por motivações extras, como denúncias de má conduta, recorrências em erros de laudos, interpretações
  e falhas em procedimentos estabelecidos pela ANAC, ou qualquer outra motivação técnico-administrativa,
  será definido pela Área Técnica Responsável que o PCF deverá ser submetido a uma OA, a ser
  cumprida na primeira vistoria solicitada na qual o PCF atuará, dentro do prazo de validade
  do Credenciamento.

  Tendo-se como base a demanda por vistorias, caso o PCF não consiga agendar a necessária
  OA com a ANAC no prazo estabelecido, seu Credenciamento poderá ser cancelado.

  Dependendo do Escopo Reconhecido do PCF, podem ser definidas mais de uma OA, em famílias
  de aeronaves diferentes, bem como tipos diferentes de operação de aeronave.

  Caso o PCF não tenha alcançado desempenho satisfatório em duas OAs consecutivas, o Credenciamento
  é automaticamente cancelado.

  O PCF poderá realizar vistorias normalmente após cumpridas com aproveitamento as OAs necessárias.

  Supervisão de PCF

  A Área Técnica Responsável realiza Supervisão para assegurar que o PCF esteja executando
  as atividades de acordo com os regulamentos, interpretações e procedimentos apropriados.
