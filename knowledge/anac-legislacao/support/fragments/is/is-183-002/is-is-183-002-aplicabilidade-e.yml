title: aplicabilidade(e)
text: 'e) Para Candidatos aos grupos D1 e D2, ter no mínimo 2 (dois) anos de experiência comprovada
  trabalhando em uma posição de responsabilidade na aprovação para retorno ao serviço ou determinando
  elegibilidade para emissão de, respectivamente, CA de aeronave de construção amadora e CA
  de aeronave leve esportiva, ou aeronaves de categorias superiores. A experiência deve ter
  sido obtida em aeronaves registradas no Brasil, detentoras do respectivo CA, ou aeronaves
  envolvidas em um processo de nacionalização que resultou na emissão de CA de aeronave de
  construção amadora ou CA de aeronave leve esportiva, respectivamente. A experiência mais
  recente não pode ter sido adquirida há mais de 1 (um) ano da data da solicitação do Credenciamento.
  São exemplos da citada experiência em posição de responsabilidade:

  I - especialista em regulação de aviação civil ou técnico em regulação de aviação civil
  na ANAC com experiência na realização de vistorias técnicas em aeronaves para emissão de
  CA de aeronave de construção amadora, para o grupo D1, ou CA de aeronave leve esportiva,
  para o grupo D2;

  II - profissional em posição de responsabilidade pela execução de manutenção, inspeção ou
  alteração de aeronave de construção amadora, leve esportiva ou de categorias superiores,
  e pela emissão de aprovação para retorno ao serviço de aeronave completa;

  III - profissional em posição de responsabilidade pela emissão do Certificado de Verificação
  de Aeronavegabilidade (CVA) para aeronaves dessas categorias ou superiores;

  IV - engenheiro responsável pela construção de aeronaves dessas categorias.'
