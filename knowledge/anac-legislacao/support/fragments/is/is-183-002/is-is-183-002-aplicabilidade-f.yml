text: 'f) Além da experiência constante na alínea (e), para Candidatos aos grupos D1 ou D2
  também é exigido:

  I - se empregado de uma empresa, esta deve ser certificada como fabricante de produtos aeronáuticos
  e indicar formalmente o Candidato;

  II - ter habilidade para preparar registros técnicos associados com os trabalhos realizados
  e demonstrar sua aptidão para a indicação; e

  III - estar familiarizado com os procedimentos e técnicas de manutenção e inspeção de conformidade
  relacionadas com atividades de certificação de aeronavegabilidade.

  Restrições às Atividades de PCA

  O envolvimento do PCA se dá por meio do documento “Autorização para Realização de Vistoria
  de Aeronave por PCA”, que será emitido pela ANAC mediante análise da solicitação.

  O PCA poderá realizar Vistoria Técnica Inicial (VTI) ou Vistoria Técnica Especial (VTE)
  de aeronaves novas ou usadas, em suporte à emissão do Certificado de Aeronavegabilidade
  pela ANAC.

