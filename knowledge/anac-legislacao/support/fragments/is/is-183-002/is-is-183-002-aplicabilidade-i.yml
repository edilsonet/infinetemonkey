text: 'i) amostragem, de acordo com a IS 21.181-001.

  Ordem de Instrução (OI)

  A Ordem de Instrução é um treinamento prático de vistoria de aeronave que visa a capacitar
  os Candidatos a PCA quanto aos procedimentos de vistoria realizados pela ANAC. É ministrada
  por um servidor da equipe de vistorias da ANAC, técnico ou especialista em regulação, que
  possua conhecimento quanto ao tipo de vistoria.

  NOTA - O Candidato a PCA, além de deter domínio do assunto, precisa compreender o relacionamento
  dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave, bem como a
  maneira e a razão de serem estabelecidas essas exigências. Para tal, é imperativo que receba
  da ANAC as instruções necessárias quanto aos procedimentos aplicáveis.

  A Área Técnica Responsável determina a quantidade de OIs que o Candidato deverá cumprir
  satisfatoriamente para ter o seu Credenciamento concedido.

  Durante a OI, o servidor da ANAC toma nota dos itens avaliados e confecciona um parecer
  aprovando ou não o Candidato naquela OI.

  Independentemente da quantidade estabelecida de OIs, o fato de o Candidato cumpri-las não
  garante seu Credenciamento, estando condicionado ao parecer final favorável do servidor.

  Ordem de Avaliação (OA)

  A OA é um instrumento que consiste em uma avaliação prática realizada numa vistoria de aeronave.
  É ministrada por um servidor da equipe de vistorias da ANAC, técnico ou especialista em
  regulação, que possua conhecimento quanto ao tipo de vistoria.

  A OA tem como objetivo verificar se o avaliado tem domínio do assunto, compreende o relacionamento
  dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave, e as razões
  de serem estabelecidas essas exigências.

  A OA é aplicável a um PCA já credenciado. Durante a análise da renovação do Credenciamento,
  por motivações extras, como denúncias de má conduta, recorrências em erros de laudos, interpretações
  e falhas em procedimentos estabelecidos pela ANAC, ou qualquer outra motivação técnico-administrativa,
  será definido pela Área Técnica Responsável que o PCA deverá passar por uma OA, a ser cumprida
  na primeira vistoria solicitada na qual o PCA atuará, dentro do prazo de validade do Credenciamento.

  Tendo-se como base a demanda por vistorias, caso o PCA não consiga agendar a necessária
  OA com a ANAC no prazo estabelecido, seu Credenciamento poderá ser cancelado.

  Dependendo do Escopo Reconhecido do PCA, podem ser definidas mais de uma OA, em famílias
  de aeronaves diferentes, bem como tipos diferentes de operação de aeronave.

  Caso o PCA não tenha alcançado desempenho satisfatório em duas OAs consecutivas, o Credenciamento
  é automaticamente cancelado.

  O PCA poderá realizar vistorias normalmente após cumpridas com aproveitamento as OAs necessárias.

  Supervisão de PCA

  A Área Técnica Responsável realiza Supervisão para assegurar que o PCA esteja executando
  as atividades atribuídas de acordo com os apropriados regulamentos, interpretações e procedimentos.
