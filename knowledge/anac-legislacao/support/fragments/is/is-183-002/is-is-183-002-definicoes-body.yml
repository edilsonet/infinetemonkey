title: DEFINIÇÕES
text: 'DEFINIÇÕES

  No texto desta IS, os termos abaixo definidos, quando grafados com iniciais maiúsculas,
  devem ser entendidos como segue.

  Área de Atuação: Significa uma área de conhecimento especializada para a qual o Credenciamento
  é aplicável. Por exemplo, área que corresponde a um tipo de produto aeronáutico, a um sistema
  específico da aeronave, motor, hélice ou a uma porção destes.

  Área Técnica Responsável: Significa a gerência da ANAC responsável pela Orientação e Supervisão
  do Profissional Credenciado.

  Candidato: Significa a condição da Pessoa Física que tem seu Credenciamento requerido, desde
  o requerimento até o Credenciamento. O requerente de uma renovação ou extensão também é
  Candidato a esta extensão ou renovação, mesmo já sendo um Profissional Credenciado.

  Competência: Significa o conjunto de conhecimentos, habilidades e atitudes necessários a
  certo indivíduo para o desempenho satisfatório de determinada função ou atividade.

  Credenciamento: Significa o ato administrativo pelo qual uma Pessoa Física passa a ser reconhecida
  pela ANAC por sua Competência, credibilidade e Notória Especialização - após ser submetida
  a um processo de avaliação de suas qualificações - para a expedição de laudos, pareceres
  ou relatórios que demonstrem o cumprimento dos requisitos necessários à emissão de certificados
  ou atestados relativos às atividades de competência da ANAC, nos termos do §1º do art. 8º,
  da Lei nº 11.182, de 27 de setembro de 2005. Com base na definição do termo aprovado no
  RBAC 01, a ANAC reconhece o credenciado como competente para aprovação de dados técnicos
  para determinadas grandes alterações e grandes reparos dentro de um escopo estabelecido.

  NOTA: Toda vez que esta Instrução Suplementar fizer referência a aprovação de dados técnicos,
  esta aprovação está limitada a grandes alterações ou grandes reparos dentro do escopo estabelecido
  para o credenciado.

  Escopo Reconhecido: Significa o conjunto de Áreas de Atuação de um PC, com possíveis limitações,
  reconhecido pela ANAC por meio de seu Credenciamento.

  Gerente de Programa de Certificação (GPC): Significa o servidor da ANAC responsável pela
  gestão de um determinado programa de certificação de tipo de aeronave.

  Monitoramento: Significa a porção das atividades de Supervisão que abrange a análise dos
  trabalhos executados pelos Profissionais Credenciados quanto à sua precisão, quanto ao atendimento
  aos procedimentos, regulamentos, orientações e requisitos adotados pela ANAC e quanto ao
  uso de técnicas e métodos aceitáveis.

  Notória Especialização: Significa a característica do profissional cujo conceito no campo
  de sua especialidade, decorrente de desempenho anterior, estudos, experiências, publicações,
  organização ou de outros requisitos relacionados com suas atividades, permita inferir que
  o profissional é qualificado e adequado para compor o sistema de Credenciamento.

  Orientador: Significa o servidor da ANAC que atua como responsável primário pela orientação
  e Supervisão do Profissional Credenciado em Projeto - PCP. Ele pertence à Área Técnica Responsável
  e possui conhecimento técnico similar ao PCP.

  Orientação: Significa as atividades que buscam esclarecer o PC quanto à forma de condução
  das atividades dentro do seu Escopo Reconhecido, como, por exemplo, interpretação de requisitos
  e policies, procedimentos.

  Padrões Estabelecidos pela ANAC: Significam o conjunto de referências que devem ser seguidas
  pelos Profissionais Credenciados, tais como políticas, diretrizes, práticas, requisitos,
  especificações, processos, procedimentos e interpretações, aplicáveis às suas atividades.

  Profissional Credenciado (PC): Significa a Pessoa Física formalmente reconhecida pela ANAC
  por meio do Credenciamento.

  Supervisão: Significa o acompanhamento das atividades dos PCs buscando atendimento aos Padrões
  Estabelecidos pela ANAC. A Supervisão se divide em: Monitoramento, avaliação, decisão e
  retroalimentação. Abrange, dentre outras, as atividades abaixo:'
