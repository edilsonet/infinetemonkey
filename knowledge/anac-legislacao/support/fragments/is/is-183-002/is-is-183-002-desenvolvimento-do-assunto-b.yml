title: desenvolvimento-do-assunto(b)
text: 'b) Um PCP pode prestar assistência a uma organização de manutenção para desenvolver
  uma especificação de processo para um reparo em particular. Entretanto, o PCP somente pode
  emitir laudo ou parecer sobre resultados de ensaio e substanciação de cumprimento necessários
  para demonstrar que o reparo, feito de acordo com a especificação de processo, atende aos
  requisitos aplicáveis. Um PCP não pode emitir laudo ou parecer sobre especificações de processo
  genéricas, ou seja, sem citação explícita dos requisitos analisados. O PCP deve levar em
  consideração que existem muitos processos genéricos que já são aceitos pela indústria, ou
  estão listados nas Advisory Circulars AC 43.13-1 e AC 43.13-2, ambas publicadas pela Federal
  Aviation Administration - FAA.

  Extensão de vida limite e casos especiais: Um PCP deve contatar a ANAC para obter orientação
  apropriada relacionada com situações diferentes de um reparo completo, tal como um reparo
  estrutural temporário ou limitado no tempo. Sem coordenação prévia com a ANAC, o PCP não
  pode emitir laudo ou parecer para extensões de limites estabelecidos.

  Dados para reparo, modificação ou alteração em aeronave estrangeira: A autoridade estrangeira
  do país de registro da aeronave é a responsável por aprovar os dados relativos a reparo,
  modificação e alteração. A ANAC pode permitir que o PCP emita laudo ou parecer de dados
  para uma aeronave registrada no exterior de acordo com os seguintes critérios:'
