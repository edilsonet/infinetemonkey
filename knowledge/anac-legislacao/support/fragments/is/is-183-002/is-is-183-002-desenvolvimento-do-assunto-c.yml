text: 'c) O PCP enviará o formulário F-101-06:

  I - Quando a ANAC reconhecer o formulário F-101-06 emitido pelo PCP como dado técnico aprovado,
  nos termos do item 5.2.11.5(b), ao proprietário, operador ou organização de manutenção para
  anexação aos registros da alteração ou reparo; ou

  II - Nos demais casos, ao requerente para que seja submetido à ANAC como parte dos documentos
  previstos no RBAC 21 para emissão de aprovações de projeto.

  Escopo Técnico do PCP

  As atividades que o PCP executa somente são aceitas pela ANAC se realizadas dentro de seu
  Escopo Reconhecido e conforme descrito a seguir.

  O escopo técnico para um PCP em quaisquer das especialidades previstas no RBAC 183 está
  detalhado no Apêndice B desta IS. O Escopo Reconhecido é definido no ofício de Credenciamento
  e replicado em página específica no sítio da ANAC na internet.

  Um PCP Empregado pode exercer sua função em níveis administrativos diferentes, dependendo
  do acordado entre a ANAC e a empresa onde trabalha. Em alguns casos, um PCP pessoalmente
  pode avaliar e emitir laudos ou pareceres de dados técnicos. Em outros casos, um PCP pode
  assegurar a avaliação apropriada de dados técnicos gerados por outras pessoas, aproveitando
  a estrutura da empresa e, então, emitirá laudos ou pareceres sobre esses dados atestando
  que demonstram cumprimento dos requisitos aplicáveis.

  De qualquer forma, é importante ressaltar que o PCP deve possuir condições de manter o mais
  alto nível de objetividade e independência, dispondo de tempo adequado para desempenhar
  suas atividades. O PCP deve assegurar, por meio de sua experiência e de sua capacidade de
  avaliação de engenharia, que o projeto de uma aeronave e seus componentes, incluindo eventuais
  modificações, alterações ou reparos, cumpre os RBACs aplicáveis.

  O PCP deve sempre executar suas atividades de acordo com os procedimentos aplicáveis.

  Limitações ao Escopo Reconhecido do PCP

  São passíveis de Credenciamento as funções e Áreas de Atuação indicadas nas intersecções
  assinaladas nos quadros constantes do Apêndice C desta IS. O PCP somente pode avaliar o
  cumprimento de requisitos nas funções e Áreas de Atuação para as quais ele foi credenciado.
  Uma função se aplica às atividades envolvidas na avaliação de cumprimento de requisitos
  de uma dada Área de Atuação.

  Uma pessoa credenciada para trabalhos específicos pode, entretanto, estar sujeita a algumas
  limitações estabelecidas. Um Credenciamento pode, por exemplo, limitar a atuação do PCP
