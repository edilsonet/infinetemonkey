title: desenvolvimento-do-assunto(e)
text: 'e) Averiguar as circunstâncias trazidas pelo PC que atentem à integridade da atuação
  do Profissional, adotando as providências necessárias para tratar os efeitos desses cenários.

  NOTA: A figura do orientador é aplicável somente para PCP. Para os demais PC, as responsabilidades
  do orientador são desempenhadas pela Área Técnica Responsável, conforme seção 5.1.2.2.

  Comissão de Avaliação: A Comissão de Avaliação, caso seja demandado pela Área Técnica Responsável,
  compara as qualificações do Candidato aos critérios de Credenciamento e determina o indeferimento
  ou o Credenciamento e o Escopo Reconhecido.

  Comissão de Apelação: Quando convocada pela autoridade competente, a Comissão de Apelação
  emite parecer sobre recurso interposto por um Candidato face a uma decisão da ANAC relativa
  a credenciamento.

  Qualificação

  A seguir estão descritas as qualificações necessárias a qualquer Candidato a Profissional
  Credenciado. O atendimento aos critérios de qualificação possibilita o reconhecimento pela
  ANAC da competência e da Notória Especialização do Candidato. Ressalta-se que, de acordo
  com o tipo de credenciamento, qualificações adicionais são requeridas, conforme constam
  nas seções específicas sobre cada tipo.

  A ANAC reconhece a Competência do Candidato se este possuir, além dos conhecimentos específicos,
  habilidades e atitudes que o recomendem para o Credenciamento, tais como: capacidade de
  trabalhar em equipe, atitude cooperativa, honestidade, sólidos critérios de julgamento,
  respeito, confiança, ética profissional, racionalidade de julgamento, uma reputação de alto
  grau de integridade (junto ao mercado de aviação, profissionais da área e à comunidade em
  geral); bem como possuir conhecimento satisfatório, teórico e prático, dos regulamentos,
  procedimentos e legislação aplicáveis às atividades para as quais o Credenciamento é solicitado.
  No sentido de avaliar adequadamente o cumprimento deste requisito, a ANAC se reserva o direito
  de solicitar ao Candidato, ou a terceiros, dados e informações que julgar necessários.

  Para que seja possível avaliar o previsto no item 5.1.3.2, o Candidato deve ter trabalhado
  em contato direto com a ANAC em trabalhos ou atividades, nas Áreas de Atuação para as quais
  solicita Credenciamento, por tempo suficiente para que a ANAC possa avaliar e reconhecer
  a Competência do Candidato, bem como melhor avaliar a sua Notória Especialização. Normalmente,
  considera-se que esse tempo mínimo de contato direto com a ANAC seja de um ano. Alternativamente,
  a critério da ANAC, esse contato pode ser substituído, total ou parcialmente, por recomendações
  de pessoas de referência (por exemplo, ex-servidores da ANAC ou outros Profissionais Credenciados),
  ou mesmo por uma avaliação do candidato, realizada pessoalmente pela ANAC.

  Os requisitos de tempo de experiência solicitados nas seções específicas devem ser demonstrados
  mediante a apresentação dos documentos originais ou suas cópias simples. Os documentos podem
  ser: publicações em diário oficial, anotações em carteira de trabalho ou declaração de empresa
  ou órgão público, contendo cargo e funções exercidas pelo Candidato. No caso de a declaração
  ser proveniente de empresa privada, deverá ser assinada pelo superior imediato do Candidato,
  ou pelo setor de Recursos Humanos ou por administrador legalmente constituído.

  Devido ao caráter internacional da Aviação Civil, os Candidatos deverão ter capacidade de
  ler e entender documentos em inglês relacionados com as atividades pleiteadas no Credenciamento.

  No caso de Profissional Credenciado com vínculo empregatício com a empresa para a qual poderá
  atuar como PC, deverá ser apresentado documento comprobatório deste vínculo.

  Credenciamento

  Seguem regras gerais sobre o Credenciamento inicial e renovação.'
