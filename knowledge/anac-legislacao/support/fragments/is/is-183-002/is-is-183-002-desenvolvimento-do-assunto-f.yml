cite: desenvolvimento-do-assunto(f)
title: desenvolvimento-do-assunto(f)
text: 'f) Um PCP deve alertar o GPC e a Área Técnica Responsável sobre eventuais dados relevantes
  que não tenha analisado, a fim de assegurar uma investigação completa do cumprimento de
  todos os requisitos pertinentes.

  Dados de ruído: O PCP de Acústica somente pode emitir laudos ou pareceres sobre páginas,
  ou outra mídia, de manual de voo e suplementos, quando relacionados ao cumprimento das seções
  36.1581 e 36.1583 do RBAC 36. O PCP de Acústica deve analisar os dados pertinentes de nível
  de ruído da aeronave constantes em todos os novos manuais de voo e revisões aos manuais
  de voo existentes, e em marcas e placas, antes de submetê-los à aprovação da ANAC. O PCP
  de Acústica deve utilizar o formulário F-101-06, mencionando os parágrafos específicos do
  RBAC 36, Subparte O.

  Proposta de Ensaio: O PCP pode emitir laudos ou pareceres sobre propostas de ensaio que
  não envolvam métodos ou tecnologias novas ou não convencionais. Porém, em situações específicas,
  a ANAC pode definir o envolvimento do PCP também nesses casos. A ANAC sempre será a responsável
  pela aprovação ou aceitação desses documentos.

  Testemunho de ensaio: A atuação do PCP no testemunho de ensaio será definida pela ANAC ou
  no documento que estabelece o nível de envolvimento da Agência ou em uma AAPC. O PCP deve
  trabalhar sempre em coordenação com a ANAC. Antes de testemunhar o ensaio, o PCP deve verificar
  se as inspeções de conformidade da ANAC, se necessárias, foram realizadas, se o artigo de
  ensaio está em conformidade, e se todas as condições insatisfatórias receberam disposição.'
