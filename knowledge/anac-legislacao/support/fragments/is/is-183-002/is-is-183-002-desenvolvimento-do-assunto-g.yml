text: 'g) Premissa VII: O cancelamento do Credenciamento ocorrerá quando a ANAC identificar
  alguma das possíveis causas previstas. O Profissional Credenciado está ciente de que, como
  o Credenciamento é uma permissão e não um direito, a ANAC tem a prerrogativa de cancelar
  o Credenciamento conforme o parágrafo 183.15(b) do RBAC 183.

  Papéis e Responsabilidades

  Profissional Credenciado: Os seguintes aspectos devem ser observados pelo Profissional Credenciado
  em sua atuação:'
