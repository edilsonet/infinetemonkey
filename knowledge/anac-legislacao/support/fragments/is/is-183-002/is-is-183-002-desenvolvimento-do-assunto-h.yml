title: desenvolvimento-do-assunto(h)
text: 'h) Participação em treinamentos da ANAC: qualquer seminário, curso, workshop, palestra
  ou evento similar, organizado pela ANAC, relacionado com seu Escopo Reconhecido, atendido
  pelo PCP durante o período de validade de seu Credenciamento.

  Além do Relatório de Interação PCP/ANAC, o formulário F-101-06, ou qualquer outro documento
  emitido pelo PCP, pode ser utilizado para fins de Supervisão. Com esse objetivo, o Orientador
  pode requerer ao PCP o envio de tais documentos.

  A Área Técnica Responsável poderá, a seu critério, aumentar o nível de supervisão do PCP
  Autônomo que preste serviços para uma empresa com a qual possua vínculo estatutário (proprietário,
  diretor, administrador, etc.).

  Condições para Atuação do PCP

  Considera-se que o PCP está autorizado a executar suas atividades em uma das seguintes condições:'
