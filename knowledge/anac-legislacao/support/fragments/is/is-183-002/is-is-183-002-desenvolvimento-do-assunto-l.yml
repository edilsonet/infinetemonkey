title: desenvolvimento-do-assunto(l)
text: l) Quando um PC, ou uma empresa com a qual possui vínculo empregatício, não submeter
  o Relatório de Interação PCP/ANAC, o Relatório de Atividades do PCF ou o Relatório de Atividades
  do PCA preenchido, dentro do prazo estabelecido para renovação, conforme previsto no parágrafo
  5.1.4.4.
