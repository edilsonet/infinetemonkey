title: desenvolvimento-do-assunto(m)
text: m) Exceto se de outra forma autorizado pela ANAC, o PC não deve emitir laudos, pareceres
  ou relatórios sobre dados de demonstração de cumprimento de requisitos ou aprovação de dados
  técnicos dos quais ele tenha sido autor ou coautor. No entanto, o PC pode ter trabalhado
  em conjunto com indivíduos que prepararam tais dados e ainda assim emitir esses documentos.
