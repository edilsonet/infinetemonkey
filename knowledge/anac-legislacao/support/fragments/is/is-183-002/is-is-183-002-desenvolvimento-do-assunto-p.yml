title: desenvolvimento-do-assunto(p)
text: 'p) Alguma outra decisão motivada da ANAC, para preservar o interesse público.

  Notificação do cancelamento: A ANAC enviará notificação escrita ao PC, se autônomo, ou à
  empresa, se for PC empregado, indicando claramente as razões para cancelamento do Credenciamento.

  Ações de reconsideração: Os procedimentos de pedidos de reconsideração contra o cancelamento
  aplicam-se às seguintes razões de cancelamento: alíneas (e), (f), (g), (h), (i), (k) do
  parágrafo 5.1.7.2.

  A reconsideração não está sempre disponível:'
