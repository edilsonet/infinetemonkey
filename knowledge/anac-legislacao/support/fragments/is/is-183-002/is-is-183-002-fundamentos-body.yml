title: FUNDAMENTOS
text: 'FUNDAMENTOS

  O art. 8º da Lei nº 11.182, de 27 de setembro de 2005, em seu parágrafo 1º, permite o uso
  do credenciamento de pessoas de notória especialização para a expedição de laudos, pareceres
  e relatórios que demonstrem o cumprimento dos requisitos necessários à emissão de certificados
  ou atestados relativos às atividades de competência da ANAC.

  A seção 183.1 do RBAC 183 define, como objetivo do regulamento, especificar os requisitos
  para o credenciamento de pessoas.

  Os parágrafos 183.11(c)(1), 183.11(c)(2) e 183.11(e) do RBAC 183 estabelecem, respectivamente,
  que a ANAC poderá credenciar profissional qualificado em projeto, profissional qualificado
  em fabricação e profissional qualificado em aeronavegabilidade.

  As seções 183.29, 183.31 e 183.33 do RBAC 183 trazem, respectivamente, o escopo das atuações
  dos profissionais credenciados em projeto, em fabricação e em aeronavegabilidade.

  A Resolução ANAC nº 30/2008, em seu artigo 14, estabelece que a Instrução Suplementar (IS)
  é norma de caráter geral, que objetiva esclarecer, detalhar e orientar a aplicação de requisito
  previsto em RBAC.

  O parágrafo 1º do mesmo artigo determina que, para demonstrar o cumprimento de requisito
  previsto em RBAC, o administrado poderá adotar os meios e procedimentos previamente especificados
  em IS ou apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa da ANAC. O meio ou procedimento alternativo
  deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável
  ou concretizar o objetivo do procedimento normatizado em IS.

  O RBAC 01 define o termo “aprovado” como sendo aprovado pela ANAC ou por qualquer pessoa
  cuja competência de aprovação a ANAC reconheça no assunto em questão, incluindo outras autoridades
  de aviação civil.

  A Lei Federal nº 13.874 de 20 de setembro de 2019 institui a Declaração de Direitos de Liberdade
  Econômica. O art. 3º da Lei 13.874/2019 declara que é direito de toda pessoa, natural ou
  jurídica, desenvolver atividade econômica de baixo risco, para a qual se valha exclusivamente
  de propriedade privada própria ou de terceiros consensuais, sem a necessidade de quaisquer
  atos públicos de liberação da atividade econômica.

  O Decreto nº 10.178 de 18 de dezembro de 2019 regulamenta dispositivos da Lei nº 13.874,
  de 20 de setembro de 2019, para dispor sobre os critérios e os procedimentos para a classificação
  de risco de atividade econômica. Os art. 3º a 6° determinam que o órgão deve classificar
  o risco da atividade econômica através da complexidade, dimensão e outras características
  técnicas considerando a probabilidade de ocorrência de eventos danosos, podendo se utilizar
  de alguns instrumentos para redução do risco da atividade econômica tais como laudos de
  profissionais habilitados acerca do cumprimento dos requisitos técnicos ou legais.'
