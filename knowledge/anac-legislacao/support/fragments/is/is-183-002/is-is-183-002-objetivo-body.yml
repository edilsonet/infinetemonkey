title: OBJETIVO
text: 'OBJETIVO

  Fornecer meio de cumprimento aos requisitos constantes no Regulamento Brasileiro da Aviação
  Civil - RBAC 183 relativos ao credenciamento de pessoas físicas como profissionais credenciados
  em projeto (PCP), profissionais credenciados em fabricação (PCF) e profissionais credenciados
  em aeronavegabilidade (PCA), exceto para vistoria para emissão de certificado de aeronavegabilidade
  padrão por PCA, que consta na IS n° 183-005B ou revisão posterior.'
