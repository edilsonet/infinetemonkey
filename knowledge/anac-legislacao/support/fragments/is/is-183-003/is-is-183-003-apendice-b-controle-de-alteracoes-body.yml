text: 'APÊNDICE b - controle de alterações

  REVISÃO C

  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  5.9

  Substituição da exigência de autorização prévia para realização de exame por simples notificação
  de sua execução.

  5.10

  Remoção da obrigatoriedade de filmagem do exame, substituída por registro em áudio e imagens
  (fotografias ou vídeo).'
