title: DEFINIÇÕES
text: 'DEFINIÇÕES

  Para os efeitos desta IS, são válidas as definições listadas nas:

  seção 01.1 do RBAC nº 01; e

  seção 65.2 do RBAC nº 65.

  Além disso, são válidas as seguintes definições:

  Credenciamento: Significa o ato administrativo pelo qual uma Pessoa Física passa a ser reconhecida
  pela Anac por sua Competência, Credibilidade e Notória Especialização - após ser submetida
  a um processo de avaliação de suas qualificações - para a expedição de laudos, pareceres
  ou relatórios que demonstrem o cumprimento dos requisitos necessários à emissão de certificados
  ou atestados relativos às atividades de competência da Anac, nos termos do §1º do art. 8º
  da Lei nº 11.182, de 27 de setembro de 2005.

  Exame Prático de MMA: Significa a fase da avaliação do Candidato a MMA que verifica as habilidades
  práticas do candidato na execução de tarefas relacionadas com manutenção de aeronaves, motores,
  hélices, ou outros componentes, de acordo com a Habilitação específica, assim como aspectos
  gerais relacionados ao meio da manutenção aeronáutica. O exame prático é específico de um
  Examinador de MMA e um candidato a MMA.

  Examinador de MMA: Significa o Profissional Credenciado pela Anac para realização de Exame
  Prático de MMA.

  Ficha de Avaliação de MMA (Famma): Documento usado durante um exame prático para registro
  das observações realizadas pelo examinador e atribuição do resultado final.

  Profissional Credenciado (PC): Significa a Pessoa Física formalmente reconhecida pela Anac
  por meio do Credenciamento.'
