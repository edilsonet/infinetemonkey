title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  Os casos omissos serão dirimidos pela Superintendência de Pessoal da Aviação Civil.

  Conforme destacado no parágrafo 5.12.3, tal dispositivo para renovação de credenciamento
  entra em vigor no dia 1º de janeiro de 2026.'
