title: 'Requerente: identificação da associação aerodesportiva que pleiteia o credenciamento.'
text: '1. Requerente: identificação da associação aerodesportiva que pleiteia o credenciamento.

  a. Nome: completo, sem abreviações.

  b. Razão social: nome que consta no estatuto da associação.

  c. CNPJ: do requerente.

  d. Endereço: da sede que será utilizado para envio de correspondência oficial.

  e. Website: sítio de rede oficial da associação onde constem de forma destacada links para
  a

  página de aerodesportos do portal da ANAC e do DECEA.

  f. E-mail: do requerente que será utilizado no cadastro do login. É para este e-mail que
  é

  enviada a senha de acesso ao sistema de cadastro de aeronaves motorizadas regidas pelo RBAC

  nº 103, por exemplo. É permitido apenas um.

  g. Telefone: com DDD, preferencialmente telefone fixo.'
