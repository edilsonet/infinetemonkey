text: '2. Presidente ou diretor.

  a. Nome: completo. Se necessário, abrevie.

  b. RG: número e órgão expedidor.

  c. CPF: do presidente ou diretor.

  3. Modalidades aerodesportivas desenvolvidas pela associação: indicar qual(is) modalidade(s)

  aerodesportiva(s) compõe(m) o objeto principal da associação e a quantidade de sócios ativos.

  4. Solicitação: selecione com um (X) a(s) atividade(s) que pretende desempenhar como entidade

  credenciada junto à ANAC de acordo com o seu estatuto.

  5. Assinatura: o formulário deverá ser assinado pelo responsável indicado no campo 2.Data
  de emissão: 19 de junho de 2018 IS nº 183-004

  Revisão A'
