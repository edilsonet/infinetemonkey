title: SOLICITAÇÃO
text: '4. SOLICITAÇÃO

  Prezado Sr. Superintendente de Padrões Operacionais,

  Venho pelo presente instrumento solicitar o credenciamento da associação aerodesportiva,
  conforme dados acima

  informados, com o fim de:

  ( ) ministrar instrução prática de voo;

  ( ) realizar os exames de saúde periciais para obtenção de um CMA de 4ª Classe emitido segundo
  o RBAC nº 67;

  ( ) aplicar exames teóricos em pilotos para a concessão, revalidação ou convalidação do
  certificado de piloto

  aerodesportivo (CPA) previsto no RBAC nº 61;

  ( ) aplicar exames de proficiência em pilotos para a concessão, revalidação ou convalidação
  do certificado de piloto

  aerodesportivo (CPA) previsto no RBAC nº 61;

  ( ) aplicar exames teóricos em pilotos para a concessão, revalidação ou convalidação da
  licença de piloto de planador

  prevista no RBAC nº 61;

  ( ) aplicar exames de proficiência em pilotos para a concessão, revalidação ou convalidação
  da licença de piloto de

  planador prevista no RBAC nº 61;

  ( ) aplicar exames teóricos em pilotos para a concessão, revalidação ou convalidação da
  licença de piloto de balão livre

  prevista no RBAC nº 61;

  ( ) aplicar exames de proficiência em pilotos para a concessão, revalidação ou convalidação
  da licença de piloto de balão

  livre prevista no RBAC nº 61;

  ( ) efetuar o cadastro junto à ANAC dos aerodesportistas regidos pelo RBAC nº 103; e

  ( ) efetuar o cadastro junto à ANAC dos ultraleves motorizados e/ou balões livres tripulados
  regidos pelo RBAC nº 103.

  ________________________________________________ ______/______/______

  Assinatura do Presidente/Diretor Data

  REQUERIMENTO PARA CREDENCIAMENTO DE

  ASSOCIAÇÃO AERODESPORTIVAData de emissão: 19 de junho de 2018 IS nº 183-004

  Revisão A

  INSTRUÇÕES PARA PREENCHIMENTO DO REQUERIMENTO PARA

  CREDENCIAMENTO DE ASSOCIAÇÃO AERODESPORTIVA

  ATENÇÃO! Exceto orientação contrária, todos os campos são de preenchimento obrigatório.

  Não enviar estas instruções junto ao requerimento.

  Estas instruções complementam o disposto na IS nº 183-004, disponível em

  http://www.anac.gov.br/assuntos/legislacao/legislacao-1/iac-e-is/is.'
