text: '5.2.2 A solicitação é realizada por meio da entrega à ANAC de formulário preenchido

  (requerimento para credenciamento de associação aerodesportiva), conforme modelo

  disponível no Apêndice A desta IS e cujo arquivo em formato editável se encontra disponível

  no link http://www.anac.gov.br/assuntos/setor-regulado/empresas/acesso-rapido/modelos-e-

  formularios..'
