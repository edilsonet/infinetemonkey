text: 'g) comprovante de propriedade do imóvel ou contrato de locação com cessão de direitos
  de

  uso onde funciona a sede da associação aerodesportiva ou qualquer outro documento de

  cessão de uso do imóvel, devidamente registrado no registro competente, comprovando

  os poderes dos signatários no referido instrumento, por prazo nunca inferior a 3 (três)

  anos, em qualquer caso;Data de emissão: 19 de junho de 2018 IS nº 183-004

  Revisão A'
