title: DISPOSIÇÕES FINAIS
text: '7. DISPOSIÇÕES FINAIS

  7.1 O cadastro de aeronaves motorizadas regidas pelo RBAC nº 103 no site da ANAC e a

  veracidade das informações são de responsabilidade da associação credenciada.

  7.2 A associação credenciada deve requerer e obter aprovação da ANAC para qualquer

  modificação proposta às atividades autorizadas e limitações descritas em sua Portaria de

  credenciamento.

  7.3 Em caso de dúvidas, as associações poderão entrar em contato com a ANAC por meio do
  e-

  mail aerodesporto@anac.gov.br.

  7.4 Os casos omissos serão dirimidos pela SPO.

  7.5 Esta IS entra em vigor na data de sua publicação.Data de emissão: 19 de junho de 2018
  IS nº 183-004

  Revisão A'
