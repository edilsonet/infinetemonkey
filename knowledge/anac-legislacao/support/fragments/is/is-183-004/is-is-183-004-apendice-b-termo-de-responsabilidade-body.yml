title: APÊNDICE B - TERMO DE RESPONSABILIDADE
text: 'APÊNDICE B - TERMO DE RESPONSABILIDADE

  Declaro que tenho conhecimento dos requisitos do RBAC nº 183, das disposições da IS nº 183-004
  e

  das prerrogativas e limitações expressas na Portaria de credenciamento.

  Certifico, pelo presente instrumento, que todos os dados incluídos no sistema são fidedignos
  e sua

  verificação é de minha inteira responsabilidade. Certifico que todos os registros de exame
  de

  proficiência serão guardados enquanto perdurar o credenciamento desta associação, em atendimento
  à

  Subparte E do RBAC nº 183. Comprometo-me a disponibilizá-los caso seja requisitado pela
  ANAC ou

  outro órgão público competente.

  Estou ciente que qualquer irregularidade ou falta de guarda da cópia legível, física ou
  digital, da Ficha

  de Avaliação de Piloto - FAP, assinada pelo examinando, tornará automaticamente sem efeito
  o ato

  administrativo gerado pelo mesmo, além da abertura de processo administrativo para apuração
  de

  responsabilidade, sem prejuízo a possíveis sanções cíveis e penais.

  Sendo assim, assino o presente Termo de Responsabilidade comprometendo-me pelo cumprimento
  da

  Subparte E do RBAC nº 183 e da Portaria de credenciamento em todos os seus aspectos legais
  e

  normativos perante a ANAC.

  (Localidade), (dia) de (mês) de (ano)

  _______________________________________________________

  Nome e assinatura do Presidente/Diretor da Associação'
