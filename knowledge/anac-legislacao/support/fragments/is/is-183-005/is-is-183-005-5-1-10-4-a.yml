title: 5.1.10.4(a)
text: 'a) Treinamento inicial: O treinamento inicial fornece familiarização inicial do PCA
  com os Padrões Estabelecidos pela ANAC. O treinamento inicial é um dos pré-requisitos para
  a emissão do Credenciamento e é ministrado por especialistas ou técnicos em regulação de
  aviação civil. Proporciona uma visão geral da ANAC, uma familiarização com os procedimentos
  administrativos da ANAC, papéis e responsabilidades do PCA, uma visão geral do processo
  de certificação de tipo e certificação de aeronavegabilidade e atividades de certificação
  que um PCA pode realizar.'
