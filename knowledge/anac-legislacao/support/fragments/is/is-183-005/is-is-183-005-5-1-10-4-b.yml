title: 5.1.10.4(b)
text: 'b) Treinamento recorrente: O treinamento recorrente fornece informação atualizada e
  orientação técnica e processual apropriadas às atividades desempenhadas pelo PCA. Esse treinamento
  provê ainda sessões técnicas para discussão de assuntos de interesse, incluindo procedimentos
  administrativos, métodos e práticas da ANAC.

  5.1.10.5 A ANAC informará, para cada treinamento, o percentual de aproveitamento mínimo
  necessário para aprovação, que é estabelecido pela área de treinamento da ANAC.

  5.1.10.6 Quando o Candidato não concluir satisfatoriamente o treinamento recorrente, o Credenciamento
  pode ser cancelado. Se houver justificativa, a ANAC pode permitir que o PCA tenha mais uma
  oportunidade de fazer o treinamento recorrente antes de ter seu credenciamento cancelado.

  5.1.10.7 Caso o candidato a PCA não seja aprovado em treinamento teórico e prático no prazo
  de 2 (dois) anos a contar da data de abertura do processo de credenciamento, o processo
  poderá ser encerrado e arquivado pela ANAC.'
