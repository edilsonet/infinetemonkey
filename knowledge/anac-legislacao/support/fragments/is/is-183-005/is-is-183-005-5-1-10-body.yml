title: Treinamento
text: '5.1.10 Treinamento

  5.1.10.1 O treinamento teórico de PCA é feito por meio de seminários, cursos, workshops,
  palestras, entre outros, que o familiarizam com os Padrões Estabelecidos pela ANAC, visando
  a uma atuação padronizada e uniforme do profissional credenciado.

  5.1.10.2 O treinamento prático de PCA (Ordem de Instrução) é realizado por servidores da
  ANAC, técnico ou especialista em regulação, que possua conhecimento no tipo de vistoria
  a ser realizada, visando a uma atuação padronizada e uniforme do profissional credenciado.

  5.1.10.3 A ANAC comunicará ao Candidato quando da necessidade de treinamento. O Candidato
  deve cumprir o treinamento requerido na primeira ou segunda oportunidade oferecida pela
  ANAC. Caso não seja cumprido, o processo poderá ser encerrado e arquivado. Não sendo necessário
  treinamento, a ANAC providenciará o Credenciamento.'
