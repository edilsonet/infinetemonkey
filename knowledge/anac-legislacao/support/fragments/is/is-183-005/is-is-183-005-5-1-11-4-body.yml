text: '5.1.11.4 Durante a OI, o servidor da ANAC toma nota dos itens avaliados e confecciona
  um parecer aprovando ou não o Candidato naquela OI.

  5.1.11.5 Independentemente da quantidade estabelecida de OIs, o fato de o Candidato cumpri-las
  não garante seu Credenciamento, estando condicionado ao parecer final favorável do servidor.

  5.1.11.6 O PCA é o responsável por identificar uma vistoria de aeronave a ser realizada
  por servidor da ANAC e conciliar com a sua necessidade de realização da ordem de instrução.'
