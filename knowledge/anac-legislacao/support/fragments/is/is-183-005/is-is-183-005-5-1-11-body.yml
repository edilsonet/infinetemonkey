title: Ordem de Instrução (OI)
text: '5.1.11 Ordem de Instrução (OI)

  5.1.11.1 A Ordem de Instrução é um treinamento prático de vistoria de aeronave que visa
  a capacitar os Candidatos a PCA quanto aos procedimentos de vistoria realizados pela ANAC.
  É ministrada por um servidor designado da ANAC, técnico ou especialista em regulação, que
  possua conhecimento quanto ao tipo de vistoria.

  NOTA - O Candidato a PCA, além de deter domínio do assunto, precisa compreender o relacionamento
  dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave, bem como a
  maneira e a razão de serem estabelecidas essas exigências. Para tal, é imperativo que receba
  da ANAC as instruções necessárias quanto aos procedimentos aplicáveis.

  5.1.11.2 A Área Técnica Responsável determina a quantidade de OIs que o Candidato deverá
  cumprir satisfatoriamente para ter o seu Credenciamento concedido. As OIs deverão ser realizadas
  no prazo máximo de 2 (dois) anos a contar da data de abertura do processo de credenciamento.'
