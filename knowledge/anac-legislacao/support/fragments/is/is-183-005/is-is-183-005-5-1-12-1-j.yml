section_title: A capacidade da ANAC de executar uma supervisão adequada depende de equilibrar
  seus recursos humanos à sua carga de trabalho e ao número de PCA.
subsection_id: j
cite: 5.1.12.1(j)
title: 5.1.12.1(j)
text: 'j) aplicar medidas administrativas (suspensão do credenciamento), quando necessário.

  5.1.12.3 Caso o PCA Empregado seja indicado para trabalhar em um consórcio, parceria, licenciamento
  ou qualquer outro tipo de contrato de negócios, bem como emitir laudos ou pareceres para
  empresa diversa da qual possui vínculo, a ANAC poderá, a seu critério, aumentar o nível
  de Supervisão.'
