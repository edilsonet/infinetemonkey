title: 5.1.12.4(a)
text: a) A Área Técnica Responsável monitora o desempenho de cada PCA com uma frequência baseada
  no número de atividades realizadas pelo PCA, nos resultados de avaliações anteriores e no
  tempo decorrido desde a última amostragem, balanceada com a sua capacidade para realizar
  Monitoramento.
