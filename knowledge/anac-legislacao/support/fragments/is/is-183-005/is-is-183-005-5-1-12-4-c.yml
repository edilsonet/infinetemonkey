title: 5.1.12.4(c)
text: 'c) No caso de desempenho insatisfatório, a Área Técnica Responsável determina e inicia
  uma ação corretiva apropriada. Se o desempenho do PCA permanecer insatisfatório após concluída
  a ação corretiva, ou no caso de constatar ação do PCA que resulte em risco inaceitável à
  segurança operacional, a ANAC poderá cancelar o Credenciamento.

  5.1.12.5 A Área Técnica Responsável poderá, a seu critério, aumentar o nível de Supervisão
  do PCA Autônomo que preste serviços para uma empresa com a qual possua vínculo estatutário
  (proprietário, diretor, administrador etc.).


  5.1.12.6 Caso o PCA que realiza vistorias não execute qualquer atividade de vistoria de
  aeronaves no período de validade de seu Credenciamento, a ANAC não renovará o seu Credenciamento,
  por motivo de atividade insuficiente.'
