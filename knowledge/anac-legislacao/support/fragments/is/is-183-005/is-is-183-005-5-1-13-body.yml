title: Ordem de Avaliação (OA)
text: '5.1.13 Ordem de Avaliação (OA)

  5.1.13.1 A OA é um instrumento que consiste em uma avaliação prática realizada numa vistoria
  de aeronave. É ministrada por um servidor designado da ANAC, técnico ou especialista em
  regulação, que possua conhecimento quanto ao tipo de vistoria.

  5.1.13.2 A OA tem como objetivo verificar se o avaliado tem domínio do assunto, compreende
  o relacionamento dos requisitos técnicos e regulamentares com sua aplicabilidade na aeronave,
  e as razões de serem estabelecidas essas exigências.

  5.1.13.3 A OA é aplicável a um PCA já credenciado. Durante a análise da renovação do Credenciamento,
  por motivações extras, como denúncias de má conduta, recorrências em erros de laudos, interpretações
  e falhas em procedimentos estabelecidos pela ANAC, ou qualquer outra motivação técnico-administrativa,
  será definido pela Área Técnica Responsável que o PCA deverá passar por uma OA, a ser cumprida
  na primeira vistoria solicitada na qual o PCA atuará, dentro do prazo de validade do Credenciamento.

  5.1.13.4 Tendo-se como base a demanda por vistorias, caso o PCA não consiga agendar a necessária
  OA com a ANAC no prazo estabelecido, seu Credenciamento poderá ser cancelado.

  5.1.13.5 Dependendo do Escopo reconhecido do PCA, podem ser definidas mais de uma OA, em
  famílias de aeronaves diferentes, bem como tipos diferentes de operação de aeronave.'
