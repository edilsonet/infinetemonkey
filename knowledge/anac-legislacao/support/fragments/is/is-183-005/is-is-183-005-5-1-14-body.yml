title: Relatório de Atividades
text: '5.1.14 Relatório de Atividades

  5.1.14.1 O PCA deve fornecer à ANAC relatórios periódicos ou específicos com informações
  relativas às suas atividades como PCA durante o período considerado. A renovação do Credenciamento
  depende do nível de atividade executado pelo PCA, o qual é evidenciado por meio desses relatórios.

  5.1.14.2 A critério da ANAC, os relatórios poderão conter, simplesmente, dados estatísticos
  relativos às atividades, tais como a quantidade de inspeções realizadas.'
