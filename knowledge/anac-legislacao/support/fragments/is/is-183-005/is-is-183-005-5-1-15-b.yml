cite: 5.1.15(b)
title: 5.1.15(b)
text: 'b) Caso constatado o recebimento da solicitação de reconsideração dentro do prazo informado
  no ofício de cancelamento, a ANAC deliberará e comunicará ao requerente a decisão tomada.

  5.1.15.5 Solicitação de credenciamento pós-cancelamento: Para PCA que tiveram seu credenciamento
  cancelado, a ANAC somente considerará novas solicitações de credenciamento após 1 ano da
  data do recebimento da notificação oficial sobre o cancelamento, exceto nos casos previstos
  nos itens 5.1.15.2 (e) e (i).'
