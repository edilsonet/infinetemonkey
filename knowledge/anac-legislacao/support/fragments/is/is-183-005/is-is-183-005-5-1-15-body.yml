title: Cancelamento de Credenciamentos
text: '5.1.15 Cancelamento de Credenciamentos

  5.1.15.1 Esta seção descreve critérios e procedimentos para o cancelamento do Credenciamento.
  Os procedimentos visam a assegurar que o devido processo seja conduzido antes que uma decisão
  final seja tomada.

  5.1.15.2 Um Credenciamento somente pode ser cancelado devido a uma ou mais das possíveis
  causas listadas abaixo, tal como identificado nos subparágrafos 183.15(b)(1) a (6) do RBAC
  nº 183.'
