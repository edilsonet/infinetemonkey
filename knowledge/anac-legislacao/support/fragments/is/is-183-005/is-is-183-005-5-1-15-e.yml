title: 5.1.15(e)
text: e) Conduta inapropriada - quando a ANAC julgar que o PCA não exerceu, ou exerceu inadequadamente,
  suas funções de PCA, ou que atuou de forma fraudulenta ou inapropriada, ou que a empresa
  usou inapropriadamente os serviços do PCA.
