title: 5.1.15(o)
text: 'o) Alguma outra decisão motivada da ANAC, para preservar o interesse público.

  5.1.15.3 Notificação do cancelamento: A ANAC enviará notificação escrita ao PCA, se autônomo,
  ou à empresa, se for PCA empregado, indicando claramente as razões para cancelamento do
  Credenciamento.

  5.1.15.4 Ações de reconsideração: Os pedidos de reconsideração contra o cancelamento do
  credenciamento não se aplicam às seguintes razões de cancelamento: alíneas (e), (g), (h),
  (i), (j) e (n) do parágrafo 5.1.15.2.'
