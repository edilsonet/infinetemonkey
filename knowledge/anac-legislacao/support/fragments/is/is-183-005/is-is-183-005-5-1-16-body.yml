title: Procedimentos internacionais para PCA
text: '5.1.16 Procedimentos internacionais para PCA

  5.1.16.1 O PCA pode exercer atividades fora do Brasil. Na hipótese de haver acordo internacional
  com a autoridade do país que contenha procedimentos a esse respeito, tais procedimentos
  devem ser observados.'
