section_title: 'O sistema de credenciamento de profissionais em aeronavegabilidade continuada
  é pautado pelas seguintes premissas:'
subsection_id: b
cite: 5.1.3.1(b)
title: 5.1.3.1(b)
text: 'b) Premissa II: O Credenciamento é uma permissão concedida pela ANAC baseada no reconhecimento,
  e não um direito do Candidato. Nem toda pessoa que possua as qualificações requeridas pela
  ANAC receberá o Credenciamento. Além de avaliar as qualificações do Candidato, a ANAC determina
  se há suficiente necessidade que justifique o Credenciamento, se a ANAC possui recursos
  adequados disponíveis para gestão e Supervisão dos Profissionais Credenciados e se a ANAC
  julga que o Candidato apresenta a Competência para exercer o papel de credenciado. A ANAC
  tem a prerrogativa de não conceder o Credenciamento, especialmente quando não houver alguma
  dessas condições. Essas mesmas condições podem levar ao cancelamento de um Credenciamento,
  de acordo com o parágrafo 183.15(b) do RBAC n° 183.'
