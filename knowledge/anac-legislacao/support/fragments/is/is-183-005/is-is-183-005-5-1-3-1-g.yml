section_title: 'O sistema de credenciamento de profissionais em aeronavegabilidade continuada
  é pautado pelas seguintes premissas:'
subsection_id: g
cite: 5.1.3.1(g)
title: 5.1.3.1(g)
text: 'g) Premissa VII: O cancelamento do Credenciamento ocorrerá quando a ANAC identificar
  a ocorrência de alguma das possíveis causas previstas no parágrafo 183.15(b) do RBAC n°
  183. O Profissional Credenciado está ciente de que, como o Credenciamento é uma permissão
  e não um direito, a ANAC tem a prerrogativa de cancelar o Credenciamento conforme o parágrafo
  183.15(b) do RBAC nº 183.'
