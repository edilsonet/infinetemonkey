title: 5.1.4.1(a)
text: 'a) O PCA Empregado é uma pessoa física que mantém vínculo contratual com uma das seguintes
  pessoas jurídicas, e que foi credenciada pela ANAC como PCA vinculado a essa empresa:

  I - empresas de transporte aéreo certificadas segundo o RBAC n° 119 para condução de operações
  conforme os RBAC n° 121 ou 135;

  II - organizações de manutenção certificadas conforme o RBAC n° 145;

  III - fabricantes certificados de produtos aeronáuticos.'
