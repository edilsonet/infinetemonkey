cite: 5.1.4.1(b)
title: 5.1.4.1(b)
text: b) Ao solicitar o Credenciamento como PCA para pessoas de seu quadro de pessoal, a empresa
  deve assumir, por escrito, o compromisso de respeitar todas as decisões técnicas do PCA
  no desempenho de suas funções. Por exercer atividades independentemente do nível administrativo
  que o PCA ocupe na empresa, existe a possibilidade de seu julgamento contrariar decisões
  técnicas tomadas em níveis organizacionais superiores ao seu.
