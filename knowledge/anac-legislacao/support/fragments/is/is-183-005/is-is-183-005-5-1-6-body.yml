cite: 5.1.6
title: Limitações
text: '5.1.6 Limitações

  5.1.6.1 Poderá ser necessário restringir as atividades autorizadas em função do nível de
  conhecimento individual do PCA e de responsabilidade dentro da empresa (nos casos de PCA
  empregado). Essas limitações podem restringir as atividades do PCA dentro de uma área específica,
  com a finalidade de cumprir uma determinada função, e estarão descritas no escopo reconhecido
  de seu Credenciamento.

  5.1.6.2 Mesmo credenciado, o envolvimento do PCA em uma vistoria se dá por meio de solicitação
  específica encaminhada à área responsável da SPO. O PCA deve sempre manter-se em contato
  com a área responsável pela sua supervisão para estar atualizado quanto aos procedimentos
  e instruções aplicáveis às vistorias.'
