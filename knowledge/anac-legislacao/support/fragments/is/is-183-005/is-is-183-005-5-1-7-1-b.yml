section_title: 'Profissional Credenciado - Os seguintes aspectos devem ser observados pelo
  Profissional Credenciado em sua atuação:'
subsection_id: b
cite: 5.1.7.1(b)
title: 5.1.7.1(b)
text: b) Desempenhar suas atividades conforme os padrões estabelecidos pela ANAC. Entretanto,
  o Profissional Credenciado, em virtude da alínea 5.1.3.1(c), não necessita replicar, exatamente
  e em todos os aspectos, o modo de atuação do servidor da ANAC.
