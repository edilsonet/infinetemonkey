section_title: 'Profissional Credenciado - Os seguintes aspectos devem ser observados pelo
  Profissional Credenciado em sua atuação:'
subsection_id: j
cite: 5.1.7.1(j)
title: 5.1.7.1(j)
text: j) Contatar a Área Técnica Responsável em caso de dúvida de interpretação de requisito.
  O Profissional Credenciado não deve fazer interpretação própria de qualquer requisito sobre
  o qual desconheça a posição da ANAC. Ao analisar dados técnicos, o PCA deve se certificar
  de que está ciente das interpretações dos requisitos aplicáveis, principalmente nos casos
  de avaliações que esteja realizando pela primeira vez.
