section_title: 'Profissional Credenciado - Os seguintes aspectos devem ser observados pelo
  Profissional Credenciado em sua atuação:'
subsection_id: k
cite: 5.1.7.1(k)
title: 5.1.7.1(k)
text: k) Não induzir qualquer pessoa, ou mesmo utilizar o logotipo da ANAC, em mídias como
  cartões de visita, de tal forma que alguém possa pressupor que ele seja um funcionário da
  ANAC. Entretanto, é permitido que o Profissional Credenciado informe o número de seu Credenciamento
  nessas mesmas mídias.
