section_id: 5.1.7.1
section_title: 'Profissional Credenciado - Os seguintes aspectos devem ser observados pelo
  Profissional Credenciado em sua atuação:'
subsection_id: m
cite: 5.1.7.1(m)
title: 5.1.7.1(m)
text: m) Exceto se de outra forma autorizado pela ANAC, o PCA não deve emitir laudos, pareceres
  ou relatórios sobre dados de demonstração de cumprimento de requisitos dos quais ele tenha
  sido autor ou coautor. No entanto, o PCA pode ter trabalhado em conjunto com indivíduos
  que prepararam tais dados e ainda assim emitir esses documentos.
