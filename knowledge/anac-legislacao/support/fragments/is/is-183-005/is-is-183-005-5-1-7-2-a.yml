text: a) A Área Técnica Responsável responsabiliza-se por analisar solicitações de Credenciamento
  inicial, extensão, renovação ou pedidos de reconsideração de cancelamentos de Credenciamento,
  e ainda supervisionar e orientar o Profissional Credenciado.
