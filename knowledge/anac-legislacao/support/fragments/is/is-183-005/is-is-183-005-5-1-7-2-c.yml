title: 5.1.7.2(c)
text: c) A análise técnica dos diferentes processos de credenciamento, a orientação e a supervisão
  devem ser realizadas por especialista ou técnico em regulação de aviação civil de área ou
  setor da ANAC que desempenhe as mesmas atividades técnicas que aquelas solicitadas pelo
  Candidato ou autorizadas ao Profissional Credenciado. A análise técnica é posteriormente
  aprovada ou reprovada pelo gerente da Área Técnica Responsável ou pessoa com delegação para
  tal.
