title: 5.1.7.2(d)
text: 'd) Cada servidor da Área Técnica Responsável tem como responsabilidades, ao autorizar
  a execução de alguma atividade ao Profissional Credenciado:

  I - Descrever com clareza e objetividade a atividade e os resultados esperados.

  II - Supervisionar diretamente as atividades autorizadas, verificando se foram executadas
  conforme os padrões estabelecidos pela ANAC e alertando o Profissional Credenciado e a Área
  Técnica Responsável quanto ao não atendimento aos padrões estabelecidos pela ANAC.'
