cite: 5.1.7.3(a)
title: 5.1.7.3(a)
text: 'a) Ao indicar e recomendar o Credenciamento de um empregado, o empregador assume o
  compromisso de conceder ao Profissional Credenciado as condições necessárias para que ele
  possa desempenhar satisfatoriamente suas funções como Profissional Credenciado. São exemplos
  de condições necessárias:

  I - Tempo para executar as atividades, que deve ser suficiente para que o Profissional Credenciado
  realize a tarefa sem estar pressionado. Na falta de outros dados, pode-se utilizar como
  parâmetro os prazos normalmente utilizados pelos servidores da ANAC.

  II - Tempo para realizar tarefas administrativas específicas dos Profissionais Credenciados
  (por exemplo, preparação de relatórios de atividades, preenchimento de formulários).

  III - Tempo para treinamento e capacitação.

  IV - Suporte de especialistas quando solicitado pelo Profissional Credenciado.

  V - Autonomia suficiente para tomar decisões técnicas, especialmente aquelas que contrariam
  níveis organizacionais superiores ao seu.

  VI - Participação em reuniões na ANAC quando convidado, tanto com as áreas técnicas quanto
  com a coordenação ou a gestão de Profissionais Credenciados.

  VII - Acesso aos documentos técnicos necessários à execução dos serviços, o que inclui o
  acesso à internet, permitindo que o Profissional Credenciado tenha acesso aos sites da ANAC
  e das autoridades de aviação civil de outros países.

  VIII - Assegurar-se de que o Profissional Credenciado possa realizar sua atividade sem interrupções
  ou interferências na empresa, e sem pressões para que emita determinada decisão técnica.'
