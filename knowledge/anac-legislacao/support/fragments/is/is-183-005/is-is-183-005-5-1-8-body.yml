title: Qualificação
text: '5.1.8 Qualificação

  5.1.8.1 A seguir estão descritas as qualificações necessárias a qualquer candidato a Profissional
  Credenciado em Aeronavegabilidade. O atendimento aos critérios de qualificação possibilita
  o reconhecimento pela ANAC da competência e da notória especialização do candidato.

  5.1.8.2 No caso de detentor de título profissional de engenheiro ou tecnólogo, declarar,
  por escrito, o registro no conselho de fiscalização da profissão contendo atribuições para
  atividades de manutenção em aeronaves, seus componentes ou suas partes; ou informar que
  possua Licença de Mecânico de Manutenção Aeronáutica emitida pela ANAC, com Habilitação
  válida em Célula e GMP.

  5.1.8.3 No caso de detentor de título profissional de técnico, declarar, por escrito, a
  sua habilitação legal junto ao conselho de fiscalização da profissão para o exercício da
  atividade, e informar que possua Licença de Mecânico de Manutenção Aeronáutica emitida pela
  ANAC, com Habilitação válida em Célula e GMP.

  5.1.8.4 A ANAC reconhece a Competência do Candidato se este possuir, além dos conhecimentos
  específicos, habilidades e atitudes que o recomendem para o Credenciamento, tais como: capacidade
  de trabalhar em equipe, atitude cooperativa, honestidade, sólidos critérios de julgamento,
  respeito, confiança, ética profissional, racionalidade de julgamento, uma reputação de alto
  grau de integridade (junto ao mercado de aviação, profissionais da área e à comunidade em
  geral); bem como possuir conhecimento satisfatório, teórico e prático, dos regulamentos,
  procedimentos e legislação aplicáveis às atividades para as quais o Credenciamento é solicitado.
  No sentido de avaliar adequadamente o cumprimento deste requisito, a ANAC se reserva o direito
  de solicitar ao Candidato, ou a terceiros, dados e informações que julgar necessários.

  5.1.8.5 Para que seja possível avaliar o requisito em 5.1.8.4, o Candidato deve ter trabalhado
  em contato direto com a ANAC em trabalhos ou atividades, nas Áreas de Atuação para as quais
  solicita Credenciamento, por tempo suficiente para que a ANAC possa avaliar e reconhecer
  a Competência do Candidato, bem como melhor avaliar a sua notória especialização. Normalmente,
  considera-se que esse tempo mínimo de contato direto com a ANAC seja de um ano. Alternativamente,
  a critério da ANAC, esse contato pode ser substituído, total ou parcialmente, por recomendações
  de pessoas de referência (por exemplo, ex-servidores da ANAC ou outros Profissionais Credenciados),
  ou mesmo por uma avaliação do candidato, realizada pessoalmente pela ANAC.

  5.1.8.6 Ter no mínimo 3 (três) anos de experiência comprovada trabalhando em uma posição
  de responsabilidade na aprovação para retorno ao serviço ou determinando elegibilidade para
  emissão de certificado de aeronavegabilidade padrão para aeronaves do mesmo grupo para o
  qual solicita Credenciamento. A experiência deve ter sido obtida em aeronaves registradas
  no Brasil detentoras de certificado de aeronavegabilidade padrão, ou aeronaves envolvidas
  em um processo de nacionalização que resultou na emissão de certificado de aeronavegabilidade
  padrão. A experiência mais recente não pode ter sido adquirida há mais de 2 (dois) anos
  da data da solicitação do Credenciamento. São exemplos da citada experiência em posição
  de responsabilidade:

  I - especialista em regulação de aviação civil ou técnico em regulação de aviação civil
  na ANAC, com experiência, como líder de equipe, na realização de vistorias técnicas em aeronaves
  para emissão de certificado de aeronavegabilidade padrão;

  II - diretor de manutenção, responsável técnico ou inspetor chefe de um operador aéreo certificado
  conforme o RBAC n° 119 e que opere sob o RBAC n° 121 ou 135, ou de uma organização de manutenção
  certificada conforme o RBAC n° 145, que emite aprovação para retorno ao serviço de aeronave
  completa e que tenha experiência em atividades relacionadas ao Escopo reconhecido pretendido;

  III - supervisor, mecânico líder ou inspetor designado por operador aéreo certificado conforme
  o RBAC n° 119 e que opere sob o RBAC n° 121 ou RBAC n° 135, ou organização de manutenção
  certificada conforme RBAC n° 145, autorizado pelo detentor do certificado, que emite aprovação
  para retorno ao serviço de aeronave completa e que tenha experiência em atividades relacionadas
  ao Escopo reconhecido pretendido; e

  IV - mecânico de manutenção aeronáutica que aprova verificação de aeronavegabilidade ou
  que aprova inspeções de até 100 horas conforme previsto na seção 43.7 do RBAC n° 43, e que
  tenha experiência em atividades relacionadas ao Escopo reconhecido pretendido.

  5.1.8.7 Os requisitos de tempo de experiência solicitado deve ser demonstrado mediante a
  apresentação documentos como: publicações em Diário Oficial, anotações em carteira de trabalho
  ou declaração de empresa ou órgão público, contendo cargo e funções exercidas pelo Candidato.
  No caso de a declaração ser proveniente de empresa privada, deverá ser assinada pelo superior
  imediato do Candidato, ou pelo setor de recursos humanos ou por administrador legalmente
  constituído.

  5.1.8.8 Devido ao caráter internacional da Aviação Civil, os Candidatos deverão ter capacidade
  de ler e entender documentos em inglês relacionados com as atividades pleiteadas no Credenciamento.

  5.1.8.9 No caso de Profissional Credenciado com vínculo contratual com a empresa para a
  qual poderá atuar como PCA, deverá ser apresentado documento comprobatório deste vínculo.'
