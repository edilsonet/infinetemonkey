title: 5.1.9.1(b)
text: b) Os formulários necessários para a solicitação de credenciamento (F-141-10 e F-141-12)
  estão disponíveis no protocolo eletrônico (sistema SEI), inseridos em cada tipo de processo
  (credenciamento inicial, extensão ou renovação) e deverão ser preenchidos e assinados on-line
  (assinatura eletrônica).
