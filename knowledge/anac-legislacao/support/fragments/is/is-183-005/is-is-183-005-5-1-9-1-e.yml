text: e) O Credenciamento é formalizado por meio de ofício, onde consta o nome do Profissional
  Credenciado, número de credenciamento, representação (autônomo ou empresa com a qual o profissional
  possui vínculo contratual), escopo reconhecido, limitações aplicáveis, e validade do Credenciamento.
