title: 5.1.9.1(g)
text: g) O Candidato não possui direito de pedir reconsideração quando a ANAC decidir não
  o credenciar ou não renovar o Credenciamento devido à falta de necessidade, falta de capacidade
  de gestão, ou quando a ANAC reconhecer a existência de falhas nas atitudes requeridas ao
  Candidato.
