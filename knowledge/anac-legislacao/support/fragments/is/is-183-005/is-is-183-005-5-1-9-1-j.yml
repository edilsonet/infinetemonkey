title: 5.1.9.1(j)
text: 'j) A ANAC poderá indeferir o pedido de credenciamento inicial ou renovação caso o candidato
  a PCA possua comprovado histórico de conduta ou desempenho inadequados. Os elementos que
  podem levar à constatação de inadequação do candidato englobam as situações, em que, nos
  últimos cinco anos, tenha sido aplicada sanção administrativa diretamente ao candidato,
  cuja capitulação tenha sido feita por meio do art. 299, incisos I, V, VI ou VII da Lei nº
  7.565, de 19 de dezembro de 1986, ainda que naquelas ocasiões o candidato não ocupasse uma
  posição administrativa requerida pela ANAC.

  NOTA 1 - Para geração de GRU (Guia de Recolhimento da União) para pagamento de TFAC (Taxa
  de Fiscalização da Aviação Civil), acessar “Pagamento GRU”, no sítio eletrônico da ANAC,
  ou usar o campo de busca, colocando “Guia de Recolhimento da União”.'
