title: 5.1.9.2(a)
text: a) A solicitação de credenciamento inicial pode ser feita a qualquer tempo pelo Candidato
  ou pela empresa que solicita o credenciamento de seu empregado. Ela consiste na apresentação
  da documentação original de solicitação do credenciamento e de original ou cópia da documentação
  que comprova atendimento aos critérios de qualificação.
