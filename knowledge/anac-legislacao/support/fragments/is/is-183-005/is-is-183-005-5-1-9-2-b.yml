cite: 5.1.9.2(b)
title: 5.1.9.2(b)
text: 'b) A documentação para dar início ao processo de credenciamento consiste de:

  I - documentação comprobatória da qualificação requerida, conforme detalhado na seção 5.1.8;

  II - Formulário F-141-10 - Formulário de Credenciamento/Extensão (Declaração de Qualificações)
  preenchido e assinado;

  NOTA - Consultar item 5.1.9.1(b) para obter informações sobre o formulário F-141-10.

  III - “Curriculum Vitae”, contendo a data de início e fim de cada experiência, bem como
  descrição da experiência adquirida e exemplos de atividades realizadas;

  IV - carta de recomendação da empresa, quando se tratar de PCA empregado;

  NOTA - O Apêndice B desta Instrução Suplementar apresenta o texto mínimo para a carta de
  recomendação.

  V - comprovação de pagamento da TFAC de credenciamento inicial, por meio da Guia de Recolhimento
  da União (Ver NOTA 1 - );

  VI - ciência e assinatura do Termo de Adesão ao Código de Ética e Conduta.

  NOTA: O Apêndice A do Código de Ética e Conduta dos Agentes Públicos da ANAC (Resolução
  n° 569, de 25 de junho de 2020) apresenta o modelo do termo de adesão ao Código de Ética
  e Conduta a ser preenchido, assinado e anexado ao processo. A resolução está disponível
  no sítio eletrônico da Agência na internet.

  VII - ciência e assinatura do termo de responsabilidade;

  NOTA: O Apêndice C desta Instrução Suplementar apresenta o modelo do termo de responsabilidade.
  O termo deverá ser preenchido e assinado pelo candidato a PCA.

  VIII - nos casos em que os Candidatos sejam agentes públicos (militares ou civis), parecer
  emitido pelo órgão ou entidade de lotação que comprove a Competência para expedição de laudos,
  pareceres e relatórios relacionados às atividades de competência da ANAC; e

  IX - quando aplicável, declarar por escrito sua habilitação legal para o exercício da atividade.'
