cite: 5.1.9.3(c)
title: 5.1.9.3(c)
text: 'c) A seguinte documentação deve ser apresentada para solicitação de renovação do Credenciamento:

  I - Formulário F-141-12 - Relatório de Atividades do PCA - preenchido e assinado;

  NOTA: Consultar item 5.1.9.1(b) para obter informações sobre o formulário F-141-12.

  II - quando aplicável, declarar por escrito sua habilitação legal para o exercício da atividade;

  III - carta de recomendação da empresa, quando se tratar de PCA empregado;

  IV - caso tenha sido realizado algum curso novo relacionado a seu Escopo Reconhecido, deverá
  ser anexado o respectivo certificado de conclusão;

  V - comprovação de pagamento da TFAC de renovação, por meio da Guia de Recolhimento da União
  (Ver NOTA 1 - ); e

  VI - ciência e assinatura do termo de responsabilidade;

  NOTA: O Apêndice C desta Instrução Suplementar apresenta o modelo do termo de responsabilidade.
  O termo deverá ser preenchido e assinado pelo candidato a PCA.'
