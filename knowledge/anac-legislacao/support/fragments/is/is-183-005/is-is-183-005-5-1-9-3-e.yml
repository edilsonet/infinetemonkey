title: 5.1.9.3(e)
text: 'e) Para solicitações de renovação recebidas pela ANAC após a data de validade do Credenciamento,
  aplica-se o seguinte procedimento:

  I - para solicitações recebidas pela ANAC até 12 meses após a data de validade do Credenciamento,
  deve ser apresentada comprovação de pagamento da TFAC de credenciamento inicial, ao invés
  da TFAC de renovação; e

  II - após 12 (doze) meses da data de expiração, o Credenciamento é considerado automaticamente
  cancelado, sem possibilidade de renovação. Caso o requerente ainda tenha interesse, deve
  solicitar um novo Credenciamento inicial.'
