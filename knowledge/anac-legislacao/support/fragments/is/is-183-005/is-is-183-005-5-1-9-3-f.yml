cite: 5.1.9.3(f)
title: 5.1.9.3(f)
text: 'f) Durante a avaliação do pedido de renovação a área técnica responsável verificará
  os seguintes pontos em relação ao treinamento recorrente:

  I - Aprovação em treinamento recorrente no último período de validade do credenciamento
  (quando este tiver sido solicitado pela ANAC em processo anterior);

  II - Necessidade de novo treinamento recorrente, a ser realizado durante o próximo período
  de vigência do credenciamento a ser renovado.'
