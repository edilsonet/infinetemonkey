title: 5.1.9.3(g)
text: g) Na impossibilidade temporária da ANAC ministrar o treinamento recorrente, a Área
  Técnica Responsável pode substituir o treinamento recorrente para fins de renovação do credenciamento
  por orientações ou outras ações de aprendizagem, pessoais ou em grupo, dadas diretamente
  aos Candidatos.
