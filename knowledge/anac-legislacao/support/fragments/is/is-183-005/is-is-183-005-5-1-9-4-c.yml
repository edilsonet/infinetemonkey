title: 5.1.9.4(c)
text: 'c) A seguinte documentação deve ser apresentada para solicitação de extensão do Credenciamento:

  I - Formulário F-141-10 - Formulário de Credenciamento/Extensão (Declaração de Qualificações)
  preenchido e assinado;

  NOTA: Consultar item 5.1.9.1(b) para obter informações sobre o formulário F-141-10.II -
  ciência e assinatura do termo de responsabilidade;

  NOTA: O Apêndice C desta Instrução Suplementar apresenta o modelo do termo de responsabilidade.
  O termo deverá ser preenchido e assinado pelo candidato a PCA.

  III - “Curriculum Vitae”, contendo a data de início e fim de cada experiência, bem como
  descrição da experiência adquirida e exemplos de atividades realizadas na área ou função
  em que a extensão está sendo solicitada; e

  IV - documentação comprobatória da qualificação requerida, conforme detalhado nas seções
  específicas de cada tipo de credenciamento.'
