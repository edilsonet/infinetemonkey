title: 5.1.9.5(a)
text: a) Um Credenciamento é válido por 3 (três) anos a partir da data de emissão e pode ser
  renovado por períodos adicionais de 3 (três) anos, a critério da ANAC, de acordo com as
  disposições do parágrafo 183.15(a) do RBAC nº 183.
