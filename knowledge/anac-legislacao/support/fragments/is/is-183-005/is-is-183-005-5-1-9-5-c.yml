title: 5.1.9.5(c)
text: c) A ANAC não informará aos PCA sobre o vencimento da validade do Credenciamento ou
  dos prazos estabelecidos nesta IS para manutenção do Credenciamento. Portanto, é fundamental
  que o PCA observe a validade de seu Credenciamento, conforme disponível na página da ANAC
  na internet.
