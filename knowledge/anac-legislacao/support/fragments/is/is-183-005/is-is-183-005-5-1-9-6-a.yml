title: 5.1.9.6(a)
text: a) Cada solicitação de Credenciamento será tratada independentemente. Em outras palavras,
  os credenciamentos serão separados, possuindo os seus respectivos números de credenciamento,
  validades, Escopos Reconhecidos e Áreas Técnicas Responsáveis.
