title: Credenciamento múltiplo
text: '5.1.9.6 Credenciamento múltiplo

  5.1.9.7 Uma pessoa física pode ter dois ou mais tipos de credenciamentos simultaneamente,
  o que constitui um credenciamento múltiplo. São exemplos de credenciamento múltiplo de uma
  mesma pessoa física:

  I - PCP Empregado e PCF Empregado;

  II - PCP Autônomo, PCF Empregado e PCA Autônomo;

  III - PCP Empregado e PCP Autônomo; e

  IV - demais combinações possíveis.'
