section_title: Solicitação de credenciamento de ex-servidor da ANAC
subsection_id: b
cite: 5.1.9.8(b)
title: 5.1.9.8(b)
text: b) Ex-servidores da ANAC podem solicitar o Credenciamento conforme suas respectivas
  qualificações comprovadas. Os ex-servidores deverão demonstrar experiência com aprovação
  para retorno ao serviço adquirida nos últimos 3 (três) anos da data da solicitação do Credenciamento.
