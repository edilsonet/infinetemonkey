subsection_id: c
cite: 5.1.9.8(c)
title: 5.1.9.8(c)
text: c) Os ex-servidores da ANAC, que atuavam em área relacionada a aeronavegabilidade, que
  solicitarem credenciamento no prazo de até 3 (três) anos de seu desligamento podem ser dispensados
  do treinamento inicial, dependendo de avaliação da respectiva Área Técnica Responsável.
