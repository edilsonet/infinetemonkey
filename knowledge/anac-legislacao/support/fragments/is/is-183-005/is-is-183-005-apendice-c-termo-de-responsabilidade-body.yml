title: APÊNDICE C - TERMO DE RESPONSABILIDADE
text: 'APÊNDICE C - TERMO DE RESPONSABILIDADE

  Termo de Responsabilidade

  Eu, [nome completo] compreendo e aceito as responsabilidades e obrigações associadas com
  o exercício das prerrogativas a mim concedidas pela ANAC em virtude do credenciamento em
  voga.

  Como profissional credenciado, eu me comprometo a:

  - atuar de acordo com as responsabilidades, privilégios e limitações, conforme estabelecidos
  e detalhados no apêndice deste termo, na IS n° 183-005, e em outros procedimentos e requisitos
  adotados pela ANAC;

  - dedicar os necessários recursos para desempenhar efetivamente meu escopo de credenciamento;

  - estar atualizado quanto aos conhecimentos inerentes à minha especialidade e em termos
  de requisitos, procedimentos e orientações adotadas pela ANAC;

  - colaborar com a ANAC no exercício de minhas prerrogativas concedidas e a participar de
  reuniões com a ANAC em matérias relacionadas com o credenciamento, conforme solicitado;

  - notificar, por escrito e em 7 dias úteis, a ANAC quando mudanças em meus dados pessoais
  e de trabalho, como endereço, telefone ou e-mail, ocorrerem;

  - notificar, por escrito e em 7 dias úteis, a ANAC quando qualquer mudança que possa afetar
  diretamente meu desempenho como profissional credenciado ocorrer.

  [Local da assinatura do termo], [Data da assinatura do termo].

  [Assinatura do candidato]

  ___________________________________________________

  [Nome completo do candidato]'
