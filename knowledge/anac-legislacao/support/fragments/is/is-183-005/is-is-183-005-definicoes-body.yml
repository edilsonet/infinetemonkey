title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1 Para os propósitos desta IS, são válidas as definições listadas no RBAC nº 01 e as seguintes
  definições:

  4.2 Área de Atuação: Significa uma área de conhecimento especializada para a qual o Credenciamento
  é aplicável. Por exemplo, área que corresponde a um tipo de produto aeronáutico, a um sistema
  específico da aeronave, motor, hélice ou a uma porção destes.

  4.3 Área Técnica Responsável: É a gerência da ANAC responsável pela orientação e supervisão
  do Profissional Credenciado.

  4.4 Candidato: É a condição da Pessoa Física que tem seu Credenciamento requerido, desde
  o requerimento até o Credenciamento. O requerente de uma renovação ou extensão também é
  Candidato a esta extensão ou renovação, mesmo já sendo um Profissional Credenciado.

  4.5 Competência: conjunto de conhecimentos, habilidades e atitudes necessários a certo indivíduo
  para o desempenho satisfatório de determinada função ou atividade.

  4.6 Credenciamento: é o ato administrativo pelo qual uma Pessoa Física passa a ser reconhecida
  pela ANAC por sua competência, credibilidade e notória especialização - após ser submetida
  a um processo de avaliação de suas qualificações - para a expedição de laudos, pareceres
  ou relatórios que demonstrem o cumprimento dos requisitos necessários à emissão de certificados
  ou atestados relativos às atividades de competência da ANAC, nos termos do §1º do art. 8º,
  da Lei nº 11.182, de 27 de setembro de 2005.

  4.7 Escopo Reconhecido: conjunto de Áreas de Atuação de um PCA, com possíveis limitações,
  reconhecido pela ANAC por meio de seu Credenciamento.

  4.8 Habilitação: autorização associada a uma licença, na qual são especificadas qualificações
  e respectivas validades (quando aplicável), condições especiais de operação e prerrogativas
  e restrições relativas ao exercício das prerrogativas da Licença. Corresponde ao Certificado
  de Habilitação Técnica (CHT), previsto na Lei 7.565, de 19 de dezembro de 1986 (Código Brasileiro
  de Aeronáutica).

  4.9 Licença: documento emitido pela ANAC que indica a especialidade aeronáutica do titular
  e formaliza sua certificação, de acordo com os requisitos do RBAC nº 65, para atuar de acordo
  com as prerrogativas e restrições pertinentes à referida licença e às habilitações associadas
  a ela.

  NOTA - A Licença e a Habilitação são emitidas pela ANAC em documento único.

  4.10 Monitoramento: É a porção das atividades de Supervisão que abrange a análise dos trabalhos
  executados pelos Profissionais Credenciados quanto à sua precisão, quanto ao atendimento
  aos procedimentos, regulamentos, orientações e requisitos adotados pela ANAC e quanto ao
  uso de técnicas e métodos aceitáveis.

  4.11 Notória Especialização: característica do profissional cujo conceito no campo de sua
  especialidade, decorrente de desempenho anterior, estudos, experiências, publicações, organização
  ou de outros requisitos relacionados com suas atividades, permita inferir que o profissional
  é qualificado e adequado para compor o sistema de Credenciamento.

  4.12 Padrões Estabelecidos pela ANAC: Conjunto de referências que devem ser seguidas pelos
  Profissionais Credenciados, tais como políticas, diretrizes, práticas, requisitos, especificações,
  processos, procedimentos e interpretações, aplicáveis às suas atividades.

  4.13 Profissional Credenciado em Aeronavegabilidade (PCA): É a Pessoa Física formalmente
  reconhecida pela ANAC por meio do Credenciamento.

  4.14 Supervisão: Acompanhamento das atividades dos PCA buscando atendimento aos Padrões
  Estabelecidos pela ANAC.'
