title: desenvolvimento-do-assunto(g)
text: 'g) amostragem, de acordo com a IS nº 21.181-001.

  5.1.2 O credenciamento de um profissional será efetuado mediante solicitação do interessado
  ou pela empresa que solicita o credenciamento de seu empregado, que deverá apresentar declaração
  sobre sua qualificação e documentação que a comprove, conforme detalhamento desta IS. Uma
  autorização será emitida por meio de ato formal da unidade competente delegada pela SPO,
  conforme disposto em Portaria de Organização Interna (POI), para cada pessoa física selecionada,
  segundo o parágrafo 183.11(e) do RBAC nº 183. A autorização especificará os tipos de credenciamento
  que foram deferidos, possíveis limitações, bem como os respectivos prazos de validade.'
