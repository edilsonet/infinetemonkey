title: 5.7.9.2
text: '5.7.9.2

  Inclusão de referência à Resolução ANAC n° 761/2024, que revoga a Resolução ANAC n° 472/2018
  e entra em vigor em 23/06/2025. O termo "medidas preventivas, acautelatórias e sancionatórias"
  foi substituído por "providências administrativas".

  7.2

  Item excluído.'
