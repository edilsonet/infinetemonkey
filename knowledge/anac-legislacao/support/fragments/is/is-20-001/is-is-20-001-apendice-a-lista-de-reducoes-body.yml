  TCDS Type Certification Data Sheet

  TFAC Taxa de Fiscalização da Aviação Civil

  TAWS Terrain Avoidance and Warning System

  TSO Technical Standard Order

  VFR Visual Flight Rules

  VHF Very High Frequency'
