title: Apêndice C, C.3
text: 'Apêndice C, C.3

  Inclusão de modificações aos OSD na lista de modificações e de referência às IS 21.61-001
  e 21.61-005.

  Apêndice C, C.5.1

  Remoção do texto correspondente à sigla ICA e inclusão do texto em inglês para IPC.

  Apêndice C, C.9.1

  Substituição de "AOA" por "indicador de Ângulo de Ataque (Angle of Attack - AOA).

  Apêndice C, C.10.1

  Inclusão do texto completo para as siglas HIRF, EMC, RNP, RVSM, IFR, TCAS, TAWS, GNSS, FMS,
  FDR, EFIS, ADS-B, LIDAR e OTP.

  Substituição da referência ao Guia de FHA por Guia de Análise de Falhas ("Safety Assessment")
  para Grandes Modificações, disponível em https://sistemas.anac.gov.br/certificacao/CHST/CHST.asp"

  Apêndice C, C.11.2

  Atualização da referência cruzada de 4.1 para 4.2 e de 4.2 para 4.3.'
