title: 5.2.1(a)
text: 'a) Halon 1301 - Bromotrifluorometano - CBrF3: na aplicação, apresenta-se na forma de

  jato de gás, pois seu ponto de ebulição é de -57,8 ºC. É indicado para espaços ocupados

  de aeronaves onde não existe ventilação forçada, não há disponibilidade de máscaras de

  oxigênio e não há um segundo piloto. O extintor de Halon 1301 é o mais recomendado,

  incluindo para a utilização em regiões extremamente frias; entretanto, a sua comerciali-

  zação está restrita, embora ainda possa ser encontrado em revendedores autorizados.'
