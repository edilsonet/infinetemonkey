title: 5.2.1(b)
text: 'b) Halon 1211 - Bromoclorodifluorometano - CBrClF2: na aplicação, apresenta-se na

  forma líquida (85%), pois seu ponto de ebulição é de -3,4 ºC. É indicado para espaços

  ocupados em aeronaves certificadas para até 4 (quatro) ocupantes, podendo ser utilizado

  no lugar do Halon 1301; entretanto, a sua comercialização também está restrita, embora

  ainda possa ser encontrado em revendedores autorizados.'
