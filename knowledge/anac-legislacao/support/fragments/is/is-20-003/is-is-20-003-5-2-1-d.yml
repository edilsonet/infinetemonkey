title: 5.2.1(d)
text: 'd) Trifluorometano (HFC-23), Pentafluoretano (HFC-125), Hexafluoropropano

  (HFC-236fa) e o Heptafluoropropano (HFC-227ea): gases fabricados como atuais

  substitutos do Halon 1301, 1211 (e misturas destes) e do Halotron, com mesma eficiência

  e que não afetam a camada de ozônio. Entretanto, nem todos esses gases são utilizados

  para engarrafamento pelos fabricantes de extintores de incêndio.


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B'
