title: 5.2.1(e)
text: 'e) Halotron BrX - 2-bromo-3,3,3-trifluoropropene - 2-BTP: agente extintor de alto de-

  sempenho que pode ser utilizado para substituir o Halon 1301 e 1211 (e misturas des-

  tes), desde que a instalação cumpra com o regulamento de certificação de tipo da aero-

  nave, com mesma eficiência e que não afeta a camada de ozônio.

  Nota - os gases halogenados não podem ser utilizados para o combate ao incêndio em

  materiais classe D (vide tabela da seção 5.3 desta IS).'
