title: 5.2.4
text: '5.2.4

  Extintores de água pressurizada: não são indicados para utilização dentro do espaço con-

  finado de uma cabine principalmente por não serem compatíveis no combate a incêndios

  com fogo na classe B e C, que são os mais prováveis no interior de aeronaves. Entretanto,

  em aeronaves de grande porte esse tipo de extintor é útil após a aplicação de Halon no in-

  cêndio de baterias de íon-lítio (laptop, câmeras e filmadoras), resfriando as células que
  não

  se incendiaram, evitando a continuidade ou reignição das chamas.'
