text: '5.7.2

  Os agentes extintores recomendados para uso dentro de aeronaves de que se trata esta IS
  e

  que estão disponíveis no mercado brasileiro são os halogenados: Halon 1301, Halon 1211 e

  o gás Hexafluoropropano (HFC-236fa). O HFC-236fa não agride a camada de ozônio e tem

  ponto de ebulição de -1,4ºC, com comportamento semelhante ao do Halon 1211 no combate

  às chamas.

  Nota 01 - No exterior podem ser encontrados extintores contendo outros gases halogenados

  alternativos aos 1211, 1301 e misturas destes, como por exemplo o Heptafluoropropano

  (HFC-227ea).

  Nota 02 - Embora qualquer um desses gases possa causar efeitos colaterais nos seres

  humanos, tais como tonteira, dor de cabeça, etc., esses efeitos são insignificantes se


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B


  comparados aos de um incêndio não extinto/controlado dentro de uma aeronave.'
