text: '5.7.3

  O Halotron BrX - 2-bromo-3,3,3-trifluoropropene - 2-BTP é o agente extintor que tem

  sido aprovado pela FAA, EASA e ANAC nas certificações recentes, se demonstrou atender

  aos critérios de toxicidade e podem ser utilizados na cabine. Pode ser utilizado para substituir

  o Halon 1301 e 1211 (e misturas destes), desde que a instalação cumpra com o regulamento

  de certificação de tipo da aeronave, com mesma eficiência e que não afeta a camada de

  ozônio.


  6.

  APÊNDICES

  Apêndice A - Lista de Reduções

  Apêndice B - Controle de Alterações

  7.

  DISPOSIÇÕES FINAIS

  7.1

  A indústria continua desenvolvendo gases que sejam tão eficientes quanto o 1301 ou 1211,

  esta IS poderá ser revisada para incluí-los, após a devida análise técnica.

  7.2

  Os casos omissos serão dirimidos pela ANAC.


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B


