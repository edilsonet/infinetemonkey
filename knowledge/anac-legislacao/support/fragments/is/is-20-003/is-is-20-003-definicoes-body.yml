title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1

  Fogo Classe A: fogo em materiais de uso comum, tais como: madeira, tecidos, papéis, bor-

  racha e plástico, para os quais a água é importante agente refrigerante e extintor.

  4.2

  Fogo Classe B: fogo em líquidos inflamáveis, óleos, tintas e gases inflamáveis, para cuja

  extinção é importante o efeito de supressão de oxigênio, garantido pelo agente extintor.

  4.3

  Fogo Classe C: fogo em equipamento elétrico ligado, em que um agente extintor não con-

  dutivo é requerido.

  4.4

  Fogo Classe D: fogo em metais combustíveis, como o potássio, sódio, magnésio, titânio,

  zircônio e lítio que requer um agente extintor do tipo pó químico especial.

  4.5

  Capacidade extintora: Uma das formas de medir o poder de extinção de fogo de um extin-

  tor, que é obtida por meio de um ensaio normalizado, de acordo as normas ABNT NBR

  15808 (extintores de incêndio portáteis) e ABNT NBR 15809 (extintores de incêndio sobre

  rodas).


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B


  5.'
