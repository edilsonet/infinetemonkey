title: FUNDAMENTOS
text: 'FUNDAMENTOS

  3.1

  Extintores de incêndio portáteis aprovados são requeridos pelos regulamentos que estabele-

  cem requisitos para a certificação de aviões e helicópteros categoria transporte, RBAC 25

  (25.851(a)(5)) e RBAC 29 (29.851(a)(1)), e pelos regulamentos operacionais: RBAC 121

  (121.309(c)) e RBAC 135 (135.155);

  3.2

  Já o RBAC 23, que trata da regulamentação vigente para certificação de aviões categoria

  normal, deve ser cumprido conforme a base de certificação da aeronave quando for instalado

  e aprovado. Entretanto, este regulamento não exige que o extintor seja especificamente apro-

  vado para esta instalação;

  Nota - aeronaves dessas categorias que vierem a ser operadas de acordo com o RBAC 121

  ou 135 não se enquadram no âmbito desta IS.

  3.3

  Há casos em que apenas os requisitos operacionais da aeronave estabelecem a necessidade
  de

  um extintor portátil (tais como aeronaves leves desportivas (LSA) e helicópteros categoria


  Data de emissão: 8 de outubro de 2021

  IS Nº 20-003

  Revisão B


  normal (RBAC 27)), como no parágrafo 91.205(b)(18) do RBAC 91, que requer extintor de

  incêndio portátil acessível aos tripulantes em voo, e no parágrafo 91.513(c) do RBAC 91,
  apli-

  cável para grandes aviões e para aviões multimotores com motores a turbina, que requer que

  extintores de incêndio portáteis, acessíveis aos tripulantes em voo, sejam providos para
  uso nos

  compartimentos de pilotos, passageiros e carga; e

  3.4

  A aprovação formal de extintores implica em exaustivos testes de laboratório, ensaios de

  durabilidade, definições de vida limite das partes, comprovações de desempenho operacio-

  nal, etc. A não exigência da necessidade de aprovação do extintor por alguns regulamentos

  de certificação de projeto ou de operação de aeronaves visa apenas atenuar estas dificulda-

  des, justificadas pelo menor número de tripulantes, passageiros envolvidos, e menor exposi-

  ção ao risco de incêndio. Entretanto, como qualquer equipamento a ser instalado numa ae-

  ronave, um extintor também deve ser apropriado ao fim a que se destina.

  3.5

  E em relação ao uso da IS, o Art. 14 da Resolução n° 030, de 21 de maio de 2008 que instituiu

  o RBAC e IS e estabelece critérios para a sua elaboração, dispõe em seu § 1°, alterado pela

  resolução nº 162 de 20 de julho de 2010 que o administrado que pretenda demonstrar o

  cumprimento de requisito previsto em RBAC/RBHA poderá adotar os meios e procedimen-

  tos especificados em IS ou apresentar meio ou procedimento alternativo devidamente justi-

  ficado, exigindo-se a análise e concordância expressa do órgão competente da ANAC.

  3.6

  Neste sentido, o § 2° do Art. 14 da Resolução n° 030, de 21 de maio de 2008, supracitado,

  dispõe que o meio ou procedimento alternativo mencionado no § 1° deste artigo deve garan-

  tir nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concreti-

  zar o objetivo do procedimento normalizado em IS.

  3.7

  E ainda, o § 3° do Art. 14 da Resolução n° 030, de 21 de maio de 2008, supracitado, dispõe

  que a IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou

  outro ato normativo.

  4.'
