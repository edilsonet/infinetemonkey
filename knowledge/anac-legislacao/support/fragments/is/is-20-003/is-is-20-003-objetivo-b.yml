title: objetivo(b)
text: 'b) os regulamentos de certificação e de operação requerem um extintor de incêndio portátil,

  mas não exigem especificamente a aprovação do extintor.


  Nota - o extintor de reposição de aeronave cujo projeto de tipo inclui um P/N particular

  deve ser substituído pelo de mesmo tipo e modelo especificado na documentação técnica da

  aeronave.

  1.2

  Esta IS também relaciona os produtos atualmente disponíveis pela indústria como resposta

  às restrições de fabricação e utilização de gases que agridem a camada de ozônio (protocolo

  de Montreal de 1987), ou seja, materiais que apresentem a mesma eficiência no combate ao

  fogo que o Halon 1301 e 1211, sendo seus substitutos.

  2.'
