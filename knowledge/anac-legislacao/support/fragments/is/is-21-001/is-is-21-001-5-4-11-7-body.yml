text: '5.4.11.7

  Inclusão da descrição completa da sigla COPj antes de sua primeira ocorrência.

  5.4.11.8.

  Inclusão do item para esclarecimento da função do CVE no caso de ensaios.

  5.4.13.11.

  Inclusão do item para esclarecimento da prerrogativa da COPj.

  5.4.14.5.

  Inclusão do item para esclarecimento da prerrogativa da COPj.

  5.8.2(e)

  Adequação do uso da sigla COPj, indicando “Certificação” no lugar de “Certificado” e remoção
  da descrição por extenso da sigla por não ser seu primeiro uso.

  5.9.2.

  Correção de concordância verbal do item na nota.'
