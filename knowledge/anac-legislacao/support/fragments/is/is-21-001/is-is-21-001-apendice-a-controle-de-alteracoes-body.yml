title: APÊNDICE A - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO B

  ITEM

  ALTERAÇÃO REALIZADA

  Cabeçalho

  Atualização dos dados

  1.3

  Inclusão de item para estabelecimento da referência cruzada com a IS 21.231-001 quando o
  processo de CT for realizado por uma Organização de Projeto certificada conforme a subparte
  J do RBAC 21.

  2.1

  Atualização da seção 2 (Revogação)

  3.4

  Ajuste gramatical para melhor coesão do texto.

  3.5

  Inclusão da Subparte J do RBAC 21 na seção de fundamentos da IS.

  5.2.2.

  Atualização do nº do formulário e correção ortográfica no item (b).

  5.2.5.

  Inclusão de novo item e renumeração dos itens seguintes.

  5.4.2.6.

  Correção ortográfica.

  5.4.7.3.

  Alteração do item para melhor descrever o objetivo do estabelecimento da competência do
  requerente.

  5.4.7.4.

  Alteração do item para melhor descrever o objetivo do estabelecimento da competência do
  requerente.

  5.4.7.5.

  Alteração do item para esclarecer a sujeição dos documentos de cumprimento com os requisitos
  às averiguações da ANAC por meio do 21.257-I(b) e inclusão de uma nota explicativa.

  5.4.8.8(b)

  Inclusão de legenda na Figura 1.

  5.4.9.3.

  Alteração do item para esclarecer a possibilidade de haver diferenças de entendimento entre
  ANAC e outras autoridades de aviação civil para os materiais orientativos, permitindo, com
  isso, a emissão de documentos orientativos próprios indicando tais diferenças. No item (d),
  Correção no acrônimo AC.

  5.4.10.5.

  Inclusão da nota para esclarecer a necessidade de avaliação do CVE dos pontos discrepantes.

  5.4.10.9. a 5.4.10.11.

  Inclusão dos itens para esclarecer funções de inspeções, ensaios e outros meios de produção
  de informação de demonstração na COPj e para esclarecer a prerrogativa de emissão da DLA.

  5.4.11.1.

  Introdução da nota para estabelecimento da referência cruzada com o parágrafo 21.257-I(b)
  do RBAC 21 para a COPj.'
