title: apendice-c-criterio-de-nivel-de-envolvimento-na-demon-c8788d(a)
text: '(a) Novidade: Este fator diz respeito às características novas ou inusitadas identificadas
  no processo de certificação como um todo, englobando o projeto de tipo em si, os meios de
  cumprimento, a própria base de certificação e potenciais impactos no processo de certificação
  devido ao uso pretendido (aspectos operacionais).

  Com relação ao projeto de tipo, a aplicação de uma tecnologia nunca utilizada anteriormente
  na aviação é um exemplo de característica nova ou não usual. Entretanto, mesmo uma tecnologia
  tradicional pode ser identificada como característica nova, caso o requerente não possua
  experiência com essa tecnologia. Isso também é válido para métodos de fabricação conforme
  definido na seção RBAC 21.31. Novas formas de operar a aeronave ou novas funcionalidades
  também podem representar uma novidade no projeto de tipo.

  Com relação aos meios de cumprimento, a adoção de um novo material ordinatório (por exemplo,
  uma nova AC) pode indicar a existência de novidade no processo de certificação. Outro exemplo
  é o requerente propor um meio diferente do usual para demonstrar cumprimento com determinado
  requisito. Com relação à base de certificação, emendas aos requisitos podem trazer novidades
  ao projeto caso sejam aplicáveis a este.'
