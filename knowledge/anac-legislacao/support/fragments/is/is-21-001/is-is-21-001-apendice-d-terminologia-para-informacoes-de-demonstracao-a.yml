title: apendice-d-terminologia-para-informacoes-de-demonstracao(a)
text: '(a) Representatividade quanto ao projeto de tipo: que significa a capacidade de a informação
  refletir as principais características do produto no que diz respeito às premissas pertinentes
  do projeto de tipo. Portanto, ser representativo quanto ao projeto de tipo não necessariamente
  significa ser idêntico. Um exemplo seria uma informação obtida a partir de um corpo de prova
  de um ensaio estrutural de uma asa. Como nem todas as partes de uma asa têm função estrutural,
  é aceitável que a asa testada seja composta apenas pelas partes com função estrutural, sem
  que as demais partes estejam presentes. Assim, neste exemplo, pode-se dizer que a asa testada
  é representativa do projeto de tipo; e'
