title: apendice-e-autorizacao-de-inspecao-de-tipo(a)
text: (a) Caso o requerente e a ANAC entendam que a participação de servidores da Agência
  em voo a ser realizado previamente à emissão da AIT é benéfica e factível, a ANAC pode emitir
  um Ofício de Autorização de Voo - OAV ao invés de uma AIT. Portanto, sua aplicação ocorre
  em casos particulares, tais como participação antecipada da ANAC em ensaios em voo ou voos
  de familiarização.
