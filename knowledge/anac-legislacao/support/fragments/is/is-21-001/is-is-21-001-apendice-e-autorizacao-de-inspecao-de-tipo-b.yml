title: apendice-e-autorizacao-de-inspecao-de-tipo(b)
text: (b) É importante ressaltar que um voo de ensaio realizado sob essa autorização não o
  torna automaticamente um ensaio para fins de investigação de cumprimento e nem demanda necessariamente
  determinação de conformidade. Obviamente, os dados assim obtidos ficam sujeitos à comprovação
  de representatividade, caso se deseje utilizá-los posteriormente como informação de demonstração.
