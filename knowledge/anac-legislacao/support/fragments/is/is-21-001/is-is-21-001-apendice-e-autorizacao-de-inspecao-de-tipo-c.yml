title: apendice-e-autorizacao-de-inspecao-de-tipo(c)
text: (c) No caso ideal, para emissão da AIT, o requerente deve ter demonstrado o cumprimento
  com 100% dos requisitos estruturais aplicáveis e concluído as inspeções e ensaios no solo
  necessários. Na prática, a ANAC aceita um projeto que apresente um nível de segurança adequado
  para o início da campanha de ensaios em voo com servidores da ANAC a bordo da aeronave.
  Portanto, a ANAC emite a AIT quando considera que o projeto tem o nível de maturidade adequado,
  pois não raramente o caso ideal é impraticável, em virtude de se agregar pouco valor, em
  especial em projetos de certificação mais complexos.
