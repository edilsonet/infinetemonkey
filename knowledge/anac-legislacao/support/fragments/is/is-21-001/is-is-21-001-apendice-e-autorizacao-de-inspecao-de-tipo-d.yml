title: apendice-e-autorizacao-de-inspecao-de-tipo(d)
text: (d) A AIT pode ser emitida uma única vez para cada projeto de certificação, podendo
  ser emendada conforme necessário e, usualmente, é precedida de uma Reunião Pré-voo de Certificação
  de Tipo (PFTCBM - Pre Flight Type Certification Board Meeting). Esta reunião pode ser reduzida
  a uma simples comunicação, dependendo da complexidade do projeto.
