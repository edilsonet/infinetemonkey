title: definicoes(d)
text: d) Quaisquer outros dados necessários para permitir, por comparação, a determinação
  da aeronavegabilidade e das características de proteção ambiental (quando aplicável) de
  produtos posteriores do mesmo tipo. Geralmente consistem em dados para determinar a conformidade
  com projeto aprovado visando a emissão de certificados de aeronavegabilidade previstos na
  Subparte H do RBAC 21.
