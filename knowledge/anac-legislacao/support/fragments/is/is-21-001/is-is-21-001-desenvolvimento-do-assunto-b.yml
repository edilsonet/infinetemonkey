title: desenvolvimento-do-assunto(b)
text: 'b) Quando houver um não cumprimento de requisito associado ao projeto de tipo aprovado.

  5.11.4. A existência de uma condição insegura é evidenciada pela emissão de um Diretriz
  de Aeronavegabilidade (ref. RBAC 39.5) e, conforme a seção 21.99 do RBAC 21, após a emissão
  da mesma, um requerente deverá submeter modificações do projeto, se a ANAC assim requerer
  por considerar que tais modificações são necessárias para corrigir as condições inseguras.
  (veja a seção 5.9.4.14 desta IS).

  5.11.5. O caso de um não cumprimento de requisito não possui um dispositivo regulamentar
  que exija uma ação corretiva, exceto em uma situação em que haja simultaneamente uma condição
  insegura, no qual aplica-se a orientação acima descrita. Portanto, um não cumprimento de
  requisito da base de certificação sem condição insegura em um produto ou componente não
  mais produzido, não demanda ações adicionais por parte do detentor do Certificado de Tipo.

  5.11.6. Contudo, no caso de um produto ou componente ainda em produção, a ANAC e o detentor
  do Certificado de Tipo podem estabelecer, quando houver benefício, um plano para correção
  do projeto como por exemplo, incorporar uma modificação do projeto, a ser implementada na
  produção de novas aeronaves a partir de um momento ou número de série específico.

  NOTA: A utilização de informações ou dados conforme o plano de correção de projeto estabelecido
  acima caracteriza o cumprimento com a seção 21.137(a) do RBAC 21, isto é, tais informações
  consistem em dados aprovados, corretos e atualizados.

  5.11.7. Salienta-se que, ainda que haja um não cumprimento de requisito ou condição insegura,
  o projeto se mantém aprovado, a menos que a ANAC proceda com um processo administrativo
  para suspender ou revogar tal aprovação.

  5.11.8. Nota-se, ainda, que, embora o detentor do certificado tenha declarado cumprimento
  (seções 21.20 e 21.97(b)) e possa sofrer as sanções previstas, o PSO-BR, em seu art. 16,
  bem como o PSOE-ANAC, em seu art. 74, estabelecem que as fontes de relatos voluntários devem
  ter seu sigilo e proteção garantidos pela Agência.

  5.12. Transferência do Certificado de Tipo

  5.12.1. O detentor de um Certificado de Tipo pode transferi-lo para outra pessoa, física
  ou jurídica, conforme previsto na seção RBAC 21.47. O novo detentor assumirá as responsabilidades
  descritas na seção 5.8 desta IS, sendo importante que ele tenha condições técnicas para
  exercer tais responsabilidades.

  5.12.2. Quando uma pessoa, física ou jurídica, se torna detentora de um Certificado de Tipo
  através de uma transferência, passa a contar com todos os privilégios previstos na seção
  RBAC 21.45.

  5.12.3. A pessoa que assina a solicitação deve ser a atual detentora do Certificado de Tipo
  (no caso de pessoa física) ou a procuradora legal. Neste último caso, uma comprovação deve
  ser anexada junto com a solicitação.

  5.12.4. A especificação de tipo correspondente será revisada para refletir o nome do novo
  detentor do Certificado de Tipo.

  5.12.5. Em caso de transferência de Certificado de Tipo para pessoa física ou jurídica estrangeira,
  um acordo entre as autoridades de aeronavegabilidade de ambos os países deve existir, estabelecendo
  ações e responsabilidades em relação à aceitação de produtos. É importante ressaltar que,
  independentemente da existência de tal acordo, as responsabilidades quanto à aeronavegabilidade
  continuada de aeronaves fabricadas sob este Certificado de Tipo são transferidas para o
  novo País de Projeto (State of Design), conforme estabelecido pela Convenção de Aviação
  Civil Internacional (Convenção de Chicago).

  5.13. Cassação e suspensão do Certificado de Tipo

  5.13.1. Segundo a seção RBAC 21.51, o Certificado de Tipo é efetivo até sua cassação ou
  suspensão. A cassação pode ocorrer, por exemplo, quando o detentor não for mais capaz de
  assegurar a aeronavegabilidade continuada. A suspensão é uma cassação temporária. A motivação
  para a cassação/suspensão de um Certificado de Tipo pode resultar na suspensão dos certificados
  de aeronavegabilidade das aeronaves fabricadas conforme este Certificado de Tipo, se a cassação
  ou suspensão for motivada por condição insegura.

  5.13.2. Ao iniciar um processo de cassação, o detentor do Certificado de Tipo deve apresentar
  para a ANAC todas as informações de descrição e de demonstração que fundamentaram a emissão
  do Certificado de Tipo e todas as modificações associadas realizadas pelo detentor. Essa
  ação também pode ser apropriada em caso de suspensão, quando existir clara possibilidade
  de cassação.

  5.13.3. Em caso de suspensão ou cassação, o detentor deverá devolver à ANAC o original do
  Certificado de Tipo. Em caso de suspensão, quando esta terminar, a ANAC reemitirá o Certificado
  de Tipo para seu detentor.

  5.13.4. Na especificação de tipo, a ANAC incluirá uma nota documentando a data da cassação/suspensão,
  advertindo que a especificação de tipo não é mais válida para as aeronaves fabricadas após
  aquela data.

  5.14. Devolução do Certificado de Tipo pelo detentor

  5.14.1. De acordo com a seção RBAC 21.51, o detentor do Certificado de Tipo pode devolver
  o Certificado de Tipo. A devolução do Certificado de Tipo é uma ação na qual o detentor
  renuncia ao Certificado de Tipo e seus privilégios associados (RBAC 21.45) A devolução encerra
  a produção de aeronaves cobertas pelo referido Certificado de Tipo a partir da data da devolução,
  mas não tem efeito sobre as aeronaves fabricadas antes da devolução quanto à certificação
  de aeronavegabilidade.

  5.14.2. A ANAC manterá todas as informações e dados que fundamentaram a emissão do Certificado
  de Tipo (vide RBAC 21.41) Estas informações e dados serão utilizados pela ANAC para dar
  suporte às atividades posteriores, tais como aprovações de modificações, fabricação de peças
  de reposição, etc.

  5.14.3. Quando um detentor de Certificado de Tipo iniciar um processo de devolução, a ANAC
  solicitará a esse detentor o envio e a cessão dos direitos de uso de todos os dados e informaçccedil;ões
  do projeto de tipo e das demonstrações realizadas, bem como dos dados técnicos que compõem
  tais informações. Isto possibilitará que um possível sucessor assuma todas as responsabilidades
  sobre a aeronavegabilidade continuada das aeronaves existentes, tal como no caso de transferência.

  5.14.4. Na recusa em ceder os direitos de uso ou na inexistência de um sucessor que assuma
  as responsabilidades pela aeronavegabilidade continuada, uma nota deve ser colocada na especificação
  da aeronave. Essa nota mencionará que, quando ocorrer uma condição insegura, a ANAC suspenderá
  todos os certificados de aeronavegabilidade das aeronaves fabricadas de acordo com o Certificado
  de Tipo cancelado, pois não haverá um responsável que possa tomar as providências requeridas
  pelo parágrafo RBAC 21.99(a) A nota também mencionará que as peças originais de reposição
  não estarão disponíveis no futuro.

  5.14.5. Na especificação de tipo, a ANAC incluirá uma nota documentando a data de cancelamento
  do Certificado de Tipo, advertindo que somente as aeronaves fabricadas até a data do cancelamento
  são elegíveis ao certificado de aeronavegabilidade.

  5.15. Desmembramento de Certificado de Tipo

  5.15.1. O desmembramento do Certificado de Tipo, ou seja, a remoção de um ou mais modelos
  para a criação de um novo Certificado de Tipo, é uma ação incomum e considerada excepcional
  pela ANAC, ainda que o RBAC 21 não impeça.

  5.15.2. O trabalho para segregar pode ser complexo, especialmente porque normalmente os
  modelos mais novos são derivações dos modelos mais antigos e pode haver diferentes composições
  de configurações de produto, intercambiáveis entre si, as quais estão sujeitas a diferentes
  emendas das bases de certificação.

  5.16. Produção de aeronaves, motores e hélices, e seus componentes

  5.16.1. De acordo com a seção RBAC 21.6, uma pessoa somente pode fabricar uma aeronave nova,
  um motor novo de aeronave ou uma hélice nova, para fins de obtenção de um Certificado de
  Aeronavegabilidade padrão (isto é, de acordo com o RBAC 21.183), se:'
