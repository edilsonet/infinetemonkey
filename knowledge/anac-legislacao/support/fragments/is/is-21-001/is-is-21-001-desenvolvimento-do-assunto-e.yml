text: 'e) Um cronograma com os principais eventos (milestones) na atividade de demonstração
  de cumprimento com os requisitos. Ao longo do processo, o detalhamento do cronograma pode
  ser feito através do correspondente protocolo acordado entre requerente e autoridade.

  NOTA 1: Os protocolos de comunicação referentes às atividades do PCR, quando utilizado,
  serão acordados entre o requerente e a autoridade, normalmente em PCEP, estabelecendo como
  e quais as informações mais detalhadas sobre as atividades de demonstração, como datas e
  localidade, serão fornecidas e atualizadas.

  NOTA 2: Uma vez que um cronograma tenha sido acordado, a ANAC prepara seus recursos humanos,
  administrativos e logísticos. Em função disso, a ANAC espera que o requerente persiga as
  datas acordadas, pois eventuais atrasos podem comprometer esse planejamento e, no final
  das contas, colocar em risco a data final da certificação.

  5.4.4.4. A fim de facilitar a organização da campanha de certificação, a ANAC espera que
  o PCR seja apresentado ainda no início do programa de certificação, principalmente para
  projetos de maior magnitude e/ou complexidade.

  5.4.5. Plano de Certificação Específico do Programa

  5.4.5.1. O PCEP é um plano opcional, acordado entre o requerente e a autoridade, o qual
  estabelece os processos de trabalho e define a metodologia que será utilizada para o planejamento
  e a troca de informações para que o processo de certificação seja eficiente. Os métodos
  contemplados no PCEP dizem respeito a um programa, que pode abranger um projeto ou um conjunto
  de projetos certificados sob o mesmo Certificado de Tipo (i.e. novos modelos e modificações
  ao projeto de tipo).

