text: 'f) Outras informações relevantes para familiarização e avaliação da aeronave.

  5.2.5. Caso a pessoa queira realizar a certificação de tipo como uma organização de projeto
  certificada conforme a subparte J do RBAC 21, o requerimento deve incluir uma solicitação
  formal de certificação como tal, uma proposta de Termos da Certificação, conforme a seção
  21.251-I, o manual estabelecido conforme a seção 21.243-I e demais documentos solicitados
  pela subparte do regulamento em referência. Caso a organização já seja certificada pela
  mesma subparte do RBAC 21, deverá apresentar as informações descritas anteriormente, caso
  os procedimentos aceitos não descrevam as informações que devem ser apresentadas.

  NOTA - A IS 21.231-001 estabelece um meio aceitável de cumprimento com os requisitos da
  subparte J para a certificação inicial como organização de projeto. Recomenda-se que o processo
  de certificação como Organização de Projeto seja iniciado com a etapa de solicitação prévia,
  antecipadamente ao requerimento para a certificação de tipo, para que as etapas para certificação
  como Organização de Projeto descritas na IS 21.231-001 sejam respeitadas.

  5.2.6. É desejável que potenciais requerentes estejam familiarizados com o processo de certificação.
  Assim, antes de requerer formalmente um Certificado de Tipo, recomenda-se que o interessado
  entre em contato com a ANAC e faça uma apresentação de seu projeto. O contato inicial fornecerá
  uma oportunidade para desenvolver o conhecimento do processo de certificação de tipo a ser
  aplicado. A ANAC pode prover materiais de orientação, políticas utilizadas, interpretações
  regulatórias e responderá quaisquer dúvidas, mesmo antes da abertura formal do processo.
  Quanto mais cedo o requerente contatar a ANAC, melhor será a chance de o projeto ser certificado
  dentro das expectativas.

  5.2.7. As instruções mais detalhadas, como formas de envio e endereço atualizado, podem
  ser encontradas na Carta de Serviços ao Cidadão ou em cartilhas específicas, disponíveis
  na página de internet do Governo Federal (www.gov.br/anac/pt-br).

  5.3. Análise inicial

  5.3.1. Tendo recebido o requerimento, a ANAC definirá um ponto focal de sua equipe, que
  será responsável por coordenar as ações com o requerente. Este ponto focal é chamado de
  Gerente do Programa de Certificação - GPC.

  5.3.2. Ao final dessa análise inicial, a ANAC envia um ofício ao requerente, orientando
  sobre:'
