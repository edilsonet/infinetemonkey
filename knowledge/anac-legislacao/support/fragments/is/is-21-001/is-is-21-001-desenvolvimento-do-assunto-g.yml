  5.17. Exportação de produtos com certificado de tipo brasileiro

  5.17.1. O Brasil mantém acordos (entendimentos) internacionais sobre aeronavegabilidade
  e segurança com diversos países e que facilitam a exportação de produtos aeronáuticos brasileiros.
  Nesta seção 5.17, “acordo” abrange diversos termos tais como protocolos de entendimento,
  memorandos de entendimento, arranjos de trabalho, dentre outros.

  5.17.2. Esses acordos visam à cooperação entre autoridades de aviação civil para estabelecer
  procedimentos específicos visando o reconhecimento e uniformização de atividades executadas
  pela outra Parte. Tais acordos geram maior confiança entre as Partes, tendo como principal
  benefício a eliminação ou mitigação de redundâncias. O escopo desses acordos inclui, mas
