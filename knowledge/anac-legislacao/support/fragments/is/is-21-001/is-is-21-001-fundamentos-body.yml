title: FUNDAMENTOS
text: 'FUNDAMENTOS

  3.1. A Resolução ANAC nº 30/2008, em seu artigo 14, estabelece que a Instrução Suplementar
  é norma de caráter geral, que objetiva esclarecer, detalhar e orientar a aplicação de requisito
  previsto em RBAC. O parágrafo 1º do mesmo artigo determina que, para demonstrar o cumprimento
  de requisito previsto em RBAC, o administrado poderá adotar os meios e procedimentos previamente
  especificados em IS ou apresentar meio ou procedimento alternativo devidamente justificado,
  exigindo-se, nesse caso, a análise e concordância expressa da ANAC. O meio ou procedimento
  alternativo deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito
  aplicável ou concretizar o objetivo do procedimento normatizado em IS.

  3.2. O art. 68 da Lei nº 7.565, de 19 de dezembro de 1986, define a emissão de Certificado
  de Tipo e o vincula à emissão de certificado de aeronavegabilidade.

  3.3. A Subparte B do RBAC 21 estabelece os requisitos procedimentais para a emissão de Certificados
  de Tipo, sendo alguns deles também aplicáveis ao Certificado Suplementar de Tipo - CST e
  emendas aos CT. Diferenças especificas dos CST são estabelecidas na Subparte E do RBAC 21.

  3.4. A Subparte D do RBAC 21 determina condições para aprovar modificações ao projeto de
  tipo, aplicáveis tanto para emendas de CT como aos CST.

  3.5. A Subparte J do RBAC 21 estabelece requisitos para Certificação de Organização de Projeto.'
