text: 'z) GTPR Gerência Técnica de Programas de Certificação (ANAC)

  aa) ICA Instruções de Aeronavegabilidade Continuada (Instructions for Continued Airworthiness)

  ab) IS Instrução Suplementar

  ac) LMA Lista de Modelos Aprovados

  ad) MIL Military Standards (Norma, Especificação Militar)

  ae) MMEL Master Minimum Equipment List (Lista Mestra Mínima de Equipamentos)

  af) MOC Means of Compliance (Métodos de Cumprimento de Requisitos)

  ag) MPR Manual de Procedimentos

  ah) OSD Operational Suitability Data (Dados Relevantes à Operação)

  ai) PCP Profissional Credenciado em Projeto

  aj) PMD Peso Máximo de Decolagem

  ak) RBAC Regulamento Brasileiro da Aviação Civil (ANAC)

  al) RFMS Rotorcraft Flight Manual Supplement

  am) RT Responsável Técnico

  an) RTCA Radio Technical Commission for Aeronautics

  ao) SAE Society of Automotive Engineers

  ap) SAR Superintendência de Aeronavegabilidade (ANAC)

  aq) SEGVOO 001 Formulário de Registro de Grande Alteração e Grande Reparo (ANAC)

  ar) SEI Sistema Eletrônico de Informações

  as) STC Supplemental Type Certificate (emitido pela FAA, TCCA, EASA, e outras autoridades
  de certificação estrangeiras)

  at) TCCA Transport Canada Civil Aviation

  au) TFAC Taxa de Fiscalização da Aviação Civil'
