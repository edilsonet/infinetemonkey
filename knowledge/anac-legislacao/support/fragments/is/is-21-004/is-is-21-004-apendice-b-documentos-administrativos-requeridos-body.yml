title: APÊNDICE B - DOCUMENTOS ADMINISTRATIVOS REQUERIDOS
text: 'APÊNDICE B - DOCUMENTOS ADMINISTRATIVOS REQUERIDOS


  Nº

  Tipo de Documento

  CST

  F-400-04 (SEGVOO 001)

  01

  Formulário F-300-03 ou F-101-11, requerimento, ou uma carta de solicitação de aprovação
  de grande modificação, com as informações solicitadas em tal formulário. (4)

  X

  X

  02

  Declaração de responsabilidade pela modificação, informando o nome, endereço e CPF ou número
  de registro no CREA do RT pela modificação perante a ANAC.

  X

  X

  03

  Número da ART relativa ao serviço de engenharia a ser executado que contenha descrição do
  projeto submetido à ANAC. (A ART deve estar quitada para ser considerada válida)

  X

  X

  04

  Declaração do proprietário de cada aeronave protótipo autorizando o requerente a utilizar
  a aeronave como protótipo para a certificação do projeto.

  X (1) (2)

  --

  05

  Declaração do proprietário da aeronave, autorizando o requerente a conduzir o processo de
  certificação da modificação

  --

  X (1) (2)

  06

  Autorização para o piloto da ANAC-SAR-GCPP participar dos ensaios em voo, isentando a ANAC-SAR-GCPP
  de quaisquer ônus e responsabilidades por ocasionais danos ocorridos na aeronave durante
  a realização dos ensaios em voo.

  X (3)

  X (3)

  07

  Formulário F-400-05, Ficha de Dados Complementares. (4)

  X (1)

  X (1)

  08

  Formulário F-400-06, Ficha de Configuração dos Instrumentos e Equipamentos Instalados na
  Aeronave. (4)

  X

  X

  09

  Cópia do comprovante de pagamento da TFAC.

  X

  X

  10

  Formulário F-300-18G, Declaração de Conformidade, preenchida e assinada pelo RT. (4)

  X (5)

  X (5)

  11

  Declaração do requerente de cumprimento com requisitos (seção 21.20 e parágrafo 21.97(a)(3)
  do RBAC 21).

  X(6)

  --

  12

  Declaração do requerente de cumprimento com requisitos para os OSD (parágrafo 21.107-I(e)(3)
  do RBAC 21).

  X(7)

  --

  (1) - requerido durante o processo, precedente às inspeções e ensaios.

  (2) - aplicável apenas quando o requerente não for o proprietário da aeronave.

  (3) - aplicável apenas para processos que requeiram ensaios em voo realizados pela ANAC.

  (4) - formulário disponível na página de internet da ANAC https://sistemas.anac.gov.br/certificacao/Form/Form.asp

  (5) - a ser entregue após o RT realizar a inspeção de conformidade.

  (6) - a ser entregue antes da conclusão do processo, depois de cumpridos todos os requisitos.

  (7) - a ser entregue antes da aprovação dos OSD.

  NOTA - Poderão ser necessários outros documentos, conforme a modificação pretendida'
