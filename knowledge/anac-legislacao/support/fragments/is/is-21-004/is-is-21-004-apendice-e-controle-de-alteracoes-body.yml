title: APÊNDICE E - CONTROLE DE ALTERAÇÕES
text: 'APÊNDICE E - CONTROLE DE ALTERAÇÕES


  ALTERAÇÕES REALIZADAS NA REVISÃO H

  ITEM

  ALTERADO

  ALTERAÇÃO REALIZADA

  Diversos

  Ajustes editoriais diversos sem impacto no conteúdo.

  2.1

  Atualização da revisão da IS revogada para G.

  4.1

  Inclusão da definição de OSD e renumeração dos itens subsequentes. 4.2(b) (antigo 4.1(b))
  Inclusão do termo em inglês correspondente à sigla ICA 4.2(g) (antigo 4.1(g)) Atualização
  da referência cruzada de 4.3 para 4.4. 4.4(d) Inclusão dos OSD como dados técnicos aprovados,
  e renumeração das alíneas subsequentes. 4.7 Inclusão da definição de grande modificação
  aos OSD. 4.13 Inclusão da definição de pequena modificação aos OSD. 5.1.1 Inclusão da NOTA
  4. 5.2.1(b)(I) Inclusão do texto completo para as siglas TCCA e EASA. 5.3.2 Inclusão da
  alínea (i) 5.4.3 Inclusão da NOTA 3. 5.4.4 Inclusão do texto completo para a sigla SEI,
  com adequação considerando o atual sistema de protocolo eletrônico. 5.4.5 Inclusão do texto
  completo para a sigla TFAC. 5.4.6 Substituição da referência ao formulário F-200-06 pelo
  F-101-06. 5.4.17 Remoção da MMEL do escopo desta seção (migrado para 5.4.18). 5.4.18 Nova
  seção sobre aspectos de MMEL (inclui o conteúdo migrado da seção 5.4.17). 5.4.19 Nova seção
  sobre aspectos de FCD. 5.4.20 (antigo 5.4.18) Inclusão do item 5.4.20.2. 5.6.2 Alteração
  dos critérios para cancelamento do processo de aprovação. 5.6.4 Inclusão da NOTA 2. 5.10
  Inclusão de novo item 5.10.4 com renumeração dos itens subsequentes. Apêndice A Inclusão
  das siglas FCD e OSD, com readequação da numeração dos itens. Apêndice B Inclusão da declaração
  de cumprimento com os requisitos de OSD na lista de documentos administrativos, com inclusão
  da nota de rodapé 7. Apêndice C, item C.1.1 Inclusão de nova alínea (f), com renumeração
  das alíneas posteriores. Apêndice E Atualização do apêndice para listar as alterações implementadas
  nesta revisão.'
