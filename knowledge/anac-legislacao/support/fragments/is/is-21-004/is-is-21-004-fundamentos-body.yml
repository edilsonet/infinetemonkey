text: 'Fundamentos

  O Art. 68 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que a autoridade de
  aviação civil (Lei nº 11.182, de 27 de setembro de 2005) emitirá certificado de tipo para
  aeronaves, motores e hélices que satisfizerem os requisitos aplicáveis dos Regulamentos
  Brasileiros da Aviação Civil - RBAC.

  O RBAC 21, em sua Subparte D, apresenta a classificação das modificações ao projeto de tipo,
  estabelece a forma de aprovação de pequenas e grandes modificações, bem como indica os requisitos
  de aeronavegabilidade aplicáveis a uma modificação.

  O RBAC 21, em sua Subparte E, estabelece requisitos para a emissão de um certificado suplementar
  de tipo para aprovação de grandes modificações.

  O parágrafo 43.5(b)-I do RBAC 43 estabelece a necessidade da emissão de um formulário aprovado
  pela ANAC para uma grande alteração.

  O parágrafo 43.7(i) do RBAC 43 estabelece que os serviços sejam executados com base em dados
  técnicos aprovados.

  A seção 43.9 do RBAC 43 estabelece o conteúdo, forma e disposição de registros de manutenção,
  manutenção preventiva, reconstrução e alteração em artigo aeronáutico.

  A seção 43.13 do RBAC 43 apresenta as regras de execução geral de manutenção, manutenção
  preventiva e alteração de artigo aeronáutico.

  A Resolução ANAC nº 30/2008, em seu artigo 14, estabelece que a Instrução Suplementar é
  norma de caráter geral, que objetiva esclarecer, detalhar e orientar a aplicação de requisito
  previsto em RBAC. O parágrafo 1º do mesmo artigo determina que, para demonstrar o cumprimento
  de requisito previsto em RBAC, o administrado poderá adotar os meios e procedimentos previamente
  especificados em IS ou apresentar meio ou procedimento alternativo devidamente justificado,
  exigindo-se, nesse caso, a análise e concordância expressa da ANAC. O meio ou procedimento
  alternativo deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito
  aplicável ou concretizar o objetivo do procedimento normatizado em IS.'
