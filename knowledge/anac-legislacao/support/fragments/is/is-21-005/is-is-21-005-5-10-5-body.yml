text: '5.10.5

  Incluído para explicar o que é a fase final do processo de certificação.

  5.11

  Incluído para informar que o requisitante de uma aprovação de artigo sob uma OTP deve declarar
  que cumpriu com todas as exigências da subparte O do RBAC 21 aplicáveis e que o artigo em
  questão atende aos requisitos de desempenho estabelecidos na OTP aplicáveis, vigente na
  data de requerimento.'
