text: '5.13.6

  Incluída a informação que artigos produzidos por uma oficina de manutenção, certificada
  pela ANAC, que serão utilizados em um produto (aeronave, motor ou hélice) que esteja em
  manutenção na oficina não precisa obter um CPAA.'
