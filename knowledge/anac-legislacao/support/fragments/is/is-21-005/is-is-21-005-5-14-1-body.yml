text: '5.14.1

  Migração do item 5.2.3, com alteração de redação, esclarecendo que o requerente deverá demostrar
  à ANAC que o artigo de sua fabricação satisfaz às exigências de projeto do produto final
  (aeronave, motor ou hélice), no qual será instalado, e/ou às normas e especificações aplicáveis.'
