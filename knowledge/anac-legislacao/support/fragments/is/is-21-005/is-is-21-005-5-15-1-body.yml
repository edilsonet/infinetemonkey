title: 5.15.1
text: '5.15.1

  Incluído para esclarecer que conforme definido nas seções 21.319 e 21.619 do RBAC 21, o
  detentor de um CPAA e/ou COP deve submeter todas as pequenas modificações de projeto à ANAC,
  de acordo com procedimentos previamente acordados e estabelecidos pela ANAC na aprovação.'
