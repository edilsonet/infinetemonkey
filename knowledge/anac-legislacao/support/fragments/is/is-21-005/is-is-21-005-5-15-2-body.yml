text: '5.15.2

  Incluído para esclarecer que Grandes modificações ou pequenas modificações de projeto em
  artigos classificados como críticos ou que tenham tempo de vida limite devem ser aprovados
  pela ANAC antes de serem implementados, mediante requerimento, que deve estar acompanhado
  dos documentos de substanciação, de análises de engenharia e de resultados de ensaios, quando
  aplicável.

  6

  Alteração de numeração e seção (Apêndices).

  6.1

  exclusão.

  7

  Alterado para Disposições finais

  7.1

  incluída subseção com texto da antiga 6.1.'
