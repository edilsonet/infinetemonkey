text: '5.5.4.3

  Incluído para esclarecer que 5.5.4.3 as marcações das OTPs adicionais devem ser listadas
  na seção frontal do Manual de Instalação referente à OTP primária do artigo e o artigo principal
  marcado de forma permanente e legível com uma declaração de que os demais requisitos de
  marcação OTP estão no manual de instalação.'
