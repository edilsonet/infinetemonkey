text: 'Fundamentos

  O parágrafo 3º do art. 68 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro
  de Aeronáutica - CBAer) dispõe sobre a necessidade de certificação de produtos aeronáuticos.

  O RBAC 21 estabelece os requisitos para a aprovação de artigos aeronáuticos para aplicação
  em aeronaves, motores e hélices.

  RBAC 21 - Subparte A, requisito 21.8 - Aprovação de artigos e 21.9 - Artigos para reposição
  e modificação.

  RBAC 21 - Subparte K: Aprovação de Artigos e sua Fabricação.

  RBAC 21 - Subparte O: Aprovação de Artigos Conforme uma Ordem Técnica Padrão e sua Fabricação.'
