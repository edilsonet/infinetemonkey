title: Introdução
text: 'Introdução

  Esta IS detalha o processo a ser executado para aprovação de um artigo elegível para instalação
  em um produto aeronáutico para os seguintes casos:

  sob um certificado de produto aeronáutico aprovado (CPAA);

  segundo um certificado de produto aeronáutico aprovado sob uma ordem técnica padrão (CPAA-OTP);

  em conjunto com procedimentos da certificação de tipo ou suplementar de tipo para um produto.

  A aprovação CPAA conforme o item 5.1.1 (a) é utilizada para aprovação de artigos de reposição
  ou modificação.

  A emissão de uma aprovação de um artigo para os casos enquadrados no item 5.1.1 (b) não
  garante a aprovação da instalação direta deste artigo em um produto aeronáutico (aeronave,
  motor e hélice).

  Conforme seções 21.319 e 21.619, o detentor de um CPAA e/ou COP deve submeter todas as pequenas
  modificações de projeto à ANAC, de acordo com procedimentos previamente acordados e estabelecidos
  pela ANAC na aprovação. Grandes modificações ou pequenas modificações de projeto em artigos
  classificados como críticos ou que tenham tempo de vida limite devem ser aprovados pela
  ANAC antes de serem implementados, mediante requerimento, que deve estar acompanhado dos
  documentos de substanciação, de análises de engenharia e de resultados de ensaios, quando
  aplicável.

  Modalidades de Aprovação

  Os artigos de emprego aeronáutico, produzidos no Brasil segundo projeto próprio ou sob licença,
  conforme previsto na seção 21.8 do RBAC 21, poderão ser certificados de acordo com uma das
  modalidades descritas nos itens 5.3 a 5.6 desta IS. Para as exceções, consultar item 5.13.

  Aprovação de artigos de reposição

  Esta modalidade é aplicável a artigos a serem instalados em uma aeronave, motor ou hélice,
  desenvolvidos para substituição de artigos originalmente aprovados como parte de um produto
  aeronáutico certificado de aeronave, motor ou hélice.

  A aprovação será concedida quando o requerente demonstrar que a peça considerada é idêntica
  àquela do projeto de tipo aprovado.

  A demonstração de cumprimento de requisitos e, portanto, a consequente aprovação de um artigo
  pode ser feita segundo uma das seguintes formas:

  Cópia idêntica da original, por meio de acordo de licença para fabricação. O requerente
  deve apresentar um documento emitido pelo detentor do Certificado de Tipo (CT) ou Certificado
  Suplementar de Tipo (CST) do produto onde o artigo será instalado ou pelo detentor de uma
  aprovação de projeto segundo uma OTP ou TSO do artigo, disponibilizando e autorizando o
  uso de todos os dados técnicos necessários para a fabricação do produto apresentado para
  certificação. O acordo de licença é um meio para demonstrar que o artigo de reposição é
  idêntico ao artigo originalmente aprovado e que os dados apresentados estão aprovados pela
  ANAC-GCPP ou por outra autoridade de aviação civil reconhecida pela ANAC.

  Se por cópia idêntica da original, sem um acordo de licença de fabricação. A identicidade
  sem um contrato de licença normalmente só é possível quando o requerente possui e envia,
  como parte de seu requerimento, o desenho do projeto original, os relatórios de substanciação
  e todas as especificações e dados técnicos de produção relacionadas ao projeto do artigo.

  Engenharia reversa. É um método utilizado para replicar um artigo de reposição sem os dados
  de projeto e produção originais. O processo envolve a desmontagem, medição de dimensões,
  análises das características dos materiais empregados e das propriedades funcionais e desempenho
  em relação ao artigo original, ou seja, os materiais devem possuir as mesmas características
  de microestrutura e composição química, os mesmos processos especiais utilizados (por exemplo,
  soldas, tratamento térmico, revestimentos) e atingir o mesmo nível de confiabilidade em
  relação aos requisitos de aeronavegabilidade aplicáveis.

  Se por cálculo e ensaios, um conjunto de dados e uma declaração de que todo o projeto do
  artigo, incluindo materiais, processos, especificações de ensaios, compatibilidade sistêmica
  e intercambialidade, foi analisado e está suportado em ensaios e em relatórios de substanciação
  adequados.

  O fabricante poderá obter aprovação de artigos de reposição para produtos (aeronave, motor
  ou hélice) de fabricação estrangeira, com Certificado de Tipo - CT válido no Brasil.

  Aprovação de Artigos de Modificação

  Esta modalidade é aplicável a artigos a serem instalados em uma aeronave, motor ou hélice,
  desenvolvidos para modificação de um produto aeronáutico certificado.

  Um CPAA de modificação está associado necessariamente a um Certificado Suplementar de Tipo
  (CST) específico de um produto aeronáutico. Para informações sobre CST, recomenda-se a leitura
  das IS 21-004 e IS 21-001 em suas últimas revisões, respectivamente.

  Não é emitido COP para artigos produzidos com base em um CST limitado ou com base em um
  SEGVÔO 001. Só é possível obter um COP associado a um CST múltiplo.

  Aprovações segundo Ordem Técnica Padrão - OTP, funções não OTP, artigos OTP incompletos
  e suas modificações

  Aprovação segundo Ordem Técnica Padrão - OTP

  Esta modalidade é aplicável aos artigos que devem possuir padrões mínimos de desempenho,
  estabelecidos através de requisitos específicos chamados Ordens Técnicas Padrão - OTP, ou,
  em inglês, Technical Standard Order - TSO, que são usados para avaliar um artigo. Uma OTP
  é a adoção integral por referência de uma TSO, emitida pela Federal Aviation Administration
  dos Estados Unidos da América e estão disponíveis em https://drs.faa.gov/ .Cada OTP abrange
  um determinado tipo de artigo destinado ao uso em aeronaves civis, estabelecendo critérios
  e padrões mínimos de desempenho de forma a garantir o cumprimento com os requisitos de aeronavegabilidade
  ou operacionais.

  A aprovação de um artigo segundo uma OTP não o qualifica, automaticamente, para a instalação
  em aeronaves, motores e hélices certificados. Para tanto, é necessário aprovar a instalação
  de tal artigo segundo os requisitos de aeronavegabilidade aplicáveis à aeronave, motor ou
  hélice específicos. Esta etapa pode ocorrer durante a certificação original do projeto de
  tipo ou, posteriormente, como modificação do projeto de tipo aprovado, conforme os procedimentos
  da Subparte D ou E do RBAC 21, ou como uma alteração conforme o RBAC 43.

  Durante o processo de aprovação ou no próprio requerimento inicial, poderá ser solicitado
  pelo requerente um método alternativo de cumprimento para determinado requisito constante
  na OTP, que será usado para atender um ou mais critérios de desempenho especificados originalmente
  na OTP. Este desvio deve garantir necessariamente um nível equivalente de segurança em relação
  aos requisitos afetados da OTP e deve ser aprovado pela ANAC. O pedido de desvio deve incluir
  os dados técnicos comprovatórios que demonstram a equivalência do meio alternativo de cumprimento.

  A aprovação de um desvio pode incluir condições de instalação ou operação necessárias para
  garantir o nível de segurança equivalente. Essas condições são refletidas nas instruções
  de instalação ou operação. O requerente responsável pela instalação do artigo deve considerar
  quaisquer desvios da OTP e instruções relacionadas ao estabelecer a conformidade com os
  requisitos de aeronavegabilidade aplicáveis.

  Função não OTP

  Uma função classificada como não OTP é uma função fornecida por um artigo que não é coberta
  pelos padrões mínimos de desempenho estabelecidos pela OTP, não auxilia ou afeta a(s) função(ões)
  OTP do artigo e pode tecnicamente ser implementada fora do escopo da OTP.

  Um fabricante pode optar por integrar uma função não OTP em um artigo que cumpre com uma
  ou mais OTP para atender algum requisito adicional de aeronavegabilidade não previsto na
  OTP. A(s) função(ões) não OTP pode(m) ser incluída(s) e aceita(s) sem interferência, como
  parte da aprovação OTP, se o fabricante demonstrar que atende a todas as seguintes condições:

  O artigo é elegível para certificação sob uma OTP e cumpre os requisitos de desempenho da(s)
  OTP aplicável(eis);

  Não há OTP aplicável para a função não OTP;

  A função não OTP adicionada não afeta ou interfere na capacidade do artigo de atender aos
  padrões mínimos de desempenho exigido ou violar quaisquer limitações do artigo impostas
  pelo OTP ao artigo;

  Não há interferência na qualificação ambiental do artigo OTP e o os níveis de garantia de
  projeto de hardware e software suportam adequadamente a função não-OTP, conforme aplicável.

  A criticidade da função não OTP não deve exceder a especificada pela OTP para o artigo.
  Se a criticidade da função integrada não OTP for menor do que o artigo OTP, o fabricante
  deve adotar o nível mais alto de garantia de projeto especificados para a OTP para todas
  as funções do artigo ou empregar técnicas de particionamento adequadas.

  O requerimento deve conter a descrição da(s) função(ões) não OTP, incluindo as principais
  especificações de desempenho, bem como os níveis de qualificação de software, hardware,
  meio ambiente etc.

  Para a inclusão dessa função, o requerente deve prover:

  Os procedimentos de teste propostos para validar os requisitos de desempenho para a função
  não OTP, incluindo condições de teste ambientais RTCA/DO-160 (nível de revisão igual ao
  artigo OTP).

  As instruções/limitações de instalação e operação, incluindo quaisquer instruções para aeronavegabilidade
  continuada (ICA), para a(s) função(ões) não OTP, conforme aplicável.

  Requisitos de interface para a(s) função(ões) não OTP e procedimentos de teste de instalação
  aplicáveis.

  Modificação de projeto para uma função não OTP. Como o artigo OTP e qualquer função não
  OTP integrada são inseparáveis, todas as modificações de projeto subsequentes para a(s)
  função(ões) não OTP devem ser tratadas de forma idêntica às modificações de projeto feitas
  em uma função OTP.

  A critério da ANAC, as funções não OTP que forem incluídas em um artigo não serão consideradas
  aprovadas ao final do processo de certificação, mas poderão ser aceitas considerando a sua
  não interferência nas funções OTP. O requerente de um Certificado de Tipo (CT) ou Suplementar
  de Tipo (STC), e suas modificações, que utilizará tal artigo em seu projeto, poderá solicitar
  crédito de atividades de desenvolvimento pertinentes à função não OTP aceita pela ANAC,
  conforme aplicável. Porém, é importante notar que, uma vez que tais funções não OTP não
  apresentam uma definição padronizada, os aspectos funcionais deverão ser avaliados pelo
  requerente responsável pela instalação.

  Artigos OTP incompletos

  Os artigos OTP podem ser aprovados como sistemas incompletos. Um artigo OTP incompleto é
  aquele que demostra conformidade com apenas um subconjunto dos padrões mínimos de desempenho
  associados à OTP, podendo incluir instruções ou limitações para sua instalação necessárias
  para atingir o desempenho mínimo requerido. O requerente responsável pela instalação do
  artigo deve abordar os aspectos omissos dos padrões mínimos de desempenho no que se refere
  aos requisitos de aeronavegabilidade e quaisquer condições associadas à aprovação do artigo
  OTP. Este tipo de aprovação normalmente é aplicável a um subconjunto de um sistema geral
  mais amplo que possui uma função autônoma principal.

  Para a aprovação de um artigo OTP incompleto, todas as seguintes condições devem ser atendidas:

  O artigo incompleto fornece uma função principal e independente para a OTP.

  Deve(m) haver requisitos específicos na OTP para a função fornecida pelo artigo incompleto,
  ou seja, deve existir requisitos além dos requisitos gerais relacionados a software ou qualificação
  ambiental.

  Os padrões mínimos de desempenho associados à OTP permitem uma avaliação apropriada e adequada
  do artigo como um artigo incompleto.

  O requerente deve identificar e atender a todos os padrões de desempenho específicos na
  OTP que se aplicam ao artigo incompleto.

  Nos desenhos de instalação e/ou no manual de instalação deve ser documentado adequadamente
  as instruções e limitações detalhadas para a instalação e uso do artigo incompleto.

  Deve ser listado no manual de instalação os padrões mínimos de desempenho específicos que
  seu artigo atende. Isso deve ser fornecido fazendo referência aos parágrafos específicos
  da OTP. Essas informações ajudarão o instalador do artigo OTP a conhecer as limitações dos
  recursos do artigo.

  O artigo deve ser marcado de forma permanente e legível com pelo menos “INCOMP” adjacente
  à marcação do número da OTP e incluir instruções detalhadas nos desenhos de instalação ou
  no manual de instalação. Marcar o artigo como “INCOMP”, “Incompleto” ou Incomplete eliminará
  uma possível ambiguidade sobre o nível de conformidade do artigo.

  Modificações de projeto em artigos com múltiplas autorizações de marcações OTP

  As modificações feitas a um artigo com múltiplas autorizações de marcações OTP devem ser
  avaliadas em relação a cada OTP individualmente. Uma modificação de projeto classificada
  como maior ou menor em relação a uma determinada OTP não precisa ser necessariamente classificada
  como uma modificação maior ou menor sob todo o artigo. Desta forma, as modificações de projeto
  não devem ser avaliadas somente sob a OTP modificada, devendo ser verificada a sua abrangência
  e efeitos em relação ao conjunto de OTPs aprovadas para o artigo.

  Em alguns casos, marcar cada número de OTP individualmente na placa de identificação do
  artigo pode ser algo impraticável. Para esses casos, pode ser permitido que seja feita a
  marcação apenas do número da OTP primária na placa de identificação.

  As marcações das OTPs adicionais devem ser listadas na seção frontal do Manual de Instalação
  referente à OTP primária do artigo e o artigo principal marcado de forma permanente e legível
  com uma declaração de que os demais requisitos de marcação OTP estão no manual de instalação,
  (por exemplo, “Consulte Manual de Instalação para aprovações e/ou marcações OTP adicionais.”).

  Se for integrado um artigo OTP de um fornecedor no projeto OTP aprovado, o detentor da nova
  aprovação OTP também deve controlar o artigo OTP do fornecedor na medida necessária para
  garantir que o artigo aprovado atenda a OTP para o qual tem aprovação.

  Aprovação conjunta com o processo de Certificação de Tipo ou Suplementar de Tipo

  Refere-se aos artigos não enquadrados nos casos anteriores, aprovados como parte da aeronave,
  motor ou hélice durante o processo de certificação de tipo ou suplementar de tipo.

  O fabricante do produto aeronáutico (aeronave, motor ou hélice) ou o requerente de um CST
  é o responsável pela comprovação de que o artigo incorporado satisfaz às condições de segurança
  e operacionalidade exigidas, bem como pelo controle de qualidade do artigo incorporado,
  de maneira a assegurar que, na produção seriada, sejam mantidas as características do protótipo
  aprovado.

  Um fornecedor pode solicitar uma aprovação independente destes artigos, conforme procedimentos
  do item 5.3 se tiver interesse em fornecê-los diretamente ao mercado de peças de reposição.
  Caso contrário, a comercialização destes artigos deve ocorrer por meio do detentor do projeto
  (CT ou CST).

  Aprovação de projeto e autorização para fabricação

  O artigo aprovado por um CPAA só pode ser produzido por empresa detentora de Certificado
  de Organização de Produção - COP. O requerente de um COP deve comprovar que possuir um Sistema
  de Controle da Qualidade aplicado especificamente na produção de artigos aeronáuticos. As
  orientações e procedimentos para obtenção do COP estão descritos na edição vigente da IS
  21-006.

  É recomendado que os processos de certificação de organização de produção e de aprovação
  do artigo se desenvolvam simultaneamente.

  Procedimentos para solicitação do serviço

  O processo de aprovação de artigo aeronáutico é iniciado a partir da submissão de requerimento
  do fabricante (pessoa jurídica) à ANAC-GCPP, via protocolo eletrônico, no Sistema eletrônico
  de Informações - SEI. Para informações sobre como obter acesso ao SEI, consultar: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  Para peças de reposição ou modificação deve selecionar, no momento do protocolo, o tipo
  do processo SEI “Certificação de produto: certificado nacional de projeto de artigo - CPAA”,
  preencher o formulário F-125-01 e anexar todos os demais documentos requeridos na seção
  5.9 desta IS.

  Para peças sob um OTP deve selecionar, no momento do protocolo, o tipo do processo SEI “Certificação
  de produto: certificado nacional de projeto de artigo - CPAA - Subparte O”, preencher o
  formulário F-125-02 e anexar todos os demais documentos requeridos na seção 5.9 desta IS.

  Recomenda-se que novos solicitantes realizem uma consulta prévia à ANAC-GGPP antes de realizar
  o protocolo de solicitação de CPAA e/ou COP, por meio de um dos Canais de Atendimento disponíveis
  no portal da ANAC (https://www.gov.br/anac/pt-br/canais_atendimento).

  Documentação integrante do requerimento para Certificação do Projeto do artigo

  Os seguintes documentos devem ser apresentados à ANAC/GGCP juntamente com o requerimento
  (formulário F-125-01 ou F-125-02):

