title: introducao(i)
text: '(i) definição da base de certificação;

  (ii) descrição do artigo cuja aprovação é pretendida e dos números de parte que constituem
  o artigo;

  (iii) a apresentação da lista de verificação de cumprimento de requisitos, indicando para
  cada um dos requisitos aplicáveis, a forma de cumprimento (por ensaio, análise, cálculo
  etc.), o título, a versão, a seção e o número do documento de substanciação correspondente
  (relatório, desenho, especificação etc.). Tais documentos devem ser colocado à disposição
  da ANAC para análise quando solicitado;

  (iv) Quando aplicável, indicação do conjunto final (aeronave, motor ou hélice) onde o artigo
  deverá ser instalado, usado ou aplicado (RBAC 21, Subparte K apenas);'
