title: Objetivo
text: 'Objetivo

  Informar e esclarecer aos interessados os procedimentos e requisitos que devem ser observados
  no processo de aprovação de artigos aeronáuticos, para aplicação em aeronaves, motores e
  hélices, junto à Gerência de Certificação de Projeto de Produto Aeronáutico - ANAC-GCPP.

  Esta IS é aplicável a todos os fabricantes nacionais (pessoas jurídicas) que pretendem aprovar
  artigos aeronáuticos, para emprego em aeronaves, motores ou hélices.

  NOTA 1 - Um meio ou procedimento alternativo ao apresentado nesta IS pode ser utilizado,
  desde que devidamente justificado, exigindo-se nesse caso a análise e concordância expressa
  do órgão competente da ANAC. O meio ou procedimento alternativo mencionado deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável.'
