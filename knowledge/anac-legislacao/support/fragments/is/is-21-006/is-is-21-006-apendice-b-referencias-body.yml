title: APÊNDICE B - REFERÊNCIAS
text: 'APÊNDICE B - REFERÊNCIAS

  B.1 ANAC IS 43.9-002, Uso e preenchimento do Certificado de Liberação Autorizada

  B.2 ANAC IS 183-002, Processo de Credenciamento de Pessoa Física na SAR e orientações de
  atuação para os profissionais credenciados

  B.3 ABNT NBR 15100:2010, Sistemas de Gestão da Qualidade - Requisitos para organizações
  de aeronáutica, espaço e defesa

  B.4 AIA NAS-410, NAS Certification & Qualification of Nondestructive Test Personnel

  B.5 FAA AC 21-43, Production Under 14 CFR Part 21, Subparts F, G, K, and O.

  B.6 FAA AC 20-115, Airborne Software Assurance.

  B.7 FAA Order 8130.21, Procedures for Completion and Use of the Authorized Release Certificate,
  FAA Form 8130-3, Airworthiness Approval Tag.

  B.8 SAE ARP9005, Aerospace Guidance for Non-Deliverable Software.

  B.9 SAE ARP9114, Direct Ship Guidance for Aerospace Companies.

  B.10 SAE ARP9134, Supply Chain Risk Management Guidelines.

  B.11 SAE AS9006, Deliverable Aerospace Software Supplement for AS9100A.

  B.12 SAE AS9100, Quality Management Systems - Requirements for Aviation, Space, and Defense
  Organizations .

  B.13 SAE AS9102, Aerospace First Article Inspection Requirement.'
