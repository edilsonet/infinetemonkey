title: APÊNDICE C - ELEMENTOS DO SISTEMA DA QUALIDADE
text: 'APÊNDICE C - ELEMENTOS DO SISTEMA DA QUALIDADE

  A ANAC organiza os requisitos do sistema da qualidade para o detentor de um COP em 6 elementos.

  C.1 Controle de Projeto

  C.1.1 Configuração do projeto aprovado

  C.1.2 Categorização de peças

  C.1.3 Instruções de aeronavegabilidade

  C.1.4 Controle de modificações

  C.1.5 Garantia da qualidade de software embarcado

  C.2 Controle de Materiais

  C.2.1 Controle de fornecedores

  C.2.2 Recebimento

  C.2.3 Manuseio e armazenamento de materiais

  C.2.4 Identificação e rastreabilidade

  C.2.5 Material não conforme

  C.3 Controle de Produção

  C.3.1 Processos de fabricação

  C.3.2 Processos especiais e ensaios não destrutivos (END)

  C.3.3 Ensaios

  C.3.4 Ferramentais e dispositivos de medição

  C.3.5 Técnicas estatísticas

  C.3.6 Software para aceitação de produto

  C.4 Liberação Final

  C.4.1 Inspeções e ensaios do produto final

  C.4.2 Determinação de aeronavegabilidade

  C.5 Aeronavegabilidade Continuada

  C.5.1 Dificuldade em serviço

  C.5.2 Desvio de qualidade (Quality Escape)

  C.6 Gestão Organizacional

  C.6.1 Gerenciamento

  C.6.2 Controle de documentos e registros

  C.6.3 Treinamento

  C.6.4 Auditoria interna'
