text: 'APÊNDICE D - PRODUÇÃO SOB CERTIFICADO DE TIPO

  Este apêndice abrange a subparte F do RBAC 21. Os títulos de cada uma das seguintes seções
  deste apêndice se referem à seção aplicável da subparte F. Um fabricante de um produto sob
  a subparte F está autorizado a produzir e vender os artigos associados com o seu produto
  como peças de reposição para aquele produto apenas.

  D.1 Seção 21.121, Aplicabilidade

  D.1.1 O termo "produção sob certificado de tipo" se refere à produção por um detentor de
  CT ou seu licenciado, sem o benefício de uma aprovação de produção para esse produto ou
  artigo associado com ele.

  D.2 Seção 21.122, Localização ou mudança das instalações de fabricação

  D.2.1 Se a ANAC não tiver ônus indevidos em administrar os requisitos aplicáveis, o fabricante
  pode utilizar instalações industriais localizadas fora do Brasil.

  D.2.2 O detentor de CT deve obter uma aprovação da ANAC antes de fazer quaisquer alterações
  na localização de qualquer das suas instalações de produção.

  D.2.3 O detentor do CT deve notificar imediatamente a ANAC, por escrito, de qualquer alteração
  nas instalações de fabricação, que possam afetar a inspeção, a conformidade ou a aeronavegabilidade
  de seu produto ou artigo.

  D.2.4 Cada detentor de CT deve verificar com a ANAC os métodos de aprovação e de notificação.

  D.3 Seção 21.123, Produção sob Certificado de Tipo

  D.3.1 O parágrafo (c) requer que cada fabricante de um produto, ou artigo associado com
  ele, no âmbito de um CT mantenha os registros de inspeção e testes exigidos por 5 anos.
  Para peças críticas identificadas conforme o RBAC 45, seção 45.15 (c), a exigência de retenção
  de registros é de 10 anos. O início do período de 5 anos ou 10 anos de retenção de registros
  para um determinado produto ou artigo associado com ele corresponde à data da conclusão
  da fabricação do produto ou artigo. Esses registros permitirão ao detentor do CT comprovar
  junto à ANAC que as inspeções e ensaios requeridos para assegurar a conformidade com a subparte
  F foram devidamente preenchidos e documentados. Os fabricantes são obrigados a manter evidências
  de inspeções e ensaios requeridos que indiquem a conformidade ou não conformidade do produto
  ou artigo.

  D.3.2 O parágrafo (d) exige que cada fabricante, de um produto ou artigo fabricado sob um
  CT, permita à ANAC fazer qualquer inspeção ou ensaio (incluindo qualquer inspeção ou ensaio
  em uma instalação de fornecedor) necessários para determinar a conformidade. "Permitir"
  significa que o fabricante irá:'
