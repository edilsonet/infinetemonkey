title: apendice-f-relacao-de-documentos(k)
text: 'k) procedimento de voo de produção.

  F.2 O requerente deve manter esses documentos atualizados junto à ANAC/GTCO.

  F.3 É comum que a certificação de organização de produção ocorra em paralelo com a certificação
  de projeto, principalmente quando o projeto é complexo e a demonstração de cumprimento com
  requisitos se estende por período longo. Nesses casos, alguns dos documentos requeridos
  nas alíneas c a k do parágrafo F.1 só estarão disponíveis após a conclusão da certificação
  de projeto. Para esses casos, o requerente deve estabelecer um plano de certificação de
  organização de produção conforme modelo do apêndice J desta IS.'
