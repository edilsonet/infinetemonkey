title: apendice-g-acordo-entre-detentor-de-aprovacao-de-prod-586346(b)
text: 'b) especifica procedimentos para:

  I - um fornecedor estender os requisitos da ANAC e do detentor do COP para subfornecedores;
  e

  II - se notificar o detentor do COP em caso de maiores atividades extras no subfornecedor
  e/ou problemas significativos encontrados durante a fabricação.

  G.19 Mudanças significativas ao Sistema de Qualidade: exige que o detentor do COP seja notificado
  imediatamente sobre quaisquer alterações no sistema do fornecedor (avaliado pelo detentor
  do COP) que possam afetar a qualidade do fornecimento.

  G.20 Falhas, maus funcionamentos e defeitos: especifica ao fornecedor os requisitos necessários
  para comunicação de falhas, maus funcionamentos e defeitos para assegurar que o detentor
  do COP possa cumprir com os requisitos da ANAC.

  G.21 Acesso para o detentor do COP e para a ANAC: garante o acesso a, e a cooperação de,
  todas as instalações envolvidas na cadeia de suprimentos para o detentor do COP e para a
  ANAC. Isso permitirá:'
