text: 'APÊNDICE G - ACORDO ENTRE DETENTOR DE APROVAÇÃO DE PRODUÇÃO E FORNECEDOR

  G.1 A lista a seguir inclui elementos normalmente encontrados em acordos entre o detentor
  da aprovação de produção e o fornecedor. Orientações sobre o conteúdo de cada elemento são
  apresentadas, mas não significa que sejam exaustivas.

  NOTA 1 - O acordo com o fornecedor pode indicar sempre que o detentor de um COP encontrar
  um ou mais dos elementos não aplicáveis.

  G.2 Escopo'
