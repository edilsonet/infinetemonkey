title: apendice-g-acordo-entre-detentor-de-aprovacao-de-prod-586346(c)
text: c) a disposição de não conformidades é geralmente responsabilidade do detentor da aprovação
  de projeto. No entanto, pode ser aceitável para a ANAC que o detentor da aprovação de projeto
  delegue a aprovação de não conformidades às pessoas localizados na organização detentora
  da aprovação de produção e seus fornecedores, agindo assim como parte do detentor da aprovação
  de projeto; e
