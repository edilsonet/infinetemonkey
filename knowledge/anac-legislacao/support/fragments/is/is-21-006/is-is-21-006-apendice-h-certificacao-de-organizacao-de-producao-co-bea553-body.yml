cite: apendice-h-certificacao-de-organizacao-de-producao-co-bea553
title: 'APÊNDICE H - CERTIFICAÇÃO DE ORGANIZAÇÃO DE PRODUÇÃO: CONSÓRCIO MULTINACIONAL/MULTICORPORATIVO'
text: 'APÊNDICE H - CERTIFICAÇÃO DE ORGANIZAÇÃO DE PRODUÇÃO: CONSÓRCIO MULTINACIONAL/MULTICORPORATIVO

  H.1 Este apêndice fornece informações e critérios para avaliação e aprovação do sistema
  de qualidade de um consórcio multinacional ou multicorporativo em busca de um COP. Este
  apêndice não se aplica a um detentor CT que entre em um acordo de licenciamento com um fabricante
  detentor de um COP no momento da licença. A ANAC não considera tal acordo de licenciamento
  para a constituição de um COP.

  H.2 Um consórcio multinacional/multicorporativo consiste em um fabricante brasileiro e um
  ou mais fabricantes localizados fora do Brasil, que tenham concordado em formar uma única
  empresa para a produção de um determinado produto. Um consórcio geralmente existe apenas
  no nome, na medida em que não fabrique fisicamente um produto em um único local. O consórcio
  mantém a responsabilidade pelo projeto e qualidade do produto para o qual foi emitido o
  COP. No entanto, o consórcio pode atribuir a tarefa de fabricação para outras empresas parceiras
  ou fornecedores localizados no país ou em combinação com fabricantes localizados fora do
  Brasil.

  H.3 Requisitos

  H.3.1 A seção 21.135 do RBAC 21 exige que qualquer requerente de um COP forneça à ANAC um
  documento descrevendo como sua organização vai garantir a conformidade com a subparte G,
  certificados de organização de produção. A ANAC considera o consórcio multinacional ou multicorporativo,
  que busque obter um COP, como sendo o requerente. O requerente deve cumprir com os requisitos
  organizacionais descritos na seção 5.1.15 desta IS. O gestor responsável identificado no
  documento organizacional serve como ponto primário de contato entre a ANAC e a organização.

  H.3.2 A seção 21.137 do RBAC 21 requer que um detentor de aprovação de produção forneça
  e descreva por escrito um sistema de qualidade que assegure que cada produto ou artigo esteja
  conforme com seu projeto aprovado e em condição de operação segura. A ANAC considera a empresa
  consórcio como requerente, e as empresas parceiras como fornecedores.

  H.3.3 A empresa consórcio será nomeada no COP, juntamente com o endereço da empresa consórcio
  (possivelmente um escritório corporativo) e endereços da unidade principal e instalações
  de fabricação subordinadas. Extensão de um COP para instalações localizadas fora do Brasil
  pode ser autorizada quando houver acordo bilateral e não houver ônus indevidos para a ANAC.

  H.3.4 Se um COP for estendido para uma instalação localizada fora do Brasil, a ANAC continua
  a ser responsável pela gestão da certificação.

  H.3.5 No caso de consórcios multinacionais/multicorporativos, se uma empresa parceira ou
  fornecedor possuir um sistema de qualidade certificado pela ANAC para o seu próprio produto,
  o requerente ao COP ainda será obrigado a ter um sistema independente atendendo os requisitos
  da subparte G.

  H.3.6 O requerente ao COP funcionando como entidade corporativa, distribuidor ou montador
  terá um meio viável de garantir que todos os artigos, processos, procedimentos e produtos
  acabados sejam devidamente inspecionados quanto à conformidade com o projeto de tipo aprovado.

  H.4 Documentação do sistema de qualidade

  H.4.1 O requerente de um COP deve estabelecer um sistema e procedimentos de qualidade que
  satisfaçam as exigências do RBAC 21, seção 21.137 antes da emissão de um COP.

  H.4.2 Os dados do sistema da qualidade irão especificar claramente que todas as instalações
  (locais e fora do Brasil) estarão acessíveis à ANAC ou a uma autoridade de aviação civil
  agindo em nome da ANAC. Se os artigos ou serviços forem fornecidos por um fornecedor ou
  fabricante em um país fora do Brasil, a acessibilidade incluirá a análise dos dados (desenhos,
  especificações, procedimentos e registros de inspeção) e equipamentos pertinentes ao produto
  ou artigo produzidos sob o COP.

  H.4.3 O manual do sistema de qualidade proposto pelo requerente deverá conter detalhes suficientes
  que estabeleçam o sistema de qualidade e procedimentos da organização como uma entidade
  separada e independente (em vez de simplesmente incorporar por referência os sistemas de
  qualidade de suas empresas parceiras). Isto não exclui o uso de, ou referência a, partes
  aplicáveis do sistema de qualidade de uma empresa parceira, mas garante que o sistema do
  requerente será avaliado pelos seus próprios méritos. Isto também permite à ANAC realizar
  uma vigilância para garantir a conformidade com os regulamentos.

  H.5 Organização de Qualidade e Autoridade

  H.5.1 O gerente de qualidade do requerente terá acesso direto à alta administração do consórcio.

  H.5.2 A organização do sistema de qualidade do requerente terá uma gestão organizacional
  independente. Essa organização irá estabelecer o controle departamental sobre as empresas
  parceiras em relação à qualidade do produto conjuntamente produzido. As pessoas escolhidas
  para preencher esses cargos de gestão terão uma subordinação claramente definida e separada
  à alta administração do requerente, e não a qualquer empresa para a qual eles tenham trabalhado
  ou para a qual elas estejam trabalhando atualmente.

  H.5.3 A responsabilidade e a autoridade dos empregados na gestão organizacional do consórcio
  serão claramente definidas nos dados do sistema de qualidade. Isso inclui o relacionamento
  do consórcio com as áreas de qualidade e produção das empresas parceiras.

  H.5.4 O requerente pode propor para atribuir autoridade de inspeção a um número limitado
  de seus funcionários para garantir a qualidade dos produtos que estejam sendo produzidos.
  Embora nenhum número mínimo de empregados possa ou deva ser especificado pela ANAC, a viabilidade
  dos procedimentos do sistema de qualidade propostos será avaliada em relação ao número de
  funcionários disponíveis para implementar o sistema.

  H.5.5 É particularmente importante estabelecer a responsabilidade pelo cumprimento do RBAC
  21, seção 21.137 no caso de um consórcio multinacional. Isso ocorre porque as responsabilidades
  dos fornecedores localizados fora do Brasil, em relação aos seus outros produtos sob gestão
  de outras autoridades, podem ser incompatíveis com as exigidas pela seção 21.137. A responsabilidade
  pela conformidade do produto do consórcio sabrecai sobre o detentor do COP. Essa responsabilidade
  direta será compreendida pela gestão do requerente e pela gestão do fornecedor, e estará
  descrita no manual da qualidade.

  H.5.6 O fato de que a produção do produto do requerente pode ocorrer em um país fora do
  Brasil não afeta a aplicabilidade dos regulamentos e outros documentos da ANAC relativos
  à gestão e vigilância do detentor da aprovação de produção.'
