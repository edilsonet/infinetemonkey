text: 'e) sistemas e equipamentos.

  I.2 Cada uma dessas áreas é ainda identificada pelo código do RBAC aplicável. Cada peça
  categorizada é seguida por um número ou números entre parênteses. Esses números identificam
  o RBAC aplicável e a categoria designada, 1 ou 2. Por exemplo, sob a área “Montagens estruturais”,
  o item “Fuselagem” deve ser seguido por “23-1” e “25-1”. Isto indica que os RBAC 23 e 25
  são aplicáveis e que a fuselagem é categoria 1 em ambos os casos.

  I.3 Classificação Categoria 1

  I.3.1 Recebe a classificação como Categoria 1 um conjunto ou suas partes, cuja falha poderia
  impedir a continuidade de voo ou de pouso seguro, resultando em consequências que reduziriam
  a margem de segurança, grau de desempenho, ou causariam perda da capacidade para conduzir
  certas operações de voo.

  I.4 Classificação Categoria 2

  I.4.1 Receber a classificação como Categoria 2 um conjunto ou suas partes, cuja falha não
  impediria a continuidade de voo ou de pouso seguro, mas como consequências resultantes poderiam
  reduzir a capacidade da aeronave ou a capacidade da tripulação de enfrentar condições operacionais
  adversas ou falhas subsequentes.

