title: APÊNDICE J - PLANO DE CERTIFICAÇÃO DE ORGANIZAÇÃO DE PRODUÇÃO
text: 'APÊNDICE J - PLANO DE CERTIFICAÇÃO DE ORGANIZAÇÃO DE PRODUÇÃO

  J.1 Para a emissão de um COP ou inclusão de um novo produto no RLP, o requerente deve demonstrar
  à GTCO que atende aos requisitos da subparte aplicável.

  J.2 Caso a certificação de organização de produção ocorra de forma concomitante com a certificação
  de projeto, e o requerente não possa apresentar todos os documentos do apêndice F no momento
  do requerimento, ele deve apresentar um plano de certificação de organização de produção,
  que contenha todos os documentos que serão entregues até o final do processo.

  J.3 Juntamente com o plano de certificação de organização de produção, pode ser estabelecido
  o acompanhamento que a ANAC realizará na fabricação de protótipos. A ANAC define as atividades
  de fabricação que serão acompanhadas com base em 3 (três) fatores:

  J.3.1 Segurança da operação do protótipo, para fins de emissão da Autorização de Inspeção
  de Tipo;

  J.3.2 Complexidade e criticidade do processo produtivo, para obtenção do COP;

  J.3.3 Criticidade do produto ou artigo para ensaio de certificação de tipo.

  J.4 As tabelas a seguir são utilizadas como modelo para estabelecimento de um plano de certificação
  de organização de produção, e são utilizadas em reuniões periódicas de acompanhamento realizadas
  entre o requerente e a GTCO.

  A. Planejamento da Certificação.

