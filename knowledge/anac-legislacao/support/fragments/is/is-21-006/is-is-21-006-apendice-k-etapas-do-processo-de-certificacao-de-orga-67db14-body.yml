text: 'APÊNDICE K - ETAPAS DO PROCESSO DE CERTIFICAÇÃO DE ORGANIZAÇÃO DE PRODUÇÃO

  K.1 Requerimento

  K.1.1 Os documentos relacionados no apêndice F desta IS, devem ser apresentados à ANAC/GTCO
  pelo requerente de um COP juntamente com o requerimento por meio do formulário F-300-03.

  K.1.2 Caso a certificação de organização de produção ocorra de forma concomitante com a
  certificação de projeto, e o requerente não possa apresentar todos os documentos do apêndice
  F no momento do requerimento, ele deve apresentar um plano de certificação de organização
  de produção, que contenha todos os documentos que serão entregues até o final do processo.

  K.1.3 Antes de passar para a próxima etapa, a ANAC/GTCO confere se o requerente é elegível
  à solicitação pretendida e se os documentos necessários foram enviados.

  K.2 Análise e adequação de documentos

  K.2.1 Os documentos enviados pelo requerente são analisados para verificar o atendimento
  aos requisitos da subparte aplicável. A ANAC utiliza o formulário F-300-28 preenchido pelo
  requerente para realizar essa análise.

  K.2.2 O requerente deve corrigir eventual falha na documentação e fornecer informações adicionais
  solicitadas pela ANAC nesta etapa.

  K.3 Avaliação Inicial

  K.3.1 Após o envio e análise de todos os documentos necessários, a ANAC realiza uma auditoria
  de avaliação inicial nas instalações do requerente, para verificar a implementação do sistema
  da qualidade apresentado e para se assegurar de que o requerente é capaz de produzir produtos
  ou artigos em conformidade com os dados de projeto aprovados.

  K.3.2 O requerente deve tomar as ações corretivas apropriadas para eventuais não conformidades
  identificadas pela ANAC nesta etapa.

  K.4 Inspeção do primeiro produto ou artigo

  K.4.1 A ANAC inspeciona o primeiro produto ou artigo fabricado em relação ao projeto aprovado
  para se assegurar de que o requerente é capaz de produzir produtos ou artigos em conformidade
  com os dados de projeto aprovados.

  K.5 Emissão do COP

  K.5.1 A conformidade do Sistema da Qualidade com o RBAC 21 e a conformidade do primeiro
  produto ou artigo com os dados de projeto aprovados são condições fundamentais para a emissão
  de um COP e do respectivo RLP.

  K.6 Vigilância continuada

  K.6.1 Concluído o processo de certificação de organização de produção, inicia-se a vigilância
  continuada realizada pela ANAC. Destacam-se dentre as atividades de vigilância continuada
  realizadas pela ANAC:'
