text: 'd) compreender e cumprir os requisitos das subpartes H e L do RBAC 21.

  L.3.1.5 A vigilância continuada e o monitoramento de todos os indivíduos autorizados e suas
  atividades, independentemente da localização, incluindo o escopo da vigilância e sua frequência.

  L.3.1.6 Métodos para manter registros adequados para cada indivíduo autorizado. Isso inclui
