title: Desenvolvimento do Assunto
text: 'Desenvolvimento do Assunto

  Informações Gerais

  Público alvo. Esta IS é aplicável aos requerentes ou detentores de um Certificado de Organização
  de Produção de acordo com as subpartes G, K e O do RBAC 21, que serão referidos no decorrer
  deste documento como detentores de um COP, ou de produção sob um Certificado de Tipo de
  acordo com a subparte F do RBAC 21.

  Aplicabilidade. As seções 21.131, 21.301 e 21.601 descrevem os requisitos para emissão de
  Certificado de Organização de Produção e regras aplicáveis aos detentores de tais certificados.
  A seção 21.601 também inclui requisitos para emissão de cartas de aprovação segundo uma
  OTP.

  NOTA 1 - O apêndice D desta IS provê informações para os detentores de certificado de tipo
  produzindo sob a subparte F.

  Elegibilidade. A Seção 21.132 descreve os requisitos de elegibilidade para um requerente
  a um Certificado de Organização de Produção segundo a Subparte G. Requerentes a um Certificado
  de Organização de Produção devem possuir:

  um Certificado de Tipo (CT) em vigor;

  um Certificado Suplementar de Tipo (CST); ou

  direitos de propriedade sobre um CT ou CST, segundo um acordo de licença.

  Processo de certificação de organização de produção

  As seções 21.133, 21.303 e 21.603 determinam que o requerente a uma certificação de organização
  de produção proceda na forma e maneira descrita pela ANAC.

  As seções 21.303 e 21.603 contêm requisitos adicionais sobre informações que devem ser fornecidas
  pelo requerente juntamente com o requerimento. Os requerentes devem consultar a seção aplicável
  para requisitos relativos ao tipo de aprovação de produção que pretendam obter.

  Para o requerimento de um COP ou de emenda a um COP segundo a subparte G, K ou O, o requerente
  deve utilizar o formulário F-300-03. Esse formulário deve ser encaminhado à Gerência Técnica
  de Certificação de Organizações e Inspeção (GTCO), da Superintendência de Aeronavegabilidade
  (SAR). O requerimento para emenda ao Registro de Limitação de Produção (RLP) deve seguir
  o mesmo processo.

  O apêndice F desta IS fornece ao requerente de um COP a relação de documentos que deve ser
  enviada para a ANAC/GTCO juntamente com o formulário de requerimento. Em alguns casos, a
  certificação de organização de produção pode ocorrer de forma concomitante com a certificação
  de projeto. Para gerir o processo nesses casos, deve-se estabelecer um plano de certificação
  de organização de produção, conforme o exemplo apresentado no apêndice J desta IS.

  O apêndice K apresenta as etapas do processo de certificação de organização de produção.

  Requisitos Organizacionais

  As seções 21.135, 21.305 e 21.605 estabelecem que cada requerente ou detentor de um COP
  deve fornecer à ANAC um documento descrevendo como sua organização irá assegurar o cumprimento
  com a subparte aplicável. Esse documento deve descrever as responsabilidades atribuídas,
  as autoridades delegadas, e a relação funcional dos responsáveis pela qualidade com a alta
  direção e com outros componentes organizacionais. Esse documento deve, também, identificar
  o gestor responsável do requerente ou do detentor de um COP.

  A ANAC reconhece que as empresas têm diferentes modelos de negócios e estruturas organizacionais.
  A intenção dos requisitos organizacionais é obter um compromisso da alta direção para:

  estabelecer um sistema da qualidade que cumpra com as disposições das subpartes aplicáveis
  e assegure que cada produto e artigo produzido esteja conforme seu projeto aprovado e esteja
  em condição de operação segura;

  buscar a melhoria contínua do sistema da qualidade;

  estabelecer um ponto primário de contato entre a ANAC e o requerente ou detentor; e

  descrever como o requerente ou detentor irá reportar falhas, maus funcionamentos ou defeitos
  para a ANAC, em cumprimento com o RBAC 21, seção 21.3.

  Gestor Responsável. Além de servir como ponto primário de contato com a ANAC, o gestor responsável
  deve, dentro da organização do requerente ou detentor, ser responsável por, e ter autoridade
  sobre todas as operações de produção executadas sob o RBAC 21. Adicionalmente, o gestor
  responsável deve confirmar que os procedimentos descritos no manual da qualidade estão em
  vigor e que o requerente ou detentor de um COP satisfaz os requisitos regulamentares aplicáveis.
  O gestor responsável pode delegar funções e identificar pontos alternativos de contato.
  Qualquer delegação deve ser estabelecida no documento requerido nas seções 21.135, 21.305
  e 21.605.

  Sistema da Qualidade

  Esta subseção fornece informações e descreve critérios para o estabelecimento e manutenção
  de um sistema da qualidade. Requerentes e detentores de uma aprovação de produção podem
  utilizar este documento como suporte para atendimento às seções 21.137, 21.307, e 21.607.

  A seção 21.137, determina que cada requerente ou detentor de uma aprovação de produção estabeleça
  e descreva, por escrito, um sistema da qualidade que assegure que produtos e artigos estejam
  em conformidade com seu projeto aprovado e em condição de operação segura.

  A intenção é que cada requerente ou detentor desenvolva um sistema da qualidade que atenda
  simultaneamente às suas necessidades e aos requisitos. Por consequência, os requisitos para
  um sistema da qualidade de um requerente ou detentor de uma aprovação de produção são proporcionais
  ao tamanho e complexidade do produto ou artigo produzido. Os requisitos do sistema da qualidade
  abrangem os assuntos destacados nos parágrafos 5.2.5 a 5.2.18 a seguir.

  A ANAC aborda esses 14 assuntos em 6 elementos do sistema da qualidade por meio do formulário
  F-300-28, Questionário de avaliação de sistemas da qualidade. Esse formulário, que deve
  ser preenchido pelo requerente e mantido atualizado pelo detentor de um COP, fornece orientações
  sobre a forma de atender satisfatoriamente cada um dos requisitos. Ele é utilizado pela
  ANAC na certificação inicial e durante a vigilância continuada. O apêndice C detalha esses
  6 elementos.

  Controle de dados de projeto

  O parágrafo 21.137(a) requer procedimentos para controle de dados de projeto e modificações
  subsequentes, para assegurar que apenas dados atualizados, corretos e aprovados sejam utilizados.

  O regulamento estabelece que detentores de um COP tenham procedimentos para controle de
  dados de projeto. Esses procedimentos devem assegurar adequado armazenamento, manutenção
  e proteção desses dados. Além disso, detentores devem assegurar que os dados de projeto
  estejam identificados, controlados, e disponíveis para aquelas pessoas que os utilizem.
  Também são exigidos procedimentos para aprovação, documentação e controle de modificações
  de dados de projeto.

  Modificações em projeto, produção, e processos especiais devem ser aprovadas de forma aceitável
  pela ANAC. Modificações de projeto necessárias para corrigir condições inseguras devem ser
  incorporadas nos dados de projeto aprovados pela ANAC. Em conformidade com o parágrafo 21.50(b),
  Instruções para Aeronavegabilidade Continuada (Instructions for Continued Airworthiness
  - ICA) devem ser mantidas atualizadas com as modificações de projeto.

  Controle de documentos

  O parágrafo 21.137(b) requer procedimentos para o controle de documentos e dados do sistema
  da qualidade, e subsequentes modificações, para assegurar que somente dados e procedimentos
  vigentes, corretos e aprovados sejam utilizados.

  Requerentes ou detentores de um COP devem ter procedimentos para assegurar adequado armazenamento,
  manutenção, e proteção de documentos e dados, conforme requerido pelo parágrafo 21.137(k).
  Adicionalmente, detentores devem assegurar que documentos e dados do sistema da qualidade,
  incluindo etiquetas de identificação e formulários, sejam identificados, controlados, e
  estejam disponíveis para as pessoas que os utilizem.

  Deve haver procedimentos para documentação, aprovação e controle de modificações dos documentos
  e dados do seu sistema da qualidade.

  O detentor de um COP pode optar por armazenar seus documentos em papel ou eletronicamente,
  desde que cópias sejam disponibilizadas para a ANAC quando solicitadas.

  Controle de fornecedores

  Fornecedor é uma pessoa em qualquer nível na cadeia de abastecimento que forneça um produto,
  artigo ou serviço utilizado ou consumido no projeto ou fabricação, ou instalado em um produto
  ou artigo. O parágrafo 21.137(c) requer procedimentos para garantir que cada produto, artigo
  ou serviço fornecido esteja conforme os requisitos do detentor de um COP. Essa seção também
  requer que o detentor de um COP estabeleça procedimentos que exijam que cada fornecedor
  informe ao detentor do certificado de organização de produção se, em um produto ou artigo
  liberado pelo fornecedor, for encontrada posteriormente alguma não conformidade com os dados
  de projeto aplicáveis.

  Consulte a subseção 5.3 da presente IS para obter informações adicionais sobre quais procedimentos
  um programa de controle fornecedor típico deve conter.

  O detentor de um COP é responsável por determinar que todos os produtos e artigos estejam
  em conformidade com o projeto de tipo aprovado e em condições de operação segura. Essa responsabilidade
  não pode ser delegada a, ou aliviada pelo uso de fornecedores aprovados ou não.

  Controle do Processo de Fabricação

  O parágrafo 21.137(d) requer procedimentos para controle do processo de fabricação para
  assegurar que cada produto ou artigo esteja conforme seu projeto aprovado. O requerente
  ou detentor de um COP deve:

  ter procedimentos para assegurar que todos os processos de fabricação (incluindo processos
  especiais) que tenham sido identificados e definidos nos dados de projeto aprovados pela
  ANAC sejam aplicados no processo produtivo;

  assegurar que as instruções de trabalho e suas revisões sejam aprovadas, controladas, documentadas,
  e que sejam disponibilizadas para as pessoas que as utilizam;

  assegurar que pessoal apropriado substancie e aprove qualquer modificação ou qualquer novo
  processo de fabricação; e

  manter a rastreabilidade durante todo o processo de fabricação, desde a matéria prima até
  o produto ou artigo completo. Produtos ou artigos introduzidos na produção antes da completa
  aceitação pela qualidade devem ter um processo para identificação, controle e segregação.

  Uso de software

  O detentor de um COP que desenvolva software embarcado pode obter instruções adicionais
  na Society of Automotive Engineers (SAE), Aerospace Standard (AS) 9006 e Deliverable Aerospace
  Software Supplement for AS9100.

  O detentor de um COP que utilize software para projeto, fabricação, inspeção, testes, aceitação
  ou calibração de um produto ou artigo, pode obter instruções adicionais na Society of Automotive
  Engineers (SAE), Aerospace Recommended Practice (ARP) 9005, Aerospace Guidance for Non-Deliverable
  Software.

  Os procedimentos podem permitir, no caso de emergência, a utilização de software “não liberado”
  nos processos de aceitação. Esses procedimentos devem incluir um meio de localizar e remover
  da cadeia produtiva os produtos ou artigos que tenham sido fabricados, inspecionados ou
  testados pelo software “não liberado” quando necessário.

  Caso um software “não liberado” seja utilizado para a aceitação de um produto ou artigo,
  esse produto ou artigo deve ser identificado como não conforme até que o software usado
  seja aprovado e liberado. Cada produto ou artigo afetado deve ser identificado por um número
  de série individual e único para assegurar sua remoção, caso necessário. O produto ou artigo
  não deve ser liberado para utilização até que todo o software de aceitação tenha sido aprovado,
  a menos que um método alternativo, aprovado pela ANAC, seja utilizado. Um sistema de remoção
  (recall) não é considerado um método alternativo de aceitação de produto para liberação
  final de produtos ou artigos.

  A responsabilidade funcional pela garantia da qualidade de softwares deve ser parte do sistema
  da qualidade submetido para a ANAC. A organização responsável pela garantia da qualidade
  de software deve ter independência funcional que permita avaliações objetivas. A organização
  responsável pela garantia da qualidade de software deve ter autoridade e responsabilidade
  para identificar e avaliar problemas e assegurar a implementação de ações corretivas quando
  identificadas deficiências. Além disso, essa organização deve:

  assegurar que todas as tarefas executadas por software estejam claramente e adequadamente
  descritas em procedimentos documentados;

  verificar se fornecedores que utilizem meios de fabricação, inspeção ou testes auxiliados
  por computador, ou que utilizem os dados digitais associados a esses meios para aceitação
  de produtos ou artigos, implementaram controles apropriados;

  ter autoridade final para formalmente liberar softwares e dados digitais relacionados para
  aceitação de produtos ou artigos; e

  assegurar que ações corretivas tenham sido implementadas para eliminar qualquer falha previamente
  identificada.

  Inspeções e testes

  O parágrafo 21.137(e) requer procedimentos para inspeções e testes utilizados para assegurar
  que cada produto e artigo esteja em conformidade com seu projeto aprovado. Esses procedimentos
  devem incluir o seguinte, conforme aplicável:

  um teste (ensaio) em voo de cada aeronave produzida, a menos que a aeronave deva ser exportada
  como uma aeronave desmontada; e

  um teste funcional de cada motor de aeronave e de cada hélice produzidos.

  Detentores de um COP devem ter procedimentos documentando os métodos de inspeção para cada
  produto ou artigo para assegurar que eles estejam em conformidade com os dados de projeto
  aprovados pela ANAC. Esses procedimentos devem incluir métodos que assegurem a identificação
  do status da inspeção por meio do processo de fabricação e no estoque. Além disso, procedimentos
  devem assegurar que dispositivos utilizados na identificação do status da inspeção sejam
  controlados e somente liberados para pessoas autorizadas.

  Detentores de um COP devem estabelecer, manter e controlar os procedimentos e instruções
  de testes e modificações subsequentes. Devem assegurar que as organizações apropriadas participem
  das revisões nos procedimentos ou instruções de testes. Produtos ou artigos que tenham sido
  ajustados ou retrabalhados após a realização de testes de aceitação (de forma que o seu
  desempenho em teste possa ter sido afetado) devem ser retestados utilizando um processo
  aprovado.

  Detentores de um COP devem documentar no sistema da qualidade o uso de processos estatísticos
  para aceitação de produtos ou artigos, assegurando-se de que o critério para aceitação ou
  rejeição previna a aceitação de produtos ou artigos não conformes. Sobre a utilização de
  processos estatísticos:

  Deve haver planos de amostragens apropriados para cada tipo de produto ou artigo a ser aceito.
  O pessoal envolvido deve ser treinado em técnicas estatísticas de amostragem.

  Os responsáveis pelo projeto e produção devem participar da revisão, implementação e manutenção
  dos processos estatísticos utilizados para aceitação do produto ou artigo e dos controles
  de qualidade aplicáveis.

  Detentores de um COP que utilizem ensaios não destrutivos para verificação da conformidade
  de produtos ou artigos devem possuir procedimentos estabelecendo os critérios de aceitação
  e rejeição. Corpos de prova apropriados, com defeitos conhecidos, devem estar disponíveis
  para o pessoal que realize os ensaios não destrutivos (END). Detentores de um COP devem
  possuir procedimentos abordando a certificação e qualificação do pessoal que realize ensaios
  não destrutivos, os quais devem ser estabelecidos com base na norma NAS-410 emitida pela
  Aerospace Industries Association of America - AIA, ou norma equivalente.

  NOTA - A Associação do Comitê Brasileiro Aeroespacial de Ensaios Não Destrutivos (CBRAEND)
  é reconhecida para exercer, no âmbito da aviação civil, a função de Comitê Nacional Aeroespacial
  de END (National Aerospace Nondestructive Testing Board - NANDTB), nos termos da NAS-410.
  A adesão e a utilização dos serviços do CBRAEND são voluntárias.

  Detentores de um COP, que produzam uma aeronave completa, devem assegurar que procedimentos
  de ensaio em voo de produção, e subsequentes revisões, sejam submetidas e aprovadas pela
  ANAC. Pilotos de ensaio em voo devem ser plenamente qualificados e uma checklist de voo
  de produção deve ser adequadamente preenchida.

  Controle dos equipamentos de inspeção, medição e testes

  O parágrafo 21.137(f) requer procedimentos para assegurar a calibração e controle de todos
  os equipamentos de medição e testes usados para determinar a conformidade de cada produto
  ou artigo com seu projeto aprovado. Cada padrão de calibração deve ser rastreável a um padrão
  acreditado pela Rede Brasileira de Calibração (RBC) ou a outro padrão aceito pela ANAC.

  Detentores de um COP devem ter procedimentos para garantir que ferramentas, dispositivos
  e equipamentos sejam aprovados, periodicamente inspecionados e calibrados. Padrões utilizados
  para calibração devem ter exatidão adequada e ser rastreáveis a padrões pertencentes à RBC
  ou a outro padrão aceito pela ANAC. Quaisquer equipamentos requeridos para a realização
  de um processo especial, tais como ferramentas, dispositivos, instrumentos e cronômetros,
  devem estar disponíveis e calibrados.

  Detentores de um COP devem estabelecer um procedimento de controle de ferramentais que garanta
  que ferramentais e dispositivos de medição utilizados para aceitação de produtos ou artigos
  (incluindo equipamentos de END) sejam protegidos, mantidos, e usados em condições ambientais
  adequadas. Procedimentos devem assegurar que o detentor de um COP conduza as avaliações
  e tome as ações necessárias quando um produto ou artigo tiver sido aceito por um ferramental
  ou dispositivo de medição fora da tolerância de processo ou projeto.

  Estado de inspeção e teste

  O parágrafo 21.137(g) requer procedimentos para documentar o estado da inspeção e do teste
  de produtos e artigos fornecidos ou fabricados conforme o projeto aprovado.

  Detentores de um COP devem possuir procedimentos para definir como os registros das inspeções
  e testes devem ser gerados e mantidos. Além disso, o detentor de um COP deve assegurar-se
  de que artigos ou serviços fornecidos por fornecedores estejam conforme com os requisitos
  da ordem de compra, conforme aplicável. Registros dessas verificações devem ser gerados
  e mantidos.

  Detentores de um COP devem assegurar-se de que o estado de inspeção de produtos e artigos
  seja identificável durante todo o ciclo de produção, incluindo armazenamento. Adicionalmente,
  o detentor de um COP é responsável por gerar e manter registros de testes completos de aeronave,
  motor de aeronave, ou hélice.

  Controle de Produtos ou Artigos Não Conformes

  O parágrafo 21.137(h) requer procedimentos para assegurar que apenas produtos ou artigos
  que estejam em conformidade com seu projeto aprovado sejam instalados em um produto com
  certificado de tipo. Esses procedimentos devem estabelecer a identificação, documentação,
  avaliação, segregação e disposição de produtos e artigos não conformes. Somente pessoas
  autorizadas podem fazer as determinações de disposições. O parágrafo 21.137(h) também requer
  procedimentos para assegurar que os produtos ou artigos descartados tenham sido inutilizados.

  Detentores de um COP devem ter procedimentos para assegurar que uma Comissão de Revisão
  de Materiais (CRM) esteja estabelecida, documentada e operacional. Devem possuir, ainda,
  procedimentos que descrevam como são realizados a identificação, o controle e a disposição
  de produtos ou artigos não conformes.

  Pessoas autorizadas devem analisar os materiais não conformes para determinar se a aceitação
  da não conformidade constitui uma modificação maior ou menor aos dados de projeto aprovados
  pela ANAC. A ANAC aprovará, por meio do processo de aprovação de projeto, qualquer disposição
  da CRM classificada como modificação maior ao projeto aprovado.

  A alta direção deve revisar e analisar os dados dos materiais não conformes a fim de detectar
  tendências adversas e determinar níveis apropriados de ações corretivas e preventivas.

  A disposição para produtos e artigos deve ser realizada de uma maneira aceitável. O apêndice
  E desta IS fornece informação adicional para o controle e para a disposição de sucateamento
  ou recuperação de produtos ou artigos.

  Ações Corretivas e Preventivas

  O parágrafo 21.137(i) requer procedimentos para a implementação de ações corretivas e preventivas
  para eliminar as causas de uma não conformidade real ou potencial ao projeto aprovado ou
  ao sistema da qualidade aprovado.

  Detentores de um COP devem possuir procedimentos para eliminar a(s) causa(s) de não conformidades
  para prevenir recorrências. Ações corretivas devem ser apropriadas aos efeitos da não conformidade
  identificada e abordar o seguinte:

  análise da não conformidade;

  identificação da(s) causa(s) raiz(es) da não conformidade;

  avaliação da necessidade de ação corretiva para assegurar que a não conformidade não será
  recorrente;

  identificação e implementação das ações necessárias;

  registro dos resultados das ações tomadas;

  verificação da eficácia das ações corretivas tomadas; e

  desdobramento das ações corretivas necessárias para o fornecedor, quando for determinado
  que ele seja responsável pela não conformidade.

  Detentores de um COP devem possuir procedimentos para eliminar a(s) causa(s) de potenciais
  não conformidades para evitar a ocorrência. Ações preventivas devem ser apropriadas aos
  efeitos dos problemas potenciais e devem abordar o seguinte:

  identificação de potenciais não conformidades e suas causas;

  avaliação da necessidade de ação para evitar a ocorrência da não conformidade;

  identificação e implementação das ações necessárias; e

  registro do resultado das ações tomadas e análise da eficácia das ações preventivas tomadas.

  Quando processos ou procedimentos resultarem em produtos ou artigos não conformes, detentores
  de um COP devem verificar a implementação das ações corretivas e preventivas, monitorar
  a resposta do sistema da qualidade a essas ações e verificar a sua eficácia.

  Manuseio e Armazenamento

  O parágrafo 21.137(j) exige procedimentos para evitar dano e deterioração de cada produto
  e artigo durante o manuseio, armazenamento, preservação e embalagem.

  Detentores de um COP devem possuir procedimentos para assegurar que apenas produtos ou artigos
  conformes e adequadamente identificados sejam armazenados. Esses procedimentos devem assegurar
  a rastreabilidade quando houver quebra de lotes e assegurar o controle da movimentação e
  da expedição dos produtos ou artigos armazenados.

  Detentores de um COP são responsáveis por:

  ter procedimentos para assegurar o atendimento a qualquer controle ambiental especial requerido
  durante o armazenamento, manutenção, fabricação e montagem dos produtos e artigos;

  identificar e controlar produtos e artigos com tempo de vida limitado ou que requeiram controle
  ambiental especial; e

  identificar e separar adequadamente os produtos e artigos na produção e no estoque.

  Controle dos Registros da Qualidade

  O parágrafo 21.137(k) requer que o sistema da qualidade do detentor de um COP tenha procedimentos
  para identificação, armazenamento, proteção, recuperação e retenção de registros da qualidade.
  A mesma seção também requer que o detentor de um COP retenha esses registros por pelo menos
  5 anos para produtos ou artigos fabricados sob sua certificação e pelo menos 10 anos para
  componentes críticos identificados no parágrafo 45.15(c) do RBAC 45.

  Detentores de um COP devem ter procedimentos para controlar todos os registros gerados,
  ou necessários, para demonstrar cumprimento com os requisitos aplicáveis das subpartes G,
  K e O do RBAC 21, incluindo registros gerados através da cadeia de suprimentos. Além disso,
  o detentor de um COP é responsável pelo controle das unidades de armazenamento de seus registros
  para evitar a degradação dos registros e para garantir a disponibilidade deles.

  Registros a serem retidos devem incluir, mas não estão limitados a, registros de inspeções
  e testes, registros de calibração, registros de fornecedores, certificações dos processos
  especiais, registros das atividades do CRM, e documentos de fabricação/produção.

  Registros devem estar legíveis, completos e exatos. Qualquer meio de armazenamento utilizado
  para retenção de registro deve exibir os dados de forma legível, com os devidos carimbos
  de aceitação e com as assinaturas requeridas. A subseção 5.4 desta IS contém instruções
  adicionais sobre registros armazenados em, ou gerados por, computador.

  Detentores de um COP devem estabelecer os prazos para retenção de registros para os vários
  tipos de processos, testes e dados do sistema de qualidade e inspeção.

  Os procedimentos devem definir como ocorrerá a disposição sobre os documentos obsoletos
  e como eles serão destruídos.

  Auditoria Interna

  O parágrafo 21.137(l) requer procedimentos para o planejamento, realização e documentação
  de auditorias internas para assegurar o cumprimento com o sistema da qualidade aprovado.
  Os procedimentos devem incluir o reporte dos resultados das auditorias internas para o gerente
  responsável pela implementação das ações corretivas e preventivas. A subseção 5.5 desta
  IS fornece informações adicionais sobre o programa de auditoria interna.

  Detentores de um COP devem possuir procedimentos que estabeleçam um programa de auditoria
  interna. O programa de auditoria interna deve verificar cumprimento com as políticas, procedimentos
  e dados aprovados.

  Detentores de um COP devem assegurar-se de que os resultados das auditorias internas sejam
  reportados ao nível apropriado da gestão, e que esses resultados sejam utilizados visando
  melhorias para o sistema de qualidade e para o produto ou artigo.

  Reporte de dificuldade em serviço

  O parágrafo 21.137(m) requer procedimentos para recebimento e processamento das reclamações
  de falhas, mau funcionamento e defeitos em serviço. Esses procedimentos devem incluir um
  processo para auxiliar o detentor da aprovação de projeto a:

  resolver qualquer problema em serviço envolvendo alterações de projeto; e

  determinar se quaisquer alterações nas instruções de aeronavegabilidade continuada são necessárias.

  Detentores de um COP devem possuir procedimentos que estabeleçam um sistema para recebimento,
  processamento e acompanhamento de dificuldades em serviço, incluindo a descrição da forma
  como os registros são gerados e mantidos.

  Detentores de um COP devem assegurar-se de que problemas em serviço e condições, características
  ou componentes inseguros ou não aeronavegáveis, reportados pela ANAC ou pelos usuários,
  sejam investigados e recebam uma ação corretiva imediata.

  Detentores de um COP devem assegurar-se de que os boletins de serviço e modificações nos
  manuais de manutenção sejam aprovados por pessoas autorizadas e que tais boletins e modificações
  sejam coordenados com a engenharia da ANAC.

  Desvios de qualidade

  O parágrafo 21.137(n) requer procedimentos para identificar, analisar e iniciar ação corretiva
  apropriada para produtos ou artigos que tenham sido liberados pelo sistema da qualidade
  e que não estejam em conformidade com os dados do projeto aplicáveis ou com os requisitos
  do sistema da qualidade.

  Detentores de um COP devem possuir procedimentos que documentem como deve ser feito o acompanhamento,
  avaliação, categorização e disposição de todos os produtos e artigos não conformes. Esses
  procedimentos devem incluir ações para corrigir deficiências no sistema da qualidade que
  tenham permitido a ocorrência do desvio de qualidade (Quality Escape).

  Detentores de um COP devem utilizar ferramentas de análise de tendências e de avaliação
  de risco para determinar a severidade e os efeitos de longo prazo das não conformidades.

  Detentores de um COP devem notificar usuários dos produtos ou artigos quando eles estiverem
  não conformes ou quando houver suspeita de que possam estar não conformes.

  Emissão de documentos de liberação autorizada

  Qualquer detentor de um COP que pretenda emitir documentos de liberação autorizada deve
  possuir procedimentos para esse propósito que atendam o parágrafo 21.137(o). O detentor
  de um COP deve possuir procedimentos para seleção, designação, treinamento, gestão e remoção
  de indivíduos autorizados a emitir documentos de liberação autorizada. Documentos de liberação
  autorizada podem ser emitidos para motores de aeronaves, hélices e artigos novos fabricados
  pelo detentor de COP; e para motores de aeronaves, hélices e artigos usados, quando reconstruídos,
  reparados ou alterados, de acordo com o parágrafo 43.3 (j) do RBAC 43. Quando um detentor
  de COP emite um documento de liberação autorizada para o propósito de exportação, o detentor
  de COP deve cumprir com os procedimentos aplicáveis de exportação de motores de aeronaves,
  hélices e artigos, novos e usados, especificados nas seções 21.331 e com as responsabilidades
  de exportadores especificadas na seção 21.335. Informações adicionais sobre a emissão de
  documentos de liberação autorizada podem ser encontradas na IS 43.9-002, Uso e preenchimento
  do Certificado de Liberação Autorizada.

  Os procedimentos estabelecidos de acordo com o parágrafo 21.137(o) devem garantir que somente
  pessoas qualificadas emitam documentos de liberação autorizada. A avaliação da qualificação
  desses indivíduos, realizada pelo detentor do um COP, deve mensurar seu conhecimento, formação,
  experiência e treinamento. A qualificação deve ser proporcional à complexidade do produto
  ou artigo para o qual o detentor de um COP emite documentos de liberação autorizada. Esses
  procedimentos devem, ainda, incluir requisitos para preenchimento do formulário F-100-01
  (SEGVOO 003) que atendam à IS 43.9-002, Uso e preenchimento do Certificado de Liberação
  Autorizada. O apêndice L desta IS contêm informações adicionais sobre a emissão de documentos
  de liberação autorizada para motores, hélices e artigos.

  Os documentos de liberação autorizada devem ser emitidos utilizando-se o formulário F-100-01
  (SEGVOO 003).

  O parágrafo 21.137(o) é aplicável somente a detentores de um COP que pretendam emitir documentos
  de liberação autorizada. Qualquer detentor de um COP que não emita tais documentos pode
  continuar obtendo certificados de liberação autorizada emitidos pela ANAC.

  Programa de controle de fornecedores

  Esta subseção fornece informação sobre e descreve os critérios para o estabelecimento e
  manutenção de um programa de controle de fornecedores. Esse programa pode ser utilizado
  por um detentor de COP para suportar suas responsabilidades sob as seções 21.137, 21.307
  e 21.607 do RBAC 21.

  O RBAC 21 exige que detentores de um COP estabeleçam e mantenham um sistema da qualidade
  que assegure que componentes produzidos pelo fornecedor (por exemplo, software, artigos
  e subconjuntos), serviços prestados (por exemplo: processos especiais, usinagens e calibração),
  e materiais e/ou equipamentos comprados pelo cliente/comprador, estejam conforme os requisitos
  do detentor do COP.

  Controle de Fornecedores

  Requisitos de Contrato. O parágrafo 21.137(c) do RBAC 21 requer que o detentor de um COP
  possua um sistema da qualidade que assegure que todos os produtos ou artigos fornecidos
  pelos seus fornecedores, incluindo subfornecedores, estejam conforme os seus requisitos.
  Tais requisitos dependem da complexidade dos produtos ou artigos fornecidos e se os fornecedores
  detêm ou não uma aprovação de produção para produtos ou artigos similares.

  Responsabilidades dos requerentes ou detentores de um COP. O detentor de um COP deve assegurar
  o acesso a, e a cooperação de, todas as unidades fabris da cadeia de suprimento para o próprio
  detentor e para a ANAC. O detentor é responsável pelo desdobramento dos requisitos e pela
  aderência a eles para toda a cadeia de suprimentos. Um detentor de um COP não delega a responsabilidade
  sob a sua aprovação de produção para um fornecedor.

  Uso da cadeia de suprimentos em outros países

  O detentor de um COP pode utilizar fornecedores em outros países desde que ele tenha estabelecido
  e implementado um sistema de controle de fornecedores aceitável pela ANAC. O detentor de
  um COP que planeje utilizar um fornecedor em outro país deve notificar a ANAC de uma forma
  aceitável pela Agência, para que a ANAC determine sua disponibilidade para supervisionar
  o fornecedor.

  Vigilância do Sistema de Controle de Fornecedores pela ANAC

  A ANAC não aprova fornecedores, mas pode conduzir auditorias no sistema de controle de fornecedores
  tanto no detentor do COP quanto na unidade de fabricação do fornecedor. A ANAC também pode
  solicitar assistência técnica de uma autoridade de aviação civil no exterior para que ela
  realize a atividade em nome da ANAC dentro do escopo de um acordo bilateral vigente. O detentor
  de um COP não pode utilizar as auditorias da ANAC ou de outra autoridade como meio de controle
  de fornecedores.

  Elementos de um Sistema de Controle de Fornecedores

  O detentor de um COP é responsável por assegurar que cada produto ou artigo está conforme
  os dados de projeto aprovados pela ANAC e em condições de operação segura. Essa responsabilidade
  permanece a mesma se o detentor de um COP utilizar fornecedores de produtos ou artigos ou
  produzir o produto ou artigo inteiro em sua unidade fabril. O programa de controle de fornecedores
  deve estar documentado e deve ser aprovado pela ANAC. A implementação e manutenção do sistema
  de controle de fornecedores está sujeita à avaliação da ANAC. As certificações de organização
  de produção da ANAC são baseadas na capacidade do sistema da qualidade de assegurar a produção
  de produtos e artigos conformes. Para tanto, os procedimentos do sistema de controle de
  fornecedores devem incluir os elementos relacionados a seguir.

  Estrutura Organizacional: estabelecimento de uma estrutura organizacional que assegure autoridade
  apropriada, recursos suficientes e expertise adequada para controlar as atividades dos fornecedores.

  Contrato de fornecimento: documentação do acordo de fornecimento, geralmente por meio de
  um contrato, que defina todos os elementos e procedimentos necessários entre o detentor
  de um COP e o fornecedor. O apêndice G desta IS contém os elementos que devem ser definidos
  em um contrato entre um detentor de um COP e um fornecedor.

  Avaliação e Seleção de Fornecedores: um processo que avalie e selecione fornecedores, com
  base em suas capacidades de realizar todas as atividades de fabricação, inspeção e testes
  necessários para determinar a conformidade dos artigos com os dados de projeto aplicáveis.
  Adicionalmente, o processo de avaliação e seleção dos fornecedores deve determinar a habilidade
  do fornecedor em atender outros requisitos especificados pelo detentor de um COP. O processo
  deve incluir critérios para avaliação inicial, seleção, avaliações contínuas ou periódicas,
  e reprovações de fornecedores. Esse processo deve incluir o seguinte:

  avaliação inicial de fornecedores para determinar sua capacidade em atender requisitos.
  O detentor de um COP deve fazer essa determinação antes de permitir que o fornecedor forneça
  qualquer artigo. A necessidade de um detentor de um COP de conduzir avaliações na unidade
  fabril do fornecedor deve ser basear no processo de controle de fornecedores descrito no
  parágrafo 5.3.6.6 desta IS. A ANAC encoraja que detentores de um COP conduzam avaliações
  iniciais nas unidades fabris baseadas em fatores de risco como os descritos abaixo:

  I - categoria da parte como listado no apêndice I desta IS;

  II - número de níveis de subfornecedores e número de subfornecedores em cada nível utilizado
  pelo fornecedor (incluindo, se necessário, avaliações na unidade fabril dos subfornecedores);

  III - complexidade do projeto e fabricação do artigo;

  IV - capacidade do detentor de um COP para determinar a conformidade do artigo no recebimento;
  e

  V - outros fatores de risco como discutidos no parágrafo 5.3.6.6 desta IS;

  avaliações periódicas ou contínuas de fornecedores para assegurar a aderência contínua aos
  requisitos; e

  métodos para determinar a extensão e tipo das avaliações (por exemplo: avaliações na unidade
  fabril, análise crítica dos processos, análise crítica de documentos ou avaliações independentes
  dos produtos). A extensão e tipo de avaliação deve ser baseada no tipo, complexidade, método
  de controle e criticidade dos artigos produzidos. A necessidade de o detentor de um COP
  conduzir avaliações nas unidades fabris dos fornecedores deve ser baseada no processo de
  controle de fornecedores e na avaliação dos produtos fornecidos conforme descrito nos parágrafos
  5.3.6.6 e 5.3.6.7 desta IS. A ANAC recomenda ao detentor de um COP conduzir avaliações periódicas
  ou contínuas nas unidades fabris de seus fornecedores e subfornecedores.

  Lista de Fornecedores Aprovados: uma lista controlada, na qual fornecedores sob o sistema
  da qualidade de um detentor de um COP devem ser incluídos ou referenciados, de forma que
  possa ser definido o escopo associado a cada fornecedor. Procedimentos devem garantir que
  a documentação de compra seja emitida apenas para fornecedores nessa lista.

  Processo de Controle de Fornecedores: um processo que descreva os meios de controle de fornecedores,
  baseado na criticidade e complexidade do artigo ou serviço fornecido, para assegurar a conformidade.
  As técnicas descritas abaixo são fornecidas para auxiliar o detentor de um COP no desenvolvimento
  dos procedimentos de controle de fornecedores aplicáveis à sua organização:

  avaliação de risco. Ela considera tanto os fatores de risco do fornecedor como os do produto,
  artigo ou serviço. Fatores de risco incluem a criticidade do produto/artigo (LPC - Lista
  de Peças Categorizadas), processos especiais e a complexidade do projeto e do processo produtivo.
  A norma SAE ARP9134, Supply Chain Risk Management Guidelines, pode ser utilizada como guia
  para identificação dos fatores de risco dos fornecedores;

  qualificação e auditoria do sistema da qualidade do fornecedor;

  monitoramento da capacidade de executar, através de toda a cadeia de suprimento, todas as
  atividades de fabricação, inspeções e testes para determinar a conformidade dos artigos
  com os dados de projeto aplicáveis. O detentor de um COP determinará e aplicará os padrões
  de aceitação para as condições físicas, status de configuração e conformidade dos artigos
  (incluindo equipamentos fornecidos por clientes). Essa determinação deve ser realizada para
  os artigos utilizados na produção e para os artigos produzidos sob seu certificado de produção
  e vendidos como peças de reposição; e

  inspeção de primeiro artigo para verificar se o artigo está conforme com os dados de projeto
  aprovado e conforme com quaisquer requisitos adicionais de contrato, incluindo testes/ensaios
  destrutivos. Uma inspeção de primeiro artigo deve ser realizada para uma linha de produção
  nova, após modificações nos processos de fabricação ou qualidade, ou no caso de um novo
  fornecedor. A norma SAE AS9102, Aerospace First Article Inspection Requirement é um guia
  da indústria aceitável como orientação no estabelecimento dos processos e procedimentos
  de inspeção de primeiro artigo.

  Verificação do Produto Fornecido: métodos utilizados para verificar se os artigos recebidos
  estão conforme os requisitos especificados, incluindo materiais fornecidos pelo cliente/comprador
  e/ou fornecedores determinados pelo cliente/comprador. Esses métodos incluem, mas não se
  limitam a, os seguintes:

  Para artigos aceitos nas instalações do detentor de um COP, inspeções devem ser realizadas
  no recebimento ou, quando características permanecerem acessíveis, a qualquer tempo antes
  da aceitação final do produto/artigo. Os procedimentos devem abranger uma inspeção completa
  (por exemplo: todas as características dimensionais, ensaios não destrutivos, testes de
  dureza, análise espectrográfica e testes funcionais). Quando um detentor de um COP tiver
  estabelecido que o processo de fabricação de seu fornecedor estiver consistentemente produzindo
  artigos conforme com os requisitos, o uso de métodos estatísticos de controle de qualidade
  pode ser aceito. O plano de inspeção utilizado é requerido para impedir a aceitação de qualquer
  artigo não conforme. Além disso, quando for necessário determinar a integridade do material,
  os seguintes métodos devem ser considerados:

  I - análise de laboratório para verificar as propriedades físico-químicas completas dos
  artigos, quando tais testes puderem ser realizados sem a destruição do artigo (por exemplo:
  ensaiando/testando corpos de prova ou pequenas seções de um artigo); e

  II - análise qualitativa e análise quantitativa de uma amostra dos artigos (por exemplo:
  testando corpos de prova ou pequenas seções do artigo), quando análises de laboratório não
  puderem ser realizadas sem a destruição desses artigos. Essas análises devem verificar as
  propriedades físico-químicas completas do um artigo.

  Para artigos que não possam ou não poderão ser inspecionados no recebimento, os procedimentos
  de um detentor de um COP devem incluir, no mínimo, inspeções e testes dos primeiros artigos
  para verificar se o artigo está conforme com seus requisitos, e inspeções periódicas posteriores.
  Inspeções e testes realizados com a finalidade de mostrar a conformidade com os requisitos
  contratuais podem ser realizados nas instalações de um fornecedor. Essas inspeções e testes
  devem ser conduzidos de acordo com um processo documentado do sistema da qualidade aprovado
  pela ANAC. Pode ser requerido mais de um artigo para tais inspeções e testes, até que a
  repetitividade da produção do fornecedor tenha sido estabelecida. Esses procedimentos devem
  incluir métodos para controlar, identificar, e segregar artigos que estejam aguardando a
  execução de testes ou inspeções daqueles já aprovados.

  O detentor de um COP pode permitir que um fornecedor realize uma inspeção maior após determinar
  que o fornecedor é capaz de realizar tal função de inspeção. No entanto, o detentor de um
  COP deve aprovar qualquer delegação de inspeção ou a utilização de técnicas estatísticas
  além do primeiro nível de fornecimento. Essa delegação inclui o seguinte:

  I - Inspeções Maiores. Incluem características classificadas como críticas nos desenhos
  de engenharia do detentor do projeto aprovado, especificações de processo, especificações
  de testes e procedimentos de controle de qualidade; ou propriedades que não possam ser verificadas
  exceto por ensaio destrutivo de cada artigo ou desmontagem extensiva; e

  II - Revisão de Materiais. Isso inclui a identificação e manutenção dos procedimentos relevantes
  de Comissão de Revisão de Materiais CRM) que definam o escopo e autoridade da CRM do fornecedor.
  Revisão de Materiais também inclui o processo de submeter, ao detentor de um COP, as não
  conformidades do fornecedor que, por regulamento, devem ser aprovadas antes de poderem ser
  consideradas modificações ao projeto de tipo aprovado pela ANAC; e

  III - Técnicas Estatísticas.

  O detentor de um COP deve disponibilizar para a ANAC, quando solicitado, todas as informações
  dos fornecedores e subfornecedores. Essas informações devem incluir, mas não estão limitadas
  a, o seguinte:

  I - o nome e endereço de cada fornecedor;

  II - o nome e endereço de cada fornecedor que realize inspeções maiores ou Revisão de Materiais
  para o detentor de um COP;

  III - o nome e endereço de cada fornecedor que forneça artigos que não possam passar ou
  não passarão por uma inspeção de conformidade no recebimento do artigo, nas instalações
  do detentor de um COP;

  IV - onde, e por quem, o artigo será inspecionado;

  V - o cargo e número do telefone da pessoa a ser contatada na instalação do fornecedor que
  possa fornecer ordens de compra, dados de controle de qualidade, dados técnicos e outros
  dados pertinentes ou informações para a ANAC;

  VI - identificação de cada fornecedor com autorização de envio direto (direct ship authorization);
  e

  VII - os resultados das avaliações, auditorias ou outras atividades de vigilância do detentor
  do COP ao fornecedor.

  O detentor de um COP deve possuir um método para gerar e manter registros de inspeção. Esses
  procedimentos devem incluir o seguinte:

  I - sumário de cada registro utilizado para o artigo inspecionado. Esse sumário deve incluir,
  no mínimo, o nome, PN (número da peça), número de série (se aplicável), tamanho da amostra,
  tipo e número de inspeções efetuadas, a conformidade ou não conformidade, o número e a descrição
  das não conformidades encontradas, e as ações tomadas;

  II - requisitos para a legibilidade, integridade, precisão, e períodos de retenção dos registros;
  e

  III - requisitos para as ferramentas utilizadas para retenção de registros (por exemplo,
  arquivos de fitas e microfilmes) tais como, exigências de exibição de dados legíveis e selos
  de aceitação ou de assinaturas.

  Classificação dos Fornecedores: um sistema que apresente o desempenho, capacidade e confiabilidade
  dos fornecedores.

  Notificação para a ANAC: um procedimento para assegurar a notificação à ANAC de qualquer
  alteração significativa no escopo de quaisquer acordos com fornecedores.

  Reporte de não conformidades do fornecedor: um processo de reporte pelo fornecedor para
  produtos, artigos ou serviços que tenham sido entregues ou fornecidos por um fornecedor
  e que, posteriormente, tenha-se constatado estarem não conformes em relação aos requisitos
  do detentor de um COP.

  Controle de Modificações: um sistema que garanta que modificações nos requisitos sejam adequadamente
  controladas e incorporadas como acordadas entre o fornecedor e o detentor de um COP. Ele
  inclui, mas não está limitado a:

  submissão, antes da incorporação, das modificações de projeto do fornecedor ao detentor
  do COP para aprovação, quando requerido;

  submissão das alterações no processo de fabricação do fornecedor ao detentor do COP para
  aprovação, quando necessário;

  submissão, ao detentor do COP, das alterações no sistema de qualidade do fornecedor que
  possa afetar a inspeção, a conformidade ou a aeronavegabilidade do artigo; e

  métodos usados para agir sobre as notificações de artigos não conformes, para garantir a
  investigação adequada e que ações corretivas sejam tomadas.

  Embarque Direto: os métodos para controlar o embarque direto de um fornecedor do detentor
  de um COP para um cliente de artigos fabricados sob um COP. O cliente pode comprar artigos
  tanto do detentor do COP quanto de seu fornecedor. SAE ARP9114, Direct Ship Guidance for
  Aerospace Companies, é uma diretriz da indústria aceitável para fornecer orientação no estabelecimento
  de processos e procedimentos para embarque direto. Pode haver restrições para embarque direto
  de artigos de fornecedores que não estejam localizados no Brasil. A ANAC/GTCO pode ser contatada
  para obter informações mais específicas. Embarque direto só pode ser utilizado quando o
  detentor do COP:

  tiver procedimentos de qualidade aprovados para compensar a ausência de inspeções normalmente
  realizadas nas instalações do detentor do COP. Fatores compensatórios devem incluir avaliações
  e inspeção do artigo no local do fornecedor, como também:

  I - uma inspeção na fonte realizada pelo detentor do COP; ou

  II - uma inspeção realizada pelo fornecedor por meio de uma delegação de autoridade de inspeção
  pelo detentor do COP;

  fornecer autorização de embarque direto para o fornecedor;

  emitir e manter registros de autorização de embarque direto, e disponibilizá-los às autoridades
  reguladoras quando requerido;

  garantir que as exigências do país importador serão atendidas antes de autorizar o embarque
  direto a clientes situados fora do Brasil;

  garantir que o fornecedor:

  I - realize o embarque direto do artigo;

  II - atenda a quaisquer requisitos especiais de clientes aceitos pelo detentor do COP;

  III - mantenha a evidência de que o fornecedor possua autorização de embarque direto do
  detentor do COP;

  IV - mantenha evidências dos embarques diretos feitos em nome do detentor do COP;

  V - forneça, no envio, uma declaração de embarque direto assinado;

  VI - forneça, no envio, uma declaração de conformidade assinada ou carimbada certificando
  que o artigo está em conformidade com dados aprovados;

  VII - forneça rastreabilidade do embarque com o pedido de compra do cliente;

  VIII - forneça, no embarque, evidências de que tenham sido realizadas aprovações ou inspeções
  pelo detentor do COP ou por delegação de autoridade de inspeção; e

  IX - forneça, no embarque, uma declaração de que as delegações de autoridade de inspeção
  tenham sido concedidas pelo detentor do COP, e que a inspeção tenha sido realizada em nome
  do detentor do COP, quando a inspeção delegada for utilizada.

  Vigilância em fornecedores realizada por terceiros: métodos para a utilização de terceiros
  para realizar a vigilância de fornecedores, desde que os processos utilizados sejam aceitos
  pela ANAC e documentados no manual da qualidade.

  Fornecedores que são detentores de um COP: métodos utilizados para tratar dos fornecedores
  que possuam uma certificação de organização de produção para o artigo a ser fornecido. A
  vigilância do detentor do COP sobre esses fornecedores em particular pode ser reduzida,
  mas não eliminada, desde que:

  uma interface satisfatória entre os dois sistemas de qualidade possa ser demonstrada à ANAC;

  os artigos a serem fornecidos estejam incluídos no escopo da sua aprovação de produção;
  e

  se o fornecedor estiver localizado fora do Brasil, um acordo bilateral de aeronavegabilidade
  esteja em vigor entre o Brasil e o país do fornecedor. O acordo bilateral irá incluir disposições
  para a aceitação pelo Brasil dos tipos de artigos ou produtos produzidos sob a aprovação
  de produção do fornecedor.

  Uso de fornecedores localizados fora do Brasil: métodos para o uso de fornecedores (incluindo
  subfornecedores) fora do Brasil. Esses métodos devem incluir disposições para o seguinte:

  O detentor de um COP deve fornecer notificação prévia à ANAC da intenção de uso de um fornecedor
  de outro país ou jurisdição;

  O detentor de um COP deve disponibilizar à ANAC as informações sobre os fornecedores localizados
  no exterior, quando forem solicitadas;

  O detentor de um COP deve garantir que a ANAC tenha acesso ao país onde o seu fornecedor
  (incluindo subfornecedor) está localizado. Ele também deve garantir que todos os processos,
  acordos ou procedimentos necessários estejam estabelecidos para mitigar quaisquer ônus indevidos
  à ANAC. Tais ônus poderiam impossibilitar a ANAC de exercer as suas funções de regulação
  e responsabilidades de gestão do certificado de organização de produção; e

  O detentor de um COP deve garantir o acesso aos seus fornecedores. A garantia de acesso
  deve ser providenciada pelo fornecedor ou, quando não haja acordo regulatório, pelo governo
  do país ou jurisdição em que o fornecedor estiver localizado. Essa garantia de acesso deve
  ser disponibilizada para a ANAC. Se o acesso for, a qualquer momento, impossibilitado ou
  negado, a ANAC pode exigir ao detentor do COP que deixe de utilizar o fornecedor.

  Gerenciamento dos certificados emitidos pela ANAC em outros países. Quando o detentor de
  um COP utilizar um fornecedor de um país ou jurisdição que tiver um acordo bilateral com
  o Brasil, a ANAC pode utilizar a Autoridade de aviação civil local para executar as atividades
  de vigilância e/ou realizar inspeções em nome da ANAC. Os seguintes procedimentos devem
  ser utilizados:

  O detentor do COP deve fornecer à ANAC ou à autoridade local todo o apoio necessário na
  sua atividade de vigilância; e

  Quando especificamente solicitado pela ANAC ou pela autoridade local, para facilitar as
  atividades de vigilância, os fornecedores localizados fora do Brasil irão disponibilizar
  dados apropriados para a ANAC por intermédio do detentor do COP para fins de gestão do certificado.
  Esses dados deverão estar no idioma inglês ou português.

  NOTA 1 - A ANAC deve determinar se haverá ônus indevidos quando notificada pelo detentor
  do COP de sua intenção de utilizar um fornecedor fora do Brasil.


  NOTA 2 - Quando a ANAC solicitar a uma autoridade local parceira para realizar atividades
  de vigilância em uma instalação do fornecedor, o detentor do COP será responsável por quaisquer
  encargos imposto pela autoridade local para executar as atividades.

  Registros eletrônicos de fabricação e qualidade

  Esta subseção fornece informação e orientação para o detentor de um COP gerir e controlar
  os sistemas de informação que gerem e armazenem registros utilizados na fabricação de produtos
  e artigos.

  Várias seções do regulamento exigem que o detentor do COP mantenha os registros de fabricação
  e de qualidade como evidência de que os produtos e artigos tenham sido produzidos em conformidade
  com os requisitos do projeto aprovado. Com o crescimento da indústria aeroespacial, muitos
  detentores de um COP desenvolveram ou compraram sistemas de informação para gerar e armazenar
  os registros de fabricação e qualidade. Esta subseção não discute o que os registros de
  fabricação e qualidade devem conter. Porém, ela descreve os mecanismos de controle que o
  detentor do COP deve utilizar para um sistema de informação que gere ou armazene registros
  de produtos e artigos fabricados conforme os requisitos do regulamento.

  O sistema de registro deve detectar e impedir a divulgação, modificação ou utilização não
  autorizada de registros. Sistemas de registro requerem proteção para garantir o registro
  preciso de todo o processo de fabricação de um produto ou artigo. Um sistema de gestão da
  informação deve ser protegido contra intrusos. O sistema também deve ser protegido contra
  os funcionários com privilégios de acesso que tentem realizar ações não autorizadas. A proteção
  é atingida não apenas mediante garantias técnicas, físicas e de pessoal, mas também por
  meio da divulgação de forma clara a todos os funcionários sobre os procedimentos da organização
  a respeito do uso do sistema da forma autorizada.

  Princípios de segurança dos Sistemas Eletrônicos de Registro

  Embora os sistemas de gestão de informação sejam diversos, os atributos comuns de segurança
  devem estar presentes em todos os sistemas de registro. Um sistema eletrônico de registro
  aceitável deve incluir o seguinte:

  Identificação do usuário. Cada usuário do sistema deve ser individualmente identificado
  no sistema por meio de um número de conta ou outro código de identificação. Esse código
  identifica quem tenha feito login no sistema e é o principal meio de verificação de acesso.
  O sistema de gestão de informação deve reter os códigos de identificação digitados para
  verificar as solicitações que tenham sido feitas no sistema. Essa informação deve estar
  disponível para análise pelo gestor do sistema;

  Autenticação do usuário. Deve haver um meio de verificar se a pessoa digitando o código
  de identificação do usuário é o indivíduo autorizado. Normalmente, essa autenticação ocorre
  por meio de uma senha conhecida apenas pelo usuário autorizado. Essa senha permitiria o
  acesso ao sistema apenas quando utilizado em conjunto com o código de identificação do usuário.
  As senhas devem ser atualizadas periodicamente;

  Princípio do menor privilégio possível. A capacidade de autorização do sistema de registro
  deve seguir o princípio de que o acesso de cada pessoa é limitado apenas às informações
  e transações exigidas por suas responsabilidades de trabalho. Bloqueios de privacidade podem
  ser utilizados para garantir que esse princípio seja seguido. O nível de acesso em que a
  informação é guardada dentro do sistema irá depender da concepção do sistema. Baseado no
  projeto do sistema de gestão da informação, bloqueios de privacidade e chaves podem controlar
  elementos de dados individuais ou qualquer combinação de elementos de dados; e

  Responsabilidades pelos dados de qualidade. O sistema deve garantir que os privilégios de
  autorização correspondam às responsabilidades descritas no sistema de qualidade da organização.
  Por exemplo, um indivíduo que atua na fabricação normalmente não deve ter capacidade de
  registrar em um campo de aceitação de inspeção em um registro de fabricação. Além disso,
  um inspetor não deve ter acesso a um campo de disposição do engenheiro de revisão de materiais
  em um registro de revisão material. O sistema deve ser capaz de atribuir a cada usuário
  a específica autoridade de acesso necessária. Os vários tipos de autorizações podem incluir
  o seguinte:

  I - acesso somente para leitura. Permite que o usuário leia todos os campos ou determinados
  campos de informação, mas não permite qualquer capacidade de gravação ou de manipulação
  de dados;

  II - acesso com autorizações para inserir ou escrever. Permite que o usuário insira dados
  em campos específicos ou séries de campos;

  III - acesso com autorizações para alteração. Permite que o usuário altere as entradas em
  campos específicos, mas não permite a remoção da entrada original. As alterações podem ser
  realizadas por meio da adição de informação a um campo restrito (que é usado apenas quando
  a informação em um campo será mantida, mas a informação não é correta). Por exemplo, quando
  um artigo foi rejeitado por inspeção, o histórico da rejeição pode precisar ser mantido,
  mesmo depois de o artigo ser reparado. Acesso com autorização para Alteração pode ser dado
  para conferir a um inspetor sênior a autoridade para alterar o status de inspeção de um
  artigo retrabalhado; no entanto, o registro mantém a indicação de rejeição original e a
  identificação do usuário do indivíduo que tenha feito a alteração;

  IV - acesso com autorizações para apagar. Permite ao usuário remover entradas e deixar os
  campos em branco. Uma vez que a autorização para apagar informações pode ser irrestrita,
  a autorização para apagar deve ser cuidadosamente controlada. Acesso com autorização para
  apagar só pode ser emitido aos supervisores para apagar entradas incorretas feitas por seus
  funcionários subordinados. Posteriormente à aprovação final de um produto ou artigo, a informação
  não deve ser apagada. Após a aprovação, dados incorretos devem ser alterados em vez de excluídos;
  e

  V - acesso com autorizações de segurança. O administrador do sistema deve reter as autorizações
  de acesso de segurança. Essas autorizações só devem ser exercidas quando os procedimentos
  adequados permitirem a sua utilização, como, por exemplo, uma carta de aprovação assinada
  pelo diretor de qualidade.

  Mecanismos de auditoria. O sistema de gestão da informação deve incluir mecanismos que detectem
  falhas de segurança. Essas violações devem incluir qualquer tentativa de contornar a segurança
  ou modificar dados sem autorização. Quando tal violação de segurança for detectada, o sistema
  deve alertar o gerente de segurança e apontar todos os campos que tenham sido acessados.
  As informações da violação de segurança devem ser mantidas dentro do sistema até serem examinadas
  pelo gestor do sistema. Os registros da violação de segurança devem estar disponíveis apenas
  para indivíduos selecionados e devem estar protegidos contra modificação ou alteração de
  dados em todos os momentos. Normalmente, o operador do sistema será avisado de atividade
  não autorizada. Eventos graves, como tentativas repetidas de acesso não autorizado, podem
  gerar alarmes no nível do sistema.

  Proteção contra destruição de Software e Hardware. Registros do sistema de informação devem
  ser protegidos de programas de computador destrutivos (isto é, os vírus de computador) que
  ataquem ou degradem o software. Sistemas de gestão de informação devem incluir programas
  de detecção de vírus que garantam que os vírus não serão introduzidos no ambiente por meio
  de software ou hardware contaminados. A proteção deve considerar os seguintes cuidados:

  Inventários. Inventários de todas as configurações e posições de software e hardware devem
  ser utilizados para garantir que hardware/software não autorizado não entre no ambiente
  do sistema de gestão da informação.

  Equipamentos Portáteis. Equipamentos de informática portátil, como laptops, representam
  riscos especiais de software destrutivos; portanto, os procedimentos devem abordar a sua
  utilização no ambiente do sistema de gestão da informação.

  Segurança da Rede. Muitos detentores de COP utilizarão grandes redes de sistemas de gestão
  de informação com várias estações de trabalho ou terminais que interagem entre si. Se um
  grande sistema interativo é usado, procedimentos devem abordar proteção adicional necessária
  para controlar a rede. O detentor do COP deve definir o grau de proteção, em função da complexidade
  e da aplicação do sistema.

  Sistema de Backup. Providências devem ser desenvolvidas para a perda de dados resultante
  de falha do sistema. Em todos os casos, os dados perdidos devem ser regenerados. A quantidade
  de tempo entre as cópias de segurança irá depender do grau de risco que o detentor do COP
  considere aceitável para restabelecer a informação perdida.

  Controle de Mídias. As mídias em que a informação for armazenada devem ser cuidadosamente
  controladas e protegidas. Mídias transportáveis tais como fitas, discos e cartuchos devem
  ser armazenados em locais seguros. Mídias de fontes externas devem ser sujeitas a validação
  para garantir que sejam de fontes autorizadas. A lista abaixo fornece alguns exemplos dos
  tipos de mídias disponíveis.

  Disquetes e discos rígidos de computador não devem ser usados para o armazenamento de longo
  prazo de registros de qualidade e fabricação. As informações que serão mantidas por mais
  de 3 meses devem ser transferidas para discos ópticos ou suportes magnéticos de armazenamento,
  tais como fitas de dióxido de cromo ou fitas de partículas metálicas. Um sistema de rotulagem
  externo ou eletrônico deve ser usado de modo a garantir a recuperação de registros individuais.

  Fitas magnéticas devem ser testadas no prazo de 6 meses de uso para verificar se a fita
  está livre de erros. Idealmente, fitas novas, que sejam mantidas em ambiente fresco e seco,
  devem ser as escolhidas para armazenar os registros. Critérios específicos de armazenamento
  para fitas magnéticas incluem o seguinte:

  I - temperaturas ambientais entre 16° e 20° graus Celsius;

  II - umidade relativa entre 35 e 45 por cento;

  III - rebobinagem sob tensão controlada de todas as fitas a cada 3 anos e meio;

  IV - transferência de todas as informações a serem mantidas por mais de 10 anos para novas
  fitas antes que as fitas anteriores atinjam 10 anos;

  V - teste anual de uma amostra estatisticamente válida de todas as fitas para identificar
  qualquer perda de dados. Fitas com 10 ou mais erros devido às condições de armazenamento
  devem ter todos os dados transferidos para novas fitas. Se a amostra contém fitas com defeito,
  todas as outras fitas que possam ter sido afetadas pela mesma causa (isto é, a fita de má
  qualidade, alto uso, ambiente pobre, ou manuseio inadequado) devem ser testadas e corrigidas;
  e

  VI - proibição de fumar, comer, ou beber nas áreas de armazenamento ou teste das fitas magnéticas.

  Fitas de dióxido de cromo devem ser tratadas como fitas magnéticas, exceto para a rebobinagem
  periódica e limpeza. Apesar de não comprovado, alguns especialistas da indústria acreditam
  que a rebobinagem e a limpeza podem ser destrutivas para essas fitas.

  Antes da utilização de qualquer fita de partícula metálica para armazenamento de longo prazo,
  o detentor do COP deve assegurar que as fitas possam manter a integridade dos dados armazenados.

  Discos ópticos são recomendados pela sua maior durabilidade em comparação com mídias mais
  antigas, como fitas magnéticas ou discos.

  CD ou DVD são preferíveis sobre meios semelhantes para armazenamento de dados de longo prazo,
  como as superfícies de escrita de alumínio e de prata, que são susceptíveis à corrosão ou
  oxidação.

  O detentor do COP deve manter os dados transferidos para armazenamento, prover o acesso
  e garantir a integridade das informações para longo prazo. Isso pode requerer a migração
  de dados de uma mídia para a próxima para evitar a obsolescência da mídia. Os dispositivos
  necessários para ler os discos também devem ser conservados e mantidos.

  Ao adquirir discos para arquivamento, o detentor do COP deve considerar o seguinte: falha
  da tinta, falha de ligação, arranhões e qualidade da produção. Ensaios são altamente recomendados
  nos processos nos quais as condições variem de máquina para máquina e entre os discos. Recomenda-se
  ao detentor do COP manter várias cópias. Idealmente uma cópia mestre deve ser armazenada
  em condições ideais; uma cópia em utilização deve ser armazenada para fins de acesso; e
  uma cópia de segurança deve ser armazenada em um local diferente.

  Não é recomendado formatar disco regravável uma vez que o seu hábito pode levar à perda
  de dados acidentalmente, mas de maneira permanente.

  Discos ópticos ainda estão suscetíveis a fatores ambientais. Discos ópticos não devem ser
  expostos a temperaturas extremas ou a luz solar direta que possam causar acúmulo de calor
  no disco ou danificar a camada de dados com raios ultravioleta. O ambiente ideal deve ser
  mantido entre 18° e 24° graus Celsius, e entre 30 e 50 por cento de umidade.

  Documentação. O sistema de gestão da informação deve ser devidamente documentado. Todos
  os programas de software dentro do sistema, incluindo alterações de programa, devem ser
  devidamente documentados. Os procedimentos devem ser desenvolvidos para controlar todos
  os dados inseridos no sistema, abordando todo o sistema de gestão da informação e atividades
  de interface humana.

  Disponibilidade. A indústria de sistemas de gestão da informação é extremamente dinâmica
  a respeito dos sistemas que estiverem disponíveis para manutenção de registros. Se o detentor
  do COP mudar de um sistema para outro, os registros produzidos pelo sistema antigo devem
  permanecer acessíveis à ANAC em um formato utilizável. O sistema documentado de controle
  da qualidade do detentor do COP deve indicar como essa acessibilidade é mantida.

  Local de instalação de sistemas de gestão da informação

  O sistema de gestão de informação não pode ser adequadamente protegido, a menos que as instalações
  que abrigarem os equipamentos estejam devidamente protegidas contra ameaças físicas e perigos.
  Áreas que devem ser consideradas incluem as seguintes:

  Segurança física. Cada área onde serão usados registros eletrônicos deve ser avaliada sobre
  os potenciais perigos físicos. O fogo e a água são duas das forças mais prejudiciais em
  matéria de informação eletrônica. Embora nem todos os riscos possam ser eliminados, as oportunidades
  de perda podem ser minimizadas por meio de um planejamento cuidadoso.

  Condições Ambientais. Os procedimentos devem abordar as condições ambientais (por exemplo,
  temperatura, umidade, estática) das áreas onde os computadores do sistema de registro e
  as mídias armazenadas estiverem localizados. Especificações do fabricante fornecem um guia
  útil para o desenvolvimento de procedimentos.

  Recuperação de Desastres. Um plano de contingência deve ser desenvolvido para permitir a
  recuperação de informações críticas do sistema em caso de um desastre, como um incêndio.
  Um método aceitável é ter um sistema de cópia de segurança remoto para o qual os dados são
  transferidos regularmente.

  Treinamento

  As organizações que optarem por utilizar sistemas de registros eletrônicos devem treinar
  cada funcionário que estiver envolvido com qualquer parte desse sistema. Os assuntos e os
  objetivos devem variar dependendo do nível do empregado no âmbito da organização e das responsabilidades
  do trabalho. O treinamento deve incluir a conscientização de segurança, política organizacional,
  a operação do sistema e os requisitos de armazenamento de registros. O treinamento deve
  ser documentado e esses documentos devem ser disponibilizados para verificação pela ANAC.

  Auditoria Interna

  Esta subseção fornece informação e define critérios para o estabelecimento de um processo
  de auditoria interna. Esta subseção pode ser utilizada pelo detentor do COP e seus fornecedores
  para mostrar conformidade com os requisitos da seção 21.137 do RBAC 21, a respeito de auditoria
  interna.

  Um processo de auditoria interna consiste no monitoramento contínuo e abrangente, que é
  iniciado e normalmente controlado pela alta direção da empresa e pela área de garantia da
  qualidade. O objetivo desse processo é promover atitudes e procedimentos com o foco em controlar
  os processos, em vez de depender da correção de deficiências para atender às metas de qualidade.

  A auditoria interna deve ser parte do sistema global de qualidade, deve ser um processo
  aprovado pela alta direção e pela gerência de garantia da qualidade, e ter uma descrição
  detalhada por escrito sobre os elementos-chave. Cada detentor de um COP é único em relação
  ao tamanho, instalações, pessoal, recursos e métodos de operação. Consequentemente, diferentes
  tipos de soluções podem ser apropriados para os diferentes tipos de organização. As três
  principais soluções para implementação de um processo de auditoria interna são:

  Um departamento da qualidade dedicado a auditoria interna,

  Um gerente dedicado com auditores avulsos fornecidos por toda a organização, e

  Uma combinação de recursos internos e externos.

  Elementos da Auditoria Interna

  Um processo de auditoria interna deve possuir um nível adequado de independência, um processo
  de comunicação que garanta que a alta direção está ciente dos resultados da auditoria, e
  um processo de ação corretiva eficaz. O processo de ação corretiva deve determinar a causa
  raiz, corrigir e evitar a repetição das deficiências. A área de auditoria interna deve ter
  uma estrutura e processo destinado a melhorar todos os elementos do sistema da qualidade
  e processos que afetem a qualidade do produto. Um processo de auditoria interna deve possuir
  os elementos-chave descritos a seguir.

  Planejamento da Auditoria. Esse elemento engloba:

  Programa de Auditoria. Programa específico da auditoria deve identificar áreas ou atividades
  sujeitas a auditoria e garantir que elas sejam auditadas em uma frequência pré-determinada
  e em intervalos definidos. O programa da auditoria deve ser elaborado com base na importância
  da atividade a ser auditada e deve considerar fatores como o histórico dos resultados da
  auditoria, volume de produção, o desempenho do processo, áreas de alto risco, e as preocupações
  da gerência.

  Seleção dos Auditores. O programa de auditoria interna da qualidade deve especificar que
  os auditores recebem treinamento em auditoria, princípios de auditoria e técnicas de análise
  de sistemas. Quando não é possível o uso de recursos de auditoria dedicados em tempo integral,
  os procedimentos desenvolvidos devem mostrar que as pessoas que realizarão as auditorias
  ou supervisionam as equipes de auditoria não são diretamente responsáveis pelas áreas que
  estiverem sendo auditadas.

  Preparação da Auditoria. O auditor precisa estar ciente das exigências internas e externas
  e de outros fatores que podem afetar o processo.

  Desenvolvimento da lista de verificações (Checklist). Um programa de auditoria completo
  deve determinar e avaliar como o manual de qualidade de uma organização, procedimentos operacionais,
  controles de processos, métodos e práticas representam e incorporam todos os requisitos
  internos e externos. A lista de verificação, na realidade, transpõe as normas, regulamentos
  ou requisitos processuais em uma série de perguntas. A lista de verificação indica os pontos
  a serem verificados e ajuda o auditor a determinar a ordem correta com a qual deve prosseguir
  com uma auditoria.

  Condução da Auditoria. O auditor deve usar a lista de verificação da auditoria para reunir
  evidências para determinar a conformidade ou não conformidade com o sistema da qualidade
  ou com a norma que estiver sendo avaliada. A evidência é coletada por meio da avaliação
  de produtos ou artigos, documentos, observação de atividades, verificações de registros
  e entrevistas com pessoas-chave na área em análise. As evidências recolhidas durante a auditoria
  devem ser documentadas conforme a auditoria é conduzida.

  Reporte dos Resultados. Um relatório deve ser preparado documentando os resultados da auditoria.
  Procedimentos em vigor devem permitir comunicação direta entre o time de auditoria, a alta
  direção da empresa e a gerência da área de garantia da qualidade da empresa. O relatório
  de auditoria deve, no mínimo, incluir o seguinte:

  data em que a auditoria foi realizada;

  auditor que executou a auditoria;

  norma ou procedimento usado como referência para a auditoria (por exemplo, requisitos do
  RBAC 21 ou o Manual de Qualidade do detentor do COP);

  resumo dos resultados. Isso deve incluir uma breve descrição dos resultados e documentos
  de apoio (por exemplo, procedimentos ou registros do detentor do COP);

  avaliação e importância relativa das não conformidades encontradas (maior ou menor); e

  resumo das observações, tanto positivas quanto negativas.

  Causa Raiz/Ação Corretiva e Preventiva. O detentor do COP deve determinar a causa raiz e
  desenvolver um plano de ação corretiva e preventiva.

  Fechamento das não conformidades encontradas na Auditoria. Depois que o proprietário do
  processo indicar a conclusão da ação corretiva, a gerência de garantia da qualidade deve
  verificar se as mudanças no processo foram eficazes na correção da deficiência existente
  e impedirão a reincidência. Se o processo de verificação indicar que a ação corretiva não
  foi eficaz, a alta direção da empresa deve ser notificada. A gerência de garantia da qualidade
  deve, então, solicitar ao proprietário do processo uma ação corretiva adicional e a revalidação
  da mesma.

  Arquivos dos Relatórios. Os relatórios de auditoria, incluindo os dados das ações corretivas
  e do fechamento das não conformidades, devem ser mantidos.

  Requisitos adicionais do detentor de um COP

  Manual de Qualidade

  As seções 21.138, 21.308 e 21.608 determinam que cada detentor de um COP deve fornecer um
  manual descrevendo seu sistema da qualidade para aprovação da ANAC. O manual deve estar
  no idioma português ou inglês e ser disponibilizado de uma forma aceitável pela ANAC.

  Se o manual de qualidade for armazenado digitalmente utilizando um computador, ele deve
  ser facilmente acessível aos funcionários do detentor do COP e funcionários da ANAC que
  precisem usar o manual para desempenhar as suas funções.

  O manual deve abranger todos os requisitos do sistema de qualidade, conforme exigido pela
  seção 21.137 do RBAC 21.

  Localização ou mudança das instalações de fabricação

  As seções 21.139, 21.309 e 21.609 determinam que o detentor de um COP pode obter um certificado
  de organização de produção para instalações de fabricação localizadas fora do Brasil, desde
  que a ANAC considere ser de interesse público e que tal localização não implique em ônus
  indevidos à ANAC.

  O detentor do COP deve obter a aprovação da ANAC antes de fazer qualquer alteração na localização
  de quaisquer de suas instalações de fabricação.

  O detentor do COP deve notificar imediatamente a ANAC, por escrito, de qualquer alteração
  nas instalações de fabricação que possa afetar a inspeção, conformidade ou aeronavegabilidade
  do seu produto ou artigo.

  Cada requerente de uma aprovação de produção ou detentor de um COP deve verificar com a
  GTCO os métodos de aprovação e de notificação.

  Inspeções e Testes

  As seções 21.140, 21.310, e 21.610 determinam que:

  Cada detentor de um certificado de organização de produção deve permitir que a ANAC:

  I - inspecione seu sistema da qualidade, instalações, dados técnicos e quaisquer produtos
  ou artigos fabricados; e

  II - testemunhe quaisquer ensaios, incluindo qualquer inspeção ou ensaios nas instalações
  de fornecedores, necessárias para determinar a conformidade com os RBAC aplicáveis.

  O detentor do COP deve garantir para a ANAC o acesso a, e a cooperação de, todas as instalações
  envolvidas na cadeia de fornecimento. O detentor do COP também deve garantir o acesso a,
  e a colaboração de, todas as instalações envolvidas na cadeia de fornecimento para si mesmo
  ou para seus representantes.

  A seção 21.310 também prescreve proibições únicas para essa seção. O detentor do COP operando
  sob a subparte K deve consultar a seção aplicável para garantir que eles não estão em violação
  dessas proibições.

  Emissão de um Certificado de Organização de Produção

  As seções 21.141, 21.311 e 21.611 determinam que a ANAC emite um certificado de organização
  de produção depois de considerar que o requerente cumpre os requisitos da subparte aplicável.

  Os requerentes a um COP devem garantir que eles tenham revisado e documentado como eles
  cumprem os requisitos aplicáveis, de modo que a ANAC possa realizar uma revisão completa.

  Os requerentes a um certificado de organização de produção que façam parte de uma multinacional
  ou de um consórcio corporativo podem recorrer ao apêndice H desta IS para obter mais orientações
  sobre como cumprir com a seção 21.137 do RBAC 21.

  Registro de limitações de produção

  A seção 21.142, Registro de Limitações de Produção (RLP), determina que a ANAC emite o RLP
  como parte de um COP. O RLP lista o número do documento de aprovação do projeto, o acordo
  de licença (caso aplicável), a data da aprovação de produção e o modelo de cada produto
  ou artigo que o detentor do COP está autorizado a fabricar, bem como todo componente de
  interface que o detentor de um COP está autorizado a fabricar e a instalar sob o RBAC 21.
  O detentor de um COP deve assegurar-se de que o RLP reflita corretamente qualquer produto
  ou artigo que ele pretenda fabricar e qualquer componente de interface que ele pretenda
  fabricar e instalar.

  Validade

  As seções 21.143, 21.313 e 21.613 determinam que um COP é válido até que seja devolvido,
  suspenso, revogado, cassado ou que tenha uma data de validade estabelecida pela ANAC.

  A seção 21.613 também estabelece os requisitos para uma OTP revisada ou cancelada. O detentor
  de uma carta de aceitação da ANAC para uma declaração de conformidade, um detentor de um
  Certificado de Produto Aeronáutico Aprovado (CPAA) segundo uma OTP ou uma carta de aprovação
  de projeto segundo uma OTP, poderá continuar a produzir o artigo de acordo com a versão
  da norma OTP válida no momento da aprovação do artigo afeto, sem que tenham que obter uma
  nova aceitação, autorização ou aprovação, mas deverá cumprir com os requisitos dos RBAC
  aplicáveis.

  Transferência

  As seções 21.144, 21.314 e 21.614 determinam que um COP, um CPAA, um CPAA segundo uma OTP
  ou uma carta de aprovação do projeto segundo uma OTP não são transferíveis.

  A ANAC proíbe a transferência de uma certificação de organização de produção, mas a ANAC
  reconhece que as empresas podem mudar de propriedade. Em casos em que os dados de projeto,
  sistemas de qualidade e processos de fabricação forem todos transferidos como parte da mudança
  de propriedade, a ANAC irá apoiar o estabelecimento de uma nova aprovação de produção.

  Os requerentes de novas aprovações de produção com base em certificações de produção emitidas
  anteriormente devem consultar a GTCO para obter assistência.

  Prerrogativas

  A seção 21.145 identifica as prerrogativas associadas a um COP. O detentor de um COP deve
  consultar a seção aplicável para garantir que ele conhece essas prerrogativas.

  Responsabilidade do detentor

  As seções 21.146, 21.316 e 21.616 prescrevem as responsabilidades de um detentor de um COP.
  Os detentores de um COP devem consultar a seção do requisito apropriado para o tipo de aprovação
  de produção que desejam obter ou manter a fim de garantir que eles compreendam todos os
  requisitos aplicáveis.

  O detentor de um COP é responsável por controlar a fabricação completa de produtos e artigos
  em conformidade com o projeto de tipo aprovado pela ANAC e com os requisitos do sistema
  de qualidade. Essa responsabilidade não pode ser delegada a (ou aliviada pelo uso de) fornecedores
  aprovados ou não.

  Embora essa responsabilidade nunca mude, o detentor do COP pode ser dispensado de parte
  da carga das tarefas de inspeção e de ensaios quando se utilizarem produtos com certificados
  de tipo ou artigos fabricados sob aprovação de produção de outra pessoa. Esse alívio pode
  ser estendido para incluir produtos ou artigos fabricados em um país estrangeiro e importados
  para o Brasil sobre o abrigo das disposições de um acordo bilateral conforme o RBAC 21,
  Subparte N - Aceitação de motores de aeronaves, hélices e artigos: Importação.

  Todos os tipos de detentor de COP possuem responsabilidades substancialmente similares,
  como descrito abaixo.

  O parágrafo (a) de cada uma das seções 21.146, 21.316 e 21.616 exige que o detentor do COP
  documente qualquer mudança organizacional. Essa documentação é realizada por meio da alteração
  do documento exigido pelas seções 21.135, 21.305 e 21.605 do RBAC 21, respectivamente, detalhando
  como a organização irá cumprir com as disposições das respectivas subpartes. O detentor
  do COP deve fornecer essas alterações à ANAC. Esse requisito garante à ANAC contínua informação
  sobre as mudanças na organização de um detentor de um COP, bem como a sua conformidade contínua
  com a respectiva subparte.

  O parágrafo (b) de cada seção exige que o detentor do COP mantenha o seu sistema de qualidade
  de acordo com os dados e procedimentos aprovados para o seu certificado de organização de
  produção.

  O parágrafo (c) de cada seção exige que o detentor do COP garanta que cada produto ou artigo
  esteja conforme com o seu projeto aprovado e em condição segura para operação.

  O parágrafo (d) de cada seção exige que o detentor do COP marque o produto ou artigo, conforme
  o RBAC 45, incluindo quaisquer peças críticas.

  O parágrafo (e) de cada seção exige que o detentor do COP identifique quaisquer partes do
  produto ou artigo que deixarem as instalações do fabricante como aprovado pela ANAC. Isso
  inclui o nome do fabricante e número da peça (part number), marca comercial, símbolo ou
  outra identificação do fabricante aprovada pela ANAC. A informação pode ser transmitida
  sob a forma de adesivos, etiquetas, documentos de embarque ou por outros meios. Essa informação
  também pode ser aplicada diretamente para os subconjuntos ou componentes de acordo com dados
  aprovados.

  O parágrafo (f) de cada seção exige que o detentor do COP tenha acesso aos dados do projeto
  de tipo necessários para determinar a conformidade e aeronavegabilidade para cada produto
  e artigo produzido sob o seu COP. O detentor de um CPAA segundo uma OTP ou carta de aprovação
  do projeto segundo uma OTP tem o requisito adicional de manter esses dados até que a produção
  do artigo seja descontinuada em definitivo. Nesse momento, cópias desses dados deverão ser
  enviadas para a ANAC.

  O parágrafo (g) de cada seção exige que o detentor do COP conserve o seu COP e torne-o disponível
  quando solicitado pela ANAC.

  O parágrafo (h) de cada seção exige que o detentor do COP coloque à disposição da ANAC as
  informações sobre toda delegação de autoridade conferida aos fornecedores. Isto inclui as
  delegações com a finalidade de realizar grandes inspeções, delegações relacionadas com a
  autorização de embarque direto e delegações relacionadas com a disposição de material não
  conforme.

  Emenda ao Certificado de Organização de Produção

  A seção 21.147 estabelece que qualquer requerente a uma emenda ao COP, para adicionar um
  Certificado de Tipo ou modelo, ou ambos, deve atender aos requisitos aplicáveis das seções
  21.137, 21.138 e 21.150 do RBAC 21.

  Qualquer requerente de uma emenda ao certificado de organização de produção, sob a seção
  21.147, deve solicitar uma emenda ao certificado de organização de produção da forma estabelecida
  pela ANAC. O subparágrafo 5.1.4.3 desta IS fornece o meio estabelecido pela ANAC para solicitação
  de emenda ao COP.

  Qualquer requerente pode solicitar uma emenda ao COP, sob a seção 21.147, para possibilitar
  a fabricação e instalação de componente de interface, desde que:

  o requerente possua os dados de projeto e de instalação para o componente de interface ou
  possua um acordo de licença para utilizar esses dados, e que esses dados estejam disponíveis
  para a ANAC quando requerido;

  o componente de interface seja fabricado pelo requerente;

  o produto do requerente esteja conforme o projeto de tipo, e o componente de interface esteja
  conforme o projeto de tipo;

  o produto montado, com o componente de interface instalado, esteja em condição de operação
  segura, a menos que especificado o contrário; e

  o requerente cumpra com qualquer outra condição e limitação que a ANAC julgar necessária.

  Aprovação de desvios

  A seção 21.618 exige que o fabricante que requerer a aprovação de um desvio a qualquer padrão
  de desempenho de uma OTP deve demonstrar que o requisito para o qual está solicitando desvio
  será compensado por fatores ou características de projeto que proporcionam um nível de segurança
  equivalente. O fabricante enviará à ANAC o requerimento para essa aprovação de desvios junto
  com todos os dados pertinentes. Se o artigo for fabricado em outro país, o requerimento
  para aprovação do desvio, juntamente com todos os dados pertinentes devem ser submetidos
  à ANAC, por meio da autoridade de aviação civil daquele país.

  Modificações de projeto

  As seções 21.319 e 21.619 descrevem o que constitui uma grande ou pequena modificação de
  projeto, assim como quem pode fazer essas modificações. Pequenas modificações serão aprovadas
  utilizando um método aceitável pela ANAC. Grandes modificações devem obter a aprovação da
  ANAC antes de incluí-la no projeto do artigo produzido sob um COP. O detentor do COP que
  não tenha certeza se uma modificação de projeto é grande ou pequena deve consultar à ANAC
  antes de implementar tal modificação.

  Mudanças no sistema da qualidade

  As seções 21.150, 21.320, e 21.620 estabelecem que cada mudança no sistema de qualidade
  está sujeita à avaliação da ANAC. Além disso, o detentor do COP deve notificar imediatamente
  a ANAC, por escrito, qualquer alteração que possa afetar a inspeção, conformidade ou aeronavegabilidade
  do seu produto ou artigo. O detentor do COP que deseje iniciar uma mudança no sistema de
  qualidade deverá apresentar as alterações propostas para a ANAC.

  Emissão de carta de aprovação de projeto segundo uma OTP: artigos importados

  A seção 21.621 descreve em que condições pode ser emitida uma carta de aprovação de projeto
  segundo uma OTP para os artigos importados.'
