title: Objetivo
text: 'Objetivo

  Esta Instrução Suplementar (IS) fornece informações para os detentores e requerentes de
  um Certificado de Organização de Produção (COP) de acordo com o RBAC 21, incluindo orientação
  a respeito do desenvolvimento e manutenção de Sistema da Qualidade e de Sistema de Produção.

  Os requisitos de fabricação e produção são abordados conforme o RBAC 21:

  Subparte F - Produção sob Certificação de Tipo;

  Subparte G - Certificação de Organização de Produção;

  Subparte K - Aprovação de Artigos e sua Fabricação; e

  Subparte O - Aprovação de Artigos Conforme uma Ordem Técnica Padrão e sua Fabricação.'
