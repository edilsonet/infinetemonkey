text: '1. OBJECTIVE

  Esta IS estabelece orientações sobre os requisitos de emissão de certificado de aeronavegabilidade
  para aeronaves da categoria leve esportiva.

  This IS provides guidelines on the requirements to the issuance of airworthiness certificate
  in the light-sport category aircraft.'
