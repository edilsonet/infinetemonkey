text: '5. SUBJECT DEVELOPMENT

  5.1 Aplicabilidade

  5.1 Applicability

  Esta IS é aplicável à emissão de certificado de aeronavegabilidade para aeronaves categoria
  leve esportiva.

  This IS is applicable to the issuance of airworthiness certificate in the light-sport category
  aircraft.

  5.2 Normas aceitas pela ANAC

  5.2 Standards accepted by the ANAC

  5.2.1 As normas aceitas pela ANAC para a categoria leve esportiva são emitidas pelo Comitê
  F37 da ASTM International com a participação de autoridades internacionais de aviação civil,
  entre elas, ANAC e FAA.

  5.2.1 The standards accepted by the ANAC for the light-sport category are issued by the
  F37 Committee of ASTM International with the participation of international civil aviation
  authorities, including the ANAC and the FAA.'
