text: 'PREÂMBULO

  PREAMBLE

  Esta Instrução Suplementar (IS) é publicada em língua portuguesa e em língua inglesa, formatada
  em duas colunas, a da esquerda em português e a da direita em inglês, sendo o texto português
  o texto oficial.

  This Supplemental Instruction (IS) is published in Portuguese and in English, formatted
  in two columns, on the left is the Portuguese text and on the right is the English text.
  The Portuguese text is the official text.'
