title: 5.1.1
text: '5.1.1

  A aprovação de aeronavegabilidade para exportação é concedida por intermédio da emissão

  de:

  a)

  Certificado de Aeronavegabilidade para Exportação - CAE: formulário F-100-

  12: emitido para aeronaves de acordo com o RBAC 21.329; ou

  b)

  Certificado de Liberação Autorizada - CLA: formulário F-100-01 (SEGVOO

  003): emitido para motores de aeronaves, hélices e artigos de acordo com o RBAC

  21.331.

  5.2

  Requisitos do país Importador'
