text: '5.2.1

  Países importadores com os quais o Brasil tenha acordo/procedimentos para aceitação

  recíproca de Certificados de Aeronavegabilidade para Exportação estabelecem neles os seus

  requisitos especiais para importar do Brasil produtos aeronáuticos. Esses requisitos são,
  de

  maneira geral, os requisitos especiais referidos no RBAC 21, Subparte L. Entretanto, isso

  não impede que um país solicite requisitos adicionais, que venham a ser julgados necessários

  para cada caso particular. Os acordos firmados pelo Brasil com autoridades aeronáuticas

  estrangeiras podem ser consultados no endereço eletrônico da Superintendência de

  Aeronavegabilidade - SAR: http://www2.anac.gov.br/certificacao/Acordos/Acordos.asp.'
