text: '5.2.2

  Países importadores com os quais o Brasil não tenha acordo/procedimentos estabelecidos

  podem informar à ANAC/GGCP os seus requisitos para aceitação de cada aprovação de

  aeronavegabilidade para exportação. A informação de um país importador dos seus

  requisitos especiais é considerada pelo Brasil como um acordo não formal. Nesse caso, o

  requerente pode consultar a ANAC/GGCP no endereço eletrônico: inspecao@anac.gov.br.'
