text: '5.2.4

  Quando um CAE ou CLA para motor ou hélice é solicitado para um país com o qual o Brasil

  não possua um acordo bilateral firmado, é preciso que o requerente obtenha uma declaração

  oficial da autoridade de aviação civil do país importador (carta ou e-mail oficial) informando

  os requisitos especiais para a aceitação dessa aprovação de aeronavegabilidade. Caso essa

  informação não tenha sido obtida, a ANAC/GGCP, mediante solicitação do requerente,

  contatará o país importador para obtenção de suas condições de aceitação do CAE.

  NOTA 1 - Se o país importador não informar suas condições de aceitação, a ANAC/GGCP

  certificará apenas o cumprimento dos RBAC aplicáveis, considerará como aceitação tácita

  das condições declaradas e emitirá a Aprovação de Aeronavegabilidade para Exportação

  com essa observação. Em tais condições, a garantia do cumprimento de quaisquer outros

  requisitos que o país importador impuser é de responsabilidade das pessoas, físicas ou

  jurídicas, exportadoras e importadoras.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  NOTA 2 - Em se tratando de emissão de CLA para artigos, a ANAC não realiza consulta

  com países com os quais não exista acordo bilateral firmado. Os procedimentos para

  exportação de artigos estão definidos na subseção 5.4.3.'
