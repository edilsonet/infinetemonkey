title: 5.2.5
text: '5.2.5

  Exceto para qualquer requisito adicional que tenha sido acordado com a ANAC/GGCP pelo

  país importador, e para os requisitos especiais referenciados no RBAC 21, a emissão de uma

  aprovação de aeronavegabilidade de exportação não atesta a conformidade com qualquer

  requisito que possa ir além dos padrões de aeronavegabilidade mínimos dos requisitos que

  regem a certificação e manutenção das aeronaves brasileiras. A ANAC/GGCP considera que

  os requisitos do país importador que exijam além desses padrões mínimos acordados com a

  ANAC/GGCP, e os requisitos especiais referenciados no RBAC 21, são assunto para ser

  estabelecido entre as pessoas, físicas ou jurídicas, importadoras e exportadoras.'
