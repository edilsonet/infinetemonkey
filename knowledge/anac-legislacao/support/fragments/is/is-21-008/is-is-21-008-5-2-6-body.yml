text: '5.2.6

  Quando um produto não satisfizer os requisitos especiais ou adicionais do país importador,

  a ANAC/GGCP contatará a autoridade aeronáutica do país importador para a obtenção de

  uma declaração escrita indicando que aquele país aceita este(s) desvio(s).'
