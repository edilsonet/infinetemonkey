text: '5.3.1

  Conforme estabelecido pelo RBAC 21.327, qualquer pessoa pode requerer uma aprovação

  de aeronavegabilidade para exportação. Esse requerimento deve atender também o previsto

  na Nota 4 do parágrafo 5.4.1.1.

  5.4

  Processo de emissão de aprovação de aeronavegabilidade para exportação'
