text: '5.4.1

  Emissão da aprovação de aeronavegabilidade para exportação


  Uma aprovação de aeronavegabilidade para exportação é emitido na forma de um

  Certificado de Aeronavegabilidade para Exportação para uma aeronave e na forma de um

  Certificado de Liberação Autorizada para um motor de aeronave, uma hélice ou um artigo.


  A data da emissão da aprovação de aeronavegabilidade para exportação é a data em que o

  resultado da inspeção for considerado encerrado pela ANAC/GGCP, ou seja, quando for

  constatado que o produto cumpre os requisitos aplicáveis e está em condições de operação

  segura.'
