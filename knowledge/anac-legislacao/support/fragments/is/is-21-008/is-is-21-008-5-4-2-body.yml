text: '5.4.2

  Solicitação de aprovação de aeronavegabilidade para exportação de aeronaves


  O requerente qualificado conforme item 5.3 desta IS, deve protocolar junto à ANAC/GGCP

  - São José dos Campos/SP diretamente por meio da plataforma digital SEI, utilizar os

  serviços dos Correios, ou entregar pessoalmente em seu protocolo, os seguintes documentos:


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  a)

  formulário F-100-06 devidamente preenchido, conforme determinam as instruções

  de preenchimento contidas no formulário. Um requerimento separado deve ser

  preenchido para cada aeronave;

  b)

  conforme descrito no item 5.2.4, uma declaração por escrito do país com a

  informação de que aceitará a aprovação de aeronavegabilidade para exportação. Ela

  deve incluir também a aceitação ou não dos CST/STC instalados, se:

  I -

  for uma aeronave fabricada no Brasil;

  II -

  for uma aeronave fabricada fora do Brasil e que esteja sendo exportada

  para um país com o qual o Brasil não tenha firmado um acordo mútuo

  concernente à validação de certificados de exportação;

  III -

  for uma aeronave desmontada que não tenha realizado ensaios em voo de

  produção;

  IV -

  não satisfizer aos requisitos ou exigências especiais do país importador; ou

  V -

  não atender aos requisitos especificados nas seções 21.329 e 21.331, como

  aplicável, para emissão de uma aprovação de aeronavegabilidade para

  exportação. A declaração escrita deve conter a lista de requisitos não

  atendidos;

  c)

  cópias digitalizadas da Taxa de Fiscalização da Aviação Civil (TFAC) pertinente à

  emissão de Certificado de Aeronavegabilidade para Exportação, enquadrada

  conforme tipo de aeronave, categoria de registro e peso máximo de decolagem, e

  seu respectivo comprovante de pagamento;

  d)

  cópias digitalizadas da Taxa de Fiscalização da Aviação Civil (TFAC) pertinente à

  vistoria técnica, enquadrada conforme tipo de aeronave, categoria de registro e peso

  máximo de decolagem, bem como seu respectivo comprovante de pagamento; e

  e)

  declaração de conformidade em formulário apropriado (F-300-18), caso seja uma

  aeronave nova e não tenha sido fabricada segundo um certificado de organização

  de produção.

  NOTA 1 - O requerimento F-100-06 deve indicar local e período em que a aeronave estará

  disponível para a vistoria.

  NOTA 2 - Caso o requerente pretenda realizar a vistoria por intermédio dos serviços de um

  profissional credenciado, o nome e credencial do profissional devem também ser informa-

  dos no formulário.

  NOTA 3 - Em vistorias realizadas por profissional credenciado, a atividade só deverá ser

  iniciada após o recebimento da STPC pelo profissional.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  NOTA 4 - Caso a pessoa que assine o requerimento não seja o proprietário da aeronave ou

  executivo titular para tal na empresa, deverá ser apresentada uma procuração que autorize

  a pessoa a interceder pela empresa com a finalidade em questão.

  NOTA 5 - A tabela de serviços pode ser acessada pelo sistema de emissão do formulário

  GRU, disponível no sitio da ANAC em serviços on-line.

  NOTA 6 - Nenhum processo de aprovação será iniciado antes da efetiva comprovação do

  pagamento dos serviços de certificação.

  NOTA 7 - A aeronave deverá estar disponível para a inspeção física em condições aerona-

  vegáveis, na oficina onde foram realizadas as últimas inspeções, ou em local onde estejam

  todos os registros de manutenção.

  NOTA 8 - O agendamento para a vistoria no Brasil deve ser realizado com antecedência

  mínima de 15 (quinze) dias úteis, e no exterior com antecedência mínima de 40 (quarenta)

  dias úteis.

  NOTA 9 - A inspeção física só poderá ser realizada após a apresentação da documentação

  listada no Apêndice B.


  Um Certificado de Aeronavegabilidade para Exportação (formulário F-100-12) certifica

  conformidade com os requisitos aplicáveis, mas não autoriza a operação da aeronave.'
