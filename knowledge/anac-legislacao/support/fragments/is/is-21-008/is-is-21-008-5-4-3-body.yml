text: '5.4.3

  Solicitação de aprovação de aeronavegabilidade para exportação para motores de

  aeronaves, hélices e artigos


  No caso de motor ou hélice, a aprovação de aeronavegabilidade para exportação (CLA) será

  emitida pela ANAC. Entretanto, um profissional credenciado pela ANAC, de acordo com o

  seu credenciamento, poderá realizar a inspeção do produto a ser exportado mediante a

  emissão de solicitação de trabalho.


  Um requerimento (formulário F-100-06) separado deve ser preenchido para cada motor ou

  cada hélice (que esteja sendo exportado não como parte de uma aeronave), exceto quando

  um requerimento se referir a mais de um motor ou mais de uma hélice, se todos forem de

  mesmo tipo e modelo e estiverem sendo exportados para o mesmo comprador e para o

  mesmo país. Neste caso, deverão ser adicionadas ao requerimento F-100-06 as cópias

  digitalizadas da Taxa de Fiscalização da Aviação Civil (TFAC) pertinente à emissão de

  Aprovação de Aeronavegabilidade para Exportação, enquadrada conforme potência do

  motor ou tipo de passo da hélice, e seu respectivo comprovante de pagamento.


  No caso de artigo, uma aprovação de aeronavegabilidade para exportação (CLA) pode ser

  emitida pela ANAC ou por um profissional credenciado pela ANAC, que atuará sem a

  necessidade de um requerimento formal à agência, de acordo com o seu credenciamento.


  Para a atuação direta da ANAC, um requerimento para aprovação de aeronavegabilidade

  para exportação de um artigo deve ser submetido à agência. Neste caso, deverá ser

  apresentada uma descrição dos métodos usados, se aplicável, para preservação e embalagem


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  de tais produtos, a fim de protegê-los contra corrosão e danos que possam ocorrer durante
  a

  viagem ou armazenamento. Deve ser informada, também, a duração da eficácia de tais

  métodos.


  Artigos devem ser identificados por um número de série ou equivalente, de modo a permitir

  uma identificação inequívoca com a respectiva emissão de Certificado de Liberação

  Autorizada (CLA), conforme o RBAC 45.

  NOTA 1 - Para fabricantes de produtos aeronáuticos detentores de um Certificado de Or-

  ganização de Produção (COP), como alternativa à emissão de um CLA, é possível a emissão

  de um documento de liberação autorizada de acordo com o previsto no RBAC 21.137(o) e

  na IS 21-006.

  5.5

  Responsabilidades dos exportadores'
