text: '5.5.1

  De acordo com o RBAC 21.335, o exportador que receber uma aprovação de

  aeronavegabilidade para exportação de um produto deverá:

  a)

  encaminhar à autoridade de aviação civil do país importador todos os documentos

  especificados pelo país importador;

  b)

  preservar e empacotar o produto ou artigo como necessário para protegê-lo contra

  corrosão e dano durante trânsito ou armazenamento e especificar a duração da

  eficácia desta preservação e empacotamento;

  c)

  remover ou fazer com que seja removida qualquer instalação temporária

  incorporada à aeronave para permitir o voo de translado para exportação e restituir

  a aeronave à configuração aprovada após conclusão do translado;

  d)

  quando conduzindo demonstrações para venda ou voos de translado para

  exportação, providenciar as correspondentes autorizações de entrada e sobrevoo de

  todos os países envolvidos; e

  e)

  na época em que o título de propriedade da aeronave for transferido para o

  comprador estrangeiro:

  I -

  solicitar à ANAC/RAB o cancelamento dos certificados brasileiros de

  aeronavegabilidade e de matrícula, informando a data da transferência de

  propriedade, o nome e o endereço do comprador estrangeiro;

  II -

  devolver os certificados de aeronavegabilidade e de matrícula à ANAC; e

  III -

  apresentar à ANAC uma declaração assegurando que as marcas de

  nacionalidade e de matrícula brasileiras foram removidas da aeronave,

  conforme estabelecido na seção 45.33 do RBAC 45.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  5.6

  Aprovações especiais de aeronavegabilidade para exportação de aeronaves'
