title: 5.5.1(e)
text: 'e)

  na época em que o título de propriedade da aeronave for transferido para o

  comprador estrangeiro:

  I -

  solicitar à ANAC/RAB o cancelamento dos certificados brasileiros de

  aeronavegabilidade e de matrícula, informando a data da transferência de

  propriedade, o nome e o endereço do comprador estrangeiro;

  II -

  devolver os certificados de aeronavegabilidade e de matrícula à ANAC; e

  III -

  apresentar à ANAC uma declaração assegurando que as marcas de

  nacionalidade e de matrícula brasileiras foram removidas da aeronave,

  conforme estabelecido na seção 45.33 do RBAC 45.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  5.6

  Aprovações especiais de aeronavegabilidade para exportação de aeronaves'
