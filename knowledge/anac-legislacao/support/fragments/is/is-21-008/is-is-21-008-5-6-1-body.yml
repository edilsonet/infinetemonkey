title: 5.6.1
text: '5.6.1

  A ANAC/GGCP pode emitir um CAE para uma aeronave de um exportador que, de posse

  de uma AEV com o propósito previsto pelo RBAC 21.197(a)(3), deseje realizar voos de

  demonstração para venda a prováveis clientes compradores em vários países e concluir um

  negócio de venda em um desses países.'
