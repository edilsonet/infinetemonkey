title: 5.6.3(b)
text: 'b)

  possuir todos os documentos e dados requeridos por cada país que conste do

  itinerário previsto, e ainda, garantir que estes documentos estejam disponíveis para

  qualquer um dos países listados no itinerário. Antes que seja emitido o CAE, o

  requerente deverá ainda cumprir os requisitos que envolvem a concordância com

  os padrões de aeronavegabilidade daqueles países; e'
