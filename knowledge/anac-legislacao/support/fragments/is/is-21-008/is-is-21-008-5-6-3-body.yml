text: '5.6.3

  O requerente de uma aprovação especial de aeronavegabilidade para exportação de aeronave

  deverá:

  a)

  seguir os mesmos procedimentos estabelecidos no item 5.4 desta IS, exceto que, no

  requerimento, os campos referentes a nome e endereço do comprador estrangeiro,

  bem como país de destino, não precisam ser preenchidos;

  b)

  possuir todos os documentos e dados requeridos por cada país que conste do

  itinerário previsto, e ainda, garantir que estes documentos estejam disponíveis para

  qualquer um dos países listados no itinerário. Antes que seja emitido o CAE, o

  requerente deverá ainda cumprir os requisitos que envolvem a concordância com

  os padrões de aeronavegabilidade daqueles países; e

  c)

  no caso de venda da aeronave em um dos países listados, riscar a tinta todos os

  países listados, com exceção daquele onde a venda foi concretizada.'
