text: '5.6.4

  Execução da vistoria


  Os servidores da ANAC ou Profissionais Credenciados devem realizar a vistoria de acordo

  com o estabelecido no formulário F-100-75 (Lista de Verificação), requisitos de importação

  e legislação vigente, devendo registrar o resultado da vistoria no formulário F-300-10

  (Relatório de Inspeção).


  Além das verificações previstas no F-100-75, deverão ser apresentados os documentos

  informados no APÊNDICE B dessa IS.


  As não conformidades registradas no formulário F-300-10 (Relatório de Inspeção) terão um

  prazo de até 90 (noventa) dias para serem corrigidas.'
