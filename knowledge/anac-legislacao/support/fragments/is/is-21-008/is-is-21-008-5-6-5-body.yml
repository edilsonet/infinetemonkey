text: '5.6.5

  Determinação de que um produto seja novo ou usado


  Motores ou hélices individuais a serem exportados, quando previamente instalados em uma

  aeronave e com qualquer tempo de serviço, são considerados produtos usados.


  Segundo o parágrafo 21.183(f) do RBAC 21, a data de fabricação de uma aeronave é a data

  na qual os registros de inspeção reflitam que a aeronave esteja completa e de acordo com
  o


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  projeto de tipo aprovado. Não obstante, uma aeronave é considerada nova se preencher um

  dos critérios descritos abaixo, caso contrário, é considerada usada.


  Uma aeronave é considerada nova no tempo em que estiver sob a propriedade do seu

  fabricante, distribuidor ou negociante; se não houver a intervenção de um proprietário

  particular, leasing ou acordo de compartilhamento; e se a aeronave não tiver sido utilizada

  em escola de pilotagem e / ou operação de táxi aéreo.


  Uma aeronave é ainda considerada nova, não obstante o tempo de operação registrado pelo

  fabricante, distribuidor, ou negociante quando:'
