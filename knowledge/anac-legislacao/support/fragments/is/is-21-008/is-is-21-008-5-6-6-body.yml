text: '5.6.6

  Aeronaves novas fabricadas por detentor de Certificado de Organização de Produção

  - COP


  Conforme estabelecido no RBAC 21.145, o detentor de um certificado de organização de

  produção pode obter um certificado de aeronavegabilidade da aeronave sem comprovações

  adicionais mediante a apresentação de uma declaração de conformidade na forma e maneira

  aceitável pela ANAC. Entretanto, a ANAC pode inspecionar a aeronave quanto à

  conformidade com o projeto de tipo, antes da emissão do referido certificado.'
