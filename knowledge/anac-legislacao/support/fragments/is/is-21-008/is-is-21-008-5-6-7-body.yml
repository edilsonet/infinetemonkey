  APÊNDICE B - RELAÇÃO DE DOCUMENTOS

  B.1.1

  Os seguintes documentos devem ser apresentados ao inspetor por ocasião da vistoria

  documental da aeronave:

  B.2

  Aeronaves Usadas

  a)

  o manual de voo da aeronave, quando ele for exigido pelos requisitos de

  aeronavegabilidade aplicáveis para a respectiva aeronave;

  b)

  os registros e a relação dos CST/STC instalados (se aplicável);

  c)

  registros secundários que traduzam a evidência objetiva do controle sobre as

  Diretrizes de Aeronavegabilidade (DA/AD) aplicáveis. Por exemplo, a confecção

  de um Mapa de Diretrizes de Aeronavegabilidade Brasileiras (DA) e do país do

  fabricante da aeronave, motor(es) e hélice(s), além dos componentes aplicáveis.

  Nestes registros incluir e justificar as DA/AD não aplicáveis conforme estabelecido

  na IS 39-001;

  d)

  registros primários que traduzam a evidência objetiva do cumprimento com as

  Diretrizes de Aeronavegabilidade aplicáveis. Quando uma Diretriz de

  Aeronavegabilidade (DA/AD) não tiver sido aplicada, deve-se confeccionar o

  registro aplicável justificando a não aplicabilidade;

  e)

  os Programas de Manutenção da aeronave, motor(es) e hélice(s);

  f)

  o Controle do Programa de Prevenção de Corrosão (se aplicável);

  g)

  o registro de cumprimento de todas as tarefas de manutenção aplicáveis

  estabelecidas no Programa de Manutenção ou na inspeção anual da aeronave,

  motor(es) e hélice(s).

  NOTA: Aeronaves usadas devem estar em dia com a inspeção anual de manutenção

  e devem ter sido aprovadas para retorno ao serviço, de acordo com o RBAC 43. A

  inspeção deve ter sido executada e apropriadamente documentada dentro dos 30

  (trinta) dias anteriores ao requerimento do certificado de aeronavegabilidade para

  exportação. Podem ser levadas em consideração inspeções executadas em

  aeronaves mantidas conforme um programa de aeronavegabilidade continuada de

  acordo com o RBAC 121, ou um programa de inspeções progressivas de acordo

  com o RBHA 91, ou RBAC que venha a substituí-lo, ou o RBAC 135, desde que

  realizadas dentro dos 30 (trinta) dias precedentes à data de submissão do

  requerimento do certificado de aeronavegabilidade para exportação.

  h)

  os registros e a documentação de todos os reparos executados na aeronave,

  motor(es) e hélice(s), após o registro no Brasil (IS 43.13-004);

  i)

  os registros e a documentação de todas as modificações feitas na aeronave e no

  "layout" da cabine, após o registro no Brasil;


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  j)

  a relação atualizada dos Componentes Controlados e com Tempo Limite de Vida

  (TLV), com horas/ciclos totais (se aplicável), horas e/ou ciclos após última inspeção

  (se aplicável), e horas/ciclos disponíveis;

  k)

  relatório de peso e balanceamento, conforme mencionado no RBAC 43, de acordo

  com o manual do fabricante, para cada aeronave, contendo, se aplicável, um

  esquema de carregamento. Modificações em equipamento não classificadas como

  grande modificação e que tenham sido realizadas após a pesagem podem ser

  contabilizadas com base em cálculos, sendo que o relatório deve ser revisado

  considerando tais cálculos. Os relatórios de peso e balanceamento devem incluir

  uma lista de equipamentos mostrando os pesos e os braços de momento de todos os

  itens requeridos e opcionais incluídos no peso vazio certificado.

  l)

  uma relação contendo todos os equipamentos de emergência da aeronave

  informando: o número de parte (P/N), número de série (S/N), data de fabricação,

  data da última inspeção ou do último teste, data de calibração e data de vencimento;

  m)

  o Certificado de Aeronavegabilidade e o Certificado de Matrícula e Nacionalidade

  da aeronave [RBAC 21.325(b) e 21.329(b)];

  n)

  o Certificado de Aeronavegabilidade de Exportação do País que exportou a

  aeronave para o Brasil ou comprovação da VTI (Vistoria Técnica Inicial);

  o)

  em caso de instalações temporárias incorporadas à aeronave visando

  especificamente à condução do voo de translado para exportação, uma descrição

  geral das instalações, juntamente com uma declaração de que elas serão removidas

  e a aeronave será restaurada à configuração aprovada por ocasião do término do

  voo de translado;

  p)

  para aeronaves usadas e produtos recentemente revisados, registros históricos, tais

  como cadernetas do avião e do motor, documentos de reparos e modificações etc.;

  e

  q)

  os dados demandados pelos requisitos ou exigências especiais do país importador.

  B.3

  Aeronaves Novas

  a)

  o Relatório Final de Inspeção contendo:

  I -

  a relação dos Boletins de Serviço (BS/SB) aplicados na aeronave, motor

  (es) e hélice(s);

  II -

  uma relação listando todos os itens serializados instalados no produto: por

  nomenclatura, número de parte (P/N) e número de série (S/N).

  III -

  Manual de Voo ou Manual de Operações e Checklist atualizados; e


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  IV -

  o “Layout” aprovado para acomodação de passageiros, para aeronaves

  categoria transporte de passageiros, refletindo a configuração que será

  entregue ao comprador.'
