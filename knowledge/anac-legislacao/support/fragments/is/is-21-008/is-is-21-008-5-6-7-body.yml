text: '5.6.7

  Guarda de documentos


  Ao final do processo, os seguintes documentos deverão ser protocolados na ANAC em

  formato digital:

  a)

  requerimento para CAE (F-100-06);

  b)

  lista de verificação (F-100-75);

  c)

  Relatório de Inspeção (F-300-10);

  d)

  carta de aceitação da autoridade do país importador, se aplicável;

  e)

  Certificado de Aeronavegabilidade;

  f)

  Certificado de Matrícula;


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  g)

  CAE do país exportador da aeronave para o Brasil, se aplicável;

  h)

  Registro de Peso e Balanceamento;

  i)

  registro da última inspeção realizada, se aplicável; e

  j)

  Relatório Final de Inspeção (somente para aeronaves novas), que deve conter:

  I -

  certificados de conformidade emitidos pelo setor de qualidade do

  fabricante;

  II -

  liberação para voo de produção;

  III -

  liberação para voo de produção;

  IV -

  voo de produção / teste em voo;

  V -

  certificados de exportação dos grandes componentes (motor, hélice, APU,

  etc.);

  VI -

  listas das modificações incorporadas; e

  VII -

  registros dos testes e medições realizadas durante o processo de produção.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  6

  APÊNDICE

  APÊNDICE A - LISTA DE REDUÇÕES.

