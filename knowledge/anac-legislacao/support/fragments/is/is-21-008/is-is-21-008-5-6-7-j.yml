text: 'j)

  Relatório Final de Inspeção (somente para aeronaves novas), que deve conter:

  I -

  certificados de conformidade emitidos pelo setor de qualidade do

  fabricante;

  II -

  liberação para voo de produção;

  III -

  liberação para voo de produção;

  IV -

  voo de produção / teste em voo;

  V -

  certificados de exportação dos grandes componentes (motor, hélice, APU,

  etc.);

  VI -

  listas das modificações incorporadas; e

  VII -

  registros dos testes e medições realizadas durante o processo de produção.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  6'
