text: 'a)

  o Relatório Final de Inspeção contendo:

  I -

  a relação dos Boletins de Serviço (BS/SB) aplicados na aeronave, motor

  (es) e hélice(s);

  II -

  uma relação listando todos os itens serializados instalados no produto: por

  nomenclatura, número de parte (P/N) e número de série (S/N).

  III -

  Manual de Voo ou Manual de Operações e Checklist atualizados; e


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  IV -

  o “Layout” aprovado para acomodação de passageiros, para aeronaves

  categoria transporte de passageiros, refletindo a configuração que será

  entregue ao comprador.'
