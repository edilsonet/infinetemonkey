title: apendice-b-relacao-de-documentos(k)
text: 'k)

  relatório de peso e balanceamento, conforme mencionado no RBAC 43, de acordo

  com o manual do fabricante, para cada aeronave, contendo, se aplicável, um

  esquema de carregamento. Modificações em equipamento não classificadas como

  grande modificação e que tenham sido realizadas após a pesagem podem ser

  contabilizadas com base em cálculos, sendo que o relatório deve ser revisado

  considerando tais cálculos. Os relatórios de peso e balanceamento devem incluir

  uma lista de equipamentos mostrando os pesos e os braços de momento de todos os

  itens requeridos e opcionais incluídos no peso vazio certificado.'
