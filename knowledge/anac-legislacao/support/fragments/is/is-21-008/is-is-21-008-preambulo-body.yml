title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 21-008

  Revisão B

  Aprovação:

  Portaria nº 1.105/SAR, de 9 de abril de 2019.

  Assunto:

  Aprovação de aeronavegabilidade para exportação.

  1

  OBJETIVO

  Estabelecer orientações para a emissão de aprovações de aeronavegabilidade para

  exportação de produto aeronáutico.

  2

  REVOGAÇÃO

  Esta IS revoga a IS 21-008 Revisão A.

  3

  FUNDAMENTOS

  3.1

  O Regulamento Brasileiro de Aviação Civil - RBAC 21, em sua Subparte L, estabelece os

  requisitos para a emissão de aprovação de aeronavegabilidade para exportação e as regras

  aplicáveis aos detentores de tal aprovação.

  3.2

  A Resolução nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a ANAC pode

  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em

  RBHA/RBAC.

  3.3

  De acordo com o mesmo art. 14, § 1°, o requerente que pretenda, para qualquer finalidade,

  demonstrar o cumprimento de requisito previsto em RBAC poderá adotar os meios e

  procedimentos previamente especificados em IS ou apresentar meio alternativo devidamente

  justificado, exigindo-se, nesse caso, a análise e concordância expressa da ANAC. E o § 2°

  do mesmo artigo estabelece que o meio alternativo de cumprimento deve garantir, ao menos,

  um nível equivalente de segurança ao estabelecido pelo requisito aplicável ou concretizar
  o

  objetivo do procedimento normalizado em IS.

  4

  DEFINIÇÕES

  4.1

  Requisitos especiais: São requisitos administrativos que devem ser satisfeitos como uma

  condição para exportação como, por exemplo, cópias de manuais de voo, certificado de

  autorização de voo para exportação, caderneta de célula, etc.

  4.2

  Requisitos adicionais: Quaisquer outros requisitos que não sejam requisitos especiais,

  especificados pelo país importador como necessários por sua base de certificação.


  Data de emissão: 12 de abril de 2019

  IS nº 21-008

  Revisão B


  5

  DESENVOLVIMENTO DO ASSUNTO

  5.1

  Aprovações de aeronavegabilidade para exportação'
