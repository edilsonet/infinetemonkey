title: DEFINITIONS
text: '4. DEFINITIONS

  4.1 Aeronave de construção amadora: De acordo com o parágrafo 21.191(g)-I do RBAC 21, é
  uma aeronave cuja porção maior foi construída por pessoas que realizaram a construção unicamente
  para sua própria educação ou recreação.

  4.1 Amateur-built aircraft: According to paragraph 21.191(g)-I of RBAC 21, it is an aircraft
  whose major portion was built by persons who undertook the construction project solely for
  their own education or recreation.

  4.2 Aeronave leve esportiva: significa uma aeronave, excluindo helicóptero ou aeronave cuja
  sustentação dependa diretamente da potência do motor (powered-lift), que, desde a sua certificação
  original, tem continuamente cumprido com as características definidas no RBAC 01.

  4.2 Light-sport aircraft: means an aircraft, other than a helicopter or powered-lift that,
  since its original certification, has continued to meet the characteristics defined in RBAC
  01.

  4.3 Aparelho: significa qualquer instrumento, equipamento, mecanismo, componente, peça,
  dispositivo, pertence ou acessório, incluindo equipamentos de comunicações, que é usado,
  ou com intenção de uso, na operação ou no controle de uma aeronave em voo e está instalado
  ou acoplado na aeronave e não faz parte da célula, do motor ou da hélice.

  4.3 Appliance: means any instrument, mechanism, equipment, part, apparatus, appurtenance,
  or accessory, including communications equipment, that is used or intended to be used in
  operating or controlling an aircraft in flight, is installed in or attached to the aircraft,
  and is not part of an airframe, engine, or propeller.

  4.4 Artigo: significa um material, peça, componente, processo ou aparelho.

  4.4 Article: means a material, part, component, process, or appliance.

  4.5 Dados Relevantes à Operação (Operational Suitability Data - OSD): significam as informações
  produzidas durante a certificação de tipo que são relevantes para a operação segura da aeronave,
  cujos elementos incluem os FCD e a MMEL, conforme definido no RBAC 01.

  4.5 Operational Suitability Data - OSD: means data produced during type certification which
  are relevant to the aircraft safe operation, whose elements include the FCD and the MMEL,
  as defined in RBAC 01.

  4.6 Dados Relevantes à Operação para Pilotos (Flight Crew Data - FCD): significam aqueles
  OSD relacionados à determinação da habilitação de tipo para piloto e especificações recomendadas
  para treinamento mínimo, exame e experiência recente.

  4.6 Flight Crew Data - FCD: means those OSD related to the determination of the pilot type
  rating and recommended specifications for minimum training, checking and currency.

  4.7 Especificação de tipo (Type Certificate Data Sheet - TCDS): significa o documento que
  compõe o certificado de tipo e é publicado e disponibilizado pela ANAC. A especificação
  de tipo sumariza as características relevantes do produto sob o ponto de vista de aeronavegabilidade
  e proteção ambiental e traz, ainda, condições e limitações necessárias para o cumprimento
  com os requisitos presentes na base de certificação do produto.

  NOTA: As Especificações de Tipo emitidas em português também podem ser encontradas sob as
  designações Especificação de Aeronave, Especificação de Motor ou Especificação de Hélice.

  4.7 Type Certificate Data Sheet - TCDS: means the document included in the type certificate
  and is published and made available by ANAC. The type certificate data sheet summarizes
  the relevant characteristics of the product in terms of airworthiness and environmental
  protection and contains, additionally, conditions and limitations necessary for the compliance
  with the requirements listed in the certification basis of the product.

  NOTE: Type Certificate Data Sheets issued in Portuguese may be also found under designations
  Especificação de Aeronave, Especificação de Motor or Especificação de Hélice.

  4.8 Estado de Projeto (State of Design): significa o país ou união de países que tem autoridade
  regulatória sobre a organização responsável pelo projeto e aeronavegabilidade continuada
  de um produto ou artigo utilizado na aviação civil.

  4.8 State of Design: means the country or union of countries having regulatory authority
  over the organization responsible for the design and continued airworthiness of a product
  or an article used in civil aviation.

  4.9 Lista Mestra de Equipamentos Mínimos (Master Minimum Equipment List - MMEL): significa
  um documento aprovado para um tipo ou modelo específico de aeronave que lista itens que
  podem estar temporariamente inoperantes, observadas as limitações, procedimentos e condições
  especiais de operação ali descritas, conforme aplicável.

  4.9 Master Minimum Equipment List - MMEL: means an approved document for a specific aircraft
  type or model which lists items that may be temporarily inoperative, provided that limitations,
  procedures and special operating conditions therein described are met, as applicable.

  4.10 Peça comercial: significa um artigo que está na lista de peças comerciais aprovada
  pela ANAC ou pela Autoridade de Aviação Civil do Estado de Projeto, incluída nas instruções
  de aeronavegabilidade continuada de um detentor de aprovação de projeto, conforme requerido
  pela seção 21.50 do RBAC 21 ou requisito equivalente no Estado de Projeto.

  4.10 Commercial part: means an article that is listed in the Commercial Parts List approved
  by ANAC or by the Civil Aviation Authority from the State of Design, included in a design
  approval holder’s instructions for continued airworthiness in accordance with section 21.50
  of RBAC 21 or equivalent requirement in the State of Design.

  4.11 Peça normalizada ou padronizada: Peça fabricada de acordo com especificações governamentais
  ou de larga aceitação pela indústria que inclui projeto, fabricação e requisitos de identificação.
  A especificação deve incluir toda a informação necessária para produzir a peça em série.
  A especificação deve ser publicada de maneira que qualquer um possa fabricar a peça. Alguns
  exemplos incluem, mas não se limitam à: National Aerospace Standards - NAS, Air Force-Navy
  Aeronautical Standard - AN, SAE International, Aerospace Standard - AS, Military Standard
  - MS, etc.

  4.11 Standard part: A part manufactured in accordance with an established governmental or
  industry-accepted specification, which includes design, manufacturing, and identification
  requirements. The specification must include all information necessary to produce in series
  the part. The specification must be published so that any party may manufacture the part.
  Examples include, but are not limited to, National Aerospace Standard - NAS, Air Force/Navy
  - AN Aeronautical Standard, SAE International, Aerospace Standard - AS, Military Standard
  - MS, etc.

  4.12 Produto: significa aeronave, motor ou hélice, e seus componentes.

  4.12 Product: An aircraft, engine or propeller, and its components.

  4.13 Produto novo: a menos que definido de forma diferente em acordo internacional com a
  Autoridade de Aviação Civil do país exportador, um produto é novo nas seguintes situações:

