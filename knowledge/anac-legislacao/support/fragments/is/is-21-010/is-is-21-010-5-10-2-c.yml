section_title: 'The following are considered Brazilian special requirements:'
subsection_id: c
cite: 5.10.2(c)
title: 5.10.2(c)
text: 'c) The operational requirements related to noise.

  5.10.3 Certas não conformidades com os requisitos brasileiros podem ser aceitas pela ANAC,
  mediante solicitação. Caso sejam aceitas, essas não conformidades devem constar da (ou estar
  anexadas à) aprovação de aeronavegabilidade para exportação.

  5.10.3 Certain non-conformities with the Brazilian requirements may be accepted by ANAC,
  upon application. In case they are accepted, those non-conformities shall be evident in
  (or be attached to) the Export Airworthiness Approval.'
