section_title: 'Some foreign products are not allowed to be used in Brazil, emphasis given
  to:'
subsection_id: a
cite: 5.11.4(a)
title: 5.11.4(a)
text: a) produtos que não possuam aprovação de aeronavegabilidade para exportação quando requerida.
  Desta forma, não é permitida a utilização no Brasil de produtos sucateados, acidentados
  ou danificados que não tenham sido previamente reparados conforme regulamentação de manutenção
  aplicável. Estão incluídos neste grupo aeronaves e peças vendidas como “salvados” de acidentes,
  com corrosão excessiva, motores que sofreram parada brusca sem reparo posterior, hélices
  retorcidas, dentre outros;
