kind: is
document: is-21-010
family: '21'
section_id: 5.11.4
section_title: 'Some foreign products are not allowed to be used in Brazil, emphasis given
  to:'
subsection_id: b
cite: 5.11.4(b)
title: 5.11.4(b)
text: b) aeronaves, motores e hélices que possuam certificado de tipo no Brasil ou no país
  de projeto, ou peças elegíveis para instalação em tais aeronaves, motores e hélices, e que
  não sejam rastreáveis ao produto certificado, incluindo ausência ou danos de plaquetas ou
  marcações requeridas pelo RBAC 45, ou ausência ou irregularidades na documentação que comprove
  a procedência do produto (registros de manutenção de remoção, certificado de liberação autorizada,
  etc.);
