id: is-is-21-010-5-11-4-e
kind: is
document: is-21-010
family: '21'
section_id: 5.11.4
section_title: 'Some foreign products are not allowed to be used in Brazil, emphasis given
  to:'
subsection_id: e
cite: 5.11.4(e)
title: 5.11.4(e)
text: 'e) finished aircraft, either new or used, intended for obtaining an Experimental Flight
  Authorization Certificate - CAVE with the purpose of operating an amateur-built aircraft,
  as per paragraph 21.191(g)-I of RBAC 21.

  NOTA 1: Uma aeronave de construção amadora é considerada pronta se sua construção tiver
  sido finalizada anteriormente ou se seus conjuntos maiores (por exemplo, fuselagem, asas,
  etc.) estiverem finalizados, faltando apenas sua montagem após transporte.

  NOTA 2: Uma aeronave que tenha sido desmontada para transporte permanece na condição de
  aeronave pronta.

  NOTA 3: Um kit de aeronave para um construtor amador finalizar a construção no Brasil não
  é considerado uma aeronave pronta.

  NOTA 4: É permitida a importação de aeronave construída por amador no Brasil que, após obtenção
  do CAVE junto à ANAC, foi exportada e pretende-se admiti-la novamente no Brasil para o mesmo
  propósito original.

  NOTE 1: An amateur-built aircraft is considered finished if its construction has been previously
  finished or if its major assemblies (e.g. fuselage, wings, etc.) have been finished, remaining
  its final assembly after transportation.

  NOTE 2: An aircraft which has been disassembled for transportation remains in the condition
  of finished aircraft.

  NOTE 3: An aircraft kit for an amateur to finish its construction in Brazil is not considered
  a finished aircraft.

  NOTE 4: It is allowed the import of aircraft built by an amateur in Brazil which, after
  the issuance of the CAVE by ANAC, was exported and is intended to be admitted again in Brazil
  for the same original purpose.'
