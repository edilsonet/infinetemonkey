section_id: 5.3.15
section_title: 'At least the following documents are also required for each delivered aircraft:'
subsection_id: d
cite: 5.3.15(d)
title: 5.3.15(d)
text: 'd) Summary of maintenance, repairs and alterations performed during the aircraft life
  (for used aircraft only).

  5.3.16 Para a aeronave operar, o cumprimento com os requisitos operacionais e especiais
  aplicáveis para as operações de voo pretendidas no Brasil deve ser estabelecido. Estes requisitos
  podem requerer a instalação de equipamento adicional. Tais instalações serão analisadas
  e aprovadas pela ANAC durante a análise de engenharia.

  5.3.16 For the aircraft to operate, the compliance with ANAC operational requirements and
  special applicable requirements for the intended flight operations in Brazil shall be established.
  These requirements may demand additional equipment installation. Such installations will
  be analyzed and approved by ANAC during the engineering analysis.

  5.3.17 Um CT brasileiro e a Especificação de Tipo (Type Certificate Data Sheet - TCDS) correspondente
  serão emitidos com base no cumprimento de requisitos estabelecidos no relatório final de
  validação.

  5.3.17 A Brazilian TC and the corresponding Type Certificate Data Sheet - TCDS will be issued
  upon compliance with the requirements established on the final validation report.

  5.4 Validação de certificado de tipo para motores ou hélices importados

  5.4 Validation of Type Certificates for Imported Aircraft Engine or Propeller

  5.4.1 O fabricante estrangeiro do motor ou hélice de aeronave em questão deve preencher
  o formulário de requerimento F-101-11 (disponível em www.anac.gov.br/certificacao), ou elaborar
  uma carta com as informações solicitadas em tal formulário, e encaminhá-lo à ANAC através
  da autoridade do Estado de Projeto. Os documentos poderão ser enviados pelo e-mail progcert@anac.gov.br.

  5.4.1 An ANAC application form F-101-11 (available at https://sistemas.anac.gov.br/certificacao/indexE.asp)
  or an application letter with the same information required by the form shall be completed
  by the foreign manufacturer of the concerned aircraft, engine or propeller, and forwarded
  to ANAC through the State of Design authority. Documents may be sent to the e-mail address
  progcert@anac.gov.br.

  5.4.2 Devem ser apresentadas à ANAC informações suficientes para permitir que a ANAC tenha
  condições de definir o tipo de validação, a equipe e o nível de envolvimento. Devem ser
  seguidas as orientações contidas no Apêndice C desta IS.

  5.4.2 Sufficient information shall be presented to ANAC to allow ANAC to define the type
  of validation, the team and its level of involvement. The guidelines contained in Appendix
  C of this IS shall be followed.

  5.4.3 O texto da autoridade do Estado de Projeto de todas as condições especiais, níveis
  equivalentes de segurança e isenções de requisitos de aeronavegabilidade, ruído e emissões
  deve ser disponibilizado para análise da ANAC.

  5.4.3 The text of all special conditions issued by the State of Design Authority, as well
  as equivalent levels of safety and exemptions from airworthiness, noise and emissions requirements
  shall be made available for ANAC review.

  5.4.4 Uma lista de verificação de cumprimento (compliance checklist) com a base de certificação,
  indicando para cada item do requisito como ele foi cumprido (por ensaio, análise, cálculo,
  etc.) e o título e o número do documento de substanciação correspondente (relatório, desenho,
  especificação, etc.), deve ser disponibilizada para a ANAC para sua análise. Adicionalmente,
  tais documentos de substanciação devem ser apresentados, se assim exigido.

  5.4.4 A compliance checklist with the certification basis indicating, for each item of each
  requirement, how it was complied with (by test, analysis, calculation, design provisions,
  etc.) and the title and number of the corresponding substantiation document (report, drawing,
  specification, etc.) shall be made available to ANAC for review. Additionally, these substantiation
  documents shall be presented, if required.

  5.4.5 Uma análise de engenharia do programa de certificação de tipo, conduzido pelo Estado
  de Projeto será realizada pela ANAC, para identificar o cumprimento com os requisitos brasileiros
  e as condições especiais para aceitação do modelo de motor ou hélice de aeronave. Esta análise
  será conduzida por meio de reuniões, ou por correspondência com os representantes do fabricante
  e da autoridade do Estado de Projeto. Ao final do processo, a ANAC irá apresentar o relatório
  final de validação, listando os requisitos para aceitação do modelo de motor ou hélice de
  aeronave.

  5.4.5 An engineering review of the type certification program conducted by the State of
  Design will be performed by ANAC to identify the compliance with the Brazilian requirements
  and special conditions for acceptance of the aircraft engine or propeller model. This analysis
  will be conducted through meetings or by correspondence with the manufacturer and with the
  State of Design Authority representatives. At the end of such process, ANAC will present
  a final validation report listing the requirements for acceptance of the aircraft engine
  or propeller models.

  5.4.6 Os dados exigidos pela ANAC estarão listados no relatório de validação mencionado
  no parágrafo anterior e deverá incluir todos os documentos publicados (Manual de Instalação
  e Operação, Manual de Manutenção e Revisão, Catálogo de Peças Ilustrado, Boletins de Serviço,
  etc.) e os documentos não publicados (relatórios de engenharia, desenhos, especificações
  do fabricante, etc.) considerados necessários para substanciar a aprovação brasileira e
  para dar suporte à aeronavegabilidade continuada do motor ou hélice de aeronave no Brasil.

  5.4.6 The data required by ANAC are listed in the validation report mentioned in the previous
  paragraph and shall include all published documents (Installation and Operation Manual,
  Maintenance and Overhaul Manual, Illustrated Parts Catalog, Service Bulletins, etc.) and
  non-published documents (engineering reports, drawings, manufacturer specifications, etc.)
  deemed necessary to substantiate the Brazilian approval and support the continued airworthiness
  of the aircraft engine or propeller in Brazil.

  5.4.7 Os documentos publicados devem ser fornecidos à ANAC preferencialmente em formato
  eletrônico com acesso online e disponibilização de login e senha. Caso alguma publicação
  não esteja disponível online, solicita-se o envio da mesma para o e-mail biblioteca.central@anac.gov.br.

  5.4.7 The published documents shall be supplied to ANAC preferably in electronic format
  through online access with login and password. In case any publication is not available
  online, it shall be sent by e-mail to biblioteca.central@anac.gov.br.

  5.4.8 Um CT brasileiro e a Especificação de Tipo (Type Certificate Data Sheet - TCDS) correspondente
  serão emitidos com base no cumprimento de requisitos estabelecido no relatório final de
  validação.'
