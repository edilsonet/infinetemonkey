text: '5.3.5

  Provisão para placares bilingues foi estendida de "português e inglês" para "português e
  outra língua".

  Provision for bilingual placards was extended from "Portuguese and English" to "Portuguese
  and another language".

  5.3.7, 5.3.8, 5.3.9, 5.3.10

  Inclusão de provisões para OSD na validação de certificados de tipo de aeronaves. Renumeração
  dos itens subsequentes.

  Inclusion of OSD provisions for validation of aircraft type certificates. Renumbering of
  subsequent items.'
