title: A Brazilian TC and corresponding TCDS will be issued upon compliance with the requirements
  established in the final validation report.
text: '5.4.8 A Brazilian TC and corresponding TCDS will be issued upon compliance with the
  requirements established in the final validation report.

  5.5 Validação de certificado suplementar de tipo para aeronave, motor ou hélice importados

  5.5 Validation of Supplemental Type Certificate for Imported Aircraft, Engine or Propeller

  5.5.1 O detentor estrangeiro do CST deve preencher o formulário de requerimento F-101-11
  (disponível em www.anac.gov.br/certificacao), ou elaborar uma carta com as informações solicitadas
  em tal formulário, e encaminhar à ANAC através da autoridade do Estado de Projeto, juntamente
  com informações de engenharia suficientes para permitir que a ANAC tenha condições de se
  familiarizar com a modificação introduzida no projeto de tipo.

  5.5.1 An ANAC application form F-101-11 (available at https://sistemas.anac.gov.br/certificacao/indexE.asp)
  or an application letter with the same information required by the form shall be completed
  by the foreign holder of the Supplemental Type Certificate - STC and forwarded to ANAC through
  the State of Design Authority, together with sufficient engineering information to permit
  ANAC to become acquainted with the change introduced in the type design.

  5.5.2 Uma cópia do CST e seus adendos juntamente com o texto de todas as condições especiais,
  níveis equivalentes de segurança e isenções de requisitos de aeronavegabilidade, ruído e
  emissões devem ser disponibilizadas para a ANAC para análise e aprovação.

  5.5.2 A copy of the supplemental type certificate and its addendum together with the text
  of all special conditions, equivalent levels of safety and exemptions from airworthiness,
  noise and emissions requirements shall be made available to ANAC for analysis and approval.

  5.5.3 Uma lista de verificação de cumprimento (compliance checklist), ou documento similar,
  mostrando o cumprimento com os requisitos afetados pela modificação, indicando para cada
  item do requisito como ele foi cumprido (por ensaio, análise, cálculo, etc.) e o título
  e número do documento de substanciação correspondente (relatório, desenho, especificação,
  etc.), devem ser disponibilizados para a ANAC para análise. Adicionalmente, tais documentos
  de substanciação devem ser apresentados, se assim exigido.

  5.5.3 A compliance checklist, or similar document, showing compliance with the requirements
  affected by the change, indicating, for each item, how it was complied with (by test, analysis,
  calculation, etc.), and the title and number of the corresponding substantiation document
  (report, drawing, specification, etc.), shall be made available to ANAC for review. Additionally,
  these substantiation documents shall be presented, if required.

  5.5.4 As marcações e placares requeridos e instalados na cabine de passageiros ou nos compartimentos
  de carga, bagagem ou armazenamento e no exterior da aeronave, devem ser apresentados em
  português ou forma bilíngue (português e outra língua), a menos que de outra forma prescrito
  pela ANAC.

  5.5.4 The required markings and placards installed in passenger cabin, cargo, baggage or
  stowage compartments and in the aircraft exterior shall be presented in Portuguese or in
  a bilingual way (Portuguese and another language), unless otherwise prescribed by ANAC.

  5.5.5 Um Suplemento ao Manual de Voo da Aeronave (Aircraft Flight Manual Supplement) aplicável
  às aeronaves registradas no Brasil deve ser apresentado .O Suplemento ao Manual de Voo da
  Aeronave original, aprovado pela autoridade do Estado de Projeto, pode ser aceito pela ANAC.

  5.5.5 An Aircraft Flight Manual Supplement applicable to the Brazilian registered aircraft
  shall be presented. The original Aircraft Flight Manual Supplement approved by the State
  of Design Authority may be considered acceptable to ANAC.

  5.5.6 De acordo com a seção 21.107-I do RBAC 21, o requerente de validação de CST elegível
  para aeronave que possua OSD deve avaliar o impacto aos OSD no caso de requerimento realizado
  após 1° de janeiro de 2025, devendo demonstrar que os OSD existentes permanecem válidos
  à aeronave com o CST incorporado, ou complementar o requerimento de validação do CST com
  a atualização dos OSD afetados. Tal avaliação não impede a emissão do CST brasileiro, todavia
  deve ser realizada antes da operação de uma aeronave com certificado de aeronavegabilidade
  padrão brasileiro com o CST incorporado. Ainda assim, caso o requerente não cumpra com tais
  provisões, a ANAC poderá limitar o uso dos OSD afetados pela modificação, conforme critérios
  detalhados nas IS n°s 21.61-005 e 21.61-001.

  NOTA: Relatórios de avaliação operacional e MMEL emitidos ou aprovados pela ANAC até 1°
  de janeiro de 2025 e que sejam aplicáveis aos modelos de aeronaves elegíveis ao CST também
  devem ser avaliados quanto ao impacto das modificações mencionadas acima.

  5.5.6 According to section 21.107-I of RBAC 21, the applicant for validation of a STC eligible
  for an aircraft having OSD shall assess the impact on OSD in case of application submitted
  after January 1st, 2025, by demonstrating that the existing OSD remain valid to the aircraft
  with the embodied STC, or by complementing the STC validation application with an update
  to the affected OSD. Such assessment does not prevent the issuance of the Brazilian STC,
  however it shall be done prior to the operation of an aircraft having a Brazilian standard
  certificate of airworthiness with the embodied STC. Even so, in case the applicant does
  not comply with such provisions, ANAC my limit the use of the OSD affected by the change,
  according to the criteria detailed in IS No. 21.61-005 and 21.61-001.

  NOTE: Operational Evaluation Reports and MMEL issued or approved by ANAC until January 1st,
  2025 which are applicable to aircraft models eligible to the STC shall also be assessed
  upon the impact of the abovementioned changes to the TC.

  5.5.7 Uma análise de engenharia do programa de certificação suplementar de tipo, conduzido
  pelo Estado de Projeto, será realizada pela ANAC, para identificar o cumprimento com os
  requisitos brasileiros e as condições especiais para aceitação da modificação. Esta análise
  será conduzida por meio de reuniões, ou por correspondência com os representantes do detentor
  do certificado e da autoridade do Estado de Projeto. Ao final do processo, a ANAC irá apresentar
  o relatório final de validação, listando os requisitos para aceitação da modificação da
  aeronave, motor ou hélice.

  5.5.7 An engineering review of the supplemental type certification program conducted by
  the State of Design will be performed by ANAC to identify the compliance with Brazilian
  requirements and special conditions for acceptance of the change. This review will be conducted
  through meetings or by correspondence with the holder of the supplemental type certificate,
  or equivalent document, and with the State of Design Authority representatives. At the end
  of such process, ANAC will present a final validation report listing the requirements for
  acceptance of the changed aircraft, engine or propeller model.

  5.5.8 Os dados exigidos pela ANAC estarão listados no relatório de validação mencionado
  no parágrafo anterior e deverá incluir todos os documentos publicados (Manual de Voo da
  Aeronave, MMEL, FCD, Manuais de Manutenção e Reparo, Catálogo de Peças Ilustrado, Diagramas
  Elétricos, Manual de Peso e Balanceamento, Boletins de Serviço, etc.) e os documentos não
  publicados (relatórios de engenharia, desenhos, especificações do fabricante, etc.) desenvolvidos
  pelo detentor do CST considerados necessários para substanciar a aprovação brasileira e
  para dar suporte à aeronavegabilidade continuada das aeronaves modificadas, registradas
  no Brasil.

  5.5.8 The data required by ANAC are listed in the validation report mentioned in the previous
  paragraph and shall include all published documents (Aircraft Flight Manual, MMEL, FCD,
  Maintenance and Repair Manuals, Illustrated Parts Catalogs, Wiring Diagrams, Weight and
  Balance Manuals, Service Bulletins, etc.) and non-published documents (engineering reports,
  drawings, manufacturer specifications, etc.) developed by the holder of the supplemental
  type certificate deemed necessary to substantiate the Brazilian approval and support the
  continued airworthiness of the changed aircraft registered in Brazil.

  5.5.9 As alterações dos documentos publicados devem ser fornecidas para a ANAC. A ANAC deve
  ser incluída na lista de correspondências do CST para receber atualizações regulares de
  tais documentos através do e-mail ccst@anac.gov.br.

  5.5.9 The alterations of the published documents shall be supplied to ANAC. ANAC shall be
  included in the mailing list of the STC holder to receive regular updates of such documents
  in the e-mail ccst@anac.gov.br.'
