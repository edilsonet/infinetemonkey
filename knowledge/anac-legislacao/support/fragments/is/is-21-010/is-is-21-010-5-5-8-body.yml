text: '5.5.8 (antigo / former 5.5.7)

  Inclusão de MMEL e FCD na lista de documentos publicados.

  Inclusion of MMEL and FCD in the list of published documents.

  5.10.4(a)(c), 5.11.4(a)(b)

  Substituição de "parte" por "peça" no texto em português.

  The term "parte" was changed to "peça" in the Portuguese version.

  5.11.4(e)

  Atualização da restrição para importação de aeronave de construção amadora pronta, com base
  no seu propósito de utilização no Brasil.

  Update in the restriction for import of a finished amateur-built aircraft, based on its
  intended purpose in Brazil.'
