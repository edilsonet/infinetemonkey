text: '5.7.5 The import TSO/ETSO articles (or equivalent) shall come along with an airworthiness
  approval for export (EASA Form 1, FAA Form 8130-3 or equivalent).

  5.8 Componentes de aeronave, motor ou hélice

  5.8 Aircraft, Engine or Propeller Components

  5.8.1 Componentes de fabricação estrangeira de aeronave, motor ou hélice, com aprovação
  emitida por uma autoridade estrangeira (tais como Parts Manufacturer Approval - PMA, etc.),
  não necessitam de aprovação brasileira específica. Entretanto, estes produtos são elegíveis
  para a instalação em aeronaves com CA Padrão brasileiro ou em motores e hélices de aeronaves
  operados no Brasil somente quando:

  5.8.1 Aircraft, engine or propeller foreign components, with approval issued by a foreign
  authority (such as Parts Manufacturer Approval - PMA, TSO/ETSO, etc.), do not need a specific
  Brazilian approval. However, these products are eligible for installation in aircraft with
  Brazilian Standard Airworthiness Certificate or in aircraft engines and propellers operated
  in Brazil only when:'
