title: FINAL DISPOSITIONS
text: '7. FINAL DISPOSITIONS

  7.1 Os casos omissos serão dirimidos pela ANAC.

  7.1 Cases not covered by this IS will be solved by ANAC.

  7.2 O conteúdo desta IS pode não se aplicar completamente nas situações em que o mesmo assunto
  é abordado em acordos firmados entre o Brasil e outros países e entre a ANAC e outra Autoridade
  de Aviação Civil, sendo que nestas situações deve ser seguido o estabelecido no respectivo
  acordo.

  7.2 The content of this IS may not be completely applicable to situations whose subject
  is described in agreements between Brazil and other countries and between ANAC and another
  Civil Aviation Authority. In these situations, the corresponding agreement shall prevail.'
