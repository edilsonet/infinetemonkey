text: 'APÊNDICE D - ALTERAÇÕES REALIZADAS NA REVISÃO H

  APPENDIX D - MODIFICATIONS IN REVISION H

  ITEM ALTERADO

  (MODIFIED ITEM)

  ALTERAÇÃO REALIZADA

  IMPLEMENTED MODIFICATION

  2

  Alteração da letra de revisão da IS revogada.

  Changed revision letter from revoked IS.

  3.3

  Inclusão da base legal para os requisitos de OSD. Renumeração dos itens subsequentes.

  Inclusion of legal basis for OSD requirements. Renumbering of subsequent items.

  4.4

  Substituição de "parte" por "peça" no texto em português.

  The term "parte" was changed to "peça" in the Portuguese version.

  4.5

  Inclusão de definição para OSD.

  Inclusion of OSD definition.

  4.6

  Inclusão de definição para FCD.

  Inclusion of FCD definition.

  4.7

  Inclusão de definição para TCDS. Renumeração dos itens subsequentes.

  Inclusion of TCDS definition. Renumbering of subsequent items.

  4.9

  Inclusão de definição para MMEL. Renumeração dos itens subsequentes.

  Inclusion of MMEL definition. Renumbering of subsequent items.

  4.10 (antigo / former 4.6)

  Substituição de "parte" por "peça" no texto em português.

  The term "parte" was changed to "peça" in the Portuguese version.

  4.11 (antigo / former 4.7)

  Sigla para SAE foi excluída, sendo denominada SAE International.

  Acronym for SAE was excluded, being designated as SAE International.'
