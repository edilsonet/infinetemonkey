section_id: C1.1
section_title: Uma vez que o produto já foi certificado ou está sendo certificado por sua
  autoridade primária, o processo de validação consiste na verificação amostral de que o produto
  (aeronave, motor e hélice) cumpre com os requisitos de aeronavegabilidade aplicáveis, por
  meio de análises de dados técnicos de engenharia, inspeções e ensaios.
