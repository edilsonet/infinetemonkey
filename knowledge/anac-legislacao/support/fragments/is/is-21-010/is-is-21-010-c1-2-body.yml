text: 'C1.2 This sample verification is carried out in order to guarantee a minimum level
  of safety ensured by the certification requirements, according to the level of involvement
  defined by ANAC. The level of involvement varies according to the validation process, which
  may be of three types: standard validation, simplified validation or expedited validation,
  with standard validation being the one with the possibility of a higher level

  of involvement and the expedited validation with the possibility of a lower level of involvement.

