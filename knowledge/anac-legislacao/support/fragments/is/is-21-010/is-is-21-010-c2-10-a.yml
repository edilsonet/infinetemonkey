section_id: C2.10
section_title: 'ANAC''s involvement will take place through the elaboration of a work plan
  and subsequent opening of Validation Action Items (VAI) in the relevant areas, according
  to the scope of the project and according to the following level of involvement criteria:'
subsection_id: a
cite: C2.10(a)
title: C2.10(a)
text: 'a) Relevant certification issues:

  I - Questões inusitadas da base de certificação (Isenções, Níveis Equivalentes de Segurança
  - ELOS, Condições Especiais - SC e regulamentação menos restritiva que a brasileira correspondente);

  I - Unusual issues of the certification basis (Exemptions, Equivalent Level of Safety -
  ELOS, Special Conditions - SC, and regulation less restrictive than the corresponding Brazilian
  one);

  II - Questões inusitadas sobre meios de cumprimento;

  II - Unusual questions about means of compliance;

  III - Tratamento das dificuldades em serviço conhecidas relativas ao projeto; e

  III - Handling of known in-service difficulties related to the project; and

  IV - Questões técnicas sensíveis sobre harmonização de verificação/demonstração de cumprimento
  de requisitos.

  IV - Sensitive technical issues regarding harmonization of requirements verification/demonstration.'
