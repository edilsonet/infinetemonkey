section_title: 'ANAC''s involvement will take place through the elaboration of a work plan
  and subsequent opening of Validation Action Items (VAI) in the relevant areas, according
  to the scope of the project and according to the following level of involvement criteria:'
subsection_id: b
cite: C2.10(b)
title: C2.10(b)
text: 'b) Complexity or specific operation:

  I - Especificidades de operação no Brasil (operação em aeroportos específicos, parâmetros
  de FDR, antenas HF, GPS, WAAS, etc.); e

  I - Specifics of operation in Brazil (operation in specific airports, FDR parameters, HF
  antennas, GPS, WAAS, etc.); and

  II - Operações pretendidas não convencionais (transporte de carga externa, operações restritas
  diversas, etc.); e

  II - Unconventional intended operations (external cargo transport, miscellaneous restricted
  operations, etc.); and'
