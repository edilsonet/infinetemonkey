section_title: Autoridade Primária. Os processos de validação simplificada ou expedita são
  elegíveis aos requerentes estrangeiros cujas Autoridades de Aviação Civil primárias são
  EASA (União Europeia e demais Estados membros da EASA), FAA (Estados Unidos) e TCCA (Canadá).
  Para essas autoridades, isso é possível devido à similaridade dos sistemas de certificação,
  grande histórico de interface com a ANAC e experiência em validações anteriores.
