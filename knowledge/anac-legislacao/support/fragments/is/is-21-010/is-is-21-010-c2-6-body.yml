section_title: Os projetos de tipo que incorporaram uma modificação significante durante a
  sua vida em serviço passam por atualização da sua base de certificação (segundo critérios
  estabelecidos na seção 21.101 do RBAC 21. Sendo assim, as modificações significantes podem
  levar a um maior nível de envolvimento da ANAC.
