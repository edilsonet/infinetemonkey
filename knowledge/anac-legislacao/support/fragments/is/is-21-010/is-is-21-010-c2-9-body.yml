section_id: C2.9
section_title: 'Complexidade do Projeto. Como a validação do Certificado de Tipo é uma atividade
  de verificação amostral, a ANAC tem como objetivo focar nos itens complexos, questões relevantes
  de certificação e itens que afetem a segurança da operação, como por exemplo: novas tecnologias,
  novos requisitos, novos meios de cumprimento, instruções de aeronavegabilidade continuada,
  manual de voo, OSD, equipamentos necessários para a operação no Brasil, placares em português,
  entre outros.'
