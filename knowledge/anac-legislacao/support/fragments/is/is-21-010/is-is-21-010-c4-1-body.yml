family: '21'
section_id: C4.1
section_title: 'In this type of validation, there is a greater level of involvement in the
  analysis of the type design, being necessary evaluations of the aircraft and the manufacturer,
  including, definition of the certification basis, evaluation of the means of compliance,
  performance of tests and engineering inspections, analysis of certification documents and
  technical-administrative procedures, such as: control of in service difficulties, Airworthiness
  Directives, classification of modifications, configuration control of the approved type
  design (deviations), etc.'
