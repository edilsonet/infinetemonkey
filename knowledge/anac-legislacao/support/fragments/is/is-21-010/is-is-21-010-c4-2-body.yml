section_id: C4.2
section_title: Caso o projeto de tipo em questão tenha um projeto similar previamente validado
  na EASA, FAA ou TCCA, a ANAC poderá reduzir ligeiramente seu nível de envolvimento, tomando
  crédito do trabalho realizado pela outra autoridade. Entende-se por projeto similar uma
  aeronave com projeto de tipo de mesmas características de operação, base de certificação,
  modelo e projeto do que está sendo validado no Brasil.
