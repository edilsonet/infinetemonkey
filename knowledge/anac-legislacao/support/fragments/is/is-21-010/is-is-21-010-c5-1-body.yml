section_title: O processo de validação simplificada tem um nível de envolvimento da ANAC menor
  do que o processo de validação padrão. A ANAC toma crédito do trabalho realizado pela autoridade
  primária para limitar o seu nível de envolvimento focando em questões relevantes de certificação,
  complexidades ou especificidades de operação e novidades.
