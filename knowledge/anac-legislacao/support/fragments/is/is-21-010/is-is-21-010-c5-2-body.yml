section_title: Essa validação requer um nível de envolvimento intermediário na análise do
  projeto de tipo, podendo ser necessárias avaliações da aeronave e do fabricante, incluindo,
  definição da base de certificação, avaliação dos meios de cumprimento, realização de ensaios
  e inspeções de engenharia e análise de documentos de certificação naquelas áreas determinadas
  como críticas.
