section_title: Expedited validation allows for less ANAC involvement, where it may be possible
  to accept the primary authority's certification base and the applicable manuals (Aircraft
  Flight Manual - AFM, Aircraft Maintenance Manual - AMM and MMEL), but being necessary, for
  example, the translation of the required placards and the verification of the installation
  of the equipment required for operation in Brazil.
