title: OBJETIVO
text: '1. OBJETIVO

  Esta IS tem como objetivo servir de guia para obtenção da aprovação, por meio de CST ou

  Formulário F-400-04 (SEGVOO 001), de instalações ou de modificações de instalações de

  equipamentos GNSS stand alone para operações VFR e IFR, incluindo IFR PBN.

  Esta IS descreve um meio aceitável, mas não o único meio, de demonstração de

  cumprimento com os regulamentos aplicáveis.'
