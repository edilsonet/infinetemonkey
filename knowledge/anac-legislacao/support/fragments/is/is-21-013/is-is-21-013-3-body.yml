text: '3. FUNDAMENTOS

  3.1. O artigo 68 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que a autoridade
  de

  aviação civil emitirá certificado de tipo para aeronaves, motores e hélices que satisfizerem

  os requisitos aplicáveis dos Regulamentos Brasileiros da Aviação Civil - RBAC.

  3.2. A Subparte E do RBAC 21 estabelece requisitos para a emissão de um certificado

  suplementar de tipo para aprovação de grandes modificações;

  3.3. A Resolução nº 30, de 21 de maio de 2008, alterada pela Resolução nº 162, de 20 de
  julho

  de 2010 estabelece que a ANAC pode emitir IS para esclarecer, detalhar e orientar a

  aplicação de requisito existente em RBAC.'
