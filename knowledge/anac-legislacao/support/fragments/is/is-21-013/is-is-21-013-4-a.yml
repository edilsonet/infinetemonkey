title: 4(a)
text: 'a) Campo de Visão Primário Ótimo: é definido através dos campos visuais verticais e

  horizontais relativos à projeção do ponto de referência dos olhos que pode ser visto

  apenas com a rotação dos olhos. Os valores para as projeções horizontal e vertical (em

  relação à linha normal de visão) são ±15 graus. A linha de visão normal é estabelecida

  15 graus abaixo do plano horizontal;'
