text: 'b) Campo de Visão Primário Máximo: é definido através dos campos visuais verticais
  e

  horizontais relativos à projeção do ponto de referência dos olhos que pode ser visto com

  a rotação dos olhos e rotação mínima da cabeça. Os valores para a projeção horizontal

  (em relação à linha normal de visão) são ±35 graus e para a projeção vertical (em relação

  à linha normal de visão) são +40 graus (para cima) e -20 graus (para baixo). A linha de

  visão normal é estabelecida 15 graus abaixo do plano horizontal.

  Nota: Em geral, o centro da coluna de rádios está dentro de um campo de visão

  aceitável, o que permite satisfazer os critérios de Campo de Visão Primário Máximo em

  aviões certificados sob o RBAC/14 CFR Part 23, ou equivalentes, com instrumentos

  "clássicos" analógicos no "T básico”.16-12-2016 IS nº 21-013

  Revisão B

