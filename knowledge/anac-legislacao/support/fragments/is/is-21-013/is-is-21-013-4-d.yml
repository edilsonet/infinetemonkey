text: 'd) TSE: O TSE é igual à raiz quadrada da soma do quadrado de cada um dos três erros

  apontados (PDE, FTE e NSE).

  Nota: O TSE depende da interface entre o sistema, a aeronave e a tripulação, e só pode ser

  avaliado com o sistema integrado à aeronave.

  4.16. Campo de Visão Primário: Os campos de visão primários são definidos conforme a Figura

