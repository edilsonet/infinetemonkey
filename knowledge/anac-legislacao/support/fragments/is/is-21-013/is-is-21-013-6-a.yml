text: 'a) Descrição da operação VFR: Se o requerente desejar apresentar um processo para a

  instalação de equipamento GNSS para navegação VFR, isto deverá ser descrito na

  documentação técnica e administrativa, além de atender os critérios nos itens 7.6 e 7.7

  desta IS;'
