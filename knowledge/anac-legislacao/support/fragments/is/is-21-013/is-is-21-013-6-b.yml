title: 6(b)
text: 'b) Descrição da operação IFR Convencional: Se o requerente desejar apresentar um

  processo para a instalação de equipamento GNSS para navegação IFR convencional,

  isto deverá ser descrito na documentação técnica e administrava. Deverá informar ainda

  a lista das capacidades operacionais para as quais pretende certificar sua aeronave: IFR

  EM ROTA, ÁREA TERMINAL e/ou APROXIMAÇÃO DE NÃO-PRECISÃO. Estas

  informações deverão constar nos dados técnicos do projeto e no Suplemento ao Manual

  de Voo. Os critérios estabelecidos para esta instalação são abordados nos itens 7.6 e 7.8

  desta IS;'
