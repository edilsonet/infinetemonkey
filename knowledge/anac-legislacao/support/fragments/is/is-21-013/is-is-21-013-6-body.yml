text: '6. DOCUMENTAÇÃO

  A IS 21-004 e a IS 21-021 definem as documentações administrativa e técnica que devem

  ser apresentadas em um processo de aprovação de grande modificação. Em complemento ao

  solicitado nesses documentos, também devem ser verificados os seguintes aspectos:

  6.1. Descrição da Instalação: Um sistema GNSS em uma aeronave poderá ter sua instalação

  aprovada para VFR, IFR Convencional e/ou IFR PBN. O requerente deverá informar na

  documentação todas as integrações e características da instalação.16-12-2016 IS nº 21-013

  Revisão B

  Enfatiza-se que a aprovação da instalação, por si só, não garante a operação da aeronave
  nos

  modos operacionais requeridos. A aprovação do projeto de instalação do sistema GNSS

  estabelece apenas que a aeronave tem a capacidade funcional de ser operada em determinado

  modo, conforme abaixo:'
