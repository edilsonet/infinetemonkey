  Revisão B

  Nota: Não há, até a data da publicação desta IS, cobertura SBAS/WAAS no Brasil. O

  requerente deve levar em consideração a necessidade de realização de ensaios de certificação

  caso queira obter a aprovação de um sistema SBAS/WAAS sem restrições.

  7.9.4.2. Precisão

  Durante a operação PBN, o erro total lateral do sistema deve ser no máximo os valores

  apresentados na Tabela 4 a seguir durante 95% do tempo total de voo.

