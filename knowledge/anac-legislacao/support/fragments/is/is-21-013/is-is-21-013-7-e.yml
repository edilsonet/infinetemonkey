  APV/BARO-VNAV -

  Tabela 2: Áreas de aplicação e precisões laterais associadas aos procedimentos PBN.

  Nota: Os valores de precisão lateral de navegação estão expressos em milhas náuticas (NM)

  mantidas por, pelo menos, 95% do tempo de voo, a partir do centro da trajetória desejada.

  7.9.2. Embora as distintas operações PBN possuam aspectos em comum, o cumprimento aos

  critérios estabelecidos nesta IS deve ser satisfeito individualmente para cada uma das

  operações pretendidas. De tal maneira, exceto quando explicitamente declarado, a

  demonstração de conformidade com uma determinada operação PBN não garante a

  conformidade com as demais;

  7.9.3. Ainda que a qualificação TSO dos equipamentos GNSS seja suficiente para demonstrar

  atendimento com parte dos critérios de desempenho e funcionalidade dos espaços RNP,

  muitos destes critérios dependem da integração dos componentes do equipamento e do

  equipamento à aeronave. Assim, é sempre necessário verificar o atendimento aos critérios

  de desempenho e funcionalidade desta IS a partir do equipamento instalado.

  7.9.4. Critérios Específicos para operações PBN

