text: 'e) Para operações GNSS IFR em ÁREA TERMINAL e APROXIMAÇÃO DE NÃO-

  PRECISÃO, é necessário que a seleção de curso no HSI/EHSI ou no CDI seja

  automática.

  7.9. TIPOS DE OPERAÇÕES E CRITÉRIOS ESPECÍFICOS PARA GNSS EM

  OPERAÇÕES PBN

  Para GNSS interligado, instalado para operações IFR PBN, são válidos todos os critérios

  anteriormente para VFR e devem ser considerados ainda os critérios a seguir:16-12-2016 IS
  nº 21-013

  Revisão B

  7.9.1. Os critérios de aeronavegabilidade dependem do tipo de operação PBN pretendido pelo

  requerente. O tipo de operação, por sua vez, pode ser limitado pelas características do

  sistema e da aeronave. As operações PBN abordadas por este documento, com suas

  respectivas precisões e áreas de atuação, são apresentadas na Tabela 2;

  Designação da

  Operação

  Precisão Lateral

  da Navegação Área de Aplicação

  RNP 10 (RNAV 10) 10 Em rota - Oceânica/Remota

  RNAV 5 5 Em rota - Continental

