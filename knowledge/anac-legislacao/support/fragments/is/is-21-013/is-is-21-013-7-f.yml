section_title: CRITÉRIOS PARA INSTALAÇÃO GNSS
subsection_id: f
cite: 7(f)
title: 7(f)
text: 'f) Em aeronaves equipadas com um sistema SATCOM, deve ser verificada a

  compatibilidade desse sistema com o equipamento GNSS e as antenas interligadas ao

  equipamento GNSS. Alguns equipamentos GNSS/antenas podem ter sido qualificados

  para níveis de interferência menos rigorosos que os destinados à instalação em

  aeronaves com sistemas SATCOM;'
