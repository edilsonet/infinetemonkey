  SEÇÃO 1 - GENERALIDADES

  1.1 Este suplemento fornece as informações necessárias à operação da aeronave, quando o
  <Inserir o

  modelo e o fabricante do equipamento GNSS> estiver instalado. As informações contidas neste

  suplemento devem ser utilizadas em conjunto com o Manual de Voo completo da aeronave.

  1.2 Este suplemento foi aprovado como parte integrante e permanente do Manual de Voo, nele
  devendo

  permanecer inserido sempre que o <Inserir o modelo do equipamento GNSS> estiver instalado.

  1.3 O <Inserir o modelo do equipamento GNSS> é constituído de <Listar os itens que constituem
  o

  equipamento>.

  1.4 O <Inserir o modelo do equipamento GNSS> tem a finalidade de fornecer ao piloto informações
  de

  posição para navegação, recebidas através de sinais provenientes de satélites. Os planos
  de voo são

  inseridos na unidade receptora através dos waypoints a serem voados. Um display tipo CDI
  no receptor

  de GPS fornece informações de desvio de curso, que também são repetidas no <EHSI ou HSI
  ou CDI

  ou outro dispositivo> da aeronave quando o GPS estiver selecionado como fonte de navegação.

  (Aplicável apenas quando houver interligação com CDI/HSI/EHSI).

  1.5 As informações de navegação são baseadas no sistema de referência WGS-84, e somente
  poderão

  ser usadas onde as Cartas Aeronáuticas também sejam baseadas no sistema de referência WGS-84.

  1.6 O <Inserir o modelo do equipamento GNSS> foi fabricado e instalado de acordo com a <Inserir
  o

  número, a revisão e a classe da TSO> e satisfaz o que está estabelecido na IS-21-013B para

  navegação IFR com fonte de navegação GPS em operações <Inserir as operações aprovadas

  (exemplo: RNAV 5, RNAV 2, RNAV 1, RNP 1, RNP APCH, IFR EM ROTA, ARÉA TERMINAL e/ou

  APROXIMAÇÃO DE NÃO-PRECISÃO)>.

  A operação em APROXIMAÇÕES DE NÃO-PRECISÃO inclui aquelas baseadas em auxílios à

  navegação convencionais onde haja a expressão “ou GPS” no seu título (Para IFR em APROXIMAÇÃO
  DE

  NÃO PRECISÃO) e aquelas que contêm a expressão “GPS”, “RNAV(GPS)” e “RNAV(GNSS)” no seu
  título

  para procedimentos com mínimos estabelecidos para navegação lateral “LNAV” (Para RNP APCH).

  Nota: A função SBAS (Satellite Based Augmentation System) não está aprovada para utilização
  nesta

  instalação. (Aplicável apenas para os equipamentos que possuem a função SBAS)

  1.7 <Listar os equipamentos que estão interligados ao equipamento GNSS>

  1.8 <Informar de forma sucinta como é a ligação do GNSS com o piloto automático/diretor
  de voo>

  (Somente se tal ligação existir. Por exemplo: “O piloto automático/diretor de voo pode ser
  utilizado para

  navegação GPS se um plano de voo estiver ativo no <Inserir o modelo do equipamento GNSS>,
  a fonte

  de navegação GPS estiver selecionada no EHSI e o modo de navegação NAV do piloto

  automático/diretor de voo for acionado.”; “O piloto automático/diretor de voo pode ser utilizado
  para

  navegação GPS se um plano de voo estiver ativo no <Inserir o modelo do equipamento GNSS>,
  o

  modo HDG do piloto automático/diretor de voo for acionado, e a função GPS do <Inserir modelo
  do

  conversor de guiagem lateral> também for acionada.”)16-12-2016 IS nº 21-013

