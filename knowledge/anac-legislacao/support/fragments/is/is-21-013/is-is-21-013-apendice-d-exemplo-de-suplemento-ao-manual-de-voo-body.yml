  confusão para o piloto ou carga de trabalho inaceitável devido à possibilidade de

  inconsistências a partir de diferenças nos equipamentos.

  As escalas dos CDI devem ser compatíveis entre si ou identificadas corretamente.

  A simbologia dos displays e anúncios devem ser compatíveis entre os GNSS, de

  forma a não causar qualquer tipo de conflito durante a interpretação das

  informações de navegação.

  A falha em um GNSS não pode interferir no funcionamento do outro GNSS.

  A apresentação dos parâmetros de navegação deve usar unidades de medida

  consistentes entre os GNSS.

  Os GNSS devem usar o mesmo banco de dados.

