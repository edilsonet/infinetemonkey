  <INSERIR O ENDEREÇO DO REQUERENTE> SUPLEMENTO ANAC

  2.13 A altitude geométrica fornecida pelo <Inserir o modelo do equipamento GNSS> não é adequada
  para

  o controle de tráfego aéreo. O altímetro barométrico deve ser usado para o controle de tráfego
  aéreo.

  Portanto, é proibido o uso da altitude fornecida pelo <Inserir o modelo do equipamento GNSS>
  para

  navegação.

  2.14 A utilização do modo de navegação <Inserir o modo de navegação do PA/DV pertinente
  para a

  realização de um procedimento de aproximação> do piloto automático/diretor de voo é obrigatória

  durante a realização de um procedimento de aproximação quando operando RNP APCH (Esta limitação

  é válida somente para as operações RNP APCH em que o cumprimento dos requisitos para TSE

  máximo somente é possível com a utilização do PA/DV).

  2.15 A fonte de navegação GPS deverá ser selecionada (Ou, no caso onde a seleção do curso
  GPS seja

  manual, “A fonte de navegação GPS e o curso GPS deverão ser selecionados”) no <Inserir o
  indicador

  de navegação que apresenta as informações de curso e desvio de curso GNSS: EHSI, HSI, CDI
  etc.>

  sempre que o modo de navegação <Indicar o modo de navegação do PA/DV que segue o plano de
  voo

  ativo no equipamento GNSS> for acoplado. (Esta limitação é válida somente para os casos
  onde exista

  a possibilidade de o PA/DV seguir a fonte de navegação GNSS independentemente da fonte de

  navegação selecionada no indicador de navegação).

  2.16 A seleção do modo cursor automático no <Inserir o instrumento de navegação: EHSI, HSI,
  CDI etc.> é

  obrigatória antes da operação IFR com fonte de navegação GPS em procedimentos IFR em ÁREA

  TERMINAL, APROXIMAÇÃO DE NÃO-PRECISÃO, RNP1 e RNP APCH. (Limitação válida somente

  para aprovações de operação IFR em ÁREA TERMINAL, APROXIMAÇÃO DE NÃO-PRECISÃO, RNP1

  e RNP APCH).

  2.17 Os procedimentos de subida (SID) e procedimentos de descida (STAR) utilizando a fonte
  de navegação

  GPS deverão ser executados conforme as cartas aprovadas contidas no banco de dados do <Inserir
  o

  modelo do equipamento GNSS>, não podendo ser realizados com base em dados introduzidos

  manualmente (Limitação válida somente para aprovações de operação IFR em ÁREA TERMINAL,

  RNAV 1 e RNP 1).

  2.18 Os procedimentos de subida (SID), procedimentos de descida (STAR) e procedimentos de

  aproximações de não precisão utilizando o <Inserir o modelo do equipamento GNSS> deverão
  ser

  executados conforme as cartas aprovadas contidas no banco de dados do equipamento GNSS,
  não

  podendo ser realizados com base em dados introduzidos manualmente (limitação válida somente
  para

  aprovações de operação IFR em ÁREA TERMINAL, APROXIMAÇÃO DE NÃO-PRECISÃO, RNAV 1,

  RNP 1 e RNP APCH).

  2.19 As informações provenientes do modo de gerenciamento de combustível do <Inserir o modelo
  do

  equipamento GNSS> (autonomia, combustível restante, entre outras) não podem ser usadas para

  efeito de planejamento e controle da navegação.

  2.20 As informações provenientes do modo de navegação vertical do <Inserir o modelo do equipamento

  GNSS> não substituem as informações providas pelo altímetro primário da aeronave para efeito
  de

  separação vertical com o terreno.

  2.21 A operação da função SBAS do <Inserir o modelo do equipamento GNSS> não está aprovada
  e deve

  estar desabilitada durante o voo. (Limitação válida somente para equipamentos GNSS que possuam
  a

  função SBAS)

  2.22 São proibidas aproximações ILS, LDA ou SDF utilizando o GPS como fonte de navegação
  (Limitação

  válida somente para aprovações de operação IFR APROXIMAÇÃO DE NÃO-PRECISÃO e RNP

  APCH).

  (para H.20)16-12-2016 IS nº 21-013

  Revisão B

  <INSERIR O EXPLORADOR DA AERONAVE> MANUAL DE VOO

  <INSERIR O ENDEREÇO DO EXPLORADOR DA AERONAVE> SUPLEMENTO ANAC

  (para H.02)

  <INSERIR O REQUERENTE> MANUAL DE VOO

  <INSERIR O ENDEREÇO DO REQUERENTE> SUPLEMENTO ANAC

  2.23 O uso do <Inserir o modelo do equipamento GNSS> não substitui as cartas aeronáuticas
  em vigor

  (Limitação válida quando o equipamento GNSS apresentar cartas de navegação).

  2.24 O piloto deverá desacoplar o modo de navegação do piloto automático/diretor de voo
  sempre que a

  fonte de navegação GPS for selecionada para navegação (Limitação válida somente para os
  casos

  onde não haja a anunciação clara dos modos de operação do PA/DV no painel de instrumentos
  do

  piloto).

  2.25 Para operações RNP 1 e RNP APCH que exijam dois pilotos, os <Inserir os modelos dos
  equipamentos

  GNSS> deverão estar sincronizados por meio da função <Inserir a função que permite que o
  plano de

  voo inserido em um equipamento GNSS seja transferido para o outro equipamento GNSS

  automaticamente> antes de selecionar qualquer plano de voo GPS para navegação (Limitação
  válida

  somente para os casos onde há mais de um equipamento GNSS instalado e onde tais equipamentos

  possuam uma função que transfira automaticamente o plano de voo inserido em qualquer equipamento

  GNSS para os outros equipamentos GNSS)

  2.26 Para qualquer tipo de navegação com fonte GPS os <Inserir os modelos dos equipamentos
  GNSS>

  deverão apresentar o mesmo plano de voo GPS para navegação (Limitação válida somente para
  os

  casos onde há mais de um equipamento GNSS instalado e onde tais equipamentos não possuam
  uma

  função que transfira automaticamente o plano de voo inserido em qualquer equipamento GNSS
  para

  os outros equipamentos GNSS).

  2.27 O piloto não poderá utilizar a fonte de navegação GPS 2 (LNAV 2) em operações do tipo
  IFR ÁREA

  TERMINAL, APROXIMAÇÃO DE NÃO-PRECISÃO, RNP 1 e RNP APCH (Limitação válida somente

  para aeronaves com dois GNS instalados e sem anunciação INTEG para o piloto relativa ao

  equipamento GNSS localizado no painel de instrumentos do copiloto).

  2.28 As operações IFR em ÁREA TERMINAL, APROXIMAÇÃO DE NÃO-PRECISÃO, RNP 1 e RNP APCH

  não estão aprovadas nas situações onde sejam requeridos dois pilotos (Limitação válida para
  os casos

  onde não há anunciação INTEG ou qualquer outra informação prevista no campo de visão primário
  do

  copiloto).

  2.29 A fase final das aproximações com uso da fonte de navegação GPS somente poderá ser
  realizada se

  o modo aproximação for ativado (<Inserir as anunciações que aparecem para indicar que o
  modo

  aproximação foi ativado> (exemplos: APR, LNAV etc.)). (Limitação válida somente para aprovações
  de

  operação IFR APROXIMAÇÃO DE NÃO-PRECISÃO e RNP APCH).

  2.30 Durante o voo a função TERRAIN deverá estar inibida (Limitação válida somente para
  os equipamentos

  GNSS que possuam a função TERRAIN, que mostra alertas de proximidade com terreno sem ter
  uma

  aprovação para funcionar como TAWS).

  2.31 A apresentação da informação de desvio lateral de curso no EHSI/HSI ou no CDI, com
  fonte de

  navegação GNSS, independe do curso selecionado. Portanto, se o curso selecionado estiver
  180°

  defasado em relação ao curso real, a informação de desvio lateral de curso no EHSI/HSI ou
  no CDI

  será oposta à situação real. (Limitação válida somente para IFR EM ROTA e RNAV 5 quando
  a seleção

  de curso não for automática).

  2.32 <Incluir qualquer limitação adicional relacionada com a instalação em questão>

  (para H.20)16-12-2016 IS nº 21-013

