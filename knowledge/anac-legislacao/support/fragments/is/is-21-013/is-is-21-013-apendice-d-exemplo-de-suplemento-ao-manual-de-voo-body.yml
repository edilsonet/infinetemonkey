  SEÇÃO 3 - PROCEDIMENTOS ANORMAIS E DE EMERGÊNCIA

  3.1 Durante a operação IFR EM ROTA utilizando GPS fora do conceito PBN, caso ocorra perda
  da função

  de monitoramento da integridade (função RAIM - Receiver Autonomous Integrity Monitoring),
  o piloto

  deverá reverter para um meio de navegação alternativo apropriado e aprovado para a fase
  de voo ou

  realizar a cada 15 minutos uma comparação dos dados da fonte de navegação GPS com as demais

  fontes de navegação aprovadas e operacionais. (Limitação válida para aprovações de operação
  IFR

  EM ROTA).

  3.2 Durante as operações IFR em ÁREA TERMINAL e APROXIMAÇÃO DE NÃO-PRECISÃO utilizando

  GPS fora do conceito PBN e as operações PBN RNAV 5 e RNAV 2, caso ocorra perda da função
  de

  monitoramento da integridade (função RAIM - Receiver Autonomous Integrity Monitoring), o
  piloto

  deverá reverter para um meio de navegação alternativo apropriado e aprovado para a fase
  de voo.

  (Limitação válida para aprovações de operação IFR em ÁREA TERMINAL, APROXIMAÇÃO DE NÃO-

  PRECISÃO, RNAV 5 e RNAV 2).

  3.3 Para as operações PBN RNAV 1, RNP 1 ou RNP APCH, caso ocorra a perda da função de

  monitoramento da integridade (função RAIM - Receiver Autonomous Integrity Monitoring), a

  navegação com fonte de navegação GPS deverá ser abandonada. (Limitação válida para todas
  as

  aprovações de operação PBN, exceto RNAV 5 ou RNAV 2).

  3.4 No caso de falha, perda de sinal ou perda de energia do <Inserir o modelo do equipamento
  GNSS>,

  com a fonte de navegação LNAV selecionada no <Inserir o indicador de navegação: EHSI, HSI,
  CDI

  etc.)> e o piloto automático/diretor de voo acoplado, desarmar o modo de navegação <Inserir
  o modo

  de navegação do PA/DV utilizado para navegação GNSS> do piloto automático/diretor de voo
  e

  prosseguir o voo manualmente ou por meio do modo HDG do piloto automático/diretor de voo,
  ou

  acoplar o modo de navegação <Inserir o modo de navegação do PA/DV apropriado) com fonte
  de

  navegação VOR selecionada no <Inserir o indicador de navegação: EHSI, HSI, CDI etc.)>. É

  recomendável, antes de reacoplar o modo de navegação <Inserir o modo de navegação do PA/DV

  utilizado para navegação com nova fonte> com nova fonte de navegação, colocar a aeronave
  em rota

  convergente com novo curso desejado.

  3.5 <Incluir qualquer outro procedimento anormal ou de emergência pertinente>

  SEÇÃO 4 - PROCEDIMENTOS NORMAIS

  4.1 Os procedimentos normais de operação do sistema estão definidos no Manual de Operação
  <Inserir

  nome do manual>, PN <Inserir PN do manual>, revisão <Inserir o número da revisão>, datada
  de

  <Inserir a data da revisão>, ou revisões posteriores aprovadas.

  4.2 Realizar o teste das lâmpadas dos anunciadores externos de GPS (Somente para as instalações
  onde

  há anunciadores externos de GNSS).

