title: Technical Data Control
text: '5.3.1 Technical Data Control

  Any technical data shall be maintained in a manner that ensures such data is current and

  accessible as appropriate. The technical data shall be stored in a manner that will protect
  it

  from dirt and damage.

  A distributor''s system shall control and provide the status of all Service Bulletin - SB
  /

  Airworthiness Directives - AD applicable at the time of delivery.'
