text: '5.3.2 Procurement procedures for ensuring that all articles obtained for distribution
  are in

  conformance with approved design data.

  The distributor shall maintain a procurement system such that only COP holder approved

  articles and materials are purchased, and proprietary and licensing rights are observed.

  The distributor shall have a system in place to assure that special requirements are adequately

  communicated to the distributor''s sources.

  Distributors of new aircraft parts shall purchase materials directly from COP holder

  approved suppliers. Deviations from this policy must be disclosed to and approved by the

  customer prior to part shipment and are not eligible to an official certificate (SEGVOO
  003).

  Distributors shall maintain a list of their approved suppliers and a quality history of
  each

  source. This data shall be integrated into the COP holder’s supplier control system.Data
  de emissão: 31.12.2020 IS Nº 21-018

  Revision A'
