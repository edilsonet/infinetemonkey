title: Receiving Inspection procedures to ensure that all incoming articles are properly identified,
text: '5.3.3 Receiving Inspection procedures to ensure that all incoming articles are properly
  identified,

  documented and visually inspected to detect any apparent damage that may have occurred

  during shipment.

  Inspectors shall verify that incoming parts and materials are free of defects and are in
  a good

  state of preservation.

  The distributor shall maintain an inspection program, which includes periodic verification

  that standard parts meet technical specification applicable to the part number. The distributor

  shall ensure that adequate specifications are available to support the inspection process,
  and

  that these specifications are current. The distributor shall maintain a record of inspections

  and tests used to make this verification. Suggested programs include sample tests of physical

  and chemical properties and checks of manufacturer''s test reports.

  A receiving inspection program shall be in place to verify that materials received are of

  appropriate quality and are from the same lot or batch number as indicated on accompanying

  certification and/or test reports as applicable.

  Receiving inspection for aircraft fasteners and raw stock shall include a visual check for

  general workmanship and the presence of certification and/or test reports.

  If inspection stamps are used, a procedure must be in place to control stamp usage and

  replacement. The procedure must include the following:'
