cite: 5.3.4(a)
title: 5.3.4(a)
text: 'a) The PCF activities procedure shall contain instructions for each task step (since

  procurement, incoming inspection, storage/preservation condition/validation

  verification, up to delivery final inspection) and forms used by the distributor to

  certify or show traceability of each article distributed, in accordance with applicable

  RBHA and ANAC procedures.Data de emissão: 31.12.2020 IS Nº 21-018

  Revision A'
