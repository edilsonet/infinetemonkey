section_id: 5.3.4
section_title: Handling, segregation, storage, preservation and packing procedures to protect
  articles
subsection_id: b
cite: 5.3.4(b)
title: 5.3.4(b)
text: 'b) Appropriately trained personnel shall conduct a complete visual inspection of all

  items being shipped. Inspection shall include, but not limited to:

  I - checking for any obvious physical damage;

  II - verifying that all appropriate plugs and caps are installed;

  NOTE: Procedures must warn that tape shall not be used to cover electrical

  connections or fluid fittings/openings. Adhesive residue can insulate

  electrical connections and contaminate hydraulic or fuel units.

  III - verifying that the quality, part numbers (including dash numbers and

  letters), model numbers, serial numbers, etc. of the items being shipped

  match the accompanying documentation and the customer''s

  request/purchase order;

  IV - verifying the packing slips contain all information required by the

  customer and important notice for handling;Data de emissão: 31.12.2020 IS Nº 21-018

  Revision A

  V - verifying the shipping container and packing are appropriate for the items

  being shipped;

  VI - verifying that all appropriate and required documentation (airworthiness

  approval, material certification, traceability documents, etc.) are at hand,

  properly completed and signed;

  VII - verifying materials classified as Hazardous Material - HAZMAT have

  been inspected by appropriately trained personnel and are properly packed,

  according to International Air Transport Association - IATA

  specifications.

  Record keeping procedures as objective evidence that articles have been purchased,

  identified, inspected and certified in conformity with the requirements.'
