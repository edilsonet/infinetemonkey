section_title: Handling, segregation, storage, preservation and packing procedures to protect
  articles
subsection_id: c
cite: 5.3.4(c)
title: 5.3.4(c)
text: 'c) A closed loop system shall exist to implement corrective action following the

  detection of substandard or otherwise nonconforming parts. Rejected materials

  must be identified as such and segregated from usable stock. The system shall

  include a method to notify purchasers of any part that exited the distributor''s quality

  system and does not conform. Distributors shall provide a method to recall or rectify

  the problem.Data de emissão: 31.12.2020 IS Nº 21-018

  Revision A'
