text: 'f) Training records shall include:

  I - a description of the training and its reference (procedure, standard,

  requirement, etc.);

  II - date and number of hours of instruction;

  III - name and signature of instructor and student;

  IV - name of the organization conducting the training if performed by an

  outside agency.

  Internal Audit: Audits shall be performed in accordance with written procedures or

  checklists that determine the effectiveness of the quality program. Audit results shall
  be

