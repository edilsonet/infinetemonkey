  de emissão: 31.12.2020 IS Nº 21-018

  Revision A

  1 OBJECTIVE

  1.1 This Instrução Suplementar - IS details the requirements and procedures which the

  corporative distributor of a Certificado de Organização de Produção - COP holder must

  comply when its PCF acts as a representative of Agência Nacional de Aviação Civil - ANAC

  to issue Authorized Release Certificates (Form SEGVOO 003) for articles.

  2 REVOCATION

  2.1 This IS cancels and supersedes CI 21-018A, of May 05, 2008.

  3 LEGAL BASIS

  3.1 Art. 14 of Resolution nº 30, of May 21st, 2008, which set up RBAC and IS and establishes

  criteria for their elaboration, disposes in its Paragraph 1 that the IS is a supplementary

  standard, of a general and abstract nature, with external or external and internal effect,

  aiming to clarify, detail and guide the application of an existing requirement in RBAC.
  It

  also disposes that the administrator who intends, for any purpose, to demonstrate the

  fulfillment of a requirement provided in RBAC may adopt the means and procedures

  previously specified in IS or present duly justified alternative means of compliance. In
  the

  latter case, the analysis and agreement of ANAC are demanded.

  3.2 Paragraph 2 of Art. 14 of Resolution nº 30, of May 21st, 2008, aforecited, disposes
  that the

  alternative mean/procedure of compliance mentioned in Paragraph 1 of the same article must

  guarantee a level of safety equal to or greater than that established by the applicable

  requirement or achieve the objective of the procedure standardized in a IS.

  3.3 Paragraph 3 of Art. 14 of Resolution nº 30, of May 21st, 2008, mentioned above, disposes

  that the IS cannot create new requirements or contradict requirements established in RBAC

  or other normative act.

  3.4 Considering what is exposed in this section, this IS aims to detail the requirements
  and

  procedures which the corporate distributor of a COP holder must fulfill when his PCF acts

  as a representative of the National Civil Aviation Agency - ANAC to issue an Authorized

  Release Certificate (Form SEGVOO 003) for articles.

  4 DEFINITIONS

  4.1 Article: means a material, part, component, process, or appliance, in accordance with
  RBAC

  21.

  4.2 Authorized Release Certificate: is equivalent to FAA “Airworthiness Approval Tag”.

  4.3 COP - Certificado de Organização de Produção: is equivalent to FAA “Production

  Certificate” - PC.

  4.4 PCF - Profissionais Credenciados em Fabricação: is equivalent to Federal Aviation

  Administration - FAA “Designated Manufacturing and Inspection Representative” - DMIR.

  4.5 RBAC: Regulamento Brasileiro de Aviação Civil (Brazilian Civil Aviation Regulation).Data
  de emissão: 31.12.2020 IS Nº 21-018

  Revision A

