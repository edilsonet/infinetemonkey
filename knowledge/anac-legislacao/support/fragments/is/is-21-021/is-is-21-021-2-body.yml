title: CARACTERISTÍCAS DA PORTA DE CARGA
text: '2. CARACTERISTÍCAS DA PORTA DE CARGA

  2.1 Porta de Carga

  A porta a ser instalada é uma porta para resistir à pressão e consistentemente estruturada
  e gabaritada para garantir a conformação da curva da fuselagem no lado esquerdo dianteiro
  da estrutura da aeronave. Mede 1,80 m de altura ao longo da curvatura da fuselagem por 3,00
  m de abertura. A porta é suportada por uma dobradiça superior contínua e 6 trancas ao longo
  do piso da entrada. A sua estrutura é resistente à torção e pode suportar as pressões internas
  da aeronave.

  2.2 Mecanismo de Tranca

  O mecanismo de travamento da porta é composto por:


  Seis conjuntos de trancas instaladas na parte inferior da estrutura da porta;

  Placa suporte das trancas, localizada no batente inferior da abertura;

  Tubo de torque que fornece rotação para a operação de travamento da porta;

  Conjunto de mecanismo que interliga o tubo de torque com as trancas;

  Dispositivo de liberação de emergência.

  2.3 Sistema Coletivo de Trava

  O sistema de travamento é composto por seis pinos de trava, um sistema de liberação do pino
  mestre e um tubo de torque para interligação. Os seis pinos de trava são conectados por
  uma haste deslizante. A operação de travamento e destravamento da porta é realizada por
  um cilindro hidráulico.

  2.4 Conjunto de Ventilação

  Uma escotilha para ventilação é instalada na porta para prevenir pressurização insegura
  da aeronave na eventualidade de fechamento e travamento inadvertido da porta de carga. Essa
  escotilha será localizada na metade inferior da porta de carga, sendo que a área desse local
  será reforçada. Essa escotilha é interligada com o mecanismo de tranca via tubo de torque
  e com o sistema de trava via atuador.


  ABX Aeronaves Ltda.

