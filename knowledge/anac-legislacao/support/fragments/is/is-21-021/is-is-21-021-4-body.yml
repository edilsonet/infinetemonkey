title: LISTA DOS REQUISITOS E MÉTODO DE CUMPRIMENTO
text: '4. LISTA DOS REQUISITOS E MÉTODO DE CUMPRIMENTO

  A lista a seguir foi elaborada para apresentar os meios de cumprimento com os requisitos
  definidos na base de certificação adotada, e respectivas emendas, verificando todos os requisitos
  e informando os afetados e não afetados, apresentando as respectivas justificativas. Este
  projeto foi desenvolvido para a modificação das aeronaves ABX modelo 505-A no que diz respeito
  à instalação de uma porta de carga, de sua estrutura adjacente e do reforço da estrutura
  do piso para suportar o acréscimo de carga por unidade de área.

  Esta conversão se aplica somente às aeronaves ABX modelo 505-A, originalmente fabricadas
  pela ABX para o transporte de passageiros.

  Esta lista é consistente com a base de certificação RBAC 25/14 CFR Part 25, datada de <dd/mmm/aaaa>,
  com emenda <25-xx> datada de <dd/mmm/aaaa> além da condição especial estabelecida na carta
  nº <xxxx/ANAC/2006>.

  A Lista de Requisitos (Compliance Check-List) está detalhada abaixo.

