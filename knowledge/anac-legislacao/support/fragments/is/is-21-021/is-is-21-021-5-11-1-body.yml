text: '5.11.1 (antigo 5.11)

  A referência à regulamentação foi estendida para RBHA ou regulamentos equivalentes da base
  de certificação do produto, deixando clara a aplicabilidade para outras bases de certificação.

  Acrescentada recomendação de utilização do guia acerca do assunto disponibilizado na página
  da ANAC na internet.'
