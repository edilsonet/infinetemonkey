text: '5.2.1 (antigo 5.2)

  Incluída exigência de informar a data de emissão das revisões dos desenhos na lista mestra
  de desenhos.

  5.3.2.1(b) (antigo 5.3.2(b))

  O termo "autoridade de certificação" foi substituído por ANAC.

  5.4.1(b)(V) (antigo 5.4(b)(V))

  OTP e equivalentes foram incluídos adicionalmente a TSO.

  5.4.1(d) (antigo 5.4(d)(I))

  Substituição de "parte" por "peça".

  5.4.1(d)(I) (antigo 5.4(d)(I)(i))

  SAE deixou de ser sigla para Society of Automotive Engineers e ASTM deixou de ser sigla
  para American Society for Testing and Materials, e passaram a ser simplesmente SAE International
  e ASTM International.

  5.4.1(g) (antigo 5.4(g))

  O termo "placas (''placares'')" foi substituído por apenas "placares", conforme termo empregado
  no RBAC 21.'
