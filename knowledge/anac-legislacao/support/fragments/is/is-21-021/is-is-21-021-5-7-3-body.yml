text: '5.7.3

  Removida referência à utilização das normas em suas últimas revisões, em razão de já existir
  dispositivo a respeito no item 7.2.

  Acrescentada recomendação de utilização do guia acerca do assunto disponibilizado na página
  da ANAC na internet.

  5.7.4(b)

  Atualização da sigla FHA para "Functional Hazard Assesment", em razão de ser o nome da metodologia
  adotado internacionalmente, e sua tradução em português para "Avaliação de perigos funcionais".'
