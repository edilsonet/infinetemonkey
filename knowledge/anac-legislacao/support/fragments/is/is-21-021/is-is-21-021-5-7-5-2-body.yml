text: '5.7.5.2 (antigo 5.7.5)

  Removida referência à utilização das normas em suas últimas revisões, em razão de já existir
  dispositivo a respeito no item 7.2.

  5.8.4.1(a) (antigo 5.8.4(a))

  Substituição de "parte" por "peça".

  Inclusão no checklist de ensaio em solo a verificação de acessibilidade, de relés, metalização
  e aterramento e identificação de fiação e cablagem.

  O termo "placas (''placares'')" foi substituído por apenas "placares", conforme termo empregado
  no RBAC 21.

  5.8.4.1(c)(II) (antigo 5.8.4(c)(II))

  Removida referência à utilização das normas em suas últimas revisões, em razão de já existir
  dispositivo a respeito no item 7.2.'
