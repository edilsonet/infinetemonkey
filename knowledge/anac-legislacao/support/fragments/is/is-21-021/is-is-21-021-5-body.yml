text: '5. CARACTERÍSTICAS DO SISTEMA ELÉTRICO

  A porta de carga possui um sistema de segurança projetado para garantir que esteja devidamente
  fechada, trancada e travada, tornando extremamente improvável qualquer abertura em voo.
  Para isso, foi instalado um sistema de segurança com circuito elétrico que evita a abertura
  inadvertida da porta, a qual é acionada hidraulicamente. O sistema é composto por:


  Painel de controle;

  Sistema de alimentação elétrica.'
