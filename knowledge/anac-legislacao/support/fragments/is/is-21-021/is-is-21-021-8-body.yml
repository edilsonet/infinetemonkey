text: '8. ENSAIOS NO SOLO E EM VOO

  Ensaios no solo serão limitados a testes funcionais bem como ensaios de inflamabilidade.
  Nenhum ensaio em voo será necessário para cumprimento de requisitos. Os ensaios são apresentados
  nos relatórios ABX-XZ-006-EME-B e ABX-XZ-006-ELE.'
