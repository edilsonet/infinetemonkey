title: Apêndice A
text: 'Apêndice A

  Atualizada a lista de reduções, com remoção das siglas ASTM, SAE e PST; inclusão de SEI
  e TAWS; atualização de AFMS, CCST, EMI/EMC, FHA, PN e RFMS; e ordenação da lista em ordem
  alfabética.'
