  INSTALAÇÃO DE PORTA DE CARGA E REFORÇO DE PISO

  Aeronaves modelo 505-A

  PLANO DE CERTIFICAÇÃO

  Relatório n° ABX-XY-001

  Revisão: EI - 10/08/2013


  DESCRIÇÃO DA MODIFICAÇÃO

  O objetivo desta modificação é converter aeronave de passageiros em cargueira, com capacidade
  de carga até 3 ton. operando nas mesmas altitudes. Nesta modificação, a porta de carga fica
  em local diferente da porta da tripulação. O compartimento resultante será classificado
  como B, podendo utilizar redes ou containers para o transporte das cargas.

  Este relatório traz informações objetivas de como será tratado o projeto da modificação
  proposta para aprovação por CST.


  RESUMO DA MODIFICAÇÃO

  A seguinte lista define a modificação pretendida:

  2.1 Instalação da estrutura da porta de carga;

  2.2 Instalação do sistema para a porta de carga:'
