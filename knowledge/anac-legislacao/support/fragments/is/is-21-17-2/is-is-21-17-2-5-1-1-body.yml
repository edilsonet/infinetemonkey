text: '5.1.1 Em 17 de março de 2010, foi revogado o Regulamento Brasileiro de Homologação
  Aero-

  náutica - RBHA 22 - requisitos de aeronavegabilidade planadores e motoplanadores. Esse

  regulamento adotava os requisitos Joint Airworthiness Requirements - JAR 22 para a certi-

  ficação de projeto de planadores e motoplanadores no Brasil e foi revogado no contexto de

  harmonização do RBAC 21 com o Title 14 - Code of Federal Regulations - 14CFR Part

  21 e com os outros regulamentos de projeto da Federal Aviation Administration - FAA.'
