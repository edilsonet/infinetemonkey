title: A criação da categoria de aeronaves leves esportivas (ALE), na qual também podem se
text: '5.1.2 A criação da categoria de aeronaves leves esportivas (ALE), na qual também podem
  se

  enquadrar planadores e motoplanadores, contribui para o atual cenário. Essa nova categoria

  utiliza normas consensuais aceitas internacionalmente e uma das suas principais caracterís-

  ticas é não haver necessidade de uma certificação de tipo.'
