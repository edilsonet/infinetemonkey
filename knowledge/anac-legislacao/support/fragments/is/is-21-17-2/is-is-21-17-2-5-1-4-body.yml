title: Na seção 5.2 são destacados aspectos particulares dos planadores e motoplanadores quanto
text: '5.1.4 Na seção 5.2 são destacados aspectos particulares dos planadores e motoplanadores
  quanto

  à sua importância no contexto da aviação civil, baixo risco na operação e critérios de certi-

  ficação, todos levados em consideração na elaboração desta IS. A partir de então, são apre-

  sentadas três alternativas de certificação que podem ser escolhidas pelos proprietários
  ou

  operadores de acordo com a sua adequação e conveniência, cientes das possíveis limita-

  ções operacionais envolvidas em cada uma delas. A seção 5.3 trata da certificação de aero-

  navegabilidade com CA padrão, na seção 5.4 é apresentada a possibilidade de certificação

  de aeronavegabilidade com CA especial (incluindo o CAVE) para aeronave leve esportiva

  e na seção 5.5 é apresentada a possibilidade de certificação de aeronavegabilidade com a

  emissão de um Certificado de Autorização de Vôo Experimental (CAVE) com o propósito

  de Competição Aérea.

  5.2 Particularidades de planadores e motoplanadores'
