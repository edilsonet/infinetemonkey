text: '5.2.4 Com relação aos aspectos de projeto da certificação de planadores e motoplanadores,
  os

  praticantes da atividade em nível internacional, através da OSTIV (Organisation Scientifi-

  que et Technique du Vol à Voile), elaboraram normas de projeto que foram parcialmente

  aproveitadas por autoridades de aviação civil no mundo incluindo a alemã. A harmoniza-

  ção em termos de regulamento de aeronavegabilidade foi alcançada após a elaboração do

  JAR-22, emitido em 1º de maio de 1980, baseado principalmente nas regras Lufttüchti-

  gkeitsforderungen für Segelflugzeuge und Motorsegler (LFSM), publicadas pela autoridade

  de aviação civil alemã, mas adotando uma organização próxima dos regulamentos emitidos

  pela FAA. A partir de então, a maioria das autoridades de aviação civil passou a referen-

  ciá-lo, bem como ao seu sucessor o Certification Specifications - CS-22 editado pela

  EASA, em suas normas nacionais.'
