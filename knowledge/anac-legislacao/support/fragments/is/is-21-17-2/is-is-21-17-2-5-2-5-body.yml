  se
text: '5.2.5 As características da indústria e da regulação de planadores e motoplanadores
  no mundo se

  traduziram na dificuldade de recuperação de informações técnicas relevantes para o estabe-

  lecimento do projeto de tipo aprovado de aeronaves mais antigas. Dessa forma é criada

  uma barreira para a importação de modelos que não conseguem prover as informações ne-

  cessárias de acordo com os padrões estabelecidos pela ANAC, especialmente a IS 21-010.'
