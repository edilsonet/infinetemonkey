  no
text: '5.3.3 A emissão de certificado de tipo para planadores e motoplanadores novos fabricados
  no

  Brasil deve seguir os procedimentos estabelecidos pela ANAC. Estes planadores e moto-

  planadores receberão um certificado de tipo de acordo com a categoria de certificação em

  que a base de certificação foi definida conforme o RBAC 21.17(b).'
