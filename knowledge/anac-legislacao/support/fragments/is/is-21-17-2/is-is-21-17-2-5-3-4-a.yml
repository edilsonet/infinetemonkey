title: 5.3.4(a)
text: 'a) A apresentação das informações de engenharia citadas nos parágrafos 5.3.1 e 5.3.3

  da IS citada será dispensada caso a base de certificação da aeronave seja o JAR-22

  ou CS-22. Motores e hélices de motoplanadores somente estarão igualmente dispen-

  sados da apresentação destas informações de engenharia caso estejam incluídos na

  mesma base de certificação do planador, ou seja, JAR-22 ou CS-22.'
