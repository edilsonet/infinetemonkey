text: '5.3.5 As considerações do parágrafo 5.3.4 referem-se apenas a obtenção de certificado
  de tipo de

  planadores e motoplanadores e quaisquer componentes cuja instalação esteja incluída nesse

  certificado de tipo estarão igualmente dispensados de apresentação de informações de en-

  genharia. No entanto, a aprovação em certificado de tipo da instalação de componentes

  como motor e hélice e de componentes com Ordem Técnica Padrão (OTP) ou Technical

  Standard Order (TSO) não dá a esses componentes a aprovação para instalação em outras

  aeronaves. Para que seja aprovada a instalação desses componentes em outra aeronave é

  necessário que seja modificado o projeto de tipo de maneira que essa instalação seja con-

  templada.

  5.4 Certificação do planador e motoplanador como aeronave leve esportiva (CA especial

  ou CAVE para aeronave leve esportiva)'
