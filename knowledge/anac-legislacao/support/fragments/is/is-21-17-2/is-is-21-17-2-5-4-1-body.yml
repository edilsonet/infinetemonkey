text: '5.4.1 A certificação de aeronavegabilidade com CA especial ou CAVE para aeronave leve
  es-

  portiva tratada nesta seção é aplicável para planadores e motoplanadores que originalmente

  foram certificados no país de origem em categoria similar a categoria de aeronave leve es-

  portiva e se enquadrem nos critérios de aeronave leve esportiva (parágrafo 5.4.2).'
