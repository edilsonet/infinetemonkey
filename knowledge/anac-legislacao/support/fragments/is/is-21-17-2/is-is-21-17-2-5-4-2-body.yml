title: Para que planadores e motoplanadores possam receber o CA especial (conforme RBAC
text: '5.4.2 Para que planadores e motoplanadores possam receber o CA especial (conforme RBAC

  21.190) ou CAVE (conforme RBAC 21.191(i)) para aeronave leve esportiva, eles devem

  se enquadrar na definição dada pelo RBAC 01 para planador e motoplanador na categoria

  de aeronave leve esportiva além de ter atestado o cumprimento com normas consensuais.'
