text: '5.4.3 Ainda, conforme o RBAC 21.190(b)(2), a aeronave não deve ter tido, previamente,
  um

  certificado de aeronavegabilidade padrão, um certificado de aeronavegabilidade especial

  nas categorias primária ou restrita, um certificado de aeronavegabilidade provisório ou
  um

  certificado de aeronavegabilidade equivalente emitido por uma autoridade estrangeira de

  aviação civil.'
