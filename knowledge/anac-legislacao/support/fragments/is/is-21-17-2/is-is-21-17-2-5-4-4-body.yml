title: Para a obtenção do CA especial de aeronave leve esportiva os planadores e motoplanado-
text: '5.4.4 Para a obtenção do CA especial de aeronave leve esportiva os planadores e motoplanado-

  res de fabricação nacional devem apresentar a documentação conforme RBAC

  21.190(b)(1). Planadores e motoplanadores importados devem apresentar evidências de

  que a aeronave é elegível a um certificado similar no Estado de Projeto.'
