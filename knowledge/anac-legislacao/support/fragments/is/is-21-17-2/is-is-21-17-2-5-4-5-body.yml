title: Para obtenção do CAVE para aeronave leves esportivas os planadores e motoplanadores
text: '5.4.5 Para obtenção do CAVE para aeronave leves esportivas os planadores e motoplanadores

  devem se enquadrar no disposto do RBAC 21.191(i) e, conforme aplicável, às disposições

  do RBAC 21.193(e).

  5.5 Certificação do planador e motoplanador como aeronave experimental com propósito

  de competição esportiva (CAVE com propósito de competição aérea)'
