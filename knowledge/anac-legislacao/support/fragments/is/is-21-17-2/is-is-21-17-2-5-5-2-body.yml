title: Planadores e motoplanadores, dadas as suas particularidades, podem requerer um CAVE
text: '5.5.2 Planadores e motoplanadores, dadas as suas particularidades, podem requerer um
  CAVE

  com propósito de competição aérea. O CAVE para competição aérea destina-se, conforme

  RBAC 21.191(e), a utilização da aeronave para a participação em competições aéreas, in-05/10/2012
  IS Nº 21.17-2

  Revisão A

  cluindo o treinamento de pessoal participante da competição e os voos de traslado para o

  local da competição.'
