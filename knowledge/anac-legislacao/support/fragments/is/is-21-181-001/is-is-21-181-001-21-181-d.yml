cite: 21.181(d)
title: 21.181(d)
text: 'd) o operador tenha apresentado à ANAC um Certificado de Verificação de

  Aeronavegabilidade (CVA), na forma estabelecida pela IS 91.403-001:

  I - nos últimos 3 anos, para operação de aeronave segundo o RBAC 121 ou

  para operação de aeronave segundo o RBAC 135, registrada na categoria

  de Serviço de Transporte Aéreo Público Regular - TPR [RBAC 91.403(e),

  a partir de 1º de junho de 2020]; ou

  II - nos últimos 12 meses, para operação de aeronave segundo o RBAC 91 ou

  operação de aeronave segundo o RBAC 135, não registrada na categoria

  TPR, exceto para aeronave aprovada, no mesmo período, em Vistoria

  Técnica Inicial (VTI) ou Especial (VTE), cuja abrangência seja igual ou

  maior à do CVA requerido [RBAC 91.403(f), a partir de 1º de junho de

  2020]; ou

  III - até 31 de maio de 2020, um adequado Relatório de Condição de

  Aeronavegabilidade (RCA) na forma estabelecida pela IS 21.181-001C ou

  uma adequada Declaração de Inspeção Anual de Manutenção (DIAM),

  conforme aplicável:

  a. nos últimos 3 anos um adequado Relatório de Condição de

  Aeronavegabilidade (RCA), para operação de aeronave segundo o

  RBAC 121 ou para operação de aeronave segundo o RBAC 135,

  registrada na categoria de Serviço de Transporte Aéreo Público

  Regular - TPR [RBHA 91.403(d)]; ouData de emissão: 7 de agosto de 2020 IS Nº 21.181-001

  Revisão E

  b. nos últimos 12 meses uma adequada Declaração de Inspeção Anual de

  Manutenção (DIAM) ou um adequado Relatório de Condição de

  Aeronavegabilidade (RCA), para operação de aeronave segundo o

  RBHA 91 ou operação de aeronave segundo o RBAC 135, não

  registrada na categoria TPR, exceto para aeronave aprovada, no mesmo

  período, em Vistoria Técnica Inicial (VTI) ou Especial (VTE), cuja

  abrangência seja igual ou maior à do RCA ou da DIAM requerida

  [RBHA 91.403(e)(f)(g)].'
