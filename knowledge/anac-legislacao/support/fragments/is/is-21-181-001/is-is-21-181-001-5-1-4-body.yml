text: '5.1.4 A aeronave que tiver o seu CA suspenso por qualquer código e vier a ocorrer vencimento
  do

  CVA, automaticamente o código “S8” é incluído na codificação da situação da aeronave.

  Caso esteja apenas com o CA suspenso por não apresentação do CVA (código “S8”) e vier

  a ocorrer qualquer situação passível de enquadramento nos códigos numéricos, aqueles

  aplicáveis são adicionados à codificação. O Apêndice C lista os códigos possíveis

  relacionados a situação do CA.'
