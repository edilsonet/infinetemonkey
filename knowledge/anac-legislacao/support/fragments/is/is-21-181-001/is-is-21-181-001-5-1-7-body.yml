title: A apresentação de um CVA Não Aeronavegável irá atualizar a validade do CVA, entretanto
text: '5.1.7 A apresentação de um CVA Não Aeronavegável irá atualizar a validade do CVA, entretanto

  o CA será suspenso por condição técnica irregular. Para a regularização do CA deverá ser

  apresentado um CVA aeronavegável no prazo de até dois anos após o vencimento do

  anterior.'
