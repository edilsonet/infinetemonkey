title: Todas as aeronaves que apresentarem o CVA para manutenção da validade do CA estarão
text: '5.2.1 Todas as aeronaves que apresentarem o CVA para manutenção da validade do CA estarão

  sujeitas a seleção para vistoria de amostragem pela ANAC. O critério de amostragem será

  definido pela ANAC.'
