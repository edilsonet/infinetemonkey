text: '5.2.2.2 Nos casos de pedido de vistoria por meio do formulário, o operador deve propor
  uma data

  posterior a 20 dias do seu envio à ANAC, e anterior ao prazo máximo de 60 (sessenta) dias,

  prazo limite que deve ser observado também no agendamento pelo Painel de Vistorias.

  NOTA - Os prazos dispostos nos itens 5.2.2.1 e 5.2.2.2 visam a garantir à ANAC o tempo

  hábil necessário para a tomada de ações administrativas e logísticas envolvidas na

  realização de vistorias pela Agência.'
