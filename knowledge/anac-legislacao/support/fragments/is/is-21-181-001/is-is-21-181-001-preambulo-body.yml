title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR IS

  IS Nº 21.181-001

  Revisão E

  Aprovado por: Portaria nº 1.980/SAR, de 5 de agosto de 2020.

  Assunto: Validade de Certificados de Aeronavegabilidade - CA Origem:

  GCVC/SAR

  1 OBJETIVO

  1.1 Esta Instrução Suplementar - IS visa a orientar sobre a validade de Certificados de

  Aeronavegabilidade - CA conforme definido na seção 21.181 do RBAC 21.

  2 REVOGAÇÃO

  2.1 Esta IS substitui a Instrução Suplementar nº 21.181-001 revisão D.

  3 FUNDAMENTOS

  3.1 O art. 114 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica

  CBAer), dispõe que nenhuma aeronave poderá ser autorizada para o voo sem a prévia

  expedição do correspondente CA.

  3.2 O art. 8º, XXXI da Lei nº 11.182, de 27 de setembro de 2005, dispõe que a competência
  para

  emissão de CA cabe à ANAC, como autoridade de aviação civil.

  3.3 A seção 21.181 do RBAC 21 estabelece requisitos quanto à validade dos CAs.

  3.4 A Resolução nº 30, de 21 de maio de 2008, em seu art. 14 estabelece que a ANAC pode

  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  4 DEFINIÇÕES

  4.1 Aeronavegabilidade: Para aeronave que requer projeto de tipo aprovado, significa que
  a

  mesma está aeronavegável por se encontrar de acordo com o projeto de tipo aplicável e em

  condições de operação segura. Aeronave que não possui certificado de tipo aprovado está

  aeronavegável quando se encontra segura para operação aérea.

  4.2 4.2 Certificado de Verificação de Aeronavegabilidade: Documento emitido por

  organização certificada segundo RBAC135, RBAC 121, RBAC 145, RBAC 137 ou pessoa

  autorizada pela ANAC, que atesta a realização da Verificação de Aeronavegabilidade de

  uma aeronave para fins de comprovação junto à ANAC (seção 91.403 do RBAC 91).

  4.3 4.3 Verificação de Aeronavegabilidade: Verificação que tem como objetivo atestar as

  condições de aeronavegabilidade de uma aeronave, incluindo seus componentes e

  equipamentos com o intuito de emissão do CVA.Data de emissão: 7 de agosto de 2020 IS Nº
  21.181-001

  Revisão E

  5 DESENVOLVIMENTO DO ASSUNTO

  5.1 Validade do CA'
