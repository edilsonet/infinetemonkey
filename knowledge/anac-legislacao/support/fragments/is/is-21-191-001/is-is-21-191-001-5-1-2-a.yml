title: 5.1.2(a)
text: 'a) Projeto desenvolvido pelo próprio construtor amador. O projeto é elaborado intei-

  ramente pelo próprio construtor amador. O construtor especifica os materiais, define a

  estrutura da aeronave, elabora os desenhos, gabaritos, define a configuração aerodinâ-

  mica, grupo moto-propulsor e as técnicas e os processos de fabricação a serem utiliza-

  dos.'
