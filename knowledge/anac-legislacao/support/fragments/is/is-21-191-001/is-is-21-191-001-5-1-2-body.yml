text: '5.1.2

  A construção de uma aeronave por amador pode ser efetuada a partir de:


  04/06/2012 IS nº 21.191-001A


  a) Projeto desenvolvido pelo próprio construtor amador. O projeto é elaborado intei-

  ramente pelo próprio construtor amador. O construtor especifica os materiais, define a

  estrutura da aeronave, elabora os desenhos, gabaritos, define a configuração aerodinâ-

  mica, grupo moto-propulsor e as técnicas e os processos de fabricação a serem utiliza-

  dos.

  b) Projeto de autoria de terceiros. O construtor amador adquire apenas os dados de pro-

  jeto (desenhos, especificações técnicas, instruções de montagem, etc.) de alguém que

  possui um projeto de autoria própria.

  c) Conjuntos ou subconjuntos fabricados por terceiros. Aplicável para conjuntos de fa-

  bricação brasileira ou estrangeira.'
