title: 'Para a emissão do Laudo de Vistoria Final de Aeronave, deve ser verificado se:'
text: '5.10.2 Para a emissão do Laudo de Vistoria Final de Aeronave, deve ser verificado se:

  a) A aeronave está devidamente acabada, equipada e pesada;

  b) Está pintada na aeronave, de maneira facilmente legível e próxima à entrada, em letras

  entre 5 (cinco) e 15 (quinze) cm de altura, a palavra "EXPERIMENTAL", conforme re-

  querido pela seção 45.23-I do RBAC 45;

  c) Existe, na aeronave, em local bem visível por todos os ocupantes, uma placa de adver-

  tência com os seguintes dizeres:


  04/06/2012 IS nº 21.191-001A


  “ESTA AERONAVE NÃO SATISFAZ AOS REQUISITOS DE AERONAVEGABI-

  LIDADE. VOO POR CONTA E RISCO PRÓPRIOS, SENDO PROIBIDA A SUA

  EXPLORAÇÃO COMERCIAL”;

  d) Estão instaladas na aeronave as marcas, placares, tabelas e marcações dos instrumentos,

  indicando todas as limitações operacionais previstas, tais como:

  I -

  Marcações dos instrumentos de bordo, limites de operação do motor, limites de

  velocidade;

  II -

  Placa de limites de velocidade e advertências, etc.; e

  III -

  Cartão de calibração da bússola.

  e) Foi fixada (soldada ou rebitada) uma placa metálica de identificação da aeronave, de

  aço inoxidável, contendo, em baixo relevo, pelo menos, as seguintes informações:

  I -

  Projetista;

  II -

  Construtor;

  III -

  Modelo;

  IV -

  Nº de série;

  V -

  Ano de fabricação; e

  VI -

  Marcas de nacionalidade e de matrícula.

  f)

  Todos os comandos estão identificados e marcados corretamente, quando aplicável;

  g) Foi determinada a conformidade da aeronave com os dados do projeto, como, por e-

  xemplo: medidas principais, simetria, deflexão das superfícies de comando, lista de e-

  quipamentos básicos, etc.;

  h) A aeronave foi pesada, foi determinada a posição do Centro de Gravidade - CG vazio e

  foi elaborado o respectivo diagrama de carregamento;

  i)

  Foram efetuados ensaios de funcionamento dos sistemas da aeronave: de combustível,

  elétrico, hidráulico, pneumático, de comandos, etc.;

  j)

  Foram efetuados ensaios para verificar o funcionamento e o desempenho do grupo mo-

  to-propulsor no solo;

  k) Foram instalados cintos de segurança abdominal e de ombro, um para cada ocupante,

  quando aplicável;

  l)

  Estão marcados o tipo do combustível e a capacidade (em litros) de combustível utilizá-

  vel em cada tanque, próximo aos bocais de reabastecimento;

  m) A aeronave está equipada com, no mínimo, 1 (um) extintor de incêndio, quando aplicá-

  vel.


  04/06/2012 IS nº 21.191-001A'
