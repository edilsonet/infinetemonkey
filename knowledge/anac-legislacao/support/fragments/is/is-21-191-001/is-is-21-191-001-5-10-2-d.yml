section_title: 'Para a emissão do Laudo de Vistoria Final de Aeronave, deve ser verificado
  se:'
subsection_id: d
cite: 5.10.2(d)
title: 5.10.2(d)
text: 'd) Estão instaladas na aeronave as marcas, placares, tabelas e marcações dos instrumentos,

  indicando todas as limitações operacionais previstas, tais como:

  I -

  Marcações dos instrumentos de bordo, limites de operação do motor, limites de

  velocidade;

  II -

  Placa de limites de velocidade e advertências, etc.; e

  III -

  Cartão de calibração da bússola.'
