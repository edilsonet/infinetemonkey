section_id: 5.10.2
section_title: 'Para a emissão do Laudo de Vistoria Final de Aeronave, deve ser verificado
  se:'
subsection_id: e
cite: 5.10.2(e)
title: 5.10.2(e)
text: 'e) Foi fixada (soldada ou rebitada) uma placa metálica de identificação da aeronave,
  de

  aço inoxidável, contendo, em baixo relevo, pelo menos, as seguintes informações:

  I -

  Projetista;

  II -

  Construtor;

  III -

  Modelo;

  IV -

  Nº de série;

  V -

  Ano de fabricação; e

  VI -

  Marcas de nacionalidade e de matrícula.'
