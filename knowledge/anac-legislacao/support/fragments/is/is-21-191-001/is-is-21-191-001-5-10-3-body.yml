title: A lista de verificação de fabricação e montagem de aeronaves de construção amadora,
  pre-
text: '5.10.3 A lista de verificação de fabricação e montagem de aeronaves de construção amadora,
  pre-

  enchida pelo construtor amador, pode ser solicitada pela ANAC, a seu critério, nesta fase.

  NOTA: A introdução de pequenas ou grande alterações em uma aeronave que possui Certi-

  ficado de tipo, que não seja através dos processos usuais de aprovação previstos no RBAC

  21, não caracteriza, por si só, uma aeronave de construção amadora, tornando-se esta ine-

  legível para obter um CAVE de acordo com o RBAC 21.191(g).'
