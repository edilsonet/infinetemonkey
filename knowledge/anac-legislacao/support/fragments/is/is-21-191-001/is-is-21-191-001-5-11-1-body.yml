title: Durante a operação de uma aeronave de construção amadora, seu piloto deve portar os
text: '5.11.1 Durante a operação de uma aeronave de construção amadora, seu piloto deve portar
  os

  seguintes documentos originais ou suas cópias autenticadas em cartório (para o item f) des-

  ta seção, só valem os originais):

  a) CME válido, de acordo com a seção 91.203 do RBHA 91 ou documento equivalente

  que venha a substituí-lo;

  b) CAVE válido, conforme requerido pela seção 91.203 do RBHA 91, ou documento e-

  quivalente que venha a substituí-lo;

  c) Apólice de Seguro válida ou Certificado de Seguro Aeronáutico, com comprovante de

  pagamento, de acordo com o art. 178 do CBAer;

  d) Conforme requerido pela seção 91.203 do RBHA 91, ou documento equivalente que

  venha a substituí-lo, o registro dos últimos serviços de manutenção que atestaram a

  IAM, como por exemplo o RIAM ou Certificado de Conclusão de RIAM, a partir de 1

  (um) ano da expedição do primeiro CAVE;

  e) Licença de Estação de Aeronave, quando equipada com rádio, de acordo com a seção

  91.203 do RBHA 91, ou documento equivalente que venha a substituí-lo;

  f)

  Certificado de Habilitação Técnica válido e adequado à aeronave, conforme a seção

  91.5 do RBHA 91, ou documento equivalente que venha a substituí-lo; e

  g) Certificado de Capacidade Física válido, de acordo com a seção 91.5 do RBHA 91, ou

  documento equivalente que venha a substituí-lo.

  5.12

  Restrições Operacionais'
