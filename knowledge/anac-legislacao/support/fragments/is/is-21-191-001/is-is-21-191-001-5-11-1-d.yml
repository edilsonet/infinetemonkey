cite: 5.11.1(d)
title: 5.11.1(d)
text: 'd) Conforme requerido pela seção 91.203 do RBHA 91, ou documento equivalente que

  venha a substituí-lo, o registro dos últimos serviços de manutenção que atestaram a

  IAM, como por exemplo o RIAM ou Certificado de Conclusão de RIAM, a partir de 1

  (um) ano da expedição do primeiro CAVE;'
