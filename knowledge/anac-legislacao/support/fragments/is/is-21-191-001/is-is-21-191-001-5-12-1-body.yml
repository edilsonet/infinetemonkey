text: '5.12.1 A ANAC estabelecerá as restrições operacionais aplicáveis a cada aeronave. Entretanto,
  as

  restrições abaixo se aplicam indistintamente a todas as aeronaves de construção amadora:

  a) Qualquer operação deve obedecer aos requisitos da seção 91.319 do RBHA 91, ou do-

  cumento equivalente que venha a substituí-lo, e aos demais requisitos do referido

  RBAC aplicáveis à operação que está sendo conduzida;

  b) A aeronave deve ser operada de acordo com as limitações operacionais constantes das

  marcas e placas nela afixadas, conforme estabelecido nesta IS e no Manual de Voo da

  aeronave.


  04/06/2012 IS nº 21.191-001A'
