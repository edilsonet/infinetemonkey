title: A transferência de propriedade de uma aeronave de construção amadora deve ser comuni-
text: '5.13.1 A transferência de propriedade de uma aeronave de construção amadora deve ser
  comuni-

  cada à ANAC, conforme requerido com o RBHA 47, ou documento equivalente que venha

  a substituí-lo.


  6.

  APÊNDICE


  Apêndice A - Lista de reduções.


  7.

  DISPOSIÇÕES FINAIS


  a) Os casos omissos serão dirimidos pela ANAC.


  b) Esta IS entra em vigor na data de sua publicação.


  04/06/2012 IS nº 21.191-001A


  APÊNDICE A - LISTA DE REDUÇÕES


  A1. SIGLAS


  a) AC - Advisory Circular


  b) ANAC - Agência Nacional da Aviação Civil


  c) CAFC - Certificado de Autorização de Fabricação de Conjuntos


  d) CAVE - Certificado de Autorização de Voo Experimental


  e) CBAer - Código Brasileiro de Aeronáutica


  f) CG - Centro de Gravidade


  g) CME - Certificado de Marca Experimental


  h) CREA - Conselho Regional de Engenharia, Arquitetura e Agronomia


  i) EAC - Equipe de Avaliação de Conjunto


  j) FAA - Federal Aviation Administration


  k) H.03 - Processo de Avaliação de Projeto, Construção e Operação de Aeronave Construída

  por Amador


  l) IAM - Inspeção Anual de Manutenção


  m) IS - Instrução Suplementar


  n) RAB - Registro Aeronáutico Brasileiro


  o) RBAC - Regulamento Brasileiro da Aviação Civil


  p) RBHA - Regulamento Brasileiro de Homologação Aeronáutica


  q) RIAM - Relatório de Inspeção Anual de Manutenção


  A2. ABREVIATURAS - N/A'
