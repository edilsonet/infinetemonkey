text: '5.3.1

  É recomendável que um Orientador Técnico seja indicado para acompanhar e orientar o(s)

  construtor(es) amador(es) nos detalhes da construção e realizar vistorias intermediárias,

  sem prejuízo da responsabilidade do Engenheiro Responsável, e sempre se reportando a es-

  te.


  5.4

  Engenheiro Responsável'
