text: '5.5.1

  No caso de projeto desenvolvido pelo próprio construtor amador, o mesmo deverá ser ava-

  liado pelo Engenheiro Responsável, a fim de verificar se não existem características inade-

  quadas evidentes no que diz respeito a:

  a) Configuração aerodinâmica geral;

  b) Grupo moto-propulsor;


  04/06/2012 IS nº 21.191-001A


  c) Envelope de operações pretendido; e

  d) Técnicas, processos e materiais construtivos.

  5.6

  Boas Práticas de Projeto e Construção'
