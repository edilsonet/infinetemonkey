title: 5.6.1
text: '5.6.1

  Antes de empreender a construção de uma aeronave, o construtor amador interessado deve

  estar familiarizado com as informações constantes nas publicações aplicáveis ao tipo de
  ae-

  ronave que pretende construir. As associações nacionais de construtores podem ajudar o

  interessado na construção da aeronave, para indicar as publicações mais adequadas ao seu

  projeto. A lista a seguir é apenas um lembrete acerca de itens importantes, mas não substi-

  tui a consulta à literatura especializada ou às associações.

  a) Toda a construção deve ser devidamente documentada com fotos detalhadas, descrições

  e observações, e acessível para consulta da ANAC a qualquer momento.

  b) Durante a construção, recomenda-se que sejam feitas pelo menos 3 (três) vistorias audi-

  táveis, sendo 2 (duas) intermediárias para verificação da montagem: a primeira feita an-

  tes do fechamento das asas e a segunda após a instalação total dos comandos de voo. As

  inspeções intermediárias podem ser feitas pelo Orientador Técnico com o apoio do En-

  genheiro Responsável. A inspeção final deve ser obrigatoriamente feita pelo Engenheiro

  Responsável com fotos detalhadas, descrições e observações.

  c) Recomenda-se que o projeto forneça proteção contra cantos, bordas cortantes e saliên-

  cias que possam causar ferimentos aos ocupantes.

  d) Sempre que tecnicamente possível, devem ser instalados cintos de segurança, abdomi-

  nais e de ombro, para cada ocupante, de preferência aprovados para uso aeronáutico.

  e) A aeronave deve ser provida de meios adequados de proteção contra fogo. Recomenda-

  se a instalação de uma "parede de fogo", quando aplicável, isolando o compartimento

  do motor das demais partes da aeronave. Pelo menos um extintor de incêndio, com a-

  gente extintor especificado em documentos técnicos apropriados, deve equipar a cabine,

  em local acessível para uso em voo, exceto quando se tratar de aeronave não motorizada

  ou com cabine totalmente aberta.

  f)

  Caso o construtor deseje introduzir modificações em projetos de terceiros, é recomen-

  dável que o autor do projeto original, ou seu representante, seja consultado antes que se-

  jam implementadas quaisquer modificações. O construtor amador deverá manter um re-

  gistro de todas as modificações introduzidas no projeto original. Tanto o Orientador

  Técnico quanto o Engenheiro Responsável deverão ser notificados das eventuais modi-

  ficações no projeto da aeronave.

  g) Recomenda-se que o projeto de tanques de combustível preveja espaço para expansão

  de gases, decantação, suspiro e sistema de drenagem.

  h) Recomenda-se que o projeto de aeronaves com asa baixa e trem de pouso convencional

  considere uma gaiola de proteção no cockpit para caso de pilonagem.

  i)

  Recomenda-se que a instalação do grupo moto-propulsor seja submetida a um teste de,

  pelo menos, 30 (trinta) minutos de operação no solo, em várias rotações, a partir da


  04/06/2012 IS nº 21.191-001A


  marcha lenta até a potência máxima, simulando as situações mais críticas, a fim de as-

  segurar que todos os sistemas associados estão operando adequadamente.

  j)

  Recomenda-se a utilização do combustível recomendado pelo fabricante do motor.

  k) É recomendável a utilização de materiais aprovados para uso aeronáutico na construção

  de aeronaves por amadores, especialmente na estrutura primária e sistemas críticos. Em

  qualquer caso, o construtor deverá ser capaz de identificar a origem e a qualidade dos

  materiais e peças utilizados na construção da aeronave.

  l)

  É recomendável que serviços especiais tais como soldagem, usinagem, rebitagem, etc.,

  sejam executados por pessoas experientes no respectivo tipo de serviço, sempre respei-

  tando o critério da porção maior, como definido no item 4.15 desta IS.

  m) Partes estruturais feitas em materiais compostos (fibra de vidro, fibra de carbono, etc.)

  deverão ser fabricadas segundo normas e processos consagrados pela indústria.

  n) Recomenda-se que cada tanque convencional de combustível, metálico ou não-metálico,

  com paredes não suportadas pela estrutura adjacente da aeronave, seja submetido a um

  ensaio de pressão hidrostática e suporte, sem falha ou vazamento, à pressão de 24,13

  kPa (3,5 psig) ou à pressão desenvolvida durante a aplicação do fator de carga máximo

  de manobra com o tanque totalmente abastecido, a que for maior.

  o) Recomenda-se que cada tanque integral e cada tanque não-metálico, com paredes supor-

  tadas pela estrutura adjacente da aeronave, sejam submetidos a um ensaio de pressão

  hidrostática com valor de pressão a ser definido por pessoal técnico especializado.

  p) Recomenda-se a instalação de um sistema para drenagem e ventilação em caixas fecha-

  das para baterias.

  q) Recomenda-se que qualquer grande massa instalada atrás do habitáculo, como, por e-

  xemplo, bateria, cilindro de oxigênio ou de extintor, seja suportada por estrutura capaz

  de resistir a esforços semelhantes aos exigidos para motores traseiros (18g longitudinal).

  5.7

  Avaliação Operacional'
