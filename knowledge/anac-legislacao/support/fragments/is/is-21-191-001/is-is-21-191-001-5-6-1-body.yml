text: '5.6.1

  Antes de empreender a construção de uma aeronave, o construtor amador interessado deve

  estar familiarizado com as informações constantes nas publicações aplicáveis ao tipo de
  ae-

  ronave que pretende construir. As associações nacionais de construtores podem ajudar o

  interessado na construção da aeronave, para indicar as publicações mais adequadas ao seu

  projeto. A lista a seguir é apenas um lembrete acerca de itens importantes, mas não substi-

  tui a consulta à literatura especializada ou às associações.'
