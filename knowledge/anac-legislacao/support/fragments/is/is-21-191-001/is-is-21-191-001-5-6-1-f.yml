title: 5.6.1(f)
text: 'f)

  Caso o construtor deseje introduzir modificações em projetos de terceiros, é recomen-

  dável que o autor do projeto original, ou seu representante, seja consultado antes que se-

  jam implementadas quaisquer modificações. O construtor amador deverá manter um re-

  gistro de todas as modificações introduzidas no projeto original. Tanto o Orientador

  Técnico quanto o Engenheiro Responsável deverão ser notificados das eventuais modi-

  ficações no projeto da aeronave.'
