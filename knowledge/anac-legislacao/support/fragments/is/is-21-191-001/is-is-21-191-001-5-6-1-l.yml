text: 'l)

  É recomendável que serviços especiais tais como soldagem, usinagem, rebitagem, etc.,

  sejam executados por pessoas experientes no respectivo tipo de serviço, sempre respei-

  tando o critério da porção maior, como definido no item 4.15 desta IS.'
