text: 'q) Recomenda-se que qualquer grande massa instalada atrás do habitáculo, como, por
  e-

  xemplo, bateria, cilindro de oxigênio ou de extintor, seja suportada por estrutura capaz

  de resistir a esforços semelhantes aos exigidos para motores traseiros (18g longitudinal).

  5.7

  Avaliação Operacional'
