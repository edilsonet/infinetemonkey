title: 5.7.1
text: '5.7.1

  Para dar início ao programa de ensaios em voo, o construtor amador deve requerer à A-

  NAC a emissão do CME e do CAVE, conforme estabelecido pelo RBHA 47, ou documen-

  to equivalente que venha a substituí-lo, e pelo RBAC 21, respectivamente.'
