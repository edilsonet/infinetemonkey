title: 5.7.2
text: '5.7.2

  Toda aeronave de construção amadora deve ser submetida a um programa de ensaios em

  voo para verificação das características de voo e desempenho visando atender ao requerido

  na seção 91.319 do RBHA 91 ou documento equivalente que venha a substituí-lo, e, ainda,

  de acordo com a AC 90-89A emitida pela FAA ou documento equivalente emitido pela

  ANAC.'
