text: '5.7.4

  Para os primeiros voos da aeronave, o construtor amador deve tomar todas as providências

  para assegurar que os serviços e equipamentos de emergência estejam prontamente dispo-


  04/06/2012 IS nº 21.191-001A


  níveis. Se a aeronave for um hidroavião, deve haver uma embarcação com pessoal e equi-

  pamento adequado para resgate estacionada próximo à área de decolagem e pouso.'
