text: '5.7.5

  Durante a fase de ensaios em voo, o piloto da aeronave deve utilizar equipamentos de se-

  gurança adequados, tais como: paraquedas, capacete de voo, colete salva-vidas, luvas, ócu-

  los, etc.'
