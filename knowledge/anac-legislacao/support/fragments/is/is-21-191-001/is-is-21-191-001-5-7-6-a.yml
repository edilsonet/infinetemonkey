title: 5.7.6(a)
text: 'a) Aviões e motoplanadores:

  I -

  25 horas de voo, quando equipados com motores e hélices para uso aeronáutico;

  II -

  40 horas de voo, quando equipados com motores ou hélices não certificados para

  uso aeronáutico.'
