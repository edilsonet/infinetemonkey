text: '5.7.6

  A menos que de outra forma propostos pelo construtor amador e autorizados pela ANAC,

  os números mínimos de horas de voo necessários a esta fase são os abaixo especificados:

  a) Aviões e motoplanadores:

  I -

  25 horas de voo, quando equipados com motores e hélices para uso aeronáutico;

  II -

  40 horas de voo, quando equipados com motores ou hélices não certificados para

  uso aeronáutico.

  b) Planadores:


  10 horas de voo.

  c) Balões:


  10 horas de voo.

  d) Dirigíveis:


  10 horas de voo.

  e) Girocópteros e helicópteros:


  40 horas de voo.'
