title: 5.7.7
text: '5.7.7

  O programa de ensaios em voo deve ser realizado por piloto(s) habilitado(s) para um tipo
  e

  modelo similar de aeronave, podendo ser o próprio construtor amador e/ou outros por ele

  designados, e somente eles podem operar a aeronave, nesta fase, realizando voos solo.'
