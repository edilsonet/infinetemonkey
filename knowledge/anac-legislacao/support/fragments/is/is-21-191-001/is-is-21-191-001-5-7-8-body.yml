title: 5.7.8
text: '5.7.8

  Todos os voos nesta fase devem ser realizados sobre uma área não edificada próxima ao

  aeródromo de operação. Não poderão ser realizados voos em áreas que possam colocar em

  risco a vida e os bens de terceiros.'
