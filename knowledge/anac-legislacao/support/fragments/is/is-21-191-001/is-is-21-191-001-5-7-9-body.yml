title: 5.7.9
text: '5.7.9

  Concluída a fase de ensaios em voo, o construtor amador deve elaborar um relatório des-

  critivo sobre os resultados obtidos na avaliação, devendo este ser assinado pelos pilotos

  que realizaram a avaliação. A critério da ANAC, pode ser exigida a apresentação do Rela-

  tório de Ensaio em Voo para análise. Os resultados de todos os voos devem ser registrados

  em documento apropriado.'
