text: '5.8.5

  No caso de aeronaves equipadas com produtos aeronáuticos e componentes aprovados para

  uso aeronáutico, recomenda-se o uso dos critérios de inspeção e troca por tempo de vida-

  limite aprovados ou estabelecidos por seus respectivos fabricantes.'
