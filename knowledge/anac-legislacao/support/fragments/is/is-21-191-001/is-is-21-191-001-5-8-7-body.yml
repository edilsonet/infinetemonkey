text: '5.8.7

  O construtor amador deve:

  a) Elaborar um programa de manutenção e inspeções da aeronave, e

  b) Abrir cadernetas de célula e do grupo moto-propulsor para registro das anotações a-

  propriadas (revisões, modificações, inspeções periódicas, etc.).


  NOTA: Esses registros devem ser apresentados à ANAC sempre que solicitados.'
