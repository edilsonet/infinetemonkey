text: '5.8.8

  Após a realização de cada IAM, deve ser preenchido o RIAM, de acordo com o formulário

  disponível no sítio da ANAC. Estão autorizados a preencher o RIAM:

  a) Oficinas de manutenção de aeronaves certificadas segundo o RBHA 145 ou documen-

  to equivalente que venha a substituí-lo;

  b) Engenheiros Aeronáuticos registrados no CREA e cadastrados na ANAC;

  c) Engenheiros Mecânicos registrados no CREA, com habilitação para aprovarem servi-

  ços de manutenção em aeronaves, e cadastrados na ANAC;

  d) Mecânicos de Manutenção Aeronáutica habilitados pela ANAC;

  e) representantes técnicos de associações relacionadas com a aeronave e cadastrados na

  ANAC. Para o cadastramento de seus representantes, as associações devem apresentar

  requerimento à ANAC, declarando que os mesmos possuem capacidade técnica para o

  desempenho da atividade e foram aprovados por comissão/conselho técnico nomea-

  do(a) pela entidade.

  5.9

  Abertura de Processo'
