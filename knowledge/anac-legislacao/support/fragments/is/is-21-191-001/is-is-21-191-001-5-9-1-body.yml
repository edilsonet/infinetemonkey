title: 5.9.1
text: '5.9.1

  A pessoa interessada na construção amadora de uma aeronave deve enviar um requerimen-

  to (conforme formulários disponíveis no sítio da ANAC) solicitando abertura de processo

  de avaliação de projeto, construção e operação de aeronave de construção amadora antes

  de iniciá-la.'
