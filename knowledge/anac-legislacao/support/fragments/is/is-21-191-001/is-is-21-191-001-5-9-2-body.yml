text: '5.9.2

  Este requerimento deve ser acompanhado de:


  04/06/2012 IS nº 21.191-001A


  a) Apresentação do Projeto;

  b) Especificação da Aeronave;

  c) Materiais, Componentes e Equipamentos de Bordo;

  d) Desenho em 3 (três) vistas da aeronave com as dimensões principais cotadas em me-

  tros; e

  e) Termo de Incumbência de Acompanhamento de Construção de Aeronave de Constru-

  ção Amadora assinado pelo Engenheiro Responsável.'
