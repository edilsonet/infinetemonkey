text: '5.9.3

  Para aeronaves construídas a partir de conjuntos previamente avaliados pela EAC, não

  necessitam ser apresentados, no ato do requerimento, os documentos requeridos pelos pa-

  rágrafos 5.9.2 (b), (c) e (d) desta seção.'
