text: '5.9.5

  No caso de aeronave cuja construção amadora ocorra em outro país que não o Brasil, que

  esteja em condições de voo e seja adquirida por pessoa residente no Brasil, o comprador

  brasileiro deve:

  a) Demonstrar que a aeronave possuía previamente, no país de origem, uma certificação de

  aeronavegabilidade válida e equivalente à prevista pelo RBAC 21.191(g);

  b) Requerer à ANAC a emissão do CME conforme estabelecido pelo RBHA 47 ou docu-

  mento equivalente que venha a substituí-lo; e

  c) Requerer à ANAC a emissão do CAVE, conforme estabelecido pelo RBAC 21.191(g).'
