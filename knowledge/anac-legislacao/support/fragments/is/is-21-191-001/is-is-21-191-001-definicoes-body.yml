title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1

  Aeronave de construção amadora. De acordo com o parágrafo 21.191(g) do RBAC 21, é

  uma aeronave cuja porção maior foi fabricada e montada por pessoa(s) que realizou(aram)
  a

  construção unicamente para sua própria educação ou recreação. As aeronaves de construção

  amadora podem ser fabricadas a partir de projetos próprios ou adquiridos de terceiros, bem

  como montadas a partir de conjuntos (kits).


  04/06/2012 IS nº 21.191-001A


  4.2

  Assistência comercial. É a assistência fornecida ao construtor amador, na fabricação e/ou

  montagem, em troca de pagamento, serviços ou outra forma de compensação. Não inclui a

  ajuda que um construtor amador pode fornecer a outro, sem compensação.

  4.3

  Avaliação pela EAC - Equipe de Avaliação de Conjunto. É a avaliação opcional condu-

  zida pela EAC com a finalidade de determinar se um conjunto específico de aeronave, como

  fabricado, permite a um construtor amador satisfazer o critério de porção maior previsto
  no

  parágrafo 21.191(g).

  4.4

  Certificado de Autorização de Fabricação de Conjuntos - CAFC. Para fins desta IS, é o

  documento emitido pela ANAC atestando que o conjunto de um certo modelo de aeronave,

  conforme 4.11, teve avaliação satisfatória pela EAC e permite a um construtor amador satis-

  fazer o critério de porção maior previsto no RBAC 21.191(g). A avaliação poderá incluir
  o

  cumprimento, pelo fabricante do conjunto, de uma norma consensual de qualidade.

  4.5

  Certificado de Autorização de Voo Experimental - CAVE. É o documento emitido pela

  ANAC que permite a operação de aeronave de construção amadora.

  4.6

  Certificado de Conclusão de RIAM - Relatório de Inspeção Anual de Manutenção. É o

  documento que atesta o preenchimento, com base em inspeção realizada, do RIAM. Deve

  ser usado, como Certificado de Conclusão de RIAM, o modelo de formulário aceito pela

  ANAC.

  4.7

  Certificado de Marca Experimental - CME. É o documento comprobatório de proprieda-

  de da aeronave, emitido pelo Registro Aeronáutico Brasileiro - RAB, que contém as suas

  marcas de registro.

  4.8

  Componente. É o material processado, peça ou conjunto que constitui parte integrante de

  uma aeronave, motor de aeronave ou hélice, e que seja empregado em sua fabricação, bem

  como os dispositivos e os acessórios instalados na aeronave cuja falha ou funcionamento
  in-

  correto possa afetar a segurança de voo e/ou dos ocupantes da mesma.

  4.9

  Conjunto. É o pacote constituído de subconjuntos, peças, componentes e outros materiais

  que, uma vez montados, darão origem a uma aeronave. O conjunto inclui, também, dese-

  nhos, instruções de fabricação e montagem, manual de operações, lista de equipamentos,

  instruções de pesagem e balanceamento e demais dados técnicos e documentos requeridos

  para a construção e operação de uma aeronave de construção amadora.

  4.10

  Engenheiro Responsável. É o Engenheiro Aeronáutico ou Engenheiro Mecânico com atri-

  buições de aeronáutica pelo Conselho Regional de Engenharia, Arquitetura e Agronomia -

  CREA, responsável pelo processo de construção de aeronave por amador. O Engenheiro

  Responsável deverá assinar um Termo de Incumbência e demais laudos previstos por esta

  IS.

  4.11

  Equipe de avaliação de conjunto - EAC. É uma equipe técnica composta por servidores

  da ANAC e; a critério da ANAC, representantes das Associações nacionais competentes. Os

  componentes da EAC deverão ter experiência na avaliação e certificação de aeronavegabili-

  dade de aeronaves de construção amadora.

  4.12

  Fabricação. É o retrabalho sobre qualquer material, peça ou componente, tais como marca-

  ção, dobramentos, conformação, furos cônicos, empenamento, corte, juntas, cola-


  04/06/2012 IS nº 21.191-001A


  gem/selagem, laminação, moldagem, rebarbação, furação, usinagem, forjamento, aplicação

  de produtos conservantes, preparação de superfície e camadas básicas, rebitagem, soldagem

  ou tratamento a quente; e, ainda, modificação de material, parte ou componente cuja função

  seja conduzi-lo ao seu estado final.

  4.13

  Laudo de Vistoria Final de Aeronave. É o documento elaborado por um engenheiro res-

  ponsável pela construção da aeronave, que declara que esta foi concluída em conformidade

  com o projeto anexado ao respectivo processo de avaliação de construção de aeronave por

  amadores (de acordo com formulários disponíveis no sítio da ANAC).

  4.14

  Lista de verificação de fabricação e montagem de aeronaves construídas por amadores.

  É a ferramenta usada pela ANAC para determinar se o construtor amador cumpriu com o

  critério da porção maior, definido no item 4.15.

  4.15

  Porção maior. É o critério relacionado à construção de aeronaves por amadores significan-

  do que, quando a aeronave estiver completa, a maioria das tarefas da lista de verificação
  de

  fabricação e montagem de aeronave de construção amadora terá sido realizada pelo(s) cons-

  trutor(es) amador(es) que empreendeu(eram) a construção. A avaliação da aeronave visando

  determinar se a mesma atende ao critério de porção maior é feita através de inspeções e/ou

  da lista de verificação definida no item 4.14 acima, a critério da ANAC.

  4.16

  Ocupante. É qualquer pessoa, tripulante ou não, que esteja a bordo de uma aeronave.

  4.17

  Orientador Técnico. É o construtor (pessoa física), cadastrado na ANAC através de associ-

  ações nacionais a que faça parte, que possua capacidade comprovada para acompanhar e o-

  rientar o(s) construtor(es) amador(es) nos detalhes da construção e realizar vistorias inter-

  mediárias, sem prejuízo da responsabilidade do Engenheiro Responsável e sempre se repor-

  tando a este.

  4.18

  Produto aeronáutico. De acordo com a seção 01.1 do RBAC 01, é qualquer aeronave civil,

  motor ou hélice de aeronave ou aparelho neles instalado. Para os propósitos desta instrução,

  a definição de produto aeronáutico inclui ainda qualquer instrumento, mecanismo, peça, a-

  parelho, pertence, acessório e equipamento de comunicação, desde que sejam usados ou que

  se pretenda usá-los na operação ou no controle de uma aeronave em voo, que sejam instala-

  dos ou fixados à aeronave e que não sejam parte de uma célula, de um motor ou de uma hé-

  lice; inclui, finalmente, materiais e processos usados na fabricação de todos os itens citados

  nesta definição.

  4.19

  Relatório de Inspeção Anual de Manutenção - RIAM. É a listagem de itens a serem veri-

  ficados durante a Inspeção Anual de Manutenção - IAM de aeronaves de construção amado-

  ra. Cada item inspecionado deve ter sua situação registrada em documento específico para

  tal.


  5.'
