title: FUNDAMENTOS
text: 'FUNDAMENTOS


  3.1

  O art. 67 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica -

  CBAer), determina que compete à autoridade aeronáutica regulamentar a construção e a

  operação de aeronaves construídas por amadores.

  3.2

  A Lei 11.182, de 27 de setembro de 2005, definiu, por meio do seu art. 5º, que a ANAC é

  autoridade de aviação civil e tem competência para expedir os certificados de aeronavega-

  bilidade conforme estabelece ainda o art. 8º. XXXI da mesma lei. O seu art. 8º, XLVI, es-

  tabelece a competência da ANAC em editar e dar publicidade às instruções necessárias pa-

  ra a aplicação da referida lei.

  3.3

  O Regulamento Brasileiro da Aviação Civil nº 21 - RBAC 21, em seu parágrafo 21.191(g),

  estabelece requisito quanto à emissão de Certificado de Autorização de Voo Experimental

  para aeronaves de construção amadora.

  3.4

  A Resolução nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a ANAC pode

  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em RBAC.

  3.5

  Considerando o exposto nesta seção, esta IS está sendo emitida objetivando detalhar e ori-

  entar a aplicação do parágrafo 21.191(g) do RBAC 21 quanto à construção, operação e

  manutenção da aeronavegabilidade de aeronaves de construção amadora.

  4.'
