title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 O art. 66 da lei nº 7.565 - Código Brasileiro de Aeronáutica, de 19 de dezembro de 1986,

  estabelece que compete à autoridade aeronáutica promover a segurança de voo, devendo

  estabelecer os padrões mínimos relativos à inspeção, manutenção em todos os níveis, repa-

  ros e operação de aeronaves, motores, hélices e demais componentes aeronáuticos. E em

  seu parágrafo 2º, os padrões podem variar em razão de tipo ou destinação do produto aero-

  náutico.

  3.2 A Resolução nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a ANAC pode

  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em RBAC.

  3.3 No presente caso, esta IS detalha alguns aspectos do parágrafo 21.191(d) do RBAC 21,
  que

  trata de aeronaves com o propósito de exibição, como é o caso das históricas.'
