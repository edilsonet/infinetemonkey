title: DEFINIÇÕES
text: '4. DEFINIÇÕES

  4.1 Aeronave Histórica. É toda aeronave registrada como histórica segundo os requisitos
  da

  Subparte D do RBHA 47, ou documento equivalente que venha a substituí-lo, para uso em

  museus, amostras, voos de exibição e deslocamentos dentro de sua área geográfica de ope-

  ração conforme definidos nesta IS, restritas a essas finalidades e declaradas como tal na

  forma de legislação em vigor.

  4.2 Amostra. Atividade organizada, pública ou privada, realizada em local adequado, que
  te-

  nha por finalidade a exibição de produtos, materiais, e/ou serviços de qualquer espécie.

  4.3 Componente Controlado. Aquele que possui limites de utilização para revisão, substitui-

  ção, teste e/ou calibração previstos no programa de manutenção do fabricante. Estes limites

  podem ser estipulados em horas de utilização, número de pousos ou de ciclos, tempo ca-23/12/2011
  IS nº 21.191-002

  Revisão A

  lendárico, métodos estatísticos de controle ou quaisquer outros métodos de controle pré-

  definidos e aprovados; podem ser propostos pelos fabricantes (inicialmente e de forma

  conservativa) ou pelos operadores (em função de suas operações específicas), com a neces-

  sária aprovação e o acompanhamento da autoridade aeronáutica.

  4.4 Diretriz de Aeronavegabilidade - (DA). Informação de aeronavegabilidade continuada

  de caráter mandatório emitida como emenda ao RBAC 39 e que estabelece, como apropri-

  ado, inspeções, modificações, instruções e limitações aplicáveis a produtos aeronáuticos,

  quando existir uma condição insegura em um produto e essa condição tiver probabilidade

  de existir ou se desenvolver em outros produtos de mesmo projeto de tipo.

  4.5 Exibição. Operação de uma aeronave para os propósitos de exibição, de acordo com o

  RBAC 21.191 (d) trata-se de exibição das qualidades de voo, de desempenho ou de carac-

  terísticas peculiares da aeronave em demonstrações, produções cinematográficas, progra-

  mas de televisão e outras produções similares. Manutenção da proficiência das tripulações

  na condução de tais exibições, incluindo (para tais tripulantes) a execução dos voos de
  e

  para os locais de tais demonstrações e produções. Estão incluídos nestes propósitos: shows

  aéreos organizados; convenções aéreas organizadas; exibições organizadas; eventos educa-

  tivos para jovens; exibições estáticas em shoppings, escolas e similares; competições acro-

  báticas organizadas; convenções ou competições de voo a vela e produções de televisão ou

  filmes. A operação da aeronave para demonstrar as características de voo ou capacidades

  relacionadas com a promoção de venda da aeronave não é considerada como elegível no

  propósito de operação da categoria exibição.

  4.6 Laudo de Vistoria de Aeronave: Laudo técnico elaborado por Engenheiro Aeronáutico

  com registro no Conselho Regional de Engenharia, Arquitetura e Agronomia - CREA que

  atesta que a aeronave cumpre com os requisitos necessários para emissão do CAVE para os

  propósitos de exibição quando operado de acordo com as limitações prescritas.

  4.7 País de Origem. País da organização responsável pelo projeto de tipo do produto aeronáu-

  tico.

  4.8 Relatório de Inspeção Anual de Manutenção - RIAM: Relatório que atesta a realização

  de Inspeção Anual de Manutenção, conforme programa de manutenção da aeronave envia-

  do à ANAC.

  4.9 Vistoria de Aeronave: Vistoria técnica, conduzida e atestada por Engenheiro Aeronáutico

  (com registro no CREA), com o propósito básico de avaliar as condições de voo da aero-

  nave, através de sua inspeção física e da verificação dos seus registros de manutenção e
  sua

  desmilitarização, nos casos aplicáveis, bem como atendimento aos requisitos necessários

  para emissão do CAVE para os propósitos de exibição.

  4.10 Voo de Exibição. Operação da aeronave em voo para demonstração aérea organizada

  (show aéreo), atividade organizada de deslocamento aéreo (fly-in), encontro aeronáutico,

  corrida aérea competitiva (rally aéreo), exibição em evento sócio-cultural organizado, des-

  locamento para demonstração estática em local adequado a essa finalidade, competição a-

  crobática organizada, e para produções da mídia (fotografia, filmagem para cinema, televi-

  são, etc.).23/12/2011 IS nº 21.191-002

  Revisão A'
