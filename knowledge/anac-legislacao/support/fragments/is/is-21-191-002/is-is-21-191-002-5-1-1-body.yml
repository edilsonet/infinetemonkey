title: Operação. Ninguém pode operar uma aeronave com o propósito de exibição, em território
text: '5.1.1 Operação. Ninguém pode operar uma aeronave com o propósito de exibição, em território

  brasileiro, a menos que exista um Certificado de Matrícula e um Certificado de Autoriza-

  ção de Voo Experimental para o propósito de exibição, válidos para a aeronave, emitidos

  pela ANAC.'
