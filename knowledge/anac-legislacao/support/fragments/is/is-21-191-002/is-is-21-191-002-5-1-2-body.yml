text: '5.1.2 Requisitos de Aeronavegabilidade Aplicáveis. Para a operação de aeronave histórica,
  o

  interessado não necessita demonstrar o cumprimento dos requisitos de aeronavegabilidade

  estabelecidos para homologação da aeronave. Entretanto, a ANAC pode exigir o cumpri-

  mento de itens específicos desses requisitos, quando julgar que as características atuais
  da

  aeronave não estejam compatíveis com os originais.

  5.2 Aeronaves Históricas'
