text: '5.2.3 Solicitação de Reservas de Marcas. Antes de requerer um Certificado de Autorização
  de

  Voo Experimental, o requerente deverá ter solicitado reserva de marcas junto ao RAB,

  conforme a subparte D do RBHA 47, ou documento equivalente que venha a substituí-lo.'
