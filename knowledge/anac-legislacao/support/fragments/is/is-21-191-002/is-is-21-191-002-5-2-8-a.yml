cite: 5.2.8(a)
title: 5.2.8(a)
text: 'a) A Vistoria de Aeronave é atestada no competente Laudo de Vistoria de Aeronave, pelo

  Engenheiro Aeronáutico que a conduzir. Para a emissão do Laudo de Vistoria de Aero-

  nave, o Engenheiro Aeronáutico que a conduzir deverá verificar que:

  I- existe na aeronave, em local bem visível por todos os ocupantes, uma placa de

  advertência com os dizeres “ESTA AERONAVE NÃO SATISFAZ OS REQUI-

  SITOS DE AERONAVEGABILIDADE - VOO POR CONTA E RISCO PRÓ-

  PRIOS”;

  II- existe na aeronave a placa de identificação com as informações de modelo, nú-

  mero de série, ano de fabricação, e marcas de matrícula e nacionalidade, de a-

  cordo com o parágrafo 45.22(b) do RBAC 45; caso não haja a original deverá

  ser fixada (soldada ou rebitada) uma placa, de preferência em aço inoxidável,

  contendo, em baixo relevo, as citadas informações;

  III- estão instaladas na aeronave as marcas, placares, tabelas, e marcações dos ins-

  trumentos de acordo com o requerido pelo RBHA 91.9, ou documento equiva-

  lente que venha a substituí-lo, indicando todas as limitações operacionais previs-

  tas, a saber, marcações dos instrumentos de bordo, limites de operação do motor,

  limites de velocidade; placa de limites de velocidade, incluindo manobras permi-

  tidas, advertências, etc.; e o cartão de calibração da bússola, se aplicável;

  IV- estão marcados o tipo do combustível e a capacidade (em litros) de cada tanque

  próximo aos bocais de reabastecimento;

  V- a aeronave está equipada com pelo menos um extintor de incêndio;

  VI- estão instalados cintos de segurança abdominal e de ombro, um para cada ocu-

  pante, quando aplicável ao tipo de aeronave;23/12/2011 IS nº 21.191-002

  Revisão A

  VII- a aeronave foi pesada devidamente equipada, determinada a posição do CG va-

  zio e elaborado o respectivo diagrama de carregamento;

  VIII- foram efetuados ensaios de funcionamento dos sistemas da aeronave - combus-

  tível, elétrico, hidráulico, pneumático, comandos de voo, etc.; e

  IX- foram efetuados ensaios para verificar o funcionamento e o desempenho do gru-

  po motopropulsor no solo.'
