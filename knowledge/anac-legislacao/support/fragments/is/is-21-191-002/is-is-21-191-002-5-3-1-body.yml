text: '5.3.1 Programa de Inspeção e Manutenção. Um Programa de Inspeção e Manutenção da aero-

  nave, elaborado e atestado por Engenheiro Aeronáutico (com registro no CREA) deve ser

  proposto à ANAC. O interessado deverá apresentar o Programa à ANAC, no máximo, jun-

  to com o requerimento para a emissão de um CAVE para os propósitos de exibição segun-

  do o RBAC 21.191 (d).'
