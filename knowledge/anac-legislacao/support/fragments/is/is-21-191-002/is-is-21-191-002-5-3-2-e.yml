title: 5.3.2(e)
text: 'e) o programa de inspeção e manutenção deve incluir uma inspeção anual de manutenção

  de acordo com o apêndice D do RBHA 43, ou documento equivalente que venha a subs-

  tituí-lo. Os resultados devem ser registrados no Relatório de Inspeção Anual de Manu-

  tenção, com a identificação do engenheiro e do mecânico responsáveis;'
