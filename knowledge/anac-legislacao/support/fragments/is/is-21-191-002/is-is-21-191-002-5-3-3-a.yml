text: 'a) Devem existir ou serem abertas cadernetas da célula e do grupo moto-propulsor da
  aero-

  nave histórica para registro das anotações apropriadas (inspeções periódicas, revisões,

  reparos, modificações e etc). Tais registros devem ser apresentados à fiscalização da

  ANAC sempre que solicitados.23/12/2011 IS nº 21.191-002

  Revisão A'
