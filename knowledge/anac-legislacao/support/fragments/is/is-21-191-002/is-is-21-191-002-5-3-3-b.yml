cite: 5.3.3(b)
title: 5.3.3(b)
text: 'b) Qualquer falha, mau funcionamento ou defeito encontrado na aeronave e considerado

  como atípico, prematuro ou de qualquer forma inesperado, deve ser comunicado à A-

  NAC, através de relatório detalhado. Se a falha, mau funcionamento ou defeito afetar se-

  riamente a segurança de voo, a comunicação deve ser feita de forma mais expedita pos-

  sível, de modo a permitir que outros operadores sejam alertados em tempo útil.'
