text: 'c) A aeronave histórica, incluindo seus componentes e sistemas, deverá ser mantida
  e ins-

  pecionada de acordo com as publicações técnicas e/ou instruções do fabricante apropria-

  das para a mesma, ou ainda, com o Plano de Manutenção proposto pelo proprietá-

  rio/operador e aprovado pela ANAC.'
