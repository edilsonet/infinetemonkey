cite: 5.3.3(d)
title: 5.3.3(d)
text: 'd) Deve ser preenchido o Relatório de Inspeção Anual de Manutenção, cujo modelo deve

  constar do programa de manutenção proposto pela aeronave. Estão autorizados a preen-

  cher o RIAM engenheiro aeronáutico ou mecânico-aeronáutico com registro no CREA

  ou mecânico habilitado pela ANAC.'
