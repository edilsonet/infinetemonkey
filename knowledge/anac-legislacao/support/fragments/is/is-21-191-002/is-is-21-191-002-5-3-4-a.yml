cite: 5.3.4(a)
title: 5.3.4(a)
text: 'a) Somente estão autorizados a executar manutenção nas aeronaves históricas as oficinas

  aprovadas, os Engenheiros Aeronáuticos e/ou Engenheiros Mecânicos registrados no

  CREA e por ele habilitados para aprovar serviços de manutenção em aeronaves, e, os

  mecânicos habilitados pelo ANAC.'
