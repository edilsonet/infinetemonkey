title: 5.3.4(b)
text: 'b) As inspeções, realizadas na aeronave, deverão ser inseridas nos registros de manutenção

  da mesma com a seguinte declaração ou similar: “Atesto que esta aeronave foi inspecio-

  nada, em (data), de acordo com o objetivo e os detalhes do(a) (referência do programa de

  manutenção), ficando constatado que se encontra em condições seguras de operação.”'
