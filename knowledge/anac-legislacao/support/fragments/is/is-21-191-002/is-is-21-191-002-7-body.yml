text: '7. DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela ANAC.

  7.2 Nesta primeira edição (revisão A) da IS 21.191-002, não é necessário que se revise a
  do-

  cumentação de entidades reguladas pela ANAC (por exemplo, manuais, formulários, eti-

  quetas, etc.), caso o único intuito dessa revisão seja atualizar eventuais referências à
  IAC

  3144.23/12/2011 IS nº 21.191-002

  Revisão A'
