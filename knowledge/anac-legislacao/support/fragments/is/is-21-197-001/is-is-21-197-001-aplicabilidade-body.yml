title: Aplicabilidade
text: 'Aplicabilidade

  As disposições desta IS são aplicáveis somente às aeronaves que possuam projeto de tipo
  certificado, no Brasil ou exterior, e que possuam marcas de nacionalidade e matrícula brasileiras
  ou, pelo menos, reserva de marcas brasileiras.

  Esta IS se aplica às situações previstas nos parágrafos 21.197(a)(1) e 21.197(a)(4) do RBAC
  nº 21, no parágrafo 137.201(e) do RBAC nº 137 e na seção 91.407 do RBAC nº 91, a serem solicitadas
  à Superintendência de Padrões Operacionais - SPO.

  Esta IS não é aplicável aos parágrafos 21.197(a)(2), (3) e (5) e 21.197(b) e (c) do RBAC
  nº 21.


  Previsão legal e regulamentar

  O inciso I do art. 20 da Lei nº 7.565, de 19 de dezembro de 1986, (Código Brasileiro de
  Aeronáutica - CBAer) dispõe que, salvo permissão especial, nenhuma aeronave poderá voar
  no espaço aéreo brasileiro, aterrissar no território subjacente ou dele decolar, a não ser
  que tenha marcas de nacionalidade e matrícula e esteja munida dos respectivos certificados
  de matrícula e aeronavegabilidade.

  O mesmo art. 20 do CBAer também dispõe, em seu parágrafo único, que a autoridade de aviação
  civil pode, por meio de regulamento, estabelecer as condições para os voos com certificado
  de aeronavegabilidade especial.

  O RBAC n° 21, que trata dos requisitos de certificação de produto e artigo aeronáuticos,
  em seu parágrafo 21.175(b), estabelece que certificados de aeronavegabilidade especiais
  são os certificados de aeronavegabilidade emitidos para aeronaves categorias primárias,
  restrita, leve esportiva e os certificados de aeronavegabilidade provisórios. Compreendem,
  ainda, os certificados de aeronavegabilidade para aeronaves recém-fabricadas, as autorizações
  especiais de voo e os certificados de autorização de voo experimental.

  O parágrafo 21.197(a) do RBAC n° 21 estabelece que uma autorização especial de voo pode
  ser emitida para uma aeronave que temporariamente não atenda a todos os requisitos de aeronavegabilidade
  a ela aplicáveis, mas que ainda apresente condições de voo seguro. Tais situações podem
  ocorrer, por exemplo, nos casos de aeronaves que ainda não possuam registro no Brasil, ou
  de aeronaves já registradas que necessitem e estejam em condições de realizar um translado
  seguro, mas que por algum motivo não estejam em condições de operar conforme os requisitos
  de aeronavegabilidade a ela aplicáveis. Como exemplos de tais casos teríamos aeronaves com
  o Certificado de Verificação de Aeronavegabilidade - CVA vencido, Certificado de Aeronavegabilidade
  - CA suspenso ou cancelado, dentre outros casos.

  O RBAC n° 91, que trata dos requisitos gerais de operação para aeronaves civis, apresenta
  o requisito para o voo de experiência ao estabelecer no parágrafo 91.407(b) que somente
  é permitido transportar qualquer pessoa (exceto tripulantes) em uma aeronave que tenha sofrido
  manutenção, manutenção preventiva, reconstrução ou alterações que possam ter alterado ou
  afetado apreciavelmente suas características de voo ou afetado substancialmente sua operação
  em voo, se um piloto habilitado na aeronave tiver voado na aeronave e feito uma verificação
  operacional do trabalho executado e anotado o voo e seu resultado nos registros da aeronave.

  O parágrafo 137.201(e) do RBAC n° 137 dispõe ainda que um operador aeroagrícola pode utilizar
  combustível não previsto no projeto de tipo aprovado da aeronave desde que opere segundo
  condições aceitáveis pela Anac, estabelecida em autorização especial de voo.

  Uma AEV não exime a aeronave do cumprimento com os requisitos a ela aplicáveis dos RBAC
  n° 43, 91, 121 e 135.


  Propósitos da Autorização Especial de Voo

  As solicitações de autorização especial de voo, nacionais ou internacionais, abrangidas
  por esta IS serão analisadas pela SPO (e unidades a ela vinculadas às quais delegar essa
  competência), que, quando verificar que os requisitos necessários ao seu deferimento foram
  cumpridos, poderá emitir uma AEV para os seguintes propósitos:

  translado para uma base onde reparos, alterações ou serviços de manutenção serão executados,
  conforme 21.197(a)(1) do RBAC nº 21;

  translado para uma base onde a aeronave será armazenada, conforme 21.197(a)(1) do RBAC nº
  21;

  voo de experiência após manutenção nos termos da seção 91.407 do RBAC n° 91, nos casos em
  que a aeronave estiver em situação não-aeronavegável;

  voo de teste para cumprimento de requisito de Vistoria Técnica Inicial - VTI ou Vistoria
  Técnica Especial - VTE;

  Nota: a vistoria poder ser requerida para emissão de CA de acordo com o RBAC nº 21 e pode
  envolver a realização de voo nos termos da seção 91.407 do RBAC nº 91. Em qualquer caso,
  aplica-se este propósito se o voo for requerido para realização da vistoria, mas a aeronave
  estiver em situação não-aeronavegável.

  deslocamento de aeronave para aeródromo onde será realizada a sua VTI, VTE ou vistoria pela
  Receita Federal, conforme 21.197(a)(1) do RBAC nº 21;

  Nota: a AEV para realização de vistoria apoia-se no parágrafo 21.197(a)(1) do RBAC nº 21,
  tendo em vista que a vistoria se trata de uma forma de inspeção, estando assim no âmbito
  daquela seção. Adicionalmente, a Anac entende que cabe o translado para a realização de
  vistoria pela Receita Federal, uma vez que se constitui processo comum a ser cumprido por
  novos operadores.

  evacuação da aeronave de áreas perigosas, conforme 21.197(a)(4) do RBAC nº 21; e

  operação de aeronave em operações aeroagrícolas equipada com motores convencionais utilizando
  etanol, conforme previsto no parágrafo 137.201(e) do RBAC nº 137 e meio de cumprimento previsto
  na IS n° 137.201-001.

  Estando a aeronave com o CA em situação “Normal”, o voo de experiência após manutenção poderá
  ser realizado sem a necessidade de emissão de AEV, devendo ser mantidas as condições de
  operação estabelecidas na seção 91.407 do RBAC n° 91.

  O propósito “evacuação da aeronave de áreas perigosas” tem por objetivo permitir a realização
  de voo de uma aeronave em situação não-aeronavegável quando a operação for necessária para
  resguardar vidas e bens que se encontrem em situação de risco de integridade. Como exemplo,
  podemos citar riscos associados a enchentes, incêndios, conflitos armados, ações das forças
  de segurança pública, entre outras situações possíveis. Nesses casos, após a emissão da
  AEV, o voo deve ser realizado com discernimento e cautela, e ocorrerá por conta e risco
  do operador da aeronave e da tripulação.


  Solicitação da AEV

  As solicitações devem ser apresentadas por meio do Sistema Eletrônico de Solicitação de
  Autorização Especial de Voo - eAEV (com exceção das solicitações de AEV etanol, as quais
  atualmente são feitas pelo Sistema Eletrônico de Informações - SEI!, vide item 5.4.3) ou,
  em casos excepcionais, serem protocoladas por meio do sistema SEI!.

  Nota: o sistema eAEV é uma ferramenta desenvolvida pela Anac que acelera as etapas de solicitação,
  análise e emissão da AEV, devendo ser utilizado sempre que possível visando o princípio
  da eficiência e da economicidade. O sistema pode ser acessado a partir do endereço: https://sistemas.anac.gov.br/eAEV

  A solicitação deve ser encaminhada à Anac no mínimo 5 (cinco) dias úteis antes da data do
  início pretendido do voo, embora uma antecedência maior seja recomendada, considerando que
  a duração do processo pode variar significativamente conforme a complexidade da solicitação
  e conforme a capacidade do requerente em demonstrar satisfatoriamente o cumprimento dos
  requisitos estabelecidos pela Anac.

  A seguinte documentação deve ser apresentada à Anac para fins de obtenção de uma AEV:

  formulário de solicitação devidamente preenchido e assinado, para o propósito ao qual o
  voo se destina: Autorização Especial de Voo Nacional - AEVN (F-245-10_1), Autorização Especial
  de Voo Internacional - AEVI de aeronave nova de fábrica (F-245-10_2), AEVI de aeronave usada
  (F-245-10_3) ou AEV Etanol (F-245-13);

  Nota 1: nos processos apresentados via sistema eAEV, o preenchimento do(s) formulário(s)
  é feito diretamente no sistema.

  Nota 2: quando o sistema eAEV não for utilizado, os formulários a serem utilizados estão
  disponíveis no sistema SEI!, em formato digital para preenchimento diretamente no sistema.
  Há também versão em formato Word (.docx) disponível na página de “Formulários Padronizados”
  da Anac em: https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-manutencao/formularios-padronizados

  comprovante de pagamento da Taxa de Fiscalização da Aviação Civil - TFAC referente à solicitação,
  exceto para as solicitações de voo de experiência, ou voo de teste para cumprimento de requisito;

  Nota: para os processos apresentados via sistema eAEV, o sistema reconhece automaticamente
  o pagamento da TFAC emitida ao final do cadastro da solicitação, não sendo necessária a
  apresentação do comprovante no processo.

  os documentos previstos nos itens 5.4.8, ou 5.4.9, conforme o caso específico; e

  para as solicitações apresentadas por Mecânico de Manutenção Aeronáutica - MMA, conforme
  previsto no item 5.5.2 desta IS, deverá ser apresentado o relatório de inspeção, previsto
  em 5.5.11 desta IS, em substituição à informação do número da ordem de serviço no formulário
  de solicitação.

  No desempenho do ato discricionário, a Anac poderá exigir documentos ou que sejam realizadas
  inspeções e ensaios adicionais que se entendam necessários à garantia da segurança do voo,
  conforme previsto nos parágrafos 21.199(a)(6) e (b) do RBAC n° 21. Poderá ainda, determinar
  a realização de inspeção na aeronave conforme previsto no parágrafo 21.181(b) do RBAC n°
  21 antes da decisão de deferimento ou de indeferimento da solicitação.

  Somente solicitações protocoladas pelo proprietário (ou arrendatário) ou operador da aeronave
  ou por seus representantes legais, devidamente identificados como tais no processo, ou ainda
  por Organização de Manutenção certificada pelo nº RBAC 145, serão elegíveis para análise.

  Nos casos em que o pagamento da TFAC for requerido, as solicitações somente serão analisadas
  após a comprovação do pagamento.

  Para fins de cumprimento com o parágrafo 21.199(a) do RBAC nº 21, considera-se que:

  a informação da rota proposta (21.199(a)(2)) é composta pela origem e destino do voo sob
  AEV, devendo o operador atender ainda aos demais critérios desta IS a respeito da rota,
  como os dos itens 5.6.7 e 5.7.1(g); e

  quanto à informação da tripulação necessária para operar a aeronave e seus equipamentos
  (21.199(a)(3)), assume-se, por padrão, que é requerido pelo menos a tripulação mínima estabelecida
  para a aeronave, conforme o CA (caso aplicável); a Especificação de Aeronave - EA ou, no
  caso das aeronaves isentas de certificação no Brasil, o Type Certificate Data Sheet - TCDS
  emitido pela autoridade primária responsável pelo projeto de tipo do modelo; e os requisitos
  operacionais aplicáveis, como o RBAC nº 91. O solicitante deve informar caso pretenda utilizar
  tripulante (ou pessoal de manutenção necessário a bordo) adicional. A Anac pode vir a estabelecer,
  no AEV, requisito adicional referente à tripulação mínima.


  Aeronaves com reservas de marcas brasileiras

  Para aeronaves usadas adquiridas no exterior, deve ser apresentada a documentação descrita
  em 5.4.3(a) e (b), acrescida dos seguintes documentos:

  cópia do Certificado de Aeronavegabilidade para Exportação - CAE, ou documento equivalente,
  emitido pela autoridade de aviação civil do país exportador da aeronave;

  cópia da declaração de desregistro ou de não registro da aeronave, ou documento equivalente,
  emitido pela autoridade de aviação civil do país exportador da aeronave;

  cópia da apólice ou certificado de seguro Responsabilidade Civil do Explorador ou Transportador
  Aéreo - RETA com o respectivo comprovante de pagamento e em conformidade com a Resolução
  Anac n° 293/2013; e

  para as solicitações que não tenham fornecido as informações de nome do fabricante, modelo,
  número de série e nome do operador quando efetuada a reserva de marcas, estas informações
  deverão ser apresentadas quando da solicitação da AEVI.

  Para aeronaves novas saindo da fábrica, adquiridas no exterior e que possuam reserva de
  marcas, deve ser apresentada a documentação descrita em 5.4.3(a) e (b), acrescida dos seguintes
  documentos:

  cópia da apólice ou certificado de seguro RETA com o respectivo comprovante de pagamento
  e em conformidade com a Resolução Anac n° 293/2013;

  para solicitação apresentada por representante legal, cópia de procuração, emitida pelo
  proprietário (ou arrendatário) ou operador atribuindo poderes ao solicitante da AEV para
  representá-lo perante a Anac; e

  para as solicitações que não tenham fornecido as informações de Peso Máximo de Decolagem
  - PMD, número de assentos de passageiros, tripulação mínima e ano de fabricação da aeronave
  quando efetuaram a reserva de marcas, essas informações deverão ser apresentadas quando
  da solicitação da AEVI.

  Nota: para a finalidade de emissão de AEV, considera-se que uma aeronave é nova saindo de
  fábrica na ocasião em que é entregue diretamente pelo fabricante para o operador na unidade
  fabril onde teve seu processo de montagem finalizado.

  Para aeronave em processo de importação, a AEV emitida somente será considerada válida se
  mantiver em anexo cópia do CAE, declaração de desregistro ou não registro das marcas estrangeiras,
  ou documentos equivalentes, emitidos pela Autoridade de Aviação Civil Estrangeira, e cópia
  da apólice ou certificado de seguro RETA com o respectivo comprovante de pagamento.

  Para aeronaves novas adquiridas no exterior, montadas em território brasileiro após transporte,
  que possuam reserva de marcas e estejam solicitando AEVN, deve ser apresentada a documentação
  descrita em 5.4.3(a) e (b), acrescida dos seguintes documentos:

  cópia do CAE, ou documento equivalente, emitido pela autoridade de aviação civil do país
  exportador da aeronave;

  cópia da declaração de desregistro ou de não registro da aeronave, ou documento equivalente,
  emitido pela autoridade de aviação civil do país exportador da aeronave;

  cópia da apólice ou certificado de seguro RETA com o respectivo comprovante de pagamento
  e em conformidade com a Resolução Anac n° 293/2013; e

  para as solicitações que não tenham fornecido as informações de PMD, número de assentos
  de passageiros, tripulação mínima e ano de fabricação da aeronave quando efetuada a reserva
  de marcas, essas informações deverão ser apresentadas quando da solicitação da AEVI.


  Aeronaves registradas no Brasil

  Para aeronaves registradas no Brasil, deve ser apresentada a documentação listada abaixo
  conforme a situação do CA e/ou conforme situação específica:

  para aeronaves com o CA suspenso pelo código 8 (CA suspenso por vencimento do CVA), deve
  ser apresentada apenas a documentação descrita em 5.4.3(a) e (b) desta IS;

  para aeronaves com o CA suspenso pelos códigos 6 (situação técnica irregular) ou 7 (NCIA),
  devem ser apresentadas a documentação descrita em 5.4.3(a) e (b) desta IS e a documentação
  que comprove a correção das não conformidades críticas, consideradas impeditivas para a
  realização do voo, que motivaram a suspensão do CA;

  para aeronaves com o CA suspenso pelo código 3 (pendências judiciais ou administrativas),
  devem ser apresentadas a documentação descrita em 5.4.3(a) e (b) desta IS e a documentação
  emitida pelo órgão que solicitou a suspensão comprovando a regularização da pendência judicial
  ou autorizando a concessão do voo;

  para aeronaves com o CA suspenso pelo código 4 (situação irregular no Registro Aeronáutico
  Brasileiro), deve ser apresentada apenas a documentação descrita em 5.4.3(a) e (b) desta
  IS;

  para aeronaves com o CA cancelado por qualquer código, deve ser apresentada a documentação
  descrita em 5.4.3(a) e (b), acrescida de:

  I - documentação prevista em 5.4.9.1 referente ao código do cancelamento do CA;

  II - fotos nítidas da aeronave mostrando seu exterior e interior, incluindo painel de instrumentos,
  motor(es) com seus componentes, hélice(s), trens de pouso com sistemas de freios e pneus,
  superfícies de comando e as laterais da aeronave; e

  III - cópia da ordem de serviço onde foi registrada a inspeção realizada na aeronave;

  para aeronaves com o CA suspenso pelo código 1 (aeronave envolvida em incidente/acidente):

  I - para translado da aeronave para uma base onde os reparos definitivos serão realizados,
  após o cumprimento das exigências relativas ao Sistema de Investigação e Prevenção de Acidentes
  Aeronáuticos - SIPAER (Norma de Sistema do Comando da Aeronáutica - NSCA 3-13), o translado
  deve ser solicitado à Anac pela organização certificada que executou os serviços de emergência
  necessários para que a aeronave tenha condições mínimas de segurança no voo. A solicitação
  deve conter a documentação descrita em 5.4.3(a) e (b) desta IS e a cópia dos registros primários
  em caderneta ou cópia da ordem de serviço que comprove a execução dos reparos efetuados,
  juntamente com a informação sobre possíveis restrições operacionais para o voo em questão;
  e

  II - para voos de experiência após a conclusão dos reparos definitivos na aeronave, deve
  ser apresentada apenas a documentação descrita em 5.4.3(a) e (b) desta IS;

  para aeronaves de origem militar ou adquiridas em hasta pública, deve ser apresentada a
  documentação descrita em 5.4.3(a) e (b) desta IS, acrescida de:

  I - fotos nítidas da aeronave mostrando seu exterior e interior, incluindo painel de instrumentos,
  motor(es) com seus componentes, hélice(s), trens de pouso com sistemas de freios e pneus,
  superfícies de comando e as laterais da aeronave; e

  II - cópia da ordem de serviço onde foi registrada a inspeção realizada na aeronave;

  para aeronaves que, em decorrência de processo administrativo ou judicial, estejam entregues
  em custódia, guarda ou depósito, devem ser apresentadas a documentação descrita em 5.4.3(a)
  e (b) desta IS e a cópia da decisão judicial de concessão de guarda, custódia ou depósito
  ao operador da aeronave, acrescentando tal informação na solicitação de AEV; e

  para aeronaves operando com etanol de acordo com a IS n° 137.201-001, a solicitação de AEV
  deve ser feita apresentando-se a documentação indicada nos itens 5.4.3(a) e (b) desta IS,
  juntamente com uma cópia do registro de grande modificação incorporada na aeronave (formulário
  F-400-04) conforme previsto na IS n° 137.201-001.

  Nota: caso a aeronave esteja com o CA suspenso ou cancelado por dois ou mais códigos ou
  que se enquadre em mais do que uma das condições listadas acima, deve ser apresentada a
  documentação requerida para cada um dos códigos presentes conforme informações acima.


  Avaliação de condição segura para a realização do voo

  A avaliação de condição segura para a realização do voo é obrigatória em todas as solicitações
  de AEVN, AEVI de aeronaves usadas e AEV etanol, e deve ser assinada por:

  Responsável Técnico de organização de manutenção certificada sob o RBAC n° 145, Diretor
  de Manutenção ou Inspetor Chefe (quando aplicável) de operador aéreo que opere sob RBAC
  n° 121 ou 135 que:

  I - possua o modelo da aeronave em suas Especificações Operativas - EO ou possua uma autorização,
  excepcional ou expedita, emitida pela Anac, (tanto para organizações de manutenção certificadas
  sob o RBAC n° 145 quanto para operadores aéreos certificados sob o RBAC nº 121 ou 135);
  e

  II - possua sede no local onde a aeronave se encontra, ou possua autorização emitida pela
  Anac para realização de serviço fora de sua sede, ou tenha em seu Manual da Organização
  de Manutenção - MOM, Manual de Controle da Qualidade - MCQ ou Manual Geral de Manutenção
  - MGM, conforme aplicável, um procedimento aceito para realizar serviços fora de sua sede
  sem autorização prévia; ou

  Nota: Diretor de Manutenção ou Inspetor Chefe de operador aéreo sob RBAC n° 121 ou 135 somente
  podem apresentar solicitações para as aeronaves das quais a organização que representam
  é a proprietária (ou arrendadora) ou operadora, sendo indeferida qualquer solicitação que
  não atenda a este critério.

  pessoa designada por Responsável Técnico de organização de manutenção certificada sob RBAC
  n° 145 ou por Diretor de Manutenção de operador aéreo que opere sob o RBAC n° 121 ou 135,
  cadastrada no sistema eAEV para apresentação de solicitações. As solicitações apresentadas
  por estas pessoas são de responsabilidade do Responsável Técnico, da organização certificada
  conforme o RBAC nº 145, ou do Diretor de Manutenção, no caso das organizações certificadas
  segundo os RBAC nº 121 ou 135, ocupante do cargo quando a solicitação foi cadastrada no
  sistema.

  Alternativamente ao previsto no item 5.5.1, e sujeito às limitações do item 5.5.2.1, um
  MMA poderá assinar a avaliação de condição segura para a realização do voo e apresentar
  uma solicitação de AEV à Anac desde que:

  possua habilitações Anac válidas em célula e grupo motopropulsor;

  possua conhecimento técnico em aeronaves com o mesmo tipo de motorização e complexidade
  da aeronave objeto da solicitação;

  a aeronave objeto da solicitação de AEV possua PMD inferior a 5670 Kg, motor convencional
  e seja certificada na categoria Normal, Restrita ou Primária;

  a aeronave objeto da solicitação de AEV não esteja vinculada a uma organização que opere
  segundo o RBAC nº 121 ou nº 135;

  a inspeção necessária para garantir a segurança do voo tenha uma complexidade compatível
  com as limitações do item 43.7(b)-I do RBAC nº 43;

  possua acesso aos dados técnicos necessários, como, por exemplo, ao manual de manutenção
  e ao manual de voo da aeronave;

  a inspeção tenha sido realizada em período inferior a 30 dias da data pretendida para o
  início do voo; e

  possua procuração, emitida pelo proprietário (ou arrendatário) ou operador da aeronave,
  atribuindo-lhe poderes para representá-lo perante a Anac.

  Nota: a limitação imposta pelo item 5.5.2(c), acima, não se aplica a:'
