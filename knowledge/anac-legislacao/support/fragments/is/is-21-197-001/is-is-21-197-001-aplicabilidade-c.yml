cite: aplicabilidade(c)
title: aplicabilidade(c)
text: 'c) aeronaves a serviço de entidades da Administração Federal, Estadual, Municipal ou
  do Distrito Federal.

  O item 5.5.2 aplica-se somente aos seguintes propósitos de voo e aeronaves com o código
  do CA nas seguintes situações:

  propósitos de voo: conforme listado em 5.3.1(a) a (f) (ou seja, todos exceto AEV Etanol);
  e

  código de situação do CA:

  I - R - Aeronave com Reserva de Marcas;

  II - S - CA Suspenso, por código:

  1) 3 - Aeronave com pendências judiciais;

  2) 4 - Situação Irregular no Registro Aeronáutico Brasileiro - RAB; ou

  3) 8 - CVA vencido; ou

  III - N - Situação normal do CA.

  Para as solicitações apresentadas por organizações de manutenção certificadas pela Anac
  localizadas fora do Brasil, a avaliação de condição segura para a realização do voo deve
  ser preenchida e assinada pela pessoa designada para responder tecnicamente pela organização
  de manutenção perante a Anac ou por alguém oficialmente designado pelo gestor responsável.

  O preenchimento da avaliação de condição segura da aeronave é condicionado à realização
  de uma inspeção criteriosa na aeronave e em sua documentação técnica, independentemente
  de onde a aeronave esteja localizada, no Brasil ou no exterior. A inspeção deverá ser realizada
  em data com um máximo de 30 dias de antecedência do início do período pretendido para o
  voo e deverá ser registrada em ordem de serviço da organização, contendo a descrição detalhada
  da inspeção executada na aeronave e em sua documentação, manutenções que foram executadas
  para colocar a aeronave em condição segura para a realização do voo, os itens que foram
  identificados como vencidos ou não cumpridos do programa de manutenção, diretrizes de aeronavegabilidade
  não cumpridas mas que não afetam a segurança do voo, bem como itens que estejam inoperantes.
  O número da ordem de serviço deverá ser informado no campo específico do formulário de solicitação.

  Com base no parágrafo 21.199(b) do RBAC nº 21, a Anac determina que o requerente de uma
  solicitação de AEV será o responsável pela realização das inspeções e os ensaios necessários
  à segurança da aeronave para a realização do voo, exceto situações excepcionais onde for
  verificada a necessidade de realização da inspeção por servidores da Anac, situação na qual
  o requerente será informado.

  Uma AEV somente poderá ser emitida após a comprovação, por parte do requerente, de que a
  aeronave possui condição segura para a realização do voo.

  Deverá ser incluído no diário de bordo da aeronave um relatório informando a tripulação
  que efetuará o voo com a AEV, sobre todos os itens que foram constatados como vencidos ou
  não cumpridos do programa de manutenção, diretrizes de aeronavegabilidade não cumpridas
  que não afetam a segurança do voo, bem como itens que estejam inoperantes.

  A inspeção poderá ser registrada na ordem de serviço onde foi ou será registrada a manutenção
  executada na aeronave, seguindo o previsto no manual da organização, não sendo necessária
  a abertura de uma ordem de serviço específica para a inspeção da avaliação de condição segura
  da aeronave.

  A Anac poderá a qualquer momento solicitar a apresentação de cópia da ordem de serviço ou
  relatório de inspeção onde foi registrada a inspeção realizada na aeronave para fins de
  fiscalização.

  Nos casos de aeronaves adquiridas em hasta pública ou apreendidas, quando normalmente não
  se tem acesso às documentações e registros de manutenção (geralmente trazendo risco à operação),
  o requerente de uma AEV deverá realizar uma inspeção física mais detalhada na aeronave realizando
  o máximo possível de verificações operacionais a fim de minimizar os riscos, além de informar
  o fato à Anac no ato da solicitação da AEV.

  Nas solicitações apresentadas por MMA, conforme previsto no item 5.5.2 desta IS, o registro
  da inspeção da aeronave em ordem de serviço conforme previsto acima, deverá ser substituído
  por um relatório de inspeção preenchido e assinado pelo MMA solicitante da AEV. O relatório
  deverá conter as mesmas informações constantes na ordem de serviço, conforme item 5.5.4
  e deverá ser anexado ao processo de solicitação da AEV.

  A inspeção física da aeronave deverá ser realizada por MMA com habilitações válidas em célula
  e grupo motopropulsor, podendo ser funcionário da organização ou contratado exclusivamente
  para a execução da inspeção. No caso de contratação de serviços, o MMA deverá possuir vínculo
  contratual com a organização que vai apresentar a declaração de condição segura de voo e
  demonstrar capacitação no modelo da aeronave na qual irá realizar a inspeção. A inspeção
  deverá ser executada conforme os procedimentos previstos no Manual da Organização de Manutenção,
  ou no Manual Geral de Manutenção, conforme o caso.

  Para aeronaves usadas, em processo de importação, o CAE poderá substituir a inspeção física
  da aeronave e o preenchimento da avaliação de condição segura para realização do voo poderá
  ser feito com base no CAE, desde que tenha sido emitido há no máximo 30 (trinta) dias da
  data pretendida para o início do voo.

  Nota: o CAE substitui somente a inspeção física na aeronave, devendo o responsável pela
  avaliação de condição segura para a realização do voo verificar a documentação da aeronave,
  incluindo o CAE e seguro RETA, para verificar se estão conforme o requerido nos normativos.

  A Anac não estabelece um roteiro especificando o que deve ser inspecionado na aeronave a
  fim de garantir a condição segura para a realização do voo devido à grande diversidade de
  modelos de aeronaves e sistemas que cada uma possui, mas recomenda-se que a inspeção na
  aeronave abranja no mínimo os seguintes itens:

  verificação dos registros de manutenção quanto ao cumprimento do programa de manutenção
  aplicável à aeronave, para determinar a necessidade ou não de execução de alguma tarefa
  antes do translado;

  verificação dos registros de manutenção quanto ao cumprimento das diretrizes de aeronavegabilidade
  aplicáveis à aeronave (ou diretrizes de segurança, no caso de aeronave leve esportiva),
  para determinar a necessidade ou não de execução de alguma tarefa antes do translado;

  verificação dos registros de manutenção quanto ao cumprimento das tarefas de manutenção
  do sistema Pitot/estática, altímetros, transponders, VOR e ELT, e outros equipamentos conforme
  aplicável, para determinar se a aeronave poderá ou não efetuar voo IFR;

  verificação da documentação de porte obrigatório;

  verificação da condição geral da aeronave;

  verificação da condição de armazenamento durante o período de inatividade, caso aplicável,
  e quanto aos registros e cumprimento do previsto nos manuais de manutenção;

  verificação da condição e de eventual necessidade de troca dos fluidos da aeronave, em especial
  fluidos do motor, antes do translado (alguns fluidos da aeronave possuem validade e podem
  não estar mais em condição de uso devido ao tempo que a aeronave permaneceu parada ou devido
  ao local e forma de armazenamento);

  verificação da necessidade da drenagem total do combustível remanescente nos tanques, linhas
  de combustível e filtros, o qual devido à ação do tempo, pode estar deteriorado/contaminado
  e causar entupimentos no sistema e a consequente falha do motor em voo;

  testes operacionais de todos os sistemas da aeronave quanto ao seu correto funcionamento,
  como por exemplo, equipamentos aviônicos, flaps, alarme de estol, sistemas de antigelo e
  degelo, entre outros conforme aplicável ao modelo da aeronave;

  teste operacional do motor e nos casos aplicáveis, hélice, governador de hélice ou sistemas
  de rotores; e

  teste operacional dos sistemas de comandos de voo.

  Nota: recomenda-se o uso da lista de verificação do formulário de CVA, formulário F-145-27
  disponível no endereço eletrônico https://www.gov.br/anac/pt-br/assuntos/regulados/organizacoes-de-manutencao/formularios-padronizados,
  como base para a verificação da condição da aeronave.

  A organização solicitante da AEV deverá manter, anexada à ordem de serviço da avaliação
  de condição segura para a realização do voo, cópias dos registros de preservação da aeronave,
  caso a aeronave tenha permanecido inativa.

  Nota: É importante destacar que o solicitante assume responsabilidade perante a lei sobre
  a inspeção conduzida ao atestar a condição segura da aeronave para a realização do voo,
  podendo responder pelas sanções previstas nas esferas civil, penal e administrativa em caso
  de constatação de irregularidades cometidas, acidente, ou incidente na operação autorizada.


  Autorização

  Uma vez que o solicitante tenha enviado todos os documentos necessários ao processo, após
  a análise e aprovação, a AEV é emitida pela Anac em formato eletrônico.

  As AEV serão emitidas com o prazo de validade máxima para realização do voo de até 30 (trinta)
  dias corridos, respeitando o período solicitado pelo requerente (desde que dentro desse
  limite).

  A AEV normalmente não é aplicável para aeronaves que estejam com o CA em condição normal
  no sistema da Anac. Contudo, caso exista alguma discrepância que a torne não aeronavegável,
  mesmo estando com a situação do CA normal no sistema da Anac, e por esta razão necessite
  de uma AEV, a discrepância deverá ser informada na solicitação de AEV.

  Exceto para as AEV emitidas para voo de experiência, voo de teste ou para o uso de etanol
  em aeronaves aeroagrícolas, todas as demais autorizações serão válidas para a execução de
  um único translado, do local informado como sendo aeródromo de início do voo ao local indicado
  como sendo o aeródromo de término do voo, perdendo sua validade assim que a aeronave chegar
  ao seu destino, independentemente do período de validade da autorização, pois a aeronave
  já cumpriu o propósito de voo e a rota solicitada e autorizada pela Anac.

  A AEV emitida para voo de experiência ou voo de teste terá a validade de até 30 dias corridos,
  podendo o solicitante efetuar mais de um voo dentro do período especificado, a fim de checar
  as condições da aeronave, desde que dentro desse propósito de voo. A AEV emitida segundo
  esses propósitos não pode ser utilizada para outros fins.

  Para voos internacionais com AEV emitidas pela Anac, é de responsabilidade do operador obter,
  antes do início do voo, autorização das Autoridades de Aviação Civil dos países a serem
  sobrevoados ao longo da rota, conforme previsto no item 5.3.2 do Doc 9760 da OACI, sendo
  que o voo deverá atender, além do RBAC nº 91, as regras de operação da Autoridade de Aviação
  Civil do país a ser sobrevoado ao longo da rota, conforme seção 91.703 daquele RBAC.

  Uma AEV é emitida com a indicação do aeródromo de início e término do voo. A rota que será
  utilizada fica a critério do operador, restrita ao deslocamento mínimo necessário, utilizando-se
  a rota mais curta e direta possível para que a aeronave chegue até a localidade de destino.
  O operador deverá definir a rota tomando por base a necessidade de paradas técnicas e o
  aeródromo internacional para a entrada ou saída do país.

  Nos translados internacionais, onde houver a necessidade da realização de procedimentos
  aduaneiros junto à Receita Federal, o deslocamento para o local da vistoria pela Receita
  é permitido durante o translado com a autorização emitida, desde que a aeronave não pouse
  no local informado como sendo o aeródromo de término do voo e a autorização ainda esteja
  dentro do período de validade.

  A tripulação deverá obedecer a todas as condições, restrições e limitações descritas na
  autorização e nesta IS durante o voo.

  Uma AEV emitida poderá ser suspensa ou revogada, visando a segurança de voo, sem prévio
  aviso, caso seja constatada qualquer irregularidade na sua emissão ou utilização, sem prejuízo
  das sanções administrativas ou legais previstas ou ações penais cabíveis.

  Uma AEV poderá ser retificada somente se cumprir com as seguintes condições:

  a autorização previamente emitida ainda estiver dentro do prazo de validade;

  somente se for alteração de aeródromo de destino, extensão de período de validade, inclusão
  de tripulante adicional/pessoal de manutenção necessário a bordo durante o voo, inclusão
  de limitação/restrição operacional definida pelo solicitante ou correção de erro no momento
  da emissão da autorização;

  Nota: A extensão de período de validade poderá ser realizada uma única vez, sendo concedido
  no máximo 15 dias de extensão.

  for apresentada no processo justificativa comprovando a necessidade da alteração;

  o tempo decorrido desde a inspeção da aeronave para a avaliação da condição segura até a
  data final para a realização do voo não poderá exceder 60 dias; e

  for apresentada declaração de que não houve vencimento de novas tarefas de manutenção desde
  a realização da inspeção na aeronave.


  Condições, restrições e limitações para operação com uma AEV, exceto AEV etanol

  Os voos efetuados com uma AEV somente serão permitidos considerando as seguintes condições
  e limitações:

  para voos nacionais (AEVN), está autorizado somente voo VFR diurno, exceto quando o voo
  IFR for expressamente autorizado mediante a comprovação de que a aeronave possui capacidade
  técnica e que a verificação operacional dos instrumentos requeridos pelo RBAC n° 91 para
  este tipo de voo está em dia;

  para translados internacionais, os voos IFR são autorizados, desde que a aeronave possua
  capacidade técnica e que a verificação operacional dos instrumentos requeridos pelo RBAC
  n° 91 para este tipo de voo esteja em dia;

  nos voos efetuados com uma AEV, é expressamente proibido o transporte de passageiros e/ou
  cargas. O voo deve ser realizado somente com a tripulação mínima prevista para a operação
  da aeronave (vide 5.4.7(b) desta IS). Outros profissionais poderão ser autorizados pela
  Anac no acompanhamento do voo desde que essa necessidade seja devidamente justificada. Exceção
  quanto à limitação presente nesta alínea está indicada no item 5.7.3 desta IS;

  para aeronaves com o CA suspenso pelo código 1 (aeronave envolvida em incidente/acidente),
  o translado somente será permitido nas seguintes condições:

  I - voo VFR diurno, exceto quando o voo sob regras IFR for expressamente autorizado;

  II - tripulação mínima prevista na EA ou Certificado de Tipo do modelo da aeronave, exceto
  se de outra forma autorizado pela Anac; e

  III - voo sem carga ou passageiros, exceto pelo MMA detentor de licença emitida pela Anac
  responsável pelos reparos de emergência;

  para voos de experiência (incluindo, voos em que atividades de manutenção serão executadas),
  o voo deve ser realizado com a tripulação mínima requerida (conforme 5.4.7(b) desta IS)
  e, caso necessário, com um número mínimo de profissionais da área de manutenção necessários
  à condução adequada do propósito a ser realizado em voo, sem carga ou passageiros a bordo,
  a menos que de outra forma autorizado pela Anac;

  a aeronave deverá estar identificada com as marcas de nacionalidade e matrícula brasileiras,
  de acordo com o previsto no RBAC n° 45;

  o voo deve ser conduzido de modo a evitar áreas de tráfego aéreo intenso ou que possa expor
  pessoas ou bens em solo ao risco, sendo o operador responsável pela determinação da rota
  e pistas de pouso e decolagem a serem utilizadas, considerando que nas AEVI o aeródromo
  de entrada ou saída do país deverá ser um aeródromo internacional;

  somente o operador, em nome do qual a AEV for emitida, ou pessoa autorizada por ele, poderão
  realizar os voos autorizados;

  a aeronave deverá possuir cobertura de seguro de responsabilidade civil nas classes aplicáveis
  à sua configuração e operação neste voo, com validade suficiente para o período pretendido
  à realização do voo, atendendo à Resolução Anac n° 293/2013. Não serão aceitos declaração
  ou proposta de seguro aeronáutico;

  uma cópia da AEV emitida deverá estar a bordo da aeronave, em formato físico ou digital,
  durante todo o percurso do voo a ser realizado e disponível para as fiscalizações que se
  façam necessárias, não sendo permitida nenhuma rasura, dano ou alteração que impeçam a sua
  perfeita leitura;

  a aeronave para a qual a AEV tenha sido emitida não satisfaz os padrões de aeronavegabilidade
  prescritos no Anexo 8 da Convenção sobre Aviação Civil Internacional. Portanto, não são
  autorizados voos em outros países a menos que especificamente permitidos pelas autoridades
  de aviação civil dos países a serem sobrevoados;

  para os propósitos exclusivamente de voo de experiência ou voo de teste, o voo deve ser
  realizado em período diurno em condições Visual Flight Rules - VFR, dentro de uma Área de
  Controle Terminal - TMA, ou, se não houver TMA, num raio máximo de 100 km, com pouso no
  mesmo aeródromo de partida;

  a tripulação deverá cumprir os requisitos estabelecidos pelo RBAC n° 61, incluindo a proficiência
  linguística aplicável à rota, e possuir os certificados e licenças apropriados, emitidos
  ou validados pela Anac, devendo conduzir o voo em consonância com as limitações operacionais
  previstas no Manual de Voo da aeronave, sendo do operador a responsabilidade da escolha
  da tripulação;

  a AEV possui caráter técnico com foco na condição de aeronavegabilidade da aeronave e não
  autoriza a sua operação em aeródromos interditados, suspensos ou com restrição de pouso
  ou decolagem, sendo de responsabilidade do piloto em comando a verificação, antes do início
  do voo, da regularidade dos aeródromos a serem utilizados; e

  a AEV não autoriza tipos de operações para as quais a aeronave/operador não possuam autorização
  prévia (IFR, RVSM, ETOPS etc.).

  Caso julgue necessário, a Anac poderá estabelecer condições ou limitações adicionais àqueles
  presentes no item 5.7.1 desta IS, visando a operação segura da aeronave.

  O item 5.7.1(c) não se aplica aos voos de translado de aeronaves novas saindo da fábrica
  ou aeronaves usadas em processo de importação. Nesses casos, caberá ao operador determinar
  se a aeronave poderá ou não transportar cargas ou passageiros, considerando os seguintes
  critérios:

  para determinar se poderá ou não transportar passageiros e/ou cargas, o operador deverá
  verificar a situação técnica da aeronave. Caso ela possua alguma exceção listada em seu
  CAE, tenha algum item de seu programa de manutenção vencido ou não cumprido, ou qualquer
  não conformidade técnica que inviabilize a operação dentro do seu envelope, o transporte
  de passageiros e/ou cargas não é permitido; e

  Nota: o transporte de passageiros e/ou cargas, caso se determine que possa ser realizado
  no voo de translado, não poderá de forma alguma ser remunerado, sendo exclusivamente de
  caráter privado, seguindo as regras do RBAC nº 91. Os passageiros devem ser informados da
  natureza e das condições de voo.

  para os casos em que forem listadas restrições ou limitações no campo observações da AEVI,
  estas deverão ser cumpridas conforme descritas.


  Condições, restrições e limitações para operação com uma AEV Etanol

  A AEV etanol é uma espécie de certificado de aeronavegabilidade especial e substitui o CA
  padrão da aeronave. Essa AEV é emitida para o propósito estabelecido no parágrafo 137.201(e)
  do RBAC n° 137.

  A AEV emitida para aeronaves operadas com etanol não terá prazo de validade estabelecido,
  estando válida enquanto a aeronave satisfizer as condições previstas na IS n° 137.201-001.

  A AEV etanol emitida somente será considerada válida se acompanhada de CVA válido. Da mesma
  forma que o CA da aeronave não etanol é controlado no Sistema de Aviação Civil - SACI por
  meio do Código de Situação do CA (recebendo os status “normal”, “suspenso”, “cancelado”,
  entre outros), aeronaves com AEV etanol também são controladas em sistema por esse mesmo
  código, que é utilizado pelo Departamento de Controle do Espaço Aéreo - DECEA para a autorização
  de planos de voo, por exemplo. Logo, a aeronave etanol não pode operar a menos que possua
  uma AEV etanol, o CVA válido e a situação normal no SACI.

  Somente o operador, em nome do qual a AEV for emitida, ou pessoa autorizada por ele, poderão
  realizar os voos autorizados.

  A AEV etanol é emitida para o conjunto célula, motor e operador informados na ocasião da
  solicitação. Caso o motor instalado na aeronave seja substituído, mesmo que por outro de
  mesmo fabricante e modelo, a AEV etanol perderá imediatamente sua validade, sendo necessária
  a apresentação de nova solicitação de AEV.

  Para os casos de mudança do operador, a AEV também perderá sua validade imediatamente após
  a alteração. Deverá ser apresentado no processo de alteração do operador junto ao RAB comprovante
  de recolhimento da TFAC correspondente à emissão da nova AEV etanol, pois, após efetuar
  a alteração do operador, o RAB encaminhará o processo para a gerência competente para a
  emissão da nova AEV etanol. Ou seja, para poder operar, o novo operador deverá aguardar
  a emissão de um novo AEV etanol no seu nome.

  A tripulação deverá cumprir os requisitos estabelecidos pelo RBAC n° 61, incluindo a proficiência
  linguística aplicável à rota, e possuir os certificados e licenças apropriados, emitidos
  ou validados pela Anac, devendo conduzir o voo em consonância com as limitações operacionais
  previstas no Manual de Voo da aeronave, sendo do operador a responsabilidade da escolha
  da tripulação.

  A aeronave deverá possuir cobertura de seguro de responsabilidade civil nas classes aplicáveis
  à sua configuração e operação neste voo, com validade suficiente para o período pretendido
  à realização do voo, atendendo à Resolução Anac n° 293/2013. Não serão aceitos declaração
  ou proposta de seguro aeronáutico.

  A aeronave deverá estar identificada com as marcas de nacionalidade e matrícula brasileiras,
  de acordo com o previsto no RBAC n° 45.

  As aeronaves operando com AEV etanol não são autorizadas a realizar voos em outros países
  a menos que especificamente permitidas pela autoridade de aviação civil do país a ser sobrevoado.

  Além da submissão às limitações operacionais prescritas pela seção 91.313 do RBAC n° 91,
  uma aeronave operando com uma AEV etanol não poderá operar sobre áreas densamente povoadas,
  nem mesmo com o propósito de controle de vetores, conforme previsto pela seção 137.211 do
  RBAC n° 137, sendo do operador a responsabilidade da escolha da rota e pista de pouso e
  decolagem a serem utilizadas.

  APÊNDICES - N/A'
