text: 'Objetivo

  Esta Instrução Suplementar - IS estabelece os procedimentos para solicitação e emissão de
  uma Autorização Especial de Voo - AEV para as situações previstas nos parágrafos 21.197(a)(1)
  e 21.197(a)(4) do RBAC nº 21, no parágrafo 137.201(e) do RBAC nº 137 e na seção 91.407 do
  RBAC nº 91.'
