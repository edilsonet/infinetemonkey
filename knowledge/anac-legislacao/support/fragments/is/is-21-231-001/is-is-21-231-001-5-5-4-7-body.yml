text: '5.5.4.7

  Inclusão de novas alíneas (b) e (c), referentes à classificação de modificações aos FCD
  e à MMEL, respectivamente, e novas alíneas (e) e (f), referentes à aprovação de tais modificações.

  Renumeração das demais alíneas em função da inclusão.


  5.5.4.7(g)(II)(ii), antigo 5.5.4.7(c)(II)(ii)

  Inclusão de referência aos OSD.

  5.5.4.7(h)(I)(ii), antigo 5.5.4.7(d)(I)(ii)

  Atualização da referências cruzada a alínea do item 5.5.7.4.'
