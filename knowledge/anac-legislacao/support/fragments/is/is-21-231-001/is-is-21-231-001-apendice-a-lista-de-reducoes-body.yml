text: 'APÊNDICE A - LISTA DE REDUÇÕES

  A.1. SIGLAS

  AAC - Autoridade de Aviação Civil

  ACI - Aviso de Condição Irregular

  AFM - Aircraft Flight Manual

  ANAC - Agência Nacional de Aviação Civil

  ALS - Airworthiness Limitations Section

  ATA - Air Transport Association

  BS/SB - Boletim de Serviço/Service Bulletin

  CLA - Certificado de Liberação Autorizada

  CMR - Certification Maintenance Requirements

  COPj - Certificação de Organização de Projeto

  CST - Certificado Suplementar de Tipo

  CT - Certificado de Tipo

  CVE - Compliance Verification Expert

  DA - Diretriz de Aeronavegabilidade

  DLA - Documento de Liberação Autorizada

  ELOS - Equivalent Level of Safety

  EWIS - Electrical Wiring Interconnecion System

  FCD - Dados Relevantes à Operação para Pilotos

  ICA - Instructions for Continued Airworthiness

  IS - Instrução Suplementar

  MCOPj - Matriz de Cumprimento da Organização de Projeto

  MCRP - Matriz de Cumprimento com os Requisitos de Certificação do Projeto

  MMEL - Lista Mestra de Equipamentos Mínimos (Master Minimum Equipment List)

  MOPj - Manual de Organização de Projeto

  MRB - Maintenance Review Board

  OSD - Dados Relevantes à Operação (Operational Suitability Data)

  PAMC - Plano de Ações Mitigatórias e Corretivas

  RBAC - Regulamento Brasileiro de Aviação Civil

  RBHA - Regulamento Brasileiro de Homologação Aeronáutica

  RNC - Relatório de Não Conformidades

  SAR - Superintendência de Aeronavegabilidade

  SC - Special Condition

  SRCI - Solicitação de Reparação de Condição Irregular

  SRM - Structural Repair Manual'
