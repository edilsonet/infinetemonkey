text: 'APÊNDICE B - CONTROLE DE ALTERAÇÕES


  ALTERAÇÕES REALIZADAS NA REVISÃO D

  ITEM

  ALTERAÇÃO REALIZADA

  Diversos

  Ajustes editoriais diversos, sem impacto no conteúdo.

  1.1

  Inclusão de referência aos OSD no escopo das prerrogativas da COPj.

  Inclusão do texto completo de referente à sigla "RBAC", em razão da primeira utilização
  no documento.

  2.1

  Atualização da letra da revisão da IS revogada.'
