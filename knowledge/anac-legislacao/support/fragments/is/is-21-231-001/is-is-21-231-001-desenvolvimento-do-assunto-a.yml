title: desenvolvimento-do-assunto(a)
text: 'a) Classificação de modificações ao CT em grandes ou pequenas, conforme a seção 21.93
  e o parágrafo 21.263-I(c)(1) do RBAC nº 21.

  I - O procedimento para classificar as modificações ao projeto de tipo em grandes ou pequenas
  deve abordar, ao menos, os seguintes pontos:

  i. A identificação da modificação ao projeto de tipo a ser classificada;

  ii. A classificação em conformidade com os critérios estabelecidos na seção 21.93 do RBAC
  nº 21;

  iii. A justificativa para a classificação;

  iv. Os papéis dos responsáveis pela classificação; e

  v. A supervisão de modificações iniciadas por fornecedores quanto à sua adequação aos pontos
  acima.

  II - O detentor de um certificado de Organização de Projeto, que seja detentor de CT, deve
  ter um procedimento para classificar as modificações ao projeto de tipo em grandes ou pequenas
  sob a prerrogativa estabelecida no parágrafo 21.263‐I(c)(1) do RBAC nº 21.

  III - O procedimento de classificação da modificação deve mostrar como os efeitos para a
  aeronavegabilidade são analisados.

  IV - O procedimento deve registrar a decisão tomada pelo responsável por obter a classe
  da modificação, dentre grande e pequena, incluindo referência a registros.'
