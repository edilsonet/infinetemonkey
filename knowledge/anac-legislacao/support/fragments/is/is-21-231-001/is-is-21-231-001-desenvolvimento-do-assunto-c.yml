cite: desenvolvimento-do-assunto(c)
title: desenvolvimento-do-assunto(c)
text: 'c) O pessoal responsável na organização pela tomada de decisões em matéria de aeronavegabilidade,
  de ruído, de drenagem de combustível, de emissões de motores de aeronaves, de emissões de
  CO2 de aviões e de OSD:

  I - Os CVE, e;

  II - As pessoas do Escritório de Aeronavegabilidade que tomam decisões que afetam a aeronavegabilidade
  e o cumprimento com os requisitos aplicáveis, em especial ao exercício das prerrogativas
  estabelecidas pela seção 21.263-I do RBAC nº 21.

  Uma declaração de qualificação e experiência para o Diretor Executivo não é requerida.

  O restante do pessoal de gestão da Organização de Projeto (item 5.2.8.2(b)) deve, perante
  o Diretor Executivo e por meio do Responsável pela Organização de Projeto, representar a
  estrutura de gestão da organização e como tal ser responsável pela execução de todas as
  funções, conforme especificado na Subparte J do RBAC nº 21. Havendo as qualificações e experiências
  relevantes em níveis apropriados, uma função de responsável pode ser acumulada por uma pessoa
  ou dividida entre mais de uma, dependendo do tamanho e complexidade da organização. Especial
  atenção deve ser dada quando uma destas funções for a de Responsável pelo Monitoramento
  do Sistema, caso em que a pessoa deve se abster de exercer as atividades de Responsável
  pelo Monitoramento sobre resultados do seu trabalho como responsável da função acumulada.
  Tais atividades devem ser exercidas por outra pessoa em nome da posição de Responsável pelo
  Monitoramento. As pessoas que exercem as funções de responsáveis devem ser identificadas
  e suas qualificações e experiência relevantes para a função na organização descritas.

  A declaração de qualificações apresentada para o restante do pessoal de gestão da Organização
  de Projeto (item 5.2.8.2(b)) deve apresentar as qualificações e experiências relevantes
  listando a formação acadêmica e carreira profissional pertinentes da pessoa e podem ser
  disponibilizadas por meio de um Curriculum Vitae. Estas informações podem ser disponibilizadas
  à ANAC de forma confidencial e independente do MOPj, juntamente com a solicitação de certificação.
  Tais informações devem ser suficientes para que tais pessoas possam ser consideradas apropriadas
  em termos de conhecimento relevante e experiência satisfatória relacionada à natureza das
  atividades de projeto executadas pela organização.

  Ao ser apresentada a declaração de qualificações e experiências, a Organização de Projeto
  afirma, em cumprimento ao parágrafo 21.245-I(a) do RBAC nº 21, que o Responsável pela Organização
  de Projeto tem a responsabilidade direta sobre todos os departamentos da organização que
  executam a função de desenvolvimento de produto. Caso esta responsabilidade esteja funcionalmente
  dividida, por exemplo por meio de uma estrutura matricial, o Responsável pela Organização
  de Projeto mantém a responsabilidade final para o atendimento às obrigações previstas na
  Subparte J do RBAC nº 21.

  Ao ser apresentada a declaração de qualificações e experiências, a Organização de Projeto
  também afirma, em cumprimento ao parágrafo 21.245-I(a) do RBAC nº 21, que o Responsável
  pelo Escritório de Aeronavegabilidade, ou que o Responsável pela Organização de Projeto
  que acumula tal função, dispõe de autoridade sobre um Escritório de Aeronavegabilidade,
  estabelecido e provido em uma base permanente, para atuar como o ponto focal para a coordenação
  de questões de aeronavegabilidade, de ruído, de drenagem de combustível, de emissões de
  motores de aeronaves, de emissões de CO2 de aviões e de OSD.

  Para os Compliance Verification Experts (CVE) e as pessoas do escritório de aeronavegabilidade
  tomando decisões que afetam a aeronavegabilidade e o cumprimento com os requisitos aplicáveis,
  uma declaração individual pode ser substituída pela descrição de um sistema de seleção,
  treinamento, manutenção e identificação destas pessoas, em cumprimento ao parágrafo 21.243-I(d)
  do RBAC nº 21. A descrição de tal sistema deve satisfazer às seguintes orientações:'
