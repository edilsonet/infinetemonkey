title: desenvolvimento-do-assunto(d)
text: 'd) Escritório de Aeronavegabilidade: as tarefas abaixo descritas podem ser delegadas
  a outros membros da Organização de Projeto, desde que devidamente estabelecido no manual.

  I - Coordenação entre a Organização de Projeto e a ANAC com respeito a todos os aspectos
  dos programas de certificação.

  II - Garantia de que o MOPj estabelecido conforme a seção 21.243-I do RBAC nº 21 e o item
  5.2.7 desta IS está atualizado e sendo cumprido conforme estabelecido.

  III - Cooperação com a ANAC no desenvolvimento de procedimentos para serem usados no processo
  de certificação de tipo.

  IV - Emissão de orientações e procedimentos para documentar a conformidade de ensaios, a
  demonstração e a verificação de cumprimento com os requisitos do projeto.

  V - Cooperação na emissão de guias ou procedimentos para a preparação de manuais requeridos
  pelos requisitos aplicáveis, boletins de serviço, desenhos, especificações e normas.

  VI - Garantia de que os regulamentos e normas aplicáveis estão disponíveis na organização.

  VII - Cooperação com a ANAC na proposição de base de certificação, incluindo casos em que
  sejam necessários Equivalent Level of Safety - ELOS, Special Condition - SC ou isenção dos
  requisitos de certificação.

  VIII - Questionamento à ANAC em caso de dúvidas sobre novos requisitos, novas interpretações
  de requisitos exaradas pelas AAC ou qualquer dúvida sobre o processo de certificação.

  IX - Aconselhamento a todos os departamentos da organização no tocante aos processos de
  certificação.

  X - Preparação dos planos de certificação e coordenação de todas as tarefas relativas ao
  processo de certificação junto à ANAC.

  XI - Relato regular à ANAC sobre o progresso da Investigação de Tipo e aviso sobre os ensaios
  programados em tempo adequado.

  XII - Cooperação na preparação de programas de inspeções e ensaios necessários à demonstração
  de cumprimento com os requisitos do projeto.

  XIII - Estabelecimento e atualização da Matriz de Cumprimento com os Requisitos de Certificação
  do Projeto (MCRP) para novos projetos ou modificações.

  XIV - Checagem de que todos os documentos de cumprimento, conformidade e verificação de
  cumprimento com os requisitos do projeto foram preparados como necessário para demonstrar
  o cumprimento com os requisitos aplicáveis e que a emissão dos documentos foi realizada
  seguindo os procedimentos estabelecidos, com as aprovações necessárias.

  XV - Verificação de que todos os documentos de definição do projeto de tipo, descritos na
  seção 21.31 do RBAC nº 21, foram devidamente emitidos e garantia de que serão disponibilizados
  à ANAC, quando requeridos.

  XVI - Preparação, quando necessário, de uma proposta de Especificação de Tipo, ou de modificação
  de uma Especificação de Tipo.

  XVII - Prover a informação ao Responsável pela Organização de Projeto de que todas as atividades
  da Investigação de Tipo foram devidamente concluídas.

  XVIII - Classificar as modificações ao projeto de tipo e aos OSD, e aprovar as pequenas
  modificações, conforme estabelecido nas seções 21.93, 21.95 e 21.107-I do RBAC nº 21, quando
  estabelecida tal prerrogativa nos Termos da Certificação da organização.

  XIX - Cooperação na preparação de Informações ou Instruções Técnicas, conforme estabelecido
  no parágrafo 21.263-I(c)(3) do RBAC nº 21, e suas respectivas revisões, com especial atenção
  à forma como tais informações afetam o cumprimento aos requisitos aplicáveis.

  XX - Garantir que as devidas ações sejam tomadas pela Organização de Projeto em resposta
  a uma avaliação de falha, defeito ou mau funcionamento (a partir de acidente, incidente
  ou qualquer outro tipo de ocorrência) e reclamações de operadores, provendo informação devida
  à ANAC.

  XXI - Cooperação com a ANAC em relação à emissão de Diretriz de Aeronavegabilidade (DA)
  e aconselhamento quanto a emissão de tal documento no momento da emissão de BS.

  XXII - Garantia de que os documentos e manuais que devem ser aprovados pela ANAC, incluindo
  suas revisões, foram verificados quanto ao cumprimento com os requisitos aplicáveis e que
  foram devidamente disponibilizados para a ANAC para aprovação.'
