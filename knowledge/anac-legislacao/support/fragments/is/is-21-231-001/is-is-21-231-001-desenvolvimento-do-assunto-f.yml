title: desenvolvimento-do-assunto(f)
text: 'f) Aprovação de modificações pequenas aos dados relevantes à operação, conforme o parágrafo
  21.263-I(c)(2) do RBAC nº 21, referente à MMEL, conforme descrito nos parágrafos 21.61-I(e)
  e 21.107-I(d) do RBAC nº 21.

  I - O procedimento para aprovar as modificações pequenas aos dados relevantes à operação
  deve abordar, ao menos, os seguintes pontos:

  i. A justificativa técnica para cada item, conforme requerido pelo parágrafo 21.61-I(e)(2)
  do RBAC nº 21, c/c o item 5.3.4 da IS 21.61-005, revisão A, ou seção similar contida em
  versões mais atuais da IS referenciada.

  ii. As informações descritas nos itens 5.5.4.7(d)(I), deixando clara a necessidade de verificação
  independente, pelo CVE, como parte da aprovação realizada, quando descrevendo o item 5.5.4.7(d)(I)(iii).

  II - O procedimento deve incluir a forma como a organização cumpre com o parágrafo 21.61-I(f)
  do RBAC nº 21.'
