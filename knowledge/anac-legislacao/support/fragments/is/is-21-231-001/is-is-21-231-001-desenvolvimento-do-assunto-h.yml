cite: desenvolvimento-do-assunto(h)
title: desenvolvimento-do-assunto(h)
text: 'h) Aprovação de determinadas revisões ao manual de voo da aeronave e aos seus suplementos
  e emissão dos documentos com as referidas revisões sob a autoridade da Certificação de Organização
  de Projeto, de acordo com os procedimentos descritos ou referenciados no MOPj, conforme
  o parágrafo 21.263-I(c)(4) do RBAC nº 21.

  I - O procedimento para aprovar as revisões ao manual de voo da aeronave e ao seu suplemento
  deve abordar, ao menos, os seguintes pontos:

  i. A preparação das revisões ao manual de voo;

  ii. A classificação, em conformidade com os critérios estabelecidos no item 5.5.4.7(h)(IV),
  abaixo, e sua justificativa; e

  iii. Os papéis responsáveis pela aprovação.

  II - Os pontos listados acima devem conter registros verificáveis. Estes registros devem
  estar acessíveis à ANAC para as averiguações previstas no parágrafo 21.257-I(a) do RBAC
  nº 21.

  III - Os procedimentos devem incluir as revisões ao AFM motivadas ou executadas por fornecedores
  e sua aprovação.

  IV - As seguintes modificações no manual de voo são permitidas por meio da prerrogativa
  21.263-I(c)(4) do RBAC nº 21:

  i. Revisões ao manual de voo associadas com modificações ao projeto de tipo que são classificadas
  como pequenas modificações de acordo com a seção 21.93 do RBAC nº 21;

  ii. Revisões ao manual de voo que não estejam associadas com modificações ao projeto de
  tipo e que se enquadrem em algumas das seguintes categorias:

  1. Modificações às limitações ou aos procedimentos que permaneçam dentro dos limites já
  certificados (ex. pesos, dados estruturais, ruído, etc.);

  2. Consolidação em um manual de voo de dois (ou mais) manuais previamente aprovados e compatíveis
  entre si, ou a compilação de partes diferentes obtidas de manuais de voo previamente aprovados
  e compatíveis entre si que são diretamente aplicáveis à aeronave em questão (customização);
  e

  3. A introdução de emendas, revisões, apêndices ou suplementos previamente aprovados e compatíveis
  entre si em um determinado manual de voo; e

  iii. Revisões administrativas ao manual de voo.

  V - Não são permitidos, dentre outros, os seguintes exemplos de revisão ao manual de voo
  da aeronave e ao seu suplemento: transformação do manual de papel para eletrônico, alteração
  da estrutura das seções do manual, alteração de grande monta na forma de apresentar para
  o piloto uma tabela ou gráfico de performance, ou outras alterações equivalentes.

  VI - O detentor da COPj pode acordar critérios mais detalhados com a ANAC, conforme o escopo
  da certificação da organização, para classificação das revisões ao manual de voo da aeronave
  e ao seu suplemento e permissão de aprovação de tais revisões.

  VII - O procedimento de classificação da revisão ao manual de voo, dentre as possibilidades
  expressas acima, deve indicar como ela deve ser feita e a(s) função(ões) responsável(is)
  por fazê-la. O registro da classificação inclui referência a registros técnicos usados para
  suportar decisões que não sejam de entendimento direto. Estes registros devem estar acessíveis
  à ANAC para as averiguações previstas no parágrafo 21.257-I(a) do RBAC nº 21.

  VIII - As revisões ao manual de voo e ao seu suplemento aprovadas sob a prerrogativa estabelecida
  no parágrafo 21.263-I(c)(4) do RBAC nº 21 devem ser emitidas com a declaração que indica
  que o conteúdo da revisão foi aprovado pela Organização de Projeto.'
