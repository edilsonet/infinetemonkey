title: desenvolvimento-do-assunto(i)
text: 'i) Aprovação de dado técnico para grande reparo em produtos para os quais seja o detentor
  do CT ou do CST, conforme o parágrafo 21.263-I(c)(5) do RBAC nº 21.

  I - Como descrito na própria prerrogativa, organizações que não detém o CT ou CST não podem
  requerer a certificação como Organização de Projeto e devem submeter os dados técnicos para
  grande reparo conforme outras formas aceitas pela ANAC.

  II - O procedimento para aprovar dados técnicos para grande reparo deve endereçar, ao menos,
  os seguintes pontos:

  i. A identificação e uma breve descrição do projeto de grande reparo e a identificação do
  número de série elegível (ou elegíveis quando aplicável ao SRM);

  ii. O registro dos requisitos associados, meios de cumprimento e documentos de cumprimento
  submetidos à verificação independente;

  iii. Os papéis responsáveis pela aprovação, e;

  iv. A inclusão em comunicação técnica de uma declaração com afirmação de que os dados técnicos
  para grande reparo ou danos admissíveis foi aprovado sob a autoridade de detentor do certificado
  de Organização de Projeto.

  III - Projeto de grande reparo temporário é considerado equivalente ao projeto de grande
  reparo e como tal está contemplado na prerrogativa estabelecida no parágrafo 21.263-I(c)(5)
  do RBAC nº 21.

  IV - É esperado que a Organização de Projeto que detenha a prerrogativa do parágrafo 21.263-I(c)(5)
  do RBAC nº 21 aprove os dados técnicos para grande reparo previamente à possível execução
  de quaisquer averiguações pela ANAC descritas no parágrafo 21.257-I(b) do mesmo RBAC.'
