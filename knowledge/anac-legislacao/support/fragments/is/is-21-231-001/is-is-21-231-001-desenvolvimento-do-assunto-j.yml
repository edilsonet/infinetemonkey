title: desenvolvimento-do-assunto(j)
text: 'j) Emissão de Documento de Liberação Autorizada - DLA, conforme o parágrafo 21.263-I(c)(8)
  do RBAC nº 21.

  I - O detentor de um certificado de Organização de Projeto deve ter um procedimento para
  emitir DLA para atestar a conformidade de protótipo de motores de aeronaves, hélices e artigos,
  após determinar que estão conformes com dados aplicáveis. Esta emissão de DLA ocorre sob
  a prerrogativa estabelecida no parágrafo 21.263-I(c)(8) do RBAC nº 21 e é semelhante à prerrogativa
  de emissão de documento de liberação autorizada por meio do parágrafo 21.137(o) do mesmo
  RBAC, quando referente a produção de produtos segundo projeto de tipo aprovado. Entretanto,
  sabendo-se que a Organização de Projeto não desenvolve a maior parte de suas ações em projetos
  de tipo aprovados, criou-se uma lacuna na emissão de tais documentos para projetos em certificação.
  A prerrogativa estabelecida no parágrafo 21.263-I(c)(8) do RBAC nº 21, em tela, visa prover
  segurança equivalente a existente na produção à circulação de peças protótipo.

  II - O DLA pode substituir, em algumas aplicações, o Certificado de Liberação Autorizada
  - CLA (SEGVOO 003) e é emitido para atestar a conformidade de protótipo em ensaios de certificação.

  III - A organização que pretende utilizar tal prerrogativa deve estabelecer procedimentos
  dentro do Sistema de Garantia do Projeto para permitir a emissão do DLA para artigos protótipo.

  IV - É esperado que, caso a organização tenha uma certificação de produção emitida conforme
  a subparte G do RBAC nº 21, os procedimentos e recursos (incluindo pessoal) para a emissão
  do DLA para artigos protótipo serão derivados dos disponíveis para emissão do DLA para projeto
  aprovado. Entretanto, a responsabilidade de emissão deste documento para artigos protótipo
  pertence à organização certificada conforme a subparte J do RBAC nº 21.

  V - Adicionalmente, é esperado que o detentor de uma certificação de Organização de Projeto
  que contenha a prerrogativa em referência não mais utilize o profissional credenciado conforme
  o RBAC nº 183 para a emissão do CLA para artigos protótipo, a menos que a prerrogativa tenha
  alguma limitação e/ou restrição para determinada organização.

  NOTA: Todos as tarefas descritas acima, partes da prerrogativa de CT, devem prever procedimentos
  para organizações fornecedoras, caso tais organizações realizem qualquer atividade como
  parte do Sistema de Garantia do Projeto.

  Certificado Suplementar de Tipo - CST

  O detentor de um certificado de Organização de Projeto pode submeter documentos de cumprimento
  com os requisitos, os quais a ANAC aceitará sem verificações adicionais, sujeitos ao disposto
  na seção 21.257-I do RBAC nº 21, com vistas à obtenção de um Certificado Suplementar de
  Tipo, conforme o parágrafo 21.263-I(b)(3) do mesmo regulamento. Para isso, deve demonstrar
  que estabeleceu e cumpre com um Sistema de Garantia do Projeto, requerido pela seção 21.239-I
  do RBAC nº 21, e demais seções aplicáveis da Subparte J do mesmo regulamento, descritas
  nos item 5.2 e 5.4 desta IS, ou apresentar um meio ou procedimento alternativo às instruções
  dos itens 5.2 e 5.4, conforme item 3.2 desta IS.

  Na fase final de um novo projeto (ou emenda ao projeto, quando aplicável), a organização
  deve apresentar uma Declaração de Cumprimento com os Requisitos do Projeto contendo todos
  os requisitos associados dos RBAC aplicáveis, nos moldes estabelecidos no item 5.2.4.4(b)(II).
  Este documento subsidiará a emissão do CST (ou aprovação da modificação, quando aplicável).

  O detentor de um certificado de Organização de Projeto, que seja detentor de CST, deve ter
  um procedimento para requerer a aprovação de grandes modificações ao projeto de tipo ou
  aos OSD sob a prerrogativa estabelecida no parágrafo 21.263‐I(b)(3) do RBAC nº 21.

  As instruções contidas entre os itens 5.5.4.4 e 5.5.4.7, acima, aplicam-se à prerrogativa
  relacionada com CST, quando devido.

  Aprovação de Dados Técnicos para Grande Reparo

  Aprovação pela ANAC de dados técnicos para grande reparo. Esta prerrogativa é utilizada
  para permitir que a aprovação de dados técnicos de grande reparo seja realizada pela ANAC
  levando em consideração a verificação de cumprimento com os requisitos aplicáveis já realizada
  por meio do Sistema de Garantia do Projeto de uma Organização de Projeto, conforme estabelecido
  no parágrafo 21.263-I(b)(5) do RBAC nº 21.

  Para que a prerrogativa seja concedida, a organização deve demonstrar que estabeleceu e
  cumpre com um Sistema de Garantia do Projeto, requerido pela seção 21.239-I do RBAC nº 21,
  e demais seções aplicáveis da Subparte J do mesmo regulamento, descritas nos item 5.2 e
  5.4 desta IS, ou apresentar um meio ou procedimento alternativo às instruções dos itens
  5.2 e 5.4, conforme item 3.2 desta IS.

  Aprovação de dados técnicos para grande reparo diretamente pela organização. Adicionalmente,
  a Organização de Projeto pode aprovar diretamente os dados técnicos para determinados grandes
  reparos, caso os Termos da Certificação contenham previsão expressa, conforme o parágrafo
  21.263-I(c)(5) do RBAC nº 21. Igualmente ao previsto anteriormente, para que a prerrogativa
  seja concedida, a organização deve demonstrar que desenvolveu e cumpre com um Sistema de
  Garantia do Projeto.

  A prerrogativa de aprovação de dados técnicos para grandes reparos conforme o parágrafo
  21.263-I(c)(5) do RBAC nº 21 é exclusiva para detentores de Certificado de Tipo e Suplementar
  de Tipo. Entretanto, a prerrogativa de submissão de documentos de cumprimento com os requisitos
  para a aprovação de dados técnicos para grande reparo por meio do parágrafo 21.263-I(b)(5)
  do mesmo regulamento não é exclusiva. Portanto, pode ser requerida por qualquer organização
  interessada.

  As instruções contidas no item 5.5.4.7(i) desta IS aplicam-se à prerrogativa aqui descrita,
  quando devido.

  A Organização de Projeto deve prover à ANAC uma listagem, com uma periodicidade adequada,
  das aprovações de dados técnicos para grandes reparos realizadas.

  Aprovação de Dados Técnicos para Grande Alteração

  Aprovação pela ANAC de dados técnicos para grande alteração. Esta prerrogativa é utilizada
  para permitir que a aprovação de dados técnicos de determinadas grandes alterações, conforme
  listado na IS 21-004, seja realizada pela ANAC, levando em consideração a verificação de
  cumprimento com os requisitos aplicáveis já realizada por meio do Sistema de Garantia do
  Projeto de uma Organização de Projeto, conforme estabelecido no parágrafo 21.263-I(b)(6)
  do RBAC nº 21.

  Para que a prerrogativa seja concedida, a organização deve demonstrar que estabeleceu e
  cumpre com um Sistema de Garantia do Projeto, requerido pela seção 21.239-I do RBAC nº 21,
  e demais seções aplicáveis da Subparte J do mesmo regulamento, descritas nos item 5.2 e
  5.4 desta IS, ou apresentar um meio ou procedimento alternativo às instruções dos itens
  5.2 e 5.4, conforme item 3.2 desta IS.

  Para que uma Organização de Projeto obtenha a prerrogativa 21.263-I(b)(6) do RBAC nº 21
  deve demonstrar um histórico satisfatório na aprovação de grandes alterações ou grandes
  modificações por meio de CST.

  Aprovação de dados técnicos para grande alteração diretamente pela organização. Adicionalmente,
  a Organização de Projeto pode aprovar diretamente os dados técnicos para determinadas grandes
  alterações, conforme listado na IS 20-001, caso os Termos da Certificação contenham previsão
  expressa, conforme o parágrafo 21.263-I(c)(9) do RBAC nº 21. Igualmente ao previsto anteriormente,
  para que a prerrogativa seja concedida, a organização deve demonstrar que desenvolveu e
  cumpre com um Sistema de Garantia do Projeto.

  Para que a prerrogativa descrita no parágrafo 21.263-I(c)(9) do RBAC nº 21 seja concedida
  a uma Organização de Projeto, é necessário que ela tenha recebido anteriormente a prerrogativa
  do parágrafo 21.263-I(b)(6) ou 21.263-I(b)(3) do mesmo regulamento e que demonstre um histórico
  satisfatório de aprovações de grandes alterações ou grandes modificações pela ANAC por meio
  das prerrogativas previamente apresentadas.

  A prerrogativa em referência pode exceder os limites estabelecidos na IS 20-001, caso a
  Organização de Projeto demonstre um histórico satisfatório de aprovações prévias entre alterações
  e modificações por meio de CST e os Termos da Certificação contemplem tal prerrogativa.

  Tanto a prerrogativa de submissão de documentos de cumprimento com os requisitos para a
  aprovação de dados técnicos para grande alteração por meio do parágrafo 21.263-I(b)(6) do
  RBAC nº 21 quanto a prerrogativa de aprovação de dados técnicos para determinadas grandes
  alterações conforme o parágrafo 21.263-I(c)(9) do mesmo regulamento não são exclusivas para
  detentores de Certificado de Tipo e Suplementar de Tipo. Portanto, podem ser requeridas
  por qualquer organização interessada apenas na aprovação de dados técnicos de grande alteração.

  A Organização de Projeto deve prover à ANAC uma listagem, com uma periodicidade adequada,
  das aprovações de dados técnicos para grandes alterações realizadas.

