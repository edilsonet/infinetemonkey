text: 'k) Uma lista com todos os procedimentos complementares referenciados no manual, que
  serão considerados parte do MOPj.

  NOTA: Os registros e controles do Manual podem ser realizados através de um sistema eletrônico.

  Declaração de Qualificação e Experiência

  Em conformidade com o parágrafo 21.243-I(d) do RBAC nº 21, a Organização de Projeto deve
  fornecer uma declaração de qualificação e experiência do quadro gerencial, ou seja, das
  pessoas que ocupam cargos de gestão da Organização de Projeto, bem como do pessoal responsável
  na organização pela tomada de decisões em matéria de aeronavegabilidade, de ruído, de drenagem
  de combustível, de emissões de motores de aeronaves, de emissões de CO2 de aviões e de OSD,
  ou seja, das pessoas responsáveis por decisões que afetam o cumprimento com os requisitos
  aplicáveis.

  Três tipos de funções da Organização de Projeto são identificadas nesta IS:'
