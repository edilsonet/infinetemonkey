title: desenvolvimento-do-assunto(l)
text: 'l) Conforme estabelecido na seção 21.49 do RBAC nº 21, combinada com as seções 21.239-I
  e 21.245-I do mesmo RBAC, no caso de uma Organização de Projeto, a organização deve manter
  os registros pelo tempo em que for detentora do CT. Adicionalmente, caso a operação do produto
  tenha sido encerrada ou nunca venha a ocorrer, é necessário, ainda, manter os registros
  por, ao menos, 2 (dois) anos após uma pessoa deixar a organização, requerer o cancelamento
  de sua autorização ou ter sua autorização revogada.

  Alterações Significativas

  Conforme estabelecido na seção 21.247-I do RBAC nº 21, após a certificação como Organização
  de Projeto, cada alteração no Sistema de Garantia do Projeto, que seja significativa para
  a demonstração de cumprimento com os requisitos aplicáveis, deverá ser aprovada pela ANAC.
  Uma solicitação deve ser submetida à Agência demonstrando, com base na apresentação de propostas
  de alteração do sistema, e antes da implementação da alteração, que a organização continuará
  cumprindo com os itens aplicáveis da subparte J do RBAC nº 21 após a implementação da alteração
  significativa.

  Em adição à mudança de propriedade da organização que não implica em transferência conforme
  seção 21.249‐I do RBAC nº 21, as seguintes mudanças no Sistema de Garantia do Projeto são
  consideradas significativas:'
