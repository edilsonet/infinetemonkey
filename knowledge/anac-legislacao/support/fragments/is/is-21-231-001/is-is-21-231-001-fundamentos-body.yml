title: FUNDAMENTOS
text: 'FUNDAMENTOS

  Certificação de Organização de Projeto

  Conforme estabelecido no inciso XXXIII do art. 8º da Lei nº 11.182, de 27 de setembro de
  2005, a ANAC pode expedir, homologar ou reconhecer a certificação de produtos e processos
  aeronáuticos de uso civil, observados os padrões e normas por ela estabelecidos.

  A seção 21.233-I do RBAC nº 21 estabelece que qualquer pessoa jurídica (organização) que
  pretenda desenvolver projetos de produtos aeronáuticos, ou modificações aos projetos, ou
  dados técnicos para grande reparo ou dados técnicos para grande alteração, pode requerer
  uma certificação, de acordo com a subparte J do RBAC nº 21.

  A seção 21.263-I do RBAC nº 21 estabelece as prerrogativas que uma Organização de Projeto
  pode receber.

  O conceito da COPj é de que a organização desenvolve seus próprios processos e tem a responsabilidade
  sobre eles, diferentemente de outros sistemas em que a ANAC requer a utilização de processos
  e procedimentos estabelecidos pela própria Agência.

  Meio Aceitável de Cumprimento

  O art. 14 da Resolução nº 30, de 21 de maio de 2008, que instituiu o RBAC e IS e estabelece
  critérios para a sua elaboração, dispõe em seu § 1º, alterado pela Resolução nº 162, de
  20 de julho de 2010, que o administrado que pretenda demonstrar o cumprimento de requisito
  previsto em RBAC ou Regulamento Brasileiro de Homologação Aeronáutica - RBHA poderá adotar
  os meios e procedimentos especificados em IS ou apresentar meio ou procedimento alternativo
  devidamente justificado, exigindo-se a análise e concordância expressa do órgão competente
  da ANAC.

  O § 2º do art. 14 da Resolução nº 30, de 21 de maio de 2008, supracitado, dispõe que o meio
  ou procedimento alternativo mencionado no § 1º deste artigo deve garantir nível de segurança
  igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo do
  procedimento normalizado em IS.

  O § 3º do art. 14 da Resolução nº 30, de 21 de maio de 2008, supracitado, dispõe que a IS
  não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.'
