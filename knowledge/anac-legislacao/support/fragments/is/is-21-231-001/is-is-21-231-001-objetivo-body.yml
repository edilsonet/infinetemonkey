title: OBJETIVO
text: 'OBJETIVO

  Esta Instrução Suplementar - IS visa orientar o processo de Certificação de Organização
  de Projeto - COPj para fins de concessão de prerrogativas de aceitação das declarações de
  cumprimento com requisitos aplicáveis para detentores de, ou requerentes a, Certificado
  de Tipo - CT, Certificado Suplementar de Tipo - CST, emenda a estes Certificados, ou aprovação
  de dados técnicos para grande reparo ou dados técnicos para grande alteração, de acordo
  com a subparte J do Regulamento Brasileiro de Aviação Civil - RBAC nº 21. Além disso, fornece
  instruções para a concessão de prerrogativas de classificação e aprovação de pequenas modificações
  ao projeto de tipo ou aos Dados Relevantes à Operação - OSD, publicação de informações ou
  instruções técnicas, aprovação de determinadas revisões ao manual de voo, aprovação diretamente
  de determinados dados técnicos para grande reparo ou dados técnicos para grande alteração
  e, por fim, emissão do Documento de Liberação Autorizada - DLA, também por meio da subparte
  J do RBAC nº 21. Ademais, descreve os elementos necessários à implantação e manutenção da
  certificação, requeridos pelo mesmo regulamento.'
