title: DEFINITIONS
text: '4. DEFINITIONS

  4.1 Aeronave base significa uma aeronave usada como referência para comparar diferenças
  com outra aeronave.

  4.1 Base aircraft means an aircraft used as a reference to compare differences with another
  aircraft.

  4.2 Aeronave candidata significa uma aeronave submetida ao processo de avaliação.

  4.2 Candidate aircraft means an aircraft subject to the evaluation process.

  4.3 Aeronaves relacionadas significam quaisquer duas ou mais aeronaves do mesmo fabricante
  com certificados de tipo iguais ou diferentes que tenham sido determinadas pela ANAC como
  tendo comunalidade na medida em que crédito entre essas aeronaves pode ser aplicado para
  treinamento de membros da tripulação de voo, exame, experiência recente (currency e/ou aquela
  requerida​​​ pela seção 61.21 do RBAC 61 ou regulamentação local equivalente), experiência
  operacional, ciclos operacionais e tempo de voo operacional em rota para consolidação de
  conhecimento e habilidades.

  4.3 Related aircraft mean any two or more aircraft of the same manufacturer with either
  the same or different type certificates that have been determined by ANAC to have commonality
  to the extent that credit between those aircraft may be applied for flight crew member training,
  checking, currency, recent experience as required by section 61.21 of RBAC 61 or equivalent
  local regulations, operating experience, operating cycles, and line operating flight time
  for consolidation of knowledge and skills.

  4.4 Áreas de Treinamento de Ênfase Especial (Training Areas of Special Emphasis - TASE)
  significam o conhecimento e habilidades específicos necessários para a operação segura de
  um tipo de aeronave ou variante, o uso de equipamentos, a aplicação de procedimentos ou
  o desempenho de operações.

  4.4 Training Areas of Special Emphasis - TASE mean the specific knowledge and skills required
  for the safe operation of an aircraft type or variant, the use of equipment, the application
  of procedures, or the performance of operations.

  4.5 Avaliação Operacional significa o processo utilizado para desenvolver e emitir os FCD.

  4.5 Operational Evaluation - OE means the process employed to develop and issue the FCD.

  4.6 Características de voo significam qualidades de pilotagem ou características de desempenho
  perceptíveis por um piloto. Características de voo se relacionam com a resposta aerodinâmica
  de uma aeronave, particularmente conforme afetada por mudanças na configuração ou parâmetros
  de trajetória de voo.

  4.6 Flight characteristics mean handling qualities or performance characteristics perceivable
  by a pilot. Flight characteristics relate to the aerodynamic response of an aircraft, particularly
  as affected by changes in configuration or flight path parameters.

  4.7 Configuração significa características da aeronave (por exemplo, equipamentos, sistemas
  ou funções), que são distinguíveis pelos pilotos, com relação às diferenças em sistemas,
  geometria da cabine, ângulos de corte visual, controles, mostradores, geometria da aeronave
  e/ou número de pilotos necessários.

  4.7 Configuration means aircraft features (e.g., equipment, systems or functions), which
  are distinguishable by pilots, with respect to differences in systems, cockpit geometry,
  visual cutoff angles, controls, displays, aircraft geometry, and/or number of required pilots.

  4.8 Corpo de prova significa um piloto que possui os pré-requisitos para a realização de
  um treinamento e/ou para a realização do teste específico, que é utilizado em testes T com
  a finalidade de determinar a conformidade dos elementos de FCD propostos para treinamento
  inicial ou de diferenças, bem como de qualquer crédito.

  4.8 Test Subject means a pilot possessing the prerequisites for taking a training course
  and/or for conducting the specific test, who is used in T tests for the purpose of determining
  the compliance of the proposed FCD initial or difference training elements, as well as of
  any credit.

  4.9 Crédito de Decolagem e Pouso Comuns (Common Take-off and Landing Credit - CTLC) significa
  um programa ou processo que permite crédito por experiência recente, conforme requerido
  pela seção 61.21 do RBAC 61 ou regulamentação local equivalente, entre tipos de aeronaves
  que podem ser demonstrados como tendo qualidades de pilotagem, características de voo, técnicas
  operacionais e procedimentos operacionais muito semelhantes durante a decolagem e subida
  inicial, aproximação e pouso (incluindo o estabelecimento da configuração final de pouso).

  4.9 Common Take-off and Landing Credit - CTLC means a program or process that allows credit
  for recent experience, as required by section 61.21 of RBAC 61 or equivalent local regulations,
  between aircraft types that can be demonstrated to have very similar handling qualities,
  flight characteristics, operating techniques, and operating procedures during take-off and
  initial climb, approach and landing (including the establishment of the final landing configuration).

  4.10 Dados Relevantes à Operação (Operational Suitability Data - OSD) significam as informações
  produzidas durante a certificação de tipo que são relevantes para a operação segura da aeronave,
  cujos elementos incluem os FCD, conforme definido no RBAC 01.

  4.10 Operational Suitability Data - OSD means data produced during type certification which
  are relevant to the aircraft safe operation, whose elements include the FCD, as defined
  in RBAC 01.

  4.11 Dados Relevantes à Operação para Pilotos (Flight Crew Data - FCD) significam aqueles
  OSD relacionados à determinação da habilitação de tipo para piloto e especificações recomendadas
  para treinamento mínimo, exame e experiência recente.

  4.11 Flight Crew Data - FCD - means those OSD related to the determination of the pilot
  type rating and recommended specifications for minimum training, checking and currency.

  4.12 Endosso de habilitação de tipo de piloto significa a designação de um tipo de aeronave
  endossado em uma licença de piloto.

  4.12 Pilot type rating endorsement means the designation of an aircraft type endorsed on
  a pilot license.

  4.13 Exame significa uma avaliação da proficiência de um piloto em termos de conhecimento
  e habilidades em tarefas de acordo com o padrão determinado pela ANAC.

  4.13 Checking means an assessment of a pilot proficiency in terms of knowledge and skills
  in tasks to the standard determined by ANAC.

  4.14 Experiência recente (currency) significa, para os fins desta IS a experiência necessária,
  dentro de um período especificado, para a operação segura de aeronaves, equipamentos e sistemas,
  e está relacionada aos conceitos de Requisitos Mestres de Diferenças (Master Difference
  Requirements - MDR) e Requisitos de Diferenças (Difference Requirements - DR).

  4.14 Currency means the experience necessary, within a specified period of time, for the
  safe operation of aircraft, equipment, and systems, and is related to the Master Difference
  Requirements - MDR and Difference Requirements - DR concepts.

  NOTA: O termo “experiência recente” desta definição não se refere à experiência recente
  exigida pela seção 61.21 do RBAC 61. O texto desta IS trará clara a referência quando se
  tratar da experiência recente requerida pelo RBAC 61.

  NOTE: The term “currency” of this definition does not refer to the recent experience required
  by section 61.21 of RBAC 61. The text of this IS makes clear reference when referring to
  the recent experience required by RBAC 61.

  4.15 Níveis de diferença significam níveis formalmente determinados de métodos de treinamento,
  exame e experiência recente que satisfazem os requisitos de diferenças entre aeronaves relacionadas.
  Uma gama de cinco níveis de diferenças em ordem crescente de requisitos, identificados como
  A até E, são especificados para fins de treinamento, exame e experiência recente.

  4.15 Difference levels mean formally determined levels of training, checking and currency
  methods that satisfy differences requirements between related aircraft. A range of five
  difference levels in order of increasing requirements, identified as A through E, are specified
  for training, checking and currency purposes.

  4.16 Programa mínimo (minimum syllabus) significa os elementos de treinamento recomendados
  e o quadro geral de treinamento associado apresentados pelo requerente e aprovados pela
  ANAC para um tipo específico de aeronave.

  4.16 Minimum syllabus means the recommended training elements and the associated footprint
  provided by the applicant and approved by ANAC for a specific aircraft type.

  4.17 Quadro geral de treinamento (training footprint) significa uma descrição resumida de
  um programa de treinamento, geralmente em formato tabular curto, mostrando os assuntos de
  treinamento, módulos, procedimentos, manobras ou outros elementos do programa que são planejados
  para serem concluídos durante cada dia ou fase do treinamento.

  4.17 Training footprint means a summary description of a training program, usually in short
  tabular form, showing the training subjects, modules, procedures, maneuvers, or other program
  elements that are planned for completion during each day or phase of training.

  4.18 Qualidades de pilotagem significa uma avaliação subjetiva da maneira como o avião é
  percebido pelo piloto em relação à frequência e magnitude de comandos nos controles de voo
  iniciados pelo piloto com base na resposta aerodinâmica de uma aeronave, também afetada
  por mudanças na configuração ou nos parâmetros da trajetória de voo.

  4.18 Handling qualities mean a subjective assessment of the way the plane feels to the pilot
  with respect to the rate and magnitude of pilot-initiated control inputs to the flight controls
  based on the aerodynamic response of an aircraft, also as affected by changes in configuration
  or flight path parameters.

  4.19 Requisitos de Diferenças (Difference Requirements - DR) significam uma descrição das
  diferenças e níveis mínimos de diferença em relação ao treinamento, exame e experiência
  recente entre uma aeronave base e uma candidata e seu impacto nas características de voo
  e mudanças de procedimentos, a serem utilizados por organizações de treinamento para o desenvolvimento
  de cursos de treinamento e por operadores para o desenvolvimento de tabelas de Requisitos
  de Diferenças do Operador (Operator Difference Requirements - ODR) e programas de treinamento.

  4.19 Difference Requirements - DR mean a description of the differences and minimum difference
  levels regarding training, checking and currency between a base and a candidate aircraft
  and their impact on flight characteristics and changes of procedures, to be used by training
  organizations for the development of training courses and by operators for the development
  of Operator Difference Requirements - ODR tables and training programs.

  4.20 Requisitos de Diferenças do Operador (Operator Difference Requirements - ODR) significam
  tabelas que fornecem um meio uniforme para os operadores gerenciarem de forma abrangente
  as diferenças ou os programas de treinamento de diferenças de aeronaves relacionadas, quando
  existirem diferenças na frota de um operador que afetem o conhecimento, as habilidades ou
  as capacidades do piloto pertinentes aos sistemas ou procedimentos, e fornecem uma base
  para a aprovação da ANAC para o Voo de Frota Mista (Mixed Fleet Flying - MFF).

  4.20 Operator Difference Requirements - ODR mean tables that provide a uniform means for
  operators to comprehensively manage differences or related aircraft difference training
  programs, when differences exist within an operator’s fleet that affect pilot knowledge,
  skills, or abilities pertinent to systems or procedures, and provide a basis for ANAC approval
  of Mixed Fleet Flying - MFF.

  4.21 Requisitos Mestres de Diferenças (Master Difference Requirements - MDR) significam
  os requisitos que dizem respeito às diferenças entre aeronaves. Os MDRs são especificados
  em termos dos níveis mínimos de diferença para treinamento, exame e experiência recente,
  e incluem o nível de diferença mais alto identificado nas tabelas de DR aplicáveis.

  4.21 Master Difference Requirements - MDR mean the requirements that pertain to differences
  between aircraft. MDR are specified in terms of the minimum difference levels for training,
  checking, and currency, and include the highest difference level identified in the applicable
  DR tables.

  4.22 Variante significa uma aeronave que compartilha o mesmo projeto básico dentro da mesma
  habilitação de tipo de piloto, mas possui diferenças suficientes em relação à aeronave base
  que requer um treinamento de diferenças ou um treinamento de familiarização para ser operada,
  conforme prescrito pelo parágrafo 61.217(b) do RBAC 61.

  4.22 Variant means an aircraft that shares the same basic design within the same pilot type
  rating but has sufficient differences to the base aircraft that requires a differences training
  or a familiarization training to be operated, as prescribed by paragraph 61.217(b) of RBAC
  61.

  4.23 Voo de Frota Mista (Mixed Fleet Flying - MFF) significa a operação de aeronaves relacionadas
  para as quais crédito para eventos de treinamento, exame e experiência recente pode ser
  tomado. O processo de avaliação operacional define níveis mínimos de treinamento, exame
  e experiência recente entre aeronaves relacionadas.

  4.23 Mixed fleet flying - MFF means the operation of related aircraft for which credit may
  be taken for training, checking, and/or currency events. The operational evaluation process
  defines minimum training, checking, and currency difference levels between related aircraft.

  4.24 Voo Orientado para Operações em Rota (Line-Oriented Flying - LOF) significa uma fase
  dos testes T3 e T5 usada a critério da ANAC para validar o treinamento e o exame propostos.
  O LOF avalia integralmente áreas de diferença específicas, examina implicações de voo de
  frota mista, avalia circunstâncias especiais como os efeitos de equipamentos inoperantes,
  e avalia os efeitos de erros de piloto potencialmente associados às diferenças.

  4.24 Line-Oriented Flying - LOF means a phase of the T3 and T5 tests used at ANAC’s discretion
  to validate the proposed training and checking. This LOF fully assesses particular difference
  areas, examines implications of mixed fleet flying, assesses special circumstances, such
  as the effects of inoperative equipment, and evaluates the effects of pilot errors potentially
  associated with the differences.'
