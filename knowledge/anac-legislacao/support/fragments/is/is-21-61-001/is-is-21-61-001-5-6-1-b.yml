text: b) O efeito sobre os FCD não é desprezível. Nenhuma referência sobre treinamento, exame
  ou experiência recente estará disponível para aeronaves com a modificação incorporada. Nesse
  caso, a ANAC determinará que critérios específicos de treinamento, exame e experiência recente
  sejam desenvolvidos diretamente pelo operador, organização de treinamento ou pessoa responsável
  pelo treinamento de habilitação de tipo; ou
