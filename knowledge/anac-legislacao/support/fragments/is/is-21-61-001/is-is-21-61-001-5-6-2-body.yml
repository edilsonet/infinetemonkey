title: Stand-alone changes to FCD
text: '5.6.2 Stand-alone changes to FCD

  5.6.2.1 Modificações isoladas (stand-alone) aos FCD podem ser aprovadas sem uma modificação
  ao projeto de tipo associada e podem envolver métodos de treinamento ou características
  de dispositivo aprimorados. Em tais casos, o requerente deve classificar e obter aprovação
  para a modificação stand-alone dos FCD conforme as seções 5.6.3 a 5.6.5.

  5.6.2.1 Stand-alone changes to FCD may be approved without an associated type design change
  and may involve improved training methods or device characteristics. In such cases, the
  applicant shall classify and obtain approval for the FCD stand-alone change as per sections
  5.6.3 to 5.6.5.'
