title: Classification of Changes to FCD
text: '5.6.3 Classification of Changes to FCD

  5.6.3.1 Uma modificação aos FCD é classificada como uma pequena modificação ou uma grande
  modificação. Uma pequena modificação aos FCD é aquela que não tem efeito apreciável sobre
  esses dados. Todas as outras modificações são grandes modificações.

  5.6.3.1 A change to FCD is classified as a minor change or a major change. A minor change
  to FCD is one that has no appreciable effect on those data. All other changes are major
  changes.'
