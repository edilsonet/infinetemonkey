section_id: 5.6.4.3
section_title: 'The approval of a minor change to FCD may occur without investigation activities
  by ANAC when the applicant has:'
subsection_id: a
cite: 5.6.4.3(a)
title: 5.6.4.3(a)
text: 'a) procedures explicitly accepted by ANAC containing, at least:

  I- critérios de classificação para modificações aos FCD;

  I- classification criteria for changes to FCD;

  II- método para produzir, controlar e registrar os dados listados no item 5.6.1.4; e

  II- method for producing, controlling and recordkeeping the data listed in item 5.6.1.4;
  and

  III- método para declarar e registrar que a modificação nos FCD está em conformidade com
  os requisitos aplicáveis.

  III- method for stating and recording that the change to FCD complies with the applicable
  requirements.

  NOTA: Recomenda-se que uma verificação independente da conformidade com os requisitos aplicáveis
  seja realizada pelo requerente antes de apresentar a declaração do item 5.6.4.3(a)(III).

  NOTE: It is recommended that an independent verification of compliance with applicable requirements
  is performed by the applicant before making the statement of item 5.6.4.3(a)(III).'
