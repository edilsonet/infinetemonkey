section_id: 5.6.4.4
section_title: 'If the applicant holds a design organization certificate issued by ANAC, the
  criteria established in item 5.6.4.3 is considered fulfilled when:'
subsection_id: b
cite: 5.6.4.4(b)
title: 5.6.4.4(b)
text: 'b) the design organization manual, or equivalent document, covers type certification
  activities related to FCD.

  5.6.4.5 Os requerentes elegíveis a aprovação de pequenas modificações aos FCD sem atividades
  de investigação pela ANAC devem enviar os documentos listados em 5.6.1.4 à ANAC. Com base
  nesses dados, a ANAC atualizará o documento OSD FC e o tornará disponível.

  5.6.4.5 Applicants eligible for FCD minor changes approval without investigation activities
  by ANAC must submit the documents listed in item 5.6.1.4 or 5.6.2.2, as applicable, to ANAC.
  Based on that, ANAC will update the OSD FC document and make it available.

  5.6.4.6 Como parte de suas atividades de fiscalização, a ANAC pode avaliar quaisquer documentos
  submetidos anteriormente, ou pode não ficar satisfeita com a classificação de uma modificação
  como pequena modificação. Nesses casos, documentos ou esclarecimentos adicionais podem ser
  necessários. Se a ANAC concluir que quaisquer requisitos aplicáveis não foram cumpridos,
  medidas administrativas cobertas pela Resolução ANAC nº 472/2018, ou regulamentação que
  a substitua, podem ser adotadas. Além disso, de acordo com a gravidade dos problemas associados
  à aprovação de pequenas modificações aos FCD, a ANAC pode suspender ou revogar os privilégios
  cobertos pelos items 5.6.4.3 ou 5.6.4.4, conforme aplicável.

  5.6.4.6 As part of its surveillance activities, ANAC may evaluate any previously submitted
  documents, or may not be satisfied with the classification of a change as minor. In such
  cases, further documents or clarifications may be required. If ANAC concludes that any applicable
  requirements were not complied with, administrative measures covered in ANAC Resolution
  No. 472/2018, or superseding regulation, may be adopted. Additionally, upon the severity
  of issues associated with the approval of minor changes to FCD, ANAC may suspend or revoke
  the privileges covered by items 5.6.4.3 or 5.6.4.4, as applicable.

  5.6.4.7 Para requerentes não elegíveis a aprovação de pequenas modificações aos FCD sem
  atividades de investigação pela ANAC, o procedimento de aprovação é o mesmo que para aprovação
  de grandes modificações aos FCD (consulte a seção 5.6.5). No entanto, a ANAC pode, a seu
  critério, optar por reduzir seu nível de envolvimento quando comparado a grandes modificações
  aos FCD, com base na experiência anterior da ANAC e do requerente sobre o assunto, e no
  risco associado à modificação.

  5.6.4.7 For applicants not eligible for the approval of minor changes to FCD without investigation
  activities by ANAC, the approval procedure is the same as for the approval of major changes
  to FCD (refer to section 5.6.5). However, ANAC may, at its own discretion, elect to reduce
  its level of involvement when compared to major changes to FCD, based on ANAC and applicant
  previous experience on the subject, and on the risk associated with the change.'
