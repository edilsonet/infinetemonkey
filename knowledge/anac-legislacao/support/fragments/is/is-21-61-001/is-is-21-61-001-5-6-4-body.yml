title: Approval of Minor Changes to FCD
text: '5.6.4 Approval of Minor Changes to FCD

  5.6.4.1 Pequenas modificações aos FCD podem ser aprovadas por um método aceitável pela ANAC
  ou por meio de uma organização de projeto certificada de acordo com a Subparte J do RBAC
  21.

  5.6.4.1 Minor changes to FCD may be approved under a method acceptable to ANAC or through
  a design organization certified in accordance with Subpart J of RBAC 21.

  5.6.4.2 Esta seção descreve um método aceitável para aprovar pequenas modificações aos FCD.
  O requerente pode propor um método diferente para aceitação explícita da ANAC, no entanto,
  a aceitação para tal método deve ser obtida antes da aprovação da modificação.

  5.6.4.2 This section describes an acceptable method for approving minor changes to FCD.
  The applicant may propose a different method for explicit acceptance of ANAC, however, the
  acceptance for such method shall be obtained before the change approval.'
