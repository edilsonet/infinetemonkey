title: 5.6.5(b)
text: 'b) Specific cases for which ANAC considers being of public interest to act in advance
  or in parallel to SoD CAA.

  5.7.3 Para aeronaves a serem operadas sob o RBAC 121, o requerente deve realizar uma campanha
  de avaliação operacional completa e com resultado satisfatório para que a ANAC emita os
  FCD a serem incluídos no CT.

  5.7.3 For aircraft to be operated under RBAC 121, the applicant must perform a complete
  operational evaluation campaign with satisfactory result for ANAC to issue the FCD to be
  included in the TC.

  5.7.4 Para aeronaves a serem operadas sob regulamentos diferentes do RBAC 121, a ANAC pode
  emitir seu FCD sem uma campanha completa de avaliação operacional, como explicado abaixo:

  5.7.4 For aircraft to be operated under regulations other than RBAC 121, ANAC may issue
  its FCD without a complete operational evaluation campaign, as explained below:

  5.7.4.1 Uma avaliação é conduzida para determinar se novas tecnologias ou características
  únicas existem. Se sim, a ANAC toma créditos dos FCD de referência e informações adicionais
  fornecidas pelo requerente. Entretanto, uma avaliação adicional no local, incluindo reuniões
  técnicas e atividades de voo, é considerada necessária.

  5.7.4.1 An assessment is conducted to determine if new technologies or unique characteristics
  exist. If so, ANAC takes credits of the reference FCD and additional information provided
  by the applicant. However, an additional on-site evaluation including technical meetings
  and flight activities is deemed necessary.

  5.7.4.2 Caso não existam novas tecnologias nem características únicas, a ANAC emitirá os
  FCD por meio de análise documental, tomando créditos dos FCD de referência e informações
  complementares fornecidas pelo requerente.

  5.7.4.2 If new technologies and unique characteristics do not exist, then ANAC will issue
  the FCD through documental analysis, taking credits of the reference FCD and additional
  information provided by the applicant.'
