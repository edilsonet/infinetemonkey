text: '5.6.5 Approval of Major Changes to FCD

  5.6.5.1 Para aprovação de grandes modificações aos FCD, os requerentes devem enviar à ANAC
  todos os documentos listados no item 5.6.1.4. A ANAC então realizará as atividades de investigação
  descritas no Apêndice D para concluir se os requisitos aplicáveis são cumpridos.

  5.6.5.1 For approval of major changes to FCD, applicants shall submit to ANAC all documents
  listed in item 5.6.1.4. ANAC will then perform the investigation activities covered in Appendix
  D to conclude if the applicable requirements are complied with.

  5.6.5.2 Após a ANAC estar satisfeita com o cumprimento dos requisitos aplicáveis, a ANAC
  atualizará o documento OSD FC, bem como outros documentos aplicáveis, por exemplo, Especificação
  de Tipo (Type Certificate Datasheet - TCDS).

  5.6.5.2 After ANAC is satisfied that applicable requirements are complied with, ANAC will
  update the OSD FC document, as well as other applicable documents (e.g. Type Certificate
  Data Sheet - TCDS).

  5.7 Validação de FCD Relacionado a Certificado de Tipo Estrangeiro

  5.7 Validation of FCD Related to Foreign Type Certificate

  5.7.1 Para requerimentos feitos por requerentes estrangeiros buscando a emissão inicial
  de FCD ou modificações em FCD já existentes, a ANAC pode emitir seus próprios FCD com base
  nos FCD originais ou dados equivalentes (por exemplo, aspectos operacionais), após verificar
  a conformidade com os requisitos do RBAC 21.

  5.7.1 For applications made by foreign applicants seeking for initial FCD issuance or changes
  to already existing FCD, ANAC may issue its own FCD based on the original FCD or equivalent
  data (e.g., operational aspects), after finding compliance with RBAC 21 requirements.

  NOTA: FCD originais ou equivalentes significam dados emitidos ou aprovados pela Autoridade
  de Aviação Civil - AAC do Estado de Projeto (State of Design - SoD).

  NOTE: Original FCD or equivalent data means data issued or approved by the State of Design
  - SoD Civil Aviation Authority - CAA.

  5.7.2 Alternativamente, a ANAC pode optar por emitir seus próprios FCD com base nos FCD
  ou dados equivalentes emitidos ou aprovados por uma Autoridade diferente da AAC do SoD.
