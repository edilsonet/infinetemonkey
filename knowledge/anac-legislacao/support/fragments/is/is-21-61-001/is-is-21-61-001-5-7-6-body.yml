text: '5.7.6 Notwithstanding the general validation criteria outlined herein, ANAC may determine
  a different level of involvement based on appropriate justification.

  5.7.7 Sempre que disponíveis, as disposições relacionadas ao FCD (ou equivalente) previstas
  em acordos bilaterais ou acordos de trabalho com a autoridade de aviação civil do Estado
  de Projeto prevalecerão.'
