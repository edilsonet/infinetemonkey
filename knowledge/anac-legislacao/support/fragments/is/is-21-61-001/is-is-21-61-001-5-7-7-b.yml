id: is-is-21-61-001-5-7-7-b
kind: is
document: is-21-61-001
family: '21'
section_id: 5.7.7
section_title: Whenever available, the provisions related to FCD (or equivalent) provided
  in bilateral agreements or working arrangements with the SoD CAA will prevail.
subsection_id: b
cite: 5.7.7(b)
title: 5.7.7(b)
text: 'b) When ANAC elects to use as reference FCD those issued or approved by a CAA other
  than that of the SoD, as covered in item 5.7.2.

  NOTA: O objetivo de tal requisito é garantir que a ANAC não seja responsável pelos FCD completos
  quando não for a autoridade de certificação primária.

  NOTE: The aim of such a requirement is to ensure that ANAC will not be responsible for the
  entire FCD when ANAC is not the primary certification authority.

  5.8 Propriedade e disponibilidade dos FCD

  5.8 Ownership and availability of the FCD

  5.8.1 A ANAC é a proprietária dos FCD. Esses dados são disponibilizados por meio dos documentos
  OSD FC (anteriormente denominados Relatórios de Avaliação Operacional) para cada aeronave
  específica ou relacionada, que estão disponíveis no site da ANAC em https://www.gov.br/anac/pt-br/assuntos/regulados/aeronaves/avaliacao-operacional.

  5.8.1 ANAC is the owner of the FCD. This data is made available through OSD FC documents
  (previously named Operational Evaluation Reports) for each specific or related aircraft,
  which are available at ANAC website at https://www.gov.br/anac/pt-br/assuntos/regulados/aeronaves/avaliacao-operacional.

  5.9 Guarda de registros e disponibilidade

  5.9 Record keeping and availability

  5.9.1 Todos os processos e informações de suporte, incluindo relatórios de teste, relacionados
  à emissão inicial ou aprovação de modificações de projeto de tipo com impacto nos FCD devem
  ser mantidos e disponibilizados à ANAC conforme a seção 21.49 do RBAC 21.

  5.9.1 All dockets and supporting information, including test reports, related to the initial
  issuance or approval of design changes with impact to FCD shall be kept and made available
  to ANAC as per section 21.49 of RBAC 21.'
