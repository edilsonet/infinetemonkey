text: '5.7.7 Whenever available, the provisions related to FCD (or equivalent) provided in
  bilateral agreements or working arrangements with the SoD CAA will prevail.

  5.7.8 Conforme requerido pelo parágrafo 21.29(a)(4)-I do RBAC 21, ao validar um CT estrangeiro,
  os FCD a serem utilizados como referência para emissão dos FCD brasileiros devem ter sido
  emitidos ou aprovados pela AAC do SoD, exceto:

  5.7.8 As required by paragraph 21.29(a)(4)-I or RBAC 21, when validating a foreign TC, the
  FCD to be used as reference for the issuance of the Brazilian FCD must have been issued
  or approved by the SoD CAA, except:'
