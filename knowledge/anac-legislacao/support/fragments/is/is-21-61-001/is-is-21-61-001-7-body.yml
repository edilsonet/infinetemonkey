title: FINAL DISPOSITIONS
text: '7. FINAL DISPOSITIONS

  7.1 O conteúdo desta IS pode não ser completamente aplicável a situações cujo assunto seja
  descrito em acordos entre o Brasil e outros países e entre a ANAC e outras autoridades de
  aviação civil. Nessas situações, prevalecerá o acordo correspondente.

  7.1 The content of this IS may not be completely applicable to situations whose subject
  is described in agreements between Brazil and other countries and between ANAC and other
  civil aviation authorities. In these situations, the corresponding agreement shall prevail.

  7.2 Esta IS é publicada em português e em inglês, formatada em duas colunas. Caso existam
  divergências entre as versões em português e inglês, a versão em português prevalecerá.

  7.2 This IS is published in Portuguese and in English, formatted in two columns. In the
  event of any discrepancies between the Portuguese and English versions of this document,
  the Portuguese version shall take precedence.

  7.3 Os casos omissos serão dirimidos pela ANAC.

  7.3 Omitted cases will be resolved by ANAC.'
