  NOTA: O uso de novas tecnologias, por exemplo, Realidade Virtual (Virtual Reality - VR)
  ou Realidade Mista (Mixed Reality - MR) é permitido quando for demonstrado à ANAC que tal
  método/dispositivo é adequado para sua finalidade.

  NOTE: Use of new technologies,e.g., Virtual Reality - VR or Mixed Reality - MR, is allowed
  when it has been demonstrated to ANAC that such method/ device is suitable for its purpose.

  C.3.6 Níveis de Diferença de Exame

  C.3.6 Checking Difference Levels

  C.3.6.1 Exame Inicial e Recorrente. O exame de diferenças aborda quaisquer requisitos de
  qualificação de piloto pertinentes e quaisquer outras verificações especificadas pelos documentos
  OSD FC. Os níveis de exame inicial e recorrente são os mesmos, a menos que especificado
  de outra forma pela ANAC. Em certos casos, pode ser possível atingir satisfatoriamente os
  objetivos de exame recorrente em dispositivos que não atendem aos requisitos de exame inicial.
  Em tais casos, a ANAC pode recomendar certos dispositivos que não atendem aos requisitos
  de exame inicial para uso na condução de exames recorrentes. Quando houver dúvidas sobre
  a competência do piloto ou adequação do programa, a ANAC pode exigir o exame em dispositivo
  de nível inicial.

  C.3.6.1 Initial and Recurrent Checking. Differences checking addresses any pertinent pilot
  qualification requirements and any other checks specified by OSD FC documents. Initial and
  recurrent checking levels are the same unless otherwise specified by the ANAC. In certain
  instances, it may be possible to satisfactorily accomplish recurrent checking objectives
  in devices that do not meet initial checking requirements. In such instances, the ANAC may
  recommend certain devices that do not meet initial check requirements for use to administer
  recurring checks. When doubt exists regarding pilot competency or program adequacy, ANAC
  may require checking in the initial level device.

  C.3.6.2 Exame de Nível A. O exame de nível A indica que nenhum exame é necessário no momento
  do treinamento. Um piloto é responsável pelo conhecimento de cada aeronave relacionada voada.
  Itens de diferença devem ser incluídos como parte integrante das verificações de proficiência
  recorrentes subsequentes.

  C.3.6.2 Level A Checking. Level A checking indicates that no check is required at the time
  of training. A pilot is responsible for knowledge of each related aircraft flown. Difference
  items should be included as an integral part of subsequent recurring proficiency checks.

  C.3.6.3 Exame de Nível B. O exame de nível B indica que uma verificação de “tarefa” ou “sistemas”
  é necessária após o treinamento. O exame de nível B normalmente se aplica a tarefas ou sistemas
  específicos, como FMS, TCAS ou outros sistemas individuais ou grupos relacionados de sistemas.

  C.3.6.3 Level B Checking. Level B checking indicates that a “task” or “systems” check is
  required following training. Level B checking typically applies to particular tasks or systems
  such as FMS, TCAS, or other individual systems or related groups of systems.

  C.3.6.4 Exame de nível C. O exame de nível C requer um dispositivo adequado para atender
  aos requisitos de treinamento de diferença de nível C (ou superior) após o treinamento.
  O exame é conduzido em relação a manobras ou sistemas específicos determinados pela ANAC.
  Um exemplo de exame de nível C seria a avaliação de uma sequência de manobras demonstrando
  a capacidade de um piloto de usar um Sistema de Controle de Guiagem de Voo (Flight Guidance
  Control System - FGCS) ou FMS. Um cenário aceitável incluiria cada fase relevante do voo
  que usa o FGCS ou FMS.

  C.3.6.4 Level C Checking. Level C checking requires a device suitable for meeting level
  C (or higher) difference training requirements following training. The checking is conducted
  relative to particular maneuvers or systems determined by the ANAC. An example of level
  C checking would be the evaluation of a sequence of maneuvers demonstrating a pilot’s ability
  to use a Flight Guidance Control System - FGCS or FMS. An acceptable scenario would include
  each relevant phase of flight that uses the FGCS or FMS.

  C.3.6.5 Exame de Nível D. O exame de nível D requer uma verificação para uma ou mais aeronaves
  relacionadas após o treinamento. A verificação abrange as manobras, sistemas ou dispositivos
  específicos determinados pela ANAC. As verificações de nível D são realizadas usando cenários
  que representam um ambiente de voo em tempo real e dispositivos permitidos para treinamento
  de diferença de nível D. Uma verificação de proficiência completa é normalmente conduzida
  na aeronave base, e uma verificação de proficiência parcial na aeronave relacionada, abrangendo
  todas as diferenças pertinentes.

  C.3.6.5 Level D Checking. Level D checking requires a check for one or more related aircraft
  following training. The check covers the particular maneuvers, systems, or devices determined
  by the ANAC. Level D checks are performed using scenarios representing a real-time flight
  environment and devices permitted for level D difference training. A full proficiency check
  is typically conducted on the base aircraft, and a partial proficiency check on the related
  aircraft, covering all pertinent differences.

  C.3.6.6 Exame de nível E. A menos que especificado, a verificação de nível E requer que
  uma verificação de proficiência completa seja conduzida em um FFS de nível C ou D, ou na
  própria aeronave. Assim como em outros níveis, quando a verificação de nível E é atribuída,
  créditos ou restrições adequados podem ser aplicados para conhecimento, habilidades e/ou
  capacidades relacionadas a outras aeronaves pertinentes. Créditos ou restrições são especificados
  para os assuntos, procedimentos ou manobras relacionados nos documentos OSD FC e são aplicados
  por meio da tabela de DR.

  C.3.6.6 Level E Checking. Unless specified, level E checking requires that a full proficiency
  check be conducted in a level C or D FFS, or in the aircraft itself. As with other levels,
  when level E checking is assigned, suitable credit or constraints may be applied for knowledge,
  skills, and/or abilities related to other pertinent related aircraft. Credits or constraints
  are specified for the subjects, procedures, or maneuvers shown in the OSD FC documents and
  are applied through the DR table.

  NOTA: A atribuição de requisitos de exame de nível E por si só não resulta na determinação
  de uma habilitação de tipo separada. Apenas a atribuição de requisitos de treinamento de
  nível E pode resultar em uma determinação de habilitação de tipo separada.

  NOTE: Assignment of level E checking requirements alone does not result in determining a
  separate type rating. Only the assignment of level E training requirements may result in
  a separate type rating determination.

  C.3.7 Níveis de diferença de experiência recente

  C.3.7 Currency Difference Levels

  C.3.7.1 As diferenças de experiência recente abordam quaisquer níveis de diferença de experiência
  recente e treinamento recorrente.

  C.3.7.1 Currency differences address any currency and recurrent training difference levels.

  C.3.7.2 Experiência recente de Nível A. A experiência recente de Nível A é comum a cada
  aeronave e não requer rastreamento separado. A manutenção da experiência recente em qualquer
  aeronave é suficiente para qualquer outra aeronave dentro da mesma habilitação de tipo.

  C.3.7.2 Level A Currency. Level A currency is common to each aircraft and does not require
  separate tracking. Maintenance of currency in any aircraft suffices for any other aircraft
  within the same type rating.

  C.3.7.3 Experiência recente de Nível B. A experiência recente de nível B é relacionada ao
  conhecimento, normalmente obtida por meio de autorrevisão por pilotos individuais para uma
  aeronave específica. A autorrevisão é geralmente realizada por meio da revisão do material
  fornecido pelo operador ao piloto. Essa experiência recente pode ser realizada por iniciativa
  individual de um piloto individual, no entanto, o operador identificará o material e a frequência
  ou outras situações nas quais o material deve ser revisado. A autorrevisão pode ser baseada
  em informações de manuais, boletins, placares de aeronaves, memorandos, folhetos de classe,
  vídeos ou outros métodos que descrevam as diferenças, procedimentos, manobras ou limites
  para a aeronave que os pilotos estão voando. Exemplos de conformidade com a experiência
  recente de nível B são:

  C.3.7.3 Level B Currency. Level B currency is “knowledge related”, typically achieved through
  self-review by individual pilots for a particular aircraft. Self-review is usually accomplished
  by review of material provided by the operator to pilot. Such currency may be undertaken
  at an individual pilot’s initiative, however, the operator will identify the material and
  the frequency or other situations in which the material should be reviewed. Self-review
  may be based on manual information, bulletins, aircraft placards, memos, class handouts,
  videos, or other methods that describe the differences, procedures, maneuvers, or limits
