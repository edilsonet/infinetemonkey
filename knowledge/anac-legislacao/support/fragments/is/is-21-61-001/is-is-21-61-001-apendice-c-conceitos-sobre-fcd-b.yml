section_title: APÊNDICE C - CONCEITOS SOBRE FCD
subsection_id: b
cite: apendice-c-conceitos-sobre-fcd(b)
title: apendice-c-conceitos-sobre-fcd(b)
text: 'b) Information that highlights a difference that, once brought to the attention of
  the pilot, is self-evident, inherently obvious, and easily understood, e.g., different location
  of a communication radio panel, a different exhaust gas temperature limit that is placarded,
  or changes to non-normal “read and do” procedures.

  C.3.5.2 Treinamento de Nível B. O treinamento de nível B se aplica a aeronaves relacionadas
  com diferenças de sistema ou procedimento que podem ser adequadamente abordadas por meio
  de instrução assistida. No nível B, a instrução assistida é apropriada para garantir a compreensão
  do piloto, enfatizar problemas, fornecer um método padronizado de apresentação de material
  ou auxiliar na retenção de material após o treinamento. A instrução assistida de nível B
  pode utilizar apresentações audiovisuais, instruções tutoriais baseadas em computador, palestras
  ou vídeos. Situações não cobertas pelo treinamento de nível A podem exigir treinamento de
  nível B (ou níveis mais altos) se certos testes descritos em itens posteriores falharem.

  C.3.5.2 Level B Training. Level B training applies to related aircraft with system or procedure
  differences that can adequately be addressed through aided instruction. At level B, aided
  instruction is appropriate to ensure pilot understanding, emphasize issues, provide a standardized
  method of presenting material, or aid retention of material following training. Level B
  aided instruction can utilize audiovisual presentations, computer-based tutorial instruction,
  stand-up lectures, or videos. Situations not covered under level A training may require
  level B training (or higher levels) if certain tests described in later items fail.

  C.3.5.3 Treinamento de Nível C. O treinamento de Nível C se aplica a aeronaves relacionadas
  que têm diferenças parciais de tarefas que afetam conhecimento, habilidades e/ou capacidades.
  O treinamento de Nível C só pode ser realizado por meio do uso de dispositivos capazes de
  treinamento de sistemas. Os objetivos do treinamento se concentram em dominar sistemas,
  procedimentos ou tarefas individuais, em oposição à execução de operações e manobras de
  voo altamente integradas em "tempo real". O Nível C pode exigir autoinstrução ou instrução
  assistida, mas não pode ser adequadamente abordado apenas por um requisito de conhecimento.
  Os dispositivos de treinamento são necessários para suplementar a instrução, garantir a
  obtenção ou retenção de habilidades e capacidades do piloto e realizar as tarefas mais complexas,
  geralmente relacionadas à operação de sistemas específicos da aeronave. Normalmente, o método
  de treinamento mínimo aceitável para o treinamento de nível C seria o Treinamento Interativo
  Baseado em Computador (Interactive Computer-based Training - ICBT), treinadores de procedimentos
  de cabine de voo, treinadores de tarefas parciais, por exemplo, Sistema de Gerenciamento
  de Voo (Flight Management System - FMS) ou Sistema de Alerta de Tráfego e Prevenção de Colisões
  (Traffic Alert Collision and Avoidance System - TCAS), um Dispositivo de Treinamento de
  Voo (Flight Training Device - FTD) de nível 4 ou 5, ou uma aeronave estática.

  C.3.5.3 Level C Training. Level C training applies to related aircraft having part task
  differences that affect knowledge, skills, and/or abilities. Level C training can only be
  accomplished through use of devices that are capable of systems training. The training objectives
  focus on mastering individual systems, procedures, or tasks, as opposed to performing highly
  integrated flight operations and maneuvers in “real time.” Level C may require self-instruction
  or aided instruction but cannot be adequately addressed by a knowledge requirement alone.
  Training devices are required to supplement instruction, ensure attainment or retention
  of pilot skills and abilities, and accomplish the more complex tasks, usually related to
  operation of particular aircraft systems. Typically, the minimum acceptable training method
  for level C training would be Interactive Computer-based Training - ICBT, cockpit procedure
  trainers, part task trainers (e.g., Flight Management System - FMS or Traffic Alert Collision
  and Avoidance System - TCAS), a level 4 or 5 Flight Training Device - FTD, or a static aircraft.

  C.3.5.4 Treinamento de Nível D. O treinamento de Nível D se aplica a aeronaves relacionadas
  que têm diferenças integrais de tarefas em relação a conhecimento, habilidades e/ou capacidades.
  O treinamento de Nível D só pode ser realizado com dispositivos capazes de executar manobras
  de voo em um ambiente dinâmico em tempo real. Os dispositivos permitem a integração de conhecimento,
  habilidades e capacidades em um ambiente de voo simulado, envolvendo combinações de tarefas
  orientadas à operação e carga de trabalho de tarefas realista para cada fase de voo relevante.
  O treinamento de Nível D requer o domínio de habilidades inter-relacionadas que não podem
  ser adequadamente abordadas pela aquisição separada dessas habilidades. No entanto, as diferenças
  não são tão significativas que um treinamento de transição completo seja necessário. O treinamento
  para diferenças de nível D requer um dispositivo de treinamento que tenha integração precisa
  e de alta fidelidade de sistemas e controles, e indicações realistas de instrumentos. O
  treinamento de Nível D também pode exigir manobras, dicas visuais, dicas de movimento, dinâmica,
  carga nos controles ou condições ambientais específicas. Fenômenos meteorológicos como baixa
  visibilidade, CAT III ou tesoura de vento podem ou não ser incorporados. Caso características
  simplificadas ou genéricas de um tipo de aeronave sejam usadas em dispositivos para satisfazer
  o treinamento de nível D de diferença, não deve ocorrer treinamento negativo significativo
  como resultado da simplificação. Normalmente, o método de treinamento mínimo aceitável para
  treinamento de nível D seria o FTD nível 6.

  C.3.5.4 Level D Training. Level D training applies to related aircraft having full task
  differences of knowledge, skills, and/or abilities. Level D training can only be accomplished
  with devices capable of performing flight maneuvers in a dynamic real-time environment.
  The devices enable integration of knowledge, skills, and abilities in a simulated flight
  environment, involving combinations of operationally oriented tasks and realistic task loading
  for each relevant phase of flight. Level D training requires mastery of interrelated skills
  that cannot be adequately addressed by separate acquisition of those skills. However, the
  differences are not so significant that a full transition training course is required. Training
  for level D differences requires a training device that has accurate, high-fidelity integration
  of systems and controls, and realistic instrument indications. Level D training may also
  require maneuvers, visual cues, motion cues, dynamics, control loading, or specific environmental
  conditions. Weather phenomena such as low visibility, CAT III, or windshear may or may not
  be incorporated. Where simplified or generic characteristics of an aircraft type are used
  in devices to satisfy difference level D training, significant negative training must not
  occur as a result of the simplification. Typically, the minimum acceptable training method
  for level D training would be FTD level 6.

  C.3.5.5 Treinamento de Nível E. O treinamento de nível E se aplica a aeronaves com significativas
  diferenças integrais de tarefas que exigem um ambiente de alta fidelidade para obter ou
  manter conhecimento, habilidades ou capacidades. O treinamento de nível E só pode ser satisfeito
  pelo uso de um FFS qualificado no nível C ou D consistente com os critérios da ANAC. O treinamento
  de nível E, se feito em uma aeronave, deve ser modificado por razões de segurança, onde
  as manobras podem resultar em elevado risco (por exemplo, um motor ajustado com potência
  reduzida para simular uma falha do motor). Assim como em outros níveis, quando o treinamento
  de nível E é atribuído, créditos ou restrições apropriados podem ser aplicados para conhecimento,
  habilidades e/ou capacidades relacionadas a outras aeronaves pertinentes. Créditos ou restrições
  são especificados para os assuntos, procedimentos ou manobras relacionados nos documentos
  OSD FC e são aplicados por meio das tabelas de DR.

  C.3.5.5 Level E Training. Level E training applies to aircraft having such significant full
  task differences that a high-fidelity environment is required to attain or maintain knowledge,
  skills, or abilities. Training at level E can only be satisfied by the use of a FFS qualified
  at level C or D consistent with ANAC criteria. Level E training, if done in an aircraft,
  should be modified for safety reasons where maneuvers can result in a high degree of risk
  (e.g., an engine set at idle thrust to simulate an engine failure). As with other levels,
  when level E training is assigned, suitable credit or constraints may be applied for knowledge,
  skills, and/or abilities related to other pertinent related aircraft. Credits or constraints
  are specified for the subjects, procedures, or maneuvers shown in OSD FC documents and are
  applied through the DR tables.

