  C.3.5 Níveis de diferenças de treinamento

  C.3.5 Training Difference Levels

  C.3.5.1 Treinamento de Nível A. O treinamento de Nível A é aquele treinamento entre aeronaves
  relacionadas que pode ser adequadamente abordado por meio de autoinstrução. O treinamento
  de Nível A representa um requisito de conhecimento que, uma vez que as informações apropriadas
  são fornecidas, a compreensão e a conformidade podem ser presumidas. A conformidade com
  o Nível A é alcançada por métodos como emissão de revisões de páginas do manual operacional,
  disseminação de boletins operacionais ou folhetos de diferenças para descrever pequenas
  diferenças entre aeronaves. O treinamento de Nível A é normalmente limitado às seguintes
  situações:

  C.3.5.1 Level A Training. Level A training is that training between related aircraft that
  can adequately be addressed through self-instruction. Level A training represents a knowledge
  requirement that, once appropriate information is provided, understanding and compliance
  can be assumed. Level A compliance is achieved by such methods as issuance of operating
  manual page revisions, dissemination of operating bulletins, or differences handouts to
  describe minor differences in aircraft. Level A training is normally limited to the following
