text: 'c) DR 3: Maneuvers - Operational differences encompass normal, abnormal and emergency
  situations and include any change in aircraft handling and flight management. It is necessary
  to establish a list of operational items for consideration on which an analysis of differences
  can be made. The operational analysis should take the following into account:

  I- dimensões da cabine de comando (tamanho, ângulo de corte e altura do olho do piloto);

  I- flight deck dimensions (size, cut-off angle and pilot eye height);

  II- diferenças nos controles (projeto, forma, localização e função);

  II- differences in controls (design, shape, location and function);

  III- função adicional ou alterada (controles de voo) em condições normais ou anormais;

  III- additional or altered function (flight controls) in normal or abnormal conditions;

  IV- qualidades de pilotagem (incluindo inércia) em configurações normais e anormais;

  IV- handling qualities (including inertia) in normal and in abnormal configurations;

  V- desempenho da aeronave em manobras específicas;

  V- aircraft performance in specific maneuvers;

  VI- estado da aeronave após uma falha;

  VI aircraft status following a failure;

  VII- gerenciamento (como Monitoramento Centralizado Eletrônico da Aeronave (Electronic Centralized
  Aircraft Monitoring - ECAM), Sistema de Indicação de Motores e Alerta de Tripulação (Engine
  Indication and Crew Alerting System - EICAS), seleção de auxílios à navegação e listas de
  verificação automáticas).

  VII- management (such as Electronic Centralized Aircraft Monitoring - ECAM, Engine Indication
  and Crew Alerting System - EICAS, navaid selection and automatic checklists).

  C.2 Tabela de Requisitos Mestres de Diferenças (Master Difference Requirement - MDR)

  C.2 Master Difference Requirement - MDR table

  C.2.1 Com base nas tabelas de DR estabelecidas de acordo com a seção C.1, as tabelas de
  MDR devem ser incluídas nos FCD.

  C.2.1 Based on the DR tables that are established in accordance with section C.1, MDR tables
  must be included in the FCD.

  C.2.2 As tabelas de MDR são especificadas em termos dos níveis mínimos de diferença para
  treinamento, exame e experiência recente, e incluem o maior nível de diferenças identificado
  nas tabelas de DR aplicáveis.

  C.2.2 MDR tables are specified in terms of the minimum difference levels for training, checking
  and currency, and include the highest difference level identified in the applicable DR tables.

