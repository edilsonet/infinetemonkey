  C.3 Níveis de Diferenças

  C.3 Difference Levels

  C.3.1 Níveis de diferença são usados para identificar a extensão das diferenças entre uma
  aeronave base e uma candidata com referência aos elementos descritos nas tabelas de DR.
  Esses níveis são proporcionais às diferenças entre uma aeronave base e uma candidata. Uma
  gama de cinco níveis de diferenças em ordem crescente de requisitos, identificados como
  A até E, são especificados para treinamento, exame e experiência recente.

  C.3.1 Difference levels are used to identify the extent of difference between a base and
  a candidate aircraft with reference to the elements described in the DR tables. These levels
  are proportionate to the differences between a base and a candidate aircraft. A range of
  five difference levels in order of increasing requirements, identified as A through E, are
  specified for training, checking, and currency.

  C.3.2 Os níveis de diferenças se aplicam quando há uma diferença com potencial para afetar
  a segurança de voo entre uma aeronave base e uma candidata. As diferenças também podem afetar
  o conhecimento, as habilidades ou as capacidades exigidas de um piloto. Se não houver diferenças,
  ou se as diferenças existirem, mas não afetarem a segurança de voo, ou se as diferenças
  existirem, mas não afetarem o conhecimento, as habilidades ou as capacidades, então os níveis
  de diferença não são atribuídos nem aplicáveis à qualificação do piloto. Quando os níveis
  de diferença se aplicam, cada nível é baseado em uma escala de diferenças relacionadas a
  características de projeto, sistemas ou manobras. Ao avaliar os efeitos das diferenças,
  tanto as características de voo quanto os procedimentos são considerados, pois as características
  de voo abordam qualidades de pilotagem e desempenho, enquanto os procedimentos incluem itens
  normais, anormais e de emergência.

  C.3.2 Difference levels apply when a difference with the potential to affect flight safety
  exists between a base and a candidate aircraft. Differences may also affect the knowledge,
  skills, or abilities required from a pilot. If no differences exist, or if differences exist
  but do not affect flight safety, or if differences exist but do not affect knowledge, skills,
  or abilities, then difference levels are neither assigned nor applicable to pilot qualification.
  When difference levels apply, each level is based on a scale of differences related to design
  features, systems, or maneuvers. In assessing the effects of differences, both flight characteristics
  and procedures are considered since flight characteristics address handling qualities and
  performance, while procedures include normal, abnormal and emergency items.

  C.3.3 Os níveis de treinamento, exame e experiência recente são atribuídos independentemente,
  mas são vinculados dependendo das diferenças entre uma aeronave base e uma candidata. O
  treinamento no nível E normalmente identifica que a aeronave candidata é um tipo diferente
  em relação à aeronave base.

  C.3.3 Levels for training, checking, and currency are assigned independently, but are linked
  depending on the differences between a base and a candidate aircraft. Training at level
  E normally identifies that the candidate aircraft is a different type to the base aircraft.

