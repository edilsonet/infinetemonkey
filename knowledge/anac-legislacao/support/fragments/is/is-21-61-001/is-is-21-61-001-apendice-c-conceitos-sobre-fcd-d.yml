text: 'd) Other methods as determined or found acceptable by the ANAC.

  C.3.7.4.1 Quando perdida, a experiência recente pode ser restabelecida completando os itens
  necessários usando um dispositivo igual ou superior ao especificado para treinamento e exame
  de diferenças de nível C. Outros meios para restabelecer a experiência recente incluem voos
  com um instrutor de voo devidamente qualificado durante treinamento ou em operações em rota,
  conclusão de treinamento de proficiência ou uma verificação de proficiência. Em alguns casos,
  um período formal de nova familiarização na aeronave real com o sistema aplicável operando
  enquanto no solo pode ser aceitável se permitido pela ANAC. Esses períodos são concluídos
  usando um procedimento estabelecido pelo operador sob a supervisão de um piloto designado
  pelo operador.

  C.3.7.4.1 When currency is lost, currency may be re-established by completing required items
  using a device equal to or higher than that specified for level C difference training and
  checking. Other means to re-establish currency include flights with an appropriately qualified
  check airman, completion of proficiency training, or a proficiency check. In some instances,
  a formal refamiliarization period in the actual aircraft with the applicable system operating
  while on the ground may be acceptable if permitted by the ANAC. Such periods are completed
  using an operator-established procedure under the supervision of a pilot designated by the
  operator.

  C.3.7.5 Experiência recente de Nível D. A experiência recente de nível D está relacionada
  a manobras designadas e aborda o conhecimento e as habilidades necessárias para executar
  tarefas de controle de aeronaves em tempo real, com uso integrado de sistemas e procedimentos
  associados. A experiência recente de nível D também pode abordar certas diferenças nas características
  de voo, incluindo o desempenho de quaisquer manobras necessárias e procedimentos normais,
  anormais e de emergência relacionados para uma aeronave específica. Uma aplicação típica
  da experiência recente de nível D é especificar manobras selecionadas, como decolagem, subida,
  chegada, aproximação ou pouso, que devem ser realizadas usando um FGCS específico e sistema
  de mostradores de instrumentos. Um piloto deve voar uma aeronave relacionada equipada com
  o FGCS e um sistema de mostradores específico com frequência suficiente para manter a familiaridade
  e a competência dentro do período de experiência recente especificado, ou a experiência
  recente deve ser restabelecida. As restrições de experiência recente para o nível D são
  estabelecidas pela ANAC. Quando a experiência recente de nível D se aplica, as experiências
  recentes de nível B e C pertinentes também devem ser abordadas. Exemplos de métodos aceitáveis
  para abordar a experiência recente de nível D são:

  C.3.7.5 Level D Currency. Level D currency is related to designated maneuvers, and addresses
  knowledge and skills required for performing aircraft control tasks in real time, with integrated
  use of associated systems and procedures. Level D currency may also address certain differences
  in flight characteristics including performance of any required maneuvers and related normal,
  abnormal and emergency procedures for a particular related aircraft. A typical application
  of level D currency is to specify selected maneuvers, such as takeoff, departure, arrival,
  approach, or landing, which are to be performed using a particular FGCS and instrument display
  system. Either a pilot must fly a related aircraft equipped with the FGCS and particular
  display system sufficiently often to retain familiarity and competence within the specified
  currency period, or currency must be re-established. Currency constraints for level D are
  established by the ANAC. When level D currency applies, pertinent level B and level C currency
  must also be addressed. Examples of methods acceptable for addressing level D currency are:'
