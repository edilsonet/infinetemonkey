text: 'f) Other methods as determined or found acceptable by the ANAC.

  C.3.7.5.1 Quando perdida, a experiência recente pode ser restabelecida completando manobras
  pertinentes usando um dispositivo igual ou superior ao especificado para treinamento e exame
  de diferenças de nível D. Outros meios para restabelecer a experiência recente incluem voos
  com um instrutor de voo devidamente qualificado durante treinamento ou em operações em rota,
  conclusão de treinamento de proficiência ou uma verificação de proficiência.

  C.3.7.5.1 When currency is lost, currency may be re-established by completing pertinent
  maneuvers using a device equal to or higher than that specified for level D difference training
  and checking. Other means to re-establish currency include flight with an appropriately
  qualified flight instructor during training or in line operations, completion of proficiency
  training, or a proficiency check.

  C.3.7.6 Experiência recente de Nível E. A experiência recente de nível E pode especificar
  itens de experiência recente de sistema, procedimento ou manobra necessários para operações
  seguras, conforme identificado pela ANAC, a serem realizados em um FFS de nível C/D para
  aquela aeronave relacionada. As recomendações da ANAC relacionadas à decolagem e pouso são
  emitidas de uma forma que aborde a experiência necessária de sistema ou manobra. Por exemplo,
  se FGCS, FMS, Sistema Eletrônico de Instrumentos de Voo (Electronic Flight Instrument System
  - EFIS), navegação ou outro sistema ou experiência de manobra for a base para um requisito
  de experiência recente, a aprovação do programa de um operador no nível E inclui o uso desses
  sistemas em conjunto com o cumprimento dos requisitos de decolagem e pouso. Neste caso,
  fazer três decolagens e pousos FFS em circuito de tráfego sob Regras de Voo Visual (Visual
  Flight Rules - VFR) sem usar o FGCS, EFIS ou FMS pode não ser suficiente para atender aos
  requisitos de experiência recente de nível E. Quando perdida, a experiência recente pode
  ser restabelecida completando manobras pertinentes usando um dispositivo especificado para
  treinamento e verificação de diferença de nível E. Outros meios para restabelecer a experiência
  recente incluem voar com um instrutor de voo devidamente qualificado durante treinamento
  ou em operações em rota, concluir o treinamento de proficiência ou uma verificação de proficiência.

  C.3.7.6 Level E Currency. Level E currency may specify system, procedure, or maneuver currency
  item(s) necessary for safe operations, as identified by the ANAC, to be accomplished in
  a Level C/D FFS for that related aircraft. ANAC recommendations related to takeoff and landing
  are applied in a way that addresses needed system or maneuver experience. For example, if
  FGCS, FMS, Electronic Flight Instrument System - EFIS, navigation, or other system or maneuver
  experience is the basis for a currency requirement, approval of an operator’s program at
  level E includes the use of those systems in conjunction with satisfying takeoff and landing
  requirements. In this instance, making three FFS takeoffs and landings in Visual Flight
  Rules - VFR closed traffic without using the FGCS, EFIS, or FMS may not be sufficient to
  meet level E currency requirements. When currency is lost, currency may be re-established
  by completing pertinent maneuvers using a device specified for level E difference training
  and checking. Other means to re-establish currency include flight with an appropriately
  qualified check airman during training or in line operations, completion of proficiency
  training, or a proficiency check.

  NOTA: A atribuição de requisitos de experiência recente de nível E por si só não resulta
  na determinação de uma habilitação de tipo separada. Apenas a atribuição de requisitos de
  treinamento de nível E pode resultar em uma determinação de habilitação de tipo separada.

  NOTE: Assignment of level E currency requirements alone does not result in determining a
  separate type rating. Only the assignment of level E training requirements may result in
  a separate type rating determination.

  C.4 Competência em relação a procedimentos anormais e de emergência.

  C.4 Competency Regarding Abnormal, and Emergency Procedures

  C.4.1 A competência para manobras ou procedimentos anormais e de emergência é geralmente
  abordada por requisitos de exame. Manobras ou procedimentos anormais e de emergência específicos
  podem não ser considerados obrigatórios para exame ou treinamento. Nessa situação, pode
  ser necessário praticar ou demonstrar periodicamente essas manobras ou procedimentos especificando
  requisitos de experiência recente para essas manobras ou procedimentos.

  C.4.1 Competency for abnormal and emergency maneuvers or procedures is generally addressed
  by checking requirements. Particular abnormal and emergency maneuvers or procedures may
  not be considered mandatory for checking or training. In this situation it may be necessary
  to periodically practice or demonstrate those maneuvers or procedures specifying currency
  requirements for those maneuvers or procedures.

