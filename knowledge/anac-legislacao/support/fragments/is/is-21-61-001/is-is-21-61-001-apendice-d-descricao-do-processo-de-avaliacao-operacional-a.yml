title: apendice-d-descricao-do-processo-de-avaliacao-operacional(a)
text: 'a) T1, T2 and T3 evaluations:

  I- As avaliações T1, T2 e T3 devem ser realizadas para validar os requisitos de diferenças
  para treinamento, exame e experiência recente entre uma aeronave base e uma candidata que
  compartilham o mesmo projeto básico.

  I- The T1, T2 and T3 evaluations must be carried out to validate difference training, checking,
  and currency requirements between a base and a candidate aircraft that share the same basic
  design.

  II- Os resultados dessas avaliações determinam se a aeronave é um novo tipo ou uma variante,
  ou uma modificação de um tipo ou variante existente. O nível de diferenças determina os
  requisitos mínimos de treinamento, exame e experiência recente aplicáveis à aeronave candidata.

  II- The results of these evaluations determine whether the aircraft is a new type or a variant,
  or a modification of an existing type or variant. The level of differences determines the
  minimum required training, checking, and currency requirements applicable to the candidate
  aircraft.

  III- Além disso, quando o requerente solicita aprovação para um treinamento de habilitação
  de tipo inicial reduzido com base na experiência anterior em tipos de aeronaves semelhantes
  (habilitações de tipo diferentes), os testes T2 e T3 devem ser usados para essa finalidade.

  III- Additionally, when the applicant requests approval for a reduced initial type rating
  training course based on previous experience on similar aircraft types (different type ratings),
  the T2 and T3 tests must be used for this purpose.'
