text: 'APÊNDICE D - DESCRIÇÃO DO PROCESSO DE AVALIAÇÃO OPERACIONAL

  APPENDIX D - OPERATIONAL EVALUATION PROCESS DESCRIPTION

  D.1 Visão geral do processo de avaliação.

  D.1 Evaluation Process Overview.

  D.1.1 Seis avaliações padrão (T1, T2, T3, T4, T5 e T6) são definidas no Apêndice E. Elas
  são usadas para definir MDRs, programas de treinamento aceitáveis e outras disposições,
  e para definir os requisitos de habilitação de tipo. Uma ou mais dessas seis avaliações
  são aplicadas, dependendo dos objetivos do requerente, do nível de diferenças pretendido
  e do resultado bem-sucedido de quaisquer avaliações anteriores usadas na identificação de
  MDRs.

  D.1.1 Six standard evaluations (T1, T2, T3, T4, T5 and T6) are defined in Appendix E. They
  are used to set MDRs, acceptable training programs, and other provisions, and to define
  the type rating requirements. One or more of these six evaluations are applied, depending
  on the objectives of the applicant, on the difference level sought, and on the successful
  outcome of any previous evaluations used in identifying MDRs.

  D.1.2 As seguintes avaliações são utilizadas:

