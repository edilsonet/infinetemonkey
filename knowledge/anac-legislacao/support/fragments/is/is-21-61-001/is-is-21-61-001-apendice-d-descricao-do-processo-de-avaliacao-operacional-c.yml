  D.2 Avaliações de níveis de diferença

  D.2 Difference Level Evaluations

  D.2.1 Os testes T1 a T5 são usados para avaliar uma aeronave candidata para habilitação
  de tipo de piloto, treinamento mínimo, avaliações operacionais e crédito para operações
  em mais de um tipo ou variante. A avaliação T6 pode ser usada para estabelecer o CTLC entre
  aeronaves relacionadas quando não demonstrado anteriormente em um teste T2.

  D.2.1 Tests T1 to T5 are used to evaluate a candidate aircraft on the pilot type rating,
  minimum syllabus, operational evaluations, and credit for operations on more than one type
  or variant. The T6 evaluation may be used to establish the CTLC between related aircraft
  when not previously demonstrated in a T2 evaluation.

  D.2.2 Uma ou mais dessas seis avaliações são aplicadas dependendo dos objetivos do requerente,
  do nível de diferença proposto e do resultado bem-sucedido de quaisquer avaliações anteriores
  usadas na identificação de MDR.

  D.2.2 One or more of these six evaluations are applied depending on the objectives of the
  applicant, difference level sought, and the successful outcome of any previous evaluations
  used in identifying MDR.

  D.2.3 Etapas do processo de avaliação

  D.2.3 Steps of the evaluation process

  D.2.3.1 Quando uma avaliação é realizada, os testes T1, T2 e T3 comparam a aeronave candidata
  com a aeronave base. Tabelas DR e tabelas MDR (entre variantes de tipos de aeronaves) são
  estabelecidas, abordando as diferenças entre a aeronave base e a candidata.

  D.2.3.1 When an evaluation is carried out, the T1, T2, and T3 tests compare the candidate
  aircraft with the base aircraft. DR tables and MDR tables (between variants of aircraft
  types) are established, which address the differences between the base and the candidate
  aircraft.

  D.2.3.2 Para estabelecer dados para uma direção que não foi avaliada anteriormente, uma
  avaliação adicional usando os testes T acima pode ser realizada com base em um requerimento.
  Em geral, as diferenças de nível A e B não requerem testes bidirecionais.

  D.2.3.2 To establish data for a direction that was not previously assessed, an additional
  evaluation using the above T tests may be carried out based on an application. In general,
  level A and B differences do not require two-way testing.

  D.2.3.3 Antes da avaliação, as seguintes atividades são realizadas:

