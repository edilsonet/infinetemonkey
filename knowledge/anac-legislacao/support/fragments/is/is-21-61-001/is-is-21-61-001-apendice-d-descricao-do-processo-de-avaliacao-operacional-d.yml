  Versão em inglês (Version in English):


  D.1.4 Para um novo CT, o tipo da aeronave deve ser determinado e o programa mínimo para
  um treinamento de habilitação de tipo inicial deve ser aprovado. O meio de cumprimento para
  a aprovação do FCD é, neste caso, o teste T5.

  D.1.4 For a new TC, the type of the aircraft must be determined and the minimum syllabus
  for an initial type rating training course must be approved. The means of compliance for
  the approval of the FCD is, in this case, the T5 test.

  D.1.5 Além do acima, o requerente pode solicitar a aprovação de uma redução no treinamento
  de habilitação de tipo inicial com base na experiência anterior em tipos de aeronaves semelhantes,
  bem como a aprovação de crédito com base na comunalidade para operações em mais de um tipo.
  Neste caso, os testes T2 e T3 são usados como meios de cumprimento.

  D.1.5 In addition to the above, the applicant may request the approval of a reduction in
  the initial type rating training based on previous experience on similar aircraft types,
  as well as the approval of credit based on commonality for operations on more than one type.
  In this case, the T2 and T3 tests are used as means of compliance.

  D.1.6 Ao solicitar uma modificação a um CT existente que possua FCD associados, ou a emissão
  de um Certificado Suplementar de Tipo - CST, o requerente avalia o impacto das modificações
  ao projeto de tipo nos FCD. Essas modificações podem ou não determinar uma nova variante,
  ou, se as modificações forem significativas, podem determinar um novo tipo de aeronave para
  fins de habilitação de tipo de piloto. Os testes aplicáveis são, neste caso, T1, ou T2 e
  T3.

  D.1.6 When applying for a change to an existing TC that has associated FCD, or for the issuance
  of a Supplemental Type Certificate - STC, the applicant assesses the impact of the design
  changes to the FCD. These changes may or may not determine a new variant, or, if the changes
  are significant, may determine a new type of aircraft for the purpose of pilot type rating.
  The applicable tests are, in this case, T1, or T2 and T3.

  D.1.7 Testes T - Descrição geral e finalidade

  D.1.7 T tests - General description and purpose

  D.1.7.1 Teste T1 - Equivalência funcional e treinamento

  D.1.7.1 T1 evaluation - Functional equivalence and training

  D.1.7.1.1 Quando as diferenças entre a aeronave base e a candidata não são significativas
  sob a perspectiva do piloto, e não há impacto nas qualidades de pilotagem, um teste T1 pode
  ser proposto. O T1 avalia a equivalência funcional entre a aeronave base e a candidata.
  O desempenho satisfatório da tripulação durante o teste estabelece que as diferenças entre
  a aeronave base e a candidata são consideradas menores e, consequentemente, requisitos de
  treinamento não maiores que o nível B são atribuídos.

  D.1.7.1.1 When the differences between the base and the candidate aircraft are not significant
  from the pilot’s perspective, and there is no impact on the handling qualities, a T1 test
  may be proposed. T1 assesses the functional equivalence between the base and the candidate
  aircraft. Satisfactory crew performance during the test establishes that the differences
  between the base and the candidate aircraft are considered minor, and consequently, training
  requirements no greater than level B are assigned.

  D.1.7.1.2 Se um teste T1 for dispensado ou reprovado, os testes T2 e T3 podem ser usados.
  Alternativamente, o T1 pode não ser necessário, quando a determinação da habilitação de
  tipo é feita por meio de análise.

  D.1.7.1.2 If a T1 test is waived or failed, the T2 and T3 tests may be used. Alternately
  the T1 may not be required, when the type rating determination is made through analysis.

  D.1.7.2 Teste T2 - Comparação das qualidades de pilotagem

  D.1.7.2 T2 evaluation - Handling qualities comparison

  D.1.7.2.1 O teste T2 compara qualidades de pilotagem, usando manobras de voo predeterminadas
  para confirmar que a aeronave candidata pode ser considerada uma variante da aeronave base.
  Se nenhuma diferença significativa for encontrada nas qualidades de pilotagem, o teste T2
  é bem-sucedido e um teste T3 pode ser realizado da aeronave base para a aeronave candidata,
  conforme apropriado, para validar os níveis de diferença até o nível D.

  D.1.7.2.1 The T2 test compares handling qualities, using predetermined flight maneuvers
  to confirm that the candidate aircraft may be considered a variant of the base aircraft.
  If no major differences are found in the handling qualities, then the T2 test is successful
  and a T3 test may be performed from the base to the candidate aircraft, as appropriate,
  to validate the difference levels up to level D.

  D.1.7.2.2 As manobras do teste T2 são realizadas na aeronave base ou em um simulador de
  voo da aeronave base para estabelecer uma referência e, depois, na aeronave candidata para
  comparação.

  D.1.7.2.2 T2 maneuvers are performed in the base aircraft or in a base aircraft FFS to establish
  a baseline, and then in the candidate aircraft for comparison.

  D.1.7.2.3 O perfil de avaliação do teste T2 é estabelecido por meio de uma proposta do requerente,
  com o acordo da ANAC, com base nas diferenças que podem potencialmente afetar as qualidades
  de pilotagem entre a aeronave base e a candidata. O teste T2 consiste em uma comparação
  entre as manobras de verificação de proficiência de habilitação de tipo de piloto selecionadas
  que são realizadas primeiro na aeronave base e depois na aeronave candidata. Um FFS nível
  D aprovado pode ser usado no lugar da aeronave base e, quando considerações de segurança
  assim o exigirem, no lugar da aeronave candidata.

  D.1.7.2.3 The T2 evaluation profile is established via an applicant’s proposal, with ANAC
  agreement, based on the differences that may potentially affect the handling qualities between
  the base and the candidate aircraft. The T2 test consists of a comparison between the selected
  pilot type rating proficiency check maneuvers that are performed first in the base aircraft
  and then in the candidate aircraft. An approved level D FFS may be used in place of the
  base aircraft, and when safety considerations dictate so, in place of the candidate aircraft.

  D.1.7.2.4 Embora os testes T2 devam sempre ser realizados na aeronave candidata, algumas
  partes que podem afetar significativamente a segurança da tripulação (como falhas de controle
  de voo) podem ser conduzidas em um FSTD adequado para o teste. Os pilotos corpos de prova
  são observados e fornecem feedback sobre o grau de dificuldade na execução de manobras na
  aeronave candidata em comparação com a aeronave base.

  D.1.7.2.4 Although T2 evaluations should always be carried out in the candidate aircraft,
  some portions that may significantly affect crew safety (such as flight control failures)
  may be conducted in an FSTD suitable for the test. Subject pilots are observed and provide
  feedback on the degree of difficulty in performing maneuvers in the candidate aircraft compared
  to the base aircraft.

  D.1.7.3 Teste T3 - Diferenças e treinamento em sistemas e equipamentos

  D.1.7.3 T3 evaluation - System and equipment differences and training

  D.1.7.3.1 O teste tem o objetivo de identificar diferenças de sistema, equipamento, procedimento
  e manobra, e validar os requisitos propostos para treinamento de familiarização ou treinamento
  de diferenças, exame e experiência recente.

  D.1.7.3.1 The test has the purpose of identifying system, equipment, procedural, and maneuver
  differences, and of validating the proposed familiarization training or difference training,
  checking, and currency requirements.

  D.1.7.3.2 Um teste T3 bem-sucedido permite atribuir níveis de treinamento de diferença B,
  C ou D. Uma habilitação de tipo única pode ser determinada se não houver diferenças de treinamento
  maiores que nível D, ou uma habilitação de tipo diferente se forem identificadas diferenças
  de treinamento de nível E.

  D.1.7.3.2 A successful T3 test permits assigning B, C, or D difference training levels.
  The same type rating may be determined if no training differences greater than level D exist,
  or a different type rating if level E training differences are identified.

  D.1.7.3.3 Normalmente, para diferenças de nível B, uma avaliação bidirecional não é necessária.
  Normalmente, um teste T3 para validar diferenças de nível C e D é válida em apenas uma direção
  (da aeronave base para a aeronave candidata). No entanto, o requerente pode solicitar que
  um teste T3 seja conduzido em ambas as direções (da aeronave base para a candidata, e da
  aeronave candidata para a base). As tabelas MDR (somente para variantes) e DR devem refletir
  os níveis de diferença validados adequadamente.

  D.1.7.3.3 Normally, for level B differences, a two-way evaluation is not necessary. Typically,
  a T3 evaluation to validate level C and D differences is valid in one direction only (base
  to candidate aircraft). However, the applicant may request that a T3 evaluation be conducted
  in both directions (base to candidate aircraft, and candidate to base aircraft). The MDR
  (for variants only) and DR tables should reflect the validated difference levels accordingly.

  D.1.7.3.4 O teste T3 também é usado para validar um treinamento de habilitação de tipo inicial
  reduzido proposto com base em experiência anterior em tipos de aeronaves semelhantes. Neste
  caso, o propósito do teste é validar e aprovar o conteúdo proposto do treinamento de habilitação
  de tipo inicial reduzido. O resultado é um treinamento de habilitação de tipo inicial reduzido
  (diferenças de nível E ou ''novo tipo'').

  D.1.7.3.4 The T3 test is also used to validate a proposed reduced initial type rating training
  course based on previous experience on similar aircraft types. In this case, the purpose
  of the test is to validate and approve the proposed content of the reduced initial type
  rating training. The result is a reduced initial type rating training course (level E differences
  or ‘new type’).

  D.1.7.4 Teste T4 - Validação de experiência recente

  D.1.7.4 T4 evaluation - Currency validation

  D.1.7.4.1 Os testes T4 não são mostrados no fluxograma do processo de avaliação, pois eles
  só são acionados quando o requerente busca isenção dos requisitos de experiência recente
  em sistema, equipamento, procedimento e manobra, conforme definido nas tabelas DR.

  D.1.7.4.1 T4 tests are not shown in the evaluation process flowchart, since they are only
  triggered when the applicant seeks relief from the system, equipment, procedural, and maneuver
  currency requirements as set in the DR tables.

  D.1.7.5 Teste T5 - Validação do treinamento mínimo para uma nova habilitação de tipo

  D.1.7.5 T5 evaluation - Minimum syllabus validation for a new type rating

  D.1.7.5.1 O teste T5 é apropriado para um novo CT, para estabelecer e aprovar o treinamento
  mínimo para habilitação de tipo de piloto.

  D.1.7.5.1 The T5 test is appropriate for a new TC, to establish and approve the minimum
  syllabus for pilot type rating training.

  D.1.7.5.2 Os corpos de prova são pilotos que atendem aos pré-requisitos estabelecidos no
  RBAC 61 para obter uma habilitação de tipo e que são avaliados de acordo com o RBAC 61 e
  o material de orientação de verificação de proficiência da ANAC após terem concluído o programa
  de treinamento completo para habilitação de tipo proposto.

  D.1.7.5.2 Evaluation subjects are pilots who meet the prerequisites established under RBAC
  61 for obtaining a type rating, and who are checked in accordance with RBAC 61 and ANAC
  proficiency test guidance material after having undergone the proposed full type rating
  training syllabus.

  D.1.7.6 Teste T6 - CTLC

  D.1.7.6 T6 evaluation - CTLC

  D.1.7.6.1 Os corpos de prova do teste T6 são pilotos habilitados, qualificados e experientes
  na aeronave base. Eles são avaliados em sua capacidade de voar manualmente, sem treinamento
  prévio, a aeronave candidata durante a decolagem, subida inicial, bem como aproximação e
  pouso (incluindo o estabelecimento da configuração final para pouso). Ao elaborar o teste
  T6, o requerente deve considerar os efeitos nas manobras de decolagem e pouso dos seguintes
  fatores:

  D.1.7.6.1 T6 evaluation subjects are pilots who are type-rated and experienced on the base
  aircraft. They are evaluated on their ability to manually fly, with no previous training,
  the candidate aircraft through take-off, initial climb, as well as approach and landing
  (including the establishment of the final landing configuration). When designing the T6
