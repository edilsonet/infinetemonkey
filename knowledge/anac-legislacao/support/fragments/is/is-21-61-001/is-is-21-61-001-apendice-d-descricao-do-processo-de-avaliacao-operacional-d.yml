text: 'd) The T6 evaluation is used to evaluate the CTLC between different types of aircraft
  to allow credit for recent experience requirements, as required by section 61.21 of RBAC
  61 or equivalent local regulations.

  D.1.3 O fluxograma do processo de avaliação é apresentado a:

  D.1.3 The flow chart for the evaluation process is presented below:

