title: apendice-d-descricao-do-processo-de-avaliacao-operacional(f)
text: 'f) The applicant proposes test procedures, schedules, and specific interpretation of
  the possible results.

  NOTA: um FSTD deve ser qualificado pela ANAC para ser usado para uma avaliação. Alternativamente,
  e a critério da ANAC, a qualificação emitida por outra autoridade de aviação civil pode
  ser considerada.

  NOTE: a FSTD must be qualified by ANAC to be used for an evaluation. Alternatively, and
  at the discretion of the ANAC, the qualification issued by another civil aviation authority
  may be considered.

  D.3 Objetivo e resultados da avaliação

  D.3 Evaluation Purpose and Application

  D.3.1 O objetivo e o resultado da avaliação estão resumidos na tabela abaixo:

  D.3.1 The evaluation purpose and application are summarized in the table below:


  Teste

  Objetivo do teste

  Resultado

  Test

  Test purpose

  Application

  T1

  Estabelece equivalência funcional

  Define os níveis A/B

  Establishes functional equivalence

  Sets levels A/B

  T2

  Compara qualidades de pilotagem

  A aprovação permite o teste T3 e níveis B/C/D; a reprovação define o nível E e requer o
  teste T5 ou testes T2+T3 para crédito de comunalidade

  Compares handling qualities

  Pass permits T3, and B/C/D; failure sets level E and requires T5 or T2+T3 for commonality
  credit

  T3

  Avalia diferenças e estabelece requisitos de treinamento/ exame

  A aprovação define os níveis B/C/D; reprovação define o nível E e requer o teste T5 ou testes
  T2+T3 para crédito de comunalidade

  Evaluates differences and sets training/checking requirements

  Pass sets levels B/C/D; failure sets level E and requires T5 or T2+T3 for commonality credit

  T4

  Revisa os requisitos de experiência recente

  Usado para revisar a determinação anterior da ANAC, se necessário

  Revises currency requirements

  Used to revise ANAC previous determination, if needed

  T5

  Estabelece o treinamento/ exame para novas aeronaves ou aeronaves nível “E”

  Estabelece o nível E

  Sets training/checking for new or “E” aircraft

  Sets level E

  T6

  Avalia CTLC

  Estabelece requisitos de experiência recente (conforme requerido pela seção 61.21 do RBAC
  61 ou regulamentação local equivalente)

  Evaluates CTLC

  Sets recent experience requirements (as required by section 61.21 of RBAC 61 or equivalent
  local regulations)'
