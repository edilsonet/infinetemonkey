title: apendice-e-processo-planejamento-e-aplicacao-da-avali-f1434b(a)
text: a) Proposta de Treinamento/Exame Inicial para Habilitação de Tipo. Este método é usado
  quando um requerente desenvolveu uma aeronave e busca uma nova habilitação de tipo sem nenhum
  crédito por comunalidade com qualquer aeronave relacionada. O requerente desenvolve um programa
  de treinamento para qualificar e examinar pilotos na aeronave candidata em diferenças de
  nível E. Os corpos de prova são treinados, passam por voos de verificação de proficiência
  e concluem o LOF em um processo semelhante ao descrito no item E.5.
