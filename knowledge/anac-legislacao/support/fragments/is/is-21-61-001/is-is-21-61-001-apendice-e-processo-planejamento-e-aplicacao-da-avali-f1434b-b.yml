text: 'b) Shortened Transition Training/Checking Program Validation. This method is used when
  an applicant has developed an aircraft and seeks a new type rating and credit for commonality
  with related aircraft. The applicant conducts a handling qualities evaluation based on the
  applicant’s proposed DR tables (similar to T2), followed by training and checking program
  validation (similar to T3). Subjects are trained, given flight proficiency checks, and complete
  LOF in a process similar to that described in item E.5.

  NOTA: Quando uma aeronave recebe diferenças de nível E devido a uma falha no teste T3 em
  diferenças de nível D, o crédito pela aprovação em elementos individuais do teste T3 pode
  ser usado como justificativa para não duplicar esses elementos no teste T5.

  NOTE: When an aircraft is assigned level E differences because of a failure of T3 test at
  level D differences, credit for successfully passing individual elements of the T3 test
  may be used as justification for not duplicating those elements in the T5 test.

  E.7.4 Teste bem-sucedido. A ANAC decide que o resultado T5 é consistente com os critérios
  previamente acordados. Um resultado bem-sucedido do T5 valida os programas de treinamento
  e exame propostos.

  E.7.4 Successful Test. The ANAC decides the T5 outcome consistent with previously agreed
  upon criteria. A successful outcome of T5 validates the proposed training and checking programs.

  E.7.5 Falha no Teste. Falha no T5 indica que os programas de treinamento ou exame propostos
  exigem modificação. Um novo teste por acordo mútuo entre a ANAC e o requerente normalmente
  seria necessário.

  E.7.5 Failure of Test. Failing T5 indicates the proposed training or checking programs require
  modification. A retest by mutual agreement between the ANAC and applicant would normally
  be required.

  E.8 Teste 6 (T6) - Crédito de Decolagem e Pouso Comuns - CTLC

  E.8 Test 6 (T6) - Common Takeoff and Landing Credit - CTLC

  E.8.1 Objetivo do teste. Os requerentes usam o T6 quando buscam crédito entre aeronaves
  relacionadas para os requisitos de experiência recente de decolagem e pouso do regulamento
  aplicável.

  E.8.1 Test Purpose. Applicants use T6 when they seek credit between related aircraft toward
  the takeoff and landing recency-of-experience requirements of the applicable regulation.

  E.8.2 Corpos de prova. Os corpos de prova são pilotos da ANAC ou são pilotos da indústria
  identificados pelo requerente e aceitos pela ANAC com treinamento, experiência e estão qualificados
  na aeronave base, sem treinamento para a aeronave candidata. O treinamento para proficiência
  na aeronave base pode ser fornecido aos corpos de prova pelo requerente antes do início
  do teste.

  E.8.2 Test Subjects. Test subjects are ANAC pilots or are industry pilots identified by
  the applicant and accepted by the ANAC who are trained, experienced, and current on the
  base aircraft with no training for the candidate aircraft. Training to proficiency in the
  base aircraft may be provided to test subjects by the applicant before the start of testing.

  E.8.3 Processo de teste. Os corpos de prova recebem primeiro treinamento de atualização
  na aeronave base para estabelecer uma referência de proficiência. Este treinamento pode
  ser realizado em um FFS nível C ou D aprovado. O corpo de prova é então testado na aeronave
  candidata, sem nenhum treinamento nela, realizando um mínimo de três decolagens e pousos
  sem o uso do piloto automático. Pode não ser prático conduzir alguns testes em uma aeronave.
  Um FFS pode ser usado para conduzir esses testes. Os corpos de prova devem ser avaliados
  em sua capacidade de pilotar a aeronave manualmente durante a decolagem, subida inicial
  e aproximação e pouso (incluindo o estabelecimento da configuração final de pouso). O requerente
  deve considerar os efeitos nas manobras de decolagem e pouso para os seguintes fatores ao
  projetar o teste T6:

  E.8.3 Test Process. Test subjects are first provided refresher training in the base aircraft
  to establish a baseline of proficiency. This training may be accomplished in an approved
  level C or D FFS. The subject is then tested in the candidate aircraft, without any training
  in it, accomplishing a minimum of three takeoffs and landings without use of the autopilot.
  It may not be practical to conduct some tests in an aircraft. An FFS may be used to conduct
  these tests. Test subjects should be evaluated on their ability to fly the aircraft manually
  through takeoff, initial climb, and approach and landing (including the establishment of
  final landing configuration). The applicant should consider the effects on the takeoff and
