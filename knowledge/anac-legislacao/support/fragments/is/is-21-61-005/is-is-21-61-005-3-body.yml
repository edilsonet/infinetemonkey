text: '3. LEGAL BASIS

  3.1 O Art. 66 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica
  - CBAer), estabelece que uma da competências da autoridade aeronáutica promover a segurança
  de voo, devendo estabelecer padrões mínimos de segurança relativos a projetos, materiais,
  construção, estrutura e desempenho de aeronaves, motores, hélices e demais componentes aeronáuticos.

  3.1 Art. 66 of Law No. 7,565, dated December 19th, 1986 (Brazilian Aeronautical Code - CBAer)
  states that one of the aeronautical authority''s competences is to promote flight safety,
  and it must establish minimum safety standards relating to designs, materials, construction,
  structure and performance of aircraft, engines, propellers, and other aeronautical components.

  3.2 O Regulamento Brasileiro de Aviação Civil - RBAC 01 define os OSD, que incluem a MMEL.

  3.2 Brazilian Civil Aviation Regulation - RBAC 01 defines OSD, which includes the MMEL.

  3.3 O parágrafo 21.29(a)(4)-I do RBAC 21 estabelece que aeronaves a serem importadas para
  o Brasil devem ter previamente seu OSD emitido ou aprovado pelo Estado do Projeto, a menos
  que estabelecido de outra forma pela ANAC.

  3.3 Paragraph 21.29(a)(4)-I of RBAC 21 establishes that OSD of aircraft to be imported to
  Brazil shall have been previously issued or approved by the State of Design, unless otherwise
  established by ANAC.

  3.4 A Seção 21.41 do RBAC 21 define o certificado de tipo, que inclui os OSD e, como consequência,
  a MMEL.

  3.4 Section 21.41 of RBAC 21 defines the type certificate, which includes OSD and, as consequence,
  the MMEL.

  3.5 O parágrafo 21.61-I(e) do RBAC 21 contém requisitos para propor e obter a aprovação
  de uma MMEL, bem como requisitos que exigem uma MMEL para novas solicitações a um certificado
  de tipo brasileiro de determinadas aeronaves.

  3.5 Paragraph 21.61-I(e) of RBAC 21 contains requirements for proposing and obtaining approval
  of an MMEL, as well as requirements mandating an MMEL for new applications for a Brazilian
  type certificate of certain aircraft.

  3.6 A Seção 21.107-I do RBAC 21 contém requisitos aplicáveis ​​para modificações aos OSD,
  incluindo a MMEL.

  3.6 Section 21.107-I of RBAC 21 contains requirements applicable for changes to OSD, including
  MMEL.

  3.7 A Resolução ANAC nº 30/2008 institui em seu art. 14 que a IS é uma norma geral que visa
  esclarecer, detalhar e orientar a aplicação dos requisitos previstos no RBAC.

  3.7 ANAC Resolution No. 30/2008 establishes in its art. 14 that IS is a general-purpose
  standard aiming to clarify, detail and guide the application of requirements set out in
  RBAC.

