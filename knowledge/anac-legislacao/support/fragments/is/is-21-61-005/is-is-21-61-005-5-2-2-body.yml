title: Small rotorcraft, small reciprocating-engine powered airplanes, gliders and lighter-than-air
  aircraft are not required to comply with this rule.
text: '5.2.2 Small rotorcraft, small reciprocating-engine powered airplanes, gliders and lighter-than-air
  aircraft are not required to comply with this rule.

  5.2.3 Esta isenção se baseia no fato de que essas aeronaves são autorizadas a operar no
  Brasil com equipamentos inoperantes sem uma MEL aprovada, mesmo que exista uma MMEL para
  a aeronave, conforme estabelece o parágrafo 91.213(d)(1)(ii) do RBAC 91.

  5.2.3 This is based on the fact that such aircraft are allowed to be operated with inoperative
  equipment in Brazil without an approved MEL, even if there is a MMEL for that aircraft,
  as stated in paragraph 91.213(d)(1)(ii) of RBAC 91.

  5.2.4 Aeronaves isentas de certificação de tipo no Brasil ou cuja aplicação ao CT brasileiro
  tenha sido efetuada até 1º de janeiro de 2025 também não precisam ter uma MMEL incluída
  em seu certificado de tipo brasileiro.

  5.2.4 Aircraft exempt from type certification in Brazil or whose application for a Brazilian
  TC was made until January 1st, 2025, are not required either to have a MMEL included in
  its Brazilian type certificate.

  5.2.5 Não obstante, o detentor do certificado de tipo de uma aeronave poderá voluntariamente
  aplicar pela inclusão de uma MMEL no CT brasileiro, devendo, nesse caso, cumprir com os
  requisitos aplicáveis e seguir as orientações contidas nesta IS.

  5.2.5 Notwithstanding that, the holder of the type certificate may voluntarily apply for
  the inclusion of a MMEL in the Brazilian TC, in which case it must comply with the applicable
  requirements and follow the guidelines contained in this IS.

  5.2.6 Em caso de aplicação a uma aprovação de modificação ao CT após 1º de janeiro de 2025,
  em havendo uma MMEL aprovada para a aeronave (ainda que não fosse requerido que tivesse),
  o requerente à aprovação deverá avaliar os impactos desta na MMEL aprovada, caso contrário
  a ANAC poderá limitar o conteúdo da lista, conforme previsto na seção 21.107-I do RBAC 21.

  5.2.6 In case of an application for approval of a change to a TC made after January 1st,
  2025, if there is an approved MMEL for the aircraft (even when not required), the applicant
  for the change approval must assess its impacts on the approved MMEL, otherwise ANAC may
  limit the content of the list, as foreseen in section 21.107-I of RBAC 21.

  5.2.7 A exigência de uma MMEL aprovada ou revisada não impede a emissão do CT ou CST, ou
  a aprovação da modificação ao CT. Entretanto a MMEL ou o Suplemento à MMEL devem ser aprovados
  antes da emissão de um certificado de aeronavegabilidade padrão brasileiro ou antes da operação
  de uma aeronave registrada no Brasil incorporada com a modificação ou CST.

  5.2.7 The need for an approved or revised MMEL does not prevent the issuance of the TC or
  STC, or the approval of the change to the TC. However, the MMEL or MMEL Supplement must
  be approved before the issuance of a Brazilian standard certificate of airworthiness or
  before the operation of a Brazilian-registered aircraft embodied with the change or STC.

