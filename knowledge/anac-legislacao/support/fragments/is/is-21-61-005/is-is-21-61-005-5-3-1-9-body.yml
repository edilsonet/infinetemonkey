title: Relief of an item does not authorize operation of the aircraft with that item removed
  unless the MMEL explicitly permits such removal.
text: '5.3.1.9 Relief of an item does not authorize operation of the aircraft with that item
  removed unless the MMEL explicitly permits such removal.

  5.3.1.10 O relaxamento dos itens é específico para cada MMEL. Assim, se houver o relaxamento
  de certos itens para um tipo de aeronave, isso não significa que o mesmo relaxamento pode
  ser estendido a outro tipo de aeronave. Mesmo no caso de aeronaves derivadas ou aeronaves
  da mesma “família” de aeronaves, o grau de relaxamento autorizado dependerá das características
  específicas do projeto de cada modelo e segue o processo descrito nas seções 5.3.3 e 5.3.4.

  5.3.1.10 Item relief is specific to each MMEL. Thus, if there is a relief regarding the
  operation of certain items for one sort of aircraft, this does not mean that the same relief
  can be extended to another sort of aircraft. Even in the case of derived aircraft or aircraft
  from the same aircraft “family”, the degree of relief authorized will depend on the specific
  design characteristics of each model and follows the process described in sections 5.3.3
  and 5.3.4.

  5.3.1.11 Sem prejuízo do acima mencionado, é notório que existem certos tipos de relaxamento
  bem estabelecidos para vários itens. Para estes, autoridades de aviação civil normalmente
  já publicaram suas políticas (policies) a respeito, estabelecendo padrões e práticas aceitáveis
  para a liberação de certos itens da MMEL. A ANAC reconhece e geralmente aceita as policies
  emitidas pela Administração Federal de Aviação (Federal Aviation Administration - FAA) dos
  Estados Unidos e da Agência da União Europeia para a Segurança da Aviação ( European Union
  Aviation Safety Agency - EASA), da União Europeia. A ANAC também pode emitir suas próprias
  políticas, aplicáveis à frota brasileira, tendo efetividade sobre a MEL dos operadores.
  As políticas de MEL da ANAC estão disponíveis em seu website.

  5.3.1.11 Without prejudice to the aforementioned, it is known that there are certain types
  of relief well established for several items. For these, civil aviation authorities normally
  have already published policies, which set acceptable standards and practices for alleviating
  certain MMEL items. ANAC recognizes and generally accepts the policies issued by the Federal
  Aviation Administration - FAA from United States and the European Union Aviation Safety
  Agency - EASA. ANAC may also issue its own policies, applicable to Brazilian fleet, affecting
  operator’s MEL. ANAC MEL policies are available on its website.

  5.3.1.12 Os requerentes brasileiros a uma MMEL aprovada pela ANAC são aconselhados a considerar
  essas políticas ao preparar seus documentos. Apesar delas não serem mandatórias a tais requerentes,
  as políticas refletem a posição técnica da ANAC sobre determinado assunto e, como resultado,
  em muitas ocasiões a aprovação de um item da MMEL só será possível se a proposta for compatível
  com a política aplicável.

  5.3.1.12 Brazilian applicants to an ANAC approved MMEL are advised to consider these policies
  when preparing their documents. Despite not being mandatory for such applicants, these policies
  reflect ANAC''s technical position on a given subject and, as a result, on many occasions
  the approval of an MMEL item will only be possible if the proposal is compatible with the
  applicable policy.'
