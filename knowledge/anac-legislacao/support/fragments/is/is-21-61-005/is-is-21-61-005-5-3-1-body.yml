title: General instructions
text: '5.3.1 General instructions

  5.3.1.1 O detentor ou requerente do CT ou CST é o responsável por coordenar o desenvolvimento
  da MMEL com seus fornecedores, potenciais operadores e a autoridade de aviação civil.

  5.3.1.1 The applicant or holder of the TC or STC is the one responsible for coordinating
  the development of the MMEL, or MMEL Supplement, with its suppliers, potential operators,
  and the civil aviation authority.

  5.3.1.2 A MMEL abrange todos os tipos de operação para os quais o tipo ou modelo de aeronave
  é certificado. Exceções e restrições devem ser claramente declaradas na coluna “Observações
  ou Exceções”.

  5.3.1.2 The MMEL covers all the types of operation for which the aircraft type or model
  is certified. Exceptions and restrictions must be clearly stated in the “Remarks or Exceptions”
  column.

  5.3.1.3 Uma MMEL pode abranger mais de um tipo ou modelo de aeronave, desde que haja benefícios
  nesta comunalidade e a aplicabilidade de cada item exclusivo seja claramente indicada.

  5.3.1.3 An MMEL may cover more than one aircraft type or model provided benefits on commonality
  can be taken and the applicability of each exclusive item is clearly indicated.

  5.3.1.4 Alguns itens na aeronave foram projetados para serem tolerantes a falhas e são monitorados
  por computadores que transmitem mensagens de falha para fins de manutenção. A presença desse
  tipo de mensagem não significa necessariamente que o item esteja inoperante. O requerente
  deve deixar isso claro nos manuais e documentos da aeronave.

  5.3.1.4 Some items have been designed to be fault tolerant and are monitored by computers
  which transmit fault messages for the purpose of maintenance. The presence of this category
  of message does not necessarily mean that the item is inoperative. The applicant must make
  this clear in aircraft manuals and documents.

  5.3.1.5 Os efeitos cumulativos de vários itens inoperantes devem, na medida do possível,
  ser considerados na demonstração da conformidade com o requisito 21.61-I(e)(1) do RBAC 21.

  5.3.1.5 The cumulative effects of multiple inoperative items must, to the extent possible,
  be considered in demonstrating compliance with requirement 21.61-I(e)(1) of RBAC 21.'
