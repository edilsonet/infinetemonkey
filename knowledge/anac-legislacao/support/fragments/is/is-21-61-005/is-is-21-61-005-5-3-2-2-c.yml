title: 5.3.2.2(c)
text: c) Um preâmbulo, contendo considerações sobre a finalidade e limitações, utilização,
  definições, relacionamento entre vários itens inoperantes, extensão do intervalo de relaxamento
  (se aplicável) e, se apropriado, notas de esclarecimento que reflitam adequadamente o escopo,
  extensão e finalidade da MMEL (consulte o Apêndice C para um modelo de preâmbulo).
