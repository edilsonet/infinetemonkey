title: 5.3.2.6(a)
text: 'a) Categoria A: Itens nesta categoria devem ser reparados dentro do prazo especificado
  na seção “Observações ou Exceções” (coluna 5 no modelo D.1 do Apêndice D). Quando este intervalo
  de tempo é especificado em termos de pousos, ciclos ou horas de voo, o intervalo começa
  já a partir do próximo voo. Quando especificado em dias corridos ou dias de voo, a regra
  explicada em 5.3.2.5 se aplica aqui, e também nas outras categorias.'
