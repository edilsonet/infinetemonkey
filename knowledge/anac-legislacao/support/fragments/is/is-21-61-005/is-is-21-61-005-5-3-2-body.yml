title: Format and content
text: '5.3.2 Format and content

  5.3.2.1 A MMEL deve ser escrita em um formato aceitável pela ANAC, conforme descrito nesta
  IS. Os formatos da FAA e EASA são aceitáveis, assim como outros formatos em papel ou eletrônicos,
  desde que contenham todo o conteúdo necessário, sejam claros e inequívocos.

  5.3.2.1 The MMEL must be written in a format acceptable to ANAC, as described in this IS.
  FAA and EASA formats are acceptable, as well as other paper or electronic formats, provided
  they contain all required contents, are clear and unambiguous.'
