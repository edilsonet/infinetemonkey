subsection_id: b
cite: 5.3.3.3(b)
title: 5.3.3.3(b)
text: b) transferência da função ou informação para um sistema ou componente operante que
  desempenhe a função necessária ou forneça a informação necessária, desde que a alteração
  na carga de trabalho da tripulação e/ou no treinamento da tripulação permaneça aceitável;
