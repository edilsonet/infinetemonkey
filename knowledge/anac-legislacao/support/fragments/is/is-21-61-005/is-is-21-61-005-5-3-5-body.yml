title: Operational and maintenance procedures
text: '5.3.5 Operational and maintenance procedures

  5.3.5.1 Procedimentos operacionais e de manutenção são indicados na MMEL pelos símbolos
  (O) e (M), respectivamente, nas provisões do item. O requerente deve avaliar sua complexidade
  antes de incluí-los na MMEL.

  5.3.5.1 Operational and maintenance procedures are indicated in the MMEL by the symbols
  (O) and (M), respectively, in the item proviso. The applicant must evaluate its complexity
  prior to including them in the MMEL.

  5.3.5.2 Instruções para execução dos procedimentos operacionais e de manutenção devem ser
  desenvolvidas e validadas pelo requerente. Entretanto, tais procedimentos não são obrigatórios
  aos operadores, sendo apenas recomendações.

  5.3.5.2 The instructions for carrying out operational and maintenance procedures must be
  developed and validated by the applicant. However, such procedures are not mandatory to
  operators, being only recommendations.

  5.3.5.3 O conteúdo dos procedimentos operacionais e de manutenção normalmente não precisa
  estar finalizado e incluído como parte das justificativas, sendo suficiente apresentar apenas
  a sua intenção como parte das justificativas. Se necessário, a ANAC pode solicitar o conteúdo
  de um procedimento específico para complementar a justificativa de um item.

  5.3.5.3 The content of the operational and maintenance procedures is normally not required
  to be finalized and included as part of the justifications, being sufficient to present
  only their intention as part of the justifications. If necessary, ANAC may request the content
  of a specific procedure to complement the justification of an item.

  5.3.5.4 Procedimentos operacionais são normalmente realizados por membros da tripulação
  de voo, embora outras pessoas possam ser qualificadas e autorizadas a desempenhar determinadas
  funções.

  5.3.5.4 Operational procedures are normally carried out by flight crew members, although
  other people may be qualified and authorized to perform certain functions.

  5.3.5.5 Procedimentos de manutenção são normalmente realizados por pessoal de manutenção
  devido à necessidade de conhecimento ou habilidades especializadas ou exigindo o uso de
  ferramentas ou equipamentos de teste. No entanto, outras pessoas podem ser autorizadas a
  realizar tarefas específicas de manutenção de acordo com os regulamentos da autoridade de
  aviação civil relacionados à manutenção.

  5.3.5.5 Maintenance procedures are normally performed by maintenance personnel due to the
  need for specialized knowledge or skills or requiring the use of tools or testing equipment.
  However, other persons may be authorized to carry out specific maintenance tasks in accordance
  with civil aviation authority regulations related to maintenance.'
