cite: 5.4.1.1
title: The MMEL is valid only once approved.
text: '5.4.1.1 The MMEL is valid only once approved.

  5.4.1.2 “Aprovada” deve ser entendido como definido no RBAC 01: aprovada pela ANAC ou por
  qualquer pessoa cuja competência para aprovação a ANAC reconheça, na matéria em questão,
  incluindo outras autoridades de aviação civil.

  5.4.1.2 “Approved” must be understood as defined in RBAC 01: approved by ANAC or by any
  person whose approval competence ANAC recognizes, in the affected matter, including other
  civil aviation authorities.

  5.4.1.3 Novos CT emitidos pela ANAC após 1º de janeiro de 2025 terão a MMEL aprovada e o
  Suplemento a MMEL, se aplicável, referenciados na Especificação de Tipo (Type Certificate
  Datasheet - TCDS).

  5.4.1.3 New TC issued by ANAC after January 1st, 2025 will have the approved MMEL and MMEL
  Supplement, if applicable, referenced in the Type Certificate Datasheet - TCDS.

  5.4.1.4 Para CT emitidos pela ANAC antes de 2 de janeiro de 2025, gradualmente, as EA serão
  revisadas para referenciar claramente a MMEL aprovada bem como o Suplemento a MMEL, se aplicável.
  Não é necessário um requerimento para modificação do CT somente para este propósito.

  5.4.1.4 For TC issued by ANAC before January 2nd, 2025, gradually, TCDS will be revised
  to clearly reference the approved MMEL and MMEL Supplement, if applicable. An application
  for a TC change solely for this purpose is not necessary.'
