title: Aircraft for which ANAC is the primary certification authority
text: '5.4.2 Aircraft for which ANAC is the primary certification authority

  5.4.2.1 Aeronaves que têm a ANAC como autoridade primária até então sempre tiveram suas
  MMEL e revisões posteriores aprovadas diretamente pela ANAC. Com a vigência desta IS, passa
  a valer o conceito mais abrangente de aprovação conforme descrito no item 5.4.1.2, onde
  algumas modificações à MMEL poderão ser aprovadas por pessoa competente reconhecida pela
  ANAC.

  5.4.2.1 Aircraft that have ANAC as the primary certification authority have always had their
  MMEL and subsequent revisions approved directly by ANAC. Since the effective date of this
  IS, the broader concept of approval as described in item 5.4.1.2 apply, where some changes
  to the MMEL may be approved by a competent person recognized by ANAC.

  5.4.2.2 Qualquer que seja o caso, para aprovação da MMEL o requerente deve apresentar sua
  proposta e a documentação de suporte necessária para demonstrar conformidade com o parágrafo
  21.61-I(e) do RBAC 21 e seguir as orientações desta IS.

  5.4.2.2 Whatever the case, for approval of the MMEL the applicant must submit its proposal
  and the necessary supporting documentation to demonstrate compliance with paragraph 21.61-I(e)
  of RBAC 21 and follow the guidelines of this IS.

  5.4.2.3 A ANAC (ou pessoa por ela delegada) analisará a documentação apresentada e poderá
  requerer reuniões com o requerente e também demandar informações, análises, testes e comprovações
  adicionais. Alterações à proposta inicial poderão ser necessárias, cabendo ao requerente
  implementá-las e submetê-las novamente para análise, reiniciando o processo até a aprovação
  da MMEL.

  5.4.2.3 ANAC (or a delegated person) will analyze the documentation presented and may require
  meetings with the applicant and also demand additional information, analyses, tests and
  substantiations. Changes to the initial proposal may be necessary, being the applicant responsible
  to implement and submit them again for analysis, restarting the process until MMEL approval.'
