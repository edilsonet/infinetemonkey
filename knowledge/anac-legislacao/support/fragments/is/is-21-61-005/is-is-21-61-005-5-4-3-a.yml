section_title: Aircraft for which ANAC is the validating authority
subsection_id: a
cite: 5.4.3(a)
title: 5.4.3(a)
text: a) A MMEL emitida ou aprovada pela autoridade do estado de projeto é considerada aprovada
  no Brasil sem nenhuma alteração. Não obstante, pode haver políticas (policies) de MEL brasileiras
  que precisarão ser consideradas durante o desenvolvimento da MEL do operador, conforme descrito
  no item 5.3.1.11;
