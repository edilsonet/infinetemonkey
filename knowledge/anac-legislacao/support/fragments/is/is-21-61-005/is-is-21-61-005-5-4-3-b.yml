section_title: Aircraft for which ANAC is the validating authority
subsection_id: b
cite: 5.4.3(b)
title: 5.4.3(b)
text: b) A MMEL emitida ou aprovada pela autoridade do estado de projeto precisa ser complementada
  por um Suplemento a MMEL brasileiro que complemente e sobrescreva a MMEL estrangeira, nos
  itens nele contidos. A título de exemplos, este Suplemento pode ser usado para implementar
  alterações requeridas pela ANAC ou para que o requerente tome crédito de políticas de MEL
  da ANAC que sejam menos restritivas do que aquelas do Estado de Projeto;
