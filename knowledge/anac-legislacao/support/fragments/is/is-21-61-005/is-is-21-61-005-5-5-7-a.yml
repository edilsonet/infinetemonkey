section_title: 'All that considered, a change to the type design requires a change to the
  MMEL if any of the following conditions are met:'
subsection_id: a
cite: 5.5.7(a)
title: 5.5.7(a)
text: 'a) a modificação afeta um item da MMEL de uma forma mais restritiva: há uma alteração
  em equipamento, sistema ou função vinculada a um item da MMEL, ou uma alteração nas limitações
  e procedimentos operacionais vinculados a um item da MMEL;'
