section_title: 'According to paragraph 21.107-I(c) of RBAC 21:'
subsection_id: f
cite: 5.6.1(f)
title: 5.6.1(f)
text: 'f) Changes that increase allowances or reduce restrictions of the MMEL, such as:

  I- Aumento do intervalo de reparo;

  I- Increase of the repair interval;

  II- Redução do número de itens requeridos;

  II- Reduction in the number of items required;

  III- Alterações nas provisões, notas ou procedimentos (M) ou (O);

  III- Changes in provisos, notes or in (M) or (O) procedures;

  IV- Extensão da capacidade da aeronave para realizar determinados tipos de operações, por
  exemplo, Operações Prolongadas (Extended Operations - ETOPS ou IFR.

  IV- Extension of aircraft capability to perform types of operations, e.g., Extended Operations
  - ETOPS or IFR.'
