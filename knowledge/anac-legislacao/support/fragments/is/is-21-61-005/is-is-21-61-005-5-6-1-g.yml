title: 5.6.1(g)
text: 'g) Addition or change to an item whose proposal:

  I- Não conflita com requisitos operacionais e de aeronavegabilidade; e

  I- Does not conflict with airworthiness and operational requirements; and

  II- Quando avaliado em relação a cada item do parágrafo 21.61-I(e)(1) do RBAC 21, resulta
  em consequências não mais graves do que pequenas (minor, de acordo com a base de certificação
  aplicável).

  II- When assessed according to each item of paragraph 21.61-I(e)(1) of RBAC 21, it results
  in consequences not worse than minor (according to applicable certification basis).

  5.6.3 Uma modificação à MMEL é considerada como tendo um ‘efeito apreciável nos dados relevantes
  à operação’ e, portanto, deve ser classificada como grande modificação, em particular, mas
  não apenas quando uma ou mais das seguintes condições forem atendidas:

  5.6.3 A change to the MMEL is judged to have an ‘appreciable effect on the operational suitability
  of the aircraft’ and, therefore, should be classified as major change, in particular, but
  not only when one or more of the following conditions are met:'
