text: '5.6.5 Whenever there is doubt as to the classification of a change, ANAC may be consulted
  for clarification.

  5.6.6 Quando a estrita aplicação dos critérios desta seção resultar em uma classificação
  como grande modificação e o requerente considerar que tal classificação não é apropriada
  naquele caso específico, este poderá, de maneira devidamente justificada, solicitar à ANAC
  a reclassificação da modificação.

  5.6.6 When the strict application of the criteria in this session results in a classification
  as a major change and the applicant considers that such classification is not appropriate
  in the specific case, it may, on a duly justified manner, requests to ANAC a reclassification
  of the change.

  5.6.7 Os motivos para uma decisão de classificação devem ser registrados. O nível de detalhe
  dos registros deve ser o mesmo independente se a modificação será aprovada pela ANAC ou
  sob as prerrogativas do requerente. Qualquer classificação ou aprovação feita pelo requerente
  poderá vir a ser averiguada pela ANAC.

  5.6.7 The reasons for a classification decision should be recorded. The level of detail
  of such records should be the same regardless of whether the change is approved by ANAC
  or under applicant´s privileges. Any classification or approval done by the applicant may
  be inspected by ANAC.

  5.7 Aprovação de modificações à MMEL

  5.7 MMEL changes approval

  5.7.1 Uma vez que a MMEL é parte do certificado de tipo, a aprovação de suas modificações
  segue o mesmo processo que uma emenda ao CT ou da emissão (ou emenda) de um CST. Logo o
  processo a ser seguido é análogo ao de aprovação de modificações ao projeto de tipo, conforme
  as seguintes IS aplicáveis:

  5.7.1 Considering that the MMEL is part of the type certificate, the approval of its changes
  follows the same process of an amendment to the TC or of the issuance (or amendment) of
  a STC. Thus, the process to be followed is analogous to that of approving changes to the
  type design, according to the following applicable IS:'
