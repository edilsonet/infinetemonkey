title: All MMEL major changes must be submitted in an acceptable form for ANAC approval.
text: '5.7.2 All MMEL major changes must be submitted in an acceptable form for ANAC approval.

  5.7.3 Conforme estabelecido na seção 21.263-I do RBAC 21, os detentores de um certificado
  de organização de projeto podem ter prerrogativas para classificar suas modificações e aprovar
  as pequenas.

  5.7.3 As established in section 21.263-I of RBAC 21, holders of a design organization certificate
  may have the privileges to classify changes and approve minor changes.

  5.7.4 Os requerentes que não possuem um certificado de organização de projeto devem ter
  suas pequenas modificações à MMEL aprovadas de maneira aceitável pela ANAC.'
