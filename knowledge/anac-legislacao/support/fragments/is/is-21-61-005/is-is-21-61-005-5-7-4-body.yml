cite: 5.7.4
title: Applicants who do not hold a design organization certificate must have minor MMEL changes
  approved in a manner acceptable to ANAC.
text: '5.7.4 Applicants who do not hold a design organization certificate must have minor
  MMEL changes approved in a manner acceptable to ANAC.

  5.7.5 Se a ANAC considerar que o requerente tem um processo bem estabelecido e robusto para
  classificar e demonstrar conformidade com os requisitos, a ANAC também pode considerá-lo
  capaz de aprovar pequenas modificações à MMEL. Esta prerrogativa precisa ser expressamente
  concedida pela ANAC. A existência de consentimento semelhante para pequenas modificações
  ao projeto de tipo ou a outro elemento OSD não implica a mesma prerrogativa para a MMEL.

  5.7.5 If ANAC considers that the applicant has a well-established and robust process for
  classifying and demonstrating compliance with the requirements, ANAC may also consider it
  to be capable of approving minor MMEL changes. This privilege must be expressly granted
  by ANAC. The existence of similar consent for minor changes to the type design or other
  OSD element does not imply the same privilege for MMEL.'
