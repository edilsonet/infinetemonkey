text: '5.7.6 In case applicant does not possess such privileges, even minor MMEL changes must
  be submitted for ANAC approval.

  5.7.7 Finalmente, no caso de modificações à MMEL de um produto aeronáutico estrangeiro,
  estas serão aprovadas de acordo com os procedimentos estabelecidos nos acordos bilaterais
  de aeronavegabilidade entre o Brasil e o respectivo Estado de Projeto. Mais informações
  sobre este assunto podem ser encontradas na IS 21-010, que trata da aprovação de produtos
  aeronáuticos estrangeiros.

  5.7.7 Finally, in the case of changes to the MMEL of a foreign aeronautical product, these
  will be approved according to procedures set forth in bilateral airworthiness agreements
  between Brazil and the respective State of Design. Further information on this subject can
  be found in IS 21-010, which deals with the approval of foreign aeronautical products.

  5.8 Propriedade e disponibilidade da MMEL

  5.8 Ownership and availability of the MMEL

  5.8.1 O requerente que emite uma MMEL ou Suplemento a MMEL é o proprietário do documento
  e é responsável por editar, publicar e manter todas as suas revisões e documentos de suporte
  associados. A ANAC deve ter acesso total a esses documentos, gratuitamente, sempre que solicitar.

  5.8.1 The applicant issuing a MMEL or MMEL Supplement is the owner of the document and is
  responsible for editing, publishing, and preserving all its revisions and associated supporting
  documents. ANAC must be granted full access to these documents, free of charge, whenever
  requested.

  5.8.2 A MMEL e o Suplemento a MMEL devem ser disponibilizados a qualquer pessoa que precise
  desses documentos para cumprir com o RBAC. No entanto, o proprietário pode impor condições
  relativas à propriedade intelectual dos documentos.

  5.8.2 The MMEL and MMEL Supplement shall be made available to any person needing these documents
  to comply with RBAC. However, the owner of the documents may impose conditions addressing
  the intellectual property nature of the document.

  5.8.3 Os Suplementos a MMEL emitidos pela ANAC de acordo com o item 5.5.9 são de propriedade
  da ANAC. As modificações, pequenas ou grandes, ou a revogação de tais suplementos devem
  ser solicitadas à ANAC pelo requerente como uma modificação à MMEL.

  5.8.3 MMEL Supplements issued by ANAC according to item 5.5.9 are owned by ANAC. Changes,
  either minor or major, or revocation of such supplements shall be requested to ANAC by an
  applicant as a change to the MMEL.'
