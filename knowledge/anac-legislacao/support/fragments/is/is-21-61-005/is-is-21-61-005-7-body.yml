title: FINAL PROVISIONS
text: '7. FINAL PROVISIONS

  7.1 As orientações para o desenvolvimento da MEL para operadores brasileiros são encontradas
  na IS 91-012 (“Lista de Equipamentos Mínimos (MEL) e operação com equipamentos e instrumentos
  inoperantes”).

  7.1 Guidelines for developing the MEL for Brazilian operators are found in IS No. 91-012
  (“Minimum Equipment List (MEL) and operation with inoperative equipment and instruments”).

  7.2 O conteúdo desta IS pode não ser completamente aplicável a situações cujo assunto seja
  descrito em acordos entre o Brasil e outros países e entre a ANAC e outras autoridades de
  aviação civil. Nessas situações, prevalecerá o acordo correspondente.

  7.2 The content of this IS may not be completely applicable to situations whose subject
  is described in agreements between Brazil and other countries and between ANAC and other
  civil aviation authorities. In these situations, the corresponding agreement shall prevail.

  7.3 Esta IS é publicada em português e inglês, formatada em duas colunas. Caso existam divergências
  entre as versões em português e inglês, a versão em português prevalecerá.

  7.3 This IS is published in Portuguese and English, formatted in two columns. In the event
  of any discrepancies between the Portuguese and English versions of this document, the Portuguese
  version shall take precedence.

  7.4 Os casos omissos serão dirimidos pela ANAC.

  7.4 Omitted cases will be resolved by ANAC.'
