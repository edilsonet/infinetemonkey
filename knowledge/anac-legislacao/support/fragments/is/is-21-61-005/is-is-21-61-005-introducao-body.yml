title: Introdução
text: 'Introdução

  Introduction

  Os regulamentos de operação exigem que todos os equipamentos instalados em uma aeronave
  necessários para a certificação de tipo ou por regras operacionais estejam operantes. No
  entanto, os mesmos regulamentos também permitem a publicação de uma Lista de Equipamentos
  Mínimos (MEL) onde a conformidade com certos requisitos de equipamento não é necessária
  no que se refere à segurança operacional em todas as condições de operação. A experiência
  mostrou que com os vários níveis de redundância contidos no projeto das aeronaves, a operação
  de cada sistema ou componente instalado pode não ser necessária quando o equipamento operante
  remanescente puder fornecer um nível aceitável de segurança.

  Operation regulations require that all equipment installed on an aircraft required for type
  certification or by operating rules must be operative. However, the same regulations also
  permit the publication of a Minimum Equipment List (MEL) where compliance with certain equipment
  requirements is not necessary in the interests of safety under all operating conditions.
  Experience has shown that with the various levels of redundancy designed into aircraft,
  operation of every system or installed component may not be necessary when the remaining
  operative equipment can provide an acceptable level of safety.

  Propósito e limitações

  Purpose and limitations

  A Lista Mestra de Equipamentos Mínimos (MMEL) é desenvolvida pelos detentores do Certificado
  de Tipo e Suplementar de Tipo e aprovada pela ANAC para melhorar o uso da aeronave e, assim,
  fornecer um transporte aéreo mais conveniente e econômico para o público. A MMEL inclui
  os itens relacionados à aeronavegabilidade, operações aéreas, requisitos de espaço aéreo
  e outros itens que a ANAC considera que podem estar inoperantes, mantendo-se um nível aceitável
  de segurança por meio de condições e limitações apropriadas; ela não contém itens obviamente
  necessários, como asas, flapes e lemes. Para manter um nível aceitável de segurança, a MMEL
  estabelece limitações na duração e nas condições de operação com itens inoperantes. A menos
  que especificamente permitido por esta MMEL, um item inoperante não pode ser removido da
  aeronave.

  The Master Minimum Equipment List (MMEL) is developed by the holders of the Type Certificate
  and Supplemental Type Certificate and approved by ANAC to improve aircraft use and thereby
  to provide more convenient and economic air transportation for the public. The MMEL includes
  those items related to airworthiness, air operations, airspace requirements and other items
  that ANAC finds may be inoperative, while maintaining an acceptable level of safety through
  appropriate conditions and limitations; it does not contain obviously required items such
  as wings, flaps, and rudders. In order to maintain an acceptable level of safety, the MMEL
  establishes limitations on the duration of and conditions for operation with inoperative
  items. Unless specifically allowed by this MMEL, an inoperative item may not be removed
  from the aircraft.

  Utilização

  Utilization

  A MMEL é a base para o desenvolvimento da MEL do operador individual que leva em consideração
  a configuração específica de equipamentos da aeronave e as condições operacionais do operador.
  A MEL de um operador pode diferir em formato da MMEL, mas não deve ser menos restritiva
  do que a MMEL. A MEL do operador individual, quando aprovada, permite a operação da aeronave
  com itens de equipamento inoperantes por um determinado período de tempo até que o reparo
  possa ser realizado. É importante que os reparos sejam realizados o mais cedo possível.

  The MMEL is the basis for the development of individual operator’s MEL which take into consideration
  the operator’s particular aircraft equipment configuration and operational conditions. An
  operator’s MEL may differ in format from the MMEL but shall not be less restrictive than
  the MMEL. The individual operator’s MEL, when approved, allows operation of the aircraft
  with inoperative items of equipment for a certain period of time until repair can be accomplished.
  It is important that repairs be accomplished at the earliest opportunity.

  A MEL não pode se desviar das Diretrizes de Aeronavegabilidade, ou quaisquer outros requisitos
  obrigatórios adicionais. É importante lembrar que todos os itens relacionados à aeronavegabilidade
  e aos regulamentos operacionais da aeronave não listados na MMEL devem estar operantes.

  The MEL cannot deviate from Airworthiness Directives, or any other additional mandatory
  requirements. It is important to remember that all items related to the airworthiness and
  the operational regulations of the aircraft not listed on the MMEL shall be operative.

  Condições e limitações adequadas na forma de placares, procedimentos de manutenção, procedimentos
  operacionais da tripulação e outras restrições, conforme prescritos na MMEL, devem ser especificados
  na MEL para garantir que um nível aceitável de segurança seja mantido.

  Suitable conditions and limitations in the form of placards, maintenance procedures, crew
  operating procedures and other restrictions as prescribed in the MMEL shall be specified
  in the MEL to ensure that an acceptable level of safety is maintained.

  Quando um item é descoberto inoperante, ele é reportado por meio de uma entrada no sistema
  de registro de aeronavegabilidade continuada ou no diário de bordo do operador, conforme
  aplicável. Após suficiente identificação das falhas, o item é então reparado ou despachado
  conforme a MEL ou outro meio aprovado de conformidade aceitável para a autoridade competente,
  antes de operação posterior. As condições e limitações da MEL não isentam o operador de
  determinar que a aeronave está em condições de operação segura com itens inoperantes.

  When an item is discovered to be inoperative, it is reported by making an entry in the continuing
  airworthiness record system or the operator’s technical log, as applicable. Following sufficient
  fault identification, the item is then either repaired or deferred following the MEL or
  other approved means of compliance acceptable to the competent authority prior to further
  operation. MEL conditions and limitations do not relieve the operator from determining that
  the aircraft is in a condition for safe operation with items inoperative.

  Antes da operação com qualquer item inoperante, é necessária a aceitação da tripulação conforme
  os procedimentos de gerenciamento de aeronavegabilidade continuada.

  Prior to operation with any item inoperative acceptance by the crew is required in accordance
  with the continuing airworthiness management procedures.

  Os operadores devem estabelecer um programa de reparo robusto e controlado, que inclua peças,
  pessoal, instalações, procedimentos e cronogramas para garantir os reparos em tempo hábil.

  Operators shall establish a controlled and sound repair program including the parts, personnel,
  facilities, procedures and schedules to ensure timely repair.

  Os operadores devem incluir orientações na MEL para lidar com quaisquer falhas que ocorram
  entre o início do taxi e o início da decolagem.

  Operators should include guidance in the MEL to deal with any failures which occur between
  the commencement of the flight and the start of the take-off.

  Quando desenvolvendo a MEL, é necessária a sua conformidade com as intenções declaradas
  no preâmbulo, nas definições e nas condições e limitações especificadas nesta MMEL.

  When developing the MEL, compliance with the stated intent of the preamble, definitions
  and the conditions and limitations specified in this MMEL is required.

  Vários itens inoperantes

  Multiple inoperative items

  Os operadores são responsáveis por exercer o controle operacional necessário para garantir
  que um nível aceitável de segurança seja mantido. A exposição a falhas adicionais durante
  a operação contínua com itens inoperantes também deve ser considerada. Sempre que possível,
  foram considerados nesta MMEL a existência de múltiplos itens inoperantes. No entanto, é
  improvável que todas as combinações possíveis dessa natureza tenham sido consideradas. Portanto,
  ao operar com múltiplos itens inoperantes, as inter-relações entre esses itens e o efeito
  na operação da aeronave e na carga de trabalho da tripulação devem ser consideradas pelo
  operador.

  Operators are responsible for exercising the necessary operational control to ensure that
  an acceptable level of safety is maintained. The exposure to additional failures during
  continued operation with inoperative items shall also be considered. Wherever possible,
  account has been taken in this MMEL of multiple inoperative items. However, it is unlikely
  that all possible combinations of this nature have been accounted for. Therefore, when operating
  with multiple inoperative items, the inter-relationships between those items and the effect
  on aircraft operation and crew workload shall be considered by the operator.

  Extensão do intervalo de reparo

  Repair interval extension

  [O operador pode ser autorizado, por sua autoridade competente, a estender os intervalos
  de reparo de sua MEL.

  [The operator may be permitted, by its competent authority, to extend the repair intervals
  of the MEL.

  Esta MMEL foi avaliada levando-se em consideração uma extensão única dos intervalos de reparo
  das categorias B, C e D.]

  This MMEL has been evaluated taking into account a one-time extension of the repair intervals
  of category B, C and D.]

  (A declaração acima em [] é aplicável somente se demonstrada durante o processo de avaliação
  da MMEL)

  (The above statement in [] is applicable only if demonstrated during the MMEL review process)

  DEFINIÇÕES E NOTAS EXPLICATIVAS

  DEFINITIONS AND EXPLANATORY NOTES

  1. ''Asterisco triplo (***)'' na coluna Item indica que tal item não é exigido pelos regulamentos,
  mas que pode ter sido instalado em algumas, porém não em todas as aeronaves cobertas por
  aquela MMEL. O uso deste símbolo não autoriza a instalação ou remoção de um item da aeronave.

  2. ''ATA'' refere-se a um sistema numérico internacionalmente padronizado, desenvolvido
  para identificar sistemas e componentes de diferentes aeronaves em um formato comum.

  3. ''Categoria de reparo'' é uma classificação do intervalo de reparo em categorias definidas,
  designadas como A, B, C e D, da seguinte forma:

  Categoria A - Nenhum intervalo padrão é especificado. Itens nesta categoria devem ser reparados
  de acordo com as condições declaradas na MMEL/MEL. Pode ser especificado em dias corridos
  (em quantidade diferente das outras categorias) ou outros tipos de intervalos, como voos,
  trechos de voo, ciclos, horas.

  Categoria B - Itens nesta categoria devem ser reparados dentro de 3 dias corridos, excluindo
  o dia da descoberta. Por exemplo, se foi registrado às 10h do dia 1º de janeiro, o intervalo
  de 3 dias começaria às 00h do dia 2 de janeiro e terminaria às 23h59 do dia 4 de janeiro.

  Categoria C - Itens nesta categoria devem ser reparados dentro de 10 dias corridos, excluindo
  o dia da descoberta. Por exemplo, se foi registrado às 22h do dia 1º de janeiro, o intervalo
  de 10 dias começaria às 00h do dia 2 de janeiro e terminaria às 23h59 do dia 11 de janeiro.

  Categoria D - Os itens nesta categoria deverão ser reparados dentro de 120 dias corridos,
  excluindo o dia da descoberta.

  4. ''Componentes inoperantes de um sistema inoperante'' são geralmente considerados componentes
  diretamente associados e não tendo nenhuma outra função além de dar suporte a esse sistema.
  Sistemas de aviso/alerta associados ao sistema inoperante devem estar operacionais, a menos
  que o relaxamento seja especificamente autorizado a eles pela MMEL.

  5. ''Condições de gelo'' significa um ambiente atmosférico que pode causar a formação de
  gelo na aeronave ou nos motores. As condições de formação de gelo podem ser conhecidas ou
  previstas e podem estar definidas no Manual de Voo do Avião (Airplane Flight Manual - AFM),
  Manual de Voo da Aeronave de Asas Rotativas (Rotorcraft Flight Manual - RFM) ou Manual de
  Operação do Piloto (Pilot Operating Handbook - POH).

  6. ''Condições Meteorológicas Visuais (VMC)'' significa que o ambiente atmosférico é tal
  que permitiria que um voo prosseguisse sob regras de voo VFR. Isso não impede a operação
  sob regras de voo IFR.

  7. ''Conforme exigido pelos regulamentos (operacionais ou locais)'' significa que o item
  listado está sujeito a certas disposições (restritivas ou permissivas) expressas na legislação
  aplicável. Quando o equipamento não for necessário, ele pode ficar inoperante pelo tempo
  especificado por sua categoria de intervalo de reparo.

  8. ''Considerado Inoperante'' conforme usado na coluna Observações ou Exceções, significa
  que o item deve ser tratado para fins de despacho, taxiamento e voo como se estivesse inoperante.
  O item não deve ser usado ou operado até que o item original aliviado seja reparado. Inclui
  as seguintes ações adicionais: documentar o item na liberação de despacho (se aplicável),
  colocar placares e cumprir com todas as observações, exceções e disposições MMEL associadas,
  incluindo quaisquer procedimentos (M) e (O); considerar notas aplicáveis; e observar o intervalo
  de reparo.

  9. ''Desativado ou travado (secured)'' ou ambos, significa que o item especificado deve
  ser colocado em uma condição aceitável para voo seguro. Um método aceitável de desativação
  ou travamento pode ser recomendado pelo fabricante ou estabelecido pelo operador da aeronave.

  10. ''Dia corrido'' significa um período de 24 horas, de meia-noite à meia-noite, baseado
  em UTC ou no horário local, conforme selecionado pelo operador. Os dias corridos são dias
  consecutivos.

  11. ''Dia da descoberta'' significa o dia em que um defeito/avaria foi registrado nos registros
  de manutenção/diário de bordo da aeronave.

  12. ''Dia de voo'' é um período de 24 horas, de meia-noite à meia-noite, com base no UTC
  ou no horário local, conforme selecionado pelo operador, durante o qual pelo menos um voo
  é iniciado para a aeronave afetada.

  13. ''Dia ou luz do dia'' significa o período entre o início do crepúsculo civil matinal
  e o fim do crepúsculo civil vespertino relevante para o espaço aéreo aeronáutico local;
  ou qualquer outro período que possa ser prescrito pela autoridade competente.

  14. ''Equipamentos e Acessórios Não Essenciais (Nonessential Equipment and Furnishings -
  NEF)'' compreendem aqueles itens instalados na aeronave que não têm efeito na operação segura
  do voo e que não são exigidos pelas regras operacionais ou de certificação aplicáveis. São
  itens que, se inoperantes, danificados ou ausentes, não têm efeito na capacidade da aeronave
  de ser operada com segurança em todas as condições operacionais.

  15. ''Exigido pelos regulamentos'' ou outras declarações como ''Não exigido pelos regulamentos''
  ou ''Qualquer um além dos exigidos pelos regulamentos'' significa que o item listado está
  sujeito a certos requisitos expressos em regras operacionais. O número de itens exigidos
  pelas regras operacionais aplicáveis deve estar operante. Um traço pode ser usado quando
  o número exigido para despacho for variável. Quando o item listado não for exigido por regulamentos,
  ele pode ficar inoperante pelo tempo especificado pela categoria de reparo.

  16. "Inoperante" significa que o item não cumpre sua finalidade pretendida ou não está funcionando
  consistentemente dentro de seus limites operacionais ou tolerâncias aprovadas.

  17. ''Intervalo de reparo'' é o tempo ou frequência que uma aeronave pode ser operada com
  itens inoperantes especificados em uma MMEL ou MEL. O operador é responsável por realizar
  reparos dos itens inoperantes antes ou até a expiração dos intervalos de reparo estabelecidos
