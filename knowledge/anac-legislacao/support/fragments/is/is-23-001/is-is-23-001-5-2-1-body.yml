title: Os procedimentos de ensaio em voo objetivam verificar que a instalação dos equipamentos
text: '5.2.1 Os procedimentos de ensaio em voo objetivam verificar que a instalação dos equipamentos

  de VHF-COMM atende às prescrições das seções 23.1301, 23.1311, 23.1321 e 23.1431 do

  RBAC 23.'
