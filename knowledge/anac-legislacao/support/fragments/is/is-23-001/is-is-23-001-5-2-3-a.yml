cite: 5.2.3(a)
title: 5.2.3(a)
text: 'a) Para o ensaio de verificação de Recepção em Longo Alcance, deve ser executada uma

  curva de 360 graus com uma inclinação de, no mínimo, 10 graus. Em caso de perda de

  contato em determinada proa, são aceitáveis nivelamentos de asa momentâneos que per-

  mitam restabelecer a comunicação com a estação de solo.'
