text: 'b) Durante a execução do ensaio, deve ser possível estabelecer uma comunicação satisfa-

  tória, conforme critérios de clareza e intensidade (ver Apêndice C), com o equipamento

  da estação de solo a 15 milhas náuticas ou mais de distância e 2.000 pés de altura AGL

  sem obstruções do terreno.

  Aeronaves certificadas para operações IFR:'
