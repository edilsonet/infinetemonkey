title: 5.2.3(c)
text: 'c) Durante a execução do ensaio, deve ser possível estabelecer uma comunicação satisfa-

  tória, conforme critérios de clareza e intensidade (ver Apêndice C), com o equipamento

  da estação de solo a 80 milhas náuticas ou mais de distância e 5.000 pés de altura AGL

  sem obstruções do terreno.'
