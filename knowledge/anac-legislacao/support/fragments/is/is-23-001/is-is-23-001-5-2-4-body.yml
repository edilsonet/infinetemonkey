title: Recepção com Ângulo Elevado (aplicável apenas a aeronaves certificadas para operações
text: '5.2.4 Recepção com Ângulo Elevado (aplicável apenas a aeronaves certificadas para operações

  IFR e com teto operacional de 18.000 pés ou mais)

  Para o ensaio de verificação de Recepção com Ângulo Elevado, deve ser executada uma

  curva de 360 graus com uma inclinação de, no mínimo, 10 graus. Em caso de perda de con-

  tato em determinada proa, são aceitáveis nivelamentos de asa momentâneos que permitam

  restabelecer a comunicação com a estação de solo.Data de emissão: 28 de abril de 2017. IS
  nº 23-001

  Revisão A

  A comunicação com a estação de solo deve ser realizada, no mínimo, a cada 45 graus de

  curva. Caso a instalação da antena na aeronave não seja simétrica, a curva deve ser repetida

  para o outro lado.

  Durante a execução do ensaio, deve ser possível estabelecer uma comunicação satisfatória,

  conforme critérios de clareza e intensidade (ver Apêndice C), com o equipamento da estação

  de solo de 50 a 70 milhas náuticas de distância e 35.000 pés de altura AGL ou o teto opera-

  cional da aeronave, o que for menor.'
