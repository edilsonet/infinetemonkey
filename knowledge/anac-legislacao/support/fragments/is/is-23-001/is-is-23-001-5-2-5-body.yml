text: '5.2.5 Recepção na Configuração de Aproximação (aplicável apenas a aeronaves certificadas
  para

  operações IFR)

  Durante a execução do ensaio de Recepção na Configuração de Aproximação, deve ser pos-

  sível estabelecer uma comunicação satisfatória, conforme critérios de clareza e intensidade

  (ver Apêndice C), com o equipamento da estação de solo durante o retorno para o pouso

  final, com o trem de pouso estendido e os flaps na configuração de aproximação.'
