title: EMC
text: '5.2.6 EMC

  Durante a execução dos ensaios e operação normal da aeronave, deve ser verificado que não

  há efeitos adversos no desempenho de qualquer indicador ou sistema da aeronave, quando é

  realizada transmissão a partir do equipamento VHF-COMM ensaiado. Adicionalmente, deve

  ser verificado que o equipamento VHF-COMM ensaiado não sofre interferências de qual-

  quer outro sistema da aeronave.

  5.3 Características dos Equipamento das Estações de Solo'
