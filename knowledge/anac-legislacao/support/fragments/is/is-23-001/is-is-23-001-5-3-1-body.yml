title: Para os ensaios descritos nesta IS, a potência do transmissor da estação de solo considerada
text: '5.3.1 Para os ensaios descritos nesta IS, a potência do transmissor da estação de solo
  considerada

  é de 50 watts e a altura da antena 15 metros. Valores diferentes de distâncias e alturas
  para

  a realização dos ensaios podem ser propostos com base no Appendix 2 do Order 6050.32B

  da FAA.

  6 APÊNDICES

  6.1 APÊNDICE A - LISTA DE REDUÇÕES

  6.2 APÊNDICE B - REFERÊNCIAS

  6.3 APÊNDICE C - CRITÉRIOS DE CLAREZA E INTENSIDADE

  7 DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela ANAC.

  7.2 Esta IS entra em vigor na data de sua publicação.Data de emissão: 28 de abril de 2017.
  IS nº 23-001

  Revisão A'
