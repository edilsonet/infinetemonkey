text: 'APÊNDICE B - REFERÊNCIAS

  B.1 Referências Bibliográficas

  14 CFR Part 23 Airworthiness Standards: Normal, Utility, Acrobatic, and Commuter

  Category Airplanes.

  AC 20-67B Airborne VHF Communications Equipment Installations.

  AC 23-8C Flight Test Guide for Certification of Part 23 Airplanes.

  AC 23-15A Small Airplane Certification Compliance Program.

  AC 25-7C Flight Test Guide for Certification of Transport Category Airplanes.

  AC 27-1B Certification of Normal Category Rotorcraft.

  AC 29-2C Certification of Transport Category Rotorcraft.

  DO-186B Minimum Operational Performance Standards for Airborne Radio

  Communications Equipment Operating Within the Radio Frequency

  Range 117.975 - 137.000 MHz.

  ICA 102-9 Características Mínimas dos Equipamentos NAV/COM a Bordo de

  Aeronaves.

  Order 6050.32B Spectrum Management Regulations and Procedures Manual.

  RBAC 23 Requisitos de Aeronavegabilidade: Aviões Categoria Normal,

  Utilidade, Acrobática e Transporte Regional.

  TSO-C169a VHF Radio Communications Transceiver Equipment Operating Within

  Radio Frequency Range 117.975 To 137.000 Megahertz.Data de emissão: 28 de abril de 2017.
  IS nº 23-001

  Revisão A'
