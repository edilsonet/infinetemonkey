text: 'APÊNDICE C - CRITÉRIOS DE CLAREZA E INTENSIDADE

  C.1 Critérios de Clareza e Intensidade

  Clareza Significado

  1 Ininteligível

  2 Inteligível por vezes

  3 Inteligível com dificuldade

  4 Inteligível

  5 Perfeitamente inteligível

  Intensidade Significado

  1 Apenas perceptível

  2 Fraca

  3 Satisfatória

  4 Boa

  5 Ótima

  NOTA 1: Critérios de Clareza e Intensidade com classificação inferior a 3 (três) não são

  considerados aceitáveis.'
