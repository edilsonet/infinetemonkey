title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 23-001

  Revisão A

  Aprovação: Portaria nº 1.395/SAR, de 24 de abril de 2017.

  Assunto: Execução de Ensaios em Voo para Avaliação de

  Desempenho de Equipamentos de Comunicação em VHF

  (VHF-COMM) instalados em Aeronaves certificadas

  segundo o RBAC 23.

  SAR/GGCP

  1 OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem por objetivo orientar a execução de ensaios em voo
  (ou

  voo de demonstração de cumprimento de requisitos) para a avaliação de desempenho de

  equipamentos de comunicação rádio VHF-COMM instalados em aeronaves certificadas se-

  gundo o RBAC 23.

  NOTA 1 - Esta IS descreve um meio aceitável, mas não o único meio para obter a certifica-

  ção. Um meio ou procedimento alternativo devidamente justificado pode ser utilizado, exi-

  gindo-se, nesse caso, a análise e concordância expressa do órgão competente da ANAC. O

  meio ou procedimento alternativo mencionado deve garantir nível de segurança igual ou

  superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo do procedimento

  normalizado nesta IS.

  2 REVOGAÇÃO

  2.1 Esta IS substitui a CI 21-020A, de 22 de fevereiro de 2008.

  3 FUNDAMENTOS

  3.1 O Artigo 68 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que a autoridade

  aeronáutica emitirá certificado de tipo para aeronaves, motores e hélices que satisfizerem
  os

  requisitos aplicáveis dos Regulamentos Brasileiros da Aviação Civil - RBAC.

  3.2 O Regulamento Brasileiro de Aviação Civil - RBAC 21, Subpartes B a E, estabelece requi-

  sitos para a emissão de um certificado de tipo e suplementar de tipo.

  3.3 O RBAC 23, Subparte F, estabelece os requisitos para equipamentos instalados em aerona-

  ves certificadas segundo este regulamento.

  4 DEFINIÇÕES

  4.1 Above Ground Level: Altura medida acima da altitude de referência da estação de solo
  de

  VHF.

  5 DESENVOLVIMENTO DO ASSUNTO

  5.1 AplicabilidadeData de emissão: 28 de abril de 2017. IS nº 23-001

  Revisão A'
