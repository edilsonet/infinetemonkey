title: FUNDAMENTOS
text: 'FUNDAMENTOS

  3.1 O artigo 68 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que a Autoridade
  aeronáutica emitirá certificado de homologação de tipo de aeronave, motores, hélices e outros
  produtos aeronáuticos que satisfizerem as exigências e requisitos dos Regulamentos.

  3.2 O Regulamento Brasileiro da Aviação Civil - RBAC nº 21 estabelece as condições nas quais
  um requerente pode obter aprovação de uma grande modificação ao projeto de tipo.

  DEFINIÇÕES - N/A'
