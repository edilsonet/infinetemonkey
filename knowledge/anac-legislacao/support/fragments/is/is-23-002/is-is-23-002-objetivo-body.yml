title: OBJETIVO
text: 'OBJETIVO

  Esta Instrução Suplementar - IS fornece informações para obtenção de aprovação de grandes
  modificações a serem incorporadas em aviões com peso máximo de decolagem (MTOW - Maximum
  Takeoff Weight) igual ou inferior a 5 670 kg (12 500 lb), certificados nas categorias Normal,
  Utilidade e Acrobática e com peso máximo de decolagem (MTOW) igual ou inferior a 8 618 kg
  (19 000 lb), certificados na Categoria Transporte Regional, para adaptá-los para o transporte
  de carga.'
