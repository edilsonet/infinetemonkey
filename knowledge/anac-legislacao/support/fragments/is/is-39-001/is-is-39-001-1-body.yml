title: OBJETIVO
text: '1. OBJETIVO

  1.1 Esta Instrução Suplementar - IS esclarece e orienta a aplicação dos requisitos contidos

  no RBAC 39 - Diretrizes de Aeronavegabilidade, quanto ao fluxo de informações,

  competências, responsabilidades, aplicabilidade, elaboração, procedimentos

  regulamentares, requisitos de registro e de controle de cumprimento das Diretrizes de

  Aeronavegabilidade.'
