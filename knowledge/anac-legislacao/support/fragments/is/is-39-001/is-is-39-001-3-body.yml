title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 A Resolução ANAC nº 30/2008, em seu artigo 14, estabelece que a Instrução

  Suplementar (IS) é norma de caráter geral, que objetiva esclarecer, detalhar e

  orientar a aplicação de requisito previsto em RBAC.

  3.2 O parágrafo 1º do mesmo artigo determina que, para demonstrar o cumprimento de

  requisito previsto em RBAC, o administrado poderá adotar os meios e procedimentos

  previamente especificados em IS ou apresentar meio ou procedimento alternativo

  devidamente justificado, exigindo-se, nesse caso, a análise e concordância expressa

  da ANAC. O meio ou procedimento alternativo deve garantir nível de segurança

  igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo do

  procedimento normatizado em IS.

  3.3 O RBAC 39, em sua seção 39.5, estabelece que a ANAC emitirá uma Diretriz de

  Aeronavegabilidade para um produto quando a própria ANAC constatar que exista

  uma condição insegura nesse produto e seja provável que essa condição insegura exista

  ou se manifeste em outros produtos que tenham o mesmo projeto de tipo.

  3.4 Uma Diretriz de Aeronavegabilidade, ou documento equivalente, emitido por

  Autoridade de Aviação Civil do Estado de Projeto, é considerada, conforme o referido

  regulamento, como uma Diretriz de Aeronavegabilidade emitida pela própria ANAC.'
