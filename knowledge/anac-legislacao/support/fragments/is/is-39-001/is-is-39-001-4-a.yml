cite: 4(a)
title: 4(a)
text: 'a) Um evento pode ocorrer que possa resultar em fatalidades, geralmente com a perda
  da

  aeronave, ou redução da capacidade da aeronave ou na habilidade da tripulação em

  lidar em condições operacionais adversas:

  I - Uma grande redução nas margens de segurança ou na capacidade funcional, ou

  II - Esforço físico ou carga de trabalho excessiva que dificulte a tripulação de voo

  em desempenhar suas funções adequadamente, ou

  III - Danos sérios ou fatais a um ou mais ocupantes a menos que se evidencie que a

  probabilidade da ocorrência deste evento esteja limitada de acordo com os

  requisitos de aeronavegabilidade aplicáveis.'
