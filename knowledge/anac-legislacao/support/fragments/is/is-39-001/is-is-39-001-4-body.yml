text: '4. DEFINIÇÕES

  4.1 Componente: material processado, peça ou conjunto que constitui parte integrante de

  uma aeronave, motor ou hélice, que seja empregado em sua fabricação; dispositivo ouOrigem:
  SAR 2/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  acessório instalado, cuja falha ou funcionamento incorreto possa afetar a segurança do

  voo ou dos ocupantes da aeronave. Para os efeitos desta IS, componente é entendido

  também como equipamento.

  4.2 Componente Controlado: aquele que possui limites de utilização para revisão,

  substituição, teste e/ou calibração previstos no programa de manutenção do fabricante.

  Estes limites podem ser estipulados em horas de utilização, número de pousos ou de

  ciclos, tempo calendárico, métodos estatísticos de controle ou quaisquer outros

  métodos de controle pré-definidos e aprovados; podem ser propostos pelos fabricantes

  (inicialmente e de forma conservativa) ou pelos operadores (em função de suas

  operações específicas), com a necessária aprovação e o acompanhamento da

  autoridade de aviação civil. Para os efeitos desta IS, componente controlado é

  entendido também como equipamento controlado.

  4.3 Condição insegura: uma condição insegura existe se há evidência constatada da

  experiência em serviço, análises ou testes que mostrem que:'
