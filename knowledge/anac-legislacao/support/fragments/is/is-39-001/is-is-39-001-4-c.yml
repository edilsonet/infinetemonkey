title: 4(c)
text: 'c) Os dispositivos de projeto destinados a minimizar os efeitos de um acidente sem

  vítimas fatais não desempenham adequadamente suas funções.

  4.4 Diretriz de Aeronavegabilidade - DA: o RBAC 39 estabelece que as Diretrizes de

  Aeronavegabilidade da ANAC são prescrições legais que se aplicam aos seguintes

  produtos: aeronaves, motores de aeronaves, hélices, e equipamentos. Estabelecem,

  conforme o caso, inspeções, modificações, instruções, procedimentos e limitações

  aplicáveis a produtos aeronáuticos, quando existir uma condição insegura nesse

  produto e essa condição tiver probabilidade de existir ou se desenvolver em outros

  produtos de mesmo projeto de tipo.

  4.5 Documento de Serviço: para os efeitos desta IS, um documento de serviço é definido

  como uma publicação que transmite informações importantes relacionadas à

  segurança, melhoria do produto e práticas de manutenção ou de operação. Boletim de

  Serviço e Boletim Operacional são exemplos de documento de serviço.

  4.6 Ficha de Cumprimento de Diretriz de Aeronavegabilidade - FCDA: formato

  aceitável de registro primário, relacionado à análise da aplicabilidade e aoOrigem: SAR
  3/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  cumprimento de uma Diretriz de Aeronavegabilidade, no caso de ser aplicável ao

  produto aeronáutico utilizado pelo proprietário/operador.

  4.7 Estado de Projeto: no contexto desta IS, é o Estado que tem, na data de emissão da

  DA (ou documento equivalente), a jurisdição sobre a organização responsável pelo

  projeto do produto aeronáutico (aeronave, motor de aeronave, hélice ou equipamento)

  ao qual a DA é aplicável; ou, no caso de DA (ou documento equivalente) aplicável a

  produtos modificados por Certificado Suplementar de Tipo (ou equivalente), a

  jurisdição sobre a organização responsável pelo Certificado Suplementar de Tipo (ou

  equivalente).

  4.8 Produto Aeronáutico: para os efeitos desta IS, produto aeronáutico significa uma

  aeronave, um motor ou uma hélice, assim como equipamentos e partes dos mesmos.

  Inclui ainda qualquer instrumento, mecanismo, peça, aparelho, pertence, acessório e

  equipamento de comunicação, desde que sejam usados ou que se pretenda usar na

  operação e no controle de uma aeronave em voo, que sejam instalados ou fixados à

  aeronave e que não sejam parte de uma aeronave, um motor ou uma hélice. Inclui,

  finalmente, materiais e processos usados na fabricação de todos os itens acima.

  4.9 Mapa de Controle de DA: formato aceitável de registro secundário, relacionado à

  aplicabilidade, controle e cumprimento de uma Diretriz de Aeronavegabilidade.

  4.10 Notificação de Proposta de Regra: documento elaborado pela ANAC para coletar

  comentários entre os diversos setores envolvidos numa possível futura

  regulamentação.'
