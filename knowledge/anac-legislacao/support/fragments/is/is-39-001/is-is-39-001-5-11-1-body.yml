title: Uma DA torna obrigatório o cumprimento das instruções de aeronavegabilidade
text: '5.11.1 Uma DA torna obrigatório o cumprimento das instruções de aeronavegabilidade

  continuada presentes em seu texto e pode referenciar, no todo ou em parte, uma

  instrução de aeronavegabilidade continuada fornecida pelo fabricante do produto

  afetado. Essa instrução passa a ser denominada requisito.'
