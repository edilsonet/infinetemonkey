title: Todas as empresas certificadas segundo os RBACs 121 e 135 devem controlar e
text: '5.12.1 Todas as empresas certificadas segundo os RBACs 121 e 135 devem controlar e

  registrar a aplicação de cada DA para os produtos aeronáuticos que façam parte de

  suas Especificações Operativas, conforme aplicável, de uma forma aceitável pela

  ANAC. O RBHA 91 e os RBACs 121 e 135 estabelecem que o proprietário ou o

  operador de uma aeronave deve conservar estes registros, que apresentem a descrição

  do serviço realizado para cumprir cada DA (registro primário), e que comprovem aOrigem:
  SAR 9/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  situação atual das DAs aplicáveis (registro secundário). Tais registros devem incluir,

  para cada DA, o método utilizado para cumpri-la, o número e a data de revisão da

  mesma, bem como, quando a DA requerer ações periódicas, o tempo e a data em que

  a próxima ação será requerida. A seção seguinte apresenta meios aceitáveis, visando o

  cumprimento dos regulamentos citados.

  5.13 Registro Primário de Cumprimento de uma DA'
