cite: 5.13.1
title: Um registro primário de cumprimento de DA deve ser completo e claro, contendo o
text: '5.13.1 Um registro primário de cumprimento de DA deve ser completo e claro, contendo
  o

  método de cumprimento utilizado e o resultado da ação executada. Exemplificando,

  uma DA normalmente requer inspeções periódicas, que podem ser do tipo inspeção

  visual ou por ensaio não destrutivo, até a incorporação de uma ação final, que poderá

  estar descrita, por referência, em um Boletim de Serviço. Assim, o registro de

  cumprimento da DA deve deixar claro o tipo de inspeção que foi realizado, o intervalo

  até a próxima ação repetitiva ou, se for realizada a ação final, a referência ao

  procedimento do Boletim de Serviço que foi executado. Em outro exemplo, uma DA

  pode também requerer uma revisão em procedimentos operacionais do Manual de Voo

  da aeronave. Desta forma, o registro deve deixar claro que as páginas do Manual de

  Voo foram substituídas por páginas com os procedimentos operacionais atualizados.'
