text: 'i) Dados da incorporação da DA: identificação de dados como TSN (Time Since New),

  CSN (Cycles Since New), TSO (Time Since Overhaul), CSO (Cycles Since Overhaul),

  TSLI (Time Since Last Inspection), CSLI (Cycles Since Last Inspection), posição de

  instalação do produto (ex: motor posição 2, hélice motor 1, “em estoque”, etc.).Origem:
  SAR 10/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C'
