section_title: 'Um registro primário de cumprimento de uma DA deve conter:'
subsection_id: j
cite: 5.13.2(j)
title: 5.13.2(j)
text: 'j) Método de cumprimento utilizado: descrição do método utilizado e se as referências

  são as indicadas na DA (alínea (h)) ou conforme Método Alternativo de Cumprimento

  (ver subseção 5.18). Ex.: Cumprida a inspeção visual requerida pela Parte I da DA;

  cumprida a inspeção de líquido penetrante requerida pela Parte II; inseridas as

  instruções da DA no Manual de Voo da aeronave; cumprida a ação terminal

  incorporando o SB 99-99-99; instalado componente X, P/N 999-999-999, conforme

  requerido pelo parágrafo a), etc.'
