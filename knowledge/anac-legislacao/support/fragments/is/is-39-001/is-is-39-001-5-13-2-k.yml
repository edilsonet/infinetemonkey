section_title: 'Um registro primário de cumprimento de uma DA deve conter:'
subsection_id: k
cite: 5.13.2(k)
title: 5.13.2(k)
text: 'k) Resultado: de acordo com o método de cumprimento utilizado, descrição dos

  resultados obtidos na execução dos requisitos da DA. Ex.: Verificado que o P/N do

  equipamento X instalado é 900-20, não sendo aplicável a troca do mesmo; feita

  inspeção visual e não verificada existência de trincas ou corrosão; feita inspeção por

  líquido penetrante, encontrada trinca e reparado acordo, etc.'
