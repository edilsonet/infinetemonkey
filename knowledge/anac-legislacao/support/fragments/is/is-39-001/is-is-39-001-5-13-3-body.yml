title: Um exemplo/modelo de registro primário é disponibilizado no Portal da ANAC
text: '5.13.3 Um exemplo/modelo de registro primário é disponibilizado no Portal da ANAC

  (https://sistemas.anac.gov.br/certificacao/Form/Form.asp), em formulário específico

  de nome “Ficha de Cumprimento de Diretriz de Aeronavegabilidade - FCDA”.'
