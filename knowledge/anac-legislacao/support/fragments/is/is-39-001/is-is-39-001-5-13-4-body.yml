title: Uma Organização de Manutenção de Produto Aeronáutico que presta serviço para uma
text: '5.13.4 Uma Organização de Manutenção de Produto Aeronáutico que presta serviço para
  uma

  empresa certificada segundo os RBAC 121, 135, ou para um Operador conforme

  RBHA 91 (ou RBAC que venha a substituí-lo), deve manter cópia do registro de

  cumprimento (registro primário) previsto nesta seção para cada DA, referente a cada

  serviço executado.

  5.14 Registro Secundário de Cumprimento de uma DA'
