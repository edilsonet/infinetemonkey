title: Um registro secundário de cumprimento de DA pode ser efetuado por meio de uma
text: '5.14.1 Um registro secundário de cumprimento de DA pode ser efetuado por meio de uma

  planilha ou mapa de situação de cumprimento de DA. Este mapa ou planilha pode ser

  elaborado e/ou atualizado ao se atestar uma Inspeção Anual de Manutenção - IAM,

  ou quando da realização de cada inspeção prevista no Programa de Manutenção

  recomendado pelo fabricante ou aprovado pela ANAC, ou ainda por ocasião do

  cumprimento de uma DA. O mapa de controle de DA é uma sistemática que permiteOrigem: SAR
  11/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  uma consulta rápida quanto à situação do cumprimento de DA em uma aeronave,

  motor, hélice ou componente, somente sendo válido se juntamente comprovado por

  um registro primário. Tal planilha ou mapa não substitui um registro primário.'
