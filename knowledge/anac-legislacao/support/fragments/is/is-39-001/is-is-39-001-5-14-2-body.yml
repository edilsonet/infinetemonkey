text: '5.14.2 Os formulários que trazem modelos de mapas de controle de diretrizes aplicáveis
  a

  aeronave, motor, hélice e equipamento, estão disponíveis no Portal da ANAC

  (https://sistemas.anac.gov.br/certificacao/Form/Form.asp). Eles não são de uso

  obrigatório, mas sugerem um conteúdo adequado a ser controlado pelos operadores.'
