title: As aeronaves fabricadas no Brasil, por ocasião da Vistoria Técnica Inicial realizada
text: '5.14.3 As aeronaves fabricadas no Brasil, por ocasião da Vistoria Técnica Inicial realizada

  pela ANAC, deverão obrigatoriamente apresentar um mapa ou planilha da situação

  das Diretrizes de Aeronavegabilidade incorporadas pelo fabricante e a atualização das

  DAs já incorporadas em produto aeronáutico importado e instalado na aeronave.

  5.15 Controle de Cumprimento de uma DA'
