title: Todas as DAs aplicáveis aos modelos das aeronaves, motores, hélices e quaisquer
text: '5.15.1 Todas as DAs aplicáveis aos modelos das aeronaves, motores, hélices e quaisquer

  outros equipamentos aeronáuticos devem ter os registros de cumprimento controlados,

  mesmo que para um determinado produto aeronáutico não seja aplicável uma certa

  DA. Neste caso, deve constar nos registros deste produto a referência a esta DA como

  sendo “Não Aplicável”, e a justificativa da não aplicabilidade. Por exemplo, pode

  ocorrer que uma DA seja aplicável a determinado produto, mas não inclua certos

  números de série.'
