title: O efetivo controle das DAs é obrigatório para todos os proprietários e operadores de
text: '5.15.2 O efetivo controle das DAs é obrigatório para todos os proprietários e operadores
  de

  aeronaves. A falta de controle ou dos registros de manutenção que comprovem o

  cumprimento de uma DA, implicará a perda da condição aeronavegável do produto ao

  qual a DA é aplicável e, caso este produto esteja instalado em uma aeronave ou a DA

  seja aplicável a uma aeronave, esta também perderá a condição aeronavegável e,

  consequentemente, perderá a validade do seu CA. Adicionalmente, seu proprietário/

  operador ficará sujeito às sanções administrativas previstas no CBAer. Conforme o

  Artigo 70 do CBAer e seção 91.403 (a) do RBHA 91 (ou a seção correspondente do

  RBAC que venha a substituí-lo), os proprietários ou os operadores são os responsáveis

  primários pela conservação dos produtos que operam em condições aeronavegáveis.

  A observância deste item é considerada condição indispensável para demonstração à

  ANAC de que esta responsabilidade é efetivamente exercida.

  5.16 Envio de Dados Requeridos'
