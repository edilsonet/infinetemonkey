title: Conforme estabelece a seção 39.19 do RBAC n° 39, qualquer pessoa poderá propor à
text: '5.18.1 Conforme estabelece a seção 39.19 do RBAC n° 39, qualquer pessoa poderá propor
  à

  ANAC um método alternativo de cumprimento de uma DA ou mudança no prazo de

  cumprimento desta, desde que essa proposta forneça um nível de segurança aceitável,

  no mínimo equivalente aos requisitos estabelecidos na DA. Esse método alternativo

  de cumprimento só poderá ser usado após a aprovação da ANAC.'
