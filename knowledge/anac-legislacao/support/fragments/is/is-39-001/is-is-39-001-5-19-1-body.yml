title: A seção 39.23 do RBAC 39 prevê que um operador de uma aeronave afetada por uma
text: '5.19.1 A seção 39.23 do RBAC 39 prevê que um operador de uma aeronave afetada por uma

  DA pode solicitar à ANAC uma Autorização Especial de Voo - AEV para trasladar

  essa aeronave até um local adequado para a execução das ações requeridas por uma

  DA.'
