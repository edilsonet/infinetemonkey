title: O RBAC n° 39 estabelece que as Diretrizes de Aeronavegabilidade emitidas pela
text: '5.2.1 O RBAC n° 39 estabelece que as Diretrizes de Aeronavegabilidade emitidas pela

  autoridade de aviação civil do Estado de Projeto do produto são consideradas como

  Diretrizes de Aeronavegabilidade Brasileiras e, desta forma, são também de

  cumprimento obrigatório para todos os produtos aeronáuticos.

  5.3 Abreviaturas e Denominações'
