title: O proprietário ou o operador de uma aeronave deve ter ciência de que, por ocasião de
text: '5.20.1 O proprietário ou o operador de uma aeronave deve ter ciência de que, por ocasião
  de

  uma Vistoria Técnica Inicial ou Especial, realizada pela ANAC ou Profissional

  Credenciado, é obrigatória a apresentação dos registros primários (cadernetas, FCDA,

  etc.) e do mapa atualizado da situação de cumprimento de DA para a aeronave, motor,

  hélice e componentes instalados, conforme aplicável.'
