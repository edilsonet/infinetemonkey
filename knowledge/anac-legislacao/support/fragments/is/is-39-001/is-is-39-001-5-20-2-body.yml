title: A falta, ou seja, a não apresentação, durante o período de realização da vistoria técnica,
text: '5.20.2 A falta, ou seja, a não apresentação, durante o período de realização da vistoria
  técnica,

  dos registros de manutenção que comprovem o cumprimento de uma DA, acarretará a

  perda da condição de aeronavegabilidade do produto aeronáutico, devendo, neste caso,

  ser emitida pelo servidor designado para a vistoria uma Notificação de CondiçãoOrigem: SAR
  13/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  Irregular de Aeronave - NCIA, com prazo de cumprimento “antes do próximo voo”.

  A apresentação somente do mapa da situação de cumprimento não é suficiente para a

  demonstração de cumprimento de uma DA, pois o mesmo não substitui o registro

  primário de cumprimento.'
