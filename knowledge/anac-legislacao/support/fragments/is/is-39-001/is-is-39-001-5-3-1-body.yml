title: Uma Diretriz de Aeronavegabilidade normalmente utiliza um sistema de abreviaturas
text: '5.3.1 Uma Diretriz de Aeronavegabilidade normalmente utiliza um sistema de abreviaturas

  que leva em consideração o Estado de Projeto do produto aeronáutico. São

  apresentadas abaixo as abreviaturas e denominações correspondentes a alguns países

  de maior interação com o Brasil e signatários da Convenção de Chicago. As Diretrizes

  de Aeronavegabilidade dos países não citados, desde que sejam signatários da

  Convenção de Chicago, têm o mesmo caráter de cumprimento obrigatório, quandoOrigem: SAR
  4/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  aplicáveis a produtos aeronáuticos de origem estrangeira em operação no Brasil. Caso

  particular se faz em relação à Comunidade Europeia, cuja responsabilidade pela

  emissão das Diretrizes de Aeronavegabilidade pertence à EASA (European Aviation

  Safety Agency).

  PAÍS Denominação Abreviatura

