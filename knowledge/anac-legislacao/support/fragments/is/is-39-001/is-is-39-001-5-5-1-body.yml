title: Um produto aeronáutico que possui DA aplicável, seja DA brasileira ou estrangeira,
text: '5.5.1 Um produto aeronáutico que possui DA aplicável, seja DA brasileira ou estrangeira,

  perde a condição aeronavegável no momento em que o prazo para cumprir seus

  requisitos vencer, ou os requisitos estipulados no texto da DA não forem corretamente

  cumpridos. Esta condição inclui motores, hélices e demais equipamentos, inclusive

  aqueles não instalados. Neste caso o proprietário/operador fica sujeito às sanções

  previstas no Código Brasileiro de Aeronáutica - CBAer.'
