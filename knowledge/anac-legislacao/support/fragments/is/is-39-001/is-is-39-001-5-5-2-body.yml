title: Uma DA pode estabelecer como requisito uma ação final (inspeções, modificações,
text: '5.5.2 Uma DA pode estabelecer como requisito uma ação final (inspeções, modificações,

  instruções, procedimentos e/ou limitações) que extinguem a situação insegura que

  originou a DA, ações recorrentes (inspeções ou procedimentos periódicos) que visam

  monitorar uma possível situação insegura até um limite pré-estabelecido (quando

  geralmente é disparada uma ação final), ou uma combinação de ambas.'
