title: Quando uma DA que estabelece como requisito uma ação final e, após certa data ou
text: '5.5.3 Quando uma DA que estabelece como requisito uma ação final e, após certa data
  ou

  intervalo de tempo, ações complementares, esta possui, entre a ação final e a

  complementar, a condição de cumprimento parcial, e esta informação deve ser

  devidamente preenchida na Ficha de Cumprimento de Diretriz de Aeronavegabilidade

  (FCDA). Entretanto, é importante ser observado que, uma vez iniciada a ação inicial

  ou as ações complementares, estas devem ser finalizadas em suas ocasiões pertinentes,

  gerando a FCDA correspondente, que pode ser outra ação parcial, ação final ou

  repetitiva. Caso estas ações não sejam finalizadas nas ocasiões previstas, a DA será

  considerada como não cumprida. A pendência em finalizar a ação no períodoOrigem: SAR 5/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  determinado é considerada como o não cumprimento de uma DA. Nesta situação, a

  aeronave estará em situação não aeronavegável, seu Certificado de

  Aeronavegabilidade - CA será suspenso pela ANAC, e o proprietário/operador fica

  sujeito às sanções previstas no Código Brasileiro de Aeronáutica - CBAer.

  5.6 Metodologia de Notificação de Proposta de Regra - NPR- DA'
