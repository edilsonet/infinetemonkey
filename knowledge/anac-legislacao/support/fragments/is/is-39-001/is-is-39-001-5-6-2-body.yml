title: Em geral, o prazo para receber as propostas dos interessados após a publicação de uma
text: '5.6.2 Em geral, o prazo para receber as propostas dos interessados após a publicação
  de uma

  NPR - DA para comentários no sítio da ANAC varia de 30 a 60 dias, a partir da data

  de sua emissão, e normalmente está estabelecido no próprio texto da NPR - DA.

  Propostas recebidas após esse prazo não são consideradas.'
