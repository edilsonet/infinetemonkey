title: A lista de distribuição de uma NPR - DA abrange o fabricante ou a organização
text: '5.6.3 A lista de distribuição de uma NPR - DA abrange o fabricante ou a organização

  responsável pelo projeto de tipo do produto aeronáutico afetado e os operadores, bem

  como, quando aplicável, a autoridade de aviação civil do Estado de Projeto. As NPR-

  DA podem ser verificadas no Portal da ANAC (https://sistemas.anac.gov.br/

  certificacao/NPR/NPR.asp).'
