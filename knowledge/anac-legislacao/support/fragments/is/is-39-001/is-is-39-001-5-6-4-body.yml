title: Qualquer pessoa pode submeter seu comentário ou sugestão por ocasião da consulta
text: '5.6.4 Qualquer pessoa pode submeter seu comentário ou sugestão por ocasião da consulta

  pública de uma NPR - DA. A ANAC inclusive recomenda que as empresas

  certificadas segundo os RBAC n° 121, 135 e 145 emitam comentários a respeito de

  NPR - DA aplicável aos produtos aeronáuticos constantes de suas Especificações

  Operativas - EO, pois dependendo de seu conteúdo, uma DA poderá afetar suas

  operações de forma significativa.

  5.7 Emissão de DA'
