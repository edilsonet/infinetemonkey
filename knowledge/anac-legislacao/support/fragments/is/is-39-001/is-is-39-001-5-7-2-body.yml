title: 'Diretriz de Aeronavegabilidade de Emergência - DAE: em função da gravidade'
text: '5.7.2 Diretriz de Aeronavegabilidade de Emergência - DAE: em função da gravidade

  e/ou urgência gerada por um determinado evento, a ANAC pode emitir uma DAE sem

  consulta pública prévia, justificado o interesse público. A divulgação desta será feita

  pelo meio mais rápido possível (em geral, por correio eletrônico), para possibilitar

  alertar a comunidade afetada da forma mais imediata, e possibilitar seu cumprimento

  nos prazos exíguos normalmente estabelecidos neste tipo de DA.'
