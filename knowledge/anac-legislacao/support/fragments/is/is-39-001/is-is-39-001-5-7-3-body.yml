title: 'Diretriz de Aeronavegabilidade - DA: será emitida em consequência ou não de uma'
text: '5.7.3 Diretriz de Aeronavegabilidade - DA: será emitida em consequência ou não de uma

  NPR- DA, divulgada de acordo com sistemática normal, requerendo o cumprimento

  no prazo estabelecido na mesma, contado a partir da sua data de efetividade.'
