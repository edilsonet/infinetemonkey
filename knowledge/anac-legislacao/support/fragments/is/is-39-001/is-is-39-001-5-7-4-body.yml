title: 'Diretriz de Aeronavegabilidade editada no idioma inglês: as DAs brasileiras'
text: '5.7.4 Diretriz de Aeronavegabilidade editada no idioma inglês: as DAs brasileiras

  também podem ser emitidas em inglês para os produtos aeronáuticos brasileiros em

  operação no exterior e para os produtos aeronáuticos de projeto estrangeiro em

  operação no Brasil.Origem: SAR 6/16

  Data de emissão: 2 de agosto de 2019 IS nº 39-001

  Revisão C

  Nota: Em caso de divergência de interpretação entre os textos em português e inglês,

  prevalecerá o texto da DA editada em língua portuguesa.

  5.8 Acesso ao texto de uma DA'
