title: As empresas podem utilizar o portal da ANAC (www.anac.gov.br) para verificar as
text: '5.8.1 As empresas podem utilizar o portal da ANAC (www.anac.gov.br) para verificar
  as

  DAs aplicáveis aos seus produtos. Para o caso das DAs emitidas por outras autoridades

  de aviação civil, o portal da ANAC oferece os links para as principais autoridades dos

  países fabricantes dos produtos importados em operação no Brasil.

  5.9 Determinação de DA aplicáveis'
