cite: 5.9.1
title: Quando uma autoridade de aviação civil do Estado de Projeto de um motor de
text: '5.9.1 Quando uma autoridade de aviação civil do Estado de Projeto de um motor de

  aeronave, de uma hélice ou de um equipamento emitir uma instrução de

  aeronavegabilidade continuada mandatória (DA ou documento equivalente) para tais

  produtos, estas instruções passam a ser de cumprimento obrigatório para toda aeronave

  que possua estes produtos instalados. Por exemplo, a autoridade do Estado de Projeto

  pode emitir uma DA que afete um certo equipamento; se este equipamento estiver

  instalado na aeronave em questão, a DA passa a ser de cumprimento obrigatório para

  aquela aeronave.'
