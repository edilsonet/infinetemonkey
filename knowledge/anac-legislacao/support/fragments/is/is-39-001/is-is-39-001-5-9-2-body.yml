text: '5.9.2 Similarmente, quando uma autoridade de aviação civil do Estado de Projeto de
  um

  Certificado Suplementar de Tipo - CST (ou equivalente) emitir uma instrução de

  aeronavegabilidade continuada mandatória aplicável a aeronaves, motores de

  aeronaves ou hélices modificados conforme aquele CST (ou equivalente), estas

  instruções passam a ser de cumprimento obrigatório por toda aeronave em que (ou em

  cujo motor ou hélice) tal modificação tenha sido realizada.

  5.10 Incorporação de uma DA'
