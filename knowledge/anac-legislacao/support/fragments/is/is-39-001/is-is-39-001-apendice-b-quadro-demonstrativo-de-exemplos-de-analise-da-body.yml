text: 'APÊNDICE B - QUADRO DEMONSTRATIVO DE EXEMPLOS DE ANÁLISE DA

  SISTEMÁTICA PARA DEFINIÇÃO DAS DIRETRIZES DE

  AERONAVEGABILIDADE BRASILEIRA E DE OUTROS PAÍSES, APLICÁVEIS A

  UM PRODUTO AERONÁUTICO EM OPERAÇÃO NO BRASIL

  EXEMPLO DE

  CONFIGURAÇÕES

  DE AERONAVES

  EQUIPAMENTO PAÍS DE

  ORIGEM

  CUMPRIMENTO

  OBRIGATÓRIO

  AERONAVE

  “A”

  AERONAVE BRASIL Todas as DA

  MOTOR (ES) CANADÁ Todas as DA e CF

  HÉLICE (S) EUA Todas as DA e AD

  AERONAVE

  “B”

  AERONAVE FRANÇA Todas as CN e DA

  MOTOR (ES) EUA Todas as AD e DA

  HÉLICE (S) EUA Todas as AD e DA

  AERONAVE

  “C”

  AERONAVE HOLANDA Todas as BLA e DA

  MOTOR (ES) CANADÁ Todas as CF e DA

  HÉLICE (S) EUA Todas as AD e DA

  AERONAVE

  “D”

  AERONAVE BRASIL Todas as DA

  MOTOR (ES) EUA Todas as DA e AD

  HÉLICE (S) CANADÁ Todas as DA e CF

  EQUIPAMENTO EUA Todas as DA e AD

  AERONAVE

  “E”

  AERONAVE EUA Todas as AD e DA

  MOTOR (ES) FRANÇA Todas as CN e DA

  HÉLICE (S) CANADÁ Todas as CF e DA

  EQUIPAMENTO EUA Todas as AD e DA

  AERONAVE

  “F”

  AERONAVE EUA Todas as AD e DA

  MOTOR (ES) EUA Todas as AD e DA

  HÉLICE (S) EUA Todas as AD e DA

  EQUIPAMENTO EUA Todas as AD e DA

  AERONAVE

  “G”

  AERONAVE EUA Todas as AD e DA

  MOTOR (ES) INGLATERRA Todas as DA e AD

  (SB*)

  HÉLICE (S) CANADÁ Todas as CF e DA

  EQUIPAMENTO EUA Todas as AD e DA

  AERONAVE

  “H”

  AERONAVE ITÁLIA Todas as PA e DA

  MOTOR (ES) EUA Todas as AD e DA

  HÉLICE (S) CANADÁ Todas as CF e DA

  EQUIPAMENTO FRANÇA Todas as CN e DA

