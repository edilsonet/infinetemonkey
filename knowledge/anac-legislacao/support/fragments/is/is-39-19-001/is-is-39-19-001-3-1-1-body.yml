title: A seção 39.17 do RBAC 39 estabelece que se uma modificação em um produto afetar, de
text: '3.1.1 A seção 39.17 do RBAC 39 estabelece que se uma modificação em um produto afetar,
  de

  algum modo, a capacidade de cumprir as ações requeridas pela Diretriz de

  Aeronavegabilidade, a aprovação de um Método Alternativo de Cumprimento deve ser

  solicitada à ANAC. A menos que seja demonstrado que a modificação prévia já eliminou a

  condição insegura, tal solicitação deverá incluir as ações específicas que estão sendo

  propostas para eliminar a condição insegura. A solicitação para a aprovação de um método

  alternativo de cumprimento deverá ser feita de acordo com a seção 39.19 do RBAC 39.'
