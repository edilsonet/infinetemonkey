title: A seção 39.19 do RBAC 39 estabelece que qualquer pessoa pode propor à ANAC um
text: '3.1.2 A seção 39.19 do RBAC 39 estabelece que qualquer pessoa pode propor à ANAC um

  Método Alternativo de Cumprimento ou uma mudança no prazo de cumprimento, desde que

  essa proposta forneça um nível de segurança aceitável. Esse Método Alternativo de

  Cumprimento só poderá ser usado após aprovação pela ANAC.

  4 DEFINIÇÕES'
