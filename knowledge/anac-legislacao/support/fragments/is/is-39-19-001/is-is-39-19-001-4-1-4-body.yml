text: '4.1.4 Diretriz de Aeronavegabilidade - DA: de acordo com o RBAC 39.3, as Diretrizes
  de

  Aeronavegabilidade da ANAC são prescrições que se aplicam aos seguintes produtos:

  aeronaves, motores de aeronaves, hélices e equipamento. A DA é um documento emitido

  pela ANAC de cumprimento obrigatório pelas partes afetadas e, conforme o caso, estabelece19/08/2016
  IS Nº 39.19-001

  Revisão A

  inspeções, modificações, procedimentos e limitações aplicáveis a um produto aeronáutico

  quando existir uma condição insegura nesse produto e essa condição tiver probabilidade de

  existir ou se desenvolver em outros produtos de mesmo projeto de tipo.'
