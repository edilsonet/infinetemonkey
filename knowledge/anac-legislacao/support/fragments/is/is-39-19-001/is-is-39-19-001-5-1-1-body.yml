text: '5.1.1 Uma Diretriz de Aeronavegabilidade contém o(s) método(s) requerido(s) para a
  correção de

  uma condição insegura. Um Método Alternativo de Cumprimento - MAC é uma forma

  alternativa, que não a estritamente especificada no texto da DA, que endereça a condição

  insegura em um produto aeronáutico. O MAC deve prover um nível de segurança aceitável

  ao estabelecido pela DA.'
