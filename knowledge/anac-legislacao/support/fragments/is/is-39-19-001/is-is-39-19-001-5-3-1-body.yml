title: O RBAC 39.19 estabelece que qualquer pessoa pode propor à ANAC um método alternativo
text: '5.3.1 O RBAC 39.19 estabelece que qualquer pessoa pode propor à ANAC um método alternativo

  ou uma mudança no prazo de cumprimento, desde que essa proposta forneça um nível de

  segurança aceitável. Esse MAC só poderá ser usado após a aprovação da ANAC.'
