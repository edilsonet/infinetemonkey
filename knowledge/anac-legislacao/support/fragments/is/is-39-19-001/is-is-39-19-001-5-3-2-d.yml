id: is-is-39-19-001-5-3-2-d
kind: is
document: is-39-19-001
family: '39'
section_id: 5.3.2
section_title: O requerente deve enviar à GGCP a proposta de MAC, através de documento a ser
subsection_id: d
cite: 5.3.2(d)
title: 5.3.2(d)
text: 'd) uma completa e detalhada descrição do MAC proposto para aprovação pela ANAC,

  que inclua:

  I - Nome do produto;

  II - PN;

  III - SN;

  IV - Descrição do dano, quando aplicável;

  V - Modificações, alterações, reparos existentes;

  VI - Método alternativo já existente, e/ou intervalo de recorrência e/ou

  mudança no prazo de cumprimento, conforme aplicável;

  VII - Descrição técnica do procedimento alternativo proposto;

  VIII - Fotos e desenhos; e

  IX - Quaisquer outros detalhes ou documentos julgados necessários para

  caracterizar a proposta de MAC que demonstrem um nível de segurança

  aceitável. Por exemplo: a substanciação analítica da proposta ou o suporte

  à proposta por meio de ensaios e/ou testes.'
