title: A ANAC não é obrigada a aceitar um MAC caso não sejam preenchidos todos os requisitos
text: '5.5.1 A ANAC não é obrigada a aceitar um MAC caso não sejam preenchidos todos os requisitos

  para sua aceitação, ou caso a proposta não forneça um nível de segurança aceitável frente

  aos requisitos estabelecidos pela DA. Neste caso, a ANAC enviará um ofício ao requerente

  informando que o pedido foi indeferido. O ofício incluirá os motivos da não aceitação do

  MAC.

  5.6 A revisão e a revogação de um MAC'
