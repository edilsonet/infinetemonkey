title: O RBAC 39 estabelece que os documentos equivalentes a uma Diretriz de
text: '5.7.1 O RBAC 39 estabelece que os documentos equivalentes a uma Diretriz de

  Aeronavegabilidade emitidos pela autoridade de aviação civil - AAC do Estado de Projeto

  do produto (Autoridade Primária) são consideradas como Diretrizes de Aeronavegabilidade19/08/2016
  IS Nº 39.19-001

  Revisão A

  emitidas pela própria ANAC e, desta forma, são de cumprimento obrigatório para todos os

  produtos aeronáuticos registrados no Brasil ou instalados em aeronaves registradas no Brasil.'
