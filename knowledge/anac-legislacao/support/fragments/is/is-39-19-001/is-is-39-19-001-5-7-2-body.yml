title: Quando um Método Alternativo de Cumprimento, referente a uma DA emitida pela
text: '5.7.2 Quando um Método Alternativo de Cumprimento, referente a uma DA emitida pela

  Autoridade Primária, for aprovado como sendo um MAC de aplicação geral aos produtos de

  um projeto de tipo determinado no MAC, caracteriza-se um Global AMOC (Alternative

  Method of Compliance - AMOC). Nesta condição, considera-se que as condições

  estabelecidas pelo RBAC 39.19(b) são satisfeitas e sua aceitação é automática, dispensando

  a necessidade por parte de operadores/proprietários que quiserem aplicar este MAC de

  requererem a aprovação de MAC à ANAC.'
