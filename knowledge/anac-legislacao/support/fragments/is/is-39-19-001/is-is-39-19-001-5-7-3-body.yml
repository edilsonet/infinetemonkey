title: Para os casos de MAC que não se caracterizem como um Global AMOC, ou seja, naqueles
text: '5.7.3 Para os casos de MAC que não se caracterizem como um Global AMOC, ou seja, naqueles

  em que o MAC é emitido para uma aeronave ou operador específico, este MAC não pode

  ser utilizado sem uma aprovação prévia da ANAC. Assim, é necessário que o operador

  solicite a aprovação de um MAC à ANAC. Neste caso o documento pode auxiliar a

  substanciação do pedido, mas uma avaliação técnica será feita pela ANAC.

  6 APÊNDICES'
