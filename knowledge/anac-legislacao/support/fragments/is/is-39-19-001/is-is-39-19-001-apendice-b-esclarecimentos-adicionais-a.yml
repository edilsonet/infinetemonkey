title: apendice-b-esclarecimentos-adicionais(a)
text: 'a) Uma DA revisa uma DA anterior aplicável a um produto. Um detentor do

  certificado havia obtido um MAC para a versão anterior da DA.

  I - Comentário: Neste caso, a aplicabilidade do MAC anterior para a nova

  DA é questionável e depende das instruções desta nova DA. Se a nova DA

  inclui provisões para aceitar MAC aprovados para a DA anterior, então o

  MAC anteriormente obtido é valido para a nova DA. Entretanto, se o texto

  da nova DA não inclui estas provisões, então o MAC anteriormente obtido

  perdeu a validade.'
