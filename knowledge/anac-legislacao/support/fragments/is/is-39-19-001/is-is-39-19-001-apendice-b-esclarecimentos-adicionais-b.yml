cite: apendice-b-esclarecimentos-adicionais(b)
title: apendice-b-esclarecimentos-adicionais(b)
text: 'b) Durante a aplicação de uma DA, foi encontrada uma trinca na região prevista. O

  detentor do certificado obteve do fabricante a aprovação de um reparo diferente do

  especificado no documento de referência chamado pela DA.

  I - Comentário: O detentor do certificado necessita requerer um MAC, a

  menos que a DA especifique que o reparo deva ser conforme um método

  especificado pelo fabricante. Adicionalmente, ou o detentor do certificado

  ou o fabricante devem requerer um MAC para reparos diferentes dos

  especificados por um documento de referência determinado por uma DA.'
