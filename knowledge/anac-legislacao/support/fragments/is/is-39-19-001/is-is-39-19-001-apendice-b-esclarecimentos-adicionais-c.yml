cite: apendice-b-esclarecimentos-adicionais(c)
title: apendice-b-esclarecimentos-adicionais(c)
text: 'c) Os documentos de referência determinam a instalação de um PN específico, por

  exemplo, um rebite. O detentor do certificado tem outro PN que deseja instalar.

  I - Comentário: O texto de uma DA é bem específico. Portanto, não pode ser

  utilizado outro Part Number - PN de rebite, ou mesmo, qualquer desvio

  de procedimento na instalação deste PN sem que seja necessário requerer

  um MAC. É importante observar que caso seja substituído o PN sem que

  o MAC tenha sido aprovado, o detentor do certificado viola a seção 39.19

  do RBAC 39 a cada vez que a aeronave é operada ou o produto é utilizado,

  conforme as seções 39.7 e 39.9 do RBAC 39.'
