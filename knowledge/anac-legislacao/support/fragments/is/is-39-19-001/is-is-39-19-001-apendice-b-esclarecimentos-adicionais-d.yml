title: apendice-b-esclarecimentos-adicionais(d)
text: 'd) Uma DA requer uma inspeção por END em certa área de um produto. Entretanto,

  o operador anterior instalou um reparo ou alteração e a inspeção por END ou não é

  possível ou traz resultados duvidosos.

  I - Comentário: O detentor do certificado necessita requerer um MAC toda

  vez que um reparo ou alteração interfere com o resultado esperado de uma

  inspeção, mesmo que o detentor possa fisicamente executar a inspeção.

  B.3 Em acessórios afetados por uma DA'
