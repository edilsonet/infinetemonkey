title: apendice-b-esclarecimentos-adicionais(e)
text: 'e) O texto de uma DA determina a execução de ações de um documento de referência.

  Este documento de referência especifica ações de um dos manuais de manutenção.

  Entretanto, o detentor do certificado desenvolveu procedimentos diferentes do

  estipulado no manual de manutenção.

  I - Comentário: Novamente, o procedimento ditado no texto de uma DA é

  mandatório. Portanto, se o detentor do certificado quer utilizar um

  procedimento diferente, deverá requerer um MAC.19/08/2016 IS Nº 39.19-001

  Revisão A

  B.2 Em áreas afetadas por uma DA'
