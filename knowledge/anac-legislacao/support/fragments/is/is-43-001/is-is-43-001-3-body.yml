title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 O artigo 67 da Lei Federal nº 7.565, de 19 de dezembro de 1986, prevê que somente pode-

  rão ser usadas aeronaves, motores, hélices e demais componentes que observem os padrões

  e requisitos previstos nos RBAC1, ressalvada a operação de aeronave experimental.

  3.2 A mesma Lei Federal, em seu artigo 70, parágrafo 2º, estabelece que todo explorador
  ou

  operador de aeronave deve executar ou fazer executar a manutenção de aeronaves, moto-

  res, hélices e demais componentes, a fim de preservar as condições de segurança do projeto

  aprovado.

  3.3 O RBAC 21 define as condições nas quais um produto aeronáutico pode ser considerado

  um produto aprovado.'
