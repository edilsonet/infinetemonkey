text: 'f) Certificado de Homologação de Tipo fabricando de acordo com a Subparte F do

  RBAC 21: Detentor qualificado a, desde que executando conforme ou a aprovação

  de Sistema de Inspeção de Produção Aprovado - SIPA, recondicionar ou modificar

  qualquer aeronave, motor e hélice aeronáutico, ou componente ou peça fabricado pe-

  lo mesmo, ou executar qualquer inspeção requerida pelo RBAC 91; ou'
