text: '5.1.1 A destinação incorreta de peças e materiais irrecuperáveis de aeronaves por venda,
  descar-

  te ou transferência é uma prática que ocorre através dos portadores/interceptadores de tais

  itens. Em alguns casos, esses itens reaparecem para venda e como peças de serviço. A fal-

  sificação do estado de peças e materiais e a prática de tornar esses itens utilizáveis resultam

  no uso inadvertido de itens fora-de-serviço e não-conformes.'
