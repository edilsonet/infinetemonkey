cite: 5.1.3(b)
title: 5.1.3(b)
text: 'b) O RBAC 21 requer que o detentor da aprovação de produção estabeleça e mantenha

  um sistema de controle de qualidade, ou um Sistema de Inspeção de Produção Apro-

  vado - SIPA (dependendo do tipo de aprovação), que assegure que cada peça apre-

  sentada esteja de acordo com seu projeto de tipo e em condição de operação segura.'
