title: 5.1.3(e)
text: 'e) O RBAC 45 prescreve os requisitos para identificação de aeronaves, motores aero-

  náuticos e hélices que são fabricados por detentor de CHE, para identificação de cer-

  tas peças de reposição e modificação produzidas para instalação em produtos com

  projeto de tipo aprovado e marcas de nacionalidade e matrícula de aeronaves regis-

  tradas no Brasil.'
