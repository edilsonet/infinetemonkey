cite: 5.1.3(f)
title: 5.1.3(f)
text: 'f) A Subparte E do RBAC 91 trata de reparos, manutenção preventiva e modificações.

  Esta seção inclui as responsabilidades do operador/proprietário em manter a aerona-

  ve em condição aeronavegável, inspecionada e mantida de acordo com o RBAC 43 e

  assegurar que os registros são executados aprovando a aeronave para retorno ao ser-

  viço. Uma peça instalada, sem uma aprovação conforme os requisitos do RBAC 21,

  invalida o CA da aeronave, pois esta é uma das condições necessárias para manter o

  certificado válido. Uma aeronave sem um CA válido é, desta maneira, considerada

  não aeronavegável.2009-05-11 IS nº 43-001

  Revisão A'
