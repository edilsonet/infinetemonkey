title: As normas de execução de reposição de peças e materiais utilizados em reparos, manuten-
text: '5.1.5 As normas de execução de reposição de peças e materiais utilizados em reparos,
  manuten-

  ção, manutenção preventiva e modificações de aeronaves que tenham (ou tiveram) um CA

  emitido pelo Brasil e componentes das mesmas são especificadas nos RBAC 43.13 e

  145.57. Estas normas requerem que o instalador de uma peça utilize métodos, técnicas e

  práticas aceitas pela ANAC. Adicionalmente, o instalador de uma peça deve executar o

  serviço e utilizar materiais com qualidade de maneira que o produto ou dispositivo esteja

  pelo menos em estado igual ao original ou apropriadamente modificado com respeito às

  qualidades que afetem a aeronavegabilidade.'
