title: A aeronavegabilidade continuada de uma aeronave, o que inclui a reposição de peças,
  é
text: '5.1.6 A aeronavegabilidade continuada de uma aeronave, o que inclui a reposição de
  peças, é

  responsabilidade do operador/proprietário, conforme especificado no artigo 70 da Lei Fe-

  deral nº 7.565/86 e nos RBAC 91.403, 121.363 e 135.413. Estas regras requerem que o

  instalador determine que a peça seja aceita para instalação em um produto ou componente

  antes do retorno deste ao serviço com aquela peça instalada.'
