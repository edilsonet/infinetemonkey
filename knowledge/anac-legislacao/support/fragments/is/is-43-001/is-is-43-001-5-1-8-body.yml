title: Como parte da determinação de que a peça cumpre com todos os regulamentos aplicáveis,
text: '5.1.8 Como parte da determinação de que a peça cumpre com todos os regulamentos aplicáveis,

  o instalador deve identificar se a peça foi fabricada sob uma aprovação de produção de a-

  cordo com o RBAC 21, se uma peça original aceita foi mantida de acordo com o RBAC

  43, ou se a mesma é, de alguma maneira, aceitável para instalação. Por exemplo: determi-

  nar o cumprimento com dados técnicos aprovados pela ANAC.

  5.2 Destinação e descarte de materiais e peças irrecuperáveis'
