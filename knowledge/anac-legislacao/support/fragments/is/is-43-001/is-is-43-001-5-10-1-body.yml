text: '5.10.1 Algumas peças suspeitas aparentam ser tão boas quanto às produzidas a partir
  de uma fonte

  aprovada pela ANAC. Entretanto, alguns processos de fabricação podem ter sido executa-

  dos em desacordo com os dados aprovados pela ANAC e o comprador pode não conseguir

  identificá-los visualmente, como é o caso de tratamento térmico, tratamento superficial
  ou

  diversos ensaios e inspeções.'
