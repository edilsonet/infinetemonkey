title: Pessoas com conhecimento de violações de segurança ou outras circunstâncias que possam
text: '5.10.2 Pessoas com conhecimento de violações de segurança ou outras circunstâncias
  que possam

  afetar a segurança da aviação estão encorajadas a reportá-las. As denúncias podem ser rea-

  lizadas utilizando-se o formulário, Relato de Suspeita de Peça Não Conforme (F-043-01)

  ou documento equivalente, que poderá ser enviado diretamente para o endereço de e-mail:

  pac@anac.gov.br ou pelo correio para o seguinte endereço:

  Superintendência de Aeronavegabilidade - SAR

  Grupo de Aeronavegabilidade Continuada - PAC

  Avenida Cassiano Ricardo, 521 - Bloco B - 3º Andar - Pq.Residencial Aquarius

  12246-870 - São José dos Campos - SP - BRASIL

  5.11 Resumo

  A aprovação para retorno ao serviço após manutenção de aeronave, motor, hélice, disposi-

  tivos e materiais ou peças é de responsabilidade da pessoa que executa a manutenção e que

  assina os registros para aprovação de retorno ao serviço. O operador/proprietário é respon-

  sável pela aeronavegabilidade continuada da aeronave. Para assegurar a segurança contí-

  nua na aviação civil, é essencial que dados apropriados sejam utilizados em inspeções, en-

  saios e na determinação da aceitabilidade de todas as peças e materiais. Atenção particular

  deve ser praticada quando a origem das peças, materiais e dispositivos não pode ser deter-

  minada ou quando a origem é duvidosa.'
