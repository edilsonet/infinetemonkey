title: Pessoas que necessitem descartar peças e materiais irrecuperáveis devem, quando apropri-
text: '5.2.1 Pessoas que necessitem descartar peças e materiais irrecuperáveis devem, quando
  apropri-

  ado, mutilar estas peças e materiais antes do descarte. A mutilação deve ser executada de

  tal maneira que tornem estes materiais inutilizáveis quanto ao seu uso original. Peças muti-

  ladas não devem ter condições físicas de serem remanufaturadas ou camufladas para terem

  a aparência de aprovadas para o uso, por exemplo: re-galvanização, redução de compri-

  mento com re-usinagem da rosca de parafusos mais longos, soldagem, endireitamento, usi-

  nagem, limpeza, polimento, ou repintura.'
