title: A mutilação pode ser executada por apenas um dos procedimentos seguintes ou por com-
text: '5.2.2 A mutilação pode ser executada por apenas um dos procedimentos seguintes ou por
  com-

  binação destes, mas não é limitada a estes:

  I- Esmerilhamento;

  II- Incineração;

  III- Remoção de manípulo ou outro detalhe que caracterize a peça ou material;

  IV- Deformação permanente de peças;2009-05-11 IS nº 43-001

  Revisão A

  V- Furação por oxi-corte ou serra;

  VI- Fundição;

  VII- Corte em pequenos pedaços.'
