title: Os procedimentos seguintes são exemplos de mutilação que são frequentemente menos
text: '5.2.3 Os procedimentos seguintes são exemplos de mutilação que são frequentemente menos

  eficazes:

  I- Estampagem (tal como estampar uma letra numa peça);

  II- Pintura;

  III- Marcas de martelo;

  IV- Identificação por etiqueta ou marcação;

  V- Execução de pequenos furos com broca;

  VI- Corte por serra em dois pedaços. Pessoas que retrabalham peças irrecuperáveis e

  materiais podem ser altamente capazes tecnicamente e saberem como remontar peças

  cortadas em dois pedaços de tal maneira que a mutilação torna-se difícil de detectar.'
