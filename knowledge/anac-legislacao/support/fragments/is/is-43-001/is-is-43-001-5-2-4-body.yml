title: Peças irrecuperáveis podem ser descartadas para uso legítimo, desde que não sejam utili-
text: '5.2.4 Peças irrecuperáveis podem ser descartadas para uso legítimo, desde que não sejam
  utili-

  zadas para vôo. Tais usos podem englobar treinamento e educação, pesquisa e desenvolvi-

  mento, ou aplicações fora da aviação. Para tanto, a mutilação pode não ser apropriada. Os

  métodos seguintes devem ser utilizados para prevenir o uso errôneo:

  I- Marcação permanente ou estampagem das peças, subpartes e materiais como

  “FORA DE SERVIÇO”. Pintura não é um método aceitável;

  II- Remoção do número de identificação original;

  III- Remoção da placa de identificação (data plate);

  IV- Manutenção de um sistema de contabilidade ou rastreamento, por número de sé-

  rie ou outro dado individual para registrar as transferências de peças e materiais irre-

  cuperáveis de aeronaves; e

  V- Incluir procedimentos escritos da garantia da qualidade envolvendo destinação de

  descarte de tais peças e materiais em acordo ou contrato de transferência.

  NOTA: Peças e materiais irrecuperáveis ou com vida-limite expirada não devem ser

  destinados às pessoas ou organizações que possam utilizá-los como originalmente

  aprovado devido à criticalidade de falha e o risco potencial à segurança.'
