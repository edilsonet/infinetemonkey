cite: 5.2.6(a)
title: 5.2.6(a)
text: 'a) Peças de reposição de fabricação nacional: O formulário SEGVOO 003 “Certificado

  de Liberação Autorizada” identifica a aprovação e a conformidade para exportação

  de uma peça de um grupo de componentes a partir dos detentores da aprovação de

  produção. Serve também como aprovação para retorno ao serviço após reparo, manu-

  tenção, manutenção preventiva ou modificação por uma empresa de manutenção ae-

  ronáutica autorizada de acordo com o RBAC 145, ou empresa de transporte aéreo

  nacional que possua um Programa de Manutenção de Aeronavegabilidade Continua-

  da de acordo com o RBAC 121 e 135;'
