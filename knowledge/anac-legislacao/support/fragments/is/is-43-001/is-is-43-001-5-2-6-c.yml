subsection_id: c
cite: 5.2.6(c)
title: 5.2.6(c)
text: 'c) Peças usadas podem ser identificadas pelos registros requeridos para aprovação de

  retorno ao serviço como descrito no RBAC 43.9. O formulário SEGVOO 001 pode

  ser utilizado com este fim se os requisitos do RBAC 43.9 estão contidos ou anexados

  ao formulário e for dada aprovação para retorno ao serviço por uma empresa de ma-

  nutenção aeronáutica nacional certificada pela ANAC ou transportador aéreo nacio-

  nal, sob o requisito de seu Programa de Manutenção de Aeronavegabilidade Conti-

  nuada. Não há formato ou formulário padronizado para um registro de manutenção

  ou modificação/reparo. Entretanto, os dados ou informações utilizadas para identifi-

  car uma peça devem ser rastreáveis por uma pessoa autorizada a executar e aprovar o

  retorno ao serviço sob o RBAC 43. Os registros devem conter como dados técnicos

  mínimos os descritos no RBAC 43.9; e'
