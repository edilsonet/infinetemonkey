cite: 5.2.6(d)
title: 5.2.6(d)
text: 'd) Apontamento pelo vendedor: O vendedor pode estar apto a fornecer a documentação

  que demonstre rastreabilidade por um processo de produção aprovado pela ANAC

  através de um dos seguintes meios:

  I- Peças produzidas de acordo com uma aprovação de produção, ou seja, segundo

  uma aprovação de sistema de inspeção de produto aprovado (SIPA) ou segun-

  do um CHE (o que inclui CHT, APAA e OTP); ou

  II- Peças produzidas por um fabricante estrangeiro de acordo com o RBAC 21,

  subparte N; ou

  III- Peças normalizadas produzidas por um fabricante específico; ou

  IV- Peças distribuídas via autorização para embarque direto; ou

  V- Peças produzidas pela empresa de manutenção aeronáutica para o trabalho de

  reparo ou modificação de um produto específico com projeto de tipo aprovado;

  ou2009-05-11 IS nº 43-001

  Revisão A

  VI- Peças produzidas por um proprietário ou operador para instalação em aeronave

  própria ou sob operação, isto é, com Certificado de Homologação de Empresa

  de Transporte Aéreo - CHETA; ou

  VII- Peças com registros de remoção demonstrando rastreabilidade com um produto

  de projeto de tipo aprovado, assinado por pessoa devidamente certificada;'
