cite: 5.2.6(e)
title: 5.2.6(e)
text: 'e) Marcação OTP: Segundo o RBAC 21.607(b), a marcação OTP é obrigatória para

  produtos fabricados de acordo com um APAA emitido conforme uma OTP. Uma

  marcação OTP deve ser permanente e legível contendo os seguintes dados:

  I- Nome e endereço do fabricante; e

  II- O nome, tipo, número da peça ou part number - P/N ou designação do modelo

  do artigo; e

  III- O número de série ou serial number - S/N, ou data de fabricação do artigo, ou

  ambos; e

  IV- O número OTP aplicável.'
