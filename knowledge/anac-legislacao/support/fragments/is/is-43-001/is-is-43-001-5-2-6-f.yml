cite: 5.2.6(f)
title: 5.2.6(f)
text: 'f) Aprovação por APAA: Cada produto fabricado de acordo com o RBAC 21.303 deve

  ser marcado com as letras “ANAC-PAA” (ou “CTA-PAA”, para produtos fabricados

  até 11 de dezembro de 2006) e, adicionalmente, de acordo com o RBAC 45.15:

  I- Nome da peça ou marca patenteada; e

  II- Símbolo ou Trademark; e

  III- Número da peça ou part number - P/N; e

  IV- Nome e designação do modelo de cada produto certificado no qual a peça é e-

  legível para instalação.

  NOTA: Uma alternativa para peças que são muito pequenas ou, de outra maneira,

  impraticáveis de serem marcadas, é mostrar as informações acima em uma etiqueta

  fixada na peça ou num contêiner identificado. Se a marcação na etiqueta é muito ex-

  tensa de ser praticada, a etiqueta fixada a peça ou o contêiner pode referenciar-se a

  um manual ou catálogo disponível para informações de elegibilidade da peça.

  NOTA: Quando o requerente possui o direito de uso do projeto de tipo aprovado

  conforme um contrato de licenciamento, o que inclui número de peça, e peças de re-

  posição produzidas sob o contrato, o número da peça pode ser idêntico ao do deten-

  tor do projeto de tipo, certificando-se que o detentor do APAA inclua as letras “A-

  NAC-PAA” e o que símbolo de identificação do detentor do APAA esteja na peça.

  Em todos os outros casos, o P/N do detentor do APAA deve ser diferente do detentor

  do projeto de tipo.'
