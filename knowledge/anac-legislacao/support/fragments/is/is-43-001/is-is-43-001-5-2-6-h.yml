text: 'h) Autorização de Embarque Direto: Para que peças fabricadas no Brasil com autoriza-

  ção de embarque direto sejam reconhecidas com sendo produzidas por um fabricante

  sob uma aprovação de produção da ANAC, o fabricante deve, em específico, autori-2009-05-11
  IS nº 43-001

  Revisão A

  zar o fornecedor por escrito e deve estabelecer procedimentos para assegurar que as

  peças embarcadas atendam o projeto aprovado e estejam em condição de operação

  segura. Uma declaração do detentor do certificado de tipo autorizando o fornecedor

  ao embarque direto e a data de autorização deve ser incluída na etiqueta de embar-

  que, ordem de fabricação ou outro documento. Este deve conter uma afirmação de

  que tal produto específico foi produzido sob um certificado de produção.'
