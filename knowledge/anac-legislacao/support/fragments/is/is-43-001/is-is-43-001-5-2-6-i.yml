cite: 5.2.6(i)
title: 5.2.6(i)
text: 'i) Documento de retorno ao serviço: Um documento, assinado por uma pessoa devida-

  mente certificada, qualificada para uma função relevante que atesta que o item retor-

  nou ao serviço após a manutenção ou o ensaio de funcionamento ter sido executado.

  Este tipo de documentação pode ser na forma de uma etiqueta da empresa de manu-

  tenção aeronáutica contendo informações adequadas conforme o RBAC 43.9, ordem

  de serviço, formulário SEGVOO 003, formulário SEGVOO 001, ou registros de ma-

  nutenção, dentre as quais se incluem descrições apropriadas do serviço de manuten-

  ção executado, tal como estabelecido nos requisitos de registro do RBAC 43.9 e do

  Apêdice B do RBAC 43.

  NOTA: Quando uma pessoa não devidamente certificada atesta que há o embarque

  da peça correta solicitada, a única informação que se pode inferir é que o P/N coin-

  cide com a ordem de compra, não o estado de aceitabilidade da peça pela ANAC.

  5.4 Informações relevantes de peças usadas

  As seguintes informações podem ser úteis na avaliação dos registros de manutenção e do

  estado da peça:'
