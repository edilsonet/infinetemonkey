title: 5.5.2(a)
text: 'a) Kits Eletrônicos: Kits montados por indivíduos não-certificados não são elegíveis

  para instalação em aeronaves com projeto de tipo aprovado até que o componente es-

  teja certificado como aeronavegável e determinado que seja elegível para instalação,

  de acordo com os RBACs 21 e 43. Durante e após a montagem, estes kits devem re-

  ceber inspeções documentadas de conformidade, por pessoas devidamente certifica-

  das para assegurar que cumprem com todos os requisitos de aeronavegabilidade apli-

  cáveis para uso na aeronave em específico na qual serão instalados. A instalação des-

  tas unidades aprovadas deve ser executada por ou sob supervisão de uma pessoa ou

  empresa devidamente certificada de acordo com os RBACs 21 e 43. Quando a insta-

  lação é uma grande modificação, os dados do kit e dados utilizados para a modifica-

  ção do produto devem ser aprovados pela ANAC. Uma pessoa devidamente certifi-

  cada deve efetuar os registros de manutenção para assegurar que a aeronave está a-

  provada e aeronavegável para retorno ao serviço;'
