text: '5.5.2 Tais itens, embora marcados como “recondicionado”, “alta qualidade”, “como novo”,
  “sem

  uso” ou “aparentemente bom”, devem ser cuidadosamente avaliados antes de serem com-

  prados. Frequentemente, o tempo de estoque, condições de estocagem e prazo de validade

  de peças excedentes não são identificáveis.

  5.6 Condições para operação segura2009-05-11 IS nº 43-001

  Revisão A

  Peças e materiais devem ser devidamente armazenados, protegidos e mantidos para assegu-

  rar a aeronavegabilidade. Os seguintes fatores devem ser considerados para determinação

  da aeronavegabilidade:'
