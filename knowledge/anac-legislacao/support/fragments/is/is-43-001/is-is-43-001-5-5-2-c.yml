text: 'c) Instrumentos da Aeronave: Instrumentos descritos como “alta qualidade”, “aparen-

  temente bom”, ou “recondicionado” ou que foram adquiridos de aeronave envolvida

  em acidente não devem ser postos em serviço a menos que sejam inspecionados, en-

  saiados e/ou revisados, se necessário, por uma empresa de manutenção aeronáutica2009-05-11
  IS nº 43-001

  Revisão A

  certificada pela ANAC e o instalador ateste que, para a aeronave em particular, o ins-

  trumento instalado cumprirá como os regulamentos aplicáveis.

  NOTA: Instrumentos são altamente suscetíveis a danos latentes causados por manu-

  seio grosseiro ou condições de armazenagem impróprias, por isso instrumentos que

  tenham sido dispostos em prateleira por um período de tempo não determinável, de-

  vem ser ensaiados por uma pessoa devidamente certificada pela ANAC.

  5.8 Conheça seus fornecedores

  Peças Usadas e Reparadas: Peças não-aprovadas, usadas ou reparadas podem ser ofertadas

  para venda e apresentadas “como nova”, “quase nova”, e “recondicionada”. Tais termos

  não auxiliam o comprador em determinar positivamente se a peça é aceitável para instala-

  ção em um produto com projeto de tipo aprovado e não constituem legalmente demonstra-

  ção e condição de serviço de peças para aeronaves.

  NOTA: É responsabilidade do instalador assegurar a aeronavegabilidade. Distribuidores

  de peças de aeronaves, companhias fornecedoras de aeronaves ou distribuidores de peças

  eletrônicas para aeronaves não podem certificar a aeronavegabilidade das peças que ofe-

  recem e/ou vendem ao menos que possuam uma aprovação de produção conforme o

  RBAC 21. Logo, é responsabilidade do instalador requisitar a documentação para deter-

  minar a rastreabilidade de acordo com uma aprovação de produção.

  5.9 Detecção de peça não-aprovada

  A aeronavegabilidade de um produto aeronáutico deve ser posta em dúvida se o projeto e a

  qualidade das peças são desconhecidos. A identificação positiva de uma peça não-aprovada

  pode se tornar complicada se tal peça possuir características muito similares às de uma
  pe-

  ça aprovada. As orientações a seguir podem auxiliar nessa identificação:'
