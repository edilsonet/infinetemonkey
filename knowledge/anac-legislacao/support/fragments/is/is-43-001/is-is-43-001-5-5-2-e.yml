title: 5.5.2(e)
text: 'e) Peças com selagem interna: Selagens internas em peças como bombas, válvulas, atu-

  adores, motores, geradores e alternadores estão sujeitos a deterioração de estocagem

  por longo tempo e são suscetíveis a falhas pré-maturas em serviço. Um procedimento

  deve ser estabelecido para controle de itens com prazo de validade de maneira a pre-

  venir falhas pré-maturas de componentes/peças, a menos que outros procedimentos

  preventivos sejam aplicados;'
