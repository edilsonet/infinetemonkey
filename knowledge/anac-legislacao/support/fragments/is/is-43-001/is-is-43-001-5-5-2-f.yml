text: 'f) Componentes rotativos: Componentes rotativos, como hélices, peças de motor e lâ-

  minas do rotor principal, podem ter uma vida-limite ou tempo de retirada de serviço.

  Registros de manutenção devem refletir a continuidade do tempo de serviço e histó-

  rico de manutenção. Informações que indicam que o limite de vida foi ultrapassado

  podem, em alguns casos, serem obtidas a partir do fabricante ou de uma empresa de

  manutenção aeronáutica aprovada pela ANAC, que pode fixar um logo, decalque, ou

  outro tipo de identificação;'
