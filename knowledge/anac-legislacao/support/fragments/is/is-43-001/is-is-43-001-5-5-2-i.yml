text: 'i) Refugo: Peças que não foram aprovadas no critério de inspeção da garantia da quali-

  dade do fabricante pela não-conformidade com o projeto de tipo podem ser ofereci-

  das para venda, mesmo sendo refugo e sem serem adequadamente mutiladas ou des-

  truídas para torná-las inutilizáveis, sendo inaceitáveis para instalação;'
