title: 5.9.1(b)
text: 'b) Métodos de avaliação de distribuidores e/ou fornecedores não conhecidos, com a fi-

  nalidade de determinar se as peças apresentam risco potencial de serem “não aprova-

  das”. As seguintes situações podem trazer riscos:

  I- Um distribuidor ou fornecedor oferece uma peça por preço significativamente

  menor que o praticado pelos seus concorrentes.

  II- Um prazo de entrega significativamente menor que o praticado pelo mercado,

  especialmente quando um item se encontra com o estoque esgotado.2009-05-11 IS nº 43-001

  Revisão A

  III- Ofertas de distribuidores não identificados, que criam a percepção de que o u-

  suário final terá a sua disposição um vasto suprimento de peças, componentes e

  materiais.

  IV- Incapacidade do distribuidor e/ou do fornecedor em providenciar documenta-

  ção de substanciação, comprovando que a peça foi produzida de acordo com

  uma aprovação da ANAC, ou foi inspecionada, reparada, revisada, preservada

  ou alterada conforme estabelecido em RBAC.'
