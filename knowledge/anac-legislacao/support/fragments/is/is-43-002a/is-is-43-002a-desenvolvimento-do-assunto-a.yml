title: desenvolvimento-do-assunto(a)
text: 'a) as habilitações necessárias. Normalmente são requeridas habilitações em célula e
  grupo motopropulsor, exceto nos seguintes casos:

  I - para planadores, não é requerida habilitação no grupo motopropulsor, conforme o parágrafo
  43.7(b)-I(5) do RBAC nº 43; e

  II - para aeronaves submetidas a manutenção preventiva, de acordo com o parágrafo A43.1(c)
  do Apêndice A do RBAC nº 43, não é necessária habilitação específica, conforme o parágrafo
  43.7(b)-II do RBAC nº 43;'
