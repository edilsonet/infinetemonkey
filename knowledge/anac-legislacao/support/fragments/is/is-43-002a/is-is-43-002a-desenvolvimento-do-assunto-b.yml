section_id: desenvolvimento-do-assunto
section_title: Desenvolvimento do Assunto
subsection_id: b
cite: desenvolvimento-do-assunto(b)
title: desenvolvimento-do-assunto(b)
text: 'b) comprovante de que trabalhou em uma organização em que realizava serviço de manutenção
  aeronáutica nos modelos para os quais está sendo requerido o cadastramento como, por exemplo,
  declaração de empresa ou órgão público, contendo cargo e funções exercidas pelo MMA e os
  modelos nos quais trabalhou. No caso de a declaração ser proveniente de empresa privada,
  deverá ser assinada pelo responsável técnico/diretor de manutenção da organização ou pelo
  setor de recursos humanos ou por administrador constituído.

  A Anac poderá, visando confirmar as informações apresentadas no processo, solicitar documentação
  relativa aos registros de manutenção das aeronaves mantidas pelo MMA, bem como realizar
  vistorias nas aeronaves ou auditorias nas instalações e processos da entidade para verificar
  as condições de aeronavegabilidade das aeronaves e aderência às boas práticas de manutenção
  conforme legislação vigente. Poderá ainda, verificar a proficiência do mecânico com relação
  às atividades de manutenção a serem efetuadas nas aeronaves da entidade.

  Uma vez que o mecânico e a entidade demonstrem documentalmente que possuem capacidade de
  executar os serviços de forma a atender ao previsto nos regulamentos, a Anac cadastrará
  o mecânico e o autorizará a aprovar o retorno ao serviço das aeronaves submetidas a inspeções
  previstas pelo parágrafo 43.7(b)-I(1) do RBAC nº 43.

  Essa autorização só é válida para as aeronaves operadas pela entidade para a qual foi realizado
  o cadastro, devendo ser especificadas apenas aquelas correspondentes à qualificação do MMA,
  conforme item 5.6 desta IS. No momento do cadastramento, uma lista com as aeronave para
  as quais o mecânico será cadastrado deve ser enviada à Anac, contendo matrícula, fabricante,
  modelo e número de série. Caso uma aeronave do mesmo fabricante e modelo entre na frota
  dessa entidade após o cadastramento, o MMA cadastrado estará autorizado a realizar o mesmo
  nível de manutenção autorizado pelo cadastramento, desde que continuem sendo asseguradas
  as previsões do item 5.6 desta IS.

  O cadastramento é realizado e controlado por modelo de aeronave, conforme as aeronaves e
  capacidade de manutenção apresentadas no processo de solicitação (F-900-78). Para a inclusão
  de novo modelo de aeronave no cadastramento, um novo processo deve ser aberto no SEI com
  o envio de toda a documentação prevista no formulário F-900-78.

  Caso o MMA pretenda atuar em mais do que uma entidade/empresa, esse deve avaliar a compatibilidade
  de tempo e área geográfica de atuação. Caso solicitado, o profissional deve enviar à Anac
  a proposta de como pretende conciliar as cargas horárias nas respectivas entidades/empresas
  em que atuará, incluindo os traslados quando elas não forem localizadas na mesma cidade.

  Nota: nessa limitação, serão considerados na contagem os cadastramentos conforme o parágrafo
  43.7(b)-I(1) do RBAC nº 43 e vínculos com empresas que operam segundo o RBAC nº 91 conforme
  o parágrafo 43.7(b)-I(3) do RBAC nº 43, Organizações de Manutenção Aeronáutica certificadas
  pelo RBAC nº 145 e Operadores Aéreos certificados pelo RBAC nº 119 (operação segundo o RBAC
  nº 135 ou 121) que o MMA porventura possua, considerando que haja compatibilidade de tempo
  e área de atuação. O MMA também deve considerar a carga de trabalho associada ao atendimento
  das aeronaves no escopo dos parágrafos 43.7(b)-I(2), (4) e (5) e 43.7(b)-II do RBAC nº 43.
  Destaca-se que, além do operador das aeronaves afetadas, os profissionais e entidades ou
  empresas também são responsáveis por garantir o cumprimento deste item e por fornecer informações
  atualizadas à Anac sempre que necessário. Essa informação deverá ser apresentada pelo mecânico
  quando do processo de cadastramento e atualizada sempre que necessário.

  Caso o mecânico deixe de prestar os serviços para a entidade, deverá ser solicitado à Anac
  o descadastramento no prazo máximo de 30 dias corridos. O documento solicitando o descadastramento
  deve ser enviado à Anac, via peticionamento eletrônico, pelo mecânico cadastrado ou pela
  entidade, devendo, neste último caso, ser assinado pelo representante legal desta.

  Mecânicos atuando em inspeções de até 50 horas (parágrafo 43.7(b)-I(2) do RBAC nº 43) e
  manutenção preventiva (parágrafo 43.7(b)-II do RBAC nº 43) em aeronave não vinculada a empresa
  que opere segundo o RBAC nº 121 ou 135.

  Nesses casos, o mecânico não precisa ser vinculado ao operador, mas deve observar todas
  as necessidades relacionadas à atuação. Além disso, as aeronaves não podem ser vinculadas
  a empresa que opere segundo o RBAC nº 121 ou 135. Vide itens 3.8 e 3.12 e apêndice C desta
  IS para maior entendimento dos requisitos associados.

  Com relação ao parágrafo 43.7(b)-I(2), o mecânico está limitado a atuar na aprovação de
  retorno ao serviço de aeronaves submetidas a inspeções de até 50 horas previstas no programa
  de manutenção do fabricante, ou em um programa aprovado de inspeções progressivas, e ações
  corretivas com o mesmo nível de complexidade, conforme parágrafo 43.7(b)-I(2) do RBAC nº
  43.

  Com relação ao parágrafo 43.7(b)-II, o o mecânico está limitado a atuar na aprovação de
  retorno ao serviço de aeronaves submetidas a manutenção preventiva, conforme o parágrafo
  A43.1(c) do Apêndice A do RBAC nº 43.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre manter uma carga horária compatível com outras atividades, como indicado
  nos itens 5.12.10 e 5.14.3 desta IS de maneira a não impossibilitar o exercício satisfatório
  da atividade.

  Mecânicos vinculados a empresas que operam segundo o RBAC nº 91, conforme o parágrafo 43.7(b)-I(3)
  do RBAC nº 43

  No caso de empresas que operam segundo o RBAC nº 91, o mecânico está limitado a atuar na
  aprovação de retorno ao serviço de aeronaves submetidas a inspeções de até 100 horas previstas
  no programa de manutenção do fabricante, ou num programa aprovado de inspeções progressivas,
  e ações corretivas com o mesmo nível de complexidade, conforme parágrafo 43.7(b)-I(3) do
  RBAC nº 43. Vide item 3.9 e apêndice C desta IS para maior entendimento dos requisitos associados.

  O mecânico vinculado deve atender ao previsto no item 5.6 desta IS.

  Caso o mecânico pretenda atuar em mais do que uma entidade/empresa, esse deve avaliar a
  compatibilidade de tempo por área geográfica de atuação. Caso solicitado, o profissional
  deve enviar à Anac a proposta de como pretende conciliar as cargas horárias nas respectivas
  entidades/empresas em que atuará, incluindo os traslados quando elas não forem localizadas
  na mesma cidade.

  Nota: observar a Nota do item 5.12.10 para realizar essa avaliação.

  Mecânicos atuando em aeronaves leves esportivas (parágrafo 43.7(b)-I(4) do RBAC nº 43).

  Neste caso do parágrafo 43.7(b)-I(4) do RBAC nº 43, de aprovação do retorno ao serviço de
  aeronaves leves esportivas, o mecânico não precisa ser vinculado ao operador, mas deve observar
  todas as necessidades relacionadas à atuação. Vide item 3.10 e Apêndice C desta IS para
  maior entendimento dos requisitos associados.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre observar a questão da carga horária compatível com outras atividades,
  como indicado nos itens 5.12.10 e 5.14.3 desta IS, de maneira a não impossibilitar o exercício
  satisfatório da atividade.

  Mecânicos atuando em planadores e motoplanadores (parágrafo 43.7(b)-I(5) do RBAC nº 43).

  Nesses casos parágrafo 43.7(b)-I(5) do RBAC nº 43, o mecânico não precisa ser vinculado
  ao operador, mas deve observar todas as necessidades relacionadas à atuação. O detalhe deste
  caso está relacionado à licença de mecânico de manutenção aeronáutica habilitado pela Anac
  conforme previsto no RBAC nº 65 em célula e grupo motopropulsor para motoplanadores, sendo
  dispensável a habilitação em grupo motopropulsor para planadores. Vide item 3.11 e Apêndice
  C desta IS para maior entendimento dos requisitos associados.

  O mecânico deve atender ao previsto no item 5.6 desta IS.

  O mecânico deve sempre observar a questão da carga horária compatível com outras atividades,
  como indicado nos itens 5.12.10 e 5.14.3 desta IS, de maneira a não impossibilitar o exercício
  satisfatório da atividade.

  Regras GERAIS de Execução DE Manutenção

  O titular de uma licença de MMA somente pode executar ou supervisionar a manutenção e manutenção
  preventiva em um produto aeronáutico para o qual possui habilitação (vide Apêndice C desta
  IS) e os cursos e treinamentos complementares, no produto e/ou serviço de manutenção a ser
  executado, além de ter realizado o serviço anteriormente de forma satisfatória. Observar
  os critérios estabelecidos no item 5.6 desta IS e as habilitações necessárias para cada
  caso.

  O titular de uma licença de MMA somente pode exercer as prerrogativas de sua licença se
  entender e compreender as instruções de aeronavegabilidade continuada, incluindo os manuais
  de manutenção e as diretrizes de aeronavegabilidade aplicáveis, e, no caso de aeronave leve
  esportiva (ALE) com certificado de aeronavegabilidade especial emitido com base na seção
  21.190 do RBAC nº 21, com as diretrizes de segurança aplicáveis, dedicadas ao serviço específico
  relacionado.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo deve
  usar métodos, técnicas e práticas estabelecidas na última revisão do manual de manutenção
  do fabricante, ou nas instruções para aeronavegabilidade continuada preparadas pelo fabricante
  ou outros métodos, técnicas e práticas aceitáveis pela Anac. A pessoa executando manutenção
  deve ter acesso aos documentos técnicos e estar autorizada a utilizá-los.

  A pessoa deve usar as ferramentas, equipamentos e aparelhos de testes necessários para assegurar
  a execução do trabalho de acordo com as práticas industriais de aceitação geral. As ferramentas
  de medição utilizadas devem ser mantidas devidamente calibradas e controladas, conforme
  ou de forma equivalente ao previsto no parágrafo 145.109(b)-I do RBAC nº 145.

  Se o fabricante da aeronave ou componente envolvido recomendar equipamentos e aparelhos
  de teste especiais, a pessoa deve usar tais equipamentos e aparelhos, ou equivalentes aceitos
  pela Anac, conforme previsto na IS nº 43.13-005.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo aeronáutico
  deve executar esse serviço de tal maneira e usar os materiais indicados pelos fabricantes
  ou autorizados por publicação técnica aplicável.

  Cada pessoa que estiver executando manutenção ou manutenção preventiva em um artigo aeronáutico,
  deve executar esse serviço de tal maneira e usar, desde que dentro do escopo do serviço
  realizado, peças e partes aeronáuticas cuja rastreabilidade esteja de acordo com os requisitos
  regulamentares e instruções aplicáveis a cada caso, como, por exemplo, a IS nº 43.9-002.

  Durante a execução do serviço de manutenção, o mecânico deverá ter à sua disposição, e apresentar
  sempre que requerido pela Anac, registros e/ou evidências que comprovem o cumprimento do
  parágrafo 43.13(a) do RBAC nº 43, ou seja, que o mecânico está usando métodos, técnicas,
  práticas, ferramentas, equipamentos e aparelhos de teste estabelecidos na última revisão
  do manual de manutenção.

  Os registros de manutenção e manutenção preventiva deverão ser realizados conforme o previsto
  na seção 43.9 do RBAC nº 43, e os registros de inspeções deverão ser realizados conforme
  o previsto na seção 43.11 do RBAC nº 43.

  De acordo com a seção 43.12 do RBAC nº 43, ninguém pode fazer ou induzir que seja feita
  qualquer anotação, alteração ou reprodução fraudulenta ou intencionalmente falsa em qualquer
  registro cuja produção, conservação ou uso seja requerido para demonstrar conformidade com
  esse RBAC. Uma pessoa que cometa esse tipo de infração poderá ter sua licença ou certificado
  suspenso ou cassado pela Anac, conforme disposto em Resolução específica, sem prejuízo de
  outras sanções administrativas.

  Cada MMA deve ter um controle dos serviços e registros realizados, sendo recomendado que
  conserve cópia dos registros de qualquer manutenção para a qual tenha emitido uma autorização
  para retorno ao serviço que demonstrem cumprimento dos requisitos do RBAC nº 43 por pelo
  menos 5 (cinco) anos, contados a partir da data em que a aeronave foi aprovada para retorno
  ao serviço. Não obstante, os operadores devem conservar todos os registros conforme os prazos
  regulamentares.

  A seção 91.417 do RBAC nº 91 estabelece os tipos de registros de manutenção que devem ser
  conservados com o operador e transferidos com a aeronave no ato da venda, e aqueles que
  devem ser conservados até que o trabalho seja repetido.

  Sem a intenção de substituir o previsto nos requisitos regulamentares e nos manuais de manutenção
  no que se refere a listas de verificação e necessidades de verificações relacionadas a tarefas
  e inspeções, a lista de verificação indicada no link a seguir resume os cuidados mínimos
  a serem observados pelo MMA antes e depois de executar uma tarefa de manutenção, sem os
  quais uma atividade de manutenção não poderá ser considerada como adequadamente executada.
  Além de cumprir o previsto nos regulamentos e manuais da aeronave, verifique se a reposta
  foi "Sim" para todos os itens da lista de verificação do link Checklist de Bolso para Manutenção
  de Aeronaves.

  ACOMPANHAMENTO E fiscalização

  A Anac poderá, a qualquer momento, solicitar documentação relativa aos registros de manutenção
  das aeronaves mantidas por mecânicos, bem como realizar vistorias nas aeronaves ou auditorias
  nas instalações e processos da entidade para verificar as condições de aeronavegabilidade
  das aeronaves e aderência às boas práticas de manutenção conforme legislação vigente. Poderá
  ainda, verificar a proficiência do mecânico com relação às atividades de manutenção efetuadas
  nas aeronaves da entidade.

  Cada CIAC, EAP Federal, Estadual, Municipal ou do Distrito Federal ou Empresa que opere
  segundo o RBAC nº 91, assim como qualquer outro operador de aeronave registrada no Brasil,
  deve permitir inspeções da Anac a qualquer tempo para que seja verificado o cumprimento
  com os RBAC e demais normativos correlatos.

  De acordo com o parágrafo 21.181(b) do RBAC nº 21, cada proprietário ou operador de uma
  aeronave com certificado de aeronavegabilidade deve colocá-la, sempre que requerido, à disposição
  da Anac, para a condução de inspeções e vistorias.

  As ocorrências definidas pela Resolução nº 714 da Anac devem ser relatadas à Anac na forma,
  prazos e pelo(s) responsável(is) por realizar a(s) notificação(ões) conforme definido por
  aquele documento. A(s) notificação(ões) deve(m) ser realizada(s) pelo Portal Único de Notificação
  da Anac. O não cumprimento de notificações obrigatórias pode resultar em ações administrativas
  aplicáveis.

  Durante as auditorias, vistorias, inspeções de rampa ou fiscalizações remotas, caso seja
  identificado pela Anac descumprimento de normas, falha de manutenção, imperícia ou falta
  de idoneidade por parte dos profissionais envolvidos, ações poderão ser adotadas, incluindo
  a revogação de autorizações e cadastros, sem prejuízo de outras ações administrativas que
  se mostrem necessárias.'
