text: 'e) capacidade de ler e entender o(s) idioma(s) em que são apresentados os dados técnicos
  e as instruções para aeronavegabilidade continuada necessárias para a realização dos serviços
  a serem realizados.

  Quanto à demonstração de experiência, esta pode ocorrer por meio da apresentação de documentos
  que comprovem que o MMA já realizou satisfatoriamente o mesmo serviço em uma ocasião anterior,
  como por exemplo, registros de manutenção preventiva, de inspeções de 50h, 100h ou de tarefas
  equivalentes definidas no Apêndice D do RBAC nº 43. Outros exemplos são documentos que comprovem
  que o MMA trabalhou em uma organização na qual realizava serviço de manutenção aeronáutica
  nos modelos de aeronaves nos quais pretende trabalhar. Por exemplo, declaração de empresa
  ou órgão público, contendo cargo e funções exercidas pelo MMA e os modelos nos quais trabalhou.
  No caso de a declaração ser proveniente de empresa privada, deverá ser assinada pelo responsável
  técnico/diretor de manutenção da organização ou pelo setor de recursos humanos ou por administrador
  constituído. A critério da Anac poderá ser verificada a proficiência do MMA na realização
  dos serviços propostos.

  Outro ponto de atenção se refere à menção que a seção 43.7 do RBAC nº 43 faz a "ações corretivas
  com o mesmo nível de complexidade". Cabe ao operador da aeronave e ao mecânico garantirem
  a equivalência da complexidade das ações corretivas decorrentes dessas inspeções até o respectivo
  limite no manual da aeronave (50h, 100h, etc., conforme aplicável) ou Apêndice D ou parágrafo
  A43.1(c) do Apêndice A, ambos do RBAC nº 43, conforme aplicável, antes de executá-la e aprovar
  o retorno ao serviço da aeronave. Essa equivalência deverá ser comprovada sempre que solicitada
  pela Anac.

  Nota 1: ao executar uma inspeção ou manutenção, o MMA pode vir a se deparar com a necessidade
  de realização de verificações ou manutenções adicionais como, por exemplo, a realização
  de ensaios não destrutivos para a identificação adequada de problemas ou a realização de
  reparos de níveis mais complexos. Nesses casos, devem ser observados os limites autorizados
  e a necessidade de encaminhamento para entidades certificadas para a realização de serviços
  acima do escopo de atuação autorizado ao MMA e que realizar esse encaminhamento também pode
  vir a ser requerido previamente à aprovação de retorno ao serviço.

  Nota 2: para a verificação do nível de complexidade equivalente, devem ser considerados,
  no mínimo, os seguintes critérios:'
