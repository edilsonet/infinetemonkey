text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  O meio ou procedimento alternativo mencionado na alínea 3.2(b) desta IS deve garantir nível
  de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o
  objetivo do procedimento normalizado em IS.

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.

  Esta IS apresenta meios aceitáveis de cumprimento para os parágrafos 43.3(b), 43.7(b)-I
  e (b)-II e para a seção 43.13 do RBAC nº 43.

  O parágrafo 43.7(b)-I do RBAC nº 43 estabelece para quais aeronaves e em que condições um
  detentor de uma licença de MMA habilitado em célula e grupo motopropulsor pode aprovar o
  retorno ao serviço.

  O parágrafo 43.7(b)-I(1) do RBAC nº 43 estabelece que, desde que esteja devidamente cadastrado
  junto à Agência Nacional de Aviação Civil - Anac, um mecânico habilitado pela Anac em célula
  e grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves empregadas por aeroclubes
  ou entidades assemelhadas em instrução para formação de pilotos que não disponham de organização
  de manutenção certificada conforme o RBAC nº 145; ou de aeronaves a serviço de EAP Federal,
  Estadual, Municipal ou do Distrito Federal; que tenham sido submetidas a inspeções de até
  100 horas previstas no programa de manutenção do fabricante ou em conformidade com o Apêndice
  D do RBAC nº 43 e ações corretivas com o mesmo nível de complexidade.

  Nota 1: O Regulamento Brasileiro de Homologação Aeronáutica - RBHA 140, o qual se referia
  a “Autorização, Organização e Funcionamento de Aeroclubes” e o RBHA 141, o qual se referia
  a "Escolas de Aviação Civil" foram substituídos pelo RBAC nº 141, intitulado “Certificação
  e requisitos operacionais: Centros de Instrução de Aviação Civil”, de acordo com o art.
  1° da Resolução nº 514, de 25.04.2019. Nesse sentido, os RBHA 140 e RBHA 141 possuem aplicação
  restrita às instituições enquadradas no prazo de transição estabelecido pelo art. 5º da
  Resolução citada. Para efeitos desta IS, está sendo utilizado o termo Centro de Instrução
  de Aviação Civil - CIAC em sentido amplo, para abordar os procedimentos de cadastramento,
  os quais são os mesmos tanto para CIAC quanto para os aeroclubes e escolas de aviação civil
  ainda em transição.

  Nota 2: esclarece-se que a aplicabilidade do parágrafo 43.7(b)-I(1) do RBAC nº 43 a aeronaves
  a serviço de EAP é em sentido amplo, seja esta uma Unidade Aérea Pública - UAP, conforme
  RBAC nº 90, ou outras EAP, conforme RBAC nº 91.

  O parágrafo 43.7(b)-I(2) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves submetidas a inspeções
  de até 50 horas previstas no programa de manutenção do fabricante ou num programa aprovado
  de inspeções progressivas e ações corretivas com o mesmo nível de complexidade, desde que
  essas aeronaves não estejam vinculadas a uma empresa que opere segundo o RBAC nº 121 ou
  135.

  O parágrafo 43.7(b)-I(3) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves submetidas a inspeções
  de até 100 horas previstas no programa de manutenção do fabricante ou num programa aprovado
  de inspeções progressivas e ações corretivas com o mesmo nível de complexidade, quando esse
  mecânico estiver vinculado a uma empresa que opere segundo o RBAC nº 91.

  O parágrafo 43.7(b)-I(4) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de aeronaves leves esportivas.

  O parágrafo 43.7(b)-I(5) do RBAC nº 43 estabelece que um mecânico habilitado em célula e
  grupo motopropulsor pode aprovar o retorno ao serviço de planadores e motoplanadores, sendo
  dispensada a habilitação em grupo motopropulsor para aprovar o retorno ao serviço de planadores.

  O parágrafo 43.7(b)-II do RBAC nº 43 estabelece que um mecânico habilitado pela Anac pode
  aprovar o retorno ao serviço de uma aeronave após execução de manutenção preventiva, desde
  que essa aeronave não esteja vinculada a uma empresa que opere segundo o RBAC nº 121 ou
  135.

  O Apêndice C desta IS apresenta uma tabela comparativa entre os parágrafos do RBAC nº 43
  acima citados.'
