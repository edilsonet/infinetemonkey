cite: objetivo(b)
title: objetivo(b)
text: b) aeronaves que não estejam vinculadas a empresas que operem segundo os RBAC nº 121
  ou 135, submetidas a inspeções de até 50 horas previstas no programa de manutenção do fabricante
  ou num programa aprovado de inspeções progressivas e ações corretivas com o mesmo nível
  de complexidade [§43.7(b)-I(2) do RBAC nº 43] ou a manutenção preventiva [§43.7(b)-II do
  RBAC nº 43];
