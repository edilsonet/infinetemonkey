title: O requerente que pretenda, para qualquer finalidade, demonstrar o cumprimento de requisito
text: '3.10.1 O requerente que pretenda, para qualquer finalidade, demonstrar o cumprimento
  de requisito

  previsto em RBAC poderá adotar os meios e procedimentos previamente especificados em

  IS ou apresentar meio alternativo devidamente justificado, exigindo-se, nesse caso, a análise

  e concordância expressa da ANAC.'
