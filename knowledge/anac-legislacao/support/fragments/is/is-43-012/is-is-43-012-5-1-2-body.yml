text: '5.1.2 De acordo com os novos critérios, a manutenção preventiva que pode ser realizada
  por

  pilotos se divide em quatro grupos, conforme Quadro 1 abaixo:Data de emissão: 5 de abril
  de 2019 IS Nº 43-012

  Revisão B

  Quadro 1 - Grupos e Critérios de manutenção preventiva que pode ser realizada por pilotos

  Grupo Critérios

  Pilotos proprietários e

  assemelhados

  Propriedade da aeronave:

  Piloto que irá realizar a manutenção preventiva deve ser:

  • Proprietário e operador da aeronave; ou

  • Operador registrado da aeronave; ou

  • Membro de pessoa jurídica com propósito de recreação e

  sem fins lucrativos que opera a aeronave.

  Aeronaves:

  • Planadores;

  • Motoplanadores;

  • Balões; e

  Aeronaves motorizadas com PMD menor ou igual a 2.730

  kg, desde que não sejam equipadas com motor à reação.

  Piloto:

  • Titular de licença de piloto ou Certificado de Piloto

  Aerodesportivo (CPA), exceto licença de piloto aluno;

  • Idade mínima de 18 anos;

  • Habilitação válida aplicável ao modelo da aeronave; e

  • Licença ou certificado não esteja suspenso, cassado,

  cancelado e não tenha sido renunciado.

  Operação da aeronave:

  • Aeronave não vinculada a empresa que opere segundo o

  • Aeronave não utilizada em operações comerciais de

  serviços aéreos especializados, nem operações

  comerciais de instrução em voo.

