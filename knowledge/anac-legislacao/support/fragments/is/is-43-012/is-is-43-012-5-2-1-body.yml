title: A execução de qualquer atividade de manutenção preventiva, do ponto de vista técnico,
text: '5.2.1 A execução de qualquer atividade de manutenção preventiva, do ponto de vista
  técnico,

  requer “instalações”, “recursos”, “ferramentas”, “materiais”, “dados técnicos” e “pessoal”

  adequados para a sua realização. A autorização para que a manutenção preventiva seja

  realizada por pilotos alterou somente o que é considerado pela ANAC como “pessoal

  adequado” e somente para a realização de manutenção preventiva condicionada às restrições

  do RBAC nº 43.'
