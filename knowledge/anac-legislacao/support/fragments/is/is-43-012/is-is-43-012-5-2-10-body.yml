title: Em relação ao parágrafo A43.1(c)(30)-II do Apêndice A do RBAC nº 43, referente a
text: '5.2.10 Em relação ao parágrafo A43.1(c)(30)-II do Apêndice A do RBAC nº 43, referente
  a

  aeronaves categoria leve esportivas, nas emendas 00 a 02 do RBAC nº 43, havia prerrogativa

  para execução de manutenção preventiva por pilotos e de sua aprovação para retorno ao

  serviço após tal manutenção preventiva nos parágrafos 43.3(g)-I e 43.7(h). Com a revisão

  dos critérios de manutenção preventiva por pilotos introduzida na emenda 03 do RBAC nº

  43, tal prerrogativa migrou para o grupo “Pilotos proprietários e assemelhados” do Quadro

  1, sendo considerada como manutenção preventiva em aeronave leve esportiva qualquer

  tarefa que o fabricante determine em seu manual de manutenção como passível de execuçãoData
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  por piloto.'
