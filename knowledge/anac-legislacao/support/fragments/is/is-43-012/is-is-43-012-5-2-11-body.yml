text: '5.2.11 O parágrafo A43.1(c)(32)-I do Apêndice A do RBAC nº 43 estabelece que é considerada

  manutenção preventiva o cumprimento de ações requeridas por diretrizes de

  aeronavegabilidade ou por itens da seção de limitações de aeronavegabilidade, somente se

  tais documentos explicitarem que as ações podem ser cumpridas pelo piloto.'
