text: '5.2.12 Diretrizes de aeronavegabilidade são prescrições que se aplicam a aeronaves,
  motores de

  aeronaves, hélices e equipamentos, e são regidas pelo RBAC nº 39. Caso um piloto pretenda

  cumprir tais ações, seja dentro do grupo “Pilotos proprietários e assemelhados”, ou do grupo

  “Diretrizes de Aeronavegabilidade e Tarefas de Manutenção Previstas para Pilotos” do

  Quadro 1 desta IS, é fundamental que se familiarize com os conceitos envolvidos neste tema,

  estudando o RBAC nº 39 e a IS nº 39-001B ou revisão posterior.'
