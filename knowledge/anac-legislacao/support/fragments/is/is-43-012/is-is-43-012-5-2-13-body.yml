title: É importante ressaltar que a operação de aeronave em descumprimento a prescrições
text: '5.2.13 É importante ressaltar que a operação de aeronave em descumprimento a prescrições

  estabelecidas em diretrizes de aeronavegabilidade, além da exposição dos ocupantes e

  pessoas no solo aos riscos de segurança operacional associados, sujeita o operador, e

  eventualmente o próprio piloto, a multa calculada por operação da aeronave, podendo

  facilmente atingir valores que superam o valor da própria aeronave. Cada operação nessa

  situação é considerada uma infração prevista no Art. 302, inciso II, alínea (n), ou, a depender

  da operação, no inciso III, alínea (e) do mesmo artigo, da Lei 7.565/1986 (Código Brasileiro

  de Aeronáutica) cujo valor é calculado a partir das tabelas do Anexo I à Resolução ANAC

  n° 472/2018 e suas alterações.'
