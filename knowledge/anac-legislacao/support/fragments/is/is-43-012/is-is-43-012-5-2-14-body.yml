text: '5.2.14 A pesquisa de todas as diretrizes de aeronavegabilidade aplicáveis a uma aeronave
  é uma

  tarefa que pode ser bastante complexa, com risco de diretrizes serem desconsideradas. Caso

  o piloto ou operador da aeronave não conheça suficientemente bem a regulamentação de

  diretrizes de aeronavegabilidade, ou não se considere competente para fazer tal avaliação,

  deve procurar ajuda especializada.'
