  e
text: '5.2.16 As instruções para aeronavegabilidade continuada (tipicamente o manual de manutenção
  e

  outros documentos de serviço) devem ser elaboradas pelo detentor do projeto de tipo de

  forma aceitável à ANAC ou autoridade de aviação civil do país de projeto. Contudo, uma

  parte específica das instruções de aeronavegabilidade continuada, chamada de seção de

  limitações de aeronavegabilidade, é especificamente aprovada pela autoridade de aviação

  civil e compõe o projeto de tipo da aeronave, motor ou hélice. O cumprimento de tais tarefas

  é obrigatório segundo o parágrafo 91.403(c) do RBHA nº 91, ou requisito correspondente

  que venha a substituí-lo em RBAC, com exceção de alternativas previamente aprovadas pela

  ANAC nas especificações operativas de operadores regidos pelo RBAC nº 135, ou de

  programa de inspeções aprovado pela ANAC.'
