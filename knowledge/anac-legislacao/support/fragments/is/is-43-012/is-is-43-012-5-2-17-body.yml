text: '5.2.17 O descumprimento das limitações de aeronavegabilidade expõe os ocupantes e pessoas
  no

  solo a riscos de segurança operacional semelhantes ao de descumprimento de diretrizes de

  aeronavegabilidade, e sujeita o operador, e eventualmente o piloto, às mesmas penalidades

  descritas no item 5.2.13 desta IS.Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B'
