title: O parágrafo A43.1(c)(32)-II do Apêndice A do RBAC nº 43 estabelece que são consideradas
text: '5.2.18 O parágrafo A43.1(c)(32)-II do Apêndice A do RBAC nº 43 estabelece que são consideradas

  manutenção preventiva “tarefas para as quais o detentor do projeto de tipo ou projeto

  suplementar de tipo tenha determinado no programa de manutenção recomendado

  correspondente que podem ser realizadas por pilotos, desde que a ANAC considere serem

  de complexidade semelhante às demais tarefas de manutenção preventiva”. Diferentemente

  do parágrafo A43.1(c)(32)-I, neste caso a determinação de que a tarefa seja considerada

  manutenção preventiva depende de avaliação prévia da ANAC quanto à complexidade

  semelhante às demais tarefas listadas no parágrafo A43.1(c) do Apêndice A do RBAC nº 43.'
