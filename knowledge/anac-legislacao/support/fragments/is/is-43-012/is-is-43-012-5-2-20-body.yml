title: O parágrafo A43.1(c)(32)-III do Apêndice A do RBAC nº 43 estabelece que são
text: '5.2.20 O parágrafo A43.1(c)(32)-III do Apêndice A do RBAC nº 43 estabelece que são

  consideradas manutenção preventiva, “para planadores e motoplanadores, outras tarefas que

  a ANAC considere serem de complexidade semelhante às demais tarefas de manutenção

  preventiva.” A ANAC considera como de complexidade semelhante às demais tarefas de

  manutenção preventiva, no caso de planadores e motoplanadores, aquelas tarefas listadas
  no

  “AMC to Appendix VIII - Limited Pilot Owner Maintenance”, item 3, Parte C (“Pilot-Owner

  Maintenance Tasks for Sailplanes and Powered Sailplanes”) emitido pela EASA através da

  EASA Decision 2015/029/R, exceto se a tarefa ali descrita se configurar com alteração da

  aeronave, motor ou hélice.'
