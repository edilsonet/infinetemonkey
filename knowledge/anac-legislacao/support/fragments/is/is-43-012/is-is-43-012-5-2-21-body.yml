text: '5.2.21 Adicionalmente, outras tarefas aplicáveis a planadores e motoplanadores podem
  vir a serem

  consideradas como manutenção preventiva mediante avaliação da ANAC quanto à sua

  complexidade. A solicitação deve conter a tarefa a ser avaliada e as justificativas para
  que

  sua complexidade seja considerada semelhante à das outras tarefas de manutenção

  preventiva.'
