title: Outros aspectos relacionados à execução da manutenção preventiva
text: '5.2.23 Outros aspectos relacionados à execução da manutenção preventiva

  O parágrafo 43.13(a) do RBAC nº 43 estabelece que todo aquele que executa tarefas de

  manutenção preventiva deve utilizar métodos, técnicas e práticas aceitas pela ANAC. Esses

  métodos, técnicas e práticas podem ser encontradas nos documentos de serviço

  (frequentemente nos manuais de manutenção) fornecidos pelos fabricantes das aeronaves, e

  também podem ser encontrados nas Instruções Suplementares - IS da ANAC, ou mesmo

  nos materiais interpretativos das diversas autoridades de aviação civil (e.g. Advisory

  Circular - AC da FAA).

  O parágrafo 43.13(a) do RBAC nº 43 também requer a utilização de ferramentas,

  equipamentos e aparelhos de teste necessários para assegurar que o trabalho foi completado

  de acordo com as práticas industriais de aceitação geral. Também significa que o piloto
  que

  executa uma certa tarefa de manutenção preventiva deve utilizar as ferramentas,

  equipamentos e aparelhos de teste e ferramentas especiais apropriadamente calibradas,Data
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  quando aplicável.

  O parágrafo 43.13(a) do RBAC nº 43 requer a utilização de toda ferramenta especial

  recomendada pelo fabricante, ou aquela equivalente (quando aceita pela ANAC).

  Ferramentas especiais são mais comuns em tarefas de manutenção do que em tarefas de

  manutenção preventiva, mas os pilotos sujeitos às orientações desta IS devem estar cientes

  dessas limitações.

  O parágrafo 43.13(b) do RBAC nº 43 requer que a tarefa de manutenção preventiva seja

  desempenhada de tal forma que a qualidade final do artigo (peça, componente, etc.) da

  aeronave seja, no mínimo, equivalente ou igual às condições de originalidade de projeto,

  incluído os aperfeiçoamentos introduzidos pelos fabricantes.

  O piloto que pretenda executar tarefas de manutenção preventiva conforme os requisitos e

  de acordo com os esclarecimentos desta IS deve se assegurar do correto entendimento das

  instruções de manutenção preventiva do fabricante da aeronave em questão, e que as ações

  dessa manutenção preventiva estão dentro de sua capacidade de compreensão e execução.

  NOTA: Certas operações como a energização/desenergização da aeronave e procedimentos

  de risco envolvendo líquidos ou gases pressurizados exigem cuidados adicionais, que podem

  incluir a utilização de equipamento de proteção individual.'
