title: Registros de manutenção
text: '5.2.24 Registros de manutenção

  Os registros de manutenção são etapas mandatórias de qualquer atividade de manutenção,

  manutenção preventiva, reconstrução ou alteração, independentemente de quem a realize.

  Para os propósitos desta IS, o termo “registros de manutenção” se refere também à

  manutenção preventiva realizada por piloto.

  Os registros de manutenção possuem conteúdo mínimo definido nas seções 43.9 e 43.11 do

  manutenção são completos e corretos. A aplicabilidade de cada seção é determinada da

  seguinte forma:'
