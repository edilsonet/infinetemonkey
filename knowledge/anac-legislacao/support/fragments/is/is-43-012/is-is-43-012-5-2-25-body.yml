title: 'Aprovação para retorno ao serviçoData de emissão: 5 de abril de 2019 IS Nº 43-012'
text: '5.2.25 Aprovação para retorno ao serviçoData de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  A aprovação para retorno ao serviço é etapa que sucede a execução do serviço e atesta que

  o serviço foi efetivamente realizado de forma adequada. Tal aprovação é vinculada à emissão

  dos registros de manutenção, ou seja, a aeronave, motor, hélice ou componente que sofreram

  manutenção preventiva não foram aprovados para retorno ao serviço até que os registros de

  manutenção tenham sido efetivamente emitidos e assinados.

  A aprovação para retorno ao serviço é mandatória antes do voo subsequente, conforme

  requerido pelo parágrafo 91.407(a)(2) do RBHA nº 91. A operação de aeronave que sofreu

  manutenção preventiva sem a devida aprovação para retorno ao serviço sujeita o operador

  da aeronave e o piloto a multa com base no Art. 302, inciso II, alínea (n), ou, a depender
  da

  operação, no inciso III, alínea (e) do mesmo artigo, da Lei 7.565/1986 (Código Brasileiro
  de

  Aeronáutica).

  No caso de registros realizados segundo a seção 43.9 do RBAC nº 43, a referência da pessoa

  aprovando a aeronave para retorno ao serviço e sua assinatura atestam essa aprovação. No

  caso de registros realizados segundo a seção 43.11, o registro também é acompanhado de

  uma declaração explicitando, formalmente, que o serviço realizado adequadamente e que a

  aeronave está aeronavegável quanto ao serviço executado.

  As pessoas autorizadas a aprovar a aeronave, motor, hélice ou componente para retorno ao

  serviço após manutenção preventiva são aquelas listadas na seção 43.7 do RBAC nº 43. No

  caso de manutenção preventiva executada sob o parágrafo 43.3(g)-I (grupos “Pilotos

  proprietários e assemelhados” e “Diretrizes de Aeronavegabilidade e Tarefas de Manutenção

  Previstas para Pilotos”), a aprovação para retorno ao serviço é realizada pelo próprio piloto

  que executou a manutenção preventiva, conforme parágrafo 43.7(f)-I.

  Ressalta-se que a prerrogativa de aprovação para retorno ao serviço do parágrafo 43.7(f)-I

  do RBAC nº 43 é limitada à manutenção preventiva executada pelo piloto que aprova a

  aeronave para retorno ao serviço, ou seja, não é permitido que um piloto aprove uma

  aeronave para retorno ao serviço se a manutenção preventiva tiver sido executada por outra

  pessoa, seja piloto ou não.

  Já no caso de manutenção preventiva executada sob os parágrafos 43.3(h) e (i) por piloto
  em

  aeronave operada segundo o RBAC nº 135, a aprovação para retorno ao serviço é realizada

  sob o certificado do operador, conforme parágrafo 43.7(e) do RBAC nº 43. Destaca-se que,

  mesmo sendo o piloto quem assina a execução e a aprovação para retorno ao serviço, no

  caso do operador RBAC nº 135 a manutenção preventiva é realizada sob o certificado do

  operador, de acordo com os procedimentos do Manual Geral de Manutenção (MGM) do

  operador.

  NOTA: O parágrafo 43.7(e) do RBAC nº 43 limita a aprovação para retorno ao serviço por

  empresas de transporte aéreo à manutenção de linha. Todo escopo de manutenção

  preventiva previsto para execução por piloto segundo os parágrafos 43.3(h) e (i) do RBAC

  43 é considerado de complexidade igual ou inferior à manutenção de linha.'
