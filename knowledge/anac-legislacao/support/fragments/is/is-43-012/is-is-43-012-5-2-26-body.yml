text: '5.2.26 Duração do trabalho do aeronauta e gerenciamento de risco de fadiga humana

  A Lei n° 13.475/2017 dispõe sobre o exercício da profissão de tripulante de aeronave

  (aeronauta) e determina, no Art. 41, inciso V, que a realização de outros serviços em terra,

  quando escalados pela empresa, são computados na duração do trabalho dos aeronautas.

  Dessa forma, todo operador cujos pilotos estejam regidos por essa Lei devem se assegurarData
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  de que todo tempo gasto pelo piloto realizando manutenção preventiva seja contabilizado
  na

  duração do seu trabalho.

  Ademais, encontra-se em processo de elaboração o RBAC nº 117, destinado ao

  Gerenciamento de Risco de Fadiga Humana. Uma vez publicado, os dispositivos aplicáveis

  desse regulamento devem ser considerados também na determinação da jornada de trabalho

  de pilotos que realizam manutenção preventiva.

  5.3 Critérios específicos para o grupo “Pilotos proprietários e assemelhados”'
