cite: 5.2.3(a)
title: 5.2.3(a)
text: 'a) A tarefa não pode envolver operações complexas de montagem e

  desmontagem. Uma vez que a complexidade de montagem e desmontagem

  depende do projeto específico de cada aeronave, tal avaliação deve ser realizada

  para os casos específicos. São consideradas operações complexas de montagem ou

  desmontagem aquelas que dependam de ferramentas especiais, treinamento

  específico, processos ou inspeções especiais ou intervenções destrutivas. O piloto

  deve estar seguro de que as operações de montagem e desmontagem envolvidas não

  são complexas. Caso possua dúvida acerca dessa complexidade, deve considera-la

  complexa e abster-se de realizar a atividade; e'
