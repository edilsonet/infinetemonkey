id: is-is-43-012-5-2-3-b
kind: is
document: is-43-012
family: '43'
section_id: 5.2.3
section_title: Para que uma tarefa se enquadre como “manutenção preventiva”, é obrigatório
  que as duas
subsection_id: b
cite: 5.2.3(b)
title: 5.2.3(b)
text: 'b) A tarefa esteja coberta pela listagem do parágrafo A43.1(c) do Apêndice A do

  mais simples que seja, não estiver listada no parágrafo A43.1(c) do Apêndice A do

  listagem é transcrita abaixo:

  I - remoção, instalação e reparos de pneus;

  II - substituição de amortecedores de trem de pouso constituídos por cordas

  elásticas;

  III - colocação de ar e/ou óleo em amortecedores do trem de pouso;

  IV - limpeza e colocação de graxa nos rolamentos das rodas;

  V - substituição de frenos e cupilha defeituosas;

  VI - lubrificação que requeira apenas a desmontagem de itens não estruturais

  como tampas, capotas e carenagens;

  VII - execução de remendos simples em revestimento de tela que não requeiram

  costura em nervuras ou remoção de partes estruturais ou superfícies de

  controle. No caso de balões, a execução de pequenos remendos de

  envelopes (como definido e de acordo com as instruções do fabricante)

  não requerendo reparos ou substituição dos tirantes do envelope;

  VIII - reabastecimento de fluido hidráulico no reservatório;

  IX - retoques na pintura decorativa da fuselagem, das cestas dos balões, asas,

  superfícies de cauda (excluindo superfícies de controle balanceadas),

  carenagens, capotas do motor, trem de pouso e interior da aeronave, desde

  que não seja requerida remoção ou desmontagem de nenhuma estrutura

  primária ou sistema de operação;

  X - aplicação de material preservativo ou protetor a componentes quando não

  há necessidade de desmontar nenhuma estrutura primária ou sistema de

  operação e quando o uso de tal material não é proibido e não contraria boas

  práticas;

  XI - reparos de tapeçaria e estofamentos e do acabamento interno das aeronaves

  ou cesta do balão quando o reparo não envolve desmontagem de nenhumaData de emissão: 5 de
  abril de 2019 IS Nº 43-012

  Revisão B

  estrutura primária ou sistema de operação, não interfere com tais sistemas

  e não afeta a estrutura primária da aeronave;

  XII - execução de pequenos reparos em carenagens e em tampas e capotas não

  estruturais e de pequenos reforços externos do revestimento da aeronave,

  desde que não perturbe o fluxo apropriado do ar;

  XIII - substituição de janelas laterais onde o trabalho não interfere na estrutura

  ou em qualquer sistema de operação, como controles, sistema elétrico etc.;

  XIV - substituição dos cintos de segurança;

  XV - substituição de assentos ou suas partes com peças aprovadas para a

  aeronave, não envolvendo desmontagem de qualquer estrutura primária ou

  sistema de operação;

  XVI - I - remoção e reinstalação de macas acopláveis à cabine aprovadas e,

  somente se nenhuma ferramenta for necessária, de garrafas de oxigênio

  medicinal;

  XVI - II - pesquisa de pane e reparos de fiação no circuito elétrico dos faróis de

  pouso;

  XVII - substituição de lâmpadas, refletores e lentes das luzes de navegação e

  faróis de pouso;

  XVIII - substituição de rodas e esquis quando o cálculo do peso e balanceamento

  não é requerido;

  XIX - substituição de capota do motor quando não é necessário desmontar a

  hélice ou desconectar controles da aeronave;

  XX - substituição, limpeza ou ajuste de folga das velas do motor (convencional);

  XXI - substituição de qualquer conexão de mangueira não utilizada em sistema

  hidráulico;

  XXII - substituição de linhas de combustível pré-fabricadas;

  XXIII - I - limpeza ou substituição de elementos de peneira ou filtros de

  combustível e óleo;

  XXIII - II - reabastecimento de óleo lubrificante;

  XXIV - substituição e serviços em baterias;

  XXV - limpeza do queimador piloto e queimadores principais de um balão de

  acordo com as instruções do fabricante;

  XXVI - substituição ou ajuste de fixadores não estruturais que tenham se

  desgastado ou desajustado na operação normal;Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  XXVII - troca de cestas ou queimadores entre balões do mesmo tipo, desde que as

  cestas ou queimadores constem como intercambiáveis nos dados de

  certificação de tipo do balão e tenham sido especificamente projetados

  para remoção e instalação rápida;

  XXVIII - instalação, nas bocas dos tanques de combustível, de dispositivo visando

  evitar reabastecimento com combustível errado, desde que o dispositivo

  tenha sido fabricado como peça para o tipo de aeronave, o fabricante tenha

  fornecido instruções para instalação aprovadas e que a instalação não

  envolva a desmontagem do bocal do tanque;

  XXIX - remoção, verificação e substituição de detectores de limalhas;

  XXX - I - para aeronaves categoria primária para as quais existe um programa

  especial de inspeções e manutenção preventiva aprovado como parte do

  certificado de tipo ou do certificado suplementar de tipo, tarefas definidas

  nesse programa como passíveis de execução por piloto, desde que o piloto

  possua certificado de competência para a referida aeronave emitido pelo

  detentor do certificado de produção nos termos do parágrafo 21.145(b) do

  ANAC;

  XXX - II - para aeronaves categoria leve esportiva, tarefas definidas no manual de

  manutenção do fabricante como passíveis de execução por piloto;

  XXXI - remoção e substituição de dispositivos de comunicação e navegação

  montados no painel de instrumentos dianteiro, do tipo autônomo

  (independentes), que empregam conectores de bandeja que conectam a

  unidade quando ela é instalada no painel de instrumentos (excluindo

  sistemas de controle automático de voo, transponders e equipamento de

  medida de distância (DME) por frequência de micro-ondas). A unidade

  aprovada deve ser projetada para ser pronta e repetidamente removida e

  substituída e instruções pertinentes devem ser providas. Antes do uso da

  unidade, um cheque operacional deve ser executado, de acordo com as

  seções aplicáveis do RBHA nº 91, ou RBAC que venha a substituí-lo;

  XXXII - I - cumprimento de ações requeridas por diretriz de aeronavegabilidade ou

  por item da seção limitações de aeronavegabilidade das instruções de

  aeronavegabilidade continuada aplicáveis, somente quando tais

  documentos mencionarem explicitamente que tais ações podem ser

  cumpridas por piloto;

  XXXII - II - tarefas para as quais o detentor do projeto de tipo ou projeto

  suplementar de tipo tenha determinado no programa de manutenção

  recomendado correspondente que podem ser realizadas por pilotos, desde

  que a ANAC considere serem de complexidade semelhante às demais

  tarefas de manutenção preventiva; e

  XXXIII - para planadores e motoplanadores, outras tarefas que a ANAC considere

  serem de complexidade semelhante às demais tarefas de manutenção

  preventiva.Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B'
