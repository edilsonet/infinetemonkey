text: '5.2.4 Em relação ao item XXX-I acima, correspondente ao subparágrafo A43.1(c)(30)-I
  do RBAC

  nº 43, dedicado a aeronaves categoria primária, é importante destacar que essa categoria
  se

  refere a aeronaves com projeto de tipo emitido segundo a seção 21.24 do RBAC nº 21. Tais

  aeronaves possuem processo de certificação simplificado e inclui a possibilidade de que
  o

  detentor do projeto de tipo desenvolva um programa especial de inspeções concebido para

  que o próprio piloto possa cumpri-lo, desde que adequadamente treinado. Esse programa

  especial de inspeções é opcional e, caso exista, compõe o projeto de tipo da aeronave

  categoria primária, conforme parágrafo 21.31(d) do RBAC nº 21.'
