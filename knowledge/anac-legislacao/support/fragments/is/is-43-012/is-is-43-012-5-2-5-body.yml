title: Nesse caso, o treinamento é realizado pelo detentor do certificado de organização de
text: '5.2.5 Nesse caso, o treinamento é realizado pelo detentor do certificado de organização
  de

  produção (fabricante), conforme parágrafo 21.145(b) do RBAC nº 21. O piloto que concluir

  com sucesso tal treinamento receberá do fabricante um certificado de competência específico

  para aquele tipo de aeronave e aquele fabricante. Esse certificado de competência é

  obrigatório para que o piloto possa executar e aprovar para retorno ao serviço as tarefas

  previstas para pilotos no programa especial de inspeções do detentor do projeto de tipo.'
