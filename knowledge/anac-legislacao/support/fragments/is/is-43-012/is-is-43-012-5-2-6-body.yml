title: Caso a aeronave categoria primária seja construída no exterior, é aceitável que o treinamento
text: '5.2.6 Caso a aeronave categoria primária seja construída no exterior, é aceitável que
  o treinamento

  seja ministrado pelo fabricante estrangeiro de acordo com as regras daquele país, desde
  que

  o país do fabricante seja o mesmo do detentor do projeto de tipo, ou estejam regidos pela

  mesma autoridade de aviação civil.'
