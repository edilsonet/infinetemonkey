title: Alternativamente ao treinamento ministrado pelo fabricante, uma entidade pode obter
  junto
text: '5.2.7 Alternativamente ao treinamento ministrado pelo fabricante, uma entidade pode
  obter junto

  à ANAC aprovação para ministrar o curso de treinamento no programa especial de inspeções

  e emitir certificado de competência para o piloto. Para obtenção dessa aprovação, a entidade

  deve demonstrar que o curso de treinamento atende aos mesmos critérios aplicáveis aos

  fabricantes das aeronaves categoria primária, bem como demonstrar que possui acesso aos

  dados técnicos de manutenção e às próprias aeronaves para os aspectos práticos dos

  treinamentos.'
