text: '5.2.8 Os mesmos critérios dos itens 5.2.4 a 5.2.7 também se aplicam a projetos suplementares
  de

  tipo, seja no caso de um projeto suplementar de tipo emitido especificamente para converter

  para categoria primária uma aeronave que não foi originalmente certificada como categoria

  primária, seja para uma aeronave categoria primária que venha a ser modificada e, em razão

  da modificação, um programa especial de inspeções para pilotos seja incluído ou

  modificado.'
