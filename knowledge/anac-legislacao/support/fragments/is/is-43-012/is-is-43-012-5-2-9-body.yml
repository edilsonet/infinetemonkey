title: Caso a aeronave categoria primária não possua um programa especial de inspeções para
text: '5.2.9 Caso a aeronave categoria primária não possua um programa especial de inspeções
  para

  pilotos, ou caso o piloto não possua o certificado de competência requerido no parágrafo

  A43.1(c)(30)-I do Apêndice A do RBAC nº 43, ele ainda poderá realizar manutenção

  preventiva caso se enquadre em um dos grupos do Quadro 1, atendendo todos os critérios

  do grupo, desde que a tarefa pretendida esteja coberta em um dos demais itens do parágrafo

  A43.1(c) do Apêndice A do RBAC nº 43.'
