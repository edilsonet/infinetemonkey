title: Aeronaves autorizadas para voo IFR
text: '5.3.11 Aeronaves autorizadas para voo IFR

  Para aeronaves autorizadas a realiza voos IFR, o piloto não pode realizar manutenção

  preventiva em sistemas essenciais para realização de voo IFR. São sistemas essenciais para

  voo IFR aqueles listados pelo detentor do projeto de tipo no manual de voo ou outro

  documento técnico, bem como todos sistemas relacionados com os instrumentos e

  equipamentos requeridos por regras operacionais para voo IFR, conforme parágrafo

  91.205(d) do RBHA nº 91 ou dispositivo equivalente em RBAC que venha a substituí-lo.

  Por exemplo, dentre os sistemas requeridos está um sistema de rádio-comunicação VHF.

  Dessa forma, o piloto não pode realizar a substituição de um rádio VHF defeituoso por outro,

  uma vez que este sistema é essencial para voo IFR. É importante salientar que todos

  equipamentos requeridos para voo VFR são também essenciais para voo IFR, o mesmo

  ocorrendo para equipamentos requeridos para voo VFR noturno, no caso de voo IFR

  noturno.

  5.4 Critérios específicos para o grupo “Diretrizes de Aeronavegabilidade e Tarefas de

  Manutenção Previstas para Pilotos”'
