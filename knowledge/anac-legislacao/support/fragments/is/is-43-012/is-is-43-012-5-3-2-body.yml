title: Propriedade da aeronave
text: '5.3.2 Propriedade da aeronave

  No Brasil, de acordo com o Art. 115 da Lei nº 7.565/1986 (Código Brasileiro de Aeronáutica

  - CBA), adquire-se a propriedade de uma aeronave mediante: construção (inciso I);

  usucapião (inciso II); direito hereditário (inciso III); inscrição de título de transferência
  no

  Registro Aeronáutico Brasileiro - RAB (inciso IV) e transferência legal (inciso V / Arts.
  145

  e 190). Uma vez averbada a propriedade no RAB, o nome do proprietário é inscrito no

  Certificado de Matrícula da aeronave. O proprietário, não necessariamente, é o operador
  da

  aeronave podendo ser uma pessoa distinta deste. Em ambos os casos, a propriedade pode

  estar vinculada a pessoas naturais (físicas) ou pessoas jurídicas. Assim como o proprietário,

  o operador também é inscrito no RAB e o seu nome consta do Certificado de Matrícula da

  aeronave (inclusive nos casos em que o proprietário e o operador são a mesma pessoa).

  A respeito do operador, o CBA, em seu Art. 123, define o operador (também chamado

  explorador) como: I - a pessoa jurídica que tem a concessão dos serviços de transporte

  público regular ou a autorização dos serviços de transporte público não regular, de serviços

  especializados ou de táxi-aéreo; II - o proprietário da aeronave ou quem a use diretamente

  ou através de seus prepostos, quando se tratar de serviços aéreos privados; III - o fretador

  que reservou a condução técnica da aeronave, a direção e a autoridade sobre a tripulação
  e

  IV - o arrendatário que adquiriu a condução técnica da aeronave arrendada e a autoridade

  sobre a tripulação. A respeito das responsabilidades do proprietário e do operador em relação

  à operação da aeronave - incluindo o controle de aeronavegabilidade e a necessidade de

  realização de manutenção - o Art. 124 do CBA determina que sempre que “...o nome do

  explorador estiver inscrito no Registro Aeronáutico Brasileiro, mediante qualquer contrato

  de utilização, exclui-se o proprietário da aeronave da responsabilidade inerente à exploração

  da mesma”.

  É importante ressaltar que, para os propósitos do critério de propriedade do parágrafo

  43.3(g)-I(1)(i)(B) do RBAC 43 (“o piloto esteja listado como operador da aeronave no

  certificado de matrícula, caso o operador da aeronave não seja seu proprietário”), o operador

  é aquele definido no Art. 123 do CBA, não devendo ser confundido com a pessoa que opera

  a aeronave na condição de piloto.

  Também existem casos de aeronaves com mais de um proprietário ou operador, sendo que

  um dos proprietários ou operadores é detentor de licença de piloto poderá eventualmente
  se

  enquadrar nos critérios deste grupo para realizar manutenção preventiva.Data de emissão:
  5 de abril de 2019 IS Nº 43-012

  Revisão B

  No caso de aeronave cujo proprietário ou operador é uma pessoa jurídica com propósito de

  recreação sem fins lucrativos, um piloto poderá realizar manutenção preventiva segundo os

  critérios deste grupo se o piloto for membro daquela entidade e se possuir designação dos

  responsáveis legais da pessoa jurídica. A verificação da finalidade (propósito) da pessoa

  jurídica é feita mediante análise dos atos constitutivos da organização.'
