title: Complexidade da aeronave
text: '5.3.3 Complexidade da aeronave

  Para manutenção preventiva realizada por piloto segundo este grupo, são elegíveis quaisquer

  planadores, motoplanadores, balões e ainda outras aeronaves motorizadas. Neste caso, tais

  aeronaves motorizadas são limitadas ao Peso Máximo de Decolagem (PMD, ou Maximum

  Takeoff Weight - MTOW) de até 2.730 kg, e não podem ser equipadas com motor a reação.

  A definição de “motor a reação” se encontra no RBAC nº 01, sendo motor “projetado para

  aviões que utiliza a expansão dos gases para propulsionar o avião”, incluindo motores

  turbofan. Aeronaves equipadas com motores turboeixo (helicópteros) ou turboélice (aviões),

  desde que possuam PMD de até 2.730 kg, não se enquadram na definição de motor a reação

  e, portanto, são elegíveis para os critérios de manutenção preventiva por pilotos dentro
  deste

  grupo.'
