title: Qualificação do piloto
text: '5.3.4 Qualificação do piloto

  Para que o piloto possa executar manutenção preventiva nos grupos “Pilotos proprietários
  e

  assemelhados” e “Diretrizes de Aeronavegabilidade e Tarefas de Manutenção Previstas para

  Pilotos”, ele deve ser titular de licença de piloto ou certificado de piloto aerodesportivo

  (CPA) vigente, deve possuir habilitação válida para o modelo de aeronave e ter completado

  18 anos de idade.

  Um piloto pode obter licença de planador com menos de 18 anos de idade. Nesse caso, ele

  não é elegível para realizar manutenção preventiva.

  Uma vez que a manutenção preventiva é realizada com base na licença ou certificado de

  piloto, estes devem estar vigentes. O piloto cuja licença esteja suspensa, cassada, cancelada

  ou para a qual ele tenha renunciado, não pode realizar manutenção preventiva.

  Adicionalmente, considerando que o propósito da regra é permitir que o piloto realize

  manutenção preventiva em aeronave operada por ele, ele também deve possuir todas as

  habilitações válidas, de classe ou tipo, requeridas para pilotar a aeronave que sofrerá

  manutenção preventiva.

  Em relação ao Certificado Médico Aeronáutico (CMA), não é exigido que ele esteja válido

  para que o piloto realize manutenção preventiva, situação que permite que o piloto cumpra

  tarefas de manutenção preventiva de preservação da aeronave até que esteja novamente apto

  a poder operá-la.'
