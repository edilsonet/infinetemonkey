title: Operação da aeronave
text: '5.3.5 Operação da aeronave

  Para o grupo “Pilotos proprietários e assemelhados”, o piloto somente pode realizar

  manutenção preventiva por piloto se a aeronave não estiver vinculada a uma empresa que

  opere segundo o RBAC nº 135 ou nº 121 e não seja utilizada em operações comerciais de

  serviços aéreos especializados ou operações comerciais de instrução em voo.Data de emissão:
  5 de abril de 2019 IS Nº 43-012

  Revisão B

  Caso o operador pretenda utilizar comercialmente uma aeronave que sofreu anteriormente

  manutenção preventiva por piloto, antes dessa utilização comercial ele deve se assegurar
  que

  todas as inspeções realizadas pelo piloto foram refeitas e que, no caso de intervenções
  não

  programadas, a aeronave seja inspecionada por uma organização de manutenção ou

  mecânico de manutenção aeronáutica quanto aos serviços realizados anteriormente pelo

  piloto.'
