title: Capacitação do piloto
text: '5.3.7 Capacitação do piloto

  No grupo “Pilotos proprietários e assemelhados”, não é obrigatório treinamento formal para

  a realização da manutenção preventiva. Contudo, o piloto deve estar familiarizado com a

  tarefa e se considerar capaz para realizá-la. Tal familiarização pode ser atingida por diversas

  formas: treinamento formal, leitura de manuais, trabalho sob supervisão de um mecânico de

  manutenção aeronáutica, dentre outros. Antes de iniciar uma atividade de manutenção

  preventiva, o piloto deve avaliar cuidadosamente os dados técnicos e se assegurar que sua

  experiência e capacitação prévias são suficientes para o que pretende realizar. Em caso
  de

  dúvida, deve-se abster de realizar a tarefa e procurar um mecânico de manutenção

  aeronáutica ou uma organização de manutenção.

  Faz parte da capacitação do piloto ser capaz de ler e entender o idioma em que estão escritos

  os dados técnicos (manuais, diretrizes de aeronavegabilidade, etc.). Caso não seja capaz
  de

  ler e entender os dados técnicos, é impossível que ele seja capaz de realizar a manutenção

  preventiva de acordo com dados técnicos aceitáveis, conforme requerido pelo parágrafo

  43.13(a) do RBAC nº 43, e deve se abster de realizar a manutenção preventiva.'
