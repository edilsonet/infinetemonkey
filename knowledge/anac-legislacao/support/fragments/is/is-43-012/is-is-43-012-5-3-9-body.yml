cite: 5.3.9
title: Ferramentas e equipamentos
text: '5.3.9 Ferramentas e equipamentos

  Neste grupo, a realização de tarefas de manutenção preventiva por piloto está condicionada

  também a limitações relacionadas às ferramentas e processos necessários para a tarefa. Não

  podem ser necessárias ferramentas especiais ou calibradas, exceto torquímetro e crimpador

  de fios. Vide a IS 43.13-005A ou revisões posteriores para maiores detalhes a respeito do

  que são ferramentas especiais. Também não são elegíveis tarefas que requeiram o uso de

  equipamentos de teste especiais ou ensaios não destrutivos, tais como líquidos penetrantes,

  partículas magnéticas, etc.

  Caso uma determinada tarefa de manutenção preventiva possa ser realizada com ou sem

  determinado equipamento especial, servindo este apenas para tornar sua execução mais

  rápida ou prática, tal tarefa é elegível para realização por piloto segundo os critérios
  deste

  grupo.'
