title: Adicionalmente aos critérios comuns especificados na seção 5.2 desta IS, o cumprimento
text: '5.4.1 Adicionalmente aos critérios comuns especificados na seção 5.2 desta IS, o cumprimento

  por pilotos de Diretrizes de Aeronavegabilidade (DA), tarefas previstas nas Limitações de

  Aeronavegabilidade das Instruções de Aeronavegabilidade Continuada e tarefas do

  programa de manutenção recomendado pelo fabricante segundo as prerrogativas do

  parágrafo 43.3(g)-I(1) do RBAC nº 43, especificamente nas situações que se enquadram nas

  exceções do parágrafo 43.3(g)-I(2), devem seguir os critérios específicos desta seção.'
