text: '5.4.2 O propósito deste grupo é permitir a manutenção preventiva por pilotos com critérios
  menos

  restritivos que os do grupo “Pilotos proprietários e assemelhados” no cumprimento de ações

  simples, tipicamente repetitivas, requeridas por diretrizes de aeronavegabilidade, itens
  de

  limitações de aeronavegabilidade ou tarefas do programa de manutenção recomendado, em

  casos em que a ANAC ou a autoridade de aviação civil emissora da diretriz de

  aeronavegabilidade já atestou a adequabilidade da ação para realização por pilotos.'
