text: '5.4.3 Este grupo contempla especificamente as tarefas de manutenção preventiva previstas
  nos

  parágrafos A43.1(c)(32)-I e (32)-II do Apêndice A do RBAC nº 43, para os quais os critérios

  do parágrafo 43.3(g)-I(1) não são integralmente aplicáveis. Essas prerrogativas foram

  implementadas por meio da exceção descrita no parágrafo 43.3(g)-I(2).'
