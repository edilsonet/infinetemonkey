text: '5.4.5 No que tange a operação da aeronave, neste grupo são permitidas quaisquer operações,

  inclusive comerciais, com exceção daquelas previstas no RBAC nº 121, onde nenhum tipo

  de manutenção preventiva por pilotos é permitido.Data de emissão: 5 de abril de 2019 IS
  Nº 43-012

  Revisão B'
