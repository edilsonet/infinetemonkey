title: Operadores detentores de certificado
text: '5.4.8 Operadores detentores de certificado

  Nesta situação se enquadram os operadores que desempenham suas atividades com base em

  um Certificado de Operador Aéreo, Certificado de Empresa de Transporte Aéreo,

  Certificado de Centro de Treinamento de Aviação Civil ou outros certificados operacionais

  emitidos pela ANAC.

  Para operadores detentores de certificado, o programa de treinamento para manutenção, se

  existente, deve ser revisado, ou um novo programa de treinamento elaborado, e deve ser

  submetido para aprovação pela ANAC, contendo a tarefa do programa de manutenção

  recomendado pelo detentor do projeto de tipo ou suplementar de tipo com menção de que o

  piloto pode cumpri-la, bem como justificativas para que a complexidade de tal tarefa seja

  considerada semelhante à das outras tarefas de manutenção preventiva.

  O programa de treinamento deve cobrir, no mínimo, a regulamentação básica de manutenção

  preventiva, regulamentação operacional associada à manutenção e operação da aeronave

  após manutenção, registros, procedimentos específicos do operador, treinamento prático nas

  tarefas de manutenção preventiva específicas, avaliação do piloto, critérios para aprovação

  e emissão do certificado de treinamento, critérios para qualificação do instrutor e instalações

  onde são realizados os treinamentos teóricos e práticos. No caso de operadores que já

  possuem um programa de treinamento para manutenção, sugere-se que, sempre que possível,

  os critérios e diretrizes para treinamento de pilotos em manutenção preventiva sejam

  harmonizados com aqueles já existentes no programa de treinamento.

  Adicionalmente à aprovação no treinamento, no caso de operadores detentores de

  certificado, o piloto deve estar autorizado por escrito para as tarefas de manutenção

  preventiva que pode realizar. O documento de autorização ou designação deve explicitar o

  nome do piloto, as aeronaves em que pode realizar manutenção preventiva e quais tarefas

  específicas pode desempenhar (ex.: cumprimento da parte II da DA 2019-xx-yy).'
