title: Outros operadores
text: '5.4.9 Outros operadores

  No caso de operadores não detentores de certificado, não é necessária a aprovação junto
  à

  ANAC de um programa de treinamento. Contudo, o piloto deve obter treinamento prático

  junto a uma organização de treinamento, uma organização de manutenção ou um mecânico

  de manutenção aeronáutica, cobrindo minimamente a regulamentação básica de manutençãoData
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  preventiva, regulamentação operacional associada à manutenção e operação da aeronave

  após manutenção, registros e treinamento prático nas tarefas de manutenção preventiva

  específicas. O piloto será considerado como tendo concluído satisfatoriamente o treinamento

  se o instrutor o avaliar e considerar que ele obteve aproveitamento mínimo no escopo do

  treinamento e concluir que é capaz de desempenhar as tarefas de manutenção preventiva

  para as quais foi treinado. O instrutor ou organização deve emitir um certificado ao piloto,
  o

  qual deve mantê-lo arquivado pelo prazo mínimo de 5 anos.

  5.5 Critérios específicos para o grupo “Helicópteros operando sob o RBAC nº 135 em áreas

  remotas”'
