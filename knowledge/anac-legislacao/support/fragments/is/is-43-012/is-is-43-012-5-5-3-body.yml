title: Tarefas de manutenção
text: '5.5.3 Tarefas de manutenção

  Neste grupo, somente é permitida a realização de itens de manutenção preventiva,

  compreendidos na listagem exaustiva do parágrafo A43.1(c) do Apêndice A do RBAC nº

  43.

  Contudo, a realização de tais tarefas pelo piloto somente é permitida se tais itens forem

  resultado de dificuldade ou mau funcionamento em rota para uma área remota ou na área

  remota. Dessa forma, nenhuma tarefa programada se enquadra na prerrogativa do parágrafo

  43.3(h) do RBAC nº 43. Também não enquadram nessa prerrogativa tarefas não

  programadas para correção de discrepâncias ocorridas em área que não seja remota.

  A determinação de quais tarefas de manutenção preventiva serão designadas a pilotos

  depende, portanto, da avaliação do histórico operacional das aeronaves para identificar

  discrepâncias comuns que poderiam ser solucionadas na área remota pelo piloto. Seria

  impraticável antecipar todo tipo de discrepâncias que possam ocorrer em área remota

  passíveis de correção pelo piloto.'
