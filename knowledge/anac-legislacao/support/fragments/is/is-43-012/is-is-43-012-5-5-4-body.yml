title: Área remota
text: '5.5.4 Área remota

  Para os propósitos do parágrafo 43.3(h) do RBAC nº 43, uma área remota é um local afastado

  de centros urbanos, que possui acesso difícil e não oferece nenhuma infraestrutura de suporte

  a operações com aeronaves. Áreas rurais, regiões de floresta, de montanha, ilhas desabitadas

  e desertos são normalmente considerados como áreas remotas. Em operações “offshore”, os

  helipontos instalados em plataformas e navios empregados nas operações de prospecção e

  exploração de petróleo e de gás também podem ser classificados como áreas remotas para

  os propósitos do parágrafo 43.3(h) do RBAC nº 43.'
