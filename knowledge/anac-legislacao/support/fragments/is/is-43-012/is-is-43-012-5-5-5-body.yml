title: Indisponibilidade de mecânico de manutenção aeronáutica
text: '5.5.5 Indisponibilidade de mecânico de manutenção aeronáutica

  O parágrafo 43.3(h)(3) do RBAC nº 43 determina que a realização de tarefas de manutenção

  preventiva pelo piloto está condicionada à indisponibilidade de mecânico de manutenção

  aeronáutica para realizar aquela tarefa. O propósito dessa restrição é o de que sempre que

  possível a manutenção preventiva seja realizada por mecânico de manutenção aeronáutica.Data
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  Contudo, é importante ressaltar que tal mecânico de manutenção aeronáutica somente pode

  atuar se forem seguidos os procedimentos do Manual Geral de Manutenção (MGM) do

  operador e, no caso de organizações de manutenção com contrato com o operador, do

  Manual de Organização de Manutenção (MOM) e Manual de Controle de Qualidade (MCQ)

  da organização de manutenção.

  Consequentemente, não é considerado disponível um mecânico de manutenção aeronáutica

  que, mesmo que presente na área remota, não possua vínculo com o operador ou organização

  de manutenção contratada por ele, ou que não esteja elegível para realizar aquela tarefa
  de

  manutenção preventiva nos termos do MGM e MOM/MCQ.'
