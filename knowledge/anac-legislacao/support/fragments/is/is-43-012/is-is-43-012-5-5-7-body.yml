text: '5.5.7 Procedimentos para avaliar o cumprimento de tarefas de manutenção preventiva
  que

  requeiram decisão quanto à aeronavegabilidade do helicóptero

  Um dos critérios para manutenção preventiva por pilotos neste grupo é a exigência de que
  o

  operador possua procedimentos para avaliar o cumprimento de tarefas de manutenção

  preventiva que requeiram decisão quanto à aeronavegabilidade do helicóptero. Tais

  procedimentos devem estar presentes no MGM do operador, juntamente com os demais

  procedimentos necessários para assegurar que as prerrogativas do parágrafo 43.3(h) do

  O termo “decisão quanto à aeronavegabilidade do helicóptero” significa a decisão que, em

  determinadas tarefas, deve ser realizada para decidir se a aeronave se encontra, ou não,

  aeronavegável. Por exemplo, se o dado técnico determinar que uma medição seja realizada

  e, a depender do resultado, a aeronave pode ou não ser liberada para voo, trata-se de uma

  “decisão quanto à aeronavegabilidade do helicóptero”. Um caso típico é a avaliação de

  limalhas em detectores de limalhas - o manual de manutenção pode especificar

  características de tamanho, material, etc. e sua avaliação deve ser realizada cuidadosamente

  e, em qualquer caso de dúvida, a aeronave deve ser considerada não aeronavegável e inapta

  para voar.Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B'
