text: '5.5.8 Itens de inspeção obrigatória (também chamados de itens de inspeção requerida
  -

  required inspection items)

  Algumas das tarefas de manutenção preventiva previstas neste grupo podem se enquadrar

  também como itens de inspeção obrigatória de acordo com a designação prevista em seu

  MGM, conforme parágrafos 135.427(b)(2) e (3) do RBAC nº 135. Nesse caso, o piloto pode

  ser designado para realizar tais inspeções obrigatórias se os requisitos da seção 135.429
  do

  Dessa forma, adicionalmente aos demais critérios deste grupo, a execução de inspeções

  obrigatórias por pilotos é limitada a helicópteros operador sob o RBAC nº 135 em áreas

  remotas e condicionada à empresa de transporte aéreo ter obtido aprovação dos

  procedimentos aplicáveis à realização de inspeções obrigatórias por piloto, e condicionada

  ao piloto:'
