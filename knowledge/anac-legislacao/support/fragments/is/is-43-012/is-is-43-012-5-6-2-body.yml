title: Aeronaves e operação
text: '5.6.2 Aeronaves e operação

  Este grupo da IS se aplica a aeronave com configuração máxima certificada de assentos para

  passageiros com 9 ou menos assentos, exclusivamente em operações regidas pelo RBAC nº

  135.

  Por “configuração máxima certificada de assentos para passageiros”, deve-se utilizar a

  definição do parágrafo 119.3(g) do RBAC nº 119 (“Configuração de assentos para

  passageiros”), ou definição posterior que venha a substituí-la no RBAC nº 01 ou RBAC nº

  119, especificamente com o termo “máxima certificada de assentos para passageiros”.'
