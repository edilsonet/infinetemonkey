cite: 5.6.3(c)
title: 5.6.3(c)
text: 'c) Instalação e remoção de garrafas de oxigênio medicinal. Neste caso, a remoção e

  instalação podem ser realizadas somente se nenhuma ferramenta for necessária.

  Em relação aos termos “assentos aprovados” e “macas aprovadas”, trata-se da

  obrigatoriedade de que somente podem ser instalados assentos e macas previstos no projeto

  de tipo ou projeto suplementar de tipo aprovados. Qualquer instalação de itens não previstos

  no projeto de tipo ou suplementar de tipo torna a aeronave não conforme ao projeto e,

  portanto, não aeronavegável. Em tal situação, a aeronave não pode ser operada se não estiver

  aeronavegável, obrigação que, se violada, sujeita o operador e o piloto às penalidades

  previstas no Código Brasileiro de Aeronáutica (Lei. 7.565/1986).'
