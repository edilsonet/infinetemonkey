title: Manual Geral de Manutenção, Programa de Treinamento e designação
text: '5.6.4 Manual Geral de Manutenção, Programa de Treinamento e designação

  Neste grupo, o operador deve revisar seu MGM e Programa de Treinamento para incluir

  procedimentos e treinamentos necessários aos pilotos que venham a executar manutenção

  preventiva neste grupo, assegurando que todos requisitos aplicáveis sejam cumpridos.Data
  de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  O programa de treinamento deve cobrir, no mínimo, a regulamentação básica de manutenção

  preventiva, regulamentação operacional associada à manutenção e operação da aeronave

  após manutenção, registros, procedimentos específicos do operador, treinamento prático nas

  tarefas de manutenção preventiva específicas, avaliação do piloto, critérios para aprovação

  e emissão do certificado de treinamento, critérios para qualificação do instrutor e instalações

  onde são realizados os treinamentos teóricos e práticos. Sugere-se que, sempre que possível,

  os critérios e diretrizes para treinamento de pilotos em manutenção preventiva sejam

  harmonizados com aqueles já existentes no programa de treinamento.

  Adicionalmente à aprovação no treinamento, o piloto deve estar autorizado por escrito para

  as tarefas de manutenção preventiva que pode realizar. O documento de autorização ou

  designação deve explicitar o nome do piloto, as aeronaves em que pode realizar manutenção

  preventiva e quais tarefas específicas pode desempenhar.'
