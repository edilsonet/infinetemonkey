title: Procedimentos para avaliar o cumprimento de tarefas pelo piloto
text: '5.6.5 Procedimentos para avaliar o cumprimento de tarefas pelo piloto

  Um dos critérios para manutenção preventiva por pilotos neste grupo é a exigência de que
  o

  operador possua procedimentos disponíveis para que o piloto avalie o cumprimento das

  tarefas. Tais procedimentos devem estar presentes no MGM do operador, juntamente com

  os demais procedimentos necessários para assegurar que as prerrogativas do parágrafo

  43.3(i) do RBAC n º 43 sejam exercidas em conformidade com os critérios ali estabelecidos

  Por exemplo, no caso de instalação de assentos ou macas, o procedimento no MGM pode

  ser uma lista de verificação para que, concluída a instalação segundo o manual de

  manutenção ou outro dado técnico, ele verifique todos pontos de fixação para assegurar de

  que o assento ou maca foi adequadamente instalado.

  Um aspecto muito importante em mudanças de configuração é assegurar conformidade à

  planta baixa aprovada, respeitando quantidade e localização de assentos e sua disposição.

  Também é importante que os componentes (assentos, macas, etc.) sejam os de número de

  parte previstos no projeto. Caso tais restrições não sejam respeitadas, os limites de peso
  e

  posição do centro de gravidade poderão ser excedidos, trazendo risco à segurança

  operacional.'
