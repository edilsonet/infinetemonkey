text: 'z) VHF - Very High Frequency (Frequência Muito Alta).Data de emissão: 5 de abril de
  2019 IS Nº 43-012

  Revisão B

  - EXEMPLO DE REGISTRO DE MANUTENÇÃO PREVENTIVA

  B.1 Exemplo de registro de manutenção preventiva conforme seção 43.9 do RBAC (não

  aplicável a inspeções realizadas segundo RBHA/RBAC nº 91 ou parágrafo 135.411(a)(1) ou

  seção 135.419 do RBAC nº 135):

  Aeronave: PP-ABC

  Fabricante:___________ Modelo: ____________ Número de série: _____

  Data: 01/JAN/2019 Horas totais: ________ Ciclos totais: ________

  Certifico que substituí nesta data a lâmpada do farol de pouso da aeronave PP-ABC,

  conforme tarefa 33-40-xxxxx do Manual de Manutenção xxxxxx, revisão DEZ/2018, e

  aprovo a aeronave para retorno ao serviço quanto ao serviço realizado.

  Nome do piloto: ____________________________

  Tipo de licença/certificado de piloto: ____________

  Código ANAC do piloto: _____________________

  Assinatura: _________________________________

  B.2 Exemplo de registro de manutenção preventiva conforme seção 43.11 do RBAC (aplicável

  a inspeções realizadas segundo RBHA/RBAC nº 91 ou parágrafo 135.411(a)(1) ou seção

  135.419 do RBAC nº 135):

  Aeronave: PP-ABC

  Fabricante:___________ Modelo: ____________ Número de série: _____

  Data: 01/JAN/2019 Horas totais: ________ Ciclos totais: ________

  Inspeção: __________

  Certifico que a aeronave PP-ABC foi inspecionada de acordo com a inspeção

  ________________ e concluo que ela está em condições aeronavegáveis.

  Nome do piloto: ____________________________

  Tipo de licença/certificado de piloto: ____________

  Código ANAC do piloto: _____________________

  Assinatura: _________________________________

  NOTA 1 - O piloto somente realizar determinada inspeção se TODAS as ações requeridas

  se enquadrarem nos critérios de manutenção preventiva por pilotos.

  NOTA 2 - Registro não aplicável a inspeções progressivas. Neste caso, utilizar a declaração

  contida no parágrafo 43.11(a)(6).Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  NOTA 3 - No caso da aeronave ser REPROVADA na inspeção, emitir o registro com a

  declaração do parágrafo 43.11(a)(5) e emitir uma lista de discrepâncias. A aeronave não

  pode ser operada.

  NOTA 4 - Pilotos de aeronaves regidas pelo RBAC nº 135 devem emitir os registros

  conforme modelo presente no MGM em vigor.

  NOTA 5 - No caso de Diretriz de Aeronavegabilidade, emitir FCDA e não utilizar estes

  modelos.Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO B

  ITEM

  ALTERADO ALTERAÇÃO REALIZADA

  Toda a IS Adequações da IS à nova Emenda (03) do RBAC nº 43, aprovada pela Resolução ANAC
  nº 509 de

  14 de março de 2019.

  Estrutura de

  seções Alteração da estrutura de seções, para garantir conformidade com a Instrução Normativa
  nº 15/2008.'
