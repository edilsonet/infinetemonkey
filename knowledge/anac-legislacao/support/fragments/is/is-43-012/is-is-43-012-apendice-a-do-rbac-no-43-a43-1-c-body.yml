cite: apendice-a-do-rbac-no-43-a43-1-c
title: Apêndice A do RBAC nº 43, §A43.1(c));
text: 'Apêndice A do RBAC nº 43, §A43.1(c));

  • Piloto familiarizado e que se considera competente para

  realizar a tarefa;

  • Tarefa de manutenção não crítica;

  • Tarefa não requer ferramentas especiais ou calibradas,

  exceto torquímetro e crimpador de fios, nem requer

  equipamentos de teste ou ensaios especiais;

  • Tarefa não tem por propósito atestar o cumprimento total

  ou parcial de uma inspeção de 100 horas, anual ou

  inspeção especial não programada; e

  • Tarefa não afeta sistema essencial para voo IFR.

  Diretrizes de

  Aeronavegabilidade e

  Tarefas de Manutenção

  Previstas para Pilotos

  Piloto:

  • Titular de licença de piloto ou Certificado de Piloto

  Aerodesportivo (CPA), exceto licença de piloto aluno;

  • Idade mínima de 18 anos;Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  Grupo Critérios

  (2)

  • Habilitação válida aplicável ao modelo da aeronave; e

  • Licença ou certificado não tenha sido suspenso, cassado,

  cancelado e não tenha sido renunciado.

  Operação da aeronave:

  • Aeronave não vinculada a empresa que opere segundo o

  Tarefas:

  • Diretrizes de aeronavegabilidade e itens de limitação de

  aeronavegabilidade previstos para realização por pilotos;

  • Tarefas do programa de manutenção recomendado pelo

  detentor do projeto de tipo previstas para pilotos E

  avaliadas pela ANAC como de complexidade

  equivalente às tarefas de manutenção preventiva; e

  • Se operador detentor de certificado, piloto designado

  pelo operador para a tarefa.

  Treinamento:

  • Se operador detentor de certificado: piloto treinado sob

  um programa de treinamento aprovado;

  • Outros operadores: treinamento prático de forma

  aceitável à ANAC;

  • ANAC pode considerar que treinamento não é necessário

  mediante avaliação caso a caso.

  Helicópteros operando

  sob o RBAC nº 135 em

  áreas remotas

  Aeronaves:

  • Helicópteros.

  Operação da aeronave:

  • Aeronave vinculada a empresa operando segundo o

  Tarefas:

  • Somente manutenção preventiva (listagem exaustiva do

  Apêndice A do RBAC nº 43, §A43.1(c));

  • Somente resultado de discrepância ocorrida em rota para

  área remota ou em área remota; e

  • Piloto designado para a tarefa a ser executada;

  Treinamento:

  • Piloto treinado sob um programa de treinamento

  aprovado.

  Outros critérios:

  • Prerrogativas mediante aprovação prévia da ANAC;

  • Não existe mecânico de manutenção aeronáutica

  disponível para realizar a tarefa de manutenção

  preventiva;Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  Grupo Critérios

  • Operador deve possuir procedimentos para avaliar o

  cumprimento de tarefas de manutenção preventiva que

  requeiram decisão quanto à aeronavegabilidade do

  helicóptero.

  Reconfiguração de

  aeronaves operando

  segundo RBAC nº 135

  Aeronaves:

  • Quaisquer com configuração máxima certificada de

  assentos para passageiros com 9 ou menos assentos.

  Operação da aeronave:

  • Aeronave vinculada a empresa operando segundo o

  Tarefas:

  • Remoção e reinstalação de assentos da cabine aprovados;

  • Remoção e reinstalação de macas acopláveis à cabine

  aprovadas;

  • Instalação e remoção de garrafas de oxigênio medicinal

  se nenhuma ferramenta for necessária;

  • Piloto designado para a tarefa a ser executada.

  Treinamento:

  • Piloto treinado sob um programa de treinamento

  aprovado.

  Outros critérios:

  • Prerrogativas mediante aprovação prévia da ANAC;

  • Operador deve possuir procedimentos disponíveis ao

  piloto para avaliar o cumprimento das tarefas.'
