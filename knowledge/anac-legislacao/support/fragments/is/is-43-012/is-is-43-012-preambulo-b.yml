title: preambulo(b)
text: 'b) “Manutenção preventiva significa uma operação de preservação simples ou de

  pequena monta, assim como a substituição de pequenas partes padronizadas que

  não envolva operações complexas de montagem e desmontagem.”

  3.2 Adicionalmente, o parágrafo A43.1(c) do Apêndice A do RBAC nº 43 também limita a

  manutenção preventiva aos trabalhos previstos naquele parágrafo.

  3.3 O parágrafo 43.3(g)-I do RBAC nº 43 estabelece que pilotos são autorizados a executar

  manutenção preventiva, sendo tal prerrogativa condicionada às restrições contidas naquele

  parágrafo. O parágrafo 43.7(f)-I do RBAC nº 43, por sua vez, estabelece que o piloto pode

  aprovar o retorno ao serviço de aeronave que teve manutenção preventiva executada por ele

  segundo o parágrafo 43.3(g)-I do RBAC nº 43.

  3.4 O parágrafo 43.3(h) do RBAC nº 43 estabelece que “a ANAC pode emitir aprovação para

  que uma empresa de transporte aéreo detentora de especificações operativas emitidas

  segundo o RBAC nº 135, operando helicóptero em área remota, permita que um piloto

  realize tarefas específicas de manutenção preventiva”, sendo essa aprovação também

  condicionada às restrições do mesmo parágrafo.

  3.5 A seção 135.429 do RBAC nº 135 estabelece os requisitos para pessoal de inspeção

  obrigatória, incluindo condições específicas para pilotos de helicópteros operando em áreas

  remotas realizarem inspeções obrigatórias, complementarmente aos requisitos do parágrafo

  43.3(h) do RBAC nº 43.Data de emissão: 5 de abril de 2019 IS Nº 43-012

  Revisão B

  3.6 O parágrafo 43.3(i) do RBAC nº 43 estabelece que “o piloto de uma aeronave com

  configuração máxima certificada de assentos para passageiros com 9 ou menos assentos

  pode, mediante uma aprovação emitida para uma empresa de transporte aéreo detentora de

  especificações operativas emitidas segundo o RBAC nº 135, realizar a remoção e

  reinstalação de assentos da cabine aprovados, de macas acopláveis à cabine aprovadas, e,

  somente se nenhuma ferramenta for necessária, de garrafas de oxigênio medicinal”,

  condicionado às restrições do mesmo parágrafo.

  3.7 O parágrafo 43.7(e) do RBAC nº 43 estabelece as condições para empresas de transporte

  aéreo aprovarem para retorno ao serviço artigos por elas trabalhados, o que inclui aeronaves

  que sofreram manutenção preventiva realizada por pilotos segundo as prerrogativas dos

  parágrafos 43.3(h) e (i) do RBAC nº 43.

  3.8 A IS 43.9-003A fornece orientação acerca da utilização, dentre outros, das cadernetas
  de

  célula, motor e hélice, as quais são um tipo de registro de manutenção.

  3.9 A Lei n° 13.475 de 28 de agosto de 2017 dispõe sobre o exercício da profissão de tripulante

  de aeronave (aeronauta) e determina, no Art. 41, inciso V, que a realização de outros serviços

  em terra, quando escalados pela empresa, são computados na duração do trabalho dos

  aeronautas.

  3.10 A Resolução ANAC nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a Agência

  pode emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em

  RBAC.'
