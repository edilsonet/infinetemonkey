text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 43-012

  Revisão B

  Aprovado por: Portaria nº 958/SAR, de 28 de março de 2019.

  Assunto: Manutenção preventiva por pilotos Origem: SAR/GTPN

  1 OBJETIVO

  1.1 Esta IS estabelece os critérios aceitáveis, mas não únicos, para esclarecer, detalhar
  e orientar

  a forma de cumprimento com o RBAC nº 43, em relação à manutenção preventiva executada

  por pilotos e sua respectiva aprovação para retorno ao serviço.

  2 REVOGAÇÃO

  2.1 Esta IS substitui e cancela a IS n° 43-012A, de 25 de março de 2013.

