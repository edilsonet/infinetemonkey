text: '3.1.1 O art. 70 da lei nº 7.565 - Código Brasileiro de Aeronáutica (CBA), de 19 de
  dezembro de

  1986, estabelece que a autoridade aeronáutica emitirá certificados de homologação de

  empresa destinada à execução de serviços de revisão, reparo e manutenção de aeronave,

  motores, hélices e outros produtos aeronáuticos.'
