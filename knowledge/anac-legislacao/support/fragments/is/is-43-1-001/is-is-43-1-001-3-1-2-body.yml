text: '3.1.2 O inciso XVII do art. 8° da Lei nº 11.182, de 27 de setembro de 2005, estabelece
  que compete

  à ANAC proceder à homologação e emitir certificados, atestados, aprovações e autorizações,

  relativos às atividades de competência do sistema de segurança de voo da aviação civil.'
