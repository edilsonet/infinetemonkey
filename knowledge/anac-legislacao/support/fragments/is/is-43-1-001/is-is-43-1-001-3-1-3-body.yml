title: A seção 43.3 do RBAC 43 define quais pessoas estão autorizadas a executar manutenção,
text: '3.1.3 A seção 43.3 do RBAC 43 define quais pessoas estão autorizadas a executar manutenção,

  manutenção preventiva, reconstrução e alteração em um artigo aeronáutico. A seção 43.7 do

  mesmo regulamento define ainda quais pessoas estão autorizadas a aprovar o retorno ao

  serviço de um artigo após manutenção, manutenção preventiva, reconstrução e alteração.'
