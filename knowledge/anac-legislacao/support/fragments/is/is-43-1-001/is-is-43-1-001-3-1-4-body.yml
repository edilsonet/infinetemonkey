title: O parágrafo 43.1(e)-I do RBAC 43 dispõe que a ANAC poderá, a pedido, efetuar certificação
text: '3.1.4 O parágrafo 43.1(e)-I do RBAC 43 dispõe que a ANAC poderá, a pedido, efetuar
  certificação

  expedita, emitindo autorização caso a caso para que pessoas detentoras de certificados ou

  licenças expedidas por outros países executem serviços específicos, individualmente

  identificados, de manutenção, manutenção preventiva, reconstrução ou alteração de artigos,

  dentro ou fora do território nacional, caso não exista organização certificada e capacitada

  segundo o RBAC 145 para a realização dos serviços pretendidos.

  4 DEFINIÇÕES

  4.1 Siglas'
