title: O RBAC 43 estabelece regras gerais para a realização de manutenção em aeronaves com
text: '5.1.1 O RBAC 43 estabelece regras gerais para a realização de manutenção em aeronaves
  com

  certificado de aeronavegabilidade brasileiro e seus componentes. As seções 43.3 e 43.7 desse

  regulamento definem as pessoas autorizadas a executar manutenção, manutenção

  preventiva, reconstrução e alteração de artigos, assim como a aprovar o retorno destes artigos

  ao serviço.'
