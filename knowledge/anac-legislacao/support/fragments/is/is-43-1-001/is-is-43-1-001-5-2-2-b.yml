title: 5.2.2(b)
text: 'b) Existência de OM certificada pela ANAC localizada no Brasil ou no estrangeiro,

  mas que se encontram, no momento, impedidas de realizar manutenção por ato

  administrativo da ANAC ou devido à perda de capacidade temporária para a

  realização do serviço pretendido ou por inviabilidade financeira.16/12/2016 IS nº 43.1-001

  Revisão A'
