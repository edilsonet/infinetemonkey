cite: 5.2.3.2(a)
title: 5.2.3.2(a)
text: 'a) Aeronave em AOG (Aircraft On Ground) fora do Brasil, distante de OM certificada

  pela ANAC, de forma que o deslocamento de pessoal e a logística associada para

  que uma OM certificada possa realizar o serviço fora do seu local certificado

  gerariam custos demasiadamente altos. Além deste exemplo relativo a serviço em

  aeronave, pode-se considerar também situações similares com relação a motores,

  hélices e componentes.'
