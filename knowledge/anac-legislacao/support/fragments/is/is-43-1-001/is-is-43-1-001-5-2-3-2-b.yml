text: 'b) Inacessibilidade ao local de operação de OM certificada pela ANAC para a

  realização do serviço necessário: nesta hipótese consideram-se os casos em que para

  realização de determinado serviço de manutenção não é possível devido a

  impedimentos relacionados a localização geográfica e inviabilidade de acesso de

  OM certificada pela ANAC para realização do serviço.

  5.3 Procedimentos para solicitação de certificação expedita'
