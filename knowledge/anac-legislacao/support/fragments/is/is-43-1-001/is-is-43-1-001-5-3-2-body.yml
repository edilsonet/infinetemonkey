cite: 5.3.2
title: A solicitação de certificação expedita pode ser protocolada na agência por OM que realizará
text: '5.3.2 A solicitação de certificação expedita pode ser protocolada na agência por OM
  que realizará

  o serviço de manutenção ou por Operador Aéreo interessado no serviço de manutenção. Essa

  solicitação poderá ser feita utilizando carta apresentando pedido em formato livre, não
  sendo

  necessária a utilização de formulário específico da agência.'
