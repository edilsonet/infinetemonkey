title: Caso a solicitação de certificação expedita seja motivada pela inexistência de OM certificada
text: '5.4.1 Caso a solicitação de certificação expedita seja motivada pela inexistência de
  OM certificada

  conforme RBAC 145, o solicitante deverá apresentar a declaração, conforme orientação da

  subseção 5.3 desta IS. A ANAC poderá realizar consulta ao banco de dados do sistema da

  Superintendência de Aeronavegabilidade a fim de constatar o fato declarado pelo solicitante.'
