title: Para a constatação de existência de OM certificada conforme RBAC 145 contudo
text: '5.4.2 Para a constatação de existência de OM certificada conforme RBAC 145 contudo

  temporariamente não capacitada, podem ser consideradas as apresentações dos seguintes

  documentos pelo solicitante: informes de indisponibilidade de OM certificada (considerando

  um determinado período) presentes em cartas, declarações, mensagens eletrônicas recebidas

  pelo solicitante dos serviços, etc. A avaliação de inviabilidade financeira pode ser constatada

  com base em apresentação de orçamentos, entre outros documentos de forma a compor a

  substanciação dos argumentos apresentados pelo solicitante. Se surgirem dúvidas na

  avaliação desta questão, a GCVC pode ser consultada.'
