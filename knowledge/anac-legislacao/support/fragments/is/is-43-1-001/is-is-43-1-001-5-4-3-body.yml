title: A apresentação de simples declaração do solicitante atestando que, embora existam OM’s
text: '5.4.3 A apresentação de simples declaração do solicitante atestando que, embora existam
  OM’s

  certificadas para o serviço, as mesmas não se encontram capacitadas (conforme condições

  expressas na seção 5.2 desta IS), poderá ser aceita pelos servidores designados durante
  a

  análise do processo, desde que nesta declaração conste quais as OM’s certificadas que foram

  consultadas e quando. A constatação, a posteriori, de apresentação de informação inexata

  poderá sujeitar o declarante às sanções previstas no CBA, conforme expresso na seção 5.6

  desta IS.'
