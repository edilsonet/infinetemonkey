title: Caso o operador (empresa contratante) faça auditoria na empresa possuidora de um COM
text: '5.4.5 Caso o operador (empresa contratante) faça auditoria na empresa possuidora de
  um COM

  RBAC 145 e candidata a ser contratada, e o resultado desta auditoria indique que os

  regulamentos brasileiros não estão sendo atendidos pela mesma, a ANAC pode considerar

  este resultado como falta de capacidade desde que possa ser confirmada pela ANAC (através

  de auditoria por equipe de servidores designados ou outro meio aceitável).'
