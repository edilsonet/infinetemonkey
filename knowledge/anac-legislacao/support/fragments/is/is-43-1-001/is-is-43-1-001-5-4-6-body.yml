title: O operador pode também fazer uso de históricos de problemas com produtos recebidos
  de
text: '5.4.6 O operador pode também fazer uso de históricos de problemas com produtos recebidos
  de

  determinada empresa detentora de COM conforme RBAC 145 para apontar a falta de

  qualidade nos serviços prestados. A ANAC em todas estas situações averiguará essas

  informações, aplicando as sanções necessárias imediatamente, e somente concederá a

  certificação expedita para o requerente quando confirmadas as não conformidades aos

  requisitos de certificação.'
