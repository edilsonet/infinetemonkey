title: Deve-se considerar que o serviço seja realizado por organizações portadoras de licenças,
text: '5.5.2 Deve-se considerar que o serviço seja realizado por organizações portadoras de
  licenças,

  certificados ou autorizações emitidas pela Autoridade de Aviação Civil (AAC) local

  responsável primariamente pela supervisão da OM, ou FAA (EUA), ou EASA (Europa).'
