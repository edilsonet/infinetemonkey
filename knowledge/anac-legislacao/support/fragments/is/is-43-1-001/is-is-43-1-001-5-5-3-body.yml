title: Esta comprovação de que a OM é certificada (ou pessoa detentora de licença ou autorização)
text: '5.5.3 Esta comprovação de que a OM é certificada (ou pessoa detentora de licença ou
  autorização)

  para o serviço pela AAC de outro país deve ser realizada através da avaliação do certificado

  de organização de manutenção, das especificações operativas (ou documento equivalente) e,

  quando aplicável, da página específica da Lista de Capacidade (LC) ou do manual da OM

  aceito pela autoridade onde esteja clara e inequívoca a prerrogativa da empresa para a

  realização do serviço pretendido.'
