title: OBJETIVO
text: '1. OBJETIVO

  Esta IS estabelece critérios aceitáveis, mas não únicos, para detalhar e orientar a forma
  de

  cumprimento com o parágrafo 43.13(a) do RBAC 43, com as recomendações para o esta-

  belecimento dos critérios mínimos para a inspeção através de Ensaios Não Destrutivos -

  END na manutenção de produto aeronáutico. Este documento aplica-se às pessoas direta-

  mente responsáveis pelo gerenciamento, de controle e de aplicação dos métodos e técnicas

  de END utilizados em uma Organização de Manutenção de Produto Aeronáutico - OM de-

  tentora de certificado conforme o RBAC 145.'
