title: Os END são métodos que permitem a inspeção de produtos aeronáuticos tais como aero-
text: '3.3.1 Os END são métodos que permitem a inspeção de produtos aeronáuticos tais como
  aero-

  nave, motor, hélice e componentes, com equipamentos extremamente portáteis e comple-

  xas estações de trabalho. As técnicas permitem, através de um critério de aceita-

  ção/rejeição, estabelecido em uma documentação de engenharia voltada para a manutenção

  da aeronavegabilidade, determinar a presença de condições indesejáveis, como por exem-

  plo: trincas, corrosão, delaminação, etc.'
