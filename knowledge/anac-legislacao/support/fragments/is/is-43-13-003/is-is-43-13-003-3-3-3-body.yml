title: Por volta do ano de 2001, as empresas foram requeridas a uniformizar as atividades
  de
text: '3.3.3 Por volta do ano de 2001, as empresas foram requeridas a uniformizar as atividades
  de

  END, e a orientar a formação de pessoal junto ao então Centro Técnico Aeroespaci-

  al/Instituto de Fomento e Coordenação Industrial - CTA/IFI. Em outubro de 2002, foi edi-

  tada a Instrução de Aviação Civil - IAC 3146 - Requisitos Para a Realização de Ensaios

  Não Destrutivos por Empresas de Manutenção de Aeronaves, documento que continha

  como anexo, a tradução da norma National Aerospace Standard AIA-NAS-410 - Norma

  de Qualificação e Certificação de Pessoal para END. Em 2011, foi criada a IS 43.13-003A,

  que revogou a IAC 3146.'
