text: '3.3.5 Nesta revisão, incluem-se referências à legislação da Comissão Nacional de Energia
  Nu-

  clear - CNEN, do Conselho Regional dos Técnicos em Radiologia - CRTR, e do Conselho

  Nacional dos Técnicos em Radiologia - CONTER. A norma AIA-NAS-410 ou a equiva-

  lente nacional NBR editada pela Associação Brasileira de Normas Técnicas - ABNT tor-

  nam-se normas de referência, deixando de ser texto anexo. Também são incluídas referên-

  cias a outras normas de treinamento, qualificação e certificação em END para Organiza-

  ções de Manutenção certificadas em estado estrangeiro e as pertencentes a Organizações

  Militares.'
