title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 O parágrafo 43.13(a) do RBAC 43 estabelece que cada pessoa executando “manutenção,

  manutenção preventiva, alterações ou reconstrução” (nessa IS todos esses termos são refe-

  ridos simplesmente como “manutenção”) em uma aeronave, célula, motor, hélice, rotor,

  equipamento ou parte dos mesmos deve usar métodos, técnicas e práticas estabelecidas na

  última revisão do manual de manutenção provisionado pelo detentor do projeto de tipo, fa-

  bricante, ou nas instruções para aeronavegabilidade continuada preparadas por estes ou ou-

  tros métodos, técnicas e práticas aceitáveis, exceto como previsto na seção 43.16 do RBAC'
