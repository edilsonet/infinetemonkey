text: '4. DEFINIÇÕES

  4.1 Critério de aceitação/rejeição: parâmetro estabelecido em norma ou procedimento espe-

  cífico, qualificando e/ou quantificando uma indicação, utilizado na decisão em aceitar ou

  rejeitar um artigo, como resultado de uma inspeção por END.

  4.2 Documento de serviço: documento emitido pelo detentor do projeto de tipo do produto

  aeronáutico (aeronave, motor, hélice, equipamento ou componente), que fornece métodos,

  técnicas e práticas aceitáveis para a execução de manutenção, manutenção preventiva e al-

  terações. Esses documentos incluem, mas não estão limitados a ICA (Instruções de Aero-

  navegabilidade Continuada), manuais de manutenção (inclusive de componentes), boletins

  de serviço, manuais de reparos estruturais, cartas de serviço, etc.27/09/2013 IS Nº 43.13-003

  Revisão C

  4.3 Método: tipo de inspeção por END (ex. radiografia, ultrassom, etc.).

  4.4 Qualificação no Nível 1 em END: nível de qualificação/autorização de uma pessoa (pro-

  fissional) que a autoriza a preparar peças para uma inspeção, e somente quando expressa-

  mente autorizado por um profissional qualificado no Nível 3, executar ensaios, calibrações,

  e interpretações em um determinado método de ensaio.

  4.5 Qualificação no Nível 2 em END: nível de qualificação/autorização de uma pessoa (pro-

  fissional) que a autoriza a preparar peças antes e após o ensaio, ajustar e calibrar equipa-

  mentos, seguir procedimentos, executar ensaios, interpretar, avaliar e documentar a aceita-

  ção/rejeição de um produto em um determinado método de ensaio.

  4.6 Qualificação no Nível 3 em END: nível de qualificação/autorização de uma pessoa (pro-

  fissional) que a autoriza a interpretar normas e procedimentos, selecionar métodos de

  END, elaborar procedimentos, conduzir treinamento e avaliação dos profissionais qualifi-

  cados nos Níveis 1 e 2, em um determinado método de ensaio. Pode conduzir as atividades

  do profissional qualificado no Nível 2, desde que esta competência esteja incluída na sua

  qualificação.

  4.7 Técnica: um procedimento dentro de um método. Por exemplo: técnica/procedimento de

  imersão no teste ultrassônico, ou técnica/procedimento de penetrante fluorescente dentro

  do método dos líquidos penetrantes.'
