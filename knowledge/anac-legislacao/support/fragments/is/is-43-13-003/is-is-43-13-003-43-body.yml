title: A pessoa deve usar as ferramentas, equipamentos e aparelhos de teste necessários para
text: '43. A pessoa deve usar as ferramentas, equipamentos e aparelhos de teste necessários
  para

  assegurar a execução do trabalho de acordo com práticas industriais de aceitação geral.
  Se

  o detentor do projeto de tipo ou fabricante envolvido recomendar equipamentos e apare-

  lhos de teste especiais, ela deve usar tais equipamentos e aparelhos ou equivalentes apro-

  vados.

  3.2 Os END, assunto tratado nesta IS, determinam diretamente a aeronavegabilidade de um

  artigo e consequentemente exerce profundo impacto na segurança da aviação civil, dada a

  vasta quantidade de inspeções END executadas tanto na fabricação de produtos, mas prin-

  cipalmente, e esse é o foco desta IS, quanto na manutenção de tais artigos (artigos, referen-

  te ao RBAC 145 e produtos, referente ao RBAC 21, possuem conotação semelhante). Por

  outro lado, tanto os cursos de formação de mecânicos de manutenção aeronáutica - MMA,

  quanto à própria certificação dos MMA pela ANAC não são especificamente voltados para

  o treinamento e qualificação das pessoas que executam END. Eventos ocorridos na aviação

  civil mundial e, notadamente o voo 243 da Aloha Airlines em 28 de abril de 1988, repeti-

  damente citado como “um marco na aviação civil”, ressaltam a importância do desempe-

  nho e do adequado processo de treinamento e qualificação em END.27/09/2013 IS Nº 43.13-003

  Revisão C

  3.3 Histórico'
