title: Os blocos devem possuir Certificado de Conformidade - COFC (ou documento equivalen-
text: '5.13.2 Os blocos devem possuir Certificado de Conformidade - COFC (ou documento equivalen-

  te) emitido pelo fabricante. Opcionalmente, quando for possível a fabricação própria, os

  blocos devem possuir um Certificado de Conformidade emitido pelo Gestor Responsável

  da OM, e documentação descrevendo materiais e o processo de fabricação, que deve ser de

  acordo com desenhos ou especificações fornecidas ou indicadas pelos detentores do proje-

  to de tipo ou fabricantes do artigo. Esta documentação deve ser mantida disponível para
  a

  ANAC.27/09/2013 IS Nº 43.13-003

  Revisão C'
