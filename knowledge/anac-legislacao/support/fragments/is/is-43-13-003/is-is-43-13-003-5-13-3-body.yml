title: Os procedimentos de registro de cada inspeção por END (ensaio) devem listar o P/N do
text: '5.13.3 Os procedimentos de registro de cada inspeção por END (ensaio) devem listar
  o P/N do

  bloco (e o S/N, se aplicável) e se é próprio ou fornecido pelo cliente. Pode ser referenciado

  o nº de patrimônio.

  Nota - os profissionais qualificados no Nível 2 e 3 em END costumam reter consigo peças

  e/ou componentes em que foram encontradas descontinuidades que resultaram em rejei-

  ção. A finalidade é servir como referência para avaliar qualitativamente a calibração pa-

  ra o próximo teste em produto semelhante, ou como corpos de prova para treinamento.

  Essas peças não substituem os blocos mencionados na subseção 5.13.1 acima e não neces-

  sitam de certificado de conformidade como mencionado na subseção 5.13.2 acima; porém,

  deve haver etiqueta indicando a condição não aeronavegável. Citamos como exemplos:

  cone bolts, blades, fixadores de qualquer natureza, seções de lap-joints, etc.

  5.14 Laudo de END'
