title: O MOM deve estabelecer, para as situações previstas, o formato de um laudo para docu-
text: '5.14.1 O MOM deve estabelecer, para as situações previstas, o formato de um laudo para
  docu-

  mentar (registrar) a inspeção, e que é emitido para os artigos que são inspecionados com
  o

  critério de aceitação/rejeição estabelecido no procedimento específico da inspeção por

  END e são, nos casos previstos, a base de dados que será transcrita nos formulários, por

  ex: o formulário ANAC F-100-01. O MOM também deve indicar a forma de dispor os ar-

  tigos rejeitados.

  Nota - Artigos Rejeitados: uma possível inutilização de um artigo não aprovado em uma

  inspeção END deve ser previamente arranjada com o proprietário do produto. Ver IS'
