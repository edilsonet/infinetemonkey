title: 'Empresas detentoras de especificações operativas de acordo com o RBAC 121 e 135:'
text: '5.2.1 Empresas detentoras de especificações operativas de acordo com o RBAC 121 e 135:

  Empresas (genericamente denominadas de “Operadoras”), que desejam inspecionar por

  END os artigos listados em suas Especificações Operativas, necessitam a certificação de

  Organização de Manutenção - OM na categoria “serviço especializado” do RBAC 145 pa-

  ra executar END. Os END autorizados geralmente estão nos procedimentos específicos

  descritos nos documentos de serviço do detentor do projeto de tipo do produto aeronáutico

  (tal como os Service Bulletin - SB). As operadoras certificadas em END podem oferecer

  serviços de END para terceiros, segundo os artigos, métodos e limitações autorizadas (lis-

  tados em suas Especificações Operativas). A aprovação para retorno ao serviço é fornecida

  pela OM da operadora (a que inspeciona o artigo), mediante a emissão de um formulário

  de liberação de manutenção (maintenance release). A liberação para retorno ao voo é prer-

  rogativa da empresa que opera a aeronave (vide seção 121.709 do RBAC 121).'
