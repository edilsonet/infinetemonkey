cite: 5.2.2(a)
title: 5.2.2(a)
text: 'a) quando os procedimentos específicos estão descritos nos documentos de serviço do
  de-

  tentor do projeto de tipo do produto aeronáutico listado em suas Especificações Opera-

  tivas ou Lista de Capacidade, não há a necessidade da certificação adicional na catego-

  ria “serviço especializado” para executar END, a menos que essa OM tenha interesse

  em prestar serviços em outra localidade. Os métodos autorizados de END e suas limita-

  ções ficam listados em suas Especificações Operativas. A aprovação para retorno ao

  serviço é fornecido pela OM mediante a emissão de um formulário de liberação de ma-

  nutenção (maintenance release) ou por meio de um Formulário ANAC F-100-01, con-

  forme aplicável. A liberação para retorno ao voo é prerrogativa da empresa que opera a

  aeronave. (vide seção 121.709 do RBAC 121). O Formulário ANAC acima citado está

  disponível no link: http://www2.anac.gov.br/certificacao/Form/Form.asp; e'
