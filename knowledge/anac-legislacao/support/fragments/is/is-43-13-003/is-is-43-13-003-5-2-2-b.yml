cite: 5.2.2(b)
title: 5.2.2(b)
text: 'b) quando os procedimentos específicos não estiverem descritos nos documentos de servi-

  ço do detentor do projeto de tipo do produto aeronáutico, listados em suas Especifica-

  ções Operativas ou Lista de Capacidade (vide subseções 5.4.c e 5.4.d desta IS), a OM

  pode requerer a certificação adicional na categoria “serviço especializado” do RBAC

  145 para a execução de END. Neste caso, somente uma pessoa autorizada pela OM co-

  mo profissional qualificado no Nível 3, no método, pode elaborar os procedimentos es-

  pecíficos para cada artigo. Os métodos autorizados de END e suas limitações ficam lis-

  tados em suas Especificações Operativas ou Lista de Capacidade. A aprovação para re-

  torno ao serviço é fornecido pela OM mediante a emissão de um formulário de libera-

  ção de manutenção (maintenance release) ou por meio de um Formulário ANAC F-

  100-01, conforme aplicável. A liberação para retorno ao voo é prerrogativa da empresa

  que opera a aeronave. (vide seção 121.709 do RBAC 121).'
