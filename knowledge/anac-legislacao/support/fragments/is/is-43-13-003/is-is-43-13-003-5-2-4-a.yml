title: 5.2.4(a)
text: 'a) Diretrizes de Aeronavegabilidade - DA: uma DA pode tornar mandatório um método

  de END por um procedimento específico descrito na própria DA, ou por um procedi-

  mento referenciando em um documentos de serviço. O texto de uma DA sempre sobre-

  puja as informações de efetividade e periodicidade de qualquer documento de serviço;'
