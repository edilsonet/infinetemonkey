cite: 5.2.4(b)
title: 5.2.4(b)
text: 'b) Procedimento Específico: um documento de serviço disponibilizado pelo detentor do

  projeto de tipo ou fabricante do artigo pode descrever detalhadamente cada método e/ou

  técnica, por artigo. Exemplo:

  - BOEING 737 NDT Manual, Part 6, Chapter 55-10-01, Eddy Current, Horizontal Sta-

  bilizer Upper Rear Spar Chords - Stab STA 68 to 164.

  Nota 1 - um método ou técnica diferente de um tornado mandatório pelo texto de uma

  DA ou do procedimento específico pode ser proposto para aprovação pela ANAC como

  Meio/Método Alternativo de Cumprimento - MAC, desde que elaborado por uma pes-

  soa autorizada pela OM como profissional qualificado no Nível 3, no método.

  Nota 2 - o Gestor Responsável da OM proponente do MAC somente pode autorizar a

  utilização do procedimento alternativo depois deste ter sido aprovado pela ANAC.'
