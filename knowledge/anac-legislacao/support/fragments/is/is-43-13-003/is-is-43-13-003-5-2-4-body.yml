title: Pessoas que desejam somente oferecer serviços de END na aviação civil, também denomi-
text: '5.2.4 Pessoas que desejam somente oferecer serviços de END na aviação civil, também
  denomi-

  nadas de prestadoras de serviço em END, para atender ao mercado das Operadoras e outras

  OM inclusive, devem requerer à ANAC a certificação como OM na categoria “serviço es-

  pecializado”, END, segundo o RBAC 145. Os métodos autorizados de END e suas limita-

  ções ficam listados em suas Especificações Operativas. A pessoa, agora certificada como

  OM, pode liberar para retorno ao serviço um produto aeronáutico mediante a emissão de27/09/2013
  IS Nº 43.13-003

  Revisão C

  um Formulário ANAC F-100-01. A liberação para retorno ao voo é prerrogativa da empre-

  sa que opera a aeronave. (vide seção 121.709 do RBAC 121).

  Nota 1 - serviços na sede e em outra localidade: OM certificada em serviços especializa-

  dos, END, que executa o serviço de END em sua sede, aprova o retorno ao serviço emitin-

  do um formulário ANAC F-100-01. OM certificada em serviços especializados, END, que

  executa o serviço de END em outra localidade (nos locais que seus clientes determinam)

  executa o serviço de END e preenche a Ordem de Engenharia - OE (ou documento simi-

  lar) ou Ficha de Inspeção assinando o campo “executante” do serviço e pode emitir um

  Formulário ANAC F-100-01; tal procedimento é aceitável pela ANAC e justifica-se na

  premissa que o serviço é executado em outra localidade e tem a mesma qualidade e segu-

  rança, da mesma forma que em sua sede.

  Nota 2 - os prestadores de serviço podem necessitar de habilidades e de conhecimentos

  adicionais nos produtos que pretendem inspecionar.

