cite: 5.2.4(c)
title: 5.2.4(c)
text: 'c) Procedimento Geral: um procedimento geral pode ser indicado pelo detentor do projeto

  de tipo ou fabricante. Em alguns documentos de serviço, poderá haver um procedimento

  especifico para um certo artigo. Há apenas a citação de procedimento geral que deve ser

  utilizado. Neste caso, somente um profissional qualificado no Nível 3 e autorizado no

  método pela OM pode elaborar o procedimento específico, e que deve ser desenvolvido

  para cada artigo, com base no procedimento geral. Exemplo:

  - GEAE Standard Practices Manual, 70-30-02, FPI.

  Nota - os procedimentos específicos devem ter aprovação do Gestor Responsável da

  OM que se propõe a utilizar do mesmo.'
