cite: 5.2.4(d)
title: 5.2.4(d)
text: 'd) Método e/ou Norma Geral, apenas. Em raros casos, os documentos de serviço apenas

  citam um método genérico (LP, PM, etc.) e/ou conforme uma norma geral. Somente um

  profissional qualificado no Nível 3 e autorizado no método pela OM pode elaborar o

  procedimento específico, e que deve ser desenvolvido para cada artigo, com base nas

  normas mencionadas ou nas aceitas pela ANAC. As normas aceitas pela ANAC para a

  elaboração de procedimentos específicos, estão referenciadas nas subseções 5.11 e 5.12

  desta IS.27/09/2013 IS Nº 43.13-003

  Revisão C

  5.5 Requisitos para pessoal'
