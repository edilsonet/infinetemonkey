text: 'h) Outros métodos (emergentes).

  Nota 1 - a AIA-NAS 410 abrange os métodos de a) até g). Outros métodos, também deno-

  minados de métodos emergentes (inovações ainda em desenvolvimento para a aviação),

  tais como Emissão Acústica, Radiografia com Nêutrons, Tomografia, Aniquilação de Pósi-

  tron por Indução por Fóton - PIPA, etc. podem ser agregados a esta lista se os detentores

  do projeto de tipo ou fabricantes dos produtos aeronáuticos incluírem esses métodos em

  documentos de serviço e a metodologia de qualificação e certificação for listada na AIA-

  NAS 410. O programa de treinamento da OM pode utilizar a metodologia recomendada

  pela AIA-NAS 410, independente de atualizações desta Lista.

  Nota 2 - a Magneto Optical Inspection - MOI é uma técnica inclusa no Ensaio por CP.

  Nota 3 - o método visual com ou sem auxílio de lentes de aumento (incluindo o boroscópi-

  co), inspeção de riscos em juntas sobrepostas de fuselagens (lap-joints) por microscopia

  óptica ou LASER, testes de vazamento, entre outros, não são objetos desta IS embora ne-

  cessitem de treinamento e qualificação adequado para seu apropriado desenvolvimento.

  Nota 4 - equipamento de remoção de mossas por CP não é um ensaios por CP e portanto,

  não é objeto desta IS.27/09/2013 IS Nº 43.13-003

  Revisão C

  5.4 Ordem de precedência e documentos de referência para END

  O desenvolvimento de END em artigos aeronáuticos geralmente segue as instruções de

  uma Diretriz de Aeronavegabilidade - DA, documentos de serviço (tal como um Service

  Bulletin - SB) disponibilizados pelos detentores do projeto de tipo ou fabricantes dos arti-

  gos, e/ou de outra documentação técnica específica (Normas). Como existem diversos do-

  cumentos para os ensaios, há uma ordem natural de precedência que a ANAC endossa, na

  sequência:'
