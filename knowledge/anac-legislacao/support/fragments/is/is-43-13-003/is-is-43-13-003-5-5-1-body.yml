text: '5.5.1 Geral: para a execução dos serviços de END, um profissional qualificado no Nível
  2 ou 3,

  no método, e autorizado pela OM (incluindo da OM certificada na categoria “serviços es-

  pecializados”, END) pode adicionalmente ser requerido a ser detentor de uma licença de

  mecânico de manutenção aeronáutica - MMA. Por exemplo, OM pertencentes a estado es-

  trangeiro e certificadas no exterior pela sua autoridade local podem declarar em seus ma-

  nuais que utilizam o sistema da ATA-SPEC-105 da Air Transport Association. Nesse sis-

  tema, tal disposição é mandatória. Para uma OM localizada no Brasil e certificada pela

  ANAC se declara em seus manuais que utiliza o sistema AIA-NAS-410 ou equivalente

  NBR, essa disposição não é requisito. Neste caso, o requisito do profissional qualificado
  no

  Nível 2 ou 3, no método, também ser MMA é opcional. Entretanto, a ANAC recomenda

  que as OM invistam na formação técnica de seus profissionais de END, promovendo a

  formação de mecânicos de manutenção, mesmo não sendo requisito da AIA-NAS-410,

  pois aumenta a segurança na aviação.'
