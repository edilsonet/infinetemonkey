title: 'Execução do serviço: o programa de treinamento sugerido na IS 145.163-001A, é um tu-'
text: '5.5.2 Execução do serviço: o programa de treinamento sugerido na IS 145.163-001A, é
  um tu-

  torial da AIA-NAS-410, leva em consideração vários fatores para uma OM autorizar (certi-

  ficar, na linguagem da AIA-NAS-410) um profissional qualificado no Nível 2 ou 3 a exe-

  cutar uma inspeção em seu nome, pois esclarece que a pessoa autorizada a executar um

  serviço de END em um artigo também deve “conhecer e estar familiarizada” com esse ar-

  tigo e não apenas com a inspeção em si, de forma que possa desempenhar adequadamente

  a atividade de inspeção. Esta orientação como critério para a autorização está em harmonia

  com os princípios do conhecimento requerido, experiência prática e, dos privilégios e limi-

  tações dos MMA, conforme estabelecido pelo RBHA 65 (ou RBAC que venha a substituí-

  lo).

  Nota - Conhecer e estar Familiarizado. Para que uma OM autorize um profissional quali-

  ficado no Nível 2 ou 3, no método, o mesmo deve, além de “conhecer e estar familiariza-

  do” com o método, provido pela qualificação, “conhecer e estar familiarizado” com o ar-

  tigo, para que possa desempenhar adequadamente a atividade para a qual foi designado

  (autorizado). A ANAC justifica que o processo de “autorização” da OM seja mais comple-

  to que o estabelecido como de “certificação” na AIA-NAS-410. No programa de treina-

  mento da OM, “conhecer e estar familiarizado” é em parte, cumprido com o OJT. O OJT

  é cumprido e duas fases: sob supervisão “contínua e direta” e sob supervisão “direta”. O

  programa OJT é um meio de ambientar a pessoa qualificada com os vários aspectos de

  END, no método. O treinamento OJT e o complementar recomendado na subseção 5.10 da

  ênfase nos artigos e com uma complexidade maior que uma pessoa simplesmente qualifi-

  cada geralmente não possui. Este procedimento aumenta a segurança na aviação civil.'
