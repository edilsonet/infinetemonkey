text: '5.5.3 A experiência, a maturidade e a intimidade necessária com o método e com os artigos
  con-

  duzem a ANAC a considerar que, levando em conta estes aspectos, apenas pessoas autori-

  zadas pela OM como profissional qualificado no Nível 2 ou 3, no método, podem satisfa-

  zer os requisitos para que sejam entendidos como Meio Alternativo de Cumprimento com

  o estabelecido no RBAC 43.3(b). Disso resulta que somente um profissional qualificado no

  Nível 2 ou 3, no método, autorizado pela OM, pode ser aceito como executante das tarefas

  em END, quando a tarefa envolve interpretar e decidir sobre critérios de aceitação/rejeição.27/09/2013
  IS Nº 43.13-003

  Revisão C

  Nota 1 - embora o termo “inspeção” seja regularmente utilizado pelo pessoal de END e

  em algumas OM, um profissional qualificado no Nível 2 ou 3 denominado “inspetor de

  END”, em tarefas double check (documentos de manutenção que contém os campos a se-

  rem assinados: “executante” e “inspetor”), esse profissional assina e/ou carimba somente

  o campo referente a “executante”.

  Nota 2 - embora o profissional qualificado no Nível 1 não seja considerado pela ANAC

  como pessoa aceitável para realizar ensaios em artigos à qual seja concomitante a analise

  e aplicação do critério de aceitação/rejeição, é aceitável que o mesmo execute operações

  simples ou opere alguns equipamentos que forneçam leitura automática, direta e conclusi-

  va, somente quando sob a direta orientação e supervisão de um profissional qualificado no

  Nível 2 ou 3. Citamos como exemplos:'
