title: 'Aprovação para retorno ao serviço - APRS: a seção 43.7 do RBAC 43, o parágrafo'
text: '5.5.4 Aprovação para retorno ao serviço - APRS: a seção 43.7 do RBAC 43, o parágrafo

  91.407(a) do RBHA 91, as seções 145.157 do RBAC 145, 121.379 do RBAC 121 e

  135.437 do RBAC 135 estabelecem que após a atividade de manutenção (que no contexto

  desta IS é a execução da inspeção por END), os registros de manutenção do artigo decla-

  rem que ele está aeronavegável, especificamente quanto ao serviço executado. Para esta fi-

  nalidade, e no âmbito desta IS, os requisitos estabelecem que a OM autorize um MMA (de-

  tentor de licença emitida pela ANAC), com habilitação apropriada, para aprovar para o re-

  torno ao serviço um artigo previamente inspecionado por um profissional qualificado no

  Nível 2 ou 3 da OM, ou subcontratado (prestador de serviço). A aprovação para retorno ao

  serviço é fornecida pela OM mediante a emissão de um formulário de liberação de manu-

  tenção (maintenance release) ou por meio de um Formulário ANAC F-100-01, conforme

  aplicável. A liberação para retorno ao voo é prerrogativa da empresa que opera a aeronave.

  (vide seção 121.709 do RBAC 121).

  Nota 1 - a APRS de um artigo, que não seja uma aeronave completa, é segundo o Formu-

  lário ANAC F-100-01 assinado pelo MMA da OM. A APRS de uma aeronave quanto ao

  serviço executado em uma OM é pelo maintenance release, assinado pelo MMA da OM. A27/09/2013
  IS Nº 43.13-003

  Revisão C

  APRS de uma aeronave de um operador regido pelo RBHA 91 é pelo piloto ou proprietá-

  rio da aeronave. Já a APRS de uma aeronave de empresas regidas pelos RBAC 121 e 135

  que obteve um maintenance release de uma OM é pela Liberação para Retorno ao Vôo,

  somente assinada por um MMA autorizado pela empresa.

  Nota 2 - para efeitos de uma adequada supervisão dos serviços executados por um

  profissional qualificado no Nível 2 ou 3, a ANAC recomenda que o MMA que aprova um

  artigo para retorno ao serviço seja no mínimo treinado no Nível 1, no método em que o

  artigo foi inspecionado. Neste caso, o MMA não necessita estar qualificado, mas ter

  frequentado com sucesso um treinamento (curso) voltado para qualificação no Nível 1, no

  método. Essa disposição aumenta a segurança da aviação civil e demonstra que a OM

  investe em seu pessoal.'
