title: 'Pessoal mínimo requerido para execução de END: é importante observar que cada mo-'
text: '5.5.5 Pessoal mínimo requerido para execução de END: é importante observar que cada
  mo-

  dalidade de END requer pessoas com autorizações dedicadas pela OM; portanto, a ANAC

  recomenda à OM que deseja executar END que possua um número conveniente de pessoas

  para a execução dos serviços e, de responsáveis para aprovar para retorno ao serviço

  (APRS) um artigo inspecionado. Se a OM desenvolve procedimentos específicos como

  previsto nas subseções 5.2.2(b) e 5.4.(c) e (d) desta IS, deve ter à disposição pelo menos

  um profissional qualificado no Nível 3 no(s) método(s), inclusive para fornecer ou supervi-

  sionar o programa de qualificação e autorização da OM (certificação na AIA-NAS-410),

  seja este ministrado internamente ou externamente.

  5.6 Detentores de certificado que desenvolvem o método radiográfico'
