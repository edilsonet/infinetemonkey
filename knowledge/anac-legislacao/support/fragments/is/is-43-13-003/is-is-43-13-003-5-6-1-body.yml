title: A ANAC recomenda que uma OM que deseja desenvolver END no método Radiográfico
text: '5.6.1 A ANAC recomenda que uma OM que deseja desenvolver END no método Radiográfico

  deva verificar os requisitos adicionais junto à CNEN, órgão governamental que regula os

  aspectos de radioproteção industrial. A certificação das pessoas em radioproteção é prerro-

  gativa da CNEN.'
