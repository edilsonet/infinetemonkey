title: 'O MOM deve apresentar informações referentes, dentre outras: a normas utilizadas para'
text: '5.7.2 O MOM deve apresentar informações referentes, dentre outras: a normas utilizadas
  para

  cada tipo de ensaio, procedimentos gerais e específicos, relatórios e/ou laudos técnicos
  uti-

  lizados para registrar a execução e a aprovação para o retorno ao serviço de produto aero-

  náutico, controle periódico (calibração) dos equipamentos e materiais utilizados, etc. A

  ANAC recomenda que o MOM não inclua os textos das normas de ensaio utilizados, nem

  dos procedimentos gerais e específicos, mas apenas citar a sua localização, que em geral

  estão em um manual de procedimentos, manual esse que não é necessário ser submetido à

  aceitação pela ANAC.'
