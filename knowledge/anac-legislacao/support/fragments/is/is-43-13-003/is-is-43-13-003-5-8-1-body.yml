title: Uma OM pode realizar serviços de END em outra localidade (vide seção 145.203 do
text: '5.8.1 Uma OM pode realizar serviços de END em outra localidade (vide seção 145.203
  do

  RBAC 145). A autorização pela ANAC para execução dos serviços em outra localidade é

  concedida em a) caráter excepcional e temporário, ou b) recorrente. Para o caráter excepci-

  onal e temporário, a ANAC tem concedido uma autorização de até 6 (seis) meses, válida

  no período de um ano. A OM que presta serviços em outra localidade deve ter os proce-

  dimentos em seus manuais aceitos pela ANAC. O MOM deve conter uma declaração que

  esses serviços são executados com a mesma qualidade que os executados nas instalações

  da OM, além de relacionar quais os métodos, equipamentos (próprio cliente e/ou do seu

  ativo fixo), controle dos equipamentos que requerem calibração, e procedimentos de deslo-

  camentos de pessoal, equipamentos e ferramentas.'
