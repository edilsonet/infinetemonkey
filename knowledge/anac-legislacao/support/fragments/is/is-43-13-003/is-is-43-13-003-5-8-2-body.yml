title: Caso a OM certificada em END possua a seção “manutenção em outra localidade” em seu
text: '5.8.2 Caso a OM certificada em END possua a seção “manutenção em outra localidade”
  em seu

  manual aceito pela ANAC, ela executa o serviço e comunica a ANAC de acordo como dis-

  posto na seção 145.221-I do RBAC 145. Caso não possua esta seção, pois não havia consi-

  derada essa possibilidade, deve requerer autorização à ANAC cada vez que for requisitada

  para a prestação de serviço em outra localidade.'
