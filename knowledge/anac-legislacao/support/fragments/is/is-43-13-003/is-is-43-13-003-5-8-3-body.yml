text: '5.8.3 Os serviços fornecidos por muitos prestadores de serviço (OM certificada em serviços
  es-

  pecializados, END) são de atendimento a aeronaves de clientes e, em vários locais. A

  ANAC considera aceitável o serviço em outra localidade de forma regular (recorrente),

  desde que não caracterize apenas um local como privilegiado. A APRS é fornecida pela

  OM mediante a emissão de um formulário de liberação de manutenção (maintenance rele-

  ase) ou por meio de um Formulário ANAC F-100-01, conforme aplicável. A liberação para

  retorno ao voo é prerrogativa da empresa que opera a aeronave. (vide seção 121.709 do

  RBAC 121).

  5.9 Contratação de serviços de END'
