cite: 5.9.1
title: Uma pessoa que contrata um serviço de END de uma OM deve verificar se essa OM com-
text: '5.9.1 Uma pessoa que contrata um serviço de END de uma OM deve verificar se essa OM
  com-

  prova que o profissional qualificado no Nível 2 ou 3, que pretende inspecionar, conhece
  e

  está familiarizado com o seu artigo a ser inspecionado. Se aplicável, deve verificar se
  a

  pessoa demonstra conhecer, estar familiarizada e sabe operar equipamentos e materiais que

  ela fornece ao contratado. Caso esta pessoa não conheça e não esteja familiarizada com o

  produto, equipamentos e materiais em questão, o contratante pode providenciar o treina-

  mento específico para esta finalidade, incluindo o OJT, o que aumenta a segurança da ins-

  peção por END.'
