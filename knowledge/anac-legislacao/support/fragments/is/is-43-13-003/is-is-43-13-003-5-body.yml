text: '5. DESENVOLVIMENTO DO ASSUNTO

  5.1 Qualificação e Certificação em END

  Somente pessoas qualificadas e autorizadas (certificadas na linguagem da AIA-NAS-410)

  em END (NDT, NDI, NDE) podem realizar estas atividades (normalmente inspeções) de

  forma aceitável pela ANAC. As pessoas que desempenham esta atividade devem conhecer,

  estarem familiarizadas com as aplicações e as limitações dos vários métodos de END utili-

  zados para localizar defeitos em artigos aeronáuticos, e podem estar em conformidade com

  a IS 145.163-001 - Qualificação e Autorização em Ensaios Não Destrutivos na Manuten-

  ção de Produto Aeronáutico.

  Nota 1 - as expressões “no método” e “por método”, utilizadas nesta IS ressaltam que

  uma pessoa somente pode exercer as prerrogativas e limitações no método em que foi

  qualificada e autorizada. Uma pessoa qualificada e autorizada em, por exemplo, LP, não

  pode exercer prerrogativas e limitações nos outros métodos, a menos que seja qualificada

  e autorizada pela OM nesses outros métodos. Não é admitida equivalência de qualificação

  entre os métodos, a não ser entre as várias técnicas de um mesmo método.

  Nota 2 - existem técnicas dentro de um método que necessitam treinamento complementar

  ou especial. Por exemplo, os detentores do projeto de tipo ou fabricantes dos artigos mui-

  tas vezes fornecem kits específicos para certas inspeções determinadas em seus documen-

  tos de serviço, inclusive oferecendo um treinamento especificamente dirigido para essas

  técnicas. A ANAC recomenda fortemente que, nesses casos especiais, a OM envie os pro-

  fissionais qualificados e adequadamente autorizados (profissional qualificado no Nível 2

  e/ou 3) para esse tipo de treinamento.27/09/2013 IS Nº 43.13-003

  Revisão C

