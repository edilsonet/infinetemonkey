text: '1. FUSELAGEM:

  1.a - As cavernas das estações 185.5 a 199.0 foram desamassadas e inspecionadas. Vide fig.

  30, itens 2 e 3.

  1. b - Dois reforçadores longitudinais do cone de cauda do lado esquerdo foram substituídos.

  Vide fig. 30, itens 26 e 28.

  1. c - Os revestimentos laterais inferiores traseiros e dianteiros do cone de cauda foram
  substituí

  dos. Vide fig. 30, itens 48 e 50.'
