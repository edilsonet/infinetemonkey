text: '2. EMPENAGEM:

  2.a - A nervura mais baixa da deriva (fig.13A, item 16) foi recuperada com um reforço, conforme

  fig. 801.

  2.b - A longarina traseira da deriva foi substituída. Vide fig.13A, item 8.

  2.c - A nervura central da deriva, fig. 13A, item 5, foi recuperada com reforço, conforme
  croqui

  fig. 801 (Folha 1 de 2)

  2.d - O revestimento da deriva, fig. 13A, item 34, foi reparado conforme croqui fig. 801
  (Folha 5)

  2.e - Todo conjunto do leme foi substituído. Vide fig. 12A.'
