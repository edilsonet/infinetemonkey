text: '3. ASAS:

  3.1 - ASA ESQUERDA:

  3.1.a - As nervuras das estações 100.0 e 190.0 foram substituídas. Vide fig.2, itens 27
  e

  33.

  3.1.b - As nervuras das estações 118.0, 136.0, 154.0 e 172.0 foram desamassadas e

  posteriormente inspecionadas. Nada de anormal foi encontrado. Vide fig.2, itens

  28, 30, 31 e 32.

  2Data de emissão: 16/10/2020

  IS nº 43.13-004

  Revisão C

  RELATÓRIO DOS SERVIÇOS EXECUTADOS NA AERONAVE CESSNA 182M,

  Nº DE SÉRIE 18260000, MATRÍCULA PP-CEU

  (continuação)

  3.1.c - A longarina frontal (fig. 4, item 22) foi recuperada com reforço próximo à

  estação 120.0. Vide fig. 801 (Folha 2)

  3.1.d - Substituída a janela de retenção e o farol. Vide fig.1A itens 22 e 28.

  3.1.e - O bordo de ataque da estação 100.5 a 190.0 foi totalmente substituído. Vide

  fig. 3A, item 9.

  3.1.f - O revestimento superior da estação 100.5 a 190.0 foi desenrugado e os

  reforçadores (fig. 5, itens 5, 6 e 7) sofreram reparos conforme fig. 801 (Folha 1)

  3.2 - ASA DIREITA

  Nada a reparar.'
