text: '4. CAIXAS DE TRANSMISSÃO :

  A - Nomenclaturas / Part Numbers / números de série / horas totais / horas após revisão

  III - DESCRIÇÃO DAS AVARIAS - AERONAVES DE ASAS FIXAS

  Descrever para cada uma das partes ou componentes listados abaixo da Célula, do Grupo

  Motopropulsor e dos Sistemas, o tipo da avaria, sua extensão e sua localização. Essa lista
  é

  apenas um exemplo. Ela deve relacionar todos os elementos que sofreram avarias no

  acidente/incidente.

  A - ESTRUTURA

  A.1 - Fuselagem

  A.2 - Asa esquerda

  A.3 - Asa direita

  A.4 - Estabilizados vertical ( ou deriva)

  A.5 - Estabilizador horizontal

  A.6 - Ailerons

  A.7 - Flapes

  A.8 - Leme

  A.9 - Profundores

  A.10 - Carenagens.

  B - TREM DE POUSO

  B.1 - Trem de pouso principal esquerdo

  B.2 - Trem de pouso principal direito

  B.3 - Trem de pouso auxiliar.

  C - GRUPO MOTOPROPULSOR

  C.1 - Motores

  C.2 - Berço dos motores

  C.3 - Hélices

  C.4 - Outros (componentes, acessórios e partes do grupo motopropulsor)

  D - SISTEMAS

  D.1 - Sistema hidráulico

  D.2 - Sistema elétrico

  D.3 - Sistema de pressurização e ar condicionado

  D.4 - Sistema de proteção a chuva e gelo

  D.5 - Instrumentos

  D.6 - Outros ( sistemas de combustível, comandos de voo, pneumático, etc.).Data de emissão:
  16/10/2020

  IS nº 43.13-004

  Revisão C

