title: Visando adequada investigação e/ou processo de reparo, a ANAC suspenderá, pelo código
text: '5.2.2 Visando adequada investigação e/ou processo de reparo, a ANAC suspenderá, pelo
  código

  1, o Certificado de Aeronavegabilidade das aeronaves em cuja investigação o CENIPA

  tenha informado interesse ou que tenham sofrido avarias de grande monta em

  consequência de acidente, incidente aeronáutico ou ocorrência de solo, sendo da

  responsabilidade do seu proprietário / operador não permitir o voo nessa situação.'
