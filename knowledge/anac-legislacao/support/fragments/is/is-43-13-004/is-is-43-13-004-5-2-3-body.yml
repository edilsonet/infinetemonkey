text: '5.2.3 A aeronavegabilidade será definitivamente invalidada e a matrícula no Registro

  Aeronáutico Brasileiro será cancelada no caso de acidente / incidente / ocorrência em que
  a

  aeronave seja considerada irreparável, conforme estabelecido nos parágrafos 5.8.1 e 5.8.2

  desta IS.'
