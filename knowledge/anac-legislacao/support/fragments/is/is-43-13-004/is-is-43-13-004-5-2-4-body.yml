title: O retorno ao voo de uma aeronave reparada após acidente / incidente / ocorrência em
text: '5.2.4 O retorno ao voo de uma aeronave reparada após acidente / incidente / ocorrência
  em

  desacordo com os dispositivos desta IS implicará, conforme estabelece o Código Brasileiro

  de Aeronáutica, em suspensão ou cassação do certificado para a empresa certificada, e em

  multa, suspensão ou cassação de certificados (o que for aplicável) para operadores,

  proprietários de aeronaves, pilotos e mecânicos.

  5.3 Transporte ou translado'
