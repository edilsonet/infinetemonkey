text: '5.3.1 Somente após terem sido cumpridas todas as exigências legais aplicáveis, relativas
  ao

  SIPAER e constante das NSCA 3-13 (Protocolos De Investigação De Ocorrências

  Aeronáuticas Da Aviação Civil Conduzidas Pelo Estado Brasileiro), as aeronaves

  avariadas em acidente/incidente/ocorrência poderão ser transportadas ou transladadas.'
