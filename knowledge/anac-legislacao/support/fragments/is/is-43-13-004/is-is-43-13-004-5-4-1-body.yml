text: '5.4.1 Nenhuma empresa certificada poderá iniciar os reparos em uma aeronave avariada
  em

  acidente/incidente aeronáutico ou ocorrência de solo conforme o item 5.2.2 sem que a

  aeronave esteja liberada pelo Órgão responsável pela investigação do acidente (CENIPA).Data
  de emissão: 16/10/2020

  IS nº 43.13-004

  Revisão C'
