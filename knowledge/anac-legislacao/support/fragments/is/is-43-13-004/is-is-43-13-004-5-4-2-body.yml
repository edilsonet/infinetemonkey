title: Caso a comunicação de acidente prevista no parágrafo 5.3.1 desta IS não tenha sido
  feita, e
text: '5.4.2 Caso a comunicação de acidente prevista no parágrafo 5.3.1 desta IS não tenha
  sido feita, e

  for constatado posteriormente que a aeronave sofreu acidente / incidente aeronáutico, a

  ANAC suspenderá imediatamente o Certificado de Aeronavegabilidade da aeronave, e

  comunicará o fato ao CENIPA, para as providências cabíveis em relação ao protocolo de

  investigação. Neste caso, a regularização do CA da aeronave ficará condicionada ao

  recebimento de todas as informações do CENIPA sobre o ocorrido (classificação do

  acidente / incidente, danos, pessoas envolvidas, etc.) e ainda de uma avaliação da ANAC,

  se a aeronave deverá sofrer uma Vistoria Técnica Especial, para verificação de

  aeronavegabilidade.'
