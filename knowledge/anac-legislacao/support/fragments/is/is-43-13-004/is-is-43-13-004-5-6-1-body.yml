title: Se o nível das avarias sofridas pela aeronave for tal que todos os trabalhos a serem
text: '5.6.1 Se o nível das avarias sofridas pela aeronave for tal que todos os trabalhos
  a serem

  executados sejam pequenos reparos previstos em publicações técnicas do fabricante da

  aeronave ou em documentos aprovados pelas autoridades aeronáuticas brasileiras ou do

  país de origem da aeronave, a empresa certificada poderá executar os serviços e terá

  competência para liberar a aeronave para retorno ao voo.'
