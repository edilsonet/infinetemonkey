title: Se o nível das avarias da aeronave for tal que envolva a execução de grandes reparos,
  a
text: '5.6.2 Se o nível das avarias da aeronave for tal que envolva a execução de grandes
  reparos, a

  empresa certificada poderá executar os serviços e terá competência para liberar a aeronave

  para retorno ao voo, desde que os grandes reparos sejam executados de acordo com dados

  técnicos considerados aceitáveis pela ANAC. São considerados procedimentos aceitáveis

  pela empresa certificada a utilização de dados técnicos para reparos aqueles que estejam

  detalhadamente descritos em: - publicações técnicas específicas para o tipo da aeronave
  em

  questão, emitidas pelo fabricante (ex.: Manual de Reparos Estruturais; Manual de

  Manutenção. Etc.) ou documentos interpretativos de requisitos emitidos pelas autoridades

  aeronáuticas reconhecidas pela ANAC (ex..: ACs; Policies; etc); ou ainda documentos

  específicos aceitáveis pela ANAC.'
