title: O desenvolvimento de dados técnicos (projeto e desenhos) para grandes reparos, visando
text: '5.6.3 O desenvolvimento de dados técnicos (projeto e desenhos) para grandes reparos,
  visando

  sua aprovação, é da responsabilidade de engenheiro com atribuições definidas em

  resolução do CONFEA, e que tenha registrado em seus assentamentos no CREA atribuição

  para exercer a atividade de projeto e especificação de reparos em aeronaves, ou

  equivalente;'
