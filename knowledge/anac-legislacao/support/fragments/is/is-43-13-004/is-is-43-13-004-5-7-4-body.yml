title: As empresas concessionárias do Transporte Aéreo Regular, que possuírem todas as
text: '5.7.4 As empresas concessionárias do Transporte Aéreo Regular, que possuírem todas
  as

  informações solicitadas no parágrafo 5.7.1 desta IS permanentemente disponíveis no

  controle de manutenção, estarão dispensadas da elaboração do relatório de reparos para as

  aeronaves pertencentes à sua frota.'
