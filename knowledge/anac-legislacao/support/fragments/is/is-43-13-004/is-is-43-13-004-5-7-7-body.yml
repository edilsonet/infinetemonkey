title: A retirada de uma aeronave de uma oficina certificada sem que o processo de reparo
  esteja
text: '5.7.7 A retirada de uma aeronave de uma oficina certificada sem que o processo de reparo
  esteja

  concluído deverá ser comunicada pelo proprietário/operador à ANAC. O transporte ou

  translado da aeronave, conforme o caso, deverá ser processado de acordo com a subseção

  5.3 desta IS.'
