title: No caso dos reparos em uma aeronave serem executados por mais de uma empresa
text: '5.7.8 No caso dos reparos em uma aeronave serem executados por mais de uma empresa

  certificada, aquela responsável para liberação da aeronave para retorno ao serviço deverá

  fazer a coleta, análise e arquivo de todas as informações, documentos técnicos e registros

  de reparos necessários à confecção dos relatórios de reparo.

  5.8 Aeronaves irreparáveis'
