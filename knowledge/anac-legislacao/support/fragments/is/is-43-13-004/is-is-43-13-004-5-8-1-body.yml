title: A ANAC só expedirá laudo técnico atestando a irreparabilidade de aeronave acidentada
text: '5.8.1 A ANAC só expedirá laudo técnico atestando a irreparabilidade de aeronave acidentada

  com base em laudo técnico emitido por empresa certificada ou profissional competente

  conforme o item 5.6.3 após análise do relatório de acidente, se aplicável, e, sempre que

  possível, após a vistoria de aeronave.'
