title: 'GRUPO MOTO-PROPULSOR:'
text: '5. GRUPO MOTO-PROPULSOR:

  5.1 - MOTOR CONTINENTAL 0-470-R, Nº DE SÉRIE 10000:

  Foi efetuada revisão geral conforme laudo anexo.

  5.2 - BERÇO DO MOTOR:

  Foi recuperado, tendo sido soldada uma luva de reforço. Foi feito teste de Magnaflux

  conforme laudo anexo.

  3Data de emissão: 16/10/2020

  IS nº 43.13-004

  Revisão C

  RELATÓRIO DOS SERVIÇOS EXECUTADOS NA AERONAVE CESSNA 182M,

  Nº DE SÉRIE 18260000, MATRÍCULA PP-CEU

  (continuação)

  5.3 - HÉLICE Mc CAULEY 2 A34C66 / 90AT-8:

  Foi efetuada revisão conforme laudo anexo.

  6 - TESTE FINAL

  Foi testado o funcionamento do motor, dos flaps e dos comandos de voo. Todas as

  demais partes e sistemas da aeronave que não foram afetadas pelo acidente, e aqui não

  mencionadas foram inspecionadas, nada sendo encontrado de anormal.

  Foi efetuado teste em voo. Foram verificados o funcionamento do motor, dos comandos do

  voo e demais sistemas, tendo a aeronave se comportado normalmente, dentro das

  características do manual.

  C O N C L U S Ã O

  Atestamos que a aeronave PP-CEU, acidentada em 28/Fev/88, e acumulando nesta

  data 3905 horas totais, foi inspecionada reparada e considerada em perfeitas condições de

  aeronavegabilidade ao final do processo de recuperação a que foi submetida nesta empresa

  com total observância às normas e legislação aeronáutica em vigor.

  São Gonçalo, 18 Jul 2008

  Inspetor (Designado para APRS): Responsável Técnico

  _________________________ ___________________________

  José da Silva José Aparecido

