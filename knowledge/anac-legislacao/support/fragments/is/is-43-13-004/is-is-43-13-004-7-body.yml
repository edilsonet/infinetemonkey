text: '7. DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela ANAC

  7.2 Nesta edição (revisão C) da IS 43.13-004, não é necessário que se revise a documentação

  de entidades reguladas pela ANAC (por exemplo, manuais, formulários, etiquetas, etc.). O'
