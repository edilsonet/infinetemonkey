title: OBJETIVO
text: '1. OBJETIVO

  Esta Instrução Suplementar tem como objetivo esclarecer métodos, recomendações e crité-

  rios mínimos para a demonstração de equivalência de ferramentas, equipamentos ou apare-

  lhos de teste especiais recomendados pelo detentor do projeto de tipo ou o fabricante de

  um produto aeronáutico e, outros, projetados e fabricados como equivalentes.

  Nota - para efeitos desta IS, ferramentas, equipamentos ou aparelhos de teste são sim-

  plesmente referidos como ferramentas.'
