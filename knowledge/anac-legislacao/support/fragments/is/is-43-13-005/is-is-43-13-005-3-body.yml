text: '3. FUNDAMENTOS

  3.1 O parágrafo 21.50(b) do RBAC 21 estabelece que o detentor de um certificado de tipo
  ou

  um certificado suplementar de tipo de uma aeronave, motor ou hélice, cujo requerimento

  para a obtenção tenha sido submetido após 28 de janeiro de 1981, deve fornecer pelo me-

  nos um conjunto completo das instruções para aeronavegabilidade continuada, para o pro-

  prietário de cada aeronave, cada motor ou cada hélice quando de sua entrega ou quando da

  emissão do primeiro certificado de aeronavegabilidade padrão para a aeronave envolvida,
  o

  que ocorrer depois. As instruções devem ser preparadas de acordo com as seções 23.1529

  do RBAC 23, 25.1529 e 25.1729 do RBAC 25, 27.1529 do RBAC 27, 29.1529 do RBAC

  29, 31.82 do RBHA 31, ou dispositivo correspondente do RBAC que venha a substituí-lo,

  33.4 do RBAC 33, 35.4 do RBAC 35, com o RBAC 26, ou como especificado pelos crité-

  rios de aeronavegabilidade aplicáveis, estabelecidos pelo RBAC 21.17(b), como aplicável.

  Depois disto, o detentor de um certificado de tipo ou certificado suplementar de tipo deve

  colocar tais instruções à disposição de qualquer pessoa a quem os RBAC requeiram o

  cumprimento de qualquer condição de tais instruções. Adicionalmente, modificações em

  instruções para aeronavegabilidade continuada devem ser colocadas à disposição de qual-

  quer pessoa a quem os RBAC requeiram o cumprimento de qualquer uma de tais instru-

  ções.

  3.2 O parágrafo 43.13(a) do RBAC 43 estabelece que cada pessoa que estiver executando ma-

  nutenção, manutenção preventiva e alteração em um artigo, deve usar métodos, técnicas e

  práticas estabelecidas na última revisão do manual de manutenção do fabricante, ou nas

  instruções para aeronavegabilidade continuada preparadas pelo fabricante ou outros méto-

  dos, técnicas e práticas aceitáveis pela ANAC, exceto como previsto na seção 43.16. A

  pessoa deve usar as ferramentas, equipamentos e aparelhos de teste necessários para asse-27/08/2013
  IS Nº 43.13-005

  Revisão A

  gurar a execução do trabalho de acordo com práticas industriais de aceitação geral. Se o

  fabricante envolvido recomendar equipamentos e aparelhos de teste especiais, a pessoa de-

  ve usar tais equipamentos e aparelhos ou equivalentes aceitos pela ANAC.

  3.3 O parágrafo 145.109(a) do RBAC 145 estabelece que cada organização de manutenção

  certificada deve ter equipamentos, ferramentas e materiais necessários para a execução da

  manutenção, manutenção preventiva ou alteração em conformidade com seu certificado,

  especificações operativas e com o RBAC 43, exceto se determinado de outra forma pela

  ANAC. Os equipamentos, ferramentas e materiais devem estar localizados nas instalações

  e sob o controle da organização de manutenção quando o serviço estiver sendo executado.

  3.4 O parágrafo 145.109(a)-I do RBAC 145 estabelece que cada organização de manutenção

  certificada deve possuir uma listagem do ferramental de sua propriedade. Quando o ferra-

  mental utilizado for de terceiros, a organização deve possuir um contrato ou outro disposi-

  tivo legal que autorize o uso, o qual deve ser mantido disponível para a ANAC por pelo

  menos 5 (cinco) anos, desde a sua última utilização.

  3.5 O parágrafo 145.109(c) do RBAC 145 estabelece que os equipamentos, ferramentas e ma-

  teriais devem ser aqueles recomendados pelo fabricante do artigo, ou outros cuja equiva-

  lência tenha sido demonstrada de acordo com um procedimento descrito no manual da or-

  ganização de manutenção.'
