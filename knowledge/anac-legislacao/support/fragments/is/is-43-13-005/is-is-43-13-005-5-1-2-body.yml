title: Cada pessoa requerida a executar essas tarefas deve usar ferramentas especiais (incluindo
text: '5.1.2 Cada pessoa requerida a executar essas tarefas deve usar ferramentas especiais
  (incluindo

  as opcionais) recomendadas pelo detentor do projeto de tipo ou o fabricante de um produto

  aeronáutico, ou suas equivalentes. As ferramentas especiais recomendadas estão listadas
  na

  documentação de serviço do artigo.'
