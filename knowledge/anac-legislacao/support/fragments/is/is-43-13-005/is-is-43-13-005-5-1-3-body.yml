title: Nos casos em que o detentor do projeto de tipo ou o fabricante de um produto aeronáutico
text: '5.1.3 Nos casos em que o detentor do projeto de tipo ou o fabricante de um produto
  aeronáutico

  disponibiliza todos os dados técnicos indispensáveis para a sua fabricação, uma ferramenta

  especial pode ser fabricada por uma pessoa. Esses dados técnicos geralmente compreen-

  dem: desenhos em escala com especificações de materiais, cotas, tratamento térmico e ou-

  tros beneficiamentos, especificação de acabamento, etc. Por exemplo: blocos de referência

  para Ensaios Não Destrutivos - END.

  Nota - as ferramentas fabricadas de acordo com os dados técnicos acima descritos podem

  ser identificadas com o P/N disponibilizado pelo detentor do projeto de tipo ou o fabrican-

  te de um produto aeronáutico, e são consideradas idênticas às ferramentas especiais ori-

  ginais. As ferramentas, se fabricadas em lote, podem ser identificadas por Serial Number

  - S/N.'
