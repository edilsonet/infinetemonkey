title: Cada ferramenta especial, fabricada conforme instruções do detentor do projeto de tipo
  ou
text: '5.1.4 Cada ferramenta especial, fabricada conforme instruções do detentor do projeto
  de tipo ou

  do fabricante do produto aeronáutico, necessita da declaração de conformidade (formulário

  ANAC F-900-77) assinada por Responsável Técnico da OM. O formulário ANAC F-900-

  77 deve ser conclusivo em determinar que a ferramenta especial foi fabricada de acordo

  com as instruções do detentor do projeto de tipo ou o fabricante de um produto aeronáuti-

  co. Os desenhos e dados técnicos utilizados na fabricação da ferramenta especial devem ser

  juntados a esta declaração de conformidade.

  5.2 Ferramentas especiais equivalentes'
