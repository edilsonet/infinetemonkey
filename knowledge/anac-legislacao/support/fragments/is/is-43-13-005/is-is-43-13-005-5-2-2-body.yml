title: A ferramenta especial equivalente deve ser capaz de realizar todas as funções requeridas
text: '5.2.2 A ferramenta especial equivalente deve ser capaz de realizar todas as funções
  requeridas

  (ajustes, regulagens, testes, e avaliar todos os parâmetros solicitados pelo documento de

  serviço associado) com precisão igual ou superior a da ferramenta especial recomendada,

  em todas as faixas de medição ou função requerida.27/08/2013 IS Nº 43.13-005

  Revisão A'
