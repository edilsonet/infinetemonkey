title: Nos casos em que a OM pretende demonstrar que um procedimento substitui a necessidade
text: '5.2.3 Nos casos em que a OM pretende demonstrar que um procedimento substitui a necessidade

  de utilização de uma certa ferramenta especial requerida nos dados técnicos, deve-se evi-

  denciar a garantia da execução da tarefa, em toda sua extensão, com precisão igual ou su-

  perior a especificada originalmente. E neste sentido, pode não ser aplicável a casos com-

  plexos onde a demonstração da equivalência não for evidente e de fácil comprovação.'
