title: Para cada ferramenta equivalente, a OM certificada de acordo com o RBAC 145 deve de-
text: '5.2.4 Para cada ferramenta equivalente, a OM certificada de acordo com o RBAC 145 deve
  de-

  monstrar a equivalência com a ferramenta especial recomendada nos dados técnicos origi-

  nais, conforme requer o RBAC 43.13, através de um formulário ANAC 900-77, e que con-

  tenha a demonstração técnica de sua equivalência, assinada pelo RT da OM.

  Nota - caso a ferramenta especial equivalente seja adquirida com um formulário ANAC

  que já tenham demonstrado a equivalência de modo aceitável pela ANAC, ainda assim, a

  OM precisará convalidar esses dados para declarar sua conformidade.'
