title: A demonstração da equivalência pelo formulário ANAC 900-77 pode requerer projeto,
text: '5.2.6 A demonstração da equivalência pelo formulário ANAC 900-77 pode requerer projeto,

  medições e verificações técnicas além da declaração de conformidade, e deve ser elaborada

  por pessoa com qualificação apropriada e conhecimentos técnicos no artigo a ser mantido,

  que deve também assinar a documentação que atesta a conformidade.'
