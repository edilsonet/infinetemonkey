text: 'a) por comparação de dados técnicos: quando a equivalência é estabelecida comparando

  a especificação descrita na documentação da ferramenta original com as especifica-

  ções técnicas da ferramenta equivalente utilizada pela OM. Neste caso os dados técni-

  cos da ferramenta original disponíveis precisam ser completos o suficiente para garan-

  tir a demonstração;'
