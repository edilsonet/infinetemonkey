section_title: 'As situações aceitáveis pela ANAC para demonstração de equivalência incluem:'
subsection_id: c
cite: 5.2.8(c)
title: 5.2.8(c)
text: 'c) por relatório de engenharia reversa: quando apenas parte ou nenhum dado técnico
  da

  ferramenta especial recomendada estiver disponível, incluindo os casos em que for

  possível obter-se um exemplar da ferramenta especial recomendada. A demonstração

  da equivalência pode ser possível através da comparação com os dados extraídos de

  medições da ferramenta original. Desde que seja possível realizar essas medições que

  gerem dados técnicos confiáveis, e que expressem as dimensões e propriedades da fer-

  ramenta, e que não haja restrições legais a esta cópia;'
