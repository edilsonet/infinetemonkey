section_title: 'As situações aceitáveis pela ANAC para demonstração de equivalência incluem:'
subsection_id: f
cite: 5.2.8(f)
title: 5.2.8(f)
text: 'f) por declaração do fabricante do artigo: quando uma pessoa fabrica a ferramenta espe-

  cial equivalente e obtém uma declaração do detentor do projeto de tipo ou do fabrican-

  te de um produto aeronáutico. Essa declaração pode ser expressa por um Non Techni-

  cal Objection - NTO, ou similar. Neste caso, o formulário ANAC F-900-77 deve ane-

  xar a declaração fornecida pelo detentor do projeto de tipo ou o fabricante de um pro-

  duto aeronáutico.

  5.3 Identificação de uma ferramenta especial equivalente'
