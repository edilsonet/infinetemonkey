title: As ferramentas especiais equivalentes devem ser identificadas por P/N próprio da pessoa
text: '5.3.1 As ferramentas especiais equivalentes devem ser identificadas por P/N próprio
  da pessoa

  que a fabrica e esta informação deve constar no formulário ANAC F-900-77. O P/N de

  uma ferramenta especial equivalente pode ser semelhante ao da original, mas deve possuir

  elementos gráficos ou alfanuméricos que claramente identifique-o como uma ferramenta

  equivalente. Por exemplo:

  - ferramenta especial recomendada P/N 654.

  - ferramenta especial equivalente P/N 654*(sigla ou nome da empresa).'
