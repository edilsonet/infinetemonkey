text: '5.3.3 A identificação da ferramenta especial equivalente deve ser permanente. Caso
  não seja

  possível, esta deve ser feita da forma mais clara e direta possível de maneira a evitar
  o ex-

  travio de suas partes ou troca da ferramenta por outra diferente da estabelecida na sua
  do-

  cumentação de equivalência.

  5.4 Documentação de Equivalência'
