text: '7. DISPOSIÇÕES FINAIS

  7.1 Os casos omissos serão dirimidos pela ANAC.

  7.2 Para as empresas que ainda não estiverem adequadas as novas instruções dessa IS, haverá

  um prazo de até 180 dias para total adequação, a contar da data de sua publicação.27/08/2013
  IS Nº 43.13-005

  Revisão A'
