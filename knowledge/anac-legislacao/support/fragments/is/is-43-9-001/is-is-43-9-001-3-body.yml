title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 O RBAC 43.5(b) estabelece que nenhuma pessoa poderá aprovar o retorno ao serviço de

  qualquer artigo aeronáutico que tenha sofrido manutenção, manutenção preventiva,

  reconstrução, alteração ou reparo, a menos que um formulário aprovado pela ANAC de

  grande alteração e de grande reparo, ou reparo após acidente seja adequadamente

  preenchido.

  3.2 O RBAC 43.9(d) estabelece que, adicionalmente à anotação requerida pelo parágrafo 43.9(a)

  do RBAC 43, no caso de grandes alterações ou grandes reparos, a pessoa que executou tais

  trabalhos preencha um formulário na forma e maneira estabelecida pelo Apêndice B daquele

  regulamento.

  3.3 O Apêndice B do RBAC 43 requer que cada pessoa executando uma grande alteração ou

  grande reparo preencha o formulário padrão da ANAC em 2 (duas) vias, exceto no caso de

  tanques de combustível instalados dentro do compartimento de passageiros ou de

  bagagens, em que requer 3 (três) vias, devendo uma delas ser colocada a bordo da aeronave.'
