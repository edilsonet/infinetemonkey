text: '5.2.3.1 Campo 1 - Aeronave: os dados para completar os campos “fabricante”, “modelo”
  e

  “número de série” constam da plaqueta de identificação do fabricante da aeronave. As

  marcas são as constantes do Certificado de Matrícula da Aeronave.'
