title: 'Campo 2 - Proprietário: preencher o nome e endereço do proprietário conforme constante'
text: '5.2.3.2 Campo 2 - Proprietário: preencher o nome e endereço do proprietário conforme
  constante

  no Certificado de Matrícula da Aeronave.

  NOTA: Quando um grande reparo ou grande alteração for feit em uma parte de reposição

  ou componente, os itens 1 e 2 serão deixados em branco e as vias do formulário ficarãoData
  de emissão: 27 de julho de 2020

  IS nº 43.9-001

  Revisão B

  juntas à peça até que esta seja instalada numa aeronave. A pessoa que instalar essa parte

  deverá então introduzir as informações requeridas nos itens 1 e 2, entregar o original do

  formulário ao proprietário ou operador da aeronave e conservar uma cópia em seu poder por

  pelo menos 5 (cinco) anos.'
