title: 5.2.3.3(a)
text: 'a) aprovação baseada no exame dos dados técnicos apenas, aplicável a uma única

  aeronave: os dados técnicos aqui identificados estão de acordo com os requisitos de

  aeronavegabilidade aplicáveis e são aprovados para a aeronave (ou componente descrito no

  campo 4) acima descrita, sujeita a uma inspeção de conformidade por uma pessoa autorizada

  conforme a seção 43.7 do RBAC 43.'
