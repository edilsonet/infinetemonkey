title: 5.2.3.3(b)
text: 'b) aprovação baseada em inspeção física, demonstração, teste ou avaliação dos dados

  técnicos e aeronave, aplicável a uma única aeronave: a alteração (ou reparo) aqui

  identificada está de acordo com os requisitos de aeronavegabilidade aplicáveis e é aprovada

  para a aeronave (ou componente descrito no campo 4) acima descrita, sujeita a uma inspeção

  de conformidade por uma pessoa autorizada conforme a seção 43.7 do RBAC 43.'
