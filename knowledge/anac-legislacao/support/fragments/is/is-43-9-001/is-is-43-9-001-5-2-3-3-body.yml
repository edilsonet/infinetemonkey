text: '5.2.3.3 Campo 3 - Para Uso da Autoridade de Aviação Civil: a aprovação poderá ser indicada

  nesse campo quando a ANAC concluir que os dados a serem usados na execução de grandes

  alterações e grandes reparos estão de acordo com práticas aceitáveis pela indústria e pelos

  RBHA/RBAC aplicáveis (ver subparágrafo 5.3.1.2 para maiores detalhes). Deverão ser

  indicados o nome, a data, a seção e assinatura da pessoa que realizou essa análise. A

  aprovação será indicada por um dos seguintes métodos:'
