text: 'c) aprovação baseada apenas no exame dos dados técnicos, aplicável à duplicação em

  uma aeronave idêntica: a alteração aqui identificada está de acordo com os requisitos de

  aeronavegabilidade aplicáveis e é aprovada para duplicação em uma aeronave idêntica de

  mesmo fabricante, modelo e configuração após alteração pelo agente executor original.'
