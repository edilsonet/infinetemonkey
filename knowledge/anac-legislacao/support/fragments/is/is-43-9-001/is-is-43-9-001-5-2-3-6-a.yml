title: 5.2.3.6(a)
text: 'a) “A” - Nome e Endereço do Agente Executor: colocar o nome do mecânico habilitado,

  da organização certificada ou do fabricante que executou o reparo ou alteração. Os

  mecânicos devem preencher nome e endereço permanente. As Empresas aéreas,

  organizações de manutenção, ou fabricantes certificados pela ANAC devem preencher seu

  nome e o endereço constante no certificado.'
