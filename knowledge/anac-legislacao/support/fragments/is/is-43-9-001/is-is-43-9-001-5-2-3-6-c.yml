text: 'c) “C” - Número do Certificado: mecânicos deverão colocar o número da licença e

  código ANAC. Empresas aéreas e organizações de manutenção certificadas pela ANAC

  devem colocar o número do seu certificado, padrão e classe para os quais está certificada.Data
  de emissão: 27 de julho de 2020

  IS nº 43.9-001

  Revisão B

  Fabricantes devem colocar o número do seu certificado de produção ou o número do

  certificado suplementar de tipo, conforme aplicável. Fabricantes de componentes segundo

  uma Ordem Técnica Padrão (OTP) devem colocar também o número da OTP do componente

  modificado.'
