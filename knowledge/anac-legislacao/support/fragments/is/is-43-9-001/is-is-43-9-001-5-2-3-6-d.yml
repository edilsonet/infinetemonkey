title: 5.2.3.6(d)
text: 'd) “D”- Declaração de Conformidade: esse espaço é usado para certificar que o reparo

  ou alteração foi feito de acordo com os RBHA/RBAC aplicáveis e dados técnicos aprovados.

  O mecânico devidamente habilitado da oficina, fabricante ou empresa certificada,

  responsável pela execução ou supervisão do trabalho, deve datar e assinar a declaração

  prevista nesse campo.'
