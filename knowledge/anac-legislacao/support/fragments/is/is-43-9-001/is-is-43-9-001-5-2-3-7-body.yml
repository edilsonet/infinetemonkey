title: 'Campo 7 - Aprovação para retorno ao Serviço: o RBAC 43 estabelece as condições'
text: '5.2.3.7 Campo 7 - Aprovação para retorno ao Serviço: o RBAC 43 estabelece as condições

  segundo as quais grandes alterações e grandes reparos de célula, motores, hélices e

  componentes podem ser aprovados para retorno ao serviço. Essa parte do formulário é

  utilizada para indicar aprovação ou rejeição do reparo ou alteração da unidade envolvida
  e

  para identificar a pessoa que executou a inspeção da aeronavegabilidade da aeronave.

  Assinalar os campos “aprovada” ou “rejeitada” e aquele relativo a quem é o responsável pela

  inspeção, usando o campo “outros” se essa pessoa não se enquadrar nas listadas. A pessoa

  responsável pela inspeção, conforme previsto no RBAC 43, deverá datar, assinar e colocar

  o número de licença da ANAC.'
