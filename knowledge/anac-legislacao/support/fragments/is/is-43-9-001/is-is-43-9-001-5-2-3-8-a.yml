section_title: 'Campo 8 - Descrição do Trabalho Executado: uma descrição clara, concisa e
  legível'
subsection_id: a
cite: 5.2.3.8(a)
title: 5.2.3.8(a)
text: 'a) Por exemplo, se o reparo foi feito numa longarina empenada, a descrição deve começar

  por “Removida a asa da aeronave e removidos 62 cm do revestimento a partir da ponta

  da asa. Reparada a longarina empenada, na altura da estação que dista 24 cm da ponta

  da asa, de acordo com...” e continua com a descrição do reparo. A descrição deve fazer

  referência às seções dos RBHA/RBAC aplicáveis ou aos dados técnicos aprovados,

  incluindo a fonte dos dados técnicos, para substanciar a aeronavegabilidade do reparo

  ou alteração. Se o reparo ou alteração está sujeito a ser encoberto por revestimento ou

  outra estrutura, a descrição deve certificar que a inspeção das áreas inacessíveis foi feita

  e considerada satisfatória antes do seu fechamento.'
