title: 5.2.3.8(b)
text: 'b) Dados técnicos usados como base para aprovação de grandes reparos e grandes

  alterações para retorno ao serviço devem ser aprovados antes de serem usados para

  aquele propósito. Esses dados aprovados são aqueles listados na IS 21-004C:

  Certificado de Tipo - CT, Certificado Suplementar de Tipo - CST e Certificado de

  Produto Aeronáutico Aprovado - CPAA; Diretriz de Aeronavegabilidade - DA;

  desenhos de projeto, relatórios de engenharia ou especificações de processo aprovadas

  pela autoridade de aviação civil competente; manuais e informações de serviço emitidas

  pelo fabricante e aprovados pela autoridade de aviação civil competente; manuais ou

  publicações técnicas de fabricantes de componentes ou acessórios. Dados para suporte,

  tais como análise de tensões, relatório de testes, esquemas ou fotografias devem ser

  submetidos à ANAC juntamente com o formulário.Data de emissão: 27 de julho de 2020

  IS nº 43.9-001

  Revisão B'
