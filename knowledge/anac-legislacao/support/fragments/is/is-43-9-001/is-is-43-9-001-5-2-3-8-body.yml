title: 'Campo 8 - Descrição do Trabalho Executado: uma descrição clara, concisa e legível'
text: '5.2.3.8 Campo 8 - Descrição do Trabalho Executado: uma descrição clara, concisa e legível

  expondo o trabalho executado deverá ser feita nesse campo do formulário. É importante que

  a localização do reparo ou alteração, relativamente à aeronave ou componente, seja descrita.

  Os dados técnicos aprovados usados como base para aprovação de grandes alterações ou

  grandes reparos para retorno ao serviço deverão ser identificados ou descritos nesse campo.'
