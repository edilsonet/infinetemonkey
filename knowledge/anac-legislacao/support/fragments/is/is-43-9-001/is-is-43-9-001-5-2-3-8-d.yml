title: 5.2.3.8(d)
text: 'd) Demonstrações de cálculos de peso e balanceamento não são requeridas no campo 8,

  mas podem ser colocadas. Em todos os casos em que o peso e balanceamento da

  aeronave é afetado, deve ser feita uma nova ficha de peso e balanceamento para a

  aeronave, fazendo referência ao serviço descrito no formulário SEGVOO 001 que

  requer a nova ficha.

  5.3 Processamento administrativo'
