title: 'Dados técnicos previamente aprovados: os formulários devem ser completados como'
text: '5.3.1.1 Dados técnicos previamente aprovados: os formulários devem ser completados
  como

  indicado por esta IS, garantindo que o campo 7, “Aprovação para retorno ao serviço”, seja

  devidamente preenchido. O original do formulário assinado deve ser dado ao proprietário
  ou

  operador da aeronave e 1 (uma) cópia deve ser conservada pelo executante do serviço por

  pelo menos 5 (cinco) anos.'
