title: 'Dados técnicos não previamente aprovados: os formulários devem ser completados como'
text: '5.3.1.2 Dados técnicos não previamente aprovados: os formulários devem ser completados
  como

  indicado por esta IS, deixando o campo 7, “Aprovação para retorno ao serviço”, em branco.

  Todas as vias do formulário, juntamente com os dados de suporte, devem ser encaminhados

  à ANAC. Quando a ANAC decidir que os dados técnicos utilizados na grande alteração ou

  grande reparo estão de acordo com a regulamentação aplicável e estão em conformidade

  com práticas industriais aceitáveis, uma declaração apropriada de aprovação dos dados

  técnicos será indicada no campo 3, “Para uso da Autoridade de Aviação Civil”, nas vias do

  formulário. Os dados de suporte serão devolvidos ao requerente, o qual irá completar o

  campo 7, “Aprovação para retorno ao serviço”. O formulário original, junto com os dados

  de suporte, deverá ser enviado ao proprietário ou operador da aeronave e 1 (uma) cópia

  deverá ser conservada pelo executante do serviço por pelo menos 5 (cinco) anos.'
