title: A assinatura no campo 6, “Declaração de Conformidade” é a certificação dada pela pessoa
text: '5.3.2.2 A assinatura no campo 6, “Declaração de Conformidade” é a certificação dada
  pela pessoa

  que executou o trabalho de que este foi feito de acordo com os RBHA/RBAC aplicáveis e

  dados técnicos aprovados pela ANAC. A declaração é somente aplicável ao serviço descrito

  no campo 8 no verso do formulário SEGVOO 001.

  NOTA: As assinaturas referidas nos subparágrafos 5.3.2.1 e 5.3.2.2 não indicam a aprovação

  da ANAC quanto ao trabalho descrito no campo 8, para retorno ao serviço.'
