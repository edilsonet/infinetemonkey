text: '5.3.2.3 A assinatura no campo 7, “Aprovação para retorno ao serviço”, somente constitui
  aprovação

  da ANAC se o espaço “ANAC” estiver marcado. As outras pessoas e entidades listadas noData
  de emissão: 27 de julho de 2020

  IS nº 43.9-001

  Revisão B

  campo 7 estão autorizadas a “aprovar para retorno ao serviço” se o reparo ou alteração for

  realizado com base em dados técnicos aprovados pela ANAC, feito de acordo com os

  RBHA/RBAC aplicáveis e concluído satisfatoriamente.'
