title: O formulário SEGVOO 001 somente pode ser utilizado para aeronaves registradas no Brasil.
text: '5.3.3 O formulário SEGVOO 001 somente pode ser utilizado para aeronaves registradas
  no Brasil.

  Se alguma autoridade civil estrangeira solicitar o formulário como um registro de trabalho

  realizado, ele poderá ser fornecido. O formulário deverá ser preenchido de acordo com os

  RBHA/RBAC e com esta IS. A autoridade estrangeira deve estar ciente de que esse

  formulário não é, nesse caso, um documento oficial da ANAC.'
