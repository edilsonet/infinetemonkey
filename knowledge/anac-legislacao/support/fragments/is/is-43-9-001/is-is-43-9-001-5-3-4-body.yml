text: '5.3.4 O RBAC 43, Apêndice B, parágrafo (b) autoriza uma oficina homologada a usar uma
  ordem

  de serviço, ao invés do formulário SEGVOO 001, somente no caso de grandes reparos. Tais

  ordens de serviço devem conter todas as informações fornecidas pelo formulário em todos

  os detalhes:'
