text: '12. Observações

  (Remarks)

  Partes com vida limitada devem ser acompanhadas de histórico de manutenção incluindo tempo
  total / ciclo total / tempo desde que novo. (Limited life parts must be accompanied by maintenance
  history including total time/total cycles/times since new)

  13. Certifica que o(s) item(ns) acima identificado(s) foi (foram) fabricado(s) em conformidade
  aos:

  (Certifies that the article(s) identified above was (were) manufactured in conformity to:
  )

  dados de projeto aprovados e está(ão) em condição segura de operação

  (approved design data and are in a condition for safe operation)

  dados de projeto não aprovado especificados no bloco 12

  (non-approved design data specified in block 12)

  18. Retorno ao serviço de acordo com RBAC 43.9 Outros regulamentos especificados no bloco
  12

  (Return to service in accordance with RBAC 43.9) (Other regulations specified in block 12)

  Certifica que, a menos do especificado no bloco 12, o trabalho especificado no bloco 11
  e descrito no bloco 12 foi executado de acordo

  com o Regulamento Brasileiro da Aviação Civil - RBAC 43 e, em relação ao trabalho realizado,
  a(s) peça(s) é (são) aprovada(s) para

  retorno ao serviço.

  (Certifies that, unless otherwise specified in block 12, the work identified in block 11
  and described in block 12 was accomplished in accordance with

  Brazilian Civil Aviation Regulations - RBAC 43 and in respect to the work performed the
  part(s) is (are) approved for return to service.)

  14. Assinatura do Representante da ANAC - (ANAC Representative Signature). 15. Nº Autorização
  da ANAC (ANAC Authorization No.) 19. Pessoa Autorizada (Authorized Signature) 20. Nº COM/Certificado
  ETA - (Certificate Number)'
