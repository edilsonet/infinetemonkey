title: Nome (Name) 17. Data (Date) 21. Nome (Name) 22. Data (Date)
text: '16. Nome (Name) 17. Data (Date) 21. Nome (Name) 22. Data (Date)

  * O INSTALADOR DEVE FAZER VERIFICAÇÃO CRUZADA DA APLICABILIDADE ATRAVÉS DOS DADOS TÉCNICOS
  APLICÁVEIS. (INSTALLER MUST CROSS CHECK ELIGIBILITY WITH APPLICABLE TECHNICAL DATA)

  RESPONSABILIDADE DO USUÁRIO / INSTALADOR

  É IMPORTANTE COMPREENDER QUE A EXISTÊNCIA DESTE DOCUMENTO POR SI SÓ NÃO CONSTITUI AUTOMATICAMENTE
  UMA AUTORIZAÇÃO

  PARA INSTALAR A PARTE / COMPONENTE / CONJUNTO.

  SE O TRABALHO DO USUÁRIO/INSTALADOR É REALIZADO DE ACORDO COM OS REGULAMENTOS NACIONAIS
  DE UMA AUTORIDADE DE

  AERONAVEGABILIDADE DIFERENTE DA AUTORIDADE DE AERONAVEGABILIDADE DO PAÍS ESPECIFICADO NO
  BLOCO 1, É ESSENCIAL QUE O

  USUÁRIO/INSTALADOR ASSEGURE QUE A SUA AUTORIDADE DE AERONAVEGABILIDADE ACEITA PARTES/COMPONENTES/CONJUNTOS
  DA

  AUTORIDADE DE AERONAVEGABILIDADE DO PAÍS ESPECIFICADO NO BLOCO 1.

  AS DECLARAÇÕES NOS BLOCOS 13 E 18 NÃO CONSTITUEM UM CERTIFICADO DE INSTALAÇÃO EM TODOS OS
  CASOS, OS REGISTROS DE

  MANUTENÇÃO DA AERONAVE DEVEM CONTER UM CERTIFICADO DE INSTALAÇÃO EMITIDO DE ACORDO COM REGULAMENTOS
  NACIONAIS

  PELO USUÁRIO/INSTALADOR ANTES QUE A AERONAVE POSSA SER LIBERADA PARA VOO.

  (USER / INSTALLER RESPONSIBILITY)

  (IT IS IMPORTANT TO UNDERSTAND THAT THE EXISTENCE OF THIS DOCUMENT ALONE DOES NOT AUTOMATICALLY
  CONSTITUTE AUTHORITH

  TO INSTALL THE PART / COMPONENT / ASSEMBLY).

  (WHERE THE USER / INSTALLER WORK IS PERFORMED IN ACCORDANCE WITH THE NATIONAL REGULATIONS
  OF AN AIRWORTHINESS

  AUTHORITY DIFFERENT THAN THE AIRWORTHINESS AUTHORITY OF THE COUNTRY SPECIFIED IN BLOCK 1,
  IT IS ESSENTIAL THAT THE

  USER/INSTALLER ENSURES THAT HIS/HER AIRWORTHINESS AUTHORITY ACCEPTS PARTS/COMPONENTS/ASSEMBLIES
  FROM THE

  AIRWORTHINESS AUTHORITY OF THE COUNTRY SPECIFIED IN BLOCK 1).

  (STATEMENTS IN BLOCK 13 AND 18 DO NOT CONSTITUTE INSTALLATION CERTIFICATION. IN ALL CASES,
  AIRCRAFT MAINTENANCE RECORDS

  MUST CONTAIN AN INSTALLATION CERTIFICATION ISSUED IN ACCORDANCE WITH THE NATIONAL REGULATIONS
  BY THE USER / INSTALLER

  BEFORE THE AIRCRAFT MAY BE FLOWN).Origem: SAR 17/17

  26/08/2016 IS nº 43.9-002

  Revisão B'
