title: FUNDAMENTOS
text: '3. FUNDAMENTOS

  3.1 O RBAC 43.9(a) exige que cada pessoa que execute manutenção, manutenção preventiva,

  reconstrução ou alteração de um produto aeronáutico ou artigo deve, exceto como previsto

  nos parágrafos (b) e (c) da referida seção, fazer uma anotação no registro de manutenção

  desse equipamento. O formulário F-100-01 pode ser usado como registro de manutenção,

  referente a motores de aeronaves, hélices e artigos. Para efeitos desta IS, utilizam-se
  as

  definições de produto aeronáutico e artigo constantes da seção 4 deste documento.

  3.2 O RBAC 21.325(b) estabelece que a ANAC prescreve a forma e maneira aceitável pela

  qual é emitida a aprovação de aeronavegabilidade para exportação para motores de

  aeronaves, hélices e artigos. O formulário F-100-01 pode ser utilizado também como

  aprovação de aeronavegabilidade para exportação de motores de aeronaves, hélices e

  artigos.'
