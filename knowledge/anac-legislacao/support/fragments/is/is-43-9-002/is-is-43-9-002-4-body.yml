title: DEFINIÇÕES
text: '4. DEFINIÇÕES

  4.1 Artigo: É uma parte, componente, ou aparelho.

  4.2 Produto Aeronáutico: É uma aeronave, motor ou hélice completos.

  4.3 Registro Primário de Manutenção: As seções 43.9 e 43.11 do RBAC 43 estabelecem oOrigem:
  SAR 2/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  conteúdo e a forma dos registros de manutenção de um produto aeronáutico ou artigo. São

  considerados registros primários de manutenção aqueles que apresentam anotações como

  as previstas nas citadas seções, como por exemplo: Cadernetas de célula, motores e hélices,

  Ordens de Serviços, Fichas de Cumprimento de Diretriz de Aeronavegabilidade (FCDA),

  Formulários F-100-01 e F-400-04, etc.

  4.4 Registro Secundário de Manutenção: De acordo com as seções 91.417, 135.439 e

  121.380 do RBHA 91, e dos RBAC 135 e 121 respectivamente, os registros de

  manutenção de um produto aeronáutico ou artigo devem conter a situação corrente das

  partes com tempo de vida limitado, tempo desde a última revisão geral de cada item sujeito

  a revisão instalado em aeronave, identificação da presente situação de inspeções da

  aeronave e a situação corrente das aplicáveis diretrizes de aeronavegabilidade (DA), e se
  a

  diretriz de aeronavegabilidade envolver ações periódicas, o tempo e data da próxima ação

  requerida. Dessa forma, constituem registros secundários de manutenção aqueles que

  apresentem tais informações, como por exemplo, uma ficha de situação de componentes

  controlados instalados em uma aeronave ou uma ficha de situação de cumprimento de

  diretrizes de aeronavegabilidade. Os registros secundários devem ser rastreáveis aos

  registros primários.'
