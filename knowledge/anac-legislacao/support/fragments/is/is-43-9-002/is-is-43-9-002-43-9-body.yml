text: '43.9 do RBAC 43. Deve então, indicar qualquer informação ou referência que se fizer

  necessária para que o usuário ou o instalador faça a determinação final de

  aeronavegabilidade dos produtos e artigos listados no campo 7. Cada declaração deve

  especificar quais os itens identificados no campo 6. Quando o espaço for insuficiente,

  pode-se utilizar o verso do papel para complementar. Nesse caso, deve-se colocar a

  observação “continua no verso” (“To be continued at the reverse side”). Alternativamente,

  nesse Campo pode-se fazer referência a documentos e registros primários de manutençãoOrigem:
  SAR 7/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  emitidos visando atender a seção 43.9 do RBAC 43 (ordem de serviço, formulário F-100-

  01, relatório de ensaio, etc.) (Veja item 5.3.6 desta IS).

  São exemplos de informações que devem constar nesse Campo:'
