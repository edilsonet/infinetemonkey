cite: 43.9(h)
title: 43.9(h)
text: 'h) Quando for utilizado como aprovação de exportação de motores de aeronaves, hélices

  e artigos que tenham retornado ao serviço, baseado no RBAC 43, as seguintes palavras

  podem ser inseridas em letra maiúscula: “EXPORT”, “USED PART”, “SHIPPED PER

  COUNTRY ACCEPTANCE LETTER OF USED PART” (O uso da palavra “EXPORT” é

  opcional, e seu uso depende dos requisitos de acordos bilaterais ou requisitos do país

  importador). Essas palavras, dependendo dos requisitos do país importador, não são

  necessárias para partes recém-revisadas.

  NOTA: Quando a Etiqueta for usada para identificar motores de aeronaves,

  hélices e artigos que são trocados entre empresas aéreas ou empresas de manutenção

  instaladoras, ou quando removidos de uma aeronave, conforme o item 5.2.2.2 desta IS,

  devem no mínimo constar nos dados da remoção: aeronave, data, TSN, TSO, TT da

  aeronave, TBO usado pela empresa, conforme aplicável.'
