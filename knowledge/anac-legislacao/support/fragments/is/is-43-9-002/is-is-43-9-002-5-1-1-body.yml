title: Os Certificados de Liberação Autorizada ou as Etiquetas de Aprovação de
text: '5.1.1 Os Certificados de Liberação Autorizada ou as Etiquetas de Aprovação de

  Aeronavegabilidade (Formulário F-100-01) possuem múltiplas funções. A finalidade

  básica é atestar a aeronavegabilidade de motores de aeronaves, hélices e artigos. Assim,

  sempre representa uma garantia governamental sobre o motor de aeronave, hélice ou

  artigo, normalmente perante outra nação, daí sua utilização tradicional nas operações de

  importação/exportação, hoje essa prática também é recomendada para operações

  domésticas. Uma utilidade derivada é contribuir para a rastreabilidade do motor de

  aeronave, hélice ou artigo.'
