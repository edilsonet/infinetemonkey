title: A necessidade dessa garantia governamental é decorrente dos compromissos para com a
text: '5.1.2 A necessidade dessa garantia governamental é decorrente dos compromissos para
  com a

  Organização da Aviação Civil Internacional (ICAO), da qual o Brasil participa como

  signatário desde a Convenção de Chicago, realizada em 1944, e cujo objetivo é simplificar

  o trâmite de motores de aeronaves, hélices e artigos entre nações por meio de sistemas

  nacionais de controle e vigilância sobre fabricantes e empresas de manutenção capazes de

  assegurar um padrão de segurança reconhecido e respeitável. No Brasil, essa é uma das

  atividades da ANAC.'
