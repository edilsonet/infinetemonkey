title: Quando se trata de motores de aeronaves, hélices e artigos novos, as Etiquetas significam
text: '5.1.3 Quando se trata de motores de aeronaves, hélices e artigos novos, as Etiquetas
  significam

  que determinado motor de aeronave, hélice ou artigo foi fabricado de acordo com um

  determinado dado de projeto aprovado e está em condição segura de operação

  (aeronavegabilidade) ou em fase de aprovação (conformidade) e sob um sistema de

  produção aprovado (ou em processo de aprovação). Essa situação requer o preenchimento

  do “lado esquerdo” (campos 13 a 17 do formulário) e o “lado direito” (campos 18 a 22)

  deve ser anulado com um traço diagonal.'
