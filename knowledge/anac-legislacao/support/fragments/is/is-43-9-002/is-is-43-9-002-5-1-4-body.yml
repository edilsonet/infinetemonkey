title: A “Aeronavegabilidade” (quadro superior - “dados de projeto aprovados e ...” do campo
text: '5.1.4 A “Aeronavegabilidade” (quadro superior - “dados de projeto aprovados e ...”
  do campo

  13) atesta que o motor de aeronave, hélice ou artigo está próprio para o uso numa aeronaveOrigem:
  SAR 3/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  certificada, apesar de a Etiqueta não constituir por si só aprovação para instalação de
  um

  motor de aeronave, hélice ou artigo numa aeronave. Já a “Conformidade” (quadro inferior

  - “dados de projeto não aprovados e ...” do campo 13) é utilizada para motores de

  aeronaves, hélices e artigos em fase de certificação (partes protótipo), portanto destinados
  a

  ensaios ou a testes e não liberados para operação comercial.'
