text: '5.1.5 Quando se trata de motores de aeronaves, hélices e artigos usados que passaram
  por um

  serviço de manutenção ou revisão geral conforme o RBAC 43 e estão próprias para o

  retorno à operação, utiliza-se o “lado direito” e o “lado esquerdo” deve ser anulado com

  um traço diagonal. Nesse caso, a função da Etiqueta é a aprovação para retorno ao serviço.'
