title: Como não se permite misturar no mesmo formulário partes novas e usadas, em nenhuma
text: '5.1.6 Como não se permite misturar no mesmo formulário partes novas e usadas, em nenhuma

  circunstância ambos os lados são utilizados na mesma etiqueta. Também não se permite

  misturar itens de “Conformidade” com “Aeronavegabilidade” no mesmo formulário.'
