title: 5.1.8(b)
text: 'b) Partes padronizadas (AN, NAS, etc.) fabricadas por uma empresa não certificada pela

  autoridade aeronáutica, que devem ser liberadas com certificados de conformidade ou

  outro documento que evidencie a conformidade do motor de aeronave, hélice ou artigo

  com uma norma técnica; e'
