title: As seções 43.9 e 43.11 do RBAC 43 requerem que cada pessoa que execute manutenção,
text: '5.2.1.1 As seções 43.9 e 43.11 do RBAC 43 requerem que cada pessoa que execute manutenção,

  manutenção preventiva, reconstrução ou alteração de um produto aeronáutico ou artigo deve

  fazer uma anotação no registro de manutenção desse equipamento com a descrição (ou

  referência a dados aceitáveis pela autoridade aeronáutica competente) do trabalho

  executado, data de início e término do mesmo e o nome e a assinatura da pessoa que

  aprovou o retorno ao serviço do produto aeronáutico ou artigo.'
