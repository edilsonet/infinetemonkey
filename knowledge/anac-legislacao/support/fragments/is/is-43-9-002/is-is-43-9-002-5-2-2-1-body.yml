title: Visando atender ao que requer a seção 43.9 do RBAC 43, deve ser utilizado o Certificado
text: '5.2.2.1 Visando atender ao que requer a seção 43.9 do RBAC 43, deve ser utilizado o
  Certificado

  de Liberação Autorizada - Formulário F-100-01 (Etiqueta de Aprovação de

  Aeronavegabilidade), cujo modelo consta do Apêndice A desta IS, como meio de

  cumprimento em relação a registro primário de manutenção, visando à aprovação para o

  retorno ao serviço de motores de aeronaves, hélices e artigos após manutenção,

  manutenção preventiva, recondicionamento, modificação ou reparo.'
