cite: 5.2.2.2
title: Essa Etiqueta deve ser utilizada como aprovação para retorno ao serviço de motores
  de
text: '5.2.2.2 Essa Etiqueta deve ser utilizada como aprovação para retorno ao serviço de
  motores de

  aeronaves, hélices e artigos removidos de uma aeronave, com Certificado de

  Aeronavegabilidade válido, operando de acordo com os RBAC 121 ou 135 e de acordo

  com um Programa de Manutenção de Aeronavegabilidade Continuada - PMAC, para

  envio ao estoque ou para ser instalada em outra aeronave de outra empresa aérea. O uso

  dessa Etiqueta para o movimento de motores de aeronaves, hélices e artigos entre

  aeronaves de uma mesma empresa aérea é opcional.'
