title: As empresas de manutenção certificadas segundo o RBAC 145 e as empresas aéreas
text: '5.2.3.1 As empresas de manutenção certificadas segundo o RBAC 145 e as empresas aéreas

  certificadas segundo os RBAC 121 ou 135 devem emitir o formulário F-100-01 ao aprovar

  para o retorno ao serviço após manutenção de um motor de aeronave, hélice ou artigo,

  constante de sua Especificação Operativa e/ou Lista de Capacidades, emitidas segundo o

  RBAC 145, ou constante de sua Especificação Operativa, emitida segundo o RBAC 121 ou

  135.'
