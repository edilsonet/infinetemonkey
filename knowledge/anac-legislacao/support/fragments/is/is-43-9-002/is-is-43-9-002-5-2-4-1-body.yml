title: As empresas aéreas e de manutenção deverão estabelecer procedimentos detalhados de
text: '5.2.4.1 As empresas aéreas e de manutenção deverão estabelecer procedimentos detalhados
  de

  utilização e de preenchimento do formulário F-100-01, baseados nos critérios desta IS, no

  Manual de Controle da Qualidade (MCQ) requerido pelo RBAC 145, ou, no caso de

  empresas aéreas que não são certificadas, também, como empresas de manutenção, no

  Manual Geral de Manutenção (MGM) requerido pelos RBAC 121 e 135. Tais

  procedimentos deverão estabelecer, por exemplo, quais as atribuições e as

  responsabilidades das pessoas e dos setores da empresa envolvidas no preenchimento do

  Formulário F-100-01, fluxograma de tramitação interna, procedimentos de como preencher

  o Formulário F-100-01, sistema de rastreabilidade, etc.Origem: SAR 5/17

  26/08/2016 IS nº 43.9-002

  Revisão B'
