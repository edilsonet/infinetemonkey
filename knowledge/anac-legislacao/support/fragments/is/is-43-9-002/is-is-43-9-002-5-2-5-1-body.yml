title: Nos casos de grandes modificações e grandes reparos, conforme definido no RBAC 01 e
text: '5.2.5.1 Nos casos de grandes modificações e grandes reparos, conforme definido no RBAC
  01 e

  conforme exemplos contidos no Apêndice A do RBAC 43, adicionalmente à emissão do

  formulário F-100-01, de acordo com o estabelecido no parágrafo 43.5(b)-I do RBAC 43,

  deverá ser emitido também, necessariamente, um formulário F-400-04, ou, opcionalmente,

  uma Ordem de Serviço, para os casos de grandes reparos, conforme previsto no apêndice B

  do RBAC 43. Ainda conforme o RBAC 43.5(b)-I, o documento emitido segundo esse

  requisito deve ser aprovado ou fornecido pela ANAC.'
