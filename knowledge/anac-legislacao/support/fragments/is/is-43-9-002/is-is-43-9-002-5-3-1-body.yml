title: O preenchimento da Etiqueta deve ser legível, e pode ser datilografado, preenchido
  em
text: '5.3.1 O preenchimento da Etiqueta deve ser legível, e pode ser datilografado, preenchido
  em

  computador ou manuscrito (em letra de forma e a tinta). A Etiqueta somente será válida se

  todos os campos estiverem preenchidos, ou seja, nenhum campo poderá ficar em branco.'
