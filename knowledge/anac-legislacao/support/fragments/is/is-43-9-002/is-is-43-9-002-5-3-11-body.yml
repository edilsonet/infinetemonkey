title: 'Campo 10 - Número de Série / Lote (Serial/Batch Number): Indique o número de série'
text: '5.3.11 Campo 10 - Número de Série / Lote (Serial/Batch Number): Indique o número de
  série

  ou lote equivalente (identificado no motor de aeronave, hélice ou artigo) para cada motor

  de aeronave, hélice ou artigo aprovado. Se o número de série/lote não for aplicável,

  indique “N/A”.'
