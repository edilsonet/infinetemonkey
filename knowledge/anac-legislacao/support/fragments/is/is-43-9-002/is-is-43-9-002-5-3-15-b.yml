title: 5.3.15(b)
text: 'b) Outros regulamentos especificados no campo 12 (Other regulations specified in block

  13).Origem: SAR 8/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  Se forem assinalados os dois quadros, deve ser observado se os dados técnicos utilizados

  são aprovados ou aceitos pela ANAC e pela autoridade aeronáutica estrangeira.'
