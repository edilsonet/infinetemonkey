title: A Etiqueta (Formulário F-100-01) é emitida para motores de aeronaves, hélices e artigos
text: '5.4.1.1 A Etiqueta (Formulário F-100-01) é emitida para motores de aeronaves, hélices
  e artigos

  com o objetivo de evidenciar que esses produtos e artigos estão em “Conformidade” ou se

  encontram “Aeronavegáveis”, de acordo com o RBAC 21, Subparte L, e que obedecem,

  também, aos requisitos do país importador.'
