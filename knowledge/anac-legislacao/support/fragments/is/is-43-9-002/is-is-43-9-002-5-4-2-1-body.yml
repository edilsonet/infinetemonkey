title: Como condição básica, o fabricante deve ser detentor do projeto ou possuidor de uma
text: '5.4.2.1 Como condição básica, o fabricante deve ser detentor do projeto ou possuidor
  de uma

  licença para fabricação de tal motor de aeronave, hélice ou artigo, pois essas são as únicas

  maneiras de possuir os dados técnicos necessários para determinar a condição do produto

  ou artigo.'
