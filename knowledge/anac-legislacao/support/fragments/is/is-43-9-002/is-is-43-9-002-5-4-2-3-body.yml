title: Atualmente entende-se que o fabricante brasileiro pode, por meio de seus Profissionais
text: '5.4.2.3 Atualmente entende-se que o fabricante brasileiro pode, por meio de seus Profissionais

  Credenciados em Fabricação (PCF), desde que devidamente delegados pela ANAC, emitir

  uma Etiqueta onde quer que esteja vigorando seu sistema de controle da qualidade, desde

  seu fornecedor (nacional ou estrangeiro) até a entrega ao usuário final.'
