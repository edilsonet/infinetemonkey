text: '5.4.3.1 A emissão das Etiquetas está sob a responsabilidade da Gerência de Programas
  (GCPR) da

  Superintendência de Aeronavegabilidade (SAR), da ANAC, cabendo-lhe, também, o

  controle das mesmas. A ANAC também autoriza os profissionais credenciados em

  fabricação (PCF) a emitir Etiquetas, de acordo com as necessidades das empresas

  certificadas.Origem: SAR 9/17

  26/08/2016 IS nº 43.9-002

  Revisão B'
