title: A Etiqueta para partes de produção em série ou de conformidade de protótipo pode ser
text: '5.4.3.2 A Etiqueta para partes de produção em série ou de conformidade de protótipo
  pode ser

  emitida por um funcionário do fabricante, designado e credenciado como PCF. Essa

  emissão só pode ser feita após o PCF ter determinado que a parte está conforme os dados

  do projeto aprovado e em condições seguras de operação ou em conformidade com os

  dados de projeto em aprovação.'
