title: A emissão da Etiqueta é altamente recomendada no mercado doméstico, em especial para
text: '5.4.4.2 A emissão da Etiqueta é altamente recomendada no mercado doméstico, em especial
  para

  aqueles itens de prateleira e outros destinados à manutenção, manutenção preventiva,

  recondicionamento, modificação e reparos, embora o fabricante possa fazer uso do

  certificado de conformidade próprio ou mesmo de uma nota fiscal ou fatura, para assumir
  a

  responsabilidade direta pelo material fornecido.'
