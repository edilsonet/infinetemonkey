title: 5.4.5.1(a)
text: 'a) O fabricante deve estabelecer o seu próprio critério de enquadramento do material

  nessa categoria. Esse critério pode variar de acordo com a matéria-prima (metal, borracha,

  composto, etc.) e com a natureza do item (componente eletrônico, sistema mecânico ou

  hidráulico, parte estrutural, etc.).'
