title: 5.4.5.1(b)
text: 'b) Material há longo tempo em estoque requer, em princípio, uma inspeção para

  averiguar seu estado geral (integridade física e de funcionamento, conforme o caso). Uma

  análise quanto à necessidade de incorporação das modificações, no momento de liberação

  para uso, por exigência de DA. (Nenhum motor de aeronave, hélice ou artigo deve ser

  liberado para uso com pendências de incorporação de modificações mandatórias).'
