text: '5.5.12 Campo 10 - Número de Série / Lote (Serial / Batch Number): Indique o número
  de série

  ou equivalente (identificado na parte) para cada motor de aeronave, hélice ou artigo

  despachado. Se o número de série/lote não for aplicável, indique “N/A”.'
