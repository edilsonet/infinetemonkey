text: '5.5.14 Campo 12 - Observações (Remarks): Indique qualquer informação ou referência
  que se

  fizer necessária para que o usuário ou o instalador faça a determinação final de

  aeronavegabilidade/conformidade dos motores de aeronaves, hélices e artigos listados no

  campo 7. Cada declaração deve estar relacionada a cada item identificado no campo 6.

  Quando o espaço for insuficiente, pode-se utilizar o verso do papel para complementar.

  Nesse caso, deve-se colocar a observação “continua no verso” (“To be continued at the

  reverse side”). São exemplos de informações que devem constar nesse campo:'
