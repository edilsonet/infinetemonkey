title: 5.5.14(f)
text: 'f) Quando usado como aprovação para exportação como Suplementar e os motores de

  aeronaves, hélices e artigos estiverem sendo despachados para o seu destino final, as

  palavras “SUPPLEMENTAL EXPORT” ou “SUPPLEMENTAL SHIPMENT” podem ser

  colocadas, com todas as letras maiúsculas (O uso das palavras “SUPPLEMENTAL

  EXPORT” ou “SUPPLEMENTAL SHIPMENT” é opcional, e seu uso depende dos

  requisitos de acordos bilaterais ou dos requisitos do país importador).

  NOTA 1: Não é permitida a emissão de cópia da Etiqueta original, exceto como

  mencionado no parágrafo 5.4.6.3 desta IS. Exceções aos requisitos especiais do país

  importador, caso aplicável, devem ser obtidas e listadas com uma aceitação escrita da

  autoridade aeronáutica civil do país importador. Uma cópia do documento de aceitação

  deve ser anexada ao formulário F-100-01 junto com o produto despachado; o documento

  de aceitação original deve ser retido pelo exportador.Origem: SAR 13/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  NOTA 2: É de responsabilidade do exportador o cumprimento dos requisitos especiais de

  importação do país para o qual a parte está sendo enviada.'
