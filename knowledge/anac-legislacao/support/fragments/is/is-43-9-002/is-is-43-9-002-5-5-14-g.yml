title: 5.5.14(g)
text: 'g) Quando usado para conformidade, a palavra “CONFORMITY” deve ser declarada.

  Além disso, devem constar informações complementares, tais como, “pending data

  approval”, “TC pending”, “for test only”, etc. Ainda se torna fundamental constar os dados

  que basearam a conformidade: desenho, revisão, data, número do projeto e outras

  instruções especiais para assegurar a validade da Etiqueta para o fim que se destina.'
