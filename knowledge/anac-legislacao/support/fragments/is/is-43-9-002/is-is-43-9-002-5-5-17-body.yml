title: 'Campo 15 - Nº de Autorização da ANAC (ANAC Authorization Number): Se a pessoa'
text: '5.5.17 Campo 15 - Nº de Autorização da ANAC (ANAC Authorization Number): Se a pessoa

  indicada no campo 14 for PCF, colocar o número do credenciamento que lhe foi dado pela

  ANAC. Se a assinatura é de um inspetor da ANAC, o número será de sua identificação

  funcional.'
