title: 'Campo 3 - Certificado Nº (Certificate Nº/System Tracking Ref.): O objetivo desse'
text: '5.5.4 Campo 3 - Certificado Nº (Certificate Nº/System Tracking Ref.): O objetivo desse

  campo é identificar o formulário com um número único para efeito de controle e

  rastreabilidade. Assim, a empresa deve definir, a seu critério, seu sistema de numeração

  por meio de procedimento e/ou instruções de controle.'
