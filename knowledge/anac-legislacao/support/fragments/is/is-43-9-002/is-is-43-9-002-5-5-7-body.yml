title: 'Campo 6 - Item (Item): Quando se emitir a Etiqueta, um n.º único de item ou n.º múltiplo'
text: '5.5.7 Campo 6 - Item (Item): Quando se emitir a Etiqueta, um n.º único de item ou n.º
  múltiplo

  de itens pode ser usado para vários part number com o destino final em comum. Itens

  múltiplos devem ser numerados, em sequência. Caso o espaço seja insuficiente para todos

  os itens a serem aprovados, deve-se abrir nova etiqueta, com outro número (campo 3) ou

  usar uma lista de material anexa.'
