text: '5.6.1.2 É importante compreender que a existência do formulário F-100-01 por si só
  não constitui

  automaticamente uma autorização para instalar o motor de aeronave, hélice ou artigo em

  um produto aeronáutico.Origem: SAR 14/17

  26/08/2016 IS nº 43.9-002

  Revisão B'
