text: '5.6.1.4 O constante nos Campos 18 a 22 não constitui um certificado de instalação.
  Os registros de

  manutenção da aeronave devem conter um certificado de instalação emitido de acordo com

  os RBHA/RBAC antes que a aeronave possa ser liberada para voo.'
