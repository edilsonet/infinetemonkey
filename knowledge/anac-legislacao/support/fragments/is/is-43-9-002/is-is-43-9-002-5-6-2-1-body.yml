title: Não é permitida a mudança de posição dos Campos ou qualquer alteração que
text: '5.6.2.1 Não é permitida a mudança de posição dos Campos ou qualquer alteração que

  desconfigure o aspecto geral da Etiqueta. Entretanto, as empresas poderão adaptar o

  formulário para sua maior praticidade, isto é, por exemplo, deixar pré-preenchido o campo

  de endereço. Além disso, ligeiras modificações nos tamanhos dos campos ainda são

  aceitáveis.'
