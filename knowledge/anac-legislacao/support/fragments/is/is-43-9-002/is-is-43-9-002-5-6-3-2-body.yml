title: Esta IS estabelece a possibilidade de documentos serem anexados à Etiqueta. Todos os
text: '5.6.3.2 Esta IS estabelece a possibilidade de documentos serem anexados à Etiqueta.
  Todos os

  anexos devem possuir referência cruzada entre si e com o número da Etiqueta constante do

  campo 3. As páginas dos anexos devem ser numeradas e o número total de páginas deve

  constar de cada página.'
