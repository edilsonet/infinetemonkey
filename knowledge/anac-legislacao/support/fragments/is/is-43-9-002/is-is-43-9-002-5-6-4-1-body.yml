text: '5.6.4.1 Quando uma Etiqueta original for extraviada, a empresa aérea, de manutenção
  ou de

  fabricação emissora pode emitir uma segunda via, com base nas informações contidas em

  seus arquivos. Para tanto, o usuário deve comunicar por escrito o extravio do documento
  à

  empresa aérea, de manutenção ou de fabricação emissora, demonstrar alguma evidência

  que permita rastrear a emissão original e solicitar uma segunda via.'
