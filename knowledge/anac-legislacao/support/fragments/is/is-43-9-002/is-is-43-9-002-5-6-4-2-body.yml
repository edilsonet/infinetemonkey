title: A segunda via deve possuir o mesmo número de identificação da original e deve conter
  no
text: '5.6.4.2 A segunda via deve possuir o mesmo número de identificação da original e deve
  conter no

  campo 12 as seguintes notas em adição à sua original: “Este é um Formulário de

  substituição do emitido em _______” (data da emissão original) (“This is a replacement

  Form F-100-01, issued on_______”)”. No campo 17 ou 22, coloca-se a data da emissão daOrigem:
  SAR 15/17

  26/08/2016 IS nº 43.9-002

  Revisão B

  segunda via.'
