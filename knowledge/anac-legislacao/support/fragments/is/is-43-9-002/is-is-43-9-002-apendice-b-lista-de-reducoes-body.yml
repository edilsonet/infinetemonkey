text: 'APÊNDICE B - LISTA DE REDUÇÕES

  B1. SIGLAS

  ANAC Agência Nacional de Aviação Civil

  BS Boletim de Serviço

  CAE Certificado de Aeronavegabilidade para Exportação

  CAMP Continuous Airworthiness Maintenance Program

  COM Certificado de Organização de Manutenção

  Certificado ETA Certificado de Empresa de Transporte Aéreo

  COP Certificado de Organização de Produção

  DA Diretriz de Aeronavegabilidade (brasileira ou similar estrangeira)

  FCDA Ficha de Cumprimento de Diretriz de Aeronavegabilidade

  GCPR Gerência de Programas

  ICAO International Civil Aviation Organization

  IS Instrução Suplementar

  MCQ Manual de Controle da Qualidade

  MGM Manual Geral de Manutenção

  MOM Manual da Organização de Manutenção

  N/A Não Aplicável

  OF Ordem de Fabricação

  OS Ordem de Serviço

  OTP Ordem Técnica Padrão

  PCF Profissional Credenciado em Fabricação

  RBAC Regulamento Brasileiro da Aviação Civil

  RBHA Regulamento Brasileiro de Homologação Aeronáutica

  SAR Superintendência de Aeronavegabilidade

  SEGVOO Sistema de Segurança de Voo

  TBO Time Between Overhaul

  TBV To be Verified

  TC Type Certificate

  TSN Time Since New

  TSO Technical Standard Order

  TT Total Time'
