text: '5.1.1.1 As cadernetas de célula, de motor e de hélice serão aplicáveis para todas as
  aeronaves civis

  brasileiras que operam segundo o RBHA 91 e RBAC 135. Aplica-se, ainda, ao motor e à

  hélice adquirida para estoque ou posterior instalação em uma aeronave que opere segundo

  as referidas regulamentações. As aeronaves que operem segundo o RBHA 91 e RBAC 135Origem:
  SAR 3/47

  Data de emissão: 28.02.2020 IS nº 43.9-003

  Revisão B

  poderão seguir procedimentos alternativos em relação aos estabelecidos nesta IS, desde

  que aceitos formalmente pela ANAC.'
