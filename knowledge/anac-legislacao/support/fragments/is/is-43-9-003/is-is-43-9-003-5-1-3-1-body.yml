title: 'Caderneta de Célula: Número sequencial / marcas de nacionalidade e de matrícula da'
text: '5.1.3.1 Caderneta de Célula: Número sequencial / marcas de nacionalidade e de matrícula
  da

  aeronave / dois últimos dígitos do ano em que foi efetuado o Termo de Abertura da

  caderneta de célula.

  EXEMPLO: Uma aeronave nova de marcas PT-XYZ, ao efetuar a abertura da sua primeira

  caderneta de célula no ano de 2002, receberá a numeração 01/PT-XYZ/02. A seqüência

  numérica das cadernetas de célula será mantida independente da mudança de ano.

  EXEMPLO: Uma aeronave usada de marcas PT-XYZ, ao efetuar a abertura da caderneta

  de célula no ano de 2002, que já possua 4 (quatro) cadernetas anteriores, receberá a

  numeração 05/PT-XYZ/02.'
