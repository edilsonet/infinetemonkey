text: '5.1.3.2 Caderneta de Motor: Número sequencial / modelo do motor / dois últimos dígitos
  do ano

  em que foi efetuado o Termo de Abertura da caderneta do motor.

  EXEMPLO: Um motor usado, de fabricante Teledyne Continental, modelo IO-470C, ao

  efetuar a abertura da caderneta de motor no ano de 2002, que já possua 2 (duas) cadernetas

  anteriores, receberá a numeração 03/IO-470C/02.'
