text: '5.1.3.3 Caderneta de Hélice: Número sequencial / modelo da hélice / dois últimos dígitos
  do ano

  em que foi efetuado o Termo de Abertura da caderneta de hélice.

  EXEMPLO: Uma hélice usada, de fabricante Hartzell, modelo HC-B3YT-3C, ao efetuar a

  abertura da caderneta de hélice no ano de 2002, que já possua 1 (uma) caderneta anterior,

  receberá a numeração 02/HC-B3YT-3C/02.'
