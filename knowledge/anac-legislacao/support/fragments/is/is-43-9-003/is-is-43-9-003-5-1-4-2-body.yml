text: '5.1.4.2 Com o objetivo de manter a rastreabilidade dos registros, deverá constar o
  seguinte texto

  no campo “Observações” do Termo de Encerramento da caderneta de célula das marcas ouOrigem:
  SAR 4/47

  Data de emissão: 28.02.2020 IS nº 43.9-003

  Revisão B

  modelo anterior: “Esta aeronave adquiriu as novas marcas PT-XYZ ou modelo XXXX em

  dd/mm/aaaa, sendo seus registros encerrados na página...”. Assim como, deverá constar o

  seguinte texto no campo “Observações” do Termo de Abertura da primeira caderneta de

  célula das novas marcas ou modelo: “Esta aeronave possuía anteriormente as marcas PT-

  XYZ ou modelo XXXX”.'
