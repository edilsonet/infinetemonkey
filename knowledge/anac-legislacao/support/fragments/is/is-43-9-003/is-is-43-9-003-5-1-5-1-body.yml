title: A numeração da caderneta de motor ou de hélice, caso os mesmos sofram mudança de
text: '5.1.5.1 A numeração da caderneta de motor ou de hélice, caso os mesmos sofram mudança
  de

  modelo, deverá manter a ordem sequencial existente, de acordo com o subparágrafo 5.1.3.2

  ou 5.1.3.3 desta IS, acrescentando o novo modelo na numeração da nova caderneta de

  motor ou de hélice, devendo ser feito o encerramento da caderneta de modelo anterior.

  Todas as cadernetas encerradas, pertencentes ao modelo anterior, deverão permanecer no

  acervo da aeronave até que ocorra a remoção dos mesmos.'
