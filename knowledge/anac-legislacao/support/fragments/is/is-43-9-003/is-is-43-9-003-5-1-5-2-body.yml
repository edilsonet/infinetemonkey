text: '5.1.5.2 Com o objetivo de manter a rastreabilidade dos registros, deverá constar o
  seguinte texto

  no campo “Observações” do Termo de Encerramento da caderneta de motor ou de hélice

  do modelo anterior: “Este motor ou hélice adquiriu o novo modelo XXXX em

  dd/mm/aaaa”. Assim como, deverá constar o seguinte texto no campo “Observações” do

  Termo de Abertura da primeira caderneta do novo modelo: “Este motor ou hélice possuía

  anteriormente o modelo XXXX”.'
