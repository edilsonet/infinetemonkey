text: '5.1.5.3 Caso ocorra mudança das marcas da aeronave, não será necessário serem encerradas
  as

  cadernetas de motor e de hélice, devendo constar o seguinte texto no campo “Observações”

  do Termo de Abertura das atuais cadernetas de motor e de hélice: “Este motor ou hélice se

  encontra instalado na aeronave que adquiriu as novas marcas XXXX em dd/mm/aaaa”.

  5.2 Conteúdo das Cadernetas de Célula, de Motor e de Hélice'
