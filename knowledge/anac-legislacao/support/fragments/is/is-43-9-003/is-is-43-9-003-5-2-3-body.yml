text: '5.2.3 Termo de Abertura: Todas as cadernetas de célula, de motor e de hélice deverão
  conter,

  logo após o Prefácio, o Termo de Abertura. O objetivo do Termo de Abertura é registrar

  todos os dados técnicos e informativos na data de abertura do referido termo. O conteúdo

  de todo Termo de Abertura deverá conter, no mínimo, o estabelecido nos modelos

  constantes dos apêndices desta IS, podendo ser adicionadas outras informações julgadas

  pertinentes.'
