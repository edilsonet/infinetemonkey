text: 'e) Para célula: Tempo Desde Novo (TSN), Ciclos Desde Novo (CSN), Código e

  Rubrica da pessoa que transcreveu os dados no campo “Controle Total”. Para motor:

  Tempo Desde Novo (TSN), Ciclos Desde Novo (CSN), Tempo Desde Revisão Geral

  (TSO), Ciclos Desde Revisão Geral (CSO), Código e Rubrica da pessoa que transcreveu os

  dados no campo “Controle Total”. Para hélice: Tempo Desde Novo (TSN), Tempo Desde

  Revisão Geral (TSO), Código e Rubrica da pessoa que transcreveu os dados no campo

  “Controle Total”, conforme aplicável.Origem: SAR 6/47

  Data de emissão: 28.02.2020 IS nº 43.9-003

  Revisão B'
