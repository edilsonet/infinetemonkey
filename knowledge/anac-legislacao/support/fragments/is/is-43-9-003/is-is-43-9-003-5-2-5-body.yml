text: '5.2.5 Parte II - Registros Primários de Serviços de Manutenção, Inspeção, Revisão,

  Pequenas Modificações e Pequenos Reparos: Todas as cadernetas de célula, de motor e

  de hélice deverão conter, logo após a Parte I, a Parte II, que se constitui no local destinado

  aos registros primários de serviços de manutenção, substituição de peças, inspeção,

  revisão, pequenas modificações e pequenos reparos realizados na aeronave, no motor ou na

  hélice. O conteúdo da Parte II deverá conter, no mínimo, o estabelecido nos modelos

  constantes dos apêndices desta IS, podendo ser adicionadas outras informações julgadas

  pertinentes e visa ao registro do seguinte:'
