title: 5.2.5(e)
text: 'e) Para célula: Tempo Desde Novo (TSN) e Ciclos Desde Novo (CSN). Para motor:

  Tempo Desde Novo (TSN), Ciclos Desde Novo (CSN), Tempo Desde Revisão Geral

  (TSO) e Ciclos Desde Revisão Geral (CSO). Para hélice: Tempo Desde Novo (TSN) e

  Tempo Desde Revisão Geral (TSO), conforme aplicável;'
