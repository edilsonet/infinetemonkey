text: '5.2.6 Parte III - Registros Secundários de Diretrizes de Aeronavegabilidade, Grandes

  Modificações e Grandes Reparos: Todas as cadernetas de célula, de motor e de hélice

  deverão conter, logo após a Parte II, a Parte III, que se constitui no local destinado aos

  registros secundários de Diretrizes de Aeronavegabilidade, Grandes Modificações e

  Grandes Reparos executados. O conteúdo da Parte III deverá conter, no mínimo, o

  estabelecido nos modelos constantes dos apêndices desta IS, podendo ser adicionadas

  outras informações julgadas pertinentes e visa ao registro do seguinte:'
