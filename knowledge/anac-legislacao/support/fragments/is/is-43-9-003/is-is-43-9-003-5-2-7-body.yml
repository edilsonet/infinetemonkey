text: '5.2.7 Parte IV - Registros Primários de Instalação e Remoção de Componentes: Todas
  as

  cadernetas de célula, de motor e de hélice deverão conter, logo após a Parte III, a Parte
  IV,

  que se constitui no local destinado aos registros primários de instalação e remoção de

  componentes controlados. O conteúdo da Parte IV deverá conter, no mínimo, o

  estabelecido nos modelos constantes dos apêndices desta IS, podendo ser adicionadas

  outras informações julgadas pertinentes e visa ao registro do seguinte:'
