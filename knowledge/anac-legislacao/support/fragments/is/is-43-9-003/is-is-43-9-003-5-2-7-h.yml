title: 5.2.7(h)
text: 'h) Para célula e motor: Tempo Desde Novo (TSN), Ciclos Desde Novo (CSN), Tempo

  Desde Revisão Geral (TSO) e Ciclos Desde Revisão Geral (CSO) do componente instalado

  ou removido. Para hélice: Tempo Desde Novo (TSN) e Tempo Desde Revisão Geral

  (TSO) do componente removido ou instalado, conforme aplicável;'
