title: 'Termo de Encerramento: Todas as cadernetas de célula, de motor e de hélice deverão'
text: '5.2.8 Termo de Encerramento: Todas as cadernetas de célula, de motor e de hélice deverão

  conter, logo após a Parte IV, o Termo de Encerramento. O objetivo do Termo de

  Encerramento é registrar todos os dados técnicos e informativos na data de encerramento

  do mesmo. O conteúdo do Termo de Encerramento deverá conter, no mínimo, o

  estabelecido nos modelos constantes dos apêndices desta IS, podendo ser adicionadas

  outras informações julgadas pertinentes.Origem: SAR 8/47

  Data de emissão: 28.02.2020 IS nº 43.9-003

  Revisão B

  5.3 Instruções Para Confecção das Cadernetas de Célula, de Motor e de Hélice'
