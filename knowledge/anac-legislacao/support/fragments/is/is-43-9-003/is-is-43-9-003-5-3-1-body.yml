text: '5.3.1 Impressão das Cadernetas de Célula, de Motor e de Hélice: As providências para
  a

  impressão das cadernetas de célula, de motor e de hélice, em concordância com esta IS,

  serão de responsabilidade do proprietário ou do operador da aeronave. É permitida a

  impressão das páginas das cadernetas de célula, de motor e de hélice em frente e verso.'
