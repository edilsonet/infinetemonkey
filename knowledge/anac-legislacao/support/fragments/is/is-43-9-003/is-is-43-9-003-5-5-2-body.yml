title: As cadernetas de célula, de motor e de hélice deverão ser mantidas de forma permanente
text: '5.5.2 As cadernetas de célula, de motor e de hélice deverão ser mantidas de forma permanente

  não sendo necessário portá-las a bordo, em virtude da regulamentação vigente sobre os

  Diários de Bordo das aeronaves civis brasileiras.'
