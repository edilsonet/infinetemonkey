title: A referência de horas e ciclos para registro nas cadernetas de célula, de motor e de
  hélice
text: '5.6.1 A referência de horas e ciclos para registro nas cadernetas de célula, de motor
  e de hélice

  serão as horas constantes dos Diários de Bordo, por meio das páginas devidamente

  assinadas dos mesmos. Sempre que for feito registro de horas e ciclos nas cadernetas de

  célula, de motor e de hélice, deverá ser tomado como referência o total de horas de vôo
  e

  ciclos atualizadas dos Diários de Bordo.'
