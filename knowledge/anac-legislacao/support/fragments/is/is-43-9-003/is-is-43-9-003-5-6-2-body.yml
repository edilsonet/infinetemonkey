title: A atualização da Parte I das cadernetas de célula, de motor e de hélice, obrigatoriamente,
text: '5.6.2 A atualização da Parte I das cadernetas de célula, de motor e de hélice, obrigatoriamente,

  deverá ser feita até o quinto dia do mês subseqüente, sempre que houver alteração dos

  tempos de funcionamento citados nos parágrafos 4.4 e 4.5 desta IS. Desta forma, caso uma

  aeronave, motor ou hélice opere, após um período inativo maior que um mês, deverá ser

  citada essa inatividade numa única linha no campo Controle Mensal das Partes I das

  respectivas cadernetas. Ex: Não totalizadas horas de 30/04/02 a 30/09/02 - motivo IAM.'
