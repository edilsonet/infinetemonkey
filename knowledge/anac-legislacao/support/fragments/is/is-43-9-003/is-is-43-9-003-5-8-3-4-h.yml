text: 'h) Nome, Código e Assinatura → preencher com o nome, código ANAC e assinatura do

  mecânico e do inspetor que supervisionou o serviço na função de Inspetor da empresa; ou

  com o CREA do Tecnólogo ou do Engenheiro responsável pelo retorno ao serviço da

  aeronave.'
