  CADERNETA DE HÉLICE

  P R E F Á C I O

  Esta Caderneta de Hélice tem o objetivo precípuo de registrar todos os serviços e controles
  técnicos pertinentes à hélice,

  objetivando, principalmente, a manter a escrituração em ordem e em dia e, desta forma, ter
  o controle de aeronavegabilidade de acordo com o

  estabelecido nos RBHA/RBAC aplicáveis. Ensejamos aos responsáveis pela escrituração o estrito
  cumprimento dos regulamentos aplicáveis,

  como também a total fidelidade dos registros, de maneira que a segurança de vôo seja preservada
  em função da real execução dos serviços e da

  adequada escrituração dos registros.

  Enfatizamos que o CBA estabelece além de multa, suspensão ou cassação de certificado de
  habilitação para os casos de

  procedimento ou prática, no exercício das funções, que revelem falta de idoneidade profissional
  para o desempenho das prerrogativas dos

  certificados de habilitação técnica.

  Ressaltamos, também, que os casos de anotações, reproduções e alterações fraudulentas ou
  com tal propósito, ou, ainda,

  intencionalmente falsas, em qualquer registro ou relatório que seja requerido fazer, conservar
  ou usar para demonstrar conformidade com

  qualquer requisito previsto pela regulamentação aplicável, poderá incorrer na suspensão
  ou revogação do seu certificado, conforme aplicável

  pela legislação em vigor.Origem: SAR 40/47

  17/08/2012 IS nº 43.9-003

