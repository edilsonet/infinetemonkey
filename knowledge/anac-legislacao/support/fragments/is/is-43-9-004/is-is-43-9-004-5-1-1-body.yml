  e
text: '5.1.1 O processo de autorização para utilização do SDRMe é aplicável a todos os operadores
  e

  organizações de manutenção certificados pela ANAC. As organizações de manutenção

  estrangeiras que prestam serviço para operadores brasileiros sob as condições estabelecidas

  em acordo bilateral, quando optarem pela utilização de sistemas eletrônicos, devem seguir
  o

  que foi determinado no acordo.'
