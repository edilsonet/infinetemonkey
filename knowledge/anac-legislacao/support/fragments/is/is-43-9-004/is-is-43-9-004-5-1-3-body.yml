text: '5.1.3 Os requisitos de conteúdo, disposição, guarda e transferência desses registros,
  entre outros,

  se encontram nos Regulamentos Brasileiros de Aviação Civil e na Resolução 458, e a

  migração dos registros para o formato eletrônico mantém a exigência de cumprimento desses

  requisitos.'
