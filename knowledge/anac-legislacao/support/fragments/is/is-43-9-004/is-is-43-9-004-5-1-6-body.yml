title: Ao optar pela utilização do SDRMe em substituição ao registro de manutenção e documentos
text: '5.1.6 Ao optar pela utilização do SDRMe em substituição ao registro de manutenção e
  documentos

  em papel, o regulado deverá ler os regulamentos com as adaptações de interpretação textual

  que se fizerem necessárias em virtude da alteração de meio impresso para meio digital como,

  por exemplo, interpretar como “assinatura eletrônica” a leitura dos termos “rubrica” ou

  “assinatura” em regulamento.'
