text: '5.2.3 Para todo registro de manutenção devem ser identificadas as pessoas, conforme
  aplicável,

  responsáveis pela execução, inspeção, aprovação da ação corretiva ou tarefa de manutenção

  realizada para retorno ao serviço por aposição de seu código ANAC, assinatura eletrônica,

  segundo RBAC nº 43, 91, 121, 135, 137 e 145, conforme aplicável.Data de Publicação: 08/11/2019
  IS Nº 43.9-004

  Revisão A'
