title: Quando a informação de um documento eletrônico for impressa, deve haver um meio para
text: '5.2.4 Quando a informação de um documento eletrônico for impressa, deve haver um meio
  para

  identificar a data e a hora da impressão e a versão do documento. Isso assegura a atualidade

  da informação por permitir que o usuário compare a data da informação impressa com a data

  da informação contida no documento eletrônico.'
