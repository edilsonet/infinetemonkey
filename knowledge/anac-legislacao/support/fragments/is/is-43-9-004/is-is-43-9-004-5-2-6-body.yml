title: Todos os dados autorizados devem estar registrados em SDRMe conforme a Resolução 458,
text: '5.2.6 Todos os dados autorizados devem estar registrados em SDRMe conforme a Resolução
  458,

  e assinados digitalmente pelo operador ou OMA, conforme aplicável ao respectivo sistema,

  dentro do prazo de até 30 dias corridos a partir do retorno da aeronave ao serviço.

  5.3 Implementação de SDRMe'
