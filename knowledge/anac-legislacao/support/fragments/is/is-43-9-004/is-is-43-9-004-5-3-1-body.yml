cite: 5.3.1
title: O regulado pode utilizar SDRMe para registros requeridos de manutenção de aeronaves,
text: '5.3.1 O regulado pode utilizar SDRMe para registros requeridos de manutenção de aeronaves,

  assim como para manuais e demais documentos de manutenção (ex. registro de treinamento

  de mecânico, liberação de aeronavegabilidade, etc.). Essa implementação não precisa ser

  feita para todos os tipos de documentos e registros de manutenção, podendo ser realizada

  em partes à conveniência do regulado.'
