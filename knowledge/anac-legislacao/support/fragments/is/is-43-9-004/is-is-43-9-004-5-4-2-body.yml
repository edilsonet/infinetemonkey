title: Além dos procedimentos requeridos pela Resolução 458, os requerentes devem estabelecer
text: '5.4.2 Além dos procedimentos requeridos pela Resolução 458, os requerentes devem estabelecer

  em seus manuais os procedimentos operacionais necessários à correta utilização do SDRMe,

  assim como os procedimentos para os demais sistemas informatizados utilizados para

  documentos de manutenção.'
