text: '5.4.3 Em cumprimento ao art. 4°, V, b, 10, letra c da Resolução 458, devem ser estabelecidos

  procedimentos para sequenciar pessoas que deverão assinar eletronicamente tarefas de

  manutenção como executor, inspetor, aprovador para retorno ao serviço e que deverão

  assinar digitalmente, segundo o item 5.3.7 desta IS.'
