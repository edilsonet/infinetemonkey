title: Procedimentos devem ser estabelecidos para que, em caso de terceirização/subcontratação
text: '5.4.6 Procedimentos devem ser estabelecidos para que, em caso de terceirização/subcontratação

  de manutenção, os registros de manutenção sejam inseridos de forma adequada no SDRMe

  do operador da aeronave. Se houver necessidade de preenchimento de algum registro de

  manutenção eletrônico pelo contratado nesse sistema, o operador deve cadastrar as pessoas

  que, de acordo com o RBAC 43, forem requeridas preencher e assinar eletronicamente

  registros no SDRMe.'
