text: '5.5.2 Usuários de documentos eletrônicos que optarem por imprimir material (informações
  de

  dados, instruções, procedimentos, etc.) do documento eletrônico devem possuir

  procedimento para assegurar que as informações impressas utilizadas estão atualizadas e
  que

  o material desatualizado seja descartado.'
