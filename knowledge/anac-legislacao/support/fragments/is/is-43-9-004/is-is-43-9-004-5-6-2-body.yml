title: Deve constar do processo de solicitação a informação do SDRMe a ser utilizado, a
text: '5.6.2 Deve constar do processo de solicitação a informação do SDRMe a ser utilizado,
  a

  identificação do sistema e os tipos de documentos que serão substituídos por formato digital,

  os manuais revisados para contemplarem os procedimentos necessários a subsidiar a

  autorização, uma lista dos equipamentos utilizados pelo sistema, assim como todas as

  exigências estabelecidas pela Resolução 458.'
