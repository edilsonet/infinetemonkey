title: Após a emissão da autorização para uso do SDRMe, não é necessária a submissão de um
text: '5.6.3 Após a emissão da autorização para uso do SDRMe, não é necessária a submissão
  de um

  processo de alteração de EO ou LOA para a inclusão de novos tipos de registros ou

  documentos de manutenção, desde que sejam mantidos o sistema e a versão autorizados

  previamente. Os manuais e programas da empresa ou operador devem ser atualizados sempre

  que necessário.Data de Publicação: 08/11/2019 IS Nº 43.9-004

  Revisão A'
