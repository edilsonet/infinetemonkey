text: '5.6.7 Fica a critério da ANAC a necessidade ou não da realização de auditoria para
  a fase de

  demonstração. Se for solicitada auditoria para prosseguimento do processo de autorização

  do SDRMe, durante a fase de demonstrações serão verificados os equipamentos, o uso,

  acessos, funcionalidades e operacionalidade do SDRMe perante as operações do regulado.'
