title: A autorização para a utilização do SDRMe será emitida em nome do regulado (operador,
text: '5.6.9 A autorização para a utilização do SDRMe será emitida em nome do regulado (operador,

  organização de manutenção, etc., conforme aplicável) e será registrada:

  5.6.9-I Nas Especificações Operativas para os operadores 121, 135, 137 e OMA 145;

  5.6.9-II Em carta de autorização do tipo “LOA - Letter of Authorization” para os operadores

  segundo o RBHA 91.'
