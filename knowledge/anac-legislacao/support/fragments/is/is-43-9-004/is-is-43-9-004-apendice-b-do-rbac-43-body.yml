title: Apêndice B do RBAC 43.
text: 'Apêndice B do RBAC 43.

  bb) Disposição dos registros de manutenção pelos operadores - seção 91.417(c)

  cc) Registros do pessoal de administração, supervisão e inspeção das organizações de

  manutenção - seção 145.161 do RBAC 145.

  dd) Registros de controle de calibrações periódicas - seção 145.109(b)-II do RBAC 145.

  ee) Registros de cumprimento do programa de treinamento do pessoal de organizações de

  manutenção - 145.163(c)

  ff) Documentos e registros relacionados ao SGSO nas organizações de manutenção - seção

  145.214-I do RBAC 145.

  gg) Arquivamento e disposição dos registros nas organizações de manutenção - seção

  145.219 do RBAC 145.

  hh) Descrição no conteúdo do manual de um sistema de conservação e recuperação de

  informações de serviços realizados, seção 121.369(c) do RBAC 121.

  ii) Descrição sobre preenchimento e arquivamento de registros de manutenção no conteúdo

  do manual, seção 135.23(a)(24) do RBAC 135.Data de Publicação: 08/11/2019 IS Nº 43.9-004

  Revisão A

  4 DEFINIÇÕES

  4.1 Adicionalmente às definições constantes no Regulamento Brasileiro de Aviação Civil -

  esclarecimentos.

  4.2 dados significativos: informações de qualquer natureza requeridas pela legislação e

  regulamentos aeronáuticos para fins de certificação e fiscalização das atividades exercidas

  pelos entes regulados.

  4.3 documento: dados significativos e os meios físicos ou digitais nos quais estão contidos

  Exemplo: Uma via de ordem de serviço, um formulário de aprovação para retorno ao serviço

  (SEGVOO 003) ou uma planilha para controle de calibração de instrumentos, disponíveis

  para preenchimento em meios físicos ou digitais, são considerados documentos.

  Nota: Documentos são passíveis de modificações de interesse do seu desenvolvedor/usuário

  ou por exigências previstas na legislação e regulamentos aeronáuticos aplicáveis.

  4.4 registro: documento preenchido e emitido por um ente regulado, que obrigatoriamente

  apresenta evidências objetivas da realização de uma determinada atividade sujeita às

  exigências previstas na legislação e regulamentos aeronáuticos aplicáveis.

  Exemplo: Uma via de ordem de serviço, um formulário de aprovação para retorno ao serviço

  (SEGVOO 003) ou uma planilha para controle de calibração de instrumentos, quando

  preenchidos e emitidos em meios físicos ou digitais, são considerados registros.

  Nota 1: Um registro é considerado errôneo quando há falhas em seu preenchimento físico

  ou digital que comprometem sua completude ou exatidão, mas que não afetam sua

  regularidade.

  Nota 2: Um registro é considerado irregular quando seu preenchimento e emissão não

  atendem às exigências previstas na legislação e regulamentos aeronáuticos aplicáveis.

  Nota 3: Um registro emitido de forma errônea ou irregular deve ser claramente identificado

  como inválido, conservado, e substituído por outro que contenha os dados corrigidos ou

  regularizados e a referência ao número de controle do registro emitido originalmente.

  Nota 4: A legibilidade é uma característica indispensável para atestar a regularidade de

  um documento ou registro para fins de certificação ou fiscalização.

  4.5 Sistema de Documentos e Registros de Manutenção Eletrônicos (SDRMe): conjunto

  formado pelo(s) dispositivo(s) (hardware), programa(s) (software) e demais elementos

  materiais necessários ao funcionamento do sistema de registro e guarda de informações

  eletrônicos. Este sistema deverá ser aceito pela ANAC, conforme os termos da Resolução

  458.Data de Publicação: 08/11/2019 IS Nº 43.9-004

  Revisão A

  5 DESENVOLVIMENTO DO ASSUNTO

  5.1 Disposições Gerais'
