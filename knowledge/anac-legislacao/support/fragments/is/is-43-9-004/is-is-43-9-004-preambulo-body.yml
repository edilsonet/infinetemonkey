title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 43.9-004

  Revisão A

  Aprovado por: Portaria nº 3.358/SAR, de 29 de outubro de 2019.

  Assunto: Sistema de Documentos e Registros de

  Manutenção Eletrônicos - SDRMe

  1 OBJETIVO

  Estabelecer procedimentos mínimos a serem observados no uso e fiscalização dos sistemas

  informatizados para registro e guarda de informações relativas à manutenção de aeronaves,

  em substituição aos registros em papel.

  2 REVOGAÇÃO

  N/A

  3 FUNDAMENTOS

  3.1 A Resolução ANAC n° 458, de 20 de dezembro de 2017, doravante chamada de Resolução

  458, regulamenta o uso de sistemas informatizados para registro e guarda de informações

  por regulados da Agência Nacional de Aviação Civil - ANAC, em substituição aos registros

  em papel.

  3.2 Quando houver menção nesse documento à Resolução 458, deve ser entendido como a

  resolução que trata de sistemas informatizados para registro e guarda de informações por

  regulados da Agência Nacional de Aviação Civil, podendo se tratar de instrumento

  normativo que venha a substituir ou alterar a atual Resolução 458.

  3.3 A Resolução nº 511, de 11 de abril de 2019, altera a Resolução 458 possibilitando o
  uso do

  Blockchain para sistemas informatizados de registro. Neste caso, os procedimentos descritos

  nesta Instrução podem requerer adaptações quanto a aplicabilidade.

  3.4 O RBAC 43 versa sobre o conteúdo, forma e disposição de registros de manutenção,

  manutenção preventiva, reconstrução e alteração.

  3.5 Faz-se necessário esclarecer que todos os requisitos referentes aos registros de manutenção

  e documentos emitidos em meios físicos também são aplicáveis aos registros emitidos e

  informações guardadas em meios digitais aceitáveis, nos termos desta IS.

  3.6 Apesar de não se constituir uma lista exaustiva, em função do disposto no subitem 3.1,
  os

  seguintes requisitos também são aplicáveis à gestão dos diversos tipos de registros de

  manutenção preenchidos e emitidos em meios digitais:'
