title: '60.14'
text: '60.14

  15

  A política, processo ou procedimento especificando como o operador vai apresentar à ANAC
  uma solicitação de avaliação do FSTD para qualificação inicial em um nível específico com
  antecedência mínima de 90 dias à data de avaliação.

  60.15(a)

  16

  A política, processo ou procedimento especificando como o Representante do operador providenciará
  a declaração assinada confirmando que:

  60.15(b)

  16.1

  O desempenho e a qualidade de voo do FSTD representam aqueles da aeronave ou conjunto de
  aeronaves sendo simulada dentro do envelope normal de operação. Esta declaração deverá ser
  feita por um piloto qualificado na aeronave ou conjunto de aeronaves conforme QPS aplicável;

  60.15(b)(1)

  16.2

  Os sistemas e sub-sistemas do FSTD (incluindo os sistemas simulados da aeronave) representam
  o funcionamento daqueles da aeronave ou conjunto de aeronaves. Esta declaração deverá ser
  confirmada por um piloto qualificado na aeronave ou conjunto de aeronaves sendo simuladas,
  ou por uma pessoa treinada em sistemas e subsistemas de FSTDs e treinada na operação dos
  sistemas da aeronave simulada;

  60.15(b)(2)

  16.3

  A cabine de comando representa a configuração do tipo específico ou do modelo e série da
  aeronave sendo simulada, como apropriado. Esta declaração deverá ser confirmada por um piloto
  qualificado na aeronave ou conjunto de aeronaves sendo simulada, ou por uma pessoa treinada
  em configuração e operação da aeronave simulada;

  60.15(b)(3)

  17

  A política, processo ou procedimento que especifica como os testes subjetivos e objetivos
  são realizados na localidade permanente onde o FSTD será operado.

  60.15(e)

  18

  A política, processo ou procedimento que especifica como o operador irá prover à ANAC acesso
  ao FSTD pelo tempo necessário para completar a avaliação do FSTD para qualificação inicial,
  o que inclui a realização de testes objetivos, subjetivos e funcionais, bem como a verificação
  de requisitos gerais de FSTD, conforme descrito no QPS, para determinar que o FSTD cumpre
  todos os requisitos aplicáveis ao nível de qualificação pretendido.

  60.15(f)

  19

  A política, processo ou procedimento especificando como o operador irá atualizar o QTG com
  os resultados dos testes executados na presença da ANAC, após a conclusão da qualificação
  inicial.

  60.15(h)

  20

  A política, processo ou procedimento especificando como o operador vai disponibilizar o
  MQTG quando solicitado pela ANAC.

  60.15(i)

  21

  A política, processo ou procedimento especificando como o operador irá submeter à ANAC um
  FSTD atualmente qualificado para qualificações adicionais conforme RBAC 60.16.'
