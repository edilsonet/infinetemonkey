text: '60.20

  28

  A política, processo ou procedimento especificando como o operador irá solicitar uma qualificação
  inicial com base no pacote de dados final aprovado pelo fabricante da aeronave, no caso
  de uma qualificação provisória de FSTD(s) de novos tipos ou modelos de aeronaves conforme
  RBAC 60.21.'
