text: '60.21 (c )

  29

  A política, processo ou procedimento especificando como o operador determina que uma modificação
  de FSTD é classificada como modificação, conforme definido no RBAC 60.23(a)(1) e (a)(2).

  60.23(a)(1) e (a)(2)

  30

  A política, processo ou procedimento especificando como o operador vai garantir o cumprimento
  de uma Diretriz de FSTD.

  60.23(b)

  31

  A política, processo ou procedimento especificando como o operador irá notificar a ANAC
  da sua intenção de utilização de um FSTD modificado e como o operador garante que o FSTD
  modificado não será usado antes:

  60.23(c)(1)

  31.1

  Da resposta da ANAC de que a modificação foi aprovada;

  60.23(c )(1)(i)

  31.2

  Que o operador realizou com sucesso qualquer avaliação que a ANAC determinou ser necessária,
  antes de ser recolocado em operação com a modificação proposta;

  60.23(c )(1)(ii)

  31.3

  Que a notificação cumpre com o especificado no QMS aplicável.'
