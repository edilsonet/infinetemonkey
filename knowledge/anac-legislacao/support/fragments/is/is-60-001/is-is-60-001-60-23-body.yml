text: '60.23 (c )(2)

  32

  A política, processo ou procedimento especificando como o operador vai emitir e anexar o
  adendo ao Certificado de Qualificação, conforme RBAC 60.23(a), até que seja emitido um Certificado
  atualizado.

  RBAC 60.23(d)

  33

  A política, processo ou procedimento especificando como o MQTG será atualizado e submetido
  à ANAC, após uma modificação de FSTD que afete um teste objetivo ou outra seção o MQTG.

  RBAC 60.23(e)

