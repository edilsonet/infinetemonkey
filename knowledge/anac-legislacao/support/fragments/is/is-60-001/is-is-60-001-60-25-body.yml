text: '60.25 (c )

  35

  O manual deverá indicar a política, processo ou procedimento especificando como o operador
  irá notificar a ANAC quando solicitar uma requalificação do FSTD movido ou reinstalado em
  um local diferente.

  60.27(a)(3)

  36

  A política, processo ou procedimento especificando como o operador vai manter o controle
  dos seguintes registros (Os registros especificados nesta seção devem ser mantidos escritos
  em língua portuguesa ou inglesa, ou de forma codificada, se a forma de codificação for capaz
  de preservar e recuperar a informação de forma aceitável pela ANAC):'
