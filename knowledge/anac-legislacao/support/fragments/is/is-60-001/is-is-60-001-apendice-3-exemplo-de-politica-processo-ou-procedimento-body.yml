text: 'Apêndice 3 - exemplo de política, processo ou procedimento

  ------------------------------------------------------------------------------------------------------------------------

  Seção 8- SBGR Linhas Aéreas LTDA-Manual QMS

  8-Seleção do Representante do operador (o título)

  8.1- Objetivo do procedimento (a finalidade)


  8.1.1. Este procedimento define os critérios de seleção do Representante do operador, com
  atribuições e responsabilidades para cada FSTD qualificado e programa QMS da SBGR Linhas
  Aéreas LTDA., conforme estabelecido pela ANAC na seção 60.7(c) do RBAC 60.

  8.2- Escopo


  8.2.1- Este procedimento se aplica a todos os FSTD da organização.


  8.3 - Reponsabilidade'
