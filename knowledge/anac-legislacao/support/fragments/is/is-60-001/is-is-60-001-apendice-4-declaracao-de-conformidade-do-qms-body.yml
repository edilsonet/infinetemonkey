title: Apêndice 4 - declaração de conformidade do qms
text: 'Apêndice 4 - declaração de conformidade do qms

  A Declaração de conformidade do QMS deve auxiliar a ANAC na análise do manual QMS, com o
  objetivo de garantir que o operador de FSTD relacione todos elementos mínimos listados no
  Apêndice 1 dessa IS em seu manual, além de proporcionar, de maneira rápida, um indicativo
  de como o operador executa as políticas, os processos e os procedimentos do programa de
  QMS.

  A Declaração de conformidade deve ser entregue juntamente com o Manual QMS e outros documentos
  que complementam o manual, não só na apresentação inicial, como também nas revisões propostas
  pelo operador ou pela ANAC após alguma inspeção do programa QMS.

  O operador de FSTD deve prestar a devida atenção na elaboração da Declaração de conformidade,
  pois o correto preenchimento, permite direcionar adequadamente a ANAC na análise do programa
  QMS. Da mesma forma, auxilia nas inspeções, proporcionando agilidade ao processo de aprovação
  e vigilância do programa QMS.

  O formulário pode ser baixado em: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/simuladores-de-voo-fstd/formularios-modelos-e-referencias'
