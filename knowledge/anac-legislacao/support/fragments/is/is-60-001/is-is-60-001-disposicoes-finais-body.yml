title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  13.1 Os operadores de FSTD que já possuem dispositivos qualificados pela ANAC, mas que ainda
  não possuem um QMS aprovado, deverão se adequar ao disposto nessa IS em até 6 meses contados
  a partir da publicação dessa IS.

  13.2 Os casos omissos serão dirimidos pela SPL.

  13.3 Esta IS entra em vigor em 2 de maio de 2023.'
