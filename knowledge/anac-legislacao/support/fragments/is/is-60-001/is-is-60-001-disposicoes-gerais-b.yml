cite: disposicoes-gerais(b)
title: disposicoes-gerais(b)
text: b) Um representante do operador. Com plena autoridade para monitorar as qualificações
  em andamento dos FSTDs a ele designados para garantir que todos os aspectos referentes às
  qualificações sejam conduzidas conforme estabelecido no RBAC 60. O representante do operador
  deve garantir que o QMS, seja devidamente estabelecido, executado e mantido.
