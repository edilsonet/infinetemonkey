text: 'l) registro da auditoria. Um relatório deve ser elaborado contendo informações a respeito
  da auditoria de uma forma clara, concisa e completa, a confecção do conteúdo do relatório
  da auditoria deve ser de responsabilidade do líder da equipe, que tomará como base os seus
  próprios registros e os registros dos demais auditores da equipe.

