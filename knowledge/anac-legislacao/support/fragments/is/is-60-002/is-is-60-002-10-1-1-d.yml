title: 10.1.1(d)
text: 'd) Fase 4: Inspeção do FSTD.

  Com não menos do que 5 dias de antecedência ao início da inspeção, o representante do operador
  deve enviar uma declaração de que um piloto habilitado e qualificado na aeronave simulada
  avaliou subjetivamente o FSTD nas áreas modificadas ou não avaliadas anteriormente.

  A ANAC irá coordenar com o operador a inspeção para avaliar as modificações implementadas
  no FSTD. O tempo necessário varia de acordo com a quantidade de modificações, sua complexidade
  e o impacto que elas causarão no FSTD.

  Durante a inspeção, a ANAC reporta ao interessado quaisquer não conformidades encontradas
  no FSTD. Ao final da inspeção, a ANAC gera um relatório de avaliação de FSTD.'
