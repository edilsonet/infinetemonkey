text: '12.5.1 Processo 1 (60.37(b)): FSTDs localizados em Centros de Treinamento validados
  no exterior

  Um Centro de Treinamento da Aviação Civil localizado no exterior e que seja validado pela
  ANAC segundo o RBAC 142 já obtém a validação da ANAC de todos os seus FSTDs de forma automática,
  observado o disposto nos parágrafos 10.1 e 10.2 dessa IS. Para esses FSTDs a ANAC não emite
  certificado de qualificação, mas eles são considerados qualificados pela ANAC para todos
  os efeitos. Não é necessário solicitar a validação de FSTD para esses dispositivos.'
