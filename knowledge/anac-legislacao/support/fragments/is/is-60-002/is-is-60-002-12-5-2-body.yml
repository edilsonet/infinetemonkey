text: '12.5.2 Processo 2 (60.37(a)): FSTDs localizados em outras organizações no exterior.

  FSTDs que sejam operados por organizações no exterior que não sejam Centros de Treinamento
  validados pela ANAC são elegíveis ao processo de validação na ANAC, observado o disposto
  nos parágrafos 10.1 e 10.2 dessa IS. Para esses FSTDs, é necessário que a ANAC valide individualmente
  cada FSTD, emitindo um Certificado de Qualificação ao final do processo de validação. Os
  procedimentos são:

  1) Enviar à ANAC, por meio físico ou, preferencialmente, eletrônico:


  Carta com a solicitação para validação do FSTD;

  Formulário FORM 60-02;

  Comprovante de pagamento da TFAC aplicável;

  Certificado de Qualificação e relatório da última avaliação da autoridade primária;

  Lista dos testes de QTG rodados nos últimos 12 meses, assinada pelo gestor responsável do
  FSTD ou por um técnico do operador, atestando que foram verificados.

  2) Após análise da documentação enviada, a ANAC emite o Certificado de Qualificação do FSTD.'
