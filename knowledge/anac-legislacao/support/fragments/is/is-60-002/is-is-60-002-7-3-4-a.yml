cite: 7.3.4(a)
title: 7.3.4(a)
text: 'a) Fase 1: Contato inicial com a ANAC: definir base de qualificação e nível de qualificação.

  A organização interessada define o nível a que se pretende qualificar o FSTD. O nível do
  FSTD define quais tarefas/manobras poderão ser creditadas para o treinamento do piloto,
  portanto recomenda-se que a definição do nível do FSTD seja feita em conjunto com a equipe
  de treinamento do interessado.

  Paralelamente, a organização deve definir junto à ANAC a base de qualificação de FSTD, conforme
  discutido nos parágrafos 7.2 a 7.4 dessa IS.

  Durante essa fase de definição de nível e base de qualificação, pode-se entrar em contato
  com a ANAC por meio do FalaBR para dirimir quaisquer dúvidas em relação ao processo de qualificação
  inicial.'
