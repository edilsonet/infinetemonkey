title: 'Para Dispositivo de Treinamento (FTD) de Helicóptero:'
text: '7.3.4 Para Dispositivo de Treinamento (FTD) de Helicóptero:

  - RBAC 60, Apêndice D;

  - 14CFR Part 60 - Appendix D - Attachment 2 - Flight Training Device (FTD) Objective Tests;

  - 14 CFR Part 60 - Appendix D - Flight Training Device (FTD) Subjective Evaluation.

  7.4 De forma excepcional, conforme previsto no parágrafo 60.15(c)(2), um FSTD fabricado
  anteriormente à data de publicação do RBAC 60 e que esteja qualificado por autoridade aeronáutica
  de um país signatário da Convenção de Aviação Civil Internacional poderá ser avaliado para
  qualificação inicial, de acordo com os requisitos estabelecidos na sua base de qualificação
  original, desde que autorizado pela ANAC.

  7.4.1 A intenção da ANAC com essa concessão é estimular a instalação no Brasil de dispositivos
  que estejam instalados em outro país signatário e que estejam qualificados pela autoridade
  de aviação daquele país. A ANAC avaliará cada caso individualmente, podendo negar a avaliação
  de acordo com o disposto em 60.15(c)(2).

  7.4.2 Exemplos de base de qualificação que podem ser aceitas pela ANAC sob esse procedimento
  são: 14CFR Part 60 (FAA), CS-FSTD (EASA), JAR FSTD A (EASA), JAR STD 1A (EASA), AC 121-14
  (FAA), AC 120-40C (FAA).]

  7.5 Procedimentos para solicitar uma qualificação inicial de FSTD.'
