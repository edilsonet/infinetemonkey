cite: 7.3.4(d)
title: 7.3.4(d)
text: 'd) Fase 4: Inspeção do FSTD.

  Com não menos do que 5 dias de antecedência ao início da inspeção, o representante do operador
  deverá providenciar à ANAC a declaração assinada, estabelecida no parágrafo 60.5(b) do RBAC
  60.

  Para uma qualificação inicial, normalmente, são solicitados 4 slots de 4 h cada para que
  o FSTD seja avaliado, podendo ser esse período alterado a critério da necessidade da ANAC.

  Durante a inspeção, a ANAC reporta ao interessado qualquer não conformidade encontrada no
  FSTD. Ao final da inspeção, a ANAC gera um relatório de avaliação de FSTD.'
