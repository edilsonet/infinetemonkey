cite: 9.1.4(a)
title: 9.1.4(a)
text: 'a) Fase 1: Envio de documentos à ANAC.

  Enviar à ANAC, por meio de documento físico ou, preferencialmente, eletrônico, com antecedência
  mínima de 60 dias da data de avaliação pretendida:


  Carta com a solicitação para qualificação recorrente ou formulário Solicitação de Avaliação
  Recorrente de FSTD no sistema SEI;

  O comprovante de pagamento da TFAC aplicável;

  O QTG junto com análise de cada um dos testes, verificando se cumpre o requisito aplicável;

  No sistema SEI, o usuário deve utilizar o tipo de processo: Qualificação de FSTD: Recorrente.'
