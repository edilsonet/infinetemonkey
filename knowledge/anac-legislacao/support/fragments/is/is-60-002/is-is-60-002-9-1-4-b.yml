title: 9.1.4(b)
text: 'b) Fase 2: Prestar informações ou esclarecimentos adicionais que a ANAC exija.

  A ANAC avalia os documentos enviados e pode solicitar ao interessado esclarecimentos adicionais
  ou correções em relação ao QTG. Ao final dessa fase, a ANAC considera o FSTD pronto para
  ser inspecionado.'
