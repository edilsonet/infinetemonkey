cite: 9.1.4(c)
title: 9.1.4(c)
text: 'c) Fase 3: Inspeção do FSTD.

  Para uma qualificação recorrente, normalmente, são solicitados 2 slots de 4h cada para que
  o FSTD seja avaliado, podendo ser esse período alterado a critério da necessidade da ANAC.

  Durante a inspeção, a ANAC reporta ao interessado quaisquer não conformidades encontradas
  no FSTD. Ao final da inspeção, a ANAC gera um relatório de avaliação de FSTD.'
