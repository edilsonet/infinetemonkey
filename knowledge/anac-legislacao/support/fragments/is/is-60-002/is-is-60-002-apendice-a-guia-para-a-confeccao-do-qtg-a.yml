title: apendice-a-guia-para-a-confeccao-do-qtg(a)
text: (a)The sponsor's FSTD test results must be recorded in a manner acceptable to ANAC,
  that allows easy comparison of the FSTD test results to the validation data (e.g., use of
  a multi-channel recorder, line printer, cross plotting, overlays, transparencies).
