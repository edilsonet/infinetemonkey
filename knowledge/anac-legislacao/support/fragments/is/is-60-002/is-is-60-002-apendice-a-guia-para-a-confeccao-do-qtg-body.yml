text: 'Apêndice a - GUIA PARA A CONFECÇÃO DO QTG

  Item

  Guidance for QTG preparation

  1

  A QTG cover page with sponsor and ANAC approval signature blocks .

  2

  An FSTD information page that provides the information listed in this paragraph. For convertible
  FSTDs, the sponsor must submit a separate page for each configuration of the FSTD.'
