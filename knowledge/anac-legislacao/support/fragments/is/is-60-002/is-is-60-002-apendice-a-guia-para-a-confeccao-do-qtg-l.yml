text: '(l) Simulator Objective Test Results as obtained by the sponsor. Each test result must
  reflect the date completed and must be clearly labeled as a product of the device being
  tested.

  10

  A convertible FSTD is addressed as a separate FSTD for each model and series airplane to
  which it will be converted and for the ANAC qualification level sought. If a sponsor seeks
  qualification for two or more models of an airplane type using a convertible FSTD, the sponsor
  must submit a QTG for each airplane model, or a QTG for the first airplane model and a supplement
  to that QTG for each additional airplane model. ANAC will conduct evaluations for each airplane
  model.

  11

  Form and manner of presentation of objective test results in the QTG:'
