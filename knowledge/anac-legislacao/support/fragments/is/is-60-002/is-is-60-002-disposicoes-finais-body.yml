title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  13.1 Para obter os formulários citados nessa IS, os regulamentos citados nessa IS ou para
  mais informações sobre o processo de Qualificação de FSTD, consulte a página https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/simuladores-de-voo-fstd.

  13.2 Adicionalmente, qualquer questionamento sobre Qualificação de FSTD, pode ser enviado
  à ANAC por meio do canal Fale com a ANAC (https://www.gov.br/anac/pt-br/canais_atendimento/fale-com-a-anac).

  13.3 Os casos omissos serão dirimidos pela SPL.

  13.4 Esta IS entra em vigor em 2 de maio de 2023.'
