cite: 5.1.1
title: Os dados registrados na CIV Digital têm por finalidade registrar os voos dos pilotos.
text: '5.1.1 Os dados registrados na CIV Digital têm por finalidade registrar os voos dos
  pilotos.

  5.1.2 Os registros de voos em CIV Digital devem ser realizados pelo próprio piloto ou por
  seu instrutor ou por preposto de operadores aéreos regidos pelo RBAC 135 ou RBAC 121 empregadores
  do piloto.

  5.1.3 É vedado o registro de voo na CIV Digital em desconformidade ou sem correspondente
  registro no Diário de bordo da respectiva aeronave, o qual, para todos os efeitos, será
  considerado o registro primário.

  5.1.4 É da responsabilidade de cada piloto, ou do seu instrutor ou do preposto do operador
  aéreo regido pelo RBAC 121 ou RBAC 135 seu empregador, manter atualizada a CIV Digital,
  bem como a veracidade de seu conteúdo.

  5.1.5 A CIV Digital pode ser usada pelo representante legal de uma entidade jurídica regida
  pelo RBAC nº 121 ou RBAC nº 135 para declarar horas de experiência de voo de seus tripulantes
  e ex-tripulantes, em conformidade com a IAC 3252, ou IS que venha a substitui-la, conforme
  os procedimentos descritos no item 5.4 desta IS.

  5.1.6 A inserção de dados na CIV Digital, seja aquela feita pelo seu titular; seja aquela
  feita pelas entidades jurídicas regidas pelo RBAC nº 121 e RBAC nº 135, é feita no SACI,
  sistema online próprio da ANAC, por meio de login e senha individual. A obtenção do acesso
  ao sistema é disciplinada pela IS nº 00-008. É de inteira responsabilidade da pessoa que
  possua acesso ao sistema a guarda e sigilo da sua senha, sendo responsável por todas as
  informações inseridas no sistema por meio do seu login.

  5.1.7 As pessoas que preencherem ou endossarem um lançamento em CIV Digital com informações
  ou dados inexatos ou adulterados ficam sujeitas às providências administrativas previstas
  na Lei n 7.565/86 - Código Brasileiro de Aeronáutica (CBA) ou na legislação complementar,
  além das sanções penais e civis cabíveis, uma vez que tal fato poderá comprometer a segurança
  de voo.

  5.1.8 Uma vez comprovado, no caso do parágrafo anterior, que, mesmo não sendo responsável
  pelo lançamento na CIV Digital, o piloto está de acordo com as irregularidades, sendo beneficiado
  com as informações registradas, este também ficará exposto às sanções administrativas, penais
  e civis cabíveis.

  5.2 Procedimento para registro de horas na CIV Digital pelo aeronauta

  5.2.1 Para registrar as horas de voo na CIV Digital, o aeronauta deve ser previamente cadastrado
  no sistema SACI da ANAC, que pode ser feito por meio do link: https://sistemas.anac.gov.br/SACI/CadAeronauta/Identificacao.asp.
  A IS nº 00-008 provê maiores informações sobre este cadastro.

  5.2.2 Uma vez cadastrado, o aeronauta deve acessar o link https://sistemas.anac.gov.br/saci,
  digitar os dados cadastrados (login e senha) e escolher a opção “CIV > Declaração de Experiência
  de Voo”, conforme a Figura 1.'
