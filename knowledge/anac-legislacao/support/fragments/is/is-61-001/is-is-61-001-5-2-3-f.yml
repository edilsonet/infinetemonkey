cite: 5.2.3(f)
title: 5.2.3(f)
text: 'f) Milhas de navegação: considera-se como voo de navegação os realizados entre aeródromos
  distintos. Tratando-se de voo de navegação, conforme anteriormente definido, deve-se preencher
  esse campo com a distância (em milhas náuticas) percorrida entre os aeródromos de origem
  e destino. No caso de sobrevoo ou toque e arremetida (TGL) em aeródromo intermediário, deve-se
  especificá-lo no campo “Observações”;'
