subsection_id: b
cite: 5.3.1(b)
title: 5.3.1(b)
text: 'b) CADASTRADO: registro de voo preenchido, validado e enviado pelo piloto e considerado
  oficialmente para a contagem de experiência de voo nos termos do parágrafo 61.29(a)(2) do
  RBAC nº 61. Uma vez com status CADASTRADO, o registro de voo pode ser a qualquer tempo auditado
  pela ANAC;'
