subsection_id: c
cite: 5.3.1(c)
title: 5.3.1(c)
text: 'c) EXCLUSÃO SOLICITADA: registro de voo anteriormente com status CADASTRADO cuja exclusão
  foi excepcionalmente solicitada pelo piloto. Trata-se de um status excepcional caso o piloto
  não tenha identificado o erro ao enviar o rascunho, constatando-o somente após ter enviado
  seu registro. Os registros de voo com status EXCLUSÃO SOLICITADA não serão mais, a partir
  do momento em que foi solicitada a exclusão, contabilizados pela ANAC. Isso não isenta,
  contudo, o piloto sobre a responsabilidade administrativa, civil e penal de fatos e direitos
  produzidos pelo referido registro de voo enquanto este se encontrava com status CADASTRADO;
  e'
