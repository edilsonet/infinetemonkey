text: '5.5.4 Para cada tripulante só deve ser feito um único lançamento de horas para uma
  determinada função/habilitação/aeronave estrangeira.

  5.5.5 Cada piloto deve lançar o total de horas de determinada aeronave estrangeira por função/habilitação
  informando sempre qual foi o período aquisitivo daquela experiência (“Data inicial” e “Data
  final”). No caso de ter havido dois ou mais períodos distintos de aquisição de experiência
  para um mesmo conjunto tripulante/função/habilitação/aeronave estrangeira, deve ser lançado
  o período total e o total de horas, começando no primeiro dia do primeiro período e terminando
  no último dia do último período.'
