title: apendice-a-informacoes-exibidas-na-civ-digital(b)
text: 'b) Natureza do voo: selecionar se o voo foi realizado em aeronave com marcas e matrícula
  brasileira ou estrangeira

  Nota 1: nos casos em que o voo foi realizado em aeronave estrangeira, o piloto deve informar,
  adicionalmente, nos respectivos campos da CIV Digital, o seguinte: marca e matrícula da
  aeronave, país de registro da aeronave, nome do operador, conforme Certificado de Operador
  Aéreo Internacional, e inserção de documento declaratório da Autoridade de Aviação Civil
  de registro da aeronave.'
