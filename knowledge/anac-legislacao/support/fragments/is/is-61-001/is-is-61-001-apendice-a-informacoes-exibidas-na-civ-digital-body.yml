text: 'APÊNDICE A - INFORMAÇÕES EXIBIDAS NA CIV DIGITAL


  A.1 A tabela “Lançamento de horas” (Figura 6) constitui-se a CIV Digital propriamente dita,
  onde são exibidos todos os voos registrados.


  Figura 7: tabela “Lançamento de horas” (CIV Digital)

  A.2 Para cada registro feito na CIV Digital, conforme parágrafo 5.2 desta IS, é automaticamente
  acrescentada uma linha na tabela “Lançamento de horas” com as informações fornecidas.

