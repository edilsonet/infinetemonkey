title: apendice-a-informacoes-exibidas-na-civ-digital(d)
text: 'd) Habilitação: habilitação correspondente a aeronave utilizada ou, no caso de simulador,
  a habilitação correspondente ao modelo simulado. No caso de treinamento para abatimento
  de horas de voo por instrumento, será exibido “IFRA” ou “IFRH”, conforme aplicável (vide
  parágrafo 5.2.7 (e));'
