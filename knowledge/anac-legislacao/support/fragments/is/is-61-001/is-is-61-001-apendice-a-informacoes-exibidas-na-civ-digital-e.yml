text: 'e) Piloto Participante (Canac-Função): CANAC e função de um segundo piloto envolvido
  naquele voo. Por exemplo, o CANAC “yyyyyy” registra um voo na função “Instrutor Voo”, indicado
  que o CANAC do aluno era “xxxxxx”. Neste caso, na CIV Digital do instrutor, será exibido
  neste campo “xxxxxx - Piloto em Instrução”. Na CIV Digital do aluno, por sua vez, este campo
  exibirá a informação “yyyyyy - Instrutor Voo”. Observar os parágrafos 5.3.2 e 5.3.3 para
  maiores informações.'
