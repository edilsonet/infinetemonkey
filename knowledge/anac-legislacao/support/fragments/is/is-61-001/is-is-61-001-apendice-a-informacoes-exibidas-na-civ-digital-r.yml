text: 'r) Excluir: botão para excluir um voo com status “RASCUNHO”, apagando definitivamente
  o registro, ou para solicitar a exclusão de um voo com status “CADASTRADO”. Nos registros
  em que haja um ‘Piloto Participante’ (ver parágrafo A.3(d) desta IS), o pedido de exclusão
  tem efeito também no registro da CIV do ‘Piloto Participante’;'
