title: APÊNDICE B - CONTAGEM DE EXPERIÊNCIA DE VOO POR FUNÇÃO
text: 'APÊNDICE B - CONTAGEM DE EXPERIÊNCIA DE VOO POR FUNÇÃO

  São estas as funções que podem ser exibidas na coluna “Função” da Figura 6.


  Co-piloto;

  Instrutor de voo em solo

  Instrutor Voo;

  Piloto em Comando;

  Piloto em Instrução;

  Piloto em Instrução para comando

  Piloto em Instrução Solo;

  B.2 Para de contagem de experiência para fins de concessão e/ou revalidação de licenças
  ou habilitações previstas no RBAC nº 61, os registros são computados conforme a coluna “Função”,
  a saber:


  Instrutor Voo, Piloto em Comando e Piloto em Instrução Solo: os registros em tais funções
  são considerados como hora de voo como piloto em comando, nos termos da seção 61.31(c)(2)
  do RBAC nº 61;

  Piloto em Instrução para comando: os registros em tal função são considerados como “Piloto
  em comando sob supervisão”, nos termos da seção 61.2(a)(16);

  Piloto em Instrução: os registros em tal função são considerados como “tempo de instrução
  em duplo comando”, nos termos da seção 61.2(a)(18) do RBAC nº 61.

  Co-piloto: os registros em tal função devem ser feitos em observância aos parágrafos 5.2.3
  (c) (i) e 5.2.5 desta IS e são computados em conformidade com as seções 61.29 (c), 61.29
  (d) e 61.29 (e) do RBAC nº 61;

  B.3 Para fins de concessão e/ou revalidação de licenças ou habilitações previstas no RBAC
  nº 61 não há contagem de tempo de voo na função Instrutor de voo em solo.'
