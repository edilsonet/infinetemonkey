title: OBJETIVO
text: 'OBJETIVO

  Estabelecer o processo de exame de proficiência linguística de pilotos desenvolvido pela
  ANAC e procedimentos para a aplicação do exame com vistas à averbação do nível de proficiência
  linguística nas licenças de pilotos brasileiros, de acordo com as definições e requisitos
  estabelecidos pela Seção 61.10 do RBAC nº 61; e

  Estabelecer procedimentos para a averbação de proficiência linguística com base em licença
  estrangeira em processo de convalidação, de acordo com os requisitos estabelecidos pela
  Seção 61.45 do RBAC nº 61.'
