text: '5.3.2

  A coluna “AERONAVE” (2) está dividida em dois campos: “MODELO”, com a

  informação de modelo (e variantes), de acordo com a Especificação de Tipo (TCDS); e

  “NOME”, com a designação comercial ou nome o qual a aeronave é comumente

  identificada.'
