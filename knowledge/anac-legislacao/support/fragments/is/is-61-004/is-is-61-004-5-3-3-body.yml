text: '5.3.3

  A coluna “OBSERVAÇÕES” (3) apresenta informações referentes a um ou mais modelos

  (e variantes) relacionados tais como: existência de Relatório de Avaliação Operacional

  emitido pela ANAC, condições específicas para determinação da habilitação de tipo e etc.'
