text: '5.3.4

  A coluna “DESIGNATIVO” (4) apresenta informação referente ao designativo de

  habilitação de tipo determinada para a aeronave. Ainda que esta coluna inclua todas as

  aeronaves listadas na coluna “AERONAVE” (2), o treinamento de familiarização ou de

  diferenças permanece como requerido para a operação em cada variante ou modelo de

  tipo específico, conforme o caso.'
