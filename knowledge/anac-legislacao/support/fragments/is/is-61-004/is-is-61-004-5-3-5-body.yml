text: '5.3.5

  As informações sobre treinamentos de familiarização ou diferenças são obtidas por meio

  de Relatórios de Avaliação Operacional publicados pela ANAC ou documento similar

  publicado por autoridade de aviação civil estrangeira, não devendo ser consideradas

  limitantes para fins de proposta de treinamento apresentada por um operador aéreo ou

  organização de treinamento. Significa dizer que essa organização tem a liberdade de

  apresentar uma proposta alternativa de treinamento de familiarização e/ ou diferenças

  entre aeronaves, que será analisada pela ANAC.'
