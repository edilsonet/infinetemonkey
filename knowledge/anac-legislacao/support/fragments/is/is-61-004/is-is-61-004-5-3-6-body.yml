text: '5.3.6

  Na coluna “DESIGNATIVO” (4), a vírgula entre registros de habilitação de tipo ( , )

  indica a existência de habilitações distintas para uma mesma aeronave. No caso de

  aeronaves certificadas para tripulação mínima composta por um piloto, o foco está na

  diferença de operação: “single pilot” ou “dual pilot” (/D).'
