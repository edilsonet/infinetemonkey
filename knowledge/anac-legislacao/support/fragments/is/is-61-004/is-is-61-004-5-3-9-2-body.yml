text: '5.3.9.2

  no caso de aeronaves certificadas para operar com tripulação mínima composta por um

  piloto:


  a)

  para pilotos que tenham recebido treinamento “single pilot” aprovado para

  habilitação de tipo:


  I -

  AAAA (PIC) - para pilotos que tenham recebido o treinamento no posto de

  pilotagem definido pelo fabricante da aeronave para PIC e que tenham sido

  aprovados em voo de verificação de proficiência neste posto de pilotagem,

  em operação “single pilot”; e


  b)

  para pilotos que tenham recebido treinamento “dual pilot” aprovado para

  habilitação de tipo, se aplicável:


  I -

  AAAA/D (PIC) - para pilotos que tenham recebido o treinamento no posto

  de pilotagem definido pelo fabricante da aeronave para PIC e que tenham sido

  aprovados em voo de verificação de proficiência neste posto de pilotagem,

  em operação “dual pilot”; e


  II -

  AAAA/D (SIC) - para pilotos que tenham recebido o treinamento no posto

  de pilotagem definido pelo fabricante da aeronave para SIC e que tenham sido

  aprovados em voo de verificação de proficiência neste posto de pilotagem,

  em operação “dual pilot”.'
