title: APÊNDICE D - TABELA DE EQUIVALÊNCIAS PARA OPERAÇÃO DE AERONAVES
text: 'APÊNDICE D - TABELA DE EQUIVALÊNCIAS PARA OPERAÇÃO DE AERONAVES

  AERODESPORTIVAS PORTADORAS DE CAVE POR PILOTOS DETENTORES DE

  CERTIFICADOS DE PILOTO DESPORTIVO (CPD) E CERTIFICADOS DE PILOTO DE

  RECREIO (CPR).


  D.1

  A seção 61.293 do RBAC nº 61 indica, para fins de operação de uma aeronave desportiva,

  que “os Certificados de Piloto Desportivo (CPD) e Certificados de Piloto de Recreio (CPR)
  são

  considerados válidos enquanto pelo menos uma de suas habilitações correspondentes permanecer

  dentro de seu período de vigência”. Desta forma a tabela deste Apêndice estabelece a equivalência

  entre as habilitações averbadas ao CPD e ao CPR com aquelas averbadas ao CPA.


  D.2

  Pilotos que possuírem a habilitação válida indicada na coluna 2 da tabela abaixo, bem como

  um CMA de 1ª, 2ª ou 4ª classe válido, ou o CMPU, enquanto ainda estiver válido, podem operar

  as aeronaves aerodesportivas correspondentes da coluna 1, sem necessidade de qualquer formalidade

  adicional. As habilitações indicadas na coluna 2 da tabela abaixo deverão ser revalidadas
  conforme a

  seção 61.295 do RBAC nº 61 e receberão, a partir de então, o designativo correspondente
  à coluna 1.


  D.3

  Não obstante o previsto acima, em todo caso é de responsabilidade do piloto se familiarizar

  com as regras de operação aplicáveis às aeronaves experimentais e com a aeronave aerodesportiva

  que irá pilotar. Deve ainda, sempre que praticável, receber instrução de outro piloto que
  já possua

  experiência naquele equipamento, podendo ser responsabilizado administrativa, civil e penalmente

  caso atue imprudentemente sem o devido preparo.


  D.4

  Em atenção do disposto na seção 61.293 (b) do RBAC nº 61, os detentores de CPD ou CPR

  receberão o CPA no ato de revalidação das suas habilitações, desde que a aeronave pertinente
  esteja

  enquadrada como aeronave leve esportiva ou aeronave aerodesportiva portadora de CAVE, de
  acordo

  com os requisitos estabelecidos nos RBAC nº 01 e 21, sendo averbada a habilitação correspondente

  à aeronave em que se deu a aprovação em exame de proficiência. Os detentores de CPD deverão

  ainda no ato de revalidação demonstrar, adicionalmente, terem recebido instrução complementar
  de

  navegação aérea de um instrutor habilitado de uma associação credenciada ou em um centro
  de

  instrução certificado, em conformidade com a seção 61.293 (b)(1) do RBAC nº 61.


  (1) HABILITAÇÃO

  AERODESPORTIVA (CPA)

  (2) HABILITAÇÃO DE ULTRALEVE (CPD OU

  CPR)

  GIRO

  GIRO

  PARA

  PARA

  AAFT

  UBTE ou UATE

  AAFA

  UBAF ou UAAF

  AART

  Sem equivalência

