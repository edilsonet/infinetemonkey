title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS


  7.1

  Os casos omissos serão dirimidos pela SPO.


  7.2.

  Os pilotos atualmente habilitados que sejam afetados pelas alterações desta IS devem

  adequar-se ao modelo em que pretendem operar por ocasião da revalidação de suas

  habilitações. A adequação consiste na realização do treinamento periódico no modelo

  pretendido.


  7.3.

  Esta IS entra em vigor na data de sua publicação.


  Data de emissão: 1º de novembro de 2019

  IS nº 61-004

  Revisão P'
