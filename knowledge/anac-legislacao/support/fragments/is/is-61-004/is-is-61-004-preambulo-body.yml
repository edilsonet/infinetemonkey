title: Preambulo e sumario
text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 61-004

  Revisão P

  Aprovação:

  Portaria nº 3.252/SPO, de 18 de outubro de 2019.

  Assunto:

  Lista de habilitações averbadas pela ANAC nas licenças de

  pilotos


  1.

  OBJETIVOS


  1.1

  Estabelecer e tornar pública a lista de habilitações a serem averbadas pela ANAC nas

  licenças de pilotos emitidas segundo o RBAC nº 61.


  2.

  REVOGAÇÃO


  Esta IS revoga a IS 61-004O.


  3.

  FUNDAMENTOS


  3.1

  A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar

  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,

  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC ou

  RBHA.


  3.2

  O administrado que pretenda, para qualquer finalidade, demonstrar o cumprimento de

  requisito previsto em RBAC ou RBHA, poderá:


  a) adotar os meios e procedimentos previamente especificados em IS; ou


  b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,

  nesse caso, a análise e concordância expressa do órgão competente da ANAC.


  3.3

  O meio ou procedimento alternativo mencionado no parágrafo 3.2b desta IS deve garantir

  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou

  concretizar o objetivo do procedimento normalizado em IS.


  3.4

  A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC ou

  outro ato normativo.


  4.

  DEFINIÇÕES


  4.1

  Para os efeitos desta IS, são válidas as definições listadas na seção 61.2 do RBAC nº 61,

  e as seguintes definições:


  Data de emissão: 1º de novembro de 2019

  IS nº 61-004

  Revisão P'
