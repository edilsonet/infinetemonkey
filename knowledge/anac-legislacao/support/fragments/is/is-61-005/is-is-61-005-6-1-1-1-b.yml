section_title: 'O treinamento deve ser elaborado conforme os seguintes conteúdos:'
subsection_id: b
cite: 6.1.1.1(b)
title: 6.1.1.1(b)
text: 'b) Caso não tenha sido emitido Relatório de Avaliação Operacional pela ANAC para a
  aeronave Tipo, as provisões de treinamento devem ser as previstas em documento similar emitido
  pela Autoridade de Aviação Civil do País de Projeto da aeronave.

  6.1.1.3 A ANAC não estabelece duração mínima ou máxima para o treinamento de solo, sendo
  mandatória a utilização da programação e da carga horária contidas no Relatório de Avaliação
  Operacional. É de responsabilidade do instrutor liberar o aluno para o treinamento de voo
  somente quando considerar que este demonstrou possuir todo o conhecimento teórico necessário
  para realizar um voo seguro.'
