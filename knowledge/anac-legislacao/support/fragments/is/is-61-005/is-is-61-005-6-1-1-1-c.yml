text: 'c) Treinamento de solo para a função de piloto segundo em comando: o treinamento de
  solo deve abordar, no mínimo, o conteúdo do Apêndice B, para o caso de aviões, ou o conteúdo
  do Apêndice C, para helicópteros.'
