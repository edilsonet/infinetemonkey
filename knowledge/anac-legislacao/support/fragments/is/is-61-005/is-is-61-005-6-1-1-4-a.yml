cite: 6.1.1.4(a)
title: 6.1.1.4(a)
text: 'a) Caso não haja Relatório de Avaliação Operacional emitido pela ANAC ou pela Autoridade
  de Aviação Civil do País de Projeto da aeronave, conforme previsto nos parágrafos 61.213
  (a)(3)(iii) e 61.218 (b)(3)(iii) do RBAC nº 61, o treinamento de voo para concessão de habilitação
  de tipo (treinamento inicial) deverá ter as seguintes durações mínimas:

  Família de aeronaves

  Treinamento inicial para

  piloto em comando

  Treinamento inicial para piloto

  segundo em comando

  Aviões turboélice ou convencionais

  12h

  6h

  Aviões a reação

  20h

  10h

  Helicópteros com peso máximo de decolagem até 9071 kg (20000 lbs)

  8h

  4h

  Helicópteros com peso máximo de decolagem acima de 9071 kg (20000 lbs)

  10h

  5h'
