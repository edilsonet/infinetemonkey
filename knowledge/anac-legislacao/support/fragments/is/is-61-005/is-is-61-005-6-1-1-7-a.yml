  6.2 Treinamento recorrente.

  6.2.1 Um piloto com licença de Piloto Comercial ou de Piloto de Linha Aérea, devidamente
  habilitado na aeronave a ser treinada, na função de piloto em comando, pode ministrar treinamento
  recorrente para outro piloto, doravante denominado piloto aluno, nas situações assim previstas
  no RBAC 61 E que:'
