title: 6.2.1.1(c)
text: 'c) Por se tratar de treinamento recorrente, o piloto instrutor pode simplificar os
  conteúdos previstos no item 6.2.1.1 deste documento, excetuando-se os currículos classificados
  como TASE definidos nos Relatórios de Avaliação Operacional.

  6.2.1.3 A ANAC não estabelece duração mínima ou máxima para o treinamento de solo, sendo
  mandatória a utilização da programação e da carga horária contidas no Relatório de Avaliação
  Operacional. Por isso, é de responsabilidade do instrutor liberar o aluno para o treinamento
  de voo somente quando considerar que este demonstrou possuir todo o conhecimento teórico
  necessário para realizar um voo seguro.'
