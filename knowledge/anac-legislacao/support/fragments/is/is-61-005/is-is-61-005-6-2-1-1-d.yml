title: 6.2.1.1(d)
text: 'd) Treinamento de voo para a função de piloto segundo em comando: o treinamento de
  voo deve abordar, no mínimo, o conteúdo do Apêndice D, para o caso de aviões, ou o conteúdo
  do Apêndice E, para helicópteros.

  6.2.1.2 O conteúdo aplicado ao treinamento elaborado, de solo e voo, deve ser baseado nas
  tarefas e procedimentos previstos nos Aircraft Flight Manual - AFM, ou Rotorcraft Flight
  Manual - RFM, e nas provisões de treinamento (incluindo as Áreas de Treinamento de Ênfase
  Especial - Training Areas of Special Emphasis (TASE)), previstas no Relatório de Avaliação
  Operacional aplicável ao modelo da aeronave.'
