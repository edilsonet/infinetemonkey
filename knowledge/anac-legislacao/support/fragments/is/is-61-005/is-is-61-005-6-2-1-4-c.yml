id: is-is-61-005-6-2-1-4-c
kind: is
document: is-61-005
family: '61'
section_id: 6.2.1.4
section_title: 'Ao término do treinamento de solo, o instrutor deverá registrá-lo na CIV Digital
  do candidato, preenchendo os seguintes campos:'
subsection_id: c
cite: 6.2.1.4(c)
title: 6.2.1.4(c)
text: 'c) OBSERVAÇÕES: realizar o seguinte lançamento: “Certifico que ministrei treinamento
  de solo ao detentor desta CIV Digital na função X (piloto em comando ou piloto segundo em
  comando) e o considero o apto para o voo (nome, CANAC e rubrica do instrutor).”

  Nota: o instrutor também deverá registrar o treinamento de solo em sua própria CIV Digital,
  com especial atenção ao campo de Observações, de acordo com o item 5.2.3(d) da IS nº 61-001.

  6.2.1.5 O treinamento de voo para renovação de habilitação de tipo (treinamento recorrente)
  deve seguir a programação e a carga horária contidas no Relatório de Avaliação Operacional.

  6.2.1.6 Caso não haja Relatório de Avaliação Operacional emitido pela ANAC ou pela Autoridade
  de Aviação Civil do País de Projeto da aeronave, conforme previsto nos parágrafos 61.215
  (c) e 61.219 (c) do RBAC nº 61, o treinamento de voo para renovação de habilitação de tipo
  (treinamento recorrente) deverá ter as seguintes durações mínimas


  Família de aeronaves

  Treinamento recorrente para piloto em comando

  Treinamento recorrente para piloto segundo em comando

  Aviões turboélice ou convencionais

  2,4h

  1,8h

  Aviões a reação

  4h

  3h

  Helicópteros com peso máximo de decolagem até 9071 kg (20000 lbs)

  1,6h

  1,2h

  Helicópteros com peso máximo de decolagem acima de 9071 kg (20000 lbs)

  2h

  1,5h'
