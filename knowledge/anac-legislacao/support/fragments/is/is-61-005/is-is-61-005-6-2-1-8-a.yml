title: 6.2.1.8(a)
text: 'a) O exame de proficiência será executado conforme procedimentos estabelecidos na Instrução
  Suplementar 00-002, disponível no Portal da ANAC.

  6.3 Empresas de transporte aéreo e órgãos de segurança pública e defesa civil

  6.3.1 Conforme previsto no parágrafo 61.211(b) do RBAC nº 61, para pilotos empregados por
  operadores que possuam programa de treinamento aprovado pela ANAC, os treinamentos de solo
  e de voo para a concessão e revalidação da habilitação de tipo devem ser feitos nos termos
  do programa aprovado.

  6.3.2 Por existir regulamentação específica, não se aplicam os requisitos de treinamento
  mínimo previstos nesta IS. Também não é necessário que a empresa ou órgão possua certificado
  de CTAC para que ministre o treinamento.

  6.4 Disponibilização de programas de treinamento de aeronaves Tipo

  6.4.1 A ANAC disponibilizará em seu Portal, via link https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/perfis/pilotos/treinamento-de-tipo-em-aeronave,
  programas de treinamento de tipo em aeronaves previamente aprovados.'
