kind: is
document: is-61-005
family: '61'
section_id: 6.2.1.8
section_title: 'Ao término do treinamento de voo, o instrutor deverá registrá-lo na CIV Digital
  do candidato, preenchendo os seguintes campos:'
subsection_id: d
cite: 6.2.1.8(d)
title: 6.2.1.8(d)
text: 'd) OBSERVAÇÕES: realizar o seguinte lançamento: “Certifico que ministrei treinamento
  de voo na função X (piloto em comando ou piloto segundo em comando) ao detentor desta CIV
  Digital, com duração de (total de horas de voo), e o considero o apto para o cheque na referida
  função (nome, CANAC e rubrica do instrutor).”

  Nota: o instrutor também deverá registrar o voo em sua própria CIV Digital, com especial
  atenção ao campo de Observações, de acordo com o item 5.2.3(d) da IS nº 61-001.

  6.2.1.9 Além do registro do treinamento de voo, como acima estabelecido, o instrutor deve
  conceder ao piloto aluno o endosso “Apto para Cheque na função X (piloto em comando ou piloto
  segundo em comando)”, conforme orientações contidas na Instrução Suplementar 61-006, disponível
  no Portal da ANAC.

  6.2.1.10 O voo relacionado ao exame de proficiência (voo de cheque), caso o piloto aluno
  tenha sido treinado conforme estabelecido nessa IS, será, compulsoriamente, supervisionado
  pela Coordenadoria de Exames de Proficiência de Pilotos - CEEP.'
