text: 'APÊNDICE B - PROGRAMA DE TREINAMENTO PARA AVIÕES

  CURRÍCULO DE SOLO


  AVIÃO

  (Conhecimento teórico da aeronave e currículo de voo - “Ground School”)


  * Observações:


  A ementa descrita neste Apêndice é aplicável somente aos treinamentos englobados pelo parágrafo
  1.9.1.1(c) desta Instrução Suplementar;


  A ementa descrita neste Apêndice traz um rol não exaustivo de disciplinas/lições/manobras.
  Ou seja, a responsável pela instrução deverá adequar o conteúdo desta ementa ao modelo da
  aeronave que irá realizar o treinamento.


  O responsável pela instrução deverá definir a carga horária mínima das disciplinas/lições/manobras
  para cada treinamento observado o ambiente operacional, o nível de tolerabilidade do risco
  à segurança operacional e a carga horária mínima prevista no RBAC 61.


  COMPONENTE CURRICULAR:

  CONHECIMENTOS TEÓRICOS DA AERONAVE - AVIÃO

  DISCIPLINA

  EMENTA


  ASSUNTOS GERAIS

  Peso e balanceamento


  Princípios gerais e métodos para determinar o peso e balanceamento

  Cálculo, localização e limitações de CG

  Efeitos do CG, incluindo os relacionados ao gasto de combustível.

  Desempenho


  Uso das cartas, tabelas e gráficos

  Problemas relacionados ao desempenho

  Fatores limitadores de performance, tais como comprimento da pista, temperatura, pistas
  contaminadas

  Planejamento de voo


  Cartas de navegação, outras

  Operações

  Limitações

  Manual de voo da aeronave - AFM e/ou

  Manual de operações da aeronave - AOM


  Aplicabilidade e descrição do AFM/AOM

  Seção de limitações operacionais;

  Seções dos procedimentos normais, anormais e de emergências

  Seção de manobras e procedimentos

  Descrição dos sistemas

  Apêndices, boletins, suplementos, etc.


  SISTEMAS E COMPONENTES DA AERONAVE

  (Descrição detalhada)


  Descrição geral da aeronave


  Generalidades (AFM, programa de treinamento, equipamentos de emergência, etc.)

  Estruturas

  Limitações Operacionais

  Instrumentos e suas marcações

  Inspeção pré-voo

  Master Warning


  Generalidades (descrição, anunciadores, indicações, etc.)

  Sistema Elétrico


  Descrição do sistema (ex. Gerador, alternador, fusíveis, circuit brakers, limitadores de
  corrente, barra de emergência, APU, etc.)

  Energia AC/DC;

  Avisos visuais e sonoros;

  Operações

  Limitações

  Procedimentos normais, anormais e de emergência

  Sistema de combustível e/ou de lubrificação


  Descrição do sistema (ex. localização dos tanques e do sistema de ventilação, capacidade,
  drenos, bombas, distribuição, injetores, carburadores ou controle de combustível, controles,
  indicadores, alimentação cruzada, transferência, aditivos, abastecimento, etc.)'
