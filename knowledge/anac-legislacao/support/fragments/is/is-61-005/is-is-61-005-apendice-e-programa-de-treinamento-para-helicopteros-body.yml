  VOO NOTURNO

  Procedimentos noturnos


  Inspeção pré-voo noturna na aeronave;

  Luzes de cabine

  Luzes da aeronave;

  Taxi, pouso e decolagem, incluindo com pane elétrica;

  Recuperação atitude anormais em voos de cruzeiro

  Prevenção de colisões

  Aproximações por instrumentos;

  Etc.


  PROCEDIMENTOS ANORMAIS E EMERGÊNCIAS


  Procedimentos de anormais e de emergência


  Todos os procedimentos anormais e de emergências previstos no RFM, incluindo as sob regras
  de voo por instrumentos.

  *Caso o responsável pela instrução constate que determinada manobra expõe a tripulação a
  um risco inaceitável dentro da matriz de risco da segurança operacional, ou que por algum
  motivo não seja possível executá-la responsável pela instrução deverá estabelecer que a
  referida manobra deverá ser realizada em dispositivo de simulação de voo, nacele ou de outra
  forma aprovado pela ANAC.'
