title: APLICABILIDADE
text: 'APLICABILIDADE

  5.1 Essa Instrução Suplementar tem por objetivo estabelecer os parâmetros técnicos para
  desenvolvimento de programa de treinamento de aeronaves Tipo, tanto treinamento inicial
  quanto treinamento recorrente, incluindo o treinamento para a habilitação de piloto segundo
  em comando, para as quais não há Centro de Treinamento de Aviação Civil - CTAC certificado
  ou validado pela ANAC.

  5.1.1 Lista de CTACs certificados ou validados pela ANAC, tanto para provimento de treinamentos
  iniciais como para provimento de treinamentos recorrentes, pode ser obtida no Portal da
  ANAC, via link https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-civil/perfis/pilotos/treinamento-de-tipo.

  DESENVOLVIMENTO DO PROGRAMA DE TREINAMENTO

  6.1 Treinamento inicial.

  6.1.1 Um piloto com licença de Piloto Comercial ou de Piloto de Linha Aérea, devidamente
  habilitado na aeronave a ser treinada, na função piloto em comando, pode ministrar treinamento
  inicial para outro piloto, doravante denominado piloto aluno, nas situações assim previstas
  no RBAC 61 desde que as seguintes condições sejam atendidas:'
