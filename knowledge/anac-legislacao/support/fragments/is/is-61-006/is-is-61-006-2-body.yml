title: Detentor da habilitação vigente de Instrutor de Voo (INVH), possuidor deste endosso.
text: '2. Detentor da habilitação vigente de Instrutor de Voo (INVH), possuidor deste endosso.

  Instrução prévia mínima ao endosso:

  O treinamento definido para o endosso de instrução de voo IFR na IS nº 141-007.

  Requisito de experiência de voo por instrumentos em comando:

  O piloto endossante deve se certificar de que o piloto endossado possui um mínimo de 50
  (cinquenta) horas de voo por instrumentos em comando.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte, no campo
  Filtro, deverá selecionar o Tipo de Endosso “Instrutor de Voo por Instrumentos em helicóptero”.
  O campo “Endosso*” ficará filtrado com “Instrutor de Voo por Instrumentos Helicóptero”,
  bastando selecionar o botão Salvar para concluir o registro.

  Regra de transição:

  Consideram-se endossados os pilotos detentores de habilitação vigente de Instrutor de Voo
  (INVH) que, até 1º de julho de 2020, possuíam um mínimo de 50 (cinquenta) horas de voo por
  instrumentos em comando e já haviam ministrado instrução de IFR em helicópteros.'
