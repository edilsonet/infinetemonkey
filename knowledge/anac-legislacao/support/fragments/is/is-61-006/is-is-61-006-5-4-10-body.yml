title: Endosso de liberação para o cheque MPL - 61.119(a)
text: '5.4.10 Endosso de liberação para o cheque MPL - 61.119(a)

  Válido por 30 dias.

  Quem pode endossar:

  1 - Detentor da habilitação vigente de Instrutor de Voo (INVA); ou

  2 - Piloto designado para ministrar instrução de voo em um operador que possua programa
  de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade a
  que está vinculado. (ex: operadores 142, 135 e 90).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.119 do RBAC nº 61.

  Texto do endosso na CIV Digital:

  “Liberado para cheque MPL por (Nome do instrutor, CANAC do instrutor e nome do CTAC caso
  aplicável).”'
