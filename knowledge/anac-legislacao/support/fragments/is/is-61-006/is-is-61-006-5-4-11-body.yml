title: Endosso de liberação para o cheque de Piloto de Planador - 61.159(a)
text: '5.4.11 Endosso de liberação para o cheque de Piloto de Planador - 61.159(a)

  Válido por 30 dias.

  Quem pode endossar:

  Detentor da habilitação vigente de Instrutor de Voo de Planador (INPL).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.159 do RBAC nº 61.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Check planador”. O campo
  “Endosso*” ficará filtrado com “Check planador / Planador”, bastando selecionar o botão
  Salvar para concluir o registro.'
