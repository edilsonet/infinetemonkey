title: Endosso de liberação para o cheque de Piloto de Balão Livre - 61.179(a)
text: '5.4.12 Endosso de liberação para o cheque de Piloto de Balão Livre - 61.179(a)

  Válido por 30 dias.

  Quem pode endossar:

  Detentor da habilitação vigente de Instrutor de Voo de Balão Livre (INVB).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.179 do RBAC nº 61.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Check balão”. O campo “Endosso*”
  ficará filtrado com “Check balão / Balão”, bastando selecionar o botão Salvar para concluir
  o registro.'
