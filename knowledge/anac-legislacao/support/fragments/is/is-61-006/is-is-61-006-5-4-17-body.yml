text: '5.4.17 Endosso para realizar operações como instrutor de voo IFR em avião - 61.237(b)(5)

  Quem pode endossar:

  1. Detentor da habilitação vigente de Instrutor de Voo (INVA) que, até 1º de julho de 2020,
  possuía um mínimo de 50 (cinquenta) horas de voo por instrumentos em comando e já havia
  ministrado instrução de IFR em aviões; ou'
