text: '5.4.18 Endosso para realizar operações como instrutor de voo IFR em helicóptero - 61.237(b)(5)

  Quem pode endossar:

  1. Detentor da habilitação vigente de Instrutor de Voo (INVH) que, até 1º de julho de 2020,
  possuía um mínimo de 50 (cinquenta) horas de voo por instrumentos em comando e já havia
  ministrado instrução de IFR em helicópteros; ou'
