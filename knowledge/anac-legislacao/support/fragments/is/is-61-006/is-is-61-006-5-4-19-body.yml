title: Endosso para realizar operações como instrutor de voo em avião classe MLTE - 61.237(b)(4)
text: '5.4.19 Endosso para realizar operações como instrutor de voo em avião classe MLTE -
  61.237(b)(4)

  Quem pode endossar:

  1. Detentor da habilitação vigente de Instrutor de Voo (INVA) que, até 1º de julho de 2020,
  possuía um mínimo de 15 (quinze) horas de voo como piloto em comando no modelo de avião
  e já havia ministrado instrução no mesmo modelo; ou

  2. Detentor da habilitação vigente de Instrutor de Voo (INVA), possuidor deste endosso para
  o modelo de avião.

  Instrução prévia mínima ao endosso:

  O treinamento definido para o endosso de instrução de voo em aviões multimotores na IS nº
  141-007.

  Requisito de experiência de voo como piloto em comando no modelo de avião:

  O piloto endossante deve se certificar de que o piloto endossado possui um mínimo de 15
  (quinze) horas de voo como piloto em comando no modelo de avião.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte, no campo
  Filtro, deverá selecionar o Tipo de Endosso “Check instrutor de voo em avião classe MLTE”
  e o modelo de avião. O campo “Endosso*” ficará filtrado com “Check instrutor de voo em avião
  classe MLTE”, bastando selecionar o botão Salvar para concluir o registro.

  Regra de transição:

  Consideram-se endossados, para um dado modelo de avião, os pilotos detentores de habilitação
  vigente de Instrutor de Voo (INVA) que, até 1º de julho de 2020, possuíam um mínimo de um
  mínimo de 15 (quinze) horas de voo como piloto em comando no modelo de avião e já haviam
  ministrado instrução no mesmo modelo.'
