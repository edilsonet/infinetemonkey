text: '5.4.2 Todos os endossos previstos nesta seção devem ser registrados por meio da CIV
  Digital do piloto endossante.

  5.4.3 Para os lançamentos de endosso na CIV Digital, o piloto endossante deve registrar
  normalmente o voo em sua CIV Digital e, uma vez que o voo esteja com status “CADASTRADO”,
  selecionar o botão “Endossar” na linha referente ao voo que deseja registrar o endosso,
  conforme figura abaixo:'
