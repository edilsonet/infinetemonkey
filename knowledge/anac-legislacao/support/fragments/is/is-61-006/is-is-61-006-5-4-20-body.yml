text: '5.4.20 Endosso para realizar operações como instrutor de voo em helicóptero classe
  multimotor - 61.237 (b)(4)

  Quem pode endossar:

  1. Detentor da habilitação vigente de Instrutor de Voo (INVH) que, até 1º de julho de 2020,
  possuía um mínimo de 15 (quinze) horas de voo como piloto em comando no modelo de helicóptero
  e já havia ministrado instrução no mesmo modelo; ou

  2. Detentor da habilitação vigente de Instrutor de Voo (INVH), possuidor deste endosso para
  o modelo de helicóptero.

  Instrução prévia mínima ao endosso:

  O treinamento definido para o endosso de instrução de voo em helicópteros multimotores na
  IS nº 141-007.

  Requisito de experiência de voo como piloto em comando no modelo de helicóptero:

  O piloto endossante deve se certificar de que o piloto endossado possui um mínimo de 15
  (quinze) horas de voo como piloto em comando no modelo de helicóptero.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte, no campo
  Filtro, deverá selecionar o Tipo de Endosso “Check instrutor de voo em helicóptero classe
  HMLT” e o modelo de helicóptero. O campo “Endosso*” ficará filtrado com “Check instrutor
  de voo em helicóptero classe HMLT”, bastando selecionar o botão Salvar para concluir o registro.

  Regra de transição:

  Consideram-se endossados, para um dado modelo de helicóptero, os pilotos detentores de habilitação
  vigente de Instrutor de Voo (INVH) que, até 1º de julho de 2020, possuíam um mínimo de um
  mínimo de 15 (quinze) horas de voo como piloto em comando no modelo de helicóptero e já
  haviam ministrado instrução no mesmo modelo.

  5.5 Concessão de endosso por pilotos que não possuam licença ou habilitação expedida pela
  ANAC

  5.5.1 Um piloto endossante que não possua licença ou habilitação expedida pela ANAC não
  possui acesso ao SACI e, portanto, não procederá com o lançamento do endosso via CIV Digital.
  Neste caso o piloto endossado é responsável por remeter o pedido de inclusão de endosso
  no SACI à Gerência de Certificação de Pessoal, anexando o Requerimento Padrão preenchido
  com o pedido e declaração do fabricante ou do centro de treinamento atestando que o instrutor
  endossante é vinculado ao seu quadro bem como especificando o treinamento realizado pelo
  piloto endossado.

  5.6 Consulta de endosso no SACI'
