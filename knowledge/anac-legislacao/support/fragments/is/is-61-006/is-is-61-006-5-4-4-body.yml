title: Endosso para realizar operações como piloto rebocador de planador - 61.31(g)
text: '5.4.4 Endosso para realizar operações como piloto rebocador de planador - 61.31(g)

  Quem pode endossar:

  1 - Detentor da habilitação vigente de Instrutor de Voo (INVA ou ICPA) e correspondente
  ao modelo de aeronave utilizada para a operação de reboque, licença de piloto de planador,
  pelo menos 100 horas em comando no modelo de aeronave utilizada para a operação de reboque
  de planador (ou aeronave cujas características de operação sejam similares) e endossado
  para realizar operações como piloto rebocador de planador; ou

  2 - Piloto designado para ministrar instrução de voo em um operador que possua programa
  de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade a
  que está vinculado. (ex: operadores 142, 135 e 90).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.31(g)(3) do RBAC nº 61.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Rebocador de Planador” e
  a Categoria da aeronave utilizada na instrução para reboque (geralmente “Avião”). O campo
  “Endosso*” ficará filtrado com “Rebocador de planador / categoria”, bastando selecionar
  o botão Salvar para concluir o registro.


  Regra de transição:

  Os pilotos que detinham a habilitação de piloto rebocador de planador, que foi extinta por
  ocasião da Emenda 08 ao RBAC nº 61, consideram-se endossados para realizar operações como
  piloto rebocador de planador.'
