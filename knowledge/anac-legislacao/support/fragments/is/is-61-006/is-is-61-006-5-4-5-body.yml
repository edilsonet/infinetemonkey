title: Endosso para realizar operações como piloto lançador de paraquedista - 61.31(h)
text: '5.4.5 Endosso para realizar operações como piloto lançador de paraquedista - 61.31(h)

  Quem pode endossar:

  1 - Detentor de licença de piloto com habilitação vigente de Instrutor de Voo (INVA, INVH
  etc.) e correspondente ao modelo de aeronave utilizada para a operação de lançamento de
  paraquedista, pelo menos 100 horas em comando no modelo de aeronave utilizada para a operação
  de lançamento de paraquedista e endossado para realizar operações como piloto lançador de
  paraquedista; ou

  2 - Piloto designado para ministrar instrução de voo em um operador que possua programa
  de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade a
  que está vinculado. (ex: operadores 142, 135 e 90).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.31(h)(3) do RBAC nº 61.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Lançador de paraquedista”
  e a Categoria da aeronave utilizada na instrução para lançamento (por exemplo “Avião” ou
  “Helicóptero”). O campo “Endosso*” ficará filtrado com “Lançador de paraquedista / categoria”,
  bastando selecionar o botão Salvar para concluir o registro.


  Regra de transição:

  Os pilotos que detinham a habilitação de piloto lançador de paraquedista, que foi extinta
  por ocasião da Emenda 08 ao RBAC nº 61, consideram-se endossados para realizar operações
  como piloto lançador de paraquedista.'
