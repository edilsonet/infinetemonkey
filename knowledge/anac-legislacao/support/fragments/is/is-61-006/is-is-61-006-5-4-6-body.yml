text: '5.4.6 Endosso para voo solo de aluno piloto - 61.61(k), 61.69(a)(2) e (3) e 61.69(b)(2)
  e (3)

  Válido por 90 dias.

  Quem pode endossar:

  1 - Detentor da habilitação vigente de Instrutor de Voo (INVA, INVH, INPL, etc.); ou

  2 - Piloto designado para ministrar instrução de voo em um operador que possua programa
  de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade a
  que está vinculado. (ex: operadores 142, 135 e 90).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.61 do RBAC nº 61 e, caso o voo solo seja realizado em espaço
  aéreo controlado, também a instrução prevista na seção 61.69 do RBAC nº 61. Decorridos 90
  dias após obtenção de endosso, caso o aluno não tenha ainda completado todas as missões
  solo aplicáveis ao curso, deverá realizar instrução em duplo comando, repassando as manobras
  com seu instrutor, para obtenção de novo endosso.

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Voo solo de aluno piloto”
  e a Categoria da aeronave utilizada na instrução (por exemplo “Avião”, “Helicóptero”, “Planador”
  etc.). O campo “Endosso*” ficará filtrado com “Voo solo de aluno piloto / categoria”, bastando
  selecionar o botão Salvar para concluir o registro.'
