title: Endosso de liberação para o cheque PC - 61.99(a)
text: '5.4.9 Endosso de liberação para o cheque PC - 61.99(a)

  Válido por 30 dias.

  Quem pode endossar:

  1 - Detentor da habilitação vigente de Instrutor de Voo (INVA, INVH etc.); ou

  2 - Piloto designado para ministrar instrução de voo em um operador que possua programa
  de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade a
  que está vinculado. (ex: operadores 142, 135 e 90).

  Instrução prévia mínima ao endosso:

  A instrução prevista na seção 61.99 do RBAC nº 61;

  Endosso na CIV Digital:

  Conforme item 5.4.4, o piloto endossante deve selecionar o botão “Endossar” na linha da
  CIV Digital referente ao voo que deseja registrar o endosso. Na tela seguinte (vide figura
  abaixo), no campo Filtro, deverá selecionar o Tipo de Endosso “Check piloto comercial” e
  a Categoria da aeronave utilizada na instrução (por exemplo “Avião”, “Helicóptero” ou “Dirigível”).
  O campo “Endosso*” ficará filtrado com “Check piloto comercial / categoria”, bastando selecionar
  o botão Salvar para concluir o registro.'
