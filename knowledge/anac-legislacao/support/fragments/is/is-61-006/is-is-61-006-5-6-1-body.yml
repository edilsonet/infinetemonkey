cite: 5.6.1
title: A consulta no SACI dos endossos concedidos e dos endossos recebidos é feita pelo menu
  “CIV > Endosso > Visualizar meus endossos”.
text: '5.6.1 A consulta no SACI dos endossos concedidos e dos endossos recebidos é feita pelo
  menu “CIV > Endosso > Visualizar meus endossos”.

  5.6.2 A partir 8 de agosto de 2019 tornou-se obrigatório o registro do endosso no SACI pelo
  piloto endossante por meio da CIV Digital, conforme procedimentos expostos nesta IS. Mantém-se
  também a obrigação de registro do endosso na CIV física pelo piloto endossante, conforme
  procedimentos expostos nesta e nas revisões anteriores desta IS.

  5.6.3 É proibida a operação ou exame de proficiência para o qual se requeira endosso e o
  fato gerador para concessão do endosso ocorra a partir de 8 de agosto de 2019 sem que o
  piloto possua registrado no SACI o recebimento do respectivo endosso, conforme consulta
  a ser realizada no SACI no menu “CIV > Endosso > Visualizar meus endossos”, na aba “Endossos
  Recebidos”, sem prejuízo à observância das demais obrigações regulamentares que devem ser
  satisfeitas para a realização do voo.

  5.6.4 O aluno piloto que receba o endosso para voo solo, conforme item 5.4.8 desta IS, ao
  consultar no SACI seus endossos recebidos (menu “CIV > Endosso > Visualizar meus endossos”,
  aba “Endossos Recebidos”), terá na linha correspondente ao endosso de voo solo a funcionalidade
  de impressão da AUTORIZAÇÃO PARA REALIZAÇÃO DE VOO SOLO DE ALUNO PILOTO, conforme modelo
  no Apêndice D desta IS.

  5.6.5 É obrigatório o porte da AUTORIZAÇÃO PARA REALIZAÇÃO DE VOO SOLO DE ALUNO PILOTO quando
  da realização de cada voo solo pelo aluno piloto bem como apresentá-la ao agente fiscal,
  caso requerido. Antes da realização de cada voo solo, compete ao aluno piloto e ao instrutor
  de voo que supervisionará o voo solo a observância do atendimento e manutenção das condições
  estabelecidas na referida AUTORIZAÇÃO bem como a conferência de disponibilidade dela no
  SACI para impressão.

  5.6.6 Ressalvado o item acima, para a realização de cada voo solo de navegação, além de
  portar a AUTORIZAÇÃO PARA REALIZAÇÃO DE VOO SOLO DE ALUNO PILOTO, o aluno piloto deverá
  portar também sua CIV física contendo a anotação do endosso específico para aquela navegação
  solo, conforme especificado no item 5.4.9 desta IS.'
