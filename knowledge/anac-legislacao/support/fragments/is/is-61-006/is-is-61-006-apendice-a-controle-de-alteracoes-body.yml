text: 'APÊNDICE A - CONTROLE DE ALTERAÇÕES

  REVISÃO

  DATA

  ALTERAÇÃO REALIZADA

  M

  XX de XXXX de 2023

  Trocados os termos “válida” para “vigente” no que diz respeito às habilitações.

