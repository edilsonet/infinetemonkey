title: apendice-b-orientacoes-para-a-leitura-da-tabela-de-endossos(b)
text: 'b) o endossante seja um piloto vinculado a um Centro de Treinamento estrangeiro validado
  pela ANAC.

  B5.6. Coluna 6

  B5.6.1. A Coluna 6 traz eventuais observações adicionais referentes aos endossos, tal como
  o prazo de validade do endosso, quando houver.

  B6. EXEMPLOS:


  Determinado piloto já possuía, antes do dia 22/04/2016, a habilitação de tipo A109, com
  a qual voava aeronave do modelo A 109 A.

  Conforme o previsto no item B5.2.4 deste Apêndice, podemos afirmar que ele já se encontra
  endossado para todos os modelos da célula correspondente ao A 109 A, indicados abaixo:


  Caso este piloto pretenda voar um modelo A 109 A II ou A 109 C, ele não terá de realizar
  qualquer procedimento adicional, uma vez que este modelo se encontra na célula para a qual
  ele já se encontra endossado.

  Suponhamos agora que este mesmo piloto pretenda passar a voar uma aeronave do modelo A 109
  K2:


  Nesse caso, o modelo desejado se encontra em célula diferente dos modelos para os quais
  o piloto já é endossado. Conforme prevê o item B5.2.2 deste Apêndice, o piloto precisará
  por isso obter o endosso para esse modelo, antes que possa atuar como piloto em comando.

  Como o designativo de tipo da coluna 3 é o mesmo dos modelos para os quais o piloto já possuía
  endosso (“A109”), não há necessidade de realizar exame de proficiência, conforme esclarece
  o item B5.3.3 deste Apêndice. Após receber o endosso ele já estará apto a voar.

  Por fim, suponhamos que esse piloto agora pretenda voar uma aeronave de modelo A 109 E:


  Da mesma forma que no caso anterior, aqui o piloto precisará obter um endosso para o modelo,
  já que ele se encontra em uma célula diferente da Coluna 2.

  No entanto, note que agora a transição implica também em mudança do designativo de tipo
  previsto na Coluna 3, de modo que após o endosso ele terá de ser aprovado em exame de proficiência
  por INSPAC ou Examinador Credenciado, conforme prevê o parágrafo 61.199(b)(2) do RBAC nº
  61 e detalha o item B5.3.2 deste Apêndice.'
