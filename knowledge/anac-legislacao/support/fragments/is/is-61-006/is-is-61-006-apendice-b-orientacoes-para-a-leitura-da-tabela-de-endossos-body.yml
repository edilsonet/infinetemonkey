title: APÊNDICE B - orientações para a leitura da tabela DE ENDOSSOS
text: 'APÊNDICE B - orientações para a leitura da tabela DE ENDOSSOS


  B1. O parágrafo 61.199(b)(1) do RBAC nº 61 estabelece que a ANAC pode requerer treinamento
  e endosso para pilotos que pretendam operar determinados modelos de aeronave classe.

  B2. A Tabela de endossos tem por objetivo estabelecer quais modelos requerem este treinamento,
  qual o treinamento necessário e qual a qualificação requerida do piloto que irá assinar
  o endosso.

  B3. Os endossos para as aeronaves a que se refere a Tabela de endossos devem ser lançados
  de acordo com a padronização estabelecida no item 5.4.16 desta IS.

  B4. Modelos de aeronaves classe que não sejam mencionados na Tabela de endossos se consideram
  abrangidos pela previsão do parágrafo 61.199(b) do RBAC nº 61 e, portanto, não requerem
  que o piloto detentor da habilitação de classe pertinente realize treinamento ou endosso
  específico para operá-los. Nesses casos, é de inteira responsabilidade do piloto identificar
  o meio mais adequado de familiarizar-se com o modelo antes de operá-lo, o que poderá incluir
  a leitura dos manuais e da documentação da aeronave, a realização de voos em duplo comando
  com piloto já experiente no modelo, a conclusão de um curso de familiarização etc.

  B5. Para a interpretação da Tabela de endossos, são válidas as seguintes orientações:

  B5.1. Coluna 1

  B5.1.1. A Coluna 1 agrupa as aeronaves da tabela de acordo com o nome de seu fabricante,
  por ordem alfabética. Esta coluna tem apenas a função de facilitar a busca pela aeronave
  de interesse no corpo da tabela.

  B5.2. Coluna 2

  B5.2.1. A Coluna 2 indica os modelos para os quais um endosso é requerido para atuar como
  piloto em comando.

  B5.2.2. Um endosso é necessário sempre que um piloto pretenda “ingressar” em uma célula
  da Coluna 2, isto é, sempre que pretenda passar a operar um dos modelos constantes daquela
  célula.

  B5.2.3. Um único endosso é válido para todos os modelos da mesma célula da Coluna 2. Ou
  seja, para transitar entre modelos de uma mesma célula da Coluna 2 não é necessário endosso
  adicional.

  B5.2.4. Pilotos que já operavam aeronaves da tabela anteriormente à entrada em vigor da
  Emenda 06 ao RBAC nº 61 são considerados já endossados em todas as células da coluna 2 referentes
  aos modelos que operavam.

  B5.3. Coluna 3

  B5.3.1. A Coluna 3 indica os designativos de tipo das habilitações que vigoravam em 24/3/2016,
  que permitem ao piloto identificar se o exame de proficiência previsto no parágrafo 61.199(b)(2)
  do RBAC nº 61 é ou não requerido após a obtenção do endosso.

  B5.3.2. Os pilotos que realizarem transição entre designativos distintos (isto é, células
  distintas na coluna 3) terão de, após receber o endosso, obter aprovação em um exame de
  proficiência realizado por servidor designado ou Examinador Credenciado, antes que possam
  atuar regularmente como piloto em comando no equipamento.

  B5.3.3. Já os pilotos que realizarem a transição entre células distintas na coluna 2 da
  tabela, mas cujo designativo da coluna 3 seja o mesmo, terão de obter o endosso, mas não
  precisam realizar o exame de proficiência.

  B5.3.4. Esta regra será válida até 30/06/2017. Após esta data, a realização desses exames
  não será mais necessária.

  B5.3.5. Esses exames têm por objetivo avaliar se a instrução e o endosso foram de fato eficazes
  em tornar o piloto endossado proficiente. Após a aprovação no exame, não é necessário ao
  piloto aprovado protocolar processo na ANAC ou adotar qualquer providência adicional. Basta
  que o servidor designado ou Examinador Credenciado insira a aprovação na FAP Eletrônica
  do SACI ou cadastre a NEC no caso de operadores 135; a partir desse momento o piloto já
  é considerado apto a atuar como piloto em comando no modelo em questão.

  B5.3.6. Ressalte-se que este exame poderá, caso o piloto deseje, ser utilizado para a revalidação
  de sua habilitação de classe, e nesse caso é requerida a solicitação à ANAC pelo sistema
  de habilitações como qualquer outro processo de revalidação.

  B5.4. Coluna 4

  B5.4.1. A Coluna 4 indica qual a instrução requerida previamente à concessão do endosso.
  Se esta coluna indicar instrução “A critério”, o piloto endossante deverá ministrar a instrução
  de solo e de voo que se mostre suficiente para que o piloto endossado seja capaz de demonstrar
  total conhecimento e proficiência nos seguintes aspectos:'
