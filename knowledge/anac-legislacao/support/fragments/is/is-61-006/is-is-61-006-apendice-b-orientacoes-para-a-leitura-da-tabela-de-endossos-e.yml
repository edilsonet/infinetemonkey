text: 'e) procedimentos em caso de falhas de equipamentos e de motor.

  B5.4.2. Em todos os casos, caso haja avaliação operacional publicada para o modelo de aeronave,
  esta deve ser usada como referência para o treinamento ministrado. As Avaliações Operacionais
  podem ser encontradas na página https://www.gov.br/anac/pt-br/assuntos/regulados/aeronaves/avaliacao-operacional.

  B5.5. Coluna 5

  B5.5.1. A Coluna 5 indica a qualificação mínima do piloto endossante.

  B5.5.2. Não obstante o previsto nesta coluna, em todos os casos é aceitável o lançamento
