title: APÊNDICE C - modelo de autorização para realização de voo solo de aluno piloto
text: 'APÊNDICE C - modelo de autorização para realização de voo solo de aluno piloto

  (Será gerada automaticamente no SACI após obtenção do endosso de voo solo)


  AUTORIZAÇÃO PARA REALIZAÇÃO DE VOO SOLO DE ALUNO PILOTO


  Autorização de voo solo nº [xxxxxx]


  Conforme endosso para voo solo cadastrado digitalmente no Sistema de Aviação Civil (SACI)
  desta Agência pelo instrutor [NOME DO INSTRUTOR], CANAC [XXXXXX], nos termos do parágrafo
  (k) da seção 61.61 e, conforme aplicável, da seção 61.69 do RBAC 61, certifico que o(a)
  aluno(a) piloto [NOME DO ALUNO], CANAC [XXXXXX], cumpre os requisitos previstos no RBAC
  61 para realização dos voos solo de instrução para fins de obtenção de licença de piloto
  privado de [categoria], quais sejam:


  (1) é maior de XX anos;

  (2) possui CMA de Xª classe válido;

  (3) foi aprovado em exame teórico da ANAC correspondente à licença aspirada;

  (4) recebeu o endosso para voo solo de instrutor devidamente habilitado por esta Agência;


  Esta AUTORIZAÇÃO é válida por 90 dias, a contar do dia [dd/mm/aaaa] [data do voo que gerou
  o endosso] e somente para os voos de instrução solo previstos na Subparte C do RBAC nº 61,
  condicionada à manutenção da validade do CMA.

  Esta Autorização poderá ser revogada durante seu período de vigência. Portanto, é obrigatório
  que o aluno e o instrutor verifiquem se a mesma encontra-se disponível no SACI para impressão
  na data de cada voo solo.

  Adicionalmente, para a realização de cada voo solo de navegação, o aluno deverá possuir
  o respectivo endosso.

  É OBRIGATÓRIO o porte da mesma pelo aluno durante o voo solo.


  Rio de Janeiro - RJ, dd/mm/aaaa


  NOME

  Gerente de Certificação de Pessoal'
