title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 As organizações de ensino aeronáutico e os operadores que possuem um programa de treinamento
  aprovado pela ANAC responsabilizam-se solidariamente pela qualidade e regularidade dos endossos
  assinados por seus instrutores no decorrer de seus programas de treinamento/instrução. É
  recomendável que tais entidades estabeleçam procedimentos internos que disciplinem o lançamento
  de endossos por seus instrutores, inclusive indicando expressamente quais instrutores são
  autorizados a endossar em nome da instituição.

  7.2 Os casos omissos serão dirimidos pela SPL.'
