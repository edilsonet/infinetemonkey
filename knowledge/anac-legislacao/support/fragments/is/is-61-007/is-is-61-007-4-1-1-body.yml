text: '4.1.1 currículos de treinamento: são programações completas de treinamentos específicos
  de

  um tripulante ou DOV, para um tipo específico de aeronave e uma determinada função

  que fazem parte do programa de treinamento operacional (PrTrnOp) aprovado de uma

  determinada empresa. Cada currículo é composto por vários segmentos de currículos;'
