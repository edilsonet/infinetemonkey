title: 'notificação de realização de treinamento (NRT): é o processo criado pela empresa'
text: '4.1.3 notificação de realização de treinamento (NRT): é o processo criado pela empresa

  cadastrada no SISHAB, que tem por objetivo detalhar os treinamentos ministrados aos

  tripulantes e DOV da empresa. A NRT também apresenta informações como locais e

  períodos de realização dos segmentos de currículo de cada treinamento, além dos

  instrutores de cada segmento de currículo ministrado;'
