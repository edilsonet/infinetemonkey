title: 'solicitação de autorização de exame (SAE): é o processo criado pela empresa'
text: '4.1.4 solicitação de autorização de exame (SAE): é o processo criado pela empresa

  cadastrada no SISHAB, que tem por objetivo notificar a ANAC sobre a realização de

  exame por examinadores credenciados, ou solicitar a disponibilização de servidor do

  quadro efetivo da ANAC para realização do exame;'
