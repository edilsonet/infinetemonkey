title: 'usuários do SISHAB: empresas certificadas pelo RBAC nº 119, pelo RBAC nº 142 ou'
text: '4.1.7 usuários do SISHAB: empresas certificadas pelo RBAC nº 119, pelo RBAC nº 142
  ou

  órgãos de segurança pública, com PrTrnOp aprovados pela ANAC, que utilizam o

  SISHAB.

  4.2 Lista de abreviaturas (em ordem alfabética):

  CANAC: código ANAC;

  CHT: certificado de habilitação técnica;Data de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  COA - certificado de operador aéreo

  CTAC: centro de treinamento de aviação civil;

  DOV: despachante operacional de voo;

  FAP: ficha de avaliação de pilotos;

  FOP: formulário operacional padrão;

  GCEP: Gerência de Certificação de Pessoal;

  GCTA: Gerência de Operações de Empresas de Transporte Aéreo;

  GOAG: Gerência de Operações de Aviação Geral;

  GRU: guia de recolhimento da união;

  PrTrnOp: programa de treinamento operacional;

  SACI: sistema integrado de aviação civil;

  SISHAB: sistema de habilitações;

  SPO: Superintendência de Padrões Operacionais; e

  TFAC: Taxa de fiscalização de aviação civil.'
