title: Os processos de certificação de tripulantes e DOV ligados aos operadores aéreo, centros
text: '5.1.1 Os processos de certificação de tripulantes e DOV ligados aos operadores aéreo,
  centros

  de treinamento e órgãos de segurança pública devem cumprir os requisitos de certificação

  de pessoal estabelecidos pelo RBAC n° 61, RBHA 63 ou RBAC n° 65, e serem

  complementados pelos requisitos específicos aos quais estão subordinados.'
