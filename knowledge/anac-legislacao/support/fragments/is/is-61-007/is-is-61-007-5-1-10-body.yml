title: Caso a empresa tenha necessidade ou interesse em realizar treinamento ou exame de
text: '5.1.10 Caso a empresa tenha necessidade ou interesse em realizar treinamento ou exame
  de

  maneira diferente da aprovada em seu PrTrnOp, com prazos inferiores aos estabelecidos,

  ou contrariando algum item desta IS ou critérios do SISHAB, é necessário encaminhar à

  ANAC uma solicitação de um procedimento alternativo de treinamento.'
