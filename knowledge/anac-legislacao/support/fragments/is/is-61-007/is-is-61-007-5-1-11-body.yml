title: Todos os documentos, digitalizados e inseridos no SISHAB, que compõem os processos
text: '5.1.11 Todos os documentos, digitalizados e inseridos no SISHAB, que compõem os processos

  de certificação de pessoal devem ser armazenados pela empresa de acordo com o

  estabelecido pelo PrTrnOp e pelos demais regulamentos a que está submetido. Estes

  documentos devem ser apresentados sempre que solicitados pela ANAC.'
