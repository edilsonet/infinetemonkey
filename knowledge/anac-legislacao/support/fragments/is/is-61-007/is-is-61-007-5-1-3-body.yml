text: '5.1.3 Todos os treinamentos e exames constantes do PrTrnOp aprovado serão cadastrados
  no

  SISHAB pela ANAC. Os usuários do SISHAB devem atestar que as informações

  disponíveis para uso do sistema correspondem exatamente à última revisão do PrTrnOp

  aprovado e, caso haja qualquer discrepância, comunicar à ANAC para que sejam

  efetuadas as devidas correções.'
