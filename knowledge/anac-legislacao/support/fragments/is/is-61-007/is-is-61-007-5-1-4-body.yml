title: É responsabilidade do usuário do SISHAB inserir todas as informações sobre os
text: '5.1.4 É responsabilidade do usuário do SISHAB inserir todas as informações sobre os

  treinamentos e exames realizados por seus tripulantes e DOVs para que as habilitaçõesData
  de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  sejam emitidas, respeitando-se condições e prazos impostos pelo sistema. Mesmo os

  treinamentos que não demandem concessão ou revalidação de habilitação, mas que são

  requeridos pela regulamentação e constam do PrTrnOp da empresa, devem ser inseridos

  no SISHAB.'
