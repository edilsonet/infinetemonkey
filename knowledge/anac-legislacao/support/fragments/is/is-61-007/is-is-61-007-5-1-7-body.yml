title: O PrTrnOp da empresa ou do CTAC deverá estar cadastrado no SISHAB da maneira
text: '5.1.7 O PrTrnOp da empresa ou do CTAC deverá estar cadastrado no SISHAB da maneira

  como foi aprovado pela ANAC, cabendo ao usuário do SISHAB verificar se o cadastro

  foi realizado da maneira correta e notificar a ANAC caso seja encontrada qualquer

  discrepância. É responsabilidade do usuário do SISHAB garantir que os treinamentos e

  exames realizados sejam notificados via SISHAB e tenham a devida aderência ao

  PrTrnOp aprovado pela ANAC.'
