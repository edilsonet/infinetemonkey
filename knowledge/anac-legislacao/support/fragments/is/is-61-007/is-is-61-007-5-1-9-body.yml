title: Caso sejam identificadas que as informações prestadas sobre treinamentos e exames são
text: '5.1.9 Caso sejam identificadas que as informações prestadas sobre treinamentos e exames
  são

  inverídicas, possuem falhas, ou não estão de acordo com o PrTrnOp aprovado da empresa,

  tornam-se nulos os treinamentos ou exames realizados e todos os atos administrativos

  posteriores decorrentes dos mesmos.'
