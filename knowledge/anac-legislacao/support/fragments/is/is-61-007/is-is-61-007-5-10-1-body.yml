title: O objetivo da NEC é comunicar a ANAC sobre a necessidade de emissão de habilitação
text: '5.10.1 O objetivo da NEC é comunicar a ANAC sobre a necessidade de emissão de habilitação

  (CHT) após um tripulante ou DOV ter sido aprovado em exame de proficiência ou

  competência.'
