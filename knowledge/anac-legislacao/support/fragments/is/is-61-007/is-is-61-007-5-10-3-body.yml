text: '5.10.3 A GCEP realizará a análise e emitirá a decisão com relação a uma NEC em um prazo
  de

  5 (cinco) dias úteis, contados a partir da data de inserção ou da data de alteração da NEC,

  no caso de ter sido solicitada correção e estabelecida alguma exigência.Data de emissão:
  27 de julho de 2018 IS nº 61-007

  Revisão A'
