title: As NEC devem ser inseridas para cada exame realizado, para cada tripulante ou DOV,
text: '5.10.5 As NEC devem ser inseridas para cada exame realizado, para cada tripulante ou
  DOV,

  que demande a emissão de habilitação. Cada NEC deve referenciar uma SAE específica,

  que por sua vez deverá ter sido inserida após a realização de um treinamento, ou seja,

  com referência a uma NRT específica.'
