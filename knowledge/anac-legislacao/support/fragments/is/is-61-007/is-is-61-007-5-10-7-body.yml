title: Informações como o tipo de treinamento, função, equipamento, examinador credenciado,
text: '5.10.7 Informações como o tipo de treinamento, função, equipamento, examinador credenciado,

  dispositivo de treinamento e exame, datas e locais, devem coincidir ao longo do processo

  de certificação de pessoal, ou seja, devem estar corretamente relacionadas na NRT, na

  SAE, na NEC e na FAP do exame realizado.'
