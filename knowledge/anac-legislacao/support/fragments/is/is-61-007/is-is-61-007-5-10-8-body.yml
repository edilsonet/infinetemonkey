title: Para os exames realizados para finalização de treinamentos requeridos pelo RBAC n°
  121
text: '5.10.8 Para os exames realizados para finalização de treinamentos requeridos pelo RBAC
  n° 121

  ou RBAC n° 135, mas que não demandem emissão de CHT, ou seja, os exames

  operacionais em rota para pilotos, exames de instrutor ou examinador e relativos a

  treinamentos especiais, não se deve inserir NEC no SISHAB, sendo que o processo de

  certificação de pessoal para esse tipo de treinamento será encerrado na etapa da SAE.'
