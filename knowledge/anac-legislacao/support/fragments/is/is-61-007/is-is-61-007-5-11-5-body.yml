text: '5.11.5 Caso a ANAC identifique a existência de alguma inconsistência com o preenchimento
  daData de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  NEC, com o arquivo anexado ou com a TFAC paga, a situação da NEC será alterada para

  “Exigência” ou para “Solicitação de correção”. O motivo da alteração de situação será

  informado para que a empresa corrija a irregularidade encontrada.'
