title: Após a conclusão da análise pela ANAC, a situação da NEC passará para “Concluída”.
text: '5.11.7 Após a conclusão da análise pela ANAC, a situação da NEC passará para “Concluída”.

  Tanto se a solicitação de emissão de habilitação da empresa tiver sido deferida quanto se

  ela tiver sido indeferida por algum motivo, a situação da NEC será “Concluída”. Se a

  habilitação tiver sido concedida será inserida a mensagem “NEC concluída com

  sucesso!”. Caso contrário, será inserido o motivo do indeferimento da solicitação da

  empresa.'
