title: Caso o tripulante ou DOV seja reprovado no exame para emissão de habilitação, não pode
text: '5.11.9 Caso o tripulante ou DOV seja reprovado no exame para emissão de habilitação,
  não pode

  ser inserida, no SISHAB, a NEC relativa ao exame realizado. Neste caso, a FAP deve ser

  arquivada na empresa e a SAE deve ter sua situação alterada para “Concluída”.

  5.12 Processo de certificação de pessoal de aviação civil para concessão de licenças de

  piloto de linha aérea (PLA/PLH)'
