title: No entanto, juntamente com o arquivo da FAP digitalizada, deverão ser carregados no
text: '5.12.3 No entanto, juntamente com o arquivo da FAP digitalizada, deverão ser carregados
  no

  SISHAB os arquivos dos seguintes documentos digitalizados: requerimento padrão

  (formulário disponível no seguinte endereço: http://www.anac.gov.br/assuntos/setor-

  regulado/profissionais-da-aviacao-civil/habilitacao/arquivos/FORMGPEL.pdf/view)

  preenchido e assinado, constando no campo “Observação”, a licença pleiteada;

  declaração de horas expedidas pela empresa (caso para a licença pleiteada seja necessário

  comprovação de horas); e comprovante de pagamento da TFAC de código GRU 97, para

  avaliação de experiência de voo, no caso de haver requisito de experiência de voo para a

  licença pleiteada.'
