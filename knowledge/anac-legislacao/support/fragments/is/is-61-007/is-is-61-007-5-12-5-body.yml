text: '5.12.5 Dessa forma, a solicitação de emissão de licença será analisada juntamente com
  a

  solicitação de emissão de habilitação, de forma que, caso todos os requisitos sejam

  cumpridos, os lançamentos da habilitação e da licença poderão ser simultâneos.

  5.13 Cancelamento compulsório de NRT, SAE e NECData de emissão: 27 de julho de 2018 IS nº
  61-007

  Revisão A'
