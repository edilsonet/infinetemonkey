title: Caso sejam detectadas irregularidades no treinamento da empresa, a situação de NRT
  será
text: '5.13.2 Caso sejam detectadas irregularidades no treinamento da empresa, a situação
  de NRT será

  alterada para “Pendente”. Entretanto, se houver no SISHAB uma SAE que referencia a

  NRT com problemas, para alteração da situação da NRT, haverá também a alteração da

  situação da SAE para “Pendências no treinamento”. Se houver NEC referenciando a

  NRT e a SAE em questão, a situação da NEC também será alterada pela ANAC para

  “Pendências no treinamento”.'
