title: Em qualquer momento, caso sejam confirmadas as irregularidades nas informações
text: '5.13.3 Em qualquer momento, caso sejam confirmadas as irregularidades nas informações

  inseridas em NRTs, SAEs e NECs, a ANAC poderá cancelar o processo falho, de forma

  que o mesmo apresentará a situação “Cancelada” no SISHAB.'
