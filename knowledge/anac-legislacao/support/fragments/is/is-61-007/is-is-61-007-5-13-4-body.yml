title: Após o cancelamento de uma NRT, os processos posteriores que dependem do
text: '5.13.4 Após o cancelamento de uma NRT, os processos posteriores que dependem do

  treinamento informado, como SAEs e NECs, serão igualmente cancelados e os atos

  administrativos decorrentes desses processos serão considerados nulos. Além disso, não

  será permitido adicionar ao SISHAB SAEs e NECs que referenciem a NRT cancelada.'
