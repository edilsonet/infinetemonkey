title: Após a análise da ANAC acerca da revisão do PrTrnOp da empresa, caso não sejam
text: '5.14.2 Após a análise da ANAC acerca da revisão do PrTrnOp da empresa, caso não sejam

  encontradas não conformidades, será emitido o documento de aprovação (final ou inicial)

  do documento, ou seja, um FOP 111. Sempre que esta revisão ocasionar em modificações

  dos segmentos de currículos e suas cargas horárias dos treinamentos, o cadastro no

  SISHAB será atualizado simultaneamente à emissão do documento de aprovação.'
