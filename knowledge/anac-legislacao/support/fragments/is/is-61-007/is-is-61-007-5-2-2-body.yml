text: '5.2.2 Uma empresa que esteja em processo de certificação inicial de acordo com o RBAC

  n°119, e cujo PrTrnOp já tenha sido aprovado, mas ainda não tenha recebido seu COA,

  deve solicitar o cadastro no SISHAB para possibilitar o treinamento e a certificação deData
  de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  seus tripulantes e DOVs (se aplicável), uma vez que para a realização da Fase 4 do

  processo de certificação de operador aéreo, definido na IS n° 119-001 ou IS n° 119-004,

  é preciso que a empresa possua pessoal devidamente treinado e qualificado.'
