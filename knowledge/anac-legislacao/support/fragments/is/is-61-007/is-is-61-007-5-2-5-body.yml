title: A partir dessas informações será criado o nome de usuário e senha de acesso, que serão
text: '5.2.5 A partir dessas informações será criado o nome de usuário e senha de acesso,
  que serão

  enviadas por e-mail à pessoa indicada. O nome de usuário terá preferencialmente o

  formato nome.trigrama, onde nome é o nome da pessoa indicada, e trigrama se refere

  às três letras ou números constantes do número do COA da empresa.'
