cite: 5.2.7
title: A carta de solicitação de cadastro deve ser acompanhada do termo de comprometimento
text: '5.2.7 A carta de solicitação de cadastro deve ser acompanhada do termo de comprometimento

  para utilização do SISHAB, conforme modelo do Apêndice B desta IS. Quando solicitado

  um novo cadastro e a empresa já tiver encaminhado o termo de comprometimento à

  ANAC, a empresa deve mencionar na solicitação o número do protocolo referente ao

  termo de comprometimento.'
