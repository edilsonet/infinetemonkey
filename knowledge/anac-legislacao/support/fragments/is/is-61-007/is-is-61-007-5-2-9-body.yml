title: Caso a pessoa cadastrada para acessar o SISHAB tenha problemas de acesso como
text: '5.2.9 Caso a pessoa cadastrada para acessar o SISHAB tenha problemas de acesso como

  esquecimento ou expiração de senhas de acesso, estes deverão utilizar a opção “Esqueci

  minha senha” disponível na página de acesso ao SACI. Além disso, poderão entrar em

  contato com a gerência da ANAC responsável pelo cadastro no SISHAB para que a senha

  de acesso seja redefinida.'
