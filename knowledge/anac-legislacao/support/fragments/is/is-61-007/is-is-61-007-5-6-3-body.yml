title: 'A numeração da NRT observará automaticamente o seguinte formato:'
text: '5.6.3 A numeração da NRT observará automaticamente o seguinte formato:

  NN/TRIGRAMA/ANO, sendo que o número (no formato NN) segue a ordem crescente.

  A numeração é reiniciada a cada ano.'
