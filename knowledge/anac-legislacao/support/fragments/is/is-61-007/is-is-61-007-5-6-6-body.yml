title: A NRT deve ser inserida no SISHAB com as informações de data, horário, local, instrutor
text: '5.6.6 A NRT deve ser inserida no SISHAB com as informações de data, horário, local,
  instrutor

  e o módulo do treinamento a ser aplicado, conforme estrutura de treinamento exposta no

  item 5.4 desta IS, além do período de realização do treinamento como um todo. Por

  exemplo, para os treinamentos de voo em simulador, é necessário inserir as datas e os

  horários das sessões de simulador, que compõem o referido treinamento.'
