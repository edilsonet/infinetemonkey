title: Na NRT devem constar os nomes dos alunos que receberão o treinamento. Esta lista de
text: '5.6.9 Na NRT devem constar os nomes dos alunos que receberão o treinamento. Esta lista
  de

  nomes pode ser alterada até o dia anterior ao início do treinamento. Caso até o dia do

  início do treinamento a lista de alunos esteja vazia, a NRT será invalidada e

  posteriormente cancelada. Por meio da opção “Editar Turmas”, a empresa poderá alterar

  os alunos que participarão do treinamento, até 1 (um) dia antes do início do mesmo.'
