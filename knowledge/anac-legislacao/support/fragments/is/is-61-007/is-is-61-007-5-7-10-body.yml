title: A ANAC analisará o caso específico de cada treinamento não realizado conforme
text: '5.7.10 A ANAC analisará o caso específico de cada treinamento não realizado conforme

  notificado, para avaliar as modificações realizadas. Dependendo do resultado da análise,

  a ANAC poderá solicitar que a NRT relativa ao treinamento modificado seja cancelada e

  uma nova NRT seja inserida no SISHAB, respeitando os prazos já descritos.'
