title: A ANAC poderá alterar a situação da NRT para “Pendente” até que as correções
text: '5.7.12 A ANAC poderá alterar a situação da NRT para “Pendente” até que as correções

  solicitadas sejam inseridas no SISHAB. Após a realização das correções, a empresa

  deverá solicitar à ANAC que a situação da NRT seja novamente alterada para “Em

  Andamento”.'
