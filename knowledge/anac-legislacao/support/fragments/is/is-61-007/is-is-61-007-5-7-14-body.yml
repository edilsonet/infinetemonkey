title: É importante ressaltar que todas as NRTs inseridas no SISHAB podem implicar no
text: '5.7.14 É importante ressaltar que todas as NRTs inseridas no SISHAB podem implicar
  no

  planejamento e na execução de ações de fiscalização e vigilância continuada da ANAC.

  Assim, o cancelamento de uma NRT em curto prazo onera a administração pública, pois

  gera desperdícios de recursos ao causar o cancelamento das atividades planejadas.

  Portanto, a empresa deve comunicar a ANAC, o mais breve possível, sobre qualquer

  alteração nas informações inseridas no sistema.'
