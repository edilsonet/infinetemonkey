title: Caso a NRT apresente a situação “Pendente” significa que alguma das informações
text: '5.7.3 Caso a NRT apresente a situação “Pendente” significa que alguma das informações

  inseridas não está atendendo a requisitos de regulamentos, do PrTrnOp ou do próprio

  SISHAB, e que a NRT necessita de correção ou de autorização da ANAC. Nesse caso, o

  sistema informará o motivo da pendência e a empresa poderá corrigir as informações

  inseridas.'
