text: '5.7.4.1 Esta carta deve descrever o treinamento que será realizado, os motivos pelos
  quais a

  empresa tem interesse no procedimento alternativo proposto e os motivos pelos quais sua

  adoção pode ser realizada sem prejuízo à qualidade do treinamento e à qualificação do

  pessoal de aviação civil, garantindo a manutenção dos níveis de segurança operacional.'
