title: A empresa deve encaminhar documentos e evidências que subsidiem os argumentos
text: '5.7.4.2 A empresa deve encaminhar documentos e evidências que subsidiem os argumentos

  utilizados para solicitação do procedimento alternativo. O procedimento alternativo

  proposto não pode infringir ou ser menos restritivo que os requisitos estabelecidos pelos

  regulamentos específicos aplicáveis à empresa.'
