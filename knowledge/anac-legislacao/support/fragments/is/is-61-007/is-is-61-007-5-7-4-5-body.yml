title: A empresa deverá notificar a ANAC, por e-mail, sobre a inserção da NRT com
text: '5.7.4.5 A empresa deverá notificar a ANAC, por e-mail, sobre a inserção da NRT com

  procedimento alternativo no SISHAB. Assim, o setor da ANAC responsável pela

  aceitação e autorização do treinamento poderá editar a situação da NRT para “Em

  andamento”, de forma que o treinamento possa ser considerado válido, assim como as

  ações futuras relativas a exames e à emissão de habilitações técnicas.'
