text: '5.7.5 A situação “Solicitação de prorrogação” é utilizada quando se encerra o período
  de

  validade da NRT, ou seja, quando a NRT apresenta situação “Vencida”; ou quando a

  empresa tem ciência de que não será possível cumprir o treinamento dentro do período

  de validade da NRT.'
