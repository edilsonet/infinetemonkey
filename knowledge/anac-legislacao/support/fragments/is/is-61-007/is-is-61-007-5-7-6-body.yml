title: Por meio da opção do SISHAB, “Prorrogar”, a empresa poderá solicitar a prorrogação
text: '5.7.6 Por meio da opção do SISHAB, “Prorrogar”, a empresa poderá solicitar a prorrogação

  da NRT para que o treinamento realizado não seja desconsiderado e o processo de

  certificação de seus tripulantes ou DOV seja continuado. É necessário inserir o(s)

  motivo(s) pelo(s) qual(is) é demandada a prorrogação e até qual data a empresa deseja a

  prorrogação.'
