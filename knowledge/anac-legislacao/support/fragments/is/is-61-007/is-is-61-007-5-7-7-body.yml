cite: 5.7.7
title: A solicitação de prorrogação de uma NRT será tratada pela ANAC como uma solicitação
text: '5.7.7 A solicitação de prorrogação de uma NRT será tratada pela ANAC como uma solicitação

  de procedimento alternativo. Assim, a solicitação por meio do SISHAB deve ser

  acompanhada do envio de uma carta, conforme modelo do Apêndice D desta IS, em que

  a empresa explica os motivos do não cumprimento do prazo de validade da NRT e quais

  as ações propostas para garantir a qualidade do treinamento e da formação de seus

  tripulantes ou DOVs. Nesta solicitação, a empresa poderá propor a realização de um

  treinamento adicional para revisão dos segmentos de currículos realizados anteriormente.'
