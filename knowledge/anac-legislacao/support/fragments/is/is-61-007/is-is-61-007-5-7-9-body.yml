text: '5.7.9 Caso algum treinamento ou segmento de currículo não possa ser cumprido da maneiraData
  de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  como foi inserido no SISHAB, ou haja a necessidade de alteração de data, local ou

  horário, por qualquer motivo, a empresa deve notificar a ANAC o mais breve possível

  por meio de carta formal enviada via protocolo, sistema SEI ou por e-mail, justificando

  as modificações necessárias.'
