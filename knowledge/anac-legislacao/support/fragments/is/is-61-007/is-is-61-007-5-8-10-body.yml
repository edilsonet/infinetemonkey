title: Para uma empresa regida pelo RBAC nº 121, deve ser selecionado o tipo de exame
text: '5.8.10 Para uma empresa regida pelo RBAC nº 121, deve ser selecionado o tipo de exame

  “Equipamento (simulador)” quando o exame realizado tiver o objetivo de demonstrar

  cumprimento da seção 121.441 do RBAC nº 121, para concessão ou revalidação da

  habilitação do equipamento e IFR do piloto.'
