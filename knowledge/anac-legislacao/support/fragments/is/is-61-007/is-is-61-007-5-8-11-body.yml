title: Ainda para a empresa que opera segundo o RBAC nº 121, o exame “IFR (simulador)”
text: '5.8.11 Ainda para a empresa que opera segundo o RBAC nº 121, o exame “IFR (simulador)”

  deve ser selecionado quando o exame realizado tiver o objetivo de demonstrar o

  cumprimento da seção 121.441 do RBAC nº 121, para revalidação apenas da habilitação

  IFR do piloto.'
