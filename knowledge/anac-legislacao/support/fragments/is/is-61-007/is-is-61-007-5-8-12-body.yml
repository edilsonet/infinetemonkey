title: A empresa regida pelo RBAC n° 121 deve selecionar os exames “Rota (aeronave)”
text: '5.8.12 A empresa regida pelo RBAC n° 121 deve selecionar os exames “Rota (aeronave)”

  quando o exame realizado tiver o objetivo de demonstrar o cumprimento da seção

  121.440 do RBAC nº 121.'
