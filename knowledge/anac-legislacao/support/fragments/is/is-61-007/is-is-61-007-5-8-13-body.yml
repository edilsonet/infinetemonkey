title: Para uma empresa que opera segundo os requisitos do RBAC n°135, deve ser selecionado
text: '5.8.13 Para uma empresa que opera segundo os requisitos do RBAC n°135, deve ser selecionado

  o tipo de exame “Equipamento (simulador)” ou “Equipamento (aeronave)” quando o

  exame realizado tiver o objetivo de demonstrar cumprimento da seção 135.293 do RBAC

  nº 135, para concessão ou revalidação da habilitação do equipamento e habilitação IFR

  (se aplicável) do piloto.'
