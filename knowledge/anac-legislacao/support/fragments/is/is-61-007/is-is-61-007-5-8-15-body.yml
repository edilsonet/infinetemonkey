text: '5.8.15 A empresa regida pelo RBAC nº 135 deve selecionar o exame “Rota (aeronave)”
  ou

  “Rota (Simulador)” quando o exame realizado tiver o objetivo de demonstrar o

  cumprimento da seção 135.299 do RBAC nº 135. O lançamento desta SAE deve estar

  vinculado a uma NRT específica, conforme estrutura de cadastro de treinamento exposta

  no item 5.6 desta IS.'
