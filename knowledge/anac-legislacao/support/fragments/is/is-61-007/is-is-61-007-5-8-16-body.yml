title: Os exames de competência para concessão ou revalidação de habilitação de comissários
text: '5.8.16 Os exames de competência para concessão ou revalidação de habilitação de comissários

  de voo devem ser notificados como “Equipamento (aeronave)”, para os exames

  realizados em aeronaves, e como “Equipamento (simulador)”, para os exames

  realizados em mock-up.'
