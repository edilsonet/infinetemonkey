text: '5.8.19 Os exames de competência relacionados ao credenciamento de examinadores

  credenciados de empresas 135 devem ser inseridos como SAE vinculada a NRT

  específica, conforme estrutura de cadastro de treinamento exposta no item 5.6 desta IS.'
