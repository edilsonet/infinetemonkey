text: '5.8.21 Vale ressaltar que a determinação da forma de realização do exame, em FSTD ou
  em

  aeronave, é de responsabilidade da empresa e do representante indicado como

  responsável pelos treinamentos, devendo ser feita de acordo com os requisitos

  estabelecidos no RBAC n° 121 ou RBAC n° 135, conforme aplicável, no PrTrnOp

  aprovado da empresa, ou em regulamentação específica.'
