title: No caso de exame realizado em simulador, a empresa deverá, no momento oportuno,
text: '5.8.23 No caso de exame realizado em simulador, a empresa deverá, no momento oportuno,

  selecionar o CTAC em que ocorrerá o exame, dentre os disponíveis na lista de CTACs

  certificados ou validados pela ANAC. A lista completa dos CTACs com certificação ou

  validação válida pode ser acessada em:

  http://www2.anac.gov.br/Arquivos/pdf/Lista_de_Treinamentos_de_Tipo.pdf.'
