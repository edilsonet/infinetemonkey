title: No caso de exame realizado em aeronave, devem ser informados os horários locais de
text: '5.8.26 No caso de exame realizado em aeronave, devem ser informados os horários locais
  de

  início e término do voo, além dos designativos ICAO dos aeródromos de origem e

  destino. Caso o exame seja realizado em voo local, os aeródromos de origem e destino

  serão iguais.'
