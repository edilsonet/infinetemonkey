title: O candidato a examinador credenciado quando avaliado na função de examinador deve
text: '5.8.30 O candidato a examinador credenciado quando avaliado na função de examinador
  deve

  ser observado durante um exame real em outro tripulante ou DOV da empresa. Portanto,

  a empresa deve assegurar-se da compatibilidade das referidas SAE. Neste caso, deverão

  ser inseridas duas SAE, uma para o exame de observação do examinador credenciado e

  outra relativa ao exame que será realizado pelo examinador. A empresa deverá garantir a

  compatibilidade das referidas SAE.'
