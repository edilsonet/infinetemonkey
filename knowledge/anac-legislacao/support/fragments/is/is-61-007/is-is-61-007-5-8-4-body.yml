text: '5.8.4 As SAE devem ser inseridas para cada tipo de exame requerido pelo RBAC n° 121
  ou

  pelo RBAC n° 135. Os tipos dos exames variam de acordo com o tipo de treinamento,

  tipo de equipamento e função desempenhada, o que demanda a inserção de SAEs

  independentes para cada um deles.'
