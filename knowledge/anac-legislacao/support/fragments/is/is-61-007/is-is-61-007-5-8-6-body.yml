title: As SAE devem ser inseridas no SISHAB com antecedência mínima de 15 (quinze) dias
text: '5.8.6 As SAE devem ser inseridas no SISHAB com antecedência mínima de 15 (quinze) dias

  para a realização do voo de exame de proficiência no Brasil e 40 (quarenta) dias para o

  exame de proficiência no exterior.'
