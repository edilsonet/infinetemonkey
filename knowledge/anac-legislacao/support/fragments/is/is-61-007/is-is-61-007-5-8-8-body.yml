title: Caso tenham sido postadas mais de uma NRT para o mesmo treinamento, a empresa
text: '5.8.8 Caso tenham sido postadas mais de uma NRT para o mesmo treinamento, a empresa

  deverá referenciar na SAE a NRT que contém o segmento de currículo referente ao

  treinamento de voo da aeronave, para o caso do treinamento de pilotos. Para o treinamento

  de DOVs e comissários, a empresa deve referenciar a NRT que contém os segmentos de

  currículo mais significativos para o treinamento notificado.'
