text: '5.9.1 A SAE pode apresentar as seguintes situações: “Em aberto”, “Em andamento”,

  “Retorno para correção”, “Solicitação de prorrogação”, “Em convocação”,

  “Aprovada”, “Reprovada”, “Cancelada” e “Pendência no treinamento”.'
