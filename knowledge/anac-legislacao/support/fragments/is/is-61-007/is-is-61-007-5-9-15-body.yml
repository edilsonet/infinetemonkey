text: '5.9.15 A responsabilidade da alteração de situação da SAE para “Reprovada” é da empresa.
  A

  situação da SAE deve ser alterada em até 5 (cinco) dias úteis após a realização do exame.

  Caso esse prazo não seja cumprido, as SAE serão canceladas pela ANAC.'
