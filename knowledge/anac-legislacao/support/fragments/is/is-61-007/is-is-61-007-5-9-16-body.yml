text: '5.9.16 Ao alterar a situação da SAE para “Reprovada”, a empresa deverá arquivar a FAP

  original, referente ao exame ao qual o tripulante ou DOV foi submetido, e carregar o

  arquivo digitalizado da FAP na respectiva SAE. O tamanho máximo para cada arquivo éData
  de emissão: 27 de julho de 2018 IS nº 61-007

  Revisão A

  de 300kB.'
