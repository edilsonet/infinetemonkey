title: Caso haja a necessidade de alteração de data, local ou horário de uma SAE, por qualquer
text: '5.9.18 Caso haja a necessidade de alteração de data, local ou horário de uma SAE, por
  qualquer

  motivo, a empresa deve notificar a ANAC o mais brevemente possível por meio de carta

  formal enviada via protocolo ou por e-mail, justificando as modificações necessárias.'
