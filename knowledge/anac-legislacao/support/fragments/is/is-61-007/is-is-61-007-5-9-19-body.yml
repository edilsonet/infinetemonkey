title: A ANAC analisará o caso específico de cada treinamento não realizado conforme
text: '5.9.19 A ANAC analisará o caso específico de cada treinamento não realizado conforme

  notificado, para avaliar as modificações realizadas. Dependendo do resultado da análise,

  a ANAC poderá solicitar que a SAE relativa ao exame modificado seja cancelada e uma

  nova SAE seja inserida no SISHAB, respeitando os prazos já descritos.'
