title: A ANAC poderá alterar a situação da SAE para “Retorno para correção” até que as
text: '5.9.21 A ANAC poderá alterar a situação da SAE para “Retorno para correção” até que
  as

  correções solicitadas sejam inseridas no SISHAB. Após a realização das correções, a

  empresa deverá solicitar à ANAC que a situação da SAE seja novamente alterada para

  “Em andamento”.'
