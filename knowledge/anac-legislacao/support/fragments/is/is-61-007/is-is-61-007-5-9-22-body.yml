title: É importante ressaltar que todas as SAE inseridas no SISHAB podem implicar no
text: '5.9.22 É importante ressaltar que todas as SAE inseridas no SISHAB podem implicar no

  planejamento e na execução de ações de vigilância continuada da ANAC, com relação

  aos exames da empresa, mesmo aquelas em que não é solicitado examinador da ANAC

  para realização da avaliação.'
