title: O cancelamento de SAE em curto prazo onera a administração pública, gerando
text: '5.9.23 O cancelamento de SAE em curto prazo onera a administração pública, gerando

  desperdícios de recursos públicos ao se cancelar a execução de atividades de fiscalização.

  Sendo assim, a empresa deve sempre comunicar a ANAC o mais breve possível sobre

  qualquer alteração nas informações inseridas no SISHAB.'
