title: Caso o SISHAB reconheça alguma inconsistência ou falta de informação a situação da
text: '5.9.3 Caso o SISHAB reconheça alguma inconsistência ou falta de informação a situação
  da

  SAE será “Em aberto” e o motivo para isso será informado. Exemplos de pendências

  que acarretam na situação em aberto são: falta de informações acerca do pagamento da

  TFAC exigida para o exame solicitado e falta de informações como datas e horários,

  acerca da rota ou do simulador em que ocorrerá o exame.'
