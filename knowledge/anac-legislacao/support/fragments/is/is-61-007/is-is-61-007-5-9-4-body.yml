title: A situação “Em convocação” é utilizada pela ANAC para caracterizar aquelas SAE que
text: '5.9.4 A situação “Em convocação” é utilizada pela ANAC para caracterizar aquelas SAE
  que

  necessitam da designação de servidor da ANAC para realização do exame e aguardam os

  trâmites administrativos internos para tal convocação.Data de emissão: 27 de julho de 2018
  IS nº 61-007

  Revisão A'
