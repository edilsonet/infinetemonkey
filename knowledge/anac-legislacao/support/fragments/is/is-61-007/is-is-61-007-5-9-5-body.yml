title: Durante as atividades de fiscalização corrente, os servidores da ANAC podem verificar
text: '5.9.5 Durante as atividades de fiscalização corrente, os servidores da ANAC podem verificar

  irregularidades nas SAE inseridas no SISHAB. Neste caso, a situação da SAE será

  alterada para “Retorno para correção” e será informado o motivo da alteração da

  situação.'
