title: Em uma SAE com situação “Retorno para correção” a empresa deverá corrigir as
text: '5.9.6 Em uma SAE com situação “Retorno para correção” a empresa deverá corrigir as

  informações discrepantes editando o conteúdo da SAE, por meio da opção “Editar”.

  Após a correção, a empresa deverá selecionar a opção “Enviar resolução da SAE” para

  que a situação da SAE, após a análise da ANAC, seja alterada novamente para “Em

  andamento”. Neste caso, a empresa deverá enviar também um e-mail à gerência da

  ANAC responsável pela certificação, para que a SAE seja analisada e caso seja aceita,

  sua situação seja alterada para “Em andamento”.'
