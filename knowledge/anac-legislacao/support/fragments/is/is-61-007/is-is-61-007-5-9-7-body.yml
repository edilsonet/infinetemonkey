title: Caso seja necessário alterar a data de um exame de uma SAE “Em andamento”, a
text: '5.9.7 Caso seja necessário alterar a data de um exame de uma SAE “Em andamento”, a

  empresa deverá selecionar a opção “Solicitar prorrogação/alteração de SAE” e

  informar o motivo e qual a alteração proposta, ou seja, para alteração de data, é necessário

  informar a nova data proposta para realização do exame. Após a empresa solicitar

  alteração ou prorrogação, a SAE apresentará a situação “Solicitada prorrogação”.'
