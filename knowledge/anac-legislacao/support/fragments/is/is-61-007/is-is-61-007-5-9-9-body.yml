title: Somente é possível solicitar alteração ou prorrogação de SAE em data anterior à data
text: '5.9.9 Somente é possível solicitar alteração ou prorrogação de SAE em data anterior
  à data

  informada para realização do exame. Após essa data a SAE deve ser cancelada pela

  empresa e uma nova SAE deve ser inserida. Depois de cancelada a SAE apresentará

  situação “Cancelada”.'
