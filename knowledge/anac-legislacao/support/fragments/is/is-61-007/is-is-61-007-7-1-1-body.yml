title: Uma empresa ou CTAC que não utiliza o SISHAB para gerenciamento de seus
text: '7.1.1 Uma empresa ou CTAC que não utiliza o SISHAB para gerenciamento de seus

  treinamentos e exames tem o prazo de até 26 de outubro de 2018 para solicitar acesso ao

  sistema e iniciar a inserção das informações relacionadas aos treinamentos de seus

  tripulantes e DOVs no SISHAB, conforme orientações e procedimentos descritos nesta

  IS.'
