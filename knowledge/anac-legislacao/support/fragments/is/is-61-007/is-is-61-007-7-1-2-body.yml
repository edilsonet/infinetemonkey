title: A partir de 27 de outubro de 2018, os treinamentos e exames realizados que não estiverem
text: '7.1.2 A partir de 27 de outubro de 2018, os treinamentos e exames realizados que não
  estiverem

  inseridos no SISHAB não serão considerados válidos para fins de qualificação, segundo

  requisitos do RBAC n°121 e RBAC n°135, ou para emissão licenças ou habilitações, ou

  revalidação de habilitações, de tripulantes e DOVs da empresa.'
