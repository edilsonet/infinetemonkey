cite: 7.1.3
title: Empresas com processo de certificação inicial em andamento ou que solicitem
text: '7.1.3 Empresas com processo de certificação inicial em andamento ou que solicitem

  formalmente a certificação segundo o RBAC n° 119 a partir de 27 de julho de 2018

  deverão observar os procedimentos desta IS desde o primeiro treinamento aplicado pela

  empresa a seus tripulantes e DOVs, assim como definido no item 5.2.2 desta IS.'
