  SISHAB

  LOGOTIPO

  DA EMPRESA Nome da Empresa

  Carta nº NN/TRIGRAMA/ANO

  Local, data

  Ao Sr. Gerente de Operações de Aviação Geral (GOAG), [para empresas regidas pelo RBAC nº
  135

  ou órgão de segurança pública], ou

  Ao Sr. Gerente de Operações de Empresas de Transporte Aéreo (GCTA), [para empresas regidas

  pelo RBAC nº 121]

  Assunto: Solicitação de interrupção de acesso ao SISHAB

  Sr. Gerente,

  Solicito a interrupção de acesso no Sistema de Habilitações (SISHAB) do(s)

  colaborador(es) da [Nome da Empresa], detentora do certificado de operador aéreo de número

  [número do COA da empresa], listado(s) abaixo:'
