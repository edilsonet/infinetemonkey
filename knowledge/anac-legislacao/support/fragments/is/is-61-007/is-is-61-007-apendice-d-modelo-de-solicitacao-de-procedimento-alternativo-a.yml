text: 'a) [argumentação, apresentando no mínimo quais os itens do (PrTrnOp) aprovado

  propõem-se que sejam suprimidos ou acrescentados ao treinamento específico em questão, com

  justificativas baseadas nos requisitos mínimos presentes na regulamentação aplicável. Identificar
  os

  pilotos/comissários/DOVs que participarão do treinamento. Se a solicitação de procedimento

  alternativo for feita baseada em experiência anterior do piloto/comissário/DOV, deve-se
  anexar

  documentos que comprovem as informações apresentadas pela empresa].

  Atenciosamente,

  ____________________________________

  ASSINATURA / NOME / CARGO'
