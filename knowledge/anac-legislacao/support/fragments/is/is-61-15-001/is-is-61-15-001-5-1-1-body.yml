title: A seção 21.37 do RBAC nº 21, intitulado “Certificação de Produto Aeronáutico”,
text: '5.1.1 A seção 21.37 do RBAC nº 21, intitulado “Certificação de Produto Aeronáutico”,

  estabelece que o requerente de um certificado de tipo de aeronave deve apresentar um

  piloto que possua qualificações e habilitações apropriadas, que será responsável pela

  condução dos ensaios em voo requeridos.'
