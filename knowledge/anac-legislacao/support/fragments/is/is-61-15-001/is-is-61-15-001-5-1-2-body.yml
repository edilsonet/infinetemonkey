text: '5.1.2 Para a realização dos ensaios em voo a que se refere a seção 21.37 do RBAC nº
  21, são

  considerados apropriadamente qualificados e habilitados os pilotos detentores de uma

  Autorização para Piloto de Ensaios em Voo, expedida pela ANAC nos termos desta IS e

  do parágrafo 61.15(c) do RBAC nº 61, intitulado “Licenças, habilitações e certificados

  para pilotos”.

  5.2 Prerrogativas e limitações do titular da Autorização para PEV1 ou PEV2'
