section_title: O detentor de uma Autorização para PEV1 pode atuar como piloto em comando ou
subsection_id: a
cite: 5.2.1(a)
title: 5.2.1(a)
text: 'a) voos de ensaio em aeronaves sem Certificado de Tipo e operando com CAVE para:

  I - pesquisa e desenvolvimento iniciais de um novo tipo de aeronave;

  II - pesquisa e desenvolvimento para investigar características ou técnicas de

  projeto incomuns;

  III - pesquisa e desenvolvimento para determinar ou expandir o envelope de voo;

  IV - demonstração de cumprimento de requisitos referentes a desempenho,

  qualidade de voo e sistemas de aeronaves;

  V - pesquisa e desenvolvimento para determinar características de voo e

  qualidade de pilotagem;

  VI - exibição; e

  VII - pesquisa de mercado;'
