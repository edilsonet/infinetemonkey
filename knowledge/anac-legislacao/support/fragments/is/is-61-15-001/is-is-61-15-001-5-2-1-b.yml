section_title: O detentor de uma Autorização para PEV1 pode atuar como piloto em comando ou
subsection_id: b
cite: 5.2.1(b)
title: 5.2.1(b)
text: 'b) voos de ensaio em aeronaves com Certificado de Tipo e operando com CAVE para:

  I - pesquisa e desenvolvimento para investigar características incomuns que

  tenham sido observadas em serviço;

  II - pesquisa e desenvolvimento para determinar ou expandir o envelope de voo;Data de emissão:
  01/07/2019 IS nº 61.15-001

  Revisão D

  III - demonstração de cumprimento de requisitos referentes a desempenho,

  qualidade de voo e sistemas da aeronave;

  IV - pesquisa e desenvolvimento para determinar características de voo e

  qualidade de pilotagem;

  V - exibição;

  VI - pesquisa de mercado; e

  VII - pesquisa e desenvolvimento em aeronaves cujo desempenho ou

  características de voo tenham sido significativamente modificadas;'
