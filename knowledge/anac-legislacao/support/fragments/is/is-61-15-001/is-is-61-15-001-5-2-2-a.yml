section_title: 'O detentor de uma Autorização para PEV2 pode:'
subsection_id: a
cite: 5.2.2(a)
title: 5.2.2(a)
text: 'a) atuar como piloto em comando em voos de ensaio em aeronaves sem Certificado

  de Tipo e operando com CAVE para:

  I - pesquisa e desenvolvimento referentes à determinação de parâmetros de

  desempenho, desde que não afetem as qualidades de voo ou de pilotagem da

  aeronave;

  II - pesquisa e desenvolvimento referentes a sistemas embarcados, desde que não

  afetem as qualidades de voo ou de pilotagem da aeronave;

  III - demonstração de cumprimento de requisitos referentes a sistemas

  embarcados, desde que não afetem as qualidades de voo ou de pilotagem da

  aeronave;

  IV - exibição; e

  V - pesquisa de mercado;'
