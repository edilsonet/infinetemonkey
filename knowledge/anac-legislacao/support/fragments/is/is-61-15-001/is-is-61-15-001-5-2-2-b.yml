section_title: 'O detentor de uma Autorização para PEV2 pode:'
subsection_id: b
cite: 5.2.2(b)
title: 5.2.2(b)
text: 'b) atuar como piloto em comando em voos de ensaio em aeronaves com Certificado

  de Tipo e operando com AEV ou CAVE para:

  I - ensaio em voo de produção de aeronaves recém-fabricadas;

  II - pesquisa e desenvolvimento realizados depois da incorporação de uma

  modificação de projeto, ainda não aprovada, que não implique em

  modificação no Certificado de Tipo, desde que não afetem as qualidades de

  voo ou de pilotagem da aeronave;

  III - demonstração de cumprimento de requisitos realizados depois da

  incorporação de uma modificação de projeto, ainda não aprovada, que não

  implique em modificação no Certificado de Tipo, desde que não afetem asData de emissão:
  01/07/2019 IS nº 61.15-001

  Revisão D

  qualidades de voo ou de pilotagem da aeronave;

  IV - exibição;

  V - pesquisa de mercado;'
