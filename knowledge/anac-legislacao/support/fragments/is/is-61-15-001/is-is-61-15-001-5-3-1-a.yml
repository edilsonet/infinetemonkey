section_title: 'O postulante a uma Autorização de PEV1 deve cumprir as seguintes exigências
  em:'
subsection_id: a
cite: 5.3.1(a)
title: 5.3.1(a)
text: 'a) Conhecimentos - Possuir conhecimento nos seguintes aspectos:

  I - métodos e práticas de ensaios em voo;

  II - preparo e condução de ensaios em voo de maneira segura e realização de

  ensaios novos ou complexos;

  III - planejamento e execução de ensaios para abertura gradativa de envelope de

  voo;

  IV - organização, interpretação de dados e elaboração de relatórios de ensaios em

  voo;

  V - capacidade técnica de observar e relatar claramente o voo e os resultados dos

  ensaios realizados;

  VI - adaptabilidade rápida e segurança em novas aeronaves;

  VII - habilidade de trabalho em equipe;

  VIII - conhecimentos em aeronaves e sistemas;

  IX - autoconfiança e conhecimento dos seus próprios limites;Data de emissão: 01/07/2019
  IS nº 61.15-001

  Revisão D

  X - conhecimento do ambiente técnico relacionado à atividade de ensaios em voo

  (organizações envolvidas, meios disponíveis, normas e processos aplicáveis).'
