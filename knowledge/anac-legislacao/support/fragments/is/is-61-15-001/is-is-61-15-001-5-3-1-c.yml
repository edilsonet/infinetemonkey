id: is-is-61-15-001-5-3-1-c
kind: is
document: is-61-15-001
family: '61'
section_id: 5.3.1
section_title: 'O postulante a uma Autorização de PEV1 deve cumprir as seguintes exigências
  em:'
subsection_id: c
cite: 5.3.1(c)
title: 5.3.1(c)
text: 'c) Experiência:

  I - ser titular de uma licença de piloto de linha aérea na categoria da aeronave

  em que pretenda atuar como piloto de ensaios;

  II - para atuar como piloto de ensaios em voo na categoria avião, ser titular de,

  pelo menos, uma habilitação correspondente a um avião a reação e um avião

  na categoria transporte;

  III - para atuar como piloto de ensaios em voo na categoria helicóptero, ser titular

  de, pelo menos, uma habilitação correspondente a um helicóptero multimotor

  com peso máximo de decolagem acima de 4.000 kgf;

  IV - para atuar como piloto de ensaios em voo na categoria dirigível, ser titular de,

  pelo menos, uma licença piloto de linha aérea na categoria dirigível e uma

  habilitação correspondente.'
