section_title: 'O postulante a uma Autorização de PEV2 deve cumprir as seguintes exigências
  em:'
subsection_id: a
cite: 5.3.2(a)
title: 5.3.2(a)
text: 'a) Conhecimentos - Possuir conhecimento nos seguintes aspectos:

  I - métodos e práticas de ensaios em voo;

  II - planejamento, gestão e relato dos ensaios em voo;

  III - planejamento, execução e coordenação de atividades de voo de recebimento

  de aeronaves saídas de linha de produção, revisão geral, grandes reparos ou

  qualquer outro serviço que requeira a realização de verificações funcionais

  em voo.'
