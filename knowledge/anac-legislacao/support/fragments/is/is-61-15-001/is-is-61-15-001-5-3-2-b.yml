title: 5.3.2(b)
text: 'b) O grupo de Engenharia de Voo e Integração - EVI da Gerência de Engenharia -

  GCEN da SAR verificará a qualificação dos pilotos indicados. Esta análise deverá

  ser realizada com a participação de, ao menos, um piloto do grupo de Engenharia

  de Voo e Integração - EVI, que emitirá seu parecer. Qualquer divergência entre as

  análises será solucionada pela GCEN.'
