title: 5.3.2(c)
text: 'c) Experiência:

  I - ser titular de uma licença de piloto comercial na categoria da aeronave em

  que pretenda atuar como piloto de ensaios;Data de emissão: 01/07/2019 IS nº 61.15-001

  Revisão D

  II - para atuar como piloto em comando em voos de ensaio em voo, ser titular de

  uma habilitação de tipo ou classe válida para as aeronaves em que pretenda

  atuar como piloto de ensaios ou, alternativamente, comprovar por meio de

  declaração de um responsável por ensaios em voo, ter recebido instrução para

  cada modelo de aeronave em que pretenda atuar como piloto de ensaios

  contendo no mínimo os elementos descritos a seguir:'
