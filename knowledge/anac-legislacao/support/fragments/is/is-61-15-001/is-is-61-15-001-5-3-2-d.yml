section_id: 5.3.2
section_title: 'O postulante a uma Autorização de PEV2 deve cumprir as seguintes exigências
  em:'
subsection_id: d
cite: 5.3.2(d)
title: 5.3.2(d)
text: 'd) Como alternativa ao cumprimento da instrução estabelecida na alínea (b) deste

  parágrafo, mediante prévia autorização da ANAC, o candidato poderá comprovar

  ter realizado, nos últimos 12 meses, no mínimo, 30 horas de voo ou 24 voos de

  produção, acompanhado por piloto qualificado para ensaios em voo. Em adição à

  experiência em voo, o solicitante deverá demonstrar ter participado em treinamento

  teórico nas seguintes matérias:

  I - filosofia de ensaios em voo;

  II - aerodinâmica e desempenho;

  III - peso e centragem;

  IV - estabilidade;

  V - para a categoria avião: estol;

  VI - para a categoria helicóptero: características do rotor e vibração;

  VII - para a categoria dirigível: aeroestática.'
