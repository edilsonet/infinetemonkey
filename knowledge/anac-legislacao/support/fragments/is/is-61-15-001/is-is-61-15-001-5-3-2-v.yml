section_id: 5.3.2
section_title: 'O postulante a uma Autorização de PEV2 deve cumprir as seguintes exigências
  em:'
subsection_id: v
cite: 5.3.2(v)
title: 5.3.2(v)
text: '(v) familiarização com o cockpit; e

  III - antes de exercer as prerrogativas de PEV2 como piloto em comando para

  aeronaves que requerem ou venham a requerer habilitação de tipo, o piloto

  deverá ter realizado no mínimo 10 horas de voo ou 7 voos de produção

  acompanhado por piloto qualificado e habilitado para ensaio em voo dos

  quais 2/3 das horas o piloto tenha operado efetivamente os comandos da

  aeronave.'
