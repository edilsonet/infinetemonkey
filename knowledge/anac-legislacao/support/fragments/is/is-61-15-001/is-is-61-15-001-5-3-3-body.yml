text: '5.3.3 No âmbito desta IS, os pilotos que possuíam uma habilitação de piloto de ensaios
  em voo

  expedida sob as regras do RBHA 61 não necessitam de uma nova qualificação inicial. No

  entanto, para que possam exercer as atividades de piloto de ensaio em voo, de acordo com

  seu nível de qualificação, devem observar o disposto nesta IS.Data de emissão: 01/07/2019
  IS nº 61.15-001

  Revisão D

  5.4 Reconhecimento de curso de ensaios em voo pela ANAC'
