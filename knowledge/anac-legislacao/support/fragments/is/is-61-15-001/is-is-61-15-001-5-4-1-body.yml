text: '5.4.1 Para a comprovação do cumprimento da instrução teórica e prática mínima requerida,
  a

  ANAC poderá, por meio da SAR/GGCP, reconhecer como válidos cursos ministrados

  por organizações civis ou militares, nacionais ou estrangeiras, que atendam ao conteúdo

  programático mínimo relacionado no APÊNDICE B, conforme caso, desta IS e cuja

  carga horária seja considerada adequada para capacitar o tripulante ao exercício das

  prerrogativas de piloto de ensaios em voo.'
