title: O reconhecimento de curso poderá ser solicitado por qualquer interessado, mediante
text: '5.4.2 O reconhecimento de curso poderá ser solicitado por qualquer interessado, mediante

  apresentação de requerimento por escrito à SAR/GGCP, no qual comprove a carga

  horária teórica e prática, o conteúdo programático abordado e as demais características

  pertinentes do curso.

  5.5 Concessão, validade e revalidação da Autorização para PEV1 ou PEV2'
