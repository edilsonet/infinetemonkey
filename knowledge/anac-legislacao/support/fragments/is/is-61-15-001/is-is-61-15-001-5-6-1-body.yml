text: '5.6.1 Salvo em caso de autorização específica emitida pela ANAC, os pilotos de autoridades

  estrangeiras devem convalidar suas licenças no Brasil para atuação em voos de aeronaves

  de matrícula brasileira para fins de validação de um projeto de tipo quando a ANAC forData
  de emissão: 01/07/2019 IS nº 61.15-001

  Revisão D

  a autoridade primária de certificação.'
