text: '5.6.4 Todo voo realizado com um piloto de autoridade de aviação civil estrangeira deverá
  ter

  na sua tripulação um PEV1 ou PEV2, conforme aplicável, como piloto em comando. No

  caso de aeronave que comporte apenas um piloto, o piloto da autoridade de aviação civil

  estrangeira deverá, obrigatoriamente, ter realizado o treinamento teórico e prático mínimo

  acordado pela empresa responsável pelo projeto de tipo e a ANAC.

  5.7 Concessão de uma Habilitação de Tipo a PEV1 ou PEV2 que tenham participado de

  processo de certificação de aeronave'
