title: Ao término de um programa de certificação de tipo bem sucedido, os PEV2 que tiverem
text: '5.7.2 Ao término de um programa de certificação de tipo bem sucedido, os PEV2 que tiverem

  realizado, como segundo em comando, no mínimo 30 horas de voo ou 24 voos de ensaio

  no processo de desenvolvimento e de avaliação da aeronave farão jus à habilitação de tipo

  correspondente a essa aeronave.'
