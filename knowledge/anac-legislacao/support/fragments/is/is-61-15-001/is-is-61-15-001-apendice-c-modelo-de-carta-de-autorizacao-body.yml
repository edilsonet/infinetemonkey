text: 'APÊNDICE C - MODELO DE CARTA DE AUTORIZAÇÃO

  [Nome e endereço da empresa/organização interessada]

  Autorização para Piloto de Ensaios em Voo

  Conforme previsto na seção 61.15 do RBAC nº 61, e para a finalidade da seção 21.37 do RBAC
  nº

  21, de acordo com a IS 61.15-001, declaramos estar autorizado a atuar como Piloto de Ensaios
  em

  Voo, nos ensaios realizados pela [Nome da Empresa], o Sr.(a) [Nome do Piloto], CANAC [n°
  da

  CHT], conforme segue:

  Piloto de Ensaios em Voo Nível [n° do nível] - PEV[n° do nível], na categoria [aviões ou

  helicópteros]

  Atividades: [descrição da atividade, projeto, campanha de certificação, etc.]

  Validade: [data de validade]

  Limitações: [descrição das prerrogativas conferidas e outras limitações aplicáveis]

  O titular desta autorização deve portá-la e apresentá-la à fiscalização, quando solicitado,
  juntamente

  com sua respectiva licença e seu certificado médico válido.Data de emissão: 01/07/2019 IS
  nº 61.15-001

  Revisão D'
