text: 'APÊNDICE b - controle de alterações


  REVISÃO E


  ITEM ALTERADO

  ALTERAÇÃO REALIZADA

  5.1

  Antigas seções 5.1 e 5.2 removidas.

  Incluída seção detalhando os passos para solicitação de licença/habilitação.

  Assunto da antiga seção 5.3 passou a fazer parte da seção 5.1.4.

  5.2

  Nova seção para detalhar a dispensa de curso de formação para formados em engenharia.

  5.3

  Nova subseção baseada na seção 5.6 da IS nº 65-001E.

  5.4

  Simplificação de tal seção e padronização do procedimento para solicitação do exame.

  N/A

  Antiga seção 5.5 acerca de experiência em Unidade Aéreas Públicas (UAP) removida.


  REVISÃO E


  ITEM ALTERADO

  ALTERAÇÃO REALIZADA'
