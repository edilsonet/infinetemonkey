title: OBJETIVO
text: 'OBJETIVO

  Descrever os procedimentos e critérios para concessão de licença e de habilitação e para
  recadastramento de mecânicos de manutenção aeronáutica (MMA), esclarecendo, detalhando e
  orientando o cumprimento dos requisitos do RBAC nº 65 referentes a MMA, em particular a
  Subparte D.'
