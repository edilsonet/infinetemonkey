title: PROCEDIMENTOS
text: '5. PROCEDIMENTOS

  5.1 O CBPM deve possuir um coordenador técnico, o qual será responsável por estabelecer

  os contatos com a ANAC para fins de reconhecimento de um CBPM oferecido.

  5.2 O coordenador técnico deve comprovar competência técnica para o oferecimento do

  curso, a ser verificada através de currículo.

  5.3 O coordenador técnico deve desenvolver e encaminhar à ANAC um plano de curso

  contendo o detalhamento das disciplinas previstas, suas respectivas cargas horárias e

  instrutores e o método de avaliação do curso.

  5.4 O coordenador técnico deve encaminhar o(s) currículo(s) do(s) instrutor(es) para

  comprovação de competência técnica.

  5.5 O local para realização do curso deve oferecer instalações seguras, confortáveis e

  compatíveis com a proposta pedagógica.

  5.6 O curso deve ter carga horária suficiente para expor os conteúdos.

  5.7 Os tempos de aula das disciplinas e de outras atividades pedagógicas devem ser

  apresentados em grade curricular, tal como sugerido no Apêndice 1.

  5.8 Deve ser elaborada uma grade curricular e planos de aula para cada disciplina elencada

  na grade curricular, tal como sugerido no Apêndice 2.

  5.9 Deve ser elaborada uma forma de avaliação de aproveitamento do curso, cuja nota

  mínima para aprovação deve ser definida pelo coordenador técnico do curso e

  informada à ANAC.

  5.10 Para cursos realizados na modalidade Educação a Distância (EaD), devem ser previstas

  avaliações parciais ao final de cada módulo definido pelo coordenador. O resultado

  dessas avaliações parciais deve ser computado em conjunto com a avaliação final para

  fins de verificação do aproveitamento de cada aluno no curso.

  5.11 Para cada hora de disciplina prevista em EaD, faz-se necessária avaliação parcial do

  conteúdo ministrado através de um mínimo de três questões de múltipla escolha

  contendo quatro opções de resposta cada.

  5.12 O coordenador técnico deve conferir os certificados por ele assinados, em curso

  ministrado sob sua responsabilidade.17/02/2012 IS nº 67-001

  Revisão A

