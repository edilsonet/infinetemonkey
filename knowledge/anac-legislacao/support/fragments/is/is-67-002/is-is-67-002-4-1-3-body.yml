text: '4.1.3 parada brusca significa a situação em que o tripulante é súbita ou inesperadamente

  interrompido em sua movimentação a bordo de uma aeronave, normalmente decorrente

  de acidente ou incidente aeronáutico grave.

  4.2 Lista de abreviaturas (em ordem alfabética):'
