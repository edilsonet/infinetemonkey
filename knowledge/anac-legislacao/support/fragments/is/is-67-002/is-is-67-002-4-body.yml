text: '4. Já sofreu acidente ou incidente aeronáutico grave? Sim Não Quando:

  IV. Uso de remédios

  Faz uso de remédios atualmente (prescritos ou não)? Sim Não

  Listar nome, dosagem e frequência:

  V. Uso de tabaco

  Faz uso de tabaco?

  Nunca

  Anteriormente Data em que cessou o uso:

  Atualmente Há quanto tempo, quantidade e frequência (número cigarros/dia):

  VI. Uso de álcool *dose ~ 14g de álcool (40ml de bebida destilada ~ 140ml vinho de mesa
  ~ 340ml (uma lata) de cerveja)

  Faz uso de álcool?

  Nunca

  Anteriormente Data em que cessou o uso:

  Atualmente Há quanto tempo, quantidade e frequência (número de doses/semana):

  Caso falte espaço para inserir os dados, preencher folha complementar atualizado em 22/5/2015Data
  de emissão: 8 de outubro de 2021

  IS nº 67-002

  Revisão C

  TERMO DE RESPONSABILIDADE E

  FORMULÁRIO DE ANTECEDENTES MÉDICOS (PARTE 2/2)

  Instruções: este formulário deve ser preenchido pelos candidatos a um Certificado Médico
  Aeronáutico

  (CMA) a caneta e assinado antes da realização do exame médico. Nenhum campo deve ser deixado

  em branco e, caso seja aplicável, a justificativa pelo não preenchimento deverá ser fornecida
  pelo

  candidato ao examinador.

  VII. Histórico médico e geral

  Responda sim ou não se você tem ou já teve algum dos problemas abaixo ou se enquadra na
  condição. As perguntas

  respondidas afirmativamente podem ser comentadas no campo observações, se já foram relatadas
  em exames anteriores e

  estiverem estáveis desde então.

  Sim Não Sim Não

  1.Doença ou cirurgia nos olhos 20.Problemas psicológicos ou psiquiátricos de

  qualquer natureza2.Uso de óculos e lentes de contato

  3.Mudou a prescrição dos óculos ou lentes

  desde o último exame

  21.Uso abusivo ou dependência de álcool ou

  drogas

  22.Intenção ou tentativa de suicídio

  4.Rinite alérgica e outras alergias 23.Enjôo por movimento requerendo medicação

  5.Asma ou doença pulmonar 24.Internação em hospital

  6.Doença cardíaca ou vascular 25.Consultas médicas desde o último exame

  7.Pressão arterial alta Histórico Familiar

  8.Pressão arterial baixa 26.Doença cardíaca

  9.Pedra nos rins ou sangue ou proteína na urina 27.Pressão alta

  10.Diabetes ou doença hormonal 28.Colesterol alto

  11.Doença no estômago, fígado ou intestino 29.Epilepsia

  12.Surdez ou doença no ouvido 30.Doença mental

  13.Doença no nariz, ouvido 31.Diabetes

  14.Problema de fala 32.Tuberculose

  15.Lesão na cabeça 33.Alergia; asma; eczema

  16.Dores de cabeça frequentes ou fortes Apenas para sexo feminino

  17.Tonturas ou desmaios 34.Transtornos ginecológicos

  18.Perda de consciência por qualquer razão 35.Gravidez atual

  19.Problemas neurológicos, derrame, epilepsia,

  convulsão, paralisia, etc.

  36.Observações:

  37.Já sofreu cirurgia(s)? Sim Não Especificar:

  VIII. Declaração do Candidato

  Declaro ter avaliado cuidadosamente as afirmativas acima e tê-las respondido verdadeiramente.
  Declaro, ainda, não ter

  ocultado informações relevantes ou produzido afirmativas falsas. Declaro estar ciente de
  que pode haver penalidades

  administrativas e legais advindas de declarações falsas. Autorizo o envio de informações
  médicas para a área técnica da

  ANAC e seus peritos designados.

  Local Data Assinatura

  IX. Declaração do Médico

  Eu declaro ter pessoalmente analisado o histórico médico deste candidato e o examinado.

