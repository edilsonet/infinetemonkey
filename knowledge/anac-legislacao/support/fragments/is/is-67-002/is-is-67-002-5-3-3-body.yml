title: Os exames de saúde periciais para emissão de CMA de 4ª classe podem ser emitidos por
text: '5.3.3 Os exames de saúde periciais para emissão de CMA de 4ª classe podem ser emitidos
  por

  CLC, MC, MCad e Entidade Conveniada;

  5.4 Os endereços e telefones dos examinadores estão listados no endereço eletrônico:

  https://www.gov.br/anac/pt-br/assuntos/regulados/profissionais-da-aviacao-

  civil/processo-de-licencas-e-habilitacoes/cma.

  5.5 A ANAC não regula os preços que os examinadores cobram para a realização dos exames

  de saúde periciais e emissão do CMA, e pode haver diferenças entre eles. O candidato,

  no entanto, é livre para escolher o examinador que lhe oferecer as melhores condições,

  observando-se os critérios do item 5.3 desta IS.

  5.6 Pode ser necessário agendar o exame com antecedência. É recomendável que o candidato

  entre em contato com o examinador a fim de saber se precisa agendar a data do exame.

  5.7 De acordo com o RBAC 67, o candidato à obtenção de um CMA deve apresentar, no

  momento do exame, documento de identificação oficial, com foto, válido no território

  nacional.

  5.8 A fim de cumprir o estabelecido nos parágrafos 67.71(d), 67.111(d) e 67.191(d) do RBAC

  67, o candidato deve preencher por completo e assinar o Termo de Responsabilidade e

  Formulário de Antecedentes Médicos, cujo modelo se encontra no Apêndice A desta IS,

  que será fornecido pelo examinador antes da realização do exame de saúde pericial. O

  candidato deve observar o seguinte:'
