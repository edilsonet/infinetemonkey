title: o candidato deve autorizar o envio das informações médicas para a área técnica da ANAC,
text: '5.8.4 o candidato deve autorizar o envio das informações médicas para a área técnica
  da ANAC,

  resguardado o sigilo médico-profissional. Se o respectivo campo do Termo de

  Responsabilidade não for assinado pelo candidato, a ANAC não emitirá o CMA.

  5.9 Após a realização do exame de saúde pericial, e em caso de julgamento “apto” por parteData
  de emissão: 8 de outubro de 2021

  IS nº 67-002

  Revisão C

  do examinador, o candidato deve conferir no endereço eletrônico

  https://sistemas.anac.gov.br/consultadelicencas/ se seu CMA está atualizado com as

  informações corretas dois dias úteis após o término do exame de saúde. Caso haja alguma

  discordância, o candidato deve entrar em contato com o examinador para solucionar a

  discrepância.

  5.10 É de total responsabilidade do candidato portador de um CMA ainda válido, que deseje

  revalidar, de agendar o seu novo exame de saúde pericial em tempo hábil antes que o seu

  CMA anterior perca a validade, tendo-se em vista o disposto no RBAC 67 e o disposto

  nos itens 5.6 e 5.9 desta IS, e de outros eventuais imprevistos que possam ocorrer.'
