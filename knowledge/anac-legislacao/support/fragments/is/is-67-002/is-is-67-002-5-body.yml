title: PROCEDIMENTOS PARA A OBTENÇÃO DE UM CMA
text: '5. PROCEDIMENTOS PARA A OBTENÇÃO DE UM CMA

  5.1 O candidato que desejar ser examinado para obter um CMA deve possuir um Código

  ANAC, que deve ser solicitado por meio do endereço eletrônico:

  https://sistemas.anac.gov.br/habilitacao/AgendamentoServicoPublico.do, clicando no

  link “Solicitar Código ANAC”.

  5.2 Em posse de seu Código ANAC, o candidato deve verificar qual a classe de CMA

  apropriada para o tipo de licença que possui (ou pretende possuir), se 1ª, 2ª, 4ª ou 5ª
  classe.Data de emissão: 8 de outubro de 2021

  IS nº 67-002

  Revisão C

  5.3 O candidato deve observar os seguintes critérios, em consonância com o RBAC 67:'
