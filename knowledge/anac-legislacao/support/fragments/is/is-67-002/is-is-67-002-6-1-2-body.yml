text: '6.1.2 não concorde com a decisão do examinador pode, a seu critério e às suas expensas,

  requerer à CCMA um novo julgamento em grau de recurso em primeira instância,

  conforme modelo no Apêndice B desta IS. Este pedido deve ser feito mesmo no caso em

  que ele tenha realizado exame de saúde pericial em uma Entidade Conveniada.'
