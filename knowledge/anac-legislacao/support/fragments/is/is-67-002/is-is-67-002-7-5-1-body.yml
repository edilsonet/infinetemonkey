cite: 7.5.1
title: é obrigatória a obtenção de ao menos um laudo ou parecer por profissional médico
text: '7.5.1 é obrigatória a obtenção de ao menos um laudo ou parecer por profissional médico

  especialista em cada área da medicina diretamente relacionada à(s) patologia(s) que

  foi(ram) causa(s) geradora(s) do julgamento “não apto”, e/ou por odontólogo ou por

  psicólogo, se a causa geradora for relacionada a estas atividades profissionais, cuja

  conclusão seja favorável ao candidato, antes do encaminhamento à CCMA para a

  avaliação;'
