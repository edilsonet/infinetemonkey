title: no caso de inaptidão aos requisitos mentais e comportamentais, faz-se necessário
text: '7.5.3 no caso de inaptidão aos requisitos mentais e comportamentais, faz-se necessário

  apresentar laudos psiquiátrico e psicológico. No caso do laudo psicológico, apenas será

  aceito documento que contenha pareceres específicos sobre personalidade, atenção,

  memória e raciocínio, contendo os nomes dos testes aplicados, autores, editora e ano de

  publicação, redigido aos moldes do que preconiza a Resolução CFP 007/2003.

  7.6 Se a CCMA mantiver o julgamento que não atenda ao interesse do candidato, ele poderá

  recorrer da decisão em uma segunda instância, agora junto a GCEP.

  7.7 Se ainda a GCEP mantiver o julgamento que não atenda ao interesse do candidato, um

  último recurso poderá ser interposto, desta vez junto à SPL, o qual será avaliado em

  caráter definitivo no âmbito da esfera administrativa.

  7.8 Após análise conclusiva do processo e de posse dos pareceres a favor ou contra o recurso

  do candidato, a CCMA atualizará o sistema SACI (se necessário) e informará o

  julgamento do recurso ao interessado.'
