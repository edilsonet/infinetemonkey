text: '7. RECURSO

  7.1 O candidato pode recorrer da decisão junto à ANAC, que julgará a questão, auxiliada
  ou

  não por outros examinadores que não tenham participado do primeiro julgamento, e

  emitirá julgamento em favor ou contra o recurso do candidato anteriormente considerado

  “não apto” ou “apto com restrição”.

  7.2 A ANAC pode, a seu critério, exigir teste médico de voo para julgar recurso do candidato.

  Se o teste médico for condição necessária para a revalidação do CMA o candidato poderá,

  em grau de recurso, protocolar requerimento com antecedência de até 45 (quarenta e

  cinco) dias da data de validade do CMA.

  7.3 Os recursos, em qualquer instância, devem ser interpostos na ANAC, junto à

  Coordenação de Certificação Médica Aeronáutica (CCMA), da Superintendência de

  Pessoal da Aviação Civil (SPL), , através do Protocolo Eletrônico da ANAC, utilizando

  o MODELO DE REQUERIMENTO DE RECURSO CONTRA JULGAMENTO

  EXARADO POR EXAMINADOR apresentado no APÊNDICE B desta IS. A cada

  recurso em 2ª ou 3ª instâncias, o interessado deve se utilizar do mesmo modelo indicado

  acima, desde que acrescido de novas justificativas que embasem a reapresentação do

  recurso.Data de emissão: 8 de outubro de 2021

  IS nº 67-002

  Revisão C

  7.4 Para dar início ao processo, o candidato deve solicitar cópia da FESP assinada pelo

  examinador que realizou seu último exame de saúde pericial. A FESP e os demais

  documentos utilizados para fundamentar a solicitação de recurso devem ser enviados

  como anexos do requerimento.

  7.5 O interessado deve ainda observar o seguinte:'
