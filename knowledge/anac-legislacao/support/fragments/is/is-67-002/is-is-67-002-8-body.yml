title: EXAMES APÓS ACIDENTE OU INCIDENTE AERONÁUTICO GRAVE
text: '8. EXAMES APÓS ACIDENTE OU INCIDENTE AERONÁUTICO GRAVE

  8.1 Caso um indivíduo detentor de um CMA tome parte em acidente ou incidente aeronáutico

  grave, conforme classificação do CENIPA, seu CMA será suspenso, em conformidade ao

  RBAC 67. A suspensão se dará assim que a ANAC for informada do acidente ou incidente

  aeronáutico grave de forma oficial.

  8.2 Após contato do usuário com a ANAC, a GTFH providenciará seu encaminhamento ao

  local de sua preferência para realizar exame de saúde pericial, respeitando as atribuições

  do examinador de acordo com o item 5.3 desta IS.Data de emissão: 8 de outubro de 2021

  IS nº 67-002

  Revisão C

  8.3 O indivíduo deve apresentar a cópia do ofício ou notificação da ANAC ao examinador

  com a informação de que seu CMA foi suspenso por motivo de <acidente> ou <incidente

  aeronáutico grave> e que deseja revalidá-lo.

  8.4 No Termo de Responsabilidade e Formulário de Antecedentes Médicos, cujo modelo

  encontra-se no Apêndice A desta IS, o candidato deve informar ainda, no campo

  específico, se houve colisão ou parada brusca da aeronave.'
