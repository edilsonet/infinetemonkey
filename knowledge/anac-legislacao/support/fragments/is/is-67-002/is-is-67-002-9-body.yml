title: PROCEDIMENTOS PARA O REQUERIMENTO DE CONVALIDAÇÃO DE
text: '9. PROCEDIMENTOS PARA O REQUERIMENTO DE CONVALIDAÇÃO DE

  CERTIFICADO MÉDICO AERONÁUTICO ESTRANGEIRO

  9.1 O tripulante brasileiro que seja detentor de um certificado médico emitido por Autoridade

  de Aviação Civil estrangeira e deseje exercer as prerrogativas de suas licenças e

  habilitações no Brasil pode requerer a convalidação de seu certificado médico.

  9.2 O usuário deverá encaminhar um pedido formal à CCMA. Ele deverá juntar uma cópia

  de seu certificado médico aeronáutico estrangeiro e fornecer informações relativas à

  validade, eventuais restrições e prerrogativas do CMA apresentado. Esse

  encaminhamento deverá ocorrer através de Protocolo Eletrônico utilizando-se do sistema

  SEI.

  9.3 A equipe médica da CCMA procederá à análise do pedido tão logo a Autoridade de

  Aviação Civil que exarou o certificado médico responder à consulta sobre a integridade

  deste documento.

  9.4 Assim que a CCMA analisar o pedido e entender que os requisitos psicofísicos da AAC

  estrangeira são equivalentes aos requisitos contidos no RBAC 67, o pedido será deferido,

  uma comunicação formal será feita ao usuário e seu registro do SACI receberá, no campo

  Observações, a informação de que o CMA foi convalidado.

  9.5 Caso a análise da CCMA relativamente a um pedido de convalidação conclua que os

  requisitos psicofísicos estrangeiros do CMA em análise são inferiores aos do RBAC 67,

  poderá ser recomendado um exame de saúde pericial em grau de complemento junto a

  um examinador brasileiro. Sendo esse o caso, após a apresentação dos exames

  complementares com julgamento “apto” por parte do examinador, o certificado médico

  estrangeiro será considerado convalidado, o que se refletirá no campo “observações” do

  registro no SACI.'
