text: 'APÊNDICE B - MODELO DE REQUERIMENTO DE RECURSO CONTRA

  JULGAMENTO EXARADO POR EXAMINADOR

  Caso falte espaço para inserir os dados, preencher folha complementar. atualizado em 22/5/2015

  REQUERIMENTO

  RECURSO CONTRA JULGAMENTO EXARADO POR EXAMINADOR

  Instruções: este formulário deve ser preenchido pelo candidato que não tenha ficado satisfeito
  com o

  julgamento exarado em resposta a sua solicitação de revalidação ou obtenção de um Certificado
  Médico

  Aeronáutico - CMA.

  I. Identificação

  1.Nome:

  2.Código ANAC: 3.CPF: 4.Sexo: M F 5.Data de Nascimento: / /

  6.Endereço:

  7.Telefone: 8.E-mail:

  II. Requerimento

  1.Eu, _______________________________________ , venho requerer à ANAC, nos termos do RBAC
  67._____:

  teste de proficiência de voo, OU

  ampliação de prazo de CMA, OU

  revisão do julgamento “não apto” ou “apto com restrição”.

  (obs.: caso o usuário tenha interesse em solicitar mais de um requerimento, deverá preencher
  um formulário para cada um deles).

  III. Justificativa [Neste campo, o candidato deve reunir e anexar o maior número de elementos
  que demonstrem sua

  aptidão psicofísica ou que a sua debilidade não oferece riscos para a segurança de voo,
  tais como parecer(es) médico(s),

  psicológico(s) ou odontológico(s), tipo de prótese descrita detalhadamente (se aplicável),
  fotografia(s), modelo da

  aeronave que pretende operar, etc.]. O preenchimento deste campo é obrigatório, e deve informar
  os documentos anexados.

  1. Local do último exame de saúde pericial: ______________________________________ Data:
  / /

  2.Julgamento: Apto com Restrição Não apto

  Liste as restrições e limitações (se houver):

  IV. Assinatura do Usuário

  Local Data Assinatura'
