title: OBJETIVO
text: '1. OBJETIVO

  1.1 Oferecer aos examinadores (conforme definição do parágrafo 67.3(a)(18) do RBAC 67)

  procedimentos para o preenchimento online dos dados do Certificado Médico

  Aeronáutico (CMA) no Sistema de Aviação Civil (SACI), após o exame de saúde

  pericial realizado de acordo com os requisitos do RBAC 67.'
