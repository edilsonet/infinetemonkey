title: A ANAC não utiliza mais os CMA (antigos CCF) de papel. Os dados devem ser
text: '5.1.1 A ANAC não utiliza mais os CMA (antigos CCF) de papel. Os dados devem ser

  preenchidos online no SACI pelos examinadores após a realização dos exames de saúde

  periciais. Esta IS estabelece os passos que devem ser seguidos para o correto

  preenchimento dos dados no SACI.'
