text: '5.1.2 Caso o SACI seja futuramente atualizado, o examinador deve se orientar com a

  Gerência Técnica de Fatores Humanos da Gerência de Certificação de Pessoal da

  Superintendência de Padrões Operacionais da ANAC (GTFH/GCEP/SPO/ANAC) sobre

  como preencher os dados no novo sistema atualizado, até que esta IS seja revisada.

  5.2 Procedimentos'
