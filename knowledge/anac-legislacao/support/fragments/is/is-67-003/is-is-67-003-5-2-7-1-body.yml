text: '5.2.7.1 no campo “Classe Atual” deve ser preenchido a classe de CMA para a qual o candidato

  realizou o seu exame: “1” para um CMA de 1ª Classe; “2” para um CMA de 2ª Classe; e

  “4” para um CMA de 4ª Classe.'
