title: no campo “Validade atual” deve ser preenchida a data até quando o CMA concedido
text: '5.2.7.3 no campo “Validade atual” deve ser preenchida a data até quando o CMA concedido

  será válido, de acordo com os prazos concedidos para cada licença ou habilitação, ou

  restrições médicas, todas previstas nos RBAC 61 e 67, e considerando os critérios

  estabelecidos pelo parágrafo 67.15(e) do RBAC 67.'
