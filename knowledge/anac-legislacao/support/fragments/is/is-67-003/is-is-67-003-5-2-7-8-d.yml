text: 'd) Inserir a expressão “exame de saúde aberto em [dia/mês/ano]” no campo

  “Observação” quando o candidato se apresentar ao exame de saúde pericial, mas

  não finalizá-lo. A data deve ser a que o candidato se apresentou ao examinador.'
