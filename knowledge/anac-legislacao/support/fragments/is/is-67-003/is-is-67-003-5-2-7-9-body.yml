text: '5.2.7.9 após todos os dados terem sido preenchidos, o examinador deve clicar no botão

  “SALVAR”, para que as novas informações sejam registradas no sistema. O botão

  “VOLTAR” retorna à tela anterior sem inserir nenhum registro no sistema.'
