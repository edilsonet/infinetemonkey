title: Após a digitação do código ANAC, o examinador deve pressionar o botão
text: '5.2.7 Após a digitação do código ANAC, o examinador deve pressionar o botão

  “PESQUISAR” e, se o código tiver sido digitado corretamente, a seguinte tela aparecerá

  ao examinador, na qual devem ser preenchidos os dados conforme seguem:22/04/2016 IS nº 67-003

  Revisão C'
