title: O candidato com transtornos do metabolismo, da nutrição ou endócrinos deve ser julgado
text: '5.10.1 O candidato com transtornos do metabolismo, da nutrição ou endócrinos deve ser
  julgado

  não apto. O candidato pode ser julgado apto se a condição for assintomática, compensada

  e estável (com ou sem terapia de reposição) e com programa de controle regular com

  especialista.'
