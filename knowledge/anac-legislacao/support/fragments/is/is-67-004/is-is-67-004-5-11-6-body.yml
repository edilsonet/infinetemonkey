title: O candidato com policitemia patológica, como a vera ou secundária, deve ter avaliação
text: '5.11.6 O candidato com policitemia patológica, como a vera ou secundária, deve ter
  avaliação

  completa. Candidato piloto pode ser julgado apto com restrição proibição de voo solo se

  a condição for estável, com risco mínimo de hipercoagulação, e sem outra patologia

  associada.'
