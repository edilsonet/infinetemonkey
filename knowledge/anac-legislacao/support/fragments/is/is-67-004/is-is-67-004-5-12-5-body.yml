text: '5.12.5 O candidato com condição maligna do sistema nefrológico ou urológico deve ser
  avaliado

  considerando-se o comprometimento anatômico e funcional, o prognóstico, e o tipo

  histopatológico de cada afecção.

  5.13 Doenças infecciosasData de emissão: 2 de junho de 2020 IS nº 67-004

  Revisão B'
