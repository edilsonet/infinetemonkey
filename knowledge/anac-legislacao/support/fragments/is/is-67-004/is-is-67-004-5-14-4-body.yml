title: A candidata submetida à cirurgia ginecológica de grande porte somente pode ser julgada
text: '5.14.4 A candidata submetida à cirurgia ginecológica de grande porte somente pode ser
  julgada

  apta após o período mínimo de 3 (três) meses. A ANAC pode considerar um período

  menor, se o médico especialista constatar que a candidata está assintomática, com risco

  mínimo de complicações ou recorrência.Data de emissão: 2 de junho de 2020 IS nº 67-004

  Revisão B'
