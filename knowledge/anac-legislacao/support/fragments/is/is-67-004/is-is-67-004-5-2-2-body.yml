title: Para fins de aplicação do RBAC nº 67, não será aceito relatório de exame oftalmológico
text: '5.2.2 Para fins de aplicação do RBAC nº 67, não será aceito relatório de exame oftalmológico

  expedido por profissionais não médicos, tais como ortoptistas. Entretanto, estes relatórios

  poderão ser considerados como elementos auxiliares pela ANAC.'
