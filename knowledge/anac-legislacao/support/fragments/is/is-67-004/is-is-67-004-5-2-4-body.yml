title: Monocularidade funcional é definida como casos em que somente um olho do candidato
text: '5.2.4 Monocularidade funcional é definida como casos em que somente um olho do candidato

  atende aos requisitos visuais do RBAC nº 67. A monocularidade funcional implica

  sempre julgamento “não apto” para exame inicial para CMA de 1ª classe.'
