title: A avaliação de condições malignas nos olhos e sistema visual deve ser realizada
text: '5.2.8 A avaliação de condições malignas nos olhos e sistema visual deve ser realizada

  individualmente, considerando o comprometimento anatômico e funcional, a avaliação e

  prognóstico, e a correspondência com o tipo histopatológico de cada afecção.'
