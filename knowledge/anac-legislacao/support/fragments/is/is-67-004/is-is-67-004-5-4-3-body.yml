title: Os casos de barotite e barossinusite devem ser declarados não aptos até que o candidato
text: '5.4.3 Os casos de barotite e barossinusite devem ser declarados não aptos até que o
  candidato

  esteja recuperado e assintomático e que as causas que levaram ao quadro clínico tenham

  sido controladas clínica ou cirurgicamente.'
