cite: 5.4.5
title: A avaliação de condições malignas otorrinolaringológicas deve ser multidisciplinar
text: '5.4.5 A avaliação de condições malignas otorrinolaringológicas deve ser multidisciplinar

  quando o candidato tiver comprometimento anatômico e/ou funcional, de acordo com os

  riscos conhecidos e a taxa esperada de evolução para cada condição de câncer.'
