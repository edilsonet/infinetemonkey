text: '5.5.9.5 Após a avaliação mínima dos quatro construtos - atenção, memória, raciocínio
  e

  personalidade -, sempre que necessário para fins de melhor esclarecimento ao processo

  de diagnóstico, o psicólogo deve aprofundar esta avaliação, seja em construto já avaliadoData
  de emissão: 2 de junho de 2020 IS nº 67-004

  Revisão B

  ou em construtos adicionais correlatos visando esclarecimentos quanto a presença,

  gravidade e/ou evolução de determinado(s) diagnóstico(s).'
