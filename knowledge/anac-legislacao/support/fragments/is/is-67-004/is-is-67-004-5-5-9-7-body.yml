title: Qualquer déficit dos processos mentais avaliado pelo psicólogo como significativo deve
text: '5.5.9.7 Qualquer déficit dos processos mentais avaliado pelo psicólogo como significativo
  deve

  ser levado ao conhecimento do diretor técnico médico (DTM) ou do médico credenciado

  (MC) através dos registros a serem produzidos, mesmo que este déficit não seja

  conclusivo para efeito de um diagnóstico específico.'
