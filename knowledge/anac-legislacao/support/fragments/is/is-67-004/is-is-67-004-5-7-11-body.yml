text: '5.7.11 Candidato com episódio único de fibrilação atrial pode ser julgado apto para
  CMA de 1ª

  classe, desde que apresente ecocardiografia normal, sem trombos ou massas

  intracavitárias, e baixo risco cardíaco.'
