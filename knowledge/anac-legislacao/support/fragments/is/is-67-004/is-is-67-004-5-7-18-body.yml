title: O candidato com válvula aórtica bicúspide pode ser julgado apto, desde que não apresente
text: '5.7.18 O candidato com válvula aórtica bicúspide pode ser julgado apto, desde que não
  apresente

  outra anomalia cardíaca ou aórtica. Pode ser exigido acompanhamento periódico com

  ecocardiografia, a critério do examinador ou da ANAC.'
