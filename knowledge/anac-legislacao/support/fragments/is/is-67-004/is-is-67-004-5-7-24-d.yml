section_id: 5.7.24
section_title: O candidato com válvula cardíaca biológica, assintomático, pode ser julgado
  apto,
subsection_id: d
cite: 5.7.24(d)
title: 5.7.24(d)
text: 'd) ecocardiografia com Doppler sem evidências de aumento significativo de cavidades

  cardíacas, nem alterações estruturais significativas da prótese valvular biológica. Demais

  válvulas cardíacas não podem ter alterações estruturais ou funcionais. O fluxo sanguíneo

  e a fração de ejeção do ventrículo esquerdo devem ser normais;'
