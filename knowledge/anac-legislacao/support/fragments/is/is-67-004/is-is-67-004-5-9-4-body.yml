title: O candidato com alterações de provas de função hepática deve ter avaliação completa
text: '5.9.4 O candidato com alterações de provas de função hepática deve ter avaliação completa

  para determinar se a causa é primária ou secundária, transitória ou permanente, e qual o

  seu risco para a segurança de voo.'
