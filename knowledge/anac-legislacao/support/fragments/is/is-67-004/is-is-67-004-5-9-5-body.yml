title: O candidato com um único e grande cálculo biliar, sem sintomas, pode ser julgado apto,
text: '5.9.5 O candidato com um único e grande cálculo biliar, sem sintomas, pode ser julgado
  apto,

  com a recomendação de tratamento. No caso de obstrução de via biliar, por colelitíase

  única ou múltipla, inclusive assintomática, ou por outra causa, o candidato deve ser

  julgado não apto.'
