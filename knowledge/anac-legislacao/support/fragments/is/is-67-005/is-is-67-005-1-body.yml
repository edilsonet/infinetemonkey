title: Nos exames de revalidação, em face do exposto no item 1, convém providenciar
text: '1. Nos exames de revalidação, em face do exposto no item 1, convém providenciar

  tratamento ou correção para os citados, e comparecer para novo exame nos 45 (quarenta

  e cinco) dias anteriores ao término do prazo de validade de seu Certificado Médico

  Aeronáutico (CMA).'
