cite: 5.4.3(c)
title: 5.4.3(c)
text: 'c) cópia do certificado de conclusão de curso básico de perícia médica da aviação civil,

  ou curso básico de fisiologia de voo, ou cursos de especialização em medicina

  aeroespacial equivalentes, de pelo menos do DTM da clínica. Caso o curso tenha sido

  ministrado pela ANAC, o candidato deverá fornecer a data de realização e os dados do

  certificado;'
