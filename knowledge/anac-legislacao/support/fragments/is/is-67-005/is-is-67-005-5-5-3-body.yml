title: Pretende-se verificar no local disponível ao atendimento a existência de fachada, recepção,
text: '5.5.3 Pretende-se verificar no local disponível ao atendimento a existência de fachada,
  recepção,

  sanitários masculino e feminino, sala de atendimento do médico/diretor, arquivo ou local
  de

  guarda dos registros com acesso restrito e vias de acesso. No caso de clínicas, pretende-se

  evidenciar salas individuais para cada especialidade, com seus respectivos equipamentos

  mínimos, equipamentos médicos, telefone e computador.'
