title: O FORMULÁRIO 8 e seus anexos devem ser enviados via protocolo eletrônico ou correios
text: '5.6.3 O FORMULÁRIO 8 e seus anexos devem ser enviados via protocolo eletrônico ou correios

  para o endereço indicado no parágrafo 5.3.1. Caso existam pendências, o interessado será

  notificado.'
