title: Uma vez publicada a portaria de credenciamento no Diário Oficial da União, o médico
text: '5.6.5 Uma vez publicada a portaria de credenciamento no Diário Oficial da União, o
  médico

  credenciado ou DTM da CLC recebe o Certificado de Credenciamento da equipe da GTFH,

  o qual deve ser exibido na recepção do consultório ou clínica para o público.'
