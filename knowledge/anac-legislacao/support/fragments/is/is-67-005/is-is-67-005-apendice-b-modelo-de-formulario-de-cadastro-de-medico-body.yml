text: 'APÊNDICE B - MODELO DE FORMULÁRIO DE CADASTRO DE MÉDICO

  As instruções para preenchimento do formulário se encontram na IS 67-005, disponível em
  http://www.anac.gov.br/assuntos/legislacao/legislacao-

  1/iac-e-is/is

  CADASTRO PARA SOLICITAÇÃO DE CREDENCIAMENTO DE

  MÉDICO

  1 - NOME COMPLETO

  2 - NACIONALIDADE

  3 - CRM 4 - UF

  5 - TELEFONE

  RESIDENCIAL

  6 - TELEFONE

  COMERCIAL

  7 - E-MAIL DE CONTATO

  8 - ENDEREÇO DO

  CONSULTÓRIO

  9 - CIDADE 10 - ESTADO

  OBSERVAÇÕES

  1 - PREENCHER UM REQUERIMENTO PARA CADA CANDIDATO.

  2 - O CONSULTÓRIO SERÁ SUBMETIDO À INSPEÇÃO ANTES DO CREDENCIAMENTO.

  3 - OS EXAMES PERICIAIS SÓ PODERÃO SER REALIZADOS NO ENDEREÇO

  CREDENCIADO.

  REQUISITOS PARA CREDENCIAMENTO'
