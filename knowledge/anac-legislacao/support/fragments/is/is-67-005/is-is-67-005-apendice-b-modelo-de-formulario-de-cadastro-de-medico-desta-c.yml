title: apendice-b-modelo-de-formulario-de-cadastro-de-medico-desta(c)
text: 'c) cópia do certificado de conclusão de curso básico de perícia médica da aviação civil,

  ou curso básico de fisiologia de voo, ou cursos de especialização em medicina

  aeroespacial equivalentes. Caso o curso tenha sido ministrado pela ANAC, o candidato

  deverá fornecer a data de realização e os dados do certificado;'
