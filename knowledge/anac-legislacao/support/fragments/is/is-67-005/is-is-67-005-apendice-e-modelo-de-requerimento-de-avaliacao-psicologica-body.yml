title: APÊNDICE E - MODELO DE REQUERIMENTO DE AVALIAÇÃO PSICOLÓGICA
text: 'APÊNDICE E - MODELO DE REQUERIMENTO DE AVALIAÇÃO PSICOLÓGICA

  REQUERIMENTO DE AVALIAÇÃO PSICOLÓGICA

  Conforme termos do RBAC Nº 67 e da Resolução CFP nº 007/2003

  Senhor(a) psicólogo(a),

  Eu,_______________________________________________________ (nome e nº do MC), médico inscrito
  no CRM nº

  ___________ , autorizado pela ANAC a realizar exames de saúde periciais em tripulantes civis
  venho, amparado no

  Regulamento Brasileiro de Aviação Civil nº 67, requerer avaliação psicológica do(a) senhor(a)

  ___________________________________________________ (nome do candidato), visando investigar
  os requisitos

  mentais e comportamentais estabelecidos nos parágrafos 67.75 (e) ou 67.115 (e) ou 67.195
  (e) ou 67.235 (e) deste

  Regulamento, como parte do processo do exame de saúde pericial para certificação médica
  por meio da emissão do

  Certificado Médico Aeronáutico (CMA). A avaliação psicológica deverá conter, no mínimo,
  parecer sobre

  personalidade, atenção, memória e raciocínio.

  Atenciosamente,

  [assinatura]

  [nome completo do MC]

  [endereço e telefone]

  Obs.:

  1. Solicita-se que o resultado da avaliação psicológica nos seja enviado por meio de ATESTADO
  PSICOLÓGICO,

  conforme preconizado pelo CFP.

  2. O RBAC Nº 67 pode ser consultado no portal da ANAC na rede mundial de computadores no
  link:

  http://www.anac.gov.br/assuntos/legislacao/legislacao-1/rbha-e-rbac/rbac

  3. Em caso de dúvidas, consultar ANAC: gfhm@anac.gov.br ou (21) 3501-5656.Data de emissão:
  9 de março de 2018 IS nº 67-005

  Revisão B'
