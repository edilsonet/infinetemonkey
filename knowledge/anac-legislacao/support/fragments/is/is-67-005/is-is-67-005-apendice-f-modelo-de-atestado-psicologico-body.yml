text: 'APÊNDICE F - MODELO DE ATESTADO PSICOLÓGICO

  ATESTADO PSICOLÓGICO

  face à Avaliação Psicológica realizada

  INTERESSADO(A)

  Nome completo:

  CPF:

  Código ANAC (CANAC):

  Local (cidade) da avaliação psicológica conduzida:

  Data(s) da avaliação psicológica conduzida: / /

  PSICÓLOGO(A)

  Nome completo:

  Nº de inscrição no CRP e região do CRP:

  Endereço:

  Telefone:

  E-mail:

  FINALIDADE DA AVALIAÇÃO

  Emissão de pareceres específicos para atuação na função de <piloto de linha aérea, piloto
  comercial,

  piloto privado, comissário, operador de equipamentos especiais, mecânico de voo, piloto
  de aeronave

  leve ou piloto remoto> , para a qual se requer um Certificado Médico Aeronáutico (CMA) de
  <1ª, 2ª,

  4ª, 5ª> classe válido, documento que atesta a aptidão psicofísica para compor a tripulação
  de

  aeronaves brasileiras, em conformidade com os requisitos aplicáveis do Regulamento Brasileiro
  de

  Aviação Civil nº 67 (RBAC Nº 67), em relação ao qual declaro conhecer seus requisitos mentais
  e

  comportamentais presentes nas seções 67.75, 67.115, 67.195 ou 67.235, de forma a ter realizado
  a

  presente avaliação psicológica considerando tais requisitos. Neste sentido, conduzi os seguintes

  procedimentos e fiz uso dos seguintes instrumentos para alcançar os resultados informados
  a seguir.

  1) PERSONALIDADE:

  a. Teste(s) psicológico(s) utilizado(s):

  i. <Nome do Teste/Manual>, <Autor>, <Editora>, <Ano de publicação>, ou <preencher

  com um traço horizontal>

  b. Outro procedimento/instrumento: <informar, ou inserir um traço horizontal>

  c. PARECER: <favorável ou desfavorável>

  2) ATENÇÃO:

  a. Teste(s) psicológico(s) utilizado(s):

  i. <Nome do Teste/Manual>, <Autor>, <Editora>, <Ano de publicação>, ou <preencher

  com um traço horizontal>

  b. Outro procedimento/instrumento: <informar, ou inserir um traço horizontal>

  c. PARECER: <favorável ou desfavorável>Data de emissão: 9 de março de 2018 IS nº 67-005

  Revisão B

  3) MEMÓRIA:

  a. Teste(s) psicológico(s) utilizado(s):

  i. <Nome do Teste/Manual>, <Autor>, <Editora>, <Ano de publicação>, ou <preencher

  com um traço horizontal>

  b. Outro procedimento/instrumento: <informar, ou inserir um traço horizontal>

  c. PARECER: <favorável ou desfavorável>

  4) RACIOCÍNIO:

  a. Teste(s) psicológico(s) utilizado(s):

  i. <Nome do Teste/Manual>, <Autor>, <Editora>, <Ano de publicação>, ou <preencher

  com um traço horizontal>

  b. Outro procedimento/instrumento: <informar, ou inserir um traço horizontal>

  c. PARECER: <favorável ou desfavorável>

  5) RESULTADO DA AVALIAÇÃO PSICOLÓGICA:

  Tendo realizado os procedimentos anteriormente mencionados e obtido os pareceres parciais

  informados, o PARECER FINAL para a avaliação psicológica conduzida, visando a

  possibilidade de que o interessado possa submeter-se a novo exame de saúde pericial em grau
  de

  recurso é:

  a. PARECER FINAL: <favorável ou desfavorável>

  Declaro que o presente atestado foi produzido a partir de Relatório/Laudo previamente emitido
  por mim, correspondente ao processo de avaliação

  psicológica realizado e que o laudo/relatório emitido será mantido em meus arquivos profissionais
  pelo prazo mínimo de 5 (cinco) anos, conforme

  estabelecido pelo Conselho Federal de Psicologia.

  ___________________________________

  Assinatura do(a) psicólogo(a)

