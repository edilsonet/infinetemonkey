text: '4.1.17 segmento de currículo: maior subdivisão de um currículo. Contém assuntos e atividades
  relacionadas a um determinado treinamento;

  4.1.18 sessões de simulador ou em dispositivos de treinamento: detalhamento das manobras,
  procedimentos e respectivas cargas horárias de cada sessão de treinamento em simulador de
  voo ou dispositivo de treinamento;

  4.1.19 SISHAB: sistema destinado ao cadastro dos Programas de Treinamento aprovados visando
  viabilizar a notificação à Anac da realização de treinamento, pedido de exame e emissão/atualização
  da licença e/ou habilitação. Para acesso e descrição do funcionamento verificar a IS nº
  61-007.

  4.1.20 tipos de treinamento: classificação de treinamentos de acordo com o requisito regulamentar
  que atende, conforme listados na Subparte M e P do RBAC nº 90. Compreendem:'
