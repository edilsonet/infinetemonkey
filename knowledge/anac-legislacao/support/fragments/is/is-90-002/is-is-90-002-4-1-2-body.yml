text: '4.1.2 componente curricular: elemento constituinte de um currículo de treinamento;

  4.1.3 currículo de solo: conjunto de segmentos específicos de determinada aeronave, cujo
  estudo preliminar é fundamental para as operações de voo. Exemplo: sistemas da aeronave
  e grupo motopropulsor;

  4.1.4 currículo de voo: conjunto de segmentos e manobras executadas durante a instrução
  com o objetivo de entender e aprender a operação de determinada aeronave. Exemplo: manobra
  de autorrotação;

  4.1.5 Dispositivo de Treinamento para Simulação de Voo (Flight Simulation Training Device
  - FSTD): qualquer equipamento no qual as condições de voo podem ser simuladas no solo e
  que esteja qualificado pela Anac como abaixo:'
