text: '4.1.7 Ensino à Distância (EAD): modalidade de educação mediada por tecnologias em que
  discentes e docentes estão separados espacial e/ou temporalmente;

  4.1.8 Equipamento de Proteção Individual (EPI): dispositivo ou produto de uso individual
  utilizado pelo trabalhador, destinado à proteção contra riscos à segurança e à saúde no
  trabalho;

  4.1.9 examinador credenciado de UAP: pessoa credenciada pela Anac para atuar como seu preposto
  realizando exames de pilotos vinculados aos operadores regidos pelo RBAC nº 90 para realização
  de exames requeridos pelo RBAC nº 90, provimento de licenças e emissão/revalidação de habilitações;

  4.1.10 material didático: material instrutivo desenvolvido para cada tipo de currículo,
  compreendendo planos de aula, guias dos instrutores, manuais de treinamento, programas de
  computador (software), recursos audiovisuais, livros, apostilas e manuais das aeronaves.
  O material didático deve refletir, exatamente, o requerido nos currículos de treinamento
  e estar de acordo com os métodos de instrução adotados;

  4.1.11 métodos de instrução: metodologia de ensino empregada para transmitir informações
  aos tripulantes mediante aulas, conferências, demonstrações, apresentações multimídia e
  estudos dirigidos. Podem ser utilizados na instrução, entre outros equipamentos, computadores,
  dispositivos de treinamento, simuladores de voo e aeronaves;

  4.1.12 missões de voo: detalhamento das manobras, procedimentos e respectivas cargas horárias
  de cada missão de treinamento de voo em aeronave, previstos em documentação para treinamentos
  (fabricante, CTAC ou autoridade aeronáutica);

  4.1.13 módulo de treinamento: subparte de um segmento de currículo que contém elementos
  ou eventos relacionados diretamente com um assunto específico. Um módulo de treinamento
  inclui conteúdo programático, carga horária, material didático, método de instrução e instrutores;

  4.1.14 relatório de avaliação operacional: relatório de avaliação de um tipo de aeronave
  que contém requisitos mínimos para treinamento. São chamados AVOP quando emitidos pela Anac,
  FSB reports quanto emitidos pelo FAA e OSD (anteriormente OEB) quanto emitidos pela EASA;

  4.1.15 Aeronave Remotamente Pilotada (Remotely-Piloted Aircraft - RPA): significa a aeronave
  não tripulada pilotada a partir de uma estação de pilotagem remota com finalidade diversa
  de recreação;

  4.1.16 programa de treinamento operacional (PTO): material que descreve os treinamentos
  a serem ministrados pelo operador para seus tripulantes nas diferentes fases dentro da UAP
  e que visa garantir que cada tripulante seja adequadamente treinado para cada aeronave,
  cada função e cada tipo de operação em que realizará. O PTO deve observar os requisitos
  dos regulamentos aplicáveis;'
