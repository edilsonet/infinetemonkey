title: 5.1.2(b)
text: 'b) treinamento periódico.

  Nota 1: conforme detalhado no Apêndice A do RBAC nº 90 - APROVAÇÃO DE MANUAIS E TREINAMENTOS,
  alguns treinamentos requeridos não necessitam de aprovação da Anac, bastando que sejam aprovados
  no âmbito da UAP. Esses treinamentos não fazem parte do escopo desta IS. Enquadram-se nessa
  situação:'
