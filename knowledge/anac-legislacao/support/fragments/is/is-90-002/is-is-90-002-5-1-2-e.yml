section_id: 5.1.2
section_title: 'Para os comissários de voo, segundo o RBAC nº 90, os tipos de treinamento
  que devem ser submetidos a avaliação pela Anac são:'
subsection_id: e
cite: 5.1.2(e)
title: 5.1.2(e)
text: 'e) treinamentos especiais (armas e munições embarcadas, pouso em local não cadastrado
  pela Anac, voo tático à baixa altura, lançamento de objetos, operação helocasting, embarque
  e desembarque em voo pairado, paraquedismo, operações sobre extensões de água, operação
  com separação reduzida entre aeronaves, carga externa, NVIS, aeromédico etc.).

  Nota 2: o programa de treinamento de artigos perigosos possui uma particularidade. Em conformidade
  com o parágrafo 175.51(b)(3) do RBAC nº 175, o parágrafo 90.285(c) do RBAC nº 90 prevê que
  o programa de treinamento de artigos perigosos não precisa ser enviado para análise da Anac
  e será considerado aprovado desde que obedeça ao disposto na Subparte S do RBAC nº 90 e
  nas normas específicas de artigos perigosos da Anac, em especial a IS nº 175-002 e IS nº
  175-007.

  Nota 3: caso a UAP pretenda ministrar cursos que visem a emissão de licença segundo o RBAC
  nº 61 e IS nº 141-007, esses treinamentos deverão ser inseridos no Módulo 5 - Outros Treinamentos
  deste programa de treinamento.

  5.1.3 Os instrutores da UAP deverão cumprir com os requisitos constantes na seção 90.29
  do RBAC nº 90. Todavia, é importante ressaltar que as instruções teóricas e práticas poderão
  também ser ministradas por outras entidades, conforme previsto no parágrafo 90.153(a):'
