section_title: 'Os parágrafos 90.153(c) e (d) especificam regras especiais para instrutores,
  para situações específicas:'
subsection_id: b
cite: 5.1.4(b)
title: 5.1.4(b)
text: 'b) o componente curricular de artigos perigosos pode ser ministrado por instrutor credenciado
  pela Anac, conforme a IS nº 175-002 e IS nº 175-007 ou por profissional de notória especialização.
  Nesse último caso, o treinamento não pode ser utilizado pelo tripulante para cumprimento
  do RBAC nº 175, quando atuando fora de UAP.

  5.1.5 A UAP ainda poderá utilizar-se do instrutor eventual em razão de necessidade temporária
  de excepcional interesse público, por tempo limitado, desde que o profissional tenha notória
  especialização no componente curricular que irá ministrar e tenha sido designado pela UAP
  para ministrar a instrução, conforme disposto na seção 90.27 do RBAC nº 90. Os procedimentos
  para a seleção, designação, determinação do tempo de instrução e outros critérios para a
  utilização desse profissional devem estar descritos no PTO.'
