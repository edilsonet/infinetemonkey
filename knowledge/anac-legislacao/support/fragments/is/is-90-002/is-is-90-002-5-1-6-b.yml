section_id: 5.1.6
section_title: 'Para a formação de instrutores, os treinamentos constantes na Subparte Q do
  RBAC nº 90 que devem ser submetidos a avaliação da Anac são:'
subsection_id: b
cite: 5.1.6(b)
title: 5.1.6(b)
text: 'b) treinamento de transição para instrutor de voo, composto de currículo de voo.

  5.1.7 Eventualmente nem todos os tipos de treinamentos serão aplicáveis a todos os operadores.
  Por exemplo, caso uma UAP possua apenas um modelo de aeronave, não precisará desenvolver
  o treinamento de transição ou de diferenças (tanto para pilotos, quanto para instrutores).
  Todavia, a UAP deve fazer constar no módulo adequado que o treinamento é “não aplicável”.

  5.2 Estrutura do Programa de Treinamento Operacional - PTO'
