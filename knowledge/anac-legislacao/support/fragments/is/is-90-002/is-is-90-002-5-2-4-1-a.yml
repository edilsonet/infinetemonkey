section_title: Este módulo deve conter o termo de aprovação do Programa de Treinamento Operacional
  a ser datado e assinado pelo gestor da UAP.
subsection_id: a
cite: 5.2.4.1(a)
title: 5.2.4.1(a)
text: 'a) procedimentos para a condução de testes e exames. O procedimento proposto visa garantir
  que um determinado piloto, cujo exame foi autorizado pelo instrutor, possua condições de
  êxito na avaliação. Neste ponto também deve-se informar qual o mínimo de qualificação para
  considerar o aluno como aprovado.

  Exemplo de procedimento: ao final de cada segmento de solo, o instrutor será capaz de avaliar
  se o aluno está apto a realizar as avaliações escritas analisando seu desempenho no decorrer
  das aulas com perguntas feitas sobre a matéria. No que tange ao currículo de voo, as fichas
  de avaliações terão um resumo da proficiência do aluno e encaminhamento ou não para a próxima
  etapa do treinamento. O mínimo de acerto exigido é de 70% em qualquer exame;'
