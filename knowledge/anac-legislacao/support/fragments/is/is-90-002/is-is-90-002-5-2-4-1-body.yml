text: '5.2.4.1 Este módulo deve conter o termo de aprovação do Programa de Treinamento Operacional
  a ser datado e assinado pelo gestor da UAP.

  5.2.4.2 A UAP deve descrever a política de treinamento de seus tripulantes, os objetivos
  que a unidade área propõe, o que é esperado dos candidatos em relação à aprendizagem e as
  diretrizes que compõem a filosofia de ensino da unidade.

  5.2.4.3 Neste módulo devem ser descritas as metodologias de ensino que serão ministradas
  pela UAP aos alunos. Deve estar clara e de fácil entendimento qual será a forma de avaliação
  dos componentes curriculares para os alunos.

  5.2.4.4 Para os conteúdos teóricos (currículos de solo), as formas de avaliação devem descrever
  o quantitativo de questões por componente curricular e o mínimo aceitável para que o candidato-aluno
  seja considerado apto. O mínimo aceitável pode ser considerado a partir do total de todos
  os componentes curriculares.

  5.2.4.5 O programa de treinamento deve ser compatível com o relatório de avaliação operacional,
  OSD ou programa de treinamento do fabricante/centro de treinamento certificado (conforme
  ordem de prioridade estabelecida no parágrafo 90.151(d)), caso existam. Assim, caso esses
  documentos prevejam um quantitativo mínimo de questões e/ou mínimo aceitável para que o
  piloto-aluno seja considerado apto (currículo de solo ou de voo), o PTO da UAP deve adotar,
  como mínimo, os parâmetros estabelecidos nesses documentos, podendo ser mais exigente, se
  for de interesse da UAP.

  5.2.4.6 Devem ser observados os requisitos constantes nas seções 90.23 e 90.25 do RBAC nº
  90 referente às marcas mínimas requeridas para o desempenho da função de piloto em comando
  e de piloto segundo em comando, respectivamente, bem como os requisitos mínimos exigidos
  pela própria UAP, que podem ser mais restritivos.

  5.2.4.7 Os referidos requisitos devem estar separados pelos tipos de treinamentos ministrados
  pela UAP. Devem estar claros os requisitos mínimos de licenças e habilitações, bem como
  a quantidade de experiência de voo (horas de voo).

  5.2.4.8 Definições: devem ser definidos os termos utilizados no PTO, visando garantir sua
  correta interpretação. As definições contidas nesta IS e as contidas nos demais materiais
  de referência, se aplicáveis ao operador, podem ser usadas como base para elaboração desta
  seção.

  5.2.4.9 Registros: o PTO deve informar o responsável pela guarda e registro das informações
  de treinamento bem como sua localização para fins de auditoria por parte desta Agência.

  5.2.4.10 Avaliações: as avaliações dos conhecimentos teóricos e aptidões psicomotoras aplicáveis
  aos operadores regidos pelo RBAC nº 90 são os descritos nos parágrafos 90.173(h); 90.175(d);
  90.181(b); 90.183(d); 90.187(b); 90.189(d); 90.193(b); e 90.195(d) do RBAC nº 90. O operador
  deve descrever os métodos e procedimentos utilizados para a sua avaliação; assim, os seguintes
  tópicos deverão ser abordados:'
