  5.2.4.11 Validade dos treinamentos: deve constar no programa de treinamento o método de
  controle da validade dos treinamentos realizados pelos tripulantes, estabelecendo-se procedimentos
  que garantam a realização no período de elegibilidade de todos os treinamentos previstos
  para os tripulantes, de acordo com as aeronaves operadas e sua função a bordo.

  5.2.4.12 É importante ainda destacar que a validade dos treinamentos não está vinculada
  diretamente à validade da habilitação do tripulante. A validade da habilitação é definida
  a partir da data de realização do exame, enquanto a validade do treinamento é definida a
  partir da data de conclusão do segmento de currículo específico.

  5.2.4.13 Conforme o parágrafo 90.179 (e) do RBAC nº 90 e em linha com a seção 61.33 do RBAC
  nº 61, é permitida a operação normal relativa a uma habilitação cuja vigência se findou
  há menos de 30 (trinta) dias. O treinamento ou o exame de proficiência realizados entre
  o mês anterior ao do vencimento e o mês posterior ao do vencimento são considerados como
  se tivessem sido realizados no mês do vencimento. Esse período de 3 meses é denominado “período
  de elegibilidade”.

  5.2.4.14 Qualificação de instrutores: os instrutores de solo/voo devem possuir os requisitos
  mínimos constantes na seção 90.29 do RBAC nº 90. Além disso, deve-se atentar aos requisitos
  constantes na Subparte Q do RBAC nº 90, que incluem a realização de treinamentos e exames
  específicos para o exercício dessa função numa determinada aeronave.

  5.2.4.15 Para a contratação de organizações externas à UAP, o operador deve garantir que
  o treinamento será executado conforme seu Programa de Treinamento Operacional aprovado.

  5.2.4.16 Utilização de metodologia EAD: poderá ser aplicada somente para os treinamentos
