title: 5.2.5.10(e)
text: 'e) treinamento em artigos perigosos: compõe-se dos segmentos e subsegmentos presentes
  no parágrafo 90.285(d) do RBAC nº 90.

  Nota: os componentes curriculares previstos neste módulo de treinamento são o mínimo exigido
  pelo RBAC nº 90. Não há óbice à UAP incluir outros componentes curriculares, com seus detalhamentos,
  desde que devidamente descritos na mesma tabela e com as cargas horárias definidas.'
