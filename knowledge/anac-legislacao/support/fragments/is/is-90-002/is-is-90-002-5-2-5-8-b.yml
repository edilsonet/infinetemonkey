section_id: 5.2.5.8
section_title: 'Devem estar previstas explicitamente as periodicidades dos treinamentos. A
  validade dos treinamentos institucionais é de:'
subsection_id: b
cite: 5.2.5.8(b)
title: 5.2.5.8(b)
text: 'b) 36 meses para os demais componentes curriculares, conforme 90.179(b)(1).

  5.2.5.9 É discricionário à UAP ministrar os currículos de solo periódicos concomitantemente,
  desde que respeitada a validade menor. Por exemplo, é permitido ministrar concomitantemente
  o treinamento em artigos perigosos e os demais componentes curriculares a cada 24 meses.'
