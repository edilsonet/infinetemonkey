title: Conteúdo do Módulo 2 - Treinamentos institucionais
text: '5.2.5 Conteúdo do Módulo 2 - Treinamentos institucionais

  5.2.5.1 Este módulo refere-se aos treinamentos teóricos institucionais que a UAP deve ministrar
  conforme os tipos de treinamento prescritos no parágrafo 90.151(a) e na seção 90.285 do
  RBAC nº 90. Os treinamentos de aeronave (incluindo teóricos e de voo) devem estar previstos
  no Módulo 3 - Treinamentos das Aeronaves.

  5.2.5.2 Neste módulo, a UAP deve apresentar todos os componentes curriculares previstos,
  seus respectivos segmentos e detalhamentos. Por exemplo, o currículo de solo do treinamento
  inicial de piloto (90.173(a)) prevê o componente curricular doutrinamento básico. Este componente,
  por sua vez, está detalhado em oito segmentos, conforme 90.173(b): (1) atribuições e responsabilidades
  do piloto; (2) o previsto no MOP da UAP; (3) o uso da MEL, se aplicável; etc.

  5.2.5.3 Os componentes curriculares e seus segmentos devem estar expressamente previstos
  no programa de treinamento. Não cabe à Anac a interpretação dos componentes curriculares
  e seus segmentos de modo a estabelecer compatibilidade entre o componente exigido no texto
  do RBAC nº 90 e os componentes descritos no programa de treinamento da UAP.

  5.2.5.4 Os componentes curriculares devem estar dispostos de forma organizada (tabela, formulário,
  grade etc) para que se possa identificar o tipo de treinamento, os componentes curriculares
  e os segmentos que formam cada componente curricular com a carga horária determinada e a
  periodicidade. A Anac se servirá dessa forma organizada para cadastrar o PTO no SISHAB após
  aprovação.

  5.2.5.5 Os formulários a serem utilizados para organizar a informação, em sua versão mais
  atualizada, estão disponíveis para o usuário em formato editável no sítio da Anac na rede
  mundial de computadores, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.'
