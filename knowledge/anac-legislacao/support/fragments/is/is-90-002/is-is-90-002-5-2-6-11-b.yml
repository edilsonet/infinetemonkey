subsection_id: b
cite: 5.2.6.11(b)
title: 5.2.6.11(b)
text: 'b) SOP da UAP: componente curricular de SOP da UAP deve conter a rotina operacional
  padronizada de solo e de voo da UAP, para condições normais, anormais e de emergências,
  com os deveres e atribuições para cada função desempenhada a bordo para cada modelo de aeronave.
  Vale ressaltar que não basta replicar este referido texto (parágrafo 90.173(f)) no PTO,
  pois devem estar descritos os segmentos específicos do SOP da UAP;'
