section_id: 5.2.6.8
section_title: 'Devem estar previstas explicitamente as periodicidades dos treinamentos. A
  validade dos treinamentos de aeronave é de:'
subsection_id: d
cite: 5.2.6.8(d)
title: 5.2.6.8(d)
text: 'd) 12 meses para o currículo de voo, conforme 90.179(c).

  5.2.6.9 Os componentes curriculares devem estar dispostos de forma organizada (tabela, formulário,
  grade etc) para que se possa identificar o tipo de treinamento, os componentes curriculares
  e os segmentos que formam cada componente curricular com a carga horária determinada e a
  periodicidade. A Anac se servirá dessa forma organizada para cadastrar o PTO no SISHAB após
  aprovação.

  5.2.6.10 Os formulários a serem utilizados para organizar a informação, em sua versão mais
  atualizada, estão disponíveis para o usuário em formato editável no sítio da Anac na rede
  mundial de computadores, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.'
