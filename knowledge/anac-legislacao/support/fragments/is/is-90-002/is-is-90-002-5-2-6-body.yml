title: Conteúdo do Módulo 3 - Treinamentos de aeronaves
text: '5.2.6 Conteúdo do Módulo 3 - Treinamentos de aeronaves

  5.2.6.1 Para o treinamento de pilotos, devem estar previstos neste módulo o conhecimento
  teórico das aeronaves (ground school), os procedimentos operacionais padronizados da UAP
  (SOP), os currículos de voo para cada aeronave e o currículo de exercícios práticos em emergências
  gerais, conforme os tipos de treinamento prescritos no parágrafo 90.151(a) do RBAC nº 90.

  5.2.6.2 Para o treinamento de comissários de voo, devem estar previstos neste módulo os
  treinamentos inicial e periódico. Esses treinamentos são compostos de currículo de solo,
  conforme parágrafo 90.233(b), e currículo de exercício prático, conforme parágrafo 90.233(c).

  5.2.6.3 O piloto-aluno só poderá avançar para os currículos de voo (prática de voo) se for
  considerado apto em avaliação aplicada sobre os componentes curriculares (doutrinamento
  básico, conhecimentos gerais, CRM ou SRM etc) previstos no Módulo 2 - Treinamentos institucionais
  e sobre os conhecimentos teóricos da aeronave (ground school) e SOP da UAP previstos neste
  Módulo 3.

  5.2.6.4 O programa de treinamento deve ser compatível com o relatório de avaliação operacional,
  OSD ou programa de treinamento do fabricante/centro de treinamento certificado (conforme
  ordem de prioridade estabelecida no parágrafo 90.151(d)), caso existam. Assim, a UAP deve
  adotar, como mínimo, os parâmetros estabelecidos nesses documentos (incluindo a ementa curricular,
  a carga horária e quaisquer outros parâmetros, para todos os tipos de treinamento especificados),
  podendo ser mais exigente, se for de interesse da UAP. Na ausência desses documentos, a
  UAP deve definir a ementa curricular e a carga horária mínima para cada lição/missão da
  instrução, de acordo com a Subparte M do RBAC nº 90.

  5.2.6.5 Deve estar explícito neste módulo qual a fonte utilizada para a elaboração de seu
  treinamento. Deve constar o título, a autoridade de aviação civil (ou fabricante), o número
  da revisão do documento, a data do referido documento e, de preferência, o sítio eletrônico
  de onde se possa consultar o documento. Caso a UAP não saiba o sítio eletrônico para consulta,
  deve ser anexada cópia do documento ao PTO (vide Módulo 6 - Anexos).

  5.2.6.6 Caso a UAP não tenha elaborado este módulo com base em relatório operacional ou
  OSD, deve constar explicitamente que a ementa curricular segue a Subparte M do RBAC nº 90
  e a UAP deve apresentar quais as referências utilizadas para a elaboração. Por exemplo,
  ementa baseada no manual de voo da aeronave (AFM), manual de operação do piloto (POH) etc.

  5.2.6.7 Devem estar previstos neste módulo o currículo de exercício prático em emergências
  gerais, conforme a seção 90.177 do RBAC nº 90 para o treinamento de pilotos. Os componentes
  curriculares previstos na referida seção devem estar devidamente adequados às operações
  da UAP, conforme forem aplicáveis.'
