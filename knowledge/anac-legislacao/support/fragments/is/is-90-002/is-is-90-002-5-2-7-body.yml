title: Módulo 4 - Treinamento de instrutores
text: '5.2.7 Módulo 4 - Treinamento de instrutores

  5.2.7.1 Os treinamentos para a função de instrutor de voo se dividem em treinamento inicial
  e de transição, aplicáveis aos pilotos e cujas bases de treinamentos estão descritas nas
  seções 90.243, 90.245, 90.247 e 90.249 do RBAC nº 90.

  5.2.7.2 O treinamento de instrutor de voo, incluindo o treinamento de solo, de voo e o exame,
  é específico para um tipo de aeronave. Após ser qualificado como instrutor em um determinado
  tipo ou classe de aeronaves pela UAP, caso se pretenda que o instrutor seja designado para
  outro tipo ou classe de aeronaves, deve ser realizado treinamento de transição.

  5.2.7.3 Conforme disposto no parágrafo 90.253 do RBAC nº 90, os instrutores de voo em aeronave
  ou em FSTD da UAP devem se submeter a um exame de observação, para avaliação dos conhecimentos
  teóricos e habilidades psicomotoras complexas, a cada 24 (vinte quatro) meses, conduzido
  por um servidor designado da Anac ou examinador credenciado pela Agência.

  5.2.7.4 O treinamento inicial de instrutores deve estar disposto de forma organizada com
  a descrição dos componentes curriculares dos referidos segmentos, conforme os parágrafos
  90.245(b) para o currículo de solo e 90.247(a) para o currículo de voo.

  5.2.7.5 A carga horária do currículo de solo para o treinamento inicial de instrutores é
  composta, no mínimo, de 40 horas, conforme o parágrafo 90.245(a). Já a carga horária do
  currículo de voo é composta de, no mínimo, 10 horas de voo para cada tipo de aeronave, conforme
  a seção 90.247(a).

  5.2.7.6 O treinamento de transição de instrutores deve estar disposto de forma organizada
  com a descrição dos componentes curriculares dos referidos segmentos, conforme os assuntos
  específicos para o tipo de aeronave listados no parágrafo 90.245(b) para o currículo de
  solo (por exemplo, o parágrafo 90.245(b)(28)) e o parágrafo 90.249(e) para o currículo de
  voo.

  5.2.7.7 A carga horária do currículo de voo para o treinamento de transição de instrutores
  é composta de, no mínimo, 3 horas de voo para cada tipo de aeronave. A carga horária do
  currículo de solo deve ser estabelecida pela UAP.

  5.2.7.8 Os componentes curriculares e seus segmentos devem estar expressamente previstos
  no programa de treinamento. Não cabe à Anac a interpretação dos componentes curriculares
  e seus segmentos de modo a estabelecer compatibilidade entre o componente exigido no texto
  do RBAC nº 90 e os componentes descritos no programa de treinamento da UAP.

  5.2.7.9 Os componentes curriculares devem estar dispostos de forma organizada (tabela, formulário,
  grade etc) para que se possa identificar o tipo de treinamento, os componentes curriculares
  e os segmentos que formam cada componente curricular com a carga horária determinada e a
  periodicidade. A Anac se servirá dessa forma organizada para cadastrar o PTO no SISHAB após
  aprovação.

  5.2.7.10 Os formulários a serem utilizados para organizar a informação, em sua versão mais
  atualizada, estão disponíveis para o usuário em formato editável no sítio da Anac na rede
  mundial de computadores, no endereço eletrônico: https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.'
