title: Módulo 5 - Outros treinamentos
text: '5.2.8 Módulo 5 - Outros treinamentos

  5.2.8.1 Neste módulo o operador pode apresentar os treinamentos previstos nas Subpartes
  N e O (treinamento para operador aerotático e treinamento para operador de suporte médico,
  respectivamente), treinamentos que resultem em licenças e habilitações conforme RBAC nº
  61, bem como treinamentos adicionais não previstos nos módulos anteriores.

  5.2.8.2 Conforme prescrito no parágrafo 90.151(k) do RBAC nº 90, a UAP pode incluir em seu
  programa de treinamento os treinamentos para a emissão e obtenção das licenças PPA/H, PCA/H
  e PLA/H para os pilotos que compõem seus quadros. Esses treinamentos devem observar o previsto
  no RBAC nº 61 e na IS nº 141-007 no que tange aos conteúdos e às cargas horárias aplicáveis
  aos treinamentos. Observa-se que não há previsão em regulamento de cursos teóricos de PPA/H
  assim como PLA/H de forma que o previsto na IS nº 141-007 é apenas uma recomendação. Além
  disso, não há previsão de aprovação de curso prático para PLA/H. A UAP deve encaminhar declaração
  com quadro desses treinamentos que pretende ministrar, conforme modelo disponível em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  5.2.8.3 No que tange especificamente aos treinamentos de PCA/H, INVA/H e IFR/H, a UAP que
  possuir esses treinamentos em seu programa, após o cadastramento do PTO na base do Sistema
  de Habilitações - SISHAB, poderá efetuar o cadastro dos candidatos aprovados nos cursos
  específicos com as informações dos pilotos (nome, CPF, CANAC e curso), com vista ao provimento
  de acesso à realização dos exames teóricos da Anac (banca de exames da Anac), conforme regulamentação
  específica para exames.'
