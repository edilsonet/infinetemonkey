title: Módulo 6 - Anexos
text: '5.2.9 Módulo 6 - Anexos

  5.2.9.1 Este módulo refere-se aos anexos que o operador considere relevante apontar no programa
  de treinamento. Devem ser incluídos neste módulo as imagens e manobras que serão abordadas
  nos treinamentos, cujo componente curricular encontra-se descrito nos currículos de voo
  do Módulo 3 - Treinamento de aeronaves desta IS.

  5.2.9.2 Podem ser incluídas as referências bibliográficas, referências aos relatórios de
  avaliação operacional descritos no Módulo 3 - Treinamento de aeronaves, manuais das aeronaves
  etc.

  5.3 Processo de aprovação'
