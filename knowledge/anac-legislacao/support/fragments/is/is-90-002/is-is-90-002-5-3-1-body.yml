cite: 5.3.1
title: 'O processo de aprovação do PTO é dividido em duas etapas: aprovação inicial e aprovação
  final.'
text: '5.3.1 O processo de aprovação do PTO é dividido em duas etapas: aprovação inicial e
  aprovação final.

  5.3.2 Aprovação inicial é o documento por escrito emitido pela Anac que autoriza a UAP a
  ministrar os treinamentos para qualificar seu pessoal de acordo com os currículos apresentados,
  com uma análise posterior da eficácia dos treinamentos.

  5.3.3 A aprovação final (do PTO ou da revisão do PTO) é o documento emitido pela Anac, após
  verificar a eficácia do PTO, isto é, que todos os participantes que concluíram com êxito
  os treinamentos estão adequadamente capacitados para desempenharem suas funções.

  5.3.4 De acordo com os parágrafos 90.155(b) e 90.155(c), a Anac pode, a qualquer momento
  durante o processo de análise para aprovação do PTO, designar servidores para acompanhar
  os treinamentos previstos. O objetivo dessa medida é avaliar a eficiência dos treinamentos
  aplicados pela UAP.'
