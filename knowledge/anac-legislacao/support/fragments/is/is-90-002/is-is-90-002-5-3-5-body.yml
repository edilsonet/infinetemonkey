title: Peticionamento, prazos, iterações e encerramento compulsório dos processos
text: '5.3.5 Peticionamento, prazos, iterações e encerramento compulsório dos processos

  5.3.5.1 O processo de análise do PTO é conduzido pela Gerência Técnica de Certificação -
  GTCE. Cada petição deve ser realizada em processo específico, conforme instruções descritas
  no sistema SEI.

  5.3.5.2 A UAP terá um prazo padrão de 30 (trinta) dias para apresentar resposta a cada comunicação
  de não conformidade, mas poderão ser definidos prazos diversos pela Anac em situações excepcionais.

  5.3.5.3 A não observância do prazo estabelecido, sem qualquer manifestação por parte do
  requerente para a apresentação das ações requeridas, caracterizará desistência e ensejará
  o arquivamento do processo.

  5.3.6 Sendo necessário e caso ainda esteja dentro do prazo inicialmente concedido, o requerente,
  por meio de petição protocolada na Anac, poderá solicitar prorrogação de prazo desde que
  devidamente justificada. A concessão da dilação e o prazo ficarão a critério da Anac.'
