title: 5.3.7(a)
text: a) a solicitação deve ser enviada à ANAC antes da notificação do treinamento (que, por
  sua vez, deve atender aos prazos previstos na IS nº 61-007). Dessa forma, não é permitido,
  sob essa autorização, o aproveitamento de treinamentos realizados previamente;
