kind: is
document: is-90-002
family: '90'
section_id: 5.3.7
section_title: Caso uma proposta seja rejeitada pela 3ª vez durante a análise, o processo
  será indeferido e arquivado compulsoriamente, independentemente do prazo.
subsection_id: d
cite: 5.3.7(d)
title: 5.3.7(d)
text: 'd) caso, durante a conclusão do processo de aprovação inicial, a ANAC requeira alterações
  no programa submetido que afetem os treinamentos já realizados, tais treinamentos deverão
  ser realizados novamente na medida necessária para atender às novas alterações, conforme
  determinado pela ANAC. Observa-se que um treinamento ministrado incorretamente pode resultar
  em um prejuízo ao aprendizado do aluno em razão de absorção e consolidação de informações
  incorretas, de forma que, para reparar tal situação, pode ser necessário até mesmo a realização
  de treinamentos adicionais mais exigentes do que os que seriam devidos a um aluno que ainda
  não recebeu qualquer treinamento.

  5.4.2 Destaca-se que esta é uma opção ao operador, como alternativa ao processo usual (que
  requer a obtenção da aprovação inicial para início da condução dos treinamentos). Caso o
  operador solicite e obtenha tal autorização, assume o risco e deve arcar com as consequências
  caso o treinamento venha a ser considerado inadequado posteriormente.'
