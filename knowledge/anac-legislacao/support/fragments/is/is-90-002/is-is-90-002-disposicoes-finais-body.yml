title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  7.1 Os operadores com PTO aprovados ou em processo de análise em andamento em 11 de abril
  de 2025 deverão se adequar às disposições estabelecidas nesta IS até 11 de abril de 2027.

  7.2 Apresentações de novos materiais ou revisões a partir de 11 de abril de 2025 deverão
  ser realizadas de acordo com as disposições contidas nesta IS.

  7.3 Os casos omissos serão dirimidos pela SPO.'
