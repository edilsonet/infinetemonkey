title: OBJETIVO
text: 'OBJETIVO

  1.1 Apresentar uma metodologia que propicie a elaboração de programa de treinamento operacional
  (PTO) aceitável pela Anac, que assegure treinamento adequado ao desempenho das atribuições
  de cada tripulante e instrutor de voo em atividade nas Unidades Aéreas Públicas (UAP) que
  conduzam operações segundo o RBAC nº 90, em consonância ao requerido nas subpartes C, L,
  M, P, Q e S do RBAC nº 90.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação e revisão do PTO, desde
  sua submissão à análise da Anac até a emissão de aprovação inicial e final.'
