  5.1.8 Tendo em vista que a evolução dos sistemas de navegação de área e o esforço de padronização
  da OACI (levado a cabo com a terceira edição do Doc 9613, hoje já desatualizada) impuseram
  uma forte evolução na conceituação e na normatização da navegação de área, faz-se necessário
  frisar que muitos dos conceitos e acrônimos utilizados nos documentos de referência possuem
  significados distintos em documentos distintos, ou mesmo mais de um significado em um mesmo
  documento, dependo do contexto. Recomenda-se, portanto, atenção na leitura da documentação,
  a fim de evitar distorções nas interpretações, em especial dos documentos editados antes
  da terceira edição do Doc 9613.

  5.1.9 Esta IS pode não atender a todas as especificidades estabelecidas para as operações
  PBN. Nos casos omissos a ANAC deve basear as autorizações em documentos complementares,
  como as circulares de assessoramento do SRVSOP e o Doc 7030, Regional Supplementary Procedures,
  publicado pela OACI.

  5.1.10 Cabe ressaltar que o acrônimo RNAV significa genericamente “navegador ou navegação
  de área”, mas também é utilizado como designador de rotas PBN específicas (veja a Tabela
  2). O acrônimo RNP, por sua vez, significa genericamente “desempenho de navegação requerida”
  e foi largamente utilizado com este significado na segunda edição do Doc 9613, mas a partir
  da terceira edição (que adotou o conceito PBN), tem sido utilizado como designador de rotas
  PBN específicas.

  5.1.11 A ANAC é a autoridade responsável pela aprovação das operações de voo dos prestadores
  de serviços aéreos brasileiros e, no caso de aviação geral, das aeronaves de matrícula brasileira,
  incluindo aquelas que possuam requisitos de navegação baseados em desempenho - conceito
  PBN (RNAV e RNP). Com este intuito, a ANAC deve assegurar que tanto as aeronaves quanto
  os operadores que pretendam realizar tais operações estejam devidamente capacitados à plena
  execução de todos os procedimentos relacionados às operações PBN pleiteadas, antes de emitir
  as respectivas autorizações.

  5.1.12 A presente Instrução Suplementar foi elaborada considerando que as rotas e procedimentos
  envolvendo o conceito PBN aqui tratado são publicados e executados tendo como referência
  o sistema de coordenadas WGS 84 (World Geodetic System 84).

  5.1.13 Esta IS aborda os aspectos que serão observados durante o processo de autorização
  de operações PBN para as diversas especificações, de forma tal que outros documentos que
  tratam do assunto devem ser considerados para a efetiva execução das operações. Os NOTAMs,
  as Circulares de Informações Aeronáuticas (AIC), a Publicação de Informações Aeronáuticas
  (AIP) do DECEA e os manuais de operação das aeronaves são exemplos de documentos que complementam
  as instruções para a condução das operações de navegação baseada em desempenho.

  5.1.14 Uma aprovação operacional emitida por força deste documento permite que o operador
  realize operações PBN, de acordo com critérios adotados ao redor do globo, dentro de um
  conceito de espaço aéreo por área de operação. A Tabela 2 relaciona as operações PBN abordadas
  por este documento, com suas respectivas precisões e áreas de atuação.


