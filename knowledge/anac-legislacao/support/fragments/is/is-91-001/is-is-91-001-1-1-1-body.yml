title: 1.1.1
text: '1.1.1

  5.1.1 O conceito PBN representa um esforço da OACI em harmonizar os métodos de navegação
  de área e engloba os métodos de navegação RNAV e RNP. Estes últimos são dois métodos similares,
  que se diferenciam basicamente pela existência, na navegação RNP, de um sistema de monitoramento
  e alerta aos pilotos da integridade da informação de posicionamento da aeronave, que não
  se faz necessário na navegação RNAV. O PBN veio a introduzir critérios baseados em desempenho
  para os sistemas de navegação expressos em termos de precisão, integridade, disponibilidade,
  continuidade e funcionalidade, em substituição aos conceitos anteriores cujos critérios
  eram baseados em tecnologias específicas.

  5.1.2 A implantação de rotas de acordo com o conceito de navegação baseada em desempenho
  possibilita a redução da separação lateral e longitudinal entre as aeronaves, resultando
  em benefícios para os operadores, mantendo o elevado nível de segurança das operações. Entre
  outras vantagens, pode-se mencionar um maior número de rotas otimizadas, a redução do tempo
  de voo, diminuição de atrasos, maior flexibilidade de operações e menor consumo de combustível.

  5.1.3 Os sistemas de navegação de área permitem o voo em qualquer trajetória desde que a
  aeronave se encontre dentro da cobertura dos auxílios à navegação (por satélite ou em terra)
  ou dentro da capacidade dos equipamentos embarcados, ou uma combinação de ambos.

  5.1.4 Os requisitos de desempenho de navegação em rotas ou espaços aéreos específicos devem
  ser definidos de maneira clara e concisa. Esta condição visa assegurar que todo o pessoal
  envolvido com as operações esteja devidamente informado sobre a situação e a correta operação
  dos sistemas de navegação a bordo das aeronaves, assim como sobre compatibilidade e adequabilidade
  destes sistemas para a realização dos procedimentos de navegação.

  5.1.5 Para operadores aéreos operando sob as regras do RBAC nº 121, a seção 121.349 estabelece
  a necessidade de autorização, por meio das especificações operativas (EO), de qualquer sistema
  RNAV usado para atender aos requisitos de equipamentos de navegação.

  5.1.6 A seção 135.165 do RBAC nº 135 menciona os equipamentos que necessitam estar instalados
  em uma aeronave para que esta atenda aos requisitos de navegação IFR e ao valor de RNP para
  a rota a ser voada.

  5.1.7 A OACI, com o intuito de harmonizar os requisitos e padronizar as aprovações referentes
  aos conceitos de navegação baseados em desempenho, publicou, por meio da terceira edição
  de seu Doc 9613 - Performance-based Navigation Manual, recomendações para a elaboração dos
  regulamentos nacionais de aprovação PBN por parte dos Estados. Este documento da OACI constitui
  a referência primária para a elaboração da presente Instrução Suplementar, cuja concepção
  também se valeu de documentos estadunidenses, europeus e de circulares de assessoramento
  elaboradas pelo escritório regional da OACI em Lima, no Peru, conforme tabela abaixo:


