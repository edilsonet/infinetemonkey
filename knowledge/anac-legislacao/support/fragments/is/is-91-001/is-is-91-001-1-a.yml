cite: 1(a)
title: 1(a)
text: a) O operador é responsável em adequar o programa de treinamento e seus manuais para
  cada tipo de operação PBN que conduz, incluindo as especificidades dos procedimentos e dos
  equipamentos, os requisitos regulatórios e a autorização concedida (LOA, EO ou Especificações
  Administrativas). Os tripulantes só devem realizar operações para as quais já tenham concluído
  o referido treinamento com aproveitamento satisfatório.
