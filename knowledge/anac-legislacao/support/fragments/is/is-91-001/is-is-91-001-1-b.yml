title: 1(b)
text: b) É valido considerar cenários envolvendo procedimentos RNP AR APCH durante treinamentos
  orientados para operações em rota (LOFT). O treinamento requerido pode utilizar dispositivos
  de treinamento de voo ou simuladores de voo desde que estes dispositivos reproduzam o equipamento
  do operador, as operações pretendidas e tenham a qualificação aprovada pela ANAC.
