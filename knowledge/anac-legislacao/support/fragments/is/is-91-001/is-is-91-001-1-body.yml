title: Introdução
text: '1. Introdução

  1.1 O objetivo dos processos de aprovação dos procedimentos RNP AR APCH é garantir o nível
  de segurança nas operações. Tradicionalmente o nível de segurança aceitável, TLS - target
  level of safety, expressa um risco de colisão de 10-7 por aproximação. Para as operações
  RNP AR APCH é empregado um método de avaliação denominada FOSA, que busca manter o nível
  de segurança equivalente ao tradicional 10-7.

  1.2 O objetivo é alcançado levando-se em consideração uma análise quantitativa e qualitativa
  dos riscos, avaliação dos diversos sistemas da aeronave, procedimentos operacionais, perigos,
  mitigações, ambiente operacional, etc.

  1.3 O FOSA é desenvolvido levando-se em consideração as características específicas da aeronave,
  dos procedimentos operacionais, das características e perfis das cartas de aproximação,
  etc. Devido à sua complexidade e singularidade, é necessário profundo conhecimento operacional
  para sua elaboração.

  1.4 Um FOSA deve ser elaborado ou revisado para todos os procedimentos RNP AR APCH que o
  operador pretenda executar. O FOSA conforme descrito nos itens K8.7 e K8.8 desta IS, deve
  ser submetido à ANAC sempre que for identificada alguma característica específica da aeronave
  ou do ambiente operacional que justifique a tomada de medidas mitigadoras para a manutenção
  da segurança nas operações. Essa avalição deve levar em conta a interdependência dos aspectos
  relativos às características da aeronave, dos procedimentos operacionais, das cartas IAC,
  etc.

  1.5 O FOSA é um elemento fundamental no processo de autorização para operações RNP AR APCH,
  é associado a um ambiente específico e a um o modelo de aeronave particular.

  1.6 A diferença significativa entre o FOSA e outras ferramentas de análises de risco consiste
  em que esta metodologia aplica julgamentos técnicos baseados na combinação quantitativa
  e qualitativa de características da aeronave observadas em determinado ambiente.'
