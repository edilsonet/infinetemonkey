title: 1(c)
text: c) Operadores devem abordar as operações RNP AR APCH durantes os treinamentos iniciais,
  de transição, requalificação, revalidação, periódicos e/ou elevação de nível. A habilidade
  de interpretar, entender e executar um procedimento RNP AR APCH deve ser aferida durante
  uma avaliação inicial. O operador deve também desenvolver um método de avaliação periódica
  para garantir a manutenção dos conhecimentos e habilidades.
