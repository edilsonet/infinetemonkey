text: 'e) Formação Inicial RNP AR. Sem experiência prévia em aproximação RNP AR, cada piloto
  deve completar pelo menos quatro procedimentos de aproximação RNP AR: dois como piloto voando
  (PF) e dois como piloto monitorando (PM). Essas quatro aproximações RNP AR devem empregar
  as características exclusivas de AR dos procedimentos aprovados pelo operador (ou seja,
  trechos de RF, RNP perdidos). Cada piloto deve voar duas aproximações para a altitude de
  decisão (DA) e duas aproximações devem resultar em um RNP Missed Approach Procedure (MAP).
  Duas das aproximações acima incluirão aproximações interrompidas resultando em uma aproximação
  com vetores para retomar a aproximação e uma aproximação resultando em uma parada em um
  fixo de aproximação inicial (IAF) ou fixo de transição.

  NOTA: Os pilotos com experiência anterior em operações de aproximação RNP ou RNAV podem
  receber crédito por todo ou parte deste requisito, desde que os procedimentos do operador
  atual sejam semelhantes e não requeiram novas habilidades do piloto treinadas em um FSTD.

