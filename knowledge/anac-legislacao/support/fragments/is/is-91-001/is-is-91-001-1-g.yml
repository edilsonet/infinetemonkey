text: 'g) desempenho da aeronave associada à execução dos procedimentos.

  Nota 1: as informações detalhadas no item 1.3 devem constar no programa de treinamento e
  nos manuais de procedimentos de DOVs.

  Nota 2: o DOV deve completar satisfatoriamente o currículo de treinamento antes de assinar
  os despachos de voos em que são previstos procedimentos RNP AR APCH.'
