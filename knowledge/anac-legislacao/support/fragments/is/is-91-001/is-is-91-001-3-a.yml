section_title: Considerações durante o voo
subsection_id: a
cite: 3(a)
title: 3(a)
text: 'a) o sistema de navegação não pode perder a capacidade de navegação em decorrência
  de uma falha simples (única falha). Normalmente a aeronave deve ser equipada com:

  i. dois sensores GNSS;

  ii. dois FMS;

  iii. dois sistemas barométricos;

  iv. dois pilotos automáticos independentes; e

  v. um sistema de navegação inercial (IRU);'
