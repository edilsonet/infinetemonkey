cite: 3(b)
title: 3(b)
text: 'b) guia lateral durante o segmento de aproximação perdida ou arremetida. Uma vez que
  a manobra de arremetida tenha sido iniciada (por meio da ativação do TOGA ou outro modo)
  o sistema de guia lateral de navegação deve permanecer no modo de navegação lateral a fim
  de garantir a trajetória durante um segmento RF. Caso a aeronave não possua tal capacidade,
  os seguintes critérios se aplicam:

  i. caso a aeronave possua a capacidade de executar segmentos RF, a trajetória lateral após
  o início da manobra de arremetida (levando em consideração um segmento reto de no mínimo
  50 segundos até a DA) deve permanecer até um grau dentro da trajetória definida por um segmento
  reto até o ponto da DA; e

  ii. o piloto deve ser capaz de acoplar o piloto automático ou a função direct to a fix a
  400 pés AGL; e'
