title: 4.5.2(b)
text: 'b) o órgão ATC deve prover orientações respeitando os limites de desempenho das aeronaves
  e o livramento de obstáculos até que a aeronave se encontre estabilizada no procedimento.
  As aeronaves não devem ser vetoradas para fixos associados a segmentos em curva.

  4.5.5 Procedimentos operacionais. As operações RNP AR APCH estão intimamente ligadas ao
  aumento da confiança nos recursos automatizados da aeronave contribuindo para a redução
  da exposição ao erro humano. Na elaboração do FOSA, no mínimo os aspectos abaixo devem ser
  considerados:'
