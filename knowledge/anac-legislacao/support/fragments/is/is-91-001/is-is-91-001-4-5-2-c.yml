title: 4.5.2(c)
text: 'c) falha no motor. Operadores devem desenvolver procedimentos e treinamentos apropriados
  para mitigar os efeitos resultantes da falha de um motor incluindo o desacoplamento do AP
  e condução do voo manual.

  4.5.3 Serviços de navegação. A utilização e a disponibilidade dos serviços de navegação
  são críticas na execução de procedimentos RNP AR APCH em que o valor de RNP é reduzido.
  Sistemas de navegação multissensores devem ser avaliados levando-se em consideração:'
