  4.5.7 Efeitos dos procedimentos propostos e medidas mitigadoras. Durante a avaliação de
  condições de riscos algumas situações podem indicar probabilidade ou riscos em níveis inaceitáveis.
  A equipe responsável pela elaboração do FOSA deve identificar medidas mitigadoras capazes
  de reduzir a exposição e as consequências dos riscos de tal maneira que seja atingido níveis
  aceitáveis de segurança de voo. Os seguintes aspectos devem ser considerados:'
