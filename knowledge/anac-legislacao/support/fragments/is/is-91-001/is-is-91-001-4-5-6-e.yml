title: 4.5.6(e)
text: 'e) a interrupção da execução do procedimento.

  4.5.8 As situações de perigo devem ser resumidas e agrupadas com os riscos, probabilidade
  e as medidas mitigadoras associadas. Todos os fatores significativos devem ser destacados
  na apresentação do FOSA.

  4.5.9 O Apêndice 9 da AC 91-009, publicada pelo SRVSOP, disponibiliza um exemplo de FOSA,
  que pode ser utilizado como referência para a elaboração de um FOSA específico.'
