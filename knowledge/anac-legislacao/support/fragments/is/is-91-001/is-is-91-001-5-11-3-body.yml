text: '5.11.3 A natureza e severidade do erro podem levar à suspensão da autorização das operações
  até que a causa do problema seja identificada e o problema sanado.

  5.11.4 A qualquer momento, a ANAC poderá solicitar que os operadores detentores de LOA PBN
  ou autorização para operação PBN constante de especificações operativas (RBAC nº 135 ou
  RBAC nº 121) ou de especificações administrativas (Subparte K do RBAC nº 91) apresentem
  evidências do cumprimento dos requisitos aplicáveis para a manutenção de tais autorizações.

  5.11.5 A ausência de resposta ou falha do operador em comprovar o atendimento dos requisitos
  no prazo estipulado pela ANAC poderá ensejar na revogação da autorização PBN emitida.'
