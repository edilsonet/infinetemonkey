section_title: 'Embora seja único, o processo de aprovação de operações PBN deverá ser submetido
  a dois tipos de aprovações:'
subsection_id: a
cite: 5.2.1(a)
title: 5.2.1(a)
text: 'a) Fase 1 - pré-solicitação: os representantes da ANAC e do operador devem possuir
  um entendimento comum em relação à aprovação das operações PBN, estabelecendo os requisitos
  aplicáveis e os documentos de orientação que serão utilizados na condução do processo. Com
  este intuito, uma reunião de orientação prévia (ROP) pode ser agendada, a critério da ANAC,
  para gerir o processo de aprovação, para que as informações pertinentes e os detalhes do
  processo sejam apresentados, tanto por parte do requerente, quanto por parte da ANAC. Ressalta-se
  a importância da observância desta IS e, quando aplicável, dos demais documentos de referência
  como os listados na Tabela 1 desta IS;'
