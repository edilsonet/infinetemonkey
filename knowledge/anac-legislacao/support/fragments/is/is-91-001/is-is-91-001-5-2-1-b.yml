id: is-is-91-001-5-2-1-b
kind: is
document: is-91-001
family: '91'
section_id: 5.2.1
section_title: 'Embora seja único, o processo de aprovação de operações PBN deverá ser submetido
  a dois tipos de aprovações:'
subsection_id: b
cite: 5.2.1(b)
title: 5.2.1(b)
text: 'b) aprovação operacional, emitida pelo Estado do operador.

  5.2.2 Não se deve confundir a aprovação de aeronavegabilidade deste processo de aprovação
  de operações PBN com aprovações de aeronavegabilidade de processos de certificação de tipo
  (CT) ou certificação suplementar de tipo (CST). Embora muitos dos aspectos de aeronavegabilidade
  sejam os mesmos, nos dois últimos verifica-se a instalação de equipamentos de navegação
  de área em aeronaves novas ou modificadas, para emissão de CT, de CST, ou documento equivalente.
  Para o processo de aprovação de operações PBN, o equipamento de navegação de área já deve
  estar instalado e certificado.

  5.2.3 Em um mesmo processo, o requerente poderá pleitear a autorização para condução de
  mais de uma operação PBN. Entretanto, a conformidade com os critérios técnicos, as análises
  e a emissão das autorizações devem ser tratadas individualmente para cada especificação
  PBN solicitada.

  5.2.4 A coordenação dos processos de aprovação PBN é de responsabilidade da SPO por meio
  de suas gerências: a GCTA, para operadores regidos pelo RBAC nº 121; e a GOAG para operadores
  segundo o RBAC nº 135 e o RBAC nº 91, quando aplicável. Portanto, os processos de aprovação
  PBN serão conduzidos por estas gerências.

  5.2.5 Os processos de aprovação de operações PBN seguirão o conceito de processo de cinco
  fases, conforme preconizado pela OACI no DOC 8335, sendo que apenas na última fase (Fase
  5), após o operador ter demonstrado atendimento a todos os requisitos aplicáveis, será emitida
  a aprovação da ANAC para que sejam realizadas as operações pretendidas. As fases do processo
  são descritas a seguir:'
