section_title: 'Embora seja único, o processo de aprovação de operações PBN deverá ser submetido
  a dois tipos de aprovações:'
subsection_id: c
cite: 5.2.1(c)
title: 5.2.1(c)
text: 'c) Fase 3 - análise da documentação: a documentação submetida pelo operador será analisada
  pela ANAC para verificação de sua adequabilidade às operações pretendidas. Como resultado
  desta fase, a ANAC aceitará ou rejeitará a documentação enviada, de acordo com a análise
  documental realizada. Caso a Agência julgue as informações fornecidas como suficientes para
  cumprirem todas as exigências estabelecidas para as operações propostas, a documentação
  e solicitação formal serão aceitas e, em caso contrário, o processo de aprovação será sobrestado
  e o requerente será notificado com um descritivo das não-conformidades encontradas;'
