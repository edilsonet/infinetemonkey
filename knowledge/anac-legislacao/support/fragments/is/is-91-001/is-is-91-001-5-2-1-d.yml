text: 'd) Fase 4 - demonstrações e inspeções: o acompanhamento dos currículos de solo e seções
  de simulador para os diferentes programas de treinamento propostos, voos de avaliação e
  exames de proficiência constituem algumas das atividades passíveis de ser objeto de demonstrações
  com acompanhamento por parte dos inspetores da ANAC. É pertinente enfatizar que somente
  depois de concluída toda a análise documental é que devem ter início as inspeções e demonstrações;
