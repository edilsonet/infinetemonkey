section_title: 'Embora seja único, o processo de aprovação de operações PBN deverá ser submetido
  a dois tipos de aprovações:'
subsection_id: e
cite: 5.2.1(e)
title: 5.2.1(e)
text: 'e) Fase 5 - aprovação: após a finalização de todas as análises, inspeções e demonstrações,
  tendo o requerente demonstrado atendimento satisfatório a todas as exigências estabelecidas,
  a ANAC emitirá uma autorização permitindo ao requerente conduzir as operações PBN solicitadas.
  A autorização constitui a Fase 5 do processo, sendo concluída por meio da emissão das EO
  para as operações realizadas acordo com os RBAC nº 121 e RBAC nº 135, por meio de Especificações
  Administrativas para as operações realizadas de acordo com a Subparte K do RBAC nº 91 e
  por meio de carta de autorização (LOA), para as operações realizadas pelo RBAC nº 91 (exceto
  Subparte K), operando voos internacionais.

  5.3 Representantes e pessoas de contato da organização requerente

  5.3.1 A adequada condução do processo depende da efetividade da comunicação entre a ANAC
  e o interessado. Portanto, é essencial que o interessado realize e mantenha atualizado seu
  cadastro no protocolo eletrônico da ANAC, bem como as indicações dos representantes legais
  e procuradores especiais no sistema SEI.

  5.3.2 As comunicações oficiais acerca do processo de autorização para operação PBN serão
  encaminhadas por meio do sistema SEI exclusivamente por meio eletrônico, para os representantes
  legais e procuradores cadastrados no sistema para o CNPJ ou CPF do interessado.

  5.3.3 O processo eletrônico da ANAC está previsto na Resolução nº 520/2019 e maiores informações
  podem ser consultadas no seguinte endereço: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.3.4 Todas as comunicações, interações e documentos necessários ao processo de certificação
  somente serão aceitos se realizados pelas pessoas legalmente designadas pelo interessado,
  respeitadas as respectivas áreas de atuação.

  5.3.5 São consideradas pessoas legalmente designadas pelo interessado os procuradores cadastrados
  no SEI como procuradores especiais ou pessoas legalmente constituídas, que apresentem procuração,
  contrato de trabalho ou prestação de serviços ou outro documento que comprove a legalidade
  e efetividade da representação.

