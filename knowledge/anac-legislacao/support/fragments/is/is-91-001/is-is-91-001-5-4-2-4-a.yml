section_title: 'Elegibilidade baseada no MV, AFM, POH, SMV, AFMS, EA, TCDS, ou documento equivalente:'
subsection_id: a
cite: 5.4.2.4(a)
title: 5.4.2.4(a)
text: a) uma aeronave pode ser considerada elegível para uma operação PBN se o MV, AFM, POH,
  SMV, AFMS, EA, TCDS, ou documento equivalente, dispuser de uma declaração indicando que
  a aeronave cumpre com os critérios mínimos específicos de aeronavegabilidade para a operação
  PBN pretendida;
