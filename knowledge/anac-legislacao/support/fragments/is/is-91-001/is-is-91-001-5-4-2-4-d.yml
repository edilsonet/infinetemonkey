section_title: 'Elegibilidade baseada no MV, AFM, POH, SMV, AFMS, EA, TCDS, ou documento equivalente:'
subsection_id: d
cite: 5.4.2.4(d)
title: 5.4.2.4(d)
text: d) caso a aeronave não possua no MV, AFM, POH, SMV, AFMS, EA, TCDS, ou documento equivalente,
  declaração indicando que cumpre com os critérios mínimos específicos de aeronavegabilidade
  para a operação PBN pretendida, a aeronave não será elegível para aprovação de uma operação
  PBN. Neste caso, será necessária a certificação da aeronave para condução de operações PBN.
  Informações adicionais dessa certificação podem ser obtidas junto à Gerência de Certificação
  de Projeto de Produto Aeronáutico (GCPP); e
