section_title: 'Elegibilidade baseada no MV, AFM, POH, SMV, AFMS, EA, TCDS, ou documento equivalente:'
subsection_id: e
cite: 5.4.2.4(e)
title: 5.4.2.4(e)
text: e) considera-se documentação equivalente ao MV, AFM, POH, SMV, AFMS, EA, TCDS, para
  fim de demonstração de capacidade declarada, conforme os itens 5.4.2.2 e 5.4.2.4 desta IS,
  a documentação emitida pela autoridade primária da aeronave, ou emitida pelos detentores
  do CT (TC) ou CST (STC), desde que aprovada ou aceita pela autoridade primária da aeronave.
