cite: 5.4.2(b)
title: 5.4.2(b)
text: 'b) segundo caso: capacidade obtida em serviço por meio da aplicação de um boletim de
  serviço (BS ou SB), de uma Service Letter (SL), ou da execução de uma modificação por meio
  de um certificado suplementar de tipo (CST ou STC validado no Brasil), com declaração nos
  manuais de voo (MV, AFM ou POH), nos suplementos ao manual de voo (SMV ou AFMS), nas especificações
  da aeronave (EA ou TCDS), ou em documentação equivalente.

  5.4.2.3 Em ambos os casos, cópia da documentação utilizada na análise da capacidade da aeronave
  deve ser arquivada na entidade, por pelo menos 5 (cinco) anos, e deve ser apresentada à
  ANAC quando requerida.'
