text: '5.4.3.2 Os equipamentos envolvidos nas operações PBN devem ser mantidos de acordo com
  as instruções fornecidas pelo fabricante dos componentes.

  5.4.3.3 Qualquer modificação ou alteração que possa afetar de alguma forma o sistema de
  navegação em uma operação PBN deve ser previamente encaminhado para a ANAC, para a sua aceitação
  ou aprovação antes que tais alterações sejam executadas.

  5.4.3.4 Qualquer reparo que não esteja incluído na documentação de manutenção aprovada/aceita,
  e que possa afetar a integridade do desempenho da navegação, deve ser encaminhado à ANAC
  para a aceitação ou aprovação.'
