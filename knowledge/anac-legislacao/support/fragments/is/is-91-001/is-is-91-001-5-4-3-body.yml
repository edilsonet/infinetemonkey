title: Critérios mínimos para o programa de manutenção
text: '5.4.3 Critérios mínimos para o programa de manutenção

  5.4.3.1 O operador deve garantir que todas as tarefas de manutenção, referentes aos equipamentos
  necessários para a operação PBN pretendida, estejam devidamente informadas no programa de
  manutenção da aeronave.'
