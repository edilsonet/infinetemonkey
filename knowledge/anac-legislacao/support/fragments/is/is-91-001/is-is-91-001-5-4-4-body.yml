title: Critérios mínimos para o PrTrnMnt
text: '5.4.4 Critérios mínimos para o PrTrnMnt

  5.4.4.1 No PrTrnMnt do operador deve constar treinamento específico para a operação PBN
  pretendida, para os funcionários envolvidos com a manutenção da aeronave, e para os responsáveis
  pela liberação de retorno ao serviço da aeronave. Deve ainda definir a periodicidade dos
  treinamentos e o conteúdo dos cursos ministrados. A empresa poderá demonstrar também que
  os treinamentos já aceitos pela ANAC no PrTrnMnt já abordam os treinamentos específicos
  para a operação PBN, sem necessidade de um treinamento específico.'
