text: '5.4.5.3 O operador deve incluir também no MGM qualquer outro procedimento necessário
  para operação PBN das aeronaves.

  5.4.5.4 Caso os procedimentos contidos no MGM do operador já contemplem as exigências constantes
  nos itens 5.4.5.1, 5.4.5.2 e 5.4.5.3 desta IS, esses procedimentos existentes devem ser
  referenciados no texto do MGM dedicado às operações PBN.'
