title: Conteúdo mínimo sobre PBN para o MGM
text: '5.4.5 Conteúdo mínimo sobre PBN para o MGM

  5.4.5.1 O operador deve definir no MGM da empresa os procedimentos para liberação de aeronave
  quando a manutenção envolver os equipamentos de operação PBN, a qualificação necessária
  e o pessoal autorizado para executar a manutenção e liberação da aeronave.

  5.4.5.2 O MGM deverá conter ainda os procedimentos para notificar a tripulação caso um equipamento
  inoperante ou em funcionamento não regular impossibilite, total ou parcialmente, a operação
  PBN.'
