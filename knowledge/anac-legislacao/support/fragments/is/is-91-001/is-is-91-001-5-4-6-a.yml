cite: 5.4.6(a)
title: 5.4.6(a)
text: 'a) documento de solicitação formal: é o documento submetido à ANAC que formaliza as
  intenções do operador em obter a aprovação para a realização das operações PBN. O envio
  deste documento, juntamente com o restante da documentação pertinente à operação que se
  pretende realizar, e sua aceitação por parte desta Agência, constituem a fase 2 do processo
  de aprovação. Um modelo de solicitação formal, que pode ser adaptado pelos operadores e
  utilizado para o estabelecimento do processo, é disponibilizado em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios.

  Para operadores regidos pelo RBAC nº 91, deve ser preenchido e enviado um Relatório Técnico
  por meio de formulário digital diretamente no sistema SEI.

  Os interessados poderão iniciar o processo de obtenção de autorização para operação PBN
  para aeronaves com reserva de marcas ou em processo de transferência de posse e/ou atualização
  de registro. Nesses casos, deverá ser apresentada documentação que vincule a aeronave ao
  futuro operador (contrato de compra/leasing etc.). A finalização do processo e a emissão
  da autorização ficará condicionada à regularização do registro da aeronave em nome do operador
  junto ao RAB.'
