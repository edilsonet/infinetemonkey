cite: 5.4.6(b)
title: 5.4.6(b)
text: 'b) Para operadores de aviação geral (regidos pelo RBAC nº 91, exceto Subparte K) que
  não realizem voos internacionais: exceto para casos de voos internacionais, serão consideradas
  autorizações específicas para operadores de aviação geral conduzirem operações RNAV 10,
  RNAV 5, RNAV 2, RNAV 1, RNP 4, RNP 2 e RNP APCH a declaração de capacidade da aeronave,
  e evidência de demonstração de conhecimentos e de proficiência dos tripulantes na execução
  de procedimentos PBN atualizados nos últimos 2 anos.'
