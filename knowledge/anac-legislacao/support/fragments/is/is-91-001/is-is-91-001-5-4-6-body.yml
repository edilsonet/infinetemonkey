title: Parecer de aprovação de aeronavegabilidade
text: '5.4.6 Parecer de aprovação de aeronavegabilidade

  5.4.6.1 A aprovação de aeronavegabilidade consiste em condição necessária, mas não suficiente
  para o usuário receber a autorização de operação para a operação pretendida. O parecer com
  a aprovação deve conter ainda a classificação dos conjuntos de sensores que atendem aos
  critérios técnicos mínimos e qualquer outra peculiaridade da operação, sempre que aplicável.
  A tabela abaixo mostra a classificação das operações divididas pelos conjuntos de sensores,
  com os respectivos códigos OACI.


  Código OACI

  Especificações de Navegação RNAV

  A1

  RNAV 10 (RNP 10)

  B2

  RNAV 5 - GNSS

  B3

  RNAV 5 - DME/DME

  B4

  RNAV 5 - VOR/DME

  B5

  RNAV 5 - INS ou IRS

  C1

  RNAV 2 - Todos os sensores

  C2

  RNAV 2 - GNSS

  C3

  RNAV 2 - DME/DME

  C4

  RNAV 2 - DME/DME/IRU

  D1

  RNAV 1 - Todos os sensores

  D2

  RNAV 1 - GNSS

  D3

  RNAV 1 - DME/DME

  D4

  RNAV 1 - DME/DME/IRU

