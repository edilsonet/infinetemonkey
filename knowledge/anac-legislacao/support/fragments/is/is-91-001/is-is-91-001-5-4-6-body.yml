  Tabela 5: relação das especificações de navegação RNP e cada código OACI correspondente.

  * Até a publicação da Revisão I desta IS a OACI não determinou o código para as operações
  RNP 2.

  ** Até a publicação da Revisão I desta IS a OACI não determinou o código para as operações
  A-RNP.

  *** Até a publicação da Revisão I desta IS a OACI não determinou o código para as operações
  RNP AR DP.

  5.5 Aprovação Operacional5.5.

  5.5.1 A comprovação da capacidade das aeronaves em executar os procedimentos PBN por si
  só não caracteriza a autorização para a execução desses procedimentos, sendo igualmente
  necessária a verificação da capacidade do operador realizar os procedimentos normais e de
  contingência associados para cada conjunto distinto de aeronaves e dispositivos relacionados
  com os quais se pretenda realizar as operações.

  5.5.2 Tendo em vista a elaboração dos procedimentos operacionais descritos no item 5.7 desta
  IS, o operador deverá apresentar para a ANAC os seguintes documentos:'
