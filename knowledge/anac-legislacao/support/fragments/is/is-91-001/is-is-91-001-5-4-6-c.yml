title: 5.4.6(c)
text: 'c) Para operadores de aviação geral (regidos pelo RBAC nº 91, exceto Subparte K), operando
  voos internacionais: será emitida uma LOA, que será válida desde que mantidas as condições
  estabelecidas por esta IS e em conformidade com a Subparte N do RBAC nº 91.'
