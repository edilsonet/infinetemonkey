title: 5.4.6(d)
text: 'd) treinamento de pilotos e despachantes de voo (DOV): os prestadores de serviço de
  transporte aéreo (aqueles que operam segundo os RBAC nº 121 e 135) e os administradores
  de programa segundo a Subparte K do RBAC nº 91 devem submeter à ANAC o programa de treinamento,
  ou sua respectiva revisão, contendo os currículos dos programas de treinamento inicial,
  recorrente e de elevação de nível, quando aplicáveis, atestando que são abordados procedimentos,
  práticas operacionais e demais aspectos de treinamento satisfatórios para a capacitação
  dos tripulantes de voo e despachantes de voo nas operações pretendidas. Não são necessários
  programas de treinamento exclusivos para operações PBN, contudo, deve ser possível identificar
  as práticas e procedimentos relativos a estas operações inseridas no programa de treinamento
  proposto. No item 5.8 desta IS é apresentado o conteúdo mínimo para a composição de um programa
  de treinamento voltado para capacitação em operações PBN. De modo complementar ao item 5.8
  desta IS, nos apêndices desta IS correspondentes a cada distinta especificação PBN são listados
  os tópicos mínimos que devem constar nos programas de treinamento para a execução das referidas
  operações;'
