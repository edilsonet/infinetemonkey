title: 5.4.6(e)
text: 'e) declaração de familiarização com os procedimentos e práticas: para a execução das
  operações PBN, os operadores da aviação geral (operando de acordo com o estabelecido pelo
  RBAC nº 91, exceto Subparte K) deverão declarar no relatório técnico que a tripulação sempre
  estará familiarizada com os procedimentos e práticas descritas nos itens 5.7 e 5.8 desta
  IS e, de modo complementar, aos procedimentos operacionais e programas de treinamento específicos
  para cada uma das distintas operações, conforme descrito nos apêndices correspondentes desta
  IS. Se aplicável, os operadores também devem estar familiarizados com o conteúdo do treinamento
  direcionado às operações PBN que utilizam o GNSS como sensor de navegação, conforme descrito
  no item 5.8.8 desta IS. Os treinamentos específicos referentes aos procedimentos SID, STAR,
  RNP APCH e Baro VNAV deverão constar na declaração referenciada anteriormente, e caso não
  tenham sido realizados em simulador de voo, poderão ser realizados em aeronave desde que
  em condições meteorológicas de voo visual;'
