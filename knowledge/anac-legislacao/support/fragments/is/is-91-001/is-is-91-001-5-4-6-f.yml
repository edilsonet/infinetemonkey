cite: 5.4.6(f)
title: 5.4.6(f)
text: 'f) manuais de operações e listas de verificação: os prestadores de serviço de transporte
  aéreo (aqueles que operam segundo os RBAC nº 121 e 135) e os administradores de programa
  segundo a Subparte K do RBAC nº 91 ) devem elaborar e/ou revisar checklists e documentos,
  tais como o manual geral de operações (MGO) e os procedimentos operacionais padronizados
  (SOP), de modo a refletir os procedimentos, políticas e práticas operacionais desenvolvidas
  para as operações PBN. Operadores da aviação geral (RBAC nº 91, exceto Subparte K) devem
  utilizar listas de verificação e manuais (tais como o AFM) apropriados;'
