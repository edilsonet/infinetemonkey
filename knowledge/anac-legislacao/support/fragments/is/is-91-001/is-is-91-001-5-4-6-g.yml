cite: 5.4.6(g)
title: 5.4.6(g)
text: 'g) lista de equipamentos mínimos (MEL): Caso o operador possua uma MEL, ela deve ser
  adequada e submetida para aprovação da ANAC refletindo as condições requeridas para o despacho
  de suas aeronaves com relação aos equipamentos utilizados nos procedimentos PBN pretendidos.
  A MEL deve contemplar a degradação das operações PBN pelo menos nos equipamentos listados
  no formulário de capacidade da aeronave, mas havendo lista mais extensa gerada pelo fabricante
  da aeronave, todos os equipamentos incluídos nessa lista devem constar da MEL;'
