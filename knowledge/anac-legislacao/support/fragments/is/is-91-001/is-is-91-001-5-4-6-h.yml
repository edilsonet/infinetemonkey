title: 5.4.6(h)
text: 'h) programa de manutenção: o operador deverá desenvolver um programa de manutenção
  de forma a garantir que os sistemas de navegação ao longo de sua operação continuem, no
  mínimo, mantendo os padrões exigidos na certificação. Maiores informações sobre o programa
  de treinamento do pessoal de manutenção e o MGM podem ser obtidas consultando o item 5.4
  desta IS;'
