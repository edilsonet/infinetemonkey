title: 5.4.6(i)
text: 'i) declaração de fornecedor certificado como provedor da base de dados: exceto para
  operações RNAV 10 (RNP 10) e RNAV 5, quando uma base de dados estiver sendo utilizada, uma
  declaração de fornecedor certificado desta base de dados de navegação deverá ser fornecida,
  assegurando que o provedor da base de dados contratado pelo operador seja uma entidade certificada
  para o fornecimento de tais informações; e'
