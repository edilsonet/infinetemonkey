cite: 5.4.6(j)
title: 5.4.6(j)
text: 'j) Programa de validação de dados de navegação: exceto para operações RNAV 10 (RNP
  10) e RNAV 5, um programa de validação de dados de navegação deverá ser formulado pelo operador
  assegurando a compatibilidade com os modelos dos sistemas aviônicos aos quais se destinam
  e que a utilização destes dados resulte em rotas e em procedimentos consistentes com aqueles
  publicados pelas autoridades competentes e atualmente em vigor.

  5.5.3 Tendo finalizada a análise documental, a ANAC poderá solicitar ao operador, em interesse
  da segurança operacional, atividades de demonstrações e inspeções, constituindo a fase 4
  do processo, conforme mencionado no item 5.2.5 desta IS.

  5.5.4 Ao término do processo de aprovação, tendo o operador demonstrado plena capacidade
  em realizar as operações PBN solicitadas, de acordo com o estabelecido por esta IS, a ANAC
  emitirá a autorização para a condução de tais operações.'
