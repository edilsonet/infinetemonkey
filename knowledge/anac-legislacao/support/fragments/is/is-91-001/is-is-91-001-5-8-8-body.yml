text: '5.8.8 Operações PBN utilizando o GNSS

  5.8.8.1 Para alguns pilotos, o sistema GNSS pode representar a primeira experiência com
  sistemas aviônicos que requerem programação ao invés da simples seleção de frequências.
  Tal fato associado à crescente variedade de dispositivos desta natureza aponta para a necessidade
  de se capacitar a tripulação na operação dos sistemas GNSS.

  5.8.8.2 Não são necessários programas de treinamento exclusivos para operações GNSS, contudo,
  deve ser possível identificar as práticas e procedimentos relativos a estas operações inseridas
  no programa de treinamento proposto.

  5.8.8.3 De acordo com exposto nos itens anteriores e com o intuito de harmonizar os tópicos
  mínimos que os currículos de treinamento para tripulantes que utilizam sistemas PBN tendo
  o GNSS como meio de navegação devem incluir, são indicados os seguintes itens:'
