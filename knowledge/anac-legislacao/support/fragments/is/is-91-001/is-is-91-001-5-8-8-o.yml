  5.9 Base de dados de navegação

  5.9.1 A informação armazenada na base de dados de navegação define a orientação lateral
  e longitudinal da aeronave para as operações PBN. As atualizações das bases de dados de
  navegação são realizadas a cada 28 dias, segundo o ciclo AIRAC. Os dados de navegação utilizados
  em cada atualização são críticos para a integridade das rotas e procedimentos PBN que serão
  executados.

  5.9.2 Para a execução das operações RNAV 10 (RNP 10) e RNAV 5 não é mandatória a utilização
  de bancos de dados de navegação. Já para os operadores que pretendam voar rotas ou procedimentos
  baseados em RNAV 1 e 2, RNP 4, RNP 1 e 2, RNP APCH (com ou sem baro-VNAV), devem atentar-se
