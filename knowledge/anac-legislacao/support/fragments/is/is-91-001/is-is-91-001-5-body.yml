title: Treinamento periódico
text: '5. Treinamento periódico

  5.1 No currículo de treinamento recorrente o operador deve prover treinamento e avaliação
  levando em consideração aspectos relevantes dos procedimentos RNP AR APCH.

  5.2 Cada piloto deve ser avaliado durante a execução de pelo menos um procedimento RNP AR
  APCH na função de PF e um procedimento na função PM, das quais uma aproximação resulte num
  procedimento de aproximação perdida.'
