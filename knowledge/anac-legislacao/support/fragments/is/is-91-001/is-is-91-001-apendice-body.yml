  Tabela 3: relação das operações PBN especificadas nos apêndices desta IS.

  5.1.16 Embora as distintas operações PBN possuam aspectos em comum, o cumprimento ao estabelecido
  pela presente IS, por parte do operador, deve ser satisfeito individualmente para cada uma
  das especificações para as quais o operador desejar autorização para operação. De tal maneira,
  exceto quando explicitamente declarado, a demonstração de conformidade com uma determinada
  especificação de navegação não garante a conformidade com as demais.

  5.1.17 Operações de aproximação GNSS com aprimoramento de sinal (signal augmentation), tais
  como SBAS e GBAS, não são cobertas por esta IS. O mesmo se aplica às operações LP e LPV
  cujo funcionamento se vale do mesmo princípio de aprimoramento do sinal de posicionamento
  proveniente dos satélites.

  5.2 Processo de Aprovação PBN'
