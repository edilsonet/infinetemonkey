family: '91'
section_id: C1.2
section_title: O termo RNP 10 foi inicialmente utilizado para designar esta especificação
  de navegação, que foi uma das primeiras do atual conceito PBN a ter sido implementada, de
  forma que, hoje em dia, existem diversos documentos como autorizações operacionais, certificações
  de equipamentos e definições de rotas e espaços aéreos já publicados que remetem ao termo.
  Embora leve o nome ‘RNP’, o RNP 10 não requer um sistema de monitoramento e alerta da informação
  de posicionamento da aeronave.
