section_title: Apesar de ‘RNAV 10’ ser o termo recomendado pela OACI e adotado nesta IS, não
  é esperado que o designador ‘RNP 10’ deixe de ser utilizado para a designação de espaços
  aéreos e aprovação de aeronaves. De tal forma, deve ser observada a equivalência entre as
  denominações, contudo é recomendada, sempre que possível, a utilização do termo ‘RNAV 10’.
