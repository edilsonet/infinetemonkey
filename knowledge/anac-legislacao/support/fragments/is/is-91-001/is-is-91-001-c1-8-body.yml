section_title: O RNAV 10 e o RNP 4 são as especificações de navegação aplicáveis às operações
  em áreas oceânicas e remotas. Outras especificações RNAV e RNP são aplicáveis para operações
  em rota, áreas terminais e em aproximações, conforme pode ser observado na Tabela 2 desta
  IS.
