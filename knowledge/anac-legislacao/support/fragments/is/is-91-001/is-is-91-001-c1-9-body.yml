section_title: A operação em rotas RNAV 10 em áreas oceânicas ou remotas sem o apoio de rádio-auxílios
  à navegação requer que a navegação da aeronave seja baseada em sistemas de longo alcance
  (LRNS - Long-Range Navigation Systems) suportados por sistemas de navegação inercial e/ou
  GNSS.
