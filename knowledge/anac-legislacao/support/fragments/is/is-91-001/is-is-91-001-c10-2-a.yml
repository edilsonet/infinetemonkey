section_id: C10.2
section_title: 'Caso as atualizações manuais não sejam explicitamente aprovadas, as mesmas
  não são permitidas em operações RNAV 10 (RNP 10). A atualização manual é aceitável para
  operações em espaços aéreos onde o RNP 10 é aplicado, desde que:'
subsection_id: a
cite: C10.2(a)
title: C10.2(a)
text: a) os procedimentos para atualização manual sejam avaliados caso a caso e aprovados
  pela ANAC. (O Apêndice F da Order 8400.12B do FAA descreve um método para a aprovação de
  procedimentos de atualizações manuais para operações RNP 10 e pode ser utilizado como referência);
