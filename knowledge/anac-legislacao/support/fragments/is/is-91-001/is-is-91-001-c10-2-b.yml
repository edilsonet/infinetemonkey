section_title: 'Caso as atualizações manuais não sejam explicitamente aprovadas, as mesmas
  não são permitidas em operações RNAV 10 (RNP 10). A atualização manual é aceitável para
  operações em espaços aéreos onde o RNP 10 é aplicado, desde que:'
subsection_id: b
cite: C10.2(b)
title: C10.2(b)
text: b) o operador demonstre que os procedimentos de atualização e o treinamento correspondente
  incluem medidas de conferência cruzada (cross-checks) visando prevenir a ocorrência de erros
  humanos; e
