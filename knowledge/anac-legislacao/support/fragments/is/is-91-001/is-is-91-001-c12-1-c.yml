section_id: C12.1
section_title: 'A especificação de navegação RNP 10 requer que as aeronaves que operam em
  áreas oceânicas ou remotas estejam equipadas com ao menos dois sistemas de navegação de
  longo alcance (LRNS) independentes e em serviço, compostos por um sistema de navegação inercial
  (INS), um sistema de referência inercial/sistema de gestão de voo (IRS/FMS) ou um sistema
  mundial de navegação por satélite (GNSS). São elegíveis:'
subsection_id: c
cite: C12.1(c)
title: C12.1(c)
text: c) as aeronaves equipadas com duplo INS ou IRU aprovadas para operações com especificações
  mínimas de desempenho de navegação (MNPS), ou que cumpram com a AC 20-130A ou Order 8400.12A;
