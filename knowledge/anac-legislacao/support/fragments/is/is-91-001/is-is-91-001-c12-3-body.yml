section_title: A constatação da existência da declaração do fabricante ou detentor de CST
  mencionada no item C12.1 não é condição suficiente para a aprovação da aeronave. Deve-se
  checar se a aeronave está configurada conforme documento do fabricante no que diz respeito
  aos itens que afetam a operação RNAV 10.
