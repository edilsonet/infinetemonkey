family: '91'
section_id: C5.1
section_title: No ponto de entrada em espaço aéreo oceânico deve-se verificar se os dois sistemas
  de navegação de longo alcance necessários ao atendimento dos critérios estabelecidos para
  operação em espaço aéreo RNAV 10 estão operando corretamente. Se este não for o caso, os
  pilotos devem considerar rotas alternativas que não demandem aprovação RNAV 10 ou ainda
  considerar desvio/retorno para reparo do sistema.
