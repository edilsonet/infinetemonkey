id: is-is-91-001-c5-2-body
kind: is
document: is-91-001
family: '91'
section_id: C5.2
section_title: Antes de ingressar em espaço aéreo oceânico, deve-se verificar a posição da
  aeronave com a maior exatidão possível utilizando auxílios externos à navegação. Tal situação
  pode demandar verificações utilizando sensores DME ou VOR para determinar os erros do sistema
  de navegação por meio da comparação das informações de posição atual e aquelas apresentadas
  pela aeronave. Se forem necessárias atualizações do sistema, os respectivos procedimentos
  devem ser seguidos com o auxílio de listas de verificações pertinentes.
