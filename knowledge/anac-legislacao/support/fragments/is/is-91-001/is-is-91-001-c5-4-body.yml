section_id: C5.4
section_title: Durante as operações RNAV 10, os pilotos devem utilizar um indicador de desvio
  lateral, diretor de voo ou piloto automático em modo de navegação lateral. É esperado que
  os pilotos mantenham os centros das trajetórias, conforme orientado pelos indicadores de
  desvio lateral e/ou diretor de voo, a menos que seja diferentemente autorizado pelo ATC
  ou esteja em condições de emergência. Em condições normais de operação, o erro técnico de
  voo (ou cross-track error, que é a diferença entre a trajetória computada pelo sistema de
  navegação RNAV e a posição da aeronave relativa a essa trajetória) deve ser limitado a ±1/2
  da precisão de navegação associada à rota (para o RNAV 10 esse valor equivale a ±5 NM).
  Pequenos desvios deste padrão (por exemplo, overshoots e undershoots) são aceitáveis durante
  e imediatamente após curvas em rota até o valor máximo de uma vez o valor da precisão de
  navegação (para o RNAV 10 esse valor equivale a ±10 NM).
