id: is-is-91-001-c8-1-body
kind: is
document: is-91-001
family: '91'
section_id: C8.1
section_title: Operadores podem estender sua capacidade de navegação RNAV 10 por meio de atualizações
  em rota. Esta seção pontua alguns dos critérios que devem ser observados nas situações em
  que os operadores pleitearem extensão dos tempos limites de navegação associados às operações
  RNAV 10. Neste contexto, por conta da unicidade de cada solicitação desta natureza, convém
  destacar que análises para extensão dos tempos limite de navegação devem ser feitas caso
  a caso, e por consequência, os processos correspondentes podem ser consideravelmente mais
  morosos do que um processo de aprovação RNAV 10 convencional.
