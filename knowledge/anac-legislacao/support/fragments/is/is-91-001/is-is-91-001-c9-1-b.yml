section_title: 'Uma atualização automática consiste em qualquer procedimento de atualização
  que não requeira que a tripulação técnica insira as coordenadas manualmente. Atualizações
  automáticas da posição são aceitáveis desde que:'
subsection_id: b
cite: C9.1(b)
title: C9.1(b)
text: b) a tripulação técnica tenha o conhecimento dos procedimentos de atualização automática
  e o efeito destas atualizações na solução de navegação.
