section_title: Um procedimento aceitável para atualização automática pode ser utilizado como
  base para a emissão de uma autorização RNAV 10 com tempo estendido, de acordo com as informações
  apresentadas pelo operador à ANAC. Estas informações devem apresentar de maneira clara a
  exatidão das atualizações e o efeito de tais atualizações na capacidade de navegação para
  o restante do voo previsto.
