section_title: Diversos documentos nacionais e internacionais fazem referência ao termo B-RNAV
  (Basic Area Navigation), utilizado originalmente pela EASA e que corresponde a métodos de
  navegação de área com critérios mínimos de desempenho iguais ou superiores àqueles estabelecidos
  para RNAV 5. De tal forma, para fins de padronização de nomenclatura, exceto quando explicitamente
  especificado, o designador B-RNAV deve ser entendido e referenciado como RNAV 5.
