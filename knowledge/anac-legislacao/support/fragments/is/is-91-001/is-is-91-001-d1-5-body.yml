id: is-is-91-001-d1-5-body
kind: is
document: is-91-001
family: '91'
section_id: D1.5
section_title: Não é requerido que os sistemas de navegação para operações RNAV 5 possuam
  um modo de alerta à tripulação na ocorrência de erros excessivos de posicionamento, assim
  como não é mandatória a existência de mais de um sistema RNAV. Contudo, deve ser considerada
  a possibilidade de perda da capacidade de navegação RNAV e, em tais ocasiões, a aeronave
  deve ser capaz de prover um método alternativo de navegação.
