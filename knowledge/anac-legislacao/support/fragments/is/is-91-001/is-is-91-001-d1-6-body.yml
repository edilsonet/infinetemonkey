family: '91'
section_id: D1.6
section_title: Por conta dos sensores que podem utilizados garantindo a precisão necessária
  para operações RNAV 5, uma base de dados de navegação não faz parte das funcionalidades
  mandatórias, o que pode demandar a inserção manual de waypoints e consecutivamente acarretar
  um aumento da carga de trabalho da tripulação e a possibilidade de inserção de dados errôneos.
  Tais limitações, associadas ao desvio lateral de cinco milhas náuticas permitido para as
  operações RNAV 5 fazem com a estas operações sejam restritas à fase de voo em rota.
