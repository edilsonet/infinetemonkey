id: is-is-91-001-d3-6-body
kind: is
document: is-91-001
family: '91'
section_id: D3.6
section_title: Em complemento ao item anterior, é esperado que os bancos de dados de navegação
  estejam válidos durante o decorrer dos voos. Para situações em que o ciclo AIRAC estiver
  programado para mudar durante um determinado voo, procedimentos devem ser estabelecidos
  para assegurar a acurácia dos dados de navegação, incluindo a adequabilidade dos auxílios
  à navegação utilizados para definição das rotas do voo. Tradicionalmente, tal situação tem
  sido comprovada por meio da comparação dos dados eletrônicos com o conteúdo correspondente
  das respectivas versões impressas.
