id: is-is-91-001-d4-1-body
kind: is
document: is-91-001
family: '91'
section_id: D4.1
section_title: Operadores e pilotos somente podem solicitar rotas RNAV 5 se o operador tiver
  obtido junto à ANAC a autorização para condução destas operações e a tripulação tiver realizado
  todo o treinamento correspondente. Se aeronave, operador ou tripulação não cumprirem com
  os critérios estabelecidos por esta IS para a condução das operações RNAV 5, com a respectiva
  aprovação, e receberem autorização do controle para conduzir um procedimento RNAV 5, o piloto
  deve comunicar ao ATC sobre sua incapacidade em realizar o procedimento e requisitar instruções
  para realização de procedimento alternativo.
