section_title: Durante o voo, a tripulação deve se assegurar que a precisão do sistema de
  navegação é condizente com os níveis necessários para execução de operações RNAV 5. Em algumas
  rotas isto pode ser realizado por meio de verificações que confrontem a informação de posicionamento
  fornecida pelo sistema RNAV e a informação proveniente de auxílios à navegação convencionais.
