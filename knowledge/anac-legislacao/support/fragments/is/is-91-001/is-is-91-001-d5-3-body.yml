section_title: As operações devem transcorrer de acordo com as instruções do Controle de Tráfego
  Aéreo. Entretanto, quando tal situação não for possível, uma autorização revisada deve ser
  solicitada ao ATC, que pode determinar a reversão para métodos alternativos (por exemplo,
  navegação VOR/DME).
