section_title: 'Uma aeronave pode ser considerada elegível para operações RNAV 5, se o AFM
  ou suplemento do AFM, ou especificação da aeronave (TCDS para as aeronaves isentas da certificação
  brasileira), ou POH contiver a declaração do fabricante ou do detentor do CST que a aeronave
  está conforme as especificações técnicas de um dos documentos listados abaixo:'
subsection_id: a
cite: D6.1(a)
title: D6.1(a)
text: 'a) FAA: AC 90-96A, AC 90-45A, AC 20-121A, AC 20-130A, AC 20-138 ( ) ou AC 25-15;'
