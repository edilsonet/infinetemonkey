section_title: Os regulamentos do JAA e FAA trazem critérios funcionais bastante similares,
  contudo existem diferenças entre estes documentos. Diante disso, a OACI, na tentativa de
  harmonizar estes critérios já existentes, elaborou o conteúdo relativo à especificação RNAV
  1 e 2 do DOC 9613 - Manual PBN. O DOC 9613 constitui a referência primária utilizada na
  confecção deste Apêndice.
