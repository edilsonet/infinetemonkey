text: 'E1.5 Embora estejam realizando esforços no sentido de harmonizar a especificação P-RNAV
  de acordo com o conceito RNAV 1 estabelecido pela OACI, os Estados europeus continuam utilizando
  o conceito e a terminologia P-RNAV. De tal forma, diante da existência de diversas publicações
  e autorizações já emitidas que fazem referência ao termo e com o intuito de padronizar a
  nomenclatura, sempre que possível, o designador P-RNAV deve ser entendido e referenciado
  como RNAV 1.

  Nota: embora os conceitos P-RNAV e RNAV 1 requeiram a mesma precisão lateral de forma a
  suportar as operações, o P-RNAV não satisfaz na íntegra todos os critérios da especificação
  RNAV 1. Assim, quando pertinente, as diferenças entre o P-RNAV e o RNAV 1 devem ser avaliadas
  (possivelmente comparando as especificações constantes na TGL - 10 para P-RNAV e os aqui
  estabelecidos para RNAV 1).'
