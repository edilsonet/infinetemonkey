section_title: Embora estejam realizando esforços no sentido de harmonizar a especificação
  P-RNAV de acordo com o conceito RNAV 1 estabelecido pela OACI, os Estados europeus continuam
  utilizando o conceito e a terminologia P-RNAV. De tal forma, diante da existência de diversas
  publicações e autorizações já emitidas que fazem referência ao termo e com o intuito de
  padronizar a nomenclatura, sempre que possível, o designador P-RNAV deve ser entendido e
  referenciado como RNAV 1.
