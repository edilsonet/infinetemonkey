id: is-is-91-001-e1-7-body
kind: is
document: is-91-001
family: '91'
section_id: E1.7
section_title: Valendo-se da proximidade dos critérios entre as especificações RNAV 1 e 2,
  conforme mencionado no item anterior, e com o intuito de harmonizar os designativos utilizados
  para as operações PBN, conforme orientação da OACI, a presente IS apresenta somente os critérios
  para a obtenção da autorização ‘RNAV 1 e 2’. Ou seja, um processo único deverá ser formalizado
  e ao término deste, tendo o operador demonstrado atendimento a todas as exigências, uma
  única autorização será emitida permitindo ao solicitante realizar tanto as operações rotuladas
  como RNAV 1 quanto aquelas definidas como sendo RNAV 2. A obtenção de autorizações individuais
  (somente ‘RNAV 1’ ou somente ‘RNAV 2’), de acordo com os critérios desta IS, não são aplicáveis.
