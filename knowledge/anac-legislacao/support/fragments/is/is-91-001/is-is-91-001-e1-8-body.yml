section_title: As especificações RNAV 1 e 2 são aplicáveis em rotas ATS, saídas e chegadas
  padrão por instrumentos (SIDs e STARs), podendo ainda serem empregadas em procedimentos
  de aproximação até o fixo de aproximação final. Estas informações devem ser observadas e
  respeitadas de acordo com o estabelecido pelo DECEA nas cartas de navegação e procedimentos
  ou em outras publicações aplicáveis.
