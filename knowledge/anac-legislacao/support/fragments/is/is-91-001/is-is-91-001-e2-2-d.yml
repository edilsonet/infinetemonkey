section_title: 'Procedimentos operacionais gerais para operações RNAV 1 e 2:'
subsection_id: d
cite: E2.2(d)
title: E2.2(d)
text: d) sempre que possível, rotas RNAV 1 ou RNAV 2 devem ser carregadas diretamente do banco
  de dados de navegação em sua totalidade, ao invés da inserção no plano de voo de waypoints
  individuais provenientes da base de dados. Entretanto, é permitida a seleção e inserção
  individual de waypoints ou fixos oriundos da base de dados de navegação, desde que todos
  os fixos ao longo da rota publicada a ser voada estejam inseridos. Além disso, a rota pode
  ser subsequentemente modificada por meio da inserção ou remoção de waypoints específicos
  em virtude de solicitações do controle de tráfego aéreo. Da mesma forma como descrito no
  item anterior, a criação de novos waypoints não é permitida;
