section_title: 'Quando o GNSS constituir o meio primário de navegação:'
subsection_id: b
cite: E2.3(b)
title: E2.3(b)
text: b) para situações em que houver a previsão de ausência contínua dos níveis apropriados
  de detecção de falha dos sinais de satélite superior a cinco (5) minutos em qualquer parte
  da operação RNAV 1 ou RNAV 2 o plano voo deve ser revisado e algumas ações podem ser consideradas
  de forma a tentar garantir o monitoramento adequado da informação de posicionamento proveniente
  dos sensores GNSS. Dentre estas ações, é possível citar a utilização de rotas ou procedimentos
  alternativos, a alteração do horário previsto de partida ou chegada, ou até mesmo o cancelamento
  da operação; e
