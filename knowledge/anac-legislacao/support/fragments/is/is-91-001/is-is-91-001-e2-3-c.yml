title: E2.3(c)
text: 'c) quando o DME constituir o sensor primário de navega&ccccedil;ão, a disponibilidade
  de eventuais DME críticos deve ser conferida por meio de NOTAM. Deverá ser verificada também
  a capacidade de navegação (potencialmente para um destino alternado) no caso de falha de
  um DME crítico durante voo.

  E3. CRITÉRIOS ESPECÍFICOS PARA PROCEDIMENTOS DE SAÍDA PADRÃO POR INSTRUMENTOS (SID) RNAV
  1 E 2'
