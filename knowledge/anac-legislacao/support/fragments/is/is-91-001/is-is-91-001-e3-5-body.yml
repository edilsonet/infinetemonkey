section_id: E3.5
section_title: Aeronaves DME/DME/IRU. Pilotos de aeronaves, sem GNSS, utilizando sistemas
  RNAV DME/DME com entrada de sensor inercial (DME/DME/IRU), devem assegurar a confirmação
  da informação de posição do sistema de navegação da aeronave, dentro de 1000 ft (304 m /
  0.17 NM) a partir de uma posição conhecida, no ponto de partida da corrida de decolagem.
  Tal condição é usualmente satisfeita por meio do uso de uma função de atualização de pista
  manual ou automática. Um mapa de navegação também pode ser utilizado para confirmar a posição
  da aeronave desde que os procedimentos dos pilotos e a resolução da tela permitam o atendimento
  ao critério de tolerância de 1000 ft (304 m / 0.17 NM).
