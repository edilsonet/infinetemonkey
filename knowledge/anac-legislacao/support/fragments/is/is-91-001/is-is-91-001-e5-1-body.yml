id: is-is-91-001-e5-1-body
kind: is
document: is-91-001
family: '91'
section_id: E5.1
section_title: O piloto deve notificar o controle de tráfego aéreo na ocasião de perda da
  capacidade de navegação RNAV 1 e 2, juntamente com o curso de ação proposto. Se por alguma
  razão não for possível atender os critérios de desempenho requeridos de RNAV para a rota
  ou procedimento previsto, os pilotos devem informar ao controle de tráfego aéreo o mais
  rapidamente possível. A perda da capacidade RNAV inclui qualquer falha ou evento que faça
  com que a aeronave não mais consiga atender aos critérios técnicos mínimos para o procedimento
  ou rota RNAV 1 ou 2.
