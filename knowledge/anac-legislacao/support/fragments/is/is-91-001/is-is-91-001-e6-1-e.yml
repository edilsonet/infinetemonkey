title: E6.1(e)
text: e) os equipamentos de navegação requeridos para a condução de operações em rota, saídas
  e chegadas padronizadas (SIDs e STARs) RNAV 1 (como por exemplo, DME/DME, DME/DME/IRU e
  GNSS);
