section_title: 'Além dos tópicos destacados no item 5.8 desta IS, de forma complementar, o
  operador deve atentar para abordar e incorporar em seu programa de treinamento os itens
  apresentados abaixo:'
subsection_id: f
cite: E6.1(f)
title: E6.1(f)
text: f) fraseologia. A execução de alguns procedimentos RNAV pode incorporar a utilização
  de fraseologias específicas, como, por exemplo, o uso da terminologia ‘autorizado via’,
  ou termos equivalentes. Os pilotos devem estar familiarizados com o correto uso da terminologia
  e procedimentos, conforme estabelecido pelo DECEA;
