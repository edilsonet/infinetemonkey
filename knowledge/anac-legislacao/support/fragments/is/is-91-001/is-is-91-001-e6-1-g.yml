section_id: E6.1
section_title: 'Além dos tópicos destacados no item 5.8 desta IS, de forma complementar, o
  operador deve atentar para abordar e incorporar em seu programa de treinamento os itens
  apresentados abaixo:'
subsection_id: g
cite: E6.1(g)
title: E6.1(g)
text: 'g) informações específicas sobre os sistemas RNAV:

  i. o significado e pertinência das descontinuidades de rota, assim como os procedimentos
  relacionados da tripulação;

  ii. procedimentos da tripulação compatíveis com a operação;

  iii. tipos de sensores de navegação utilizados pelo sistema RNAV para a condução das operações
  RNAV 1 e RNAV 2 e os princípios de priorização/seleção destes sensores; e

  iv. compreensão da configuração da aeronave e condições operacionais requeridas para suportar
  as operações RNAV 1 e 2, incluindo a seleção apropriada da escala do CDI (escala do display
  de desvio lateral);'
