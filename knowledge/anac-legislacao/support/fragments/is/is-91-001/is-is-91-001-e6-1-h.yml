document: is-91-001
family: '91'
section_id: E6.1
section_title: 'Além dos tópicos destacados no item 5.8 desta IS, de forma complementar, o
  operador deve atentar para abordar e incorporar em seu programa de treinamento os itens
  apresentados abaixo:'
subsection_id: h
cite: E6.1(h)
title: E6.1(h)
text: 'h) procedimentos operacionais relacionados aos sistemas RNAV, quando aplicável, incluindo
  o modo de realizar as seguintes ações:

  i. selecionar a SID ou STAR apropriada para pista ativa em uso e estar familiarizado com
  os procedimentos relacionados a eventuais mudanças de procedimentos;

  ii. voar sob vetoração radar e regressar a uma rota/procedimento RNAV a partir do modo “heading”;

  iii. determinar o erro/desvio lateral. Mais especificamente, os valores máximos de desvio
  lateral permitidos para a condução dos procedimentos RNAV 1 e 2 devem ser compreendidos
  e respeitados;

  iv. solucionar as descontinuidades de rota (inserir e apagar/eliminar eventuais descontinuidades);

  v. remover e re-selecionar sensores de navegação;

  vi. confirmar a exclusão de um auxílio à navegação específico ou um determinado tipo de
  auxílio à navegação, quando requerido;

  vii. realizar deslocamentos horizontais paralelos (parallel offset), se esta capacidade
  existir. Os pilotos devem ter ciência sobre a forma de aplicação dos deslocamentos, as funcionalidades
  relacionadas dos sistemas RNAV e a necessidade de informar ao ATC se esta funcionalidade
  não estiver disponível;

  viii. alterar o aeródromo de chegada e o aeródromo de alternativa; e

  ix. realizar funções de espera RNAV.

  E7. CRITÉRIOS DE AERONAVEGABILIDADE'
