section_id: E7.1
section_title: 'Uma aeronave pode ser considerada elegível para operações RNAV 1 e 2, se o
  AFM ou suplemento do AFM ou especificação da aeronave (TCDS para as aeronaves isentas da
  certificação brasileira) ou POH contiver a declaração do fabricante ou do detentor do CST
  que a aeronave está conforme um dos regulamentos listados abaixo:'
subsection_id: c
cite: E7.1(c)
title: E7.1(c)
text: c) aeronaves com sistema multissensor que cumprem com a AC 20-130A ou AC 20-138 (Revisão
  B ou superior);
