family: '91'
section_id: F1.2
section_title: O RNP 4 foi desenvolvido para operações em áreas oceânicas ou remotas e, dessa
  maneira, não pressupõe a disponibilidade de infraestrutura terrestre de auxílios à navegação.
  O GNSS é o sensor de navegação primário que suporta o RNP 4, seja por meio de equipamentos
  GNSS stand-alone ou como sensores GNSS componentes de um sistema multissensor.
