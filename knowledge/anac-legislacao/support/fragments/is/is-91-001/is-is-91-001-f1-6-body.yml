family: '91'
section_id: F1.6
section_title: Esta IS não aborda requisitos de comunicação ou de vigilância relacionados
  aos serviços de tráfego aéreo que podem ser especificados para uma determinada operação
  em rota ou em uma área em particular. Tais requisitos podem estar especificados em outros
  documentos, como no DOC 7030 - Regional Supplementary Procedures, nas publicações de informações
  aeronáuticas (AIPs) e em demais publicações do DECEA.
