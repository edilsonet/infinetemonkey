section_title: 'Os procedimentos mencionados no item anterior são de aplicação geral em áreas
  de operações oceânicas e continentais remotas. Na elaboração destes procedimentos, é esperado
  que, no mínimo, os seguintes aspectos sejam abordados:'
subsection_id: a
cite: F6.2(a)
title: F6.2(a)
text: 'a) procedimentos específicos para contingências em voo em espaço aéreo oceânico: procedimentos
  gerais, procedimentos estabelecidos para uma área de operação específica (por exemplo, Atlântico
  Sul (SAT), Pacífico, etc.) e outras medidas aplicadas a operações ETOPS, quando aplicáveis;'
