section_title: 'A especificação de navegação RNP 4 requer que as aeronaves que operam em áreas
  oceânicas ou remotas estejam equipadas com ao menos dois sistemas de navegação de longo
  alcance (LRNS) independentes e em serviço, especificamente sistemas GNSS para operações
  RNP 4. São elegíveis:'
subsection_id: b
cite: F8.1(b)
title: F8.1(b)
text: b) as aeronaves com sistemas multissensores que cumprem a AC 20-130A, AC 20-138 (Revisão
  B ou superior) ou documentos equivalentes; ou
