section_id: G1.3
section_title: O GNSS é o meio primário de navegação que suporta o RNP 1. Embora sistemas
  DME/DME sejam capazes de atingir a precisão necessária para a execução de operações RNP
  1, esta especificação de navegação é destinada principalmente para ambientes onde a infraestrutura
  DME não é capaz de suportar o desempenho de navegação requerido para a navegação DME/DME.
  O aumento da complexidade de análises e requisitos da infraestrutura DME necessários para
  garantir a segurança em operações RNP 1 indicam que não é praticável ou atrativa a adoção
  desta especificação de navegação utilizando este tipo de combinação de sensores.
