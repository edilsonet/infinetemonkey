id: is-is-91-001-g3-5-body
kind: is
document: is-91-001
family: '91'
section_id: G3.5
section_title: Aeronaves equipadas com sensores GNSS. Quando utilizando GNSS, a aquisição
  do sinal deve ser confirmada antes do início da decolagem. Para aeronaves que utilizam equipamentos
  TSO-C129a, o aeroporto de origem deve ser carregado no plano de voo de forma a fornecer
  monitoramento e sensibilidade adequados ao sistema de navegação. Para aeronaves que utilizam
  aviônicos TSO-C145 ( ) / C146 ( ), se a decolagem tiver início em um waypoint na própria
  pista, então o aeroporto de origem não necessita estar carregado no plano de voo para prover
  o monitoramento e sensibilidade adequados. Caso a SID RNP 1 se estenda além de 30 NM do
  ponto de referência do aeroporto (ARP) e estiver sendo utilizado um indicador de desvio
  lateral, a sensibilidade de fundo de escala deve ser selecionada para não ser maior que
  1 NM, até o término do procedimento da SID em questão.
