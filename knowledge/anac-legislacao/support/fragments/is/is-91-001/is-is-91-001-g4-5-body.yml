section_title: Os pilotos devem verificar se o sistema de navegação da aeronave está disponível
  e operando corretamente, com as informações corretas de pista e procedimento de chegada
  padrão (incluindo qualquer transição aplicável) devidamente inseridas no gerenciador de
  voo da aeronave e propriamente apresentadas para o(s) piloto(s).
