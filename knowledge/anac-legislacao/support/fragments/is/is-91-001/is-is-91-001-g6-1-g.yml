section_title: 'Além dos tópicos abordados no item 5.8 desta IS, o programa de treinamento
  deve prover capacitação sobre os sistemas RNP e conceitos associados suficientes para que
  os pilotos estejam familiarizados com os seguintes tópicos:'
subsection_id: g
cite: G6.1(g)
title: G6.1(g)
text: 'g) informações específicas sobre os sistemas RNP:

  i. o significado e pertinência das descontinuidades de rota, assim como os procedimentos
  relacionados da tripulação;

  ii. procedimentos da tripulação compatíveis com a operação;

  iii. tipos de sensores de navegação utilizados pelo sistema RNP e os princípios de priorização/seleção
  destes sensores; e

  iv. compreensão da configuração da aeronave e condições operacionais requeridas para suportar
  as operações RNP 1, incluindo a seleção apropriada da escala do CDI (escala do display de
  desvio lateral); e'
