family: '91'
section_id: G6.1
section_title: 'Além dos tópicos abordados no item 5.8 desta IS, o programa de treinamento
  deve prover capacitação sobre os sistemas RNP e conceitos associados suficientes para que
  os pilotos estejam familiarizados com os seguintes tópicos:'
subsection_id: h
cite: G6.1(h)
title: G6.1(h)
text: 'h) procedimentos operacionais relacionados aos sistemas RNP, quando aplicável, incluindo
  o modo de realizar as seguintes ações:

  i. selecionar a SID ou STAR apropriada para pista ativa em uso e estar familiarizado com
  os procedimentos relacionados a eventuais mudanças de procedimentos;

  ii. voar sob vetoração radar e regressar a uma rota/procedimento RNP 1 a partir do modo
  “heading”;

  iii. determinar o erro/desvio lateral. Mais especificamente, o valor máximo de desvio lateral
  permitido para a condução dos procedimentos RNP 1 deve ser compreendido e respeitado;

  iv. solucionar as descontinuidades de rota (inserir e apagar/eliminar eventuais descontinuidades);

  v. remover e re-selecionar sensores de navegação;

  vi. confirmar a exclusão de um auxílio à navegação específico ou um determinado tipo de
  auxílio à navegação, quando requerido;

  vii. realizar deslocamentos horizontais paralelos (parallel offset), se esta capacidade
  existir. Os pilotos devem ter ciência sobre a forma de aplicação dos deslocamentos, as funcionalidades
  relacionadas dos sistemas RNP e a necessidade de informar ao ATC se esta funcionalidade
  não estiver disponível;

  viii. alterar o aeródromo de chegada e o aeródromo de alternativa; e

  ix. realizar funções de espera RNAV.

  G7. CRITÉRIOS DE AERONAVEGABILIDADE'
