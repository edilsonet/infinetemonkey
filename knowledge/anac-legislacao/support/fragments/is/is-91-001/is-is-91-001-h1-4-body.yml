section_title: Operações RNP 2 em espaços aéreos remotos podem requerer considerações adicionais
  para a elegibilidade da aeronave baseadas na existência de aeródromos adequados para pouso
  ou na reversão para um meio alternativo de navegação. Portanto para áreas remotas a ANAC
  pode requerer que as aeronaves atendam aos critérios estabelecidos para as áreas continentais
  ou aos critérios estabelecidos para as áreas oceânicas/remotas.
