section_title: O RNP 2 se aplica a rotas de navegação em áreas definidas por trechos retos,
  no entanto, o RNP 2 pode ser associado a uma transição de raio fixo (fixed radius transitions
  -FRT). O item 3.20 do Anexo 1 ao Apêndice K desta IS traz orientações sobre essa especificidade.
