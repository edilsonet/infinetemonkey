section_title: Os dados de navegação a bordo devem estar vigentes e devem incluir procedimentos
  apropriados. As bases de dados de navegação devem estar vigentes durante todo o voo. Se
  o ciclo AIRAC vencer durante o voo, os operadores e os pilotos devem estabelecer procedimentos
  para assegurar a precisão dos dados de navegação e que as informações de navegação utilizadas
  sejam adequadas para definir as rotas e procedimentos previstos para o voo.
