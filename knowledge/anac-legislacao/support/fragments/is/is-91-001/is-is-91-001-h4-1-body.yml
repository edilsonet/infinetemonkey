section_title: O piloto deverá cumprir com qualquer instrução ou procedimento que o fabricante
  da aeronave ou dos aviônicos tenha identificado como necessários para satisfazer os requisitos
  de performance RNP 2. Os pilotos devem respeitar qualquer limitação do AFM ou procedimento
  operacional exigido pelo fabricante para manter a performance RNP 2.
