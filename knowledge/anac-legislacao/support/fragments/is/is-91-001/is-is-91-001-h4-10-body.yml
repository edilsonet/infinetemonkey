section_id: H4.10
section_title: Os pilotos de aeronaves com capacidade de seleção de informações RNP deveriam
  selecionar um valor de precisão de navegação de 2 NM ou menos. A seleção do valor de precisão
  de navegação deverá garantir que o sistema RNP oferecerá uma escala apropriada de desvio
  lateral que permita ao piloto monitorar o desvio lateral e cumprir com os requisitos de
  operação RNP 2.
