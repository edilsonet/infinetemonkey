section_id: H4.2
section_title: Os operadores e pilotos não devem solicitar ou apresentar rotas RNP 2 a menos
  que satisfaçam todos os critérios contidos nos documentos pertinentes ao Estado. Se uma
  aeronave não cumpre com estes critérios e recebe autorização do ATC para operar em uma rota
  RNP 2, o piloto deve notificar ao ATC que não pode aceitar a autorização e deve solicitar
  uma autorização alternativa.
