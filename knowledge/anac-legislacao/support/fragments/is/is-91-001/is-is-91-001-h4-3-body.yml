section_id: H4.3
section_title: Durante a inicialização do sistema os pilotos devem confirmar que a base de
  dados de navegação está vigente e verificar a posição correta da aeronave. Os pilotos também
  devem verificar se a rota atribuída pelo ATC foi ingressada corretamente quando a autorização
  foi recebida originalmente e em caso de um desvio de rota posterior. Os pilotos devem então
  assegurar que as sequências dos pontos de referência representados no sistema de navegação
  coincidam com a rota representada nas cartas correspondentes e rota atribuída.
