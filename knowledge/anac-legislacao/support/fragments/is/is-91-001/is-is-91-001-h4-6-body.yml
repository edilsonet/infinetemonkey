id: is-is-91-001-h4-6-body
kind: is
document: is-91-001
family: '91'
section_id: H4.6
section_title: 'Para as rotas RNP 2, os pilotos devem utilizar um indicador de desvio lateral,
  diretor de voo, ou piloto automático em modo de navegação lateral. Os pilotos de aeronaves
  com uma apresentação de desvio lateral devem assegurar-se que a escala de desvio lateral
  é adequada para a precisão de navegação que corresponde à rota (por exemplo, desvio da escala:
  ±2 NM para RNP 2 ou ±5 NM no caso de alguns equipamentos TSO-C129a) e conhecer seus limites
  de desvio lateral permitidos.'
