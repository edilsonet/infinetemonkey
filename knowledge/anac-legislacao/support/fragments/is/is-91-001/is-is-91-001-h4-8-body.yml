id: is-is-91-001-h4-8-body
kind: is
document: is-91-001
family: '91'
section_id: H4.8
section_title: A seleção manual ou o uso das funções padrões de limitação de inclinação lateral
  da aeronave podem reduzir a capacidade da aeronave de manter a faixa desejada, e o piloto
  não deverá utilizar estas funções. Os pilotos deveriam entender que a seleção manual das
  funções que limitam a inclinação lateral da aeronave pode reduzir a capacidade para satisfazer
  a trajetória esperada pelo ATC, especialmente quando se realizam desvios com um ângulo grande.
  Não obstante, os pilotos não deveriam desviar-se dos procedimentos do AFM e deveriam limitar
  a utilização de tais funções unicamente a procedimentos aceitos que cumprem com os requisitos
  para operações em uma rota RNP 2.
