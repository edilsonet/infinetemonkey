section_id: H4.9
section_title: Se o ATC atribui um curso tirando a aeronave da rota, o piloto não deverá modificar
  o plano de voo no sistema RNP até que receba a autorização de voltar à rota ou que o controlador
  confirme a autorização para uma nova rota. Quando a aeronave não está na rota RNP 2, os
  requisitos de performance RNP 2 não se aplicam.
