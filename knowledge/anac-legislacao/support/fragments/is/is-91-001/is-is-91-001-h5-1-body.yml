section_id: H5.1
section_title: O piloto deve notificar o ATC sobre qualquer perda da capacidade RNP 2 (alertas
  de integridade ou perda de navegação). Se por alguma razão, não possa cumprir com os requisitos
  de una rota RNP 2, o piloto deve notificar o ATC o mais rápido possível. A perda da capacidade
  RNP 2 inclui qualquer falha ou evento pelo qual a aeronave não possa satisfazer os requisitos
  RNP 2.
