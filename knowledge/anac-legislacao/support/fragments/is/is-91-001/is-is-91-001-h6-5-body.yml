id: is-is-91-001-h6-5-body
kind: is
document: is-91-001
family: '91'
section_id: H6.5
section_title: Para a demonstração da configuração da aeronave, o operador deve listar os
  sensores envolvidos na operação RNP 2 (GPS e FMS) e os dados referentes a cada um desses
  equipamentos (quantidade, fabricante e modelo). Esse documento deve ter a assinatura do
  diretor de manutenção, quando se tratar de uma empresa aérea regida pelo RBAC nº 135 ou
  121 ou do administrador de programa segundo a Subparte K do RBAC nº 91, ou assinatura do
  proprietário/operador quando se tratar de operador regido pelo RBAC nº 91 (exceto Subparte
  K).
