section_title: Após o recebimento de uma nova versão do banco de dados de navegação, o operador
  deve validar cada rota RNP 2, antes de voar em condições IMC para assegurar a compatibilidade
  com sua aeronave e que as trajetórias resultantes correspondem às rotas publicadas. Para
  tanto, o operador deve, pelo menos, realizar a comparação entre os dados de navegação das
  rotas RNP 2 que serão inseridos no FMS com cartas e mapas vigentes que contenham as rotas
  publicadas.
