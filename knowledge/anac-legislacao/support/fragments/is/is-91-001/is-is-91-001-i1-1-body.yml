section_title: Este Apêndice trata das especificidades do processo de aprovação de aeronaves
  e operadores para a condução de operações de aproximação baseadas em sistemas de navegação
  por satélite (GNSS) classificados como RNP APCH, de acordo com o conceito PBN. Apenas os
  aspectos relativos à navegação lateral (navegação 2D) em procedimentos de aproximação por
  segmentos retos são abordados neste Apêndice.
