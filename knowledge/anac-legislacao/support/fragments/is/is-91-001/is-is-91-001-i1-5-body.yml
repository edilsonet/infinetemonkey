section_title: De acordo com o que versa o Anexo 6 da Convenção de Aviação Civil Internacional,
  as operações RNP APCH sem guia vertical (sem baro-VNAV) são consideradas operações de não-precisão
  (NPA). Já operações RNP APCH que contam com guia vertical, como o baro-VNAV, mas não atendem
  aos mínimos de aproximações de precisão, são consideradas operações de aproximação com guia
  vertical (APV).
