section_id: I1.7
section_title: As informações de navegação disponíveis nas publicações aeronáuticas aplicáveis
  correspondentes aos procedimentos RNP APCH devem atender ao estabelecido nos Anexos 4 e
  15 da Convenção de Aviação Civil Internacional, conforme apropriado. As cartas de procedimentos
  devem conter informações suficientes de forma a possibilitar a conferência da base de dados
  de navegação por parte da tripulação técnica, incluindo nomes de waypoints, rumos, distâncias
  de cada segmento e ângulo de trajetória vertical.
