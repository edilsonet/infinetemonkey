section_title: O segmento de aproximação perdida pode ser baseado tanto por segmentos RNAV
  quanto por segmentos convencionais (por exemplo, DME, VOR ou NBD). Quando suportada por
  segmentos convencionais, os rádio-auxílios e demais meios de navegação necessários à execução
  da aproximação perdida deverão estar identificados nas publicações relevantes.
