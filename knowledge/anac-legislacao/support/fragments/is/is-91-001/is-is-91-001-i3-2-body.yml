section_title: Operadores e pilotos somente podem solicitar um procedimento RNP APCH se detiverem
  a respectiva aprovação emitida pela ANAC. Se uma aeronave que não detém aprovação mencionada
  receber uma autorização do ATC para execução de um procedimento RNP APCH o piloto deve informar
  ao controle de tráfego aéreo sua incapacidade em aceitar a autorização e deve solicitar
  instruções alternativas.
