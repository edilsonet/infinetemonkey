section_id: I3.3
section_title: Os pilotos devem verificar o correto carregamento dos procedimentos nos sistemas
  de navegação da aeronave, conforme plano de voo e autorização do ATC. De modo similar, os
  pilotos devem assegurar que a sequência de waypoints dos procedimentos carregados, da forma
  como apresentados pelo sistema de navegação, corresponde aos procedimentos autorizados e
  à trajetória dos mesmos coincide com o apresentado nas cartas correspondentes.
