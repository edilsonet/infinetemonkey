family: '91'
section_id: I3.4
section_title: A tripulação técnica deve assegurar-se que as aproximações que serão utilizadas
  durante o voo pretendido (incluindo aquelas em aeródromos alternados) podem ser selecionadas
  diretamente de um banco de dados de navegação válido que foi submetido a um processo adequado
  de conferência (verificação da integridade do banco de dados) e que tais procedimentos não
  têm sua execução proibida por uma instrução da companhia ou por NOTAM.
