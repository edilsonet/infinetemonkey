id: is-is-91-001-i4-1-b
kind: is
document: is-91-001
family: '91'
section_id: I4.1
section_title: 'Adicionalmente aos procedimentos normais executados antes do início da aproximação
  (antes do IAF, respeitando a carga de trabalho da tripulação) a tripulação técnica deve
  verificar se o procedimento correto foi carregado por meio da comparação com as cartas de
  operação pertinentes. Tal verificação deve incluir:'
subsection_id: b
cite: I4.1(b)
title: I4.1(b)
text: 'b) a integridade das trajetórias e distâncias dos segmentos da aproximação, além da
  precisão de navegação associada ao segmento inicial e o comprimento do segmento final.

  Nota: no mínimo, as verificações podem consistir em uma simples inspeção de uma exibição
  de um mapa adequado (display de mapas) que alcance os objetivos deste item.'
