family: '91'
section_id: I4.5
section_title: Quando a operação se fundamenta na disponibilidade do ABAS, a tripulação de
  voo deve realizar uma nova conferência de disponibilidade da função RAIM para casos em que
  o ETA diferir em mais de 15 (quinze) minutos do ETA utilizado durante o planejamento do
  voo. Esta verificação é realizada automaticamente 2 NM antes do FAF para receptores E/TSO-C129a
  classe A1.
