family: '91'
section_id: I4.6
section_title: Intervenções do controle de tráfego aéreo na área terminal podem incluir vetoração
  radar, a interceptação de um segmento inicial ou intermediário de uma aproximação, autorizações
  “direto para” (“direct to”) que fazem com que não sejam executados os segmentos iniciais
  do procedimento, ou a inserção de waypoints carregados diretamente do banco de dados da
  aeronave. Ao seguir as instruções do tráfego aéreo, a tripulação deve estar ciente das implicações
  dos sistemas RNP.
