text: 'I5.2 Os pilotos devem verificar se o sistema de navegação está em modo de aproximação
  dentro de 2 NM antes de atingir o FAF.

  Nota: tal condição pode não ser aplicável para certos sistemas RNP. Para tais sistemas,
  outros meios devem estar disponíveis incluindo displays eletrônicos de mapas, indicadores
  de modo de voo, etc., que claramente indiquem aos pilotos que modo de aproximação está ativado.'
