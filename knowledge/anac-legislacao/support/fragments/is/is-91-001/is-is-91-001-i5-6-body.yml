family: '91'
section_id: I5.6
section_title: Durante o procedimento RNP APCH, os pilotos devem utilizar um indicador de
  desvio lateral, diretor de voo e/ou piloto automático em modo de navegação lateral. Pilotos
  de aeronaves com indicador de desvio lateral (por exemplo, CDI) devem assegurar que a escala
  utilizada (deflexão máxima) é adequada às diferentes precisões de navegação associadas aos
  distintos segmentos do procedimento RNP APCH (ver item I1.6 desta IS).
