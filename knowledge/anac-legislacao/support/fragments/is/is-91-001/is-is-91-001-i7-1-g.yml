section_title: 'Para a condução de operações RNP APCH, além dos tópicos destacados no item
  5.8 desta IS, de forma complementar, o operador deve atentar para abordar e incorporar em
  seu programa de treinamento os itens apresentados abaixo:'
subsection_id: g
cite: I7.1(g)
title: I7.1(g)
text: g) níveis de automação recomendados pelo operador para cada fase do voo e a carga de
  trabalho, incluindo métodos para minimizar os erros técnicos de voo (cross-track error)
  mantendo a aeronave no centro da trajetória desejada durante a execução do procedimento;
