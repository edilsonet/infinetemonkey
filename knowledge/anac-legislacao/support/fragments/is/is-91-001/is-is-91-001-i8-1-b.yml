section_title: 'Uma aeronave pode ser considerada elegível para operações RNP APCH, se o AFM
  ou suplemento do AFM ou especificação da aeronave (TCDS para as aeronaves isentas da certificação
  brasileira) ou POH contiver a declaração do fabricante ou do detentor do CST que a aeronave
  está conforme um dos regulamentos listados abaixo:'
subsection_id: b
cite: I8.1(b)
title: I8.1(b)
text: b) para operações RNP APCH baseadas no sensor GNSS utilizado em um sistema multissensor
  (por exemplo, FMS), a aeronave estar cumprindo com a AC 20-130A ou com a AC 20-138 (Revisão
  B ou superior); ou
