section_id: J1.3
section_title: O termo ‘baro-VNAV’ é derivado da expressão em inglês barometric vertical navigation.
  O sistema de navegação baro-VNAV apresenta ao piloto uma guia vertical calculada que tem
  como referência um ângulo de trajetória vertical (VPA) especificado, que normalmente apresenta
  o valor de 3º (três graus). A guia vertical calculada é baseada nas informações de altitude
  barométrica provenientes do sistema de navegação, sendo especificada como um VPA a partir
  da altura do ponto de referência (RDH).
