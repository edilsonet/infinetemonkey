section_title: O conteúdo descrito neste Apêndice está relacionado à utilização da guia vertical
  no segmento final de aproximação e não há requisitos quanto à sua utilização nas demais
  fases de voo. Desta forma, a navegação vertical pode ser realizada sem guia VNAV nos segmentos
  inicial e intermediário de um procedimento de aproximação por instrumentos.
