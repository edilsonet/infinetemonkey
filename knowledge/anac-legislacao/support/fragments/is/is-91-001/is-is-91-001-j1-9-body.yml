family: '91'
section_id: J1.9
section_title: De acordo com as definições constantes no Anexo 6, parte I, da Convenção de
  Aviação Civil Internacional, as operações de aproximação RNP APCH com APV/Baro-VNAV são
  classificadas como operações de aproximação e pouso com guia vertical (approach and landing
  operations with vertical guidance). Embora não sejam classificados como procedimentos de
  aproximação de precisão, os procedimentos baro-VNAV são promulgados com altitude/altura
  de decisão (DA/H); adicionalmente, estes últimos procedimentos também não podem ser confundidos
  com os procedimentos de aproximação e pouso de não precisão, que por sua vez são elaborados
  de modo a especificar uma altitude/altura mínima de descenso (MDA/H) abaixo da qual as aeronaves
  só podem descer se os pilotos tiverem em vista as referências visuais necessárias.
