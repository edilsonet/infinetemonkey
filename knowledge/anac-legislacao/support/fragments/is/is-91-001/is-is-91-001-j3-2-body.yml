section_title: A tripulação técnica deve ter conhecimentos sobre a seleção apropriada dos
  modos de navegação vertical compatíveis com o perfil vertical publicado para o procedimento.
  Outros modos de navegação (como, por exemplo, velocidade vertical - vertical speed) não
  são aplicáveis para a condução de procedimentos de aproximação baro-VNAV.
