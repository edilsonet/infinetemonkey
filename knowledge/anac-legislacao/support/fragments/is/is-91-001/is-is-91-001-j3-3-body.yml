family: '91'
section_id: J3.3
section_title: Altitudes e/ou velocidades associadas aos procedimentos publicados devem ser
  automaticamente extraídas do banco de dados de navegação por meio da seleção do procedimento
  de aproximação. Caso ajustes manuais das informações de altitude sejam necessários, a tripulação
  deverá realizar as alterações necessárias às altitudes do procedimento e reverter para utilização
  da temperatura ajustada LNAV MDA.
