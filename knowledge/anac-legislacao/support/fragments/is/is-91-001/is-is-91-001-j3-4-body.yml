text: 'J3.4 Para aeronaves que operam com dois pilotos, a tripulação técnica deverá realizar
  uma verificação cruzada de modo a assegurar que os valores apresentados pelos altímetros
  de ambos os pilotos não estejam em desacordo superior a ±100 pés, antes de alcançar o fixo
  final de aproximação (FAF). Caso esta verificação falhe, o procedimento não poderá ser executado
  ou, caso já esteja em curso, o mesmo deverá ser descontinuado.

  Nota: caso a aeronave seja equipada com um sistema que realize a verificação automática
  dos altímetros e gere um alerta à tripulação em caso de divergências entre os valores apresentados,
  procedimentos operacionais devem ser elaborados de modo a levar em conta o automatismo da
  aeronave e assegurar que serão adotadas ações análogas àquelas estabelecidas para o caso
  em que é realizada a verificação convencional.

  J4. Limitações de temperatura e procedimentos de correção'
