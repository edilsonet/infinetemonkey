id: is-is-91-001-j4-2-body
kind: is
document: is-91-001
family: '91'
section_id: J4.2
section_title: Devido às características descritas no item anterior, os procedimentos baro-VNAV
  são publicados contendo valores de temperatura limite, e essas limitações de temperatura
  são apresentadas mediante uma nota na carta do procedimento de aproximação. Dessa forma,
  ao executar um procedimento, os pilotos devem atentar para situações em que a temperatura
  se apresente abaixo ou acima dos limites estabelecidos pela carta, pois em tais condições,
  a utilização da altitude/altura de decisão de navegação vertical (VNAV DA/H) não é autorizada.
  Para aeronaves equipadas com sistemas de compensação de temperatura, a tripulação técnica
  deverá seguir os procedimentos operacionais elaborados pelo operador com base nas instruções
  providas pelo fabricante do equipamento.
