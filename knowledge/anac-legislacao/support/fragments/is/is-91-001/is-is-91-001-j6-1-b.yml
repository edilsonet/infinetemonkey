title: J6.1(b)
text: b) classificação das operações de aproximação por instrumentos. Diferenças entre os
  procedimentos de aproximação por instrumentos existentes, incluindo os distintos mínimos
  meteorológicos aplicados, enfatizando os benefícios e limitações aplicáveis aos detentores
  de aprovações para condução de operações RNP APCH com APV/Baro-VNAV;
