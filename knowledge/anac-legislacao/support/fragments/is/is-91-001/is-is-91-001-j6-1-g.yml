document: is-91-001
family: '91'
section_id: J6.1
section_title: 'Para a condução de operações RNP APCH com baro-VNAV, além dos tópicos destacados
  no item 5.8 e no Apêndice I desta IS, de forma complementar, o operador deve atentar para
  abordar e incorporar em seu programa de treinamento os itens apresentados abaixo:'
subsection_id: g
cite: J6.1(g)
title: J6.1(g)
text: 'g) modos de falha e reversão: a tripulação técnica deve ter conhecimento sobre os modos
  de falha e reversão que podem impactar negativamente na capacidade da aeronave em realizar
  as operações de aproximação RNP APCH com baro-VNAV. Adicionalmente, os pilotos devem estar
  cientes dos procedimentos de contingência associados.

  J7. CRITÉRIOS DE AERONAVEGABILIDADE'
