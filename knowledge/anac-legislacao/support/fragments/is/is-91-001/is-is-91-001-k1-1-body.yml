section_title: 'O Doc. 9613 - Manual on Required Navigation Performance (PBN), estabelece
  dois tipos de especificações de navegação para procedimentos de aproximação RNP: RNP APCH
  e RNP APCH com autorização requerida (RNP AR APCH). Tais operações podem oferecer vantagens
  significativas do ponto de vista operacional e de segurança, uma vez que introduzem capacidades
  de navegação adicionais em termos de precisão, integridade e funções que permitem operações
  com separação de obstáculos reduzida.'
