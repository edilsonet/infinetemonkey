section_title: Operações RNP AR APCH permitem um alto grau de precisão e requerem que o operador
  demonstre cumprimento de requisitos adicionais relacionados ao treinamento dos tripulantes
  e aos equipamentos da aeronave. Tais operações são classificadas como aproximação com guia
  vertical (APV). Além do guia lateral, este tipo de aproximação requer um guia de navegação
  vertical para o segmento de aproximação final.
