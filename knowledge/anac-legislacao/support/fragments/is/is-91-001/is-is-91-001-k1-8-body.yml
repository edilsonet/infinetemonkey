text: 'K1.8 Os valores máximos, padrões e mínimos para cada fase do procedimento RNP-AR estão
  discriminados na tabela abaixo, conforme preconizado pelo Doc. 9905 da OACI:

  Segmento

  Valor de RNP

  Máximo

  Padrão

  Mínimo

  Chegada - STAR

  2

  2

