  1

  1

  0.1

  Intermediário

  1

  1

  0.1

  Final

  0.5

  0.3

  0.1

  Aproximação Perdida

  1

  1

  0.1 *

  * Utilização restrita a operações em que o segmento de aproximação final não é um segmento
  RF.za

  Os procedimentos RNP AR APCH publicados pelo DECEA tem a designação “RNP xxxx (AR)” e possuem
  expressa a informação: “AUTORIZAÇÃO ESPECIAL PARA AERONAVE E TRIPULAÇÃO REQUERIDA”.'
