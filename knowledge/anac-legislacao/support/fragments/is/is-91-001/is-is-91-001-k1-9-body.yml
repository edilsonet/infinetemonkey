section_id: K1.9
section_title: O Doc. 9905 - Required Navigation Performance Authorization Required (RNP AR)
  Procedure Design Manual, estabelece critérios e recomendações que devem ser utilizadas para
  o desenvolvimento de procedimentos RNP AR APCH. O documento citado sugere que em localidades
  onde o desenvolvimento de um procedimento não seja viável por meio da aplicação dos critérios
  e parâmetros sugeridos, soluções alternativas podem ser geradas especificando condições,
  caso a caso, que devem ser atendidas pelos operadores de modo a prover um nível equivalente
  de segurança operacional.
