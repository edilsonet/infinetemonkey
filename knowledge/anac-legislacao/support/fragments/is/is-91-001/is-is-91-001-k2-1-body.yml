section_title: 'Valor de RNP. A todo procedimento RNP AR APCH é atribuído um valor de RNP
  específico, ex. RNP 0.3 ou RNP 0.15. O menor valor de RNP autorizado deve fazer parte da
  documentação do operador podendo variar de acordo com modelos, configurações das aeronaves
  ou procedimentos operacionais (ex.: utilização de FD com ou sem AP, equipamentos inoperantes,
  etc.).'
