section_title: Procedimento que incluem RF legs. Alguns procedimentos RNP AR APCH possuem
  trajetórias laterais em curvas traçadas a partir de um raio fixo, denominadas Radio to Fix
  Leg (RF Leg). Uma vez que nem todas as aeronaves têm a capacidade de cumprir esse tipo de
  trajetória, é responsabilidade do piloto em comando a verificação se a aeronave possui ou
  não tal capacidade.
