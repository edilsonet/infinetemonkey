section_id: K2.3
section_title: Segmentos de aproximação perdida que requerem valor de RNP menor que 1.0. A
  execução de determinados procedimentos de aproximação perdida pode requerer, em função de
  tráfego aéreo ou obstáculos, trajetórias com valor de RNP menores que 1.0, resultando na
  necessidade da confiabilidade do sistema de navegação ser muito elevada. Essa capacidade,
  normalmente requer da aeronave equipamentos redundantes, visto que uma falha isolada não
  deve causar a perda da capacidade de navegação.
