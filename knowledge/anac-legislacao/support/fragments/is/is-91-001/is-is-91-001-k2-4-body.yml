section_title: Velocidade ou razão de subidas não-padrão. Procedimentos RNP AR APCH são desenvolvidos
  para empregar velocidades e razão de subida no segmento de aproximação perdida (200 pés/minuto)
  de acordo com os padrões normais de confecção de procedimentos. Variações destes parâmetros
  estarão explícitas na carta de aproximação e o operador deve assegurar a capacidade da aeronave
  em atender o desempenho requerido.
