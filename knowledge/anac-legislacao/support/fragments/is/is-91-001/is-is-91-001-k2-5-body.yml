text: 'K2.5 Limites de temperatura. Os limites inferiores e superiores de temperatura para
  aeronaves que utilizam sistema de navegação barométrico (baro-VNAV) estão identificados
  na carta de aproximação. Aeronaves utilizando sistema de compensação de temperatura ou um
  meio alternativo de navegação vertical (ex.: SBAS), podem desconsiderar os limites de temperatura
  informados.

  Nota 1: os limites de temperatura estabelecidos nas cartas são determinados em função do
  livramento de obstáculos no segmento de aproximação final. Levando-se em consideração os
  efeitos da temperatura no perfil vertical, pode ser necessário o ajuste da altitude mínima
  nos segmentos de aproximação final e intermediária bem como na altitude de decisão.

  Nota 2: variações de temperatura afetam a altitude indicada. Quando a temperatura atual
  estiver acima da temperatura padrão (ISA) a aeronave estará voando acima da rampa prevista,
  da mesma forma, quando a temperatura for inferior à ISA a aeronave estará com a altitude
  real inferior à altitude indicada.

  Nota 3: os pilotos são responsáveis pelas correções envolvendo os limites inferiores de
  temperatura, devendo ajustar as seguintes altitudes mínimas publicadas:'
