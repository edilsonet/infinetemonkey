section_title: 'Limites de temperatura. Os limites inferiores e superiores de temperatura
  para aeronaves que utilizam sistema de navegação barométrico (baro-VNAV) estão identificados
  na carta de aproximação. Aeronaves utilizando sistema de compensação de temperatura ou um
  meio alternativo de navegação vertical (ex.: SBAS), podem desconsiderar os limites de temperatura
  informados.'
