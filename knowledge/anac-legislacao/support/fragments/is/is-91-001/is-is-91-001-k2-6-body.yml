section_title: Porte da aeronave. As altitudes mínimas podem sofrer incrementos em função
  do porte da aeronave. Aeronaves de grande porte podem requerer altitudes mínimas mais elevadas
  em função da envergadura ou altura do trem de pouso. Quando houver restrições quanto ao
  porte da aeronave, esta estará explícita na carta de aproximação.
