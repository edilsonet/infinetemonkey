section_id: K3.3
section_title: Devido à grande diversidade nas características das aeronaves (velocidade,
  características de projeto, sistemas de navegação, etc.) a publicação do procedimento não
  garante a sua operacionalidade em todos os modelos de aeronaves. Desta forma o operador
  tem a responsabilidade de avaliar, para cada modelo de aeronave, a viabilidade da execução
  de cada procedimento RNP AR APCH que pretenda operar. Essa análise deve ser feita utilizando
  a ferramenta FOSA, detalhada no Anexo 5 deste Apêndice.
