section_title: Em alguns casos, conforme estabelecido nos itens K8.7 e K8.9 , é requerido
  que o operador submeta o FOSA à ANAC antes de iniciar a operar um novo procedimento RNP
  AR APCH. Em todos os demais casos, quando não é explicitamente requerido por esta IS que
  o FOSA deve ser submetido à ANAC, antes de iniciar a operar um novo procedimento RNP AR
  APCH é requerido que o operador elabore ou revise o FOSA e mantenha-o arquivado, à disposição
  da ANAC.
