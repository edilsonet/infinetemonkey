id: is-is-91-001-k7-6-b
kind: is
document: is-91-001
family: '91'
section_id: K7.6
section_title: 'Em adição ao apresentado nesta IS, a aeronave deve mostrar conformidade com
  os seguintes documentos publicados pelo FAA:'
subsection_id: b
cite: K7.6(b)
title: K7.6(b)
text: 'b) AC 20-138 ( ) - “Airworthiness Approval of Global Positioning System (GPS) Navigation
  Equipment for use as a VFR and IFR Supplemental Navigation System” ou AC 20-130 ( ) - “Airworthiness
  Approval of Navigation or Flight Management Systems integrating multiple navigation sensors.

  Nota: caso a aeronave atenda à AC 20-138 C, ou superior, não é necessária a informação de
  cumprimento também da AC 20-129.'
