document: is-91-001
family: '91'
section_id: K7.7
section_title: Documentos de qualificação da aeronave. Os fabricantes de aeronaves devem desenvolver
  documentos que comprovem a conformidade com esta seção. Tais documentos devem explicitar
  as capacidades do sistema (ex. RF Legs, RNP missed approaches, etc.), a elegibilidade para
  cada configuração da aeronave e as especificidades que podem contribuir para eventual mitigação
  operacional. Esta documentação deve também definir os procedimentos de manutenção associados
  às aprovações RNP AR APCH.
