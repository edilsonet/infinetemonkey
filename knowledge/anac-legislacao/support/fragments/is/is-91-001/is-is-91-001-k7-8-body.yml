section_title: Modificação da aeronave. Se qualquer sistema (software ou hardware) requerido
  para operações RNP AR APCH for instalado ou modificado, tal modificação deve ser aprovada
  pela ANAC. O operador deve necessariamente obter uma nova aprovação operacional suportada
  pelo fabricante e pela documentação de qualificação da aeronave.
