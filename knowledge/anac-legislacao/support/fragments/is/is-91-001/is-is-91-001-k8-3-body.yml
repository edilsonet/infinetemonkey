section_title: Operadores regidos pelo RBAC nº 121 ou 135 ou pela Subparte K do RBAC nº 91
  devem submeter à ANAC declaração de conformidade para cada aeronave ou grupo de aeronaves
  candidatas às operações RNP AR APCH. Tal declaração deve mostrar conformidade com este Apêndice
  e com os Anexos deste Apêndice.
