section_id: K8.5
section_title: 'Para solicitações de autorização inicial genérica, ou para solicitação de
  autorização específica, o operador deve submeter a ANAC no mínimo a seguinte documentação:'
subsection_id: b
cite: K8.5(b)
title: K8.5(b)
text: b) documentos de qualificação da aeronave. O fabricante deve assegurar que a aeronave
  atende aos critérios estabelecidos no Anexo 2 deste Apêndice. Esta documentação deve demonstrar
  cumprimento com os requisitos de hardware e software, procedimentais e limitações;
