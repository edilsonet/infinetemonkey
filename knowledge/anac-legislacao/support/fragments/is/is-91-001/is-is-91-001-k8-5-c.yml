section_id: K8.5
section_title: 'Para solicitações de autorização inicial genérica, ou para solicitação de
  autorização específica, o operador deve submeter a ANAC no mínimo a seguinte documentação:'
subsection_id: c
cite: K8.5(c)
title: K8.5(c)
text: c) tipo e descrição dos equipamentos a serem utilizados. O operador deve prover lista
  das configurações contendo detalhes relevantes dos componentes e equipamentos utilizados.
  A lista deve especificar o fabricante, o modelo e a versão do software instalado no FMS;
