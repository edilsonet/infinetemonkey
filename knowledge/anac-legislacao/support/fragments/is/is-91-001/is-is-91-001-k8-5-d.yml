section_id: K8.5
section_title: 'Para solicitações de autorização inicial genérica, ou para solicitação de
  autorização específica, o operador deve submeter a ANAC no mínimo a seguinte documentação:'
subsection_id: d
cite: K8.5(d)
title: K8.5(d)
text: d) procedimentos operacionais. Os manuais do operador devem especificar as localidades
  das operações pretendidas e as práticas e procedimentos operacionais identificados nesta
  IS. Operadores regidos pelo RBAC nº 91 devem declarar que as operações serão conduzidas
  de acordo com os procedimentos operacionais descritos nesta IS;
