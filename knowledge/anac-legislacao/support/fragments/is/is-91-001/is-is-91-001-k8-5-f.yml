family: '91'
section_id: K8.5
section_title: 'Para solicitações de autorização inicial genérica, ou para solicitação de
  autorização específica, o operador deve submeter a ANAC no mínimo a seguinte documentação:'
subsection_id: f
cite: K8.5(f)
title: K8.5(f)
text: f) programa de treinamento de operações. Conforme descrito no Anexo 3 deste Apêndice.
  O operador deve submeter o programa de treinamento de operações (PTO) contendo os syllabus
  referentes ao treinamento de RNP AR APCH, e os demais materiais de treinamento utilizados
  de forma a demonstrar que o conteúdo requerido por esta IS foi documentalmente incorporado
  aos seus treinamentos. O programa de treinamento deve abordar as características específicas
  dos procedimentos classificados como Procedimentos Especiais pelo DECEA nos quais pretenda
  operar;
