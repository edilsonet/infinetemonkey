section_title: Para operadores que já possuam autorização genérica em suas EO ou Especificações
  Administrativas, caso durante a revisão do FOSA (que é requerida para cada procedimento
  no qual o operador pretenda operar, conforme o item K3.4 deste Apêndice) seja identificada
  necessidade de alteração de treinamentos ou procedimentos operacionais, o FOSA deverá ser
  enviado juntamente com os manuais e programas revisados que requeiram aceitação ou aprovação
  da ANAC, e será utilizado como referência para a análise.
