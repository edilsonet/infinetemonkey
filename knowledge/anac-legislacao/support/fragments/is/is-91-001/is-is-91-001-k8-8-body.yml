section_title: Na eventualidade de revisão pelo DECEA de carta de procedimento RNP AR APCH,
  é responsabilidade do operador verificar se houve alterações significativas que tenham impacto
  em suas operações. Essa verificação deve ser feita por meio de revisão do FOSA. Caso a conclusão
  da revisão seja de que o FOSA continua válido, sem necessidade de alteração, essa conclusão
  deve ser atestada pelo diretor de operações em documento complementar ao FOSA.
