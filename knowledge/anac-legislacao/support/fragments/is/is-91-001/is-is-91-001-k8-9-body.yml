id: is-is-91-001-k8-9-body
kind: is
document: is-91-001
family: '91'
section_id: K8.9
section_title: Quando o procedimento alterado for classificado como Procedimento Especial
  pelo DECEA, e o operador possuir autorização específica para esse procedimento, a ANAC deve
  ser formalmente comunicada por meio do diretor de operações se o FOSA foi modificado em
  razão das alterações no procedimento RNP AR APCH publicado. Caso tenha sido modificado,
  o FOSA deve ser anexado ao documento, juntamente com os demais manuais e programas que tenham
  sido alterados. A falta de envio dessa documentação pode resultar no cancelamento da autorização
  específica emitida para operação no referido procedimento.
