section_title: Após a conclusão satisfatória do processo de aprovação, a ANAC emitirá a autorização
  provisória por meio de uma LOA para os operadores regidos pelo RBAC nº 91, quando aplicável;
  de alteração de EO para os operadores regidos pelos RBAC nº 121 ou 135; ou de alteração
  de Especificações Administrativas para operadores regidos pela Subparte K do RBAC nº 91.
