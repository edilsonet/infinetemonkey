text: 'K9.2 As autorizações provisórias terão validade de 90 dias ou 100 (cem) aproximações,
  o que for maior.

  Nota 1: operadores com experiência prévia em procedimentos RNP AR APCH poderão ter os prazos
  e a quantidade de operações descritos no item K9.2 desta IS reduzidos mediante análise da
  ANAC.

  Nota 2: em situações específicas, em que a frequência das operações seja muito esparsa,
  devido à oportunidade de utilização de aeródromos com procedimentos RNP AR APCH publicados,
  a ANAC pode reduzir o número de operações previstas no item K9.2 desta IS.'
