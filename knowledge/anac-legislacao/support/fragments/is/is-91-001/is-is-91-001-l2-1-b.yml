section_title: Dados de performance de decolagem e subida
subsection_id: b
cite: L2.1(b)
title: L2.1(b)
text: b) Os dados de performance de decolagem compreendem a performance desde o momento de
  liberação dos freios (brake release) até o recolhimento do trem de pouso, retração dos flaps
  e aceleração até a velocidade de subida em rota (en route climb speed). A fase de decolagem
  termina quando a aeronave atinge a velocidade de subida desejada.
