section_title: Navegação lateral (LNAV)
subsection_id: a
cite: L2.2(a)
title: L2.2(a)
text: a) Operações RNP AR DP requerem Sistema de Navegação Global por Satélites (GNSS) e Sistema
  de Navegação Inercial (INS). A capacidade de navegação inercial garante que a aeronave seja
  capaz de continuar a navegação em um procedimento RNP AR DP em caso de indisponibilidade
  do sistema GNSS.
