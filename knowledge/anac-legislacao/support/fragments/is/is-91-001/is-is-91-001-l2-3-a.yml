section_title: Trajetória do procedimento RNP AR DP
subsection_id: a
cite: L2.3(a)
title: L2.3(a)
text: a) Quando a primeira curva do procedimento se inicia muito próxima ao ou no DER, a base
  de dados de navegação pode definir o fixo inicial do procedimento no início da cabeceira
  de aproximação da pista de decolagem (approach end of the takeoff runway). Nesse caso, todo
  o primeiro segmento do procedimento irá coincidir com o comprimento do eixo da pista de
  decolagem, desde a cabeceira até o DER. Isso permite que alguns sistemas RNP forneçam a
  navegação lateral tangente ao fixo inicial da primeira curva (RF leg).
