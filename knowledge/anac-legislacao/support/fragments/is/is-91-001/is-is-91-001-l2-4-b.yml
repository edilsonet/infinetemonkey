text: 'b) Caso as restrições não possam ser atendidas no caso de falha de motor, é aceitável
  o uso de um procedimento de contingência para saída por instrumentos, o qual deverá ser
  validado no FOSA como parte do processo de autorização para operações RNP AR DP.

  L3. DESCRIÇÃO DO SISTEMA DE NAVEGAÇÃO'
