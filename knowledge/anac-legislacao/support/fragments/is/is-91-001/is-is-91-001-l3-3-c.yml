section_title: Altura mínima para navegação lateral
subsection_id: c
cite: L3.3(c)
title: L3.3(c)
text: 'c) Caso, de acordo com o AFM ou o AOM, não seja possível o acoplamento do LNAV em solo,
  a performance da aeronave deve permitir:

  i. subir até a altura mínima de acoplamento do LNAV;

  ii. acoplar automaticamente ou manualmente o LNAV; e

  iii. acompanhar as orientações de navegação lateral providas pelo sistema RNP, assim como
  acompanhar a trajetória do procedimento, antes de chegar à primeira curva do procedimento
  (que pode, inclusive, se iniciar no DER).'
