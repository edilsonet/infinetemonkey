section_title: Curvas próximas ao início da decolagem com aceleração rápida da aeronave
subsection_id: a
cite: L3.4(a)
title: L3.4(a)
text: a) Em procedimentos RNP AR DP com curvas próximas ao início da decolagem (se iniciando
  no ou próximo ao DER), o recolhimento do trem de pouso e dos flaps e a aceleração rápida
  para a velocidade de subida em rota podem comprometer a capacidade do sistema RNP de conduzir
  computação antecipada dessas curvas. Esse comprometimento da computação das curvas pode
  inviabilizar o cumprimento pela aeronave da trajetória do procedimento RNP AR DP.
