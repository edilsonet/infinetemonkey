section_title: Curvas próximas ao início da decolagem com aceleração rápida da aeronave
subsection_id: b
cite: L3.4(b)
title: L3.4(b)
text: b) Caso, nas demonstrações requeridas durante o processo de autorização para operações
  RNP AR DP, seja identificado que a aeronave apresenta dificuldades para manter a trajetória
  do procedimento em curvas próximas ao DER, deverá ser investigado se a causa é a rápida
  aceleração da aeronave. Se essa for a causa, pode ser necessário estabelecer uma restrição
  de velocidade que permita o cumprimento da trajetória.
