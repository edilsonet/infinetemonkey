cite: L3.5(a)
title: L3.5(a)
text: a) O sistema RNP, o diretor de voo (flight director) e o piloto automático (autopilot)
  devem ser capazes de comandar um ângulo de inclinação lateral de até 30° acima de 400ft
  AGL.
