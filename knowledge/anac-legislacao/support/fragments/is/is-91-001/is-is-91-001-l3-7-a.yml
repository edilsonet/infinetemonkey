section_title: Alinhamento do INS e atualização da posição do INS
subsection_id: a
cite: L3.7(a)
title: L3.7(a)
text: 'a) De forma a compensar a potencial indisponibilidade do GNSS e viabilizar a reversão
  para navegação somente por INS durante a execução de um procedimento RNP AR DP, a instalação
  do INS e o sistema RNP devem permitir conduzir um alinhamento completo e subsequentes atualizações
  da posição do INS antes da decolagem.

  L4. APROVAÇÃO DE AERONAVEGABILIDADE E OPERACIONAL'
