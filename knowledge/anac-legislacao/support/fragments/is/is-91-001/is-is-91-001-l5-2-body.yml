section_title: São consideradas elegíveis aeronaves cuja certificação de tipo ou certificação
  suplementar de tipo atestem cumprimento aos requisitos de RNP AR DP com referência a documentos
  como o CS-ACNS issue 2 ou superior (seções CS ACNS.C.PBN.640 e CS ACNS.C.PBN.645) publicado
  pela EASA, ou documento equivalente publicado pela ANAC, EASA ou FAA. O cumprimento desses
  requisitos deve estar atestado em documentos como o AFM e seus suplementos.
