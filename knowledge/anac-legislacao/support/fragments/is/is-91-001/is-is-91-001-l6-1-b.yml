title: L6.1(b)
text: b) O operador deve verificar a CDL e a MEL da aeronave para identificar equipamentos
  e partes requeridas para operações RNP AR DP, em razão das funcionalidades adicionais requeridas
  em relação a operações RNP AR APCH. O operador deve buscar orientação com o detentor de
  TC ou STC de forma a determinar se alguma alteração em CDL ou MEL é requerida para conduzir
  operações RNP AR DP.
