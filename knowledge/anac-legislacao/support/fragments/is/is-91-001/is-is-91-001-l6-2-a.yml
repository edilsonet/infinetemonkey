section_title: Dados e cálculos de performance de decolagem e subida
subsection_id: a
cite: L6.2(a)
title: L6.2(a)
text: a) Devido às demandas únicas de performance associadas com procedimentos RNP AR DP,
  assim como aos cálculos requeridos para performance em situações de contingência em procedimentos
  RNP AR DP, operadores podem precisar obter do fabricante um conjunto completo de dados de
  performance de decolagem e subida. Esse conjunto de dados de performance deve prover meios
  para garantir a capacidade de cumprir com todas as exigências de performance de subida de
  um procedimento RNP AR DP tanto durante a fase de decolagem quanto durante a fase de subida.
