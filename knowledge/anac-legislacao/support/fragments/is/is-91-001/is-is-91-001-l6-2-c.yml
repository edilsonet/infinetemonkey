section_title: Dados e cálculos de performance de decolagem e subida
subsection_id: c
cite: L6.2(c)
title: L6.2(c)
text: c) Caso pretenda utilizar ferramentas de cálculo de performance (Computer-based applications,
  Electronic Flight Bag (EFB) performance calculators, RNP system performance calculators),
  é responsabilidade do operador confirmar que os cálculos são realizados com base no conjunto
  de dados de performance de decolagem e subida fornecido pelo fabricante da aeronave, e que
  os cálculos atendem todas as exigências e orientações desta IS relativas a operações RNP
  AR DP.
