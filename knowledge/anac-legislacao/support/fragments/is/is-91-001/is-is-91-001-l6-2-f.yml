section_title: Dados e cálculos de performance de decolagem e subida
subsection_id: f
cite: L6.2(f)
title: L6.2(f)
text: f) O operador deve utilizar informações constantes em informes ou previsões meteorológicos
  para o horário da decolagem quando for analisar a performance de subida e o atendimento
  das restrições do procedimento RNP AR DP a ser utilizado. As informações meteorológicas
  utilizadas devem atender o previsto nas seções 121.101 e 121.119 do RBAC nº 121.
