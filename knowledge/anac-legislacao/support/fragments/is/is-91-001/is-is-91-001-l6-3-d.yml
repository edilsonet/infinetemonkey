section_id: L6.3
section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: d
cite: L6.3(d)
title: L6.3(d)
text: 'd) O operador deve garantir que os procedimentos operacionais requerem que os pilotos
  confirmem a validade dos dados de performance de decolagem e subida antes de aceitarem uma
  autorização de decolagem do ATC. Isso inclui a determinação da existência de quaisquer limitações
  de performance que afetem a capacidade de cumprir com restrições ou exigências de trajetória
  lateral, gradientes ou altitude de um procedimento RNP AR DP. Esses procedimentos também
  devem incluir como um piloto avalia procedimentos de contingência (ex: OEI) pré planejados
  e quaisquer outras contingências relacionadas à performance para um procedimento RNP AR
  DP. Os procedimentos operacionais e o treinamento devem garantir que os pilotos identifiquem
  as limitações de performance que afetam a decolagem planejada utilizando um procedimento
  RNP AR DP, assim como identifiquem quando é necessário refazer os cálculos de performance.

  Nota: usualmente as análises detalhadas que avaliam se a performance disponível da aeronave
  é suficiente para atender às exigências de um procedimento RNP AR DP são realizadas por
  meio de processos de engenharia de operações. Eventualmente essas análises são realizadas
  utilizando ferramentas de cálculo de performance que podem não ser as mesmas disponibilizadas
  aos pilotos para uso nas aeronaves durante as operações rotineiras. Nesse caso, é aceitável
  que as ferramentas sejam diferentes, desde que, por meio de procedimentos operacionais e
  treinamento, as verificações de performance realizadas pelos pilotos garantam que todas
  as eventuais restrições identificadas nas análises detalhadas realizadas pela engenharia
  de operações sejam atendidas. A adequação desses procedimentos deve ser verificada documentalmente
  e em demonstrações durante o processo de autorização.'
