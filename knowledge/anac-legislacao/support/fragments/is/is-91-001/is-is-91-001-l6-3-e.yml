section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: e
cite: L6.3(e)
title: L6.3(e)
text: e) No caso de ocorrência de atraso na decolagem, alteração da pista de decolagem, ou
  antecipação da decolagem, se estiver previsto o uso de um procedimento RNP AR DP, o piloto
  deve garantir que a aeronave é capaz de cumprir com todos os aspectos de performance de
  decolagem e subida. Há uma série de fatores (peso de decolagem, comprimento de pista de
  decolagem disponível, gradiente da pista, temperatura, direção e intensidade do vento, altitude
  de pressão, correções requeridas pela MEL ou CDL, etc) que devem ser considerados e podem
  exigir a realização de uma nova análise de performance para confirmar a capacidade de a
  aeronave cumprir com as exigências do procedimento RNP AR DP.
