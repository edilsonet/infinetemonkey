section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: f
cite: L6.3(f)
title: L6.3(f)
text: f) Antes da decolagem os pilotos da aeronave devem realizar um briefing cobrindo os
  procedimentos de pilotagem necessários para realizar a operação RNP AR DP planejada. O briefing
  deve revisar quaisquer ações únicas e procedimentos relacionados à operação RNP AR DP que
  os pilotos devem realizar durante as fases de decolagem e subida enquanto cumprem com a
  trajetória do procedimento. Se aplicável, o briefing de decolagem deve incluir os procedimentos
  previstos no item L3.3 b) desta IS.
