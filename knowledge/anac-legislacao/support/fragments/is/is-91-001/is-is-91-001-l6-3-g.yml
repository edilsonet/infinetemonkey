section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: g
cite: L6.3(g)
title: L6.3(g)
text: 'g) O briefing antes da decolagem deve utilizar os meios disponíveis para identificar
  o primeiro ponto de curva do procedimento RNP AR DP, que é o fixo inicial da primeira RF
  leg. Entre esses meios estão a carta do procedimento, o FMC e o display de navegação. O
  objetivo é aumentar a consciência dos pilotos sobre o primeiro fixo de uma curva RF leg
  próxima ao DER e ajudar a prevenir a ultrapassagem da trajetória da curva (overshoot), o
  que pode levar a uma aproximação rápida com o terreno ou obstáculos.

  Nota: quando conduzindo operações RNP AR DP, é importante que os pilotos usem os displays
  com mapa de navegação e os aviônicos suplementares (ex: TAWS) para manter continua consciência
  situacional em relação ao terreno e obstáculos próximos à trajetória do procedimento. Entretanto,
  o contexto da operação deve ser avaliado de forma a determinar se um dos pilotos deve utilizar
  o display para apresentar outras informações, como situação vertical da aeronave e radar
  meteorológico.'
