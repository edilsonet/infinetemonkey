section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: h
cite: L6.3(h)
title: L6.3(h)
text: 'h) O briefing antes da decolagem deve incluir quaisquer procedimentos pré-planejados
  para condições não normais após comprometimento com a decolagem (ex: falha de motor após
  a V1). Os procedimentos de contingência devem incluir a perda de motor durante a decolagem
  e durante a subida, e quaisquer outros eventos que possam comprometer a capacidade da aeronave
  de completar o procedimento RNP AR DP utilizado. O operador deve cumprir com as orientações
  do fabricante da aeronave quando for desenvolver o briefing.'
