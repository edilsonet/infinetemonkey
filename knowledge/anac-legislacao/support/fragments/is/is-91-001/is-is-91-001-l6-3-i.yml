subsection_id: i
cite: L6.3(i)
title: L6.3(i)
text: 'i) Os procedimentos operacionais para os pilotos devem exigir a confirmação da disponibilidade
  do GNSS imediatamente antes da decolagem (ex: como parte do “before takeoff checklist”).
  Esses procedimentos devem seguir as recomendações do fabricante, quando disponíveis.'
