section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: j
cite: L6.3(j)
title: L6.3(j)
text: j) Os procedimentos operacionais para os pilotos devem exigir que, imediatamente antes
  da decolagem, seja conduzido um alinhamento completo do sistema inercial e posterior atualização
  de posição durante as operações de solo. Isso garante a melhor performance para o sistema
  inercial e para o sistema RNP da aeronave no caso de indisponibilidade do GNSS após a decolagem.
