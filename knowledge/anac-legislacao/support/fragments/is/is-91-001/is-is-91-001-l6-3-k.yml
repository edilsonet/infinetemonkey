section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: k
cite: L6.3(k)
title: L6.3(k)
text: k) Caso a aeronave não possua meios automáticos de atualização da posição do sistema
  inercial, os procedimentos operacionais para os pilotos devem exigir que seja conduzida
  uma atualização manual. Nesse caso, os procedimentos devem prever ainda que a aeronave não
  pode estar a mais de 300 m do ponto inicial de corrida de decolagem, e que os pilotos devem
  avaliar se o ATC deve ser informado de eventuais atrasos previstos para iniciar a decolagem.
