section_title: Considerações pré-voo e de decolagem para operações RNP AR DP
subsection_id: m
cite: L6.3(m)
title: L6.3(m)
text: m) O operador deve considerar a estreita relação entre a performance da aeronave durante
  a fase de decolagem e a fase de subida de um procedimento RNP AR DP. O treinamento dos pilotos
  é essencial para que sejam capazes de efetivamente usar o sistema de navegação enquanto
  cumprem com características demandantes de procedimentos RNP AR DP, como gradientes não
  padrão e curvas próximas ao DER. Quando o AFM ou o AOM proíbem o acionamento do LNAV em
  solo, os procedimentos operacionais devem garantir que os pilotos acionem o LNAV manual
  ou automaticamente por meio do sistema RNP. O treinamento dos pilotos e os procedimentos
  operacionais também devem enfatizar a manutenção da trajetória alinhada com o eixo da pista
  após a decolagem e antes de chegar ao DER, e subsequente cumprimento com a orientação LNAV
  provida pelo sistema RNP de forma a garantir que a aeronave seja capaz de prover orientação
  para curvas próximas ao DER.
