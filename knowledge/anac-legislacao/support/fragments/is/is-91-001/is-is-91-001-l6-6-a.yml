section_title: Treinamento inicial de solo para pilotos para operações RNP AR DP
subsection_id: a
cite: L6.6(a)
title: L6.6(a)
text: 'a) Em adição ao treinamento inicial de solo requerido para operações RNP AR APCH, deve
  ser provido aos pilotos o seguinte treinamento de solo sobre RNP AR DP:

  i. discussão sobre a performance de decolagem e de subida da aeronave, incluindo análise
  da fase de subida, que se inicia no ponto do procedimento onde a fase de decolagem termina
  e a aeronave atinge a velocidade desejada de subida;

  ii. demonstrar competência na aplicação dos dados de performance de decolagem e subida no
  planejamento da operação RNP AR DP;

  iii. requisitos de performance de decolagem e subida com cálculos para todos os motores
  operando (AEO) e para OEI. Se o operador utilizar ferramentas de cálculo de performance,
  deve ser demonstrada competência no uso da ferramenta;

  iv. identificar quando o piloto deve obter novos dados de performance de decolagem e de
  subida devido a alterações na temperatura do ar externo (OAT);

  v. identificar restrições de velocidade associadas ao procedimento RNP AR DP (ex: limitar
  a velocidade inicial de subida para cumprir com restrição de velocidade do procedimento
  devido a uma curva RF leg, ou para mitigar impactos de rápida aceleração da aeronave conforme
  L3.4 );

  vi. discussão sobre procedimentos de contingência OEI durante um procedimento RNP AR DP;
  e

  vii. procedimentos específicos de ATC relativos a operações RNP AR DP (caso aplicável, ver
  L6.5 ).'
