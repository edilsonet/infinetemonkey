section_title: Treinamento periódico para pilotos para operações RNP AR DP
subsection_id: b
cite: L6.8(b)
title: L6.8(b)
text: 'b) Em adição ao treinamento periódico de RNP AR APCH, deve ser provido treinamento
  periódico aos pilotos sobre RNP AR DP incluindo a realização completa de duas operações
  RNP AR DP, sendo uma como PF e outra como PM.

  Nota: caso o operador requeira que somente o piloto em comando atue como PF em operações
  RNP AR DP, o treinamento periódico pode ser reduzido para uma operação para cada piloto
  (para o piloto em comando como PF, e para o segundo em comando como PM).'
