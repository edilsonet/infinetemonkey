section_title: Créditos de treinamento para RNP AR DP
subsection_id: a
cite: L6.9(a)
title: L6.9(a)
text: 'a) Similar ao que ocorre com créditos para operações RNP AR APCH, o operador pode receber
  créditos considerando autorizações que já possui. Ao requerer esse crédito, o operador deve
  prover detalhes sobre todas as diferenças que precisam ser endereçadas em treinamento, destacando
  e distinguindo os aspectos do RNP AR DP de demais autorizações e respectivos treinamentos
  sobre operações de saída por instrumentos usando procedimentos RNP.

  L7. PROCESSO DE AUTORIZAÇÃO'
