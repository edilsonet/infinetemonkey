section_id: L7.2
section_title: 'Para solicitações de autorização inicial, o operador deve submeter à ANAC
  no mínimo a seguinte documentação:'
subsection_id: e
cite: L7.2(e)
title: L7.2(e)
text: 'e) manuais e programas alterados para implementação de operações RNP AR DP. Os manuais
  do operador devem especificar as práticas e procedimentos operacionais identificados nesta
  IS, em especial neste apêndice. Operadores regidos pelo RBAC nº 91 devem declarar que as
  operações serão conduzidas de acordo com os procedimentos operacionais descritos nesta IS.
  Devem ser incluídos, no mínimo:

  i. programa de treinamento para tripulantes de voo e, se aplicável, DOV, incluindo documentação
  que demonstre a qualificação do simulador de voo a ser utilizado para treinamento de operações
  RNP AR DP;

  Nota: para treinamento de DOV, que não tem critérios estabelecidos especificamente para
  RNP AR DP neste apêndice, deve ser cumprido o estabelecido para RNP AR APCH.

  ii. AOM e listas de verificações;

  iii. programa de treinamento de manutenção;

  iv. procedimentos de manutenção;

  v. MEL; e

  vi. programa de monitoramento;'
