text: 'L8.2 As autorizações provisórias terão validade de 90 dias ou 100 decolagens, o que
  for maior.

  Nota 1: operadores com experiência prévia em procedimentos RNP AR DP poderão ter os prazos
  e a quantidade de operações descritos no item L8.2 desta IS reduzidos mediante análise da
  ANAC.

  Nota 2: em situações específicas, em que a frequência das operações seja muito esparsa,
  devido à oportunidade de utilização de aeródromos com procedimentos RNP AR DP publicados,
  a ANAC pode reduzir o número de operações previstas no item L8.2 desta IS.'
