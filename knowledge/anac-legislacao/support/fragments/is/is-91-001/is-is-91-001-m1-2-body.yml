section_title: O RNP Avançado (A-RNP) é definido para operações em espaço aéreo oceânico/remoto,
  em rotas continentais, áreas terminais e aproximações. A flexibilidade da operação A-RNP
  reduz significativamente a quantidade de autorizações necessárias às várias especificações
  de navegação existentes, além de permitir a trajetória lateral em curva.
