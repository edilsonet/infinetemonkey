text: 'M1.5 As aplicações da operação A-RNP oferecem múltiplas precisões de navegação para
  uso da seguinte forma:


  Valor RNP

  Fase de voo aplicável

  2 NM

  Em rota oceânica/remota e continental

  1 NM

  Em rota continental

  0.3 NM

  Terminal, aproximação e decolagem

  1 NM

  Aproximação perdida

  M2. PROCEDIMENTOS OPERACIONAIS GERAIS PARA OPERAÇÕES A-RNP'
