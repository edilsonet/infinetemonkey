section_title: Deslocamentos paralelos (parallel offset) fornecem a capacidade de a aeronave
  permanecer em trajetória deslocada da trajetória original, conforme definido pela série
  de waypoints. O sistema deve ser capaz de realizar trajetórias deslocadas de até 20 NM da
  trajetória original.
