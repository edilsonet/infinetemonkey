document: is-91-001
family: '91'
section_id: M10.5
section_title: 'As trajetórias deslocadas devem continuar para todos os segmentos de rota
  ATS e curvas até que:'
subsection_id: i
cite: M10.5(i)
title: M10.5(i)
text: 'i) alteração do plano de voo ativo por meio da execução de um Direct-To;

  ii) início de procedimento terminal;

  iii) quando uma mudança de curso exceder 90°, o sistema RNP pode encerrar o deslocamento
  no ponto fixo onde ocorre a mudança de curso. O deslocamento também pode ser encerrado se
  o segmento de rota terminar em um ponto fixo.'
