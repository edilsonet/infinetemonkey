section_title: Pilotos somente podem executar uma rota RNP, SID, STAR ou aproximação se o
  procedimento puder ser carregado nominalmente diretamente do banco de dados de navegação
  da aeronave e for compatível com o procedimento publicado na respectiva carta. Uma rota
  RNP, SID, STAR ou aproximação não deve ser realizada se houver dúvida quanto à validade
