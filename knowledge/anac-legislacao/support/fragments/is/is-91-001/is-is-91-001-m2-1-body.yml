text: 'M2.1 Pilotos somente podem executar uma rota RNP, SID, STAR ou aproximação se o procedimento
  puder ser carregado nominalmente diretamente do banco de dados de navegação da aeronave
  e for compatível com o procedimento publicado na respectiva carta. Uma rota RNP, SID, STAR
  ou aproximação não deve ser realizada se houver dúvida quanto à validade do procedimento
  no banco de dados de navegação.

  Nota: os pilotos podem perceber pequenas diferenças entre a informação de navegação que
  é apresentada pelas cartas e o display de navegação primário. Diferenças de 3 graus ou menos
  podem ocorrer por conta da aplicação de variação magnética adotada pelo fabricante do equipamento
  e são operacionalmente aceitas.'
