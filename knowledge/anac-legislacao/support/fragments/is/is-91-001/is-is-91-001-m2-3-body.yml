section_title: A verificação cruzada com os auxílios à navegação convencionais não é necessária,
  pois a ausência de alerta de integridade é considerada suficiente para atender aos requisitos
  de integridade. No entanto, sugere-se o monitoramento da navegação e qualquer perda de capacidade
  RNP deve ser relatada ao ATC.
