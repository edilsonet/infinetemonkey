section_title: O piloto deve manter a linha central da trajetória no segmento RF. Para operações
  normais, os erros/desvios da trajetória desejada devem ser limitados à metade da precisão
  de navegação associada ao procedimento (por exemplo, 0,5 NM para um procedimento com precisão
  de 1 NM).
