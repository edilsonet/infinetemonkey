section_title: Se uma falha no sistema da aeronave resultar na perda da capacidade de seguir
  um segmento RF, o piloto deve manter a inclinação atual e o curso de saída do segmento RF
  determinado nas cartas. O piloto deve avisar o ATC o mais rápido possível sobre a falha
  do sistema.
