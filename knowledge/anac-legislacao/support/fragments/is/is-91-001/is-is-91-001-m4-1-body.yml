id: is-is-91-001-m4-1-body
kind: is
document: is-91-001
family: '91'
section_id: M4.1
section_title: Antes de iniciar o procedimento, os pilotos deverão assegurar que o sistema
  de navegação da aeronave está disponível e operando corretamente, com as informações corretas
  de pista e procedimento de saída padrão por instrumentos a ser utilizado (incluindo qualquer
  transição em rota aplicável) devidamente carregadas no gerenciador de voo da aeronave e
  propriamente exibidas para o(s) piloto(s). Pilotos que solicitarem um determinado procedimento
  de saída e posteriormente forem orientados pelo controle de tráfego aéreo a alterar a pista,
  procedimento ou transição devem verificar se as alterações solicitadas foram inseridas e
  encontram-se disponíveis antes de iniciar a decolagem. É recomendada uma breve conferência
  e verificação da correta exibição das novas informações inseridas para o(s) piloto(s) pouco
  antes da decolagem.
