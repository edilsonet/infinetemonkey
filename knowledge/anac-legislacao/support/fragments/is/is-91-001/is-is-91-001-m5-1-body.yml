section_id: M5.1
section_title: Antes de iniciar a fase de chegada, a tripulação deve verificar se a rota terminal
  foi corretamente inserida. O plano de voo ativo deve ser verificado comparando as cartas
  de navegação correspondentes com a informação disponibilizada pelo display de mapas (se
  disponível) e pelo MCDU. Esta conferência deve englobar a sequência de waypoints, a proporcionalidade
  dos ângulos e distâncias da trajetória, quaisquer restrições de altitudes e velocidades
  e, quando aplicável, quais waypoints são fly-by ou fly-over. Se for necessário para uma
  determinada rota, uma verificação deverá ser realizada para confirmar que a atualização
  excluirá um auxílio à navegação em particular. Uma rota não poderá ser utilizada caso existam
  dúvidas quanto à sua validade no banco de dados de navegação.
