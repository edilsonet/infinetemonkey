id: is-is-91-001-m5-4-body
kind: is
document: is-91-001
family: '91'
section_id: M5.4
section_title: Alterações no procedimento em área terminal podem consistir em mudanças de
  proa ou autorizações “direct to”, sendo que a tripulação técnica deve ser capaz de atender
  a estas alterações em tempo hábil. Tal condição pode demandar a inserção de waypoints táticos
  carregados diretamente do banco de dados de navegação. A inserção manual ou modificação,
  por parte dos pilotos, da rota carregada utilizando waypoints temporários ou fixos que não
  possam ser carregados diretamente do banco de dados de navegação não é permitida.
