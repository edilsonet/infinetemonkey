id: is-is-91-001-m6-1-body
kind: is
document: is-91-001
family: '91'
section_id: M6.1
section_title: O piloto deve notificar o controle de tráfego aéreo na ocasião de perda da
  capacidade de navegação RNP (perda dos alertas de integridade ou perda da capacidade de
  navegação), juntamente com o curso de ação proposto. Se por alguma razão não for possível
  cumprir com os critérios de RNP tanto para SID ou STAR, os pilotos devem informar ao controle
  de tráfego aéreo o mais rapidamente possível. A perda da capacidade RNP inclui qualquer
  falha ou evento que faça com que a aeronave não mais consiga atender aos critérios de RNP
  previstos.
