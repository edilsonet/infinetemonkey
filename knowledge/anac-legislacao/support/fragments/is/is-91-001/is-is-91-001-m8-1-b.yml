title: M8.1(b)
text: b) A especificação para a operação A-RNP exige que a aeronave utilize sistema GNSS.
  O sistema GNSS deve ser o principal sensor de navegação, seja como sistema de navegação
  autônomo, ou como parte de um sistema multissensor.
