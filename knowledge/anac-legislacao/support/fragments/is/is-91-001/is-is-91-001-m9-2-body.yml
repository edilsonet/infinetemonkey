section_id: M9.2
section_title: Após o recebimento de uma nova versão do banco de dados de navegação, o operador
  deve validar cada rota RNP, SID e STAR, antes de voar em condições IMC para assegurar a
  compatibilidade com sua aeronave e que as trajetórias resultantes correspondem aos procedimentos
  publicados. Para tanto, o operador deve, pelo menos, realizar a comparação entre os dados
  de navegação dos procedimentos RNP, que serão inseridos no FMS com cartas e mapas vigentes
  que contenham os procedimentos RNP publicados.
