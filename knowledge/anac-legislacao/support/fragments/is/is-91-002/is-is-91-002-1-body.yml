title: 'Aplicativos Tipo A:'
text: '1. Aplicativos Tipo A:

  • Aircraft Flight Manual (AFM), que não contenham procedimentos operacionais;

  • Aircraft Opeation Manual (AOM) que não contenham procedimentos operacionais;

  • Manual de performance;

  • Manual de peso e balanceamento;

  • Minimum Equipment List (MEL);

  • Configuration Deviation List (CDL);

  • Aeronautical Information Publications (AIP);

  • Boletins de Serviço;

  • Notices to Airmen (NOTAM);

  • Manual de Manutenção;

  • Regulamentos de Tráfego Aéreo;

  • Normas de Segurança do Comando da Aeronáutica (NSCA);

  • Listas de Verificações;

  • Ficha de Inspeção Anual de Manutenção (FIAM);

  • Manual de Rotas (ROTAER);'
