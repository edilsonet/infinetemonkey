title: REGRAS PARA IMPLANTAÇÃO
text: '11. REGRAS PARA IMPLANTAÇÃO

  11.1 O operador deve realizar avaliação da integração do dispositivo eletrônico relacionada

  aos fatores humanos e coordenação de cabine. Aspectos que devem ser observados

  incluem aumento da carga de trabalho, integração do EFB com o ambiente da cabine,

  funcionalidades e iluminação, inicialização e falhas no sistema. Aspectos relevantes à

  avaliação estão contidos no Apêndice B desta IS.

  11.2 A familiarização ou treinamento para implantação deve incluir cheques pré-voo,

  funcionalidades disponíveis, restrições de utilização e procedimentos de aferição ou

  cross-check das informações.

  11.3 Operadores em processo para eliminação de material impresso devem se submeter a um

  período de transição com a obrigatoriedade de portar material impresso como forma de

  backup. Durante esse período o operador deve assegurar que informações disponíveis são

  confiáveis e acessíveis.

  11.4 É vedada a utilização de EFBs para fins não operacionais, tanto no ar quanto em solo.

  Esta prática pode desviar a atenção de atividades necessárias para a segurança das

  operações e contribuir para a distração e desvio do foco.'
