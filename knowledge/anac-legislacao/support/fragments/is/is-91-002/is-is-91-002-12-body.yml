title: DISPOSIÇÕES FINAIS
text: '12. DISPOSIÇÕES FINAIS

  12.1 Os operadores devem assegurar-se que, quando aplicável, a instalação do EFB cumpre

  com todos os requisitos de pequena ou grande modificações.

  12.2 Os EFB podem ser utilizados isoladamente ou em conjunto com publicações impressas.

  12.3 É responsabilidade do piloto em comando a verificação quanto à aceitação de documentos

  em formato digital pelas autoridades estrangeiras quando em voos internacionais ou

  sobrevoo de território estrangeiro.

  12.4 Esta Instrução Suplementar entra em vigor na data de sua publicação.

  12.5 Os casos omissos serão dirimidos pela Superintendência de Padrões Operacionais.Origem:
  SPO 7/10

  Data de emissão: 28 de junho de 2019 IS nº 91-002

  Revisão D'
