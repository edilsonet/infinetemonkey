title: 'Aplicativos Tipo B:'
text: '2. Aplicativos Tipo B:

  • Cálculos de Desempenho de decolagem, subida, cruzeiro, arremetida e pouso, quando os

  dados são provenientes de dados algorítmicos;

  • Cálculos de comprimento de pista;

  • Informações meteorológicas;

  • Aplicativos cujas funcionalidades estão condicionadas a troca de dados via internet;

  • Carta de Aeródromo, ADC;

  • Carta de Área, ARC;

  • Carta de Aproximação por Instrumento, IAC

  • Carta de Saída por Instrumento, SID;

  • Carta de Aproximação, VAC;

  • Cálculos de Peso e Balanceamento;

  • Manuais da aeronave, que incluam procedimentos e listas de verificações necessários a

  todas as fases do voo;Origem: SPO 8/10

  Data de emissão: 28 de junho de 2019 IS nº 91-002

  Revisão D'
