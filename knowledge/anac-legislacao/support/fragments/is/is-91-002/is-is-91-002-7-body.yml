title: INTRODUÇÃO
text: '7. INTRODUÇÃO

  7.1 Operadores regidos pelo RBHA 91 têm demonstrado crescente interesse na utilização de

  PED com a finalidade de armazenar e disponibilizar informações aeronáuticas em

  formato digital. Existem no mercado inúmeros PED capazes de realizar tais funções,

  tradicionalmente realizadas utilizando-se referências impressas.

  7.2 A utilização de PED está alicerçada na seção 91.21 do RBHA 91, que permite a utilização

  de “qualquer dispositivo eletrônico portátil que o operador da aeronave tenha verificado

  não causar interferência nos sistemas de comunicações e de navegação da aeronave em

  que será usado”.

  7.3 A classe do dispositivo e o tipo de aplicativo determinam a necessidade de aprovação
  do

  órgão regulador. A utilização de dispositivos EFB classe 1 e 2 em operações regidas pelo

  RBHA 91, quando empregados com aplicativos tipo A ou B, não necessitam de aprovação

  específica. Há responsabilidade solidária do operador e do piloto em comando quanto à

  utilização de informações aeronáuticas em formato digital a bordo das aeronaves civis

  brasileiras.'
