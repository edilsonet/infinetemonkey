text: '8. CONSIDERAÇÕES GERAIS

  8.1 Electronic Flight Bags Classe 1 e 2, são considerados PED. A utilização de PED está

  regulamentada na seção 91.21 do RBHA 91.

  8.2 A seção 91.503 do RBHA 91 dispõe sobre equipamentos de voo e informações

  aeronáuticas que o piloto em comando deve assegurar estarem disponíveis em versões

  atualizadas e em formato adequado, entre elas: listas de verificações da cabine, cartas

  aeronáuticas, cartas de desempenho, manuais de voo, etc.

  8.3 A responsabilidade da permissão quanto à utilização de PED recai exclusivamente sobre

  o operador e o piloto em comando.

  8.4 O sistema EFB não deve substituir qualquer sistema ou equipamento requerido pelo

  RBHA 91.

  8.5 As tripulações continuam obrigadas a portar seus certificados e habilitações.

  8.6 O sistema EFB disponibiliza informações estáticas ou interativas cujas funcionalidades

  são equivalentes às referências impressas.

  8.7 O operador deve assegurar-se que as informações utilizadas são válidas e atualizadas.

  8.8 O operador deve assegurar-se que o PED não causa interferências nos sistemas de

  comunicação e navegação da aeronave, em cumprimento a seção 91.21 do RBHA 91.

  8.9 Esta IS apresenta, o Apêndice B intitulado “Ferramenta de Avaliação”, que deve ser

  utilizado durante a avaliação e implantação do EFB. Tal ferramenta visa a auxiliar na

  tomada de decisão quanto à utilização ou não da informação em formato digital.Origem: SPO
  5/10

  Data de emissão: 28 de junho de 2019 IS nº 91-002

  Revisão D'
