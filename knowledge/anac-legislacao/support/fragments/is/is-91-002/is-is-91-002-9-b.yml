section_title: SUBSTITUIÇÃO DE MATERIAL IMPRESSO POR MEIO DIGITAL
subsection_id: b
cite: 9(b)
title: 9(b)
text: 'b) as informações disponibilizadas com fins de navegação, planejamento e

  performance estejam válidas e atualizadas.

  9.2 A utilização de EFB em voo substituindo material impresso é uma decisão do operador

  da aeronave e do piloto em comando. Aplicativos tipo A ou B, conforme definidos nesta

  IS, podem substituir referências impressas equivalentes desde que as orientações contidas

  nesta IS sejam seguidas.

  9.3 Operadores de aeronaves que possuem certificado provisório de homologação de tipo

  continuam obrigados a portar tal documento a bordo.

  9.4 Quando houver a substituição de qualquer publicação de consulta em voo, é mandatório

  que exista a bordo um meio alternativo de acesso (backup) às informações disponíveis

  nos EFB. Esse meio alternativo poderá consistir de material impresso ou de um EFB

  adicional.

  9.5 O piloto em comando é o responsável por garantir que a bateria do EFB tenha carga

  suficiente para a realização do voo, considerando tempos de táxi, alternativa, espera e

  eventuais reservas.

  9.6 A fim de otimizar o desempenho e a segurança do EFB é recomendado que este só

  contenha aplicativos ou softwares necessários para as funções a que se destina.'
