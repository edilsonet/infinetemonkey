text: 'APÊNDICE B - FERRAMENTA DE AVALIAÇÃO

  A presente ferramenta apresenta pontos que devem ser considerados durante a implantação
  da

  informação em formato digital. Esta lista não é exaustiva, podendo ser complementada de
  acordo com

  as necessidades específicas do operador:

  1. A familiarização dos pilotos com o EFB é adequada, garantindo o manuseio de forma segura

  e eficiente?

  2. Existem procedimentos estabelecidos que garantam a integração do EFB com as políticas
  do

  operador?'
