text: 'APÊNDICE C - CONTROLE DE ALTERAÇÕES

  ALTERAÇÕES REALIZADAS NA REVISÃO D

  Item alterado Alteração realizada

  2.2 Ajuste textual.

  4.3 Ajuste textual.

  5 Termos reordenados para manter ordem alfabética.

  5.7 Ajuste textual.

  5.9 a 5.13 Ajuste textual.

  7.2 e 7.3 Ajuste textual.

  8.1 Ajuste textual.

  Antigo item 9.4

  Exclusão de parágrafo que afirmava que o diário de bordo não poderia ser substituído

  por informação digital. Conforme a Resolução nº 457, de 20/12/2017, é possível

  utilizar registro digital das informações do diário de bordo, mediante aprovação da

  ANAC. O assunto não está, portanto, no escopo desta IS, que é restrita a situações que

  não requerem aprovação. Os itens seguintes foram renumerados.

  9.5 Ajuste textual.

  11.1 Ajuste textual.

  12.2 Alterado.'
