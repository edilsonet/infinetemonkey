title: ABREVIATURAS
text: 'ABREVIATURAS

  6.1 Permanecem válidas no presente documento as abreviaturas detalhadas no RBAC nº 01, ou
  no RBAC nº 91.

  6.2 Esta IS utiliza algumas abreviaturas de termos na língua inglesa por entender que os
  mesmos já são amplamente utilizados pela indústria e operadores.

  6.3 ACAS - Air Collision Avoidance System;

  6.4 ALSF-1 - Approach Lighting System with Sequenced Flashing Lights configuration 1;

  6.5 ALSF-2 - Approach Lighting System with Sequenced Flashing Lights configuration 2;

  6.6 AGL - Above Ground Level;

  6.7 CT - Certificação de Tipo;

  6.8 CST - Certificado Suplementar de Tipo;

  6.9 DA - Decision Altitude;

  6.10 DH - Decision High;

  6.11 EFV - Enhanced Flight Visibility;

  6.12 EVS - Enhanced Vision System;

  6.13 EFVS - Enhanced Flight Vision System;

  6.14 FCD - Flight Crew Data

  6.15 FPA - Flight Path Angle

  6.16 FPV - Flight Path Vector;

  6.17 FSTD - Flight Simulation Training Device;

  6.18 GPWS - Ground Proximity Warning System;

  6.19 HDD - Head-down Display;

  6.20 HGS - Head Up Guidance System;

  6.21 HUD - Head-up Display;

  6.22 LOA - Letter of Approval;

  6.23 LVTO - Low Visibility Take-Off;

  6.24 LVP - Low Visibility Procedures;

  6.25 MALSR - Medium-intensity Approach Lighting System with Runway Alignment Indicator Lights;

  6.26 RCLM - Runway Centerline Marking;

  6.27 RCL - Runway Center Lights;

  6.28 REDL - Runway Edge Lights;

  6.29 RNP - Required Navigation Performance;

  6.30 RVR - Runway Visual Range;

  6.31 SOCMS - Sistema de Orientação e Controle da Movimentação no Solo;

  6.32 SSALR - Simplified Short Approach Lighting System with Runway Alignment Indicator Lights;

  6.33 SVS - Synthetic Vision System;

  6.34 TDA - Type Design Approval;'
