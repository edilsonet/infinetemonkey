title: APLICABILIDADE
text: 'APLICABILIDADE

  2.1 Esta IS se aplica a operadores regidos pelos RBAC nº 121 e RBAC nº 135. Os procedimentos
  de navegação aérea previstos nesta IS somente deverão ser executados por operadores e aeronaves
  aprovados pelo Estado de registro ou Estado do operador, conforme o caso.

  2.2 Apenas os operadores autorizados para operações de aproximação ILS CAT II, utilizando
  aeronaves aprovadas para tais operações e equipadas com HGS certificados são elegíveis ao
  processo de aprovação de obtenção dos créditos meteorológicos em aproximações ILS CAT I
  AR e LVTO.


  REVOGAÇÃO - N/A


  FUNDAMENTAÇÃO

  4.1 A Resolução nº 30, de 21 de maio de 2008, institui em seu art. 14, a Instrução Suplementar
  - IS, norma suplementar de caráter geral editada pelo Superintendente da área competente,
  objetivando esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

