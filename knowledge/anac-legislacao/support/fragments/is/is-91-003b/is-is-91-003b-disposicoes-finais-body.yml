title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  23.1 A prerrogativa do órgão regulador conceder autorização específica para operações com
  mínimos meteorológicos abaixo dos publicados não é objeto desta IS. O escopo desta IS está
  limitado à utilização do HGS em procedimentos específicos publicados pelo DECEA, onde está
  explícita esta condicionante.

  23.2 A autorização nas Especificações Operativas ou na LOA do operador deve conter expressamente
  o valor dos mínimos meteorológicos aprovados. Tal autorização é genérica, sendo válida para
  qualquer aeródromo com os mínimos meteorológicos iguais ou superiores a autorização emitida.'
