title: introducao(a)
text: 'a) RVR de 350 m no início da decolagem (TDZ RVR), RVR de 350 m no meio da pista (MID-RVR,
  se instalado) e RVR de 300 m na zona de desaceleração após o toque (Rollout RVR ou RO RVR,
  se instalado), se autorizado, pode ser utilizado, desde que uma das combinações de auxílios
  visuais esteja disponível:


  período diurno: RCLM, ou REDL ou de luzes de RCL operacionais;

  período noturno: REDL operacionais ou luzes de RCL operacionais.'
