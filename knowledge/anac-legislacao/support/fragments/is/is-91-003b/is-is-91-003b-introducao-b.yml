text: 'b) como display primário de voo:


  as informações apresentadas pelo HGS podem ser utilizadas pelo piloto ao invés do mesmo
  escanear os instrumentos ou displays do painel. A aprovação operacional do HGS para tal
  utilização permite ao piloto controlar a aeronave com referência a esse sistema para operações
  de solo e de voo especificamente aprovadas; e

  as informações apresentadas pelo HGS podem ser utilizadas como um meio de alcançar desempenho
  operacional adicional, desta forma tornando-se elegível a obtenção de créditos, tais créditos
  se traduzem em redução dos mínimos meteorológicos em condições específicas.

  7.7 Quando a utilização da informação apresentada pelo HGS for utilizada como display primário
  de voo com fins a utilização dos créditos acima citados é mandatória a aprovação operacional
  do operador. Sendo que apenas os operadores autorizados a realização de operações de aproximações
  ILS CAT II, utilizando aeronaves aprovadas para operações ILS CAT II, são elegíveis às aprovações
  contidas nesta IS.

  7.8 O operador deve estabelecer políticas e procedimentos que devem ser submetidos à aprovação
  da ANAC a fim de comprovar a elegibilidade do mesmo.

  7.9 Não é escopo desta IS abordar aspectos de aeronavegabilidade, uma vez que os equipamentos
  embarcados necessariamente são incorporados à aeronave resultando em uma Certificação de
  Tipo (CT) ou uma Certificação Suplementar de Tipo (CST).


  PROCESSO DE APROVAÇÃO

  8.1 Esta seção estabelece a metodologia aplicada ao processo de aprovação adotado pela Superintendência
  de Padrões Operacionais da ANAC. Este método visa garantir o cumprimento de requisitos operacionais
  bem como a transparência processual. O processo é dividido em cinco fases, das quais:


  Fase 1- Pré-aplicação ou orientação prévia: o processo de aprovação tem início quando o
  operador solicita informações à ANAC. As informações iniciais podem ser prestadas por qualquer
  meio disponível. Porém é altamente recomendada a realização de uma reunião de orientação
  prévia (ROP) para conclusão desta fase do processo. Nesta reunião devem estar presentes
  o inspetor responsável pelo processo, bem como o gerente ou diretor de operações da empresa,
  ou quem ele designar para representá-lo.

  Fase 2 - Aplicação formal: essa fase inicia-se quando o operador entrega a solicitação formal
  acompanhada de todos os documentos que foram estabelecidos durante a Fase 1. Durante essa
  fase o inspetor responsável analisa previamente a documentação e certifica-se de que toda
  a documentação acordada foi entregue.

  Fase 3 - Análise: nessa fase inicia-se uma análise detalhada do material entregue. O inspetor
  responsável deve, se aplicável, encaminhar as solicitações de pareceres aos outros setores
  da Agência. Nesta fase deve também ser planejado as auditorias e acompanhamentos necessários
  para a próxima Fase.

  Fase 4 - Demonstrações e inspeções: fase de avaliação operacional, onde o operador deve
  demonstrar a capacidade de operar de acordo com os procedimentos, diretrizes e parâmetros
  descritos nas fases anteriores. Deve ser avaliada a capacidade de executar de forma satisfatória
  os procedimentos e os treinamentos apresentados.

  Fase 5 - Certificação ou aprovação: diante dos resultados obtidos nas fases anteriores o
  inspetor submete os resultados à respectiva gerencia. Podendo a autorização ser emitida
  ou não. Em caso de aprovação deve ser emitida autorização especial nas Especificações Operativas
  do operador, ou uma Letter of Approval, LOA, quando o mesmo for operador regido pelo RBAC
  nº 91. Caso desfavorável, o gestor do processo decidirá pelo seu arquivamento ou retorno
  a alguma fase anterior.

  8.2 Após o término do processo, a autorização para conduzir operações CAT I AR e LVTO devem
  ser expressas através das Especificações Operativas ou LOA.

  8.3 A autorização expressa deve ser restrita ao menor valor de teto ou visibilidade na qual
  o operador realizou as demonstrações.


  MÍNIMOS METEOROLÓGICOS

  9.1 O Anexo 6 à Convenção de Aviação Civil Internacional, ICAO, prevê que o Estado do operador
  pode aprovar créditos operacionais em operações onde as aeronaves estejam equipadas com
  sistemas automáticos de pouso, Head Up Display ou Enhanced Vision Systems (EVS, SVS ou CVS).
  Tais créditos podem ser obtidos de três maneiras:'
