text: 'INTRODUÇÃO

  7.1 Os mínimos meteorológicos para uma particular operação devem assegurar que a combinação
  de informação disponível do ambiente externo e os instrumentos e equipamentos a bordo são
  suficientes para garantir a trajetória a ser voada. Conforme o alcance visual decresce,
  a qualidade e a quantidade de equipamentos embarcados bem como o desempenho da tripulação
  devem ser incrementados de modo a manter o nível de segurança das operações.

  7.2 Na definição dos mínimos meteorológicos para determinada operação se faz necessário
  avaliar vários fatores que podem ser agrupados em três grupos:'
