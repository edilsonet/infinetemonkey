text: 'l) requisitos de aeronavegabilidade.

  17.10 Os operadores aéreos devem incluir treinamentos de diferenças para seus tripulantes
  relacionados ao HGS quando os FCD previrem treinamento, exame e experiência recente referentes
  ao uso destes sistemas.


  PROVISÃO DOS MANUAIS E DOCUMENTOS

  18.1 O requerente deve solicitar a revisão das Especificações Operativas ou a emissão da
  LOA. Os documentos abaixo listados devem obrigatoriamente ser submetidos para análise:'
