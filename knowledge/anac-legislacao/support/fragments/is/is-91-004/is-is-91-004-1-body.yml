title: OBJETIVO
text: '1. OBJETIVO

  Esta Instrução Suplementar tem por objetivo apresentar um método aceitável para autorização

  de operações de aproximação de precisão ILS categoria II e III por operadores aéreos regidos

  pelo RBHA 91, inclusive os regidos também pelos RBAC nº 121 e 135.'
