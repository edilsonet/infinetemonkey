text: 'b) parágrafo AMC1 SPA.LVO.120 da subparte-E do compêndio de meios de atendimento

  aceitáveis e material guia “AMC/GM” de 23 de agosto de 2013 relacionado ao Anexo-V “Part-

  Specific Approval-SPA” da Regulamentação de Operação Aérea “Air Operations Regulations”

  conforme a regulamentação “Commission Regulation” (EU) nº 965/2012 destacada pela

  regulamentação “Regulation” (EC) nº 216/2008 que institui a “European Aviation Safety

  Agency - EASA”.

  4.2.3. No que se refere à capacidade da aeronave e da aeronavegabilidade continuada, podem
  ser

  utilizados, como método de cumprimento aceitável, os critérios técnicos e procedimentos

  administrativos da Advisory Circular (AC) 91-020, revisão original de 11/04/2013, publicada

  pelo Sistema Regional de Cooperación para la Vigilancia de la Seguridad Operacional

  (SRVSOP) - (ICAO - LIMA).'
