text: '4. PROCEDIMENTOS

  4.1. Introdução

  4.1.1. As operações de aproximação de precisão ILS categoria II e III realizadas por operadores
  aéreos

  regidos pelo RBHA 91 (inclusive aqueles também regidos pelos RBAC nº 121 e 135) requerem

  a devida autorização emitida pela ANAC.

  4.1.2. No sentido de instruir a condução do processo administrativo pertinente, esta IS
  apresenta meios

  e procedimentos que devem ser observados na condução do processo que tange somente sua

  aprovação operacional, considerando-se os aspectos abaixo:'
