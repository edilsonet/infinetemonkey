text: 'c) treinamento e qualificação da tripulação do operador aéreo.

  4.1.3. O parágrafo 91.189 do RBHA 91 traz a necessidade de condições específicas para que
  um

  operador aéreo realize operações de aproximação de precisão ILS categoria II e III. Nesse

  sentido, os documentos referenciados nessa IS destacam os diversos aspectos e elementos
  que

  devem ser observados para satisfação do requisito. A seção 91.191 do RBHA 91 requer um

  manual específico, que contenha procedimentos, instruções e limitações, para a condução
  da

  operação.

  4.1.4. A utilização desta IS como método de cumprimento aceitável para autorização das operações

  de aproximação de precisão ILS categorias II e III não isenta de cumprimento os requisitos

  específicos estabelecidos nos RBAC nº 121 e 135, para os operadores regidos por estes

  regulamentos.

  4.2. Procedimentos para autorização das operações pretendidas

  4.2.1. No que se refere à autorização dos procedimentos operacionais e composição de tripulação
  do

  operador aéreo, podem ser utilizados, como método de cumprimento aceitável, os critérios

  técnicos e procedimentos administrativos da Advisory Circular (AC) 91-0201, revisão original

  de 11/04/2013, publicada pelo Sistema Regional de Cooperación para la Vigilancia de la

  Seguridad Operacional (SRVSOP) - (ICAO - LIMA).

  4.2.2. No que se refere à autorização do treinamento e qualificação da tripulação do operador
  aéreo,

  podem ser utilizados, como método de cumprimento aceitável, os critérios técnicos e

