text: '5. DISPOSIÇÕES FINAIS

  5.1. Sempre que julgado pertinente pelo administrado requerente e pelo analista da ANAC

  responsável pela condução do processo, a verificação da atualização das informações dos

  documentos de referência deve ser feita por meio dos endereços eletrônicos abaixo.'
