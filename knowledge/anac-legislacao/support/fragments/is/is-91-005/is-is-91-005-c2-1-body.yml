text: 'C2.1

  Composição do sistema

  : o sistema altimétrico de uma aeronave é composto de todos os elementos envolvidos no processo
  de captação da pressão estática da corrente livre de ar na conversão deste dado em uma saída
  de altitude barométrica. Os elementos do sistema altimétrico se dividem em dois grupos principais:'
