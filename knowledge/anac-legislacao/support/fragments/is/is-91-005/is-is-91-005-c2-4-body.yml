title: C2.4
text: 'C2.4

  Correção do erro da tomada de pressão estática (SSEC):

  se o projeto e características da aeronave e do seu sistema altimétrico não puderem satisfazer
  os padrões do Apêndice D desta IS devido unicamente à localização e geometria das tomadas
  estáticas, então deve ser aplicada automaticamente a SSEC apropriada dentro dos aviônicos
  do sistema altimétrico. O objetivo de projeto da correção de erro da tomada de pressão estática
  deve ser produzir um erro residual mínimo da fonte de pressão estática, porém em todos os
  casos deve satisfazer os requisitos do Apêndice D desta IS de modo apropriado.'
