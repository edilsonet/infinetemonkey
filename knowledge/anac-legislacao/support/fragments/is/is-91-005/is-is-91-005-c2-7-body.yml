title: C2.7
text: 'C2.7

  Integridade do sistema altimétrico

  : durante o processo de autorização operacional para RVSM, deve-se verificar de maneira
  analítica que causas prognosticadas de ocorrência de falhas não-detectadas do sistema altimétrico
  não ocorram com frequência maior do que 1x10

  -5

  por hora de voo. Toda falha ou combinação de falhas cuja ocorrência não seria evidente nas
  verificações cruzadas na cabine de comando e que levariam a erros de medida ou de leitura
  de altitude fora dos limites específicos devem ser avaliadas em relação a essa (suposta)
  acumulação de erros. Não é necessária a consideração de nenhuma outra falha ou acumulação
  de falhas.

  C3. ALERTA DE ALTITUDE'
