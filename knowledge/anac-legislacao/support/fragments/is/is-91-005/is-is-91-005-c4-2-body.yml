section_title: Quando existir uma função de seleção/aquisição de altitude, o painel de controle
  de seleção/aquisição de altitude deve estar configurado de tal maneira que não exista um
  erro maior do que ± 8 m (± 25 ft) entre o valor selecionado (e apresentado à tripulação
  de voo) e a saída correspondente para o sistema de controle.
