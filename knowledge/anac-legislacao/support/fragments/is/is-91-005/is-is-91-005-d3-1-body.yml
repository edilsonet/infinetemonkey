text: 'D3.1 Para poder avaliar um sistema com base nas declarações de performance estabelecidas
  pelo RGCSP é necessário quantificar a média e três valores de desvio-padrão de ASE, expressos
  como ASE

  médio

  e ASE

  3SD

  . Para isso, é necessário levar em conta as formas diferentes pelas quais podem surgir variações
  da ASE. Os fatores que afetam a ASE são:

  a) variações nos equipamentos das aeronaves, de unidade para unidade;

  b) ação das condições ambientais de operação sobre os aviônicos;

  c) variação do erro da tomada de pressão estática; e

  d) ação das condições de operação de voo sobre o erro da tomada de pressão estática'
