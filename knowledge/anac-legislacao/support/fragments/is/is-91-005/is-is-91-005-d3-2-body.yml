section_title: A avaliação da ASE, seja com base em dados medidos ou estimados, deve considerar
  os fatores mencionados nos itens (a) a (d) acima. O efeito do item (d) como uma variável
  pode ser eliminado por meio da avaliação ASE na condição de voo mais adverso possível dentro
  do envelope de voo RVSM.
