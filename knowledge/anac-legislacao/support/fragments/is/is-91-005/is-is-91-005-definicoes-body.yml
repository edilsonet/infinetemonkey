title: DEFINIÇÕES
text: 'DEFINIÇÕES

  4.1. A presente IS utiliza termos e abreviaturas na língua inglesa por entender que os mesmos
  já são amplamente utilizados pela indústria e pelos operadores.

  4.2. No escopo da presente Instrução Suplementar, são válidas todas as definições contidas
  no RBAC nº 01, no RBAC nº 91, no RBAC nº 121 e no RBAC nº 135.'
