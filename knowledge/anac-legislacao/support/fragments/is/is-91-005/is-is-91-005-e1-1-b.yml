section_title: 'Durante o planejamento de voo, a tripulação de voo e o DOV, sempre que aplicável,
  devem se atentar às condições especiais que podem afetar a operação em espaço aéreo RVSM.
  Estas incluem, mas não estão limitadas a:'
subsection_id: b
cite: E1.1(b)
title: E1.1(b)
text: b) registrar a letra “W” no plano de voo que será entregue ao ATC para demonstrar que
  a aeronave e o operador são aprovados para operações RVSM;
