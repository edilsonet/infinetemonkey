text: 'E1.1 Durante o planejamento de voo, a tripulação de voo e o DOV, sempre que aplicável,
  devem se atentar às condições especiais que podem afetar a operação em espaço aéreo RVSM.
  Estas incluem, mas não estão limitadas a:

  a) verificar se a aeronave está aprovada para operações RVSM;

  b) registrar a letra “W” no plano de voo que será entregue ao ATC para demonstrar que a
  aeronave e o operador são aprovados para operações RVSM;

  c) condições meteorológicas reportadas e previstas para a rota de voo;

  d) requisitos de equipamento mínimo relativos aos sistemas de manutenção de altitude; e

  e) as restrições operacionais da aeronave no que se refere à sua aeronavegabilidade para
  operações RVSM.

  E2. PROCEDIMENTOS PRÉ-VOO'
