section_title: 'As seguintes ações devem ser realizadas durante o pré-voo:'
subsection_id: a
cite: E2.1(a)
title: E2.1(a)
text: a) rever as anotações feitas nos registros técnicos da aeronave para determinar a condição
  dos equipamentos necessários para o voo no espaço aéreo RVSM. Devem ser verificadas se as
  ações de manutenção necessárias para corrigir eventuais defeitos e/ou falhas nos equipamentos
  foram realizadas;
