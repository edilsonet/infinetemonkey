cite: E2.1
title: 'As seguintes ações devem ser realizadas durante o pré-voo:'
text: 'E2.1 As seguintes ações devem ser realizadas durante o pré-voo:

  a) rever as anotações feitas nos registros técnicos da aeronave para determinar a condição
  dos equipamentos necessários para o voo no espaço aéreo RVSM. Devem ser verificadas se as
  ações de manutenção necessárias para corrigir eventuais defeitos e/ou falhas nos equipamentos
  foram realizadas;

  b) durante a inspeção externa da aeronave; deve ser prestada especial atenção à condição
  de tomadas estáticas e a condição da superfície da célula em torno de cada tomada estática
  e qualquer outro componente que afete a precisão do sistema de altimetria (esta verificação
  pode ser realizada por uma pessoa qualificada e autorizada que não seja o piloto, como um
  mecânico de manutenção aeronáutica, por exemplo);

  c) antes da decolagem, os altímetros da aeronave devem ser ajustados para a pressão local
  reduzida ao nível médio do mar (QNH) e devem exibir uma elevação conhecida (por exemplo,
  elevação do terreno) dentro dos limites especificados nos manuais de operação da aeronave.
  A diferença entre a elevação conhecida e a elevação exibida nos altímetros não pode exceder
  75 pés. Os dois altímetros primários também devem coincidir dentro dos limites especificados
  pelo manual de operação da aeronave. Também pode ser utilizado um procedimento alternativo,
  utilizando o QFE; e

  d) antes da decolagem, todo o equipamento necessário para voar no espaço aéreo RVSM deve
  estar em condições operacionais, e qualquer indicação de anomalia ou mal funcionamento deve
  ser resolvida.

  E3. PROCEDIMENTOS ANTES DE INGRESSAR EM ESPAÇO AÉREO RVSM'
