title: 'Os seguintes equipamentos devem estar operando normalmente antes de adentrar o espaço
  aéreo RVSM:'
text: 'E3.1 Os seguintes equipamentos devem estar operando normalmente antes de adentrar o
  espaço aéreo RVSM:

  a) dois sistemas principais de medição de altitude;

  b) um sistema automático de controle de altitude; e

  c) um dispositivo de alerta de altitude.'
