text: 'E3.3

  Transponder operacional

  : o operador deve determinar a exigência de um transponder operacional em cada área onde
  se pretendam realizar operações RVSM. O operador também deve determinar os requisitos de
  transponder para áreas de transição adjacente aos espaços aéreos RVSM.

  E4. PROCEDIMENTOS EM VOO'
