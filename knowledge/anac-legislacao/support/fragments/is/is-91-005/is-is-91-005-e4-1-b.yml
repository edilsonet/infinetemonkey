section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: b
cite: E4.1(b)
title: E4.1(b)
text: b) ao cruzar a altitude de transição, as tripulações de voo devem prestar especial atenção
  para o rápido ajuste das sub-escalas de todos os altímetros primários e de reserva para
  29,92 pol. Hg / 1013,2 hPa, e verificar a configuração de altímetro ao atingir o nível de
  voo autorizado (CFL);
