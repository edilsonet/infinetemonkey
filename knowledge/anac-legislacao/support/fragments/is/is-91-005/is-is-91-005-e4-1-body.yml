cite: E4.1
title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento da tripulação
  de voo:'
text: 'E4.1 Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:

  a) as tripulações de voo devem cumprir com as limitações operacionais da aeronave no que
  se refere a possíveis limitações relacionadas à aeronavegabilidade para operações RVSM;

  b) ao cruzar a altitude de transição, as tripulações de voo devem prestar especial atenção
  para o rápido ajuste das sub-escalas de todos os altímetros primários e de reserva para
  29,92 pol. Hg / 1013,2 hPa, e verificar a configuração de altímetro ao atingir o nível de
  voo autorizado (CFL);

  c) em nível de cruzeiro, é essencial que a aeronave esteja voando no CFL. Isto requer cuidado
  especial para se assegurar que as autorizações do ATC sejam totalmente compreendidas e cumpridas.
  Exceto em situações de emergência ou de contingência, a aeronave não deve intencionalmente
  afastar-se do CFL sem autorização do ATC;

  d) durante trocas autorizadas entre níveis de voo, não se pode permitir que o avião se desvie
  mais do que 45 m (150 ft) acima ou abaixo do novo nível de voo;

  Nota

  : recomenda-se que o nivelamento seja finalizado utilizando o sistema de dispositivo de
  captura de altitude do controle automático de altitude, se instalado.

  e) um sistema automático de controle de altitude deve estar operacional e ligado em nível
  de cruzeiro, salvo em circunstâncias tais como a necessidade de compensar a aeronave novamente
  ou em condições de turbulência que exijam a sua desconexão. Em todo caso, o controle da
  altitude de cruzeiro deve ser realizado tendo como referência um dos dois altímetros primários;

  f) o sistema de alerta de altitude deve estar operacional;

  g) para intervalos de aproximadamente uma hora, devem ser realizadas verificações cruzadas
  entre os altímetros principais e o altímetro de reserva (

  stand-by

  ). No mínimo, dois altímetros primários devem concordar dentro de 60 m (200 ft) ou um valor
  mais baixo, se assim estiver especificado pelo manual de operação da aeronave. No caso de
  não cumprimento desta condição, exige-se que o sistema de altimetria seja relatado como
  defeituoso e seja notificado ao ATC. As diferenças entre os altímetros principais e de reserva
  devem ser anotadas para possível utilização em situações de emergência;

  I. O padrão de verificação dos instrumentos da cabine de comando deve ser suficiente para
  a verificação cruzada dos altímetros na maioria dos voos.

  II. Antes de ingressar no espaço aéreo RVSM, a verificação cruzada dos altímetros primários
  e de reserva deve ser registrada.

  h) em condições normais de funcionamento, o sistema de altimetria que estiver sendo usado
  para controlar a aeronave deve ser selecionado de modo a fornecer os dados para o transponder
  de comunicação da altitude, que transmite a informação ao ATC;

  i) se o piloto é notificado pelo ATC de um erro de AAD que exceda 300 pés, a tripulação
  deve tomar medidas para voltar ao nível de voo autorizado o mais rapidamente possível; e

  j) se o piloto for notificado em voo que a aeronave foi identificada por um sistema de monitoramento
  de altitude exibindo TVE maior que ± 90 m (± 300 ft) e/ou uma ASE superior a ± 70 m (± 245
  ft), então o piloto deve seguir os procedimentos regionais para manter a segurança da operação.
  Isso pressupõe que o sistema de monitoramento irá identificar a TVE ou ASE dentro dos limites
  estabelecidos de precisão.

  E5. PROCEDIMENTOS DE CONTINGÊNCIA APÓS ENTRAR EM ESPAÇO AÉREO RVSM'
