section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: c
cite: E4.1(c)
title: E4.1(c)
text: c) em nível de cruzeiro, é essencial que a aeronave esteja voando no CFL. Isto requer
  cuidado especial para se assegurar que as autorizações do ATC sejam totalmente compreendidas
  e cumpridas. Exceto em situações de emergência ou de contingência, a aeronave não deve intencionalmente
  afastar-se do CFL sem autorização do ATC;
