section_id: E4.1
section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: d
cite: E4.1(d)
title: E4.1(d)
text: 'd) durante trocas autorizadas entre níveis de voo, não se pode permitir que o avião
  se desvie mais do que 45 m (150 ft) acima ou abaixo do novo nível de voo;

  Nota

  : recomenda-se que o nivelamento seja finalizado utilizando o sistema de dispositivo de
  captura de altitude do controle automático de altitude, se instalado.'
