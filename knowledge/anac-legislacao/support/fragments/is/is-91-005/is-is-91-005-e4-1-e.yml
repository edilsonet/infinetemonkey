section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: e
cite: E4.1(e)
title: E4.1(e)
text: e) um sistema automático de controle de altitude deve estar operacional e ligado em
  nível de cruzeiro, salvo em circunstâncias tais como a necessidade de compensar a aeronave
  novamente ou em condições de turbulência que exijam a sua desconexão. Em todo caso, o controle
  da altitude de cruzeiro deve ser realizado tendo como referência um dos dois altímetros
  primários;
