section_id: E4.1
section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: g
cite: E4.1(g)
title: E4.1(g)
text: 'g) para intervalos de aproximadamente uma hora, devem ser realizadas verificações cruzadas
  entre os altímetros principais e o altímetro de reserva (

  stand-by

  ). No mínimo, dois altímetros primários devem concordar dentro de 60 m (200 ft) ou um valor
  mais baixo, se assim estiver especificado pelo manual de operação da aeronave. No caso de
  não cumprimento desta condição, exige-se que o sistema de altimetria seja relatado como
  defeituoso e seja notificado ao ATC. As diferenças entre os altímetros principais e de reserva
  devem ser anotadas para possível utilização em situações de emergência;

  I. O padrão de verificação dos instrumentos da cabine de comando deve ser suficiente para
  a verificação cruzada dos altímetros na maioria dos voos.

  II. Antes de ingressar no espaço aéreo RVSM, a verificação cruzada dos altímetros primários
  e de reserva deve ser registrada.'
