title: E4.1(h)
text: h) em condições normais de funcionamento, o sistema de altimetria que estiver sendo
  usado para controlar a aeronave deve ser selecionado de modo a fornecer os dados para o
  transponder de comunicação da altitude, que transmite a informação ao ATC;
