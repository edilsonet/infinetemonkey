section_id: E4.1
section_title: 'Devem ser incluídas as seguintes políticas aos procedimentos e ao treinamento
  da tripulação de voo:'
subsection_id: j
cite: E4.1(j)
title: E4.1(j)
text: 'j) se o piloto for notificado em voo que a aeronave foi identificada por um sistema
  de monitoramento de altitude exibindo TVE maior que ± 90 m (± 300 ft) e/ou uma ASE superior
  a ± 70 m (± 245 ft), então o piloto deve seguir os procedimentos regionais para manter a
  segurança da operação. Isso pressupõe que o sistema de monitoramento irá identificar a TVE
  ou ASE dentro dos limites estabelecidos de precisão.

  E5. PROCEDIMENTOS DE CONTINGÊNCIA APÓS ENTRAR EM ESPAÇO AÉREO RVSM'
