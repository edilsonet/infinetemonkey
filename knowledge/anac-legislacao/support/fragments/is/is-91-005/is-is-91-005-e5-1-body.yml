section_title: O piloto deve notificar o ATC sobre qualquer contingência (falhas em sistemas
  da aeronave, condições climáticas adversas, etc.) que afete a capacidade de manter o CFL
  e coordenar um plano de ação. O Doc. 7030 da OACI descreve os procedimentos de contingência
  das diferentes regiões.
