text: 'E6.1 Ao efetuar os registros nas cadernetas técnicas da aeronave sobre o mau funcionamento
  de sistemas de manutenção de altitude, o piloto deve fornecer detalhes suficientes para
  permitir que o pessoal de manutenção localize e repare o sistema. O piloto deve detalhar
  o defeito e as medidas tomadas pela tripulação para tentar isolar e corrigir a falha. Deverão
  ser registradas as seguintes informações, conforme o caso:

  a) leituras dos altímetros principais e de reserva;

  b) ajuste do seletor de altitude;

  c) ajuste da sub-escala do altímetro;

  d) piloto automático utilizado para controlar a aeronave e qualquer diferença quando o sistema
  alternativo for selecionado;

  e) diferenças nas leituras dos altímetros, se selecionadas tomadas estáticas alternativas;

  f) uso do

  Air Data Computer

  (ADC) para o procedimento de diagnóstico de falhas; e

  g) transponder selecionado para proporcionar informações de altitude ao ATC e qualquer diferença
  existente se o transponder alternativo for selecionado.

  APÊNDICE F - EMENTÁRIO DE TREINAMENTO PARA OPERAÇÕES RVSM - ATUALIZAÇÃO DE PTO

  F1. CONTEÚDO'
