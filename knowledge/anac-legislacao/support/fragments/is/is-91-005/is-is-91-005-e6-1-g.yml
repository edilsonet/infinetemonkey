section_id: E6.1
section_title: 'Ao efetuar os registros nas cadernetas técnicas da aeronave sobre o mau funcionamento
  de sistemas de manutenção de altitude, o piloto deve fornecer detalhes suficientes para
  permitir que o pessoal de manutenção localize e repare o sistema. O piloto deve detalhar
  o defeito e as medidas tomadas pela tripulação para tentar isolar e corrigir a falha. Deverão
  ser registradas as seguintes informações, conforme o caso:'
subsection_id: g
cite: E6.1(g)
title: E6.1(g)
text: g) transponder selecionado para proporcionar informações de altitude ao ATC e qualquer
  diferença existente se o transponder alternativo for selecionado.
