title: F1.1(f)
text: 'f) requisitos de monitoramento da capacidade de manutenção de altitude que contemple
  a obtenção de dados por meio dos seguintes sistemas:

  I. unidade de monitoramento de altitude (HMU); e

  II. monitor do sistema mundial de determinação de posição (GMU).'
