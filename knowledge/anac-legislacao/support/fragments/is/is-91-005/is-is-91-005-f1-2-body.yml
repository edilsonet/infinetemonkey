title: 'Os seguintes itens devem ser incluídos nos programas de treinamento para a tripulação
  de voo:'
text: 'F1.2 Os seguintes itens devem ser incluídos nos programas de treinamento para a tripulação
  de voo:

  a) instruções sobre os procedimentos operacionais listados no Apêndice E desta IS;

  b) conhecimento e compreensão da fraseologia ATC padrão utilizado em cada área de operações;

  c) a importância da realização de verificações cruzadas pelos membros da tripulação para
  garantir que as autorizações do ATC sejam cumpridas de forma ágil e correta;

  d) uso e limitações em termos de precisão de altímetros de reserva em contingências. Quando
  aplicável, o piloto deve rever a aplicação da correção de erro da tomada de pressão estática/correção
  de erro de posição mediante a utilização de cartões de correção;

  e) problemas de percepção visual de outra aeronave para uma separação planejada de 300 m
  (1.000 pés) em condições noturnas, quando da ocorrência de fenômenos locais, tais quais
  luzes do norte, para tráfego em direção oposta e tráfego que está na mesma direção e em
  curva;

  f) características dos sistemas de captura de altitude da aeronave que podem fazer com que
  o avião ultrapasse a altitude atribuída;

  g) procedimentos operacionais e características operacionais relacionados com a operação
  de ACAS durante a operação RVSM;

  h) relação entre os sistemas de altimetria, controle automático de altitude e transponder
  em situações normais e anormais;

  i) restrições operacionais da aeronave relacionadas à aeronavegabilidade para operações
  RVSM; e

  j) utilização de trajetórias paralelas para mitigar os efeitos da esteira de turbulência.'
