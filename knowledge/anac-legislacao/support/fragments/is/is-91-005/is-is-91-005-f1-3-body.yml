cite: F1.3
title: 'Os seguintes itens devem ser incluídos nos programas de treinamento teórico para DOV:'
text: 'F1.3 Os seguintes itens devem ser incluídos nos programas de treinamento teórico para
  DOV:

  a) verificação da certificação da aeronave e do operador para realização de operações RVSM;

  b) registro do plano de voo a ser arquivado no posto de serviços de transporte aéreo;

  c) conhecimento sobre o funcionamento e os requisitos mínimos para a navegação aérea na
  área NAT-HLA (

  North Atlantic High Level Airspace

  ) e espaço aéreo oceânico (a anotação no campo nº 10 do plano de voo com a letra "W" confirma
  a autorização operacional para RVSM);

  d) informação e precisões das condições meteorológicas na rota de voo;

  e) requisitos mínimos de equipamentos relacionados aos sistemas de manutenção de altitude;

  f) conhecimento de quaisquer restrições das aeronaves relacionadas à aeronavegabilidade
  para operações RVSM;

  g) planejamento de voo em espaço aéreo RVSM, incluindo os seguintes temas:

  I. cumprimento dos requisitos RVSM para a aeronave;

  II. planejamento de voo normatizado RVSM, incluindo:

  A. considerações meteorológicas em rota; e

  B. considerações da MEL.

  h) falhas de equipamentos em rota e procedimentos de contingência em espaço aéreo RVSM em
  que se pretenda voar; e

  i) treinamento sobre os procedimentos regionais para operações específicas que contemple:

  I. as aéreas de uso do espaço aéreo RVSM, incluindo procedimentos operacionais e de contingência
  específicos para cada espaço aéreo, requisitos específicos de planejamento de voo e os requisitos
  para a aprovação das aeronaves na região designada; e

  II. NAT-HLA (

  North Atlantic High Level Airspace

  ) para operações no Atlântico Norte.

  APÊNDICE G - MANUAIS DE AERONAVEGABILIDADE CONTINUADA

  G1. GENERALIDADES'
