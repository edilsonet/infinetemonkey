title: F1.3(g)
text: 'g) planejamento de voo em espaço aéreo RVSM, incluindo os seguintes temas:

  I. cumprimento dos requisitos RVSM para a aeronave;

  II. planejamento de voo normatizado RVSM, incluindo:

  A. considerações meteorológicas em rota; e

  B. considerações da MEL.'
