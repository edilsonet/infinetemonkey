section_title: 'Os seguintes itens devem ser incluídos nos programas de treinamento teórico
  para DOV:'
subsection_id: i
cite: F1.3(i)
title: F1.3(i)
text: 'i) treinamento sobre os procedimentos regionais para operações específicas que contemple:

  I. as aéreas de uso do espaço aéreo RVSM, incluindo procedimentos operacionais e de contingência
  específicos para cada espaço aéreo, requisitos específicos de planejamento de voo e os requisitos
  para a aprovação das aeronaves na região designada; e

  II. NAT-HLA (

  North Atlantic High Level Airspace

  ) para operações no Atlântico Norte.'
