section_title: Quando a aeronave possui capacidade RVSM original de fábrica, normalmente constatada
  por meio do AFM da aeronave, as tarefas de manutenção relativas ao RVSM já constam do programa
  de manutenção recomendado pelo fabricante ou da programação de manutenção aprovada, quando
  baseada nas publicações do fabricante (MPD/MRBR), não havendo necessidade de o operador
  alterar o programa original.
