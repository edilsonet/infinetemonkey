section_title: As instruções de aeronavegabilidade continuada relativas a modificação de projeto
  que deu capacidade RVSM à aeronave devem ser adicionadas ao programa de manutenção da aeronave.
  Se a aeronave for sujeita ao uso de programa de manutenção aprovado pela Anac, o operador
  deve revisá-lo para incluir essas instruções.
