id: is-is-91-005-g4-1-body
kind: is
document: is-91-005
family: '91'
section_id: G4.1
section_title: No Programa de Treinamento de Manutenção (PTrMnt) do operador deve constar
  treinamento específico para a operação RVSM, tanto para os funcionários envolvidos com a
  manutenção da aeronave, quanto para os responsáveis pela sua liberação de retorno ao serviço.
  Ele deve ainda definir a periodicidade dos treinamentos, que não pode ser superior a 36
  meses, e o conteúdo dos cursos ministrados. A empresa poderá demonstrar também que os treinamentos
  aceitos pela Anac no PrTrnMnt já abordam os treinamentos específicos para a operação RVSM,
  sem necessidade de um treinamento específico.
