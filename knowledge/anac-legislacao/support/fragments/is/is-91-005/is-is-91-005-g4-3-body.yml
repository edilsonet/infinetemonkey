text: 'G4.3 A circular americana AC 91-85 pode servir como material orientativo para a construção
  do programa de treinamento. O conteúdo desse treinamento deve versar pelo menos sobre os
  temas abaixo:

  a) conceito RVSM;

  b) procedimentos RVSM dos manuais da empresa;

  c) os equipamentos envolvidos nas operações RVSM; e

  d) uso da MEL para operações RVSM.

  G5. LISTA DE EQUIPAMENTOS MÍNIMOS (MEL)

  Caso o operador possua uma MEL, ela deve ser adequada e submetida para aprovação da Anac
  para refletir as condições requeridas para o despacho de suas aeronaves com relação aos
  equipamentos utilizados na operação RVSM. A MEL deve também cumprir a exigência dos equipamentos
  listados no parágrafo C1.1 do Apêndice C desta IS.

  APÊNDICE H - MODELO DE SOLICITAÇÃO FORMAL

