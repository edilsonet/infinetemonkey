text: 'a)

  Documento de solicitação formal.

  É o documento submetido à Anac que formaliza as intenções do operador em obter a autorização
  operacional para RVSM. O envio deste documento, juntamente com o restante da documentação
  pertinente e sua aceitação por parte desta Agência, constitui a fase 2 do processo. O preenchimento
  e envio do Relatório Técnico é realizado por meio de formulário digital diretamente no sistema
  SEI.

  O Relatório Técnico deve ter seu preenchimento completo, incluindo a informação do código
  hexadecimal ou binário fornecido pelo CGNA para o transponder da aeronave.'
