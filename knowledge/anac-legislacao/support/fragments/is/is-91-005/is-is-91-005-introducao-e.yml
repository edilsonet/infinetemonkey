text: 'e)

  Fase 5 - aprovação

  : após a finalização de todas as análises, inspeções e demonstrações, tendo o requerente
  demonstrado atendimento satisfatório a todas as exigências estabelecidas, a Anac emitirá
  uma autorização operacional, permitindo ao requerente conduzir a operação RVSM. A autorização
  operacional para RVSM constitui a Fase 5 do processo, sendo concluída por meio da emissão
  das EO para as operações realizadas de acordo com os RBAC nº 121 e 135, por meio de EA para
  as operações realizadas de acordo com a Subparte K do RBAC nº 91 e por meio de carta de
  autorização (LOA), para as operações realizadas pelo RBAC nº 91, exceto Subparte K.

  Aeronaves cujos operadores são regidos pelos RBAC nº 121, 135 ou pela Subparte K do RBAC
  nº 91 e que ainda não fazem parte da frota, ou seja, aeronaves cujos modelos ainda não estão
  inclusos em EO ou EA, poderão possuir autorização operacional para RVSM de acordo com as
  regras do RBAC nº 91 por meio de LOA.

  Representantes e pessoas de contato da organização requerente

  A adequada condução do processo depende da efetividade da comunicação entre a Anac e o interessado.
  Portanto, é essencial que interessado realize e mantenha atualizado seu cadastro no protocolo
  eletrônico da Anac, bem como as indicações dos representantes legais e procuradores especiais
  no Sistema Eletrônico de Informações (SEI).

  As comunicações oficiais acerca do processo de autorização operacional para RVSM serão encaminhadas
  exclusivamente por meio do SEI, para os representantes legais e procuradores cadastrados
  para o CNPJ ou CPF do interessado no sistema.

  O processo eletrônico da Anac está previsto na Resolução nº 520/2019 e maiores informações
  podem ser consultadas no seguinte endereço:

  https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei

  .

  Todas as comunicações, interações e documentos necessários ao processo de autorização operacional
  para RVSM somente serão aceitos se realizados pelas pessoas legalmente designadas pelo interessado,
  respeitadas as respectivas áreas de atuação.

  São consideradas pessoas legalmente designadas pelo interessado os procuradores cadastrados
  no SEI como procuradores especiais ou pessoas legalmente constituídas, que apresentem procuração,
  contrato de trabalho ou prestação de serviços ou outro documento que comprove a legalidade
  e efetividade da representação.

  Autorização operacional para RVSM conforme tipo de operação

  Operação RVSM para operações regidas pelo RBAC nº 91 (incluindo as regidas pelo RBAC nº
  90)

