section_id: 5.3.1
section_title: 'Embora seja único, o processo de aprovação de operações no Espaço NAT-HLA
  deverá ser submetido a dois tipos de aprovações:'
subsection_id: a
cite: 5.3.1(a)
title: 5.3.1(a)
text: 'a) Fase 1 - pré-solicitação: os representantes da ANAC e do operador podem desenvolver
  um entendimento comum em relação à aprovação de operações do Espaço NAT-HLA, estabelecendo
  requisitos aplicáveis e os documentos de orientação que serão utilizados na condução do
  processo. Com esse intuito, uma reunião de orientação prévia (ROP) pode ser agendada, a
  critério da ANAC ou do operador/interessado, para gerir o processo de aprovação, para que
  as informações pertinentes e os detalhes do processo sejam apresentados, tanto por parte
  do requerente, quanto por parte da ANAC.'
