section_title: 'Embora seja único, o processo de aprovação de operações no Espaço NAT-HLA
  deverá ser submetido a dois tipos de aprovações:'
subsection_id: b
cite: 5.3.1(b)
title: 5.3.1(b)
text: 'b) Autorização operacional (autorização do operador).

  5.3.2 A coordenação dos processos de aprovação de operações no Espaço NAT-HLA é de responsabilidade
  da SPO por meio de suas gerências: a GCTA, para operadores regidos pelo RBAC nº 121, a GOAG
  para operadores segundo os RBAC nº 135 e 91, quando aplicável. Portanto, os processos de
  aprovação NAT-HLA serão conduzidos por estas gerências.

  5.3.3 Os processos de aprovação de operações no espaço NAT-HLA seguirão o conceito de processo
  de cinco fases, conforme preconizado pela OACI no Doc 8335, sendo que apenas na última fase
  (Fase 5), após o operador ter demonstrado atendimento a todos os requisitos aplicáveis,
  será emitida a aprovação da ANAC para que sejam realizadas as operações pretendidas. As
  fases do processo são descritas a seguir:'
