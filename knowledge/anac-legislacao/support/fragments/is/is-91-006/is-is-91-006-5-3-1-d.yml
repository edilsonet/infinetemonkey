section_title: 'Embora seja único, o processo de aprovação de operações no Espaço NAT-HLA
  deverá ser submetido a dois tipos de aprovações:'
subsection_id: d
cite: 5.3.1(d)
title: 5.3.1(d)
text: 'd) Fase 4 - demonstrações e inspeções: previamente à obtenção da autorização NAT-HLA,
  a ANAC poderá requerer ao operador que demonstre sua capacidade para realizar operações
  no espaço aéreo NAT-HLA, por meio de um ou mais voos de avaliação operacional. A quantidade
  de voos e o cronograma serão definidos pela ANAC durante o processo de autorização. Considerando
  fatores relevantes tais como a experiência prévia do operador em operações internacionais
  e oceânicas, o conhecimento demonstrado pelo operador na fase de análise documental e os
  critérios de vigilância amostral utilizados pela ANAC. É pertinente enfatizar que somente
  depois de concluída toda a análise documental é que devem ter início as inspeções e demonstrações;
  e'
