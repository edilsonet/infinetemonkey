section_title: 'Embora seja único, o processo de aprovação de operações no Espaço NAT-HLA
  deverá ser submetido a dois tipos de aprovações:'
subsection_id: e
cite: 5.3.1(e)
title: 5.3.1(e)
text: 'e) Fase 5 - aprovação: após a finalização de todas as análises, inspeções e demonstrações,
  tendo o requerente demonstrado atendimento satisfatório a todas as exigências estabelecidas,
  a ANAC emitirá uma autorização permitindo ao requerente conduzir operações no Espaço Aéreo
  NAT-HLA. A autorização constitui a Fase 5 do processo, sendo concluída por meio da emissão
  das EO, por matrícula de aeronave, para operadores brasileiros certificados segundo o RBAC
  nº 119, operando sob o RBAC nº 121 ou 135. Já para operadores não detentores de COA, que
  operam sob as regras gerais do RBAC nº 91, a autorização é concedida pela ANAC por meio
  de LOA específica para cada matrícula de aeronave.

  5.3.4 Aeronaves cujos operadores são empresas regidas pelos RBAC nº 121, 135 ou pela Subparte
  K do RBAC nº 91 e que ainda não fazem parte da frota, ou seja, aeronaves cujos modelos ainda
  não estão inclusos em EO ou Especificações Administrativas poderão ser autorizadas a conduzir
  operações no espaço aéreo NAT-HLA de acordo com as regras do RBAC nº 91 por meio de LOA.

  5.4 Representantes e pessoas de contato da organização requerente

  5.4.1 A adequada condução do processo depende da efetividade da comunicação entre a ANAC
  e o interessado. Portanto, é essencial que interessado realize e mantenha atualizado seu
  cadastro no protocolo eletrônico da ANAC, bem como as indicações dos representantes legais
  e procuradores especiais no sistema SEI.

  5.4.2 As comunicações oficiais acerca do processo de autorização para operações no Espaço
  Aéreo NAT-HLA serão encaminhadas por meio do sistema SEI exclusivamente por meio eletrônico,
  para os representantes legais e procuradores cadastrados para o CNPJ ou CPF do interessado
  no sistema.

  5.4.3 O processo eletrônico da ANAC está previsto na Resolução nº 520/2019 e maiores informações
  podem ser consultadas no seguinte endereço: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.4.4 Todas as comunicações, interações e documentos necessários ao processo de certificação
  somente serão aceitos se realizados pelas pessoas legalmente designadas pelo interessado,
  respeitadas as respectivas áreas de atuação.

  5.4.5 São consideradas pessoas legalmente designadas pelo interessado os procuradores cadastrados
  no SEI como procuradores especiais ou pessoas legalmente constituídas, que apresentem procuração,
  contrato de trabalho ou prestação de serviço ou outro documento que comprove a legalidade
  e efetividade da representação.

  5.5 Aprovação de operações no Espaço Aéreo NAT-HLA

  5.5.1 Para operadores certificados segundo o RBAC nº 119, operando sob o RBAC nº 121 ou
  RBAC nº 135, o procedimento administrativo a ser seguido para a solicitação da autorização
  NAT-HLA é aquele previsto nas IS nº 119-001 e 119-004, respectivamente. Esses operadores
  devem enviar os seguintes documentos para obter a autorização NAT-HLA:'
