section_id: 5.5.2
section_title: 'Para obtenção de LOA NAT-HLA, os operadores regidos pelo RBAC nº 91, exceto
  Subparte K devem remeter à GTCE os seguintes documentos:'
subsection_id: a
cite: 5.5.2(a)
title: 5.5.2(a)
text: 'a) documento de solicitação formal: é o documento que, submetido à ANAC, formaliza
  as intenções do operador em obter a aprovação para a realização das operações NAT-HLA. O
  envio deste documento, juntamente com o restante da documentação pertinente e sua aceitação
  por parte desta Agência, constitui a fase 2 do processo de aprovação. O Documento de Solicitação
  formal é um formulário digital preenchido e enviado diretamente através do sistema SEI.'
