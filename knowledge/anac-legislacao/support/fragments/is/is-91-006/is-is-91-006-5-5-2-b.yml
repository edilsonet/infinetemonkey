section_title: 'Para obtenção de LOA NAT-HLA, os operadores regidos pelo RBAC nº 91, exceto
  Subparte K devem remeter à GTCE os seguintes documentos:'
subsection_id: b
cite: 5.5.2(b)
title: 5.5.2(b)
text: b) Documentação que comprove que o operador detém autorização operacional para realizar
  operações RVSM e PBN (RNAV 10 ou RNP 4). Essa comprovação pode ser realizada com o apontamento
  do número das respectivas LOAs no documento de solicitação formal ou envio de cópias dos
  documentos.
