text: '5.5.2

  Alteradas as informações referentes aos documentos a serem apresentados para operadores
  de acordo com o RBAC nº 91, exceto subparte K.

  5.6

  Exclusão de item que tratava da aprovação operacional de operadores RBAC nº 91, a descrição
  da aprovação de aeronavegabilidade será a mesma para todos os operadores.

  5.10

  Inclusão de item para esclarecer o encerramento compulsório do processo.'
