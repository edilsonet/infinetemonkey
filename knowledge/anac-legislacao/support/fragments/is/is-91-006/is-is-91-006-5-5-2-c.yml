section_title: 'Para obtenção de LOA NAT-HLA, os operadores regidos pelo RBAC nº 91, exceto
  Subparte K devem remeter à GTCE os seguintes documentos:'
subsection_id: c
cite: 5.5.2(c)
title: 5.5.2(c)
text: 'c) Comprovação de equipamentos da aeronave, conforme item 5.7.

  NOTA: A LOA é uma autorização do operador, de forma que aeronaves com mais de um operador
  podem:

  - ter mais de uma LOA;

  - ter LOA com mais de um operador autorizado; ou

  - serem autorizadas a operar PBN apenas com operadores específicos.

  5.5.3 Materialmente, o operador deverá adequar-se aos critérios operacionais e de aeronavegabilidade
  descritos nos itens a seguir desta IS. Em linhas gerais, pode-se afirmar que o operador
  obterá a aprovação NAT-HLA se demonstrar à ANAC que:'
