title: 5.6.2.3(c)
text: 'c) O operador deve padronizar uma simbologia para que os tripulantes indiquem, por
  meio de anotações no Master Document, o status de cada waypoint, incluindo no mínimo os
  seguintes status:

  I - waypoint inserido no FMS;

  II - waypoint crosschecado no FMS por um segundo tripulante, distinto do que inseriu os
  dados; e

  III - waypoint sobrevoado.'
