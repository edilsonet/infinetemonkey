title: 5.6.2.3(d)
text: d) Caso uma alteração da rota original seja realizada durante o voo, é recomendável
  que um novo Master Document seja elaborado; se isto não for possível, os tripulantes devem
  registrar as alterações no Master Document original, anotando claramente a exclusão dos
  waypoints da rota antiga e a inserção dos novos waypoints, de forma a evitar possível confusão
  entre as rotas.
