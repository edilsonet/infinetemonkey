title: 5.6.2.4(a)
text: 'a) Descrição de orientações para o despacho de voos no espaço aéreo NAT-HLA, incluindo:

  I - procedimentos para seleção de níveis de voo no espaço aéreo NAT-HLA;

  II - procedimentos para planejamento de rotas no espaço aéreo NAT-HLA (incluindo o uso de
  rotas OTS - Organised Track System);

  III - procedimentos para seleção de velocidades no espaço aéreo NAT-HLA;

  IV - descrição das especificidades do preenchimento de plano de voo para o espaço aéreo
  NAT-HLA; e

  V - procedimentos especiais para contingências em voo no espaço aéreo NAT-HLA.'
