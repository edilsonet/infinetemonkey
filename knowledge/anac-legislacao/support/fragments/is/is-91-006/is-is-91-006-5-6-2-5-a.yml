cite: 5.6.2.5(a)
title: 5.6.2.5(a)
text: a) Descrição de procedimento mandatório para que a tripulação realize, antes do voo
  e durante toda a operação no espaço aéreo NAT-HLA, cross-checks periódicos dos dados de
  navegação a fim de identificar possíveis erros e evitar desvios em relação à rota autorizada
  pelo ATC. Deve ser recomendado aos tripulantes atenção especial nesta verificação quando
  próximo do Equador ou do Meridiano de Greenwich, para assegurarem-se que as coordenadas
  geográficas utilizadas não foram inseridas de maneira equivocada (invertendo-se inadvertidamente
  norte e sul (N/S) ou leste e oeste (E/W)).
