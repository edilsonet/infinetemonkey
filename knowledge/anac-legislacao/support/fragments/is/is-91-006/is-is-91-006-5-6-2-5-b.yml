text: b) Descrição de um procedimento para que os tripulantes se assegurem de que a rota inserida
  nos sistemas de navegação da aeronave corresponde à rota autorizada pelo ATC, incluindo
  procedimento para que um dos tripulantes realize o cross-check completo da rota inserida
  pelo outro.
