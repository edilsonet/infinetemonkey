text: '5.6.2 Conteúdo do MGO

  5.6.2.1 O MGO do operador que pretenda realizar operações NAT-HLA deve incluir procedimentos
  específicos para aquele espaço aéreo, que sejam capazes de garantir que a operação se dê
  de maneira segura e adequada às peculiaridades operacionais NAT-HLA, conforme descrito no
  ICAO NAT Doc 007 ou documento que venha a substituí-lo.'
