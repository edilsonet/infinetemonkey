text: j) familiarização com as recomendações para reduzir erros oceânicos (“Recommendations
  to reduce oceanic errors”), disponíveis no “Oceanic Errors Safety Bulletin” publicado pela
  ICAO EUR/NAT. Este boletim pode ser encontrado na página www.icao.int/EURNAT/, clicando-se
  nos links “EUR/NAT Documents”, em seguida “NAT Documents”, e por fim “NAT OPS Bulletins”.
