text: '5.6.3 Conteúdo do PTO:

  5.6.3.1 O PTO do operador deve prever treinamento teórico inicial e periódico anual sobre
  as regras e procedimentos aplicáveis ao espaço aéreo NAT-HLA para todos os pilotos e despachantes
  operacionais de voo envolvidos neste tipo de operação.'
