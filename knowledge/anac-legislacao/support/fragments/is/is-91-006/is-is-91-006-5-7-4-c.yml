title: 5.7.4(c)
text: 'c) espaço aéreo com vigilância ATS através de radar, multilateração e/ou ADS-B acoplados
  com comunicação de voz VHF.

  5.8 Inspeções e demonstrações

  5.8.1 Previamente à obtenção da autorização NAT-HLA, a ANAC poderá requerer ao operador
  que demonstre sua capacidade para realizar operações no espaço aéreo NAT-HLA, por meio de
  um ou mais voos de avaliação operacional.

  5.8.2 A quantidade de voos e o cronograma serão definidos pela ANAC durante o processo de
  autorização, considerando fatores relevantes tais como a experiência prévia do operador
  em operações internacionais e oceânicas, o conhecimento demonstrado pelo operador na fase
  de análise documental e os critérios de vigilância amostral utilizados pela ANAC.

  5.9 Manutenção da autorização NAT-HLA

  Após obter a autorização NAT-HLA da ANAC, é responsabilidade do operador:

  I - monitorar continuamente as normas e informativos emitidos pelas autoridades de tráfego
  aéreo responsáveis pelo espaço aéreo NAT-HLA, a fim de identificar possíveis alterações
  de regras ou procedimentos que impactem suas operações; e

  II - monitorar continuamente o desempenho de suas operações naquela região, apurar erros
  e desvios de suas tripulações e providenciar, conforme necessário, melhorias em seus procedimentos
  e treinamentos a fim de evitar a repetição de tais erros.

  5.10 Encerramento Compulsório do Processo

  5.10.1 Caso a solicitação seja rejeitada pela 3 vez por não conformidade ou incapacidade
  de demonstração por parte do requerente, o processo será indeferido e arquivado compulsoriamente,
  independentemente do prazo.

  5.10.2 Os detentores de certificado de operador aéreo (COA) emitido segundo o RBAC nº 119
  terão o prazo máximo de 90 (noventa) dias para apresentar as ações requeridas durante qualquer
  fase do processo ou as respostas a cada comunicação de não conformidade.

  5.10.3 A não observância do prazo de 90 (noventa) dias, ou outro prazo eventualmente definido,
  sem qualquer manifestação por parte do requerente para a apresentação das ações requeridas,
  poderá caracterizar desistência e poderá ensejar o encerramento do processo.'
