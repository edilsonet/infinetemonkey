text: 'Apêndice B - Controle de Alterações


  ALTERAÇÕES REALIZADAS NA REVISÃO C

  ITEM

  ALTERADO

  ALTERAÇÃO REALIZADA

  5.3 e 5.4

  Alterado o item 5.3 para incluir a descrição do processo de aprovação seguindo as 5 fases,
  conforme as IS 119-001 e 119-004 e incluído o item 5.4 sobre a atuação dos representantes
  da organização requerente através do sistema de protocolo eletrônico SEI.'
