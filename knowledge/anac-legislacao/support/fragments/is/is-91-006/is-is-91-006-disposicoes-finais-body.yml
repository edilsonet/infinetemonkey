title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  Os casos omissos serão dirimidos pela SPO.

  Os operadores autorizados a operar NAT-HLA (ou NAT-MNPS) devem se adequar ao conteúdo desta
  IS, submetendo, se necessário, a documentação de acordo com os itens 5.5.1 e 5.5.2 desta
  IS, como aplicável, no prazo de 180 dias após a publicação desta IS, ou quando requerido
  pela ANAC.'
