text: '5.19.12 O todo ou partes dos atos praticados no curso do processo encerrado poderão
  ser aproveitados mediante petição fundamentada do operador.

  5.19.13 As ações requeridas em relação a aeronaves, cujos atos já tenham sido concluídos
  pelo Registro Aeronáutico Brasileiro, antes do indeferimento do processo, ficam desobrigadas
  no novo processo de certificação.'
