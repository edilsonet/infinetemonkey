title: OBJETIVO
text: 'OBJETIVO

  1.1 Estabelecer o processo no âmbito operacional para autorização de empresas de serviço
  aéreo especializado (SAE) regidas pelos RBAC nº 91, RBAC nº 136 e pela Resolução nº 659,
  de 2 de fevereiro de 2022, com exceção das operações aeroagrícolas e dos serviços de ensino
  e adestramento.

  Nota 1: embora as operações aeroagrícolas, de carga externa e os serviços de ensino e adestramento
  sejam considerados SAE pela Resolução nº 659/2022, tais serviços são objeto de regulamentação
  específica.'
