title: procedimentos(b)
text: 'b) que possui tripulante(s) devidamente habilitado(s) de acordo com o RBAC nº 61 e
  com certificado médico aeronáutico (CMA) válido de acordo com o RBAC nº 67. O(s) Código(s)
  ANAC do(s) tripulante(s) deve(m) ser indicado(s) no RVCO; e

  Nota: caso a habilitação ou CMA de um tripulante esteja vencido no momento da apresentação
  do RVCO, a empresa deverá assegurar a revalidação até a fase de inspeções e demonstrações,
  caso seja necessária a operação deste tripulante, ou após a emissão do COA, para a efetiva
  realização de suas operações.'
