text: 'procedimentos

  5.1 Para a autorização de serviços aéreos especializados (SAE) previstos nesta IS, o requerente
  deve encaminhar à Gerência Técnica de Certificação de Empresas (GTCE), o Requerimento de
  Verificação de Condições Operacionais (RVCO) devidamente preenchido, juntamente com manuais
  e documentos requeridos para a modalidade pretendida, de acordo com esta IS.

  5.2 O RVCO deve ser entregue em meio eletrônico diretamente pelo sistema de protocolo digital,
  endereçado à GTCE.

  Nota: o processo eletrônico da ANAC está previsto na Resolução nº 520/2019, ou norma que
  venha a substituí-la, e maiores informações podem ser consultadas no seguinte endereço eletrônico:
  https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.3 Para garantir a efetividade da comunicação entre ANAC e o requerente durante o decorrer
  das fases do processo de autorização, o requerente deverá providenciar o adequado cadastro
  no sistema de protocolo eletrônico da agência (SEI), incluindo a indicação de responsável
  legal da pessoa jurídica e, se necessário, de procuradores, que serão responsáveis pelo
  fornecimento das informações solicitadas por meio de intimação eletrônica. Maiores informações
  encontram-se no Guia de Protocolo Eletrônico, disponível em https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei/01-guia-protocolo-eletronico.

  Nota: os formulários e documentos padronizados a serem utilizados serão sempre os disponibilizados
  pela ANAC no Sistema Eletrônico de Informações (SEI) e deverão sempre ser preenchidos e
  assinados no próprio SEI.

  5.4 O requerente deve enviar para a GTCE manuais e documentos que demonstrem que a empresa
  cumpre com os seguintes requisitos:'
