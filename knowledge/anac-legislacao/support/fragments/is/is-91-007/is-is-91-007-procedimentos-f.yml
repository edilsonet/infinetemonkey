title: procedimentos(f)
text: 'f) diários de bordo: cópias das páginas de diário das aeronaves da frota dos 30 (trinta)
  dias anteriores à solicitação de envio das evidências. Caso uma aeronave não tenha realizado
  voo nesse período, deve ser enviada cópia da última página referente ao último voo realizado.

  5.11 A ANAC poderá complementar ou reduzir a lista de evidências dependendo da complexidade
  das operações pretendidas, do porte e do histórico do operador.

  5.12 Para a etapa de demonstrações operacionais e entrevistas por videoconferência, a empresa
  requerente será solicitada a informar datas disponíveis para agendamento de videoconferência
  com a participação do pessoal de administração chave da empresa. Nessa oportunidade, serão
  realizadas entrevistas com o objetivo de realizar verificações adicionais sobre o cumprimento
  de requisitos previstos na legislação aplicável a cada modalidade de SAE.

  5.13 A critério da ANAC, dependendo da modalidade de SAE solicitada, poderão ser definidos
  procedimentos para o agendamento de demonstração real da operação, na modalidade à distância,
  por plataforma de videoconferência.

  5.14 Para a etapa de inspeções e demonstrações presenciais, a empresa requerente será solicitada
  a informar datas disponíveis para agendamento de uma inspeção in loco nas dependências do
  operador, ou nos locais de operação, dependendo da modalidade de SAE solicitada e das características
  da empresa.

  5.15 O agendamento das inspeções e demonstrações, remotas ou presenciais, se dará de acordo
  com a disponibilidade e conveniência da empresa requerente e da equipe de servidores da
  ANAC.

  5.16 Após a conclusão satisfatória da fase de inspeções e demonstrações, a ANAC prosseguirá
  com a emissão do Certificado de Operador Aéreo (COA) e as respectivas Especificações Operativas
  (EO), nos quais serão descritas as atividades e aeronaves autorizadas. O processo será finalizado
  com a publicação de portaria que torna público o cumprimento dos requisitos para a exploração
  do serviço aéreo.

  Nota: somente após a publicação da Portaria no Diário Oficial da União, a empresa poderá
  dar início à prestação dos serviços aéreos especializados nas atividades requeridas.

  5.17 O COA será emitido com uma identificação no formato “AAAA-MM-OCCC-NN-RR”, cujo significado
  é o seguinte:

  - AAAA: ano de emissão do certificado;

  - MM: mês de emissão do certificado;

  - O: número indicativo do órgão emissor da ANAC;

  - CCC: código de três letras referente à empresa aérea atribuído pela ANAC;

  - NN: número sequencial do certificado dentro do mês; e

  - RR: número da revisão do COA com dois dígitos, sendo 00 para edição original;

  5.18 Emolumentos

  5.18.1 As TFAC aplicáveis ao processo de certificação estão previstas na Resolução nº 653,
  de 20 de dezembro de 2021, regulamentada pela Portaria nº 8.676, de 25 de julho de 2022.

  5.18.2 As orientações sobre a aplicabilidade das TFAC e sobre a geração das respectivas
  guias de recolhimento da união (GRU) podem ser encontradas no sítio da ANAC, por meio do
  seguinte endereço eletrônico: https://www.gov.br/anac/pt-br/sistemas/novas-tfac.

  5.19 Encerramento compulsório do processo de autorização

  5.19.1 Para cada manual, programa ou documento, caso uma proposta seja rejeitada pela 3ª
  vez durante a análise, o processo relacionado a essa proposta será indeferido e arquivado
  compulsoriamente, independentemente do prazo.

  5.19.2 Nos casos em que a rejeição de um documento, manual ou programa for motivada pela
  atualização de um regulamento, publicação técnica do fabricante ou autoridade de aviação
  civil, ou qualquer documento de referência para análise do material, não haverá contabilização
  dessa iteração para fins de arquivamento do processo específico.

  5.19.3 Caso a inspeção ou demonstração da execução de um determinado procedimento ou operação
  seja rejeitada pela 3ª vez por não-conformidade ou incapacidade de demonstração por parte
  do requerente, o processo de certificação será indeferido e arquivado compulsoriamente,
  independentemente do prazo.

  5.19.4 A organização requerente de um COA terá sempre o prazo de 90 (noventa) dias para
  apresentar as ações requeridas durante qualquer fase do processo de autorização ou às respostas
  a cada comunicação de não-conformidade.

  5.19.5 A não observância do prazo de 90 (noventa) dias, ou outro prazo eventualmente definido,
  sem qualquer manifestação por parte do requerente para a apresentação das ações requeridas,
  caracterizará desistência e ensejará o encerramento do processo de autorização.

  5.19.6 A descontinuidade ou desistência do processo de autorização implicará o seu indeferimento
  e arquivamento, inclusive de processos correlatos, tornando nula qualquer autorização que
  já tenha sido concedida pela ANAC durante o processo.

  5.19.7 Um processo encerrado não pode ser reaberto, tampouco documentos contidos nele podem
  ser reutilizados, exceto por decisão de reconsideração, assegurado o direito de ampla defesa
  e do contraditório.

  5.19.8 Para as decisões da ANAC, é assegurado ao requerente o direito de ampla defesa e
  do contraditório. Os recursos devem ser direcionados à autoridade que emitiu a decisão,
  que poderá remetê-los às instâncias superiores.

  5.19.9 O prazo para a apresentação de recurso contra as decisões da ANAC, é de 10 dias a
  contar da ciência da decisão, conforme previsto na Lei nº 9.784/99 (Lei do processo administrativo).

  5.19.10 Em caso de não conhecimento ou indeferimento do recurso, o requerente será comunicado
  sobre a decisão e ratificação de indeferimento e arquivamento do processo.

  5.19.11 Caso exista interesse da organização requerente, esta deverá dar início a um novo
  processo de autorização, que será conduzido em conformidade com os procedimentos apresentados
  nesta IS.'
