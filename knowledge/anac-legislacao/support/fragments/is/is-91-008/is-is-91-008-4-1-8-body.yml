text: '4.1.8 Passagem baixa: sobrevoo no eixo da pista de pouso e decolagem em uso abaixo
  da altura mínima;

  4.1.9 Público: grupo de pessoas que esteja participando do evento aéreo como espectadores,
  assistindo aos shows aéreos em área delimitada pelos organizadores ou em área pública nas
  adjacências do box de acrobacia;

  4.1.10 Voo em formação: compreende um grupo de duas ou mais aeronaves, voando intencionalmente
  próximas, executando manobras em sincronia, caracterizando um conjunto único de voo;

  4.1.11 Voo em performance: voos de demonstração aérea nas quais os pilotos procuram demonstrar
  o desempenho e as qualidades de voo das aeronaves, dentro dos limites do seu envelope de
  voo; e'
