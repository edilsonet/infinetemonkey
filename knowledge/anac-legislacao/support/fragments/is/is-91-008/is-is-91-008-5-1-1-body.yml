title: Os eventos aéreos serão classificados em eventos de baixa ou de alta complexidade.
text: '5.1.1 Os eventos aéreos serão classificados em eventos de baixa ou de alta complexidade.

  5.1.2 O evento aéreo de baixa complexidade é aquele em que o público não tenha acesso à
  área operacional (lado ar); e que tenha a participação de apenas um piloto ou uma esquadrilha
  durante todo o evento.'
