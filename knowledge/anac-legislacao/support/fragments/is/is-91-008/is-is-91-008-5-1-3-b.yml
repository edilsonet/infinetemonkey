section_title: O evento aéreo de alta complexidade é aquele que não cumpra integralmente os
  requisitos para enquadramento como evento aéreo de baixa complexidade.
subsection_id: b
cite: 5.1.3(b)
title: 5.1.3(b)
text: 'b) ter participado, nos últimos 5 (cinco) anos, de pelo menos 3 (três) eventos aéreos,
  como piloto, membro da comissão organizadora, ou como substituto.

  5.2.4.1 Caso o indicado não atenda aos requisitos de experiência requeridos acima, o Coordenador
  Geral pode enviar requerimento fundamentado, contendo o currículo do candidato, o qual poderá
  ou não ser aprovado pela ANAC.'
