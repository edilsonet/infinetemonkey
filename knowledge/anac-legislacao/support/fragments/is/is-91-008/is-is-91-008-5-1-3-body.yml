text: '5.1.3 O evento aéreo de alta complexidade é aquele que não cumpra integralmente os
  requisitos para enquadramento como evento aéreo de baixa complexidade.

  5.1.4 Qualquer pessoa física ou jurídica pode promover um evento aéreo desde que obtenha
  da ANAC e das demais autoridades competentes as devidas autorizações. A presente IS versa
  exclusivamente sobre questões operacionais de competência da ANAC. Demais autorizações,
  como alvarás ou documentos equivalentes, se aplicáveis, devem ser providenciadas conforme
  definidos pelas autoridades.

  5.1.5 Eventos aéreos que também tenham a previsão de operações de balões livres tripulados,
  dirigíveis, aeronaves ultraleves regidas pelo RBAC nº 103, salto de paraquedas regido pelo
  RBAC nº 105 e/ou planadores devem prever coordenação destas operações com as demais operações
  do evento, sob responsabilidade do Coordenador Geral.

  5.1.6 O processo de autorização de evento aéreo se inicia com o preenchimento do “Formulário
  de Solicitação de Evento Aéreo - (FSEA)” no SEI juntamente com a documentação pertinente
  por parte do interessado, conforme a complexidade do evento.

  5.1.7 Para garantir que as análises necessárias sejam concluídas em tempo hábil para a realização
  do evento, o requerente deve encaminhar toda a documentação prevista nesta IS com pelo menos
  30 (trinta) dias de antecedência para a data prevista para o início do evento. No caso de
  haver de haver a participação de pilotos com licença/habilitação emitida por autoridade
  estrangeira, o prazo deve ser estendido para 60 (sessenta) dias, para cumprimento do parágrafo
  5.5.8 desta IS.

  5.1.8 O prazo indicado no parágrafo 5.1.7 é referente apenas ao processo conduzido pela
  ANAC. Os prazos para processos e ações requeridas pelo DECEA devem ser verificados diretamente
  junto àquele órgão.

  5.2 Comissão Organizadora dos Eventos de Alta Complexidade

  5.2.1 O requerente do evento de alta complexidade deve estabelecer uma comissão organizadora
  composta por um Coordenador Geral, Diretor de Operações e Segurança de Voo e um Diretor
  de Infraestrutura. Esta comissão será a responsável junto à ANAC pelo cumprimento das normas
  e regulamentos e pelo Formulário de Solicitação de Evento Aéreo (FSEA) proposto.

  5.2.2 Cada membro da comissão organizadora terá funções específicas, não cabendo acúmulo.
  No entanto, é permitida a participação ativa desses membros nas exibições aéreas. Nesse
  caso, deverá ser designado formalmente, por meio de termo de designação, um substituto,
  que assumirá as prerrogativas do membro da comissão em solo, pelo tempo em que o membro
  titular estiver em voo. A pessoa designada deve possuir as qualificações de acordo com os
  requisitos dessa IS, conforme aplicável, e deve ser capaz de assumir as responsabilidades
  a ela delegadas.

  5.2.3 Responsabilidades do Coordenador Geral - é o principal membro da comissão e representa
  o requerente do evento e todos os participantes perante as autoridades, além de coordenar
  as atividades dos outros membros da comissão. Cabe ao Coordenador Geral:'
