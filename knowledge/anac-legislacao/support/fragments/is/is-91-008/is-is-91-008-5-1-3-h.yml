text: 'h) encaminhar relatório do evento aéreo (conforme parágrafo 5.10 desta IS), contendo
  informações relevantes sobre as operações aéreas, movimentação de aeronaves, segurança aeroportuária,
  segurança do público e dificuldades em serviço à ANAC em, no máximo, 30 (trinta) dias após
  o encerramento do evento.

