title: 5.2.5(a)
text: a) planejar e controlar o acesso e circulação do público presente ao evento, como expositores,
  viaturas, tripulantes e qualquer outro pessoal na área do evento, com especial atenção para
  que rotas de acesso/saída de emergência dentro das áreas delimitadas para o evento permaneçam
  desobstruídas durante todo o tempo;
