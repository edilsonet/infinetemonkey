title: 5.2.5(d)
text: d) planejar e executar um briefing com as equipes de segurança, bombeiros e médicos
  que atuarão diretamente no evento, identificando procedimentos de resposta às emergências.
  Caso o responsável pelo evento ou o administrador aeroportuário julguem necessário, um exercício
  simulado de resposta às emergências pode ser realizado;
