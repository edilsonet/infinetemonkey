subsection_id: f
cite: 5.2.5(f)
title: 5.2.5(f)
text: 'f) em eventos com duração superior a um dia, realizar ao fim de cada dia uma reunião
  com seu pessoal subordinado visando identificar e corrigir falhas na segurança ocorridas
  no transcorrer do dia.

  5.3 Comissão Organizadora dos Eventos de Baixa Complexidade.

  5.3.1 O requerente do evento aéreo de baixa complexidade deve estabelecer uma comissão organizadora
  composta por um Coordenador geral e um Diretor de Operações e Segurança de voo. Esta comissão
  será a responsável junto à ANAC, pelo cumprimento das normas e regulamentos e pelo Formulário
  de Solicitação de Evento Aéreo (FSEA) proposto.'
