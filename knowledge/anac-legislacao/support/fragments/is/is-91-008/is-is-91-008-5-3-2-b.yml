subsection_id: b
cite: 5.3.2(b)
title: 5.3.2(b)
text: b) assinar o Termo de Responsabilidade do Diretor de Operações e Segurança de Voo (conforme
  modelo disponibilizado em https://www.gov.br/anac/pt-br/assuntos/regulados/operadores-privados/modelos-e-formularios),
  em que assume a escolha, a verificação da proficiência técnica dos tripulantes convidados/contratados
  pela organização para se apresentarem no evento;
