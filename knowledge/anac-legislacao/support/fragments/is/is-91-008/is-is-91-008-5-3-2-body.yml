text: '5.3.2 O Diretor de Operações e Segurança de Voo deve cumprir os requisitos constantes
  no parágrafo 5.2.4 desta IS.

  5.3.3 É permitido o acúmulo de funções, se necessário, desde que o candidato atenda aos
  requisitos e assuma as responsabilidades aplicáveis a ambas as funções..

  5.3.4 É permitida a participação ativa desses membros nas exibições aéreas. Nesse caso,
  a organização deve avaliar a necessidade de designar formalmente um substituto para a devida
  coordenação e atividades no solo.

  5.3.5 Responsabilidades do Coordenador geral em eventos de baixa complexidade - É o principal
  membro da comissão e representa o requerente do evento e todos os participantes perante
  as autoridades, além de coordenar as atividades dos outros membros da comissão. Cabe ao
  Coordenador Geral:'
