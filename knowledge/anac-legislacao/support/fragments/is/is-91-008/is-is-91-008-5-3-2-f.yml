title: 5.3.2(f)
text: f) definir local adequado para o funcionamento de um centro de operações de emergência
  e gerenciamento de crises, em coordenação com o diretor de infraestrutura ou equivalente,
  com a finalidade de coordenar as ações necessárias em caso de acidente envolvendo aeronave
  e/ou público, se aplicável;
