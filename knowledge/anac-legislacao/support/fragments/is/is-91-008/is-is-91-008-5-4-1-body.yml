title: Escolha do local.
text: '5.4.1 Escolha do local.

  5.4.1.1 A área destinada ao público deve ser claramente definida. O Coordenador Geral do
  evento deve garantir as formas e meios de evacuação segura do público espectador em caso
  de emergência. Em eventos de baixa complexidade, o Coordenador Geral deverá dar ciência
  aos responsáveis pelo evento sobre a possível necessidade de evacuação em caso de emergências.
  A avaliação e escolha do local do evento deve levar em consideração:

  5.4.1.2 Um aeroporto/aeródromo é o ambiente ideal para realização de demonstrações aéreas/eventos
  aéreos. Se o aeroporto local comporta as distâncias de separação mínima requeridas, ele
  deve ser considerado como primeira opção de local para realização de um evento aéreo, além
  de oferecer infraestrutura para atendimento dos pilotos participantes.

  5.4.1.3 Caso um aeroporto/aeródromo não possa ser utilizado como local para realização de
  um evento aéreo, outros locais podem ser considerados para sua realização, como um campo
  aberto, às margens de um lago ou à beira mar.

  5.4.1.4 Se o local escolhido não comportar as distâncias mínimas de separação previstas,
  não será autorizada a realização do evento. É importante que o local escolhido comporte
  todas as operações aéreas pretendidas sem comprometimento da segurança de voo e do público
  em solo.

  5.4.1.5 A maioria das facilidades de suporte e serviços são encontradas em aeroportos/aeródromos.
  Adicionalmente, as grandes áreas abertas nesses locais proporcionam melhor visibilidade
  dos voos executados ao público espectador. Pilotos também preferem operar em aeroportos/aeródromos
  por oferecerem melhores condições de acesso às pistas e áreas de escape que permitam um
  pouso de emergência.

  5.4.1.6 Deve-se atentar para as possíveis necessidades de fechamento de pátios de estacionamento,
  pistas de táxi e acessos aeroportuários pelo período total e/ou parcial de duração do evento
  tanto para montagem de infraestrutura, quanto para acomodação de público espectador, entre
  outras necessidades. O impacto dessas necessidades deve ser levado em consideração na avaliação
  e escolha do local para realização do evento aéreo e ser coordenado em conjunto com a administração
  aeroportuária.'
