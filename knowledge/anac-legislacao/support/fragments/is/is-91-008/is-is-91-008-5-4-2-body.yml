title: Controle de tráfego aéreo.
text: '5.4.2 Controle de tráfego aéreo.

  5.4.2.1 Se o local do evento for provido de torre de controle de tráfego aéreo, as comunicações
  serão coordenadas pelo órgão de tráfego aéreo. Em localidades onde houver operação de transporte
  aéreo regular, a programação dos voos do evento deve conter intervalos para a chegada e
  partidas desses voos. A coordenação deve ser realizada de acordo com NOTAM previamente autorizado
  e em conjunto com o controle de tráfego aéreo disponível durante o evento.

  5.4.2.2 Para eventos de alta complexidade, deve estar descrito no Formulário de Solicitação
  de Evento Aéreo (FSEA) como será feito o controle de tráfego aéreo e coordenação de solo
  durante a realização do evento.'
