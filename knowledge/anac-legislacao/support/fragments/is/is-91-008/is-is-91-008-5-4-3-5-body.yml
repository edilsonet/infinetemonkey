text: '5.4.3.5 Para aeronaves decolando ou pousando, a distância horizontal mínima da pista
  de decolagem para o público, deve ser de 60 metros.

  Nota: a incapacidade em manter a distância mínima requerida da show line pode limitar os
  tipos de aeronaves utilizadas e manobras que podem ser realizadas em um evento aéreo. É
  imperativo que no início do planejamento o Diretor de Operações e Segurança de Voo considere
  a performance das aeronaves utilizadas e manobras que serão realizadas, garantindo que a
  apresentação proposta esteja dentro dos padrões aqui definidos.'
