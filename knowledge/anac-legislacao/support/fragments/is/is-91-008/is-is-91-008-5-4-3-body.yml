cite: 5.4.3
title: Estabelecimento da show line.
text: '5.4.3 Estabelecimento da show line.

  5.4.3.1 A show line é uma linha imaginária que delimita a separação do público do local
  onde ocorrem as demonstrações aéreas. Deve ser posicionada distante no mínimo 150 metros
  do local destinado ao público, com exceção para a realização de passagens baixas conforme
  o parágrafo 5.4.3.3 desta IS. Essa linha não deve ser ultrapassada durante as apresentações.

  Nota: recomenda-se que a show line seja estabelecida após a escolha do local destinado ao
  público.

  5.4.3.2 É extremamente importante que a show line esteja claramente definida para os pilotos
  durante as operações e que esses pilotos possuam meios necessários, visuais ou instrumentais,
  para garantir que não ultrapassarão a show line durante as apresentações.

  5.4.3.3 Passagens baixas podem ser autorizadas em distância inferior a 150 metros do público
  caso sejam realizadas somente no eixo da pista de pouso e decolagem e sem a execução de
  acrobacias. Em qualquer hipótese, a distância mínima entre as aeronaves e o público deve
  ser igual ou superior a 60 metros.

  5.4.3.4 Durante a execução de manobras em eixo perpendicular ao local do público, o ponto
  de recuperação da manobra deve estar antes da show line, a fim de mitigar o risco inerente
  à projeção de energia em direção ao público.'
