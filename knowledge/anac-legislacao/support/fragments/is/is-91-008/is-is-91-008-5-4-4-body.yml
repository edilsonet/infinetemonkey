title: Estabelecimento da low line
text: '5.4.4 Estabelecimento da low line

  5.4.4.1 A low line deve ser estabelecida pelo Diretor de Operações e Segurança de Voo de
  acordo com a experiência e treinamento dos pilotos participantes do evento, podendo ser
  definida individualmente ou por grupos, caso necessário.

  5.4.4.2 Para as exibições em box de acrobacias localizado sobre áreas que possuam qualquer
  tipo de edificação, inclusive linhas de transmissão, torres de telecomunicações, edifícios
  desabitados, entre outros, além do previsto nesta IS para utilização dessas áreas, a low
  line deve levar em consideração a altura das edificações presentes, não sendo permitidos
  voos de acrobacia, voos em formação ou passagens baixas em altura inferior ao ponto mais
  alto das edificações sob o box.'
