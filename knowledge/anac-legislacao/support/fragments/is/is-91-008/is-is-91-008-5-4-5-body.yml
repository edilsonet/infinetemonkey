title: Estabelecimento do box de acrobacia
text: '5.4.5 Estabelecimento do box de acrobacia

  5.4.5.1 A organização do evento deve estabelecer uma área tridimensional, com limites claramente
  definidos, destinada à evolução acrobática ou na qual as aeronaves em voos de acrobacia
  possam atingir limites mais elevados de inclinação e velocidade ou características especiais
  de performance. O responsável deve definir o box de acrobacias de maneira clara utilizando-se
  de coordenadas geográficas, fotos aéreas, croquis, mapas ou referências no solo. Após aprovado,
  deve ser apresentado com antecedência aos pilotos e tripulações envolvidas, de maneira que
  estes possam planejar de forma segura seus voos.

  5.4.5.2 O box para a realização do evento deve comportar a distância mínima de 150 metros
  de separação horizontal entre qualquer ponto e o público espectador, áreas habitadas ou
  de edificações ocupadas.

  5.4.5.3 O box de acrobacia deve ser facilmente identificável pelo piloto em voo, seja por
  pontos de referência em terra, ou por instrumentos de voo. Caso a aeronave não possua tecnologia
  embarcada suficiente para permitir essa distinção, a organização do evento deve promover
  a instalação de sinalização em solo que seja facilmente visualizável pelo piloto em voo,
  para balizar os limites do box e show line.

  5.4.5.4 O Coordenador Geral deve garantir que estradas, rodovias e estacionamentos sob o
  box de acrobacias aéreas, estejam livres de tráfego veicular, qualquer público e pessoas
  que não estejam diretamente envolvidas com as operações de voo, durante todo o momento das
  apresentações, podendo haver livre circulação nos demais horários.

  5.4.5.5 Exceto se excepcionalmente autorizado pela ANAC, o box de acrobacias deve ser localizado
  sobre área desabitada, livre de pessoas e fora de áreas proibidas ou restritas.

  5.4.5.6 Quando não for possível delimitar um box livre de edificações, a organização do
  evento deverá contatar os donos/ocupantes de cada uma das respectivas edificações, a fim
  de obter garantia formal, de que os locais estarão desocupados durante a realização das
  apresentações. A garantia formal deverá ser composta por um plano de gerenciamento de risco
