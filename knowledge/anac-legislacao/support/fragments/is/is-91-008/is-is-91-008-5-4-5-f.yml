text: 'f) assinatura do(s) ocupante(s) da edificação.

  5.4.5.7 A admissibilidade do box configurado na forma do parágrafo 5.4.5.6 e do gerenciamento
  de risco serão avaliados pela ANAC previamente durante o processo de autorização do evento.
  Toda a documentação relativa ao gerenciamento de risco deverá ser anexada ao formulário
  de autorização do evento, incluindo cópias das declarações constantes no referido parágrafo.

  5.4.5.8 Quando o box estiver delimitado sobre locais de eventos, como pistas de kartódromos,
  autódromos, estádios esportivos ou similares, o Diretor de Operações e Segurança de Voo
  deve garantir que no momento da apresentação aérea, as pistas e locais sob o box estarão
  livres da presença de pessoas que não estejam diretamente envolvidas com as operações de
  voo.

  5.4.5.9 Durante o curso do processo, a ANAC poderá solicitar informações técnicas adicionais,
  inclusive sobre a performance das aeronaves utilizadas, que demonstrem que as dimensões
  e a localização do box estão adequadas às apresentações propostas.

  Nota: fora do box de acrobacia somente é permitida a execução de voo normal, respeitando-se
  os regulamentos de tráfego aéreo, exceto no caso previsto no parágrafo 5.4.3.3.'
