text: '5.4.6.2 O número de pessoas envolvidas na segurança do evento deve ser proporcional
  ao tamanho do público espectador.

  5.4.6.3 Deve ser proibida a permanência de pessoas que não estejam diretamente envolvidas
  com as operações de acordo com a programação do evento, sendo a permanência no lado ar permitido
  apenas aos pilotos realizando atividades necessárias pré-voo e pós voo, e pessoal técnico
  necessário ao evento.

  5.4.6.4 O Coordenador Geral deve garantir que, mesmo após o encerramento das atividades
  aéreas do dia, a equipe de segurança mantenha o controle de acesso para garantir a segregação
  entre lado ar e lado terra.

  5.5 Seleção dos pilotos e aeronaves participantes

  5.5.1 Cabe ao Diretor de Operações e Segurança de Voo a responsabilidade por escolher e
  atestar a proficiência e a capacidade técnica dos pilotos que executarão operações aéreas
  durante o evento.

  5.5.2 O Diretor de Operações e Segurança de Voo é o responsável por manter uma lista atualizada
  dos pilotos e aeronaves participantes do evento, garantindo que toda a documentação esteja
  regular e atendendo aos requisitos necessários para as operações que serão realizadas.

  5.5.3 O Diretor de Operações e Segurança de Voo poderá incluir ou excluir pilotos e/ou aeronaves
  da programação do evento, desde que um evento de baixa complexidade não tenha a sua classificação
  modificada para alta complexidade e que as operações autorizadas pela ANAC não sejam alteradas.'
