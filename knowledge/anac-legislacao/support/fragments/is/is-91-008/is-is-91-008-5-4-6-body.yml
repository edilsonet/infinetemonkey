title: Controle de acesso à área de movimento em aeródromos.
text: '5.4.6 Controle de acesso à área de movimento em aeródromos.

  5.4.6.1 O Coordenador Geral do evento aéreo deve promover os meios para garantir que a área
  de movimento não seja acessada por pessoal não autorizado e sem identificação ostensiva,
  devendo haver barreira física e um procedimento de segurança a fim de confinar o público
  no local previsto no croqui do evento.'
