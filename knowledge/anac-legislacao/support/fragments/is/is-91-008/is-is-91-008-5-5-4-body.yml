cite: 5.5.4
title: Caso haja interesse ou necessidade em modificar a complexidade do evento ou autorização
  emitida, deve ser instaurado novo processo junto à ANAC.
text: '5.5.4 Caso haja interesse ou necessidade em modificar a complexidade do evento ou autorização
  emitida, deve ser instaurado novo processo junto à ANAC.

  5.5.5 Cada piloto deve enviar para o Diretor de Operações e Segurança de Voo cópias das
  documentações necessárias para comprovação da situação técnica da aeronave, de suas habilitações
  e CMA.

  5.5.6 No dia da apresentação todos os pilotos participantes deverão apresentar a documentação
  prevista nos regulamentos para vistoria técnica por parte do Diretor de Operações e Segurança
  de Voo, a fim de garantir que estão regulares para as operações.

  Nota: poderá ser utilizada a IS nº 00-009 para orientar sobre a documentação necessária.

  5.5.7 O Diretor de Operações e Segurança de Voo deve estabelecer um procedimento para verificação
  da documentação das aeronaves e dos pilotos participantes antes do início do evento. Tal
  procedimento e cópia da documentação utilizada para a verificação devem ser mantidos por
  6 meses para eventual verificação da ANAC.

  5.5.8 Para pilotos com licença/habilitação emitida por autoridade estrangeira, a organização
  deve solicitar à ANAC, com antecedência mínima de 60 dias da data de início do evento, autorização
  para a participação de tripulação estrangeira tripulando aeronave com matrícula de país
  que emitiu ou convalidou a licença/habilitação, disponibilizando as licenças e habilitações
  estrangeiras para exame. A critério da ANAC, poderá ser exigido a comprovação de requisitos
  conforme a legislação do país emissor da habilitação.

  5.6 Disposições Gerais

  5.6.1 O detentor de uma autorização da ANAC para realização de um evento aéreo é responsável
  pela segurança de pessoas e bens na superfície pelo período de realização do evento.

  5.6.2 O detentor de uma autorização da ANAC para realização de um evento aéreo deve garantir
  que os participantes, tanto de solo quanto de operações de voo, sejam instruídos sobre seus
  trabalhos e atribuições antes do início das atividades. Deve ser vedada a participação de
  pessoas sem a devida instrução.

  5.6.3 O detentor de uma autorização da ANAC para realização de um evento aéreo deve solicitar
  a emissão do respectivo NOTAM diretamente ao DECEA. Os prazos para a emissão do NOTAM devem
  ser verificados diretamente junto àquele órgão.'
