text: '5.6.4 Quaisquer aeronaves e pilotos civis estarão passíveis de serem inspecionadas
  pela ANAC a qualquer tempo.

  5.6.5 Somente a tripulação mínima prevista no certificado de aeronavegabilidade ou em documento
  equivalente deve estar a bordo durante os voos de acrobacia e demonstração, com exceção
  das pessoas devidamente cientificadas dos riscos da operação e que tenham dado a sua anuência
  expressa aceitando esse risco.

  Nota: informação sobre a tripulação mínima também poderá ser obtida por meio de consulta
  aos sistemas da ANAC, como o Registro Aeronáutico Brasileiro on-line.

  5.5.6 As operações aéreas deverão ser suspensas a interesse da segurança, caso qualquer
  pessoa, veículo ou aeronave não autorizados entre na área operacional. Somente o pessoal
  necessário pode adentrar a área operacional, sendo o Coordenador Geral juntamente com o
  Diretor de Infraestrutura responsáveis pelo devido controle de acesso.

  5.5.7 A ANAC tem autoridade para suspender, cancelar ou excluir qualquer ou todas as atividades,
  de solo e operacionais, caso haja perigo para pessoas e bens no solo ou a autorização emitida
  seja descumprida.

  5.7 Operação de aeronaves remotamente pilotadas (RPA) e aeromodelos'
