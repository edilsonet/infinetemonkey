text: '5.7.2 Durante eventos aéreos, somente podem ser operados RPA e aeromodelos em conformidade
  com o RBAC-E nº 94.

  5.7.3 A operação de aeronaves acima de 25kg somente pode ser efetuada dentro de local previamente
  definido pela organização e apresentando no formulário de solicitação do evento, sendo vedada
  a operação simultânea com aeronaves tripuladas, exceto se autorizado pela ANAC.

  5.7.4 A operação simultânea de RPA e aeronaves tripuladas pode ser utilizada para o fim
  de captação de imagens, desde que a operação seja previamente combinada entre os pilotos
  de todas as aeronaves envolvidas e a organização do evento.

  5.8 Informações sobre o Briefing

  5.8.1 O Diretor de Operações e Segurança de voo deve planejar e executar diariamente um
  briefing em local livre de barulhos e distrações, onde apenas estejam presentes, preferencialmente,
  os pilotos participantes e pessoal chave para a segurança das operações. Deve haver registro
  de realização do briefing, com registro de presença dos participantes.'
