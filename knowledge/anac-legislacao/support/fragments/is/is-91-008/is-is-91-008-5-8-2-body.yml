text: '5.8.2 Os tripulantes que não comparecerem ao(s) briefing(s) e não registrarem a presença
  não podem participar das atividades aéreas do dia.

  5.8.3 Em eventos com duração superior a um dia, é necessário realizar ao fim de cada dia
  uma reunião com as equipes que trabalharam no evento, visando identificar e corrigir eventuais
  falhas na segurança ocorridas no transcorrer do dia.'
