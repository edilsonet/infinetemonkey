title: 5.9.2(e)
text: 'e) termo de Responsabilidade do Diretor de Operação e Segurança de Voo.

  5.10 Relatório do evento aéreo

  5.10.1 O Coordenador Geral deve preencher o relatório do evento aéreo, conforme modelo disponível
  em https://www.gov.br/anac/pt-br/assuntos/regulados/operadores-privados/modelos-e-formularios,
  e enviar à ANAC em até 30 (trinta) dias após o término do evento.

  5.10.2 Caso o relatório não seja enviado ou informações sejam omitidas, o Coordenador Geral
  estará sujeito a providências administrativas de acordo com a regulamentação vigente.'
