title: OBJETIVO
text: 'OBJETIVO

  1.1. Esta IS tem por finalidade padronizar procedimentos para eventos aéreos envolvendo
  pilotos e aeronaves civis para um público específico, de forma que essas atividades sejam
  executadas com a máxima segurança, tanto para os pilotos quanto para o público, conforme
  previsto na seção 91.303 do RBAC nº 91.

  1.2. Esta IS aplica-se a eventos aéreos que envolvam aeronaves de asa fixa e/ou rotativa,
  excetuando-se os eventos aéreos que envolvam somente balões livres tripulados, dirigíveis,
  aeronaves ultraleves regidas pelo RBAC nº 103, salto de paraquedas regido pelo RBAC nº 105
  e campeonatos de planadores.

  1.3. Esta IS não se aplica a acrobacias e demonstrações aéreas conduzidas exclusivamente
  por uma ou mais Forças Armadas do Brasil, quando não houver a participação de pilotos ou
  aeronaves civis.'
