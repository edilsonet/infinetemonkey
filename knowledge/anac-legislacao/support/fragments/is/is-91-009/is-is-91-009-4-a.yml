title: 4(a)
text: 'a) ALD: Actual Landing Distance. Distância necessária para pousar e frear a aeronave

  até a parada total, após cruzar a cabeceira da pista a 50 pés. Não inclui nenhum fator

  adicional de margem de segurança, e representa o melhor desempenho da aeronave

  para as respectivas condições de pouso;'
