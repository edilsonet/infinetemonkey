text: 'b) informações e reportes meteorológicos: informes meteorológicos relativos a

  condições observadas. No Brasil, são considerados informes ou reportes

  meteorológicos de aeródromo: METAR, SPECI, Aviso de Aeródromo e Aviso de

  Cortante de Vento;'
