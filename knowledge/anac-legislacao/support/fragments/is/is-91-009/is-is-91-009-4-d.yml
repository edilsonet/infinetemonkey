text: 'd) pavimento antiderrapante: pavimento que possui ranhuras transversais

  (grooving), camada porosa de atrito (porous friction course), ou outro tipo de

  tratamento superficial para melhorar a drenagem e aumentar o atrito, que atenda

  critérios definidos em normativo específico da ANAC;'
