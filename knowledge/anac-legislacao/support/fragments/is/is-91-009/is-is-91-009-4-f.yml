text: 'f) reporte atual por pilotos: reportes feitos por pilotos sobre condições

  meteorológicas ou da pista relativos ao momento da operação, ou seja, são válidos

  enquanto as condições do meteorológicas ou de pista do momento do reporte

  permanecerem presentes; e'
