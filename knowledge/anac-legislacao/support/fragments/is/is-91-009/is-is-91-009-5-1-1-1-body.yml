text: '5.1.1.1 As seções 121.189 do RBAC nº 121 e 135.379 do RBAC nº 135, que tratam de limitações

  de decolagem para aviões com motores a turbina (e que sejam grandes aviões categoria

  transporte, no caso do RBAC nº 135), estabelecem condições para a definição do peso

  máximo de decolagem em função de diversos fatores, como distância de decolagem,

  altitude do aeródromo, temperatura ambiente, entre outros.'
