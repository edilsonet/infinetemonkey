text: '5.1.2.1 As seções 121.195 do RBAC nº 121 e 135.385 do RBAC nº 135, que tratam de limitações

  de pouso no aeródromo de destino para aviões com motores a turbina (e que sejamData de emissão:
  27 de novembro de 2020 IS nº 91-009

  Revisão A

  grandes aviões categoria transporte, no caso do RBAC nº 135), estabelecem fatores de

  segurança que devem ser levados em consideração para a definição antes da decolagem

  da distância de pouso requerida (RLD).'
