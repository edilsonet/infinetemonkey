title: A exigência regulamentar do uso dos fatores de segurança tem como objetivo adicionar
text: '5.1.2.2 A exigência regulamentar do uso dos fatores de segurança tem como objetivo
  adicionar

  aos cálculos de distância de pouso requerida alguns fatores não necessariamente

  considerados na definição do desempenho da aeronave durante o processo de certificação,

  como condições da superfície da pista, técnicas de pilotagem, instabilidades atmosféricas,

  entre outros.'
