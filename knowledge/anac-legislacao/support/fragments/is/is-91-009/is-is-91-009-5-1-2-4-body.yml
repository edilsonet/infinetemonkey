title: Para pistas molhadas ou escorregadias, conforme os parágrafos 121.195(d) do RBAC nº
text: '5.1.2.4 Para pistas molhadas ou escorregadias, conforme os parágrafos 121.195(d) do
  RBAC nº

  121 e 135.385(d) do RBAC nº 135, é requerido que a RLD para pista seca seja acrescida

  de 15%, exceto se, baseado em demonstração de operações reais com técnicas de pouso

  em pistas molhadas, dados de desempenho com RLD reduzida para pistas molhadas

  tenham sido aprovados para o tipo e modelo de avião utilizado e incluídos em seu manual

  de voo aprovado. A RLD para pista molhada não pode ser menor que para pista seca.'
