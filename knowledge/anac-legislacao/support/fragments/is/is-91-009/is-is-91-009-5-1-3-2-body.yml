title: A tomada de créditos de desempenho por operadores aéreos regulados pelos RBAC nº
text: '5.1.3.2 A tomada de créditos de desempenho por operadores aéreos regulados pelos RBAC
  nº

  121 e nº 135 requer autorização da ANAC. Essa autorização, conforme será detalhado no

  restante desta IS, depende do atendimento de critérios pelas pistas de pouso e de

  decolagem, pela aeronave e pelo próprio operador aéreo. Adicionalmente, condições

  meteorológicas e condições da pista requeridas também devem ser atendidas no momento

  da operação.'
