section_title: Para que a aeronave seja considerada elegível para autorização de tomada de
  créditos de
subsection_id: b
cite: 5.3.1(b)
title: 5.3.1(b)
text: 'b) devem ser atendidas todas as condições de elegibilidade especificadas para a

  aeronave para o uso desses dados de desempenho. Essas condições, em especial as

  condições meteorológicas e de pista, podem variar de acordo com a metodologia

  utilizada para a certificação dos dados de desempenho para uso em pistas com

  pavimento antiderrapante. Essas condições podem estar especificadas no manual de

  voo aprovado, em outros documentos operacionais fornecidos pelo fabricante da

  aeronave, ou nas normas utilizadas como base para a certificação dos dados de

  desempenho. As condições de elegibilidade desta IS devem ser atendidas caso

  sejam mais exigentes que as estabelecidas para a aeronave;'
