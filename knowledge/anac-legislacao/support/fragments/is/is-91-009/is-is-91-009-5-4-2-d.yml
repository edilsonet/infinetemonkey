text: 'd) condições que contrariem o manual de voo aprovado ou outros documentos

  operacionais da aeronave.

  Nota: a decisão sobre a consideração de informações ou reportes meteorológicos para a tomada

  de crédito de desempenho no pouso deve levar em conta a duração do voo, e por

  consequência a pertinência do informe ou reporte para a avaliação das condições

  meteorológicas no momento do pouso.

