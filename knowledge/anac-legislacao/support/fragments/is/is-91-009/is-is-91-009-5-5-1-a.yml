section_title: A tomada de créditos de desempenho somente pode ocorrer caso as seguintes condições
subsection_id: a
cite: 5.5.1(a)
title: 5.5.1(a)
text: 'a) para tomada de créditos de desempenho na decolagem, exceto se em trechos

  isolados que não impactem no desempenho de frenagem, não pode haver geada,

  neve, poças de água, lama ou gelo, observado ou reportado, sobre o comprimento

  total da pista ou dentro de faixa de largura da pista requerida constante no manual

  de voo aprovado ou em outros documentos operacionais da aeronave;'
