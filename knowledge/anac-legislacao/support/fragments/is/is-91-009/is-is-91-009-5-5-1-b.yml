section_title: A tomada de créditos de desempenho somente pode ocorrer caso as seguintes condições
subsection_id: b
cite: 5.5.1(b)
title: 5.5.1(b)
text: 'b) para tomada de créditos de desempenho na decolagem, não pode haver reporte atual

  por pilotos informando:

  I. ocorrência de aquaplanagem;

  II. pista escorregadia;

  III. desaceleração da aeronave reduzida para o esforço de frenagem aplicada;

  IV. controle direcional da aeronave reduzido; ou

  V. braking action pior que “good”;'
