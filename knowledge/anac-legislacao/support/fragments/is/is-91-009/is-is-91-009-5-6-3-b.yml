cite: 5.6.3(b)
title: 5.6.3(b)
text: 'b) caso, após análise dos dados coletados, seja confirmado que a redução do

  desempenho de frenagem ou do controle direcional se deve às condições da pista,

  considerar a pista como não elegível para tomada de créditos de desempenho até

  que ações corretivas sejam implementadas pelo operador do aeródromo. Na

  ausência implementação de ações corretivas pelo operador do aeródromo,

  comunicar a ANAC; e'
