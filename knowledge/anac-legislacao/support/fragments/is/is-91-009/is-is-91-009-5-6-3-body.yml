title: O operador aéreo deve possuir, como parte do sistema de gerenciamento de segurança
text: '5.6.3 O operador aéreo deve possuir, como parte do sistema de gerenciamento de segurança

  operacional (SGSO), um programa de acompanhamento e análise de dados de voo

  (PAADV), por meio do qual deve ser continuamente monitorado o desempenho de

  frenagem das aeronaves em pistas molhadas nas quais seja tomado crédito de

  desempenho. Para esse monitoramento, o desempenho de frenagem considerado

  notavelmente reduzido deve ser parametrizado. O estabelecimento desses parâmetros

  pelo operador aéreo pode ser feito por meio do reporte de pilotos, usando como referênciaData
  de emissão: 27 de novembro de 2020 IS nº 91-009

  Revisão A

  o braking action MEDIUM da Advisory Circular 25-32 (AC 25-32) da Federal Aviation

  Administration (FAA) dos EUA, ou seguindo recomendações do fabricante da aeronave.

