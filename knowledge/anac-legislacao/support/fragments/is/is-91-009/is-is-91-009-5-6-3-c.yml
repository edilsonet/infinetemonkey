text: 'c) caso, após análise dos dados coletados, seja confirmado que a redução do

  desempenho de frenagem se deve às condições da aeronave, considerar o modelo

  de aeronave como não elegível para tomada de créditos de desempenho até a

  implementação de ações corretivas, e informar a ANAC e o fabricante da aeronave.

