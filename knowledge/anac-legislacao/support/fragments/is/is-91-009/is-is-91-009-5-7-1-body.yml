title: O processo de autorização para as operações de que trata esta IS deverá seguir o previsto
text: '5.7.1 O processo de autorização para as operações de que trata esta IS deverá seguir
  o previsto

  na IS nº 119-001 ou 119-004, conforme o operador aéreo opere sob o RBAC nº 121 ou

  135, respectivamente.'
