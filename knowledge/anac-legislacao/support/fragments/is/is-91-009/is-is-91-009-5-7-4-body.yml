text: '5.7.4 Caso o operador já possua todo o conteúdo requerido para um dado manual em seu

  manual já aprovado pela ANAC, deverá incluir essa informação na declaração de

  conformidade. Neste caso não há necessidade de revisão e envio do manual para análise.'
