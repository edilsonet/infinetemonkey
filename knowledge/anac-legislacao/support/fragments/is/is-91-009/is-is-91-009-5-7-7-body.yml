  de
text: '5.7.7 Após a emissão da autorização nas especificações operativas, o operador aéreo,
  antes de

  iniciar a tomada de créditos de desempenho em cada pista elegível, deve realizar o

  monitoramento e análise do desempenho de frenagem da aeronave em ao menos 10

  pousos com a pista molhada. O operador aéreo pode considerar para esse monitoramento

  pousos realizados antes da emissão da autorização. O resultado desse monitoramento

  deve ser documentado e mantido para eventual verificação pela ANAC. A tomada de

  créditos pode então ser iniciada se o desempenho de frenagem nesses pousos for

  considerado satisfatório.'
