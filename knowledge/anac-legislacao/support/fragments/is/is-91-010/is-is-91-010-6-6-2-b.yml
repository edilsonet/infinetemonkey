cite: 6.6.2(b)
title: 6.6.2(b)
text: 'b) Continuidade RCP: proporção mínima de transações que devem ser completadas dentro
  do Tempo Nominal de Transação (95%) ou do Tempo Operacional de Transação (99,9%), considerando-se
  que o serviço esteja disponível no momento em que a transação se inicia;'
