  Tabela 3 - Especificações RCP e seus respectivos parâmetros

  6.7 Especificações RSP

  6.7.1 Uma Especificação RSP (Required Surveillance Performance) representa um conjunto de
  parâmetros operacionais que devem ser atingidos pelos sistemas de vigilância sujeitos àquela
  Especificação.'
