section_title: 'Uma especificação RSP é composta pelos seguintes parâmetros:'
subsection_id: a
cite: 6.7.2(a)
title: 6.7.2(a)
text: 'a) Tempo de Entrega: tempo máximo (em segundos) para que a aeronave emita e o controlador
  receba um dado de vigilância (contado a partir do momento em que a aeronave atinge uma posição,
  tempo ou evento de reporte). Subdivide-se nos seguintes parâmetros:

  I. Tempo nominal de entrega (DT): tempo máximo (em segundos) dentro do qual 95% das entregas
  de dados vigilância devem ser completadas; e

  II. Tempo operacional de entrega (OT): tempo máximo (em segundos) dentro do qual 99,9% das
  entregas de dados vigilância devem ser completadas. Após expirado este tempo, o controlador
  deve reverter para um procedimento de vigilância alternativo;'
