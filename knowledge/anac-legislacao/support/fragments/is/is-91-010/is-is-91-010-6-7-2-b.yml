section_title: 'Uma especificação RSP é composta pelos seguintes parâmetros:'
subsection_id: b
cite: 6.7.2(b)
title: 6.7.2(b)
text: 'b) Continuidade RSP: proporção mínima de dados de vigilância que devem ser entregues
  dentro do tempo nominal de entrega (95%) ou do tempo operacional de entrega (99,9%), considerando-se
  que o serviço esteja disponível no momento em que a remessa de dados se inicia;'
