  Tabela 4 - Especificações RSP e seus respectivos parâmetros


  CRITÉRIOS DE AERONAVEGABILIDADE

  7.1 Para obter a aprovação operacional para uso de sistemas de Data Link, o operador deve
  comprovar que a aeronave possui devidamente instalados todos os equipamentos necessários
  para este tipo de operação, bem como identificar as capacidades destes equipamentos.

  7.2 Declaração de conformidade'
