id: is-is-91-010-7-2-1-b
kind: is
document: is-91-010
family: '91'
section_id: 7.2.1
section_title: 'O operador deve apresentar à ANAC uma declaração de conformidade atestando
  que a aeronave possui capacidade:'
subsection_id: b
cite: 7.2.1(b)
title: 7.2.1(b)
text: b) obtida em serviço por meio da aplicação de um boletim de serviço (BS ou SB), de uma
  Service Letter (SL), ou da execução de uma modificação por meio de um certificado suplementar
  de tipo (CST ou STC validado no Brasil), com declaração nos manuais de voo (MV, AFM ou POH),
  nos suplementos ao manual de voo (SMV ou AFMS), nas especificações da aeronave (EA ou TCDS),
  ou em documentação equivalente.
