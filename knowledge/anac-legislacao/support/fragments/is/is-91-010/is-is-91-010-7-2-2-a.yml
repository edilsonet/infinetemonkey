title: 7.2.2(a)
text: a) as especificações RCP e RSP do sistema de Data Link da aeronave. Caso o operador
  não apresente tais dados ou a aeronave não atenda às especificações RCP e RSP, o uso de
  CPDLC e ADS-C poderá ser autorizado, mas não será atribuída especificação PBCS;
