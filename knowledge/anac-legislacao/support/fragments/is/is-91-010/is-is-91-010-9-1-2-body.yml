text: '9.1.2 Os pilotos RBAC nº 91 devem estar familiarizados com todos os tópicos de treinamento
  descritos nesta IS.

  9.2 Operadores sob a Subparte K do RBAC nº 91 ou sob os RBAC nº 121 ou 135

  9.2.1 Operadores sob a Subparte K do RBAC nº 91 ou sob os RBAC nº 121 ou 135 devem possuir
  um Programa de Treinamento que aborde todos os assuntos relacionados às operações de comunicação
  por data link, conforme descrito nesta IS. O Programa de Treinamento deve abordar, no mínimo,
  os elementos descritos a seguir.'
