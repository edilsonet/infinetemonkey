title: Treinamento de pilotos
text: '9.2.2 Treinamento de pilotos

  9.2.2.1 Os operadores sob a Subparte K do RBAC nº 91 ou sob os RBAC nº 121 ou 135 devem
  garantir que seu treinamento para pilotos aborde procedimentos normais e não normais e de
  emergência, as características dos equipamentos e os limites de sua capacidade de comunicação.

  9.2.2.2 Os pilotos devem receber um treinamento específico para os equipamentos de comunicação
  por dados que irão operar. Somente o treinamento de tipo da aeronave não garante que o piloto
  tenha sido capacitado para operar o modelo específico de equipamento de comunicação de dados
  instalado nas aeronaves da empresa.'
