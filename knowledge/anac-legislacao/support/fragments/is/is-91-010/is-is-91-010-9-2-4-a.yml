section_id: 9.2.4
section_title: 'O treinamento inicial dos pilotos para comunicações por data link deve incluir,
  no mínimo, os seguintes procedimentos:'
subsection_id: a
cite: 9.2.4(a)
title: 9.2.4(a)
text: 'a) Fase 1 - pré-solicitação: os representantes da ANAC e do operador podem desenvolver
  um entendimento comum em relação à autorização do uso de CPDLC e ADS-C, estabelecendo os
  requisitos aplicáveis e os documentos de orientação que serão utilizados na condução do
  processo. Com este intuito, uma reunião de orientação prévia (ROP) pode ser agendada, a
  critério da ANAC para gerir o processo de aprovação, para que as informações pertinentes
  e os detalhes do processo sejam apresentados, tanto por parte do requerente, quanto por
  parte da ANAC;'
