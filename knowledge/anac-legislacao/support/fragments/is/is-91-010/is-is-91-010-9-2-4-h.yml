text: 'h) caso o operador solicite autorização PBCS, revisão do MGO com descrição do Programa
  de Monitoramento de Desempenho PBCS nos termos do item 11.

  12.4. Encerramento Compulsório do processo

  12.4.1 Caso a solicitação seja rejeitada pela 3ª vez por não-conformidade ou incapacidade
  de demonstração por parte do requerente, o processo será indeferido e arquivado compulsoriamente,
  independentemente do prazo.

  12.4.2 Os operadores terão o prazo máximo de 90 (noventa) dias - ou conforme estabelecido
  nas IS nº 91-013, 119-001 ou 119-004, como aplicável - para apresentar as ações requeridas
  durante qualquer fase do processo ou as respostas a cada comunicação de não-conformidade.

  12.4.3 A não observância do prazo estabelecido, sem qualquer manifestação por parte do requerente
  para a apresentação das ações requeridas, poderá caracterizar desistência e poderá ensejar
  o encerramento do processo.'
