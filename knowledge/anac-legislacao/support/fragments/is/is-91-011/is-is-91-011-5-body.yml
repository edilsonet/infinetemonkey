title: APPLICABILITY. The FAA recommends CDFA for all of the following NPAs published
text: '5. APPLICABILITY. The FAA recommends CDFA for all of the following NPAs published

  with a vertical descent angle (VDA) or glideslope (GS):

  • Very high frequency (VHF) Omnidirectional Range (VOR);

  • VHF omni-directional range station/distance measuring equipment (VOR/DME);

  • Non-directional radio beacon (NDB);

  • NDB/distance measuring equipment (DME);

  • Localizer (LOC), Localizer Back-Course (LOC-BC), LOC/DME;

  • Localizer-type directional aid (LDA);

  • LDA/DME;

  • Simplified Directional Facility (SDF);

  • SDF/DME;

  • Area Navigation (RNAV); and

  • Global Positioning System (GPS).'
