title: FLIGHTCREW TRAINING.
text: '7. FLIGHTCREW TRAINING.

  a. Use of CDFA. The use of CDFA should become a standard procedure in the performance

  of suitable NPAs. Accordingly, operators should incorporate training on CDFA in those elements

  of their training programs where NPAs are performed and evaluated.

  b. Manuals and SOPs. Operators should revise their flight manuals and/or SOPs to identify

  CDFA as a standard method of performing NPAs.

  c. Training. Additional flight training to use the CDFA technique is not required for pilots

  qualified to conduct NPA in accordance with the operator’s certificate. However, operators

  should provide flightcrews with appropriate ground training before performing CDFA

  operations. The ground training may be computer-based, published in-flight operations bulletins,

  or provided via other similar means deemed acceptable by the principal operations inspector

  (POI). Crewmembers should receive training specific to the aircraft type, the installed
  flight

  guidance, and navigation system, and on how to utilize the system when using the CDFA

  technique for applicable approach profiles.

  d. Training Program Topics. Each operator’s CDFA training program should specifically

  address the following topics:

  (1) Emphasis on the stabilized approach concept and the safety benefits of using the

  CDFA.

  (2) Approach characteristics (e.g., circling-only minima) and environmental factors

  (e.g., icing) that could make the use of CDFA inadvisable.

  (3) Use of baro-VNAV, if applicable, to provide a vertical profile during an NPA.

  (4) Methods for translating the published GS angle or VDA into the required rate of

  descent for aircraft not equipped with baro-VNAV.

  (5) Means for tracking progress along the final approach vertical profile.

  (6) Means for ensuring compliance with any altitude restrictions during the final

  approach segment, to include start of descent past FAF to meet stepdown fix altitudes.

  Page 6 Par 61/20/11 AC 120-108

  (7) The altitude additive required for ensuring the aircraft does not descend below the

  MDA or DDA.

  (8) Understanding the impact on approach stabilization by flying to the MAP at the MDA

  to acquire runway visual references (see Appendix 1, Figure 1A).

  (9) Pilot Flying (PF) and pilot-not-flying (PNF) monitoring callouts and other crew

  coordination activities needed to ensure safe transition from the vertical profile to either
  landing

  or a go-around at MDA or DDA.

  (10) Procedures for executing a go-around prior to reaching the MAP.

  (11) The need to comply with the VGSI, if available, and discussion of the obstacle

  protection in the visual segment it provides.'
