title: 'Relaxamento: liberação da aeronave para voo com algum item inoperante.'
text: '4.1.18 Relaxamento: liberação da aeronave para voo com algum item inoperante.

  4.2 Lista de abreviaturas:

  ACR - Ação corretiva retardada

  AFM - Aircraft flight manual (manual de voo aprovado)

  Anac - Agência Nacional de Aviação Civil

  AMM - Aircraft maintenance manual (manual de manutenção da aeronave)

  AOM - Aircraft operating manual (manual de operações da aeronave)

  ATA - Air Transport Association (Associação de Transporte Aéreo)

  CA MEL - Crew Applied MEL

  CANAC - Código Anac

  CDL - Configuration deviation list (lista de desvios de configuração)

  CFR - Code of Federal Regulations (Código de regulamentos federais [dos Estados Unidos])

  CST - Certificação suplementar de tipo

  DA - Diretriz de aeronavegabilidade

  DDG - Dispatch deviation guide (guia de desvio de despacho)

  DDPG - Dispatch deviation procedures guide (guia de procedimentos de desvio de despacho)

  EA - Especificações administrativas

  EFB - Electronic flight bag (informação aeronáutica em formato digital)

  EO - Especificações operativas

  ETOPS - Extended operations (operações prolongadas)

  GPS - Global positioning system (Sistema de posicionamento global)

  GCAC - Gerência de Certificação de Aeronavegabilidade Continuada

  IAC - Instrução de Aviação Civil

  IFR - Instrument flight rules (regras de voo por instrumentos)

  ILS - Instrument Landing System (Sistema de pouso por instrumentos)

  IS - Instrução Suplementar

  KOL - Kinds of Operations List (lista de tipos de operação)

  KOEL - Kinds of Operations Equipment List (lista de equipamentos por tipos de operação)

  LOA - Letter of authorization (carta de autorização)

  MEL - Minimum equipment list (lista de equipamentos mínimos)

  MMEL - Master minimum equipment list (lista mestra de equipamentos mínimos)

  MGM - Manual geral de manutenção

  MGO - Manual geral de operações

  NEF - Non-essential equipment and furnishings (equipamentos e acessórios não essenciais)

  OACI - Organização da Aviação Civil Internacional

  PBN - Performance based navigation (navegação baseada em desempenho)

  RBAC - Regulamento Brasileiro de Aviação Civil

  RVSM - Reduced vertical separation minimum (Separação vertical mínima reduzida)

  SASC - Sistema de análise e supervisão continuada

  SEI! - Sistema Eletrônico de Informações

  SOP - Standard operating procedures ou Standard operational procedures (procedimentos operacionais
  padronizados)

  SPO - Superintendência de Padrões Operacionais

  TFAC - Taxa de fiscalização da aviação civil

  TCDS - Type certificate data sheet (especificação de tipo)

  UTC - Universal coordinated time (tempo universal coordenado)

  VFR - Visual flight rules (regras de voo visual)

  VHF - Very high frequency (frequência muito alta)

  VMC - Visual meteorological conditions (condições meteorológicas visuais)

  VOR - Very high frequency omnidirectional radio range (rádio farol onidirecional de alta
  frequência)'
