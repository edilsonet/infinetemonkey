subsection_id: b
cite: 5.1.1.1(b)
title: 5.1.1.1(b)
text: 'b) página de aprovação: página com assinatura dos responsáveis pela aprovação da MEL
  no operador. No caso de detentores de certificado emitido segundo o RBAC nº 119 e de administradores
  de programa segundo a Subparte K do RBAC nº 91, devem-se incluir pelo menos as assinaturas
  do diretor/gerente de operações e do diretor/gerente de manutenção.

  Nota: pode-se dispensar a página de aprovação caso a MEL tenha sido encaminhada à Anac diretamente
  por FOP/ofício assinado pelo diretor/gerente de operações e pelo diretor/gerente de manutenção.'
