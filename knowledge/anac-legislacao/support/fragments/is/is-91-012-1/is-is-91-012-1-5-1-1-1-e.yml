title: 5.1.1.1(e)
text: 'e) lista de páginas efetivas: lista com todas as páginas da MEL, associadas à revisão
  em que se encontram, permitindo o controle da revisão atual de cada página.

  Nota: pode-se considerar de forma equivalente uma lista de seções efetivas (entendendo-se
  por seção um grupo de páginas, como, por exemplo, todas páginas associadas a um determinado
  item da MEL), desde que todas as páginas de cada seção estejam sempre em uma mesma revisão
  da MEL e desde que, dentro da seção, seja possível identificar a ordem daquela página e
  o total de páginas (como em “xx”/”yy”, em que “xx” seja a ordem da página dentro da seção
  e “yy” seja o total de páginas dentro da seção).'
