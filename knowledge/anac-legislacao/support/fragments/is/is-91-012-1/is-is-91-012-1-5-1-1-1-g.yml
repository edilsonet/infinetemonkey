text: 'g) definições: devem ser definidos os termos utilizados na MEL, visando a garantir
  sua correta interpretação. As definições contidas na seção 4 desta IS e as contidas na MMEL
  de referência, se aplicáveis à MEL do operador, podem ser usadas como base para elaboração
  dessa seção.'
