title: 5.1.1.1(i)
text: 'i) aplicabilidade: devem ser identificadas, pelas marcas de nacionalidade e matrícula
  e pelo número de série, as aeronaves para as quais a MEL se aplica. No caso de MEL para
  uma frota (conforme o parágrafo 5.1.2.4.3 desta IS), devem ser identificados os modelos
  básicos, configurações e eventuais alterações (por exemplo, CST) para os quais a MEL se
  aplica.'
