subsection_id: j
cite: 5.1.1.1(j)
title: 5.1.1.1(j)
text: 'j) distribuição: contém a lista de detentores, o responsável pela atualização e pela
  distribuição e o sistema de distribuição. Caso o sistema de distribuição de manuais do operador
  para todos os manuais esteja definido no MGO, é suficiente fazer referência à seção apropriada
  do MGO. A lista de detentores deve incluir, pelo menos: cada aeronave, diretor/gerente de
  operações, diretor/gerente de manutenção, despachante operacional de voo (se aplicável),
  outros prepostos do detentor de certificado que utilizem a MEL e a Anac.'
