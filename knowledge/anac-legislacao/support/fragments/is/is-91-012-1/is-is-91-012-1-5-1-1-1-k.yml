title: 5.1.1.1(k)
text: 'k) capítulos da ATA: os capítulos da ATA contêm as páginas do sistema ATA e são numerados
  de acordo com padrões internacionais. Esses capítulos listam os itens que podem estar inoperantes,
  por quanto tempo, quantidade instalada na aeronave, quantidade requerida para despacho e
  as observações ou exceções, que estabelecem as condições ou limitações para que a aeronave
  possa ser liberada para voo.'
