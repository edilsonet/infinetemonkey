title: A MEL deve ser elaborada com base na última revisão da MMEL de referência.
text: '5.1.2.2 A MEL deve ser elaborada com base na última revisão da MMEL de referência.

  5.1.2.2.1 Adicionalmente, a MEL também deve ser baseada em publicações do fabricante da
  aeronave, do motor e/ou das hélices contemplados no certificado de tipo e/ou CST aplicável
  à aeronave. Essas publicações serão referências para elaboração dos procedimentos de manutenção
  (M) e de operação (O) especificados na MEL, como requerido pela MMEL (vide o parágrafo 5.1.2.6
  desta IS).'
