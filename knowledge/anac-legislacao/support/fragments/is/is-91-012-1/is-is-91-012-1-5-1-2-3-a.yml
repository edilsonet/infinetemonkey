section_title: 'A MEL não pode ser menos restritiva do que a MMEL. Ainda, deve estar de acordo
  com:'
subsection_id: a
cite: 5.1.2.3(a)
title: 5.1.2.3(a)
text: a) os operadores devem providenciar a compatibilização da MEL para garantir a continuidade
  das operações nos pontos de troca, além de garantir que os requisitos aplicáveis de cada
  autoridade envolvida e os acordos bilaterais por ela firmados serão cumpridos pelos operadores,
  durante a vigência do contrato de intercâmbio. Considerando que o registro das irregularidades
  da aeronave deve ser único, deve haver compatibilização entre os prazos para operações com
  o item inoperante, assim como entre as ações de manutenção requeridas. No entanto, caso
  sejam necessárias variações nos procedimentos operacionais que afetem apenas a operação
  da aeronave enquanto ela se encontra com um dos operadores, tais diferenças podem ser admitidas;
