title: 5.1.2.5(a)
text: 'a) Categoria A: itens nessa categoria devem ser reparados dentro do intervalo de tempo
  especificado nas observações da MEL do operador. Quando esse intervalo de tempo é especificado
  em termos de pousos ou ciclos, o intervalo é iniciado a partir do voo seguinte. Quando é
  especificado em dias calendáricos ou em dias de voo, é excluído o dia em que foi detectado
  o mau funcionamento, conforme registrado nos registros da aeronave;'
