text: b) a identificação do item inoperante, a partir da condição da aeronave, deve ser clara,
  assim como seu enquadramento na MEL. Se for necessário suporte do pessoal de manutenção
  para ações como pesquisa de pane (troubleshooting) ou diagnóstico de falha, o item somente
  poderá ser relaxado pelo pessoal de manutenção;
