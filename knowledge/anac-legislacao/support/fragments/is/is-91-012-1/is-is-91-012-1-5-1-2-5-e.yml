title: 5.1.2.5(e)
text: e) os detentores de certificado emitido segundo o RBAC nº 119 e administradores de programa
  segundo a Subparte K do RBAC nº 91 devem assegurar canais de contato eficazes entre os pilotos
  e o centro de controle de manutenção, de forma a permitir o registro dos itens ACR e seus
  prazos, bem como sanar eventuais dúvidas, sempre que necessário;
