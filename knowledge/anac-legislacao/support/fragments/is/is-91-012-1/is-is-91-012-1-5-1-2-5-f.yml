title: 5.1.2.5(f)
text: f) os detentores de certificado emitido segundo o RBAC nº 119 e administradores de programa
  segundo a Subparte K do RBAC nº 91 devem assegurar canais de contato eficazes entre os pilotos
  e o centro de controle operacional/centro de despacho de voo, quando aplicável, de forma
  a permitir registrar eventuais limitações operacionais nos sistemas de controle do operador,
  bem como, conforme necessário, recalcular plano de voo, despacho ou liberação de voo; e
