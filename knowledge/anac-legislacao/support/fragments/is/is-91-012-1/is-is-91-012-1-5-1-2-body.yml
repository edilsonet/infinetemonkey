text: '5.1.2 Conteúdo da MEL

  5.1.2.1 A MEL deve ser elaborada com base em uma MMEL aprovada pela Anac, em conformidade
  com a IS nº 21.61-005, intitulada “Lista Mestra de Equipamentos Mínimo - MMEL”.

  Nota: a MMEL aprovada pela Anac inclui o suplemento à MMEL, quando emitido ou aprovado pela
  Anac, conforme previsto na IS nº 21.61-005 e na IS 21-004. Os suplementos à MMEL, quando
  emitidos pela Anac, serão disponibilizadas em https://www.gov.br/anac/pt-br/centrais-de-conteudo/biblioteca/master-minimum-equipment-lists.
  Suplementos eventualmente emitidos por detentores de projeto de tipo, ou de suplemento a
  projeto de tipo, serão disponibilizados por seus detentores.'
