section_title: 'Alguns tópicos que devem ser incluídos no programa de treinamento, de acordo
  com as funções de cada preposto, são:'
subsection_id: a
cite: 5.1.3.6.1(a)
title: 5.1.3.6.1(a)
text: 'a) sistema de rastreamento: um método para acompanhar a data e, quando apropriado,
  os horários em que um defeito em um item foi relatado e em que tal defeito foi reparado.
  Esse método deve incluir um controle registrado da quantidade de itens relatados para reparo
  com retardo autorizado por aeronave, as razões de qualquer atraso no reparo, a duração do
  atraso e a data estimada em que o item será reparado. O sistema de rastreamento deve incluir
  ainda método de detectar e reportar defeitos recorrentes ou intermitentes (ver o parágrafo
  5.3.11 desta IS), de forma a verificar se as ações corretivas associadas vêm sendo executadas
  satisfatoriamente;'
