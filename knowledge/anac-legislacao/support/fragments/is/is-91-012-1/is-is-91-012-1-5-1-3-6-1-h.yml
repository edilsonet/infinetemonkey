text: 'h) procedimentos de liberação de item ACR pelo piloto em comando, se aplicável.

  Nota: um exemplo de módulo de treinamento sobre uso da MEL é detalhado no Apêndice C desta
  IS.

  5.1.3.6.2 Treinamentos periódicos devem ser conduzidos a cada 12 meses para reforçar o conhecimento
  sobre os procedimentos e atualizar os seus prepostos quanto a quaisquer alterações nos procedimentos
  para uso da MEL.

  5.1.3.7 Programa de gerenciamento da MEL: os detentores de certificado emitido segundo o
  RBAC nº 119 e os administradores de programa segundo a Subparte K do RBAC nº 91 devem desenvolver
  e manter um programa para gerenciamento dos reparos dos itens listados na MEL aprovada.
  O programa deve abranger gestão de recursos, incluindo as peças de reposição, pessoal, infraestrutura,
  procedimentos e programação para assegurar um reparo dentro dos prazos previstos. O programa
  deve ser documentado como parte do sistema de manuais do operador (por exemplo, no Programa
  de Manutenção ou no Manual Geral de Manutenção). O programa de gerenciamento da MEL deve
  incluir ainda:'
