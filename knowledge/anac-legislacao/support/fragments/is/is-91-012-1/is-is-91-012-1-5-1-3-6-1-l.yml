section_title: 'Alguns tópicos que devem ser incluídos no programa de treinamento, de acordo
  com as funções de cada preposto, são:'
subsection_id: l
cite: 5.1.3.6.1(l)
title: 5.1.3.6.1(l)
text: l) os procedimentos para quando falhas ocorrerem após o início da movimentação da aeronave
  (ou, se aplicável, a emissão do despacho/liberação de voo), mas antes da decolagem, de forma
  a garantir que a aeronave não decole com itens inoperantes sem atender ao previsto na MEL.
  Adicionalmente, para operações regidas pelo RBAC nº 121, esses procedimentos devem permitir
  que o piloto em comando se comunique com a área de manutenção e despacho (ou responsável
  pelo controle operacional) do operador para revisar a situação e determinar o que é necessário
  para se atender à MEL. Por exemplo, pode ser necessário retornar a aeronave para reparar
  o item inoperante; ou executar algum procedimento da MEL, antes de prosseguir o voo, devendo
  ser observado quem possui a prerrogativa de realizar tais procedimentos - o que pode exigir
  o retorno da aeronave ao pátio. Caso as condições e limitações da MEL afetem o desempenho
  da aeronave ou qualquer informação do planejamento de voo (por exemplo, restrições no nível
  de voo), o despachante operacional de voo ou a pessoa autorizada a exercer o controle operacional
  devem recalcular um novo plano de voo e emitir um novo despacho (ou uma nova liberação)
  de voo, que pode ser emitido(a) como uma emenda ao despacho (ou liberação) anterior;
