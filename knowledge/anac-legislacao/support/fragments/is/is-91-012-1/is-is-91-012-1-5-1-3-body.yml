text: '5.1.3 Relação com outros manuais

  5.1.3.1 Os detentores de certificado emitido segundo o RBAC nº 119 e os administradores
  de programa segundo a Subparte K do RBAC nº 91 devem garantir que seus manuais (como a própria
  MEL, o MGO, SOP, MGM, programas de treinamento, entre outros) contenham os procedimentos
  e as orientações necessárias para que seus prepostos possam utilizar a MEL em suas operações,
  incluindo os procedimentos de operação e de manutenção e os registros, de modo a atender
  aos procedimentos de utilização da MEL em serviço previstos no parágrafo 5.3 desta IS. Os
  manuais devem estar alinhados entre si, de modo a formar um conjunto coeso e coerente de
  procedimentos.

  5.1.3.2 Os detentores de certificado emitido segundo o RBAC nº 119 devem estabelecer em
  seus manuais os procedimentos e as responsabilidades pela realização dos registros previstos
  nas seções 121.563, 121.701 e 121.709 do RBAC nº 121 ou 135.65 e 135.443 do RBAC nº 135,
  conforme aplicável.

  5.1.3.3 Como parte desses registros, os operadores (incluindo os administradores de programa
  segundo a Subparte K do RBAC nº 91) devem manter a bordo, juntamente com o diário de bordo
  (ou registro próprio que corresponda à parte II do diário de bordo), uma relação atualizada
  dos itens com ação corretiva retardada (ACR), com o propósito de permitir um acesso direto
  à informação. A relação de controle de itens ACR deve conter campos apropriados para o registro
  de, pelo menos, os seguintes dados relativos a cada item cuja correção for postergada:'
