title: 5.1.3(l)
text: 'l) outros dados relevantes.

  Nota: essa relação de controle de itens ACR é costumeiramente denominada de “lista de controle
  de itens ACR”. No entanto, ressalta-se que não é necessário que haja uma lista propriamente
  dita.


  5.1.3.4 Os detentores de certificado emitido segundo o RBAC nº 119 e os administradores
  de programa segundo a Subparte K do RBAC nº 91 devem estabelecer em seus manuais procedimentos
  para garantir que os placares a serem utilizados em caso de item inoperante, conforme requerido
  pelo parágrafo 5.1.2.8 desta IS, sejam disponibilizados a bordo da aeronave e para garantir
  que os seus prepostos coloquem os placares, conforme estabelecido na MEL, e que retirem
  esses placares após a correção do item ser efetuada.

  5.1.3.5 Os detentores de certificado emitido segundo o RBAC nº 119 e os administradores
  de programa segundo a Subparte K do RBAC nº 91 devem estabelecer em seus manuais as formas
  de comunicação, o fluxo de informação entre a tripulação, os setores de operações e de manutenção
  sobre a ocorrência de itens inoperantes e as limitações associadas ao relaxamento e o processo
  de decisão quanto à interrupção das operações ou à liberação da aeronave. Os operadores
  podem, a seu critério, listar aeródromos para os quais a aeronave deve preferencialmente
  alternar em caso de falha de um item em voo, de forma a permitir que o defeito seja sanado
  antes do voo seguinte.

  5.1.3.6 Programa de treinamento: os detentores de certificado emitido segundo o RBAC nº
  119 e os administradores de programa segundo a Subparte K do RBAC nº 91 devem incluir em
  seu programa de treinamento conteúdo adequado para instruir cada preposto que esteja envolvido
  em operações conduzidas sob o relaxamento de um item da MEL sobre o correto uso da MEL.
  Esses prepostos incluem tripulantes (pilotos, mecânicos de voo e comissários) e pessoal
  de solo, como o pessoal de manutenção e despachantes operacionais de voo.

  Nota: as trilhas de capacitação para pilotos realizarem liberações ACRs devem constar no
  programa de treinamento de operações.'
