section_title: 'A entrega da MEL para análise da Anac e as iterações do processo de aprovação
  seguirão os procedimentos previstos:'
subsection_id: b
cite: 5.2.1.1(b)
title: 5.2.1.1(b)
text: b) para detentores de certificado emitido segundo o RBAC nº 119 ou para administradores
  de programa segundo a Subparte K do RBAC nº 91, se os seus manuais não estiverem previamente
  adequados ao uso da MEL, os manuais estabelecendo tarefas, responsabilidades, autoridade,
  políticas, procedimentos, instruções, treinamento e informações aos tripulantes, ao pessoal
  de solo, de manutenção e de gerenciamento com relação a como lidar com a MEL, conforme parágrafo
  5.1.3 desta IS. Esses manuais devem ser encaminhados por FOP 107 ou 207 individuais, acompanhados
  dos respectivos dados do pagamento ou comprovantes de pagamento das TFAC, quando aplicáveis;
