title: 5.2.1.1(c)
text: 'c) na IS nº 91-013, para administradores de programa regidos pela Subparte K do RBAC
  nº 91.

  Nota: embora a IS nº 119-004 seja aplicável apenas a operadores regidos pelo RBAC nº 135,
  recomenda-se que os operadores de aviação geral, ou seja, os regidos pelo RBAC nº 91 (incluindo
  os administradores de programa segundo a Subparte K), utilizem os mesmos formulários descritos
  na IS nº 119-004, como forma de padronizar as comunicações entre a Anac e o operador.

  5.2.1.2 Para abertura do processo de análise da MEL e no envio de respostas a não-conformidades
  identificadas pela Anac, o operador deve submeter a MEL em formato digital, em arquivos
  em formato PDF.

  5.2.1.3 O operador deve submeter a MEL para análise por meio do FOP 107 ou 207 (disponíveis
  em https://www.gov.br/anac/pt-br/assuntos/regulados/empresas-aereas/modelos-e-formularios),
  devidamente preenchido, anexando os seguintes documentos:'
