section_id: 5.2.1.1
section_title: 'A entrega da MEL para análise da Anac e as iterações do processo de aprovação
  seguirão os procedimentos previstos:'
subsection_id: e
cite: 5.2.1.1(e)
title: 5.2.1.1(e)
text: 'e) se necessário, conforme solicitado pela Anac, o operador deve enviar cópia da MMEL
  ou dos demais documentos utilizados como referência para elaboração de sua MEL.

  5.2.1.4 Uma MEL copiada da MMEL ou que não considere os requisitos regulamentares aplicáveis,
  as operações da aeronave e demais orientações do parágrafo 5.1 desta IS, poderá, após avaliação
  preliminar, ser considerada pela Anac como inaceitável para o prosseguimento à fase 3.

  5.2.1.5 Para operadores regidos exclusivamente pelo RBAC nº 91, caso uma proposta de MEL
  seja rejeitada pela 3ª vez durante a análise (preliminar ou da fase 3), o processo será
  indeferido e arquivado compulsoriamente, independentemente do prazo.

  Nota: para os detentores de certificado emitido segundo o RBAC nº 119, valem os procedimentos
  estabelecidos nas IS nº 119-001 e 119-004. Para administradores de programa segundo a Subparte
  K do RBAC nº 91, valem os procedimentos estabelecidos na IS nº 91-013.

  5.2.1.6 Após análise documental da MEL, a critério da Anac, poderá ser conduzida uma inspeção
  para verificar a capacidade do operador em utilizar a MEL em suas operações, constituindo
  a fase 4 do processo de aprovação. No caso de operadores em certificação ou que estiverem
  incluindo um novo modelo de aeronave na frota que requeira a realização de voos de avaliação
  operacional, essa inspeção poderá ser conduzida em conjunto com a auditoria de certificação
  e/ou com os voos de avaliação operacional.'
