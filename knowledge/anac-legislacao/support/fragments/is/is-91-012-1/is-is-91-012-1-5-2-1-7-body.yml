text: '5.2.1.7 A MEL é aprovada por FOP 111, 211 ou ofício. Uma cópia do documento de aprovação
  deve sempre acompanhar cada cópia da MEL distribuída pelo operador.

  5.2.1.7.1 Ao emitir o FOP 111, 211 ou ofício, a Anac fará constar que o documento de aprovação
  será automaticamente revogado no prazo máximo de 180 dias após a publicação de revisão da
  MMEL que requeira revisão da MEL do operador, conforme parágrafo 5.2.3.2 desta IS.

  5.2.1.8 Um FOP 111, 211 ou ofício aprova a MEL especificamente para um operador. Caso a
  aeronave troque de operador, o novo operador não pode automaticamente utilizar a MEL anteriormente
  aprovada, devendo submeter novamente uma MEL para aprovação da Anac, caso pretenda utilizar
  as prerrogativas de MEL ou seja requerido que possua uma MEL aprovada.'
