family: '91'
section_id: 5.2.2.2
section_title: 'Quando ocorrer alguma das situações descritas abaixo, o operador deve analisar
  sua MEL, objetivando verificar se há impacto no conteúdo de sua MEL:'
subsection_id: c
cite: 5.2.2.2(c)
title: 5.2.2.2(c)
text: c) suas aeronaves incorporarem grandes alterações (ver parágrafo 5.1.2.9 desta IS) ou
  de outra forma tiverem configuração alterada de forma a afetar a aplicabilidade da MEL a
  tais aeronaves. No caso de MEL para uma frota, conforme 5.1.2.4.3, é permitido que o operador
  continue utilizando a mesma MEL, apenas reclassificando as aeronaves com configuração alterada
  para uma outra condição de despacho prevista na MEL aprovada, não sendo, assim, necessária
  a revisão da MEL. No entanto, caso a nova configuração não esteja abrangida pela MEL aprovada,
  torna-se necessária revisão da MEL para abranger tal configuração;
