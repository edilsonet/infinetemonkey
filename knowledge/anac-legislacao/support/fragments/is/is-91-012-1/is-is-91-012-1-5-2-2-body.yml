title: Revisão da MEL
text: '5.2.2 Revisão da MEL

  5.2.2.1 Quando for publicada uma nova revisão da MMEL, o operador deve analisá-la, objetivando
  verificar se essa revisão é mais restritiva do que a revisão da MMEL utilizada como referência
  para a sua MEL vigente e se essa nova revisão da MMEL impõe restrições adicionais sobre
  sua MEL vigente. Esta análise também deve ocorrer quando for emitida pela Anac uma política
  de MEL - neste caso, observando-se o prazo previsto no parágrafo 5.1.2.3.2.2 desta IS. Como
  resultado dessa análise, pode-se obter um dos resultados previstos nos subparágrafos seguintes,
  5.2.2.1.1 ou 5.2.2.1.2.

  Nota 1: o procedimento de análise de nova revisão da MMEL, pelo operador, se aplica para
  qualquer revisão da MMEL, incluindo as revisões denominadas “temporárias” (ou interim).

  Nota 2: quando o operador utiliza como referência uma MMEL emitida pelo detentor do projeto
  de tipo de forma personalizada para suas aeronaves, o operador também deve analisar cada
  revisão da MMEL emitida, independentemente do motivo da revisão. Quando o motivo da revisão
  for apenas a alteração da alocação das aeronaves nas condições já previstas na MEL e o operador
  utilizar a MEL para uma frota, não é necessário seguir os subparágrafos 5.2.2.1.1 ou 5.2.2.1.2.
  Quando o motivo da revisão for, simultaneamente, a alteração da alocação das aeronaves nas
  condições já previstas na MEL (supondo que o operador utiliza a MEL para uma frota) e alterações
  que impactam o conteúdo aprovado da MEL, o operador deve considerar os dois motivos em paralelo,
  podendo aplicar a nova alocação das aeronaves nas condições já previstas na MEL aprovada
  enquanto segue os subparágrafos 5.2.2.1.1 ou 5.2.2.1.2 para avaliar o impacto da revisão
  da MMEL no conteúdo aprovado de sua MEL.

  5.2.2.1.1 Caso a nova revisão da MMEL seja mais restritiva do que a revisão da MMEL utilizada
  como referência para a MEL vigente, e essa revisão da MMEL impuser restrições adicionais
  sobre a MEL, o operador deve submeter uma revisão atualizada de sua MEL no prazo de 60 dias
  ou prazo mais restritivo estabelecido na MMEL.

  5.2.2.1.1.1 O prazo de 60 dias (ou prazo mais restritivo estabelecido na MMEL) pode ser
  prorrogado pela Anac, mediante solicitação do operador, desde que devidamente justificada.
  Uma possível justificativa, por exemplo, é um eventual atraso da publicação das orientações
  para o estabelecimento dos procedimentos (O) e (M), após a publicação da revisão da MMEL.

  5.2.2.1.1.2 Caso o operador não submeta uma revisão atualizada de sua MEL após o prazo estabelecido,
  a Anac poderá revogar o documento de aprovação da sua última MEL.

  5.2.2.1.1.3 Independentemente da data de submissão da revisão atualizada da MEL, o operador
  deve completar o processo de aprovação dessa revisão da MEL no prazo de 180 dias a contar
  da publicação da MMEL. Após esse prazo, exceto se expressamente autorizado de outra forma
  pela Anac, mediante solicitação do operador, a aprovação da MEL estará automaticamente revogada.

  5.2.2.1.1.4 Para detentores de certificado emitido segundo o RBAC nº 119 regidos pelo RBAC
  nº 121, os prazos previstos no parágrafo 5.2.2.1 desta IS e em seus subparágrafos também
  se aplicam caso seja publicada a revisão original de MMEL para o modelo de aeronave que
  até então não possua MMEL publicada, ou ainda caso seja alterada a fonte da MMEL de referência,
  em conformidade com a IS nº 21.61-005.

  5.2.2.1.2 Se a nova revisão da MMEL for menos restritiva do que a revisão da MMEL utilizada
  como referência para a MEL vigente ou se, apesar de a nova revisão da MMEL ser mais restritiva,
  essa nova revisão da MMEL não impuser restrições adicionais sobre a MEL vigente (por exemplo,
  se a revisão da MMEL for mais restritiva apenas em itens não aplicáveis à MEL do operador),
  o operador pode, a seu critério, submeter uma revisão atualizada de sua MEL. Caso não pretenda
  revisar sua MEL, o operador deve notificar a Anac no prazo de 60 dias (ou prazo mais restritivo
  estabelecido na MMEL), expondo sua ciência quanto à publicação de revisão da MMEL e justificando
  por que não considera necessário revisar sua MEL. Caso o operador não atenda a este parágrafo,
  a Anac poderá revogar o documento de aprovação da sua última MEL.

  5.2.2.1.2.1 Após receber a notificação do operador, a Anac analisará as justificativas apresentadas.
  Caso esteja de acordo, a Anac emitirá ofício autorizando o operador a permanecer utilizando
  a MEL elaborada com base na revisão anterior da MMEL até que seja requerida nova revisão
  de sua MEL. Esse ofício constituirá uma aprovação para que se continue utilizando a mesma
  MEL anteriormente aprovada. Uma cópia desse ofício deve sempre acompanhar cada cópia da
  MEL distribuída pelo operador, em conjunto com a cópia do documento que originalmente aprovou
  a MEL, conforme o parágrafo 5.2.1.7 desta IS.

  5.2.2.1.2.2 Caso, após análise, a Anac não esteja de acordo com a justificativa do operador,
  a Anac informará o operador da necessidade de adequação de sua MEL e estabelecerá prazo
  de 15 dias para que o operador revise sua MEL com base na última revisão da MMEL. Para esse
  caso, aplicam-se os parágrafos 5.2.2.1.1.2 e 5.2.2.1.1.3 desta IS. Caso o operador, de forma
  recorrente, apresente justificativas insatisfatórias, a Anac poderá suspender o uso da MEL.'
