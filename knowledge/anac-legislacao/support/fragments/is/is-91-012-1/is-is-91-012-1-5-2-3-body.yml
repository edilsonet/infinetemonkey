cite: 5.2.3
title: Revogação da aprovação
text: '5.2.3 Revogação da aprovação

  5.2.3.1 A aprovação de uma nova revisão da MEL revogará a aprovação da revisão anterior,
  ou seja, o operador apenas pode utilizar a revisão aprovada mais recente de sua MEL. Como
  exceção, e somente em caráter transitório, o operador pode utilizar a revisão anterior da
  MEL conforme previsto nos parágrafos 5.2.2.7 e 5.3.12 desta IS.

  5.2.3.2 Exceto se expressamente autorizado de outra forma pela Anac, mediante solicitação
  do operador, a emissão de revisão de MMEL que requeira revisão da MEL do operador implicará
  na revogação da aprovação da MEL do operador elaborada com base na revisão anterior da MMEL
  no prazo máximo de 180 dias, cabendo ao operador submeter revisão de sua MEL, conforme parágrafo
  5.2.2 desta IS, e obter aprovação antes desse prazo para que possa se manter com uma MEL
  aprovada. Após esse prazo, a aprovação da MEL é considerada automaticamente revogada, sem
  a necessidade de comunicação expressa da Anac notificando o operador dessa revogação. Esse
  prazo não impede, no entanto, que a aprovação seja revogada antecipadamente, por iniciativa
  e mediante notificação por parte da Anac, de acordo com a situação, conforme previsto nos
  parágrafos 5.2.2.1.1.2, 5.2.2.1.2 e 5.2.2.2.2 desta IS, por exemplo.

  5.2.3.3 A alteração de operador da aeronave automaticamente revogará a aprovação da MEL,
  uma vez que, conforme o parágrafo 5.2.1.8 desta IS, a MEL não é transferível para o novo
  operador.

  5.2.3.4 Caso seja constatada, por meio de inspeções ou outra forma de investigação, a ocorrência
  de não-conformidades consideradas graves na utilização das prerrogativas da MEL, a Anac
  poderá revogar a aprovação da MEL do operador ou o documento que autoriza sua utilização.

  5.2.3.5 Caso seja revogada a aprovação de uma MEL, o operador fica impedido de levá-la a
  bordo de suas aeronaves, de forma a impedir que os tripulantes utilizem essa MEL inadvertidamente.
  As cópias dessa MEL em solo, caso não sejam recolhidas e inutilizadas, devem ser claramente
  marcadas como um documento fora de uso, não podendo mais estar acompanhadas do FOP 111 ou
  211 ou do ofício de aprovação.

  5.2.3.6 No caso de detentores de certificado emitido segundo o RBAC nº 119 regidos pelo
  RBAC nº 121, a revogação da aprovação da MEL poderá implicar na interrupção das operações
  das aeronaves do modelo afetado, uma vez que, quando existe MMEL publicada, a MEL é documento
  obrigatório no sistema de manuais do operador, conforme 121.628(a) do RBAC nº 121.

  5.3 Utilização da MEL em serviço

  5.3.1 Embora a MEL aprovada permita a operação com itens inoperantes por determinado período,
  é importante que os reparos sejam efetuados na primeira oportunidade. Dessa forma, o operador
  deve utilizar sua MEL apenas como parte de um programa controlado e abrangente de reparo
  das panes verificadas.

  5.3.2 No caso de detentores de certificado emitido segundo o RBAC nº 119 e administradores
  de programa segundo a Subparte K do RBAC nº 91, os procedimentos previstos nesta seção para
  utilização da MEL em serviço devem ser realizados em conformidade com o previsto nos manuais
  do operador, conforme requerido pelo item 5.1.3 desta IS.

  5.3.3 Caso um item se torne inoperante em voo, o piloto em comando é responsável por registrar,
  ou fazer registrar, tal ocorrência nos registros da aeronave (diário de bordo ou registro
  próprio que corresponda à parte II do diário de bordo) logo após o pouso, tão logo seja
  praticável. Caso o item se torne inoperante em solo e a aeronave estiver sob responsabilidade
  do piloto em comando, ele também deve registrar, ou fazer registrar, tal ocorrência, tão
  logo seja possível e antes da próxima decolagem. Por fim, caso o item se torne inoperante
  em solo, com a aeronave sob responsabilidade da manutenção, tal obrigação deve ser cumprida
  pelo mecânico de manutenção aeronáutica. O operador é solidariamente responsável por garantir
  que esse registro seja realizado corretamente.

  5.3.3.1 Caso a operação com o item inoperante seja prevista na MEL e haja intenção de despachar
  a aeronave com tal item inoperante, o registro do item inoperante deve fazer referência
  à identificação do item na MEL do operador (código ATA).

  5.3.3.2 Os registros no diário de bordo ou registro próprio que corresponda à parte II do
  diário de bordo - e, no caso de detentores de certificado emitido segundo o RBAC nº 119
  e administradores de programa segundo a Subparte K do RBAC nº 91, também a relação de controle
  de itens ACR, requerida pelo parágrafo 5.1.3.3 desta IS - devem ser elementos suficientes
  para propiciar, a qualquer tempo, aos tripulantes e à Anac, em caso de inspeção, uma visão
  clara e imediata da situação de cada aeronave com respeito ao cumprimento da MEL.

  5.3.4 Após o registro de um defeito no diário de bordo (ou registro próprio que corresponda
  à parte II do diário de bordo), a aeronave somente pode ser liberada para voo se o defeito
  for corrigido ou se, com base na MEL aprovada, se verifique que é possível um relaxamento
  desse item e, observadas as condições e limitações estabelecidas na MEL e executados os
  procedimentos previstos na MEL, se permita o retorno da aeronave para o voo.

  Nota: a operação sob o parágrafo 91.213(d) do RBAC nº 91, que não se aplica a detentores
  de certificado emitido segundo o RBAC nº 119 nem a administradores de programa segundo a
  Subparte K do RBAC nº 91, constitui exceção ao parágrafo anterior, devendo ser observadas
  as condições do parágrafo 5.4 desta IS.

  5.3.4.1 Conforme os parágrafos 91.1025(f) e (g) do RBAC nº 91 e 135.65(c)(1) do RBAC nº
  135 e a seção 121.563 do RBAC nº 121, conforme aplicável, é responsabilidade do piloto em
  comando, antes de cada voo, verificar a situação dos itens inoperantes nos registros da
  aeronave.

  5.3.4.2 Para que uma aeronave possa operar com algum item inoperante, a tripulação deve
  ter acesso à MEL aprovada, acompanhada pelo FOP 111, 211 ou ofício de aprovação, e aos registros
  de itens inoperantes (diário de bordo ou registro próprio que corresponda à parte II do
  diário de bordo, além de lista de itens ACR) durante o planejamento do voo e até o momento
  da decolagem.

  5.3.4.2.1 O acesso à MEL deve ser em formato impresso ou, de acordo com a política de autorização
  da Anac para uso de informação aeronáutica em formato digital, em EFB. No caso de detentores
  de certificado emitido segundo o RBAC nº 119, a autorização para uso da MEL em EFB deve
  ser aprovada pela Anac em EO.

  5.3.4.2.2 Procedimentos como chamadas de voz (como telefone, rádio ou Internet) ou mensagens
  escritas (como datalink ou Internet) são considerados meios indiretos de acesso à MEL e
  não satisfazem esse requisito.

  5.3.4.3 No caso de operadores regidos pelo RBAC nº 121, o despachante operacional de voo
  ou a pessoa responsável pelo controle operacional também deve ter acesso direto à MEL aprovada,
  acompanhada pelo FOP 111, e acesso às informações de itens inoperantes, para que possa ser
  exercida a responsabilidade estabelecida na seção 121.605 do RBAC nº 121. Como o despachante
  operacional de voo ou a pessoa responsável pelo controle operacional normalmente não tem
  acesso direto ao diário de bordo ou registro próprio que corresponda à parte II do diário
  de bordo, o operador pode inserir as informações de itens inoperantes em um sistema informatizado
  que permita o acesso de forma indireta.

  5.3.4.4 Os detentores de certificado emitido segundo o RBAC nº 119 devem assegurar que o
  pessoal do centro de controle operacional e do centro de despacho de voo, assim como a tripulação
  de voo, estejam cientes, no momento do planejamento do voo, de qualquer restrição de voo
  imposta pela MEL quando se opera com algum item inoperante. Essas restrições podem envolver
  restrições de altitudes máximas, limitações de desempenho, limitações de peso, restrições
  de condições meteorológicas (por exemplo, condições de formação de gelo), limitações para
  uso de recursos de comunicação ou navegação em terra, alterações no consumo previsto de
  combustível, entre outras.

  5.3.4.4.1 Para operações regidas pelo RBAC nº 121, o documento de despacho (ou liberação)
  de voo, emitido por despachante operacional de voo ou pessoa responsável pelo controle operacional,
  deve incluir as informações dos itens inoperantes e das limitações e condições aplicáveis,
  conforme a MEL.

  5.3.5 A liberação da aeronave para voo, seja após a realização de uma ação corretiva, seja
  pelo relaxamento de um item previsto na MEL, deve ser lançada nos registros da aeronave.
  A aprovação para retorno ao serviço deve ocorrer antes do voo, conforme requerido pela seção
  91.407 do RBAC nº 91, devendo se cumprir, adicionalmente, os requisitos dos regulamentos
  específicos aplicáveis.

  5.3.5.1 Os detentores de certificado emitido segundo o RBAC nº 119 devem estabelecer em
  seus manuais os procedimentos de liberação da aeronave e de registro dessa liberação no
  diário de bordo (ou registro próprio que corresponda à parte II do diário de bordo) e na
  relação de controle de itens ACR. Essa liberação pode ser registrada por meio de nota certificando
  que a ação corretiva foi tomada, com assinatura de quem efetuou a ação corretiva e a anotação;
  ou por meio de nota referindo-se a um retardo na correção do item concedido pela MEL (ou
  autorizado de outra forma pela Anac), com assinatura de quem autorizou o relaxamento e de
  quem efetuou os procedimentos necessários (se aplicáveis) e a anotação.

  5.3.5.2 Os detentores de certificado emitido segundo o RBAC nº 119 podem estabelecer que
  os tripulantes registrem a liberação da aeronave no diário de bordo, mesmo nos casos em
  que os procedimentos tenham sido executados pelo pessoal de manutenção. Nesse caso, os procedimentos
  dos detentores devem garantir um registro claro, que diferencie as identificações de quem
  executou a manutenção e de quem efetuou o registro.

  5.3.5.3 Quando for requerida a execução dos procedimentos (O) e (M) de forma repetitiva
  (antes de cada partida ou antes de cada dia de voo, por exemplo), as ações tomadas devem
  ser registradas no diário de bordo ou registro próprio que corresponda à parte II do diário
  de bordo a cada execução - não sendo suficiente o registro das ações tomadas na relação
  de controle de itens ACR (parágrafo 5.1.3.3g) desta IS).

  5.3.6 Um retardo na correção de um item (relaxamento) somente pode ser concedido conforme
  a MEL após o operador ter determinado que a aeronave está em condições de realizar um voo
  seguro e que as condições específicas, limitações e procedimentos de manutenção (M) e de
  operações (O) estabelecidos na MEL foram observados.

  5.3.6.1 Quando o relaxamento de um item estiver condicionado a que outro item seja considerado
  inoperante (condição “considered inoperative”, ou equivalente), o item considerado inoperante
  deve ser tratado durante as fases de despacho, táxi e voo como se estivesse, de fato, inoperante.
  Assim, o item considerado inoperante não pode ser utilizado até que o item originalmente
  relaxado esteja operante. Os procedimentos de documentação e registro, identificação (placares),
  o prazo de reparo e todas as condições e limitações, incluindo os procedimentos (O) e (M),
  estabelecidos para ambos os itens - o originalmente relaxado e o considerado inoperante
  - devem ser observados.

  5.3.6.2 Quando o relaxamento de um item estiver condicionado a que outro item não seja usado
  (condição “is not used”, ou equivalente), a tripulação não pode ativar, atuar sobre ou de
  qualquer outra forma utilizar este outro item sob condições normais de operação. Os procedimentos
  operacionais (O) decorrentes da impossibilidade de se utilizar este item devem ser observados.
  Ainda, o item a não ser utilizado deve ser identificado com placar (em posição definida
  conforme parágrafo 5.1.2.8 desta IS) informando que o item não pode ser utilizado. A menos
  que expressamente requerido de outra forma, porém, não é necessário cumprir com os procedimentos
  (M) do item operante que não esteja sendo utilizado.

  5.3.6.3 Conflito com diretriz de aeronavegabilidade. Caso haja uma diretriz de aeronavegabilidade
  (DA) que requeira que determinado item esteja operante, essa DA tem prevalência sobre a
  MEL. Assim, ainda que a MEL preveja a possibilidade de liberar a aeronave com tal item inoperante,
  a aeronave não pode ser operada em violação à DA. A operação de aeronave sem o cumprimento
  das diretrizes de aeronavegabilidade aplicáveis é vetada pelo RBAC nº 39. Para atendimento
  ao parágrafo 5.1.2.3d) desta IS, o operador deve submeter uma revisão da MEL para aprovação
  da Anac de modo a adequar o conteúdo da MEL ao da DA.

  5.3.6.4 Quando a MEL estabelece que um voo deve ocorrer sob regras de voo visual (VFR),
  não se pode operar sob regras de voo por instrumentos (IFR). Por outro lado, se a MEL estabelece
  que um voo deve ocorrer sob condições meteorológicas visuais (VMC), o piloto pode operar
  tanto IFR quanto VFR, desde que mantidas as condições VMC.

  5.3.6.5 Quando a MEL autoriza que um componente de um sistema esteja inoperante, apenas
  esse componente pode estar afetado. Quando a MEL autoriza que um sistema esteja inoperante,
  componentes do sistema podem também estar inoperantes. Qualquer sistema de aviso ou de alarme
  associado a esse sistema deve estar operante, exceto se a MEL prevê relaxamento especificamente
  para o sistema de aviso ou de alarme.

  Nota: o relaxamento específico para o sistema de aviso ou de alarme somente poderá constar
  na MEL se constar na MMEL.

  5.3.6.6 Quando houver múltiplos itens inoperantes, devem ser considerados a correlação entre
  esses itens, os efeitos na operação da aeronave e na sobrecarga de trabalho imposta aos
  tripulantes e as limitações das operações de voo, assim como deve ser avaliada a possibilidade
  de ocorrer uma falha adicional de outro item durante o voo, pois tais fatores não são considerados
  na elaboração e análise da MEL.

  5.3.6.7 O relaxamento de um item conforme a MEL não implica que a aeronave pode ser liberada
  para voo com esse item desinstalado ou removido, exceto se a MEL explicitamente permitir
  a desinstalação ou remoção.

  5.3.7 O piloto em comando, como responsável pela verificação das condições da aeronave quanto
  à segurança, conforme o parágrafo 91.7(b) do RBAC nº 91, deve decidir se aceita ou recusa
  operar uma aeronave com itens inoperantes, ainda que tal operação esteja abrangida pela
  MEL.

  5.3.8 A MEL é um documento que deve ser utilizado em solo para itens inoperantes dos quais
  se tenha ciência, desde o planejamento do voo até antes da decolagem, podendo estabelecer
  condições que se aplicam também durante o voo.

  5.3.8.1 Caso a inoperância de um item seja verificada entre o momento do planejamento do
  voo e a decolagem, o operador deve garantir o tratamento desta falha de acordo com sua MEL
  e procedimentos aprovados. Para operações de detentores de certificado emitido segundo o
  RBAC nº 119 e de administradores de programa segundo a Subparte K do RBAC nº 91, devem ser
  seguidos os procedimentos descritos no manual do operador (ver parágrafos 5.1.3.7(l) e (m)
  desta IS).

  5.3.8.2 No caso de falhas que ocorram após o início da movimentação da aeronave (ou, se
  aplicável, a emissão do despacho/liberação de voo), mas antes da decolagem, há a possibilidade
  de liberação do item ACR por pilotos, conforme as condições previstas no parágrafo 5.1.2.7
  desta IS.

  5.3.9 Para falhas ocorridas ou descobertas durante o voo, a MEL não se aplica até a próxima
  decolagem. Assim, devem ser observados os procedimentos constantes nas listas de verificações
  da aeronave (checklists) e nas seções apropriadas do manual de voo aprovado da aeronave
  (AFM), como as seções de procedimentos anormais e de emergência. Nesses casos, porém, os
  tripulantes podem consultar a MEL em voo para avaliar as condições de liberação da aeronave
  para o seu voo seguinte - o que pode justificar, por exemplo, uma alteração do local de
  pouso previsto, para um aeródromo em que a manutenção possa ser realizada. Adicionalmente,
  para operadores regidos pelos RBAC nº 121 e 135, devem ser observados os procedimentos estabelecidos
  pelo operador em seus manuais, conforme requerido pelos parágrafos 121.627(b) e 135.23(a)(9),
  respectivamente.

  5.3.10 Caso, após a realização de ação corretiva que supostamente havia corrigido o defeito,
  o item voltar a se apresentar inoperante em até 24 horas ou dois voos, o que ocorrer por
  último, caracteriza-se um defeito recorrente (ou intermitente). Defeitos recorrentes significam
  que um item se manteve inoperante, uma vez que não se encontra funcionando normalmente de
  forma consistente (ver definição do parágrafo 4.1.8 desta IS). Nesse caso, o operador deve
  considerar o intervalo de reparo com base no registro inicial da falha, e a liberação da
  aeronave para um novo voo somente pode ocorrer se for realizada ação corretiva ou se forem
  cumpridas as condições para relaxamento previstas na MEL.

  Nota: a existência de defeito recorrente ou intermitente não pode ser considerada motivo
  para o operador deixar de seguir os procedimentos e prazos previstos na MEL.

  5.3.11 Quando houver uma aprovação de nova revisão da MEL, o operador deve revisar a situação
  de suas aeronaves para garantir que os itens inoperantes atendem à última revisão aprovada
  da MEL. Caso a nova MEL estabeleça condições mais restritivas para um item, o operador deve
  passar a atender a tais condições no prazo de 15 dias. Caso o operador entenda que esse
  prazo é insuficiente para um caso particular, deve solicitar à Anac extensão do prazo, por
  um período adicional de no máximo 15 dias, indicando o item inoperante e incluindo suas
  justificativas.

  Nota 1: o parágrafo 5.2.2.7 desta IS se refere ao prazo para que o operador atualize a MEL
  a bordo das aeronaves. Já este parágrafo 5.3.11 desta IS se refere ao prazo para que condições
  mais restritivas constantes na revisão mais recente da MEL sejam observadas. Caso o operador
  precise solicitar extensão de algum desses prazos (ou de ambos), deve explicitar qual extensão
  está sendo solicitada.

  Nota 2: é possível que a cópia da MEL seja atualizada a bordo enquanto ainda não tenha vencido
  o prazo para que se apliquem as condições mais restritivas da revisão mais recente da MEL.
  Nesse caso, se a aeronave for operar com um item inoperante com base na revisão anterior
  da MEL, o operador deve esclarecer aos seus funcionários a revisão da MEL que permitiu a
  liberação da aeronave com esse item inoperante, assim como as condições aplicáveis.'
