section_title: 'O SEGVOO deve ser assinado:'
subsection_id: c
cite: 5.3.12.1.2(c)
title: 5.3.12.1.2(c)
text: 'c) no caso de demais operadores, pelo próprio operador da aeronave ou pessoa física
  que possa representá-lo.

  5.3.12.1.3 O SEGVOO 002 deve ser enviado por protocolo eletrônico à Gerência de Certificação
  de Aeronavegabilidade Continuada (GCAC), preferencialmente até 3 (três) dias úteis antes
  do término do prazo para reparo do item, de acordo com a MEL. Caso seja enviado no último
  dia útil antes do vencimento, a resposta poderá não ser emitida a tempo, impedindo a operação
  da aeronave após o término do prazo previsto na MEL. A Anac não autoriza a extensão de prazo
  após o término do prazo previsto na MEL.'
