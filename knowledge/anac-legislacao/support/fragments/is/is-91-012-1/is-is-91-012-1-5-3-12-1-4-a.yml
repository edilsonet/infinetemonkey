title: 5.3.12.1.4(a)
text: 'a) indisponibilidade do componente, como não recebimento do componente em tempo hábil,
  incapacidade do fornecedor de atender a demanda no prazo definido ou falha no controle de
  estoque do operador. Para esses casos, o operador deve enviar o seguinte documento em anexo
  ao SEGVOO 002:

  I - pedido de compra do componente em até 2 (dois) dias úteis após a conclusão da pesquisa
  de pane; ou'
