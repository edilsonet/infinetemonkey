title: 5.3.12.1.4(e)
text: 'e) registros: em adição aos requisitos de guarda de registros de manutenção, o operador
  deve indicar os registros que serão usados nesse programa de auto-extensão, incluindo o
  processo de aprovação de extensão e quaisquer outros registros que indiquem ações de manutenção,
  controle de peças e de equipamentos. Uma planilha de controle ou outros meios similares
  devem ser usados para rastrear todos os eventos relacionados à extensão do prazo de reparo
  até a retificação do item. O operador deve ser capaz de fornecer todos os registros necessários
  para justificar uma extensão do prazo da MEL, quando requerido; e'
