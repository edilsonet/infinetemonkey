title: Extensão de prazo de itens da MEL
text: '5.3.12 Extensão de prazo de itens da MEL

  5.3.12.1 Solicitações de extensão de prazo de itens da MEL. Nos casos em que o operador
  não conseguir realizar o reparo de um item dentro do prazo prescrito na MEL por razões alheias
  a sua vontade (devido, por exemplo, a falta de peças do fabricante ou a outras situações
  não previstas), podem ser solicitadas extensões dos prazos previstos na MEL. Exceto se de
  outra forma autorizado pela Anac, por ofício, EO ou EA, essas solicitações devem ser feitas,
  em caráter individual, para cada item pendente, em uma aeronave específica, para o qual
  se pretenda estender o tempo limite de reparo previsto na MEL, utilizando-se o formulário
  SEGVOO 002 (disponível eletronicamente no Sistema Eletrônico de Informações - SEI!). O documento
  de autorização da Anac deve ser levado a bordo da aeronave enquanto se estiver operando
  com base nessa autorização.

  5.3.12.1.1 Somente os itens das categorias B ou C são passíveis dessa aprovação, sendo cada
  prazo prorrogável somente uma vez e por no máximo igual período (intervalos da categoria
  B, por exemplo, podem ser prorrogados por no máximo três dias). Itens das categorias A ou
  D não podem ter sua correção prorrogada além do prazo previsto na MEL - independentemente
  de previsões distintas que eventualmente constem na MMEL de referência.'
