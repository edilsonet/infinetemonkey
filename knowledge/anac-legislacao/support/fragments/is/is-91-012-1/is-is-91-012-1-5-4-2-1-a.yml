section_title: 'A aeronave deve se enquadrar nas situações previstas em 91.213(d)(1):'
subsection_id: a
cite: 5.4.2.1(a)
title: 5.4.2.1(a)
text: a) removido da aeronave. A remoção deve ser realizada por uma pessoa autorizada, conforme
  a seção 43.3 do RBAC nº 43. Após a remoção, a aeronave deve ter seu retorno ao serviço aprovado
  por uma pessoa autorizada, conforme a seção 43.7 do RBAC nº 43. Se necessário, a pessoa
  autorizada conforme a seção 43.7 deve fazer os ajustes necessários à informação de pesagem
  da aeronave e à lista de equipamentos da aeronave. Ainda, deve ser colocado um placar na
  cabine dos pilotos, assim como registrada a ocorrência no diário de bordo ou registro próprio
  que corresponda à parte II do diário de bordo, conforme a seção 43.9 do RBAC nº 43; ou
