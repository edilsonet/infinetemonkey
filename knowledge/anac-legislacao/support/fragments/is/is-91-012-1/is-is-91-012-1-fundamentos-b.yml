title: fundamentos(b)
text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da Anac.

  3.3 O meio ou procedimento alternativo mencionado no parágrafo 3.2(b) desta IS deve garantir
  nível de segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar
  o objetivo do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 Esta IS é fundamentada e objetiva oferecer método de cumprimento às seções 91.213 e
  91.1115 do RBAC nº 91, 121.628 do RBAC nº 121 e 135.179 do RBAC nº 135.

  Nota: Para efeitos desta IS, operadores sob outros regulamentos específicos (como RBAC nº
  90, 133, 136, 137, 141 e 142, entre outros), que não possuem requisitos específicos sobre
  MEL, são considerados como operadores regidos exclusivamente sob o RBAC nº 91, pois suas
  operações com itens inoperantes são reguladas pela seção 91.213 do RBAC nº 91.'
