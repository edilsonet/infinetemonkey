title: OBJETIVO
text: 'OBJETIVO

  1.1 Apresentar uma metodologia que proporcione a elaboração de Lista de Equipamentos Mínimos
  (MEL) aceitável pela Anac, capaz de permitir a operação de aeronaves com determinados equipamentos
  e instrumentos inoperantes, sob determinadas condições e limitações de operações, de modo
  a dar cumprimento ao requerido pelas seções 91.213 e 91.1115 do RBAC nº 91, 121.628 do RBAC
  nº 121 e 135.179 do RBAC nº 135, bem como outras seções que requeiram ou permitam a elaboração
  de MEL pelos operadores.

  1.2 Apresentar os procedimentos requeridos no processo de aprovação e revisão de MEL, desde
  sua submissão à análise da Anac até a emissão de autorização das operações de acordo com
  a MEL aprovada.

  1.3 Apresentar os procedimentos para utilização em serviço da MEL aprovada.

  1.4 Apresentar os procedimentos para operação com equipamentos e instrumentos inoperantes,
  sem MEL aprovada, conforme o parágrafo 91.213(d) do RBAC nº 91.'
