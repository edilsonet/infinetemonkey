  5.2 Processo de emissão das EA

  5.2.1 O processo de emissão das EA de administrador de programa de propriedade compartilhada
  de aeronaves, adotado pela Anac, possui cinco fases, e tem duração mínima estimada em 120
  dias (dependendo da agilidade da apresentação e precisão dos documentos e respostas da organização
  requerente às eventuais solicitações, questionamentos e não-conformidades apontadas pela
