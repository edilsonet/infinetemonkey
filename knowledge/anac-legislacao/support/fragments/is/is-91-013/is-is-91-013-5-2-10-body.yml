title: Prazos de referência do processo
text: '5.2.10 Prazos de referência do processo

  5.2.10.1 A tabela 3 apresenta diversos prazos referentes às atividades do EsEA na condução
  de um processo de emissão das EA. Seu conteúdo não se constitui prazo regulamentar para
  o final do processo, devendo, portanto, ser encarado pela organização requerente apenas
  como parâmetro de planejamento para o seu cronograma de eventos durante o processo de emissão
  das EA.

  5.2.10.2 Os prazos de processamento, por parte do EsEA, em cada fase, são os apresentados
  pela tabela 3 abaixo. Cada prazo apresentado nesta tabela será considerado a partir do recebimento
  do material pelo EsEA.

  5.2.10.3 A contagem dos prazos é interrompida, caso sejam informadas à organização requerente
  pendências e inconformidades ao longo do processo. Os prazos somente são retomados quando
  a organização requerente encaminha resposta satisfatória às pendências comunicadas.

  Tabela 3 - Prazos Médios para o Processamento das Atividades do EsEA (em dias corridos)

  Fase

  Prazo

  Evento inicial

  Evento final

  1

  10 dias

  Apresentação da solicitação de realização de ROP*

  ROP bem-sucedida, formalizada em ata, e emissão de ofício comunicando o encerramento da
  Fase 1.

  * O processo de solicitação de emissão das EA, segundo esta IS, pode ser iniciado a partir
  da Fase 2, sendo opcional a realização da ROP.

  2

  10 dias

  Solicitação de emissão das EA e apresentação do PSF.

  Emissão de ofício comunicando o encerramento da Fase 2

  3

  45 dias

  Disponibilização dos processos dos manuais e programas para análise.

  Emissão de ofício comunicando o encerramento da Fase 3.

  4

  60 dias

  Agendamento das demonstrações e inspeções.

  Emissão de ofício comunicando o encerramento da Fase 4.

  5

  5 dias

  Verificações finais.

  Emissão das EA.'
