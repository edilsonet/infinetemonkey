title: Encerramento compulsório do processo de emissão das EA
text: '5.2.11 Encerramento compulsório do processo de emissão das EA

  5.2.11.1 Caso seja considerado pela Anac que o processo contém omissões, em relação ao listado
  nesta IS, após a avaliação preliminar ou análise, independentemente do número de iterações,
  o processo será indeferido e arquivado compulsoriamente, e o requerente formalmente comunicado.

  5.2.11.2 Para cada manual, programa ou documento, caso uma proposta seja rejeitada pela
  3ª vez durante a análise, o processo relacionado a essa proposta será indeferido e arquivado
  compulsoriamente, independentemente do prazo.

  5.2.11.3 Nos casos em que a rejeição de um documento, manual ou programa for motivada pela
  atualização de um regulamento, publicação técnica do fabricante ou autoridade de aviação
  civil, ou qualquer documento de referência para análise do material, não haverá contabilização
  dessa iteração para fins de arquivamento do processo específico.

  5.2.11.4 Quando o arquivamento de um determinado manual ou programa, conforme descrito no
  parágrafo anterior, ocorrer 2 (duas) vezes durante o processo de emissão das EA, este será
  indeferido e arquivado compulsoriamente, independentemente do prazo.

  5.2.11.5 Caso a demonstração da execução de um determinado procedimento ou operação, bem
  como testes de validação, seja rejeitada pela 3ª vez por não-conformidade ou incapacidade
  de demonstração por parte do requerente, o processo de emissão das EA será indeferido e
  arquivado compulsoriamente, independentemente do prazo.

  5.2.11.6 A organização requerente de emissão das EA para administrar programa de propriedade
  compartilhada de aeronaves, conforme a Subparte K do RBAC nº 91, deverá apresentar as ações
  requeridas durante as fases do processo ou as respostas a cada comunicação de não-conformidade,
  dentro do prazo estabelecido pelo EsEA, porém não superior a 60 (sessenta) dias.

  5.2.11.7 A não observância do prazo de 60 (sessenta) dias, ou outro prazo eventualmente
  definido, para a apresentação das ações requeridas, em qualquer fase, caracterizará que
  o requerente não está própria e adequadamente equipado, ou que não é capaz de conduzir operações
  seguras segundo a Subparte K, o que ensejará o indeferimento do processo de emissão das
  EA, conforme o parágrafo 91.1014(c) do RBAC nº 91.

  5.2.11.8 A descontinuidade ou desistência do processo de emissão das EA, em qualquer de
  suas fases, implicará o seu indeferimento e arquivamento, inclusive de processos correlatos,
  tornando nula qualquer autorização que já tenha sido concedida pela Anac durante o processo.

  5.2.11.9 Um processo encerrado não pode ser reaberto, tampouco documentos contidos nele
  podem ser reutilizados, salvo por decisão de reconsideração, assegurado o direito de ampla
  defesa e do contraditório.

  5.2.11.10 Para as decisões da Anac, é assegurado ao requerente o direito de ampla defesa
  e do contraditório. Os recursos devem ser direcionados à autoridade que emitiu a decisão,
  que poderá remetê-los às instâncias superiores.

  5.2.11.11 O prazo para a apresentação de recurso contra as decisões da Anac é de 10 dias
  a contar da ciência da decisão, conforme previsto na Lei nº 9.784/99 (Lei do processo administrativo).'
