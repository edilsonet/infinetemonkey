text: '5.2.12.3 A Anac é representada em fiscalizações e ensaios por servidores qualificados
  na área específica de inspeção.

  5.2.12.4 O setor da Anac encarregado de conduzir os processos de análise de documentos,
  manuais e programas é a Gerência Técnica de Certificação (GTCE), e o setor encarregado de
  conduzir as inspeções e auditorias nas áreas de operações é a Gerência Técnica de Vigilância
  Continuada (GTVC), ambas subordinadas à GOAG da SPO.

  5.2.12.5 O setor da Anac encarregado de estabelecer requisitos de aeronavegabilidade, certificar
  e inspecionar aeronaves, suspender ou cassar certificados de aeronavegabilidade e conduzir
  todos os requisitos relativos à aeronavegabilidade de aeronaves regulamentadas pelo RBAC
  nº 91 é a Gerência de Certificação de Aeronavegabilidade Continuada (GCAC) da SPO.

  5.3 Processo de alteração das EA'
