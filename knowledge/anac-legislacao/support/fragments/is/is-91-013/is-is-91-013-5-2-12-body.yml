title: Responsabilidade pelos processos de emissão das EA
text: '5.2.12 Responsabilidade pelos processos de emissão das EA

  5.2.12.1 Para as organizações que pretendam obter, alterar, suspender, revogar as EA de
  acordo com os requisitos da Subparte K do RBAC nº 91, o EsEA é a Gerência de Operações da
  Aviação Geral (GOAG) da Superintendência de Padrões Operacionais (SPO).'
