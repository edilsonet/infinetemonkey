text: '5.2.2.11 A organização será informada, no processo, quando ocorrer a conclusão das
  fases 2, 3 e 4, sendo a Fase 5 - Emissão das EA a conclusão do processo.

  5.2.2.12 A descontinuidade ou desistência do processo de emissão das EA, seja por não observância
  aos prazos estabelecidos, seja por solicitação, em qualquer de suas fases, implicará o seu
  indeferimento.

  5.2.2.13 Processos de alteração das características do programa de propriedade compartilhada
  de aeronaves, após a emissão inicial das EA, conforme seção 5.3 desta IS, seguirão o mesmo
  rito das 5 fases, salvo por decisão do EsEA.'
