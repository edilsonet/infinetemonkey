title: Regime de portais do processo
text: '5.2.2 Regime de portais do processo

  5.2.2.1 O processo de emissão das EA adotado pela Anac impõe um regime de portais, ou seja,
  somente se pode considerar que uma fase esteja encerrada, caso todos os requisitos ou critérios
  dessa fase tenham sido cumpridos e considerados satisfatórios.

  5.2.2.2 A Fase 1 - Solicitação prévia inclui as informações contidas nesta IS, na emenda
  em vigor do RBAC nº 91 e nas publicações ou divulgações oficiais da Anac, sendo opcional
  a solicitação de ROP, ou outra ação relacionada a essa fase. A abertura de processo nesta
  fase somente será necessária se houver a intenção de ROP.

  5.2.2.3 Se a organização requerente estiver satisfeita com as informações disponíveis durante
  a Fase 1, poderá iniciar o processo de solicitação de emissão das EA para administrar um
  programa de propriedade compartilhada de aeronaves, por peticionamento eletrônico utilizando
  o SEI!, a partir da Fase 2 - Solicitação formal, com a apresentação direta de todos os documentos
  que deverão compor o PSF, segundo instruções contidas nesta IS.

  5.2.2.4 Ao solicitar a emissão das EA, com a apresentação do PSF, a organização requerente
  deverá estar estruturada para demonstrar o requerido nas fases dentro do prazo, de acordo
  com a seção 5.2.5.9 desta IS.

  5.2.2.5 Iniciada a Fase 2, a equipe técnica do EsEA realizará uma avaliação preliminar da
  documentação, de modo a verificar se o PSF foi apresentado de forma satisfatória e está
  apto para prosseguimento à fase seguinte.

  5.2.2.6 Se houver não-conformidades no PSF apresentado pela organização requerente, o EsEA
  avaliará a complexidade das pendências e decidirá pelo indeferimento do processo, sugerindo
  a apresentação de nova proposta, ou determinará um prazo para a regularização das pendências
  apontadas. Nesse caso, o andamento do processo será interrompido com sobrestamento, até
  o saneamento dessas pendências.

  5.2.2.7 Durante a Fase 3 - Avaliação de documentos, alguns documentos poderão ser desmembrados
  do processo principal para análise em processos individuais relacionados ao principal.

  5.2.2.8 Se a organização requerente pretender fazer alterações nas características do processo
  de emissão das EA em curso, dependendo da complexidade da alteração, o processo poderá retornar
  a fases anteriores ou reiniciado com nova solicitação, situação que provocará o encerramento
  do processo em curso.

  5.2.2.9 Ao iniciar a Fase 4 - Demonstrações e inspeções, a organização deverá estar apta
  a demonstrar sua capacidade de cumprir com os requisitos regulamentares e com as práticas
  operacionais seguras, inclusive os critérios estabelecidos por esta IS.

  5.2.2.10 Se a organização requerente deixar de atender um ou mais requisitos anteriormente
  atendidos que lhe permitiram o prosseguimento, em qualquer fase, o processo poderá retornar
  às fases anteriores até a satisfação desses requisitos.'
