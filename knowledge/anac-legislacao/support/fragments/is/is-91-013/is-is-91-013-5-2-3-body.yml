title: Representantes e pessoas de contato da organização requerente
text: '5.2.3 Representantes e pessoas de contato da organização requerente

  5.2.3.1 As comunicações, interações e documentos necessários ao processo de emissão das
  EA somente serão aceitos se realizados pelas pessoas legalmente designadas pela organização
  requerente, respeitadas as respectivas áreas de atuação. Os representantes não-técnicos,
  legalmente designados, poderão receber orientações gerais sobre a documentação encaminhada
  ao EsEA pela organização requerente.

  5.2.3.2 São consideradas pessoas legalmente designadas pela organização requerente: o gestor
  responsável, os indicados para os cargos de pessoal de administração requerido e os procuradores
  legalmente constituídos.

  5.2.3.3 Não obstante os parágrafos 5.2.3.1 e 5.2.3.2 e visando otimizar as interações entre
  a Anac e a organização requerente, detalhes envolvendo atendimento de requisitos técnicos
  somente serão fornecidos ao pessoal da direção da organização requerente ou ao pessoal técnico
  por ela indicado e encarregado de providenciar o cumprimento do requisito técnico.

  5.2.3.4 O coordenador de projeto será a principal via de comunicação entre a organização
  requerente e a Anac. Entretanto, as comunicações e interações relacionadas aos processos
  de análise de manuais, programas e documentos, na Fase 3, e inspeções e demonstrações, na
  Fase 4, que estejam sob responsabilidade dos demais integrantes da equipe técnica, serão,
  preferencialmente, realizadas com o próprio integrante da equipe técnica que estiver encarregado
  da análise do processo, visando agilizar a interação.

  5.2.3.5 A adequada condução do processo depende da efetividade da comunicação entre a Anac
  e a organização requerente. Portanto, é essencial que a organização requerente realize e
  mantenha atualizado seu cadastro no protocolo eletrônico da Anac, bem como as indicações
  dos representantes legais e procuradores especiais no sistema SEI. O processo eletrônico
  da Anac está previsto na Resolução nº 520/2019 e maiores informações podem ser consultadas
  no seguinte endereço: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.'
