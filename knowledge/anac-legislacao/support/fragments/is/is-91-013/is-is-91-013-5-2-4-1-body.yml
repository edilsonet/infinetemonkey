title: Solicitação de informações
text: '5.2.4.1 Solicitação de informações

  5.2.4.1.1 A organização interessada deve obter as informações disponíveis nas publicações
  oficiais da Anac, em seu sítio eletrônico na rede mundial de computadores: https://www.gov.br/anac/pt-br/assuntos/regulados,
  bem como se familiarizar com as instruções contidas nesta IS e com os requisitos do RBAC
  nº 91.

  5.2.4.1.2 Se após a obtenção dessas informações a organização se considerar apta ao avanço
  com a solicitação de emissão das EA, poderá reunir a documentação e seguir para a Fase 2.

  5.2.4.1.3 Porém, se a organização mantiver sua intenção de avançar, mas não estiver satisfeita
  com as informações disponíveis, poderá entrar em contato com a Anac, apresentando seus questionamentos.
  Esse contato inicial deverá ser realizado por meio da plataforma Fala.BR: https://falabr.cgu.gov.br/,
  que será direcionado ao EsEA, para que as respostas aos questionamentos possam ser fornecidas.

  5.2.4.1.4 Se após esse contato inicial, a organização pretender obter mais informações por
  meio de ROP, o gestor responsável, ou seu representante legal, deverá redigir carta ou ofício
  solicitando a ROP e realizar o peticionamento eletrônico via SEI!, conforme instruções contidas
  no portal eletrônico da Anac: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.

  5.2.4.1.5 O gerente do setor do EsEA designará um coordenador de projeto para conduzir a
  ROP e o processo de emissão das EA da organização requerente e coordená-lo junto à equipe
  técnica.

  5.2.4.1.6 As datas propostas pela organização requerente para a ROP, apresentadas na carta
  de solicitação deverão ser, no mínimo, o equivalente ao período de 10 (dez) dias após a
  data do peticionamento eletrônico. Esse prazo é essencial para que o coordenador de projeto
  e a equipe técnica possam se preparar para a ROP.'
