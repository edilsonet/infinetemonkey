title: Reunião de Orientação Prévia - ROP
text: '5.2.4.2 Reunião de Orientação Prévia - ROP

  5.2.4.2.1 A ROP é opcional, e seu objetivo é prover informações críticas sobre o processo,
  questões práticas, bem como esclarecer quaisquer dúvidas relativas ao PSF. Devem estar presentes
  na ROP o gestor responsável da empresa e demais membros da administração requerida, que
  deverão estar indicados na carta de solicitação da ROP. Preferencialmente, as ROP serão
  realizadas por videoconferência, de forma remota.

  5.2.4.2.2 A organização requerente receberá, durante a ROP, instruções gerais sobre os documentos
  que deverão ser apresentados, sobre a elaboração dos manuais e programas, sobre as inspeções
  e demonstrações e sobre a estrutura que deverá ser apresentada ao longo das 5 fases do processo.

  5.2.4.2.3 A ROP será considerada satisfatória se o coordenador de projeto e a equipe técnica
  estiverem convencidos de que os representantes da organização requerente compreenderam plenamente
  o processo de emissão das EA a ser conduzido pela Anac, bem como suas responsabilidades
  neste processo.

  5.2.4.2.4 Uma ROP bem-sucedida, ensejará em ofício contendo a ata da reunião, sendo o ato
  que encerra a Fase 1 do processo de emissão das EA. A partir deste momento, a organização
  requerente deverá proceder à elaboração do PSF, ou seja, preparação de todos os manuais
  e demais documentos requeridos para a emissão das EA, dentro do prazo estipulado no ofício
  da Anac.

  5.2.4.2.5 Ao longo de todo o processo de emissão das EA, reuniões adicionais poderão ser
  solicitadas pelo EsEA ou pela organização requerente, devendo ser registradas e anexadas
  ao processo.'
