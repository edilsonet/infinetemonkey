text: a) documentos comprobatórios da qualificação requerida para atuar como piloto em comando
  do modelo de aeronave constante da frota da organização requerente que tenha os requisitos
  mais exigentes de licença, habilitação, qualificação, treinamentos, exames e experiência
  recente, conforme a Subparte K do RBAC nº 91 e RBAC nº 61.
