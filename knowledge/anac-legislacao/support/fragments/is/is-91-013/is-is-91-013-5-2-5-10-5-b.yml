title: 5.2.5.10.5(b)
text: 'b) cabe ao profissional determinar, gerir e essencialmente decidir sobre as atividades
  do detentor das EA visando o controle operacional das aeronaves da frota em condições seguras
  de voo. Para alcançar esse objetivo, são algumas atividades típicas do cargo:

  I - gerenciar as atividades da organização visando ao cumprimento do programa de treinamento
  operacional aprovado para o administrador do programa de propriedade compartilhada de aeronaves,
  incluindo os padrões operacionais e demais procedimentos estabelecidos;

  II - garantir o cumprimento dos procedimentos previstos no manual de operações (MO) do detentor
  das EA;

  III - garantir o cumprimento dos requisitos de exames previstos na regulamentação pertinente
  e aplicáveis aos tripulantes do programa;

  IV - assegurar o adequado funcionamento, por meio de um sistema de gestão, de toda a estrutura
  organizacional sob sua responsabilidade, incluindo, quando aplicável, setor de biblioteca,
  acompanhamento de voos, treinamentos, pesquisa/correção de falhas (troubleshooting), escala
  de pilotos, guarda de registros de tripulantes, avaliando a disponibilidade de recurso humano
  capacitado e suficiente para a realização das atividades;

  V - assegurar que todos os funcionários com funções ligadas à operação e planejamento de
  voo estejam devidamente capacitados e qualificados para exercerem tais funções; e

  VI - atuar perante a agência como representante técnico do detentor das EA no tratamento
  das questões afetas às operações, sendo o responsável final pelo acompanhamento das atividades
  de emissão das EA e fiscalização realizadas pela Anac bem como pela apresentação tempestiva
  e implementação efetiva dos planos de ações corretivas elaboradas como resposta às não conformidades
  identificadas pela Anac.'
