title: 5.2.5.10.6(c)
text: 'c) não é permitido o acúmulo do cargo de gerente de segurança operacional com os cargos
  listados no parágrafo 91.1051(b) do RBAC nº 91.

  5.2.5.10.7 Não é permitido que uma pessoa exerça três ou mais cargos de pessoal de administração
  requeridos pelo parágrafo 91.1051(b) do RBAC nº 91 na mesma organização detentora das EA.

  5.2.5.10.8 O pessoal de administração requerido, conforme o parágrafo 91.1051(b) do RBAC
  nº 91, deve ter familiaridade com toda a regulamentação pertinente às operações pretendidas.
  A comprovação dos conhecimentos requeridos para o exercício de cada cargo poderá ocorrer
  por meio da aplicação de testes ou exames, a critério da equipe técnica, durante a Fase
  4 ou conforme a seção 91.1019 do RBAC nº 91.'
