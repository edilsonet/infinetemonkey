text: '5.2.5.10 Cadastro do pessoal de administração requerido

  5.2.5.10.1 A seção 91.1051 do RBAC nº 91 estabelece posições básicas de gestão e qualificações
  mínimas para ocupar tais posições. Os indivíduos designados para os cargos de administração
  requerida devem possuir conhecimento adequado, relevante à posição, sobre a legislação e
  sobre as operações planejadas, as EA e o sistema de documentos de segurança operacional
  da organização requerente.

  5.2.5.10.2 Em anexo ao PSF devem constar as cartas de designação para cada cargo, assinadas
  pelo gestor responsável, os currículos contendo dados pessoais e de contato para as seguintes
  posições:'
