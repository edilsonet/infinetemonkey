text: '5.2.5.3 Caso tenha sido realizada uma ROP, o PSF deverá ser apresentado diretamente
  no processo em curso, ou como peticionamento intercorrente.

  5.2.5.4 O coordenador de projeto verificará se o PSF foi apresentado de forma completa,
  bem como a conformidade dos documentos citados nos itens 5.2.5.8.2 e 5.2.5.8.4 desta IS,
  e se necessário, solicitará parecer sobre a documentação a outros setores da Anac.

  5.2.5.5 Durante esta fase, a equipe técnica conduzirá uma avaliação de elegibilidade do
  processo, com análise preliminar dos documentos apresentados, com o objetivo de verificar
  se todos os manuais, programas e documentos requeridos foram entregues e se estão no formato
  requerido pelos regulamentos aplicáveis vigentes.

  5.2.5.6 Caso sejam constatados erros ou omissões, a análise do processo será interrompida
  até a regularização, podendo o pacote de documentos ser rejeitado e considerado insatisfatório.
  Caso isso aconteça, a organização requerente será informada das não-conformidades e pendências
  verificadas e do prazo para resolução das pendências ou do indeferimento do processo.

  5.2.5.7 Se as informações do PSF forem consideradas satisfatórias, o EsEA notificará por
  meio de ofício a organização requerente sobre a aceitação do pacote e conclusão da Fase
  2.'
