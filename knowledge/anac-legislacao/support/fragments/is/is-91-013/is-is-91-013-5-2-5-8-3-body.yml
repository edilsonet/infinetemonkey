text: '5.2.5.8.3 A ausência de qualquer informação listada acima, de forma satisfatória, com
  exceção do item 5.2.5.8.2(c), poderá ensejar a rejeição da proposta.

  5.2.5.8.4 Com relação ao item 5.2.5.8.2(i), deverá ser apresentada ao menos uma aeronave
  (matrícula) para cada modelo listado no PSF, acompanhando documentos que comprovam as capacidades
  operacionais (laudo de vistoria, LOA, ficha de pesagem, planta baixa, entre outros).'
