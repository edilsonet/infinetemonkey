text: 'l) outros documentos ou manuais, a critério da organização requerente ou solicitados
  pela equipe técnica, ao longo do processo.

  5.2.5.8.6 Caso alguma nova autorização para operações específicas seja solicitada pela organização
  requerente ou caso a Anac considere necessária, o EsEA poderá solicitar a apresentação de
  quaisquer outros manuais, programas e documentos ao longo do processo de emissão das EA.'
