title: Pacote de solicitação formal (PSF)
text: '5.2.5.8 Pacote de solicitação formal (PSF)

  5.2.5.8.1 Para encaminhar o PSF, a organização requerente deverá apresentar uma carta ou
  ofício de solicitação de emissão das EA, contendo informações relevantes para o processo,
  assim como os documentos que serão necessários para análise na Fase 3.'
