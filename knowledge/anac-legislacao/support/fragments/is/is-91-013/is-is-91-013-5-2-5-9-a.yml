cite: 5.2.5.9(a)
title: 5.2.5.9(a)
text: 'a) impactos do custo da proposta: considerando o tempo necessário para a emissão das
  EA, dispor dos recursos, equipamentos e infraestrutura necessária para apresentar satisfatoriamente
  durante o processo e atender aos prazos ou, no caso de EA já emitida, sua alteração. A organização
  deve calcular, por exemplo, os custos de capital necessários e se dispõe desses recursos,
  estando ciente que o montante poderá ficar bloqueado por extensos períodos;'
