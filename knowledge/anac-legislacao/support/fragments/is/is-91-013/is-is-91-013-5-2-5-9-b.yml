text: 'b) impacto sobre o pessoal e pessoal de administração requerido: a organização deve
  analisar se atende aos requisitos de pessoal do RBAC nº 91, ou, no caso de organização já
  detentora de EA e que pretenda realizar alterações nas EA, que está ciente da necessidade
  de alteração, qualificação ou inclusão de pessoal;'
