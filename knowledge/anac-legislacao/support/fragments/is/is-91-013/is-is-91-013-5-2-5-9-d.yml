title: 5.2.5.9(d)
text: 'd) impacto na tripulação: deve realizar e dispor de cálculos sobre a quantidade de
  tripulantes para se adequar à operação pretendida, bem como a qualificação dos tripulantes
  para a operação. Deve abranger a necessidade de treinamento, inclusive com a formação de
  instrutores ou examinadores, a necessidade e disponibilidade de terceirização de treinamento,
  a disponibilidade de vagas em centro de treinamento ou congênere escolhidos para o treinamento;'
