title: 5.2.5.9(f)
text: 'f) impacto nos serviços de manutenção: deve elaborar um estudo de impacto nos serviços
  de manutenção, contratados, apropriados para a operação pretendida.

  5.2.5.9.2 Ao iniciar o processo de emissão das EA a organização deverá, a partir da Fase
  2, estar constituída como pessoa jurídica, e o contrato de administração do programa deverá
  estar instruído. É possível que a organização ainda não possua as aeronaves e os tripulantes,
  porém estes deverão estar aptos para a demonstração de cumprimento de requisitos durante
  a Fase 4. Isto inclui, para a aeronave, estar aeronavegável e com a organização como seu
  operador registrado no RAB.

  5.2.5.9.3 Durante a Fase 3 a organização requerente deverá submeter os tripulantes e colaboradores
  aos treinamentos em conformidade com seu PTO, após a aprovação.

  5.2.5.9.4 Os documentos apresentados no PSF, ou durante o processo de emissão das EA, devem
  prover evidência objetiva de que a organização requerente tem condições de conduzir com
  segurança as operações propostas, em instalações adequadas e com serviços operacionais de
  apoio apropriadamente contratados, levando-se em conta o nível de complexidade dessas operações.

  5.2.5.9.5 Alguns exemplos de equipamentos, instalações e serviços cuja disponibilidade,
  própria ou por contratação terceirizada, deve ser demonstrada por documentos, ou durante
  a Fase 4, são os seguintes:'
