text: 'k) áreas e edificações necessárias às operações.

  5.2.5.9.6 Os documentos descritos no item 5.2.5.9.5 desta IS, podem não estar ainda disponíveis
  no início da Fase 2 do processo de emissão das EA, porém deverão ser apresentados, obrigatoriamente,
  até o início da Fase 4, quando a infraestrutura necessária para o funcionamento da rotina
  operacional deverá estar disponível para demonstração.'
