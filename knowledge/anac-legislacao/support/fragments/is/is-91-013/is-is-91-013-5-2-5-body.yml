text: '5.2.5 Fase 2 - Solicitação formal

  5.2.5.1 De acordo com o parágrafo 91.1014(a) do RBAC nº 91, uma solicitação formal para
  obtenção das EA segundo a Subparte K do RBAC nº 91, deve ser submetida à Anac na forma e
  com o conteúdo por ela estabelecidos, conforme esta IS, e deverá ser realizada por meio
  de um PSF. A apresentação do PSF é o ato que inicia na prática a Fase 2 do processo de emissão
  das EA.

  5.2.5.2 O PSF, composto pela carta ou ofício de solicitação de emissão das EA para administração
  do programa de propriedade compartilhada de aeronaves e emissão de uma EA, e seus anexos,
  listados no item 5.2.5.8.5 desta IS, deverão ser protocolados na Anac de forma completa,
  por meio de peticionamento eletrônico via SEI!, conforme instruções contidas no portal eletrônico
  da Anac: https://www.gov.br/anac/pt-br/sistemas/protocolo-eletronico-sei.'
