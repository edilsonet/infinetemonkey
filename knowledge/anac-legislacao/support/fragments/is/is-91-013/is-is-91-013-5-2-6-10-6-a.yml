title: 5.2.6.10.6(a)
text: 'a) manual de operações (MO), que pode ser apresentado em um ou mais volumes, contento
  os assuntos listados na seção 91.1025 do RBAC nº 91, incluindo manual de peso e balanceamento,
  e o manual de comissários de voo (MCV), se aplicável;

  Nota: manuais como o manual de peso e balanceamento, e manual de comissários de voo (MCV),
  quando aplicável, são considerados volumes complementares ao MO.'
