title: 5.2.6.10.6(e)
text: 'e) lista de equipamentos mínimos (MEL), para cada modelo de aeronave que será empregada
  na operação.

  Nota: somente é obrigatória caso o operador tenha intenção de operar com equipamentos inoperantes,
  conforme seção 91.1115 do RBAC nº 91.

  5.2.6.10.7 Cada documento que faz parte do sistema deve ser enviado por meio de uma carta
  ou ofício de encaminhamento, que deve conter a nomenclatura ou descrição do material e a
  numeração da revisão encaminhada.

  5.2.6.10.8 A tabela abaixo reúne os manuais e programas do sistema de manuais, indicando
  para cada um deles a sua aplicabilidade e se é requerida aceitação ou aprovação.


  Tabela 2 - manuais que compõem o psf.

  Sigla

  Nomenclatura'
