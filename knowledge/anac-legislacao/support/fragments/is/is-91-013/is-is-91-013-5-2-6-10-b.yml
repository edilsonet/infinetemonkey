text: 'b) manuais devem conter informações sobre as políticas gerais da organização requerente,
  além dos deveres e responsabilidades de seu pessoal, política de controle operacional e
  procedimentos específicos, visando responder as seguintes perguntas: Quem? O quê? Como?
  Quando? Onde? Por quê?;'
