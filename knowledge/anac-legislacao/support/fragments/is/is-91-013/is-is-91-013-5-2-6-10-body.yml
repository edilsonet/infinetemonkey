text: '5.2.6.10 Sistema de documentos de segurança operacional

  5.2.6.10.1 O sistema de documentos de segurança operacional, ou sistema de manuais, contém
  informações sobre as políticas gerais da organização requerente, deveres e responsabilidades
  dos tripulantes e do pessoal de solo, descrição dos treinamentos, sistemas das aeronaves,
  política de controle operacional e procedimentos específicos de operações e manutenção.

  5.2.6.10.2 O RBAC nº 91 requer que o sistema de documentos de segurança operacional inclua
  as instruções e as informações necessárias para permitir o desempenho de operações seguras
  de voo e de solo. A descrição do conteúdo do sistema de documentos de segurança operacional
  pode ser encontrada no RBAC nº 91, seções 91.1023, 91.1025, entre outras, assim como nas
  instruções suplementares que tratam especificamente de autorizações para operações específicas.

  5.2.6.10.3 A organização requerente deverá estabelecer o sistema de documentos de segurança
  operacional conforme as características da operação pretendida, de forma a atender a legislação
  em vigor, em consonância com as políticas da organização requerente. O conteúdo dos documentos,
  manuais, programas, etc., independentemente de terem sido aprovados ou aceitos pela Anac,
  são de inteira responsabilidade do administrador do programa.

  5.2.6.10.4 O sistema de documentos de segurança operacional deverá estar desenvolvido para
  entrega como parte do PSF. Sobre a lista de cotistas, deverá ser demonstrado, no sistema
  de documentos de segurança operacional, que a organização requerente ou o detentor das EA
  possui processo de gerenciamento da lista de cotistas, documentado e efetivo, que garanta
  o atendimento dos requisitos segundo o parágrafo 91.1015(b) do RBAC nº 91.

  5.2.6.10.5 Visando a aprovação ou aceitação dos manuais de forma mais célere, e a fim de
  evitar gastos desnecessários e longos períodos de análise processual, a Anac recomenda que
  a organização requerente produza seus manuais e programas com atenção ao seguinte:'
