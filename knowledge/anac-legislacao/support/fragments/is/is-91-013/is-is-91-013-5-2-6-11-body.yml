cite: 5.2.6.11
title: Declaração de conformidade inicial
text: '5.2.6.11 Declaração de conformidade inicial

  5.2.6.11.1 A organização requerente deverá encaminhar como parte do PSF uma declaração de
  conformidade inicial referenciando todas as seções e parágrafos do RBAC nº 91, conforme
  requerido pela seção 91.1026 do RBAC nº 91. Essa declaração deverá ser uma listagem completa
  de todas as seções e parágrafos do RBAC, aplicáveis à operação pretendida pela organização
  requerente, com o correspondente método de conformidade a ser adotado por ela ou uma indicação
  de que o requisito não lhe seja aplicável.

  5.2.6.11.2 Deve conter uma declaração de ciência e cumprimento da seção 91.1047 do RBAC
  nº 91, com relação ao programa de educação para a prevenção do risco associado ao uso indevido
  de substâncias psicoativas.

  5.2.6.11.3 As subpartes pertinentes e cada seção e parágrafo deverão ser identificados e
  acompanhados de uma breve descrição do método de conformidade ou, preferencialmente, por
  referência específica a um manual, programa ou algum outro documento que contenha a descrição
  do procedimento proposto para atender ao requisito.

  5.2.6.11.4 Se o método de cumprimento específico ainda não tiver sido desenvolvido pela
  organização requerente no momento de apresentação do PSF, a declaração de conformidade deve
  indicar a data de quando a organização encaminhará sua atualização com o método proposto.
  A declaração de conformidade deve ser assinada pelo gestor responsável, gerente de segurança
  operacional ou pelos diretores ou gerentes de operações de manutenção da organização requerente.

  5.2.6.11.5 A declaração de conformidade deve ser apresentada como documento único, contendo
  número e controle de revisões, e o modelo utilizado poderá ser de livre escolha do requerente.'
