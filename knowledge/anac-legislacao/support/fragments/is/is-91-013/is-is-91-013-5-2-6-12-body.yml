title: Representação da estrutura organizacional da organização requerente
text: '5.2.6.12 Representação da estrutura organizacional da organização requerente

  5.2.6.12.1 A organização requerente deverá apresentar um organograma completo que represente
  a sua estrutura organizacional, e contenha as atribuições e responsabilidades de seus integrantes,
  como parte do manual de operações (MO).'
