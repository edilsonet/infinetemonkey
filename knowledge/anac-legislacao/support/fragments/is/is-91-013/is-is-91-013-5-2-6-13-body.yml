title: Solicitações de isenção de cumprimento de regra ou procedimento alternativo
text: '5.2.6.13 Solicitações de isenção de cumprimento de regra ou procedimento alternativo

  5.2.6.13.1 Caso a organização requerente pretenda solicitar alguma isenção de cumprimento
  de requisito de regulamento, deve fazê-lo de acordo com o previsto no RBAC nº 11.

  5.2.6.13.2 Caso a organização requerente pretenda solicitar procedimento alternativo de
  cumprimento de procedimentos contidos nesta IS, ou outra Instrução Suplementar, deverá apresentar
  solicitação formal, por meio de carta ou ofício, contendo justificativa robusta da proposta
  para deliberação da SPO ou de gerência por ela delegada.'
