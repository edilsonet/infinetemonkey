title: As listas de matrículas e capacidades operacionais devem possuir um controle formal
  de revisões, de publicação e de distribuição.
text: '5.2.6.7 As listas de matrículas e capacidades operacionais devem possuir um controle
  formal de revisões, de publicação e de distribuição.

  5.2.6.8 Caso um detentor das EA não apresente a listagem solicitada pela Anac e/ou falhe
  em demonstrar que o seu processo de gerenciamento da frota está documentado e efetivo estará
  sujeito às sanções administrativas previstas nas Resoluções nº 761 e 762, ambas de 18 de
  dezembro de 2024, incluindo o disposto nas seções 5.5, 5.6 e 5.7 desta IS.

  5.2.6.9 Caso o detentor das EA deixe de possuir direitos de uso e operação sobre pelo menos
  uma aeronave de um determinado modelo e/ou com determinada autorização operacional, por
  mais de 30 (trinta) dias, deverá solicitar à Anac a revisão de suas EA para retirada do
  modelo de aeronave das suas EA, ou para atualização das autorizações operacionais afetadas.'
