  5.2.6.6 Essa listagem deverá ser apresentada como parte do PSF e mantida nas bases (principais
  e secundárias) administrativas, operacionais e de manutenção, conforme aplicável, e disponibilizadas
  à Anac sempre que solicitadas ao detentor das EA.'
