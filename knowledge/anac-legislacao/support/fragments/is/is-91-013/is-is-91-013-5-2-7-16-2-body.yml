title: Os treinamentos que envolvam atividade de voo real em aeronave não podem ser conduzidos
  sob essa autorização;
text: '5.2.7.16.2 Os treinamentos que envolvam atividade de voo real em aeronave não podem
  ser conduzidos sob essa autorização;

  5.2.7.16.3 O treinamento deve ser ministrado com base na última versão do programa de treinamento
  submetida à avaliação da Anac. Caso seja realizado acompanhamento do treinamento por servidor
  designado da Anac, o papel deste servidor será, primariamente, verificar a adequação do
  treinamento realizado ao que está no programa submetido, ou seja, o acompanhamento não substituiria
  a necessidade de se completar a análise documental (fase 3); e

  5.2.7.16.4 Caso, durante a conclusão do processo de aprovação inicial, a Anac requeira alterações
  no programa submetido que afetem os treinamentos já realizados, tais treinamentos deverão
  ser realizados novamente na medida necessária para atender às novas alterações, conforme
  determinado pela Anac. Observa-se que um treinamento ministrado incorretamente pode resultar
  em um prejuízo ao aprendizado do aluno em razão de absorção e consolidação de informações
  incorretas, de forma que, para reparar tal situação, pode ser necessário até mesmo a realização
  de treinamentos adicionais mais exigentes do que os que seriam devidos a um aluno que ainda
  não recebeu qualquer treinamento.

  5.2.7.17 Destaca-se que esta é uma opção ao operador, como alternativa ao processo usual
  (que requer a obtenção da aprovação inicial para início da condução dos treinamentos). Caso
  o operador solicite e obtenha tal autorização, assume o risco e deve arcar com as consequências
  caso o treinamento venha a ser considerado inadequado posteriormente.'
