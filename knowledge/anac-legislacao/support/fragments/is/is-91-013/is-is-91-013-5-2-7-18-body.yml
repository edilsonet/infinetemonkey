text: '5.2.7.18 Encerramento da Fase 3

  5.2.7.18.1 Após a aceitação ou aprovação de todos os documentos que compõem o PSF, o EsEA
  informará o encerramento da Fase 3 do processo de emissão das EA à organização requerente
  por meio de ofício.'
