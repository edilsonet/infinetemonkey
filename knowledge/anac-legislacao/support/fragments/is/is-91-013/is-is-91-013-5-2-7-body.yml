title: Fase 3 - Avaliação de documentos
text: '5.2.7 Fase 3 - Avaliação de documentos

  5.2.7.1 Depois da aceitação do PSF, os servidores designados para compor a equipe técnica
  darão início a uma análise detalhada de todos os manuais, programas e documentos exigidos
  pela Anac e que foram apresentados pela organização requerente das EA no PSF.

  5.2.7.2 A organização requerente será devidamente notificada, por meio de ofício, caso um
  manual, programa ou documento seja considerado incompleto ou deficiente ou, ainda, se for
  detectada alguma não-conformidade com relação à legislação aplicável, como regulamentos
  e instruções suplementares, e aos demais documentos de referência, como avaliações operacionais
  e manuais de operação de aeronaves. As devidas correções deverão ser enviadas pela organização
  requerente ao setor da Anac emissor do documento com as deficiências ou não-conformidades
  por meio de carta ou ofício, por peticionamento intercorrente, com referência, ou diretamente
  no processo que motivou a ação.

  5.2.7.3 O prazo de resposta ao ofício enviado pela Anac deverá obedecer ao definido no documento,
  normalmente de 30 dias corridos, a contar do recebimento do documento pela organização requerente,
  ou outro eventualmente definido, não superior ao prazo máximo estabelecido no item 5.2.11.6
  desta IS.

  5.2.7.4 Após a apresentação dos manuais no pacote de solicitação formal, quaisquer modificações
  ou substituições nos manuais e/ou documentos terão impacto direto no andamento do processo
  de emissão das EA. Assim, para que os prazos de referência não sejam prejudicados, deve-se
  evitar modificar ou substituir documentos após a apresentação para análise. Atualizações
  e revisões nos manuais poderão ser feitas após a aceitação ou aprovação dos mesmos, e após
  a conclusão do processo de emissão das EA.

  5.2.7.5 Se os manuais, programas e documentos que compõem o PSF forem considerados satisfatórios,
  eles serão aceitos ou aprovados, à medida que os servidores da equipe técnica encarregados
  da análise do material forem encerrando seus trabalhos de avaliação. No caso do PTO, a aprovação
  será considerada inicial até que seja concluída a demonstração da eficácia de todos os treinamentos,
  quando será emitido o ofício de aprovação final, o que poderá ocorrer mesmo após o término
  do processo de emissão das EA.

  5.2.7.6 Após a aprovação inicial do PTO, seu cumprimento é obrigatório e a organização requerente
  deverá seguir os procedimentos da IS n° 61-007 para solicitar o cadastro no SISHAB, para
  que o PTO aprovado seja cadastrado no sistema. A organização poderá então, notificar e conduzir
  os treinamentos, conforme os módulos e currículos, para que seja garantida a qualificação
  requerida pela seção 91.1097 do RBAC nº 91.

  5.2.7.7 Eventualmente, os treinamentos poderão ser acompanhados como parte das inspeções
  e demonstrações previstas para a Fase 4 do processo de emissão das EA, conforme item 5.2.8.7
  desta IS.

  5.2.7.8 O prazo para análise e eventual aceitação ou aprovação de determinado manual, programa
  ou documento dependerá do atendimento satisfatório, em termos de conteúdo e tempo, pela
  organização requerente, das deficiências e não-conformidades apontadas pela Anac. Respostas
  insatisfatórias às deficiências e não-conformidades apontadas pela equipe técnica poderão
  gerar atrasos no processo.

  5.2.7.9 Os manuais e/ou programas que requerem aceitação receberão um ofício de aceitação,
  emitido separadamente para cada manual, programa ou documento avaliado, que deverá ser anexado
  a cada manual e/ou programa correspondente, de modo a comprovar a aceitação do material
  pela Anac em eventuais fiscalizações.

  5.2.7.10 Uma vez que o administrador do programa esteja com suas EA emitidas, os manuais
  ou partes dos manuais sujeitas à aceitação poderão ser revisados pelo administrador, sem
  necessidade de análise de conteúdo por parte da Anac, bastando que o administrador protocole
  a revisão do manual.

  5.2.7.11 Já os manuais e/ou programas que requerem aprovação receberão um ofício de aprovação,
  emitido separadamente para cada manual, programa ou documento avaliado, que deverá ser anexado
  a cada manual e/ou programa correspondente, de modo a comprovar a aprovação do material
  pela Anac em eventuais fiscalizações.

  5.2.7.12 Uma vez que o administrador do programa esteja com suas EA emitidas, os manuais
  e/ou programas ou partes desses, sujeitas à aprovação, poderão ser revisados pelo administrador,
  mas as modificações realizadas somente poderão ser implementadas após a análise de conteúdo
  por parte da Anac, seguida com a emissão do ofício de aprovação para a revisão em questão.

  5.2.7.13 A qualquer momento, se a Anac identificar que partes do manual e/ou programa, sejam
  eles aceitos ou aprovados, não são satisfatórias, o administrador deverá revisar tais partes
  no prazo determinado pela Agência.

  5.2.7.14 A aceitação ou aprovação concedida individualmente ao manual, programa ou documento
  analisado não implica em aceitação ou aprovação final de todo, ou de parte, do PSF, tampouco
  é garantia de que a organização requerente receberá suas EA.

  5.2.7.15 Após as avaliações realizadas nesta fase, a declaração de conformidade inicial
  evolui para a declaração de conformidade final. Esta última deve estar aceita ao final da
  Fase 3, pois seu objetivo é o de garantir que cada requisito regulamentar aplicável à operação
  pretendida foi adequadamente tratado pelos manuais, programas e documentos apresentados
  pela organização requerente.

  5.2.7.16 Conforme previsto no parágrafo 91.1077(b) do RBAC nº 91, a Anac pode autorizar
  que o operador inicie a condução do treinamento antes da obtenção da aprovação inicial,
  mediante solicitação do operador. Após análise da solicitação, se considerada satisfatória,
  autorização será concedida por ofício. Para tanto, as seguintes condições devem ser atendidas:

  5.2.7.16.1 A solicitação deve ser enviada à Anac antes da notificação do treinamento (que,
  por sua vez, deve atender aos prazos previstos na IS nº 61-007). Dessa forma, não é permitido,
  sob essa autorização, o aproveitamento de treinamentos realizados previamente;'
