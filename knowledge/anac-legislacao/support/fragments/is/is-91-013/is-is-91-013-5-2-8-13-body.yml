title: Encerramento da Fase 4
text: '5.2.8.13 Encerramento da Fase 4

  5.2.8.13.1 Somente depois de ter sido aprovada em todas as demonstrações e inspeções a que
  foi submetida, uma organização requerente terá demonstrado satisfatoriamente ao EsEA sua
  capacidade de administrar o programa de propriedade compartilhada e operar suas aeronaves
  conforme requerido.

  5.2.8.13.2 O EsEA informará essa condição à organização requerente por meio de ofício, comunicando
  formalmente o encerramento da Fase 4 do processo de emissão das EA.'
