title: Fase 4 - Demonstrações e inspeções
text: '5.2.8 Fase 4 - Demonstrações e inspeções

  5.2.8.1 O parágrafo 91.1014(b)(2) do RBAC nº 91 estabelece que a Anac deve constatar que
  uma organização requerente das EA está própria e adequadamente equipada conforme os requisitos
  dos RBAC aplicáveis e é capaz de conduzir operações seguras segundo as apropriadas provisões
  do RBAC nº 91 para a emissão das especificações administrativas segundo a Subparte K. A
  seção 91.1019 do RBAC nº 91 estabelece as condições para verificar a conformidade de um
  administrador de programa segundo a Subparte K, às leis e regulamentos aplicáveis e às suas
  especificações administrativas, a serem observadas nas demonstrações e inspeções.

  5.2.8.2 A Fase 4 se inicia com o encerramento formal da Fase 3. Nela a organização deverá
  providenciar o envio das informações e demonstrações, a partir da solicitação da equipe
  técnica. Conforme solicitação, poderá apresentar carta ou ofício confirmando a disponibilidade
  para demonstrações e inspeções que serão realizadas “in loco” pela equipe técnica.

  5.2.8.3 As demonstrações devem representar, no cenário mais próximo possível da realidade,
  as atividades que o administrador enquanto operador poderá realizar após a emissão das EA.
  Estas demonstrações serão avaliadas remotamente ou preferencialmente “in loco” pelos servidores
  da equipe técnica designados para observá-las, tanto nas áreas de operações, quanto nas
  áreas de aeronavegabilidade da organização requerente.

  5.2.8.4 Durante essas demonstrações e inspeções, a equipe técnica avaliará a efetividade
  das políticas, métodos, procedimentos e instruções aplicáveis conforme descrito nos manuais,
  programas e documentos apresentados para a emissão das EA.

  5.2.8.5 Nesta fase, os servidores da Anac darão ênfase à avaliação da efetividade do sistema
  de gerenciamento adotado. As deficiências encontradas serão levadas ao conhecimento da organização
  requerente e ações corretivas devem ser tomadas antes das EA serem emitidas.

  5.2.8.6 A critério do EsEA, atividades de demonstrações e inspeções podem ser antecipadas
  antes do encerramento da Fase 3, desde que os pré-requisitos técnicos correspondentes a
  essas atividades tenham sido completamente atendidos na respectiva Fase 3.

  5.2.8.7 Abaixo estão listadas, não exaustivamente, as demonstrações e inspeções requeridas
  para o cumprimento da Fase 4 do processo de emissão das EA e que deverão estar disponíveis
  se solicitadas pela equipe técnica:'
