section_title: Fase 4 - Demonstrações e inspeções
subsection_id: i
cite: 5.2.8(i)
title: 5.2.8(i)
text: 'i) voo de avaliação operacional e testes de validação, conforme requerido pela seção
  91.1041 do RBAC nº 91. Essa atividade deve ser realizada, a critério do EsEA, após a finalização
  das demais demonstrações e inspeções do escopo da Fase 4, conforme aplicável.

  5.2.8.8 Como resultado das inspeções realizadas, na eventualidade de deficiências e não-conformidades
  serem verificadas, elas serão comunicadas à organização requerente por meio de ofício à
  organização requerente. As correções deverão ser apresentadas por meio de carta ou ofício
  de resposta dentro do prazo estabelecido.

  Nota: eventualmente, nova demonstração para comprovação da efetividade das correções poderá
  ser requerida.

  5.2.8.9 Durante a Fase 4, as inspeções nas áreas de operações e de aeronavegabilidade somente
  ocorrerão de forma síncrona se houver disponibilidade da Anac, uma vez que servidores de
  diferentes setores comporão as equipes técnicas.

  5.2.8.10 Caso ocorra o acompanhamento de currículos de treinamento durante a Fase 4 do processo
  de emissão das EA, e se forem considerados satisfatórios pela Anac, esses receberão a sua
  aprovação final, com a emissão de um novo ofício de aprovação para o PTO já inicialmente
  aprovado para a organização requerente.

  5.2.8.11 Uma organização requerente de uma EA para administrar um programa de propriedade
  compartilhada de aeronaves, segundo a Subparte K do RBAC nº 91, que também pretenda se certificar
  conforme o RBAC nº 119, RBAC nº 145 ou outro regulamento, concomitantemente com a obtenção
  de suas EA, deverá atender ao rito de cada um dos processos de emissão das EA ou certificação
  em separado.

  5.2.8.12 Caso isso ocorra, e ambos os processos estejam na fase de demonstrações e inspeções
  ao mesmo tempo, a sincronia das inspeções e demonstrações dependerá da disponibilidade da
  Anac, uma vez que serão conduzidas por equipes distintas de servidores.'
