title: Fase 5 - Emissão das EA
text: '5.2.9 Fase 5 - Emissão das EA

  5.2.9.1 Após as quatro fases anteriores terem sido concluídas, o EsEA aprovará e emitirá
  as EA do novo administrador de programa de propriedade compartilhada de aeronaves com todas
  as autorizações, aprovações, limitações e isenções concedidas, conforme aplicável.

  5.2.9.2 Caso a organização requerente tenha optado por obter as EA cumprindo requisitos
  inicialmente não aplicáveis à sua espécie de operação ou tipo de operação, uma observação
  deverá ser inclusa nas EA listando esses requisitos e determinando a obrigatoriedade de
  seu cumprimento.

  5.2.9.3 Com a publicação de portaria no Diário Oficial da União referente à aprovação e
  emissão das EA, o processo de emissão das EA estará formalmente encerrado.'
