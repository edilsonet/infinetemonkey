title: Disposições Gerais
text: '5.3.1 Disposições Gerais

  5.3.1.1 O processo de alteração das EA é similar ao processo de emissão das EA de administrador
  de programa de propriedade compartilhada de aeronaves, guardadas as proporções, podendo
  ser menos complexo e demorado dependendo do tipo de alteração pretendida. Esta seção apresenta
  os meios de cumprimento aceitáveis para os parágrafos 91.1017(a)(2) e (b) do RBAC nº 91,
  no que se refere à solicitação de alteração das EA.

  5.3.1.2 O administrador deverá submeter documentos e processos com solicitações separadas
  e independentes para cada tipo de alteração das EA. No caso de haver múltiplas alterações
  o administrador deverá encaminhar processos separados e relacionar cada um deles ao ofício
  de solicitação do processo principal, conforme disposto no parágrafo 5.2.5.9.1 desta IS.

  5.3.1.3 Uma alteração das EA, com previsão nesta Instrução Suplementar, somente entrará
  em vigor após a emissão da revisão das EA, contendo a referida alteração.

  5.3.1.4 Para cada uma das alterações propostas nesta IS, é necessário que o administrador
  de programa solicitante realize um estudo abrangente acerca do planejamento e impacto da
  proposta, levando em consideração o atendimento dos requisitos regulamentares necessários.

  5.3.1.5 Toda solicitação de alteração das EA deve ser encaminhada ao EsEA, por meio de carta
  ou ofício, com a descrição da alteração proposta, com a documentação necessária em anexo,
  pelo menos 45 (quarenta e cinco) dias antes da data pretendida da entrada em vigor da alteração.

  5.3.1.6 Recomenda-se que, dependendo da extensão e da complexidade das alterações propostas,
  o ofício de solicitação seja apresentado com uma maior antecedência, a critério do administrador,
  de forma a aumentar a probabilidade de conclusão no prazo solicitado.

  5.3.1.7 Os prazos de 5 (cinco) dias para notificação após a vacância de qualquer das posições
  de administração requeridas e de 60 (sessenta) dias para a substituição, estabelecidos no
  parágrafo 91.1051(k) do RBAC nº 91, se aplicam somente no caso de alterações não programadas.
  Nas demais situações, o administrador deve enviar a solicitação de alteração de pessoal
  de administração com a antecedência requerida para alteração das EA.

  5.3.1.8 As revisões e elaborações de manuais e programas ou qualquer documentação requerida,
  como também os procedimentos operacionais, devem seguir as orientações do parágrafo 5.2.6.10
  desta IS, salvo se de outra forma especificado nesta seção.

  5.3.1.9 A critério do EsEA ou por solicitação do administrador do programa, pode ser solicitada
  a realização de uma ROP para esclarecimentos e ajustes do processo de alteração das EA e
  para avaliação e validação dos procedimentos e conhecimentos e envolvimento do pessoal de
  administração requerido.'
