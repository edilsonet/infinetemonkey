subsection_id: a
cite: 5.3.6.1(a)
title: 5.3.6.1(a)
text: a) carta ou ofício de solicitação, indicando as marcas de nacionalidade e matrícula
  de pelo menos uma aeronave sobre a qual o administrador possuir (ou irá possuir até o final
  do processo de alteração de EA) direitos de uso e operação, que tenha capacidades operacionais
  condizentes com a alteração de EA solicitada;
