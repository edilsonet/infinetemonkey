title: 5.3.6.1(b)
text: b) proposta de revisão de documentos que compõem o sistema de documentos de segurança
  operacional, conforme necessário. Cada documento alterado deve ser apresentado por carta
  ou ofício de encaminhamento de revisão individuais. Por se tratar de um novo modelo, poderá
  ser necessário que o detentor das EA revise todos os manuais e programas que compõe o sistema
  de documentos de segurança operacional, requerido pela Subparte K do RBAC nº 91, e listado
  no item 5.2.6.10 desta IS; e
