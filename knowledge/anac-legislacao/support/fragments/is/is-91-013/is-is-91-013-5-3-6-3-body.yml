text: '5.3.6.3 O processo inclusão de novo modelo de aeronave deverá ser conduzido em conformidade
  com o estabelecido na seção 5.2 desta IS.

  5.3.6.4 A solicitação de inclusão de novo modelo de aeronave será realizada considerando
  as autorizações operacionais básicas. Se o detentor das EA desejar solicitar a inclusão
  de autorizações para operações específicas, conforme o item 1.3.7 desta IS, deverá realizar
  a solicitação em processo único para essa finalidade.'
