title: 5.3.7(b)
text: b) proposta de revisão do sistema de documentos de segurança operacional, conforme necessário.
  Cada documento alterado deve ser apresentado por carta ou ofício de encaminhamento de revisão
  individuais e com os respectivos dados de pagamento ou comprovante de pagamento da TFAC,
  caso da MEL. Podem ser requeridas as revisões do MO, SOP, MGSO/PRE, PTO e MEL;
