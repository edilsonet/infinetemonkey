text: '5.3.7 Alteração de autorizações operacionais específicas

  5.3.7.1 Para a alteração de autorizações operacionais para operação RVSM, aproximação por
  instrumentos (CAT II / III), NAT HLA, PBN, operação IFR Single Pilot, ampliação do limite
  de fatoração de pista, operação sobre a água, EFB, uso expandido de PED, utilização de HGS,
  comunicação via data link (CPDLC/PBCS), e EFVS, segundo a Subparte N do RBAC nº 91 ou outra
  norma da Anac, a seguinte documentação é necessária:'
