text: 'g) declaração de conformidade atualizada.

  5.3.8.2 Para autorização de operação internacional, o detentor das EA deverá avaliar se
  são necessárias autorizações adicionais, como RVSM, PBN, grandes extensões de água, etc.
  As autorizações adicionais devem ser solicitadas em processos específicos, conforme orientações
  do item 5.3.7 desta IS.

  5.4 Revisão de manuais'
