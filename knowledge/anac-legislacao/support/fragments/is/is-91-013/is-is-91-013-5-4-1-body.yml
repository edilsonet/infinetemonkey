title: Revisão de manuais sem alteração das EA
text: '5.4.1 Revisão de manuais sem alteração das EA

  5.4.1.1 Os manuais e programas que forem revisados, cuja revisão não implique alteração
  das EA, devem ser encaminhados diretamente aos setores responsáveis, juntamente com os dados
  de pagamento das TFAC (se aplicáveis), os quais interagirão diretamente com o administrador,
  não sendo necessária a remessa de qualquer documentação ao EsEA.'
