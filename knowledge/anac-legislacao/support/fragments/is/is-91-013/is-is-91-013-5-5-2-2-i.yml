title: 5.5.2.2(i)
text: 'i) imposição de dificuldade ou impedimento (intencional ou por não cumprimento de norma)
  às atividades de fiscalização da Anac.

  5.5.2.3 A Anac poderá suspender as EA do administrador em decorrência de processo sancionatório
  instaurado nos termos das Resoluções nº 761/2024 e 762/2024, ou norma que vier a substituí-las.'
