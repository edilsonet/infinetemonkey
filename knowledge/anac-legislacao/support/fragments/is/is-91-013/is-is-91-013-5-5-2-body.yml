title: Suspensão das EA pela Anac
text: '5.5.2 Suspensão das EA pela Anac

  5.5.2.1 A Anac poderá suspender cautelarmente as EA de um administrador de programa de propriedade
  compartilhada de aeronaves, sem a prévia manifestação do interessado, de acordo com o parágrafo
  91.1015(c)(2) do RBAC nº 91 e o art. 45 da Lei nº 9.784/1999 caso constate o não cumprimento
  de requisitos técnico-operacionais que configurem risco iminente à segurança operacional.'
