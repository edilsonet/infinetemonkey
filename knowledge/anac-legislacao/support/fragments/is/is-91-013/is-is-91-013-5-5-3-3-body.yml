text: '5.5.3.3 A critério do EsEA, ouvidos os setores envolvidos, pode ser solicitada a realização
  de uma reunião para esclarecimento e ajustes do processo.

  5.5.3.4 O processo de revogação da suspensão das EA será conduzido pelo EsEA de acordo com
  o processo de 5 fases apresentado nesta IS, dependendo da complexidade do processo de revogação
  da suspensão.

  Nota: o processo de revogação da suspensão das EA pode ser tanto a comprovação da solução
  da não-conformidade como uma revisão completa do processo de emissão das EA.

  5.5.3.5 A revogação da suspensão das EA, caso aceita pelo EsEA, será informada ao administrador
  do programa por meio do ofício, complementado pelas respectivas EA, quando aplicável.'
