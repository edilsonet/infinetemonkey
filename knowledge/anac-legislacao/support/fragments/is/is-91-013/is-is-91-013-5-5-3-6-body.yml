title: A Anac dará publicidade da decisão no Diário Oficial da União.
text: '5.5.3.6 A Anac dará publicidade da decisão no Diário Oficial da União.

  5.5.3.7 No caso de suspensão das EA em decorrência de processo sancionatório, conforme o
  item 5.5.2.3 desta IS, a suspensão de dará por período definido, não sendo necessária a
  solicitação de revogação da suspensão. Ao final do período informado de vigência da suspensão
  o operador poderá retomar as suas atividades de administração do programa segundo a Subparte
  K do RBAC nº 91.

  5.6 Revogação das EA'
