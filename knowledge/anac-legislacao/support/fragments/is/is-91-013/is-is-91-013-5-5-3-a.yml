  5.5.3.2 Caso seja requerido pela Anac, ou o administrador pretenda, alterar as EA e/ou seus
  manuais, simultaneamente ao processo de revogação de suspensão das EA, deve seguir as instruções
  das seções 5.3 ou 5.4 desta IS, conforme aplicável.'
