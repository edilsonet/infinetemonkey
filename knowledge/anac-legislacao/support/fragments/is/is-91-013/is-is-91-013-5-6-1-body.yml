title: Revogação das EA por solicitação do administrador
text: '5.6.1 Revogação das EA por solicitação do administrador

  5.6.1.1 O administrador do programa pode solicitar a revogação de suas EA por meio carta
  ou ofício, que deve ser encaminhado ao EsEA, referenciando a revisão mais recente das EA.'
