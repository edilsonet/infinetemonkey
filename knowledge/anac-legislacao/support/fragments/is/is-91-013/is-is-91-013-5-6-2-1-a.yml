text: a) o administrador do programa se mantiver com as EA suspensa cautelarmente por período
  superior a 360 (trezentos e sessenta) dias. Se ao término desse período houver um processo
  de revogação da suspensão em curso, deverá ser aguardada a decisão final; ou
