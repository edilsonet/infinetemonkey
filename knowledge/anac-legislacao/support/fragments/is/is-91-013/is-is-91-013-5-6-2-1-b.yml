section_id: 5.6.2.1
section_title: 'A Anac poderá revogar as EA de um administrador de programa por uma das seguintes
  razões:'
subsection_id: b
cite: 5.6.2.1(b)
title: 5.6.2.1(b)
text: b) o administrador do programa se mantiver com as EA suspensa por solicitação própria
  por período superior a 180 (cento e oitenta) dias sem que haja uma solicitação de revogação
  da suspensão ou um processo de revogação da suspensão em curso.
