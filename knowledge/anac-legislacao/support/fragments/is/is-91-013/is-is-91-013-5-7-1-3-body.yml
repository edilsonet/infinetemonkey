text: '5.7.1.3 A Anac dará publicidade da decisão no Diário Oficial da União.

  Nota: uma EA cassada não pode ser restaurada. Se a organização desejar obter as EA novamente,
  deverá iniciar um novo processo de emissão das EA.

  5.8 Substituição compulsória de cargos de administração requeridos'
