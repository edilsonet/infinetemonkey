title: Cassação das EA por parte da Anac
text: '5.7.1 Cassação das EA por parte da Anac

  5.7.1.1 A Anac poderá cassar as EA de um administrador de programa de propriedade compartilhada,
  em decorrência de processo sancionatório instaurado nos termos das Resoluções nº 761/2024
  e 762/2024, ou norma que vier a substituí-las.'
