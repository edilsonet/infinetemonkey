section_id: 5.8.1.2
section_title: 'A Anac também poderá solicitar a substituição do ocupante do cargo se:'
subsection_id: a
cite: 5.8.1.2(a)
title: 5.8.1.2(a)
text: 'a) a pessoa possuir comprovado histórico de conduta ou desempenho inadequados, conforme
  previsto nos parágrafos 91.1051(h), (i) e (j) do RBAC nº 91; ou


  Nota: as referências às sanções administrativas capituladas no art. 299, incisos I, V, VI
  ou VII, do CBA, contidas no parágrafo 91.1051(i)(2) do RBAC nº 91, se referem a enquadramentos
  de infrações como "procedimento ou prática, no exercício das funções, que revelem falta
  de idoneidade profissional para o exercício das prerrogativas dos certificados de habilitação
  técnica;", "fornecimento de dados, informações ou estatísticas inexatas ou adulteradas;",
  "recusa de exibição de livros, documentos contábeis, informações ou estatísticas aos agentes
  da fiscalização;" ou "prática reiterada de infrações graves;", ainda que, em razão da inclusão
  do § 3º do art. 288 do CBA, promovida pela Lei nº 14.368, atualmente o art. 299 não se aplique
  às atribuições da Anac.'
