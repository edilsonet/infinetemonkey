section_title: 'A Anac também poderá solicitar a substituição do ocupante do cargo se:'
subsection_id: b
cite: 5.8.1.2(b)
title: 5.8.1.2(b)
text: 'b) for constatada a participação ou omissão dos ocupantes de cargo de administração
  requerido em infrações relacionadas nas Resoluções nº 761/2024 e 762/2024, ou norma que
  vier a substituí-las, de forma sistêmica e reiterada.

  5.8.1.3 O detentor das EA será informado da sobre a necessidade de substituição do pessoal
  de administração requerido por meio de ofício, contendo prazo para a efetivação da substituição.

  5.8.1.4 Após a comunicação por parte da Anac, o detentor das EA deverá encaminhar solicitação
  de alteração de EA para atualização de pessoal de administração requerido, conforme o item
  5.3.4, e estará sujeito aos prazos e às providências administrativas previstas no item 5.5.2,
  ambos desta Instrução Suplementar.'
