title: Substituição compulsória de cargo de administração por processo sancionatório
text: '5.8.1 Substituição compulsória de cargo de administração por processo sancionatório

  5.8.1.1 A Anac poderá solicitar a substituição de uma pessoa exercendo qualquer um dos cargos
  de administração requeridos de um administrador de programa de propriedade compartilhada
  previstos na seção 91.1051 do RBAC nº 91, em decorrência de processo sancionatório instaurado
  nos termos das Resoluções nº 761/2024 e 762/2024, ou norma que vier a substituí-las, conforme
  previsto no art. 288 da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica
  - CBA).'
