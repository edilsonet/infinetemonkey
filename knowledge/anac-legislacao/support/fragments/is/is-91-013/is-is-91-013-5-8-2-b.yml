cite: 5.8.2(b)
title: 5.8.2(b)
text: 'b) um trinta e dois avos (1/32) de pelo menos uma aeronave de asas rotativas do programa.

  5.9.2 Além disso, o contrato de cada cotista com o administrador do programa deve ter duração
  de, pelo menos, 1 (um) ano, conforme previsto na seção 91.1003 do RBAC nº 91. Isto significa
  que um mesmo cotista deve "ocupar" aquela cota durante pelo menos 1 ano, não podendo ser
  substituído ou de outra forma repassar sua cota a terceiros durante esse período. Se o cotista,
  por qualquer motivo, deixar de usar a aeronave durante este período, o administrador de
  programa somente poderá ocupar novamente essa cota após 1 ano (365 dias), contado a partir
  da data de entrada do cotista.

  5.9.3 Estas limitações representam uma limitação do número de cotistas do programa de propriedade
  compartilhada e é justificada para se diferenciar as operações do programa das operações
  de serviço de transporte aéreo, sob o RBAC nº 135, que não possuem tal limitação e podem,
  de fato, ser oferecidas a qualquer pessoa. Os voos do programa de propriedade compartilhada,
  por sua vez, são restritos ao cotista, ou seja, o cotista deve ser o beneficiário do voo.
  Portanto, não é possível também que o cotista repasse ou revenda o direito de uso /posse
  da aeronave.

  5.9.4 Uma vez que o número de cotistas permitido está diretamente associado ao número de
  aeronaves operando sob o programa, o administrador de programa deve conciliar os controles.
  É possível que aeronaves do programa estejam temporariamente não aeronavegáveis, e isto
  não significa que o número de cotistas deva ser reduzido em razão dessa indisponibilidade
  temporária. Da mesma forma, a indisponibilidade temporária não implicaria em descumprimento
  do requisito de que o programa deve possuir duas ou mais aeronaves aeronavegáveis (91.1001(b)(5)(ii)),
  mesmo se, temporariamente, o programa contar com somente uma ou nenhuma aeronave aeronavegável.
  No entanto, períodos prolongados de indisponibilidade de uma aeronave (em especial, os superiores
  a 30 (trinta) dias) serão avaliados pela Anac, que pode determinar que a aeronave deixe
  de ser contabilizada para cálculo do número de cotistas e para cumprimento do parágrafo
  91.1001(b)(5)(ii) do RBAC nº 91.

  5.9.5 No caso de venda/substituição de aeronaves, deve ser observado o prazo de 30 (trinta)
  dias para reconciliação entre o número de aeronaves e o número de cotistas - observando-se
  adicionalmente o estabelecido no parágrafo 5.2.6.9 desta IS, se aplicável.'
