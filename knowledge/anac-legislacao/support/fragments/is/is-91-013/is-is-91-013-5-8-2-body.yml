title: Substituição compulsória de cargo por deficiência técnica ou de gestão
text: '5.8.2 Substituição compulsória de cargo por deficiência técnica ou de gestão

  5.8.2.1 A qualquer momento a Anac poderá solicitar a substituição de uma pessoa exercendo
  qualquer um dos cargos de administração requeridos de um administrador de programa de propriedade
  compartilhada previstos na seção 91.1051 do RBAC nº 91, caso seja constado que o ocupante
  do cargo deixou de cumprir com as atribuições e responsabilidades eventualmente estabelecidas
  em seus manuais, conforme seção 91.1023 do RBAC nº 91, ou não está qualificado, conforme
  o parágrafo 91.1051(c) do RBAC nº 91.

  5.8.2.2 A Anac considera que as condições listadas abaixo demonstram deficiência técnica
  do pessoal de administração requerido, quando comprovadamente são reiteradas e sistêmicas
  e/ou que levam a operação do detentor das EA a situações indesejadas com risco operacional
  inaceitável.'
