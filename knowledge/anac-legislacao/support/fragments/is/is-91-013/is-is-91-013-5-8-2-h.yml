section_title: Substituição compulsória de cargo por deficiência técnica ou de gestão
subsection_id: h
cite: 5.8.2(h)
title: 5.8.2(h)
text: 'h) demonstrar falta de assertividade na tomada de decisão ou na gestão das suas responsabilidades
  e/ou de seus subordinados.

  5.8.2.3 O detentor das EA será informado sobre a necessidade de substituição do pessoal
  de administração requerido por meio de ofício, contendo prazo para a efetivação da substituição.

  5.8.2.4 Após a comunicação da decisão por parte da Anac, o detentor das EA deverá encaminhar
  solicitação de alteração de EA para atualização de pessoal de administração requerido, conforme
  o item 5.3.4, e estará sujeito aos prazos e às providências administrativas previstas no
  item 5.5.2, ambos desta Instrução Suplementar.

  5.9 Limitações na provisão dos serviços de administração do programa de propriedade compartilhada

  5.9.1 O administrador de programa deve atender, durante todo o período de operação, à cota
  mínima por cotista, conforme estabelecido no parágrafo 91.1001(b)(10):'
