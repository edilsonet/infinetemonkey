title: Aprovação
text: 'Aprovação

  MCV

  Manual de Comissários de Voo

  Opcional para os operadores de aeronaves cuja operação exija comissários de voo, de acordo
  com a seção 91.533 do RBAC nº 91. Quando utilizado, deve estar inserido como parte do MO
  do administrador.

  Aceitação

  PEPSP

  Programa de educação para a prevenção do risco associado ao uso indevido de substâncias
  psicoativas

  Para operadores cujos colaboradores desempenhem ARSO, pode ser utilizado para satisfazer
  os requisitos expostos nos parágrafos 91.1047(a) e (b) do RBAC nº 91, de acordo com o RBAC
  nº 120 e IS nº 120-002.

  Declaração de ciência e cumprimento da seção 91.1047.'
