title: Descrição do aeródromo
text: '2. Descrição do aeródromo

  Com base nas informações oficiais presentes nas Cartas Aeronáuticas e em informativos dos
  Operadores Aeroportuários, indicar:

  - Todas as facilidades presentes no aeródromo;

  - Cabeceira e sentido da operação proposta na pista, bem como todas as condições de contorno
  ou limitantes (obstáculos). Em aeródromos com mais de uma pista, deverá ser indicada a pista
  (ou pistas) pretendida(s).;

  - Infraestrutura relacionada às operações aéreas;

  - Temperatura de referência;

  - Elevação em relação ao nível do mar;

  - Designativo ICAO;

  - LDA; e

  - dimensões da RESA e forma de implementação (física, medida alternativa ou medida mitigadora).'
