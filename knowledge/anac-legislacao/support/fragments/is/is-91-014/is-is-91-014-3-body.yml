title: Descrição da operação e motivação
text: '3. Descrição da operação e motivação

  Descrição detalhada da operação proposta com a aplicação de fator majorado para cálculo
  do comprimento efetivo de pista requerido, incluindo a motivação com embasamento técnico
  e contextual às operações. Deve ser exposta a motivação para ampliação do fator para cálculo
  do comprimento efetivo de pista requerido para cada determinado modelo de aeronave e para
  cada determinada pista do aeródromo.'
