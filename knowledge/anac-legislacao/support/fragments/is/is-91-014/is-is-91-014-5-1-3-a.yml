title: 5.1.3(a)
text: a) se o avião utilizou para o cálculo de desempenho de pouso, em seu processo de certificação,
  a metodologia de “pouso paramétrico” - exceto se se tratar de um grande avião categoria
  transporte com motor a turbina. Essa informação sobre a utilização da metodologia de “pouso
  paramétrico” no processo de certificação do avião pode ser obtida pelo operador junto ao
  fabricante do avião ou seu representante. Caso não se tenha essa informação, deve-se adotar
  a limitação considerando que a metodologia foi utilizada; e
