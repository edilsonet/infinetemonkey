text: 'b) o piloto em comando deve, no momento do planejamento do voo, tomar ciência das dimensões
  das pistas dos aeródromos a serem utilizados e dos dados de desempenho da aeronave, conforme
  estabelecido na seção 91.103 do RBAC nº 91.

  5.2 Procedimentos operacionais

  5.2.1 Para operadores sob o RBAC nº 135, a autorização para uso do fator de 80% no cálculo
  do comprimento efetivo requerido somente pode ser utilizada em operações não regulares,
  independentemente de o operador ser autorizado ou não a realizar operações regulares.

