title: 'Os requisitos dessas seções são organizados nas tabelas a seguir, com base na aplicabilidade
  de acordo com a classificação do avião:'
text: '5.1.3 Os requisitos dessas seções são organizados nas tabelas a seguir, com base na
  aplicabilidade de acordo com a classificação do avião:


  Tabela 1 - Aplicabilidade dos requisitos de fatoração de pista para pouso do RBAC nº 135

  Classificação do avião (aplicabilidade)

  Percentual do comprimento efetivo de pista

  Requisito

  Grande avião categoria transporte com motores convencionais


  Pequeno avião categoria transporte com motores convencionais (por referência em 135.397(a))

  60% para o aeródromo de destino (Ver Nota 1)

  135.375

  70% para o aeródromo de alternativa

  135.377

  Grande avião categoria transporte com motores a turbina


  Pequeno avião categoria transporte com motores a turbina (por referência em 135.397(b))


  Avião categoria transporte regional (por referência em 135.398(c))


  Pequeno avião não incluído na categoria transporte, certificado na categoria normal e que
  atenda aos requisitos da seção 1.(b) do SFAR 41 da FAA, conforme 135.169(b)(6) (por referência
  em 135.399(b))

  60% para o aeródromo de destino (Ver Notas 2, 3 e 4)

  135.385

  Para um avião a reação: 60% para o aeródromo de alternativa


  Para um avião turboélice: 70% para o aeródromo de alternativa

  135.387

  Grande avião não incluído na categoria transporte, cujo tipo foi certificado antes de 01/07/1942.

  60% para o aeródromo de destino

  135.393

  70% para o aeródromo de alternativa

  135.395

  Nota 1: se for possível cumprir o requisito considerando ar calmo (135.375(a)(1)), mas não
  com as condições previstas de vento (135.375(a)(2)), o voo pode ocorrer desde que seja indicado
  aeródromo de alternativa que cumpra com a seção 135.377 do RBAC nº 135.

  Nota 2: para um avião turboélice, se for possível cumprir o requisito considerando ar calmo
  (135.385(b)(1)), mas não com as condições previstas de vento (135.385(b)(2)), o voo pode
  ocorrer desde que seja indicado aeródromo de alternativa que cumpra com a seção 135.387
  do RBAC nº 135.

  Nota 3: para um avião a reação, se for possível cumprir o requisito considerando ar calmo
  (135.385(b)(1)), mas não com as condições previstas de vento (135.385(b)(2)), o voo pode
  ocorrer desde que seja indicado aeródromo de alternativa que cumpra com a seção 135.387
  do RBAC nº 135 (que requer o cumprimento do parágrafo 135.385(b)).

  Nota 4: para um avião a reação, se as informações meteorológicas indicarem que a pista do
  aeródromo de destino poderá estar molhada ou escorregadia no horário estimado de pouso,
  é requerida fatoração de 52,17%, a menos que exista autorização da ANAC para uso de distâncias
  menores, em conformidade com o parágrafo 135.385(e) do RBAC nº 135.


  Tabela 2 - Aplicabilidade dos requisitos de fatoração de pista para pouso do RBAC nº 91
  - subparte K

  Classificação do avião (aplicabilidade)

  Percentual do comprimento efetivo de pista

  Requisito

  Grande avião categoria transporte com motores a turbina

  60% para o aeródromo de destino (Ver Nota)

  91.1037(b)

  80% para o aeródromo de alternativa

  91.1037(d)

  Nota: para um avião turboélice, se for possível cumprir o requisito considerando ar calmo
  (91.1037(b)(1)), mas não com as condições previstas de vento (91.1037(b)(2)), o voo pode
  ocorrer desde que seja indicado aeródromo de alternativa que cumpra com os requisitos da
  seção 91.1037 do RBAC nº 91, exceto pelo fato de se utilizar percentual de 70% para a fatoração.

  5.1.4 Pequenos aviões não incluídos na categoria transporte, certificados na categoria normal
  e que atendam aos requisitos do Apêndice A do RBAC nº 135 ou da seção 1.(a) do SFAR 41 da
  FAA, conforme o parágrafo 135.169(b)(4) ou (5) do RBAC nº 135, respectivamente, devem cumprir
  as limitações de pouso constantes no manual de voo do avião, conforme estabelecido no parágrafo
  135.399(a) do RBAC nº 135. Observa-se que os valores apresentados no manual desses aviões
  já são corrigidos considerando fatoração de 60% para o aeródromo de destino e de 70% para
  o aeródromo de alternativa, em atendimento ao parágrafo A135.3(d)(2) do RBAC nº 135 (aplicável,
  por referência em 1.(a)(2) do SFAR 41, aos aviões que atendem aos requisitos da seção 1.(a)
  do SFAR 41 da FAA). Para esses aviões, o RBAC nº 135 não permite a utilização de fator de
  80%.

  5.1.5 Observa-se que outros aviões (como, por exemplo, em operações segundo o RBAC nº 135,
  os pequenos aviões não incluídos na categoria transporte e que não constem na Tabela 1 nem
  se enquadrem no parágrafo 5.1.4 desta IS; ou, em operações segundo o RBAC nº 91 - Subparte
  K, os aviões que não se enquadrem na seção 91.1037 do RBAC nº 91) não estão sujeitos à aplicação
  de fatoração de pista. No entanto, nessas operações:'
