subsection_id: e
cite: 5.2.3(e)
title: 5.2.3(e)
text: 'e) no momento do planejamento do voo, não pode haver, para o horário estimado de utilização
  do aeródromo, previsão de:

  i. vento de cauda;

  ii. componente de vento de través superior a 15 nós; ou

  iii. condições meteorológicas adversas;'
