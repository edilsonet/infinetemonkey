section_title: 'Para a realização da operação, devem ser observados os seguintes requisitos
  operacionais:'
subsection_id: f
cite: 5.2.3(f)
title: 5.2.3(f)
text: f) se o avião possuir dados específicos sobre o efeito da temperatura no cálculo da
  distância de pouso o operador deve considerar esses dados, considerando o horário estimado
  de utilização do aeródromo. Se o avião não possuir esses dados, o operador deve considerar
  o aumento da velocidade de aproximação no solo em razão do aumento da temperatura - a autorização,
  nesse caso, é limitada ao fator de 70%, conforme item 5.2.2b) desta IS;
