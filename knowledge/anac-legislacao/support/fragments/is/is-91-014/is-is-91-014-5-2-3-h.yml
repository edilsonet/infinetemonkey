section_title: 'Para a realização da operação, devem ser observados os seguintes requisitos
  operacionais:'
subsection_id: h
cite: 5.2.3(h)
title: 5.2.3(h)
text: 'h) em voo, durante a preparação para a aproximação, os pilotos devem verificar o desempenho
  de pouso considerando as condições atualizadas (incluindo condições meteorológicas, de pista
  e procedimentos operacionais, como velocidades de aproximação). Se as condições consideradas
  no despacho já representarem adequadamente as condições esperadas para o pouso, a verificação
  pode ser feita confirmando essas condições. Caso contrário, pode ser necessário recalcular
  o desempenho:

  i. se o avião possuir dados específicos para o cálculo de desempenho em voo (usualmente
  denominados in-flight landing distance, Landing Performance Data for Time-of-Arrival Landing
  Performance Assessments ou similar), esses dados devem ser usados nessa verificação. Nesse
  caso, a distância disponível para pouso deve ser de pelo menos 115% da distância de pouso
  estimada em voo; e

  ii. se o avião não possuir dados específicos para o cálculo de desempenho em voo, devem
  ser usados os mesmos dados utilizados para o cálculo de desempenho no despacho, incluindo
  a mesma fatoração;'
