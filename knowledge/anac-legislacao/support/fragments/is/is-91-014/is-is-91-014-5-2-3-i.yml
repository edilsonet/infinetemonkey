section_id: 5.2.3
section_title: 'Para a realização da operação, devem ser observados os seguintes requisitos
  operacionais:'
subsection_id: i
cite: 5.2.3(i)
title: 5.2.3(i)
text: 'i) a operação de aproximação e pouso deve ser conduzida pelo piloto em comando se:

  i. o segundo em comando possuir experiência de menos de 100 horas de voo na classe/tipo
  de avião (de acordo com a habilitação requerida) e, adicionalmente:

  1) a visibilidade for inferior a 1200 m;

  2) o RVR for inferior a 4000 pés;

  3) a pista estiver molhada, escorregadia ou contaminada;

  4) o reporte de ação de frenagem da pista for inferior a “bom”;

  5) o componente de vento de través for superior a 15 nós;

  6) houver reporte de tesoura de vento na vizinhança do aeródromo; ou

  7) em qualquer outra condição em que o piloto em comando determine que seja prudente conduzir
  a operação;'
