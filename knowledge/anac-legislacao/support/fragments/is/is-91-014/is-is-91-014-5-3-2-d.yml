text: 'd) Estudo Técnico Específico, contendo todos os itens previstos nesta IS. O estudo
  deverá ainda conter uma completa análise de segurança operacional, contendo todos os conceitos
  previstos no MGSO, comprovando que a operação proposta permite manutenção dos níveis adequados
  de segurança operacional.

  5.3.4 Para a solicitação de emprego de fator majorado no cálculo do comprimento efetivo
  de pista requerido para pouso conforme previsto no parágrafo 91.1037(f) do RBAC nº 91, a
  seguinte documentação é necessária:'
