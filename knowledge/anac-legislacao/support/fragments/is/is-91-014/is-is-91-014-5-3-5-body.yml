title: Uma vez solicitada, a análise da proposta e a aprovação são divididas basicamente em
  três etapas - inicial, intermediária e final.
text: '5.3.5 Uma vez solicitada, a análise da proposta e a aprovação são divididas basicamente
  em três etapas - inicial, intermediária e final.

  5.3.6 A etapa inicial consiste na análise de toda a documentação pertinente prevista nesta
  IS, que permita atestar o cumprimento de toda a legislação e normativos em vigor, bem como
  situar o adequado nível de segurança operacional das operações pretendidas.

  5.3.7 A etapa intermediária consiste na realização de inspeções e avaliações operacionais,
  visando atestar a capacidade do operador na condução das operações, bem como se as operações
  permitem manutenção de adequados níveis de segurança operacional.

  5.3.8 A etapa final, com a aprovação de toda a documentação e pareceres favoráveis das atividades
  de inspeções e avaliações operacionais, é concluída com emissão das Especificações Operativas
  (no caso de operadores aéreos regidos segundo o RBAC nº 135) ou das Especificações Administrativas
  (no caso de operadores aéreos regidos segundo o RBAC nº 91 - Subparte K), contendo a autorização
  para emprego de fator majorado, até 80%, no cálculo do comprimento efetivo de pista requerido
  para pouso para determinado modelo de aeronave em determinado aeródromo.

  5.4 Estudo Técnico Específico

  5.4.1 O Estudo Técnico Específico consiste em um documento no qual o operador aéreo interessado
  em solicitar elevação do fator empregado para cálculo do comprimento efetivo de pista requerido
  para pouso deve apresentar síntese de sua análise e adequação da operação proposta frente
  a segurança operacional.

  5.4.2 Nesse estudo devem, também, ser analisados os desempenhos de pousos dos aviões envolvidos,
  bem como características físicas do aeródromo no qual as operações ocorrerão.'
