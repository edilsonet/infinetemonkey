section_id: 5.4.3
section_title: 'O estudo deve conter ao menos os seguintes itens devidamente expostos e analisados:'
subsection_id: a
cite: 5.4.3(a)
title: 5.4.3(a)
text: 'a) indicação dos modelos de aeronaves a serem operados sob essa autorização, bem como
  descrição das principais características desses modelos de aeronaves, com base nas informações
  presentes no AFM do modelo da aeronave. Deve ser indicado, ao menos: tipo de motorização,
  quantidade total de assentos na configuração empregada, assentos destinados à tripulação,
  tripulação mínima requerida na operação, Peso Máximo de Decolagem e Peso Máximo de Pouso.
  Ainda, exceto para um grande avião categoria transporte com motor a turbina, deve ser informado
  se, no processo de certificação da aeronave, o cálculo de desempenho de pouso utilizou metodologia
  de “pouso paramétrico” (ver item 5.2.2a) desta IS);'
