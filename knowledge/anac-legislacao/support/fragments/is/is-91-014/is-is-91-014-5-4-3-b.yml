id: is-is-91-014-5-4-3-b
kind: is
document: is-91-014
family: '91'
section_id: 5.4.3
section_title: 'O estudo deve conter ao menos os seguintes itens devidamente expostos e analisados:'
subsection_id: b
cite: 5.4.3(b)
title: 5.4.3(b)
text: 'b) indicação dos aeródromos a serem utilizado sob essa autorização, bem como descrição
  das principais características desses aeródromos, com base nas informações presentes nas
  publicações oficiais e informativos dos operadores aeroportuários. Deve ser indicado, ao
  menos: todas as facilidades presentes no aeródromo, infraestrutura relacionada às operações
  aéreas, temperatura de referência, elevação em relação ao nível do mar, designativo ICAO,
  LDA e, quando existente, dimensões da RESA (incluindo forma de implementação: física, medida
  alternativa ou medida mitigadora). Deve ser indicada a cabeceira e sentido da operação proposta
  na pista, bem como todas as condições de contorno ou limitantes (obstáculos). Em aeródromos
  com mais de uma pista, deverá ser indicada a pista (ou pistas) pretendida(s);

  Nota: a RESA é uma barreira de segurança relevante para proteção de saída de pista. Dessa
  forma, o operador aéreo deve considerar, na análise de segurança operacional de seu Estudo
  Técnico Específico, a existência ou não de RESA. A ANAC considerará esse fator na avaliação
  das solicitações.'
