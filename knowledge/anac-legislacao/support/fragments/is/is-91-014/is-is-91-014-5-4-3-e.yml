section_id: 5.4.3
section_title: 'O estudo deve conter ao menos os seguintes itens devidamente expostos e analisados:'
subsection_id: e
cite: 5.4.3(e)
title: 5.4.3(e)
text: 'e) análise de segurança operacional, na qual, para cada modelo de aeronave e para cada
  aeródromo pretendido (que se proponha utilizar sob essa autorização). O operador deve evidenciar
  que, segundo a matriz de risco construída, a operação proposta permite manutenção do mesmo
  nível de segurança operacional quando comparado à operação segundo o previsto originalmente
  nos regulamentos (sem aplicação de majoração do fator de cálculo do comprimento efetivo
  de pista requerido para pouso), bem como deve apresentar todas as medidas a serem adotadas
  visando minimização desses riscos.

  Nota: a AC 91-79, emitida pelo FAA, em sua versão mais atualizada, traz uma análise dos
  riscos associados a uma excursão no final da pista (overrun) e formas de mitigação desses
  riscos.

  5.4.4 O operador pode, num mesmo peticionamento, requerer aplicação da elevação do fator
  tratada nessa IS para diversos modelos de aeronaves operados e para diversas pistas de aeródromos.
  No entanto, deve apresentar análise completa para cada modelo de aeronave, operando em cada
  determinada pista.'
