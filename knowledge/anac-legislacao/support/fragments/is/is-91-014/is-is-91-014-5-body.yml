title: Análise de Segurança Operacional
text: '5. Análise de Segurança Operacional

  Para tecer conclusões embasadas tanto em dados quantitativos como qualitativos, realizou-se
  uma avaliação dos riscos correlatos à operação proposta. Abaixo estão representadas as definições
  padronizadas pela ANAC de severidade, de probabilidade e a Matriz de Risco. O operador,
  caso julgue mais adequado, pode indicar suas próprias definições e compor sua própria Matriz
  de Risco, em conformidade com seu MGSO.


  Definições de severidade


  Definições de probabilidade


  Matriz de risco


  Exemplo para apresentação da avaliação da segurança operacional (Tabela 2) - o operador
  deve listar todos os riscos intrínsecos à operação pretendida na pista VVVV do aeródromo
  XXXX com a aeronave modelo YYYY, aplicando-se fator majorado no cálculo de comprimento de
  pista requerido para pouso. Pode ainda conter figuras, gráficos e outros elementos.


  A Tabela 2, como todo o disposto nesse Apêndice, é um exemplo de como o operador pode apresentar
  seu estudo. O operador deve apresentar sua Avaliação de Segurança Operacional da forma que
  melhor ilustre suas especificidades operacionais.


  Tabela 2 - Avaliação da Segurança Operacional

  Descrição do Risco

  Medidas mitigadoras a serem adotadas

  Avaliação do risco

  Medidas mitigadoras adicionais e como serão implementadas

  Perda de controle

  no solo resultando em saída de pista

  - Programa de manutenção das aeronaves, em especial as atividades relacionadas a trens de
  pouso, freios e pneus;

  - Procedimentos de arremetida em casos de aproximação não estabilizada;

  - Atuar em conjunto aos gestores aeroportuários visando manter as condições da pista de
  pouso e decolagem em conformidade com requisitos normativos;

  - Comprovação de existência de faixa de pista livre de obstáculo;

  - Comprovação de faixa preparada com capacidade de suporte;

  - Etc.

  Conforme a probabilidade e severidade segundo o previsto na “Matriz de risco” do operador

  - Atuar junto aos gestores aeroportuários sobre procedimentos e boas práticas relacionadas
  à manutenção das condições da pista de pouso e decolagem - prazo XX meses;

  - Avaliar e providenciar a restrição das operações quando necessário - prazo XX meses;

  - Incluir a perda de controle no solo resultando em saída de pista como um dos riscos a
  ser tratado e monitorado - prazo XX meses;

  - Inclusão no briefing de descida o reforço da aproximação estabilizada - prazo XX meses;

  - Etc.

  Perda da consciência situacional resultando em colisão com o solo

  - Manter programa de treinamento dos tripulantes válido;

  - Utilizar as informações meteorológicas disponíveis para o planejamento de voo;

  - Manter SOP atualizado e conhecido pela tripulação;

  - Conferência das cartas oficiais, callouts e situação geral dos aeródromos envolvidos;

  - Garantir que as operações respeitem as regras de voo aplicáveis às operações (VFR/IFR);

  - Etc.


  Conforme a probabilidade e severidade segundo o previsto na “Matriz de risco” do operador

  - Incluir voo controlado contra o terreno como um dos riscos a ser tratado e monitorado
  - prazo XX meses;

  - Reforçar o treinamento na aeronave, em especial os itens relacionados ao funcionamento
  dos instrumentos de navegação e da inserção correta de informações nesses instrumentos e
  no PA (rádios, waypoints, marcadores externos) - prazo XX meses;

  - Reforçar treinamento (equipamentos mínimos que devem estar operando para cada procedimento
  de navegação/aproximação) - prazo XX meses;

  - Produzir guia de rotas contendo informações relacionadas ao relevo de cada localidade
  - prazo XX meses;

  - Etc.

  Colisão com obstáculo durante o pouso

  - Acompanhar planos do operador aeroportuário sobre monitoramento e manutenção nas superfícies
  de rolagem livres e desimpedidas;

  - Manter programa de treinamento dos tripulantes válido;

  - Utilizar as informações meteorológicas disponíveis para o planejamento de voo;

  - Etc.


  Conforme a probabilidade e severidade segundo o previsto na “Matriz de risco” do operador

  - Atuar junto aos gestores aeroportuários sobre procedimentos e boas práticas relacionadas
  a manutenção das superfícies de rolagem - prazo XX meses;

  - Realizar ações junto aos gestores aeroportuário visando retirada de objetos da faixa de
  pista e campanhas preventivas - prazo XX meses.

  - Incluir a colisão com obstáculo durante a decolagem e o pouso como um dos riscos a ser
  tratado e monitorado - prazo XX meses;

  - Produzir guia de rotas contendo informação dos obstáculos presentes nas imediações de
  cada aeródromo - prazo XX meses;

  - Estabelecer ações para aprimorar, tanto em quantidade como em qualidade, os relatos de
  segurança operacional - prazo XX meses.

  - Etc.

  Aeronave ultrapassar o comprimento efetivo para rolagem definido após aplicação do fator
  majorado

  - Operar apenas com piloto qualificado como piloto em comando;

  - Operar apenas com pista seca;

  - Não realizar operação com reverso em pane;

  - Operar apenas em período diurno e em condições visuais;

  - Incluir definições em manuais e documentação técnica sobre como serão realizadas as operações
  em aeródromos onde seja autorizado o emprego de fator majorado para cálculo do comprimento
  efetivo de pista requerido para pouso;

  - Etc.


  Conforme a probabilidade e severidade segundo o previsto na “Matriz de risco” do operador

  - Revisar periodicamente as definições em manuais e documentação técnica sobre as operações
  em aeródromos onde seja autorizado o emprego de fator majorado para cálculo do comprimento
  efetivo de pista requerido para pouso - prazo XX meses;

  - Reforçar o treinamento na aeronave para operação com fator majorado no cálculo do comprimento
  efetivo de pista requerido para pouso - prazo XX meses;

  - Produzir guia de rotas contendo informações relacionadas aos aeródromos onde ocorrem as
  operações com fator majorado para cálculo do comprimento efetivo de pista requerido para
  pouso - prazo XX meses;

  - Etc.

  ...

  ...

  ...

  ...


  Nota: a AC 91-79, emitida pelo FAA, em sua versão mais atualizada, traz uma análise dos
  riscos associados a uma excursão no final da pista (overrun) e formas de mitigação desses
  riscos.

  Por fim, considerando todo o exposto no estudo apresentado, verifica-se que a proposta de
  elevação do fator para cálculo do comprimento efetivo de pista requerido para pouso mantém
  o mesmo nível de segurança operacional adequado quando comparado à operação segundo o previsto
  originalmente nos regulamentos (indicar conforme a probabilidade e severidade segundo o
  previsto na “Matriz de risco” do operador, a classificação final da operação), permitindo
  operação no aeródromo XXXX com a aeronave modelo YYYY.'
