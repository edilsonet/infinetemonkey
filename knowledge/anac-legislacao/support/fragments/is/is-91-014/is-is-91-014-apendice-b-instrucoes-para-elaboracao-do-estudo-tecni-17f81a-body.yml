text: 'APÊNDICE B - Instruções para elaboração do Estudo Técnico Específico para autorização
  da elevação do fator para cálculo do comprimento efetivo de pista em pousos de aviões para
  operações conduzidas segundo o RBAC nº 91 - SUBPARTE K e RBAC nº 135


  B.1 No item B.5 é sugerida uma estrutura básica para composição do documento. No entanto,
  o operador pode apresentar o estudo seguindo formatação e estrutura que considere mais adequada,
  desde que contenha, ao menos, todas as informações requeridas.

  B.2 Considerando as diferenças entre os operadores aéreos e principalmente as especificidades
  de cada operação proposta, o conteúdo do estudo técnico pode ser mais abrangente e informações
  adicionais ou alterações podem ser solicitadas pela ANAC.

  B.3 O operador deve apresentar para cumprimento da seção que trata da “Apresentação e análise
  dos resultados” de seu Estudo Técnico Específico, gráficos de desempenho ou dados tabulados
  comprovando que a operação de pouso, segundo as situações estudadas, é segura e mantém o
  nível de segurança operacional adequado, permitindo que a aeronave proceda um pouso completo
  dentro da LDA.

  B.4 O principal objetivo do Estudo Técnico Específico é apresentar à ANAC uma evidência
  de que a operação empregando fator majorado para cálculo do comprimento efetivo de pista
  requerido em pousos de aviões permite a manutenção do nível de segurança operacional idêntico
  ao que seria com a operação considerando o fator previsto originalmente nos regulamentos.

  B.5 Exemplo de Estudo Técnico Específico:

  _______________________________________________________________________________

  Estudo Técnico Específico para análise da elevação do fator empregado para cálculo do comprimento
  efetivo de pista requerido em pousos de aviões

  Para aeronave modelo AAA-000 operando no Aeródromo XXXX

  Operador: XXXXXXX Data: XX/XX/XXXX nbsp; Revisão: XXX

  _______________________________________________________________________________'
