section_title: 'Segunda ação: em complemento às orientações do detentor do projeto da aeronave,
  proceder-se-á conforme segue:'
subsection_id: a
cite: 5.2.2.2(a)
title: 5.2.2.2(a)
text: a) A ANAC verificará as horas e ciclos totais de 5 (cinco) aeronaves civis brasileiras
  de mesmo modelo, ano de fabricação e número de série próximos (excluindo aeronaves com histórico
  de Certificado de Aeronavegabilidade (CA) cancelado, suspenso ou interditado), calculará
  a média aritmética das horas e ciclos totais, e atribuirá esses valores à aeronave em questão.
  Nesse caso, deve ser registrado no termo de abertura do Diário de Bordo e das Cadernetas
  que essa informação foi derivada dos procedimentos desta IS e inserir o número de processo
  ou o documento da ANAC que autorizou essa reconstituição. No caso de não existirem pelo
  menos outras 5 aeronaves de mesmo modelo em operação no Brasil, serão atribuídas as horas
  e ciclos totais da aeronave de mesmo modelo com maior número de horas.
