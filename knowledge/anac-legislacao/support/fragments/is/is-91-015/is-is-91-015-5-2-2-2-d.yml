section_id: 5.2.2.2
section_title: 'Segunda ação: em complemento às orientações do detentor do projeto da aeronave,
  proceder-se-á conforme segue:'
subsection_id: d
cite: 5.2.2.2(d)
title: 5.2.2.2(d)
text: 'd) Após o cumprimento dos itens acima, o operador deverá solicitar uma Vistoria Técnica
  Especial (VTE) à ANAC. Esse tipo de vistoria não poderá ser realizada por Profissional Credenciado
  em Aeronavegabilidade (PCA).

  5.2.3 A aeronave não possui Diários de Bordo ou Cadernetas de Célula, Motor e Hélice, mas
  há registros de TSN e CSN da aeronave na base de dados da ANAC (SEI, SACI, etc).

  5.2.3.1 Primeira ação: o operador ou profissional de aviação civil deverá consultar o detentor
  do projeto da aeronave a fim de obter informações que possam subsidiar a definição das ações
  necessárias para restabelecer a condição aeronavegável da aeronave. As orientações dadas
  pelo detentor do projeto deverão ser seguidas, e sua execução demonstrada à ANAC no processo
  de reconstituição dos Diários de Bordo e/ou Cadernetas de Célula, Motor e Hélice. Deverá
  ser aberto no SEI um processo específico do tipo “Parecer Técnico” e nele incluídos os registros
  das ações realizadas e carta solicitando à ANAC orientações para continuidade do processo
  de reconstituição de Diários de Bordo e Cadernetas.'
