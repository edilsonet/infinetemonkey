subsection_id: a
cite: 5.2.3.2(a)
title: 5.2.3.2(a)
text: a) A ANAC verificará os ciclos totais e as horas totais da aeronave registradas no SACI,
  ou sistema equivalente, e calculará a média de ciclos e horas voadas por ano (excluindo
  períodos nos quais a aeronave tenha estado com CA suspenso, cancelado ou interditado).
