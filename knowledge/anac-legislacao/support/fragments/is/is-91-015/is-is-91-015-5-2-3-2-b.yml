section_title: 'Segunda ação: em complemento às orientações do detentor do projeto da aeronave,
  proceder-se-á conforme segue:'
subsection_id: b
cite: 5.2.3.2(b)
title: 5.2.3.2(b)
text: b) Nesse caso, a ANAC atribuirá a quantidade de horas e ciclos baseada na multiplicação
  do valor médio anual obtido no item acima por cada ano com horas e ciclos desconhecidos
  (ou período proporcional caso o intervalo seja inferior a um ano), e somará os resultados
  ao último registro de TSN e CSN conhecido, para então obter as horas totais e ciclos totais
  a serem considerados para a aeronave. Assim, deve ser registrado no termo de abertura do
  Diário de Bordo e das Cadernetas que essa informação foi derivada dos procedimentos desta
  IS e inserir o número de processo ou o documento da ANAC que autorizou essa reconstituição.
