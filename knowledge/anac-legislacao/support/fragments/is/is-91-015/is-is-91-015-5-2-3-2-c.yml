section_id: 5.2.3.2
section_title: 'Segunda ação: em complemento às orientações do detentor do projeto da aeronave,
  proceder-se-á conforme segue:'
subsection_id: c
cite: 5.2.3.2(c)
title: 5.2.3.2(c)
text: 'c) O operador deverá submeter a aeronave à maior e mais abrangente inspeção prevista
  no programa de manutenção do fabricante. Deve cumprir todas as diretrizes de aeronavegabilidade
  aplicáveis emitidas pela ANAC e pelo Estado de projeto para a célula, motor, hélice e acessórios.
  Deve realizar a revisão geral de todos os artigos controlados por TBO e substituir todos
  os itens controlados por TLV.

  NOTA 1 - A ANAC poderá dispensar o cumprimento do item c) acima caso as orientações fornecidas
  pelo detentor do projeto de tipo na primeira ação (5.2.3.1) sejam consideradas pela ANAC
  como suficientes para restaurar a condição aeronavegável da aeronave.

  NOTA 2 - O RBAC nº 39 estabelece que as Diretrizes de Aeronavegabilidade emitidas pela autoridade
  de aviação civil do Estado de projeto do produto são consideradas como Diretrizes de Aeronavegabilidade
  Brasileiras e, desta forma, são também de cumprimento obrigatório para todos os produtos
  aeronáuticos.'
