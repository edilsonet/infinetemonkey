section_id: 5.2.4.2
section_title: Para a regularização de inconsistência entre o Diário de Bordo e as Cadernetas
  de Célula, Motor e Hélice, proceder-se-á conforme segue.
subsection_id: a
cite: 5.2.4.2(a)
title: 5.2.4.2(a)
text: a) O operador deverá submeter à ANAC o pedido de regularização dessa condição inconsistente,
  que irá confrontar os registros apresentados com os dados constantes do SACI, ou sistema
  equivalente da ANAC, a fim de descartar qualquer possibilidade de omissão de horas de voo
  e/ou ciclos por parte do operador. Deverá ser aberto no SEI um processo específico do tipo
  “Parecer Técnico” e nele incluídos os registros das ações realizadas e carta solicitando
  à ANAC orientações para continuidade do processo de correção das horas divergentes.
