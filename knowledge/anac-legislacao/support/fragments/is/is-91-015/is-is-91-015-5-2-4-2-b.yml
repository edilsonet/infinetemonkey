section_id: 5.2.4.2
section_title: Para a regularização de inconsistência entre o Diário de Bordo e as Cadernetas
  de Célula, Motor e Hélice, proceder-se-á conforme segue.
subsection_id: b
cite: 5.2.4.2(b)
title: 5.2.4.2(b)
text: b) Constatadas diferenças entre os registros presentes no Diário de Bordo e sistemas
  de controle da ANAC, o recálculo do TSN e CSN da referida aeronave poderá ser necessário,
  devendo, nesse caso, ser aberto novo Diário de Bordo e novas Cadernetas, conforme orientação
  da ANAC.
