kind: is
document: is-91-015
family: '91'
section_id: 5.2.4.2
section_title: Para a regularização de inconsistência entre o Diário de Bordo e as Cadernetas
  de Célula, Motor e Hélice, proceder-se-á conforme segue.
subsection_id: c
cite: 5.2.4.2(c)
title: 5.2.4.2(c)
text: c) Havendo recálculo, o operador, com auxílio de uma Organização de Manutenção (OM),
  se necessário, deverá avaliar e demonstrar para a ANAC se esse novo TSN e CSN implica alguma
  atividade de manutenção da célula, motor, hélice e demais artigos controlados por TBO e
  TLV, bem como o cumprimento de diretrizes de aeronavegabilidade aplicáveis que porventura
  tenham sido atingidas por essa diferença de horas e ciclos.
