section_title: Para a regularização de inconsistência entre o Diário de Bordo e as Cadernetas
  de Célula, Motor e Hélice, proceder-se-á conforme segue.
subsection_id: d
cite: 5.2.4.2(d)
title: 5.2.4.2(d)
text: d) A ANAC poderá, em virtude da inconsistência identificada, exigir a realização da
  maior e mais abrangente inspeção prevista no programa de manutenção do fabricante, bem como
  a revisão geral e substituição de todos os artigos que porventura tenham sido atingidos
  por esse acréscimo de horas e ciclos.
