text: '5.2.4 Horas Totais - TSN e/ou Ciclos Totais - CSN divergentes entre o Diário de Bordo
  e as Cadernetas de Célula, Motor e Hélice.

  5.2.4.1 O Diário de Bordo é o documento e meio oficial a ser utilizado como referência para
  os registros de horas de voo e ciclos a serem escriturados nas Cadernetas de Célula, Motor
  e Hélice para efeito de controle da manutenção. Portanto, todas as Cadernetas devem refletir
  o registro de TSN e CSN constantes do respectivo Diário de Bordo.'
