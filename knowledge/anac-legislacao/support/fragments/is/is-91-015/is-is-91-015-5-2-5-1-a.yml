subsection_id: a
cite: 5.2.5.1(a)
title: 5.2.5.1(a)
text: a) Caso não seja possível identificar as horas voadas desde a última intervenção de
  manutenção até a ocorrência, o operador deverá calcular as horas de voo realizadas no período
  com base na média do histórico de horas voadas diárias dos últimos 12 meses que precedem
  ao último registro citado. Nesse caso, a cópia do Diário de Bordo reconstituído deverá ser
  encaminhada à ANAC para aprovação juntamente com cópia dos documentos que subsidiaram a
  tarefa de reconstituição. Deverá ser aberto no SEI um processo específico do tipo “Parecer
  Técnico” e nele incluídos cópia do Diário de Bordo reconstituído, cópias dos documentos
  que subsidiaram a tarefa e carta solicitando a aprovação da ANAC.
