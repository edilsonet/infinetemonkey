section_id: 5.2.5.1
section_title: Caso não seja o volume do Diário de Bordo em utilização corrente, proceder-se-á
  conforme segue.
subsection_id: b
cite: 5.2.5.1(b)
title: 5.2.5.1(b)
text: 'b) O operador (com auxílio de uma OM, se necessário) deverá verificar se o programa
  de manutenção da aeronave, motor, hélice e acessórios estão em dia, e se não há vencimentos
  de inspeções e itens controlados por TBO ou TLV, devendo registrar essa verificação nas
  Cadernetas de Célula, Motor e Hélice, bem como verificar se todas as diretrizes de aeronavegabilidade
  aplicáveis à célula, motor, hélice e acessórios emitidas pela ANAC e pelo Estado de projeto
  estão cumpridas e apropriadamente registradas.

  NOTA 1 - Eventual roubo ou extravio do volume do Diário de Bordo e Cadernetas de Célula,
  Motor e Hélice em utilização corrente ensejará na suspensão cautelar do Certificado de Aeronavegabilidade
  da aeronave por situação técnica irregular até a regularização dos registros correlatos,
  sendo de responsabilidade do operador não permitir o voo da aeronave enquanto perdurar essa
  situação.

  NOTA 2 - O RBAC nº 39 estabelece que as Diretrizes de Aeronavegabilidade emitidas pela autoridade
  de aviação civil do Estado de Projeto do produto são consideradas como Diretrizes de Aeronavegabilidade
  Brasileiras e, desta forma, são também de cumprimento obrigatório para todos os produtos
  aeronáuticos.'
