text: '5.2.5.1 (d) e (g)

  Incluída orientação para complementar o processo SEI com os registros das ações realizadas
  e carta solicitando à ANAC orientações adicionais para continuidade do processo de reconstituição
  do Diários de Bordo.

  5.2.6.1(b)

  Incluída orientação para abertura do processo SEI com com informações sobre o roubo ou extravio
  do Diário de Bordo para envio à ANAC.'
