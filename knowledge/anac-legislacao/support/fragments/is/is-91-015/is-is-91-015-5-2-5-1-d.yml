section_title: Caso não seja o volume do Diário de Bordo em utilização corrente, proceder-se-á
  conforme segue.
subsection_id: d
cite: 5.2.5.1(d)
title: 5.2.5.1(d)
text: d) Nesse caso, a reconstiuição do Diário de Bordo poderá ser realizada com base nos
  registros constantes das Cadernetas de Célula, Motor e Hélice, demais registros primários
  de manutenção em posse do operador e Cadernetas Individuais de Voo. Se esses registros não
  forem suficientes para a reconstituição do volume extraviado do Diário de Bordo, siga as
  orientações do item g) abaixo.
