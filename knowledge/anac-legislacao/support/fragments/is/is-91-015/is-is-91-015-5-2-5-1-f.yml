subsection_id: f
cite: 5.2.5.1(f)
title: 5.2.5.1(f)
text: f) Os profissionais que podem supervisionar os trabalhos de reconstituição de Diário
  de Bordo são aqueles previstos no §5º do Art. 47 da Portaria nº 2.050/SPO/SAR ou §5º do
  Art. 52 da Portaria n° 3.220/SPO/SAR. Esses profissionais devem assinar o termo de abertura
  e rubricar todas as páginas reconstituídas do Diário de Bordo.
