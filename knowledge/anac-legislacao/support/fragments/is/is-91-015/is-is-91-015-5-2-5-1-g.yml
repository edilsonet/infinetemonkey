title: 5.2.5.1(g)
text: 'g) Na impossibilidade de reconstituição do Diário de Bordo, o operador deverá comunicar
  o fato à ANAC que estabelecerá as ações necessárias para que possa ser demonstrada a condição
  aeronavegável da aeronave e seus componentes, o que poderá ser feito via documental ou por
  meio de Vistoria Técnica Especial (VTE). Neste caso, deverão ser incluídos no processo SEI
  os registros das ações realizadas e carta solicitando à ANAC orientações para continuidade
  do processo de reconstituição do Diários de Bordo.

