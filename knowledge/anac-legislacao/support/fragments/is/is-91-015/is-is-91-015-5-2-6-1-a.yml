section_title: 'Para regularizar a situação, proceder-se-á conforme segue:'
subsection_id: a
cite: 5.2.6.1(a)
title: 5.2.6.1(a)
text: a) Imediatamente à ocorrência do fato, o operador deverá comunicar o ocorrido ao órgão
  policial competente (Polícia Civil ou Federal), para fins de apuração de responsabilidades,
  devendo o termo circunstanciado da ocorrência, ou boletim de ocorrência ficar à disposição
  da fiscalização por pelo menos 5 (cinco) anos.
