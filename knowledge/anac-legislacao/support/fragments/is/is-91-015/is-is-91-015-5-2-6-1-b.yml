text: b) Deverá ser aberto no SEI um processo específico do tipo (“Parecer Técnico”), comunicando
  o roubo ou extravio das Cadernetas e encaminhada à ANAC cópia do termo circunstanciado da
  ocorrência ou boletim de ocorrência em até 5 (cinco) dias após o ocorrido.
