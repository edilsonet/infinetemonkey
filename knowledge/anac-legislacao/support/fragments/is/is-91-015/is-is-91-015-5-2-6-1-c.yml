section_title: 'Para regularizar a situação, proceder-se-á conforme segue:'
subsection_id: c
cite: 5.2.6.1(c)
title: 5.2.6.1(c)
text: c) O operador deverá proceder imediatamente à reconstituição das Cadernetas com base
  nos Diários de Bordo, Cadernetas Individuais de Voo, registros de manutenção e ordens de
  serviços emitidas por organizações de manutenção. As organizações de manutenção são requeridas
  pelo parágrafo 145.219(c) do RBAC nº 145 a manter todos os registros de serviços de manutenção
  realizados por, no mínimo, 5 (cinco) anos.
