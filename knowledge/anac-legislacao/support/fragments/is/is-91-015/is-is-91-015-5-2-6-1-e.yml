text: e) Os profissionais que podem supervisionar os trabalhos de reconstituição de Cadernetas
  de Celula, Motor e Hélice são aqueles previstos no item 5.4 da IS nº 43.9-003. Esses profissionais
  devem assinar o termo de abertura e rubricar todas as páginas reconstituídas das Cadernetas.
