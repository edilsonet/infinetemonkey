section_title: 'Para regularizar a situação, proceder-se-á conforme segue:'
subsection_id: f
cite: 5.2.6.1(f)
title: 5.2.6.1(f)
text: 'f) Caso os registros de manutenção disponíveis não sejam suficientes para a reconstituição
  das cadernetas e comprovação da condição aeronavegável da aeronave, motor, hélice e acessórios,
  a ANAC poderá determinar que tais artigos sejam submetidos à maior e mais abrangente inspeção
  prevista no programa de manutenção do fabricante, cumprir todas as diretrizes de aeronavegabilidade
  aplicáveis emitidas pela ANAC e pelo Estado de projeto para a célula, motor, hélice e acessórios,
  realizar a revisão geral de todos os artigos controlados por TBO e substituir todos os itens
  controlados por TLV.

  NOTA 1 - O RBAC nº 39 estabelece que as Diretrizes de Aeronavegabilidade emitidas pela autoridade
  de aviação civil do Estado de Projeto do produto são consideradas como Diretrizes de Aeronavegabilidade
  Brasileiras e, desta forma, são também de cumprimento obrigatório para todos os produtos
  aeronáuticos.'
