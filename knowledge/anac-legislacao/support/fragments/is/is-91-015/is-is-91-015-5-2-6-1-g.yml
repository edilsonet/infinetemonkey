section_title: 'Para regularizar a situação, proceder-se-á conforme segue:'
subsection_id: g
cite: 5.2.6.1(g)
title: 5.2.6.1(g)
text: g) Adicionalmente, deverão ser realizadas inspeções específicas na aeronave e seus componentes,
  por pessoa autorizada conforme RBAC nº 43, de modo a determinar a existência de possíveis
  comprometimentos da aeronavegabilidade em virtude de acidentes/incidentes, pouso brusco,
  incêndio, corrosão, imersão e outras situações aplicáveis ao modelo, conforme orientação
  do fabricante, devendo ser observados, inclusive, os critérios de preservação nos períodos
  de inatividade, bem como o cumprimento das instruções de aeronavegabilidade provenientes
  de grandes alterações e grandes reparos, se aplicável.
