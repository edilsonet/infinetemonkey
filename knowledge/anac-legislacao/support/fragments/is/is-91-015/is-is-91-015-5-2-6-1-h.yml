text: h) Após o cumprimento dos itens acima, o operador deverá solicitar uma Vistoria Técnica
  Especial (VTE) à ANAC. Esse tipo de vistoria não poderá ser realizada por Profissional Credenciado
  em Aeronavegabilidade (PCA).
