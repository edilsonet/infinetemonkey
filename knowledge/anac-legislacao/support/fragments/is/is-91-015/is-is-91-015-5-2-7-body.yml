text: '5.2.7 Cadernetas e/ou Diário de Bordo com Informações Inexatas, Adulteradas, Imprecisas
  ou Corrompidas.

  5.2.7.1 De modo a verificar o correto atendimento à Subparte E do RBAC nº 91 ou à Subparte
  J do RBAC nº 135 quanto ao cumprimento com o programa de manutenção da aeronave e seus componentes
  (inspeção, revisão, reparo, conservação e substituição de partes) nos casos em que a aeronave
  tenha operado um número indeterminado de horas, as quais não constam registradas em diário
  de bordo e/ou cadernetas, conforme determina a legislação vigente, será aplicado o disposto
  nos itens 5.2.2 ou 5.2.3 desta IS, conforme aplicável, sem prejuízo de outras ações administrativas
  cabíveis.'
