text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.3 O meio ou procedimento alternativo mencionado no item anterior deve garantir nível de
  segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo
  do procedimento normalizado em IS.

  3.4 A IS não pode criar novos requisitos ou contrariar requisitos estabelecidos em RBAC
  ou outro ato normativo.

  3.5 As seções 91.417 do RBAC nº 91, 135.439 do RBAC nº 135 e 121.380 do RBAC nº 121 estabelecem
  requisitos para registros de manutenção e sua conservação.

  3.6 O artigo 8º, §2º da Resolução nº 457, de 20 de dezembro de 2017, estabelece que eventual
  perda ou corrupção dos registros do Diário de Bordo ensejará suspensão cautelar do Certificado
  de Aeronavegabilidade da aeronave, até a regularização dos registros correlatos.

  3.7 O artigo 47 da Portaria nº 2.050/SPO/SAR, de 29 de junho de 2018, e o artigo 52 da Portaria
  nº 3.220/SPO/SAR, de 15 de outubro de 2019, estabelecem que, no caso de roubo, perda ou
  extravio do Diário de Bordo, ou de volume(s), o operador da aeronave deve, imediatamente
  à ocorrência do fato, comunicar o ocorrido ao órgão policial estadual (Polícia Civil) ou
  federal (Polícia Federal), para fins de apuração de responsabilidades. Havendo impossibilidade
  de reconstituição do Diário de Bordo, o operador da aeronave deverá comunicar o fato à ANAC,
  que poderá estabelecer, por intermédio da área responsável, quais ações serão necessárias
  para fins de demonstrar a condição aeronavegável da aeronave.'
