title: Objetivo
text: 'Objetivo

  1.1 Esta Instrução Suplementar estabelece os procedimentos e orientações acerca do processo
  de reconstituição de Diários de Bordo e Cadernetas de célula, motor e hélice das aeronaves
  civis brasileiras em virtude de dados corrompidos, roubo, perda ou extravio, de modo a permitir
  a restauração da condição aeronavegável das aeronaves que se encontrem nessa condição.'
