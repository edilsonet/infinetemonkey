title: OBJETIVO
text: '1. OBJETIVO

  Esta IS apresenta aos operadores de aeronave certificados segundo o RBAC nº 121 um

  método para expandir a utilização de dispositivos eletrônicos portáteis (PEDs) durante

  as várias fases de voo.'
