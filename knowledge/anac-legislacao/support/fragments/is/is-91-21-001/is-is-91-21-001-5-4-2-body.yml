title: O operador que pretende receber aceitação da ANAC para uso expandido dos PEDs
text: '5.4.2 O operador que pretende receber aceitação da ANAC para uso expandido dos PEDs

  deve encaminhar, por meio do FOP 107 (contido na IS no 119-001), os documentos que

  demonstrem o cumprimento das instruções estabelecidas nesta IS à Superintendência de

  Padrões Operacionais - ANAC.'
