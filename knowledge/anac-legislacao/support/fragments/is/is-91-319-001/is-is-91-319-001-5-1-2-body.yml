title: Adicionalmente, temos que as aeronaves experimentais, de forma temporária ou
text: '5.1.2 Adicionalmente, temos que as aeronaves experimentais, de forma temporária ou

  permanente, não demonstraram atender requisitos técnicos relativos à aeronavegabilidade
  e

  segurança de voo. Por si só, isso não significa que sejam aeronaves intrinsecamente

  inseguras, mas sim que sua segurança de voo não foi atestada contra padrões

  internacionalmente aceitos - que evoluem continuamente - e não foi avaliada por uma

  autoridade certificadora independente.'
