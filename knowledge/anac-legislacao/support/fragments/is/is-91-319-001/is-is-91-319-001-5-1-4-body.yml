title: Uma dessas limitações, aplicável a todas aeronaves experimentais, é expressa no parágrafo
text: '5.1.4 Uma dessas limitações, aplicável a todas aeronaves experimentais, é expressa
  no parágrafo

  91.319(c) do RBAC nº 91, que estabelece que “somente é permitido operar uma aeronave

  com CAVE sobre áreas densamente povoadas se tal operação for autorizada pela ANAC e

  em conformidade com as regras do DECEA”.'
