title: A aplicabilidade desta IS se limita às aeronaves nacionais operando sobre o território
text: '5.2.3 A aplicabilidade desta IS se limita às aeronaves nacionais operando sobre o território

  brasileiro. Em caso de operação em território estrangeiro, os operadores devem adequar-se

  às determinações do Estado sob jurisdição.Data de emissão: 11 de junho de 2021 IS nº 91.319-001'
