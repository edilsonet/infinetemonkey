text: '5.3.6 A responsabilidade primária pela operação segura da aeronave é do operador e
  ele deve

  abster-se de operar sobre áreas densamente povoadas, mesmo que formalmente ele esteja

  adimplente com esta IS, caso suspeite que alguma condição de segurança esteja deteriorada.

  5.4 Classificação dos aeródromos quanto à sua situação'
