text: '5.4.1.1 Aeródromos LIVRES: são todos os aeródromos para cujo acesso não é necessário
  o

  sobrevoo de áreas densamente povoadas. Aeródromos cercados por edificações distribuídas

  de forma esparsa em seu entorno, com baixa densidade populacional, admitindo-se, ainda,

  pequeno conjunto concentrado de edificações em parte reduzida do entorno, desde que não

  estejam no prolongamento das pistas utilizadas, são considerados aeródromos LIVRES.'
