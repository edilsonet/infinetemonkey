title: 'Aeródromos RESTRITOS: são todos os aeródromos próximos ou inseridos em áreas'
text: '5.4.1.2 Aeródromos RESTRITOS: são todos os aeródromos próximos ou inseridos em áreas

  urbanas onde, para as operações ocorrerem, considerando o procedimento previsto, haverá

  necessidade de sobrevoo ao longo de trajetória de até 1,5 NM sobre área densamente

  povoada. Também se incluem nesta categoria os aeródromos localizados na Amazônia Legal

  não classificados como LIVRES.Data de emissão: 11 de junho de 2021 IS nº 91.319-001'
