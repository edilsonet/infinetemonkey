title: A ANAC considera que um operador possui autorização especial para operação em
text: '5.5.2 A ANAC considera que um operador possui autorização especial para operação em

  aeródromo RESTRITO quando ele cumpre com o disposto nesta IS e possui o Formulário

  de que trata a seção 5.7 emitido pelo ente qualificado.'
