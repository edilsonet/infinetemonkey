title: Caso a aeronave venha a ficar inadimplente em algum dos critérios, a autorização especial
text: '5.5.5 Caso a aeronave venha a ficar inadimplente em algum dos critérios, a autorização
  especial

  perde imediatamente a validade e a aeronave não poderá operar em aeródromo RESTRITO

  até que se torne novamente adimplente.

  5.6 Critérios de aeronavegabilidade para concessão da autorização especial para operar

  em aeródromo RESTRITO

  São critérios afetos a aeronavegabilidade para concessão e manutenção da autorização

  especial sob esta IS:'
