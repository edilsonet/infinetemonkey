title: Alterações e grandes reparos implementados na aeronave precisam estar aprovados por
text: '5.6.10 Alterações e grandes reparos implementados na aeronave precisam estar aprovados
  por

  engenheiro aeronáutico e executados por um ente qualificado - verificável mediante inspeção

  do manual de voo, manual de manutenção, inspeção da aeronave, inspeção das cadernetas,

  do diário de bordo, das notas e/ou ordens de serviço, das evidências de notificação e

  entrevista com o proprietário ou operador da aeronave.'
