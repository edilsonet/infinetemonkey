title: A aeronave submetida a uma grande alteração ou grande reparo perde a autorização
text: '5.6.11 A aeronave submetida a uma grande alteração ou grande reparo perde a autorização

  eventualmente existente, e deve ser novamente submetida aos procedimentos previstos nesta

  IS para obter nova autorização especial, conforme previsto no item 5.5.'
