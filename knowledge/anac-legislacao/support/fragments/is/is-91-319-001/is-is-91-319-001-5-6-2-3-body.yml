text: '5.6.2.3 Na hipótese de a aeronave ter sido submetida a uma grande alteração ou a um
  grande reparo,

  conforme definidos no parágrafo 01.1 do RBAC n° 01 e no Apêndice A do RBAC n° 43,

  não são consideradas as horas de voo anteriores a essa grande alteração ou grande reparo.'
