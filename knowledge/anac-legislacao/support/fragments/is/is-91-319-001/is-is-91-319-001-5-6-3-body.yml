text: '5.6.3 Estar adimplente com todas as diretrizes de aeronavegabilidade aplicáveis - pertinente
  a

  todos os componentes certificados da aeronave, seja motor ou hélice, bem como a aviônicos

  ou outro equipamento. Verificável mediante mapa de diretrizes de aeronavegabilidade - DA,

  registro em diário de bordo, registro em caderneta, e/ou inspeção na aeronave, etc.'
