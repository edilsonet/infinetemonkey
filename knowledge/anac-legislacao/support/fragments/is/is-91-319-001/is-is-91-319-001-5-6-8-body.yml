title: Proceder a todas as manutenções somente por meio de entes qualificados - verificável
text: '5.6.8 Proceder a todas as manutenções somente por meio de entes qualificados - verificável

  mediante inspeção das cadernetas, do diário de bordo, dos mapas de DA, das notas e/ou

  ordens de serviço e da verificação da devida qualificação das pessoas envolvidas nesses

  procedimentos.'
