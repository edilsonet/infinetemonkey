title: O processo de emissão do relatório e Formulário para obtenção e renovação da autorização
text: '5.7.1 O processo de emissão do relatório e Formulário para obtenção e renovação da
  autorização

  especial para operar em aeródromos restritos deve ser conduzido por um ente qualificado,

  definido no item 4.3 desta IS. Esta pessoa será responsável por verificar a atual situação
  da

  aeronave e o atendimento a cada um dos critérios de aeronavegabilidade descritos em 5.6,

  bem como por avaliar o cumprimento com outros requisitos obrigatórios.'
