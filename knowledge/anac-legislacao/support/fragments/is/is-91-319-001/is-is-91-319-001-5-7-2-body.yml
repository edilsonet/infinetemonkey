title: Para cada aeronave que aprove, o ente qualificado deverá produzir relatório próprio
text: '5.7.2 Para cada aeronave que aprove, o ente qualificado deverá produzir relatório próprio

  registrando ali as suas verificações, observações e anotações sobre a aeronave inspecionada,

  bem como sobre a documentação verificada durante a inspeção. Tal relatório deverá conter,

  ainda, a data de sua emissão, a matrícula da aeronave, a data da inspeção, a identificação
  e

  assinaturas do ente qualificado (profissional responsável pela emissão do relatório) e do

  operador da aeronave.'
