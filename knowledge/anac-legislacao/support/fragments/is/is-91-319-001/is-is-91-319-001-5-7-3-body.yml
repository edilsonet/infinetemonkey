title: O relatório emitido pelo ente qualificado poderá ser requerido pela ANAC para fiscalização,
text: '5.7.3 O relatório emitido pelo ente qualificado poderá ser requerido pela ANAC para
  fiscalização,

  constituindo garantia de que o trabalho foi adequadamente realizado. Convém, por isso

  mesmo, conter o nível de detalhes julgado apropriado. O ente qualificado deve reter o

  relatório por no mínimo 5 (cinco) anos após sua emissão.'
