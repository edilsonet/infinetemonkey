title: Tendo sido atendidos todos os critérios, o ente qualificado deverá preencher o Formulário
text: '5.7.4 Tendo sido atendidos todos os critérios, o ente qualificado deverá preencher
  o Formulário

  (F-319) e entregar uma cópia ao operador da aeronave, o qual deverá mantê-lo a bordo e

  disponibilizá-lo para a fiscalização sempre que requerido.'
