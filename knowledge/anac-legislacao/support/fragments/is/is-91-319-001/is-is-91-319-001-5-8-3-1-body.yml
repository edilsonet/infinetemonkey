text: '5.8.3.1 Um piloto que não cumpra com esse critério poderá decolar de um aeródromo localizado
  em

  área densamente povoada com o único fim de trasladar a aeronave para um aeródromo livre.

  Para isso, ele deve cumprir as demais condições desta IS, as regras gerais para a operação
  -

  em especial a da experiência recente, requerida pelo RBAC nº 61 -, e garantir que a operação

  seja feita de modo seguro.'
