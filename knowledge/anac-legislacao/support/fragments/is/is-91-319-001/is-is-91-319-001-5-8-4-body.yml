title: Para operação nos aeródromos restritos, o piloto da aeronave deve, durante o planejamento
text: '5.8.4 Para operação nos aeródromos restritos, o piloto da aeronave deve, durante o
  planejamento

  do voo, identificar o setor (ou setores) por onde seu afastamento após a decolagem ou sua

  aproximação até o ingresso no circuito de tráfego ocorram de forma a minimizar o voo sobre

  a região urbana, porém sem descumprir as cartas de aproximação (se existirem) ou

  determinações específicas do órgão de controle de tráfego aéreo, e sempre utilizando as

  direções e pistas mais favoráveis ao pouso ou à decolagem. Para esta avaliação, pode-se

  utilizar das cartas de navegação visual (CAP, CNAV) ou mesmo de mapas digitais e imagens

  de satélite disponibilizados pela internet.'
