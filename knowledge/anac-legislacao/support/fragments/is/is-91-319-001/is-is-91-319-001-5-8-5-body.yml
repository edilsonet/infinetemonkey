title: Na operação de qualquer aeronave, mas especialmente nas monomotoras, o piloto deve
  estar
text: '5.8.5 Na operação de qualquer aeronave, mas especialmente nas monomotoras, o piloto
  deve estar

  preparado para enfrentar uma pane de motor, evento este que ainda pode levar à perda de

  controle em voo. Ambas as situações respondem por metade dos acidentes e são

  especialmente perigosas nas operações de pouso e decolagem, quando se está voando baixo

  e lento. Todo piloto deve conhecer a velocidade de melhor planeio, a razão de planeio, as

  velocidades mínimas de segurança e deve estar proficiente nos procedimentos de emergência

  descritos no manual de voo de sua aeronave, para estar preparado para lidar com essas

  situações. É responsabilidade do piloto buscar se manter dentro do cone de segurança de

  alguma região que possa servir a um pouso de emergência em um voo planado, sem oferecer

  risco às pessoas e bens no solo.'
