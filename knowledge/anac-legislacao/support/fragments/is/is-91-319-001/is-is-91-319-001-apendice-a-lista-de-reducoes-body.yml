title: Apêndice A - Lista de Reduções
text: 'Apêndice A - Lista de Reduções

  7 DISPOSIÇÕES FINAIS

  7.1 O ente qualificado é responsável pelo relatório e formulário que assina e poderá ser

  responsabilizado caso sejam constatados erros ou omissões que repercutam na segurança

  operacional. Em caso de dúvidas, o ente qualificado deve abster-se de declarar que a

  aeronave se encontra em condições seguras de operação em aeródromos restritos.

  7.2 O operador é responsável, civil e criminalmente, pelos danos decorrentes das operações

  realizadas em sobrevoo de áreas densamente povoadas e deve abster-se de realizar o voo

  caso as condições de segurança estejam deterioradas.Data de emissão: 11 de junho de 2021
  IS nº 91.319-001

  7.3 Na contratação de cobertura de seguro de responsabilidade civil, a possibilidade de
  sobrevoo

  sobre área densamente povoada deve ser comunicada, pelo operador, à companhia

  seguradora.

  7.4 Esta Instrução Suplementar poderá ser revisada com base em dados de sua implementação
  e

  informações recebidas.

  7.5 Os casos omissos serão dirimidos pela ANAC.Data de emissão: 11 de junho de 2021 IS nº
  91.319-001

  APÊNDICE A - LISTA DE REDUÇÕES

  A.1 SIGLAS'
