text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº 91.319-001

  Revisão A

  Aprovação: Portaria nº 5.176/SAR/SPO, de 10 de junho de 2021.

  Assunto: Sobrevoo de área densamente povoada por aeronave

  experimental

  1 OBJETIVO

  1.1 Esclarecer as condições em que o sobrevoo de área densamente povoada por aeronave

  experimental é autorizado pela ANAC.

  2 REVOGAÇÃO - N/A

  3 FUNDAMENTOS

  3.1 A Lei 11.182, de 27 de setembro de 2005, definiu, por meio do seu art. 5º, que a ANAC
  é

  autoridade de aviação civil e tem competência para expedir os certificados de

  aeronavegabilidade conforme estabelece ainda o art. 8º, inciso XXXI da mesma lei. O seu

  art. 8º, inciso XLVI, estabelece a competência da ANAC em editar e dar publicidade às

  instruções e regulamentos necessários para a aplicação da referida lei.

  3.2 O Regulamento Brasileiro da Aviação Civil nº 91 - RBAC 91, em seu parágrafo 91.319(c),

  estabelece que somente é permitido operar uma aeronave com CAVE sobre áreas

  densamente povoadas se tal operação for autorizada pela ANAC.

  3.3 A Resolução nº 30, de 21 de maio de 2008, em seu Art. 14, estabelece que a ANAC pode

  emitir IS para esclarecer, detalhar e orientar a aplicação de requisito existente em RBAC.

  3.4 Esta IS detalha a aplicação do parágrafo 91.319(c) do RBAC 91 e esclarece as condições
  em

  que o sobrevoo de área densamente povoada por aeronave experimental é autorizado pela

  ANAC.

  4 DEFINIÇÕES

  4.1 Certificado de Autorização de Voo (CAV): certificado de aeronavegabilidade especial
  que

  era emitido para aeronaves experimentais de construção amadora, dentre outras. Deixou de

  ser emitido em 2018, sendo substituído pelo certificado de autorização de voo experimental

  (CAVE). Para os efeitos desta IS, o CAV equivale ao CAVE.

  4.2 Certificado de Autorização de Voo Experimental (CAVE): certificado de

  aeronavegabilidade especial emitido para aeronaves experimentais.

  4.3 Ente qualificado: no contexto desta IS, compreende:Data de emissão: 11 de junho de 2021
  IS nº 91.319-001'
