text: 'b) This section must contain a legible statement in a prominent location that reads:
  “The Airworthiness Limitations section is FAA approved and specifies maintenance required
  under §§43.16 and 91.403 of Title 14 of the Code of Federal Regulations unless an alternative
  program has been FAA approved.”'
