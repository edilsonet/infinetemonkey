title: apendice-b-extrato-das-ica-para-motores-rbac-no-33(f)
text: f) Scheduling information for each part of the engine that provides the recommended
  periods at which it should be cleaned, inspected, adjusted, tested, and lubricated, and
  the degree of inspection the applicable wear tolerances, and work recommended at these periods.
  However, the applicant may refer to an accessory, instrument, or equipment manufacturer
  as the source of this information if the applicant shows that the item has an exceptionally
  high degree of complexity requiring specialized maintenance techniques, test equipment,
  or expertise. The recommended overhaul periods and necessary cross references to the Airworthiness
  Limitations section of the manual must also be included. In addition, the applicant must
  include an inspection program that includes the frequency and extent of the inspections
  necessary to provide for the continued airworthiness of the engine.
