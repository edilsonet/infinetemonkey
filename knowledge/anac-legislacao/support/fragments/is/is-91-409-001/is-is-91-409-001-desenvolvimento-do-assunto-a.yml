title: desenvolvimento-do-assunto(a)
text: a) parágrafo 91.403(c) do RBAC nº 91 estabelece que “somente é permitido operar uma
  aeronave que possua um manual de manutenção do fabricante ou instruções para aeronavegabilidade
  continuada contendo uma seção de limitações de aeronavegabilidade se os tempos para substituição
  de componentes, os intervalos de inspeção e os procedimentos específicos contidos naquela
  seção forem cumpridos. Alternativamente, podem ser utilizados os intervalos de inspeção
  e os procedimentos estabelecidos nas especificações operativas emitidas segundo os regulamentos
  operacionais de operadores certificados segundo o RBAC nº 119, ou estabelecidos em um programa
  de inspeções aprovado segundo o parágrafo 91.409(e) deste Regulamento”;
