text: 'e) parágrafos 135.421(a) e 135.421(b) do RBAC nº 135 estabelecem que: “o detentor de
  certificado que opera uma aeronave com certificação de tipo para uma configuração para passageiros,
  excluído qualquer assento de pilotos, com 9 assentos ou menos deve cumprir com o programa
  de manutenção recomendado pelos fabricantes, ou com um programa aprovado pela Anac para
  cada motor, hélice, rotor, componentes e para cada item de equipamento de emergência requerido
  por este Regulamento”; e “para o propósito desta seção, um programa de manutenção do fabricante
  é aquele contido no manual de manutenção ou nas instruções de manutenção especificadas pelo
  fabricante, como requerido pelos RBAC, para a aeronave, motores, hélices, rotores, componentes
  e equipamentos de emergência”.

  Diretrizes da Aeronavegabilidade e regulamentos operacionais também podem impor instruções
  de aeronavegabilidade continuada mandatórias.

  Os períodos ou prazos de TBO geralmente estão transcritos em Boletins de Serviço (Service
  Bulletins - SB), Cartas de Serviço (Service Letters - SL), Cartas de Informação (Service
  Information Letters - SIL) e documentos semelhantes. Mesmo se os fabricantes indicarem os
  períodos ou prazos de TBO como mandatórios nesses documentos, estes são considerados mandatórios
  apenas quando aprovados pela autoridade aeronáutica. Os quadros abaixo representam, por
  exemplo, a recomendação da Lycoming e da Continental engines para motores convencionais,
  via SIL, e a recomendação da Pratt & Whitney Canada para motores a turbina, via SIL e SB:

