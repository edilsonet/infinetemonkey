text: 'f) Maintenance Review Board Report - APPENDIX A - AIRWORTHINESS LIMITATIONS - (AL)
  - 1. General - This appendix contains all the Airworthiness Limitation - AL applicable for
  the EMB-XXX and EMB-YYY aircraft (commercially known as EMBRAER XXX and YYY, respectively)
  and all their versions. The Airworthiness Limitations are divided in the 4 parts of this
  appendix, as follows:

  • PART 1 - CERTIFICATION MAINTENANCE REQUIREMENTS (MRBR APPENDIX A PART 1)

  • PART 2 - AIRWORTHINESS LIMITATION INSPECTIONS (MRBR APPENDIX A PART 2) - STRUCTURES

  • PART 3 - FUEL SYSTEM LIMITATION ITEMS (MRBR APPENDIX A PART 3)

  • PART 4 - LIFE-LIMITED ITEMS (MRBR APPENDIX A PART 4)

  This Airworthiness Limitations Appendix is ANAC, FAA, TCCA and EASA approved and Specifies
  maintenance required under §§ 43.16 and 91.403 of the Regulamento Brasileiro da Aviação
  Civil, and/or Federal Aviation Regulations, and/or EASA CS25, and/or, TCCA CAR525 as applicable,
  unless an alternative program has been ANAC and/or FAA and/or EASA and/or TCCA approved.

  Nota: estes exemplos não representam uma lista exaustiva.

  O RBAC nº 91 não apresenta regras específicas para o cumprimento dos tempos (intervalos)
  recomendados entre as revisões gerais para os proprietários/operadores de aeronaves operando
  segundo as regras do RBAC nº 91 que se enquadram no parágrafo 91.409(i). Esta IS apresenta
  as orientações que devem ser atendidas por esses operadores. O cumprimento dos intervalos
  de revisão geral é mandatório quando estiver especificado nas limitações de aeronavegabilidade
  conforme o parágrafo 91.403(c) do RBAC nº 91.

  Requisitos para tempo de vida limite e/ou tempo recomendado entre as revisões gerais:'
