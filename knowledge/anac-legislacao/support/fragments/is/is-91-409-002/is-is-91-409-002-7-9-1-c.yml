id: is-is-91-409-002-7-9-1-c
kind: is
document: is-91-409-002
family: '91'
section_id: 7.9.1
section_title: 'Cada operador deve seguir os intervalos de monitoramento presentes nessa IS
  conforme estabelecido abaixo:'
subsection_id: c
cite: 7.9.1(c)
title: 7.9.1(c)
text: 'c) a cada preenchimento dos apêndices C ou D: preenchimento de rastreamento de amostra
  de dados conforme Apêndice E.

  NOTA: são aceitáveis os monitoramentos específicos recomendados pelos fabricantes da aeronave/motor
  e nos intervalos por eles propostos, ou aqueles com STC específicos para esse propósito,
  desde que validados no Brasil, ou de outra forma aprovados pela ANAC.

  7.9.2 Exceto em casos de monitoramentos específicos, conforme citado na NOTA acima, o operador,
  sempre que julgar necessário por eventos, anomalias ou discrepâncias identificadas na aeronave,
  deve realizar o preenchimento dos Apêndices acima mencionados, bem como realizar toda e
  qualquer ação necessária para o reestabelecimento da aeronave às condições de projeto.

  7.9.3 É desejável que sejam realizados monitoramentos em intervalos inferiores aos propostos
  sempre que haja ação de manutenção significativa no(s) motor(es) da aeronave ou troca deste
  componente.'
