text: 'APÊNDICE B - LISTA DE REDUÇÕES


  A1. SIGLAS

  ANAC - Agência Nacional de Aviação Civil

  AVGAS - Gasolina de Aviação

  CHT - Cylinder Head Temperature

  EGT - Exhaust Gas Temperature

  FAR - Federal Aviation Regulations

  QAV - Querosene de Aviação

  PSI - Pound-force per Square Inch

  RASO - Relatório Anual de Segurança Operacional

  SPO - Superintendência de Padrões Operacionais

  STC - Supplemental Type Certificate (Certificado Suplementar de Tipo)

  RBAC - Regulamento Brasileiro da Aviação Civil

  RPM - Rotações por Minuto

  TBO - Time Between Overhaul'
