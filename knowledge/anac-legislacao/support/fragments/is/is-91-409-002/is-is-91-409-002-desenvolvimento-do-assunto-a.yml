title: desenvolvimento-do-assunto(a)
text: a) a primeira é a condensação (processo no qual a umidade presente no ar quente se transforma
  em água líquida). Quando ocorre uma diferença de temperatura entre as paredes do tanque
  de combustível e o ar no tanque, gotículas de água se formarão na parte superior interna
  das paredes do tanque de combustível e serão drenadas para o combustível. Os efeitos da
  condensação podem ser reduzidos mantendo os tanques de combustível cheios enquanto a aeronave
  estiver estacionada;
