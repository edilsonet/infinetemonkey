section_title: DESENVOLVIMENTO DO ASSUNTO
subsection_id: c
cite: desenvolvimento-do-assunto(c)
title: desenvolvimento-do-assunto(c)
text: 'c) a terceira maneira pela qual a água chega ao sistema de combustível é quando do
  reabastecimento. A falta de alguns cuidados básicos na hora do reabastecimento, como abastecimento
  sob chuva, manutenção inadequada do caminhão tanque, filtros e separadores de água são algumas
  das principais causas de contaminação do combustível com água.

  6.3.3 Para prevenir a contaminação do combustível durante o abastecimento, o operador deve
  assegurar-se que o pessoal responsável pelo abastecimento tenha recebido o treinamento adequado
  e que todos os equipamentos do sistema de abastecimento como tanques, bombas, filtros etc.
  estejam limpos e sejam verificados periodicamente. Testes de contaminação do combustível
  devem sempre ser solicitados pelo piloto antes do abastecimento quando houver dúvidas acerca
  da qualidade do combustível.

  6.4 Abastecimento incorreto

  6.4.1 Isso ocorre, por exemplo, quando combustível de motor à turbina (Querosene Jet-A1
  ou QAV) é colocado no lugar da gasolina de aviação (AVGAS). Quando o querosene contamina
  o sistema de combustível de uma aeronave com motor a pistão, o impacto geral não é imediatamente
  aparente.

  6.4.2 Dependendo da quantidade de querosene inserido no tanque de combustível da aeronave,
  mesmo uma inspeção minuciosa de uma amostra de combustível nem sempre pode indicar que ocorreu
  um abastecimento incorreto.

  6.4.3 Durante a partida e táxi o funcionamento do motor pode parecer normal porque a AVGAS,
  que ainda está na linha do sistema de combustível e filtros, do último voo, não está contaminada
  e geralmente leva alguns minutos para que esse combustível impróprio, no tanque selecionado,
  chegue ao motor em regime de baixa potência. É por isso que acidentes causados por abastecimento
  incorreto normalmente ocorrem em regime de alta potência, geralmente durante ou logo após
  a decolagem.

  6.4.4 Motores convencionais operando com combustível impróprio (como o querosene) em regime
  de alta potência sofrem detonações, perda rápida de potência e altas temperaturas da cabeça
  de cilindro, seguidas rapidamente de falha completa do motor.

  6.4.5 Mudar para outro tanque de combustível não contaminado o mais rapidamente possível,
  logo após o início da detonação do motor, pode aliviar alguns dos principais sintomas e
  o motor pode desenvolver potência suficiente para que o piloto consiga realizar o pouso
  com segurança.

  6.4.6 Danos internos ao motor que ocorrem nos primeiros 10 a 15 segundos, durante a detonação,
  geralmente são graves o suficiente para exigir a desmontagem, inspeção e até mesmo a revisão
  geral do motor. Em todos os casos, siga as instruções e orientações do fabricante do motor
  se este tiver sido operado com combustível não previsto.

  6.4.7 Um possível abastecimento incorreto pode ser evitado se o piloto supervisionar pessoalmente
  a operação de reabastecimento de sua aeronave. O piloto deve verificar cuidadosamente o
  recibo de abastecimento para confirmar a quantidade e tipo de combustível adicionado. Deve
  verificar também o combustível antes e depois do reabastecimento quanto à claridade, cor
  e presença de água. O piloto e operador devem assegurar que haja próximo aos bocais de abastecimento
  de combustível placares previstos informando o tipo e octanagem do combustível a ser utilizado,
  bem como a capacidade de cada tanque.

  6.4.8 Sugere-se também que os operadores de aeronaves com motores a pistão turboalimentados
  removam os decalques da fuselagem e capô que fazem referência às palavras “Turbo ou Turbo-Charged”.
  Esse tipo de decalque pode passar uma impressão equivocada ao pessoal de abastecimento menos
  experiente, levando a acreditar se tratar de um motor à turbina.

  6.5 Tanque de combustível - célula de borracha

  6.5.1 As células de combustível ou bladder tanks são feitas de um material pesado e emborrachado,
  instaladas no interior da asa em cavidades projetadas para suportar esse tipo de tanque
  e presas à parte superior da asa por clipes ou botões de pressão.

  6.5.2 Com o tempo, esses encaixes ou clipes podem falhar e o tanque de combustível colapsar
  sobre si mesmo. Quando isso ocorre e o tanque fica parcialmente recolhido, limita a quantidade
  de combustível no tanque, interfere na ventilação/suprimento, altera a indicação da quantidade
  de combustível e, consequentemente, pode culminar em falha na alimentação do motor.

  6.5.3 Os mecânicos devem inspecionar todas as células de combustível quanto ao estado geral
  e instalação adequada, conforme o programa de inspeção do fabricante, ou sempre que houver
  suspeita de falha nos clipes/encaixes da célula de combustível.

  6.6 TBO excedido sem monitoramento

  6.6.1 Outra fonte potencial de falha do motor em voo é a operação deste além do tempo entre
  revisão geral (TBO) recomendado pelo fabricante, sem que as adequadas inspeções e monitoramento
  das condições do motor sejam realizados. O Time Between Overhaul (TBO) é calculado pelo
  fabricante do motor e é uma estimativa segura do número de horas em que o motor pode funcionar
  de forma confiável dentro dos parâmetros estabelecidos sem que exceda os limites de desgastes
  de serviço para revisão geral dos principais componentes como: eixo de manivelas, comando
  de válvulas, cilindros, bielas, válvulas e pistões.

  6.6.2 O funcionamento de um motor a pistão além do TBO recomendado pelo fabricante pode
  acelerar o desgaste geral desse motor em virtude de maiores folgas nos mancais, perda de
  materiais de proteção como cementação das engrenagens ou nitretação das paredes do cilindro,
  moentes e munhões do eixo de manivelas e vibração causada por peças móveis e rotativas do
  motor que se desgastaram de forma desigual ficando desbalanceadas.

  6.6.3 Os tempos (intervalos) recomendados entre as revisões gerais (TBO) são geralmente
  identificados em Boletim de Serviço ou Carta de Serviço do fabricante do motor.

  6.6.4 Para operações segundo o RBAC nº 91, o cumprimento com o TBO não é um requisito de
  manutenção obrigatório, caso essa tarefa não esteja prevista nas limitações de aeronavegabilidade,
  diretriz de aeronavegabilidade ou outro documento aprovado. Porém, cabe ao operador avaliar
  e decidir quando a revisão geral (overhaul) do motor será realizada. Para isso, a ANAC recomenda
  a adoção de um programa de monitoramento de tendências que dê suporte à decisão de quando
  realizar a revisão geral.

  6.6.5 É importante destacar que o funcionamento de um motor convencional provoca desgastes
  e em algum momento a revisão geral terá de ser feita. Ela poderá ocorrer dentro do TBO recomendado
  pelo fabricante ou não, mas deverá ser realizada sempre que as condições do motor estiverem
  deterioradas a ponto de requerer uma revisão geral, conforme determina a seção 91.405 do
  RBAC nº 91. Ademais, é preciso que o operador tenha em mente que uma revisão geral do motor
  realizada muito além do tempo recomendado pelo fabricante poderá resultar em maior tempo
  de indisponibilidade da aeronave e maior custo, uma vez que um número maior de peças e componentes
  pode não ser reaproveitado.

  6.6.6 Atenção especial também deverá ser dada nas primeiras horas de operação do motor,
  logo após sua revisão geral ou reconstrução. De modo geral, um motor convencional tem maior
  probabilidade de falha nas primeiras 200 horas após a revisão geral do que nas 200 horas
  após o TBO recomendado.

  6.6.7 Cabe ainda ressaltar que, para motores instalados em aeronaves operando segundo as
  regras do RBAC nº 135, o cumprimento com o TBO é obrigatório por força da seção 135.411
  desse RBAC.

  6.7 Preservação do motor

  6.7.1 Para um motor que esteja funcionado de forma regular, pode se dizer que ele está livre
  da umidade e suas consequências, uma vez que o calor da combustão aquece todo o motor, deixando-o
  livre da umidade. Além disso, o óleo circulando por toda a parte interna do motor forma
  uma camada protetora que inibe o contato da umidade com as partes metálicas.

  6.7.2 Isso já não ocorre com um motor inativo: dependendo de quanto tempo a operação do
  motor for suspensa, ações de manutenção e preservação deverão ser feitas para evitar a ferrugem
  e corrosão de partes do motor como: paredes dos cilindros, engrenagens, ressaltos do eixo
  de comando, bielas etc. A preservação de um motor convencional inativo deve ser feita seguindo
  estritamente as recomendações e orientações do fabricante do motor e da aeronave.

  6.7.3 Importante destacar que o funcionamento de um motor convencional no solo, por breves
  períodos, não substitui os procedimentos de preservação estabelecidos pelo fabricante. Na
  verdade, essa prática de giro do motor no solo tende mais a agravar do que minimizar a possibilidade
  de corrosão, já que uma grande quantidade de ar é aspirada pelos cilindros sem que o motor,
  em muitas das vezes, esteja na temperatura ideal de operação.

  6.7.4 Deve-se evitar girar manualmente as hélices acopladas ao motor, uma vez que esse movimento
  irá fazer com que os pistões percorram seus ciclos dentro dos cilindros sem pressão de óleo,
  prática que irá remover o filme protetor de óleo e aumentará a susceptibilidade à corrosão,
  além de favorecer o atrito entre as partes móveis na próxima partida do motor, em virtude
  da ausência de lubrificação adequada.

  6.8 Técnica operacional deficiente

  6.8.1 A confiabilidade de um motor convencional depende que sua operação seja feita dentro
  de uma estreita faixa de desempenho. Essa faixa de operação possui limites específicos ligados
  a RPM, ajustes de mistura e fluxo de combustível, pressão de admissão, temperatura da cabeça
  do cilindro e pressão e temperatura do óleo, que não podem ser excedidas.

  6.8.2 Todos os motores convencionais são bastante sensíveis à temperatura. Cilindros e válvulas
  podem ser danificados por choque térmico se o motor não for aquecido adequadamente antes
  da aplicação de potência máxima e a cabeça do cilindro pode trincar ou rachar se a temperatura
  do motor esfriar muito rapidamente em longas descidas com potência reduzida.

  6.9 Manutenção

  6.9.1 A manutenção realizada em motores convencionais deve ser da mais alta qualidade e
  executada por pessoal devidamente qualificado, com o ferramental adequado e de acordo com
  as instruções e procedimentos atualizados do fabricante.

  6.9.2 Áreas do motor que têm o maior impacto na confiabilidade e precisam de manutenção
  constante são: trocas de óleo e filtro, substituição de filtros de ar e de combustível,
  inspeção de defletores e vedações do motor quanto à condição e operação, sincronização do
  magneto do motor e condição das velas de ignição e cabos.

  6.9.3 A observação do conteúdo dos filtros de óleo do motor pode revelar muito sobre as
  suas condições. De forma geral, o mecânico deve efetuar minuciosamente a inspeção do elemento
  filtrante ou da tela do filtro quando for proceder a troca de óleo periódica ou quando alguma
  anormalidade for relatada durante a operação da aeronave. Essa inspeção permite coletar
  evidências, por meio da análise dos resíduos (limalhas) depositados nos filtros (cor, tamanho,
  forma, magnetismo), de que alguma parte do motor pode estar com problemas de funcionamento.

  6.9.4 A manutenção do motor pode ser realizada por pessoas inexperientes (como aprendizes)
  desde que sejam supervisionadas por um mecânico certificado. Áreas adicionais do motor que
  requerem constante manutenção são identificadas nas seções seguintes.

  6.9.5 Lubrificação prévia. Antes de operar um motor novo, recém-saído de revisão geral ou
  que esteja há muito tempo em inatividade, observe os procedimentos de pré-lubrificação,
  descritos no respectivo manual de operação, a serem realizados antes da primeira partida
  do motor. Esse procedimento visa assegurar que as partes móveis têm lubrificação suficiente
  para impedir falhas típicas resultantes do atrito indesejado.

  6.9.6 Primer do motor. O primer é um sistema simples no qual o combustível presente na linha
  de alimentação do motor é injetado em dois ou mais cilindros por meio de uma pequena bomba
  operada manualmente. Se a alavanca da bomba de escorva não estiver travada na posição fechada,
  o combustível continuará sendo sugado para os cilindros pela sucção criada durante o ciclo
  de admissão. Nesse caso, o motor funcionará irregularmente em baixas RPM, apresentando sintomas
  idênticos aos problemas de magneto, mas suavizará acima de 1700 RPM.

  6.9.6.1 Em baixa rotação, na boca do escapamento haverá fumaça preta e fuligem e a mistura
  ar/combustível será extremamente rica nos cilindros afetados. Empobrecer a mistura do motor
  manualmente pode suavizar a operação, por outro lado, um excessivo empobrecimento da mistura,
  aumentará a temperatura da cabeça dos cilindros os quais não estão conectados ao sistema
  de primer.

  6.9.6.2 Uma condição de operação semelhante pode existir se os anéis de vedação da bomba
  de escorva estiverem cortados ou rachados, o que permite que o combustível passe pelos anéis
  e entre no cilindro, mesmo que a alavanca da bomba esteja na posição travada. Se houver
  suspeita dessa condição, a aeronave não deverá ser operada até que uma equipe de manutenção
  devidamente certificada avalie e solucione o problema.

  6.9.7 Controles do motor. As manetes de potência, mistura, passo de hélice e aquecimento
  do carburador são mecanismos simples em projetos e construção, são basicamente um fio de
  metal flexível dentro de uma carcaça de aço inoxidável.

  6.9.7.1 Devido à flexibilidade inerente do projeto, se as manetes não forem devidamente
  fixadas pelo menos a cada 12 polegadas, o cabo poderá dobrar ao meio, limitando severamente
  a quantidade de movimento de controle disponível no carburador, injetora ou governador de
  hélice.

  6.9.7.2 Todas as manetes devem ser lubrificadas periodicamente para garantir uma operação
  suave dos controles, e o comprimento do movimento do cabo deve permitir o curso completo
  de modo a atingir os batentes. Os terminais das manetes tipo rótula (rod ends) devem possuir
  arruelas largas em ambas as extremidades do parafuso de fixação para servir como segurança
  adicional em caso de falha da esfera do terminal rotular.

  6.9.8 Choques de hélice. Quaisquer tipos de golpes na hélice são uma situação muito séria
  e que requer atenção imediata. Motores que sofreram choque de hélice devem ser inspecionados
  de acordo com as instruções do fabricante. As batidas de hélices, com parada súbita do motor
  ou não, podem resultar em trincas e rachaduras no eixo de manivelas, danos em engrenagens,
  empeno no flange da hélice e fadiga nos parafusos de biela. Aeronave nessa situação é considerada
  não aeronavegável até que todas as inspeções e serviços necessários sejam realizados por
  entes devidamente certificados.

  6.9.9 Manutenção da hélice. Dos produtos com certificado de tipo, a hélice talvez seja o
  que menos recebe atenção por parte dos operadores e mantenedores; no entanto, esse componente
  do grupo motopropulsor lida com altas cargas de empuxo, torção, flexão e força centrífuga
  durante todo o voo.

  6.9.9.1 Durante a manutenção, o mecânico deve avaliar cuidadosamente as pás quanto a danos,
  mossas, cortes, arranhões etc., conforme necessário, para evitar pontos de fadiga que podem
  causar a falha da hélice e, consequentemente, perda de potência em voo. As mossas nos bordos
  de ataque das pás devem ser eliminadas seguindo estritamente os procedimentos recomendados
  pelo fabricante da hélice.

  6.9.9.2 Cuidado especial deve ser dado ao limar ou lixar as pás da hélice. Caso o serviço
  seja realizado fora dos padrões recomendados pelo fabricante, poderá resultar na alteração
  do formato de aerofólio das pás, levando à perda de eficiência da hélice, sendo necessário
  seu descarte. No caso de uma aeronave bimotor, essa perda de empuxo pode impedir a aeronave
  de manter o voo com um motor inoperante.

  6.9.9.3 Deve-se evitar empurrar ou puxar a aeronave pela hélice durante sua movimentação
  no solo, pois a força aplicada na hélice para mover a aeronave não se espalha ao longo do
  comprimento da hélice, mas concentra-se em uma única área, que pode induzir a um aumento
  de tensão, podendo culminar em trinca ou rachadura em uma das pás.

  6.9.10 Mufla do escapamento. Motores convencionais podem sofrer reduções substanciais de
  potência e até mesmo falha completa quando o defletor interno da mufla se solta e cobre
  parcialmente a saída do escapamento. Indicações desse tipo de problema são: uma grande redução
  de RPM, indicação de mistura rica, funcionamento irregular, vibração e pós-queima. Recomenda-se
  que a inspeção do interior do escapamento seja executada periodicamente, conforme estabelece
  o programa de inspeção do fabricante, ou sempre que houver suspeita de pane nessa área do
  motor.

  6.9.11 Travamento de válvulas. Motores convencionais que apresentam dificuldade na partida
  ou que funcionam irregularmente por 3 a 5 minutos após a partida e depois suavizam, podem
  ter uma ou mais válvulas emperradas. Válvulas emperradas são causadas por depósitos de chumbo
  e carbono na guia da válvula, condição essa que, com o tempo, vai reduzindo a folga entre
  haste da válvula e sua guia.

  6.9.11.1 Essa redução na folga faz com que a válvula trave dentro da guia. Quando ela trava
  na posição fechada, provoca o empeno da haste de comando (push rod), que é expulsa do seu
  alojamento, resultando em vazamento de óleo e perda de potência no cilindro afetado.

  6.9.11.2 Para reparar uma válvula emperrada, o cilindro deve ser removido e a guia de válvula
  mandrilada para remover os depósitos de chumbo e carbono. Dependendo da condição, válvula,
  guia e outros componentes do cilindro deverão ser substituídos.

  6.9.12 Velas de ignição. Velas de ignição que sujam consistentemente podem ser uma indicação
  de anéis de segmento e/ou cilindros desgastados, mistura excessivamente rica, velas com
  faixa de calor inadequado, cabos de ignição muito curtos, plugues de ignição (cigarettes)
  danificados, combustível impróprio, cilindro das velas de ignição sujo ou úmido, magnetos
  fora do ponto, baixa velocidade de operação em marcha lenta, procedimento inadequado de
  empobrecimento da mistura e resfriamento rápido do motor em longas descidas.

  6.9.12.1 Todas as velas de ignição periodicamente devem passar por inspeções, limpeza, ajustes
  do gap (folga entre os eletrodos) e rodízio. Consulte sempre o manual de voo para obter
  os procedimentos aprovados de operação do motor e manual de manutenção para serviços nas
  velas.

  6.9.13 Compressão dos cilindros. O teste de compressão é um procedimento no qual 80 PSI
  de pressão de ar são introduzidos em um cilindro com seu pistão no ponto morto superior,
  de modo a determinar o quanto de mistura ar/combustível será mantida no cilindro quando
  ela for comprimida. O teste é realizado com um testador de pressão diferencial que possui
  dois manômetros, um manômetro mostra a pressão sendo aplicada e o outro mostra a pressão
  mantida no cilindro.

  6.9.13.1 A leitura de compressão ideal no medidor diferencial deve ser de 80/80 PSI com
  o cilindro no ponto morto superior. Perda de pressão poderá ocorrer; no entanto, a perda
  máxima de ar comprimido não deve ser superior a 25%, ou uma leitura de 60/80 PSI. Se a leitura
  da pressão no cilindro for inferior a 75%, ou seja, menor que 60/80 PSI, a menos que haja
  instrução diferente e específica do fabricante do motor, execute os seguintes procedimentos.

  NOTA: teste de compressão, utilizando equipamento que incorpora a ferramenta “orifício mestre”
  como o modelo “E2M” da Eastern Technology, é executado de forma um pouco diferente e com
  valores que não os citados acima. Siga sempre as orientações do fabricante do motor e do
  equipamento sendo utilizado quando realizando teste de compressão de cilindros.'
