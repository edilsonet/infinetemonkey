text: 'b) apresentar meio ou procedimento alternativo devidamente justificado, exigindo-se,
  nesse caso, a análise e concordância expressa do órgão competente da ANAC.

  3.4 O meio ou procedimento alternativo mencionado no item anterior deve garantir nível de
  segurança igual ou superior ao estabelecido pelo requisito aplicável ou concretizar o objetivo
  do procedimento normalizado em IS.

  3.5 A IS não pode criar requisitos ou contrariar requisitos estabelecidos em RBAC ou outro
  ato normativo.'
