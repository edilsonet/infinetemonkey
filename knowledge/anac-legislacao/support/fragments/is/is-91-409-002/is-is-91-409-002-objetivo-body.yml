title: Objetivo
text: 'Objetivo

  1.1 Esta Instrução Suplementar provê aos operadores de aeronaves e pessoal de manutenção
  orientações acerca da prevenção de ocorrências aeronáuticas por falha de motor em voo e
  falha relacionada a combustível, e estabelece os procedimentos para a implementação de um
  programa de monitoramento de tendências de motores convencionais (motores a pistão), ampliando
  assim a confiabilidade e vida útil desses motores.

  NOTA: Os procedimentos de manutenção podem variar de acordo com o manual da aeronave, motor
  e componentes. Portanto, os manuais e publicações técnicas emitidas pelos fabricantes e
  Diretrizes de Aeronavegabilidade emitidas pelas autoridades de aviação civil, aplicáveis
  aos produtos aeronáuticos, devem sempre ser as fontes primárias para a execução dos procedimentos
  de manutenção. O disposto nesta Instrução Suplementar são recomendações e orientações gerais
  de boas práticas.'
