title: Todos os dados técnicos apresentados à GGCP para substanciar a autorização de um projeto
text: '5.3.1 Todos os dados técnicos apresentados à GGCP para substanciar a autorização de
  um projeto

  de RPAS são considerados propriedade do detentor do projeto e, portanto, de caráter

  reservado, não podendo, por esta razão, ser divulgados ou utilizados por terceiros, a não
  ser

  com expressa autorização de seu detentor.

  5.4 Demonstração de cumprimento com os requisitos técnicos'
