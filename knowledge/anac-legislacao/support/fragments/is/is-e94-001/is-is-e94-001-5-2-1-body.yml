cite: 5.2.1
title: A autorização de um projeto de RPAS é um processo que objetiva assegurar que a aeronave
text: '5.2.1 A autorização de um projeto de RPAS é um processo que objetiva assegurar que
  a aeronave

  não tripulada atenda aos requisitos mínimos de aeronavegabilidade aplicáveis. Esta atividade

  envolve responsabilidades tanto daqueles que pretendem receber a autorização como da

  ANAC.'
