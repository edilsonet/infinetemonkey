cite: 5.2.2
title: 'São responsabilidades dos requerentes:'
text: '5.2.2 São responsabilidades dos requerentes:

  Solicitar a abertura de um processo de autorização de projeto de RPAS junto à ANAC,

  conforme estabelecido no apêndice B;

  Submeter à ANAC os documentos técnicos referentes à demonstração de cumprimento dos

  requisitos da Subparte E do RBAC-E 94;

  Apresentar quaisquer esclarecimentos e dados técnicos complementares solicitados pela

  ANAC;

  Realizar as análises e executar todos os ensaios em laboratório, solo e voo, conforme

  aplicável, julgados necessários pela ANAC para a autorização de projeto de RPAS, bem

  como elaborar e apresentar à ANAC os relatórios dos resultados de ensaios (se aplicável);

  Permitir as inspeções pela ANAC, quando necessárias, para determinação da conformidade

  do RPAS com os dados técnicos apresentados, bem como para comprovação do

  cumprimento dos requisitos da Subparte E do RBAC-E 94; e

  Permitir que a ANAC testemunhe ou realize, se aplicáveis, os ensaios em laboratório, solo
  e

  voo necessários à verificação do cumprimento dos requisitos da Subparte E do RBAC-E 94.'
