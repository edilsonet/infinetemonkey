title: 5.3.3(b)
text: 'b) Alguns ensaios de desenvolvimento ainda podem ser realizados após a solicitação
  de

  abertura, no entanto, o requerente deve se programar para mitigar o risco de ter que

  revisar dados técnicos já analisados pela ANAC.

  Reunião inicial: Antes da abertura de um processo de autorização de projeto de RPAS, uma

  reunião inicial pode ser solicitada pelo requerente ou pela ANAC. Nesta reunião, uma breve

  apresentação do projeto pode ser feita pelo requerente, constituindo uma boa oportunidade

  para descrever os detalhes técnicos do projeto à ANAC. O principal propósito é familiarizar

  a autoridade com a proposta de projeto, sobretudo identificar especificidades do sistema
  ou

  instalação, bem como novas tecnologias ou configurações. Além disso, nesta ocasião, pode-

  se informar ao requerente quanto à necessidade de se cumprir com: requisitos adicionais

  conforme RBAC-E 94.401(b), condições especiais, meios alternativos de cumprimento etc.

  Para melhor aproveitamento da reunião, é recomendável que, antes da mesma, o requerente

  elabore minutas da documentação completa requerida para solicitação de abertura do

  processo para que possa tirar dúvidas mais objetivas sobre eventuais aspectos que ainda

  demandem esclarecimento.

  Solicitação de abertura e plano de trabalho: O requerente deverá apresentar a documentação

  necessária para a abertura do processo de autorização de projeto de RPAS conforme

  apresentado no apêndice B desta Instrução Suplementar, incluindo um plano de trabalho para

  o requerimento de autorização de projeto de RPAS proposto. Neste plano serão definidos a

  base de requisitos utilizada, condições especiais, níveis equivalentes de segurança, isenções,

  lista dos requisitos afetados, meios de cumprimento, conceito de operações (CONOPS) e

  proposta de cronograma. O Plano de Trabalho será, assim, uma provisão ou guia do

  processo. Ressalta-se que esse documento será acordado entre as partes envolvidas e poderá

  ser revisado, se necessário, sempre que ocorrer alguma alteração nas premissas

  originalmente utilizadas. A documentação pode ser enviada para a ANAC pessoalmente, por

  carta ou pelo endereço eletrônico ggcpdoc.sjc@anac.gov.br.'
