title: Etapa preliminar
text: '5.3.3 Etapa preliminar

  Orientação ao processo: Antes de iniciar o desenvolvimento de um projeto de RPAS, é

  recomendável que o requerente obtenha o máximo de informações possível sobre as regras

  aplicáveis. A ANAC pode responder a questionamentos referentes aos procedimentos para

  obtenção da autorização, bem como orientar quanto ao material regulatório apropriado,

  políticas comuns ou outros materiais de orientação pertinentes. Os questionamentos podem

  ser realizados através do endereço eletrônico rpas.ggcp@anac.gov.br.

  Ensaios de desenvolvimento: De acordo com o projeto, podem ser necessários ensaios

  mecânicos, estruturais, de inflamabilidade, de qualificação, de voo de desenvolvimento,

  ensaios para verificação de funcionamento de sistemas e equipamentos instalados, entre

  outros. Os ensaios em voo devem ser realizados de acordo com as regras editadas pela

  ANAC para operações experimentais. O requerente deve consultar a Instrução Suplementar

  nº E94.503-001 revisão A ou posterior, intitulada “Emissão de Certificado de Autorização

  de Voo Experimental para Aeronaves Remotamente Pilotadas” para mais informações sobre

  o assunto. É importante que o requerente tenha atingido um grau de maturidade antes de

  requerer a abertura de processo de autorização de projeto de RPAS, evitando-se, dessa

  forma, que alterações no projeto ou nas premissas utilizadas, que são normais nas etapas

  iniciais de desenvolvimento, resultem em excessivas revisões dos dados técnicos

  apresentados à ANAC na etapa de demonstração e verificação de cumprimento, causando

  assim desperdício de recursos da agência e do próprio requerente.'
