title: 5.3.4(a)
text: 'a) A abertura formal do processo não implica na aceitação imediata do plano de

  trabalho apresentado. O plano de trabalho deve ser formalmente aceito pela ANAC

  antes que o requerente inicie a submissão dos dados técnicos.'
