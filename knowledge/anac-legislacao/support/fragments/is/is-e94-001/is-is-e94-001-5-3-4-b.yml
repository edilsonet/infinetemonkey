text: 'b) Nos casos em que a ANAC verifique a existência de pedido ou a necessidade de

  estabelecer meio de cumprimento aceitável, nível equivalente de segurança,

  condição especial ou isenção, será iniciada nesta etapa a elaboração de uma Ficha

  de Controle de Assunto Relevante (FCAR) para formalizar a discussão técnica.Data de emissão:
  25 de outubro de 2019. IS nº E94-001

  Revisão B'
