title: Etapa inicial
text: '5.3.4 Etapa inicial

  Abertura do processo: Um processo de autorização de projeto de RPAS é iniciado na ANAC

  quando do recebimento de uma carta dirigida à ANAC, enviada pelo requerente, solicitando

  sua abertura. Junto à carta deve ser enviado também o plano de trabalho e os dados básicos

  do RPAS, conforme o Apêndice B. Os documentos administrativos e técnicos apresentados

  serão avaliados pela ANAC e, caso existam todas as informações requeridas, a ANAC

  informará ao requerente, via ofício, a abertura formal do processo, incluindo o número do

  processo e o coordenador e coordenador-substituto designados para o processo.'
