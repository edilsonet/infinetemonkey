title: Etapa de demonstração e verificação de cumprimento
text: '5.3.5 Etapa de demonstração e verificação de cumprimento

  Submissão dos dados técnicos: Devem ser submetidos à ANAC, para revisão e aceitação,

  todos os dados técnicos referentes ao projeto de RPAS previstos no Plano de Trabalho aceito

  pela ANAC. Esses dados devem mostrar que a proposta de RPAS cumpre com todos os

  requisitos definidos no Plano de Trabalho. Enfatiza-se ainda que é responsabilidade do

  requerente demonstrar o cumprimento com os regulamentos aplicáveis. Todos os dados

  técnicos devem ser apresentados em documentos (relatórios, desenhos) com controle de

  revisão, identificação e assinatura do autor e aprovação do Responsável Técnico.

  Declaração de conformidade: Caso sejam requeridos ensaios, o Responsável Técnico deverá

  verificar a conformidade - da aeronave, das peças, componentes ou sistemas instalados -

  com os dados técnicos apresentados e com as propostas de ensaios aprovadas, e enviar

  documento de Declaração de Conformidade assinado à ANAC.

  Ensaios de demonstração de cumprimento de requisitos: Os ensaios (em solo ou em voo) de

  demonstração de cumprimento de requisitos, caso sejam previstos no plano de trabalho, são

  de responsabilidade do requerente e por ele executados. A ANAC, a seu critério, poderá

  testemunhar os referidos ensaios. É fortemente recomendável que o requerente apresente

  uma proposta de ensaio para aceitação da ANAC com detalhes sobre os procedimentos e

  objetivos esperados antes da realização do voo para evitar retrabalhos e desperdício de

  recursos. A preparação da aeronave para ensaios em voo, conforme previsto nas propostas

  de ensaio previamente acordadas, é de responsabilidade do requerente e consiste, entre

  outras, nas seguintes atividades: instalação e calibração das instrumentações de ensaio,
  as

  quais serão verificadas pela ANAC em inspeções de conformidade e colocação da aeronave

  nas condições de peso e balanceamento previstas para o ensaio em voo. Após a execução

  dos ensaios de demonstração de cumprimento de requisitos, é responsabilidade do

  requerente elaborar e encaminhar para a ANAC os relatórios de resultados (incluindo

  evidências como fotos, vídeos e logs), devidamente assinados pelo RT e, caso aplicável,
  pelo

  piloto remoto que executou os ensaios.

  Análise dos dados técnicos: A ANAC examinará os dados submetidos, analisará as propostas

  de ensaios, conduzirá inspeções e, se assim entender, testemunhará os ensaios. Enfatiza-se

  que é atribuição da ANAC determinar se os dados técnicos ora apresentados são suficientes

  ou não para demonstrar o cumprimento com os requisitos.

  Ensaio com testemunho ANAC: Após a conclusão de todas as atividades de demonstração

  de cumprimento previstas no plano de trabalho, a ANAC enviará ao requerente a lista de

  pontos e aspectos que devem ser ensaiados com testemunho da ANAC. É recomendável que

  o requerente elabore e apresente para a ANAC um roteiro contemplando os pontos e aspectos

  que serão avaliados. Serão avaliados principalmente aspectos com maior impacto na

  segurança, que requeiram avaliação subjetiva ou cujos resultados nos ensaios de

  demonstração possam ter sido marginais ou que não tenham conferido grande certeza sobre

  o real atendimento do requisito. A data e local serão acordados entre a ANAC e o requerente,

  sendo que o requerente é o responsável por identificar uma área adequada para a realização

  dos ensaios e obter todas as autorizações necessárias para a sua realização. Após o ensaio,
  a

  ANAC elaborará um relatório de testemunho. As principais conclusões serão enviadas para

  o requerente para conhecimento e ações cabíveis.Data de emissão: 25 de outubro de 2019.
  IS nº E94-001

  Revisão B'
