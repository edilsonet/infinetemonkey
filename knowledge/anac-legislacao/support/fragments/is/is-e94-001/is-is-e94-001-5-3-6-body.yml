text: '5.3.6 Etapa final

  Declaração de cumprimento de requisitos: Após a finalização de todas as atividades

  definidas no Plano de Trabalho, o requerente deverá apresentar uma declaração devidamente

  preenchida e assinada pelo RT, atestando o cumprimento de todos os requisitos aplicáveis,

  conforme o parágrafo RBAC-E 94.401(b)(3).

  Emissão do Ofício de Autorização e da Folha de Especificações: Após a aceitação ou

  aprovação pela ANAC de todos os dados técnicos, inspeções, ensaios, manuais e

  documentação necessária para a conclusão do processo, será emitido ofício de autorização

  de projeto de RPAS acompanhado da folha de especificações do RPAS (Design

  Authorization Data Sheet - DADS), a qual será publicada no sítio eletrônico da ANAC.

  5.4 Encerramento do Processo de Autorização'
