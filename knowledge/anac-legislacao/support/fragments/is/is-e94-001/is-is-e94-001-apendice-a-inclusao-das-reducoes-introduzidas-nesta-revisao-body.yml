text: 'Apêndice A Inclusão das reduções introduzidas nesta revisão.

  B.1

  Reorganização das informações para melhor organização do plano de trabalho separando

  os dados que constituem os aspectos básicos do projeto do RPAS, o conceito operacional

  e a base de certificação e meios de cumprimento.

  B.2.2 Introdução de uma nota para esclarecer a questão da ART.'
