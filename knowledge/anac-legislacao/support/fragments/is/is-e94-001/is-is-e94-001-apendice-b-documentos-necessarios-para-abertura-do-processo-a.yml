title: apendice-b-documentos-necessarios-para-abertura-do-processo(a)
text: 'a) Descrição de geral do RPAS, incluindo:

  I - Nome e modelo da aeronave remotamente pilotada (Remotely Piloted

  Aircraft - RPA);

  II - Nome e modelo da estação de pilotagem remota (Remote Pilot Station -

  RPS);

  III - Desenho das três vistas da aeronave, com cotas;

  IV - Fotos da RPA e da RPS, quando possível;

  V - Identificação dos usos previsto para o RPAS;

  VI - Peso máximo de decolagem previsto;

  VII - Classe pretendida de aprovação;

  VIII - Modo de pouso e decolagem;

  IX - Modos de voo e grau de autonomia (controle direto de atitude ou apenas

  seleção de waypoints, controle direto de tração, seleção de velocidade

  pretendida, etc);

  X - Descrição simplificada dos principais mecanismos de segurança previstos

  (paraquedas, sistemas redundantes de navegação, propulsão, energia

  elétrica, etc.);

  XI - Descrição de quaisquer aspectos relevantes ou pouco usuais da operação

  do RPAS, por exemplo, lançamento por catapulta, pouso por engate

  mecânico, etc.'
