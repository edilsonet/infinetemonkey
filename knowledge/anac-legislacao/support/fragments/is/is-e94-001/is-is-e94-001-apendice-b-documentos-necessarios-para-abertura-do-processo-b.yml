title: apendice-b-documentos-necessarios-para-abertura-do-processo(b)
text: 'b) Conceito de operações (CONOPS) proposto para o RPAS, incluindo:

  I - Determinação do tipo de autorização solicitada: se intenta operação em

  linha de visada visual (VLOS) ou além dela (BVLOS);

  II - Alcance máximo entre a RPA e o RPS;

  III - Usos e aplicações previstas;

  IV - Local ou ambiente operacional (urbano, rural, áreas esparsamente

  povoadas);

  V - Condições e limitações ambientais (VMC, IMC, diurno, noturno, chuva);Data de emissão:
  25 de outubro de 2019. IS nº E94-001

  Revisão B

  VI - Outros aspectos não usuais de operação (por exemplo, comutação de

  estações rádio ou de pilotagem remota, operações de múltiplas aeronaves

  por um piloto remoto, etc.);

  VII - Determinação da altura máxima de operação pretendida: se é de até 400

  pés em relação ao solo ou, caso a altura máxima de operação exceda esse

  limite, a altitude e altura máxima de operação.'
