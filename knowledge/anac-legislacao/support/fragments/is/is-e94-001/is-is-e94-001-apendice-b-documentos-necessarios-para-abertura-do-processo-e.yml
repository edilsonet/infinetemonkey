title: apendice-b-documentos-necessarios-para-abertura-do-processo(e)
text: 'e) Proposta de datas para a execução das atividades relacionadas a demonstrações de

  cumprimento de requisitos.

  B.2 Documentos Administrativos

  B.2.1 Carta de solicitação de abertura de processo de autorização de projeto de RPAS;

  B.2.2 Declaração de responsabilidade pelo projeto de RPAS informando nome, endereço e CPF

  ou número de registro no CREA do RT;

  B.2.3 Número da Anotação de Responsabilidade Técnica - ART relativa ao serviço de engenharia

  a ser executado que contenha descrição do projeto submetido à ANAC;

  NOTA 1 - Deve ser informada uma ART válida de obra ou serviço específica para o projeto

  que se pretenda autorizar emitida em nome do RT. Caso o requerente informe uma ART em

  nome da empresa, deve ser informada também uma ART de cargo ou função que demonstre

  o vínculo da empresa com um engenheiro com atribuição adequada no CREA.

  NOTA 2 - A ART deve estar quitada para ser considerada válida.

  B.2.4 Declaração isentando a ANAC de quaisquer ônus e responsabilidades por eventuais danos

  ocorridos na aeronave, ou danos a terceiros, durante a realização dos ensaios em solo e
  em

  voo;

  B.2.5 Cópia do comprovante de pagamento da TFAC (caso aplicável).Data de emissão: 25 de
  outubro de 2019. IS nº E94-001

  Revisão B'
