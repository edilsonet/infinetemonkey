text: 'INSTRUÇÃO SUPLEMENTAR - IS

  IS Nº E94-001

  Revisão B

  Aprovação: Portaria nº 3.275/SAR, de 22 de outubro de 2019.

  Assunto: Autorização de Projeto de Sistema de Aeronave

  Remotamente Pilotada - Procedimentos Gerais

  1 OBJETIVO

  1.1 Esta Instrução Suplementar - IS tem por objetivo fornecer informações sobre os

  procedimentos gerais para autorização de projeto de um Sistema de Aeronave Remotamente

  Pilotada (Remotely Piloted Aircraft System - RPAS), conforme estabelecido na Subparte E

  do Regulamento Brasileiro da Aviação Civil Especial nº 94 - RBAC-E 94.

  2 REVOGAÇÃO

  2.1 Esta IS cancela e substitui a IS E94-001A, de 2 de maio de 2017.

  3 FUNDAMENTOS

  3.1 O Art. 66, § 1º da Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de

  Aeronáutica), dispõe que compete à autoridade aeronáutica promover a segurança de voo,

  devendo estabelecer os padrões mínimos de segurança relativos a projetos de aeronaves e

  demais componentes aeronáuticos.

  3.2 O art. 8º, XVII da Lei nº 11.182, de 27 de setembro de 2005, dispõe que cabe à Agência

  Nacional de Aviação Civil - ANAC, como autoridade de aviação civil, a competência para

  proceder à homologação e emitir certificados, atestados, aprovações e autorizações relativos

  às atividades de competência do sistema de segurança de voo da aviação civil.

  3.3 A Resolução nº 30, de 21 de maio de 2008, considerando a redação dada pela Resolução
  n°

  162, de 20 de julho de 2010, estabelece, em seu art. 14, que a ANAC pode emitir IS para

  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.4 O art. 14 da Resolução nº 30, de 21 de maio de 2008, modificado pela Resolução n° 162,
  de

  20 de julho de 2010, também determina, em seu § 1°, que o administrado que pretenda, para

  qualquer finalidade, demonstrar o cumprimento de requisito previsto em RBAC poderá

  adotar os meios e procedimentos previamente especificados em IS ou apresentar meio ou

  procedimento alternativo devidamente justificado, exigindo-se, nesse caso, a análise e

  concordância expressa do órgão competente da ANAC. O § 2° do mesmo artigo estabelece

  que o meio ou procedimento alternativo deve garantir nível de segurança igual ou superior

  ao estabelecido pelo requisito aplicável ou concretizar o objetivo do procedimento

  normalizado em IS.

  3.5 A seção E94.401 do RBAC-E 94 estabelece que, exceto nos casos listados, somente é

  permitido operar um RPAS civil no Brasil se o projeto do RPAS for autorizado pela ANAC

  levando em consideração a classe do RPAS, a altura máxima de operação e o tipo de

  operação (Visual Line of Sight - VLOS ou Beyond Visual Line of Sight - BVLOS).Data de emissão:
  25 de outubro de 2019. IS nº E94-001

  Revisão B

  4 DEFINIÇÕES

  4.1 Requerente: Pessoa que solicita à ANAC e aos outros órgãos governamentais as

  autorizações e solicitações necessárias para o projeto do RPAS.

  4.2 Responsável Técnico - RT: Engenheiro com atribuição adequada e registro no Conselho

  Regional de Engenharia e Agronomia - CREA.

  5 DESENVOLVIMENTO DO ASSUNTO

