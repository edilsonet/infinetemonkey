text: '1. OBJETIVO

  Esta Instrução Suplementar tem por objetivo estabelecer os procedimentos para elaboração
  e

  utilização de avaliação de risco operacional para operadores de aeronaves não tripuladas,
  para

  cumprimento dos parágrafos E94.103(f)(2) e E94.103(g)(2) do RBAC-E nº 94.'
