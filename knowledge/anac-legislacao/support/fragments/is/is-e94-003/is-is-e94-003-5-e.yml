cite: 5(e)
title: 5(e)
text: 'e) uma declaração se o operador é ou não obrigado a se manter em “área distante de
  terceiros”,

  conforme definido no parágrafo E94.3(a)(3) do RBAC-E nº 94.

  Nota: se o operador estiver enquadrado nos parágrafos E94.103(g) ou E94.103(h) do RBAC-E
  nº 94, ele não

  é obrigado a se manter em áreas distantes de terceiros, mas sob sua inteira responsabilidade.
  Caso ele

  não esteja enquadrado nos referidos parágrafos, ele somente pode operar em áreas distantes
  de terceiros.'
