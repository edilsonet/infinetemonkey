cite: 5(l)
title: 5(l)
text: 'l) data e assinatura da avaliação, assim como a indicação do mês da validade.

  5.2.2. Caso o operador não utilize o modelo proposto no Apêndice B desta IS, pelo menos
  o título

  “Avaliação de Risco Operacional” e a referência ao RBAC nº 94 devem ser mantidos, a fim
  de

  que a fiscalização identifique o documento como relacionado ao cumprimento do parágrafo

  E94.103(g)(2) ou E94.103(h)(2) do RBAC-E nº 94.

  5.2.3. A ANAC não receberá nem aprovará as avaliações de risco operacional, e elas podem
  ser

  utilizadas assim que forem impressas e assinadas por um responsável. Todas as folhas do

  documento deverão estar rubricadas. É admissível assinatura digital.

  5.2.4. É obrigatório o porte da avaliação de risco operacional confeccionada de acordo com
  esta IS

  pelo piloto-remoto da aeronave. É admitido o porte do documento em formato digital, mas
  se a

  assinatura for a tinta, a cópia deverá estar digitalizada e com a assinatura e rubricas
  visíveis. O

  operador deve manter o documento físico original para referência e apresentá-lo para

  fiscalização sempre que solicitado.

  5.2.5. Caso a avaliação de risco seja substituída por uma versão atualizada, a versão anterior
  pode ser

  descartada.'
