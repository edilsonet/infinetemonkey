  Revisão A

  Matriz de risco: [o operador deve utilizar uma matriz própria ou adotar o modelo aqui proposto]

  Probabilidade da ocorrência:

  - Nível 5 (frequente): é provável que ocorra muitas vezes, ou historicamente tem ocorrido
  frequentemente;

  - Nível 4 (ocasional): é provável que ocorra algumas vezes, ou historicamente tem ocorrido
  com pouca frequência;

  - Nível 3 (remoto): é improvável, mas é possível que venha a ocorrer, ou ocorre raramente;

  - Nível 2 (improvável): é bastante improvável que ocorra e não se tem notícia de que tenha
  alguma vez ocorrido; e

  - Nível 1 (muito improvável): é quase impossível que o evento ocorra.

  Severidade da ocorrência:

  - Nível A (catastrófico): morte de múltiplas pessoas;

  - Nível B (crítico): morte de pessoa, lesões gravíssimas, capazes de deixar sequelas significativas
  e/ou incapacitantes,

  tais como cegueira, paralisia, amputações, etc.;

  - Nível C (significativo): lesões sérias a pessoas, mas não incapacitantes nem com sequelas
  significativas;

  - Nível D (pequeno): incidentes menores, danos a objetos, animais ou vegetação no solo,
  lesões leves;

  - Nível E (insignificante): somente danos ao equipamento.

  Tolerabilidade:

  Severidade

  Catastrófico Crítico Significativo Pequeno Insignificante

  A B C D E

  Probabilidade Frequente 5 5A 5B 5C 5D 5E

  Ocasional 4 4A 4B 4C 4D 4E

  Remoto 3 3A 3B 3C 3D 3E

  Improvável 2 2A 2B 2C 2D 2E

  Muito improvável 1 1A 1B 1C 1D 1E

  - Risco extremo (classificações 4A, 5A e 5B): a operação não deve ocorrer e, caso esteja
  ocorrendo, deve cessar

  imediatamente, enquanto persistir a condição ou até que medidas mitigadoras suficientes
  reduzam o risco para um nível

  aceitável pelo operador. Caso ainda se decida prosseguir com a operação, controles preventivos
  para mitigação do risco

  devem ser estabelecidos, devem estar em vigor e a aprovação da hierarquia mais alta da empresa
  (presidente) deve ser

  requerida.

  - Alto risco (classificações 3A, 4B e 5C): a operação não deveria ocorrer e, caso esteja
  ocorrendo, deveria cessar

  imediatamente, enquanto persistir a condição ou até que medidas mitigadoras suficientes
  reduzam o risco para um nível

  aceitável pelo operador. Caso ainda se decida prosseguir com a operação, controles preventivos
  para mitigação do risco

  devem ser estabelecidos, devem estar em vigor e a aprovação da hierarquia de gestão da empresa
  (gerente ou diretor) deve

  ser requerida.

  - Risco moderado (classificações 1A, 2A, 2B, 3B, 3C, 4C, 4D, 5D, 5E): a operação pode ocorrer
  com controles

  preventivos para mitigação do risco estabelecidos e que devem estar em vigor, conforme necessários.
  Operações neste

  nível de risco deveriam ser aprovadas por nível hierárquico imediatamente superior (chefia
  imediata).

  - Baixo risco (classificações 1B, 1C, 2C, 2D, 3D, 3E, 4E): a operação pode ocorrer e controles
  preventivos para mitigação

  de risco e aprovação por nível hierárquico imediatamente superior (chefia imediata) são
  opcionais.

  - Risco muito baixo (classificações 1D, 1E e 2E): a operação é aceitável como concebida,
  e nenhum controle preventivo

  para mitigação de risco e aprovação é requerida para que ela ocorra.'
