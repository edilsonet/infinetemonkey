  Nota: NR significa “Não Requerido” para o SAIL buscado e, para fins de simplificação, não
  é abordado nesta IS. B significa robustez “Baixa” e M significa robustez “Média”.

  B.6.2 Os documentos que serão disponibilizados ao operador do RPAS deverão ser elaborados
  pelo requerente na língua portuguesa.

  B.6.3 Em adição aos documentos que satisfaçam os critérios de cada OSO, deve ser fornecido
  o formulário F-105-70 indicando em qual documento, sessão e página encontram-se as informações
  requeridas. A Tabela 4 mostra um exemplo de como as evidências devem ser apresentadas.

  Tabela 4 - Exemplo de declaração de cumprimento com os OSOs aplicáveis.

  OSO

  Critério

  Documentos

  #1

  Listas de verificação

  Checklist pré-voo: Manual de Operação nº XYZ, versão A, seção Z, página XY.

  Checklist pós-voo: Manual de Operação nº XYZ, versão A, seção Z, página XY.

  #1

  Manutenção

