title: apendice-c-documentos-necessarios-para-abertura-do-processo(a)
text: a) O sistema de iluminação externa da RPA deve estar em funcionamento tanto para operações
  diurnas, quanto noturnas. A iluminação deverá incluir a instalação de luz anticolisão estroboscópica
  de cor branca ou vermelha.
