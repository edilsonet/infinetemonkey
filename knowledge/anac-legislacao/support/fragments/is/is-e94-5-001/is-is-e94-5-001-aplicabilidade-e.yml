title: aplicabilidade(e)
text: 'e) o RPAS foi objeto de uma investigação de segurança operacional, conforme definido
  pela ANAC conforme Apêndice C desta IS, que demonstra a sua compatibilidade com o critério
  de risco em solo (GRC) e que não há risco inaceitável de que a aeronave saia do volume de
  voo autorizado.

  A declaração deve ser assinada por um representante legal do requerente e por um responsável
  técnico com atribuição adequada junto ao CREA.

  NOTA 1 - O responsável técnico pode ser também o representante legal do requerente.

  O programa de manutenção pode estar contido no manual de voo.

  Uma modificação no produto apenas pode ser disponibilizada para os operadores após ter sido
  avaliada pelo Responsável Técnico e determinado que não há impacto nos dados apresentados
  anteriormente.

  NOTA 2 - O responsável técnico poderá estabelecer uma relação de componentes que não tem
  impacto nos dados apresentados e que podem ser modificados pelo detentor da autorização
  sem necessidade de emissão de nova avaliação específica.

  Os documentos contendo as informações requeridas nos itens 5.3.1.a), b), c) e e) desta IS
  devem ser anexados ao peticionamento de autorização.

  A autorização será concedida mediante conferência administrativa da existência dos documentos
  requeridos.

  Não obstante o item anterior, a ANAC poderá revisar o conteúdo técnico da documentação apresentada
  para fins de fiscalização ou investigação.'
