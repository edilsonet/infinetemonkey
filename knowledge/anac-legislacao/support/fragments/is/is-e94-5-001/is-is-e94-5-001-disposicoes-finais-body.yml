title: DISPOSIÇÕES FINAIS
text: 'DISPOSIÇÕES FINAIS

  O cumprimento dos critérios estabelecidos nesta Instrução Suplementar não isenta qualquer
  pessoa de cumprir as regras aplicáveis editadas pela ANATEL, DECEA e MAPA em suas respectivas
  matérias de competência.

  A ANAC poderá solicitar, a qualquer momento, dados e comprovações a qualquer uma das partes
  envolvidas para verificar a real aderência aos objetivos desta IS.

  Caso qualquer uma das partes envolvidas não cumpra com as condições estabelecidas nos programas
  e manuais estabelecidos ou com os critérios dessa Instrução Suplementar, a ANAC poderá suspender
  ou cancelar autorização e/ou certificados correspondentes, sem prejuízo das demais ações
  sancionatórias cabíveis.

  Os casos omissos serão dirimidos pela ANAC.'
