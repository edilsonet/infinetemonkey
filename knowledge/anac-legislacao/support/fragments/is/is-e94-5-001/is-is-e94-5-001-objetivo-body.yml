text: 'OBJETIVO

  Esta Instrução Suplementar - IS tem o objetivo de estabelecer critérios para autorização
  de projeto de Sistema de Aeronave Remotamente Pilotada (RPAS) destinado à aplicação de agrotóxicos
  e afins, adjuvantes, fertilizantes, inoculantes, corretivos e sementes.'
