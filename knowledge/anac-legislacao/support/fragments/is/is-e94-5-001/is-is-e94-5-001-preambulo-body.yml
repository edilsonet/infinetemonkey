title: PREÂMBULO
text: 'PREÂMBULO

  O requisito E94.5(b) do RBAC-E 94 estabelece critérios para operações com Sistema de Aeronave
  Remotamente Pilotada (RPAS) para aplicar agrotóxicos e afins, adjuvantes, fertilizantes,
  inoculantes, corretivos e sementes, sendo permitido, nesses casos, que o RPAS não possua
  um projeto autorizado pela ANAC.

  No entanto, caso o fabricante tenha o interesse de autorizar seu projeto de RPAS para essas
  operações, deverá atender os critérios estabelecidos nesta Instrução Suplementar, desenvolvidos
  de acordo com a Metodologia SORA. Para os casos não previstos nesta IS, aplicam-se os critérios
  estabelecidos na Subparte E do RBAC-E 94.'
