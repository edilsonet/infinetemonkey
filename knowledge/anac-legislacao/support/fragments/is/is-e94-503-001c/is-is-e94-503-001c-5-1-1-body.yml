cite: 5.1.1
title: Aplicabilidade
text: '5.1.1 Aplicabilidade

  5.1.1.1 Esta IS é aplicável a qualquer pessoa que pretenda obter Certificado de Autorização
  de Voo Experimental para uma aeronave remotamente pilotada civil no Brasil.

  5.1.1.2 Conforme estabelecido no RBAC-E 94.501(c), as RPA Classe 3 que se destinam a operações
  experimentais em linha de visada visual (Visual Line of Sight - VLOS) até 400 pés acima
  da superfície terrestre (Above Ground Level - AGL) não necessitam de CAVE.'
