text: '5.1.2 Considerações

  5.1.2.1 Considerando limitações constantes do Certificado de Autorização de Voo Experimental,
  as operações de RPAS não devem apresentar ou criar um risco maior, enquanto em voo ou em
  solo, do que aquele atribuído a operações de aeronaves tripuladas de classe ou categoria
  equivalente para pessoas, propriedades, veículos ou outras aeronaves.

  5.2 Certificado de Autorização de Voo Experimental

  5.2.1 O Certificado de Autorização de Voo Experimental - CAVE é o certificado de aeronavegabilidade
  que pode ser emitido de acordo com a seção E94.503 do RBAC-E 94 para RPA experimental com
  os propósitos de pesquisa e desenvolvimento, demonstração de cumprimento com requisitos,
  treinamento de piloto remoto e/ou pesquisa de mercado.

  5.2.2 O CAVE se destina apenas à aeronave remotamente pilotada com fins considerados experimentais
  pela ANAC. Estas aeronaves devem obter as autorizações ou certificações de projeto e de
  aeronavegabilidade, se aplicável, de acordo com o estabelecido nas Subpartes D e E do RBAC-E
  94.'
