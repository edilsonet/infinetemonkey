title: O CAVE indicará para qual(is) dos propósitos foi emitido.
text: '5.2.4.2 O CAVE indicará para qual(is) dos propósitos foi emitido.

  5.2.4.3 O CAVE será emitido com uma validade de 1 ano ou menos, de acordo com o critério
  que a ANAC julgue mais adequado para a manutenção da segurança operacional.

  NOTA 1 - A data de validade do CAVE deverá ser igual ou anterior à data da validade da certidão
  de cadastro no momento da emissão do certificado.

  NOTA 2 - O requerente pode estender a validade da certidão de cadastro em 24 meses a qualquer
  momento, renovando o cadastro no SISANT.'
