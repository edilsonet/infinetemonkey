text: '5.2.5.5 A ANAC poderá solicitar qualquer outra informação que julgar importante para
  analisar o pedido de renovação do CAVE.

  5.2.5.6 Se o RPAS classe 1 possuir reserva de marcas por ocasião da emissão do CAVE, sua
  renovação estará condicionada à emissão do Certificado de Matrícula Experimental (CME).'
