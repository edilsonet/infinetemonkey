text: '5.2.6.1 O CAVE será suspenso caso o registro ou o cadastro da aeronave seja cancelado.

  5.2.6.2 Caso o operador não cumpra com as condições e limitações estabelecidas pelo CAVE,
  ou com os regulamentos de aviação civil aplicáveis, a ANAC poderá suspender ou cancelar
  o CAVE.

  5.3 Processo de Emissão do CAVE'
