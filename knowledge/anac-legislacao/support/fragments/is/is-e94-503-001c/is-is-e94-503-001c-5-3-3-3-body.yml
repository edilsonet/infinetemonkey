text: '5.3.3.3 e 5.3.3.4

  Orientações sobre a reserva de marcas para solicitações de CAVE para RPA Classe 1.

  5.3.4.2.a

  Incluída menção de que a TFAC é apenas requerida para emissão de CAVE para RPA Classe 1.

  NOTA 4

  Esclarecimento de que durante a vistoria de uma RPA, aspectos não previstos no F-132-02
  podem ser verificados dadas as particularidades de cada RPAS.'
