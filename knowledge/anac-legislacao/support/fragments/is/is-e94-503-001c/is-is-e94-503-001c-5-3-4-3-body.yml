text: '5.3.4.3 A ANAC poderá solicitar qualquer outra informação que julgar importante para
  analisar a capacidade de operação segura do RPAS.

  5.3.4.4 Caso o requerente já tenha previamente obtido um CAVE para uma aeronave do mesmo
  modelo (incluindo os demais componentes do RPAS), a nova solicitação pode referenciar a
  carta de solicitação anterior nos casos em que as informações providas anteriormente permanecem
  válidas.

  5.3.4.5 O requerente também poderá referenciar dados apresentados para a ANAC como parte
  de um processo de autorização de projeto de RPAS em andamento ou já concluído.

  5.3.4.6 A ANAC realizará uma avaliação de segurança e de atendimento dos requisitos, baseada
  na documentação enviada, e, se necessário, poderá solicitar visitas às instalações do fabricante
  e poderá ser solicitada demonstração em voo.'
