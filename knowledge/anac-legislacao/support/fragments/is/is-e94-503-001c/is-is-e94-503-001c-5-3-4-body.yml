title: Solicitação do CAVE
text: '5.3.4 Solicitação do CAVE

  5.3.4.1 O requerente deverá solicitar à SAR, por meio do formulário nº F-132-01 ou outro
  meio aceitável pela ANAC, a emissão de um CAVE, com base no requisito E94.501 do RBAC-E
  94.'
