section_title: 'A ANAC realizará a inspeção de acordo com o formulário F-132-02. A documentação
  do RPAS e o próprio RPAS serão inspecionados pela ANAC para:'
subsection_id: j
cite: 5.3.5.3(j)
title: 5.3.5.3(j)
text: 'j) Verificar qualquer outro aspecto que a ANAC considere necessário para a confirmação
  adequada da aeronavegabilidade do RPAS.

  NOTA 4 - O formulário F-132-02 apresenta apenas os itens mínimos a serem verificados. Dadas
  as particularidades de cada RPAS, aspectos adicionais podem ser verificados durante a inspeção.'
