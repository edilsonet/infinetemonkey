cite: 5.3.5.5(a)
title: 5.3.5.5(a)
text: a) As não conformidades detectadas na documentação ou na inspeção física devem ser informadas
  ao requerente visando à regularização. O requerente deve tomar as providências para saná-las.
  Caso, por algum motivo, não seja possível ou adequado eliminar alguma não conformidade,
  o requerente deverá consultar a ANAC sobre sua aceitação ou não.
