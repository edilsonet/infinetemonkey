title: 5.3.5.5(c)
text: 'c) As não conformidades são classificadas em:

  I - Item Classe I - Não conformidade maior - é aquela que possa afetar a segurança de voo,
  incluindo qualquer não cumprimento da seção 21.3 do RBAC 21, inclusive em casos pontuais;
  e

  II - Item Classe II - Não conformidade menor - é aquela sistêmica ou pontual que não seja
  considerada não conformidade maior.

  5.3.5.6 Após a aprovação da RPA nesta etapa, no caso de RPA Classe 1, haverá inclusão do
  parecer da SAR favorável à aeronavegabilidade no Sistema de Aviação Civil (de uso interno
  da ANAC).'
