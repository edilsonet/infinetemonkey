title: Inspeção do RPAS
text: '5.3.5 Inspeção do RPAS

  5.3.5.1 Após a conclusão positiva da avaliação da solicitação de emissão do CAVE, a ANAC
  poderá realizar uma inspeção física no RPAS para determinar a aeronavegabilidade da aeronave
  e verificar os demais componentes do RPAS.

  5.3.5.2 Nos casos em que a ANAC dispensar a realização de inspeção do RPAS, ela poderá solicitar
  a apresentação de dados adicionais (por exemplo: fotos, registros, etc.).'
