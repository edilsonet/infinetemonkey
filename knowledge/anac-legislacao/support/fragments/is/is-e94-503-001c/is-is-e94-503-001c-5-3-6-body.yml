text: '5.3.6 Registro da RPA

  5.3.6.1 O registro da aeronave no Registro Aeronáutico Brasileiro - RAB é um pré-requisito
  necessário para a emissão de um Certificado de Autorização de Voo Experimental para aeronaves
  remotamente pilotadas classe 1.

  NOTA 5 - Aeronaves remotamente pilotadas classes 2 ou 3 devem ser cadastradas no SISANT
  e não precisam ser registradas.

  5.3.6.2 A solicitação para registro da RPA deverá ser enviada para o Registro Aeronáutico
  Brasileiro juntamente com os dados solicitados na Resolução Nº 293, de 19 de novembro de
  2013, ou documento que venha a substituí-la.'
