text: '5.4.1.5 As manutenções, inspeções e reparos do RPAS devem ser executados seguindo as
  orientações do fabricante.

  5.4.1.6 Os sistemas novos, modificados, em suspeita de apresentar danos ou que passaram
  por manutenções ou reparos devem ser reinspecionados pelo requerente de acordo com os procedimentos
  do fabricante.'
