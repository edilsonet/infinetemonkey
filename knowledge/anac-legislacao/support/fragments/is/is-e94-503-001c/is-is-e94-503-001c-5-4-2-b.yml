title: 5.4.2(b)
text: b) Cada fabricante deverá desenvolver e disponibilizar ao operador e à ANAC um conjunto
  de planos para execução destas tarefas de manutenção e inspeção que deve incluir um conjunto
  de tarefas de verificações anuais.
