title: Programa de Inspeção e Manutenção
text: '5.4.2 Programa de Inspeção e Manutenção

  5.4.2.1 O requerente de um Certificado de Autorização de Voo Experimental com propósito
  de pesquisa de mercado ou de treinamento de piloto remoto, deve estabelecer um programa
  de inspeções e de manutenção de forma a assegurar a aeronavegabilidade continuada da RPA,
  incluindo os demais componentes do RPAS (veja parágrafo E94.503(b)(1) do RBAC-E 94).'
