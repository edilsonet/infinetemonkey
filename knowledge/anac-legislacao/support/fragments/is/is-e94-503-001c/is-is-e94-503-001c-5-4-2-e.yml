title: 5.4.2(e)
text: 'e) Sistema de Terminação de Voo: Deve ser verificado se os componentes do sistema de
  terminação de voo estão dentro das tolerâncias de calibração a intervalos estabelecidos
  pelo fabricante. A condição satisfatória do sistema de terminação de voo deve ser verificada
  pelo piloto em comando antes de cada voo;'
