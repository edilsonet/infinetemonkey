title: 5.4.2(h)
text: 'h) Coleção de Dados: Cada elemento autônomo do RPAS (aeronave, estação de pilotagem
  remota, sistema de recuperação etc.) deve ter um número único de identificação. Componentes
  críticos dentro de cada elemento também devem ter números únicos de identificação. Detalhes
  sobre as horas voadas, horas em operação, ciclos submetidos e manutenções/inspeções executadas
  em cada componente/elemento devem ser registrados.'
