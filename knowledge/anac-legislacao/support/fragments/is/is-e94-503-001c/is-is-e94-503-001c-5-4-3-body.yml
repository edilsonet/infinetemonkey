title: Comunicação de Perda Total de Aeronave ou eventos adversos
text: '5.4.3 Comunicação de Perda Total de Aeronave ou eventos adversos

  5.4.3.1 Caso ocorra a perda total ou desativação de uma RPA Classe 1, o requerente deverá
  comunicar o fato ao Registro Aeronáutico Brasileiro em, no máximo, 30 dias após o evento,
  para fins de baixa de registro.

  5.4.3.2 Caso ocorra a perda total ou desativação de uma RPA Classe 2 ou 3, o responsável
  por seu cadastro deverá fazer a exclusão do cadastro no SISANT em, no máximo, 30 dias após
  o evento.

  5.4.3.3 Caso ocorra evento que resulte em acionamento da terminação de voo (exceto em ensaio
  com essa finalidade específica), queda descontrolada, saída da área de voo designada ou
  pouso fora de zona designada etc. o requerente deverá comunicar o fato a ANAC em até 24
  horas após a ocorrência.'
