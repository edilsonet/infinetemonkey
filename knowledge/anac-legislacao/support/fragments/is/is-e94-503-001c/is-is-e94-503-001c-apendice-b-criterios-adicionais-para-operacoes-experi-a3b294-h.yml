section_title: APÊNDICE B - CRITÉRIOS ADICIONAIS PARA OPERAÇÕES EXPERIMENTAIS ACIMA DE 400
  PÉS AGL OU ALÉM DA LINHA DE VISADA VISUAL
subsection_id: h
