title: apendice-b-criterios-adicionais-para-operacoes-experi-a3b294(h)
text: 'h) Posição atual da RPA sobreposta a um mapa que também indique a área onde o voo é
  permitido segundo parágrafo B3.5.2.

  B.3.6 Iluminação Externa da RPA

  B.3.6.1 O sistema de iluminação externa da RPA deve estar em funcionamento tanto para operações
  diurnas, quanto noturnas. A iluminação deverá incluir a instalação de luz anticolisão estroboscópica
  de cor branca ou vermelha.

  B.3.6.2 O sistema de iluminação da RPA deve permitir uma efetiva visualização da RPA, de
  modo que a aeronave seja avistada por pessoas que possam estar próximas do local de operação
  da RPA. Deve ser demonstrado que a aeronave é visível, mesmo à noite, à distância tal que
  permita que a aeronave seja vista, no mínimo, 30 segundos antes de chegar ao ponto do qual
  foi avistada, considerando para isto a máxima velocidade em que a aeronave pode se deslocar.

  B.3.6.3 Toda RPA que opere acima de 400 pés em relação ao solo deverá possuir sistema de
  iluminação que permita a visualização da RPA a uma distância mínima de 2 km, considerando
  uma inclinação de até 5 graus em relação ao plano horizontal de voo da RPA. De forma alternativa
  a este item, é facultado ao requerente demonstrar cumprimento com as seções 23.1401 ou 27.1401
  dos RBAC 23 ou 27, conforme aplicável.'
