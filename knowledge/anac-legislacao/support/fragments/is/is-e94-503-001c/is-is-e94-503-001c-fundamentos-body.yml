title: Fundamentos
text: 'Fundamentos

  3.1 A Lei 7.565/86 (Código Brasileiro de Aeronáutica - CBAer) estabelece, no parágrafo único
  do seu Art. 20, que "Pode a autoridade aeronáutica, mediante regulamento, estabelecer as
  condições para voos experimentais, realizados pelo fabricante de aeronave, assim como para
  os voos de translado".

  3.2 A mesma Lei determina, no seu Art. 119, que "As aeronaves em processo de homologação,
  as destinadas à pesquisa e desenvolvimento para fins de homologação e as produzidas por
  amadores estão sujeitas à emissão de certificados de autorização de voo experimental e de
  marca experimental".

  3.3 A Resolução nº 30, de 21 de maio de 2008, considerando também a redação dada pela Resolução
  n° 162, de 20 de julho de 2010, estabelece, em seu art. 14, que a ANAC pode emitir IS para
  esclarecer, detalhar e orientar a aplicação de requisito previsto em RBAC.

  3.4 O art. 14 da Resolução nº 30, de 21 de maio de 2008, modificado pela Resolução n° 162,
  de 20 de julho de 2010, também determina, em seu § 1°, que o administrado que pretenda,
  para qualquer finalidade, demonstrar o cumprimento de requisito previsto em RBAC poderá
  adotar os meios e procedimentos previamente especificados em IS ou apresentar meio ou procedimento
  alternativo devidamente justificado, exigindo-se, nesse caso, a análise e concordância expressa
  do órgão competente da ANAC. O § 2° do mesmo artigo estabelece que o meio ou procedimento
  alternativo deve garantir nível de segurança igual ou superior ao estabelecido pelo requisito
  aplicável ou concretizar o objetivo do procedimento normalizado em IS.

  3.5 Considerando o exposto nesta seção, esta IS objetiva detalhar e orientar a aplicação
  da seção E94.503 do RBAC-E 94 visando à emissão de um Certificado de Autorização de Voo
  Experimental para uma Aeronave Remotamente Pilotada.'
