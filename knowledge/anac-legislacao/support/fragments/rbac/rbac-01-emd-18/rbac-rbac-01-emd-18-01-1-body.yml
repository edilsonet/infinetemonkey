title: Definições
text: '01.1 Definições

  Para os propósitos dos normativos da ANAC, são válidas as seguintes definições, a menos
  que de outra forma explicitado no texto dos mesmos: (Redação dada pela Resolução nº 526,
  de 06.08.2019)

  ACAS (Airborne Collision Avoidance System) significa um sistema que utiliza interrogações
  e respostas de um radar transponder de bordo, provendo orientações de tráfego e, em alguns
  tipos, orientações de resolução para o piloto. É a denominação dada pela Organização da
  Aviação Civil Internacional - OACI para o Traffic Alert and Collision Avoidance System -
  TCAS.

  ACAS II significa um TCAS que utiliza interrogações e respostas de um radar transponder
  de bordo, provendo, para o piloto, orientações de tráfego e orientações de resolução no
  plano vertical.

  Aerodesportista significa a designação genérica de uma pessoa que pratica as atividades
  regidas pelo RBAC nº 103. (Incluído pela Resolução nº 474, de 07.06.2018)

  Aerodesporto significa toda atividade praticada com dispositivos aéreos utilizados ou que
  se pretenda utilizar para voar na atmosfera com finalidade desportiva ou recreativa. (Incluído
  pela Resolução nº 474, de 07.06.2018)

  Aeródromo significa uma área delimitada em terra ou na água destinada, no todo ou em parte,
  para pouso, decolagem e movimentação em superfície de aeronaves; inclui quaisquer edificações,
  instalações e equipamentos de apoio e de controle das operações aéreas, se existirem. Quando
  destinado exclusivamente a helicópteros, recebe denominação de heliponto.

  Aeródromo civil significa um aeródromo destinado à operação de aeronaves civis. Pode ser
  usado por aeronaves militares, obedecidas as normas estabelecidas pela autoridade competente.

  Aeródromo de alternativa significa um aeródromo para o qual uma aeronave poderá prosseguir,
  quando for impossível ou desaconselhável dirigir-se ou efetuar o pouso no aeródromo de destino
  previsto, e onde os serviços necessários e facilidades estarão disponíveis e os requisitos
  de desempenho da aeronave poderão ser atendidos, bem como estará operacional no momento
  pretendido de uso. Aeródromos de alternativa podem ser:(Redação dada pela Resolução nº 546,
  de 18.03.2020)

  (1) aeródromo de alternativa de decolagem significa um aeródromo de alternativa no qual
  uma aeronave poderá pousar, se isso for necessário, logo após a decolagem, se não for possível
  utilizar o aeródromo de decolagem; (Redação dada pela Resolução nº 685, de 13.07.2022)

  (2) aeródromo de alternativa em rota significa um aeródromo de alternativa no qual uma aeronave
  poderá pousar, caso um desvio seja necessário, enquanto estiver em rota; ou (Redação dada
  pela Resolução nº 546, de 18.03.2020)

  (3) aeródromo de alternativa de destino significa um aeródromo de alternativa no qual uma
  aeronave poderá pousar se for impossível ou desaconselhável efetuar pouso no aeródromo de
  destino previsto. (Redação dada pela Resolução nº 546, de 18.03.2020)

  Aeródromo de uso privativo significa aquele aeródromo onde seu operador suporta operações
  aéreas em seu próprio benefício ou com sua permissão, vedadas operações de transporte regular
  de passageiro ou carga, ressalvadas as operações enquadradas na Resolução nº 576, de 4 de
  agosto de 2020.(Incluído pela Resolução nº 737, de 9 de fevereiro de 2024)

  Aeródromo de uso público significa aquele aeródromo onde seu operador está apto a processar
  serviço de transporte aéreo ou outras atividades de aviação civil não suportadas pelo uso
  privativo. (Incluído pela Resolução nº 737, de 9 de fevereiro de 2024)

  Aeródromo isolado significa um aeródromo de destino para o qual não há aeródromo de alternativa
  de destino apropriado para um determinado tipo de aeronave. (Incluído pela Resolução nº
  685, de 13.07.2022)

  Aeródromo militar significa um aeródromo destinado à operação de aeronaves militares. Pode
  ser usado por aeronaves civis, obedecidas as normas estabelecidas pelas autoridades competentes.

  Aeródromo privado significa um aeródromo civil cadastrado junto à ANAC, utilizado somente
  com permissão de seu proprietário e que não se enquadre como aeródromo público. (Redação
  dada pela Resolução nº 737, de 9 de fevereiro de 2024)

  Aeródromo público significa aeródromo civil construído, mantido e explorado diretamente
  pela União, por empresa especializada da Administração Federal Indireta, mediante convênio
  com estados ou municípios ou por meio de concessão ou autorização. (Redação dada pela Resolução
  nº 737, de 9 de fevereiro de 2024)

  Aeródromo regular significa o aeródromo utilizado por um detentor de certificado em suas
  operações regulares, listado em suas especificações operativas e autorizado a processar
  operações regulares, observado o disposto no RBAC nº 139. (Incluído pela Resolução nº 526,
  de 06.08.2019)

  Aeronave significa um dispositivo que é usado ou que se pretenda usar para voar na atmosfera,
  capaz de transportar pessoas e/ou coisas.

  Aeronave aerodesportiva significa a designação genérica de uma aeronave portadora de certificado
  emitido segundo o RBAC nº 21 cujo propósito principal é o desporto e o lazer. (Incluído
  pela Resolução nº 474, de 07.06.2018)

  Aeronave civil significa uma aeronave que não se enquadra na definição de aeronave militar.

  Aeronave de asa rotativa significa uma aeronave mais pesada que o ar que depende principalmente
  da sustentação gerada por um ou mais rotores para manter-se no ar.

  Aeronave de controle pendular significa uma aeronave, motorizada ou não, com uma asa estruturada
  pivotada e uma fuselagem, controlável apenas em arfagem e rolamento pela habilidade do piloto
  em mudar o centro de gravidade da aeronave em relação à asa. O controle de voo da aeronave
  depende mais da capacidade de deformação flexível da asa do que do uso de superfícies de
  controle.

  Aeronave de sustentação por potência significa uma aeronave mais pesada que o ar, capaz
  de decolar e pousar na vertical e voar com baixa velocidade, e que depende principalmente
  de dispositivos de sustentação acionados pelo motor ou do empuxo do motor para sua sustentação
  nesses regimes de voo e de aerofólios não rotativos para sua sustentação em voo horizontal.

  Aeronave leve esportiva significa uma aeronave, excluindo helicóptero ou aeronave cuja sustentação
  dependa diretamente da potência do motor (powered-lift), que, desde a sua certificação original,
