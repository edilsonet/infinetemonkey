title: Abreviaturas e símbolos
text: '01.2 Abreviaturas e símbolos

  As abreviaturas e símbolos a seguir são aplicáveis aos propósitos dos RBAC.

  VA significa velocidade de manobra de projeto.

  VB significa velocidade para intensidade máxima de rajada de projeto.

  VC significa velocidade de cruzeiro de projeto.

  VD significa velocidade máxima de mergulho de projeto.

  VDF / MDF significa velocidade de mergulho demonstrada em voo.

  VEF significa velocidade na qual se assume a falha do motor crítico na decolagem.

  VF significa velocidade com flapes baixados de projeto.

  VFC / MFC significa velocidade máxima para características de estabilidade.

  VFE significa velocidade máxima com flapes baixados.

  VH significa velocidade máxima em voo nivelado com potência máxima contínua.

  VLE significa velocidade máxima com trem baixado.

  VLO significa velocidade máxima com trem em movimento.

  VLOF significa velocidade de saída do solo.

  VMC significa velocidade mínima de controle com motor crítico inoperante.

  VMO / MMO significa velocidade limite máxima em operação.

  VMU significa velocidade mínima de decolagem abusiva.

  VNE significa velocidade nunca a ser excedida.

  VNO significa velocidade máxima estrutural de cruzeiro.

  VR significa velocidade de rotação.

  VS significa velocidade de estol ou velocidade mínima de voo estável, na qual o avião é
  controlável.

  VSO significa velocidade de estol na configuração de pouso ou velocidade mínima de voo estável,
  na configuração de pouso, na qual o avião é controlável.

  VS1 significa velocidade de estol ou menor velocidade de voo estável obtida em uma determinada
  configuração.

  VTOSS significa velocidade segura de decolagem para aeronaves de asa rotativa Categoria
  A (ou Classe 1 da OACI), isto é, a menor velocidade na qual uma subida pode ser obtida com
  o motor crítico inoperante e os demais motores operando dentro dos limites operacionais
  aprovados.

  VX significa velocidade para melhor ângulo de subida.

  VY significa velocidade para melhor razão de subida.

  V1 significa velocidade de decisão na decolagem (também chamada de velocidade de falha do
  motor crítico).

  V2 significa velocidade segura de decolagem.

  V2min significa velocidade segura mínima de decolagem.

  ANAC significa Agência Nacional de Aviação Civil.

  ADF - Automatic Direction Finder - significa indicador automático de direção.

  AFM - Aircraft Flight Manual - significa manual de voo aprovado da aeronave.

  AGL - Above Ground Level - significa acima do nível do solo.

  ALS - Approach Light System - significa sistema de luzes de aproximação.

  AOM - Aircraft Operating Manual - significa Manual de Operação da Aeronave. (Incluído pela
  Resolução nº 546, de 18.03.2020)

  APU - Auxiliary Power Unit - significa unidade auxiliar de energia.

  ASE - Altimetry System Error - significa erro do sistema de altimetria.

  ASR - Airport Surveillance Radar - significa radar de vigilância de aeródromo.

  ATC - Air Traffic Control - significa controle de tráfego aéreo.

  ATS - Air Traffic Service - significa serviço de tráfego aéreo.

  CAMP - Continuous Airworthiness Maintenance Program - significa programa de manutenção de
  aeronavegabilidade continuada. (Redação dada pela Resolução nº 546, de 18.03.2020)

  CAS - Calibrated Airspeed - significa velocidade calibrada.

  CAT II - Category II - significa operação categoria II.

  CAT III - Category III - significa operação categoria III.

  CDL - Configuration Deviation List - significa Lista de Desvios de Configuração.

  CONSOL ou CONSOLAN - Consolidated Long Range Aid to Navigation - significa uma espécie de
  auxílio à navegação de longo alcance de média ou alta frequência.

  CVR - Cockpit Voice Recorder - significa gravador de voz na cabine de comando.

  CMP - Configuration, Maintenance and Procedures - significa configuração, manutenção e procedimentos.

  DH - Decision Height - significa altura de decisão.

  DME - Distance Measuring Equipment - significa equipamento medidor de distância.

  EAS - Equivalent Airspeed - significa velocidade equivalente.

  ELT - Emergency Locator Transmitter - significa transmissor localizador de emergência.

  ETOPS - Extended Operations - significa operações prolongadas.

  FATO - Final Approach and Take-Off Area - significa área de aproximação final e de decolagem.

  FDR - Flight Data Recorder - significa gravador de dados de voo. (Incluído pela Resolução
  nº 546, de 18.03.2020)

  FM - Fan Marker - significa marcador rádio que emite sinal na vertical com a forma de lóbulos.

  GBAS - Ground-Based Augmentation System - significa sistema de aumentação baseado em terra.
  (Incluído pela Resolução nº 685, de 13.07.2022)

  GLS - GBAS Landing System - significa sistema de pouso por GBAS. (Incluído pela Resolução
  nº 685, de 13.07.2022)

  GS - Glide Slope - significa rampa de planeio.

  HIRL - High-Intensity Runway Light system - significa sistema de iluminação de pista de
  alta intensidade.

  IAS - Indicated Airspeed - significa velocidade indicada.

  IFR - Instrument Flight Rules - significa regras do voo por instrumentos.

  IFSD - In-Flight Shutdown - significa corte do motor em voo.

  ILS - Instrument Landing System - significa sistema de pouso por instrumento.

  IM - ILS inner Mark - significa marcador interno do ILS.

  LDA - Localizer-Type Directional Aid - significa auxílio direcional tipo localizador.

  LOC - Localizer - significa o localizador de um ILS.

  M significa número MACH.

  MAA - Maximum Authorized IFR Altitude - significa altitude máxima autorizada em IFR.

  MALS - Medium intensity Approach Light System - significa sistema de luzes de aproximação
  de média intensidade.

  MALSR - Medium intensity Approach Light System with Runway Alignment Indicator Lights -
  significa sistema de luzes de aproximação de média intensidade, com luzes indicadoras do
  alinhamento com a pista.

  MDA - Minimum Descent Altitude - significa altitude mínima de descida.

  MEA - Minimum En Route IFR Altitude - significa altitude mínima em rota em voo IFR.

  MEL - Minimum Equipment List - significa lista de equipamentos mínimos.

  MLS - Microwave Landing System - significa sistema de pouso por micro-ondas. (Incluído pela
  Resolução nº 685, de 13.07.2022)

  MM - ILS Middle Mark - significa marcador médio do ILS. (Redação dada pela Resolução nº
  685, de 13.07.2022)

  MMEL - Master Minimum Equipment List - significa lista mestra de equipamentos mínimos.

  MSL - Mean Sea Level - significa nível médio do mar.

  NAT-HLA - North Atlantic High Level Airspace - significa Espaço Aéreo NAT-HLA. (Incluído
  pela Resolução nº 546, de 18.03.2020)

  NDB - Non Directional Beacon - significa rádio-farol não direcional.

  OEI - One Engine Inoperative - significa um motor inoperante.

  OM - ILS Outer Marker - significa Marcador externo do ILS.

  PAR - Precision Approach Radar - significa radar de aproximação de precisão.

  PBN - Performance-based Navigation - significa Navegação Baseada em Desempenho. (Incluído
  pela Resolução nº 546, de 18.03.2020)

  RAB significa Registro Aeronáutico Brasileiro.

  RBAC significa Regulamento Brasileiro da Aviação Civil.

  RFFS - Rescue and Firefighting Services - significa serviços de salvamento e de combate
  ao fogo.

  RNAV - Area Navigation - significa navegação de área.

  RNP - Required Navigation Performance - significa desempenho de navegação requerido.

  RVR - Runway Visual Range - significa alcance visual na pista. (Redação dada pela Resolução
  nº 546, de 18.03.2020)

  RVSM - Reduced Vertical Separation Minimum - significa Separação Vertical Mínima Reduzida.
  (Incluído pela Resolução nº 546, de 18.03.2020)

  SAE significa Serviços Aéreos Especializados.

  SBAS - Satellite-Based Augmentation Systems - significa sistema de aumentação baseado em
  satélite. (Incluído pela Resolução nº 685, de 13.07.2022)

  TAS - True Airspeed - significa velocidade verdadeira.

  TAWS - Terrain awareness and warning system - significa Sistema de percepção e alarme de
  proximidade do solo. (Incluído pela Resolução nº 546, de 18.03.2020)

  TCAS - Traffic alert and Collision Avoidance System - significa sistema de alerta de tráfego
  e prevenção de colisões.

  VFR - Visual Flight Rules - significa regras do voo visual.

  VFTO significa velocidade final de decolagem. (Incluído pela Resolução nº 546, de 18.03.2020)

  VHF - Very High Frequency - significa um rádio que opera em frequências muito altas.

  VOR - Very High Frequency Omnirange - significa uma estação de solo que opera em VHF e emite
  sinais onidirecionais.

  VSR significa velocidade de referência de estol. (Incluído pela Resolução nº 546, de 18.03.2020)

  VSRO significa velocidade de referência de estol em configuração de pouso. (Incluído pela
  Resolução nº 546, de 18.03.2020)

  VSR1 significa velocidade de referência de estol obtida em uma determinada configuração.
  (Incluído pela Resolução nº 546, de 18.03.2020)

  VSW significa velocidade na qual ocorre alerta de estol natural ou artificial. (Incluído
  pela Resolução nº 546, de 18.03.2020)'
