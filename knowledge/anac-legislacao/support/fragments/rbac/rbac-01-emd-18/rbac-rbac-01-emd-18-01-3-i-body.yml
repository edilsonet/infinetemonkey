title: Unidades de Medida
text: '01.3-I Unidades de Medida

  As unidades de medida usadas em operações no ar ou no solo, incluindo nos mostradores de
  instrumentos de bordo ou de solo, são aquelas definidas na norma NBR 7234 - Unidades de
  medidas de uso em aeronáutica, Ago. 1993, da Associação Brasileira de Normas Técnicas -
  ABNT.

  (Seção com redação dada pela Resolução nº 200, de 13.09.2011)'
