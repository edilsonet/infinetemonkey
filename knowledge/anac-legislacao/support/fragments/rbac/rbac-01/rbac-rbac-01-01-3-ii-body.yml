title: Disposições Finais
text: '01.3-II Disposições Finais

  Nas definições constantes deste regulamento, quando houver menção a um RBAC ainda não emitido,
  deverá ser considerado como referência o RBHA correspondente em vigor, até que este seja
  substituído pelo RBAC apropriado.'
