title: 11.21(b)
text: '(b) A solicitação deve conter as seguintes informações:


  (1) identificação do solicitante;


  (2) identificação completa dos atos e dispositivos a serem alterados, no caso de solicitação
  de

  alteração de regra;


  (3) texto da proposta de regra a ser emitida ou alterada; e


  (4) informações, pontos de vista ou argumentos que fundamentem a solicitação, bem como as

  razões pelas quais o atendimento ao pedido seria do interesse público.'
