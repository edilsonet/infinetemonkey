text: '(d) A ANAC poderá submeter solicitações de emissão ou alteração de regras ou propostas
  delas

  derivadas a consulta pública, observado o disposto na Instrução Normativa de que trata o
  parágrafo

  11.1(b). (Redação dada pela Resolução nº 548, de 20.03.2020)


  Data da emissão: 24 de março de 2020.


  SUBPARTE C

  PROCEDIMENTO PARA SOLICITAÇÃO DE ISENÇÃO'
