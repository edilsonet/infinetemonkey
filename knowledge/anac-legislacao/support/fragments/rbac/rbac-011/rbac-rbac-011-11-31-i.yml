title: 11.31(i)
text: '(i) não afetaria a segurança das operações ou atenderia ao interesse público em um
  nível de

  segurança aceitável; e


  (ii) não produziria impactos adversos no nível de proteção ambiental ou atenderia ao

  interesse público em um nível de proteção ambiental aceitável.

  (Redação dada pela Resolução nº 501, de 12.12.2018)'
