title: 11.41(c)
text: '(c) A ANAC poderá submeter solicitações de nível equivalente de segurança a consulta
  pública

  ou outros instrumentos de participação social, observados a complexidade da matéria e o
  potencial

  de implementação de projetos, procedimentos ou equipamentos semelhantes por outros agentes

  regulados.'
