title: aplicabilidade(a)
text: '(a) Este Regulamento estabelece as regras gerais para solicitação de emissão e alteração
  de regras

  ou requisitos constantes das resoluções e dos Regulamentos Brasileiros da Aviação Civil
  - RBAC,

  bem como de concessão de isenções e de reconhecimento de níveis equivalentes de segurança

  relacionados às resoluções, aos RBAC e às condições especiais.'
