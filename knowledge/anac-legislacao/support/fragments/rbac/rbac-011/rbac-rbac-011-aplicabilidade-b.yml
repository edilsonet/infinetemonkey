text: '(b) Os procedimentos e as boas práticas considerados pela ANAC para a avaliação das
  solicitações

  de que trata o parágrafo 11.1(a) são estabelecidos na Instrução Normativa que disciplina
  as diretrizes

  e os procedimentos para o processo regulatório e a melhoria contínua da qualidade regulatória.


  (Redação dada pela Resolução nº 548, de 20.03.2020)


  Data da emissão: 24 de março de 2020.


  SUBPARTE B

  PROCEDIMENTO PARA A PROPOSIÇÃO DE REGRAS E EMENDAS AOS

  REGULAMENTOS BRASILEIROS DE AVIAÇÃO CIVIL (Redação dada pela

  Resolução nº 548, de 20.03.2020)'
