title: 31.14(b)
text: '(b) Peso máximo. O peso máximo é o maior peso

  para o qual foi demonstrado cumprimento com cada

  requisito aplicável deste RBAC. O peso máximo deve

  ser estabelecido de modo que não seja maior que:


  (1) O maior peso selecionado pelo requerente;


  (2) O peso máximo de projeto, que é o maior peso

  para o qual foi demonstrado cumprimento com as

  condições de carregamento estruturais aplicáveis deste

  RBAC; ou


  (3) O maior peso para o qual foi demonstrado cum-

  primento com cada requisito de voo aplicável deste

  RBAC.


  Data da emissão: 16 de outubro de 2015 RBAC nº 31'
