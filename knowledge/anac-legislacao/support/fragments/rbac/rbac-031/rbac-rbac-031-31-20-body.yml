text: '31.20

  Controlabilidade


  O requerente deve demonstrar que o balão é contro-

  lável e manobrável com segurança durante a decola-

  gem, subida, descida e pouso, sem requerer habilidade

  excepcional do piloto.


  Data da emissão: 16 de outubro de 2015 RBAC nº 31


  SUBPART C

  STRENGTH REQUIREMENTS'
