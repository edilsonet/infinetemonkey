title: 31.25(b)
text: '(b) No projeto do envelope deve ser utilizado um

  fator de segurança de pelo menos cinco (5). Poderá ser

  utilizado um fator de segurança reduzido de pelo me-

  nos dois (2) se for demonstrado que o fator escolhido

  evitará falhas devido a uma ruptura lenta ou instantâ-

  nea na falta de um limitador de propagação de rasgo.

  O fator escolhido deve ser aplicado para a condição

  mais crítica de pressão máxima de operação, ou tensão

  máxima do envelope.'
