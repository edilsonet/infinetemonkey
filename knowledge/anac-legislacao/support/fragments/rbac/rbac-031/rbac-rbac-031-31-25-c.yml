title: 31.25(c)
text: '(c) Um fator de segurança de pelo menos cinco (5)

  deve ser utilizado no projeto de todas as partes em

  fibra ou não-metálicas do cordame, e respectivas fixa-

  ções do envelope na gôndola, trapézio, ou outros mei-

  os providos para acomodar os ocupantes. As fixações

  primárias do envelope à gôndola, trapézio, ou outros

  meios para acomodar os passageiros, devem ser proje-

  tadas tal que as falhas sejam extremante remotas ou,

  então, que qualquer falha simples não coloque em

  risco a segurança de voo.'
