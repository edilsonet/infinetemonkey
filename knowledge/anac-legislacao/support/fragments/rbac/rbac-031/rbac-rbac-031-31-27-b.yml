title: 31.27(b)
text: '(b) Deve ser demonstrado por meio de ensaios que

  a estrutura é capaz de resistir às cargas finais durante

  pelo menos três segundos sem falhas. Para o envelope

  é aceitável o ensaio de uma porção representativa do

  mesmo, se a porção ensaiada for grande o suficiente

  para incluir costuras críticas, juntas, e pontos de fixa-

  ção de cargas e componentes.'
