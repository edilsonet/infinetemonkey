cite: 31.27(c)
title: 31.27(c)
text: '(c) Deve ser realizado um ensaio de queda livre fi-

  nal com a gôndola, o trapézio, ou outro dispositivo

  previsto para acomodar os ocupantes. O ensaio deve

  ser realizado com o peso máximo de projeto em uma

  superfície horizontal, com a gôndola, trapézio, ou ou-

  tro meio de transportar os ocupantes, atingindo a su-

  perfície em ângulos de 0º, 15º e 30º. O peso pode ser

  distribuído para simular as condições reais. Não pode

  haver deformação ou falha que possa causar ferimen-

  tos sérios aos ocupantes. O ensaio de queda livre deve

  ser realizado com uma altura de queda de 36 polega-

  das (0,91 m), ou uma altura que produza no impacto

  uma velocidade igual à velocidade vertical máxima

  determinada de acordo com a seção 31.19 deste

  RBAC, aquela que for maior, deve ser utilizada.


  Data da emissão: 16 de outubro de 2015 RBAC nº 31


  SUBPART D

  DESIGN CONSTRUCTION'
