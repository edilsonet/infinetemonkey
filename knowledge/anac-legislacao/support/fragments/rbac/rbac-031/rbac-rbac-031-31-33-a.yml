title: 31.33(a)
text: '(a) A adequabilidade e durabilidade de todos os

  materiais devem ser estabelecidas com base na experi-

  ência ou ensaios. Os materiais devem cumprir com

  especificações aprovadas que garantam ter a resistên-

  cia e outras propriedades adotadas nos dados de proje-

  to.'
