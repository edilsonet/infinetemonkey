text: '31.35

  Processos de fabricação.


  Os processos de fabricação utilizados devem pro-

  duzir uma estrutura consistentemente confiável. Se o

  processo de fabricação requerer um controle rígido

  para alcançar este objetivo, o processo deve ser desen-

  volvido de acordo com uma especificação de processo

  aprovada.'
