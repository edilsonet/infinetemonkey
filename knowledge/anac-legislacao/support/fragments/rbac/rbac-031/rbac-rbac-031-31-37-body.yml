text: '31.37

  Fixações.


  Na estrutura podem ser usados somente parafusos,

  porcas, pinos roscados, pinos e rebites aprovados. De-

  vem ser usados dispositivos ou métodos de travamento

  aprovados para todos estes parafusos, porcas, pinos

  roscados e pinos, a menos que se demonstre que a

  instalação seja livre de vibrações. Porcas autotravantes

  não podem ser utilizadas em parafusos que estejam

  sujeitos a rotação quando em serviço.'
