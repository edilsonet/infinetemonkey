title: 31.43(a)
text: '(a) Um fator de conexão de pelo menos 1,15 deve

  ser utilizado nas análises de cada conexão cuja resis-

  tência não foi comprovada por ensaios de carga limite

  e final, nos quais reais condições de esforço foram

  simuladas na conexão e estrutura adjacente. Este fator

  aplica-se a todas as partes da conexão, aos meios de

  fixação e aos suportes em membros conectados.'
