text: '31.45

  Células a combustível.


  Se forem utilizadas células a combustível, as mes-

  mas, suas fixações e estrutura suporte devem demons-

  trar em ensaios ser capazes de suportar quaisquer car-

  gas de inércia às quais esteja sujeita a instalação, in-

  cluindo o ensaio de queda livre prescrito no parágrafo

  31.27(c) deste RBAC, sem deformações prejudiciais

  ou falhas. Nos ensaios, as células a combustível de-

  vem ser submetidas à carga e pressão equivalentes à

  condição de quantidade máxima de combustível.'
