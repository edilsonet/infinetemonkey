text: '31.46

  Sistemas de combustível pressurizado.


  Para sistemas de combustível pressurizado, cada

  elemento, suas conexões e linhas conectadas devem

  ser testados para uma pressão final de pelo menos du-

  as vezes a pressão máxima à qual o sistema estará

  sujeito na condição normal de operação. Nenhuma


  Data da emissão: 16 de outubro de 2015 RBAC nº 31


  normal operation. No part of the system

  may fail or malfunction during the test.


  The test configuration must be repre-

  sentative of the normal fuel system instal-

  lation and balloon configuration.'
