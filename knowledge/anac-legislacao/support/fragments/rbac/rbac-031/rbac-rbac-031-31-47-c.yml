title: 31.47(c)
text: '(c) Deve haver controles, instrumentos, ou outros

  equipamentos essenciais para o controle e operação

  seguros do aquecedor. Deve ser demonstrado que es-

  tes meios são capazes de desempenhar suas funções

  pretendidas durante operações normais e de emergên-

  cia.'
