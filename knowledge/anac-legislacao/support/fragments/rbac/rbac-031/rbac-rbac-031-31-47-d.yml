title: 31.47(d)
text: '(d) O sistema de queima (incluindo as unidades de

  queima, controles, linhas de combustível, células de

  combustível, reguladores, válvulas de controle, e ou-

  tros elementos relacionados) deve estar substanciado

  por um ensaio de durabilidade de pelo menos 40 ho-

  ras. Cada elemento do sistema deve ser instalado e

  ensaiado simulando o uso e a instalação real no balão.


  (1) O programa de ensaio para a operação da válvu-

  la principal de combustível do queimador deve incluir:'
