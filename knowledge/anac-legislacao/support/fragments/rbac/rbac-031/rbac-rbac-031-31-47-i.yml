text: '(i) Cinco horas na pressão máxima de combustível

  para a qual a aprovação é solicitada, com um tempo de

  queima de três a dez segundos, para cada ciclo de um

  minuto. O tempo de queima deve ser estabelecido de

  modo a resultar no choque térmico máximo nos ele-

  mentos afetados pela temperatura;


  (ii) Sete horas e meia a uma pressão de combustível

  intermediária, com um tempo de queima de três a dez

  segundos, para cada ciclo de um minuto. Uma pressão


