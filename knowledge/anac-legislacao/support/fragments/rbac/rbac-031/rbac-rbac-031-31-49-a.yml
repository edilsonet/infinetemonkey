cite: 31.49(a)
title: 31.49(a)
text: '(a) Each control must operate easily,

  smoothly, and positively enough to allow

  proper performance of its functions. Con-

  trols must be arranged and identified to

  provide for convenience of operation and

  to prevent the possibility of confusion and

  subsequent inadvertent operation.'
