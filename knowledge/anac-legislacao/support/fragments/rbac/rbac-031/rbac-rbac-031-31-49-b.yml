text: '(b) Each control system and operating

  device must be designed and installed in a

  manner that will prevent jamming, chaf-

  ing, or interference from passengers, car-

  go, or loose objects. Precaution must be

  taken to prevent foreign objects from

  jamming the controls. The elements of the

  control system must have design features

  or must be distinctly and permanently

  de combustível intermediaria é 40% a 60% da faixa

  entre a pressão máxima de combustível referenciada

  no parágrafo (d)(1)(i) desta seção e a pressão mínima

  de combustível referenciada no parágrafo (d)(1)(iii);


  (iii) Seis horas e quinze minutos na pressão de

  combustível mínima para qual a aprovação é prevista,

  com um tempo de queima de três a dez segundos para

  cada ciclo de um minuto;


  (iv) Quinze minutos de operação no vapor, com um

  tempo de queima de pelo menos 30 segundos para

  cada ciclo de um minuto; e'
