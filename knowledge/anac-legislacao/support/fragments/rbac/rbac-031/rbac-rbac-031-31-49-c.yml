title: 31.49(c)
text: '(c) Each balloon using a captive gas as

  the lifting means must have an automatic

  valve or appendix that is able to release

  gas automatically at the rate of at least

  three percent of the total volume per mi-

  nute when the balloon is at its maximum

  operating pressure.'
