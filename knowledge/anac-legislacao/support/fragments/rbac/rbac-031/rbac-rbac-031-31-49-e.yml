title: 31.49(e)
text: '(e) Each hot air balloon must have a

  means to indicate the maximum envelope

  skin temperatures occurring during opera-

  tion. The indicator must be readily visible

  to the pilot and marked to indicate the lim-

  iting safe temperature of the envelope ma-

  terial. If the markings are on the cover

  glass of the instrument, there must be pro-

  visions to maintain the correct alignment

  of the glass cover with the face of the dial.'
