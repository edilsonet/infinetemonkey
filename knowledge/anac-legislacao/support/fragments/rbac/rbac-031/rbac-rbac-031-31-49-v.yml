title: 31.49(v)
text: '(v) Quinze horas de operação normal de voo.


  (2) O programa de ensaio para a operação secundá-

  ria ou de reserva do queimador deve incluir seis horas

  de operação com um tempo de queima de um minuto

  para cada ciclo de cinco minutos, a uma pressão de

  combustível intermediaria.'
