text: '31.51

  Lastro.


  Cada balão a gás cativo deve ter meios para permi-

  tir a armazenagem segura e a liberação controlada do

  lastro. O lastro deve consistir de material que, se libe-

  rado durante o voo, não ofereça risco às pessoas no

  solo.'
