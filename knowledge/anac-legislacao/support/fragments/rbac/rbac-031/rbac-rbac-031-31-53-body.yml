text: '31.53

  Cordas de arrasto.


  Se forem utilizadas cordas de arrasto, as extremi-

  dades das mesmas, que são lançadas ao ar, devem ser

  enrijecidas para impedir que enrosquem em árvores,

  fios, ou outros objetos no solo.'
