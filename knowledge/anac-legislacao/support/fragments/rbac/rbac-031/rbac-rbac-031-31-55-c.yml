cite: 31.55(c)
title: 31.55(c)
text: '(c) Cada balão utilizando gás cativo como meio de

  sustentação deve ter uma válvula automática ou dispo-

  sitivo que libere gás, automaticamente, a razão de pelo

  menos 3% do volume total por minuto, quando o ba-

  lão está na sua pressão máxima de funcionamento.'
