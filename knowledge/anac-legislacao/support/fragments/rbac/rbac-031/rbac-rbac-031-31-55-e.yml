cite: 31.55(e)
title: 31.55(e)
text: '(e) Cada balão de ar quente deve ter um meio que

  indique as temperaturas máximas do revestimento do

  envelope que ocorrem durante a operação. O indicador

  deve ser facilmente visível ao piloto e ter marcas para

  indicar os limites seguros de temperatura do material

  do envelope. Se as marcas estão sobre o vidro que

  cobre o indicador, deve haver provisões para manter

  um correto alinhamento do vidro com o indicador.'
