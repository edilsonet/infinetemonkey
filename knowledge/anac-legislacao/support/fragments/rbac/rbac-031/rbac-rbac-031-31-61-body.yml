text: '31.61

  Descarga estática.


  O projeto de balões que utilizam gás como meio de

  sustentação deve prever meios apropriados de aterra-

  mento, a menos que seja demonstrado não ser necessá-

  rio para a segurança. Isto para garantir que os efeitos

  dos descarregadores estáticos não criarão um perigo.'
