title: 31.63(a)
text: '(a) Deve haver um cinto de segurança, arnês, ou

  outro meio de retenção para cada ocupante, a menos

  que a ANAC considere desnecessário. O cinto, arnês,

  ou outro meio de retenção e suas fixações, devem

  atender aos requisitos de resistência da subparte C

  deste RBAC.


  Data da emissão: 16 de outubro de 2015 RBAC nº 31


  ments of Subpart C of this RBAC.'
