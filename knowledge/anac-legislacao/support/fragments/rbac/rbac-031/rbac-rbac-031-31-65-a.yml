title: 31.65(a)
text: '(a) Se as luzes de posição estiverem instaladas, de-

  ve-se ter uma luz branca de aviação contínua e uma

  luz vermelha de aviação intermitente (ou branca de

  aviação intermitente) com uma frequência efetiva de

  brilho de pelo menos 40, mas não maior que 100 ci-

  clos por minuto.'
