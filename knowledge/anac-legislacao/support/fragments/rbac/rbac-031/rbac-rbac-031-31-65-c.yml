title: 31.65(c)
text: '(c) A luz branca contínua deve estar localizada não

  mais do que a 20 pés (6,10m) abaixo da gôndola, tra-

  pézio, ou outro meio de acomodar os ocupantes. As

  lâmpadas intermitentes vermelhas ou brancas devem

  estar localizadas a não menos que 7 pés (2,13m), e não

  mais que 10 pés (3,05m), abaixo da luz branca contí-

  nua.'
