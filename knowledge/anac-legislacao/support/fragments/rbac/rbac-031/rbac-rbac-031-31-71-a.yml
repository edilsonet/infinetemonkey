cite: 31.71(a)
title: 31.71(a)
text: '(a) Cada item do equipamento instalado deve:


  (1) Ser de um tipo e projeto apropriado à função

  pretendida;


  (2) Estar marcado de maneira permanente e legível

  ou, se o item for muito pequeno para ser marcado,

  deverá ser etiquetado para sua identificação, função,

  ou limites operacionais, ou qualquer combinação apli-

  cável destes fatores;


  (3) Ser instalado de acordo com as limitações espe-

  cificadas para cada equipamento; e


  (4) Funcionar apropriadamente, quando instalado.'
