title: 31.81(i)
text: '(i) The empty weight determined under

  section 31.16 of this RBAC;


  (ii) The rate of climb determined under

  section 31.17 of this RBAC, and the pro-

  cedures and conditions used to determine

  performance;


  (iii) The maximum vertical velocity, the

  altitude drop required to attain that veloci-

  ty, and altitude drop required to recover

  from a descent at that velocity, determined

  under section 31.19 of this RBAC, and the

  procedures and conditions used to deter-

  mine performance; and


  (iv) Pertinent information peculiar to

  the balloon''s operating characteristics.'
