title: Instruções de Aeronavegabilidade Continua-
text: '31.82 Instruções de Aeronavegabilidade Continua-

  da.


  O requerente deve elaborar Instruções para Aero-

  navegabilidade Continuada de acordo com o Apêndice

  A deste RBAC que são aceitáveis para a ANAC. As

  instruções podem estar incompletas à época da emis-

  são do certificado de tipo se existir um programa que

  garanta que as instruções estarão completas antes da

  entrega do primeiro balão ou na emissão do certifica-

  do de aeronavegabilidade padrão, aquilo que ocorrer

  depois.'
