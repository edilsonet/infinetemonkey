title: Visibilidade.
text: '31.83 Visibilidade.


  A superfície exterior do envelope deve ser de uma

  cor ou cores contrastantes de modo que seja facilmen-

  te visível durante sua operação. Entretanto, são aceitá-

  veis bandeiras ou fitas multicoloridas se for demons-

  trado que estas são grandes o suficiente e que haja um

  número suficiente delas de cores contrastantes para

  que o balão seja visível durante o voo.'
