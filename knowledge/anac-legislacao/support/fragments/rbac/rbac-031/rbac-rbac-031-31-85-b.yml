cite: 31.85(b)
title: 31.85(b)
text: '(b) Para balões de ar quente:


  (1) um medidor de quantidade de combustível. Se

  forem utilizadas células de combustível, devem ser

  incorporados meios para indicar à tripulação a quanti-

  dade de combustível em cada célula durante o voo. Os

  meios devem ser calibrados em unidades apropriadas

  ou em porcentagem de capacidade da célula de com-

  bustível.


  Data da emissão: 16 de outubro de 2015 RBAC nº 31


  (2) An envelope temperature indicator.'
