cite: A31.1(b)
title: A31.1(b)
text: '(b) As Instruções para Aeronavegabilidade Conti-

  nuada para cada balão devem incluir as Instruções

  para Aeronavegabilidade Continuada de todas as pe-

  ças e componentes do balão, requeridas pelos

  RBHA/RBAC, e qualquer informação necessária rela-

  tiva à interface destas peças e componentes, com o

  balão. Se não são fornecidas Instruções para Aerona-

  vegabilidade Continuada pelos fabricantes das peças e

  componentes, as Instruções para Aeronavegabilidade

  Continuada para o balão devem incluir as informações

  essenciais para a aeronavegabilidade continuada do

  balão.'
