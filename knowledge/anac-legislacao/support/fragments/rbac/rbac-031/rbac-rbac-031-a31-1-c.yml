text: '(c) O requerente deve submeter à ANAC um pro-

  grama para mostrar como modificações das Instruções

  para Aeronavegabilidade Continuada realizadas pelo

  requerente ou pelo fabricante de peças e componentes

  do balão serão distribuídas.'
