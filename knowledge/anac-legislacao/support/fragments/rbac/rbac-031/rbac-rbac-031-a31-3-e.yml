cite: A31.3(e)
title: A31.3(e)
text: '(e) Informações de manutenção para cada peça ou

  componente do balão e seu envelope, controles, cor-

  dame, estrutura da gôndola, sistema de combustível,

  instrumentos, e conjunto do aquecedor que forneçam

  os períodos recomendados na qual devem ser limpos,

  ajustados, ensaiados, e lubrificados, e tolerâncias apli-

  cáveis de desgaste, e o tipo de trabalho recomendado

  neste período. Entretanto, o requerente pode referenci-

  ar o fabricante de um acessório, instrumento, ou equi-

  pamento como fonte para esta informação, se o reque-

  rente demonstrar que o item apresenta um grau de

  complexidade excepcionalmente alto que exija técni-

  cas de manutenção, equipamentos de ensaios ou co-

  nhecimento especializados. Os intervalos de revisão

  recomendados e as correspondentes referências à se-

  ção de Limitações de Aeronavegabilidade deste ma-

  nual devem, também, ser incluídos. Além disso, o

  requerente deve incluir um programa de inspeção que

  contenha as frequências e nível das inspeções necessá-

  rias para garantir a aeronavegabilidade continuada do

  balão.'
