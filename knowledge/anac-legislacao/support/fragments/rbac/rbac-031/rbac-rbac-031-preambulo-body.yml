cite: preambulo
title: PREÂMBULO
text: 'PREÂMBULO


  Para aprovação no Brasil, quanto à aeronavegabilidade de balões livres tripulados, será
  utilizado como referência o

  regulamento Title 14 Code of Federal Regulations Part 31, Emenda 31-7, em vigor desde 24
  de maio de 1996, da

  autoridade de aviação civil Federal Aviation Administration - FAA, do Department of Transportation
  dos Estados

  Unidos da América, o qual é republicado no corpo deste RBAC, com as adaptações necessárias
  e traduzido para a Lín-

  gua Portuguesa, a partir do original contido no sítio oficial de publicação do regulamento
  em referência:

  http://ecfr.gpoaccess.gov.


  O número da emenda deste RBAC é equivalente ao número da emenda do regulamento utilizado
  como referência para a

  sua elaboração.


  SECTION CONTENTS


  SUBPART A - GENERAL'
