title: 34.1(a)
text: '(a) Este regulamento estabelece os requisitos relativos a:

  (1) Prevenção de drenagem intencional de combustível de aeronaves com motores a turbina;
  e

  (2) Emissões de fumaça, gases e material particulado de motores turbojato e turbofan para

  propulsão em velocidades subsônicas ou supersônicas, como aplicável.'
