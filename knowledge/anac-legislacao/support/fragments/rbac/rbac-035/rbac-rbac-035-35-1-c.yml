title: 35.1(c)
text: '(c) An applicant is eligible for a propeller

  type certificate and changes to those certificates

  after demonstrating compliance with subparts

  A, B and C of this RBAC. However, the propel-

  ler may not be installed on an airplane unless

  the applicant has shown compliance with para-

  graph 23.2400(c) of RBAC 23 or 25.907 of

  RBAC 25, as applicable, or compliance is not

  required for installation on that airplane. (Reda-

  ção dada pela Resolução nº 524, de 02.08.2019)'
