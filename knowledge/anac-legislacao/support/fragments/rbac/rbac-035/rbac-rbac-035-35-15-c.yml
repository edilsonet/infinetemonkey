title: 35.15(c)
text: '(c) As falhas principais de certos elementos

  unitários de hélices (por exemplo, pás) não po-

  dem ser sensatamente estimadas em termos nu-

  méricos. Se for provável que a falha de tais

  elementos resulte em efeitos hazardous de héli-

  ce, estes elementos devem ser identificados co-

  mo partes críticas de hélice. Para partes críticas

  de hélice, o requerente deve satisfazer os requi-

  sitos de integridade prescritos na seção 35.16.

  Esses casos devem ser citados na análise de

  segurança. (Redação dada pela Resolução nº

  486, de 09.08.2018)'
