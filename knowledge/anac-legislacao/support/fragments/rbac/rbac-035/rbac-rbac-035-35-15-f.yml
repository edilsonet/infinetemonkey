title: 35.15(f)
text: '(f) Se aplicável, a análise de segurança deve

  incluir, mas não se limitar a, avaliações de equi-

  pamentos de indicação, controles automáticos e

  manuais, governadores e sistemas de controle de

  hélice, sincronizadores de fase, sincronizadores

  e sistemas de reversão de tração de hélice.'
