title: 35.17(a)
text: '(a) A adequação e a durabilidade dos materi-

  ais usados na hélice devem:

  (1) ser estabelecidas com base na experiên-

  cia, em ensaios ou em ambos;

  (2) considerar as condições ambientais espe-

  radas em serviço.'
