text: '35.2

  Configuração da hélice


  O requerente deve fornecer uma lista de to-

  dos os componentes, incluindo referências aos

  desenhos relevantes e aos dados de projeto de

  software, que definem o projeto de tipo da héli-

  ce a ser aprovado segundo a seção 21.31 do

  RBAC 21.'
