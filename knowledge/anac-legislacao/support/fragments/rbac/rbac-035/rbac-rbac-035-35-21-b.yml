text: '(b) Para hélices que incorporam um método

  para selecionar um passo de pá abaixo do passo


  Data da emissão: 7 de agosto de 2019 RBAC nº 35


  position, provisions must be made to sense and

  indicate to the flight crew that the propeller

  blades are below that position by an amount

  defined in the installation manual. The method

  for sensing and indicating the propeller blade

  pitch position must be such that its failure does

  not affect the control of the propeller.'
