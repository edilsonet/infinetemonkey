title: 35.22(a)
text: '(a) Hélices embandeiráveis são projetadas

  para embandeirar em todas as condições de voo,

  levando em conta desgaste e vazamento espera-

  dos. Quaisquer limitações de embandeiramento

  e desembandeiramento devem ser documenta-

  das nos manuais apropriados.'
