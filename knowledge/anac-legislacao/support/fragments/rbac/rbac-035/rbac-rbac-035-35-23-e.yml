title: 35.23(e)
text: '(e) The propeller control system must be de-

  signed and constructed so that the loss, interrup-

  tion or abnormal characteristic of airplane-

  supplied electrical power does not result in haz-

  ardous propeller effects. The power quality re-

  quirements must be described in the appropriate

  manuals.'
