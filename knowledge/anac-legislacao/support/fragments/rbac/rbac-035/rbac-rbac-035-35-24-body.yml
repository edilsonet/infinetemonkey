text: '35.24

  Strength


  The maximum stresses developed in the pro-

  peller may not exceed values acceptable to

  ANAC considering the particular form of con-

  struction and the most severe operating condi-

  tions.

  (3) É fornecido um método para indicar que

  uma mudança no modo de operação ocorreu,

  caso uma ação da tripulação seja requerida. Em

  tal evento, devem ser fornecidas instruções ope-

  racionais nos manuais apropriados.'
