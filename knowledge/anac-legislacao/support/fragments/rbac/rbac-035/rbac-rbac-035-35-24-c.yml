title: 35.24(c)
text: '(c) O software embarcado do sistema de

  controle eletrônico da hélice deve ser projetado

  e implementado por um método aprovado pela

  ANAC que seja consistente com a criticalidade

  das funções executadas e que minimize a exis-

  tência de erros de software.'
