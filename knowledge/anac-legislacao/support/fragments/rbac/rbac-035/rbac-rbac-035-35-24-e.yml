title: 35.24(e)
text: '(e) O sistema de controle da hélice deve ser

  projetado e construído tal que a perda, interrup-

  ção ou característica anormal de potência elétri-

  ca suprida pelo avião não resulte em efeitos

  hazardous de hélice. Os requisitos de qualidade

  da energia devem ser descritos nos manuais

  apropriados.'
