text: '(a) instruções para instalação da hélice, as

  quais:


  Data da emissão: 7 de agosto de 2019 RBAC nº 35


  (1) include a description of the operational

  modes of the propeller control system and func-

  tional interface of the control system with the

  airplane and engine systems;

  (2) specify the physical and functional inter-

  faces with the airplane, airplane equipment and

  engine;

  (3) define the limiting conditions on the in-

  terfaces from paragraph (a)(2) of this section;

  (4) list the limitations established under sec-

  tion 35.5 of this RBAC;

  (5) define the hydraulic fluids approved for

  use with the propeller, including grade and

  specification, related operating pressure, and

  filtration levels; and

  (6) state the assumptions made to comply

  with the requirements of this RBAC.'
