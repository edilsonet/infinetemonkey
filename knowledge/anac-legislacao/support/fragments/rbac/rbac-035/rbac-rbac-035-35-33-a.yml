text: '(a) Cada requerente deve confeccionar o(s)

  artigo(s) de teste e os recursos adequados aos

  ensaios, incluindo equipamento e pessoal com-

  petente, e conduzir os ensaios requeridos de

  acordo com o RBAC 21.'
