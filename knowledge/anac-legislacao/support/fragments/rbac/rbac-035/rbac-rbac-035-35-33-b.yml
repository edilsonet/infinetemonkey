title: 35.33(b)
text: '(b) Todos os sistemas de controle automáti-

  cos e sistemas de segurança devem estar em

  operação, a menos que seja considerado pela

  ANAC como impossível ou não requerido devi-

  do à natureza do ensaio. Se for preciso para a

  fundamentação, o requerente pode ensaiar uma

  configuração de hélice diferente, desde que isto

  não constitua um ensaio menos severo.'
