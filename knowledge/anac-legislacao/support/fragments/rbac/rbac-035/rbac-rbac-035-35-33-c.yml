title: 35.33(c)
text: '(c) Quaisquer sistemas ou componentes que

  não possam ser adequadamente fundamentados

  pelo requerente em cumprimento com os requi-

  sitos deste RBAC devem ser submetidos a en-

  saios ou análises adicionais para demonstrar que

  esses sistemas ou componentes são capazes de

  executar suas funções pretendidas em todas as

  condições ambientais e de operação declaradas.'
