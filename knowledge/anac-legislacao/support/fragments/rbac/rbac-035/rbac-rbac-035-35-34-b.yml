title: 35.34(b)
text: '(b) Durante todos os ensaios, somente manu-

  tenção básica e pequenos reparos são permiti-

  dos. Se grandes reparos ou substituição de peça

  forem requeridos, é necessária a aprovação do

  reparo ou da substituição da peça pela ANAC

  antes da sua implementação e ensaios adicionais

  podem ser requeridos. Quaisquer reparos ou

  ações não programados no artigo de teste devem

  ser registrados e informados.'
