title: 35.35(a)
text: '(a) The hub, blade retention system, and

  counterweights must be tested for a period of

  one hour to a load equivalent to twice the max-

  imum centrifugal load to which the propeller

  would be subjected during operation at the max-

  imum rated rotational speed.'
