title: 35.35(b)
text: '(b) Blade features associated with transitions

  to the retention system (for example, a compo-

  site blade bonded to a metallic retention) must

  be tested either during the test of paragraph (a)

  of this section or in a separate component test

  for a period of one hour to a load equivalent to

  twice the maximum centrifugal load to which

  the propeller would be subjected during opera-

  tion at the maximum rated rotational speed.'
