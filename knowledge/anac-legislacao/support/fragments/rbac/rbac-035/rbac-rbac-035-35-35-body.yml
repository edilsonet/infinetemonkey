text: '35.35

  Ensaios de carga centrífuga


  O requerente deve demonstrar que uma héli-

  ce cumpre com os requisitos dos parágrafos (a),


  Data da emissão: 7 de agosto de 2019 RBAC nº 35


  of this section without evidence of failure, mal-

  function, or permanent deformation that would

  result in a major or hazardous propeller effect.

  When the propeller could be sensitive to envi-

  ronmental degradation in service, this must be

  considered. This section does not apply to fixed-

  pitch wood or fixed-pitch metal propellers of

  conventional design.'
