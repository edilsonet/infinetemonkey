title: 35.35(c)
text: '(c) Components used with or attached to the

  propeller (for example, spinners, de-icing

  equipment, and blade erosion shields) must be

  subjected to a load equivalent to 159 percent of

  the maximum centrifugal load to which the

  component would be subjected during operation

  at the maximum rated rotational speed. This

  must be performed by either:

  (1) Testing at the required load for a period

  of 30 minutes; or

  (2) Analysis based on test.'
