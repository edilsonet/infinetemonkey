text: '35.36

  Impacto de pássaro


  O requerente deve demonstrar, por ensaios,

  análises baseadas em ensaios ou experiência em

  projetos similares, que a hélice pode suportar o

  impacto de um pássaro de 4 libras (1,8 kg) no(s)

  local(is) crítico(s) e na(s) condição(ões) de voo

  crítica(s) de uma instalação típica sem que isto

  cause um efeito major ou hazardous de hélice.

  Esta seção não se aplica a hélices de passo fixo

  de madeira com projeto convencional.'
