title: 35.37(a)
text: '(a) Fatigue limits must be established by

  tests, or analysis based on tests, for propeller:

  (1) hubs;

  (2) blades;

  (3) blade retention components; and


  (4) components which are affected by fatigue

  loads and which are shown under section 35.15

  of this RBAC to have a fatigue failure mode

  leading to hazardous propeller effects.'
