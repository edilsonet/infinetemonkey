title: 35.37(b)
text: '(b) Características da pá associadas com

  transições para o sistema de retenção (por

  exemplo, uma pá de material composto unida a

  uma retenção metálica) devem ser ensaiadas

  durante o ensaio do parágrafo (a) desta seção ou

  em um ensaio separado de componente por um

  período de uma hora a uma carga equivalente a

  duas vezes a máxima carga centrífuga à qual a

  hélice estaria sujeita durante operação na máxi-

  ma rotação nominal.'
