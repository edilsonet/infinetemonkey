title: 35.37(c)
text: '(c) Componentes usados com a hélice ou

  presos a ela (por exemplo, carenagens de cubo,

  equipamento de degelo e escudos de proteção

  contra erosão de pá) devem ser submetidos a

  uma carga equivalente a 159 por cento da má-

  xima carga centrífuga à qual o componente esta-

  ria sujeito durante operação na máxima rotação

  nominal. Isto deve ser executado por:

  (1) ensaio na carga requerida por um período

  de 30 minutos; ou

  (2) análise baseada em ensaio.'
