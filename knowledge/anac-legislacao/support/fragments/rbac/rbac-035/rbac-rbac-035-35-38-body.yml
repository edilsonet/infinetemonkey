text: '35.38

  Impacto de descargas atmosféricas


  O requerente deve demonstrar, por ensaios,

  análises baseadas em ensaios ou experiência em

  projetos similares, que a hélice pode suportar

  um impacto de descargas atmosféricas sem que

  isto cause um efeito major ou hazardous de

  hélice. O limite até o qual a hélice foi qualifica-

  da deve ser documentado nos manuais apropria-

  dos. Esta seção não se aplica a hélices de passo

  fixo de madeira com projeto convencional.'
