title: 35.39(a)
text: '(a) Fixed-pitch and ground adjustable-pitch

  propellers must be subjected to one of the fol-

  lowing tests:

  (1) a 50-hour flight test in level flight or in

  climb. The propeller must be operated at takeoff

  power and rated rotational speed during at least

  five hours of this flight test, and at not less than

  90 percent of the rated rotational speed for the

  remainder of the 50 hours; or

  (2) a 50-hour ground test at takeoff power

  and rated rotational speed.'
