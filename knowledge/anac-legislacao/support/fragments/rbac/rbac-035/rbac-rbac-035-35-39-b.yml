text: '(b) Os limites de fadiga devem levar em con-

  ta:

  (1) todos os padrões de carga cíclica e de

  carga de vibração conhecidos e razoavelmente

  previsíveis que são esperados em serviço; e

  (2) deterioração em serviço esperada, varia-

  ções nas propriedades dos materiais, variações

  de manufatura e efeitos ambientais.'
