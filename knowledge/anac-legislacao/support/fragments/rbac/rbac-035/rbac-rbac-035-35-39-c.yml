cite: 35.39(c)
title: 35.39(c)
text: '(c) Deve ser conduzida uma avaliação de fa-

  diga da hélice para demonstrar que efeitos ha-

  zardous de hélice decorrentes de fadiga serão

  evitados ao longo de toda a vida operacional

  pretendida da hélice, seja:

  (1) no avião pretendido, por meio do cum-

  primento com o parágrafo 23.2400(c) do RBAC

  23 ou a seção 25.907 do RBAC 25, conforme

  aplicável; ou (Redação dada pela Resolução nº

  524, de 02.08.2019)

  (2) em um avião típico.'
