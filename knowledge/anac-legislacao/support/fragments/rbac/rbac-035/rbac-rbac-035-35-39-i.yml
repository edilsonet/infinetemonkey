cite: 35.39(i)
title: 35.39(i)
text: '(i) five hours at takeoff power and rotational

  speed and thirty 10-minute cycles composed of:


  (A) acceleration from idle;

  (B) five minutes at takeoff power and rota-

  tional speed;

  (C) deceleration; and

  (D) five minutes at idle.

  (ii) fifty hours at maximum continuous pow-

  er and rotational speed,

  (iii) fifty hours, consisting of ten 5-hour cy-

  cles composed of:

  (A) ive accelerations and decelerations be-

  tween idle and takeoff power and rotational

  speed,

  (B) four and one half hours at approximately

  even incremental conditions from idle up to, but

  not including, maximum continuous power and

  rotational speed, and

  (C) thirty minutes at idle.

  (2) the operation of the propeller throughout

  the engine endurance tests prescribed in RBAC

  33.'
