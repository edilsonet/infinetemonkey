text: '35.4

  Instruções para aeronavegabilidade

  continuada


  O requerente deve preparar Instruções para

  Aeronavegabilidade Continuada de acordo com

  o Apêndice A deste RBAC que sejam aceitáveis

  para a ANAC. As instruções podem estar in-

  completas na emissão do certificado de tipo se

  existir um programa que assegure que elas esta-

  rão completas antes da entrega da primeira ae-

  ronave com a hélice instalada, ou quando da

  emissão do certificado de aeronavegabilidade

  padrão para uma aeronave que tenha a hélice

  instalada, o que ocorrer por último.'
