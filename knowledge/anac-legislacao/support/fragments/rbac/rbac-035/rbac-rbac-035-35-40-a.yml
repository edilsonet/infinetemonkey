title: 35.40(a)
text: '(a) Hélices de passo fixo e de passo ajustável

  no solo devem ser submetidas a um dos ensaios

  seguintes:

  (1) um ensaio em voo de 50 horas em voo

  nivelado ou em subida. A hélice deve ser opera-

  da em potência de decolagem e em rotação no-

  minal durante pelo menos 5 horas deste ensaio

  em voo, e em pelo menos 90 por cento da rota-

  ção nominal pelo restante das 50 horas; ou

  (2) um ensaio em solo de 50 horas em potên-

  cia de decolagem e em rotação nominal.'
