title: 35.40(d)
text: '(d) Reversible-pitch propellers. Two hundred

  complete cycles of control must be made from

  lowest normal pitch to maximum reverse pitch.

  During each cycle, the propeller must run for 30

  seconds at the maximum power and rotational

  speed selected by the applicant for maximum

  reverse pitch.'
