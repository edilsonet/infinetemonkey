title: 35.40(i)
text: '(i) cinco horas em potência e em rotação de

  decolagem e trinta ciclos de 10 minutos com-

  postos de:

  (A) aceleração a partir da marcha lenta;

  (B) cinco minutos em potência e em rotação

  de decolagem;

  (C) desaceleração; e

  (D) cinco minutos em marcha lenta.

  (ii) cinquenta horas em potência e rotação

  máximas contínuas;

  (iii) cinquenta horas, consistindo de dez ci-

  clos de 5 horas compostos de:

  (A) cinco acelerações e desacelerações entre

  marcha lenta e potência e rotação de decolagem;

  (B) quatro horas e meia em condições incre-

  mentais aproximadamente uniformes a partir da

  marcha lenta até, mas não incluindo, potência e

  rotação máximas contínuas; e

  (C) trinta minutos em marcha lenta;

  (2) a operação da hélice durante todos os en-

  saios de durabilidade de motor prescritos no

  RBAC 33.'
