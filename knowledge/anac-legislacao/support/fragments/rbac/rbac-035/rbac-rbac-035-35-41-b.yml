title: 35.41(b)
text: '(b) When the applicant seeks approval of a

  transient maximum propeller overtorque, the

  applicant must demonstrate that the propeller is

  capable

  of

  further

  operation

  without

  no ensaio de durabilidade (seção 35.39 deste

  RBAC) deve ser usado nos ensaios funcionais e

  deve ser acionado por um motor representativo

  em uma bancada de teste ou em um avião. A

  hélice deve completar estes ensaios sem

  evidência de falha ou mau funcionamento. Este

  ensaio pode ser combinado com o ensaio de

  durabilidade para acúmulo de ciclos.'
