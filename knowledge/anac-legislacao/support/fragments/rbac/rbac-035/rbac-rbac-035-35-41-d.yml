title: 35.41(d)
text: '(d) Hélices de passo reversível. Duzentos

  ciclos completos de controle devem ser

  executados do passo mínimo normal ao passo

  máximo reverso. Durante cada ciclo, a hélice

  deve girar por 30 segundos na potência e

  rotação máximas selecionadas pelo requerente

  para o passo máximo reverso.'
