text: '35.42

  Componentes do sistema de controle

  da hélice


  O requerente deve demonstrar por ensaios,

  análise baseada em ensaios ou experiência em

  serviço com componentes similares que cada

  componente do sistema de controle do passo da

  pá da hélice, incluindo reguladores, conjuntos

  de mudança de passo, travas de passo, batentes

  mecânicos e componentes do sistema de

  embandeiramento, pode suportar uma operação

  cíclica que simule a carga normal e a excursão

  de mudança de passo às quais o componente

  estaria sujeito durante o intervalo de revisão

  geral inicialmente declarado ou durante um

  mínimo de 1.000 (mil) horas de operação típica

  em serviço.'
