  posteriormente

  sem

  ação

  de

  manutenção na condição de torque máximo

  acima do limite de torque da hélice. Isto pode

  ser realizado através de:

  (1) execução de 20 giros, cada um com 30

  segundos de duração, na condição de operação

  com torque máximo acima do limite de torque

  da hélice; ou

  (2) análise baseada em ensaio ou experiência

  em serviço.'
