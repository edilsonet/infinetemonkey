title: 35.7(a)
text: '(a) A hélice não pode apresentar peculiarida-

  des ou características reveladas por qualquer

  ensaio ou análise ou conhecidas pelo requerente,

  que a tornem insegura para os usos para os quais

  a certificação é requerida.'
