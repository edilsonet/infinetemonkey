text: '(b) Se uma falha ocorrer durante um ensaio

  de certificação, o requerente deve determinar a

  causa e avaliar o efeito na aeronavegabilidade

  da hélice. O requerente deve fazer modificações

  no projeto e conduzir ensaios adicionais que a

  ANAC considere necessários para estabelecer a

  aeronavegabilidade da hélice.


  Data da emissão: 7 de agosto de 2019 RBAC nº 35


  SUBPART B

  Design and Construction'
