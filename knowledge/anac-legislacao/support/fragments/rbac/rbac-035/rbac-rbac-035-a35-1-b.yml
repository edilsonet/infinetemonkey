title: A35.1(b)
text: '(b) As Instruções para Aeronavegabilidade

  Continuada para cada hélice devem incluir as

  Instruções para Aeronavegabilidade Continuada

  para todas as peças da hélice. Se Instruções para

  Aeronavegabilidade Continuada não forem

  fornecidas pelo fabricante de peças da hélice

  para uma peça da hélice, as Instruções para

  Aeronavegabilidade Continuada para a hélice

  devem incluir as informações essenciais para a

  Aeronavegabilidade Continuada da hélice.'
