title: A35.3(b)
text: '(b) Propeller Overhaul Section.

  (1) Disassembly information including the

  order and method of disassembly for overhaul.


  (2) Cleaning and inspection instructions that

  cover the materials and apparatus to be used and

  methods and precautions to be taken during

  overhaul. Methods of overhaul inspection must

  also be included.


  (3) Details of all fits and clearances relevant

  sistemas da hélice são controlados e como eles

  operam, incluindo quaisquer procedimentos

  especiais que sejam aplicáveis.

  (4) Instruções para desembalo, verificação de

  aceitação, levantamento e instalação da hélice.

  (5) Instruções para verificações operacionais

  da hélice.

  (6) Informações de planejamento para cada

  peça da hélice que forneçam os intervalos

  recomendados nos quais ela deverá ser limpa,

  ajustada e testada, as tolerâncias de desgaste

  aplicáveis e o tipo de trabalho recomendado

  nestes intervalos. Entretanto, o requerente pode

  se referir ao fabricante de um acessório,

  instrumento ou equipamento como a fonte

  dessas informações se estas mostrarem que o

  item

  tem

  um

  grau

  de

  complexidade

  excepcionalmente alto que requeira técnicas de

  manutenção,

  equipamentos

  de

  teste

  ou

  habilidades especializados. Os intervalos de

  revisão geral recomendados e referências

  cruzadas

  à

  seção

  de

  Limitações

  de

  Aeronavegabilidade do manual necessárias

  também devem ser incluídas. Adicionalmente, o

  requerente deve incluir um programa de

  inspeção que contenha a frequência e a

  amplitude das inspeções necessárias para prover

  a aeronavegabilidade continuada da hélice.

  (7) Informações de diagnóstico descrevendo

  maus

  funcionamentos

  prováveis,

  como

  reconhecê-los e a ação corretiva para esses maus

  funcionamentos.

  (8) Informações descrevendo a ordem e o

  método de remoção e substituição de peças da

  hélice, acompanhadas de quaisquer precauções

  necessárias a serem tomadas.

  (9) Uma lista de ferramentas especiais

  necessárias para manutenção que não seja

  revisão geral.'
