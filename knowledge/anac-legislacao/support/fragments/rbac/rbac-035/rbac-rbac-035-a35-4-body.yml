text: 'A35.4

  Airworthiness limitations section


  The Instructions for Continued Airworthiness

  must contain a section titled Airworthiness

  Limitations that is segregated and clearly

  distinguishable from the rest of the document.

  This section must set forth each mandatory

  replacement time, inspection interval, and

  related procedure required for type certification.

  This section must contain a legible statement in

  a

  prominent

  location

  that

  reads:

  “The

  Airworthiness Limitations section is ANAC

  approved and specifies maintenance required

  under sections 43.16 and 91.403 of RBHA 43

  and 91, respectively, or substitute documents,

  unless an alternative program has been ANAC

  approved.”


  relevantes para a revisão geral.

  (4) Detalhes de métodos de reparo para peças

  e componentes gastos ou abaixo do padrão por

  outro motivo, juntamente com informações

  necessárias

  para

  determinar

  quando

  a

  substituição é necessária.

  (5) A ordem e o método de montagem na

  revisão geral.

  (6) Instruções para testes após a revisão

  geral.

  (7)

  Instruções

  para

  preparação

  de

  armazenagem, incluindo quaisquer limites de

  armazenagem.

  (8) Uma lista de ferramentas necessárias para

  revisão geral.'
