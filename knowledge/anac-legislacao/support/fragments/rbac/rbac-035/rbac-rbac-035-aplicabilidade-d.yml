title: aplicabilidade(d)
text: '(d) Para os propósitos deste RBAC, a hélice

  consiste dos componentes listados no projeto de

  tipo da hélice e o sistema de hélice consiste da

  hélice e de todos os componentes necessários ao

  seu funcionamento, mas não necessariamente

  incluídos no projeto de tipo da hélice.'
