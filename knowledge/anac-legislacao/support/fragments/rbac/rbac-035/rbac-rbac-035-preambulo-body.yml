title: Preambulo e sumario
text: '143

  REGULAMENTO BRASILEIRO

  DA AVIAÇÃO CIVIL

  Título:

  REQUISITOS

  DE

  AERONAVEGABILIDADE:

  HÉLICES

  Aprovação:

  Resolução nº 223, de 28 de março de 2012. [Emenda nº 08]

  Resolução nº 486, de 9 de agosto de 2018. [Emenda nº 09]

  Resolução nº 524, de 2 de agosto de 2019. [Emenda nº 10]


  PREÂMBULO


  Para concessão, no Brasil, de certificados de tipo para hélices, será utilizado como referência
  o regulamento Title 14

  Code of Federal Regulations Part 35, Emenda 35-8, em vigor desde 23 de dezembro de 2008,
  da autoridade de avia-

  ção civil Federal Aviation Administration - FAA, do Department of Transportation dos Estados
  Unidos da Améri-

  ca, o qual é republicado no corpo deste RBAC, com as adaptações necessárias e traduzido
  para a Língua Portuguesa, a

  partir do original contido no sítio oficial de publicação do regulamento em referência:
  http://ecfr.gpoaccess.gov.


  O número da emenda deste RBAC é equivalente ao número da emenda do regulamento utilizado
  como referência para a

  sua elaboração.


  SECTION CONTENTS


  SUBPART A - GENERAL'
