text: '39.1

  Propósito deste Regulamento


  Este regulamento estabelece a fundamentação para o sistema de Diretrizes de Aeronavegabilida-

  de da ANAC. Também estabelece o embasamento para a adoção, pela ANAC, de Diretriz de Aero-

  navegabilidade, ou documento equivalente, emitido por Autoridade de Aviação Civil do Estado
  de

  Projeto.'
