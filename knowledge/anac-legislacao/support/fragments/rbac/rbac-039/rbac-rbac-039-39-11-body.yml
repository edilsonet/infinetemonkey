text: '39.11

  Ações exigidas por uma Diretriz de Aeronavegabilidade


  Data da emissão: 2 de março de 2011


  Diretrizes de Aeronavegabilidade especificam inspeções e/ou modificações que devem ser feitas,

  condições e/ou limitações que devem ser observadas e quaisquer outras ações necessárias
  para re-

  solver uma condição insegura.'
