title: Objetivo de uma Diretriz de Aeronavegabilidade
text: '39.13-I Objetivo de uma Diretriz de Aeronavegabilidade


  Diretriz de Aeronavegabilidade é o documento emitido ou adotado pela ANAC que contém ações

  de segurança operacional a serem executadas em um produto aeronáutico com o objetivo de
  restau-

  rar o nível aceitável de segurança operacional, quando evidências demonstram que este nível
  acei-

  tável possa estar comprometido.'
