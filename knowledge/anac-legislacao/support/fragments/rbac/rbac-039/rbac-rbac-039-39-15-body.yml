text: '39.15

  Aplicabilidade de uma Diretriz de Aeronavegabilidade para produtos modificados


  Uma Diretriz de Aeronavegabilidade aplica-se a cada produto identificado na Diretriz de

  Aeronavegabilidade, mesmo que o produto individual tenha sido modificado ou reparado na
  área

  abrangida pela Diretriz de Aeronavegabilidade.'
