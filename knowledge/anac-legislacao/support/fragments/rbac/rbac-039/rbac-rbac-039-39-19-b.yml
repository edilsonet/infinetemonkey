title: 39.19(b)
text: '(b) Em se tratando de Diretriz de Aeronavegabilidade, ou documento equivalente, emitido
  por

  Autoridade de Aviação Civil estrangeira, e respeitado o critério da seção 39.5-I, a ANAC
  poderá

  aceitar métodos alternativos de cumprimento previamente aprovados por essa mesma Autoridade
  de

  Aviação Civil estrangeira, desde que esses métodos forneçam um nível de segurança aceitável.'
