text: '39.19

  Método alternativo de cumprimento de uma Diretriz de Aeronavegabilidade


  Qualquer pessoa pode propor à ANAC um método alternativo de cumprimento ou uma mudança

  no prazo de cumprimento, desde que essa proposta forneça um nível de segurança aceitável.
  Esse

  método alternativo de cumprimento só poderá ser usado após a aprovação da ANAC.'
