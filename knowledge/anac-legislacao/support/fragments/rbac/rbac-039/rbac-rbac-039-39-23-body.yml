text: '39.23

  Traslado de aeronave para fins de cumprimento de uma Diretriz de Aeronavegabili-

  dade


  Caso seja necessário, o operador de uma aeronave deverá solicitar à ANAC uma Autorização

  Especial de Voo para trasladar essa aeronave até um local adequado para a execução das ações
  re-


  Data da emissão: 2 de março de 2011


  queridas por uma Diretriz de Aeronavegabilidade, a menos que as especificações operativas
  desse

  operador já incluam provisões com esse objetivo. Não obstante, a ANAC não emitirá uma Autori-

  zação Especial de Vôo, caso:'
