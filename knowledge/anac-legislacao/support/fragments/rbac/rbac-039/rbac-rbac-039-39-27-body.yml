text: '39.27

  Prescrições de uma Diretriz de Aeronavegabilidade e documentação de serviço do

  fabricante


  É possível que uma Diretriz de Aeronavegabilidade incorpore por referência, no todo ou

  parcialmente, documentos de serviço do fabricante. Nesses casos, as partes referenciadas
  desses

  documentos de serviço tornam-se parte da Diretriz de Aeronavegabilidade. Em algumas situações,

  quando a ANAC julgar que as orientações contidas nos documentos de serviço são ineficazes
  para

  preservar a segurança das operações, tais orientações poderão ser modificadas pela Diretriz
  de

  Aeronavegabilidade. Caso se apresente algum conflito entre os documentos de serviço e a
  Diretriz

  de Aeronavegabilidade, devem prevalecer os requisitos da Diretriz de Aeronavegabilidade.'
