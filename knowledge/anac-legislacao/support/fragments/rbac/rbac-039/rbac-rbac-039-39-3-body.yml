text: '39.3

  Definição de Diretriz de Aeronavegabilidade


  Diretrizes de Aeronavegabilidade da ANAC são prescrições que se aplicam aos seguintes

  produtos: aeronaves, motores de aeronaves, hélices e equipamentos.'
