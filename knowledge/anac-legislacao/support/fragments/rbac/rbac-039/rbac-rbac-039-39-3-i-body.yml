title: Produtos importados
text: '39.3-I Produtos importados


  No contexto deste regulamento, consideram-se produtos importados aquelas aeronaves, motores

  de aeronaves, hélices e equipamentos para os quais a Autoridade de Aviação Civil do Estado
  de

  Projeto não seja a ANAC.'
