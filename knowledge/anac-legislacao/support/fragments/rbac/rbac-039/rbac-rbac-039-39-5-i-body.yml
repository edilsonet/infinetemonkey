title: 39.5-I
text: '39.5-I

  Diretriz de Aeronavegabilidade emitida por Autoridade de Aviação Civil estrangeira


  Para os efeitos deste regulamento, a ANAC considera a Diretriz de Aeronavegabilidade, ou
  do-

  cumento equivalente, emitido por Autoridade de Aviação Civil do Estado de Projeto, como
  uma

  Diretriz de Aeronavegabilidade emitida pela própria ANAC. Caso a ANAC emita Diretriz de
  Aero-

  navegabilidade que apresente conflito com Diretriz de Aeronavegabilidade estrangeira, prevalece-

  rão os requisitos da Diretriz de Aeronavegabilidade emitida pela ANAC.'
