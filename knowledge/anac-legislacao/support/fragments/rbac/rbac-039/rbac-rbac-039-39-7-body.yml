text: '39.7

  Efeitos legais decorrentes do não cumprimento de uma Diretriz de Aeronavegabilida-

  de


  Qualquer pessoa que opere um produto que não cumpre com os requisitos de uma Diretriz de

  Aeronavegabilidade está infringindo o disposto nesta seção e estará sujeita a multa, suspensão
  ou

  cassação do certificado de aeronavegabilidade de sua aeronave, entre outras penalidades
  cabíveis.'
