text: '39.9

  Consequência de reiteradamente operar uma aeronave ou utilizar um produto que

  não cumpre uma Diretriz de Aeronavegabilidade


  Se os requisitos de uma Diretriz de Aeronavegabilidade não forem cumpridos, a seção 39.7
  será

  infringida a cada vez que a aeronave é operada ou o produto é utilizado.'
