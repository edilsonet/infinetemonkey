title: 45.11(a)
text: '(a) Aeronaves. Cada fabricante de aeronaves sujeito ao cumprimento da seção 21.182
  do RBAC

  21 deve marcar cada aeronave fixando uma placa de identificação à prova de fogo que:

  (1) inclua a informação especificada na seção 45.13 deste Regulamento, usando um método

  aprovado de marcação à prova de fogo;

  (2) seja colocada de modo a ser improvável que seja danificada ou removida durante serviços

  normais, ou perdida ou destruída em caso de acidente; e

  (3) [Reservado]

  (3)-I seja fixada:'
