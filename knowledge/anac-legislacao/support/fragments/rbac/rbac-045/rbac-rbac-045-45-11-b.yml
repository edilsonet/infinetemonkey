cite: 45.11(b)
title: 45.11(b)
text: '(b) Motores de aeronaves. Cada fabricante de motor de aeronave com base em um certificado
  de

  tipo ou certificado de organização de produção deve marcar cada motor fixando uma placa
  de

  identificação à prova de fogo. Essa placa deverá:

  (1) incluir a informação especificada na seção 45.13 deste Regulamento usando um processo

  aprovado de marcação à prova de fogo;

  (2) ser fixada no motor em local acessível; e

  (3) ser fixada de modo que seja improvável ser danificada ou removida durante os serviços

  normais, ou ser perdida ou destruída em caso de acidente.'
