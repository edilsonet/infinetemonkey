title: 45.11(f)
text: '(f) Em paraquedas motorizados e aeronaves de controle pendular, a placa de identificação

  exigida pelo parágrafo (a) desta seção deve ser fixada no lado externo da fuselagem de modo
  a ser

  legível por uma pessoa no solo.


  Data de emissão: 24 de junho de 2020.'
