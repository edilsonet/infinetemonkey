cite: 45.12-I(f)
title: 45.12-I(f)
text: '(f) Nenhuma aeronave pode ostentar inscrições que se assemelhem ou se confundam com

  aquelas previstas nos parágrafos (a), (b), (c) e (d) exceto se estiverem autorizadas para
  realizar as

  operações correspondentes indicadas.

  (1) Uma vez que a autorização seja suspensa, a inscrição correspondente deve ser retirada
  ou

  descaracterizada dentro de 30 dias corridos a contar da data da suspensão, e assim permanecer

  até que os efeitos suspensivos sejam removidos pela ANAC.

  (2) Uma vez que a operação não esteja mais autorizada, a inscrição correspondente deve ser

  retirada dentro de 7 dias corridos.'
