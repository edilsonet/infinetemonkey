cite: 45.13(a)
title: 45.13(a)
text: '(a) A identificação requerida pelos parágrafos 45.11(a) a 45.11(c) deste Regulamento
  deve

  incluir as seguintes informações:

  (1) nome do fabricante;

  (2) designação do modelo;

  (3) número de série de fabricação;

  (4) número do certificado de tipo (se aplicável);

  (5) número do certificado de organização de produção (se aplicável); (Redação dada pela

  Resolução nº 364, de 20.10.2015)

  (6) para motores de aeronaves, as limitações estabelecidas;

  (7) [Reservado]; e

  (8) qualquer outra informação considerada pertinente pela ANAC.


  Data de emissão: 24 de junho de 2020.'
