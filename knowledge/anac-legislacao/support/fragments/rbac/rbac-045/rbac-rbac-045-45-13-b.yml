text: '(b) Exceto como previsto no parágrafo (d)(1) desta seção, ninguém pode remover, trocar
  ou

  colocar as informações requeridas pelo parágrafo (a) desta seção em qualquer aeronave, motor,

  hélice, pá de hélice ou cubo de hélice sem a aprovação da ANAC.'
