title: 45.13(d)
text: '(d) Pessoas executando trabalhos segundo as provisões do RBAC 43, desde que de acordo
  com

  métodos, técnicas e práticas aceitáveis pela ANAC, podem:

  (1) remover, trocar ou colocar os dados de identificação requeridos pelo parágrafo (a) desta

  seção em qualquer aeronave, motor, hélice, pá de hélice ou cubo de hélice; ou

  (2) remover uma placa de identificação requerida pela seção 45.11 deste Regulamento, se

  necessário para operações de manutenção.'
