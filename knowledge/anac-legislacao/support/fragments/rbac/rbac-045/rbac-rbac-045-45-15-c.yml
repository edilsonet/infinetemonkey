section_title: Marcação de peças PAA, OTP e componentes críticos
subsection_id: c
cite: 45.15(c)
title: 45.15(c)
text: '(c) Componentes críticos. Cada fabricante de uma peça que tenha tempo de vida limitado,

  intervalo fixo entre inspeções ou outro procedimento similar especificado nas limitações
  de

  aeronavegabilidade contidas no manual de manutenção do fabricante ou nas instruções para

  aeronavegabilidade continuada deve marcar este componente de modo permanente e legível com

  um número de peça (ou equivalente) e um número de série (ou equivalente) exclusivo a este

  componente em adição aos outros requisitos aplicáveis desta seção.'
