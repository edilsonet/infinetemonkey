text: '45.16 Marcação de peças com limite de vida


  Quando solicitado a uma pessoa o cumprimento da seção 43.10 do RBAC 43, o detentor de um

  certificado de tipo ou de um projeto aprovado de uma peça com limite de vida deve fornecer


  Data de emissão: 24 de junho de 2020.


  instruções de marcação, ou deve declarar que a peça não pode ser marcada sem comprometer
  a sua

  integridade.

  (Redação dada pela Resolução nº 364, de 20.10.2015)


  Data de emissão: 24 de junho de 2020.


  SUBPARTE C

  MARCAS DE NACIONALIDADE E DE MATRÍCULA'
