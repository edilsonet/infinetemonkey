title: 45.21(a)
text: '(a) Exceto como previsto na seção 45.22 deste Regulamento, ninguém pode operar uma
  aeronave

  civil registrada no Brasil a menos que ela disponha de marcas de nacionalidade e de matrícula

  expostas de acordo com esta seção e com as seções 45.23 a 45.33 deste Regulamento.'
