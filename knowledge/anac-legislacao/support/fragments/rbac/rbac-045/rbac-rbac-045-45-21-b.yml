title: 45.21(b)
text: '(b) A menos que especificamente autorizado pela ANAC, ninguém pode colocar um desenho,

  marcas ou símbolos em uma aeronave que possam modificar ou confundir as marcas de

  nacionalidade e de matrícula.'
