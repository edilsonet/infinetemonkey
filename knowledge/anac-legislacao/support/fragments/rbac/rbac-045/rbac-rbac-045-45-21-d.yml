title: 45.21(d)
text: '(d) As marcas de nacionalidade e de matrícula podem ser apostas à aeronave com material
  de

  remoção rápida, se a aeronave:

  (1) estiver prevista para entrega imediata a um comprador estrangeiro;

  (2) possuir matrícula temporária; ou

  (3) possuir marcas temporárias para atender aos requisitos do parágrafo 45.22(c)(1) deste

  Regulamento.'
