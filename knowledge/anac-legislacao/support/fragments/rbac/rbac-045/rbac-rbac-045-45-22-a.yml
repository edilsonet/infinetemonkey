section_title: 'Aeronaves antigas, de exibição e outras aeronaves: requisitos especiais'
subsection_id: a
cite: 45.22(a)
title: 45.22(a)
text: '(a) Quando a exposição das marcas de nacionalidade e de matrícula, de acordo com a
  seção

  45.21, e com as seções 45.23-I a 45.33, todas deste Regulamento, for inconveniente para
  voos de

  exibição da aeronave, uma aeronave civil registrada no Brasil pode ser operada sem apresentar
  tais

  marcas em nenhuma de suas partes externas, desde que:

  (1) esteja sendo operada para o propósito de exibição, incluindo produções para cinema ou

  televisão e demonstrações aéreas;

  (2) exceto para treinamentos e voos de ensaio necessários para o propósito de exibição,
  ela

  seja operada apenas no local de exibição, entre locais de exibição, e o local da exibição
  e a base de

  operação da aeronave; e

  (3) para cada voo dentro do Brasil ela seja operada:'
