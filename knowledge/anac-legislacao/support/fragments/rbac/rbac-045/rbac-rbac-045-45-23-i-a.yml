title: 45.23-I(a)
text: '(a) Cada operador de uma aeronave civil brasileira deve colocar nessa aeronave marcas
  de

  nacionalidade e de matrícula, conforme se segue:

  (1) marcas de nacionalidade: as marcas de nacionalidade são constituídas pelos grupos de

  letras maiúsculas PP, PR, PS, PT ou PU;

  (2) marcas de matrícula: as marcas de matrícula são constituídas por arranjos de três letras

  maiúsculas, dentre as vinte e seis do alfabeto, excetuando-se:'
