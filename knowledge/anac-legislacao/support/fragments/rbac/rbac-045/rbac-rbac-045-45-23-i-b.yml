title: 45.23-I(b)
text: '(b) O operador de uma aeronave categoria restrita, leve esportiva, experimental ou
  com

  certificado de aeronavegabilidade provisório deve colocar nessa aeronave, de maneira facilmente

  legível e próxima à entrada, em letras entre 5 a 15 cm de altura, as palavras “RESTRITA”,
  “LEVE

  ESPORTIVA”, “EXPERIMENTAL” ou “PROVISÓRIO”, conforme aplicável.'
