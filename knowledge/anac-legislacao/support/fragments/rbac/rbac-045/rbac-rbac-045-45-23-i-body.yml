text: '45.23-I até 45.33 deste Regulamento, desde que: (Redação dada pela Resolução nº 364,
  de

  20.10.2015)

  (1) suas marcas de nacionalidade e de matrícula sejam fixadas em cada lado da fuselagem
  ou

  da empenagem vertical, com letras de pelo menos 5 cm de altura e atendendo ao previsto no

  parágrafo 45.21(c) deste Regulamento.


  Data de emissão: 24 de junho de 2020.


  (2) [Reservado].'
