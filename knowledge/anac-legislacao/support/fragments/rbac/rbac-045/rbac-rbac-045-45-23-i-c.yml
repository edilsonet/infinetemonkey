title: 45.23-I(c)
text: '(c) Ninguém pode operar uma aeronave nos termos dos parágrafos (a) ou (b) desta seção:

  (1) em voo IFR, a menos que ela possua as marcas de nacionalidade e de matrícula previstas

  nas seções 45.21 e 45.23-I até 45.33 deste Regulamento, mesmo que fixadas temporariamente;

  (Redação dada pela Resolução nº 364, de 20.10.2015)

  (2) em um país estrangeiro, a menos que o país consinta em tal operação; ou

  (3) em qualquer operação segundo os RBAC 121, 133, 135 e 137. (Redação dada pela

  Resolução nº 364, de 20.10.2015)'
