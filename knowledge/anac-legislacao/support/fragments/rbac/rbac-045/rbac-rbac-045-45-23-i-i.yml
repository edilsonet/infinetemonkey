section_title: Marcas de nacionalidade e de matrícula
subsection_id: i
cite: 45.23-I(i)
title: 45.23-I(i)
text: '(i) os arranjos iniciados com a letra Q;

  (ii) os arranjos que tenham W como segunda letra;

  (iii) os arranjos SOS, XXX, PAN, TTT, VFR, IFR, VMC e IMC; e

  (iv) os arranjos que apresentem significado pejorativo, impróprio ou ofensivo;

  (3) a marca de nacionalidade precede a marca de matrícula, as duas sendo separadas por hífen,

  a meia altura das letras: Ex: PP-DAC; e

  (4) aeronaves públicas e privadas antigas: poderão ostentar marcas a elas atribuídas

  anteriormente, e já canceladas em seus registros anteriores de origem, para efeito de preservação
  de

  suas condições históricas. Entretanto, elas deverão, também, ostentar marcas de nacionalidade
  e de

  matrícula de acordo como parágrafo 45.22(b) deste Regulamento.'
