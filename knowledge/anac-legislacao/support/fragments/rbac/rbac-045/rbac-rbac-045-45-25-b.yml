section_title: Localização das marcas em aeronaves de asa fixa
subsection_id: b
cite: 45.25(b)
title: 45.25(b)
text: '(b) As marcas requeridas pelo parágrafo (a) desta seção devem ser expostas como se
  segue:

  (1) se colocadas na empenagem vertical, as marcas devem ser colocadas horizontalmente em

  ambos os lados da mesma, em aeronaves com empenagem vertical única, ou horizontalmente nos

  lados externos, em aeronaves com empenagem vertical múltipla. Entretanto, em aeronave cujas

  marcas devam ter ao menos 15 cm de altura, segundo previsto no parágrafo 45.29-I(b)(1) deste
  Re-

  gulamento, tais marcas podem ser postas verticalmente na empenagem vertical;

  (2) se colocadas na fuselagem, as marcas devem ser colocadas horizontalmente em cada lado

  da mesma, entre o bordo de fuga das asas e o bordo de ataque da empenagem horizontal, se
  esta for

  localizada na própria fuselagem. Entretanto, se houver naceles de motores ou estruturas
  salientes


  Data de emissão: 24 de junho de 2020.


  integrantes da superfície lateral da fuselagem, as marcas podem ser colocadas na superfície
  de tais

  saliências; e

  (3)-I nas asas, as marcas não devem ser colocadas, ainda que parcialmente, em superfícies

  móveis. Adicionalmente:'
