section_title: Localização das marcas em aeronaves de asas rotativas e outras aeronaves
subsection_id: e
cite: 45.27(e)
title: 45.27(e)
text: '(e) Paraquedas motorizado e aeronave de controle pendular. Cada operador de um paraquedas

  motorizado ou de uma aeronave de controle pendular deve colocar as marcas de nacionalidade
  e de

  matrícula requeridas pela seção 45.23-I e pelo parágrafo 45.29-I(b)(2) deste Regulamento.
  As mar-

  cas devem ser colocadas em duas posições diametralmente opostas na fuselagem, em uma estrutura

  ou em outro componente da aeronave e devem ser visíveis a partir da lateral da aeronave.


  Data de emissão: 24 de junho de 2020.'
