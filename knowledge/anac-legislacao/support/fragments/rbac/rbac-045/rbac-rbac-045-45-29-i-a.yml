title: 45.29-I(a)
text: '(a) Cada operador de uma aeronave deve colocar as marcas de nacionalidade e de matrícula

  usando letras com as dimensões estabelecidas nesta seção, observada a especialidade tratada
  no

  parágrafo (f) desta seção.'
