title: 45.29-I(c-I)
text: '(c)-I Comprimento do hífen. (Redação dada pela Resolução nº 493, de 04.10.2018)

  (1) Em todas as marcas de nacionalidade e matrícula que sejam pintadas ou apostas em aeronave

  a partir de 7 de janeiro de 2019, o hífen deve ter comprimento igual a dois terços da altura
  das

  letras. (Redação dada pela Resolução nº 493, de 04.10.2018)

  (2) A partir de 9 de outubro de 2028, nas marcas de nacionalidade e matrícula de todas as

  aeronaves, o hífen deve ter comprimento igual a dois terços da altura das letras. (Redação
  dada pela

  Resolução nº 493, de 04.10.2018)'
