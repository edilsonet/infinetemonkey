cite: 45.29-I(c)
title: 45.29-I(c)
text: '(c) Largura. As letras devem ter largura igual a dois terços de sua altura, exceto
  a letra "I" que

  deve ter largura igual a um sexto de sua altura, e as letras "M" e "W", que podem ter largura
  igual a

  sua altura. (Redação dada pela Resolução nº 493, de 04.10.2018)'
