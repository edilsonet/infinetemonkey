title: 45.29-I(f)
text: '(f) Se uma das superfícies autorizadas para colocação das marcas previstas na seção
  45.25 deste

  Regulamento for grande suficiente para cumprir os requisitos de tamanho desta seção e a
  outra não,

  as marcas deverão ser colocadas totalmente na maior superfície. Se nenhuma das superfícies
  for

  grande o suficiente para caber as marcas no tamanho requerido, as marcas deverão ser colocadas
  no

  maior tamanho possível e na superfície de maior tamanho. Se nenhuma superfície autorizada
  para

  colocação das marcas previstas na seção 45.27 deste Regulamento for grande suficiente para


  Data de emissão: 24 de junho de 2020.


  comportar as marcas no tamanho requerido, as marcas deverão ser colocadas no maior tamanho

  possível e na maior das superfícies autorizadas. Ressalta-se, porém, que paraquedas motorizados
  e

  aeronaves de controle pendular devem exibir marcas com altura mínima de 8 cm. (Redação dada

  pela Resolução nº 364, de 20.10.2015)'
