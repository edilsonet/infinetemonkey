text: '45.33 Venda da aeronave. Remoção das marcas


  Quando uma aeronave registrada no Brasil for vendida, o detentor do certificado de matrícula
  da

  mesma deve remover, antes da entrega ao comprador, todas as marcas brasileiras da aeronave

  (inclusive a placa citada na seção 45.30-I deste Regulamento), a menos que a aeronave vá
  continuar

  baseada no Brasil e o novo proprietário seja:'
