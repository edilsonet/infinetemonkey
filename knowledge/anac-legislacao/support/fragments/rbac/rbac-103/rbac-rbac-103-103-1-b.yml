text: '(b) Para os propósitos deste regulamento, é considerado veículo ultraleve aquela aeronave
  que:

  (1) tem propósito exclusivo de desporto e recreação;

  (2) não seja detentora de um certificado de aeronavegabilidade emitido segundo o RBAC nº
  21;

  (3) possui peso vazio de no máximo 80kg se não motorizado ou 200kg se motorizado; e

  (4) possui:'
