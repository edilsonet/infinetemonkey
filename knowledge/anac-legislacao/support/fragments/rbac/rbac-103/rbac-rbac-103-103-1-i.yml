cite: 103.1(i)
title: 103.1(i)
text: '(i) velocidade máxima em voo nivelado com potência máxima contínua (VH) menor ou igual

  a 100 knots calibrado (CAS), sob condições atmosféricas padrão ao nível do mar; ou

  (ii) no caso de planador ou motoplanador, velocidade nunca exceder (VNE) menor ou igual

  a 100 knots CAS.'
