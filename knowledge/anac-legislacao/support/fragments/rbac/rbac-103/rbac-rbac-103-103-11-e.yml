title: 103.11(e)
text: '(e) Uma pessoa somente pode embarcar outra pessoa em veículo ultraleve ou em balão
  livre

  tripulado sob este regulamento se essa pessoa estiver ciente de que se trata de atividade
  desportiva de

  alto risco, que ocorre por conta e risco dos envolvidos, onde operador e aeronaves não dispõem
  de

  qualquer qualificação técnica emitida pela ANAC, não havendo, portanto, qualquer garantia
  de

  segurança.'
