title: Regras de tráfego aéreo
text: '103.13 Regras de tráfego aéreo

  O operador de veículo ultraleve e balão livre tripulado deve observar as regras de tráfego
  aéreo

  emitidas pelo Departamento de Controle do Espaço Aéreo - DECEA correspondentes ao espaço
  de

  voo utilizado, bem como, quaisquer limitações adicionais impostas na forma do parágrafo

  103.15(c)(1) deste regulamento.'
