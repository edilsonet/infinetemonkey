cite: 103.15(a)
title: 103.15(a)
text: '(a) Sem prejuízo do disposto na seção 103.11 deste regulamento, é proibida a operação
  de veículo

  ultraleve ou balão livre tripulado sob este regulamento sobre áreas densamente povoadas,

  aglomerados rurais1, aglomeração de pessoas, áreas proibidas ou restritas.


  1 aglomerado rural significa localidade situada em área não definida legalmente como urbana
  e caracterizada por um

  conjunto de edificações permanentes e adjacentes, formando área continuamente construída,
  com arruamentos reconhe-

  cíveis e dispostos ao longo de uma via de comunicação; ou localidade que tem as características
  definidoras de aglome-

  rado rural e está localizada a menos de 1 km de distância da área urbana de uma cidade ou
  vila, constituindo simples

  extensão da área urbana legalmente definida (aglomerado rural de extensão urbana); ou localidade
  que tem as caracterís-

  ticas definidoras de aglomerado rural e está localizada a uma distância igual ou superior
  a 1 km da área urbana de uma

  cidade, vila ou de um aglomerado rural já definido como de extensão urbana (aglomerado rural
  isolado). Fonte:

  IBGE/DGC/DECAR. Noções básicas de cartografia, Rio de Janeiro: IBGE, 1998, p. 71-72.


  Data da emissão: 22 de novembro de 2021


  (1) Exceções ao parágrafo (a) desta seção podem ser aprovadas pontualmente pela ANAC

  mediante autorização especial, cuja cópia deve ser portada pelo operador, condicionada à
  autorização

  prévia emitida pela autoridade local.'
