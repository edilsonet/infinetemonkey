cite: 103.15(c)
title: 103.15(c)
text: '(c) Antes de cada voo, o operador de veículo ultraleve ou de balão livre tripulado
  deve tomar

  conhecimento dos espaços de voo autorizados para operação segundo os requisitos deste regulamento,

  respeitando os limites laterais e verticais definidos.

  (1) Requisitos específicos para operação em determinadas áreas e espaços de voo poderão
  ser

  exigidos em função das características operacionais locais.


  Data da emissão: 22 de novembro de 2021


  SUBPARTE C

  DISPOSIÇÕES FINAIS'
