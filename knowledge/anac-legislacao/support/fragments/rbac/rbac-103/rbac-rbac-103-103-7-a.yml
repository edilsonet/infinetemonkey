cite: 103.7(a)
title: 103.7(a)
text: '(a) A operação de veículo ultraleve ou balão livre tripulado segundo este regulamento
  não exige

  habilitação de piloto ou certificado de aeronavegabilidade emitidos pela ANAC. Contudo,
  o operador

  deverá possuir certidão de cadastro de aerodesportista na forma estabelecida pela ANAC.

  (1) Para a efetivação do cadastro de aerodesportista é necessária a comprovação de que o

  interessado detém os conhecimentos mínimos necessários para o cumprimento das regras

  operacionais e de uso do espaço aéreo.'
