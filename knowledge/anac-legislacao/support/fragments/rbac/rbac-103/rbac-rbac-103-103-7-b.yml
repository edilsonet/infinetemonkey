cite: 103.7(b)
title: 103.7(b)
text: '(b) Sem prejuízo do disposto no parágrafo (a) desta seção, os veículos ultraleves motorizados
  e os

  balões livres tripulados operando segundo este regulamento devem ser cadastrados na forma

  estabelecida pela ANAC e apresentar marcação visível que permita sua identificação.

  (1) É vedado o cadastro de aeronaves com registro no RAB no banco de dados de ultraleves

  motorizados.


  Data da emissão: 22 de novembro de 2021


  (2) Caso possua qualquer certificado anteriormente emitido (CAV/CAVE) relativo à aeronave

  a ser cadastrada, o operador deverá solicitar a revogação do seu registro e encaminhar o
  certificado à

  ANAC.'
