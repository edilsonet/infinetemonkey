title: 103.7(c)
text: '(c) Os operadores de veículos ultraleves ou balões livres tripulados que se dediquem
  à formação

  ou adestramento de outros desportistas devem possuir o seguro contra danos às pessoas ou
  bens na

  superfície e ao pessoal técnico a bordo, conforme estabelecido no art. 178, § 1º da lei
  nº 7.565, de 19

  de dezembro de 1986 (Código Brasileiro de Aeronáutica).'
