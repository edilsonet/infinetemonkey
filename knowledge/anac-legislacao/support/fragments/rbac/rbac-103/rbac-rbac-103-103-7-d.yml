title: 103.7(d)
text: '(d) Os operadores de veículos ultraleves ou balões livres operando sob este regulamento
  devem

  portar o cadastro de aerodesportista do piloto, o cadastro de aeronave e o seguro, conforme
  aplicáveis,

  a bordo da aeronave, em meio físico ou digital. (Redação dada pela Resolução nº 645, de
  18.11.2021)


  Data da emissão: 22 de novembro de 2021


  SUBPARTE B

  REGRAS DE OPERAÇÃO'
