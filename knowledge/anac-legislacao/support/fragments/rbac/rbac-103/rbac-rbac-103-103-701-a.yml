title: 103.701(a)
text: '(a) Para os efeitos de aplicação do art. 33 do Decreto-Lei n° 3.688, de 3 de outubro
  de 1941,

  entende-se como devidamente licenciado:

  (1) o operador que possuir comprovação de cadastro de aerodesportista conforme o parágrafo

  103.7(a) deste regulamento; e

  (2) no caso de operador de veículo ultraleve motorizado ou balão livre tripulado, a comprovação

  de cadastro e sua identificação na aeronave conforme o parágrafo 103.7(b) deste regulamento.'
