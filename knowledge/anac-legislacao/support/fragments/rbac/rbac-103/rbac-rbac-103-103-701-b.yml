text: '(b) Para os efeitos de aplicação do art. 132 do Decreto Lei nº 2.848, de 07 de dezembro
  de 1940,

  entende-se que o descumprimento dos parágrafos 103.11(a) e 103.11(b) deste regulamento expõe
  a

  vida ou a saúde de outrem a perigo direto e iminente.'
