title: 103.701(c)
text: '(c) Para os efeitos de aplicação do art. 35 do Decreto-Lei n° 3.688, de 3 de outubro
  de 1941,

  entende-se como zonas permitidas aquelas estabelecidas na seção 103.15 deste regulamento.

  (1) O operador deve portar as autorizações especiais válidas de que tratam a seção 103.5
  e o

  parágrafo 103.15(a)(1) deste regulamento, sendo admitido o documento em meio digital.'
