cite: 105.1(a)
title: 105.1(a)
text: '(a) Este regulamento estabelece regras regendo os saltos de paraquedas executados no
  Brasil,

  exceto quanto aos saltos realizados em virtude de uma emergência em voo e conforme estabelecido

  pelo parágrafo (b) desta seção.'
