cite: 105.1(b)
title: 105.1(b)
text: '(b) Este regulamento não se aplica:

  (1) às atividades de paraquedismo das Forças Armadas do País, ou seja: saltos de paraquedas

  realizados por membros das Forças Armadas, em atividades exclusivamente militares, a partir
  de

  aeronaves militares e dentro de espaços aéreos sob controle das Forças Armadas;

  (2) a saltos de paraquedas realizados com o objetivo de atender a emergências na superfície,

  desde que executados de modo a não aumentar os riscos à segurança de pessoas e propriedades
  criados

  pela emergência; e

  (3) às operações especiais de unidades aéreas públicas regidas pelo RBAC nº 90. (Redação
  dada

  pela Resolução nº 512, de 11.04.2019)'
