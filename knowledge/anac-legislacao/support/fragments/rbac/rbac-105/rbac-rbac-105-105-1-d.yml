title: 105.1(d)
text: '(d) Para os propósitos deste regulamento, "salto de paraquedas" significa a queda de
  uma pessoa

  para a superfície da terra, partindo de uma aeronave em voo, quando essa pessoa utiliza
  ou pretende

  utilizar um paraquedas durante toda a queda ou em parte dela.'
