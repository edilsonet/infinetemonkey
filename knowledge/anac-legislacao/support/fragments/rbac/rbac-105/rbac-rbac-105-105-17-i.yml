cite: 105.17(i)
title: 105.17(i)
text: '(i) haja aprovação da torre de controle para realizar operações de paraquedas sobre
  ou para

  o aeroporto; e


  Data da emissão: 12 de abril de 2019


  (ii) seja mantido contato bilateral via rádio entre o piloto do avião envolvido na operação
  de

  lançamento de paraquedistas e a torre de controle do aeroporto sobre ou para o qual esta
  operação

  está sendo conduzida.

  (3) para os aeroportos sem torre de controle operacional, a aprovação prévia para realização

  de operações de paraquedas sobre ou naquele aeroporto deve ser obtida junto à gestão do
  aeroporto.

  (4) um paraquedista pode sobrevoar um aeródromo com seus equipamentos funcionando

  corretamente se estiver, no mínimo, 2.000 pés (ou 610 metros) acima do circuito de tráfego
  do

  aeródromo, e evite criar riscos para o tráfego aéreo ou a pessoas e bens no solo.'
