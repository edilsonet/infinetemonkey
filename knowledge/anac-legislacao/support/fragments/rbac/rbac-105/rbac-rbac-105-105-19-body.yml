title: Saltos dentro ou sobre espaços aéreos classes A, B, C e D
text: '105.19 Saltos dentro ou sobre espaços aéreos classes A, B, C e D

  Ninguém pode realizar um salto de paraquedas e nenhum piloto em comando de uma aeronave
  pode

  autorizar saltos de paraquedas de sua aeronave dentro ou sobre espaços aéreos classe A,
  classe B,

  classe C ou classe D sem, ou em violação de, uma autorização do controle de tráfego aéreo.'
