title: Saltos dentro ou sobre áreas de serviço radar de aeródromos
text: '105.21 Saltos dentro ou sobre áreas de serviço radar de aeródromos

  Ninguém pode realizar um salto de paraquedas e nenhum piloto em comando de uma aeronave
  pode

  autorizar saltos de paraquedas de sua aeronave dentro ou sobre uma área de serviço radar
  de um

  aeródromo sem, ou em violação de, uma autorização do órgão ATC.'
