title: Saltos dentro ou sobre áreas de controle positivo ou áreas terminais.
text: '105.23 Saltos dentro ou sobre áreas de controle positivo ou áreas terminais.

  Ninguém pode realizar um salto de paraquedas e nenhum piloto em comando de uma aeronave
  pode

  autorizar saltos de paraquedas de sua aeronave dentro ou sobre área de controle positivo
  ou área

  terminal sem, ou em violação de, uma autorização do controle de tráfego aéreo.'
