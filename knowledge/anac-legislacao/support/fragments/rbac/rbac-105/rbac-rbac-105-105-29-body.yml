title: Saltos sobre ou dentro de áreas proibidas ou restritas
text: '105.29 Saltos sobre ou dentro de áreas proibidas ou restritas

  Nenhuma pessoa pode realizar um salto de paraquedas e nenhum piloto em comando pode autorizar

  saltos de paraquedas de sua aeronave dentro ou sobre uma área proibida ou restrita, a menos
  que

  possua um NOTAM válido.'
