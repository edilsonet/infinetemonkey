cite: 105.3(a)
title: 105.3(a)
text: '(a) Nenhuma pessoa pode realizar saltos de paraquedas e nenhum piloto em comando de
  uma

  aeronave pode autorizar uma operação de paraquedas a ser realizada de uma aeronave, se a
  operação

  põe em risco o tráfego aéreo ou pessoas e bens na superfície.'
