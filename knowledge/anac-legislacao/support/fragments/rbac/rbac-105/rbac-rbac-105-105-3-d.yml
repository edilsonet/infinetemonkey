title: 105.3(d)
text: '(d) O piloto em comando de uma aeronave só pode autorizar que uma pessoa execute um
  salto de

  paraquedas a partir de sua aeronave se:

  (1) existir NOTAM válido para a operação;

  (2) ele atender aos requisitos para operar como piloto lançador de paraquedista estabelecidos

  no RBAC nº 61; (Redação dada pela Resolução nº 476, de 07.06.2018)

  (3) a aeronave estiver com sua situação regularizada perante a ANAC e não possuir qualquer

  restrição que possa vir a afetar essa operação; e

  (4) [Reservado]'
