title: 105.3(e)
text: '(e) Este regulamento estabelece regras e procedimentos operacionais. O seu cumprimento
  por

  parte dos paraquedistas e dos pilotos em comando que pretendam realizar demonstrações de

  paraquedismo com fins lucrativos não os isenta de cumprir, também, as demais leis, normas
  e

  regulamentos federais, estaduais e municipais aplicáveis à atividade (legislação trabalhista,
  tributária,

  etc.).


  Data da emissão: 12 de abril de 2019


  SUBPARTE B

  REGRAS DE OPERAÇÃO'
