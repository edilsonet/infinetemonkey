title: 105.31(b)
text: '(b) quando a visibilidade em voo ou o afastamento de nuvens for menor do que o estabelecido
  na

  tabela seguinte:


  ALTITUDE EM VOO

  VISIBILIDADE

  AFASTAMENTO DE NUVENS

  (1) 1200 pés ou menos acima do

  solo, independente da altitude

  (MSL);


  150 m (500 pés) abaixo

  ou

  4500 m

  300 m (1.000 pés) acima

  (2) Mais de 1200 pés acima do

  solo, mas menos de 10.000

  pés de altitude(MSL)


  600 m (2.000 pés) na horizontal

  (3) Mais de 1200 pés acima do

  solo, mas a 10.000 pés ou mais

  de altitude (MSL)


  7.500 m

  300 m (1.000 pés) abaixo

  300 m (1.000 pés) acima

  1.600 m (1 milha) na horizontal'
