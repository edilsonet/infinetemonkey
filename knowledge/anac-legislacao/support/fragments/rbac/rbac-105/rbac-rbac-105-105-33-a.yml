section_title: Operações entre pôr e nascer do sol
subsection_id: a
cite: 105.33(a)
title: 105.33(a)
text: '(a) Nenhuma pessoa pode realizar um salto de paraquedas e nenhum piloto em comando
  pode

  permitir que uma pessoa realize um salto de paraquedas de sua aeronave entre o pôr e o nascer
  do sol,

  a menos que a pessoa ou objeto lançado do avião esteja equipada(o) com um dispositivo luminoso

  que seja visível por pelo menos 5.000 metros e esteja previsto em NOTAM.'
