text: '105.35 Álcool e drogas

  Nenhuma pessoa pode executar um salto de paraquedas e nenhum piloto em comando de uma

  aeronave pode autorizar que uma pessoa salte de paraquedas de sua aeronave se essa pessoa
  aparentar

  estar:'
