title: Inspeções
text: '105.37 Inspeções

  A ANAC pode inspecionar qualquer operação de salto de paraquedas, inclusive a área de salto
  e de

  aterragem, a qual se aplica este regulamento, visando à segurança de todos os envolvidos
  na atividade

  e a de terceiros.'
