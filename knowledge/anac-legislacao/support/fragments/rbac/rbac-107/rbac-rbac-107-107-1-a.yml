cite: 107.1(a)
title: 107.1(a)
text: '(a) Este regulamento se aplica ao operador de aeródromo civil público, compartilhado
  ou não, cujas responsabilidades relacionadas à segurança da aviação civil contra atos de
  interferência ilícita (AVSEC) estão previstas no artigo 8º do Programa Nacional de Segurança
  da Aviação Civil Contra Atos de Interferência Ilícita (PNAVSEC), aprovado pelo Decreto nº
  7.168, de 05 de maio de 2010, com vistas a garantir a integridade de passageiros, tripulantes,
  pessoal de terra, público em geral, aeronaves e instalações aeroportuárias, de forma a proteger
  as operações da aviação civil contra atos de interferência ilícita.

  (1) A aplicabilidade de cada requisito deste regulamento está apresentada no Apêndice A,
  para cada classe de aeródromo estabelecida conforme disposições da seção 107.9.'
