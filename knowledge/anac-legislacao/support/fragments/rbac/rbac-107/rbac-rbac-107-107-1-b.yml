cite: 107.1(b)
title: 107.1(b)
text: '(b) Este regulamento não se aplica:

  (1) aos aeródromos civis destinados exclusivamente a helicópteros (helipontos ou heliportos);

  (2) às áreas militares dos aeródromos civis compartilhados; e

  (3) às instalações e serviços de controle do espaço aéreo e de proteção ao voo, sob responsabilidade
  de organizações das Forças Armadas.'
