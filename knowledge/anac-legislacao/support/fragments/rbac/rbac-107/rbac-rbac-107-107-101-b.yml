cite: 107.101(b)
title: 107.101(b)
text: '(b) Os pontos de controle de acesso devem impedir o acesso de pessoas, veículos e equipamentos
  sem credenciais ou autorizações ou com credenciais ou autorizações falsificadas, alteradas,
  vencidas ou de terceiros por meio de vigilância permanente.

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (1) No caso de pontos de controle de acesso de uso comum para pessoas e veículos, o operador
  de aeródromo deve garantir canais de fluxo segregados, de forma que as medidas de segurança
  aplicadas no controle de acesso de pessoas não interfiram nas medidas aplicadas aos veículos.'
