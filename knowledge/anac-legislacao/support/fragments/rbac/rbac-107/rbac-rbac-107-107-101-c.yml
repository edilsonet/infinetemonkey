cite: 107.101(c)
title: 107.101(c)
text: '(c) Os pontos de acesso emergencial devem apresentar as seguintes características gerais:

  (1) disponibilizar aviso de alerta quanto à destinação do acesso e quanto à proibição de
  uso fora de situações emergenciais;

  (2) possuir monitoramento através de sistema de CFTV;

  (3) permanecer fechado e trancado no caso de ponto de acesso emergencial destinado ao uso
  de veículos; e

  (Redação dada pela Resolução nº 500, de 12.12.2018)

  (4) possuir sistema de alarme sonoro quando da utilização (abertura) do ponto de acesso,
  para acionamento do setor responsável pelo monitoramento dos acessos de emergência, quando
  localizados no terminal de passageiros.'
