text: '(b) O operador de aeródromo deve garantir que apenas pessoas, veículos e equipamentos
  previamente identificados e autorizados tenham acesso à área controlada através dos pontos
  de controle de acesso.

  (1) O acesso desacompanhado à área controlada é permitido:'
