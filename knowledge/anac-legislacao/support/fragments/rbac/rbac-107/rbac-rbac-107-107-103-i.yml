section_title: Pontos de Acesso à Área Controlada
subsection_id: i
cite: 107.103(i)
title: 107.103(i)
text: '(i) aos profissionais necessários à execução de serviços emergenciais de manutenção,
  mediante solicitação formal da organização instalada no aeródromo e demandante dos serviços;

  (ii) aos agentes públicos de fiscalização e controle, no exercício da função, que apresentem
  identificação expedida pelos respectivos órgãos; e

  (iii) na forma de comboio, aos condutores de veículos ou equipamentos não credenciados,
  com necessidade de atendimento às atividades ou serviços na área controlada.

  (4) Em caso de acesso ou tentativa de acesso indevido, o operador de aeródromo deve aplicar
  medidas de pronta resposta que sejam suficientes para bloquear e/ou impedir a continuidade
  do acesso, incluindo, quando necessário, a comunicação ao setor de segurança aeroportuária
  e/ou ao órgão de segurança pública responsável pelas atividades de polícia no aeródromo,
  observando o plano de contingência do aeródromo.'
