cite: 107.105(a)
title: 107.105(a)
text: '(a) Os pontos de controle de acesso devem ser instalados observando critérios de facilitação,
  de forma a garantir o processamento adequado de pessoas e veículos.

  (1) Ponto de controle de acesso de uso exclusivo de funcionários, tripulantes e pessoal
  de serviço deve ser disponibilizado pelo operador do aeródromo, de forma a garantir fluxo
  e segregação adequados de funcionários em geral e passageiros.'
