title: 107.105(d)
text: '(d) O operador do aeródromo deve implementar um procedimento de confirmação quanto
  à origem de objetos sujeitos a controles de segurança aplicados fora do aeroporto e que
  isentam o processo de inspeção nos acessos às ARS, conforme previsão normativa da ANAC.

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
