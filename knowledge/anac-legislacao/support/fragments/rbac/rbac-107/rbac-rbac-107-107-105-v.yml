  (vi) aos passageiros da aviação comercial de posse de cartão de embarque válido, no caso
  de acesso às salas de embarque.

  (Incluído pela Resolução nº 500, de 12.12.2018)

  (2) O acesso à ARS, desde que supervisionado através de sistema de CFTV ou por profissional
  credenciado do operador do aeródromo, é permitido:'
