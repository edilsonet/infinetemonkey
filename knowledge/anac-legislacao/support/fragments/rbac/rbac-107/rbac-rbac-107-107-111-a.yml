section_title: Inspeção de Pessoas, seus Pertences de Mão, Veículos e Equipamentos
subsection_id: a
cite: 107.111(a)
title: 107.111(a)
text: '(a) O operador de aeródromo deve realizar a inspeção de segurança da aviação civil
  nas pessoas e seus pertences de mão, bem como em veículos e equipamentos, antes do acesso
  à ARS, devendo manter os recursos materiais e humanos necessários para a realização adequada
  da atividade, em função do nível de ameaça e critérios de facilitação, e observando os requisitos
  estabelecidos em normatização específica sobre a matéria.

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
