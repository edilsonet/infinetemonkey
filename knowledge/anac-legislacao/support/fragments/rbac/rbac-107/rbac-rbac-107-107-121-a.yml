section_title: Inspeção de Passageiros e seus Pertences de Mão
subsection_id: a
cite: 107.121(a)
title: 107.121(a)
text: (a) O operador de aeródromo deve realizar a inspeção de segurança da aviação civil nos
  passageiros e seus pertences de mão, antes do acesso à ARS, devendo manter os recursos materiais
  e humanos necessários para a realização adequada da atividade, em função do nível de ameaça
  e critérios de facilitação, e observando os requisitos estabelecidos em normatização específica
  sobre a matéria.
