cite: 107.121(b)
title: 107.121(b)
text: (b) O operador de aeródromo deve realizar gestão junto a Polícia Federal ou, na sua
  ausência, junto ao órgão de segurança pública responsável pelas atividades de polícia do
  aeródromo, para a adoção de ações que mantenham a atividade de inspeção de segurança da
  aviação civil sob a supervisão do órgão policial responsável.
