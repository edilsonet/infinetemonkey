title: 107.123(b)
text: (b) O operador do aeródromo deve prover os recursos físicos necessários para impedir
  o trânsito indevido de pessoas entre as áreas de embarque e o pátio de aeronaves, adotando
  medidas em coordenação com o operador aéreo.
