section_title: Proteção de Passageiros e seus Pertences de Mão
subsection_id: d
cite: 107.123(d)
title: 107.123(d)
text: (d) No caso de falha na segregação e algum passageiro entrar em contato com outra pessoa
  não inspecionada, o operador do aeródromo, em coordenação com o(s) operador(es) aéreo(s),
  deve garantir que seja realizada outra inspeção antes do embarque na aeronave e a varredura
  da área contaminada.
