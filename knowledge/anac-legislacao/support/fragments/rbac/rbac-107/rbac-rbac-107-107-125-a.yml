section_title: Passageiros em Trânsito ou em Conexão
subsection_id: a
cite: 107.125(a)
title: 107.125(a)
text: (a) O operador de aeródromo deve estabelecer as áreas e os corredores destinados &agravagrave;
  chegada, circulação e partida de passageiros em trânsito ou em conexão, indicando os percursos
  e pontos de inspeção a serem observados pelos operadores aéreos na atividade de supervisão
  do processamento desses passageiros e suas respectivas bagagens de mão.
