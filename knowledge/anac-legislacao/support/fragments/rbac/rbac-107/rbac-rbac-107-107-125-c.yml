cite: 107.125(c)
title: 107.125(c)
text: '(c) O operador de aeródromo deve garantir, em coordenação com o operador aéreo, que
  o passageiro em trânsito seja submetido às medidas de segurança, de acordo com as condições
  e nos casos previstos por DAVSEC.

  (Incluído pela Resolução nº 625, de 07.06.2021)'
