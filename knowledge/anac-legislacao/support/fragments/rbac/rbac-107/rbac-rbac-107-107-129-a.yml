section_title: Passageiro sob Custódia
subsection_id: a
cite: 107.129(a)
title: 107.129(a)
text: (a) O operador de aeródromo deve garantir, em coordenação com o operador aéreo e com
  órgão de segurança pública responsável pelas atividades de polícia no aeródromo, a aplicação
  das medidas de segurança necessárias ao processamento e embarque de passageiro sob custódia,
  observando os requisitos e procedimentos estabelecidos em normatização específica sobre
  a matéria.
