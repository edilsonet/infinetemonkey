section_title: Passageiro Indisciplinado
subsection_id: a
cite: 107.131(a)
title: 107.131(a)
text: (a) O operador de aeródromo deve estabelecer, em coordenação com o operador aéreo e
  com o órgão de segurança pública responsável pelas atividades de polícia no aeródromo, os
  procedimentos adequados para serem utilizados no gerenciamento de situações de resposta
  que envolvam passageiro indisciplinado, em especial quanto a retirada do passageiro da ARS.
