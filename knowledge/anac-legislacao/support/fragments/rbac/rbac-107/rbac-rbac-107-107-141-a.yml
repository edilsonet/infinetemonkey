section_title: Proteção da Bagagem Despachada
subsection_id: a
cite: 107.141(a)
title: 107.141(a)
text: (a) O operador de aeródromo deve prover os recursos físicos necessários para a garantia
  da proteção da bagagem despachada, sob a responsabilidade do operador aéreo, de forma a
  prevenir que qualquer bagagem despachada, de origem, trânsito ou conexão, ou mesmo na condição
  de extraviada, seja violada ou sujeita à introdução de objetos, materiais ou substâncias
  que possam ser utilizados em atos de interferência ilícita.
