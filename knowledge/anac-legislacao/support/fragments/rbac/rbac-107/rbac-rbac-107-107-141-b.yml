section_title: Proteção da Bagagem Despachada
subsection_id: b
cite: 107.141(b)
title: 107.141(b)
text: (b) O operador do aeródromo deve manter sistema de CFTV que abranja o fluxo de embarque
  (área de aceitação, triagem e inspeção) e desembarque (área de restituição) da bagagem despachada,
  com capacidade de monitoramento e gravação por um período mínimo de 30 (trinta) dias.
