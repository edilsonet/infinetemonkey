section_title: Inspeção da Bagagem Despachada
subsection_id: b
cite: 107.143(b)
title: 107.143(b)
text: '(b) O operador de aeródromo deve prover os recursos físicos necessários para que os
  operadores aéreos realizem a inspeção de bagagem despachada para seguir em voos domésticos,
  conforme condições e prazos definidos pela ANAC por meio de DAVSEC.

  (Redação dada pela Resolução nº 625, de 07.06.2021)'
