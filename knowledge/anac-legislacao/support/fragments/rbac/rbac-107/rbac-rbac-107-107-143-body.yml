text: '107.143

  Inspeção da Bagagem Despachada

  107.143(a)

  260.000

  455.000

  650.000

  1 por constatação

  (não operacionalidade do equipamento)

  107.143(b)

  260.000 + N*720

  onde N é o número de dias corridos de atraso no prazo estabelecido na DAVSEC.

  Limitado ao valor máximo de:

  R$ 434.000

  455.000 + N*1.260

  onde N é o número de dias corridos de atraso no prazo estabelecido na DAVSEC.

  Limitado ao valor máximo de:

  R$ 761.000

  650.000 + N*1.800

  onde N é o número de dias corridos de atraso no prazo estabelecido na DAVSEC.

  Limitado ao valor máximo de: R$ 1.087.000

  1 por constatação

  (não atendimento aos prazos de provimento do equipamento)

  107.143(b)

  260.000

  455.000

  650.000

  1 por constatação

  (não operacionalidade do equipamento)

  Parâmetro de incidência

  Forma de aplicação

  1 por constatação

  Será aplicada uma multa por cada conjunto de irregularidades identificadas que decorram
  de violação ao requisito que indica esse parâmetro de incidência'
