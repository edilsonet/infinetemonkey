section_title: Bagagem Despachada em Trânsito ou em Conexão
subsection_id: a
cite: 107.145(a)
title: 107.145(a)
text: (a) O operador de aeródromo deve estabelecer as áreas e os fluxos destinados à chegada,
  circulação e partida de bagagens despachadas em trânsito ou em conexão, indicando os percursos
  e pontos de inspeção a serem observados pelos operadores aéreos no processamento dessas
  bagagens.
