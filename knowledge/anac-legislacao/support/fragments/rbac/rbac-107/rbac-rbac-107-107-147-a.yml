cite: 107.147(a)
title: 107.147(a)
text: (a) O operador de aeródromo, em coordenação com o operador aéreo e com o órgão de segurança
  pública responsável pelas atividades de polícia no aeródromo, deve prover recursos adequados
  para serem utilizados no gerenciamento de situações de resposta que envolvam bagagem caracterizada
  como suspeita.
