cite: 107.165(a)
title: 107.165(a)
text: '(a) O operador de aeródromo deve prover os recursos físicos necessários para a realização
  da inspeção de segurança de carga e mala postal, sob a responsabilidade do operador aéreo,
  exceto em instalações sob exploração do operador aéreo.

  (1) A inspeção de segurança da carga e mala postal deve ser realizada na transição de acesso
  às ARS ou em ARS. Caso a inspeção seja realizada em ARS, carga e mala postal deverão ser
  mantidas sob vigilância permanente do operador de aeródromo até a realização da inspeção
  de segurança.

  (Incluído pela Resolução nº 644, de 05.11.2021)'
