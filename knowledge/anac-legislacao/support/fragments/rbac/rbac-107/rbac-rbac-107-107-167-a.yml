section_title: Carga e Mala Postal em Trânsito ou em Conexão
subsection_id: a
cite: 107.167(a)
title: 107.167(a)
text: (a) O operador de aeródromo deve estabelecer as áreas e os fluxos destinados à chegada,
  circulação e partida de carga ou mala postal em trânsito ou em conexão, inclusive dos volumes
  que não passam pelo terminal de carga sob responsabilidade do operador de aeródromo, indicando
  os percursos e pontos de inspeção a serem observados pelos operadores aéreos no processamento
  dos volumes.
