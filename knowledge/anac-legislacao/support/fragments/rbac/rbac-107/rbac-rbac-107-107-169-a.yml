cite: 107.169(a)
title: 107.169(a)
text: (a) O operador de aeródromo, em coordenação com o operador aéreo, deve prover recursos
  adequados para serem utilizados no gerenciamento de situações de resposta que envolvam carga
  ou mala postal caracterizados como suspeitos.
