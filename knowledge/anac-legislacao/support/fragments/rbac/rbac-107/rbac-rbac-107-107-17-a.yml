section_title: Avaliação de Risco e Planejamento Aeroportuário
subsection_id: a
cite: 107.17(a)
title: 107.17(a)
text: '(a) O operador de aeródromo deve elaborar e implementar um processo contínuo de avaliação
  de risco, com o objetivo de orientar o planejamento da segurança aeroportuária e complementar
  as medidas de segurança previstas em norma, se necessário.

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
