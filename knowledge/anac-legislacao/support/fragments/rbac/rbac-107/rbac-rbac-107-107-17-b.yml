title: 107.17(b)
text: (b) Na elaboração de estudos e projetos com fins de reforma, modernização ou ampliação
  da infraestrutura e instalações aeroportuárias, o operador de aeródromo deve garantir que
  os aspectos de AVSEC sejam observados e contemplados, em especial os requisitos deste regulamento.
