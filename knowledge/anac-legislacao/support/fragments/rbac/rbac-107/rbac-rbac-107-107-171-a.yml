cite: 107.171(a)
title: 107.171(a)
text: '(a) Para a realização de operações de embarque e desembarque de valores, o operador
  de aeródromo deve estabelecer, em coordenação com o órgão de segurança pública, a aplicação
  de:

  (1) medidas de segurança preventivas, de forma a dificultar e dissuadir eventuais atos intencionais
  contra a segurança deste tipo de operação; e

  (2) medidas de resposta, de forma a mitigar adequadamente qualquer ocorrência que coloque
  em risco tais operações.

  CONTROLES DE SEGURANÇA RELATIVOS A INSUMOS E MERCADORIAS DE AEROPORTOS, PROVISÕES DE BORDO
  E PROVISÕES DE SERVIÇO DE BORDO

  (Incluído pela Resolução nº 644, de 05.11.2021)'
