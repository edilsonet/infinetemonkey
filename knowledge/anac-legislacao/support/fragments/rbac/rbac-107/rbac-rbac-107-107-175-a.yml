title: 107.175(a)
text: (a) O operador de aeródromo deve garantir que materiais de serviço, mercadorias ou suprimentos
  sejam objeto de inspe&ccedccedil;ão de segurança apropriada nos acessos às ARS, exceto se
  houver outros controles de segurança implementados de forma que seja constituída uma cadeia
  segura desses insumos, conforme PSA do aeroporto.
