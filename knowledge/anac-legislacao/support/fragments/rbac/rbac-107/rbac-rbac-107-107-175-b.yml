title: 107.175(b)
text: '(b) Os operadores podem permitir o acesso de itens proibidos à ARS desde que sejam
  implementados controles de rastreamento e que haja confirmação da necessidade legítima de
  uso em ARS.

  (Incluído pela Resolução nº 644, de 05.11.2021)'
