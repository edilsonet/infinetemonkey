section_title: Diretrizes e Estrutura do Sistema de Controle de Qualidade AVSEC
subsection_id: a
cite: 107.183(a)
title: 107.183(a)
text: '(a) O Sistema de Controle de Qualidade AVSEC deve atender às seguintes diretrizes:

  (1) ser um processo contínuo que incorpore procedimentos internos, tais como técnicas de
  auditoria e inspeções, com o objetivo de garantir a qualidade da segurança da aviação civil
  contra atos de interferência ilícita;

  (2) ser capaz de identificar as deficiências e desenvolver meios padronizados de correção
  para tratá-las;

  (3) ser de responsabilidade primária da alta direção do operador de aeródromo, que deve
  avaliar o relatório anual das atividades de controle de qualidade e estabelecer diretrizes
  e metas para as ações futuras relacionadas ao controle de qualidade AVSEC do operador;

  (4) prever ações que objetivem a implementação da cultura AVSEC em todos os níveis da empresa,
  em especial nos seus dirigentes e profissionais que atuem diretamente na aplicação de procedimentos
  de segurança;

  (5) ser estruturado de forma a facilitar a obtenção de informações fidedignas em todas as
  esferas administrativas e operacionais do operador; e

  (6) considerar tanto os procedimentos implementados pelo próprio operador de aeródromo quanto
  aqueles desenvolvidos por empresas vinculadas ao operador, tais como empresas contratadas
  e exploradores de áreas aeroportuárias que executem diretamente medidas e procedimentos
  de segurança.'
