cite: 107.185(a)
title: 107.185(a)
text: '(a) O operador de aeródromo deve realizar as seguintes atividades de controle de qualidade,
  observando as frequências mínimas estabelecidas no Apêndice A:

  (1) auditorias internas;

  (2) inspeções internas;

  (3) testes; e

  (4) exercícios.'
