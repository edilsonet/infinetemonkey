text: '107.185

  Atividades de Controle de Qualidade AVSEC

  Dispensado.

  Obrigatório.

  Obrigatório.

  Obrigatório.

  107.185(a)(1)

  Auditorias Internas

  Dispensado.

  Obrigatório, quando o aeródromo atende voo de aeronave com capacidade superior a 60 assentos.
  1 (uma) a cada intervalo máximo de 36 (trinta e seis) meses

  Obrigatório. 1 (uma) a cada intervalo máximo de 24 (vinte e quatro) meses

  Obrigatório. 1 (uma) a cada intervalo máximo de 12 (doze) meses

  107.185(a)(2)

  Inspeções Internas

  Dispensado.

  Obrigatório, quando o aeródromo atende voo de aeronave com capacidade superior a 60 assentos.
  1 (uma) a cada intervalo máximo de 12 (doze) meses

  Obrigatório. 1 (uma) a cada intervalo máximo de 6 (seis) meses

  Obrigatório. 1 (uma) a cada intervalo máximo de 6 (seis) meses

  107.185(a)(3)

  Testes

  Dispensado.

  Obrigatório, quando atende voo de aeronave com capacidade superior a 60 assentos. 1 (um)
  conjunto de testes a cada intervalo máximo de 18 (dezoito) meses

  Obrigatório. 1 (um) conjunto de testes a cada intervalo máximo de 6 (seis) meses

  Obrigatório. 1 (um) conjunto de testes a cada intervalo máximo de 6 (seis) meses

  107.185(a)(4)

  Exercícios

  Dispensado.

  Dispensado.

  Obrigatório. 1 (um) exercício simulado de mesa a cada intervalo máximo de 12 (doze) meses.
  Para aeroportos que operam voos regulares internacionais, 1 (um) exercício simulado a cada
  intervalo máximo de 12 (doze) meses, alternadamente entre: 1 (um) exercício simulado de
  mesa e 1 (um) exercício simulado de escala real.

  Obrigatório. 1 (um) exercício simulado a cada intervalo máximo de 12 (doze) meses, alternadamente
  entre: 1 (um) exercício simulado de mesa e 1 (um) exercício simulado de escala real.'
