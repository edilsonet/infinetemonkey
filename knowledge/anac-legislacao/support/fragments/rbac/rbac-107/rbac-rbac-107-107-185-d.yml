cite: 107.185(d)
title: 107.185(d)
text: '(d) Na execução das inspeções internas o operador de aeródromo deve observar as seguintes
  disposições:

  (1) o escopo da inspeção deve ser definido pelo responsável pela AVSEC do aeródromo, de
  forma justificada no relatório de inspeção, buscando o foco nas medidas de segurança e procedimentos
  que se relacionem às vulnerabilidades e ameaças mais significativas, às eventuais ações
  corretivas anteriores e àqueles que sofreram alterações recentes;

  (2) a inspeção deve ser conduzida pelo responsável pela AVSEC do aeródromo ou por profissional
  capacitado, nos termos do PNIAVSEC; e

  (3) a inspeção deve utilizar técnicas similares à auditoria, tais como revisão de documentos,
  entrevistas e observações diretas.'
