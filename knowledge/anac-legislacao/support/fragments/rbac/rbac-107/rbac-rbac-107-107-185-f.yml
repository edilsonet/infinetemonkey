cite: 107.185(f)
title: 107.185(f)
text: '(f) Os exercícios de segurança são divididos em exercício simulado de mesa e exercício
  simulado de escala real e, na execução destes, o operador de aeródromo deve observar as
  seguintes disposições:

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (1) os exercícios de segurança devem ser coordenados e acompanhados por profissional(is)
  capacitado(s), nos termos do PNIAVSEC;

  (2) os exercícios que possam ocasionar apreensão ou pânico, que forem utilizar objetos proibidos
  ou perigosos, inclusive réplicas destes ou que forem afetar a rotina das operações aeroportuárias
  ou dos Operadores Aéreos, devem ser previamente coordenados com a Polícia Federal; e

  (3) o operador de aeródromo deve convocar representantes dos operadores aéreos e dos órgãos
  públicos envolvidos nas ações de contingência para participar dos exercícios de segurança,
  informando quais são as ações esperadas de cada um deles, conforme o objetivo do exercício
  e o previsto nos Programas de Segurança (PSA e PSOA) e demais regulamentos aplicáveis.'
