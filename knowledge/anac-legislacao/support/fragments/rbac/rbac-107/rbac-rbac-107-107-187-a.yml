cite: 107.187(a)
title: 107.187(a)
text: '(a) O operador de aeródromo deve elaborar e manter relatórios das atividades de controle
  de qualidade realizadas, observando as seguintes disposições:

  (1) Os relatórios de auditoria interna, inspeção interna e testes AVSEC devem indicar todos
  os requisitos AVSEC avaliados pelo operador de aeródromo, as datas de realização das atividades,
  os profissionais executores e os resultados verificados; e

  (2) O relatório de exercício de segurança deve apresentar qual tipo de exercício foi realizado
  (exercício simulado de mesa ou exercício simulado de escala real e qual(is) cenário(s) do
  Plano de Contingência avaliado(s)), a data de realização, o nome do profissional responsável
  pela condução da atividade, a lista de presença dos participantes do exercício, a descrição
  de como o exercício se desenvolveu e os resultados verificados.

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
