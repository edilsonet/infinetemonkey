title: 107.187(b)
text: (b) No mínimo anualmente, o responsável pelo PCQ/AVSEC do aeródromo deve elaborar e
  apresentar à alta direção do operador de aeródromo, um relatório contendo um resumo de todas
  as atividades de controle de qualidade AVSEC realizadas ao longo do ano anterior.
