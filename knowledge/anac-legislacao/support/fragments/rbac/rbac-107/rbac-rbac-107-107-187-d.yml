cite: 107.187(d)
title: 107.187(d)
text: (d) Quaisquer informações que derivem das atividades de controle de qualidade AVSEC,
  tais como relatórios e resultados de testes, que contenham dados reais sobre a segurança
  da aviação civil contra atos de interferência ilícita, devem ser tratadas pelo operador
  de aeródromo de forma a prevenir sua divulgação indevida.
