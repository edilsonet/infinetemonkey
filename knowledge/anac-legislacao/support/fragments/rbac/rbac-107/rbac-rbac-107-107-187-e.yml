cite: 107.187(e)
title: 107.187(e)
text: '(e) O operador de aeródromo, quando solicitado pela ANAC, deve encaminhar à Agência
  cópia dos relatórios das atividades de controle de qualidade por ele realizadas.

  (1) As formas e prazos para encaminhamento serão determinados pela ANAC quando da solicitação.

  (2) As informações recebidas por meio dessa fonte não serão objeto de sanção por parte da
  ANAC, salvo quando da existência de outra fonte com a mesma informação.'
