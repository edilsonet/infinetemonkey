title: 107.189(d)
text: '(d) O plano de ações corretivas, no caso de atividade de controle de qualidade AVSEC
  realizada pela ANAC, deve ser encaminhado à Agência em prazo não superior à 30 (trinta)
  dias.

  (1) O prazo acima determinado vale também para as atualizações do plano e pode ser reduzido
  ou prolongado pela ANAC, de forma justificada.'
