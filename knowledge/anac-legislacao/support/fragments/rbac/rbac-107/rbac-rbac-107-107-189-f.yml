title: 107.189(f)
text: '(f) Os padrões mínimos de desempenho para os testes AVSEC e os procedimentos para monitoramento
  de tais padrões serão estabelecidos pela ANAC, por meio de ato de caráter reservado da Superintendência
  responsável pela AVSEC.

  (Redação dada pela Resolução nº 676, de 04.05.2022)'
