title: 107.189(g)
text: '(g) Em caso de obtenção de resultado abaixo do padrão mínimo de desempenho estabelecido
  pela Agência para os testes AVSEC em determinado ciclo, o operador de aeródromo deverá adotar
  ações corretivas e outras ações previstas em ato de caráter reservado da Superintendência
  responsável pela AVSEC.

  (Redação dada pela Resolução nº 676, de 04.05.2022)'
