section_title: Aquisição de Equipamentos de Segurança
subsection_id: a
cite: 107.19(a)
title: 107.19(a)
text: '(a) O operador de aeródromo deve adquirir equipamentos de segurança de forma a atender
  aos requisitos deste regulamento.

  (1) Os equipamentos de segurança a serem adquiridos pelo operador de aeródromo devem atender
  as especificações técnicas mínimas dos parâmetros de detecção, calibração e operação necessários
  para assegurar a eficácia e continuidade dos níveis de segurança.

  (2) O operador de aeródromo deve considerar a utilização de tecnologias modernas que permitam
  a execução das medidas de forma eficiente e eficaz, que respeitem a privacidade do usuário
  e promovam a facilitação do transporte aéreo.'
