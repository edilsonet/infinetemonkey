cite: 107.19(b)
title: 107.19(b)
text: '(b) A utilização de equipamentos de inspeção de segurança que adotem tecnologias ou
  conceitos operacionais ainda não previstos pela regulamentação poderá ser realizada mediante
  aprovação prévia da ANAC.

  (1) A solicitação de utilização de equipamento de inspeção que adote tecnologias ou conceitos
  operacionais ainda não previstos deve ser encaminhada à ANAC pelo operador de aeródromo
  interessado.

  (2) Com o objetivo de verificar a eficácia de determinado equipamento de segurança, a ANAC
  poderá determinar, por período de tempo específico, que o equipamento seja utilizado pelo
  operador de aeródromo apenas em operação assistida.'
