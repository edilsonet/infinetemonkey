cite: 107.191(b)
title: 107.191(b)
text: '(b) O canal de comunicação implantado pelo operador de aeródromo deve observar as seguintes
  disposições:

  (1) ser de fácil acesso, permitindo que os relatos e informações sejam encaminhadas de forma
  ágil ao operador de aeródromo;

  (2) possibilitar o recebimento de informações sem identificação do remetente; e

  (3) ser divulgado à comunidade aeroportuária, por meio de cartazes nas áreas de maior movimentação
  de pessoal de serviço e tripulantes.'
