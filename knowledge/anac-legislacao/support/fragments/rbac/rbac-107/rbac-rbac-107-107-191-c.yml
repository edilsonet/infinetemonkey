cite: 107.191(c)
title: 107.191(c)
text: '(c) O operador de aeródromo deve analisar as informações recebidas e mitigar vulnerabilidades
  ou ameaças que tragam risco a segurança da aviação.

  (1) Os relatos e informações recebidos pelo operador de aeródromo por meio do sistema confidencial
  de relatos, bem como as ações decorrentes implementadas pelo operador de aeródromo, devem
  ser documentados e arquivados por prazo mínimo de 2 (dois) anos, em formato físico ou digital.'
