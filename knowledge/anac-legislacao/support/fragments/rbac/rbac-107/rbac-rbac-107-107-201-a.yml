section_title: Estrutura do Sistema de Contingência de AVSEC
subsection_id: a
cite: 107.201(a)
title: 107.201(a)
text: (a) O operador de aeródromo deve estruturar um sistema de contingência, em coordenação
  com os operadores aéreos, exploradores de área e demais órgãos públicos e entidades envolvidos
  com a segurança da aviação civil, a fim de responder de forma eficaz a possíveis ameaças
  ou atos de interferência ilícita que possam afetar a segurança, com o menor impacto possível
  às operações do aeródromo.
