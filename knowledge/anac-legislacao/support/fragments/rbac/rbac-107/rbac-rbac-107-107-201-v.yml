title: 107.201(v)
text: '(v) garantir que seus funcionários, orgânicos ou terceirizados, possuam o conhecimento
  necessário para a condução das ações de contingência de sua responsabilidade;

  (vi) difundir os procedimentos e as informações, que sejam necessários para a condução adequada
  das ações de contingência, à comunidade aeroportuária e ao público em geral presente no
  aeródromo; e

  (vii) executar os exercícios simulados de segurança, atendendo as disposições previstas
  no PNCQ/AVSEC.

  (2) Quanto à condução das ações de contingência:'
