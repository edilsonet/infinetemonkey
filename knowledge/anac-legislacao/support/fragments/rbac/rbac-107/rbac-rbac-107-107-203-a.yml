cite: 107.203(a)
title: 107.203(a)
text: (a) No caso de o nível nacional de ameaça ser classificado como âmbar ou vermelho ou
  no caso de um determinado aeródromo ou voo estar sob uma situação de ameaça, o operador
  de aeródromo deve garantir a adoção das medidas adicionais de segurança, conforme estabelecido
  em DAVSEC ou, na inexistência desta, em seu plano de contingência.
