cite: 107.205(a)
title: 107.205(a)
text: '(a) O operador de aeródromo envolvido no gerenciamento de resposta aos atos de interferência
  ilícita deve:

  (1) disponibilizar recursos e instalações adequados, fora da área do COE, necessários para
  que um funcionário, porta-voz, previamente indicado possa comunicar-se com a imprensa;

  (2) restringir, ao mínimo possível, o fornecimento de informações à imprensa e ao público
  em geral a respeito do planejamento e métodos utilizados por agressores e outros detalhes
  críticos que possam comprometer a eficácia das ações de contingência; e

  (3) prevenir o fornecimento indevido de informações contraditórias ou conflitantes à imprensa,
  através de uma coordenação prévia com as autoridades dos órgãos públicos e operadores aéreos
  envolvidos.'
