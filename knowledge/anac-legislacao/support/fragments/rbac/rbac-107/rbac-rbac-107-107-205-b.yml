cite: 107.205(b)
title: 107.205(b)
text: (b) O operador de aeródromo deve disponibilizar local e recursos adequados, inclusive
  de telecomunicações, a serem utilizados pelo próprio operador do aeródromo ou por operador
  aéreo envolvido para a instalação de centro de apoio às famílias das vítimas de ato de interferência
  ilícita.
