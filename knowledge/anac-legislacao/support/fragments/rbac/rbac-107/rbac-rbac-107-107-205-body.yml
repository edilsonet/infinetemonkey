text: '107.205

  Comunicação Social e Atendimento a Familiares

  Dispensado.

  Obrigatório, quando o aeródromo atende voo internacional.

  Obrigatório, quando o aeródromo atende operação regular internacional ou operação de transporte
  aéreo público não regular com a comercialização de assentos individuais ou de espaços para
  carga ou pessoas estranhas ao contrato da operação.

  Obrigatório, quando o aeródromo atende operação regular internacional ou operação de transporte
  aéreo público não regular com a comercialização de assentos individuais ou de espaços para
  carga ou pessoas estranhas ao contrato da operação.

