title: 107.21(i)
text: '(i) o cronograma de realização de testes e ensaios de aferição;

  (ii) a(s) metodologia(s) empregada(s) nos testes e ensaios de cada equipamento;

  (iii) o(s) resultado(s) esperado(s) para a condição de funcionamento aceitável do equipamento;
  e

  (iv) as ações corretivas a serem adotadas na identificação de deficiências ou desvios das
  características esperadas.'
