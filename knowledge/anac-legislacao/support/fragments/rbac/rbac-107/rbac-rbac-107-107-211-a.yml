cite: 107.211(a)
title: 107.211(a)
text: '(a) O operador de aeródromo deve adotar os meios e procedimentos previstos no seu Programa
  de Segurança Aeroportuária (PSA), o qual é definido pela ANAC por meio de Instrução Suplementar
  (IS).

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (1) O operador de aeródromo deve, na forma determinada pela ANAC, apresentar o Formulário
  de Dados AVSEC do Aeródromo, juntamente com seus anexos, atualizado a cada alteração realizada
  nas suas operações e demais configurações requeridas pelo Formulário.

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (2) Caso o operador de aeródromo pretenda implementar inclusão de medida de segurança ou
  procedimento alternativo de segurança em relação ao disposto na IS, deverá informar previamente
  à ANAC as alterações pretendidas para fins de aprovação.

  (Redação dada pela Resolução nº 643, de 05.11.2021)'
