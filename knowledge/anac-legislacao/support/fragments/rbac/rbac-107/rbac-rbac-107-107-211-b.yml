title: 107.211(b)
text: '(b) No PSA devem constar informações gerais do aeródromo e de seu operador, a descrição
  detalhada da infraestrutura e dos equipamentos de segurança utilizados na AVSEC (tipo, quantidade
  e localização), as medidas e os procedimentos de segurança empregados no aeródromo, de forma
  a assegurar que:

  (1) os requisitos deste regulamento sejam cumpridos; e

  (2) na leitura dos procedimentos seja possível esclarecer, no mínimo, os seguintes questionamentos:'
