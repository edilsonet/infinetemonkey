title: 107.211(f)
text: '(f) O Responsável pela AVSEC do operador do aeródromo, previsto no parágrafo 107.25(b),
  é responsável pela guarda, distribuição e controle do PSA, de forma que garanta o devido
  sigilo do documento.

  (Incluído pela Resolução nº 643, de 05.11.2021)'
