text: '(g) O operador de aeródromo deve manter ao menos uma cópia do seu PSA em formato físico
  ou digital.

  (Incluído pela Resolução nº 643, de 05.11.2021)

  (1) A última versão da Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos,
  aprovada pela ANAC, é parte integrante do PSA.

  (Incluído pela Resolução nº 643, de 05.11.2021)'
