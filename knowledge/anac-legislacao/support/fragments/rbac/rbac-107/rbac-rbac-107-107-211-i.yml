cite: 107.211(i)
title: 107.211(i)
text: '(i) Alterações que não se enquadrem no 107.211(a)(2) devem ser apresentadas à ANAC
  em até 60 (sessenta) dias após sua implementação.

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (3) Na hipótese do parágrafo 107.211(a)(2), o operador de aeródromo deverá apresentar somente
  as alterações pretendidas à ANAC, acompanhadas de justificativa.

  (Incluído pela Resolução nº 643, de 05.11.2021)

  (4) O meio ou procedimento alternativo apresentado deve garantir nível de segurança igual
  ou superior ao estabelecido ao requisito aplicável ou concretizar o objetivo do procedimento
  normalizado na IS.

  (Incluído pela Resolução nº 643, de 05.11.2021)

  (5) O PSA deve ser tratado como documento de acesso restrito às pessoas legítimas com necessidade
  de conhecimento da informação.

  (Incluído pela Resolução nº 643, de 05.11.2021)

  (6) As partes pertinentes do PSA devem ser disponibilizadas às entidades públicas e privadas
  da comunidade aeroportuária que necessitem conhecer as informações do programa, para fins
  de aplicação coordenada e eficaz dos procedimentos preventivos de segurança e dos procedimentos
  de resposta à emergência.

  (Incluído pela Resolução nº 643, de 05.11.2021)'
