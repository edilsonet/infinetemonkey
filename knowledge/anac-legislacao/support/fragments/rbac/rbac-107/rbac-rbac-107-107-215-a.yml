section_title: Plano de Segurança de Empresa de Serviços Auxiliares ou Exploradores de Área
  Aeroportuária (PSESCA)
subsection_id: a
cite: 107.215(a)
title: 107.215(a)
text: '(a) O operador de aeródromo deve exigir a elaboração, implementação e manutenção de
  um PSESCA por parte de:

  (1) empresas de provisões de bordo e de serviço de bordo, que prestam serviço a operadores
  aéreos, utilizando o conceito de cadeia segura para o encaminhamento de insumos às ARS do
  aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
