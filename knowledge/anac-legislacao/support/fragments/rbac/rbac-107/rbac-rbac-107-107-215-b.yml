cite: 107.215(b)
title: 107.215(b)
text: '(b) A elaboração do PSESCA deve observar os seguintes aspectos:

  (1) passar por processo de análise e aprovação por parte do operador do aeródromo;

  (2) o conteúdo deve abranger a descrição dos recursos humanos e materiais e das medidas
  empregadas na aplicação de controles de segurança nas áreas, edifícios e instalações explorados
  pelo concessionário, especialmente quanto à(s):'
