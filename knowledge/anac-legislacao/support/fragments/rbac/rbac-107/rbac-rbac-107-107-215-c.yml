section_title: Plano de Segurança de Empresa de Serviços Auxiliares ou Exploradores de Área
  Aeroportuária (PSESCA)
subsection_id: c
cite: 107.215(c)
title: 107.215(c)
text: (c) O operador de aeródromo deve considerar a existência de PSESCA como situação condicionante
  para autorizar a exploração regular de áreas e instalações, devendo estabelecer instrumentos
  contratuais que visem garantir a elaboração e manutenção do PSESCA por parte do explorador
  de área aeroportuária.
