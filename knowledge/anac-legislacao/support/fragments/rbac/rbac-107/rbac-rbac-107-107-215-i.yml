cite: 107.215(i)
title: 107.215(i)
text: '(i) designação de profissional responsável pelos processos de AVSEC, devidamente capacitado;

  (ii) medidas preventivas de proteção de perímetro, pessoas e objetos (zoneamento, barreiras,
  vigilância, controle de acesso e inspeção, quando aplicáveis); e

  (iii) medidas de resposta às emergências, observando os requisitos deste regulamento, do
  RBAC 108, quando aplicável, e as orientações específicas do operador do aeródromo.

  (3) uma cópia do PSESCA deve ser entregue ao operador de aeródromo e outra cópia deve ser
  mantida nas instalações da organização e seu conteúdo deve possuir caráter reservado aos
  próprios funcionários, funcionários do operador do aeródromo, de seus contratantes e de
  autoridades públicas envolvidas com a AVSEC;

