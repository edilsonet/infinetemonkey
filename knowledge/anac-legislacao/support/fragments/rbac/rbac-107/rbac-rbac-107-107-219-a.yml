section_title: Programa de Segurança do Operador Aéreo (PSOA)
subsection_id: a
cite: 107.219(a)
title: 107.219(a)
text: (a) O operador de aeródromo deve possuir conhecimento das partes pertinentes do PSOA
  dos operadores aéreos em operação no aeródromo e realizar as coordenações necessárias, para
  garantir a compatibilidade com as medidas de segurança do aeródromo e a implementação adequada
  das medidas preventivas e de respostas previstas no programa.
