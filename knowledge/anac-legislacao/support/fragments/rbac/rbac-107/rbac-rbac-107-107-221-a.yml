cite: 107.221(a)
title: 107.221(a)
text: (a) O operador de aeródromo deve elaborar, implementar e manter um Programa de Controle
  de Qualidade AVSEC (PCQ/AVSEC) com o objetivo de conduzir as atividades de controle de qualidade
  AVSEC de forma padronizada, eficiente e segura.
