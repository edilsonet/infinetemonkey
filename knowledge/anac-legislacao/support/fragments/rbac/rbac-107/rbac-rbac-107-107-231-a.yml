cite: 107.231(a)
title: 107.231(a)
text: (a) Com o objetivo de promover a operação de sistemas automatizados de inspeção de bagagem
  despachada ou a implementação de fluxos de carga e mala postal mais eficientes, são aceitáveis
  as iniciativas de celebração de acordos operacionais entre o operador de aeródromo e o operador
  aéreo, estabelecendo responsabilidades específicas quanto ao fornecimento e manutenção da
  infraestrutura e execução da atividade de inspeção de bagagem despachada ou carga no aeródromo.
