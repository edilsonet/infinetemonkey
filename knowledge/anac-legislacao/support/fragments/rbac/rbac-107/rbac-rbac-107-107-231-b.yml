title: 107.231(b)
text: '(b) Para garantir a eficácia da atividade de supervisão realizada pelo operador de
  aeródromo, por meio da criação de instrumentos que motivem a implementação de ações sob
  responsabilidade de terceiros que estejam relacionadas ao cumprimento dos requisitos deste
  regulamento, o operador de aeródromo deve:

  (1) celebrar acordos operacionais com os operadores aéreos e demais exploradores de área
  aeroportuária, que prevejam, dentre outras condutas, a necessidade de observância dos requisitos
  e procedimentos de AVSEC, em especial aqueles previstos no PSA do aeródromo, quando existente,
  e que definam penalidades para o caso de identificação de situaçccedil;ões irregulares;
  e

  (2) realizar gestão permanente junto aos órgãos públicos.'
