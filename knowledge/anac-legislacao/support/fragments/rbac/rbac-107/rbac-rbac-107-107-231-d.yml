cite: 107.231(d)
title: 107.231(d)
text: '(d) A ocorrência de não conformidade com requisitos exigidos neste regulamento autoriza
  a ANAC a adotar as medidas emergenciais cabíveis para normalizar situações eventualmente
  prejudicais à segurança da aviação civil, sem prejuízo da aplicação de eventuais sanções.

  (1) A inobservância dos requisitos dos parágrafos 107.121(a), no que se refere à inspeção
  de passageiros e seus pertences de mão, ou 107.211(a)(1), no que se refere à apresentação
  do PSA à ANAC, ensejará a interrupção imediata de novas frequências de voos comerciais regulares
  ou charters que tenham como origem ou escala o aeródromo em tal situação.

  (2) A inobservância de quaisquer requisitos estabelecidos por este regulamento, associado
  à identificação de nível de risco à AVSEC não aceitável pela ANAC, poderá ensejar a interrupção
  imediata de novas frequências de voos comerciais regulares ou charters que tenham como origem
  ou escala o aeródromo em tal situação e, ainda, o cancelamento de autorizações de voos já
  concedidas.'
