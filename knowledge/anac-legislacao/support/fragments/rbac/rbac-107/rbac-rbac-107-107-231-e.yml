title: 107.231(e)
text: '(e) As violações ao previsto neste Regulamento sujeitam o infrator às penalidades constantes
  no art. 289 da Lei nº 7.565, de 19 de dezembro de 1986, que dispõe o Código Brasileiro de
  Aeronáutica, a serem apuradas em conformidade com o procedimento descrito na Resolução nº
  472, de 6 de junho de 2018, ou em outros normativos que os substituírem, adotando-se os
  valores previstos na Resolução nº 472, de 2018, e, a partir da entrada em vigor da Emenda
  nº 03 deste Regulamento, as violações ao previsto na Seção 107.143 sujeitam o infrator às
  sanções de multa previstas no Apêndice B.

  (Incluído pela Resolução nº 625, de 07.06.2021)'
