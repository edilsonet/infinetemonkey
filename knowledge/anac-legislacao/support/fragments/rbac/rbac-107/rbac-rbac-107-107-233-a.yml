cite: 107.233(a)
title: 107.233(a)
text: '(a) Até que a ANAC defina, em coordenação com os órgãos públicos, os padrões de segurança
  para aplicação do parágrafo 107.93(g), a concessão de credenciais permanentes para funcionários
  e veículos de organizações públicas deverá ser precedida da apresentação dos seguintes documentos:

  (Redação dada pela Resolução nº 500, de 12.12.2018)

  (1) solicitação formal do órgão público declarando que o servidor ou veículo oficial atuará
  no aeródromo e possui necessidade de acesso e permanência em área operacional; e

  (2) documentos que possam identificar adequadamente a pessoa ou veículo oficial a ser credenciado
  ou autorizado.'
