text: '107.233

  Disposições Transitórias

  Dispensado.

  Obrigatório.

  Obrigatório.

  Obrigatório.

  *

  Nos trechos em que o Apêndice A vincula a aplicabilidade do requisito à capacidade de assentos
  da aeronave que opera no aeródromo, entende-se que a operação deve ser na modalidade regular
  ou na modalidade não regular com a comercialização de assentos individuais ou de espaços
  para carga ou pessoas estranhas ao contrato da operação.'
