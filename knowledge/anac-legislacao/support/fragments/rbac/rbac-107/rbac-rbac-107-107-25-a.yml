title: 107.25(a)
text: (a) O operador de aeródromo deve designar profissional(ais) capacitado(s), que atenda(m)
  critérios de seleção, de acordo com requisitos estabelecidos em regulamento específico,
  quando couber, a ele legalmente vinculado(s), responsável(eis) por executar no aeródromo
  os procedimentos dos controles de segurança previstos neste regulamento.
