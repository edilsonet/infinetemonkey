title: 107.25(b)
text: '(b) O operador de aeródromo deve designar profissionais capacitados, titular e suplente(s),
  que atendam aos critérios de seleção, de acordo com requisitos estabelecidos em regulamento
  específico, quando couber, a ele legalmente vinculados, responsáveis, exclusivamente, pela
  coordenação e gestão do setor de segurança aeroportuária e dos recursos necessários à aplicação
  dos controles de segurança previstos neste regulamento, incluindo as ações de contingência.

  (Redação dada pela Resolução nº 500, de 12.12.2018)

  (1) Os profissionais devem ser designados por meio de ato próprio do operador de aeródromo
  e, para fins de exercício da função, serão considerados os Responsáveis pela AVSEC do operador
  do aeródromo.

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
