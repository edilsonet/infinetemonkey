cite: 107.25(c)
title: 107.25(c)
text: '(c) O operador de aeródromo deve designar um profissional responsável pela gestão dos
  processos relacionados ao Controle de Qualidade AVSEC.

  (Redação dada pela Resolução nº 500, de 12.12.2018)

  (1) O profissional deve ser designado por meio de ato próprio do operador de aeródromo e,
  para fins do exercício da função, será considerado o Responsável pelo PCQ/AVSEC do operador
  do aeródromo.'
