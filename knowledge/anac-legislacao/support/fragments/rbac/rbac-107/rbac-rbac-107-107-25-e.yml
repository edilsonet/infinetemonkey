title: 107.25(e)
text: '(e) O operador de aeródromo deve garantir que os profissionais que executem os procedimentos
  dos controles de segurança previstos neste regulamento como de responsabilidade do operador
  de aeródromo atuem dentro de suas atribuições e capacitações.

  (Incluído pela Resolução nº 500, de 12.12.2018)'
