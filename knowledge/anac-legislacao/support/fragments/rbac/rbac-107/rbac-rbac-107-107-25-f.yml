title: 107.25(f)
text: '(f) Em até 30 dias após a designação, o operador do aeródromo deve enviar à ANAC o
  formulário cadastral contendo a identificação dos responsáveis listados nos parágrafos 107.25(b)
  e (c), conforme modelos disponíveis no sítio da ANAC na rede mundial de computadores.

  (Incluído pela Resolução nº 643, de 05.11.2021)'
