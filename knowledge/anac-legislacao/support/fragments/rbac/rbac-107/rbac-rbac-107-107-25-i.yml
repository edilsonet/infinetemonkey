cite: 107.25(i)
title: 107.25(i)
text: '(i) Um profissional poderá ser o responsável pelo PCQ/AVSEC de mais de um aeródromo
  de mesmo operador.

  (Incluído pela Resolução nº 500, de 12.12.2018)

  (2) O profissional designado não poderá atuar em atividades operacionais AVSEC do aeródromo,
  de forma a garantir sua independência.

  (Incluído pela Resolução nº 500, de 12.12.2018)'
