cite: 107.27(a)
title: 107.27(a)
text: '(a) O operador de aeródromo deve identificar as informações, dados e sistemas de tecnologia
  da comunicação julgados como críticos para suas operações e implementar medidas para protegê-los,
  por meio de uma avaliação de risco conforme 107.17(a).

  (Incluído pela Resolução nº 644, de 05.11.2021)'
