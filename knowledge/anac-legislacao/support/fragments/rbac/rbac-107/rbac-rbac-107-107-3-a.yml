cite: 107.3(a)
title: 107.3(a)
text: '(a) Para efeito deste regulamento, aplicam-se os termos e definições estabelecidos
  no RBAC 01, denominado “Definições, Regras de Redação e Unidades de Medida para Uso nos
  RBAC”, no Anexo ao Decreto nº 7.168, de 5 de maio de 2010, que dispõe sobre o Programa Nacional
  de Segurança da Aviação Civil contra Atos de Interferência Ilícita, na Lei nº 7.565, de
  19 de dezembro de 1986, que dispõe sobre o Código Brasileiro da Aeronáutica (CBA), e os
  seguintes:

  (1) Antecedentes significa as informações de identidade, da experiência social e do histórico
  criminal de uma pessoa, como forma de avaliar sua idoneidade para fins de mitigação de riscos
  relacionados ao acesso a áreas aeroportuárias ou a informações consideradas sensíveis para
  a segurança da aviação civil;

  (2) Área controlada significa a área do aeródromo cujo acesso é restrito às pessoas autorizadas
  pelo operador do aeródromo. Pode abranger áreas internas do perímetro operacional (lado
  ar), identificadas como de grau de risco não prioritário, pontos sensíveis, ou outras áreas,
  dentro ou fora do perímetro operacional;

  (3) Área de aceitação ou recebimento de carga ou mala postal significa a área designada
  pelo operador do aeródromo destinada ao processo de aceitação de volumes de carga destinados
  ao transporte aéreo;

  (4) Área de armazenamento de carga ou mala postal significa a área delimitada e designada
  pelo operador do aeródromo destinada ao armazenamento temporário dos volumes de carga que
  estejam em processamento no terminal de carga do aeródromo;

  (5) Área de conferência ou fiscalização de carga ou mala postal significa a área designada
  pelo operador do aeródromo destinada a atender aos processos de fiscalização e controle
  conduzidos por organizações públicas, relativos à segurança pública, controle aduaneiro,
  sanitário ou fitozoossanitário;

  (6) Área de inspeção de segurança da carga ou mala postal significa a área delimitada e
  designada pelo operador do aeródromo para a realização do procedimento de inspeção de segurança
  dos volumes de carga;

  (7) Área de paletização ou expedição da carga ou mala postal significa a área designada
  pelo operador do aeródromo destinada ao processo de unitização ou paletização dos volumes
  de carga para, em seguida, serem direcionados à aeronave;

  (8) Área ou ponto de transferência de carga ou mala postal significa a área ou ponto designado
  pelo operador do aeródromo destinado ao procedimento de transferência de responsabilidade
  pela guarda e proteção dos volumes de carga em processamento no terminal de carga do aeródromo;

  (9) Área patrimonial do aeródromo (perímetro patrimonial) significa a área indicada no instrumento
  de outorga de exploração do aeródromo. Coincide com a área abrangida pelo complexo aeroportuário,
  que é caracterizado pelo sítio aeroportuário, descrito no instrumento de outorga de cada
  aeródromo, normalmente incluindo faixas de domínio, edificações e terrenos, bem como áreas
  ocupadas com instalações operacionais, administrativas e comerciais relacionadas ao aeródromo;

  (10) Área pública significa a área interna ao perímetro patrimonial onde, em situação normal,
  não são obrigatórios a aplicação de medidas de controle de acesso e o uso de credencial
  aeroportuária;

  (11) Avaliação de risco significa o processo aplicado na gestão da Segurança da Aviação
  Civil contra Atos de Interferência Ilícita de uma organização, abrangendo ao menos as etapas
  de identificação de ameaças, de vulnerabilidades e do nível de exposição das operações ao
  risco de atos de interferência ilícita;

  (12) Aviação comercial significa as operações da aviação civil que configurem transporte
  aéreo público de passageiros ou carga;

  (13) Aviação geral significa as operações de aviação civil que não configurem transporte
  aéreo público de passageiros ou carga;

  (14) Bagagem suspeita significa a denominação dada a um volume de bagagem que apresente
  alguma das seguintes características: não identificável, abandonada, violada, que apresente
  ruído, exale odor que indique uma suspeita ou apresente sinais de vazamento de alguma substância
  líquida, sólida ou gasosa não identificável como substância permitida para transporte;

  (15) Cadeia segura é a implementação de medidas que garantam que nas atividades de produção,
  armazenamento e transporte até a ARS de provisões de bordo e de serviço de bordo, de materiais
  de serviço, mercadorias e suprimentos e de carga e mala postal sejam aplicados controles
  de segurança que evitem a introdução de armas, explosivos, artefatos QBRN ou substâncias
  e materiais proibidos em alguma dessas fases;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (16) Canal de inspeção significa o ponto de controle de acesso à Área Restrita de Segurança,
  constituído de um ou mais módulos de inspeção de segurança;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (17) Carga conhecida significa a carga que é submetida a controles de segurança desde sua
  inspeção de segurança ou desde sua origem, tratando-se, neste último caso, de carga manuseada
  por (ou sob a responsabilidade de) expedidor reconhecido, expedidor acreditado ou agente
  de carga aérea acreditado;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (18) (Carga de Alto Risco significa o volume de carga ou mala postal que:

  (Redação dada pela Resolução nº 643, de 05.11.2021)'
