id: rbac-rbac-107-107-3-i
kind: rbac
document: rbac-107
family: '107'
section_id: '107.3'
section_title: Termos e Definições
subsection_id: i
cite: 107.3(i)
title: 107.3(i)
text: '(i) contenha informações de inteligência que indiquem que pode representar uma ameaça;
  ou

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (ii) apresente sinais de adulteração com anomalia que aumente a suspeita; ou

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (iii) seja entregue por entidade desconhecida e possua natureza tal que apenas as medidas
  de segurança habituais não são suficientes para detectar itens proibidos que possam colocar
  em risco a aviação civil.

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (19) Carga ou mala postal suspeita significa a denominação dada a um volume de carga ou
  mala postal que apresente alguma das seguintes características: não identificável, abandonada,
  violada, que apresente ruído, exale odor que indique uma suspeita ou apresente sinais de
  vazamento de alguma substância líquida, sólida ou gasosa não identificável como substância
  permitida para transporte;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (20) Comissão de Segurança Aeroportuária (CSA) significa a comissão que reúne, regular ou
  extraordinariamente, representantes de organizações públicas e empresas privadas com atividades
  operacionais nos aeródromos públicos brasileiros, envolvidos com a segurança da aviação
  civil, para tratar de aspectos relacionados ao Programa de Segurança Aeroportuária (PSA);

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (21) Conscientização com AVSEC significa uma atividade integrante do processo de concessão
  de credencial, proporcionada pelo operador do aeródromo, que busca conscientizar as pessoas
  que trabalham nas áreas operacionais do aeródromo sobre a importância da AVSEC e sobre as
  principais regras de segurança aplicadas naquele aeródromo, podendo ser realizada por palestras
  presenciais, apresentações por vídeo, módulos a distância, dentre outros meios;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (22) Explorador de Área Aeroportuária significa a pessoa física ou jurídica que, mediante
  contrato com o operador de aeródromo, explora instalações ou áreas aeroportuárias (correspondente
  ao termo concessionário, descrito no art. 4º, inciso LV, do Decreto nº 7.168, de 2010);

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (23) Facilitação significa a gestão eficiente dos processos de controle necessários com
  o objetivo de acelerar o despacho de pessoas, mercadorias e aeronaves e de evitar atrasos
  desnecessários na operação;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (24) Exercícios Simulados de Escala Real são os exercícios que utilizam simulações de processos
  completos de resposta a atos de interferência ilícita, com utilização, dentre outros meios,
  de “atores”, profissionais responsáveis pelas ações de resposta, equipamentos e cenários
  reais ou semelhantes aos reais com o objetivo de avaliar, exercitar e aperfeiçoar o Plano
  de Contingência de AVSEC do Aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (25) Exercícios Simulados de Mesa são os exercícios que profissionais com responsabilidades
  nos processos de resposta a atos de interferência ilícita discutem um ou mais cenários de
  ameaça, orientados por um facilitador, com o objetivo de avaliar, exercitar e aperfeiçoar
  o Plano de Contingência de AVSEC do Aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (26) Formulário de Dados AVSEC do Aeródromo é parte do PSA do aeroporto que descreve informações
  específicas do aeroporto, tais como: categoria do aeroporto; voos em operação; informações
  relativas ao zoneamento de segurança e classificação das áreas, entre outras;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (27) Imprevisibilidade de Medida de Segurança significa a implementação de medida de segurança
  com frequências irregulares, em diferentes locais ou utilizando meios variados, de acordo
  com um marco definido, com o objetivo de aumentar sua eficácia e seu efeito dissuasivo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (28) Inclusão de Medida de Segurança significa a medida de segurança não prevista em regulação,
  e que, por uma necessidade justificada de implementação de forma contínua pelo operador
  de aeródromo, é formalizada por meio de aprovação de Listagem de Inclusão de Medida de Segurança
  e Procedimentos Alternativos, no âmbito do Programa de Segurança Aeroportuária (PSA);

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (29) Inspeção de segurança da aviação civil significa a atividade de aplicação de meios
  técnicos ou de outro tipo, com a finalidade de identificar e detectar armas, explosivos
  ou outros artigos perigosos que possam ser utilizados para cometer ato de interferência
  ilícita. Neste regulamento, aplicam-se os termos "inspeção de segurança" ou "inspeção" com
  o mesmo significado;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (30) Lado Ar significa a área de movimento do aeródromo, terrenos adjacentes e edificações,
  cujo acesso é controlado;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (31) Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos significa
  o documento em que consta(m) a(s) Inclusões de Medida(s) de Segurança e/ou Procedimento(s)
  Alternativo(s) de Segurança, aprovado(s) pela ANAC, e que compõe(m) o Programa de Segurança
  Aeroportuária (PSA);

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (32) Medidas Adicionais de Segurança significa o conjunto de alterações em procedimentos,
  processos, equipamentos ou instalações a ser disponibilizado pelo operador de aeródromo
  ou operador aéreo, em virtude de elevação do nível de ameaça, ativação de ações do plano
  de contingência ou devido à determinação específica da ANAC, por meio de Diretriz de Segurança
  da Aviação Civil contra Atos de Interferência Ilícita (DAVSEC);

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (33) Módulo de inspeção significa o conjunto mínimo de recursos humanos e materiais habilitados
  a serem empregados em um canal de inspeção do aeródromo para a realização dos procedimentos
  de inspeção de pessoas, veículos, equipamentos e suprimentos;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (34) Objeto suspeito significa qualquer substância, objeto ou volume, incluindo bagagem
  de mão, bagagem despachada, carga e mala postal, suspeito de conter artefatos explosivos,
  artefatos QBRN ou outro artigo perigoso com potencial de causar dano iminente;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (35) Operação charter significa um serviço de transporte aéreo não regular, executado por
  empresa de transporte aéreo público, nacional ou estrangeira, regular ou não regular, sendo
  permitida a comercialização dos espaços individuais ao público em geral. Trata-se de uma
  modalidade de serviço aéreo integrante da aviação comercial;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (36) Operação de fretamento significa um serviço de transporte aéreo não regular, executado
  por empresa de transporte aéreo público, nacional ou estrangeira, regular ou não regular,
  com a finalidade de atender um contrato de transporte firmado entre o operador aéreo e uma
  pessoa física ou jurídica, e compreendendo a capacidade total da aeronave, sem, portanto,
  transportar passageiros e/ou carga estranhos ao afretador, sendo vedada a comercialização
  de espaços individuais ao público em geral. Trata-se de uma modalidade de serviço aéreo
  integrante da aviação comercial distinta da modalidade de táxi aéreo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (37) Passageiros processados significa a soma de passageiros embarcados e desembarcados
  no aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (38) Plano de Segurança do Transporte Aéreo de Valores (PSTAV) significa a denominação atribuída
  ao documento formal sigiloso, elaborado pelo operador de aeródromo, com a participação do(s)
  órgão(s) de segurança pública competente(s), dos operadores aéreos e de empresas de segurança
  privada de transporte de valores, onde serão estabelecidas as medidas preventivas e as repressivas
  contra qualquer tentativa delituosa de obstar as operações de embarque e desembarque de
  valores no aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (39) Ponto de acesso emergencial significa o(s) local(is) do aeródromo, dotado(s) de infraestrutura
  e recursos humanos adequados, para onde pode ser direcionada a entrada e/ou saída de pessoas,
  veículos e equipamentos nas Áreas Controladas ou Áreas Restritas de Segurança, sendo utilizado(s)
  de forma excepcional, com o objetivo de atender situações emergenciais, previstas nos planos
  de emergência e de contingência do aeródromo, ou de prover a necessidade de alguma operação
  especial do aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (40) Ponto de controle de acesso significa o(s) local(is) do aeródromo, dotado(s) de infraestrutura
  e recursos humanos adequados, para onde é direcionada a entrada e/ou saída de pessoas, veículos
  e/ou equipamentos nas Áreas Controladas ou Áreas Restritas de Segurança, sendo utilizado(s)
  regularmente nas situações normais de operação;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (41) Ponto sensível significa a área, instalação ou outra facilidade aeroportuária que,
  se avariada ou destruída, prejudicará o funcionamento normal do aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (42) Procedimento Alternativo de Segurança significa uma forma de cumprimento de um requisito
  previsto em RBAC diferente daquele(s) presente(s) em Instrução Suplementar (IS), formalizado
  por meio de aprovação, pela ANAC, de Listagem de Inclusão de Medida de Segurança e Procedimentos
  Alternativos, no âmbito do Programa de Segurança Aeroportuária - PSA;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (43) Setor de credenciamento significa uma unidade organizacional do operador de aeródromo,
  subordinada ao setor de segurança aeroportuária, responsável pela gestão do sistema de credenciamento
  e autorização de acesso às áreas internas do aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (44) Setor de segurança aeroportuária significa a unidade organizacional do operador de
  aeródromo responsável pela administração dos recursos e condução dos processos relacionados
  à segurança patrimonial e proteção das operações aeroportuárias contra atos de interferência
  ilícita;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (45) Sistema de Contingência de AVSEC significa um componente do Sistema de Resposta à Emergência
  Aeroportuária que contempla os recursos e ações planejados para responder às ameaças e aos
  atos de interferência ilícita no aeródromo;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (46) Supervisão significa as ações de monitoramento para verificar e garantir o cumprimento
  de procedimentos de segurança por parte de pessoas ou organizações no ambiente aeroportuário;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (47) Varredura significa a busca minuciosa implementada em área aeroportuária com objetivo
  de identificar ou descartar a presença de objetos proibidos;

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (48) Vigilância significa a medida preventiva de segurança implementada por meio de ações,
  recursos físicos e humanos, suficientes para servir como: (i) instrumento dissuasório para
  diminuir a probabilidade de ocorrência de atos de interferência ilícita e (ii) meio de detecção
  e de pronta resposta a qualquer ameaça às operações da aviação civil, com o objetivo de
  interceptar uma ameaça ou diminuir os seus efeitos negativos. São exemplos de recursos que
  podem constituir a vigilância: atuação de vigilantes ou APAC para proteção de perímetros,
  áreas ou pontos de acesso; patrulhamento de perímetro e áreas; aplicação de equipamentos
  de detecção automática de intrusos; instalação de circuito fechado de televisão (CFTV) e
  aplicação de iluminação de segurança em perímetros, áreas ou pontos de acesso;

  (Incluído pela Resolução nº 644, de 05.11.2021)

  (49) Vigilância Permanente significa a ação de vigilância aplicada de forma contínua no
  tempo para proteger uma instalação, ou um conjunto ou unidade de objetos ou pessoas. São
  exemplos de recursos que podem constituir a vigilância permanente a depender de cada caso:
  atuação de vigilantes e APAC com campo de visão constante do alvo da vigilância; ou a aplicação
  de equipamentos de detecção automática de intrusos; e

  (Incluído pela Resolução nº 644, de 05.11.2021)

  (50) Zoneamento de segurança significa a demarcação de áreas ou instalações aeroportuárias
  através da identificação e delimitação, de forma que estejam devidamente classificadas como
  área pública, área controlada ou área restrita de segurança.

  (Incluído pela Resolução nº 644, de 05.11.2021)

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
