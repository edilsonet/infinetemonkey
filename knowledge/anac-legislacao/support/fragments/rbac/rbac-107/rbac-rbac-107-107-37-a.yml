section_title: Ativação da Comissão de Segurança Aeroportuária
subsection_id: a
cite: 107.37(a)
title: 107.37(a)
text: '(a) O operador de aeródromo deve garantir a ativação e o funcionamento de uma CSA com
  o objetivo de buscar a implementação coordenada das medidas de segurança para proteção da
  aviação civil contra atos de interferência ilícita, observando os requisitos deste regulamento
  e demais diretrizes e disposições estabelecidas na regulamentação da AVSEC.

  (1) A CSA deve ser instituída por ato próprio do operador de aeródromo, com a publicação
  de sua finalidade, responsabilidades e forma de funcionamento através de regimento interno.

  (2) As reuniões da CSA devem ser realizadas, ordinariamente, a cada 3 (três) meses e, extraordinariamente,
  por meio de reuniões convocadas de forma plena ou setorial pelo presidente da CSA ou por
  iniciativa justificada de um de seus membros permanentes.

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (3) A programação das reuniões ordinárias e extraordinárias deve ser elaborada e comunicada
  à ANAC, quando solicitado pela Agência.

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (4) [Reservado]

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (5) A ANAC pode participar das reuniões ordinárias e extraordinárias, como membro consultivo,
  mediante coordenação prévia junto ao setor de segurança aeroportuária.'
