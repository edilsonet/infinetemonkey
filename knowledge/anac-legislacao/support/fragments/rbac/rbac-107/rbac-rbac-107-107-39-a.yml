cite: 107.39(a)
title: 107.39(a)
text: '(a) Constituem responsabilidades da CSA:

  (1) promover a coordenação das diversas organizações públicas e entidades privadas com atividades
  operacionais no aeródromo, de forma a alcançar a implementação adequada das diretrizes,
  requisitos e orientações relacionados à proteção da aviação civil contra atos de interferência
  ilícita, publicados pela Comissão Nacional de Segurança da Aviação Civil (CONSAC), ANAC,
  Polícia Federal (PF), Comando da Aeronáutica (COMAER) e outros órgãos públicos com competência
  na regulação da AVSEC;

  (Redação dada pela Resolução nº 500, de 12.12.2018)

  (2) propor as ações necessárias para buscar a aplicação padronizada e efetiva do Programa
  de Segurança Aeroportuária (PSA);

  (3) identificar ameaças, vulnerabilidades ou problemas operacionais e propor ao operador
  do aeródromo a implementação de alterações ou melhorias nas medidas preventivas de segurança
  e de resposta às emergências (plano de contingência de AVSEC), previamente estabelecidas
  pelo operador de aeródromo, observando diretrizes e requisitos estabelecidos pela ANAC;

  (4) avaliar e aprovar os limites e as barreiras de segurança das ARS, previamente propostos
  pelo operador do aeródromo;

  (5) avaliar e aprovar em reunião extraordinária, restrita às entidades envolvidas na aplicação
  das medidas de segurança, o Plano de Segurança de Transporte Aéreo de Valores (PSTAV) e
  suas alterações posteriores, previamente elaborado e proposto pelo operador do aeródromo;

  (6) propor as ações necessárias para buscar a aplicação padronizada e efetiva do PSTAV;

  (7) avaliar os projetos de reforma e/ou de ampliação aeroportuária, de forma a garantir
  que os aspectos da AVSEC estejam contemplados na concepção e execução dos projetos, e também,
  de forma a buscar a incorporação de novos meios e tecnologias que contribuam tanto para
  a segurança quanto para a facilitação do transporte aéreo;

  (8) fomentar as ações necessárias para garantir que todos os funcionários atuantes no aeródromo
  possuam a qualificação específica da AVSEC exigida para o desenvolvimento das suas atividades
  operacionais; e

  (9) fomentar a cultura de segurança no âmbito da comunidade aeroportuária, através de comunicações
  ou eventos de conscientização de temas da AVSEC, em especial quando da aplicação de novas
  medidas de segurança e quando solicitado pela ANAC ou por autoridade policial atuante no
  aeródromo.'
