cite: 107.41(a)
title: 107.41(a)
text: '(a) O operador de aeródromo deve elaborar, implementar e manter um regimento interno
  para regular o funcionamento da CSA de forma a garantir que suas responsabilidades sejam
  cumpridas adequadamente.

  (1) O regimento interno deve prever, no mínimo, o seguinte conteúdo: forma de convocação
  dos membros, controle de frequência, desenvolvimento dos debates e deliberações, elaboração
  de ata e outros documentos necessários ao funcionamento da comissão.

  (2) A CSA deve ser presidida e secretariada por profissionais designados pelo operador do
  aeródromo que atuem no setor de segurança aeroportuária do aeródromo, sendo responsáveis
  pela condução adequada das atividades da comissão.

  (3) A CSA deve ser restrita e composta pelo operador do aeródromo e por representantes dos
  seguintes membros permanentes, quando em operação no aeródromo:'
