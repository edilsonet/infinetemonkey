text: '(v) órgão responsável pelo serviço de migração;

  (vi) órgão responsável pelo serviço aduaneiro;

  (vii) órgão responsável pelo serviço de vigilância agropecuária;

  (viii) órgão responsável pelo serviço de vigilância sanitária;

  (ix) operadores aéreos (empresas de transporte aéreo, empresas de táxi aéreo ou de serviço
  aéreo especializado, entidades aerodesportivas, escolas de aviação civil ou outros operadores
  de aeronaves sediadas no aeródromo);'
