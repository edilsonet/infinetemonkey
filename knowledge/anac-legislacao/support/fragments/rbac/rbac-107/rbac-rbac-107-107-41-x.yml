cite: 107.41(x)
title: 107.41(x)
text: '(x) empresas contratadas pelo operador de aeródromo ou operadores aéreos que prestem
  serviços de proteção da aviação civil contra atos de interferência ilícita; e

  (xi) explorador de área aeroportuária ou outras organizações que possuam responsabilidades
  na execução de medidas de proteção e controle de acesso à Área Controlada ou Área Restrita
  de Segurança.

  (4) Os membros permanentes devem formalizar, junto ao operador do aeródromo, a indicação
  de representantes, titular e suplente, para compor as reuniões.

  (5) O operador de aeródromo deve avaliar a necessidade de outras organizações públicas ou
  privadas que possuam responsabilidades relacionadas à AVSEC, atuantes ou não no aeródromo,
  serem convidadas para participar de reuniões, mediante deliberação da CSA e registro em
  ata.

  (6) O operador de aeródromo deve realizar gestão junto às organizações tratadas como membros
  permanentes da CSA, de forma a buscar a presença e contribuição em todas as reuniões da
  comissão, ressalvando as ausências devidamente justificadas.'
