section_title: Perímetros Patrimonial e Operacional
subsection_id: a
cite: 107.55(a)
title: 107.55(a)
text: '(a) O operador de aeródromo deve estabelecer e implantar o zoneamento de segurança
  da área patrimonial e operacional, demarcando-o em plantas do sítio aeroportuário, de forma
  que permita a interpretação clara das áreas, devendo apresentar no mínimo:

  (1) as delimitações do perímetro patrimonial e operacional;

  (2) os limites estabelecidos em áreas externas e internas de edificações ou instalações,
  tais como, terminal de passageiros, terminal de cargas, pontos sensíveis e edifício ou instalação
  sob responsabilidade de explorador de área aeroportuária, dentre outros; e

  (3) no caso de aeródromos civis compartilhados, uma diferenciação clara entre áreas civis
  e militares.'
