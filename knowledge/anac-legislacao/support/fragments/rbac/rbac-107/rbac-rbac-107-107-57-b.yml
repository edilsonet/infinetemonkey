section_title: Áreas Controladas e Áreas Restritas de Segurança
subsection_id: b
cite: 107.57(b)
title: 107.57(b)
text: '(b) O operador de aeródromo deve demarcar os limites (perímetros) das AC e das ARS
  em plantas do sítio aeroportuário, de forma que permita a interpretação clara das áreas,
  incluindo os limites estabelecidos em áreas internas de edificações ou instalações, tais
  como terminal de passageiros, terminal de cargas e edifício ou instalação de explorador
  de área aeroportuária, dentre outros.

  (1) Nos aeródromos onde houver a obrigatoriedade de constituição de CSA, os limites das
  ARS demarcadas pelo operador do aeródromo devem passar por aprovação prévia dos órgãos públicos
  e empresas atuantes no aeródromo, no âmbito da CSA, antes de serem efetivadas.'
