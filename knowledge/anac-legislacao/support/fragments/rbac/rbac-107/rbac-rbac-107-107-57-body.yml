text: '107.57

  Áreas Controladas e Áreas Restritas de Segurança

  Obrigatório a classificação da área operacional como Área Controlada. Dispensada a classificação
  como ARS.

  Obrigatório, quando o aeródromo atende voo de aeronave com capacidade superior a 30 assentos.
  Em aeródromo que atenda voo com até 30 assentos, a classificação pode ser feita como AC
  ou ARS.

  Obrigatório.

  Obrigatório.'
