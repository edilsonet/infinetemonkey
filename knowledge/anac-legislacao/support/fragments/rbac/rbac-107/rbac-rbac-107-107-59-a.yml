section_title: Áreas do Terminal de Passageiros
subsection_id: a
cite: 107.59(a)
title: 107.59(a)
text: '(a) O operador de aeródromo deve estabelecer e implantar o zoneamento de segurança
  do terminal de passageiros, demarcando-o em plantas da edificação do terminal, de forma
  que permita a interpretação clara das áreas, devendo apresentar, no mínimo:

  (1) as delimitações de áreas públicas, áreas controladas e áreas restritas de segurança;
  e

  (2) o fluxo de entrada, saída e circulação de passageiros e funcionários nas áreas restritas
  de segurança.'
