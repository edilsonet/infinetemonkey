section_title: Áreas do Terminal de Carga
subsection_id: a
cite: 107.61(a)
title: 107.61(a)
text: '(a) O operador de aeródromo deve estabelecer e implantar o zoneamento de segurança
  do terminal de carga, demarcando-o em plantas da edificação do terminal, de forma que permita
  a interpretação clara das áreas, devendo apresentar, no mínimo:

  (1) as delimitações de áreas públicas, áreas controladas e áreas restritas de segurança,
  demarcando-as em plantas dos terminais de carga;

  (2) o fluxo de entrada, saída e circulação de veículos, pessoas e volumes de carga e mala
  postal; e

  (3) a indicação das áreas e pontos destinados ao processamento adequado da carga, tais como
  as áreas de aceitação (ou recebimento), áreas de armazenamento, áreas ou pontos de transferência,
  áreas de conferência (ou fiscalização) e inspeção de volumes de carga.'
