cite: 107.61(b)
title: 107.61(b)
text: (b) Nos casos em que a operação do terminal de carga está sob a responsabilidade de
  um explorador de área aeroportuária, o operador de aeródromo deve garantir que a organização
  responsável atenda aos requisitos constantes nos parágrafos 107.61(a) e 107.81(l), observando,
  também, os demais controles de segurança relativos a carga, mala postal e outros itens,
  descritos na subparte E deste regulamento.
