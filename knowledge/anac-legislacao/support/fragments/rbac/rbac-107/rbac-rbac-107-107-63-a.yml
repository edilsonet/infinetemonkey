section_title: Áreas de Uso dos Operadores de Táxi Aéreo e da Aviação Geral
subsection_id: a
cite: 107.63(a)
title: 107.63(a)
text: '(a) O operador de aeródromo deve estabelecer e implantar o zoneamento de segurança
  das áreas de uso dos operadores de táxi aéreo e da aviação geral, demarcando-o em plantas
  do sítio aeroportuário, devendo garantir que:

  (1) as áreas de estacionamento de aeronaves dos operadores de táxi aéreo e da aviação geral
  sejam separadas, no espaço ou no tempo, das áreas utilizadas por aeronaves dos demais operadores
  da aviação comercial; e

  (2) as pistas de táxi para as áreas de estacionamento de aeronaves dos operadores de táxi
  aéreo e da aviação geral sejam claramente identificadas.'
