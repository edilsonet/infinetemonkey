section_title: Áreas de Uso dos Operadores de Táxi Aéreo e da Aviação Geral
subsection_id: b
cite: 107.63(b)
title: 107.63(b)
text: (b) No aeródromo onde a separação exigida no parágrafo 107.63(a)(1) não for viável,
  o operador de aeródromo deve estabelecer, em coordenação com o órgão de controle de tráfego
  aéreo, pontos de controle nos pátios, nos quais as aeronaves dos operadores de táxi aéreo
  e da aviação geral possam ser submetidas à verificação ou inspeção de segurança da aeronave
  no momento do desembarque da tripulação e dos passageiros.
