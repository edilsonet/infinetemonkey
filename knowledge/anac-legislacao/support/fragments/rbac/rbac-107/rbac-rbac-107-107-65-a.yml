cite: 107.65(a)
title: 107.65(a)
text: '(a) O operador de aeródromo deve identificar os pontos sensíveis, situados dentro e
  fora do perímetro patrimonial do aeródromo, e suas áreas adjacentes, demarcando-os em plantas
  do sítio aeroportuário e entorno, de forma que permita a interpretação clara dos pontos.

  (1) A identificação dos pontos sensíveis deve incluir, ao menos, as instalações de auxílio
  à navegação aérea, instalações de fornecimento de água, energia elétrica e combustível para
  aviação civil e, ainda, pistas de pouso e decolagem ou pistas de táxi que passem sobre via
  pública.'
