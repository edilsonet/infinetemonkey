cite: 107.65(b)
title: 107.65(b)
text: '(b) Quando o ponto sensível estiver localizado dentro do perímetro patrimonial do aeródromo,
  o operador de aeródromo deve:

  (1) implantar barreiras de segurança que sejam capazes de dissuadir e dificultar o acesso
  indevido (não autorizado) de pessoas às áreas dos pontos sensíveis; e

  (2) manter vigilância dos pontos sensíveis, de forma a garantir a proteção adequada das
  áreas e medidas de pronta resposta nas situações necessárias, tais como identificação de
  acesso indevido e de outras ameaças ao funcionamento normal do ponto sensível.

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
