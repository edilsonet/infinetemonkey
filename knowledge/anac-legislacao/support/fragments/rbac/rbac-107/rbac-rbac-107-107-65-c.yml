title: 107.65(c)
text: '(c) Na aplicação das medidas estabelecidas no parágrafo 107.65(b)(1) o operador de
  aeródromo deve observar os seguintes requisitos:

  (1) As barreiras de segurança utilizadas devem atender as características gerais estabelecidas
  no parágrafo 107.67(a).

  (2) Quando, em função de limitações operacionais, as instalações do ponto sensível não puderem
  ser adequadamente protegidas por barreiras de segurança, o operador do aeródromo deve empregar
  controle de segurança alternativo apropriado.'
