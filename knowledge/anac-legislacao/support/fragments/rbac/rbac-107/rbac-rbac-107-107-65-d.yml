title: 107.65(d)
text: '(d) Quando o ponto sensível estiver localizado fora do perímetro patrimonial do aeródromo,
  deverá ser protegido pela organização encarregada de sua operação.

  (1) No caso de ponto sensível operado pelo operador de aeródromo, este deve atender o parágrafo
  107.65(b).

  (2) No caso de ponto sensível operado por organização distinta do operador de aeródromo,
  este deve realizar gestão junto à organização responsável para buscar o atendimento do parágrafo
  107.65(b).'
