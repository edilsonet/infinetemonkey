title: 107.67(a)
text: '(a) O operador de aeródromo deve implantar barreiras de segurança que sejam capazes
  de dissuadir e dificultar o acesso não autorizado de pessoas às áreas delimitadas pelo perímetro
  operacional (lado ar) e suas subáreas, áreas controladas e áreas restritas de segurança.

  (1) As barreiras de segurança devem apresentar as seguintes características gerais:'
