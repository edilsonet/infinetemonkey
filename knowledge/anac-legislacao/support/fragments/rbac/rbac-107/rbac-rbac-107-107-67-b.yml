cite: 107.67(b)
title: 107.67(b)
text: (b) As instalações ou edificações sobre o perímetro de AC e ARS ou adjacentes a essas
  áreas devem ser adequadamente protegidas para impedir o acesso não autorizado à área operacional
  através de possíveis pontos de acesso, tais como janelas, dutos, tubulações, telhados ou
  qualquer outra passagem que possa ser utilizada indevidamente.
