cite: 107.67(c)
title: 107.67(c)
text: (c) O acesso a infraestruturas que cruzam área ou perímetro e que permitam ingresso
  à ARS, tais como valas, dutos e túneis de serviço subterrâneos, devem ser bloqueados e periodicamente
  inspecionados ou protegidos por dispositivos de detecção de intrusos.
