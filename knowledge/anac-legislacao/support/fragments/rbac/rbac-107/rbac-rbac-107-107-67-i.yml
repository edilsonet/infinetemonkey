section_title: Barreira de Segurança
subsection_id: i
cite: 107.67(i)
title: 107.67(i)
text: '(i) o nível de segurança oferecido pelo obstáculo seja equivalente ao dos obstáculos
  artificiais; ou

  (ii) sejam aplicadas medidas de segurança complementares para alcançar essa equivalência;
  e

  (iii) a comprovação das condições anteriores seja demonstrada por meio da elaboração de
  um estudo prévio por parte do operador do aeródromo.

  (3) Nos aeródromos onde houver a obrigatoriedade de constituição de CSA, as barreiras de
  segurança estabelecidas pelo operador do aeródromo para proteção de ARS devem passar por
  aprovação prévia, no âmbito da CSA, antes de serem efetivadas.

  (4) No caso de não ser possível a implantação de barreiras de segurança em seções dos limites
  (perímetros) de uma AC ou ARS, o operador de aeródromo deve manter vigilância permanente,
  de forma a garantir a proteção adequada e focada desses perímetros, prevenindo, em especial,
  o acesso não autorizado à ARS.'
