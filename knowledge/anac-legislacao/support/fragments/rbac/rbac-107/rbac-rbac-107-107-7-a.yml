cite: 107.7(a)
title: 107.7(a)
text: '(a) A aplicação adequada dos requisitos contidos neste RBAC é alcançada com a utilização
  da Tabela de Requisitos disponibilizada no Apêndice A deste regulamento.

  (1) A Tabela de Requisitos apresenta, na sua primeira linha, as classes de aeródromos consideradas
  neste regulamento e, na sua primeira coluna, cada uma das seções constantes neste regulamento.

  (2) No cruzamento de cada classe de aeródromo com cada seção ou parágrafo dispostos na tabela
  é indicado o grau de aplicação dos requisitos estabelecidos, podendo assumir as seguintes
  designações gerais: obrigatório, recomendado ou dispensado.

  (3) A designação geral de recomendação é entendida como uma especificação de característica
  física, configuração, material, performance, pessoal ou procedimento cuja aplicação é desejável
  para a segurança, e que os aeródromos poderiam buscar atender mesmo não estando sujeito
  a sanções de fiscalização pelo seu não cumprimento.

  (4) A designação do grau de aplicação pode conter condicionantes, por meio da descrição
  de situações específicas que podem complementar a designação geral de aplicabilidade para
  uma determinada combinação de requisito e classe de operador.'
