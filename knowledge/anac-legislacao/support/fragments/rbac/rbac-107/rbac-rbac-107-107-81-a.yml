cite: 107.81(a)
title: 107.81(a)
text: '(a) O operador de aeródromo deve manter vigilância do perímetro e da área operacional,
  de forma a garantir sua proteção adequada.

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (1) O operador de aeródromo deve manter vias de serviço operacionais que permitam a realização
  de patrulhamento sistemático por todo o perímetro operacional, em especial nos pontos de
  controle de acesso mantidos fora de operação.

  (2) O operador de aeródromo deve garantir que as posições de estacionamento e pernoite de
  aeronaves possuam iluminação adequada à atividade de vigilância.

  (3) Na identificação de acesso ou tentativa de acesso indevido à área operacional ou à aeronave,
  o operador de aeródromo deve aplicar medidas de pronta resposta que sejam suficientes para
  impedir a continuidade do acesso e mitigar os possíveis efeitos negativos, incluindo, quando
  necessário, a comunicação ao setor de segurança aeroportuária e/ou ao órgão de segurança
  pública responsável pelas atividades de polícia no aeródromo, especialmente no sentido de
  proteger a ARS.

  (4) Na ocorrência de acesso indevido à ARS, o operador de aeródromo deve realizar varredura
  na área afetada para garantir a sua esterilização.'
