cite: 107.81(e)
title: 107.81(e)
text: (e) O operador de aeródromo deve realizar gestão junto aos órgãos de segurança pública
  para buscar a realização de patrulhamento sistemático nas áreas adjacentes ao lado ar do
  aeródromo, fora do perímetro operacional, que possa servir como instrumento dissuasório,
  de avaliação, de detecção e de resposta a eventuais ameaças às operações no aeródromo.
