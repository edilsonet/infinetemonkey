title: 107.81(h)
text: (h) O operador de aeródromo deve garantir a difusão de informações à comunidade aeroportuária
  e ao público em geral acerca dos procedimentos a serem adotados nas situações de identificação
  de objetos ou materiais suspeitos nas áreas públicas do terminal de passageiros.
