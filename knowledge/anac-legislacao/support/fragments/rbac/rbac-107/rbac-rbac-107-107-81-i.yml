cite: 107.81(i)
title: 107.81(i)
text: (i) O operador de aeródromo deve garantir que os artigos a serem armazenados em depósitos
  de bagagem ou guarda-volumes, destinados ao público em geral, localizados no interior do
  terminal de passageiros ou próximos de pontos sensíveis, sejam submetidos à inspeção de
  segurança pelo explorador do negócio, sob supervisão do operador do aeródromo.
