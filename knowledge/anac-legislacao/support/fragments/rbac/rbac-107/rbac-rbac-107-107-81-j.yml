cite: 107.81(j)
title: 107.81(j)
text: '(j) O operador de aeródromo deve garantir que as áreas de observação ou outra área
  do terminal de passageiros que proporcione visão das aeronaves estacionadas no pátio estejam
  sujeitas à vigilância.

  (1) As áreas que oferecem visão e são próximas de aeronaves devem possuir proteção que impeçam
  o arremesso de objetos nas proximidades da aeronave.'
