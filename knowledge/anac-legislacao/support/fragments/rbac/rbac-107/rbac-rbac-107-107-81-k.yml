cite: 107.81(k)
title: 107.81(k)
text: (k) O operador de aeródromo deve garantir que as áreas públicas do terminal de passageiros
  não ofereçam visão das áreas e instalações destinadas à inspeção de segurança de pessoas,
  incluindo visão das imagens geradas pelos equipamentos de raios-x.
