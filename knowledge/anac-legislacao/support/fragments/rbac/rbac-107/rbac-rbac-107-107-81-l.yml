cite: 107.81(l)
title: 107.81(l)
text: '(l) O operador de aeródromo deve manter vigilância do terminal de carga, de forma a
  garantir a proteção adequada do terminal.

  (Redação dada pela Resolução nº 644, de 05.11.2021)

  (1) Na identificação de acesso ou tentativa de acesso indevido às áreas controladas e restritas
  do terminal de carga, o operador de aeródromo deve aplicar medidas de pronta resposta suficientes
  para impedir a continuidade do acesso e mitigar os possíveis efeitos negativos, incluindo,
  quando necessário, a comunicação ao setor de segurança aeroportuária e/ou ao órgão de segurança
  pública responsável pelas atividades de polícia no aeródromo, especialmente no sentido de
  proteger a ARS.'
