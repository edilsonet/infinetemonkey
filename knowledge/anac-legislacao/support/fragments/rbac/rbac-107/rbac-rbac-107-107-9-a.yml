cite: 107.9(a)
title: 107.9(a)
text: '(a) O universo de aeródromos abrangido pelo parágrafo 107.1(a) é classificado, para
  efeitos de aplicação deste regulamento, de acordo com:

  (1) o tipo de serviço aéreo operado no aeródromo; e

  (2) o número de passageiros processados.

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
