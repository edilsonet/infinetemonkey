cite: 107.9(d)
title: 107.9(d)
text: '(d) A ANAC dará publicidade à classificação dos aeródromos, para fins de aplicação
  deste regulamento, considerando os dados estatísticos encaminhados à Agência, nos termos
  da Resolução ANAC nº 191, de 16 de junho de 2011, ou outro instrumento normativo que venha
  a substituí-la.

  (1) Em aeródromo que possua menos de 3 (três) anos de operação, o operador de aeródromo
  deve declarar à ANAC a classe em que pretende operar.'
