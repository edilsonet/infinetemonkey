text: '(f) O operador de aeródromo de classe AP-0 que deseje operar nas condições das classes
  AP-1, AP-2 ou AP-3 deve demonstrar previamente o cumprimento aos requisitos deste regulamento.

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
