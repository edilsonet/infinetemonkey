title: 107.9(g)
text: (g) O operador de aeródromo de classe AP-1 ou AP-2 que, em virtude de seu movimento
  operacional, passe a se enquadrar em classe superior, tem até o último dia útil do mês de
  maio seguinte ao período de referência para se adequar aos requisitos da nova classe.
