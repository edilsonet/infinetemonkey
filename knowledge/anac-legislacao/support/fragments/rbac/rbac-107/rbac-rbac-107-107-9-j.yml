cite: 107.9(j)
title: 107.9(j)
text: '(j) Independentemente da classe atribuída, a ANAC pode estabelecer a obrigatoriedade
  de atendimento a requisito(s) específico(s) para qualquer operador de aeródromo, desde que
  previamente justificado, com base em avaliação de risco efetuada pela ANAC.

  (1) Neste caso, o prazo para adequação do operador de aeródromo será determinado através
  do ato administrativo que estabelecer a obrigatoriedade de atendimento a requisito(s) específico(s).'
