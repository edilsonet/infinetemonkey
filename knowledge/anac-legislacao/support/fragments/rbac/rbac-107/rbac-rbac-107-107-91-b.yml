cite: 107.91(b)
title: 107.91(b)
text: '(b) Na aplicação da medida estabelecida no parágrafo 107.91(a)(2) o operador de aeródromo
  deve observar os seguintes requisitos:

  (1) As áreas internas do setor responsável pela gestão do sistema, onde é manuseada e arquivada
  a documentação, devem ser caracterizadas como Área Controlada; e

  (2) Os funcionários que forem atuar no setor responsável pela gestão do sistema devem passar
  por verificação de antecedentes prévia e anualmente.'
