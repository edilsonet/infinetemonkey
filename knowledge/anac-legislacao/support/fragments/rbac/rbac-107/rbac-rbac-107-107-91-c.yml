section_title: Gestão do Sistema de Credenciamento e Autorização
subsection_id: c
cite: 107.91(c)
title: 107.91(c)
text: '(c) O setor responsável pela gestão do sistema de credenciamento e autorização deve:

  (1) emitir regras de conduta e procedimentos de controle relativos a uso adequado do sistema
  de credenciamento e autorização que deverão ser observados pelos operadores aéreos, exploradores
  de áreas e órgãos públicos presentes no aeródromo;

  (2) produzir e administrar um cadastro de entidades públicas e privadas presentes no aeródromo
  e seus respectivos representantes (titular e até dois suplentes), autorizados a solicitar
  a emissão de credenciais e autorizações;

  (3) definir os modelos de credencial aeroportuária e autorização de veículos, observando
  características e informações mínimas adequadas para as atividades de identificação e vigilância
  e que previna contra falsificações;

  (4) preservar o sigilo das informações que lhe forem fornecidas no âmbito do processo de
  solicitação de credencial aeroportuária ou autorização de veículos;

  (5) controlar e manter o registro dos atos necessários para o processo de concessão de credencial
  ou autorização; e

  (6) produzir relatórios gerenciais com as informações de controle e registro de credenciais
  e autorizações aeroportuária, mensais e anuais, que devem ser arquivados, física ou eletronicamente,
  por no mínimo 5 (cinco) anos, a contar da data de emissão do relatório.'
