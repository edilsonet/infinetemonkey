title: 107.93(a)
text: '(a) O operador de aeródromo deve implementar um processo de concessão de credencial
  aeroportuária para funcionários, pessoal de serviço e visitantes e de autorizações para
  os veículos e equipamentos que necessitem de acesso às Áreas Controladas ou Áreas Restritas
  de Segurança.

  (1) A credencial e a autorização terão validade apenas no ambiente do aeródromo que as emitiu
  e devem ser classificadas em duas categorias: permanente ou temporária, sendo que:'
