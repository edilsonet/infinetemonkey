cite: 107.93(b)
title: 107.93(b)
text: '(b) No processo de concessão de credenciais ou autorizações permanentes, o operador
  de aeródromo deve garantir que somente pessoas, veículos e equipamentos em conformidade
  com os requisitos deste regulamento tenham credenciais ou autorizações emitidas, devendo,
  para tanto:

  (1) exigir solicitação formal do interessado;

  (2) avaliar detalhadamente a documentação recebida;

  (3) formalizar os resultados da avaliação (concessão ou indeferimento);

  (4) emitir a credencial ou a autorização aeroportuária, e disponibilizar as informações
  ao credenciado acerca das suas responsabilidades quanto ao uso adequado da credencial e
  quanto às possíveis penalidades, nos casos de uso indevido; e

  (5) arquivar, física ou eletronicamente, a documentação exigida e produzida durante o processo,
  pelo período mínimo de 5 (cinco) anos, a contar da data da formalização da decisão.'
