cite: 107.93(c)
title: 107.93(c)
text: '(c) Na etapa de solicitação formal, o operador de aeródromo deve exigir a documentação
  obrigatória mínima capaz de:

  (1) identificar adequadamente a pessoa, o veículo ou o equipamento a ser credenciado ou
  autorizado;

  (2) demonstrar a necessidade de acesso ou permanência em área operacional do aeródromo;

  (3) apresentar os antecedentes criminais da pessoa, os quais devem comprovar a sua idoneidade;

  (4) comprovar registro no sistema de verificação de segurança de credenciais aeroportuárias
  da Polícia Federal, conforme disponibilização pela Polícia;

  (5) demonstrar a participação em atividade de conscientização e de disseminação de conhecimento
  que forneça as informações gerais necessárias para a permanência e circulação da pessoa
  nas áreas do aeródromo; e

  (6) comprovar outras informações julgadas necessárias pelo operador do aeródromo, incluindo
  as exigidas por regulamento específico emitido pela ANAC.'
