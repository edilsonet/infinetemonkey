section_title: Concessão de Credenciais e Autorizações
subsection_id: d
cite: 107.93(d)
title: 107.93(d)
text: '(d) Na etapa de avaliação, o operador de aeródromo deverá proceder à análise da documentação
  obrigatória apresentada pelo solicitante, nos termos do parágrafo 107.93(c), devendo ainda:

  (1) verificar, a partir de informações comprovadas, o uso indevido da credencial ou autorização
  por parte do solicitante; e

  (2) verificar a existência de impedimento legal ou regulamentar aplicável ao credenciamento
  do solicitante.'
