cite: 107.93(e)
title: 107.93(e)
text: (e) Caso sejam identificados antecedentes criminais ou sociais, o operador de aeródromo
  deverá encaminhar a documentação do solicitante à Polícia Federal, ou ao órgão de segurança
  pública responsável pelas atividades de polícia no aeródromo, com solicitação formal de
  manifestação acerca de potencial comprometimento da segurança da aviação civil contra atos
  de interferência ilícita.
