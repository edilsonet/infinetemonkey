cite: 107.93(f)
title: 107.93(f)
text: '(f) O resultado da etapa de avaliação deverá ser formalizado pelo operador de aeródromo,
  sendo que qualquer das hipóteses seguintes implicará o indeferimento da solicitação:

  (1) documentação obrigatória mínima em desacordo com o disposto no parágrafo 107.93(c);

  (2) manifestação expressa da Polícia Federal, ou pelo órgão de segurança pública responsável
  pelas atividades de polícia no aeródromo, de potencial comprometimento da segurança da aviação
  civil contra atos de interferência ilícita;

  (3) existência de informações comprovadas que indiquem o uso indevido da credencial ou autorização
  por parte do solicitante; ou

  (4) outro impedimento legal ou regulamentar aplicável.'
