title: 107.93(g)
text: (g) No processo de concessão de credenciais ou autorizações permanentes para funcionários
  ou veículos de organizações públicas, o operador de aeródromo deve observar padrões de segurança
  definidos pela ANAC em coordenação com os órgãos públicos atuantes no aeródromo.
