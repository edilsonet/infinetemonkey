cite: 107.93(h)
title: 107.93(h)
text: '(h) No processo de concessão de credenciais ou autorizações temporárias para pessoal
  de serviço, visitantes ou veículos, o operador de aeródromo deve aplicar as etapas previstas
  nos parágrafos 107.93(b), (c), (d) e (f), exceto os parágrafos 107.93(c)(3) e 107.93(c)(5).

  (1) No caso de serviço de manutenção emergencial, atuação de agente público de fiscalização
  e controle ou programação de visitas à área operacional, e desde que o acompanhamento se
  dê por funcionário(s) do próprio operador de aeródromo, de posse de credencial permanente,
  previamente autorizado junto ao setor de credenciamento, o operador de aeródromo poderá
  fornecer as credenciais e/ou autorizações necessárias ao pessoal de serviço, visitantes,
  veículos e equipamentos, sem a aplicação das etapas previstas nos parágrafos 107.93(b),
  (c), (d), (e) e (f).

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
