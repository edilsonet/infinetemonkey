section_title: Concessão de Credenciais e Autorizações
subsection_id: i
cite: 107.93(i)
title: 107.93(i)
text: '(i) a credencial ou autorização permanente é concedida às pessoas ou veículos que possuírem
  autorização para adentrar, sem acompanhamento, as áreas operacionais do aeródromo e são
  direcionadas aos funcionários, veículos e equipamentos de organizações públicas ou privadas
  atuantes no aeródromo; e

  (ii) a credencial ou autorização temporária é concedida às pessoas ou veículos que possuírem
  autorização para adentrar, sob acompanhamento, as áreas operacionais do aeródromo e são
  direcionadas ao pessoal de serviço e visitantes em geral.'
