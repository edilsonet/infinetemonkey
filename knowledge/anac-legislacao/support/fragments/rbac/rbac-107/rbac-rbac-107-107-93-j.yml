section_title: Concessão de Credenciais e Autorizações
subsection_id: j
cite: 107.93(j)
title: 107.93(j)
text: '(j) No caso de indisponibilidade técnica temporária do sistema de verificação de segurança
  de credenciais aeroportuárias da Polícia Federal, o operador de aeródromo poderá conceder
  credenciais e autorizações em caráter provisório, devendo, para tanto, garantir que sejam
  aplicadas as obrigações previstas nos parágrafos 107.93(b), (c), (d), (e) e (f) para tais
  solicitações tão logo retorne a disponibilidade do sistema.

  (Redação dada pela Resolução nº 500, de 12.12.2018)'
