cite: 107.95(b)
title: 107.95(b)
text: '(b) O controle deve informar a quantidade total de credenciais e autorizações válidas,
  destacando a quantidade das que estiverem na situação de:

  (1) não devolvidas;

  (2) extraviadas; e

  (3) furtadas ou roubadas.'
