title: 107.95(f)
text: '(f) O operador de aeródromo deve verificar, para cada entidade cadastrada como solicitante
  de emissão de credenciais e autorizações, a conformidade de cumprimento das obrigações relacionadas
  ao sistema de credenciamento, no mínimo a cada 2 (dois) anos.

  (Redação dada pela Resolução nº 644, de 05.11.2021)'
