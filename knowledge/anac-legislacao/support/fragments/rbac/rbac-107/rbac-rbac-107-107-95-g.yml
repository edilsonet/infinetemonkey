title: 107.95(g)
text: (g) A emissão de vias adicionais de credenciais e autorizações (2ª via, 3ª via, etc.)
  deve ser objeto de controle específico pelo operador do aeródromo, devendo no processo constar
  justificativa pertinente e avaliação criteriosa por parte do setor responsável pela concessão.
