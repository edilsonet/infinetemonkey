title: 107.97(b)
text: '(b) O desenvolvimento e condução da conscientização com AVSEC deverá ser atribuído
  a um profissional que possua uma das seguintes certificações válidas:

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (1) Básico AVSEC;

  (2) Inspeção de Segurança da Aviação Civil;

  (3) AVSEC para Operador de Aeródromo;

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (4) AVSEC para Operador Aéreo; ou

  (Redação dada pela Resolução nº 643, de 05.11.2021)

  (5) Instrutor AVSEC.

  (Incluído pela Resolução nº 643, de 05.11.2021)'
