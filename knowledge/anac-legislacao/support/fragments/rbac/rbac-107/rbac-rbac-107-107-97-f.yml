cite: 107.97(f)
title: 107.97(f)
text: '(f) A conscientização com AVSEC deverá abordar, no mínimo, os seguintes tópicos:

  (1) conceitos e princípios gerais da AVSEC;

  (2) entidades aeroportuárias e suas responsabilidades pela segurança;

  (3) regras de credenciamento e de controle de acesso às áreas operacionais do aeródromo;
  e

  (4) regras de acionamento do plano de contingência do aeródromo.'
