cite: 108.1(a)
title: 108.1(a)
text: '(a) Para efeito deste Regulamento aplicam-se os termos e definições estabelecidos a
  seguir, bem como aqueles disponíveis no RBAC nº 01, denominado “Definições, regras de redação
  e unidades de medida”; no Anexo ao Decreto nº 11.195, de 8 de setembro de 2022, que dispõe
  sobre o Programa Nacional de Segurança da Aviação Civil contra Atos de Interferência Ilícita;
  e na Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro da Aeronáutica.
  (Redação dada pela Resolução nº 729, de 24.01.2024)

  (1) Antecedentes significa as informações de identidade, da experiência social e do histórico
  criminal de uma pessoa, como forma de avaliar sua idoneidade para fins de mitigação de riscos
  relacionados ao acesso a áreas aeroportuárias ou a informações consideradas sensíveis para
  a segurança da aviação civil. (Redação dada pela Resolução nº 729, de 24.01.2024)​

  (1)-I Avaliação de risco significa o processo aplicado na gestão da Segurança da Aviação
  Civil contra Atos de Interferência Ilícita de uma organização, abrangendo ao menos as etapas
  de identificação de ameaças, de vulnerabilidades e do nível de exposição das operações ao
  risco de atos de interferência ilícita. (Incluído pela Resolução nº 729, de 24.01.2024)​

  (2) Bagagem acompanhada significa a bagagem despachada com a intenção de ser transportada
  na mesma aeronave em que viajar o passageiro ou tripulante a quem pertença, não sendo, portanto,
  coberta por conhecimento aéreo.

  (3) Bagagem desacompanhada significa a bagagem despachada sem a intenção de ser transportada
  na mesma aeronave que a pessoa à qual pertença.

