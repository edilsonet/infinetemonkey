section_title: Termos e definições
subsection_id: i
cite: 108.1(i)
title: 108.1(i)
text: '(i) contenha informações de inteligência que indiquem que pode representar uma ameaça;

  (ii) apresente sinais de adulteração com anomalia que apresente suspeita; ou

  (iii) seja entregue por entidade desconhecida e possua natureza tal que apenas as medidas
  de segurança habituais não são suficientes para detectar itens proibidos que possam colocar
  em risco a aviação civil.

  (5) Carga ou mala postal em transferência significa a carga ou mala postal transferida de
  aeronave de um operador para a aeronave do mesmo ou de outro operador, durante o transporte
  entre sua origem e seu destino.

  (6) Carga ou mala postal conhecida significa a carga ou mala postal que é submetida a controles
  de segurança desde sua inspeção de segurança ou desde sua origem, tratando-se, neste último
  caso, de carga manuseada por (ou sob responsabilidade de) expedidor reconhecido, expedidor
  acreditado ou agente de carga aérea acreditado.

  (7) Carga ou mala postal desconhecida significa qualquer carga ou mala postal que não se
  enquadre na definição de carga ou mala postal conhecida.

  (8) Declaração de Segurança significa o documento que reconhece as responsabilidades pela
  execução de medidas de segurança aplicadas à carga aérea desde o momento que a carga é designada
  como conhecida e sob custódia de seu declarante até o momento de transferência de sua custódia.

  (9) Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita significa
  o documento emitido pela ANAC que contém medidas adicionais de segurança e/ou restrições
  operacionais com o objetivo de garantir o nível aceitável de segurança da aviação civil
  contra atos de interferência ilícita.

  (10) Expedidor Acreditado significa a pessoa jurídica que expede carga ou outras remessas
  e proporciona controle de segurança aprovado pelo agente de carga aérea acreditado, com
  relação à carga, às encomendas por mensageiros e expressos ou por mala postal.

  (11) Explorador de Área Aeroportuária significa a pessoa, física ou jurídica que, mediante
  contrato com o operador de aeródromo, explora instalações ou áreas aeroportuárias. (Redação
  dada pela Resolução nº 729, de 24.01.2024)​

  (12) Inclusão de Medida de Segurança significa a medida de segurança não prevista em regulação,
  e que, por uma necessidade justificada de implementação de forma contínua pelo operador
  aéreo, é formalizada por meio de aprovação de Listagem de Inclusão de Medida de Segurança
  e Procedimentos Alternativos, no âmbito do Programa de Segurança de Operador Aéreo (PSOA).

  (12)-I Informaç&atildatilde;o Restrita de AVSEC (IRA) significa uma informação cuja divulgação
  ao público em geral, de forma não controlada, pode ser prejudicial ao sistema de segurança
  contra atos de interferência ilícita, e que deve se manter restrita às pessoas que necessitam
  da informação para desempenhar suas atividades laborais, em especial, àqueles profissionais
  que atuam no ambiente aeroportuário e possuem responsabilidades AVSEC atribuídas pela legislação
  e regulamentação. (Incluído pela Resolução nº 729, de 24.01.2024)​

  (13) Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos significa
  o documento em que consta(m) a(s) Inclusões de Medida(s) de Segurança e/ou Procedimento(s)
  Alternativo(s) de Segurança, aprovado(s) pela ANAC, e que compõe(m) o programa de segurança
  do operador aéreo.

  (14) Medida Adicional de Segurança significa a medida de segurança não implementada em cenários
  de ameaça ordinários, que possui como objetivo atender uma situação especial de ameaça ou
  contingência.

  (15) Plano de Segurança de Empresa de Serviços Auxiliares ou Explorador de Área Aeroportuária
  (PSESCA) significa o plano desenvolvido pelas empresas de serviços auxiliares ou exploradores
  de área aeroportuária, em coordenação com as administrações aeroportuárias, no qual são
  consolidadas as medidas e práticas de segurança, visando a proteger a aviação civil contra
  os atos de interferência ilícita.

  (16) Procedimento Alternativo de Segurança significa uma forma de cumprimento de um requisito
  previsto em RBAC diferente daquele(s) presente(s) em Instrução Suplementar (IS), formalizado
  por meio de aprovação de Listagem de Inclusão de Medida de Segurança e Procedimentos Alternativos,
  no âmbito do Programa de Segurança pela ANAC.

  (17) Programa de Segurança de Operador Aéreo (PSOA) significa o programa que apresenta as
  diretrizes, instruções gerais, procedimentos, atribuições e responsabilidades relacionadas
  à proteção da aviação civil contra atos de interferência ilícita do operador aéreo.

  (18) Programa de Segurança do Expedidor Reconhecido (PSER) significa o programa desenvolvido
  pelo Expedidor Reconhecido, no qual são consolidadas as medidas e práticas de segurança
  por ele adotadas, aplicada a áreas e instalações, pessoas e carga aérea;

  (19) Segurança da Aviação Civil contra Atos de Interferência Ilícita (ou apenas segurança)
  significa a combinação de medidas, de recursos humanos e de materiais destinados a proteger
  a aviação civil contra atos de interferência ilícita.

  (Seção com redação dada pela Resolução nº 604, de 29.01.2021)'
