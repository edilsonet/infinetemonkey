title: 108.11(a)
text: (a) O universo de operadores aéreos abrangido pelo parágrafo 108.7(a) é classificado,
  para efeitos de aplicação deste Regulamento, segundo o tipo de serviço aéreo realizado,
  conforme disposto no parágrafo 108.11(b) deste Regulamento.
