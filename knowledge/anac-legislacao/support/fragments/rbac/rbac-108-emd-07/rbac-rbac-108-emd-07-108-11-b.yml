cite: 108.11(b)
title: 108.11(b)
text: '(b) As classes definidas para os operadores aéreos são:

  (1) Classe I, abrangendo aqueles que realizam serviço aéreo privado, incluídas as operações
  especiais de aviação pública realizadas por órgão e entes públicos, conforme o RBAC nº 90;
  (Redação dada pela Resolução nº 604, de 29.01.2021)

  (2) Classe II, abrangendo aqueles que exploram serviço aéreo especializado público ou serviço
  de transporte aéreo público não regular com aeronave de até 30 assentos, sendo: (Redação
  dada pela Resolução nº 604, de 29.01.2021)'
