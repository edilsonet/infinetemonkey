title: 108.11(c)
text: (c) A ANAC pode enquadrar qualquer operador aéreo em classe diferente da qual lhe seria
  aplicável nos termos do parágrafo 108.11(b), desde que previamente justificado, com base
  em avaliação de risco efetuada pela ANAC.
