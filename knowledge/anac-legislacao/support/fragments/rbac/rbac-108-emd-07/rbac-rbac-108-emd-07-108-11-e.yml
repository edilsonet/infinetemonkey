section_title: Classificação dos operadores aéreos
subsection_id: e
cite: 108.11(e)
title: 108.11(e)
text: '(e) Caso o operador aéreo explore mais de um tipo de serviço aéreo e esteja enquadrado
  em duas ou mais classes, deve cumprir, separadamente, os requisitos aplicáveis a cada classe,
  de acordo com o tipo de operação realizada.

  (1) Nesta situação, o operador aéreo deve manter apenas um programa de segurança, que apresente
  a descrição dos seus recursos e procedimentos de segurança aplicados em todas as suas operações.
  (Reda&cccedil;ão dada pela Resolução nº 604, de 29.01.2021)'
