section_title: Classificação dos operadores aéreos
subsection_id: i
cite: 108.11(i)
title: 108.11(i)
text: '(i) Classe II-A aqueles que exploram serviço aéreo especializado público.

  (ii) Classe II-B aqueles que exploram serviço de transporte aéreo público não regular com
  aeronave de até 30 assentos. (Redação dada pela Resolução nº 604, de 29.01.2021)

  (3) Classe III, abrangendo aqueles que exploram serviço de transporte aéreo público em voos
  domésticos, exclusivamente de carga ou mala postal (excluindo a modalidade de transporte
  aéreo público não regular com aeronave de até 30 assentos); (Redação dada pela Resolução
  nº 604, de 29.01.2021)

  (4) Classe IV, abrangendo aqueles que exploram serviço de transporte aéreo público de passageiros
  (excluindo a modalidade de transporte aéreo público não regular com aeronave de até 30 assentos)
  em voos domésticos, sendo: (Redação dada pela Resolução nº 604, de 29.01.2021)'
