cite: 108.125(b)
title: 108.125(b)
text: '(b) O operador aéreo pode certificar pessoa jurídica como expedidor reconhecido, por
  meio de processo de aprovação do Programa de Segurança do Expedidor Reconhecido (PSER),
  que inclua auditoria interna das seguintes medidas: segurança aplicada às áreas e instalações;
  segurança aplicada às pessoas; e segurança aplicada à carga. (Redação dada pela Resolução
  nº 604, de 29.01.2021)

  (1) O expedidor é considerado como reconhecido mediante ratificação da ANAC da realização
  de sua certificação e registro pelo operador aéreo.'
