title: 108.125(c)
text: (c) O operador de aeródromo deve prover as medidas para a facilitação do processamento
  de cargas e a garantia da segurança da aviação civil necessárias para atender às organizações
  certificadas no âmbito do Programa OEA-ANAC (RBAC nº 109). (Incluído pela Resolução nº 767,
  de 05.02.2025)
