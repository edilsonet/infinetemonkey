section_title: Aceitação da carga e mala postal
subsection_id: i
cite: 108.125(i)
title: 108.125(i)
text: '(i) o volume deve ser classificado como carga conhecida, se for proveniente de expedidor
  reconhecido, expedidor acreditado ou agente de carga aérea acreditado, e estiver acompanhado
  de Declaração de Segurança.

  (ii) o volume de carga proveniente do operador do aeródromo também pode ser classificado
  como carga conhecida, desde que esse operador confirme por meio de informações documentais,
  em suporte físico ou eletrônico, o recebimento deste por uma das entidades descritas no
  parágrafo 108.125(a)(4)(i).

  (iii) o volume aceito como carga ou mala postal desconhecida pode ser reclassificado como
  carga conhecida após a aplicação de inspeção de segurança e emissão de Declaração de Segurança
  (CSD - Consignment Security Declaration). (Redação dada pela Resolução nº 729, de 24.01.2024)​

  (5) processar os volumes recebidos por meio de fluxos segregados, em função da sua caracterização
  como carga conhecida, carga desconhecida ou carga de alto risco, evitando a contaminação
  dos volumes de carga; e

  (6) emitir um conhecimento aéreo de acordo com procedimentos específicos estabelecidos pela
  ANAC.'
