section_title: Inspeção da carga e mala postal
subsection_id: a
cite: 108.127(a)
title: 108.127(a)
text: '(a) O operador aéreo deve realizar inspeção da carga ou de mala postal não classificada
  como carga ou mala postal conhecida, incluindo as cargas em transferência, por meios disponibilizados
  pelo operador de aeródromo ou, se preferível, por meios próprios, desde que atenda aos requisitos
  estabelecidos em normatização específica sobre a matéria e, ainda, em constante coordenação
  com o operador do aeródromo.

  (1) Em voos internacionais, toda carga e mala postal não classificada como carga conhecida,
  e a carga e mala postal classificada como carga de alto risco devem ser submetidas à inspeção
  de segurança.'
