section_title: Inspeção da carga e mala postal
subsection_id: b
cite: 108.127(b)
title: 108.127(b)
text: (b) Carga ou mala postal classificados como de alto risco devem ser submetidas a uma
  inspeção de segurança secundária, através de método adequado à natureza da remessa, suficiente
  para mitigar a ameaça relacionada, podendo utilizar tecnologias diferentes de inspeção de
  segurança.
