title: 108.127(c)
text: (c) Quando os controles de segurança são aplicados em instalações próprias, o operador
  aéreo deve adquirir e manter os equipamentos destinados à inspeção, em conformidade com
  os requisitos estabelecidos em normatização específica sobre a matéria.
