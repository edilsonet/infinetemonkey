section_title: Inspeção da carga e mala postal
subsection_id: i
cite: 108.127(i)
title: 108.127(i)
text: '(i) A carga e mala postal que não possua Declaração de Segurança que comprova que ela
  tenha sido submetida a controles de segurança no aeródromo de origem (inspeção de segurança
  ou pertencente a uma cadeia segura da carga) deve ser inspecionada no aeródromo de transferência
  da carga. (Incluído pela Resolução nº 729, de 24.01.2024)​

  (2) Em voos domésticos, a quantidade de carga ou mala postal que deve ser inspecionada será
  determinada pela ANAC e informada aos operadores aéreos e operadores de aeródromos por meio
  de DAVSEC.

  (3) A inspeção de segurança da carga e mala postal deve considerar o uso do método adequado
  à natureza de cada remessa.

  (4) A carga ou mala postal conhecida deve ser submetida, de forma aleatória, ao processo
  de inspeção de segurança.

  (5) [Reservado] (Redação dada pela Resolução nº 729, de 24.01.2024)​'
