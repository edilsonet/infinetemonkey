section_title: Proteção da carga e mala postal
subsection_id: a
cite: 108.129(a)
title: 108.129(a)
text: (a) O operador aéreo deve garantir que toda carga e mala postal, cuja armazenagem e
  manuseio estiverem sob sua responsabilidade, sejam protegidas em ambiente seguro e com vigilância
  constante, protegido contra o acesso não autorizado, devendo, ainda, assegurar a identificação
  de cada carga com as informações adequadas.
