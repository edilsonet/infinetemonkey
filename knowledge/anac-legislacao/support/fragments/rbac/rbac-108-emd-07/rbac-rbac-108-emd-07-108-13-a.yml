cite: 108.13(a)
title: 108.13(a)
text: (a) O operador aéreo deve estabelecer procedimentos, em coordenação com o operador do
  aeródromo, para garantir a aplicação de controles de segurança, conforme disposto nas subpartes
  seguintes deste Regulamento, e impedir que sejam introduzidas armas, explosivos, artefatos
  QBRN ou substâncias e materiais proibidos em ARS ou a bordo de aeronave que possam colocar
  em risco a segurança.
