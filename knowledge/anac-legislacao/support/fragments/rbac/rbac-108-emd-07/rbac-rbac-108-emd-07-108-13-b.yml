text: (b) O operador aéreo deve designar profissional(is) capacitado(s), de acordo com requisitos
  estabelecidos em normatização específica sobre a matéria, responsável(is) por executar os
  procedimentos dos controles de segurança referidos neste Regulamento. (Redação dada pela
  Resolução nº 500, de 12.12.2018)
