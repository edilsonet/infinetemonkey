cite: 108.13(c)
title: 108.13(c)
text: (c) O operador aéreo deve garantir que as empresas de serviços auxiliares de transporte
  aéreo e outros exploradores de áreas aeroportuárias contratados possuam PSESCA aprovados
  pelo operador de aeródromo, quando o PSESCA for obrigatório por regulamentação específica,
  mantendo cópia do PSESCA de cada contratada.
