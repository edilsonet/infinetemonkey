cite: 108.13(d)
title: 108.13(d)
text: '(d) O operador aéreo deve designar, em âmbito local, profissional(is) capacitado(s)
  de acordo com requisitos estabelecidos em normatização específica sobre a matéria, responsável(is)
  por supervisionar a execução dos controles de segurança referidos neste Regulamento, garantir
  a implementação das atribuições do operador aéreo nas ações de contingência e participar
  das atividades pertinentes a AVSEC, quando for necessário, a critério do operador de aeródromo.

  (1) O operador aéreo deve garantir que ao menos um profissional conforme referido no parágrafo
  108.13(d), devidamente capacitado, esteja atuando no aeródromo nos horários em que a empresa
  estiver operando, e participe das reuniões da Comissão de Segurança Aeroportuária (CSA)
  e dos exercícios de segurança. (Redação dada pela Resolução nº 500, de 12.12.2018)

  (2) O operador aéreo deve formalizar junto ao operador do aeródromo a designação do(s) referido(s)
  profissional(is) devidamente capacitado(s).

  (3) Os profissionais responsáveis pela AVSEC em âmbito local nas bases de operação do operador
  aéreo são responsáveis pela aplicação do PCQ/AVSEC nas respectivas bases. (Incluído pela
  Resolução nº 500, de 12.12.2018)'
