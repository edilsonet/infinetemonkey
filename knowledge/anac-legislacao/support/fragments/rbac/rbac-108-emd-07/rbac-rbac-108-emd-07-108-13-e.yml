cite: 108.13(e)
title: 108.13(e)
text: '(e) O operador aéreo deve designar, em âmbito nacional, profissional capacitado e suplente(s),
  de acordo com requisitos estabelecidos em normatização específica sobre a matéria, responsável
  pelo gerenciamento da aplicação dos controles de segurança referidos neste Regulamento no
  conjunto de aeródromos em que o operador atue.

  (1) Não há impedimento para que o responsável do operador aéreo em âmbito nacional também
  seja designado como responsável em âmbito local em um determinado aeródromo. (Redação dada
  pela Resolução nº 500, de 12.12.2018)'
