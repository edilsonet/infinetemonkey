cite: 108.13(f)
title: 108.13(f)
text: '(f) O operador aéreo deve designar profissionais - titular e suplente(s) - em âmbito
  nacional, que serão responsáveis pela gestão dos processos relacionados ao controle de qualidade
  AVSEC. (Redação dada pela Resolução nº 500, de 12.12.2018)

  (1) O profissional designado não poderá atuar em atividades operacionais AVSEC do operador,
  de forma a garantir sua independência. (Incluído pela Resolução nº 500, de 12.12.2018)'
