title: 108.13(i)
text: (i) O operador aéreo deve garantir que os profissionais que executam os procedimentos
  dos controles de segurança previstos neste regulamento como de responsabilidade do operador
  aéreo, atuem dentro de suas atribuições e capacitações. (Incluído pela Resolução nº 500,
  de 12.12.2018)
