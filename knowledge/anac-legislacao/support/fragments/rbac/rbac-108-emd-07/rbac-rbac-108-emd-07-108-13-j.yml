title: 108.13(j)
text: (j) Para atendimento dos parágrafos 108.13 (h), os operadores aéreos estrangeiros podem
  utilizar Auditores AVSEC de sua matriz, observando critério de capacitação e seleção do
  seu Estado de origem para atuação como Auditor AVSEC. (Incluído pela Resolução nº 500, de
  12.12.2018)
