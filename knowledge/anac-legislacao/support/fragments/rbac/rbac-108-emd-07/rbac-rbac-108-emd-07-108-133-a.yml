section_title: Carga e mala postal suspeitas
subsection_id: a
cite: 108.133(a)
title: 108.133(a)
text: (a) O operador aéreo deve garantir que a carga e a mala postal não identificadas, abandonadas,
  violadas, que apresentem ruído, exalem odor forte ou apresentem sinais de vazamento de alguma
  substância líquida, sólida ou gasosa não identificável como substância permitida para transporte,
  sejam consideradas suspeitas.
