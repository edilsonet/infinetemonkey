section_title: Artigos perigosos e produtos controlados
subsection_id: a
cite: 108.135(a)
title: 108.135(a)
text: (a) O operador aéreo deve garantir que o transporte de artigos perigosos e de produtos
  controlados siga a normatização específica sobre a matéria, assegurando a devida identificação
  e segregação dos demais volumes, a fim de impossibilitar o uso intencional desses objetos
  em atos de interferência ilícita.
