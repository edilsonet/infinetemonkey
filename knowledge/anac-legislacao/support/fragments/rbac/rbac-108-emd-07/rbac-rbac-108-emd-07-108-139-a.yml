section_title: Transporte aéreo de valores
subsection_id: a
cite: 108.139(a)
title: 108.139(a)
text: (a) O operador aéreo deve realizar o transporte de valores seguindo procedimentos de
  segurança previstos em um plano de segurança específico para o transporte aéreo de valores
  do aeródromo, compatível com os valores a serem transportados e com comunicação prévia com
  os operadores dos aeródromos envolvidos.
