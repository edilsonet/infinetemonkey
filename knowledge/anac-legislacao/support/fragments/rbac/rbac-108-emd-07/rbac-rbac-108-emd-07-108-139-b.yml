title: 108.139(b)
text: (b) Os valores a serem transportados devem ser descritos, sem utilizar palavras genéricas,
  no formulário de Declaração de Transporte Aéreo de Valores, documento de caráter sigiloso
  conforme modelo estabelecido em Instrução Suplementar (IS) da ANAC.
