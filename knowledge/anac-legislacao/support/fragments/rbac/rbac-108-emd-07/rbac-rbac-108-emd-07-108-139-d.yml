section_title: Transporte aéreo de valores
subsection_id: d
cite: 108.139(d)
title: 108.139(d)
text: (d) Nas operações domésticas, o transporte aéreo de valores, sob a forma de cartões
  telefônicos, cheque de viagem, título ao portador, vale refeição, vale transporte, gemas
  coloridas, diamantes, joias, ouro, prata, platina e outros metais preciosos, não deve exceder
  o equivalente a R$ 630.000,00 (seiscentos e trinta mil reais).
