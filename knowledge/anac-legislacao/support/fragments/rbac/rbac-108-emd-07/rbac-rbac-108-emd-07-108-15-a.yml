title: 108.15(a)
text: '(a) O operador aéreo deve elaborar e implementar um processo contínuo de avaliação
  de risco, com o objetivo de orientar o planejamento da segurança em suas operações e complementar
  as medidas de segurança previstas em norma.

  (Incluído pela Resolução nº 604, de 29.01.2021)'
