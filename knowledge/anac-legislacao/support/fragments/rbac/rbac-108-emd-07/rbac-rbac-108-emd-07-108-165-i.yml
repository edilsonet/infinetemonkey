section_title: Controle de acesso à aeronave
subsection_id: i
cite: 108.165(i)
title: 108.165(i)
text: '(i) o controle de acesso, por meio da identificação de cada pessoa que se aproxime
  ou embarque na aeronave e a verificação da necessidade de sua presença; e

  (ii) a verificação de qualquer material de serviço levado a bordo ou suprimentos de aviação
  que serão transportados pela aeronave; (Redação dada pela Resolução nº 604, de 29.01.2021)

  (2) [Reservado] (Redação dada pela Resolução nº 604, de 29.01.2021)

  (3) a aproximação e o acesso à aeronave a partir do início do processo de inspeção ou verificação
  de segurança até o fechamento das portas da aeronave deve ser registrado por meio de formulário
  de controle de acesso à aeronave;

  (4) em caso de dúvida ou suspeita na identificação de pessoas que se aproximem ou embarquem
  na aeronave, o operador aéreo deve acionar o setor de segurança do aeródromo e a PF ou,
  na sua ausência, o órgão de segurança pública responsável pelas atividades de polícia no
  aeródromo; e

  (5) o operador aéreo deve supervisionar, sob a ótica da AVSEC, as atividades de limpeza,
  abastecimento, manutenção e carregamento da aeronave.'
