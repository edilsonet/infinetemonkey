cite: 108.167(a)
title: 108.167(a)
text: (a) O operador aéreo deve executar a verificação de segurança da aeronave previamente
  a todos os voos em que não se realize a inspeção de segurança da aeronave, bem como nos
  casos previstos em DAVSEC. (Redação dada pela Resolução nº 626, de 14.06.2021)
