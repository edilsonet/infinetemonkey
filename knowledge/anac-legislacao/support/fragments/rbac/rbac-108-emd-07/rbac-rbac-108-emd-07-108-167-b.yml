cite: 108.167(b)
title: 108.167(b)
text: (b) O operador aéreo deve desenvolver um formulário de verificação (check-list) para
  a atividade de verificação da aeronave, de acordo com cada tipo de aeronave em serviço,
  e a sua utilização deve ser considerada como norma de segurança a ser observada pela tripulação.
