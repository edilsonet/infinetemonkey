cite: 108.17(a)
title: 108.17(a)
text: '(a) O operador aéreo deve identificar as informações, dados e sistemas de tecnologia
  da comunicação julgados como críticos para sua operação e implementar medidas para protegê-los,
  por meio de uma avaliação de risco conforme 108.15(a).

  (Incluído pela Resolução nº 604, de 29.01.2021)'
