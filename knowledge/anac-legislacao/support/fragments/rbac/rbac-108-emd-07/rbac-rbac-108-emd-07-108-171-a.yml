section_title: Despacho AVSEC do voo
subsection_id: a
cite: 108.171(a)
title: 108.171(a)
text: (a) O operador aéreo deve produzir o Despacho AVSEC do voo, por meio de profissional(is)
  designado(s) e capacitado(s) conforme parágrafo 108.13(b), que deve ser composto pela documentação
  que comprove a realização das atividades AVSEC necessárias para o voo. Cada formulário que
  compõe o Despacho AVSEC deve possuir a identificação do profissional que o elabora.
