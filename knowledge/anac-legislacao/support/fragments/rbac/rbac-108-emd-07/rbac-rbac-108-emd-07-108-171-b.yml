cite: 108.171(b)
title: 108.171(b)
text: '(b) O Despacho AVSEC deve conter os seguintes formulários, quando aplicáveis para o
  voo:

  (1) Formulário de Controle de Acesso à Aeronave, conforme seção 108.165;

  (2) Formulário de Verificação de Segurança da Aeronave, conforme seção 108.167;

  (3) Formulário de Inspeção de Segurança da Aeronave, conforme seção 108.169;

  (4) Formulário de Controle de Bagagens Embarcadas, conforme seção 108.55;

  (5) Formulário de Localização de Bagagens Embarcadas, conforme seção 108.55; (Redação dada
  pela Resolução nº 500, de 12.12.2018)

  (6) Formulário de Controle de Provisões Embarcadas, conforme seção 108.97; e (Redação dada
  pela Resolução nº 500, de 12.12.2018)

  (7) Relatório de impedimento de embarque de passageiro indisciplinado, conforme seção 108.33.
  (Incluído pela Resolução nº 500, de 12.12.2018)'
