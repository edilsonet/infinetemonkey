section_title: Reunião inicial AVSEC da tripulação
subsection_id: a
cite: 108.195(a)
title: 108.195(a)
text: '(a) O operador aéreo deve garantir que o comandante inclua no briefing da tripulação
  assuntos relacionados a atos de interferência ilícita, buscando:

  (1) definir tarefas, recomendar ações e posturas a toda a tripulação;

  (2) dirimir dúvidas individuais da tripulação no que concerne às atitudes a serem tomadas
  dentro da aeronave para prevenir ou responder a atos de interferência ilícita; e

  (3) estabelecer códigos de comunicação entre a tripulação, de acordo com a análise da situação
  e critérios específicos.'
