section_title: Acesso à cabine de comando
subsection_id: a
cite: 108.197(a)
title: 108.197(a)
text: (a) O operador aéreo que operar aeronave com cabine segregada deve garantir que apenas
  pessoas autorizadas conforme regulamento de operação específico acessem a cabine dos pilotos
  das suas aeronaves em voo.
