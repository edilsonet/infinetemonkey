title: 108.199(a)
text: (a) O operador aéreo deve garantir a aplicação de controles de segurança para passageiros
  armados ou sob custódia, durante o voo, seguindo os requisitos e procedimentos estabelecidos
  em normatização específica sobre a matéria.
