cite: 108.225(a)
title: 108.225(a)
text: '(a) O operador aéreo deve estabelecer, para cada aeródromo onde opera, um plano de
  contingência, em coordenação com o operador de aeródromo e demais órgãos públicos e entidades
  envolvidos, a fim de responder a um ato de interferência ilícita ou ameaça que possa afetar
  a segurança.

  (1) O operador aéreo deve manter para cada aeródromo onde opera uma lista atualizada dos
  contatos de emergência necessários para ativação de seu plano de contingência.'
