cite: 108.225(c)
title: 108.225(c)
text: '(c) São responsabilidades do operador aéreo:

  (1) agir de acordo com as ações estabelecidas no plano de contingência, quando receber informações
  que motivem sua utilização;

  (2) aplicar procedimentos padronizados de recebimento, disseminação e tratamento de informação,
  pré-estabelecidos por meio de fluxos de acionamento;

  (3) estabelecer sistemas de comunicação que garantam que os procedimentos de difusão de
  informações sob sua responsabilidade durante as ações de contingência sejam eficazes, de
  modo que os órgãos e pessoas competentes recebam as informações em tempo hábil, possibilitando
  a mitigação das consequências ou até mesmo a solução do ato de interferência;

  (4) compor a Assessoria de Avaliação de Risco (AAR) e implementar as medidas adicionais
  de segurança necessárias, de acordo com a avaliação de ameaça;

  (5) participar dos Grupos de Decisão e do Grupo Operacional para o Gerenciamento de Crise,
  quando solicitado pelo operador de aeródromo;

  (6) coletar o maior número possível de dados para subsidiar a AAR e demais grupos de gerenciamento
  de crise;

  (7) garantir o sigilo das informações acerca dos fatos geradores da ação de contingência
  e seus desdobramentos, tais como táticas empregadas pela pessoa ou grupo responsável pelo
  ato de interferência ilícita ou pelo grupo responsável por combater o ato;

  (8) apoiar os grupos de gerenciamento de crise na disponibilidade de suprimentos, equipamentos
  e recursos humanos necessários, incluindo aqueles que estiverem ao alcance exclusivo do
  operador aéreo;

  (9) garantir que os funcionários tenham conhecimento de suas responsabilidades nas ações
  do plano de contingência;

  (10) disponibilizar em cada base de operação um plano de contingência atualizado, contendo
  os fluxos de acionamento e seus contatos;

  (11) participar dos exercícios de AVSEC promovidos pelos operadores dos aeródromos onde
  mantiver operações aéreas; e

  (12) manter cópia do plano de contingência do operador do aeródromo onde opera.'
