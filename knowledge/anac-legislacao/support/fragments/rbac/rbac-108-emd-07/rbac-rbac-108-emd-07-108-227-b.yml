section_title: Medidas adicionais de segurança
subsection_id: b
cite: 108.227(b)
title: 108.227(b)
text: (b) Durante a realização das atividades do operador aéreo, quando forem encontrados
  substâncias ou objetos suspeitos de conter artefatos explosivos, artefatos QBRN ou outro
  material perigoso, a área deve ser isolada e o fato deve ser comunicado à Polícia Federal
  ou, na sua ausência, ao órgão de segurança pública responsável pelas atividades de polícia
  no aeródromo e, ainda, ao operador do aeródromo.
