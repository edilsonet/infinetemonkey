section_title: Medidas adicionais de segurança
subsection_id: c
cite: 108.227(c)
title: 108.227(c)
text: (c) Quando o nível nacional de ameaça for classificado como âmbar ou vermelho ou quando
  um determinado aeródromo ou voo estiver sob situação de ameaça, o operador aéreo deve garantir
  a adoção das medidas adicionais de segurança previstas no seu plano de contingência ou em
  DAVSEC.
