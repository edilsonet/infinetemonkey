cite: 108.227(d)
title: 108.227(d)
text: (d) O operador aéreo deverá cumprir outras medidas adicionais de segurança que possam
  ser exigidas pela ANAC, em função do surgimento de ameaça pontual em determinado(s) aeródromo(s)
  ou voo(s) ou, ainda, em função de uma avaliação de risco.
