title: 108.227(e)
text: (e) O operador aéreo deverá cumprir procedimentos específicos de proteção que possam
  ser exigidas pela Polícia Federal, em coordenação com a ANAC e o operador do aeródromo,
  nos casos de elevação do nível de ameaça nacional ou surgimento de alguma ameaça pontual.
