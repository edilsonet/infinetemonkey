section_title: Medidas adicionais de segurança
subsection_id: f
cite: 108.227(f)
title: 108.227(f)
text: (f) No caso de pouso não previsto em aeródromo brasileiro não listado nas especificações
  operativas do operador aéreo, a menos que o aeródromo disponha de autoridades brasileiras
  para fazer cumprir as normas de segurança aplicáveis para a operação, o operador aéreo deve
  ficar responsável pelo cumprimento dessas normas perante o Governo brasileiro.
