cite: 108.229(a)
title: 108.229(a)
text: '(a) O operador aéreo deve comunicar à ANAC em um prazo máximo de 30 (trinta) dias da
  sua constatação, evidências de vulnerabilidades no sistema de proteção da aviação civil
  ou atos de interferência ilícita contra a aviação civil, por meio de DSAC.

  (1) Quando a vulnerabilidade for identificada em aeródromo, o respectivo operador também
  deve ser comunicado pelo operador aéreo, em um prazo máximo de 30 (trinta) dias da constatação.'
