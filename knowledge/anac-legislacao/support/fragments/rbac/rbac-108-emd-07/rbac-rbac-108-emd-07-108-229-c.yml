cite: 108.229(c)
title: 108.229(c)
text: (c) O operador aéreo deve garantir a comunicação efetiva entre os membros da tripulação,
  entre a tripulação e o operador aéreo, entre a tripulação e os órgãos de controle, e entre
  o operador aéreo e os órgãos de controle, visando a assegurar a perfeita operação da aeronave
  e cooperação com o comando de ações de resposta.
