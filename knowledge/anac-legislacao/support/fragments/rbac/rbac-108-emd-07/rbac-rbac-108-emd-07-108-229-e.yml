cite: 108.229(e)
title: 108.229(e)
text: '(e) O operador aéreo deve garantir a identificação e o gerenciamento de informações
  consideradas como informação restrita de AVSEC para que sejam de acesso somente às pessoas
  que tenham necessidade de conhecimento da informação, evitando sua disseminação indevida.
  (Incluído pela Resolução nº 729, de 24.01.2024)​

  (1) O operador aéreo deve implementar um processo de avaliação de antecedentes criminais
  de pessoa, prévio à concessão de acesso à informação restrita de AVSEC. (Incluído pela Resolução
  nº 729, de 24.01.2024)​'
