cite: 108.237(a)
title: 108.237(a)
text: '(a) Constituem responsabilidades dos operadores aéreos concernentes ao controle de
  qualidade AVSEC:

  (1) submeter-se às atividades de controle de qualidade realizadas pela ANAC, auxiliando
  os responsáveis pela aplicação das atividades de controle de qualidade nas solicitações
  que forem realizadas a fim de cumprir seus objetivos;

  (2) estabelecer, implementar e manter operacional um sistema de controle de qualidade AVSEC
  de forma a monitorar, rever e aprimorar a proteção da aviação civil contra atos de interferência
  ilícita;

  (3) atender às solicitações da ANAC e da Polícia Federal no que diz respeito à aplicação
  de testes AVSEC;

  (4) assegurar a disponibilidade de recursos humanos e materiais para aplicação do PCQ/AVSEC
  na esfera de sua responsabilidade, observando as características e dimensões das operações,
  tais como número de empresas contratadas, processos empregados, número de passageiros atendidos,
  locais de atuação, dentre outros; e

  (5) manter um sistema confidencial de relatos.'
