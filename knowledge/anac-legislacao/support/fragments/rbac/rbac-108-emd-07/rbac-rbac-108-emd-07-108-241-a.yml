cite: 108.241(a)
title: 108.241(a)
text: '(a) O operador aéreo deve realizar as seguintes atividades de controle de qualidade,
  observando as frequências mínimas estabelecidas no Apêndice A:

  (1) auditorias internas;

  (2) inspeções internas; e

  (3) testes.'
