cite: 108.241(v)
title: 108.241(v)
text: '(v) teste nas instalações dos expedidores reconhecidos registrados pelo operador aéreo.

  (A) no caso de o expedidor reconhecido ser registrado por mais de um operador aéreo, os
  operadores poderão se organizar para realizar uma única bateria de testes.

  (7) os testes AVSEC devem ser coordenados e acompanhados por profissional(is) capacitado(s),
  nos termos do PNIAVSEC.'
