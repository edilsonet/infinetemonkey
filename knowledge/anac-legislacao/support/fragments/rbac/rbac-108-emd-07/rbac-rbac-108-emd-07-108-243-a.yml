section_title: Registro das Atividades de Controle de Qualidade
subsection_id: a
cite: 108.243(a)
title: 108.243(a)
text: '(a) O operador aéreo deve elaborar e manter relatórios das atividades de controle de
  qualidade realizadas, observando as seguintes disposições:

  (1) Os relatórios de auditoria interna, inspeção interna e testes AVSEC devem indicar todos
  os requisitos AVSEC avaliados pelo operador aéreo, as datas de realização das atividades,
  os profissionais executores e os resultados verificados; e

  (2) Em relação aos exercícios de segurança, o operador aéreo deverá manter cópia das listas
  de presença dessas atividades, como forma de comprovar sua participação.'
