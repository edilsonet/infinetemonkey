cite: 108.243(b)
title: 108.243(b)
text: (b) No mínimo anualmente, o responsável pelo PCQ/AVSEC do operador aéreo deve elaborar
  e apresentar à alta direção do operador aéreo um relatório contendo um resumo de todas as
  atividades de controle de qualidade AVSEC realizadas ao longo do ano anterior.
