cite: 108.245(a)
title: 108.245(a)
text: (a) O operador aéreo é responsável pelo planejamento e cumprimento das ações corretivas
  referentes aos procedimentos e medidas de segurança que lhe são aplicáveis, incluindo os
  procedimentos e medidas que são operacionalizados por meio de empresas contratadas e de
  exploradores de áreas aeroportuárias.
