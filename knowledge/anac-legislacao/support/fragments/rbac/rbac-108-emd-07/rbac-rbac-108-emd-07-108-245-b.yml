cite: 108.245(b)
title: 108.245(b)
text: '(b) O operador aéreo deve aplicar procedimentos internos para identificar, documentar
  e tratar não conformidades relacionadas à regulamentação AVSEC vigente.

  (1) Devem ser tratadas tanto as não conformidades detectadas em atividades de controle de
  qualidade AVSEC realizadas pelo operador aéreo quanto em atividades conduzidas pela ANAC.'
