section_title: Tratamento de Não Conformidades
subsection_id: c
cite: 108.245(c)
title: 108.245(c)
text: '(c) O operador aéreo deve elaborar e manter atualizado um plano para tratar ações corretivas
  detectadas ao longo de atividades de controle de qualidade, incluindo o seguinte conteúdo
  mínimo:

  (1) não conformidades detectadas e respectivas causas;

  (2) ações necessárias para correção de cada não conformidade;

  (3) prazo para solução definitiva de cada não conformidade;

  (4) medidas mitigadoras até a solução definitiva, quando necessário para garantia da segurança;
  e

  (5) fotos e documentações capazes de comprovar que as não conformidades foram solucionadas.'
