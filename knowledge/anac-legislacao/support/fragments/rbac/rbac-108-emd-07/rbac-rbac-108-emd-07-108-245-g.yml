title: 108.245(g)
text: (g) Em caso de obtenção de resultado abaixo do padrão mínimo de desempenho estabelecido
  pela Agência para os testes AVSEC em determinado ciclo, o operador aéreo deverá adotar ações
  corretivas e outras ações previstas em ato de caráter reservado da Superintendência responsável
  pela AVSEC. (Redação dada pela Resolução nº 677, de 04.05.2022)
