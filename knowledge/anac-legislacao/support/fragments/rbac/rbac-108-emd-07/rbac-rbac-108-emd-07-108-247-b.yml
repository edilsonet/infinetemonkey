section_title: Sistema Confidencial de Relatos
subsection_id: b
cite: 108.247(b)
title: 108.247(b)
text: '(b) O canal de comunicação implantado pelo operador aéreo deve observar as seguintes
  disposições:

  (1) ser de fácil acesso, permitindo que os relatos e informações sejam encaminhadas de forma
  ágil ao operador aéreo;

  (2) possibilitar o recebimento de informações sem identificação do remetente; e

  (3) ser divulgado aos profissionais vinculados ao operador aéreo.'
