cite: 108.247(c)
title: 108.247(c)
text: '(c) O operador aéreo deve analisar as informações recebidas e mitigar vulnerabilidades
  ou ameaças que tragam risco a segurança da aviação.

  (1) Os relatos e informações recebidos pelo operador aéreo por meio do sistema confidencial
  de relatos, bem como as ações decorrentes implementadas pelo operador aéreo, devem ser documentados
  e arquivados por prazo mínimo de 2 (dois) anos, em formato físico ou digital.'
