section_title: Processo de despacho do passageiro e da bagagem de mão
subsection_id: b
cite: 108.25(b)
title: 108.25(b)
text: '(b) O operador aéreo deve no momento do processo de despacho do passageiro:

  (1) informar ao passageiro sobre os materiais considerados proibidos na bagagem de mão e
  na bagagem despachada para embarque na aeronave; e

  (2) orientar o passageiro a recusar o transporte de pacotes ou objetos recebidos de desconhecidos
  na bagagem de mão e na bagagem despachada.'
