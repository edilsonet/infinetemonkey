section_title: Processo de despacho do passageiro e da bagagem de mão
subsection_id: c
cite: 108.25(c)
title: 108.25(c)
text: '(c) O operador aéreo deve fazer constar no contrato de transporte aéreo:

  (1) as informações e orientações estabelecidas no parágrafo 108.25(b); e

  (2) a informação de que será negado o acesso do passageiro à ARS, bem como o embarque na
  aeronave, no caso de recusa em submeter-se à inspeção de segurança da aviação civil sob
  responsabilidade do operador de aeródromo, ou caso esteja em posse de material considerado
  proibido.'
