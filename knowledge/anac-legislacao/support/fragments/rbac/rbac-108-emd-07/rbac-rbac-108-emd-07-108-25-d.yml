section_title: Processo de despacho do passageiro e da bagagem de mão
subsection_id: d
cite: 108.25(d)
title: 108.25(d)
text: (d) O operador aéreo, durante os procedimentos de embarque, deve realizar a identificação
  do passageiro de forma a assegurar que, ao embarcar na aeronave, o passageiro seja o detentor
  do bilhete aéreo e esteja de posse de documento válido de identificação, nos termos estabelecidos
  em normatização específica sobre a matéria. (Redação dada pela Resolução nº 604, de 29.01.2021)
