cite: 108.25(e)
title: 108.25(e)
text: '(e) O operador aéreo deve assegurar que o percurso dos passageiros entre a área de
  embarque e a aeronave seja realizado sem que ocorra contato com pessoas não inspecionadas
  para o voo e obedecendo ao percurso estabelecido pelo operador do aeródromo.

  (1) Caso algum passageiro inspecionado entre em contato com pessoa não inspecionada, o operador
  aéreo, em coordenação com o operador do aeródromo, deve garantir que seja realizada outra
  inspeção antes do embarque na aeronave.'
