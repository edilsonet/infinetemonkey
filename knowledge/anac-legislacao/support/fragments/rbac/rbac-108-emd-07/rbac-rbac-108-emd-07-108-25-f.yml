cite: 108.25(f)
title: 108.25(f)
text: '(f) O operador aéreo deve disponibilizar representantes nas áreas de embarque e desembarque
  para orientar e prestar assistência aos seus passageiros, de forma a evitar atos ou situações
  que possam afetar a segurança, observando aqueles que possam afetar a facilitação do transporte
  aéreo.

  (1) O operador aéreo deve garantir a proteção da(s) área(s) de embarque sob sua responsabilidade,
  impedindo o acesso indevido às áreas operacionais do aeródromo.'
