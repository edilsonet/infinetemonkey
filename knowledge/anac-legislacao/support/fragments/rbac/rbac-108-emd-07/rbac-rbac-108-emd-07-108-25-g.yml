section_title: Processo de despacho do passageiro e da bagagem de mão
subsection_id: g
cite: 108.25(g)
title: 108.25(g)
text: (g) Os dados de reservas, passagens, cargas, bagagens, identificação, procedência e
  destino de passageiros e tripulantes, registrados pelos operadores aéreos, devem ser disponibilizados
  aos órgãos púbicos e seus representantes autorizados, em conformidade com os requisitos
  estabelecidos em normatização específica sobre a matéria.
