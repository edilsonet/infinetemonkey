section_title: Processo de despacho do passageiro e da bagagem de mão
subsection_id: h
cite: 108.25(h)
title: 108.25(h)
text: (h) O operador aéreo deve garantir a proteção dos bilhetes, dos cartões de embarque,
  das etiquetas de bagagem e de quaisquer outros documentos relacionados ao embarque que estejam
  em sua posse, com o objetivo de evitar que sejam extraviados ou furtados, impossibilitando
  o seu uso por terceiros em atos de interferência ilícita.
