cite: 108.25(i)
title: 108.25(i)
text: '(i) O operador aéreo pode implementar medidas de segurança relacionadas aos passageiros
  e suas bagagens nas operações não realizadas em Áreas Restritas de Segurança, baseadas na
  avaliação de risco realizada para suas operações, conforme disposto no parágrafo 108.15(a).
  (Incluído pela Resolução nº 604, de 29.01.2021)

  (1) As exigências de treinamento e certificação previstas pelo RBAC 110 não são aplicáveis
  no cumprimento do parágrafo 108.25 (i). (Incluído pela Resolução nº 604, de 29.01.2021)'
