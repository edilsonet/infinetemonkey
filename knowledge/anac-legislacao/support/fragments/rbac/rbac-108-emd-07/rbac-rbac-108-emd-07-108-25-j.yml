cite: 108.25(j)
title: 108.25(j)
text: '(j) O operador aéreo pode conceder, após identificação, autorização de acesso às salas
  de embarque e desembarque de pessoa para acompanhar passageiro menor em voos domésticos,
  observadas a legislação e as regulamentações dos órgãos competentes​.”

  (1) O operador aéreo deve informar à pessoa autorizada que se aplicam a ela as regras previstas
  para os passageiros, quanto aos procedimentos de inspeção de segurança.

  (2) O operador aéreo, em conjunto com o operador de aeródromo, define os meios e características
  da autorização do acompanhante com o objetivo de garantir a sua devida leitura e evitar
  sua utilização indevida.

  (Incluído pela Resolução nº 702, de 26.01.2023)'
