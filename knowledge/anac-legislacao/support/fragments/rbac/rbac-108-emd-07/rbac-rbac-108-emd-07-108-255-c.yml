cite: 108.255(c)
title: 108.255(c)
text: (c) Além do cumprimento dos requisitos deste Regulamento, conforme descrição no PSOA,
  segundo aplicabilidade presente na seção 108.7, o operador aéreo deve, também, conhecer
  e cumprir as medidas de AVSEC estabelecidas pelo operador do aeródromo onde opera.
