section_title: Implementação do Programa de Segurança do Operador Aéreo
subsection_id: d
cite: 108.255(d)
title: 108.255(d)
text: '(d) O operador aéreo deve manter ao menos uma cópia do seu PSOA em cada base operacional,
  em formato físico ou digital.

  (1) A última versão da Listagem de Inclusão de Medidas de Segurança e Procedimentos Alternativos,
  aprovada pela ANAC, é parte integrante do PSOA.

  (Redação dada pela Resolução nº 604, de 29.01.2021)'
