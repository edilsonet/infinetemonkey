title: 108.257(c)
text: (c) O responsável do operador aéreo em âmbito nacional pela AVSEC, previsto no parágrafo
  108.13(e), é responsável pela guarda, distribuição e controle do PSOA, de forma que garanta
  o devido sigilo do documento.
