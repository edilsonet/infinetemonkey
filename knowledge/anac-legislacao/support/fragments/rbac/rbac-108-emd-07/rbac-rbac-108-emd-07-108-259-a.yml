section_title: Programa de Controle de Qualidade AVSEC do Operador Aéreo
subsection_id: a
cite: 108.259(a)
title: 108.259(a)
text: (a) O operador aéreo deve elaborar, implementar e manter um Programa de Controle de
  Qualidade AVSEC (PCQ/AVSEC) com o objetivo de conduzir as atividades de controle de qualidade
  AVSEC de forma padronizada, eficiente e segura e de aprimorar a proteção da aviação civil
  contra atos de interferência ilícita.
