section_title: Passageiro em trânsito ou em conexão
subsection_id: a
cite: 108.27(a)
title: 108.27(a)
text: '(a) O operador aéreo, em coordenação com o operador de aeródromo, deve garantir que
  os passageiros em trânsito ou em conexão e suas respectivas bagagens de mão não entrem em
  contato com pessoas não inspecionadas para o voo, realizando a supervisão das áreas de circulação
  e dos corredores de chegada e de partida.

  (1) Caso algum passageiro em trânsito ou em conexão entre em contato com pessoa não inspecionada,
  o operador aéreo, em coordenação com o operador do aeródromo, deve garantir que seja realizada
  outra inspeção antes do embarque na aeronave.'
