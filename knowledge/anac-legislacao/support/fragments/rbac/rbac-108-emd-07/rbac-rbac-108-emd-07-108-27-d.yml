title: 108.27(d)
text: (d) No caso de passageiro em trânsito, o operador aéreo deverá realizar seu direcionamento
  ao ponto de inspeção de segurança do aeródromo nos casos previstos na DAVSEC citada no parágrafo
  108.27(c)(1). (Incluído pela Resolução nº 626, de 14.06.2021)
