cite: 108.275(a)
title: 108.275(a)
text: '(a) Até a publicação de regulamentação específica que disponha sobre agente de carga
  aérea acreditado, operadores postais poderão ser considerados como tal, no que diz respeito
  ao transporte de mala postal, por parte dos operadores aéreos, desde que a ANAC reconheça
  o atendimento pelo operador postal dos seguintes parágrafos, aplicáveis quando a mala postal
  estiver sob sua responsabilidade: 108.123; 108.127; 108.129; 108.131; 108.133; 108.135;
  além das disposições previstas pelo RBAC nº 110 aplicáveis à agentes de carga.

  (1) O operador postal deve designar um Responsável AVSEC, profissional com certificação
  válida no curso Básico AVSEC e com a atribuição de gerenciamento da aplicação dos controles
  de segurança referidos no parágrafo 108.275(a).

  (2) Ficam as disposições previstas pelas Instruções Suplementares (IS) relativas aos requisitos
  mencionados no parágrafo 108.275(a) aplicáveis ao operador postal, como formas de cumprimento.

  (3) Caso a ANAC identifique o descumprimento do parágrafo 108.275(a) pelo operador postal,
  fica este sujeito à perda do reconhecimento pela ANAC como agente de carga acreditado, de
  forma temporária ou definitiva.

  (Redação dada pela Resolução nº 604, de 29.01.2021)'
