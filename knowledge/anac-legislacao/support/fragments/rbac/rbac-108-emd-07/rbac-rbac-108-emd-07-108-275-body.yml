text: '108.275

  Disposições finais e transitórias

  108.275(a)

  Não aplicável

  108.275(b)

  Não aplicável

  108.275(c)(1)

  40.000

  70.000

  100.000

  1 por constatação

  (caso deixe de realizar a inspeção)

  108.275(c)(1)

  20.000

  35.500

  50.000

  1 por constatação

  (caso realize sem observar procedimentos e recursos conforme norma específica)

  108.275(c)(2)

  10.000

  17.500

  25.000

  1 por constatação

  (caso opere sem aprovação prévia da ANAC)

  108.275(d)

  Não aplicável

  Parâmetro de incidência

  Forma de aplicação

  Não aplicável

  O requisito não contém obrigação dirigida ao regulado.

  Aplicabilidade nos subitens

  A obrigação contida no requisito será disciplinada em outros itens, para os quais será prevista
  a sanção.

  1 por atividade

  Será aplicada uma multa por cada atividade que o operador aéreo deixar de realizar em consonância
  com o requisito que indica este parâmetro de incidência.

  1 por bagagem

  Será aplicada uma multa por cada bagagem envolvida na violação ao requisito que indica esse
  parâmetro de incidência.

  1 por base

  Será aplicada uma multa por cada base de operações do regulado em que for identificada violação
  ao requisito que indica esse parâmetro de incidência.

  1 por constatação

  Será aplicada uma multa por cada conjunto de irregularidades identificadas que decorram
  de violação ao requisito que indica esse parâmetro de incidência.

  1 por expedidor

  Será aplicada uma multa por cada expedidor certificado pelo operador aéreo em descumprimento
  a cada requisito que indica esse parâmetro de incidência.

  1 por passageiro

  Será aplicada uma multa por cada passageiro envolvido na ocorrência que decorre de violação
  a requisito que indica esse parâmetro de incidência.

  1 por profissional

  Será aplicada uma multa por cada profissional envolvido na ocorrência que decorre de violação
  a requisito que indica esse parâmetro de incidência.

  1 por volume

  Será aplicada uma multa por cada volume envolvido na ocorrência que decorre de violação
  a requisito que indica esse parâmetro de incidência.

  1 por voo

  Será aplicada uma multa por cada voo envolvido na ocorrência que decorre de violação a requisito
  que indica esse parâmetro de incidência.'
