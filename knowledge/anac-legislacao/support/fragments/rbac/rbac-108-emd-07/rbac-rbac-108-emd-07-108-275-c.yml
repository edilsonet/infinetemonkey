cite: 108.275(c)
title: 108.275(c)
text: '(c) No caso de existir interesse do operador aéreo em operar em aeródromo onde não
  seja realizada, por parte do operador do aeródromo, a inspeção de segurança da aviação civil
  em passageiro e em bagagem de mão, ou onde não seja disponibilizado equipamento para a realização
  da inspeção em bagagem despachada ou em carga e mala postal, o operador aéreo poderá fazê-lo,
  desde que:

  (1) os procedimentos e recursos para a inspeção estejam em conformidade com os requisitos
  estabelecidos em normatização específica sobre a matéria; e

  (2) os procedimentos tenham sido aprovados pela ANAC.'
