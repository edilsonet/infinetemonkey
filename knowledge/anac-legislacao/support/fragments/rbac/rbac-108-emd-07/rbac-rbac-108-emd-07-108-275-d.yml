title: 108.275(d)
text: (d) As violações ao previsto neste Regulamento sujeitam o infrator às penalidades administrativas
  a serem apuradas em conformidade com o procedimento descrito em regulamentação específica
  sobre a matéria, adotando-se, para as infrações praticadas, os valores de multa previstos
  em seu Apêndice B. (Redação dada pela Resolução nº 729, de 24.01.2024)​
