cite: 108.275(e)
title: 108.275(e)
text: '(e) Os operadores aéreos devem avaliar se as alterações promovidas por esta Emenda
  acarretam alterações em seus programas de segurança. Em caso afirmativo, os operadores devem
  apresentar à ANAC solicitações de inclusão de medida de segurança ou procedimento alternativo,
  até 2 de agosto de 2021. (Redação dada pela Resolução nº 604, de 29.01.2021)

  (1) As alterações dos termos “Medida Adicional de Segurança” por “Adição de Medida de Segurança”
  e “Listagem de Medida Adicional de Segurança ou Procedimento Alternativo” por “Listagem
  de Adição de Medida de Segurança ou Procedimento Alternativo” não justificam a alteração
  do Programa de Segurança do Operador Aéreo. (Incluído pela Resolução nº 604, de 29.01.2021)'
