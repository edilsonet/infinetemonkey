cite: 108.3(a)
title: 108.3(a)
text: '(a) Para efeito deste Regulamento, aplicam-se as siglas estabelecidas a seguir, bem
  como as siglas e abreviaturas disponíveis no RBAC nº 01 e no artigo 3º do Anexo do Decreto
  11.195, de 8 de setembro de 2022: (Redação dada pela Resolução nº 729, de 24.01.2024)​

  (1) ARS: Área Restrita de Segurança;

  (2) AVSEC: Segurança da Aviação Civil contra Atos de Interferência Ilícita;

  (3) DAVSEC: Diretriz de Segurança da Aviação Civil contra Atos de Interferência Ilícita;

  (4) OEA: Operador Econômico Autorizado; (Redação dada pela Resolução nº 767, de 05.02.2025)

  (5) PSER: Programa de Segurança do Expedidor Reconhecido; (Redação dada pela Resolução nº
  767, de 05.02.2025)

  (6) PSESCA: Plano de Segurança de Empresa de Serviços Auxiliares ou Explorador de Área Aeroportuária;
  (Redação dada pela Resolução nº 767, de 05.02.2025)

  (7) PSOA: Programa de Segurança de Operador Aéreo. (Incluído pela Resolução nº 767, de 05.02.2025)'
