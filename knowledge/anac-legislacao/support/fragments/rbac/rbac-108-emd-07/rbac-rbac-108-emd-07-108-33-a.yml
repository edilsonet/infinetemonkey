section_title: Passageiro indisciplinado
subsection_id: a
cite: 108.33(a)
title: 108.33(a)
text: '(a) O operador aéreo deve garantir o controle de passageiro indisciplinado por meio
  das seguintes ações:

  (1) fazer constar no contrato de transporte aéreo a informação das medidas que serão tomadas
  pelo operador aéreo para coibir condutas típicas de passageiros indisciplinados;

  (2) impedir o embarque de passageiro indisciplinado, registrando tal ocorrência em relatório
  que deve ser anexado ao Despacho AVSEC do respectivo voo; e (Redação dada pela Resolução
  nº 500, de 12.12.2018)

  (3) desembarcar o passageiro indisciplinado no aeródromo mais apropriado, em função da avaliação
  realizada pelo comandante, levando-se em consideração o risco à segurança do voo.'
