title: 108.33(b)
text: (b) Se necessário, a fim de garantir o cumprimento das ações, o operador aéreo deve
  acionar o setor de segurança do aeródromo e a Polícia Federal ou, na sua ausência, o órgão
  de segurança pública responsável pelas atividades de polícia no aeródromo.
