cite: 108.55(a)
title: 108.55(a)
text: (a) O operador aéreo deve garantir que somente bagagens de tripulantes designados para
  voo e de passageiros identificados e de posse de contrato de transporte (bilhete aéreo)
  serão aceitas para despacho. (Redação dada pela Resolução nº 604, de 29.01.2021)
