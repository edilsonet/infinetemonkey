section_title: Identificação (conciliação) e aceitação da bagagem despachada
subsection_id: b
cite: 108.55(b)
title: 108.55(b)
text: (b) O operador aéreo deve identificar, no ato da aceitação, cada volume da bagagem a
  ser despachada, contendo dados (informações) que possibilitem o processo de reconciliação,
  utilizando formulários específicos para o controle de bagagens embarcadas e para a localização
  de bagagens embarcadas.
