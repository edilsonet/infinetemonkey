section_title: Identificação (conciliação) e aceitação da bagagem despachada
subsection_id: c
cite: 108.55(c)
title: 108.55(c)
text: '(c) A bagagem transferida, proveniente de outro operador aéreo, pode ser aceita caso
  tenha a identificação com as informações adequadas.

  (1) O operador aéreo que transfere a bagagem deve comunicar, previamente, as informações
  do passageiro e seus volumes transportados ao operador que receberá a bagagem.'
