section_title: Identificação (conciliação) e aceitação da bagagem despachada
subsection_id: d
cite: 108.55(d)
title: 108.55(d)
text: (d) O operador aéreo pode estabelecer procedimentos de despacho de bagagem em local
  diferente do balcão de despacho do aeródromo (despacho remoto), devendo, nesse caso, aplicar
  controles de segurança desde o ponto onde a bagagem é identificada e aceita para transporte
  até o momento em que é colocada a bordo da aeronave.
