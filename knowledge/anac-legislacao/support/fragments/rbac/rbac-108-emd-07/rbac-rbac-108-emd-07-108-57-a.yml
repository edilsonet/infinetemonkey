section_title: Proteção da bagagem despachada
subsection_id: a
cite: 108.57(a)
title: 108.57(a)
text: (a) O operador aéreo deve garantir a proteção da bagagem despachada desde o momento
  de sua aceitação até o momento em que é devolvida ao seu proprietário no destino ou transferida
  para outro operador aéreo. (Redação dada pela Resolução nº 604, de 29.01.2021)
