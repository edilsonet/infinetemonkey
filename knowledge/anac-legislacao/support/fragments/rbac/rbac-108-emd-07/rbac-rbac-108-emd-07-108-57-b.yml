section_title: Proteção da bagagem despachada
subsection_id: b
cite: 108.57(b)
title: 108.57(b)
text: (b) O operador aéreo deve assegurar, em coordenação com o operador do aeródromo, que
  o acesso às bagagens despachadas, às áreas de consolidação das bagagens despachadas e aos
  pontos de transferência das bagagens despachadas mantenha-se restrito ao pessoal autorizado
  e credenciado, e impedir que qualquer bagagem seja violada com a intenção de estar sujeita
  à introdução de materiais passíveis de serem utilizados para atos de interferência ilícita.
