section_title: Inspeção da bagagem despachada
subsection_id: a
cite: 108.59(a)
title: 108.59(a)
text: '(a) O operador aéreo deve realizar inspeção da bagagem despachada que parte de uma
  área restrita de segurança para seguir em voos internacionais, incluindo as bagagens em
  conexão e em trânsito, neste último caso somente se vierem a ser retiradas da aeronave durante
  a parada no aeródromo intermediário.

  (1) A bagagem despachada para seguir em voo internacional que tenha sido submetida a controle
  de segurança equivalente no aeródromo de origem não necessita ser novamente inspecionada
  no aeródromo de trânsito ou conexão, salvo no caso de suspeita em relação ao seu conteúdo.'
