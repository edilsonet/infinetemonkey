cite: 108.59(b)
title: 108.59(b)
text: '(b) O operador aéreo deve realizar inspeção da bagagem despachada que parte de uma
  área restrita de segurança para seguir em voos domésticos, conforme exigido pela ANAC por
  meio de DAVSEC.

  (1) Na base do operador aéreo em que a inspeção de segurança da bagagem despachada para
  seguir em voos domésticos passar a ser obrigatória, o operador aéreo deve iniciar a realização
  das inspeções em prazo máximo definido em DAVSEC.'
