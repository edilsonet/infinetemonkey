section_title: Inspeção da bagagem despachada
subsection_id: c
cite: 108.59(c)
title: 108.59(c)
text: (c) A inspeção da bagagem despachada deve ser realizada pelo operador aéreo por meios
  disponibilizados pelo operador de aeródromo ou, se preferível, por meios próprios, desde
  que atenda aos requisitos estabelecidos em normatização específica sobre a matéria e, ainda,
  esteja em constante coordenação com o operador do aeródromo.
