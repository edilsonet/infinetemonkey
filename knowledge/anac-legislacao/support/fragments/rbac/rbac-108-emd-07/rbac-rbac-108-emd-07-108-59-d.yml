section_title: Inspeção da bagagem despachada
subsection_id: d
cite: 108.59(d)
title: 108.59(d)
text: '(d) No caso de dúvida em relação ao conteúdo da bagagem despachada, após a inspeção
  de segurança, o proprietário deve ser requisitado para acompanhar, presencialmente ou por
  meio de imagens, a realização de inspeção manual de sua bagagem, sendo que:

  (1) caso o proprietário não compareça para acompanhar a inspeção manual da sua bagagem,
  esta deve ser considerada bagagem suspeita e processada como estabelecido na seção 108.67;
  e

  (2) caso haja suspeita da existência de materiais explosivos que são proibidos para o transporte
  aéreo como bagagem despachada, o operador aéreo deve manter a bagagem isolada e, em vez
  de requisitar a presença do proprietário, acionar o setor de segurança do aeródromo e a
  Polícia Federal ou, na sua ausência, o órgão de segurança pública responsável pelas atividades
  de polícia no aeródromo.

  (Redação dada pela Resolução nº 626, de 14.06.2021)'
