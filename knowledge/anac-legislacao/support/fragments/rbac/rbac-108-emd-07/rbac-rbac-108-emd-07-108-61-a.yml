section_title: Reconciliação do passageiro e da bagagem acompanhada
subsection_id: a
cite: 108.61(a)
title: 108.61(a)
text: '(a) O operador aéreo deve garantir que a bagagem acompanhada seja transportada somente
  com a confirmação de embarque do seu proprietário, inclusive nos casos de trânsito ou conexão.

  (1) No caso de o passageiro ou tripulante não embarcar ou desembarcar em uma escala anterior
  ao seu destino final, sua bagagem deve ser retirada da aeronave e submetida a controles
  de segurança, incluindo a inspeção de segurança.

  (Redação dada pela Resolução nº 604, de 29.01.2021)'
