section_title: Bagagem desacompanhada
subsection_id: b
cite: 108.63(b)
title: 108.63(b)
text: '(b) O operador aéreo deve garantir que a bagagem que de maneira não intencional venha
  a se tornar desacompanhada durante o seu processo de despacho, seja identificada como tal,
  inspecionada e protegida, antes de ser embarcada para transporte em uma aeronave.

  (1) Neste caso, a inspeção de segurança deve ser realizada de forma que garanta um nível
  de segurança maior que o de bagagem acompanhada.'
