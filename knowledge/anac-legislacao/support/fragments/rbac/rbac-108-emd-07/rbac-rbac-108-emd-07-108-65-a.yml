cite: 108.65(a)
title: 108.65(a)
text: (a) A bagagem extraviada deve ser identificada como tal e submetida a controles de segurança,
  incluindo inspeção de segurança, e o operador aéreo deve analisar as circunstâncias que
  causaram a separação.
