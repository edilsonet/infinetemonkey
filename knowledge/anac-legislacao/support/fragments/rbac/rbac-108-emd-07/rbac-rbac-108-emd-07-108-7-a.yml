cite: 108.7(a)
title: 108.7(a)
text: (a) Este Regulamento aplica-se ao operador aéreo cujas responsabilidades relacionadas
  à segurança da aviação civil contra atos de interferência ilícita estão atribuídas no artigo
  10 do Programa Nacional de Segurança da Aviação Civil contra Atos de Interferência Ilícita,
  aprovado pelo Decreto nº 11.195, de 8 de setembro de 2022. (Redação dada pela Resolução
  nº 729, de 24.01.2024)​
