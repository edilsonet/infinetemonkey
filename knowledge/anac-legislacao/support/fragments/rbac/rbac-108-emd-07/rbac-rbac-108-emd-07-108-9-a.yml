title: 108.9(a)
text: (a) Estabelecer os requisitos a serem aplicados pelos operadores aéreos para garantir
  a integridade de passageiros, tripulantes, pessoal de terra, público em geral, aeronaves
  e instalações de aeródromos, de forma a proteger as operações da aviação civil contra atos
  de interferência ilícita.
