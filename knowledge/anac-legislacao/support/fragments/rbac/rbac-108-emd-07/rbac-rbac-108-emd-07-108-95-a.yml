subsection_id: a
cite: 108.95(a)
title: 108.95(a)
text: '(a) O operador aéreo deve garantir que, nas atividades de armazenamento e transporte
  de provisões de bordo e de serviço de bordo em Áreas Restritas de Segurança (ARS), sejam
  aplicados controles de segurança que evitem a introdução de armas, explosivos, artefatos
  QBRN ou substâncias e materiais proibidos em alguma dessas fases.

  (Redação dada pela Resolução nº 604, de 29.01.2021)'
