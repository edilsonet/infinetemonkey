cite: 108.97(a)
title: 108.97(a)
text: (a) O operador aéreo deve garantir que as provisões de bordo e de serviço de bordo a
  serem embarcadas estejam corretamente destinadas àquela aeronave e que não tenham sido violadas,
  utilizando formulário específico para controle de provisões embarcadas.
