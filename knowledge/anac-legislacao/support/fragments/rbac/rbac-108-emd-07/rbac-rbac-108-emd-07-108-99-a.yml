cite: 108.99(a)
title: 108.99(a)
text: '(a) O operador aéreo deve garantir a realização da inspeção das provisões de bordo
  e de serviço de bordo no acesso às ARS ou implementar uma cadeia segura sobre esses insumos.

  (1) A cadeia segura é implementada por medidas que garantam que nas atividades de produção,
  armazenamento e transporte de provisões de bordo e de serviço de bordo sejam aplicados controles
  de segurança que evitem a introdução de armas, explosivos, artefatos QBRN ou substâncias
  e materiais proibidos em alguma dessas fases.

  (2) O reconhecimento da cadeia segura é formalizado por meio de auditoria interna inicial
  do operador aéreo e aprovação de PSESCA pelo operador de aeródromo, que devem abranger as
  atividades descritas no parágrafo 108.99(a)(1).

  (Redação dada pela Resolução nº 604, de 29.01.2021)'
