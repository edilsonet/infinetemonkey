cite: 110.1(a)
title: 110.1(a)
text: '(a)Este regulamento se aplica a:

  (1) operadores de aeródromos que executam atividade AVSEC listada no Apêndice A deste Regulamento,
  segundo requisito presente em regulamentação específica da ANAC;

  (2) operadores aéreos que executam atividade AVSEC listada no Apêndice A deste Regulamento,
  segundo requisito presente em regulamentação específica da ANAC;

  (3) agentes de carga aérea acreditados que executam atividade AVSEC listada no Apêndice
  A deste Regulamento, segundo requisito presente em regulamentação específica da ANAC;

  (4) centros de instrução; e

  (5) profissionais AVSEC.'
