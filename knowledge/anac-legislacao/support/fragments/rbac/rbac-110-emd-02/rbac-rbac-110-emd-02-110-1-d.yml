title: 110.1(d)
text: '(d) A organização deste Regulamento está segmentada conforme a aplicabilidade para
  os entes envolvidos, conforme segue:

  (1) Subparte A - Generalidades: aplica-se aos operadores de aeródromos, operadores aéreos,
  agentes de carga aérea acreditados, centros de instrução e profissionais AVSEC;

  (2) Subparte B - Requisitos de Capacitação de Profissionais que Realizam Atividade AVSEC:
  aplica-se aos operadores de aeródromos, operadores aéreos, agentes de carga aérea acreditados,
  centros de instrução e profissionais AVSEC;

  (3) Subparte C - Responsabilidades dos Centros de Instrução: aplica-se aos centros de instrução;

  (4) Subparte D - Responsabilidades das Organizações com Responsabilidade AVSEC: aplica-se
  aos operadores de aeródromos, operadores aéreos e agentes de carga aérea acreditados;

  (5) Subparte E - Fiscalização, Consequências e Sanções Administrativas: aplica-se aos operadores
  de aeródromos, operadores aéreos, agentes de carga aérea acreditados, centros de instrução
  e profissionais AVSEC; e

  (6) Subparte F - Disposições Finais e Transitórias: aplica-se aos centros de instrução e
  profissionais AVSEC.'
