cite: 110.101(a)
title: 110.101(a)
text: '(a) Os centros de instrução homologados segundo a Resolução nº 63, de 26 de novembro
  de 2008, ficam autorizados a ministrar cursos AVSEC de acordo com as regras daquela Resolução
  pelo prazo de até 18 (dezoito) meses após a entrada em vigor deste Regulamento.

  (1) Os centros de instrução devem observar a validade de sua homologação, caso esta termine
  antes do prazo mencionado no parágrafo anterior.'
