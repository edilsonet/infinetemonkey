title: 110.101(b)
text: (b) Os processos de solicitação ou de renovação de homologação de centro de instrução
  nas regras da Resolução nº 63, de 2008, poderão ser finalizados segundo os preceitos constantes
  da citada Resolução, desde que protocolados antes da data de entrada em vigor deste Regulamento.
