cite: 110.101(e)
title: 110.101(e)
text: '(e) Permanecem válidas as certificações de profissionais emitidas em consonância com
  a Resolução nº 63, de 2008.

  (1) As certificações e cursos da Resolução nº 63, de 2008, cujas validades sejam inferiores
  a dois anos e que se encontrem dentro da validade no dia da entrada em vigor deste Regulamento,
  terão sua vigência ampliada para dois anos, acompanhando a duração da validade dos cursos
  correspondentes conforme tabela de equivalência 110.101-1.

  (2) As certificações e cursos da Resolução nº 63, de 2008, cujas validades sejam inferiores
  a dois anos e que sejam realizadas após a entrada em vigor deste Regulamento, passam a adotar
  prazo de validade de dois anos, acompanhando a validade dos cursos correspondentes conforme
  tabela de equivalência 110.101-1.

  (3) O prazo de validade dessas certificações ficará estendido até o último dia do mês de
  seu vencimento.'
