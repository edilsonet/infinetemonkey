cite: 110.101(f)
title: 110.101(f)
text: (f) Para os profissionais certificados que já desempenham atividade AVSEC, será aceita
  a matrícula no curso de Atualização em centro de instrução homologado segundo a Resolução
  nº 63, de 2008, ou em centro de instrução autorizado segundo este Regulamento, conforme
  equiparações entre as certificações constantes na Tabela 110.101-1.
