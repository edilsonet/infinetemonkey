text: '(g) As certificações e cursos AVSEC previstos na Resolução nº 63, de 2008, que são
  mencionados em outros regulamentos da ANAC devem ser substituídos de acordo com a equivalência
  da tabela 110.101-1.

  Tabela 110.101-1 Equiparação entre Certificações em cursos AVSEC previstos na Resolução
  nº 63 e neste Regulamento para fins de atualização.

