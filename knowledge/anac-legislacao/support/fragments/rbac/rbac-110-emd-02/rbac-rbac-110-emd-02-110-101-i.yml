title: 110.101(i)
text: (i) Os requisitos de escolaridade referentes à matrícula nos cursos AVSEC da Resolução
  nº 63, de 2008, devem ser substituídos pelos requisitos de escolaridade deste Regulamento,
  obedecendo a equiparação da tabela 110.101-1, a partir da entrada em vigor deste Regulamento.
