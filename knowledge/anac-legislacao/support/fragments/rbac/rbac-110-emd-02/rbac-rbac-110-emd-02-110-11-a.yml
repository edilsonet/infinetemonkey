section_title: Requisitos para desempenho de atividades AVSEC
subsection_id: a
cite: 110.11(a)
title: 110.11(a)
text: '(a) As organizações com responsabilidade AVSEC e o centro de instrução somente poderão
  designar profissional para realizar atividades AVSEC que atendam aos seguintes requisitos:

  (1) Passem por processo de seleção que contemple, no mínimo: verificação do perfil e capacidade
  para desempenho das atividades AVSEC, verificação da maioridade penal e avaliação de antecedentes.'
