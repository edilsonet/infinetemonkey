cite: 110.15(a)
title: 110.15(a)
text: (a) As certificações em cursos AVSEC habilitam o profissional a realizar as atividades
  listadas na tabela do Apêndice A deste Regulamento. Para desempenhá-las em território brasileiro
  ou em espaço aéreo sobre este território, o profissional deve possuir, pelo menos, uma das
  certificações da tabela correspondentes à atividade que pretende exercer.
