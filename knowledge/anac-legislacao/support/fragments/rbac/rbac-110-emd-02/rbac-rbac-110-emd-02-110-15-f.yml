cite: 110.15(f)
title: 110.15(f)
text: (f) Os tripulantes de aeronave com matrícula estrangeira que possuam treinamento em
  AVSEC reconhecido pela autoridade de aviação civil do país de origem ficam isentos da certificação
  de AVSEC para Tripulantes, quando atuarem em operações internacionais.
