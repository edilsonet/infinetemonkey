section_title: Atualização da certificação em Segurança da Aviação Civil - AVSEC
subsection_id: b
cite: 110.17(b)
title: 110.17(b)
text: (b) A Atualização em Inspeção de Segurança da Aviação Civil fica condicionada ao prazo
  mínimo de 180 (cento e oitenta) dias de efetiva prestação de serviço de inspeção para fins
  de cumprimento do Treinamento em Serviço, nos termos do item 110.71(h)(3)(i).
