section_title: Atualização da certificação em Segurança da Aviação Civil - AVSEC
subsection_id: i
cite: 110.17(i)
title: 110.17(i)
text: '(i) A matrícula em curso de Atualização só deve ser realizada para alunos que possuírem
  o respectivo curso de Formação ou Atualização válido até o primeiro dia do curso de Atualização
  pleiteado.

  (2) Caso a validade da certificação expire e o profissional pretenda realizar atividade
  AVSEC, é necessário realizar novo curso de Formação correspondente.'
