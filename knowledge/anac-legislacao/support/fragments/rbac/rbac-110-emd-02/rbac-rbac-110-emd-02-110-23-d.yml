cite: 110.23(d)
title: 110.23(d)
text: '(d) O centro de instrução poderá ministrar cursos AVSEC na modalidade presencial, semipresencial
  ou a distância, desde que tais modalidades estejam previstas no MPCI aprovado pela ANAC.

  (1) O curso de Formação ou Atualização em Inspeção de Segurança da Aviação Civil deve ser
  realizado obrigatoriamente na modalidade presencial.'
