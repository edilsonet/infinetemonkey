section_title: Validade da autorização do centro de instrução
subsection_id: a
cite: 110.25(a)
title: 110.25(a)
text: '(a) O centro de instrução que deixar de ministrar curso AVSEC por mais de 12 (doze)
  meses terá sua autorização automaticamente revogada.

  (1) Caso a autorização seja revogada, o centro de instrução que desejar voltar a operar
  deverá iniciar novamente o processo de autorização de centro de instrução.'
