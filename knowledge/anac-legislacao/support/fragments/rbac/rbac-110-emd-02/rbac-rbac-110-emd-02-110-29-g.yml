section_title: Requerimento de autorização de centro de instrução
subsection_id: g
cite: 110.29(g)
title: 110.29(g)
text: (g) O centro de instrução que optar por alterar quaisquer dos elementos elencados nos
  parágrafos 110.29(b)(1) a 110.29(b)(4), após autorização da ANAC, deverá apresentar previamente
  à ANAC somente as alterações pretendidas, para aprovação, obedecendo aos mesmos prazos de
  análise e resposta.
