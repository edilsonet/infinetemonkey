section_title: Requerimento de autorização de centro de instrução
subsection_id: i
cite: 110.29(i)
title: 110.29(i)
text: '(i) O conteúdo do material instrucional não será objeto de análise prévia para autorização
  do centro de instrução.

  (ii) A ANAC fiscalizará o cumprimento das exigências do item 110.35(b) durante as atividades
  de fiscalização e controle de qualidade, podendo solicitar o envio do material instrucional
  utilizado nos cursos AVSEC a qualquer tempo.'
