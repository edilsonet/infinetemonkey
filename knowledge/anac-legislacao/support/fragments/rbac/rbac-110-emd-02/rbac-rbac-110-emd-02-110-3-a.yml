cite: 110.3(a)
title: 110.3(a)
text: '(a) Para os efeitos deste Regulamento, aplicam-se as definições estabelecida no Regulamento
  Brasileiro da Aviação Civil nº 01 − RBAC 01; no Decreto nº 7.168, de 5 de maio de 2010,
  que dispõe sobre o Programa Nacional de Segurança da Aviação Civil contra Atos de Interferência
  Ilícita; na Lei nº 7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro
  da Aeronáutica; e as seguintes:

  (1)

  Atividade AVSEC

  significa a atividade relacionada à AVSEC ou cuja finalidade é garantir a AVSEC, conforme
  discriminado na tabela do Apêndice A deste Regulamento;

  (2)

  Autorização de Centro de Instrução (ACI)

  significa a autorização da ANAC para o centro de instrução ministrar determinados cursos
  AVSEC, após verificação do atendimento aos requisitos deste Regulamento;

  (3)

  Avaliação de Antecedentes

  significa a identificação e verificação social de uma pessoa, incluindo verificação de experiência
  prévia e de antecedentes criminais, com objetivo de avaliar a idoneidade de um indivíduo
  para implementação de controle de segurança, para acesso desacompanhado a uma área restrita
  de segurança

  e para as pessoas que solicitem e tenham a necessidade de acesso a informações classificadas
  como informação restrita de AVSEC;

  (Redação dada pela Resolução nº 730, de 24.01.2024)

  (4)

  Avaliação de Desempenho

  significa a avaliação teórica ou teórica e prática que mede o desempenho do aluno, a fim
  de verificar o alcance dos objetivos propostos por um evento de capacitação;

  (5)

  Carga Horária

  significa o total de horas-aula teóricas ou práticas de qualquer atividade de instrução
  AVSEC;

  (6)

  Centro de Instrução

  significa uma organização que possui autorização emitida pela ANAC segundo este Regulamento
  para fornecer treinamento de cursos AVSEC e conduzir certificação de profissional que desempenha
  atividade AVSEC;

  (7)

  Certificação AVSEC

  significa a avaliação dos critérios definidos em regulamento que resultam em uma confirmação,
  concedida pela ANAC ou em nome da Agência, de que uma pessoa possui as competências necessárias
  para desempenhar as atividades AVSEC em um nível aceitável, conforme definido em regulamento
  específico da ANAC;

  (8)

  Certificado AVSEC

  significa o documento concedido pela ANAC ao profissional AVSEC que comprova sua aprovação
  na certificação AVSEC e o habilita para o desempenho de atividade AVSEC, condicionado ao
  êxito nos critérios de aprovação previstos neste regulamento;

  (9)

  Conteúdo Programático

  significa a lista de conhecimentos a serem abordados em um determinado curso;

  (10)

  Dispositivo Explosivo Improvisado

  significa a ameaça que apresenta formatos diversos e contém carga explosiva, detonador,
  fonte de energia e dispositivo de acionamento;

  (11)

  Ensino a Distância

  significa a modalidade de ensino na qual os alunos e os instrutores estão separados fisicamente,
  tendo sua interação mediada por recursos tecnológicos ou por correspondência;

  (12)

  Ensino Presencial

  significa a modalidade de ensino ministrada com a presença de instrutor e com a participação
  dos alunos em sala de aula;

  (13)

  Ensino Semipresencial

  significa a modalidade de ensino que conjuga estratégias de ensino presencial e de ensino
  a distância, a fim de compor uma ação de capacitação;

  (14)

  Grade Curricular

  significa a distribuição da carga horária para cada item do conteúdo programático;

  (15)

  Grade Horária ou Programação Semanal

  significa o calendário de realização de curso que contém a data e horário de cada item do
  conteúdo programático, bem como da primeira e segunda chamadas de avaliações de desempenho;

  (16)

  Hora-Aula

  significa a unidade de medida do tempo de instrução com duração de 50 (cinquenta) minutos;

  (17)

  Imprevisibilidade

  significa a implementação de medida de segurança com frequências irregulares, em diferentes
  locais ou utilizando meios variados, de acordo com um marco definido, com o objetivo de
  aumentar sua eficácia e seu efeito dissuasivo;

  (18)

  Instrutor AVSEC

  significa o profissional com certificação de Instrutor AVSEC, habilitado para ministrar
  cursos AVSEC presenciais ou para acompanhar cursos semipresenciais ou a distância;

  (18)-I

  Informação Restrita de

  AVSEC

  (IRA)

  significa

  uma informação cuja divulgação ao público em geral, de forma não controlada, pode ser prejudicial
  ao sistema de segurança contra atos de interferência ilícita, e que deve se manter restrita
  às pessoas que necessitam da informação para desempenhar suas atividades laborais, em especial,
  àqueles profissionais que atuam no ambiente aeroportuário e possuem responsabilidades AVSEC
  atribuídas pela legislação e regulamentação.

  (Incluído pela Resolução nº 730, de 24.01.2024)

  ​

  (19)

  Material Instrucional

  significa o material elaborado para um curso AVSEC, que pode incluir programas instrucionais
  informatizados, manuais de treinamento, apostilas, slides e demais recursos pedagógicos
  utilizados para o mesmo fim;

  (20)

  Organização com responsabilidade AVSEC

  significa o grupo de entidades com responsabilidades definidas em regulamentos AVSEC específicos
  da ANAC, incluindo operadores de aeródromos, operadores aéreos e agentes de carga aérea
  acreditados;

  (21)

  Plano de Aula

  significa o documento produzido pelo responsável técnico do centro de instrução, devendo
  conter orientações técnicas e didáticas do processo de ensino de cada aula, buscando direcionar
  a atuação do instrutor;

  (22)

  Profissional AVSEC

  significa a pessoa física que desempenha as atividades AVSEC descritas no Apêndice A, nos
  termos deste Regulamento;

  (23)

  Reciclagem

  significa uma atividade prática conduzida por organização com responsabilidade AVSEC para
  o profissional que desempenha atividade em seu benefício que busca enfatizar conhecimentos
  e técnicas identificados como frágeis em atividade de fiscalização ou de controle de qualidade
  realizada pela ANAC ou pela organização com responsabilidade AVSEC;

  (24)

  Regulamento do Curso

  significa o conjunto de normas que regula a atuação do aluno na instituição de ensino e
  apresenta as regras de realização de um curso;

  (25)

  Revalidação de Certificação

  significa a avaliação de desempenho realizada pela ANAC, que busca ratificar a certificação
  AVSEC do profissional, quando motivada por denúncias e possíveis irregularidades identificadas
  na fiscalização relativas à fraude, ilícito ou descumprimento deste regulamento;

  (26)

  Seleção

  significa o processo de escolha de um indivíduo, dentre os candidatos a um contrato de trabalho,
  que determina o indivíduo mais adequado ao exercício das atividades inerentes ao cargo,
  contemplando no mínimo a verificação do perfil e capacidade para desempenho das atividades
  AVSEC, a verificação da maioridade penal e a aprovação no processo de avaliação de antecedentes;

  (27)

  Testes aleatórios de identificação de ameaças

  significa uma simulação de ameaça no canal de inspeção que busca avaliar a capacidade do
  profissional AVSEC em identificá-la, podendo utilizar sistema simulador de equipamento de
  raios-X,

  threat image projection

  (TIP), simulacro ou outros meios;

  (28)

  Testes de controle de qualidade

  significa a simulação de ato de interferência ilícita para verificação da eficiência e da
  eficácia das medidas de segurança existentes;

  (29)

  Treinamento em serviço

  significa uma etapa da certificação em Inspeção de Segurança da Aviação Civil, com propósito
  de orientar e avaliar o profissional em relação às suas habilidades e conhecimentos no desempenho
  de atividade AVSEC em ambiente operacional; e

  (30)

  Turma de Curso AVSEC

  significa evento de capacitação composto por um ou mais alunos com o objetivo de obter certificação
  AVSEC.'
