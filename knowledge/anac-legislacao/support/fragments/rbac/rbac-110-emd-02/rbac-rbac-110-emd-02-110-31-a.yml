cite: 110.31(a)
title: 110.31(a)
text: '(a) O responsável técnico deve compartilhar com o representante legal a intermediação
  com a ANAC e deve desempenhar, no mínimo, as seguintes atividades: produzir a grade curricular
  dos cursos AVSEC e os planos de aula; avaliar se os materiais instrucionais estão condizentes
  com os critérios técnicos e boas práticas pedagógicas vigentes, aprovando-os; supervisionar
  e orientar os instrutores quanto aos regulamentos vigentes e técnicas AVSEC e pedagógicas
  atuais; criar metodologia e operacionalizar a melhoria da qualidade da instrução ministrada;
  validar os resultados das certificações dos alunos e analisar recursos interpostos pelos
  alunos.'
