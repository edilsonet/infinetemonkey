cite: 110.31(d)
title: 110.31(d)
text: '(d) O centro de instrução é responsável por garantir que somente pessoa que assinou
  termo de responsabilidade aplique a avaliação de desempenho e conduza os recursos.

  (1) A aplicação da avaliação de desempenho e a condução dos recursos deve ser realizada
  prioritariamente pelo instrutor que ministrou o curso AVSEC e que assinou termo de responsabilidade,
  podendo haver indicação de outros profissionais que tenham assinado termo de responsabilidade,
  para os casos de impossibilidade.'
