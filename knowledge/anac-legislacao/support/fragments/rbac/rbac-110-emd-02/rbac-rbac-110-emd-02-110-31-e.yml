cite: 110.31(e)
title: 110.31(e)
text: '(e) As turmas de cursos AVSEC semipresenciais e a distância devem ser acompanhadas
  por profissional com certificação de Instrutor AVSEC válida durante o período de vigência
  da turma de curso AVSEC, não havendo necessidade de ser o mesmo instrutor que produziu o
  material instrucional do curso para o Centro de Instrução.

  (1) O acompanhamento dos instrutores AVSEC nos cursos semipresencial e a distância objetiva
  organizar o curso e promover a orientação e a interação dos alunos, a fim de auxiliar na
  construção do conhecimento e no esclarecimento de dúvidas.'
