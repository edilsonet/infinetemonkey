cite: 110.31(f)
title: 110.31(f)
text: '(f) É vedado ao Instrutor AVSEC exercer, qualquer das atividades previstas neste Regulamento,
  após período de afastamento superior a 365 dias corridos. (

  Incluído pela Resolução nº 638, de 07.10.2021

  )

  (1) Entende-se por afastamento o período em que o Instrutor AVSEC não desempenha suas funções
  nos limites de sua certificação;

  (2) O prazo descrito no parágrafo (f) desta Seção terá início no primeiro dia após a data
  do último exercício da atividade de Instrutor AVSEC;

  (3) Na hipótese do afastamento por prazo superior ao previsto no parágrafo (f) desta Seção,
  o Instrutor AVSEC deverá realizar treinamento, na forma estabelecida pela ANAC, visando
  a retomada das competências necessárias para exercício de suas atividades com segurança.'
