cite: 110.39(d)
title: 110.39(d)
text: '(d) A ANAC poderá disponibilizar modelo de MPCI aos centros de instrução.

  (1) No MPCI submetido à ANAC, o centro de instrução deverá apresentar somente os procedimentos
  que diferirem do modelo disponibilizado pela ANAC, assumindo a implementação dos demais
  procedimentos conforme descrição do modelo.

  EDIÇÕES DE CURSOS AVSEC'
