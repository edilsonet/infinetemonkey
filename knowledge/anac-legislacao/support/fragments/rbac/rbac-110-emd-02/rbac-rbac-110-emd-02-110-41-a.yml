cite: 110.41(a)
title: 110.41(a)
text: '(a) O centro de instrução deve informar à ANAC a realização de cada turma de curso
  AVSEC a ser ministrada, com no mínimo 15 (quinze) dias de antecedência, encaminhando o registro
  do curso, o qual deve conter estimativa de quantidade de alunos; nome(s) do(s) instrutor(es)
  AVSEC previsto(s) para ministrar o curso, responsável pela aplicação da avaliação de desempenho
  e acompanhamento dos recursos; endereço de realização e turno para curso presencial ou semipresencial.

  (1) Em caso de força maior, sob justificativa apresentada e aprovada pela ANAC, o centro
  de instrução poderá alterar os dados citados no item 110.41 (a) ou realizar o aviso de curso
  em prazo menor que 15 (quinze) dias.'
