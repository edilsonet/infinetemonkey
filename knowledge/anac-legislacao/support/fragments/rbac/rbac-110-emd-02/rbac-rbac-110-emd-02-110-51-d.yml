cite: 110.51(d)
title: 110.51(d)
text: (d) A ANAC produzirá o conteúdo das avaliações de desempenho teóricas e o centro de
  instrução conduzirá a aplicação dessas avaliações de desempenho, informando a ANAC dos resultados
  obtidos pelos alunos em conformidade com as regras deste Regulamento.
