cite: 110.51(g)
title: 110.51(g)
text: (g) Para o curso de Formação em Inspeção de Segurança da Aviação Civil, o centro de
  instrução deve emitir declaração ao profissional após conclusão das partes teórica e prática
  do centro de instrução, habilitando-o para o início do Treinamento em Serviço.
