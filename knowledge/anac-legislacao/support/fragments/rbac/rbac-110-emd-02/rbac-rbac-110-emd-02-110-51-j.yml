section_title: Responsabilidade na certificação em Segurança da Aviação Civil - AVSEC
subsection_id: j
cite: 110.51(j)
title: 110.51(j)
text: '(j) A ANAC poderá validar a certificação emitida por outro Estado signatário da Convenção
  de Aviação Civil Internacional, desde que haja comprovação de que o aluno tenha passado
  por um processo de instrução equivalente, conforme este Regulamento.

  (1) A validação se dará apenas nos casos em que houver equiparação entre a atividade AVSEC
  realizada no país de origem e no Brasil.

  (2) Nos casos referidos neste item, a ANAC poderá emitir certificado condicionado à aprovação
  em avaliação de desempenho aplicada pela Agência.'
