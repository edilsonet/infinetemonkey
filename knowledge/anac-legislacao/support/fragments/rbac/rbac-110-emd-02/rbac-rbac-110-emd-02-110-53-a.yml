cite: 110.53(a)
title: 110.53(a)
text: '(a) Nas avaliações de desempenho teórico das certificações AVSEC, o centro de instrução
  deverá utilizar provas indicadas pela ANAC.

  (1) O centro de instrução deve guardar e garantir o sigilo das questões das provas enviadas
  pela ANAC, disponibilizando-as aos alunos apenas durante a aplicação da avaliação de desempenho
  e durante a elaboração de recursos, em ambiente controlado.'
