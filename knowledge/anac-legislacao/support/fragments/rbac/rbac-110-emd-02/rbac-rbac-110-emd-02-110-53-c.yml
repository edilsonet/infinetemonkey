cite: 110.53(c)
title: 110.53(c)
text: '(c) O centro de instrução deverá produzir e encaminhar à ANAC questões inéditas de
  avaliações de desempenho, quando solicitado pela Agência.

  (1) O pedido da ANAC ficará limitado a 20 (vinte) questões por curso no período de um ano.

  (2) Após a solicitação da ANAC, o centro de instrução terá o prazo de 90 (noventa) dias
  para o encaminhamento das questões.

  (3) As questões devem abordar os conteúdos programáticos dos cursos e atender a legislação
  técnica vigente.'
