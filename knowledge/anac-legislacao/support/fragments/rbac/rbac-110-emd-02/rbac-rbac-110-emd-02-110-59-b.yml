section_title: Garantia da idoneidade da avaliação de desempenho e elaboração de recursos
subsection_id: b
cite: 110.59(b)
title: 110.59(b)
text: '(b) O centro de instrução deve garantir a presença do profissional responsável pela
  aplicação de avaliação de desempenho e pelo processo de interposição de recurso, em tempo
  integral em sala de aula.

  (1) O referido profissional deve assinar termo de responsabilidade de suas atribuições,
  antes da execução da aplicação de avaliação de desempenho e do processo de interposição
  de recurso, de forma a garantir a idoneidade do processo.'
