section_title: Garantia da idoneidade da avaliação de desempenho e elaboração de recursos
subsection_id: c
cite: 110.59(c)
title: 110.59(c)
text: '(c) O centro de instrução deverá estabelecer regras que garantam a conduta ética dos
  alunos, o sigilo do conteúdo das avaliações de desempenho e a idoneidade do processo de
  avaliação.

  (1) O centro de instrução reprovará automaticamente o aluno que adotar qualquer atitude
  que desrespeite as regras da avaliação de desempenho ou perturbe, de qualquer modo, a ordem
  dos trabalhos ou utilize meios ilícitos.

  DOCUMENTAÇÃO DO CENTRO DE INSTRUÇÃO'
