cite: 110.61(b)
title: 110.61(b)
text: '(b) O centro de instrução deverá emitir declaração de participação em curso AVSEC para
  os alunos que a requererem, no prazo máximo de até 10 (dez) dias após a solicitação.

  (1) A declaração de participação em curso AVSEC produzida pelo centro de instrução serve
  apenas para comprovação de participação no respectivo curso e para comprovação das horas
  de capacitação ao empregador, não tendo efeito para fins de comprovação de aprovação na
  certificação AVSEC.'
