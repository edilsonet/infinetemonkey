section_title: Registros do centro de instrução
subsection_id: b
cite: 110.63(b)
title: 110.63(b)
text: '(b) O centro de instrução deve manter arquivado por no mínimo 5 (cinco) anos os seguintes
  registros relativos a cada turma de curso AVSEC:

  (1) documentos comprobatórios de atendimento aos requisitos de matrícula de cada aluno,
  conforme especificações deste Regulamento;

  (2) grade horária;

  (3) grade curricular;

  (4) comprovação de recebimento pelos alunos do regulamento do curso e materiais instrucionais
  pertinentes;

  (5) registro de frequência dos alunos;

  (6) cópia das avaliações de desempenho aplicadas e folhas de respostas dos alunos;

  (7) declarações emitidas por centro de instrução que contenham os alunos aprovados em curso
  de Formação em Inspeção de Segurança da Aviação Civil, habilitando-os para o início do Treinamento
  em Serviço;

  (8) fichas de avaliações do Treinamento em Serviço emitidas por organização com responsabilidade
  AVSEC, para o curso de Formação e Atualização em Inspeção de Segurança da Aviação Civil;

  (9) termos de responsabilidade dos aplicadores de avaliações de desempenho e de recursos;

  (10) formulários das interposições de recursos às avaliações de desempenho, incluindo as
  respostas do responsável técnico; e

  (11) registros das ações de melhoria de qualidade da instrução ministrada.'
