section_title: Responsabilidade pela proficiência do profissional
subsection_id: a
cite: 110.69(a)
title: 110.69(a)
text: '(a) A organização com responsabilidade AVSEC deve garantir que o profissional que desempenhe
  atividade AVSEC em seu benefício possua a proficiência na execução das atividades AVSEC
  previstas no Apêndice A deste Regulamento.

  (1) A proficiência compreende a certificação válida, que habilita o profissional para o
  desempenho das atividades AVSEC em conformidade com o Apêndice A deste Regulamento, e a
  execução de procedimentos conforme regulamentos da ANAC e programas de segurança específicos.'
