cite: 110.71(b)
title: 110.71(b)
text: (b) A organização com responsabilidade AVSEC deve garantir um Treinamento em Serviço
  ao profissional que desempenha atividade AVSEC vinculada à certificação em Inspeção de Segurança
  da Aviação Civil em suas instalações.
