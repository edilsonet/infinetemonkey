cite: 110.71(f)
title: 110.71(f)
text: (f) A organização com responsabilidade AVSEC deve entregar a ficha de avaliação ao profissional,
  em até 10 (dez) dias após o término do Treinamento em Serviço, para prosseguimento da sua
  certificação no centro de instrução.
