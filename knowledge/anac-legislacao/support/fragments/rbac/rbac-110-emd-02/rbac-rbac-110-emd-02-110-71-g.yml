subsection_id: g
cite: 110.71(g)
title: 110.71(g)
text: '(g) Para o curso de Formação da Inspeção de Segurança da Aviação Civil, o Treinamento
  em Serviço deve atender aos seguintes requisitos:

  (1) iniciar somente após o aluno comprovar, por meio de declaração expedida pelo centro
  de instrução, que atendeu aos critérios de aprovação 1 e 2 do Curso de Formação e Atualização
  em Inspeção de Segurança em Aviação Civil, constantes no Apêndice B;

  (2) ocorrer durante os 30 (trinta) primeiros dias de trabalho efetivo, após a declaração
  expedida pelo centro de instrução;

  (3) ser concluído no prazo máximo de 12 (doze) meses após a emissão da declaração do centro
  de instrução; e

  (4) A organização com responsabilidade AVSEC que possuir profissionais realizando Treinamento
  em Serviço referente à certificação de Formação em Inspeção de Segurança da Aviação Civil
  deve comprovar a situação por meio da apresentação dos seguintes documentos: declaração
  do centro de instrução datada e com a aprovação na primeira etapa da referida certificação
  e documento que comprove a data de início da relação de trabalho, de forma a comprovar o
  atendimento aos prazos citados neste item.'
