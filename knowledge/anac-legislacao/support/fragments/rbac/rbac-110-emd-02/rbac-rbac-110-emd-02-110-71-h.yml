subsection_id: h
cite: 110.71(h)
title: 110.71(h)
text: '(h) Para o curso de Atualização em Inspeção de Segurança da Aviação Civil, o Treinamento
  em Serviço deve atender aos seguintes requisitos:

  (1) anteceder à matrícula no centro de instrução para o curso de Atualização em Inspeção
  de Segurança da Aviação Civil;

  (2) iniciar logo após à obtenção da certificação em Formação ou Atualização em Inspeção
  da Aviação Civil e à efetiva prestação de serviço de inspeção para organização com responsabilidade
  AVSEC;

  (3) Ocorrer durante o período de validade da certificação vigente;'
