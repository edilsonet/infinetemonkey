section_title: Treinamento em Serviço para profissionais que desempenham atividade de inspeção
  de segurança da aviação civil
subsection_id: i
cite: 110.71(i)
title: 110.71(i)
text: '(i) Para fins de atualização, o prazo mínimo para conclusão do Treinamento em Serviço
  é de 180 (cento e oitenta) dias de efetiva prestação de serviço de inspeção.

  (ii) Caso o profissional AVSEC mude de organização com responsabilidade AVSEC para quem
  presta serviço de inspeção, a ficha de avaliação do Treinamento em Serviço deve ser emitida
  pela organização na qual a prestação de serviço possua maior duração relativa à certificação
  vigente, não sendo o período de avaliação inferior a 180 (cento e oitenta) dias.

  (iii) Caso o profissional AVSEC não atenda ao prazo mínimo de 180 (cento e oitenta) dias
  de prestação de serviço de inspeção ao longo da vigência de sua certificação em Inspeção
  de Segurança da Aviação Civil, esse profissional não receberá a ficha de avaliação para
  fins de Atualização da certificação AVSEC, podendo realizar novo curso de Formação.

  (4) Ser concluída no prazo máximo de 24 (vinte e quatro) meses, com a emissão da ficha de
  avaliação pela organização com responsabilidade AVSEC que ateste o “apto” ou “não-apto”
  de acordo com os critérios de avaliação definidos no item 110.71(e).'
