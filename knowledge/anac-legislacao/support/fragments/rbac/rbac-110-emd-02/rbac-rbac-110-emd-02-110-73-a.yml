cite: 110.73(a)
title: 110.73(a)
text: (a) As organizações com responsabilidade AVSEC devem prover reciclagem do profissional
  que desempenhe atividade em seu benefício e que não demonstre proficiência durante atividade
  de fiscalização ou de controle de qualidade realizada pela ANAC ou por organização com responsabilidade
  AVSEC.
