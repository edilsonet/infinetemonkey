title: 110.73(b)
text: (b) A reciclagem consiste em uma atividade prática que busca enfatizar os conhecimentos
  e técnicas que foram identificados como frágeis em atividade de fiscalização ou de controle
  de qualidade realizada pela ANAC ou por organização com responsabilidade AVSEC.
