section_title: Plano de Instrução AVSEC (PIAVSEC)
subsection_id: a
cite: 110.77(a)
title: 110.77(a)
text: '(a) As organizações com responsabilidade AVSEC são responsáveis pelo desenvolvimento
  e manutenção dos respectivos Programas de Instrução que poderão fazer parte dos seus programas
  de segurança específicos.

  (1) A ANAC aprovará os PIAVSEC durante a avaliação dos programas de segurança específicos
  de cada ente do sistema da aviação civil.'
