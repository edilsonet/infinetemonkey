cite: 110.91(b)
title: 110.91(b)
text: (b) A ANAC poderá reaplicar a avaliação de desempenho para profissional AVSEC, com objetivo
  de revalidar a certificação AVSEC do profissional, quando motivada por irregularidades identificadas
  na fiscalização ou denúncias relativas à fraude, ilícito ou descumprimento deste Regulamento.
