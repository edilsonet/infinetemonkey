cite: 110.91(c)
title: 110.91(c)
text: (c) O centro de instrução, a organização com responsabilidade AVSEC e o profissional
  com certificação AVSEC prevista neste Regulamento devem disponibilizar todo e qualquer registro
  de instrução ou certificação requerido pela ANAC para fins de comprovação ou verificação
  de cumprimento dos requisitos normativos.
