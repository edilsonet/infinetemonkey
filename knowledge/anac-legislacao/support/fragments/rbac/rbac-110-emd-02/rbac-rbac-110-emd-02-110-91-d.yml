text: (d) O centro de instrução, a organização com responsabilidade AVSEC e o profissional
  com certificação AVSEC devem facilitar o acesso dos inspetores à documentação, equipamentos,
  pessoas e instalações quando estiverem realizando ações de fiscalização ou de controle de
  qualidade.
