cite: 110.95(a)
title: 110.95(a)
text: (a) Nos termos do art. 299, inciso I, da Lei nº 7.565, de 1986, o profissional AVSEC
  e o instrutor AVSEC que se utilizarem de meios ilícitos ou atuarem em desacordo com este
  Regulamento no que se refere ao processo de certificação, poderão ter todas as suas certificações
  AVSEC cassadas.
