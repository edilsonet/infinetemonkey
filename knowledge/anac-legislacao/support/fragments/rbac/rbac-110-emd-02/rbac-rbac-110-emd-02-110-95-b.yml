title: 110.95(b)
text: (b) O profissional AVSEC que, comprovadamente, deixar de atender aos requisitos para
  desempenho da atividade AVSEC, em momento posterior à obtenção da certificação, poderá ter
  todas as suas certificações AVSEC cassadas.
