  SIM

  (1) Para desempenhar as atividades da tabela, é necessário que o profissional possua

  pelo menos uma

  das certificações correspondentes, não necessitando possuir todas as certificações que habilitam
  a execução da atividade.

  (2) As certificações que requerem outro curso como pré-requisito constam no Apêndice B deste
  Regulamento.

  (3) Adicionalmente, para as atividades de inspeção ou verificação de aeronaves, o operador
  aéreo deve prover ao profissional apresentação das características de suas aeronaves.

  (4) Devem ser observadas demais exigências normativas e capacitações específicas para desempenho
  das atividades previstas neste Apêndice.'
