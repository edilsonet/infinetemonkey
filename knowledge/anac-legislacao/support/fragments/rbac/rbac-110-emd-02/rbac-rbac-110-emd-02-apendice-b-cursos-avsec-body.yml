  FORMAÇÃO OU ATUALIZAÇÃO

  (2)

  EM INSTRUTOR AVSEC

  1. Nota nas avaliações teórica e prática igual ou superior a 70% (setenta porcento).

  2. Experiência profissional

  (4)

  mínima de 12 (doze) meses nas atividades operacionais de aviação civil;

  3. Ensino médio

  (1)

  ;

  4. Certificação válida de AVSEC para Operador Aéreo e de AVSEC para Operador de Aeródromo;

  5. Passar por avaliação de antecedentes, conforme este regulamento;

  6. Certificação em Inspeção de Segurança da Aviação Civil ou declaração de conclusão da
  primeira etapa do referido curso (etapa do centro de instrução).

  3 anos

  (1) A escolaridade deve ser comprovada por meio de certificado de conclusão do respectivo
  curso.

  (2) Para realizar o curso de atualização, o profissional deve possuir a certificação no
  curso pretendido dentro do período de validade.

  (3) No ensino semipresencial ou a distância, a frequência mínima deve ser verificável por
  mecanismos que comprovem o cumprimento de cada item da grade curricular do curso pelo aluno.

  (4) As atividades de controle de qualidade, docência e elaboração de material didático não
  são consideradas como atividade operacional para fins de experiência exigida nos critérios
  de aprovação da certificação de instrutor AVSEC.

  (5) Para os cursos de Formação e Atualização em Inspeção de Segurança da Aviação Civil,
  a carga horária discriminada na tabela do Apêndice B se refere apenas à etapa ministrada
  pelo centro de instrução'
