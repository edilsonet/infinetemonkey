title: 117.1(b)
text: '(b) Para os propósitos deste Regulamento são considerados operadores aéreos, ou simplesmente

  operadores:

  (1) os operadores certificados pelo RBAC nº 121;

  (2) os operadores certificados pelo RBAC nº 135;

  (3) [reservado];

  (4) os operadores de serviços aéreos especializados, conforme art. 201 da Lei nº 7.565,
  de 19

  de dezembro de 1986 (Código Brasileiro de Aeronáutica); e

  (5) os operadores privados operando segundo o RBHA 91, ou regulamento que venha a

  substituí-lo, quando realizando operações sem fins lucrativos com pilotos contratados segundo
  o

  Decreto-Lei nº 5.452, de 1º de maio de 1943 (CLT), a serviço do operador da aeronave.'
