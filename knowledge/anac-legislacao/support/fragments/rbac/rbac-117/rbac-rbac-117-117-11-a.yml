cite: 117.11(a)
title: 117.11(a)
text: '(a) Sujeito ao parágrafo 117.17 desta Subparte, cada operador engajado em serviço aéreo
  público

  deve cumprir os limites operacionais e requisitos para tripulação mencionados em um ou mais
  dos

  seguintes parágrafos, de acordo com este Regulamento:

  (1) os limites operacionais e requisitos especificados no Apêndice A deste Regulamento,
  para

  os operadores indicados nos parágrafos 117.1 (b)(1) e 117.1 (b)(2) deste Regulamento que
  optarem

  por este Apêndice; e obrigatoriamente para os operadores de serviços aéreos especializados,
  conforme

  o parágrafo 117.13, e operadores privados, conforme o parágrafo 117.15, deste Regulamento;

  (2) os limites operacionais e requisitos especificados no Apêndice B deste Regulamento,
  para

  os operadores indicados nos parágrafos 117.1 (b)(1) e 117.1 (b)(2) deste Regulamento que
  optarem

  por este Apêndice e estejam engajados em operações que necessitem de dois ou mais pilotos,
  desde

  que as operações sejam consideradas complexas conforme definido em 117.3 (q); ou

  (3) os limites operacionais e requisitos especificados no Apêndice C deste Regulamento,
  para

  os operadores indicados nos parágrafos 117.1 (b)(1) e 117.1 (b)(2) deste Regulamento que
  optarem

  por este Apêndice e estejam engajados em operações com aeronaves que necessitem de dois
  pilotos,

  mas que não sejam operações complexas.'
