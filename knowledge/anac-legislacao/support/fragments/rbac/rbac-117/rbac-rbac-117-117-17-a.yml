section_title: Operações sob múltiplos apêndices
subsection_id: a
cite: 117.17(a)
title: 117.17(a)
text: '(a) Se dois ou mais apêndices forem aplicáveis a uma jornada específica de um tripulante,
  as

  seguintes regras se aplicam:

  (1) a jornada máxima que um tripulante pode cumprir é o limite de jornada contido no apêndice

  sob o qual a operação está sendo conduzida naquele momento; e

  (2) o tempo máximo de voo que um tripulante pode cumprir é o limite de tempo de voo contido

  no apêndice sob o qual a operação está sendo conduzida naquele momento.'
