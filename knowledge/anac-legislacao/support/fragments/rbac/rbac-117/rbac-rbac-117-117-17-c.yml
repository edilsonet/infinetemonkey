title: 117.17(c)
text: '(c) A qualquer momento em uma jornada, o operador e o tripulante devem assegurar que
  este

  último permaneça dentro dos limites cumulativos de jornada e horas de voo para o apêndice
  sob o

  qual o operador estiver conduzindo as suas operações naquele momento.'
