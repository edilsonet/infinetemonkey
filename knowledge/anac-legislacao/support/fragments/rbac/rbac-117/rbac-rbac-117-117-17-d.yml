cite: 117.17(d)
title: 117.17(d)
text: '(d) Sempre que for conduzida uma operação sob dois ou mais apêndices em uma única jornada,
  o

  tempo de repouso mínimo após a jornada é aquele contido no apêndice com o maior período
  de

  repouso, como se toda a jornada tivesse sido conduzida sob aquele apêndice.'
