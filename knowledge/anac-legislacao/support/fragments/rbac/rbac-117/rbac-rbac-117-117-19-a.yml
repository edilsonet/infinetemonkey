section_title: Obrigações de todos os operadores aéreos
subsection_id: a
cite: 117.19(a)
title: 117.19(a)
text: '(a) Aptidão para o trabalho. Nenhum operador pode requerer que um tripulante opere
  uma

  aeronave se, considerando as circunstâncias do voo a ser realizado, o operador tiver razões
  para

  acreditar que aquele tripulante esteja, ou provavelmente venha a estar, sob o efeito de
  fadiga que

  possa prejudicar o desempenho do tripulante de modo a afetar a segurança da operação.'
