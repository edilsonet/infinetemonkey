text: '(c)(2) desta seção como alterado pelo operador para os tripulantes e para a operação,
  desde que não

  exceda o limite máximo, ou reduza o limite mínimo, especificado no apêndice aplicável ou
  SGRF

  (seção 117.65); e

  (4) sempre que for necessário levar em consideração possíveis perigos de acordo com o

  requerido na seção 117.61 deste Regulamento: para cada tripulante conduzindo uma dada operação,


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  cada limite referenciado no parágrafo (c)(3) desta seção com as alterações necessárias para
  levar em

  conta o possível perigo.

  (5) Responsabilidade dos funcionários do operador. Cada operador deve incluir no seu manual

  as responsabilidades para o gerenciamento da fadiga e gerenciamento de risco da fadiga.'
