title: 117.19(i)
text: '(i) escala de trabalho prevista dos tripulantes;

  (ii) escala de trabalho realizada dos tripulantes, horas de jornada e de voo;

  (iii) períodos reais de repouso e de descanso referentes à jornada interrompida e a bordo
  de

  aeronave, reserva, sobreaviso e folga; e

  (iv) os limites de jornada e de horas de voo constantes do seu manual que foram excedidos

  de acordo com os requisitos pertinentes dos apêndices aplicáveis ao operador ou de acordo
  com o

  SGRF, com informações suficientes para demonstrar o cumprimento do parágrafo (e)(3) desta
  seção.

  (2) Cada registro referenciado no parágrafo (e)(1) desta seção, incluindo cópia dos reportes
  e

  documentos, deve ser arquivada por pelo menos cinco anos a partir da data na qual o registro
  ou sua

  cópia foram produzidos.

  (3) Cada registro referente a uma extensão de uma jornada ou tempo de voo referenciado no

  parágrafo (e)(1)(iv) desta seção deve ser:'
