title: 117.19(j)
text: '(j) Nos casos em que o GRF ou SGRF autorizar a superação das 12 (doze) horas de jornada
  de

  trabalho ou a diminuição do período de 12 (doze) horas de repouso, em tripulação simples,
  tais

  alterações devem ser implementadas por meio de convenção ou acordo coletivo de trabalho
  entre o

  operador da aeronave e o sindicato da categoria profissional.


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.'
