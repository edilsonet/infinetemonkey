cite: 117.21(a)
title: 117.21(a)
text: '(a) Um tripulante empregado por um operador deve utilizar a oportunidade de sono, os
  períodos

  de repouso, descanso e adaptação para obter a quantidade de sono suficiente para realizar
  com

  segurança a próxima atividade prevista na escala de trabalho.'
