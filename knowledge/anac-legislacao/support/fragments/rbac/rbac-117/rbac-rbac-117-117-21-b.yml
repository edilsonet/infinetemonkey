title: 117.21(b)
text: '(b) Nenhum tripulante pode aceitar operar uma aeronave se, considerando as circunstâncias
  do

  voo a ser realizado, tiver razões para acreditar que esteja, ou provavelmente venha a estar
  sob o efeito

  de fadiga que possa prejudicar o seu desempenho de modo a afetar a segurança da operação.'
