cite: 117.21(c)
title: 117.21(c)
text: '(c) Um tripulante empregado por um operador deve, antes de qualquer jornada, informar
  ao

  operador qualquer situação que o esteja afetando, ou seja, relacionada à jornada, sobre
  a qual tenha

  razão para acreditar que pode afetar sua capacidade de atender às políticas de gerenciamento
  de risco

  da fadiga do operador ou os limites operacionais e requisitos dos apêndices aplicáveis ao
  operador.

  (1) Este parágrafo não requer que o tripulante informe repetidamente uma situação de caráter

  permanente que já tenha sido anteriormente relatada ao operador.


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  SUBPARTE C

  GERENCIAMENTO DE RISCO DA FADIGA (GRF) E SISTEMA DE GERENCIAMENTO

  DE RISCO DA FADIGA (SGRF)'
