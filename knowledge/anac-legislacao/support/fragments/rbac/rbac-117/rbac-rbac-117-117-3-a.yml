title: 117.3(a)
text: '(a) aclimatação, também conhecida como ajuste biológico, significa um estado no qual
  o ritmo

  circadiano de um membro da tripulação está sincronizado com o fuso horário da região onde
  o

  membro da tripulação está, conforme os requisitos estabelecidos na seção 117.5 deste Regulamento;'
