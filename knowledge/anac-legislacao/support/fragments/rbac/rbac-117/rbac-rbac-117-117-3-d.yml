text: '(d) base contratual, como definido no caput do art. 23, complementado pelo § 1º do
  art. 25 da

  Lei 13.475, de 28 de agosto de 2017, significa a matriz ou filial onde o contrato de trabalho
  do

  tripulante estiver registrado, especificando o aeroporto a ser utilizado pelo tripulante;'
