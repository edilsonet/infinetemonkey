title: 117.3(f)
text: '(f) fadiga significa um estado fisiológico de redução de capacidade de desempenho físico
  e/ou

  mental resultante do débito de sono, vigília estendida, desajustes dos ritmos circadianos,
  alterações

  do ciclo vigília-sono e/ou carga de trabalho (mental e/ou física) que podem prejudicar o
  nível de alerta

  e a habilidade de uma pessoa executar atividades relacionadas à segurança operacional;'
