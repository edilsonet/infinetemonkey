title: 117.3(g)
text: '(g) folga, conforme definido no art. 50 da Lei nº 13.475, de 28 de agosto de 2017,
  significa o

  período não inferior a 24 (vinte e quatro) horas consecutivas em que o tripulante, em sua
  base

  contratual, sem prejuízo da remuneração, está desobrigado de qualquer atividade relacionada
  com seu

  trabalho;'
