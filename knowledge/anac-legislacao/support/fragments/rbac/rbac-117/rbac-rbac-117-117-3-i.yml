cite: 117.3(i)
title: 117.3(i)
text: '(i) acomodação Classe 1 significa uma cama ou outra superfície que permita dormir na

  posição horizontal, cuja localização seja separada tanto da cabine de comando quanto da
  cabine de

  passageiros, tenha temperatura controlada, possibilite que o tripulante controle a iluminação
  e seja

  isolada quanto a som e perturbação;

  (ii) acomodação Classe 2 significa um assento na cabine de passageiros que permita uma

  posição para dormir horizontal ou quase horizontal (isto é, recline 45° ou mais em relação
  à vertical),

  possua uma largura mínima de 50 cm (20 pol.) e possua suporte para as pernas e pés na posição

  reclinada. Adicionalmente, ele deve ser separado dos passageiros por pelo menos uma cortina
  para

  possibilitar escurecimento e razoavelmente livre de perturbação dos passageiros ou membros
  da

  tripulação; e

  (iii) acomodação Classe 3 significa um assento na cabine de comando ou na cabine de

  passageiros que recline 40° ou mais em relação à vertical, possua suporte para as pernas
  e pés na

  posição reclinada, seja separada dos passageiros por pelo menos uma cortina para possibilitar

  escurecimento, e não seja adjacente a nenhum assento de passageiros;


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  (2) quando se referindo a acomodação para reserva, como definido no art. 44 da Lei nº 13.475,

  de 28 de agosto de 2017, significa poltronas que reclinem 45° ou mais em relação à vertical
  e possuam

  apoio para as pernas e pés na posição reclinada, em sala específica com controle de temperatura,

  mitigação de ruído e controle de luminosidade, em local diferente do destinado ao público
  e à

  apresentação das tripulações, e com acesso a alimentação; ou

  (3) quando se referindo a acomodação para repouso, como definido no §3º do art. 47 da Lei

  nº 13.475, de 28 de agosto de 2017, fora da base significa quarto individual com banheiro
  privativo

  e condições adequadas de higiene, segurança, ruído, controle de temperatura e luminosidade,
  e com

  acesso a alimentação. Na base contratual de trabalho do tripulante, a moradia contempla
  os requisitos

  de acomodação para repouso;'
