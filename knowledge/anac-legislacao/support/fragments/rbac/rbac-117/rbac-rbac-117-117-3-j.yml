title: 117.3(j)
text: '(j) gerenciamento da fadiga significa os métodos pelos quais os provedores de serviços
  de

  aviação civil e pessoal operacional atendem às implicações de segurança relativas à fadiga.
  Em geral,

  normas da ICAO e práticas recomendadas (SARPs) em vários Anexos suportam dois métodos

  distintos para gerir a fadiga:

  (1) uma abordagem prescritiva, que requer que o provedor de serviços atenda aos limites

  definidos pelo Estado enquanto gerencia os perigos relacionados à fadiga por meio de seu
  SGSO; e

  (2) uma abordagem baseada no desempenho, que requer que o provedor de serviços implemente

  um Sistema de Gerenciamento de Risco da Fadiga (SGRF) aprovado pelo Estado;'
