title: 117.3(k)
text: '(k) Gerenciamento de Risco da Fadiga (GRF) significa o gerenciamento da fadiga de uma
  forma

  apropriada ao nível de exposição ao risco e à natureza da operação, de modo a minimizar
  os efeitos

  adversos da fadiga nas operações;


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.'
