cite: 117.3(n)
title: 117.3(n)
text: '(n) jornada de trabalho, conforme definido no art. 35 da Lei nº 13.475, de 28 de agosto
  de 2017,

  significa a duração do trabalho do tripulante, contada entre a hora da apresentação no local
  de trabalho

  e a hora em que o mesmo é encerrado.

  (1) A jornada na base contratual será contada a partir da hora de apresentação do tripulante
  no

  local de trabalho.

  (2) Fora da base contratual, a jornada será contada a partir da hora de apresentação do
  tripulante

  no local estabelecido pelo empregador.

  (3) Nas hipóteses previstas nos parágrafos (n)(1) e (n)(2) desta seção, a apresentação no

  aeroporto ou outro local estabelecido pelo empregador deve ser de pelo menos 30 (trinta)
  minutos

  anteriores à hora prevista para o início do voo.

  (4) A jornada será considerada encerrada 30 (trinta) minutos após a parada final dos motores,

  no caso de voos domésticos, e 45 (quarenta e cinco) minutos após a parada final dos motores,
  no caso

  de voos internacionais.

  (5) Para atividades em terra não se aplicam as disposições dos parágrafos (n)(3) e (n)(4)
  desta

  seção.

  (6) Os limites previstos no parágrafo (n)(4) desta seção podem ser alterados pelos operadores

  de aeronaves que possuírem Sistema de Gerenciamento de Risco da Fadiga no planejamento e

  execução das escalas de serviço de seus tripulantes, ficando o limite mínimo estabelecido
  em 30

  (trinta) minutos;'
