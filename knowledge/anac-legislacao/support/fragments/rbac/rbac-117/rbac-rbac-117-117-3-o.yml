title: 117.3(o)
text: '(o) limitações ou limites operacionais, no contexto deste Regulamento, significam quaisquer

  prescrições temporais referidas aos tripulantes de voo e de cabine que incidem sobre limites
  de voo,

  de pouso, de jornada de trabalho, de sobreaviso, de reserva, de períodos de repouso e de
  outros fatores

  que possam reduzir o estado de alerta da tripulação ou comprometer o seu desempenho operacional;'
