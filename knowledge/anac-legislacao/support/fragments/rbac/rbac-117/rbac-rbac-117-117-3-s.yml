title: 117.3(s)
text: '(s) oportunidade de sono significa um período de tempo durante o repouso ou folga quando
  um

  tripulante:

  (1) não está cumprindo necessidades fisiológicas, tais como comer, beber, se vestir e realizar

  higiene pessoal; e


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  (2) tem acesso a uma acomodação para repouso sem, em circunstâncias normais, ser

  interrompido pelo operador;'
