title: 117.3(x)
text: '(x) ritmo circadiano significa o ciclo biológico de aproximadamente 24 horas dos processos

  bioquímicos, fisiológicos e comportamentais dos seres humanos, sustentados por mecanismos

  endógenos cronometrados. Este ciclo é relacionado ao tempo de rotação da Terra, sendo mantido
  por

  diversos agentes, especialmente o ciclo claro e escuro, e influenciado pelos horários de
  alimentação

  e atividades físicas e sociais;'
