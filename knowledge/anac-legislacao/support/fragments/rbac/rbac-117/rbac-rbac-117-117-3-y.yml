title: 117.3(y)
text: '(y) Sistema de Gerenciamento de Risco da Fadiga (SGRF) significa um sistema, aprovado
  pela

  ANAC, de monitoramento e gerenciamento contínuo dos riscos de segurança associados à fadiga,

  baseado em dados, princípios científicos e experiência operacional, que visa assegurar que
  o pessoal

  envolvido execute suas atividades sob um nível adequado de alerta. Um SGRF aprovado possibilita

  que sejam praticados limites operacionais diferentes dos constantes deste Regulamento;'
