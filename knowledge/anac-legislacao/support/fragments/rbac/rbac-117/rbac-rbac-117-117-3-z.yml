title: 117.3(z)
text: '(z) sobreaviso, conforme definido no art. 43 da Lei nº 13.475, de 28 de agosto de 2017,
  significa

  o período de tempo nunca inferior a 3 (três) horas e não excedente a 12 (doze) horas, em
  que o

  tripulante permanece em local de sua escolha, à disposição do empregador, devendo apresentar-se
  no

  aeroporto ou outro local determinado, no prazo de até 90 (noventa) minutos após receber

  comunicação para o início de nova tarefa.

  (1) Quando em município ou conurbação dotada de dois ou mais aeroportos, os tripulantes
  que

  forem designados para aeroporto diferente da base contratual terão prazo limite para a apresentação

  de 150 (cento e cinquenta) minutos após receber comunicação para o início de nova tarefa;

  (aa) tempo de voo ou hora de voo, conforme definido no art. 30 da Lei nº 13.475, de 28 de
  agosto

  de 2017, significa o período compreendido entre o início do deslocamento, quando se tratar
  de

  aeronave de asa fixa, ou entre a “partida" dos motores, quando se tratar de aeronave de
  asa rotativa,

  até o momento em que respectivamente, se imobiliza a aeronave ou se efetua o "corte" dos
  motores,

  ao término do voo (calço-a-calço);

  (bb) tripulação mínima, conforme definido no art. 14 da Lei nº 13.475, de 28 de agosto de
  2017,

  significa a tripulação determinada na forma da certificação de tipo da aeronave, homologada
  pela

  ANAC, sendo permitida sua utilização em voos locais de instrução, de experiência, de vistoria
  e de

  traslado;

  (cc) tripulação simples, conforme definido no art. 15 da Lei nº 13.475, de 28 de agosto
  de 2017,

  significa a tripulação constituída de uma tripulação mínima, acrescida, quando for o caso,
  dos

  tripulantes necessários à realização do voo;

  (dd) tripulação composta, conforme definido no art. 16 da Lei nº 13.475, de 28 de agosto
  de

  2017, significa a tripulação constituída de uma tripulação simples, acrescida de um piloto
  qualificado


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  como piloto em comando, um mecânico de voo, quando o equipamento assim o exigir, e de, no

  mínimo, de 25% (vinte e cinco por cento) do número de comissários de voo;

  (ee) tripulação de revezamento, conforme definido no art. 17 da Lei nº 13.475, de 28 de
  agosto

  de 2017, significa a tripulação constituída de uma tripulação simples, acrescida de um piloto

  qualificado como piloto em comando, um piloto segundo em comando, um mecânico de voo, quando

  o equipamento assim o exigir, e de 50% (cinquenta por cento) do número de comissários de
  voo;

  (ff) tripulante extra a serviço, conforme definido no art. 4º da Lei nº 13.475, de 28 de
  agosto de

  2017, significa o tripulante de voo ou de cabine que se deslocar a serviço do empregador,
  em aeronave

  própria ou não, sem exercer função a bordo da aeronave. O tripulante extra a serviço será
  considerado

  como um tripulante a serviço no que diz respeito aos limites de jornada de trabalho e repouso.
  Ao

  tripulante extra a serviço será disponibilizado assento na cabine de passageiros, salvo
  em aeronaves

  no transporte exclusivo de cargas; e

  (gg) viagem, conforme definido no art. 45 da Lei nº 13.475, de 28 de agosto de 2017, significa
  o

  trabalho realizado pelo tripulante de voo ou de cabine, contado desde a saída de sua base
  até o seu

  regresso. Uma viagem pode compreender uma ou mais jornadas.'
