title: 117.5(a)
text: '(a) Para efeitos desta seção, as seguintes definições se aplicam:

  (1) local original: local onde o tripulante foi por último aclimatado; e

  (2) novo local: local onde o tripulante inicia uma jornada ou um período de repouso.'
