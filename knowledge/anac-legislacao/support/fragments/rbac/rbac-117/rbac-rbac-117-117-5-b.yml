cite: 117.5(b)
title: 117.5(b)
text: '(b) No início de uma jornada ou de um período de repouso em um novo local, um tripulante
  deve

  ser considerado aclimatado ao novo local se:

  (1) a diferença entre o local original e o novo local for de menos de três fusos; e

  (2) o tripulante permaneceu em um estado aclimatado desde a última aclimatação.'
