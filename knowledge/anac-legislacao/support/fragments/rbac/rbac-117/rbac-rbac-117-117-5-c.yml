cite: 117.5(c)
title: 117.5(c)
text: '(c) No início de uma jornada ou de um período de repouso em um novo local que difira
  em três

  fusos ou mais do local original, o tripulante é considerado aclimatado ao local original
  se a jornada

  ou o repouso no novo local se iniciar em menos de 36 horas após o início da jornada no local
  original.'
