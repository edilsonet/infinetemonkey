cite: 117.5(d)
title: 117.5(d)
text: '(d) No início de uma jornada ou de um período de repouso em um novo local que difira
  em três

  fusos ou mais do local original, o tripulante é considerado em estado desconhecido de aclimatação
  se

  a jornada ou o repouso no novo local se iniciar 36 horas ou mais após o tripulante ter iniciado
  a

  jornada no local original, desde que não haja enquadramento no período de adaptação, conforme

  parágrafo (e) desta seção.'
