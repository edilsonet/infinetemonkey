title: 117.5(i)
text: '(i) o local onde o tripulante foi aclimatado pela última vez (local original); e

  (ii) cada local onde uma jornada ou período de repouso foi iniciado desde a última

  aclimatação (locais anteriores);

  (2) em seguida, deve-se escolher a maior diferença de fusos entre o local original e cada
  um

  dos locais anteriores;

  (3) em seguida, deve-se escolher, na primeira coluna da Tabela, a linha correspondente à

  diferença de fusos encontrada no parágrafo (f)(2) desta seção;

  (4) em seguida, deve-se escolher o sentido da viagem (leste ou oeste) correspondente à maior

  diferença entre fusos estabelecidos pelo parágrafo (f)(2) desta seção; e

  (5) finalmente, deve-se escolher, nas colunas leste ou oeste, o número de horas correspondente

  à linha determinada no parágrafo (f)(3) desta seção.

