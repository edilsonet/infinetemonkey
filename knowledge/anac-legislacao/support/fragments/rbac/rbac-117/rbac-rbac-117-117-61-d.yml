section_title: Gerenciamento de risco da fadiga (GRF)
subsection_id: d
cite: 117.61(d)
title: 117.61(d)
text: '(d) Cada operador deve:

  (1) realizar treinamento inicial e periódico dos funcionários responsáveis pelo cumprimento
  das

  regras deste Regulamento (incluindo gestores, tripulantes, despachantes operacionais de
  voo e

  pessoal da escala de voo) abordando provisões relevantes sobre os riscos relacionados à
  fadiga nas

  suas atribuições;

  (2) avaliar o conhecimento dos funcionários referenciados no parágrafo (d)(1) quanto ao

  conteúdo do treinamento ao término de cada treinamento inicial e periódico; e

  (3) incluir os currículos de treinamento requeridos por este parágrafo no programa de

  treinamento operacional.'
