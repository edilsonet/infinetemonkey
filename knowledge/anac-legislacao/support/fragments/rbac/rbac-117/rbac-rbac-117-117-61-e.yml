title: 117.61(e)
text: '(e) O treinamento inicial requerido pelo parágrafo (d)(1) desta seção deve ocorrer
  em até um ano

  tanto para empregados já contratados quanto para os recém-contratados a partir da data de
  vigência

  deste Regulamento.'
