title: 117.61(g)
text: '(g) O treinamento periódico deve:

  (1) ser realizado a cada dois anos;

  (2) estar de acordo com um currículo de treinamento; e

  (3) rever, construir e ampliar o conhecimento e entendimento adquirido sob o parágrafo (f)

  desta seção.'
