section_title: Gerenciamento de risco da fadiga (GRF)
subsection_id: i
cite: 117.61(i)
title: 117.61(i)
text: '(i) as causas da fadiga;

  (ii) os prejuízos decorrentes da fadiga;

  (iii) o gerenciamento dos riscos associados à fadiga; e

  (iv) as obrigações e os procedimentos de gerenciamento de risco da fadiga do operador, de

  acordo com o previsto neste Regulamento e, quando requerido, no manual; e

  (3) permitir que cada tripulante cumpra suas obrigações de acordo com o previsto neste

  Regulamento e, quando requerido, no manual.'
