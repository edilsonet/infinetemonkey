section_title: Sistema de gerenciamento de risco da fadiga (SGRF)
subsection_id: a
cite: 117.63(a)
title: 117.63(a)
text: '(a) Nenhum operador pode exceder qualquer provisão deste Regulamento a menos que aprovado

  pela ANAC por meio de um sistema de gerenciamento de risco da fadiga (SGRF) que proporcione

  pelo menos um nível de segurança equivalente ao previsto nos apêndices A, B ou C contra
  acidentes

  ou incidentes relacionados à fadiga.'
