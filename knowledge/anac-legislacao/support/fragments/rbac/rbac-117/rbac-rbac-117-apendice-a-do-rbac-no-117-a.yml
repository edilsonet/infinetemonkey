title: apendice-a-do-rbac-no-117(a)
text: '(a) Operações realizadas exclusivamente segundo o Apêndice A:

  (1) não podem ultrapassar os limites operacionais estabelecidos na Lei nº 13.475, de 28
  de

  agosto de 2017; e

  (2) devem cumprir os procedimentos e requisitos aplicáveis deste Regulamento.'
