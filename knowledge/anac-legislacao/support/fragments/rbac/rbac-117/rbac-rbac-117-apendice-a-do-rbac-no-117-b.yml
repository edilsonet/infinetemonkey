cite: apendice-a-do-rbac-no-117(b)
title: apendice-a-do-rbac-no-117(b)
text: '(b) Nenhum operador pode realizar operações que extrapolem os limites operacionais

  estabelecidos na Lei nº 13.475, de 28 de agosto de 2017, a menos que, previamente à realização

  daquelas operações, demonstrem o cumprimento dos requisitos da seção 117.63 ou dos apêndices
  B

  e C (conforme aplicável) deste Regulamento.'
