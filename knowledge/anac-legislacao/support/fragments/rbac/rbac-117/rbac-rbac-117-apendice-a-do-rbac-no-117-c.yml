title: apendice-a-do-rbac-no-117(c)
text: '(c) Conforme definido no art. 29 da Lei nº 13.475, de 28 de agosto de 2017, os limites
  de jornada,

  tempo de voo e número de pousos para uma tripulação composta serão aplicáveis desde que
  a

  acomodação a bordo da aeronave seja pelo menos classe 2.'
