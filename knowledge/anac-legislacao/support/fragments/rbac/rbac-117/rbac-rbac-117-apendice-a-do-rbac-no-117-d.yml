title: apendice-a-do-rbac-no-117(d)
text: '(d) Conforme definido no art. 29 da Lei nº 13.475, de 28 de agosto de 2017, os limites
  de jornada,

  tempo de voo e número de pousos para uma tripulação de revezamento serão aplicáveis desde
  que a

  acomodação a bordo da aeronave seja classe 1.


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.'
