title: apendice-b-do-rbac-no-117(b)
text: '(b) Todas as horas especificadas nas tabelas B.1, B.2 e B.3 deste Apêndice apresentam
  os valores

  máximos reais de jornada e tempo de voo, mesmo na jornada noturna. Para efeito de jornada
  e

  publicação de escalas de trabalho dos tripulantes em conformidade com este Apêndice já está
  sendo

  considerado o redutor previsto no art. 39 da Lei nº 13.475, de 28 de agosto de 2017.'
