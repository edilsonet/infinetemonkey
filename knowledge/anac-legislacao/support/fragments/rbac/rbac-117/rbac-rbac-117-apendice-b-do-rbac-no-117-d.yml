title: apendice-b-do-rbac-no-117(d)
text: '(d) Limites de jornada e de tempo de voo para um tripulante aclimatado.

  (1) Sujeito ao parágrafo (f) deste Apêndice, um tripulante aclimatado não pode ser designado

  para uma jornada com duração maior do que o especificado na Tabela B.1, de acordo com a
  hora


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  aclimatada referente ao início da jornada e o número de etapas a serem voadas, a menos que
  ele faça

  parte de tripulação composta ou de revezamento de acordo com o parágrafo (g) deste Apêndice.

  (2) Um tripulante não pode ser designado para um tempo de voo, durante uma jornada, maior

  do que o especificado entre parênteses na Tabela B.1, de acordo com a hora aclimatada referente
  ao

  início da jornada e o número de etapas a serem voadas, a menos que faça parte de tripulação
  composta

  ou de revezamento de acordo com o parágrafo (g) deste Apêndice.

  (3) Para aplicar a Tabela B.1, deve-se escolher primeiro a hora aclimatada relativa ao início
  da

  jornada e então escolher o número de etapas a serem voadas. A duração máxima da jornada
  é o

  número diretamente abaixo do número de etapas. O tempo máximo de voo é o número entre

  parênteses, ao lado do número referente à duração máxima da jornada.

  Tabela B.1: Duração máxima da jornada e tempo máximo de voo para um tripulante de tripulação

  mínima ou simples aclimatado, de acordo com o número de etapas a serem voadas e a hora aclimatada

  referente ao início da jornada.

