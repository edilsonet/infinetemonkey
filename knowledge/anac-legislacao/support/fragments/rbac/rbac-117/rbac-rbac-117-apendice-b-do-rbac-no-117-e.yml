title: apendice-b-do-rbac-no-117(e)
text: '(e) Limites de jornada para um tripulante em estado desconhecido de aclimatação.

  (1) Para calcular os limites máximos de jornada de um tripulante em estado desconhecido
  de

  aclimatação, deve-se diminuir em 1 hora os valores constantes da Tabela B.1 ou das Tabelas
  B.2 e

  B3 deste Apêndice, conforme aplicável.

  (2) O horário de início da jornada a ser considerado deve corresponder ao do local onde
  o

  tripulante esteve por último aclimatado.

  (3) Quando em estado desconhecido de aclimatação, um tripulante só pode ser designado para,

  no máximo, 2 (duas) jornadas consecutivas. Após, o tripulante deve passar por um período
  de

  adaptação suficiente para se tornar aclimatado novamente, conforme o parágrafo 117.5 (e)
  deste

  Regulamento.'
