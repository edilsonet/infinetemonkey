text: '(g) Limites de jornada e de tempo de voo em operações com tripulação composta ou de

  revezamento.

  (1) Sujeito às condições dos parágrafos (g)(2), (g)(3) e (g)(4), deste Apêndice, um tripulante

  aclimatado em uma operação com tripulação composta ou de revezamento não pode ser designado

  para uma jornada ou tempo de voo maior do que o especificado nas Tabelas B.2 ou B.3, de
  acordo


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  com a hora aclimatada referente ao início da jornada, a classe de acomodação a bordo da
  aeronave e

  o tipo de tripulação.

  (2) Todos os tripulantes. Para o parágrafo (g)(1) desta seção, as seguintes disposições
  se

  aplicam:'
