title: apendice-b-do-rbac-no-117(i)
text: '(i) se uma jornada estiver planejada para não exceder 16 horas, então:

  (A) o tempo mínimo de descanso a bordo da aeronave deve ser de 1 (uma) hora e 30

  (trinta) minutos consecutivos para cada tripulante de cabine; e

  (B) uma jornada de trabalho deve ser limitada a 3 (três) etapas de voo;

  (ii) se uma jornada estiver planejada para exceder em 16 horas, então:

  (A) o período mínimo de descanso durante o voo deve ser de 2 (duas) horas consecutivas

  para cada tripulante de cabine;

  (B) uma jornada de trabalho deve ser limitada a 2 (duas) etapas de voo.

  (5) Para aplicar as Tabelas B.2 ou B.3 para um tripulante aclimatado, deve-se escolher primeiro

  a hora aclimatada referente ao início da jornada, então, escolher a classe de acomodação
  a bordo da

  aeronave e, dentro dessa classe, escolher o tipo de tripulação. A duração máxima da jornada,
  para um

  tripulante aclimatado, é o número imediatamente abaixo do tipo de tripulação escolhido,


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  imediatamente abaixo da classe escolhida que corresponde à hora aclimatada referente ao
  início da

  jornada. O tempo máximo de voo referente ao tempo de aclimatação escolhido é o número entre

  parênteses ao lado do período máximo de jornada.

  Tabela B.2: Duração máxima da jornada e tempo máximo de voo para um tripulante de voo

