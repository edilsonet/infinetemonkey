title: apendice-b-do-rbac-no-117(j)
text: '(j) Limites de sobreaviso ou reserva.

  (1) Um sobreaviso finalizado sem um chamado deve ser seguido por um período de tempo de

  repouso de, pelo menos, 10 horas consecutivas.

  (2) Uma reserva finalizada sem um chamado deve ser seguida por um período de tempo de

  repouso de, pelo menos, 12 horas consecutivas.

  (3) Os limites máximos de sobreaviso ou reserva a que uma tripulação esteja sujeita são
  os

  limites estabelecidos nos respectivos art. 43 e 44 da Lei nº 13.475, de 28 de agosto de
  2017.

  (4) Se o tripulante que compuser tripulação simples for acionado durante um sobreaviso,
  a soma

  do limite máximo de jornada ao tempo de sobreaviso não pode ultrapassar 16 horas.

  (5) Sujeito ao parágrafo (j)(6) deste Apêndice, se o tripulante que compuser tripulação
  composta

  ou de revezamento for acionado em até 8 horas do início de seu sobreaviso, os limites máximos
  de

  jornada previstos nas respectivas tabelas são aplicáveis.

  (6) Se o tripulante que compuser tripulação composta ou de revezamento for acionado após
  8

  horas de um sobreaviso, os limites de jornada previstos nas respectivas tabelas devem ser
  diminuídos

  do valor que exceder as 8 horas de sobreaviso.'
