title: apendice-c-do-rbac-no-117(a)
text: '(a) Em consonância com o art. 19 da Lei nº 13.475, de 28 de agosto de 2017, este Apêndice
  altera

  os limites operacionais estabelecidos na referida Lei, devendo ser utilizado em substituição
  aos

  limites operacionais constantes dos artigos e parágrafos da referida Lei, abaixo especificados:

  (1) Art. 31;

  (2) Art. 32;

  (3) Art. 33;

  (4) Art. 34;

  (5) Art. 35;

  (6) Art. 36;

  (7) Art. 37;

  (8) Art. 38;

  (9) Art. 39;

  (10) Art. 40;

  (11) Art. 41, exceto § 1º;

  (12) Art. 42;

  (13) Art. 46;

  (14) Art. 47, caput, § 1º, § 3º, § 4º;

  (15) Art. 48;

  (16) Art. 49;

  (17) Art. 80.'
