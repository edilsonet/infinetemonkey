title: apendice-c-do-rbac-no-117(b)
text: '(b) Todas as horas especificadas na Tabela C.1 deste Apêndice apresentam os valores
  máximos

  reais de jornada e tempo de voo, mesmo na jornada noturna. Para efeito de jornada e publicação
  de

  escalas de trabalho dos tripulantes em conformidade com este Apêndice já está sendo considerado
  o

  redutor previsto no art. 39 da Lei nº 13.475, de 28 de agosto de 2017.'
