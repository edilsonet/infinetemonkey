title: apendice-c-do-rbac-no-117(c)
text: '(c) Oportunidade de sono anterior à jornada, sobreaviso ou reserva. Um tripulante não
  deve ser

  escalado para uma jornada, sobreaviso ou reserva, ou iniciá-la(o), a menos que tenha a oportunidade

  de sono de 8 (oito) horas consecutivas dentro das 12 (doze) horas que antecedem:

  (1) o início da jornada, sobreaviso ou reserva, se esta(e) não sofreu atraso;

  (2) o horário original de apresentação para a jornada, sobreaviso ou reserva, se esta(e)
  sofreu

  atraso de menos de 10 horas; ou

  (3) o início da jornada, sobreaviso ou reserva após o atraso, se este foi de 10 horas ou
  mais.'
