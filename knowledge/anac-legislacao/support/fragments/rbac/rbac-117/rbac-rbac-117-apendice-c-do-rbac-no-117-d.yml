title: apendice-c-do-rbac-no-117(d)
text: '(d) Limites de jornada e de tempo de voo.


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.


  (1) Um tripulante não pode ser designado para uma jornada com duração maior do que o

  especificado na Tabela C.1, de acordo com a hora legal de início da jornada e o número de
  etapas a

  serem voadas.

  (2) Um tripulante não pode ser designado para um tempo de voo, durante uma jornada, maior

  do que o especificado entre parênteses na Tabela C.1, de acordo com a hora legal de início
  da jornada

  e o número de etapas a serem voadas.

  (3) Para aplicar a Tabela C.1, deve-se escolher primeiro a hora local relativa ao início
  da jornada

  e então escolher o número de etapas a serem voadas. A duração máxima da jornada é o número

  diretamente abaixo do número de etapas. O tempo máximo de voo é o número entre parênteses,
  ao

  lado do número referente à duração máxima da jornada.

  Tabela C.1: Duração máxima da jornada e tempo máximo de voo de acordo com o número de setores

  a serem voados e a hora legal de início da jornada.

