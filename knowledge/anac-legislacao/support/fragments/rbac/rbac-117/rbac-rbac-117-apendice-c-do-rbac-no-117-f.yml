text: '(f) Aumento nos limites da jornada em função de jornada interrompida. Tripulações mínimas
  e

  simples.

  (1) Sujeito aos parágrafos 117.19 (j) e (f)(3) deste Apêndice, o limite de uma jornada fora
  da

  base contratual para tripulações mínimas e simples aclimatadas pode ser acrescido de até
  a metade da

  duração da interrupção, limitado a uma jornada máxima de 14 horas operações conduzidas segundo

  o RBAC nº 121, se:'
