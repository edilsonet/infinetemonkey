title: apendice-c-do-rbac-no-117(h)
text: '(h) Atraso no horário de apresentação.

  (1) Em voos domésticos, para atender a atrasos ocasionados por condições meteorológicas

  desfavoráveis ou por trabalhos de manutenção não programados, o operador pode utilizar uma

  tripulação composta, sem caracterizar uma operação complexa.

  (2) O operador pode atrasar o horário de apresentação em caso de circunstâncias imprevistas,

  se os procedimentos de apresentação com atraso constantes dos parágrafos (h)(3) até (h)(10)
  deste

  Apêndice forem estabelecidos no manual do operador.

  Procedimentos de comunicação de atrasos

  (3) O operador pode atrasar o horário de apresentação de um tripulante se o operador informar

  ao tripulante o novo horário de apresentação da seguinte forma:'
