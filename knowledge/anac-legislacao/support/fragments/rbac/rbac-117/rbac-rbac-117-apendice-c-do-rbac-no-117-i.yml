cite: apendice-c-do-rbac-no-117(i)
title: apendice-c-do-rbac-no-117(i)
text: '(i) quando houver interrupção da jornada superior a 3 (três) horas e inferior a 6 (seis)
  horas

  consecutivas entre 06h00 e 00h00 (hora legal do local de interrupção da jornada), for proporcionado

  pelo operador acomodações para reserva para os tripulantes;

  (ii) quando alguma parte da interrupção da jornada for entre 00h00 e 06h00 (hora legal do

  local de interrupção da jornada), o período de descanso for de, no mínimo, 6 horas e for
  proporcionado

  pelo operador acomodação para repouso para os tripulantes; ou

  (iii) quando houver interrupção da jornada igual ou superior a 6 (seis) horas, até 10 (dez)

  horas consecutivas (inclusive), a qualquer hora do dia, for proporcionado pelo operador
  acomodação

  para repouso para os tripulantes.

  (3) O tempo remanescente da jornada interrompida, após o período de descanso, não pode

  ultrapassar 6 horas.

  (4) Jornadas interrompidas devem ser consignadas no diário de bordo da aeronave com a

  informação de quais foram os horários de interrupção e retomada da jornada e o tipo de acomodação

  oferecida pelo operador, com assinatura do piloto em comando.

  (5) Para efeito de contagem de tempo de interrupção, não serão considerados os tempos

  necessários para as atividades pós-voo, pré-voo e deslocamento até o local de descanso ou
  repouso,

  não podendo ser o tempo total destas atividades menor do que 30 minutos.

  (6) Para efeito de cálculo de repouso após a jornada interrompida, deverão ser considerados
  os

  requisitos estabelecidos no parágrafo (l) deste Apêndice.

  (7) Nas operações envolvendo tripulantes definidos no parágrafo 117.1 (b)(1) deste

  Regulamento, as jornadas interrompidas devem ser limitadas a uma a cada período de 168 horas

  consecutivas, não podendo ser precedidas ou sucedidas por repouso reduzido previsto nos
  parágrafos'
