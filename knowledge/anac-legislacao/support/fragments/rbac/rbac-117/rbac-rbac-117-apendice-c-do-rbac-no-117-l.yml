text: '(l) Períodos de repouso.

  (1) Sujeito ao parágrafo (l)(2) deste Apêndice, quando uma jornada não exceder 12 horas,
  o

  período de repouso subsequente deve ser de, pelo menos, 12 (doze) horas.

  (2) Quando uma jornada não exceder 10 horas, o período de repouso seguinte (PR2) pode ser

  reduzido para não menos do que 10 horas, se:'
