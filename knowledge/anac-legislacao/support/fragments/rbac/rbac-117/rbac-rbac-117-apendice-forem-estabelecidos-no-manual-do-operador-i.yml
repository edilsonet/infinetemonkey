title: apendice-forem-estabelecidos-no-manual-do-operador(i)
text: '(i) Caso sejam designadas quatro jornadas que envolvam operações na madrugada em

  qualquer período de 168 horas consecutivas, apenas mais uma jornada com função a bordo,

  sobreaviso ou reserva pode ser designada para o mesmo período.

  (ii) O tripulante de voo ou de cabine pode ser escalado para jornada na terceira operação
  na

  madrugada consecutiva, desde que como tripulante extra a serviço, em voo de retorno à base

  contratual, encerrando sua jornada de trabalho. Nesta condição, o tripulante não pode ser
  escalado

  para compor tripulação no período que antecede a terceira operação na madrugada consecutiva
  na

  mesma jornada de trabalho.

  (2) O período de 168 horas consecutivas a que se refere o parágrafo (o)(1) deste Apêndice
  pode

  ser encerrado, iniciando-se a contagem de novo período, sempre que for disponibilizado ao
  tripulante

  um período mínimo de 48 horas, incluindo duas noites locais, livre de qualquer atividade.

  (3) Nenhum operador aéreo pode escalar um tripulante para um voo cuja jornada se inicie
  entre

  06:00 e 08:00 se este tripulante tiver realizado duas operações consecutivas na madrugada
  nas 48

  horas anteriores a esta jornada.

  (4) Os requisitos constantes deste Apêndice também se aplicam às operações na madrugada

  decorrentes de reprogramações ou extensões.


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.'
