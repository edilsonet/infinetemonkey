title: apendice-forem-estabelecidos-no-manual-do-operador(j)
text: '(j) Limites de sobreaviso ou reserva.

  (1) Um sobreaviso finalizado sem um chamado deve ser seguido por um período de tempo de

  repouso de, pelo menos, 10 horas consecutivas.

  (2) Uma reserva finalizada sem um chamado deve ser seguida por um período de tempo de

  repouso de, pelo menos, 12 horas consecutivas.

  (3) Os limites máximos de sobreaviso ou reserva a que uma tripulação esteja sujeita serão
  os

  limites estabelecidos nos respectivos art. 43 e 44 da Lei nº 13.475, de 28 de agosto de
  2017.

  (4) Se um tripulante que compuser tripulação simples for acionado durante um sobreaviso,
  a

  soma do limite máximo de jornada ao tempo de sobreaviso não pode ultrapassar 16 horas.'
