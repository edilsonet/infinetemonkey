  (1) Nos casos onde a base contratual é situada em município ou conurbação dotada de dois
  ou

  mais aeroportos, os seguintes requisitos se aplicam:


  Data da emissão: 19 de março de 2019.

  Data de exigibilidade: 29 de fevereiro de 2020.'
