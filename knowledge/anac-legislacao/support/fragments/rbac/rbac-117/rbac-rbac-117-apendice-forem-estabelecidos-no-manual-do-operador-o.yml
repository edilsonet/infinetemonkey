title: apendice-forem-estabelecidos-no-manual-do-operador(o)
text: '(o) Limites em operações na madrugada.

  (1) Exceto como previsto no parágrafo (o)(1)(ii) deste Apêndice, nenhum tripulante pode

  realizar mais de duas jornadas consecutivas que envolvam operações na madrugada, limitadas
  a

  quatro jornadas com operações na madrugada durante qualquer período de 168 horas consecutivas.'
