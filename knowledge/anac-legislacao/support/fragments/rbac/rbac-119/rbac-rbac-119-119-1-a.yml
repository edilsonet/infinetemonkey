title: 119.1(a)
text: '(a) Este Regulamento estabelece normas para certificação de pessoas jurídicas de direito
  privado

  para condução de operações de transporte aéreo público de passageiros, cargas ou mala postal,
  regular

  ou não regular, doméstico ou internacional.

  (1) As operações aéreas a serem certificadas estarão adstritas ao cumprimento dos requisitos

  estabelecidos no RBAC nº 121 ou RBAC nº 135, conforme definido neste regulamento.'
