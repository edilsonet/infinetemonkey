title: 119.1(e)
text: '(e) As pessoas sujeitas a este regulamento devem atender aos requisitos dos demais
  RBAC, exceto

  quando tais requisitos forem alterados pelos RBAC 119, 121 ou 135 ou quando esses últimos
  RBAC

  impuserem requisitos adicionais.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
