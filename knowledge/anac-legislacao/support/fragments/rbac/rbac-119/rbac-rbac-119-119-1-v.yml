title: 119.1(v)
text: '(v) inspeção de dutos e linhas de transmissão;

  (4) voos de turismo conduzidos em balão de ar quente;

  (5) voos sem escalas conduzidos dentro do raio de 40 km (25 milhas terrestres) do aeródromo

  de decolagem transportando pessoas ou objetos com o propósito de realizar operações de

  paraquedismo;

  (6) operações conduzidas segundo o RBAC nº 133; e

  (7) operações conduzidas segundo a Subparte K do RBAC nº 91, quando não houver prestação

  de serviço de transporte aéreo público.

  (Redação dada pela Resolução nº 606, de 11.02.2021)'
