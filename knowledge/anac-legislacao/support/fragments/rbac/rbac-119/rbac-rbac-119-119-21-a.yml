section_title: Operadores aéreos engajados em serviços de transporte aéreo público
subsection_id: a
cite: 119.21(a)
title: 119.21(a)
text: '(a) Um operador conduzindo serviços de transporte aéreo público deve atender aos requisitos
  de

  certificação e às limitações e procedimentos estabelecidos nas EO, e deve conduzir:

  (1) suas operações com aviões com configuração máxima certificada de assentos para

  passageiros de até 19 assentos e uma capacidade máxima de carga paga de até 3.400 kg (7.500
  lb) de

  acordo com os requisitos aplicáveis do RBAC nº 135, devendo possuir EO para suas operações

  emitidas de acordo com tais requisitos;

  (2) suas operações com aviões com configuração máxima certificada de assentos para

  passageiros de mais de 19 assentos ou uma capacidade máxima de carga paga acima de 3.400
  kg

  (7.500 lb) de acordo com os requisitos aplicáveis do RBAC nº 121, devendo possuir EO para
  suas

  operações emitidas de acordo com tais requisitos;

  (3) suas operações com aeronaves de asas rotativas de acordo com os requisitos aplicáveis
  do

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
