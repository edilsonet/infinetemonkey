title: 119.33(a)
text: '(a) Somente é permitido a uma pessoa conduzir uma operação de transporte aéreo público
  se ela

  for brasileira e:

  (1) possuir a devida outorga da ANAC para exploração de transporte aéreo público (como

  aplicável);

  (2) obter um COA sob este regulamento; e

  (3) possuir EO onde estejam estabelecidas as autorizações, limitações e procedimentos segundo

  os quais cada operação deve ser conduzida.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
