cite: 119.34(a)
title: 119.34(a)
text: '(a) Cada requerente de um certificado emitido segundo este regulamento e, seções 121.163
  do

  uma nova operação de características distintas às já aprovadas deve conduzir voos de avaliação

  operacional durante o processo de certificação para operar segundo o RBAC nº 121 ou 135.

  (1) Todos os voos de avaliação operacional devem ser realizados de maneira aceitável pela

  ANAC.

  (2) Todos os voos de avaliação operacional devem ser realizados segundo requisitos aplicáveis

  de operação e de manutenção dos RBAC nº 121 ou 135.'
