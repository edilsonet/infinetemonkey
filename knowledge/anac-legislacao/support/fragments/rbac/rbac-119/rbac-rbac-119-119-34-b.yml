title: 119.34(b)
text: '(b) A ANAC emitirá uma carta de autorização (Letter of Authorization - LOA) para cada

  requerente, definindo os servidores designados da ANAC que acompanharão os voos de avaliação

  operacional.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
