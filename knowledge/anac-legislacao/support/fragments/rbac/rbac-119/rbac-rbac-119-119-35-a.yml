cite: 119.35(a)
title: 119.35(a)
text: '(a) Um requerente de COA, segundo este regulamento, deverá apresentar um requerimento:

  (1) no formato e da maneira estabelecida pela ANAC; e


  Data da emissão: 11 de fevereiro de 2021.


  (2) contendo todas as informações solicitadas pela ANAC ao requerente.'
