section_title: Requisitos para requerimento para certificação. Todos os operadores
subsection_id: b
cite: 119.35(b)
title: 119.35(b)
text: '(b) O requerente deverá encaminhar como anexo a seu requerimento uma Declaração de

  Conformidade Inicial referenciando todas as seções do RBHA 91 e, conforme aplicável, do
  RBAC

  nº 135 ou 121. Este anexo deve ser uma listagem completa de todas as seções e requisitos
  dos RBAC

  correspondentes à operação pretendida pelo requerente, com o correspondente método de

  conformidade a ser adotado por ela ou uma indicação de que o requisito não lhe seja aplicável.'
