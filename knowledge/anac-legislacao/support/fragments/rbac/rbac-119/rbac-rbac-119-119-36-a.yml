title: 119.36(a)
text: '(a) Os requisitos econômicos, financeiros e jurídicos necessários à obtenção da autorização

  jurídica de funcionamento de uma empresa de transporte aéreo público são estabelecidos em
  normas

  específicas da Superintendência de Acompanhamento de Serviços Aéreos (SAS) da ANAC. A ANAC

  requer que seja demonstrado haver capital suficiente para fazer frente aos custos já gerados
  ou a serem

  gerados pela execução dos programas de treinamento e de manutenção aprovados, incluindo
  os custos

  operacionais previstos, sempre considerando uma reserva para contingências, visando determinar
  a

  saúde financeira do requerente. (Redação dada pela Resolução nº 526, de 06.08.2019)'
