title: 119.36(b)
text: '(b) Se por razões econômicas, financeiras ou jurídicas o detentor de certificado não
  for mais capaz

  de conduzir uma operação segura, seu certificado deixará de ser válido, ensejando as sanções

  previstas no parágrafo (a)(2) da seção 119.40.'
