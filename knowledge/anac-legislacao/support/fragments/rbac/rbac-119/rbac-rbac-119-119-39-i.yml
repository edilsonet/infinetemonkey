section_id: '119.39'
section_title: Emissão, ou indeferimento de um certificado
subsection_id: i
cite: 119.39(i)
title: 119.39(i)
text: '(i) o requerente não está própria e adequadamente equipado ou não é capaz de conduzir

  operações com a segurança requerida pelos RBAC aplicáveis; ou (Redação dada pela Resolução
  nº

  503, de 07.02.2019)

  (ii) o requerente pretende colocar ou colocou em uma posição administrativa listada em

  119.65(a) ou em 119.69(a), como aplicável, uma pessoa com comprovado histórico de conduta
  e/ou

  desempenho inadequados. Para os efeitos do disposto neste parágrafo, consideram-se comprovado

  histórico de conduta e/ou desempenho inadequados os casos em que, há menos de cinco anos

  contados da data da designação:

  (A) em decorrência de constatação de irregularidade em que o designado tenha

  comprovadamente responsabilidade direta pela causa da irregularidade, enquanto ocupante
  de

  posição administrativa requerida pela ANAC, tenha sido aplicada, a um provedor de serviço
  de

  aviação civil certificado pela ANAC, uma medida de:

  ( 1 ) suspensão ou restrição das operações por mais de 90 dias pela ANAC; ou

  ( 2 ) revogação, cassação ou cancelamento de certificados ou autorizações; ou

  (B) o designado tenha sofrido sanção administrativa capitulada no art. 299, incisos I, V,

  VI ou VII, da Lei nº 7.565, de 19 de dezembro de 1986, ainda que naquelas ocasiões não ocupasse

  uma posição administrativa requerida pela ANAC para um provedor de serviço de aviação civil;
  ou

  (Redação dada pela Resolução nº 503, de 07.02.2019)

  (2) uma pessoa que terá controle sobre o requerente, ou que tem substancial parcela na

  propriedade da empresa, possuiu controle sobre um detentor de certificado ou parcela similar
  de

  propriedade de uma empresa cujo certificado tenha sido suspenso ou cassado, e essa pessoa
  tenha

  contribuído materialmente para as circunstâncias causadoras da suspensão ou cassação.'
