text: '(v) dispõe de uma aeronave ou mais aeronaves das quais seja explorador;

  (vi) tenha contratado seguros que cubram sua responsabilidade em casos de acidentes, em

  particular a respeito aos passageiros, a bagagem, a carga e terceiros.'
