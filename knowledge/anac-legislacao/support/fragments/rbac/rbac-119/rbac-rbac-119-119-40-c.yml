section_title: Validade de um certificado
subsection_id: c
cite: 119.40(c)
title: 119.40(c)
text: '(c) O detentor de certificado tem a obrigação de manter, durante todo o período de
  duração de um

  certificado, conformidade com toda a legislação aplicável à sua operação e o cumprimento
  de todos

  os procedimentos e solicitações feitos pela ANAC.

  (1) O detentor de certificado deve, mediante determinação da ANAC, no prazo de 30 (trinta)

  dias, extensível pela ANAC por igual período, substituir qualquer pessoa que ocupe uma posição
  de

  gestão listada em 119.65(a) ou em 119.69(a), como aplicável, e que possua comprovado histórico
  de

  conduta e/ou desempenho inadequados, conforme os critérios do parágrafo 119.39(b)(1)(ii).
  (Incluído

  pela Resolução nº 503, de 07.02.2019)'
