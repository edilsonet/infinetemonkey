section_title: Emendas ao certificado
subsection_id: a
cite: 119.41(a)
title: 119.41(a)
text: '(a) A ANAC pode emendar qualquer certificado emitido segundo este regulamento se:

  (1) for verificado, após as verificações necessárias, que a segurança do transporte aéreo
  e o

  interesse público requerem a emenda; ou

  (2) o detentor do certificado requerer a emenda e a ANAC verificar que a segurança do

  transporte aéreo e o interesse público permitem a emenda.'
