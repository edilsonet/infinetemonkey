text: '(b) Se for constatado através de inspeção, verificação ou outro tipo de investigação
  que o interesse

  público ou a segurança do transporte aéreo assim o requerem, a ANAC pode emendar, suspender,

  revogar ou cassar, total ou parcialmente, um COA. (Redação dada pela Resolução nº 526, de

  06.08.2019)'
