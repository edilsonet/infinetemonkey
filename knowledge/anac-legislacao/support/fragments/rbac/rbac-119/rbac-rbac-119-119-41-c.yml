cite: 119.41(c)
title: 119.41(c)
text: '(c) Quando um detentor de certificado requerer uma emenda a seu certificado, o seguinte

  procedimento se aplica:

  (1) o detentor do certificado deve apresentar um requerimento á ANAC com uma antecedência

  de, pelo menos, 45 dias antes da data para a emenda proposta tornar-se efetiva, a menos
  que à ANAC

  aceite um prazo menor; e

  (2) o requerimento deve ser preenchido no formato e da maneira prevista pela ANAC.'
