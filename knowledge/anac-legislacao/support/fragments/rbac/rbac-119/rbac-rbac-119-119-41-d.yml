cite: 119.41(d)
title: 119.41(d)
text: '(d) Quando um detentor de certificado solicitar reconsideração de uma decisão tomada
  pela ANAC

  referente a emendas ao seu certificado, o seguinte procedimento é aplicável;

  (1) a petição para reconsideração deve ser feita dentro dos 30 dias após a data em que o
  detentor

  recebeu a notícia do indeferimento; e

  (2) a petição para reconsideração deve ser feita à ANAC.'
