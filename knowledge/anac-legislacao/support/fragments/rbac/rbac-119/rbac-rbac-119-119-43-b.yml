section_title: Obrigações do detentor de certificado em relação às suas especificações operativas
subsection_id: b
cite: 119.43(b)
title: 119.43(b)
text: '(b) Cada detentor de certificado deve inserir extratos pertinentes de suas especificações
  operativas,

  ou referências aos mesmos, no Manual Geral de Operações e deve:

  (1) identificar claramente tais extratos como partes de suas especificações operativas;
  e

  (2) estabelecer que a conformidade com os requisitos das especificações operativas é

  mandatória.'
