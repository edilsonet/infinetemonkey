section_title: Obrigações do detentor de certificado em relação às suas especificações operativas
subsection_id: d
cite: 119.43(d)
title: 119.43(d)
text: '(d) Em suas operações, cada detentor de certificado deve manter em suas aeronaves uma
  cópia fiel

  das partes relevantes de suas especificações operativas. Operadores que atuam no estrangeiro
  devem

  manter uma cópia fiel traduzida para o inglês das partes relevantes de suas especificações
  operativas

  em cada aeronave que realize tais operações.'
