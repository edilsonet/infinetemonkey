cite: 119.47(a)
title: 119.47(a)
text: '(a) Cada detentor de certificado deve possuir uma sede administrativa e uma base principal
  de

  operações. Deve estabelecer, também, uma base principal de manutenção que pode estar localizada

  na mesma localidade da base principal de operações ou em local diferente.'
