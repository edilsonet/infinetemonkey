cite: 119.47(b)
title: 119.47(b)
text: '(b) Pelo menos 90 dias antes da data proposta para mudança de endereço de sua sede

  administrativa, de sua base principal de operações ou de sua base principal de manutenção,
  o detentor

  de certificado deve prover comunicação escrita de suas intenções à ANAC.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
