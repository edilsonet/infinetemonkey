cite: 119.49(b)
title: 119.49(b)
text: '(b) Cada detentor de certificado conduzindo operações não regulares sob o RBAC 121
  deve obter

  especificações operativas contendo, pelo menos, as informações abaixo: (Redação dada pela

  Resolução nº 526, de 06.08.2019)

  (1) a localização específica da sede operacional; e

  (2) outros nomes comerciais sob os quais o detentor de certificado pode operar, conforme
  seu

  COA; (Redação dada pela Resolução nº 526, de 06.08.2019)

  (3) referência à autorização para exploração de serviços aéreos públicos não-regulares emitida

  ou a ser emitida pela ANAC;

  (4) tipo da aeronave, marcas de matrícula e número de série de cada aeronave de utilização

  autorizada. Adicionalmente:'
