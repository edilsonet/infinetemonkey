cite: 119.49(c)
title: 119.49(c)
text: '(c) Cada detentor de certificado conduzindo operações não regulares sob o RBAC 135
  deve obter

  especificações operativas contendo, pelo menos, as informações abaixo: (Redação dada pela

  Resolução nº 526, de 06.08.2019)

  (1) a localização específica da sede operacional do detentor de certificado; e

  (2) outros nomes comerciais sob os quais o detentor de certificado pode operar, conforme
  seu

  COA; (Redação dada pela Resolução nº 526, de 06.08.2019)

  (3) referência à autorização para exploração de serviços aéreos públicos não-regulares emitida

  ou a ser emitida pela ANAC;

  (4) características e áreas de operações autorizadas; (Redação dada pela Resolução nº 526,
  de

  06.08.2019)

  (5) categorias e classes de aeronaves que podem ser usadas naquelas operações;

  (6) tipo de aeronave, marcas de matrícula e número de série de cada aeronave que estiver
  sujeita

  a um programa de manutenção de aeronavegabilidade requerido por 135.411(a)(2). Adicionalmente:'
