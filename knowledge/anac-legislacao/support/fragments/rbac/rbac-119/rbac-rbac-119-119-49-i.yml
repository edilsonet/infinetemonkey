section_title: Conteúdo das especificações operativas
subsection_id: i
cite: 119.49(i)
title: 119.49(i)
text: '(i) sujeito à aprovação da ANAC quanto à forma e conteúdo, o detentor de certificado
  pode

  incorporar por referência os itens listados no parágrafo (b)(4) desta seção através da manutenção
  de

  um documento atualizado e pela referência a tal documento no parágrafo aplicável da especificação

  operativa; e

  (ii) o detentor do certificado não pode conduzir operação utilizando aeronave não

  listada. (Redação dada pela Resolução nº 526, de 06.08.2019)

  (5) características de operações autorizadas; (Redação dada pela Resolução nº 526, de

  06.08.2019)

  (6) autorizações e limitações para rotas e áreas de operação;

  (7) autorizações e limitações especiais de aeródromos;

  (8) limitações de tempo, ou padrões para determinar limitações de tempo para revisões gerais

  (overhaul), inspeções verificações em células, motores, hélices, rotores, dispositivos e
  equipamentos

  de emergência;


  Data da emissão: 11 de fevereiro de 2021.


  (9) autorização para o método de controlar peso e balanceamento de aeronaves;

  (10) informações sobre “wet leasing” de aeronave como requerido por 119.53(c);

  (11) autorizações ou requisitos para conduzir operações não regulares como previsto em

  119.21; (Redação dada pela Resolução nº 526, de 06.08.2019)

  (12) qualquer autorização para desvio ou exceção referente a qualquer requisito dos RBAC;
  e

  (13) uma autorização permitindo ou uma proibição de aceitação, manuseio e transporte de

  artigos perigosos na forma e maneira estabelecida pela ANAC; e

  (14) qualquer outro item que a ANAC julgar necessário.'
