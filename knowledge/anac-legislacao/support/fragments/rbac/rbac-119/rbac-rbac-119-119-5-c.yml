cite: 119.5(c)
title: 119.5(c)
text: '(c) Proibições.

  (1) É vedado realizar serviços de transporte aéreo público sem um apropriado COA e

  respectivas EO emitidos segundo este regulamento.

  (2) É vedado a um detentor de um COA emitido segundo este regulamento realizar operações

  em desacordo com o previsto em suas EO.

  (3) O detentor de um COA só pode conduzir serviços aéreos privados em seu próprio proveito

  (translado, treinamento de tripulantes, transporte de empregados, etc.).

  (4) É vedado fazer propaganda ou oferecer-se para realizar uma operação sujeita a este

  regulamento, exceto se a operação for autorizada pela ANAC.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
