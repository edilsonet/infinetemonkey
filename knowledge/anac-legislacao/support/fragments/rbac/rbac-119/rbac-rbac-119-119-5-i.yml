title: 119.5(i)
text: '(i) os requisitos estabelecidos conforme a seção 119.21 deste regulamento;

  (ii) as apropriadas autorizações, limitações e procedimentos estabelecidos nas EO e

  procedimentos especificados para cada característica de operação.

  (2) Uma pessoa certificada para engajar-se em operações de transporte aéreo público segundo

  o RBAC nº 121, RBAC nº 135, ou ambos receberão apenas um COA.'
