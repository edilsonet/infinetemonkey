cite: 119.51(a)
title: 119.51(a)
text: '(a) A ANAC pode emendar qualquer especificação operativa emitida segundo esta subparte
  se:

  (Redação dada pela Resolução nº 463, de 07.02.2018)

  (1) for verificado, após as verificações necessárias, que a segurança do transporte aéreo
  e o

  interesse público requerem a emenda; ou

  (2) o detentor do certificado requerer a emenda e a ANAC verificar que a segurança do

  transporte aéreo e o interesse público permitem a emenda.

  (3) Se a ANAC emitir uma emenda às especificações operativas, ela entra em vigor a não menos

  de 30 dias após o detentor de certificado ser notificado sobre ela, a menos que:'
