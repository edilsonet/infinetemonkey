cite: 119.51(i)
title: 119.51(i)
text: '(i) a ANAC considere que existe uma emergência relativa à segurança do transporte aéreo

  requerendo ação imediata.

  (A) Se a ANAC aprovar a emenda proposta, esta tornar-se-á efetiva na data da aprovação.

  (B) A ANAC enviará uma notificação ao detentor de certificado, onde explicará as razões

  pelas quais considerou existir uma emergência relativa à segurança das operações requerendo
  ação

  imediata ou tornando impraticável ou contrário ao interesse público esperar a entrada em
  vigor da(s)

  emenda(s).'
