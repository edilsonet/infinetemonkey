section_title: Arrendamento de aeronaves com tripulação (“Wet leasing”) e outros arranjos
  para
subsection_id: a
cite: 119.53(a)
title: 119.53(a)
text: '(a) A menos que de outra forma autorizada pela ANAC, um detentor de certificado emitido

  segundo este regulamento antes de colocar em vigor um contrato de “wet leasing

  ” pelo qual ele deve

  ceder uma aeronave com tripulação para outro detentor de certificado emitido segundo este

  regulamento, ambos autorizados a conduzir operações de transporte aéreo público segundo
  um

  mesmo RBAC, deve prover à ANAC uma cópia do contrato de “wet leasing

  ” a ser executado, pelo

  qual ele (arrendador) entregará a aeronave com tripulação a outra pessoa (arrendatário).
  (Redação

  dada pela Resolução nº 463, de 07.02.2018)'
