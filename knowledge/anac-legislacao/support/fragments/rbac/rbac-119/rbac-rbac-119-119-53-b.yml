section_title: Arrendamento de aeronaves com tripulação (“Wet leasing”) e outros arranjos
  para
subsection_id: b
cite: 119.53(b)
title: 119.53(b)
text: '(b) Nenhum detentor de certificado emitido segundo este regulamento pode efetuar contratos
  de

  “wet leasing

  ” (como arrendatário) com uma empresa aérea estrangeira ou com qualquer outra pessoa

  estrangeira ou, ainda, com qualquer pessoa não autorizada a engajar-se em serviços de transporte

  aéreo público (como arrendador). (Redação dada pela Resolução nº 463, de 07.02.2018)'
