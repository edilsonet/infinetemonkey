cite: 119.53(c)
title: 119.53(c)
text: '(c) Ao receber cópia de um contrato de “wet leasing

  ” a ANAC verifica se o arrendatário tem

  condições de assumir o controle operacional da aeronave e, caso positivo, emite emendas
  às

  especificações operativas de cada parte do contrato, como necessário. Caso seja verificado
  que o

  arrendatário não tem condições de assumir o controle operacional da aeronave, o contrato
  não pode

  ser executado. O arrendador deve prover, pelo menos, as seguintes informações para serem

  incorporadas às especificações operativas de ambas as partes:

  (1) os nomes das partes do contrato e a duração do mesmo;

  (2) as marcas de nacionalidade e de matrícula de cada aeronave envolvida na operação;

  (3) as características de operação; (Redação dada pela Resolução nº 526, de 06.08.2019)

  (4) os aeródromos ou as áreas de operação; e


  Data da emissão: 11 de fevereiro de 2021.


  (5) caso o contrato permita que as partes realizem voos intercalados sob controle operacional

  de uma e de outra parte, uma declaração especificando a parte considerada como tendo o controle

  operacional da aeronave em cada voo e os horários, aeródromos ou áreas nas quais tal controle
  é

  exercido.'
