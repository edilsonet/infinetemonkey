cite: 119.53(e)
title: 119.53(e)
text: '(e) Outros arranjos para transporte aéreo:

  (1) um detentor de COA emitido segundo este regulamento e operando segundo os RBAC nº

  121 ou 135 não pode conduzir operação para outro detentor de COA ou para um operador aéreo

  estrangeiro operando segundo o RBAC nº 129 ou, ainda, para um estrangeiro engajado em transporte

  aéreo público somente fora do Brasil, exceto se ele possuir outorga para operar transporte
  aéreo

  público emitida pela ANAC, conforme aplicável, e esteja autorizado pelas suas EO. (Redação
  dada

  pela Resolução nº 526, de 06.08.2019)'
