subsection_id: f
cite: 119.53(f)
title: 119.53(f)
text: '(f) Um detentor de COA emitido segundo este regulamento, se autorizado pela ANAC a
  conduzir

  operações regulares, pode realizar um ou mais voos extras para passageiros que tenham ficado
  retidos

  pelo cancelamento de seus voos regulares. Tais voos devem ser conduzidos segundo as regras

  aplicáveis às operações não regulares. (Redação dada pela Resolução nº 526, de 06.08.2019)'
