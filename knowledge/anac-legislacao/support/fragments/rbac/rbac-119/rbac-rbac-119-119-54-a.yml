section_title: Aplicação do Artigo 83-bis do Convênio Internacional de Aviação Civil
subsection_id: a
cite: 119.54(a)
title: 119.54(a)
text: '(a) Não obstante ao artigos 12, 30, 31 e 32(a) do Convênio Internacional de Aviação
  Civil

  (Chicago, 1944), quando uma aeronave com matrícula válida de um Estado contratante seja
  explorada

  sob um contrato de arrendamento, fretamento ou intercâmbio de aeronaves ou qualquer outro
  arranjo

  similar, por um explorador que não tenha sua sede operacional ou que não tenha sua residência

  permanente neste Estado, o Estado de matrícula, mediante acordo com aquele Estado, poderá

  transferir todas ou partes de suas funções e obrigações como Estado de matrícula da referida
  aeronave

  segundo os artigos 12, 30, 31 e 32(a). Desta forma, o Estado de matrícula ficará isento
  das funções e

  obrigações transferidas. (Redação dada pela Resolução nº 503, de 07.02.2019)'
