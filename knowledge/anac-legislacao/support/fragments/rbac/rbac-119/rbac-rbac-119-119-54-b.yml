cite: 119.54(b)
title: 119.54(b)
text: '(b) A transferência não produzirá efeitos em relação aos demais Estados contratantes
  até que o

  acordo mencionado seja registrado no Conselho da OACI e publicado conforme com o artigo
  83 bis

  ou que uma das partes do acordo tenha comunicado diretamente a existência e abrangência
  do mesmo

  aos demais estados contratantes. (Redação dada pela Resolução nº 503, de 07.02.2019)'
