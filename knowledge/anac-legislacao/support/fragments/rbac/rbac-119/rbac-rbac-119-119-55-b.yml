section_title: Obtenção de desvio para conduzir operações sob um contrato com as forças armadas
subsection_id: b
cite: 119.55(b)
title: 119.55(b)
text: '(b) O detentor de certificado que possuir um contrato com o Ministério da Defesa deve
  submeter

  a este Ministério um requerimento para obtenção de desvios dos RBAC, se necessários. O Ministério

  de Defesa deve fazer uma análise do requerimento recebido e encaminhar à ANAC uma proposta

  consolidando suas necessidades com as necessidades do detentor de certificado.'
