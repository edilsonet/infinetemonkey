section_title: Obtenção de desvio para conduzir operações sob um contrato com as forças armadas
subsection_id: c
cite: 119.55(c)
title: 119.55(c)
text: '(c) A ANAC pode autorizar desvios para executar operações sob um contrato militar sob
  as

  seguintes condições:

  (1) o Ministério da Defesa comunicar à ANAC que a operação é essencial para a defesa

  nacional; e

  (2) o Ministério da Defesa comunicar que a operação não pode ser realizada sem que os desvios

  sejam autorizados; e

  (3) o detentor de certificado executar a operação sob um contrato em benefício das Forças

  Armadas Brasileiras; e

  (4) a ANAC considerar que os desvios têm base no interesse público e não apenas em vantagens

  econômicas para o detentor de certificado e para o País.'
