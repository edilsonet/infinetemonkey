section_title: Obtenção de autorização de desvio para executar uma operação de emergência
subsection_id: a
cite: 119.57(a)
title: 119.57(a)
text: '(a) Em condições de emergência, a ANAC pode autorizar desvios se:

  (1) as referidas condições exigirem o transporte de pessoas ou de suprimentos para a proteção

  de vidas ou propriedades; e

  (2) a ANAC considerar que os desvios são necessários para a condução expedita das operações.'
