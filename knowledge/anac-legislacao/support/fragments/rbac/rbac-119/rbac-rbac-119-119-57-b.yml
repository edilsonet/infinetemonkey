text: '(b) Quando a ANAC autorizar desvios para operações sob condições de emergência:

  (1) deve ser emitida uma emenda apropriada às especificações operativas do detentor de

  certificado; ou

  (2) se a natureza da emergência não permitir tempo útil para a emissão dessa emenda:'
