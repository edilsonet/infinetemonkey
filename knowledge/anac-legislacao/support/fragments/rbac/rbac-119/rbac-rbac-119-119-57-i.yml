section_title: Obtenção de autorização de desvio para executar uma operação de emergência
subsection_id: i
cite: 119.57(i)
title: 119.57(i)
text: '(i) a ANAC pode autorizar os desvios oralmente; e

  (ii) o detentor de certificado deverá enviar à ANAC documentação descrevendo a natureza

  da emergência dentro das 24 horas após o término da operação.'
