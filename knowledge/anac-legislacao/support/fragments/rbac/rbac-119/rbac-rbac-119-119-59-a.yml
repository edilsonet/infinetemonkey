cite: 119.59(a)
title: 119.59(a)
text: '(a) A qualquer tempo ou lugar, a ANAC pode realizar uma inspeção ou um ensaio para
  verificar

  se um detentor de certificado emitido segundo este regulamento está conforme com o Código

  Brasileiro de Aeronáutica (CBA), com os RBAC aplicáveis, com seu certificado e com suas

  especificações operativas.


  Data da emissão: 11 de fevereiro de 2021.


  (1) A ANAC é representada em ensaios, inspeções e fiscalizações por seus servidores

  designados que têm suas prerrogativas previstas na Resolução nº 472, de 6 de junho de 2018.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
