title: 119.59(d)
text: '(d) A ANAC pode estabelecer a capacidade e a competência do detentor de certificado
  para manter

  a posse de seu apropriado certificado e/ou de suas especificações operativas através da
  análise dos

  dados contidos no parágrafo (a) desta seção ou de quaisquer outros dados aplicáveis.'
