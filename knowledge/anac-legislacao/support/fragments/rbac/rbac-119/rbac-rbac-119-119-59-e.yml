title: 119.59(e)
text: '(e) A falha de um detentor de certificado em tornar prontamente disponível para a ANAC,
  quando

  solicitado, seu apropriado certificado, suas especificações operativas ou qualquer registro,
  documento

  ou relatório requerido é motivo para a suspensão total ou parcial do referido certificado
  e

  especificações operativas.'
