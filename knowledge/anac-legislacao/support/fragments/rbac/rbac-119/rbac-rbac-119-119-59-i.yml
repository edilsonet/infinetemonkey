cite: 119.59(i)
title: 119.59(i)
text: '(i) seu COA e suas EO; e (Redação dada pela Resolução nº 526, de 06.08.2019)

  (ii) uma listagem atualizada que inclua a localização e as pessoas responsáveis pela

  conservação de cada registro, documento e relatório, relativos à operação do detentor de
  certificado,

  cuja conservação seja requerida na forma e maneira estabelecida pela ANAC .

  (2) permitir que a ANAC faça qualquer ensaio ou inspeção necessária para determinar

  conformidade em relação a qualquer assunto constante do parágrafo (a) desta seção.'
