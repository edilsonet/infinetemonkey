section_title: Validade das especificações operativas
subsection_id: a
cite: 119.61(a)
title: 119.61(a)
text: '(a) Especificações operativas emitidas segundo este regulamento, são efetivas a até
  que:

  (1) a ANAC suspenda, revogue , casse ou, de outra forma, cancele o certificado;

  (2) as especificações operativas sejam emendadas como estabelecido em 119.51;

  (3) o detentor do certificado deixe de conduzir uma operação de determinada característica
  por

  período superior ao período especificado em 119.63 ou deixe de seguir os procedimentos de
  119.63

  ao reiniciar aquela operação; ou (Redação dada pela Resolução nº 526, de 06.08.2019)

  (4) a ANAC suspenda ou revogue as especificações operativas.'
