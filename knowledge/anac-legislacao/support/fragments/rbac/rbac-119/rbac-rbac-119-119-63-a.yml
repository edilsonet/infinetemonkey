title: 119.63(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, nenhum detentor de certificado
  pode

  conduzir uma operação com determinada característica para a qual ele está autorizado em
  suas

  especificações operativas, a menos que tenha conduzido tal operação dentro do número de
  dias

  calendáricos consecutivos conforme este parágrafo;

  (1) para operações regulares - 60 dias; e


  Data da emissão: 11 de fevereiro de 2021.


  (2) para operações não regulares - 90 dias, exceto que este parágrafo não se aplica se o
  detentor

  de certificado tiver autorização para conduzir operações regulares e tiver conduzido tais
  operações

  dentro dos 30 dias anteriores.'
