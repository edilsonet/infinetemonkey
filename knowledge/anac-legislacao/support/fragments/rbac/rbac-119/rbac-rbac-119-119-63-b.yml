cite: 119.63(b)
title: 119.63(b)
text: '(b) Se um detentor de certificado não conduzir uma característica de operação para
  a qual está

  autorizado por suas especificações operativas, dentro do número de dias calendáricos previstos
  no

  parágrafo (a) desta seção, não poderá conduzir a mesma característica de operação, a menos
  que:

  (1) ele avise à ANAC pelo menos 15 dias calendáricos consecutivos antes de retomar aquela

  característica de operação; e

  (2) ele esteja disponível e acessível durante o período previsto em (b)(1) para a eventualidade

  da ANAC decidir conduzir uma inspeção e reexame para verificar se o detentor de certificado

  permanece adequada e propriamente equipado e capaz de conduzir operações seguras.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
