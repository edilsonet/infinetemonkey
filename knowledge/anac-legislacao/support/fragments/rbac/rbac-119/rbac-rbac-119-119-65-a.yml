section_title: Pessoal de administração requerido para operações conduzidas segundo o RBAC
  121
subsection_id: a
cite: 119.65(a)
title: 119.65(a)
text: '(a) Cada detentor de certificado deve possuir pessoal técnico e administrativo suficiente
  e

  qualificado para assegurar alto grau de segurança em suas operações. O detentor de certificado
  deve

  ter pessoal qualificado servindo nas seguintes posições ou posições equivalentes:

  (1) Diretor ou Gerente de Segurança Operacional.

  (2) Diretor ou Gerente de Operações.

  (3) Piloto Chefe.

  (4) Diretor ou Gerente de Manutenção.

  (5) Inspetor Chefe.

  (6) Gestor Responsável da Empresa de Transporte Aéreo.'
