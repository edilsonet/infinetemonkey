section_title: Pessoal de administração requerido para operações conduzidas segundo o RBAC
  121
subsection_id: b
cite: 119.65(b)
title: 119.65(b)
text: '(b) A ANAC pode aprovar posições ou número de posições diferentes daquelas listadas
  no

  parágrafo (a) desta seção para uma particular operação, se o detentor ou requerente do certificado

  demonstrar que ele pode realizar essa operação com o mais alto grau de segurança sob a direção
  de

  um número menor ou diferentes categorias de pessoal de administração devido:

  (1) à característica de operação envolvida; (Redação dada pela Resolução nº 526, de

  06.08.2019)

  (2) ao número e tipo de aviões envolvidos; e

  (3) à área de operações.'
