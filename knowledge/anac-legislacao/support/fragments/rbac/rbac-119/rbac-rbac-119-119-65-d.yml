title: 119.65(d)
text: '(d) As pessoas que servem nas posições requeridas ou aprovadas segundo os parágrafos
  (a) ou (b)

  desta seção e quaisquer outras em uma posição exercendo controle sobre operações conduzidas

  segundo o certificado da empresa devem: (Redação dada pela Resolução nº 503, de 07.02.2019)

  (1) ser qualificadas através de treinamento, experiência e competência; (Redação dada pela

  Resolução nº 503, de 07.02.2019)


  Data da emissão: 11 de fevereiro de 2021.


  (2) na extensão de suas responsabilidades, demonstrar entendimento das seguintes matérias
  no

  que diz respeito às operações do detentor de certificado: (Redação dada pela Resolução nº
  503, de

  07.02.2019)'
