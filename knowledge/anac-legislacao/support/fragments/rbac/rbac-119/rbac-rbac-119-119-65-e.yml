subsection_id: e
cite: 119.65(e)
title: 119.65(e)
text: '(e) Cada detentor de certificado deve:

  (1) estabelecer nas provisões de política geral do manual requerido pelo RBAC 121.133 os

  deveres, responsabilidades e autoridade do pessoal requerido pelo parágrafo (a) desta seção;

  (2) listar no manual os nomes e endereços comerciais dos indivíduos designados para aquelas

  posições; e

  (3) notificar à ANAC, no prazo de 10 dias, qualquer modificação no pessoal ou qualquer vaga

  aberta em qualquer das posições listadas.'
