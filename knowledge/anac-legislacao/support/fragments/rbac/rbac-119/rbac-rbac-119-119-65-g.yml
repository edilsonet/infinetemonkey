subsection_id: g
cite: 119.65(g)
title: 119.65(g)
text: '(g) Cada empresa deve adotar uma estrutura administrativa que permita a implantação
  e a

  manutenção do Sistema de Gerenciamento da Segurança Operacional (SGSO), visando atingir
  o nível

  aceitável de segurança a ser estabelecido pela ANAC. Cabe ao Diretor ou Gerente de Segurança

  Operacional a administração do referido sistema dentro da empresa. (Redação dada pela Resolução

  nº 503, de 07.02.2019)'
