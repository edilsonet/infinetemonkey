subsection_id: a
cite: 119.67(a)
title: 119.67(a)
text: '(a) O detentor de certificado deve designar como Diretor ou Gerente de Segurança Operacional,

  conforme 119.65(a), uma pessoa que atenda aos critérios de competência, experiência e treinamento

  estabelecidos pelo detentor de certificado para exercício dessa função perante a ANAC. (Redação

  dada pela Resolução nº 503, de 07.02.2019)'
