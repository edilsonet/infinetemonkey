subsection_id: b
cite: 119.67(b)
title: 119.67(b)
text: '(b) Para atuar como Diretor ou Gerente de Operações, conforme 119.65(a), de um detentor
  de

  certificado uma pessoa deve possuir:

  (1) uma licença de Piloto de Linha Aérea, ou

  (2) uma licença de PC, em detentores de certificado em cujas operações o piloto em comando

  necessita apenas licença de Piloto Comercial (PC) Se for requerida qualificação para vôo
  por

  instrumentos (IFR) para qualquer piloto em comando do detentor de certificado, o Diretor
  ou Gerente

  de Operações deve, também, possuir qualificação IFR.


  Data da emissão: 11 de fevereiro de 2021.


  (3) pelo menos, 3 anos de experiência, dentro dos últimos 6 anos, como gerente ou supervisor

  em uma posição exercendo controle operacional sobre qualquer operação, utilizando aviões,

  certificados pelo RBAC 25, conduzida segundo o RBAC 121 ou 135; se o detentor do certificado

  apenas utilizar aviões não certificados pelo RBAC 25 em suas operações, a experiência requerida

  poderá ser obtida em operações nestes aviões, e'
