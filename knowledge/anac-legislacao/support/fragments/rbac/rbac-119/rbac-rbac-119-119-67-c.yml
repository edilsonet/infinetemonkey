section_title: 'Pessoal de administração: qualificações para operações conduzidas segundo
  o RBAC'
subsection_id: c
cite: 119.67(c)
title: 119.67(c)
text: '(c) Para atuar como Piloto Chefe segundo 119.65(a) uma pessoa deve possuir uma licença
  de PLA

  com o apropriado Certificado de Habilitação Técnica (CHT) para o avião mais complexo usado
  pelo

  detentor de certificado em suas operações; e

  (1) no caso de uma pessoa com experiência prévia como Piloto Chefe, ter pelo menos 3 anos

  de experiência como piloto em comando de aviões, certificados pelo RBAC 25, operados segundo
  os

  RBAC 121 ou 135. Se o detentor do certificado utilizar apenas aviões não certificados pelo
  RBAC

  25 em suas operações, a experiência poderá ter sido obtida nestes aviões.

  (2) no caso de uma pessoa sem experiência prévia como Piloto Chefe, ter pelo menos 3 anos
  de

  experiência, dentro dos últimos 6 anos, como piloto em comando de aviões, certificados pelo
  RBAC

  25, operados segundo os RBAC 121 ou 135. Se o detentor do certificado utilizar apenas aviões
  não

  certificados pelo RBAC 25 em suas operações, a experiência poderá ter sido obtida nestes
  aviões.

  (3) os requisitos de experiência de voo do parágrafo (c)(1) desta seção podem ser atendidos
  por

  pilotos das Forças Armadas, da reserva, que tenham exercido funções de controle operacional
  em

  unidades aéreas operando aviões militares que possam ser enquadrados na definição de aviões

  certificados pelo RBAC 25 em termos de peso máximo de decolagem ou que exerceram atividades

  de INSPAC Piloto ou Operações por 3 anos, dentro dos últimos 9 anos.'
