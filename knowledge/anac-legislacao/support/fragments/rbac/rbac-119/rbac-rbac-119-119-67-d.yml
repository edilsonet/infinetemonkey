section_title: 'Pessoal de administração: qualificações para operações conduzidas segundo
  o RBAC'
subsection_id: d
cite: 119.67(d)
title: 119.67(d)
text: '(d) Para atuar como Diretor ou Gerente de Manutenção segundo 119.65(a) uma pessoa deve:

  (1) possuir título - seja técnico industrial, técnico de nível superior (tecnólogo) ou engenheiro

  - e ser registrado junto ao respectivo conselho de fiscalização da profissão com atribuição
  profissional

  coerente com a atividade desempenhada; (Redação dada pela Resolução nº 552, de 29.04.2020)

  (2) ter 1 (um) ano de experiência em postos de responsabilidade, com autoridade administrativa,

  de serviços de manutenção ou modificações em aviões; (Redação dada pela Resolução nº 463,
  de

  07.02.2018)

  (3) ter 3 (três) anos de experiência dentro dos últimos 6 (seis) anos em atividades profissionais

  relacionadas a manutenção de produtos aeronáuticos para um detentor de certificado ou organização

  de manutenção aeronáutica; e (Incluído pela Resolução nº 463, de 07.02.2018)

  (4) Ter realizado curso em um dos aviões de maior motorização operados pelo detentor de

  certificado ou ter experiência prática em atividades de manutenção em aviões de mesma categoria
  de


  Data da emissão: 11 de fevereiro de 2021.


  certificação de tipo e motorização similar operados pelo detentor de certificado. (Incluído
  pela

  Resolução nº 463, de 07.02.2018)'
