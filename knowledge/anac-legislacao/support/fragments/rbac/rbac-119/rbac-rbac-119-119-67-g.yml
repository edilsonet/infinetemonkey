subsection_id: g
cite: 119.67(g)
title: 119.67(g)
text: '(g) O detentor de certificado deve designar um Gestor Responsável, que seja a pessoa
  única e

  identificável na estrutura organizacional do detentor de certificado que, independentemente
  de outras

  atribuições, possua as seguintes prerrogativas:

  (1) tenha a autoridade final sobre as operações conduzidas sob os regulamentos aplicáveis
  ao

  detentor de certificado;

  (2) decida sobre a alocação de recursos humanos, financeiros e técnicos do detentor de

  certificado; e

  (3) seja o responsável por prestar contas pelo desempenho de segurança operacional do detentor

  de certificado.

  (Incluído pela Resolução nº 503, de 07.02.2019)'
