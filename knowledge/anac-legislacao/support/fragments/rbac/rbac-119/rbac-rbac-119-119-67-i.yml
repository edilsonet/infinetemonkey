subsection_id: i
cite: 119.67(i)
title: 119.67(i)
text: '(i) adicionalmente, pelo menos, 3 anos de experiência como piloto em comando de um
  avião,

  certificado pelo RBAC 25, operado segundo os RBAC 121 ou 135.

  (4) sem experiência prévia na função, pelo menos 3 anos de experiência, dentro dos últimos
  6

  anos, como piloto em comando de um avião, certificados pelo RBAC25, operando segundo o RBAC

  121 ou 135; se o detentor do certificado possuir apenas aviões não certificados pelo RBAC
  25 a

  experiência requerida poderá ter sido obtida nestes aviões;

  (5) os requisitos de experiência administrativa do parágrafo (3) e de voo do parágrafo (3)(i)

  desta seção podem ser atendidos por pilotos das Forças Armadas, da reserva, que tenham exercido

  funções de controle operacional em unidades aéreas operando aviões militares que possam
  ser

  enquadrados na definição de aviões certificados pelo RBAC 25 em termos de peso máximo de

  decolagem ou que exerceram atividades de INSPAC OPS por 3 anos, dentro dos últimos 9 anos.'
