cite: 119.69(a)
title: 119.69(a)
text: '(a) Cada detentor de certificado deve possuir pessoal técnico e administrativo suficiente
  e

  qualificado para assegurar alto grau de segurança em suas operações. O detentor de certificado
  deve

  ter pessoal qualificado trabalhando nas seguintes posições ou posições equivalentes:

  (1) Diretor ou Gerente de Operações;

  (2) Piloto Chefe;


  Data da emissão: 11 de fevereiro de 2021.


  (3) Diretor ou Gerente de Manutenção;

  (4) Diretor ou Gerente de Segurança Operacional.

  (5) Gestor Responsável da Empresa de Transporte Aéreo, e'
