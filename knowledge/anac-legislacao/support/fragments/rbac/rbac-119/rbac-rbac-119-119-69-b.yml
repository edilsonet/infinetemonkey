section_title: Pessoal de administração requerido para operações conduzidas segundo o RBAC
  135
subsection_id: b
cite: 119.69(b)
title: 119.69(b)
text: '(b) A ANAC pode aprovar posições e números de posições diferentes daquelas listadas
  no

  parágrafo (a) desta seção para uma particular operação se o detentor ou requerente do certificado

  demonstrar que ele pode realizar a operação com alto grau de segurança sob a direção de
  um número

  menor ou diferentes categorias de pessoal de administração, segundo as especificidades abaixo:

  (1) características de operação envolvida; (Redação dada pela Resolução nº 526, de 06.08.2019)

  (2) número e tipo de aeronaves envolvidas; e:

  (3) à área de operações.

  (4) Detentores de COA que utilizem em suas operações apenas um piloto e uma aeronave com

  motores convencionais devem possuir estrutura administrativa mínima aprovada pela ANAC.
  (Redação

  dada pela Resolução nº 526, de 06.08.2019)'
