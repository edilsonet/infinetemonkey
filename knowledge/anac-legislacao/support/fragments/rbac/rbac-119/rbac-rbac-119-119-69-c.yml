text: '(c) Os títulos das posições requeridas pelo parágrafo (a) desta seção ou o título e
  número das

  posições equivalentes aprovadas segundo o parágrafo (b) desta seção devem ser apresentados
  nas

  especificações operativas do detentor do certificado.'
