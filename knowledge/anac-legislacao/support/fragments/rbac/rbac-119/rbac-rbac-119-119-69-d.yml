text: '(d) As pessoas que servem nas posições requeridas ou aprovadas segundo os parágrafos
  (a) ou (b)

  desta seção, ou qualquer outro em posição de exercer controle sobre operações conduzidas
  segundo

  o certificado, devem:

  (1) ser qualificados através de treinamento, experiência e habilidade;

  (2) na extensão de sua responsabilidade, ter entendimento dos seguintes assuntos no que
  diz

  respeito às operações do detentor de certificado:'
