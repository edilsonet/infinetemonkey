cite: 119.69(e)
title: 119.69(e)
text: '(e) Cada detentor de certificado deve:

  (1) estabelecer nas provisões de política geral do manual requerido por 135.21 os deveres,

  responsabilidades e autoridade do pessoal requerido pelo parágrafo (a) desta seção;

  (2) listar no manual os nomes e endereços comerciais das pessoas designados para aquelas

  posições; e

  (3) notificar à ANAC, no prazo de 10 dias, qualquer modificação no pessoal ou qualquer vaga

  aberta em qualquer das posições listadas.


  Data da emissão: 11 de fevereiro de 2021.'
