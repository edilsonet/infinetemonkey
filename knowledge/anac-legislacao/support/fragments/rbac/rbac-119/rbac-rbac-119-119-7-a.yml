title: 119.7(a)
text: '(a) As EO emitidas para um detentor de COA conterá:

  (1) as autorizações, limitações e os procedimentos segundo os quais cada operação de transporte

  aéreo público deve ser conduzida; e

  (2) outros procedimentos segundo os quais cada classe e tamanho de aeronave deve ser operada.'
