title: 119.71(b)
text: '(b) Para atuar como Diretor ou Gerente de Operações, conforme 119.69 (a)(1) de um detentor
  de

  certificado, uma pessoa deve possuir:

  (1) uma licença de Piloto de Linha Aérea (PLA) se qualquer operação requerer que o piloto
  em

  comando necessite de igual licença,

  (2) uma licença de Piloto Comercial (PC) se as operações somente requeiram que o piloto
  em

  comando possua apenas licença de Piloto Comercial (PC), se for requerida qualificação para
  voo por

  instrumentos (IFR) para qualquer piloto em comando do detentor de certificado, o Diretor
  ou Gerente

  de Operações deve, também, possuir qualificação IFR. Adicionalmente ele deve:'
