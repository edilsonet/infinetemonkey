subsection_id: c
cite: 119.71(c)
title: 119.71(c)
text: '(c) Para atuar como Piloto Chefe, segundo 119.69(a), de um detentor de certificado
  conduzindo

  qualquer operação na qual o piloto em comando deve possuir licença de PLA, uma pessoa deve

  possuir uma licença de PLA com as apropriadas qualificações e deve ser qualificada para
  trabalhar

  como piloto em comando na aeronave mais complexa utilizada pelo detentor de certificado
  em suas

  operações; e

  (1) uma pessoa assumindo o cargo de Piloto Chefe sem experiência prévia na função, ter pelo

  menos 3 anos de experiência, dentro dos últimos 6 anos, como piloto em comando de uma aeronave

  operada segundo os RBAC 121 ou 135; ou;

  (2) uma pessoa assumindo o cargo de Piloto Chefe com experiência prévia na função, ter pelo

  menos 3 anos de experiência como piloto em comando de uma aeronave operada segundo os RBAC

  121 ou 135.

  (3) os requisitos de experiência de voo do parágrafo (c)(2) desta seção podem ser atendidos
  por

  pilotos das Forças Armadas, da reserva, que tenham exercido funções de controle operacional
  em


  Data da emissão: 11 de fevereiro de 2021.


  unidades aéreas operando aeronaves militares de qualquer porte e que exerceram atividades
  de

  INSPAC OPS por 3 anos, dentro dos últimos 9 anos.'
