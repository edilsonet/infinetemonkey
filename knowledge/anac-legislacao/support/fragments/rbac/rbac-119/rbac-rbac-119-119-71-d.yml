subsection_id: d
cite: 119.71(d)
title: 119.71(d)
text: '(d) Para atuar como Piloto Chefe, segundo 119.69(a), de um detentor de certificado
  conduzindo

  operações nas quais o piloto em comando deve possuir apenas licença de PC, uma pessoa deve

  possuir, pelo menos, a mesma habilitação. Se for requerida qualificação IFR para qualquer
  piloto em

  comando desse detentor de certificado, o Piloto Chefe também deve possuir qualificação IFR.
  O

  Piloto Chefe deve ser qualificado para trabalhar como piloto em comando na aeronave mais
  complexa

  utilizada pelo detentor de certificado em suas operações. Em adição, o Piloto Chefe deve:

  (1) no caso de uma pessoa sem experiência prévia na função, ter pelo menos 3 anos de

  experiência, dentro dos últimos 6 anos, como piloto em comando de uma aeronave operada segundo

  os RBAC 121 ou 135; ou

  (2) uma pessoa com experiência prévia na função, ter pelo menos 3 anos de experiência como

  piloto em comando de uma aeronave operada segundo os RBAC 121 ou 135.

  (3) os requisitos de experiência de voo do parágrafo (c)(1) desta seção podem ser atendidos
  por

  pilotos das Forças Armadas, da reserva, que tenham exercido funções de controle operacional
  em

  unidades aéreas operando aeronaves militares de qualquer porte e que exerceram atividades
  de

  INSPAC OPS por 3 anos, dentro dos últimos 9 anos.'
