section_title: 'Pessoal de administração: qualificações para operações conduzidas segundo
  o RBAC'
subsection_id: f
cite: 119.71(f)
title: 119.71(f)
text: '(f) Um detentor de certificado pode requerer autorização da ANAC para empregar uma
  pessoa que

  não atende aos requisitos de experiência previstos nesta seção, e a ANAC autorizará se julgar
  que

  esta pessoa possui uma experiência comparável e pode efetivamente desempenhar as funções
  de

  acordo com os requisitos deste RBAC e dos manuais do detentor do certificado. Qualquer autorização

  deferida de acordo com este parágrafo levará em conta o tamanho e abrangência das operações,
  bem

  como a qualificação do pessoal técnico do detentor do certificado. Qualquer autorização
  deferida

  como previsto neste parágrafo pode ser revogada pela ANAC a qualquer tempo. (Incluído pela

  Resolução nº 463, de 07.02.2018)'
