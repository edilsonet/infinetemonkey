subsection_id: i
cite: 119.71(i)
title: 119.71(i)
text: '(i) ter pelo menos 3 anos de experiência como gerente ou supervisor em uma posição

  exercendo controle operacional sobre qualquer operação conduzida segundo o RBAC 121 ou 135;
  ou

  (ii) sem experiência prévia na função, ter pelo menos 3 anos de experiência, dentro dos

  últimos 6 anos, como piloto em comando de uma aeronave operando segundo o RBAC 121 ou 135;

  (3) os requisitos de experiência administrativa do parágrafo (b)(2)(i) e de voo do parágrafo'
