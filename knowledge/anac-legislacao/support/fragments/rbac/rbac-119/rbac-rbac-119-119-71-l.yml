section_title: 'Pessoal de administração: qualificações para operações conduzidas segundo
  o RBAC'
subsection_id: l
cite: 119.71(l)
title: 119.71(l)
text: '(l) possuir título - seja técnico industrial, técnico de nível superior (tecnólogo)
  ou engenheiro -

  e ser registrado junto ao respectivo conselho de fiscalização da profissão com atribuição
  profissional

  coerente com a atividade desempenhada; (Redação dada pela Resolução nº 552, de 29.04.2020)

  (2) ter 3 (três) anos de experiência dentro dos últimos 6 (seis) anos em atividades profissionais

  relacionadas a manutenção de produtos aeronáuticos para um detentor de certificado ou organização

  de manutenção aeronáutica; (Redação dada pela Resolução nº 463, de 07.02.2018)

  (3) ter realizado curso em uma das aeronaves de maior categoria de certificação de tipo
  e

  motorização operadas pelo detentor de certificado ou ter experiência prática em atividades
  de

  manutenção em aeronaves de mesma categoria de certificação de tipo e motorização similar
  operadas

  pelo detentor de certificado; e (Redação dada pela Resolução nº 463, de 07.02.2018)

  (4) demonstrar à ANAC que há compatibilização de tempo e área de atuação para atuar em mais

  de uma empresa. (Incluído pela Resolução nº 463, de 07.02.2018)'
