section_title: Responsabilidades do gestor responsável e do diretor ou gerente de segurança
subsection_id: b
cite: 119.72(b)
title: 119.72(b)
text: '(b) Independentemente de outras responsabilidades perante a organização, o diretor
  ou gerente de

  segurança operacional detém as responsabilidades elencadas a seguir:

  (1) coordenar a implementação, manutenção e integração do SGSO em todas as áreas da

  organização do detentor do certificado, em conformidade com os requisitos aplicáveis;

  (2) facilitar a identificação de perigos e a análise de riscos à segurança operacional;

  (3) monitorar a efetividade dos controles de risco à segurança operacional;

  (4) formalizar junto ao Gestor Responsável a necessidade de alocação de recursos demandados

  para implementação, manutenção e melhoria contínua do SGSO;

  (5) planejar e facilitar a promoção da segurança operacional em todas as áreas da organização

  do detentor do certificado;

  (6) relatar regularmente ao Gestor Responsável sobre o desempenho do SGSO e qualquer

  necessidade de melhoria; e

  (7) assessorar o Gestor Responsável no exercício de suas responsabilidades relacionadas
  ao

  gerenciamento da segurança operacional, fornecendo subsídios para a tomada de decisões.

  (Incluído pela Resolução nº 503, de 07.02.2019)'
