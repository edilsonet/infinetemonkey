title: 119.73(c)
text: '(c) Os detentores de COA com autorização a realizarem operações de ligação aérea sistemática

  (LAS) têm até 7 de agosto de 2022 para se adequarem às características de operação conforme
  este

  RBAC, de acordo com plano de ação a ser estabelecido pela SPO e pela SAR.'
