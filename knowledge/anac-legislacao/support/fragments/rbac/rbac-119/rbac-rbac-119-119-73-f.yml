title: 119.73(f)
text: '(f) As alterações propostas passam a ter vigência 120 dias após a sua publicação, no
  intuito de

  permitir que o mercado e as unidades da Agência internalizem e realizem eventuais ajustes
  no

  processo de certificação.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
