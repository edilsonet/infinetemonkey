section_title: Utilização do nome comercial
subsection_id: b
cite: 119.9(b)
title: 119.9(b)
text: '(b) Nenhuma detentor de certificado pode operar uma aeronave segundo os RBAC 121 ou
  135, a

  menos que seu nome comercial esteja legivelmente escrito na aeronave e seja sempre claramente

  visível e compreensível pelo lado de fora da aeronave por uma pessoa no solo. A forma de
  escrever

  o nome na aeronave e legibilidade do mesmo devem ser aceitas pela ANAC


  Data da emissão: 11 de fevereiro de 2021.


  SUBPARTE B

  APLICABILIDADE DE REQUISITOS OPERACIONAIS PARA AS DIFERENTES

  CARACTERÍSTICAS DE OPERAÇÕES SEGUNDO OS RBAC 121 E 135 (Título da Subparte

  com redação dada pela Resolução nº 526, de 06.08.2019)'
