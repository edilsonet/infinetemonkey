cite: 120.1(b)
title: 120.1(b)
text: '(b) Para os propósitos deste Regulamento, são consideradas ARSO:

  (1) cálculo das posições de carga, bagagem, passageiros e combustível nas aeronaves operadas
  sob o RBAC nº 121 e acompanhamento do progresso do respectivo voo;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (2) manutenção, manutenção preventiva ou alteração de produtos aeronáuticos;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (3) inspeção e certificação da manutenção de um produto aeronáutico;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (4) abastecimento das aeronaves operadas sob o RBAC nº 121 na área operacional não edificada,
  supervisão do abastecimento e manutenção dos veículos que serão utilizados para esse abastecimento;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (5) inspeção de segurança da aviação civil contra atos de interferência ilícita aplicadas
  em pessoas, objetos, áreas ou aeronaves sob responsabilidade de operadores de aeródromo
  e/ou de operadores aéreos classificados como Classe de III a VI segundo o RBAC nº 108;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (6) atividades realizadas por um membro da tripulação de uma aeronave;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (7) carregamento e descarregamento de bagagem e carga em aeronave operada sob o RBAC nº
  121, incluindo a abertura e fechamento de portas, a supervisão do carregamento e a condução/operação
  dos veículos ou equipamentos utilizados no transporte da bagagem e carga;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (8) sinalização para estacionamento de uma aeronave ou sua orientação para movimentação
  (

  marshalling

  );

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (9) atividades realizadas por fiscal de pátio;

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (10) atividades de condução de veículos e/ou operação de equipamentos, por pessoas com credencial
  aeroportuária permanente e que atuem na área operacional, quando prestadas a operadores
  sob o RBAC nº 121 ou a operadores de aeródromo, excetuando os motoristas do Serviço de Salvamento
  e Combate a Incêndio;

  (Incluído pela Resolução nº 605, de 11.02.2021)

  (11) atividades de varredura contra objetos estranhos em área operacional não edificada
  prestadas a operadores sob o RBAC nº 121;

  (Incluído pela Resolução nº 605, de 11.02.2021)

  (12) calço das aeronaves que operem sob o RBAC nº 121, quando realizado em área operacional
  não edificada; e

  (Incluído pela Resolução nº 605, de 11.02.2021)

  (13) exercício do controle operacional de aeronaves em operações sob o RBAC nº 121.

  (Incluído pela Resolução nº 605, de 11.02.2021)'
