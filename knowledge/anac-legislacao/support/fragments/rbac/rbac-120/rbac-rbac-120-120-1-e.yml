title: 120.1(e)
text: '(e) Cabem às entidades relacionadas no parágrafo 120.1(a) cumprir e fazer cumprir os
  requisitos definidos neste Regulamento pelos seus empregados e pelos empregados de suas
  contratadas, direta ou indiretamente, caso desempenhem qualquer Atividade de Risco à Segurança
  Operacional na Aviação Civil listada no parágrafo 120.1(b).

  (Incluído pela Resolução nº 605, de 11.02.2021)

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
