title: 120.1(i)
text: '(i) empresas de transporte aéreo; e

  (ii) serviços aéreos especializados (SAE);

  (Redação dada pela Resolução nº 737, de 09.02.2024

  )

  (2) detentores de certificados sob o RBAC nº 145 localizados em território brasileiro que
  aprovem para o retorno ao serviço aeronaves envolvidas em operações regidas pelo RBAC nº
  121 ou RBAC nº 135; e

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (3) operadores de aeródromos classificados como Classe III ou IV segundo o RBAC nº 153.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
