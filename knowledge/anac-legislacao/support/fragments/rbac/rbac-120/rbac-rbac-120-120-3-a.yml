cite: 120.3(a)
title: 120.3(a)
text: '(a) É obrigatória, a todas as empresas relacionadas no parágrafo 120.1(a) deste Regulamento,
  a elaboração, execução e manutenção de um Programa de Prevenção do Risco Associado ao Uso
  Indevido de Substâncias Psicoativas na Aviação Civil (PPSP), bem como de seus subprogramas.

  (1) Cada empresa responsável e, ainda, cada empresa que, conforme 120.3(b), necessite possuir
  seu próprio PPSP deverá desenvolver um Manual específico com o objetivo de descrever detalhadamente
  seu Programa e subprogramas, incluindo os métodos de cumprimento específicos adotados.

  (2) Cada empresa responsável e, ainda, cada empresa que, conforme 120.3(b), necessite possuir
  seu próprio PPSP deverá desenvolver uma Declaração de Conformidade específica para o presente
  regulamento, isto é, um documento contendo uma listagem completa de todas as seções e requisitos
  deste Regulamento e o correspondente método de cumprimento adotado para cada seção ou requisito.

  (3) As informações contidas no Manual de um PPSP e na Declaração de Conformidade devem ser
  mantidas atualizadas para todos os fins internos e externos à empresa, devendo estes documentos
  serem apresentados imediatamente sempre que solicitado pela ANAC.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
