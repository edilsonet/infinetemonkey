cite: 120.3(b)
title: 120.3(b)
text: '(b)

  A empresa responsável que seja contratante de outra empresa, poderá, conforme os critérios
  de contratação, incluir essa empresa contratada no seu PPSP. Caso opte pela não inclusão,
  deverá exigir que a empresa contratada possua seu próprio PPSP, nos termos deste Regulamento

  .

  (Redaç&aatilde;o dada pela Resolução nº 605, de 11.02.2021)'
