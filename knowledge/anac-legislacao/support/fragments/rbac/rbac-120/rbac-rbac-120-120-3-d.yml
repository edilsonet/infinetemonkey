title: 120.3(d)
text: '(d) As empresas responsáveis relacionadas nos parágrafos 120.1(a) deste Regulamento
  devem garantir que todo profissional que desempenhe Atividade de Risco à Segurança Operacional
  na Aviação Civil sob sua responsabilidade esteja contemplado em um PPSP, podendo ser no
  seu próprio programa ou no de sua contratada.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
