title: 120.301(a)
text: '(a) O Programa de Prevenção do Risco Associado ao Uso Indevido de Substâncias Psicoativas
  (PPSP) deverá conter, no mínimo:

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (1) um Subprograma de Educação, na forma da subparte H deste Regulamento;

  (2) um Subprograma de Exames Toxicológicos de Substâncias Psicoativas, conforme a subparte
  I deste Regulamento; e

  (3) um Subprograma de Resposta a Evento Impeditivo, conforme a subparte J deste Regulamento.'
