cite: 120.303(b)
title: 120.303(b)
text: '(b) No caso de empresa contratada para execução de uma ARSO, todos os seus empregados
  ARSO e supervisores devem estar submetidos ao seu próprio PPSP ou ao PPSP da empresa responsável
  contratante, exceto como previsto no parágrafo (c) desta Seção.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
