cite: 120.303(c)
title: 120.303(c)
text: (c) Sob avaliação de risco a ser feita pela empresa responsável, em situações emergenciais,
  esta poderá contratar uma empresa ou indivíduo para a execução de uma ARSO que não estejam
  abrangidos em um PPSP. A empresa responsável deve manter a documentação relativa a essa
  contratação emergencial por 5 (cinco) anos.
