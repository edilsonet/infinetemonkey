title: 120.307(i)
text: '(i) proporção de empregados ARSO submetidos ao Subprograma de Resposta a Eventos Impeditivos
  em relação aos eventos impeditivos ocorridos; e

  (ii) proporção de retorno ao serviço de empregados ARSO em relação ao total de empregados
  submetidos ao Subprograma de Resposta a Eventos Impeditivos.

  (2) O relatório também deverá conter a quantidade de empregados ARSO, com indicação da atividade
  realizada, e a quantidade de empregados ARSO submetidos aos exames ETSP (prévios, aleatórios,
  pós-acidente, baseado em suspeita justificada, de retorno ao serviço, de acompanhamento)
  realizados no período.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
