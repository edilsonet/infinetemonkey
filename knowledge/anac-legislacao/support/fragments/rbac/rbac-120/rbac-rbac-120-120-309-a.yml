cite: 120.309(a)
title: 120.309(a)
text: '(a) Toda empresa responsável deve eleger um representante designado para responder
  pela elaboração, execução e manutenção do seu PPSP e de todos os subprogramas associados.
  A empresa deve manter as informações atualizadas deste representante, como o nome e os dados
  de contato, para todos os fins internos e externos à empresa, dispensado o envio dessas
  informações à ANAC. Todavia, essas informações devem ser apresentadas imediatamente sempre
  que solicitado pela ANAC.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
