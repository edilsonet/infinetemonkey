cite: 120.321(a)
title: 120.321(a)
text: '(a) A empresa responsável deve desenvolver, elaborar e executar, internamente ou por
  contrato, um subprograma de educação fornecendo:

  (1) aos empregados ARSO e seus supervisores, informações sobre o uso indevido de substâncias
  psicoativas; e

  (2) aos Supervisores Treinados para Encaminhamento a ETSP, treinamento específico para encaminhamento
  de um empregado ARSO para um ETSP baseado em suspeita justificada conforme o parágrafo 120.323(b).'
