title: 120.321(h)
text: '(h) Com exceção do disposto no parágrafo (i) desta Seção, o desenvolvimento, a elaboração
  do conteúdo e a execução do subprograma de educação devem ser coordenados pelo ESP ou profissional
  com formação equivalente designado pela empresa.

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
