title: 120.321(i)
text: '(i) Para as empresas listadas abaixo, o desenvolvimento, a elaboração do conteúdo e
  a execução do subprograma de educação não precisa ser coordenado pelo ESP ou profissional
  com formação equivalente, desde que os temas contemplados pelo parágrafo 120.323(a)(12)
  deste Regulamento sejam tratados a partir das orientações da ANAC publicamente divulgadas:

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (1) operador segundo as regras do RBAC nº 135 com até 10 empregados ARSO (não contando os
  empregados de empresas contratados, direta ou indiretamente);

  (Redação dada pela Resolução nº 605, de 11.02.2021)

  (2) operador SAE; e

  (3) organizações de manutenção regidas pelo RBAC 145, exceto as que aprovam para retorno
  ao serviço aeronaves operadas segundo o RBAC121.

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
