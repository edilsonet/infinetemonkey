title: 120.323(b)
text: '(b) O conteúdo do material educacional específico de instrução de Supervisores Treinados
  para Encaminhamento a ETSP deve conter a identificação de indicadores físicos, comportamentais
  e de desempenho para a realização de observações específicas, atuais e articuladas visando
  encaminhamento a exame por suspeita justificada.

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  SUBPARTE I

  SUBPROGRAMA DE EXAMES TOXICOLÓGICOS DE SUBSTÂNCIAS PSICOATIVAS'
