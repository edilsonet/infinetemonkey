text: '(i) efeitos do uso de substâncias psicoativas na saúde, no trabalho e na vida pessoal
  do indivíduo;

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (ii) sinais e sintomas do uso nocivo e de dependência de substâncias psicoativas; e

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (iii) métodos de tratamento disponíveis na comunidade para resolução de problemas associados
  ao uso de substâncias psicoativas.

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
