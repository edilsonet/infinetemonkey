title: 120.331(b)
text: '(b) As empresas listadas abaixo não precisam atender aos parágrafos 120.339(a) e (b)
  desta Subparte:

  (1) operadores segundo as regras do RBAC nº 135 com até 10 empregados ARSO (não contando
  os empregados de empresas contratados, direta ou indiretamente);

  (2) operadores SAE; e

  (3) organizações de manutenção regidas pelo RBAC nº 145, exceto as que aprovam para retorno
  ao serviço aeronaves operadas segundo o RBAC nº 121.'
