cite: 120.331(f)
title: 120.331(f)
text: '(f) O PPSP deve conter os procedimentos utilizados para:

  (1) coleta, manuseio e armazenamento das amostras para os ETSP;

  (2) realização dos ETSP, incluindo as matrizes biológicas utilizadas e os níveis de corte
  adotados;

  (3) notificação pelo médico revisor de um resultado positivo e de um resultado positivo
  não referendado ao indivíduo examinado; e

  (4) garantia da integridade das amostras, utilizando-se para este fim procedimentos de cadeia
  de custódia.'
