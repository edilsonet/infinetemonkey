title: 120.331(g)
text: '(g) O medidor de alcoolemia -

  etilômetro

  - deve ser utilizado conforme os limites e condições estabelecidos pela legislação metrológica
  em vigor e observar os seguintes requisitos:

  (1) ser aprovado na verificação metrológica inicial realizada pelo Instituto Nacional de
  Metrologia, Qualidade e Tecnologia (INMETRO) ou órgão da Rede Brasileira de Metrologia Legal
  e Qualidade - RBMLQ;

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (2) ser aprovado na verificação periódica anual realizada pelo INMETRO ou RBMLQ; e

  (3) ser aprovado em inspeção em serviço ou eventual, conforme determina a legislação metrológica
  vigente.'
