title: 120.331(i)
text: '(i) A empresa responsável somente poderá contratar os serviços de um laboratório para
  ETSP que seja:

  (1) [Reservado];

  (2) acreditado pela Coordenação Geral de Acreditação - CGCRE/INMETRO;

  (3) acreditado pelo Sistema Nacional de Acreditação segundo requisitos da Sociedade Brasileira
  de Análises Clínicas - Sistema DICQ-SBAC;

  (4) acreditado pelo Sistema Nacional de Acreditação segundo requisitos da Organização Nacional
  de Acreditação - Sistema DICQ-ONA;

  (5) acreditado pelo Programa de Acreditação de Laboratórios Clínicos (PALC) da Sociedade
  Brasileira de Patologia Clínica/ Medicina Laboratorial (SBPC/ML); ou

  (6) acreditado por um organismo acreditador que faça parte do Multilateral

  Agreement

  (MLA) do

  International

  Laboratory

  Accreditation

  Cooperation

  (ILAC).'
