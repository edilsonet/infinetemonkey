cite: 120.335(a)
title: 120.335(a)
text: '(a) As substâncias psicoativas a serem testadas em cada ETSP, independentemente do
  tipo, são:

  (1) álcool;

  (2) metabólitos de opiáceos;

  (3) metabólitos de

  canabinoides

  ;

  (4) metabólitos de cocaína; e

  (5) anfetaminas / metanfetaminas /

  metilenodioximetanfetamina

  /

  metilenodioxianfetamina

  .

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
