section_title: Termo de consentimento
subsection_id: a
cite: 120.337(a)
title: 120.337(a)
text: (a) A empresa responsável deve requerer ao empregado a assinatura de um termo de consentimento
  específico para cada ETSP a ser realizado e para cada uma das movimentações, requeridas
  por esta subparte, da amostra corporal ao laboratório e da circulação das informações referentes
  aos ETSP deste empregado.
