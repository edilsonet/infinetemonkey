section_title: Tipos de Exame Toxicológico de Substâncias Psicoativas
subsection_id: a
cite: 120.339(a)
title: 120.339(a)
text: '(a) ETSP prévio: toda empresa responsável deve conduzir ETSP prévios, conforme os seguintes
  requisitos:

  (1) nenhuma empresa responsável deve contratar qualquer indivíduo para o desempenho de ARSO
  a não ser que conduza um ETSP prévio e receba um resultado negativo para este indivíduo;

  (2) a empresa responsável deve realizar um ETSP prévio antes que o novo empregado desempenhe
  uma ARSO pela primeira vez;

  (3) a empresa responsável deve realizar um ETSP prévio se um indivíduo for realocado de
  uma atividade que não é de risco à segurança operacional para uma ARSO;

  (4) empresas responsáveis devem conduzir outro ETSP prévio e receber um resultado negativo
  antes de contratar ou alocar um indivíduo para desempenhar uma ARSO se mais de 180 dias
  passaram entre o ETSP prévio requerido nos parágrafos (a)(2) e (a)(3) desta seção e o início
  do desempenho de ARSO por este indivíduo;

  (5) antes de contratar ou alocar um indivíduo para desempenhar uma ARSO, a empresa responsável
  deve notificar previamente este indivíduo que a ele será requisitado um ETSP prévio; e

  (6) a empresa responsável deve requerer que o indivíduo demonstre ciência da política relacionada
  ao PPSP da empresa responsável antes de realizar o ETSP prévio, conforme o parágrafo 120.337(a).'
