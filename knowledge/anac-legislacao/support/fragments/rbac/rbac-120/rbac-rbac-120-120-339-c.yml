title: 120.339(c)
text: '(c) ETSP pós-acidente: toda empresa responsável deve conduzir ETSP pós-acidente, conforme
  os seguintes requisitos:

  (1) após a ocorrência de acidente, incidente ou ocorrência de solo, a empresa responsável
  deve encaminhar para um ETSP, se houver condições adequadas, os empregados ARSO envolvidos,
  a não ser que possa ser claramente determinado, para cada empregado ARSO, que sua performance
  não contribuiu para o acidente;

  (2) nenhum empregado ARSO requerido a realizar um ETSP pós-acidente poderá consumir substância
  psicoativa até que o referido exame seja conduzido, considerando que haja condições adequadas;

  (3) nada nesta seção pode ser usado para atrasar ou impedir a atenção médica necessária
  para algum indivíduo envolvido em acidente, incidente ou ocorrência de solo; e

  (4) as condições adequadas para realizar um ETSP pós-acidente mencionadas acima são tais
  que:'
