subsection_id: d
cite: 120.339(d)
title: 120.339(d)
text: '(d) ETSP baseado em suspeita justificada: toda empresa responsável deve conduzir ETSP
  baseados em suspeita justificada conforme os seguintes requisitos:

  (1) a empresa responsável deve conduzir um empregado ao ETSP se houver suspeita justificada
  de que ele está sob influência de substância psicoativa;

  (2) a decisão de examinar um empregado deve se basear em suspeita justificada, realizada
  por um Supervisor Treinado para Encaminhamento a ETSP;

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (3) o supervisor que determina a existência de suspeita justificada não deve realizar o
  ETSP no empregado; e

  (4) na ausência de um ETSP, nenhuma empresa responsável pode tomar medidas no âmbito deste
  regulamento com base exclusivamente na suspeita justificada.'
