cite: 120.339(e)
title: 120.339(e)
text: '(e) ETSP de retorno ao serviço: uma empresa responsável, antes de permitir que um indivíduo
  volte a desempenhar uma ARSO após um evento impeditivo, deve submetê-lo a um ETSP de retorno
  ao serviço e obter um resultado negativo para este indivíduo. O ETSP não deve ocorrer até
  que o ESP da empresa responsável tenha determinado que o indivíduo cumpriu as recomendações
  feitas a ele, conforme subparte J deste Regulamento.'
