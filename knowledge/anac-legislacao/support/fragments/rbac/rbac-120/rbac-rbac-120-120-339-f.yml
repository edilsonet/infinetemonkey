cite: 120.339(f)
title: 120.339(f)
text: '(f) ETSP de acompanhamento: toda empresa responsável deve conduzir ETSP de acompanhamento,
  conforme os seguintes requisitos:

  (1) a empresa responsável deve realizar ETSP não anunciados para todo indivíduo contratado
  para desempenhar uma ARSO e que está voltando a desempenhar uma ARSO após o retorno ao serviço
  decorrente de um evento impeditivo;

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  (2) o número e freqüência de tais ETSP devem ser determinados pelo ESP da empresa responsável
  (ou ESP contratado pela empresa responsável) e deve conter no mínimo 6 (seis) ETSP nos primeiros
  12 (doze) meses seguintes ao retorno ao serviço deste empregado;

  (3) os ETSP de acompanhamento não devem exceder 60 (sessenta) meses a contar da data de
  retorno ao serviço do indivíduo que desempenhará uma ARSO. O ESP da empresa responsável
  pode cancelar os ETSP de acompanhamento a qualquer momento se determinar que tais ETSP não
  são mais necessários, desde que, no mínimo, 6 (seis) ETSP nos primeiros 12 (doze) meses
  tenham sido conduzidos; e

  (4) os indivíduos que estiverem sendo submetidos aos ETSP de acompanhamento devem ser excluídos
  do conjunto de empregados elegíveis para a realização de ETSP aleatórios e devem retornar
  ao conjunto imediatamente após o término da série de ETSP de acompanhamento programada.'
