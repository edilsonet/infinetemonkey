cite: 120.339(i)
title: 120.339(i)
text: '(i) 50% (cinquenta por cento), para uma empresa responsável que possui até 500 (quinhentos)
  empregados ARSO, inclusive;

  (ii) 28% (vinte e oito por cento) ou 250 (duzentos e cinquenta) ETSP, o que for maior, para
  uma empresa responsável que possui de 501 (quinhentos e um) a 2000 (dois mil) empregados
  ARSO, inclusive; e

  (iii) 7% (sete por cento) ou 560 (quinhentos e sessenta) ETSP, o que for maior, para uma
  empresa responsável que possui mais de 2000 (dois mil) empregados ARSO.

  (2) a metodologia eleita para o ETSP aleatório deve garantir uma seleção isenta e imparcial
  da pessoa a ser testada, devendo identificar claramente cada pessoa de forma única e ser

  auditável

  ;

  (3) cada empregado ARSO deve ter a mesma chance de ser selecionado a cada vez em que é realizada
  a seleção;

  (4) a empresa responsável deve selecionar e examinar uma taxa percentual anualizada de empregados
  igual ou maior à taxa mínima e deve dividir o número de resultados de ETSP aleatórios realizados
  pelo número médio de empregados que desempenham ARSO para determinar se alcançou a taxa
  mínima anual, conforme os parágrafos 120.339(b)(1) a 120.339(b)(3);

  (5) toda empresa responsável deve certificar-se de que os ETSP aleatórios conduzidos sob
  esta subparte não sejam previamente anunciados e que as datas para as realizações dos ETSP
  aleatórios sejam distribuídas de forma não regular durante o ano;

  (6) toda empresa responsável deve requerer que um empregado ARSO, selecionado para um ETSP
  aleatório, proceda para o local de coleta imediatamente, considerando que:'
