cite: 120.341(a)
title: 120.341(a)
text: '(a) A empresa responsável deve manter em um local seguro de acesso controlado, em papel
  ou mídia eletrônica, por um período de 5 (cinco) anos:

  (1) documentos apresentados pelo empregado abrangido neste Regulamento que se contrapõem
  ao resultado dos ETSP sob esta subparte;

  (2) registros e notificações relacionados a qualquer evento impeditivo; e

  (3) demais documentos que comprovem o cumprimento dos requisitos desta subparte.'
