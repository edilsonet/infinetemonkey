section_title: Retenção de documentos pelo médico revisor
subsection_id: a
cite: 120.343(a)
title: 120.343(a)
text: (a) Registros sobre resultados de ETSP avaliados pelo médico revisor devem ser mantidas
  por ele por 5 (cinco) anos em papel ou mídia eletrônica. Se a empresa responsável mudar
  seu médico revisor por qualquer motivo, a empresa responsável deve assegurar que o antigo
  médico revisor encaminhe todos os registros mantidos de acordo com esta seção ao novo médico
  revisor.
