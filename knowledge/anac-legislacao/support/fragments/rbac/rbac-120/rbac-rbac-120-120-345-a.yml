cite: 120.345(a)
title: 120.345(a)
text: (a) Exceto como requerido em lei, ou expressamente autorizado, ou requerido nesta subparte,
  nenhuma empresa responsável ou médico revisor deve divulgar ou permitir o acesso a informações
  sobre empregados ARSO que estejam contidas em registros requeridos a serem mantidos sob
  esta subparte.
