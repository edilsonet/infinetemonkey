text: '(d) As provisões desta subparte não se aplicam a um indivíduo que desempenhe, fora
  do território nacional, uma ARSO por contrato para uma empresa responsável.

  (Redação dada pela Resolução nº 326, de 10.06.2014)

  SUBPARTE J

  SUBPROGRAMA DE RESPOSTA A EVENTO IMPEDITIVO'
