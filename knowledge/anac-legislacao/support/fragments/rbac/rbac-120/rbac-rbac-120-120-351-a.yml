text: '(a) Após um evento impeditivo, uma empresa responsável, antes de permitir o retorno
  do empregado envolvido ao desempenho de uma ARSO, deve incluí-lo no subprograma de resposta
  a evento impeditivo, conforme esta subparte, que inclui as seguintes medidas:

  (1) avaliação abrangente por um ESP;

  (2) recomendação pelo ESP de uma ou mais das seguintes ações:'
