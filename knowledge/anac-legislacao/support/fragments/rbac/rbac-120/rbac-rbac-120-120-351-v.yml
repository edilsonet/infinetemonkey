title: 120.351(v)
text: '(v) programa de tratamento em regime ambulatorial; e

  (vi) programa de tratamento em regime de internação.

  (3) a empresa responsável deve permitir que o indivíduo cumpra o encaminhamento proposto;

  (4) o ESP deverá produzir relatórios e mantê-los arquivados, em papel ou mídia eletrônica,
  por um período de 5 (cinco) anos;

  (5) o método de cumprimento do Programa de Resposta a Evento Impeditivo da empresa responsável
  deve estar descrito no PPSP desta empresa responsável.'
