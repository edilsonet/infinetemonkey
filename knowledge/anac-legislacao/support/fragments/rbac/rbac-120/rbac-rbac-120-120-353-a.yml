title: 120.353(a)
text: (a) Os aeródromos classificados como classe III ou IV, segundo o RBAC nº 153, e que
  não estejam certificados na data de publicação da emenda nº 03 deste regulamento, terão
  o prazo máximo de 18 (dezoito) meses, contados da publicação desta emenda, para elaborar
  e implementar os programas e o manual exigidos neste regulamento.
