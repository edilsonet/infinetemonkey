title: 120.353(b)
text: '(b) Além da formação básica e do registro profissional, o ESP deve ter, com relação
  ao tratamento dos transtornos decorrentes do uso de substâncias psicoativas, dependência
  química ou equivalentes, no mínimo:

  (1) 2 (dois) anos de experiência de trabalho; ou

  (2) curso de extensão cujo currículo perfaça no mínimo 90 (noventa) horas e 1 (um) ano de
  experiência de trabalho; ou

  (3) diploma de curso de pós-graduação, lato ou stricto sensu (especialização, mestrado ou
  doutorado), reconhecido pelo MEC.

  SUBPARTE K

  DISPOSIÇÕES TRANSITÓRIAS E FINAIS

  (Subparte com redação dada pela Resolução nº 605, de 11.02.2021)'
