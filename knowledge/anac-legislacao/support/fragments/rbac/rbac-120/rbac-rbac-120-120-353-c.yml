title: 120.353(c)
text: '(c) Findos os prazos estabelecidos nos itens anteriores, sem que haja a elaboração
  e a implementação dos programas e o manual exigidos neste regulamento, e caso o aeroporto
  ainda não seja certificado, o operador de aeródromo será submetido à seguinte consequência:

  (1) A elaboração e a implementação dos programas e o manual exigidos neste regulamento passarão
  a ser condicionantes à emissão do certificado operacional do aeroporto.'
