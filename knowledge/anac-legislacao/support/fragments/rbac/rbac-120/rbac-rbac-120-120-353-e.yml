cite: 120.353(e)
title: 120.353(e)
text: (e) Os operadores segundo o RBAC nº 135 enquadrados nos parágrafos 120.321(i) e 120.331(b)
  por possuírem até 10 empregados ARSO (não contando os empregados de empresas contratados,
  direta ou indiretamente), caso passem a possuir mais de 10 empregados ARSO e permaneçam
  nessa situação por um período de 6 (seis) meses consecutivos, devem passar a atender aos
  parágrafos 120.321(h) e 120.339(a) e (b) até o final desse período de 6 (seis) meses.
