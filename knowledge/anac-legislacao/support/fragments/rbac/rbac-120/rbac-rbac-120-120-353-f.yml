cite: 120.353(f)
title: 120.353(f)
text: (f) Caso um operador segundo o RBAC nº 135 que possuía mais de 10 empregados ARSO (não
  contando os empregados de empresas contratados, direta ou indiretamente), e para o qual
  já se aplicavam os requisitos dos parágrafos 120.321(h) e 120.339(a) e (b), passe a possuir
  10 ou menos empregados ARSO, o operador somente poderá deixar de cumprir tais requisitos
  adicionais se tal situação se mantiver por, pelo menos, 6 (seis) meses consecutivos. Nesse
  caso, para que se efetive a inaplicabilidade, o operador deve comunicar à ANAC sua decisão.
