title: 120.353(g)
text: (g) As violações ao previsto neste Regulamento sujeitam o infrator às penalidades constantes
  no art. 289 da Lei nº 7.565, Código Brasileiro de Aeronáutica, de 19 de dezembro de 1986,
  a serem apuradas em conformidade com o procedimento descrito na Resolução ANAC nº 472, de
  06 de junho de 2018, ou em outros normativos que os substituírem, adotando-se, para as infrações
  praticadas a partir da entrada em vigor da Emenda nº 03 deste Regulamento, os valores de
  multa previstos em seu Apêndice A e na Resolução nº 472, de 2018.
