title: 120.7(b-I)
text: '(b)-I

  Área operacional

  significa o conjunto formado pela área de movimento de um aeródromo e terrenos e edificações
  adjacentes, ou parte delas, cujo acesso é controlado. Também é denominada de “lado ar”.

  (Incluído pela Resolução nº 605, de 11.02.2021)'
