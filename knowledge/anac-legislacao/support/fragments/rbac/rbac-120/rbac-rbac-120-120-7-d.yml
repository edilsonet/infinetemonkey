title: 120.7(d)
text: '(d)

  Condições adequadas para realizar um Exame Toxicológico de Substâncias Psicoativas (ETSP)
  pós-acidente

  significa as condições que permitem a realização do ETSP pós-acidente com aproveitamento
  e sem comprometer a segurança dos envolvidos, tal como definido no parágrafo 120.339(c)(4).'
