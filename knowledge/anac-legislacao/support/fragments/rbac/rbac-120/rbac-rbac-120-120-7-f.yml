cite: 120.7(f)
title: 120.7(f)
text: '(f)

  Empregado ARSO

  significa um empregado, incluindo assistentes, ajudantes, ou indivíduos em treinamento,
  que desempenham ARSO para uma empresa responsável, diretamente ou por contrato de qualquer
  tipo. Isto inclui empregados em tempo integral, em tempo parcial, temporários e intermitentes,
  independentemente do nível de supervisão.'
