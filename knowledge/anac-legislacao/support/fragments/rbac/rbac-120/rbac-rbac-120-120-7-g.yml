title: 120.7(g)
text: '(g)

  Empresa responsável

  significa qualquer entidade relacionada nos parágrafos 120.1(a)(1) a (a)(3) que emprega,
  diretamente ou por contrato de qualquer tipo, empregados ARSO.'
