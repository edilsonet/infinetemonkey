cite: 120.7(i)
title: 120.7(i)
text: '(i)

  Especialista em transtornos mentais e de comportamento decorrentes do uso de substância
  psicoativa (ESP)

  significa um profissional devidamente habilitado para a realização de avaliação abrangente
  em indivíduos para os quais haja um evento impeditivo conforme o subprograma de resposta
  a evento impeditivo específico da subparte J.'
