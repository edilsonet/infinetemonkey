title: 120.7(j)
text: '(j)

  Evento de segurança operacional

  significa acidente, incidente grave, incidente, ocorrência de solo, ocorrência anormal ou
  qualquer situação de risco que tenha o potencial de causar dano ou lesão ou ameace a viabilidade
  da operação de uma empresa responsável.'
