title: 120.7(l-I)
text: '(l)-I

  Fiscal de pátio

  significa a denominação para o profissional responsável pela execução de atividades de controle
  e fiscalização da movimentação e do estacionamento de aeronaves, veículos e equipamentos
  nos pátios, e atividades consectárias, podendo ainda receber outras denominações, tais como,
  inspetor de pátio, inspetor de rampa e congêneres.

  (Incluído pela Resolução nº 605, de 11.02.2021)'
