cite: 120.7(l-II)
title: 120.7(l-II)
text: '(l)-II

  Inspeção de segurança da aviação civil

  significa a aplicação de meios técnicos ou de outro tipo, com a finalidade de identificar
  e detectar armas, explosivos ou outros artigos perigosos que possam ser utilizados para
  cometer ato de interferência ilícita.

  (Incluído pela Resolução nº 605, de 11.02.2021)'
