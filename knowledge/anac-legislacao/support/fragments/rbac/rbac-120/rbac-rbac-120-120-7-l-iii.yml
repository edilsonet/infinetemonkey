title: 120.7(l-III)
text: '(l)-III

  Manual de um PPSP

  significa o documento, ou conjunto de documentos, elaborado pelas empresas responsáveis,
  contendo a descrição detalhada do seu Programa de Prevenção do Risco Associado ao Uso Indevido
  de Substâncias Psicoativas (PPSP), bem como de seus subprogramas, incluindo os métodos de
  cumprimento específicos adotados.

  (Incluído pela Resolução nº 605, de 11.02.2021)'
