title: 120.7(l)
text: '(l)

  Exame Toxicológico de Substâncias Psicoativas (ETSP)

  significa um exame toxicológico laboratorial destinado à detecção de substâncias psicoativas
  no organismo, incluindo, no mínimo, as seguintes: álcool, metabólitos de opiáceos, metabólitos
  de

  canabinoides

  , metabólitos de cocaína, anfetaminas, metanfetaminas,

  metilenodioximetanfetamina

  e

  metilenodioxianfetamina

  . Para a substância álcool, o ETSP também pode ser realizado por meio de

  etilômetro

  . Um ETSP é considerado quando da realização de exames para todas as substâncias citadas.

  (Redação dada pela Resolução nº 605, de 11.02.2021)'
