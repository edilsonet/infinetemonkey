title: 120.7(o)
text: '(o)

  Recusa

  (em submeter-se ao ETSP) significa que um indivíduo:

  (1) não se submeteu a qualquer etapa requerida de um ETSP. Não será considerado como uma
  recusa em submeter-se ao ETSP quando um indivíduo, por razões médicas avaliadas por um médico
  revisor, não conseguir fornecer uma amostra corporal para um ETSP; ou

  (2) interferiu ou tentou interferir na integridade da amostra corporal necessária ao ETSP
  requerido.'
