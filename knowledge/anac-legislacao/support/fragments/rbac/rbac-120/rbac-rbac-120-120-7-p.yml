cite: 120.7(p)
title: 120.7(p)
text: '(p)

  Representante designado

  significa uma pessoa física designada pela empresa responsável, dentre seus empregados,
  que terá autoridade e responsabilidade para responder pelo programa, pelo cumprimento dos
  requisitos deste regulamento e pela prestação de contas, sem prejuízo da responsabilidade
  final da empresa responsável.'
