title: 120.7(r)
text: '(r)

  Resultado positivo

  significa um resultado para um ETSP de qualquer tipo que acuse concentração de substância
  psicoativa acima do valor de corte estabelecido e que tenha sido referendado pelo médico
  revisor.'
