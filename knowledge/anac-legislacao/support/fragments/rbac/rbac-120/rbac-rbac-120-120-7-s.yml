title: 120.7(s)
text: '(s)

  Resultado positivo não referendado

  significa um resultado para um ETSP de qualquer tipo que acuse concentração de substância
  psicoativa acima do valor de corte estabelecido e que não tenha sido avaliado pelo médico
  revisor.'
