title: 120.7(t)
text: '(t)

  Substância psicoativa

  significa álcool ou qualquer substância no escopo da Portaria SVS/MS Nº 344, de 12 de maio
  de 1998, do Ministério da Saúde, excetuando as substâncias pertencentes às classes C2, C3,
  C4, C5 e F3 da referida Portaria.'
