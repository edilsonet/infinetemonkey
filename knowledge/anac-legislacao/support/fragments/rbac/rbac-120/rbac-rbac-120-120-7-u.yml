text: '(u)

  Supervisor treinado para encaminhamento a ETSP

  significa qualquer supervisor que tenha recebido o treinamento específico previsto no programa
  educativo para encaminhamento de empregados subordinados ao ETSP, baseado em suspeita justificada.'
