cite: 120.7(w)
title: 120.7(w)
text: '(w)

  Uso indevido de substâncias psicoativas

  significa a utilização devidamente comprovada de uma ou mais substâncias psicoativas cujos
  efeitos se façam presentes na situação de trabalho de qualquer pessoa responsável pelo desempenho
  de ARSO.

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
