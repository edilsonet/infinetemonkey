cite: 120.9(a)
title: 120.9(a)
text: '(a) É vedado a qualquer empregado ARSO:

  (1) o uso de substâncias psicoativas durante o exercício de suas atividades;

  (2) o exercício de suas atividades enquanto estiver sob o efeito de qualquer substância
  psicoativa; e

  (3) o exercício de suas atividades caso tenha sido envolvido em um evento impeditivo e não
  tenha obtido um resultado negativo em um ETSP de retorno ao serviço, conforme parágrafo
  120.339(e) deste Regulamento.

  (Redação dada pela Resolução nº 326, de 10.06.2014)'
