cite: 121.1(a)
title: 121.1(a)
text: '(a) Este regulamento estabelece regras para:

  (1) as operações de um solicitante ou detentor de um certificado de operador aéreo (COA)
  segundo o RBAC nº 119 que emprega aviões com configuração máxima certificada de assentos
  para passageiros de mais 19 assentos ou capacidade máxima de carga paga acima de 3.400 kg;

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (2) cada pessoa empregada ou utilizada por um detentor de certificado conduzindo operações
  segundo este regulamento, incluindo manutenção, manutenção preventiva, modificações e reparos
  de aeronaves;

  (3) cada pessoa que requeira provisoriamente aprovação para um Currículo de Programa Avançado
  de Qualificação ou segmento de currículo sob este regulamento, e cada pessoa empregada por
  uma empresa aérea sob este regulamento para realizar funções de treinamento, qualificação
  ou avaliações sob um Programa de Qualificação Avançado;

  (4) cada pessoa a bordo de um avião sendo operado segundo este regulamento;

  (5) cada pessoa que tenha requerido um COA segundo o RBAC 119, quando conduzindo voos de
  avaliação operacional.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
