cite: 121.101(a)
title: 121.101(a)
text: (a) Cada detentor de certificado conduzindo operações regulares deve demonstrar que
  ao longo de cada rota existem suficientes serviços de informações meteorológicas de modo
  a assegurar um mínimo de informes e previsões meteorológicos necessários à operação, exceto
  se de outra forma previsto pela ANAC.
