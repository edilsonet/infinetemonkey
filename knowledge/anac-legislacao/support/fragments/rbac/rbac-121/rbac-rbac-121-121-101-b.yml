cite: 121.101(b)
title: 121.101(b)
text: '(b) Exceto como previsto no parágrafo (d) desta seção, cada detentor de certificado
  conduzindo operações regulares que utilize informes meteorológicos para exercer o controle
  operacional deve utilizar informes:

  (1) para operações dentro do espaço aéreo brasileiro, providos pelo órgão competente ou
  por provedor reconhecido por ele; ou

  (2) para operações realizadas no exterior, providos pelo órgão competente do país sobrevoado
  ou por provedor reconhecido por ele.'
