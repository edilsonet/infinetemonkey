cite: 121.101(c)
title: 121.101(c)
text: (c) Cada detentor de certificado conduzindo operações regulares que utilize previsões
  meteorológicas para exercer o controle operacional deve utilizar previsões providas pelas
  fontes especificadas no parágrafo (b) desta seção ou pelas fontes aprovadas sob o sistema
  adotado nos termos do parágrafo (d) desta seção.
