cite: 121.101(d)
title: 121.101(d)
text: '(d) Cada detentor de certificado conduzindo operações regulares deve adotar e colocar
  em uso um sistema aprovado para obter e divulgar ao seu pessoal informes e previsões sobre
  fenômenos atmosféricos adversos, tais como turbulência em céu claro, tempestades e tesouras
  de vento em baixas altitudes, que possam afetar a segurança de voo em cada rota a ser voada
  e cada aeródromo a ser utilizado.

  (Redação dada pela Resolução nº 685, de 13.07.2022)'
