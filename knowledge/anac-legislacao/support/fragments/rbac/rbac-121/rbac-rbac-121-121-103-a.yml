cite: 121.103(a)
title: 121.103(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, cada detentor de certificado
  que conduza operações regulares deve demonstrar que em cada uma das rotas propostas os auxílios
  de solo não visuais são:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) disponíveis ao longo da rota de modo a garantir a navegação dentro do grau de precisão
  requerido pelo controle de tráfego aéreo; e

  (2) localizados de modo a permitir navegação de e para qualquer aeródromo regular, ou de
  alternativa, dentro do grau de precisão requerido pela operação envolvida. Com exceção dos
  auxílios-rádio requeridos em rotas para aeródromos de alternativa, todos os auxílios de
  solo não visuais requeridos para rotas aprovadas fora de espaço aéreo controlado serão listados
  nas especificações operativas do detentor de certificado.'
