text: '121.105 Facilidades de serviços e de manutenção de rampa

  Cada detentor de certificado conduzindo operações regulares deve demonstrar que pessoal
  competente e instalações e equipamentos adequados (incluindo peças de reposição, suprimentos
  e materiais) estão disponíveis em aeródromos específicos ao longo de cada uma de suas rotas,
  de acordo com as necessidades, de modo a prover serviços adequados de atendimento no solo,
  manutenção e manutenção preventiva aos aviões e equipamentos auxiliares.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
