section_title: 'Aeródromo de alternativa em rota ETOPS: serviços de prevenção, salvamento
  e combate a incêndio'
subsection_id: a
cite: 121.106(a)
title: 121.106(a)
text: '(a) Exceto como disposto no parágrafo (d) desta seção, o seguinte serviço de prevenção,
  salvamento e combate a incêndio deve estar disponível em cada aeródromo de alternativa em
  rota ETOPS listado em um despacho ou plano de voo:

  (1) em operações ETOPS até 180 minutos, cada aeródromo de alternativa ETOPS deve possuir
  o serviço descrito no parágrafo (a) desta seção equivalente ao especificado pela OACI como
  categoria 4 ou superior;

  (2) para operações ETOPS além de 180 minutos, cada aeródromo de alternativa em rota ETOPS
  deve possuir o serviço descrito no parágrafo (a) desta seção equivalente ao especificado
  pela OACI como categoria 4 ou superior. Adicionalmente, a aeronave deve se manter dentro
  da autorização de desvio ETOPS de um Aeródromo Adequado que possui serviço de resgate e
  combate a incêndio equivalente ao especificado pela OACI como categoria 7 ou superior.'
