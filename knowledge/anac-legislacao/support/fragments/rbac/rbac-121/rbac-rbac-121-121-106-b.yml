subsection_id: b
cite: 121.106(b)
title: 121.106(b)
text: (b) Se o equipamento e o pessoal requerido pelo parágrafo (a) desta seção não estiverem
  imediatamente disponíveis no aeródromo, o detentor de certificado ainda assim poderá listá-lo
  em seu despacho ou plano de voo se o mesmo puder contar com o auxílio de forças locais de
  combate a incêndios. Um tempo de resposta de 30 minutos para a disponibilidade do auxílio
  de forças locais é adequado, se estas forças puderem ser notificadas enquanto a aeronave
  está desviando-se para o aeródromo. As forças de combate a incêndio locais deverão permanecer
  o tempo que a aeronave necessite de tais serviços.
