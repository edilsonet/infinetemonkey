title: Centros de despacho de voo
text: '121.107 Centros de despacho de voo

  Cada detentor de certificado conduzindo operações regulares deve demonstrar que possui centros
  de despacho de voo em número suficiente para atender as operações a serem conduzidas e que
  tais centros estão localizados nos pontos necessários ao controle operacional de cada voo.

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  SUBPARTE F

  APROVAÇÃO DE ROTAS E ÁREAS PARA OPERAÇÕES NÃO REGULARES

  (Título da Subparte com redação dada pela Resolução nº 526, de 06.08.2019)'
