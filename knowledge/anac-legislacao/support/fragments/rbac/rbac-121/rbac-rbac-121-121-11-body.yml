title: Regras aplicáveis para operações em países estrangeiros
text: '121.11 Regras aplicáveis para operações em países estrangeiros

  Cada detentor de certificado deve, enquanto operando um avião em país estrangeiro, manter
  conformidade com as regras de tráfego aéreo do país envolvido e com as regras locais dos
  aeródromos, exceto quando uma regra deste regulamento for mais restritiva e puder ser seguida
  sem violar as regras daquele país.'
