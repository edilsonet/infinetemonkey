text: '121.111 Aplicabilidade

  Esta subparte estabelece regras para obtenção de aprovação de rotas e de áreas de operação
  para detentores de certificado que conduzam operações não regulares.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
