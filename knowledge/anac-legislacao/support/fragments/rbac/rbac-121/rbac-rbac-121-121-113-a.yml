cite: 121.113(a)
title: 121.113(a)
text: '(a) Cada detentor de certificado conduzindo operações não regulares e buscando aprovação
  de área e de rotas deve demonstrar:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) que está habilitado a conduzir operações dentro do espaço aéreo brasileiro, de acordo
  com os parágrafos (a)(3) e (4) desta seção;

  (2) que está habilitado a conduzir operações de acordo com os requisitos aplicáveis a cada
  área fora do Brasil para a qual é solicitada autorização;

  (3) que está equipado e habilitado para conduzir operações dentro do sistema de aerovias
  brasileiras, aerovias estrangeiras e rotas de assessoramento (ADR''s) a serem voadas, usando
  as facilidades de navegação e de comunicações associadas às mesmas; e

  (4) que irá conduzir todas as suas operações IFR ou VFR noturnas dentro de aerovias brasileiras,
  aerovias estrangeiras, espaço aéreo controlado ou em rotas assessoramento (ADR''s).'
