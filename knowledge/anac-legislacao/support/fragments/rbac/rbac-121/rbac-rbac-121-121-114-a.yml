cite: 121.114(a)
title: 121.114(a)
text: (a) A ANAC poderá permitir que o detentor de certificado estabeleça altitudes mínimas
  de voo para as rotas que opere desde que não sejam inferiores às estabelecidas pelo Brasil
  ou pelos Estados sobrevoados, a não ser que tenham sido expressamente aprovadas.
