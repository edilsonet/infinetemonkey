title: 121.114(b)
text: (b) Nas rotas nas quais os Estados mencionados em (a) não tenham estabelecido altitudes
  mínimas de voo, o detentor de certificado deverá especificar o método empregado para tal
  cálculo. As altitudes mínimas de voo determinadas pelo método citado não devem ser inferiores
  às especificadas no Anexo 2 da Convenção Internacional de Aviação Civil.
