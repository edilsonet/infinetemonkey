cite: 121.117(a)
title: 121.117(a)
text: '(a) Nenhum detentor de certificado conduzindo operações não regulares pode usar um
  aeródromo, a menos que ele seja cadastrado e apropriadamente equipado e adequado à operação
  proposta, considerando aspectos como dimensões, superfície das pistas, obstruções, facilidades,
  proteção ao público, iluminação, auxílios à navegação e aproximação, comunicação, horário
  de funcionamento e ATC.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
