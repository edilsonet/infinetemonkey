title: 121.117(b)
text: '(b) Cada detentor de certificado conduzindo operações não regulares deve demonstrar
  que possui um sistema aprovado para coletar, atualizar e disseminar ao pessoal apropriado
  informações aeronáuticas válidas para cada aeródromo por ela utilizado, de modo a garantir
  a segurança das operações nesses aeródromos. As informações aeronáuticas devem incluir:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) aeródromo:'
