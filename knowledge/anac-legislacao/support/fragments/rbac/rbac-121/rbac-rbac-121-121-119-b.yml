title: 121.119(b)
text: '(b) Cada detentor de certificado conduzindo operações não regulares que utilize previsões
  meteorológicas para exercer o controle operacional deve utilizar previsões providas pelas
  fontes especificadas no parágrafo (a) desta seção.

  (Redação dada pela Resolução nº 685, de 13.07.2022)'
