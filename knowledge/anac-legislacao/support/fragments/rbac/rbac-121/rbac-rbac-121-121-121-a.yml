cite: 121.121(a)
title: 121.121(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, nenhum detentor de certificado
  conduzindo operações não regulares pode conduzir qualquer operação ao longo de uma rota,
  a menos que os auxílios de solo não visuais sejam:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) disponíveis ao longo da rota de modo a garantir a navegação dentro do grau de precisão
  requerido pelo ATC; e

  (2) localizados de modo a permitir navegação de e para qualquer aeródromo regular, de reabastecimento
  ou de alternativa, dentro do grau de precisão requerido pela operação envolvida.'
