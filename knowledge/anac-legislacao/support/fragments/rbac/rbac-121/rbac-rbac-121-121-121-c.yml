text: (c) Com exceção dos auxílios-rádio requeridos em rotas para aeródromos de alternativa,
  todos os auxílios de solo não visuais requeridos para rotas aprovadas fora de espaço aéreo
  controlado serão listados nas especificações operativas do detentor de certificado.
