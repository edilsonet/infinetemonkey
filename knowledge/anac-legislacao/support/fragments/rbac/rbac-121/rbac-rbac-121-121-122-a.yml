section_title: 'Facilidades para comunicações: operações não regulares'
subsection_id: a
cite: 121.122(a)
title: 121.122(a)
text: (a) Cada detentor de certificado ao conduzir operações não regulares, que não operações
  cargueiras, em aviões com mais de dois motores deve demonstrar que possui um sistema de
  radiocomunicação de duas vias ou outro meio de comunicação aprovado pela ANAC. Este sistema
  deve garantir comunicações imediatas e confiáveis em toda a rota (direta ou circuito ponto-a-ponto)
  entre cada avião e o detentor de certificado e este e o serviço ATC apropriado, exceto como
  especificado na seção 121.351(c).
