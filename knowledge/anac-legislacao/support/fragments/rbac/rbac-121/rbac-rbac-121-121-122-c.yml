section_title: 'Facilidades para comunicações: operações não regulares'
subsection_id: c
cite: 121.122(c)
title: 121.122(c)
text: '(c) Cada detentor de certificado envolvido na condução de operações ETOPS além de 180
  minutos com aeronaves com mais de dois motores deve possuir um sistema de comunicação adicional,
  além do requerido pelo parágrafo (b) desta seção. Este sistema deve prover comunicação por
  voz via satélite com a mesma fidelidade de um sistema telefônico terrestre, ademais deve
  ser capaz de prover comunicações entre a tripulação e os serviços de controle de tráfego
  aéreo e entre a tripulação e o detentor do certificado. Para determinar a disponibilidade
  destas comunicações, o detentor do certificado deve considerar rotas potenciais e altitudes
  necessárias no caso de desvios para os aeródromos de alternativa ETOPS. Se o sistema de
  comunicação por satélite não estiver disponível ou for de baixa qualidade outro sistema
  de comunicações deve ser disponibilizado.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
