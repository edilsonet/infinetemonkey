text: '121.123 Facilidades de atendimento e serviços de rampa

  Cada detentor de certificado conduzindo operações não regulares deve demonstrar que dispõe
  de pessoal competente e de adequadas facilidades e equipamentos (incluindo peças de reposição,
  suprimento e materiais) a fim de assegurar apropriados serviços de atendimento no solo,
  manutenção e manutenção preventiva aos aviões e equipamentos auxiliares.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
