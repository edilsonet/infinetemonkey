title: 121.125(a)
text: '(a) Cada detentor de certificado conduzindo operações aéreas não regulares deve demonstrar
  que dispõe de:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) um sistema de acompanhamento de voo, aprovado e estabelecido de acordo com a subparte
  U deste regulamento, que seja adequado para o acompanhamento de cada voo, considerando as
  operações a serem conduzidas; e

  (2) centros de acompanhamento de voo localizados naqueles pontos necessários para:'
