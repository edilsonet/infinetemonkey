section_title: Sistema de acompanhamento de voos
subsection_id: b
cite: 121.125(b)
title: 121.125(b)
text: '(b) Um detentor de certificado conduzindo operações aéreas não regulares pode utilizar
  facilidades de acompanhamento de voos operadas por terceiros. Entretanto, a responsabilidade
  primária pelo controle operacional de cada voo não pode ser delegada a ninguém.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
