section_title: Sistema de acompanhamento de voos
subsection_id: i
cite: 121.125(i)
title: 121.125(i)
text: '(i) assegurar o apropriado acompanhamento do progresso de cada voo no que diz respeito
  à sua partida do ponto de origem e sua chegada no ponto de destino, incluindo pousos intermediários,
  desvios para alternativas e atrasos por problemas mecânicos ou de manutenção que possam
  ocorrer nesses locais; e

  (ii) assegurar que o piloto em comando receberá todas as informações necessárias à segurança
  de voo.'
