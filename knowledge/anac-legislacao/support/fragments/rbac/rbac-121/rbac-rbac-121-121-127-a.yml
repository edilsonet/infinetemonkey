title: 121.127(a)
text: '(a) Cada detentor de certificado ao conduzir operações aéreas não regulares usando
  um sistema de acompanhamento de voo deve demonstrar que:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) o sistema dispõe de pessoal e equipamento adequado para prover as informações necessárias
  ao início e ao prosseguimento seguro de cada voo para:'
