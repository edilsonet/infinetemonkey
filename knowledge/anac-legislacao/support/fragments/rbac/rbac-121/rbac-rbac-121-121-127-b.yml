title: 121.127(b)
text: '(b) O detentor de certificado conduzindo operações aéreas não regulares deve demonstrar
  que o pessoal especificado no parágrafo (a) desta seção e aqueles designados para o controle
  operacional do avião estão habilitados a exercerem suas funções.

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  SUBPARTE G

  REQUISITOS DO SISTEMA DE MANUAIS'
