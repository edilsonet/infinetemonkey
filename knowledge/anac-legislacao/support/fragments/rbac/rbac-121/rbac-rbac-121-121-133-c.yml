text: (c) Para os propósitos desta subparte, o detentor de certificado pode elaborar uma parcela
  do sistema de manuais contendo instruções e informações de manutenção, no todo ou em parte,
  sob a forma impressa ou outras formas aceitáveis pela ANAC.
