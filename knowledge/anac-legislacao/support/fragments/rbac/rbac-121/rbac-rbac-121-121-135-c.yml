cite: 121.135(c)
title: 121.135(c)
text: '(c) O sistema de manuais só pode conter cópias de publicações originais dos fabricantes
  dos aviões e equipamentos, como previsto no parágrafo (b) desta seção, se:

  (1) tais cópias atenderem ao previsto no parágrafo (a) desta seção; e

  (2) o original for em português ou em inglês. Se for em inglês, o detentor de certificado
  deve demonstrar que o pessoal ao qual as cópias serão distribuídas conforme os parágrafos
  (a)(1) e (2) da seção 121.137 deste regulamento, é capaz de ler e entender, perfeitamente,
  as instruções nelas contidas.'
