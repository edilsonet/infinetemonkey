text: '(e) Os assuntos citados nesta seção constituem os itens do sistema de manuais do detentor
  de certificado que não são especificamente requeridos em outras seções deste regulamento,
  visando completar o conjunto de informações requeridas pelo Apêndice 2, da Parte I do Anexo
  6 à Convenção de Chicago.

  (Redação dada pela Resolução nº 334, de 01.07.2014)'
