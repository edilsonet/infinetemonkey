cite: 121.135(i)
title: 121.135(i)
text: '(i) uma política específica do detentor de certificado que venha a abranger manobras,
  ações e procedimentos normais, anormais e de emergência aprovados, previstos nos seu programa
  de treinamento operacional, os quais incluam aqueles voltados para evitar tesouras de vento
  em baixa altitude e CFIT - Controlled Flight into Terrain.

  (2) atribuições e responsabilidades funcionais de cada tripulante, membros apropriados da
  organização de solo e do pessoal de direção;

  (3) referências aos Regulamentos e a outros documentos apropriados;

  (4) despacho de voo e controle operacional, incluindo procedimentos de coordenação de despachos
  de voo e controle operacional ou procedimentos de acompanhamento de voo, como aplicável;

  (5) procedimentos de voo em rota, comunicações e navegação, incluindo procedimentos para
  despacho ou continuação de voo se algum item de equipamento, requerido para um particular
  tipo de operação, tornar-se inoperante ou inservível em rota, adicionalmente:'
