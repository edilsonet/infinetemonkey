cite: 121.135(v)
title: 121.135(v)
text: '(v) mínimos meteorológicos de pouso e decolagem; e

  (vi) qualquer outra informação julgada pertinente;

  (9) limitações de certificação e funcionamento do avião, de peso de decolagem, de rota e
  de pouso;

  (10) dados de desempenho para todas as fases de operações ETOPS;

  (11) procedimentos para familiarizar passageiros com o uso de equipamentos de emergência
  durante o voo;

  (12) equipamentos e procedimentos de emergência;

  (13) método de designação de sucessão da tripulação no comando do voo;

  (14) procedimentos para determinar a praticabilidade de pistas para pousos e decolagem e
  para a disseminação das informações pertinentes ao pessoal de operações;

  (15) procedimentos para operação em gelo, granizo, tempestade, turbulência e outras condições
  atmosféricas potencialmente perigosas;

  (16) cada currículo de programa de treinamento requerido incluindo as apropriadas fases
  de solo, voo e emergência;

  (17) procedimentos e instruções sobre manutenção, manutenção preventiva e serviços de rampa;

  (18) tempos limites, ou padrões para determinação de tempo limite para revisões gerais,
  inspeções e verificações de células, grupos moto propulsores e equipamentos normais e de
  emergência;

  (19) procedimentos para reabastecimento dos aviões, eliminação de contaminação de combustível,
  prevenção de incêndios (incluindo proteção eletrostática) e proteção aos passageiros durante
  os reabastecimentos;

  (20) instruções abrangendo as responsabilidades e autoridade dos inspetores nas inspeções
  de aeronavegabilidade;

  (21) métodos e procedimentos para manter o peso e o centro de gravidade dos aviões dentro
  dos limites aprovados;

  (22) quando aplicável, procedimentos para qualificação de tripulantes e despachantes de
  voo em rotas e aeródromos;

  (23) procedimentos para notificação de acidentes e incidentes nos termos da legislação específica
  do Sistema de Investigação e Prevenção de Acidentes Aeronáuticos (SIPAER);

  (24) em operações ETOPS, de transporte de passageiros, acima de 180 minutos deverá ser elaborado
  um plano para a continuação de viagem dos passageiros;

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (25) procedimentos e instruções sobre o transporte de artigos perigosos, de acordo com a
  Subparte Z, incluindo ações a serem tomadas em caso de emergência;

  (Redação dada pela Resolução nº 608, de 11.02.2021)

  Nota: orientações sobre o desenvolvimento de políticas e procedimentos para lidar com ocorrências
  com artigos perigosos a bordo de aeronaves constam em norma específica da ANAC.

  (Incluído pela Resolução nº 608, de 11.02.2021)

  (26) o nome e as atribuições do pessoal da administração requerido pelo RBAC 119;

  (Redação dada pela Resolução nº 334, de 01.07.2014)

  (27) deve conter procedimentos operacionais padronizados (SOP) que proporcionem ao pessoal
  de operações de voo orientações para as operações, em todas as fases de voo, de maneira
  segura, eficiente, lógica e previsível;

  (28) componentes e elementos relativos ao sistema de gerenciamento da segurança operacional
  (SGSO) do detentor do certificado, conforme se segue:'
