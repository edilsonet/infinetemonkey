cite: 121.137(a)
title: 121.137(a)
text: '(a) Cada detentor de certificado deve fornecer cópias do sistema de manuais, ou suas
  partes apropriadas, requerido por 121.133 (e respectivas alterações e/ou adendos) ou de
  partes apropriadas do mesmo para:

  (1) seu pessoal de operações de solo e seu pessoal de manutenção;

  (2) suas tripulações; e

  (3) os órgãos determinados pela ANAC.'
