section_title: Disponibilidade e distribuição do sistema de manuais
subsection_id: b
cite: 121.137(b)
title: 121.137(b)
text: (b) Cada pessoa a quem o sistema de manuais (ou a parte aplicável do mesmo) for distribuído
  conforme o parágrafo (a) desta seção deve mantê-lo atualizado com as alterações e adendos
  a ela fornecidos e deve manter o sistema de manuais ou os volumes apropriados em local acessível
  quando executando as tarefas a ela designadas.
