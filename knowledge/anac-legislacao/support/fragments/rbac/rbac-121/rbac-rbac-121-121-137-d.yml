cite: 121.137(d)
title: 121.137(d)
text: (d) Não obstante o estabelecido no parágrafo (b) desta seção, para o caso de tripulantes,
  o detentor de certificado pode optar por manter a bordo de seus aviões cópias do sistema
  de manuais (ou partes aplicáveis do mesmo) atualizadas e em quantidade adequada ao número
  e tipos de tripulantes a bordo. O posicionamento e a quantidade desses sistemas de manuais
  (ou partes aplicáveis dos mesmos) na cabine de passageiros de cada tipo de avião e para
  cada configuração interna dessa cabine (se aplicável) deve ser aprovada pela ANAC.
