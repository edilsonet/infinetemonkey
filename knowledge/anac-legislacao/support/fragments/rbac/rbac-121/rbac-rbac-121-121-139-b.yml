section_title: Requisitos para manual a bordo de aviões. Operações não regulares
subsection_id: b
cite: 121.139(b)
title: 121.139(b)
text: '(b) Se o detentor de certificado conduzindo operações não regulares for capaz de executar
  toda a manutenção programada em locais específicos, nos quais ele mantém as partes de manutenção
  do manual, não haverá necessidade de ter a bordo tais partes quando o avião estiver se dirigindo
  para tais locais.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
