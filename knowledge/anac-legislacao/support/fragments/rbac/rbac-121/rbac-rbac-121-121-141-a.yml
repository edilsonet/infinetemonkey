cite: 121.141(a)
title: 121.141(a)
text: (a) Cada detentor de certificado deve possuir um Manual de Voo do Avião (AFM) ou Manual
  de Operações do Avião (AOM) atualizado para cada tipo de avião que ele opera, exceto para
  tipos não certificados na categoria transporte antes de 01 de janeiro de 1965.
