title: 121.141(b)
text: '(b) Em cada avião que o parágrafo (a) desta seção requer possuir um manual de voo,
  o detentor de certificado pode levar a bordo tanto o manual requerido por 121.133, se ele
  contiver as informações requeridas pelo aplicável manual de voo e tais informações forem
  claramente identificadas como requisitos do AFM, ou um Manual de Operações do Avião (AOM).
  Se o detentor de certificado optar por transportar a bordo o manual requerido por 121.133,
  ele pode revisar as seções dos procedimentos operacionais e modificar a apresentação dos
  dados de desempenho contidos no AFM se tais modificações forem:

  (1) aprovadas pela ANAC; e

  (2) claramente identificadas como requisitos do AFM.

  SUBPARTE H

  REQUISITOS DOS AVIÕES'
