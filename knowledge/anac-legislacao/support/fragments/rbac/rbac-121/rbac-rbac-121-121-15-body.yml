text: '121.15 Transporte de drogas narcóticas, maconha e outras drogas ou substâncias depressivas
  ou estimulantes

  Se um detentor de certificado, operando segundo este regulamento, permitir que um avião
  de sua propriedade ou por ele arrendado seja engajado em qualquer operação que ele, detentor
  de certificado, saiba estar violando a seção 91.19 do RBAC nº 91, tal operação pode servir
  de base para suspensão ou revogação do certificado.

  (Redação dada pela Resolução nº 612, de 09.03.2021)

