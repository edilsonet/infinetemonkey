text: (b) Visando atender aos requisitos de aeronavegabilidade e cumprir as limitações operacionais,
  um detentor de certificado pode utilizar um método aprovado para controle de peso e balanceamento
  de seus aviões, baseado em peso médio, assumido ou estimado.
