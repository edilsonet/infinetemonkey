cite: 121.153(c)
title: 121.153(c)
text: (c) Um detentor de certificado operando segundo este regulamento deve ter o uso exclusivo
  de, no mínimo, um avião que atenda aos requisitos do parágrafo 121.157(b) deste regulamento
  “Uso exclusivo” significa ter a posse, o controle e o uso do avião através de compra à vista
  ou a prazo registrada no RAB ou através de contrato de arrendamento segundo os termos do
  parágrafo (d) desta seção.
