section_title: 'Requisitos de aviões: geral'
subsection_id: i
cite: 121.153(i)
title: 121.153(i)
text: '(i) ser um detentor de certificado operando segundo este regulamento;

  (ii) ser empresa de transporte aéreo estrangeira sediada em país filiado à OACI; ou

  (iii) ser uma empresa de arrendamento de aeronaves nacional ou estrangeira (ou outra pessoa
  física ou jurídica), sujeita à aprovação da ANAC.

  (3) o avião for de tipo certificado, com certificado de tipo emitido ou reconhecido conforme
  previsto no RBAC 21;

  (4) o avião atender aos requisitos deste regulamento ou, se importado, atender aos requisitos
  de regulamento equivalente do país de origem e aceito pela ANAC, exceto que deve cumprir
  as provisões da seção 121.317 deste regulamento;

  (5) o avião for operado por tripulação empregada do detentor de certificado; e

  (6) exceto nos casos previstos na seção 121.569, o avião for registrado no Brasil.

  (Redação dada pela Resolução nº 334, de 01.07.2014)'
