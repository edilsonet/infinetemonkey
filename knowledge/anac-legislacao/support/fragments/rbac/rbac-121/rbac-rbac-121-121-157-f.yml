cite: 121.157(f)
title: 121.157(f)
text: (f) Outros aviões não incluídos na categoria transporte. Nenhum detentor de certificado
  pode operar segundo este regulamento um avião com certificado de tipo certificado emitido
  após 31 de dezembro de 1964, não incluído na categoria transporte.
