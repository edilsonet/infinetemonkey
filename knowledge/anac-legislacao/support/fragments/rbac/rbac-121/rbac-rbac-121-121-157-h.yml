section_title: Requisitos de certificação dos aviões
subsection_id: h
cite: 121.157(h)
title: 121.157(h)
text: (h) Ninguém pode operar segundo este regulamento um avião cujo requerimento para certificação
  de tipo foi apresentado após 29 de março de 1995, a menos que o tipo do avião tenha sido
  certificado segundo o RBHA 25 ou RBAC 25, conforme aplicável.
