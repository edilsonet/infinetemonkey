section_title: Requisitos de certificação dos aviões
subsection_id: i
cite: 121.157(i)
title: 121.157(i)
text: '(i) esteja motorizado com um tipo e modelo de motor estabelecido no Apêndice I deste
  regulamento, quando certificado para peso bruto máximo para decolagem superior a 45.000
  lb; e

  (ii) atenda aos requisitos especiais de aeronavegabilidade estabelecidos nas seções 121.213
  até 121.287 ou no Apêndice I, tudo deste regulamento.'
