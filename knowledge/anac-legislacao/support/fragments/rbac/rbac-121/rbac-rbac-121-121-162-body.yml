text: '121.162 Base de aprovação de tipo para operações ETOPS

  Exceto em operações de transporte de passageiros com aviões com mais de dois motores fabricados
  antes de 17 de fevereiro de 2015 e exceto um avião com dois motores seja utilizado em voos
  ETOPS de até 75 minutos, nenhum detentor de certificado pode conduzir operações ETOPS a
  não ser que o projeto de tipo do avião tenha sido aprovado para tais operações e cada avião
  atenda ao seu documento CMP, como a seguir:'
