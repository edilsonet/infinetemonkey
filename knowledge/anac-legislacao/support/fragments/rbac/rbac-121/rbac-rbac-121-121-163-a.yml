cite: 121.163(a)
title: 121.163(a)
text: '(a) Voos de avaliação operacional iniciais. Ninguém pode operar uma aeronave que não
  tenha o tipo de operação aprovada anteriormente segundo este regulamento ou segundo o RBAC
  135, a menos que esta aeronave possua um mínimo de 100 horas de voos adicionais aos de certificação,
  aceitáveis pela ANAC, incluindo um número de voos representativos para aeródromos em rota.
  O requisito de 100 horas adicionais pode ser reduzido pela ANAC se ficar demonstrado que
  um adequado nível de proficiência foi atingido. Pelo menos 10 horas de voo devem ser voadas
  à noite, sendo tais horas irredutíveis.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
