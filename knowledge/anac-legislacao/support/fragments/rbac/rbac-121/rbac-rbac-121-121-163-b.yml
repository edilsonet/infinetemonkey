cite: 121.163(b)
title: 121.163(b)
text: (b) Voos de avaliação para operações. A menos que de outra forma autorizado pela ANAC,
  para cada tipo de avião o detentor de certificado deve conduzir voos de avaliação operacional,
  aceitáveis pela ANAC, para as operações que ele pretenda conduzir, incluindo um número representativo
  de voos para aeródromos em rota.
