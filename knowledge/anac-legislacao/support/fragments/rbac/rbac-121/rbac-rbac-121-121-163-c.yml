cite: 121.163(c)
title: 121.163(c)
text: (c) Voos de avaliação operacional em aviões materialmente modificados. A menos que de
  outra forma autorizado pela ANAC, para cada tipo de avião que tenha sido materialmente modificado,
  um detentor de certificado deve conduzir voos de avaliação operacional aceitáveis pela ANAC
  para as operações que ele pretenda conduzir com tal avião, incluindo um número representativo
  de voos para aeródromos em rota.
