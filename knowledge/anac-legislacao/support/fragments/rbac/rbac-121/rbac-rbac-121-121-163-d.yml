title: 121.163(d)
text: '(d) Definição de materialmente modificado. Para os propósitos do parágrafo (c) desta
  seção, um tipo de avião é considerado como tendo seu projeto materialmente alterado se as
  modificações incluírem:

  (1) instalações de motores diferentes daqueles com os quais o tipo foi certificado;

  (2) alterações no avião ou em seus componentes que afetem materialmente as características
  de voo.'
