cite: 121.163(e)
title: 121.163(e)
text: '(e) Nenhum detentor de certificado pode realizar operações transportando passageiros
  em aviões executando voos de avaliação operacional, exceto aqueles necessários à avaliação
  e aqueles designados pelo ANAC. Entretanto, pode transportar cargas, malotes postais ou
  realizar treinamento de tripulações quando aprovado.

  SUBPARTE I

  DESEMPENHO DOS AVIÕES. LIMITES OPERACIONAIS'
