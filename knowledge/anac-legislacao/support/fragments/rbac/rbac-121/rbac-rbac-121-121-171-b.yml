cite: 121.171(b)
title: 121.171(b)
text: (b) Para os propósitos deste regulamento, "comprimento efetivo da pista", para pouso,
  significa a distância desde o ponto definido pela interseção do plano de liberação de obstáculos
  (associado com a cabeceira a ser usada) com a linha central da pista até o final da mesma
  pista.
