title: 121.171(c)
text: '(c) Para o propósito deste regulamento, "plano de liberação de obstáculos" ("

  obstruction clearance plane

  ") significa um plano inclinado, subindo a partir da pista com um gradiente de l:20 com
  o plano horizontal e tangente, ou acima, de todos os obstáculos dentro de uma área específica
  em torno da pista, como mostrado em uma vista em perfil dessa área. Na vista em planta,
  a linha central da área específica coincide com a linha central da pista, começando no ponto
  definido pela intersecção do plano de liberação de obstáculos com a linha central da pista
  e prosseguindo até, pelo menos, um ponto distante de 460m (l500 pés) do ponto de início.
  Depois disso, essa linha central coincide com a projeção da trajetória de decolagem sobre
  o solo (no caso de decolagem), ou com a projeção da trajetória de aproximação sobre o solo
  (no caso de pouso) ou, se essas trajetórias não são definidas para o aeródromo, ela continua,
  consistente com curvas de pelo menos l200 m (4.000 pés) de raio, até atingir um ponto a
  partir do qual o plano de liberação de obstáculos livra todos os obstáculos. Essa área estende-se
  lateralmente 60m (200 pés) para cada lado da linha central no ponto de intersecção do plano
  de liberação de obstáculos com a linha central da pista e mantém-se com esta largura enquanto
  sobre a pista; a partir da cabeceira, ela aumenta uniformemente até l50 m (500 pés) para
  cada lado da linha central até um ponto distante de 460m (l500 pés) do seu início; após
  isso, ela estende-se lateralmente l50 m (500 pés) para cada lado da linha central.'
