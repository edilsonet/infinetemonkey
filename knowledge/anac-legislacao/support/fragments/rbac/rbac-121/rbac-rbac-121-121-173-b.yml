title: 121.173(b)
text: '(b) Exceto como previsto no parágrafo (c) desta seção, cada detentor de certificado
  operando um avião com motores a turbina ou turboélice deve atender às provisões aplicáveis
  de 121.189 até 121.197, exceto quando ele operar:

  (1) Um avião turboélice de tipo certificado após 29 de agosto de 1959, mas anteriormente
  certificado com o mesmo número de motores convencionais, quando pode optar pelos requisitos
  de 121.175 até 121.187; ou

  (2) até 20 de Dezembro de 2010, para operações com um avião com motores turboélice descritos
  na seção 121.157 parágrafo (f) um detentor de certificado deverá atender com os requisitos
  aplicáveis do Apêndice K deste regulamento.'
