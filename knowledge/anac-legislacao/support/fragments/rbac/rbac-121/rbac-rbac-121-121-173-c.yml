title: 121.173(c)
text: (c) Cada detentor de certificado operando um grande avião não incluído na categoria
  transporte, de tipo certificado antes de 01 de janeiro de 1965, deve atender aos requisitos
  de 121.199 até 121.205 e qualquer determinação de conformidade deve ser baseada, apenas,
  em dados de desempenho aprovados.
