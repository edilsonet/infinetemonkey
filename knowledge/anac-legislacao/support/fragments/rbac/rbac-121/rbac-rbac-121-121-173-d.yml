title: 121.173(d)
text: (d) Os dados de desempenho constantes do Manual de Voo do Avião (AFM) aplicam-se na
  determinação de conformidade com 121.175 até 121.197. Onde as condições forem diferentes
  daquelas nas quais os dados de desempenho estão baseados, a conformidade é determinada por
  interpolação ou computando os efeitos das modificações nas variáveis específicas, se os
  resultados da interpolação ou da computação forem substancialmente tão acurados quanto os
  resultados diretos de ensaios.
