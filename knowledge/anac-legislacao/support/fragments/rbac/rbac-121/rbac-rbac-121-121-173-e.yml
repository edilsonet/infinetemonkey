title: 121.173(e)
text: (e) Exceto como previsto no parágrafo (c) desta seção, ninguém pode decolar com um avião
  com motores convencionais com peso maior do que o peso permissível pela pista sendo utilizada
  (determinado conforme as limitações de pista para decolagem das regras operacionais da subparte
  I deste regulamento), após levar em consideração os fatores de correção de temperaturas
  de operação do Manual de Voo do Avião (AFM) aplicável.
