title: 121.173(f)
text: '(f) A ANAC pode autorizar, nas especificações operativas, desvios dos requisitos desta
  subparte se, em circunstâncias extraordinárias, a observância literal de um ou mais desses
  requisitos não afetar a segurança das operações.

  (Redação dada pela Resolução nº 334, de 01.07.2014)'
