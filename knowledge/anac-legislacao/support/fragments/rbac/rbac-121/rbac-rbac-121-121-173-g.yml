title: 121.173(g)
text: (g) A largura de 10 milhas especificada em 121.179 até 121.183 pode ser reduzida para
  5 milhas, por não mais de 20 milhas de distância, em operações VFR ou quando as facilidades
  de navegação fornecerem identificação confiável e acurada das elevações e obstruções localizadas
  entre 5 e 10 milhas, para cada lado do curso pretendido.
