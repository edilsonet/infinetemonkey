title: 121.173(h)
text: '(h) Q

  uando o aeródromo não dispuser de informações meteorológicas que atendam às seções 121.101
  ou 121.119 deste regulamento, o detentor de certificado pode solicitar aprovação da ANAC
  para

  uso de meios alternativos para considerar os parâmetros necessários para cumprimento dos
  requisitos desta subparte.

  (Redação dada pela Resolução nº 685, de 13.07.2022)'
