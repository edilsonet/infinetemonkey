section_title: 'Aviões com motores convencionais: limitações de peso'
subsection_id: a
cite: 121.175(a)
title: 121.175(a)
text: (a) Ninguém pode decolar com um avião com motores convencionais de um aeródromo localizado
  a uma altitude fora da gama de altitudes para a qual os pesos máximos de decolagem para
  esse avião foram determinados.
