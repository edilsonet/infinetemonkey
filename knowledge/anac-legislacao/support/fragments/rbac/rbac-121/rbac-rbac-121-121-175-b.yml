section_title: 'Aviões com motores convencionais: limitações de peso'
subsection_id: b
cite: 121.175(b)
title: 121.175(b)
text: (b) Ninguém pode decolar com um avião com motores convencionais para um aeródromo que
  esteja localizado a uma altitude fora da gama de altitudes para a qual os pesos máximos
  de pouso para esse avião foram determinados.
