cite: 121.175(c)
title: 121.175(c)
text: (c) Ninguém pode especificar, ou ter especificado, um aeródromo de alternativa que esteja
  localizado a uma altitude fora da gama de altitudes para a qual os pesos máximos de pouso
  para esse avião foram determinados.
