section_title: 'Aviões com motores convencionais: limitações de peso'
subsection_id: e
cite: 121.175(e)
title: 121.175(e)
text: (e) Ninguém pode decolar com um avião com motores convencionais se seu peso na chegada
  ao aeródromo de destino for maior do que o peso máximo de pouso autorizado para a altitude
  desse aeródromo, considerando o consumo normal de óleo e combustível em rota.
