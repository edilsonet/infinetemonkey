section_title: 'Aviões com motores convencionais: limitações de decolagem'
subsection_id: b
cite: 121.177(b)
title: 121.177(b)
text: (b) Na aplicação desta seção, devem ser feitas correções para o gradiente efetivo da
  pista. Para considerar os efeitos do vento, os dados de decolagem baseados em ar calmo devem
  ser corrigidos levando em consideração até 50% de qualquer componente reportado de vento
  de proa e mais que 150% de qualquer componente reportado de vento de cauda.
