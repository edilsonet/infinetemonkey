section_id: '121.179'
section_title: 'Aviões com motores convencionais: limitações em rota com todos os motores
  operando'
subsection_id: a
cite: 121.179(a)
title: 121.179(a)
text: (a) Ninguém pode decolar com um avião com motores convencionais, considerando consumo
  normal de combustível e óleo, se não for possível manter uma razão de subida (em pés por
  minuto), com todos os motores funcionando, de pelo menos 6,90 VSO (isto é, o número de pés
  por minuto obtido pela multiplicação do número de nós por 6,9) a uma altitude de pelo menos
  1000 pés acima da mais alta obstrução existente dentro de 10 milhas para cada lado do curso
  pretendido.
