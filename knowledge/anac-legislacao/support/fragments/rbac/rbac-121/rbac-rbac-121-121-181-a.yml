section_id: '121.181'
section_title: 'Aviões com motores convencionais: limitações em rota com um motor inoperante'
subsection_id: a
cite: 121.181(a)
title: 121.181(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, ninguém pode decolar com um
  avião com motores convencionais com peso tal que, considerando consumo normal de combustível
  e óleo, não permita uma razão de subida (em pés por minuto), com um motor inoperante, de
  pelo menos

  (0,079 - 0,106/N) VSO2

  (onde N é o número de motores instalados e VSO é expresso em nós) a uma altitude de pelo
  menos 1000 pés acima da mais alta obstrução existente dentro de 10 milhas para cada lado
  do curso pretendido. Entretanto, para os propósitos deste parágrafo, a razão de subida,
  para aviões certificados segundo a parte 4a do “Civil Air Regulations” dos Estados Unidos
  da América, será de 0,026 VSO2.'
