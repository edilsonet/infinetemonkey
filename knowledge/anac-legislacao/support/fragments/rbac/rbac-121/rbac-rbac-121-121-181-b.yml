section_id: '121.181'
section_title: 'Aviões com motores convencionais: limitações em rota com um motor inoperante'
subsection_id: b
cite: 121.181(b)
title: 121.181(b)
text: (b) Em lugar dos requisitos do parágrafo (a) desta seção, uma pessoa pode, sob um procedimento
  aprovado, operar um avião com motores convencionais a uma altitude, com todos os motores
  operando, que possibilite ao avião prosseguir, após uma falha de motor, para um aeródromo
  de alternativa onde um pouso possa ser feito de acordo com 121.187, considerando consumo
  normal de combustível e óleo. Após a falha, a trajetória de voo deve livrar o solo e qualquer
  obstrução dentro de 5 milhas para cada lado do curso pretendido por, pelo menos, 2000 pés.
