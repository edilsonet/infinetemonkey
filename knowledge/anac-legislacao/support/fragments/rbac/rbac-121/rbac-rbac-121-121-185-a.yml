section_title: 'Aviões com motores convencionais: limitações de pouso no aeródromo de destino'
subsection_id: a
cite: 121.185(a)
title: 121.185(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção ninguém pode decolar com um avião
  com motores convencionais a menos que seu peso na chegada, considerando consumo normal de
  combustível e óleo no voo, permita um pouso completo no destino pretendido dentro de 60%
  do comprimento efetivo de cada pista descrita abaixo, desde um ponto 50 pés diretamente
  acima da interseção do plano de liberação de obstáculos com a pista. Para os propósitos
  de determinar o peso de pouso permissível no aeródromo de destino, assume-se o seguinte:

  (1) o avião pousa na pista e na direção mais favoráveis com ar calmo;

  (2) o avião pousa na pista mais adequada considerando a provável direção e velocidade do
  vento (previstas para o horário esperado de chegada), as características de manuseio no
  solo do tipo de avião, outras condições como auxílios de pouso e terreno e considerando
  para efeitos de trajetória de pouso e rolagem até 50% da componente de vento de proa ou
  mais que 150 % da componente de vento de cauda.'
