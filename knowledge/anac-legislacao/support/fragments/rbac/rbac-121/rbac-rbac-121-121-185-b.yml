section_title: 'Aviões com motores convencionais: limitações de pouso no aeródromo de destino'
subsection_id: b
cite: 121.185(b)
title: 121.185(b)
text: (b) Um avião que estivesse proibido de decolar por não atender aos requisitos do parágrafo
  (a)(2) desta seção poderá fazê-lo se for indicado um aeródromo de alternativa atendendo
  a todos os requisitos desta seção, considerando que o pouso total possa ser feito em 70%
  do comprimento efetivo da pista.
