section_title: 'Aviões com motores convencionais: limitações de pouso no aeródromo de alternativa'
subsection_id: a
cite: 121.187(a)
title: 121.187(a)
text: (a) Ninguém pode indicar um aeródromo como aeródromo de alternativa em um despacho ou
  liberação de voo, a menos que o avião (no peso estimado ao tempo de pouso no aeródromo),
  baseado nas suposições de 121.185, possa ser trazido a uma parada total após o pouso dentro
  de 70% do comprimento efetivo da pista.
