section_title: 'Aviões com motores a turbina: limitações de decolagem'
subsection_id: a
cite: 121.189(a)
title: 121.189(a)
text: (a) Ninguém pode decolar com um avião com motores a turbina com um peso maior que o
  peso previsto no Manual de Voo do Avião (AFM) para a altitude do aeródromo e para a temperatura
  ambiente existente na decolagem.
