section_title: 'Aviões com motores a turbina: limitações de decolagem'
subsection_id: b
cite: 121.189(b)
title: 121.189(b)
text: (b) Ninguém pode decolar com um avião com motores a turbina, de tipo certificado entre
  26 de agosto de l957 e 30 de agosto de 1959 (SR422, 422A da FAA), com um peso maior que
  o peso previsto no AFM para as distâncias mínimas requeridas para decolagem. No caso de
  avião de tipo certificado após 30 de setembro de l958 (SR422A 422B da FAA), a distância
  de decolagem pode incluir um "clearway” mas o comprimento desse "clearway" não pode ser
  maior que metade do comprimento da corrida de decolagem.
