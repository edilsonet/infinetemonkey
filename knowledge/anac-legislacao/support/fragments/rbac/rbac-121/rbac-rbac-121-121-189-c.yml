section_title: 'Aviões com motores a turbina: limitações de decolagem'
subsection_id: c
cite: 121.189(c)
title: 121.189(c)
text: '(c) Ninguém pode decolar com um avião com motores a turbina, de tipo certificado após
  26 de agosto de l959 (SR422B da FAA), com um peso maior que o peso previsto no AFM, para
  cumprir os seguintes requisitos:

  (1) A distância disponível de aceleração e parada (ASDA) não pode exceder o comprimento
  da pista mais o comprimento do "stopway" eventualmente existente;

  (2) a distância disponível para (TODA) não pode exceder o comprimento da pista mais o comprimento
  do "clearway", eventualmente existente, e o comprimento de "clearway" incluído não pode
  ser maior que metade do comprimento da pista;

  (3) a distância disponível para corrida de decolagem (TORA) não pode ser maior que o comprimento
  da pista.'
