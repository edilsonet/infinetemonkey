title: 121.189(f)
text: (f) Para os propósitos desta seção, assume-se que o avião não é inclinado lateralmente
  antes de atingir a altura de 50 pés, como mostrado nos dados de trajetória de decolagem
  ou de trajetória líquida de decolagem (conforme aplicável) do Manual de Voo do Avião (AFM),
  e, após isso, que a inclinação lateral não excede l5º.
