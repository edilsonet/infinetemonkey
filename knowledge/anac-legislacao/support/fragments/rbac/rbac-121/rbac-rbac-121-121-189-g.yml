title: 121.189(g)
text: (g) Para os propósitos desta seção, os termos "distância de decolagem” ("takeoff distance"),
  "corrida de decolagem" ("takeoff run"), "trajetória líquida de decolagem" ("net takeoff
  flight path") e "trajetória de decolagem" ("takeoff path") têm os mesmos significados que
  os adotados nas regras sob as quais o avião foi certificado.
