section_title: 'Aviões com motores a turbina: limitações de pouso no aeródromo de destino'
subsection_id: a
cite: 121.195(a)
title: 121.195(a)
text: (a) Ninguém pode decolar com um avião com motores a turbina com um peso (assumindo consumo
  normal de combustível e óleo no voo para o aeródromo de destino e de alternativa) tal que,
  na chegada, exceda o peso de pouso previsto no AFM para a altitude do aeródromo de destino
  ou de alternativa e para a temperatura ambiente esperada no horário estimado de pouso.
