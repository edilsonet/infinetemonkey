section_title: 'Aviões com motores a turbina: limitações de pouso no aeródromo de destino'
subsection_id: c
cite: 121.195(c)
title: 121.195(c)
text: (c) Um avião turboélice que estaria proibido de decolar por não cumprir o parágrafo
  (b) (2) desta seção pode fazê-lo se for indicado um aeródromo de alternativa que atenda
  a todos os requisitos desta seção e, adicionalmente, que possa executar um pouso completo
  nesse aeródromo utilizando 70% do comprimento efetivo da sua pista.
