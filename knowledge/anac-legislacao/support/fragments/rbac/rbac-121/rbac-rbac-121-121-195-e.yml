title: 121.195(e)
text: (e) Um avião propelido a jato que seria proibido de decolar por não atender aos requisitos
  do parágrafo (b)(2) desta seção poderá fazê-lo se indicar um aeródromo de alternativa que
  cumpra todos os requisitos do parágrafo (b) desta seção.
