section_title: 'Aviões categoria transporte cargueiros: aumento dos pesos zero combustível
  e de pouso'
subsection_id: a
cite: 121.198(a)
title: 121.198(a)
text: '(a) Não obstante as provisões estruturais aplicáveis dos requisitos de aeronavegabilidade,
  mas sujeito aos parágrafos (b) até (g) desta seção, um detentor de certificado pode operar
  (em serviços de carga somente) qualquer dos seguintes aviões (de tipo certificado pela parte
  4b do “Civil Air Regulation” dos Estados Unidos da América efetiva antes de 13 de março
  de 1965) com pesos zero combustível e de pouso aumentados:

  (1) DC-6A, DC-6B, DC-7B e DC-7C; e

  (2) L1049B, C, D, E, F e H e L1049A quando modificado de acordo o certificado de tipo suplementar
  SA 4-1402.'
