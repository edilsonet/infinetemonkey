title: 121.198(g)
text: (g) Exceto como previsto para o transporte de pessoas pela seção 121.583, cada avião
  operado com pesos aumentados segundo esta seção deve, antes de ser utilizado em serviço
  com passageiros, ser inspecionado utilizando procedimentos especiais de inspeção para retorno
  ao serviço de passageiros elaborados pelo fabricante e aprovados pela ANAC.
