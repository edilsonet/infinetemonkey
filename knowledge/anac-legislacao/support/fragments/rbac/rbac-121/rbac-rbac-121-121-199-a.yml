section_title: 'Aviões não incluídos na categoria transporte: limitações de decolagem'
subsection_id: a
cite: 121.199(a)
title: 121.199(a)
text: (a) Ninguém pode decolar com um avião não incluído na categoria transporte com um peso
  maior do que o que permite que o avião seja trazido a uma parada total dentro do comprimento
  efetivo da pista a partir de qualquer ponto durante a decolagem antes de atingir 105% da
  velocidade mínima de controle (a menor velocidade na qual o avião pode ser controlado com
  segurança, em voo, após um motor tornar-se inoperante) ou 115 % da velocidade de estol sem
  potência em configuração de decolagem, o que for maior.
