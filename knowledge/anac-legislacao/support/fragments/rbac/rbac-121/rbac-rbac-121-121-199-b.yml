section_title: 'Aviões não incluídos na categoria transporte: limitações de decolagem'
subsection_id: b
cite: 121.199(b)
title: 121.199(b)
text: '(b) Para os propósitos desta seção:

  (1) pode ser assumido que a potência de decolagem é usada em todos os motores durante a
  aceleração;

  (2) devem ser levadas em consideração até 50% da componente de vento de proa reportado e
  pelo menos 150% da componente de vento de cauda reportado;

  (3) o gradiente médio da pista (a diferença de altitude entre as extremidades da pista dividida
  pelo comprimento total) deve ser considerado se for maior que 0,5%;

  (4) é assumido que o avião opera em atmosfera padrão; e

  (5) comprimento efetivo da pista para decolagem significa a distância medida a partir do
  início da pista na qual a decolagem foi iniciada até o ponto no qual o plano de liberação
  de obstáculos associado com a outra extremidade da pista intercepta a linha central da pista.'
