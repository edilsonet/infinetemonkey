section_title: 'Aviões não incluídos na categoria transporte: limitações de rota com um motor
  inoperante'
subsection_id: a
cite: 121.201(a)
title: 121.201(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, ninguém pode decolar com um avião
  não incluído na categoria transporte com um peso que não permita obter uma razão de subida
  de, pelo menos, 50 pés por minuto, com o motor crítico inoperante, a uma altitude de, pelo
  menos, 1000 pés acima da mais alta obstrução existente dentro de 5 milhas para cada lado
  do curso pretendido, ou 5000 pés, o que for mais alto.
