section_title: 'Aviões não incluídos na categoria transporte: limitações de pouso no aeródromo
  de destino'
subsection_id: a
cite: 121.203(a)
title: 121.203(a)
text: '(a) Ninguém pode decolar com um avião não incluído na categoria transporte com um peso
  que:

  (1) considerando o consumo previsto de combustível e óleo, seja maior do que o peso que
  permite fazer um pouso com parada total dentro de 60% do comprimento efetivo da pista mais
  adequada do aeródromo de destino; e

  (2) seja maior do que o peso permissível se pouso for feito na pista:'
