section_title: 'Aviões não incluídos na categoria transporte: limitações de pouso no aeródromo
  de destino'
subsection_id: b
cite: 121.203(b)
title: 121.203(b)
text: '(b) Para os propósitos desta seção assume-se:

  (1) o avião passa diretamente sobre a interseção do plano de liberação de obstáculos e a
  pista a uma altura de 50 pés, em um planeio estável de aproximação e com velocidade verdadeira
  de pelo menos 1.3 VSO;

  (2) o pouso não requer habilidade excepcional do piloto; e

  (3) o avião está sendo operado em atmosfera padrão.'
