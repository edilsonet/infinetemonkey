text: '121.205 Aviões não incluídos na categoria transporte: limitações de pouso no aeródromo
  de alternativa

  Ninguém pode listar, em um despacho ou liberação de voo, um aeródromo como aeródromo de
  alternativa para um avião não incluído na categoria transporte, a menos que esse avião (no
  peso previsto no horário esperado de chegada), baseado nas premissas de 121.203, possa ser
  trazido a uma parada total após o pouso dentro de 70% do comprimento efetivo da pista.'
