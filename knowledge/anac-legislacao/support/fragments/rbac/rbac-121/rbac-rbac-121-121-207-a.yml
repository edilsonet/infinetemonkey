section_title: Limitações de operação de aviões com certificado de tipo provisório
subsection_id: a
cite: 121.207(a)
title: 121.207(a)
text: (a) além dos tripulantes, cada detentor de certificado pode transportar em tais aviões
  somente as pessoas listadas no parágrafo 121.547(c) deste regulamento ou aquelas pessoas
  especificamente autorizadas não só pelo detentor de certificado como também pela ANAC.
