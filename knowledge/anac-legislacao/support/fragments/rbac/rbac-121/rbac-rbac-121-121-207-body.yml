text: '121.207 Limitações de operação de aviões com certificado de tipo provisório

  A menos que de outra forma autorizado pela ANAC, além das limitações previstas na seção
  91.317 do RBAC 91, as seguintes limitações são aplicáveis à operação, por detentores de
  certificado, de aviões com certificado de aeronavegabilidade emitido com base em um certificado
  de tipo provisório:'
