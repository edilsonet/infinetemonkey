title: 121.211(b)
text: (b) Exceto como previsto no parágrafo (d) desta seção, cada avião de tipo certificado
  segundo o “Aero Bulletin 7A” ou parte 04 do “Civil Air Regulation”, ambos dos Estados Unidos
  da América, efetivos antes de 01 de novembro de 1946, deve atender aos requisitos especiais
  contidos em 121.215 até 121.283.
