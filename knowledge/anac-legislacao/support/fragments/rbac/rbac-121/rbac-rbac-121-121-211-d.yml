cite: 121.211(d)
title: 121.211(d)
text: (d) Se a ANAC considerar que, para um particular modelo de avião usado em serviços de
  carga, a total conformidade com qualquer requisito segundo o parágrafo (b) desta seção seria
  extremamente difícil e que essa conformidade não iria contribuir materialmente para o objetivo
  desejado, pode ser requerido conformidade apenas com aqueles requisitos que sejam necessários
  para atingir os objetivos básicos deste regulamento.
