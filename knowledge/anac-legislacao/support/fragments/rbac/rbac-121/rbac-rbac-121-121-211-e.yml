cite: 121.211(e)
title: 121.211(e)
text: (e) Ninguém pode operar, segundo este regulamento, um avião não incluído na categoria
  transporte, de tipo certificado após 31 de dezembro de 1964, a menos que o avião atenda
  aos requisitos especiais de aeronavegabilidade de 121.293.
