title: 121.215(e)
text: (e) Cada recipiente para toalhas usadas, papéis e detritos deve ser de material resistente
  ao fogo (ver RBAC 01) e deve possuir tampa ou outros meios capazes de conter fogo iniciado
  nos mesmos.
