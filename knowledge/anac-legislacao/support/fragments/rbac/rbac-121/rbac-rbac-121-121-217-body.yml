title: Portas internas
text: '121.217 Portas internas

  Sempre que as portas internas possuírem venezianas ou outros meios de ventilação, deve haver
  uma maneira conveniente para a tripulação fechar o fluxo de ar através das mesmas, quando
  necessário.'
