title: 121.221(b)
text: '(b) Classe A. Compartimentos de carga ou bagagem são classificados na categoria "A",
  se:

  (1) um incêndio dentro do mesmo for prontamente discernível por um membro da tripulação
  de seu posto normal de serviço; e

  (2) todas as partes do compartimento forem facilmente acessíveis em voo. Deve haver um extintor
  de incêndio manual disponível para cada compartimento classe A.'
