title: Prova de conformidade com os requisitos de 121.221
text: '121.223 Prova de conformidade com os requisitos de 121.221

  A conformidade com o previsto em 121.221 no que se refere à acessibilidade do compartimento,
  à entrada de quantidades perigosas de fumaça ou de agente extintor na cabine ocupada por
  tripulantes ou passageiros e à distribuição de agente extintor em compartimento classe "C"
  deve ser demonstrada em voo. Durante esses ensaios deve ser demonstrado que não ocorre operação
  inadvertida de detectores de fogo ou fumaça em outros compartimentos do avião como resultado
  de incêndio contido em um compartimento qualquer nem durante nem depois do combate ao incêndio,
  a menos que o agente extintor preencha tais compartimentos simultaneamente'
