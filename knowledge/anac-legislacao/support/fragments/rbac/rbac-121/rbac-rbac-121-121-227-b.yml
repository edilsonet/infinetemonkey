cite: 121.227(b)
title: 121.227(b)
text: (b) Tubulações que possam ser isoladas do restante do sistema de combustível por válvulas
  colocadas em cada uma das extremidades devem incorporar provisões para alívio de pressões
  excessivas resultantes da exposição de tais tubulações, quando isoladas, a altas temperaturas.
