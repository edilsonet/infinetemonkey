cite: 121.231(a)
title: 121.231(a)
text: (a) Tubulações de combustível devem ser instaladas e fixadas de modo a prevenir excessiva
  vibração e devem ser adequadas para suportar as cargas devidas à pressão do sistema e às
  condições de aceleração em voo.
