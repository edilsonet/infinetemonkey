section_title: Válvulas de óleo
subsection_id: a
cite: 121.239(a)
title: 121.239(a)
text: '(a) Cada válvula de óleo deve:

  (1) atender a 121.257;

  (2) possuir posições positivas de parada ou marcações apropriadas nas posições de "on" e
  "off"; e

  (3) ser fixada de modo a suportar as cargas de sua operação e das condições de aceleração
  em voo, não as transmitindo às tubulações a ela conectadas.'
