title: Drenos do sistema de óleo
text: '121.241 Drenos do sistema de óleo

  Devem existir drenos acessíveis que permitam drenar todo o óleo do sistema. Cada dreno deve
  possuir meios, automáticos ou manuais, de travamento efetivo na posição "fechado".'
