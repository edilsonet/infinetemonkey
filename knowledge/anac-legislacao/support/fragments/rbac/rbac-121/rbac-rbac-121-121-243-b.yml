section_title: Linhas de respiro do motor
subsection_id: b
cite: 121.243(b)
title: 121.243(b)
text: (b) As linhas de respiro do motor devem descarregar em um ponto que não apresente perigo
  de fogo em caso de formação de espuma e nem em um ponto em o óleo emitido dessas linhas
  não atinja os para-brisas dos pilotos.
