title: Paredes-de-fogo
text: '121.245 Paredes-de-fogo

  Cada motor, unidade de força auxiliar, aquecedor com queima de combustível, ou outro item
  de equipamento de combustão a ser usado em voo deve ser isolado do restante do avião por
  meio de parede-de-fogo, blindagem ou meio equivalente.'
