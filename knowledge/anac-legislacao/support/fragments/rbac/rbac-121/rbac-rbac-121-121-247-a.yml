cite: 121.247(a)
title: 121.247(a)
text: '(a) Cada parede-de-fogo ou blindagem deve:

  (1) ser feita de modo a evitar que quantidades perigosas de ar, fluidos ou chamas passem
  do compartimento do motor para outras partes do avião;

  (2) ter todas as aberturas através dela seladas com olhais apropriados, com buchas a prova
  de fogo ou com conexões especiais para parede-de-fogo;

  (3) ser feita de material a prova de fogo;

  (4) ser protegida contra corrosão.'
