section_title: Capota do motor
subsection_id: b
cite: 121.249(b)
title: 121.249(b)
text: (b) Devem existir provisões para a drenagem completa da capota em qualquer atitude do
  avião em terra e em voo. Os drenos não podem descarregar em locais que apresentem perigo
  de fogo. As partes da capota sujeitas a altas temperaturas por estarem perto do sistema
  de exaustão do motor ou por receberem impacto dos gases de escapamento devem ser construídas
  com material à prova de fogo. A menos que de outra maneira especificado neste regulamento,
  todas as demais partes da capota devem ser feitas de material pelo menos resistente ao fogo.
