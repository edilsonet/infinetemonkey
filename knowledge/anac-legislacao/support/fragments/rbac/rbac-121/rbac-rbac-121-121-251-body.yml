title: Diafragma da seção de acessórios do motor
text: '121.251 Diafragma da seção de acessórios do motor

  A menos que proteção equivalente possa ser demonstrada por outros meios, deve existir um
  diafragma (que atenda 121.247) para isolamento entre o compartimento de acessórios e a seção
  de potência e todas as partes do sistema de exaustão de qualquer motor refrigerado a ar.'
