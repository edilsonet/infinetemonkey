section_title: Proteção contra fogo em motores
subsection_id: b
cite: 121.253(b)
title: 121.253(b)
text: '(b) As zonas designadas de fogo são:

  (1) seção de acessórios do motor;

  (2) instalações onde não existe isolamento entre o motor e o compartimento de acessórios;

  (3) áreas que contêm unidades auxiliares de força, aquecedores queimando combustível e outros
  equipamentos de combustão.'
