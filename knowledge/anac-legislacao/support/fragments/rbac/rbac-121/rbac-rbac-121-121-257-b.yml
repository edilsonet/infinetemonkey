cite: 121.257(b)
title: 121.257(b)
text: (b) Os meios de corte de fluxo devem permitir uma sequência de operação em emergência
  compatível com a operação em emergência de outros equipamentos, tais como embandeiramento
  de hélices, visando facilitar o controle rápido e efetivo de incêndios.
