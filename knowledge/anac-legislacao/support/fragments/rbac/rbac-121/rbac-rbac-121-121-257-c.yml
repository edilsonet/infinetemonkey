section_title: Válvulas de corte de fluxo
subsection_id: c
cite: 121.257(c)
title: 121.257(c)
text: (c) Os meios de corte de fluxo devem ser localizados fora das zonas designadas de fogo,
  a menos que segurança equivalente seja proporcionada. Deve ser demonstrado que, após o corte
  de fluxo, nenhuma quantidade de líquido inflamável é drenada para dentro de uma zona designada
  de fogo.
