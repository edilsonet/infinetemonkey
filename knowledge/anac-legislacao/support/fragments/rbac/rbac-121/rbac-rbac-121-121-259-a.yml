section_title: Tubulações e conexões
subsection_id: a
cite: 121.259(a)
title: 121.259(a)
text: (a) Cada tubulação e respectivas conexões transportando líquido ou gases inflamáveis
  sob pressão localizada em zona designada de fogo, fixada diretamente no motor ou sujeita
  a movimentos relativos entre componentes (exceto tubulações e conexões formando parte integral
  do motor) deve ser flexível e resistente ao fogo, com terminais fixados pelo fabricante
  ou destacáveis, mas resistentes ao fogo.
