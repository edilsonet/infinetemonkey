title: Tubulações de ventilação e de drenos
text: '121.261 Tubulações de ventilação e de drenos

  Todas as tubulações de ventilação e de drenos e suas conexões que transportam líquidos ou
  gases inflamáveis e são localizadas em zonas designadas de fogo, desde que a ANAC considere
  que sua ruptura ou quebra possa constituir perigo de fogo, devem atender ao previsto em
  121.259.'
