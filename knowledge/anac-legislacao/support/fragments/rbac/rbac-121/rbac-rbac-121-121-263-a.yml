section_title: Sistemas de extinção de incêndio
subsection_id: a
cite: 121.263(a)
title: 121.263(a)
text: (a) Devem existir sistemas de extinção de incêndio atendendo a todas as zonas designadas
  de fogo. Entretanto, se for demonstrado que o uso de material a prova de fogo na nacele
  e em outros componentes sujeitos a fogo proporciona uma proteção equivalente contra a destruição
  do avião em caso de incêndio, os sistemas de extinção podem ser dispensados.
