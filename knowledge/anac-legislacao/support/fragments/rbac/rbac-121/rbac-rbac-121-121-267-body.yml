title: Alívio de pressão nos cilindros dos extintores de incêndio
text: '121.267 Alívio de pressão nos cilindros dos extintores de incêndio

  Os cilindros dos extintores de incêndio devem possuir válvulas de alívio de pressão para
  evitar descarga acidental dos mesmos devido a pressões internas excessivas. As linhas de
  descarga das válvulas de alívio devem terminar fora do avião, em local de fácil inspeção
  no solo. Deve haver um indicador, no final da linha de descarga, provendo uma indicação
  visual quando o cilindro descarregar pela válvula de alívio.'
