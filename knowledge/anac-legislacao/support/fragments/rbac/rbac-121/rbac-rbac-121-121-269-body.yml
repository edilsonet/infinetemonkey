title: Temperatura do compartimento dos cilindros dos extintores de incêndio
text: '121.269 Temperatura do compartimento dos cilindros dos extintores de incêndio

  Devem ser tomadas precauções para garantir que os cilindros do sistema de extinção de incêndio
  sejam instalados em locais onde temperaturas ambiente razoáveis possam ser mantidas, assegurando
  o uso efetivo do sistema em qualquer situação.'
