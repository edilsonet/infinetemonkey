title: Sistema de detecção de fogo
text: '121.273 Sistema de detecção de fogo

  Um número suficiente de detectores de fogo de ação rápida deve ser colocado em cada zona
  designada de fogo, de modo a assegurar a detecção de qualquer incêndio que possa ocorrer
  nessa zona.'
