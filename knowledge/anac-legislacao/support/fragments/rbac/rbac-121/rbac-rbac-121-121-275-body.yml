title: Detectores de fogo
text: '121.275 Detectores de fogo

  Os detectores de fogo devem ser manufaturados e instalados de modo a assegurar sua capacidade
  de resistir sem falha a toda vibração, inércia e outras cargas às quais eles possam estar
  normalmente sujeitos. Detectores de fogo não podem ser afetados por gases, óleo, água ou
  outros fluidos que possam atingi-los.'
