section_title: Proteção de outros componentes do avião contra fogo
subsection_id: a
cite: 121.277(a)
title: 121.277(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, toda a superfície do avião atrás
  das naceles, na área compreendida por um diâmetro de nacele em ambos os lados da linha central
  de cada nacele, deve ser construída de material pelo menos resistente ao fogo.
