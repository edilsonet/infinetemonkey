section_title: Proteção de outros componentes do avião contra fogo
subsection_id: b
cite: 121.277(b)
title: 121.277(b)
text: (b) O parágrafo (a) desta seção não se aplica às superfícies de empenagem que ficam
  atrás das naceles, a menos que a configuração dimensional do avião seja tal que as superfícies
  da empenagem possam ser afetadas pelo calor, chamas ou faíscas emanadas de uma zona designada
  de fogo ou do compartimento do motor de qualquer nacele.
