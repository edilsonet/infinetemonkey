section_title: Transporte de carga na cabine de passageiros
subsection_id: c
cite: 121.285(c)
title: 121.285(c)
text: '(c) Pode ser transportada carga atrás de cavernas fechadas ou de divisórias da cabine
  de passageiros, desde que essa carga seja devidamente presa para resistir aos fatores de
  carga previstos na seção 25.561(b)(3) do RBAC 25 e seja colocada como se segue:

  (1) seja apropriadamente amarrada com um cinto de segurança ou outro tipo de amarração que
  tenha suficiente resistência para eliminar a possibilidade de movimentação sob quaisquer
  condições esperadas em voo ou no solo;

  (2) esteja devidamente embalada ou coberta de maneira a evitar possíveis ferimentos aos
  ocupantes da cabine de passageiros;

  (3) não imponha nenhuma carga em assentos ou estruturas do assoalho que exceda os limites
  estruturais desses componentes;

  (4) sua localização não restrinja o acesso e o uso de qualquer saída de emergência ou normal
  requerida, ou do corredor da cabine de passageiros;

  (5) sua localização não prejudique a visão de qualquer passageiro em relação a um sinal
  de "não fume", "use cintos" e "saída" requerido, a menos que existam sinais auxiliares ou
  outros meios aprovados de adequado aviso aos passageiros.'
