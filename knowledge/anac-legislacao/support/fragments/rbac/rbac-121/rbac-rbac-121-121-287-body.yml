title: Transporte de carga no compartimento de carga
text: '121.287 Transporte de carga no compartimento de carga

  Carga transportada em compartimentos de carga, projetados de modo a requerer a entrada física
  de um tripulante para combate a qualquer incêndio que possa ocorrer em voo, deve ser distribuída
  de modo a permitir que um tripulante alcance, efetivamente, todas as partes do compartimento
  com um extintor de incêndio manual.'
