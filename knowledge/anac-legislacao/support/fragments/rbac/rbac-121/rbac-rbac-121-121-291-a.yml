section_title: Demonstração de procedimento para evacuação em emergência
subsection_id: a
cite: 121.291(a)
title: 121.291(a)
text: '(a) Exceto como previsto no parágrafo (a)(1) desta seção, cada detentor de certificado
  deve conduzir uma demonstração real dos procedimentos para evacuação em emergência de acordo
  com o parágrafo (a) do Apêndice D a este regulamento, demonstrando que cada tipo e modelo
  de avião com configuração para passageiros com mais de 44 assentos, a ser usado em suas
  operações transportando passageiros, permite uma evacuação total de passageiros e tripulantes
  em 90 segundos ou menos:

  (1) uma demonstração real não precisa ser realizada se o tipo e modelo de avião estiverem
  conformes com este parágrafo como válido em ou após 24 de outubro de 1967 ou se, durante
  o período de certificação do tipo de avião, conformes com os requisitos da seção 25.803
  do RBAC 25, efetiva a partir de 01 de dezembro de 1978;

  (2) qualquer demonstração real conduzida após 27 de setembro de 1993 deve ser feita em concordância
  com o parágrafo (a) do Apêndice D a este regulamento válido a partir da referida data ou
  em concordância com os requisitos da seção 25.803 efetivos a partir da mesma data.'
