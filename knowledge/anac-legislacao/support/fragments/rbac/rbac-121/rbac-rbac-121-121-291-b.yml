cite: 121.291(b)
title: 121.291(b)
text: '(b) Cada detentor de certificado conduzindo operações com aviões com capacidade para
  mais de 44 assentos para passageiros deve conduzir uma demonstração parcial dos procedimentos
  de evacuação em emergência de acordo com o parágrafo (c) desta seção ao:

  (1) introduzir um novo tipo'
