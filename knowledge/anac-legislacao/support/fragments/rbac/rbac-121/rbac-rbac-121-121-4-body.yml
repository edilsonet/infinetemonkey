title: Aplicabilidade das regras para operadores não autorizados
text: '121.4 Aplicabilidade das regras para operadores não autorizados

  As regras deste regulamento que se referem a uma pessoa certificada segundo o RBAC 119 aplicam-se,
  também, a qualquer pessoa que se engaje em operações regidas por este regulamento sem o
  apropriado certificado e especificações operativas requeridas pelo RBAC 119.'
