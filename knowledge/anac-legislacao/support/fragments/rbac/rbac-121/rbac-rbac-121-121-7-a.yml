cite: 121.7(a)
title: 121.7(a)
text: '(a)

  Aeródromo Adequado

  significa um aeródromo listado nas especificações operativas de um detentor de certificado,
  aprovado pela ANAC, que atende as limitações para pouso da seção 121.197 e também:

  (1) [reservado];

  (2) um aeródromo militar ativo e operacional;'
