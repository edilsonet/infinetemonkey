title: 121.7(b)
text: '(b)

  Aeródromo de Alternativa em rota ETOPS

  significa um Aeródromo Adequado e conveniente no qual um avião pode pousar após experimentar
  uma parada de motor ou outra condição anormal ou de emergência que ocorra em rota durante
  uma operação ETOPS;'
