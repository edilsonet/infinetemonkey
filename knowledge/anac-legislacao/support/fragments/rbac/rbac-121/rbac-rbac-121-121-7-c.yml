cite: 121.7(c)
title: 121.7(c)
text: '(c)

  Área de Operações ETOPS

  significa:

  (1) para aviões com dois motores a turbina, uma área distante mais de 75 minutos de um Aeródromo
  Adequado, considerando a velocidade de cruzeiro com um motor inoperante sob atmosfera padrão
  e ar calmo;

  (2) para aviões com mais de dois motores a turbina, uma área distante mais de 180 minutos
  de um Aeródromo Adequado, considerando a velocidade de cruzeiro com um motor inoperante
  sob atmosfera padrão e ar calmo;'
