title: 121.7(d)
text: '(d)

  Ponto de entrada ETOPS

  significa o primeiro ponto da rota em um voo ETOPS determinado, considerando-se velocidade
  de cruzeiro com um motor inoperante sob atmosfera padrão e ar calmo e:

  (1) distante mais de 75 minutos de um Aeródromo Adequado para aviões com dois motores;

  (2) distante mais de 180 minutos de um Aeródromo Adequado para aviões com mais de dois motores;'
