title: 121.7(e)
text: '(e)

  Qualificação ETOPS

  significa a qualificação que uma pessoa, responsável pela manutenção do detentor do certificado,
  atingiu ao completar com êxito o programa de treinamento ETOPS do detentor do certificado;'
