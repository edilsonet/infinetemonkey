title: 121.7(f)
text: '(f)

  Tempo de desvio máximo

  , para propósitos de planejamento da rota ETOPS, significa o maior tempo de desvio autorizado
  para uma operação ETOPS do detentor de certificado calculado considerando-se velocidade
  de cruzeiro com um motor inoperante sob atmosfera padrão e ar calmo;'
