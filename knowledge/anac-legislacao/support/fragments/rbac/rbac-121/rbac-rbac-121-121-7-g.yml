cite: 121.7(g)
title: 121.7(g)
text: '(g)

  Velocidade de cruzeiro com um motor inoperante

  significa a velocidade, dentro dos limites de operação, certificada para a aeronave, especificada
  pelo detentor do certificado e aprovada pela ANAC para:

  (1) calcular as necessidades de reserva de combustível no caso de um motor inoperante;

  (2) determinar se um aeródromo de alternativa em rota ETOPS encontra-se dentro do tempo
  de desvio máximo autorizado para um voo ETOPS.'
