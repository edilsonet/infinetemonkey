cite: 121.93(b)
title: 121.93(b)
text: (b) O parágrafo (a) desta seção não requer voo real de demonstração ao longo de uma
  rota ou segmento de rota se o detentor de certificado demonstrar que tal voo não é essencial
  à segurança, considerando a disponibilidade e adequabilidade dos aeródromos, em especial
  quanto à sinalização e auxílios luminosos, manutenção de aeronaves, reabastecimento, comunicações,
  auxílios à navegação de solo e do avião e da proficiência do pessoal envolvido nas operações
  pretendidas.
