title: Largura de rota
text: '121.95 Largura de rota

  Rotas e segmentos de rotas aprovados totalmente dentro de aerovias brasileiras ou estrangeiras
  (e em rotas de assessoramento no caso detentores de certificado conduzindo operações internacionais)
  têm a largura regulamentada através de norma específica do Comando da Aeronáutica.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
