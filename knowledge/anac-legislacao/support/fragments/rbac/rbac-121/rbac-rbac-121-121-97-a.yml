section_title: Aeródromos. Informações requeridas
subsection_id: a
cite: 121.97(a)
title: 121.97(a)
text: '(a) Cada detentor de certificado conduzindo operações regulares deve demonstrar que
  cada rota submetida à aprovação é apoiada em aeródromos em quantidade e qualidade adequada,
  considerando aspectos como dimensões, resistência e superfície das pistas, obstruções, facilidades,
  proteção ao público (

  security

  ), sinalização e auxílios luminosos, auxílios à navegação e aproximação, comunicação, horário
  de funcionamento e controle de tráfego.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
