title: 121.97(b)
text: '(b) Cada detentor de certificado conduzindo operações regulares deve demonstrar que
  possui um sistema aprovado para coletar, atualizar e divulgar para o pessoal apropriado
  informações aeronáuticas válidas para cada aeródromo por ele utilizado, de modo a garantir
  a segurança das operações nos mesmos. As informações aeronáuticas devem incluir o seguinte:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) aeródromos:'
