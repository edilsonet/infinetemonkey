cite: 121.97(c)
title: 121.97(c)
text: (c) Se a ANAC considerar que o sistema de coleta, atualização, disseminação e utilização
  de informações aeronáuticas aprovado para um detentor de certificado deve ser alterado para
  atender a novas circunstâncias, esse detentor será notificado por escrito devendo implantar
  as alterações requeridas. Dentro de 30 dias após receber a notificação, o detentor de certificado
  pode solicitar reconsideração da decisão da ANAC. A apresentação de recurso deixa em suspenso
  o prazo de cumprimento da alteração até a decisão da ANAC sobre o assunto. Entretanto, se
  for considerado que existe uma situação de emergência requerendo ação imediata no interesse
  da segurança do transporte aéreo, a ANAC pode determinar, justificando sua decisão, uma
  modificação com efetividade imediata.
