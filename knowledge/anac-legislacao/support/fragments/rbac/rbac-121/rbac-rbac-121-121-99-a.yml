cite: 121.99(a)
title: 121.99(a)
text: '(a) Cada detentor de certificado conduzindo operações regulares deve demonstrar que
  ao longo de suas rotas (diretamente ou via circuito ponto-a-ponto) existe um sistema confiável
  e rápido de comunicações bilaterais avião-solo que, em condições normais de operação, assegura
  o contato rádio de cada avião com o apropriado centro de despacho e entre cada avião e a
  adequada estação rádio de controle de tráfego aéreo, exceto como especificado em 121.351(c).

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
