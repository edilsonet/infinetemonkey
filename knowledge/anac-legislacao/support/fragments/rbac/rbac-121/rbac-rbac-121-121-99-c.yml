section_title: Facilidades de comunicações
subsection_id: c
cite: 121.99(c)
title: 121.99(c)
text: '(c) Cada detentor de certificado conduzindo operações internacionais deve prover meios
  de comunicação por voz, para operações ETOPS, onde estas facilidades estão disponíveis.
  Para determinar se estas facilidades estão disponíveis, o detentor de certificado deverá
  considerar as rotas e altitudes potenciais para desvio para os aeródromos de alternativa
  em rota ETOPS. Onde estas facilidades não estiverem disponíveis ou forem de qualidade tão
  baixa que a comunicação por voz não seja possível, outro sistema de comunicação deve ser
  disponibilizado.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
