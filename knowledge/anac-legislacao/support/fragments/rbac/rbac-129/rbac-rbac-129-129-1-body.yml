title: Aplicabilidade
text: '129.1 Aplicabilidade

  This Regulation prescribes rules governing the operation of each foreign air carrier conducting
  common carriage between Brazil and other countries.

  Este Regulamento estabelece regras para operação de cada empresa estrangeira de transporte
  aéreo que realize serviço de transporte aéreo internacional entre o Brasil e outros países.'
