title: 129.11(a)
text: (a) Each foreign air carrier shall conduct its scheduled operations within Brazil in
  accordance with the Standards and Recommended Practices contained in Annex 6, Part I or
  Part III, Section II, as applicable, to the Convention on International Civil Aviation Organization,
  in accordance with applicable provisions of this Regulation and in accordance with the Operations
  Specifications issued by the State of operator.
