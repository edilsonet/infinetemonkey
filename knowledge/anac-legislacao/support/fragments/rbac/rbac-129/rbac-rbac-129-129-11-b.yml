title: 129.11(b)
text: '(b) A empresa estrangeira de transporte aéreo deve apresentar requerimento para obter
  autorização para a realização de operações regulares pelo menos 30 (trinta) dias antes do
  início pretendido das operações no Brasil.

  (1) The foreign air carrier must notify ANAC at least 30 (thirty) days before the date for
  the significant changes in its operations, as stablished by ANAC in a specific rule, to
  become effective.

  (1) A empresa estrangeira de transporte aéreo deve notificar a ANAC pelo menos 30 (trinta)
  dias antes de se tornarem efetivas alterações significativas em suas operações, como estabelecidas
  pela ANAC em norma específica.'
