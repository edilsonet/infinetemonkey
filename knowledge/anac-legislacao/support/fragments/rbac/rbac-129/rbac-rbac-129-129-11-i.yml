cite: 129.11(i)
title: 129.11(i)
text: '(i) notificar a ANAC pelo menos 15 (quinze) dias calendáricos consecutivos antes da
  data pretendida para retomada; e

  (ii) it makes itself available and accessible during this period in the event that ANAC
  decides to verify the capacity of the foreign air carrier to conduct safe operations.

  (ii) estar disponível e acessível durante esse período para a eventualidade de a ANAC decidir
  verificar a capacidade da empresa de conduzir operações seguras.'
