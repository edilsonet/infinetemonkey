cite: 129.12(a)
title: 129.12(a)
text: '(a) Cada empresa estrangeira de transporte aéreo deve conduzir suas operações não regulares
  dentro do Brasil de acordo com os padrões e práticas recomendadas do Anexo 6, Parte I ou
  Parte III, Seção II, conforme aplicável, da Convenção de Aviação Civil Internacional, com
  as provisões aplicáveis deste Regulamento e com as Especificações Operativas emitidas pelo
  Estado do operador.

  (1) Except for foreign air carriers conducting only air taxi operations, the foreign air
  carrier must submit an application, in a form acceptable to ANAC, to obtain an authorization
  to conduct non-scheduled operations.

  (1) Com exceção de empresas estrangeiras de transporte aéreo que realizem somente operações
  de táxi aéreo, a empresa estrangeira de transporte aéreo deve apresentar requerimento, em
  formato aceitável pela ANAC, para obter autorização para a realização de operações não regulares.'
