section_title: Certificados de Aeronavegabilidade e de Matrícula
subsection_id: a
cite: 129.13(a)
title: 129.13(a)
text: (a) Nenhuma empresa estrangeira de transporte aéreo pode operar qualquer aeronave dentro
  do Brasil, a menos que essa aeronave possua os Certificados de Aeronavegabilidade e de Matrícula
  válidos, emitidos ou validados pelo país do operador e de registro da aeronave e exiba as
  marcas de nacionalidade e de matrícula desse país nos locais externos como previsto na Convenção
  de Aviação Civil Internacional.
