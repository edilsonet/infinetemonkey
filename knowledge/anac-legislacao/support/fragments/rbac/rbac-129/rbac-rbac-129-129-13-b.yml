section_title: Certificados de Aeronavegabilidade e de Matrícula
subsection_id: b
cite: 129.13(b)
title: 129.13(b)
text: (b) Não obstante as provisões do parágrafo (a) desta seção, pode ser autorizada a operação
  de uma aeronave registrada em um Estado contratante da OACI e operada através de um contrato
  de arrendamento, de fretamento, de intercâmbio ou de arranjo similar por uma empresa de
  outro Estado contratante, se o Estado de registro da aeronave, através de contrato com o
  Estado da empresa, transferir para ele, em todo ou em parte, suas funções e deveres, nos
  termos e alcance do artigo 83 bis, parágrafo (a) da Convenção de Aviação Civil Internacional,
  desde que atendido o parágrafo (b) do mesmo artigo.
