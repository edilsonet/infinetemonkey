cite: 129.13(c)
title: 129.13(c)
text: (c) Nenhuma empresa estrangeira de transporte aéreo pode operar uma aeronave, dentro
  do Brasil, a menos que a operação seja conduzida dentro das limitações de certificação e
  operação da aeronave aprovadas pelo país de fabricação da aeronave.
