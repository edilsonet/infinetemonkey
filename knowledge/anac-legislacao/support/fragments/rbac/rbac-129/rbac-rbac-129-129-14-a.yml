section_title: Requisitos de manutenção e Lista de Equipamentos Mínimos (MEL)
subsection_id: a
cite: 129.14(a)
title: 129.14(a)
text: (a) Cada empresa estrangeira de transporte aéreo que opere no Brasil deve garantir que
  cada uma de suas aeronaves é submetida a um Programa de Manutenção conforme prescrito no
  Capítulo 8 do Anexo 6, Parte I, ou no Capítulo 6 do Anexo 6, Parte III, Seção II, conforme
  aplicável, da Convenção de Aviação Civil Internacional, aprovado pela Autoridade de Aviação
  Civil do país operador e de registro da aeronave.
