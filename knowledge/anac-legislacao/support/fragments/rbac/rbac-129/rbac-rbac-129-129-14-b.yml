title: 129.14(b)
text: (b) Nenhuma empresa estrangeira de transporte aéreo pode operar uma aeronave estrangeira
  dentro do Brasil com algum instrumento ou equipamento inoperante a não ser que atenda ao
  previsto no parágrafo 6.1.3 do Anexo 6, Parte I ou no parágrafo 4.1.3 do Anexo 6, Parte
  III, Seção II, conforme aplicável, da Convenção de Aviação Civil Internacional.
