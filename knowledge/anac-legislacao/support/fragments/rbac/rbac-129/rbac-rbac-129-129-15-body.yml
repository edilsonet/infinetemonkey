title: Licenças dos tripulantes de voo
text: '129.15 Licenças dos tripulantes de voo

  No person may act as a flight crewmember of an aircraft, unless holds a valid license or
  certificate issued or validated by the country in which the aircraft is registered, showing
  his competency to perform his duties connected with operating of that aircraft.

  Ninguém pode atuar como tripulante de voo de uma aeronave, a menos que porte licença ou
  certificado válido, emitido ou validado pelo país no qual a aeronave é registrada, evidenciando
  sua competência na execução das tarefas correlacionadas com sua função na operação da aeronave.'
