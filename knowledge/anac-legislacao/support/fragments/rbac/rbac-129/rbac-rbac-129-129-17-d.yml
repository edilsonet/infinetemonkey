title: 129.17(d)
text: (d) Sempre que for requerido equipamento de navegação VOR pelos parágrafos (a) ou (c)
  desta seção, nenhuma empresa estrangeira de transporte aéreo pode operar uma aeronave a
  menos que esta esteja equipada com pelo menos uma unidade de equipamento medidor de distâncias
  (DME) aprovado ou um sistema RNAV adequado.
