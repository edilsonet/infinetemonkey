text: '(a) Em operações no Brasil, qualquer aeronave com motores a turbina de empresa estrangeira
  de transporte aéreo operando sob este Regulamento, com:

  (1) of more than 33,000 pounds maximum certificated takeoff weight, must operate that airplane
  with an appropriate class of Mode S transponder that meets Technical Standard Order (TSO)
  C-112, or a later version, and one of the following approved units:

  (1) peso máximo de decolagem acima de 33.000lb, deve ser operada com uma classe apropriada
  de

  transponder

  modo S que atenda ao TSO C-112, ou versão mais atual, e uma das seguintes unidades aprovadas:'
