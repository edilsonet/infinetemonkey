cite: 129.19(b)
title: 129.19(b)
text: (b) Cada empresa estrangeira de transporte aéreo deve estabelecer procedimentos que
  garantam que cada um dos seus pilotos tenha os conhecimentos requeridos pelo parágrafo (a)
  desta seção e deve verificar a capacidade de cada um de seus pilotos em conduzir as operações
  com segurança e de acordo com as regras e procedimentos aplicáveis.
