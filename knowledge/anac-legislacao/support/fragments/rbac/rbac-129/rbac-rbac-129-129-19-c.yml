title: 129.19(c)
text: (c) Cada empresa estrangeira de transporte aéreo deve atender a práticas, procedimentos
  e outros requisitos especiais estabelecidos pela ANAC para a operação de empresas aéreas
  nacionais nos locais onde elas já operam.
