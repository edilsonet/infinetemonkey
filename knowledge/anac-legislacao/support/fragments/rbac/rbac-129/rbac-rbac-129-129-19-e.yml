section_title: Regras de tráfego aéreo e outros procedimentos
subsection_id: e
cite: 129.19(e)
title: 129.19(e)
text: (e) No caso de empresas estrangeiras de transporte aéreo não regular, o comandante da
  aeronave, ao pousar no primeiro aeroporto internacional no País, deve responsabilizar-se
  formalmente, como preposto do proprietário ou operador, pelas indenizações previstas pelo
  uso das facilidades aeroportuárias e de apoio à navegação aérea, aproximação e pouso, devendo
  portar também prova de garantia de seguro contra danos a terceiros na superfície.
