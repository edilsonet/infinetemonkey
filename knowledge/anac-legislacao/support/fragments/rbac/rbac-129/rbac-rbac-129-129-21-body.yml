text: '129.21 Linguagem do controle de tráfego aéreo

  The communications with the air traffic control (ATC) shall be conducted in English. The
  flight crew of the foreign air carrier shall meet the language proficiency requirements
  of section 1.2.9, language proficiency, Annex 1 of the Convention on International Civil
  Aviation.

  As comunicações radiotelefônicas com os órgãos de controle de tráfego aéreo devem ser conduzidas
  na língua inglesa. Os tripulantes de voo de empresas estrangeiras de transporte aéreo que
  operem no Brasil devem atender aos requisitos de proficiência linguística da seção 1.2.9,

  language proficiency,

  do Anexo 1 da Convenção de Aviação Civil Internacional.'
