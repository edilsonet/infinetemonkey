text: '129.23 Requisitos para as aeronaves

  No foreign air carrier may conduct operations between Brazil and foreign countries unless
  such operations are performed using aircraft that meet the following requirements for airworthiness
  and operational requirements:

  Nenhuma empresa estrangeira de transporte aéreo pode conduzir operações entre o Brasil e
  o exterior a menos que tais operações sejam realizadas utilizando aeronaves que atendam
  aos seguintes requisitos de aeronavegabilidade e operacionais:'
