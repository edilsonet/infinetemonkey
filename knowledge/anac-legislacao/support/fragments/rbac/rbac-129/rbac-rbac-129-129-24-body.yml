title: Gravação de voz de cabine
text: '129.24 Gravação de voz de cabine

  No person may operate an aircraft under this Regulation unless it is equipped with an approved
  cockpit voice recorder that meets the prescribed in the section 6.3 of Annex 6, Part I,
  or section 4.3 of Annex 6, Part III, Section II, as applicable, of International Civil Aviation
  Convention.

  Ninguém pode operar uma aeronave sob este Regulamento a não ser que esteja equipada com
  um gravador de voz de cabine aprovado que atenda ao prescrito na seção 6.3 do Anexo 6, Parte
  I, ou na seção 4.3 do Anexo 6, Parte III, Seção II, conforme aplicável, à Convenção de Aviação
  Civil Internacional.'
