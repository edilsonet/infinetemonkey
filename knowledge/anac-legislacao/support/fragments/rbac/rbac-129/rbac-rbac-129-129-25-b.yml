section_title: Segurança contra atos de interferência ilícita
subsection_id: b
cite: 129.25(b)
title: 129.25(b)
text: (b) No caso de pouso não previsto em aeródromo brasileiro não listado nas Especificações
  Operativas da empresa estrangeira de transporte aéreo, a menos que o aeródromo disponha
  de autoridades do Brasil para fazer cumprir as normas de segurança previstas no plano de
  segurança aprovado, a empresa estrangeira de transporte aéreo fica responsável pelo cumprimento
  dessas normas perante o governo brasileiro.
