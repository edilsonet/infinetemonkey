text: '129.27 Proibição de transporte de armas a bordo

  For the purposes of this section applies the provisions of the PNAVSEC and specific regulation
  on the subject issued by ANAC.

  Para os objetivos desta seção são válidas as disposições contidas no PNAVSEC e regulamentação
  específica sobre o assunto editada pela ANAC.'
