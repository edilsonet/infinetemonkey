section_title: Proibições de fumo a bordo
subsection_id: c
cite: 129.29(c)
title: 129.29(c)
text: '(c) Ninguém pode operar uma aeronave a menos que seja instalado em cada lavatório um
  aviso ou letreiro com os seguintes dizeres (ou equivalente em inglês ou português): “É proibido
  impedir, ou tentar impedir, o funcionamento do detector de fumaça deste lavatório”. Esses
  avisos ou letreiros não precisam atender aos requisitos do parágrafo (a) desta seção.'
