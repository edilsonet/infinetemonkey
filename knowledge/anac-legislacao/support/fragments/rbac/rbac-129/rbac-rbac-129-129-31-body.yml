title: Programas de intercâmbio de dados
text: '129.31 Programas de intercâmbio de dados

  Every foreign air carrier that operates commercial aircrafts in Brazil are subjected to
  the ramp inspection by ANAC according to all exchange data program that Brazil takes part.

  Toda empresa estrangeira de transporte aéreo operando aeronaves comerciais no Brasil está
  sujeita a inspeções de rampa pela ANAC, de acordo com os programas de intercâmbio de dados
  que o Brasil faça parte.'
