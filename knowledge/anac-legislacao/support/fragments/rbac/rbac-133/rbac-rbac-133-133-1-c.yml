cite: 133.1(c)
title: 133.1(c)
text: '(c) As regras de certificação deste Regulamento não se aplicam para:

  (1) fabricantes de aeronaves de asas rotativas quando desenvolvendo meios de fixação de

  cargas externas;

  (2) fabricantes de aeronaves de asas rotativas durante as demonstrações de conformidade
  de

  equipamentos utilizados de acordo com este Regulamento ou de partes apropriadas dos RBAC
  27

  ou 29;

  (3) operações conduzidas para demonstrar conformidade para emissão do certificado ou uma

  autorização de operação segundo este Regulamento;

  (4) voos de treinamento conduzidos em preparação para demonstrações de conformidade com

  este Regulamento; e

  (5) operações especiais de unidades aéreas públicas regidas pelo RBAC nº 90. (Redação dada

  pela 512, de 11 de abril de 2019)'
