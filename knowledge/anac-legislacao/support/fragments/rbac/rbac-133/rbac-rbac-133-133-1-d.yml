title: 133.1(d)
text: '(d) Para os propósitos deste Regulamento, uma pessoa que não seja tripulante da aeronave
  ou

  que não seja essencial e diretamente ligada a operações com cargas externas só pode ser

  transportada a bordo em combinações aprovadas de aeronave/carga externa classe D.'
