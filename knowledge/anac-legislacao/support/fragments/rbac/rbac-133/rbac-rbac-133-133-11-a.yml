cite: 133.11(a)
title: 133.11(a)
text: '(a) Nenhuma pessoa que seja sujeita a este Regulamento pode conduzir operações com

  aeronaves com cargas externas, dentro do Brasil, sem uma autorização para operação com carga

  externa emitida pela ANAC de acordo com seção 133.17 deste Regulamento, ou em violação aos

  termos contidos em tal autorização.'
