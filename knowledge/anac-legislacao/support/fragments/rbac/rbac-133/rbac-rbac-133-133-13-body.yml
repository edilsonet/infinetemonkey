title: Duração da autorização
text: '133.13 Duração da autorização

  Uma autorização para operação com carga externa expira ao fim do vigésimo quarto mês após
  o

  mês no qual ela foi emitida, a menos que, antes desse prazo, ela seja cassada, suspensa
  ou revogada,

  ou seu detentor a devolva à ANAC.'
