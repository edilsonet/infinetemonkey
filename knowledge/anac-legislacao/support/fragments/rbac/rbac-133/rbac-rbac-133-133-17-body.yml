title: Requisitos para emissão de uma autorização para operação de aeronaves de asas
text: '133.17 Requisitos para emissão de uma autorização para operação de aeronaves de asas

  rotativas com cargas externas

  Se um requerente demonstrar que atende ao disposto nas seções 133.19, 133.21 e 133.23 deste

  Regulamento, a ANAC emitirá uma autorização para operação com carga externa através da qual

  ele fica autorizado a operar específicas aeronaves com aquelas classes de combinação

  aeronave/carga externa para as quais ele demonstrou atender às provisões aplicáveis da subparte
  D

  deste Regulamento.'
