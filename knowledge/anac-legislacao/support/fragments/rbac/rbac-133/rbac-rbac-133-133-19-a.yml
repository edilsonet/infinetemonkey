cite: 133.19(a)
title: 133.19(a)
text: '(a) O requerente deve ter o uso exclusivo de pelo menos uma aeronave de asas rotativas
  que:

  (1) seja de tipo certificado segundo os requisitos do RBAC 27 ou 29 (mas não

  necessariamente com meios de fixação de cargas externas instalados) ou que atenda às provisões
  da

  seção 21.25 do RBAC 21 para operação com carga externa para propósitos especiais;


  Data da emissão: 12 de abril de 2019.


  (2) atenda às provisões de certificação da subparte D deste Regulamento aplicáveis às

  combinações aeronave-carga externa para as quais foi requerida autorização; e

  (3) possua um certificado de aeronavegabilidade válido.'
