title: 133.19(b)
text: '(b) Para os propósitos do parágrafo (a) desta seção uma pessoa tem o uso exclusivo
  de uma

  aeronave se:

  (1) detiver a posse, o controle e o uso da aeronave como proprietário da mesma; ou

  (2) possuir um contrato escrito (incluindo cláusulas para a execução da manutenção

  necessária), registrado na ANAC, dando-lhe a posse, o controle e o uso da aeronave por pelo
  menos

  6 meses consecutivos.'
