cite: 133.2(c)
title: 133.2(c)
text: '(c) "Categoria A" significa, referindo-se a aeronaves de asas rotativas da categoria
  transporte,

  uma aeronave de asa rotativa, multimotora, projetada com as características de isolamento
  de

  motores e sistemas especificadas no RBAC 29 e utilizando operações de decolagem e pouso
  pré-

  definidas segundo um conceito de falha do motor crítico que assegure uma área adequada e

  capacidade de desempenho adequado para prosseguir o voo seguro na eventualidade de uma falha

  de motor.'
