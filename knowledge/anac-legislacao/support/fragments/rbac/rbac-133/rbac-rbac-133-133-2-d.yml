text: '(d) "Categoria B" significa, referindo-se a aeronaves de asas rotativas categoria transporte,
  uma

  aeronave de asas rotativas monomotora ou uma aeronave de asas rotativas multimotora que
  não

  atende totalmente os padrões de categoria A, não possuindo capacidade assegurada de voar
  com


