title: 133.2(e)
text: '(e) "Combinação aeronave de asa rotativa/carga externa" significa a combinação de uma

  aeronave de asa rotativa e uma carga externa, incluindo os meios para prender tal carga.
  As

  combinações designadas como de classe A , B, C, ou D como se segue:

  (1) "Classe A" significa uma combinação na qual a carga externa fica fixa à aeronave,

  não pode ser alijada e não se prolonga abaixo do trem de pouso da aeronave;

  (2) "Classe B" significa uma combinação na qual a carga externa é alijável e livra o solo
  ou

  água durante a operação da aeronave;

  (3) "Classe C" significa uma combinação na qual a carga externa é alijável e

  permanece em contato com o solo ou água durante a operação da aeronave;

  (4) "Classe D" significa uma combinação na qual a carga externa é diferente das

  Classes A, B, ou C e que tenha sido especificamente aprovada pela autoridade de aviação
  civil para

  uma determinada operação.


  Data da emissão: 12 de abril de 2019


  SUBPARTE B

  REGRAS PARA CERTIFICAÇÃO'
