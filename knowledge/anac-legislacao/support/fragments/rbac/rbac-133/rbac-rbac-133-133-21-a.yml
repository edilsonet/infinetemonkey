cite: 133.21(a)
title: 133.21(a)
text: '(a) O requerente deve possuir uma licença válida de piloto comercial ou de piloto de
  linha aérea,

  com as apropriadas qualificações para a aeronave descrita na seção 133.19, emitida pela
  ANAC.

  Caso não possua tal licença, o requerente deve ter pelo menos um piloto, seu empregado legal,
  que

  possua as licenças e qualificações acima requeridas.'
