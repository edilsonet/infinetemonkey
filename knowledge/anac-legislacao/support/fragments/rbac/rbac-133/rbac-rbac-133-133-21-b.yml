title: 133.21(b)
text: '(b) O requerente deve designar um piloto, que pode ser o próprio requerente, como piloto-chefe

  das operações das aeronaves com cargas externas. O requerente também pode indicar pilotos

  qualificados como assistentes do piloto-chefe, para executar as funções do mesmo quando
  ele não

  estiver rapidamente disponível. O piloto-chefe e seus assistentes devem ser aprovados pela
  ANAC.

  Todos devem possuir uma licença válida de piloto comercial ou de piloto de linha aérea,
  com as

  qualificações requeridas para a(s) aeronave(s) descrita(s) na seção 133.19.'
