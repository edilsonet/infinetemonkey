title: 133.21(c)
text: '(c) O detentor de uma autorização para operações com cargas externas deve informar
  à ANAC

  qualquer mudança na designação do piloto-chefe ou dos pilotos assistentes. Um novo piloto-chefe

  deve ser designado e deve estar em condições de atender ao estabelecido na seção 133.23
  dentro de

  30 dias, sob pena de o operador não poder mais conduzir operações sob a autorização para
  operação

  com cargas externas (a menos que de outra forma autorizado pela ANAC).'
