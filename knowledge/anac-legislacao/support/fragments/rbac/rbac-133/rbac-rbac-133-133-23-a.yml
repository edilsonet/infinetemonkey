title: 133.23(a)
text: '(a) Exceto como estabelecido no parágrafo (d) desta seção, o requerente, ou o piloto-chefe

  designado conforme dispõe o parágrafo 133.21(b), deve demonstrar a ANAC conhecimentos e

  habilidades satisfatórias em relação às operações de aeronaves de asas rotativas com cargas

  externas, como estabelecido nos parágrafos (b) e (c) desta seção.'
