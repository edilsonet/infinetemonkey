title: 133.23(b)
text: '(b) O teste de conhecimentos (que pode ser oral ou escrito, a critério da ANAC) deve
  abranger

  os seguintes assuntos:

  (1) ações a serem tomadas antes do início de uma operação, incluindo um reconhecimento da

  área de voo;

  (2) métodos apropriados para carregamento, ajuste ou fixação da carga externa;

  (3) a capacidade de desempenho da aeronave a ser usada, de acordo com os procedimentos e

  limites operacionais aprovados;

  (4) instruções apropriadas aos tripulantes de voo e ao pessoal de solo; e

  (5) Manual de Voo (RFM) apropriado à combinação aeronave-carga externa.


  Data da emissão: 12 de abril de 2019'
