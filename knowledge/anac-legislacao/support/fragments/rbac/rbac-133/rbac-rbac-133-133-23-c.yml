cite: 133.23(c)
title: 133.23(c)
text: '(c) O teste de habilidade requer as manobras apropriadas a cada classe de combinação
  requerida.

  Tais manobras, apropriadas a cada classe, devem ser demonstradas com a aeronave descrita
  na

  seção 133.19 e incluem:

  (1) decolagem e pouso;

  (2) demonstração de controle direcional em voo pairado;

  (3) aceleração a partir do voo pairado;

  (4) voo nas velocidades operacionais;

  (5) aproximações para pouso ou para a área de trabalho;

  (6) manobras com a carga externa na posição de liberação; e

  (7) demonstração de operação com guincho, se for instalado um guincho para içar a carga

  externa.'
