title: 133.23(d)
text: '(d) A conformidade com os parágrafos (b) e (c) desta seção não precisa ser demonstrada
  se a

  ANAC considerar, baseada na experiência prévia e no histórico de segurança do requerente
  (ou de

  seu piloto-chefe) em operações com cargas externas, que seus conhecimentos e habilidades
  são

  adequados.'
