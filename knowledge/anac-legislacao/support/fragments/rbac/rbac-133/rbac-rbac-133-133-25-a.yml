cite: 133.25(a)
title: 133.25(a)
text: '(a) O detentor de uma autorização para operação com cargas externas pode requerer à
  ANAC

  uma modificação de sua autorização, adicionando ou retirando combinações aeronave-carga
  externa

  aprovadas. Se o requerente de uma modificação atender ao estabelecido nas seções 133.19
  e 133.49,

  sua autorização para operação com cargas externas será modificada, autorizando a operação
  com

  aquelas combinações aeronave-carga externa para as quais o requerente demonstrou atender
  às

  provisões aplicáveis da subparte D deste Regulamento.'
