cite: 133.25(b)
title: 133.25(b)
text: '(b) O detentor de uma autorização para operação com cargas externas pode requerer uma

  modificação à sua autorização, acrescentando ou retirando aeronaves de sua frota. O requerimento

  deve ser apresentado a ANAC, juntamente com uma nova lista de aeronaves, por marca de

  registro,com as classes de combinação aeronave-carga externa requeridas para cada uma delas.'
