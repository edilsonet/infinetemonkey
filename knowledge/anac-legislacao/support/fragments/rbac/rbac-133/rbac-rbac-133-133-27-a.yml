cite: 133.27(a)
title: 133.27(a)
text: '(a) Cada detentor de uma autorização para operação com cargas externas deve manter
  sua

  autorização e a listagem das aeronaves autorizadas em sua base de operações e deve apresentá-la

  para inspeções da ANAC sempre que requerido.'
