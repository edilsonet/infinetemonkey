cite: 133.27(c)
title: 133.27(c)
text: '(c) Se a ANAC suspender ou revogar uma autorização para operação com carga externa,
  o

  detentor da mesma deve devolvê-la à ANAC. Se o detentor, por outras razões, resolver descontinuar

  as operações segundo sua autorização, e não retomá-las dentro de dois anos, ele deve retornar
  a

  autorização à ANAC.


  Data da emissão: 12 de abril de 2019.


  SUBPARTE C

  REGRAS DE OPERAÇÃO E REQUISITOS ASSOCIADOS'
