title: 133.31(a)
text: '(a) Em uma emergência envolvendo a segurança de pessoas ou propriedades, o detentor
  de uma

  autorização para operação com cargas externas pode desviar-se das regras deste Regulamento
  na

  extensão requerida para fazer face à emergência.'
