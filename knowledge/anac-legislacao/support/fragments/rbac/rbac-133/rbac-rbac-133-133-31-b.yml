cite: 133.31(b)
title: 133.31(b)
text: '(b) Cada pessoa que, sob a autorização desta seção, desviar-se das regras deste Regulamento

  deve notificar o fato à ANAC, no prazo de 10 dias após a ocorrência. Caso requerido, a pessoa
  deve

  fornecer à ANAC um relatório completo da operação envolvida, incluindo uma descrição dos

  desvios ocorridos e a razão de tais desvios.'
