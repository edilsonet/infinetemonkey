cite: 133.33(b)
title: 133.33(b)
text: '(b) Ninguém pode conduzir uma operação de aeronave com cargas externas a menos que:

  (1) a aeronave atenda aos requisitos da seção 133.19; e

  (2) a aeronave e a combinação aeronave-carga conste da autorização do operador.'
