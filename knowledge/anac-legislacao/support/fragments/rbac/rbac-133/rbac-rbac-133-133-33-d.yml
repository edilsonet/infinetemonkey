title: 133.33(d)
text: '(d) Não obstante as provisões do RBHA 91, ou RBAC que venha a substituí-lo, o detentor
  de

  uma autorização para operação com carga externa pode conduzir (em aeronave de asa rotativa,

  certificada segundo os requisitos dos RBAC 27 ou 29, incluindo os requisitos para os meios
  de

  fixação de cargas externas) operações com cargas externas sobre áreas congestionadas, desde
  que


  Data da emissão: 12 de abril de 2019


  essas operações sejam conduzidas sem riscos para pessoas e propriedades na superfície e
  de acordo

  com os requisitos abaixo:

  (1) o operador deve elaborar um plano para toda a operação, coordenar esse plano com a

  ANAC e obter aprovação para a operação junto a ANAC e ao órgão do Serviço de Proteção ao
  Voo

  com jurisdição sobre a referida área. O plano deve incluir um acerto com as autoridades
  policiais

  locais para quê seja impedido o acesso de pessoas não autorizadas à área em que as operações
  serão

  conduzidas, uma coordenação com o controle de tráfego aéreo local e deve conter uma carta

  detalhando as rotas e altitudes de voo a serem usadas; e

  (2) cada voo deve ser conduzido em uma altitude e em uma rota que permita que uma carga

  externa alijável seja alijada, e a aeronave seja pousada em emergência, sem pôr em risco
  pessoas e

  propriedades na superfície.'
