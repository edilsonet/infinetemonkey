cite: 133.33(e)
title: 133.33(e)
text: '(e) Não obstante as provisões do RBHA 91, ou RBAC que venha a substituí-lo, e exceto
  como

  previsto no parágrafo 133.45(d), o detentor de uma autorização para operação com carga externa

  pode conduzir operações com cargas externas, incluindo aproximações, afastamentos e manobras

  para posicionamento da carga necessárias à operação, abaixo de 500 pés de altura em relação
  à

  superfície e a menos de 500 pés de pessoas, barcos, veículos e estruturas, desde que essa
  operação

  seja conduzida sem criar riscos a pessoas e a propriedades na superfície.'
