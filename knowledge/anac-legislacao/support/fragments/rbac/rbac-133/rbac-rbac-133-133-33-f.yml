cite: 133.33(f)
title: 133.33(f)
text: '(f) Ninguém pode conduzir operações de aeronaves com cargas externas sob IFR, a menos
  que

  expressamente autorizado pela ANAC. Entretanto, em nenhuma hipótese, uma pessoa pode ser

  transportada, como parte da carga externa, em um voo IFR.'
