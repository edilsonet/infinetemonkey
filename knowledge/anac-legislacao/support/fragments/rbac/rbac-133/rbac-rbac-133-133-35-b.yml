cite: 133.35(b)
title: 133.35(b)
text: '(b) O piloto em comando deve assegurar-se que todas as pessoas a bordo foram informadas,

  antes da decolagem, sobre todos os procedimentos pertinentes a serem seguidos (incluindo

  procedimentos normais, anormais e de emergência) e sobre os equipamentos a serem usados

  durante a operação com carga externa.'
