section_title: Requisitos para treinamento, exames e experiência dos tripulantes de voo
subsection_id: a
cite: 133.37(a)
title: 133.37(a)
text: '(a) Nenhum detentor de autorização pode empregar uma pessoa e nenhuma pessoa pode

  trabalhar como piloto em operações conduzidas segundo este Regulamento, a menos que essa

  pessoa:

  (1) tenha demonstrado para a ANAC, com sucesso, possuir o conhecimento e a habilidade

  requerida para operar a combinação aeronave-carga, conforme estabelecido na seção 133.23
  (no

  caso de ser empregado na operação um piloto que não seja o piloto-chefe nem um piloto assistente

  designado de acordo com o parágrafo 133.21(b), a demonstração pode ser feita para um deles,
  que

  será responsável pela aprovação); e


  Data da emissão: 12 de abril de 2019.


  (2) tenha em seu poder uma declaração atestando sua competência ou um registro em sua

  caderneta de voo indicando que atende ao previsto no parágrafo (a)(1) desta seção.'
