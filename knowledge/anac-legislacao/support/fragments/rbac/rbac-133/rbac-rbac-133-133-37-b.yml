section_title: Requisitos para treinamento, exames e experiência dos tripulantes de voo
subsection_id: b
cite: 133.37(b)
title: 133.37(b)
text: '(b) Nenhum detentor de autorização pode empregar uma pessoa e nenhuma pessoa pode

  trabalhar como tripulante ou exercer outras funções operacionais em operações classe D conduzidas

  de acordo com este Regulamento, a menos que, dentro dos 12 meses calendáricos antecedentes
  à

  operação, essa pessoa tenha completado com sucesso um programa aprovado de treinamento inicial

  ou de treinamento periódico anual.'
