cite: 133.41(a)
title: 133.41(a)
text: '(a) O requerente deve demonstrar à ANAC, pela execução das verificações operacionais
  em voo

  estabelecidas pelos parágrafos (b), (c) e (d) desta seção, como aplicável, que a combinação

  aeronave-carga possui características satisfatórias de voo, a menos que tais verificações
  já tenham

  sido previamente realizadas, demonstrando que as características de voo da combinação são

  satisfatórias. Para os propósitos dessa demonstração, o peso da carga externa (incluindo
  os meios de

  fixação de carga) é o peso máximo para o qual a autorização foi requerida.'
