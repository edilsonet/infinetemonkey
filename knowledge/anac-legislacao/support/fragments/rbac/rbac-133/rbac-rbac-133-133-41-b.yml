title: 133.41(b)
text: '(b) Combinação aeronave-carga Classe A. A verificação operacional de voo deve consistir,
  pelo

  menos, das seguintes manobras:

  (1) decolagem e pouso;

  (2) demonstração de controle direcional adequado, inclusive em voo pairado;

  (3) aceleração a partir do voo pairado; e

  (4) voos horizontais em velocidades até a velocidade máxima para a qual a autorização foi

  requerida.'
