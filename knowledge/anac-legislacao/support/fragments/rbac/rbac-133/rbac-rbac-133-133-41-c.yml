title: 133.41(c)
text: '(c) Combinação aeronave-carga Classes B e D. A verificação operacional de voo deve
  consistir,

  pelo menos, das seguintes manobras:

  (1) captura da carga externa;

  (2) demonstração de controle direcional adequado enquanto em voo pairado;

  (3) aceleração a partir do voo pairado;

  (4) voos horizontais em velocidades até a velocidade máxima para a qual a autorização foi

  requerida;

  (5) demonstração das apropriadas operações de levantamento; e

  (6) manobras da carga externa para sua posição de liberação e a liberação propriamente dita,

  sob condições prováveis de operação em voo, usando cada um dos controles de liberação rápida

  instalados na aeronave.'
