title: 133.41(d)
text: '(d) Combinação aeronave-carga Classe C. Para combinações aeronave-carga externa Classe
  C,

  usadas para esticamento de fios, colocação de cabos, ou operações similares, a verificação

  operacional de voo deve consistir das manobras aplicáveis estabelecidas pelo parágrafo (c)
  desta

  seção.'
