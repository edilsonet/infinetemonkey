title: 133.43(a)
text: '(a) Meios de fixação das cargas externas. Cada meio para fixação de cargas externas
  deve ter

  sido aprovado conforme um dos regulamentos abaixo, de acordo com a data da aprovação:

  (1) "Civil Air Regulations, Part 8", dos Estados Unidos da América, para meios aprovados
  até

  17 de janeiro de 1964 inclusive;

  (2) este Regulamento, para meios aprovados antes de 1 de fevereiro de 1977;


  Data da emissão: 12 de abril de 2019.


  (3) o RBAC 27 ou 29, conforme a aplicabilidade desses regulamentos na data de aprovação

  dos mesmos; ou

  (4) seção 21.25 do RBAC 21.'
