title: 133.43(b)
text: '(b) Dispositivos de liberação rápida. Cada dispositivo de liberação rápida deve ter
  sido aprovado

  conforme um dos regulamentos abaixo:

  (1) RBAC 27 ou 29, como aplicável;

  (2) este Regulamento, para dispositivos aprovados antes de 1 de fevereiro de 1977; ou

  (3) seção 21.25 do RBAC 21, exceto o modelo que se sujeitar aos parágrafos 27.865(b) do

  RBAC 27 e 29.865(b) do RBAC 29, conforme aplicável.'
