title: 133.43(c)
text: '(c) Peso e centro de gravidade:

  (1) peso. O peso total da combinação aeronave-carga não deve exceder o peso total aprovado

  para aeronave durante a certificação de tipo.

  (2) centro de gravidade. A localização do centro de gravidade deve, para todas as condições

  de carregamento, ficar dentro dos limites estabelecidos para a aeronave durante sua certificação
  de

  tipo. Para combinações aeronave-carga Classe C, os valores da magnitude e da direção da
  força de

  carga devem ser aqueles valores para os quais a localização efetiva do centro de gravidade

  permanece dentro da faixa estabelecida.'
