text: '133.45 Limitações operacionais

  Em adição às limitações operacionais contidas no Manual de Voo aprovado (RFM) da aeronave
  e às

  demais limitações estabelecidas pelo órgão certificador, o operador deve estabelecer pelo
  menos as

  seguintes limitações e incluí-las no Manual de Voo da Combinação Aeronave-Carga preparado
  para

  operações com cargas externas:'
