title: 133.45(d)
text: '(d) ninguém pode conduzir uma operação segundo este Regulamento, com um tipo de aeronave

  de asas rotativas certificada conforme o RBAC 21 (seção 21.25) na categoria restrita, sobre
  uma

  área densamente povoada, dentro de uma aerovia congestionada ou nas proximidades de um

  aeródromo com tráfego intenso no qual sejam realizadas operações de transporte de passageiros;
  e'
