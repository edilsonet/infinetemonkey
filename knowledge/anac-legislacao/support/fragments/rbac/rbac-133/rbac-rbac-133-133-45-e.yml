title: 133.45(e)
text: '(e) as operações com combinações aeronave-carga Classe D só podem ser conduzidas de
  acordo

  com o seguinte:

  (1) a aeronave a ser usada deve ter sido certificada na categoria A das aeronaves categoria

  transporte, para o peso da operação e deve ter capacidade de executar voo pairado com um
  motor

  não operante com o peso e na altitude da operação;

  (2) a aeronave deve ser equipada de modo a permitir intercomunicação rádio entre os

  membros da tripulação requeridos;

  (3) equipamentos para içamento de pessoas devem ser aprovados pela ANAC; e


  Data da emissão: 12 de abril de 2019


  (4) o dispositivo de levantamento deve ter um dispositivo de liberação em emergência

  requerendo duas ações distintas.'
