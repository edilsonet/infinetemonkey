text: '133.47 Manual de Voo da Combinação Aeronave-Carga Externa

  O requerente deve elaborar (ou fazer com que seja preparado) um Manual de Voo da Combinação

  Aeronave-Carga e deve submetê-lo à aprovação da ANAC. O manual deve ser elaborado de acordo

  com as provisões para manual de voo da subparte G dos RBAC 27 ou 29, conforme aplicável.
  Os

  dados do envelope de limitação de altura-velocidade não precisam ser listados como limitação

  operacional. O manual deve conter:'
