title: 133.47(c)
text: '(c) na seção de informações do manual:

  (1) informações sobre quaisquer peculiaridades descobertas quando operando particulares

  combinações aeronave;

  (2) avisos de precauções referentes a descargas de eletricidade estática para combinações
  de

  aeronave-carga para classes B, C e D; e

  (3) qualquer outra informação essencial à segurança de operações com cargas externas.'
