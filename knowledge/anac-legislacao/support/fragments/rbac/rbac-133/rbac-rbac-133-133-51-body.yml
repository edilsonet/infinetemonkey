cite: '133.51'
title: Certificação de aeronavegabilidade
text: '133.51 Certificação de aeronavegabilidade

  Quando a aeronave estiver sendo usada em operações conduzidas segundo este Regulamento,
  o

  certificado de operação de aeronave com carga externa é um certificado de aeronavegabilidade

  corrente e válido para cada certificado de tipo de aeronave em relação ao RBAC 27 ou 29
  (ou seus

  anteriores) e listados pelo número de registro em uma lista anexada ao certificado. Este
  certificado

  só é válido se for apresentado juntamente com uma cópia da autorização de operação com carga

  externa e a matrícula de areonave usada na operação constar na lista de aeronaves aprovadas
  anexa

  à autorização.'
