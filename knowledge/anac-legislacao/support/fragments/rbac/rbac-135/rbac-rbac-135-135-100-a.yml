cite: 135.100(a)
title: 135.100(a)
text: '(a) O detentor de certificado não pode determinar, e qualquer tripulante de voo não
  pode executar, qualquer serviço durante fases críticas do voo, exceto aqueles serviços requeridos
  para a operação segura da aeronave. Tarefas como chamadas rádio para a empresa solicitando
  suprimento de “

  galley

  ” ou confirmando conexões de passageiros, mensagens aos passageiros promovendo a empresa
  ou chamando a atenção para pontos de interesse do terreno, e preenchimento do livro de bordo
  ou relatório de voo não são requeridas para a operação segura da aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
