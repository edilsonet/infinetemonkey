section_title: Obrigações dos tripulantes de voo
subsection_id: b
cite: 135.100(b)
title: 135.100(b)
text: '(b) O tripulante de voo não pode executar e o piloto em comando não pode permitir qualquer
  atividade durante fases críticas do voo que possa desviar qualquer tripulante de voo do
  desempenho de suas obrigações ou que possa interferir de algum modo com a execução apropriada
  dessas obrigações. Atividades como alimentar-se, envolver-se em conversações não essenciais,
  fazer comunicações desnecessárias aos passageiros ou ler publicações não relacionadas com
  a condução do voo não são atividades requeridas para a operação segura da aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
