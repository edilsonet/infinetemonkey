cite: 135.100(c)
title: 135.100(c)
text: '(c) Para os propósitos desta seção, as fases críticas do voo incluem todas as operações
  de solo envolvendo rolagem, decolagem e pouso e todas as outras operações de voo conduzidas
  abaixo da altitude de 10.000 pés, exceto voo de cruzeiro.

  Nota

  : rolagem ou táxi é definido como “movimento de uma aeronave, por seus próprios meios, na
  superfície de um aeródromo”.'
