text: '135.101 Piloto segundo em comando requerido em voos IFR

  Um detentor de certificado somente pode operar uma aeronave transportando passageiros em
  voo IFR se houver um piloto segundo em comando na aeronave, com qualificação IFR válida,
  exceto como previsto na seção 135.105 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
