title: 135.103(c)
text: '(c) Um detentor de certificado não pode manter passageiros a bordo, durante permanências
  no solo, se houver ocorrência simultânea das condições (a)(1) e (a)(2) desta seção.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
