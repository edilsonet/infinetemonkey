section_title: 'Exceção a requisitos de piloto segundo em comando: utilização do sistema de
  piloto automático aprovado'
subsection_id: a
cite: 135.105(a)
title: 135.105(a)
text: (a) Ressalvado o disposto nas seções 135.99 e 135.111 deste Regulamento e exceto se
  forem necessários dois pilotos para operações VFR, uma pessoa pode operar uma aeronave sem
  um piloto segundo em comando desde que a aeronave esteja equipada com um sistema de piloto
  automático aprovado em funcionamento e que sua utilização esteja autorizada pelas especificações
  operativas apropriadas.
