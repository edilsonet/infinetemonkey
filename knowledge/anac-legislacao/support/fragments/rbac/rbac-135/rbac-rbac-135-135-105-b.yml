subsection_id: b
cite: 135.105(b)
title: 135.105(b)
text: '(b) O detentor de certificado somente pode utilizar uma pessoa, e uma pessoa somente
  pode atuar como piloto em comando sob esta seção em uma aeronave em operação regular, como
  definido no RBAC nº 119, se essa pessoa tiver no mínimo 100 horas de voo como piloto em
  comando de aeronaves de mesma fabricação e modelo da aeronave a ser operada, e, além disso,
  cumprir todos os outros requisitos aplicáveis deste Regulamento.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
