title: Requisitos de comissário de voo
text: '135.107 Requisitos de comissário de voo

  Um detentor de certificado somente pode operar uma aeronave que tenha uma configuração para
  passageiros superior a 19 assentos, excluído qualquer assento de piloto, se houver um comissário
  de voo qualificado a bordo da aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
