text: '135.111 Piloto segundo em comando requerido para operação categoria II

  Somente é permitido operar uma aeronave em operações Categoria II se houver a bordo um piloto
  segundo em comando devidamente qualificado na operação e na aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
