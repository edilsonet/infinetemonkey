section_title: Instruções verbais aos passageiros antes da decolagem
subsection_id: a
cite: 135.117(a)
title: 135.117(a)
text: '(a) Antes de cada decolagem, cada piloto em comando de uma aeronave transportando passageiros
  deve assegurar-se de que todos os passageiros foram instruídos verbalmente sobre:

  (1) Proibição de fumar a bordo. Cada passageiro deve ser instruído sobre a proibição de
  fumar a bordo. Nessa instrução deve ser incluída uma declaração de que as normas brasileiras
  requerem que os passageiros cumpram as orientações contidas nos letreiros e, quando for
  o caso, nos sinais luminosos (quando acesos) ambos fixados na aeronave. Se a aeronave possuir
  lavatório, deve ser incluída uma declaração de que é terminantemente proibido fumar no mesmo
  e, quando este lavatório possuir detector de fumaça, que é proibido interferir ou tentar
  prejudicar o funcionamento do detector de fumaça instalado nesse lavatório.

  (2) uso dos cintos de segurança, incluindo instruções de como colocá-los, ajustá-los e removê-los.
  Cada passageiro deve ser instruído sobre quando, onde e em que condições os cintos de segurança
  devem ser ajustados sobre o seu corpo. Nessa instrução deve ser enfatizada a obrigatoriedade
  do cumprimento das orientações contidas nos sinais luminosos (se existentes), nos letreiros
  fixados na aeronave e nas instruções verbais da tripulação referentes ao uso dos cintos
  de segurança.

  (3) colocação dos encostos dos assentos na posição vertical antes de cada decolagem e pouso;

  (4) localização e maneira de abrir a porta de entrada de passageiros e as saídas de emergência;

  (5) localização dos equipamentos de emergência e de sobrevivência, incluindo os requeridos
  pelas seções 135.166, 135.167, 135.176 e 135.177 deste Regulamento;

  (6) quando o voo envolver sobrevoo de grandes extensões de água, procedimentos de pouso
  na água e uso dos equipamentos de flutuação requeridos;

  (7) quando o voo envolver operação acima de 12.000 pés MSL, o uso normal e em emergência
  do oxigênio;

  (8) localização e operação dos extintores de incêndio;

  (9) utilização de equipamentos eletrônicos portáteis a bordo, conforme a seção 135.144;
  e

  (10) localização e conteúdo dos cartões de instrução aos passageiros requeridos pelo parágrafo
  (e) desta seção.'
