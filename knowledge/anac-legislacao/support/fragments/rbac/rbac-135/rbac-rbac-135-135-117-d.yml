section_title: Instruções verbais aos passageiros antes da decolagem
subsection_id: d
cite: 135.117(d)
title: 135.117(d)
text: (d) Ressalvadas as provisões do parágrafo (c) desta seção, para aeronaves certificadas
  para o transporte de 19 passageiros ou menos, as instruções verbais requeridas pelo parágrafo
  (a) desta seção devem ser dadas pelo piloto em comando, um tripulante ou outra pessoa qualificada
  designada pelo detentor de certificado no manual geral da empresa requerido pela seção 135.21
  deste Regulamento.
