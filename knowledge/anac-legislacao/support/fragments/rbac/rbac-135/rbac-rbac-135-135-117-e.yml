section_title: Instruções verbais aos passageiros antes da decolagem
subsection_id: e
cite: 135.117(e)
title: 135.117(e)
text: '(e) As instruções verbais requeridas pelo parágrafo (a) desta seção devem ser suplementadas
  por cartões impressos, os quais devem ser colocados em posições convenientes para o uso
  de cada passageiro. Os cartões devem:

  (1) ser apropriados para a aeronave na qual serão utilizados;

  (2) conter um diagrama das saídas de emergência e o método de operá-las;

  (3) baseado nas orientações emitidas pelo fabricante, conter informações sobre as posições
  a serem tomadas pelos passageiros em caso de pouso forçado da aeronave; e

  (4) conter outras instruções necessárias ao uso do equipamento de emergência a bordo da
  aeronave.'
