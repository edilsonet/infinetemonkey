title: 135.117(f)
text: '(f) Ressalvadas as provisões dos parágrafos (c) e (d) desta seção, as instruções verbais
  requeridas pelo parágrafo (a) desta seção podem ser dadas por meio de um dispositivo de
  reprodução de fitas pré-gravadas, que seja audível de cada assento de passageiro, sob níveis
  normais de ruído.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
