section_title: Proibição do transporte de armas a bordo
subsection_id: a
cite: 135.119(a)
title: 135.119(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, uma pessoa, enquanto a bordo
  de uma aeronave sendo operada por um detentor de certificado, não pode carregar ou trazer
  próximo a ela uma arma perigosa ou mortal, esteja ela oculta ou não.
