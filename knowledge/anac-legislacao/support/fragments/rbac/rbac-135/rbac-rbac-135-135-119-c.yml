title: 135.119(c)
text: '(c) O detentor de certificado deve estabelecer no manual geral da empresa as suas próprias
  normas e procedimentos para cumprimento das disposições contidas no Programa Nacional de
  Segurança da Aviação Civil Contra Atos de Interferência Ilícita (PNAVSEC) e na regulamentação
  dele decorrente.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
