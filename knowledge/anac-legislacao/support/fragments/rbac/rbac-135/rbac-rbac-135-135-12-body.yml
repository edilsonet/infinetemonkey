title: Tripulantes treinados previamente
text: '135.12 Tripulantes treinados previamente

  Um detentor de certificado em processo de transição para o RBAC nº 121, ou que tenha completado
  este processo, pode usar um tripulante que recebeu o treinamento desse detentor de certificado
  de acordo com as subpartes E, G e H deste Regulamento sem atender aos requisitos de treinamento
  inicial e de qualificação das subpartes N e O do RBAC nº 121. Esse tripulante deve passar
  a atender aos requisitos aplicáveis de treinamento periódico do RBAC nºordm; 121.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
