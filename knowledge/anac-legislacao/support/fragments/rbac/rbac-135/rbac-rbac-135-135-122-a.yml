section_title: Guarda de alimentos, bebidas e equipamentos de serviços aos passageiros durante
  movimentação da aeronave na superfície e nas decolagens e pousos
subsection_id: a
cite: 135.122(a)
title: 135.122(a)
text: (a) Um detentor de certificado não pode movimentar na superfície, decolar ou pousar
  uma aeronave enquanto qualquer alimento, bebida e artefatos correlatos por ela fornecidos
  estiverem em um assento para passageiros.
