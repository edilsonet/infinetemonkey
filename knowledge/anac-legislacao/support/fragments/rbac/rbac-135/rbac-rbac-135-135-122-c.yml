section_title: Guarda de alimentos, bebidas e equipamentos de serviços aos passageiros durante
  movimentação da aeronave na superfície e nas decolagens e pousos
subsection_id: c
cite: 135.122(c)
title: 135.122(c)
text: (c) Um detentor de certificado somente pode permitir movimentações na superfície, decolagens
  e pousos de suas aeronaves, se cada carrinho de serviço aos passageiros estiver seguro na
  posição onde é normalmente guardado.
