section_title: Deveres em emergências e evacuações de emergência
subsection_id: a
cite: 135.123(a)
title: 135.123(a)
text: (a) O detentor de certificado deve designar, para cada tripulante requerido em cada
  tipo de aeronave, as funções a serem exercidas em uma emergência ou em situação requerendo
  evacuação de emergência. O detentor de certificado deve assegurar-se de que essas funções
  podem ser praticamente exercidas e que atendem qualquer emergência com razoável probabilidade
  de ocorrência, incluindo incapacitação de determinado tripulante ou sua impossibilidade
  de alcançar o compartimento de passageiros devido ao deslocamento da carga em uma aeronave
  com carregamento misto carga/passageiros.
