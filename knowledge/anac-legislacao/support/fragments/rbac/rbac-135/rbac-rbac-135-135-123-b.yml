text: '(b) O detentor de certificado deve descrever, no manual geral da empresa requerido
  pela seção 135.21 deste Regulamento, as funções de cada categoria de tripulante requerido,
  designadas em atendimento ao parágrafo (a) desta seção.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
