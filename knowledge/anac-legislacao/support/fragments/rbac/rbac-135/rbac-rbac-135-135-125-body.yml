title: Segurança da aeronave
text: '135.125 Segurança da aeronave

  O detentor de certificado conduzindo operações segundo este Regulamento deve cumprir os
  requisitos de segurança geral estabelecidos pela ANAC no Programa Nacional de Segurança
  da Aviação Civil Contra Atos de Interferência Ilícita (PNAVSEC) e na regulamentação dele
  decorrente.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
