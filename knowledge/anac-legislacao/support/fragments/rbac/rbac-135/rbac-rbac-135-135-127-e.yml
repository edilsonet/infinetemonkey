section_title: Requisitos de avisos aos passageiros e proibição de fumar a bordo
subsection_id: e
cite: 135.127(e)
title: 135.127(e)
text: (e) Durante todos os segmentos do voo, o sinal luminoso de “Não Fume” (ou similar) deve
  estar ligado, ou o letreiro “Não Fume” (ou similar) deve estar visível, durante todo o movimento
  da aeronave na superfície, para cada decolagem ou pouso, e em qualquer outro tempo considerado
  necessário pelo piloto em comando.
