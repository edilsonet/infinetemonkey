section_title: Uso dos cintos de segurança e de cadeiras de segurança para crianças
subsection_id: a
cite: 135.128(a)
title: 135.128(a)
text: '(a) Exceto como estabelecido neste parágrafo, cada pessoa a bordo de uma aeronave operada
  segundo este Regulamento deve ocupar um assento ou leito aprovado, com um cinto de segurança
  individual ajustado sobre seu corpo, durante movimentações na superfície, decolagens e pousos.
  Para hidroaviões e aeronaves dotadas de flutuadores, durante operações na água, as pessoas
  encarregadas de atracar e desatracar a aeronave não precisam atender aos requisitos referentes
  à ocupação de assentos e uso de cintos de segurança. O cinto de segurança provido para uso
  do ocupante de um assento não pode ser utilizado por mais de uma pessoa. Ressalvados os
  requisitos precedentes, uma criança pode:

  (1) ser segurada por um adulto que esteja ocupando um assento ou leito aprovado, desde que
  a criança não tenha ainda completado dois anos de idade e não ocupe ou use qualquer dispositivo
  de contenção; ou

  (2) ressalvado qualquer outro requisito dos RBAC, ocupar uma cadeira de segurança para crianças
  fornecida pelo detentor de certificado ou por uma das pessoas citadas no parágrafo (a)(2)(i)
  desta seção, desde que:'
