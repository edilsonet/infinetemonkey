section_title: Uso dos cintos de segurança e de cadeiras de segurança para crianças
subsection_id: b
cite: 135.128(b)
title: 135.128(b)
text: '(b) Um detentor de certificado não pode proibir que uma criança ocupe uma cadeira de
  segurança para criança fornecida pelos pais, tutor ou pelo responsável pela criança, desde
  que a criança seja detentora de uma passagem com direito a assento ou leito aprovado, ou
  que possa usar um assento ou leito aprovado colocado à sua disposição pelo detentor de certificado,
  e desde que os requisitos estabelecidos nos parágrafos (a)(2)(i) a (a)(2)(iii) desta seção
  sejam atendidos. Esta seção não proíbe que o detentor de certificado forneça suas próprias
  cadeiras de segurança para crianças ou que, consistentemente com práticas operacionais de
  segurança, determine a localização mais apropriada do assento para passageiros onde será
  fixada uma cadeira de segurança.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
