section_title: Uso dos cintos de segurança e de cadeiras de segurança para crianças
subsection_id: i
cite: 135.128(i)
title: 135.128(i)
text: '(i) a criança esteja acompanhada por um dos pais, um tutor ou uma pessoa designada
  pelos pais ou tutor da criança para zelar pela segurança dela durante o voo;

  (ii) a cadeira de segurança tenha sido aprovada para uso em aeronaves por autoridade aeronáutica
  brasileira ou estrangeira, de acordo com padrões nacionais ou da Organização da Aviação
  Civil Internacional (OACI). A aprovação deve ser evidenciada por etiqueta fixada na cadeira
  de segurança; e

  (iii) o detentor de certificado se responsabilize pela verificação do cumprimento dos requisitos
  abaixo:

  (A) a cadeira de segurança deve ser adequadamente fixada a um assento ou leito aprovado
  voltado para frente da aeronave;

  (B) a criança deve estar apropriadamente segura pelo sistema de amarração da cadeira de
  segurança e não pode exceder o limite de peso especificado para o qual a cadeira foi aprovada;
  e

  (C) a cadeira de segurança deve possuir a etiqueta referida no parágrafo (a)(2)(ii) desta
  seção. Na etiqueta deve constar o peso máximo para o qual ela foi aprovada.'
