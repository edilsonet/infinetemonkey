title: 135.129(a)
text: '(a)(1) Aplicabilidade. Esta seção aplica-se para todos os detentores de certificado
  operando segundo este Regulamento com helicópteros com mais de 19 assentos para passageiros
  ou em que realizam operações regulares com aeronaves tendo 10 ou mais assentos para passageiros.

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (2) Obrigação de estabelecer a adequabilidade. O detentor de certificado deve estabelecer,
  considerando a capacidade necessária para executar as tarefas aplicáveis do parágrafo (d)
  desta seção, a adequabilidade de cada pessoa que ele permita ocupar um assento de saída.
  Para os propósitos desta seção:'
