text: '(b) Um detentor de certificado n&aatilde;o pode autorizar que uma pessoa ocupe um assento
  afetado por essa seção se for verificado que a pessoa provavelmente é incapaz de executar
  uma ou mais das tarefas aplicáveis listadas no parágrafo (d) desta seção porque:

  (1) falta à pessoa suficiente mobilidade, força ou destreza em ambos os braços e mãos e/ou
  em ambas as pernas:'
