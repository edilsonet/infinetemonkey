title: 135.129(f)
text: (f) O detentor de certificado deve divulgar para o público, em todos os locais de embarque
  e de venda de passagens em cada aeroporto onde conduza operações de passageiros, os procedimentos
  escritos estabelecidos para determinar se uma pessoa pode ou não ocupar um assento de saída.
