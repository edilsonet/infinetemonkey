title: 135.129(g)
text: '(g) Um detentor de certificado somente pode autorizar o táxi ou “

  push back

  ” se pelo menos um tripulante requerido tiver verificado que não existe assento de saída
  ocupado por uma pessoa que esse tripulante julgue ser incapaz de executar uma das tarefas
  aplicáveis listadas no parágrafo (d) desta seção.'
