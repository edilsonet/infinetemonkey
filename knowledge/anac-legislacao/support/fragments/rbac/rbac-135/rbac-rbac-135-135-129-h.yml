title: 135.129(h)
text: (h) O detentor de certificado deve incluir nas instruções verbais aos passageiros uma
  referência aos cartões de informações aos passageiros requeridos pelos parágrafos (d) e
  (e), aos critérios de seleção estabelecidos no parágrafo (b) e às tarefas a serem executadas
  estabelecidas no parágrafo (d) desta seção.
