cite: 135.129(i)
title: 135.129(i)
text: '(i)

  assento de saída

  significa:

  (A) cada assento tendo acesso direto a uma saída da aeronave; e

  (B) cada assento de uma fila de assentos por meio da qual passageiros têm que passar para
  ter acesso a uma saída, desde o assento junto à saída até o assento junto ao corredor mais
  próximo à saída.

  (ii) um

  assento para passageiros tendo acesso direto

  significa um assento a partir do qual um passageiro pode atingir diretamente uma saída sem
  passar por um corredor ou contornar uma obstrução qualquer.

  (3) Pessoas designadas para estabelecer adequabilidade. O detentor de certificado deve designar,
  no manual geral da empresa requerido por este Regulamento, as pessoas encarregadas de estabelecer
  a adequabilidade, de maneira não discriminatória e consistente com os requisitos desta seção,
  de cada pessoa para ocupar um assento de saída.

  (4) Submissão para aprovação da identificação. O detentor de certificado deve identificar,
  para cada configuração de assentos para passageiros de sua frota e em conformidade com as
  definições deste parágrafo, quais são os “assentos de saída” de cada um de suas aeronaves.
  Essa identificação deve ser submetida à aprovação da ANAC como parte dos procedimentos que
  devem ser aprovados segundo o parágrafo (n) desta seção.'
