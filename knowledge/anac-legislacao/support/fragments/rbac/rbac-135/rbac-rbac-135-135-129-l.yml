cite: 135.129(l)
title: 135.129(l)
text: (l) Na eventualidade de todos os assentos que não sejam de saída estarem ocupados e
  for necessário reposicionar um passageiro ocupando um assento de saída, o detentor de certificado
  deve deslocar para esse último assento uma pessoa que possa e aceite assumir as tarefas
  de evacuação que possam se tornar necessárias.
