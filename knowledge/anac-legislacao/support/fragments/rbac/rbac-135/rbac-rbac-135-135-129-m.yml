cite: 135.129(m)
title: 135.129(m)
text: '(m) Um detentor de certificado só pode recusar o transporte de uma pessoa segundo esta
  seção se:

  (1) o passageiro se recusar a atender as instruções, dadas por um tripulante ou outra pessoa
  autorizada pelo detentor de certificado, referentes ao cumprimento das restrições à ocupação
  de assentos de saída estabelecidas por esta seção; ou

  (2) o único assento que poderia acomodar fisicamente essa pessoa for um assento de saída.'
