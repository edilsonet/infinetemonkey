title: 135.129(o)
text: '(o) O detentor de certificado deve designar os assentos para os passageiros, antes
  do embarque dos mesmos, de modo consistente com os critérios listados no parágrafo (b) e
  as tarefas listadas no parágrafo (d) desta seção na máxima extensão praticável.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
