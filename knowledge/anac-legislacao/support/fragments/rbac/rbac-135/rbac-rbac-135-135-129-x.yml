text: '(x) para ajudar outras pessoas na utilização de uma escorregadeira de escape;

  (2) a pessoa tem menos de 15 anos de idade ou não possui capacidade para executar uma ou
  mais das tarefas aplicáveis listadas no parágrafo (d) desta seção sem a assistência de um
  adulto (pais, parentes ou amigos);

  (3) a pessoa não consegue ler e entender as instruções requeridas por essa seção e as instruções
  relativas às evacuações de emergência providas pelo detentor de certificado de forma escrita
  ou gráfica ou, ainda, a pessoa não tem condições de entender as instruções orais dadas pelos
  tripulantes;

  (4) a pessoa não possui capacidade visual suficiente para executar uma ou mais das tarefas
  aplicáveis listadas no parágrafo (d) desta seção sem o auxílio de ajudas visuais superiores
  a lentes de contato ou óculos;

  (5) a pessoa não possui capacidade auditiva suficiente para ouvir e compreender instruções
  gritadas pelos comissários sem auxílio de ajudas de audição superiores a um aparelho de
  audição comum;

  (6) a pessoa não possui capacidade adequada de trocar informações orais com outros passageiros;
  ou

  (7) a pessoa tem:'
