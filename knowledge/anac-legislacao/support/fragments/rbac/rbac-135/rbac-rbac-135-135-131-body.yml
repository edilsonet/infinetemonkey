text: '135.131 Simulação em voo de situações anormais ou de emergência

  É vedado simular procedimentos anormais ou de emergência ou simular condições meteorológicas
  por instrumentos (IMC) por meios artificiais em uma operação de transporte aéreo público.

  (Incluído pela Resolução nº 494, de 17.10.2018)'
