text: '135.133 Relatórios sobre colisão com a fauna

  O detentor de certificado ou o piloto em comando de aeronaves voando em espaço aéreo brasileiro
  devem informar ao Centro de Prevenção de Investigação de Acidentes Aeronáuticos - CENIPA
  caso sua aeronave tenha sofrido colisão com uma ou mais aves, salvo se já tiver sido relatada
  como um acidente ou incidente. Também deve ser informado caso seja avistado grupo de aves
  que possa colocar em risco as operações aéreas próximas aos sítios aeroportuários.

  (Incluído pela Resolução nº 494, de 17.10.2018)

  SUBPARTE C

  AERONAVES E EQUIPAMENTOS'
