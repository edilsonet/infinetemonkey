title: Aplicabilidade
text: '135.141 Aplicabilidade

  Esta Subparte estabelece requisitos de aeronaves e equipamentos para operações segundo este
  Regulamento. Os requisitos desta Subparte são adicionais aos requisitos de aeronaves e equipamentos
  do RBAC nº 91. No entanto, este Regulamento não exige a duplicação de qualquer equipamento
  requerido por ambos os regulamentos.

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
