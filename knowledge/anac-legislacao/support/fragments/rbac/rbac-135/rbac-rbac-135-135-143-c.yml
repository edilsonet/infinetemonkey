title: 135.143(c)
text: '(c) Exceto se de outra forma especificado pelo Departamento de Controle do Espaço Aéreo
  - DECEA, as aeronaves que operam sob este Regulamento devem possuir equipamento transponder
  instalado que atenda aos requisitos de desempenho e de condições ambientais da OTP (TSO)-C74c
  (Mode A/C), ou de suas revisões posteriores, ou da OTP (TSO)-C112 (Mode S).

  (1) Aviões que realizam voos internacionais devem possuir equipamento transponder instalado
  que atenda à OTP (TSO)-C112 (Mode S).

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
