title: 135.144(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, é vedado utilizar ou autorizar
  a utilização de qualquer dispositivo eletrônico em qualquer aeronave civil registrada no
  Brasil operando segundo este Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
