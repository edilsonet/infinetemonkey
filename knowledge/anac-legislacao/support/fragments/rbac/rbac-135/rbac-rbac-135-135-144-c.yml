title: 135.144(c)
text: '(c) A determinação requerida pelo parágrafo (b)(6) desta seção deve ser feita pelo
  detentor de certificado emitido segundo o RBAC nº 119 operando a aeronave na qual o particular
  dispositivo pretenda ser utilizado.

  (Redação dada pela Resolução nº 549, de 20.03.2020)'
