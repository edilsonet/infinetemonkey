section_title: Voos de avaliação operacional e testes de validação
subsection_id: c
cite: 135.145(c)
title: 135.145(c)
text: (c) O detentor de certificado não pode transportar passageiros em uma aeronave durante
  os voos de avaliação operacional, exceto aqueles necessários à avaliação e aqueles designados
  pela ANAC para observar a avaliação. No entanto, é autorizado o treinamento de pilotos nesses
  voos.
