cite: 135.145(d)
title: 135.145(d)
text: '(d) Para os propósitos do parágrafo (a) desta seção, uma aeronave não é considerada
  de projeto similar a outra se:

  (1) ela possuir motores aeronáuticos diferentes, conforme classificação do RBAC nº 01, daqueles
  com que a aeronave original foi certificada; ou

  (2) existirem alterações na aeronave ou em seus componentes que afetem materialmente as
  características de voo.'
