cite: 135.145(e)
title: 135.145(e)
text: '(e) Testes de validação são exigidos para determinar que o detentor de certificado
  é capaz de conduzir operações em segurança e em conformidade com as normas regulamentares
  aplicáveis. Testes de validação são exigidos para as seguintes autorizações:

  (1) incorporação de uma aeronave para qual sejam necessários dois pilotos para operações
  VFR ou um avião a jato, se esta aeronave, ou uma aeronave de mesmo fabricante ou de projeto
  similar não tenha sido aprovada ou validada em operações sob esta parte;

  (2) operações fora do espaço aéreo brasileiro;

  (3) autorizações de navegação Classe II; e

  (4) desempenho ou autorizações de operacionais especiais.'
