title: Controles de voo duplicados
text: '135.147 Controles de voo duplicados

  Somente é permitido operar uma aeronave em operações requerendo dois pilotos se ela for
  dotada de comandos de voo duplos e em funcionamento. No entanto, se a aeronave foi certificada
  sem requerer dois pilotos, um manche único, transferível por rotação de um posto para outro
  (“

  throw over control

  ”), é aceitável.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
