text: '(b) um sistema de interfone para os tripulantes que:

  (1) seja capaz de funcionar independentemente do sistema de aviso aos passageiros requerido
  pelo parágrafo (a) desta seção, exceto quanto a microfones, fones, monofones, interruptores
  seletores e dispositivos de sinalização;

  (2) seja aprovado em conformidade com a seção 21.305 do RBAC nº 21;

