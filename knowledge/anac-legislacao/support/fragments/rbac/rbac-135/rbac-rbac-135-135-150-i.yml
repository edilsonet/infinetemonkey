section_title: Sistemas de aviso aos passageiros e de interfone para os tripulantes
subsection_id: i
cite: 135.150(i)
title: 135.150(i)
text: '(i) seja acessível para uso em um número suficiente de postos de trabalho de comissários
  de modo que todas as saídas de emergência ao nível do assoalho (ou os corredores de acesso
  a essas saídas se elas estiverem localizadas entre “

  galleys

  ”), em cada cabine de passageiros, sejam observáveis de um ou mais dos postos de comissário
  equipados com o sistema;

  (ii) tenha um sistema de alerta incorporando sinais sonoros e visuais para uso da tripulação
  de voo para alertar os comissários e para uso dos comissários para alertar a tripulação
  de voo;

  (iii) para o sistema de alerta requerido pelo parágrafo (b)(7)(ii) desta seção, haja um
  meio para o recipiente de uma chamada determinar se a chamada é normal ou de emergência;
  e

  (iv) quando o avião estiver no solo proporcione um meio de comunicação bilateral entre o
  pessoal de solo e pelo menos dois postos de trabalho na cabine de pilotos. A posição para
  uso do sistema pelo pessoal de solo deve ser localizada de modo a permitir que a pessoa
  que a estiver usando possa ficar fora da visão de pessoas dentro do avião.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
