cite: 135.151(b)
title: 135.151(b)
text: '(b) Somente é permitido operar uma aeronave multimotora com motores a turbina, que
  tenha uma configuração para passageiros com 20 ou mais assentos, se ela for equipada com
  gravador de voz na cabine dos pilotos, aprovado, que:

  (1) esteja instalado em conformidade com as seções 23.1457 (exceto parágrafos (a)(6), (d)(1)(ii),
  (4) e (5)), 25.1457 (exceto parágrafos (a)(6), (d)(1)(ii), (4) e (5)), 27.1457 (exceto parágrafos
  (a)(6), (d)(1)(ii), (4) e (5)) ou 29.1457 (exceto parágrafos (a)(6), (d)(1)(ii), (4) e (5)),
  dos RBAC nº 23, 25, 27 e 29, respectivamente, como aplicável; e

  (2) seja operado continuamente desde o início do “

  checklist

  ” (lista de verificação), antes do voo, até o termino da “

  checklist

  ” após o voo.'
