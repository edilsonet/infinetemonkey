cite: 135.151(e)
title: 135.151(e)
text: '(e) Para conformidade com esta seção pode ser utilizado um gravador de voz aprovado
  possuindo um dispositivo de apagamento da gravação desde que, durante a operação do gravador:

  (1) as informações sejam gravadas de acordo com o parágrafo (a) desta seção e somente sejam
  apagadas ou obliteradas as gravações feitas há mais de 15 minutos; ou

  (2) as informações sejam gravadas de acordo com parágrafo (b) desta seção e somente sejam
  apagadas ou obliteradas as gravações feitas há mais de 30 minutos.'
