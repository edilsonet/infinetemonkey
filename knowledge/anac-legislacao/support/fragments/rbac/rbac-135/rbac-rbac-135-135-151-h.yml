cite: 135.151(h)
title: 135.151(h)
text: '(h) Todas as aeronaves que, por esta seção, devam possuir um gravador de voz na cabine
  de comando e um gravador de dados de voo, a partir de 7 de abril de 2012, devem gravar todas
  as mensagens geradas pelo equipamento de comunicação por

  datalink

  , como requerido pela regulamentação de certificação aplicável à aeronave, caso possuam
  esse equipamento instalado.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
