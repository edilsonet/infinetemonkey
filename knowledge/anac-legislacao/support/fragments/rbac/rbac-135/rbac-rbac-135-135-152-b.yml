cite: 135.152(b)
title: 135.152(b)
text: '(b) Para aviões com motores a turbina tendo uma configuração para passageiros, excluindo
  qualquer assento requerido para tripulantes, de 10 a 19 assentos e que tenha sido fabricado
  após 18 de agosto de 2000:

  (1) os parâmetros listados nos parágrafos 135.152(h)(1) a (h)(57) deste Regulamento devem
  ser gravados dentro das faixas, precisões, resoluções e intervalos de gravação especificados
  no Apêndice M do RBAC nº 121;

  (2) proporcionalmente à capacidade do sistema de gravação, todos os parâmetros adicionais
  listados no parágrafo 135.152(h) deste Regulamento e para os quais fontes de informação
  estiverem instaladas e ligadas ao sistema de gravação devem ser registrados dentro das faixas,
  precisões, resoluções e intervalos de gravação especificados no Apêndice M do RBHA 121 até
  20 de agosto de 2001.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
