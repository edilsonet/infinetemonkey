cite: 135.152(c)
title: 135.152(c)
text: (c) Para todos os aviões com motores a turbina tendo uma configuração para passageiros,
  excluindo qualquer assento requerido para tripulantes, de 10 a 19 assentos e que tenha sido
  fabricado após 18 de agosto de 2002, os parâmetros listados nos parágrafos 135.152(h)(1)
  a 135.152(h)(88) devem ser registrados dentro das faixas, precisões, resoluções e intervalos
  de gravação especificados no Apêndice M do RBAC nº 121.
