text: '(f)(1) Para aviões fabricados em, ou antes, de 18 de agosto de 2000, e todas as outras
  aeronaves, cada gravador de dados de voo requerido por esta seção deve ser instalado de
  acordo com os requisitos 23.1459 (exceto parágrafos (a)(3)(ii) e (6)), 25.1459 (exceto parágrafos
  (a)(3)(ii) e (7)), 27.1459 (exceto parágrafos (a)(3)(ii) e (6)), ou 29.1459 (exceto parágrafos
  (a)(3)(ii) e (6)), conforme aplicável. A correlação requerida pelo parágrafo (c) das seções
  já referidas, como aplicável, só necessita ser determinada para uma aeronave de um grupo
