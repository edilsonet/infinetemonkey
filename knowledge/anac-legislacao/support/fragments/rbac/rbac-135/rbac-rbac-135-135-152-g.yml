title: 135.152(g)
text: (g) Cada gravador de dados de voo requerido por esta seção, que grave os dados especificados
  nos parágrafos (a) e (b) desta seção, deve possuir um dispositivo aprovado que facilite
  a localização do gravador quando submerso.
