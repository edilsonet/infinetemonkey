section_title: Gravadores de dados de voo
subsection_id: i
cite: 135.152(i)
title: 135.152(i)
text: '(i) deve ser gravado o parâmetro listado no parágrafo 135.152(h)(12) ou no parágrafo
  135.152 (h)(15) deste Regulamento; deve ser gravado o parâmetro listado no parágrafo 135.152(h)(13)
  ou no parágrafo 135.152(h)(16) deste Regulamento; e deve ser gravado o parâmetro listado
  no parágrafo 135.152(h)(14) ou no parágrafo 135.152(h)(17) deste Regulamento;

  (ii) para aviões com mais de dois motores, o parâmetro listado no parágrafo 135.152(h)(18)
  deste Regulamento, desde que exista capacidade suficiente no gravador instalado, deve, também,
  ser gravado;

  (iii) os parâmetros listados no parágrafo 135.152(h)(12) a (h)(17) deste Regulamento podem
  ser registrados, cada um deles, de uma única fonte; e

  (iv) qualquer parâmetro para o qual o Apêndice B deste Regulamento não apresentar valores
  deve ser gravado dentro das faixas, precisões e resoluções especificadas no Apêndice M do
  RBAC nº 121.

  (2) proporcionalmente à capacidade do sistema de gravação (DFDAU ou equivalente e DFDR),
  os parâmetros listados nos parágrafos 135.152(h)(19) a (h)(22) deste Regulamento devem,
  também, ser registrados dentro das faixas, precisões, resoluções e intervalos de gravação
  especificados no Apêndice B deste Regulamento.

  (3) o gravador de dados de voo aprovado requerido por esta seção deve ser instalado tão
  cedo quanto praticável, mas não mais tarde do que na próxima grande inspeção de manutenção
  a ser realizada após 18 de agosto de 1999. É considerada como uma grande inspeção de manutenção
  qualquer programação que mantenha o avião fora de serviço por 4 dias ou mais e que inclua
  o acesso a grandes componentes estruturais.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
