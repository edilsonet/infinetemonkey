section_title: Gravadores de dados de voo
subsection_id: j
cite: 135.152(j)
title: 135.152(j)
text: (j) Para todos os aviões com motores a turbina com uma configuração para passageiros
  de 10 a 30 assentos, excluindo qualquer assento para tripulante, que tenham sido fabricados
  após 19 de agosto de 2002 os parâmetros listados nos parágrafos (a)(1) a (a)(88) desta seção
  devem ser gravados dentro das faixas, precisões, resoluções e intervalos de gravação especificados
  no Apêndice F deste Regulamento.
