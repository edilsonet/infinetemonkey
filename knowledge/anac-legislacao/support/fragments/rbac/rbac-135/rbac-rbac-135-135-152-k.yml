title: 135.152(k)
text: '(k) Para aeronaves fabricadas antes de 18 de agosto de 1997, os seguintes tipos não
  precisam ter conformidade com esta seção: Bell 212, Bell 214ST, Bell 412, Bell 412SP, Boeing
  Chinook (BV-234), Boeing/Kawasaki Vertol 107 (BV/KV-107-II), de Havilland DHC-6, Eurocopter
  Puma 330J, Sikorsky 58, Sikorsky 61N e Sikorsky 76A.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
