text: (l) Em 7 de abril de 2014, todas as aeronaves fabricadas antes de 7 de abril de 2012,
  também devem atender aos requisitos 23.1459(a)(7) do RBAC nº 23, 25.1459(a)(8) do RBAC nº
  25, 27.1459(e) do RBAC nº 27, ou 29.1459(e) do RBAC nº 29, conforme aplicável.
