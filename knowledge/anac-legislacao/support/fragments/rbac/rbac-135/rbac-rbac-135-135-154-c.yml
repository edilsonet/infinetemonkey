cite: 135.154(c)
title: 135.154(c)
text: '(c) Manual de voo da aeronave. O manual de voo da aeronave deve conter procedimentos
  apropriados para:

  (1) a utilização do sistema de percepção e alarme de proximidade do solo;

  (2) reação apropriada da tripulação de voo em resposta aos alertas visuais e sonoros do
  sistema de percepção e alarme de proximidade do solo;

  (3) operação correta do sistema por parte da tripulação; e

  (4) desativação do sistema em condições de emergência e em condições planejadas e anormais.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
