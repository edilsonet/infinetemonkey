section_title: 'Extintores de incêndio: aeronaves transportando passageiros'
subsection_id: c
cite: 135.155(c)
title: 135.155(c)
text: '(c) pelo menos um extintor manual deve ser colocado e adequadamente posicionado na
  cabine de passageiros de:

  (1) cada grande avião com configuração para passageiros de mais de 6 assentos, excluindo
  qualquer assento para pilotos;

  (2) cada avião multimotor com motor a turbina com configuração para passageiros de mais
  de 6 assentos, excluindo qualquer assento para pilotos;

  (3) cada aeronave não listada nos parágrafos (c)(1) e (c)(2) desta seção com configuração
  para passageiros de mais de 9 assentos, excluindo qualquer assento para pilotos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
