section_title: Requisitos para equipamentos de oxigênio
subsection_id: i
cite: 135.157(i)
title: 135.157(i)
text: '(i) em níveis de voo acima de 10.000 e até 15.000 pés MSL, oxigênio para, pelo menos,
  10% dos ocupantes da aeronave, outros que não os pilotos, para a parte do voo nessas altitudes
  que tiver duração superior a 30 minutos; e

  (ii) acima de 25.000 pés MSL, oxigênio para cada ocupante da aeronave, outros que não os
  pilotos, para uma hora, exceto se, em todo o tempo durante o voo acima dessa altitude, o
  avião possa descer com segurança para 15.000 pés MSL dentro de quatro minutos, quando, então,
  é requerido apenas 30 minutos de suprimento.'
