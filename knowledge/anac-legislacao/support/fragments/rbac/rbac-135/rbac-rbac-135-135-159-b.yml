section_title: 'Requisitos de equipamentos: transporte de passageiros em voo VFR noturno'
subsection_id: b
cite: 135.159(b)
title: 135.159(b)
text: '(b) Para os propósitos do parágrafo (a)(5) desta seção, uma carga elétrica contínua
  em voo inclui as cargas que drenam corrente continuamente durante o voo, tais como equipamentos
  rádio e instrumentos alimentados eletricamente e luzes, mas não inclui cargas ocasionais
  intermitentes.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
