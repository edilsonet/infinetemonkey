section_title: 'Equipamentos de comunicações e navegação: transporte de passageiros em voo
  VFR noturno ou VFR diurno em áreas controladas'
subsection_id: a
cite: 135.161(a)
title: 135.161(a)
text: (a) Somente é permitido operar uma aeronave transportando passageiros em voo VFR noturno,
  ou VFR diurno em áreas controladas, se ela possuir um equipamento rádio para comunicações
  bilaterais capaz, em voo, de transmitir para e receber de uma estação de solo distante 25
  NM pelo menos.
