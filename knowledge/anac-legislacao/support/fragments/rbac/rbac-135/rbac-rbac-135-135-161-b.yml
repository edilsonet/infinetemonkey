section_title: 'Equipamentos de comunicações e navegação: transporte de passageiros em voo
  VFR noturno ou VFR diurno em áreas controladas'
subsection_id: b
cite: 135.161(b)
title: 135.161(b)
text: '(b) Somente é permitido operar uma aeronave transportando passageiros em voo VFR noturno
  se ela possuir equipamentos de rádio navegação capazes de receber sinais das estações de
  terra a serem utilizadas.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
