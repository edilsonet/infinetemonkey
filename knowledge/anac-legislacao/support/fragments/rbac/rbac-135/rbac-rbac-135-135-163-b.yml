section_title: 'Requisitos de equipamentos: aeronaves transportando passageiros em voo IFR'
subsection_id: b
cite: 135.163(b)
title: 135.163(b)
text: '(b) Para os propósitos desta seção, “carga elétrica contínua em voo” inclui as cargas
  que drenam corrente continuamente durante o voo, tais como equipamentos-rádio, instrumentos
  elétricos e luzes, mas não inclui cargas intermitentes ocasionais.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
