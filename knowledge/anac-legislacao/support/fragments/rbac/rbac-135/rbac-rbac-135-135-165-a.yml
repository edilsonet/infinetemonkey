cite: 135.165(a)
title: 135.165(a)
text: '(a) Somente é permitido operar um avião multimotor em uma operação regular como definida
  no RBAC nº 119, ou um avião a reação tendo uma configuração para passageiros de 10 ou mais
  assentos, excluindo qualquer assento para tripulantes em voo IFR ou sobre grandes extensões
  de água, se ele estiver equipado com os seguintes equipamentos de comunicações e de navegação,
  apropriados às facilidades de solo que serão utilizadas e ao valor do desempenho de navegação
  requerido para a rota a ser voada (“

  Required Navigation Performance

  ” - RNP) e capazes de receber e transmitir para pelo menos uma estação de solo em qualquer
  ponto dessa rota:

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (1) dois transmissores;

  (2) dois microfones;

  (3) dois fones ou um fone e um alto-falante;

  (4) um receptor de “

  marker beacon

  ”;

  (5) dois receptores independentes para navegação; e

  (6) dois receptores independentes para comunicações.'
