cite: 135.165(b)
title: 135.165(b)
text: '(b) Somente é permitido operar uma aeronave que não as especificadas no parágrafo (a)
  desta seção em operações IFR ou sobre grandes extensões de água, se ela estiver equipada
  com os seguintes equipamentos de comunicações e de navegação, apropriados às facilidades
  de solo que serão utilizadas e ao valor do desempenho de navegação requerido para a rota
  a ser voada (“

  Required Navigation Performance

  ” - RNP) e capazes de receber e transmitir para pelo menos uma estação de solo em qualquer
  ponto dessa rota:

  (1) um transmissor;

  (2) dois microfones;

  (3) dois fones ou um fone e um alto-falante;

  (4) um receptor de “

  marker beacon

  ”;

  (5) dois receptores independentes para navegação;

  (6) dois receptores independentes para comunicações;

  (7) apenas para operações sobre grandes extensões de água, um transmissor adicional; e

  (8) apenas para helicópteros em operações “

  off-shore

  ”, quando requerido, um VHF naval.'
