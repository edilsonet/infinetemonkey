cite: 135.165(c)
title: 135.165(c)
text: (c) Para os propósitos dos parágrafos (a)(5), (a)(6), (b)(5) e (b)(6) desta seção, um
  receptor é independente se o funcionamento de qualquer de suas partes não depende do funcionamento
  de qualquer parte de outro receptor. No entanto, um receptor que possa receber tanto sinais
  de comunicações e quanto de navegação pode ser utilizado no lugar de dois receptores separados
  um de sinais para navegação e outro de sinais para comunicações.
