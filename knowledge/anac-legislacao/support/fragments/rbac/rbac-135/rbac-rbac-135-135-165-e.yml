subsection_id: e
cite: 135.165(e)
title: 135.165(e)
text: '(e) Para os propósitos desta seção operação sobre grande extensão de água significa
  uma operação conduzida sobre água a uma distância horizontal da margem ou litoral igual
  ou superior a 186 km (100 milhas marítimas).

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
