cite: 135.166(c)
title: 135.166(c)
text: '(c) um conjunto de sobrevivência colocado em bolsa de lona (ou similar), com conteúdo
  aprovado pela ANAC e apropriado à rota a ser voada ou:

  (1) material para sinalização, independente do equipamento pirotécnico requerido pelo parágrafo
  (a) desta seção;

  (2) material em quantidade suficiente para purificar água e fornecer um mínimo de caloria,
  para o consumo de cada ocupante por 24 horas;

  (3) fazedor de fogo;

  (4) uma faca e manual de sobrevivência;

  (5) repelente de insetos;

  (6) sal de cozinha;

  (7) uma lanterna, uma bússola e um apito; e

  (8) um conjunto de primeiros socorros (pode ser o mesmo exigido pelo parágrafo 135.177(b)(1));
