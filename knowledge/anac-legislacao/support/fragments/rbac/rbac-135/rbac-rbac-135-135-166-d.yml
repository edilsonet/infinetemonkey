section_title: 'Equipamentos de emergência: operação sobre terreno desabitado ou selva'
subsection_id: d
cite: 135.166(d)
title: 135.166(d)
text: '(d) ressalvado o parágrafo (c) desta seção, a bolsa de sobrevivência por ele requerida
  pode ser dispensada em um avião equipado com um ELT automático transmitindo em 406 MHz ou
  em um helicóptero cujo ELT requerido pelo parágrafo (b) desta seção transmita na referida
  frequência.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
