subsection_id: a
cite: 135.167(a)
title: 135.167(a)
text: '(a) Somente é permitido operar uma aeronave sobre grandes extensões de água se ela
  possuir, instalado em local visível ou visivelmente marcado e facilmente acessível pelos
  ocupantes caso ocorra um pouso na água, os seguintes equipamentos:

  (1) para cada ocupante, um colete salva-vidas aprovado equipado com lâmpada localizadora
  de sobrevivência. O colete deve ser facilmente acessível de cada um dos assentos ocupados;
  e

  (2) botes aprovados em número suficiente (no que diz respeito à capacidade de flutuação)
  para transportar todos os ocupantes da aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
