cite: 135.167(c)
title: 135.167(c)
text: '(c) Somente é permitido operar uma aeronave sobre grandes extensões de água se estiver
  fixado a um dos botes requeridos pelo parágrafo (a) desta seção um ELT portátil ou de sobrevivência,
  flutuante e à prova d’água, que esteja em condições operacionais, que atenda aos requisitos
  dos parágrafos 91.207 (c) e (g) do RBAC nº 91.

  (Redação dada pela Resolução nº 546, de 18.03.2020)'
