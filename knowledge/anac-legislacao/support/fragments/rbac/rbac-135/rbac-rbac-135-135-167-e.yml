section_title: 'Equipamentos de emergência: operação sobre grandes extensões de água e operações
  “'
subsection_id: e
cite: 135.167(e)
title: 135.167(e)
text: '(e) Para os propósitos desta seção, operação sobre grande extensão de água significa:

  (1) para um avião de tipo não certificado na categoria transporte, uma operação conduzida
  sobre água a uma distância horizontal da margem ou litoral superior a 93 km (50 milhas marítimas);

  (2) para um avião de tipo certificado na categoria transporte, uma operação conduzida sobre
  água a uma distância horizontal da margem ou litoral igual ou superior a 186 km (100 milhas
  marítimas); e

  (3) para um helicóptero, uma operação conduzida sobre água a uma distância horizontal do
  litoral (ou margem) superior a 93 km (50 milhas marítimas) e a mais de 93 km (50 milhas
  marítimas) de um heliponto fixo ou flutuante na água (“

  off-shore

  ”).'
