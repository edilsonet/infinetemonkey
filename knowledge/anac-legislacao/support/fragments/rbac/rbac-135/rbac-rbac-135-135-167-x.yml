subsection_id: x
cite: 135.167(x)
title: 135.167(x)
text: '(x) uma bomba para enchimento manual;

  (xi) dois remos;

  (xii) um cordel com 23 m (75 pés) de comprimento;

  (xiii) uma bússola magnética;

  (xiv) um marcador de mar;

  (xv) uma lanterna elétrica portátil, em boas condições de operação;

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  (xvi) um suprimento de rações de emergência para dois dias, fornecendo pelo menos 1000 calorias/dia
  para cada pessoa;

  (xvii) um conjunto de dessalinização de água do mar para cada duas pessoas da capacidade
  do bote, ou 600 g de água para cada pessoa da capacidade do bote;

  (xviii) um conjunto de pesca; e

  (xix) um manual de sobrevivência adequado à área onde a aeronave será operada.'
