title: 135.169(a)
text: (a) Exceto para aviões certificados na categoria transporte regional, somente é permitido
  operar um grande avião se ele cumprir os requisitos adicionais de aeronavegabilidade das
  seções 121.213 a 121.283 e 121.307 do RBAC nº 121.
