text: '(e) Relatórios de conversões e reconfigurações (“

  retrofits

  ”).

  (1) Até o momento em que todos os compartimentos Classe D em aviões categoria transporte
  listados nas especificações operativas emitidas para o detentor de certificado para operações
  realizadas segundo este Regulamento tenham sido convertidos ou reconfigurados com um sistema
  de detecção e supressão apropriado, o detentor de certificado deve apresentar à ANAC relatórios
  periódicos, por escrito, que contenham as informações especificadas abaixo:'
