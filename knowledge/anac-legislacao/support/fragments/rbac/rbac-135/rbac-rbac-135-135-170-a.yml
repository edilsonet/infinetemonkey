cite: 135.170(a)
title: 135.170(a)
text: '(a) Somente é permitido operar um avião em conformidade com um certificado suplementar
  de tipo (ou com uma emenda a um certificado de tipo) emitido segundo o SFAR 41 para peso
  máximo de decolagem aprovado superior a 5670 kg (12.500 lb), se o avião estiver conforme
  com os requisitos para materiais de interior estabelecidos pelo RBAC nº 25 ou

  14 CFR Part 25

  .'
