title: 135.170(b)
text: '(b) Exceto para aviões categoria transporte regional e aviões certificados segundo
  o SFAR 41, somente é permitido operar um grande avião se ele atender aos seguintes requisitos
  adicionais de aeronavegabilidade:

  (1) exceto para aqueles materiais incluídos no parágrafo (b)(2) desta seção, todos os materiais
  de interior de cada compartimento usado por tripulantes ou passageiros devem atender às
  provisões do parágrafo 25.853 do RBAC nº 25 vigente nas datas abaixo ou como posteriormente
  emendado:'
