text: '(c) Materiais de isolamento térmico/acústico. Para aviões categoria transporte com
  certificação de tipo emitida após 1º de janeiro de 1958:

  (1) para aviões fabricados antes de 2 de setembro de 2005, quando um isolamento térmico
  acústico for instalado na fuselagem em substituição ao existente, esse isolamento deve atender
  aos requisitos de propagação de chamas da seção 25.856 do RBAC nº 25, vigente em 22 de setembro
  de 2009, se:'
