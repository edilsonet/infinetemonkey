section_title: Materiais para interiores
subsection_id: i
cite: 135.170(i)
title: 135.170(i)
text: '(i) exceto como previsto no parágrafo (b)(1)(iv) desta seção, cada avião com configuração
  para passageiros de 20 ou mais assentos e fabricado após 19 de agosto de 1988, mas antes
  de 20 de agosto de 1990, deve atender às provisões do ensaio de razão de liberação de calor
  estabelecidas pelo parágrafo 25.853(d) vigente em 6 de março de 1995 (antigo parágrafo 25.853(a-1)
  vigente em 20 de agosto de 1986), exceto que o total de calor liberado durante os 2 primeiros
  minutos de exposição da amostra não pode exceder 100 quilowatts-minuto por metro quadrado
  e o pico da razão de liberação de calor n&aatilde;o pode exceder 100 quilowatts por metro
  quadrado;

  (ii) cada avião com configuração para passageiros de 20 ou mais assentos e fabricado após
  19 de agosto de 1990 deve atender às provisões do ensaio de razão de liberação de calor
  e de fumaça estabelecidas pelo parágrafo 25.853(d) vigente em 6 de março de 1995 (antigo
  parágrafo 25.853(a-1) vigente em 26 de setembro de 1988);

  (iii) exceto como previsto nos parágrafos (b)(1)(v) ou (vi) desta seção, cada avião cujo
  requerimento para obtenção de certificação de tipo foi apresentado antes de 1º de maio de
  1972, qualquer que seja sua configuração para passageiros, quando uma substituição substancialmente
  completa do interior da cabine for realizada após 30 de abril de 1972, deve atender às provisões
  do parágrafo 25.853 vigente em 30 de abril de 1972;

  (iv) exceto como previsto nos parágrafos (b)(1)(v) ou (vi) desta seção, cada avião cujo
  requerimento para obtenção de certificação de tipo foi apresentado após 1º de maio de 1972,
  qualquer que seja sua configuração para passageiros, quando uma substituição substancialmente
  completa do interior da cabine for realizada após aquela data, deve atender aos requisitos
  de materiais para interior segundo os quais ele obteve certificação de tipo;'
