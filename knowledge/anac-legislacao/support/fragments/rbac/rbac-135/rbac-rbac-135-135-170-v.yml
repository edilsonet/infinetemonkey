title: 135.170(v)
text: '(v) exceto como previsto no parágrafo (b)(1)(vi) desta seção, cada avião de tipo certificado
  após 1º de janeiro de 1958, quando uma substituição substancialmente completa de componentes
  do interior da cabine identificados no parágrafo 25.853(d) for realizada em ou após aquela
  data, deve atender às provisões do ensaio de razão de liberação de calor estabelecidas pelo
  referido parágrafo, vigente em 6 de março de 1995 (antigo 25.853(a-1) vigente em 20 de agosto
  de 1986), exceto que o total de calor liberado durante os 2 primeiros minutos de exposição
  da amostra não pode exceder 100 quilowatts-minuto por metro quadrado e o pico da razão de
  liberação de calor não pode exceder 100 quilowatts por metro quadrado;

  (vi) cada avião de tipo certificado após 1º de janeiro de 1958, quando uma substituição
  substancialmente completa de componentes do interior da cabine identificados no parágrafo
  25.853(d) for realizada após 19 de agosto de 1990, deve atender às provisões do ensaio de
  razão de liberação de calor e de fumaça estabelecidas pelo referido parágrafo, vigente em
  6 de março de 1995 (antigo 25.853(a-1) vigente em 20 de agosto de 1986);

  (vii) ressalvadas as provisões desta seção, a ANAC pode autorizar desvios dos parágrafos
  (b)(1)(i), (b)(1)(ii), (b)(1)(v) ou (b)(1)(vi) desta seção, para componentes específicos
  do interior da cabine que não atendam aos aplicáveis requisitos de inflamabilidade e de
  emissão de fumaça, se for verificado que existem circunstâncias especiais que tornam impraticável
  a conformidade com os referidos parágrafos. Essas concessões de desvio são limitadas àqueles
  aviões fabricados dentro de 1 ano após a data aplicável estabelecida nesta seção e àqueles
  aviões nos quais o interior da cabine foi renovado dentro de 1 ano após as referidas datas.
  A petição para esses desvios deve incluir uma análise completa e detalhada de cada componente
  sujeito ao parágrafo 25.853(d) vigente em 6 de março de 1995 (antigo parágrafo 25.853(a-1)
  vigente em 20 de agosto de 1986), os passos propostos para atingir total conformidade com
  esta seção e, para os poucos componentes para os quais não será obtida a conformidade no
  prazo estabelecido, razões plausíveis para essa ocorrência; e

  (viii) ressalvadas as provisões desta seção, carrinhos e “containers” padronizados de “

  galley

  ”, que não atendam aos requisitos de inflamabilidade e de emissão de fumaça do parágrafo
  25.853(d) vigente em 6 de março de 1995 (antigo parágrafo 25.853(a-1) vigente em 20 de agosto
  de 1986), podem ser utilizados em um avião que deva atender aos parágrafos (b)(1)(i), (b)(1)(ii),
  (b)(1)(v) ou (b)(1)(vi) desta seção, desde que esses carrinhos e “

  containers

  ” tenham sido fabricados antes de 6 de março de 1995; e

  (2) os aviões de tipo certificado após 1º de janeiro de 1958 devem possuir todas as almofadas
  de assentos de qualquer compartimento ocupado por tripulantes ou passageiros (exceto aquelas
  dos assentos de tripulantes de voo) cumprindo os requisitos pertinentes à proteção contra
  fogo em almofadas de assento do parágrafo 25.853(c), vigente em 26 de novembro de 1984.'
