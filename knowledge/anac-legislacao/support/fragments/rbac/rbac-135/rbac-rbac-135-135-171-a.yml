section_title: 'Cintos de segurança e de ombro: instalação nos assentos de tripulantes'
subsection_id: a
cite: 135.171(a)
title: 135.171(a)
text: (a) Somente é permitido operar um avião a reação ou uma aeronave tendo uma configuração
  para passageiros de 10 assentos ou mais, excluindo qualquer assento para piloto, se cintos
  de segurança e de ombro aprovados estiverem instalados em cada assento de tripulante.
