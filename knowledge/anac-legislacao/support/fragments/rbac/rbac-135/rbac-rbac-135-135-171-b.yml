section_title: 'Cintos de segurança e de ombro: instalação nos assentos de tripulantes'
subsection_id: b
cite: 135.171(b)
title: 135.171(b)
text: '(b) Cada tripulante ocupando um assento equipado com cintos de segurança e de ombro
  deve mantê-los colocados e ajustados durante decolagens e pousos. No entanto, se os cintos
  ajustados impedirem que o tripulante exerça todas as suas obrigações requeridas, eles podem
  ser afrouxados.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
