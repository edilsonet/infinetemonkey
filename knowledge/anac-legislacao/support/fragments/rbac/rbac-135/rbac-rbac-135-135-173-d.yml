cite: 135.173(d)
title: 135.173(d)
text: '(d) Se o equipamento de bordo de detecção de trovoadas tornar-se inoperante em rota,
  a aeronave deve ser operada de acordo com as instruções e procedimentos especificados para
  o evento no manual geral da empresa requerido pela seção 135.21 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
