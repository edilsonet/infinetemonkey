title: 135.175(c)
text: '(c) Se o equipamento de radar meteorológico tornar-se inoperante em voo, a aeronave
  deve ser operada conforme as instruções e procedimentos especificados no manual geral da
  empresa requerido pela seção 135.21 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
