section_title: Conjunto de Primeiros Socorros
subsection_id: a
cite: 135.176(a)
title: 135.176(a)
text: '(a) Somente é permitido operar uma aeronave transportando passageiros se essa aeronave
  possuir a bordo um conjunto de primeiros socorros para tratamento de ferimentos que possam
  ocorrer a bordo ou em acidentes menores. O conjunto deve ser apropriadamente embalado e
  posicionado de modo a ser prontamente visível e acessível pelos ocupantes da aeronave, devendo
  conter os itens especificados no parágrafo 135.177(b)(1) deste Regulamento. O requerido
  no parágrafo 135.177(b)(1)(xviii) deste Regulamento é opcional para aeronaves com capacidade
  para 19 assentos ou menos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
