section_title: Requisitos de equipamentos de emergência para aeronaves tendo uma configuração
  para passageiros com mais de 19 assentos
subsection_id: c
cite: 135.177(c)
title: 135.177(c)
text: '(c) Cada item do equipamento deve ser regularmente inspecionado, segundo os períodos
  de inspeção estabelecidos no manual geral da empresa previsto na seção 135.21 deste Regulamento,
  para assegurar boas condições de uso e aplicabilidade imediata para os propósitos pretendidos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
