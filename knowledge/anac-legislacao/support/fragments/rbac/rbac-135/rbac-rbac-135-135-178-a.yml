cite: 135.178(a)
title: 135.178(a)
text: (a) Meios de evacuação em emergência. Cada saída de emergência de um avião terrestre
  transportando passageiros (exceto as saídas sobre as asas) que fique a mais de 1,83 m (6
  pés) acima do solo, com o avião parado e com trem-de-pouso baixado, deve possuir um meio
  aprovado para ajudar os ocupantes a descerem para o solo. O meio de ajuda para uma saída
  ao nível do assoalho deve atender aos requisitos do parágrafo 25.809(f)(1), vigente em 30
  de abril de 1972, exceto um avião cujo requerimento para certificação de tipo tenha sido
  apresentado após a referida data, que deve atender aos requisitos segundo os quais ele foi
  certificado.
