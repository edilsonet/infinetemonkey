title: 135.178(b)
text: '(b) Marcas internas das saídas de emergência. O seguinte deve ser cumprido em cada
  avião transportando passageiros:

  (1) cada saída de emergência para passageiros, seus meios de acesso e seus meios de abertura
  devem ser marcados conspicuamente. A identificação e localização de cada saída de emergência
  para passageiros deve ser reconhecível a uma distância igual à largura da cabine. A localização
  de cada saída de emergência para passageiros deve ser indicada por um sinal visível por
  um ocupante aproximando-se dela ao longo do corredor principal da cabine. Deve haver um
  sinal de localização:'
