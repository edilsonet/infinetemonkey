title: Equipamentos adicionais de emergência
text: '135.178 Equipamentos adicionais de emergência

  Somente é permitido operar um avião com uma configuração para passageiros com mais de 19
  assentos se o avião possuir os equipamentos adicionais de emergência especificados nos parágrafos
  (a) até (l) desta seção.'
