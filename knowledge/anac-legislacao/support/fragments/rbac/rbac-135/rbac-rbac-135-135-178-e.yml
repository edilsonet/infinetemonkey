text: '(e) Mecanismo de abertura das saídas de emergência.

  (1) Para um avião transportando passageiros para o qual o requerimento para certificação
  de tipo foi apresentado antes de 1º de maio de 1972, a localização do mecanismo de abertura
  de cada saída de emergência e as instruções para sua abertura devem ser mostradas por marcas
  colocadas na saída ou próximas a ela e essas marcas devem ser legíveis de uma distância
  de 30 pol. Adicionalmente, para cada saída tipo I ou II com um mecanismo de travamento liberado
  por movimento de rotação de uma alavanca, as instruções para abertura devem constar de:'
