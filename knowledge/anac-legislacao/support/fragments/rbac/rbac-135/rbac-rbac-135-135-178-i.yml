cite: 135.178(i)
title: 135.178(i)
text: '(i) uma seta vermelha com uma haste de pelo menos 3/4 de polegada de largura e uma
  ponta com duas vezes a largura da haste, estendendo-se por um arco de pelo menos 70º e com
  um raio aproximadamente igual a 3/4 do comprimento da alavanca; e

  (ii) a palavra “aberta” em letras vermelhas com 1 pol. de altura colocada horizontalmente
  próximo à ponta da seta vermelha.

  (2) Para um avião transportando passageiros cujo requerimento para certificação de tipo
  foi apresentado em 1º de maio de 1972 ou após esta data, a localização de cada mecanismo
  de abertura de saída de emergência e as instruções para sua abertura devem ser mostradas
  de acordo com os requisitos segundo os quais o avião foi certificado. Nesses aviões, nenhum
  mecanismo de abertura ou cobertura pode continuar a ser utilizado se sua luminescência (brilho)
  cair abaixo de 100

  microlamberts

  .'
