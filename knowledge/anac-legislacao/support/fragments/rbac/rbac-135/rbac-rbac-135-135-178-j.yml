title: 135.178(j)
text: (j) Saídas de emergência adicionais. Saídas de emergência aprovadas, adicionais ao número
  mínimo requerido de saídas, devem atender a todas as provisões aplicáveis desta seção, exceto
  as dos parágrafos (f)(1), (2) e (3). Essas saídas devem ser facilmente acessíveis.
