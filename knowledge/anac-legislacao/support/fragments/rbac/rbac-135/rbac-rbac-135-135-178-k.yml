cite: 135.178(k)
title: 135.178(k)
text: '(k) Em cada grande avião a reação transportando passageiros, cada saída ventral ou
  de cone de cauda deve ser:

  (1) projetada e construída de modo a não poder ser aberta em voo; e

  (2) marcada com um letreiro legível de uma distância de 30 pol. e posicionado em local conspícuo
  próximo ao meio de abertura da saída, informando que ela foi projetada e construída de modo
  a não poder ser aberta em voo.'
