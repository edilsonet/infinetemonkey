title: 135.178(l)
text: '(l) Lanternas portáteis. Somente é permitido operar um avião transportando passageiros
  se ele estiver equipado com lanternas portáteis guardadas em locais acessíveis de cada assento
  de comissário de voo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
