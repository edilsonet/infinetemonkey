cite: 135.179(c)
title: 135.179(c)
text: '(c) Os seguintes instrumentos e equipamentos não podem ser incluídos na MEL:

  (1) instrumentos e equipamentos que sejam especificamente ou de qualquer outra maneira requeridos
  pelos requisitos de aeronavegabilidade segundo as quais a aeronave recebeu certificação
  de tipo e que sejam essenciais para a operação segura sob todas as condições de operação;

  (2) instrumentos e equipamentos que uma diretriz de aeronavegabilidade requeira estarem
  em condições de funcionamento, exceto se a própria diretriz de aeronavegabilidade der outra
  orientação; e

  (3) os instrumentos e equipamentos requeridos por este Regulamento para operações específicas.'
