title: 135.179(d)
text: '(d) Ressalvadas as disposições dos parágrafos (c)(1) e (c)(3) desta seção, uma aeronave
  com instrumentos e equipamentos inoperantes pode ser operada segundo uma permissão especial
  de voo emitida de acordo com as seções 21.197 e 21.199 do RBAC nº 21.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
