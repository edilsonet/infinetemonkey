cite: 135.179(i)
title: 135.179(i)
text: '(i) ser preparada de acordo com as limitações especificadas no parágrafo (c) desta
  seção; e

  (ii) prover procedimentos para a operação da aeronave com certos instrumentos e equipamentos
  em condição inoperante;

  (4) registros identificando os equipamentos e instrumentos inoperantes e as informações
  requeridas pelo parágrafo (b)(3)(ii) desta seção devem estar disponíveis para conhecimento
  do piloto; e

  (5) a aeronave deve ser operada de acordo com todas as condições e limitações contidas na
  MEL e nas especificações operativas autorizando o seu uso.'
