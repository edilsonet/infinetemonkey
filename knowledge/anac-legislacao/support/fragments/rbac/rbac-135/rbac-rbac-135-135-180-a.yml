section_title: Sistema embarcado de prevenção de colisões (ACAS)
subsection_id: a
cite: 135.180(a)
title: 135.180(a)
text: (a) Exceto se de outro modo autorizado pela ANAC, somente é permitido operar um avião
  com motor a turbina e peso máximo de decolagem aprovado acima de 15.000 kg, se ele estiver
  equipado com um sistema embarcado de prevenção de colisões (ACAS II ou TCAS II, tipo 7.0,
  ou posterior) aprovado.
