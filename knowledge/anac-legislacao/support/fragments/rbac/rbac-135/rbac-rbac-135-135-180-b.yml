section_title: Sistema embarcado de prevenção de colisões (ACAS)
subsection_id: b
cite: 135.180(b)
title: 135.180(b)
text: (b) Exceto se de outro modo autorizado pela ANAC, somente é permitido operar um avião
  que possua motores a turbina e uma configuração para passageiros com mais de 19 assentos,
  excluindo qualquer assento para tripulante, se ele estiver equipado com um sistema embarcado
  de prevenção de colisões (ACAS II ou TCAS II, tipo 7.0, ou posterior) aprovado.
