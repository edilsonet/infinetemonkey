section_title: 'Requisitos de desempenho: aeronave operando IFR'
subsection_id: b
cite: 135.181(b)
title: 135.181(b)
text: '(b)

  Ressalvadas as restrições do parágrafo (a)(2) desta seção, helicópteros multimotores, transportando
  passageiros em operação “off-shore”, podem conduzir essas operações em IFR com um peso que
  permita ao helicóptero ter uma razão de subida de pelo menos 50 pés/min com o motor crítico
  inoperante, quando operando na altitude mínima da rota a ser voada, ou 1500 pés MSL, o que
  for mais alto

  .

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
