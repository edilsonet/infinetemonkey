title: 135.185(b)
text: '(b) O parágrafo (a) desta seção não se aplica a:

  (1) aeronave que tenha recebido o certificado de certificação de tipo original dentro dos
  36 meses precedentes; e

  (2) aeronave operada sob um sistema de peso e balanceamento aprovado nas especificações
  operativas do detentor de certificado.

  SUBPARTE D

  LIMITAÇÕES PARA OPERAÇÕES VFR E IFR. REQUISITOS DE CONDIÇÕES METEOROLÓGICAS'
