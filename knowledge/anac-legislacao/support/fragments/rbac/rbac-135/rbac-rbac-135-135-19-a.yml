title: 135.19(a)
text: (a) Em uma emergência envolvendo a segurança de pessoas e propriedades, o detentor de
  certificado pode desviar-se das regras deste Regulamento relativas à aeronave, aos equipamentos
  e aos mínimos meteorológicos na extensão requerida para fazer frente a essa emergência.
