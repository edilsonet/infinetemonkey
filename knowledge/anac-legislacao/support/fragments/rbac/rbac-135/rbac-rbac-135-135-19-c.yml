cite: 135.19(c)
title: 135.19(c)
text: '(c) Cada pessoa que, sob a autoridade prevista nesta seção, desviar-se de uma regra
  deste Regulamento deve, dentro de 10 dias úteis após o desvio, enviar para a ANAC um relatório
  completo da operação envolvida, incluindo uma descrição dos desvios e das razões para esses
  desvios.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
