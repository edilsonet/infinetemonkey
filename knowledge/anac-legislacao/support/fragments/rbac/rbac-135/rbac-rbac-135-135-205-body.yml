title: 'VFR: condições meteorológicas'
text: '135.205 VFR: condições meteorológicas

  Somente é permitido realizar um voo VFR se informações meteorológicas atualizadas indicarem
  que as condições meteorológicas ao longo da rota, ou da parte da rota a ser voada sob VFR,
  permitirão, nos horários apropriados, o cumprimento dessas regras de voo.

  (Redação dada pela Resolução nº 689, de 25.08.2022)'
