text: '135.207

  VFR: requisito de referências de superfície para helicópteros

  Somente é permitido operar um helicóptero em voo VFR se o piloto tiver referências visuais
  da superfície ou, à noite, referências luminosas visuais na superfície sob o helicóptero
  suficientes para controlar o voo com segurança.

  (Redação dada pela Resolução nº 689, de 25.08.2022)'
