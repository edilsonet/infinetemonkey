section_title: Autonomia para voo VFR
subsection_id: a
cite: 135.209(a)
title: 135.209(a)
text: '(a)

  Somente é permitido iniciar uma operação VFR em um avião se, considerando as informações
  meteorológicas conhecidas (incluindo o vento), esse avião tenha combustível e óleo lubrificante
  suficiente para voar até o aeródromo de destino e, assumindo consumo normal de combustível
  e óleo lubrificante em cruzeiro:

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (1) durante o dia, voar pelo menos mais 30 minutos; e

  (2) à noite, voar pelo menos mais 45 minutos.'
