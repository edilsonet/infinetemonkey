section_title: Autonomia para voo VFR
subsection_id: b
cite: 135.209(b)
title: 135.209(b)
text: '(b)

  Somente é permitido iniciar uma operação VFR em um helicóptero se, considerando as informações
  meteorológicas conhecidas (incluindo o vento), esse helicóptero:

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (1) tiver combustível e óleo lubrificante suficiente para voar até o aeródromo de destino;

  (2) puder voar por um período adicional de 20 minutos, assumindo um consumo normal de combustível
  e óleo lubrificante em velocidade de cruzeiro ótima; e

  (3) tiver uma quantidade adicional de combustível e óleo lubrificante suficiente para compensar
  o aumento do consumo em caso de possíveis contingências.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
