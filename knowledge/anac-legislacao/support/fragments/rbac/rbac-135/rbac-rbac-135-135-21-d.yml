cite: 135.21(d)
title: 135.21(d)
text: (d) O manual geral da empresa não pode contrariar nenhuma legislação ou regulamentação
  federal aplicável, nenhuma regulamentação estrangeira aplicável às operações do detentor
  de certificado em outros países, nem o COA ou especificações operativas do detentor de certificado.
