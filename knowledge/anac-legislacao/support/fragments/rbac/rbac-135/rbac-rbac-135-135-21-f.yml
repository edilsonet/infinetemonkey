section_title: Requisitos do manual geral da empresa
subsection_id: f
cite: 135.21(f)
title: 135.21(f)
text: '(f) Cada pessoa vinculada ao detentor de certificado a quem o manual geral da empresa
  ou partes dele foi distribuído nos termos do parágrafo (e)(1) desta seção deve mantê-lo
  atualizado com as emendas e adições fornecidas a ele. Adicionalmente:

  (1) cada pessoa vinculada ao detentor de certificado trabalhando no solo deve manter sua
  cópia do manual em seu local de trabalho; e

  (2) o detentor de certificado deve manter a bordo de suas aeronaves uma quantidade de manuais
  (ou de partes apropriadas dos mesmos) adequada ao número e funções de tripulantes a bordo.
  A atualização desses manuais é responsabilidade do detentor de certificado.'
