section_title: Requisitos do manual geral da empresa
subsection_id: h
cite: 135.21(h)
title: 135.21(h)
text: (h) Se um detentor de certificado conduzir inspeções ou manutenção de aeronaves em bases
  específicas onde ele mantém partes do manual geral da empresa com o programa de inspeções
  aprovado, ele não precisa transportar essas partes do manual a bordo de aeronaves em rota
  para essas bases.
