title: 135.21(j)
text: '(j) O detentor de certificado deve observar, na elaboração de seu manual geral da empresa,
  os princípios relativos aos fatores humanos, apresentando um manual que seja de fácil compreensão
  e leitura.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
