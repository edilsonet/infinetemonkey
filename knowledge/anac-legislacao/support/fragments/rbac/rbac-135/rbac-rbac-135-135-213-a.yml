section_title: Informações meteorológicas
subsection_id: a
cite: 135.213(a)
title: 135.213(a)
text: (a) Sempre que uma pessoa operando uma aeronave segundo este Regulamento necessitar
  utilizar informações meteorológicas, ela deve utilizar as informações providas pelo órgão
  competente do país sobrevoado ou por provedor reconhecido por esse órgão. No entanto, para
  operações VFR, o piloto em comando pode usar informações baseadas em suas próprias observações
  ou em observações de outros pilotos.
