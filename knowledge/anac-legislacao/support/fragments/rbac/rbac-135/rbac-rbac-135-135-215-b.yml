section_title: 'Voo IFR: limitações operacionais'
subsection_id: b
cite: 135.215(b)
title: 135.215(b)
text: '(b) A ANAC pode emitir especificações operativas para o detentor do certificado que
  lhe permita operar em IFR em rotas fora do espaço aéreo controlado, se:

  (1) o operador demonstrar à ANAC que a tripulação de voo é capaz de navegar, sem referências
  visuais de terreno, em uma rota prevista sem desvios maiores que 5º ou 5 NM, o que for menor,
  dessa rota; e

  (2) a ANAC determinar que a operação proposta pode ser realizada de forma segura.'
