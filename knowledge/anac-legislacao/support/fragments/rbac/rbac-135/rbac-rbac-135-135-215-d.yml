section_title: 'Voo IFR: limitações operacionais'
subsection_id: d
cite: 135.215(d)
title: 135.215(d)
text: '(d) A ANAC emitirá especificações operativas ao operador que lhe permitirão sair de
  um aeródromo que não tenha um procedimento de aproximação padrão por instrumentos aprovado,
  quando a ANAC determinar que seja necessário para realizar uma saída por IFR desse aeródromo
  e que a operação prevista possa ser realizada de forma segura. A aprovação para operar nesse
  aeródromo não inclui uma aprovação para realizar uma aproximação IFR para esse aeródromo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
