section_title: 'IFR: aeródromo de alternativa de decolagem'
subsection_id: b
cite: 135.217(b)
title: 135.217(b)
text: '(b) Para que um aeródromo seja selecionado como de alternativa de decolagem, a informação
  disponível conforme seção 135.213 deste Regulamento deverá indicar que, no horário estimado
  de utilização, as condições meteorológicas estarão iguais ou acima dos mínimos operacionais
  do aeródromo para pouso.

  (Redação dada pela Resolução nº 689, de 25.08.2022)'
