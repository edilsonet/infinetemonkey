title: 135.218(a)
text: '(a) O detentor de certificado deve, para um voo a ser conduzido de acordo com as regras
  de voo por instrumentos (IFR), selecionar pelo menos um aeródromo de alternativa de destino,
  exceto se:

  (1) a duração do voo desde o aeródromo de decolagem até o aeródromo de destino permitir,
  considerando todas as condições meteorológicas e demais informações operacionais relevantes
  para o voo, uma razoável certeza de que, no horário estimado de utilização:'
