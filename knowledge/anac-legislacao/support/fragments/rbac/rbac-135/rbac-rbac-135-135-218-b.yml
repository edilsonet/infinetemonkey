section_title: 'IFR: aeródromo de alternativa de destino'
subsection_id: b
cite: 135.218(b)
title: 135.218(b)
text: '(b) O detentor de certificado deve selecionar pelo menos dois aeródromos de alternativa
  de destino se, para o aeródromo de destino:

  (1) as informações meteorológicas atualizadas indicarem que as condições meteorológicas
  estarão, no horário estimado de utilização, abaixo dos mínimos operacionais para pouso no
  aeródromo; ou

  (2) não houver informação meteorológica disponível que atenda à seção 135.213 deste regulamento.

  (Incluído pela Resolução nº 689, de 25.08.2022)'
