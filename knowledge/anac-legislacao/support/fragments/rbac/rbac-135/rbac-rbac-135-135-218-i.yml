section_title: 'IFR: aeródromo de alternativa de destino'
subsection_id: i
cite: 135.218(i)
title: 135.218(i)
text: '(i) deve ser determinado um ponto de não retorno, definido como o último ponto geográfico
  da rota em que a aeronave tanto pode seguir para o aeródromo de destino quanto para um aeródromo
  de alternativa em rota disponível; e

  (ii) o voo não pode prosseguir além do ponto de não retorno a menos que uma avaliação atualizada
  das informações meteorológicas, condições de tráfego e outras condições operacionais indicar
  que um pouso seguro pode ser feito no horário estimado de utilização do aeródromo de destino.'
