cite: 135.219(a)
title: 135.219(a)
text: '(a) Para um voo a ser conduzido de acordo com as regras de voo por instrumentos (IFR),
  o detentor de certificado deve garantir que:

  (1) com exceção do disposto em 135.218(b), informações meteorológicas atualizadas indicam
  que as condições meteorológicas no aeródromo de destino estarão, no horário estimado de
  utilização, iguais ou acima dos mínimos operacionais para pouso no aeródromo; e

  (2) informações meteorológicas atualizadas indicam que as condições meteorológicas em cada
  aeródromo de alternativa em rota e de alternativa de destino requerido estarão, no horário
  estimado de utilização, iguais ou acima dos respectivos mínimos de planejamento para pouso
  em cada aeródromo.'
