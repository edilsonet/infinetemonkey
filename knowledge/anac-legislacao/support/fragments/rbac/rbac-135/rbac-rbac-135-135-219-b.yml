title: 135.219(b)
text: (b) Mínimos de planejamento para aeródromos de alternativa. Quando requerido pela ANAC,
  o detentor de certificado deve considerar, para efeito de planejamento de voo e atendimento
  a 135.219(a)(2), uma margem adicional apropriada sobre os mínimos operacionais dos aeródromos
  de alternativa em rota ou de alternativa de destino, com objetivo de prover uma margem adequada
  de segurança de que uma aproximação e um pouso poderão ser conduzidos com segurança nesses
  aeródromos.
