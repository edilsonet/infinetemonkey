cite: 135.223(a)
title: 135.223(a)
text: '(a) Somente é permitido operar uma aeronave em voo IFR se houver quantidades de combustível
  e óleo suficientes (considerando informações meteorológicas disponíveis) para completar
  o voo planejado com segurança e para permitir desvios com relação à operação planejada.
  O combustível utilizável deve incluir:

  (1) combustível do táxi, que deve ser a quantidade de combustível que se espera que seja
  consumida antes da decolagem, levando em consideração condições locais no aeródromo de decolagem
  e, caso aplicável, consumo de combustível pela unidade auxiliar de energia (APU);

  (2) combustível para o aeródromo de destino, que deve ser a quantidade de combustível requerida
  desde a decolagem até o pouso no destino;

