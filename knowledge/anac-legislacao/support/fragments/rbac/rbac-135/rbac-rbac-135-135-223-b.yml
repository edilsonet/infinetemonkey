title: 135.223(b)
text: '(b) Ressalvado o previsto no parágrafo (a) desta seção, para operações com aviões,
  a ANAC pode autorizar a utilização dos requisitos de suprimento de combustível da seção
  121.645 do RBAC nº 121, desde que o operador demonstre que níveis de segurança aceitáveis
  serão obtidos.

  (Redação dada pela Resolução nº 689, de 25.08.2022)'
