section_title: Autonomia para voo IFR
subsection_id: i
cite: 135.223(i)
title: 135.223(i)
text: '(i) quando um aeródromo de alternativa de destino é requerido, a quantidade de combustível
  requerida para permitir à aeronave:

  (A) executar uma aproximação perdida no aeródromo de destino;

  (B) subir até a altitude de cruzeiro esperada;

  (C) voar a rota esperada até o aeródromo de alternativa de destino;

  (D) descer até o ponto em que é iniciada a aproximação esperada; e

  (E) executar a aproximação e o pouso no aeródromo de alternativa de destino;

  (ii) quando dois aeródromos de alternativa de destino são requeridos, a quantidade de combustível,
  como calculada em 135.223(a)(3)(i), requerida para permitir à aeronave voar até o aeródromo
  de alternativa de destino que requer a maior quantidade de combustível de alternativa;

  (iii) quando um voo for operado sem um aeródromo de alternativa de destino, conforme o parágrafo
  135.218(a)(1), a quantidade de combustível requerida para permitir à aeronave voar por 15
  minutos a velocidade de espera a 450 m (1500 pés) sobre a elevação do aeródromo de destino
  em condição de atmosfera padrão; e

  (iv) quando o aeródromo de destino for isolado, conforme o parágrafo 135.218(a)(2):

  (A) para aeronaves com motor convencional, a quantidade de combustível requerida para voar
  em nível de cruzeiro por duas horas ou por 45 minutos mais 15% do tempo de voo planejado,
  o que for menor, já incluindo o combustível de reserva final; ou

  (B) para aeronaves com motor a turbina, a quantidade de combustível requerida para voar
  por duas horas, com consumo normal de cruzeiro, sobre o aeródromo de destino, já incluindo
  o combustível de reserva final; e

  (4) combustível de reserva final, que deve ser a quantidade de combustível a seguir, calculada
  usando o peso estimado para a aeronave no momento da chegada ao aeródromo de alternativa
  de destino, ou ao aeródromo de destino quando nenhum aeródromo de alternativa de destino
  for requerido:'
