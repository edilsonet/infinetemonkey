title: 135.225(a)
text: '(a) Exceto como previsto no parágrafo (h) desta seção, um piloto somente pode iniciar
  um procedimento de aproximação por instrumentos para um aeródromo se:

  (1) o aeródromo possuir informações meteorológicas atualizadas que atendam à seção 135.213
  deste regulamento; e

  (2) as informações meteorológicas atualizadas requeridas pelo parágrafo (a)(1) desta seção
  indicarem que as condições atmosféricas estão nos mínimos ou acima dos mínimos operacionais
  para pouso no aeródromo.'
