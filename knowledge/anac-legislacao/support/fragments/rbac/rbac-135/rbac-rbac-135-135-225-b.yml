title: 135.225(b)
text: (b) Exceto como previsto no parágrafo (h) desta seção, um piloto somente pode iniciar
  o segmento final de uma aproximação por instrumentos para um aeródromo se a última informação
  meteorológica indicar que as condições atmosféricas do aeródromo estão nos mínimos ou acima
  dos mínimos previstos no procedimento sendo utilizado.
