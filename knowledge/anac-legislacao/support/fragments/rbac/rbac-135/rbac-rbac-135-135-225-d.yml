title: 135.225(d)
text: (d) Para cada piloto em comando de um avião com motores a turbina que não tenha acumulado
  pelo menos 100 horas de tempo de voo como piloto em comando desse tipo de avião, os valores
  de MDA/H ou DA/DH, conforme aplicável, e de visibilidade estabelecidos nos procedimentos
  de aproximação por instrumentos devem ser acrescidos de 100 pés e 900m (½ milha), respectivamente.
  Este requisito não se aplica a pouso no aeródromo de alternativa.
