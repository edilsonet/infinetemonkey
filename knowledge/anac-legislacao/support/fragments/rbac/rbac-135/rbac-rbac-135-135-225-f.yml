cite: 135.225(f)
title: 135.225(f)
text: (f) Se forem especificados mínimos operacionais para decolagem de um determinado aeródromo,
  um piloto não pode decolar IFR desse aeródromo quando as condições meteorológicas reportadas
  em conformidade com a seção 135.213 estiverem abaixo desses mínimos.
