title: 135.225(g)
text: (g) Se não forem especificados mínimos operacionais para decolagem de um determinado
  aeródromo, um piloto não pode decolar IFR desse aeródromo quando as condições meteorológicas
  reportadas em conformidade com a seção 135.213 estiverem abaixo dos mínimos gerais para
  IFR estabelecidos pelo Estado do Aeródromo.
