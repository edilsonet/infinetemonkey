title: 135.225(h)
text: '(h) Um piloto pode iniciar um procedimento de aproximação por instrumentos ou continuar
  uma aproximação em um aeródromo quando a visibilidade reportada está abaixo dos mínimos
  previstos para o procedimento se o piloto utiliza EFVS em conformidade com autorização específica
  para uso de créditos operacionais mediante o uso de EFVS emitida pela ANAC.

  (Redação dada pela Resolução nº 689, de 25.08.2022)'
