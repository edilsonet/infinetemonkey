section_title: 'Condições de gelo: limitações operacionais'
subsection_id: a
cite: 135.227(a)
title: 135.227(a)
text: (a) Um piloto não pode decolar com uma aeronave que tenha gelo, geada ou neve aderidas
  a qualquer pá de rotor, hélice, para-brisas, asa, estabilizador ou superfície de controle,
  instalação do motor ou a qualquer parte do sistema de velocímetro, altímetro, indicador
  de velocidade vertical ou sistema dos instrumentos de indicação de atitude de voo, exceto
  que decolagens podem ser realizadas com geada sob as asas na área dos tanques de combustível
  se autorizado pela ANAC.
