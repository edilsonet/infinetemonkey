section_title: 'Condições de gelo: limitações operacionais'
subsection_id: d
cite: 135.227(d)
title: 135.227(d)
text: (d) Um piloto somente pode operar um helicóptero em voo IFR em condições conhecidas
  ou previstas de formação de gelo, ou em voo VFR em condições conhecidas de formação de gelo,
  se o helicóptero tiver sido certificado e esteja adequadamente equipado para operação em
  condições de formação de gelo.
