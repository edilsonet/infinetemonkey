section_title: 'Condições de gelo: limitações operacionais'
subsection_id: e
cite: 135.227(e)
title: 135.227(e)
text: (e) Exceto para um avião que possua as provisões de proteção contra gelo previstas no
  parágrafo A135.17(b) do Apêndice A deste Regulamento ou aquelas previstas para aeronaves
  certificadas na categoria transporte, o piloto não pode voar com uma aeronave em condições
  conhecidas ou previstas de formação pesada de gelo.
