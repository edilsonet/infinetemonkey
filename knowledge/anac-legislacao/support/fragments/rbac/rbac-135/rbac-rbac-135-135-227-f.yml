section_title: 'Condições de gelo: limitações operacionais'
subsection_id: f
cite: 135.227(f)
title: 135.227(f)
text: '(f) Se informações confiáveis recebidas pelo piloto em comando indicarem que as previsões
  de formação de gelo não se concretizarão em face de mudanças de tempo ocorridas desde a
  última previsão meteorológica, não se aplicam as restrições dos parágrafos (b), (c) e (d)
  desta seção baseadas em previsões de condições meteorológicas.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
