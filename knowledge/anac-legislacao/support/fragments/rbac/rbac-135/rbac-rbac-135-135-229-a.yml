section_title: Requisitos de aeródromo e de áreas de pouso e decolagem não cadastradas
subsection_id: a
cite: 135.229(a)
title: 135.229(a)
text: (a) O detentor de certificado somente pode usar um aeródromo se ele for registrado ou
  homologado e adequado à operação proposta, considerando itens como dimensões, resistência,
  superfície, obstruções, iluminação, horário de funcionamento, auxílios à aproximação e meios
  de controle de tráfego aéreo.
