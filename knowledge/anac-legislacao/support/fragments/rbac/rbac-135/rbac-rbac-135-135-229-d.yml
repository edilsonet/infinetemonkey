subsection_id: d
cite: 135.229(d)
title: 135.229(d)
text: '(d) Os pousos e decolagens de helicópteros em áreas não cadastradas, ou os pousos e
  decolagens em áreas não cadastradas na água, são autorizados sob certas condições, como
  estabelecido nas seções 91.329 e 91.331 do RBAC nº 91, aplicando-se a seção 135.77 deste
  regulamento quanto às responsabilidades envolvidas.

  (Redação dada pela Resolução nº 546, de 18.03.2020)

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  SUBPARTE E

  REQUISITOS PARA TRIPULANTES DE VOO'
