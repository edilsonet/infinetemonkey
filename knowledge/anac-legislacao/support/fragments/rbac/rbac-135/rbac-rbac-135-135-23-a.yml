section_title: Conteúdo do manual geral da empresa
subsection_id: a
cite: 135.23(a)
title: 135.23(a)
text: '(a) O manual geral da empresa deve ter a data e o número da última revisão em cada
  página revisada. O manual geral da empresa deve incluir:

  (1) nome de cada pessoa de administração requerida pelo RBAC nº 119 que seja autorizada
  a agir em nome do detentor de certificado, os deveres, autoridade e área de responsabilidade
  designada para essa pessoa; o nome e o título de cada pessoa autorizada a exercer controle
  operacional conforme dispõe a seção 135.77;

  (2) procedimentos para assegurar conformidade com as limitações de peso e balanceamento
  das aeronaves e para determinar conformidade com a seção 135.185;

  (3) cópias das especificações operativas do detentor de certificado ou informações apropriadamente
  extraídas, incluindo áreas de operações autorizadas, categoria e classe de aeronaves autorizadas,
  requisitos de composição de tripulação e tipos de operações autorizadas;

  (4) procedimentos para conformidade com os requisitos de notificação de acidentes/incidentes
  nos termos da legislação específica do Sistema de Investigação e Prevenção de Acidentes
  Aeronáuticos (SIPAER);

  (5) procedimentos para assegurar que o piloto em comando saiba que inspeções de aeronavegabilidade
  requeridas foram executadas e que a aeronave foi aprovada para retorno ao serviço em conformidade
  com os requisitos de manutenção aplicáveis;

  (6) procedimentos para informar e registrar irregularidades mecânicas que cheguem ao conhecimento
  do piloto em comando antes, durante e depois do término de um voo;

  (7) procedimentos a serem seguidos pelo piloto em comando para determinar se irregularidades
  mecânicas ou defeitos informados em voos anteriores foram corrigidos ou se essa correção
  foi postergada;

  (8) procedimentos a serem seguidos pelo piloto em comando para obter manutenção, manutenção
  preventiva e serviços de rampa para a aeronave em locais onde não foram feitos arranjos
  prévios pelo operador, quando o piloto é autorizado a agir em nome do operador;

  (9) procedimentos segundo o disposto na seção 135.179 para liberação ou continuação de um
  voo, se um item de equipamento requerido para um particular tipo de operação tornar-se inoperante
  ou inaceitável em rota;

  (10) procedimentos para reabastecer a aeronave, eliminação de contaminantes, proteção contra
  fogo (incluindo proteção eletrostática) e supervisão e proteção dos passageiros durante
  reabastecimentos;

  (11) procedimentos a serem seguidos pelo piloto em comando nas instruções aos passageiros
  previstas na seção 135.117;

  (12) procedimentos de localização de voo;

  (13) procedimentos para assegurar conformidade com os procedimentos de emergência, incluindo
  uma listagem das funções alocadas a cada categoria de tripulante requerido em conexão com
  os deveres em uma emergência ou em uma evacuação de emergência conforme o disposto na seção
  135.123;

  (14) procedimentos para qualificação em rota para pilotos, quando aplicável;

  (15) o programa aprovado de inspeções da aeronave, quando aplicável;

  (16) procedimentos e informações sobre o transporte de artigos perigosos, de acordo com
  a Subparte K, incluindo ações a serem tomadas em caso de emergência;

  (Redação dada pela Resolução nº 608, de 11.02.2021)

  Nota: orientações sobre o desenvolvimento de políticas e procedimentos para lidar com ocorrências
  com artigos perigosos a bordo de aeronaves constam em norma específica da ANAC.

  (Incluído pela Resolução nº 608, de 11.02.2021)

  (17) procedimentos para a evacuação de pessoas que necessitem do auxílio de outra pessoa
  para se movimentar rapidamente em direção a uma saída na ocorrência de uma emergência;

  (18) procedimentos para casos de mal súbito e/ou falecimento a bordo;

  (19) procedimentos para garantir que cada aeronave operada pelo detentor de certificado
  é mantida em condições aeronavegáveis;

  (20) procedimentos para assegurar que o equipamento de emergência e operacional necessário
  para um voo pretendido estão aeronavegáveis;

  (21) procedimentos para garantir que o certificado de aeronavegabilidade de cada aeronave
  do detentor de certificado permaneça válido;

  (22) para operadores aos quais se aplica o parágrafo 135.411(a)(2) deste Regulamento, uma
  descrição dos procedimentos de manutenção e de preenchimento e assinatura da liberação de
  aeronavegabilidade das aeronaves, quando os serviços de manutenção forem realizados por
  uma organização de manutenção certificada pela ANAC ou por outro detentor de certificado,
  conforme previsto no parágrafo 135.437(a) deste Regulamento;

  (Redação dada pela Resolução nº 612, de 09.03.2021)

  (23) uma referência aos programas de manutenção que serão utilizados para cada modelo de
  aeronave operada pelo detentor de certificado;

  (24) a descrição do método para preenchimento e arquivamento dos registros de manutenção
  requeridos pelas seções 135.439 deste Regulamento e 43.11 do RBAC nº 43, ou pelas Seções
  91.417 do RBAC nº 91, e 43.9 do RBAC nº 43, como aplicável;

  (Redação dada pela Resolução nº 612, de 09.03.2021)

  (25) para detentores de certificado que utilizarem aeronaves com certificação de tipo para
  mais de 9 assentos, uma descrição dos procedimentos para monitorar, avaliar e reportar sua
  experiência operacional e de manutenção, como requerido pela seção 135.431 deste Regulamento;

  (26) [reservado]

  (27) um procedimento para aquisição e avaliação das informações de aeronavegabilidade continuada
  aplicáveis, e para a implementação das ações requeridas;

  (28) um procedimento para aquisição e avaliação das diretrizes de aeronavegabilidade e para
  a implementação das ações requeridas;

  (29) para detentores de certificado que utilizarem aeronaves com certificação de tipo para
  mais de 9 assentos, a descrição do estabelecimento e manutenção de um sistema de análise
  para monitorar continuamente a performance e a eficiência do programa de manutenção adotado
  e corrigir qualquer deficiência do referido programa;

  (30) uma descrição dos modelos de aeronaves aos quais o manual se aplica;

  (31) uma descrição da metodologia para assegurar que defeitos diagnosticados são registrados
  e corrigidos;

  (32) procedimentos para informar à ANAC ocorrências significativas em serviço;

  (33) para cada modelo de aeronave com certificação de tipo para mais de 9 assentos ou quando
  determinado pela ANAC, um programa de manutenção concebido nos termos das seções 135.425
  e 135.427 deste Regulamento, o qual deve ser elaborado e submetido à aprovação da ANAC em
  separado;

  (34) procedimentos para determinação dos mínimos de utilização de aeródromo e demais procedimentos
  especiais de tráfego aéreo, em conformidade com norma do Comando da Aeronáutica;

  (35) procedimentos operacionais padronizados (SOP) que proporcionem ao pessoal de operações
  de voo orientações para as operações, em todas as fases de voo, de maneira segura, eficiente,
  lógica e previsível;

  (36) um guia de rota que deve ser utilizado pela tripulação de voo para cada voo;

  (37) instruções sobre aceitação e confirmação de autorizações do controle de tráfego aéreo
  (ATC), particularmente quando dizem respeito à separação com o terreno;

  (38) limitações de certificação e funcionamento da aeronave, de peso de decolagem, de rota
  e de pouso;

  (39) descrição das políticas e procedimentos relativos ao relato rotineiro de condições
  meteorológicas e observações em rota, em subida e em outras fases do voo (AIREP);

  (40) obrigação de informação, por AIREP ESPECIAL das tripulações, quando do encontro de
  fenômenos relacionados a atividades vulcânicas; e

  (41) outras instruções e procedimentos relativos às operações do detentor de certificado,
  a critério deste.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
