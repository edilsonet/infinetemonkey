section_title: 'Tripulação de voo: geral'
subsection_id: a
cite: 135.242(a)
title: 135.242(a)
text: '(a) O detentor de certificado somente pode utilizar uma pessoa como tripulante de voo
  e uma pessoa somente pode exercer as funções de tripulante de voo em uma aeronave operando
  segundo este Regulamento, se essa pessoa:

  (1) possuir uma licença apropriada às funções a serem exercidas, emitida pela ANAC;

  (2) tiver em seu poder a licença requerida pelo parágrafo (a)(1) desta seção e o certificado
  de habilitação técnica, todos válidos e compatíveis com a atividade sendo desenvolvida;

  (3) possuir um CMA válido e compatível com a atividade sendo desenvolvida; e

  (4) for vinculado ao detentor de certificado, com contrato de trabalho de acordo com a legislação
  trabalhista vigente.'
