cite: 135.242(f)
title: 135.242(f)
text: '(f) O detentor de certificado não pode permitir que um tripulante exerça e um tripulante
  não pode exercer duas ou mais funções simultâneas a bordo de uma aeronave, mesmo que esse
  tripulante seja habilitado pela ANAC para o exercício de mais de uma função a bordo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
