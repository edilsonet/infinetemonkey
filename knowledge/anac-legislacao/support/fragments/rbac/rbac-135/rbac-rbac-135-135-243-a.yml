cite: 135.243(a)
title: 135.243(a)
text: '(a) O detentor de certificado somente pode utilizar uma pessoa e uma pessoa somente
  pode trabalhar como piloto em comando em operações transportando passageiros:

  (1) as quais seja utilizado um avião a reação ou um avião possuindo uma configuração para
  passageiros, excluído qualquer assento para tripulante, igual ou superior a 10 assentos,
  ou, ainda, um avião multimotor empregado em operações regulares, se essa pessoa possuir
  uma licença de piloto de linha aérea na categoria avião, habilitação IFR e habilitação classe
  ou tipo, conforme aplicável, todas válidas; ou

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (2) nas quais seja utilizado um helicóptero empregado em operações regulares, se essa pessoa
  possuir uma licença de piloto de linha aérea na categoria helicóptero, habilitação IFR e
  habilitação classe ou tipo, conforme aplicável, todas válidas.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
