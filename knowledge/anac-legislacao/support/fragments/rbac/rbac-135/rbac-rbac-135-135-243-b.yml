cite: 135.243(b)
title: 135.243(b)
text: '(b) Exceto como previsto no parágrafo (a) desta seção, o detentor de certificado somente
  pode utilizar uma pessoa e uma pessoa somente pode trabalhar como piloto em comando de uma
  aeronave operando VFR, se essa pessoa:

  (1) possuir pelo menos uma licença de piloto comercial, na categoria apropriada, com habilitação
  classe ou tipo, conforme aplicável, válida;

  (2) tiver pelo menos 500 horas de voo como piloto, incluindo um mínimo de 100 horas de voo
  em navegação, das quais pelo menos 25 tenham sido voadas à noite; e

  (3) para avião, possuir habilitação IFR para avião ou uma licença de piloto de linha aérea
  com habilitação categoria avião.'
