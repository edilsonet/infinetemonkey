title: 135.243(c)
text: '(c) Exceto como previsto no parágrafo (a) desta seção, o detentor de certificado somente
  pode utilizar uma pessoa e uma pessoa somente pode trabalhar como piloto em comando de uma
  aeronave operando IFR, se essa pessoa:

  (1) possuir pelo menos uma licença de piloto comercial na categoria apropriada, com habilitação
  de classe ou tipo, conforme aplicável, válida;

  (2) tiver pelo menos 1200 horas de voo como piloto, incluindo um mínimo de 500 horas de
  voo em navegação, 100 horas de voo noturno e 75 horas de voo por instrumentos real ou simulado
  das quais pelo menos 50 horas adquiridas em voo real; e:'
