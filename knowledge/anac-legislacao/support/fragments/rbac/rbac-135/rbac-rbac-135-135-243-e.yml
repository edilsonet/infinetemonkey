section_title: Qualificações para piloto em comando
subsection_id: e
cite: 135.243(e)
title: 135.243(e)
text: '(e) Ressalvado o estabelecido no parágrafo (b)(2) desta seção, para aeronaves certificadas
  para operação com um só piloto, se as especificações operativas do detentor de certificado
  não autorizarem a condução de alguma operação regular de transporte aéreo de passageiros,
  autorizando somente operações em condições VMC durante o período diurno, o piloto em comando
  deve ter pelo menos 300 horas de tempo total de voo como piloto, incluindo 50 horas de tempo
  de voo em viagem e 10 horas de tempo de voo noturno.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
