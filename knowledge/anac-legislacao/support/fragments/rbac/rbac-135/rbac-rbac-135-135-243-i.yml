cite: 135.243(i)
title: 135.243(i)
text: '(i) para um avião, possua habilitação IFR para avião ou uma licença de piloto de linha
  aérea com habilitação categoria avião; ou

  (ii) para helicóptero, possua habilitação IFR para helicópteros ou uma licença de piloto
  de linha aérea com habilitação categoria helicóptero.'
