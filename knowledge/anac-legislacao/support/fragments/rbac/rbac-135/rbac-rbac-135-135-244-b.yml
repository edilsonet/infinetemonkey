section_title: 'Experiência operacional: piloto em comando'
subsection_id: b
cite: 135.244(b)
title: 135.244(b)
text: '(b) Na aquisição de experiência operacional, cada pessoa deve atender ao seguinte:

  (1) a experiência operacional deve ser adquirida após concluir com aproveitamento o apropriado
  programa de treinamento de solo e de voo para a aeronave e para a função a ser exercida
  a bordo. Provisões aprovadas para aquisição de experiência operacional devem ser incluídas
  no programa de treinamento do detentor de certificado;

  (2) a experiência deve ser adquirida em voo durante operações regulares transportando passageiros
  conduzidas segundo este Regulamento. No entanto, no caso de aeronave não previamente aprovada
  para utilização pelo detentor de certificado, a experiência operacional adquirida em voos
  de traslado ou em voos de avaliação operacional da aeronave pode ser considerada para os
  propósitos desta seção;

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  (3) cada pessoa deve adquirir experiência operacional desempenhando as funções de piloto
  em comando sob a supervisão de um piloto instrutor qualificado; e

  (4) as horas de experiência operacional podem ser reduzidas, não mais que 50% das horas
  requeridas por esta seção, pela substituição de cada hora de voo por 1 pouso e 1 decolagem.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
