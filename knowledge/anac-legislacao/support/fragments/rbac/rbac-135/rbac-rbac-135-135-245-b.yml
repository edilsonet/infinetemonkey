title: 135.245(b)
text: '(b) O piloto segundo em comando de uma aeronave não necessita possuir habilitação IFR
  se a seção 135.243 não requerer habilitação IFR para o piloto em comando desta aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
