cite: 135.247(a)
title: 135.247(a)
text: (a) Ressalvado o disposto no parágrafo (b) desta seção, o detentor de certificado somente
  pode utilizar uma pessoa e uma pessoa somente pode trabalhar como piloto em comando de uma
  aeronave se essa pessoa cumprir com os requisitos de experiência recente da seção 61.21
  do RBAC nº 61.
