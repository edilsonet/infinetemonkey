text: '(b) O parágrafo 61.21(a)(2) do RBAC nº 61 não se aplica a um piloto no comando de um
  avião com motor a turbina certificado para uma tripulação de mais de um piloto, desde que
  o piloto tenha cumprido os requisitos dos parágrafos (b)(1) ou (2) desta seção.

  (1) Para operar sob esta alternativa, o piloto em comando deve possuir pelo menos uma licença
  de piloto comercial com habilitação no tipo do avião, para cada tipo de avião que for certificado
  para uma tripulação com mais de um piloto, e:'
