section_title: 'Experiência recente: piloto em comando'
subsection_id: c
cite: 135.247(c)
title: 135.247(c)
text: '(c) Um piloto que tenha perdido as prerrogativas de piloto em comando por não atender
  aos requisitos de experiência recente do parágrafo (a) ou (b) desta seção, deve recuperá-las
  atendendo aos requisitos dos referidos parágrafos sob supervisão de um piloto instrutor
  qualificado.

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  SUBPARTE F

  TRIPULAÇÕES: LIMITAÇÕES DE TEMPO DE VOO E REQUISITOS DE DESCANSO'
