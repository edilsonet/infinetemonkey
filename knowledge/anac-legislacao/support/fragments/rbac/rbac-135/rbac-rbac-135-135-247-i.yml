section_title: 'Experiência recente: piloto em comando'
subsection_id: i
cite: 135.247(i)
title: 135.247(i)
text: '(i) o piloto deve ter registrado, no mínimo, 1500 horas de experiência como piloto;

  (ii) para cada avião certificado para uma tripulação com mais de um piloto, o piloto deverá
  ter executado e registrado as decolagens e pousos comprovando experiência recente conforme
  requerido pelo parágrafo 61.21(a)(1) do RBAC nº 61 como piloto exclusivo em comando dos
  controles de voo;

  (iii) o piloto deverá ter executado e registrado dentro dos 90 dias precedentes à operação,
  em um avião certificado para uma tripulação com mais de um piloto, no mínimo 15 horas de
  voo no tipo de avião para o qual o piloto pretende operar; e

  (iv) o piloto deve ter executado e registrado, como piloto exclusivo em comando dos controles
  de voo, no mínimo 3 decolagens e 3 pousos com uma parada completa, em um avião com motor
  a turbina que requer uma tripulação com mais de um piloto. O piloto deve executar as decolagens
  e os pousos no período iniciando 1 hora depois do pôr do sol e terminando 1 horas antes
  do nascer do sol, dentro dos 6 meses precedentes ao mês do voo.

  (2) Para operar sob esta alternativa, o piloto em comando deve possuir pelo menos uma licença
  de piloto comercial com habilitação no tipo do avião, para cada tipo de avião que for certificado
  para uma tripulação com mais de um piloto, e:'
