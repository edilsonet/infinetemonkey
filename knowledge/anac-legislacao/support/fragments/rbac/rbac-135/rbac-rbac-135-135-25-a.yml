cite: 135.25(a)
title: 135.25(a)
text: '(a) Um detentor de certificado somente pode operar uma aeronave segundo este Regulamento
  se essa aeronave:

  (1) for registrada como aeronave civil no Registro Aeronáutico Brasileiro e transporte um
  certificado de aeronavegabilidade apropriado e válido, emitido segundo os RBAC aplicáveis,
  e

  (2) estiver em condições aeronavegáveis e atender aos requisitos aplicáveis de aeronavegabilidade
  dos RBAC, inclusive aqueles relativos à identificação e equipamentos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
