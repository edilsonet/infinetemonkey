section_title: Requisitos das aeronaves
subsection_id: c
cite: 135.25(c)
title: 135.25(c)
text: (c) Para os propósitos do parágrafo (b) desta seção, uma pessoa tem o uso exclusivo
  de uma aeronave se esta pessoa tem a posse total, o controle e o uso dela para voo como
  proprietário, ou tem um contrato escrito (incluindo arranjos para executar manutenção requerida),
  válido quando a aeronave estiver operando, garantindo a essa pessoa a posse, o controle
  e o uso da aeronave por, pelo menos, 6 meses consecutivos.
