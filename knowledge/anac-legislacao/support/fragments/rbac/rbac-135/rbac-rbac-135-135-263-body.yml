text: '135.263 Limitações de tempo de voo e requisitos de descanso

  As limitações de tempo de voo, os requisitos de descanso e as demais normas que regulam
  o exercício da profissão de aeronauta estão contidas na Lei nº 13.475, de 28 de agosto de
  2017, e em sua regulamentação. Para os tripulantes engajados em voos de ligações sistemáticas
  ou em operações regulares, são aplicáveis os artigos da Lei referentes a empresas de transporte
  aéreo regional.

  (Redação dada pela Resolução nº 526, de 06.08.2019)

  SUBPARTE G

  REQUISITOS PARA EXAMES DOS TRIPULANTES'
