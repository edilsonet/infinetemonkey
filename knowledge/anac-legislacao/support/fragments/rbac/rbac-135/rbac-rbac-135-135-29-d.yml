section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: d
cite: 135.29(d)
title: 135.29(d)
text: (d) O detentor de certificado que opera aviões cujo peso máximo de decolagem aprovado
  seja superior a 27000 kg deve estabelecer e manter um programa de acompanhamento e análise
  de dados de voo como parte de seu SGSO. O detentor de certificado pode contratar de terceiros
  a operação de um programa de acompanhamento e análise de dados de voo, porém deve manter
  total responsabilidade pela manutenção desse programa.
