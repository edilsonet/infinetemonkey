cite: 135.291(b)
title: 135.291(b)
text: '(b) permite que pessoal de centros de treinamento de aviação civil (CTAC) certificados
  ou validados segundo o RBAC nº 142, ou de fabricantes de aeronaves classe (segundo os critérios
  do RBAC nº 61), de sua própria fabricação, e que atenda aos requisitos das seções 135.337
  a 135.340, como aplicável, forneça treinamentos e exames sob contrato ou outro convênio
  para as pessoas sujeitas aos requisitos desta Subparte.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
