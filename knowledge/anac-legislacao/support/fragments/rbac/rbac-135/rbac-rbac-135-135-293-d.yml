section_title: Requisitos de exame inicial e periódico para pilotos
subsection_id: d
cite: 135.293(d)
title: 135.293(d)
text: (d) Para os propósitos deste Regulamento, a execução proficiente de um procedimento
  ou manobra pela pessoa a ser utilizada como piloto requer que a pessoa obviamente domine
  a aeronave, sem restar dúvidas quanto à execução bem sucedida de qualquer fase do voo.
