cite: 135.293(g)
title: 135.293(g)
text: '(g) Se o detentor de certificado tiver autorização específica para uso de créditos
  operacionais mediante o uso de EFVS, o exame de proficiência requerido pelo parágrafo (g)
  desta seção deve incluir atividades apropriadas à operação EFVS autorizada.

  (Incluído pela Resolução nº 689, de 25.08.2022)

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
