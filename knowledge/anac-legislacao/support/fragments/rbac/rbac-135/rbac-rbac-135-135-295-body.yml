text: '135.295 Requisitos de exame inicial e periódico para comissários

  O detentor de certificado somente pode utilizar uma pessoa como comissário e uma pessoa
  somente pode trabalhar como comissário em um voo se, dentro dos 12 meses calendáricos precedendo
  esse voo, o detentor de certificado tiver verificado por apropriado exame inicial ou periódico,
  aplicado por servidor designado pela ANAC ou por um comissário examinador credenciado, que
  essa pessoa tem conhecimento e competência nas seguintes áreas, como apropriado para os
  deveres e responsabilidades que lhe serão atribuídos:'
