section_title: 'Piloto em comando: requisitos para exame de proficiência em voo por instrumentos'
subsection_id: a
cite: 135.297(a)
title: 135.297(a)
text: (a) O detentor de certificado somente pode utilizar uma pessoa como piloto em comando
  e uma pessoa somente pode trabalhar como piloto em comando de uma aeronave voando IFR se
  dentro dos 6 meses calendáricos precedendo esse voo o piloto tiver sido aprovado em um exame
  de proficiência em voo por instrumentos, aplicado por um servidor designado pela ANAC ou
  por um piloto examinador credenciado.
