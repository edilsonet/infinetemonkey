section_title: 'Piloto em comando: requisitos para exame de proficiência em voo por instrumentos'
subsection_id: c
cite: 135.297(c)
title: 135.297(c)
text: '(c)

  O exame de proficiência requerido pelo parágrafo (a) desta seção consiste em um exame oral
  ou escrito sobre o equipamento em uso e um exame em voo IFR real ou simulado. O exame sobre
  o equipamento deve incluir questões sobre procedimentos de emergência, operação dos motores,
  sistemas de combustível e de lubrificação, ajustes de potência, velocidades de estol, melhor
  velocidade com motor parado, operação das hélices e do supercompressor, e sistemas hidráulico,
  mecânico e elétrico, como apropriado. O exame em voo deve incluir navegação por instrumentos,
  recuperação de emergências simuladas e aproximações por instrumentos envolvendo as facilidades
  de navegação que o piloto está autorizado a utilizar. Cada piloto executando um exame de
  proficiência deve demonstrar os padrões de proficiência determinados pelo parágrafo 135.293(d).
  Adicionalmente:

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (1) o exame de proficiência em instrumentos deve:'
