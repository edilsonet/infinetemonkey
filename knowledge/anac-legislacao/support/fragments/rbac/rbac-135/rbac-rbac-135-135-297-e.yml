section_title: 'Piloto em comando: requisitos para exame de proficiência em voo por instrumentos'
subsection_id: e
cite: 135.297(e)
title: 135.297(e)
text: (e) Se o piloto em comando for designado para voar mais de um tipo de aeronave, esse
  piloto deve realizar o exame de proficiência requerido pelo parágrafo (a) desta seção em
  cada tipo de aeronave no qual ele voa, rotativamente, mas não mais de um exame em voo durante
  cada período descrito no parágrafo (a) desta seção.
