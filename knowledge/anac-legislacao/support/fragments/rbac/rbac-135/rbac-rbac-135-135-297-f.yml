section_title: 'Piloto em comando: requisitos para exame de proficiência em voo por instrumentos'
subsection_id: f
cite: 135.297(f)
title: 135.297(f)
text: '(f) Se o piloto em comando for designado para pilotar tanto aeronaves monomotoras quanto
  multimotoras, esse piloto deve realizar o primeiro exame de proficiência requerido pelo
  parágrafo (a) desta seção em aeronave multimotora; cada exame seguinte será realizado alternadamente
  em aeronaves monomotoras e multimotoras, mas não mais de um exame em voo durante cada período
  descrito no parágrafo (a) desta seção. Partes do exame em voo requerido podem ser realizadas
  em um FSTD e/ou outro dispositivo de treinamento, se aprovado pela ANAC.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
