section_title: 'Piloto em comando: requisitos para exame de proficiência em voo por instrumentos'
subsection_id: i
cite: 135.297(i)
title: 135.297(i)
text: '(i) para um piloto em comando de um avião mencionado no parágrafo 135.243(a), incluir
  procedimentos e manobras requeridas a um piloto de linha aérea qualificado no particular
  tipo de avião, se apropriado; e

  (ii) para um piloto em comando de um helicóptero ou avião mencionado no parágrafo 135.243(c),
  incluir os procedimentos e manobras requeridas a um piloto comercial com qualificação IFR
  e, se aplicável, qualificado no particular tipo de aeronave; e

  (2) o exame de proficiência em instrumentos deve ser aplicado por um piloto examinador credenciado
  ou por um servidor designado da ANAC.'
