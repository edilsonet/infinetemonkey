section_title: 'Piloto em comando: exames em rota e em aeródromos'
subsection_id: b
cite: 135.299(b)
title: 135.299(b)
text: (b) O servidor designado pela ANAC ou piloto examinador credenciado deve determinar
  se o piloto sendo examinado executa satisfatoriamente as obrigações e responsabilidades
  de um piloto em comando conduzindo operações segundo este Regulamento e deve lançar os resultados
  do exame nos registros do piloto.
