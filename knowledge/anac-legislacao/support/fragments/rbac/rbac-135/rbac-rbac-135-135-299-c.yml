section_title: 'Piloto em comando: exames em rota e em aeródromos'
subsection_id: c
cite: 135.299(c)
title: 135.299(c)
text: '(c) O detentor de certificado deve estabelecer, no manual geral da empresa requerido
  pela seção 135.21 deste Regulamento, os procedimentos que irão assegurar que cada piloto,
  que não tenha voado em uma rota ou para um aeródromo dentro dos 90 dias precedentes, antes
  de decolar familiarize-se com todas as informações requeridas para a condução segura do
  voo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
