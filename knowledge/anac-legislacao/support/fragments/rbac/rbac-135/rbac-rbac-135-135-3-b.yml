subsection_id: b
cite: 135.3(b)
title: 135.3(b)
text: '(b) O detentor de certificado que conduza operações regulares segundo este Regulamento,
  utilizando aviões com configuração para passageiros com mais de 19 assentos, deve atender
  aos requisitos das subpartes N e O do RBAC nº 121 em lugar dos requisitos das subpartes
  E, G e H deste Regulamento.

  (Redação dada pela Resolução nº 526, de 06.08.2019)'
