section_title: Regras especiais aplicáveis a operações sujeitas a este Regulamento
subsection_id: c
cite: 135.3(c)
title: 135.3(c)
text: (c) A pedido do interessado, a ANAC pode autorizar que um detentor de certificado, que
  conduza operações segundo este Regulamento para as quais o parágrafo (b) desta seção não
  se aplica, atenda aos requisitos das seções aplicáveis das subpartes N e O do RBAC nº 121,
  em lugar dos requisitos das subpartes E, G e H deste Regulamento. Esses detentores de certificado
  podem escolher entre atender aos requisitos de experiência operacional da seção 135.244
  deste Regulamento ou da seção 121.434 do RBAC nº 121.
