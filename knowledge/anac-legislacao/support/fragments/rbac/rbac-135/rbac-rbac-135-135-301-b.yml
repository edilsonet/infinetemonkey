section_title: 'Tripulantes: padrões para aceitação de exames'
subsection_id: b
cite: 135.301(b)
title: 135.301(b)
text: '(b) Se um piloto sendo examinado segundo esta Subparte falhar na execução de qualquer
  uma das manobras requeridas, o piloto examinador pode proporcionar adicional treinamento
  no transcorrer da verificação. Além de requerer que se repita a manobra mal sucedida, o
  examinador pode requerer a repetição de qualquer outra manobra que ele considere necessária
  para o julgamento da proficiência do piloto. Se o piloto sendo examinado não puder demonstrar
  desempenho satisfatório para o seu examinador, o detentor de certificado não pode utilizar
  esse piloto, nem esse piloto pode voar como membro da tripulação mínima requerida em operações
  segundo este Regulamento até completar satisfatoriamente um novo exame, o qual far-se-á
  após comprovação de haver recebido nova instrução teórica e/ou prática.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
