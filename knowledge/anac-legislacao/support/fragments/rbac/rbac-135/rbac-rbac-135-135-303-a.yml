section_title: 'Autorização para credenciamento de piloto: requerimento e emissão'
subsection_id: a
cite: 135.303(a)
title: 135.303(a)
text: '(a) O detentor de certificado que desejar a aprovação do credenciamento de um dos seus
  pilotos deve submeter um requerimento junto à ANAC. O piloto a ser credenciado deve ser
  aprovado em exames escritos ou orais e no exame em voo. O documento de credenciamento descreve
  os exames em voo que o piloto está qualificado para aplicar e a categoria, classe ou tipo
  de aeronave, conforme aplicável, em que o piloto credenciado é qualificado.

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  SUBPARTE H

  TREINAMENTO'
