cite: 135.321(a)
title: 135.321(a)
text: '(a) Exceto com previsto na seção 135.3, esta Subparte estabelece os requisitos aplicáveis
  para um detentor de certificado sujeito a este Regulamento:

  (1) que contratar ou de outro modo arranjar para utilizar os serviços de um CTAC certificado
  ou validado segundo o RBAC nº 142, ou de um fabricante de aeronaves classe (segundo critérios
  do RBAC nº 61), de sua própria fabricação, para desempenhar as funções de treinamento e
  exames;

  (2) para estabelecer e manter um programa de treinamento aprovado para as tripulações, examinadores,
  instrutores e pessoal de operações utilizado por este detentor de certificado; e

  (3) para a qualificação, aprovação e uso de FSTD e outros dispositivos de treinamento na
  condução do programa.'
