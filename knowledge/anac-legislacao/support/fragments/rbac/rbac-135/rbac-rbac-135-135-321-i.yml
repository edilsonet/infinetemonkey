cite: 135.321(i)
title: 135.321(i)
text: '(i) para pilotos: exame prático realizado em FSTD aprovado ou em voo não conduzido
  segundo este Regulamento; e

  (ii) para comissários de voo: exame prático realizado em um FSTD ou em aeronave estática;
  e

  (10) qualificado. Significa que o piloto deve estar com as habilitações de categoria e classe,
  tipo e operação apropriadas válidas, ter realizado com aproveitamento o programa de treinamento
  aprovado para as operações aprovadas para o detentor de certificado e ter os requisitos
  de experiência recente atendidos, em uma específica aeronave e função a bordo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
