cite: 135.323(a)
title: 135.323(a)
text: '(a) O detentor de certificado ao qual é requerido possuir um programa de treinamento
  segundo a seção 135.341 deve:

  (1) elaborar, obter as apropriadas aprovação inicial e aprovação final, e executar um programa
  de treinamento de acordo com esta Subparte e com a Subparte K que assegure que cada tripulante,
  instrutor de voo, examinador de voo e que cada pessoa que execute ou supervisione diretamente
  alguma função relacionada ao cumprimento do RBAC nº 175 seja adequadamente treinada para
  o desempenho de suas atribuições;

  (Redação dada pela Resolução nº 608, de 11.02.2021)

  Nota: para mais informações sobre requisitos operacionais relativos a artigos perigosos,
  ver Subparte K.

  (Incluído pela Resolução nº 608, de 11.02.2021)

  (2) obter da ANAC, a aprovação inicial e aprovação final do programa de treinamento, antes
  de sua implementação;

  (3) proporcionar instalações e recursos adequados de treinamento no solo e em voo e instrutores
  de solo apropriadamente qualificados para os treinamentos requeridos por esta Subparte;

  (4) para cada tipo de aeronave utilizada e, se aplicável, para cada particular variante
  de cada tipo, prover e manter atualizado apropriados materiais de treinamento, provas, formulários,
  instruções e procedimentos para uso na condução do treinamento e dos exames requeridos por
  este Regulamento; e

  (5) dispor de número suficiente de instrutores de voo, examinadores de voo e instrutores
  de FSTD para conduzir os referidos treinamentos, exames em voo e cursos de FSTD permitidos
  por esta Subparte.'
