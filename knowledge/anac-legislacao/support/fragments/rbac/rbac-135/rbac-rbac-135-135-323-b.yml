cite: 135.323(b)
title: 135.323(b)
text: '(b) Se um tripulante tiver que completar um treinamento periódico requerido por esta
  Subparte em um determinado mês calendárico e o terminar no mês calendárico anterior ou posterior
  ao mês previsto, a ANAC considerará que o treinamento foi completado no mês em que era devido.

  (1) Um tripulante pode executar suas funções durante o período de carência de 1 mês calendárico
  após o final do mês calendárico em que o treinamento periódico for devido.'
