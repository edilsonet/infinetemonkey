text: (d) Assuntos aplicáveis a mais de uma aeronave ou mais de uma função a bordo que tenham
  sido satisfatoriamente completados durante treinamentos previamente feitos pelo detentor
  de certificado para outra aeronave ou outra função a bordo não precisam ser repetidos durante
  treinamentos subsequentes que não sejam treinamentos periódicos.
