cite: 135.324(a)
title: 135.324(a)
text: (a) Além do detentor de certificado, somente outro detentor de certificado, segundo
  este Regulamento, um CTAC certificado ou validado segundo o RBAC nº 142, ou um fabricante
  de aeronaves classe (segundo critérios do RBAC nº 61), de sua própria fabricação, é elegível
  segundo esta Subparte para prover treinamento e exames, sob contrato ou outra forma de acordo,
  para as pessoas sujeitas aos requisitos desta Subparte.
