cite: 135.324(b)
title: 135.324(b)
text: '(b) Um detentor de certificado somente pode contratar ou utilizar qualquer outra forma
  de acordo para obter o serviço de um CTAC certificado ou validado segundo o RBAC nº 142,
  para prover treinamento e exames requeridos por este Regulamento se esse CTAC:

  (1) possuir especificações de treinamento aplicáveis emitidas segundo o RBAC nº 142;

  (2) tiver instalações, equipamento de treinamento e material didático para o curso atendendo
  aos requisitos aplicáveis do RBAC nº 142;

  (3) tiver currículos, segmentos de currículo e porções de segmentos de currículo aprovados
  e aplicáveis ao uso em cursos de treinamento requeridos por esta Subparte; e

  (4) tiver instrutores suficientes e examinadores qualificados segundo os requisitos aplicáveis
  das seções 135.337 a 135.340 deste Regulamento para prover treinamento e exames para as
  pessoas sujeitas aos requisitos desta Subparte.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
