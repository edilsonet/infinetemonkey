section_title: 'Programa de treinamento e revisões: aprovação inicial e final'
subsection_id: b
cite: 135.325(b)
title: 135.325(b)
text: (b) Se o programa de treinamento ou a revisão proposta atender a esta Subparte, a ANAC
  concederá, por escrito, uma aprovação inicial autorizando o detentor de certificado a conduzir
  o treinamento segundo o programa aprovado. Após uma avaliação da eficiência do programa,
  a ANAC informará ao detentor de certificado das deficiências, se houver, que devem ser corrigidas.
