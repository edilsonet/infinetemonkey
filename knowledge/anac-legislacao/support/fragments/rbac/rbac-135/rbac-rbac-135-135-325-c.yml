section_title: 'Programa de treinamento e revisões: aprovação inicial e final'
subsection_id: c
cite: 135.325(c)
title: 135.325(c)
text: (c) A ANAC concederá a aprovação final do programa ou revisão proposta se o detentor
  de certificado demonstrar que o treinamento, conduzido conforme o programa aprovado segundo
  o parágrafo (b) desta seção, garante que cada pessoa que o completar satisfatoriamente está
  adequadamente treinada para desempenhar suas atribuições.
