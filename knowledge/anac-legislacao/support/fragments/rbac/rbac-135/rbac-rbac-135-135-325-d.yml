section_title: 'Programa de treinamento e revisões: aprovação inicial e final'
subsection_id: d
cite: 135.325(d)
title: 135.325(d)
text: '(d) Sempre que a ANAC considerar que, para manter a adequabilidade de um programa de
  treinamento já com aprovação final são necessárias revisões no programa, o detentor de certificado
  deve, após ser notificado pela ANAC, fazer todas as modificações consideradas necessárias.
  Dentro do prazo de 30 dias após receber a notificação da ANAC, o detentor de certificado
  pode submeter pedido de reconsideração e, nesse caso, a entrada em vigor das modificações
  ficará pendente de decisão final da ANAC. No entanto, se a ANAC considerar que existe uma
  emergência requerendo ação urgente no interesse da segurança, ela pode determinar uma revisão
  com efetividade imediata.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
