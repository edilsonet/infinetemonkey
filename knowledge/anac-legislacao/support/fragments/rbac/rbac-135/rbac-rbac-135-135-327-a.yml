cite: 135.327(a)
title: 135.327(a)
text: (a) O detentor de certificado deve preparar e manter atualizado um currículo escrito
  do programa de treinamento para cada tipo de aeronave e para cada espécie de tripulante
  requerido pelo tipo. O currículo deve incluir os treinamentos de solo e de voo requeridos
  por esta Subparte.
