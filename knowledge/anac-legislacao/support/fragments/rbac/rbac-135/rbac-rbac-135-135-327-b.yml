cite: 135.327(b)
title: 135.327(b)
text: '(b) Cada currículo de programa de treinamento deve conter o seguinte:

  (1) uma lista dos principais assuntos de treinamento de solo, incluindo assuntos de emergências,
  que serão ministrados;

  (2) uma lista de todos os dispositivos de treinamento, “

  mockups

  ”, treinadores de sistemas, treinadores de procedimentos e outros auxílios de instrução
  a serem utilizados no treinamento; e

  (3) descrições detalhadas ou cartazes pictóricos das manobras, funções e procedimentos normais,
  anormais e de emergência que serão executados em cada fase de treinamento e de exames em
  voo, indicando as manobras, funções e procedimentos a serem desempenhados em aeronave, FSTD
  e/ou outro dispositivo de treinamento aprovado pela ANAC durante o treinamento e exames
  de voo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
