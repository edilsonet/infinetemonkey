text: (d) Pode ser incluído o treinamento de elevação de nível previsto nas seções 135.345
  e 135.347, para um particular tipo de aeronave, visando promover tripulantes que foram qualificados
  e trabalham como pilotos segundo em comando no referido tipo de aeronave.
