section_title: Requisitos para treinamento de tripulantes
subsection_id: e
cite: 135.329(e)
title: 135.329(e)
text: '(e) Em adição ao treinamento inicial, de transição, de elevação de nível e periódico,
  cada programa de treinamento deve prover treinamento de solo e de voo, instrução e prática
  necessários a assegurar que cada tripulante:

  (1) permaneça adequadamente treinado e permanentemente proficiente para cada função a bordo,
  tipo de aeronave e espécie de operação em que o tripulante trabalha; e

  (2) qualifique-se em novos equipamentos, facilidades, procedimentos e técnicas, incluindo
  alterações nas aeronaves.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
