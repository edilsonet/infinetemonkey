cite: 135.329(i)
title: 135.329(i)
text: '(i) atribuições e responsabilidades do tripulante, conforme aplicável;

  (ii) as apropriadas provisões deste Regulamento;

  (iii) conteúdo do certificado e das especificações operativas (não aplicável a comissários
  de bordo);

  (iv) apropriadas partes do manual geral da empresa do detentor de certificado;'
