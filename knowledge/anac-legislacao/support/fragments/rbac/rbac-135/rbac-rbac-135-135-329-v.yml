cite: 135.329(v)
title: 135.329(v)
text: '(v) para comissários de bordo, noções básicas sobre aeronaves e teoria do voo;

  (vi) o transporte seguro de artigos perigosos por via aérea, em conformidade com os requisitos
  do RBAC nº 175;

  (vii) o SGSO;

  (viii) segurança da aviação civil (AVSEC); e

  (ix) fatores humanos e CRM.

  (2) o treinamento inicial e de transição no solo previsto nas seções 135.345 e 135.349,
  como aplicável; e

  (3) o treinamento de emergências previsto na seção 135.331.'
