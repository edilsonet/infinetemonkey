section_title: Treinamento em gerenciamento de recursos de equipes (CRM)
subsection_id: b
cite: 135.330(b)
title: 135.330(b)
text: (b) O detentor de certificado somente pode utilizar uma pessoa como membro da tripulação
  de voo se essa pessoa tiver completado o treinamento em gerenciamento de recursos de equipes,
  inicial e, a cada 24 meses, periódico, conforme o programa de treinamento aprovado do detentor
  do certificado.
