section_title: Treinamento em gerenciamento de recursos de equipes (CRM)
subsection_id: d
cite: 135.330(d)
title: 135.330(d)
text: (d) Para conceder os créditos, conforme estabelecido no parágrafo (c) desta seção, a
  ANAC considera os auxílios de instrução, dispositivos de treinamento, métodos e procedimentos
  para abordar os conteúdos de CRM, que tenham sido previamente utilizados pelo detentor de
  certificado e incluídos em seu programa de treinamento requerido pelas seções 135.341, 135.345,
  135.349 ou norma específica da ANAC.
