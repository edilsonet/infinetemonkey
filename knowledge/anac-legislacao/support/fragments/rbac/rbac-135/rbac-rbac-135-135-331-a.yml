section_title: Treinamento de emergências para tripulantes
subsection_id: a
cite: 135.331(a)
title: 135.331(a)
text: (a) Cada programa de treinamento deve prover treinamento de emergências de acordo com
  esta seção, para cada tipo, modelo e configuração de aeronave, cada tripulante e cada espécie
  de operação conduzida, conforme adequado para cada tripulante e para o detentor de certificado.
