section_title: Aprovação de FSTD e outros dispositivos de treinamento
subsection_id: d
cite: 135.335(d)
title: 135.335(d)
text: (d) Na concessão de aprovação inicial e aprovação final de um programa de treinamento
  (ou de suas revisões) a ANAC leva em consideração o FSTD e/ou outro dispositivo de treinamento
  aprovado pela ANAC, e os procedimentos e métodos listados no currículo do detentor de certificado
  requerido pela seção 135.327 deste Regulamento.
