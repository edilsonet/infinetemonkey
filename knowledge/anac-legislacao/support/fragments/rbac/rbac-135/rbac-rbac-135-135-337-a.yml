section_title: 'Qualificações: examinador em aeronave e examinador em FSTD e/ou outro dispositivo
  de treinamento aprovado pela ANAC'
subsection_id: a
cite: 135.337(a)
title: 135.337(a)
text: '(a) Para os propósitos desta seção e da seção 135.339:

  (1)

  examinador em aeronave

  é uma pessoa qualificada para conduzir exames em voo em aeronave, em FSTD e/ou em outro
  dispositivo de treinamento aprovado pela ANAC para um particular tipo de aeronave;

  (2)

  examinador em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC

  é uma pessoa qualificada para conduzir exames em voo, mas somente em um FSTD e/ou em um
  outro dispositivo de treinamento aprovado pela ANAC para um particular tipo de aeronave;
  e

  (3)

  examinador em aeronave

  e

  examinador em

  FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC

  são examinadores que desempenham as funções descritas nas seções 135.321(a) e 135.323(a)(5)
  e (c) deste Regulamento.'
