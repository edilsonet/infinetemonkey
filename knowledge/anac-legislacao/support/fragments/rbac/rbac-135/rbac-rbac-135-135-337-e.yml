subsection_id: e
cite: 135.337(e)
title: 135.337(e)
text: (e) O examinador que não possuir um CMA apropriado pode trabalhar como examinador em
  FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC, mas não pode servir como
  membro de tripulação de voo em operações segundo este Regulamento.
