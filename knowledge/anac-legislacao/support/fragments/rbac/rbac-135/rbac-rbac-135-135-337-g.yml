cite: 135.337(g)
title: 135.337(g)
text: '(g) Os segmentos de voo ou o programa de observação em rota requeridos pelo parágrafo
  (f) desta seção são considerados como tendo sido completados no mês requerido se completados
  no mês calendárico anterior ou posterior ao mês calendárico no qual eles eram devidos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
