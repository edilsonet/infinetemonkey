section_title: 'Qualificações: instrutor de voo em aeronave e instrutor de voo em FSTD e/ou
  outro dispositivo de treinamento aprovado pela ANAC'
subsection_id: b
cite: 135.338(b)
title: 135.338(b)
text: '(b) Um detentor de certificado somente pode utilizar uma pessoa e uma pessoa somente
  pode servir como instrutor de voo em aeronave em um programa de treinamento estabelecido
  segundo esta Subparte se, em relação ao tipo, classe ou categoria da aeronave envolvida,
  esta pessoa:

  (1) possuir a licença e habilitações requeridas para servir como piloto em comando em operações
  segundo este Regulamento;

  (2) tiver completado satisfatoriamente as fases do treinamento para a aeronave que são requeridas
  para atuar como piloto em comando em operações segundo este Regulamento;

  (3) tiver completado satisfatoriamente os exames de proficiência que são requeridos para
  atuar como piloto em comando em operações segundo este Regulamento;

  (4) tiver completado satisfatoriamente os requisitos de treinamento aplicáveis da seção
  135.340 deste Regulamento;

  (5) possuir um CMA válido e adequado para trabalhar como piloto em comando em operações
  segundo este Regulamento;

  (6) tiver satisfeito os requisitos de experiência recente da seção 135.247 deste Regulamento.'
