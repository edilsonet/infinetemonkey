subsection_id: e
cite: 135.338(e)
title: 135.338(e)
text: (e) Uma pessoa que não possua um CMA não pode atuar como instrutor de voo em uma aeronave
  nem pode atuar como membro da tripulação de voo em operações segundo este Regulamento.
