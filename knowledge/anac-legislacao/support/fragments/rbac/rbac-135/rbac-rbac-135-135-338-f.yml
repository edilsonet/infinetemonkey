section_title: 'Qualificações: instrutor de voo em aeronave e instrutor de voo em FSTD e/ou
  outro dispositivo de treinamento aprovado pela ANAC'
subsection_id: f
cite: 135.338(f)
title: 135.338(f)
text: '(f) Um instrutor de voo em FSTD e/ou outro dispositivo de treinamento aprovado pela
  ANAC deve realizar o seguinte:

  (1) voar pelo menos dois segmentos de voo como tripulante requerido para o tipo, classe
  ou categoria da aeronave envolvida dentro do período de 12 meses precedendo a execução de
  qualquer atividade de instrutor de voo em FSTD e/ou outro dispositivo de treinamento aprovado
  pela ANAC; ou

  (2) completar satisfatoriamente um programa aprovado de observação em rota dentro do período
  estabelecido por este programa e que deve preceder a execução de qualquer atividade de instrutor
  de voo em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC.'
