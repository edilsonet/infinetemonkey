section_title: 'Treinamento inicial, de transição e exames: examinador em aeronave e examinador
  em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC'
subsection_id: a
cite: 135.339(a)
title: 135.339(a)
text: '(a) Um detentor de certificado somente pode utilizar uma pessoa e uma pessoa somente
  pode servir como examinador se:

  (1) essa pessoa tiver completado satisfatoriamente o treinamento inicial ou de transição
  para examinador; e

  (2) dentro dos 24 meses calendáricos precedentes, esta pessoa tiver conduzido satisfatoriamente
  um exame de proficiência sob observação de um servidor designado pela ANAC ou de um examinador
  credenciado vinculado ao operador. O exame sob observação pode ser realizado em parte ou
  no todo em aeronave ou em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC.'
