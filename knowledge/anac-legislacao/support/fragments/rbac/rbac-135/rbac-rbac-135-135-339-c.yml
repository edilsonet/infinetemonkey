title: 135.339(c)
text: '(c) O treinamento de solo inicial para um piloto examinador deve incluir o seguinte:

  (1) atribuições, responsabilidades e funções de um piloto examinador;

  (2) as aplicáveis provisões deste Regulamento, dos regulamentos aeronáuticos e das políticas
  e procedimentos do detentor de certificado;

  (3) os apropriados métodos, procedimentos e técnicas para conduzir os exames requeridos;

