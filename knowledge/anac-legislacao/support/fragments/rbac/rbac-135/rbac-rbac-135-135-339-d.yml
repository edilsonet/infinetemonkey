title: 135.339(d)
text: (d) O treinamento de solo de transição para um piloto examinador deve incluir métodos,
  procedimentos e limitações aprovadas para executar os procedimentos requeridos normais,
  anormais e de emergência aplicáveis à aeronave para a qual o piloto examinador está em transição.
