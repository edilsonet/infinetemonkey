section_title: 'Treinamento inicial, de transição e exames: examinador em aeronave e examinador
  em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC'
subsection_id: e
cite: 135.339(e)
title: 135.339(e)
text: '(e) O treinamento de voo inicial e de transição para um examinador em aeronaves deve
  incluir o seguinte:

  (1) as medidas de segurança para situações de emergência que possam ocorrer durante um exame;

  (2) os resultados potenciais de medidas de segurança não tomadas, tomadas fora de tempo
  ou impróprias;

  (3) treinamento e prática na condução de exames em voo a partir dos assentos de pilotagem
  esquerdo e direito, realizando os procedimentos normais, anormais e de emergência requeridos,
  visando assegurar competência na condução de exames em voo de pilotos requeridos por este
  Regulamento; e

  (4) as medidas de segurança a serem tomadas, de qualquer dos dois assentos para piloto,
  para situações de emergência que possam se desenvolver durante o exame.'
