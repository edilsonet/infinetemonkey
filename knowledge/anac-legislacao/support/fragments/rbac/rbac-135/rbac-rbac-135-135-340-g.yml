section_title: 'Treinamento inicial, de transição e exame: instrutor de voo em aeronave e
  instrutor de voo em FSTD e/ou outro dispositivo de treinamento aprovado pela ANAC'
subsection_id: g
cite: 135.340(g)
title: 135.340(g)
text: '(g) O treinamento de voo inicial e de transição para um instrutor de voo em FSTD e/ou
  outro dispositivo de treinamento aprovado pela ANAC deve incluir o seguinte:

  (1) treinamento e prática nos procedimentos normais, anormais e de emergência requeridos
  para garantir competência na condução da instrução de voo requerida por este Regulamento.
  Estas manobras e procedimentos devem ser realizados em parte ou no todo em FSTD e/ou outro
  dispositivo de treinamento aprovado pela ANAC; e

  (2) treinamento na operação do FSTD e/ou outro dispositivo de treinamento aprovado pela
  ANAC, para garantir competência na condução da instrução de voo requerida por este Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
