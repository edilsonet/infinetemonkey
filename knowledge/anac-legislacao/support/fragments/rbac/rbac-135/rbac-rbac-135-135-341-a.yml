section_title: 'Programa de treinamento: pilotos e comissários'
subsection_id: a
cite: 135.341(a)
title: 135.341(a)
text: (a) O detentor de certificado deve estabelecer e manter um programa aprovado de treinamento
  de piloto e o detentor de certificado que utilize comissários deve estabelecer e manter
  um programa de treinamento aprovado de comissário, que sejam apropriados para as operações
  em que cada piloto e cada comissário forem envolvidos. Os programas devem garantir que os
  pilotos e comissários sejam adequadamente treinados para atender aos aplicáveis requisitos
  de conhecimento e de prática requeridos pelas seções 135.293 a 135.301.
