cite: 135.341(b)
title: 135.341(b)
text: '(b) O detentor de certificado, para o qual é requerido um programa de treinamento pelo
  parágrafo (a) desta seção, deve incluir nesse programa currículos de treinamento de solo
  e em voo para:

  (1) treinamento inicial;

  (2) treinamento de transição;

  (3) treinamento de elevação de nível;

  (4) treinamento de diferenças; e

  (5) treinamentos periódicos.'
