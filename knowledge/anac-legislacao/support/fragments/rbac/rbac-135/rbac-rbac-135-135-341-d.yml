section_title: 'Programa de treinamento: pilotos e comissários'
subsection_id: d
cite: 135.341(d)
title: 135.341(d)
text: '(d) O detentor de certificado deve fornecer cópias dos programas de treinamento de
  pilotos e de comissários, assim como de suas modificações e acréscimos, à ANAC. Se o detentor
  de certificado usar instalações de treinamento de outras pessoas, uma cópia dos programas
  de treinamento, ou partes apropriadas dos mesmos, utilizadas nestas instalações, deve também
  ser fornecida. Publicações da ANAC utilizadas nos currículos podem ser apenas referenciadas
  na cópia do programa de treinamento a ser fornecida à ANAC, não havendo necessidade de anexar
  cópias dessas publicações.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
