title: Requisitos de treinamento inicial e periódico para tripulantes
text: '135.343 Requisitos de treinamento inicial e periódico para tripulantes

  Um detentor de certificado somente pode utilizar uma pessoa e uma pessoa somente pode trabalhar
  como tripulante em operação segundo este Regulamento se esse tripulante tiver completado,
  dentro dos 12 meses calendáricos que precedem essa operação, as apropriadas fases do programa
  de treinamento inicial ou periódico estabelecido para o tipo de função que a pessoa vai
  executar.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
