section_title: 'Piloto: treinamento de solo inicial, de transição e de elevação de nível'
subsection_id: a
cite: 135.345(a)
title: 135.345(a)
text: '(a) Assuntos gerais:

  (1) procedimentos do detentor de certificado para liberação e localização de voos;

  (2) princípios e métodos para determinar peso e balanceamento e limitações de pista para
  decolagem e pouso;

  (3) conhecimentos de meteorologia de modo a assegurar conhecimento prático dos fenômenos
  atmosféricos, incluindo princípios de sistemas frontais, gelo, nevoeiro, trovoadas, tesouras
  de vento e, se apropriado, meteorologia de grande altitude;

  (4) sistemas de controle de tráfego aéreo, procedimentos e fraseologia;

  (5) navegação e uso de auxílios à navegação, incluindo procedimentos de aproximação por
  instrumentos;

  (6) procedimentos de comunicações normais e de emergência;

  (7) familiarização com referências visuais antes e durante a descida abaixo da altitude
  de decisão ou da altitude mínima de descida em aproximação por instrumento;

  (8) ETOPS, se aplicável;

  (9) [reservado]; e

  (10) outras instruções necessárias para assegurar a competência do piloto.'
