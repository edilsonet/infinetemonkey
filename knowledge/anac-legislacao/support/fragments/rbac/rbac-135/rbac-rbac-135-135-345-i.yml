section_title: 'Piloto: treinamento de solo inicial, de transição e de elevação de nível'
subsection_id: i
cite: 135.345(i)
title: 135.345(i)
text: '(i) reconhecer e evitar condições atmosféricas severas;

  (ii) livrar-se de condições atmosféricas severas, no caso de elas serem encontradas inadvertidamente,
  incluindo, para aviões, tesouras de vento em baixa altitude;

  (iii) operar dentro ou perto de tempestades (incluindo melhor altitude de penetração), ar
  turbulento (inclusive turbulência de céu claro), gelo, granizo e outras condições meteorológicas
  potencialmente perigosas; e

  (iv) operar aviões durante condições de gelo no solo (ou seja, a qualquer tempo em que as
  condições sejam tais que geada, gelo ou neve podem razoavelmente ser esperadas aderirem
  ao avião), se o detentor de certificado pretende autorizar decolagens em condições de gelo
  no solo, incluindo:

  (A) o uso de tempo de atuação quando usando fluido descongelante / anticongelante;

  (B) procedimentos de degelo/antigelo para o avião, incluindo responsabilidades e procedimentos
  para inspeções e verificações;

  (C) comunicações;

  (D) contaminação da superfície da aeronave (i.e., aderência de geada, gelo ou neve) e identificação
  de área crítica; conhecimento de como a contaminação afeta adversamente o desempenho da
  aeronave e as características de voo;

  (E) tipo e características de fluidos descongelante/anticongelantes, se utilizados pelo
  detentor de certificado;

  (F) procedimentos de inspeções pré-voo para condições de baixas temperaturas; e

  (G) técnicas para reconhecimento de contaminação no avião;

  (7) limitações operacionais;

  (8) controle de cruzeiro e de consumo de combustível;

  (9) planejamento de voo;

  (10) cada procedimento normal e de emergência; e

  (11) manual de voo da aeronave ou equivalente.'
