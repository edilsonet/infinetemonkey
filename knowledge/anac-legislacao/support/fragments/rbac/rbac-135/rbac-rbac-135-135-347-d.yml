section_title: 'Pilotos: treinamento em voo inicial, de transição, de elevação de nível e
  de diferenças'
subsection_id: d
cite: 135.347(d)
title: 135.347(d)
text: '(d) Um detentor de certificado pode optar por um programa de treinamento inicial, de
  transição, de elevação de nível e de diferenças para pilotos, realizado basicamente em FSTD
  e/ou outro dispositivo de treinamento aprovado pela ANAC, desde que:

  (1) o programa atenda ao disposto no parágrafo (a) desta seção e demais dispositivos aplicáveis
  desta Subparte;

  (2) ao término do treinamento, o piloto seja aprovado em exame de voo no FSTD e/ou outro
  dispositivo de treinamento aprovado pela ANAC conduzido por um servidor designado pela ANAC
  ou um piloto examinador credenciado;

  (3) se o treinamento for conduzido em um simulador de voo nível C, após o exame previsto
  no parágrafo (d)(2) desta seção o piloto realize, com um instrutor da aeronave, 5 pousos
  para avião ou 8 pousos para helicóptero. Este parágrafo não se aplica para exames conduzidos
  em simulador de voo nível D; e

  (4) se o treinamento for conduzido em simulador de voo nível B, além do previsto no parágrafo
  (d)(3) desta seção, devem ser realizadas em aeronaves todas as manobras previstas e que
  não possam ser conduzidas no simulador de voo nível B. O exame previsto em 135.293(b) (ou
  135.293(c)) deste Regulamento deve ser complementado em aeronave a fim de englobar as manobras
  especificadas neste parágrafo.'
