cite: 135.347(e)
title: 135.347(e)
text: '(e) Após completar o treinamento em voo e ser submetido ao exame previsto no parágrafo
  135.293(b) deste Regulamento, o piloto receberá o certificado de habilitação técnica no
  tipo do equipamento. Posteriormente, as pessoas designadas para exercer a função de piloto
  em comando devem obter experiência operacional conforme requerido na seção 135.244 deste
  Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
