section_title: 'Treinamento de solo inicial e de transição: comissários'
subsection_id: i
cite: 135.349(i)
title: 135.349(i)
text: '(i) a autoridade do piloto em comando; e

  (ii) orientação e controle dos passageiros, incluindo prestação de assistência adequada
  a passageiros com deficiência e procedimentos a serem seguidos no caso de pessoas desordeiras
  ou pessoas cuja conduta possa prejudicar a segurança; e

  (iii) conscientização sobre os tipos de artigos perigosos que podem ou não ser transportados
  em uma cabine de passageiros;

  (Incluído pela Resolução nº 608, de 11.02.2021)

  Nota 1: os requisitos para treinamento de comissários sobre o transporte de artigos perigosos
  estão incluídos no RBAC nº 175.

  (Incluído pela Resolução nº 608, de 11.02.2021)

  Nota 2: para mais informações sobre requisitos operacionais relativos a artigos perigosos,
  ver Subparte K.

  (Incluído pela Resolução nº 608, de 11.02.2021)

  (2) para cada tipo de aeronave:'
