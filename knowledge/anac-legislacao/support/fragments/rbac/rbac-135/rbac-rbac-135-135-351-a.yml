cite: 135.351(a)
title: 135.351(a)
text: (a) O detentor de certificado deve assegurar-se de que cada tripulante receba treinamento
  periódico, esteja adequadamente treinado e mantenha sua proficiência com respeito ao tipo
  de aeronave. O treinamento periódico deve ser anual.
