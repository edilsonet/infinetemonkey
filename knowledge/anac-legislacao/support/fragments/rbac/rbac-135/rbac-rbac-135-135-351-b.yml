cite: 135.351(b)
title: 135.351(b)
text: '(b) O treinamento de solo periódico para tripulantes deve incluir, pelo menos, o seguinte:

  (1) uma avaliação oral ou escrita para determinar o conhecimento do tripulante sobre a aeronave
  e sobre a função a bordo envolvida; e

  (2) as instruções necessárias sobre os assuntos requeridos para treinamento inicial de solo
  por esta Subparte, como apropriado, incluindo treinamento de tesouras de vento de baixa
  altitude e treinamento em operações no solo durante condições de gelo, como estabelecido
  nas seções 135.341 e 135.345, respectivamente, assim como treinamento de emergências.'
