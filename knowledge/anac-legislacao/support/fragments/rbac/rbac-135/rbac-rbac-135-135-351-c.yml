title: 135.351(c)
text: '(c) O treinamento periódico de voo para pilotos deve incluir pelo menos o treinamento
  em aeronave, em FSTD e/ou em outro dispositivo de treinamento aprovado pela ANAC das manobras
  e procedimentos previstos nesta Subparte, sendo encerrado pela realização satisfatória do
  exame requerido pela seção 135.293 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  SUBPARTE I

  LIMITAÇÕES OPERACIONAIS DE DESEMPENHO DOS AVIÕES

