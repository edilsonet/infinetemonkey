title: 135.361(b)
text: (b) Para os propósitos desta Subparte, “comprimento efetivo da pista” para pouso significa
  a distância entre o ponto no qual o plano de liberação de obstáculos, associado a uma cabeceira
  da pista, intercepta a linha central da pista e o fim da mesma.
