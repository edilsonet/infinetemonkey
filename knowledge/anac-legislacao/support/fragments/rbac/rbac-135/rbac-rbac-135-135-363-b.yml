title: 135.363(b)
text: (b) O detentor de certificado operando um grande avião categoria transporte com motores
  a turbina deve atender às seções 135.379 a 135.387; no entanto, se ele operar um grande
  avião categoria transporte turboélice certificado após 29 de agosto de 1959, mas de tipo
  previamente certificado com o mesmo número de motores convencionais, ele pode atender às
  seções 135.365 a 135.377.
