title: 135.363(c)
text: (c) O detentor de certificado operando um grande avião não incluído na categoria transporte
  deve atender às seções 135.389 a 135.395 e qualquer determinação de conformidade deve ser
  baseada somente em dados de desempenho aprovados. Para os propósitos deste Regulamento,
  um grande avião não incluído na categoria transporte é um avião cujo tipo foi certificado
  antes de 1º de julho de 1942.
