title: 135.363(f)
text: (f) Os dados de desempenho do manual de voo do avião aplicam-se na determinação de conformidade
  com as seções 135.365 a 135.387. Quando as condições forem diferentes daquelas nas quais
  os dados de desempenho foram baseados, a conformidade é determinada por interpolação ou
  por computação dos efeitos da mudança nas variáveis específicas, desde que os resultados
  da interpolação ou computação sejam substancialmente tão precisos quanto os resultados de
  ensaios em voo.
