cite: 135.363(g)
title: 135.363(g)
text: '(g) É vedado decolar com um grande avião categoria transporte com motores convencionais
  com um peso maior de que o peso permissível para a pista sendo utilizada (determinado segundo
  as limitações de pista para decolagem das regras operacionais da categoria transporte desta
  Subparte) após levar em consideração os fatores de correção da temperatura de operação da
  seção 4a.749a-T ou seção 4b.117 do “

  Civil Air Regulations

  ” dos Estados Unidos da América em vigor em 31 de janeiro de 1965 e do manual de voo do
  avião aplicável.'
