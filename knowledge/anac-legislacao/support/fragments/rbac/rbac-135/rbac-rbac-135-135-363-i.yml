title: 135.363(i)
text: (i) A distância de 10 milhas especificada nas seções 135.369 a 135.373 pode ser reduzida
  para 5 milhas, por não mais que 20 milhas, quando operando sob VFR ou quando as facilidades
  de navegação fornecerem identificação confiável e precisa da localização de elevações proeminentes
  e obstruções existentes entre 5 e 10 milhas para cada lado do curso pretendido.
