title: 135.363(k)
text: '(k) Não obstante o previsto nas seções 135.375, 135.377, 135.385, 135.387, 135.393
  e 135.395 deste Regulamento, se autorizado pela ANAC, o comprimento efetivo das pistas previstas
  para o pouso nessas seções pode ser aumentado para até 80%.

  (Incluído pela Resolução nº 606, de 11.02.2021)'
