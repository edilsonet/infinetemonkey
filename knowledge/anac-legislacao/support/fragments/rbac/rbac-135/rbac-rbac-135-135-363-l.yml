title: 135.363(l)
text: '(l) Quando o aeródromo não dispuser de informações meteorológicas que atendam à seção
  135.213 deste regulamento, o detentor de certificado pode solicitar aprovação da ANAC para
  uso de meios alternativos para considerar os parâmetros necessários para cumprimento dos
  requisitos desta subparte.

  (Incluído pela Resolução nº 689, de 25.08.2022)'
