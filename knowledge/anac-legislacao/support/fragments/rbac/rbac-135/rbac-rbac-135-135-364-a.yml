section_title: Limitações dos aviões. Tipo de rota
subsection_id: a
cite: 135.364(a)
title: 135.364(a)
text: (a) Exceto para aviões com configuração exclusivamente cargueira com mais de dois motores,
  um detentor de certificado somente pode operar um avião fora do país, a mais de 180 minutos
  de voo de um aeródromo adequado (em velocidade de cruzeiro com um motor inoperante sob atmosfera
  padrão e ar calmo), conforme definido no Apêndice G deste Regulamento.
