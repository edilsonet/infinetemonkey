title: 135.365(c)
text: (c) É vedado designar ou aceitar a designação, para um grande avião categoria transporte,
  de um aeródromo de alternativa localizado em uma altitude fora da faixa de altitudes na
  qual os pesos máximos de pouso desse avião foram determinados.
