subsection_id: e
cite: 135.365(e)
title: 135.365(e)
text: (e) É vedado pode decolar com um grande avião categoria transporte com motores convencionais,
  se o seu peso estimado na chegada ao aeródromo de destino, considerando consumo normal de
  combustível e óleo em rota, for maior do que o peso máximo de pouso previsto para a altitude
  desse aeródromo.
