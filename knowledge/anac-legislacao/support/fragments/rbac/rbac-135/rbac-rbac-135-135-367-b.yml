section_title: 'Grandes aviões categoria transporte com motores convencionais: limitações
  de decolagem'
subsection_id: b
cite: 135.367(b)
title: 135.367(b)
text: (b) Na aplicação dos requisitos desta seção, devem ser feitas correções para qualquer
  gradiente das pistas a serem utilizadas. Para considerar o efeito do vento, as cartas de
  decolagem para ar calmo podem ser corrigidas considerando não mais que 50% de qualquer componente
  de vento de proa conhecido e não menos que 150% de qualquer componente de vento de cauda
  conhecido.
