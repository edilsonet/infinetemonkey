section_title: 'Grandes aviões categoria transporte com motores convencionais: limitações
  em rota com todos os motores funcionando'
subsection_id: a
cite: 135.369(a)
title: 135.369(a)
text: (a) No caso de um grande avião categoria transporte com motores convencionais, é vedado
  decolar com este avião com um peso, considerando consumo normal de combustível e óleo, que
  não permita uma razão de subida (em pés por minuto), com todos os motores operando, de pelo
  menos 6,90 Vso (que é o número de pés por minutos obtido pela multiplicação do número de
  nós por 6,90) a uma altitude de pelo menos 1000 pés acima da maior elevação ou obstrução
  dentro de 10 milhas para cada lado do curso pretendido.
