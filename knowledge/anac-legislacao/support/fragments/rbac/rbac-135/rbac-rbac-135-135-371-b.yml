section_title: 'Grandes aviões categoria transporte com motores convencionais: limitações
  em rota com um motor inoperante'
subsection_id: b
cite: 135.371(b)
title: 135.371(b)
text: (b) Em lugar dos requisitos do parágrafo (a) desta seção, uma pessoa poderá, segundo
  um procedimento aprovado, operar um grande avião categoria transporte com motores convencionais
  a uma altitude com todos os motores funcionando que permita ao avião, após a falha de um
  motor, continuar para um aeródromo de alternativa onde o pouso possa ser feito segundo a
  seção 135.377 deste Regulamento, considerando consumo normal de combustível e óleo. Após
  ocorrida a falha, a trajetória de voo deve livrar o solo e qualquer obstáculo dentro de
  5 milhas de cada lado do curso pretendido por pelo menos 2.000 pés.
