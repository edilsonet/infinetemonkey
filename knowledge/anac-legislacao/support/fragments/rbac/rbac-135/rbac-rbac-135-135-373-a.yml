section_title: 'Aviões categoria transporte (RBAC nº 25) com quatro ou mais motores convencionais:
  limitações em rota com dois motores inoperantes'
subsection_id: a
cite: 135.373(a)
title: 135.373(a)
text: '(a) Somente é permitido operar um avião certificado segundo o RBAC nº 25 e tendo quatro
  ou mais motores convencionais se:

  (1) não existir qualquer ponto ao longo do curso pretendido que esteja a mais que 90 minutos
  (com todos os motores operando em potência de cruzeiro) de um aeródromo que atenda à seção
  135.377; ou

  (2) ele for operado com um peso que permita que o avião, com os dois motores críticos inoperantes,
  suba a 0,013 Vso

  2

  pés por minuto (isto é, o número de pés por minuto obtido pela multiplicação do número de
  nós ao quadrado por 0,013) a uma altitude de 1000 pés acima da maior elevação ou obstrução
  dentro de 10 milhas para cada lado do curso pretendido, ou a uma altitude de 5000 pés, a
  que for maior.'
