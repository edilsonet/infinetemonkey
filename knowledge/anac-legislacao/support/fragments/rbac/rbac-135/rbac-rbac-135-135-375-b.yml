subsection_id: b
cite: 135.375(b)
title: 135.375(b)
text: (b) Um avião que estaria proibido de decolar por não poder cumprir o parágrafo (a)(2)
  desta seção, poderá decolar se indicar um aeródromo de alternativa onde possa atender todos
  os requisitos desta seção, quando o pouso completo tomar 70% do comprimento efetivo da pista.
