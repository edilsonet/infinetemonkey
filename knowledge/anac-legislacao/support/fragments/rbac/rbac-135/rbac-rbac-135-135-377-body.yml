text: '135.377 Grandes aviões categoria transporte com motores convencionais: limitações de
  pouso no aeródromo de alternativa

  Somente é permitido indicar um aeródromo como aeródromo de alternativa no plano de voo se
  o avião (no peso previsto para o horário estimado de pouso nesse aeródromo e baseado no
  que é assumido em 135.375(a)(1) e (2)) puder realizar um pouso completo utilizando 70% do
  comprimento efetivo da pista do aeródromo.'
