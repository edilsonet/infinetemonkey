section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações de decolagem'
subsection_id: a
cite: 135.379(a)
title: 135.379(a)
text: (a) No caso de um grande avião categoria transporte com motores a turbina, é vedado
  decolar com esse avião com um peso maior do que aquele indicado no manual de voo do avião
  para a altitude do aeródromo e para a temperatura ambiente existente na decolagem.
