section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações em rota
  com um motor inoperante'
subsection_id: b
cite: 135.381(b)
title: 135.381(b)
text: '(b) Para os propósitos do parágrafo (a)(2) desta seção, é assumido que:

  (1) a falha do motor ocorre no ponto mais crítico da rota;

  (2) o avião passa sobre a obstrução crítica, após a falha do motor, em um ponto não mais
  perto da referida obstrução do que o fixo de rádio navegação aprovado mais próximo da mesma,
  exceto se a ANAC autorizar um procedimento diferente baseado em adequadas salvaguardas operacionais;

  (3) um método aprovado é utilizado para considerar ventos adversos;

  (4) alijamento de combustível é permitido se o detentor do certificado demonstrar que as
  tripulações são devidamente instruídas, que o programa de treinamento é adequado e que todas
  as precauções foram tomadas para garantir um procedimento seguro;

  (5)

  o aeródromo de alternativa é selecionado e atende aos mínimos meteorológicos de planejamento
  para pouso, em conformidade com o parágrafo 135.219(b); e

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (6) o consumo de combustível e óleo após a falha do motor é o mesmo consumo previsto nos
  dados da trajetória liquida de voo aprovada no manual de voo do avião.'
