section_title: 'Grandes aviões categoria transporte com motores a turbina: limitações em rota
  com dois motores inoperantes'
subsection_id: a
cite: 135.383(a)
title: 135.383(a)
text: '(a) Aviões de tipo certificado após 26 de agosto de 1957, mas antes de 1º de outubro
  de 1958 (SR 422). Somente é permitido a uma pessoa operar um grande avião categoria transporte
  com motor a turbina ao longo de uma rota pretendida se:

  (1) não existir algum ponto ao longo da rota pretendida que fique a mais de 90 minutos (com
  todos os motores operando em potência de cruzeiro) de um aeródromo que atenda ao previsto
  na seção 135.387 deste Regulamento; ou

  (2) seu peso, de acordo com os dados da trajetória líquida de voo em rota com dois motores
  inoperantes do manual de voo do avião, permitir ao avião voar do ponto onde se assume a
  falha simultânea dos dois motores para um aeródromo que atenda ao previsto na seção 135.387
  deste Regulamento, com uma trajetória líquida de voo (levando em conta as temperaturas esperadas
  ao longo da rota) tendo um gradiente positivo na altitude de pelo menos 1000 pés acima de
  qualquer elevação ou obstrução existente na faixa de 5 milhas terrestres para cada lado
  da trajetória pretendida ou a uma altitude de 5000 pés, o que for maior.

  Nota

  : Para os propósitos do parágrafo (a)(2) desta seção, é assumido que os dois motores falham
  no ponto mais crítico da rota e que, se alijamento de combustível é provido, o peso do avião
  no ponto onde ocorre a falha dos motores inclui combustível suficiente para voar até o aeródromo
  e chegar a uma altura de pelo menos 1000 pés de altura na vertical do mesmo e que este combustível
  e óleo consumido após a falha dos motores é o mesmo consumo previsto nos dados de trajetória
  líquida de voo do manual de voo do avião.'
