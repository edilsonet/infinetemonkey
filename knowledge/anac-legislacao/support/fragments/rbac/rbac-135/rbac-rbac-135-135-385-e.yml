subsection_id: e
cite: 135.385(e)
title: 135.385(e)
text: '(e) Somente é permitido decolar com um avião a reação quando as informações meteorológicas
  indicarem que a pista do aeródromo de destino poderá estar contaminada na hora estimada
  de chegada se a distância de pouso disponível (LDA) for pelo menos igual ao maior dos seguintes
  valores:

  (Redação dada pela Resolução nº 689, de 25.08.2022)

  (1) a distância determinada de acordo com o parágrafo (d) desta seção; ou

  (2) 115% da distância determinada de acordo com os dados aprovados de distância de pouso
  com a pista contaminada, ou seu equivalente, aceitos pela ANAC.'
