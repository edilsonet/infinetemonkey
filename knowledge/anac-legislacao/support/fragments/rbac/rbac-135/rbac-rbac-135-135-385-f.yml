subsection_id: f
cite: 135.385(f)
title: 135.385(f)
text: (f) Em uma pista contaminada especialmente preparada, é permitido utilizar uma distância
  de pouso mais curta do que a exigida no parágrafo (e) desta seção, mas não inferior à exigida
  no parágrafo (b) desta seção, se o manual de voo do avião possuir informações adicionais
  específicas sobre distâncias de pouso em pistas contaminadas.
