text: (g) Um avião a reação, que estaria proibido de decolar por não cumprir o parágrafo (b)(2)
  desta seção, poderá decolar se for indicado um aeródromo de alternativa onde possa atender
  todos os requisitos do parágrafo (b) desta seção.
