section_title: 'Grandes aviões não incluídos na categoria transporte: limitações em rota com
  um motor inoperante'
subsection_id: a
cite: 135.391(a)
title: 135.391(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, no caso de um grande avião não
  incluído na categoria transporte, é vedado decolar este avião com um peso que não permita
  uma razão de subida de pelo menos 50 pés por minuto, com o motor critico inoperante, a altitude
  de no mínimo 1000 pés acima da mais alta obstrução dentro da faixa de 5 milhas para cada
  lado da trajetória pretendida, ou 5000 pés, o que for maior.
