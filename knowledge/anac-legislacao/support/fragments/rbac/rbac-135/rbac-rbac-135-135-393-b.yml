section_title: 'Grandes aviões não incluídos na categoria transporte: limitações de pouso
  no aeródromo de destino'
subsection_id: b
cite: 135.393(b)
title: 135.393(b)
text: '(b) Para o propósito desta seção, é assumido que:

  (1) o avião passa diretamente sobre a interseção do plano de liberação de obstáculos e a
  pista a uma altura de 50 pés, em uma rampa de aproximação estável e a uma velocidade verdadeira
  indicada de pelo menos 1,3 Vso;

  (2) o pouso não requer excepcional habilidade do piloto; e

  (3) o avião está operando em atmosfera padrão.'
