text: '135.395 Grandes aviões não incluídos na categoria transporte: limitações de pouso no
  aeródromo de alternativa

  Somente é permitido selecionar um aeródromo como aeródromo de alternativa para um grande
  avião não incluído na categoria transporte se o avião (com o peso estimado para o momento
  da chegada), baseado no que foi assumido no parágrafo 135.393(b) deste Regulamento, puder
  ser trazido a um pouso com parada total dentro de 70% do efetivo comprimento da pista.'
