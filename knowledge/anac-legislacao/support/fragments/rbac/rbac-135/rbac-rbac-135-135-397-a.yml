section_title: 'Pequenos aviões categoria transporte: limitações operacionais de desempenho'
subsection_id: a
cite: 135.397(a)
title: 135.397(a)
text: (a) Somente é permitido a uma pessoa operar um pequeno avião categoria transporte com
  motor convencional se essa pessoa cumprir as limitações de peso da seção 135.365, as limitações
  de decolagem da seção 135.367 (exceto o parágrafo (a)(3)) e as limitações de pouso das seções
  135.375 e 135.377 deste Regulamento.
