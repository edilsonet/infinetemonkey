section_title: 'Pequenos aviões categoria transporte: limitações operacionais de desempenho'
subsection_id: b
cite: 135.397(b)
title: 135.397(b)
text: (b) Somente é permitido a uma pessoa operar um pequeno avião categoria transporte com
  motor a turbina se essa pessoa cumprir as limitações de decolagem da seção 135.379 (exceto
  parágrafos (d) e (f)) e as limitações de pouso das seções 135.385 e 135.387 deste Regulamento.
