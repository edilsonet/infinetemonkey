section_title: 'Limitações operacionais de desempenho: aviões categoria transporte regional'
subsection_id: b
cite: 135.398(b)
title: 135.398(b)
text: (b) É vedado decolar com um avião categoria transporte regional com um peso maior do
  que aquele previsto no manual de voo do avião para permitir uma trajetória líquida de decolagem,
  livrando todos os obstáculos por uma distância vertical de pelo menos 35 pés ou por uma
  distância horizontal de pelo menos 200 pés enquanto dentro dos limites do aeródromo e por
  uma distância horizontal de pelo menos 300 pés após passar esses limites.
