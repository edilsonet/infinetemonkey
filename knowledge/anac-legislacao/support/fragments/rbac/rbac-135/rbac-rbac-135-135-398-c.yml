section_title: 'Limitações operacionais de desempenho: aviões categoria transporte regional'
subsection_id: c
cite: 135.398(c)
title: 135.398(c)
text: (c) Somente é permitido a uma pessoa operar um avião categoria transporte regional se
  essa pessoa cumprir as limitações de pouso estabelecidas nas seções 135.385 e 135.387 deste
  Regulamento. Para os propósitos deste parágrafo, as seções 135.385 e 135.387 são aplicáveis
  a todos os aviões categoria transporte regional, apesar de sua aplicabilidade ser estabelecida
  para aviões categoria transporte, com motores a turbina.
