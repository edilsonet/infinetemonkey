title: 135.398(d)
text: (d) Na determinação de pesos máximos, distâncias mínimas e trajetórias de voo conforme
  os parágrafos (a) até (c) desta seção, devem ser feitas as correções para a pista a ser
  utilizada considerando a elevação do aeródromo, o gradiente efetivo da pista, a temperatura
  ambiente e os componentes de vento no momento da decolagem.
