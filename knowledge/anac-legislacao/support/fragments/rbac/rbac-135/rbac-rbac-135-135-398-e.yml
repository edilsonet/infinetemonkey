section_title: 'Limitações operacionais de desempenho: aviões categoria transporte regional'
subsection_id: e
cite: 135.398(e)
title: 135.398(e)
text: (e) Para os propósitos desta seção, é assumido que o avião não é inclinado até atingir
  a altura de 50 pés, como mostrado nos dados da trajetória líquida de decolagem do manual
  de voo do avião e, em seguida, a inclinação máxima não pode ultrapassar 15°.
