section_title: 'Pequenos aviões não incluídos na categoria transporte: limitações operacionais
  de desempenho'
subsection_id: a
cite: 135.399(a)
title: 135.399(a)
text: (a) Somente é permitido a uma pessoa operar um pequeno avião com motores convencionais
  ou turboélice, cujo tipo tenha sido certificado segundo os parágrafos 135.169(b)(2), (3),
  (4), (5) ou (6) deste Regulamento, se essa pessoa cumprir as limitações de peso de decolagem
  constantes do manual de voo do avião ou equivalente, em todas as operações conduzidas segundo
  este Regulamento. Adicionalmente, se o tipo do avião tiver sido certificado de acordo com
  os parágrafos 135.169(b)(4) ou (5) deste Regulamento, essa pessoa deve cumprir as limitações
  de peso de pouso constantes do manual de voo do avião ou equivalente quando conduzindo operações
  segundo este Regulamento.
