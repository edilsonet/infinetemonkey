section_title: 'Pequenos aviões não incluídos na categoria transporte: limitações operacionais
  de desempenho'
subsection_id: b
cite: 135.399(b)
title: 135.399(b)
text: '(b) Somente é permitido a uma pessoa operar um avião cujo tipo tenha sido certificado
  de acordo com o parágrafo 135.169(b)(6) deste Regulamento, se essa pessoa cumprir as limitações
  de peso de pouso estabelecidas pelas seções 135.385 e 135.387 deste Regulamento. Para os
  propósitos deste parágrafo, as seções 135.385 e 135.387 são aplicáveis a pequenos aviões
  com motores convencionais ou turboélice, apesar de sua aplicabilidade ser estabelecida para
  grandes aviões categoria transporte com motores a turbina.

  SUBPARTE J

  MANUTENÇÃO, MANUTENÇÃO PREVENTIVA E ALTERAÇÕES

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
