text: '135.41 Transporte de substâncias ou medicamentos sujeitos a controle especial

  Se o detentor do certificado permitir que uma aeronave de sua propriedade ou por ele arrendada
  seja engajada em qualquer operação que o detentor de certificado saiba estar violando as
  normas da seção 91.19 do RBAC nº 91, essa operação é base para a suspensão ou cassação de
  seu certificado.

  (Redação dada pela Resolução nº 612, de 09.03.2021)

  SUBPARTE B

  OPERAÇÕES DE VOO'
