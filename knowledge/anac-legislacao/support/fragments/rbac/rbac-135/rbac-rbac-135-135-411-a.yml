cite: 135.411(a)
title: 135.411(a)
text: '(a) Esta Subparte estabelece regras adicionais àquelas contidas em outros regulamentos
  sobre manutenção, manutenção preventiva e alterações, aplicáveis aos detentores de certificado,
  como se segue:

  (1) aeronaves cujo tipo foi certificado com uma configuração para passageiros, excluindo
  qualquer assento de piloto, com 9 assentos ou menos, devem ser mantidas segundo o RBAC nº
  43 e o RBAC nº 91, e de acordo com as seções 135.413 (exceto parágrafo 135.413(b)), 135.415,
  135.417, 135.421, 135.423 (exceto parágrafos 135.423(b) e 135.423(c)), 135.433, 135.435
  e 135.437 deste Regulamento. Pode ser utilizado um programa de inspeções aprovado de acordo
  com a seção 135.419 deste Regulamento; e

  (Redação dada pela Resolução nº 612, de 09.03.2021)

  (2) aeronaves cujo tipo foi certificado com uma configuração para passageiros, excluindo
  qualquer assento de pilotos, com 10 assentos ou mais, devem ser mantidas conforme um programa
  de manutenção de acordo com as seções 135.413, 135.415, 135.417 e 135.423 a 135.443 deste
  Regulamento.

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
