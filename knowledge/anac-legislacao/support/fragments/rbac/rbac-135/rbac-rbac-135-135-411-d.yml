title: 135.411(d)
text: '(d) O detentor de um certificado que decide operar em conformidade com a seção 135.364
  deve manter suas aeronaves segundo os requisitos do parágrafo (a)(2) desta seção e os requisitos
  adicionais do Apêndice G deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
