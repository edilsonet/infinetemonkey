text: '135.412 Instalações, recursos, equipamentos, ferramentas, materiais e dados técnicos
  para manutenção, manutenção preventiva e alteração

  Até 26 de fevereiro de 2022, o conjunto de recursos e instalações para manutenção, manutenção
  preventiva e alterações possuído e/ou contratado pelo detentor de certificado não pode ser
  inferior ao conjunto de instalações e recursos para manutenção, manutenção preventiva e
  alterações requerido pelo RBAC nº 145, para certificar uma oficina aeronáutica aprovada
  para realizar manutenção, manutenção preventiva e alterações nos mesmos tipos de equipamentos
  operados pelo detentor de certificado. O escopo desta seção inclui o sistema de inspeção
  associado do detentor de certificado, onde aplicável, que não pode ser inferior ao requerido
  pelo RBAC nº 145.

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
