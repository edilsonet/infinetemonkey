section_title: Responsabilidade pela aeronavegabilidade
subsection_id: a
cite: 135.413(a)
title: 135.413(a)
text: (a) O detentor de certificado é primariamente responsável pela aeronavegabilidade de
  suas aeronaves, incluindo células, motores, hélices, rotores, equipamentos e partes, deve
  manter suas aeronaves de acordo com este Regulamento e deve reparar os defeitos ocorridos
  entre as manutenções requeridas pelo RBAC nº 43.
