cite: 135.413(b)
title: 135.413(b)
text: '(b) O detentor de certificado que mantenha suas aeronaves de acordo com o parágrafo
  135.411(a)(2) deve:

  (1) executar a manutenção, a manutenção preventiva e as alterações de suas aeronaves, incluindo
  células, motores, hélices, rotores, equipamentos normais e de emergência e partes, segundo
  o seu manual e este Regulamento; ou

  (2) fazer contrato com outra pessoa para execução de manutenção, manutenção preventiva e
  alterações. No entanto, o detentor de certificado deve assegurar-se que qualquer trabalho
  executado pela outra pessoa seja executado de acordo com o seu manual e com este Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
