title: 135.415(c)
text: '(c) Adicionalmente aos relatórios requeridos pelo parágrafo (a) desta seção, o detentor
  de certificado deve relatar qualquer outra falha, mau funcionamento ou defeito em uma aeronave
  que ocorra ou seja detectada a qualquer momento, se, em sua opinião, essa falha, mau funcionamento
  ou defeito afetou ou poderá afetar a segurança da operação da aeronave.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
