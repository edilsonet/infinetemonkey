cite: 135.415(d)
title: 135.415(d)
text: '(d) O detentor de certificado deve apresentar cada relatório requerido por esta seção,
  cobrindo o período de 24 horas com início às 9 horas local de cada dia até as 9 horas local
  do dia seguinte, para um ponto central de coleta determinado pela ANAC. Cada relatório de
  ocorrências cobrindo um período de 24 horas deve ser apresentado à ANAC dentro das 96 horas
  seguintes ao período relatado, descontadas as horas de dias não úteis. Uma cópia desse relatório
  deve ser apresentada ao detentor do projeto de tipo dentro do mesmo prazo.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
