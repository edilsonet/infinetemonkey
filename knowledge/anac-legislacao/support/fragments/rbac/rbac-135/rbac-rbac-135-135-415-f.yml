cite: 135.415(f)
title: 135.415(f)
text: (f) Um detentor de certificado que é também detentor de certificado de tipo de aeronave
  (inclusive certificado suplementar de tipo) ou de atestado de produto aeronáutico aprovado
  não necessita enviar os relatórios requeridos por esta seção, caso tenha enviado os relatórios
  previstos pela seção 21.3 do RBAC nº 21.
