text: (h) Quando o detentor de certificado obtiver informações adicionais incluindo informações
  do fabricante ou outra agência, com relação a um relatório requerido por esta seção, ele
  deve rapidamente enviá-las como um suplemento ao relatório original e referenciar a data
  de apresentação do primeiro relatório.
