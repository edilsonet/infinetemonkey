section_title: Programa aprovado de inspeções nas aeronaves
subsection_id: a
cite: 135.419(a)
title: 135.419(a)
text: '(a) Sempre que a ANAC considerar que as inspeções de aeronaves requeridas ou permitidas
  pelo RBAC nº 91 não são adequadas para os fins deste Regulamento, ela poderá modificar as
  especificações operativas do detentor de certificado, de acordo com a seção 119.51 do RBAC
  nº 119, requerendo ou permitindo o estabelecimento de um programa de inspeções para qualquer
  tipo e modelo de aeronave da qual o detentor de certificado tenha uso exclusivo de pelo
  menos uma aeronave, como definido no parágrafo 135.25(b).

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
