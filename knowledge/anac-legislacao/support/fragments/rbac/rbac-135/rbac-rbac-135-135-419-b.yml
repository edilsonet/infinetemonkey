cite: 135.419(b)
title: 135.419(b)
text: (b) Um detentor de certificado que solicitar modificação de suas especificações operativas,
  para incluir um programa aprovado de inspeções para suas aeronaves, deve anexar esse programa
  ao requerimento submetido à aprovação da ANAC.
