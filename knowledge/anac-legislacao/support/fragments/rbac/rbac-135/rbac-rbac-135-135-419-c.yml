cite: 135.419(c)
title: 135.419(c)
text: (c) O detentor de certificado do qual seja requerido o uso de um programa de inspeções
  aprovado para suas aeronaves deve submeter o programa à aprovação da ANAC, dentro de 30
  dias após ser informado a respeito, exceto se a ANAC determinar outro prazo.
