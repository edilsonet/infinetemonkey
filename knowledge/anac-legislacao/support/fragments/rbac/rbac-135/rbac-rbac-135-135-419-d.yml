section_title: Programa aprovado de inspeções nas aeronaves
subsection_id: d
cite: 135.419(d)
title: 135.419(d)
text: '(d) O programa de inspeções de aeronaves submetido à aprovação da ANAC deve conter
  o seguinte:

  (1) instruções e procedimentos para conduzir as inspeções nas aeronaves (que devem incluir
  os testes e verificações necessárias), definindo em detalhe as partes e áreas da célula,
  motores, hélices, rotores e componentes, incluindo equipamentos de emergência, que devem
  ser inspecionadas;

  (2) um programa para a execução das inspeções requeridas pelo parágrafo (d)(1) desta seção,
  expresso em termos de tempo de funcionamento, tempo calendárico, número de operações do
  sistema ou qualquer combinação dos mesmos itens; e

  (3) instruções e procedimentos para registro de discrepâncias encontradas durante as inspeções
  e de ações corretivas ou prorrogação da correção dessas discrepâncias, incluindo a forma
  e a distribuição desses registros.'
