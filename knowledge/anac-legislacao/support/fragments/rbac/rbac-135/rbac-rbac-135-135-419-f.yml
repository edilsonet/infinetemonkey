cite: 135.419(f)
title: 135.419(f)
text: (f) Sempre que a ANAC julgar que são necessárias revisões em um programa de inspeções
  aprovado, visando adequá-lo a novas circunstâncias, o detentor do certificado será notificado
  por escrito, devendo efetuar as modificações determinadas. No entanto, o detentor do certificado
  tem o direito de requerer reconsideração à ANAC, tendo 30 dias, após receber a notificação
  de revisão, para fazê-lo. Exceto no caso de uma emergência requerendo ação imediata no interesse
  da segurança, a apresentação de requerimento de reconsideração suspende a efetividade da
  notificação de revisão até a decisão final da ANAC.
