title: 135.421(b)
text: (b) Para o propósito desta seção, um programa de manutenção do fabricante é aquele contido
  no manual de manutenção ou nas instruções de manutenção especificadas pelo fabricante, como
  requerido pelos RBAC, para a aeronave, motores, hélices, rotores, componentes e equipamentos
  de emergência.
