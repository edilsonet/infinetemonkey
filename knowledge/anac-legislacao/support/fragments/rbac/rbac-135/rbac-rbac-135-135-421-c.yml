cite: 135.421(c)
title: 135.421(c)
text: '(c) Para cada avião monomotor a ser utilizado no transporte de passageiros em operações
  IFR, o detentor de certificado deve incorporar no seu programa de manutenção o seguinte:

  (1) o programa de monitoramento de tendências do motor recomendado pelo fabricante, que
  inclua uma análise do óleo, se apropriado; ou

  (2) um programa de monitoramento de tendências do motor aprovado pela ANAC que inclua uma
  análise de óleo a cada intervalo de 100 horas ou de acordo com intervalo recomendado pelo
  fabricante, o que for o mais frequente.'
