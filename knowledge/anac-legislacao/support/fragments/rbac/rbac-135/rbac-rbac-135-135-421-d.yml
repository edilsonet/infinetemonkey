title: 135.421(d)
text: (d) Para avião monomotor utilizado em operações IFR transportando passageiros, são requeridas
  instruções de manutenção escritas contendo os métodos, técnicas e práticas necessárias para
  manter os equipamentos especificados na seção 135.105 e nos parágrafos (a)(6) e (a)(8) da
  seção 135.163.
