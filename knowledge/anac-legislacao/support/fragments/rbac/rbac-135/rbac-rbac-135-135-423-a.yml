cite: 135.423(a)
title: 135.423(a)
text: (a) O detentor de certificado que execute qualquer manutenção (exceto inspeções obrigatórias),
  manutenção preventiva e alterações e cada pessoa com que ela tenha contrato para executar
  esses trabalhos deve possuir uma organização adequada à execução dos mesmos.
