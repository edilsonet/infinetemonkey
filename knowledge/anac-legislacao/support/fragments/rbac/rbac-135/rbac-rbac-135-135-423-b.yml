cite: 135.423(b)
title: 135.423(b)
text: (b) O detentor de certificado, que execute qualquer inspeção requerida por seu manual
  segundo o disposto nos parágrafos 135.427(b)(2) ou (3) (nesta Subparte chamada de “inspeções
  obrigatórias”), e cada pessoa com que ela tenha contrato para executar esses trabalhos deve
  possuir uma organização adequada à execução dos mesmos.
