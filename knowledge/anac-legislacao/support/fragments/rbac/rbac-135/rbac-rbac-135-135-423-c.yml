cite: 135.423(c)
title: 135.423(c)
text: '(c) Cada pessoa, executando inspeções obrigatórias além de outros serviços de manutenção,
  manutenção preventiva e alterações, deve organizar a execução dessas tarefas de modo a separar
  as atividades de inspeções obrigatórias das demais atividades. A separação deve ser feita
  imediatamente abaixo do nível de controle administrativo com responsabilidade geral pelas
  atividades de inspeção e manutenção.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
