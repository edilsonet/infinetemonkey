text: '135.425 Programas de manutenção, manutenção preventiva e alterações

  O detentor de certificado deve elaborar e submeter à aprovação da ANAC um programa de inspeções
  e um programa cobrindo outras atividades de manutenção, manutenção preventiva e alterações,
  concebido com base nas informações de aeronavegabilidade disponibilizadas pela ANAC, pela
  organização detentora do projeto de tipo, pelos países dessas organizações e na experiência
  do operador. Estes programas são estabelecidos para assegurar que:'
