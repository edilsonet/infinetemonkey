title: 135.427(a)
text: (a) O detentor de certificado deve colocar em seu manual a descrição da sua organização
  requerida pela seção 135.423 e a lista de pessoas com quem ele possua contrato para executar
  qualquer de suas inspeções obrigatórias e outros serviços de manutenção, manutenção preventiva,
  reconstrução e alteração, incluindo uma descrição geral desses serviços.
