cite: 135.427(c)
title: 135.427(c)
text: '(c) O detentor de certificado deve colocar em seu manual um sistema conveniente (que
  pode incluir codificação) que garanta a recuperação das seguintes informações:

  (1) descrição (ou referência a dados aceitáveis pela ANAC) de cada trabalho executado;

  (2) o nome da pessoa que executou o trabalho, se esse trabalho tiver sido executado por
  pessoa não pertencente à organização do detentor; e

  (3) o nome ou outra identificação da pessoa que aprovou o trabalho.'
