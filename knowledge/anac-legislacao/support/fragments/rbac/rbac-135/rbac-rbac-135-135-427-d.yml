title: 135.427(d)
text: '(d) Para os propósitos deste Regulamento, o detentor de certificado deverá preparar
  esta parte do seu manual contendo informações e instruções de manutenção, no todo ou em
  parte, em forma impressa ou em outras formas aceitáveis pela ANAC, que sejam recuperáveis
  em língua portuguesa ou inglesa. Neste último caso, ele deve demonstrar que seu pessoal
  de manutenção é capaz de ler e compreender essa língua.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
