cite: 135.431(a)
title: 135.431(a)
text: '(a) O detentor de certificado deve estabelecer e manter um sistema continuado de análise
  e supervisão da execução e da eficiência de seu programa de inspeções e de seus programas
  de manutenção, manutenção preventiva e alterações, objetivando corrigir eventuais deficiências
  desses programas, mesmo que eles sejam realizados por terceiros.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
