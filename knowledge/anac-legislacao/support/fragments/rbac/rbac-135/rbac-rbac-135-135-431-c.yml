cite: 135.431(c)
title: 135.431(c)
text: (c) O detentor do certificado pode requerer à ANAC reconsideração da notificação determinando
  mudança de um programa. O requerimento deve ser submetido à ANAC no máximo 30 dias após
  o recebimento da notificação. Exceto no caso de uma emergência requerendo ação imediata,
  no interesse da segurança, a submissão de um requerimento de reconsideração suspende a entrada
  em vigor da modificação, até a decisão final da ANAC.
