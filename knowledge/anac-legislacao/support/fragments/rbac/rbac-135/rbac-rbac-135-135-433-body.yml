text: '135.433 Programas de treinamento de manutenção e de manutenção preventiva

  O detentor de certificado com função de executar manutenção ou manutenção preventiva deve
  possuir um programa de treinamento que assegure que cada pessoa (incluindo pessoal de inspeção)
  que determine a adequabilidade de um trabalho executado, esteja totalmente informada sobre
  técnicas, procedimentos e novos equipamentos em uso e seja competente para executar suas
  obrigações.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
