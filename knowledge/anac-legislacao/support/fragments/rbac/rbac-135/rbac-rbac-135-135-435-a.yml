cite: 135.435(a)
title: 135.435(a)
text: (a) Exceto quanto à manutenção, manutenção preventiva, alterações e inspeções obrigatórias
  realizadas por uma oficina certificada localizada fora do Brasil, cada pessoa diretamente
  encarregada de executar manutenção, manutenção preventiva e alterações, e cada pessoa encarregada
  de realizar inspeções obrigatórias deve possuir uma apropriada licença de mecânico, emitida
  pela ANAC, com as adequadas qualificações para o trabalho que executa.
