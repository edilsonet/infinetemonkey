section_title: Autoridade para executar e aprovar manutenção, manutenção preventiva e alterações
subsection_id: a
cite: 135.437(a)
title: 135.437(a)
text: '(a) Um detentor de certificado pode executar ou contratar outras pessoas para executar
  manutenção, manutenção preventiva e alterações nas aeronaves de sua frota em conformidade
  com o previsto em seu manual de manutenção. Além disso, um detentor de certificado enquadrado
  no parágrafo 135.411(a)(2) pode executar essas funções para outro detentor de certificado
  também enquadrado no mesmo parágrafo em conformidade com o manual de manutenção do outro
  detentor de certificado.

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
