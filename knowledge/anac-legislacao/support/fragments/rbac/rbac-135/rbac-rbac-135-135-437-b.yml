section_title: Autoridade para executar e aprovar manutenção, manutenção preventiva e alterações
subsection_id: b
cite: 135.437(b)
title: 135.437(b)
text: '(b) Um detentor de certificado pode aprovar o retorno ao serviço de qualquer aeronave,
  célula, motor, hélice, rotor ou equipamentos, após manutenção, manutenção preventiva ou
  alterações executadas de acordo com o parágrafo (a) desta seção. No entanto, no caso de
  grandes reparos ou grandes alterações não constantes na documentação técnica aprovada da
  aeronave, o trabalho deve ser realizado de acordo com dados técnicos de projeto aprovados.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
