title: 135.439(a)
text: '(a) O detentor de certificado deve conservar (usando o sistema especificado no manual
  requerido pela seção 135.427) os seguintes registros de manutenção, pelos períodos de tempo
  especificados no parágrafo (b) desta seção:

  (1) todos os registros necessários para demonstrar que todos os requisitos para emissão
  de uma liberação de aeronavegabilidade conforme requerido pela seção 135.443 foram atendidos;

  (2) registros contendo as seguintes informações:'
