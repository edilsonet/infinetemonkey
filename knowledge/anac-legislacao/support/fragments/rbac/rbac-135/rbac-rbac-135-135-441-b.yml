cite: 135.441(b)
title: 135.441(b)
text: '(b) os registros especificados no parágrafo 135.439(a)(1) que não estejam incluídos
  no parágrafo (a) desta seção, exceto quando o comprador permita que o vendedor conserve
  a custódia física desses registros. No entanto, a custódia dos registros pelo vendedor não
  exime o comprador de sua responsabilidade, prevista no parágrafo 135.439(c) deste Regulamento,
  de disponibilizar esses registros à ANAC, para inspeções e verificações.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
