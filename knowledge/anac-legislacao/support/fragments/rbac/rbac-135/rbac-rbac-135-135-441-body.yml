text: '135.441 Transferência de registros de manutenção

  O detentor de certificado que venda uma aeronave registrada no Brasil deve transferir ao
  comprador, no momento da venda, os seguintes registros da aeronave, em linguagem clara ou
  em forma codificada que permita a conservação e a recuperação das informações de maneira
  aceitável pela ANAC:'
