subsection_id: a
cite: 135.443(a)
title: 135.443(a)
text: '(a) Um detentor de certificado somente pode operar uma aeronave que tenha sido submetida
  a serviços de manutenção, manutenção preventiva ou alterações, se preparar, ou fizer que
  o detentor de certificado com quem tem contrato para execução de manutenção, manutenção
  preventiva ou alterações prepare:

  (1) uma liberação de aeronavegabilidade; ou

  (2) uma apropriada anotação nos registros de manutenção da aeronave.'
