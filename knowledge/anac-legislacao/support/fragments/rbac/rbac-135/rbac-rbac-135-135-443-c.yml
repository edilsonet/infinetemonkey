title: 135.443(c)
text: (c) Ressalvado o parágrafo (b)(3) desta seção, após manutenção, manutenção preventiva
  ou alterações realizadas por uma oficina localizada fora do Brasil, a documentação e anotações
  de aeronavegabilidade requeridas pelo parágrafo (a) desta seção pode ser assinada por uma
  pessoa autorizada por esta oficina.
