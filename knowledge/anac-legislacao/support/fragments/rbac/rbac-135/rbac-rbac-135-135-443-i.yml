subsection_id: i
cite: 135.443(i)
title: 135.443(i)
text: '(i) o trabalho foi realizado em conformidade com os requisitos do manual do detentor
  de certificado;

  (ii) todos os itens requerendo inspeções foram inspecionados por uma pessoa habilitada e
  autorizada, que certificou que o trabalho foi satisfatoriamente completado;

  (iii) não existem condições conhecidas que impeçam a aeronavegabilidade da aeronave;

  (iv) no que diz respeito ao trabalho realizado, a aeronave está em condições de operar com
  segurança; e

  (3) ser assinada por um mecânico habilitado e autorizado para isso. Cada mecânico só pode
  assinar um documento ou anotação sobre um trabalho por ele executado se possuir autorização
  para isso e tiver sido contratado para fazê-lo.'
