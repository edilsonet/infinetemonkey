cite: 135.501(a)
title: 135.501(a)
text: '(a) Esta Subparte estabelece regras relativas ao transporte de artigos perigosos por
  via aérea a serem seguidas por cada detentor de certificado em conformidade com os requisitos
  estabelecidos pelo RBAC nº 175, independentemente de possuírem ou não autorização operacional
  para transportar artigos perigosos como carga.

  Nota 1: as responsabilidades do operador relativas ao transporte de artigos perigosos e
  os requisitos para notificação de ocorrências com artigos perigosos estão contidos no RBAC
  nº 175.

  Nota 2: os requisitos pertinentes a membros da tripulação ou passageiros sobre o transporte
  de artigos perigosos como bagagem a bordo de aeronaves estão contidos no RBAC nº 175.

  Nota 3: o transporte de artigos perigosos que não seja como carga (p. ex., aeromédico, busca
  e salvamento etc.) é tratado como exceção geral de aplicabilidade no RBAC nº 175 e em Instrução
  Suplementar. As exceções para o transporte de artigos perigosos que sejam parte do equipamento
  da aeronave ou que sejam utilizados a bordo da aeronave durante o voo são detalhadas no
  parágrafo 175.11(a) do RBAC nº 175 e em Instrução Suplementar.'
