title: 135.501(b)
text: '(b) Definições. Para o propósito desta Subparte, são aplicadas as seguintes definições:

  (1) Carga - Qualquer bem transportado por uma aeronave que não seja mala postal ou bagagem
  acompanhada ou extraviada.

  (2) COMAT - Material do operador, transportado em uma aeronave do próprio operador e em
  seu próprio proveito.

  Nota: para os fins deste regulamento, COMAT que atenda aos critérios de classificação para
  artigos perigosos estabelecidos pelo RBAC nº 175 é considerado como carga e deve ser transportado
  de acordo com os requisitos daquele regulamento (p. ex., partes de aeronaves, tais como
  geradores químicos de oxigênio, unidades de controle de combustível, extintores de incêndio,
  óleos, lubrificantes, produtos de limpeza).'
