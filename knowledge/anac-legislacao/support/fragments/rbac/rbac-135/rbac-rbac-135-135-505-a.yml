text: '(a) Para poder transportar artigos perigosos como carga, o detentor de certificado
  deve obter autorização prévia da ANAC em suas Especificações Operativas e deve:

  (1) estabelecer um programa de treinamento de artigos perigosos que cumpra com os requisitos
  do RBAC nº 175; e

  (2) estabelecer políticas e procedimentos sobre artigos perigosos em seu manual de operações
  que atendam, no mínimo, aos requisitos aplicáveis do RBAC nº 175, de modo a possibilitar
