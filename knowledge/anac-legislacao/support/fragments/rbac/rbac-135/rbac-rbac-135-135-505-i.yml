title: 135.505(i)
text: '(i) identificar e rejeitar artigos perigosos não declarados ou mal declarados, incluindo
  COMAT classificado como artigo perigoso;

  (ii) notificar ocorrências com artigos perigosos às autoridades apropriadas, conforme exigido
  pelo RBAC nº 175;

  (iii) aceitar, manusear, armazenar, transportar, carregar e descarregar artigos perigosos,
  incluindo COMAT classificado como artigo perigoso, como carga a bordo de uma aeronave;

  (iv) prover ao piloto em comando, por escrito, informação exata e legível relativa aos artigos
  perigosos a serem transportados como carga; e'
