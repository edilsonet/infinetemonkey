text: '135.507

  Provisão de informações

  O operador deve assegurar-se de que seu pessoal envolvido na aceitação, manuseio, carregamento
  e descarregamento de carga, incluindo funcionários subcontratados atuando em seu nome, esteja
  informado sobre a autorização operacional do operador com relação ao transporte de artigos
  perigosos e suas limitações.

  SUBPARTE L

  [RESERVADO]

  (Incluído pela Resolução nº 494, de 17.10.2018)

  SUBPARTE M

  SISTEMA DE GERENCIAMENTO DA SEGURANÇA OPERACIONAL

  (Incluído pela Resolução nº 494, de 17.10.2018)'
