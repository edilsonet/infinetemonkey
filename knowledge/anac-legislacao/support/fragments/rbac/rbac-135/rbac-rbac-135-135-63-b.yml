title: 135.63(b)
text: (b) O detentor de certificado deve manter cada registro requerido pelo parágrafo (a)(3)
  desta seção por pelo menos 6 meses e deve manter cada registro requerido pelos parágrafos
  (a)(4) e (a)(5) desta seção por pelo menos 5 anos.
