cite: 135.63(f)
title: 135.63(f)
text: '(f) Caso o detentor de certificado possua aprovação em suas especificações operativas
  para elaboração de manifesto de carga por meio de EFB, a assinatura requerida no parágrafo
  (c) desta seção pode ser substituída por uma autenticação digital atribuída ao piloto em
  comando ou por sua assinatura no próprio dispositivo. Adicionalmente, a via requerida pelo
  parágrafo (d) desta seção pode ser enviada somente por meio eletrônico para a base do detentor
  de certificado, devendo o piloto em comando se certificar de seu recebimento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
