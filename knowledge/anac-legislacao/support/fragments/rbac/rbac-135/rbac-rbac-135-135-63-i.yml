cite: 135.63(i)
title: 135.63(i)
text: '(i) o nome completo do piloto e código ANAC;

  (ii) a licença do piloto (por tipo e número) e as qualificações que o piloto possui;

  (iii) a experiência aeronáutica do piloto com detalhamento suficiente para determinar sua
  qualificação para pilotar aeronaves operando segundo este Regulamento;

  (iv) as atuais funções do piloto e a data na qual ele foi designado para essas funções;'
