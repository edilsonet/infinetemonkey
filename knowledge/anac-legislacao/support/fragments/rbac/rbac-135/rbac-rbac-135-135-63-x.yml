section_title: Requisitos de conservação de registros
subsection_id: x
cite: 135.63(x)
title: 135.63(x)
text: '(x) a data de término da fase inicial e de cada fase periódica de treinamento requerida
  por este Regulamento; e

  (xi) certificados de conclusão em conformidade com o parágrafo 135.323(c), além de fichas
  de instrução dos currículos de voo de cada tipo de treinamento aprovado em aeronave, dispositivo
  de treinamento para simulação de voo (FSTD) e/ou outro dispositivo de treinamento aprovado
  pela ANAC, com detalhamento suficiente para demonstrar o correto cumprimento do treinamento
  previsto e o seu resultado;

  (5) um registro individual para cada comissário de voo requerido por este Regulamento, conservado
  com detalhes suficientes para determinar conformidade com os requisitos aplicáveis deste
  Regulamento.'
