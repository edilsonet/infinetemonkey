title: 'Guarda de contratos e suas emendas: operações não-regulares'
text: '135.64 Guarda de contratos e suas emendas: operações não-regulares

  O detentor de certificado conduzindo operações não-regulares deve conservar uma cópia de
  cada contrato escrito segundo o qual ele provê serviços de transporte aéreo por um período
  de pelo menos um ano após a data de execução do contrato. No caso de contrato verbal, ele
  deve conservar um memorando estabelecendo seus elementos, e aos elementos de quaisquer emendas
  a esse contrato, por um período de pelo menos um ano após a execução do contrato ou de suas
  emendas.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
