section_title: Livro(s) de registros da tripulação e da aeronave
subsection_id: a
cite: 135.65(a)
title: 135.65(a)
text: '(a) O detentor de certificado deve dispor de um livro de registros, a bordo de cada
  uma de suas aeronaves, para lançamento de informações sobre a tripulação, horas de voo,
  irregularidades de funcionamento observadas em cada voo e registro das ações corretivas
  tomadas ou postergamento de correção. A critério do detentor de certificado o livro pode
  ser desmembrado em duas partes: registros da aeronave e registros da tripulação.'
