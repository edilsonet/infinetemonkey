section_title: Livro(s) de registros da tripulação e da aeronave
subsection_id: b
cite: 135.65(b)
title: 135.65(b)
text: '(b) No que diz respeito à tripulação, é responsabilidade do piloto em comando registrar
  em cada voo pelo menos as seguintes informações: marcas de nacionalidade e matrícula, data,
  identificação dos tripulantes e função a bordo de cada um deles, locais da decolagem e do
  pouso, horários da decolagem e do pouso, tempo de voo, natureza do voo, observações (se
  houver) e nome e assinatura da pessoa responsável.'
