cite: 135.65(c)
title: 135.65(c)
text: '(c) No que diz respeito à aeronave:

  (1) o piloto em comando deve registrar ou fazer que seja registrado no livro cada irregularidade
  que seja observada antes, durante e após o voo. Antes de cada voo o piloto em comando deve
  verificar a situação de cada irregularidade registrada nos voos anteriores.

  (2) cada pessoa que tome ações corretivas concernentes a falhas ou mau funcionamento registrados
  no livro de bordo, seja na célula, motores, hélices, rotores ou equipamentos normais e de
  emergência, deve registrar sua ação no referido livro, de acordo com os aplicáveis requisitos
  de manutenção dos regulamentos aplicáveis.'
