section_title: Livro(s) de registros da tripulação e da aeronave
subsection_id: d
cite: 135.65(d)
title: 135.65(d)
text: '(d) O detentor de certificado deve estabelecer procedimentos para conservar o(s) livro(s)
  de registros requerido(s) por esta seção para cada aeronave em local de fácil acesso ao
  pessoal apropriado, e deve descrever esses procedimentos no manual geral da empresa requerido
  pela seção 135.21 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
