text: '135.67 Informação sobre condições meteorológicas potencialmente perigosas e irregularidades
  em instalações de comunicações ou navegação

  Sempre que um piloto encontrar em voo uma condição meteorológica potencialmente perigosa
  ou uma irregularidade em instalações de comunicações ou de navegação, cuja divulgação esse
  piloto considerar essencial à segurança de outros voos, ele deve notificar uma apropriada
  estação rádio de solo tão cedo quanto praticável.'
