section_title: 'Restrições ou suspensão de operação: continuação de um voo em uma emergência'
subsection_id: a
cite: 135.69(a)
title: 135.69(a)
text: (a) Durante operações segundo este Regulamento, se um detentor de certificado ou um
  piloto em comando tomar conhecimento de condições, incluindo condições de aeródromos e de
  pistas, que sejam um risco para operações seguras, o detentor de certificado ou o piloto
  em comando, conforme for o caso, deve restringir ou suspender as operações, como necessário,
  até que essas condições sejam corrigidas.
