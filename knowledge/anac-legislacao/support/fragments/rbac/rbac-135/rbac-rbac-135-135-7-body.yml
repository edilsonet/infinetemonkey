title: Aplicabilidade das regras para operadores não autorizados
text: '135.7 Aplicabilidade das regras para operadores não autorizados

  As regras deste Regulamento que se aplicam a pessoas certificadas segundo o RBAC nº 119
  aplicam-se, também, a pessoas que porventura se engajarem em qualquer operação governada
  por este Regulamento sem um apropriado certificado e as especificações operativas requeridas
  pelo RBAC nº 119.'
