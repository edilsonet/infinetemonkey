title: 135.705(d)
text: '(d) Coordenação do PRE.

  (1) O detentor de certificado deve estabelecer e manter um plano de resposta a acidentes,
  incidentes e outras situações de emergência relacionadas às suas operações aéreas.

  (2) O detentor de certificado deve assegurar que seu plano de resposta à emergência seja
  adequadamente coordenado com os planos de resposta à emergência das organizações com quem
  interage durante a execução de suas operações.'
