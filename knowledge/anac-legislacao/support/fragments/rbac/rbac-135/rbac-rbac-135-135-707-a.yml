cite: 135.707(a)
title: 135.707(a)
text: '(a) Processo de identificação de perigos.

  (1) O detentor de certificado deve desenvolver e manter um processo que assegure que os
  perigos associados a seus produtos ou serviços sejam identificados.

  (2) O processo de identificação de perigos deve ser baseado em uma combinação de métodos
  reativos e proativos de coleta de dados de segurança operacional.'
