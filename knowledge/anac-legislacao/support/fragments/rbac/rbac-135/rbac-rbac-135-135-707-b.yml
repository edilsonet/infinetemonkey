title: 135.707(b)
text: '(b) Processo de avaliação e controle de riscos.

  (1) O detentor de certificado deve desenvolver e manter um processo que assegure a análise,
  avaliação e controle dos riscos à segurança operacional associados aos perigos identificados.'
