cite: 135.709(b)
title: 135.709(b)
text: '(b) Processo de gerenciamento de mudanças.

  (1) O detentor de certificado deve desenvolver e manter um processo para identificar alterações
  que podem afetar o nível de risco à segurança operacional de seus produtos ou serviços e
  para identificar e gerenciar os riscos à segurança operacional que podem surgir a partir
  dessas mudanças.'
