title: Verificação de aeronavegabilidade
text: '135.71 Verificação de aeronavegabilidade

  Um piloto em comando somente pode iniciar um voo se ele verificar que as inspeções de aeronavegabilidade
  requeridas pela seção 91.409 do RBAC nº 91, ou pelas seções 135.419 ou 135.425, o que for
  aplicável, foram realizadas.

  (Redação dada pela Resolução nº 612, de 09.03.2021)'
