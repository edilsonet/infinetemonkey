cite: 135.711(a)
title: 135.711(a)
text: '(a) Treinamento e qualificação.

  (1) O detentor de certificado deve desenvolver e manter um programa de treinamento de segurança
  operacional que assegure que seus funcionários sejam treinados e competentes para exercer
  as suas funções dentro do SGSO.

  (2) O escopo do programa de treinamento de segurança operacional deve ser apropriado à participação
  de cada indivíduo dentro do SGSO.'
