title: Inspeções e exames da ANAC
text: '135.73 Inspeções e exames da ANAC

  O detentor de certificado e cada pessoa a ele vinculada deve permitir, a qualquer tempo,
  que a ANAC faça inspeções ou exames (incluindo voo de acompanhamento) para verificar a conformidade
  do detentor com o Código Brasileiro de Aeronáutica, com os RBAC aplicáveis e com o seu certificado
  de certificação e suas especificações operativas.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
