section_title: 'Assento dianteiro do observador: admissão à cabine de pilotos: credencial
  de servidor designado pela ANAC'
subsection_id: a
cite: 135.75(a)
title: 135.75(a)
text: (a) Sempre que, executando tarefas de inspeção, um servidor designado pela ANAC apresentar
  suas credenciais ao piloto em comando de uma aeronave operada por um detentor de certificado,
  esse servidor designado pela ANAC terá livre e ininterrupto acesso à cabine de pilotos dessa
  aeronave. No entanto, este parágrafo não limita a autoridade de emergência de um piloto
  em comando de retirar qualquer pessoa da cabine de pilotos no interesse da segurança.
