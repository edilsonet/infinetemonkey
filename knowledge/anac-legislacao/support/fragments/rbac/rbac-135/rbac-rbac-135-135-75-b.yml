section_title: 'Assento dianteiro do observador: admissão à cabine de pilotos: credencial
  de servidor designado pela ANAC'
subsection_id: b
cite: 135.75(b)
title: 135.75(b)
text: (b) Deve ser provido um assento para observador na cabine de pilotos, ou um assento
  dianteiro para passageiro com fone ou alto-falante, para uso de servidor designado pela
  ANAC quando conduzindo inspeções em rota. A adequabilidade da localização desse assento
  para passageiro e do fone ou alto-falante para uso na condução de uma inspeção em rota é
  determinada pela ANAC.
