title: 135.75(d)
text: '(d) É vedado ocupar o assento para observador no compartimento dos pilotos sem que
  haja um assento no compartimento dos passageiros à sua disposição, exceto aquelas pessoas
  referidas nos parágrafos (c)(1) a (c)(5) desta seção.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
