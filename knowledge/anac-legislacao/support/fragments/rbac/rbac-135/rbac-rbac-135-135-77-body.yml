title: Responsabilidade pelo controle operacional
text: '135.77 Responsabilidade pelo controle operacional

  O detentor de certificado é responsável pelo controle operacional e deve listar, no manual
  geral da empresa requerido pela seção 135.21 deste Regulamento, o nome e o título de cada
  pessoa autorizada por ele a exercer controle operacional.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
