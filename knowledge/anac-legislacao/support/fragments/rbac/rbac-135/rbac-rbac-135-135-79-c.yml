title: 135.79(c)
text: (c) O detentor de certificado deve fornecer à ANAC uma cópia de seu procedimento para
  localização de voo e de suas modificações e adições, exceto se esses procedimentos estiverem
  incluídos no manual geral da empresa requerido por este Regulamento.
