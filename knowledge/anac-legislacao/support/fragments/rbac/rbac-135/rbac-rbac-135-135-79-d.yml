title: 135.79(d)
text: '(d) O detentor de certificado deve designar, em seu manual geral da empresa ou nos
  procedimentos referidos no parágrafo (c) desta seção, as pessoas responsáveis pela execução
  dos procedimentos requeridos por esta seção.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
