text: '135.81 Informações operacionais e suas alterações

  O detentor de certificado deve informar a cada pessoa a ele vinculada das especificações
  operativas aplicáveis aos deveres e responsabilidades da pessoa e deve tornar disponível
  aos seus pilotos vinculados, para permitir planejamento de voos no solo, as seguintes informações
