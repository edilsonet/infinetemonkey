title: 135.83(b)
text: '(b) Cada lista de verificações requerida pelo parágrafo (a)(1) desta seção deve conter
  os seguintes procedimentos:

  (1) antes da partida dos motores;

  (2) antes da decolagem;

  (3) cruzeiro;

  (4) antes do pouso;

  (5) após o pouso; e

  (6) parada dos motores.'
