text: '(a) Somente é permitido transportar carga em uma aeronave, incluindo bagagem de mão,
  se:

  (1) ela for transportada em um armário, prateleira ou compartimento aprovado para transporte
  de carga e instalado na aeronave;

  (2) ela estiver presa por um meio aprovado; ou

  (3) ela for transportada nas seguintes condições:'
