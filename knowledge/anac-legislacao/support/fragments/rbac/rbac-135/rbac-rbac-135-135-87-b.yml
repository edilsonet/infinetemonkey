section_title: Transporte de carga, incluindo bagagem de mão
subsection_id: b
cite: 135.87(b)
title: 135.87(b)
text: (b) Cada assento para passageiro sob o qual pode ser colocada bagagem de mão deve ser
  dotado de meios que impeçam que essa bagagem deslize sob impactos suficientemente severos
  para induzir as forças finais de inércia especificadas para as condições de pouso de emergência
  do RBAC segundo o qual a aeronave foi certificada.
