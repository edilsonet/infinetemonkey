cite: 135.87(c)
title: 135.87(c)
text: '(c) Quando for transportada carga em compartimentos de carga que foram projetados requerendo
  a entrada física de um tripulante para extinguir qualquer incêndio que possa ocorrer em
  voo, a carga deve ser posicionada de modo a permitir que um tripulante alcance efetivamente
  todas as partes desse compartimento com o jato do conteúdo de um extintor de incêndio portátil.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
