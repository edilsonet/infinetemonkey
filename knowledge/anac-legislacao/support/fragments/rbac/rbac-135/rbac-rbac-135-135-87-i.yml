section_title: Transporte de carga, incluindo bagagem de mão
subsection_id: i
cite: 135.87(i)
title: 135.87(i)
text: '(i) no caso de carga, apropriadamente presa por um cinto de segurança ou uma correia
  de amarração possuindo resistência suficiente para eliminar a possibilidade de deslizamento
  sob todas as condições normalmente esperadas no solo e em voo; no caso de bagagem de mão,
  segura de modo a evitar sua movimentação durante turbulências aéreas;

  (ii) empacotada ou coberta para evitar possíveis ferimentos aos ocupantes;

  (iii) não impondo qualquer carga aos assentos ou à estrutura do assoalho que exceda as limitações
  de carga desses componentes;

  (iv) não estando localizada em uma posição obstruindo o acesso ou o uso de qualquer saída
  de emergência requerida ou de saídas normais, ou o uso do corredor entre os compartimentos
  dos pilotos e dos passageiros, ou de modo a prejudicar a visibilidade dos sinais de “não
  fume” e “atar os cintos” para qualquer passageiro, exceto se forem providos sinais auxiliares
  ou outros meios aprovados para notificar os passageiros;'
