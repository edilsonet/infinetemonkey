title: 135.87(v)
text: '(v) não estando localizada diretamente acima de ocupantes sentados, exceto se em compartimentos
  fechados aprovados (“

  overhead bins

  ”);

  (vi) guardada em conformidade com esta seção para decolagens e pousos; e

  (vii) para operações exclusivamente cargueiras, não se aplica o parágrafo (a)(3)(iv) desta
  seção se a carga for colocada de modo que pelo menos uma saída de emergência ou normal permaneça
  disponível para que todos os ocupantes tenham uma saída da aeronave desobstruída caso ocorra
  uma emergência.'
