cite: 135.89(b)
title: 135.89(b)
text: '(b) Aeronave pressurizada.

  (1) Sempre que uma aeronave pressurizada for operada com uma altitude pressão de cabine
  maior que 10.000 pés MSL, cada piloto deve atender ao parágrafo (a) desta seção.

  (2) Sempre que uma aeronave pressurizada for operada em altitudes acima de 25.000 pés e
  até 35.000 pés MSL, exceto se cada piloto tiver uma máscara de oxigênio de colocação rápida
  aprovada:'
