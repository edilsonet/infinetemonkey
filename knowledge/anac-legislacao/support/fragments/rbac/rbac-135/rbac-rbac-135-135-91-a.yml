cite: 135.91(a)
title: 135.91(a)
text: '(a) Exceto como previsto nos parágrafos (d) e (e) desta seção, um detentor de certificado
  somente pode permitir o transporte ou operação de equipamento para armazenamento, geração
  ou fornecimento de oxigênio medicinal se as condições dos parágrafos (a) a (c) desta seção
  forem atendidas. Um detentor de certificado somente pode permitir a um passageiro levar
  consigo e operar um concentrador de oxigênio portátil se os requisitos dos parágrafos (b)
  e (f) desta seção forem atendidos.

