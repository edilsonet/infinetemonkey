section_title: Oxigênio e concentradores de oxigênio portáteis para uso medicinal por passageiros
subsection_id: b
cite: 135.91(b)
title: 135.91(b)
text: (b) É proibido fumar ou criar uma chama aberta e o detentor de certificado não pode
  permitir que qualquer pessoa fume ou crie uma chama aberta dentro de um raio de 10 pés de
  um equipamento de armazenamento e fornecimento de oxigênio transportado de acordo com o
  parágrafo (a) desta seção ou de um concentrador de oxigênio portátil transportado e operado
  de acordo com o parágrafo (f) desta seção.
