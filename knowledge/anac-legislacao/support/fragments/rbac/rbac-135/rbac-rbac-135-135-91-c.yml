section_title: Oxigênio e concentradores de oxigênio portáteis para uso medicinal por passageiros
subsection_id: c
cite: 135.91(c)
title: 135.91(c)
text: (c) O detentor de certificado não pode permitir que qualquer pessoa, que não uma pessoa
  treinada na utilização de equipamento de oxigênio medicinal, conecte ou desconecte cilindros
  de oxigênio ou quaisquer outros componentes auxiliares enquanto qualquer passageiro estiver
  a bordo da aeronave.
