section_title: Oxigênio e concentradores de oxigênio portáteis para uso medicinal por passageiros
subsection_id: d
cite: 135.91(d)
title: 135.91(d)
text: (d) O parágrafo (a)(1)(i) desta seção não se aplica quando o equipamento for fornecido
  por um profissional ou por um serviço de emergências médicas para uso a bordo de uma aeronave
  em uma emergência médica quando nenhum outro meio prático de transporte (incluindo outro
  detentor de certificado apropriadamente equipado) estiver razoavelmente disponível e a pessoa
  transportada sob emergência médica for acompanhada por uma pessoa treinada no uso de oxigênio
  medicinal.
