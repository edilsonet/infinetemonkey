cite: 135.91(e)
title: 135.91(e)
text: (e) O detentor de certificado que, de acordo com o parágrafo (d) desta seção, desviar-se
  do parágrafo (a)(1)(i) desta seção em uma emergência médica, deve, em até 10 dias úteis
  após o desvio, enviar à ANAC um relato completo da operação envolvida, incluindo uma descrição
  do desvio e as suas razões.
