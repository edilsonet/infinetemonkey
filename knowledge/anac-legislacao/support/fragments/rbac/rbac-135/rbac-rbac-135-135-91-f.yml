title: 135.91(f)
text: '(f) Concentradores de oxigênio portáteis.

  (1) Critério de aceitação. Um passageiro somente pode levar consigo ou operar um concentrador
  de oxigênio portátil para uso pessoal a bordo de uma aeronave, e um detentor de certificado
  somente pode permitir a um passageiro levar consigo ou operar um concentrador de oxigênio
  portátil, em uma aeronave operada sob este regulamento durante todas as fases do voo se
  o concentrador de oxigênio portátil atender os seguintes requisitos:'
