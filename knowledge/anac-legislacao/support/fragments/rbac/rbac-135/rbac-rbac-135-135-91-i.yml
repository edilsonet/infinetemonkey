section_title: Oxigênio e concentradores de oxigênio portáteis para uso medicinal por passageiros
subsection_id: i
cite: 135.91(i)
title: 135.91(i)
text: '(i) assentos de saída. Nenhuma pessoa operando um concentrador de oxigênio portátil
  pode ocupar um assento de saída. Aplica-se, para os propósitos deste parágrafo, a definição
  de assento de saída constante na seção 135.129; e

  (ii) armazenamento do concentrador. Durante movimentações na superfície, decolagem e pouso,
  o concentrador deve permanecer guardado sob o assento em frente ao passageiro usuário ou
  em outro local aceito pela ANAC de forma que não bloqueie um corredor ou a entrada de uma
  fileira. Se o concentrador for operado pelo próprio passageiro usuário, ele deve ser operado
  somente em um assento localizado de forma a não restringir o acesso de qualquer passageiro
  a, nem a utilização de, qualquer saída requerida normal ou de emergência ou corredores da
  cabine de passageiros.

  (Redação dada pela Resolução nº 549, de 20.03.2020)'
