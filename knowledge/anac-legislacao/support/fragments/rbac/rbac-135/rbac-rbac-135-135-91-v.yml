title: 135.91(v)
text: '(v) apresentar uma etiqueta na superfície externa, aplicada de maneira que garanta
  que a etiqueta será mantida afixada durante a vida útil do concentrador e que contenha declaração,
  do fabricante do concentrador de oxigênio portátil, de que o concentrador é adequado para
  o transporte a bordo de aeronaves e cumpre com os critérios de aceitação do parágrafo (f)(1)
  desta seção. A etiqueta prevista neste parágrafo pode ser dispensada, mediante autorização
  da ANAC, nos casos em que o país do fabricante não requeira sua afixação, desde que os demais
  critérios de aceitação tenham sido verificados.

  (2) Requisitos operacionais. Concentradores de oxigênio portáteis que satisfazem os critérios
  de aceitação do parágrafo (f)(1) desta seção somente podem ser transportados e operados
  por um passageiro em uma aeronave se o detentor de certificado garantir que os seguintes
  requisitos são atendidos:'
