section_title: 'Piloto automático: altitudes mínimas de utilização para aviões'
subsection_id: a
cite: 135.93(a)
title: 135.93(a)
text: '(a) Definições. Para os propósitos desta seção:

  (1) alturas de decolagem/subida inicial e de arremetida/aproximação perdida são definidas
  em relação à altitude do aeroporto;

  (2) alturas para operações em rota são definidas em relação à altitude do terreno; e

  (3) alturas para aproximação são definidas em relação à altitude da zona de contato (TDZE),
  exceto se a altura for expressamente definida em referência à altura de decisão (DH) / altitude
  de decisão (DA) ou à altitude mínima de descida (MDA).'
