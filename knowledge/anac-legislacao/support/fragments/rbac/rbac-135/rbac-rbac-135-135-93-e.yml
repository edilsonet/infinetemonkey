section_title: 'Piloto automático: altitudes mínimas de utilização para aviões'
subsection_id: e
cite: 135.93(e)
title: 135.93(e)
text: (e) Arremetida/aproximação perdida. É vedado engajar um piloto automático durante uma
  arremetida ou uma aproximação perdida a uma altura menor que a altura mínima de engajamento
  especificada para decolagem e subida inicial estabelecida no parágrafo (b) desta seção.
  Esta altura mínima de uso do piloto automático não se aplica se a arremetida ou a aproximação
  perdida for iniciada com o piloto automático engajado. Executar a arremetida ou a aproximação
  perdida com o piloto automático engajado não pode afetar adversamente a manutenção de separação
  segura com obstáculos.
