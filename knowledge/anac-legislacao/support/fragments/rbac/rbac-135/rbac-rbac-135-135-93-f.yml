section_title: 'Piloto automático: altitudes mínimas de utilização para aviões'
subsection_id: f
cite: 135.93(f)
title: 135.93(f)
text: (f) Pouso. Ressalvado o parágrafo (d) desta seção, as alturas mínimas de uso do piloto
  automático não se aplicam a operações com piloto automático quando um modo aprovado do sistema
  de pouso automático é utilizado para pouso. O sistema de pouso automático deve estar autorizado
  nas especificações operativas do detentor de certificado.
