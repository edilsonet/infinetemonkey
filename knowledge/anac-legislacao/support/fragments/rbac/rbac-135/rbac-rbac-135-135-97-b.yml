subsection_id: b
cite: 135.97(b)
title: 135.97(b)
text: '(b) O detentor de certificado deve fornecer recursos para a familiarização com novas
  áreas, rotas e aeródromos para que cada um de seus pilotos mantenha e demonstre suas habilidades
  na condução de todas as operações a que é autorizado. Os procedimentos para familiarização
  devem constar no manual geral da empresa requerido pela seção 135.21 deste Regulamento.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
