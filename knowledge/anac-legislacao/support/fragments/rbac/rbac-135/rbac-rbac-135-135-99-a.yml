section_title: Composição de tripulação de voo
subsection_id: a
cite: 135.99(a)
title: 135.99(a)
text: (a) O detentor de certificado não pode operar uma aeronave com tripulação de voo menor
  que a especificada para a aeronave nas limitações operacionais do manual de voo da aeronave,
  ou requerida por este Regulamento para o tipo de operação a ser conduzida.
