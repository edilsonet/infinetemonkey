title: 135.99(b)
text: '(b) O detentor de certificado não pode operar uma aeronave com configuração para passageiros
  de 10 assentos ou mais, excluído qualquer assento de piloto, sem um piloto segundo em comando.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
