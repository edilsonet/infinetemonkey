text: '(c) Informações sobre desempenho. O manual de voo do avião deve conter as informações
  sobre desempenho determinadas de acordo com os requisitos de desempenho deste Apêndice.
  Essas informações devem incluir o seguinte:

  (1) dados suficientes para que os pesos limites de decolagem especificados no parágrafo
  A135.10 (b)(2) possam ser determinados para todas as temperaturas e altitudes dentro das
  limitações operacionais selecionadas pelo requerente;

  (2) as condições sob as quais as informações de desempenho foram obtidas, incluindo a velocidade
  a 15 m (50 pés) de altura usada para determinar distâncias de pouso;

  (3) informações sobre desempenho (determinadas por extrapolações e calculadas para a faixa
  de pesos entre os pesos máximos de pouso e de decolagem) para:'
