title: A135.11(b)
text: '(b) Cargas giroscópicas de motor a turbina. Cada berço de motor turboélice, assim como
  as estruturas que o suportam, deve ser projetado para as cargas giroscópicas que resultam,
  com os motores na rotação máxima contínua, de uma das condições abaixo:

  (1) as condições especificadas no RBAC nº 23; ou

  (2) todas as combinações possíveis das condições abaixo:'
