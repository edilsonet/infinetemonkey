text: '(c) Cargas assimétricas devidas a falha de motor.

  (1) Aviões turboélice devem ser projetados para as cargas assimétricas resultantes da falha
  do motor crítico, incluindo as condições abaixo combinadas com um mau funcionamento simples
  do sistema limitador de arrasto da hélice e considerando, ainda, a provável ação corretiva
  do piloto sobre os controles de voo:'
