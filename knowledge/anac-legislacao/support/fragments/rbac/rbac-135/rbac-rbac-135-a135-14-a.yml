title: A135.14(a)
text: '(a) “

  Flutter

  ”. Para aviões turboélice multimotores, deve ser feita uma avaliação dinâmica e essa avaliação
  deve incluir:

  (1) as forças elásticas, de inércia e aerodinâmicas significativas, associadas com as rotações
  e os deslocamentos do plano de rotação da hélice; e

  (2) a rigidez do conjunto motor-hélice-nacele, assim como as apropriadas variações do amortecimento
  da particular configuração.'
