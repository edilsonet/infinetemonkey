cite: A135.15(a)
title: A135.15(a)
text: (a) Dispositivo de alarme do trem de pouso operado pelos flapes. Aviões com trem de
  pouso retrátil e com flapes de asa devem ser equipados com um dispositivo de alarme que
  funcione continuamente quando os flapes de asa estiverem baixados para uma posição que ative
  o dispositivo de alarme, provendo um alarme adequado antes do pouso, quando usando os procedimentos
  normais de pouso, caso o trem de pouso não se encontre totalmente baixado e travado. Não
  pode haver um sistema de cancelamento manual desse dispositivo de alarme. A unidade sensora
  da posição do flape pode ser instalada em qualquer posição conveniente. O sistema para esse
  dispositivo pode usar qualquer parte do sistema provido para outros dispositivos de alarme
  do trem de pouso (incluindo o dispositivo sonoro do alarme).
