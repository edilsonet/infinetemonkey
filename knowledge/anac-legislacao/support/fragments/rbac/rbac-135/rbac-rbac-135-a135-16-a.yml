title: A135.16(a)
text: (a) Compartimentos para cargas e bagagens. Os compartimentos para cargas e bagagens
  devem ser projetados para atender ao RBAC nº 23 e, em adição, devem ser providos meios para
  proteger os passageiros contra ferimentos causados pelo conteúdo de qualquer compartimento
  de carga ou bagagem, quando a força final de inércia, para frente, for de 9 g.
