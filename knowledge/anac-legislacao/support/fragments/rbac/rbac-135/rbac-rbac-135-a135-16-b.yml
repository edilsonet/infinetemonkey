title: A135.16(b)
text: '(b) Portas e saídas. O avião deve atender ao previsto no RBAC nº 23. Em adição:

  (1) deve haver meios para travar e proteger cada porta e saída externa contra abertura em
  voo, seja inadvertidamente por pessoas, seja como resultado de falha mecânica. Cada porta
  externa deve ser operável tanto do interior quanto do exterior do avião;

  (2) deve haver meios para permitir inspeção visual direta, pelos tripulantes, do mecanismo
  de travamento, visando determinar se portas e saídas externas, para as quais o movimento
  inicial de abertura é para fora, estão totalmente travadas. Adicionalmente, deve haver um
  meio visual para sinalizar aos tripulantes quando portas externas de uso normal estiverem
  totalmente fechadas e travadas;

  (3) a porta de entrada de passageiros deve ser qualificada como saída de emergência ao nível
  do assoalho. Cada saída de emergência adicional requerida, exceto saídas ao nível do assoalho,
  deve ser localizada sobre as asas ou deve ser provida com meios aceitáveis para auxiliar
  os passageiros a descer para o solo. Em adição à porta de entrada dos passageiros:'
