cite: A135.17(a)
title: A135.17(a)
text: '(a) Proteção contra impacto de raios. Partes que sejam eletricamente isoladas da célula
  básica devem ser ligadas à mesma por meio de para-raios, exceto se o impacto de um raio
  na parte isolada:

  (1) for improvável por ser blindada por outras partes; ou

  (2) não constituir risco.'
