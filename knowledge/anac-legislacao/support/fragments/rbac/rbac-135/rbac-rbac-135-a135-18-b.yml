title: A135.18(b)
text: '(b) Reacendimento do motor em voo. Se o motor de um avião turboélice não puder ser
  religado na altitude máxima de cruzeiro, deve ser determinada a altitude máxima na qual
  o reacendimento pode ser executado consistentemente. As informações sobre reacendimento
  em voo devem ser incluídas no manual de voo do avião.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
