title: A135.18(e)
text: (e) Sistema limitador de arrasto de turboélice. Os sistemas de limitação de arrasto
  para turboélices devem ser projetados de modo que nenhuma falha simples ou mau funcionamento
  de qualquer dos sistemas, durante operação normal ou em emergência, resulte em um arrasto
  da hélice superior àquele para o qual o avião foi projetado. Falhas de elementos estruturais
  do sistema limitador de arrasto não precisam ser consideradas, se a probabilidade de ocorrência
  dessa espécie de falha for extremamente remota.
