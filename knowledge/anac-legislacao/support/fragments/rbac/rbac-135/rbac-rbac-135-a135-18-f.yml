title: A135.18(f)
text: (f) Características de operação de motores a turbina. Para aviões com motores a turbina,
  as características de operação dos motores devem ser investigadas em voo para determinar
  que nenhuma característica adversa (como estol, pulsação ou apagamento em voo) se apresenta
  em grau perigoso, durante as operações normais e em emergência, dentro das faixas de limitações
  operacionais do avião e do motor.
