cite: A135.19(a)
title: A135.19(a)
text: (a) Bombas de combustível. Para aviões com motores turboélice, deve ser provida uma
  fonte de potência confiável e independente para cada bomba usada com motores a turbina que
  não possuam provisões para acionar mecanicamente as bombas principais. Deve ser demonstrado
  que as instalações das bombas proporcionam confiabilidade e durabilidade equivalentes às
  previstas no RBAC nº 23.
