cite: A135.21(a)
title: A135.21(a)
text: '(a) Indução de ar. Para aviões com motores turboélice:

  (1) deve haver meios para evitar que quantidades perigosas de líquidos inflamáveis, proveniente
  de drenos e respiros de combustível ou de vazamentos de outros componentes de sistemas de
  fluidos inflamáveis, entrem no sistema de entrada de ar dos motores.

  (2) os dutos das entradas de ar devem ser localizados ou protegidos de modo a minimizar
  a probabilidade de ingestão de material estranho durante a decolagem, pouso e táxi.'
