cite: A135.21(b)
title: A135.21(b)
text: (b) Proteção do sistema de indução contra gelo. Em aviões com motores turboélice, cada
  motor a turbina deve ser capaz de operar ao longo de sua faixa de potência em voo, sem efeitos
  adversos na operação e sem perdas sérias de potência ou empuxo, sob as condições de gelo
  especificadas no Apêndice C do RBAC nº 25. Em adição, deve haver meios para indicar, ao
  apropriado tripulante de voo, o funcionamento do sistema de proteção contra gelo do grupo
  motopropulsor.
