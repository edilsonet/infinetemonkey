cite: A135.21(c)
title: A135.21(c)
text: '(c) Sistema de sangria de ar de motores a turbina. Os sistemas de sangria de ar dos
  motores a turbina de aviões turboélice devem ser investigados para determinar:

  (1) que não resultará em algum risco para a aeronave a ruptura de um duto de sangria. Essa
  condição deve considerar que a falha de um duto pode ocorrer em qualquer ponto entre o flange
  do motor e o componente do avião servido pela sangria de ar; e

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  (2) que, se o sistema de sangria de ar for usado diretamente para pressurização da cabine,
  não será possível uma contaminação perigosa do sistema de ar da cabine no evento de falha
  do sistema de lubrificação.'
