title: Sistema de escapamento
text: 'A135.22 Sistema de escapamento

  Dreno do sistema de escapamento. Sistemas de escapamento de motores turboélice que possuam
  pontos baixos ou poços devem incorporar drenos nesses locais. Esses drenos devem descarregar
  livrando o avião em atitude normal de solo e de voo, e visam a evitar o acúmulo de combustível
  no caso de falha de uma tentativa de dar partida no motor.'
