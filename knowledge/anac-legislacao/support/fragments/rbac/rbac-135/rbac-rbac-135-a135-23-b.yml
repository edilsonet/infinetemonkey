title: A135.23(b)
text: (b) Controles de reversão de tração. Em aviões com motores turboélice, os controles
  de reversão da tração das hélices devem possuir meios para impedir uma operação inadvertida.
  Esses meios devem possuir uma trava positiva ou batente na posição de marcha lenta e devem
  requerer uma operação separada e distinta, por parte do tripulante, para deslocar o controle
  da posição de regime de voo.
