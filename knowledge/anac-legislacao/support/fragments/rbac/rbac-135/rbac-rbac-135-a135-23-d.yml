title: A135.23(d)
text: (d) Acessórios do grupo motopropulsor. Os acessórios do grupo motopropulsor devem atender
  ao previsto no RBAC nº 23 e, se o prosseguimento da rotação de qualquer acessório acionado
  remotamente pelo motor for perigoso quando ocorrer um mau funcionamento, deve haver meios
  para impedir essa rotação, sem interferir com a continuação da operação do motor.
