cite: A135.24(b)
title: A135.24(b)
text: (b) Proteção contra fogo. Capota e revestimento da nacele do motor. Para aviões com
  motores convencionais, a capota do motor deve ser projetada e construída de modo que nenhum
  incêndio originado no compartimento do motor possa entrar, seja através de aberturas seja
  por invasão, em outras áreas onde possa criar riscos adicionais.
