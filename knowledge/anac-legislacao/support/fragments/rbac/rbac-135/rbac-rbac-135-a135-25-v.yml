title: A135.25(v)
text: '(v) um alarme de pressão de óleo para cada motor;

  (vi) um indicador de torque ou um meio adequado para indicar a potência de saída de cada
  motor;

  (vii) um indicador de alarme de fogo para cada motor;

  (viii) um meio para indicar quando o ângulo das pás da hélice estiver abaixo da posição
  de passo mínimo correspondente à operação em marcha lenta de voo; e

  (ix) um meio para indicar o funcionamento do sistema de proteção contra gelo de cada motor.

  (2) Para aviões com motores turboélice, o indicador de posição das pás da hélice deve iniciar
  as indicações quando a pá tiver se movido abaixo da posição de passo mínimo de voo.

  (3) Os seguintes instrumentos são requeridos para aviões com motores convencionais:'
