title: A135.26(b)
text: (b) Ventilação. O sistema de ventilação do avião deve atender ao RBAC nº 23 e, adicionalmente,
  para aviões pressurizados, o ar de ventilação dos compartimentos da tripulação de voo e
  dos passageiros deve ser livre de concentrações nocivas ou perigosas de gases e vapores,
  seja em operação normal, seja no evento de falha ou mau funcionamento razoavelmente prováveis
  dos sistemas de ventilação, aquecimento, pressurização ou de outros sistemas ou equipamentos.
  Se o acúmulo de quantidades perigosas de fumaça na área do compartimento dos pilotos for
  razoavelmente provável, deve ser possível evacuar a fumaça rapidamente.
