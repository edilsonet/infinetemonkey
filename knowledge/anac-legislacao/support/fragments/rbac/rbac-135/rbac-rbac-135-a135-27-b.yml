title: A135.27(b)
text: (b) Instalações e equipamentos elétricos. Equipamentos, fiações e controles elétricos
  devem ser instalados de modo que a operação de qualquer unidade ou sistema de unidades não
  afete adversamente a operação simultânea de qualquer outra unidade ou sistema elétrico essencial
  à segurança das operações.
