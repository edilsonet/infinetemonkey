title: A135.27(d)
text: (d) Dispositivos protetores de circuito. Os dispositivos protetores dos circuitos elétricos
  do avião devem atender ao previsto no RBAC nº 23 e, em adição, os circuitos para cargas
  que sejam essenciais à segurança das operações devem possuir proteção individual e exclusiva.
