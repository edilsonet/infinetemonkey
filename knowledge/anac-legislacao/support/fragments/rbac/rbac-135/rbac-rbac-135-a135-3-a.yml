text: '(a) Geral.

  (1) Exceto se de outra forma estabelecido por este Apêndice, a conformidade com cada aplicável
  requisito de desempenho constante nesta seção deve ser demonstrada em condição atmosférica
  ambiente e em ar calmo.

  (2) O desempenho deve corresponder à tração propulsiva disponível sob a particular condição
  atmosférica ambiente e na particular condição de voo. A tração propulsiva disponível deve
  corresponder à potência ou empuxo do motor, não excedendo a potência ou empuxo aprovados
  menos:'
