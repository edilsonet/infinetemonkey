title: A135.3(c)
text: '(c) Subida.

  (1) Subida na configuração de pouso; todos os motores operando. Devem ser determinados os
  pesos máximos nos quais o avião, na configuração de pouso, possui um gradiente estável de
  subida não inferior a 3,3%. Esses pesos devem ser determinados para cada altitude e temperatura
  ambiente dentro dos limites operacionais estabelecidos para o avião, com o centro de gravidade
  mais desfavorável, em ar livre fora do efeito de solo, e com:'
