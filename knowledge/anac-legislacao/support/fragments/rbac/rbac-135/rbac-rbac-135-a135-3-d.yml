title: A135.3(d)
text: '(d) Pouso.

  (1) O comprimento da pista de pouso descrito no parágrafo A135.3(d)(2) desta seção deve
  ser determinado para atmosfera padrão, em cada peso e altitude dentro dos limites operacionais
  estabelecidos pelo requerente.

  (2) O comprimento da pista de pouso é igual à distância de pouso determinada no RBAC nº
  23 dividido por 0,6 para o aeródromo de destino e por 0,7 para o aeródromo de alternativa.
  Em lugar da aproximação em planeio especificada no RBAC nº 23, o pouso deve ser precedido
  por uma aproximação estável até 15 m (50 pés) de altura, com um gradiente de descida não
  maior do que 5,2% (3º), a uma velocidade calibrada não inferior a 1,3 VS1.'
