text: '(a) Estabilidade estática longitudinal.

  (1) Na demonstração de conformidade com os requisitos do RBAC nº 23 e com o parágrafo (a)(2)
  desta seção, a velocidade do avião deve retornar para dentro da faixa de + 7,5% em torno
  da velocidade de compensação.

  (2) Estabilidade em cruzeiro. A curva da força no manche deve ter uma inclinação estável
  dentro da faixa de velocidades de + 50 nós em torno da velocidade de compensação, exceto
  que essas velocidades não precisam exceder VFC / MFC nem precisam ser menores que 1,4 VS1.
  Essa faixa de velocidade é considerada como tendo início nos extremos externos da faixa
  de atrito e a força no manche não pode exceder 22,7 kg (50 lb) com:'
