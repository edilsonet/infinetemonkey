title: A135.5(i)
text: '(i) trem de pouso recolhido;

  (ii) flapes de asa recolhidos;

  (iii) potência máxima de cruzeiro como selecionada pelo requerente como um limite operacional
  para motores a turbina, ou 75% da potência máxima contínua para motores convencionais, exceto
  que a potência não precisa exceder aquela requerida para voar na VMO / MMO;

  (iv) peso máximo de decolagem; e'
