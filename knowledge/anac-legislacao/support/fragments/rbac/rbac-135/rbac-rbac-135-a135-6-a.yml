title: A135.6(a)
text: '(a) Aviso de estol.

  (1) Se for requerido um aviso artificial de estol para demonstrar conformidade com os requisitos
  do RBAC nº 23, o dispositivo de aviso deve prover indicações claramente perceptíveis sob
  as condições esperadas de voo. O uso de um aviso visual, que requeira a atenção dos tripulantes
  na cabine de comando, não é aceitável por si só.'
