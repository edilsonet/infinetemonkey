cite: A135.7(a)
title: A135.7(a)
text: (a) Compensadores com comando elétrico. O avião deve atender aos requisitos do RBAC
  nº 23 e, em adição, deve ser demonstrado que ele é seguramente controlável e que o piloto
  pode executar todas as manobras e operações necessárias para efetuar um pouso seguro após
  qualquer disparo provável do compensador elétrico, que possa ser razoavelmente esperado
  em serviço, considerando um adequado atraso do piloto após o reconhecimento do disparo do
  compensador. Essa demonstração deve ser conduzida nos pesos e centros de gravidade críticos
  do avião.
