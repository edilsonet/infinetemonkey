section_title: 'Instrumentos: instalação'
subsection_id: i
cite: A135.8(i)
title: A135.8(i)
text: '(i) o instrumento que mais efetivamente indicar a atitude deve ficar na posição central
  superior do painel;

  (ii) o instrumento que mais efetivamente indicar a velocidade deve ficar adjacente e diretamente
  à esquerda do instrumento colocado na posição central superior do painel;

  (iii) o instrumento que mais efetivamente indicar a altitude deve ficar adjacente e diretamente
  à direita do instrumento colocado na posição central superior do painel; e

  (iv) o instrumento que mais efetivamente indicar a direção do voo deve ficar adjacente e
  diretamente abaixo do instrumento colocado na posição central superior do painel.'
