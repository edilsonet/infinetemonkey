text: '(b) Tripulação de voo mínima. Além de atender aos requisitos do RBAC nº 23, o requerente
  deve estabelecer o número mínimo e o tipo de qualificação dos tripulantes de voo, suficientes
  para a operação segura do avião, considerando:

  (1) Cada espécie de operação para a qual o requerente deseja aprovação;

  (2) A carga de trabalho de cada tripulante, considerando o seguinte:'
