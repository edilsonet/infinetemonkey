cite: A135.9(c)
title: A135.9(c)
text: (c) Indicador de velocidade. O indicador de velocidade deve atender aos requisitos aplicáveis
  do RBAC nº 23, exceto que as marcas e placas em termos de VNO e VNE devem ser substituídas
  por marcas e placas em termos de VMO / MMO. As marcas do indicador de velocidade devem ser
  facilmente legíveis e inteligíveis pelo piloto. Uma placa adjacente ao indicador de velocidade
  é um meio aceitável para cumprir o previsto no RBAC nº 23.
