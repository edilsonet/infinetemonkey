  (1) Quando a fonte de dados for um instrumento do avião (exceto altímetros) de qualidade
  aceitável para voar o avião, o sistema de gravação (excluindo esses sensores mas incluindo
  todas as demais características do sistema de gravação) pode prover não mais que metade
  dos valores desta coluna.

  (2) Se forem utilizados os dados de altitude provenientes de um altímetro “encoder” (resolução
  de 100 pés), qualquer um dos parâmetros pode ser gravado. No entanto, se os dados de altitude
  forem gravados com uma resolução mínima de 25 pés, esses dois parâmetros podem ser omitidos.

  (Redação dada pela Resolução nº 494, de 17.10.2018)

  (3) Porcentagem da faixa total de funcionamento.

  (4) Esta coluna aplica-se para aviões fabricados após 11 de outubro de 1991.'
