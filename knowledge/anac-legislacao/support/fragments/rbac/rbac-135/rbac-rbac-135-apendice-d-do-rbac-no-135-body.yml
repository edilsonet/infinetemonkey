  (1) Quando a razão de altitude for gravada. A razão de altitude deve possuir suficiente
  resolução e frequência de amostragem para permitir a obtenção de variações de 5 pés de altitude.

  (2) Porcentagem da faixa total.

  (3) Para aviões que possam demonstrar que é possível obter a ação do piloto a partir do
  movimento do controle (um do outro) para todos os modos de operação e regimes de voo, aplica-se
  o “ou”. Para aviões com sistemas de controle não mecânicos (“fly-by-wire”), aplica-se o
  “e”. Em aviões com várias superfícies, é aceitável gravar uma combinação adequada de movimentos
  em lugar de gravar a posição de cada superfície separadamente.

  (4) Esta coluna aplica-se para aviões fabricados após 11 de outubro de 1991.'
