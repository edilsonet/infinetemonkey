  88. Forças em todos os controles de voo da cabine (volante, coluna e pedais)

  Faixa total

  Volante ±70 lb

  Coluna ±85 lb

  Pedais ±165 lb

  ±5%

  1

  0,2% da faixa total

  Para sistemas de controles de voo “fly-by-wire”, quando a posição da superfície é função
  apenas do deslocamento do dispositivo de controle da cabine, não é necessário gravar esse
  parâmetro. Para aviões que possuem controles de voo com capacidade “break away”, que permite
  que um piloto opere os controles independentemente, devem ser gravadas as forças em ambos
  os controles. As forças nos comandos podem ser amostradas alternadamente uma vez cada 2
  segundos para produzir um intervalo de amostragem de 1 seg.

  (1) Para aviões AIRBUS A300 B2/B4, resolução = 6 seg.

  (2) Para aviões das séries A330/A340, resolução = 0,703º.

  (3) Para aviões das séries A318/A319/A320/A321, resolução = 0,275%(0,088º>0,064º). Para
  aviões das séries A330/A340, resolução = 2.20% (0,703º>0,064º).

  (4) Para aviões das séries A318/A319/A320/A321, resolução = 0,22%(0,088º>0,080º). Para aviões
  das séries A330/A340, resolução = 1,76% (0,703º>0,064º).

  (5) Para aviões das séries A330/A340, resolução = 1,18% (0,703º>0,120º).

  (6) Para aviões das séries A330/A340, resolução = 0,783% (0,352º>0,100º).

  (7) Para aviões das séries A330/A340, resolução do aileron = 0,704% (0,352º>0,100º). Para
