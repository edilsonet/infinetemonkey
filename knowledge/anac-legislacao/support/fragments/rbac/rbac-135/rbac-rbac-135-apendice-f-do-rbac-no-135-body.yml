text: 'APÊNDICE F DO RBAC Nº 135

  ESPECIFICAÇÕES DE GRAVADORES DE DADOS DE VOO PARA AVIÕES

  Todos os valores registrados devem atender aos requisitos de faixa, resolução e precisão
  durante condições estáticas e dinâmicas.

  Todos os dados registrados devem ser correlacionados em tempo, dentro da faixa de um segundo.

