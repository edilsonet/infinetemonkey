title: G135.1(a)
text: (a) Aeródromo adequado significa um aeródromo listado nas Especificações Operativas
  de um detentor de certificado, aprovado pela ANAC, que atende às limitações para pouso da
  seção 135.385 ou é um aeródromo militar ativo e operacional.
