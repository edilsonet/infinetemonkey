title: G135.1(b)
text: (b) Aeródromo de alternativa em rota ETOPS significa um aeródromo adequado e conveniente
  no qual um avião pode pousar após experimentar uma parada de motor ou outra condição anormal
  ou de emergência que ocorra em rota durante uma operação ETOPS.
