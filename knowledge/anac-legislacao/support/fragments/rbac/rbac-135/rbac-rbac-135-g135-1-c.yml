title: G135.1(c)
text: (c) Ponto de entrada ETOPS significa o primeiro ponto da rota em um voo ETOPS, determinado
  considerando-se velocidade de cruzeiro com um motor inoperante sob atmosfera padrão, ar
  calmo e distante mais de 180 minutos de um Aeródromo Adequado.
