title: G135.2(b)
text: '(b) Experiência exigida do detentor de certificado antes de realização de voo ETOPS.
  Antes de solicitar a aprovação ETOPS, o detentor de certificado deve ter pelo menos 12 meses
  de experiência na condução de operações internacionais com avião multimotor a turbina categoria
  transporte. O detentor de certificado pode considerar a seguinte experiência como operações
  internacionais:

  (1) experiência ETOPS com outros tipos de aeronaves, na categoria autorizada pela ANAC.'
