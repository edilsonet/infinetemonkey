title: G135.2(c)
text: '(c) Requisitos do avião. Um detentor de certificado somente pode conduzir uma operação
  ETOPS em um avião que seja fabricado após 17 de fevereiro de 2015 se o avião atender aos
  padrões do RBAC nº 25.1535.

  (Redação dada pela Resolução nº 494, de 17.10.2018)'
