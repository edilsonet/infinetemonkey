title: G135.2(d)
text: (d) Requisitos de informação da tripulação. O detentor de certificado deve assegurar-se
  que a tripulação tenha acesso, em voo, a informações meteorológicas atualizadas e aspectos
  operacionais necessários para cumprir com as seções 135.83, 135.225 e 135.229. Isso inclui
  informações sobre todos os aeródromos de alternativa em rota ETOPS, todos os destinos alternativos
  e o aeródromo de destino proposto para cada voo ETOPS.
