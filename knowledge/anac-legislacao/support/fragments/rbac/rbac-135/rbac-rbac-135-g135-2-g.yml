title: G135.2(g)
text: '(g) Requisitos de combustível. Somente é permitido a uma pessoa despachar ou liberar
  para um voo ETOPS se, considerando o vento e outras condições meteorológicas esperadas,
  houver o combustível requerido por este Regulamento e suficiente para atender aos seguintes
  requisitos:

  (1) combustível suficiente para voar até um aeródromo de alternativa em rota ETOPS;'
