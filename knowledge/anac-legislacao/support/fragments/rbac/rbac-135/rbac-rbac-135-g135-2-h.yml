text: '(h) Requisitos do programa de manutenção. A fim de conduzir um voo ETOPS sob a seção
  135.364 deste Regulamento, o detentor de certificado deve desenvolver e cumprir o programa
  de manutenção ETOPS, como autorizado nas especificações operativas do detentor de certificado,
  para cada combinação avião/motor bimotor usada nas operações ETOPS. Esse planejamento não
  se aplica a operações utilizando um avião com mais de dois motores. O detentor de certificado
  deve desenvolver seu programa de manutenção ETOPS para suplementar o programa de manutenção
  atualmente aprovado para o detentor de certificado. Este programa de manutenção ETOPS deve
  incluir os seguintes elementos:

