title: 136.13(a)
text: '(a) Toda organização certificada segundo este Regulamento está sujeita a atividades
  de

  fiscalização realizadas pela ANAC, à distância ou presenciais, com ou sem aviso prévio,
  a fim de

  verificar o cumprimento deste e de quaisquer outros regulamentos aplicáveis.'
