title: 136.13(b)
text: '(b) O detentor de certificado deve, sempre que solicitado e no prazo determinado na
  solicitação,

  fornecer à ANAC quaisquer documentos ou informações relevantes para a realização das atividades

  de fiscalização acima previstas.'
