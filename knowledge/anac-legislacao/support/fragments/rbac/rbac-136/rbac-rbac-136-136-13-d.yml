title: 136.13(d)
text: '(d) O detentor de certificado deve manter disponível para apresentação à ANAC ou a
  qualquer

  outra autoridade competente, em sua(s) base(s) operacional(is) ou em sua sede, toda a

  documentação pertinente para comprovar o cumprimento dos requisitos deste Regulamento.


  Data da emissão: 24 de junho de 2020.'
