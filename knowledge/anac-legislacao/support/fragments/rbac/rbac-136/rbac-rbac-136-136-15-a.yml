title: 136.15(a)
text: '(a) O detentor de certificado deve providenciar para que os documentos requeridos pelos

  parágrafos 91.203(a)(1), (a)(5), (a)(6), (a)(7) e (a)(12) do RBAC nº 91 estejam disponíveis
  no local

  de operação, não sendo necessário tê-los a bordo da aeronave durante as operações.'
