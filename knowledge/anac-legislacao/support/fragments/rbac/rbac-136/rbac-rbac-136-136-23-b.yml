title: 136.23(b)
text: '(b) O manual de operações deve conter, no mínimo:

  (1) a descrição das atribuições e responsabilidades de todas as pessoas empregadas pelo

  detentor de certificado, incluindo as previstas na seção 136.37 deste Regulamento, especificando

  quais assuntos cada uma delas poderá tratar diretamente com a ANAC em nome do detentor de

  certificado;

  (2) a descrição das regras de conduta aplicáveis aos funcionários, bem como a política a
  ser

  adotada pelo detentor de certificado no caso de descumprimento dessas regras;

  (3) a descrição dos procedimentos que serão utilizados para a capacitação inicial e periódica

  dos pilotos, bem como para o registro e controle da validade de suas licenças, habilitações
  e

  certificados médicos aeronáuticos (CMA);

  (4) os procedimentos padronizados para a realização do voo panorâmico, que devem incluir,

  no mínimo:'
