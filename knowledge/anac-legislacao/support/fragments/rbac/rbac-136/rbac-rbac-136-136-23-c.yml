title: 136.23(c)
text: '(c) O gestor responsável do detentor de certificado deve garantir que todo o seu pessoal
  tenha

  fácil acesso à cópia mais atualizada das partes do manual de operações relativas às suas
  funções, e

  que cada pessoa seja informada e orientada sobre quaisquer alterações no manual aplicáveis
  às suas

  atividades.'
