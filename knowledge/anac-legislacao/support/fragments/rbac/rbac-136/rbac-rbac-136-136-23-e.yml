title: 136.23(e)
text: '(e) Quaisquer emendas realizadas pelo detentor de certificado em seu manual de operações

  devem ser encaminhadas à ANAC em, no mínimo, 10 (dez) dias corridos antes da data prevista
  para

  sua entrada em vigor. A entrada em vigor de uma emenda ao manual de operações não depende
  de

  aprovação prévia da ANAC. No entanto, caso a qualquer momento a ANAC identifique no manual

  de operações o descumprimento de norma regulamentar ou a existência de procedimento que
  cause

  deterioração da segurança operacional, poderá determinar ao operador que emende o manual
  de

  operações conforme necessário, sem prejuízo das sanções administrativas e legais cabíveis.'
