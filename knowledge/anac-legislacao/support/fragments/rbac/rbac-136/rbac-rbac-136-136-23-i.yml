title: 136.23(i)
text: '(i) procedimentos para identificação e registro dos ocupantes da aeronave, contendo:

  (A) número do documento de identificação dos ocupantes da aeronave (RG, CPF ou

  outro);

  (B) informações de contato em caso de emergência; e

  (C) procedimentos para arquivamento pelo detentor de certificado das informações

  acima por, no mínimo, 5 (cinco) anos;

  (ii) procedimentos para prestação de informações e orientações aos ocupantes da aeronave;

  (iii) procedimentos para acesso à área operacional e embarque na aeronave;

  (iv) os procedimentos que serão utilizados para despachar a aeronave antes cada voo, de

  modo a garantir o cumprimento de todos os requisitos de aeronavegabilidade, autonomia, peso
  e

  balanceamento, e documentação; e'
