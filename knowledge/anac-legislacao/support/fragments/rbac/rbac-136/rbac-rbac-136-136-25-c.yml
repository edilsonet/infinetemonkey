title: 136.25(c)
text: '(c) O gestor responsável do requerente ou detentor de certificado deve implantar um
  SGSO

  compatível com o tamanho, natureza e complexidade das operações a serem conduzidas na

  organização, considerando suas EO e os perigos e riscos relacionados com suas atividades.'
