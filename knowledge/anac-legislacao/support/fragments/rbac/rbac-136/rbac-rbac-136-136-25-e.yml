section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: e
cite: 136.25(e)
title: 136.25(e)
text: '(e) O gestor responsável do detentor de certificado deve garantir que todo o seu pessoal
  tenha

  fácil acesso à cópia mais atualizada das partes do MGSO relativas às suas funções, e que
  cada

  pessoa seja informada e orientada sobre quaisquer alterações ao MGSO aplicáveis às suas

  atividades.


  Data da emissão: 24 de junho de 2020.'
