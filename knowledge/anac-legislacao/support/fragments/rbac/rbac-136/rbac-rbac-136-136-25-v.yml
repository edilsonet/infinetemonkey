section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: v
cite: 136.25(v)
title: 136.25(v)
text: '(v) descrição da documentação que suporta o SGSO, incluindo o MGSO:

  (A) o detentor de certificado deve desenvolver e manter atualizada a documentação do

  SGSO que descreva:

  ( 1 ) a política e os objetivos de segurança operacional;

  ( 2 ) os requisitos de segurança operacional do SGSO;

  ( 3 ) os processos e procedimentos do SGSO;

  ( 4 ) as obrigações, responsabilidades e atribuições dos membros da organização em

  relação aos processos e procedimentos do SGSO; e

  ( 5 ) os registros do SGSO e os respectivos controles necessários para sua

  identificação, armazenamento, proteção, retenção e descarte; e

  (B) O detentor de certificado deve desenvolver e manter atualizado um manual de

  gerenciamento da segurança operacional (MGSO), que é parte do manual geral da organização,

  como parte da documentação de seu SGSO;

  (2) gerenciamento de riscos à segurança operacional:'
