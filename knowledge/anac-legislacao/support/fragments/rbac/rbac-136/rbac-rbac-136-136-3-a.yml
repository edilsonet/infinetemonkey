cite: 136.3(a)
title: 136.3(a)
text: '(a) Para os propósitos deste Regulamento são válidas as definições do RBAC nº 01, 61,
  91 e as

  definições elencadas abaixo:

  (1) base operacional significa o(s) local(is) onde a organização desenvolve o voo

  panorâmico;

  (2) certificação significa processo de reconhecimento pela ANAC de que a organização

  avaliada tem capacidade para exercer a atividade de SAE-panorâmico;

  (3) distância em regime autorrotacional significa a distância horizontal que uma aeronave

  de asas rotativas pode percorrer no regime autorrotacional previsto pelo fabricante no manual
  de

  voo aprovado;

  (4) distância de planeio significa a distância horizontal de uma aeronave de asa fixa pode

  percorrer com o(s) motor(es) desligado(s), conforme descrito pelo fabricante no manual de
  voo

  aprovado;

  (5) linha costeira significa a área da terra adjacente à água de um oceano, mar, lago, lagoa,

  rio ou bacia de maré que está acima da marca d''água máxima na qual uma aeronave de rotor
  poderia

  ser desembarcada com segurança. Isso não inclui áreas de terra inadequadas para aterrissagem,

  como falésias verticais ou terras intermitentemente sob a água;

  (6) sede do detentor de certificado significa o local principal onde a organização mantém
  a

  sua administração; e

  (7) serviço aéreo especializado público na modalidade de voo panorâmico (SAE-

  panorâmico) significa o serviço aéreo remunerado, que tenha como objetivo proporcionar passeio

  aéreo turístico ao público em geral, realizado em equipamentos devidamente certificados
  e por

  pessoal habilitado, devendo ser realizado obrigatoriamente com decolagem e pouso no mesmo

  ponto, sem pouso em pontos intermediários, conforme definido na Resolução nº 377, de 15
  de

  março de 2016.'
