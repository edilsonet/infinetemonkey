text: '(b) O detentor de certificado deve demonstrar que os aeródromos, ou áreas de pouso
  e

  decolagem não cadastradas (para helicópteros, hidroaviões ou aeronaves anfíbias), utilizados
  para a

  realização de voos panorâmicos, possuem condições apropriadas à operação de suas aeronaves.'
