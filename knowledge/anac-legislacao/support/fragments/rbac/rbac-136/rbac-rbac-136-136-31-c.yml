cite: 136.31(c)
title: 136.31(c)
text: '(c) A área de pouso e decolagem não cadastrada para helicópteros, hidroaviões ou aeronaves

  anfíbias deve fornecer ao operador capacidade razoável para pousar sem danificar o equipamento

  ou ferir pessoas. As áreas de desembarque adequadas devem ser específicas do local, designadas

  pelo operador e aceitas pela ANAC. Essas áreas devem possuir uma área de pouso de emergência

  para um helicóptero monomotor ou multimotor que não tem capacidade para alcançar uma área
  de

  pouso segura após uma perda de potência do motor.'
