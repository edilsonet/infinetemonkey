cite: 136.31(d)
title: 136.31(d)
text: '(d) Pousos e decolagens de helicópteros em locais não homologados ou registrados podem
  ser

  realizados, sob total responsabilidade do operador e do piloto em comando, desde que:

  (1) o local conste das EO do operador;

  (2) a operação seja realizada em condições VMC e sob regras de voo VFR diurno;

  (3) o local possua as dimensões adequadas para o pouso e a decolagem seguros conforme

  envelope operacional da aeronave e o devido gerenciamento risco;

  (4) haja uma avaliação quanto à inclinação e à natureza do terreno;

  (5) as rotas de aproximação e de subida escolhidas não exponha a aeronave a riscos;

  (6) a capacidade de carga (estática e dinâmica) da superfície em que será realizado o pouso,

  possua resistência suficiente para permitir o pouso, estacionamento e/ou taxiamento no solo
  sem

  danos à aeronave, aos ocupantes e a terceiros;

  (7) o operador realize um gerenciamento de risco de forma a garantir um nível aceitável
  de

  segurança da operação, da aeronave, de seus ocupantes e de terceiros, incluindo avaliação
  do risco

  de colisão dos rotores, hélices ou qualquer componente da aeronave com obstáculos, pessoas
  ou

  animais;

  (8) a margem de potência disponível do motor esteja dentro dos limites do manual de voo

  aprovado, inclusive sob altas temperaturas, grandes altitudes e/ou com atmosfera turbulenta;

  (9) os parâmetros de desempenho previstos no manual de voo aprovado ou no manual de

  operação da aeronave (AOM) sejam mantidos dentro dos limites aprovados;

  (10) haja uma avaliação quanto ao risco de colisão da aeronave com objetos soltos no terreno;

  (11) seja realizado um briefing com os passageiros sobre os procedimentos normais e de

  emergência, bem como a orientação sobre a forma adequada de embarque e desembarque na

  aeronave; e

  (12) sejam cumpridos os demais requisitos para operação da seção 91.329 do RBAC nº 91.'
