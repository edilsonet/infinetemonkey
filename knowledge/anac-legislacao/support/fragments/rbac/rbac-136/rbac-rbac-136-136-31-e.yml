title: 136.31(e)
text: '(e) Pousos e decolagens de hidroaviões ou aeronaves anfíbias em áreas não cadastradas
  na água

  podem ser realizados, sob total responsabilidade do operador, desde que:

  (1) o local conste das EO do operador; e


  Data da emissão: 24 de junho de 2020.


  (2) sejam cumpridos os demais requisitos para operação da seção 91.331 do RBAC nº 91.'
