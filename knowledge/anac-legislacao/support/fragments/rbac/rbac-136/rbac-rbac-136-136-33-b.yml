cite: 136.33(b)
title: 136.33(b)
text: '(b) O detentor de certificado deverá constar no Registro Aeronáutico Brasileiro (RAB)
  como

  operador da aeronave utilizada para a realização de voo panorâmico.

  (1) A aeronave poderá possuir mais de um operador, mediante registro de contrato de

  intercâmbio operacional junto ao RAB e autorização para celebração do contrato de intercâmbio
  nas

  EO.

  (2) Caso a aeronave possua mais de um operador, o detentor de certificado deverá garantir

  que a aeronave esteja disponível em seu local de operação durante as fiscalizações agendadas.'
