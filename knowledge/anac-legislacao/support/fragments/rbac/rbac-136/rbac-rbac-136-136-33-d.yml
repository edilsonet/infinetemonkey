cite: 136.33(d)
title: 136.33(d)
text: '(d) Cada aeronave utilizada pelo detentor de certificado para realizar voo panorâmico
  deve:

  (1) possuir certificado de aeronavegabilidade padrão ou certificado de aeronavegabilidade

  especial na categoria primária e certificado de matrícula válidos, emitidos pela ANAC; e

  (2) ser mantida e inspecionada conforme os requisitos aplicáveis da Subparte E do RBAC nº

  91.'
