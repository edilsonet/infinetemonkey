cite: 136.33(e)
title: 136.33(e)
text: '(e) O piloto do detentor de certificado deve, antes de cada voo panorâmico, certificar-se
  que a

  aeronave se encontra aeronavegável, com a autonomia adequada para o voo, mantida em obediência

  aos requisitos de aeronavegabilidade, dentro dos limites de desempenho aprovados da aeronave

  quanto ao peso e balanceamento, e possuir a bordo toda a documentação requerida para o voo,

  seguindo o procedimento de despacho previsto no manual de operação.'
