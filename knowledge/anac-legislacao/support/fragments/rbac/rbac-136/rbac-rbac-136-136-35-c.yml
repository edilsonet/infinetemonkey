title: 136.35(c)
text: '(c) O detentor de certificado que pretender mudar um de seus endereços deve solicitar
  à ANAC

  uma emenda ao seu certificado e às suas EO. Deve ainda, caso necessário, adequar seu sistema
  de

  manuais.'
