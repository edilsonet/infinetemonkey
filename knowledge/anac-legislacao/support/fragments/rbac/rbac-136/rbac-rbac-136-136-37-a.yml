cite: 136.37(a)
title: 136.37(a)
text: '(a) O detentor de certificado deve contar com uma estrutura de administração que lhe
  permita o

  controle de todos os níveis da organização por meio de pessoas que possuam a formação, a

  experiência e as qualificações necessárias para garantir a manutenção do nível aceitável
  de

  segurança.'
