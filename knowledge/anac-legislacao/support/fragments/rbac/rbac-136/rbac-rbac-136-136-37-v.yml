cite: 136.37(v)
title: 136.37(v)
text: '(v) assegurar que as tomadas de decisão dos demais gestores sejam orientadas por um

  processo institucionalizado de avaliação de riscos, considerando os impactos potenciais
  de suas

  decisões para a segurança operacional;

  (vi) conduzir análises críticas da gestão do SGSO, visando assegurar a melhoria contínua

  do sistema;

  (vii) rever regularmente o desempenho de segurança operacional do detentor de

  certificado, e tomar as medidas necessárias para tratamento de eventual desempenho insatisfatório

  de segurança operacional;

  (viii) assegurar que as prerrogativas e responsabilidades acerca do gerenciamento da

  segurança operacional sejam clara e objetivamente estabelecidas e comunicadas em todas as
  áreas

  da organização do detentor de certificado;

  (ix) assegurar que todo o pessoal da organização envolvido em atividades com impacto na

  segurança operacional cumpra com os requisitos aplicáveis e critérios internos de competência,

  experiência e treinamento para o exercício de suas prerrogativas e responsabilidades;'
