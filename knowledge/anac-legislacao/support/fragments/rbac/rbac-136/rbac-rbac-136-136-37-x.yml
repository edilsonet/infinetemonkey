cite: 136.37(x)
title: 136.37(x)
text: '(x) assegurar que os objetivos da segurança operacional sejam estabelecidos, e que
  sejam

  mensuráveis e alinhados com a política da segurança operacional;

  (xi) assegurar que planos estratégicos, sistemas, manuais e demais documentos normativos

  internos relativos à gestão do SGSO sejam aprovados pelos gestores competentes;

  (xii) assegurar que sejam estabelecidos mecanismos eficazes de comunicação interna e

  com as autoridades, com relação ao desempenho e melhoria contínua do SGSO;

  (xiii) assegurar a integridade e o desempenho do SGSO, em face de mudanças internas (na

  organização ou no SGSO) ou mudanças externas que tenham impactos potenciais sobre a operação

  do detentor de certificado;

  (xiv) aprovar os manuais constantes da Subparte B deste Regulamento; e

  (xv) enviar à ANAC os relatórios periódicos previstos nos parágrafos 136.25(g) deste

  Regulamento.

  (3) O gestor responsável pode delegar, por escrito, suas atribuições a outras pessoas dentro
  da

  organização, desde que mantidas suas responsabilidades.

  (4) A designação do gestor responsável deve refletir as prerrogativas e responsabilidades

  atribuídas a essa função, em conformidade com os atos constitutivos do detentor de certificado.'
