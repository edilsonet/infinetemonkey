title: Prerrogativas do detentor de certificado
text: '136.41 Prerrogativas do detentor de certificado

  O detentor de certificado pode realizar SAE-panorâmico nos locais listados nas suas EO,
  caso o seu

  certificado não esteja suspenso ou revogado pela ANAC.'
