cite: 136.43(c)
title: 136.43(c)
text: '(c) Os ocupantes da aeronave deverão receber briefing de segurança, no mínimo nos seguintes

  assuntos:

  (1) instruções sobre o uso do cinto de segurança;

  (2) proibição de fumo a bordo;

  (3) critérios de segurança dentro e ao redor da aeronave;

  (4) localização dos extintores de incêndios e equipamentos de sobrevivência, conforme

  aplicável;

  (5) procedimentos para evacuação em emergência;

  (6) procedimentos para comunicação com a tripulação; e

  (7) outras condições de segurança julgadas pertinentes pelo detentor de certificado.'
