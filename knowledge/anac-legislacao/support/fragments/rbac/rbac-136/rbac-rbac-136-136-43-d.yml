cite: 136.43(d)
title: 136.43(d)
text: '(d) Para voos contendo segmentos sobre a água, além da distância de planeio ou em regime

  autorrotacional a partir da linha costeira, os briefings de segurança devem incluir:

  (1) procedimentos para pouso na água;

  (2) o local de armazenagem e a forma correta de vestir e inflar os coletes salva-vidas;
  e

  (3) procedimentos para evacuação de emergência na água, no caso de pouso na água.'
