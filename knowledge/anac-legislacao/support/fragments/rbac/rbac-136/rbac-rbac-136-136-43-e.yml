section_title: Obrigações e limitações do detentor de certificado
subsection_id: e
cite: 136.43(e)
title: 136.43(e)
text: '(e) Os voos panorâmicos só podem ser conduzidos por detentores de licença de piloto
  comercial

  vinculados ao detentor de certificado, devidamente habilitados e qualificados para conduzir
  a

  atividade, e com o CMA válido.

  (1) O detentor de certificado deverá realizar o controle da validade da habilitação, da

  qualificação e do CMA dos pilotos utilizados para voos panorâmicos, impedindo operações

  irregulares.'
