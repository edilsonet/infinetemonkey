section_title: Flutuadores de helicópteros para voo sobre a água
subsection_id: a
cite: 136.45(a)
title: 136.45(a)
text: '(a) Um helicóptero utilizado em voos panorâmicos sobre a água além da linha costeira
  deve estar

  equipado com flutuadores fixos ou um sistema de flutuação inflável adequado para realizar
  um

  pouso de emergência seguro na água, se:

  (1) for um helicóptero monomotor; ou

  (2) for um helicóptero multimotor que não pode ser operado com o motor crítico inoperante

  com um peso que lhe permita subir pelo menos 50 pés por minuto a uma altitude de 1.000 pés

  acima da superfície, conforme previsto no manual de voo aprovado.'
