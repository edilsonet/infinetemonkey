section_title: Flutuadores de helicópteros para voo sobre a água
subsection_id: b
cite: 136.45(b)
title: 136.45(b)
text: '(b) Cada helicóptero que precise ser equipado com um sistema de flutuação inflável
  em

  conformidade com esta seção deve possuir:

  (1) o interruptor de ativação do sistema de flutuação em um dos principais controles de
  voo; e

  (2) o sistema de flutuação armado quando o helicóptero estiver sobre a água e estiver voando

  a uma velocidade que não excede a velocidade máxima prescrita no manual de voo aprovado
  para

  voar com o sistema de flutuação armado.'
