section_title: Flutuadores de helicópteros para voo sobre a água
subsection_id: c
cite: 136.45(c)
title: 136.45(c)
text: '(c) Flutuadores fixos ou um sistema de flutuação inflável não são necessários para
  um

  helicóptero nos termos desta seção se:

  (1) o helicóptero estiver sobre a água apenas durante a parte da decolagem ou do pouso;
  ou

  (2) o helicóptero for operado a uma distância menor do que a distância em regime

  autorrotacional a partir da linha costeira durante todo o voo e se a aeronave estiver equipada
  com

  um colete salva-vidas para cada ocupante.'
