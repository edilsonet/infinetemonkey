title: 136.47(a)
text: '(a) O detentor de certificado deve arquivar:

  (1) os registros das qualificações do piloto, enquanto o piloto estiver vinculado à organização

  e até dois anos após o desligamento do piloto; e

  (2) os registros dos treinamentos inicial e periódicos de cada piloto por, pelo menos, dois

  anos.'
