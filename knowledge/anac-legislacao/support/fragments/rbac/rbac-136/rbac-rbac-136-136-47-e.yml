title: 136.47(e)
text: '(e) O detentor de certificado deve enviar, semestralmente e em formulário padrão, um
  relatório

  relacionando os acidentes, incidentes e ocorrências anormais no último período, contendo
  data,

  hora, local, aeronave e a descrição do fato, bem como as ações mitigadoras adotadas, os
  respectivos

  cronogramas e os responsáveis por sua implantação.'
