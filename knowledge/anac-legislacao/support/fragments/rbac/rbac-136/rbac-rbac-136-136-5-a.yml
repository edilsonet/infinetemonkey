cite: 136.5(a)
title: 136.5(a)
text: '(a) Somente é permitido a uma pessoa jurídica oferecer ou realizar SAE-panorâmico se
  esta

  pessoa detiver um certificado de operador aéreo (COA) de organização SAE-panorâmico e suas

  respectivas especificações operativas (EO), emitidos pela ANAC segundo este Regulamento.


  Data da emissão: 24 de junho de 2020.'
