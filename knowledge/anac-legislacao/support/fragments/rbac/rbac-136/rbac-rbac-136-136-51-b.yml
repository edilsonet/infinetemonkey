cite: 136.51(b)
title: 136.51(b)
text: '(b) Ninguém pode fazer o uso de marcas, expressões e sinais de propaganda que contenham

  informações falsas ou que induzam a erro quanto à situação jurídica da organização e das
  operações

  que requeiram aprovação segundo este Regulamento.'
