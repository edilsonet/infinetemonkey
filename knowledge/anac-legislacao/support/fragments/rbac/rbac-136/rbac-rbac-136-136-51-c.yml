section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: c
cite: 136.51(c)
title: 136.51(c)
text: '(c) O detentor de certificado deve remover todas as marcas, expressões e sinais de
  propaganda,

  onde quer que estejam localizados, e fica proibido de utilizar publicamente os impressos
  que

  contenham essas marcas, expressões e sinais de propaganda, referentes a operações que requeiram

  aprovação segundo este Regulamento e que não estejam listados em suas EO, ou cujas aprovações

  tenham sido suspensas ou revogadas pela ANAC.'
