cite: 136.51(d)
title: 136.51(d)
text: '(d) Uma organização cujo certificado tenha sido suspenso ou revogado pela ANAC deve

  prontamente remover todas as marcas, expressões e sinais de propaganda que indiquem que
  a

  organização seja certificada pela ANAC, onde quer que estejam localizados.'
