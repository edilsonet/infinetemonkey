section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: e
cite: 136.51(e)
title: 136.51(e)
text: '(e) É proibida a utilização de símbolos da ANAC, sua logomarca ou de signo semelhante
  a

  carimbo ou selo de autenticação em publicidade ou quaisquer outros documentos emitidos pela

  organização. No entanto, é permitido o uso do nome da ANAC para anunciar que a instituição
  é

  certificada e/ou que as operações de voo panorâmico são autorizadas pela ANAC, desde que
  a

  certificação da organização não esteja suspensa ou revogada e que a operação esteja autorizada
  em

  suas EO, e que não haja qualquer insinuação de que a ANAC favoreça, ratifique determinado

  contrato, recomende, patrocine ou prefira a operação realizada pelo detentor de certificado.'
