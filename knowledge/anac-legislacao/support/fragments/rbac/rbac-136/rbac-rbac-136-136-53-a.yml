cite: 136.53(a)
title: 136.53(a)
text: '(a) Toda pessoa que tiver conhecimento de qualquer acidente aeronáutico ou da existência
  de

  restos ou despojos de aeronave tem o dever de comunicá-lo à autoridade pública mais próxima
  e

  pelo meio mais rápido conforme disposto no art. 88 da Lei nº 7.565, de 19 de dezembro de
  1986.'
