cite: 136.7(b)
title: 136.7(b)
text: '(b) O requerente de um certificado deve assegurar que as instalações e equipamentos
  descritos

  em sua solicitação inicial ou de emenda atendam às provisões deste Regulamento no momento
  da

  inspeção para certificação, bem como durante todo o período em que esteja certificado.'
