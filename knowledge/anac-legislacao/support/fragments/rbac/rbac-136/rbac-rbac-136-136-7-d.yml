title: 136.7(d)
text: '(d) A ANAC pode indeferir o pedido de certificação ou de emenda ao certificado se:

  (1) um certificado anteriormente emitido para o requerente segundo o RBAC nº 119, 137 ou

  141 tiver sido cassado nos últimos cinco anos por descumprimento à regulamentação ou por
  fraude;

  ou

  (2) evidenciar que o requerente:'
