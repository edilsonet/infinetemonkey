section_title: Solicitação, emissão e emenda do certificado e de suas respectivas EO
subsection_id: e
cite: 136.7(e)
title: 136.7(e)
text: '(e) A ANAC pode emendar um certificado ou suas EO em vigor, por:

  (1) iniciativa da própria ANAC, caso considere que a segurança da operação ou o interesse

  público requeiram a emenda determinada; ou

  (2) solicitação de seu detentor, desde que aprovada pela ANAC.'
