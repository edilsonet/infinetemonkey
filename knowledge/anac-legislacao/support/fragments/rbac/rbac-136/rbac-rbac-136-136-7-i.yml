text: '(i) os modelos das aeronaves autorizadas a realizar a operação SAE-panorâmico;

  (ii) as bases operacionais e locais autorizados para a realização dos voos panorâmicos;

  (iii) as autorizações e limitações segundo as quais as operações devem ser conduzidas; e

  (iv) outras informações relevantes a respeito das operações, a critério da ANAC.'
