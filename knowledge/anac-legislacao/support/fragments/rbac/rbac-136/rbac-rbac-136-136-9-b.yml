title: 136.9(b)
text: '(b) A ANAC pode revogar um certificado em vigor se:

  (1) o detentor de um certificado suspenso não regularizar as causas que deram origem à

  suspensão em até 180 dias contados a partir da data da suspensão;

  (2) for constatado que o detentor de um certificado não cumpre algum dos requisitos deste

  Regulamento e que não tem interesse ou capacidade para regularizar a situação; ou

  (3) evidenciar que o detentor do certificado:'
