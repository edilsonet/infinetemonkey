section_title: Suspensão ou revogação do certificado
subsection_id: i
cite: 136.9(i)
title: 136.9(i)
text: '(i) possui alguma condição que represente um risco inaceitável para a segurança

  operacional de suas atividades;

  (ii) deixou de implementar, dentro do prazo concedido pela ANAC, medidas corretivas em

  relação a não conformidades encontradas; ou

  (iii) deixou de notificar à ANAC alterações em suas condições originais de certificação

  cuja notificação seja requerida por este Regulamento.'
