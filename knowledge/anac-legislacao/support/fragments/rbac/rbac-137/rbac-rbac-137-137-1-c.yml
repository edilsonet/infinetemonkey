cite: 137.1(c)
title: 137.1(c)
text: '(c) As operações aeroagrícolas conduzidas no Brasil por pessoas físicas ou jurídicas
  devem atender, além do disposto neste Regulamento, aos requisitos contidos no RBAC nº 91
  e demais normas aplicáveis.

  (1) Operações utilizando aeronaves remotamente pilotadas estão dispensadas do cumprimento
  das subpartes C, D e F deste Regulamento.'
