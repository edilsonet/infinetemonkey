cite: 137.1(f)
title: 137.1(f)
text: '(f) Operadores de helicópteros conduzindo exclusivamente operações aeroagrícolas com
  dispensadores externos fixos instalados na aeronave não necessitam cumprir com os requisitos
  do RBAC nº 133.

  Nota 1

  : Recomenda-se que o operador aeroagrícola siga o Guia de Boas Práticas para Operações Aeroagrícolas.

  Nota 2

  : A fiscalização de todas as regras, critérios e procedimentos estabelecidos nas normas
  do Comando da Aeronáutica não é da competência da ANAC e este Regulamento não dispensa o
  seu cumprimento.'
