cite: 137.101(b)
title: 137.101(b)
text: (b) Um operador somente pode conduzir uma operação aeroagrícola remunerada ou em proveito
  de terceiros, em acordo com este regulamento, após o recebimento do CDAG pela ANAC, enquanto
  ele estiver válido, e após a publicação da Portaria que torna público o cumprimento dos
  requisitos para a exploração do serviço aéreo aeroagrícola, sem prejuízo de cumprimento
  de outras regulamentações ou legislações aplicáveis.
