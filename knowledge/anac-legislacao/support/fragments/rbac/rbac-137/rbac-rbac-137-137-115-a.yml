cite: 137.115(a)
title: 137.115(a)
text: '(a) A ANAC pode atualizar qualquer CDAG emitido segundo este Regulamento nos seguintes
  casos:

  (1) unilateralmente, se for verificado, por meio de inspeção, demonstração ou outro tipo
  de apuração, que uma atualização é necessária; ou

  (2) a pedido, se o seu detentor requerer a atualização e a ANAC verificar que a atualização
  é pertinente.'
