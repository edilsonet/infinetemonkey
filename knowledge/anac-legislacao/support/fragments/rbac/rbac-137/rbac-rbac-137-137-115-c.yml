title: 137.115(c)
text: (c) Quando um detentor de CDAG solicitar reconsideração de uma decisão tomada pela ANAC
  referente à atualização de seu CDAG, a petição para reconsideração deve ser encaminhada
  à ANAC dentro de 30 dias após a data em que o detentor for notificado da decisão.
