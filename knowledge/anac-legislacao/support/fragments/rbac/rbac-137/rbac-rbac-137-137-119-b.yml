section_title: Sede administrativa e mudança de endereço
subsection_id: b
cite: 137.119(b)
title: 137.119(b)
text: (b) Caso o detentor de um CDAG pretenda mudar o endereço de sua sede administrativa,
  deve apresentar requerimento à ANAC com uma antecedência de, pelo menos, 30 dias da data
  para a efetivação da mudança.
