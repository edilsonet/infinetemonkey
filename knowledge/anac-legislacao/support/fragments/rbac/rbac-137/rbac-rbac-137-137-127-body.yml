  137.201(a)(5)

  Transporte de pessoa não envolvida

  10.400

  18.200

  26.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada ocorrência. Suspensão
  ou cassação da licença do piloto em comando, a depender da gravidade da conduta. O prazo
  de suspensão punitiva será calculado tomando como base o período de 60 (sessenta) dias,
  decrescido e/ou acrescido de períodos de 20 (vinte) dias, respectivamente, para cada circunstância
  atenuante e/ou agravante verificada, observado o mínimo de 20 (vinte) e o máximo de 120
  (cento e vinte) dias.

