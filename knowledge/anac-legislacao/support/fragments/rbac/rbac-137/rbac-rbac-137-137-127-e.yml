title: 137.127(e)
text: '(e) Uma vez que o detentor de CDAG tome conhecimento da inaptidão, segundo as disposições
  do parágrafo (d) desta seção, de um gestor responsável já designado e em exercício de suas
  funções, ele deve providenciar a sua substituição no prazo de 30 (trinta) dias, exceto se
  a ANAC aprovar um prazo maior mediante solicitação justificada do operador.

  SUBPARTE C

  REGRAS PARA AS OPERAÇÕES AEROAGRÍCOLAS'
