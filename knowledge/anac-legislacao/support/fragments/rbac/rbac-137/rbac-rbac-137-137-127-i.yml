title: 137.127(i)
text: '(i) suspensão ou restrição das operações, por mais de 90 (noventa) dias, pela ANAC;
  ou

  (ii) cassação ou cancelamento de certificados ou autorizações; ou

  (2) tenha sofrido sanção administrativa descrita no art. 299, incisos I, V, VI ou VII, da
  Lei nº 7.565, de 19 de dezembro de 1986, ainda que, na ocasião, não ocupasse posição administrativa
  requerida pela ANAC para provedor de serviço de aviação civil.'
