cite: 137.201(b)
title: 137.201(b)
text: '(b) Um operador somente poderá utilizar um equipamento específico em operações aeroagrícolas
  se:

  (1) a instalação deste equipamento na aeronave tiver sido aprovada pela ANAC, quando se
  tratar de grande alteração de projeto; e

  (2) existir, à disposição do piloto e do pessoal de manutenção, o manual ou documento técnico
  pertinente, necessário aos procedimentos de instalação e operação do equipamento, adequado
  à aeronave na qual pode ser instalado.'
