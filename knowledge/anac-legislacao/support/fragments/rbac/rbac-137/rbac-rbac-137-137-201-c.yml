cite: 137.201(c)
title: 137.201(c)
text: (c) Toda aeronave deve ser equipada com dispositivo de alijamento de carga, capaz de
  alijar, em emergência, pelo menos metade da carga máxima em estado líquido aprovada para
  a aeronave, no tempo de 5 (cinco) segundos, se monomotor, e 10 (dez) segundos, se multimotor.
