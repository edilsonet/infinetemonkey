cite: 137.201(f)
title: 137.201(f)
text: (f) Um operador aeroagrícola somente poderá realizar o abastecimento de sua aeronave
  (combustível e produto) com o motor ligado se não houver vedação no manual aprovado da aeronave
  e se o operador e o piloto em comando considerarem que o procedimento está dentro de um
  nível de risco aceitável.
