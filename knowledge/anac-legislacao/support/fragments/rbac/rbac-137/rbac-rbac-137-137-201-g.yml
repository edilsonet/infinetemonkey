title: 137.201(g)
text: '(g) Somente é permitido começar uma operação aeroagrícola se:

  (1) para operações de translado de ou para o local de operação: forem cumpridos os requisitos
  do RBAC nº 91; e

  (2) para as demais operações: considerando vento e condições meteorológicas conhecidas,
  houver combustível e óleo suficiente para a operação prevista, mais o combustível de contingência
  determinado pelo operador.'
