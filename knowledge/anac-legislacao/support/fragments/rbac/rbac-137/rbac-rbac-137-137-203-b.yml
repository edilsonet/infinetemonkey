title: 137.203(b)
text: (b) O operador aeroagrícola deve garantir que as tarefas executadas sejam realizadas
  de acordo com as instruções de manutenção do fabricante, com a utilização de dados técnicos
  aprovados e ferramentas e instalações adequadas.
