title: 137.203(c)
text: (c) Um operador aéreo que seja detentor de um CDAG pode contratar um mecânico de manutenção
  aeronáutica, habilitado em célula e grupo motopropulsor, para realizar manutenção no local
  da operação aeroagrícola.
