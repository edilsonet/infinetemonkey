text: (a) Somente podem ser designados para realizar operações aeroagrícolas em aeronaves
  tripuladas pilotos agrícolas habilitados conforme o RBAC nº 61 e com Certificado Médico
  Aeronáutico (CMA), emitido segundo o RBAC nº 67, válido.
