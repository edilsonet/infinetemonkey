cite: 137.207(b)
title: 137.207(b)
text: (b) Um piloto somente pode ser designado para uma operação aeroagrícola depois de ter
  sido submetido a treinamento(s) adequado(s) para a atividade. O(s) treinamento(s) deve(m)
  garantir que o piloto se mantenha adequadamente qualificado para a operação e familiarizado
  com as peculiaridades do local da operação, da aeronave e do operador. Além disso, devem
  incluir aspectos de prevenção à distração do piloto devido a fatores físicos, auditivos,
  visuais e cognitivos, aspectos de gerenciamento de recursos de cabine com tripulação simples,
  os perigos já conhecidos pelo operador e as lições aprendidas ao longo do tempo com o gerenciamento
  de risco previsto na seção 137.215 deste Regulamento.
