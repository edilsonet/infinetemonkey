cite: 137.209(a)
title: 137.209(a)
text: '(a) Uma operação aeroagrícola somente é permitida se cada tripulante estiver utilizando:

  (1) cintos e suspensórios de segurança devidamente colocados e ajustados;

  (2) quando aplicando produtos tóxicos, máscara para respiração com filtro de proteção contra
  a inalação de tais produtos;

  (3) capacete antichoque, dotado de dispositivos para fixação de viseiras e abafadores de
  ruído; e

  (4) calçados fechados.'
