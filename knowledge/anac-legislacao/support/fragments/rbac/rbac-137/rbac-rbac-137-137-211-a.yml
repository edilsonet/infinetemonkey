section_title: Operações sobre áreas densamente povoadas
subsection_id: a
cite: 137.211(a)
title: 137.211(a)
text: (a) Exceto nos casos de controle de vetores e observadas as normas legais pertinentes,
  é vedado operar uma aeronave contendo produtos químicos sobre áreas densamente povoadas,
  sobre embarcações ou sobre aglomerações de pessoas ao ar livre.
