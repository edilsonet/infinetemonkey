title: 137.213(a)
text: (a) Somente é permitido conduzir operações aeroagrícolas noturnas, quaisquer que sejam
  as condições meteorológicas existentes, se respeitados os requisitos estabelecidos no parágrafo
  91.205(c) e na seção 91.209 do RBAC nº 91.
