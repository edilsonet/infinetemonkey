title: 137.3(a)
text: '(a) Para os propósitos deste Regulamento são válidas as definições do RBAC nº 01 e
  as definições abaixo:

  (1)

  área de pouso para uso aeroagrícola

  significa uma área destinada a ser utilizada para pouso e decolagem restrito à atividade
  aeroagrícola ou outros empregos correlatos;

  (2)

  Cadastro de Aeroagrícola (CDAG)

  significa um documento emitido pela ANAC que comprova que um operador foi submetido ao processo
  de cadastramento estabelecido pela ANAC e cumpre com os requisitos regulamentares estabelecidos
  para a operação pretendida;

  (3) [reservado];

  (4)

  emergência

  significa qualquer evento que possua a potencialidade de causar grandes danos, desordem,
  paralisar ou impactar de forma significativa as atividades do operador aeroagrícola por
  período considerável de tempo, podendo envolver situação econômica, política, social, conjuntural
  ou de qualquer outra natureza;

  (5) [reservado];

  (6) [reservado];

  (7) [reservado];

  (8) [reservado];

  (9) [reservado];

  (10) [reservado];

  (11) [reservado];

  (12) [reservado];

  (13)

  operação aeroagrícola

  significa a operação aérea que tenha por fim proteger ou fomentar o desenvolvimento da agricultura
  em qualquer de seus aspectos, mediante a aplicação em voo de fertilizantes, sementes, inseticidas,
  herbicidas e outros defensivos. Para efeitos deste Regulamento, dentre as operações aeroagrícolas
  incluem-se as operações de povoamento de águas, combate a incêndios em campos e florestas,
  provocação artificial de chuvas, modificação artificial de clima, combate a insetos, combate
  a vetores de doenças ou outros empregos correlatos;

  (14)

  operação aeroagrícola noturna

  significa operação realizada no período compreendido entre 30 (trinta) minutos após o pôr
  do sol e 30 (trinta) minutos antes do nascer do sol;

  (15) [reservado];

  (16) [reservado];

  (17) [reservado];

  (18) [reservado];

  (19) [reservado];

  (20) [reservado];

  (21) [reservado]; e

  (22)

  sede administrativa

  significa o local onde o detentor de CDAG emitido segundo este Regulamento centraliza a
  maior parte das suas atividades de direção e gerenciamento técnico-operacional.'
