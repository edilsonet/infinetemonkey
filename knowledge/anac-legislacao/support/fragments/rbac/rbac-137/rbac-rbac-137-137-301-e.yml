cite: 137.301(e)
title: 137.301(e)
text: '(e) A operação de uma aeronave em área de pouso para uso aeroagrícola somente é permitida
  se:

  (1) a operação for exclusiva de atividades aeroagrícolas;

  (2) o proprietário da área concordar com sua construção e utilização;

  (3) [reservado];

  (4) a área a ser utilizada atender às exigências para operação, com segurança, da aeronave
  em seu máximo desempenho, de acordo com o respectivo manual de voo aprovado; e

  (5) não for proibido, por qualquer dispositivo legal ou regulamentar, o uso da área escolhida.'
