title: 137.303(b)
text: '(b) A operação aeroagrícola somente é permitida em aeródromos nas seguintes condições:

  (1) o proprietário ou operador do aeródromo cadastrado tenha concordado com sua utilização
  e garanta a infraestrutura e procedimentos operacionais adequados;

  (2) [reservado]; e

  (3) não seja proibida por qualquer dispositivo legal ou regulamentar.

  SUBPARTE E

  [RESERVADO]

  SUBPARTE F

  DOCUMENTAÇÃO'
