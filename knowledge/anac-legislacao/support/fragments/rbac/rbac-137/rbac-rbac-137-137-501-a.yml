cite: 137.501(a)
title: 137.501(a)
text: '(a) O operador aeroagrícola deve providenciar para que os seguintes documentos estejam
  disponíveis, no local de operação, não sendo necessário tê-los a bordo da aeronave durante
  as operações aeroagrícolas:

  (1) certificado de matrícula;

  (2) certificado de aeronavegabilidade;

  (3) ficha de peso e balanceamento;

  (4) certificado de verificação de aeronavegabilidade (CVA) ou, conforme permitido pelo parágrafo
  91.403(f) do RBAC nº 91, laudo de vistoria de aeronave;

  (5) manual de voo aprovado ou o manual de operação da aeronave (AOM);

  (6) [reservado];

  (7) [reservado];

  (8) apólice de seguro, se exigível;

  (9) licença de estação, se aplicável; e

  (10) diário de bordo.'
