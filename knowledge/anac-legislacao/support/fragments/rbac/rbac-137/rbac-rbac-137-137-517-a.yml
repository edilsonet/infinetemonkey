title: 137.517(a)
text: '(a) O detentor de CDAG deve conservar por, no mínimo, 5 (cinco) anos, contados da respectiva
  data de emissão, em sua sede administrativa, e disponibilizar aos servidores da ANAC, quando
  requerido:

  (1) e (2) [reservado];

  (3) uma lista atualizada de cada aeronave (tipo, matrícula e número de série) operada, detalhando
  as suas capacidades e autorizações, de forma a garantir que somente aeronaves capacitadas
  são designadas para as operações autorizadas; e

  (4) um registro individual de cada piloto empregado em operações segundo este Regulamento,
  incluindo:'
