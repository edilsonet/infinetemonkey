cite: 137.521(j)
title: 137.521(j)
text: (j) No caso de operações aeroagrícolas, os dados referentes a uma jornada de trabalho
  do piloto podem ser registrados em uma única linha do diário de bordo. Caso haja interrupção
  da jornada, conforme previsto na Lei 13.475, de 28 de agosto de 2017, os dados de cada etapa
  da jornada devem ser registrados em linhas separadas do diário de bordo.
