cite: B137.1(a)
title: B137.1(a)
text: '(a) As violações ao previsto neste Regulamento sujeitam o infrator às providências
  administrativas constantes no Art. 289 do Código Brasileiro de Aeronáutica, Lei nº 7.565,
  de 19 de dezembro de 1986, a serem apuradas em conformidade com o procedimento descrito
  na Resolução nº 472, de 2018, ou em outro normativo que a substituir, adotando-se para as
  infrações praticadas os valores de multa previstos na Tabela 1 deste Apêndice.

  Tabela 1

  : Infrações relacionadas às operações aeroagrícolas

  Referência

  Descrição

  Valores em reais

  Incidência da sanção

  Mínimo

  Intermediário

  Máximo

  137.9(a)

  Utilização do nome comercial

  7.200

  12.600

  18.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada fiscalização.

  137.101(b)

  Operação sem o CDAG

  4.000

  7.000

  10.000

  Multa, nos valores da tabela, para o operador da aeronave, por aeronave, por cada dia de
  operação. A depender da gravidade da conduta, conforme avaliada pela área técnica, à penalidade
  de multa poderá ser acrescida a suspensão punitiva do Certificado de Aeronavegabilidade
  (CA) da aeronave, na razão de dois dias a cada dia de operação sem ter o CDAG válido.

  137.115(d)

  CDAG atualizado

  1.600

  2.800

  4.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada ocorrência.

  137.117(a)

  Obrigações do detentor de CDAG

  1.600

  2.800

  4.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada ocorrência.'
