  137.9(a)

  Utilização do nome comercial

  7.200

  12.600

  18.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada fiscalização.

  137.101(b)

  Operação sem o CDAG

  4.000

  7.000

  10.000

  Multa, nos valores da tabela, para o operador da aeronave, por aeronave, por cada dia de
  operação. A depender da gravidade da conduta, conforme avaliada pela área técnica, à penalidade
  de multa poderá ser acrescida a suspensão punitiva do Certificado de Aeronavegabilidade
  (CA) da aeronave, na razão de dois dias a cada dia de operação sem ter o CDAG válido.

  137.115(d)

  CDAG atualizado

  1.600

  2.800

  4.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada ocorrência.

  137.117(a)

  Obrigações do detentor de CDAG

  1.600

  2.800

  4.000

  Multa, nos valores da tabela, para o operador da aeronave, para cada ocorrência.'
