cite: 139.1(a)
title: 139.1(a)
text: '(a) Este Regulamento é de cumprimento obrigatório pelo operador de aeródromo que atua
  em aeródromo civil que seja destinado às aeronaves nacionais ou estrangeiras na realização
  de serviços internacionais, regulares ou não regulares.

  (1) A ANAC poderá estabelecer obrigação de obtenção de Certificado Operacional de Aeroporto
  a qualquer aeródromo civil quando identificado risco à segurança das operações que justifique.'
