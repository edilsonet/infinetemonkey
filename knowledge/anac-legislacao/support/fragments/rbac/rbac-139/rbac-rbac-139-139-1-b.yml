cite: 139.1(b)
title: 139.1(b)
text: (b) Operador de aeródromo que processe ou pretenda processar operações regulares domésticas
  regidas pelo RBAC nº 121 e que não seja obrigado a ser detentor de Certificado Operacional
  de Aeroporto deverá cumprir elementos mínimos de infraestrutura e de segurança operacional
  estabelecidos em ato específico a ser publicado pela Superintendência responsável pela infraestrutura
  aeroportuária.
