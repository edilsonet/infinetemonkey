title: 139.1(c)
text: (c) O operador de aeródromo e demais pessoas, naturais ou jurídicas, que atuem em sítio
  aeroportuário localizado em área de fronteira internacional devem seguir, além do disposto
  neste Regulamento, as restrições e definições impostas em acordo(s) firmado(s) com o(s)
  país(es) limítrofe(s).
