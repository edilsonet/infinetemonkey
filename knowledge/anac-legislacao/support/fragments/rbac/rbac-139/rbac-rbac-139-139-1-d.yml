title: 139.1(d)
text: (d) O operador de aeródromo que não seja obrigado a ser detentor de Certificado Operacional
  de Aeroporto pode requerer espontaneamente a obtenção de Certificado Operacional de Aeroporto
  para melhoria das condições operacionais ou para cumprimento de contratos, convênios ou
  outros instrumentos particulares, ficando obrigado ao cumprimento deste regulamento.
