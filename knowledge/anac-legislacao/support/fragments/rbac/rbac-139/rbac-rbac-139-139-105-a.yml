section_title: Requisitos para obtenção de Certificado Operacional de Aeroporto
subsection_id: a
cite: 139.105(a)
title: 139.105(a)
text: '(a) O Certificado Operacional de Aeroporto será concedido após o atendimento às seguintes
  condições:

  (1) apresentação de requerimento formal em conformidade com o disposto na seção 139.205,
  no prazo estabelecido no Acordo Específico para Certificação Operacional do Aeroporto;

  (2) existência de cadastro atualizado do aeródromo perante a ANAC;

  (3) [reservado]

  (4) apresentação de MOPS em conformidade com o disposto na Subparte D deste Regulamento;
  e

  (5) obtenção de parecer favorável no processo de certificação de que dispõe a Subparte C
  deste Regulamento.'
