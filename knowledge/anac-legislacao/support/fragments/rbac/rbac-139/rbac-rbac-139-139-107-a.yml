section_title: Validade do Certificado Operacional de Aeroporto
subsection_id: a
cite: 139.107(a)
title: 139.107(a)
text: '(a) O Certificado Operacional de Aeroporto é concedido com prazo de validade indefinido
  e perderá sua eficácia nos seguintes casos:

  (1) renúncia do detentor;

  (2) sucessão do detentor por outro operador de aeródromo; ou

  (3) cassação.'
