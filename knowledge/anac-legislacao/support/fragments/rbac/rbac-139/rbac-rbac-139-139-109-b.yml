title: 139.109(b)
text: '(b) O Certificado Operacional de Aeroporto poderá conter restrições em suas especificações
  operativas, quando fundamentadas, referentes a:

  (1) classes e tipos de aeronaves; e

  (2) serviços aéreos.'
