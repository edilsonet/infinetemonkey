title: 139.115(a)
text: (a) Para atendimento à exigência do parágrafo 139.101(a), a ANAC poderá conceder Certificado
  Operacional Provisório de Aeroporto à pessoa destinatária do direito de operar aeródromo
  civil no caso de sucessão de operador de aeródromo anteriormente certificado.
