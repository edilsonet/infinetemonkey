cite: 139.115(b)
title: 139.115(b)
text: '(b) Para fins de obtenção de Certificado Operacional Provisório de Aeroporto, o novo
  operador de aeródromo deverá apresentar os seguintes documentos, com antecedência mínima
  de 120 (cento e vinte) dias da data pretendida para a assunção das operações aeroportuárias:

  (1) requerimento formal conforme modelo disponibilizado pela ANAC;

  (2) declaração de ratificação e cumprimento integral do MOPS do antigo operador de aeródromo;

  (3) designação do(s) responsável(is) operacional(is), conforme definido no parágrafo 153.15(a)
  do RBAC nº 153;

  (4) plano para o treinamento dos novos profissionais contratados para trabalharem na área
  operacional do aeródromo ou em atividades relacionadas com a segurança operacional, de acordo
  os requisitos da seção 153.37 do RBAC nº 153; e

  (5) declaração de compromisso de correção das não conformidades inconclusas por parte do
  antigo operador de aeródromo junto à ANAC.'
