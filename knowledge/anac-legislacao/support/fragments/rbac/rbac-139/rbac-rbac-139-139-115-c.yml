title: 139.115(c)
text: (c) O Certificado Operacional Provisório de Aeroporto supre a exigência contida no parágrafo
  139.101(a) durante sua vigência e imputa ao seu detentor todas as obrigações e deveres decorrentes
  deste Regulamento, inclusive à obtenção de Certificado Operacional de Aeroporto.
