title: 139.115(d)
text: (d) O Certificado Operacional Provisório de Aeroporto tem validade de até 12 (doze)
  meses e será extinto com a outorga do Certificado Operacional de Aeroporto ou o advento
  de seu termo, podendo ser renovado uma única vez, por igual período, a critério da ANAC.
