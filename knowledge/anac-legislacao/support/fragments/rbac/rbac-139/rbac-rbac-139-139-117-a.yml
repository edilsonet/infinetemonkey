section_title: Emendas ao Certificado Operacional de Aeroporto
subsection_id: a
cite: 139.117(a)
title: 139.117(a)
text: '(a) O Certificado Operacional de Aeroporto poderá ser alterado nos seguintes casos:

  (1) quando houver alteração das características físicas ou operacionais do aeródromo que
  reflitam nas especificações operativas, desde que a alteração respeite as exigências previstas
  no parágrafo 139.105(a); ou

  (2) quando for avaliado pelo operador de aeródromo ou pela ANAC que houve incremento do
  risco à segurança operacional do aeródromo que torne necessária a alteração de características
  físicas ou procedimentos operacionais.'
