cite: 139.201(a)
title: 139.201(a)
text: '(a) O processo de Certificação Operacional de Aeroportos compreende as seguintes fases:

  (1) requerimento formal;

  (2) avaliação do requerimento;

  (3) inspeção de certificação; e

  (4) certificação.'
