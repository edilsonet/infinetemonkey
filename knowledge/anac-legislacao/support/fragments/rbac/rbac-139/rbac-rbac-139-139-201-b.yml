title: 139.201(b)
text: (b) Verificada a ausência de informações ou documentos necessários à instrução do processo
  de certificação ou constatada discrepância entre as informações fornecidas e as condições
  observadas na inspeção de certificação, a ANAC poderá sobrestar a tramitação do processo
  e fixar prazo para a apresentação dos esclarecimentos necessários.
