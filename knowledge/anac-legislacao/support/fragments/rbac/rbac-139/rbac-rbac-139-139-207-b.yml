cite: 139.207(b)
title: 139.207(b)
text: '(b) Ao final desta fase, a ANAC:

  (1) notificará o requerente quanto ao resultado da análise, podendo solicitar providências
  complementares e fixar prazo para atendimento; e

  (2) se julgado procedente o requerimento, quando necessário, agendará inspeção de certificação
  destinada a avaliar as características físicas e operacionais do aeródromo e atestar sua
  conformidade com o MOPS.'
