cite: 139.209(d)
title: 139.209(d)
text: '(d) A ANAC poderá arquivar o processo de certificação operacional do aeródromo, nos
  seguintes casos:

  (1) quando constatada a impossibilidade de correção das não conformidades identificadas
  pela ANAC; e

  (2) quando o requerente não apresentar condições técnico-operacionais de operar o aeródromo
  conforme peticionado, descumprindo as condições estabelecidas na seção 139.105.'
