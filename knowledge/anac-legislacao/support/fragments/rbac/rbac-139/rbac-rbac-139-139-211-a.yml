title: 139.211(a)
text: '(a) Concluída a inspeção de certificação e obtido o relatório técnico, a ANAC decidirá
  sobre a outorga do Certificado Operacional de Aeroporto considerando o resultado das fases
  anteriores do processo de certificação, o conjunto formado pelas características físicas
  e operacionais do aeródromo, bem como eventuais isenções ou níveis equivalentes de segurança
  deferidos.

  (1) A ANAC poderá exigir do requerente a apresentação de um CAC com meios e prazos para
  eliminar as não conformidades, assim como medidas para mitigação do risco associado a cada
  não conformidade enquanto não é sanada definitivamente.'
