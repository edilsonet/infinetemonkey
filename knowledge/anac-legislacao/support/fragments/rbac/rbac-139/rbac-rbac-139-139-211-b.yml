cite: 139.211(b)
title: 139.211(b)
text: '(b) Julgado procedente o processo de certificação operacional, a ANAC promoverá:

  (1) a aprovação do MOPS;

  (2) a aceitação do Compromisso de Ações Corretivas (CAC);

  (3) a publicação em meio oficial da decisão administrativa de outorga do Certificado Operacional
  de Aeroporto;

  (4) a expedição do Certificado Operacional de Aeroporto em nome do requerente, contendo
  as especificações operativas do aeródromo; e

  (5) a solicitação de divulgação das informações aeronáuticas sobre o aeródromo nas Publicações
  de Informações Aeronáuticas (AIP).'
