cite: 139.301(a)
title: 139.301(a)
text: (a) O requerente ou detentor de Certificado Operacional de Aeroporto deve elaborar e
  manter atualizado um MOPS que permita padronizar os serviços e facilitar a gestão aeroportuária,
  a comunicação e a instrução de seu pessoal e demais provedores de serviços diretamente relacionados
  à operação do aeródromo.
