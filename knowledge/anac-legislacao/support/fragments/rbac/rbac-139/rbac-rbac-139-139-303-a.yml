cite: 139.303(a)
title: 139.303(a)
text: (a) Todo detentor de Certificado Operacional de Aeroporto deve disponibilizar o acesso
  ao conteúdo atualizado do MOPS ao seu pessoal e demais provedores de serviços diretamente
  relacionados à operação do aeródromo.
