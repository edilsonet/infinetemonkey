title: 139.305(b)
text: (b) Todo detentor de Certificado Operacional de Aeroporto deve manter o MOPS atualizado
  e realizar o controle de emendas, revisando-o para incorporar modificações de características
  físicas, operacionais e outros procedimentos ou práticas adotadas, além de eventuais alterações
  exigidas pela ANAC.
