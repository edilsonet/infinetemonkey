title: 139.305(i)
text: '(i) majoração no número ou letra do Código de Referência de Aeródromo;

  (ii) alteração do tipo de operação por pista ou cabeceira;

  (iii) autorização de operações especiais;

  (2) características físicas do aeródromo, nos casos de implementação de nova pista de pouso
  e decolagem, nova pista de táxi, novo pátio de aeronaves e nova área de aproximação final
  e decolagem de helicópteros (FATO); e

  (3) procedimentos em virtude de atualizações de regulamentação técnica.'
