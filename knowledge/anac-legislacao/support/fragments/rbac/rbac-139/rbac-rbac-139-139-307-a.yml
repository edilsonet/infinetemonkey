section_title: Inclusão de Isenções e Níveis Equivalentes de Segurança no MOPS
subsection_id: a
cite: 139.307(a)
title: 139.307(a)
text: (a) O detentor de Certificado Operacional de Aeroporto deve indicar no MOPS as eventuais
  Isenções e eventuais níveis equivalentes de segurança deferidos pela ANAC, incorporando
  ao MOPS os respectivos procedimentos operacionais aprovados como medidas mitigadoras.
