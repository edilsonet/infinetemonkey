cite: 139.311(a)
title: 139.311(a)
text: '(a) O MOPS deve conter as informações necessárias e suficientes para o adequado entendimento
  e desempenho dos processos pelo pessoal operacional, considerando as particularidades aplicáveis
  ao aeródromo, incluindo, no mínimo, os seguintes assuntos:

  (1) organograma do operador de aeródromo;

  (2) procedimento de revisão do conteúdo e de controle de revisões do MOPS;

  (3) identificação das responsabilidades pela execução das atividades do MOPS e para acesso
  à área operacional;

  (4) descrição do aeródromo, contendo informações sobre suas características físicas e operacionais:'
