title: 139.401(a)
text: '(a) O detentor de Certificado Operacional de Aeroporto deve observar as normas e os
  procedimentos operacionais especificados no MOPS aprovado pela ANAC.

  (1) O operador de aeródromo que se enquadre no disposto no parágrafo 139.1(b) deve manter
  elementos mínimos de infraestrutura e de segurança operacional de acordo com as normas da
  ANAC.'
