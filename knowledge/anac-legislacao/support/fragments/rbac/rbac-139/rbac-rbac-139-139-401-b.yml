title: 139.401(b)
text: (b) O detentor de Certificado Operacional de Aeroporto deve proibir que operações mais
  exigentes que as especificações operativas contidas em seu Certificado sejam realizadas,
  exceto quando houver Avaliação de Impacto sobre a Segurança Operacional (AISO) e Procedimentos
  Específicos de Segurança Operacional (PESO) dessas operações, aceitos pela ANAC.
