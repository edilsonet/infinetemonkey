title: 139.401(d)
text: (d) O detentor de Certificado Operacional de Aeroporto deve compatibilizar o Plano Básico
  de Zona de Proteção de Aeródromo (PBZPA) com as especificações operativas aprovadas pela
  ANAC, e deve adotar medidas e ações necessárias à aprovação do PBZPA junto ao Comando da
  Aeronáutica.
