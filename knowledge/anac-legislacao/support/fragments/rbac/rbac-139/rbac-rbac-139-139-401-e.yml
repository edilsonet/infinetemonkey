title: 139.401(e)
text: '(e) A inobservância de quaisquer requisitos, procedimentos ou obrigações estabelecidas
  neste Regulamento, na legislação brasileira correlacionada, no MOPS ou no CAC ensejará a
  emissão de comunicação ao detentor de Certificado Operacional de Aeroporto, contendo a descrição
  da não conformidade detectada e o prazo para sua correção, salvo quando comprometa a segurança
  operacional em nível de risco não aceitável pela ANAC.

  (1) A comunicação não constitui sanção ao regulado e tem por objetivo estimular o retorno
  ao cumprimento do requisito de forma célere e eficaz previamente à adoção de procedimentos
  para aplicação das providências administrativas decorrentes do exercício das atividades
  de fiscalização.

  (2) O detentor de Certificado Operacional de Aeroporto deverá comprovar a correção da não
  conformidade dentro do prazo estabelecido na comunicação, sob pena de adoção de outras providências
  administrativas.

  (3) A comunicação não será aplicada para condições que possam afetar ou elevar o risco à
  segurança das operações, nem para casos críticos que justifiquem a imposição de providência
  administrativa mais gravosa.'
