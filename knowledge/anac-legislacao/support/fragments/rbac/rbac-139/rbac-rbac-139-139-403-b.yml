cite: 139.403(b)
title: 139.403(b)
text: '(b) Findo o processo de certificação sem outorga do Certificado Operacional de Aeroporto
  ou do Certificado Operacional Provisório de Aeroporto, ou quando descumpridos os elementos
  mínimos de infraestrutura e de segurança operacional, o operador de aeródromo estará suscetível
  à aplicação das seguintes consequências administrativas:

  (1) adoção de medidas mitigadores adicionais, visando garantir um nível aceitável de segurança
  operacional;

  (2) imposição de restrições operacionais;

  (3) congelamento das frequências do aeroporto;

  (4) limitação da aeronave crítica e respectiva frequência semanal de operação;

  (5) redução gradativa de frequências das operações até determinado limite que será fixado
  pela ANAC no caso concreto;

  (6) suspensão das operações.'
