title: 139.403(c)
text: '(c) O operador de aeródromo poderá firmar um CAC para evitar ou suspender a aplicação
  das consequências previstas no parágrafo 139.403(b).

  (1) O operador de aeródromo estará suscetível às consequências previstas no parágrafo 139.403(b)
  em caso de descumprimento do CAC.'
