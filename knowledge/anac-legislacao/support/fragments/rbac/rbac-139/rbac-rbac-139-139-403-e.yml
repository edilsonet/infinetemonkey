cite: 139.403(e)
title: 139.403(e)
text: (e) As violações ao previsto neste Regulamento sujeitam o infrator às providências administrativas
  estabelecidas no art. 289 da Lei nº 7.565, de 19 de dezembro de 1986, que dispõe o Código
  Brasileiro de Aeronáutica, e em ato normativo específico da ANAC que estabelece procedimentos
  para providências administrativas decorrentes do exercício das atividades de fiscalização,
  adotando-se, para as infrações praticadas, os valores de multa previstos Apêndice A.
