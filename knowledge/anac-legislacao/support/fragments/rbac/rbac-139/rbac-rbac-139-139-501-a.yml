title: 139.501(a)
text: (a) Todo requerente ou detentor de Certificado Operacional de Aeroporto pode solicitar
  à ANAC isenção de requisito regulamentar, nos moldes definidos no RBAC 11 - “Procedimentos
  e normas gerais para a elaboração de regras e emendas aos Regulamentos Brasileiros da Aviação
  Civil” ou norma que o substitua ou atualize.
