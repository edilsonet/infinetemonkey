title: 139.501(b)
text: (b) Uma petição de isenção deve ser fundamentada por Análise de Impacto sobre a Segurança
  Operacional (AISO), Estudo Aeronáutico ou Estudo de Compatibilidade, demonstrando que as
  operações podem ser mantidas dentro de um nível aceitável de segurança operacional.
