text: (e) O requerente ou detentor de Certificado Operacional de Aeroporto que tiver obtido
  isenção temporária ou permanente deve fornecer à ANAC, sempre que solicitadas, informações
  necessárias para a supervisão da segurança operacional das operações afetadas.
