section_title: Análise e aprovação de Níveis Equivalentes de Segurança
subsection_id: d
cite: 139.503(d)
title: 139.503(d)
text: '(d) Após a análise da solicitação de aprovação de nível equivalente de segurança, a
  ANAC poderá:

  (1) deferir nível equivalente de segurança, conforme solicitado pelo requerente ou detentor
  ou requerente de Certificado Operacional de Aeroporto;

  (2) demandar ao peticionário alteração da solicitação, caso alguma característica física
  da aeronave ou requisito operacional não tenha sido identificado ou adequadamente tratado;

  (3) deferir nível equivalente de segurança, impondo medidas condicionais para garantir a
  segurança operacional;

  (4) indeferir a solicitação, apresentando a devida fundamentação.'
