title: 139.503(e)
text: (e) O requerente ou detentor de Certificado Operacional de Aeroporto que tiver obtido
  a aprovação de nível equivalente de segurança deve fornecer à ANAC, sempre que solicitadas,
  informações necessárias para a supervisão da segurança operacional das operações afetadas.
