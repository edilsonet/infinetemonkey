title: 139.601(a)
text: '(a) Os elementos mínimos de infraestrutura e de segurança operacional, conforme disposto
  no parágrafo 139.1(b), devem ser atendidos:

  (1) até 3 de outubro de 2025, para quem tiver processado ou processar operações regulares
  regidas pelo RBAC nº 121 no período compreendido de 1º de janeiro de 2017 até 31 de janeiro
  de 2023;'
