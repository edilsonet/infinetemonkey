cite: 139.601(b)
title: 139.601(b)
text: '(b) A segurança das operações deverá ser avaliada por intermédio de um processo de
  gerenciamento de risco e garantia da segurança operacional, sob responsabilidade do operador
  de aeródromo em conjunto com o(s) operador(es) aéreo(s).

  (1) o não cumprimento integral dos elementos mínimos de infraestrutura e de segurança operacional
  exigirá análise e aprovação prévia da ANAC do processo de gerenciamento de risco e garantia
  da segurança operacional.'
