  Parâmetro de incidência

  Forma de aplicação

  1 por constatação

  Será aplicada uma multa por cada conjunto de irregularidades identificadas que decorram
  de violação ao requisito que indica esse parâmetro de incidência.

  Nota:

  * A sanção também é cabível aos operadores aéreos, conforme o valor respectivo da classe
  do aeródromo onde a violação ao requisito foi praticada.'
