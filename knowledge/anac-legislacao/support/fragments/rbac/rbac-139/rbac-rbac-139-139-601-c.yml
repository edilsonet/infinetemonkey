title: 139.601(c)
text: (c) O cumprimento dos elementos mínimos de infraestrutura e de segurança operacional
  será formalizado por meio de declaração com responsabilização do operador de aeródromo,
  conforme modelo disponibilizado pela ANAC, e será verificado, posteriormente, pela ANAC.
