title: 139.601(d)
text: (d) Os operadores de aeródromos que se enquadrarem na aplicabilidade deste regulamento
  deverão ser detentores de Certificado Operacional de Aeroporto no prazo máximo fixado no
  Acordo Específico para Certificação estabelecido em conjunto com a ANAC para cada aeroporto.
