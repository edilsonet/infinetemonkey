cite: 139.601(f)
title: 139.601(f)
text: (f) Enquanto não for concedido Certificado Operacional de Aeroporto, o operador de aeródromo,
  na figura do gestor designado como responsável do aeródromo, será considerado como o responsável
  primário pela garantia de todos os aspectos de segurança do aeródromo.
