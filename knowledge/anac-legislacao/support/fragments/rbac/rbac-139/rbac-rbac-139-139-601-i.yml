cite: 139.601(i)
title: 139.601(i)
text: '(i) durante o prazo definido no parágrafo 139.601(a)(1) as operações deverão ser conduzidas
  por intermédio de um processo de gerenciamento de risco e garantia da segurança operacional,
  sob responsabilidade do operador de aeródromo em conjunto com o(s) operador(es) aéreo(s).

  (ii) os operadores de aeródromos que tenham medida cautelar aplicada pela ANAC deverão observar
  o disposto no parágrafo 139.601(b)(1).

  (2) de forma prévia para quem pretenda processar operações regulares regidas pelo RBAC nº
  121 e após observado o disposto no parágrafo 139.601(b).'
