title: 141.1(a)
text: (a) Este Regulamento estabelece os requisitos de certificação e regras de operação de
  um centro de instrução de aviação civil (CIAC), voltado para a formação e qualificação de
  pilotos, comissários de voo, mecânicos de voo, despachantes operacionais de voo e mecânicos
  de manutenção aeronáutica postulantes a uma licença, habilitação ou certificado requeridos
  pelo RBAC nº 61, RBHA 63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65.
