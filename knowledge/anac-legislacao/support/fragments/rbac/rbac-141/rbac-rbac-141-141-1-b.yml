title: 141.1(b)
text: (b) Exceto como previsto no parágrafo (c) desta seção, este Regulamento é aplicável
  às pessoas jurídicas que pretendam ministrar quaisquer dos cursos previstos no RBAC nº 61,
  RBHA 63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65, incluindo instituições públicas
  ou privadas de ensino técnico de nível médio, de ensino profissional e tecnológico ou de
  ensino superior. Cursos não previstos no RBAC nº 61, RBHA 63 (ou RBAC que vier a substituí-lo)
  ou RBAC nº 65 podem ser ministrados livremente sem necessidade de cumprir com o RBAC nº
  141.
