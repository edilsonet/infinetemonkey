cite: 141.1(d)
title: 141.1(d)
text: '(d) Não obstante o previsto no parágrafo anterior, este Regulamento não é aplicável
  a:

  (1) centros de treinamento de aviação civil (CTAC) certificados sob o RBAC nº 142;

  (2) operadores aéreos que possuam um programa de treinamento aprovado pela ANAC, desde que
  ministrem cursos somente para seu pessoal próprio ou de outros operadores similares; e

  (3) cursos ministrados por associações aerodesportivas credenciadas segundo o RBAC nº 183.'
