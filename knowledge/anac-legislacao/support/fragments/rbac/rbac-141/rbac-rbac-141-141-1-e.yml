text: (e) De modo a atender as especificidades do exercício de suas atividades, as instituições
  de ensino devidamente reconhecidas pelo Ministério da Educação e certificadas pela ANAC
  podem utilizar terminologia e sistemas de avaliação distintos mas compatíveis com as exigências
  estabelecidas neste Regulamento.
