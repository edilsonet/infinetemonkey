cite: 141.13(i)
title: 141.13(i)
text: '(i) instrução teórica e prática para os cursos que não envolvam instrução em aeronaves
  em voo; e

  (ii) instrução teórica para todos os outros cursos;

  (2) CIAC Tipo 2, que desenvolverá exclusivamente instrução prática em voo, incluindo treinamento
  de solo complementar; e

  (3) CIAC Tipo 3, que desenvolverá instrução em ambas as modalidades previstas para os CIAC
  Tipo 1 e 2.'
