title: 141.15(a)
text: (a) Todo CIAC certificado segundo este Regulamento, bem como seus CIAC satélites, estão
  sujeitos a atividades de fiscalização realizadas pela ANAC, à distância ou presenciais,
  com ou sem aviso prévio, a fim de verificar o cumprimento deste e de quaisquer outros regulamentos
  aplicáveis
