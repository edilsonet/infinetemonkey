text: '(e) O CIAC deve manter disponível para apresentação à ANAC ou a qualquer outra autoridade
  competente, no CIAC e nos CIAC satélite, toda a documentação pertinente para comprovar o
  cumprimento dos requisitos deste Regulamento.

  SUBPARTE B

  SISTEMAS, PROGRAMAS E MANUAIS DO CIAC'
