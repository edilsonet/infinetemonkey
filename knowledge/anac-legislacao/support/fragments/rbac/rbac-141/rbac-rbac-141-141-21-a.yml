section_title: Sistema de manuais do CIAC
subsection_id: a
cite: 141.21(a)
title: 141.21(a)
text: '(a) O CIAC deve elaborar e implantar um sistema de manuais composto pelos seguintes
  documentos:

  (1) pelo menos um programa de instrução, de acordo com a seção 141.23 deste Regulamento;

  (2) um manual de instruções e procedimentos (MIP), de acordo com a seção 141.25 deste Regulamento;

  (3) para CIAC Tipo 2 ou 3, um manual de gerenciamento da segurança operacional (MGSO), de
  acordo com a seção 141.27 deste Regulamento; e

  (4) um manual de garantia de qualidade (MGQ), de acordo com a seção 141.29 deste Regulamento.'
