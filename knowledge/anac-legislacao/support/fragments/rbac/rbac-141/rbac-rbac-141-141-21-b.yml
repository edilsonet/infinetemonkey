text: (b) Está dispensado de desenvolver e manter o documento previsto no parágrafo (a)(4)
  desta seção o CIAC que ministrar apenas curso prático para piloto de balão livre, curso
  prático para piloto de planador, curso prático para licença de piloto privado e/ou curso
  prático de piloto aerodesportivo.
