title: 141.23(a)
text: (a) O CIAC deve possuir um programa de instrução aprovado pela ANAC para cada curso
  ministrado que esteja previsto no RBAC nº 61, RBHA 63 (ou RBAC que vier a substituí-lo)
  ou RBAC nº 65.
