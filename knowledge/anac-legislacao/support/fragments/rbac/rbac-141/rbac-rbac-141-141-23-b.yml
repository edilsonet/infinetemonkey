cite: 141.23(b)
title: 141.23(b)
text: '(b) Cada programa de instrução deve conter:

  (1) o currículo do curso proposto, que deve obedecer aos requisitos mínimos previstos no
  RBAC nº 61, RBHA 63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65, descrevendo o conteúdo,
  a carga horária e quaisquer outras experiências de aprendizagem a serem proporcionadas aos
  alunos em cada aula, instrução ou atividade prevista;

  (2) a descrição, conforme aplicável, das aeronaves e dos equipamentos de instrução que serão
  utilizados no curso;

  (3) a descrição dos procedimentos específicos utilizados pelo CIAC para acompanhar e avaliar
  o desempenho dos alunos durante o curso, bem como os critérios mínimos que o aluno deve
  atingir para ser considerado aprovado;

  (4) a bibliografia empregada durante o curso; e

  (5) a duração máxima de atividades instrucionais por período.'
