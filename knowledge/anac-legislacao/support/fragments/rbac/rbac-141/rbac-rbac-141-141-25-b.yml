cite: 141.25(b)
title: 141.25(b)
text: '(b) O MIP deve conter, no mínimo:

  (1) a descrição das atribuições e responsabilidades de todas as pessoas empregadas pelo
  CIAC para cumprimento dos requisitos deste regulamento, incluindo as previstas na Subparte
  D deste Regulamento, especificando quais assuntos cada uma delas poderá tratar diretamente
  com a ANAC em nome do CIAC;

  (2) um organograma do CIAC, que demonstre as relações de hierarquia e responsabilidade entre
  os cargos e funções de direção, o pessoal administrativo e os instrutores;

  (3) a descrição das regras de conduta aplicáveis aos alunos e funcionários, bem como a política
  a ser adotada pelo CIAC no caso de descumprimento dessas regras;

  (4) o procedimento a ser seguido pelo CIAC para emendar o MIP e informar a alteração aos
  alunos e funcionários impactados pela mudança;

  (5) a descrição dos procedimentos que serão utilizados para a capacitação inicial e periódica
  dos instrutores, bem como, quando aplicável, para o registro e controle da validade de suas
  licenças, habilitações e certificados, de modo a garantir o cumprimento do previsto na seção
  141.63 deste Regulamento;

  (6) a descrição dos procedimentos que serão utilizados para controlar e arquivar os registros
  de instrução dos alunos, incluindo o procedimento para, ao término dos cursos práticos,
  verificar e declarar que o aluno cumpre todos os requisitos regulamentares para obter ou
  revalidar a licença, habilitação ou certificado pretendido;

  (7) os modelos do certificado de conclusão de curso e do histórico de instrução, conforme
  previsto nas seções 141.81 e 141.83 deste Regulamento; e

  (8) para CIAC tipo 2 ou 3, uma descrição dos procedimentos que serão utilizados para despachar
  a aeronave antes cada voo, de modo a garantir o cumprimento de todos os requisitos de aeronavegabilidade,
  autonomia, peso e balanceamento, e documentação.'
