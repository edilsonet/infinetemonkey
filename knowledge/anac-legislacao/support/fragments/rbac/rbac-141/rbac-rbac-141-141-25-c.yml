title: 141.25(c)
text: (c) O gestor responsável do CIAC deve garantir que todo o seu pessoal tenha fácil acesso
  à cópia mais atualizada das partes do MIP relativas às suas funções, e que cada pessoa seja
  informada e orientada sobre quaisquer alterações ao MIP aplicáveis às suas atividades.
