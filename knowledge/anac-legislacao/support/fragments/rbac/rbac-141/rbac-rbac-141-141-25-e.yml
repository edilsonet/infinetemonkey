title: 141.25(e)
text: (e) Quaisquer emendas realizadas pelo CIAC em seu MIP devem ser encaminhadas à ANAC
  em, no mínimo, 10 (dez) dias corridos antes da data prevista para sua entrada em vigor.
  A entrada em vigor de uma emenda ao MIP não depende de aprovação prévia da ANAC. No entanto,
  caso a qualquer momento a ANAC identifique no MIP o descumprimento de norma regulamentar
  ou a existência de procedimento que cause deterioração da segurança operacional, poderá
  determinar ao operador que emende o MIP conforme necessário, sem prejuízo das sanções administrativas
  e legais cabíveis.
