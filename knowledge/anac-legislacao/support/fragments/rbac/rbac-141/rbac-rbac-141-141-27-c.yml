section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: c
cite: 141.27(c)
title: 141.27(c)
text: (c) O gestor responsável do requerente ou detentor de certificado de CIAC deve implantar
  um SGSO compatível com o tamanho, natureza e complexidade das operações a serem conduzidas
  no CIAC, considerando suas especificações de instrução e os perigos e riscos relacionados
  com suas atividades.
