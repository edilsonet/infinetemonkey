section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: g
cite: 141.27(g)
title: 141.27(g)
text: '(g) Registros do SGSO:

  (1) o CIAC deve registrar dados relevantes à segurança das operações do CIAC, e mantê-los
  armazenados por, no mínimo, cinco anos; e

  (2) o CIAC deve enviar à ANAC relatórios periódicos a respeito de suas operações e de seu
  SGSO, nos prazos e modelos definidos pela ANAC.'
