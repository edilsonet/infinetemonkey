section_title: Sistema de gerenciamento da segurança operacional (SGSO)
subsection_id: h
cite: 141.27(h)
title: 141.27(h)
text: (h) Quaisquer emendas realizadas pelo CIAC em seu MGSO devem ser encaminhadas à ANAC
  em, no mínimo, 10 (dez) dias corridos antes da data prevista para sua entrada em vigor.
  A entrada em vigor da emenda ao MGSO não depende de aprovação prévia da ANAC. No entanto,
  caso a qualquer momento a ANAC identifique no MGSO o descumprimento de norma regulamentar
  ou a existência de procedimento que cause deterioração da segurança operacional ou a ineficiência
  do sistema, poderá determinar ao operador que emende o MGSO conforme necessário, sem prejuízo
  das sanções administrativas e legais cabíveis.
