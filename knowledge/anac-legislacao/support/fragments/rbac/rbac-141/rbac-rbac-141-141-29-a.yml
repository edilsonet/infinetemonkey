cite: 141.29(a)
title: 141.29(a)
text: (a) O CIAC deve implementar um SGQ que garanta que a instrução ministrada pelo CIAC
  atinja os objetivos propostos e que todos os procedimentos do CIAC se mantenham de acordo
  com os requisitos estabelecidos neste Regulamento.
