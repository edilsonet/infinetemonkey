section_title: Sistema de garantia da qualidade (SGQ)
subsection_id: b
cite: 141.29(b)
title: 141.29(b)
text: '(b) O SGQ deve estar descrito em um MGQ, e deve conter, no mínimo, os seguintes elementos:

  (1) a política de qualidade, assinada pelo gestor responsável, estabelecendo o compromisso
  da alta direção do CIAC em atingir os mais elevados padrões possíveis de qualidade e atender
  aos requisitos aplicáveis;

  (2) o escopo do SGQ;

  (3) um programa de auditoria de qualidade, contemplando auditorias independentes para monitorar
  os resultados e o cumprimento dos objetivos da instrução, a integridade das avaliações,
  assim como o cumprimento e idoneidade dos procedimentos. O CIAC que não dispuser de um sistema
  de auditorias independentes de qualidade pode contratar um outro CIAC ou uma pessoa idônea
  com conhecimento técnico aeronáutico para realizar tais auditorias; e

  (4) processo de revisão e análise crítica de qualidade por parte da alta direção a fim de
  que se assegure que sejam adotadas as medidas corretivas e preventivas apropriadas em resposta
  aos resultados dos processos e procedimentos de garantia de qualidade adotados. O processo
  deve ser suportado por um sistema de relatórios de retroalimentação da qualidade direcionado
  ao pessoal de administração requerido no parágrafo 141.61(b) deste Regulamento e, em última
  instância, ao gestor responsável do CIAC.'
