section_title: Sistema de garantia da qualidade (SGQ)
subsection_id: d
cite: 141.29(d)
title: 141.29(d)
text: (d) Quaisquer emendas realizadas pelo CIAC em seu MGQ devem ser encaminhadas à ANAC
  em, no mínimo, 10 (dez) dias corridos antes da data prevista para sua entrada em vigor.
  A entrada em vigor da emenda ao MGQ não depende de aprovação prévia da ANAC. No entanto,
  caso a qualquer momento a ANAC identifique no MGQ o descumprimento de norma regulamentar
  ou a existência de procedimento que cause deterioração da segurança operacional ou a ineficiência
  do sistema, poderá determinar ao operador que emende o MGQ conforme necessário, sem prejuízo
  das sanções administrativas e legais cabíveis;
