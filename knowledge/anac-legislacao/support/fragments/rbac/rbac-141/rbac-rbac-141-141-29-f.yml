text: '(f) Está dispensado de implementar um SGQ o CIAC que ministrar apenas curso prático
  para piloto de balão livre, curso prático para piloto de planador, curso prático para licença
  de piloto privado e/ou curso prático de piloto aerodesportivo.

  SUBPARTE C

  INSTALAÇÕES, EQUIPAMENTOS DE INSTRUÇÃO E AERONAVES'
