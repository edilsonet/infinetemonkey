title: 141.29(i)
text: '(i) registrar dados relevantes à gestão da qualidade e mantê-los armazenados por, no
  mínimo, cinco anos; e

  (ii) enviar à ANAC relatórios periódicos a respeito de seu SGQ, nos prazos e modelos definidos
  pela ANAC.'
