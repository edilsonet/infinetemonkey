title: 141.41(e)
text: (e) A ANAC poderá, a qualquer momento, solicitar adequações nas instalações do CIAC,
  bem como estabelecer o número máximo de alunos por sala ou instrutor para manutenção do
  nível equivalente de segurança operacional e/ou para a preservação do desempenho no processo
  de ensino aprendizagem.
