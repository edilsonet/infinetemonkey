text: '(f) Os CIAC Tipos 2 e 3 devem dispor, em local de fácil acesso para o aluno, no decorrer
  das operações, das seguintes instalações:

  (1) Uma sala que seja equipada e apropriada para a realização de

  briefing

  e

  debriefing

  ;

  (Redação dada pela Resolução nº 703, de 27.01.2023)

  (2) uma sala que permita o controle das operações de voo; e

  (3) uma sala para processar e planejar os voos, que conte com as seguintes facilidades,
  no que for aplicável:'
