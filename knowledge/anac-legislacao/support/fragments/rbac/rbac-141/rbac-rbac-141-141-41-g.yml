cite: 141.41(g)
title: 141.41(g)
text: '(g) O CIAC que pretenda ministrar o curso de mecânico de manutenção aeronáutica deve
  possuir instalações físicas adequadas à referida instrução prática ou possuir convênio com
  uma organização de manutenção certificada segundo o RBAC nº 145.

  (1) As instalações do CIAC ou das organizações de manutenção utilizadas para instrução prática
  de mecânico de manutenção aeronáutica devem ser compatíveis com as instruções previstas
  para cada habilitação.

  (2) Caso seja firmado o convênio com uma organização de manutenção, as organizações e/ou
  profissionais conveniados devem facilitar à ANAC o acesso às instalações e materiais que
  sejam parte do convênio firmado. Tal condição deve constar expressa no contrato de convênio.'
