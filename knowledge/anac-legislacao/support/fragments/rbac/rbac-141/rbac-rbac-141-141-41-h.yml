text: (h) Os CIACs tipo 2 e 3 devem demonstrar que os aeródromos utilizados para instrução
  possuem condições apropriadas à operação de suas aeronaves e ao cumprimento do(s) programa(s)
  de treinamento(s) do CIAC.
