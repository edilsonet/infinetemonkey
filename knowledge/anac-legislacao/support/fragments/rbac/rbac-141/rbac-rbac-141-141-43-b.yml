section_title: Requisitos de equipamentos de instrução
subsection_id: b
cite: 141.43(b)
title: 141.43(b)
text: '(b) O CIAC que ministrar curso de mecânico de manutenção aeronáutica deve, no que for
  aplicável:

  (1) dispor de facilidades, laboratórios, equipamentos, ferramental e materiais compatíveis
  com a instrução ministrada;

  (2) dispor de instalações adequadas para funcionamento dos equipamentos e motores, conforme
  aplicável;

  (3) dispor de área com equipamentos, estruturas de aeronaves, sistemas e componentes, adequados
  para realização das instruções práticas de manutenção;

  (4) possuir acesso a, pelo menos, uma aeronave de um tipo comumente certificado pela ANAC,
  ou aeronave militar, que não necessita estar em condições aeronavegáveis, mas que esteja
  em um tal estado de conservação que permita uma instrução adequada; e

  (5) garantir que as aeronaves, motores, hélices, equipamentos e componentes utilizados sejam
  suficientemente diversificados para ilustrar os diferentes métodos de construção, montagem
  e inspeções de manutenção e operação.'
