cite: 141.45(b)
title: 141.45(b)
text: '(b) O CIAC deverá constar no Registro Aeronáutico Brasileiro (RAB) como operador da
  aeronave utilizada para ministrar instrução.

  (1) A aeronave poderá possuir mais de um operador, mediante registro de contrato de intercâmbio
  operacional junto ao RAB.

  (2) Caso a aeronave possua mais de um operador, o CIAC deverá garantir que a aeronave esteja
  disponível em seu local de operação durante as fiscalizações agendadas.'
