cite: 141.45(d)
title: 141.45(d)
text: '(d) Cada aeronave utilizada pelo CIAC para ministrar instrução de voo deve:

  (1) possuir certificado de aeronavegabilidade padrão ou certificado de aeronavegabilidade
  especial na categoria primária ou leve esportiva e certificado de matrícula válidos, emitidos
  pela ANAC; e

  (2) ser mantida e inspecionada conforme os requisitos aplicáveis da Subparte E do RBHA 91,
  ou disposições correspondentes que vierem a substituí-la.'
