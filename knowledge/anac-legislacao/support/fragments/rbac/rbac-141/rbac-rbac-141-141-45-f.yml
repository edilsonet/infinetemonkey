section_title: Requisitos de aeronaves
subsection_id: f
cite: 141.45(f)
title: 141.45(f)
text: (f) Toda aeronave utilizada para instrução de voo pelo CIAC deve possuir pelo menos
  dois postos de pilotagem, com manetes de potência e comandos de voo que possam ser facilmente
  alcançados e operados por ambos os postos, exceto planadores, aeronaves agrícolas ou, se
  tecnicamente justificado pelo CIAC e aprovado pela ANAC, qualquer outra aeronave.
