section_title: Requisitos de FSTD
subsection_id: a
cite: 141.47(a)
title: 141.47(a)
text: (a) Os FSTD utilizados para instrução pelo CIAC devem ser capazes de reproduzir adequadamente
  as manobras e procedimentos de instrução que o CIAC pretenda neles realizar. Além disso,
  devem também atender a todas as especificações técnicas estabelecidas pela ANAC nas normas
  aplicáveis a FSTD.
