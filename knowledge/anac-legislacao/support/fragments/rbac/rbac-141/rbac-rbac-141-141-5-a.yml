title: 141.5(a)
text: (a) Salvo as exceções previstas no parágrafo 141.1(c) deste Regulamento, somente é permitido
  a uma pessoa jurídica oferecer ou ministrar quaisquer dos cursos previstos no RBAC nº 61,
  RBHA 63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65 se esta pessoa detiver um certificado
  de CIAC e suas respectivas EI com a aprovação dos respectivos programas de instrução desses
  cursos, emitidos pela ANAC segundo este Regulamento.
