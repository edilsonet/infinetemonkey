cite: 141.5(b)
title: 141.5(b)
text: (b) Um requerente de certificado de CIAC e de suas respectivas EI estará habilitado
  a recebê-los se demonstrar que possui pelo menos um programa de instrução aprovado, instalações,
  equipamentos, pessoal e material instrucional adequados para conduzir instruções segundo
  este Regulamento.
