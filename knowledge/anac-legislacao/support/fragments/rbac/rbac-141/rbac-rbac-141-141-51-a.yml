cite: 141.51(a)
title: 141.51(a)
text: '(a) O detentor de um certificado de CIAC pode conduzir instrução em um CIAC satélite,
  desde que:

  (1) as instalações, equipamentos, aeródromos, aeronaves, facilidades, pessoal e conteúdo
  dos cursos a serem ministrados pelo CIAC satélite atendam aos requisitos aplicáveis;

  (2) as atividades do CIAC satélite sejam supervisionadas pelo CIAC; e

  (3) o CIAC satélite e os cursos aprovados para serem ministrados nele segundo este Regulamento
  constem expressamente das EI aprovadas pela ANAC.'
