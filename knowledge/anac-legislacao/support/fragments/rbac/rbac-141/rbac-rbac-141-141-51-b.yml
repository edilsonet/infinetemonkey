title: 141.51(b)
text: '(b) O CIAC que pretender acrescentar ou extinguir um CIAC satélite deve solicitar uma
  emenda às suas EI, nos termos do parágrafo 141.7(e) deste Regulamento. Deve ainda, caso
  necessário, adequar seu sistema de manuais.

  SUBPARTE D

  REQUISITOS DE PESSOAL'
