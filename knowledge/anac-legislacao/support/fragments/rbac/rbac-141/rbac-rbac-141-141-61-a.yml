cite: 141.61(a)
title: 141.61(a)
text: (a) O CIAC deve contar com uma estrutura de administração que lhe permita o controle
  de todos os níveis da organização por meio de pessoas que possuam a formação, a experiência
  e as qualificações necessárias para garantir a manutenção do nível de qualidade das instruções.
