cite: 141.61(b)
title: 141.61(b)
text: '(b) Cada CIAC deve contar, pelo menos, com o seguinte pessoal de administração:

  (1) um gestor responsável;

  (2) um coordenador de curso, para cada curso ministrado pelo CIAC;

  (3) um gerente de segurança operacional, no caso de CIAC Tipo 2 e 3; e

  (4) um gerente da qualidade, exceto para o CIAC que ministrar apenas curso prático para
  piloto de balão livre, curso prático para piloto de planador, curso prático para licença
  de piloto privado e/ou curso prático de piloto aerodesportivo.'
