cite: 141.61(j)
title: 141.61(j)
text: (j) O CIAC deve, mediante determinação da ANAC, no prazo de 30 (trinta) dias, extensível
  pela ANAC por igual período, substituir qualquer pessoa que ocupe uma função prevista no
  parágrafo (b) desta seção e que possua comprovado histórico de conduta e/ou desempenho inadequados,
  conforme os critérios do parágrafo (h) desta seção.
