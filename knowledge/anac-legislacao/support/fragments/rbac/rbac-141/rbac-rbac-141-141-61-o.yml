cite: 141.61(o)
title: 141.61(o)
text: '(o) Gerente da qualidade. O gerente da qualidade é responsável pela implementação e
  execução do SGQ do CIAC, devendo possuir cursos atualizados na área de auditoria de qualidade.
  O gerente da qualidade deve:

  (1) coordenar a implementação, manutenção e integração do SGQ em todas as áreas da organização
  do CIAC, em conformidade com os requisitos previstos na seção 141.29 deste Regulamento;

  (2) monitorar a efetividade dos controles de qualidade dos serviços do CIAC;

  (3) formalizar junto ao gestor responsável a necessidade de alocação de recursos demandados
  para implementação, manutenção e melhoria contínua do SGQ; e

  (4) assessorar o gestor responsável na elaboração dos relatórios previstos no parágrafo
  141.29(c) deste Regulamento.'
