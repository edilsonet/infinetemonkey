cite: 141.63(c)
title: 141.63(c)
text: (c) O CIAC que ministre curso de mecânico de manutenção aeronáutica deve utilizar, para
  cada instrução prática desenvolvida em organização de manutenção, um instrutor para um máximo
  de dezesseis alunos (16:1), dos quais não mais do que oito poderão realizar atividades práticas
  em cada unidade de material, ao mesmo tempo, assegurando-se a participação ativa dos alunos
  e uma supervisão adequada.
