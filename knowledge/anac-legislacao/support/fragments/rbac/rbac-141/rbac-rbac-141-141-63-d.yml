cite: 141.63(d)
title: 141.63(d)
text: '(d) Antes de iniciar quaisquer atividades de instrução no CIAC, o instrutor deve receber
  um treinamento que aborde, no mínimo:

  (1) os procedimentos previstos no MIP e no programa de instrução que sejam pertinentes à
  sua área de atuação no CIAC;

  (2) desempenho humano, didática e técnicas de ensino;

  (3) atualização quanto a novas tecnologias e regulamentos aplicáveis à sua área de instrução;
  e

  (4) para instrutores de voo, conhecimentos técnicos sobre as aeronaves em que ministrará
  instrução.'
