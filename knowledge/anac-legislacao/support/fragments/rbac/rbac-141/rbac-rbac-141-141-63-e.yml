text: '(e) O instrutor deve receber, adicionalmente, treinamento periódico a cada doze meses
  de vínculo com o CIAC, com a finalidade de manter atualizados seus conhecimentos sobre os
  assuntos dispostos no parágrafo (d) desta seção.

  SUBPARTE E

  REGRAS DE OPERAÇÃO'
