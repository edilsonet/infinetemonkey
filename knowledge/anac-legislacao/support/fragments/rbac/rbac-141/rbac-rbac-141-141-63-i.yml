title: 141.63(i)
text: '(i) no caso de instrução de voo visual, possuir a habilitação de classe pertinente
  à aeronave simulada;

  (ii) no caso de instrução de voo por instrumentos, possuir a habilitação de voo por instrumentos
  pertinente à categoria da aeronave simulada; e

  (iii) no caso de instrução de voo para operação aeroagrícola, possuir a habilitação de piloto
  agrícola pertinente à categoria da aeronave simulada; e

  (3) para ministrar instrução em voo, possuir:'
