cite: 141.71(a)
title: 141.71(a)
text: (a) O CIAC certificado somente pode ministrar os cursos previstos no RBAC nº 61, RBHA
  63 (ou RBAC que vier a substituí-lo) ou RBAC nº 65 caso estes estejam listados em suas EI,
  e cujos programas de instrução estejam aprovados pela ANAC e não estejam suspensos, revogados
  ou cassados.
