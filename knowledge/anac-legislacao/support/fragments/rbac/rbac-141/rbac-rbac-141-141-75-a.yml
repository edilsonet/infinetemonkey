cite: 141.75(a)
title: 141.75(a)
text: (a) Para efetuar a matrícula em um CIAC, um candidato deve apresentar os documentos
  e informações necessários para sua identificação civil, regularidade da situação no país
  (se estrangeiro), assim como para comprovação dos requisitos de regulamento, conforme procedimentos
  estabelecidos no MIP, cabendo ao CIAC a aferição da veracidade destes dados.
