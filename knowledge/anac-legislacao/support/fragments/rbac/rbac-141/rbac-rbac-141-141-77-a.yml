cite: 141.77(a)
title: 141.77(a)
text: '(a) Para fins de transferência de alunos entre programas de instrução aprovados, o
  CIAC onde o aluno irá matricular-se deve avaliar o enquadramento do aluno no programa de
  instrução de destino, através da verificação do histórico curricular, experiência prévia
  e, a seu critério, de avaliações teóricas e/ou práticas, para concessão de crédito total
  ou parcial referente aos estudos já realizados, conforme procedimento previsto no MIP. O
  aluno deve cumprir integralmente a carga horária e as atividades previstas no programa de
  instrução onde será matriculado

  .

  (Redação dada pela Resolução nº 703, de 27.01.2023)'
