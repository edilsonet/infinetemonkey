cite: 141.77(b)
title: 141.77(b)
text: (b) Para todos os casos especificados nesta seção, a instrução ou experiência prévia
  apresentada pelo aluno deve estar declarada por escrito pela organização ou instrutor responsável
  pela mesma, incluindo a quantidade e tipos de instrução ministrada, assim como o resultado
  das avaliações realizadas, caso aplicável.
