cite: 141.77(c)
title: 141.77(c)
text: '(c) Os créditos concedidos pelo CIAC possuem somente a finalidade de dispensar o aluno
  da realização de instruções teóricas e/ou práticas previamente realizadas em outra instituição,
  e em nenhuma hipótese implicam em liberação ou flexibilização dos requisitos previstos nos
  regulamentos aplicáveis à licença, habilitação ou certificado pretendido.

  (Redação dada pela Resolução nº 703, de 27.01.2023)'
