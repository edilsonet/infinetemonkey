cite: 141.79(a)
title: 141.79(a)
text: '(a) Todo CIAC deve possuir e manter atualizado, em meio físico ou digital, um registro
  individual para cada um de seus alunos. O registro de cada aluno deve conter:

  (1) o nome do aluno;

  (2) a data em que o aluno foi matriculado;

  (3) o nome do curso;

  (4) os documentos de matrícula;

  (5) um controle das validades das habilitações e do CMA do aluno, quando aplicável;

  (6) a comprovação do cumprimento dos requisitos da seção 141.77 deste Regulamento, caso
  o CIAC tenha concedido créditos ao aluno;

  (7) no caso de cursos teóricos, os registros de frequência e desempenho do aluno em cada
  disciplina bem como o nome do instrutor que a ministrou;

  (8) no caso de cursos práticos de voo, as fichas de instrução de voo, devidamente preenchidas
  e assinadas (por meio físico ou digital) pelo aluno e pelo instrutor;

  (9) a data e o resultado de cada avaliação teórica ou prática à qual tenha se submetido
  o aluno durante o curso, bem como o nome do instrutor que conduziu cada avaliação;

  (10) caso o aluno tenha concluído com aproveitamento o curso, uma cópia do certificado de
  conclusão de curso e do histórico da instrução com a data de sua expedição; e

  (11) caso o aluno tenha sido transferido, uma cópia do histórico e registros da instrução
  anterior e da avaliação realizada para concessão de créditos e enquadramento no novo programa
  de instrução.

  (Redação dada pela Resolução nº 703, de 27.01.2023)'
