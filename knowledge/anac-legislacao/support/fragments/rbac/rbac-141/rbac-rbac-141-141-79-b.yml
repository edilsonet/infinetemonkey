cite: 141.79(b)
title: 141.79(b)
text: '(b) O CIAC deve arquivar:

  (1) por cinco anos, os registros requeridos pelo parágrafo (a) desta seção, a partir da
  data em que o aluno concluiu, abandonou ou se transferiu para outro CIAC;

  (2) por cinco anos, o registro diário das frequências dos alunos e dos conteúdos ministrados
  por disciplina, bem como dos graus obtidos em todas as avaliações;

  (3) os registros das qualificações do instrutor, enquanto o instrutor estiver vinculado
  ao CIAC e até dois anos após o desligamento do instrutor;

  (4) os registros das qualificações do examinador credenciado, enquanto o examinador estiver
  credenciado e vinculado ao CIAC e até dois anos após o descredenciamento do examinador;

  (5) os registros dos treinamentos inicial e periódicos de cada instrutor por, pelo menos,
  dois anos; e

  (6) o registro de entrega dos certificados de conclusão de curso, por todo o período de
  existência do CIAC.'
