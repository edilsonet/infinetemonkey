cite: 141.81(a)
title: 141.81(a)
text: (a) O CIAC deve emitir, em via impressa ou digital, um certificado de conclusão de curso,
  cujo modelo deve constar no MIP, para todo aluno que conclua e seja aprovado em um curso
  com programa de instrução aprovado segundo este Regulamento.
