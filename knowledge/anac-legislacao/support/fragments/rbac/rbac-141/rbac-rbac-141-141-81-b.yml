cite: 141.81(b)
title: 141.81(b)
text: '(b) O CIAC só pode emitir um certificado de conclusão de curso a um aluno e encaminhá-lo
  para a realização dos exames aplicados pela ANAC ou por organização por ela autorizada se
  o aluno:

  (1) tiver completado a instrução especificada no programa de instrução aprovado pela ANAC;

  (2) tiver sido aprovado em todas as avaliações previstas no curso; e

  (3) tiver concluído todos os requisitos do curso em no máximo o dobro do período normal
  previsto no programa de instrução para sua conclusão.'
