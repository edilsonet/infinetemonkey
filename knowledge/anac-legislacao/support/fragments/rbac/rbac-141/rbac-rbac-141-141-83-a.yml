title: 141.83(a)
text: (a) O CIAC deve emitir um histórico da instrução, de acordo com o modelo estabelecido
  no MIP, a cada aluno que conclua satisfatoriamente um curso com programa de instrução aprovado
  ou que seja transferido antes de concluir o referido curso.
