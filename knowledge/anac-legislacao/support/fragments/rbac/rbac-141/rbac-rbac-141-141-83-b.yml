title: 141.83(b)
text: '(b) O histórico da instrução deve conter a relação de todas as disciplinas e atividades
  cursadas em que o aluno tenha sido aprovado, contendo, para cada disciplina ou atividade:

  (1) a nota final do aluno;

  (2) o percentual de frequência do aluno; e

  (3) a carga horária.'
