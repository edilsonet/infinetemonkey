title: Prestação de informações à ANAC
text: '141.85 Prestação de informações à ANAC

  O CIAC deve fornecer à ANAC, dentro da forma e dos prazos estabelecidos pela Agência, quaisquer
  informações de interesse da certificação, tais como informações sobre cursos autorizados,
  alunos, pessoal requerido, instalações, etc.'
