section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: b
cite: 141.87(b)
title: 141.87(b)
text: (b) É vedado ao detentor de um certificado de CIAC emitido segundo este Regulamento
  o uso de marcas, expressões e sinais de propaganda que contenham informações falsas ou que
  induzam a erro quanto à situação jurídica do CIAC e dos cursos cujos programas de instrução
  requeiram aprovação segundo este Regulamento.
