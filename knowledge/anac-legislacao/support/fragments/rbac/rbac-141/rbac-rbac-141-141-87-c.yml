section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: c
cite: 141.87(c)
title: 141.87(c)
text: (c) O CIAC deve remover todas as marcas, expressões e sinais de propaganda, onde quer
  que estejam localizados, e fica proibido de utilizar publicamente os impressos que contenham
  essas marcas, expressões e sinais de propaganda, referentes a cursos cujos programas de
  instrução requeiram aprovação segundo este Regulamento e que não estejam listados em suas
  EI, ou que tenham sido revogados, suspensos ou cassados pela ANAC.
