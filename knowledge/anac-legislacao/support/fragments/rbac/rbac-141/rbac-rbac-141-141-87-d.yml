section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: d
cite: 141.87(d)
title: 141.87(d)
text: (d) Um CIAC cujo certificado tenha sido revogado, suspenso ou cassado pela ANAC deve
  prontamente remover todas as marcas, expressões e sinais de propaganda que indiquem que
  o CIAC seja certificado pela ANAC, onde quer que estejam localizados.
