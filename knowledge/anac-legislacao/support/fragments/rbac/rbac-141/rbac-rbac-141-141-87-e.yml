section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: e
cite: 141.87(e)
title: 141.87(e)
text: '(e) É proibida a utilização de símbolos da ANAC, sua logomarca ou de signo semelhante
  a carimbo ou selo de autenticação em certificados de conclusão de curso, publicidade ou
  quaisquer outros documentos emitidos pelo CIAC. No entanto, é permitido o uso do nome da
  ANAC para anunciar que a instituição é certificada e/ou que o curso tem programa de instrução
  aprovado pela ANAC, desde que a certificação do CIAC e a aprovação do programa de instrução
  não esteja suspensa, revogada ou cassada, e que não haja qualquer insinuação de que a ANAC
  favoreça, ratifique determinado contrato, recomende, patrocine ou prefira qualquer curso
  ministrado pelo CIAC.

  SUBPARTE F

  EXAMINADORES CREDENCIADOS'
