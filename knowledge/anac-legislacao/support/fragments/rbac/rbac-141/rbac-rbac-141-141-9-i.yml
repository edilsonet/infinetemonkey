section_title: Suspensão ou revogação do certificado de CIAC
subsection_id: i
cite: 141.9(i)
title: 141.9(i)
text: '(i) simulou o cumprimento de qualquer dos requisitos ou padrões mínimos requeridos
  pela ANAC;

  (ii) tenha intencionalmente fornecido à ANAC informações incompletas, inexatas, fraudulentas
  ou falsas, ou tenha ocultado, omitido ou se recusado a fornecer qualquer documentação requerida
  pela ANAC; ou

  (iii) tenha realizado ou contribuído ativamente com qualquer tipo de fraude nas instruções,
  cursos, avaliações ou exames.'
