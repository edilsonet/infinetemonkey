cite: 141.91(i)
title: 141.91(i)
text: '(i) para examinador de avião, 500 horas de instrução de voo para aviões; ou

  (Redação dada pela Resolução nº 703, de 27.01.2023)

  (ii) para examinador de helicóptero, 250 horas de instrução de voo para helicópteros; ou

  (Redação dada pela Resolução nº 703, de 27.01.2023)

  (iii) para examinador das demais categorias, 2 anos de instrução em qualquer categoria de
  aeronave;

  (3) possuir válidas as licenças, habilitações e certificados para as quais pretende se credenciar
  como examinador;

  (4) possuir o curso de examinador credenciado ministrado pela ANAC ou por instituição por
  ela autorizada; e

  (5) ser aprovado em um exame prático de examinador credenciado.'
