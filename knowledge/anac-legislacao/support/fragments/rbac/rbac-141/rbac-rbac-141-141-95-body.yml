title: Atribuições do examinador credenciado
text: '141.95 Atribuições do examinador credenciado

  O examinador credenciado do CIAC só pode realizar os exames de proficiência para os quais
  for credenciado pela ANAC e sob a responsabilidade do CIAC em que estiver credenciado, conforme
  procedimentos definidos em seu sistema de manuais.'
