section_title: Limitações do examinador credenciado
subsection_id: a
cite: 141.97(a)
title: 141.97(a)
text: (a) O examinador credenciado do CIAC só pode realizar exames práticos de piloto após
  o CIAC verificar e atestar que o candidato cumpre todos os requisitos teóricos e práticos
  para obter ou revalidar a licença, habilitação ou certificado a que se refere o exame.
