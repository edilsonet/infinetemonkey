section_title: Suspensão, revogação ou cassação de credenciamento
subsection_id: a
cite: 141.99(a)
title: 141.99(a)
text: '(a) O credenciamento estará suspenso automaticamente, independentemente de qualquer
  ato administrativo da ANAC, não podendo o examinador exercer suas prerrogativas, caso:

  (1) o examinador credenciado deixar de cumprir qualquer dos requisitos necessários para
  o seu credenciamento; ou

  (2) o curso para o qual o examinador foi credenciado tiver o seu programa de instrução suspenso.'
