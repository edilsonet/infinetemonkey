title: 141.99(b)
text: (b) O credenciamento poderá ser suspenso cautelarmente caso haja suspeitas fundamentadas
  de infrações à regulamentação com risco iminente à segurança, até a averiguação dos fatos
  e/ou mitigação do risco.
