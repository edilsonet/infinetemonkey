section_title: Suspensão, revogação ou cassação de credenciamento
subsection_id: c
cite: 141.99(c)
title: 141.99(c)
text: '(c) O credenciamento será revogado:

  (1) a pedido do próprio examinador credenciado ou do CIAC;

  (2) caso o examinador credenciado se desvincule do quadro de instrutores do CIAC por meio
  do qual se credenciou; ou

  (3) caso o curso para o qual o examinador foi credenciado tiver o seu programa de instrução
  revogado ou cassado.'
