section_title: Suspensão, revogação ou cassação de credenciamento
subsection_id: e
cite: 141.99(e)
title: 141.99(e)
text: (e) O examinador que tiver o credenciamento cassado por fraude não poderá se candidatar
  a novo credenciamento segundo este Regulamento por um período de 5 (cinco) anos a contar
  da data de cassação.
