cite: 141.99(f)
title: 141.99(f)
text: (f) O CIAC que tiver o seu examinador cassado por fraude não poderá candidatar novos
  examinadores enquanto tiver pessoas envolvidas na fraude em cargos de coordenação ou de
  gestão do CIAC, por um período de 5 (cinco) anos a contar da data de cassação.
