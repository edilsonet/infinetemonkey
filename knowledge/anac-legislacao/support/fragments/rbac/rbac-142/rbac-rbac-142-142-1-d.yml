title: 142.1(d)
text: '(d) Exceto como previsto nos parágrafos (b) e (c) desta Seção, nenhuma pessoa, física
  ou jurídica,

  pode conduzir cursos, treinamentos, exames ou verificações em equipamentos de treinamento
  sem

  ser sob um certificado de CTAC e suas respectivas Especificações de Treinamento emitidos
  segundo

  este Regulamento, ou em violação às regras nele contidas.'
