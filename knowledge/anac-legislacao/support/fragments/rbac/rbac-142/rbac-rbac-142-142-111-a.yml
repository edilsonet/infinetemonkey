cite: 142.111(a)
title: 142.111(a)
text: '(a) O gerente de segurança operacional do requerente ou detentor de certificado de
  CTAC que

  utilize aeronaves deve desenvolver, implantar e manter um SGSO, aprovado pelo seu gestor

  responsável. Para o CTAC que não utiliza aeronave não é requerido que desenvolva um SGSO

  segundo este Regulamento.'
