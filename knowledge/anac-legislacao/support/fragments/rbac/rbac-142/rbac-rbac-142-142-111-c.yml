title: 142.111(c)
text: '(c) O gestor responsável do requerente ou detentor de certificado de CTAC deve implantar
  um

  SGSO compatível com o tamanho, natureza e complexidade das operações a serem conduzidas
  no

  CTAC, considerando suas Especificações de Treinamento e os perigos e riscos relacionados
  com suas

  atividades.'
