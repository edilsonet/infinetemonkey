title: 142.111(d)
text: '(d) O gestor responsável do requerente ou detentor de certificado de CTAC deve apresentar
  uma

  análise do faltante, realizada sobre a estrutura e os procedimentos existentes, de forma
  a verificar,

  dentre o previsto no parágrafo (b) desta Seção, quais estão presentes e funcionando no CTAC
  e quais

  precisam ser adequados e implantados.'
