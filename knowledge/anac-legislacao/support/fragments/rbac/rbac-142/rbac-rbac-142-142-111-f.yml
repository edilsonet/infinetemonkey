cite: 142.111(f)
title: 142.111(f)
text: '(f) O gestor responsável do requerente ou detentor de certificado de CTAC deve apresentar
  à

  ANAC, para aceitação, o plano de implantação do SGSO, desenvolvido em fases, as quais devem

  considerar:

  (1) os resultados da análise do faltante, identificando os componentes e elementos da estrutura

  do SGSO a serem desenvolvidos e colocados em funcionamento em cada fase; e

  (2) a implantação de novos elementos da estrutura do SGSO a cada fase, cumprindo o disposto

  na Seção 142.113 deste Regulamento.'
