title: 142.111(i)
text: '(i) treinamento e qualificação; e

  (ii) comunicação acerca da segurança operacional.

  Nota: os quatro componentes listados no parágrafo 142.111(b) não se referem às quatro etapas
  da

  Seção 142.113, pois cada uma destas etapas pode possuir elementos de mais de um componente
  do

  SGSO.'
