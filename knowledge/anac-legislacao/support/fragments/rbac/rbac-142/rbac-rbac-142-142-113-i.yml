section_title: Processo de planejamento de implantação do SGSO
subsection_id: i
cite: 142.113(i)
title: 142.113(i)
text: '(i) a demonstração da implantação dos aspectos tratados na primeira etapa;

  (ii) o estabelecimento de processos de identificação de perigos pelo método reativo referente

  ao desenvolvimento e implantação do gerenciamento das informações básicas e dos processos

  analíticos, conforme o elemento previsto no parágrafo 142.111(b)(2)(i) deste Regulamento;


  Data da emissão: 11 de fevereiro de 2021.


  (iii) o estabelecimento do GRSO reativo, a partir da identificação de perigo à segurança

  operacional obtida por meio de relatórios, auditorias, inspeções ou outros métodos, que
  permitam a

  avaliação e implantação de ações mitigadoras aos riscos avaliados, conforme o elemento previsto
  no

  parágrafo 142.111(b)(2)(ii) deste Regulamento;

  (iv) a definição de um sistema de relato voluntário, como parte do processo proposto para
  o

  detentor de certificado de CTAC para atender ao Programa de Relato da Aviação Civil no âmbito
  da

  ANAC (PRAC-ANAC);'
