section_title: Processo de planejamento de implantação do SGSO
subsection_id: v
cite: 142.113(v)
title: 142.113(v)
text: '(v) a definição do compromisso da administração e responsabilidade da direção conforme

  os elementos previstos nos parágrafos 142.111(b)(1)(i) e (ii) deste Regulamento;

  (vi) a definição da estrutura organizacional, conforme o elemento previsto no parágrafo

  142.111(b)(1)(iii) deste Regulamento, de forma a identificar as responsabilidades dos envolvidos
  nos

  processos e procedimentos estabelecidos no SGSO;

  (vii) a coordenação do PRE com o(s) Plano(s) de Emergência Aeroportuária (PLEM) do(s)

  aeródromo(s) onde operar, conforme o elemento previsto no parágrafo 142.111(b)(1)(iv) deste

  Regulamento;

  (viii) a emissão de documentação relativa à estrutura proposta pela organização para lidar

  com os documentos de segurança operacional, incluindo a elaboração e a manutenção do MGSO,

  conforme o elemento previsto no parágrafo 142.111(b)(1)(v) deste Regulamento; e

  (ix) a promoção da segurança operacional, contendo o programa de treinamento em

  segurança operacional para o pessoal do requerente ou detentor de certificado de CTAC e
  o programa

  de divulgação do SGSO na organização e junto à comunidade, conforme os elementos previstos
  nos

  parágrafos 142.111(b)(4)(i) e (ii) deste Regulamento;

  (2) segunda etapa - implantação dos processos reativos do SGSO, que contempla os seguintes

  aspectos:'
