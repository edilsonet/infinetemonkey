cite: 142.115(a)
title: 142.115(a)
text: '(a) O gestor responsável do detentor de um certificado de CTAC operando segundo este

  Regulamento deve desenvolver e manter seu MGSO, em papel ou mídia eletrônica, com o objetivo

  de formalizar e divulgar a abordagem de segurança operacional do CTAC.'
