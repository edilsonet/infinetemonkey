cite: 142.117(b)
title: 142.117(b)
text: '(b) O MGSO deve ser enviado para análise da ANAC, assinado pelo gerente de segurança

  operacional e pelo gestor responsável do requerente ou detentor de certificado de CTAC,
  em uma

  cópia impressa e uma cópia digital em mídia eletrônica (em arquivo do tipo “pdf”).'
