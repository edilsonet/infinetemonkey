title: 142.117(c)
text: '(c) Nos casos em que o MGSO apresentado não seja aceito, a ANAC recomendará as ações

  corretivas necessárias à sua adequação, de acordo com o estabelecido neste Regulamento,
  assim como

  estabelecerá os prazos para o cumprimento destas ações.'
