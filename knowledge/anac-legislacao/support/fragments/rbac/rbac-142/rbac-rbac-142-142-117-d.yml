section_title: Envio e processo de aceitação inicial do MGSO
subsection_id: d
cite: 142.117(d)
title: 142.117(d)
text: '(d) No caso do parágrafo (c) desta Seção, cabe ao requerente ou detentor de certificado
  de CTAC

  efetuar a(s) correção(ões) de seu MGSO e dar continuidade ao processo de aceitação, cumprindo
  as

  recomendações recebidas e respeitando os prazos estabelecidos pela ANAC. O não cumprimento
  dos

  prazos estabelecidos pode acarretar atraso ou indeferimento da certificação do CTAC, conforme
  as

  disposições contidas no parágrafo 142.7(e)(2)(iv) deste Regulamento.'
