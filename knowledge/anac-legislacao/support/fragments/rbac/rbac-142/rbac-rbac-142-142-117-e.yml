title: 142.117(e)
text: '(e) A confirmação da aceitação do MGSO ocorre quando do recebimento, por parte do gestor

  responsável do requerente ou detentor de certificado de CTAC, do respectivo documento de
  aceitação

  emitido pela ANAC.


  Data da emissão: 11 de fevereiro de 2021.'
