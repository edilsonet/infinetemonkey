text: '(d) No caso do parágrafo (c) desta Seção, o CTAC terá sua certificação suspensa conforme
  as

  disposições do parágrafo 142.7(f)(2)(xi) deste Regulamento e seu processo de certificação
  será revisto

  pela ANAC.'
