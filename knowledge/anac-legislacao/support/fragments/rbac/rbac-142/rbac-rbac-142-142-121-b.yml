title: 142.121(b)
text: '(b) As atualizações, emendas e/ou revisões devem ser efetuadas oportunamente, por iniciativa
  do

  gestor responsável do detentor de certificado de CTAC, em caso de mudanças significativas
  no

  CTAC, alterações nas características de seu SGSO ou para atualizar seus programas e cronogramas.'
