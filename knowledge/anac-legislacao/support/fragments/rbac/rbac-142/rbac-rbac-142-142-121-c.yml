cite: 142.121(c)
title: 142.121(c)
text: '(c) A ANAC pode solicitar a atualização, emenda ou revisão do MGSO sempre que for identificada

  uma situação que não corresponda ao estabelecido em regulamentação ou diante de uma situação
  que

  se configure em um nível de desempenho de segurança operacional não aceitável pela ANAC.'
