cite: 142.121(f)
title: 142.121(f)
text: '(f) Após a aceitação das atualizações, emendas e/ou revisões, o requerente ou detentor
  de

  certificado de CTAC deve enviar nova cópia física e digital do MGSO, aprovado por seu gerente
  de

  segurança operacional e por seu gestor responsável.'
