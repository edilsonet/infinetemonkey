title: 142.123(c)
text: '(c) O gestor responsável do detentor de certificado de CTAC deve assegurar que seus
  funcionários

  tenham fácil acesso a uma cópia atualizada das partes do MGSO relativas às suas funções
  e que

  estejam cientes das alterações correspondentes.'
