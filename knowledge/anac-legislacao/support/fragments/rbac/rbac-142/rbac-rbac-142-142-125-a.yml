cite: 142.125(a)
title: 142.125(a)
text: '(a) O detentor de certificado de CTAC, que utilize aeronaves em seus cursos, treinamentos,
  exames

  e verificações, deve desenvolver e manter um PRE, com as atividades de garantia de segurança

  operacional, processos formais de resposta a emergências, a menos que esteja obrigado a
  implantar

  algum outro sistema de gerenciamento de emergências de acordo com o estabelecido em regulamento

  específico da ANAC.'
