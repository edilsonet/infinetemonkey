title: 142.125(c)
text: '(c) Quando o detentor de certificado de CTAC operar em aeródromo cadastrado na ANAC,
  deve

  compatibilizar seu PRE com o PLEM desenvolvido pelo operador do aeródromo, conforme o

  parágrafo 142.113(a)(1)(vii) deste Regulamento.


  Data da emissão: 11 de fevereiro de 2021.


  SUBPARTE F

  (Revogado pela Resolução nº 467, de 03.05.2018)'
