cite: 142.13(a)
title: 142.13(a)
text: '(a) Todo CTAC certificado segundo este Regulamento, bem como seus CTAC satélites e/ou

  CTAC remotos, estão sujeitos a inspeções regulares ou vistorias, conduzidas por INSPACs
  da ANAC,

  a fim de verificar o cumprimento do MIP, do Sistema de Garantia da Qualidade, do SGSO; os

  registros; e a capacidade geral do CTAC para cumprir os requisitos deste Regulamento.'
