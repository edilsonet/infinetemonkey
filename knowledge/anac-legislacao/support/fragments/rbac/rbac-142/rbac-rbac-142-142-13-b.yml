title: 142.13(b)
text: '(b) Durante as inspeções ou vistorias da ANAC, o detentor de certificado de CTAC deve
  facilitar

  aos inspetores o acesso ao pessoal, instalações, equipamentos e qualquer documentação pertinente

  aos diversos cursos oferecidos pelo CTAC.'
