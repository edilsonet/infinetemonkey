text: '(c) Durante as inspeções ou vistorias, a ANAC pode solicitar, para fins de comprovação
  do nível

  dos cursos oferecidos, uma demonstração dos treinamentos com os alunos, quando aplicável.


  Data da emissão: 11 de fevereiro de 2021.'
