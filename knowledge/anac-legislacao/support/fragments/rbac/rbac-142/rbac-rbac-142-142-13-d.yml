text: '(d) Após realizadas as inspeções ou vistorias e caso haja evidências ou suspeitas de
  infrações ao

  disposto neste Regulamento, a ANAC tomará as medidas administrativas cabíveis. Um TAC pode

  ser proposto por ambas as partes.'
