title: 142.13(e)
text: '(e) A não implementação das medidas corretivas acordadas no TAC dentro do prazo concedido

  sujeita o CTAC à suspensão de seu certificado, de acordo com as disposições do parágrafo
  142.7(f)

  deste Regulamento.'
