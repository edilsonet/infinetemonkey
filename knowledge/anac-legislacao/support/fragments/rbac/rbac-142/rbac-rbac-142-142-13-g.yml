title: 142.13(g)
text: '(g) O gestor responsável do detentor de certificado de CTAC deve manter no CTAC principal
  e

  nos CTAC satélite, devendo apresentar a um INSPAC ou a qualquer autoridade competente nas

  diversas esferas do governo, sempre que requerido:

  (1) o certificado de CTAC;

  (2) as Especificações de Treinamento;

  (3) o MIP;

  (4) o MGSO; e

  (5) o PRE.


  Data da emissão: 11 de fevereiro de 2021.


  SUBPARTE B

  CERTIFICAÇÃO'
