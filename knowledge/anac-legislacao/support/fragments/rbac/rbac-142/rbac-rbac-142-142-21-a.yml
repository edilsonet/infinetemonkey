cite: 142.21(a)
title: 142.21(a)
text: '(a) Para obter um certificado de CTAC e suas respectivas Especificações de Treinamento,
  o

  requerente deve demonstrar à ANAC que cumpre com os requisitos estabelecidos neste Regulamento,

  devendo apresentar:

  (1) uma descrição da estrutura organizacional do CTAC;

  (2) uma relação nominal do pessoal que trabalhará no CTAC e que cumprirá com as atribuições

  outorgadas pelo certificado de CTAC, de acordo com a estrutura organizacional proposta;

  (3) uma declaração de que o requerente notificará a ANAC sobre qualquer mudança de pessoal

  requerido por este Regulamento;

  (4) a proposta das Especificações de Treinamento requeridas;

  (5) uma descrição das instalações e equipamentos de treinamento, qualificação do pessoal
  que

  irá empregar e planos de exames propostos;

  (6) o programa de treinamento proposto, incluindo currículos, material instrucional e

  procedimentos;

  (7) uma descrição do sistema de controle de registros para identificar e documentar os dados

  individuais de licenças, habilitações, treinamentos, qualificações e exames de alunos, instrutores
  e

  examinadores credenciados;

  (8) o sistema de garantia da qualidade proposto, em concordância com a Seção 142.51 deste

  Regulamento, a fim de manter os níveis de cumprimento à regulamentação e aos padrões de

  certificação;

  (9) um método para demonstrar a qualificação e a capacitação para fornecer um treinamento

  requerido com redução da carga horária mínima estabelecida, caso deseje;

  (10) a descrição do SGSO;

  (11) uma declaração de conformidade referenciando todas as seções deste Regulamento e,

  conforme aplicável, do RBHA 63, ou RBAC que venha a substituí-lo, e dos RBAC nº 61, 65,
  91, 121

  e 135; (Redação dada pela Resolução nº 606, de 11.02.2021)

  (12) o MIP e/ou suas emendas requeridas pela Seção 142.27 deste Regulamento;

  (13) o seguro conforme a legislação em vigor, caso pretenda utilizar aeronaves; e

  (14) o plano de implantação do SGSO de acordo com a Subparte E deste Regulamento.'
