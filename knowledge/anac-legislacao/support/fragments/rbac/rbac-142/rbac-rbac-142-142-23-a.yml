title: 142.23(a)
text: '(a) O gestor responsável do requerente ou detentor de certificado de CTAC deve submeter
  à

  ANAC, para aprovação, um programa de treinamento ou revisão de um programa de treinamento
  de

  acordo com os requisitos estabelecidos por esta Seção.'
