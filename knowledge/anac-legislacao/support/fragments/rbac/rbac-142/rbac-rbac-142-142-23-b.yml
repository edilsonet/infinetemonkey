section_title: Aprovação de programas de treinamento e suas revisões
subsection_id: b
cite: 142.23(b)
title: 142.23(b)
text: '(b) Se a proposta de programa de treinamento ou de revisão de programa de treinamento
  atender

  aos requisitos deste Regulamento, a ANAC concederá uma aprovação inicial para a condução
  do

  treinamento de acordo com o programa proposto. Durante o período de validade da aprovação
  inicial,

  a ANAC avaliará os treinamentos ministrados segundo o programa de treinamento aprovado e

  notificará o gestor responsável do detentor de certificado de CTAC sobre eventuais deficiências
  a

  serem corrigidas.


  Data da emissão: 11 de fevereiro de 2021.'
