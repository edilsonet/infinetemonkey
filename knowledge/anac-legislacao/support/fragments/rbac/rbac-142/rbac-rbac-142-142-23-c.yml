section_title: Aprovação de programas de treinamento e suas revisões
subsection_id: c
cite: 142.23(c)
title: 142.23(c)
text: '(c) Ao final do prazo de validade da aprovação inicial, a ANAC concederá a aprovação
  final do

  programa de treinamento ou da revisão de programa de treinamento se considerar que esse
  programa

  aprovado inicialmente, ou modificado conforme as disposições do parágrafo (b) desta Seção,
  assegura

  que uma pessoa que tenha concluído um treinamento conduzido segundo este programa esteja

  adequadamente treinada para desempenhar as funções que são objeto do treinamento.'
