section_title: Aprovação de programas de treinamento e suas revisões
subsection_id: d
cite: 142.23(d)
title: 142.23(d)
text: '(d) Para conceder a aprovação inicial ou final de programas de treinamento, ou revisões
  de

  programas de treinamento, incluindo redução de horas conforme autorizado por este Regulamento,
  a

  ANAC levará em consideração todos os auxílios de instrução, dispositivos, métodos e procedimentos

  listados pelo detentor de certificado de CTAC no currículo base ou especializado, que possam

  contribuir para a qualidade e a eficácia do treinamento. Se houver aprovação de redução
  de horas

  programadas, a ANAC fornecerá ao detentor de certificado de CTAC uma autorização por escrito

  justificando a aprovação.'
