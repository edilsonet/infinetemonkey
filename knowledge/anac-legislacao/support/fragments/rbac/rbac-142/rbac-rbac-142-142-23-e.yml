cite: 142.23(e)
title: 142.23(e)
text: '(e) Um programa de treinamento aprovado para uma empresa de transporte aéreo público,
  segundo

  os RBAC 121 ou 135, não requer aprovação segundo este Regulamento e pode ser posto em prática

  por um CTAC, sem alterações, quando conduzindo treinamentos de pessoal empregado da respectiva

  empresa aérea.'
