section_title: Aprovação de programas de treinamento e suas revisões
subsection_id: h
cite: 142.23(h)
title: 142.23(h)
text: '(h) Sempre que a ANAC verificar a necessidade da realização de revisões ou alterações,
  visando

  manter a adequação de um programa de treinamento aprovado anteriormente, será emitida uma

  notificação por escrito ao detentor do certificado especificando as modificações a serem
  feitas. Dentro

  do prazo de trinta dias após receber a notificação, o detentor do certificado pode recorrer
  da decisão

  da ANAC solicitando reconsideração da mesma. A apresentação de um recurso suspende a execução

  das modificações até a decisão final da ANAC. Entretanto, se for considerado que existe
  uma situação

  de emergência requerendo ação imediata no interesse da segurança do transporte aéreo, a
  ANAC

  pode, informando os motivos, determinar uma revisão imediata.'
