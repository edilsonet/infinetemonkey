title: 142.23(i)
text: '(i) Se, decorrido o prazo de recurso estabelecido no parágrafo (h) desta Seção e após
  a decisão

  final da ANAC, um CTAC não efetuar as alterações determinadas em seu programa de treinamento,

  sua aprovação pode ser cassada.'
