title: 142.25(a)
text: '(a) O requerente ou detentor de certificado de CTAC deve apresentar e manter atualizado
  cada

  currículo do programa de treinamento, bem como seus manuais, devendo garantir e comprovar
  a

  atualização da documentação técnica da aeronave envolvida no programa de treinamento.'
