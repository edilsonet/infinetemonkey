cite: 142.25(d)
title: 142.25(d)
text: '(d) Caso o fabricante declare expressamente não possuir programa de treinamento para
  uma

  referida aeronave, o requerente ou detentor de certificado de CTAC deve elaborar uma proposta
  de

  currículo de programa de treinamento e solicitar sua análise e aprovação à ANAC, que aprovará

  baseado em critérios de similaridade.


  Data da emissão: 11 de fevereiro de 2021.'
