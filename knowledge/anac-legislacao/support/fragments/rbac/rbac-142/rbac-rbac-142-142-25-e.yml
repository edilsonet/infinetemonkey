cite: 142.25(e)
title: 142.25(e)
text: '(e) Cada currículo proposto como parte de um programa de treinamento, submetido à ANAC
  para

  aprovação, deve cumprir os requisitos aplicáveis deste Regulamento e conter o seguinte:

  (1) os objetivos específicos de cada curso;

  (2) o público alvo do currículo;

  (3) a descrição das matérias em unidades e subunidades, indicando as respectivas cargas

  horárias;

  (4) descrições detalhadas ou cartazes gráficos de todas as manobras, ações e procedimentos

  normais, anormais e de emergência aprovados que serão executados durante cada fase do treinamento

  e exames de voo;

  (5) o método de treinamento (por exemplo, aula expositiva, aula prática, treinamento em

  simulador);

  (6) o método de exame (teórico ou prático) e as regras para aprovação;

  (7) os equipamentos de treinamento requeridos para o treinamento proposto;

  (8) os auxílios ao treinamento e o material instrucional proposto;

  (9) os requisitos e as qualificações mínimas do(s) instrutor(es) e examinador(es) credenciado(s),

  assim como a relação de instrutor(es) e examinador(es) credenciado(s)s proposto(s) que cumpre(m)

  com os requisitos mínimos de qualificação;

  (10) um currículo para treinamento inicial e periódico de cada instrutor e examinador

  credenciado envolvido, respectivamente, no treinamento e exames propostos;

  (11) para os currículos que se destinam à obtenção ou revalidação de habilitações segundo
  o

  mínima estabelecida: (Redação dada pela Resolução nº 503, de 07.02.2019)'
