cite: 142.25(i)
title: 142.25(i)
text: '(i) uma demonstração da capacidade e das condições para cumprir tal currículo com redução

  de carga horária; e

  (ii) um método apropriado para monitorar o desempenho do aluno durante o treinamento; e

  (12) uma declaração de que para cada turma em que se desenvolvam instruções teóricas, o

  número máximo de alunos por turma será de 25, em não mais do que um aluno por metro quadrado

  de sala mais 20% de área de circulação.

  (Redação dada pela Resolução nº 467, de 03.05.2018)'
