cite: 142.27(b)
title: 142.27(b)
text: '(b) O MIP pode ser elaborado em partes independentes e deve conter, no mínimo:

  (1) uma declaração assinada pelo gestor responsável do requerente ou detentor de certificado

  de CTAC que confirme que o MIP garantirá que o CTAC atenderá os requisitos estabelecidos
  neste

  Regulamento;

  (2) uma descrição geral dos programas de treinamento aprovados e constantes das

  Especificações de Treinamento, bem como dos equipamentos de treinamento a serem utilizados;

  (3) o nome, as atribuições e a qualificação da pessoa designada como gestor responsável;

  (4) os nomes e os cargos das pessoas designadas no parágrafo 142.43(j) deste Regulamento,

  especificando as funções e as responsabilidades atribuídas, inclusive os assuntos que poderão
  tratar

  diretamente com a ANAC em nome do CTAC;


  Data da emissão: 11 de fevereiro de 2021.


  (5) uma descrição organizacional do CTAC que mostre as relações de responsabilidade das

  pessoas especificadas nos parágrafos (b)(3) e (b)(4) desta Seção;

  (6) o conteúdo dos programas de treinamento aprovados pela ANAC, incluindo o material do

  curso e equipamentos que serão utilizados;

  (7) uma lista dos instrutores e examinadores credenciados;

  (8) uma descrição das instalações utilizadas para as aulas teóricas, treinamento de voo
  e exames,

  que se encontrem situadas em cada endereço especificado no certificado de CTAC e nas

  Especificações de Treinamento;

  (9) o procedimento a ser seguido para emendar o MIP;

  (10) a descrição e os procedimentos da organização com respeito ao Sistema de Garantia da

  Qualidade estabelecido na Seção 142.51 deste Regulamento;

  (11) uma descrição dos procedimentos que serão utilizados para estabelecer e manter a

  competência e/ou proficiência do pessoal de treinamento ou de exames, de acordo com as disposições

  da Seção 142.43 deste Regulamento;

  (12) uma descrição do método que será utilizado para a realização e manutenção do controle
  de

  registros; e

  (13) uma declaração de compromisso, em nome do gestor responsável do detentor de certificado

  de CTAC, de que o CTAC limitará, nas aulas teóricas, o número de alunos a um máximo de 25
  por

  turma, em não mais do que um aluno por metro quadrado de sala mais 20% de área de circulação.'
