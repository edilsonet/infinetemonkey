title: 142.27(c)
text: '(c) O gestor responsável do detentor de certificado de CTAC deve garantir que todo
  o seu pessoal

  tenha fácil acesso à cópia mais atualizada da(s) parte(s) do MIP relativa(s) a suas funções
  e que esteja

  ciente das alterações correspondentes.'
