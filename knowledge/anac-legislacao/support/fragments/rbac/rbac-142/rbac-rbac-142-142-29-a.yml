cite: 142.29(a)
title: 142.29(a)
text: '(a) O requerente ou o detentor de um certificado de CTAC deve garantir que:

  (1) cada sala de aula, dispositivo de treinamento para simulação de voo ou outro espaço

  destinado ao treinamento seja mantido em condições ambientais adequadas de temperatura,

  iluminação e ventilação;

  (2) as instalações destinadas ao treinamento não estejam sujeitas a ruídos significativos

  advindos de operações de voo, manutenção de aeronaves ou qualquer outra procedência que
  possa

  causar distrações ou incômodos indevidos que perturbem os alunos em seus estudos ou exames;

  (3) o CTAC conte com ambientes adequados, totalmente fechados e separados de outras

  instalações aonde se realizem aulas teóricas, treinamentos e/ou se apliquem os correspondentes

  exames teóricos;

  (4) as instalações atendam a requisitos mínimos de higiene e saúde;


  Data da emissão: 11 de fevereiro de 2021.


  (5) as dimensões e estruturas das instalações garantam a proteção contra as intempéries

  meteorológicas predominantes e permitam a realização de todos os cursos de treinamento;

  (6) o CTAC possua um espaço apropriado para instrutores e examinadores que lhes permitam

  preparar-se para desempenharem suas funções, sem distrações e incômodos;

  (7) o ambiente de arquivamento dos registros de exames e de treinamento assegure que os

  documentos permaneçam em bom estado durante todo o período de conservação requerido pela
  Seção'
