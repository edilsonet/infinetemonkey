title: 142.3(a)
text: '(a) Para os propósitos deste Regulamento são válidas as definições do RBAC 01 e as
  seguintes

  definições:

  (1) aprovação inicial significa o documento emitido pela ANAC que autoriza o CTAC, por um

  período de 24 meses, a ministrar treinamento para qualificar pessoal da aviação civil de
  acordo com

  um currículo base ou especializado, ou um segmento de currículo, condicionado a uma avaliação
  da

  efetividade desse treinamento;

  (2) aprovação final significa o documento emitido pela ANAC, sem uma data de vencimento,

  que autoriza o CTAC a continuar ministrando um treinamento de acordo com um currículo base
  ou

  especializado, ou um segmento de currículo, desde que não sejam feitas alterações nas Especificações

  de Treinamento ou a introdução de novo treinamento que demande modificações no programa
  de

  treinamento;

  (3) Centro de Treinamento de Aviação Civil (CTAC) significa uma organização certificada

  segundo este Regulamento para fornecer treinamento e conduzir exames teóricos e verificações
  de

  pilotos, mecânicos de voo (MCV), comissários de voo, despachantes operacionais de voo (DOV)
  e

  pessoal pertencente à administração pública;

  (4) competência significa a combinação de habilidades, conhecimentos e atitudes requeridas

  para desempenhar uma tarefa ajustando-se à norma prescrita;

  (5) CTAC estrangeiro significa um CTAC que esteja localizado fora do Brasil;

  (6) CTAC remoto significa um CTAC que é de natureza temporária e distingue-se pelo fato
  de

  poder utilizar instalações que não estão sob o controle operacional do CTAC principal;

  (7) CTAC satélite significa uma filial de um CTAC localizada no Brasil ou no exterior, sujeita

  à mesma regulamentação que o CTAC principal;

  (8) currículo base significa um conjunto de cursos aprovados segundo este Regulamento para

  uso de um CTAC, de seus CTAC satélites e/ou CTAC remotos. O cumprimento de um currículo
  base

  é requerido para a obtenção de habilitações segundo o RBAC nº 61 ou 65, ou RBHA 63, ou RBAC

  que venha a substituí-lo. Ele não inclui treinamentos para tarefas e circunstâncias específicas
  de um

  usuário em particular; (Redação dada pela Resolução nº 503, de 07.02.2019)

  (9) currículo especializado significa um conjunto de cursos elaborados para satisfazer

  requisitos específicos dos RBAC ou RBHA e aprovado, segundo este Regulamento, para uso de
  um

  determinado CTAC, de um CTAC satélite e/ou de um CTAC remoto. O currículo especializado
  inclui

  requisitos de treinamento específicos de um ou mais clientes do CTAC;

  (10) curso significa:'
