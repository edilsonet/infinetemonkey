title: 142.31(a)
text: '(a) O CTAC deve ter disponível para seu uso exclusivo e em um local aprovado pela ANAC
  o

  material adequado para o curso, incluindo pelo menos um dispositivo de treinamento para
  simulação

  de voo para cada aeronave tipo prevista nos cursos específicos.'
