section_title: Requisitos de equipamentos e materiais de ensino e apoio de treinamento
subsection_id: b
cite: 142.31(b)
title: 142.31(b)
text: '(b) Cada auxílio ou equipamento de instrução, incluindo qualquer auxílio audiovisual,
  projetor,

  gravador, programa de dispositivo de treinamento para simulação de voo, laboratório, manual,
  cartas

  aeronáuticas e outros aplicáveis, deve estar relacionado no currículo do curso de treinamento

  aprovado e deve ser apropriado para o curso no qual será utilizado.'
