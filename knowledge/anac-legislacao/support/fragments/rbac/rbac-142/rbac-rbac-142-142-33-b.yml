section_title: Requisitos de aeronaves
subsection_id: b
cite: 142.33(b)
title: 142.33(b)
text: '(b) Exceto como previsto no parágrafo (c) desta Seção, um requerente ou um detentor
  de

  certificado de CTAC deve assegurar que cada aeronave utilizada para treinamento de voo seja
  pelo

  menos uma aeronave de dois lugares, com controles de motores e de voo que possam ser operados
  e

  sejam facilmente alcançados de maneira convencional por ambos os postos de pilotagem.'
