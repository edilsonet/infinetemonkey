cite: 142.33(c)
title: 142.33(c)
text: '(c) Aviões com controles como controle direcional de bequilha, interruptores, seletores
  de

  combustível e controles do fluxo de ar que não sejam alcançados e operados facilmente de
  uma

  maneira convencional por ambos os pilotos podem ser usados para treinamento de voo se o
  detentor

  do certificado demonstrar à ANAC que o treinamento de voo pode ser ministrado de maneira
  segura

  considerando a localização dos controles ou sua operação não convencional, ou ambas.'
