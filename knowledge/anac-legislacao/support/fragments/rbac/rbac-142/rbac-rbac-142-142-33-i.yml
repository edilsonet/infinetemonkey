title: 142.33(i)
text: '(i) os requisitos aplicáveis da Subparte E do RBAC nº 91; e (Redação dada pela Resolução

  nº 606, de 11.02.2021)

  (ii) um programa aprovado para manutenção e inspeção; e


  Data da emissão: 11 de fevereiro de 2021.


  (3) ser equipada conforme previsto nas Especificações de Treinamento para o curso aprovado

  para o qual ela seja utilizada.'
