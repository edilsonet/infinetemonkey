section_title: Dispositivos de treinamento para simulação de voo
subsection_id: a
cite: 142.35(a)
title: 142.35(a)
text: '(a) O gestor responsável do requerente ou detentor de certificado de CTAC deve demonstrar
  que

  cada dispositivo de treinamento para simulação de voo utilizado para treinamento e exames
  é

  especificamente qualificado ou validado pela ANAC para:

  (1) executar cada manobra e procedimento para modelo, série de aeronave, grupo de aeronaves

  ou tipo de aeronave simulada, conforme aplicável; e

  (2) cada currículo ou curso de treinamento no qual o dispositivo de treinamento para simulação

  de voo for utilizado, se aquele currículo ou curso for utilizado para satisfazer qualquer
  requisito de

  treinamento contido nos RBHA ou RBAC.'
