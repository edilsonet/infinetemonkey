cite: 142.35(b)
title: 142.35(b)
text: '(b) A qualificação ou validação requerida pelo parágrafo (a)(2) desta Seção deve incluir:

  (1) o grupo de aeronave ou tipo de aeronave;

  (2) se aplicável, a variação particular dentro do tipo no qual o treinamento estará sendo

  ministrado ou o exame aplicado; e

  (3) a manobra particular, procedimento ou função a bordo a ser executada.'
