cite: 142.35(c)
title: 142.35(c)
text: '(c) Cada dispositivo de treinamento para simulação de voo, qualificado ou validado,
  utilizado por

  um CTAC, deve:

  (1) ser mantido para assegurar a confiabilidade dos desempenhos, funções e todas as outras

  características que foram requeridas para a qualificação;

  (2) ser modificado para se compatibilizar com qualquer alteração que ocorra na aeronave
  que é

  simulada, desde que tais modificações resultem em mudanças no desempenho, função ou outras

  características requeridas para a qualificação;

  (3) antes do início de cada dia de trabalho, ser submetido a um pré-voo funcional; e

  (4) possuir um livro para registro diário de utilização e discrepâncias observadas; tal
  livro deve

  ser preenchido pelo instrutor ou examinador credenciado ao fim de cada sessão de treinamento
  ou

  exame.'
