section_title: Dispositivos de treinamento para simulação de voo
subsection_id: d
cite: 142.35(d)
title: 142.35(d)
text: '(d) A menos que de outra forma determinado pela ANAC, cada componente em um dispositivo
  de

  treinamento para simulação de voo, qualificado ou validado, utilizado por um CTAC, deve
  estar

  operativo se aquele componente for essencial ou esteja envolvido no treinamento ou exame
  de pilotos.'
