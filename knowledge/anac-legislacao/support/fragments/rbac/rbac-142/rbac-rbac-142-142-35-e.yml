title: 142.35(e)
text: '(e) O CTAC não está restrito a específicos:


  Data da emissão: 11 de fevereiro de 2021.


  (1) cenários de segmentos de rota durante o Treinamento de Voo Orientado para Operação em

  Rota (LOFT); e

  (2) banco de dados visuais que reproduzam as bases de operação de um operador específico.'
