cite: 142.35(f)
title: 142.35(f)
text: '(f) O gestor responsável do detentor de certificado de CTAC pode solicitar inspeção
  com vistas à

  qualificação inicial e periódica para dispositivos de treinamento para simulação de voo
  sem que:

  (1) possua um Certificado de Empresa de Transporte Aéreo; ou

  (2) tenha uma relação específica com uma empresa de transporte aéreo.'
