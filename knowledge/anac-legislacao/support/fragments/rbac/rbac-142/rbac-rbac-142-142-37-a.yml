cite: 142.37(a)
title: 142.37(a)
text: '(a) O detentor de um certificado de CTAC pode conduzir treinamento de acordo com as

  Especificações de Treinamento emitidas pela ANAC em um CTAC satélite, desde que:

  (1) as instalações, equipamentos, pessoal e conteúdo do(s) curso(s) atendam os requisitos

  aplicáveis deste Regulamento;

  (2) os instrutores e examinadores credenciados do CTAC satélite sejam diretamente

  supervisionados pelo pessoal administrativo do CTAC principal;

  (3) a ANAC seja notificada por escrito pelo menos sessenta dias antes do início pretendido
  do

  funcionamento do CTAC satélite; e

  (4) as Especificações de Treinamento do detentor do certificado incluam o nome e o endereço

  do CTAC satélite, bem como listem os respectivos cursos nele oferecidos.'
