cite: 142.39(a)
title: 142.39(a)
text: '(a) O detentor de um certificado de CTAC pode conduzir treinamento aprovado pela ANAC
  em

  um CTAC remoto, desde que:

  (1) as instalações, equipamentos, pessoal e conteúdo do(s) curso(s) cumpram os requisitos

  aplicáveis deste Regulamento;

  (2) os instrutores e examinadores credenciados do CTAC remoto sejam diretamente

  supervisionados pelo pessoal administrativo do CTAC principal; e

  (3) a ANAC seja notificada, por escrito, pelo menos sessenta dias antes do início pretendido
  do

  funcionamento do CTAC remoto.'
