title: 142.41(e)
text: '(e) Os CTAC pertencentes a fabricantes de aeronaves podem fornecer treinamentos requeridos

  para aeronaves de sua fabricação, segundo os RBHA ou RBAC aplicáveis, sem a necessidade
  de

  Especificações de Treinamento emitidas segundo este Regulamento.'
