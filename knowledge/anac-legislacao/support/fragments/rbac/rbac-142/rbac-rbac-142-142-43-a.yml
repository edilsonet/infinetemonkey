cite: 142.43(a)
title: 142.43(a)
text: '(a) Cada CTAC deve contar, pelo menos, com o seguinte pessoal:

  (1) gestor responsável;

  (2) coordenador de treinamento;

  (3) coordenador de treinamento de solo;

  (4) coordenador de treinamento de voo;

  (5) coordenador de manutenção, se aplicável;

  (6) instrutores de solo e de voo (para equipamentos de treinamento);

  (7) gerente da qualidade; e

  (8) gerente de segurança operacional.'
