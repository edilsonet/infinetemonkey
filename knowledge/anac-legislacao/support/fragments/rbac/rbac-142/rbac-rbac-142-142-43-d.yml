title: 142.43(d)
text: '(d) Todos os cargos listados no parágrafo (a) desta Seção podem ser acumulados, com
  exceção

  dos seguintes casos:

  (1) o gerente da qualidade não pode acumular com nenhum outro cargo; e

  (2) quaisquer outros cargos que a ANAC considere que não podem ser acumulados, tendo em

  vista o tamanho e a complexidade das operações do CTAC.'
