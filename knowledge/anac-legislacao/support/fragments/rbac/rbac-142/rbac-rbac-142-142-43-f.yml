cite: 142.43(f)
title: 142.43(f)
text: '(f) Os nomes de todos os cargos e funções ocupados no CTAC, que sejam requeridos pelo

  parágrafo (a) desta Seção, assim como os nomes das pessoas que exercerão esses cargos e
  funções,

  suas experiências, qualificações e a indicação das responsabilidades individuais de cada
  um, devem

  ser incluídos no MIP e este deve ser emendado em caso de substituição de alguma dessas pessoas.'
