text: '(g) As pessoas que ocuparão os cargos e funções listados no parágrafo (a) desta Seção
  devem

  ainda:

  (1) ser qualificadas por meio de treinamento, experiência e/ou proficiência;

  (2) demonstrar, na extensão de suas responsabilidades, entendimento das seguintes matérias,

  no que diz respeito às operações do detentor de certificado de CTAC:'
