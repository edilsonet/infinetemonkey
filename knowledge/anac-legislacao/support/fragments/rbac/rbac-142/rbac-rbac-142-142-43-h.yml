text: '(h) O CTAC deve contar com uma estrutura de direção que lhe permita o controle de todos
  os

  níveis da organização por meio de pessoas que possuam a formação, a experiência e as qualificações

  necessárias para garantir a manutenção do nível de qualidade dos treinamentos.'
