cite: 142.43(i)
title: 142.43(i)
text: '(i) padrões de segurança em aviação e práticas operacionais seguras;

  (ii) Regulamentos Brasileiros de Aviação Civil (RBAC) ou Regulamentos Brasileiros de

  Homologação Aeronáutica (RBHA), conforme a vigência dos mesmos;

  (iii) Especificações de Treinamento; e


  Data da emissão: 11 de fevereiro de 2021.


  (iv) requisitos aplicáveis de manutenção e de aeronavegabilidade contidos na legislação,

  caso aplicável; e

  (3) executar suas obrigações atendendo aos requisitos legais aplicáveis e mantendo as operações

  de treinamento seguras.'
