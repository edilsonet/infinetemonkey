cite: 142.43(j)
title: 142.43(j)
text: '(j) O gestor responsável do detentor de certificado de CTAC deve designar uma pessoa
  ou grupo

  de pessoas, de acordo com o tamanho e a estrutura do CTAC, que lhe seja diretamente subordinado,

  cujas responsabilidades incluam o planejamento, realização e supervisão do treinamento,
  incluindo o

  monitoramento do Sistema de Garantia da Qualidade, a fim de assegurar que o CTAC cumpra
  com

  os requisitos estabelecidos por este Regulamento.'
