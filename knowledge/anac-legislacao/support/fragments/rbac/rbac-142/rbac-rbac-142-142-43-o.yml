cite: 142.43(o)
title: 142.43(o)
text: '(o) Durante o treinamento, o gestor responsável do detentor de certificado de CTAC
  deve

  assegurar-se que o(s) coordenador(es) de treinamento ou o(s) assistente(s), se aplicável,
  esteja(m)

  presente(s) no CTAC. Caso não esteja(m), deve ser estabelecido um método para sua localização,
  por

  telefone, rádio, ou outro meio de que disponha o CTAC.'
