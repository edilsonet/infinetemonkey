cite: 142.43(p)
title: 142.43(p)
text: '(p) O CTAC deve designar um gestor responsável, que seja a pessoa única e identificável
  na

  estrutura organizacional do CTAC que, independentemente de outras atribuições, possua as
  seguintes

  prerrogativas:

  (1) tenha a autoridade final sobre as operações conduzidas sob os regulamentos aplicáveis
  ao

  CTAC;

  (2) decida sobre a alocação de recursos humanos, financeiros e técnicos do PSAC; e

  (3) seja o responsável por prestar contas pelo desempenho de segurança operacional do CTAC.

  (Incluído pela Resolução nº 503, de 07.02.2019)'
