cite: 142.43(u)
title: 142.43(u)
text: '(u) Para cumprir com as responsabilidades citadas no parágrafo (t), o gerente de segurança

  operacional deve ser a pessoa única e identificável na estrutura organizacional do CTAC
  que,

  independentemente de outras atribuições, possui:

  (1) acesso direto ao gestor responsável; e

  (2) acesso aos dados e informações de segurança operacional necessários ao exercício dessas

  responsabilidades.

  (Incluído pela Resolução nº 503, de 07.02.2019)'
