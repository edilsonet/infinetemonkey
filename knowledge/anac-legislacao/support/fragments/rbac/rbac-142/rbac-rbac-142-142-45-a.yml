title: 142.45(a)
text: '(a) O gestor responsável do detentor de certificado de CTAC não pode permitir que uma
  pessoa

  atue como instrutor de voo, a menos que essa pessoa:

  (1) esteja qualificada e habilitada no tipo de aeronave na qual conduzirá o treinamento;

  (2) satisfaça as exigências dos parágrafos (c) e (d) desta Seção; e

  (3) cumpra as seguintes condições, conforme aplicáveis:'
