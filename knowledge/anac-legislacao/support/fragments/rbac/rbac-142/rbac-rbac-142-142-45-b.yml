cite: 142.45(b)
title: 142.45(b)
text: '(b) O gestor responsável do detentor de certificado de CTAC deve designar cada instrutor,
  por

  escrito, especificando em que curso aprovado estará alocado, antes daquela pessoa começar
  a exercer

  as funções de instrutor naquele curso específico.'
