section_title: Requisitos para instrutores de CTAC
subsection_id: c
cite: 142.45(c)
title: 142.45(c)
text: '(c) Antes da designação inicial, cada instrutor deve completar pelo menos oito horas
  de

  treinamento teórico nos seguintes assuntos:

  (1) métodos e técnicas de instrução;

  (2) treinamento de normas e procedimentos;

  (3) princípios fundamentais do processo de aprendizagem;

  (4) deveres, prerrogativas, responsabilidades e limitações do instrutor;

  (5) operação de controles e sistemas de simulação;

  (6) operação de controle ambiental;

  (7) limitações de simulação;

  (8) requisitos de equipamentos mínimos para cada currículo;

  (9) revisões dos cursos;

  (10) gerenciamento de recursos de cabine (CRM) e coordenação de tripulação;

  (11) objetivos e resultados a atingir ao finalizar cada curso aprovado para o qual for designado;
  e


  Data da emissão: 11 de fevereiro de 2021.


  (12) provisões aplicáveis a este Regulamento, ao RBAC nº 61 e 65, ao RBHA 63, ou RBAC

  que venha a substituí-lo, e a outros regulamentos pertinentes, conforme correspondam aos
  cursos a

  desenvolver. (Redação dada pela Resolução nº 503, de 07.02.2019)'
