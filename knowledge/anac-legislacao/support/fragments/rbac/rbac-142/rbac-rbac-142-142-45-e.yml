section_title: Requisitos para instrutores de CTAC
subsection_id: e
cite: 142.45(e)
title: 142.45(e)
text: '(e) Cada instrutor que ministre treinamento em equipamento de treinamento qualificado
  ou

  validado pela ANAC deve, a partir da data da designação inicial, ser anualmente aprovado
  em exame

  teórico e em exame de proficiência por um INSPAC ou, a critério da ANAC, por um examinador

  credenciado:

  (1) nos assuntos especificados pelos parágrafos (d)(1), (d)(3) e (d)(5) desta Seção; e

  (2) no equipamento de treinamento no qual o instrutor esteja ministrando treinamento (assuntos

  e manobras de uma fase representativa de cada currículo para o qual o instrutor esteja ministrando

  treinamento).'
