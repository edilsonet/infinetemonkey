section_title: Requisitos para instrutores de CTAC
subsection_id: f
cite: 142.45(f)
title: 142.45(f)
text: '(f) Em adição às exigências do parágrafo (e) desta Seção, cada CTAC deve assegurar
  que cada

  instrutor que ministre treinamento em dispositivo de treinamento para simulação de voo aprovado
  ou

  validado pela ANAC, para a condução de todo treinamento para a concessão ou revalidação
  de

  habilitação de tipo, que esse instrutor tenha realizado um Treinamento Orientado para Operação
  em

  Rota (LOFT) com pelo menos uma hora de voo, durante o qual o instrutor tenha operado os
  controles,

  na função de primeiro em comando, em um dispositivo de treinamento para simulação de voo
  do

  mesmo tipo da aeronave para o qual for designado a ministrar treinamento.'
