title: 142.45(g)
text: '(g) Para um instrutor que tenha completado satisfatoriamente as exigências previstas
  nos

  parágrafos (d) e (e) desta Seção, a data de validade deve ser:

  (1) a data do vencimento anterior mais doze meses, caso as exigências tenham sido atendidas

  em no máximo 45 dias corridos antes do vencimento anterior; ou

  (2) a data de atendimento dos requisitos mais doze meses.'
