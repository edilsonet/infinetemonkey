cite: 142.45(h)
title: 142.45(h)
text: '(h) A ANAC pode considerar cumpridos os requisitos dos parágrafos (e) e (f) desta Seção
  para um

  instrutor que satisfatoriamente tenha concluído um curso de treinamento para instrutores
  de um

  detentor de certificado regido pelo RBAC 121 ou 135, caso a ANAC considere o conteúdo de
  tal

  curso equivalente aos requeridos pelos parágrafos (e) e (f) desta Seção.'
