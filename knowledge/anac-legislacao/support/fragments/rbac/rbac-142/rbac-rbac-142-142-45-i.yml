section_title: Requisitos para instrutores de CTAC
subsection_id: i
cite: 142.45(i)
title: 142.45(i)
text: '(i) se ministrando treinamento em equipamento de treinamento que requeira uma habilitação

  de tipo, satisfaça as exigências de experiência para a concessão de licença de piloto de
  linha aérea

  segundo a Seção 61.141 do RBAC 61, conforme aplicável; (Redação dada pela Resolução nº 467,
  de

  03.05.2018)

  (ii) esteja vinculado a um CTAC como instrutor de equipamento de treinamento; e

  (iii) seja titular de uma licença vigente de mecânico de voo ou comissário de voo emitida

  conforme o RBHA 63, ou RBAC que venha a substituí-lo, que corresponda aos cursos a serem

  ministrados.'
