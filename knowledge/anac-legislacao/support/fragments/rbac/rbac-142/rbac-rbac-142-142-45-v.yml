cite: 142.45(v)
title: 142.45(v)
text: '(v) gerenciamento dos recursos de cabine (CRM) e coordenação de tripulação;

  (vi) desempenho e análise das manobras e procedimentos do treinamento de voo aplicáveis

  aos cursos em que o instrutor for designado a ministrar treinamento;

  (vii) assuntos técnicos relativos aos sistemas e subsistemas da aeronave e aos procedimentos

  operacionais aplicáveis aos currículos em que o instrutor for designado a ministrar treinamento;

  (viii) operações de emergência;

  (ix) desenvolvimento de situações simuladas de emergências prováveis durante o

  treinamento; e'
