cite: 142.47(b)
title: 142.47(b)
text: '(b) O gestor responsável do detentor de certificado de CTAC deve se assegurar que cada
  pessoa

  autorizada como um examinador credenciado:

  (1) seja aprovado e designado individualmente pela ANAC;

  (2) atenda continuamente aos requisitos de instrutor de CTAC da Seção 142.45 deste

  Regulamento;

  (3) tenha realizado no mínimo um curso de examinador credenciado ministrado pela ANAC;

  (4) antes da designação e a cada período de doze meses, contados a partir da data da designação

  inicial, complete, no mínimo, quatro horas de treinamento teórico nos assuntos abaixo citados:'
