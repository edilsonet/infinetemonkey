section_title: Requisitos para examinadores credenciados de CTAC
subsection_id: c
cite: 142.47(c)
title: 142.47(c)
text: '(c) Para um examinador credenciado que tenha completado satisfatoriamente as exigências

  previstas nos parágrafos (b)(3) e (b)(4) desta Seção, a data de validade deve ser:

  (1) a data do vencimento anterior mais doze meses, caso as exigências tenham sido atendidas

  em no máximo 45 dias corridos antes do vencimento anterior; ou

  (2) a data de atendimento dos requisitos mais doze meses.'
