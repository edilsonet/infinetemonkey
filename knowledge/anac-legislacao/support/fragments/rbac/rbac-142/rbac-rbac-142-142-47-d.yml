section_title: Requisitos para examinadores credenciados de CTAC
subsection_id: d
cite: 142.47(d)
title: 142.47(d)
text: '(d) Um examinador credenciado que seja qualificado de acordo com um Programa de Qualificação

  Avançada (AQP), regido pela Subparte Y do RBAC 121, pode realizar os exames requeridos pelo

  AQP sem necessidade de cumprir com os requisitos desta Seção.'
