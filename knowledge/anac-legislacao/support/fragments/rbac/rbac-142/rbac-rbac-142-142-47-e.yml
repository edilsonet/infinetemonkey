section_title: Requisitos para examinadores credenciados de CTAC
subsection_id: e
cite: 142.47(e)
title: 142.47(e)
text: '(e) O examinador credenciado que exerça suas atividades em aeronaves em voo deve estar
  com o

  CMA válido, de acordo com as disposições contidas no RBAC 67. O examinador credenciado que

  exerça suas atividades exclusivamente em dispositivos de treinamento para simulação de voo
  não

  precisa possuir um CMA válido.'
