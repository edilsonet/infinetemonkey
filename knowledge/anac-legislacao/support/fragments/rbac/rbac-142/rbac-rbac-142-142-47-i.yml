title: 142.47(i)
text: '(i) deveres, funções e responsabilidades de um examinador credenciado;

  (ii) métodos, procedimentos e técnicas para aplicação de exames e verificações requeridos;

  (iii) avaliação de desempenho para pilotos; e


  Data da emissão: 11 de fevereiro de 2021.


  (iv) gerenciamento de exames insatisfatórios e subsequentes ações corretivas; e

  (5) se avaliando em um equipamento de treinamento qualificado ou validado pela ANAC,

  realize um exame teórico e de proficiência a cada doze meses subsequentes à designação inicial
  em

  simulador de voo ou aeronave no qual essa pessoa esteja designada como examinador.'
