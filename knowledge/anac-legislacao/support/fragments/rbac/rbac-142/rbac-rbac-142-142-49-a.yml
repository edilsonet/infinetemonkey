cite: 142.49(a)
title: 142.49(a)
text: '(a) O gestor responsável do requerente ou detentor de certificado de CTAC pode solicitar

  autorização à ANAC para ministrar um curso não previsto por este Regulamento, desde que
  esse

  curso esteja vinculado à execução de funções ligadas à aviação civil.'
