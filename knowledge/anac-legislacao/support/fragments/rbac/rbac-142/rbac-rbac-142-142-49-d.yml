title: 142.49(d)
text: '(d) O curso para o qual o currículo seja preparado será autorizado pela ANAC se o requerente
  ou

  detentor de certificado de CTAC demonstrar que aquele curso atende os requisitos aplicáveis
  deste

  Regulamento.'
