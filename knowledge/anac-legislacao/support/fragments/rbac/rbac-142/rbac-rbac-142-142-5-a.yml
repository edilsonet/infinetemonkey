cite: 142.5(a)
title: 142.5(a)
text: '(a) Salvo o disposto na Seção 142.41 deste Regulamento, referente aos CTAC estrangeiros,

  nenhuma pessoa pode operar um CTAC sem um certificado de CTAC e suas respectivas

  Especificações de Treinamento, emitidos pela ANAC segundo este Regulamento, ou em violação
  a

  estes. (Redação dada pela Resolução nº 467, de 03.05.2018)'
