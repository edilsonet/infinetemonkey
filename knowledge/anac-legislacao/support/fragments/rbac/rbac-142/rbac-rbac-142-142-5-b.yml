cite: 142.5(b)
title: 142.5(b)
text: '(b) Um requerente de certificado de CTAC e de suas respectivas Especificações de Treinamento,

  com as apropriadas limitações de operação, estará habilitado a recebê-los se demonstrar
  que possui

  pelo menos um programa de treinamento, instalações, equipamentos, equipamento(s) de treinamento,

  pessoal e material instrucional adequados para conduzir treinamento segundo este Regulamento.'
