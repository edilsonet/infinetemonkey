title: 142.5(d)
text: '(d) Um CTAC certificado pelo Sistema Regional de Cooperação para a Vigilância da Segurança

  Operacional (SRVSOP) sob as regras do Regulamento Aeronáutico Latino-Americano 142 (LAR

  142) será convalidado, desde que sejam cumpridos os requisitos adicionais aplicáveis referentes
  às

  normas brasileiras.'
