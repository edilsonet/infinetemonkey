cite: 142.51(a)
title: 142.51(a)
text: '(a) O gestor responsável do detentor de certificado de CTAC deve adotar um sistema
  de garantia

  da qualidade aceitável pela ANAC, o qual deve ser incluído no MIP, que garanta as condições
  de

  treinamento requeridas e o cumprimento dos requisitos estabelecidos neste Regulamento.'
