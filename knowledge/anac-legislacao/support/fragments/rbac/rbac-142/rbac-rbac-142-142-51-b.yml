section_title: Sistema de Garantia de Qualidade
subsection_id: b
cite: 142.51(b)
title: 142.51(b)
text: '(b) O sistema de garantia da qualidade deve conter os seguintes elementos:

  (1) auditorias independentes de qualidade para monitorar os resultados e o cumprimento dos

  objetivos do treinamento, a integridade dos exames, assim como o cumprimento e idoneidade
  dos

  procedimentos. O CTAC que não dispuser de um sistema de auditorias independentes de qualidade

  pode contratar um outro CTAC ou uma pessoa idônea com conhecimento técnico aeronáutico;
  e

  (2) um sistema de relatórios de retroalimentação da qualidade para a pessoa ou grupo de
  pessoas

  requerido no parágrafo 142.43(j) deste Regulamento e, em última instância, ao gestor responsável
  do

  detentor de certificado de CTAC, a fim de que se assegure que sejam adotadas as medidas
  corretivas

  e preventivas apropriadas em resposta aos relatórios resultantes das auditorias independentes

  realizadas.


  Data da emissão: 11 de fevereiro de 2021.'
