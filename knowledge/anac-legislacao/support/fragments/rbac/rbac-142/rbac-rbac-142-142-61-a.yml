cite: 142.61(a)
title: 142.61(a)
text: '(a) O gestor responsável do detentor de certificado de CTAC deve garantir o fornecimento
  a cada

  aluno, no momento de sua inscrição, da seguinte documentação:

  (1) um comprovante de inscrição contendo o nome do curso aprovado no qual o aluno está se

  inscrevendo e a data de inscrição; e

  (2) uma cópia do currículo do programa de treinamento, com os horários respectivos e

  instrutor(es) destacado(s), assim como o material de estudo correspondente.'
