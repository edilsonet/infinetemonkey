cite: 142.61(b)
title: 142.61(b)
text: '(b) Com relação aos exames:

  (1) o gestor responsável do detentor de certificado de CTAC deve garantir que sejam elaborados

  exames para cada aluno que tenha concluído uma fase dentro de um programa de treinamento

  aprovado pela ANAC;

  (2) quando um exame compreender mais de uma matéria, o aluno deve obter pontuação mínima

  de cada matéria parcial para que possa ser considerado aprovado;

  (3) os instrutores e examinadores devem garantir a confidencialidade das perguntas a serem

  usadas nos exames;

  (4) qualquer aluno que seja flagrado fraudando um exame, ou em posse de material relativo
  ao

  exame, com exceção de documentação autorizada correspondente, será desqualificado para realização

  desse exame, e caso já concluído, terá o seu exame anulado, e será proibido de apresentar-se
  a

  qualquer outro exame durante um prazo de doze meses a partir da data do evento;

  (5) qualquer instrutor ou examinador credenciado que seja flagrado antes, durante ou após
  um

  exame facilitando respostas aos alunos examinados, terá sua habilitação como instrutor e/ou
  seu

  credenciamento de examinador cassado pela ANAC; e

  (6) caso ocorra a situação prevista no parágrafo (b)(5) desta Seção:'
