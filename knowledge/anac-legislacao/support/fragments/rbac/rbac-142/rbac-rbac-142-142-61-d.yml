cite: 142.61(d)
title: 142.61(d)
text: '(d) O gestor responsável do detentor de certificado de CTAC deve assegurar-se que:

  (1) não sejam utilizados nos dispositivos de treinamento para simulação de voo, durante
  o(s)

  exame(s), recursos tais como: “freeze”, “slow motion” ou reposicionamento; exceto se necessário

  para otimizar o(s) exame(s); e

  (2) o recurso de reposicionamento seja utilizado somente para avançar de um ponto ao longo

  de uma rota para o ponto que inicia a fase de descida e aproximação, durante uma simulação
  de

  operação em rota para LOFT ou exame orientado para operações em rota.'
