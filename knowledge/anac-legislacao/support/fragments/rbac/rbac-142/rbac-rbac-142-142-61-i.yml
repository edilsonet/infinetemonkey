cite: 142.61(i)
title: 142.61(i)
text: '(i) todo o exame será anulado e o fato deve ser informado à ANAC;

  (ii) os alunos envolvidos com a fraude devem se submeter aos dispositivos previstos no

  parágrafo (b)(4) desta Seção; e

  (iii) os alunos não envolvidos com a fraude podem se submeter a novo exame assim que o

  queiram.'
