title: 142.61(v)
text: '(v) a declaração de que o aluno concluiu cada fase requerida do curso realizado, incluindo
  a

  carga horária, os exames de cada módulo e os exames finais do aluno em cada disciplina;

  (vi) os registros dos treinamentos de voo recebidos, com o total das horas e sessões em

  equipamento de treinamento, de acordo com o programa de treinamento aprovado pela ANAC;
  e


  Data da emissão: 11 de fevereiro de 2021.


  (vii) a assinatura do gestor responsável do detentor de certificado de CTAC atestando a

  conclusão do curso.'
