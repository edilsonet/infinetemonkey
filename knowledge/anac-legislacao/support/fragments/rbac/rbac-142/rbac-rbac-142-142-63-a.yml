title: 142.63(a)
text: '(a) Com exceção do disposto no parágrafo 142.23(b), o detentor de um certificado de
  CTAC só

  pode oferecer os cursos de treinamento indicados no certificado correspondente e Especificações
  de

  Treinamento aprovados pela ANAC.'
