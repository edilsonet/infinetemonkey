cite: 142.63(b)
title: 142.63(b)
text: '(b) Um detentor de certificado de CTAC pode permitir que seus instrutores e examinadores

  credenciados em aeronave adquiram experiência recente requerida utilizando um simulador
  de voo

  qualificado ou validado pela ANAC e no nível adequado à realização do treinamento, desde
  que este

  seja:

  (1) utilizado em um curso aprovado segundo este Regulamento; ou

  (2) aprovado de acordo com um Programa de Qualificação Avançada (AQP) para o atendimento

  de requisitos de experiência recente.'
