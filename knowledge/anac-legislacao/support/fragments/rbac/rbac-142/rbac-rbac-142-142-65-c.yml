cite: 142.65(c)
title: 142.65(c)
text: '(c) O gestor responsável do detentor de certificado de CTAC não pode permitir que um
  instrutor

  ministre mais de oito horas de treinamento em qualquer período sucessivo de 24 horas, incluindo

  “briefings” e “debriefings”.'
