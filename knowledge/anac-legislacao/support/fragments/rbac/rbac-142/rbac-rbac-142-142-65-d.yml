title: 142.65(d)
text: '(d) O gestor responsável do detentor de certificado de CTAC não pode permitir que um

  examinador credenciado exerça suas prerrogativas por mais de oito horas em qualquer período

  sucessivo de 24 horas, incluindo “briefings” e “debriefings”.'
