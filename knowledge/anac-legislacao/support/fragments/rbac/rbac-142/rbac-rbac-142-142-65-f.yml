title: 142.65(f)
text: '(f) O CTAC não pode permitir que uma pessoa exerça as prerrogativas de examinador credenciado

  sem que cumpra os requisitos da Seção 142.47 deste Regulamento.


  Data da emissão: 11 de fevereiro de 2021.'
