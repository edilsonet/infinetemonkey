cite: 142.65(g)
title: 142.65(g)
text: '(g) Um CTAC não pode aplicar exames em alunos que não tenham realizado todo o treinamento

  no próprio CTAC, exceto se tal condição já estiver expressamente prevista nas Especificações
  de

  Treinamento do CTAC.'
