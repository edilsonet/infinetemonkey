section_title: Prerrogativas e limitações de instrutores de CTAC
subsection_id: a
cite: 142.67(a)
title: 142.67(a)
text: '(a) Um instrutor de um CTAC pode prover:

  (1) treinamento em equipamento de treinamento e exame teórico para cada currículo no qual

  esteja qualificado; e

  (2) treinamento em equipamento de treinamento e exame teórico a fim de satisfazer requisitos

  de qualquer parte deste Regulamento.'
