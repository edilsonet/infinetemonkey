section_title: Prerrogativas e limitações de examinadores credenciados de CTAC
subsection_id: a
cite: 142.69(a)
title: 142.69(a)
text: '(a) Um examinador credenciado de um CTAC pode:

  (1) aplicar exames práticos ou verificações para cada currículo para o qual esteja qualificado;
  e

  (2) aplicar exames práticos ou verificações a fim de satisfazer requisitos de qualquer parte
  deste

  Regulamento.'
