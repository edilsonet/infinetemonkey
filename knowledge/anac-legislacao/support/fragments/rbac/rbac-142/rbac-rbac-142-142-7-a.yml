cite: 142.7(a)
title: 142.7(a)
text: '(a) A solicitação para emissão de um certificado de CTAC e de suas respectivas Especificações
  de

  Treinamento deve:

  (1) ser realizada por formulário e procedimentos estabelecidos pela ANAC;

  (2) pelo menos 120 dias antes da data do início pretendido de qualquer treinamento; e

  (3) pelo menos noventa dias antes da data de expiração do certificado anterior, em caso
  de

  CTAC localizado em país estrangeiro.'
