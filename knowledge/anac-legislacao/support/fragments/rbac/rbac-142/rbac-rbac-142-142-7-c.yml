cite: 142.7(c)
title: 142.7(c)
text: '(c) O requerente de um certificado de CTAC deve assegurar que as instalações e equipamentos

  descritos em sua solicitação estejam instalados e operacionais no local proposto e disponíveis
  para

  inspeção antes de sua certificação.'
