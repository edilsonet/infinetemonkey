text: '(f) A ANAC pode suspender um certificado de CTAC em vigor se:

  (1) for constatado em inspeções ou vistorias que o detentor de certificado de CTAC não cumpre

  algum dos requisitos deste Regulamento; e

  (2) evidenciar que o CTAC:'
