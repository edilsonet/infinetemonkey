title: 142.7(g)
text: '(g) A ANAC pode cassar um certificado de CTAC em vigor se:

  (1) o detentor de um certificado suspenso não regularizar as causas que deram origem à

  suspensão em até 180 dias contados a partir da data da suspensão;

  (2) for constatado que o detentor de certificado de CTAC não cumpre algum dos requisitos

  deste Regulamento e que não tem interesse ou capacidade para regularizar a situação; e

  (3) evidenciar que o CTAC:'
