cite: 142.7(h)
title: 142.7(h)
text: '(h) A ANAC pode emendar um certificado de CTAC, a qualquer tempo, por:

  (1) iniciativa da própria ANAC, caso considere que a segurança do transporte aéreo e o interesse

  público requerem a emenda determinada; ou

  (2) solicitação de seu detentor, com a antecedência estabelecida no parágrafo (i) desta
  Seção.'
