subsection_id: i
cite: 142.7(i)
title: 142.7(i)
text: '(i) possui alguma condição que represente um risco para a segurança operacional de
  suas

  atividades;

  (ii) pretende colocar ou colocou em uma posição administrativa listada em 142.43(a) uma

  pessoa com comprovado histórico de conduta e/ou desempenho inadequados. Para os efeitos
  do

  disposto neste parágrafo, consideram-se comprovado histórico de conduta e/ou desempenho

  inadequados os casos em que, há menos de cinco anos contados da data da designação:

  (A) em decorrência de constatação de irregularidade em que o designado tenha

  comprovadamente reponsabilidade direta pela causa da irregularidade, enquanto ocupante de
  posição

  administrativa requerida pela ANAC, tenha sido aplicada, a um provedor de serviço de aviação
  civil

  certificado pela ANAC, uma medida de:

  ( 1 ) suspensão ou restrição das operações por mais de 90 dias pela ANAC; ou

  ( 2 ) revogação, cassação ou cancelamento de certificados ou autorizações; ou

  (B) o designado tenha sofrido sanção administrativa capitulada no art. 299, incisos I, V,

  VI ou VII, da Lei nº 7.565, de 19 de dezembro de 1986, ainda que naquelas ocasiões não ocupasse

  uma posição administrativa requerida pela ANAC para um provedor de serviço de aviação civil;

  (Redação dada pela Resolução nº 503, de 07.02.2019)

  (iii) tenha fornecido informações falsas, incompletas ou inexatas com a finalidade de obter

  um certificado de CTAC;


  Data da emissão: 11 de fevereiro de 2021.


  (iv) não possui um SGSO implantado e operacional, ou que não esteja sendo implantado de

  acordo com o plano de implantação aceito, segundo a Subparte E deste Regulamento; ou'
