subsection_id: v
cite: 142.7(v)
title: 142.7(v)
text: '(v) deixa de ter pessoal, instalações ou equipamentos de treinamento requeridos;

  (vi) permaneceu inativo (sem realizar nenhum treinamento) por um período superior a 180

  dias;

  (vii) realizou qualquer mudança significativa nas instalações do CTAC sem notificar e obter

  autorização prévia da ANAC;

  (viii) deixou de implementar as medidas corretivas acordadas no TAC previsto pelo

  parágrafo 142.13(d) deste Regulamento dentro do prazo concedido pela ANAC;

  (ix) deixou de notificar à ANAC as alterações indicadas na Seção 142.73 deste Regulamento;'
