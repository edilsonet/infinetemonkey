cite: 142.7(x)
title: 142.7(x)
text: '(x) realizou qualquer alteração de propriedade do CTAC, exceto se, dentro do prazo
  de trinta

  dias seguintes:

  (A) o detentor do certificado prepare as emendas apropriadas ao certificado e as

  Especificações de Treinamento e as submeta à aprovação da ANAC; e

  (B) não se tenham realizado mudanças significativas nas instalações, pessoal operacional

  ou cursos de treinamento aprovados; ou

  (xi) não consegue demonstrar que o SGSO esteja implantado e operando, ou sendo

  implantado de acordo com o plano de implantação aceito, segundo a Subparte E deste Regulamento.'
