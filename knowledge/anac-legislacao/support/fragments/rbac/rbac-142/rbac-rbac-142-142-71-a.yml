section_title: Requisitos para emissão, conservação e envio de registros à ANAC
subsection_id: a
cite: 142.71(a)
title: 142.71(a)
text: '(a) O gestor responsável do detentor de certificado de CTAC deve manter e conservar
  os registros

  detalhados de cada aluno, a fim de demonstrar que cumpriu todos os requisitos do curso de

  treinamento da forma aprovada pela ANAC, contendo:

  (1) o nome do aluno;

  (2) informações das licenças e habilitações do aluno e do CMA; (Redação dada pela Resolução

  nº 467, de 03.05.2018)

  (3) o nome do curso, bem como a categoria, tipo e/ou o modelo do equipamento de treinamento

  de voo utilizado, conforme aplicável;

  (4) a experiência prévia do aluno e a data de início e término do curso;


  Data da emissão: 11 de fevereiro de 2021.


  (5) cópia da ficha de presença nas aulas teóricas, do exame teórico (original), cópia das
  fichas

  de treinamento em equipamento de treinamento e cópia da ficha de exame;

  (6) a data e o resultado de cada exame e o nome do instrutor ou examinador credenciado que

  conduziu o exame; e

  (7) o número de horas adicionais de treinamento que o aluno tenha realizado após ter sido

  reprovado em qualquer exame prático, caso aplicável.'
