section_title: Requisitos para emissão, conservação e envio de registros à ANAC
subsection_id: b
cite: 142.71(b)
title: 142.71(b)
text: '(b) O gestor responsável do detentor de certificado de CTAC deve manter um registro
  para cada

  instrutor e/ou examinador credenciado designado para ministrar treinamento e/ou exame em
  um curso

  aprovado segundo este Regulamento, indicando que os mesmos cumpriram os requisitos contidos
  nas

  seções 142.43, 142.45 e 142.47 deste Regulamento, conforme aplicáveis.'
