text: '142.71 deste Regulamento. As instalações de arquivamento podem ser combinadas com as
  salas,

  desde que seja garantida a segurança dos registros;

  (8) o CTAC possua um ambiente adequado para dispor de uma biblioteca que contenha todo o

  material técnico de consulta necessário, de acordo com a amplitude e o nível do treinamento

  realizado;

  (9) o CTAC disponha de uma sala equipada para conduzir o “briefing” e o “debriefing” de
  cada

  fase do treinamento de voo; e

  (10) as instalações prediais do CTAC estejam de acordo com as normas oficiais de construção

  civil de onde esteja localizado e obedeçam às especificações técnicas de instalação de máquinas
  e

  equipamentos, incluindo aqueles necessários ao funcionamento dos dispositivos de treinamento
  para

  simulação de voo.'
