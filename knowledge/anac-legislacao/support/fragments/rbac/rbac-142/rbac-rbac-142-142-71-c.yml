section_title: Requisitos para emissão, conservação e envio de registros à ANAC
subsection_id: c
cite: 142.71(c)
title: 142.71(c)
text: '(c) O gestor responsável do detentor de certificado de CTAC deve:

  (1) manter os registros requeridos pelo parágrafo (a) desta Seção durante pelo menos cinco
  anos

  a contar da data de término do treinamento ou do exame;

  (2) manter os registros requeridos pelo parágrafo (b) desta Seção enquanto o instrutor ou

  examinador credenciado mantiver vínculo com o CTAC e conservá-los durante pelo menos cinco

  anos após o seu desligamento do CTAC; e

  (3) manter os registros de demonstração periódica de proficiência ou competência requeridos

  no parágrafo (b) desta Seção durante pelo menos cinco anos.'
