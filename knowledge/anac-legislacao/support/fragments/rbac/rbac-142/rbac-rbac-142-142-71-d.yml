title: 142.71(d)
text: '(d) O gestor responsável do detentor de certificado de CTAC deve prover os registros
  requeridos

  por esta Seção à ANAC, sempre que solicitado e em tempo hábil, mantendo os registros requeridos

  organizados e ordenados conforme requerido pela ANAC.'
