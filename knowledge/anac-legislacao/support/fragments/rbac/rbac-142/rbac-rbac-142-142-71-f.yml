cite: 142.71(f)
title: 142.71(f)
text: '(f) O gestor responsável do detentor de certificado de CTAC deve manter os registros
  dos alunos

  inscritos em cada curso aprovado que oferece devidamente atualizados. Tais registros poderão
  ser

  solicitados pela ANAC a qualquer tempo.'
