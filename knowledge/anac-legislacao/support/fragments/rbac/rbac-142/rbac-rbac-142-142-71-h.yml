section_title: Requisitos para emissão, conservação e envio de registros à ANAC
subsection_id: h
cite: 142.71(h)
title: 142.71(h)
text: '(h) O gestor responsável do detentor de certificado de CTAC deve registrar os aspectos

  relacionados ao cumprimento do plano de implantação de seu SGSO ou de sua operação, processos

  de segurança operacional e ciclos de gerenciamento de risco desenvolvidos no CTAC.'
