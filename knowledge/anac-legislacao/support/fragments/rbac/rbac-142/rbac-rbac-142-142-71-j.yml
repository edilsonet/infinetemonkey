section_title: Requisitos para emissão, conservação e envio de registros à ANAC
subsection_id: j
cite: 142.71(j)
title: 142.71(j)
text: '(j) O gestor responsável do detentor de certificado de CTAC deve enviar, semestralmente,
  um

  relatório relacionando os acidentes, incidentes e ocorrências anormais ocorridos no último
  período,


  Data da emissão: 11 de fevereiro de 2021.


  contendo data, hora, local, aeronave e a descrição do fato, bem como as ações mitigadoras
  adotadas,

  os respectivos cronogramas e os responsáveis por sua implantação.'
