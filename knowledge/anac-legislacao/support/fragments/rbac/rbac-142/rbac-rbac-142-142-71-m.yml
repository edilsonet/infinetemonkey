cite: 142.71(m)
title: 142.71(m)
text: '(m) O gestor responsável do detentor de certificado de CTAC deve enviar à ANAC os relatórios

  do primeiro semestre até o dia 15 de julho e os relatórios do segundo semestre até o dia
  15 de janeiro

  do ano seguinte.'
