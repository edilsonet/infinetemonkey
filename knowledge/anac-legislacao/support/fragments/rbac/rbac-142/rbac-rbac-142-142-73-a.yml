cite: 142.73(a)
title: 142.73(a)
text: '(a) Com exceção do disposto no parágrafo (d) desta Seção, o CTAC deve comunicar à ANAC,
  por

  escrito, e com uma antecedência mínima de sessenta dias de antecedência da data de implementação,

  qualquer proposta de alteração referente:

  (1) ao pessoal listado nos parágrafos 142.43(a) e (j) deste Regulamento; e

  (2) aos equipamentos, aos procedimentos, ao Programa de Treinamento, à localização e/ou
  às

  instalações do CTAC e/ou dos CTAC satélites.'
