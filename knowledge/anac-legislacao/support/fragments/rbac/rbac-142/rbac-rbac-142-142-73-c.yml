cite: 142.73(c)
title: 142.73(c)
text: '(c) De acordo com o escopo e complexidade das alterações solicitadas pelo CTAC, a ANAC

  poderá autorizar a continuidade da operação ou decidir pela suspensão da aprovação do treinamento

  até que as alterações sejam implementadas.'
