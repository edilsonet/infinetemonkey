title: 142.75(b)
text: '(b) É vedado ao detentor de um certificado de CTAC emitido segundo este Regulamento
  o uso de

  marcas, expressões e sinais de propaganda que contenham informações falsas ou que induzam
  a erro

  quanto à situação jurídica do CTAC e dos cursos aprovados.'
