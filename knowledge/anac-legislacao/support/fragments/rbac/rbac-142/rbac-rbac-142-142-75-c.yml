section_title: Limitações ao uso de marcas, expressões e sinais de propaganda
subsection_id: c
cite: 142.75(c)
title: 142.75(c)
text: '(c) Um CTAC cujo certificado tenha sido revogado, suspenso ou cassado deve:

  (1) prontamente remover todas as indicações ou sinais, onde quer que estejam localizados,
  de

  que o CTAC seja certificado pela ANAC; e

  (2) prontamente notificar todos os agentes publicitários contratados para fazer cessar toda

  propaganda que informe que o CTAC é certificado pela ANAC.


  Data da emissão: 11 de fevereiro de 2021.


  SUBPARTE D

  [RESERVADO]


  SUBPARTE E

  SISTEMA DE GERENCIAMENTO DE SEGURANÇA OPERACIONAL - SGSO'
