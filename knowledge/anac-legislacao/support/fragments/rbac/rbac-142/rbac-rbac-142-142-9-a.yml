cite: 142.9(a)
title: 142.9(a)
text: '(a) Exceto como previsto no parágrafo (b) desta Seção, um certificado de CTAC emitido
  segundo

  este Regulamento permanece válido até deixar de interessar ao seu detentor ou ser suspenso
  ou

  cassado pela ANAC segundo as disposições dos parágrafos 142.7(f) e (g) deste Regulamento.'
