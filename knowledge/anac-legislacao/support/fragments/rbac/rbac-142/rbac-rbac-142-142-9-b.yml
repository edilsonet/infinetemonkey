section_title: Validade do certificado de CTAC
subsection_id: b
cite: 142.9(b)
title: 142.9(b)
text: '(b) Um certificado emitido segundo este Regulamento para um CTAC localizado em um país

  estrangeiro tem validade de dois anos a partir de sua data de emissão, a menos que seja
  antes suspenso

  ou cassado pela ANAC ou revogado por deixar de interessar ao seu detentor.'
