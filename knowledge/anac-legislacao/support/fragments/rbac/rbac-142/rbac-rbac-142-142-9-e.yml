cite: 142.9(e)
title: 142.9(e)
text: '(e) O CTAC deve, mediante determinação da ANAC, no prazo de 30 (trinta) dias, extensível
  pela

  ANAC por igual período, substituir qualquer pessoa que ocupe uma posição administrativa
  listada

  em 142.43(a) e que possua comprovado histórico de conduta e/ou desempenho inadequados,

  conforme os critérios do parágrafo 142.7(e)(2)(ii).

  (1) A falta de observação ao disposto no parágrafo 142.9(e) enseja a aplicação de suspensão,

  revogação ou cassação do certificado, observando-se, conforme aplicável, os parágrafos

  142.7(f)(2)(iii) e 142.7(g)(3)(ii).

  (Incluído pela Resolução nº 503, de 07.02.2019)'
