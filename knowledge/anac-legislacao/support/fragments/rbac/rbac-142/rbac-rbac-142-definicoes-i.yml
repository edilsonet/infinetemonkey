text: '(i) a atuação desejada ou que se espera que o aluno seja capaz de exercer ao concluir
  o

  treinamento (ou ao terminar etapas particulares deste);

  (ii) o nível de atuação que o aluno deve atingir para confirmar o nível de competência e/ou

  proficiência; e

  (iii) as condições nas quais o aluno deve ser examinado;

  (31) perigo significa condição, objeto ou atividade que, potencialmente, pode causar lesões
  a

  pessoas, danos a bens (equipamentos ou estruturas), perda de pessoal ou redução da habilidade
  para

  desempenhar uma função determinada;

  (32) pessoal significa todas as pessoas que trabalham remuneradamente, através de vínculo

  empregatício ou outro contrato de trabalho, para o CTAC ou para um operador aéreo cliente
  de um

  CTAC, conforme aplicável;

  (33) Plano de Resposta a Emergências (PRE) significa a descrição dos procedimentos a serem

  executados em emergências, além do estabelecimento das responsabilidades, ações e funções
  de cada

  um dos órgãos e funcionários envolvidos no gerenciamento de emergências;

  (34) probabilidade significa, no contexto do SGSO, o grau de previsibilidade de que um evento,

  como consequência de um perigo existente, possa ocorrer;

  (35) proficiência significa capacidade de desempenhar uma tarefa em tempo real, no padrão

  requerido e sem assistência;

  (36) Programa Brasileiro para a Segurança Operacional da Aviação Civil (PSO-BR) significa

  o documento que apresenta o processo brasileiro para o gerenciamento da segurança operacional
  da

  aviação civil, incluindo o Programa de Segurança Operacional Específico da Agência Nacional
  de

  Aviação Civil (PSOE-ANAC) e o Programa de Segurança Operacional Específico do Comando da

  Aeronáutica (PSOE-COMAER), alinhados com os compromissos assumidos pelo Brasil em acordos

  internacionais;


  Data da emissão: 11 de fevereiro de 2021.


  (37) Programa de Segurança Operacional Específico da Agência Nacional de Aviação Civil

  (PSOE-ANAC) significa o documento que apresenta os requisitos para a atuação da ANAC, como

  órgão regulador, nas áreas de sua competência legal: Anexos 1, 6, 8 e 14 da Convenção de
  Aviação

  Civil Internacional, conforme estabelecido no PSO-BR, e as diretrizes e requisitos da ANAC
  para

  orientar a implantação e desenvolvimento dos SGSO por parte de seus entes regulados (PSAC);

  (38) programa de treinamento significa os cursos, material para os cursos, facilidades,

  equipamentos de treinamento e pessoal necessários para cumprir um objetivo específico de

  treinamento. Deve incluir um currículo base ou um currículo especializado;

  (39) Provedores de Serviços de Aviação Civil (PSAC) significa as organizações que prestam

  serviços de aviação civil, definidas no PSOE-ANAC, e que devem desenvolver, implantar, manter
  e

  adotar a melhoria contínua de um SGSO aceito pela ANAC, visando garantir a segurança operacional

  em suas atividades;

  (40) Requisitos de Segurança Operacional (ReqSO) significa os meios e as ferramentas a serem

  utilizados pelo PSAC para o alcance das metas aceitas pela ANAC;

  (41) risco significa a avaliação das consequências de um perigo, expressa em termos de

  probabilidade e severidade, tomando como referência a pior condição possível;

  (42) segurança operacional significa o estado no qual o risco de lesões a pessoas ou danos
  a

  bens materiais se reduzem e se mantêm em um nível aceitável ou abaixo deste, por meio de
  um

  processo contínuo de identificação de perigos e gestão de riscos;

  (43) severidade significa o grau da consequência de um evento, como decorrência de um perigo

  existente ou de uma situação insegura, tomando como referência a pior condição possível;

  (44) simulação de operação em rota significa uma simulação, conduzida em equipamento de

  treinamento apropriado, utilizando situações de voo orientadas para o aspecto operacional,
  capaz de

  reproduzir com exatidão a interação entre os tripulantes técnicos e deles com os comissários,
  o

  despacho operacional, o controle de tráfego aéreo e o pessoal de apoio de rampa. Simulações
  de

  operação em rota são conduzidas para treinamento e exames, incluindo procedimentos normais,

  anormais e de emergência. As simulações de operação em rota incluem especificamente:'
