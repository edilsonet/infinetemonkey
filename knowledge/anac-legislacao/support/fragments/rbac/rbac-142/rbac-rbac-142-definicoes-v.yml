cite: definicoes(v)
title: definicoes(v)
text: '(v) de diferenças: aplicável a pessoas que já tenham sido qualificadas e trabalhado
  em um

  determinado tipo de aeronave e que pretendam se qualificar e trabalhar em uma variante particular

  do mesmo tipo de aeronave;

  (vi) de requalificação: aplicável a pessoas que já tenham sido qualificadas e trabalhado
  em

  uma determinada função, mas que não tenham concluído o treinamento periódico dentro do prazo

  estabelecido, ou que tenham sido reprovados em um treinamento periódico, e que pretendam
  se

  requalificar na mesma função; e

  (vii) especial: aplicável a pessoas que pretendam se qualificar e trabalhar em procedimentos

  especiais não previstos na rotina operacional.'
