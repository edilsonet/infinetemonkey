cite: 145.1(a)
title: 145.1(a)
text: '(a) Este regulamento descreve como obter um certificado de organização de manutenção
  de

  produto aeronáutico e contém as regras relacionadas ao seu desempenho na manutenção,

  manutenção preventiva ou alteração de artigos aos quais se aplica o RBAC 43. Este regulamento
  se

  aplica a qualquer requerente ou detentor de um certificado de organização de manutenção
  emitido

  sob este regulamento.'
