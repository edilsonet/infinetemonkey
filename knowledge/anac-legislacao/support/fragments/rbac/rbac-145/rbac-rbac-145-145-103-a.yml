title: 145.103(a)
text: '(a) Cada organização de manutenção certificada deve prover:

  (1) instalações que abriguem recursos, equipamentos, ferramentas, materiais, dados técnicos
  e

  pessoal compatível com suas certificações, especificações operativas e, quando aplicável,
  lista de

  capacidades;

  (2) recursos para executar apropriadamente a manutenção, manutenção preventiva ou

  alteração de artigos ou serviços especializados para os quais é certificado. Os recursos
  devem

  incluir:'
