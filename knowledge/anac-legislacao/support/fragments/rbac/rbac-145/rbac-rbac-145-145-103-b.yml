cite: 145.103(b)
title: 145.103(b)
text: '(b) Cada organização de manutenção certificada deve prover instalações adequadas com

  tamanho apropriado para acomodar qualquer serviço em artigos listados em suas especificações

  operativas, e que garanta a proteção contra fatores ambientais adversos. (Redação dada pela

  Resolução nº 610, de 23.02.2021)'
