title: 145.103(v)
text: '(v) ventilação, iluminação, controle de temperatura, umidade e outras condições

  ambientais suficientes para assegurar que o pessoal execute manutenção, manutenção preventiva
  ou

  alteração, dentro dos critérios estabelecidos pelos RBAC;

  (vi)-I ventilação, iluminação, controle de temperatura, umidade e outras condições

  ambientais suficientes para assegurar o adequado estoque de peças e materiais;

  (vii)-I um local segregado para depósito de inflamáveis, sempre que requerido por questões

  de segurança; (Redação dada pela Resolução nº 610, de 23.02.2021)

  (vii)-II [Reservado] (Redação dada pela Resolução nº 610, de 23.02.2021)

  (vii)-III [Reservado] (Redação dada pela Resolução nº 610, de 23.02.2021)'
