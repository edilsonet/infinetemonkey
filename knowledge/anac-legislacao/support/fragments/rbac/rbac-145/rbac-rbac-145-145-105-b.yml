section_title: Mudança de localização, instalações ou recursos
subsection_id: b
cite: 145.105(b)
title: 145.105(b)
text: '(b) Uma organização de manutenção certificada somente pode fazer uma mudança nas suas

  instalações ou recursos requeridos pela seção 145.103 deste RBAC, que possa ter significativo

  efeito em sua capacidade de executar manutenção, manutenção preventiva ou alteração, se
  obtiver

  aprovação escrita da ANAC.'
