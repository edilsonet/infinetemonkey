cite: 145.109(a-I)
title: 145.109(a-I)
text: '(a)-I Cada organização de manutenção certificada deve possuir uma listagem, ou outro
  formato

  aceito pela ANAC, da relação do ferramental, próprio ou contratado, necessário para o desempenho

  seguro de suas atividades. Quando o ferramental utilizado for de terceiros, a organização
  deve

  possuir um contrato (ou documento equivalente) que autorize o uso, o qual deve ser mantido

  disponível para a ANAC por pelo menos 5 (cinco) anos, desde a sua última utilização. (Redação

  dada pela Resolução nº 610, de 23.02.2021)'
