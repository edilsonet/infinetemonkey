cite: 145.109(b-I)
title: 145.109(b-I)
text: '(b)-I Cada organização de manutenção certificada deve assegurar que todos os equipamentos
  e

  ferramentas de teste e inspeção (de sua propriedade ou não) utilizados para a determinação
  de

  aeronavegabilidade de um artigo sejam periodicamente avaliados, mantidos e, quando aplicável,

  calibrados de acordo com as instruções do fabricante do equipamento, utilizando um padrão

  rastreável a:

  (1) um padrão estabelecido pelo Instituto Nacional de Metrologia, Normalização e Qualidade

  Industrial - INMETRO;

  (2) um padrão estabelecido pelo fabricante do equipamento;

  (3) um padrão estabelecido pelo país de origem do equipamento; ou

  (4) outro aceito pela ANAC.'
