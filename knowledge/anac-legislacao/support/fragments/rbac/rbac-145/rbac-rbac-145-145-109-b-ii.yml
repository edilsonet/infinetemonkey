cite: 145.109(b-II)
title: 145.109(b-II)
text: '(b)-II Cada organização de manutenção certificada deve assegurar que haja um meio adequado

  de controle das calibrações periódicas de modo a garantir que todos os equipamentos e ferramentas

  de teste e inspeção utilizados para a determinação de aeronavegabilidade de um artigo estejam
  com

  calibração válida. O intervalo máximo entre calibrações de equipamentos e ferramentas de
  teste e

  inspeção deve ser aquele estabelecido pelo fabricante em sua publicação técnica aplicável
  ou outro

  aceitável pela ANAC. Os registros dessas calibrações periódicas e, quando aplicável, os
  registros

  dos padrões de calibração utilizados devem ser conservados por pelo menos 5 (cinco) anos
  (a partir

  da sua emissão) ou para as 2 (duas) últimas calibrações, o que for maior, pela organização
  de

  manutenção certificada e mantidos disponíveis para a ANAC.'
