cite: 145.109(c)
title: 145.109(c)
text: '(c) Os equipamentos, ferramentas e materiais devem ser aqueles recomendados pelo fabricante

  do artigo, ou outros cuja equivalência tenha sido demonstrada de acordo com um procedimento

  descrito no manual da organização de manutenção.


  Data da emissão: 26 de fevereiro de 2021.'
