cite: 145.109(d)
title: 145.109(d)
text: '(d) Cada organização de manutenção certificada deve manter, num formato aceitável pela

  ANAC, os documentos e dados técnicos requeridos para o desempenho da manutenção, manutenção

  preventiva ou alteração em conformidade com o seu certificado, especificações operativas
  e com o

  RBAC 43. Cada organização deve possuir, quando aplicável, a assinatura ou autorização de
  uso por

  parte do proprietário da documentação técnica. Os seguintes documentos e dados técnicos
  devem

  ser mantidos atualizados e acessíveis, quando o trabalho estiver sendo executado:

  (1) diretrizes de aeronavegabilidade;

  (2) instruções para aeronavegabilidade continuada;

  (3) manuais de manutenção;

  (4) manuais de revisão geral;

  (5) manuais de práticas padronizadas;

  (6) boletins de serviço;

  (7) recomendações do fabricante ou outros dados técnicos aprovados ou aceitáveis pela

  ANAC; e

  (8)-I legislação aeronáutica brasileira aplicável.


  Data da emissão: 26 de fevereiro de 2021.

  SUBPARTE D

  PESSOAL'
