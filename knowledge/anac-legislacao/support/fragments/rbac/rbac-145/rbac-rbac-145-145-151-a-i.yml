title: 145.151(a-I)
text: '(a)-I designar pessoa com vínculo contratual com a organização de manutenção, conforme

  estabelecido no Apêndice B-I deste Regulamento, como: (Redação dada pela Resolução nº 610,
  de

  23.02.2021)

  (1) Gestor Responsável - GR, o qual deve ser cadastrado na ANAC; e (Redação dada pela

  Resolução nº 610, de 23.02.2021)

  (2) Gestor do Sistema de Gerenciamento de Segurança Operacional - Gestor do SGSO.

  (Redação dada pela Resolução nº 503, de 07.02.2019)'
