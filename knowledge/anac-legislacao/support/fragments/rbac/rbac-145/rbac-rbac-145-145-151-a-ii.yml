title: 145.151(a-II)
text: '(a)-II no caso de organização de manutenção localizada no Brasil, designar pelo menos
  um

  RT com vínculo contratual, a ser cadastrado na ANAC conforme estabelecido no Apêndice A-I

  deste regulamento. O RT cadastrado na ANAC pode representar tecnicamente o GR perante a

  ANAC. (Redação dada pela Resolução nº 503, de 07.02.2019)'
