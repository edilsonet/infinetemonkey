text: '(b) prover pessoal com vínculo contratual e qualificado para planejar, registrar, supervisionar,

  executar, inspecionar e aprovar para retorno ao serviço a manutenção, manutenção preventiva
  ou

  alteração executada sob o certificado de organização de manutenção e suas especificações

  operativas;'
