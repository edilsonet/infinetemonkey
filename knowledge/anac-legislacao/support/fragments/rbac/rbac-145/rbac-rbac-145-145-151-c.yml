cite: 145.151(c)
title: 145.151(c)
text: '(c) assegurar que exista número suficiente desse pessoal com vínculo contratual com
  treinamento

  ou conhecimento, e experiência na execução da manutenção, manutenção preventiva ou alteração,

  conforme autorizada no certificado de organização de manutenção e respectivas especificações

  operativas, para assegurar que todo serviço seja executado de acordo com o RBAC 43;'
