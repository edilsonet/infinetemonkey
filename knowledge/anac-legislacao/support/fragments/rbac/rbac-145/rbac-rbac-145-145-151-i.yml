cite: 145.151(i)
title: 145.151(i)
text: '(i) a uma organização certificada pela ANAC, medida de suspensão ou de restrição das

  operações por mais de 90 dias, ou de revogação, ou de cassação de certificados ou autorizações,
  em

  decorrência de constatação de irregularidade, em que o designado tenha comprovadamente

  responsabilidade direta pela causa da mesma, enquanto ocupante de posição administrativa

  requerida pela ANAC; ou

  (ii) sanção administrativa diretamente ao designado, cuja capitulação tenha sido feita por

  meio do art. 299, incisos I, V, VI ou VII da Lei nº 7.565, de 19 de dezembro de 1986, ainda
  que

  naquelas ocasiões o designado não ocupasse uma posição administrativa requerida pela ANAC.

  (Incluído pela Resolução nº 503, de 07.02.2019)'
