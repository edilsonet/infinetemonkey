cite: 145.153(a)
title: 145.153(a)
text: '(a) Cada organização de manutenção certificada deve assegurar que exista um número
  suficiente

  de supervisores para dirigir as tarefas executadas conforme o certificado de organização
  de

  manutenção e respectivas especificações operativas. Os supervisores devem monitorar os trabalhos

  executados por pessoas que não estão familiarizadas com os métodos, técnicas, práticas,
  auxílios,

  equipamentos e ferramentas usadas para a execução da manutenção, manutenção preventiva ou

  alteração.'
