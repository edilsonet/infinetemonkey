title: 145.153(i)
text: '(i) ter no mínimo 18 (dezoito) meses de experiência prática no serviço que esteja sendo

  executado; ou

  (ii) ser treinado ou dominar os métodos, técnicas, práticas, auxílios, equipamento e

  ferramentas usadas para executar manutenção, manutenção preventiva ou alteração.'
