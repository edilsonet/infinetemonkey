section_title: Requisitos do pessoal de inspeção
subsection_id: a
cite: 145.155(a)
title: 145.155(a)
text: '(a) Cada organização de manutenção certificada deve assegurar que cada pessoa que esteja

  executando inspeções conforme o certificado e suas especificações operativas:

  (1) tenha domínio acerca da regulamentação de aviação civil aplicável e com os métodos de

  inspeção, técnicas, práticas, auxílios, equipamentos e ferramentas usadas para definir a

  aeronavegabilidade do artigo no qual a manutenção, manutenção preventiva ou alteração está
  sendo

  executada; e

  (2)-I tenha sido treinada ou tenha 18 (dezoito) meses de experiência prática na atividade
  de

  inspeção e sejam proficientes na utilização dos equipamentos de inspeção e auxílios de inspeção

  visual apropriados para o artigo que está sendo inspecionado.'
