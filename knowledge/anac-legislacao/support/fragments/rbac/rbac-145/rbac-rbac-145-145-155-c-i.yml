cite: 145.155(c-I)
title: 145.155(c-I)
text: '(c)-I O pessoal de inspeção deve ser capaz de ler e entender o(s) idioma(s) em que
  são

  apresentados os dados técnicos e as instruções para aeronavegabilidade continuada necessárias
  para

  a realização dos serviços constantes em suas especificações operativas.'
