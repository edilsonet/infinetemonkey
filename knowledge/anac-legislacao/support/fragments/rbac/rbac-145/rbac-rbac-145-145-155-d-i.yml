cite: 145.155(d-I)
title: 145.155(d-I)
text: '(d)-I Todo o pessoal de inspeção diretamente relacionado com as atividades de manutenção,

  manutenção preventiva ou alteração, se vinculado a uma organização de manutenção localizada
  no

  Brasil, deve ser habilitado de acordo com o RBAC 65, ou conforme critério estabelecido pela

  ANAC. (Redação dada pela Resolução nº 610, de 23.02.2021)'
