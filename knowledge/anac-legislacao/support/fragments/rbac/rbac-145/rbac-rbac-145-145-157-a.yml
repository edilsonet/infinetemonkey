section_title: Pessoal autorizado para aprovar um artigo para retorno ao serviço
subsection_id: a
cite: 145.157(a)
title: 145.157(a)
text: '(a) Cada organização de manutenção certificada localizada no Brasil deve assegurar
  que cada

  pessoa autorizada a aprovar um artigo para retorno ao serviço conforme o certificado de

  organização de manutenção e suas especificações operativas esteja habilitada de acordo com
  o

  RBAC 65. (Redação dada pela Resolução nº 610, de 23.02.2021)'
