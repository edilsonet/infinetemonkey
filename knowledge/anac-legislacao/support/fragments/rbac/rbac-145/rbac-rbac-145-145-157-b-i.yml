section_title: Pessoal autorizado para aprovar um artigo para retorno ao serviço
subsection_id: b-i
cite: 145.157(b-I)
title: 145.157(b-I)
text: '(b)-I Cada organização de manutenção certificada deve assegurar que cada pessoa autorizada
  a

  aprovar um artigo para retorno ao serviço, conforme o certificado de organização de manutenção
  e

  respectivas especificações operativas:

  (1) tenha sido treinada ou tenha 18 (dezoito) meses de experiência prática com métodos,

  técnicas, práticas, auxílios, equipamentos e ferramentas usadas para executar a manutenção,

  manutenção preventiva ou alteração; e

  (2) tenha domínio acerca da regulamentação da aviação civil aplicável e proficiente no uso

  dos vários métodos de inspeção, técnicas, práticas, auxílios, equipamentos e ferramentas

  apropriadas ao trabalho sendo executado e aprovado para retorno ao serviço.'
