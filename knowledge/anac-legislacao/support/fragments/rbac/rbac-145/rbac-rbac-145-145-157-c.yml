section_title: Pessoal autorizado para aprovar um artigo para retorno ao serviço
subsection_id: c
cite: 145.157(c)
title: 145.157(c)
text: '(c) Cada organização de manutenção certificada localizada no Brasil deve assegurar
  que cada

  pessoa autorizada a aprovar um artigo para retorno ao serviço compreenda, leia e escreva
  no idioma

  português.'
