section_title: Pessoal autorizado para aprovar um artigo para retorno ao serviço
subsection_id: d-i
cite: 145.157(d-I)
title: 145.157(d-I)
text: '(d)-I A pessoa autorizada a aprovar um artigo para retorno ao serviço deve ser capaz
  de ler e

  entender o(s) idioma(s) em que são apresentados os dados técnicos e as instruções para

  aeronavegabilidade continuada necessárias para a realização dos serviços constantes em suas

  especificações operativas.'
