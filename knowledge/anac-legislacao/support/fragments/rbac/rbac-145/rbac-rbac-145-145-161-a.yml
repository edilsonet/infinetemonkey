cite: 145.161(a)
title: 145.161(a)
text: '(a) Cada organização de manutenção certificada deve manter disponível para a ANAC:

  (1) uma lista do pessoal de administração e supervisão, com os nomes dos representantes
  da

  organização de manutenção que são responsáveis por sua administração e com os nomes dos

  supervisores que monitoram as funções de manutenção;

  (2) uma lista dos nomes de todo pessoal de inspeção;

  (3) uma lista do pessoal autorizado a aprovar para retorno ao serviço um artigo que passou
  por

  manutenção, manutenção preventiva ou alteração; e

  (4) um sumário histórico de trabalho de cada pessoa cujo nome está nas listas de pessoal

  requeridas pelos parágrafos (a)(1) a (a)(3) desta seção. O sumário deve conter informações
  de cada

  pessoa listada, suficientes para demonstrar cumprimento com os requisitos de experiência
  deste

  RBAC, e deve incluir o seguinte:'
