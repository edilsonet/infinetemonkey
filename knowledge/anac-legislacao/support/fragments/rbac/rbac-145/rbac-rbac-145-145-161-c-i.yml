cite: 145.161(c-I)
title: 145.161(c-I)
text: '(c)-I Cada organização de manutenção certificada deve manter arquivado o cadastramento,

  emitido pela ANAC, do GR e do RT. No caso de desvinculação do GR e/ou do RT, a organização,

  bem como os referidos profissionais, devem, dentro de até 10 (dez) dias úteis, informar
  o seu

  desvinculo à ANAC. Cada organização tem até 30 (trinta) dias, a partir da data de desvinculação,

  para solicitar o cadastramento de outros profissionais que atendam a este RBAC. (Redação
  dada

  pela Resolução nº 610, de 23.02.2021)'
