cite: 145.163(a)
title: 145.163(a)
text: '(a) Cada organização de manutenção certificada deve ter um programa de treinamento
  de

  pessoal, que consiste de treinamento inicial e recorrente. Esse programa deve ser aprovado
  pela

  ANAC, exceto se de outra forma determinado por esta. (Redação dada pela Resolução nº 610,
  de

  23.02.2021)'
