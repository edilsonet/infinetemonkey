title: 145.163(b)
text: '(b) O programa de treinamento deve assegurar que cada pessoa designada para executar

  manutenção, manutenção preventiva ou alteração e funções de inspeção e de registro seja
  capaz de

  executar as tarefas a ela designadas.'
