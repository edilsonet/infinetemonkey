cite: 145.163(c)
title: 145.163(c)
text: '(c) Cada organização de manutenção certificada deve documentar, em formato aceitável
  à

  ANAC, o treinamento individual do pessoal requerido pelo parágrafo (a) desta seção. Esses

  registros de treinamento devem ser retidos por, no mínimo, 5 (cinco) anos após o término
  do

  vínculo contratual.'
