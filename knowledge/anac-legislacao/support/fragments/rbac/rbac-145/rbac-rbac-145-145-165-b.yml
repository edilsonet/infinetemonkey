section_title: Treinamento em artigos perigosos
subsection_id: b
cite: 145.165(b)
title: 145.165(b)
text: '(b) Cada pessoa de uma organização de manutenção certificada somente pode executar
  ou

  diretamente supervisionar funções de trabalho relacionadas ao transporte aéreo de cargas
  perigosas

  (artigos perigosos) para ou em nome de um detentor de certificado segundo os RBAC 121 ou
  135,

  incluindo carregamento de itens para transporte em uma aeronave operada por um detentor
  de

  certificado segundo esses RBAC, se tiver recebido treinamento de acordo com o programa de

  treinamento em artigos perigosos do próprio operador.


  Data da emissão: 26 de fevereiro de 2021.

  SUBPARTE E

  REGRAS DE OPERAÇÃO'
