text: '145.203 Trabalho executado em outra localidade


  Cada organização de manutenção certificada pode temporariamente transportar, para um local

  diferente do seu endereço, os equipamentos, ferramentas, materiais, dados técnicos e pessoal

  necessários para executar manutenção, manutenção preventiva ou alteração, incluindo serviços

  especializados, em um artigo para o qual ela está certificada se:'
