cite: 145.205(a)
title: 145.205(a)
text: '(a) Cada organização de manutenção certificada que execute manutenção, manutenção

  preventiva ou alteração para um detentor de certificado segundo os RBAC 121 ou 135 que tem
  um

  programa de manutenção de aeronavegabilidade continuada segundo esses regulamentos deve

  seguir o programa desse operador e as seções aplicáveis dos seus manuais.'
