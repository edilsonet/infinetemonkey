title: 145.205(h)
text: '(h) procedimentos para:

  (1) manter e revisar as informações de manutenção subcontratada requeridas pelo parágrafo

  145.217(a)(2)(i) deste RBAC, incluindo a submissão das revisões à ANAC para aceitação; e


  Data da emissão: 26 de fevereiro de 2021.

  (2) manter e revisar as informações de manutenção subcontratada requeridas pelo parágrafo

  145.217(a)(2)(ii) deste RBAC e notificar a ANAC das revisões a essa informação, incluindo
  a

  frequência que a ANAC será notificada das revisões.

  (3)-I Assegurar o cumprimento com o requerido pelo parágrafo 145.217(b)(1) deste

  RBAC. (Incluído pela Resolução nº 610, de 23.02.2021)'
