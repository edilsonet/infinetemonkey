title: 145.205(m-I)
text: '(m)-I procedimentos de recebimento, acesso, emenda e distribuição, dentro da organização
  de

  manutenção, de todos os dados de aeronavegabilidade necessários, oriundos da ANAC, do detentor

  do certificado de tipo ou da organização do projeto de tipo, inclusive as Diretrizes de

  Aeronavegabilidade.'
