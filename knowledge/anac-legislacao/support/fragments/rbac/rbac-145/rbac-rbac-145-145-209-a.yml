cite: 145.209(a)
title: 145.209(a)
text: '(a) um organograma identificando:

  (1) cada posição administrativa com autoridade para agir em nome da organização de

  manutenção;

  (2) a área de responsabilidade designada para cada posição administrativa;

  (3) as funções, responsabilidades e autoridade de cada posição administrativa; e

  (4)-I as funções do pessoal responsável por garantir que a organização mantenha a

  certificação de acordo com os requisitos deste regulamento.'
