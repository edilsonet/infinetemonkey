title: 145.209(d)
text: '(d) procedimentos para:

  (1) revisar a lista de capacidade fornecida para cumprimento da seção 145.215 deste RBAC
  e

  notificar a ANAC das revisões à lista, incluindo a frequência que a ANAC será notificada
  das

  revisões, e

  (2) executar a autoavaliação requerida pelo parágrafo 145.215(c) deste RBAC para revisar
  a

  lista de capacidade, incluindo métodos e frequências de tais avaliações e procedimentos
  para relatar

  os resultados ao administrador apropriado, para análise e ação;'
