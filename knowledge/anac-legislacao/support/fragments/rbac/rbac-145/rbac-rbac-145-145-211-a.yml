section_title: Sistema de controle da qualidade
subsection_id: a
cite: 145.211(a)
title: 145.211(a)
text: '(a) Cada organização de manutenção certificada deve estabelecer e manter um sistema
  de

  controle da qualidade a ser submetido à aceitação da ANAC, que assegure a aeronavegabilidade
  dos

  artigos nos quais a organização, ou qualquer dos seus subcontratados, executa manutenção,

  manutenção preventiva ou alteração.'
