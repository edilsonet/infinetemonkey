section_title: Sistema de controle da qualidade
subsection_id: i
cite: 145.211(i)
title: 145.211(i)
text: '(i) executar inspeção de recebimento de toda matéria prima e artigos que entram na

  organização de manutenção, de modo a garantir a aeronavegabilidade;

  (ii) executar inspeção preliminar em todos os artigos que são mantidos;

  (iii) inspecionar artigos que estiveram envolvidos em acidentes aeronáuticos ou outras

  ocorrências que possam afetar a aeronavegabilidade, quanto a danos ocultos, antes de executar

  manutenção, manutenção preventiva ou alteração; (Redação dada pela Resolução nº 610, de

  23.02.2021)

  (iv) estabelecer e manter a proficiência do pessoal de inspeção;'
