section_title: Sistema de controle da qualidade
subsection_id: v
cite: 145.211(v)
title: 145.211(v)
text: '(v) estabelecer e manter atualizados os dados técnicos para a manutenção dos artigos;

  (vi) qualificar e supervisionar pessoal não certificado que executa manutenção,

  manutenção preventiva ou alteração para a organização;

  (vii) executar inspeção final e aprovação para retorno ao serviço dos artigos mantidos;

  (vii)-I elaborar e manter disponível uma lista de pessoal autorizado a assinar as aprovações

  para retorno ao serviço de que trata o parágrafo (vii);

  (viii) calibrar equipamentos de medida e teste usados para manter os artigos, incluindo
  os

  intervalos dentro dos quais os equipamentos serão calibrados; e

  (ix) tomar ações corretivas quanto a não-conformidades.

  (2) referências, quando aplicável, às normas ou especificações de inspeção do fabricante
  para

  um artigo particular, incluindo a referência a quaisquer dados especificados por aquele
  fabricante;


  Data da emissão: 26 de fevereiro de 2021.

  (3) modelos de todos os formulários de inspeção e manutenção que são utilizados no seu

  sistema da qualidade e as instruções para preenchimento de tais formulários ou uma referência
  a um

  manual de formulários em separado; e

  (4) procedimentos para revisar o manual de controle da qualidade requerido por esta seção
  e

  notificar a ANAC sobre as revisões, incluindo a frequência que a ANAC será notificada das

  revisões.'
