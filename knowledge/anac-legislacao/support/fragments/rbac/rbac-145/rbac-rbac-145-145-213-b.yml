section_title: Inspeção da manutenção, manutenção preventiva ou alteração
subsection_id: b
cite: 145.213(b)
title: 145.213(b)
text: '(b) Cada organização de manutenção deve certificar, por meio de uma liberação de manutenção,

  que o artigo está aeronavegável com relação à manutenção, manutenção preventiva ou alteração

  executada, após:

  (1) a organização de manutenção executar trabalho no artigo; e

  (2) um inspetor inspecionar o artigo trabalhado e confirmar que ele está aeronavegável com

  relação ao trabalho executado.'
