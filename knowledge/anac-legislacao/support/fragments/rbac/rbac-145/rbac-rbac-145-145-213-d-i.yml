title: 145.213(d-I)
text: '(d)-I Para uma organização de manutenção localizada fora do Brasil, somente pode assinar
  a

  inspeção final e a liberação de manutenção uma pessoa autorizada por essa organização, com

  treinamento e experiência adequados para assegurar nível de segurança equivalente ao do
  parágrafo'
