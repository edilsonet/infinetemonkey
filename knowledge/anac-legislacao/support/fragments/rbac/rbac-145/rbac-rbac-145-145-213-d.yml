title: 145.213(d)
text: '(d) Para uma organização de manutenção localizada no Brasil, somente uma pessoa autorizada

  por essa organização, detentora de licença de mecânico de manutenção aeronáutica emitida
  pela

  ANAC, pode assinar a inspeção final e a liberação de manutenção.'
