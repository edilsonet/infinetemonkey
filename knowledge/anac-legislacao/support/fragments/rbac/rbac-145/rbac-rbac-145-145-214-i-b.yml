section_title: Sistema de Gerenciamento da Segurança Operacional - SGSO
subsection_id: b
cite: 145.214-I(b)
title: 145.214-I(b)
text: '(b) Cada organização de manutenção certificada deve:

  (1) implantar, operacionalizar e manter um SGSO, de acordo com um plano de

  implementação, adequado ao seu porte e à complexidade de suas operações, conforme requerido
  e

  aceito pela ANAC;

  (2) demonstrar que o SGSO está implantado na certificação inicial;

  (3) assegurar a operacionalização do SGSO conforme os prazos aceitos pela ANAC.'
