section_title: Sistema de Gerenciamento da Segurança Operacional - SGSO
subsection_id: i
cite: 145.214-I(i)
title: 145.214-I(i)
text: '(i) A fase de operacionalização do SGSO inicia-se a partir da data de aprovação de
  sua

  certificação inicial;

  (ii) A fase de operacionalização do SGSO não deve exceder 2 (dois) anos, ou de outra

  forma aceita pela ANAC.

  (4) definir e documentar uma política de segurança operacional e os objetivos estratégicos
  de

  segurança operacional;

  (5) definir e documentar as responsabilidades primárias (accoutability) e atribuições de
  todo o

  seu pessoal relacionado à implantação e manutenção do SGSO, em todos os níveis da organização;

  (6) ter um plano de resposta a emergências, como parte integrante do seu SGSO, conforme

  requeiram suas atividades; e

  (7) garantir o controle de todos os documentos e registros relacionados ao SGSO.

  (Redação dada pela Resolução nº 610, de 23.02.2021)


  Data da emissão: 26 de fevereiro de 2021.'
