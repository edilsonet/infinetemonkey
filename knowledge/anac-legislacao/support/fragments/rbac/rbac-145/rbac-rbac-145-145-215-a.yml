cite: 145.215(a)
title: 145.215(a)
text: '(a) Cada organização de manutenção certificada somente pode executar manutenção,

  manutenção preventiva ou alteração em um artigo se ele estiver contido em uma lista de capacidade

  atualizada, aceitável pela ANAC, ou nas especificações operativas da organização.'
