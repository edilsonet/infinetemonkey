title: 145.215(d)
text: '(d) Ao introduzir um novo artigo na sua lista de capacidade, a organização de manutenção
  deve

  prover à ANAC uma cópia da lista revisada de acordo com os procedimentos requeridos no

  parágrafo 145.209(d)(1) deste RBAC.'
