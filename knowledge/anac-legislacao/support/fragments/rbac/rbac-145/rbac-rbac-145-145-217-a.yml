title: 145.217(a)
text: '(a) Cada organização de manutenção certificada pode subcontratar uma função de manutenção

  de um provedor de serviços externo a ela, desde que:

  (1) a ANAC aceite a função de manutenção a ser subcontratada; e

  (2) a organização de manutenção certificada mantenha e disponibilize para a ANAC as

  seguintes informações:'
