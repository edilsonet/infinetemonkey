cite: 145.217(b)
title: 145.217(b)
text: '(b) Cada organização de manutenção certificada pode subcontratar uma função de manutenção

  de uma pessoa não certificada, desde que:

  (1) garanta que a pessoa não certificada siga um sistema de controle da qualidade equivalente

  ao sistema seguido pela organização de manutenção certificada;

  (2) seja diretamente responsável pelo serviço executado pela pessoa não certificada; e

  (3) verifique, por meio de teste e/ou inspeção, que o trabalho foi executado satisfatoriamente

  pela pessoa não certificada e que o artigo está aeronavegável, antes de aprová-lo para retorno
  ao

  serviço.'
