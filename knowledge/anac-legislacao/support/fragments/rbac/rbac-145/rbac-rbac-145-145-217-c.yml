title: 145.217(c)
text: '(c) Cada organização de manutenção certificada não pode se limitar a somente fornecer
  a

  aprovação para retorno ao serviço de um produto completo com certificado de tipo, subcontratando

  integralmente os serviços de manutenção, manutenção preventiva ou alteração.'
