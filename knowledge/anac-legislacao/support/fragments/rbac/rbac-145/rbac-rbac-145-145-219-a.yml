cite: 145.219(a)
title: 145.219(a)
text: '(a) Cada organização de manutenção certificada deve conservar os registros de manutenção,
  no

  idioma português ou inglês, que demonstrem cumprimento dos requisitos do RBAC 43. Os registros

  devem ser mantidos em formato aceitável pela ANAC.'
