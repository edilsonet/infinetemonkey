title: 145.219(b)
text: '(b) Cada organização de manutenção certificada deve prover uma via da liberação de

  manutenção ou, quando aplicável, do certificado de liberação autorizada ao proprietário
  ou operador

  do artigo no qual a manutenção, manutenção preventiva ou alteração foi executada.'
