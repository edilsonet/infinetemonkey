cite: 145.221(c)
title: 145.221(c)
text: '(c) O detentor de certificado de organização de manutenção que também seja detentor
  de

  certificado conforme os RBAC 121 ou 135, certificado de tipo (incluindo certificado suplementar

  de tipo) ou certificado de produto aeronáutico aprovado ou que seja licenciado do detentor
  de

  certificado de tipo não necessita apresentar o relatório requerido pelo parágrafo (a) desta
  seção se o

  evento tiver sido relatado segundo os RBAC 21, 121 ou 135. (Redação dada pela Resolução
  nº 610,

  de 23.02.2021)


  Data da emissão: 26 de fevereiro de 2021.'
