cite: 145.221(d)
title: 145.221(d)
text: '(d) Cada organização de manutenção certificada pode enviar um relatório de dificuldade
  em

  serviço em nome de:

  (1) um detentor de certificado segundo o RBAC 121, desde que o relatório atenda aos

  requisitos do RBAC 121 e dos manuais do operador, conforme apropriado;

  (2) [reservado]; e

  (3) um detentor de certificado segundo o RBAC 135, desde que o relatório atenda aos

  requisitos do RBAC 135 e dos manuais do operador, conforme apropriado.'
