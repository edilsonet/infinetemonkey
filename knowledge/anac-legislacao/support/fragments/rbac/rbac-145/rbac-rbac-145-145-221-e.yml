cite: 145.221(e)
title: 145.221(e)
text: '(e) Cada organização de manutenção certificada autorizada a apresentar o relatório
  de acordo

  com o parágrafo (d) desta seção não deve apresentar o relatório conforme o parágrafo (a)
  desta

  seção. Uma cópia do relatório submetido sob o parágrafo (d) desta seção deve ser encaminhada
  ao

  detentor do certificado de empresa de transporte aéreo.'
