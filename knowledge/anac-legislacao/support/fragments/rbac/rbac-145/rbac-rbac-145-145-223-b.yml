cite: 145.223(b)
title: 145.223(b)
text: '(b) Cada organização de manutenção certificada somente pode subcontratar pessoa não

  certificada para executar funções de manutenção em um artigo se estiver especificado no
  contrato

  (ou outro documento equivalente) com essa pessoa que a ANAC pode realizar inspeções e observar

  o desempenho de seu trabalho neste artigo.'
