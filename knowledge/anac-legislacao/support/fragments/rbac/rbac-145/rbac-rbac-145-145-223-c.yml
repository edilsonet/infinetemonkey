title: 145.223(c)
text: '(c) Cada organização de manutenção certificada somente pode aprovar para retorno ao
  serviço

  um artigo no qual a manutenção foi executada por uma pessoa não certificada se esta pessoa

  permitir que a ANAC realize as inspeções descritas no parágrafo (b) desta seção.


  Data da emissão: 26 de fevereiro de 2021.

  APÊNDICE A-I DO RBAC 145

  CADASTRAMENTO DE RESPONSÁVEL TÉCNICO'
