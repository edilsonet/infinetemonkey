cite: 145.3(a-I)
title: 145.3(a-I)
text: '(a)-I Gestor Responsável - GR significa a pessoa única e identificável que, na estrutura
  da

  organização de manutenção, tem o poder legal ou hierárquico de autorizar ou recusar quaisquer

  gastos relacionados à condução das operações pretendidas, em conformidade com os requisitos

  regulamentares de segurança operacional. A indicação do Gestor Responsável deve estar em

  conformidade com os atos constitutivos da organização. Significa também a pessoa designada
  pela

  organização de manutenção e aceita pela ANAC que estabelece e assegura a promoção da política

  de segurança operacional e seus objetivos estratégicos, assegura que o pessoal da organização

  cumpra os RBAC e assegura que todas as operações sejam conduzidas sob este regulamento,

  assumindo a responsabilidade primária (accountability) pela organização de manutenção.'
