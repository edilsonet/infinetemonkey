title: 145.3(a-II)
text: '(a)-II Gestor do Sistema de Gerenciamento de Segurança Operacional - Gestor SGSO significa
  a

  pessoa única e identificável, na estrutura da organização de manutenção, formalmente designado

  pelo GR, que é responsável por prover orientações e coordenação ao planejamento, implementação

  e operacionalização do Sistema de Gerenciamento de Segurança Operacional da organização.
  O

  Gestor do SGSO representa a organização perante a ANAC nos assuntos referentes ao Sistema
  de

  Gerenciamento de Segurança Operacional. (Redação dada pela Resolução nº 610, de 23.02.2021)'
