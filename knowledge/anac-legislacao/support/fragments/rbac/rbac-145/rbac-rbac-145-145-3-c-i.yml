cite: 145.3(c-I)
title: 145.3(c-I)
text: '(c)-I Ser diretamente responsável significa ter responsabilidade técnica por qualquer
  trabalho

  executado pela organização de manutenção ou, quanto à manutenção subcontratada, (a organização

  de manutenção certificada) designar uma pessoa com vínculo contratual com ela para supervisionar

  o trabalho executado por uma pessoa não certificada; quanto ao pessoal não certificado da

  organização, assumir a condução como supervisor do serviço sendo executado. A pessoa

  diretamente responsável não precisa constantemente observar fisicamente e instruir cada

  trabalhador, mas deve estar disponível para consulta em assuntos que requeiram instruções
  ou

  decisões de hierarquia superior. (Redação dada pela Resolução nº 610, de 23.02.2021)'
