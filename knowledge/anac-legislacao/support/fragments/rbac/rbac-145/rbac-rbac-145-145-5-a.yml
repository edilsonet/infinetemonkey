cite: 145.5(a)
title: 145.5(a)
text: '(a) Nenhuma pessoa pode operar como uma organização de manutenção certificada sem,
  ou em

  violação a, um certificado de organização de manutenção e especificações operativas emitidos
  sob

  este regulamento, a menos que expressamente autorizado pela ANAC.'
