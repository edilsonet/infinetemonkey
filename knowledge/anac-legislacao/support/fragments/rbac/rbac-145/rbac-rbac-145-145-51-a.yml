cite: 145.51(a)
title: 145.51(a)
text: '(a) Um requerimento para um certificado de organização de manutenção deve incluir os

  seguintes documentos:

  (1) um manual da organização de manutenção aceitável pela ANAC, conforme requerido pela

  seção 145.207;

  (1)-I declaração de conformidade, incluindo uma lista completa de todos os requisitos

  aplicáveis do RBAC 43 e deste regulamento com uma breve descrição de como a organização
  os

  cumpre e referência específica da seção/item do manual onde consta tal informação;

  (2) um manual de controle da qualidade aceitável pela ANAC, conforme requerido pelo

  parágrafo 145.211(c);

  (3) uma lista por tipo, fabricante e modelo, conforme aplicável, de todos os artigos para
  os

  quais é feito o requerimento;

  (4) um organograma da organização de manutenção com os nomes e títulos do pessoal de

  administração e supervisão;

  (4)-I relação nominal do pessoal detentor de licença; (Redação dada pela Resolução nº 552,
  de

  29.04.2020)

  (5) uma descrição das instalações e recursos, incluindo o endereço, de acordo com a seção

  145.103;

  (5)-I [Reservado] (Redação dada pela Resolução nº 561, de 26.05.2020)

  (5)-II [Reservado] (Redação dada pela Resolução nº 610, de 23.02.2021)

  (5)-III [Reservado] (Redação dada pela Resolução nº 552, de 29.04.2020)

  (5)-IV listagem assinada pelo RT, ou no caso de organização de manutenção localizada fora

  do Brasil listagem apresentada pela pessoa da seção 145.151(a)-IV, relacionando os equipamentos,

  ferramentas e dados técnicos, próprios e contratados, necessários ao desempenho seguro das

  obrigações e responsabilidades da organização de manutenção; (Redação dada pela Resolução
  nº

  503, de 07.02.2019)

  (6) uma lista das funções de manutenção a serem subcontratadas pela organização de

  manutenção, para aceitação da ANAC, de acordo com a seção 145.217; e

  (7) um programa de treinamento para aprovação pela ANAC de acordo com a seção 145.163.'
