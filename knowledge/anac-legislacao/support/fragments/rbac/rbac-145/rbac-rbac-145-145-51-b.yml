cite: 145.51(b)
title: 145.51(b)
text: '(b) Os equipamentos, pessoal, dados técnicos, instalações e recursos requeridos para
  o

  certificado e categoria(s)/classe(s) pretendida(s), ou para inclusão de categoria(s)/classe(s),
  devem

  estar disponíveis para a inspeção na época da aprovação da certificação, ou aprovação de

  categoria/classe adicional pela ANAC. Um requerente pode cumprir o requisito de equipamentos

  deste parágrafo, se tiver um contrato (ou outro documento equivalente) com uma pessoa que
  torne o

  equipamento disponível no momento necessário, para execução do trabalho pertinente.'
