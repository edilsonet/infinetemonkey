text: '(d) Um requerimento para certificação de uma categoria/classe adicional, para uma emenda
  ao

  certificado de organização de manutenção, ou para sua renovação, ou para inclusão de uma
  nova

  instalação de manutenção deve conter somente as informações necessárias para fundamentar
  a

  emenda ou renovação do certificado.'
