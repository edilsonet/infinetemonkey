cite: 145.51(i)
title: 145.51(i)
text: '(i) aeronave registrada no Brasil e artigos para uso nessas aeronaves; ou

  (ii) aeronave estrangeira operada por empresa certificada sob o RBAC 121 ou 135 e artigos

  para uso nessas aeronaves.

  (2)-I demonstrar que a organização é certificada pela autoridade de aviação civil do país
  onde

  ela está instalada para um escopo de serviços igual ou superior ao que está solicitando
  à ANAC,


  Data da emissão: 26 de fevereiro de 2021.

  caso a ANAC não seja a autoridade de aviação civil primariamente responsável pela certificação
  e

  supervisão.'
