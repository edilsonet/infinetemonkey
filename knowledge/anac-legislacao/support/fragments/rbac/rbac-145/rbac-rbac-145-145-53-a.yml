cite: 145.53(a)
title: 145.53(a)
text: '(a) Exceto como previsto no parágrafo 145.51(e) ou parágrafo (b)-I desta seção, cada
  pessoa que

  cumpra os requisitos deste RBAC tem direito a um certificado de organização de manutenção
  com

  as devidas categorias/classes e especificações operativas, que prescrevem as limitações
  que sejam

  necessárias à garantia da segurança. (Redação dada pela Resolução nº 610, de 23.02.2021)'
