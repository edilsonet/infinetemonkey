cite: 145.53(b-II)
title: 145.53(b-II)
text: '(b)-II Caso a organização de manutenção esteja localizada fora do Brasil e a ANAC seja
  a

  autoridade de aviação civil primariamente responsável pela sua certificação e supervisão,
  a

  organização de manutenção deve cumprir os mesmos requisitos que devem ser cumpridos por
  uma

  organização localizada no Brasil.'
