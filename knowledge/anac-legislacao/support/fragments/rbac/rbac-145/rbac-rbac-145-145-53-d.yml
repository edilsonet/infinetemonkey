title: 145.53(d)
text: '(d) Antes da emissão do certificado de organização de manutenção, o requerente deve
  declarar

  por escrito que todo o pessoal da organização de manutenção ou seus subcontratados que executam

  funções de trabalho relacionadas ao transporte aéreo de cargas perigosas (artigos perigosos)
  estão


  Data da emissão: 26 de fevereiro de 2021.

  treinados conforme descrito na edição mais atualizada do Technical Instructions for the
  Safe

  Transport of Dangerous Goods by Air da Organização Internacional de Aviação Civil - ICAO.'
