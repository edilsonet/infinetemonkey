cite: 145.55(a)
title: 145.55(a)
text: '(a) Um certificado emitido pela ANAC para uma organização de manutenção localizada
  no

  Brasil tem validade a partir da data de sua emissão até que seja solicitado o seu cancelamento
  pelo

  seu detentor e este seja aceito pela ANAC, ou seja suspenso ou cassado pela ANAC. (Redação

  dada pela Resolução nº 610, de 23.02.2021)'
