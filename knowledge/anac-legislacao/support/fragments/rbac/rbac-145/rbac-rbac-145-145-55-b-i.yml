section_title: Validade e renovação do certificado
subsection_id: b-i
cite: 145.55(b-I)
title: 145.55(b-I)
text: '(b)-I Um certificado emitido pela ANAC para uma organização de manutenção localizada
  fora

  do Brasil tem validade a partir da data de sua emissão até o último dia do 24o (vigésimo
  quarto) mês

  após a data da emissão inicial, a não ser que seja devolvido por seu detentor ou que seja
  suspenso

  ou cassado pela ANAC. O certificado poderá, a cada vez, ser renovado por 24 (vinte e quatro)

  meses, se a ANAC constatar que a organização de manutenção operou em cumprimento aos

  requisitos aplicáveis deste RBAC, dentro do período de duração precedente do certificado.'
