cite: 145.55(c)
title: 145.55(c)
text: '(c) Cada organização de manutenção certificada pela ANAC fora do Brasil que deseje
  renovar

  seu certificado deve submeter o requerimento de renovação pelo menos 60 (sessenta) dias
  antes do

  vencimento do certificado atual. Se o pedido de renovação não foi feito nesse prazo, a organização

  de manutenção deverá seguir os procedimentos de requerimento conforme a seção

  145.51. (Redação dada pela Resolução nº 610, de 23.02.2021)'
