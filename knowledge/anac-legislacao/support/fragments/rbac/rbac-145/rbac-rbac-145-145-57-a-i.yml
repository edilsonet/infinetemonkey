section_title: Emenda ou transferência de certificado
subsection_id: a-i
cite: 145.57(a-I)
title: 145.57(a-I)
text: '(a)-I No caso de diminuição de capacidade da organização, o requerimento para emenda
  ao

  certificado deve ser submetido à ANAC no máximo 5 (cinco) dias úteis após ocorrer a diminuição

  de capacidade. Nos demais casos, o requerimento para emenda ao certificado deve ser submetido
  à

  ANAC pelo menos 30 (trinta) dias antes da data proposta para efetivação da modificação.
  Em todos

  os casos, deve ser apresentada a documentação necessária.'
