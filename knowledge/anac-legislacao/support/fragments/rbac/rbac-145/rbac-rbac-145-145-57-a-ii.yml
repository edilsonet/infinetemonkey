cite: 145.57(a-II)
title: 145.57(a-II)
text: '(a)-II Um certificado poderá ser emendado pela ANAC removendo categorias/classes ou

  alterando sua limitação caso seja constatado que a organização de manutenção não apresenta

  condições de manter essa certificação.


  Data da emissão: 26 de fevereiro de 2021.'
