cite: 145.57(a)
title: 145.57(a)
text: '(a) Um requerimento para emenda de um certificado de organização de manutenção deve
  incluir

  o cumprimento do parágrafo 145.53(d), se já não tiver sido cumprido anteriormente. Uma emenda

  ao certificado é necessária se o detentor do certificado:

  (1) mudar a localização da organização de manutenção;

  (2) requerer adição ou alteração de sua capacidade ou categoria/classe; ou

  (3)-I mudar de razão social ou denominação social da organização.'
