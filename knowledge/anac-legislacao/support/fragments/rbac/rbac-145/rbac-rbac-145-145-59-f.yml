cite: 145.59(f)
title: 145.59(f)
text: '(f) Categoria Acessório:

  (1) Classe 1: Acessórios mecânicos que dependem de atrito, hidráulica, acoplamento

  mecânico, ou pressão pneumática para sua operação, incluindo freios de roda de aeronave,
  bombas

  acionadas mecanicamente, carburadores, conjunto de rodas de aeronave, amortecedores, unidades

  servo hidráulicas e equipamentos de emergência;

  (2) Classe 2: Acessórios elétricos que dependem de energia elétrica para sua operação,

  geradores, motores de partida, reguladores de voltagem, motores elétricos, bombas de combustível

  acionadas eletricamente, magnetos, ou acessórios elétricos similares; e

  (3) Classe 3: Acessórios eletrônicos que dependem do uso de válvulas eletrônicas, transistor

  ou dispositivos similares, incluindo sistemas de entretenimento em voo, controles de

  superalimentador, de temperatura e ar condicionado ou controles eletrônicos similares.'
