title: 145.59(g-I)
text: '(g)-I Categoria Serviços Especializados: Classe Única - Atividades específicas de execução
  de

  manutenção que a ANAC julgar procedente caso não esteja sob outras certificações de organização

  de manutenção, por tipo de serviço (ex.: ensaios não destrutivos, serviços de soldagem,
  pintura,

  pesagem de aeronaves, trabalhos em revestimentos de tela, serviços especializados em pás
  de

  rotores, análises de vibração e balanceamento dinâmico, análises de performance, serviços
  de

  tapeçaria e interiores, , inspeções e testes do sistema anemométrico, inspeção boroscópica,
  lavagem

  de compressores de motores à reação, banhos galvânicos, shot peening, limpeza por jateamento

  abrasivo, inspeção por ataque ácido, inspeções/ensaios de vasos de pressão).'
