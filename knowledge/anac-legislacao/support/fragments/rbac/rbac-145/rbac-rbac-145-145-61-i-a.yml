cite: 145.61-I(a)
title: 145.61-I(a)
text: '(a) A ANAC somente emite certificados com categoria/classe limitada à manutenção,

  manutenção preventiva e alteração de um (ou mais) modelo particular de aeronave, motor,
  hélice,

  rádio, instrumento ou acessório, ou suas partes, de um particular fabricante, ou de um (ou
  mais) tipo

  de serviço especializado de manutenção.'
