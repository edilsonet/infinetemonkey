cite: 145.61-I(c)
title: 145.61-I(c)
text: '(c) Para uma certificação de serviços especializados, as especificações operativas
  da organização

  de manutenção devem conter as especificações usadas para executar o serviço especializado.
  A

  especificação pode ser:

  (1) uma especificação civil ou militar usada atualmente pela indústria e aceita pela ANAC;

  (2) uma especificação desenvolvida pelo requerente e aprovada pela ANAC; ou

  (3) uma especificação baseada em dados técnicos considerados aceitáveis pela

  ANAC. (Redação dada pela Resolução nº 610, de 23.02.2021)


  Data da emissão: 26 de fevereiro de 2021.

  SUBPARTE C

  INSTALAÇÕES, RECURSOS, EQUIPAMENTOS, FERRAMENTAS, MATERIAIS E

  DADOS TÉCNICOS'
