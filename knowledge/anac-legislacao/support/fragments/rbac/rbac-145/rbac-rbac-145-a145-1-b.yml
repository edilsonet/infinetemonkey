cite: A145.1(b)
title: A145.1(b)
text: '(b) declaração de possuir entendimento, na extensão de sua responsabilidade, dos seguintes

  assuntos:

  (1) normas técnicas de segurança em aviação e práticas operacionais seguras;

  (2) legislação da aviação civil, incluindo leis, regulamentos, instruções suplementares,
  etc.;

  (3) especificações operativas do detentor de certificado; e

  (4) os manuais requeridos pelos parágrafos 145.207(a) e 145.211(c) deste RBAC.'
