title: Cadastramento de Responsável Técnico na ANAC no caso de organização de
text: 'A145.1 Cadastramento de Responsável Técnico na ANAC no caso de organização de

  manutenção localizada no Brasil (Redação dada pela Resolução nº 552, de 29.04.2020)


  Para que um Responsável Técnico, regularmente registrado pelo correspondente conselho de

  fiscalização de profissão, seja cadastrado na ANAC deve possuir título - seja de técnico
  industrial,

  técnico de nível superior (tecnólogo) ou engenheiro¬ - e atribuição profissional coerentes
  com a

  atividade desempenhada; devendo a organização de manutenção apresentar: (Redação dada pela

  Resolução nº 552, de 29.04.2020)'
