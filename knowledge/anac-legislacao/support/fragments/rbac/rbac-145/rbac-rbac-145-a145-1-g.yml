cite: A145.1(g)
title: A145.1(g)
text: '(g) comprovação de:

  (1) curso em pelo menos um dos artigos mais complexos incluídos no certificado de

  organização de manutenção e suas especificações operativas ou experiência prática compatível
  com

  os tipos de serviços de manutenção relacionados no certificado e suas especificações operativas;

  (Redação dada pela Resolução nº 463, de 07.02.2018)

  (2) pelo menos 3 (três) anos dentro dos últimos 6 (seis) anos de experiência em atividades

  profissionais relacionadas a manutenção de produtos aeronáuticos; e (Redação dada pela Resolução

  nº 463, de 07.02.2018)

  (3) compatibilização de tempo e área de atuação para atuar em mais de uma empresa.

  (Incluído pela Resolução nº 463, de 07.02.2018)


  Data da emissão: 26 de fevereiro de 2021.

