section_title: Designação do Gestor do SGSO
subsection_id: a
cite: B145.3(a)
title: B145.3(a)
text: '(a) O Gestor do SGSO, que é a pessoa única e identificável na estrutura organizacional
  da

  organização de manutenção, independentemente de outras atribuições, para ser designado,
  deve

  atender aos critérios de:

  (1) possuir acesso direto ao Gestor Responsável;

  (2) possuir competência, experiência e treinamento estabelecidos pelo detentor de um

  certificado de organização de manutenção para exercício desta função perante a ANAC; e

  (3) possuir acesso aos dados e informações de segurança operacional necessários ao exercício

  das responsabilidades citadas neste regulamento.'
