section_title: Responsabilidades do Gestor Responsável
subsection_id: a
cite: B145.5(a)
title: B145.5(a)
text: '(a) Independentemente de outras responsabilidades perante a organização de manutenção,
  o

  Gestor Responsável detém as responsabilidades elencadas a seguir:

  (1) assegurar que o SGSO seja implementado de forma efetiva em todas as áreas da

  organização de manutenção, em conformidade com os requisitos aplicáveis, de modo compatível

  com o porte e a complexidade das operações;

  (2) comunicar a toda organização a importância de conduzir as operações em conformidade

  com os requisitos de segurança operacional aplicáveis;

  (3) estabelecer e assinar a política da segurança operacional e comunicar a importância
  do

  comprometimento de todos os colaboradores com a referida política, assegurando que ela

  permaneça adequada ao detentor de um certificado de organização de manutenção;

  (4) assegurar a disponibilidade dos recursos necessários para garantir o alcance dos objetivos

  da segurança operacional e para a gestão do SGSO;

  (5) assegurar que as tomadas de decisão dos demais gestores sejam orientadas por um

  processo institucionalizado de avaliação de riscos, considerando os impactos potenciais
  de suas

  decisões para a segurança operacional;


  Data da emissão: 26 de fevereiro de 2021.

  (6) conduzir análises críticas da gestão do SGSO, visando assegurar a melhoria contínua
  do

  sistema;

  (7) rever regularmente o desempenho de segurança operacional do detentor de um certificado

  de organização de manutenção, e tomar as medidas necessárias para tratamento de eventual

  desempenho insatisfatório de segurança operacional;

  (8) assegurar que as prerrogativas e responsabilidades acerca do gerenciamento da segurança

  operacional sejam clara e objetivamente estabelecidas e comunicadas em todas as áreas da

  organização de manutenção;

  (9) assegurar que todo o pessoal da organização envolvido em atividades com impacto na

  segurança operacional cumpra com os requisitos aplicáveis e critérios internos de competência,

  experiência e treinamento para o exercício de suas prerrogativas e responsabilidades;

  (10) assegurar que os objetivos da segurança operacional sejam estabelecidos, e que sejam

  mensuráveis e alinhados com a política da segurança operacional;

  (11) assegurar que planos estratégicos, sistemas, manuais e demais documentos normativos

  internos relativos à gestão do SGSO sejam aprovados pelos gestores competentes;

  (12) assegurar que sejam estabelecidos mecanismos eficazes de comunicação interna e com
  as

  autoridades, com relação ao desempenho e melhoria contínua do SGSO; e

  (13) assegurar a integridade e o desempenho do SGSO, em face de mudanças internas (na

  organização ou no SGSO) ou mudanças externas que tenham impactos potenciais sobre a operação

  do detentor de um certificado de organização de manutenção.'
