cite: 153.1(v)
title: 153.1(v)
text: '(v) a presença de animal(is) na área operacional exercer efeito significativo sobre
  a

  operação das aeronaves, como, por exemplo, uma abortiva da decolagem ou a saída da aeronave
  pelas

  laterais ou cabeceiras da pista.

  (Incluído pela Resolução nº 611, de 09.03.2021)

  (15)-II Comissão de Gerenciamento do Risco da Fauna - CGRF significa a comissão instituída

  pelo operador de aeródromo, que deve convidar à participação representantes de órgãos públicos
  e

  demais organizações da sociedade civil cuja participação julgue pertinente para o gerenciamento
  do

  risco da fauna provocado por focos atrativos e potencialmente atrativos situados na ASA.
  (Incluído

  pela Resolução nº 611, de 09.03.2021)

  (16) Condição de socorro significa a condição em que a aeronave se encontra ameaçada por

  um grave ou iminente perigo e requer assistência imediata. A condição de socorro também
  se aplica

  à situação de emergência em que o acidente aeronáutico é inevitável ou já está consumado.

  (17) Condição de urgência significa a condição que envolve a segurança da aeronave ou de

  alguma pessoa a bordo, mas que não requer assistência imediata.

  (17)-I Condicionamento aeróbico significa a capacidade de continuar a realizar atividades

  físicas por períodos prolongados de tempo em intensidade baixa ou moderada. Exemplos de

  atividades que exigem bom condicionamento aeróbico são caminhada, corridas de média/longa

  distância, ciclismo, natação e outras atividades de resistência. (Incluído pela Resolução
  nº 517, de

  14.05.2019)


  Data da emissão: 15 de março de 2021.


  (17)-II Condicionamento anaeróbico significa a capacidade de realizar atividades físicas
  que

  requerem grandes quantidades de energia e duram poucos segundos ou minutos em uma

  intensidade alta. Exemplos de atividades que exigem bom condicionamento aeróbico são

  levantamento de peso, corridas de curta distância, “tiros” de natação e outras atividades
  com muita

  carga e curta duração. (Incluído pela Resolução nº 517, de 14.05.2019)

  (18) Contaminantes do pavimento significa depósitos de borracha, água, neve, gelo, areia,

  óleo, lama, limo, fluido ou qualquer outra substância que prejudique a performance da aeronave.

  (19) Corpo de Voluntários de Emergência (CVE) significa o grupo de voluntários com a

  função de auxiliar nas atividades de resposta à emergência aeroportuária.

  (20) Defeitos no pavimento significa danos ou deteriorações na superfície do pavimento que

  podem ser classificados segundo uma metodologia normatizada e identificados a olho nu, tais
  como

  fissuras,

  trincas,

  afundamentos,

  ondulações

  ou

  corrugações,

  desníveis,

  deformações,

  escorregamentos, exsudações, desgastes, panelas ou buracos, desnivelamentos de placas,

  escalonamentos ou degraus nas juntas, bombeamentos, avarias no material selante entre juntas,

  esborcinamentos, entre outros.

  (21) Emergência aeronáutica significa a situação em que uma aeronave e seus ocupantes se

  encontram sob condições de perigo latente ou iminente decorrentes de sua operação ou que
  tenham

  sofrido suas consequências.

  (22) Emergência aeroportuária significa o evento ou circunstância, incluindo uma emergência

  aeronáutica que, direta ou indiretamente, afeta a segurança operacional ou põe em risco
  vidas

  humanas em um aeródromo.

  (22)-I Entorno do aeródromo significa o espaço compreendido pela Área de Segurança

  Aeroportuária - ASA, à exceção da área compreendida pelo sítio aeroportuário. (Incluído
  pela

  Resolução nº 611, de 09.03.2021)

  (23) Equipagem significa o conjunto de bombeiros de aeródromo designados para compor a

  tripulação de um CCI e demais veículos do SESCINC. (Redação dada pela Resolução nº 517,
  de

  14.05.2019)

  (24) [Reservado]. (Redação dada pela Resolução nº 517, de 14.05.2019)

  (25) Equipamento de proteção respiratória (EPR) significa o equipamento que visa à proteção

  do usuário contra a inalação de ar contaminado ou de ar com deficiência de oxigênio.

  (26) Eventos de Segurança Operacional (ESO) significa acidentes, incidentes graves,

  incidentes, ocorrências de solo, ocorrências anormais ou qualquer situação de risco que
  cause ou

  tenha o potencial de causar dano, lesão ou ameaça à viabilidade da operação aeroportuária
  ou aérea.

  (27) Fraseologia significa padrões estabelecidos com o objetivo de assegurar a uniformidade

  das comunicações radiotelefônicas, reduzir ao mínimo o tempo de transmissão das mensagens
  e

  proporcionar comunicações claras e concisas.

  (28) Gerenciamento de risco da segurança operacional significa um processo contínuo que

  inclui a identificação de perigos, realização de análise das consequências dos perigos,
  avaliação dos

  riscos decorrentes dos perigos identificados, proposição de ações de eliminação dos perigos
  e/ou

  mitigação dos riscos e avaliação da eficácia das ações propostas. Consiste na identificação,
  avaliação,

  eliminação do perigo e/ou mitigação dos riscos que ameaçam a segurança operacional relacionada
  às

  operações.

  (28)-I Focos com potencial atrativo de fauna significa quaisquer atividades, estruturas
  ou áreas

  que, utilizando as devidas técnicas de operação e de manejo, não se constituam como foco
  atrativo

  de fauna no interior da ASA, nem comprometam a segurança operacional da aviação. (Incluído
  pela


  Data da emissão: 15 de março de 2021.


  Resolução nº 611, de 09.03.2021)

  (28)-II Focos de atração significa quaisquer atividades, estruturas ou áreas que sirvam
  de foco

  ou concorram para a atração relevante de fauna, no interior da ASA, comprometendo a segurança

  operacional da aviação. (Incluído pela Resolução nº 611, de 09.03.2021)

  (29) Hora-pico significa o intervalo de 60 (sessenta) minutos mais movimentados no dia

  médio do mês pico do ano civil.

  (30) Hot spot significa o local na área de movimento do aeródromo que possua risco histórico

  ou potencial de colisão ou de incursão em pista, no qual os pilotos e condutores de veículos
  necessitam

  de maior atenção.

  (30)-I Identificação do Perigo da Fauna - IPF significa o documento que apresenta uma

  abordagem preliminar do perigo da fauna, na qual são identificadas as espécies de fauna
  presentes no

  aeródromo e no seu entorno que provocam risco às operações aéreas, bem como os principais
  focos

  de atração e as medidas para a redução do risco. (Incluído pela Resolução nº 611, de 09.03.2021)

  (31) Incursão em pista significa toda ocorrência em aeródromo envolvendo a presença

  incorreta de aeronave, veículo ou pessoa na área protegida de uma superfície designada para
  pouso e

  decolagem de aeronaves.

  (31)-I Índice anual de colisões com fauna que tenham gerado acidente aeronáutico ou incidente

  aeronáutico grave expressa o número de colisões por ano a cada 100.000 (cem mil) movimentos
  de

  aeronaves, que tenham gerado acidente aeronáutico ou incidente aeronáutico grave. (Incluído
  pela

  Resolução nº 611, de 09.03.2021)

  (32) Impacto em Horário de Transporte (HOTRAN) significa qualquer alteração da

  programação publicada de um operador aéreo, no número de assentos ofertados ou no PMD/PMA

  em determinado voo regular.

  (33) Indicadores de Desempenho de Segurança Operacional (IDSO) significa a medição do

  desempenho de segurança operacional de um operador de aeródromo, expressa em termos

  quantificáveis, associados aos resultados de uma dada atividade realizada pelo provedor
  de serviços.

  (33)-I Intervenção imediata significa o procedimento adotado pelo SESCINC para atendimento

  às aeronaves na Condição de Socorro, requerendo intervenção imediata no local do acidente

  aeronáutico. (Incluído pela Resolução nº 517, de 14.05.2019)

  (34) Manual de Gerenciamento da Segurança Operacional (MGSO) significa o documento,

  ou o conjunto de documentos, elaborado pelo operador de aeródromo, que consolida a política,

  objetivos, procedimentos, metodologias e demais requisitos adotados para garantia da segurança

  operacional.

  (35) Manutenção corretiva em aeródromos significa a manutenção efetuada após a ocorrência

  de uma pane, constatação de defeito ou de não-conformidade a requisito, sendo destinada
  a recolocar

  um item ou um conjunto de itens em condições de executar a função dele requerida.

  (36) Manutenção preventiva em aeródromos significa a manutenção efetuada em intervalos

  pré-determinados, de acordo com critérios definidos previamente, sendo destinada a reduzir
  a

  probabilidade de falha ou a degradação do funcionamento de um item ou de um conjunto de
  itens.

  (37) Mapa de grade significa a representação plana da área do aeródromo e de seu entorno,

  traçada sobre um sistema de linhas perpendiculares, identificadas com caracteres alfanuméricos.

  (38) Método ACN-PCN significa o método utilizado para estabelecer a resistência de

  pavimentos destinados a aeronaves de mais de 5.700 kg. O método encontra-se definido em
  Instrução

  Suplementar específica. (Vide IS nº 153.103-001)


  Data da emissão: 15 de março de 2021.


  (39) Movimento de aeronave significa o termo genérico utilizado para caracterizar um pouso,

  uma decolagem ou um toque e arremetida de aeronaves no aeródromo.

  (40) Nível Aceitável de Desempenho da Segurança Operacional (NADSO) significa uma

  referência mensurável para medir o desempenho de segurança operacional de um operador de

  aeródromo, proposto em seu SGSO como parte de seus objetivos de segurança operacional, e
  que

  deve ser aceito pela ANAC.

  (41) Objetivos de desempenho da segurança operacional significa os níveis de desempenho

  da segurança operacional requeridos em um sistema. Um objetivo de desempenho da segurança

  operacional é medido e quantificado por meio de um ou mais indicadores de desempenho, com
  vistas

  ao atendimento do(s) resultado(s) desejado(s), expresso(s) em termos deste(s) indicador(es).

  (42) Ocorrência de solo significa todo evento que envolva aeronave no solo, do qual resulte

  dano e/ou lesão, desde que não haja intenção de realizar voo ou, havendo esta intenção,
  o(s) fato(s)

  motivador(es) esteja(m) diretamente relacionado(s) aos serviços de rampa, sem qualquer contribuição

  da movimentação da aeronave por meios próprios ou da operação de quaisquer de seus sistemas.

  (43) Ocorrência na área de movimento significa todo evento, dentro da área de movimento,

  que não envolva aeronave.

  (44) Operação em baixa visibilidade significa a operação aeroportuária executada em

  condição de alcance visual de pista de pouso e decolagem (RVR) inferior a 350 m (trezentos
  e

  cinquenta metros).

  (45) Operador de aeródromo ou operador aeroportuário significa a pessoa jurídica que tenha

  recebido, por órgão competente, a outorga de exploração da infraestrutura aeroportuária.

  (46) Passageiros processados significa a soma de passageiros embarcados e desembarcados

  no aeródromo.

  (47) Pátio de Aeronaves significa a área definida em um aeródromo em terra com o propósito

  de acomodar aeronaves para fins de embarque e desembarque de passageiros, carregamento ou

  descarregamento de cargas, correio, reabastecimento de combustível, estacionamento ou

  manutenção.

  (48) Perigo significa a condição, objeto ou atividade que potencialmente possa causar lesões

  a pessoas, danos a equipamentos ou a estruturas, perda de pessoal ou redução da habilidade
  para

  desempenhar uma função determinada.

  (49) Período de referência significa o período de 3 (três) anos anteriores ao ano corrente

  dentro do qual é obtida a média aritmética do movimento anual de passageiros processados
  para efeito

  do cálculo da classe do aeródromo.

  (50) Plano Contraincêndio de Aeródromo (PCINC) significa o documento que estabelece os

  procedimentos operacionais a serem adotados pelo SESCINC para os atendimentos às emergências

  ocorridas na sua área de atuação.

  (51) Plano de Assistência às Vítimas de Acidente Aeronáutico e Apoio a seus Familiares

  (PAFAVIDA) significa o plano regulamentado pela IAC 200-1001 ou instrumento normativo que
  a

  substitua.

  (52) Plano de Emergência em Aeródromo (PLEM) significa o documento que estabelece as

  responsabilidades dos órgãos, entidades ou profissionais que possam ser acionados para o

  atendimento às emergências ocorridas no aeródromo ou em seu entorno.

  (52)-I Posicionamento para intervenção significa o procedimento adotado pelo SESCINC para

  atendimento às aeronaves na condição de urgência ou socorro, requerendo o posicionamento
  dos CCI


  Data da emissão: 15 de março de 2021.


  para aguardar a aeronave naquela condição e o acompanhamento da mesma, após o pouso, até
  a

  parada total dos motores. (Incluído pela Resolução nº 517, de 14.05.2019)

  (53) Pista molhada significa a situação em que a intensidade de chuva na pista de pouso
  e

  decolagem é superior a 5,0 mm/h ou razão equivalente.

  (54) Posto Avançado Contraincêndio (PACI) significa a seção contraincêndio satélite, onde

  são alocados parte dos recursos do SESCINC. (Redação dada pela Resolução nº 517, de 14.05.2019)

  (54)-I Probabilidade do Risco significa a possibilidade de que um evento ou uma situação

  insegura possa ocorrer. (Incluído pela Resolução nº 611, de 09.03.2021)

  (55) Procedimentos Específicos de Segurança Operacional (PESO) significa a denominação

  atribuída a documento no qual se encontram detalhadas e documentadas as medidas para eliminação

  ou mitigação dos riscos referentes a evento ou perigo identificado. O PESO tem como objetivo
  a

  descrição da implantação e/ou da execução das medidas para eliminação e/ou mitigação dos
  riscos

  decorrentes da AISO.

  (56) Posto de Coordenação Móvel (PCM) significa a estrutura com atribuição específica de

  estabelecer a coordenação local dos órgãos/organizações e serviços do aeródromo e da comunidade

  do entorno relacionados para auxiliar na resposta à emergência.

  (57) Profundidade da macrotextura significa a média aritmética dos valores calculados para

  cada área de medição.

  (58) Profundidade da macrotextura de cada medição significa o resultado da divisão do

  volume de areia utilizado no ensaio pela área coberta pela areia.

  (59) Profundidade média da macrotextura significa a média aritmética das profundidades da

  macrotextura, para cada terço da pista de pouso e decolagem.

  (59)-I Programa de gerenciamento do risco da fauna - PGRF significa o documento que, com

  base nos resultados obtidos em IPF, visa estruturar as operações do aeródromo para o gerenciamento

  permanente do risco provocado pela fauna às operações aéreas. (Incluído pela Resolução nº
  611, de

  09.03.2021)

  (60) Programa de Instrução de Segurança Operacional (PISOA) significa o documento que

  consolida os requisitos estabelecidos para a capacitação do pessoal que atua em atividades
  direta ou

  indiretamente relacionadas à segurança operacional.

  (61) Provedor de Serviço de Aviação Civil (PSAC) significa toda pessoa natural ou jurídica

  responsável pela prestação de serviços relacionados à aviação civil e foco de regulação
  da Agência

  Nacional de Aviação Civil.

  (62) Pushback significa a operação de deslocamento, por equipamento auxiliar, da aeronave

  parada até a posição na qual possa se deslocar por meios próprios.

  (63) Reboque ou tratoramento de aeronave significa qualquer deslocamento de aeronave por

  meio de equipamento auxiliar, sendo o pushback um tipo desta operação.

  (64) Recursos contraincêndio significa os meios existentes no aeródromo referentes aos

  agentes extintores, carros contraincêndio e pessoal habilitado ao desempenho das atividades

  operacionais de salvamento e combate a incêndio em aeródromos. (Redação dada pela Resolução
  nº

  517, de 14.05.2019)

  (64)-I Regime de descarga significa a quantidade mínima de agentes extintores necessários
  para

  o controle, em um minuto, de incêndio em aeronaves que operam em um determinado aeródromo.
  O

  regime de descarga é definido para cada CAT do aeródromo e é expresso em litros por minuto
  (l/min)

  ou em quilogramas por minuto (kg/min). (Incluído pela Resolução nº 517, de 14.05.2019)


  Data da emissão: 15 de março de 2021.


  (65) Risco significa a avaliação das consequências de um perigo, expresso em termos de

  probabilidade e de severidade, tomando como referência a pior condição possível.

  (66) Seção Contraincêndio de Aeródromo (SCI) significa o conjunto de dependências e

  instalações projetadas para servir de centro administrativo e operacional das atividades
  do SESCINC.

  (67) Segurança operacional significa o estado no qual o risco de lesões a pessoas ou danos
  a

  bens se reduz ou se mantém em um nível aceitável, ou abaixo deste, por meio de um processo
  contínuo

  de identificação de perigos e gestão de riscos.

  (68) Serviço de Salvamento e Combate a Incêndio (SESCINC) significa o serviço composto

  pelo conjunto de atividades administrativas e operacionais desenvolvidas em proveito da
  segurança

  contraincêndio do aeródromo, cuja principal finalidade é o salvamento de vidas por meio
  da utilização

  dos recursos humanos e materiais disponibilizados. (Redação dada pela Resolução nº 517,
  de

  14.05.2019)

  (68)-I Severidade do Risco significa as possíveis consequências de um evento ou uma situação

  insegura, tomando como referência a pior condição previsível. (Incluído pela Resolução nº
  611, de

  09.03.2021)

  (69) Sinaleiro significa o profissional capacitado a orientar as operações de manobra de
  uma

  aeronave em solo.

  (70) Sistema de Gerenciamento da Segurança Operacional (SGSO) significa um conjunto de

  ferramentas gerenciais e métodos organizados de forma sistêmica para apoiar as decisões
  a serem

  tomadas por um provedor de serviço da aviação civil em relação ao risco de suas atividades
  diárias.

  (71) Sistema de Orientação e Controle da Movimentação no Solo (SOCMS) significa um

  sistema composto de auxílios e informações, que permitem aos motoristas e pilotos identificar
  suas

  rotas e locais de atuação, e de medidas para garantir em qualquer parte da área de movimento
  do

  aeródromo um fluxo ordenado e seguro para o tráfego de veículos e aeronaves em solo.

  (72) Sistema de Resposta à Emergência Aeroportuária (SREA) significa um conjunto de

  recursos internos e externos ao aeródromo, com responsabilidades e procedimentos próprios,
  que em

  coordenação deve responder eficientemente a emergências aeroportuárias, visando o salvamento
  de

  vidas, bem como à mitigação de danos materiais, e garantindo ao aeródromo retorno eficaz
  às suas

  operações.

  (73) Solvente polar significa todo combustível líquido miscível com água, tais como álcool,

  acetona ou éter.

  (74) Tolerabilidade ao risco significa o limiar de aceitação por determinada pessoa, natural

  ou jurídica, da expectativa de perdas ou redução de capacidade ou de produtividade, lesões
  físicas ou

  danos materiais em determinado período de exposição a perigo identificado.

  (74)-I Traje de Proteção significa o conjunto de equipamentos de proteção individual

  apropriados às operações de resgate e combate a incêndio. (Incluído pela Resolução nº 517,
  de

  14.05.2019)

  (75) Valor do coeficiente de atrito significa a média aritmética das medições obtidas em
  cada

  extensão de 100 m (cem metros), no mesmo lado e distância em relação ao eixo da pista de
  pouso e

  decolagem.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
