cite: 153.101(a)
title: 153.101(a)
text: '(a) O operador de aeródromo deve garantir que nenhum equipamento ou instalação, a menos

  que sua localização seja necessária para o desempenho de suas funções de navegação aérea
  ou de

  segurança operacional e que esteja de acordo com os requisitos estabelecidos no RBAC nº
  154,

  permaneça:

  (1)

  na faixa de pista;

  (2)

  na RESA;

  (3)

  na faixa de pista de táxi; ou

  (4)

  em uma zona desimpedida (clearway), caso constitua perigo para uma aeronave em voo.'
