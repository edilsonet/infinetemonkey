title: 153.101(b)
text: '(b) O operador de aeródromo deve estabelecer e documentar, em desenho adequado, o

  posicionamento dos equipamentos e instalações de auxílio à navegação aérea que estejam dentro
  do

  sítio aeroportuário e em suas imediações.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
