title: 153.103(a)
text: '(a) Condições operacionais quanto ao pavimento:

  (1)

  O operador de aeródromo pode permitir que até 5% (cinco por cento) do movimento em

  seu sistema de pistas seja realizado por aeronaves que sobrecarreguem o pavimento, tomando
  como

  base o número de movimento de aeronaves registrado nos últimos 12 (doze) meses e observando
  as

  seguintes condições: (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
