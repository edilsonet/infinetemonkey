text: '(i)

  Nos casos onde houver Órgão de Controle de Tráfego Aéreo (Torre de Controle) no

  aeródromo, comunicar imediatamente ao referido órgão, através de meio de comunicação gravado,
  a

  respeito da necessidade de suspensão de determinado tipo de operação aérea;

  (ii)

  Nos casos onde houver Órgão de Informação de Voo (Estação Rádio) no aeródromo,

  suspender determinado tipo de operação aérea no aeródromo e comunicar imediatamente ao referido

  órgão, através de meio de comunicação gravado, a respeito da suspensão;

  (iii) Nos casos onde não houver Órgão dos Serviços de Tráfego Aéreo no aeródromo,

  suspender determinado tipo de operação aérea no aeródromo e comunicar imediatamente, através
  de


  Data da emissão: 15 de março de 2021.


  meio de comunicação gravado, ao Órgão de Controle de Aproximação (APP) ou ao Centro de

  Controle de Área (ACC), a respeito da suspensão.

