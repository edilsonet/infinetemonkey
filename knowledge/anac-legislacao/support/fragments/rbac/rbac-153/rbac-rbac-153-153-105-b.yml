text: '(b) O operador de aeródromo deve solicitar diretamente ao órgão competente a atualização
  das

  informações do aeródromo no AIS não previstas no parágrafo 153.105(a), observadas as normas
  de

  responsabilidade da Autoridade Aeronáutica.'
