title: 153.105(e)
text: '(e) O operador de aeródromo deve monitorar o cumprimento das medidas operacionais

  divulgadas no AIS por parte de operadores aéreos e aeronavegantes e informar à ANAC a ocorrência

  de descumprimento.

  (1)

  A notificação da ANAC deve ser feita até 5 (cinco) dias após a ocorrência do

  descumprimento e deve conter a descrição da operação, com especificação da data e do horário
  local,

  da matrícula da aeronave utilizada, das medidas operacionais descumpridas e, caso disponíveis,
  dos

  dados do operador aéreo e do aeronavegante.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
