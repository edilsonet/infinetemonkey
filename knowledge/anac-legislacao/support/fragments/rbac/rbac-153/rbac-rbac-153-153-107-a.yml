cite: 153.107(a)
title: 153.107(a)
text: '(a) O operador de aeródromo deve implantar e manter um sistema de proteção da área

  operacional do aeródromo e suas respectivas operações aéreas, composto de infraestrutura
  e

  procedimentos adequados ao entorno urbano no qual o sítio aeroportuário encontra-se, para:

  (1)

  prevenção de entrada de animais ou objetos que constituam perigo às operações aéreas;

  (2)

  contenção de acesso não autorizado, premeditado ou inadvertido, de veículos e pessoas.'
