text: '(b) A infraestrutura do sistema de proteção à operação aeroportuária compõe-se por
  barreiras de

  segurança, artificiais ou naturais, edificações e postos de controle de acesso capazes de
  atender às

  finalidades listadas no parágrafo 153.107(a).'
