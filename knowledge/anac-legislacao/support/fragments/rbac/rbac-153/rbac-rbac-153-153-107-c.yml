title: 153.107(c)
text: '(c) O operador de aeródromo deve estabelecer e documentar requisitos de credenciamento
  de

  pessoas, veículos e equipamentos sob aspectos de segurança operacional estabelecidos neste

  regulamento, no que refere a:

  (1)

  Qualificação dos profissionais que atuam na área operacional;

  (2)

  Treinamentos estabelecidos no PISOA;

  (3)

  Condições de veículos e equipamentos;

  (4)

  Acesso e permanência na área de manobras.


  Data da emissão: 15 de março de 2021.'
