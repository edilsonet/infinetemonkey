title: 153.107(d)
text: '(d) O operador de aeródromo deve estabelecer e documentar, em desenho adequado, o

  posicionamento dos elementos de infraestrutura, conforme definido no parágrafo 153.107(b),
  que

  delimitam a área operacional protegida.'
