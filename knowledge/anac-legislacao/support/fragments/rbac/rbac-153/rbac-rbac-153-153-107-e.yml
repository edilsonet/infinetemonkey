title: 153.107(e)
text: '(e) O operador de aeródromo deve observar os requisitos de segurança da aviação civil
  contra

  atos de interferência ilícita, definidos em regulamentação específica, ao estabelecer requisitos,

  procedimentos e prover infraestrutura para a proteção da área operacional do aeródromo.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
