title: 153.109(a)
text: '(a) O operador de aeródromo deve estabelecer e implementar um SOCMS, composto de

  infraestrutura e procedimentos, cujos elementos estejam integrados entre si e que seja capaz
  de: (Vide

  IS nº 153.109)

  (1)

  manter em qualquer parte da área de movimento um fluxo ordenado e seguro para o

  tráfego de aeronaves e veículos;

  (2)

  auxiliar na prevenção de incursão em pista; e

  (3)

  auxiliar na prevenção de colisões que envolvam aeronaves, veículos, equipamentos,

  pessoas ou objetos na área de movimento.'
