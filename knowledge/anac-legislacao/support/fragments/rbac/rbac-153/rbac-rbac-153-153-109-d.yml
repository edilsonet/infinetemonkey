cite: 153.109(d)
title: 153.109(d)
text: '(d) Os requisitos definidos no SOCMS devem ser estabelecidos entre o operador de aeródromo

  e o órgão ATS do aeródromo e consolidados em acordo operacional assinado pelas partes, definindo-

  se os meios e procedimentos necessários para a coordenação de todas as atividades relacionadas
  ao

  fluxo de aeronaves, veículos, equipamentos e pessoas na área de movimento e a responsabilidade
  de

  cada um dos entes envolvidos.

  (1)

  O acordo operacional deve estabelecer meios para prevenir incursão em pista e evitar

  acidentes e incidentes na área de movimento.

  (2)

  O acordo operacional deve prever, quando cabível, o uso compartilhado, total ou parcial,

  da área de movimento por aeronaves militares.

  (3)

  O acordo operacional deve ser respeitado por todas as pessoas que atuem no sítio

  aeroportuário.'
