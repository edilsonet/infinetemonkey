text: '(e) O operador de aeródromo deve estabelecer e documentar, em desenho adequado, o

  posicionamento das sinalizações horizontal e vertical, luzes e demais facilidades que compõem
  o

  SOCMS para o sistema de pistas.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
