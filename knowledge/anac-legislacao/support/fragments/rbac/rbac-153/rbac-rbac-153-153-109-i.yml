title: 153.109(i)
text: '(i)

  condição de visibilidade mais restritiva em que o aeródromo opera;

  (ii)

  densidade de tráfego aéreo na hora-pico; e

  (iii) complexidade do aeródromo.

  (2)

  o dimensionamento do sistema e o posicionamento dos equipamentos devem estar

  compatíveis com a condição de visibilidade mais restritiva sob a qual as operações serão
  realizadas,

  bem como com a densidade de tráfego aéreo na hora-pico;

  (3)

  para a configuração da área de movimento, deve ser observado que a velocidade de

  exaustão de gases dos motores das aeronaves posicionadas em direção a edificações, equipamentos,

  veículos e pessoas, durante operações aéreas, não ultrapasse 56 km/h quando atingir estes
  elementos;

  (4)

  a quantidade de posições de estacionamento de aeronaves no pátio, bem como sua

  disposição e área específica, deve considerar:'
