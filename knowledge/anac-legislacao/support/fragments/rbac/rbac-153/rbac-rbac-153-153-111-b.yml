title: 153.111(b)
text: '(b) O operador de aeródromo deve proibir e impedir o ingresso na área operacional de
  qualquer

  equipamento ou realização de atividade que produza faísca, fogo ou fenômeno de combustão.

  (1)

  Serão permitidos apenas equipamentos e atividades que contenham PESO.'
