cite: 153.111(c)
title: 153.111(c)
text: '(c) O operador de aeródromo deve proibir a permanência e garantir a retirada da área
  de

  movimento do aeródromo de veículos e equipamentos que não apresentem as condições físicas
  e

  operacionais requeridas para a execução de suas atividades ou não cumpram as regras estabelecidas

  na “ABNT/NBR 8919 - Aeronave - Equipamento de apoio no solo - Sinalização” ou norma que
  a

  substitua.'
