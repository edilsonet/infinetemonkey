cite: 153.111(e)
title: 153.111(e)
text: '(e) O operador de aeródromo deve proibir:

  (1)

  o estacionamento de veículo e equipamento em local não demarcado para este fim;

  (2)

  a permanência de veículo ou equipamento autopropelido com o motor em funcionamento

  sem a presença de motorista;

  (3)

  que veículo ou equipamento se posicione de modo a bloquear a rota de fuga dos veículos

  destinados ao abastecimento de aeronave;


  Data da emissão: 15 de março de 2021.


  (4)

  que pessoas, veículos e equipamentos transitem sobre mangueiras ou cabos durante o

  abastecimento de aeronave;

  (5)

  que veículo ou equipamento permaneça ou trafegue por trás de aeronave, exceto em via

  de serviço ou para execução de atividade essencial à operação ou manutenção da aeronave
  na posição

  de estacionamento;

  (6)

  que pessoa, veículo ou equipamento adentre ou retire-se de posição de estacionamento

  quando a aeronave estiver em movimento, seus motores em funcionamento ou as luzes anticolisão

  acesas, exceto se essencial à execução da atividade; e

  (7)

  a permanência ou trânsito de veículos e equipamento em distância inferior a 1,5m (um

  metro e meio) a partir do contorno da aeronave, exceto se essencial à execução da atividade.

  (8)

  o trânsito ou a permanência de pessoas, veículos e equipamentos sob as asas de aeronaves,

  exceto se essencial à execução da atividade.'
