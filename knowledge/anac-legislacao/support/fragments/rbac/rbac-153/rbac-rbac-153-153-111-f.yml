text: '(f)

  O motorista de veículo ou equipamento que trafegue na área operacional deve ser orientado

  e acompanhado por outro profissional da equipe de terra durante a execução de marcha à ré
  efetuada

  dentro da área de segurança da aeronave estacionada.'
