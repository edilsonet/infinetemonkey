title: 153.111(g)
text: '(g) O operador de aeródromo deve estabelecer e documentar requisitos de movimentação
  na

  área operacional quanto a:

  (1)

  altura máxima permitida para veículos e equipamentos que acessem a área operacional;

  (2)

  velocidade de deslocamento nas vias de acesso e vias de serviço;'
