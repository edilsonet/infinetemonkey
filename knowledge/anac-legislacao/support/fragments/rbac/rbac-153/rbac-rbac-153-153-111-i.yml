title: 153.111(i)
text: '(i)

  a velocidade máxima de veículos nas áreas próximas às posições de estacionamento

  de aeronaves é de 20 km/h, sendo de 30 km/h no restante do pátio de aeronaves, exceto veículos

  atuando em situação de emergência;

  (3)

  pontos de parada nas vias;

  (4)

  sentido das vias;

  (5)

  cruzamentos de vias com pista de táxi;

  (6)

  cruzamentos entre vias;

  (7)

  movimentação de aeronave em procedimento de tratoramento;

  (8)

  trânsito de passageiros no pátio de aeronaves durante procedimentos de embarque e

  desembarque, se cabível;

  (9)

  prioridade de tráfego de veículos atuando em atividade de resposta à emergência.'
