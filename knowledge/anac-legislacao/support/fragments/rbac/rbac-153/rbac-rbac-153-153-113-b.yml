title: 153.113(b)
text: '(b) O operador de aeródromo deve permitir o tráfego e a permanência na área de manobras

  somente de pessoas que atendam aos requisitos de qualificação e treinamento estabelecidos,

  respectivamente, nos parágrafos 153.35 e 153.37 deste Regulamento e demais normas vigentes.

  (1)

  O operador de aeródromo deve assegurar que pessoa sem qualificação e treinamento

  exigidos no caput deste parágrafo somente transite ou permaneça na área de manobras com
  o

  acompanhamento e supervisão de pessoa capacitada.'
