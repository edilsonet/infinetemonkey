title: 153.113(d)
text: '(d) O operador de aeródromo deve assegurar que as pessoas envolvidas em atividades
  de

  operação na área de manobras estejam capacitadas a usar a radiocomunicação e utilizem fraseologia

  por radiotelefonia (RTF).'
