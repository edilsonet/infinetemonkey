title: 153.113(e)
text: '(e) O motorista de veículo ou equipamento deve manter, durante a execução de sua atividade
  na

  área de manobras, comunicação bilateral permanente com o órgão ATS, na frequência designada
  pelo

  operador de aeródromo.'
