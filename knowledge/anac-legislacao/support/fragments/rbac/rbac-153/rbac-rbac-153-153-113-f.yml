cite: 153.113(f)
title: 153.113(f)
text: '(f)

  O operador de aeródromo deve estabelecer e documentar requisitos para a área de manobras

  quanto a:

  (1)

  ingresso de veículos, pessoas e aeronaves;

  (2)

  reboque de aeronaves;

  (3)

  comunicação por RTF;

  (4)

  comportamento da movimentação de aeronaves e veículos;

  (5)

  remoção de veículo ou pessoa não-autorizada.'
