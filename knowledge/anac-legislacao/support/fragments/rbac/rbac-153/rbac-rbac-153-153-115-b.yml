title: 153.115(b)
text: '(b) O operador de aeródromo deve estabelecer e documentar requisitos de prevenção de
  incursão

  em pista nas seguintes situações:

  (1)

  acesso, trânsito e permanência de pessoas, veículos e equipamentos na área protegida; e


  Data da emissão: 15 de março de 2021.


  (2)

  acesso e cruzamento de pessoas, veículos e equipamentos na pista de pouso e decolagem

  aberta ao tráfego aéreo.'
