text: '(c) O operador de aeródromo deve garantir que pessoas, veículos e equipamentos aguardem
  para

  o cruzamento ou ingresso em uma pista de pouso e decolagem fora da área protegida.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
