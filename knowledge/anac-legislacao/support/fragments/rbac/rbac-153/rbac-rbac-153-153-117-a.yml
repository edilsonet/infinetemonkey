cite: 153.117(a)
title: 153.117(a)
text: '(a) O operador de aeródromo deve, com o objetivo de garantir a segurança operacional
  e o

  funcionamento das atividades descritas nas seções 153.119 a 153.129 deste Regulamento,

  disponibilizar pessoa(s) que execute(m) a tarefa de supervisão das atividades desenvolvidas
  no(s)

  pátio(s) de estacionamento de aeronaves.'
