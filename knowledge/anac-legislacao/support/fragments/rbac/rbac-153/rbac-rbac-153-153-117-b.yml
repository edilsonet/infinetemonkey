cite: 153.117(b)
title: 153.117(b)
text: '(b) O operador de aeródromo deve manter comunicação permanente com o órgão ATS do

  aeródromo, quando houver, com vistas a manter coordenação das atividades de auxílio ao tráfego
  de

  aeronaves, veículos ou pessoas na área de manobras e demais providências necessárias para
  a

  segurança operacional das atividades.'
