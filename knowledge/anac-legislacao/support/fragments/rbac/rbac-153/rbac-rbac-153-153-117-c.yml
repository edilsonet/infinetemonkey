text: '(c) O operador de aeródromo deve manter supervisão permanente sobre todos os processos
  e

  atividades no(s) pátio(s) de estacionamento de aeronaves, tomando as providências cabíveis
  sempre

  que a segurança operacional for comprometida ou algum regulamento descumprido.'
