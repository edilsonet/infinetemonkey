title: 153.117(d)
text: '(d) O operador de aeródromo deve manter supervisão permanente, quanto a condições

  operacionais e de credenciamento, de todos os veículos e equipamentos que atuem ou trafeguem
  no(s)

  pátio(s) de estacionamento de aeronaves, tomando as providências cabíveis, sempre que a
  segurança

  operacional for comprometida ou algum regulamento descumprido.'
