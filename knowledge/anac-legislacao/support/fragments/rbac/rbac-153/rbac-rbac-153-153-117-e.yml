title: 153.117(e)
text: '(e) O operador de aeródromo deve manter supervisão permanente, quanto ao credenciamento
  e

  à conduta de todas as pessoas que exerçam atividades ou circulem no(s) pátio(s) de estacionamento

  de aeronaves, tomando as providências cabíveis, sempre que a segurança operacional for

  comprometida ou algum regulamento descumprido.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
