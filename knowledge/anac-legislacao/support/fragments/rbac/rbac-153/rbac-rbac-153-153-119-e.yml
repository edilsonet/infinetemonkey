title: 153.119(e)
text: '(e) O operador de aeródromo deve definir, quando houver movimento extraordinário, requisitos

  específicos para processamento de aeronaves maiores que a de referência (aeronave crítica
  de

  projeto), de forma a garantir a distância mínima entre qualquer construção adjacente, aeronave
  em

  posição de estacionamento e outros objetos.'
