title: 153.119(f)
text: '(f)

  O operador de aeródromo deve estabelecer e documentar, em desenho adequado:

  (1)

  as posições de estacionamento existentes no aeródromo;


  Data da emissão: 15 de março de 2021.


  (2)

  os tipos de aeronaves que podem estacionar em cada uma das posições; e

  (3)

  a sinalização horizontal, com cotas que permitam a verificação da conformidade com as

  distâncias mínimas de separação de aeronaves (espaço livre entre as extremidades das aeronaves)

  definidas no parágrafo 154.303(m) do RBAC nº 154.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
