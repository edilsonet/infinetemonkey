title: 153.121(a)
text: '(a) O operador de aeródromo deve assegurar orientação capaz de nortear o correto

  estacionamento da aeronave.

  (1)

  O sinaleiro deve orientar o piloto durante o procedimento de estacionamento, de forma a

  nortear o posicionamento correto da aeronave.'
