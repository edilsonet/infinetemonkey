title: 153.123(a)
text: '(a) Todas as atividades de abordagem à aeronave, antes de seu início, devem aguardar
  a parada

  completa dos motores, o apagamento das luzes anticolisão e a colocação dos calços na aeronave,

  exceto se for essencial à execução da atividade. (Redação dada pela Resolução nº 382, de
  14 de junho

  de 2016)'
