text: '(c) O profissional responsável pela operação da ponte de embarque e desembarque deve

  assegurar que a passarela móvel, quando em sua posição de estacionamento, mantenha as rodas
  dentro

  da zona desobstruída. (Renumerado pela Resolução nº 382, de 14 de junho de 2016)'
