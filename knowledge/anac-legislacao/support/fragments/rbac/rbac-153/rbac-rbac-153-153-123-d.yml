title: 153.123(d)
text: '(d) O profissional responsável pela operação da ponte de embarque e desembarque deve,
  quando

  a ponte não estiver acoplada em uma aeronave, manter a passarela móvel na sua posição de
  origem e

  fechada. (Renumerado pela Resolução nº 382, de 14 de junho de 2016)'
