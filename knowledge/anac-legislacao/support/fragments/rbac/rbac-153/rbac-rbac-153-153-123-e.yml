title: 153.123(e)
text: '(e) O profissional responsável pela operação da ponte de embarque e desembarque deve

  recolher, fechar e travar a passarela fixa da ponte após o seu desacoplamento da aeronave.

  (Renumerado pela Resolução nº 382, de 14 de junho de 2016)'
