title: 153.123(f)
text: '(f)

  O operador de aeródromo deve manter o interior da zona desobstruída da ponte de embarque

  e desembarque livre da presença de veículos, equipamentos e pessoas. (Renumerado pela Resolução

  nº 382, de 14 de junho de 2016)'
