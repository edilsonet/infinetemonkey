cite: 153.125(a)
title: 153.125(a)
text: '(a) O operador de aeródromo deve garantir que antes e durante o procedimento de abastecimento

  ou transferência de combustível de aeronave sejam obedecidos os seguintes requisitos:

  (1)

  é necessário existência de trajetória livre de fuga imediata no solo a partir das saídas
  das


  Data da emissão: 15 de março de 2021.


  aeronaves;

  (2)

  procedimentos de abastecimento ou transferência de combustível de aeronave devem ser

  realizados somente em áreas abertas e ventiladas, fora da vizinhança imediata de equipamentos
  de

  radar em teste ou em uso na aeronave ou nas instalações em terra;

  (3)

  é vedada a realização de procedimento de abastecimento ou transferência de combustível

  de aeronave dentro de hangares ou em áreas fechadas;

  (4)

  é exigida a verificação, pelo responsável pelo procedimento de abastecimento ou

  transferência de combustível de aeronave, da operacionalidade das ligações e aterramentos
  quanto à

  dissipação de energia elétrica estática antes de conectar as linhas de abastecimento;

  (5)

  é vedado o posicionamento do motor do Carro Tanque Abastecedor (CTA) abaixo das

  asas da aeronave em procedimento de abastecimento;

  (6)

  é vedado o uso de lâmpada de flash fotográfico, equipamento de flash eletrônico, isqueiro,

  fósforo e qualquer outra ferramenta que possa produzir faíscas ou arcos voltaicos durante
  a execução

  de procedimento de abastecimento ou transferência de combustível de aeronave no interior
  da área

  delimitada para a posição de estacionamento;

  (7)

  é proibida a instalação ou remoção de baterias da aeronave durante a execução do

  procedimento de abastecimento ou transferência de combustível de aeronave;

  (8)

  unidade auxiliar de energia a bordo (APU) que possua fluxo de exaustão com descarga

  na zona de abastecimento ou transferência de combustível de aeronave deve estar ligada antes
  que as

  tampas dos tanques sejam removidas ou que se façam as conexões das linhas para abastecimento;

  (9)

  APU que pare durante procedimento de abastecimento de aeronave não deve ser religada

  até que o fluxo de combustível cesse e seja efetuada a desconexão das linhas para abastecimento
  e

  fechamento das tampas dos tanques, não havendo riscos de ignição.'
