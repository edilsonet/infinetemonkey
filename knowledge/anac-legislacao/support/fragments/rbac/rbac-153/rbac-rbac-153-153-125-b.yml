title: 153.125(b)
text: '(b) O operador de aeródromo deve assegurar a interrupção das atividades de abastecimento
  ou

  transferência de combustível de aeronave durante a incidência de raios ou tempestades elétricas
  nas

  imediações do aeródromo.'
