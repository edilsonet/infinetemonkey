title: 153.125(d)
text: '(d) O operador de aeródromo e as unidades de abastecimento de aeronaves devem disponibilizar

  material para contenção imediata de derramamentos de combustível em operações de abastecimento

  ou transferência de combustível de aeronave.

  (1)

  O responsável pelo abastecimento de aeronave deve disponibilizar, nas unidades de

  abastecimento de aeronaves, equipamentos extintores portáteis para intervenção inicial em
  caso de

  incêndio em combustível.'
