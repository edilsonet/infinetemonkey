cite: 153.125(e)
title: 153.125(e)
text: '(e) Os profissionais que desempenham procedimento de abastecimento de aeronave devem
  ter

  disponíveis meios de comunicação que permitam, em caso de emergências, o rápido acionamento
  da

  equipe contraincêndio do aeródromo.

  (1)

  Os profissionais que desempenham procedimento de abastecimento ou transferência de

  combustível de aeronave devem acionar a equipe contraincêndio do aeródromo sempre que houver

  princípio de incêndio, independentemente do sucesso obtido na intervenção inicial no local
  da

  emergência.

  (2)

  O responsável pelo abastecimento ou transferência de combustível de aeronave deve

  suspender a execução da atividade quando qualquer parte do trem de pouso da aeronave estiver


  Data da emissão: 15 de março de 2021.


  superaquecido, devendo acionar imediatamente a equipe contraincêndio.

  (3)

  No caso de acionamento de equipe contraincêndio, o procedimento de abastecimento ou

  transferência de combustível de aeronave deve ser reiniciado somente após a liberação do
  local pelo

  responsável pelo atendimento à emergência.'
