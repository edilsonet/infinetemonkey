cite: 153.125(f)
title: 153.125(f)
text: '(f)

  O operador de aeródromo deve garantir que o deslocamento de CTA seja ordenado e

  supervisionado pelo responsável pelo Parque de Abastecimento de Aeronaves (PAA), de forma
  a

  coibir a concentração destes veículos nas áreas próximas ao pátio de aeronaves sem a adoção
  de

  medidas preventivas e de combate a incêndio. (Redação dada pela Resolução nº 382, de 14
  de junho

  de 2016)'
