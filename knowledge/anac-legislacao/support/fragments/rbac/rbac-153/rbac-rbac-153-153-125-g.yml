title: 153.125(g)
text: '(g) O local pertencente à área de movimento destinado ao estacionamento de CTA deve
  ser

  organizado considerando os seguintes aspectos: (Redação dada pela Resolução nº 382, de 14
  de junho

  de 2016)

  (1)

  distância mínima de 3 m (três metros) entre veículos estacionados; (Redação dada pela

  Resolução nº 382, de 14 de junho de 2016)

  (2)

  distância mínima de 15 m (quinze metros) de qualquer construção ou aeronave

  estacionada; (Redação dada pela Resolução nº 382, de 14 de junho de 2016)

  (3)

  área livre de obstáculos (equipamentos e pessoas) para trânsito dos veículos em caso de

  emergência;

  (4)

  contenção do escoamento da água da chuva contendo combustível; e

  (5)

  agrupamento de veículos que somem até 200 m³ (duzentos metros cúbicos) de

  combustível. (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
