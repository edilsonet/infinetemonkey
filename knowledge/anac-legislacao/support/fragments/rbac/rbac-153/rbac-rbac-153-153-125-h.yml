title: 153.125(h)
text: '(h) O local pertencente à área de movimento destinado ao estacionamento de carreta-hidrante

  deve ser organizado sob os seguintes aspectos:

  (1)

  área livre de obstáculos (equipamentos e pessoas) para trânsito dos veículos em caso de

  emergência;

  (2)

  contenção do escoamento da água da chuva contendo combustível.'
