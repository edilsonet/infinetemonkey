title: 153.127(b)
text: '(b) O operador de aeródromo deve atender aos seguintes requisitos quanto ao deslocamento
  de

  passageiros pela área de movimento:

  (1)

  passageiros somente devem atravessar pistas de táxi e vias de serviço quando não houver

  outro modo de realizar o deslocamento;

  (2)

  o trajeto utilizado para o movimento em solo de passageiros deve estar claramente

  estabelecido, visível, sinalizado e com a superfície livre de qualquer obstáculo; e

  (3)

  medidas para proteger os passageiros da sucção e exaustão de motores devem ser

  estabelecidas, inclusive tratando-se de APU. (Redação dada pela Resolução nº 382, de 14
  de junho

  de 2016)'
