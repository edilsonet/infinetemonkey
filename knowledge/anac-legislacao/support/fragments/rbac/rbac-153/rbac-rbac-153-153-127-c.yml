title: 153.127(c)
text: '(c) O operador de aeródromo deve atender aos seguintes requisitos quanto ao processamento
  de

  bagagens, carga aérea e mala postal:

  (1)

  as cargas aéreas, malas postais ou bagagens transportadas devem ser condicionadas de


  Data da emissão: 15 de março de 2021.


  maneira segura para evitar que objetos caiam na área de movimento; e

  (2)

  as cargas aéreas, enquanto não embarcadas ou quando já liberadas, devem ser

  armazenadas em locais apropriados para este fim.'
