title: 153.127(d)
text: '(d) O operador de aeródromo deve observar ainda, quando cabível, os requisitos constantes
  no

  RBAC 175 - “Transporte de artigos perigosos em aeronaves civis” e demais normas que o

  complementem ou o substituam, bem como requisitos de segurança da aviação civil contra atos
  de

  interferência ilícita, definidos em regulamentação específica. (Redação dada pela Resolução
  nº 382,

  de 14 de junho de 2016)'
