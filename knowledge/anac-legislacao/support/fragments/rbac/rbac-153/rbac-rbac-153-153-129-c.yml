title: 153.129(c)
text: '(c) O operador de aeródromo deve assegurar que veículos, equipamentos e pessoas estejam
  a

  uma distância segura de aeronave para que não sofram os efeitos da exaustão de gases provenientes

  dos motores da aeronave quando em manobra.'
