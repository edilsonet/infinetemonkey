cite: 153.13(b)
title: 153.13(b)
text: '(b) O operador de aeródromo pode delegar a terceiros as responsabilidades dispostas
  no

  parágrafo 153.15(a). (Redação dada pela Resolução nº 503, de 07.02.2019)

  (1)

  O operador de aeródromo permanece como responsável solidário nos casos de delegação

  das responsabilidades. (Redação dada pela Resolução nº 503, de 07.02.2019)

  (2)

  O delegatário fica obrigado a observar este Regulamento e normas vigentes como se

  operador fosse, nos limites das atribuições e responsabilidades a ele delegadas.

  (3)

  Ao delegar a operação do SESCINC em aeródromo compartilhado, o operador de

  aeródromo deve observar, além do estabelecido neste Regulamento, a necessidade de coordenação

  operacional com as organizações militares sediadas no mesmo. (Redação dada pela Resolução
  nº 382,

  de 14 de junho de 2016)

  (4)

  Quando o delegatário se tratar de sociedade empresária, a atividade a ser delegada deve

  constar em seu contrato social. O objeto da delegação e a individualização das partes envolvidas

  (delegante e delegatário) devem estar explícitos no instrumento que delegar, no todo ou
  em parte, a

  atividade do operador de aeródromo. (Redação dada pela Resolução nº 382, de 14 de junho
  de 2016)

  (5)

  Quando se tratar de delegação do SESCINC a organizações militares, corpo de

  bombeiros, polícias militares ou guardas municipais, o instrumento formal firmado entre
  o operador

  de aeródromo e tal entidade ou órgão deve ser claro quanto à natureza civil da atividade
  objeto da

  delegação e ao cumprimento dos requisitos determinados neste Regulamento como se operador
  de

  aeródromo fosse. (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
