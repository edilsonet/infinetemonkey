title: 153.131(a)
text: '(a) O operador de aeródromo que opera em condição de baixa visibilidade deve estabelecer
  no

  SOCMS e implementar procedimentos específicos para tal condição, considerando o estabelecido
  na

  seção 153.109 deste Regulamento.'
