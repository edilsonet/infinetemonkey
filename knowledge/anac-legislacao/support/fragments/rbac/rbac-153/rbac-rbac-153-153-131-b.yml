title: 153.131(b)
text: '(b) O operador de aeródromo deve proibir a condução de veículos na área de manobra
  por

  condutores que não possuam treinamento específico para atuar em condição de baixa visibilidade,

  conforme requisitos constantes no parágrafo 153.37(e)(5) deste Regulamento.'
