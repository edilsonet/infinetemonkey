title: 153.131(e)
text: '(e) O operador de aeródromo deve estabelecer e documentar procedimentos específicos
  para

  operação em baixa visibilidade quanto a:

  (1)

  especificação dos padrões de movimentação de aeronaves em solo;

  (2)

  medição e divulgação do RVR e de dados meteorológicos;

  (3)

  definição do momento de início da operação com baixa visibilidade;

  (4)

  fases do processo: preparação, entrada e término;

  (5)

  vistoria de área de movimento para início da operação com baixa visibilidade;

  (6)

  operação de auxílios luminosos e de docagem;

  (7)

  restrições de acesso de veículos, pessoas e atividades.'
