cite: 153.131(f)
title: 153.131(f)
text: '(f)

  O operador de aeródromo deve estabelecer e documentar, em desenho adequado, as rotas

  padronizadas para táxi de aeronaves nas operações de pouso e decolagem e movimentação de

  veículos.


  Data da emissão: 15 de março de 2021.'
