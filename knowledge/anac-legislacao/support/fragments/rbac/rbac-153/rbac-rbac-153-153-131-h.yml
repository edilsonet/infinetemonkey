text: '(h) O operador de aeródromo deve submeter o SOCMS com procedimentos específicos para

  operação em baixa visibilidade, antes de sua entrada em operação, à aceitação e autorização
  da

  ANAC.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
