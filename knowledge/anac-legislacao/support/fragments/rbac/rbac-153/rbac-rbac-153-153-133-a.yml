cite: 153.133(a)
title: 153.133(a)
text: '(a) O operador de aeródromo deve estabelecer e implementar procedimentos de monitoramento

  na área operacional com vistas a identificar condições de perigo para as operações aéreas
  e

  aeroportuárias.

  (1)

  A atividade de monitoramento de obstáculos tem por finalidade identificar violação nas

  superfícies de proteção do aeródromo que possa gerar impacto direto na operação de aeronaves.

  (2)

  A atividade de monitoramento do risco da fauna tem por finalidade a identificação de

  fatores e focos atrativos de animais.

  (3)

  A atividade de monitoramento do sistema de proteção da área operacional tem por

  finalidade identificar falhas no controle de acesso de pessoas e animais na área operacional
  no

  aeródromo.

  (4)

  A atividade de monitoramento da área de movimento tem por finalidade identificar

  situações, pessoas, equipamentos ou veículos que possam gerar impacto direto na operação
  aérea ou

  aeroportuária.

  (5)

  A atividade de monitoramento das posições de estacionamento de aeronaves tem por

  finalidade identificar se as distâncias entre aeronaves estão sendo respeitadas e se os
  procedimentos

  de abordagem de aeronave ou relacionados à movimentação de pessoas, veículos e equipamentos

  estão sendo cumpridos.

  (6)

  A atividade de monitoramento de equipamentos e veículos tem por finalidade a

  identificação de falhas na sua condição física ou de funcionamento, bem como procedimentos

  negligenciados ou omitidos no desenvolvimento das atividades de atendimento em solo.

  (7)

  A atividade de monitoramento de obras ou serviços de manutenção tem por finalidade

  verificar se as atividades estão sendo executados conforme planejado no PESO e identificar
  situações

  que possam pôr em risco a operação de aeronaves.'
