cite: 153.133(c)
title: 153.133(c)
text: '(c) O operador de aeródromo deve estabelecer e documentar requisitos para a execução
  das

  atividades de monitoramento, considerando a finalidade definida no parágrafo 153.133(a),
  os itens

  listados no parágrafo 153.133(b) e outros que julgar necessário, bem como os seguintes aspectos:

  (1)

  programação da atividade de monitoramento, considerando seu horário de realização e

  periodicidade;

  (2)

  realização da atividade de monitoramento, considerando o pessoal envolvido, veículo,

  equipamento, comunicação, percurso e coleta de dados;

  (3)

  estabelecimento da rota a ser seguida durante a atividade de monitoramento;

  (4)

  relação de itens a serem verificados durante a execução da atividade de monitoramento;

  (5)

  armazenamento dos dados coletados em atividade de monitoramento;

  (6)

  distribuição e processamento dos dados coletados durante o monitoramento; e

  (7)

  realização das providências cabíveis.'
