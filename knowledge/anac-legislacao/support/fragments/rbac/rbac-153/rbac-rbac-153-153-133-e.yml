title: 153.133(e)
text: '(e) O operador de aeródromo deve estabelecer monitoramento diário da área de movimento,

  conforme periodicidade definida no Apêndice A deste Regulamento.

  (1)

  Havendo mais de um monitoramento diário, o operador de aeródromo deve estabelecer

  que as atividades de monitoramento ocorram em períodos distintos do dia (manhã, tarde ou
  noite).

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
