title: 153.15(a)
text: '(a) O operador de aeródromo deve designar, por ato próprio, considerando os critérios
  de

  qualificação de que trata o parágrafo 153.15(c):

  (1)

  gestor responsável do aeródromo;

  (2)

  responsável pelo gerenciamento da segurança operacional;

  (3)

  responsável pelas operações aeroportuárias;

  (4)

  responsável pela manutenção do aeródromo; e

  (5)

  responsável pela resposta à emergência aeroportuária.'
