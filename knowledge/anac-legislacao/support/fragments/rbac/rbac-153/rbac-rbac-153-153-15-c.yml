text: '(c) O operador de aeródromo detentor de certificado operacional de acordo com o RBAC
  nº 139

  deve estabelecer e registrar no Manual de Operações do Aeródromo (MOPS):

  (1)

  a representação de sua estrutura organizacional, indicando a relação hierárquica, a


  Data da emissão: 15 de março de 2021.


  correspondência dos cargos às responsabilidades descritas no parágrafo 153.15(a) e os limites
  de

  responsabilidades dos respectivos designados; e

  (2)

  os critérios de qualificação dos responsáveis listados no parágrafo 153.15(a), levando em

  consideração a complexidade da operação aeroportuária.'
