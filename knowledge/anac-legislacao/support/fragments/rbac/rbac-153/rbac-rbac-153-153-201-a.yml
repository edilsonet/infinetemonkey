cite: 153.201(a)
title: 153.201(a)
text: '(a) O operador de aeródromo deve estabelecer e implementar um sistema de manutenção
  de

  toda a infraestrutura aeroportuária, sob sua responsabilidade, que compõe ou está inserida
  na área

  operacional de seu aeródromo, e que seja capaz de:

  (1)

  manter as condições físicas e operacionais dentro dos padrões exigidos neste

  Regulamento e em normas correlatas;

  (2)

  permitir a continuidade das operações aeroportuárias dentro do nível aceitável de

  segurança operacional estabelecido neste Regulamento, no PSOE/ANAC ou normas correlatas.'
