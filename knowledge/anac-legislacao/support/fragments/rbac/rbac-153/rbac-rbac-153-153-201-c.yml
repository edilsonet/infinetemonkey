title: 153.201(c)
text: '(c) Cada programa de manutenção elencado no parágrafo 153.201(b) deve conter processos

  contínuos de:

  (1)

  monitoramento;

  (2)

  manutenção preventiva; e

  (3)

  manutenção corretiva.'
