title: 153.201(f)
text: '(f)

  Quando as finalidades estabelecidas nos parágrafos 153.203(a), 153.205(a), 153.207(a),

  153.211(b), 153.217(a) e 153.219(a) não forem atendidas, o operador de aeródromo deve realizar

  uma avaliação técnica e de segurança operacional, tendo como possíveis ações, sem prejuízo
  de

  aplicação das eventuais sanções previstas no Código Brasileiro de Aeronáutica e nos demais

  regulamentos: (Redação dada pela Resolução nº 382, de 14 de junho de 2016)

  (1)

  mitigação do risco para a garantia da segurança operacional; (Redação dada pela

  Resolução nº 382, de 14 de junho de 2016)

  (2)

  manutenção preventiva e/ou corretiva; (Redação dada pela Resolução nº 382, de 14 de

  junho de 2016)

  (3)

  restrição operacional. (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
