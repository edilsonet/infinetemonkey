cite: 153.203(a)
title: 153.203(a)
text: '(a) O operador de aeródromo deve manter as áreas pavimentadas em condições operacionais

  visando à adequada operação e à proteção de:

  (1)

  aeronaves;

  (2)

  veículos;

  (3)

  pessoas; e

  (4)

  equipamentos aeronáuticos e aeroportuários.'
