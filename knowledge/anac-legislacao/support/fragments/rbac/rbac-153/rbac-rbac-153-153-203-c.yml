title: 153.203(c)
text: '(c) O operador de aeródromo deve estabelecer e documentar requisitos e procedimentos
  de

  monitoramento e avaliação do estado do pavimento baseados em metodologia de sistema de

  gerenciamento de pavimentos, a fim de manter as condições estruturais e funcionais e cumprir
  os

  requisitos estabelecidos nas seções 153.203, 153.205, 153.207, 153.215 e Apêndice C deste

  Regulamento.

  (Redação dada pela Resolução nº 382, de 14.06.2016)'
