title: 153.203(i)
text: '(i)

  O operador de aeródromo deve manter as condições estruturais e funcionais da área

  operacional conforme aceito pela ANAC;

  (ii)

  O operador de aeródromo deve monitorar a funcionalidade do pavimento por meio de

  medições que representem numericamente um índice de serventia da condição geral da superfície
  do

  pavimento da pista de pouso e decolagem, da pista de táxi e do pátio de estacionamento de
  aeronaves;

  (Incluído pela Resolução nº 585, de 15.09.2020)

  (A) O monitoramento deve ser documentado em relatório de medição do índice de

  serventia do pavimento e enviado à ANAC no prazo máximo de 60 (sessenta) dias após a conclusão

  da referida medição. (Incluído pela Resolução nº 585, de 15.09.2020)

  (iii) A medição do índice de serventia do pavimento deve ser realizada conforme

  frequência definida na Tabela 153.203-1; (Incluído pela Resolução nº 585, de 15.09.2020)

