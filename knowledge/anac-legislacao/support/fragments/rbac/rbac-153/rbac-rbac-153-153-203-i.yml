  (iv) O operador de aeródromo deve avaliar a necessidade de medição do índice de serventia

  do pavimento após execução de obra ou serviço de manutenção, levando em consideração a natureza,

  localização e extensão da intervenção; (Redação dada pela Resolução nº 582, de 15.09.2020)'
