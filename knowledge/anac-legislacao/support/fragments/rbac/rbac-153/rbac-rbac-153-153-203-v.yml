text: '(v)

  Em face da frequência anual de pousos, de condições operacionais específicas, do risco

  à segurança operacional ou da necessidade de garantia da segurança operacional, a ANAC pode

  requisitar medições adicionais do índice de serventia ou estabelecer frequência menor que
  a definida

  na Tabela 153.203-1 deste Regulamento. (Redação dada Resolução nº 582, de 15.09.2020)

  (2)

  Defeitos no pavimento:'
