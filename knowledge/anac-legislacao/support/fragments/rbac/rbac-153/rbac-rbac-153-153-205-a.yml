title: 153.205(a)
text: '(a) O operador de aeródromo deve manter a pista de pouso e decolagem em condições

  operacionais visando:

  (1)

  à resistência à derrapagem;

  (2)

  ao controle direcional das aeronaves; e

  (3)

  à integridade dos equipamentos aeronáuticos


  Data da emissão: 15 de março de 2021.'
