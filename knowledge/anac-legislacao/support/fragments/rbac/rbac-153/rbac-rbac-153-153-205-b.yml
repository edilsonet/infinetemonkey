title: 153.205(b)
text: '(b) A exigência prevista no parágrafo 153.205(a) deve compreender os seguintes aspectos:

  (1)

  estrutura e funcionalidade do pavimento;

  (2)

  defeitos no pavimento;

  (3)

  desníveis / depressões / deformações;

  (4)

  irregularidade longitudinal;

  (5)

  atrito;

  (6)

  macrotextura; e

  (7)

  acúmulo de borracha.'
