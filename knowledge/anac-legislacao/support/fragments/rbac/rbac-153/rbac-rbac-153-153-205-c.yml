text: '(c) Estrutura e funcionalidade do pavimento:

  (1)

  Os requisitos referentes à estrutura e funcionalidade do pavimento encontram-se descritos

  no parágrafo 153.203(b)(1).

  (2)

  As ações aplicáveis quando detectada não conformidade estão descritas no parágrafo

  153.201(f).'
