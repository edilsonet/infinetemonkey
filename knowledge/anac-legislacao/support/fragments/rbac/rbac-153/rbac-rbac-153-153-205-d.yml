title: 153.205(d)
text: '(d) Defeitos no pavimento:

  (1)

  Os requisitos referentes a defeitos no revestimento do pavimento e ações de

  monitoramento encontram-se descritos no parágrafo 153.203(b)(2).

  (2)

  As ações aplicáveis quando detectada não conformidade estão descritas no parágrafo

  153.201(f).'
