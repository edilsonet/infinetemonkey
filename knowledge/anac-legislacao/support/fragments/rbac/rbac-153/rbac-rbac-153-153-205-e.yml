title: 153.205(e)
text: '(e) Desníveis / Depressões / Deformações:

  (1)

  O operador de aeródromo deve manter a pista de pouso e decolagem livre de desníveis,

  depressões ou deformações que alterem suas declividades transversais ou longitudinais originais,

  propiciando o acúmulo de água e a perda do controle direcional das aeronaves.

  (2)

  Se a profundidade média de água exceder 3 mm (três milímetros) numa região de 150 m

  (cento e cinquenta metros) de comprimento por 12 m (doze metros) de largura na porção central
  em

  relação ao eixo da pista, o operador de aeródromo deve providenciar ações corretivas na
  referida

  região, a fim de garantir que a pista tenha drenagem suficiente para não acumular água acima
  do valor

  de 3 mm (três milímetros).

  (3)

  As ações aplicáveis quando detectada não conformidade estão descritas no parágrafo

  153.201(f).'
