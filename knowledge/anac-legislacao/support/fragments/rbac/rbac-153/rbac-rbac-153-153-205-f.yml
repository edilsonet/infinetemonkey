title: 153.205(f)
text: '(f)

  Irregularidade longitudinal: (Vide IS nº 153.205-001)

  (1)

  O operador de aeródromo deve monitorar a irregularidade longitudinal do pavimento por

  meio de medições que representem numericamente o desvio da superfície do pavimento em relação

  a um plano de referência.'
