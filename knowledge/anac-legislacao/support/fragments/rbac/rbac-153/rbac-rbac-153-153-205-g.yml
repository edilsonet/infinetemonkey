title: 153.205(g)
text: '(g) Atrito: (Vide IS nº 153.205-001)

  (1)

  O operador de aeródromo deve monitorar o coeficiente de atrito do pavimento por meio

  de medições dinâmicas que representem numericamente o coeficiente de atrito entre pneu e

  pavimento.'
