title: 153.205(h)
text: '(h) Macrotextura: (Vide IS nº 153.205-001)

  (1)

  O operador de aeródromo deve monitorar a profundidade da macrotextura do pavimento

  por meio de medições que representem numericamente a profundidade média da macrotextura
  da

  superfície do pavimento.'
