cite: 153.207(a)
title: 153.207(a)
text: '(a) O operador de aeródromo deve manter pista de táxi e pátio de estacionamento de
  aeronaves

  em condições de segurança operacional visando:

  (1)

  ao controle direcional das aeronaves; e

  (2)

  à integridade dos equipamentos aeronáuticos.'
