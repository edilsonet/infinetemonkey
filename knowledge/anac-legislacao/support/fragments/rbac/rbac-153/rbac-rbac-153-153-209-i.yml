title: 153.209(i)
text: '(i)

  O operador de aeródromo deve manter as vias de circulação de veículos, equipamentos

  e pessoas livre de desníveis, depressões ou deformações que alterem suas declividades transversais

  ou longitudinais originais ou propiciem a perda do controle direcional dos veículos e equipamentos.

  (ii)

  As ações aplicáveis quando detectada não conformidade estão apontadas no parágrafo

  153.201(f). (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
