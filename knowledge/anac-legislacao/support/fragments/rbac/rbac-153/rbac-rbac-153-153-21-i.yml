cite: 153.21(i)
title: 153.21(i)
text: '(i)

  o operador do aeródromo é responsável por todas as etapas que envolvem o

  gerenciamento do risco à segurança operacional consolidada em uma AISO.


  Data da emissão: 15 de março de 2021.


  (5)

  estabelecer, implementar e garantir o funcionamento de um SGSO que garanta a execução

  das atividades do aeródromo dentro dos padrões estabelecidos na Subparte C deste Regulamento
  e no

  PSOE/ANAC;

  (6)

  estabelecer, implantar e manter operacional um SREA adequado ao tipo e ao porte das

  operações aéreas do aeródromo e que atenda aos requisitos constantes nas Subpartes F e G
  deste

  Regulamento; (Redação dada pela Resolução nº 517, de 14.05.2019)

  (7)

  prover treinamento a todo pessoal cuja atividade influencie a segurança operacional, de

  modo a adequar suas atividades às características específicas do aeródromo, conforme estabelecido

  na seção 153.37;

  (8)

  manter o monitoramento da presença de animais no sítio aeroportuário e dos eventos de

  colisão entre fauna e aeronaves, com o objetivo de avaliar a aplicabilidade dos requisitos
  específicos

  para o gerenciamento do risco da fauna em aeródromos; (Redação dada Resolução nº 611, de

  09.03.2021)

  (9)

  monitorar a área operacional de modo a identificar perigos que comprometam a segurança

  das operações aéreas e aeroportuárias;

  (10) implementar ações mitigadoras que garantam a segurança das operações aéreas e

  aeroportuárias;

  (11) comunicar à ANAC qualquer ESO referente ao aeródromo, conforme estabelecido pelo

  PSOE/ANAC e regulamentação vigente;

  (12) elaborar e divulgar procedimentos e requisitos solicitados neste Regulamento que

  constituam o conjunto das atividades essenciais desenvolvidas no aeródromo;

  (13) garantir a prestação dos serviços aeronáuticos e aeroportuários de acordo com a

  infraestrutura e serviços disponíveis;

  (14) informar à ANAC interdição temporária ou desinterdição em seu aeródromo;

  (15) adotar medidas mitigadoras visando manter a área operacional livre da presença de

  pessoas, equipamentos e veículos não autorizados ou que constituam perigo às operações aéreas
  e

  aeroportuárias;

  (16) adotar medidas mitigadoras visando manter a área operacional livre de animais que

  constituam perigo às operações aéreas e aeroportuárias;

  (17) manter a pista de pouso e decolagem livre de obstáculos que comprometam a segurança

  das operações de pouso e decolagem;

  (18) coordenar e fiscalizar a movimentação de veículos, equipamentos e pessoas em solo,
  no

  que diz respeito às regras dispostas neste Regulamento e demais normas vigentes;

  (19) manter a infraestrutura aeroportuária e aeronáutica, sob sua responsabilidade, em

  condições operacionais para a garantia da segurança e regularidade dos serviços disponíveis;

  (20) monitorar as informações do aeródromo divulgadas no AIS e solicitar atualização, quando

  necessário, observando a necessidade de anuência da ANAC nos casos em que se aplique;

  (21) solicitar a divulgação ou cancelamento de uma informação no AIS;

  (22) cumprir as medidas operacionais divulgadas no AIS, monitorar o seu cumprimento por

  parte de operadores aéreos ou aeronavegantes e informar à ANAC a ocorrência de descumprimento;

  (23) garantir a segurança das operações aéreas durante a execução de obra ou serviço de

  manutenção na área operacional;


  Data da emissão: 15 de março de 2021.


  (24) enviar à ANAC as informações a serem divulgadas em decorrência da execução de obra

  ou serviço de manutenção na área operacional.

  (25) garantir a coordenação de pessoal próprio, terceirizado e demais organizações envolvidas

  na execução das atividades operacionais do aeródromo. (Incluído pela Resolução nº 503, de

  07.02.2019)

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
