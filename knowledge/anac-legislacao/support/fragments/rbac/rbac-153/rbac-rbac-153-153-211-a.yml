cite: 153.211(a)
title: 153.211(a)
text: '(a) O operador de aeródromo deve manter as áreas não-pavimentadas situadas na área

  operacional em condições operacionais visando à adequada operação e à proteção de:

  (1)

  aeronaves, veículos e pessoas; e

  (2)

  equipamentos aeronáuticos e aeroportuários.'
