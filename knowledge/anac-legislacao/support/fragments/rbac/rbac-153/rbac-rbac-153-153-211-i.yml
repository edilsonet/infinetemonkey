cite: 153.211(i)
title: 153.211(i)
text: '(i)

  O operador de aeródromo deve manter a superfície das áreas não-pavimentadas

  compactada e estável, de forma a não propiciar o aparecimento de:

  (A) sulcos feitos por aeronaves;

  (B) desprendimento ou acumulação de material na superfície que possa prejudicar o

  controle direcional da aeronave ou a drenagem da superfície; e

  (C) declividade maior que 2:1 entre as bordas da superfície não-pavimentada e o terreno

  existente;'
