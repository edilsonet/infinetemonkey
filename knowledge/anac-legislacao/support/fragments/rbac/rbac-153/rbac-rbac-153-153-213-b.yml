title: 153.213(b)
text: '(b) Quanto à manutenção das áreas verdes por meio do controle da vegetação, o operador
  de

  aeródromo deve ainda atender aos seguintes requisitos:

  (1)

  manter a altura da vegetação da faixa de pista menor ou igual a 15 cm (quinze

  centímetros); ou (Redação dada pela Resolução nº 382, de 14 de junho de 2016)

  (2)

  executar, quando aplicável, as ações referentes ao gerenciamento do risco da fauna,

  conforme requisitos específicos na subparte H. (Redação dada pela Resolução nº 611, de 09.03.2021)'
