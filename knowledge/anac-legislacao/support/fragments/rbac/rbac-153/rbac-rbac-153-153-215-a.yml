title: 153.215(a)
text: '(a) O operador de aeródromo deve manter o sistema de drenagem visando a:

  (1)

  evitar que o acúmulo de água na superfície do sistema de pistas e pátio de estacionamento

  de aeronaves prejudique a segurança das operações aéreas e aeroportuárias; e

  (2)

  não propiciar condições para atração de fauna.


  Data da emissão: 15 de março de 2021.'
