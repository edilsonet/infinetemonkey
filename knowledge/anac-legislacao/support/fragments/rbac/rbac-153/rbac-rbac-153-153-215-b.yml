title: 153.215(b)
text: '(b) O operador de aeródromo deve atender aos requisitos apontados no parágrafo 153.215(a)
  e

  aos seguintes requisitos, quanto ao sistema de drenagem inserido na área operacional:

  (1)

  manter as declividades transversais e longitudinais da área de movimento e de todo

  sistema de drenagem da área operacional;

  (2)

  manter as ranhuras transversais (grooving), quando houver, livres de obstruções que

  possam comprometer as condições de drenabilidade da pista;

  (3)

  manter as tubulações e valas livres de obstruções que possam comprometer as condições

  de drenabilidade;

  (4)

  manter a integridade das estruturas, tubulações e valas revestidas;

  (5)

  manter os equipamentos de recalque, quando houver, em boas condições de

  funcionamento.'
