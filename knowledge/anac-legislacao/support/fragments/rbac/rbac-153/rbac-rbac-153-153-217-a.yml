title: 153.217(a)
text: '(a) O operador de aeródromo deve manter os auxílios visuais em condições operacionais,

  objetivando a visualização, identificação e entendimento do auxílio visual por parte do
  piloto e

  pessoal em solo.

  (1)

  O disposto no parágrafo 153.217(a) não se aplica aos auxílios visuais previstos nos

  parágrafos 154.305(f), 154.305(g), 154.305(h), 154.305(i), 154.305(j), 154.305(k) e 154.305(l)
  do

  pela Resolução nº 382, de 14 de junho de 2016)'
