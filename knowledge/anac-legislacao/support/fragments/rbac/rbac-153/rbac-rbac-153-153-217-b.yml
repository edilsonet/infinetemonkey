title: 153.217(b)
text: '(b) Os auxílios visuais são aqueles descritos conforme requisitos constantes na Subparte
  D e

  Subparte E do RBAC nº 154 e compreendem: (Redação dada pela Resolução nº 382, de 14 de junho

  de 2016)

  (1)

  indicadores e dispositivos de sinalização;

  (2)

  sinalização horizontal;

  (3)

  luzes;

  (4)

  sinalização vertical;

  (5)

  balizas;

  (6)

  indicadores de áreas de uso restrito.'
