title: 153.217(h)
text: '(h) Indicadores de áreas de uso restrito:

  (1)

  O operador de aeródromo deve atender aos requisitos apontados no parágrafo 153.217(a)

  e os indicadores devem ser mantidos de forma a preservar sua integridade física e sua fixação
  no solo.'
