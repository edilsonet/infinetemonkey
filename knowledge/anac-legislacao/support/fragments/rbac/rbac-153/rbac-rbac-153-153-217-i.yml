text: '(i)

  manter homogeneidade de aspecto, definição de contornos e alinhamentos;

  (ii)

  manter a integridade da sinalização horizontal quanto à sua visualização, de forma a


  Data da emissão: 15 de março de 2021.


  não propiciar as seguintes condições:

  (A) em 20 m (vinte metros) consecutivos longitudinais às linhas ou faixas - perda de

  pigmentação da sinalização, desagregação parcial da sinalização ou depósito de material
  não original

  sobre a sinalização, de forma a não permitir sua perfeita visualização, excetuando-se a
  sinalização de

  ponto de visada quanto ao acúmulo de borracha; (Redação dada pela Resolução nº 382, de 14
  de

  junho de 2016)

  (B) em 5 m (cinco metros) consecutivos longitudinais às linhas ou faixas - desagregação

  total da sinalização de forma a não permitir sua perfeita visualização;

  (iii) manter números, letras e sinalização do ponto de visada de forma a ter seu

  entendimento por parte do piloto;

  (iv) manter as ações de manutenção preventiva e recuperação da sinalização horizontal

  conforme especificações e orientações do fabricante do produto aplicado.'
