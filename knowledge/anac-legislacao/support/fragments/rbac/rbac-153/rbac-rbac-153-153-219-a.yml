title: 153.219(a)
text: '(a) O operador de aeródromo deve manter o sistema elétrico em condições operacionais,

  objetivando:

  (1)

  o correto funcionamento de todos os equipamentos alimentados;


  Data da emissão: 15 de março de 2021.


  (2)

  a continuidade da alimentação dos equipamentos essenciais à navegação aérea.'
