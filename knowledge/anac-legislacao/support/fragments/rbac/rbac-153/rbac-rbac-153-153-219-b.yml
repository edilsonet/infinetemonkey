title: 153.219(b)
text: '(b) O sistema elétrico que constitui o escopo desta seção é aquele que alimenta os
  equipamentos

  que auxiliam a navegação aérea, a movimentação de aeronaves e as instalações da Seção

  Contraincêndio (SCI) e, onde existir, do Posto Avançado Contraincêndio (PACI).'
