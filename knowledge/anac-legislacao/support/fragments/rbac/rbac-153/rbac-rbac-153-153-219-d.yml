title: 153.219(d)
text: '(d) O operador de aeródromo deve manter ações de monitoramento e manutenção preventiva

  para os circuitos e componentes dos sistemas elétricos de modo a preservar a eficácia e
  a continuidade

  da energia fornecida.'
