cite: 153.219(i)
title: 153.219(i)
text: '(i)

  atender aos requisitos estabelecidos na Tabela F-1 do RBAC nº 154; e

  (ii)

  garantir a contínua disponibilidade dos recursos do SESCINC mencionados no

  parágrafo 153.425(b) e na seção 153.427;

  (Redação dada pela Resolução nº 517, de 14.05.2019)

  (2)

  manter a efetividade do Sistema de Proteção contra Descargas Atmosféricas (SPDA)

  conforme requisitos estabelecidos no projeto de edificação.'
