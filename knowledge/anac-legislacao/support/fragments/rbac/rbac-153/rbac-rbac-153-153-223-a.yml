title: 153.223(a)
text: '(a) Equipamentos e veículos que atuam na área operacional:

  (1)

  O operador de aeródromo deve manter os equipamentos e veículos que atuam na área

  operacional em condições operacionais, visando à continuidade e à eficácia dos serviços

  aeroportuários.'
