title: 153.223(b)
text: '(b) Traje de Proteção e Equipamento de Proteção Respiratória - TP e EPR:

  (1)

  O operador de aeródromo deve manter os trajes de proteção (TP) e os equipamentos de

  proteção respiratória (EPR) de forma a garantir sua operacionalidade em conformidade com
  os

  requisitos estabelecidos no manual do fabricante.

  (Redação dada pela Resolução nº 517, de 14.05.2019)'
