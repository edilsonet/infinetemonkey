title: 153.223(i)
text: '(i)

  Os equipamentos e veículos que contemplam o programa de manutenção do

  aeródromo são aqueles usados nos serviços exclusivos do operador de aeródromo.

  (ii)

  Os programas de manutenção de serviços terceirizados que utilizem equipamentos ou

  veículos devem estar compatíveis com o programa de manutenção do operador de aeródromo,

  devendo o contratado seguir os requisitos estabelecidos pela ANAC e as regras estabelecidas
  pelo

  operador de aeródromo.

  (2)

  O operador de aeródromo deve atender ao estabelecido no parágrafo 153.223(a)(1) e aos

  seguintes requisitos:'
