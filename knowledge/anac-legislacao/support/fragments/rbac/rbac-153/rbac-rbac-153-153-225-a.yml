cite: 153.225(a)
title: 153.225(a)
text: '(a) O operador de aeródromo deve planejar e executar obras ou serviços de manutenção
  dentro

  da área operacional do aeródromo de modo a manter a segurança das operações aéreas e

  aeroportuárias.

  (1)

  O planejamento da obra ou serviço de manutenção deve contemplar os aspectos do

  gerenciamento de risco, que devem ser consolidados em Procedimentos Específicos de Segurança

  Operacional (PESO).'
