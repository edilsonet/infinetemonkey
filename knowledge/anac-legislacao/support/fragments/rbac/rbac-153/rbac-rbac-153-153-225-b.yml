cite: 153.225(b)
title: 153.225(b)
text: '(b) O operador de aeródromo deve manter:

  (1)

  controle de pessoas e/ou empresas contratadas para execução de obras ou serviços de

  manutenção na área operacional do aeródromo, conforme parágrafo 153.107(c) deste Regulamento;

  (2)

  meios de comunicação permanente entre o pessoal da obra ou serviço de manutenção na

  área operacional e os canais de tráfego aéreo ou aeronaves, conforme parágrafo 153.107(c)
  deste

  Regulamento; e


  Data da emissão: 15 de março de 2021.


  (3)

  a área de movimento sob intervenção, a ser liberada ao tráfego de aeronaves, livre de

  entulho e FOD entre os turnos de trabalho e ao término de obra ou serviço de manutenção.'
