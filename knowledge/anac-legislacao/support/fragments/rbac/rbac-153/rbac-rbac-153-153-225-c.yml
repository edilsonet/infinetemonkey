title: 153.225(c)
text: '(c) O operador de aeródromo deve estabelecer e documentar requisitos capazes de atender
  ao

  parágrafo 153.225(a) quanto a:

  (1)

  critérios para autorização de início da execução de obra ou serviço de manutenção;

  (2)

  divulgação do PESO à comunidade aeroportuária afetada;

  (3)

  limpeza da área onde estiver sendo realizada a obra ou serviço de manutenção;

  (4)

  evacuação do local da obra ou serviço de manutenção em situações de emergência ou a

  pedido do órgão ATS;

  (5)

  suspensão ou impedimento de execução de obra ou serviço de manutenção, quando este

  continuar gerando risco às operações aéreas;

  (6)

  comunicação à comunidade aeroportuária sobre paralisação, prorrogação ou conclusão

  da obra ou serviço de manutenção;

  (7)

  inspeção durante a execução da obra ou serviço de manutenção e antes da reabertura ao

  tráfego.'
