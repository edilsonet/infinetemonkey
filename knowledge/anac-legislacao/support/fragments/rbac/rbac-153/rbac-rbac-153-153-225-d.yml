title: 153.225(d)
text: '(d) O operador de aeródromo deve estabelecer e documentar PESO específico para serviços

  periódicos, como rotina da organização, mantendo as mesmas condições executivas e operacionais

  do aeródromo, quando aplicável.

  (1)

  PESO específicos para serviços periódicos devem estar relacionados com os serviços

  estabelecidos nos programas de manutenção listados na seção 153.201 deste Regulamento.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
