cite: 153.227(a)
title: 153.227(a)
text: '(a) O operador de aeródromo deve, em seu planejamento e execução de obra ou serviço
  de

  manutenção, estabelecer e documentar ações capazes de atender ao parágrafo 153.225(a) por
  meio de

  AISO e PESO quando:

  (1)

  a obra ou serviço de manutenção ocorrer dentro da área operacional;

  (2)

  a obra ou serviço de manutenção afetar a normalidade das operações aéreas.'
