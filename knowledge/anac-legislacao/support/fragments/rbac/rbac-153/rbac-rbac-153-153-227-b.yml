title: 153.227(b)
text: '(b) O conjunto AISO/PESO deve ser enviado à ANAC antes da execução da obra ou serviço
  de

  manutenção nos seguintes casos:

  (1)

  interdição total ou parcial de pista de pouso e decolagem; (Redação dada pela Resolução

  nº 585, de 15.09.2020)

  (2)

  obra ou serviço de manutenção localizado na faixa de pista da pista de pouso e decolagem

  ou na RESA. (Redação dada pela Resolução nº 585, de 15.09.2020)'
