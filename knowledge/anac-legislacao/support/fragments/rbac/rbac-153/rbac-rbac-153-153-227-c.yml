title: 153.227(c)
text: '(c) O operador de aeródromo pode promover ajustes de procedimentos ou novas medidas

  necessárias para a garantia da segurança operacional no decorrer da obra ou serviço de manutenção,

  sem prejuízo do PESO já enviado à ANAC.'
