title: 153.229(a)
text: '(a) O operador de aeródromo deve informar à ANAC, por meio de IOS, a execução de obra
  ou

  serviço de manutenção:

  (1)

  localizados na área de movimento do aeródromo ou áreas de segurança adjacentes, como

  faixa de pista ou RESA, que necessite de interdição, considerando o disposto no parágrafo
  153.225(a);

  (2)

  [Reservado] (Redação dada pela Resolução nº 585, de 15.09.2020)

  (3)

  com alteração no cadastro de aeródromos da ANAC; ou

  (4)

  com necessidade de divulgação no AIS.'
