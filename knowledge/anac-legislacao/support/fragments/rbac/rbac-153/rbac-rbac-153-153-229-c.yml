text: '(c) Um IOS deve conter, no mínimo, as seguintes informações:

  (1)

  descrição da obra ou serviço de manutenção;

  (2)

  local da obra ou serviço de manutenção;

  (3)

  período da obra ou serviço de manutenção, com datas de início e conclusão e horários de

  execução; e

  (4)

  alteração operacional como:'
