title: 153.229(g)
text: '(g) O IOS deve ser protocolado na ANAC antes do início da obra ou serviço de manutenção

  com antecedência suficiente para o planejamento dos operadores aéreos, divulgação no AIS
  e seu

  respectivo processamento pela ANAC.'
