title: 153.229(k)
text: '(k) Em caso de necessidade de execução de obra ou serviço de manutenção emergencial,
  o IOS

  deve ser enviado à ANAC até o segundo dia útil após a data de início nos seguintes casos:

  (1)

  alteração de distâncias declaradas de pista de pouso e decolagem; ou

  (2)

  interdição total ou parcial de pista de pouso e decolagem.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)


  Data da emissão: 15 de março de 2021.'
