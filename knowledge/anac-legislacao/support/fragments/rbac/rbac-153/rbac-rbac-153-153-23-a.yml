title: 153.23(a)
text: '(a) O gestor responsável do aeródromo deve:

  (1)

  Garantir o atendimento a todos os requisitos normativos constantes neste Regulamento e

  nas demais normas vigentes;

  (2)

  manter o aeródromo dentro das condições operacionais e de infraestrutura requeridas

  neste Regulamento e nas demais normas vigentes;

  (3)

  assegurar que o SGSO seja implementado de forma efetiva em todas as áreas da

  organização do operador de aeródromo, em conformidade com os requisitos aplicáveis, de modo

  compatível com o porte e a complexidade das operações;

  (4)

  comunicar a toda organização a importância de conduzir as operações em conformidade

  com os requisitos de segurança operacional aplicáveis;

  (5)

  estabelecer e assinar a política da segurança operacional e comunicar a importância do

  comprometimento de todos os colaboradores com a referida política, assegurando que ela permaneça

  adequada ao operador de aeródromo;

  (6)

  assegurar a disponibilidade dos recursos necessários para garantir o alcance dos objetivos

  da segurança operacional e para a gestão do SGSO;

  (7)

  assegurar que as tomadas de decisão dos demais gestores sejam orientadas por um

  processo institucionalizado de avaliação de riscos, considerando os impactos potenciais
  de suas

  decisões para a segurança operacional;

  (8)

  conduzir análises críticas da gestão do SGSO, visando assegurar a melhoria contínua do

  sistema;

  (9)

  rever regularmente o desempenho de segurança operacional do operador de aeródromo,

  e tomar as medidas necessárias para tratamento de eventual desempenho insatisfatório de
  segurança

  operacional;

  (10) assegurar que as prerrogativas e responsabilidades acerca do gerenciamento da segurança

  operacional sejam clara e objetivamente estabelecidas e comunicadas em todas as áreas da

  organização do operador de aeródromo;

  (11) assegurar que todo o pessoal da organização envolvido em atividades com impacto na

  segurança operacional cumpra com os requisitos aplicáveis e critérios internos de competência,

  experiência e treinamento para o exercício de suas prerrogativas e responsabilidades;

  (12) assegurar que os objetivos da segurança operacional sejam estabelecidos, e que sejam

  mensuráveis e alinhados com a política da segurança operacional;

  (13) assegurar que planos estratégicos, sistemas, manuais e demais documentos normativos

  internos relativos à gestão do SGSO sejam aprovados pelos gestores competentes;

  (14) assegurar que sejam estabelecidos mecanismos eficazes de comunicação interna e com
  as

  autoridades, com relação ao desempenho e melhoria contínua do SGSO; e


  Data da emissão: 15 de março de 2021.


  (15) assegurar a integridade e o desempenho do SGSO, em face de mudanças internas (na

  organização ou no SGSO) ou mudanças externas que tenham impactos potenciais sobre a operação

  do operador de aeródromo.'
