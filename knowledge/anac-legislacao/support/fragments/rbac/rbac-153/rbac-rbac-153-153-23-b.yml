title: 153.23(b)
text: '(b) São prerrogativas do gestor responsável do aeródromo, sem prejuízo de outras definidas
  pelo

  operador de aeródromo:

  (1)

  possuir a autoridade final sobre as operações conduzidas sob os regulamentos aplicáveis

  ao operador de aeródromo;

  (2)

  decidir sobre a alocação de recursos humanos, financeiros e técnicos do aeródromo; e

  (3)

  prestar contas pelo desempenho de segurança operacional do operador de aeródromo.

  (Redação dada pela Resolução nº 503, de 07.02.2019)'
