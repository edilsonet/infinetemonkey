cite: 153.25(a)
title: 153.25(a)
text: '(a) O responsável pelo gerenciamento da segurança operacional deve:

  (1)

  coordenar a implementação, manutenção e integração do SGSO em todas as áreas da

  organização do operador de aeródromo, em conformidade com os requisitos aplicáveis e padrões

  estabelecidos pelo operador de aeródromo;

  (2)

  prover os recursos técnicos para a identificação de perigos e a análise de riscos à

  segurança operacional, incluindo os perigos e os riscos provenientes da fauna; (Redação
  dada

  Resolução nº 611, de 09.03.2021)

  (3)

  monitorar a efetividade dos controles de risco à segurança operacional, incluindo o

  controle de risco específico proveniente da fauna; (Redação dada Resolução nº 611, de 09.03.2021)

  (4)

  formalizar junto ao gestor responsável do aeródromo a necessidade de alocação de

  recursos demandados para implementação, manutenção e melhoria contínua do SGSO;

  (5)

  planejar e facilitar a promoção da segurança operacional em todas as áreas da organização

  do operador de aeródromo;

  (6)

  relatar regularmente ao gestor responsável do aeródromo sobre o desempenho do SGSO

  e qualquer necessidade de melhoria; e

  (7)

  assessorar o gestor responsável do aeródromo no exercício de suas responsabilidades

  relacionadas ao gerenciamento da segurança operacional, fornecendo subsídios para a tomada
  de

  decisões.'
