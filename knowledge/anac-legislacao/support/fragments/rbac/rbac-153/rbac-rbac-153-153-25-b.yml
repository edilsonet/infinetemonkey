title: 153.25(b)
text: '(b) São prerrogativas do responsável pelo gerenciamento da segurança operacional, sem

  prejuízo de outras definidas pelo operador de aeródromo:

  (1)

  ter acesso direto ao gestor do aeródromo; e

  (2)

  ter acesso aos dados e informações de segurança operacional necessários ao exercício das

  responsabilidades citadas na seção 153.25.

  (Redação dada pela Resolução nº 503, de 07.02.2019)'
