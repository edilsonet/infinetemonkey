title: 153.29(a)
text: '(a) O responsável pela manutenção aeroportuária deve:

  (1)

  manter as atividades em conformidade com os requisitos estabelecidos na Subparte E

  deste Regulamento;

  (2)

  assessorar o gestor responsável do aeródromo no processo de identificação de perigos,

  análise e gerenciamento de risco; (Redação dada pela Resolução nº 503, de 07.02.2019)

  (3)

  propor ações para eliminar ou mitigar risco relacionado a perigo identificado;

  (4)

  executar ações que garantam a segurança das operações aéreas e aeroportuárias. (Redação

  dada pela Resolução nº 382, de 14 de junho de 2016)'
