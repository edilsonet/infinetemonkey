cite: 153.301(c)
title: 153.301(c)
text: '(c) O SREA inclui:

  (1)

  os elementos do sistema (setores, órgãos, entidades e empresas);

  (2)

  os recursos humanos necessários e capacitados;

  (3)

  os recursos de infraestrutura e materiais necessários para a resposta às emergências

  aeroportuárias;

  (4)

  a definição de abrangência, atribuição de responsabilidades e procedimentos para cada

  tipo de emergência referente aos participantes do sistema;

  (5)

  a elaboração de planos e manuais que consolidem o planejamento das ações atribuídas a

  cada elemento do sistema; e

  (6)

  a utilização de mecanismos de autoavaliação e melhoria contínua do sistema.'
