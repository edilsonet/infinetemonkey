title: 153.301(d)
text: '(d) O SREA deve prever as seguintes emergências aeroportuárias:

  (1)

  ocorrências com aeronaves nas condições de urgência e socorro, dentro e fora da área

  patrimonial do aeródromo;

  (2)

  ocorrências com aeronaves em áreas aquáticas, pantanosas ou de difícil acesso que se

  encontrem a até mil metros de qualquer cabeceira de pista de pouso e decolagem; (Redação
  dada pela

  Resolução nº 517, de 14.05.2019)

  (3)

  emergências médicas em geral;

  (4)

  ocorrências com artigos perigosos;

  (5)

  incêndios florestais ou em áreas de cobertura vegetal próxima ao aeródromo que, de

  alguma forma, interfiram na segurança das operações aéreas, onde aplicável;

  (6)

  incêndios no terminal aeroportuário ou em outras instalações de infraestrutura

  aeroportuária;

  (7)

  desastres naturais passíveis de ocorrência na região onde o aeródromo está localizado; e

  (8)

  outras emergências, a critério do operador de aeródromo.'
