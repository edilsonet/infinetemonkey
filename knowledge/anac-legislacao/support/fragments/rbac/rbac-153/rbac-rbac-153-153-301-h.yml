title: 153.301(h)
text: '(h) O operador de aeródromo deve observar os princípios de fatores humanos para fins
  de

  mitigação de efeitos psicológicos negativos decorrentes de um acidente aeronáutico, com
  foco nos

  profissionais que, direta ou indiretamente, estejam envolvidos nas ações de resposta às
  emergências

  aeroportuárias'
