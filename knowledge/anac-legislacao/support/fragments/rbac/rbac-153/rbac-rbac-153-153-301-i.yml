title: 153.301(i)
text: '(i)

  O operador de aeródromo deve garantir que todos os elementos do SREA tenham acesso às

  informações, procedimentos e responsabilidades estabelecidos para todos os elementos do
  sistema.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
