title: 153.309(a)
text: '(a) O operador de aeródromo deve prover ambulância(s) para estabilização e remoção
  das

  vítimas de uma emergência aeroportuária.

  (1)

  A condução da(s) ambulância(s) deve ser efetuada por pessoal habilitado e capacitado,

  em conformidade com as normas nacionais de trânsito.

  (2)

  A tripulação mínima da(s) ambulância(s) deve obedecer às normas do Ministério da

  Saúde e da Agência Nacional de Vigilância Sanitária (ANVISA).

  (3)

  As características técnicas e operacionais da(s) ambulância(s) devem obedecer às normas

  do Ministério da Saúde e da Agência Nacional de Vigilância Sanitária (ANVISA).

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
