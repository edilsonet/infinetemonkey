cite: 153.31(a)
title: 153.31(a)
text: '(a) O responsável pela resposta à emergência aeroportuária deve:

  (1)

  manter as atividades em conformidade com os requisitos estabelecidos nas Subpartes F e

  G deste Regulamento; (Redação dada pela Resolução nº 517, de 14.05.2019)

  (2)

  assessorar o gestor responsável do aeródromo no processo de identificação de perigos,

  análise e gerenciamento de risco; (Redação dada pela Resolução nº 503, de 07.02.2019)

  (3)

  propor ações para eliminar ou mitigar risco relacionado a perigo identificado;

  (4)

  executar ações que garantam a segurança das operações aéreas e aeroportuárias.'
