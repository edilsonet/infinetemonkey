cite: 153.311(a)
title: 153.311(a)
text: '(a) O COE deve fazer parte da infraestrutura do aeródromo, não podendo ter sua estrutura
  física

  compartilhada com outras áreas operacionais, quando ativado.

  (1)

  O COE deve ser ativado sempre que acionados os procedimentos previstos no PLEM do

  aeródromo.

  (2)

  O operador de aeródromo deve definir previamente a composição do COE.

  (3)

  A composição do COE deve prever a atuação de, no mínimo, um profissional da área de

  resposta à emergência aeroportuária.'
