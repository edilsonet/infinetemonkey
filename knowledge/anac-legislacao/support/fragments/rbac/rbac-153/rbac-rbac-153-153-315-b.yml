cite: 153.315(b)
title: 153.315(b)
text: '(b) Os recursos externos que devem ser considerados pelo operador de aeródromo, quando

  disponíveis num raio de 8 km (oito quilômetros) em torno do ARP ou, quando não designado,
  do

  centro geométrico da pista de pouso e decolagem, são no mínimo:

  (1)

  Bombeiros Urbanos;

  (2)

  Polícia;

  (3)

  Hospitais e postos de atendimento médico disponíveis na localidade para atendimento a

  feridos provenientes de emergências aeroportuárias;

  (4)

  Serviço público de remoção e pronto atendimento a emergências médicas;

  (5)

  Instituto Médico Legal (IML);

  (6)

  Defesa Civil;

  (7)

  Autoridades de trânsito; e

  (8)

  Helipontos.'
