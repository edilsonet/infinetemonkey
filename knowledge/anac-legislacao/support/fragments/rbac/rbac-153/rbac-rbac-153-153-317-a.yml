title: 153.317(a)
text: '(a) O operador de aeródromo deve elaborar e disponibilizar mapa de grade interno que
  contenha,

  no mínimo, as seguintes informações:

  (1)

  sistema quadriculado de coordenadas alfanuméricas;

  (2)

  ponto de encontro dos órgãos envolvidos na resposta às emergências aeroportuárias;

  (3)

  localização da SCI e do PACI, onde requerido;

  (4)

  portões e rotas para acesso dos recursos externos;

  (5)

  posicionamento padrão dos CCI e veículos de apoio às operações do SESCINC (onde

  requerido) para cada uma das cabeceiras em acionamentos do SESCINC; e

  (6)

  cabeçalho (título), data de revisão do mapa e legenda.'
