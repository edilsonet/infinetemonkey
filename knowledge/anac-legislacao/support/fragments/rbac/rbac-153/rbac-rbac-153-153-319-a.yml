cite: 153.319(a)
title: 153.319(a)
text: '(a) O operador de aeródromo deve elaborar e disponibilizar mapa de grade externo que
  abranja

  um raio de 8 km (oito quilômetros) em torno do ARP ou, quando não designado, do centro geométrico

  da pista de pouso e decolagem e que contenha as seguintes informações:

  (1)

  sistema quadriculado de coordenadas alfanuméricas;

  (2)

  área de atuação do SESCINC;

  (3)

  perímetro do sítio aeroportuário;


  Data da emissão: 15 de março de 2021.


  (4)

  cursos d’água e áreas pantanosas;

  (5)

  fontes alternativas de água localizadas na área de abrangência;

  (6)

  vias de acesso ao aeródromo;

  (7)

  localização de recursos externos, em especial bombeiros urbanos, hospitais e helipontos;

  (8)

  cabeçalho (título), data de revisão do mapa e legenda.'
