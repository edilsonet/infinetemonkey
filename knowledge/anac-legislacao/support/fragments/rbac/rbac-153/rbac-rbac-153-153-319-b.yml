title: 153.319(b)
text: '(b) O mapa de grade externo deve ser elaborado em escala adequada à visualização das

  informações nele contidas e permitir fácil manuseio por seus usuários.

  (1)

  A dimensão mínima para mapas de grade é de tamanho A3.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
