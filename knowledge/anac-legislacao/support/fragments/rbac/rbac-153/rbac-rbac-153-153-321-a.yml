title: 153.321(a)
text: '(a) O operador de aeródromo deve manter cópia atualizada dos mapas de grade nos seguintes

  locais:

  (1)

  órgão ATS, onde houver;

  (2)

  COE;

  (3)

  Sala de Comunicação da SCI e PACI, onde requerido;

  (4)

  PCM;

  (5)

  unidade militar, no caso de aeródromos compartilhados;

  (6)

  recursos externos;

  (7)

  veículos do SESCINC; e (Redação dada pela Resolução nº 517, de 14.05.2019)

  (8)

  outros veículos de apoio à emergência aeroportuária, onde requerido.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
