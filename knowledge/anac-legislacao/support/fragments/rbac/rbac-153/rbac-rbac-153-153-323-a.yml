title: 153.323(a)
text: '(a) O PLEM e o PCINC devem ser mantidos atualizados pelo operador de aeródromo e devem

  ser revisados a critério da ANAC ou sempre que houver:

  (1)

  realização de um módulo do ESEA, onde seja constatada a necessidade de adequação;

  (2)

  emergência que tenha requerido a ativação do SREA, onde seja constatada a necessidade

  de adequação;

  (3)

  alteração significativa nas características físicas ou operacionais do aeródromo;

  (4)

  alteração de CAT; (Redação dada pela Resolução nº 517, de 14.05.2019)

  (5)

  alteração de classe do aeródromo, conforme definido na seção 153.7; e

  (6)

  alterações significativas no SESCINC do aeródromo;'
