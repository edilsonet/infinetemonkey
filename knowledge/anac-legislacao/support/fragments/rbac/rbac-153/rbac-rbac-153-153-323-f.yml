title: 153.323(f)
text: '(f)

  Nos aeródromos compartilhados, o operador de aeródromo deve consultar formalmente a

  unidade militar para elaboração do PLEM e do PCINC.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
