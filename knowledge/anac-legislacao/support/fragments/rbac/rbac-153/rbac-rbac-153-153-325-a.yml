cite: 153.325(a)
title: 153.325(a)
text: '(a) O operador de aeródromo deve considerar o seguinte conteúdo mínimo no PLEM:

  (1)

  tipos de emergências abordadas no plano, conforme 153.301(d);

  (2)

  lista dos elementos envolvidos no planejamento de emergência aeroportuária, sejam tais

  elementos pertencentes ou não à estrutura organizacional do operador de aeródromo;

  (3)

  relação de telefones dos elementos envolvidos, direta ou indiretamente, no atendimento

  às emergências aeroportuárias;

  (4)

  responsabilidades e ações de cada elemento envolvido para cada tipo de emergência

  aeroportuária prevista;

  (5)

  mapas de grade interno e externo, conforme estabelecido nas seções 155.317 e 155.319,

  respectivamente;

  (6)

  fluxogramas de acionamento específicos para cada tipo de emergência aeroportuária

  prevista no aeródromo e a forma de acionamento de cada recurso a qualquer hora;

  (7)

  identificação e contato do responsável designado pelo operador de aeródromo para

  coordenação das ações descritas no PLEM;

  (8)

  Procedimentos de Remoção de Aeronaves Inoperantes e Desinterdição de Pista (PRAI),

  com o seguinte conteúdo mínimo:'
