cite: 153.325(b)
title: 153.325(b)
text: '(b) O operador de aeródromo deve publicar no Serviço de Informações Aeronáuticas, em

  conformidade com o PRAI:


  Data da emissão: 15 de março de 2021.


  (1)

  a capacidade do aeródromo para remoção de aeronaves inoperantes, expresso em termos

  do modelo e peso da maior aeronave que o aeródromo está equipado para remover; e

  (2)

  os contatos para acionamento do responsável designado pelo operador de aeródromo para

  coordenação das ações descritas no PRAI.'
