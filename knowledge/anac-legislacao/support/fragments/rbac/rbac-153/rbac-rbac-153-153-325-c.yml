title: 153.325(c)
text: '(c) O operador de aeródromo deve garantir que a remoção de aeronave acidentada, seus

  destroços e objetos por ela transportados ocorra somente após prévia liberação pelo responsável
  pela

  investigação SIPAER, quando aplicável tal liberação.

  (1)

  A remoção de aeronave acidentada, seus destroços e objetos por ela transportados é

  permitida, sem prévia liberação do responsável pela investigação SIPAER, quando necessária
  para

  salvar vidas, preservar a segurança de pessoas ou preservar evidências.

  (Incluído pela Resolução nº 382, de 14 de junho de 2016)'
