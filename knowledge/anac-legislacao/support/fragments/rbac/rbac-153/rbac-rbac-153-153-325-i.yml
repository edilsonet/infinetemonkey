title: 153.325(i)
text: '(i)

  procedimentos e prazos estimados para desinterdição de pista, quando não envolvidas

  aeronaves;

  (ii)

  procedimentos e prazos estimados para a remoção de aeronave inoperante;

  (A) O operador de aeródromo, ao estabelecer o prazo para a remoção de aeronave

  inoperante, deve considerar o impacto à segurança das operações aéreas no aeródromo e os
  aspectos

  econômicos associados à descontinuidade daquelas operações.

  (B) O operador de aeródromo deve detalhar as ações previstas e seus tempos estimados,

  de forma a que possa ser determinado o prazo total estimado.

  (iii) a relação dos equipamentos disponíveis no aeródromo ou em suas adjacências para

  remoção de aeronaves, sua localização, a empresa detentora, a capacidade dos equipamentos
  e os

  contatos para acionamento dos seus responsáveis a qualquer hora;

  (iv) a relação das empresas aéreas que operam no aeródromo e das demais empresas que

  prestam serviços de rampa no aeródromo, com os contatos para acionamento dos seus responsáveis
  a

  qualquer hora; e'
