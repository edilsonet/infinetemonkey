cite: 153.329(i)
title: 153.329(i)
text: '(i)

  área de atuação do SESCINC, que deve abranger, no mínimo, a área operacional do

  aeródromo; (Redação dada pela Resolução nº 517, de 14.05.2019)

  (ii)

  descrição das condições geográficas do sítio aeroportuário e de seu entorno, dentro da

  área de atuação do SESCINC, tais como:

  (A) características do terreno;

  (B) existência de acidentes geográficos;

  (C) áreas de difícil acesso para os CCI e demais veículos de apoio às operações do

  SESCINC; e

  (D) relação das instalações do aeródromo a serem protegidas pelo SESCINC e os

  principais riscos de incêndio identificados na mesma.

  (iii) relação das principais aeronaves que operam no aeródromo com as seguintes

  informações:

  (A) modelo;

  (B) categoria contraincêndio da aeronave (CAT AV); (Redação dada pela Resolução nº

  517, de 14.05.2019)

  (C) comprimento e largura máxima da fuselagem;

  (D) quantidade máxima de passageiros transportados;

  (E)

  quantidade de tripulantes;

  (F)

  quantidade de saídas de emergência;

  (G) quantidade máxima de combustível transportado; e

  (H) desenho adequado com a indicação das saídas de emergência da aeronave.

  (2)

  procedimentos operacionais para a atuação da equipe de serviço do SESCINC nas

  seguintes situações:


  Data da emissão: 15 de março de 2021.'
