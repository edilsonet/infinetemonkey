title: 153.329(v)
text: '(v)

  incêndios ou vazamentos de combustíveis no PAA (onde houver), em operações de

  reabastecimento ou durante transporte no lado ar);

  (vi) ocorrências com artigos perigosos;

  (vii) remoção de animais e dispersão de avifauna (quando aplicável);

  (viii) iluminação de emergência em pista de pouso e decolagem (quando este procedimento

  for estabelecido pelo operador de aeródromo);

  (ix) condições de baixa visibilidade (quando aplicável);'
