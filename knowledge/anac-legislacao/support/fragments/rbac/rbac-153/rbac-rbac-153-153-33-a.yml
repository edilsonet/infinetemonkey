cite: 153.33(a)
title: 153.33(a)
text: '(a) Em aeródromo onde não exista órgão ATS, a distribuição de responsabilidades durante
  a

  movimentação de aeronave em solo deve se dar como descrito a seguir: (Redação dada pela

  Resolução nº 382, de 14 de junho de 2016)

  (1)

  em procedimentos de partida de aeronave, o operador de aeródromo é o responsável pela

  liberação da saída da aeronave da posição de estacionamento e orientação de sua movimentação
  até

  seu alinhamento com a pista de rolagem para saída por meios próprios, a partir da qual a

  responsabilidade cabe ao operador da aeronave;

  (2)

  em procedimentos de chegada de aeronave, o operador da aeronave é o responsável pela

  movimentação da aeronave na área de manobras até o seu alinhamento com a posição de

  estacionamento, a partir da qual sua orientação é de responsabilidade do operador de aeródromo.'
