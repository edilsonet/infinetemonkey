title: 153.331(c)
text: '(c) O ESEA é dividido nos seguintes módulos:

  (1)

  COE;

  (2)

  Comunicação e Alarmes;

  (3)

  Ferramentas de Suporte;

  (4)

  PCM;

  (5)

  Recursos Externos e Internos;

  (6)

  Remoção de Vítimas;

  (7)

  CVE (onde houver);

  (8)

  PCINC (onde houver SESCINC);

  (9)

  Salvamento Aquático (onde aplicável);

  (10) PRAI;

  (11) PAFAVIDA (onde houver serviço de transporte aéreo público); e

  (12) Exercício Completo (onde aplicável).


  Data da emissão: 15 de março de 2021.'
