text: '(e) Os exercícios simulados envolvendo recursos externos devem ser precedidos de reuniões
  de

  planejamento com a participação de todos os entes envolvidos.

  (1)

  Devem ser produzidas atas formais caracterizando o conteúdo das reuniões de

  planejamento.'
