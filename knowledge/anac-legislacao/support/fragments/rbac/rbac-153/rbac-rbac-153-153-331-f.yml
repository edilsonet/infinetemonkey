title: 153.331(f)
text: '(f)

  O operador de aeródromo deve elaborar relatório final de avaliação de cada módulo do

  ESEA, registrando o resultado das avaliações em formulário próprio, que deverá estar disponível
  no

  aeródromo para consulta em inspeções ou para envio à ANAC, caso solicitado.'
