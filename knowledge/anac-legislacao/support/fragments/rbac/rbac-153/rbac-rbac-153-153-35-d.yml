title: 153.35(d)
text: '(d) A Identificação do Perigo da Fauna - IPF deve ser conduzida por qualquer profissional
  com

  graduação ou pós-graduação em área ambiental, cujo conselho profissional o habilite a lidar
  com a

  fauna silvestre e doméstica. (Incluído pela Resolução nº 611, de 09.03.2021)

  (Redação dada pela Resolução nº 503, de 07.02.2019)'
