title: 153.37(a)
text: '(a) O operador de aeródromo deve estabelecer e implementar treinamentos voltados à
  segurança

  das operações de solo para os profissionais que trabalham na área operacional do aeródromo
  ou em

  atividades relacionadas com a segurança operacional.'
