cite: 153.37(b)
title: 153.37(b)
text: '(b) Os treinamentos devem ser estruturados em um PISOA e possuir as seguintes características:

  (1)

  estar vinculados, como condicionante, a cada tipo de credenciamento do aeródromo;

  (2)

  ter previsão de atualização técnica ou validade específica;

  (3)

  ser adequados e estabelecidos, em seu conteúdo programático, aos diversos públicos-alvo

  que o aeródromo possa ter.'
