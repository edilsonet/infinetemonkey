title: 153.37(c)
text: '(c) Os treinamentos devem ter como objetivos:

  (1)

  a adequação das atividades desenvolvidas às características específicas do aeródromo

  (físicas e operacionais); e

  (2)

  a segurança operacional das atividades desenvolvidas na área operacional.'
