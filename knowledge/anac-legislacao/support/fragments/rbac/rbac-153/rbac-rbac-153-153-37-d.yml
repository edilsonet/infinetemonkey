title: 153.37(d)
text: '(d) O PISOA deve conter os treinamentos listados abaixo:

  (1)

  Treinamento geral;

  (2)

  Treinamento básico para a segurança operacional;

  (3)

  Treinamento para condução de veículos na área operacional;

  (4)

  Treinamento para acesso e permanência na área de manobras;

  (5)

  Treinamento para operações em baixa visibilidade, onde aplicável;

  (6)

  Treinamento recorrente para bombeiros de aeródromo (PTR-BA);

  (7)

  Treinamento básico para operações; e

  (8)

  Treinamento para o gerenciamento do risco da fauna. (Incluído pela Resolução nº 611,

  de 09.03.2021)'
