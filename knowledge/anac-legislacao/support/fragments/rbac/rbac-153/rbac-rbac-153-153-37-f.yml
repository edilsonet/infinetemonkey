cite: 153.37(f)
title: 153.37(f)
text: '(f)

  O operador de aeródromo deve realizar periodicamente levantamento das necessidades de

  treinamento para o pessoal envolvido com atividades relacionadas à segurança operacional,

  descrevendo no PISOA como é realizado esse levantamento, devendo os currículos dos treinamentos

  serem apropriados às funções de cada profissional no SGSO.

  (1)

  Os demais conteúdos do PISOA devem ser definidos pelo operador de aeródromo,

  conforme resultados do levantamento periódico das necessidades de qualificação e treinamento,


  Data da emissão: 15 de março de 2021.


  sendo apropriados às funções de cada profissional no SGSO.'
