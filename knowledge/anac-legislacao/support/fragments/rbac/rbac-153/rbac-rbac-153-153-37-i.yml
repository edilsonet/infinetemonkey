title: 153.37(i)
text: '(i)

  O PTR-BA deve contemplar:

  (A) atividades planejadas para cada membro de sua equipe de serviço nas diversas

  situações de emergência, incluindo as caracterizadas no PLEM e no PCINC, pelo menos uma
  vez a

  cada 6 (seis) meses;

  (B) atividades voltadas à manutenção do condicionamento físico dos profissionais em

  atividade no SESCINC;

  (C) para os Bombeiros de Aeródromos Classe IV, para o ano seguinte ao da aprovação

  em Curso de Habilitação ou em Curso de Atualização, a realização dos exercícios práticos
  previstos

  no “Módulo Resgate e Combate a Incêndio em Aeronaves” do “Curso de Atualização para Bombeiro

  de Aeródromo” em área que atenda ao disposto no item 6.3.2.1 do Apêndice do Anexo à Resolução

  nº 279.

  (ii)

  O PTR-BA deve reservar pelo menos 16 (dezesseis) horas mensais para o treinamento

  disposto em 153.37(e)(6)(i)(A) aos profissionais no exercício das funções do SESCINC relacionadas

  nos parágrafos 153.415(a)(1) a 153.415(a)(5).

  (iii) O operador do aeródromo deve promover, anualmente, avaliação do condicionamento

  físico (aeróbico e anaeróbico) dos profissionais em exercício das funções relacionadas nos
  parágrafos

  153.415(a)(1) a 153.415(a)(5).

  (iv) O operador de aeródromo deve manter os registros de todos os treinamentos do PTR-

  BA e da avaliação mencionada em 153.37(e)(6)(iii).

  (Redação dada pela Resolução nº 517, de 14.05.2019)

  (7)

  O treinamento básico para operações deve ser ministrado aos profissionais que irão atuar

  na área operacional, que executem tarefas de supervisão das atividades desenvolvidas em
  pátio de

  aeronaves, conforme o seção 153.117 e atividades de monitoramento das condições do aeródromo,

  conforme o seção 153.133, abordando os seguintes conteúdos, adequados às características
  físicas e

  operacionais de cada aeródromo:'
