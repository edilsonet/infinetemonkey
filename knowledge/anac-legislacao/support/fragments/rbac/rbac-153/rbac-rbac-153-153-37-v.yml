text: '(v)

  aplicação segura de métodos para afugentamento de aves e outros animais;

  (vi)

  aplicação segura de métodos para a remoção de animais da área operacional; e

  (vii)

  aplicação segura de métodos para o recolhimento e identificação de carcaças e

  animais em decomposição.

  (Incluído pela Resolução nº 611, de 09.03.2021)'
