title: 153.39(a)
text: '(a) O operador de aeródromo deve manter sob sua posse, pelo período mínimo de 05 (cinco)

  anos, toda documentação exigida neste Regulamento e demais documentos recebidos ou enviados
  à

  Agência.

  (1)

  Caso haja prazo regulamentar diferenciado para documentos específicos, este prevalecerá

  sobre o período estabelecido no parágrafo 153.39(a).

  (2)

  Os documentos exigidos neste regulamento, quando enviados à ANAC, devem ser

  acompanhados de arquivo eletrônico que permita a extração do texto.

  (3)

  Revisões, atualizações e emendas dos documentos devem possuir controle das alterações.'
