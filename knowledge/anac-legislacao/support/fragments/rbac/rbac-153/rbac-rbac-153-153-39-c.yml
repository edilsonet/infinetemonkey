cite: 153.39(c)
title: 153.39(c)
text: '(c) O operador de aeródromo deve manter nas dependências do aeródromo toda a documentação

  referente aos itens listados a seguir:

  (1)

  constituição legal do sítio aeroportuário e do operador de aeródromo;

  (2)

  contratos celebrados com terceiros;

  (3)

  instrumentos de delegação, total ou parcial, em que o operador de aeródromo atue em um

  dos polos (delegante ou delegatário) e que tenha por objeto atividade inerente à operação,
  manutenção

  aeroportuária ou resposta à emergência.

  (4)

  planos, projetos e planejamento aprovados pela ANAC; e

  (5)

  documentação sobre os recursos humanos (empregados diretos, terceirizados ou com

  outra espécie de vínculo de trabalho) cujas atividades são de responsabilidade do operador
  de

  aeródromo.'
