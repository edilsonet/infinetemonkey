title: 153.39(e)
text: '(e) O operador de aeródromo deve documentar e manter no aeródromo os documentos

  produzidos no desenvolvimento ou monitoramento das atividades descritas a seguir:

  (1)

  treinamento e qualificação de pessoal;

  (2)

  Sistema de Gerenciamento da Segurança Operacional;

  (3)

  operações aeroportuárias;

  (4)

  manutenção aeroportuária;


  Data da emissão: 15 de março de 2021.


  (5)

  resposta à emergência; e

  (6)

  gerenciamento do risco da fauna. (Incluído pela Resolução nº 611, de 09.03.2021)'
