cite: 153.39(g)
title: 153.39(g)
text: '(g) O operador de aeródromo deve manter os seguintes dados atualizados junto à ANAC:

  (1)

  nome oficial do aeródromo que opera;

  (2)

  nome empresarial da pessoa jurídica que exerce a atividade de operador do aeródromo;

  (3)

  título do estabelecimento (nome fantasia);

  (4)

  número de inscrição do CNPJ;

  (5)

  endereço para envio de correspondência;

  (6)

  telefones fixos e móveis para contato;

  (7)

  correio eletrônico para contato.'
