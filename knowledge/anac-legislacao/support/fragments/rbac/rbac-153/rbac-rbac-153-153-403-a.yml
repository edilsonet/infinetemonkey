cite: 153.403(a)
title: 153.403(a)
text: '(a) A CAT - Categoria Contraincêndio do Aeródromo reflete o nível de proteção contraincêndio

  provido pelo SESCINC, considerando existentes e disponíveis, nos valores mínimos, os recursos
  da

  Tabela 153.403-1, para:

  (1)

  quantidade e regime de descarga de agentes extintores principal e complementar

  disponíveis para pronto atendimento à emergência; e

  (2)

  quantidade de Carro Contraincêndio (CCI) em linha.


