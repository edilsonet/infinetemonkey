title: 153.403(b)
text: '(b) A CAT deve ser validada pela ANAC.

  (1)

  O operador do aeródromo não pode divulgar CAT superior à validada pela ANAC.

  (2)

  A ANAC pode, de ofício, alterar o nível de validação da CAT, se constatar que ele não

  mais corresponde aos recursos disponíveis no aeródromo.


  Data da emissão: 15 de março de 2021.'
