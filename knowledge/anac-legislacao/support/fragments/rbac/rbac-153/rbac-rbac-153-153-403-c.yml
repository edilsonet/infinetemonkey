cite: 153.403(c)
title: 153.403(c)
text: '(c) O operador do aeródromo deve manter atualizados a ANAC e os órgãos e entidades

  responsáveis pelo controle de tráfego aéreo e pela divulgação de informações aeronáuticas
  quanto à

  CAT do aeródromo sob sua administração.

  (1)

  Quando o SESCINC não for prestado de forma contínua, o operador do aeródromo deve

  fazer constar, nas informações relativas à CAT divulgadas, os horários em que o serviço
  estará

  disponível.

  (2)

  Ocorrendo redução nos recursos do aeródromo para valores inferiores aos relacionados

  na Tabela 153.403-1 à CAT divulgada, o operador deve declarar a redução do nível de proteção

  contraincêndio do aeródromo e tomar as providências necessárias à divulgação da nova CAT.
  (Vide

  IS nº 153.403-001)'
