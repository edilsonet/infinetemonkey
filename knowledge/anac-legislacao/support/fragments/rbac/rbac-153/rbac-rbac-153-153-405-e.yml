title: 153.405(e)
text: '(e) O agente extintor complementar (coluna [7] da Tabela 153.403-1) deve ser o Pó Químico

  BC (classe B - líquidos inflamáveis e classe C - materiais elétricos) à base de bicarbonato
  de sódio,

  ou de outra composição com capacidade extintora equivalente.'
