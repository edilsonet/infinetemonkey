text: '(a) As características técnicas mínimas de um CCI estão dispostas na Tabela 153.407-1.

  (1)

  Não será exigido o cumprimento do item 2 da Tabela 153.407-1 para CCI fabricados antes

  de 16 de julho de 2013.


