cite: 153.409(a)
title: 153.409(a)
text: '(a) O SESCINC deve, em condições ótimas de visibilidade e de superfície de pista, ser
  capaz de

  atingir um tempo-resposta não superior a 3 (três) minutos para qualquer ponto de cada pista
  de pouso

  e decolagem operacional do aeródromo.

  (1)

  Tempo-resposta é o intervalo de tempo decorrido entre o acionamento do SESCINC e o

  momento em que o(s) primeiro(s) CCI esteja(m) posicionado(s) em condição de aplicar a solução
  de

  espuma a um regime de descarga de, pelo menos, 50% do especificado na Tabela 153.403-1 para
  a

  categoria do aeródromo.'
