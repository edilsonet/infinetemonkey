title: 153.409(b)
text: '(b) Qualquer outro CCI que não o(s) responsável(is) por cumprir o disposto no parágrafo

  153.409(a), necessário à aplicação dos agentes extintores na quantidade mínima especificada
  na

  Tabela 153.403-1 para a categoria do aeródromo, deve ser capaz de chegar a qualquer ponto
  de cada

  pista de pouso e decolagem operacional do aeródromo em até 4 (quatro) minutos após o acionamento

  do SESCINC.'
