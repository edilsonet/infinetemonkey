title: 153.411(a)
text: '(a) A CAT-AV das aeronaves de asas fixas é determinada a partir da Tabela 153.411-1,
  da

  seguinte forma:

  (1)

  pela CAT-AV associada ao comprimento total da aeronave, nos casos em que a largura

  máxima de sua fuselagem não excede o limite da coluna 3; ou

  (2)

  pela CAT-AV imediatamente superior àquela associada ao comprimento total da

  aeronave, nos casos em que a largura máxima de sua fuselagem excede o limite da coluna 3.


  Data da emissão: 15 de março de 2021.


