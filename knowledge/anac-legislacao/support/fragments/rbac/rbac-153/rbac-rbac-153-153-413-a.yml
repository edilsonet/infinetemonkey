title: 153.413(a)
text: '(a) O operador do aeródromo somente pode autorizar operações de transporte aéreo público
  de

  passageiros ou cargas em aeronaves de CAT-AV (Tabela 153.411-1 e 153.411-3) ou CAT-AV

  equivalentes (Tabela 153.411-2) que sejam compatíveis com a CAT do aeródromo.'
