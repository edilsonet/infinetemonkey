title: 153.413(d)
text: '(d) Ocorrendo situação que importe em diminuição da CAT do aeródromo conforme parágrafo

  153.403(c)(2), o operador do aeródromo, além de observar o disposto no parágrafo 153.413(a),
  deve

  cancelar as autorizações anteriormente concedidas que não sejam compatíveis com a nova CAT,

  comunicando imediatamente o fato aos operadores aéreos interessados.

  (1)

  Poderão ser mantidas as autorizações já concedidas para operações a se realizarem dentro

  dos prazos da Tabela 153.413-1, contados a partir do dia seguinte ao da redução da CAT,
  para cada

  Classe de aeródromo e nível de redução.


  Tabela 153.413-1 - Prazos de tolerância para autorizações já

  concedidas, por Classe de Aeródromo e Nível de Redução

