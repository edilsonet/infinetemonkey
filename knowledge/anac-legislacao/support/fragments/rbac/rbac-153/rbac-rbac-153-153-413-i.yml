title: 153.413(i)
text: '(i)

  operações em aeronaves de CAT-AV (ou equivalente) menor ou igual à CAT do

  aeródromo, independentemente do número de operações;

  (ii)

  para até 900 (novecentos) movimentos trimestrais, operações em aeronaves de CAT-

  AV (ou equivalente) até um nível acima da CAT do aeródromo;

  (iii) para até 26 (vinte e seis) movimentos trimestrais, operações em aeronaves de CAT-

  AV (ou equivalente) 2 (dois) ou mais níveis acima da CAT do aeródromo.

  (3)

  para os aeródromos Classe I, são compatíveis todas as operações.'
