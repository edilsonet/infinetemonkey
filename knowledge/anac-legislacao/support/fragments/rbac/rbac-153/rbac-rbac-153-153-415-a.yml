cite: 153.415(a)
title: 153.415(a)
text: '(a) São funções exercidas no âmbito do SESCINC:

  (1)

  Bombeiro de Aeródromo (BA), responsável pelo resgate de pessoas e combate ao

  incêndio;

  (2)

  Bombeiro de Aeródromo Motorista/Operador de CCI (BA-MC), responsável pela

  condução e operação de CCI;

  (3)

  Bombeiro de Aeródromo Chefe de Equipe de Serviço (BA-CE), responsável pelo

  comando da equipe de serviço nas operações de resgate e combate a incêndios;

  (4)

  Bombeiro de Aeródromo Resgatista (BA-RE), responsável pelo resgate de pessoas e

  prestação dos primeiros socorros;

  (5)

  Bombeiro de Aeródromo Líder de Equipe de Resgate (BA-LR), responsável pela

  coordenação dos BA-RE nas operações de resgate;

  (6)

  Operador de Sistema de Comunicação (OC), responsável pelas atividades de

  comunicação e observação da área de movimento das aeronaves.

  (7)

  Gerente de Seção Contraincêndio (GS), responsável pela gestão e coordenação dos

  recursos humanos e materiais do SESCINC.'
