title: 153.415(b)
text: '(b) A acumulação de mais de uma das funções relacionadas no parágrafo 153.415(a) por
  um

  mesmo bombeiro de aeródromo somente é permitida nas seguintes situações:

  (1)

  nos aeródromos Classes I e II, a função GS pode ser acumulada com a função BA-CE; e

  (2)

  nos aeródromos Classes I, de CAT 1 a CAT 5, a função OC pode ser acumulada com a

  função BA-CE.'
