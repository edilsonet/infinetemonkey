title: 153.417(b)
text: '(b) O operador do aeródromo deve assegurar que os profissionais no exercício das funções

  tratadas nos parágrafos 153.415(a)(1) a 153.415(a)(5) estejam com suas competências atualizadas,

  com aprovação em Curso de Habilitação ou em Curso de Atualização em data não anterior a:

  (1)

  4 (quatro) anos, para profissionais em aeródromos Classes I e II;

  (2)

  2 (dois) anos, para profissionais em aeródromos Classes III e IV.


  Data da emissão: 15 de março de 2021.'
