cite: 153.417(d)
title: 153.417(d)
text: '(d) Os cursos e estágios de adaptação abaixo relacionados, concluídos até 31 de dezembro
  de

  2015, serão reconhecidos pela ANAC como equivalentes aos cursos dispostos nesta seção, conforme

  Tabela 153.417-1:

  (1)

  CECIS - Curso de Especialização em Contraincêndio e Salvamento (sob

  responsabilidade da Autoridade Aeronáutica);

  (2)

  EABA - Estágio de Adaptação de Bombeiros para Aeródromos (sob responsabilidade da

  Autoridade Aeronáutica);

  (3)

  CECIA - Curso Elementar em Contraincêndio e Salvamento (sob responsabilidade da

  Autoridade Aeronáutica);

  (4)

  FTBA - Formação Técnica de Bombeiro de Aeródromo (ministrado pela INFRAERO,

  realizado em caráter emergencial, sob autorização da ANAC);

  (5)

  EPB - Estágio de Padronização de Bombeiros para Aeródromos (sob responsabilidade da

  Autoridade Aeronáutica);

  (6)

  OPERADOR DE CCI - Curso de Operador de Carro Contraincêndio de Aeródromo (sob

  responsabilidade da INFRAERO);

  (7)

  CBBA - Curso Básico de Bombeiro de Aeródromos (sob responsabilidade da Autoridade

  Aeronáutica);

  (8)

  CATCIS - Curso de Atualização Técnica em Contraincêndio e Salvamento (sob

  responsabilidade da Autoridade Aeronáutica);

  (9)

  CACI - Curso de Administração em Contraincêndio e Salvamento (sob responsabilidade

  da Autoridade Aeronáutica); e

  (10) CEOCIS - Curso de Especialização para Oficiais em Contraincêndio e Salvamento (sob

  responsabilidade da Autoridade Aeronáutica).


  Tabela 153.417-1 - Equivalência entre Cursos e Estágios de Adaptação

  anteriormente concluídos e os Cursos da Seção 153.417.

  Cursos anteriores a 31 de

  dezembro de 2015

  [1]

  Curso Equivalente

  [2]

  CECIA

  Curso de Habilitação de Bombeiro de

  Aeródromo 1 (CBA-1)

  EABA

  FTBA

  CECIS

  EPB

  CBBA

  Curso de Habilitação de Bombeiro de

  Aeródromo 2 (CBA-2)

  CACI

  CEOCIS

  CATCIS (a partir de 2010)

  Curso de Especialização de Bombeiro

  de Aeródromo Chefe de Equipe de

  Serviço (CBA-CE)

  OPERADOR DE CCI

  Curso de Especialização de Bombeiro

  de Aeródromo Motorista/Operador de

  CCI (CBA-MC)


  Data da emissão: 15 de março de 2021.'
