cite: 153.417(i)
title: 153.417(i)
text: '(i)

  A aprovação em Curso de Habilitação de Bombeiro de Aeródromo 1 (CBA-1) habilita

  o profissional ao exercício em aeródromos até CAT 4.

  (ii)

  A aprovação em Curso de Habilitação de Bombeiro de Aeródromo 2 (CBA-2) habilita

  o profissional ao exercício em quaisquer aeródromos.

  (2)

  aprovação em Curso de Especialização de Bombeiro de Aeródromo Motorista/Operador

  de CCI, para a função de que trata o parágrafo 153.415(a)(2);

  (3)

  aprovação em Curso de Especialização de Bombeiro de Aeródromo Chefe da Equipe de

  Serviço, para a função de que trata o parágrafo 153.415(a)(3); e

  (4)

  aprovação em curso de primeiros socorros ou curso semelhante, reconhecido pela

  autoridade de saúde competente, para as funções tratadas nos parágrafos 153.415(a)(4) e

  153.415(a)(5).'
