title: 153.419(a)
text: '(a) Equipe de serviço é o conjunto de profissionais no efetivo exercício, no aeródromo,
  de uma

  das funções tratadas nos parágrafos 153.415(a)(1) a 153.415(a)(6).

  (1)

  Para compor a equipe de serviço, os profissionais no exercício das funções tratadas nos

  parágrafos 153.415(a)(1) a 153.415(a)(5) devem contar com os equipamentos de proteção previstos

  na seção 153.421.'
