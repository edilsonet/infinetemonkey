title: 153.419(b)
text: '(b) A equipe de serviço deve ser formada, no mínimo, pela equipagem do(s) CCI, conforme
  o

  disposto no parágrafo 153.407(b)(1), e mais 1 (um) BA-CE e 1 (um) OC.

  (1)

  Nos aeródromos Classe I e Classe II, e nos aeródromos Classe III com nível de proteção

  CAT 7 ou inferior, o BA-CE pode compor a equipagem mínima dos CCI exigida no parágrafo

  153.407(b)(1), juntamente o BA-MC e mais 1 (um) bombeiro de aeródromo.'
