title: 153.419(c)
text: '(c) Além do previsto no parágrafo 153.419(b), nos aeródromos Classe IV e nos aeródromos

  Classe III com nível de proteção CAT 6 ou superior, a equipe de serviço deve contar, também,
  com

  uma equipe de resgate, disponível no local da ocorrência e composta de 3 (três) BA-RE e
  1 (um) BA-

  LR.'
