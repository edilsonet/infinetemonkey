title: 153.421(a)
text: '(a) O operador do aeródromo deve disponibilizar, para cada Bombeiro de Aeródromo, Traje
  de

  Proteção (TP) apropriados às atividades de combate a incêndio.

  (1)

  O TP é composto de capacete, capuz do tipo “balaclava”, roupa de aproximação (calça e

  jaqueta), luvas e botas.

  (2)

  Cada Bombeiro de Aeródromo deve ter o seu próprio TP, adequado às suas características

  físicas e ao exercício de sua função.'
