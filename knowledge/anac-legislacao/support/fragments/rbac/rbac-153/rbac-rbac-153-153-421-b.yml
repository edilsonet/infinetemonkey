cite: 153.421(b)
title: 153.421(b)
text: '(b) O operador do aeródromo deve disponibilizar para os componentes da equipagem, excluídos

  aqueles com função exclusiva de motorista/operador dos veículos, Equipamentos de Proteção

  Respiratória (EPR) compatíveis com as atividades de combate a incêndio.

  (1)

  O conjunto de EPR é composto por peça facial, cilindro de ar com, no mínimo, 1600 litros

  de ar respirável, manômetro, regulador de pressão e alarme.

  (2)

  O EPR deve possuir compatibilidade com a utilização simultânea do TP.'
