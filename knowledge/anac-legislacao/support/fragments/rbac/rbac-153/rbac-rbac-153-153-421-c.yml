text: '(c) Além dos EPR previstos no parágrafo 153.421(b), nos veículos utilizados nas operações
  de

  resgate e combate a incêndio devem ser disponibilizados EPR extras, no mínimo um para cada
  dois

  componentes da equipagem que não BA-MC.'
