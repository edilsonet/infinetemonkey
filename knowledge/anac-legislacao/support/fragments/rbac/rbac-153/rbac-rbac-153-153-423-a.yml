text: '(a) A equipagem deve ter à disposição no local da ocorrência, no mínimo, os equipamentos
  de

  apoio descritos na Tabela 153.423-1, de acordo com a CAT do aeródromo.

  (1)

  O equipamento 1.1 da Tabela 153.423-1 não é obrigatório para operadores de aeródromos

  Classe I.

  (2)

  O equipamento 2.5 da Tabela 153.423-1 não é obrigatório para operadores de aeródromos

  Classes I e II.


  Data da emissão: 15 de março de 2021.


