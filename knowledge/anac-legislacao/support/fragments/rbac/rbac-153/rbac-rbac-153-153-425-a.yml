title: 153.425(a)
text: '(a) Os recursos dedicados às atividades do SESCINC se concentram em instalação específica,

  identificada como Seção Contraincêndio (SCI).

  (1)

  Parte dos recursos do SESCINC pode estar localizada em instalação não contígua à SCI,

  identificada como Posto Avançado Contraincêndio (PACI).'
