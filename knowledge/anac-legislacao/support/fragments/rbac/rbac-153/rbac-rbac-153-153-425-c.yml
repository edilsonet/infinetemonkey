title: 153.425(c)
text: '(c) O operador de aeródromo Classe I pode ser dispensado da obrigação de contar com
  a sala

  de observação prevista no parágrafo 153.425(b)(1) desde que aprovado pela ANAC, na forma
  prevista

  na Resolução ANAC nº 30, artigo 14, inciso II, procedimento alternativo que assegure a ampla
  visão

  da área de movimento das aeronaves.'
