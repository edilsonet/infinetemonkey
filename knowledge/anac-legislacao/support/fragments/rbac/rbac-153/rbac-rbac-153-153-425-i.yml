cite: 153.425(i)
title: 153.425(i)
text: '(i)

  A sala de observação deve oferecer a ambiência necessária à inteligibilidade das

  comunicações.

  (2)

  abrigo para os CCI e demais veículos do SESCINC;

  (3)

  pátio de manobras que permita a livre movimentação do(s) CCI e veículos de apoio às

  operações do SESCINC;

  (4)

  sistema que permita o completo reabastecimento de água nos tanques dos CCI em linha,

  com vazão que atenda ao disposto na Tabela 153.425-1;


  Data da emissão: 15 de março de 2021.


  Tabela 153.425-1 - Vazão mínima do sistema para reabastecimento dos CCI com água

  Capacidade do tanque de água do maior CCI

  em operação no aeródromo (litros)

  Vazão mínima

  ≤1.999

  500 litros/min

  >1.999 ≤7.200

  Correspondente a 25% da capacidade

  do tanque de água, por minuto

  >7.200

  1.800 litros/min


  (5)

  sistema de recarregamento contínuo das baterias dos CCI; e

  (6)

  sistema de reabastecimento dos reservatórios de ar comprimido dos CCI.'
