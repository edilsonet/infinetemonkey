cite: 153.427(b)
title: 153.427(b)
text: '(b) O operador do aeródromo deve disponibilizar sistema de alarme que permita o acionamento

  imediato do SESCINC, dimensionado para que o sinal sonoro seja audível em quaisquer pontos
  da

  SCI.

  (1)

  O sistema de alarme deve ser acionável pelo OC e pela Torre de Controle, quando houver.'
