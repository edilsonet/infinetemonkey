text: '(v)

  responsável pelo controle de tráfego aéreo no aeródromo;

  (vi) responsável pelo COE (ou órgão que atue como centro de operações em casos de

  emergências); e

  (vii) responsável pela operação do PCM.

  (2)

  comunicação, em linha direta e exclusiva, entre o OC e o responsável pelo controle de

  tráfego aéreo, quando existir.'
