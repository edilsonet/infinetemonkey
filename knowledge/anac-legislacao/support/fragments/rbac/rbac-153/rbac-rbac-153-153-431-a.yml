title: 153.431(a)
text: '(a) O operador do aeródromo deve encaminhar, à ANAC, em até 15 (quinze) dias após o
  fim de

  cada semestre, relatório relativo aos acionamentos do SESCINC no período, contendo a descrição
  de

  cada ocorrência.

  (1)

  A inexistência de acionamentos do SESCINC no período não afasta a necessidade de

  encaminhamento do relatório, que pode se resumir a essa informação.'
