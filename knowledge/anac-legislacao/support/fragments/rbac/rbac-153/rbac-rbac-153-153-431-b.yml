title: 153.431(b)
text: '(b) Sem prejuízo do disposto no parágrafo 153.431(a), o operador do aeródromo deve

  encaminhar informações relativas a acionamento motivado por emergência aeronáutica em até
  5

  (cinco) dias úteis da data da ocorrência.'
