cite: 153.433(a)
title: 153.433(a)
text: '(a) O Serviço Especializado de Salvamento Aquático (SESAQ) é o serviço de salvamento

  prestado em aeródromos em que existam superfícies aquáticas significativas próximas, sobre
  as quais

  ocorram parte relevante das operações de pouso e decolagem, para o atendimento a ocorrências
  nessas

  áreas.'
