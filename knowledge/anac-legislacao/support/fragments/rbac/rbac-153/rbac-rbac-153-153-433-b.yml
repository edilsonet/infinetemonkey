title: 153.433(b)
text: '(b) O dimensionamento do SESAQ está relacionado ao número máximo de passageiros e

  tripulantes da maior aeronave em operação no aeródromo, e tem, como objetivo operacional,
  a rápida

  chegada ao local da ocorrência, para o atendimento aos passageiros e tripulantes.'
