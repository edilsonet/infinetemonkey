title: 153.5(a)
text: '(a) Este Regulamento é de cumprimento obrigatório pelo operador de aeródromo que atua
  em

  aeródromo civil público brasileiro, compartilhado ou não.

  (1)

  Este Regulamento não se aplica a heliportos e helipontos.

  (2)

  A Subparte C deste Regulamento não se aplica a aeródromos compartilhados, operados

  pelo Comando da Aeronáutica, que já possuam seu sistema de segurança de voo (“safety”)

  implementado conforme normas vigentes específicas daquele órgão. (Redação dada pela Resolução

  nº 382, de 14 de junho de 2016)'
