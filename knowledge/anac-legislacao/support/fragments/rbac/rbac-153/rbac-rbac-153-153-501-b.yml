title: 153.501(b)
text: '(b) Os procedimentos básicos de gerenciamento do risco da fauna, descritos em Instrução

  Suplementar específica, devem abordar as seguintes medidas: (Vide IS nº 153.501-001)

  (1)

  controle de focos de atração de fauna no sítio aeroportuário;

  (2)

  manutenção das áreas verdes;

  (3)

  manutenção do sistema de drenagem;

  (4)

  garantia que o sistema de proteção da área operacional não permita a presença de animais

  na área operacional;

  (5)

  vistorias periódicas com o objetivo de identificar fauna e focos atrativos no sítio

  aeroportuário;

  (6)

  identificação das espécies em mapa de grade no sítio aeroportuário e na ASA;

  (7)

  ações mitigadoras a serem adotadas; e

  (8)

  informações a respeito de técnicas de manejo permitidas.'
