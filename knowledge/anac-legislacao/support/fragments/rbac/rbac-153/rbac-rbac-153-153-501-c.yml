cite: 153.501(c)
title: 153.501(c)
text: '(c) O operador de aeródromo deve estabelecer e implementar procedimentos de gerenciamento

  do risco da fauna associados ao Sistema de Gerenciamento de Segurança Operacional do aeródromo

  e que sejam capazes de:

  (1)

  prever a necessidade de implementação de procedimento adicional; ou

  (2)

  prever a necessidade de realização de uma Identificação do Perigo da Fauna - IPF e de

  um Programa de Gerenciamento do Risco da Fauna - PGRF.'
