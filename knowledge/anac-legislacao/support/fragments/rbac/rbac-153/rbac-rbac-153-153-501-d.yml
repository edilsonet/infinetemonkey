title: 153.501(d)
text: '(d) Os procedimentos de gerenciamento do risco da fauna associados ao Sistema de

  Gerenciamento de Segurança Operacional do aeródromo, descritos em Instrução Suplementar

  específica, devem abordar as seguintes medidas: (Vide IS nº 153.501-001)

  (1)

  investigação de focos de atração de fauna no sítio aeroportuário e na ASA;

  (2)

  identificação de vulnerabilidades do aeródromo; e

  (3)

  avaliação do perigo da fauna, com especial análise sobre as colisão entre aeronaves e a

  fauna.'
