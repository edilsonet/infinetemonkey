title: 153.501(e)
text: '(e) O operador de aeródromo deve assegurar a realização de uma Identificação do Perigo
  da

  Fauna - IPF e de um Programa de Gerenciamento do Risco da Fauna - PGRF quando:

  (1)

  o aeródromo for enquadrado nas classes III ou IV;

  (2)

  for constatada a necessidade de realização de uma Identificação do Perigo da Fauna - IPF

  e de um Programa de Gerenciamento do Risco da Fauna - PGRF, nos moldes do parágrafo

  153.501(c)(2); ou

  (3)

  a ANAC, a qualquer tempo, demandar a elaboração de uma IPF e de um PGRF quando

  identificar situações que possam causar risco à segurança operacional.


  Data da emissão: 15 de março de 2021.'
