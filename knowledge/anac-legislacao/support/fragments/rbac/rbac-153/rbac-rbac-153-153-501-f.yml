cite: 153.501(f)
title: 153.501(f)
text: '(f)

  O operador de aeródromo deve encaminhar à ANAC a IPF, para análise de conformidade

  com os requisitos contidos neste regulamento, aceitação e verificação de incorporação de
  seu

  resultado no PGRF.

  (1)

  no prazo máximo de 15 (quinze) meses a partir da data em que o aeródromo vier a se

  enquadrar nas condições estabelecidas nos parágrafos 153.501(e)(1) ou 153.501(e)(2); ou

  (2)

  no prazo definido pela ANAC, quando o aeródromo vier a se enquadrar no parágrafo

  153.501(e)(3).'
