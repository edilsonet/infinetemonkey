cite: 153.501(g)
title: 153.501(g)
text: '(g) A partir da data da ciência da aceitação da IPF dada pela ANAC, o operador do aeródromo

  terá o prazo máximo de 3 (meses) para a apresentação do respectivo PGRF.

  (1)

  O PGRF deve ser encaminhado à ANAC, para análise e verificação de conformidade com

  os requisitos contidos neste regulamento e de incorporação do resultado da IPF em seu conteúdo.

  (2)

  Após a análise e verificação de conformidade com os requisitos do regulamento, o texto

  do PGRF estará apto e deverá ser incorporado ao MOPS do aeródromo.'
