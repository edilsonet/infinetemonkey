title: 153.501(h)
text: '(h) Sempre que tomar conhecimento de situações que possam provocar risco à segurança

  operacional, seja por intermédio de fiscalização ou recebimento de relatos ou denúncias,
  a ANAC

  poderá, a qualquer tempo, exigir de qualquer operador de aeródromo a execução de procedimentos

  para a mitigação do risco da fauna, nos moldes do presente regulamento.

  (1)

  Quando julgar necessário, a ANAC definirá os prazos para cumprimento dos

  procedimentos acima descritos.'
