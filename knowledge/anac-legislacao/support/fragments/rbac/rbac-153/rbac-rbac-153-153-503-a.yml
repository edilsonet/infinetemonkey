title: 153.503(a)
text: '(a) A Identificação do Perigo da Fauna - IPF compreende uma abordagem preliminar do

  problema, na qual são identificadas as espécies de fauna presentes no aeródromo e no seu
  entorno

  que provocam risco às operações aéreas, os principais focos de atração, e em que são definidas
  e

  priorizadas as medidas adotadas para a redução do risco.'
