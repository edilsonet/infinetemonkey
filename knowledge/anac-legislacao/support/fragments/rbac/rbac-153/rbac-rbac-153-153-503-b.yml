title: 153.503(b)
text: '(b) A IPF é um documento que visa identificar a situação geral do perigo da fauna em
  um

  aeródromo com o intuito de propor um plano de ações para sua mitigação, além de proporcionar
  as

  bases científicas para o desenvolvimento, implantação e refinamento ou revisão de um PGRF.'
