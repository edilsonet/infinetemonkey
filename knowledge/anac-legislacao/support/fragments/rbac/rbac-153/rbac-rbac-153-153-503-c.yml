title: 153.503(c)
text: '(c) Os dados necessários para desenvolvimento de uma IPF devem ser obtidos ao longo
  de, no

  mínimo, 12 (doze) meses ininterruptos de modo a considerar a influência das variações sazonais
  no

  perigo provocado pela fauna.

  (1)

  O tempo para obtenção de dados para desenvolvimento de uma IPF pode ser reduzido,

  nos casos em que sua elaboração visar tão somente a revisão de um PGRF já estabelecido.

  (2)

  Caso seja identificada, ainda no período de coleta de dados da IPF, a necessidade de

  adoção de medidas mitigadoras imediatas, estas devem ser implantadas pelo operador de aeródromo.'
