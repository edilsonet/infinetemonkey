title: 153.503(d)
text: '(d) A IPF tem validade de 5 (cinco) anos, devendo ser revisada até o final do quinto
  ano de sua

  vigência.

  (1)

  A validade da IPF inicia-se a partir do último mês e ano no qual foi realizado o

  levantamento de dados do censo das espécies apresentado.

  (2)

  O operador do aeródromo pode postergar a vigência da IPF por até 2 (dois) anos, desde


  Data da emissão: 15 de março de 2021.


  que devidamente justificado por profissional capacitado previsto no parágrafo 153.35(d).

  (3)

  A justificativa para a postergação da vigência da IPF deve atestar que as condições que

  envolveram sua elaboração permanecem válidas e inalteradas.

  (4)

  A ANAC poderá solicitar a revisão da IPF, a qualquer momento, quando identificar

  situações que possam causar risco à segurança operacional.'
