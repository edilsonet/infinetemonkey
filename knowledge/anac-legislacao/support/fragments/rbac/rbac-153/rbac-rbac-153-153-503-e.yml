title: 153.503(e)
text: '(e) Toda IPF deve apresentar, no mínimo, as seguintes informações:

  (1)

  relato das condições que implicaram na necessidade da elaboração da IPF, descrevendo

  qual(is) requisito(s) de aplicabilidade de elaboração de IPF e PGRF, preconizado(s) no parágrafo

  153.501(e), o aeródromo veio a se enquadrar e em que data;

  (2)

  Identificação das espécies de fauna presentes no aeródromo e em seu entorno que

  provoquem risco às operações aéreas, com censo das espécies, dos locais em que são comumente

  vistas, dos padrões de movimento e do período do dia/ano em que ocorrem;'
