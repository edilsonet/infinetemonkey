title: 153.503(f)
text: '(f)

  As medidas descritas no parágrafo 153.503(e)(5) devem informar, para cada foco de atração

  identificado, a ação a ser tomada, o prazo para cumprimento e o(s) setor(es) responsáveis
  pela ação.

  (1)

  No caso de focos de atração localizados fora do sítio aeroportuário, o operador deve

  elencar as ações a serem exercidas junto aos órgãos competentes no intuito de promover a
  mitigação

  do risco.'
