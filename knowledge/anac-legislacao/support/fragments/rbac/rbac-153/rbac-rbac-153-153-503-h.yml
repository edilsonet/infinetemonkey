title: 153.503(h)
text: '(h) Toda IPF deve orientar, conclusivamente e de acordo com a priorização das ações
  para


  Data da emissão: 15 de março de 2021.


  mitigação dos riscos identificados, a implantação de um programa de gerenciamento do risco
  da fauna

  no aeródromo.

  (1)

  Para efeitos do disposto no parágrafo 153.503(h), considera-se concluído o PGRF na data

  da ciência ao operador de aeródromo a respeito da conformidade da IPF e do PGRF.'
