title: 153.503(i)
text: '(i)

  O operador de aeródromo deve dispor de uma relação das espécies de fauna que

  provocam maior risco às operações aéreas no aeródromo, especificando sua massa média, suas

  características gregárias, características do voo e outros elementos que julgar relevantes
  para a

  segurança operacional.

  (3)

  Identificação e localização geográfica dos focos de atração de aves e outros animais no

  sítio aeroportuário e na ASA, com levantamento das espécies de animais atraídas por cada
  foco e que

  causem risco às operações aéreas;

  (4)

  Análise do risco da fauna, de acordo com Instrução Suplementar específica. (Vide IS nº

  153.503-001)

  (5)

  Caso seja utilizada uma metodologia diferente da estabelecida em Instrução Suplementar

  específica, o operador de aeródromo deve apresentar justificativa técnica que explicite
  as razões para

  sua adoção. (Vide IS nº 153.503-001)

  (6)

  Listagem e priorização de ações com o objetivo de mitigar os riscos identificados, com a

  resolução ou mitigação direta do problema, com ações realizadas pelo operador aeroportuário,
  ou

  indireta, mediante solicitação de ações a órgãos externos e/ou por intermédio da criação
  da comissão

  de gerenciamento do risco da fauna - CGRF, compreendendo as seguintes categorias não excludentes,

  conforme aplicáveis:'
