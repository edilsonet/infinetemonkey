cite: 153.505(a)
title: 153.505(a)
text: '(a) O Programa de Gerenciamento do Risco da Fauna - PGRF é um documento de natureza

  especificamente operacional, que deve estabelecer procedimentos de cunhos permanente, sazonal
  ou

  eventual, incorporados à rotina operacional do aeródromo, com a finalidade de reduzir

  progressivamente o risco de colisão entre aeronaves e animais nas operações aeroportuárias.

  (1)

  O PGRF é o instrumento normativo que, para todos os efeitos, equivale ao programa de

  gerenciamento do risco da fauna local, englobando todos os requisitos necessários à elaboração
  deste.

  (2)

  Os procedimentos relacionados no PGRF devem tomar como diretriz os resultados

  obtidos na IPF, tendo como prerrogativa básica o controle dos focos de atração de animais
  na área

  patrimonial e as ações cabíveis ao operador de aeródromo, considerando suas responsabilidades
  e

  limites de atuação, no que tange à área externa ao sítio aeroportuário.

  (3)

  Caso a IPF identifique, dentre as medidas necessárias à mitigação do risco da fauna no

  aeródromo, a necessidade de elaboração de um Plano de Manejo de Fauna em Aeródromos, este

  deverá ser elaborado em atenção às normas e exigências dos órgãos ambientais competentes,
  devendo

  ser incorporado, quando aprovado, ao PGRF, elencando-se neste as medidas operacionais cabíveis

  aos operadores de aeródromos.

  (4)

  O operador do aeródromo deve apresentar um plano de ações mitigadoras alternativas,

  até que seja possível executar as ações preconizadas no PGRF, dependentes da elaboração
  e

  aprovação de um Plano de Manejo de Fauna em Aeródromos pelos órgãos ambientais competentes,

  monitorando seu resultado e incorporando ações de melhoria contínua que garantam sua eficácia.'
