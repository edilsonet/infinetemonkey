text: '(i)

  O operador do aeródromo deve dispor de recursos e procedimentos para inibir a presença de


  Data da emissão: 15 de março de 2021.


  animais que ofereçam riscos às operações aéreas na área operacional do aeródromo.

  (1)

  O operador de aeródromo deve dispor de um local adequado para a contenção de animais

  que eventualmente sejam recolhidos na área operacional do aeródromo, além de recursos e

  procedimentos para que o recolhimento seja feito com segurança e, quando aplicável, de acordo
  com

  as normas ambientais vigentes.'
