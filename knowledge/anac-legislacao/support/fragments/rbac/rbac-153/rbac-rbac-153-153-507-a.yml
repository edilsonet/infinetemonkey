cite: 153.507(a)
title: 153.507(a)
text: '(a) O operador de aeródromo que esteja enquadrado na aplicabilidade do parágrafo 153.501(e)

  deve instituir uma Comissão de Gerenciamento do risco da Fauna - CGRF no prazo máximo de
  3

  (três) meses, a contar da data do início do enquadramento.

  (1)

  A CGRF deve proporcionar ao operador aeroportuário, comunidades do entorno,

  autoridades locais, usuários do aeroporto e outras partes interessadas a troca de informações
  sobre

  questões relacionadas ao Risco da Fauna;

  (2)

  A CGRF será composta por funcionários do aeroporto e deverá convidar membros e

  órgãos externos envolvidos nas questões relacionadas ao risco da Fauna, como representantes
  de

  órgãos públicos e demais organizações da sociedade civil cuja participação julgue pertinente
  para o

  gerenciamento do risco da fauna provocado por focos atrativos e potencialmente atrativos
  situados

  na ASA.'
