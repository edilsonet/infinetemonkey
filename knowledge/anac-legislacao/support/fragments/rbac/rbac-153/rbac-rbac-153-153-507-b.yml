title: 153.507(b)
text: '(b) O operador deve exercer gestões junto a órgãos externos para a mitigação do risco
  provocado

  pela presença de focos atrativos de fauna e com potencial atrativo de fauna em área externa
  ao sítio

  aeroportuário, guardadas suas responsabilidades e limites, compreendendo as seguintes atividades:

  (1)

  Instituição da CGRF, sem prejuízo das ações descritas no parágrafo 153.507(d).'
