section_title: Comissão de Gerenciamento do Risco da Fauna - CGRF
subsection_id: c
cite: 153.507(c)
title: 153.507(c)
text: '(c) Caberá à CGRF:

  (1)

  estudar, propor e implementar, no seu âmbito de atuação, medidas para reduzir o risco da

  fauna no aeródromo;

  (2)

  disponibilizar canais de comunicação para recolhimento de informações e recebimento

  de reclamações relativas ao acumulo de fauna e lixo, visando identificar os locais mais
  críticos, além

  de embasar as ações para mitigação do problema;

  (3)

  realizar reuniões periódicas com representantes da população do entorno com o objetivo

  de informar e orientar sobre o Risco da Fauna;

  (4)

  manter atualizado mapa com a Área de Segurança Aeroportuária, baseado nas

  informações do PGRF e monitoramento da ASA, indicando os locais com focos de atração de
  fauna;

  (5)

  auxiliar na implementação do PGRF, conforme o estabelecido no parágrafo

  153.503(e)(5);

  (6)

  promover a divulgação das questões relacionadas ao risco de colisão da fauna em

  aeródromos.'
