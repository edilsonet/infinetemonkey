cite: 153.507(d)
title: 153.507(d)
text: '(d) O operador de aeródromo deve realizar, pelo menos a cada 6 (seis) meses, reuniões
  com

  todos setores/funcionários envolvidos no gerenciamento do risco da fauna, incluindo-se os
  setores

  envolvidos no planejamento, manutenção, operações e gerenciamento da segurança operacional,
  com

  registro em ata das ações que porventura sejam deliberadas.

  (1)

  As reuniões devem incluir, quando couber, responsáveis pelo controle de tráfego aéreo,

  operadores de aeronaves, empresas auxiliares de transporte aéreo, SESCINC, dentre outros
  setores

  do aeródromo cuja participação seja importante para o bom andamento das atividades de

  gerenciamento do risco da fauna.

  (2)

  As reuniões devem abordar, como assuntos principais, revisão dos dados coletados sobre

  colisão com fauna, observações a respeito da fauna no aeródromo, avaliação do risco da fauna
  e

  avaliação de tendências, de modo a levantar possibilidades e determinar novas medidas mitigadoras

  a serem implantadas para gerenciar riscos que porventura tenham surgido.'
