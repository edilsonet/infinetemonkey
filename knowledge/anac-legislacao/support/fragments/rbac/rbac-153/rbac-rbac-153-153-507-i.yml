section_title: Comissão de Gerenciamento do Risco da Fauna - CGRF
subsection_id: i
cite: 153.507(i)
title: 153.507(i)
text: '(i)

  O operador do aeródromo deve presidir a CGRF, gerenciar suas reuniões periódicas e

  convidar os órgãos externos cuja presença julgue ser necessária para a mitigação dos riscos

  identificados.


  Data da emissão: 15 de março de 2021.


  (ii)

  Dentre os órgãos externos, o operador de aeródromo deve avaliar, prioritariamente, a

  necessidade de participação de administrações públicas municipais e estaduais/distrital
  abrangidas

  pela ASA, além de seus respectivos setores de controle ambiental, quando houver.

  (iii)

  As reuniões da CGRF devem ocorrer, no mínimo, a cada 12 (doze) meses.

  (iv)

  A primeira reunião da CGRF deverá ocorrer em, no máximo, 3 (três) meses, a contar

  da data da instituição;

  (2)

  Logo que tomar conhecimento da existência de foco atrativo ou com potencial atrativo de

  fauna na ASA, em área externa ao sítio aeroportuário, o operador de aeródromo deverá informar
  à

  administração municipal/distrital responsável, além de demais órgãos considerados pertinentes
  pela

  legislação em vigor, para a mitigação do risco da fauna.'
