title: 153.51(b)
text: '(b) O operador de aeródromo deve estabelecer e submeter à ANAC Níveis Aceitáveis de

  Desempenho da Segurança Operacional (NADSO) proporcionais à complexidade de suas operações

  e em conformidade com a regulamentação vigente e com os requisitos acordados com a ANAC.'
