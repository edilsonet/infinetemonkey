title: 153.51(c)
text: '(c) O operador de aeródromo deve considerar os seguintes componentes, bem como outros

  regulamentos pertinentes, para estruturação do SGSO:

  (1)

  política e objetivos de segurança operacional;

  (2)

  gerenciamento dos riscos à segurança operacional;

  (3)

  garantia da segurança operacional; e

  (4)

  promoção da segurança operacional;'
