title: 153.51(d)
text: '(d) O operador de aeródromo deve formalizar e enviar à ANAC uma declaração expressa
  de

  comprometimento com a garantia da segurança operacional, conforme modelo definido pela Agência,

  nos casos previstos no Apêndice A deste Regulamento.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)


  Data da emissão: 15 de março de 2021.'
