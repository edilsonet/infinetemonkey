title: 153.53(a)
text: '(a) O operador de aeródromo deve formalizar o conteúdo da política de segurança operacional,

  o qual deve ser assinado pelo operador do aeródromo e pelo gestor responsável do aeródromo,
  no

  caso de serem pessoas distintas. (Redação dada pela Resolução nº 503, de 07.02.2019)'
