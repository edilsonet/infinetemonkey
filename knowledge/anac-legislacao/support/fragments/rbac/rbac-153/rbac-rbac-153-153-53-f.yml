title: 153.53(f)
text: '(f)

  Responsabilidades quanto ao SGSO:

  (1)

  O operador de aeródromo deve estabelecer as atribuições dos responsáveis elencados no

  parágrafo 153.15(a) e demais membros de sua equipe quanto à segurança operacional e,

  especificamente, quanto ao SGSO. (Redação dada pela Resolução nº 503, de 07.02.2019)

  (2)

  O operador de aeródromo deve estabelecer e documentar requisitos de segurança

  operacional de cumprimento obrigatório nos contratos com outros PSAC e demais prestadores
  de

  serviços cujas atividades possam afetar a segurança operacional do aeródromo.

  (3)

  O operador de aeródromo deve instituir, por ato oficial, Comissão de Segurança

  Operacional (CSO) composta pelos profissionais designados como responsáveis pelas atividades

  elencadas no parágrafo 153.15(a) e membros de outras áreas da estrutura organizacional do
  operador

  de aeródromo relacionadas à segurança operacional da aviação civil. (Redação dada pela Resolução

  nº 503, de 07.02.2019)

  (4)

  O operador de aeródromo deve estabelecer e documentar regimento para disciplinar o

  funcionamento da CSO, que deve compreender: (Redação dada pela Resolução nº 503, de

  07.02.2019)'
