text: '(g) Sistema de documentação:

  (1)

  O operador de aeródromo deve estabelecer e documentar os requisitos de controle da

  documentação e dos registros relacionados ao SGSO, compreendendo identificação, armazenamento,

  distribuição, atualização, revisão e descarte.

  (2)

  O operador de aeródromo deve, como parte da documentação controlada do SGSO,

  elaborar e documentar um Manual de Gerenciamento da Segurança Operacional (MGSO),

  compreendendo:'
