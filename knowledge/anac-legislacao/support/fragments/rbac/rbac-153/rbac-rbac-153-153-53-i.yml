title: 153.53(i)
text: '(i)

  definição do profissional responsável pela presidência da Comissão; (Redação dada

  pela Resolução nº 503, de 07.02.2019)

  (ii)

  critérios para convocação de membros externos à estrutura organizacional do

  aeródromo, conforme a complexidade das operações desenvolvidas no aeródromo;

  (iii) periodicidade para realização de reuniões ordinárias e critérios para convocação de

  reuniões extraordinárias;

  (iv) registro em ata de todas as reuniões realizadas, incluindo relatório dos assuntos

  tratados, ações e recomendações de segurança operacional definidas;'
