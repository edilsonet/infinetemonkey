cite: 153.53(v)
title: 153.53(v)
text: '(v)

  atividades da CSO, que devem compreender:

  (A) assessorar o gestor responsável do aeródromo no processo de gerenciamento do

  risco, conforme metodologia definida no MGSO, incluindo a elaboração da Análise de Impacto
  sobre

  a Segurança Operacional (AISO); (Redação dada pela Resolução nº 503, de 07.02.2019)

  (B) assessorar o responsável pelo gerenciamento da segurança operacional em outros

  assuntos relacionados à segurança operacional;

  (C) propor ações para eliminação ou mitigação do risco associado aos perigos

  identificados;

  (D) avaliar o cumprimento do planejamento formal para implantação do SGSO;

  (E)

  avaliar a eficácia das ações executadas dentro do planejamento formal para

  implantação do SGSO e o planejamento para cumprimento dos objetivos de segurança operacional;

  (F)

  avaliar a eficácia das ações implementadas para eliminação ou mitigação de riscos;

  (G) propor revisão das ações implementadas para eliminação ou mitigação de riscos,

  bem como propor ações adicionais;

  (H) avaliar a eficácia do PISOA;

  (I)

  avaliar periodicamente o desempenho da segurança operacional no aeródromo;

  (J)

  realizar análise crítica dos relatórios finais de auditorias internas de segurança


  Data da emissão: 15 de março de 2021.


  operacional;

  (K) elaborar e apresentar ao gestor responsável do aeródromo pareceres periódicos

  sobre o desempenho da segurança operacional no aeródromo. (Redação dada pela Resolução nº
  503,

  de 07.02.2019)

  (5)

  O responsável pelo gerenciamento da segurança operacional deve coordenar as atividades

  relacionadas ao desenvolvimento, implementação, manutenção e melhoria contínua do SGSO

  estabelecido para o aeródromo.'
