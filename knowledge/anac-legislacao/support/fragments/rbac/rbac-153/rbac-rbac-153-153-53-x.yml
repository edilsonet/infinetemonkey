title: 153.53(x)
text: '(x)

  promover o SGSO para todo o pessoal envolvido com atividades que possam ter

  impacto sobre a segurança operacional;

  (xi) melhorar continuamente o seu nível de desempenho de segurança operacional;

  (xii) gerenciar mudanças em sua estrutura organizacional que possam influenciar na

  segurança operacional.'
