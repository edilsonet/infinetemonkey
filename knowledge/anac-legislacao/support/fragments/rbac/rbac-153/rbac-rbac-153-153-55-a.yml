title: 153.55(a)
text: '(a) Identificação de perigos: (Redação dada pela Resolução nº 382, de 14 de junho de
  2016)

  (1)

  O operador de aeródromo deve estabelecer um processo contínuo e formal para identificar

  perigos existentes ou potenciais nas operações desenvolvidas.

  (2)

  O operador de aeródromo deve estabelecer requisitos, fontes de dados e recursos a serem

  utilizados para identificação de perigos referentes à abordagem reativa, preventiva e preditiva,

  conforme a complexidade de suas operações. (Redação dada pela Resolução nº 382, de 14 de
  junho

  de 2016)

  (3)

  O operador de aeródromo deve estabelecer requisitos para considerar informações sobre

  perigos obtidas a partir das recomendações decorrentes de investigações de incidentes e
  acidentes

  aeronáuticos, visando ao gerenciamento reativo. (Redação dada pela Resolução nº 382, de
  14 de junho

  de 2016)'
