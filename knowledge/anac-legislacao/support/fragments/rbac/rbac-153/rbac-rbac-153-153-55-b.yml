title: 153.55(b)
text: '(b) O operador de aeródromo deve estabelecer e documentar um procedimento para realização

  de investigações internas de eventos de interesse da segurança operacional, indicando as

  responsabilidades e a forma de tratamento dos dados e das informações obtidas com a investigação.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)

  (1)

  O operador de aeródromo deve estabelecer um sistema de relatos de aviação civil como

  ferramenta para aquisição de dados de entrada para o processo de identificação de perigos,
  que

  compreenda reportes obrigatórios, voluntários e confidenciais.

  (2)

  O operador de aeródromo deve estabelecer, quando solicitado pelo relator ou quando for


  Data da emissão: 15 de março de 2021.


  de interesse da segurança operacional, requisitos para garantia da preservação da identidade
  do relator

  no caso de relatos confidenciais.

  (3)

  O operador de aeródromo deve estabelecer requisitos para informar ao relator sobre as

  ações adotadas a partir da análise de seu relato.

