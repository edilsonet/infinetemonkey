text: '(c) Avaliação e mitigação de riscos:

  (1)

  O operador de aeródromo deve estabelecer um processo contínuo e formal para o

  gerenciamento do risco associado à realização de suas atividades que assegure a avaliação
  dos riscos

  e proposição de ações adicionais para controle dos riscos.

  (2)

  O operador de aeródromo deve estabelecer e descrever em seu MGSO a metodologia para

  avaliação do risco à segurança operacional em suas operações, a qual deve compreender as
  seguintes

  etapas:'
