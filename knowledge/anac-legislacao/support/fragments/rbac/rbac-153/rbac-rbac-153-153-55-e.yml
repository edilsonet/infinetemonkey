title: 153.55(e)
text: '(e) O operador de aeródromo deve detalhar e documentar as defesas existentes e medidas

  adicionais para eliminação ou mitigação dos riscos em um documento denominado Procedimentos

  Específicos de Segurança Operacional (PESO).

  (1)

  O PESO tem como objetivo a descrição da implantação e/ou da execução das defesas

  existentes e medidas adicionais para eliminação ou mitigação dos riscos decorrentes da AISO.'
