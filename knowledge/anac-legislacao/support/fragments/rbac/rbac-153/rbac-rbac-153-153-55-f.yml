cite: 153.55(f)
title: 153.55(f)
text: '(f)

  O operador de aeródromo fica dispensado de documentar as defesas existentes em um PESO

  quando já estiverem documentadas e implementadas como rotina da organização e desde que

  mantidas as condições executivas e operacionais do aeródromo. (Renumerado pela Resolução
  nº 382,

  de 14 de junho de 2016)'
