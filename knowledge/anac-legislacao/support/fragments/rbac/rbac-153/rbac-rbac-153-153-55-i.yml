title: 153.55(i)
text: '(i)

  critérios para estimar a probabilidade de ocorrência de determinado evento;

  (ii)

  critérios para estimar a severidade das consequências de determinado evento;

  (iii) critérios para definir a tolerabilidade dos riscos de determinado evento analisado;

  (iv) critérios para consultar partes externas à organização quanto à execução de ações para

  eliminação ou mitigação dos riscos;'
