cite: 153.57(a)
title: 153.57(a)
text: '(a) O operador de aeródromo deve estabelecer requisitos e prover recursos para garantir
  a

  segurança operacional por meio de:

  (1)

  monitoramento e medição do desempenho da segurança operacional;

  (2)

  gerenciamento da mudança;

  (3)

  melhoria contínua do SGSO.'
