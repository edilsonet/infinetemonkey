title: 153.57(b)
text: '(b) O operador de aeródromo deve estabelecer requisitos para monitoramento contínuo,

  acompanhamento da execução das defesas e medição do desempenho da segurança operacional
  com

  o objetivo de:

  (1)

  verificar o desempenho da segurança operacional;

  (2)

  verificar a eficácia dos controles de riscos à segurança operacional implantados.'
