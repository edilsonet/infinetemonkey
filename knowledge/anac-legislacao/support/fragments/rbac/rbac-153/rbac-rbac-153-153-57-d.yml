cite: 153.57(d)
title: 153.57(d)
text: '(d) O operador de aeródromo deve enviar para a ANAC, até o dia 20 dos meses de janeiro,
  maio

  e setembro, relatórios quadrimestrais do SGSO, conforme modelo disponibilizado pela ANAC.

  (1)

  Eventos de Segurança Operacional (ESO) caracterizados como acidente, incidente grave

  e incidente aeronáuticos devem ser comunicados à ANAC imediatamente, pelo meio disponível,
  e

  formalmente em até 48 horas da sua ocorrência, sem prejuízo às obrigações de comunicação
  aos

  órgãos do sistema de investigação e prevenção de acidentes aeronáuticos.'
