title: 153.57(e)
text: '(e) O operador de aeródromo deve utilizar, quando aplicável, as seguintes ferramentas
  para

  monitoramento e medição de desempenho da segurança operacional, considerando a complexidade

  de suas operações e o desempenho da segurança operacional aferido anteriormente:

  (1)

  relatos de segurança operacional;

  (2)

  auditorias internas de segurança operacional;

  (3)

  pesquisas de segurança operacional;

  (4)

  estudos de segurança operacional;

  (5)

  investigações internas de segurança operacional;


  Data da emissão: 15 de março de 2021.


  (6)

  relatórios de inspeção da ANAC.'
