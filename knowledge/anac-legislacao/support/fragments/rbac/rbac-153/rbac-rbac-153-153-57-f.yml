cite: 153.57(f)
title: 153.57(f)
text: '(f)

  O responsável pelo gerenciamento da segurança operacional deve avaliar periodicamente o

  desempenho da segurança operacional no aeródromo frente aos objetivos, metas e indicadores

  estabelecidos.

  (1)

  O responsável pelo gerenciamento da segurança operacional deve submeter a avaliação

  periódica do desempenho da segurança operacional no aeródromo à apreciação do gestor responsável

  do aeródromo. (Redação dada pela Resolução nº 503, de 07.02.2019)

  (2)

  O gestor responsável do aeródromo deve submeter a avaliação periódica do desempenho

  do SGSO à apreciação do operador de aeródromo, nos casos de delegação da função de gestor

  responsável, conforme parágrafo 153.13(b). (Redação dada pela Resolução nº 503, de 07.02.2019)

  (3)

  O operador de aeródromo deve definir e implantar ações para correção de desvios

  verificados na avaliação de desempenho da organização frente aos objetivos, metas e indicadores

  estabelecidos previamente.'
