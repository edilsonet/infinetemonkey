title: 153.57(g)
text: '(g) O operador de aeródromo deve estabelecer um programa de auditorias periódicas de

  segurança operacional, com a finalidade de verificar:

  (1)

  o cumprimento dos requisitos regulamentares;

  (2)

  a conformidade dos procedimentos implementados com a política e objetivos de

  segurança operacional pré-estabelecidos;

  (3)

  a conformidade das atividades executadas com os procedimentos estabelecidos pelo

  operador de aeródromo;

  (4)

  a adequação dos recursos existentes para a execução das atividades;

  (5)

  a adequação e o desempenho dos recursos humanos frente aos procedimentos

  implementados.'
