cite: 153.57(i)
title: 153.57(i)
text: '(i)

  Cada auditoria realizada deve ser consolidada em relatório, contendo:

  (1)

  o período de sua realização;

  (2)

  a relação dos auditores envolvidos;

  (3)

  as atividades, áreas ou funções auditadas;

  (4)

  os métodos utilizados;

  (5)

  os principais resultados;

  (6)

  as não-conformidades identificadas;

  (7)

  as propostas de ações corretivas e preventivas.'
