cite: 153.57(l)
title: 153.57(l)
text: '(l)

  O operador de aeródromo deve estabelecer e documentar requisitos para buscar a melhoria

  contínua do SGSO implantado, compreendendo:

  (1)

  execução de ações corretivas para eliminar as causas de desempenho da segurança

  operacional inferior ao planejado;

  (2)

  execução de ações para prevenir o desempenho da segurança operacional inferior ao

  planejado.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
