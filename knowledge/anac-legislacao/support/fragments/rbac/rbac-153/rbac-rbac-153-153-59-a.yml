title: 153.59(a)
text: '(a) Treinamento e qualificação: (Redação dada pela Resolução nº 382, de 14 de junho
  de 2016)

  (1)

  O operador de aeródromo deve estabelecer e manter um PISOA, a fim de assegurar que

  o pessoal envolvido com atividades relacionadas à segurança operacional esteja qualificado
  e treinado

  para desempenhar suas funções, conforme disposto no parágrafo 153.37(b). (Redação dada pela

  Resolução nº 382, de 14 de junho de 2016)'
