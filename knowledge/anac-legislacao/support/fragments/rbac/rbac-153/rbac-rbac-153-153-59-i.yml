title: 153.59(i)
text: '(i) comunicar informações críticas sobre segurança operacional;

  (ii) explicar sobre a adoção de ações específicas de segurança operacional;

  (iii) explicar sobre inclusão ou alterações de procedimentos de segurança operacional; e

  (iv) transmitir outras informações julgadas relevantes no que tange à segurança operacional.'
