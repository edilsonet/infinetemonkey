title: 153.61(a)
text: '(a) O operador de aeródromo deve estabelecer, documentar e submeter à ANAC um

  planejamento formal para implantação do SGSO.

  (1)

  O planejamento formal para a implantação do SGSO deve ter prazo máximo de até 48

  (quarenta e oito) meses a partir da data de protocolização do documento na ANAC.'
