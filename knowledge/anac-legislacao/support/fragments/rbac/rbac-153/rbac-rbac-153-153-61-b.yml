cite: 153.61(b)
title: 153.61(b)
text: '(b) O operador de aeródromo deve consolidar seu planejamento formal para implantação
  em um

  cronograma identificando cada atividade, os respectivos prazos para execução e sua situação
  quanto

  à execução.

  (1)

  O cronograma deve apresentar as atividades referentes à implantação das abordagens

  reativa, preventiva e preditiva do gerenciamento da segurança operacional, além dos elementos
  de

  garantia da segurança operacional e promoção da segurança operacional de forma consolidada
  em

  fases específicas.

  (2)

  Os elementos relacionados à abordagem reativa devem ser implantados até o prazo

  máximo de 24 (vinte e quatro) meses, a contar da data definida para início da implantação
  do SGSO.

  (3)

  Os elementos relacionados à abordagem preventiva devem ser implantados até o prazo

  máximo de 36 (trinta e seis) meses, a contar da data definida para início da implantação
  do SGSO.


  Data da emissão: 15 de março de 2021.


  (4)

  Os elementos relacionados à abordagem preditiva e à garantia da segurança operacional

  devem ser implantados até o prazo máximo de 48 (quarenta e oito) meses, a contar da data
  definida

  para início da implantação do SGSO.'
