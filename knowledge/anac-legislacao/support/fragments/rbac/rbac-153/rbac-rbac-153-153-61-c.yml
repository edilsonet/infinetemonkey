title: 153.61(c)
text: '(c) O operador de aeródromo deve estabelecer e documentar requisitos para controle
  da

  implantação das atividades estabelecidas no planejamento formal, incluindo revisão ordinária
  do

  planejamento formal com periodicidade no mínimo semestral e revisões extraordinárias quando

  julgadas necessárias.'
