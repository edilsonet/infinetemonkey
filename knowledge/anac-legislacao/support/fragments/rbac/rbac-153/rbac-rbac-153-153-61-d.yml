title: 153.61(d)
text: '(d) O operador de aeródromo que submeter seu planejamento formal para implantação do
  SGSO

  à ANAC está sujeito à fiscalização quanto ao seu cumprimento de acordo com os compromissos

  estabelecidos e sujeito às sanções cabíveis pelo seu descumprimento.'
