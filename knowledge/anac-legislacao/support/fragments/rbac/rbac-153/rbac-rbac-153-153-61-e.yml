title: 153.61(e)
text: '(e) O operador de aeródromo deve elaborar e enviar à ANAC, até o dia 20 de janeiro
  de cada

  ano, relatório anual com dados e informações referentes ao cumprimento das atividades estabelecidas

  em seu planejamento formal para implantação do SGSO.'
