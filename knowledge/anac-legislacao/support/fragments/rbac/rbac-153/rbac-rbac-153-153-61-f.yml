title: 153.61(f)
text: '(f)

  O operador de aeródromo deve apresentar, juntamente com o planejamento formal para

  implantação do SGSO, no mínimo, o seguinte conjunto de conteúdos do MGSO:

  (1)

  os elementos referentes à política e objetivos de segurança operacional, incluindo a

  discriminação das responsabilidades dos responsáveis elencados no parágrafo 153.15(a); (Redação

  dada pela Resolução nº 503, de 07.02.2019)

  (2)

  os requisitos para controle da documentação relacionada ao SGSO;

  (3)

  a metodologia para avaliação e mitigação de risco, constante do parágrafo 153.55(c);

  (4)

  os elementos para promoção da segurança operacional coerentes com o estágio de

  implantação do SGSO.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
