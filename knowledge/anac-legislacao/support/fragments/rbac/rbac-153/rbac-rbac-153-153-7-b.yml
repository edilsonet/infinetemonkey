text: '(b) A classe do aeródromo é definida em função do número de passageiros processados,

  considerando a média aritmética de passageiros processados no período de referência (vide
  seção

  153.1) e o tipo de voo que o aeródromo processa no ano corrente.

  (1)

  Quanto ao número de passageiros processados:


  Data da emissão: 15 de março de 2021.'
