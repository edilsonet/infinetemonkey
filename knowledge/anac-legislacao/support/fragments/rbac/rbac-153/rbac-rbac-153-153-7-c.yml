title: 153.7(c)
text: '(c) Em aeródromo novo, que possua menos de 3 (três) anos de operação, o operador de

  aeródromo deve declarar à ANAC a classe em que pretende operar.

  (1)

  A classe atribuída ao aeródromo novo deve ser avaliada durante os 2 (dois) primeiros

  anos de sua operação, com vistas à adequação de classe se constatada ser esta inferior à
  situação real

  de movimento e tipo de voos nele processados.'
