title: 153.7(d)
text: '(d) O operador de aeródromo que tenha alteração na classe de seu aeródromo, enquadrando-se

  em classe superior, tem o prazo de até 180 (cento e oitenta) dias a partir de seu conhecimento
  para

  adequação aos requisitos exigidos para o novo enquadramento, momento a partir do qual estará

  sujeito a providências administrativas por não-cumprimento de regra.

  (1)

  O operador de aeródromo Classe I-A que pretenda processar voo regular deve cumprir os

  requisitos da Classe I-B previamente ao início das operações regulares.'
