title: 153.7(e)
text: '(e) A ANAC pode enquadrar qualquer aeródromo em classe superior àquela em que este
  seria

  classificado pelo parágrafo 153.7(b) e seguintes, desde que previamente justificado em função
  da

  complexidade da operação aeroportuária, da frequência anual de pousos ou do risco à segurança

  operacional.'
