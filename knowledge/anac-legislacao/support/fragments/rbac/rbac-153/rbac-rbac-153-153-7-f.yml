title: 153.7(f)
text: '(f)

  A ANAC pode estabelecer requisitos específicos a qualquer aeródromo, desde que

  previamente justificado em função da complexidade da operação aeroportuária, frequência
  anual de

  pousos, do risco à segurança operacional, de suas atividades de fiscalização ou do recebimento
  por

  parte desta Agência, de denúncia, de ações civis públicas, relatos de setores da aviação
  civil, dentre

  outros. (Redação dada Resolução nº 611, de 09.03.2021)

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)'
