title: 153.701(a)
text: '(a) Com vistas à definição da classe do aeródromo segundo critérios definidos na seção
  153.7,

  para os aeródromos que não possuírem o movimento de passageiros processados, deve-se considerar,

  para o ano de emissão da Emenda 01 deste Regulamento, a classe correspondente ao ano anterior.

  (1)

  O movimento de passageiros em aeródromos brasileiros nos anos de 2014 e 2016 não

  serão considerados para efeito da classificação estabelecida na seção 153.7 deste Regulamento,

  devendo ser repetidos os valores de movimentação de passageiros dos anos anteriores, 2013
  e 2015,

  respectivamente.'
