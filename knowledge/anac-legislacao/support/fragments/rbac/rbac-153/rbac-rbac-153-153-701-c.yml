text: '(c) O operador de aeródromo deve protocolar na ANAC, em até 12 (doze) meses a partir
  da data

  de emissão da Emenda 01 deste Regulamento, o planejamento formal para a implantação do SGSO,

  conforme estabelecido na Subparte C.'
