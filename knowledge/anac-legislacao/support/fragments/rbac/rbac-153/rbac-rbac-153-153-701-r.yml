title: 153.701(r)
text: '(r)

  O operador de aeródromo tem os seguintes prazos, a partir da entrada em vigor da Emenda

  nº 05 deste Regulamento, para realizar o primeiro monitoramento da funcionalidade do pavimento

  por meio de medições que representem numericamente um índice de serventia da condição geral
  da

  superfície do pavimento da pista de pouso e decolagem, da pista de táxi e do pátio de estacionamento

  de aeronaves, nos termos do parágrafo 153.203(b)(1)(ii):

  (1)

  até 12 (doze) meses, para os operadores de aeródromo Classe IV;

  (2)

  até 18 (dezoito) meses, para os operadores de aeródromo Classe III; e

  (3)

  até 24 (vinte e quatro) meses, para os operadores de aeródromo Classes II e I-B.'
