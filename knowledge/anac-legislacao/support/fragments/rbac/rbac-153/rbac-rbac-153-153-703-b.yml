text: '(b) A ANAC pode, a qualquer tempo, com vistas a esclarecer requisitos ou otimizar processos,

  publicar normas complementares, bem como estabelecer formulários, a serem disponibilizados
  no

  sítio da ANAC na rede mundial de computadores.'
