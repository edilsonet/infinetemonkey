title: 153.9(a)
text: '(a) Apêndice A

  (1)

  O Apêndice A deste RBAC 153 tem a finalidade de trazer, para cada classe de aeródromo

  estabelecida na seção 153.7, a aplicabilidade dos requisitos dispostos neste Regulamento
  e estabelecer

  requisitos específicos por classificação de aeródromos quando expressamente definido no
  texto

  normativo.


  Data da emissão: 15 de março de 2021.


  (2)

  O regulado, ao aplicar este Regulamento, deve utilizar a Tabela constante no Apêndice

  A, identificando a classe do aeródromo de interesse, segundo os critérios da seção 153.7,
  localizando

  a coluna no Apêndice A referente à classe em que este se enquadra e efetuando a leitura
  dos requisitos

  aplicáveis à classe atribuída ao aeródromo.

  (3)

  A regra de interpretação do Apêndice A utiliza as seções deste Regulamento como

  parâmetro básico de aplicabilidade. Caso um parágrafo tenha aplicabilidade diferenciada
  dentro da

  seção, este será expressamente citado no Apêndice A.'
