title: 153.9(b)
text: '(b) Atribuições e responsabilidades (Redação dada pela Resolução nº 382, de 14 de junho
  de

  2016)

  (1)

  Os requisitos referentes a atribuições e responsabilidades, contidos na Subparte B deste

  Regulamento, devem ser aplicados somente quando a Tabela do Apêndice A estabelecer que o

  requisito correspondente à matéria tratada é exigido à classe em que o aeródromo se enquadra.

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)


  Data da emissão: 15 de março de 2021.


  SUBPARTE B

  OPERADOR DE AERÓDROMO'
