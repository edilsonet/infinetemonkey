title: apendice-a-deste-regulamento(d)
text: '(d) O ato de designação dos responsáveis listados no parágrafo 153.15(a) deve indicar
  eventuais

  outras prerrogativas e responsabilidades atribuídas ao profissional além das fixadas neste

  Regulamento e deve ser mantido em conformidade com o disposto na seção 153.39.

  (1)

  Em até 30 dias após a designação, o operador de aeródromo deve enviar à ANAC o

  formulário cadastral contendo a identificação dos responsáveis listados no parágrafo 153.15(a),

  conforme modelos disponíveis no sítio da ANAC na rede mundial de computadores.'
