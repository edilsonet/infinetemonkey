text: '(d) Este Regulamento estabelece requisitos e parâmetros mínimos de segurança operacional
  a

  serem cumpridos durante as etapas de planejamento, execução, monitoramento e melhoria contínua

  das operações aeroportuárias, manutenção, resposta à emergência e gerenciamento do risco
  da fauna

  em aeródromos. (Redação dada Resolução nº 611, de 09.03.2021)'
