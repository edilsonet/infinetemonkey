title: C153.1(a)
text: '(a) Os programas de manutenção elencados no parágrafo 153.201(b) devem:

  (1)

  atender aos requisitos contidos na Subparte E deste Regulamento; (Redação dada pela

  Resolução nº 382, de 14 de junho de 2016)

  (2)

  ser específicos e adequados às características de suas facilidades e equipamentos;

  (3)

  ser de fácil entendimento e manuseio, com instruções claras e objetivas;

  (4)

  incluir os processos de monitoramento, manutenção preventiva e manutenção corretiva;

  (5)

  refletir a concentração de ações nos processos de monitoramento e manutenção

  preventiva de cada elemento;

  (6)

  ser estruturados de forma a obter a continuidade das ações até a solução definitiva da não

  conformidade detectada;

  (7)

  explicitar sua finalidade;

  (8)

  descrever a infraestrutura, equipamentos ou facilidades a serem mantidas ou verificadas;

  (9)

  conter desenho adequado mostrando os elementos do programa no sítio aeroportuário;

  (Redação dada pela Resolução nº 382, de 14 de junho de 2016)

  (10) conter níveis de serviço ou padrões de aceitabilidade para a operação dos equipamentos,

  infraestrutura ou facilidades da área operacional mantida;

  (11) definir a priorização para execução dos serviços de manutenção;

  (12) conter a programação das atividades; e

  (13) armazenar dados e realizar seu processamento e análise de forma a proporcionar a

  melhoria contínua do sistema.'
