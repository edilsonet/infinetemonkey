title: disposicoes-transitorias(b)
text: '(b) O operador de aeródromo tem até 31 de julho de 2018 para cumprimento do estabelecido
  no

  parágrafo 153.13(a).

  (1)

  Decorrido o período de flexibilização citado no parágrafo, serão suspensas as operações

  dos aeródromos que não possuírem pessoa jurídica atuando como operador de aeródromo.'
