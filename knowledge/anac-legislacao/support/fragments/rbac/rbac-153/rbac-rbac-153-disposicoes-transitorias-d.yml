title: disposicoes-transitorias(d)
text: '(d) O operador de aeródromo deve apresentar à ANAC, em até 12 (doze) meses a partir
  da data

  de emissão da Emenda 01 deste Regulamento, plano de ação para atendimento ao disposto na
  seção

  153.101, relativo ao posicionamento de equipamentos na área operacional do aeródromo, contendo
  a

  especificação de cada ação a ser implementada para atendimento deste Regulamento, bem como
  o

  cronograma para sua execução, com duração de até 24 (vinte e quatro) meses.

  (1)

  O operador de aeródromo que tiver apresentado à ANAC plano de ação em data anterior

  à emissão da Emenda 01 deste Regulamento terá até 36 (trinta e seis) meses a partir da referida
  data

  para implementar as ações descritas no plano e atender ao disposto na seção 153.101.'
