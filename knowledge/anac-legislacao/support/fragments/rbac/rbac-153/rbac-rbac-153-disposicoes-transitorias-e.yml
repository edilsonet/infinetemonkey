title: disposicoes-transitorias(e)
text: '(e) O operador de aeródromo que opere em baixa visibilidade deve, em até 12 (doze)
  meses a

  partir da data de emissão da Emenda 01 deste Regulamento, estabelecer e implantar um SOCMS
  com

  procedimentos específicos para tal condição, conforme exigido na seção 153.131 deste Regulamento.

  (1)

  O operador de aeródromo deve adotar medidas mitigadoras para operação em baixa

  visibilidade, a fim de garantir a segurança operacional do aeródromo até que SOCMS com

  procedimentos específicos para condição de baixa visibilidade seja implantado.'
