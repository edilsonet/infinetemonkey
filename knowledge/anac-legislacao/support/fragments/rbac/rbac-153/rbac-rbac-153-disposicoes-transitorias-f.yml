title: disposicoes-transitorias(f)
text: '(f)

  Operadores de aeródromos classe I-A têm até 6 (seis) meses, a partir da data de emissão
  da

  Emenda 01 deste Regulamento, para cumprimento dos requisitos aplicáveis segundo o Apêndice
  A.'
