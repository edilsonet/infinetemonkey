text: '(j)

  Até 31 de dezembro de 2019, para aeródromos Classes I e II, a função BA-MC poderá ser


  Data da emissão: 15 de março de 2021.


  exercida por Bombeiro de Aeródromo que tenha sido aprovado no Curso Básico de Bombeiro de

  Aeródromos (CBBA), mencionado no parágrafo 153.417(d)(7), que contenha a indicação de

  realização de treinamento de dirigibilidade de CCI de, no mínimo, oito horas.'
