title: disposicoes-transitorias(k)
text: '(k) Até as datas abaixo, a função BA-CE poderá ser exercida por profissional com experiência

  de 2 (dois) anos na função de bombeiro de aeródromo e que tenha sido aprovado em Curso de

  Habilitação de Bombeiro de Aeródromo 2 (BA-2):

  (1)

  até 30 de junho de 2020, em aeródromos Classe IV;

  (2)

  até 30 de junho de 2021, em aeródromos Classe III;

  (3)

  até 30 de junho de 2022, em aeródromos Classe II; e

  (4)

  até 30 de junho de 2023, em aeródromos Classe I.'
