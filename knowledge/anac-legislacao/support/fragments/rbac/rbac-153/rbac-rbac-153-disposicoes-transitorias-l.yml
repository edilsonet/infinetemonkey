title: disposicoes-transitorias(l)
text: '(l)

  O disposto no parágrafo 153.417(b) passa a ser exigível:

  (1)

  a partir de 1º de janeiro de 2020, para os operadores de aeródromos Classe III;

  (2)

  a partir de 1º de janeiro de 2021, para os operadores de aeródromos Classe II; e

  (3)

  a partir de 1º de janeiro de 2022, para os operadores de aeródromos Classe I.'
