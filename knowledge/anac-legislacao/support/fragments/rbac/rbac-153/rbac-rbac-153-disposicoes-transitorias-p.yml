title: disposicoes-transitorias(p)
text: '(p) O operador de aeródromo que não conte com via de acesso de emergência da SCI às
  pistas

  de pouso e decolagem tem até 48 (quarenta e oito) meses, a partir da entrada em vigor da
  Emenda nº

  04 deste Regulamento, para se adequar às exigências da seção 153.429.'
