title: disposicoes-transitorias(s)
text: '(s) O operador de aeródromo que já tenha elaborado um PGRF ou documentação semelhante

  deve rever os procedimentos à luz deste regulamento, de modo a identificar a necessidade
  de

  elaboração de uma IPF, de acordo com os critérios expostos nos parágrafos 153.501(e) e 153.501(f).'
