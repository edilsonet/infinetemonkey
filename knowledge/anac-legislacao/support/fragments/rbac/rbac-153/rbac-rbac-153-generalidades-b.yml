title: generalidades(b)
text: '(b) O SREA deve ser capaz de:

  (1)

  responder, em tempo hábil, às emergências aeroportuárias que ocorram no aeródromo e

  no seu entorno;

  (2)

  salvar vidas;

  (3)

  mitigar os danos materiais e as consequências decorrentes de uma emergência

  aeroportuária; e

  (4)

  estabelecer ações contingenciais para restauração das operações normais do aeródromo.'
