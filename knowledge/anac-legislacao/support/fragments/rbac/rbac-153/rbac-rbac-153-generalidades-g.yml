title: generalidades(g)
text: '(g) Ao estabelecer o planejamento de resposta às emergências aeroportuárias, o operador
  de

  aeródromo deve considerar critérios de preservação do local do acidente aeronáutico ou de
  evidências

  que possam contribuir para futuras investigações sob a responsabilidade dos órgãos competentes,

  observando, no entanto, que esses procedimentos não se sobreponham à necessidade ou à

  oportunidade de salvamento de vidas.'
