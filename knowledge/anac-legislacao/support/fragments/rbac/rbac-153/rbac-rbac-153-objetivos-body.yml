cite: objetivos
title: 'objetivos:'
text: 'objetivos:

  (1)

  gerenciar o risco de colisão entre animais e aeronaves em operação no aeródromo, por

  intermédio da identificação permanente dos perigos, bem como conhecimento e compilação dos

  eventos de segurança operacional existentes; e

  (2)

  controlar os perigos identificados, adotando, quando necessário, ações adicionais para

  mitigar o risco.'
