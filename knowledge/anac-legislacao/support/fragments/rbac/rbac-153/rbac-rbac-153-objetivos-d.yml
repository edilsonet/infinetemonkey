title: objetivos(d)
text: '(d) Todo PGRF deve tomar como base os resultados obtidos na IPF quanto aos aspectos

  relacionados à definição e priorização das ações adotadas para a redução do risco, que devem
  ser

  apresentadas no início do documento por referência, de modo a servir como diretriz para
  a

  implantação das ações de mitigação do risco da fauna no aeródromo.

  (1)

  O operador de aeródromo deve apresentar outras medidas mitigadoras à ANAC, caso não

  consiga inserir no PGRF, na totalidade ou em parte, as ações constantes do parágrafo 153.503(e)(5),

  cabíveis exclusivamente à sua área de atuação e que dependam de outras instituições e/ou
  demais

  procedimentos legais para serem iniciadas.

  (2)

  As diretrizes implicadas pela IPF dizem respeito às espécies de animais presentes na


  Data da emissão: 15 de março de 2021.


  região e que causem risco às operações aéreas, assim como aos focos de atração identificados,
  que

  devem nortear o planejamento e priorização das ações tomadas no PGRF.'
