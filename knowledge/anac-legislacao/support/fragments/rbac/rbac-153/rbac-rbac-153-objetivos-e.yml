text: '(e) Além da relação das espécies de animais e dos perigos já identificados na IPF,
  e respeitada

  a priorização das ações definidas por esta, o operador do aeródromo deve apresentar uma
  relação de

  todos os perigos presentes no sítio aeroportuário, que possam vir a constituir focos de
  atração de aves

  e outros animais.

  (1)

  Os possíveis focos de atração devem também ser representados geograficamente, em

  planta do aeroporto, disposta em “grade”.

  (2)

  Quando os focos de atração forem temporários, mas sua existência for recorrente em

  determinadas áreas, estas também devem ser mapeadas.'
