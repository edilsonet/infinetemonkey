title: objetivos(g)
text: '(g) O operador de aeródromo deve dispor de recursos e procedimentos para o monitoramento
  da

  fauna no sítio aeroportuário e em sua ASA, abrangendo as seguintes atividades conforme

  requisitos descritos em Instrução Suplementar específica: (Vide IS nº 153.505-001)

  (1)

  monitoramento permanente da fauna no sítio aeroportuário; e

  (2)

  registro e acompanhamento de relatos e denúncias.'
