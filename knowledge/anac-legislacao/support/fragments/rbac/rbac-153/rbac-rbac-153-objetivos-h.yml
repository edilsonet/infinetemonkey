title: objetivos(h)
text: '(h) O operador do aeródromo deve estabelecer uma rotina de procedimentos para preencher
  e

  encaminhar relatos de eventos de segurança operacional envolvendo fauna e aeronaves, de

  observação de aglomeração de aves no entorno do aeródromo que tenham provocado ou possam
  vir

  a provocar impacto nas operações aéreas, além de carcaças de animais localizadas na área
  operacional

  cuja morte tenha sido oriunda de colisão com aeronave ao Centro de Investigação e Prevenção
  de

  Acidentes Aeronáuticos - CENIPA (ou órgão que venha a sucedê-lo no registro e publicação
  de

  eventos de segurança operacional envolvendo fauna).

  (1)

  Nos casos em que a presença de animais for constante no aeródromo e em seu entorno, a

  ponto de provocar risco frequente às operações aéreas, o operador de aeródromo deve tomar

  providências para a inclusão e veiculação da informação em publicações aeronáuticas pertinentes,

  com informação, se possível, da(s) espécie(s) presente(s), da localização dos animais em
  relação ao

  sistema de pistas e do(s) horário(s) em que são mais presentes.

  (2)

  Ao efetuar os reportes de colisão com fauna o operador de aeródromo deve dispor de

  recursos e procedimentos para a identificação da(s) espécie(s) colididas.'
