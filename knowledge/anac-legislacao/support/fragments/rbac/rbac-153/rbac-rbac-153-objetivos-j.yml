title: objetivos(j)
text: '(j)

  O operador do aeródromo deve compor um banco de dados do risco da fauna, envolvendo

  os eventos de segurança operacional ocorridos no aeródromo. O acompanhamento estatístico
  dos

  dados obtidos, conforme previsto no parágrafo 153.505(h), deve seguir os seguintes critérios.

  (1)

  quantidade absoluta anual de eventos para os últimos 5 (cinco) anos; e

  (2)

  índice anual de colisões com fauna que tenham gerado acidente aeronáutico ou incidente

  aeronáutico grave, para os últimos 5 (cinco) anos.'
