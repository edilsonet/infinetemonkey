title: objetivos(l)
text: '(l)

  O operador do aeródromo deve avaliar o risco da fauna, quando das avaliações periódicas

  atinentes à revisão do PGRF, de acordo com requisitos descritos em Instrução Suplementar

  específica: (Vide IS nº 153.503-001)

  (1)

  Caso seja utilizada uma metodologia diferente da estabelecida pela ANAC, o operador de

  aeródromo deve apresentar justificativa técnica que explicite as razões para sua adoção.'
