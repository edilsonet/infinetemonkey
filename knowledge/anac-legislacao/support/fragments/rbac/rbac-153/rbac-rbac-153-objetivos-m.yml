title: objetivos(m)
text: '(m) O operador deve estabelecer procedimentos para a mitigação do risco da fauna no

  aeródromo, que podem ser de 4 (quatro) categorias:

  (1)

  Modificação ou exclusão de habitat, implicando na alteração, manutenção ou eliminação

  dos seguintes ambientes ou estruturas que provoquem atração de aves e outros animais, de
  acordo

  com os requisitos descritos em Instrução Suplementar específica. (Vide IS nº 153.505-001)'
