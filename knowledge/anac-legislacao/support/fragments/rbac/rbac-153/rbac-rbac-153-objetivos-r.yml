title: objetivos(r)
text: '(r)

  O operador de aeródromo cujo PGRF, quando de sua avaliação periódica, não esteja sendo

  capaz de reduzir o risco de colisão com fauna deve apresentar à ANAC uma das seguintes ações

  abaixo:

  (1)

  justificativa técnica, demonstrando que a situação é eventual ou independente das

  medidas que já vêm sendo tomadas no PGRF;

  (2)

  medidas mitigadoras adicionais, com plano de ações e prazo para execução; ou

  (3)

  proposta de elaboração de nova IPF.'
