title: objetivos(t)
text: '(t)

  O operador de aeródromo deve dispor de recursos e procedimentos para a divulgação das

  questões relativas ao perigo da fauna a seus funcionários, às empresas aéreas, empresas
  de serviços

  auxiliares ao transporte aéreo e demais entidades cujas atividades possam auxiliar na mitigação
  do

  risco da fauna, além das comunidades vizinhas ao aeródromo, quando couber.'
