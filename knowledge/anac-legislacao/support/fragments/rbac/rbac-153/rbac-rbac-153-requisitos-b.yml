title: requisitos(b)
text: '(b) Além de atender aos parâmetros da Tabela 153.407-1, e de cumprir com o prescrito
  no

  programa de manutenção previsto no parágrafo 153.201(b)(8), para ser considerado em linha,
  o CCI

  deve:

  (1)

  contar com 1 (um) profissional na função de Bombeiro de Aeródromo

  Motorista/Operador de CCI (BA-MC) e pelo menos outros 2 (dois) na função de Bombeiro de

  Aeródromo (BA), todos com o respectivo TP, conforme descrito no parágrafo 153.421(a);

  (2)

  ser capaz de prover o transporte, com segurança, da equipagem;

  (3)

  contar com os EPR descritos no parágrafo 153.421(b);

  (4)

  ser capaz de atingir o tempo-resposta de 3 (três) minutos, no caso do(s) CCI mencionados

  no parágrafo 153.409(a)(1) e ser capaz de atingir o tempo de 4 (quatro) minutos, no caso
  dos CCI

  mencionados no parágrafo 153.409(b); e

  (5)

  estar com tanques/reservatórios de água, LGE e PQ abastecidos em sua capacidade

  máxima.'
