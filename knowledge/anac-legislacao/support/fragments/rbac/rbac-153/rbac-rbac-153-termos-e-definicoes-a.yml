title: termos-e-definicoes(a)
text: '(a) Para efeito deste Regulamento aplicam-se os termos e as definições estabelecidos
  a seguir,

  bem como aqueles disponíveis no RBAC 01, denominado “Definições, Regras de Redação e

  Unidades de Medida para Uso nos RBAC” e demais normas relacionadas à matéria.

  (1)

  Aderência da pista de pouso e decolagem significa a propriedade física caracterizada pela

  força de contato entre os pneus da aeronave e a superfície da camada de rolamento do pavimento
  da

  pista, que assegura à aeronave resistência à derrapagem e controle direcional. As condições
  de

  aderência da pista de pouso e decolagem são fornecidas, principalmente, pelo atrito e pela
  textura

  superficial (microtextura e macrotextura).

  (1)-I Agentes extintores significa as substâncias capazes de interromper um processo de

  combustão. (Incluído pela Resolução nº 517, de 14.05.2019)

  (2)

  Análise de Impacto sobre a Segurança Operacional (AISO) significa o documento

  elaborado pelo operador de aeródromo com vistas à consolidação do processo de gerenciamento
  de

  risco da segurança operacional.

  (3)

  Área de manobras significa a parte do aeródromo utilizada para decolagem, pouso e táxi

  de aeronaves, excluindo-se o pátio de aeronaves.

  (4)

  Área de movimento significa a parte do aeródromo a ser utilizada para decolagem, pouso

  e táxi de aeronaves, consistindo na soma da área de manobras e do pátio de aeronaves.

  (4)-I Área de Segurança Aeroportuária - ASA significa a área circular do território de um
  ou

  mais municípios, definida a partir do centro geométrico da maior pista do aeródromo, com
  20 km

  (vinte quilômetros) de raio, cujos uso e ocupação estão sujeitos a restrições especiais
  em função da

  natureza atrativa de fauna. (Incluído pela Resolução nº 611, de 09.03.2021)

  (5)

  Área operacional, também denominada “lado ar”, significa o conjunto formado pela área

  de movimento de um aeródromo e terrenos e edificações adjacentes, ou parte delas, cujo acesso
  é

  controlado.

  (6)

  Área pavimentada significa a área composta de pavimento com revestimento à base de

  cimento asfáltico, cimento Portland ou pavimento intertravado.

  (7)

  Área protegida significa a área que compreende a pista de pouso e decolagem, a stopway,

  o comprimento da faixa de pista, a área em ambos os lados da pista de pouso e decolagem
  delimitada

  pela distância estabelecida pelo RBAC nº 154 para a posição de espera da referida pista,
  a área de

  segurança de fim de pista (RESA) e, se existente, a zona desimpedida (clearway)..

  (8)

  Auxílios visuais significa os dispositivos destinados a auxiliar a navegação aérea, tais

  como indicadores e dispositivos de sinalização horizontal e vertical, luzes e balizas.

  (9)

  Camada porosa de atrito significa a camada superficial do pavimento, projetada,

  construída e mantida com profundidade média da macrotextura classificada como “muito aberta”,
  de

  forma a proporcionar livre penetração de água.

  (9)-I Capacidade Extintora significa a medida do poder de extinção do fogo de um extintor,

  obtida em ensaio prático normalizado. (Incluído pela Resolução nº 517, de 14.05.2019)

  (10) Características físicas significa as características referentes ao número e à orientação
  das

  pistas, acostamentos das pistas, faixas de pistas, áreas de segurança no fim de pistas,
  zonas livres de

  obstáculos (“clearway”), zonas de parada (“stopway”), áreas de operação de rádio altímetro,
  pistas


  Data da emissão: 15 de março de 2021.


  de táxi, acostamentos das pistas de táxi, faixas de pistas de táxi, baias de espera, posições
  de espera

  nas pistas, posições intermediárias de espera, posições de espera de veículos em vias de
  serviços,

  pátios e posições isoladas de estacionamento de aeronaves.

  (11) Características operacionais significa as características referentes ao tipo de operação

  realizada no aeródromo.

  (12) [Reservado]. (Redação dada pela Resolução nº 517, de 14.05.2019)

  (13) Carro Contraincêndio de Aeródromo (CCI) significa o veículo projetado especificamente

  para cumprir as missões de resgate, salvamento e combate a incêndio em aeronaves.

  (13)-I Carro Contraincêndio de Aeródromo em Linha (CCI em Linha) significa o CCI apto a

  ser utilizado na resposta ao acionamento do SESCINC. (Incluído pela Resolução nº 517, de

  14.05.2019)

  (14) [Reservado]. (Redação dada pela Resolução nº 517, de 14.05.2019)

  (15) Centro de Operações de Emergência (COE) significa o local designado ou adaptado na

  estrutura do aeródromo de onde são realizadas as atividades de acionamento e coordenação
  da

  resposta a uma emergência aeroportuária.

  (15)-I Colisão com fauna significa evento em que ocorrer uma das situações descritas a seguir:'
