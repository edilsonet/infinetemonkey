title: 154.1(b)
text: '(b) Este Regulamento se aplica a toda pessoa natural ou jurídica de direito privado
  ou público,

  incluindo as organizações Federais, Estaduais e Municipais, que, direta ou indiretamente,
  esteja

  envolvida com a operação, construção, exploração, manutenção e projeto de aeródromos.'
