title: 154.1(e)
text: '(e) As regras referentes às características físicas e auxílios visuais estabelecidas
  em

  regulamentação específica para helipontos são de cumprimento obrigatório em componentes

  aeroportuários destinados exclusivamente à operação de aeronaves de asa rotativa em aeródromos

  públicos. (Incluído pela Resolução nº 471, de 16.05.2018)

  (1) Para instalações destinadas ao uso comum por aeronaves de asa fixa e aeronaves de asa

  rotativa, a exemplo de pistas de pouso e decolagem, pistas de taxi, pátios e posições de

  estacionamento, deverão ser observadas as regras do presente Regulamento, ressalvados os
  aspectos

  em que a regulamentação específica para helipontos for mais restritiva, para os quais deverão
  ser

  observadas as regras específicas de helipontos. (Incluído pela Resolução nº 471, de 16.05.2018)'
