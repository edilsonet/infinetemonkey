title: 154.101(a)
text: '(a) A coleta e o provimento dos dados aeronáuticos relacionados a aeródromos devem
  estar em

  conformidade com as especificações de exatidão, resolução e integridade estabelecidas pelo
  DECEA.

  (Redação dada pela Resolução nº 628, de 11.06.2021)'
