section_title: Elevações do aeródromo e da pista de pouso e decolagem
subsection_id: b
cite: 154.105(b)
title: 154.105(b)
text: '(b) Para um aeródromo utilizado pela aviação civil internacional em aproximações de
  não-

  precisão, a elevação e a ondulação do geoide em cada cabeceira, a elevação do fim da pista
  e quaisquer

  pontos significativos intermediários, altos ou baixos, ao longo da pista devem ser medidos
  com

  acurácia de, pelo menos, meio metro (0,5 m), e comunicados ao DECEA.'
