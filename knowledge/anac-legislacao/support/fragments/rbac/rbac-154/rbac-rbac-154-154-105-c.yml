cite: 154.105(c)
title: 154.105(c)
text: '(c) Para pistas de aproximação de precisão, a elevação e a ondulação do geoide da cabeceira,
  da

  elevação do fim da pista e da elevação mais alta da zona de toque devem ser medidas com
  a acurácia

  de, pelo menos, um quarto de metro (0,25 m), e comunicadas ao DECEA.

  NOTA - A ondulação do geoide deve ser medida de acordo com o sistema de coordenadas

  apropriado.'
