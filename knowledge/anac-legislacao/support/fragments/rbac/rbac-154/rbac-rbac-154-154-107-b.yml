cite: 154.107(b)
title: 154.107(b)
text: '(b) A temperatura de referência do aeródromo deve ser a média mensal das temperaturas
  máximas

  diárias para o mês mais quente do ano (sendo que o mês mais quente será o mês com maior

  temperatura mensal média). Essa temperatura deve ser calculada ao longo de um período de
  alguns

  anos.


  Data da emissão: 16 de junho de 2021.'
