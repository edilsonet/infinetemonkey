section_title: Resistência de pavimentos
subsection_id: b
cite: 154.111(b)
title: 154.111(b)
text: '(b) Devem ser observados os seguintes padrões mínimos:

  (1) a resistência de pavimentos destinados a aeronaves com peso de rampa superior a 5.700
  kg

  deve ser divulgada utilizando-se o método ACN-PCN; e

  (2) a resistência de pavimentos destinados a aeronaves com peso de rampa igual ou inferior
  a

  5.700 kg deve ser divulgada informando-se o peso máximo permitido da aeronave e a pressão
  máxima

  permitida dos pneus.'
