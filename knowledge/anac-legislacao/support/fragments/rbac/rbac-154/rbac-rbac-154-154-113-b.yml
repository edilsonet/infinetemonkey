section_title: Ponto de teste de altímetro antes do voo
subsection_id: b
cite: 154.113(b)
title: 154.113(b)
text: '(b) O ponto de teste de altímetro antes do voo deve estar situado em um pátio de aeronaves.

  NOTA 1 - A localização de um ponto de teste de altímetro antes do voo em um pátio de aeronaves

  permite que a verificação do altímetro seja feita antes da obtenção da autorização para
  o táxi e elimina

  a necessidade de parar para esse fim após ter deixado o pátio de aeronaves.

  NOTA 2 - Normalmente, todo o pátio de aeronaves pode servir como um ponto satisfatório de
  teste

  de altímetro antes do voo.'
