section_title: Ponto de teste de altímetro antes do voo
subsection_id: c
cite: 154.113(c)
title: 154.113(c)
text: '(c) A elevação de um ponto de teste de altímetro antes do voo deve ser dada como a
  elevação

  média, arredondada com precisão de um metro (ou um pé), da área na qual esse ponto se encontra.
  A

  elevação de qualquer porção de um ponto de teste de altímetro antes do voo deve estar dentro
  de 3 m

  da elevação média desse ponto.'
