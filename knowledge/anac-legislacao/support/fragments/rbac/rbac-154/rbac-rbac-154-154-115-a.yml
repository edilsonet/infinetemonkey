title: 154.115(a)
text: '(a) As distâncias declaradas listadas abaixo devem ser calculadas em metros arredondados:

  (1) Pista Disponível para Corrida de Decolagem (TORA);

  (2) Distância Disponível para Decolagem (TODA);

  (3) Distância Disponível para Aceleração e Parada (ASDA); e

  (4) Distância Disponível para Pouso (LDA).

  NOTA - Orientações sobre o cálculo das distâncias declaradas são apresentadas no Apêndice
  G deste

  RBAC.


  Data da emissão: 16 de junho de 2021.


  SUBPARTE C

  CARACTERÍSTICAS FÍSICAS

  SUBPARTE C - CARACTERÍSTICAS FÍSICAS'
