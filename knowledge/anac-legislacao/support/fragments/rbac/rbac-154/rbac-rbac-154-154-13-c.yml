title: 154.13(c)
text: '(c) Um código de referência de aeródromo - número e letra de código - que é selecionado
  para

  fins de planejamento de um aeródromo, deve ser determinado de acordo com as características
  das

  aeronaves que o aeródromo deverá atender.'
