title: 154.13(e)
text: '(e) O número de código para o elemento 1 deve ser determinado pela Tabela A-1, coluna
  1,

  selecionando-se o número de código correspondente ao maior valor dos comprimentos básicos
  de

  pista das aeronaves para as quais a pista deverá atender.

  NOTA - A determinação do comprimento básico de pista das aeronaves serve unicamente para
  a

  seleção do número do código, sem pretender influenciar no comprimento real da pista existente.'
