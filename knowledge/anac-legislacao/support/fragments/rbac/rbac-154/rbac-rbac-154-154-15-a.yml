cite: 154.15(a)
title: 154.15(a)
text: '(a) Para efeito deste Regulamento, aplicam-se os termos e as definições estabelecidos
  a seguir,

  bem como aqueles disponíveis no RBAC nº 01, denominado “Definições, Regras de Redação e

  Unidades de Medida para Uso nos RBAC”, e demais normas relacionadas à matéria.

  (1) Acostamento significa a área adjacente à borda de um pavimento, preparada de modo a

  oferecer uma transição entre o pavimento e a superfície adjacente.

  (2) Acurácia significa o grau de conformidade entre o valor estimado ou medido e o valor
  real.

  NOTA - Para dados de localização medidos, a acurácia é geralmente expressa em termos de
  uma

  distância a partir de uma determinada posição, dentro da qual há uma confiabilidade definida
  em

  relação à real localização do ponto.

  (3) Aeronave crítica significa a aeronave em operação, ou com previsão de operar em um

  aeródromo, que demande os maiores requisitos em termos de configuração e dimensionamento
  da

  infraestrutura aeroportuária, em função de suas características físicas e operacionais.

  (4) Alcance Visual de Pista (RVR) significa a distância na qual o piloto de uma aeronave
  que

  se encontra no eixo de uma pista de pouso e decolagem pode ver a sinalização horizontal
  na superfície

  da pista ou as luzes que a delineiam ou identificam seu eixo.

  (5) Altura de Decisão (Decision Height - DH) significa uma altura específica a partir do
  nível

  da cabeceira da pista de pouso e decolagem na qual, em um procedimento de aproximação por

  instrumentos, o piloto deve decidir se prossegue na aproximação para pouso ou se inicia


  Data da emissão: 16 de junho de 2021.


  imediatamente um procedimento de aproximação perdida (arremetida) caso não tenha avistado
  uma

  referência visual requerida.

  (6) Altura elipsoide (altura geodésica) significa a altura relativa à elipsoide de referência,

  medida ao longo da normal externa elipsoidal através do ponto em questão.

  (7) Altura ortométrica significa a altura de um ponto relativo ao geoide, geralmente

  apresentado como uma elevação MSL.

  (8) Área de giro de pista de pouso e decolagem significa uma área definida em um aeródromo

  terrestre, adjacente a uma pista de pouso e decolagem, com o propósito de permitir a uma
  aeronave

  completar uma curva de 180 ° sobre a pista de pouso e decolagem.

  (9)

  Aproximação por instrumentos tipo A significa a aproximação por instrumentos com uma

  altura mínima de descida ou DH mínima igual ou superior a 75 metros (250 pés).

  (10) Aproximação por instrumentos tipo B significa a aproximação por instrumentos com uma

  DH inferior a 75 metros (250 pés), classificada em CAT I, CAT II e CAT III A, B e C.

  (11) Aproximações paralelas dependentes significa as aproximações simultâneas em pistas

  instrumento paralelas, ou quase paralelas, onde são prescritas as separações radar mínimas
  entre

  aeronaves nos prolongamentos dos eixos de pistas adjacentes.

  (12) Aproximações paralelas independentes significa as aproximações simultâneas em pistas

  instrumento paralelas, ou quase paralelas, onde não são prescritas as separações radar mínimas
  entre

  aeronaves nos prolongamentos dos eixos de pistas adjacentes.

  (13) Área de manobras significa a parte do aeródromo utilizada para a decolagem, pouso e

  táxi de aeronaves, excluindo-se os pátios de aeronaves.

  (14) Área de movimento significa a parte do aeródromo a ser utilizada para decolagem, pouso

  e táxi de aeronaves, consistindo na área de manobras e pátios de aeronaves.

  (15) Área de pouso significa a parte de uma área de movimento destinada ao pouso ou

  decolagem de aeronaves.

  (16) Área de Segurança de Fim de Pista (Runway End Safety Area - RESA) significa a área

  simétrica ao longo do prolongamento do eixo da pista de pouso e decolagem e adjacente ao
  fim da

  faixa de pista, utilizada primordialmente para reduzir o risco de danos a aeronaves que
  realizem o

  toque antes de alcançar a cabeceira (undershoot) ou que ultrapassem acidentalmente o fim
  da pista

  de pouso e decolagem (overrun).

  (17) Área de sinalização significa a área do aeródromo utilizada para exibir sinalização
  de

  solo.

  (17)-I Autoland significa a operação de aproximação e pouso utilizando sistema embarcado
  de

  controle automático da aeronave; (Incluído pela Resolução nº 513, de 16.04.2019)

  (18) Baia de espera significa a área definida onde uma aeronave pode esperar ou ser

  ultrapassada, de modo a facilitar o movimento eficiente de aeronaves na superfície.

  (19) Baliza significa o objeto instalado acima do nível da superfície destinado a indicar
  um

  obstáculo ou definir um limite.

  (20) Barreta significa o conjunto de três ou mais luzes aeronáuticas de superfície,

  posicionadas próximas e numa linha transversal, de modo que, de certa distância, pareçam
  ser uma

  pequena barra luminosa.


  Data da emissão: 16 de junho de 2021.


  (21) Base de rodas (wheel base) significa a distância entre o trem de nariz e o centro

  geométrico do trem de pouso principal.

  (22) Cabeceira significa o início da parcela da pista de pouso e decolagem destinada ao
  pouso.

  (23) Cabeceira recuada ou deslocada significa a cabeceira não localizada na extremidade
  de

  uma pista de pouso e decolagem.

  (24) Calendário significa o sistema de referência temporal discreto que fornece a base para

  definição da posição temporal até a resolução de um dia (Norma ISO 19108, Informação geográfica

  - Modelo temporal).

  (25) Calendário gregoriano significa o calendário de uso geral que foi introduzido em 1528

  para definir um ano que se aproxima mais do ano tropical do que o calendário juliano (Norma
  ISO

  19108, Informação geográfica - Modelo temporal).

  NOTA - No calendário gregoriano, os anos comuns têm 365 dias e os anos bissextos, 366 dias,

  divididos em 12 meses sequenciais.

  (26) [Reservado] (Redação dada pela Resolução nº 628, de 11.06.2021)

  (27) Código de referência do aeródromo significa o código alfanumérico determinado para
  o

  aeródromo para fins de planejamento, com base nas características físicas e operacionais
  da aeronave

  crítica para ele estabelecida.

  (28) Comprimento básico de pista de aeronave significa o comprimento mínimo de pista

  necessário para a decolagem com peso máximo de decolagem certificado, ao nível do mar, em

  condições atmosféricas normais, ar parado e declividade nula de pista, conforme apresentado
  no

  manual de voo da aeronave, determinado pela autoridade de certificação ou nas informações

  equivalentes do fabricante da aeronave.

  (29) Comprimento de pista significa o comprimento balanceado de pista para aeronaves,

  quando aplicável, ou a distância de decolagem, em outros casos.

  NOTA - O Apêndice G deste RBAC fornece informações a respeito do conceito de comprimento

  balanceado de pista.

  (30) Confiabilidade do sistema de iluminação significa a probabilidade de toda a instalação

  poder operar dentro das tolerâncias especificadas e do sistema estar em condições operacionais
  para

  uso.

  (31) Datum significa qualquer quantidade ou conjunto de quantidades que pode servir como

  referência ou base para o cálculo de outras quantidades (Norma ISO 19104, Informação geográfica

  - Terminologia).

  (32) Datum geodésico significa o conjunto mínimo de parâmetros necessários para definir
  a

  localização e a orientação do sistema de referência local relativamente ao sistema/base
  de referência

  global.

  (33) Declinação de estação significa a variação de alinhamento entre a radial zero grau
  de um

  VOR e o norte verdadeiro, determinada no momento em que a estação VOR for calibrada.

  (34) Decolagens paralelas independentes significa decolagens simultâneas a partir de pistas

  instrumento paralelas ou quase paralelas.


  Data da emissão: 16 de junho de 2021.


  (35) Densidade de tráfego do aeródromo significa o número médio de movimentos na hora-

  pico, sendo representada pela média aritmética de movimentos na hora-pico de cada dia ao
  longo de

  um ano e classificada em:'
