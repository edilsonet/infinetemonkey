title: 154.15(i)
text: '(i) Pista de aproximação de não-precisão: pista provida de auxílios visuais e não-visuais

  destinada a operações de pouso após uma operação de aproximação por instrumento tipo A e
  com

  visibilidade não inferior a 1000 m.

  (ii) Pista de aproximação de precisão, Categoria I: pista provida de auxílios visuais e
  não-

  visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo B

  com uma altura de decisão (DH) não inferior a 60 m (200 ft) e com visibilidade não inferior
  a 800 m

  ou alcance visual de pista não inferior a 550 m.

  (iii) Pista de aproximação de precisão, Categoria II: pista provida de auxílios visuais
  e não-

  visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo B

  com uma altura de decisão (DH) inferior a 60 m (200 ft), mas não inferior a 30 m (100 ft),
  e alcance

  visual de pista não inferior a 300 m.


  Data da emissão: 16 de junho de 2021.


  (iv) Pista de aproximação de precisão, Categoria III: pista provida de auxílios visuais
  e

  não-visuais destinada a operações de pouso após uma operação de aproximação por instrumento
  tipo

  B com altura de decisão (DH) inferior a 30 m (100 ft), ou operações sem altura de decisão
  (DH) e

  com alcance visual da pista inferior a 300m ou sem limitações de alcance visual de pista.
  (Redação

  dada pela Resolução nº 628, de 11.06.2021)

  NOTA - Os auxílios visuais não precisam necessariamente estar vinculados à proporção de
  auxílios

  não-visuais fornecidos. O critério para a seleção dos auxílios visuais deve ser baseado
  nas condições

  nas quais as operações devem ser realizadas.

  (69) Pista para operação visual significa a pista de pouso e decolagem para a operação de

  aeronaves utilizando procedimento de aproximação visual ou procedimento de aproximação por

  instrumento a um ponto além do qual a aproximação possa continuar em condições meteorológicas

  visuais (VMC).

  (70) Pista(s) principal(is) significa a(s) pista(s) de pouso e decolagem utilizada(s)

  preferencialmente às outras, sempre que as condições permitirem.

  (71) Pistas quase paralelas significa as pistas de pouso e decolagem que não se interceptam
  e

  cujos prolongamentos de seus eixos perfazem um ângulo de convergência/divergência menor
  ou igual

  a 15°.

  (72) Ponto de referência do aeródromo significa a localização geográfica designada de um

  aeródromo.

  (73) Posição de espera de pista de pouso e decolagem significa a posição estabelecida para

  proteger pista de pouso e decolagem, área crítica ou sensível de um equipamento de aproximação
  de

  precisão ou superfície limitadora de obstáculos, na qual uma aeronave taxiando ou um veículo
  devem

  parar e esperar, a menos que autorizados a prosseguir pela torre de controle do aeródromo.

  NOTA 1 - Em aeródromo onde não haja torre de controle ou quando esta estiver temporariamente

  inoperante, a posição de espera de pista de pouso e decolagem indica a posição além da qual
  aeronave

  ou veículo não deve prosseguir até que todas as devidas transmissões de rádio tenham sido
  executadas

  e até que tenha sido confirmado que a pista de pouso e decolagem e as áreas de aproximação
  estão

  livres de tráfego conflitante.

  NOTA 2 - Na fraseologia radiotelefônica, a expressão “ponto de espera” é usada para designar
  a

  posição de espera de pista de pouso e decolagem.

  (74) Posição de espera na via de serviço significa a posição designada na qual os veículos

  podem ser solicitados a esperar.

  (75) Posição de estacionamento de aeronave significa a área designada em um pátio de

  aeronaves com o propósito de ser utilizada para estacionar uma aeronave.

  (76) Posição intermediária de espera significa a posição designada para o controle de tráfego

  aéreo na qual a aeronave que esteja taxiando e os veículos que estejam transitando devem,
  quando

  assim instruídos pela torre de controle do aeródromo, parar e esperar até que lhes seja
  autorizado

  prosseguir.

  (77) Pouso interrompido significa a manobra de pouso inesperadamente descontinuada em

  qualquer ponto abaixo da altitude/altura livre de obstáculos (OCA/H).


  Data da emissão: 16 de junho de 2021.


  (78) Qualidade dos dados significa o grau ou nível de confiança de que os dados fornecidos

  estarão em conformidade com os requisitos do usuário em termos de acurácia, resolução e

  integridade.

  (79) Sinal de identificação do aeródromo significa a sinalização colocada em um aeródromo

  de forma a auxiliar sua identificação a partir de uma aeronave em voo.

  (80) Sinalização significa as marcações, placas e luzes dispostas na superfície da área
  de

  movimento destinadas a fornecer informações aeronáuticas.

  (81) Sinalização de obstáculo significa a pintura, iluminação e balizas dispostas nos

  obstáculos com a finalidade de fazê-los contrastantes em relação ao meio em que se encontram.

  (82) Sinalização horizontal significa a informação aeronáutica, que compõe os auxílios visuais

  à navegação aérea, por meio de pintura na pista de pouso e decolagem, na pista de táxi,
  no pátio de

  aeronaves ou em outra área do aeródromo, destinada a orientar ou prestar informações aos
  pilotos de

  aeronaves e motoristas que trafegam nas vias de serviços.

  (83) Sinalização luminosa significa a informação aeronáutica que compõe os auxílios visuais

  à navegação aérea composta por todas as luzes de pista de pouso e decolagem, de pista de
  táxi e de

  pátio de aeronaves.

  (84) Sinalização vertical significa a informação aeronáutica que compõe os auxílios visuais
  à

  navegação aérea composta por placas ou painéis destinados a fornecer mensagens podendo ser:'
