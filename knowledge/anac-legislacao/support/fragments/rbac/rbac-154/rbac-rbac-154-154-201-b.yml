title: 154.201(b)
text: '(b) Localização da cabeceira

  (1) A cabeceira deve estar localizada na extremidade da pista de pouso e decolagem, a menos

  que considerações operacionais justifiquem a escolha da cabeceira em outra localização.

  NOTA - Orientações a respeito da localização da cabeceira estão presentes no Apêndice G
  deste

  RBAC.

  (2) Quando for necessário deslocar a cabeceira de sua posição normal, seja permanente ou

  temporariamente, devem ser considerados os diversos fatores que podem ter influência na
  localização

  dessa cabeceira. Onde o deslocamento for devido ao fato de a pista estar fora de serviço,
  uma área

  limpa e nivelada de, no mínimo, 60 m de extensão deve ser disponibilizada entre a área fora
  de serviço

  e a cabeceira recuada. Deve ser provida, também, uma distância adicional para satisfazer
  os requisitos

  da RESA, quando apropriado.

  NOTA - Orientações sobre fatores que podem ser considerados na determinação da localização
  de

  uma cabeceira recuada podem ser encontradas no Apêndice G deste RBAC.'
