  a. A largura de uma pista de aproximação de precisão não deve ser inferior a 30 m quando
  o número

  de código for 1 ou 2.

  NOTA - As combinações de números do código e larguras exteriores entre as rodas do trem
  de pouso

  principal (OMGWS) para as quais as larguras de pista de pouso e decolagem são especificadas
  foram

  desenvolvidas para características típicas de aeronaves. (Redação dada pela Resolução nº
  465, de

  13.03.2018)


  Data da emissão: 16 de junho de 2021.'
