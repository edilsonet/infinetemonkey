text: '(d) Largura de pistas de pouso e decolagem

  A largura de uma pista de pouso e decolagem não deve ser inferior à dimensão apropriada

  especificada na seguinte tabela:

  Tabela C-1. Largura de pista de pouso e decolagem associada à OMGWS (Alterado pela Resolução
  nº

  465, de 13.03.2018)


