title: 154.201(h)
text: '(h) Superfície de pistas de pouso e decolagem

  (1) A superfície de uma pista de pouso e decolagem não deve possuir irregularidades que

  possam afetar adversamente a decolagem, o pouso ou o táxi das aeronaves.


  Data da emissão: 16 de junho de 2021.


  NOTA - Irregularidades na superfície podem afetar adversamente a decolagem, o pouso ou o
  táxi de

  uma aeronave ao causar trancos, saltos, vibrações excessivas ou outras dificuldades no controle
  da

  aeronave.

  (2) Quando o revestimento for sulcado ou ranhurado (grooved), os sulcos ou ranhuras devem

  ser ou perpendiculares ao eixo da pista ou paralelos às juntas transversais não perpendiculares,
  quando

  for o caso.

  (3) A superfície de uma pista de pouso e decolagem pavimentada deve oferecer características

  de aderência adequadas para operação segura das aeronaves. (Incluído pela Resolução nº 628,
  de

  11.06.2021)'
