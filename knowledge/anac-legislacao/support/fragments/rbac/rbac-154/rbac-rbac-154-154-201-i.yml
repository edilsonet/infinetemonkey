section_title: Pistas de pouso e decolagem
subsection_id: i
cite: 154.201(i)
title: 154.201(i)
text: '(i) pode ser diminuída em 30 m para cada 150 m em que a pista de pouso for decalada

  aproximando-se da aeronave em pouso, até um mínimo de 300 m; e

  (ii) deve ser aumentada em 30 m para cada 150 m em que a pista de pouso for decalada

  afastando-se da aeronave em pouso.

  (4) Para aproximações paralelas independentes, combinações de distâncias mínimas e outras

  condições relacionadas que não as previstas em norma específica do DECEA podem ser aplicadas

  quando for determinado que essas combinações não irão afetar adversamente a segurança operacional

  da aeronave.'
