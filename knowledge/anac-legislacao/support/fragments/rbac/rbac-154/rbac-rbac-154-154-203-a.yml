title: 154.203(a)
text: '(a) Disposições gerais

  (1) Os acostamentos de pista de pouso e decolagem devem ser implantados em uma pista onde

  a letra de código for D, E ou F. (Redação dada pela Resolução nº 465, de 13.03.2018)'
