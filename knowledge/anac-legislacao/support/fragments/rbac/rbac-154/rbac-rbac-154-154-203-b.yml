title: 154.203(b)
text: '(b) Largura dos acostamentos de pista de pouso e decolagem

  Os acostamentos de pista de pouso e decolagem devem estender-se simetricamente em cada um

  dos lados da pista, de modo que a largura total da pista e de seus acostamentos não seja
  inferior a:

  (1) 60 m, onde a letra de código for D ou E para aeronaves com OMGWS maior ou igual a 9

  m e menor que 15 m;

  (2) 60 m onde a letra de código for F para aeronaves de dois ou três motores com OMGWS

  maior ou igual a 9 m e menor que 15 m; e

  (3) 75 m, onde a letra de código for F para aeronaves de quatro (ou mais) motores com

  OMGWS maior ou igual a 9 m e menor que 15 m. (Redação dada pela Resolução nº 465, de

  13.03.2018)'
