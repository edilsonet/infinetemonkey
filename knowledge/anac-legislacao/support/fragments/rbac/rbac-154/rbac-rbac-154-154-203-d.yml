title: 154.203(d)
text: '(d) Resistência dos acostamentos de pista de pouso e decolagem

  (1) A porção dos acostamentos entre a borda e a distância de 30 m a partir do eixo da pista
  de

  pouso e decolagem deve ser preparada ou construída de modo a ser capaz de, no caso de uma
  aeronave

  sair acidentalmente da pista, suportar a aeronave, sem provocar danos estruturais à mesma,
  bem como

  prover capacidade de suporte aos veículos que possam operar nos acostamentos. (Redação dada
  pela

  Resolução nº 465, de 13.03.2018)


  Data da emissão: 16 de junho de 2021.'
