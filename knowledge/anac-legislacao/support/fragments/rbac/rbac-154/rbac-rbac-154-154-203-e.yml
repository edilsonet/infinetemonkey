cite: 154.203(e)
title: 154.203(e)
text: '(e) Superfície dos acostamentos de pista de pouso e decolagem

  (1) O acostamento da pista de pouso e decolagem deve ser preparado ou construído para resistir

  à erosão e evitar a ingestão de materiais de superfície pelos motores das aeronaves.

  (2) Acostamentos para aeronaves com letra de código F devem ser pavimentados para uma

  largura total de pista e acostamento de, no mínimo, 60 m. (Incluído pela Resolução nº 465,
  de

  13.03.2018)'
