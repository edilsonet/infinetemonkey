section_title: Acostamentos de pista de pouso e decolagem
subsection_id: i
cite: 154.203(i)
title: 154.203(i)
text: '(i) ser compatível com a necessidade de drenagem e não comprometer o controle direcional

  da aeronave;

  (ii) permitir que o próprio acostamento não seja considerado obstáculo;

  (iii) possibilitar que aeronaves retornem à pista de pouso e decolagem em caso de excursão

  lateral.'
