cite: 154.205(a)
title: 154.205(a)
text: '(a) Disposições gerais

  (1) Uma área de giro de pista de pouso e decolagem deve ser provida nas cabeceiras que não

  são servidas por uma pista de táxi, ou não dispõem de uma área de giro de pista de táxi,
  quando a

  letra do código for D, E ou F, para facilitar uma curva de 180º e alinhamento das aeronaves
  na

  cabeceira. Ver Figura C-1B. (Redação dada pela Resolução nº 465, de 13.03.2018)


  Figura C-1B. Disposição típica de uma área de giro de pista de pouso e decolagem. (Alterado
  pela

  Resolução nº 465, de 13.03.2018)

  NOTA - Tais áreas podem também ser úteis se disponibilizadas ao longo da pista de pouso
  e

  decolagem para reduzir o tempo e a distância de táxi para aeronaves que não demandam o

  comprimento total da pista de pouso.

  (2) A área de giro de pista de pouso pode ser colocada em qualquer um dos lados da pista,

  adjacente a ambas cabeceiras e em algumas locações intermediárias, conforme necessário.
  Ver Figura

  C-1C. (Redação dada pela Resolução nº 465, de 13.03.2018)


  Data da emissão: 16 de junho de 2021.


  Figura C-1C. Área de giro de pista de pouso (Incluído pela Resolução nº 465, de 13.03.2018)

  NOTA - O início da curva da aeronave seria facilitado ao se colocar a área de giro no lado
  esquerdo

  da pista de pouso, uma vez que normalmente o piloto-em-comando ocupa a cadeira da esquerda.

  (3) A geometria da área de giro deve viabilizar, de acordo com a capacidade de manobra da

  aeronave, afastamento seguro entre as rodas do trem de pouso e a borda da área de giro,
  já

  considerando condições operacionais específicas do aeródromo. (Redação dada pela Resolução
  nº

  513, de 16.04.2019)

  (4) [Reservado] (Redação dada pela Resolução nº 513, de 16.04.2019)

  (5) O projeto da área de giro de pista deve ser tal que, quando a cabine de pilotagem da
  aeronave

  para a qual a área de giro será disponibilizada permanece sobre a sinalização desta área,
  o afastamento

  entre qualquer roda do trem de pouso da aeronave e a borda da área de giro deve ser igual
  ou superior

  àquela indicada na tabela a seguir:

  Tabela C-2. Afastamentos mínimos entre rodas do trem de pouso e bordas da área de giro

  associados à OMGWS (Alterado pela Resolução nº 465, de 13.03.2018)


  Data da emissão: 16 de junho de 2021.


