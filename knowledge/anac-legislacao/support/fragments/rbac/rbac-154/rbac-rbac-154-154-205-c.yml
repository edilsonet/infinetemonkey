title: 154.205(c)
text: '(c) Resistência das áreas de giro de pista de pouso e decolagem

  A resistência da área de giro de pista de pouso deve ser, no mínimo, igual àquela da pista
  de pouso

  adjacente, por ela atendida, considerando-se que a área de giro estará sujeita a um tráfego
  de

  movimentação lenta, realizando curvas de maior intensidade e causando maiores esforços sobre
  o

  pavimento.'
