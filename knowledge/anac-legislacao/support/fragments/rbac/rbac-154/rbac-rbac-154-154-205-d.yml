title: 154.205(d)
text: '(d) Superfície das áreas de giro na pista de pouso

  (1) A superfície de uma área de giro na pista de pouso deve ser projetada e construída de
  modo a

  não apresentar irregularidades que possam causar dano à estrutura das aeronaves que a utilizam.
  (Redação

  dada pela Resolução nº 513, de 16.04.2019)'
