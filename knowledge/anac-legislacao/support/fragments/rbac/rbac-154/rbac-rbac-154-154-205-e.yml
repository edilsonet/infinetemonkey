cite: 154.205(e)
title: 154.205(e)
text: '(e) Acostamentos para área de giro na pista de pouso

  (1) As áreas de giro de pista de pouso devem ter acostamentos com a largura necessária para

  prevenir a erosão da superfície provocada pelo jato das turbinas das aeronaves mais potentes,
  para as

  quais foi construída, e qualquer possível dano por objeto estranho (F.O.D.) aos motores
  das

  aeronaves.

  (2) A largura dos acostamentos, no mínimo, deve cobrir o motor externo da aeronave mais

  crítica e, assim, serem mais largas do que os acostamentos da pista associada.

  (3) A resistência dos acostamentos da área de giro na pista de pouso deve ser capaz de suportar

  o trânsito ocasional da aeronave para o qual foi prevista, sem induzir danos estruturais
  à aeronave ou

  aos veículos de apoio no solo que podem operar no acostamento.


  Data da emissão: 16 de junho de 2021.'
