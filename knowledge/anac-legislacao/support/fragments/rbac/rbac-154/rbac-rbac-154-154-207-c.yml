text: '(c) Largura de faixas de pista de pouso e decolagem

  (1) Uma faixa de pista contendo uma pista de aproximação de precisão deve estender-se

  lateralmente ao eixo da pista a uma distância, em cada lado do eixo da pista e do seu prolongamento

  ao longo de todo o comprimento da faixa de pista, de, no mínimo:'
