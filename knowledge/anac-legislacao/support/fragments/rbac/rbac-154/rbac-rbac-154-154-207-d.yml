text: '(d) Objetos em faixas de pista de pouso e decolagem

  (1) Faixas de pista de pouso e decolagem não devem possuir objetos que possam colocar

  aeronaves em risco.

  NOTA 1 - A localização e o desenho das valas ou canais de drenagem devem ser considerados
  no

  projeto das áreas de faixa de pista de forma a prevenir danos em aeronaves que acidentalmente
  saiam

  da pista de pouso e decolagem. A cobertura destes elementos de drenagem pode ser necessária.

  NOTA 2 - Os elementos de drenagem devem ser projetados de forma a assegurar que a sua estrutura

  não se estenda acima do solo adjacente, de modo a não ser considerado um obstáculo.


  Data da emissão: 16 de junho de 2021.


  NOTA 3 - Atenção especial deve ser dada à concepção e manutenção de valas ou canais de águas

  pluviais para evitar a atração de aves. Cobertura com grade ou rede pode ser necessária.

  (2) Nenhum objeto fixo, excetuados os auxílios visuais necessários para fins de navegação

  aérea que satisfaçam os requisitos de frangibilidade dispostos na Subparte D, deve ser permitido
  em

