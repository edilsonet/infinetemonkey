title: 154.207(e)
text: '(e) Faixa preparada

  (1) A porção da faixa de pista de uma pista de pouso e decolagem para operação por instrumento

  deve ser uma área nivelada, de acordo com as aeronaves para as quais a pista é destinada,
  para

  proteger uma aeronave que saia acidentalmente da pista. A área nivelada deve abranger, no
  mínimo,

  as seguintes distâncias a partir do eixo da pista e do seu prolongamento:'
