section_title: Faixas de pista de pouso e decolagem
subsection_id: i
cite: 154.207(i)
title: 154.207(i)
text: '(i) permitir que qualquer porção da faixa de pista não seja considerada obstáculo;

  (ii) não afetar o sinal dos auxílios à navegação aérea.

  NOTA 1 - Quando considerado necessário para o sistema de drenagem, valas ou canais descobertos

  podem ser permitidos na porção não preparada de uma faixa de pista e seriam colocados o
  mais

  afastado possível da pista de pouso e decolagem.

  NOTA 2 - Para os procedimentos de resgate e combate a incêndio deverão ser levados em conta
  a

  localização das valas e canais de drenagem descobertas na porção não preparada de uma faixa
  de

  pista.

  (Redação dada pela Resolução nº 513, de 16.04.2019)'
