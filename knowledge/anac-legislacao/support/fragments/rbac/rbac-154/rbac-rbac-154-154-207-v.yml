section_title: Faixas de pista de pouso e decolagem
subsection_id: v
cite: 154.207(v)
title: 154.207(v)
text: '(v) 70 m a partir do eixo da pista, em pista de aproximação de precisão para letra
  de código

  F. (Redação dada pela Resolução nº 628, de 11.06.2021)

  NOTA - Os auxílios visuais permitidos nessa faixa são aqueles descritos na subparte D deste

  regulamento (auxílios visuais para navegação), notadamente os sistemas visuais indicadores
  de rampa

  de aproximação, as luzes e os painéis de sinalização vertical.

  (3) Após a distância prevista no parágrafo 154.207(d)(2), podem ser instalados, além dos

  auxílios visuais necessários para fins de navegação aérea, os auxílios-rádio e equipamento

  meteorológicos, desde que satisfaçam os requisitos de frangibilidade dispostos na Subparte
  D.

  (4) Após a faixa preparada definida no parágrafo 154.207(e), podem ser instalados objetos
  fixos

  que não ultrapassem a cota do eixo da pista (medida no ponto do eixo da pista mais próximo
  ao

  objeto), nem ultrapassem uma rampa de 5% ascendente, transversal ao eixo da pista de pouso
  e

  decolagem e iniciada no término da faixa preparada.'
