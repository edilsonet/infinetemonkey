cite: 154.209(d)
title: 154.209(d)
text: '(d) Limpeza e nivelamento de RESA

  (1) Uma RESA deve oferecer uma área limpa e nivelada para aeronaves para as quais a pista
  é

  destinada, no caso de uma aeronave realizar o toque antes de alcançar a cabeceira ou ultrapassar

  acidentalmente o fim da pista.


  Data da emissão: 16 de junho de 2021.'
