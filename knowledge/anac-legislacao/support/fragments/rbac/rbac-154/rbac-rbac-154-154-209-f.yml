cite: 154.209(f)
title: 154.209(f)
text: '(f) Resistência de RESA

  (1) Uma RESA deve ser preparada ou construída de forma a reduzir o risco de danos a uma

  aeronave que realizar o toque antes de alcançar a cabeceira ou ultrapassar acidentalmente
  o fim da

  pista, aumentando a desaceleração da aeronave e facilitando a movimentação das equipes e
  veículos

  de salvamento e combate a incêndio.'
