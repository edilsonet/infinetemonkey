section_title: Áreas de Segurança de Fim de Pista (RESA)
subsection_id: i
cite: 154.209(i)
title: 154.209(i)
text: '(i) comprimento igual ou superior a 30 m e largura igual ou superior à largura da faixa
  de

  pista preparada na cabeceira a que está associada, para pistas para operação visual com
  código de

  referência de aeródromo 1 ou 2;

  (ii) comprimento igual ou superior a 120 m e largura igual ou superior à largura da faixa
  de

  pista preparada na cabeceira a que está associada, para pistas para operação por instrumento
  com

  código de referência de aeródromo 1 ou 2;

  (iii) comprimento igual ou superior a 240 m e largura igual ou superior à largura da faixa
  de

  pista preparada na cabeceira a que está associada, para pistas com código de referência
  de aeródromo

  3 ou 4.

  (Redação dada pela Resolução nº 529, de 12.09.2019)'
