text: '154.211 Zonas desimpedidas (clearways)


  NOTA - A inclusão de especificações detalhadas sobre zonas desimpedidas (clearways) nesta
  seção

  não possui o propósito de exigir a provisão de uma zona desimpedida. O Apêndice G deste
  RBAC

  contém informações sobre o uso de zonas desimpedidas.'
