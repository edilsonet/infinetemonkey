section_title: Zonas desimpedidas (clearways)
subsection_id: i
cite: 154.211(i)
title: 154.211(i)
text: '(i) a superfície do terreno não seja considerada obstáculo;

  (ii) não ocorram mudanças ascendentes bruscas de declividade quando a declividade da

  superfície do terreno for relativamente pequena ou quando a declividade média for ascendente.

  (Redação dada pela Resolução nº 513, de 16.04.2019)

  NOTA 1 - Devido às declividades transversais ou longitudinais em uma pista de pouso e decolagem,

  acostamento ou faixa de pista, em alguns casos, o limite inferior do plano da zona desimpedida

  especificado acima pode estar abaixo da elevação correspondente da pista de pouso e decolagem,

  acostamento ou faixa de pista.

  NOTA 2 - Desde que satisfeitas as condições da RESA, descritas na seção154.209, não é necessário

  que essas superfícies sejam niveladas para se ajustarem ao limite inferior do plano da zona

  desimpedida (clearway), nem que o terreno ou os objetos que estiverem acima desse plano,
  além do

  fim da faixa de pista, mas abaixo do nível da faixa de pista, sejam removidos, a menos que
  se

  considere que eles possam oferecer risco às aeronaves.'
