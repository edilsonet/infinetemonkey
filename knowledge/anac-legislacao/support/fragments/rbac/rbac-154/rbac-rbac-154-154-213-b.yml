title: 154.213(b)
text: '(b) Declividades em zonas de parada (stopways)

  (1) As declividades e as mudanças de declividade em uma zona de parada (stopway), bem como

  a transição de uma pista para uma zona de parada, devem estar em conformidade com o parágrafo

  154.201(f) para a pista à qual a zona de parada estiver associada. (Redação dada pela Resolução
  nº

  513, de 16.04.2019)'
