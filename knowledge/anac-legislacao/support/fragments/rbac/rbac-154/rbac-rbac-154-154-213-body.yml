text: '154.213 Zonas de parada (stopways)


  NOTA - A inclusão de especificações detalhadas para zonas de parada (stopways) nesta seção
  não

  possui o propósito de exigir a provisão de uma zona de parada. O Apêndice G deste RBAC contém

  informações sobre o uso de zonas de parada.'
