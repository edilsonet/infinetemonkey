title: 154.213(c)
text: '(c) Resistência de zonas de parada (stopways)

  Uma zona de parada (stopway) deve ser preparada ou construída de modo a ser capaz, no caso
  de

  uma decolagem abortada, de suportar a aeronave para a qual a zona de parada se destina sem
  provocar

  danos estruturais à aeronave.'
