title: 154.213(d)
text: '(d) Superfície de zonas de parada (stopways)

  (1) A superfície de uma zona de parada (stopway) deve oferecer características de aderência

  iguais ou superiores às da pista à qual está associada.


  Data da emissão: 16 de junho de 2021.'
