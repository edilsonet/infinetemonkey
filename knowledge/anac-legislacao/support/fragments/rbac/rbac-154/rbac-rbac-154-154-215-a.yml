cite: 154.215(a)
title: 154.215(a)
text: '(a) Disposições gerais

  Onde operacionalmente necessário, uma área de operação de rádio-altímetro deve ser estabelecida

  na área de pré-cabeceira de uma pista de pouso e decolagem. (Redação dada pela Resolução
  nº 513,

  de 16.04.2019)

  NOTA - Orientações adicionais acerca da área de operação do rádio-altímetro podem ser encontradas

  no Apêndice G deste RBAC. (Incluído pela Resolução nº 513, de 16.04.2019)'
