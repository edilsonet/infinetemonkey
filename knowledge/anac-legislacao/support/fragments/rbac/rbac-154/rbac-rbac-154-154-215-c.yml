cite: 154.215(c)
title: 154.215(c)
text: '(c) Largura da área

  Uma área de operação de rádio-altímetro deve se estender lateralmente para cada lado do

  prolongamento do eixo da pista de pouso e decolagem, a uma distância de 60 m, ressalvando-se
  que,

  quando circunstâncias especiais permitirem, essa distância pode ser reduzida a não menos
  que 30 m,

  caso um estudo aeronáutico indique que essa redução não afeta a segurança das operações
  das

  aeronaves.'
