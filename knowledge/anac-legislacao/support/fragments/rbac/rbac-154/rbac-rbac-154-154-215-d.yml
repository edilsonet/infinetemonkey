title: 154.215(d)
text: '(d) Mudanças de declividade longitudinal

  Em uma área de operação de rádio-altímetro, mudanças de declividade devem ser evitadas ou

  mantidas a um número mínimo. Onde não puderem ser evitadas, as mudanças de declividade devem

  ser as mais graduais possíveis, não devendo haver mudanças abruptas ou reversões repentinas
  de

  declividades. (Redação dada pela Resolução nº 513, de 16.04.2019)'
