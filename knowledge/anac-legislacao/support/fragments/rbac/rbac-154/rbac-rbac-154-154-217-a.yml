cite: 154.217(a)
title: 154.217(a)
text: '(a) Disposições gerais

  (1) As pistas de táxi devem ser disponibilizadas para permitir a movimentação segura e rápida

  de aeronaves.

  (2) [Reservado]. (Redação dada pela Resolução nº 513, de 16.04.2019)

  (3) O projeto de uma pista de táxi deve ser tal que, quando a cabine de comando da aeronave

  para a qual a pista de táxi se destina permanecer sobre o eixo desta pista, o afastamento
  entre a roda

  externa do trem de pouso principal e a borda da pista de táxi não seja inferior à distância
  apresentada

  na seguinte tabela:


  Tabela C-3. Afastamentos mínimos entre a roda externa do trem de pouso principal e a borda

  dapista de táxi associados à OMGWS (Alterado pela Resolução nº 465, de 13.03.2018)


  Largura exterior entre as rodas do trem de pouso principal (OMGWS)


  menor que 4,5 m

  maior ou igual a

  4,5 m e menor

  que 6 m

  maior ou igual a 6

  m e menor que 9

  m

  maior ou igual a 9

  m e menor que 15

  m


  Data da emissão: 16 de junho de 2021.


  Afastamento

  1,50 m

  2,25 m

  3 mª ou 4 mb

  4 m


  ª em trechos curvos se a pista de táxi for destinada a aeronaves com base de rodas menor
  que 18 m.

  b em trechos curvos se a pista de táxi for destinada a aeronaves com base de rodas igual
  ou maior que

  18 m.

  (4) Salvo quando disposto de forma contrária, os requisitos nesta seção são aplicáveis a
  todos

  os tipos de pistas de táxi.

  (5) Os parágrafos 154.307(c)(3)(xi) a (xiii) da seção 154.307 deste RBAC contêm informações

  detalhadas sobre a identificação e nomenclatura das pistas de táxi, que tem por objetivo
  a melhoria

  da consciência situacional e proporcionar a sua utilização como parte das medidas de prevenção
  de

  incursão em pista. (Incluído pela Resolução nº 628, de 11.06.2021)'
