  D1 - Distância entre o eixo de uma pista de táxi para eixo de outra pista de táxi;

  D2 - Distância entre o eixo de uma pista de táxi ou uma pista de táxi de pátio e um objeto,
  excetuando-se pista

  de táxi de acesso ao estacionamento;

  D3 - Distância entre eixos de pistas de táxi de acesso ao estacionamento;

  D4 - Distância entre o eixo de uma pista de táxi de acesso ao estacionamento e um objeto.


  NOTA 1 - As distâncias de separação demonstradas nas colunas (2) a (9) representam combinações

  comuns de pistas e pistas de táxi.

  NOTA 2 - As distâncias nas colunas (2) a (9) não garantem uma distância livre suficiente,
  atrás de

  uma aeronave em espera, para permitir a passagem de outra aeronave em uma pista de táxi
  paralela.'
