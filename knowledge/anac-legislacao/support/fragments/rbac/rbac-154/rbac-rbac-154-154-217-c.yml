title: 154.217(c)
text: '(c) Curvas de pista de táxi

  (1) Mudanças na direção das pistas de táxi devem ser mínimas e as mais suaves possíveis.
  Os

  raios das curvas devem ser compatíveis com a capacidade de manobra e as velocidades normais
  de

  táxi das aeronaves para as quais a pista de táxi é destinada. O traçado da curva deve ser
  tal que,

  quando a cabine de comando da aeronave permanecer sobre a sinalização horizontal do eixo
  da pista

  de táxi, o afastamento entre as rodas externas do trem de pouso principal e a borda da pista
  de táxi

  não seja menor que a distância apresentada no parágrafo 154.217(a)(3).

  NOTA 1 - Um exemplo do alargamento das pistas de táxi para alcançar o afastamento da roda

  especificado pode ser visto na Figura C-3.

  NOTA 2 - A localização da sinalização horizontal e das luzes de eixo da pista de táxi está
  especificada

  nos parágrafos 154.303(h)(2)(i), 154.305(w)(1)(iii) e 154.305(w)(2)(i).

  NOTA 3 - Curvas compostas podem reduzir ou eliminar a necessidade de larguras adicionais
  em

  pistas de táxi.


  Data da emissão: 16 de junho de 2021.


