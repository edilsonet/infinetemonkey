title: 154.217(d)
text: '(d) Junções e interseções

  Para facilitar a movimentação das aeronaves, as junções e interseções entre pistas de táxi
  com

  pistas de pouso e decolagem, com pátios de aeronaves e com outras pistas de táxi devem receber

  filetes (fillets). O projeto dos filetes deve garantir que os afastamentos mínimos das rodas

  especificados no parágrafo 154.217(a)(3) sejam mantidos quando as aeronaves estiverem

  manobrando pelas junções ou interseções.

  NOTA - Ao se projetarem os filetes, deverão ser levados em consideração os dados de comprimento

  de aeronaves.'
