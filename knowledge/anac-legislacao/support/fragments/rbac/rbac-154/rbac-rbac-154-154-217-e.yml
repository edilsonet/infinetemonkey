title: 154.217(e)
text: '(e) Distâncias mínimas de separação para pistas de táxi

  (1) A distância de separação entre o eixo de uma pista de táxi e o eixo de uma pista de
  pouso e

  decolagem, o eixo de uma pista de táxi paralela ou um objeto, não deve ser menor que as
  dimensões

  especificadas na Tabela C-5.

  NOTA 1 - As distâncias de separação da Tabela C-5, coluna 10, não necessariamente oferecem
  a

  possibilidade de se fazer uma curva normal de uma pista de táxi para outra pista de táxi
  paralela.


  Data da emissão: 16 de junho de 2021.


  NOTA 2 - A distância de separação entre o eixo de uma pista de táxi de estacionamento de
  aeronaves

  e um objeto demonstrado na Tabela C-5, coluna 13, pode precisar ser aumentada quando a esteira
  de

  exaustão de jatos oferecer riscos aos serviços de apoio no solo.

  NOTA 3 - Distâncias de separação menores que as especificadas na Tabela C-5 podem ser

  excepcionalmente permitidas nas situações previstas nos parágrafos 154.5(c) e 154.5(c)-I.'
