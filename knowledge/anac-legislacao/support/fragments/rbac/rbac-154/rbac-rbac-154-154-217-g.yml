title: 154.217(g)
text: '(g) Resistência de pistas de táxi

  Além de ser capaz de resistir ao tráfego de aeronaves para o qual é destinada, a estrutura
  do

  pavimento de uma pista de táxi deve permitir o tráfego de equipamentos de solo e veículos
  de combate

  a incêndio que venham a utilizá-la. (Redação dada pela Resolução nº 513, de 16.04.2019)'
