title: 154.217(h)
text: '(h) Superfície de pistas de táxi

  (1) A superfície de uma pista de táxi não deve ter irregularidades que causem danos às

  estruturas das aeronaves.

  (2) A superfície de uma pista de táxi pavimentada deve oferecer características de aderência

  adequadas para operação segura das aeronaves.'
