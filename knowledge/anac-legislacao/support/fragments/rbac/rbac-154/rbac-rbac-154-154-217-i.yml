cite: 154.217(i)
title: 154.217(i)
text: '(i) 93 km/h onde o número de código for 3 ou 4; e

  (ii) 65 km/h onde o número de código for 1 ou 2.

  (2) O raio do filete (fillet) na parte interna da curva de saída rápida deve ser suficiente
  para

  oferecer uma abertura maior na pista de táxi de modo a facilitar o reconhecimento imediato
  da entrada

  e da curva de saída para a pista de táxi.

  (3) Uma pista de táxi de saída rápida deve incluir uma distância retilínea após a curva
  de saída

  de modo que permita à aeronave fazer uma parada total antes de qualquer interseção com outras
  pistas

  de táxi.


  Data da emissão: 16 de junho de 2021.


  (4) O ângulo de interseção de uma pista de táxi de saída rápida com a pista de pouso e

  decolagem não deve ser maior que 45º, nem menor que 25º, sendo, preferencialmente, de 30º.


  Figura C-4. Pista de táxi de saída rápida (Alterado pela Resolução nº 465, de 13.03.2018)'
