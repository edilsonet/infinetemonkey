cite: 154.217(j)
title: 154.217(j)
text: '(j) Pistas de táxi em pontes

  (1) A largura da porção da ponte em pista de táxi capaz de suportar aeronaves, medida

  perpendicularmente ao eixo da pista de táxi, não deve ser menor que a largura da área nivelada
  da

  faixa de pista de táxi, a menos que haja um método comprovado de amparo lateral que não
  ofereça

  risco às aeronaves nas pistas de táxi em que forem destinadas a operar.

  (2) Deve haver acesso para permitir que os veículos de salvamento e combate a incêndio

  intervenham em ambas as direções, dentro do tempo-resposta especificado para a maior aeronave

  para a qual a ponte em pista de táxi estiver destinada.

  NOTA - Se os motores da aeronave ficarem suspensos além dos limites laterais da estrutura
  da ponte,

  as áreas adjacentes abaixo da ponte podem precisar de proteção contra os jatos dos motores.

  (3) Pontes em pistas de táxi devem ser construídas em trechos retilíneos dessas pistas,
  com

  trechos retos nas duas extremidades da ponte para facilitar o alinhamento das aeronaves
  que se

  aproximam da ponte.'
