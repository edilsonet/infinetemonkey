cite: 154.219(a)
title: 154.219(a)
text: '(a) Trechos retilíneos de uma pista de táxi onde a letra de código for C, D, E ou F
  devem contar

  com acostamentos que se estendam simetricamente nos dois lados da mesma, de modo que a largura

  total da pista de táxi com seus acostamentos em trechos retilíneos não seja inferior a:

  (1) 44 m onde a letra de código for F;

  (2) 38 m onde a letra de código for E;

  (3) 34 m onde a letra de código for D; e

  (4) 25 m onde a letra de código for C. (Redação dada pela Resolução nº 465, de 13.03.2018)

  Raio da curva de

  saída de pista

  Ângulo de

  intesecção

  PISTA DE POUSO E DECOLAGEM

  PISTA DE TÁXI

