section_title: Acostamentos de pista de táxi
subsection_id: b
cite: 154.219(b)
title: 154.219(b)
text: '(b) Em curvas de pistas de táxi e em junções ou interseções onde houver acréscimo de
  pavimento,

  a largura dos acostamentos não deve ser inferior à largura daqueles dos trechos retilíneos
  adjacentes

  da pista de táxi.'
