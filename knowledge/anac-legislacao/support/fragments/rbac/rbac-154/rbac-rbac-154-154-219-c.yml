section_title: Acostamentos de pista de táxi
subsection_id: c
cite: 154.219(c)
title: 154.219(c)
text: '(c) Quando uma pista de táxi estiver destinada ao uso por aeronaves a turbina, a superfície
  dos

  acostamentos da mesma deve ser preparada de forma a resistir à erosão e à ingestão do material
  da

  superfície pelos motores da aeronave.'
