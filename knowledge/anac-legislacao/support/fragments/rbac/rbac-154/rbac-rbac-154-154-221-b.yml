title: 154.221(b)
text: '(b) Largura das faixas de pista de táxi

  Uma faixa de pista de táxi deve estender-se simetricamente para cada lado do eixo da pista
  de táxi

  ao longo de seu comprimento a uma distância mínima do eixo da pista de táxi descrita na
  Tabela C-

  5, coluna 11.'
