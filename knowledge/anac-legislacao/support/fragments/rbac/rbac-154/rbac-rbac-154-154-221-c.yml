cite: 154.221(c)
title: 154.221(c)
text: '(c) Objetos nas faixas de pista de táxi

  A faixa de pista de táxi deve oferecer uma área livre de objetos que possam pôr em risco
  o táxi das

  aeronaves.

  NOTA 1 - A localização e o formato dos drenos em uma faixa de pista de táxi devem ser levados
  em

  consideração para evitar danos a uma aeronave que venha a sair acidentalmente pela lateral
  da pista.

  Tampas especialmente desenhadas para os drenos podem ser necessárias.

  NOTA 2 - Os elementos de drenagem, abertos ou não, devem ser projetados de forma a assegurar

  que a sua estrutura não se estenda acima do solo adjacente, de modo a não ser considerado
  um

  obstáculo.

  NOTA 3 - Atenção especial deve ser dada à concepção e à manutenção de valas ou canais de
  águas

  pluviais para evitar a atração de aves. Cobertura com grade ou rede pode ser necessária.'
