title: 154.223(b)
text: '(b) Localização

  (1) A distância entre uma baia de espera, uma posição de espera de pista de pouso e decolagem

  estabelecida na interseção de uma pista de táxi /pouso e decolagem ou uma posição de espera
  em via

  de serviço e o eixo de uma pista de pouso e decolagem deve estar em conformidade com a Tabela
  C-

  6 e, no caso de uma pista de aproximação de precisão, deve ser tal que um veículo ou uma
  aeronave


  Data da emissão: 16 de junho de 2021.


  em espera não interfira com as operações dos auxílios-rádios à navegação aérea ou penetre
  na

  superfície de transição interna. (Redação dada pela Resolução nº 628, de 11.06.2021)

  (2) Em elevações maiores que 700 m (2.300 ft), a distância de 90 m especificada na Tabela
  C-

  6 para pistas de aproximação de precisão com número de código 4 deve ser aumentada da seguinte

  forma:'
