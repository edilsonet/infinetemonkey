cite: 154.223(i)
title: 154.223(i)
text: '(i) até uma elevação de 2.000 m (6.600 ft); 1 metro para cada 100 m (330 ft) além de
  700 m

  (2.300 ft);

  (ii) elevação além de 2.000 m (6.600 ft) e até 4.000 m (13.320 ft); 13 m, mais 1,5 m para

  cada 100 m (330 ft) além de 2.000 m (6600 ft); e

  (iii) elevação além de 4.000 m (13.320 ft) e até 5.000 m (16.650 ft); 43 m, mais 2 m para

  cada 100 m (330 ft) além de 4.000 m (13.320 ft).

  (3) Se uma baia de espera, uma posição de espera de pista de pouso e decolagem ou uma posição

  de espera em via de serviço para uma pista de aproximação de precisão com número de código
  4 estiver

  em uma elevação maior comparada à cabeceira, a distância especificada na Tabela C-6 deve
  ser ainda

  aumentada em 5 m para cada metro em que a baia ou posição estiver acima da cabeceira. (Redação

  dada pela Resolução nº 628, de 11.06.2021)

  (4) A localização de uma posição de espera de pista de pouso e decolagem, em conformidade

  com o parágrafo 154.223(a)(3), deve ser tal que um veículo ou uma aeronave em espera não
  infrinja

  a zona livre de obstáculos (OFZ), a superfície de aproximação, a superfície de saída, a
  área

  crítica/sensível do ILS/MLS ou interfira com a operação de auxílios-rádio à navegação.


  Data da emissão: 16 de junho de 2021.


