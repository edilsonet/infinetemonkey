  a.

  Se a elevação de uma baia de espera, do ponto de espera de pista ou ponto de espera na

  via de serviço for inferior à elevação da cabeceira, esta distância pode ser diminuída em
  5 metros

  para cada metro de diferença entre a baia de espera ou o ponto de espera e a cabeceira,
  desde que

  não se infrinja a superfície de transição interna.

  b.

  Pode ser necessário aumentar esta distância, no caso de aproximações de precisão, para

  evitar interferência com os auxílios-rádio à navegação aérea, especialmente com as instalações

  do indicador de trajetória de planeio e localizadores. As informações sobre as áreas críticas
  e

  sensíveis do ILS e do MLS podem ser encontradas no Anexo 10, à CACI, Volume I, Apensos C

  e G da Parte I, respectivamente (ver também o parágrafo 154.223(b)(1)) e em instruções

  complementares do DECEA.

  NOTA 1 - A distância de 90 m, para os números do código 3 ou 4, se baseia em uma aeronave

  com uma empenagem de 20 m de altura, uma distância entre o nariz e o ponto mais alto da

  empenagem de 52,7 m e uma altura do nariz de 10 m, em espera em um ângulo de 45º ou mais

  em relação ao eixo da pista, fora da OFZ e sem ter que considerá-la para o cálculo da OCA/H.

  NOTA 2 - A distância de 60 m, para o número do código 2, se baseia em uma aeronave com uma

  empenagem de 8 m de altura, uma distância entre o nariz e o ponto mais alto da empenagem
  de

  24,6 m e uma altura do nariz de 5,2 m, em espera em um ângulo de 45º ou mais em relação
  ao

  eixo da pista e fora da OFZ.

  NOTA 3 - Para o número do código 4 em que a largura da borda interna da superfície de

  aproximação interna é superior a 120 m, uma distância superior a 90 m pode ser necessária
  para

  garantir que uma aeronave numa posição de espera esteja fora da zona livre de obstáculos.
  Por

  exemplo, uma distância de 100 m se baseia em uma aeronave com uma empenagem de 24 m de

  altura, uma distância entre o nariz e o ponto mais alto da empenagem de 62,2 m e altura
  do nariz

  de 10 m, em espera em um ângulo de 45º ou mais em relação ao eixo da pista e fora da OFZ.'
