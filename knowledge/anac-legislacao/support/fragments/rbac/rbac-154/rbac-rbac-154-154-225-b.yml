title: 154.225(b)
text: '(b) Tamanho de pátios de aeronaves

  A área total do pátio deve ser adequada para permitir o processamento do tráfego do aeródromo

  de forma que as aeronaves mantenham, durante o procedimento de estacionamento, a envergadura


  Data da emissão: 16 de junho de 2021.


  dentro da região delimitada de parada (envelope), e considerar a necessidade operacional
  dos veículos

  de apoio em solo e de Combate a Incêndio que venham a ser utilizados. (Redação dada pela
  Resolução

  nº 529, de 12.09.2019)'
