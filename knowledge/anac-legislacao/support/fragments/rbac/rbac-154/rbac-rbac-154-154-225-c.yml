title: 154.225(c)
text: '(c) Resistência do pavimento nos pátios de aeronaves

  (1) Cada parte de um pátio de aeronaves deve ser capaz de suportar o tráfego das aeronaves

  para as quais for destinada. (Incluído pela Resolução nº 628, de 11.06.2021)

  NOTA - Para o dimensionamento da resistência do pavimento nos pátios de aeronaves, é importante

  considerar o fato de algumas porções estarem sujeitas a uma maior densidade de tráfego e,
  como

  resultado da lenta movimentação ou mesmo da parada das aeronaves, a esforços solicitantes
  maiores

  do que a pista de pouso e decolagem. (Incluído pela Resolução nº 529, de 12.09.2019)'
