title: 154.225(e)
text: '(e) Afastamentos em posições de estacionamento de aeronaves

  (1) Uma posição de estacionamento de aeronave deve possuir os seguintes afastamentos

  mínimos entre uma aeronave entrando ou saindo dessa posição e qualquer construção adjacente,

  aeronave em outra posição de estacionamento e outros objetos (Ver Figura C-5): (Redação
  dada pela

  Resolução nº 465, de 13.03.2018)

  Tabela C-7. Afastamentos mínimos entre aeronaves entrando em/saindo de posição de

  estacionamento e objetos/obstáculos adjacentes

  Letra do código

  Distância livre

  A

  3 m

  B

  3 m

  C

  4,5 m

  D

  7,5 m

  E

  7,5 m

  F

  7,5 m


  Data da emissão: 16 de junho de 2021.


  Figura C-5. Representação de afastamentos mínimos entre aeronaves (Incluído pela Resolução
  nº

  465, de 13.03.2018)

  (2) Quando circunstâncias especiais permitirem, esses afastamentos podem ser reduzidos para

  posições de estacionamento de aeronave com nariz para dentro (nose in), quando a letra de
  código

  for D, E ou F:'
