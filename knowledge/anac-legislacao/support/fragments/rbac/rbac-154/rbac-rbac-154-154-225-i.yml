section_title: Pátios de aeronaves
subsection_id: i
cite: 154.225(i)
title: 154.225(i)
text: '(i) entre o terminal, incluindo qualquer ponte de passageiros fixa, e o nariz da aeronave;
  e

  (ii) sobre qualquer parte da posição de estacionamento que conte com orientação por azimute

  por um sistema de orientação visual de estacionamento.

  NOTA 1 - Em pátios de aeronaves deve ser considerada a existência de vias de serviço e as
  áreas de

  manobras e armazenagem de equipamentos de rampa.


  NOTA 2 - Uma posição isolada de estacionamento de aeronave deve ser designada em conformidade

  com normativo de AVSEC, para o estacionamento de uma aeronave que se saiba ou se desconfie

  estar sujeita a interferências ilícitas, ou que, por outras razões, precise de isolamento
  das atividades

  normais do aeródromo.

  NOTA 3 - A posição isolada de estacionamento de aeronave deve estar localizada na máxima

  distância possível de outras posições de estacionamento, construções ou áreas públicas.
  Devem ser

  tomados os cuidados para assegurar que essa posição não esteja localizada sobre instalações

  subterrâneas como gás ou combustíveis de aeronaves e cabos de comunicação ou elétricos.'
