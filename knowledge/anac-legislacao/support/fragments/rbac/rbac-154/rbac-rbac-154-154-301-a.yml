title: 154.301(a)
text: '(a) Indicadores de direção de vento

  (1) Aplicação

  Um aeródromo deve estar equipado com, no mínimo, um indicador de direção de vento.

  (2) Localização

  Um indicador de direção de vento deve estar localizado de forma a ser visível para uma

  aeronave em voo ou na área de movimento e de modo que possa estar livre de efeitos de distúrbios

  de ar causados por objetos nas redondezas.

  (3) Características'
