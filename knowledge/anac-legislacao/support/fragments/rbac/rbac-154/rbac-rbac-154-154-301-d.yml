title: 154.301(d)
text: '(d) Painéis de sinalização e área de sinalização

  NOTA - A inclusão de especificações detalhadas para uma área de sinalização nesta seção
  não possui

  o propósito de implicar sua obrigatoriedade. O Apêndice G deste RBAC contém orientações
  sobre a

  necessidade de se fornecerem sinais de superfície.

  (1) Localização da área de sinalização

  A área de sinalização deve estar localizada de modo a ser visível por todos os ângulos de

  azimute, acima de um ângulo de 10º sobre a horizontal, quando vista de uma altura de 300
  m.

  (2) Características da área de sinalização'
