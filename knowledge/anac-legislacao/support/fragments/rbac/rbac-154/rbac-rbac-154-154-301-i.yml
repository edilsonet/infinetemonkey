cite: 154.301(i)
title: 154.301(i)
text: '(i) O indicador de direção de vento deve ter a forma de um cone vazado, construído
  de modo

  a dar uma clara indicação de direção de vento de superfície e uma indicação genérica da
  velocidade

  de vento.

  (ii) O cone deve ser dimensionado de modo a:

  (A) ficar totalmente estendido quando exposto a ventos com velocidades iguais ou

  superiores a 15 nós;

  (B) indicar a direção de ventos com velocidades iguais ou superiores a 3 nós.

  (iii) O tamanho e as cores devem ser selecionados de modo a fazer com que o indicador de

  direção de vento seja claramente visível e compreensível a partir de uma altura de, no mínimo,
  300

  m, considerando-se também as superfícies que rodeiam o indicador

  (iv) A localização de pelo menos um indicador da direção de vento deve ser marcada com

  uma faixa circular de 15 m de diâmetro externo e 1,2 m de largura. A faixa deve ter como
  centro o

  suporte do indicador de direção de vento, e deve ser de uma cor que cause contraste adequado,
  de

  preferência o branco.'
