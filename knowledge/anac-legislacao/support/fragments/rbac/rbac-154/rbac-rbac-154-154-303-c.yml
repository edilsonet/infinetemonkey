  Data da emissão: 16 de junho de 2021.


  A sinalização horizontal de eixo da pista de pouso e decolagem deve estar presente em pistas

  pavimentadas.

  (2) Localização

  A sinalização horizontal de eixo de pista de pouso e decolagem deve estar localizada ao
  longo

  do eixo da pista, entre a sinalização horizontal de designação de pista de pouso e decolagem,
  conforme

  demonstrado na Figura D-2, salvo quando interrompida, de acordo com o parágrafo 154.303(a)(1)(i).

  (3) Características'
