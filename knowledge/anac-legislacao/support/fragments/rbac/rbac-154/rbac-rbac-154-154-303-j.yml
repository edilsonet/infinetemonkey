text: '(j) Sinalização horizontal de posição de espera de pista de pouso e decolagem

  (1) Aplicação e localização

  A sinalização horizontal de posição de espera de pista de pouso e decolagem deve ser disposta

  ao longo de posições de espera de pista de pouso e decolagem.

  NOTA - Ver o parágrafo 154.307(b) sobre a disposição da sinalização vertical em posições
  de espera

  de pista de pouso e decolagem.

  (2) Características'
