text: '(m) Sinalização horizontal de posição de estacionamento de aeronaves

  (1) Aplicação

  Sinalização horizontal de posição de estacionamento de aeronaves deve ser disposta nos pontos

  designados de estacionamento em pátios de aeronaves pavimentados.

  (2) Localização'
