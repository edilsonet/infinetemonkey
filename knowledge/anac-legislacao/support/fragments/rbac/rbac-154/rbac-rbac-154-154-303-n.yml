title: 154.303(n)
text: '(n) Linhas de segurança de pátio de aeronaves

  (1) Aplicação

  Linhas de segurança devem ser dispostas em um pátio de aeronaves pavimentado, conforme

  sejam necessárias para delimitar as posições de estacionamento de aeronaves e as áreas de
  utilização

  de equipamentos de solo.

  (2) Localização

  Linhas de segurança de pátios de aeronaves devem ser localizadas de modo a definir as áreas

  destinadas ao uso de veículos no solo e outros equipamentos de atendimento às aeronaves,
  de modo

  a permitir um afastamento seguro das aeronaves.

  (3) Características'
