title: 154.303(o)
text: '(o) Sinalização horizontal de posição de espera em vias de serviço

  (1) Aplicação

  A sinalização horizontal de posição de espera em via de serviço deve estar disposta em todos

  os acessos de vias de serviço para uma pista de pouso e decolagem.

  (2) Localização

  A sinalização horizontal de posição de espera em via de serviço deve estar localizada

  transversalmente à via de serviço, na posição de espera.

  (3) Características

  A sinalização horizontal de posição de espera em via de serviço deve estar de acordo com
  o

  Código de Trânsito Brasileiro.'
