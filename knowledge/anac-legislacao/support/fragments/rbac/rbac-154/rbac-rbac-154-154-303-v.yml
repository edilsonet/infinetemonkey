title: 154.303(v)
text: '(v) Se a sinalização horizontal melhorada de eixo de pista de táxi intersecta uma sinalização

  horizontal de posição de espera de pista, em pistas de aproximação de precisão Categorias
  II ou III,

  que esteja localizada dentro de 47 m da primeira sinalização horizontal de posição de espera
  de pista,

  a sinalização horizontal melhorada de eixo de pista de táxi deve ser interrompida a 0,9
  m antes e

  depois da sinalização horizontal de posição de espera de pista intersectada. A sinalização
  horizontal

  melhorada de eixo de pista de táxi deve continuar além da sinalização horizontal de posição
  de espera

  de pista intersectada por, pelo menos, 3 segmentos da linha tracejada ou 47 m do início
  ao fim, o que

  for maior. Ver Figura D-6A(b).

  (vi) Se a sinalização horizontal melhorada de eixo de pista de táxi cruzar uma interseção
  de

  pistas de táxi que esteja localizada dentro de 47 m da sinalização horizontal de posição
  de espera de

  pista, a sinalização horizontal melhorada de eixo de pista de táxi deve ser interrompida
  a 1,5 m antes


  Data da emissão: 16 de junho de 2021.


  e depois do ponto onde a linha de eixo de pista de táxi intersectada cruza o eixo da pista
  de táxi

  melhorada. A sinalização horizontal melhorada de eixo de pista de táxi deve continuar além
  da

  interseção das pistas de táxi por, pelo menos, 3 segmentos da linha tracejada ou 47 m do
  início ao

  fim, o que for maior. Ver Figura D-6A(c).

  (vii) Quando dois eixos de pista de táxi convergirem antes de ou em uma sinalização

  horizontal de posição de espera de pista, a linha tracejada interna não deve ser menor que
  3 m de

  cumprimento. Ver Figura D-6A(d).

  (viii) Quando houver duas sinalizações horizontais de posição de espera de pista opostas
  e a

  distância entre elas for menor que 94 m, a sinalização horizontal melhorada de eixo de pista
  de táxi

  deve se estender por toda a distância. A sinalização horizontal melhorada de eixo de pista
  de táxi não

  deve se estender além de nenhuma das sinalizações horizontais de posição de espera de pista.
  Ver

  Figura D-6A(e).

  (3) Características'
