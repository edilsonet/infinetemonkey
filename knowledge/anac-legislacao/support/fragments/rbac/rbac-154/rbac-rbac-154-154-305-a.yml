title: 154.305(a)
text: '(a) Disposições gerais

  (1) Luzes aeronáuticas de superfície que podem causar confusão a navegantes

  NOTA - no caso de luzes aeronáuticas de superfície próximas a águas navegáveis, deve-se
  cuidar

  para que as luzes não causem confusão aos navegantes.

  (2) Luzes elevadas de aproximação'
