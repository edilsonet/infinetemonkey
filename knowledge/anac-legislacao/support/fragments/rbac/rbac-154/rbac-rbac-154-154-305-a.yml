cite: 154.305(a)
title: 154.305(a)
text: 'a) variar a altura nominal dos olhos do piloto sobre a

  cabeceira em relação à sinalização da rampa entre

  os limites de 12 m e 16 m, exceto nos casos em que

  uma trajetória padrão de planeio (glide path) de ILS

  e/ou trajetória mínima de planeio de MLS estiver

  disponível: a altura sobre a cabeceira deveria variar

  para evitar qualquer conflito entre as indicações

  visuais de rampa de aproximação e a porção

  utilizável de indicações da trajetória de planeio de

  ILS e/ou trajetória de planeio mínima de MLS;'
