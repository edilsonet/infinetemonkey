text: 'c) altura nominal selecionada dos olhos do piloto

  sobre a cabeceira.


  Data da emissão: 16 de junho de 2021.


  (iii) As unidades de luz devem ser construídas e dispostas de modo que o piloto de uma

  aeronave, durante a aproximação, possa:

  (A) quando acima da rampa de aproximação, ver a(s) barra(s) de borda de pista branca(s)

  e uma, duas ou três luzes indicadoras de descida, sendo que, quanto mais luzes de descida
  forem

  visíveis, mais acima da rampa de aproximação o piloto se encontra;

  (B) quando, na rampa de aproximação, ver a(s) barra(s) de borda da pista branca(s); e

  (C) quando abaixo da rampa de aproximação, ver a(s) barra(s) de borda da pista e uma,

  duas ou três luzes de subida brancas, sendo que, quanto mais luzes de subida forem visíveis,
  mais

  abaixo da rampa de aproximação o piloto se encontra; e quando estiver muito abaixo da rampa
  de

  aproximação, ver a(s) barra(s) de borda da pista e três luzes de descida vermelhas. Quando
  acima ou

  exatamente na rampa de aproximação, nenhuma luz das unidades de luz de subida deve ser visível;

  quando exatamente ou abaixo da rampa de aproximação, nenhuma luz das unidades de luz de
  descida

  deve ser visível.

  (2) Localização'
