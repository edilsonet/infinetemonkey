title: 154.305(e)
text: '(e) Farol de identificação

  (1) Aplicação

  Um farol de identificação deve existir em aeródromos que se destinem para o uso noturno
  e que não

  possam ser facilmente identificados do ar por outros meios.

  (2) Localização'
