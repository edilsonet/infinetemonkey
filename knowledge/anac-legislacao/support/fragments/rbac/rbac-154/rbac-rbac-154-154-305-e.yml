text: 'e) onde houver um declive transversal do solo, ajustar

  a distância longitudinal de duas unidades de luzes

  ou duas barras de borda de pista para compensar

  suas diferenças de nivelamento, o quanto for

  necessário.

  A distância entre a barra de borda de pista e a cabeceira

  está baseada numa rampa de aproximação de 3° para

  uma pista nivelada, com uma altura nominal dos olhos do

  piloto sobre a cabeceira de 15 m. Na prática, o limite

