title: 154.305(f)
text: 'f)

  Um espaçamento de 6 m (+/- 1 m) entre as unidades

  PAPI deve ser utilizado quando os números de código de pista

  forem 1 e 2. Nesse caso, a unidade PAPI deve ser situada a não

  menos que 10 m (+/- 1 m) da borda da pista.

  Nota: - reduzir o espaçamento entre as unidades de luz

  irá resultar na redução da variação utilizável do sistema.'
