title: 154.305(g)
text: '(g) Sistema simples de luzes de aproximação

  NOTA - A instalação de um sistema simples de luzes de aproximação é recomendada para pistas

  para aproximação visual destinadas ao uso noturno, especialmente onde o número de código
  for 3 ou

  4, e pistas de aproximação de não-precisão, especialmente quando não contar com um sistema
  de

  luzes de aproximação de precisão Categoria I.

  (1) Localização'
