text: 'g)

  O espaçamento lateral entre as unidades APAPI pode

  ser aumentado até 9 m (+/- 1 m), caso uma variação maior for

  necessária ou uma conversão posterior para PAPI completo for

  prevista. Neste último caso, a unidade APAPI mais interna deve

  estar situada a 15 m (+/- 1 m) da borda da pista.

