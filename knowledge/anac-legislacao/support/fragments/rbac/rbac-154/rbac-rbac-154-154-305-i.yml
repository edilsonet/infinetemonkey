cite: 154.305(i)
title: 154.305(i)
text: '(i) Aplicação

  (A) As luzes de eixo de pista de táxi devem estar dispostas em pistas de táxi e em pátios

  de aeronaves destinados ao uso em pistas de pouso e decolagem com condições de alcance visual
  de

  pista menores que 350 m, de maneira a oferecer orientação contínua entre o eixo da pista
  de pouso e

  decolagem e as posições de estacionamento, ressalvando-se que essas luzes não precisam existir

  quando a densidade de tráfego for baixa e as luzes de borda de pista de táxi e a sinalização
  horizontal

  de eixo de táxi oferecerem orientação adequada.

  (B) As luzes de eixo de pista de táxi devem ser dispostas em interseções complexas de

  pista táxi e em pistas de táxi de saída, ressalvando-se que essas luzes não precisam existir
  quando a

  densidade do tráfego for baixa e as luzes de borda de táxi e a sinalização horizontal de
  eixo de pista

  de táxi oferecerem orientação adequada.


  Data da emissão: 16 de junho de 2021.


  NOTA - Onde possa haver a necessidade de delinear as bordas de uma pista de táxi, como em
  pistas

  de táxi de saída rápida, pistas de táxi estreitas, isso pode ser feito com luzes ou balizas
  nas bordas da

  pista de táxi.

  (C) As luzes de eixo de pista de táxi devem existir em pistas de táxi de saída, em pistas

  de táxi e em pátios de aeronaves, em todas as condições de visibilidade, quando especificadas
  como

  componentes de um sistema avançado de controle e orientação de movimentação de superfície,
  de

  modo a oferecer orientação contínua entre o eixo da pista de pouso e decolagem e as posições
  de

  estacionamento.

  (D) As luzes de eixo de pista de táxi devem existir em uma pista de pouso e decolagem

  que fizer parte de uma circulação padrão de táxi e destinada ao táxi em condições visuais
  de pista

  inferiores ao valor de 350 m, ressalvando-se que essas luzes não precisam existir quando
  a densidade

  do tráfego for baixa e as luzes de borda de táxi, assim como a sinalização horizontal de
  eixo de pista

  de táxi, oferecerem orientação adequada.

  NOTA - Ver o parágrafo 154.503(a)(3) sobre as disposições a respeito da interligação dos
  sistemas

  de luzes da pista de pouso e decolagem e de táxi.

  (E) As luzes de eixo de pista de táxi devem existir em todas as condições de visibilidade

  em pistas que forem parte de uma circulação padrão de táxi onde especificadas como componentes

  de um sistema avançado de controle e orientação de movimentação de superfície.

  (ii) Características

  (A) As luzes de eixo de pista de táxi que não seja de saída rápida e de eixo de pista de

  pouso e decolagem, na parte destinada à circulação padrão de táxi, devem ser luzes verdes

  ininterruptas com dimensões de feixes tais que a luz seja visível somente das aeronaves
  localizadas

  nas pistas de táxi ou em sua vizinhança (Figura D-21).

  (B) As luzes de eixo de pista de táxi de saída rápida devem ser luzes ininterruptas,

  alternadas entre o verde e amarelo, desde o início, próximo ao eixo da pista de pouso e
  decolagem,

  até o perímetro da área crítica/sensível do ILS/MLS ou até a margem inferior da superfície
  de

  transição interna, dentre essas a que estiver mais distante da pista de pouso e decolagem;
  e, a partir

  daí, todas as luzes devem ser verdes (Figura D-20). A primeira luz no eixo da pista de táxi
  de saída

  deve sempre ser verde e a luz mais próxima ao perímetro deve sempre ser amarela.

  (C) Quando as aeronaves puderem seguir a mesma linha de eixo nos dois sentidos da pista

  de táxi, todas as luzes de seu eixo devem ser verdes para a aeronave que se aproxima da
  pista de

  pouso e decolagem, ou alternando verde e amarelo desde o perímetro da área crítica/sensível
  do

  ILS/MLS ou da borda inferior da superfície de transição interna, o que estiver mais distante
  da pista

  de pouso e decolagem, até a pista de pouso e decolagem e devem continuar alternando verde
  e amarelo

  até:

  ( 1 )

  seu ponto final próximo ao eixo da pista; ou

  ( 2 )

  no caso das luzes de eixo de pista de táxi cruzar a pista, até o perímetro oposto

  da área crítica/sensível do ILS/MLS ou a borda inferior da superfície de transição interna,
  o que

  estiver mais distante da pista.

  NOTA 1 - Atenção deve ser dada ao limite da distribuição das luzes verdes sobre a pista
  de pouso e

  decolagem ou próximo a ela, de modo a evitar possíveis confusões com as luzes de cabeceira.

  NOTA 2 - Para características dos filtros amarelos, ver o Apêndice A, item A.2(b).


  Data da emissão: 16 de junho de 2021.


  NOTA 3 - O tamanho da área crítica/sensível do ILS/MLS depende das características do ILS/MLS

  associado e de outros fatores.

  NOTA 4 - Ver o parágrafo 154.307(c) sobre as especificações de sinalização vertical de pista
  livre.

  NOTA 5 - As disposições contidas no parágrafo 154.305(w)(1)(ii)(C) podem fazer parte de
  medidas

  efetivas de prevenção de incursão em pista.

  (D) As luzes de eixo de pista de táxi devem estar em conformidade com as especificações

  do:

  ( 1 )Apêndice B, Figura AB-12, AB-13, ou AB-14 para pistas de táxi destinadas ao

  uso em condições de alcance visual de pista de valor inferior a 350 m; e

  ( 2 ) Apêndice B, Figura AB-15 ou AB-16 para outras pistas de táxi.

  (E) Quando se requer intensidades mais elevadas do ponto de vista operacional, as luzes

  de eixo de pista de táxi, nas pistas de táxi de saída rápida destinadas a serem utilizadas
  quando o

  alcance visual da pista for inferior a 350 m, devem estar em conformidade com as especificações
  do

  Apêndice B, Figura AB-12. O número de níveis de controle de brilho para essas luzes deve
  ser o

  mesmo das luzes do eixo da pista de pouso.

  (F) Quando as luzes de eixo de pista de táxi forem especificadas como componentes de

  um sistema avançado de controle e orientação de movimentação de superfície e quando, do
  ponto de

  vista operacional, intensidades mais altas forem necessárias para manter os movimentos em
  solo, a

  certa velocidade, em visibilidades muito baixas ou em condições muito luminosas durante
  o dia, as

  luzes de eixo de pista de táxi devem estar em conformidade com as especificações do Apêndice
  B,

  Figura AB-17, AB-18 ou AB-19.

  NOTA - Luzes de alta intensidade de eixo devem somente ser usadas em caso de absoluta necessidade

  e de acordo com um estudo específico.

  (iii) Localização

  As luzes de eixo de pista de táxi devem estar localizadas sobre a sinalização horizontal
  de

  eixo de pista de táxi, ressalvando-se que estas podem estar deslocadas em não mais que 30
  cm quando

  não for praticável situá-las sobre a sinalização horizontal.

  (2) Luzes de eixo de táxi em pistas de táxi (sinalização luminosa)'
