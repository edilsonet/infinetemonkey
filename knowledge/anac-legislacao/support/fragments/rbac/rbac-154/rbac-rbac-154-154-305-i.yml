cite: 154.305(i)
title: 154.305(i)
text: '(i) Um sistema visual indicador de rampa de aproximação deve ser destinado a auxiliar
  na

  aproximação de uma pista de pouso e decolagem, conte ou não a pista com outros auxílios
  visuais ou

  por instrumentos, quando uma ou mais das seguintes condições estiverem presentes:

  (A) a pista é utilizada por turbo-jatos ou outras aeronaves com requisitos semelhantes de

  orientação de aproximação;

  (B) o piloto de qualquer tipo de aeronave possa ter dificuldades ao julgar a aproximação

  devido a:

  ( 1 ) orientação visual inadequada, como durante aproximações sobre superfície

  aquática ou terrenos sem referências visuais durante o dia, ou na ausência de luzes externas

  suficientes na área de aproximação à noite; ou

  ( 2 ) informações equivocadas, como as produzidas por terrenos vizinhos com

  características ilusórias ou declividades da pista de pouso;

  (C) a presença de objetos na área de aproximação que possam oferecer sérios riscos se

  uma aeronave descer abaixo da trajetória normal de aproximação, especialmente se não houver

  auxílios visuais ou por instrumentos para alertar sobre esses objetos;

  (D) condições físicas nas duas extremidades de uma pista de pouso que apresentem sérios

  riscos no caso de uma aeronave realizar o toque antes de alcançar a cabeceira ou que ultrapassar

  acidentalmente o fim da pista; e

  (E) o terreno ou as condições meteorológicas prevalecentes são tais que a aeronave pode

  estar sujeita a turbulências incomuns durante a aproximação.

  NOTA - Orientações sobre a prioridade da instalação de sistemas visuais indicadores de rampa
  de

  aproximação podem ser encontradas no Apêndice G deste RBAC.

  (ii) O sistema visual indicador de rampa de aproximação padrão, conforme demonstrado na

  Figura D-12, deve consistir no seguinte:


  Data da emissão: 16 de junho de 2021.


  (A) T-VASIS e AT-VASIS, de acordo com as especificações contidas nos parágrafos

  154.305(k)(1)(i) a 154.305(k)(4)(v) inclusive;

  (B) sistemas PAPI e APAPI, de acordo com as especificações contidas nos parágrafos

  154.305(l)(1)(i) a 154.305(l)(4)(vi) inclusive;

  (C) VASIS e AVASIS. Estes equipamentos não devem ser mais instalados. No entanto,

  os equipamentos instalados permanecerão em funcionamento até que sejam desativados, devido
  a sua

  obsolescência, ou substituídos por um PAPI ou um APAPI.

  NOTA - No Brasil, os sistemas VASIS existentes estão sendo gradualmente desativados e

  substituídos por sistemas PAPI e/ou APAPI.

  (iii) Sistemas PAPI, T-VASIS ou AT-VASIS devem ser providos quando o número de

  código for 3 ou 4, sempre que houver a presença de uma ou mais das condições especificadas
  no

  parágrafo 154.305(j)(1)(i).


  Data da emissão: 16 de junho de 2021.


  Figura D-12. Sistemas visuais indicadores de rampa de aproximação (Alterado pela Resolução
  nº

  465, de 13.03.2018)

  (iv) Sistemas PAPI ou APAPI devem ser disponibilizados quando o número de código for 1

  ou 2, quando houver a presença de uma ou mais das condições especificadas no parágrafo

  154.305(j)(1)(i).'
