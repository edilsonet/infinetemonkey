title: 154.305(m)
text: '(m) Luzes de orientação de circulação

  (1) Aplicação

  Luzes de orientação de circulação devem ser dispostas quando os sistemas de luzes de

  aproximação e de pista de pouso e decolagem não permitirem satisfatoriamente a identificação
  da

  pista e/ou da área de aproximação para uma aeronave em circulação, nas condições em que
  a pista se

  destina para aproximações circulares.

  (2) Localização'
