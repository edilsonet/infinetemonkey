title: 154.305(r)
text: '(r) Luzes de fim de pista (Sinalização luminosa, ver Figura D-18)

  (1) Aplicação

  As luzes de fim de pista devem existir em pistas equipadas com luzes de borda de pista de
  pouso

  e decolagem.'
