title: 154.305(t-I)
text: '(t)-I Luzes de zona de toque simples

  NOTA 1 - O objetivo das luzes de zona de toque simples é fornecer aos pilotos uma consciência

  situacional melhorada, em todas as condições de visibilidade, e ajudar a possibilitar os
  pilotos

  decidirem sobre iniciar uma arremetida, caso a aeronave não tenha pousado até um determinado
  ponto

  da pista. É essencial que os pilotos que operam em aeródromos com luzes simples da zona
  de toque

  estejam familiarizados com o objetivo destas luzes.


  Data da emissão: 16 de junho de 2021.


  NOTA 2 - Em um aeródromo onde o ângulo de aproximação é maior do que 3,5 graus e/ou quando

  a Distância Disponível para Pouso (LDA) combinada com outros fatores possa aumentar o risco
  de

  ultrapassagem acidental de fim da pista (overrun), luzes de zona de toque simples podem
  ser

  necessárias.

  (1) Localização'
