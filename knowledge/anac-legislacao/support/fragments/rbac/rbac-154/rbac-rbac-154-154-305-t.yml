title: 154.305(t)
text: '(t) Luzes de zona de toque (Sinalização luminosa)

  (1) Aplicação

  As luzes de zona de toque devem ser dispostas na zona de toque de pistas de aproximação
  de

  precisão Categorias II ou III.

  (2) Localização

  As luzes de zona de toque devem se estender desde a cabeceira até uma distância longitudinal

  de 900 m, ressalvando-se que, em pistas com menos de 1800 m de extensão, o sistema poderá
  ser

  encurtado de modo a não ultrapassar o ponto médio da pista de pouso e decolagem. O padrão
  deve

  ser formado por pares de barretas situadas simetricamente ao eixo da pista. O espaçamento
  lateral

  entre as luzes mais internas de um par de barretas deve ser igual ao espaçamento lateral
  selecionado

  para a sinalização horizontal de zona de toque. O espaçamento longitudinal entre os pares
  de barretas

  deve ser de 30 m ou 60 m.

  NOTA - De modo a permitir as operações em condições mínimas de visibilidade, pode ser

  aconselhável utilizar um espaçamento longitudinal de 30 m entre as barretas.

  (3) Características'
