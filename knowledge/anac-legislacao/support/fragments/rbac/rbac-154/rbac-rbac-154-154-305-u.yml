text: '(u) Luzes indicadoras de pista de táxi de saída rápida (RETILs)

  NOTA - As luzes indicadoras de pista de táxi de saída rápida (RETILs) têm por objetivo proporcionar

  aos pilotos informação sobre a distância até a pista de táxi de saída rápida mais próxima,
  para

  melhorar a percepção situacional em condições de baixa visibilidade e possibilitar aos pilotos

  desacelerarem a aeronave para atingir velocidades mais eficientes de rolagem e saída. É
  essencial que

  os pilotos operando em aeródromos com pistas de pouso equipadas com luzes indicadoras de
  pista de

  táxi de saída rápida estejam familiarizados com o propósito dessas luzes.

  (1) Aplicação'
