title: 154.305(v)
text: '(v) A amplitude do azimute do feixe de luz deve ser adequadamente restringida quando
  um

  objeto situado fora da superfície de proteção contra obstáculos dos sistemas PAPI ou APAPI,
  mas

  dentro dos limites laterais do feixe de luz, se projetar acima do plano da superfície de
  proteção contra

  obstáculos e um estudo aeronáutico indicar que esse objeto irá afetar adversamente a segurança
  das

  operações. Os limites da restrição devem ser tais que o objeto permaneça fora do alcance
  do feixe de

  luz.

  NOTA - Ver os parágrafos 154.305(l)(5)(i) a 154.305(l)(5)(v) sobre a superfície mencionada
  de

  proteção contra obstáculos.


  Data da emissão: 16 de junho de 2021.


  (vi) Quando barras de borda de pista forem instaladas nos dois lados da pista, para oferecer

  orientação de rolagem, unidades correspondentes devem ser configuradas com o mesmo ângulo,
  de

  modo que os sinais de cada barra de borda de pista se modifiquem simétrica e simultaneamente.


  Figura D-16. Feixes de luz e configuração do ângulo de elevação do PAPI e do APAPI (Alterado

  pela Resolução nº 465, de 13.03.2018)


  A altura dos olhos do piloto em relação à trajetória de planeio (glide path) da aeronave,
  na projeção da

  antenado ILS/MLS, varia de acordo com o tipo de aeronave e com o procedimento de aproximação.
  A

  harmonização do sinal do PAPI e da trajetória de planeio do ILS e/ou da trajetória mínima
  de planeio do

  MLS, para um ponto mais próximo da cabeceira, pode ser conseguida aumentando-se o setor
  do feixe de

  20'' para 30''. Os ângulos de configuração para uma rampa de planeio (glide sope) de 3°
  seriam, dessa

  forma, 2°25'' , 2°45'' , 3°15'' e 3º35'' .

  Rampa de aproximação do PAPI = (B+C)/2

