cite: 154.305(v)
title: 154.305(v)
text: '(v) Um controle apropriado de intensidade deve ser disposto de forma a permitir ajustes
  para

  suprir as condições prevalecentes e evitar o ofuscamento do piloto durante a aproximação
  e o pouso.

  (vi) Cada unidade de luz deve ser capaz de ser ajustada na elevação, de modo que o limite

  mais baixo da parte branca do feixe possa ser fixado em qualquer ângulo desejado de elevação
  entre

  1º30’ e, no mínimo, 4º30’ acima da horizontal.

  (vii) As unidades de luz devem ser desenvolvidas de modo que depósitos de condensação,

  gelo, poeira etc., sobre as superfícies de transmissão ótica e refletoras, interfiram o
  mínimo possível

  nos sinais de luz, e não deve afetar o contraste entre os sinais branco e vermelho e na
  elevação do

  setor de transição.


  Data da emissão: 16 de junho de 2021.


  Figura D-15. Localização do PAPI e do APAPI (Alterado pela Resolução nº 628, de 11.06.2021)

