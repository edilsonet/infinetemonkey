cite: 154.307(i)
title: 154.307(i)
text: '(i) Sinalizações verticais de instrução obrigatória devem ser dispostas nos casos de:

  (A) pistas de aproximação de precisão;

  (B) pistas de aproximação de não-precisão; e

  (C) pistas destinadas a uso noturno.

  (ii) Sinalizações verticais de instrução obrigatória devem incluir sinalizações verticais
  de

  designação de pistas de pouso e decolagem, sinalizações verticais de posição de espera para

  Categorias I, II ou III, sinalizações verticais de posição de espera de pista de pouso e
  decolagem,

  sinalizações verticais de posição de espera em via de serviço e sinalizações verticais de
  entrada

  proibida (“NO ENTRY”).

  NOTA 1 - As sinalizações de instrução obrigatória objetivam identificar um local além do
  qual uma

  aeronave em táxi ou um veículo não devem prosseguir, a menos que autorizado pela torre de
  controle

  do aeródromo, se existente, ou quando esta não existir ou estiver temporariamente inoperante,
  após o

  piloto da aeronave ou o condutor do veículo ter executado as devidas transmissões de rádio
  e

  confirmado que a pista e as áreas de aproximação estão livres de tráfego conflitante.

  NOTA 2 - Ver o parágrafo 154.307(f) sobre as especificações de sinalizações verticais de
  posições

  de espera em via de serviço.

  (iii) Uma sinalização horizontal de posição de espera de pista de pouso e decolagem padrão

  “A” deve ser complementada com uma sinalização vertical de designação de pista, em uma interseção

  de pista de táxi/pista de pouso e decolagem ou em uma interseção de pista de pouso e decolagem/pista

  de pouso e decolagem.

  (iv) Uma sinalização horizontal de posição de espera de pista de pouso e decolagem padrão

  “B” deve ser complementada com uma sinalização vertical de posição de espera Categorias
  I, II ou

  III.


  Data da emissão: 16 de junho de 2021.'
