cite: 154.307(i)
title: 154.307(i)
text: '(i) As sinalizações verticais devem ser frangíveis. Aquelas situadas próximas à pista
  de

  pouso e decolagem ou de táxi devem ser baixas o suficiente para manter a desobstrução das
  hélices e

  naceles dos motores de aeronaves a jato. A altura de instalação da sinalização vertical
  não deve

  exceder as dimensões exibidas na coluna apropriada da Tabela D-8.

  (ii) As sinalizações verticais devem ser retangulares, conforme demonstrado nas Figuras
  D-

  24 e D-25, com o lado mais longo na horizontal.

  Tabela D-8. Distâncias de localização para sinalização vertical de orientação de táxi, incluindo

