title: 154.309(a)
text: '(a) Disposições gerais

  As balizas devem ser frangíveis. As balizas localizadas próximas a uma pista de pouso e

  decolagem ou de táxi devem ser suficientemente baixas para preservar a desobstrução das
  hélices ou

  das naceles de motores de aeronaves a jato.

  NOTA - Âncoras ou correntes são utilizadas às vezes para evitar que balizas quebradas de
  suas

  fixações sejam sopradas.'
