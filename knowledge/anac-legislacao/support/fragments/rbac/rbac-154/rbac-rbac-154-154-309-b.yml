title: 154.309(b)
text: '(b) Balizas de borda de pista de pouso e decolagem não pavimentada

  (1) Aplicação

  As balizas devem ser dispostas quando a dimensão de uma pista não pavimentada não for

  claramente indicada pela aparência de sua superfície, comparada com a do terreno ao redor.

  (2) Localização

  Onde houver luzes de pista de pouso e decolagem, as balizas devem ser incorporadas nas

  fixações das luzes. Onde não houver luzes, as balizas de formato retangular plano ou cônico
  devem

  ser posicionadas de forma a delimitar claramente a pista.

  (3) Características

  As balizas retangulares planas devem ter uma dimensão mínima de 1 m por 3 m e devem estar

  situadas com o lado mais longo paralelo ao eixo da pista. As balizas cônicas devem ter uma
  altura

  menor ou igual a 50 cm.'
