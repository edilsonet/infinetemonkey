title: 154.309(c)
text: '(c) Balizas de borda de zona de parada (Stopway)

  (1) Aplicação


  Data da emissão: 16 de junho de 2021.


  As balizas de borda de zona de parada (stopway) devem ser dispostas quando a extensão de

  uma zona de parada não for claramente indicada por sua aparência, comparada com o terreno
  ao

  redor.

  (2) Características

  As balizas de zona de parada (stopway) devem ser suficientemente diferentes de quaisquer

  outros tipos de balizas utilizadas nas bordas da pista de pouso e decolagem, de forma a
  garantir que

  os dois tipos de balizas não sejam confundidos.

  NOTA - Balizas que consistam de pequenas placas verticais camufladas no lado oposto, quando

  observadas da pista de pouso e decolagem, provaram ser operacionalmente aceitáveis.'
