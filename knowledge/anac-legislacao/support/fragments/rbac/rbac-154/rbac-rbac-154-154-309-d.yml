title: 154.309(d)
text: '(d) Balizas de borda de pista de táxi

  (1) Aplicação

  As balizas de borda de pista de táxi devem ser dispostas em pistas de táxi onde o número
  de

  código for 1 ou 2 e quando não houver luzes de borda ou de eixo de pista de táxi ou sinalizadores
  de

  eixo de pista de táxi.

  (2) Localização

  As balizas de borda de pista de táxi devem ser instaladas, no mínimo, nos mesmos locais
  em

  que seriam instaladas as luzes de borda de pista de táxi, se estas fossem utilizadas.

  (3) Características'
