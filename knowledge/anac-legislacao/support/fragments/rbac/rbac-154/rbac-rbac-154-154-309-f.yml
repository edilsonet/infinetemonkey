title: 154.309(f)
text: '(f) Balizas de borda de pista de táxi não pavimentada

  (1) Aplicação

  Onde a extensão de uma pista de táxi não pavimentada não for claramente indicada por sua

  aparência comparada com a do terreno ao redor, balizas devem ser colocadas.

  (2) Localização

  Onde houver luzes de pista de táxi, as balizas devem ser incorporadas às fixações das luzes.

  Onde não houver luzes, as balizas de formato cônico devem ser situadas de forma a delimitar

  claramente a pista de táxi.'
