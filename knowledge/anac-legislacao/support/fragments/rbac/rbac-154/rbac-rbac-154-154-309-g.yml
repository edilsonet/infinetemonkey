title: 154.309(g)
text: '(g) Balizas de contorno

  (1) Aplicação

  As balizas de contorno de borda de pista devem ser dispostas em aeródromos onde a área de

  pouso não possuir uma pista de pouso e decolagem.

  (2) Localização

  As balizas de contorno devem ser distribuídas ao longo do contorno da área de pouso em

  intervalos menores ou iguais a 200 m, se o tipo demonstrado na Figura D-28 for utilizado,
  ou

  aproximadamente 90 m, se o tipo cônico for utilizado com uma baliza nos vértices.

  (3) Características

  As balizas de contorno devem ter a forma semelhante ao demonstrado na Figura D-28, ou a

  forma de um cone maior ou igual a 50 cm de altura e não menos que 75 cm de diâmetro na base.
  As

  balizas devem ser coloridas para contrastar com o fundo contra o qual possam ser vistas.
  Uma única

  cor, vermelha ou laranja, ou duas cores contrastantes, laranja e branco ou vermelho e branco,
  devem

  ser utilizadas, exceto quando essas cores se misturarem com o ambiente de fundo.


  Data da emissão: 16 de junho de 2021.


