title: 154.309(i)
text: '(i) Os sinalizadores de eixo de pista de táxi devem ser instalados, no mínimo, nos
  mesmos

  locais onde seriam instaladas as luzes de eixo de pista de táxi, se estas fossem utilizadas.

  NOTA - Ver o parágrafo 154.305(w) para o espaçamento das luzes de eixo de pista de táxi.

  (ii) Os sinalizadores de eixo de pista de táxi devem, normalmente, ser colocados sobre a

  sinalização horizontal de eixo de pista de táxi, ressalvando-se que eles podem ser deslocados
  no

  máximo 30cm onde não for possível colocá-los sobre a sinalização horizontal.


  Data da emissão: 16 de junho de 2021.


  (3) Características'
