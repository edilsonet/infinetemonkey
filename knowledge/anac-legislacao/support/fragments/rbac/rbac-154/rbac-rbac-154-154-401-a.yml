section_title: Pistas de pouso e decolagem e pistas de táxi, ou partes delas, interditadas
subsection_id: a
cite: 154.401(a)
title: 154.401(a)
text: '(a) Aplicação

  (1) Uma sinalização horizontal de interdição deve ser colocada em uma pista de pouso e

  decolagem ou pista de táxi (ou em parte delas) que esteja permanentemente interditada para
  o uso de

  todas as aeronaves.

  (2) Uma sinalização horizontal de interdição deve ser exibida em uma pista de pouso e

  decolagem ou pista de táxi, ou parte delas, temporariamente interditada, ressalvando-se
  que essa

  sinalização pode ser omitida quando a interdição for de curta duração e for dada uma advertência

  adequada pelos serviços de tráfego aéreo.'
