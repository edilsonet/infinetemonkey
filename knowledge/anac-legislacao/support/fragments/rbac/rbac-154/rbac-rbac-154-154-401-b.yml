section_title: Pistas de pouso e decolagem e pistas de táxi, ou partes delas, interditadas
subsection_id: b
cite: 154.401(b)
title: 154.401(b)
text: '(b) Localização

  Em uma pista de pouso e decolagem, ou parte dela, declarada interditada, deve ser colocada
  uma

  sinalização horizontal de interdição em cada extremidade da pista, ou da parte interditada,
  e outras

  sinalizações devem ser colocadas de forma que o intervalo máximo entre elas não exceda 300
  m. Em

  uma pista de táxi, deve ser colocada uma sinalização horizontal de interdição em cada extremidade

  da pista ou da parte declarada interditada.'
