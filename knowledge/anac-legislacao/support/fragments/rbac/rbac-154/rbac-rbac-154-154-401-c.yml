section_title: Pistas de pouso e decolagem e pistas de táxi, ou partes delas, interditadas
subsection_id: c
cite: 154.401(c)
title: 154.401(c)
text: '(c) Características

  (1) A sinalização horizontal de interdição deve ter o formato e proporções mostrados na

  Ilustração (a) da Figura E-1, quando exibida em uma pista de pouso e decolagem, bem como
  o

  formato e proporções mostrados na Ilustração (b) da Figura E-1, quando exibida em uma pista
  de

  táxi. A sinalização deve ser branca quando exibida em uma pista de pouso e decolagem e amarela

  quando exibida em uma pista de táxi.

  NOTA - Quando uma área estiver temporariamente interditada, barreiras frangíveis ou sinalizadores

  frágeis que utilizem outros materiais que não tinta ou outros meios adequados podem ser
  utilizados

  para identificar a área interditada.

  (2) Quando uma pista de pouso e decolagem ou pista de táxi, ou parte delas, estiver

  permanentemente interditada, todas as sinalizações normais dessas pistas devem ser removidas.

  (3) A iluminação de uma pista de pouso e decolagem ou pista de táxi, completa ou parcialmente

  interditada, não deve funcionar, exceto quando necessário para fins de manutenção.

  (4) Além das sinalizações de interdição, quando a pista de pouso e decolagem ou pista de
  táxi,

  completa ou parcialmente interditada, for interceptada por uma outra pista de pouso e decolagem
  ou

  pista de táxi em funcionamento e que seja utilizada no período noturno, luzes indicadoras
  de áreas

  interditadas devem ser colocadas na entrada da área interditada em intervalos não superiores
  a 3 m

  (ver parágrafo 154.407(d)).


  Data da emissão: 16 de junho de 2021.


  Figura E-1. Sinalizações horizontais de pistas de pouso e decolagem e de pista de táxi interditadas

  (Alterado pela Resolução nº 465, de 13.03.2018)'
