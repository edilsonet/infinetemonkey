section_title: Superfícies sem capacidade de suporte
subsection_id: a
cite: 154.403(a)
title: 154.403(a)
text: '(a) Aplicação

  Acostamentos de pistas de táxi, áreas de giro de pistas de pouso e decolagem, baias de espera,

  pátios de aeronaves e outras superfícies que não suportam cargas que, de imediato, não podem
  ser

  distinguidas das superfícies que suportam carga e que, se utilizadas por uma aeronave, poderia

  resultar em dano à mesma, devem possuir o limite entre essas áreas e a superfície que suporta
  carga

  sinalizado por meio de uma sinalização horizontal de faixa lateral de pista de táxi.

  NOTA - A sinalização horizontal de borda de pista de pouso e decolagem encontra-se especificada

  no parágrafo 154.303(g).'
