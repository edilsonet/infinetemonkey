title: 154.403(b)
text: '(b) Localização

  Uma sinalização horizontal de faixa lateral de pista de táxi deve ser disposta ao longo
  da borda do

  pavimento que suporta carga, com a borda externa da sinalização disposta aproximadamente
  sobre a

  borda do pavimento que suporta carga.'
