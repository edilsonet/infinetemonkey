text: '(c) Características

  Uma sinalização horizontal de faixa lateral de pista de táxi deve consistir em um par de
  linhas

  cheias, com 15 cm de largura cada e espaçadas de 15 cm, possuindo a mesma cor que a sinalização

  horizontal de eixo de pista de táxi.


  a)

  Sinalização horizontal de pista de

  pouso e decolagem interditada

  b)

  Sinalização horizontal de pista de

  táxi interditada

  14,5 m

  36 m

  1,5 m

  3,75 m

  9 m

  Eixo da pista

  Eixo da pista de táxi


  Data da emissão: 16 de junho de 2021.'
