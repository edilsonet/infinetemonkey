cite: 154.405(a)
title: 154.405(a)
text: '(a) Aplicação

  Quando a superfície anterior a uma cabeceira for pavimentada, possuindo mais de 60 m de

  comprimento e não for adequada para o uso normal por aeronaves, toda a extensão antes da
  cabeceira

  deve receber uma sinalização horizontal com padrão em “V”.'
