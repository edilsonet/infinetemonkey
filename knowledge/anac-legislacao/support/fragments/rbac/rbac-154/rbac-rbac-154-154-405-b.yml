text: '(b) Localização

  Uma sinalização horizontal com padrão em “V” deve apontar em direção à pista de pouso e

  decolagem e estar disposta conforme mostrado na Figura E-2.


  Figura E-2. Sinalização de área anterior à cabeceira (Alterado pela Resolução nº 628, de

  11.06.2021)'
