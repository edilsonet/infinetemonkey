title: 154.405(c)
text: '(c) Características

  Uma sinalização horizontal com padrão em “V” deve ser de cor visível e contrastar com a
  cor

  usada para as sinalizações horizontais da pista de pouso e decolagem; ela deve ser amarela,
  possuindo

  uma largura de, no mínimo, 0,9 m.'
