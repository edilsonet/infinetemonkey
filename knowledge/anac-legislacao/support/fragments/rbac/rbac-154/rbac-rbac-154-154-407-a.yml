cite: 154.407(a)
title: 154.407(a)
text: '(a) Aplicação

  Sinalizadores de áreas fora de serviço devem ser colocados em qualquer parte de uma pista
  de táxi,

  pátio de aeronaves ou baia de espera que estiver inapta para o movimento de aeronaves, sendo,

  entretanto, ainda possível que uma aeronave contorne a área com segurança. Em uma área de

  movimento com operação noturna, devem ser utilizadas luzes indicadoras de áreas fora de
  serviço.

  NOTA - Os sinalizadores e as luzes indicadoras de áreas fora de serviço são usados para
  advertir os

  pilotos sobre um buraco no pavimento de um pátio de aeronaves ou de uma pista de táxi ou
  para

  destacar uma parte do pavimento, como em um pátio em reparos. Eles não devem ser utilizados

  quando uma parte da pista de pouso e decolagem se tornar fora de serviço, nem em uma pista
  de táxi

  quando uma grande parte de sua largura se tornar fora de serviço. Nesses casos, a pista
  de pouso e

  decolagem ou pista de táxi deve ser interditada.


  Data da emissão: 16 de junho de 2021.'
