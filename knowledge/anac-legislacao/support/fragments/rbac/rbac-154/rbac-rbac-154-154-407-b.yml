title: 154.407(b)
text: '(b) Localização

  Os sinalizadores e as luzes indicadoras de áreas fora de serviço devem ser colocados em
  intervalos

  suficientemente próximos de forma a delinear a área fora de serviço.

  NOTA - Orientações sobre a localização das luzes indicadoras de áreas fora de serviço são

  encontradas no Apêndice G deste RBAC.'
