title: 154.407(c)
text: '(c) Características dos sinalizadores de áreas fora de serviço

  Os sinalizadores de áreas fora de serviço devem consistir em dispositivos eretos e visíveis
  como

  bandeiras, cones ou placas de sinalização.'
