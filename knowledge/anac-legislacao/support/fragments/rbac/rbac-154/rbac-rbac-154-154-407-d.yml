title: 154.407(d)
text: '(d) Características das luzes indicadoras de áreas fora de serviço

  Uma luz indicadora de área fora de serviço deve ser vermelha ininterrupta. Ela deve possuir
  uma

  intensidade suficiente para garantir sua visibilidade, tendo-se em vista a intensidade das
  luzes

  adjacentes e o nível geral de iluminação contra o qual ela seria normalmente vista. De forma
  alguma

  a intensidade deve ser inferior a 10 cd de luz vermelha.'
