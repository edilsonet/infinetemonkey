title: 154.407(e)
text: '(e) Características de cones de sinalização de áreas fora de serviço

  Um cone de sinalização de áreas fora de serviço deve possuir, no mínimo, 0,5 m de altura
  e ser

  vermelho, laranja ou amarelo, ou qualquer uma dessas cores em combinação com a cor branca.'
