title: 154.407(f)
text: '(f) Características das bandeiras de sinalização de áreas fora de serviço

  Uma bandeira de sinalização de áreas fora de serviço deve possuir, no mínimo, 0,5 m, ser

  vermelha, laranja ou amarela, ou qualquer uma dessas cores em combinação com a cor branca.'
