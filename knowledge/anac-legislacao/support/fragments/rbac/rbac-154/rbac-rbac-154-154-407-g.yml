title: 154.407(g)
text: '(g) Características das placas de sinalização de áreas fora de serviço

  Uma placa de sinalização de áreas fora de serviço deve possuir, no mínimo, 0,5 m de altura
  e 0,9

  m de comprimento, com faixas verticais alternadas nas cores vermelho e branco ou laranja
  e branco.


  Data da emissão: 16 de junho de 2021.


  SUBPARTE F

  SISTEMAS ELÉTRICOS

  SUBPARTE F - SISTEMAS ELÉTRICOS'
