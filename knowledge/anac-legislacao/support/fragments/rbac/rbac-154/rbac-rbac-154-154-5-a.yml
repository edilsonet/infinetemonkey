title: 154.5(a)
text: '(a) Este Regulamento contém requisitos baseados no Anexo 14 à Convenção sobre Aviação
  Civil

  Internacional.

  (1) É considerado requisito qualquer especificação de características físicas, configuração,

  material, equipamento, desempenho, pessoal ou procedimento cuja aplicação uniforme é considerada

  necessária para a segurança operacional ou regularidade do transporte aéreo e, portanto,
  tem caráter

  obrigatório.'
