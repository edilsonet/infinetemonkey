text: '(d) Os requisitos estabelecidos neste Regulamento aplicam-se integralmente às instalações

  implantadas a partir de sua entrada em vigor e, nos casos e condições das regras de transição

  estabelecidas na seção 154.601, às instalações existentes antes de sua entrada em vigor.

  (1) Considera-se existente a instalação descrita nas Subpartes C, D, E e F deste Regulamento

  que:'
