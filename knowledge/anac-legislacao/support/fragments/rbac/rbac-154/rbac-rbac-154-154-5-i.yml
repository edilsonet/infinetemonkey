cite: 154.5(i)
title: 154.5(i)
text: '(i) esteja cadastrada na ANAC ou seja objeto de processo de inscrição ou alteração
  cadastral

  instaurado antes da entrada em vigor do requisito; ou

  (ii) esteja implantada e operacional antes da entrada em vigor do requisito, se a instalação

  não é uma das sujeitas a processo de inscrição ou alteração cadastral.

  (2)

  A instalação que não se enquadre nas situações descritas nos parágrafos 154.5(d)(1)(i) ou

  154.5(d)(1)(ii), ainda que já tenha sido iniciada sua implantação, não é considerada existente
  e deve

  atender aos requisitos vigentes na data de instauração do respectivo processo de inscrição
  ou alteração

  cadastral ou, se a instalação não está entre as sujeitas a registro em ficha de cadastro
  de aeródromo,

  na data de início de sua operacionalização.

  (3)

  Para os fins do disposto no parágrafo 154.5(d), considera-se em vigor o requisito a partir

  da data de entrada em vigor da Emenda que o inseriu neste Regulamento ou o modificou.'
