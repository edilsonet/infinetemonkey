section_title: Sistemas de suprimento de energia elétrica para facilidades de navegação aérea
subsection_id: a
cite: 154.501(a)
title: 154.501(a)
text: '(a) Considerações gerais

  (1) O aeródromo deve dispor de adequada fonte primária de energia elétrica para o

  funcionamento seguro das facilidades de navegação aérea.

  (2) O projeto e a provisão de sistemas de energia elétrica para auxílios visuais à navegação

  aérea e rádio-auxílios em aeródromos deverão ter características tais que uma falha de equipamento

  não deixe o piloto sem adequada orientação visual ou por instrumentos, nem lhe proporcione

  informação errônea.

  NOTA - O projeto e a instalação dos sistemas elétricos devem ter em conta fatores que possam

  provocar falhas, tais como perturbações eletromagnéticas, perdas nas linhas de transmissão,
  qualidade

  da energia, etc.

  (3) As conexões da fonte de energia elétrica às facilidades que necessitam de energia secundária

  devem ser dispostas de modo que as facilidades sejam automaticamente conectadas à fonte
  secundária

  de energia em caso de falha da fonte primária de energia.

  (4) O intervalo de tempo entre a falha da fonte primária de energia e a restauração completa

  dos serviços exigidos pelo parágrafo 154.501(b)(1)(v) deve ser tão curto quanto possível,
  exceto

  quando relativo a auxílios visuais associados a aproximação de não-precisão, aproximação
  de

  precisão ou pistas utilizadas para decolagem, caso em que deverão ser aplicados os requisitos
  da

  Tabela F-1 para o máximo tempo de comutação.


  Data da emissão: 16 de junho de 2021.


