  a) Fornecida com energia secundária quando sua operação for essencial para a segurança da
  operação de

  voo.

  b) Ver o Subparte D, parágrafo 154.305(b) com relação ao uso de iluminação de emergência.

  c) Um segundo quando não existir luzes de eixo de pista de pouso e decolagem.

  d) Um segundo quando as aproximações forem sobre terrenos perigosos ou escarpados.'
