title: Sistemas de suprimento de energia elétrica para facilidades de navegação aérea
text: '154.501 Sistemas de suprimento de energia elétrica para facilidades de navegação aérea


  NOTA - A segurança das operações em aeródromos depende da qualidade da energia elétrica
  suprida.

  O sistema total de suprimento de energia elétrica pode incluir conexões a uma ou mais fontes
  externas

  de fornecimento de energia, uma ou mais unidades de geração e uma rede de distribuição incluindo

  transformadores e dispositivos comutadores. Ao planejar o sistema de energia elétrica em

  aeródromos, devem ser consideradas muitas outras facilidades aeroportuárias cuja energia
  é fornecida

  pelo mesmo sistema.'
