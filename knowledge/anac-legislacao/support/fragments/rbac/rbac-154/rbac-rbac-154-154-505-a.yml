title: 154.505(a)
text: '(a) Considerações gerais

  (1) [Reservado] (Redação dada pela Resolução nº 529, de 12.09.2019)

  (2) Nos casos em que sistemas de iluminação forem utilizados para fins de controle de

  aeronaves, esses sistemas devem ser monitorados automaticamente, de modo a se ter uma indicação

  a respeito de qualquer falha que possa afetar as funções de controle. Essas informações
  devem ser

  automaticamente retransmitidas para a unidade de serviço de tráfego aéreo.

  (3) [Reservado] (Redação dada pela Resolução nº 529, de 12.09.2019)

  NOTA - Valores típicos de indicação de mudança na condição operacional das luzes utilizadas
  para

  fins de controle de aeronaves não excedem dois segundos para uma barra de parada em posição
  de

  espera de pista de pouso e decolagem e cinco segundos para todos os outros tipos de auxílios
  visuais.


  Data da emissão: 16 de junho de 2021.


  SUBPARTE G

  DISPOSIÇÕES TRANSITÓRIAS E FINAIS'
