cite: 154.601(a)
title: 154.601(a)
text: '(a) Observado o disposto no parágrafo 154.5(d), as instalações aeroportuárias existentes
  antes de

  12 de maio de 2009 devem ser adequadas ao disposto neste Regulamento e as instalações

  aeroportuárias implantadas a partir de 12 de maio de 2009 devem ser adequadas aos requisitos

  inseridos ou modificados por Emenda a este Regulamento nas seguintes situações:

  (1) quando forem substituídas ou melhoradas após essa data para acomodar operações mais

  exigentes ou operações de nova aeronave crítica;

  (2) quando a ANAC estabelecer prazo para adequação em processo de certificação operacional

  de aeroporto;

  (3) quando a ANAC estabelecer prazo para adequação em contratos de concessão de

  aeroportos;

  (4) quando a ANAC estabelecer prazo para adequação em programas específicos de adequação

  de infraestruturas; ou

  (5) quando a ANAC estabelecer prazo para adequação em hipóteses comprovadamente

  excepcionais, diante de elevado risco operacional identificado.'
