cite: 154.601(b)
title: 154.601(b)
text: '(b) Enquanto não se enquadrarem nas hipóteses dos parágrafos 154.601(a)(1) a 154.601(a)(5)
  ou

  em disposição transitória específica estabelecida na seção 154.601, as instalações aeroportuárias

  existentes podem ser mantidas:

  (1) nas condições do respectivo cadastro; ou

  (2) nas condições de sua implantação e em conformidade com os requisitos vigentes à data
  de

  sua operacionalização, para as instalações não sujeitas a processo de inscrição ou alteração
  cadastral.'
