title: 154.601(c)
text: '(c) As instalações aeroportuárias cadastradas na ANAC antes de 1º de janeiro de 2010
  podem ser

  mantidas nas condições previstas no respectivo cadastro, sem necessidade de adequação aos

  requisitos estabelecidos nos parágrafos 154.303(e), 154.303(f), 154.305(a)(2)(i), 154.305(dd)(3)(i)
  a

  154.305(dd)(3)(v),

  154.305(dd)(3)(vii),

  154.305(dd)(4)(i)(A),

  154.305(dd)(4)(ii)(A)

  a

  154.305(dd)(5)(i)(B), 154.305(dd)(5)(ii)(A), 154.305(dd)(5)(ii)(B) e 154.305(dd)(5)(ii)(D),
  até que

  se enquadrem em qualquer das hipóteses descritas nos parágrafos 154.601(a)(1) a 154.601(a)(5).'
