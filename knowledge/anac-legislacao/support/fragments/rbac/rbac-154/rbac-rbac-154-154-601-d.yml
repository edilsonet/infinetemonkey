title: 154.601(d)
text: '(d) As instalações de auxílios visuais, auxílios‐rádio e equipamentos meteorológicos
  que

  estiverem cadastradas ou forem inseridas no cadastro da ANAC por meio de processo de inscrição

  ou alteração cadastral instaurado antes de 16 de março de 2018 deverão ser adequadas aos
  requisitos

  de localização de objetos em faixas de pista de pouso e decolagem previstos no parágrafo
  154.207(d)

  quando forem substituídas ou realocadas ou nas hipóteses descritas nos parágrafos 154.601(a)(1)
  a

  154.601(a)(5), o que ocorrer primeiro.'
