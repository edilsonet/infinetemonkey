text: '(e) Às pistas de pouso e decolagem cadastradas na ANAC antes de 12 de maio de 2009
  aplicam‐

  se as seguintes regras relativas à RESA:

  (1) nas hipóteses descritas nos parágrafos 154.601(a)(3) a 154.601(a)(5), a ANAC poderá

  estabelecer que a RESA seja parcial ou integralmente adequada ao disposto na seção 154.209;


  Data da emissão: 16 de junho de 2021.


  (2) na hipótese descrita no parágrafo 154.601(a)(2), a RESA deverá atender ao disposto nos

  parágrafos 154.209(c) a 154.209(f) e possuir as seguintes dimensões:'
