cite: 154.601(f)
title: 154.601(f)
text: '(f) As instalações aeroportuárias que estiverem cadastradas ou forem inseridas no cadastro

  da ANAC por meio de processo de inscrição ou alteração cadastral instaurado antes

  de 16 de março de 2018 deverão ser adequadas aos padrões de sinalização horizontal de posição

  intermediária de espera e de posição de espera de pista de pouso e decolagem estabelecidos
  nas

  Figuras D‐6 e D-7 (Subparte D) até 26 de novembro de 2020 ou nas hipóteses descritas nos
  parágrafos

  154.601(a)(1) a 154.601(a)(5), o que ocorrer primeiro.'
