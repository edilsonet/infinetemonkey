title: 154.601(g)
text: '(g) Os sistemas visuais indicadores de rampa de aproximação padrão T‐VASIS e AT‐VASIS
  que

  estiverem cadastrados ou forem inseridos no cadastro da ANAC por meio de processo de inscrição

  ou alteração cadastral instaurado antes de 16 de março de 2018 devem ser substituídos por
  outro

  sistema previsto no parágrafo 154.305(j)(1)(ii) até 1º de janeiro de 2020 ou nas hipóteses
  descritas

  nos parágrafos 154.601(a)(2) a 154.601(a)(5), o que ocorrer primeiro.'
