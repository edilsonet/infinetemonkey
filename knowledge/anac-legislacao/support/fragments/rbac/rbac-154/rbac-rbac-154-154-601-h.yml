cite: 154.601(h)
title: 154.601(h)
text: '(h) Para aeródromos que estiverem cadastrados ou forem inseridas no cadastro da ANAC
  por

  meio de processo de inscrição ou alteração cadastral instaurado antes de 16 de março de
  2018 sem

  sinalizações verticais de instrução obrigatória, a instalação dessas sinalizações em conformidade
  com

  o disposto no parágrafo 154.307(b) deve ocorrer previamente à elevação da condição da pista
  de

  pouso e decolagem para os casos previstos no parágrafo 154.307(b)(1)(i) ou nas hipóteses
  dos

  parágrafos 154.601(a)(2) a 154.601(a)(5), o que ocorrer primeiro.'
