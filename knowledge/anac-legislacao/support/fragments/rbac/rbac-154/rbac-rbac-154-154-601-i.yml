cite: 154.601(i)
title: 154.601(i)
text: '(i) comprimento igual ou superior a 30 m e largura igual ou superior ao dobro da largura

  de pista requerida para a aeronave crítica associada, para pistas para operação visual com
  código de

  referência de aeródromo 1 ou 2;

  (ii) comprimento igual ou superior a 90 m e largura igual ou superior ao dobro da largura

  de pista requerida para a aeronave crítica associada, para pistas com código de referência
  de

  aeródromo 3 ou 4 e pistas para operação por instrumento com código de referência de aeródromo
  1

  ou 2;

  (3) na hipótese descrita no parágrafo 154.601(a)(1), a pista de pouso e decolagem poderá
  ser

  mantida com RESA nas mesmas dimensões previstas no respectivo cadastro, devendo ser atendido
  o

  disposto nos parágrafos 154.209(c) a 154.209(f); e

  (4) enquanto o aeródromo não se enquadrar nas hipóteses dos parágrafos 154.601(a)(1) a

  154.601(a)(5), a RESA poderá ser mantida nas condições do respectivo cadastro.'
