cite: 154.603(a)
title: 154.603(a)
text: '(a) O projeto de aeródromos deve observar, além do disposto neste Regulamento, as regras

  específicas relativas às restrições ao uso do solo em função do zoneamento de ruído aeronáutico,
  das

  zonas de proteção de aeródromos, do gerenciamento do risco da fauna, bem como as regras
  de

  licenciamento ambiental e demais limitações aplicáveis.


  Data da emissão: 16 de junho de 2021.'
