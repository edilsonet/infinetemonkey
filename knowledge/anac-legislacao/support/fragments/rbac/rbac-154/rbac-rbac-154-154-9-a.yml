title: 154.9(a)
text: '(a) Sistema de referência temporal

  (1) O Calendário Gregoriano e Tempo Universal Coordenado (UTC) devem ser utilizados

  como sistema de referência temporal.


  Data da emissão: 16 de junho de 2021.


  (2) Quando um sistema de referência temporal diferente for utilizado, deve ser indicado
  em

  GEN 2.1.2 da Publicação de Informação Aeronáutica (AIP).'
