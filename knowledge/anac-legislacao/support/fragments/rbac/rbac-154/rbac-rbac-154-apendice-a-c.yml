title: apendice-a(c)
text: '(c) Caso o último ponto de uma fileira ou coluna de pontos de coordenadas esteja localizado
  entre

  22,5 cm e 15 cm (sem incluir) da borda da face da sinalização vertical, um outro ponto deve
  ser

  adicionado a 7,5 cm de distância deste ponto.'
