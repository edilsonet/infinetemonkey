  Figura AB-11. Pontos de coordenadas a serem utilizados para o cálculo da intensidade das
  luzes de

  aproximação e de pista de pouso e decolagem

  NOTAS coletivas para as Figuras AB-1 a AB-11

  1. As elipses em cada figura são simétricas aos eixos vertical e horizontal.

  2. As Figuras AB-1 a AB-10 mostram as intensidades mínimas permitidas de luz. A intensidade
  média

  do feixe principal é calculada por meio do estabelecimento de pontos de coordenadas, conforme

  demonstrado na Figura AB-11, e utilizando os valores de intensidade medidos em todos os
  pontos de

  coordenadas, localizados dentro e sobre o perímetro da elipse que representa o feixe principal.
  O valor

  médio é a média aritmética das intensidades de luz medida em todos os pontos de coordenadas

  considerados.

  3. Nenhum desvio no padrão do feixe principal é aceitável quando a fixação das luzes estiver

  adequadamente direcionada.

  4. Quociente de intensidade média. O quociente entre a intensidade média na elipse que define
  o feixe

  principal de uma luz nova típica e a intensidade média de luz do feixe principal de uma
  luz nova de

  borda de pista de pouso e decolagem deve ser o seguinte:


  Figura AB-1

  Eixo central de aproximação e barras

  cruzadas

  1,5 a 2,0 (luz branca)

  Figura AB-2

  Fileira lateral de aproximação

  0,5 a 1,0 (luz vermelha)


  Data da emissão: 16 de junho de 2021.


  Figura AB-3

  Cabeceira

