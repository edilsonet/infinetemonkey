  5. As coberturas de feixe nas figuras fornecem a orientação necessária para aproximações
  até um

  RVR da ordem de 150 m e decolagens até um RVR da ordem de 100 m.

  6. Os ângulos horizontais são medidos em relação ao plano vertical através do eixo da pista.
  Para

  luzes, que não as do eixo de pista de pouso e decolagem, a direção no sentido do eixo da
  pista é

  considerada positiva. Os ângulos verticais são medidos em relação ao plano horizontal.

  7. Onde, para luzes de eixo de aproximação e de barras cruzadas e para luzes de fileiras
  laterais de

  aproximação, forem utilizadas luzes embutidas em lugar de luzes elevadas, por exemplo, em
  uma

  pista de pouso e decolagem com uma cabeceira recuada, os requisitos de intensidades podem
  ser

  atingidos instalando-se dois ou três grupos (de intensidade mais baixa) em cada posição.

  8. A importância de uma manutenção adequada não pode ser subestimada. A intensidade média
  nunca

  deve cair para um valor inferior a 50% do valor mostrado nas figuras, devendo a administração

  aeroportuária local manter um nível de emissão de luz superior à intensidade média mínima

  especificada.

  9. A unidade de luz deve ser instalada de modo que o feixe principal esteja alinhado dentro
  de meio

  grau do requisito especificado.


  Data da emissão: 16 de junho de 2021.


