text: 'APÊNDICE C DO RBAC 154

  SINALIZAÇÕES HORIZONTAIS DE INSTRUÇÃO OBRIGATÓRIA E DE

  INFORMAÇÃO

  APÊNDICE C DO RBAC 154 - SINALIZAÇÕES HORIZONTAIS DE INSTRUÇÃO OBRIGATÓRIA E DE INFORMAÇÃO

  NOTA 1 - Ver a Subparte D, parágrafos 154.303(p) e 154.303(q), para as especificações sobre

  aplicação, localização e características das sinalizações horizontais de instrução obrigatória
  e de

  informação.

  NOTA 2 - O presente Apêndice apresenta a forma e as proporções das letras, dos números e
  dos

  símbolos das sinalizações horizontais de instrução obrigatória e de informação em uma grade.


  Data da emissão: 16 de junho de 2021.


