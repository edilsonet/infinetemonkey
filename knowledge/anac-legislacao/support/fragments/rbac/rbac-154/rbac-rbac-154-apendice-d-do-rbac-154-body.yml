text: 'APÊNDICE D DO RBAC 154

  REQUISITOS RELATIVOS AO PROJETO DE SINALIZAÇÕES VERTICAIS DE

  ORIENTAÇÃO PARA TÁXI

  APÊNDICE D DO RBAC 154 - REQUISITOS RELATIVOS AO PROJETO DE SINALIZAÇÕES VERTICAIS DE ORIENTAÇÃO
  PARA

  TÁXI

  NOTA - Ver a Subparte D, seção 154.307, para as especificações sobre aplicação, localização
  e

  características das sinalizações verticais.


  D.1 A altura das inscrições deve obedecer à tabulação a seguir.


  NOTA - Onde uma sinalização de localização de pista de táxi estiver instalada juntamente
  com uma

  sinalização vertical de designação de pista de pouso e decolagem (ver parágrafo 154.307(c)),
  o

  tamanho do caractere deve ser igual ao especificado para as sinalizações verticais de instrução

  obrigatória.


  D.2 As dimensões de uma flecha devem ser as seguintes:


  Altura da legenda

  Espessura


  200 mm

  32 mm


  300 mm

  48 mm


  400 mm

  64 mm


  D.3 A largura do traço para uma única letra deve ser a seguinte:


  Altura da legenda

  Espessura


  200 mm

  32 mm


  300 mm

  48 mm


  400 mm

  64 mm


  D.4 A luminosidade da sinalização vertical deve ser a seguinte:


  Data da emissão: 16 de junho de 2021.'
