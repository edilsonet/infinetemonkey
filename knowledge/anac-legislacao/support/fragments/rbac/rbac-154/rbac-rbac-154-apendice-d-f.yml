text: '(f) Sinalização vertical de posição de espera em via de serviço

  (1) Aplicação

  Uma sinalização vertical de posição de espera em via de serviço deve estar disposta em todas

  as entradas de vias de serviço em uma pista de pouso e decolagem.

  (2) Localização

  A sinalização vertical de posição de espera em via de serviço deve estar situada a 1,5 m
  da

  lateral direita da via de serviço. A sinalização vertical de posição de espera em via de
  serviço deve


  Data da emissão: 16 de junho de 2021.


  ser localizada na lateral esquerda se o tráfego de veículos for orientado a seguir neste
  sentido (mão

  inglesa).

  (3) Características'
