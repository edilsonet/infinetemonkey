title: apendice-d(v)
text: '(v) A inscrição da sinalização vertical de entrada proibida (“NO ENTRY”) deve estar
  em

  conformidade com a Figura D-24.

  (vi) A inscrição em uma sinalização vertical de posição de espera de pista de pouso e

  decolagem, em uma posição de espera estabelecida de acordo com o parágrafo 154.223(a)(3),
  deve

  consistir na designação da pista de táxi e de um número.

  (vii) Onde for apropriado, as seguintes inscrições/símbolos devem ser utilizados:

  Tabela D-9. Inscrições, símbolos e tipos de uso da sinalização vertical de instrução obrigatória

  Inscrição/Símbolo


  Uso

  Designação de pista de pouso e decolagem

  de uma extremidade de pista de pouso e

  decolagem


  Indicar uma posição de espera de pista de

  pouso e decolagem na extremidade da

  pista de pouso e decolagem

  OU


  Designação de pista de pouso e decolagem

  em suas duas extremidades

  Indicar uma posição de espera de pista de

  pouso e decolagem situada tanto em

  interseções de pista de táxi /pista de pouso

  e decolagem como em interseções de pista

  de pouso e decolagem/pista de pouso e

  decolagem

  25 CAT I

  (exemplo)

  Indicar uma posição de espera de pista de

  pouso e decolagem de Categoria I na

  cabeceira da pista 25

  25 CAT II

  (exemplo)

  Indicar uma posição de espera de pista de

  pouso e decolagem Categoria II na

  cabeceira da pista 25

  25 CAT III

  (exemplo)

  Indicar uma posição de espera de pista de

  pouso e decolagem Categoria III na

  cabeceira da pista 25

  25 CAT II/III

  (exemplo)

  Indicar uma posição de espera de pista de

  pouso e decolagem Categoria II/III na

  cabeceira da pista 25

  “NO ENTRY”

  (entrada proibida)

  Indicar que a entrada em uma área é

  proibida

  B2

  (exemplo)

  Indicar uma posição de espera de pista de

  pouso e decolagem estabelecida de acordo

  com o parágrafo 154.223(a)(3)'
