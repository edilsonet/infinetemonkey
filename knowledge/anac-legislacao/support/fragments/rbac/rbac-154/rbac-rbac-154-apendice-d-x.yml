cite: apendice-d(x)
title: apendice-d(x)
text: '(x) Onde uma sinalização vertical de localização e de direção forem utilizadas em conjunto:

  (A) todas as sinalizações verticais de direção relativas a curvas para a esquerda devem

  estar situadas do lado esquerdo da sinalização vertical de localização e todas as sinalizações
  verticais

  de direção relacionadas a curvas para a direita devem estar situadas do lado direito da
  sinalização

  vertical de localização, ressalvando-se que, quando a junção consistir em uma pista de táxi
  cruzada,

  a sinalização vertical de localização poderá estar alternativamente localizada do lado esquerdo;

  (B) as sinalizações verticais de direção devem ser posicionadas de modo que a direção

  das setas parta progressivamente a partir da vertical, com a crescente mudança de direção
  em relação

  à pista de táxi;

  (C) uma sinalização vertical de direção apropriada deve ser posicionada logo após a

  sinalização vertical de localização no ponto onde a localização da pista de táxi muda

  significativamente de direção, após a interseção; e

  (D) sinalizações verticais de direção adjacentes devem ser delineadas por uma linha preta

  vertical, conforme demonstrado na Figura D-25.

  (xi) Uma pista de táxi deve ser identificada por um designador, que deve ser utilizado uma

  única vez em um aeródromo, composto por uma letra, por letras ou pela combinação de uma
  letra ou

  letras seguidas de um número. (Redação dada pela Resolução nº 628, de 11.06.2021)


  Data da emissão: 16 de junho de 2021.


  (xii) Ao designar as pistas de táxi, não devem ser usadas as letras “I”, “O” ou “X” bem
  como

  palavras como interno ou externo, de forma a evitar confusão com os números 1, 0 e com sinalização

  de interdição de pista.

  (xiii) O uso de números, apresentados isoladamente, na área de manobras, deve ser reservado

  à designação das pistas de pouso e decolagem.'
