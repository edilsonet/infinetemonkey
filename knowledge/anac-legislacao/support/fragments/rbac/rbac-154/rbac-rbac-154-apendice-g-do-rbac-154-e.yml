title: apendice-g-do-rbac-154(e)
text: '(e) O caso mais comum é quando a velocidade de decisão é tal que a distância necessária
  para a

  decolagem passa a ser igual à distância necessária para a aceleração-parada; esse valor
  é conhecido

  como o comprimento de pista balanceado. Onde a zona de parada (stopway) e a zona desimpedida

  (clearway) não são fornecidas, aquelas distâncias são iguais ao comprimento da pista de
  pouso e

  decolagem. No entanto, se a distância para pouso for ignorada no momento, a pista de pouso
  e

  decolagem não será adequada para todo o comprimento de pista balanceado, pois a distância
  de

  rolagem de decolagem necessária será, evidentemente, menor que o comprimento de pista

  balanceado. O comprimento de pista balanceado pode, portanto, ser provido por uma pista
  de pouso

  e decolagem complementada por comprimento equivalente de zona desimpedida e de zona de parada,

  em vez da pista de pouso e decolagem como um todo. Se a pista de pouso e decolagem for utilizada

  para decolagem em ambas as direções, um comprimento igual de zona desimpedida e de zona
  de

  parada tem que ser provido em cada extremidade da pista de pouso e decolagem. A economia
  no

  comprimento de pista de pouso e decolagem é, portanto, obtida pelo custo de um comprimento
  geral

  maior.'
