cite: apendice-g-do-rbac-154(g)
title: apendice-g-do-rbac-154(g)
text: '(g) O comprimento mínimo da pista de pouso e decolagem e o comprimento máximo da zona
  de

  parada (stopway) ou da zona desimpedida (clearway) devem ser determinados da seguinte maneira,

  a partir dos dados contidos no manual de voo da aeronave considerada como crítica do ponto
  de vista

  das exigências de comprimento de pista de pouso e decolagem:

  (1) se uma zona de parada for economicamente viável, os comprimentos a serem providos são

  aqueles para o comprimento de pista balanceado. O comprimento da pista de pouso e decolagem
  é a

  distância de rolagem de decolagem necessária ou a distância de pouso necessária, dependendo
  de qual

  for a maior. Se a distância de aceleração-parada necessária for maior que o comprimento
  da pista de

  pouso e decolagem então determinado, o excesso deve ser transformado em zona de parada,
  em cada

  extremidade da pista de pouso e decolagem, se a pista de pouso e decolagem for utilizada
  para

  decolagem em ambas as direções. Ainda, uma zona desimpedida, com o mesmo comprimento da
  zona

  de parada, também pode ser provida;

  (2) se uma zona de parada não for provida, o comprimento da pista de pouso e decolagem será

  a distância de pouso necessária, ou se for maior, a distância de aceleração-parada necessária,
  que

  corresponder ao menor valor prático da velocidade de decisão. O excedente da distância de
  decolagem

  necessária sobre o comprimento da pista de pouso e decolagem deve ser provido como zona

  desimpedida, em cada extremidade da pista de pouso e decolagem, se a pista de pouso e decolagem

  for utilizada para decolagem em ambas as direções.'
