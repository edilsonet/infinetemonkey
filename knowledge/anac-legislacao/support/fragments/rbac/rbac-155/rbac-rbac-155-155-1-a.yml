title: 155.1(a)
text: '(a)

  Este Regulamento é de cumprimento obrigatório:

  (1) pelo operador de heliponto que atua em heliponto civil público; e

  (2) pelo operador de heliponto que atua em heliponto civil privado elevado quanto ao disposto
  nas Subpartes A, C, D e E, sendo recomendado o disposto na Subparte B.'
