cite: 155.101(a)
title: 155.101(a)
text: '(a)

  O estabelecimento e a comunicação de dados aeronáuticos relacionados a helipontos devem
  estar em conformidade com os requisitos de integridade e acurácia dispostos nas Tabelas
  A-1 a A-5, contidas no Apêndice A, levando em consideração os procedimentos do sistema de
  qualidade existente. Os requisitos de acurácia para dados aeronáuticos se baseiam em um
  nível de confiança de 95% (noventa e cinco por cento) e, nesse aspecto, três tipos de dados
  posicionais devem ser identificados: pontos levantados (por exemplo, cabeceira da FATO),
  pontos calculados (cálculos matemáticos a partir dos pontos levantados conhecidos de pontos
  no espaço, fixos) e pontos declarados (por exemplo, pontos de contorno de região de informação
  de voo).'
