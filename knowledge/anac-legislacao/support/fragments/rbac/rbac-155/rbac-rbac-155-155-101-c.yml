cite: 155.101(c)
title: 155.101(c)
text: '(c)

  A proteção de dados aeronáuticos eletrônicos, no seu armazenamento ou durante a sua transferência,
  deve ser totalmente monitorada pela checagem de redundância cíclica (CRC). Para alcançar
  a proteção do nível de integridade de dados aeronáuticos críticos e essenciais, em conformidade
  com a classificação definida no parágrafo 155.101(b), devem ser aplicados respectivamente
  algoritmos CRC de 32 ou 24 bit.'
