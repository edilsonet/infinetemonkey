title: 155.101(e)
text: '(e)

  As coordenadas geográficas indicando a latitude e a longitude devem ser determinadas com
  base no

  datum

  de referência do Sistema Geodésico Mundial - 1984 (WGS-84), e identificadas aquelas coordenadas
  geográficas que foram transformadas para o sistema WGS-84 por meios matemáticos e cuja acurácia
  do levantamento de campo original não satisfaça os requisitos constantes do Apêndice A,
  Tabela A-1.'
