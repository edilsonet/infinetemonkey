title: 155.101(f)
text: '(f)

  A acurácia do levantamento de campo deve ser de forma que os dados da navegação operacional
  resultantes, utilizados nas fases de voo, estejam dentro dos limites de desvios máximos,
  no que tange à base de referência apropriada, conforme indicado nas tabelas constantes do
  Apêndice A.'
