title: 155.101(g)
text: '(g)

  Além da elevação (em relação ao nível médio do mar) de posições específicas levantadas no
  solo em helipontos, deve ser determinada a ondulação do geoide (em relação ao elipsoide
  WGS-84) para essas posições, conforme indicado no Apêndice A.'
