title: 155.105(b)
text: '(b)

  A elevação da TLOF e/ou a elevação e a ondulação da geoide de cada cabeceira da FATO (onde
  apropriado) devem ser medidas e estabelecidas com acurácia de, pelo menos, meio metro (0,5
  m), para helipontos de aproximação de não-precisão.'
