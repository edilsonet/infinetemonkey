title: 155.105(c)
text: '(c)

  A elevação da TLOF e/ou a elevação e a ondulação da geoide de cada cabeceira da FATO (onde
  apropriado) devem ser medidas e estabelecidas com acurácia de, pelo menos, um quarto de
  metro (0,25 m), para helipontos de aproximação de precisão.'
