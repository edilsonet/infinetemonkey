cite: 155.107(b)
title: 155.107(b)
text: '(b)

  As coordenadas geográficas do centro geométrico da TLOF e/ou de cada cabeceira da FATO (quando
  apropriado), dos pontos do eixo das pistas de táxi aéreo e terrestre de helicópteros e de
  cada posição de estacionamento de helicóptero devem ser medidas e definidas em graus, minutos,
  segundos e centésimos de segundos.'
