title: 155.107(c)
text: '(c)

  As coordenadas geográficas dos obstáculos localizados na Área 2 (parte interna aos limites
  do heliponto) e na Área 3 devem ser medidas e definidas em graus, minutos, segundos e centésimos
  de segundos. Adicionalmente, a elevação do topo, o tipo, e a sinalização horizontal e iluminação
  (se houver) dos obstáculos devem ser levantados.'
