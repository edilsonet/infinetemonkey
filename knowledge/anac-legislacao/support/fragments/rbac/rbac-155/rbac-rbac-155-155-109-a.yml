title: 155.109(a)
text: '(a)

  As distâncias a seguir, quando declaradas, devem ser expressas em metros e arredondadas
  para o número inteiro inferior mais próximo:

  (1)

  distância disponível para decolagem de helicópteros (TODAH);

  (2)

  distância disponível para decolagem interrompida de helicópteros (RTODAH); e

  (3)

  distância disponível para pouso de helicópteros (LDAH).'
