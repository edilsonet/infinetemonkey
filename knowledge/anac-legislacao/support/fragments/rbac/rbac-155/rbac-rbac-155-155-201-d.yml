title: 155.201(d)
text: '(d)

  Não é permitida a utilização simultânea de dois ou mais helicópteros em uma FATO. Enquanto
  um helicóptero estiver utilizando determinada FATO, esta permanecerá indisponível para operações
  de pousos e de decolagens de outros helicópteros.'
