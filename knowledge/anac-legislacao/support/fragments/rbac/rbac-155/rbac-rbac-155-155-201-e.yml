title: 155.201(e)
text: '(e)

  O projeto de helipontos elevados deve considerar carga adicional resultante da presença
  de pessoas, mercadorias, equipamentos para abastecimento de combustível, equipamentos de
  combate à incêndio, bem como outras cargas adicionais.'
