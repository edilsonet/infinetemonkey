title: 155.203(c)
text: '(c)

  A superfície da FATO deve:

  (1)

  ser resistente aos efeitos de refluxo do rotor;

  (2)

  estar livre de irregularidades; e

  (3)

  possuir capacidade de suporte para cargas dinâmicas suficiente para acomodar uma decolagem
  interrompida de helicópteros que operam em classe de performance 1.'
