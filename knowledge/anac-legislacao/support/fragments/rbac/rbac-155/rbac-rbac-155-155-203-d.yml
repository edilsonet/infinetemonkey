title: 155.203(d)
text: '(d)

  A superfície da FATO que circunda uma área de toque e elevação inicial (TLOF) destinada
  ao uso de helicópteros que operam com classe de performance 2 e 3 deve apresentar capacidade
  de suporte para cargas estáticas.'
