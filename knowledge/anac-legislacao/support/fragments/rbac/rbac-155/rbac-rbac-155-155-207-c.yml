title: 155.207(c)
text: '(c)

  A TLOF deve possuir formato quadrado, retangular ou circular e tamanho suficiente para conter
  uma circunferência de diâmetro não inferior a 0,83 D do maior helicóptero cuja operação
  é prevista na área.'
