cite: 155.207(d)
title: 155.207(d)
text: '(d)

  As declividades em uma TLOF devem ser suficientes para prevenir e evitar a acumulação de
  água na superfície da área, mas não podem exceder uma declividade de 2% em qualquer direção.'
