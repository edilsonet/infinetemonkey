title: 155.207(g)
text: '(g)

  Para uma TLOF localizada dentro da FATO na qual é possível inscrever uma circunferência
  com diâmetro maior ou igual a 1,5 D o centro geométrico da TLOF deve estar localizado numa
  distância não inferior a 0,75 D da borda da FATO.'
