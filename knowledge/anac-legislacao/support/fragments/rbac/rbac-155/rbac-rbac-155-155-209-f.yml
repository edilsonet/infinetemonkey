cite: 155.209(f)
title: 155.209(f)
text: '(f)

  Os objetos que, devido às suas funções, precisam estar localizados na área de segurança,
  devem ser frangíveis e atender aos seguintes requisitos:

  (1)

  se localizados entre a borda da FATO e a borda da área de segurança, não podem penetrar
  o plano originado na altura de 25 cm acima do plano da FATO; e

  (2)

  se localizados a partir da borda da área de segurança, não podem penetrar o plano originado
  na altura de 25 cm acima do plano da FATO e inclinando-se para cima e para fora da margem
  da área de segurança a uma rampa de 5%.'
