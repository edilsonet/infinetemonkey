title: 155.209(h)
text: '(h)

  A área de segurança de uma FATO destinada a operação por instrumento deve se estender, conforme
  Figura 155.209-3:

  (1)

  lateralmente a uma distância de pelo menos 45 m para cada lado do eixo da FATO; e

  (2)

  longitudinalmente a uma distância de pelo menos 60 m além do final da FATO.

  Figura 155.209-3 - Área de segurança para FATO com operação por instrumento'
