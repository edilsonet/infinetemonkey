title: 155.211(a)
text: '(a)

  Uma pista de táxi terrestre de helicóptero deve ter largura não inferior a 1,5 vezes a distância
  entre as faces externas dos pneus do trem de pouso principal (UCW) do maior helicóptero
  previsto a utilizar a pista de táxi terrestre de helicóptero, conforme Figura 155.211-1.

  Figura 155.211-1 - Pist

  a e rota de táxi terrestre (heliponto ao nível do solo).'
