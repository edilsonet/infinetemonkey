title: 155.211(e)
text: '(e)

  Uma rota de táxi terrestre de helicóptero deve se estender simetricamente para cada lado
  do eixo de pista de táxi terrestre de helicóptero por, no mínimo, 0,75 vezes a maior largura
  total com os rotores girando (RD) do helicóptero mais largo previsto a utilizar a pista
  de táxi terrestre de helicóptero, conforme Figura 155.211-1.'
