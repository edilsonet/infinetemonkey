title: 155.211(i)
text: '(i)

  A pista de táxi terrestre de helicóptero e a rota de táxi terrestre de helicóptero associada
  devem proporcionar uma drenagem rápida, porém a declividade transversal da pista de táxi
  terrestre de helicóptero não pode exceder 2%.'
