title: 155.213(a)
text: '(a)

  A largura de uma pista de táxi aéreo de helicóptero deve ser, no mínimo, duas vezes maior
  que a distância entre as faces externas do trem de pouso principal (UCW) do maior helicóptero
  previsto a utilizar a pista de táxi aéreo de helicóptero, conforme Figura 155.213-1.

  Figura 155.213-1

  - Pista e rota de táxi aéreo (heliponto ao nível do solo).'
