title: 155.213(c)
text: '(c)

  As declividades de uma pista de táxi aéreo de helicóptero não podem exceder os valores limites
  impostos para o pouso dos helicópteros previstos a utilizar a pista de táxi aéreo, quando
  previstos no Manual de Voo do Helicóptero (HFM).'
