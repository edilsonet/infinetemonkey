title: 155.213(f)
text: '(f)

  Uma rota de táxi aéreo de helicóptero deve se estender simetricamente para cada lado do
  eixo de pista de táxi aéreo de helicóptero por, no mínimo, uma vez a maior largura total
  com os rotores girando (RD) do helicóptero mais largo previsto a utilizar a pista de táxi
  aéreo de helicóptero, conforme Figura 155.213-1.'
