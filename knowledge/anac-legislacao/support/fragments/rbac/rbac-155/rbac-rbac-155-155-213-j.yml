cite: 155.213(j)
title: 155.213(j)
text: '(j)

  A superfície da rota de táxi aéreo de helicóptero deve:

  (1)

  ser resistente aos efeitos do refluxo do rotor; e

  (2)

  proporcionar efeito solo.'
