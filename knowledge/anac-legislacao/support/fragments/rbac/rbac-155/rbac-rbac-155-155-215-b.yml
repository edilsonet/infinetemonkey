title: 155.215(b)
text: '(b)

  Uma posição de estacionamento de helicóptero na qual esteja previsto o giro de helicóptero
  deve:

  (1)

  ter dimensões suficientes para inscrever um círculo de diâmetro maior ou igual a 1,2 D do
  maior helicóptero previsto a utilizar a posição; e

  (2)

  ser circundada por uma área de proteção que se estenda por uma distância não inferior a
  0,4 D a partir da borda da posição de estacionamento de helicóptero.'
