title: 155.215(c)
text: '(c)

  Uma posição de estacionamento de helicóptero na qual esteja prevista a passagem do helicóptero
  em táxi, não sendo permitido o giro do helicóptero, a largura mínima da posição de estacionamento
  de helicóptero acrescida da respectiva área de proteção deve ser a mesma largura prevista
  para a rota de táxi.'
