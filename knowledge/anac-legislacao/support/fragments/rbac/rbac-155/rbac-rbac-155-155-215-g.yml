title: 155.215(g)
text: '(g)

  Nenhum objeto fixo é permitido acima do nível do solo na área de proteção de posição de
  estacionamento de helicóptero, exceto objetos frangíveis que, devido às suas funções, devem
  estar localizados na área.'
