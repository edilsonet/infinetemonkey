title: 155.215(i)
text: '(i)

  Os objetos que, devido às suas funções, precisam estar localizados na área de proteção de
  posição de estacionamento de helicóptero devem ser frangíveis e atender aos seguintes requisitos:

  (1)

  se localizados numa distância inferior a 0,75 D do centro da posição de estacionamento de
  helicóptero, não podem penetrar o plano horizontal originado na altura de 5 cm acima do
  plano da zona central da posição de estacionamento de helicóptero; e

  (2)

  se localizados numa distância maior ou igual a 0,75 D do centro da posição de estacionamento
  de helicóptero, não podem penetrar o plano originado na altura de 25 cm acima do plano da
  zona central da posição de estacionamento de helicóptero, e inclinando-se para cima e para
  fora a uma rampa de 5%.'
