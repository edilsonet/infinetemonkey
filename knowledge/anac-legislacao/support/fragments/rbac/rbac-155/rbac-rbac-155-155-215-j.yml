cite: 155.215(j)
title: 155.215(j)
text: '(j)

  As posições de estacionamento de helicópteros devem conter uma zona central resistente ao
  tráfego de helicópteros para a qual foi projetada, apresentando as seguintes dimensões:

  (1)

  diâmetro não inferior a 0,83 D do maior helicóptero previsto a utilizar a posição de estacionamento;
  ou

  (2)

  para uma posição de estacionamento de helicóptero na qual está prevista a passagem do helicóptero
  em táxi, não sendo permitido o giro do helicóptero, devem ser utilizadas as mesmas larguras
  requeridas para pistas de táxi terrestres.'
