cite: 155.217(c)
title: 155.217(c)
text: '(c)

  A FATO deve possuir capacidade de suporte para cargas dinâmicas de impacto do maior helicóptero
  previsto a operar no heliponto.

  (1)

  Para a situação de pouso normal, deve ser considerada uma taxa de descida de 1,8 m/s (o
  que equivale ao estado limite de serviço). Nesta situação, o coeficiente parcial de segurança
  para a determinação da capacidade de suporte da FATO equivalerá a 1,5.

  (2)

  Para a situação de pouso de emergência, deve ser considerada uma taxa de descida de 3,6
  m/s (o que equivale ao estado limite último). Nesta situação, o coeficiente parcial de segurança
  para a determinação da capacidade de suporte da FATO equivalerá a 2,5.'
