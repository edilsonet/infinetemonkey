title: 155.219(g)
text: '(g)

  A superfície do terreno em uma zona desimpedida (

  clearway

  ) não pode se projetar acima do plano com inclinação ascendente de 3 %, sendo que o limite
  inferior deste plano é a linha horizontal localizada na borda da FATO.'
