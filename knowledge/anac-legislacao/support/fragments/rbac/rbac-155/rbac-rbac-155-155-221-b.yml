cite: 155.221(b)
title: 155.221(b)
text: '(b)

  A TLOF deve possuir formato quadrado, retangular ou circular e tamanho suficiente para conter
  uma circunferência de diâmetro não inferior a 0,83 D do maior helicóptero cuja operação
  é prevista na área.

  (1)

  É recomendado que a TLOF possua tamanho suficiente para conter uma circunferência de diâmetro
  não inferior a 1 D do maior helicóptero cuja operação é prevista na área.'
