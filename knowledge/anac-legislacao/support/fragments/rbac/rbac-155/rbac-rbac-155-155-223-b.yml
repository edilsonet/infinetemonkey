cite: 155.223(b)
title: 155.223(b)
text: '(b)

  A área de segurança de uma FATO destinada ao uso de helicópteros que operam com classe de
  performance 1 em condições meteorológicas de voo visual (VMC) deve se estender, para além
  de seu perímetro, por, no mínimo, 0,25 D do maior helicóptero previsto para operar na FATO.'
