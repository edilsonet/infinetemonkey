cite: 155.223(c)
title: 155.223(c)
text: '(c)

  A área de segurança de uma FATO destinada ao uso de helicópteros que operam com classe de
  performance 2 e 3 em condições meteorológicas de voo visual (VMC) deve se estender, para
  além de seu perímetro, por, no mínimo, 0,5 D do maior helicóptero previsto para operar na
  FATO.'
