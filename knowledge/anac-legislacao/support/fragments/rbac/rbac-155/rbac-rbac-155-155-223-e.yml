cite: 155.223(e)
title: 155.223(e)
text: '(e)

  O entorno da FATO deve ser protegido por uma superfície plana inclinada em 45º ascendente,
  iniciando-se na borda da área de segurança e prolongando-se a 10 m da mesma, conforme Figura
  155.209-2. Esta superfície plana não pode ser penetrada por obstáculos, exceto quando localizados
  em apenas uma das laterais da FATO.'
