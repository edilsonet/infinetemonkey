title: 155.223(i)
text: '(i)

  Se a superfície da área de segurança for constituída por uma superfície sólida, a mesma
  deve:

  (1)

  possuir declividade que não exceda uma inclinação ascendente superior a 4% a partir da borda
  da FATO;

  (2)

  ser tratada e estar livre de pedras soltas e quaisquer outros detritos passíveis de serem
  lançados ao ar pelo refluxo do rotor dos helicópteros; e

  (3)

  ser contínua em relação à superfície da FATO.'
