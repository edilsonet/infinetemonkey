cite: 155.225(a)
title: 155.225(a)
text: '(a)

  É obrigatória a instalação de grades ou redes de segurança em helipontos elevados quando:

  (1)

  a distância entre o perímetro de uma FATO e o perímetro da edificação for inferior a 1,5
  m. A exigência da instalação da grade ou rede de segurança é requerida apenas no(s) trecho(s)
  onde for aplicável; ou

  (2)

  a diferença entre as elevações da FATO e da edificação no seu entorno for igual ou superior
  a 1,5 m. A exigência da instalação da grade ou rede de segurança é requerida apenas no(s)
  trecho(s) onde aplicável.'
