title: 155.227(a)
text: '(a)

  Uma pista de táxi terrestre de helicóptero deve ter largura não inferior a 2 vezes a distância
  entre as faces externas dos pneus do trem de pouso principal (2,0 UCW) do maior helicóptero
  previsto a utilizar a pista de táxi terrestre de helicóptero.'
