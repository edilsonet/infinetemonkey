title: 155.229(a)
text: '(a)

  A largura de uma pista de táxi aéreo deve ser, no mínimo, três vezes maior do que a maior
  distância entre as faces externas do trem de pouso principal (3,0 UCW) do maior helicóptero
  previsto a utilizar a pista de táxi aéreo.'
