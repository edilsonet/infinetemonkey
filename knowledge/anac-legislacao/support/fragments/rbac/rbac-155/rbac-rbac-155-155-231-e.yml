title: 155.231(e)
text: '(e)

  As dimensões de posição de estacionamento de helicóptero destinadas a operações de táxi
  em solo realizadas por helicópteros com rodas devem considerar o raio mínimo de giro do
  maior helicóptero com rodas previsto a estacionar na posição.'
