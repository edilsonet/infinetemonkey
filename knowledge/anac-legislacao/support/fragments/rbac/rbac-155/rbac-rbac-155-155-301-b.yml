title: 155.301(b)
text: '(b)

  O local a ser posicionado o indicador de direção de vento deve:

  (1)

  ser visível a um helicóptero em voo, em planeio ou na área de movimento;

  (2)

  indicar as condições do vento na FATO e na TLOF;

  (3)

  estar livre dos efeitos das alterações de fluxo de ar causadas por objetos próximos ou pelo
  refluxo do rotor; e

  (4)

  ter baixos níveis de iluminação de fundo.'
