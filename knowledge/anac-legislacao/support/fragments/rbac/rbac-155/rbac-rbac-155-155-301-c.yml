title: 155.301(c)
text: '(c)

  Nos casos em que TLOF e/ou FATO sejam afetadas por alterações de fluxo de ar, devem ser
  instalados indicadores de direção de vento adicionais, próximos às áreas, de forma a indicar
  o vento de superfície.'
