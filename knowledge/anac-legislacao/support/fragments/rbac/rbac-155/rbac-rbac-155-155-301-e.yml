title: 155.301(e)
text: '(e)

  O cone de vento deve possuir uma ou duas cores.

  (1)

  As cores devem ser selecionadas de modo que se destaquem no solo e que sejam visíveis de
  uma altura de 300 m.

  (2)

  Quando empregada cor única, esta deve ser branca ou laranja.

  (3)

  Quando empregadas duas cores, uma delas deve ser branca. Devem ser previstas cinco faixas
  alternadas, perpendiculares ao eixo do cone de vento, organizadas de modo que a primeira
  e a última sejam as mais escuras.

  (4)

  As cores escolhidas deverão atender as especificações abaixo descriminadas, de acordo com
  o código Munsell:'
