cite: 155.301(f)
title: 155.301(f)
text: '(f)

  A cesta de sustentação do cone de vento deve ter forma geométrica de tronco de cone, com
  comprimento igual a três oitavos do comprimento total do conjunto.

  (1)

  O bocal da entrada do cone de vento deve ser mantido aberto, mesmo quando o vento estiver
  calmo.

  (2)

  A cesta de sustentação do cone de vento não pode acumular água no interior do cone de vento.'
