title: 155.301(g)
text: '(g)

  O mastro de sustentação deve ter as seguintes características:

  (1)

  comprimento útil e seção transversal que permita suportar todos os esforços a que possa
  ser submetido, sem evidências de danos ou deformações permanentes;

  (2)

  possuir conexão frangível e resistente aos esforços máximos dos ventos previstos, quando
  instalado na área de segurança ou violando as rampas protegidas; e

  (3)

  possuir dimensões conforme Figura 155.301-2 e Tabela 155.301-2.

  iluminação externa

  não iluminada

  iluminação interna e externa

