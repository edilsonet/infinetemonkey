title: 155.303(c)
text: '(c)

  Com exceção de heliponto localizado em hospital, a sinalização horizontal de identificação
  de heliponto consiste da letra “H”, na cor branca. As dimensões da sinalização horizontal
  de identificação de heliponto não podem ser inferiores às dimensões apresentadas na Figura
  155.303-1.

  Todas as medidas estão expressas em metros

  Figura 155.303-1 - Sinalização horizontal de identi

  ficação de heliponto.'
