title: 155.303(d)
text: '(d)

  Para helipontos localizados em hospitais, a sinalização horizontal de identificação de heliponto
  consiste da letra “H”, na cor branca, inserida sobre uma cruz vermelha formada por quadrados
  adjacentes a cada lado do quadrado que contém a letra “H”, conforme Figura 155.303-2.

  Todas as medidas estão expressas em metros

  Figura 1

  55.303-2 - Sinalização horizontal de identificação de heliponto em hospital.'
