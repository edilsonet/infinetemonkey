title: 155.303(f)
text: '(f)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de identificação
  de heliponto deve ser feita com materiais retrorrefletivos, desenvolvidos de forma a aumentar
  a visibilidade da sinalização.'
