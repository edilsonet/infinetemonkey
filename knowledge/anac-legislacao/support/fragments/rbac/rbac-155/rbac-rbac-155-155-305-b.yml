title: 155.305(b)
text: '(b)

  A sinalização horizontal de identificação do heliponto, letra “H”, deve estar localizada
  em cada extremidade da FATO, devendo ser usada em conjunto com as sinalizações horizontais
  de designação de FATO, conforme apresentado na Figura 155.305-1.'
