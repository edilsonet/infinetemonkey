text: '(c)

  As dimensões da sinalização horizontal de identificação de heliponto para FATO tipo pista
  de pouso e decolagem, letra “H”, são aquelas constantes na Figura 155.303-1, multiplicadas
  por um fator de 3.

  Figura 155.305-1 - FATO tipo pista de pouso e decola

  gem: exemplo de sinalizações horizontais de identificação de heliponto e designação de FATO.'
