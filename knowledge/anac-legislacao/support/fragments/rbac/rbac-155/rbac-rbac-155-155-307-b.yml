title: 155.307(b)
text: '(b)

  A sinalização horizontal de massa máxima admissível deve estar localizada na TLOF, dentro
  da FATO, posicionada próxima e à direita do vértice do triângulo da sinalização horizontal
  de ponto de visada (para helipontos não localizados em hospitais) ou da cruz (para helipontos
  localizados em hospitais), e com a mesma orientação da letra “H”, conforme Figura 155.307-1.

  Figura 155.307-1 - Exemplos d

  e posições da sinalização de massa máxima admissível no heliponto em conjunto com sinalização
  horizontal de identificação de heliponto.'
