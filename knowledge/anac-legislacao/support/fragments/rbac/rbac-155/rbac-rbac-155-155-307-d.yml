title: 155.307(d)
text: '(d)

  As frações de tonelada deverão ser arredondadas para o número inteiro inferior mais próximo
  quando a massa máxima admissível de decolagem do helicóptero permitido a operar na TLOF,
  dentro da FATO, for igual ou superior a 1.000 kg.'
