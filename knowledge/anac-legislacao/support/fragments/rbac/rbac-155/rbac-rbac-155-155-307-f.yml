title: 155.307(f)
text: '(f)

  Os números e a letra devem possuir cor branca, sendo que:

  (1) para FATO com dimensões superiores a 30 m, devem possuir as formas e proporções apresentadas
  na Figura 155.307-2; e

  (2) para FATO com dimensões entre 18 m e 30 m, devem ter as formas e proporções apresentadas
  na Figura 155.307-2 reduzidas em uma escala de 3/5.

  Todas as medidas estão expressas em centímetros

  “t" possui raio interno de 10 cm e externo de 20cm

  Figura 155.307-2 - Form

  as e proporções para números e letra da sinalização horizontal de massa máxima admissível.'
