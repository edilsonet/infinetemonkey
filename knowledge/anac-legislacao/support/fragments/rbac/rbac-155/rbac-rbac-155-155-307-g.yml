title: 155.307(g)
text: '(g)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de massa máxima
  admissível deve ser feita com materiais retrorrefletivos, desenvolvidos de forma a aumentar
  a visibilidade da sinalização.'
