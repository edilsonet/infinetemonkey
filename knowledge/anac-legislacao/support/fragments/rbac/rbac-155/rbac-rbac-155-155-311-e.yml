title: 155.311(e)
text: '(e)

  Os números da sinalização horizontal de dimensões de FATO, exceto para FATO tipo pista de
  pouso e decolagem, devem ser na cor branca, sendo que:

  (1)

  para FATO com dimensões superiores a 30 m, devem possuir as formas e proporções apresentadas
  na Figura 155.307-2; e

  (2)

  para FATO com dimensões inferiores ou iguais a 30 m, devem ter as formas e proporções apresentadas
  na Figura 155.307-2 reduzidas em uma escala de 3/5.'
