title: 155.311(g)
text: '(g)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de dimensões
  de FATO deve ser feita com materiais retrorrefletivos, desenvolvidos de forma a aumentar
  a visibilidade da sinalização.'
