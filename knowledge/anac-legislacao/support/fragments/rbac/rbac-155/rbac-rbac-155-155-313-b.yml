cite: 155.313(b)
title: 155.313(b)
text: '(b)

  O perímetro da FATO não pavimentada deve ser definido por sinalizadores nivelados com o
  solo, na cor branca. Os sinalizadores devem ter 30 cm de largura e 1,5 m de comprimento,
  sendo que o espaçamento entre suas extremidades deve ser compreendido entre 1,5 m e 2 m.

  (1)

  Os vértices da FATO com formato quadrado ou retangular devem ser sinalizados.'
