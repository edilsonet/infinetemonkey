title: 155.313(c)
text: '(c)

  O perímetro da FATO pavimentada deve ser definido por uma linha tracejada na cor branca.
  Os segmentos da sinalização horizontal devem ter 30 cm de largura e 1,5 m de comprimento,
  sendo que o espaçamento entre suas extremidades deve ser compreendido entre 1,5 m e 2 m.

  (1)

  Os vértices da FATO com formato quadrado ou retangular devem ser sinalizados.'
