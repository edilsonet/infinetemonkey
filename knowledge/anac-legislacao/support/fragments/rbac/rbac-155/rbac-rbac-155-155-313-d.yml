title: 155.313(d)
text: '(d)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal ou sinalizadores
  de perímetro de FATO deve ser feita com materiais retrorrefletivos, desenvolvidos de forma
  a aumentar a visibilidade da sinalização.'
