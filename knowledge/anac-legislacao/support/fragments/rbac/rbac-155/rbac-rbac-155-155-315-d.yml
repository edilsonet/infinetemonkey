title: 155.315(d)
text: '(d)

  A sinalização horizontal de perímetro de FATO consiste de faixas retangulares na cor branca
  com largura de 1 m e comprimento compreendido entre 9 m e 1/5 do comprimento total do lado
  da FATO que a define, conforme Figura 155.315-1.

  Figura 155.315-1 - Sinalização horizontal de pe

  rímetro de FATO tipo pista de pouso e decolagem.'
