title: 155.315(e)
text: '(e)

  Os sinalizadores de perímetro de FATO devem possuir uma única cor (laranja ou vermelho)
  ou duas cores contrastantes (laranja e branca ou vermelha e branca) dispostas alternadamente,
  e as características dimensionais constantes na Figura 155.315-2.

  Todas as medidas estão expressas em metros

  Figura 155.315-2 - Sinalizado

  r de perímetro de FATO tipo pista de pouso e decolagem.'
