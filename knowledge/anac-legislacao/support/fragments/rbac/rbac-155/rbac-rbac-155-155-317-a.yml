title: 155.317(a)
text: '(a)

  A sinalização horizontal de designação de FATO tipo pista de pouso e decolagem deve estar
  localizada nas extremidades da FATO tipo pista de pouso e decolagem, nas formas e proporções
  mostradas na Figura 155.307-2 multiplicadas por um fator de 6.'
