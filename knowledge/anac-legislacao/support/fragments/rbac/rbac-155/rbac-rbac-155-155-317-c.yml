title: 155.317(c)
text: '(c)

  No caso de FATO tipo pista de pouso e decolagem paralelas, cada número de designação deve
  ser complementado com uma letra, como segue, na ordem demonstrada da esquerda para a direita,
  quando vistas da direção de aproximação, conforme Figuras 155.317-1 e 155.317-2:

  (1)

  para duas pistas paralelas: “L” “R”;

  (2)

  para três pistas paralelas: “L” “C” “R”; e

  (3)

  para quatro pistas paralelas: “L” “R” “L” “R”.

  Todas as medidas estão expressas em metros

  Figura 155.317-1 - Form

  as e proporções das letras para sinalização horizontal de designação de FATO tipo pista
  de pouso e decolagem.

  Figura 155.317-2 - D

  uas FATO tipo pista de pouso e decolagem paralelas.'
