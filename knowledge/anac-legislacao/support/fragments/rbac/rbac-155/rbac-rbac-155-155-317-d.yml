title: 155.317(d)
text: '(d)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de designação
  de FATO tipo pista de pouso e decolagem deve ser feita com materiais retrorrefletivos, desenvolvidos
  de forma a aumentar a visibilidade da sinalização.'
