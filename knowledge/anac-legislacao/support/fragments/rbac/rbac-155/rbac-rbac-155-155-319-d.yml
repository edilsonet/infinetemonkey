title: 155.319(d)
text: '(d)

  A sinalização horizontal de ponto de visada de heliponto consiste de um triângulo equilátero,
  com o vértice pintado apontado para o norte magnético. O triângulo é composto por linhas
  tracejadas, na cor branca, conforme Figura 155.319-1.

  Todas as medidas estão expressas em metros

  Figura 155.319-1 - Sinali

  zação horizontal de ponto de visada de heliponto'
