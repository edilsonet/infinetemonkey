title: 155.321(a)
text: '(a)

  A sinalização horizontal de perímetro de TLOF deve ser aplicada em TLOF localizada dentro
  de FATO.

  (1)

  A sinalização horizontal de perímetro de TLOF não se aplica para FATO tipo pista de pouso
  e decolagem.'
