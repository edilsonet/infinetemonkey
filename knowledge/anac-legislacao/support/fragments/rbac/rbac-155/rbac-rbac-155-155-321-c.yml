title: 155.321(c)
text: '(c)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de perímetro
  de TLOF deve ser feita com materiais retrorrefletivos, desenvolvidos de forma a aumentar
  a visibilidade da sinalização.'
