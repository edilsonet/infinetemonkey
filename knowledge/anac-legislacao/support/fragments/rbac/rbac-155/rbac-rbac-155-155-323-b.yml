title: 155.323(b)
text: '(b)

  A sinalização horizontal de ponto de toque e posicionamento deve estar localizada de forma
  que, quando o assento do piloto estiver sobre a sinalização, todo o trem de pouso principal
  fique dentro da TLOF e se mantenha uma margem de segurança entre todas as partes do helicóptero
  e qualquer obstáculo.'
