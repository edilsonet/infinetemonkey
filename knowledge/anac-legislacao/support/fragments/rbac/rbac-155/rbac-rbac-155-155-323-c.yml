title: 155.323(c)
text: '(c)

  O centro da sinalização horizontal de ponto de toque e posicionamento deve ser coincidente
  com o centro da TLOF e/ou da zona central da posição de estacionamento de helicóptero na
  qual é permitido o giro do helicóptero.'
