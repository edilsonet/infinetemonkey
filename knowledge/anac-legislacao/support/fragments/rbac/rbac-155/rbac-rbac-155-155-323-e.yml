title: 155.323(e)
text: '(e)

  O diâmetro interno da sinalização horizontal de ponto de toque e posicionamento deve ser
  de 0,5 D do maior helicóptero previsto a utilizar a TLOF e/ou posição de estacionamento
  de helicóptero.'
