title: 155.323(f)
text: '(f)

  Em helipontos onde são previstas operações noturnas, a sinalização horizontal de ponto de
  toque e posicionamento deve ser feita com materiais retrorrefletivos, desenvolvidos de forma
  a aumentar a visibilidade da sinalização.'
