title: 155.325(a)
text: '(a)

  Será empregada sinalização horizontal de denominação de heliponto quando a menor distância,
  em projeção, medida entre as FATO do heliponto em questão e de helipontos circunvizinhos,
  sejam públicos ou privados, for igual ou inferior a 200 m.'
