title: 155.325(b)
text: '(b)

  A sinalização horizontal de denominação de heliponto consiste na pintura na cor branca do
  indicador de localidade, padrão OACI, definido para o heliponto. Quando se tratar de FATO
  quadrada ou retangular, deve ser situada na área compreendida entre as sinalizações horizontais
  de perímetro de FATO e de TLOF e posicionada à esquerda da sinalização horizontal de orientação
  de alinhamento de trajetória de voo que indica a direção preferencial de aproximação final.
  Quando se tratar de FATO circular, deve ser posicionada de modo que se torne visível pelo
  piloto quando da aproximação na FATO.'
