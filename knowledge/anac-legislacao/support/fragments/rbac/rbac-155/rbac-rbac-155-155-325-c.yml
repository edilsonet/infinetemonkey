title: 155.325(c)
text: '(c)

  As letras da sinalização horizontal de denominação de heliponto devem possuir, no mínimo,
  0,90 m de altura, espaçadas entre si em 30 cm, seguindo o padrão descrito no Apêndice B
  deste Regulamento.'
