title: 155.327(a)
text: '(a)

  O eixo de uma pista de táxi terrestre deve possuir sinalização horizontal com as seguintes
  características:

  (1)

  linha contínua ao longo de todo o eixo da pista de táxi terrestre;

  (2)

  na cor amarela;

  (3)

  15 cm de largura; e

  (4)

  quando previstas operações noturnas na pista de táxi terrestre, deve ser feita com materiais
  retrorrefletivos, desenvolvidos de forma a aumentar a visibilidade da sinalização.'
