title: 155.327(b)
text: '(b)

  A sinalização horizontal de borda de pista de táxi terrestre deve possuir as seguintes características:

  (1)

  linha dupla contínua ao longo de toda a borda da pista de táxi terrestre;

  (2)

  na cor amarela;

  (3)

  15 cm de largura, espaçadas entre si em 15 cm; e

  (4)

  quando previstas operações noturnas na pista de táxi terrestre, deve ser feita com materiais
  retrorrefletivos, desenvolvidos de forma a aumentar a visibilidade da sinalização.'
