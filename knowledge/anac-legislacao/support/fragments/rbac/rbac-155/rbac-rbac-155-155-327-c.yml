title: 155.327(c)
text: '(c)

  Os sinalizadores de borda de pista de táxi terrestre devem possuir as seguintes características:

  (1)

  posicionados numa distância compreendida entre 0,5 e 3,0 m além da borda da pista de táxi
  terrestre, sendo que a altura não pode se projetar acima do plano descrito no parágrafo
  155.211(h)(2);

  (2)

  uniformemente distribuídos em intervalos não superiores a 15 m nos trechos retos e 7,5 m
  nos curvos, sendo que, em cada trecho devem ser instalados, no mínimo, 4 (quatro) sinalizadores
  igualmente espaçados;

  (3)

  frangíveis;

  (4)

  na cor azul; e

  (5)

  iluminados internamente ou retrorrefletivos se usados em operações noturnas.'
