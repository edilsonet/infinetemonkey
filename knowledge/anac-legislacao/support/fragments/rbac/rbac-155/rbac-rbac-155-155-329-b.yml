title: 155.329(b)
text: '(b)

  A borda de uma pista de táxi aéreo pavimentada deve possuir sinalização horizontal com as
  seguintes características:

  (1)

  linha dupla contínua ao longo de toda a borda;

  (2)

  na cor amarela;

  (3)

  15 cm de largura, espaçadas entre si em 15 cm; e

  (4)

  quando previstas operações noturnas na pista de táxi aéreo, deve ser feita com materiais
  retrorrefletivos, desenvolvidos de forma a aumentar a visibilidade da sinalização.'
