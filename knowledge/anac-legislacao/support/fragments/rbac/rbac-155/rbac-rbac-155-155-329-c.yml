title: 155.329(c)
text: '(c)

  Quando houver possibilidade de uma pista de táxi aéreo ser confundida com uma pista de táxi
  terrestre, deve haver uma sinalização de modo a informar qual tipo de operação é permitida
  àquela pista.'
