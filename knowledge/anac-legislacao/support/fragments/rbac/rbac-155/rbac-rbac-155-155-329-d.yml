title: 155.329(d)
text: '(d)

  O eixo de uma pista de táxi aéreo não pavimentada, que não comporta sinalização horizontal,
  deve possuir sinalizadores nivelados com o solo, que consistem em retângulos amarelos com
  as seguintes características:

  (1)

  dimensão de 0,15 m x 1,50 m;

  (2)

  espaçamento a cada 30 m nos trechos retos e 15 m nos curvos;

  (3)

  possuir, no mínimo, 4 (quatro) sinalizadores em cada trecho reto ou curvo; e

  (4)

  quando previstas operações noturnas na pista de táxi aéreo, deve ser feita com materiais
  retrorrefletivos, desenvolvidos de forma a aumentar a visibilidade do sinalizador.'
