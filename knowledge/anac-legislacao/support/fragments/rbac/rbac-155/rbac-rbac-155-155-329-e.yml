title: 155.329(e)
text: '(e)

  A borda de uma pista de táxi aéreo não pavimentada, que não comporta sinalização horizontal,
  deve possuir sinalizadores com as seguintes características:

  (1)

  posicionados a uma distância entre 1,0 e 3,0 m além da borda;

  (2)

  posicionados a uma distância do eixo da pista de táxi aéreo superior a 0,5 vezes a maior
  largura total do helicóptero mais largo, com os rotores girando, previsto a operar no heliponto,
  sendo que a altura não pode se projetar acima do plano descrito no parágrafo 155.213(i)(2);

  (3)

  distribuídos uniformemente em intervalos não superiores a 30 m nos trechos retos e 15 m
  nos curvos.

  (4)

  possuir, no mínimo, 4 (quatro) sinalizadores igualmente espaçados em cada trecho reto ou
  curvo;

  (5)

  frangíveis;

  (6)

  em cor que não provoque confusão com a pista de táxi terrestre, exceto vermelho; e

  (7)

  se usados em operações noturnas, devem ser iluminados internamente ou retrorrefletivos.'
