title: 155.331(b)
text: '(b)

  As posições de estacionamento de helicópteros, nas quais é permitido o giro do helicóptero,
  devem conter as seguintes sinalizações horizontais:

  (1)

  linhas de entrada, saída e alinhamento, com 15 cm de largura;

  (2)

  onde possível, sinalização horizontal de perímetro de posição de estacionamento de helicóptero,
  constituída de uma coroa circular com diâmetro externo de 1,2 D e largura de 15 cm, concêntrica
  em relação à área central da posição de estacionamento;

  (3)

  quando não for possível a implantação da sinalização horizontal de perímetro de posição
  de estacionamento, deve ser implantada uma sinalização horizontal de perímetro da zona central
  da posição de estacionamento de helicóptero, constituída de uma coroa circular com diâmetro
  externo de 0,83 D e largura de 15 cm, concêntrica em relação à área central da posição de
  estacionamento.'
