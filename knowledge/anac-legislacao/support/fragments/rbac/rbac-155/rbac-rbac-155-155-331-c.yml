title: 155.331(c)
text: '(c)

  As posições de estacionamento de helicópteros nas quais é previsto apenas a passagem do
  helicóptero em táxi, não sendo permitido o giro do helicóptero, devem conter as seguintes
  sinalizações horizontais:

  (1)

  linhas de entrada, saída e alinhamento, com 15 cm de largura; e

  (2)

  linha de parada, localizada na posição de estacionamento de helicóptero e perpendicular
  à sinalização horizontal de eixo de pista de táxi terrestre. Deve possuir 50 cm de largura
  e comprimento não inferior à largura da pista de taxi terrestre.'
