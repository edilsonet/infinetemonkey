title: 155.331(d)
text: '(d)

  Quando for prevista a trajetória do helicóptero em um único sentido, devem ser incorporadas
  setas às sinalizações horizontais para indicação destes sentidos, com as dimensões apresentadas
  na Figura 155.331-1.

  Obs.: Medidas indicadas em metros

  Figura 155.331-1 - S

  eta de indicação de direção.'
