title: 155.331(e)
text: '(e)

  Os trechos curvos das linhas de entrada, saída e alinhamento devem possuir raios apropriados
  ao uso do maior helicóptero previsto a utilizar a posição de estacionamento e pátio de estacionamento
  de helicópteros, de acordo com o Manual de Voo do Helicóptero (HFM).'
