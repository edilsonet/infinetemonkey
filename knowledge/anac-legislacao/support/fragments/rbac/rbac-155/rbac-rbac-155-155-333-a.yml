title: 155.333(a)
text: '(a)

  A sinalização horizontal de orientação de alinhamento de trajetória de voo será empregada
  em FATO com formato quadrado ou retangular, para indicar direções de trajetória de aproximação
  e/ou decolagem disponíveis.'
