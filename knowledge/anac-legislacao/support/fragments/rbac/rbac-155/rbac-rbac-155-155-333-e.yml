title: 155.333(e)
text: '(e)

  Quando previstas operações noturnas, a sinalização horizontal de orientação de alinhamento
  de trajetória de voo deve ser feita com materiais retrorrefletivos, desenvolvidos de forma
  a aumentar a visibilidade da sinalização.'
