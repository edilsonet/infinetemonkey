title: 155.335(a)
text: '(a)

  Sinalização horizontal de interdição de FATO

  (1)

  Quando a FATO for interditada para operações de helicópteros, a área deverá ser imediatamente
  sinalizada com um quadrado vermelho com 3 m de lado e duas diagonais em amarelo, com 0,40
  m de largura, posicionado no centro geométrico da FATO, de forma a cobrir toda a sinalização
  horizontal de identificação de heliponto (letra “H”), conforme apresentado na Figura 155.335-1.

  a)

  Dimensões da sinalização horizontal de interdição de FATO

  b)

  Exemplo de sinalização horizontal de FATO interditada

  Obs.: Medidas indicadas em metros

  Figura 155.33

  5-1 - Sinalização horizontal de interdição de FATO.'
