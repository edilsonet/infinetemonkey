text: '(b)

  Sinalização horizontal de interdição de pista de táxi de helicóptero

  (1)

  Quando uma pista de táxi de helicóptero for interditada para operações de helicópteros,
  deve ser colocada imediatamente uma sinalização horizontal de interdição em cada extremidade
  da pista de táxi ou da parte interditada.

  (2)

  A sinalização horizontal de interdição de pista de táxi de helicóptero deve ser na cor amarela
  e ter a forma e as proporções apresentadas na Figura 155.335-2.

  Obs.: Medidas indicadas em metros

  Detalhe da sinalização horizontal de interdição de pista de táxi de helicóptero

