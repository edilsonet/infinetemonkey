cite: 155.337(c)
title: 155.337(c)
text: '(c)

  O sistema de iluminação do heliponto deve ser projetado para fornecer iluminação eficaz
  com base em condições noturnas. Caso o heliponto seja utilizado sob outras condições (neblina,
  crepúsculo, alvorecer etc.), a intensidade da iluminação deve ser alterada mediante o uso
  de controle de brilho, para que sejam mantidas indicações visuais eficazes.'
