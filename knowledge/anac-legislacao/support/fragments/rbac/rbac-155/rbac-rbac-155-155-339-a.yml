title: 155.339(a)
text: '(a)

  O farol de heliponto deve ser instalado, mediante iniciativa do operador ou determinação
  da ANAC, nas seguintes situações:

  (1)

  necessidade de orientação visual de longo alcance, não fornecida por outros meios visuais;
  ou

  (2)

  difícil identificação do heliponto devido às luzes no entorno.'
