title: 155.341(c)
text: '(c)

  O sistema de luzes de aproximação deve ser composto de uma fileira de três luzes espaçadas
  uniformemente em intervalos de 30 m e de uma barra transversal de 18 m de comprimento, a
  uma distância de 90 m do perímetro da FATO, conforme Figura 155.341-1. As luzes que formam
  a barra transversal devem estar em uma linha reta perpendicular à linha de luzes central
  e espaçadas em intervalos de 4,5 m. Onde houver necessidade de maior visibilidade do percurso
  da aproximação final, luzes adicionais espaçadas uniformemente em intervalos de 30 m devem
  ser acrescentadas além da barra transversal. As luzes além da barra transversal podem ser
  ininterruptas ou em flashes sequenciais, dependendo do ambiente.

  Figura 155.341-1 - Sistem

  a de luzes de aproximação'
