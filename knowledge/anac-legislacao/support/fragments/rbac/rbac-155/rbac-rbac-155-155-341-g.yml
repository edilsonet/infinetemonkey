title: 155.341(g)
text: '(g)

  As luzes em flashes devem ter uma frequência de flash de um por segundo e sua distribuição
  de luz deve ser como indicado no Apêndice C, Ilustração 3. A sequência de flashes deve iniciar
  a partir da luz mais externa e progredir em direção à barra transversal.'
