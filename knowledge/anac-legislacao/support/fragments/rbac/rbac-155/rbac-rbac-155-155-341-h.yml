title: 155.341(h)
text: '(h)

  A distribuição das luzes ininterruptas deve ser conforme indicado no Apêndice C, Ilustração
  2, exceto para FATO com operação de não-precisão, quando a intensidade deve ser aumentada
  por um fator de 3.'
