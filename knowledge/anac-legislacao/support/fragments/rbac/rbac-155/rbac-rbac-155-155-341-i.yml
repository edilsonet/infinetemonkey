title: 155.341(i)
text: '(i)

  Um controle adequado de brilho deve ser incorporado para permitir os ajustes de intensidade
  de luz para atingir as condições desejadas, considerando as seguintes graduações:

  (1)

  luzes ininterruptas - 100%, 30% e 10%; e

  (2)

  luzes em flashes - 100%, 10% e 3%.'
