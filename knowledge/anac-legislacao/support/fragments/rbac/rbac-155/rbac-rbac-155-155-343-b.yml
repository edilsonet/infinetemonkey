title: 155.343(b)
text: '(b)

  O sistema de iluminação de orientação de alinhamento de trajetória de voo deve ser disposto
  em linha reta, ao longo da direção da trajetória de aproximação e/ou decolagem, na extensão
  da TLOF, FATO, área de segurança e/ou outra superfície nas imediações dessas áreas.'
