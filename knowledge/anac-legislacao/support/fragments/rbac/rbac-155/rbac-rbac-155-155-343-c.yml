title: 155.343(c)
text: '(c)

  Quando o sistema de iluminação de orientação de alinhamento de trajetória de voo estiver
  combinado com a sinalização horizontal de orientação de alinhamento de trajetória de voo,
  as luzes devem estar alinhadas com o centro geométrico do conjunto de setas sempre que for
  praticável.'
