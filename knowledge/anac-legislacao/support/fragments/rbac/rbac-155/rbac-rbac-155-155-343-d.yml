title: 155.343(d)
text: '(d)

  O sistema de iluminação de orientação de alinhamento de trajetória de voo consiste em uma
  linha de três ou mais luzes espaçadas uniformemente ao longo de uma distância total mínima
  de 6 m. Os intervalos entre as luzes não podem ser inferiores a 1,5 m e exceder 3 m. Onde
  o espaço permitir, devem ser instaladas 5 luzes, conforme Figura 155.333-1.'
