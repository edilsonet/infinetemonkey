title: 155.343(g)
text: '(g)

  O sistema de iluminação de orientação de alinhamento de trajetória de voo deve ter um controle
  que permita o ajuste da intensidade da luz para atender às condições prevalecentes e para
  equilibrar o sistema com outras luzes de heliponto e de iluminação geral que possam estar
  presentes no entorno.'
