cite: 155.345(a)
title: 155.345(a)
text: '(a)

  Um heliponto deve possuir um sistema visual de orientação de alinhamento para auxiliar a
  aproximação, quando existirem uma ou mais das seguintes condições para operações noturnas:

  (1)

  procedimentos de separação de obstáculos, de abatimento de ruído ou de controle de tráfego
  que demandem uma direção especial a ser seguida;

  (2)

  poucas referências visuais de superfície no meio em que se encontra o heliponto; e

  (3)

  instalação de um sistema de luzes de aproximação fisicamente impraticável.'
