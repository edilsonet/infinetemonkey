cite: 155.345(e)
title: 155.345(e)
text: '(e)

  Quando for necessário visualizar as luzes do sistema como fontes luminosas discretas, as
  unidades de luz devem ser localizadas de tal forma que, nos extremos da cobertura do sistema,
  o ângulo subtendido entre as unidades, do ponto de vista do piloto, não seja inferior a
  3 minutos de arco.'
