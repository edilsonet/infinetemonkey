title: 155.345(g)
text: '(g)

  O formato do sinal do sistema visual de orientação de alinhamento deve incluir, no mínimo,
  três setores de sinais discretos, quais sejam: "desvio para a direita", "trajetória correta"
  e "desvio para a esquerda".'
