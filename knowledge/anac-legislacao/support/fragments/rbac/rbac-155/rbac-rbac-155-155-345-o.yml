title: 155.345(o)
text: '(o)

  O ângulo de azimute do sistema deve permitir que, durante uma aproximação, o piloto do helicóptero
  que estiver no limite do sinal "trajetória correta" também esteja afastado de qualquer obstáculo
  localizado na área de aproximação por uma margem segura.'
