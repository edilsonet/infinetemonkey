text: '(r)

  As unidades de luz devem ser projetadas de modo que depósitos de condensação, gelo, poeira,
  etc. sobre as superfícies ópticas transmissoras ou refletoras não interfiram no sinal luminoso
  e não causem sinais adulterados ou falsos.

