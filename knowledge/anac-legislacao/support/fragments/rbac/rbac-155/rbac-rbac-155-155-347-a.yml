section_title: Indicador visual de rampa de aproximação
subsection_id: a
cite: 155.347(a)
title: 155.347(a)
text: '(a)

  Um indicador visual de rampa de aproximação deve ser instalado para auxiliar na aproximação,
  independentemente de o heliponto possuir ou não outros auxílios visuais ou não visuais,
  quando uma ou mais das seguintes condições para operações noturnas estiverem presentes:

  (1)

  procedimentos de separação de obstáculos, de abatimento de ruído ou de controle de tráfego
  que requerem uma rampa específica a ser seguida;

  (2)

  há poucas referências visuais de superfície no meio em que se encontra o heliponto; e

  (3)

  as características do heliponto exigem uma aproximação estabilizada.'
