section_title: Indicador visual de rampa de aproximação
subsection_id: c
cite: 155.347(c)
title: 155.347(c)
text: '(c)

  O indicador visual de rampa de aproximação deve estar localizado de forma que o helicóptero
  seja guiado até a posição desejada dentro da FATO e de modo que evite o ofuscamento da visão
  do piloto durante a aproximação final e pouso.'
