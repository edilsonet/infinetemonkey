title: 155.347(l)
text: '(l)

  A distribuição de intensidade de luz do HAPI, nas cores vermelho e verde, deve ser como
  indicado no Apêndice C, Ilustração 4. Uma maior cobertura de azimute pode ser obtida por
  meio de instalação de um sistema HAPI sobre uma mesa giratória.'
