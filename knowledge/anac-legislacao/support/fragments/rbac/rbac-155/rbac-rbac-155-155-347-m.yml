title: 155.347(m)
text: '(m)

  As transições de cor do HAPI, no plano vertical, devem ser de forma que, para um observador
  a uma distância maior que 300 m, pareçam ocorrer em ângulo vertical inferior a 3 minutos
  de arco.'
