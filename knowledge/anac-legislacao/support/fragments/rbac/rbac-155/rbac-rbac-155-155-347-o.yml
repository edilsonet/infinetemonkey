cite: 155.347(o)
title: 155.347(o)
text: '(o)

  Em máxima intensidade, a luz vermelha do HAPI deve ter uma coordenada Y que não exceda 0,320,
  e a luz verde deve estar dentro dos limites especificados no parágrafo A.2(a)(3) do Apêndice
  A do RBAC 154, Emenda 02.'
