cite: 155.347(q)
title: 155.347(q)
text: '(q)

  O sistema HAPI deve ser suscetível a ajustes de elevação em qualquer ângulo desejado entre
  1 grau e 12 graus acima da horizontal, com precisão de ± 5 minutos de arco.'
