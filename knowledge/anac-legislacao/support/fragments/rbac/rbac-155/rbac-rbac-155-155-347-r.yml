cite: 155.347(r)
title: 155.347(r)
text: '(r)

  O ajuste do ângulo de elevação do HAPI deve permitir que, durante uma aproximação, o piloto
  de helicóptero que observe o limite superior do sinal de “abaixo da rampa” livre todos os
  objetos localizados na área de aproximação por uma margem segura.'
