cite: 155.347(s)
title: 155.347(s)
text: '(s)

  O sistema deve ser projetado de forma que:

  (1)

  no caso de haver desalinhamento vertical de uma unidade, excedendo ± 0,5 graus (± 30 minutos
  de arco), o sistema se apague automaticamente; e

  (2)

  no caso de falha do mecanismo de flash, não haja emissão de luz no setor danificado.'
