title: 155.347(t)
text: '(t)

  A unidade de luz do HAPI deve ser projetada de modo que depósitos de condensação, gelo,
  poeira, etc. sobre superfícies óticas transmissoras ou refletoras não interfiram no sinal
  luminoso e não causem sinais adulterados ou falsos.'
