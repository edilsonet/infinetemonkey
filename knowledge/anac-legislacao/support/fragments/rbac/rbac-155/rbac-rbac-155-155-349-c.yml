section_title: Sistema de iluminação da área de aproximação final e decolagem (FATO)
subsection_id: c
cite: 155.349(c)
title: 155.349(c)
text: '(c)

  As luzes da FATO devem ser onidirecionais, fixas na cor branca. Quando a intensidade for
  variável, as luzes devem apresentar variação na cor branca.'
