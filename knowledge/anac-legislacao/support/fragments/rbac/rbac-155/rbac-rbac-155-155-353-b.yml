cite: 155.353(b)
title: 155.353(b)
text: '(b)

  O sistema de iluminação da TLOF de um heliponto ao nível do solo deve ser composto por um
  ou mais dos seguintes elementos:

  (1)

  luzes de perímetro; ou

  (2)

  holofotes; ou

  (3)

  conjuntos de luzes pontuais segmentadas (ASPSL) ou painéis luminescentes (PL) para identificar
  a TLOF, quando o heliponto possuir sistema de iluminação de FATO e os requisitos constantes
  nos parágrafos 155.353(b)(1) e 155.353(b)(2) não forem viáveis.'
