title: 155.353(c)
text: '(c)

  O sistema de iluminação da TLOF de um heliponto elevado deve ser composto por:

  (1)

  luzes de perímetro; e

  (2)

  conjuntos de luzes pontuais segmentadas (ASPSL) ou painéis luminescentes (PL) para identificar
  a sinalização horizontal de ponto de toque, quando houver, e/ou holofotes para iluminar
  a TLOF.'
