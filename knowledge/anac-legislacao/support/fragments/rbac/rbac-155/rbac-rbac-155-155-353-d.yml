cite: 155.353(d)
title: 155.353(d)
text: '(d)

  Um heliponto ao nível do solo, destinado ao uso noturno, deve possuir iluminação de TLOF
  por ASPSL e/ou PL para identificar a sinalização horizontal de ponto de toque e/ou holofotes
  quando o operador ou a ANAC considerarem necessário realçar as referências visuais da superfície.'
