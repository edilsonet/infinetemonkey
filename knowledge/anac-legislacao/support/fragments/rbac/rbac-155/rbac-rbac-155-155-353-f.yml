title: 155.353(f)
text: '(f)

  As luzes de perímetro da TLOF devem ser colocadas ao longo de sua borda ou a uma distância
  inferior a 1,5 m da borda. Quando a TLOF for circular, as luzes devem ser:

  (1)

  dispostas em linhas retas, em um padrão capaz de permitir, aos pilotos, identificar eventual
  deslocamento do centro da TLOF; e

  (2)

  quando a disposição prevista no parágrafo 155.353(f)(1) não for possível, devem ser dispostas
  ao longo do perímetro da TLOF, no espaçamento apropriado, conforme o parágrafo 155.353(g),
  exceto em uma seção de 45 graus, em que as luzes devem ter o seu espaçamento reduzido à
  metade.'
