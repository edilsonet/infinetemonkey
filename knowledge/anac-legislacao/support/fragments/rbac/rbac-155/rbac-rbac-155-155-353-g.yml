title: 155.353(g)
text: '(g)

  As luzes de perímetro da TLOF devem estar uniformemente espaçadas a intervalos máximos de
  3 m para helipontos elevados e a intervalos máximos de 5 m para helipontos ao nível do solo.
  As laterais devem possuir número ímpar não inferior a 5 (cinco) luzes, incluindo uma luz
  em cada vértice. Para uma TLOF circular, onde as luzes forem instaladas de acordo com o
  parágrafo 155.353(f)(2), deve haver um mínimo de 14 (quatorze) luzes.'
