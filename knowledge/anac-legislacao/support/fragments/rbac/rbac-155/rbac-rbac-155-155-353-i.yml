title: 155.353(i)
text: '(i)

  Em heliportos ao nível do solo, ASPSL ou PL de identificação de TLOF, devem ser instalados
  ao longo da sinalização horizontal que delimita a borda da TLOF. Quando a TLOF for circular,
  devem ser localizados em linhas retas, circunscrevendo a área.'
