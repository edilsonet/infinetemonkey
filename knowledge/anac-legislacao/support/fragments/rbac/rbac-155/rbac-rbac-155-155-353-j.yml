cite: 155.353(j)
title: 155.353(j)
text: '(j)

  Em helipontos ao nível do solo, o número de painéis luminescentes (PL) em uma TLOF deve
  ser de no mínimo nove. O comprimento total dos PL colocados em uma determinada configuração
  não pode ser inferior a 50 por cento do comprimento desta configuração. O número de painéis
  deve ser ímpar, com um mínimo de 3 (três) painéis em cada lado da TLOF, incluindo um painel
  em cada vértice. Os PL devem ser uniformemente espaçados e a distância entre as extremidades
  dos painéis adjacentes, em cada lado do TLOF, não pode ser maior que 5 m.'
