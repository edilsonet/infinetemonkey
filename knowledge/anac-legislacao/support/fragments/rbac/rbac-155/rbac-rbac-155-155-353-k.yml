title: 155.353(k)
text: '(k)

  Quando forem utilizados PL em helipontos elevados para realçar as referências visuais de
  superfície, os painéis não podem ser colocados adjacentes às luzes de perímetro. Eles devem
  ser colocados ao redor da sinalização horizontal de ponto de toque, quando houver, ou coincidir
  com a sinalização horizontal de identificação do heliponto.'
