cite: 155.353(l)
title: 155.353(l)
text: '(l)

  Os holofotes da TLOF devem ser posicionados de forma a não ofuscar os pilotos em voo ou
  o pessoal de terra. O posicionamento e orientação dos holofotes devem ser de tal forma que
  as áreas de sombra sejam minimizadas.'
