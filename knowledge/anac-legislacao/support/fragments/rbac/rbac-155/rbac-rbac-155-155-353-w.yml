cite: 155.353(w)
title: 155.353(w)
text: '(w)

  A iluminação utilizada para identificar a sinalização horizontal de ponto de toque deve
  compreender um círculo segmentado de faixas de ASPSL omnidirecionais de cor amarela. Os
  segmentos devem consistir de faixas de ASPSL e o comprimento total das faixas de ASPSL não
  pode ser inferior a 50 por cento da circunferência do círculo.'
