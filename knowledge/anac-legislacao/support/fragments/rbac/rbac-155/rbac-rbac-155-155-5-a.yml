title: 155.5(a)
text: '(a)

  Para efeito deste Regulamento, aplicam-se as siglas e abreviaturas disponíveis no RBAC 01
  e as seguintes:

  (1)

  AIP -

  Aeronautical Information Publication

  - significa Publicações de Informações Aeronáuticas;

  (2)

  AIS -

  Aeronautical Information Service

  - significa Serviço de Informações Aeronáuticas;

  (3)

  APAPI -

  Abbreviated precision approach path

  - significa indicador abreviado de trajetória de aproximação de precisão;

  (4)

  ASPSL -

  Arrays of segmented point source lighting

  - significa conjuntos de luzes pontuais segmentadas;

  (5)

  CRC significa Checagem de Redundância Cíclica;

  (6)

  CTA significa Carro Tanque Abastecedor;

  (7)

  FATO -

  Final approach and take-off area

  - significa área de aproximação final e decolagem;

  (8)

  GS -

  Glide slope

  - significa indicador da trajetória de planeio do ILS;

  (9)

  GNSS -

  Global navigation satellite system

  - significa sistema global de navegação por satélite;

  (10)

  HAPI -

  Helicopter approach path indicator

  - significa sistema indicador de trajetória de aproximação de helicópteros;

  (11)

  HFM -

  Helicopter flight manual

  - significa manual de voo de helicópteros;

  (12)

  ILS -

  Instrument landing system

  - significa sistema de pouso por instrumento

  (13)

  kg significa Quilograma;

  (14)

  km significa Quilômetro;

  (15)

  km/h significa Quilômetro por hora;

  (16)

  LDAH -

  Landing distance available

  - significa distância disponível para pouso de helicópteros;

  (17)

  m/s significa Metro por segundo;

  (18)

  MSL -

  Mean sea level

  - significa nível médio do mar;

  (19)

  OACI significa Organização de Aviação Civil Internacional;

  (20)

  PAPI -

  Precision approach path indicator

  - significa indicador de trajetória de aproximação de precisão;

  (21)

  PLEM-H significa Plano de Emergência em Heliponto;

  (22)

  RD significa a maior largura total do helicóptero com os rotores girando;

  (23)

  RTODAH -

  Rejected take-off distance available

  - significa distância disponível para decolagem interrompida de helicópteros;

  (24)

  TODAH -

  Take-off distance available

  - significa distância disponível para decolagem de helicópteros;

  (25)

  TLOF -

  Touchdown and lift-off area

  - significa área de toque e elevação inicial;

  (26)

  UCW -

  Width of the undercarriage

  - significa distância entre faces externas do trem de pouso principal do helicóptero;

  (27)

  UTC significa Tempo Universal Coordenado; e

  (28)

  WGS-84 -

  World Geodetic System - 1984

  - significa Sistema Geodésico Mundial - 1984.'
