title: 155.51(a)
text: '(a)

  O operador de heliponto é responsável por:

  (1)

  cumprir e fazer cumprir, no heliponto, os requisitos definidos neste Regulamento e nas demais
  normas vigentes;

  (2)

  manter atualizadas as informações e os documentos que comprovem o cumprimento dos requisitos
  exigidos neste Regulamento;

  (3)

  manter atualizadas as informações do heliponto no Serviço de Informações Aeronáuticas (AIS);

  (4)

  prover e manter no heliponto recursos humanos, financeiros e tecnológicos para cumprir os
  requisitos e parâmetros estabelecidos neste Regulamento;

  (5)

  prover treinamento a todo pessoal cuja atividade influencie a segurança operacional, de
  modo a adequar suas atividades às características específicas do heliponto;

  (6)

  adotar medidas mitigadoras de forma a manter a área operacional livre da presença de pessoas,
  equipamentos e veículos não autorizados ou que constituam perigo às operações;'
