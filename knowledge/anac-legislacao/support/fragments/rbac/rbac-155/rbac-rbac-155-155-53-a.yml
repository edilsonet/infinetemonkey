title: 155.53(a)
text: '(a)

  O operador de heliponto deve estabelecer e implementar treinamentos voltados à segurança
  das operações para os profissionais que trabalham na área operacional, com as seguintes
  características:

  (1)

  estar vinculados a cada tipo de credenciamento do heliponto;

  (2)

  ter previsão de atualização técnica ou validade específica; e

  (3)

  ser o conteúdo programático adequado a cada público-alvo.'
