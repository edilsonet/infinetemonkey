title: 155.53(b)
text: '(b)

  Os treinamentos devem ter como objetivos:

  (1)

  a adequação das atividades desenvolvidas às características específicas do heliponto (físicas
  e operacionais); e

  (2)

  a segurança operacional das atividades desenvolvidas na área operacional.'
