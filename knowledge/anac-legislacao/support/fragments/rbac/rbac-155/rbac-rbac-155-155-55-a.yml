cite: 155.55(a)
title: 155.55(a)
text: '(a)

  O operador de heliponto deve manter nas imediações do heliponto, para consulta pelo pessoal
  responsável do operador de heliponto e pela ANAC em atividades de fiscalização, pelo período
  mínimo de 5 (cinco) anos, toda a documentação referente a:

  (1)

  constituição legal do heliponto e do operador de heliponto;

  (2)

  recursos humanos, incluindo treinamento de pessoal operacional;

  (3)

  contratos celebrados com terceiros; e

  (4)

  documentos aprovados pela ANAC.'
