cite: 155.55(c)
title: 155.55(c)
text: '(c)

  O operador de heliponto deve manter os seguintes dados atualizados na ANAC:

  (1)

  nome empresarial e número de inscrição do CNPJ da pessoa jurídica que exerce a atividade
  de operador do heliponto;

  (2)

  título do estabelecimento (nome fantasia);

  (3)

  endereço para envio de correspondência;

  (4)

  telefones fixos e celulares para contato; e

  (5)

  correio eletrônico para contato.'
