title: 155.603(a)
text: '(a)

  O operador de heliponto deve estabelecer e manter uma planificação de emergência que descreva
  as ações a serem executadas em casos de emergência aeronáutica, bem como os acionamentos
  a serem efetuados, objetivando, prioritariamente, o salvamento de vidas e, posteriormente,
  a continuidade das operações.'
