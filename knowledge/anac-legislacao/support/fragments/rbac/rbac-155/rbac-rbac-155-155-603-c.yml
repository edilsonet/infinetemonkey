title: 155.603(c)
text: '(c)

  A planificação de emergência deve ter seus procedimentos e recursos identificados para atendimento
  a emergências contidos em um documento único, intitulado Plano de Emergência de Heliponto
  - PLEM-H.

  (1)

  Modelo para elaboração do PLEM-H encontra-se disponível no sítio da ANAC na rede mundial
  de computadores.'
