title: 155.603(d)
text: '(d)

  O PLEM-H deve conter, no mínimo:

  (1)

  informação sobre os tipos de emergência aos quais se destina;

  (2)

  sequência de acionamentos e responsabilidades para cada tipo de emergência;

  (3)

  relação de recursos disponíveis e auxílios externos, bem como os meios de contato atualizados
  de cada um e a definição de sua participação no âmbito do plano;

  (4)

  procedimentos para utilização dos recursos disponíveis e forma de acionamento dos auxílios
  externos.

  (5)

  cópias de documentos que estabeleçam responsabilidades dos recursos disponíveis e auxílios
  externos;

  (6)

  mapa de grade do heliponto e seu entorno, conforme Apêndice D; e

  (7)

  rotas de fuga estabelecidas.'
