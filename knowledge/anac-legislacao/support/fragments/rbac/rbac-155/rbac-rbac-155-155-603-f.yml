title: 155.603(f)
text: '(f)

  Exercícios simulados para validação da Planificação de Emergência e dos procedimentos descritos
  no PLEM-H devem ser realizados a cada 3 (três) anos, sendo que os recursos disponíveis e
  auxílios externos relacionados devem ser convocados a participar.'
