title: 155.603(g)
text: '(g)

  Cópia do PLEM-H e dos relatórios dos exercícios simulados devem estar disponíveis nas imediações
  do heliponto, para consulta pelo pessoal responsável do operador de heliponto e pela ANAC
  em atividades de fiscalização.'
