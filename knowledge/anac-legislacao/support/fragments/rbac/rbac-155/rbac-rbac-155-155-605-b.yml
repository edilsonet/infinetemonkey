title: 155.605(b)
text: '(b)

  O operador de heliponto deve considerar, na planificação de emergência para helipontos,
  os seguintes auxílios externos:

  (1)

  corpo de bombeiros;

  (2)

  bombeiros de helipontos próximos;

  (3)

  delegacias de polícia;

  (4)

  hospitais; e

  (5)

  outros que podem ser acionados a critério do operador.'
