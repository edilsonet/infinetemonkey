title: 155.605(c)
text: '(c)

  Os responsáveis pelos auxílios externos listados no PLEM-H devem ser formalmente comunicados
  pelo operador da sua possibilidade de acionamento e dos procedimentos sob sua responsabilidade
  em casos de emergência no heliponto.'
