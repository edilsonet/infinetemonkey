title: 155.605(d)
text: '(d)

  O operador de heliponto deve coordenar reunião para apresentação das responsabilidades de
  cada recurso e auxílio em situações de emergência, devendo a ata da reunião ser anexada
  ao PLEM-H.

  (1)

  Da reunião prevista no parágrafo 155.605(d) devem participar os representantes dos recursos
  disponíveis no heliponto e ser convidados a participar os representantes dos auxílios externos.

  (2)

  A reunião prevista no parágrafo 155.605(d) deverá ocorrer, no mínimo, uma vez ao ano.'
