cite: 155.7(a)
title: 155.7(a)
text: '(a)

  O sistema de referência horizontal deve seguir as seguintes especificações:

  (1)

  o Sistema Geodésico Mundial - 1984 (WGS-84) deve ser utilizado como o sistema de referência
  horizontal (geodésico); e

  (2)

  as coordenadas geográficas aeronáuticas publicadas (indicando latitude e longitude) devem
  estar expressas nos termos do

  datum

  de referência geodésica WGS-84.'
