cite: 155.7(c)
title: 155.7(c)
text: '(c)

  O sistema de referência temporal deve seguir as seguintes especificações:

  (1)

  o Calendário Gregoriano e Tempo Universal Coordenado (UTC) devem ser utilizados como sistema
  de referência temporal.

  (2)

  Quando um sistema de referência temporal diferente for utilizado, deve ser indicado em GEN
  2.1.2 da Publicação de Informação Aeronáutica (AIP).'
