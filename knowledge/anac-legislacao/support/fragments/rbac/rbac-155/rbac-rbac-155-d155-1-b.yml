cite: D155.1(b)
title: D155.1(b)
text: '(b)

  Exemplos de recursos externos são:

  (1)

  Corpo de Bombeiros ou outros serviços de combate a incêndio disponíveis;

  (1)

  bombeiros em helipontos próximos (se houver);

  (2)

  Delegacias de Polícia;

  (3)

  hospitais e outros serviços médicos de emergência; e

  (4)

  quaisquer outros recursos válidos, a critério do operador de heliponto.'
