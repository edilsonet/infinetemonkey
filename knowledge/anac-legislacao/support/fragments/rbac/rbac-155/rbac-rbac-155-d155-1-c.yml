cite: D155.1(c)
title: D155.1(c)
text: '(c)

  O mapa de grade deve possuir título e legendas que identifiquem os pontos de interesse nele
  contidos. Cópias deste mapa devem estar disponíveis nos locais de onde os recursos possam
  ser acionados.'
