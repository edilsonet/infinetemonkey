cite: disposicoes-finais(a)
title: disposicoes-finais(a)
text: '(a)

  Para o cumprimento das Subpartes D e E deste Regulamento, o operador de heliponto deve atender
  às regras sobre autorização prévia para a construção de aeródromos e seu cadastramento junto
  à ANAC.'
