title: disposicoes-finais(b)
text: '(b)

  A ANAC pode estabelecer requisitos específicos a qualquer aeródromo, desde que previamente
  justificado em função da complexidade da operação, do movimento de aeronaves ou do risco
  à segurança operacional.'
