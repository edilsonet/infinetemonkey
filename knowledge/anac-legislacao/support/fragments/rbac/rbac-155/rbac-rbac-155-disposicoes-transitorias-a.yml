title: disposicoes-transitorias(a)
text: (a) As instalações cadastradas ou com processo de cadastramento iniciado junto à Agência
  antes de 21 de novembro de 2018, devem ser adequadas ao disposto neste Regulamento quando
  forem substituídas ou melhoradas após essa data para acomodar operações mais exigentes.
