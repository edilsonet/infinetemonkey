title: generalidades(b)
text: '(b)

  A FATO e a TLOF devem ser livres de obstáculos e estabilizadas ou pavimentadas, de forma
  que os efeitos das rajadas de ar produzidas pelos rotores na superfície do solo não desloquem
  partículas sólidas.'
