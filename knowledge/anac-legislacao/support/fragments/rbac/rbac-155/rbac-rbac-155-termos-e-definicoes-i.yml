cite: termos-e-definicoes(i)
title: termos-e-definicoes(i)
text: '(i)

  dados de rotina: probabilidade muito baixa de que, utilizando dados de rotina corrompidos,
  o prosseguimento seguro de voo e o pouso de uma aeronave estejam severamente em risco de
  originar uma catástrofe.

  (ii)

  dados essenciais: probabilidade baixa de que, utilizando dados essenciais corrompidos, o
  prosseguimento seguro de voo e o pouso de uma aeronave estejam severamente em risco de originar
  uma catástrofe.

  (iii)

  dados críticos: probabilidade alta de que, utilizando dados críticos corrompidos, o prosseguimento
  seguro de voo e o pouso de uma aeronave estejam severamente em risco de originar uma catástrofe.

  (38)

  Mapa de grade

  significa a representação plana da área do aeródromo e seu entorno, traçada sobre um sistema
  de linhas perpendiculares, identificadas com caracteres alfanuméricos.

  (39)

  Obstáculo

  significa todo objeto de natureza permanente ou temporária, fixo ou móvel, ou parte dele,
  que esteja localizado em uma área destinada à movimentação de aeronaves no solo, que se
  estenda acima das superfícies destinadas à proteção das aeronaves em voo, ou que esteja
  fora dessas superfícies definidas e tenha sido avaliado como um perigo para a navegação
  aérea.

  (40)

  Ondulação do geoide

  significa a distância do geoide acima (positiva) ou abaixo (negativa) do elipsoide de referência
  matemática.

  Com respeito ao elipsoide definido no Sistema Geodésico Mundial - 1984 (WGS-84), a diferença
  entre a altura elipsoide do WGS-84 e a altura ortométrica representa a ondulação do geoide
  do WGS-84.

  (41)

  Operação mais exigente

  significa a operação de aeronave que exija a majoração das dimensões da FATO ou da TLOF,
  a majoração da resistência do pavimento ou a utilização de procedimentos para aproximação
  ou decolagem que demandem requisitos mais exigentes.

  (42)

  Operação noturna

  significa aquela realizada no período entre o pôr e o nascer do sol.

  (43)

  Operações com classe de performance 1

  significa operações com helicópteros cujo desempenho, em caso de falha crítica de motor,
  permite que o helicóptero continue o voo em segurança até uma área de pouso apropriada,
  a não ser que a falha ocorra antes de atingir o ponto de decisão de decolagem (TDP) ou após
  passar o ponto de decisão de pouso (LDP), casos em que o helicóptero deve ser capaz de pousar
  dentro da área de pouso ou decolagem interrompida.

  (44)

  Operações com classe de performance 2

  significa operações com helicópteros cujo desempenho, em caso de falha crítica de motor,
  permite que o helicóptero continue o voo (em rota) em segurança até uma área de pouso apropriada,
  exceto se a falha ocorrer no início, durante a manobra de decolagem ou no final, na manobra
  de pouso, casos em que um pouso forçado poderá ser necessário.

  (45)

  Operações com classe de performance 3

  significa operações com helicópteros cujo desempenho, em caso de falha de motor em qualquer
  momento durante o voo, exige um pouso forçado.

  (46)

  Operador de heliponto

  significa toda pessoa natural ou jurídica que administre, explore, mantenha e preste serviços
  em heliponto de uso público ou privado, próprio ou não, com ou sem fins lucrativos.

  (47)

  Pista de táxi aéreo de helicópteros

  significa uma trajetória definida em uma superfície estabelecida para o táxi aéreo de helicópteros.

  (48)

  Pista de táxi terrestre de helicópteros

  significa uma pista de táxi destinada ao movimento em solo de helicópteros providos de rodas,
  movidos por meios próprios.

  (49)

  Planificação de Emergência em Heliponto

  significa um conjunto de recursos internos e externos ao heliponto, com responsabilidades
  e procedimentos próprios, que, em coordenação, devem responder eficientemente a emergências
  no heliponto, visando, prioritariamente, ao salvamento de vidas, bem como à mitigação de
  danos materiais e garantindo ao heliponto eficaz retorno às suas operações.

  (50)

  Plano de emergência de heliponto (PLEM-H)

  significa o documento que estabelece as responsabilidades dos órgãos, entidades ou profissionais
  que possam ser acionados para o atendimento às emergências ocorridas no heliponto ou em
  seu entorno.

  (51)

  Ponto de referência

  de heliponto significa a localização geográfica designada de um heliponto definida no seu
  centro geométrico.

  (52)

  Posição de estacionamento de helicóptero

  significa posição que fornece o estacionamento para helicópteros que concluem as operações
  de táxi terrestre ou quando realizam operações de toque e decolagem nas operações de táxi
  aéreo.

  (53)

  Qualidade dos dados

  significa grau ou nível de confiança de que os dados fornecidos estarão em conformidade
  com os requisitos do usuário em termos de acurácia, resolução e integridade.

  (54)

  Recursos

  significa os meios existentes no heliponto referentes aos equipamentos e pessoal habilitado
  ao desempenho das atividades de resposta a emergência.

  (55)

  Rota de táxi aéreo de helicópteros

  significa uma trajetória definida estabelecida para o movimento aéreo de helicópteros de
  uma parte do heliponto para outra. Permite o movimento de um helicóptero acima da superfície,
  a uma altura associada ao efeito solo e a uma velocidade relativa ao solo inferior a 37
  km/h (20 nós).

  (56)

  Rota de táxi terrestre de helicópteros

  significa uma trajetória definida estabelecida para o movimento em solo de helicópteros
  de uma parte do heliponto para outra.

  (57)

  Segmento visual ponto no espaço (PinS)

  significa o segmento de um procedimento de aproximação PinS de helicóptero desde o ponto
  de aproximação perdida até o local do pouso para um procedimento PinS “prosseguir visualmente”.
  Este segmento visual conecta o ponto no espaço (PinS) com o local do pouso.

  (58)

  Sinalizador

  significa o objeto disposto acima do nível do solo que indica um obstáculo ou delineia um
  contorno.

  (59)

  Zona desimpedida (Clearway)

  significa uma área definida no solo ou na água, selecionada ou preparada como área adequada
  sobre a qual um helicóptero que opera com classe de performance 1 pode acelerar e atingir
  uma altura específica.'
