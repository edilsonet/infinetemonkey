title: 161.13(c)
text: '(c)

  Elaborado o PZR conforme critérios previstos nas Subpartes C ou D deste regulamento, de
  acordo com a aplicabilidade, e inserindo as recomendações ao uso do solo dispostas na Subparte
  E, caberá ao operador de aeródromo registrá-lo na ANAC

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
