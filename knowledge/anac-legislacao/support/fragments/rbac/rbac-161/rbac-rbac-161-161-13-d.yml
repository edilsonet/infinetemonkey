cite: 161.13(d)
title: 161.13(d)
text: '(d)

  O operador de aeródromo, após a efetivação do registro do PZR na ANAC, deve divulgá-lo ao(s)
  município(s) abrangido(s) pelo Plano e demais órgãos interessados, no prazo de 30 (trinta)
  dias a contar de seu registro.'
