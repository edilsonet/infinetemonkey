text: '(g)

  O operador do aeródromo, deve enviar anualmente aos órgãos locais o PZR para que os mesmos
  busquem compatibilizar o uso do solo nas áreas abrangidas pelo PZR.

  (Incluído pela Resolução nº 609, de 23.02.2021)

  161. 15 Critérios para definição do tipo de PZR'
