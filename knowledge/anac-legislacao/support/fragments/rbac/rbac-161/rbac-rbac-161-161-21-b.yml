cite: 161.21(b)
title: 161.21(b)
text: '(b)

  As curvas de ruído de um PBZR serão obtidas por meio do enquadramento de cada pista de pouso
  e decolagem do aeródromo em uma das quatro classes especificadas na Tabela C-1, considerando
  o número médio de movimentos de aeronaves dos últimos 3 (três) anos.

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (1)

  O operador do aeródromo pode optar por um PBZR de classe superior (com maior área), considerando
  o planejamento de desenvolvimento do aeródromo.

  (Incluído pela Resolução nº 609, de 23.02.2021)'
