cite: 161.21(d)
title: 161.21(d)
text: '(d)

  O operador de aeródromo deve fornecer todas as coordenadas geográficas em formato grau,
  minuto e segundo, com prévio estabelecimento do Sistema Geodésico de Referência - preferencialmente
  o WGS 84 ou SIRGAS 2000, que deve ser o mesmo para todos os pontos.

  FIGURA C-1- Curvas de Ruído

  de 75 e 65

  Legenda:

  L1:

  distância horizontal, medida sobre o prolongamento do eixo da pista, entre a cabeceira e
  o centro do semicírculo de raio R1.

  L2:

  distância horizontal, medida sobre o prolongamento do eixo da pista, entre a cabeceira e
  o centro do semicírculo de raio R2.

  R1:

  raio do semicírculo da curva de ruído de 75 com centro sobre o prolongamento do eixo da
  pista.

  R2:

  raio do semicírculo da curva de ruído de 65 com centro sobre o prolongamento do eixo da
  pista.

