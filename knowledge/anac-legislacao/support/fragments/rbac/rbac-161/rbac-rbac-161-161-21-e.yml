title: 161.21(e)
text: '(e)

  Para efeito de elaboração e aplicação do PBZR para helipontos, os raios das curvas de ruído
  de 75 e 65 são, respectivamente, 100 e 300 m, traçados a partir do centro geométrico do
  heliponto, conforme apresentados na Figura C-2

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  FIGURA C-2- Configuração das curvas de ruído de 75 e 65 para helipontos

  .'
