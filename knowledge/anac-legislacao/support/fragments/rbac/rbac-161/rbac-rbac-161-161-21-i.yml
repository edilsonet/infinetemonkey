title: 161.21(i)
text: '(i)

  coordenadas geográficas das cabeceiras das pistas de pouso e decolagem e, no caso de helipontos
  ou FATO, de seu centro geométrico;

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (ii)

  limites do sítio aeroportuário;

  (iii)

  as curvas de ruído de 75 e 65 representadas conforme respectiva classe da Tabela C-1

  ;

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (iv)

  escala gráfica;'
