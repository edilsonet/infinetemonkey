section_title: Composição de curvas de ruído
subsection_id: a
cite: 161.23(a)
title: 161.23(a)
text: '(a)

  A elaboração de um PBZR para um aeródromo com duas ou mais pistas ou FATO, sejam elas existentes
  ou planejadas, considerará a composição das curvas de ruído referentes a cada pista, de
  acordo com a Figura C-3

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
