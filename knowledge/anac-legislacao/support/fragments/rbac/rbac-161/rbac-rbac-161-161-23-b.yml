  sua infraestrutura

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  FIGURA C-3-

  Composição de curvas de ruído para aeródromos com mais de uma pista e FATO

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  SUBPARTE D

  PLANO ESPECÍFICO DE ZONEAMENTO DE RUÍDO - PEZR'
