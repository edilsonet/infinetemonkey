section_title: Critérios para cálculo das curvas de ruído para elaboração do PEZR
subsection_id: b
cite: 161.33(b)
title: 161.33(b)
text: (b) O operador de aeródromo deve fornecer todas as coordenadas geográficas em formato
  grau, minuto e segundo, com prévio estabelecimento do Sistema Geodésico de Referência -
  preferencialmente o WGS 84 ou SIRGAS 2000, que deve ser o mesmo para todos os pontos.
