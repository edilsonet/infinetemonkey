cite: 161.33(c)
title: 161.33(c)
text: (c) O operador de aeródromo deve, para elaboração ou revisão do PEZR, atuar em cooperação
  com os município(s) abrangido(s) pelo Plano, conforme estabelece parágrafo 161.53(b), assegurando
  o desenvolvimento dos estudos de forma integrada com os demais órgãos interessados, respeitando
  o estabelecido na Subparte E deste RBAC.
