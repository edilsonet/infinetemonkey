title: 161.33(v)
text: '(v) Definição dos modelos das aeronaves envolvidas nos testes de motores, sua orientação
  durante os testes, os horários, a duração e a frequência diária.

  (A) Devem ser considerados os efeitos de barreiras de ruído empregadas nos testes, caso
  existam.'
