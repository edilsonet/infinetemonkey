section_title: Compatibilidade do uso do solo
subsection_id: a
cite: 161.41(a)
title: 161.41(a)
text: '(a)

  O operador de aeródromo sujeito a elaboração de PBZR deve fazer constar do referido Plano
  os usos do solo compatíveis e incompatíveis para as áreas por ele abrangidas, conforme apresentado
  na Tabela E-1.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
