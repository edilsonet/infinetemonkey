  Notas das Tabelas E-1 e E-2:

  S (Sim)

  = usos do solo e edificações relacionadas compatíveis sem restrições

  N (Não)

  = usos do solo e edificações relacionadas não compatíveis.

  25, 30, 35 =

  usos do solo e edificações relacionadas geralmente compatíveis. Medidas para atingir uma
  redução de nível de ruído - RR de 25, 30 ou 35 dB devem ser incorporadas no projeto/construção
  das edificações onde houver permanência prolongada de pessoas.

  (1)

  Sempre que os órgãos determinarem que os usos devam ser permitidos, devem ser adotadas medidas
  para atingir uma RR de pelo menos 25 dB.

  (2)

  Edificações residenciais requerem uma RR de 25 dB.

  (3)

  Edificações residenciais requerem uma RR de 30 dB.

  (4)

  Edificações residenciais não são compatíveis.

