title: Compatibilização ao uso do solo
text: '161.51 Compatibilização ao uso do solo

  Após o registro do PZR na ANAC, o operador de aeródromo deve buscar ações de compatibilização
  do uso do solo com o(s) município(s) abrangido(s) pelas curvas de ruído, bem como com a
  comunidade de entorno, notificando a ANAC, os municípios e os órgãos interessados sempre
  que forem identificados usos incompatíveis com os PZR aprovados.'
