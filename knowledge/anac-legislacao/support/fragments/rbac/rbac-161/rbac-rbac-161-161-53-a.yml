cite: 161.53(a)
title: 161.53(a)
text: (a) O operador de aeródromo que tiver média anual de movimento de aeronaves dos últimos
  3 (três) anos superior a 7.000 (sete mil) deve instituir uma Comissão de Gerenciamento de
  Ruído Aeronáutico - CGRA para discutir a elaboração, atualização e implementação do PZR.
