cite: 161.53(b)
title: 161.53(b)
text: '(b) A CGRA será composta por funcionários do aeródromo e deverá convidar membros e
  órgãos externos envolvidos nas questões relacionadas ao ruído aeronáutico, sendo suas reuniões
  realizadas com os presentes.

  (1) Havendo recusa ou ausência de indicação por parte das Instituições envolvidas, essa
  informação deverá constar no Relatório Anual de Ruído Aeronáutico.'
