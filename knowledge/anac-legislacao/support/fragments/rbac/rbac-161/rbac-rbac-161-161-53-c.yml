title: 161.53(c)
text: (c) A CGRA deverá realizar, no mínimo, 1 (uma) reunião a cada período de 6 (seis) meses,
  a contar da sua instituição, com convocação de interessados no Gerenciamento de Ruído Aeronáutico
  e exposição dos objetivos de cada reunião.
