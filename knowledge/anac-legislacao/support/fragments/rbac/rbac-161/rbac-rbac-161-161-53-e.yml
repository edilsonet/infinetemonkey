cite: 161.53(e)
title: 161.53(e)
text: '(e) O operador do aeródromo deverá manter em sítio eletrônico específico informações
  acerca das competências listadas no parágrafo 161.53(d), devendo conter, no mínimo:

  (1) Convocações para as reuniões da CGRA, com exposição dos objetivos.

  (2) Divulgação de memória ou ata de cada reunião em até 15 (quinze) dias após sua realização,
  com a lista dos participantes.

  (3) Divulgação de Relatório Anual de Ruído Aeronáutico, conforme o parágrafo 161.53(d)(8).

  (4) Espaço para registro de manifestação, solicitações de informações, reclamações ou elogios.

  (5) Ferramenta de consulta sobre o tratamento dado às manifestações, garantindo meios de
  proteção das informações pessoais dos reclamantes.

  (6) Informes sobre ruído aeronáutico e eventos relacionados ao tema.

  (7) Divulgação de relatórios do monitoramento de ruído e de atividades não compatíveis com
  os níveis de ruído aeronáutico quando identificadas.

  (8) Divulgação sobre qualquer condição temporária do aeródromo que implique em perfil operacional
  diferente do esperado.'
