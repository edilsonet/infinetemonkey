title: 161.53(i)
text: '(i) Estatística de reclamações recebidas;

  (ii) Indicação do local do incômodo em mapa georreferenciado com sobreposição do PZR em
  vigor, nos termos do parágrafo 161.53(d)(6).

  (iii) Principais assuntos tratados no âmbito da CGRA.

  (iv) Informações sobre a situação do PZR nos municípios abrangidos:

  (A) quanto a sua incorporação pelas leis municipais;

  (B) quanto a compatibilidade com as atividades desenvolvidas na área do plano e;

  (C) quanto as ações de fiscalização.

  (9) Comunicar as autoridades de controle da Administração Pública, quando identificado descumprimento
  ou omissão das autoridades acerca das recomendações de ocupação de uso do solo previstas
  no PZR.'
