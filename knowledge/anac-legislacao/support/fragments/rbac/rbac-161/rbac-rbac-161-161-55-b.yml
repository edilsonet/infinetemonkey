section_title: Monitoramento de ruído
subsection_id: b
cite: 161.55(b)
title: 161.55(b)
text: '(b)

  Nos casos em que forem constatados conflitos relacionados a ruído aeronáutico entre o aeródromo
  e a comunidade de seu entorno, que não se enquadrem na obrigatoriedade de elaboração de
  projeto de monitoramento de ruído, prevista no parágrafo (a) desta seção, é facultado à
  ANAC determinar ao operador de aeródromo a implementação do projeto nas áreas do PEZR.'
