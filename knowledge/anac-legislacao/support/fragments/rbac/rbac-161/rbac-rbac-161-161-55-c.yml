section_title: Monitoramento de ruído
subsection_id: c
cite: 161.55(c)
title: 161.55(c)
text: '(c)

  O monitoramento de ruído deve conter pelo menos os seguintes elementos:

  (1)

  pontos de medição de ruído;

  (2)

  metodologia para a medição do ruído aeronáutico, que deverá distinguir a medição do ruído
  de fundo

  ;

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (3)

  relatório que contenha informações suficientes para subsidiar ações mitigadoras quanto ao
  ruído aeronáutico.

  (4)

  SUBPARTE G

  DISPOSIÇÕES FINAIS E TRANSITÓRIAS'
