cite: 161.61(b)
title: 161.61(b)
text: '(b)

  Os operadores de aeródromos que se enquadrarem no critério de aplicabilidade do Plano Específico
  de Zoneamento de Ruído terão o prazo de 9 meses para obtenção do registro do PEZR junto
  à ANAC:

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (1)

  O prazo de 9 meses será contado a partir do primeiro dia do ano subsequente ao atingimento
  da média do número de movimentos de aeronaves estabelecido no parágrafo 161.15(a)(1), ou
  a contar da data em que o operador for notificado da determinação da ANAC referida no parágrafo
  161.15(b);

  (2)

  O prazo mencionado no parágrafo 161.61(b)(1) será suspenso quando do envio do PEZR para
  análise pela ANAC.

  (3)

  Para fins de sanção, considera-se que o operador incorre em nova infração a cada ano calendário
  subsequente ao vencimento do prazo estabelecido no parágrafo 161.61 (b), caso ainda não
  tenha obtido o registro do PEZR conforme o RBAC nº 161.

  (4)

  Aplica-se aos operadores que tenham obrigação de apresentar Projeto de Monitoramento de
  Ruído o mesmo disposto neste parágrafo no que concerne aos prazos para apresentação e incorrência
  em infração, a contar da decisão da ANAC que determinou a elaboração do Projeto.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
