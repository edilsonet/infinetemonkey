cite: 161.61(c)
title: 161.61(c)
text: '(c)

  O operador de aeródromo deve informar formalmente à ANAC a classe de PBZR em que seu aeródromo
  se enquadra até 31 de maio de 2021, e manter o Plano disponível para eventual consulta ou
  fiscalização pela ANAC.

  (1)

  Caso o operador de aeródromo não informe a classe de PBZR no prazo estabelecido, será automaticamente
  classificado como sendo de Classe 4, de acordo com a Tabela C-1 deste Regulamento.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
