cite: 161.61(d)
title: 161.61(d)
text: '(d)

  O operador de aeródromo deve, por ocasião do pedido de cadastro do aeródromo na ANAC ou
  de sua renovação, informar o tipo de Plano (Básico ou Específico) ao qual se enquadra, conforme
  parágrafo 161.15 desse RBAC.

  (1)

  No caso de aplicação de PBZR, o operador de aeródromo deve ainda informar a classe na qual
  o aeródromo se enquadra e manter o Plano disponível para eventual consulta ou fiscalização
  pela ANAC.

  (2)

  No caso de aplicação de PEZR por ocasião do pedido de renovação de cadastro, o operador
  de aeródromo deve verificar se o Plano existente está compatível com as características
  físicas e operacionais do aeródromo, e tomar as medidas cabíveis; ou por ocasião do pedido
  de cadastro do aeródromo na ANAC, o operador de aeródromo deve apresentar o Plano para registro
  na ANAC em conformidade com este RBAC.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
