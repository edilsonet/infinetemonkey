section_title: Disposições finais e transitórias
subsection_id: e
cite: 161.61(e)
title: 161.61(e)
text: '(e)

  Os requisitos de emissão de ruído na fonte por aeronave específica, ou por classe ou tipo
  de aeronaves, são disciplinados em regulamento próprio. A operação de aeronaves cuja emissão
  de ruído esteja em desacordo com a regulamentação deverá ser fiscalizada em procedimento
  individualizado, mas não caracterizará infração às disposições deste RBAC.

  (Renumerado pela Resolução nº 281, de 10.09.2013)'
