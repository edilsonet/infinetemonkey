cite: 161.61(f)
title: 161.61(f)
text: '(f)

  Não é necessária aprovação ou consulta prévia à ANAC, no que tange ao ruído aeronáutico,
  para a ocupação do solo em áreas abrangidas pelos PZR.

  (Renumerado pela Resolução nº 281, de 10.09.2013)'
