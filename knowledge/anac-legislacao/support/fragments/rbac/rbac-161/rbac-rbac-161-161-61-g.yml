cite: 161.61(g)
title: 161.61(g)
text: '(g)

  Na fiscalização do PZR, a ANAC considerará;

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (1)

  Medidas adotadas para incorporação do Plano na Lei de uso e ocupação do solo, ou Lei equivalente
  de ordenamento territorial urbano, do(s) município(s) circunvizinho(s) ao aeródromo;

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (2)

  medições de monitoramento de ruído realizadas com base em método aprovado em Instrução Suplementar;
  e

  (3)

  informações prestadas pelo operador de aeródromo acerca da compatibilização das recomendações
  ao uso do solo pelo(s) município(s) abrangido(s) pelas curvas de ruído.'
