section_title: Disposições finais e transitórias
subsection_id: h
cite: 161.61(h)
title: 161.61(h)
text: '(h)

  Petições e reclamações de pessoas afetadas constituirão base para início de ações de monitoramento
  e servirão como elemento para a avaliação técnica da matéria, e não poderão ser utilizados
  como único fundamento para caracterização da infração às disposições deste RBAC.

  (Renumerado pela Resolução nº 281, de 10.09.2013)'
