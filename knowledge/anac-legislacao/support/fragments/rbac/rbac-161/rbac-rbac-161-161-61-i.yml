section_title: Disposições finais e transitórias
subsection_id: i
cite: 161.61(i)
title: 161.61(i)
text: '(i)

  à realização de audiência pública no município afetado, na qual tenham sido apresentados
  à comunidade interessada os impactos da redução da utilização do aeródromo e colhida a manifestação
  das pessoas inscritas;

  (ii)

  à apresentação por parte do operador de aeródromo de relatório descritivo da situação do
  uso do solo no entorno do aeródromo;

  (iii)

  à apresentação por parte do operador de aeródromo de estimativa do impacto financeiro e
  econômico da restrição operacional, elaborada preferencialmente em conjunto com as empresas
  aéreas que operam no aeródromo.

  (2)

  As restrições operacionais aplicadas deverão ser comunicadas ao operador de aeródromo e
  às empresas aéreas com antecedência mínima de seis meses.

  (3)

  [Reservado]

  (Redação dada pela Resolução nº 571, de 08.07.2020)'
