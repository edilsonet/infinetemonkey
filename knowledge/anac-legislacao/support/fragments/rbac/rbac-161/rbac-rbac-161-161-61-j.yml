cite: 161.61(j)
title: 161.61(j)
text: '(j)

  Os aeródromos que possuem PEZR elaborado com base no RBAC nº 161, de 29 de setembro de 2011,
  ou em suas Emendas nº 01 e 02, vigente na data de validade desta Emenda nº 03, não estão
  obrigados à revisão automática do PEZR, sem prejuízo do disposto no parágrafo 161.15(b).

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
