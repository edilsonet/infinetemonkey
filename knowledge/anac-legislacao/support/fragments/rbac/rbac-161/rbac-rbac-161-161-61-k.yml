cite: 161.61(k)
title: 161.61(k)
text: '(k)

  Os aeródromos que possuíam PEZR vigentes antes de 29 de setembro de 2011 devem adequar os
  Planos em conformidade com este RBAC.

  (1)

  Até que sejam adequados conforme parágrafo 161.61(k), os PEZR vigentes em 29 de setembro
  de 2011 permanecem em vigor.

  (2)

  Até que sejam adequados conforme parágrafo 161.61(k), os planos aprovadas pela Portaria
  nº 629/GM5, de 2 de maio de 1984, permanecem em vigor, aplicando-se os critérios para a
  definição dos usos compatíveis e incompatíveis previstos na Tabela E-1 da Subparte E deste
  RBAC.

  (Incluído pela Resolução nº 609, de 23.02.2021)'
