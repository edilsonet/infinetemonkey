title: apendice-a-do-rbac-no-161-sancoes-aplicaveis(a)
text: '(a)

  Este regulamento estabelece, para os operadores de aeródromos civis públicos, os requisitos
  de elaboração e aplicação do Plano de Zoneamento de Ruído - PZR e define critérios técnicos
  aplicáveis na análise de questões relacionadas ao ruído aeronáutico na aviação civil.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
