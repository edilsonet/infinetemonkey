text: '(d)

  O operador de aeródromo deve consultar o Comando da Aeronáutica - COMAER a fim de considerar
  o número de movimentos de aeronaves militares para cálculo das curvas de ruído do processo
  de elaboração do PZR, quando o aeródromo for compartilhado.

  (Redação dada pela Resolução nº 609, de 23.02.2021)'
