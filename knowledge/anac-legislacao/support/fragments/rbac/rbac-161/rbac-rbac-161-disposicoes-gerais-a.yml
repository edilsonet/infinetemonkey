title: disposicoes-gerais(a)
text: '(a)

  As cinco curvas de ruído que compõem o PEZR devem ser calculadas por meio de programa computacional
  que utilize metodologia matemática apropriada para a geração de curvas, na métrica DNL

  .

  (Redação dada pela Resolução nº 609, de 23.02.2021)

  (1)

  O operador de aeródromo deve calcular curvas de ruído para o sistema de pistas de pouso
  e decolagem previsto no planejamento para a expansão da infraestrutura aeroportuária, considerando
  a estimativa do número de movimentos e tipos de aeronaves, ao final do seu horizonte de
  planejamento.'
