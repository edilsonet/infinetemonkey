title: termos-e-definicoes(a)
text: '(a)

  Aeródromo compartilhado: aeródromo sede de unidade aérea militar, que compartilha sua infraestrutura
  com aeródromo civil, sediando tanto operações aéreas militares como operações civis de transporte
  aéreo de passageiros e carga.'
