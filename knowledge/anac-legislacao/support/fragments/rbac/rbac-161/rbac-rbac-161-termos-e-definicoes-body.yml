title: Termos e definições
text: 'Termos e definições

  Para efeito deste regulamento aplicam-se os termos e definições estabelecidos a seguir,
  bem como aqueles disponíveis no RBAC 01, denominado “Regulamentos Brasileiros de Aviação
  Civil. Definições, Regras de Redação e Unidades de Medida”; no RBAC 139, denominado “Certificação
  Operacional de Aeroportos”; na Resolução ANAC n.º 153, de 18 de junho de 2010, que dispõe
  sobre a aprovação de Planos Diretores Aeroportuários; e na Lei nº 7.565, de 19 de dezembro
  de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica - CBA.'
