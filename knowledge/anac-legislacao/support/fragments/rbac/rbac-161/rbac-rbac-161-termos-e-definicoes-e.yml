title: termos-e-definicoes(e)
text: '(e)

  Área de aproximação final e de decolagem (

  Final Approach and Take-off area

  - FATO) significa, referindo-se a helicópteros, uma área definida sobre a qual a fase final
  da manobra de aproximação para voo pairado ou pouso é completada ou a partir da qual a manobra
  de decolagem é iniciada. Quando a FATO é para ser usada por helicópteros categoria A (ou
  Classe 1 da OACI), a área definida deve incluir a área disponível para decolagem rejeitada.'
