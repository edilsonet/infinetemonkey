text: '(j)

  Plano Básico de Zoneamento de Ruído - PBZR: Plano de Zoneamento de Ruído de Aeródromo composto
  pelas curvas de ruído de 75 e 65 e elaborado nos termos deste RBAC, a partir de perfis operacionais
  padronizados, conforme disposto na Subparte C.'
