title: termos-e-definicoes(k)
text: '(k)

  Plano de Zoneamento de Ruído de Aeródromo - PZR: documento elaborado nos termos deste RBAC,
  que tem como objetivo representar geograficamente a área de impacto do ruído aeronáutico
  decorrente das operações nos aeródromos e, aliado ao ordenamento adequado das atividades
  situadas nessas áreas, ser o instrumento que possibilita preservar o desenvolvimento dos
  aeródromos em harmonia com as comunidades localizadas em seu entorno.'
