title: termos-e-definicoes(l)
text: '(l)

  Plano Específico de Zoneamento de Ruído - PEZR: Plano de Zoneamento de Ruído de Aeródromo
  composto pelas curvas de ruído de 85, 80, 75, 70 e 65 e elaborado nos termos deste RBAC,
  a partir de perfis operacionais específicos, conforme disposto na Subparte D.'
