  deverá

  estar em linha com os padrões estabelecidos pela Organização da Aviação Civil Internacional
  -

  OACI, exceto se de outra forma determinado pela ANAC. O detalhamento abrange, mas não se
  limita

  a, os seguintes aspectos:'
