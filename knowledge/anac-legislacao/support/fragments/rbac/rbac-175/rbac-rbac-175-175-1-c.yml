title: 175.1(c)
text: '(c) Quando estiver especificamente disposto neste Regulamento ou em Instrução Suplementar,
  a

  ANAC poderá outorgar uma aprovação, desde que, nesses casos, o nível geral de segurança

  operacional no transporte seja equivalente ao nível de segurança operacional previsto neste

  Regulamento e em Instrução Suplementar.'
