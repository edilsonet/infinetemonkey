title: 175.1(d)
text: '(d) A ANAC poderá outorgar uma autorização especial para autorizar a expedição ou transporte

  de artigo perigoso proibido em circunstâncias normais ou, ainda, a expedição ou transporte
  de artigo

  perigoso de maneira distinta daquela indicada para cada tipo de objeto ou substância presente
  na Lista

  de Artigos Perigosos, desde que, nesses casos, todo esforço seja feito para alcançar um
  nível geral de

  segurança operacional no transporte que seja pelo menos equivalente ao nível de segurança

  operacional previsto neste Regulamento e em Instrução Suplementar. Essa autorização especial

  somente poderá ser concedida nos seguintes casos:


  Data da emissão: 12 de fevereiro de 2021.


  (1) extrema urgência;

  (2) quando outros modos de transporte forem inapropriados; ou

  (3) quando o total cumprimento com os requisitos dispostos for contrário ao interesse público.'
