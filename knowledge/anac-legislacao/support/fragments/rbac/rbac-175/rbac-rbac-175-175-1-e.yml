title: 175.1(e)
text: '(e) Em caso de sobrevoo em território brasileiro, se nenhum dos critérios apresentados
  para a

  concessão de uma autorização especial for relevante, uma autorização especial poderá ser
  outorgada

  desde que identificado um nível equivalente de segurança operacional para o transporte aéreo.'
