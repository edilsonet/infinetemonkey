cite: 175.1(i)
title: 175.1(i)
text: '(i) com origem, destino, trânsito e sobrevoo em território ou espaço aéreo brasileiro,
  por

  qualquer aeronave civil;

  (ii) por qualquer aeronave civil operada por um operador aéreo brasileiro,

  independentemente de haver origem, destino, trânsito e sobrevoo em território ou espaço
  aéreo

  brasileiro; ou

  (iii) por qualquer aeronave civil de marcas de nacionalidade e matrícula brasileiras em

  operações de aviação geral, independentemente de haver origem, destino, trânsito e sobrevoo
  em

  território ou espaço aéreo brasileiro.

  (2) O transporte de artigos perigosos em operações especiais de unidades aéreas públicas
  é

  regido pelo RBAC nº 90, aplicando-se, a critério do operador, o disposto neste Regulamento.'
