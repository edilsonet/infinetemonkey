title: 175.101(a)
text: '(a) A classificação de um objeto ou substância considerado perigoso para o transporte
  deve ser

  feita pelo seu fabricante ou expedidor, orientado pelo fabricante, ou ainda, pela autoridade
  nacional

  apropriada, quando aplicável, tomando como base as características físico-químicas do produto,

  alocando-o em uma das classes ou divisões descritas neste Regulamento.'
