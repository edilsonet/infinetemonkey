cite: 175.101(b)
title: 175.101(b)
text: '(b) Um expedidor que tenha identificado, com base em dados de testes, que uma substância
  listada

  por seu nome na Lista de Artigos Perigosos constante em Instrução Suplementar, atende aos
  critérios

  de classificação para uma classe ou divisão que não está identificada na lista, pode, com
  a aprovação

  da autoridade nacional apropriada, expedir essa substância, desde que:

  (1) sob a entrada genérica ou não especificada (n.e.) mais apropriada que reflita todos
  os

  perigos; ou

  (2) sob o mesmo número UN e nome apropriado para embarque, porém com informação de

  comunicação de perigo adicional, conforme apropriado, para refletir o(s) perigo(s) secundário(s)

  (documentação, etiqueta), contanto que a classe de perigo primária mantenha-se inalterada
  e que

  quaisquer outras condições de transporte (p. ex., quantidade limitada, provisões de embalagem)
  que

  normalmente sejam aplicáveis às substâncias que possuam essa combinação de perigos sejam
  as

  mesmas condições que aquelas da substância listada.'
