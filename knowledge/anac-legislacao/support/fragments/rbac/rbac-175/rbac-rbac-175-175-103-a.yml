title: 175.103(a)
text: '(a) Substâncias (incluindo misturas e soluções) e objetos sujeitos a este Regulamento
  são alocados

  a uma das nove classes de acordo com o perigo ou os perigos mais predominantes que apresentam.

  Algumas dessas classes são subdivididas em divisões. Essas classes e divisões são:

  (1) Classe 1: explosivos.'
