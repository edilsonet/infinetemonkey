title: 175.103(b)
text: '(b) Para fins de embalagem, artigos perigosos, que não sejam das Classes 1, 2 e 7,
  Divisões 5.2 e

  6.2 e substâncias autorreagentes da Divisão 4.1, devem ser alocados a um dos três grupos
  de

  embalagem, de acordo com o grau de perigo que apresentem:

  (1) Grupo de Embalagem I: substâncias de alta periculosidade;

  (2) Grupo de Embalagem II: substâncias de média periculosidade; ou

  (3) Grupo de Embalagem III: substâncias de baixa periculosidade.'
