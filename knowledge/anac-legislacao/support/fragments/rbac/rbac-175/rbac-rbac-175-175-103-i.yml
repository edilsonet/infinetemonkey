title: 175.103(i)
text: '(i) Divisão 1.1: substâncias e artigos com perigo de explosão em massa.

  (ii) Divisão 1.2: substâncias e artigos com perigo de projeção, mas sem perigo de explosão

  em massa.

  (iii) Divisão 1.3: substâncias e artigos com perigo de fogo e com pequeno perigo de explosão

  ou de projeção, ou ambos, mas sem perigo de explosão em massa.

  (iv) Divisão 1.4: substâncias e artigos que não apresentam perigo significativo.'
