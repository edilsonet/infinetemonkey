title: 175.105(b)
text: '(b) Quando uma substância ou um objeto estiver especificamente listado por seu nome,
  ele deve

  ser identificado no transporte pelo nome apropriado para embarque conforme Lista de Artigos

  Perigosos constante em Instrução Suplementar.

  (1) As substâncias listadas pelo nome na Lista de Artigos Perigosos devem ser transportadas
  de

  acordo com sua classificação na lista ou sob as condições especificadas em 175.101(b).'
