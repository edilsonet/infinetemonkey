title: 175.105(c)
text: '(c) Objetos ou substâncias que não estejam especificamente listados pelo nome na Lista
  de Artigos

  Perigosos devem ser classificados sob uma entrada “genérica” ou “não-especificada de outro
  modo”

  (n.e.). O objeto ou substância deve ser classificado de acordo com as definições de classe
  e critérios

  de teste deste Regulamento e de Instrução Suplementar, e o objeto ou substância deve ser
  alocado à

  entrada "genérica" ou “n.e.” da Lista de Artigos Perigosos que mais apropriadamente descreva
  o

  objeto ou substância.


  Data da emissão: 12 de fevereiro de 2021.


  SUBPARTE D

  LISTA DE ARTIGOS PERIGOSOS E PROVISÕES ESPECIAIS'
