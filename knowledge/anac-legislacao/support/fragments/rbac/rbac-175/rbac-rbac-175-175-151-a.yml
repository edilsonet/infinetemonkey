cite: 175.151(a)
title: 175.151(a)
text: '(a) Quando um objeto ou uma substância estiver listado especificamente por seu nome
  na Lista de

  Artigos Perigosos constante em Instrução Suplementar, ele deve ser transportado de acordo
  com as

  disposições desta Lista que sejam apropriadas para esse objeto ou substância, incluindo
  as provisões

  especiais. Uma entrada “genérica” ou “não especificada de outro modo” pode ser usada para
  permitir

  o transporte de objetos ou substâncias que não apareçam especificamente por seu nome na
  Lista de

  Artigos Perigosos. Esse objeto ou substância pode ser transportado somente após a determinação
  de

  suas propriedades de perigo. O objeto ou substância deve então ser classificado de acordo
  com as

  definições de classe e critérios de teste, utilizando-se o nome que melhor o descreva na
  Lista de

  Artigos Perigosos. A classificação deve ser feita pelo seu fabricante ou expedidor, orientado
  pelo

  fabricante, ou ainda pela autoridade nacional apropriada, quando aplicável. Uma vez que
  a classe da

  substância ou do objeto for estabelecida, todas as condições para sua expedição e transporte,

  conforme previsto neste Regulamento e em Instrução Suplementar, devem ser cumpridas. Qualquer

  objeto ou substância que possua ou que se suspeite possuir características explosivas deve
  ser

  considerado primeiramente como Classe 1.'
