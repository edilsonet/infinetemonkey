section_title: Provisões gerais de segurança contra atos de interferência ilícita
subsection_id: a
cite: 175.19(a)
title: 175.19(a)
text: '(a) Os expedidores, operadores aéreos e outros indivíduos envolvidos no transporte
  de artigos

  perigosos por via aérea devem estabelecer medidas de segurança relativas a artigos perigosos
  a serem

  tomadas para minimizar o roubo ou uso indevido de artigos perigosos que possam pôr em perigo
  as

  pessoas, os bens ou o meio ambiente.'
