cite: 175.201(a)
title: 175.201(a)
text: '(a) Artigos perigosos devem ser acondicionados em embalagens de boa qualidade e

  suficientemente resistentes para suportar choques e operações de carregamento normalmente

  presentes durante o transporte, incluindo a remoção de um pálete, ULD ou sobrembalagem para

  subsequente movimentação manual ou mecânica. As embalagens devem ser construídas e fechadas

  de modo que, quando preparadas para transporte, evitem qualquer perda de conteúdo que possa
  ser

  provocada em condições normais de transporte, por vibração ou por variações de temperatura,

  umidade ou pressão (resultantes da altitude, por exemplo). Embalagens (incluindo embalagens

  internas e recipientes) devem ser fechadas de acordo com as instruções fornecidas pelos
  seus

  fabricantes. Durante o transporte, não pode haver nenhum sinal de resíduo perigoso aderente
  à parte

  externa dos volumes. Essas disposições aplicam-se, conforme apropriado, a embalagens novas,

  reutilizadas, recondicionadas ou remanufaturadas.'
