cite: 175.201(f)
title: 175.201(f)
text: '(f) As embalagens internas devem ser embaladas, protegidas ou acolchoadas dentro de
  uma

  embalagem externa de tal forma que, sob condições normais de transporte, se evitem quebras
  ou

  vazamentos e que se controle seus movimentos dentro da embalagem externa. Materiais acolchoados

  ou absorventes não podem reagir de forma perigosa com os conteúdos das embalagens.'
