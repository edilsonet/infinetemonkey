title: 175.201(g)
text: '(g) Uma embalagem não pode ser reutilizada a menos que seja inspecionadas e se verifique
  que se

  encontra livre de corrosão ou de outro dano.

  (1) Quando uma embalagem for reutilizada, todas as medidas necessárias devem ser tomadas

  de forma a evitar a contaminação dos conteúdos seguintes.'
