cite: 175.21(a)
title: 175.21(a)
text: '(a) Para a proteção de pessoas, bens e o meio ambiente dos efeitos danosos da radiação
  ionizante

  durante o transporte de material radioativo, são aplicáveis as provisões gerais relativas
  a material

  radioativo, conforme estabelecido em Instrução Suplementar, referentes a:

  (1) contenção dos conteúdos radioativos;

  (2) controle da taxa de dose externa;

  (3) prevenção da criticalidade; e

  (4) prevenção dos danos causados pelo calor.


  Data da emissão: 12 de fevereiro de 2021.


  SUBPARTE B

  TREINAMENTO'
