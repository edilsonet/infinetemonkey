cite: 175.251(b)
title: 175.251(b)
text: '(b) Antes de uma pessoa, organização ou empresa oferecer qualquer volume ou sobrembalagem

  contendo artigos perigosos para transporte por via aérea, ela deve garantir que:

  (1) os objetos ou as substâncias não sejam proibidos para transporte aéreo (ver Subparte
  A deste

  Regulamento);

  (2) os artigos perigosos estejam devidamente classificados, embalados, marcados e etiquetados

  ou de outra forma satisfaçam às condições de transporte conforme este Regulamento e Instrução

  Suplementar; e

  (3) o documento de transporte de artigos perigosos tenha sido corretamente preenchido e
  a

  declaração assinada.'
