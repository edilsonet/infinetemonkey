cite: 175.255(a)
title: 175.255(a)
text: '(a) Salvo disposição em contrário neste Regulamento ou em Instrução Suplementar, volumes
  e

  sobrembalagens contendo artigos perigosos entregues para o transporte aéreo devem ser marcados

  com o nome apropriado para embarque do seu conteúdo e, quando atribuído, o número UN ou
  ID,

  assim como com quaisquer outras marcas conforme especificado em Instrução Suplementar.'
