cite: 175.255(b)
title: 175.255(b)
text: '(b) Salvo disposição em contrário neste Regulamento ou em Instrução Suplementar, cada

  embalagem manufaturada de acordo com uma especificação contidas nas Instruções Técnicas
  deve

  ser marcada em conformidade com as provisões apropriadas estabelecidas em Instrução Suplementar;

  e nenhuma embalagem pode ser marcada com uma marcação de uma especificação de embalagem
  a

  menos que a embalagem atenda às especificações de embalagem apropriadas contidas nas Instruções

  Técnicas.'
