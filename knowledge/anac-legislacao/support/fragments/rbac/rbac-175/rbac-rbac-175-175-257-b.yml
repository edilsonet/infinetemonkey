cite: 175.257(b)
title: 175.257(b)
text: '(b) As marcas nos volumes requeridas por 175.255:

  (1) devem ser duráveis e impressas, ou de outra forma marcadas ou fixadas, na superfície

  externa do volume;

  (2) devem estar prontamente visíveis e legíveis;


  Data da emissão: 12 de fevereiro de 2021.


  (3) devem ser capazes de resistir à exposição a intempéries sem reduzir substancialmente
  sua

  eficácia;

  (4) devem ser exibidas em um fundo de cor contrastante; e

  (5) não podem ser aplicadas junto a outras marcas de volumes que possam reduzir

  substancialmente a sua eficácia.'
