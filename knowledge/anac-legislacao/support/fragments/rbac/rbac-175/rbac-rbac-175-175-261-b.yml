cite: 175.261(b)
title: 175.261(b)
text: '(b) Exceto se de outra forma estabelecido neste Regulamento ou em Instrução Suplementar,
  a

  pessoa que oferece artigos perigosos para o transporte aéreo deve preencher, assinar e fornecer
  ao

  operador um documento de transporte de artigos perigosos, em conformidade com o estabelecido
  em

  Instrução Suplementar.'
