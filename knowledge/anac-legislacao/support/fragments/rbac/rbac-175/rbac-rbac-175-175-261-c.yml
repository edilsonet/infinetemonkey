section_title: Informação para transporte de artigos perigosos
subsection_id: c
cite: 175.261(c)
title: 175.261(c)
text: '(c) O documento de transporte de artigos perigosos deve incluir uma certificação ou
  uma

  declaração, assinada pela pessoa que oferece artigos perigosos para o transporte, de que
  a remessa é

  aceitável para o transporte e que os artigos perigosos estão completa e precisamente descritos
  pelo

  nome apropriado para embarque e que estão devidamente classificados, embalados, marcados,

  etiquetados e em condições adequadas para o transporte em conformidade com os regulamentos

  aplicáveis.'
