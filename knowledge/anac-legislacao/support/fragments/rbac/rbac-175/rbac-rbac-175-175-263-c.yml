cite: 175.263(c)
title: 175.263(c)
text: '(c) Quando um conhecimento aéreo for emitido para uma remessa para a qual é exigido
  um

  documento de transporte de artigos perigosos, o conhecimento aéreo deve conter uma expressão
  de

  forma a indicar que os artigos perigosos estão descritos em um documento de transporte de
  artigos

  perigosos que o acompanha. Um conhecimento aéreo emitido para uma remessa deve, quando

  aplicável, indicar que a remessa deve ser carregada somente em aeronaves de carga.'
