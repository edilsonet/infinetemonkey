title: 175.267(b)
text: '(b) No caso de embalagens destinadas ao transporte de artigos perigosos em quantidade
  limitada,

  quantidade excetuada e infectantes da Classe 6, Divisão 6.2, Categoria B (UN 3373), deve-se
  atender

  ao previsto no parágrafo 175.309(d).


  Data da emissão: 12 de fevereiro de 2021.


  SUBPARTE G

  PROCEDIMENTO PARA APROVAÇÃO DE EMBALAGEM PARA O TRANSPORTE

  AÉREO DE ARTIGOS PERIGOSOS'
