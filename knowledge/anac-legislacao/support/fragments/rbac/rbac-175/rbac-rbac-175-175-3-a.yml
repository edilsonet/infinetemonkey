cite: 175.3(a)
title: 175.3(a)
text: '(a) tambores de metal, que foram:

  (1) limpos até se chegar aos materiais originais de construção, com a remoção de todos os

  traços de conteúdos anteriores, bem como de toda corrosão interna e externa, revestimentos
  externos

  e etiquetas;

  (2) restaurados à forma e contorno originais, com bordas (se houver) endireitadas e seladas,

  e todas as vedações não integrais substituídas; e

  (3) inspecionados após a limpeza, mas antes da pintura, com a rejeição de embalagens com

  corrosão visível, significativa redução da espessura do material, fadiga do metal, roscas
  ou sistemas

  de fechamento danificados, ou outros defeitos significativos; e'
