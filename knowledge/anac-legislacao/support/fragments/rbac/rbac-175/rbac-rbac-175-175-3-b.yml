cite: 175.3(b)
title: 175.3(b)
text: '(b) Aprovação unilateral. A aprovação de um projeto, a qual é requerida a ser concedida

  exclusivamente pela autoridade competente do país de origem do projeto.

  - Artigo explosivo. Um artigo contendo uma ou mais substâncias explosivas.


  Data da emissão: 12 de fevereiro de 2021.


  - Artigos perigosos. Objetos ou substâncias capazes de representar perigo à saúde, à segurança

  operacional, aos bens ou ao meio ambiente e que estejam presentes na Lista de Artigos Perigosos

  publicada pela ANAC ou que sejam classificados de acordo com este Regulamento.

  - Artigos perigosos líquidos. Artigos perigosos que a 50°C têm uma pressão de vapor não
  superior

  a 300 kPa (3 bar), que não são completamente gasosos a 20°C e a uma pressão de 101,3 kPa,
  e que

  têm um ponto de fusão ou ponto de fusão inicial de 20°C ou menos a uma pressão de 101,3
  kPa. Uma

  substância viscosa cujo ponto de fusão específico não pode ser determinado deve ser submetida
  ao

  teste ASTM D 4359-90, ou ao teste para determinação da fluidez (teste do penetrômetro) disposto
  na

  seção 2.3.4 do anexo A do Acordo Europeu relativo ao Transporte Internacional de Artigos
  Perigosos

  por Rodovias (ADR) (publicação das Nações Unidas: ECE/TRANS/225 (Sales No. E.16.VIII.1)).

  - Artigos perigosos sólidos. Artigos perigosos, que não sejam gases, que não atendam à definição

  de artigos perigosos líquidos.

  - ASTM. Sociedade Americana para Testes e Materiais (ASTM International, 100 Barr Harbor

  Drive, PO Box C700, West Conshohocken, PA 19428-2959, Estados Unidos).

  - Através ou dentro. Para o transporte de material radioativo, através ou dentro de países,
  nos

  quais a remessa é transportada, mas especificamente excluindo os países “sobre” os quais
  uma

  remessa é transportada por via aérea, desde que não existam paradas programadas nesses países.

  - Autoridade competente. Qualquer órgão ou autoridade designada ou de outra forma

  reconhecida como tal, para qualquer propósito ligado a este Regulamento.

  Nota: esta definição aplica-se somente a materiais radioativos.

  - Autoridade nacional apropriada. Qualquer autoridade designada ou de outra forma

  reconhecida por um país a executar funções específicas relacionadas com as provisões contidas
  neste

  Regulamento e em Instrução Suplementar.

  Nota: esta definição aplica-se à ANAC em relação aos temas de sua competência.

  - Autorização especial. Uma autorização, que não seja uma aprovação, concedida pela autoridade

  nacional apropriada proporcionando flexibilização das provisões deste Regulamento ou de
  Instrução

  Suplementar.

  Nota: os requisitos para autorizações especiais são dados em 175.1(d).

  - Bagagem. Bens pessoais de passageiros ou tripulantes transportados em uma aeronave mediante

  acordo com o operador aéreo.

  - Bolsas. Embalagens flexíveis feitas de papel, película de plástico, material têxtil, material
  de

  tecido ou outros materiais adequados.

  - Bombonas. Embalagens de metal ou plástico de seção transversal retangular ou poligonal.

  - Carga. Para os fins deste Regulamento, qualquer bem transportado em uma aeronave que não

  seja mala postal ou bagagem acompanhada ou extraviada.

  Nota: esta definição difere da definição de “carga” dada pelo Anexo 9 - Facilitação.

  - Carga externa. Qualquer carga suspensa por um helicóptero ou em equipamento ligado a um

  helicóptero.

  - Célula de combustível. Um dispositivo eletroquímico que converte a energia química de
  um

  combustível em energia elétrica, calor e produtos de reação.

  - COMAT. Material do operador aéreo, transportado em uma aeronave do próprio operador aéreo

  e em seu próprio proveito.


  Data da emissão: 12 de fevereiro de 2021.


  Nota 1: para os fins deste Regulamento, o COMAT representa um material que não faz parte

  dos requisitos de operação ou aeronavegabilidade para o voo em que está sendo transportado
  e não é

  utilizado para venda nesse voo ou para serviços nesse voo ou em um voo subsequente.

  Nota 2: inclui-se nesta definição o material AOG (Aircraft on Ground).

  Nota 3: para os fins deste Regulamento, o COMAT é considerado carga.

  - COMAT perigoso. COMAT que atenda à definição de artigo perigoso.

  Nota: para os fins deste Regulamento, o COMAT perigoso (p. ex., partes de aeronaves, tais

  como geradores químicos de oxigênio, unidades de controle de combustível, extintores de
  incêndio,

  óleos, lubrificantes, produtos de limpeza) deve ser transportado de acordo com 175.11(b).

  - Contêiner de carga. Ver dispositivo de carga unitizada (Unit Load Device - ULD).

  Nota: para a definição de contêiner de carga para material radioativo, ver 2;7.1.3 das Instruções

  Técnicas ou equivalente em norma da CNEN.

  - Contêiner de carga, no caso do transporte de material radioativo. Ver 2;7.1.3 das Instruções

  Técnicas ou equivalente em norma da CNEN.

  - Conteúdos radioativos. Para o transporte de material radioativo, o material radioativo,

  juntamente com quaisquer sólidos, líquidos e gases contaminados ou ativados no interior
  da

  embalagem.

  - Destinatário. Qualquer pessoa, organização ou governo que seja intitulado a receber uma

  remessa.

  - Discrepância com artigo perigoso. Toda ocorrência que não resulte em um incidente ou

  acidente com artigo perigoso e que esteja relacionada ao transporte de artigos perigosos
  declarados,

  classificados, embalados, marcados, etiquetados ou documentados em desacordo com este

  Regulamento ou com as Instruções Técnicas.

  - Dispositivo de carga unitizada (Unit Load Device - ULD). Qualquer tipo de contêiner de
  carga,

  contêiner de aeronave, pálete de aeronave com rede ou pálete de aeronave com rede sobre
  um iglu.

  Nota 1: sobrembalagens não estão incluídas nesta definição.

  Nota 2: contêineres de carga para material radioativo não estão incluídos nesta definição
  (ver

  2;7.1.3 das Instruções Técnicas ou equivalente em norma da CNEN).

  - Embalagem. Um ou mais recipientes e quaisquer outros componentes ou materiais necessários

  para que os recipientes desempenhem sua função de contenção e outras funções de segurança

  operacional.

  Nota: para material radioativo, ver 2;7.1.3 das Instruções Técnicas ou equivalente em norma

  da CNEN.

  - Embalagem externa. A proteção externa de uma embalagem composta ou combinada,

  juntamente com quaisquer materiais absorventes, acolchoantes e quaisquer outros componentes

  necessários para conter e proteger os recipientes internos ou embalagens internas.

  - Embalagens combinadas. Uma combinação de embalagens para fins de transporte, que consiste

  em uma ou mais embalagens internas acondicionadas em uma embalagem externa de acordo com
  as

  provisões pertinentes deste Regulamento e da Parte 4 das Instruções Técnicas.

  - Embalagens compostas. Embalagens constituídas por uma embalagem externa e um recipiente

  interno construído de modo que o recipiente interno e a embalagem externa formem uma embalagem

  integral. Uma vez montada, essa embalagem permanece como uma unidade individual integrada;
  é


  Data da emissão: 12 de fevereiro de 2021.


  envasada, armazenada, transportada e esvaziada como tal.

  Nota: embalagens compostas para os propósitos deste Regulamento são consideradas como

  embalagens únicas.

  - Embalagens internas. Embalagens para as quais uma embalagem externa é requerida para o

  transporte.

  - Embalagens recondicionadas. Incluem:'
