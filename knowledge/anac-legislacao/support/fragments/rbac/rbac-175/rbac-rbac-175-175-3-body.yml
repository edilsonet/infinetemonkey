text: '175.3 Termos e definições

  Nota: para os propósitos deste Regulamento, se houver divergência entre uma definição constante

  neste Regulamento e uma definição constante no RBAC nº 01, deve ser considerada a definição

  constante neste Regulamento.

  - Acidente com artigo perigoso. Uma ocorrência associada e relacionada ao transporte de
  artigos

  perigosos por via aérea que resulte em morte ou lesão grave a uma pessoa ou danos consideráveis
  a

  bens ou ao meio ambiente.

  Nota: um acidente ou incidente com artigos perigosos pode também constituir um acidente
  ou

  incidente aeronáutico, conforme especificado no Anexo 13 - Investigação de Acidente e Incidente

  Aeronáutico.

  - Aeronave de carga. Qualquer aeronave, não enquadrada na definição de aeronave de

  passageiros, que transporte mercadorias ou bens tangíveis.

  - Aeronave de passageiros. Uma aeronave que transporte qualquer pessoa que não seja membro

  da tripulação, um funcionário do operador aéreo que viaje por razões de trabalho, um representante

  autorizado de uma autoridade nacional apropriada ou uma pessoa acompanhando uma remessa
  ou

  uma carga.

  - Agência de carga (freight forwarder). Uma pessoa ou organização que oferece o serviço
  de

  organizar o transporte de carga por via aérea.

  Nota: ver definição de expedidor.

  - Aprovação (approval). Uma autorização outorgada pela autoridade nacional apropriada para:'
