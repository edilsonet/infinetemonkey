title: 175.3(f)
text: '(f) envolva exposição comprovada a substâncias infectantes ou radiação prejudicial.

  - Mala postal. Remessa de correspondência e de outros itens, enviados pelos serviços postais
  e

  destinados a serem entregues aos serviços postais, de acordo com as regras da União Postal
  Universal

  - UPU.

  - Manual de Testes e Critérios. A edição vigente da publicação das Nações Unidas intitulada

  Recomendações para o Transporte de Artigos Perigosos, Manual de Testes e Critérios.

  - Material radioativo de baixa dispersão. Um material radioativo sólido ou um material

  radioativo sólido numa cápsula selada, que tenha dispersão limitada e não esteja em forma
  de pó.

  - Membro da tripulação. Uma pessoa a quem o operador aéreo designa obrigações a serem

  cumpridas em serviço a bordo, durante o período de serviço do voo.

  - Membro da tripulação de cabine. Um membro da tripulação que executa, em proveito da

  segurança dos passageiros, os deveres designados pelo operador aéreo ou pelo piloto em comando
  da

  aeronave, mas que não pode atuar como tripulante de voo. É também chamado de “comissário
  de

  voo” ou “comissário de bordo”.

  - Membro da tripulação de voo. Um membro da tripulação, titular da correspondente licença,

  encarregado de obrigações essenciais de serviço para a operação de uma aeronave durante
  o período

  de serviço do voo.

  Nota: não se incluem nesta definição os comissários de voo.

  - Número ID. Um número de identificação temporária para entradas na Lista de Artigos Perigosos

  para as quais não tenha sido atribuído um número UN.

  - Número UN. O número de quatro dígitos designado pelo Comitê de Especialistas em Transporte

  de Artigos Perigosos no Sistema Harmonizado Globalmente para a Classificação e Rotulagem
  de

  Produtos Químicos da Organização das Nações Unidas para identificar um objeto, uma substância
  ou

  um grupo particular de objetos ou substâncias.

  - Ocorrência com artigo perigoso. Qualquer tipo de discrepância, incidente ou acidente com

  artigo perigoso, incluindo a descoberta de artigo perigoso não declarado.

  - Operador aéreo. Uma pessoa, organização ou empresa que se dedica ou se propõe dedicar-se
  à

  exploração de uma aeronave.

  - Operador postal designado (DPO). Uma entidade, governamental ou não, designada

  oficialmente por um país membro da União Postal Universal (UPU) para operar serviços postais
  e

  cumprir com as correspondentes obrigações derivadas dos atos da Convenção da UPU em seu

  território.

  Nota: no Brasil, a Empresa Brasileira de Correios e Telégrafos, ou Correios.

  - País de destino. O país em cujo território pretende-se finalmente descarregar a remessa

  transportada por uma aeronave.

  - País de ocorrência. País em cujo território tenha acontecido uma ocorrência com artigo
  perigoso

  ou em cujo território se tenha descoberto essa ocorrência.

  - País de origem. O país em cujo território pretende-se carregar inicialmente uma remessa
  em uma

  aeronave.

  - País do operador aéreo. O país no qual está localizado o escritório sede do operador aéreo,
  ou,

  caso não exista esse escritório, a residência permanente do operador aéreo.

  - Países interessados. Para efeitos de:


  Data da emissão: 12 de fevereiro de 2021.'
