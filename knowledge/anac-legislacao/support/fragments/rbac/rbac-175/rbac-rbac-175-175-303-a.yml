title: 175.303(a)
text: '(a) Exceto se de outra forma especificado neste Regulamento ou nas Instruções Técnicas,
  as

  embalagens para o transporte aéreo de artigo perigoso devem, antes da sua fabricação, ser
  aprovadas

  junto à ANAC ou junto a um órgão reconhecido pela Agência.'
