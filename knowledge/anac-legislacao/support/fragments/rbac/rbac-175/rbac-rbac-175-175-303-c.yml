cite: 175.303(c)
title: 175.303(c)
text: '(c) A embalagem que não requerer uma marcação com o símbolo da ONU (marcação UN) pode,

  desde que cumpra com os requisitos de construção e ensaios previstos nas Instruções Técnicas,
  ser

  utilizada para embalar:

  (1) artigos perigosos em pequenas quantidades segundo os critérios de quantidade limitada
  e de

  quantidade excetuada; ou

  (2) outros artigos perigosos para os quais este Regulamento ou as Instruções Técnicas não

  requerem o uso de uma embalagem com marcação UN.'
