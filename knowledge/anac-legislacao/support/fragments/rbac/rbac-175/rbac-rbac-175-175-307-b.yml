title: 175.307(b)
text: '(b) A embalagem com marcação UN deve ser ensaiada exatamente na forma em que será utilizada

  para o transporte e deve demonstrar cumprimento com os requisitos técnicos aplicáveis, estabelecidos

  nas partes 4 e 6 das Instruções Técnicas.'
