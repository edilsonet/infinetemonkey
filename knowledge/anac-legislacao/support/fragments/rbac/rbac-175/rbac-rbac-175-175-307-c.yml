cite: 175.307(c)
title: 175.307(c)
text: '(c) É vedado identificar uma embalagem fabricada no Brasil com a marcação UN para o
  modal

  aéreo, exceto se ela tiver sido testada e aprovada pela ANAC ou órgão reconhecido pela Agência.
  A

  aprovação da embalagem consiste na aprovação de seu projeto e de sua produção, sendo ambas

  vinculadas e indissociáveis.'
