text: '(d) Para fins de aprovação da embalagem para o transporte aéreo de artigos perigosos
  da Classe 1,

  devem-se realizar os ensaios classificatórios conforme a Parte I do Manual de Testes e Critérios
  da

  ONU.


  Data da emissão: 12 de fevereiro de 2021.'
