title: 175.307(f)
text: '(f) Para os casos em que não seja possível demonstrar cumprimento com o requerido em

  175.307(e), a embalagem importada fica impedida de transportar o artigo perigoso, exceto
  se ela for

  submetida aos ensaios comprobatórios previstos em 175.307(d).'
