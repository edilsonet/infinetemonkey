text: '175.309

  Embalagens destinadas ao transporte de artigos perigosos em quantidade limitada, quantidade
  excetuada e

  infectantes da Classe 6, Divisão 6.2, Categoria B (UN 3373)

  - Não possuir os documentos

  comprobatórios exigidos pelo parágrafo

  175.309(d) como parte da documentação de

  embarque ou disponíveis para consulta.

  1.000,00

  2.000,00

  4.000,00

  1 por documento'
