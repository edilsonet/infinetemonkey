cite: 175.311(d)
title: 175.311(d)
text: '(d) Quando houver reprovação da embalagem em qualquer um dos ensaios, a realização
  de novos

  ensaios somente será aceita após:

  (1) o requerente submeter à ANAC relatório técnico apresentando a causa raiz e as ações

  corretivas a desvios e falhas ocorridos; e


  Data da emissão: 12 de fevereiro de 2021.


  (2) o relatório ser aceito pela ANAC.'
