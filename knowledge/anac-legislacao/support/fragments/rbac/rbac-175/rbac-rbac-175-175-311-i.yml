section_title: Inspeções e testes para aprovação do projeto de embalagem
subsection_id: i
cite: 175.311(i)
title: 175.311(i)
text: '(i) 98% de sua capacidade máxima para conteúdo líquido; ou

  (ii) 95% de sua capacidade máxima para conteúdo sólido.

  (3) Sacos devem preenchidos com a capacidade máxima de massa com que eles serão

  utilizados.

  (4) As substâncias ou artigos a serem transportados na embalagem podem ser substituídos,
  para

  fins de ensaio, por outra substância ou artigo exceto quando eles puderem invalidar os resultados
  dos

  ensaios. Para sólidos, quando outra substância for utilizada, ela deve ter as mesmas características

  físicas (massa, granulometria etc.) da substância que será transportada.

  (5) No ensaio de queda para líquido, quando outra substância for usada, ela deve ter densidade

  relativa e viscosidade similar à substância a ser transportada. Água pode ser utilizada
  no ensaio de

  queda sobre as condições estabelecidas em 6;4.3.5 das Instruções Técnicas.

  (6) Embalagens de papel ou papelão devem ser mantidas durante pelo menos 24 horas numa

  atmosfera com temperatura e umidade relativa (UR) controladas. Há três opções de atmosferas
  das

  quais uma deve ser escolhida. Preferencialmente deve-se utilizar uma atmosfera com temperatura
  de

  23°C ± 2°C e UR de 50% ± 2%. As outras duas opções são: 20°C ± 2°C e 65% ± 2% de UR ou 27°C

  ± 2°C e 65% ± 2% de UR. Os valores médios devem situar-se dentro desses limites. Flutuações
  de

  curto prazo e limitações nas medições podem provocar variações nas medições individuais
  de até ±

  5% de umidade relativa, sem impacto significativo da reprodutibilidade do ensaio.

  (7) Quando for requerida preparação especial das amostras para o ensaio de queda:'
