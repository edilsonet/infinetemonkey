cite: 175.313(b)
title: 175.313(b)
text: '(b) Método de teste.

  (1) No mínimo três amostras de embalagens, como preparadas para o transporte, devem ser

  ensaiadas.

  (2) As três amostras devem ser colocadas sobre uma plataforma vibratória que possua na

  direção vertical ou rotativa (deslocamento de pico a pico) com o dobro da amplitude de uma
  polegada.

  As embalagens devem ser fixadas horizontalmente para evitar que caiam fora da plataforma,
  mas

  deve se permitir que se movam verticalmente, saltem e girem.

  (3) O teste deve ser realizado durante uma hora a uma frequência que faça com que a

  embalagem seja elevada da plataforma de vibração a um grau tal que uma tira de material
  de

  aproximadamente 1,6 mm (0,063 polegada) de espessura (tal como uma régua de aço ou tira
  de

  cartão/papelão) possa ser passada entre o fundo de qualquer embalagem e a plataforma.

  (4) Imediatamente a seguir ao período de vibração, cada embalagem deve ser removida da

  plataforma para observação de qualquer evidência de vazamento ou dano a embalagem que possa

  comprometer a segurança no transporte.

  (5) Na impossibilidade de execução do teste acima descrito, um método alternativo igualmente

  eficaz poderá ser aceito pela ANAC para demonstração de cumprimento com o requisito.'
