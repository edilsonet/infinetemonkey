cite: 175.313(i)
title: 175.313(i)
text: '(i) os receptáculos primários ou embalagens secundárias, independentemente da temperatura

  de transporte prevista para o artigo, devem ser capazes de resistir, sem que haja vazamento,
  a uma

  pressão interna que produza uma pressão diferencial não inferior a 95 kPa e temperaturas
  variando

  no intervalo de -40ºC até + 55ºC. O teste de pressão deve ser realizado nos dois extremos
  do intervalo

  de temperatura por um período de 30 minutos para receptáculos primários ou embalagens secundárias

  plásticas e 5 minutos para os demais tipos de materiais;


  Data da emissão: 12 de fevereiro de 2021.


  (ii) no mínimo três amostras de receptáculos primários ou embalagens secundárias devem

  ser ensaiadas; e

  (iii) a embalagem será considerada aprovada no ensaio de pressão se não houver ruptura ou

  vazamento de qualquer uma das amostras.'
