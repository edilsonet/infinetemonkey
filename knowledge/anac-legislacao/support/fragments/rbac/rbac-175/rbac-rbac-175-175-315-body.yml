text: '175.315

  Fabricação

  - Alterar a localização de suas instalações

  de fabricação antes de obter aprovação da

  ANAC para tal.

  10.000,00

  17.500,00

  25.000,00

  1 por ocorrência

  - Não permitir que a ANAC inspecione seu

  sistema de qualidade, instalações, dados

  técnicos, quaisquer embalagens fabricadas

  e acompanhe quaisquer testes, necessárias

  para determinar o cumprimento com a

  regulamentação vigente.

  8.000,00

  14.000,00

  20.000,00

  1 por ocorrência


  Data da emissão: 12 de fevereiro de 2021.'
