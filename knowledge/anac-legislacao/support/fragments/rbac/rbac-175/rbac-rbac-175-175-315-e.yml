title: 175.315(e)
text: '(e) Inspeções e testes. O requerente ou detentor de uma aprovação de produção de embalagens

  deve permitir que a ANAC inspecione seu sistema de qualidade, instalações, dados técnicos
  e

  quaisquer embalagens fabricadas e acompanhe quaisquer testes necessárias para determinar
  o

  cumprimento deste Regulamento.'
