cite: 175.351(a)
title: 175.351(a)
text: '(a) Os funcionários de aceitação de carga devem buscar confirmação dos expedidores
  acerca do

  conteúdo de qualquer item de carga sobre o qual se tenha suspeita de que possa conter artigos

  perigosos, com a intenção de prevenir que artigos perigosos não declarados sejam carregados
  em uma

  aeronave como carga comum.'
