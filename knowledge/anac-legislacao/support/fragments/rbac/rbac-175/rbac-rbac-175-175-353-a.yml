section_title: Aceitação de artigos perigosos pelos operadores aéreos
subsection_id: a
cite: 175.353(a)
title: 175.353(a)
text: '(a) É vedado ao operador aéreo aceitar artigos perigosos para transporte aéreo:

  (1) se os artigos perigosos não estiverem acompanhados por um documento de transporte de

  artigos perigosos, em conformidade com Instrução Suplementar, exceto nos casos em que este

  Regulamento ou Instrução Suplementar indicar que um documento não é requerido; e

  (2) até que o volume, sobrembalagem ou contêiner contendo artigos perigosos tenha sido

  inspecionado de acordo com procedimentos de aceitação estabelecidos em Instrução Suplementar.'
