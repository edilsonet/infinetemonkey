section_title: SGSO no transporte de artigos perigosos
subsection_id: a
cite: 175.355(a)
title: 175.355(a)
text: '(a) Os operadores aéreos devem incluir o transporte de artigos perigosos, incluindo
  o transporte

  de células e de baterias de lítio como carga, no escopo:

  (1) do Sistema de Gerenciamento da Segurança Operacional (SGSO) do operador aéreo, se a

  ANAC requerer que o operador aéreo estabeleça um SGSO; e

  (2) da análise de risco da segurança operacional específica para o transporte de itens no

  compartimento de carga, se a ANAC requerer que o operador aéreo realize essa análise.'
