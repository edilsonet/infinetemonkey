cite: 175.357(a)
title: 175.357(a)
text: '(a) Volumes e sobrembalagens contendo artigos perigosos e contêineres de carga contendo

  material radioativo devem ser carregados e armazenados na aeronave, bem como manuseados,
  em

  conformidade com as provisões estabelecidas em Instrução Suplementar.

  (1) Volumes de artigos perigosos que possuam a etiqueta “Somente em aeronave de carga”

  devem ser carregados em conformidade com as provisões estabelecidas em Instrução Suplementar.'
