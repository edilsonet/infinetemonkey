cite: 175.359(a)
title: 175.359(a)
text: '(a) Artigos perigosos não podem ser carregados em uma cabine de aeronave ocupada por

  passageiros ou em uma cabine de comando de uma aeronave, exceto conforme permitido pelas

  provisões estabelecidas em Instrução Suplementar.'
