cite: 175.359(b)
title: 175.359(b)
text: '(b) Artigos perigosos somente podem ser transportados num compartimento de carga localizado

  no piso principal de uma aeronave de passageiros se:

  (1) esse compartimento cumprir com todos os requisitos de certificação de um compartimento

  de carga Classe B ou Classe C; ou


  Data da emissão: 12 de fevereiro de 2021.


  (2) sob as condições descritas em norma específica da ANAC, for outorgada uma aprovação

  para o transporte de artigos perigosos num compartimento que não cumpra os requisitos de

  175.359(a)(1).'
