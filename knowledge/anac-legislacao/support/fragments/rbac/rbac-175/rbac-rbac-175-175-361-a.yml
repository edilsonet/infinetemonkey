title: 175.361(a)
text: '(a) Volumes contendo artigos perigosos que possam reagir perigosamente uns com os outros
  não

  podem ser armazenados em uma aeronave próximos uns aos outros ou em uma posição que permitiria

  interação entre eles num possível vazamento.'
