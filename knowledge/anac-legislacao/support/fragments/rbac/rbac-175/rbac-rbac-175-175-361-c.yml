title: 175.361(c)
text: '(c) Volumes de material radioativo devem ser armazenados em uma aeronave de forma que
  sejam

  separados de pessoas, animais vivos e filmes fotográficos não revelados, em conformidade
  com as

  provisões estabelecidas em Instrução Suplementar.'
