cite: 175.363(a)
title: 175.363(a)
text: '(a) Quando artigos perigosos sujeitos a este Regulamento forem carregados em uma aeronave,
  o

  operador deve protegê-los de serem danificados e deve afixá-los na aeronave de forma que
  evite

  qualquer movimento em voo que possa alterar a orientação dos volumes.'
