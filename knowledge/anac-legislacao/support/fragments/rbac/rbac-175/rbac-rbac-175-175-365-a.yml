section_title: Volumes danificados de artigos perigosos
subsection_id: a
cite: 175.365(a)
title: 175.365(a)
text: '(a) Quando qualquer volume de artigos perigosos carregado em uma aeronave parecer ter
  sido

  danificado ou estar com vazamento ou com derramamento, o operador aéreo deve remover esse

  volume da aeronave, ou providenciar sua remoção por uma autoridade ou organização apropriada,
  e,

  posteriormente, encarregar-se de seu descarte seguro. No caso de um volume parecer estar
  com

  vazamento, o operador aéreo deve assegurar-se de que o restante da remessa esteja em condições

  apropriadas para transporte por via aérea e que nenhum outro volume, bagagem ou carga tenham
  sido

  contaminados.'
