cite: 175.367(a)
title: 175.367(a)
text: '(a) Cada ULD contendo artigos perigosos que requeiram etiqueta de perigo deve levar
  um rótulo

  de identificação na sua parte externa indicando que artigos perigosos estão contidos no
  interior da

  ULD, salvo se as próprias etiquetas de perigo estiverem visíveis.'
