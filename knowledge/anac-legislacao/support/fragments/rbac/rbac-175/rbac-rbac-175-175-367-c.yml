cite: 175.367(c)
title: 175.367(c)
text: '(c) Caso a ULD contenha volumes que possuam a etiqueta “Somente em aeronaves de carga”,
  essa

  etiqueta deve estar visível ou o rótulo de identificação deve indicar que a ULD somente
  pode ser

  carregada em uma aeronave de carga.'
