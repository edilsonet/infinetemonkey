title: 175.369(a)
text: '(a) É responsabilidade do operador aéreo assegurar que um volume ou uma sobrembalagem


  Data da emissão: 12 de fevereiro de 2021.


  contendo artigo perigoso ou um contêiner de carga contendo material radioativo não seja
  carregado

  em uma aeronave ou em uma ULD exceto se tiver sido inspecionado imediatamente antes de ser

  carregado e estiver livre de evidências de vazamentos ou de danos.'
