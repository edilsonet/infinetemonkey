title: 175.369(b)
text: '(b) Uma ULD não pode ser carregada a bordo de uma aeronave exceto se essa ULD tiver
  sido

  inspecionada e estiver livre de qualquer evidência de vazamentos dos, ou danos aos, artigos
  perigosos

  transportados.'
