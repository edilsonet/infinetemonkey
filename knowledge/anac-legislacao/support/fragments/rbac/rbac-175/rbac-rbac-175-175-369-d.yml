section_title: Inspeção contra danos ou vazamentos
subsection_id: d
cite: 175.369(d)
title: 175.369(d)
text: '(d) O operador deve realizar os procedimentos adequados para a segurança das operações,

  conforme estabelecido em Instrução Suplementar, nas seguintes situações:

  (1) dano ou vazamento em volume contendo substâncias infectantes; e

  (2) transporte de volumes de material radioativo.'
