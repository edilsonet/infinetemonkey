cite: 175.371(b)
title: 175.371(b)
text: '(b) Uma aeronave que tenha sido contaminada por material radioativo deve ser retirada
  de serviço

  e não pode voltar a ser utilizada até que a taxa de dose em qualquer superfície acessível
  e a

  contaminação radioativa não fixada sejam inferiores aos valores estabelecidos em Instrução

  Suplementar.'
