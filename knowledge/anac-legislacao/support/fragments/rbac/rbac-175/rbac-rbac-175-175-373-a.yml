section_title: Bagagem ou carga suspeita de contaminação
subsection_id: a
cite: 175.373(a)
title: 175.373(a)
text: '(a) Se um operador aéreo tiver conhecimento de que uma bagagem ou carga não identificada
  como

  contendo artigos perigosos esteja contaminada e suspeitar que artigos perigosos possam ser
  a causa

  dessa contaminação, o operador aéreo deve tomar as medidas razoáveis para identificar a
  natureza e

  a fonte da contaminação antes de proceder com o carregamento da bagagem ou carga contaminada.

  Se for determinado ou se suspeitar que a substância contaminante é um artigo perigoso classificado

  por este Regulamento, o operador aéreo deve isolar a bagagem ou carga e tomar as medidas

  apropriadas para anular qualquer perigo identificado antes que a bagagem ou carga siga seu
  transporte

  por via aérea.'
