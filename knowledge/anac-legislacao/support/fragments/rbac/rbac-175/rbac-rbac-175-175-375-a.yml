section_title: Informação ao piloto em comando e ao pessoal encarregado do controle operacional
subsection_id: a
cite: 175.375(a)
title: 175.375(a)
text: '(a) Salvo disposição contrária neste Regulamento ou em Instrução Suplementar, logo
  que possível,

  antes da partida da aeronave, porém em nenhum caso após sua movimentação sob potência própria,

  o operador aéreo de uma aeronave na qual serão transportados artigos perigosos deve:

  (1) prover ao piloto em comando, por escrito, informação exata e legível relativa aos artigos

  perigosos que serão transportados como carga, conforme especificado em Instrução Suplementar;
  e

  (2) prover ao pessoal encarregado do controle operacional da aeronave (p. ex., o responsável

  por operações de voo, despachantes operacionais de voo, ou outras pessoas de terra responsáveis


  Data da emissão: 12 de fevereiro de 2021.


  pelas operações de voo) a mesma informação requerida para o piloto em comando (p. ex., uma
  cópia

  da informação escrita entregue ao piloto em comando). O operador aéreo deve especificar
  o pessoal

  (cargo ou função) ao qual deve proporcionar essa informação em seu manual de artigos perigosos

  e/ou em outros manuais apropriados, conforme normas específicas da ANAC.'
