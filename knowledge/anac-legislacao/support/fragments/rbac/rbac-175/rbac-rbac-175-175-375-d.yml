section_title: Informação ao piloto em comando e ao pessoal encarregado do controle operacional
subsection_id: d
cite: 175.375(d)
title: 175.375(d)
text: '(d) Uma cópia legível da informação provida ao piloto em comando deve ser retida em
  solo. Essa

  cópia deve conter nela, ou junto a ela, uma indicação de que o piloto em comando recebeu
  a

  informação. Uma cópia do documento, ou a informação nele contida, deve estar prontamente

  acessível ao encarregado de operações de voo, ao despachante operacional de voo ou ao pessoal
  de

  solo responsável pelas operações de voo até o desembarque do artigo perigoso.'
