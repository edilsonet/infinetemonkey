section_title: Informações disponibilizadas aos funcionários
subsection_id: a
cite: 175.377(a)
title: 175.377(a)
text: '(a) Um operador aéreo regido pelos RBAC nº 121, 129 ou 135 deve disponibilizar informações

  em seu manual de artigos perigosos e/ou em outros manuais apropriados, conforme normas

  específicas da ANAC, de forma que permita às tripulações de voo e a outros funcionários

  desempenharem as funções pelas quais são responsáveis, no que diz respeito ao transporte
  de artigos

  perigosos.'
