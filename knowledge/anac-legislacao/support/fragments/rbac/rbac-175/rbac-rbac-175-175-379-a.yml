section_title: Informação em caso de emergência em voo
subsection_id: a
cite: 175.379(a)
title: 175.379(a)
text: '(a) Caso uma emergência em voo ocorra, o piloto em comando deve, logo que a situação
  permita,

  informar a unidade de serviço de tráfego aéreo apropriada, para fins de informação às autoridades
  do

  aeródromo, sobre quaisquer artigos perigosos transportados como carga a bordo da aeronave,
  em

  conformidade com as provisões estabelecidas em Instrução Suplementar.'
