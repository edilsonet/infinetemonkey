title: 175.381(a)
text: '(a) O operador aéreo deve notificar acidentes e incidentes com artigos perigosos às
  autoridades

  apropriadas do país do operador aéreo e do país de ocorrência, de acordo com os requisitos
  de

  notificação dessas autoridades.'
