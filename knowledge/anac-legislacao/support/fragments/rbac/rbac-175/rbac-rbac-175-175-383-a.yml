section_title: Notificação de artigos perigosos não declarados ou mal declarados
subsection_id: a
cite: 175.383(a)
title: 175.383(a)
text: '(a) O operador aéreo deve notificar qualquer ocasião em que artigos perigosos não declarados
  ou

  erroneamente declarados forem descobertos em itens de carga ou mala postal. Essa notificação
  deve

  ser feita às autoridades apropriadas do país do operador aéreo e do país de ocorrência.'
