cite: 175.383(b)
title: 175.383(b)
text: '(b) O operador aéreo deve também notificar qualquer ocasião em que artigos perigosos
  não

  permitidos sob 175.11(c) tenham sido descobertos pelo próprio operador aéreo, ou em que
  o operador

  aéreo tenha sido informado da presença de artigos perigosos não permitidos por uma entidade
  que

  tenha descoberto esses artigos perigosos, tanto na bagagem quanto junto ao corpo de passageiros
  ou

  tripulantes. Essa notificação deve ser feita à autoridade apropriada do país de ocorrência.


  Data da emissão: 12 de fevereiro de 2021.'
