cite: 175.385(a)
title: 175.385(a)
text: '(a) Um operador aéreo deve notificar ao país do operador aéreo qualquer ocasião em
  que:

  (1) artigos perigosos tenham sido transportados, mas não tenham sido carregados, segregados,

  separados ou afixados de acordo com este Regulamento; ou

  (2) artigos perigosos tenham sido transportados sem que tenha sido provida a informação
  ao

  piloto em comando de acordo com 175.375.'
