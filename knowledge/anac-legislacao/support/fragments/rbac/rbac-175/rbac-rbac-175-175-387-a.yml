section_title: Informações por parte do operador aéreo em caso de acidente ou de incidente
subsection_id: a
cite: 175.387(a)
title: 175.387(a)
text: '(a) O operador aéreo de uma aeronave transportando artigos perigosos como carga deve,
  sem

  demora, prover aos serviços de emergência que respondam a um acidente ou incidente grave

  informações sobre os artigos perigosos a bordo, tal como apresentadas na cópia da informação

  provida ao piloto em comando, num evento de:

  (1) um acidente aeronáutico; ou

  (2) um incidente grave onde artigos perigosos transportados como carga possam estar

  envolvidos.'
