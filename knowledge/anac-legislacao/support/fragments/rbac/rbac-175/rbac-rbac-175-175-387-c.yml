cite: 175.387(c)
title: 175.387(c)
text: '(c) Num evento de um incidente aeronáutico, caso requisitado, o operador aéreo de uma
  aeronave

  transportando artigos perigosos como carga deve, sem demora, prover aos serviços de emergência

  que respondam ao incidente e à autoridade apropriada do país de ocorrência informações sobre
  os

  artigos perigosos a bordo, tal como apresentadas na cópia da informação provida ao piloto
  em

  comando.

  Nota: os termos “acidente”, “incidente grave” e “incidente” nesta seção são aqueles definidos
  no'
