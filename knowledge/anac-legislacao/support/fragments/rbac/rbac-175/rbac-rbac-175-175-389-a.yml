section_title: Provisão de informações em áreas de aceitação de carga
subsection_id: a
cite: 175.389(a)
title: 175.389(a)
text: '(a) O operador aéreo, ou qualquer pessoa atuando em seu nome, deve assegurar a provisão
  de

  informações sobre o transporte de artigos perigosos instalando de maneira destacada e em
  lugares

  visíveis um número suficiente de avisos informativos nas áreas de aceitação de carga, a
  fim de alertar

  os expedidores e as agências de carga sobre quaisquer artigos perigosos que possam estar
  contidos

  em suas remessas de carga. Esses avisos devem incluir exemplos visuais de artigos perigosos,

  incluindo baterias.'
