cite: 175.391(a)
title: 175.391(a)
text: '(a) O operador aéreo deve assegurar-se de que, para remessas para as quais um documento
  de

  transporte de artigos perigosos seja requerido por este Regulamento, informação apropriada
  esteja

  imediatamente disponível a todo momento para ser usada em resposta a emergência relacionada
  a

  acidentes e incidentes envolvendo artigos perigosos no transporte aéreo. A informação deve
  estar


  Data da emissão: 12 de fevereiro de 2021.


  disponível ao piloto em comando e pode ser provida:

  (1) por meio do documento Guia de Resposta a Emergências para Incidentes Aeronáuticos

  Envolvendo Artigos Perigosos (Doc 9481); ou

  (2) por meio de qualquer outro documento que proveja informação apropriada relativa aos

  artigos perigosos a bordo.'
