cite: 175.393(a)
title: 175.393(a)
text: '(a) O operador aéreo deve assegurar-se de que ao menos uma cópia dos documentos ou

  informações apropriadas ao transporte de uma remessa de artigos perigosos por via aérea
  seja retida

  por um período mínimo de três meses após o voo em que artigos perigosos tenham sido transportados.

  No mínimo, os documentos ou informações que devem ser retidos são: o conhecimento aéreo
  (quando

  emitido), o documento de transporte de artigos perigosos, a lista de verificação para aceitação
  (quando

  estiver em um formato que requeira preenchimento), a identificação da pessoa que executou
  a

  verificação para aceitação e a informação escrita provida ao piloto em comando. Esses documentos

  ou informações devem ser disponibilizados à ANAC, caso solicitado.'
