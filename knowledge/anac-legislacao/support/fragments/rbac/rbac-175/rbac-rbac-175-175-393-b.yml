cite: 175.393(b)
title: 175.393(b)
text: '(b) Para cada volume ou sobrembalagem contendo artigos perigosos, ou contêiner de carga

  contendo material radioativo, ou ULD contendo artigos perigosos em casos específicos previstos
  em

  Instrução Suplementar, que não tenha sido aceito por um operador aéreo devido a um erro
  ou omissão

  por parte do expedidor relativo à embalagem, à etiquetagem, à marcação ou à documentação,
  uma

  cópia da documentação e da lista de verificação para aceitação (quando estiver em um formato
  que

  requeira preenchimento) e a identificação da pessoa que executou a verificação para aceitação

  deveriam ser retidos por um período mínimo de três meses após o preenchimento da lista de

  verificação para aceitação.'
