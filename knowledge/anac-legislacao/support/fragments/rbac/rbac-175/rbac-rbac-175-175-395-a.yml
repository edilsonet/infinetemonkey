section_title: Prazos para notificação de ocorrências com artigos perigosos
subsection_id: a
cite: 175.395(a)
title: 175.395(a)
text: '(a) Todas as ocorrências com artigos perigosos em que o Brasil deva ser notificado,
  conforme

  definido nos requisitos 175.381, 175.383, 175.385 e 175.387, devem ser enviadas à ANAC conforme

  norma específica, respeitando os seguintes prazos:

  (1) em caso de acidentes com artigos perigosos, por telefone, o mais breve possível, e por

  escrito, em prazo não superior a 48 horas; e

  (2) nos demais casos, o mais breve possível, em prazo não superior a 30 dias a partir da

  ocorrência.'
