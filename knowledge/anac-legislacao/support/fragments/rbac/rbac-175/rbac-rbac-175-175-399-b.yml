cite: 175.399(b)
title: 175.399(b)
text: '(b) No caso de um operador aéreo brasileiro regido pelos RBAC nº 121 ou 135 adotar
  condições

  mais restritivas que aquelas especificadas neste Regulamento, em Instrução Suplementar ou
  nas

  Instruções Técnicas, essas condições devem ser notificadas à ANAC e, caso realize transporte

  internacional, também à OACI, para publicação nas Instruções Técnicas.'
