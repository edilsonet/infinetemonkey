cite: 175.403(a)
title: 175.403(a)
text: '(a) Com o objetivo de prevenir que artigos perigosos não declarados sejam carregados
  em uma

  aeronave e prevenir que passageiros introduzam a bordo esses artigos perigosos não permitidos
  em

  suas bagagens, os operadores aéreos regidos pelos RBAC nº 121, 129 ou 135 devem prover ao
  pessoal

  de reservas e vendas de carga, ao pessoal de aceitação de carga, ao pessoal de reservas
  e vendas de

  bilhetes e ao pessoal que realiza despacho de passageiros, conforme seja apropriado, e devem

  disponibilizar prontamente para uso desse pessoal, informações sobre:

  (1) descrições genéricas frequentemente usadas para itens de carga ou de bagagem que possam

  conter artigos perigosos;

  (2) outras indicações de que artigos perigosos possam estar presentes (p. ex., etiquetas,
  marcas);

  e

  (3) artigos perigosos que podem ser transportados por passageiros de acordo com 175.11(c).'
