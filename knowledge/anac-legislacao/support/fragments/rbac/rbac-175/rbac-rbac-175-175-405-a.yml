cite: 175.405(a)
title: 175.405(a)
text: '(a) Devido a diferenças nos tipos de operações conduzidas por helicópteros comparadas
  às

  conduzidas por aviões, pode haver circunstâncias em que nem todas as provisões deste Regulamento

  e de Instrução Suplementar sejam apropriadas ou necessárias, como operações envolvendo lugares

  desabitados, lugares remotos, zonas montanhosas ou locais de construção etc. Nessas circunstâncias

  e quando apropriado, o país do operador aéreo poderá outorgar uma aprovação para permitir
  o

  transporte de artigos perigosos sem que se cumpram todos os requisitos normais deste Regulamento

  ou de Instrução Suplementar. Quando países que não sejam o país do operador aéreo tenham

  notificado à OACI que eles requerem uma aprovação prévia para essas operações, essa aprovação

  deve ser obtida também do país de origem e do país de destino, conforme apropriado.'
