title: 175.405(b)
text: '(b) Quando artigos perigosos forem transportados suspensos por um helicóptero, o operador
  aéreo

  deve assegurar-se de que considerou os perigos de uma descarga estática ao aterrissar ou
  liberar a

  carga.'
