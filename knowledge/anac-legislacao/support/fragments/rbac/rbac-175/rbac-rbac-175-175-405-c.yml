title: 175.405(c)
text: '(c) Quando helicópteros estiverem transportando passageiros, de acordo com o previsto
  em

  Instrução Suplementar, o país do operador aéreo poderá outorgar uma aprovação para permitir
  o

  transporte de artigos perigosos, seja:

  (1) na cabine, quando esses artigos perigosos estiverem associados aos passageiros ou estiverem

  acompanhados por eles; ou

  (2) em compartimentos de carga que não cumpram com os requisitos de 175.359(a).


  Data da emissão: 12 de fevereiro de 2021.'
