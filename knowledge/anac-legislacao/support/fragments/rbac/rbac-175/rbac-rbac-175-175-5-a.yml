cite: 175.5(a)
title: 175.5(a)
text: '(a) Salvo disposição contrária neste Regulamento ou em Instrução Suplementar, é vedado
  oferecer

  ou aceitar artigos perigosos para o transporte aéreo civil, exceto se esses artigos estiverem

  devidamente classificados, documentados, certificados, descritos, embalados, marcados, etiquetados

  e nas condições requeridas para expedição por este Regulamento.

  (1) Se uma pessoa desempenha uma função requerida por este Regulamento em nome da pessoa

  que oferece os artigos perigosos para o transporte por via aérea ou em nome do operador
  aéreo, essa

  pessoa deve, obrigatoriamente, desempenhar essa função de acordo com os requisitos deste

  Regulamento.

  (2) É vedado transportar artigos perigosos por via aérea, exceto se esses artigos forem
  aceitos,

  manuseados e transportados de acordo com este Regulamento.

  (3) É vedado etiquetar, marcar, certificar ou oferecer uma embalagem como se estivesse

  satisfazendo aos requisitos deste Regulamento ou de Instrução Suplementar, exceto se a embalagem

  for fabricada, marcada, mantida, recondicionada ou reparada conforme exigido por este Regulamento.

  (4) É vedado transportar artigos perigosos, ou promover o transporte de artigos perigosos
  a

  bordo de uma aeronave, tanto em bagagem despachada como bagagem de mão ou junto ao seu corpo,

  exceto se permitido por 175.11(c).


  Data da emissão: 12 de fevereiro de 2021.'
