cite: 175.51(b)
title: 175.51(b)
text: '(b) Análise e aprovação.

  (1) Os programas de treinamento de artigos perigosos de operadores aéreos brasileiros regidos

  pelos RBAC nº 121 ou 135, ou de operadores aéreos brasileiros não regidos por esses RBAC
  e que

  sejam autorizados a transportar artigos perigosos como carga, devem ser submetidos à análise
  e à

  aprovação da ANAC.

  (2) O programa de treinamento de artigos perigosos do operador postal designado brasileiro

  deve ser submetido à análise e à aprovação da ANAC.

  (3) Os demais programas de treinamento de artigos perigosos não precisam ser enviados para

  análise da ANAC e serão considerados aprovados desde que obedeçam ao disposto nesta Subparte
  e

  em norma específica da ANAC.'
