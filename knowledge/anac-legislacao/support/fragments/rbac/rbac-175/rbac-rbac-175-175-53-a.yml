cite: 175.53(a)
title: 175.53(a)
text: '(a) O empregador deve garantir que cada pessoa é competente para desempenhar cada função
  pela

  qual é responsável antes de desempenhar essa função. Essa garantia deve ser obtida por meio
  de

  treinamento e avaliação compatíveis com as funções pelas quais a pessoa é responsável. Esse

  treinamento deve incluir:

  (1) treinamento de familiarização geral. A pessoa deve ser treinada para se familiarizar
  com as

  provisões gerais;

  (2) treinamento específico segundo a função. A pessoa deve ser treinada para desempenhar
  com

  competência cada função pela qual é responsável; e

  (3) treinamento de segurança operacional. A pessoa deve ser treinada em como reconhecer
  os

  perigos apresentados pelos artigos perigosos, no manuseio seguro e nos procedimentos de
  resposta a

  emergências.'
