title: 175.53(b)
text: '(b) Cada pessoa que recebeu treinamento e foi designada para uma nova função deve ser
  avaliada

  para se determinar sua competência com relação à nova função. Se não for demonstrada competência,

  deve ser provido treinamento adicional apropriado.'
