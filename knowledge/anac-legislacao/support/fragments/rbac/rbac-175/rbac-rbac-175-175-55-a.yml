section_title: Treinamento e avaliação periódicos
subsection_id: a
cite: 175.55(a)
title: 175.55(a)
text: '(a) Cada pessoa deve receber treinamento e avaliação periódicos dentro do prazo de
  24 meses a

  partir, respectivamente, do treinamento e da avaliação anteriores para assegurar que se
  mantém

  competente. Entretanto, se o treinamento ou a avaliação periódicos forem concluídos dentro
  dos

  últimos três meses de validade do treinamento ou da avaliação anteriores, o período de validade
  se

  estende a partir do mês em que o treinamento ou avaliação periódico for concluído até 24
  meses do

  mês de vencimento do treinamento ou avaliação anterior.'
