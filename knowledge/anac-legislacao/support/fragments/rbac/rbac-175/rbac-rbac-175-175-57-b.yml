cite: 175.57(b)
title: 175.57(b)
text: '(b) Registros de treinamento e avaliação devem ser armazenados pelo empregador por
  um período

  mínimo de 36 meses a partir do mês de conclusão do treinamento ou avaliação mais recente
  e, quando

  requeridos, devem ser disponibilizados ao funcionário e à ANAC.'
