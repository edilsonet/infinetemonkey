cite: 175.59(a)
title: 175.59(a)
text: '(a) Exceto se de outra forma estabelecido pela ANAC, os instrutores de treinamentos
  de artigos

  perigosos iniciais e periódicos devem demonstrar competência, ou ser avaliados como competentes,

  na instrução e na(s) função(ões) para a(s) qual(is) irão ministrar instrução antes de ministrarem
  essa

  instrução.'
