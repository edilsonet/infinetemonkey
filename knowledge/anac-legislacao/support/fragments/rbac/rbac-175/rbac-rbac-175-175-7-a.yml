subsection_id: a
cite: 175.7(a)
title: 175.7(a)
text: '(a) Os artigos perigosos aqui descritos estão proibidos para o transporte por aeronaves,
  exceto se

  transportados sob autorização especial dos países interessados, segundo previsto em 175.1(d),
  ou

  exceto se nas disposições deste Regulamento ou de Instrução Suplementar for indicado que
  podem

  ser transportados mediante uma aprovação outorgada pelos países interessados:

  (1) artigos perigosos cujo transporte aparece como proibido em circunstâncias normais neste

  Regulamento ou em Instrução Suplementar; e

  (2) animais vivos infectados.'
