section_title: Artigos perigosos proibidos para transporte por via aérea sob quaisquer circunstâncias
subsection_id: a
cite: 175.9(a)
title: 175.9(a)
text: '(a) Qualquer objeto ou substância que, na forma apresentada para transporte, for suscetível
  a

  explodir, reagir perigosamente, produzir chama ou evolução perigosa de calor ou emissão
  perigosa

  de gases ou vapores tóxicos, corrosivos ou inflamáveis, sob condições normalmente encontradas
  no

  transporte, não pode ser transportado sob quaisquer circunstâncias em aeronaves.'
