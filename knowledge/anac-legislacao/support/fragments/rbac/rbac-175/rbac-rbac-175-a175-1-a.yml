cite: A175.1(a)
title: A175.1(a)
text: '(a) As violações ao previsto neste Regulamento sujeitam o infrator às providências
  administrativas

  constantes no Art. 289 do Código Brasileiro de Aeronáutica, Lei nº 7.565, de 19 de dezembro
  de

  1986, a serem apuradas em conformidade com o procedimento descrito na Resolução nº 472,
  de 2018,

  ou em outro normativo que a substituir, adotando-se para as infrações praticadas os valores
  de multa

  previstos na Tabela 1 deste Apêndice.'
