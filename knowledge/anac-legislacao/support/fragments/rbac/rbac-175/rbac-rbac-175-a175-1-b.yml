title: A175.1(b)
text: '(b) A Tabela 1 apresenta as infrações relacionadas ao transporte de artigos perigosos.
  Essa tabela

  especifica a referência deste Regulamento com os valores das infrações praticadas e a respectiva

  incidência da sanção.

  (1) Em caso de infração cometida a qualquer requisito deste Regulamento serão aplicados
  os

  valores e a incidência da sanção conforme a respectiva referência. Por exemplo, uma infração
  ao

  requisito 175.257(b)(4) está sujeita aos valores e à incidência da sanção da referência
  175.257 da

  Tabela 1.

  (2) Algumas referências da Tabela 1 possuem mais de um valor e de uma incidência da sanção,

  por exemplo 175.11(c), 175.53 etc. Dessa forma, a infração deve ser correspondente ao

  descumprimento do requisito que mais se enquadra na descrição apresentada na referência.

  Tabela 1: Infrações relacionadas ao transporte de artigos perigosos

  Referência

  Descrição

  Valores em reais

  Incidência da sanção

  Mínimo

  Intermediário

  Máximo

  SUBPARTE A - ESCOPO E APLICABILIDADE'
