title: 183.1(a)
text: '(a) Este regulamento especifica, para os fins do §1º do art. 8º, da Lei nº 11.182,
  de 27 de setembro

  de 2005, os requisitos para o credenciamento de pessoas de notória especialização para a
  expedição

  de laudos, pareceres ou relatórios que demonstrem o cumprimento dos requisitos necessários
  à

  emissão de certificados ou atestados relativos às atividades de competência da ANAC. A ANAC
  pode

  credenciar pessoas físicas vinculadas a um detentor de certificado emitido pela ANAC, pessoas
  físicas

  autônomas e pessoas jurídicas.'
