title: 183.1(c)
text: '(c) Cabe ao requerente completar todos os ensaios, inspeções ou qualquer tipo de demonstração

  necessária para satisfazer aos requisitos aplicáveis dos RBAC ou dos RBHA. Para todos os
  fins legais

  cabíveis, a documentação apresentada pelo requerente à ANAC, ainda que contenha laudos,
  pareceres

  e relatórios de credenciados, é de integral responsabilidade do requerente.'
