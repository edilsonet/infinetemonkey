title: 183.1(e)
text: '(e) Todos os laudos, pareceres e relatórios constituem subsídios de verificação de
  cumprimento de

  requisitos a serem considerados pela ANAC para a emissão de certificados ou atestados de
  sua

  competência. A ANAC poderá aceitar ou não o laudo, parecer ou relatório, ou mesmo solicitar
  novo

  laudo, parecer ou relatório de outro credenciado sobre o mesmo assunto, para dirimir quaisquer

  dúvidas.'
