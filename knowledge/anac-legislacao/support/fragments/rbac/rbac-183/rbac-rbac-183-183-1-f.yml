title: 183.1(f)
text: '(f) Este regulamento delimita, também, as faculdades decorrentes do credenciamento
  e os

  requisitos para o seu exercício, como segue:

  (1) pessoas físicas, de acordo com a subparte B e C deste regulamento; e

  (2) pessoas jurídicas, de acordo com as subpartes D e E deste regulamento. (Redação dada
  pela

  Resolução nº 477, de 07.06.2018)


  Data da emissão: 8 de junho de 2018


  SUBPARTE B

  CREDENCIAMENTO DE PESSOA FÍSICA'
