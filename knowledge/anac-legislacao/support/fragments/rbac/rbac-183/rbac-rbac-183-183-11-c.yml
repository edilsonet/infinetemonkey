title: 183.11(c)
text: '(c) Em relação a profissionais com qualificação em projeto de produto e fabricação:

  (1) a ANAC poderá credenciar profissional qualificado em projeto;

  (2) a ANAC poderá credenciar profissional qualificado em fabricação;'
