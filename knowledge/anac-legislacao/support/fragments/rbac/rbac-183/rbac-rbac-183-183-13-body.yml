title: Emissão e condições do credenciamento
text: '183.13 Emissão e condições do credenciamento

  O credenciamento será efetuado mediante solicitação por escrito do interessado, que deverá

  apresentar declaração sobre sua qualificação e documentação que a comprove. Uma autorização
  será

  emitida por meio de ato do titular do órgão competente, conforme disposto no Regimento Interno
  da

  ANAC, para cada pessoa física selecionada segundo a seção 183.11 deste RBAC. A autorização

  especificará os tipos de credenciamento que foram deferidos, possíveis limitações, bem como
  os

  respectivos prazos de validade.'
