cite: 183.15(b)
title: 183.15(b)
text: '(b) Um credenciamento pode ser cancelado:

  (1) mediante pedido escrito da pessoa física credenciada;

  (2) mediante pedido escrito do empregador, nos casos em que sua recomendação tenha sido

  exigida pela ANAC para o credenciamento;

  (3) em decorrência do término do vínculo empregatício da pessoa física credenciada, nos
  casos

  em que a recomendação do empregador tenha sido exigida pela ANAC para o credenciamento;

  (4) por decisão motivada, quando a ANAC constatar que a pessoa física credenciada não

  desempenhou adequadamente as atividades, conforme procedimentos e limitações definidos pela

  ANAC, ou em violação a algum requisito deste regulamento;

  (5) quando a ANAC constatar que as funções desta pessoa física credenciada não são mais

  necessárias; ou

  (6) por decisão motivada da ANAC, para preservar o interesse público.'
