title: Profissionais credenciados em exames de saúde periciais
text: '183.21 Profissionais credenciados em exames de saúde periciais

  O profissional credenciado em exames de saúde periciais pode, sob a supervisão geral da
  ANAC e

  atuando dentro dos limites de credenciamento e conforme critérios e procedimentos estabelecidos

  pela ANAC, expedir relatórios, laudos ou pareceres, avaliando se o candidato apresenta as
  condições

  psicofísicas necessárias para a emissão ou renovação de um certificado médico aeronáutico
  (CMA),

  em conformidade com o RBAC nº 67.

  (Redação dada pela Resolução nº 477, de 07.06.2018)'
