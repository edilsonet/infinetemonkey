title: Profissionais credenciados em exames de proficiência de tripulante de voo ou de cabine
text: '183.23 Profissionais credenciados em exames de proficiência de tripulante de voo ou
  de cabine

  O profissional credenciado em exames de proficiência de tripulante de voo ou de cabine pode,
  sob a

  supervisão geral da ANAC, dentro dos limites de credenciamento e conforme critérios e

  procedimentos estabelecidos pela ANAC, expedir relatórios, laudos ou pareceres, avaliando
  se o

  candidato apresenta as condições mínimas necessárias para a emissão ou renovação de um certificado

  de habilitação técnica, conforme o previsto no RBAC nº 61, no RBAC nº 121, no RBAC nº 135,
  no

  (Redação dada pela Resolução nº 477, de 07.06.2018)'
