title: Profissional credenciado em exames de pessoal técnico
text: '183.25 Profissional credenciado em exames de pessoal técnico

  O profissional credenciado em exames de pessoal técnico pode, sob a supervisão geral da
  ANAC,

  dentro dos limites de credenciamento e conforme critérios e procedimentos estabelecidos
  pela ANAC,

  expedir relatórios, laudos ou pareceres, avaliando se o candidato apresenta as condições
  mínimas

  necessárias para a emissão ou renovação de certificado, conforme o RBHA 65 ou RBAC que venha

  a substituí-lo.'
