title: 183.29(f)
text: '(f) como profissional credenciado em hélices, expedir relatórios, laudos ou pareceres,
  avaliando

  se o projeto ou suas modificações cumprem com os requisitos relacionados com o projeto e
  o

  desempenho operacional de hélices para uso aeronáutico;'
