text: '(h) como piloto credenciado em ensaios em voo: expedir relatórios, laudos ou pareceres,
  avaliando

  se o projeto de tipo ou suas modificações cumprem com os requisitos relacionados com aspectos
  de

  pilotagem (tais como carga de trabalho, adequabilidade operacional, ergonomia e aspectos

  qualitativos de pilotagem);'
