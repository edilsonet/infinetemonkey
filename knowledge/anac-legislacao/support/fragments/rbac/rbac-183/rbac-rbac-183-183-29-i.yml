title: 183.29(i)
text: '(i) como profissional credenciado em acústica: expedir relatórios, laudos ou pareceres,
  avaliando

  se o projeto ou suas modificações cumprem com os requisitos relacionados com o nível de
  ruído

  produzido por aeronaves em certas fases de voo;'
