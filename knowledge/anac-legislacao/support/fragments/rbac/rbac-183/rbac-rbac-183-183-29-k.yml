title: 183.29(k)
text: '(k) como profissional credenciado em interiores, expedir relatórios, laudos ou pareceres,
  avaliando

  se o projeto ou suas modificações cumprem com os requisitos relacionados com a proteção
  dos

  ocupantes em caso de pouso forçado e outras condições de emergência no solo ou na água.'
