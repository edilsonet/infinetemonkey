title: 183.31(b)
text: '(b) expedir relatórios, laudos ou pareceres necessários para avaliar se:

  (1) protótipos e peças estão em conformidade com as especificações de projeto; e

  (2) produtos aeronáuticos e peças estão em conformidade com o projeto de tipo aprovado e
  em

  condições para operação segura.'
