cite: 183.41(a)
title: 183.41(a)
text: '(a) Esta subparte contém os requisitos para credenciamento de pessoa jurídica. Este

  credenciamento autoriza o seu detentor a realizar atividades determinadas nas áreas de projeto,

  fabricação, aeronavegabilidade, manutenção, exames de saúde periciais, proficiência linguística
  e

  técnica, ou cadastros da aviação civil. (Redação dada pela Resolução nº 477, de 07.06.2018)'
