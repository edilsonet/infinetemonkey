cite: 183.41(b)
title: 183.41(b)
text: '(b) Definições. Para a finalidade desta subparte:

  (1) credenciamento de pessoa jurídica é a autorização para que esta realize atividades

  determinadas para as finalidades deste regulamento;

  (2) detentor de credenciamento de pessoa jurídica é a pessoa jurídica que obtém a autorização

  da área correspondente da ANAC, por meio de documento apropriado; e

  (3) unidade executiva é um grupo dedicado, identificado na estrutura organizacional do detentor

  de credenciamento de pessoa jurídica, formado por duas ou mais pessoas físicas, para realizar
  as

  atividades autorizadas pela ANAC.'
