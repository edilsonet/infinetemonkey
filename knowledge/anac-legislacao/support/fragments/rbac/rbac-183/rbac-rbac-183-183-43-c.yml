title: 183.43(c)
text: '(c) Na portaria de credenciamento constarão expressamente todas as prerrogativas e
  limitações

  atribuídas a cada associação credenciada, tais como as licenças e habilitações que estão
  aptas a

  fornecer instrução e examinar, bem como os procedimentos de cadastros que poderão executar.

  (1) Para as instruções teóricas ou práticas que a associação credenciada estiver habilitada
  a

  fornecer pela portaria de credenciamento, não será necessária a aprovação dos cursos pela
  ANAC.'
