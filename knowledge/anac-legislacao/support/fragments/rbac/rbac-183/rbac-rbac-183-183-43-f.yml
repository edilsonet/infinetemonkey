text: '(f) A ANAC divulgará em sua página na rede mundial de computadores, para consulta por

  qualquer interessado, a listagem completa de todas as associações credenciadas pela ANAC,
  com

  nome, código e número da portaria de credenciamento, bem como suas prerrogativas e limitações.'
