cite: 183.51(b)
title: 183.51(b)
text: '(b) pessoal especializado, nas áreas de projeto, fabricação, ensaios em voo, inspeção,
  manutenção,

  exames de saúde periciais ou proficiência linguística que tenham experiência em verificar
  o

  cumprimento com os regulamentos necessários para emissão de certificados ou suas emendas,

  aprovações, em determinar conformidade e/ou em determinar aeronavegabilidade, para as atividades

  objeto do credenciamento; e (Redação dada pela Resolução nº 477, de 07.06.2018)'
