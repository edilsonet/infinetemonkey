cite: 183.53(c)
title: 183.53(c)
text: '(c) conter o seguinte:

  (1) as atividades autorizadas e as limitações aplicáveis;

  (2) os procedimentos para realizar as atividades autorizadas;

  (3) descrição da estrutura organizacional e responsabilidades do detentor do credenciamento
  de

  pessoa jurídica e de sua unidade executiva;

  (4) descrição das instalações onde as atividades autorizadas são efetuadas;

  (5) um processo e um procedimento para as auditorias periódicas a serem efetuadas na unidade

  executiva e em seus procedimentos, pelo detentor do credenciamento de pessoa jurídica;

  (6) os procedimentos descrevendo as ações requeridas baseadas nos resultados de auditorias,

  incluindo a documentação correspondente a todas as ações corretivas;

  (7) os procedimentos de comunicação com os órgãos da ANAC responsáveis pela

  administração do credenciamento;

  (8) os procedimentos para aquisição e atualização do material interpretativo e regulatório

  correspondente a cada uma das atividades autorizadas;


  Data da emissão: 8 de junho de 2018


  (9) os requisitos de treinamento para o pessoal da unidade executiva;

  (10) os procedimentos e requisitos de arquivamento e apresentação dos registros

  correspondentes às atividades autorizadas;

  (11) uma descrição de cada cargo da unidade executiva e o conhecimento e experiência

  requeridos para cada cargo;

  (12) os procedimentos para designar os membros da unidade executiva e os meios de

  documentar seus dados cadastrais, de acordo com o parágrafo 183.61(a)(4) deste regulamento;

  (13) os procedimentos para realizar as atividades requeridas pelas seções 183.63 e 183.65
  deste

  regulamento;

  (14) os procedimentos para revisões do manual, conforme parágrafo (b) desta seção; e

  (15) quaisquer outras informações requeridas pela ANAC, necessárias para supervisionar o

  detentor do credenciamento de pessoa jurídica no desempenho das atividades autorizadas.'
