cite: 183.55(a)
title: 183.55(a)
text: '(a) Se ocorrer uma alteração que possa afetar a qualificação ou capacidade da unidade
  executiva

  de realizar uma atividade autorizada (tal como mudança na localização das instalações, recursos,

  pessoal, ou estrutura organizacional), nenhum membro da unidade executiva poderá realizar
  tal

  atividade até que a ANAC seja notificada e que a alteração seja aprovada e documentada como

  requerido pelo manual de procedimento.'
