title: 183.55(b)
text: '(b) A unidade executiva, ao expedir parecer, laudo ou relatório necessários para a
  emissão de

  certificados ou aprovações, deverá manter contato com a ANAC para assegurar que exigências

  adicionais formuladas pela ANAC sejam atendidas antes da emissão desses certificados ou

  aprovações.'
