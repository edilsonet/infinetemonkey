title: Inspeções
text: '183.59 Inspeções


  Data da emissão: 8 de junho de 2018


  A ANAC, a seu critério, poderá a qualquer tempo e por qualquer razão inspecionar as instalações,

  produtos, componentes, peças, equipamentos, procedimentos, operações, e registros associados
  às

  atividades autorizadas ou requeridas pelo detentor do credenciamento de pessoa jurídica.'
