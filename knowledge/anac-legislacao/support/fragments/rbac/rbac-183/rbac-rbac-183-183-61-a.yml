title: 183.61(a)
text: '(a) Cada detentor de credenciamento de pessoa jurídica deve assegurar que os seguintes
  registros

  serão mantidos durante a validade do credenciamento:

  (1) [Reservado]

  (2) para qualquer parecer, laudo ou relatório expedido por um membro da unidade executiva

  necessário para a emissão de certificados ou aprovações:'
