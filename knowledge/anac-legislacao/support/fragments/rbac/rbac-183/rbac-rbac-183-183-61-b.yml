title: 183.61(b)
text: '(b) Cada detentor de credenciamento de pessoa jurídica deve assegurar que os seguintes
  registros

  serão mantidos por (5) cinco anos:

  (1) um registro de cada auditoria periódica e as correspondentes ações corretivas resultantes;
  e

  (2) um registro de qualquer dificuldade em serviço associada aos certificados e aprovações

  emitidos pela ANAC baseados em parecer, laudo ou relatório expedido por um membro da unidade

  executiva.'
