title: 183.61(d)
text: '(d) Para todos os registros cujo arquivamento é requerido por esta seção, o detentor
  de

  credenciamento de pessoa jurídica deve:

  (1) assegurar que todos os registros e dados estejam disponíveis para inspeção da ANAC a

  qualquer momento; e

  (2) entregar todos os registros e dados à ANAC após a desistência ou cancelamento do

  credenciamento.


  Data da emissão: 8 de junho de 2018'
