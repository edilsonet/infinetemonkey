cite: 183.61(i)
title: 183.61(i)
text: '(i) o requerimento e os dados exigidos pelo regulamento para obter o certificado ou

  aprovação; e

  (ii) os dados e registros documentando as avaliações de cumprimento com os requisitos

  feitos pelos membros da unidade executiva.

  (3) uma lista dos produtos, componentes, peças, ou equipamentos para os quais um membro
  da

  unidade executiva expediu um parecer, laudo ou relatório, necessário para a emissão de certificados

  ou aprovações;

  (4) os nomes, responsabilidades, qualificações e exemplo de assinatura (ou processo

  equivalente) de cada membro da unidade executiva que efetue uma atividade autorizada;

  (5) uma cópia de cada manual aprovado ou aceito pela unidade executiva, incluindo o histórico

  de modificações;

  (6) registros dos treinamentos realizados pelos membros da unidade executiva e

  administradores do credenciamento de pessoa jurídica;

  (7) qualquer outro registro especificado no manual de procedimentos do detentor do

  credenciamento de pessoa jurídica; e

  (8) o manual de procedimentos requerido pela seção 183.53 deste regulamento, incluindo todas

  as modificações;'
