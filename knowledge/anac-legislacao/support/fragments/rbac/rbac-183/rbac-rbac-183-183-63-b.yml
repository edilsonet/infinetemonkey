section_title: 'Requisitos de aeronavegabilidade continuada: produtos, peças ou dispositivos'
subsection_id: b
cite: 183.63(b)
title: 183.63(b)
text: '(b) notificar a ANAC de que:

  (1) uma condição em um produto, peça ou dispositivo, pode resultar em uma determinação de

  condição insegura por parte da ANAC; ou

  (2) um produto, peça ou dispositivo, para os quais o detentor de credenciamento de pessoa

  jurídica obteve aprovação, não cumpre com os requisitos de aeronavegabilidade aplicáveis.'
