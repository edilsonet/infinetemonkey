cite: 183.67(c)
title: 183.67(c)
text: '(c) A ANAC pode cancelar ou suspender temporariamente um credenciamento de pessoa jurídica

  em decisão motivada, incluindo os casos em que:

  (1) o detentor do credenciamento de pessoa jurídica tenha requerido por escrito a suspensão
  ou

  cancelamento;

  (2) o detentor do credenciamento de pessoa jurídica não tenha desempenhado suas atividades

  adequadamente;


  Data da emissão: 8 de junho de 2018


  (3) a ANAC considerar que o credenciamento, de acordo com este regulamento, não é mais

  necessário; ou

  (4) o detentor de credenciamento de pessoa jurídica não atender as qualificações requeridas

  para realizar as atividades autorizadas.


  Data da emissão: 8 de junho de 2018


  SUBPARTE E

  CREDENCIAMENTO DE ASSOCIAÇÕES AERODESPORTIVAS'
