cite: 183.71(a)
title: 183.71(a)
text: '(a) Esta subparte contém os requisitos para credenciamento de associações aerodesportivas,
  que

  terão a atribuição de:

  (1) ministrar instrução prática de voo;

  (2) realizar os exames de saúde periciais para obtenção de um CMA de 4a Classe emitido

  segundo o RBAC nº 67;

  (3) aplicar exames teóricos e de proficiência em pilotos para averiguar o cumprimento dos

  requisitos para a concessão, revalidação ou convalidação do certificado de piloto aerodesportivo,

  licença de piloto de planador e licença de piloto de balão livre, previstos no RBAC nº 61;
  e/ou

  (4) efetuar o cadastro junto à ANAC dos aerodesportistas e das aeronaves, regidas pelo RBAC

  nº 103.'
