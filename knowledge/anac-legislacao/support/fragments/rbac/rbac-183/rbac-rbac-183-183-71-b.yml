title: 183.71(b)
text: '(b) O disposto nesta subparte não se aplica aos instrutores ou examinadores credenciados

  vinculados às escolas de aviação civil e aos aeroclubes, nem aos médicos ou clínicas médicas

  credenciadas segundo o RBAC nº 67, cujos processos de credenciamento seguem regramento próprio.'
