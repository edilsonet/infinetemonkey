cite: 183.71(c)
title: 183.71(c)
text: '(c) Definições. Para a finalidade desta subparte:

  (1) aerodesportista significa o praticante das atividades desportivas regidas pelo RBAC
  nº

  103;

  (2) associação credenciada significa a pessoa jurídica aprovada e designada pela ANAC para

  cumprimento das prerrogativas previstas em sua portaria de credenciamento;

  (3) examinando significa a pessoa sendo submetida à avaliação para a concessão, revalidação

  ou convalidação das licenças, habilitações ou certificados previstos no RBAC nº 61;

  (4) portaria de credenciamento significa o ato formal, emitido pela ANAC, que credencia
  as

  associações, estabelece expressamente todas as prerrogativas e limitações aplicáveis, e
  define o prazo

  de validade do credenciamento; e

  (5) reincidência significa a prática de descumprimento de algum dispositivo deste regulamento

  ocorrida após notificação oficial por parte da ANAC referente à prática anterior da conduta

  infracional.'
