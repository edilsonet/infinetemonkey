title: 183.73(a)
text: '(a) Serão consideradas aptas ao credenciamento junto à ANAC as associações que cumprirem

  todos os seguintes requisitos:

  (1) associações aerodesportivas que reúnam, no mínimo, 500 sócios ativos, com exceção das

  associações de praticantes de balonismo (balão livre tripulado) e voo a vela em planadores
  e

  motoplanadores, que poderão reunir, no mínimo, 100 sócios ativos, devidamente comprovados
  por

  meio de documentação válida;


  Data da emissão: 8 de junho de 2018


  (2) associações aerodesportivas que tenham sido constituídas há pelo menos 5 (cinco) anos,

  cuja diretoria técnica seja formada por pelo menos uma pessoa com experiência mínima comprovada

  de 10 (dez) anos de prática da atividade em cada modalidade abarcada pela associação, sendo
  vedada

  a participação de pessoas enquadradas na hipótese do parágrafo 183.75(c) deste Regulamento;

  (3) associações aerodesportivas que demonstrem dispor de estrutura mínima que inclua:'
