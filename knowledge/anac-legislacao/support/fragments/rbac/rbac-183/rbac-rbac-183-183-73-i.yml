title: 183.73(i)
text: '(i) sede;

  (ii) estatuto da associação, especificando a abrangência geográfica, as modalidades

  aerodesportivas a que se relaciona e os critérios técnicos de associação impostos aos membros;
  e

  (iii) website próprio onde constem de forma destacada links para a página de aerodesportos

  do portal da ANAC e do DECEA; e

  (4) apresentação, no ato da candidatura, do requerimento conforme o estabelecido na seção'
