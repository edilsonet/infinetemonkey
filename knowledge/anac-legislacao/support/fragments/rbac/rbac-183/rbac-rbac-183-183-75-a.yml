cite: 183.75(a)
title: 183.75(a)
text: '(a) Para ministrar instruções e aplicar os exames requeridos pela ANAC, as associações
  somente

  poderão utilizar pessoas que atendam os seguintes requisitos mínimos:

  (1) ser brasileiro nato ou naturalizado;

  (2) possuir CMA válido e adequado a cada uma das licenças, certificados e habilitações que

  deverão ser examinadas; e

  (3) possuir as licenças e habilitações compatíveis com a instrução que ministrará e/ou os
  exames

  que aplicará.


  Data da emissão: 8 de junho de 2018'
