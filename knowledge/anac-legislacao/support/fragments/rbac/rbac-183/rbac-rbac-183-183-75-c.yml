section_title: Utilização de examinadores e instrutores pelas associações
subsection_id: c
cite: 183.75(c)
title: 183.75(c)
text: '(c) A associação credenciada não pode utilizar para instrução e exames requeridos pela
  ANAC

  pessoas que possuam, nos últimos 5 (cinco) anos a contar da solicitação, decisão administrativa

  transitada em julgado de aplicação de sanção por descumprimento a preceitos contidos na
  Lei nº

  7.565, de 19 de dezembro de 1986, que dispõe sobre o Código Brasileiro de Aeronáutica.'
