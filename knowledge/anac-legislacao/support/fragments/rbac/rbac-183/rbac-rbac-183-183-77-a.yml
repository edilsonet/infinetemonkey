cite: 183.77(a)
title: 183.77(a)
text: '(a) É vedado à associação credenciada exercer suas prerrogativas nas seguintes hipóteses:

  (1) durante o prazo de suspensão de seu credenciamento;

  (2) em desacordo com a respectiva portaria de credenciamento; ou

  (3) com prática de abuso de poder econômico que impeça o acesso ao desporto de indivíduos

  não associados.'
