cite: 183.77(b)
title: 183.77(b)
text: '(b) É responsabilidade da associação credenciada controlar a validade do CMA e das
  habilitações

  dos instrutores e examinadores a ela vinculados, bem como vedar a esses instrutores e examinadores

  o exercício das prerrogativas relacionadas com as atividades credenciadas nas seguintes
  hipóteses:

  (1) após expirado o prazo de validade de seu CMA;

  (2) após expirado o prazo de validade das habilitações pertinentes às atividades para as
  quais

  se encontra credenciado, ressalvado o prazo previsto no parágrafo 61.33(b) do RBAC nº 61;
  ou

  (3) durante o prazo de suspensão de sua licença, habilitação ou CMA.'
