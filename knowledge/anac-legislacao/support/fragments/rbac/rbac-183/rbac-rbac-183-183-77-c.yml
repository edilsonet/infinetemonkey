title: 183.77(c)
text: '(c) A data e forma do pagamento da remuneração, se houver, relativa à prestação de
  serviços

  conforme prerrogativas estabelecidas na portaria de credenciamento, deverão ser acordadas

  diretamente entre a associação e o particular, sem a intermediação da ANAC.'
