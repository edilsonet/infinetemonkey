cite: 183.79(a)
title: 183.79(a)
text: '(a) A associação somente poderá realizar os cadastros, as instruções e os exames para
  os quais

  tiver sido previamente credenciada pela ANAC.

  (1) Serão considerados nulos os cadastros, exames ou instruções realizados em

  desconformidade com este regulamento ou com a portaria de credenciamento.'
