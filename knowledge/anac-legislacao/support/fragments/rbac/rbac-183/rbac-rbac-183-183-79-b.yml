title: 183.79(b)
text: '(b) A associação deverá notificar à ANAC o resultado do exame dentro do prazo estabelecido
  no

  manual de procedimentos aprovado, juntamente com toda a documentação pertinente para a

  concessão, revalidação ou convalidação dos certificados, licenças e habilitações previstos
  no

  parágrafo 183.71(a) deste regulamento.'
