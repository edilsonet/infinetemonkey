cite: 183.79(c)
title: 183.79(c)
text: '(c) A associação credenciada deverá manter, enquanto durar seu credenciamento, ou até
  que o seu

  descarte seja autorizado pela ANAC, uma cópia legível, física ou digital, da Ficha de Avaliação
  de

  Piloto (FAP), assinada pelo examinando, assim como encaminhá-la para a ANAC, caso solicitado.

  (1) Caso o examinando se recuse a assinar a FAP, o examinador deverá registrar o fato no

  campo de comentários da FAP.'
