cite: 183.79(d)
title: 183.79(d)
text: '(d) A associação credenciada ficará responsável pela prestação do serviço de cadastro
  de

  aerodesportistas regidos pelo RBAC nº 103 no site da ANAC.


  Data da emissão: 8 de junho de 2018


  (1) A associação só poderá cadastrar o aerodesportista dentro das categorias autorizadas
  e sob

  as condições expressas na portaria de credenciamento.

  (2) A associação é responsável pela verificação dos dados incluídos no sistema relativos
  à

  identificação do aerodesportista e relativo ao cumprimento do parágrafo 103.7(a)(1) do RBAC
  nº

  103.'
