cite: 183.79(e)
title: 183.79(e)
text: '(e) A associação ficará responsável pela prestação do serviço de cadastro de ultraleves
  motorizados

  e balões livres tripulados regidos pelo RBAC nº 103 no site da ANAC.

  (1) A associação poderá cadastrar balões livres tripulados e os ultraleves motorizados desde

  que comprovada a aplicabilidade do parágrafo 103.1 do RBAC nº 103.

  (2) A associação é responsável pela verificação dos dados incluídos no sistema relativos
  à

  identificação do operador e da aeronave.'
