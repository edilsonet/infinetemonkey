cite: 183.81(a)
title: 183.81(a)
text: '(a) Todas as atividades realizadas pela associação credenciada no exercício de suas
  atribuições

  poderão ser acompanhadas e fiscalizadas pela ANAC, presencialmente ou posteriormente à

  realização do exame, com ou sem aviso prévio.

  (1) A ANAC poderá anular exames realizados em desconformidade com os critérios técnicos,

  independentemente de outras providências aplicáveis.'
