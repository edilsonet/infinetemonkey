cite: 183.81(c)
title: 183.81(c)
text: '(c) Em caso de indisponibilidade temporária de pessoa, local ou meio vinculados à associação,

  esta apresentará, no prazo de 5 (cinco) dias úteis após ser notificada digitalmente, justificativa
  à

  indisponibilidade e propostas contendo datas, horários e locais para que a ANAC possa dar

  continuidade às ações de acompanhamento ou fiscalização em prazo não superior a 15 (quinze)
  dias

  úteis.'
