cite: 183.83(b)
title: 183.83(b)
text: '(b) Para obter o descredenciamento a pedido, a associação deve encaminhar à ANAC solicitação

  de descredenciamento por escrito.

  (1) O pedido de descredenciamento não desonera o cumprimento do disposto neste regulamento

  para os exames já realizados.

  (2) A associação deverá informar à ANAC se realizará cadastros, instruções e exames entre
  a

  data do pedido de descredenciamento e a da publicação do ato de descredenciamento.'
