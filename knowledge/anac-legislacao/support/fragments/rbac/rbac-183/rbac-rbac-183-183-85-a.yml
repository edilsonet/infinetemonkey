cite: 183.85(a)
title: 183.85(a)
text: '(a) A associação credenciada será notificada para que apresente medidas de apuração
  e, caso

  cabível, de punição aos associados, funcionários e/ou dirigentes envolvidos nos fatos denunciados
  na

  ocorrência de qualquer das ações ou omissões:

  (1) aplicar exames em desacordo com os critérios estabelecidos pela ANAC;

  (2) realizar cadastro de aerodesportistas, ultraleves motorizados ou balões livres tripulados
  em

  desacordo com os regulamentos e critérios estabelecidos pela ANAC;

  (3) tratar reiteradamente os examinandos, os servidores da ANAC ou o público em geral de

  maneira grosseira ou desatenciosa;

  (4) deixar de notificar a ANAC o resultado do exame no prazo estabelecido no parágrafo

  183.79(b) deste regulamento.

  (5) deixar de reter cópia legível, física ou digital, da FAP, assinada pelo examinando ou
  com a

  devida justificativa pela falta da assinatura, ou se negar a encaminhá-la para a ANAC, caso
  solicitado;

  (6) negar, sem razão técnica, a prestar os serviços para os quais está credenciada, a pessoas
  não

  associadas, mediante remuneração justa e adequada; ou

  (7) exigir valor não isonômico ou desproporcional para prestar os serviços para os quais
  está

  credenciada e que configure abuso de poder econômico.'
