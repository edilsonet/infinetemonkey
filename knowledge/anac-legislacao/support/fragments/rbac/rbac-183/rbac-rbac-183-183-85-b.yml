title: 183.85(b)
text: '(b) Caso seja evidenciado a participação intencional ou conivência da associação em
  quaisquer

  das ações ou omissões listadas no parágrafo (a) desta seção, o credenciamento será suspenso
  até que

  sejam afastadas das atividades ligadas ao credenciamento as pessoas responsáveis, podendo
  ser a

  associação descredenciada caso opte por não afastar as referidas pessoas.'
