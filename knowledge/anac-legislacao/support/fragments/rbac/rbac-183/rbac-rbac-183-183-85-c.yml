title: 183.85(c)
text: '(c) O credenciamento da associação será suspenso, até que sejam afastadas das atividades
  ligadas

  ao credenciamento, as pessoas responsáveis, podendo ser a associação descredenciada caso
  opte por

  não afastar as referidas pessoas, se:

  (1) houver reincidência de descumprimento dos dispositivos elencados no parágrafo (a) desta

  seção;

  (2) exercer suas prerrogativas:'
