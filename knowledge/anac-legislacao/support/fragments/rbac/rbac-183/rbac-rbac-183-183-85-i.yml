text: '(i) durante o prazo de suspensão de seu credenciamento; ou

  (ii) em desacordo com a respectiva portaria de credenciamento.

  (3) delegar as atribuições decorrentes da portaria de credenciamento a terceiros;

  (4) valer-se da função para obter ou tentar obter vantagens para si ou para terceiros;

  (5) anunciar, sugerir ou permitir aos examinandos se utilizarem de métodos ilícitos para
  a

  aprovação nos exames;

  (6) fornecer informações falsas, negar-se a prestar informações quando requerido ou obstar
  a

  fiscalização da ANAC;

  (7) tiver conduta inidônea em seu relacionamento com a administração pública ou com o

  público em geral; ou


  Data da emissão: 8 de junho de 2018


  (8) impedir o acesso dos servidores designados da ANAC a quaisquer das fases do exame de

  proficiência ou a qualquer documento a ele relacionado.'
