title: 21.101(g)
text: '(g) Não obstante o parágrafo (b) desta seção, o requerente deve demonstrar cumprimento
  com cada requisito aplicável do RBAC 26 para aviões categoria transporte, a menos que o
  requerente tenha optado por ou tenha sido obrigado a cumprir com a emenda do RBAC 25 correspondente
  a cada requisito aplicável do RBAC 26. A referida emenda do RBAC 25 pode ter sido emitida
  na mesma data ou posteriormente à emenda correspondente a cada requisito aplicável do RBAC
  26.

  SUBPARTE E

  CERTIFICADO SUPLEMENTAR DE TIPO'
