section_title: Determinação dos requisitos aplicáveis
subsection_id: i
cite: 21.101(i)
title: 21.101(i)
text: '(i) a configuração geral ou princípio de construção não são mantidos;

  (ii) as hipóteses adotadas para a certificação do produto a ser modificado não permanecem
  válidas;

  (2) cada área, sistema, componente, equipamento ou aparelho que a ANAC considere não afetado
  pela modificação;

  (3) cada área, sistema, componente, equipamento ou aparelho que é afetado pela modificação,
  para o qual a ANAC considere que o cumprimento com o regulamento mencionado no parágrafo
  (a) desta seção não contribuiria significativamente para o nível de segurança do produto
  modificado ou seria impraticável.'
