section_id: '21.113'
section_title: Requerimento de certificado suplementar de tipo
subsection_id: a
cite: 21.113(a)
title: 21.113(a)
text: (a) Se uma pessoa detém um certificado de tipo para um produto e altera este produto
  pela introdução de uma grande modificação no projeto de tipo, não tão extensa que requeira
  uma nova certificação de tipo conforme o RBAC 21.19, esta pessoa deve submeter à ANAC um
  requerimento para um certificado suplementar de tipo ou para uma emenda ao seu certificado
  de tipo original, conforme a subparte D deste regulamento.
