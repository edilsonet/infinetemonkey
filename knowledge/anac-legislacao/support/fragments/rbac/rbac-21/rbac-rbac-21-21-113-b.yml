section_title: Requerimento de certificado suplementar de tipo
subsection_id: b
cite: 21.113(b)
title: 21.113(b)
text: (b) Se uma pessoa não detém um certificado de tipo para um produto e altera esse produto
  pela introdução de uma grande modificação, não tão extensa que requeira uma nova certificação
  de tipo de acordo com a seção 21.19, esta pessoa deve submeter à ANAC um requerimento para
  um certificado suplementar de tipo.
