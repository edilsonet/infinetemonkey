section_title: Determinação de requisitos aplicáveis
subsection_id: a
cite: 21.115(a)
title: 21.115(a)
text: '(a) O requerente de um certificado suplementar de tipo deve demonstrar que o produto
  alterado cumpre os requisitos aplicáveis especificados na seção 21.101; no caso de uma modificação
  acústica como prevista no parágrafo 21.93(b), demonstrar cumprimento com os requisitos de
  ruído aplicáveis do RBAC 36; no caso de modificações de emissões descritas no parágrafo
  21.93(c), demonstrar cumprimento com os requisitos aplicáveis de drenagem de combustível
  e emissões de motores de aeronaves do RBAC 34; e, no caso de versões derivadas para os propósitos
  de emissões de CO

  2

  descritas no parágrafo 21.93(d)-I, demonstrar cumprimento com os requisitos aplicáveis de
  emissões de CO

  2

  de aviões do RBAC 38. (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
