title: 21.117(a)
text: '(a) O requerente faz jus a um certificado suplementar de tipo, cuja validade será conforme
  o estabelecido na seção 21.51, se a ANAC considerar que o requerente satisfaz às exigências
  das seções 21.113 e 21.115. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
