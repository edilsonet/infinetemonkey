section_title: Localização ou mudança das instalações de fabricação
subsection_id: a
cite: 21.122(a)
title: 21.122(a)
text: (a) Um detentor de certificado de tipo pode utilizar instalações de fabricação localizadas
  fora do Brasil, desde que a ANAC considere ser de interesse público e que tal localização
  não implique em ônus indevidos à ANAC.
