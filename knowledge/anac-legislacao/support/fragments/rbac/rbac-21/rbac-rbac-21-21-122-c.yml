cite: 21.122(c)
title: 21.122(c)
text: '(c) O detentor do certificado de tipo deve notificar imediatamente à ANAC, por escrito,
  qualquer modificação nas instalações de fabricação que possa afetar a inspeção, a conformidade
  ou a aeronavegabilidade do produto ou artigo.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
