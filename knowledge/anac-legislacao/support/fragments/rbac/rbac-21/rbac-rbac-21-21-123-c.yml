title: 21.123(c)
text: (c) manter registros da conclusão de todas as inspeções e testes exigidos pelos parágrafos
  21.127, 21.128 e 21.129 por pelo menos 5 anos para os produtos fabricados sob a aprovação
  e por pelo menos 10 anos para componentes críticos identificados no parágrafo 45.15(c) do
  RBAC 45;
