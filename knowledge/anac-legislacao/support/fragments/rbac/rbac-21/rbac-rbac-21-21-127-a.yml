section_title: 'Ensaios: aeronaves'
subsection_id: a
cite: 21.127(a)
title: 21.127(a)
text: '(a) Cada pessoa que fabrique aeronaves sob um certificado de tipo deve estabelecer
  um procedimento aprovado de ensaios em voo de produção e a ficha de verificação associada,
  e executar um ensaio em voo de produção para cada aeronave produzida, segundo esta ficha
  de verificação. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
