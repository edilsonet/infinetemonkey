title: 'Ensaios: hélices'
text: '21.129 Ensaios: hélices

  Cada pessoa que fabrique hélices sob um certificado de tipo deve executar, em cada hélice
  de passo variável produzida, um ensaio de operação aceitável, a fim de determinar se ela
  opera apropriadamente em toda a faixa normal de operação.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
