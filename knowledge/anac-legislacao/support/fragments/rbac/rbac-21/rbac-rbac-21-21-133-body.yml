text: '21.133 Requerimento

  Cada requerimento para obtenção de um certificado de organização de produção deve ser preenchido
  na forma e com o conteúdo estabelecido pela ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
