text: '21.137 Sistema da qualidade

  Cada requerente ou detentor de um certificado de organização de produção deve estabelecer
  e descrever, por escrito, um sistema da qualidade que garanta que cada produto e artigo
  esteja em conformidade com o seu projeto aprovado e em condição de operação segura. O sistema
