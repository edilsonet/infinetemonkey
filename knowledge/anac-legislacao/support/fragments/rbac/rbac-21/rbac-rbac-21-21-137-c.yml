title: 21.137(c)
text: '(c) controle do fornecedor. Procedimentos que:

  (1) garantam que cada produto, artigo ou serviço fornecido pelo fornecedor estão em conformidade
  com os requisitos do detentor de certificado de organização de produção; e

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (2) exijam que cada fornecedor tenha um processo de reporte ao detentor do certificado de
  organização de produção, para os casos em que um produto, artigo ou serviço, liberado pelo
  fornecedor, tenha sido constatado, posteriormente, como não conforme com os requisitos de
  detentor de certificado de organização de produção.

  (Redação dada pela Resolução nº 495, de 14.11.2018)'
