text: (f) controle de equipamentos de inspeção, medição e teste. Procedimentos para garantir
  a calibração e controle de todos os equipamentos de inspeção, medição e teste utilizados
  na determinação da conformidade de cada produto e artigo com seu projeto aprovado. Cada
  padrão de calibração deve ser rastreável aos padrões aceitos pela ANAC.
