title: 21.137(l)
text: (l) auditorias internas. Procedimentos para o planejamento, realização e documentação
  de auditorias internas para assegurar o cumprimento com o sistema da qualidade aprovado.
  Os procedimentos devem incluir reporte dos resultados de auditoria interna para o gerente
  responsável pela implementação das ações corretivas e preventivas.
