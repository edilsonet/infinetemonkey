title: 21.137(n)
text: '(n) desvios de qualidade (

  quality escapes

  ). Procedimentos para identificar, analisar e iniciar ação corretiva apropriada para produtos
  ou artigos que foram liberados pelo sistema da qualidade e que não estão em conformidade
  com os dados do projeto aplicáveis ou com os requisitos do sistema da qualidade.'
