title: Inspeções e ensaios
text: '21.140 Inspeções e ensaios

  Cada requerente ou detentor de um certificado de organização de produção deve permitir que
  a ANAC inspecione seu sistema da qualidade, instalações, dados técnicos e quaisquer produtos
  ou artigos fabricados e testemunhe quaisquer ensaios, incluindo qualquer inspeção ou ensaios
  nas instalações de fornecedores, necessárias para determinar a conformidade com os RBAC
  aplicáveis.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
