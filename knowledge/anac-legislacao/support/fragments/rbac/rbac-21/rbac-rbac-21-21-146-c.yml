cite: 21.146(c)
title: 21.146(c)
text: '(c) assegurar que cada produto ou artigo completo para o qual tenha sido emitido um
  certificado de organização de produção, incluindo aeronaves da categoria primária montadas
  sob um certificado de organização de produção por outra pessoa a partir de um conjunto fornecido
  pelo detentor do certificado de organização de produção, apresentado para certificação ou
  aprovação de aeronavegabilidade está conforme com o projeto aprovado, em condição segura
  para operação e cumpre com os requisitos de proteção ambiental aplicáveis; (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
