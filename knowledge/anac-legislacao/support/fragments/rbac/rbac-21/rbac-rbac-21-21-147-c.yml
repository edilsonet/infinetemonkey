cite: 21.147(c)
title: 21.147(c)
text: '(c) Um requerente pode solicitar emenda a seu registro de limitação de produção para
  ter a permissão de fabricar e instalar componentes de interface desde que:

  (1) O requerente seja detentor ou tenha uma licença para usar os dados de projeto e de instalação
  para o componente de interface e os disponibilize para a ANAC quando solicitado;

  (2) O requerente fabrique o componente de interface;

  (3) O produto do requerente esteja conforme com seu projeto de tipo aprovado e o componente
  de interface esteja conforme com seu projeto de tipo aprovado;

  (4) O produto montado com o componente de interface instalado esteja em condição de operação
  segura; e

  (5) O requerente cumpra com quaisquer outras condições e limitações que a ANAC considere
  necessária.

  (Redação dada pela Resolução nº 495, de 14.11.2018)'
