cite: 21.17(b)
title: 21.17(b)
text: (b) Para classes especiais de aeronaves (planadores, dirigíveis e outras aeronaves não
  convencionais), incluindo motores e hélices instalados nas mesmas, para as quais não existem
  requisitos de aeronavegabilidade emitidos, são aplicadas partes dos requisitos de aeronavegabilidade
  contidos nos RBAC vigentes que sejam considerados pela ANAC como apropriados para a aeronave
  e aplicáveis ao projeto de tipo em questão, ou outros critérios de aeronavegabilidade considerados
  convenientes para prover um nível de segurança equivalente ao estabelecido pelos referidos
  RBAC.
