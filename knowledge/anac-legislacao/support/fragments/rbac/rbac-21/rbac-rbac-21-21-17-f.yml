cite: 21.17(f)
title: 21.17(f)
text: '(f) Para aeronaves categoria primária, os requisitos são:

  (1) os de aeronavegabilidade aplicáveis contidos nos RBAC 23, 27, 31, 33, 35 ou outros critérios
  de aeronavegabilidade que a ANAC considerar aplic&aacaacute;veis e apropriados ao projeto
  de tipo em questão, proporcionando à aeronave um nível de segurança aceitável; e

  (2) os de ruído do RBAC 36 aplicáveis à aeronave envolvida.'
