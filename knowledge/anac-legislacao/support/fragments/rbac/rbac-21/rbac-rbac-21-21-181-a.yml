title: 21.181(a)
text: '(a) A menos que devolvido por seu detentor, suspenso, cassado ou que um prazo de validade
  tenha sido estabelecido pela ANAC, um certificado de aeronavegabilidade tem duração como
  se segue:

  (1) um certificado de aeronavegabilidade padrão ou um certificado de aeronavegabilidade
  especial, categoria primária ou restrita, é válido pelo período de tempo especificado pela
  ANAC, e desde que a aeronave seja mantida segundo estabelecido no RBAC 43 e no RBHA 91,
  ou RBAC que venha a substituí-lo, conforme aplicável, e enquanto for válido seu certificado
  de matrícula; (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (2) uma autorização especial de voo é válida pelo período de tempo especificado na mesma;

  (3) um certificado de aeronavegabilidade especial, categoria leve esportiva, é válido enquanto:'
