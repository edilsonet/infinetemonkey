cite: 21.181(i)
title: 21.181(i)
text: '(i) a aeronave se enquadrar na definição de aeronave leve esportiva;

  (ii) a aeronave estiver em conformidade com sua configuração original, exceto por aquelas
  alterações realizadas de acordo com as normas aceitas pela ANAC e autorizadas pelo fabricante
  da aeronave ou por uma pessoa aceitável pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (iii) a aeronave não apresentar condição insegura e seja improvável que uma condição insegura
  possa ocorrer; e

  (iv) a aeronave estiver registrada no Brasil;

  (4) um certificado de autorização de voo experimental para os propósitos de pesquisa e desenvolvimento,
  demonstração de cumprimento com requisitos, treinamento de tripulação ou pesquisa de mercado
  é válido por 01 (um) ano após a data de emissão ou renovação, a menos que um período menor
  seja estabelecido pela ANAC. A validade deste certificado para os propósitos de operação
  de aeronave de construção amadora, de exibição, de competição aérea, de categoria primária
  ou de categoria leve esportiva é ilimitada, a menos que a ANAC estabeleça um período específico
  por motivo justificável; e

  (5) um certificado de aeronavegabilidade para aeronave recém-fabricada tem duração limitada
  à entrega da aeronave ao seu primeiro comprador ou operador. A validade do certificado depende,
  ainda, do atendimento aos requisitos de manutenção do RBAC 43 e do RBHA 91, ou RBAC que
  venha a substituí-lo, aplicáveis à aeronave em questão. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
