title: 21.182(a)
text: (a) Cada requerente de um certificado de aeronavegabilidade a ser emitido segundo esta
  subparte deve demonstrar que sua aeronave está identificada de acordo com o estabelecido
  na seção 45.11 do RBAC 45.
