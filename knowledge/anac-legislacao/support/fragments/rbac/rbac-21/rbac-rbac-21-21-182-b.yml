title: 21.182(b)
text: '(b) O parágrafo (a) desta seção não se aplica para os seguintes casos:

  (1) uma autorização especial de voo;

  (2) um certificado de autorização de voo experimental não emitido para os propósitos de
  operação de aeronave de construção amadora, operação de aeronave categoria primária construída
  a partir de conjuntos ou operação de aeronave leve esportiva; e

  (3) uma mudança de uma classificação de certificado de aeronavegabilidade para outra, no
  caso de uma aeronave já identificada conforme prescrito na seção 45.11 do RBAC 45.'
