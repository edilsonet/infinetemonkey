section_title: Emissão de certificado de aeronavegabilidade padrão para aeronaves categorias
  normal, utilidade, acrobática, transporte regional ou transporte e para balões livres tripulados
  e aeronaves de classe especial
subsection_id: d
cite: 21.183(d)
title: 21.183(d)
text: '(d) Aeronaves usadas e aeronaves militares convertidas para uso civil. O requerente
  de um certificado de aeronavegabilidade padrão para uma aeronave usada ou uma aeronave militar
  convertida para uso civil faz jus a esse certificado se:

  (1) o requerente apresentar evidências, à ANAC, de que a aeronave está conforme um projeto
  de tipo isento de, ou aprovado por, um certificado de tipo ou aprovado por um certificado
  suplementar de tipo e atende as diretrizes de aeronavegabilidade aplicáveis; (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (2) a aeronave (exceto aeronave com certificado de autorização de voo experimental que tenha
  tido um certificado de aeronavegabilidade padrão) tiver sido inspecionada de acordo com
  os requisitos de desempenho de inspeções de 100 (cem) horas como estabelecido no RBAC 43.15,
  ou requisito de desempenho equivalente aceito pela ANAC, e tiver sido considerada aeronavegável:
  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
