section_title: Emissão de certificado de aeronavegabilidade padrão para aeronaves categorias
  normal, utilidade, acrobática, transporte regional ou transporte e para balões livres tripulados
  e aeronaves de classe especial
subsection_id: i-i
cite: 21.183(i-I)
title: 21.183(i-I)
text: '(i)-I Emissões de CO

  2

  . Não obstante todos os outros requisitos desta seção, e independentemente da data do requerimento,
  somente será emitido certificado de aeronavegabilidade nas datas ou depois das datas especificadas
  no RBAC 38, para aviões especificados em tal regulamento se o avião cumprir com os requisitos
  aplicáveis do RBAC 38. (

  Incluído pela Resolução nº 501, de 12.12.2018

  )'
