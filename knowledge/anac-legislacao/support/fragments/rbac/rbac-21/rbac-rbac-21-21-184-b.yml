subsection_id: b
cite: 21.184(b)
title: 21.184(b)
text: (b) Aeronaves importadas. O requerente de um certificado de aeronavegabilidade especial
  na categoria primária para uma aeronave faz jus a esse certificado se a aeronave possuir
  um certificado de tipo conforme a seção 21.29, se a aeronave possuir um certificado de aeronavegabilidade
  para exportação, emitido pela autoridade de aviação civil do país exportador, e se, após
  vistoriar a aeronave, a ANAC constatar que a aeronave está conforme o projeto de tipo aprovado
  que atenda aos critérios do parágrafo 21.24(a)(1) e que a aeronave está em condições de
  operação segura.
