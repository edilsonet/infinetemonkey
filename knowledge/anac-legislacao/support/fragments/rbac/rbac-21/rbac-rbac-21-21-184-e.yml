subsection_id: e
cite: 21.184(e)
title: 21.184(e)
text: (e) Certificados de aeronavegabilidade múltiplos. Não são emitidos certificados de aeronavegabilidade
  múltiplos para aeronaves categoria primária. Tais aeronaves podem possuir somente um tipo
  de certificado de aeronavegabilidade.
