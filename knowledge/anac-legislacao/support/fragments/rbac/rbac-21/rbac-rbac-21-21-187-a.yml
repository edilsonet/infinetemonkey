section_title: Emissão de certificado de aeronavegabilidade múltiplo
subsection_id: a
cite: 21.187(a)
title: 21.187(a)
text: '(a) O requerente de um certificado de aeronavegabilidade para uma aeronave na categoria
  restrita e em uma ou mais outras categorias, exceto primária, faz jus ao certificado se:

  (1) demonstrar que a aeronave atende aos requisitos de cada uma das categorias, quando na
  configuração apropriada a cada uma destas categorias; e

  (2) demonstrar que a aeronave pode ser convertida de uma categoria para outra pela adição
  ou remoção de equipamentos, usando meios mecânicos simples.'
