section_title: Emissão de certificado de aeronavegabilidade múltiplo
subsection_id: b
cite: 21.187(b)
title: 21.187(b)
text: (b) O operador de uma aeronave detentora de certificado de aeronavegabilidade emitido
  segundo esta seção deve submeter a aeronave a uma inspeção conduzida pela ANAC, ou por uma
  pessoa com habilitação de mecânico de célula, para verificar a aeronavegabilidade da aeronave
  após cada conversão da categoria restrita para outra categoria, se a conversão tiver por
  objetivo o transporte aéreo público de passageiros, a menos que a ANAC considere, para um
  caso particular, tal exigência desnecessária para a segurança.
