text: '21.19 Modificações que requerem um novo certificado de tipo

  Qualquer pessoa que se proponha a modificar um produto deve submeter um requerimento para
  um novo certificado de tipo se a ANAC considerar que a modificação proposta para o projeto,
  para a potência, para o empuxo ou para o peso é tão extensa que exige uma investigação completa
  quanto à concordância com os regulamentos requeridos.'
