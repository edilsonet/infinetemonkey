cite: 21.190(c)
title: 21.190(c)
text: '(c) Declaração de conformidade do fabricante, para aeronave leve esportiva. A declaração
  de conformidade do fabricante requerida no parágrafo (b)(1)(iii) desta seção deve:

  (1) identificar a aeronave por marca, modelo, número de série, classe, data de fabricação
  e normas aceitas pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (2) declarar que a aeronave cumpre com as normas aceitas pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (3) declarar que a aeronave está conforme com os dados de projeto do fabricante e, ao usar
  o sistema de garantia da qualidade deste fabricante, que a aeronave cumpre com as normas
  aceitas pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (4) declarar que o fabricante tornará disponível, a qualquer pessoa interessada, os documentos
  a seguir, os quais deverão estar em conformidade com as normas aceitas pela ANAC:

  (Redação dada pela Resolução nº 686, de 13.07.2022)'
