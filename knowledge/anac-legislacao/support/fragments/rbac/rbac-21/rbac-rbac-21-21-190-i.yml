cite: 21.190(i)
title: 21.190(i)
text: '(i) as instruções de operação da aeronave;

  (ii) os procedimentos de manutenção e inspeção da aeronave; e

  (iii) o suplemento de treinamento de voo da aeronave;

  (5) declarar que o fabricante irá monitorar e corrigir deficiências relativas à segurança
  operacional através da emissão de diretrizes de segurança e de um sistema de aeronavegabilidade
  continuada que atenda as normas aceitas pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (6) declarar que, a pedido da ANAC, o fabricante providenciará acesso irrestrito às suas
  instalações; e

  (7) declarar que o fabricante, através de um procedimento de ensaio de aceitação de produção
  que atenda as normas aceitas pela ANAC:

  (Redação dada pela Resolução nº 686, de 13.07.2022)'
