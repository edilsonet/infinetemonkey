cite: 21.191(b)
title: 21.191(b)
text: (b) demonstração de cumprimento com requisitos. Condução de ensaios em voo ou outras
  operações visando demonstrar cumprimento com os regulamentos de aeronavegabilidade, incluindo
  os voos necessários à emissão de certificado de tipo ou certificado suplementar de tipo,
  voos para substanciar grandes modificações de projeto e voos para demonstrar cumprimento
  com requisitos de funcionamento e de confiabilidade.
