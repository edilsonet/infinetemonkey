title: 21.191(h)
text: (h) operação de aeronave categoria primária montada a partir de conjuntos. Operação
  de aeronave categoria primária que atenda aos requisitos do parágrafo 21.24(a)(1) e que
  tenha sido montada por uma pessoa a partir de conjuntos fabricados pelo detentor de um certificado
  de organização de produção, mas cuja montagem foi realizada sem a supervisão e sem o controle
  de qualidade de tal detentor, como estabelecido no parágrafo 21.184(a).
