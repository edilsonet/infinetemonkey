text: '(i) a partir de um conjunto para o qual o requerente pode providenciar as informações
  requeridas pelo parágrafo 21.193(e); e

  (ii) de acordo com as instruções de montagem do fabricante, as quais devem satisfazer normas
  aceitas pela ANAC; ou

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (3) cumpra com o previsto na seção 21.190. (

  Redação dada pela Resolução nº 544, de 04.03.2020

  )'
