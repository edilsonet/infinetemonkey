section_title: Certificado de autorização de voo experimental. Generalidades
subsection_id: d
cite: 21.193(d)
title: 21.193(d)
text: '(d) no caso de utilização da aeronave para realização de experiências:

  (1) os objetivos da experiência;

  (2) o tempo estimado ou número de voos requeridos pela experiência;

  (3) as áreas sobre as quais os voos de experiência serão conduzidos; e

  (4) um desenho das três vistas ou fotografias do avião, com escala dimensional, nas três
  vistas, exceto para aeronaves convertidas a partir de um tipo previamente certificado e
  que não tenha sofrido apreciável modificação na configuração externa.'
