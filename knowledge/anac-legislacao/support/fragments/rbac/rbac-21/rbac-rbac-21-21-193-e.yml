cite: 21.193(e)
title: 21.193(e)
text: '(e) no caso de aeronave leve esportiva montada a partir de conjunto a ser certificada
  de acordo com o parágrafo 21.191(i)(2), um requerente deve apresentar o seguinte:

  (1) evidências de que uma aeronave de mesma marca e modelo foi fabricada e montada pelo
  fabricante dos conjuntos da aeronave e que ela já tenha demonstrado o cumprimento com a
  seção 21.190; (

  Redação dada pela Resolução nº 544, de 04.03.2020

  )

  (2) as instruções de operação da aeronave;

  (3) os procedimentos de manutenção e inspeção da aeronave;

  (4) uma declaração de conformidade do fabricante do conjunto utilizado na montagem da aeronave
  de que esta cumpre com o parágrafo 21.190(c), com exceção de que, ao invés de cumprir o
  parágrafo 21.190(c)(7), a declaração indique obrigatoriamente as instruções de montagem
  para a aeronave, as quais devem satisfazer as normas aceitas pela ANAC;

  (Redação dada pela Resolução nº 686, de 13.07.2022)

  (5) o suplemento de treinamento de voo da aeronave; e

  (6) [Reservado].

  (

  Redação dada pela Resolução nº 210, de 29.11.2011

  )'
