section_title: Certificado de autorização de voo experimental. Aeronave a ser usada em pesquisa
  de mercado, demonstrações para venda e treinamento de tripulação do comprador
subsection_id: b
cite: 21.195(b)
title: 21.195(b)
text: (b) O fabricante de motores que tenha alterado uma aeronave de tipo certificado, através
  da instalação de motores diferentes, fabricados por ele no Brasil, pode requerer um certificado
  de autorização de voo experimental para uma aeronave que será usada para pesquisa de mercado,
  demonstrações para venda e treinamento de tripulações de um comprador, desde que a aeronave
  básica, antes da alteração, tenha sido de tipo previamente certificado na categoria normal,
  utilidade, acrobática, transporte regional ou transporte.
