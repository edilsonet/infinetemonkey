section_title: Certificado de autorização de voo experimental. Aeronave a ser usada em pesquisa
  de mercado, demonstrações para venda e treinamento de tripulação do comprador
subsection_id: c
cite: 21.195(c)
title: 21.195(c)
text: (c) Uma pessoa que tenha alterado o projeto de uma aeronave de tipo certificado pode
  requerer um certificado de autorização de voo experimental para uma aeronave que será usada
  para pesquisa de mercado, demonstrações para venda e treinamento de tripulações de um comprador,
  desde que a aeronave básica, antes da alteração, tenha sido de tipo previamente certificado
  na categoria normal, utilidade, acrobática, transporte regional ou transporte.
