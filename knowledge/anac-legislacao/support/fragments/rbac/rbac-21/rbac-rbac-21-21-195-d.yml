section_title: Certificado de autorização de voo experimental. Aeronave a ser usada em pesquisa
  de mercado, demonstrações para venda e treinamento de tripulação do comprador
subsection_id: d
cite: 21.195(d)
title: 21.195(d)
text: '(d) O requerente de um certificado de autorização de voo experimental conforme esta
  seção faz jus ao certificado se, além das exigências da seção 21.193:

  (1) ele estabelecer um programa de inspeções e de manutenção de forma a assegurar a aeronavegabilidade
  continuada da aeronave; e

  (2) ele demonstrar que a aeronave voou um mínimo de 50 (cinquenta) horas, ou pelo menos
  5 (cinco) horas no caso de aeronave de tipo previamente certificado que tenha sido modificada.
  A ANAC pode reduzir estes requisitos operacionais se o requerente prover justificativa adequada.
  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
