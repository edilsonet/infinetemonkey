cite: 21.197(a)
title: 21.197(a)
text: '(a) Uma autorização especial de voo pode ser emitida para uma aeronave que temporariamente
  não atenda a todos os requisitos de aeronavegabilidade a ela aplicáveis, mas que ainda apresente
  condições de voo seguro. Os seguintes propósitos são permitidos:

  (1) translado de aeronave para uma base onde reparos, modificações ou serviços de manutenção
  serão executados, ou para uma base onde a aeronave será armazenada;

  (2) entrega ou exportação de aeronave ao seu comprador;

  (3) ensaios em voo de produção de aeronaves recém-fabricadas, inclusive treinamento de tripulação
  do fabricante; (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (4) evacuação da aeronave de áreas perigosas;

  (5) condução de voos de demonstração para cliente, inclusive treinamento de tripulação do
  mesmo, em aeronaves novas que tenham satisfatoriamente completado ensaios em voo de produção.
  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
