cite: 21.197(c)
title: 21.197(c)
text: '(c) Através de requerimento, conforme previsto na seção 119.51 do RBAC 119, uma autorização
  especial de voo com uma autorização continuada pode ser emitida para uma aeronave que não
  cumpra os requisitos de aeronavegabilidade aplicáveis, mas apresente condições de voo seguro
  para ser transladada para uma base onde serão executados serviços de manutenção ou modificações.
  A autorização especial de voo emitida segundo este parágrafo inclui condições e limitações
  para os voos e está definida nas especificações operativas da empresa aérea. A autorização
  especial de voo de acordo com este parágrafo pode ser emitida para:

  (1) empresas de transporte aéreo operando segundo o RBAC 121;

  (2) empresas de transporte aéreo operando segundo o RBAC 135. Nesse caso, só são beneficiadas
  as aeronaves operadas e mantidas segundo um programa de manutenção de aeronavegabilidade
  continuada, como estabelecido nos parágrafos 135.411(a)(2) ou (b) do RBAC 135; e

  (3) [reservado].'
