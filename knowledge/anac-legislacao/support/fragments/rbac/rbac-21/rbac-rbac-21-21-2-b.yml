cite: 21.2(b)
title: 21.2(b)
text: '(b) Qualquer ato cometido por qualquer pessoa, segundo o parágrafo (a) desta seção
  é base para:

  (1) negar a emissão de qualquer certificado ou aprovação segundo este regulamento; e

  (2) suspender ou revogar qualquer aprovação ou certificado emitidos segundo este regulamento
  e mantidos por aquela pessoa.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
