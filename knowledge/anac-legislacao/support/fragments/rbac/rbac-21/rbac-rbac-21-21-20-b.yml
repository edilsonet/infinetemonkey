cite: 21.20(b)
title: 21.20(b)
text: '(b) fornecer uma declaração certificando que o requerente cumpriu com os requisitos
  aplicáveis.

  (1) quando o requerente for uma organização de projeto certificada, a declaração definida
  no parágrafo (b) dessa seção deve atender às provisões da subparte J.

  (Incluído pela Resolução nº 495, de 14.11.2018)

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
