title: Transferência
text: '21.219 Transferência

  Um certificado de aeronavegabilidade provisório Classe I não é transferível. Um certificado
  de aeronavegabilidade provisório Classe II pode ser transferido para uma empresa de transporte
  aéreo qualificada para requerer este certificado segundo o parágrafo 21.213(b).'
