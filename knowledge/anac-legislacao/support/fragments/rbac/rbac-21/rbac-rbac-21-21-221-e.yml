title: 21.221(e)
text: (e) Deve ser provido, juntamente com a aeronave, um manual de voo provisório ou outro
  documento e letreiros apropriados, contendo as limitações estabelecidas pelo parágrafo 21.81(g)
  e pela seção 91.317 do RBHA 91, ou dispositivo correspondente do RBAC que venha a substituí-lo.
