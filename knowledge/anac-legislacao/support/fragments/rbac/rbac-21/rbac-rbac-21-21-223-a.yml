section_title: Certificado de aeronavegabilidade provisório Classe II
subsection_id: a
cite: 21.223(a)
title: 21.223(a)
text: '(a) Exceto como previsto no RBAC 21.225, o requerente de um certificado de aeronavegabilidade
  provisório Classe II faz jus a este certificado para uma aeronave para a qual tenha sido
  emitido um certificado de tipo provisório Classe II se:

  (1) ele atender aos requisitos de elegibilidade do RBAC 21.213 e cumprir os requisitos estabelecidos
  por esta seção; e

  (2) a ANAC considerar que não existe aspecto, característica ou condição da aeronave que
  a torne insegura quando operada de acordo com as limitações estabelecidas no parágrafo 21.83(h)
  deste RBAC e no parágrafo 121.207 do RBAC 121, bem como na seção 91.317 do RBHA 91, ou dispositivo
  correspondente do RBAC que venha a substituí-lo.'
