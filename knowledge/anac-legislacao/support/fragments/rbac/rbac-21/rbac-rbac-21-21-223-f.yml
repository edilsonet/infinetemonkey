section_title: Certificado de aeronavegabilidade provisório Classe II
subsection_id: f
cite: 21.223(f)
title: 21.223(f)
text: (f) Deve ser provido, juntamente com a aeronave, um manual de voo provisório contendo
  as limitações estabelecidas pela seção 21.83(h) deste RBAC e pela seção 121.207 do RBAC
  121, bem como pela seção 91.317 do RBHA 91, ou dispositivo correspondente do RBAC que venha
  a substituí-lo.
