title: 21.225(b)
text: '(b) O requerente deve demonstrar que a modificação da aeronave foi feita sob um sistema
  da qualidade adequado para assegurar que a mesma está em conformidade com a emenda provisória
  ao certificado de tipo. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
