title: 21.225(e)
text: '(e) Deve ser provido, juntamente com a aeronave, um manual de voo provisório ou outros
  documentos e letreiros apropriados, contendo as limitações requeridas pela seção 21.85(g)
  deste RBAC, 121.207 do RBAC 121, bem como pela seção 91.317 do RBHA 91, ou dispositivo correspondente
  do RBAC que venha a substituí-lo.

  SUBPARTE J-I

  CERTIFICADO DE ORGANIZAÇÃO DE PROJETO

  (Subparte com redação dada pela Resolução nº 495, de 14.11.2018)'
