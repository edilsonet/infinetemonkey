title: Elegibilidade
text: '21.233-I Elegibilidade

  Qualquer pessoa jurídica (organização) que pretenda desenvolver projeto de produtos aeronáuticos,
  ou modificações aos projetos, ou projeto de reparos, pode requerer um certificado, de acordo
  com esta subparte.'
