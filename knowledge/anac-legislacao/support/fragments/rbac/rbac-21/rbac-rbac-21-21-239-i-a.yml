cite: 21.239-I(a)
title: 21.239-I(a)
text: '(a) A organização de projeto deve comprovar que possui um sistema de garantia do projeto,
  bem como estar apta a mantê-lo, com o objetivo de controle e de supervisão de projeto e
  de modificações de projeto, de produtos e artigos contemplados no requerimento. O referido
  sistema deve permitir à organização:

  (1) assegurar que o projeto dos produtos e artigos ou das respectivas modificações cumpre
  com os requisitos aplicáveis de aeronavegabilidade e de proteção ambiental; e (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  (2) assegurar que suas responsabilidades são adequadamente exercidas de acordo com:'
