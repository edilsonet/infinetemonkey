text: '(i) as disposições aplicáveis deste regulamento, e

  (ii) os termos da certificação emitidos com base na seção 21.251-I;

  (3) monitorar independentemente a conformidade com os procedimentos documentados do sistema
  e sua adequação. O monitoramento deve incluir um sistema de retroalimentação à pessoa ou
  ao grupo de pessoas responsáveis por assegurar a execução de ações corretivas.'
