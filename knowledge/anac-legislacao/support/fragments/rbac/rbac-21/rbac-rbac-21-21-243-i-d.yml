text: '(d) A organização de projeto deve fornecer uma declaração sobre as qualificações e
  a experiência do quadro gerencial, bem como do pessoal responsável na organização pela tomada
  de decisões em matéria de aeronavegabilidade e de proteção ambiental. (

  Redação dada pela Resolução nº 501, de 12.12.2018

