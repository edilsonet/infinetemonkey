title: Mudanças no sistema de garantia do projeto
text: '21.247-I Mudanças no sistema de garantia do projeto

  Após a emissão de um certificado de organização de projeto, quaisquer mudanças efetuadas
  no sistema de garantia do projeto, que sejam significativas para o cumprimento com os requisitos
  ou para a aeronavegabilidade ou para a proteção ambiental, inerentes ao produto, devem ser
  aprovadas pela ANAC. Um requerimento para aprovar a mudança deve ser apresentado por escrito
  à ANAC e a organização de projeto deve demonstrar que, com base nas mudanças propostas ao
  manual e antes da sua implementação, continuará a satisfazer os requisitos desta subparte,
  após a implementação dessas mudanças. (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
