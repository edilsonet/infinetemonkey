cite: 21.258-I(a)
title: 21.258-I(a)
text: (a) Sempre que for detectada uma evidência objetiva de não conformidade, revelando que
  o detentor de um certificado de organização de projeto não cumpre com os requisitos aplicáveis
  deste regulamento, a classificação, a correção da não conformidade nos projetos aprovados,
  e a tomada de ações corretivas sistêmicas, para evitar a recorrência da não conformidade,
  devem ser realizadas conforme procedimento acordado com a ANAC.
