subsection_id: b
cite: 21.27(b)
title: 21.27(b)
text: (b) O requerente faz jus a um certificado de tipo para uma aeronave militar considerada
  excedente por uma das Forças Armadas do Brasil que seja de tipo e modelo idênticos ao de
  uma aeronave certificada como aeronave civil se demonstrar que a aeronave satisfaz aos requisitos
  aplicáveis à certificação de tipo original da aeronave civil idêntica a ela.
