section_title: 'Emissão de certificado de tipo: conversão de aeronaves militares para emprego
  civil'
subsection_id: c
cite: 21.27(c)
title: 21.27(c)
text: (c) Motores, hélices e respectivos complementos e acessórios instalados em uma aeronave
  considerada excedente por uma das Forças Armadas do Brasil, para a qual esteja sendo requerido
  um certificado de tipo conforme esta seção, serão aprovados para utilização em tal tipo
  de aeronave, desde que o requerente demonstre, com base na prévia qualificação, aceitação
  e histórico da utilização em serviço ativo, que os produtos considerados oferecem o mesmo
  nível de aeronavegabilidade que seria assegurado se tais motores e hélices houvessem sido
  certificados de acordo com os requisitos dos RBAC 33 ou 35, conforme aplicável.
