cite: 21.27(e)
title: 21.27(e)
text: (e) A ANAC pode exigir o cumprimento de condições especiais e de requisitos emitidos
  posteriormente aos constantes dos parágrafos (a) e (c) desta seção, se considerar que os
  requisitos em questão não irão assegurar um adequado nível de aeronavegabilidade para a
  aeronave.
