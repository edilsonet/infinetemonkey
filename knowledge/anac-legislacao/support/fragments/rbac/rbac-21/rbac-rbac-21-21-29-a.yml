title: 21.29(a)
text: '(a) Pode ser emitido um certificado de tipo a um produto que se pretenda importar para
  o Brasil e que tenha sido fabricado em um país estrangeiro com o qual o Brasil mantenha
  um acordo para aceitação de importação e exportação de tais produtos, se:

  (1) o estado de projeto certificar que o produto foi examinado, ensaiado e considerado como
  satisfazendo:'
