section_title: 'Emissão de certificado de tipo: produtos importados'
subsection_id: i
cite: 21.29(i)
title: 21.29(i)
text: '(i) aos requisitos aplicáveis de proteção ambiental dos RBAC 34, 36 e 38, conforme
  previsto na seção 21.17, ou aos requisitos aplicáveis de proteção ambiental do estado de
  projeto e a quaisquer outros requisitos que a ANAC possa determinar para que os níveis de
  impacto ambiental não sejam superiores aos estabelecidos pelos RBAC 34, 36 e 38, conforme
  especificado na seção 21.17; e (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )

  (ii) aos requisitos de aeronavegabilidade aplicáveis conforme previsto na seção 21.17, ou
  aos requisitos de aeronavegabilidade aplicáveis do estado de projeto e a quaisquer outros
  requisitos que a ANAC possa determinar para prover um nível de segurança equivalente àquele
  provido pelos requisitos de aeronavegabilidade aplicáveis dos RBAC, como previsto na seção
  21.17;

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (2) o requerente houver apresentado os dados técnicos referentes a ruído e aeronavegabilidade
  do produto que tenham sido requeridos no parágrafo (a)(1) desta seção; e (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (3) o requerente tiver demonstrado cumprimento com a seção 21.41-I.'
