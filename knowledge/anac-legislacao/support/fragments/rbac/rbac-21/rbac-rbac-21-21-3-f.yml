cite: 21.3(f)
title: 21.3(f)
text: '(f) Se a investigação de um acidente ou a comunicação de dificuldade em serviço demonstrar
  que um produto ou artigo fabricado segundo este regulamento é inseguro devido a um defeito
  de projeto ou de fabricação, o detentor da aprovação de produção deste produto ou artigo
  deverá, quando solicitado pela ANAC, comunicar a esta Agência o resultado de suas investigações
  e qualquer ação tomada ou proposta pelo detentor da aprovação de produção para corrigir
  o referido defeito. Se a ação é requerida para corrigir o defeito em um produto ou artigo
  já fabricado, o detentor de aprovação de produção deve fornecer à ANAC dados necessários
  à emissão de uma diretriz de aeronavegabilidade apropriada. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
