text: '(i) tenha determinado que foi provocado por manutenção imprópria ou uso impróprio;

  (ii) saiba já ter sido comunicado à ANAC por outra pessoa; ou

  (iii) saiba já ter sido comunicado ao órgão de investigação de acidente aeronáutico devido
  à ocorrência de um acidente aeronáutico.

  (2) falhas, mau funcionamento ou defeitos em produtos ou artigos:'
