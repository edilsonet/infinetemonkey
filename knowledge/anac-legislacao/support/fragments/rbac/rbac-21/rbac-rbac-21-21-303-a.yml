title: 21.303(a)
text: '(a) O requerente de um certificado de produto aeronáutico aprovado e/ou do certificado
  de organização de produção conforme esta subparte deve submeter seu requerimento na forma
  e maneira prescrita pela ANAC. O requerimento deve incluir:

  (1) a identificação do produto em que a peça pode ser instalada;

  (2) o nome e o endereço das instalações onde a peça é ou será fabricada;

  (3) o projeto da peça, consistindo em:'
