cite: 21.305(a)
title: 21.305(a)
text: '(a) Cada requerente ou detentor de um certificado de organização de produção deve fornecer
  à ANAC um documento que:

  (1) descreva como sua organização garantirá a conformidade com os requisitos desta subparte.

  (2) no mínimo, descreva as responsabilidades atribuídas e a autoridade delegada, e a relação
  funcional entre os responsáveis pelo gerenciamento da qualidade e outros componentes organizacionais,
  e

  (3) Identifique o gestor responsável.'
