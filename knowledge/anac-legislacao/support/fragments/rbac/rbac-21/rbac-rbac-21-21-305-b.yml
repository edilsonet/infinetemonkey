title: 21.305(b)
text: '(b) Dentro da organização do requerente ou do detentor de certificado de organização
  de produção, o gestor responsável, especificado no parágrafo (a) desta seção, deve ser responsável
  por todas as operações de produção realizadas sob este regulamento, assim como ter autoridade
  sobre as mesmas. O gestor responsável deve confirmar que os procedimentos descritos no manual
  de qualidade, exigidos pela seção 21.308, estão em vigor e que o detentor do certificado
  de organização de produção satisfaz os requisitos das regulamentações aplicáveis. O gestor
  responsável deve servir como contato primário com a ANAC.

  (Redação dada pela Resolução nº 495, de 14.11.2018)'
