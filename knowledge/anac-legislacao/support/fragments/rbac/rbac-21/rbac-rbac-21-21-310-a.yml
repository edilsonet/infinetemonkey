cite: 21.310(a)
title: 21.310(a)
text: (a) Cada requerente ou detentor de um certificado de organização de produção deve permitir
  que a ANAC inspecione o seu sistema da qualidade, instalações, dados técnicos, e quaisquer
  artigos manufaturados e testemunhar quaisquer testes, incluindo as inspeções ou ensaios
  em uma instalação de fornecedor, necessários para determinar o cumprimento com os RBAC aplicáveis.
