cite: 21.310(b)
title: 21.310(b)
text: '(b) A menos que de outra forma autorizado pela ANAC, o requerente ou detentor de um
  certificado de produto aeronáutico aprovado:

  (1) não pode apresentar qualquer artigo à ANAC para uma inspeção ou ensaio, a menos que
  a conformidade com os parágrafos 21.303(b)(2) até (4) tenha sido demonstrada para o artigo;
  e

  (Redação dada pela Resolução nº 495, de 14.11.2018)

  (2) não pode fazer nenhuma modificação na peça no espaço de tempo transcorrido entre a demonstração
  de sua conformidade com os parágrafos 21.303(b)(2) até (4) e o momento em que a peça for
  apresentada à ANAC para inspeção ou ensaio.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
