title: 21.311(a-I)
text: (a)-I A ANAC emitirá um certificado de produto aeronáutico aprovado após comprovar que
  o requerente cumpre com os requisitos desta subparte e o projeto cumpre com os requisitos
  dos RBAC aplicáveis ao produto em que a peça será instalada.
