title: Validade
text: '21.313 Validade

  Um certificado de produto aeronáutico aprovado e/ou um certificado de organização de produção
  é(são) válido(s) até que seja(m) devolvido(s), suspenso(s), revogado(s), cassado(s) ou que
  tenha(m) uma data de validade estabelecida pela ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
