title: 21.320(b)
text: '(b) o detentor de um certificado de organização de produção deve notificar imediatamente
  a ANAC, por escrito, qualquer alteração que possa afetar a inspeção, conformidade ou aeronavegabilidade
  do artigo.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  SUBPARTE L

  APROVAÇÃO DE AERONAVEGABILIDADE PARA EXPORTAÇÃO'
