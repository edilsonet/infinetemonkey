cite: 21.325(c)
title: 21.325(c)
text: '(c) Se a ANAC considerar que a localização do produto não lhe causará ônus indevido,
  uma aprovação de aeronavegabilidade para exportação pode ser emitida para um produto ou
  artigo localizado fora do Brasil.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
