title: Requerimento
text: '21.327 Requerimento

  Qualquer pessoa pode requerer uma aprovação de aeronavegabilidade para exportação. Cada
  requerente deve submeter um requerimento na forma e maneira estabelecida pela ANAC.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
