section_title: Inspeções e ensaios
subsection_id: a
cite: 21.33(a)
title: 21.33(a)
text: '(a) O requerente deve permitir que a ANAC realize quaisquer inspeções e ensaios em
  voo e no solo necessários à verificação do cumprimento com os requisitos aplicáveis dos
  RBAC. Entretanto, a menos que de outra forma autorizado pela ANAC:

  (1) nenhuma aeronave, motor, hélice ou componentes destes pode ser apresentado à ANAC para
  ser ensaiado, a menos que fique evidenciado que a aeronave, motor, hélice ou peça relacionada
  atende ao estabelecido nos parágrafos (b)(2) até (b)(4) desta seção; e

  (2) nenhuma modificação pode ser efetuada na aeronave, motor, hélice ou componentes destes
  no espaço de tempo transcorrido entre a demonstração de cumprimento com os parágrafos (b)(2)
  até (b)(4) desta seção e o momento em que a aeronave, o motor, a hélice ou a peça relacionada
  for apresentada à ANAC para ensaio.'
