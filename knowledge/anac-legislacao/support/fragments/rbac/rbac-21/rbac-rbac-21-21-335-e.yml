title: 21.335(e)
text: '(e) na época em que o título de propriedade da aeronave for transferido para o comprador
  estrangeiro:

  (1) solicitar à ANAC o cancelamento dos certificados brasileiros de aeronavegabilidade e
  de matrícula, informando a data da transferência de propriedade, o nome e o endereço do
  comprador estrangeiro;

  (2) devolver os certificados de aeronavegabilidade e de matrícula à ANAC; e

  (3) apresentar à ANAC uma declaração assegurando que as marcas de nacionalidade e de matrícula
  brasileiras foram removidas da aeronave, conforme estabelecido na seção 45.33 do RBAC 45.

  SUBPARTE M

  RESERVADA

  SUBPARTE N

  ACEITAÇÃO DE MOTORES DE AERONAVES, HÉLICES E ARTIGOS: IMPORTAÇÃO

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
