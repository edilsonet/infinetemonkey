title: 21.35(f)
text: '(f) Os ensaios em voo estabelecidos pelo parágrafo (b)(2) desta seção devem incluir:

  (1) para aeronaves incorporando motores a turbina de um tipo não empregado previamente em
  uma aeronave já certificada, pelo menos 300 (trezentas) horas de operação usando motores
  conforme o tipo certificado;

  (2) para todas as demais aeronaves, pelo menos 150 (cento e cinquenta) horas de operação.'
