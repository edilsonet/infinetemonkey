title: Piloto de ensaios em voo
text: '21.37 Piloto de ensaios em voo

  O requerente de um certificado de tipo de aeronave das categorias normal, utilidade, acrobática,
  transporte regional ou transporte deve apresentar um piloto que possua qualificações e habilitações
  apropriadas, o qual será responsável pela condução dos ensaios em voo requeridos por este
  regulamento.'
