section_title: Calibração da instrumentação de ensaios em voo e respectivos relatórios
subsection_id: a
cite: 21.39(a)
title: 21.39(a)
text: (a) O requerente de um certificado de tipo de aeronave das categorias normal, utilidade,
  acrobática, transporte regional ou transporte deve submeter à apreciação da ANAC um relatório
  apresentando os cálculos e ensaios requeridos para a calibração da instrumentação a ser
  usada nos ensaios em voo e para a redução dos dados de ensaios às condições atmosféricas
  padrão.
