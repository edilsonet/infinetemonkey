title: Localização das instalações de fabricação
text: '21.43 Localização das instalações de fabricação

  Exceto como previsto na seção 21.29, a ANAC não emite certificado de tipo no caso de produtos
  fabricados em instalações localizadas fora do Brasil, a menos que a ANAC considere que tal
  localização não implique em ônus indevidos.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
