title: 21.47(b)
text: (b) Para a transferência de um certificado de tipo em que o estado de projeto permanecerá
  o mesmo, cada cedente deve, antes da transferência, notificar por escrito à ANAC. Esta notificação
  deve incluir o número do certificado de tipo aplicável, o nome e o endereço do cessionário
  e a data prevista para a transferência.
