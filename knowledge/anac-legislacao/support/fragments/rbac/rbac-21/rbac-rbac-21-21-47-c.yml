cite: 21.47(c)
title: 21.47(c)
text: (c) Para a transferência de um certificado de tipo em que o estado de projeto está mudando,
  o certificado de tipo somente será transferido para ou de uma pessoa sujeita à autoridade
  de outro estado de projeto se houver acordo bilateral com o estado de projeto para a aceitação
  do produto afetado para exportação e importação. Cada cedente deve notificar à ANAC antes
  da transferência de forma e maneira aceitável pela ANAC. Esta notificação deve incluir o
  número do certificado de tipo aplicável, o nome, o endereço e país de residência do cessionário
  e a data prevista para a transferência.
