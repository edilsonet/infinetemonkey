title: 21.47(d)
text: '(d) Antes do início ou término de um acordo de licenciamento que torna disponível o
  certificado de tipo a outra pessoa, o detentor do certificado de tipo deve notificar o fato,
  por escrito, à ANAC. A notificação deve incluir o número de certificado de tipo objeto do
  acordo de licenciamento, o nome e o endereço de quem recebeu o licenciamento, a data prevista
  para a transação e a extensão da autoridade conferida ao licenciado.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
