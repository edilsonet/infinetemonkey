cite: 21.49(a)
title: 21.49(a)
text: '(a) O detentor de um certificado de tipo deve manter seu certificado disponível para
  qualquer verificação requerida pela ANAC. Adicionalmente, tal detentor deve manter e colocar
  à disposição da ANAC todas as informações relevantes do projeto, desenhos e relatórios de
  ensaios, incluindo registros das inspeções, a fim de assegurar a aeronavegabilidade continuada
  do produto. (

  Redação dada pela Resolução nº 624, de 07.06.2021

  )'
