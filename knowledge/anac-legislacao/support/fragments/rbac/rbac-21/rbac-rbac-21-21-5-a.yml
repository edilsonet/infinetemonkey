section_title: Manual de voo de aviões e aeronaves de asas rotativas
subsection_id: a
cite: 21.5(a)
title: 21.5(a)
text: '(a) Mesmo que um tipo de avião ou de aeronave de asa rotativa tenha sido certificado
  segundo regulamento não requerendo um manual de voo, o detentor do certificado de tipo (incluindo
  emenda ou certificado suplementar de tipo) ou o licenciado de um certificado de tipo deve
  fornecer ao comprador de cada exemplar do avião ou da aeronave de asa rotativa que não tenha
  executado nenhum voo antes de 1º de março de 1979 (ou 31 de agosto de 1980, para aeronaves
  produzidas no Brasil), no momento da entrega, um manual de voo aprovado, na sua versão mais
  recente. (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
