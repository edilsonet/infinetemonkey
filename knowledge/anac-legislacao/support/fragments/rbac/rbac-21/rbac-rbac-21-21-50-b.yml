section_title: Instruções para aeronavegabilidade continuada e manuais de manutenção do fabricante
  contendo seções de limitações de aeronavegabilidade
subsection_id: b
cite: 21.50(b)
title: 21.50(b)
text: '(b) O detentor de uma aprovação de projeto, incluindo tanto um certificado de tipo
  ou um certificado suplementar de tipo de uma aeronave, motor ou hélice cujo requerimento
  para a obtenção tenha sido submetido após 28 de janeiro de 1981 deve fornecer pelo menos
  um conjunto completo das instruções para aeronavegabilidade continuada para o proprietário
  de cada aeronave, cada motor ou cada hélice quando de sua entrega ou quando da emissão do
  primeiro certificado de aeronavegabilidade padrão para a aeronave envolvida, o que ocorrer
  depois. As instruções para aeronavegabilidade continuada devem ser preparadas de acordo
  com as seções 23.1529 do RBAC 23, 25.1529 e 25.1729 do RBAC 25, 27.1529 do RBAC 27, 29.1529
  do RBAC 29, 31.82 do RBHA 31, ou dispositivo correspondente do RBAC que venha a substituí-lo,
  33.4 do RBAC 33, 35.4 do RBAC 35, com o RBAC 26, ou como especificado pelos critérios de
  aeronavegabilidade aplicáveis, estabelecidos pelo parágrafo 21.17(b), como aplicável. Se
  o detentor de uma aprovação de projeto escolher designar partes como comerciais, deve incluir
  nas instruções de aeronavegabilidade continuada uma lista de partes comerciais submetidas
  de acordo com as provisões do parágrafo (c) desta seção. Depois disto, o detentor de uma
  aprovação de projeto deve colocar tais instruções à disposição de qualquer pessoa a quem
  os RBAC requeiram o cumprimento de qualquer condição de tais instruções. Adicionalmente,
  modificações em instruções para aeronavegabilidade continuada devem ser colocadas à disposição
  de qualquer pessoa a quem os RBAC requeiram o cumprimento de qualquer uma de tais instruções.
  (

  Redação dada pela Resolução nº 524, de 02.08.2019

  )'
