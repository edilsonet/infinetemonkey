section_title: Aceitação de motores de aeronaves e hélices
subsection_id: c
cite: 21.500(c)
title: 21.500(c)
text: '(c) o detentor ou licenciado de um certificado de tipo brasileiro para aquele produto
  fornecer, com cada um destes motores de aeronave ou hélices importados para o Brasil, uma
  aprovação de aeronavegabilidade para exportação certificando que cada motor de aeronave
  e hélice:

  (1) está conforme o certificado de tipo brasileiro e em condições de operação segura; e

  (2) foi submetido, pelo fabricante, a uma verificação operacional final.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
