cite: 21.601(a)
title: 21.601(a)
text: '(a) Esta subparte estabelece:

  (1) requisitos para emissão de certificado de produto aeronáutico aprovado segundo uma ordem
  técnica padrão;

  (2) requisitos para emissão de certificado de organização de produção para fabricação de
  artigo;

  (3) regras aplicáveis aos detentores dos documentos referidos nos parágrafos (a)(1) e (a)(2)
  desta seção;

  (4) requisitos para emissão de uma carta de aprovação de projeto para produtos aprovados
  segundo uma ordem técnica padrão.'
