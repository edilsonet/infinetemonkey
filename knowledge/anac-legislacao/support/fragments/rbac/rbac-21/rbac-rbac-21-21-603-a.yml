cite: 21.603(a)
title: 21.603(a)
text: '(a) O requerente de um certificado de produto aeronáutico aprovado segundo uma OTP
  deve submeter seu requerimento na forma e maneira prescrita pela ANAC, que inclui o seguinte:

  (1) declaração atestando que o requerente cumpriu as exigências desta subparte e que o artigo
  em questão cumpre com os requisitos de desempenho estabelecidos na OTP aplicável, vigente
  na data de requerimento;

  (2) cópia dos dados técnicos (desenhos, relatórios de ensaio e de cálculos, especificações
  de material, entre outros) exigidos pela OTP aplicável;'
