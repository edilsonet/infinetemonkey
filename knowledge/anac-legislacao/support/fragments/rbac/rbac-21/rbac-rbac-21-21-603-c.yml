title: 21.603(c)
text: '(c) Se o requerimento for considerado incompleto, o requerente deve fornecer todas
  as informações adicionais que a ANAC considerar necessárias para demonstrar conformidade
  com este regulamento. Se uma informação adicional não for apresentada dentro de 30 (trinta)
  dias a contar da data em que foi requerida, o requerimento será cancelado, sendo o requerente
  notificado de tal cancelamento.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
