text: '21.612-I Registro de limitações de produção

  A ANAC emite o registro de limitação de produção como parte de um certificado de organização
  de produção. O registro lista o número do documento de aprovação do projeto, o acordo de
  licença (caso aplicável), a data da aprovação de produção e o modelo de cada produto ou
  artigo que o detentor do certificado de organização de produção está autorizado a fabricar.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
