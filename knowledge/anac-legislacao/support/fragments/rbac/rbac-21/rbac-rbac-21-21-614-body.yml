title: Transferência
text: '21.614 Transferência

  O certificado de produto aeronáutico aprovado segundo uma OTP e/ou o certificado de organização
  de produção ou carta de aprovação do projeto segundo uma OTP não são transferíveis.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
