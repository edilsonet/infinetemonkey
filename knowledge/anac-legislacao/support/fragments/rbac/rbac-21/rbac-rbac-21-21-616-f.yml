cite: 21.616(f)
title: 21.616(f)
text: (f) ter acesso aos dados de projeto necessários para determinar a conformidade e aeronavegabilidade
  de cada artigo produzido sob um certificado de organização de produção. O fabricante deve
  manter estes dados até que a produção do artigo seja descontinuada em definitivo. Neste
  momento, cópias destes dados deverão ser enviadas para a ANAC.
