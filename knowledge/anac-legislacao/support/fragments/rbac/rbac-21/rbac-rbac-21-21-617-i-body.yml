text: '21.617-I Emenda ao certificado de organização de produção

  O detentor de um certificado de organização de produção deve solicitar uma emenda ao certificado
  de organização de produção da forma estabelecida pela ANAC. O requerente de uma emenda ao
  certificado de organização de produção, para adicionar uma aprovação de projeto ou modelo,
  ou ambos, deve atender aos requisitos aplicáveis das seções 21.607, 21.608 e 21.620.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
