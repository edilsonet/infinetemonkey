cite: 21.618(b)
title: 21.618(b)
text: '(b) O requerimento para esta aprovação de desvios deve ser submetido à ANAC junto com
  todos os dados pertinentes. Se o artigo é fabricado em outro país, o requerimento para aprovação
  do desvio, juntamente com todos os dados pertinentes devem ser submetidos à ANAC, através
  da autoridade de aviação civil daquele país.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
