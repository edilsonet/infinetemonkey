title: 21.621(d-I)
text: '(d)-I Uma carta de aprovação de projeto pode ser exigida pela ANAC quando for desejado
  que um artigo importado seja instalado em aeronave, motor ou hélice cujo detentor de projeto
  de tipo seja brasileiro.

  (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )'
