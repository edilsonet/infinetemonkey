title: 21.73(a)
text: (a) Qualquer pessoa brasileira, fabricante de uma aeronave no Brasil, pode requerer
  um certificado de tipo provisório de Classe I ou II, emendas a tais certificados e emendas
  provisórias a certificados de tipo de que seja detentora.
