title: 21.73(c)
text: (c) Qualquer pessoa brasileira, fabricante de motor de aeronave, que tenha alterado
  uma aeronave certificada através da instalação na mesma de motores certificados, fabricados
  por ela no Brasil, diferentes daqueles com que a aeronave foi originalmente certificada
  na categoria normal, acrobática, utilidade, transporte regional ou transporte pode requerer
  um certificado de tipo provisório Classe I para a aeronave ou emendas a tal certificado.
