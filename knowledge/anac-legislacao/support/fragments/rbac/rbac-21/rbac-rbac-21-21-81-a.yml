section_title: Requisitos para emissão de certificado de tipo provisório Classe I e de suas
  emendas
subsection_id: a
cite: 21.81(a)
title: 21.81(a)
text: (a) Exceto como previsto no parágrafo (b) desta seção, um requerente faz jus à emissão
  de certificado de tipo provisório Classe I, ou de emendas a tal certificado, se demonstrar
  cumprimento com os requisitos desta seção e se a ANAC julgar que não existe aspecto, característica
  ou condição que possa tornar a aeronave insegura, quando operada de acordo com as limitações
  estabelecidas no parágrafo (e) desta seção e de acordo com a seção 91.317 do RBHA 91, ou
  dispositivo correspondente do RBAC que venha a substituí-lo.
