subsection_id: g
cite: 21.81(g)
title: 21.81(g)
text: (g) O requerente deve demonstrar que um protótipo da aeronave voou um mínimo de 50 (cinquenta)
  horas sob um certificado de autorização de voo experimental emitido de acordo com as seções
  21.191 até 21.195 ou sob os auspícios das Forças Armadas do Brasil. No caso de uma emenda
  ao certificado de tipo provisório, a ANAC pode reduzir o número exigido de horas de voo.
