cite: 21.83(f)
title: 21.83(f)
text: '(f) O requerente ou, no caso de aeronave fabricada no exterior, o país no qual a aeronave
  foi fabricada deve declarar que:

  (1) a aeronave foi projetada e construída de acordo com os requisitos de aeronavegabilidade
  aplicáveis à emissão do certificado de tipo requerido para ela;

  (2) a aeronave satisfaz, substancialmente, aos requisitos de características de voo aplicáveis
  à emissão do certificado de tipo requerido para ela;

  (3) a aeronave pode ser operada com segurança de acordo com as limitações operacionais apropriadas
  estabelecidas segundo os RBAC aplicáveis.'
