section_title: Emendas provisórias a um certificado de tipo
subsection_id: e
cite: 21.85(e)
title: 21.85(e)
text: '(e) O requerente ou, no caso de aeronave fabricada no exterior, o país no qual a aeronave
  foi fabricada deve declarar que:

  (1) a modificação envolvida na emenda ao certificado de tipo foi projetada e construída
  de acordo com os requisitos de aeronavegabilidade aplicáveis à emissão do certificado de
  tipo da aeronave;

  (2) a aeronave satisfaz, substancialmente, aos requisitos de características de voo aplicáveis
  à emissão do certificado de tipo da aeronave; e

  (3) a aeronave pode ser operada com segurança de acordo com as limitações operacionais apropriadas
  estabelecidas segundo os RBAC aplicáveis.'
