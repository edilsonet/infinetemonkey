section_title: Emendas provisórias a um certificado de tipo
subsection_id: f
cite: 21.85(f)
title: 21.85(f)
text: (f) O requerente deve apresentar um relatório comprovando que a aeronave, incorporando
  as modificações envolvidas, foi operada em todas as manobras necessárias para demonstrar
  cumprimento com os requisitos de voos aplicáveis a tais modificações e para estabelecer
  que a aeronave pode ser operada com segurança de acordo com as limitações especificadas
  nas seções 91.317 do RBHA 91, ou dispositivo correspondente do RBAC 91, e 121.207 do RBAC
  121.
