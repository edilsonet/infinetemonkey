section_title: Emendas provisórias a um certificado de tipo
subsection_id: g
cite: 21.85(g)
title: 21.85(g)
text: (g) O requerente deve preparar e publicar em um manual de voo provisório, ou em outro
  documento e em placares apropriados, todas as limitações requeridas para a emissão de um
  certificado de tipo, incluindo as limitações de peso, de velocidade, de manobras, de carregamento
  e de operação dos controles e dos equipamentos, a menos que, para cada limitação não claramente
  estabelecida, restrições operacionais apropriadas à aeronave tenham sido estabelecidas.
