section_title: Artigos para reposição e modificação
subsection_id: a
cite: 21.9(a)
title: 21.9(a)
text: '(a) Se uma pessoa tem conhecimento, ou deveria ter, que um artigo de reposição ou modificação
  tem razoável probabilidade de ser instalado em um produto de tipo certificado, esta pessoa
  não pode produzir este artigo a menos que o artigo seja:

  (1) produzido sob um certificado de tipo;

  (2) produzido sob uma aprovação de produção;

  (3) uma peça padronizada (tal como parafuso, porca e rebite) produzida de acordo com especificações
  industriais e/ou governamentais reconhecidas pela ANAC;

  (4) uma parte comercial, conforme definido na seção 21.1;

  (5) produzido por um proprietário ou operador para a manutenção ou modificação do seu próprio
  produto;

  (6) fabricado por um detentor de certificado apropriadamente qualificado com um sistema
  da qualidade, e utilizado no reparo ou modificação de um produto ou artigo, em conformidade
  com o RBAC 43; ou

  (7) produzido de uma outra maneira aprovada pela ANAC. (

  Incluído pela Resolução nº 524, de 02.08.2019

  )'
