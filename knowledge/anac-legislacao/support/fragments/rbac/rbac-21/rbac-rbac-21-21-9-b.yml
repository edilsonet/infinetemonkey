title: 21.9(b)
text: (b) Exceto como previsto nos parágrafos (a)(1) até (a)(4) desta seção, uma pessoa que
  produz um artigo para reposição ou modificação para a venda não pode apresentar essa peça
  como adequada para a instalação em um produto de tipo certificado.
