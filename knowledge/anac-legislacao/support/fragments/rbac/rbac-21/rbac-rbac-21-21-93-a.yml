section_title: Classificação de modificações ao projeto de tipo
subsection_id: a
cite: 21.93(a)
title: 21.93(a)
text: (a) Adicionalmente às modificações ao projeto de tipo especificadas no parágrafo (b)
  desta seção, as modificações ao projeto de tipo são classificadas em grandes e pequenas.
  A “pequena modificação” é aquela que não tem apreciável efeito no peso, no balanceamento,
  na resistência estrutural, na confiabilidade, em características operacionais e em outras
  características que afetem a aeronavegabilidade do produto. Todas as demais modificações
  são “grandes modificações” (exceto como previsto no parágrafo (b) desta seção).
