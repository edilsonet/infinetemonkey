section_title: Classificação de modificações ao projeto de tipo
subsection_id: c
cite: 21.93(c)
title: 21.93(c)
text: '(c) Para os propósitos de cumprimento com o RBAC 34, qualquer modificação voluntária
  no projeto de tipo do avião ou do motor a qual possa aumentar emissão de combustível drenado
  e de escapamento de aviões é considerada uma “modificação de emissões”. (

  Redação dada pela Resolução nº 501, de 12.12.2018

  )'
