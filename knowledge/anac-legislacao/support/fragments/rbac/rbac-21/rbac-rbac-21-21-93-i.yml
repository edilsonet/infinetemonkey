cite: 21.93(i)
title: 21.93(i)
text: '(i) aqueles helicópteros que são projetados exclusivamente para:

  (A) operações agrícolas, conforme definido no parágrafo 137.3(a)(13) do RBAC 137; (

  Redação dada pela Resolução nº 364, de 20.10.2015

  )

  (B) dispersão de materiais de combate a incêndio; ou

  (C) transporte de carga externa, conforme definido no parágrafo 133.1(b) do RBAC 133;

  (ii) aqueles helicópteros modificados através de instalação ou remoção de equipamento externo.
  Para os propósitos deste parágrafo, “equipamento externo” significa qualquer instrumento,
  mecanismo, peça, componente, aparelho ou acessório que é fixado ao helicóptero ou se estende
  de seu exterior, mas não é nem pretendido para uso em operação ou controle do helicóptero
  em voo, nem é uma peça da fuselagem ou do motor. Para os helicópteros aos quais se aplica
  este parágrafo, as “modificações acústicas” não incluem:

  (A) a instalação ou remoção de equipamento externo;

  (B) modificações feitas na fuselagem para acomodar a instalação ou remoção de equipamento
  externo visando: prover meios de fixação de carga; facilitar o uso de equipamento externo
  ou de carga externa; ou facilitar a operação segura do helicóptero com o equipamento externo
  ou com a carga externa;

  (C) reconfiguração do helicóptero através da instalação ou remoção de flutuadores e esquis;

  (D) voo com uma ou mais portas e/ou janelas removidas ou em posição aberta; ou

  (E) quaisquer modificações nas limitações operacionais impostas ao helicóptero como consequência
  da instalação ou remoção de equipamento externo, flutuadores e esquis, ou como consequência
  de operação de voo com portas e/ou janelas removidas ou em posição aberta.

  (5) aeronaves de rotores basculantes (tiltrotors). (

  Incluído pela Resolução nº 615, de 08.04.2021

  )'
