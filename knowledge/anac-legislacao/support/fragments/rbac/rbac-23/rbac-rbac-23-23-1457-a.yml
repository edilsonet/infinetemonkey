section_title: Gravadores de voz de cabine
subsection_id: a
cite: 23.1457(a)
title: 23.1457(a)
text: '(a) Cada gravador de voz de cabine requerido

  pelos regulamentos operacionais deve ser apro-

  vado e deve ser instalado de maneira que regis-

  tre o seguinte:

  (1) Comunicações de voz transmitidas ou rece-

  bidas pela aeronave via rádio;

  (2) Comunicações de voz dos membros da tri-

  pulação de voo na cabine de comando;

  (3) Comunicações de voz dos membros da tri-

  pulação de voo na cabine de comando, utili-

  zando o sistema de interfone da aeronave;

  (4) Sinais de voz ou de áudio identificando

  auxílios de navegação ou aproximação repro-

  duzidos no fone de ouvido ou alto-falante da

  cabine;

  (5) Comunicações de voz dos membros da tri-

  pulação de voo utilizando o sistema de alto-

  falantes para passageiros, se este sistema existir

  e se o quarto canal estiver disponível de acordo

  com os requisitos do parágrafo (c)(4)(ii) desta

  seção;

  (6) Se um equipamento de comunicação por


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  installed, all datalink communications, using an

  approved data message set. Datalink messages

  must be recorded as the output signal from the

  communications unit that translates the signal

  into usable data.'
