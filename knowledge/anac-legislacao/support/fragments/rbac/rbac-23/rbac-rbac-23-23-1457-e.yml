section_title: Gravadores de voz de cabine
subsection_id: e
cite: 23.1457(e)
title: 23.1457(e)
text: '(e) O receptáculo do gravador deve estar loca-

  lizado e posicionado de forma a minimizar a

  probabilidade de ruptura do receptáculo como

  resultado de um impacto e consequentes danos

  causados pelo calor do fogo ao gravador.

  (1) Exceto o disposto no parágrafo (e)(2) desta

  seção, o receptáculo do gravador deve estar

  localizado na posição mais traseira possível,

  mas não precisa estar fora do compartimento

  pressurizado, e não pode estar localizado em

  região onde os motores possam esmagar o re-

  ceptáculo do gravador durante o impacto;

  (2) Se duas unidades combinadas distintas de

  gravação de dados de voo digital e de voz da

  cabine de comando estiverem instaladas, ao

  invés de um gravador de voz da cabine de co-


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  combination unit that is installed to comply

  with the cockpit voice recorder requirements

  may be located near the cockpit.'
