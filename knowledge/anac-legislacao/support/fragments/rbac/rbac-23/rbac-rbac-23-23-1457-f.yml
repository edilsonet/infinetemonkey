cite: 23.1457(f)
title: 23.1457(f)
text: '(f) Se o gravador de voz da cabine de comando

  possuir um dispositivo de apagamento em mas-

  sa, a instalação deve ser projetada para minimi-

  zar a probabilidade de operação inadvertida e

  atuação do dispositivo durante o impacto.'
