cite: 23.1457(g)
title: 23.1457(g)
text: '(g) Each recorder container must:

  (1) Be either bright orange or bright yellow;


  (2) Have reflective tape affixed to its external

  surface to facilitate its location under water;

  and

  (3) Have an underwater locating device, when

  required by the operating rules, on or adjacent

  to the container, which is secured in such man-

  ner that they are not likely to be separated dur-

  ing crash impact.

  mando e um gravador de dados de voo digital,

  a unidade combinada que estiver instalada para

  cumprir com os requisitos do gravador de voz

  da cabine de comando pode estar localizada

  próxima da cabine de comando.'
