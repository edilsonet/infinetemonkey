section_title: Gravadores de dados de voo.
subsection_id: d
cite: 23.1459(d)
title: 23.1459(d)
text: '(d) Cada receptáculo de gravador deve:

  (1) Ser de cor laranja brilhante ou amarela bri-

  lhante;

  (2) Ter uma fita reflexiva fixado na sua super-

  fície externa para facilitar a sua localização sob

  a água; e

  (3) Ter um dispositivo de localização subaquá-

  tica, quando requerido pelos regulamentos ope-

  racionais, sobre ou adjacente ao receptáculo do

  gravador, que seja preso de forma que não seja

  provável que sejam separados durante o impac-

  to.'
