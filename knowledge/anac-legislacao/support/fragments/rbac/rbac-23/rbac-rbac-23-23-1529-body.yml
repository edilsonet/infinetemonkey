text: '23.1529 Instruções para Aeronavegabilidade

  Continuada

  O requerente deve elaborar as Instruções para

  Aeronavegabilidade Continuada, de acordo

  com o apêndice A deste regulamento, que se-

  jam aceitáveis para a ANAC. As instruções

  podem estar incompletas na certificação de tipo

  se existir um programa para garantir a sua con-

  clusão antes da entrega do primeiro avião ou a


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  certificate of airworthiness, whichever occurs

  later.

  emissão de um certificado de aeronavegabili-

  dade padrão, o que ocorrer mais tarde.


  SUBPART A

  GENERAL

  SUBPARTE A

  GERAL'
