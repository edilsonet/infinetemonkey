cite: 23.2000(b)
title: 23.2000(b)
text: '(b) Para os propósitos desse regulamento, as

  seguintes definições são aplicáveis:

  Continuação segura do voo e pouso significa

  que um avião é capaz de continuar o voo e o

  pouso controlados, possivelmente usando pro-

  cedimentos de emergência, sem exigir habili-

  dade ou força excepcionais do piloto. Ao pou-

  sar, alguns danos podem ocorrer no avião como

  resultado de uma condição de falha.'
