cite: 23.2005(a)
title: 23.2005(a)
text: '(a) A certificação na categoria normal se aplica

  aos aviões com configuração para 19 ou menos

  assentos para passageiros e um peso máximo

  de decolagem certificado de 19.000 lbs (8.618

  kg) ou menos.'
