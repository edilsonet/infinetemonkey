title: 23.2005(b)
text: '(b) Os níveis de certificação para avião são:

  (1) Nível 1: Para aviões com uma capacidade

  máxima de 0 a 1 assentos para passageiros;

  (2) Nível 2: Para aviões com uma capacidade

  máxima de 2 a 6 assentos para passageiros;

  (3) Nível 3: Para aviões com uma capacidade

  máxima de 7 a 9 assentos para passageiros;

  (4) Nível 4: Para aviões com uma capacidade

  máxima de 10 a 19 assentos para passageiros.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
