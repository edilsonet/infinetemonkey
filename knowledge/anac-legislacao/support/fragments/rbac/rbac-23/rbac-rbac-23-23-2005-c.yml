cite: 23.2005(c)
title: 23.2005(c)
text: '(c) Os níveis de desempenho do avião são:

  (1) Baixa velocidade: para aeronaves cuja VNO

  e VMO sejam menores ou iguais a 250 nós

  (128,6 m/s) em Velocidade Calibrada (KCAS)

  e uma Mmo menor ou igual a 0,6;

  (2) Alta velocidade: para aeronaves cuja VNO e

  VMO sejam maiores que 250 nós (128,6 m/s)

  em Velocidade Calibrada (KCAS) ou uma

  MMO maior que 0,6.'
