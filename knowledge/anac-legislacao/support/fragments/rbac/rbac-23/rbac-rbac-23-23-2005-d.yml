cite: 23.2005(d)
title: 23.2005(d)
text: '(d) Aviões não certificados para acrobacias

  podem ser utilizados para realizar qualquer

  manobra incidente ao voo normal, incluindo:

  (1) Estol (exceto estol de badalo); e

  (2) Oitos preguiçosos, chandelles e curvas

  acentuadas nas quais os ângulos não sejam

  maiores que 60 graus.'
