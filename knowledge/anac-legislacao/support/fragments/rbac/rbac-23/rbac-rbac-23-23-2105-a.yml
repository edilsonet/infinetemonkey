title: 23.2105(a)
text: '(a) Unless otherwise prescribed, an airplane

  must meet the performance requirements of

  this subpart in:

  (1) Still air and standard atmospheric condi-

  tions at sea level for all airplanes; and

  (2) Ambient atmospheric conditions within the

  operating envelope for levels 1 and 2 high-

  speed and levels 3 and 4 airplanes.'
