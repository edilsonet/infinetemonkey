cite: 23.2105(b)
title: 23.2105(b)
text: '(b) Salvo disposição em contrário, o requerente

  deve desenvolver os dados de desempenho

  requeridos por esta subparte para as seguintes

  condições:

  (1) Aeroportos com altitudes do nível do mar

  até 10.000 pés (3.048 metros); e

  (2) Temperaturas acima e abaixo do standard

  day temperature que estejam dentro das limita-

  ções operacionais, se aquelas temperaturas pu-

  derem ter um efeito negativo no desempenho.'
