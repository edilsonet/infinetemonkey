title: 23.2105(c)
text: '(c) Os procedimentos utilizados para determi-

  nar as distâncias de decolagem e pouso devem

  ser executáveis de forma consistente por pilo-

  tos de habilidade mediana nas condições at-

  mosféricas que se espera encontrar em serviço.'
