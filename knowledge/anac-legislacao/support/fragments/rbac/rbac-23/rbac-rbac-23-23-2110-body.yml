title: Velocidade de estol.
text: '23.2110 Velocidade de estol.

  O requerente deve determinar a velocidade de

  estol do avião ou a velocidade mínima de voo

  estabilizado para cada configuração de voo

  utilizada durante operações normais da aerona-

  ve, incluindo decolagem, subida, cruzeiro, des-

  cida, aproximação e pouso. A determinação da

  velocidade de estol ou da velocidade mínima

  de voo estabilizado deve levar em conta as

  condições mais adversas de cada configuração

  de voo com potência configurada em:'
