cite: 23.2115(a)
title: 23.2115(a)
text: '(a) O requerente deve determinar o desempe-

  nho de decolagem da aeronave levando em

  conta:

  (1) Margens de segurança para velocidade de

  estol;

  (2) Velocidades mínimas de controle; e

  (3) Gradientes de subida.'
