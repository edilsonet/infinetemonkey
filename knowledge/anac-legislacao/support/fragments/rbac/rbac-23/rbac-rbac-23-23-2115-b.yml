section_title: Desempenho de decolagem.
subsection_id: b
cite: 23.2115(b)
title: 23.2115(b)
text: '(b) Para aviões monomotores e aviões níveis 1,

  2 e 3 multimotores de baixa velocidade, o de-

  sempenho de decolagem inclui a determinação

  da rolagem no solo e a distância inicial de su-

  bida até 50 pés (15 metros) acima da superfície

  de decolagem.'
