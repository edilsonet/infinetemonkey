cite: 23.2115(c)
title: 23.2115(c)
text: '(c) Para aviões multimotores de alta velocidade

  dos níveis 1, 2 e 3 e os aviões multimotores de


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  planes, takeoff performance includes a deter-

  mination the following distances after a sudden

  critical loss of thrust:

  (1) An aborted takeoff at critical speed;


  (2) Ground roll and initial climb to 35 feet (11

  meters) above the takeoff surface; and

  (3) Net takeoff flight path.

  nível 4, o desempenho de decolagem inclui

  determinação das seguintes distâncias após

  uma súbita perda crítica de empuxo:

  (1) Uma decolagem interrompida na velocidade

  crítica;

  (2) Rolagem e subida inicial até 35 pés (11

  metros) acima da superfície de decolagem; e

  (3) Trajetória líquida de decolagem.'
