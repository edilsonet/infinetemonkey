section_title: Requisitos de subida.
subsection_id: a
cite: 23.2120(a)
title: 23.2120(a)
text: '(a) Com todos os motores operantes e na confi-

  guração inicial de subida:

  (1) Para os aviões níveis 1 e 2 de baixa veloci-

  dade, um gradiente de subida de 8,3 por cento

  para aviões terrestres e 6,7 por cento para hi-

  droaviões e anfíbios; e

  (2) Para os aviões níveis 1 e 2 de alta velocida-

  de, todos os aviões de nível 3, e aviões nível 4

  monomotores, um gradiente de subida após a

  decolagem de 4 por cento.'
