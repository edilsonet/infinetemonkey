cite: 23.2125(a)
title: 23.2125(a)
text: '(a) O requerente deve determinar o desempe-

  nho de subida em cada peso, altitude, e tempe-

  ratura ambiente dentro das limitações operaci-

  onais:

  (1) Para todos os aviões monomotores;

  (2) Para os aviões níveis 1 e 2 multimotores de

  alta velocidade e os aviões nível 3 multimoto-

  res, após uma perda crítica de empuxo na deco-

  lagem na configuração inicial de subida; e

  (3) Para todos os aviões multimotores, durante

  a fase de voo em rota com todos os motores

  operando e após uma perda crítica de empuxo

  na configuração do cruzeiro.'
