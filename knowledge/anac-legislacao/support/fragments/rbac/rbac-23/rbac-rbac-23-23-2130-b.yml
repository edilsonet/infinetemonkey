title: 23.2130(b)
text: '(b) As velocidades de aproximação e pouso,

  configurações e procedimentos que permitam a

  um piloto de habilidade mediana pousar de

  forma consistente dentro da distância de pouso

  publicada e sem causar danos ou lesões, e que

  permita uma transição segura para as condições

  de arremetida deste regulamento levando em

  conta:

  (1) Margem de segurança da velocidade de

  estol; e

  (2) Velocidades mínimas de controle.


  FLIGHT CHARACTERISTICS

  CARACTERÍSTICAS DE VOO'
