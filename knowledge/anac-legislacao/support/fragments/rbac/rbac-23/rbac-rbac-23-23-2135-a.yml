cite: 23.2135(a)
title: 23.2135(a)
text: '(a) O avião deve ser controlável e manobrável,

  sem exigir habilidade, percepção ou força de

  pilotagem excepcionais, dentro do envelope

  operacional:

  (1) Em todas as condições de carregamento

  para as quais a certificação é requerida;

  (2) Durante todas as fases de voo;

  (3) Com falha provável nos controles de voo

  reversíveis ou no sistema de propulsão; e

  (4) Durante as mudanças de configuração.'
