cite: 23.2135(b)
title: 23.2135(b)
text: '(b) O avião deve ser capaz de completar um

  pouso sem causar danos substanciais ou lesões

  graves usando o procedimento aprovado para

  aproximação com o gradiente de descida mais

  acentuado e proporcionando uma margem ra-

  zoável abaixo da Vref ou acima do ângulo de

  ataque de aproximação.'
