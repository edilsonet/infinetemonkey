title: 23.2135(d)
text: '(d) Se o requerente solicitar a certificação de

  um avião para acrobacias aéreas, o requerente

  deve demonstrar aquelas manobras acrobáticas

  para as quais a certificação é solicitada e de-

  terminar as velocidades de entrada.'
