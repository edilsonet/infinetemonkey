cite: 23.2140(a)
title: 23.2140(a)
text: '(a) O avião deve manter a compensação lateral

  e direcional sem força ou movimentos adicio-

  nais sobre os controles primários de voo ou os

  controles dos compensadores correspondentes

  pelo piloto, ou pelo sistema de controle de voo,

  nas seguintes condições:

  (1) Para aviões níveis 1, 2 e 3 em cruzeiro.

  (2) Para aviões nível 4 em operações normais.'
