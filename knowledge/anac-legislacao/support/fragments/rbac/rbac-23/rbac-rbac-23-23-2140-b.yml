cite: 23.2140(b)
title: 23.2140(b)
text: '(b) O avião deve manter a compensação longi-

  tudinal sem força ou movimentos adicionais

  sobre os controles primários de voo ou os con-

  troles dos compensadores correspondentes pelo

  piloto, ou pelo sistema de controle de voo, nas

  seguintes condições:

  (1) Subida.

  (2) Voo nivelado.

  (3) Descida.

  (4) Aproximação.'
