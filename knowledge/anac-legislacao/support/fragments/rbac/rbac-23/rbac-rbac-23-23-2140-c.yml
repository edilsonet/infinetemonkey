title: 23.2140(c)
text: '(c) Forças de controle residuais não devem

  fatigar ou distrair o piloto durante as operações

  normais do avião e em prováveis operações

  anormais ou de emergência, incluindo perda

  crítica de empuxo em aviões multimotores.'
