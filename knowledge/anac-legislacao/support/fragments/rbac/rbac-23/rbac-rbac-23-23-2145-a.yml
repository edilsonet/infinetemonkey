cite: 23.2145(a)
title: 23.2145(a)
text: '(a) Aviões não certificados para acrobacias

  devem:


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  (1) Have static longitudinal, lateral, and direc-

  tional stability in normal operations;

  (2) Have dynamic short period and Dutch roll

  stability in normal operations; and

  (3) Provide stable control force feedback

  throughout the operating envelope.'
