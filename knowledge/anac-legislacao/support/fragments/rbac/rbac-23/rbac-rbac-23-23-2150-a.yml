cite: 23.2150(a)
title: 23.2150(a)
text: '(a) The airplane must have controllable stall

  characteristics in straight flight, turning flight,

  and accelerated turning flight with a clear and

  distinctive stall warning that provides sufficient

  margin to prevent inadvertent stalling.'
