section_title: Stall characteristics, stall warning,
subsection_id: d
cite: 23.2150(d)
title: 23.2150(d)
text: '(d) Airplanes certified for aerobatics that in-

  clude spins must have controllable stall charac-

  teristics and the ability to recover within one

  and one-half additional turns after initiation of

  the first control action from any point in a spin,

  not exceeding six turns or any greater number

  of turns for which certification is requested,

  while remaining within the operating limita-

  tions of the airplane.'
