section_title: Vibration, buffeting, and high-speed
subsection_id: a
cite: 23.2160(a)
title: 23.2160(a)
text: '(a) Vibration and buffeting, for operations up

  to VD/MD, must not interfere with the control of

  the airplane or cause excessive fatigue to the

  flightcrew. Stall warning buffet within these

  limits is allowable.'
