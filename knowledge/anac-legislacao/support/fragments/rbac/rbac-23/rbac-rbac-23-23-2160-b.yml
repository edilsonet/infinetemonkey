cite: 23.2160(b)
title: 23.2160(b)
text: '(b) Para aviões de alta velocidade e todos os

  aviões com uma altitude máxima de operação

  superior a 25.000 pés (7.620 metros) de altitude

  pressão, não deve haver buffeting perceptível

  na configuração de cruzeiro em 1g e a qualquer

  velocidade até VMO/MMO, exceto buffeting de

  estol.'
