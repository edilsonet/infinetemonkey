cite: 23.2160(c)
title: 23.2160(c)
text: '(c) Para aviões de alta velocidade, o requerente

  deve determinar os fatores de carga de manobra

  positivos nos quais ocorre o início do buffet

  perceptível na configuração de cruzeiro dentro

  do envelope operacional. Possíveis excursões

  inadvertidas para além deste limite não devem

  resultar em danos estruturais.'
