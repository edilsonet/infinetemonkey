text: '(d) Aviões de alta velocidade devem ter carac-

  terísticas de recuperação que não resultem em

  danos estruturais ou perda de controle, come-

  çando em qualquer velocidade provável até


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  likely speed up to VMO/MMO, following:

  (1) An inadvertent speed increase; and

  (2) A high-speed trim upset for airplanes where

  dynamic pressure can impair the longitudinal

  trim system operation.

  VMO/MMO, após:

  (1) Um aumento de velocidade inadvertido; e

  (2) Um disparo inadvertido de compensador

  para aviões onde a pressão dinâmica possa pre-

  judicar a operação do sistema de compensação

  longitudinal.'
