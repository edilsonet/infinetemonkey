text: '(a) Um requerente que solicite certificação para

  voo em condições de gelo definidas na Parte 1

  do Apêndice C do RBAC 25, ou um requerente

  que solicite certificação para voo nestas condi-

  ções de gelo e qualquer condição atmosférica

  de gelo adicional, deve demonstrar o seguinte,

  nas condições de gelo para as quais a certifica-

  ção é requerida soboperações normais do(s)

  sistema(s) de proteção contra gelo:

  (1) Cumprimento com cada requisito desta

  subparte, exceto aqueles aplicáveis a parafusos

  e qualquer outro que precise ser demonstrado a

  velocidades superiores a:'
