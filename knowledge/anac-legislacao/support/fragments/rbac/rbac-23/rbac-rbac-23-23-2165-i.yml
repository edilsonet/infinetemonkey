cite: 23.2165(i)
title: 23.2165(i)
text: '(i) 250 nós (128,6 m/s) CAS;

  (ii) VMO/MMO ou VNE; ou

  (iii) Uma velocidade na qual o requerente de-

  monstre que as estruturas não terão acúmulo de

  gelo.

  (2) O meio pelo qual o alarme de estol é forne-

  cido ao piloto para voo em condições de for-

  mação de gelo e fora de condições de formação

  de gelo seja o mesmo.'
