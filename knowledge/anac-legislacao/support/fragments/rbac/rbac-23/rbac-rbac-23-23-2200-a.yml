cite: 23.2200(a)
title: 23.2200(a)
text: '(a) Velocidades de projeto estrutural, velocida-

  des de descida para pouso, e qualquer limitação

  de velocidade no ar a qual o requerente deva

  mostrar cumprimento com os requisitos desta

  subparte. As velocidades de projeto estrutural

  devem:

  (1) Ser suficientemente maiores que a veloci-

  dade de estol do avião para prevenir a perda de

  controle em ar turbulento; e

  (2) Fornecer margens suficientes para o estabe-

  lecimento de velocidades limites operacionais

  praticáveis.'
