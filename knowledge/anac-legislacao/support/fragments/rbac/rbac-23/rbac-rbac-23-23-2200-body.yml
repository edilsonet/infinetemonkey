text: '23.2200 Envelope de projeto estrutural.

  O requerente deve determinar o envelope de

  projeto estrutural, o qual descreve a extensão e

  os limites de projeto do avião e os parâmetros

  operacionais para os quais o requerente de-

  monstrará cumprimento com os requisitos desta

  subparte. O requerente deve considerar todo o

  projeto do avião e os parâmetros operacionais

  que afetem cargas estruturais, resistências, du-

  rabilidade e aeroelasticidade, incluindo:'
