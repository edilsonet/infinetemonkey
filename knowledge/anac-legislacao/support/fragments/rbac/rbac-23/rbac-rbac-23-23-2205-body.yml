title: Interação entre sistemas e estrutu-
text: '23.2205 Interação entre sistemas e estrutu-

  ras.

  Para aviões equipados com sistemas que modi-

  ficam o desempenho estrutural, aliviam o im-

  pacto dos requisitos desta subparte, ou proveem

  um meio de cumprimento com esta subparte, o

  requerente deve levar em conta a influência e

  as falhas desses sistemas quando mostrando

  cumprimento com os requisitos desta subparte.


  STRUCTURAL LOADS

  CARGAS ESTRUTURAIS'
