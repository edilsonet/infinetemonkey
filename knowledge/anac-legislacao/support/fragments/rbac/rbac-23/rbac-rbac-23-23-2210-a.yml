section_title: Cargas estruturais de projeto.
subsection_id: a
cite: 23.2210(a)
title: 23.2210(a)
text: '(a) O requerente deve:

  (1) Determinar as cargas estruturais de projeto

  aplicáveis resultantes da aplicação de pressões,

  forças ou momentos prováveis, externos ou

  internos, que podem ocorrer em operações de

  voo, solo e água, controle em solo e em água, e

  enquanto o avião está estacionado ou atracado.

  (2) Determinar as cargas requeridas pelo pará-

  grafo (a)(1) desta seção em todas combinações

  críticas de parâmetros, sobre e dentro dos limi-

  tes do envelope de projeto estrutural.'
