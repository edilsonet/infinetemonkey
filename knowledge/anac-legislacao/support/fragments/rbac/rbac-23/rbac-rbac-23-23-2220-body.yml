text: '23.2220 Condições para determinação das

  cargas no solo e na água.

  O requerente deve determinar as cargas estrutu-

  rais de projeto resultantes das condições no

  táxi, decolagem, pouso e controle sobre as su-

  perfícies aplicáveis nas configurações e atitu-

  des normais e adversas.'
