cite: 23.2225(a)
title: 23.2225(a)
text: '(a) Cada estrutura de fixação do motor e suas

  estruturas de suporte de modo que ambas sejam

  projetadas para suportar as cargas resultantes

  de:

  (1) Operação do grupo motopropulsor combi-

  nado com as cargas de rajada e manobras; e

  (2) Para motores não convencionais, parada

  súbita do grupo motopropulsor.'
