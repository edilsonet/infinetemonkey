section_title: Durabilidade estrutural.
subsection_id: a
cite: 23.2240(a)
title: 23.2240(a)
text: '(a) O requerente deve desenvolver e implemen-

  tar inspeções ou outros procedimentos para

  prevenir falhas estruturais devido a causas pre-

  visíveis de degradação de resistência, as quais

  poderiam resultar em danos sérios ou fatais, ou

  longos períodos de operação com margens de

  segurança reduzidas. Cada uma das inspeções

  ou outros procedimentos desenvolvidos sob

  esta seção devem ser incluídos na seção de

  Limitações de Aeronavegabilidade das Instru-

  ções de Aeronavegabilidade Continuada reque-

  rida pela seção 23.1529.'
