title: 23.2240(c)
text: '(c) Para aviões pressurizados:

  (1) O avião deve ser capaz de continuar o voo e

  pousar seguramente após uma despressurização

  súbita da cabine, incluindo despressurizações

  súbitas causadas pelas falhas de porta ou jane-

  la.

  (2) Para aviões com altitude máxima de opera-

  ção maior que 41.000 pés (12.497 metros), os

  procedimentos desenvolvidos para cumprir

  com o parágrafo (a) desta seção devem ser ca-


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  detecting damage to the pressurized cabin

  structure before the damage could result in rap-

  id decompression that would result in serious

  or fatal injuries.'
