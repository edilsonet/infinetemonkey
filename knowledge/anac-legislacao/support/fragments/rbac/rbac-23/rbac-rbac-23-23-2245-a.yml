cite: 23.2245(a)
title: 23.2245(a)
text: '(a) O avião deve ser livre de flutter, reversões

  de controles e divergências:

  (1) Em todas velocidades dentro e suficiente-

  mente além do envelope estrutural de projeto;

  (2) Para qualquer configuração e condição de

  operação;

  (3) Levando em conta os graus de liberdade

  críticos; e

  (4) Levando em conta quaisquer falhas ou mau

  funcionamentos críticos.'
