cite: 23.2255(a)
title: 23.2255(a)
text: '(a) O requerente deve proteger cada peça do

  avião, incluindo pequenas peças como fixado-

  res, contra deterioração ou perda de resistência

  devido a qualquer causa que seja provável de

  ocorrer no ambiente operacional esperado.'
