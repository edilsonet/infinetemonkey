cite: 23.2260(a)
title: 23.2260(a)
text: '(a) O requerente deve determinar a adequabili-

  dade e durabilidade dos materiais utilizados nas

  peças, artigos e montagens, levando em consi-

  deração os efeitos das prováveis condições

  ambientais esperadas em serviço, cuja falha

  poderia impedir a continuação do voo e pouso

  seguros.'
