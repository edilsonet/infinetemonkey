title: 23.2260(b)
text: '(b) Os métodos e processos de fabricação e

  montagem usados devem produzir estruturas

  consistentes com o projetado. Se um processo

  de fabricação requerer controles rígidos para

  alcançar este objetivo, o requerente deve exe-

  cutar o processo sob uma especificação de pro-

  cesso aprovada.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
