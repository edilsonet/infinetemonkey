cite: 23.2260(c)
title: 23.2260(c)
text: '(c) Exceto como mencionado nos parágrafos (f)

  e (g) desta seção, o requerente deve selecionar

  valores de projeto que garantam a resistência

  do material com probabilidades que levem em

  conta a criticalidade dos elementos estruturais.

  Os valores de projeto devem levar em conta a

  probabilidade de falha estrutural devido à vari-

  abilidade do material.'
