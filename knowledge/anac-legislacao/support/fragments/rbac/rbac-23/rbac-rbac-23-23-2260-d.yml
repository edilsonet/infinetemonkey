title: 23.2260(d)
text: '(d) Se as propriedades de resistência do materi-

  al forem requeridas, uma determinação daque-

  las propriedades deve ser baseada em testes

  suficientes do material cumprindo as especifi-

  cações, para estabelecer valores de projeto com

  uma base estatística.'
