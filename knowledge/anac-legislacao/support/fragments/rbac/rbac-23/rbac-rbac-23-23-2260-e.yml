title: 23.2260(e)
text: '(e) Se efeitos térmicos são significantes em um

  componente crítico ou estrutura sob condições

  normais de operação, o requerente deve deter-

  minar aqueles efeitos nos estresses admissíveis

  usados para o projeto.'
