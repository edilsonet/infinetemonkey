title: 23.2260(f)
text: '(f) Os valores de projeto, maiores que os míni-

  mos especificados por esta seção, podem ser

  usados, somente onde os valores mínimos ga-

  rantidos são normalmente permitidos, se uma

  amostra de cada item individual for testada

  antes do uso para determinar que as proprieda-

  des de resistência reais desse item em particular

  serão iguais ou excedem aqueles usados no

  projeto.'
