section_title: Fatores especiais de segurança.
subsection_id: a
cite: 23.2265(a)
title: 23.2265(a)
text: '(a) O requerente deve determinar um fator es-

  pecial de segurança para cada valor de projeto

  crítico de cada peça, artigo ou montagem para

  os quais o valor crítico de projeto é incerto, e

  para cada peça, artigo ou montagem que seja:

  (1) Provavelmente deteriorado em serviço antes

  de uma troca normal; ou

  (2) Sujeito a apreciável variabilidade devido a


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  of uncertainties in manufacturing processes or

  inspection methods.'
