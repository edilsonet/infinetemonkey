cite: 23.2265(c)
title: 23.2265(c)
text: '(c) O requerente deve multiplicar o maior fator

  especial de segurança pertinente no projeto em

  cada parte da estrutura por cada carga limite e

  final, ou somente carga final se não houver

  carga limite correspondente, como ocorre com

  as cargas de condições de emergência.


  STRUCTURAL OCCUPANT

  PROTECTION

  PROTEÇÃO ESTRUTURAL DOS

  OCUPANTES'
