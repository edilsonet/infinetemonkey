cite: 23.2270(a)
title: 23.2270(a)
text: '(a) O avião, mesmo quando danificado em um

  pouso de emergência, deve proteger cada ocu-

  pante contra lesões que impediriam a evacua-

  ção quando:

  (1) Usar corretamente o equipamento de segu-

  rança e os recursos previstos no projeto;

  (2) O ocupante experimentar as cargas estáticas

  finais de inércia prováveis de ocorrerem em um

  pouso de emergência; e

  (3) Itens de massa, incluindo motores ou uni-

  dades de potência auxiliar (APUs), dentro ou

  atrás da cabine, que possam ferir um ocupante,

  quando experimentando as cargas finais de

  inércia prováveis de ocorrerem em um pouso

  de emergência.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
