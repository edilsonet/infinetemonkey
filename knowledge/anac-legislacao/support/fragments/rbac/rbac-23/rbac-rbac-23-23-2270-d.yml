section_title: Condições de emergência.
subsection_id: d
cite: 23.2270(d)
title: 23.2270(d)
text: '(d) Cada sistema de proteção do ocupante deve

  exercer sua função pretendida e não criar um

  perigo que poderia causar um ferimento secun-

  dário em um ocupante. O sistema de proteção

  do ocupante não deve impedir a saída do ocu-

  pante ou interferir com a operação do avião

  quando não estiver em uso.'
