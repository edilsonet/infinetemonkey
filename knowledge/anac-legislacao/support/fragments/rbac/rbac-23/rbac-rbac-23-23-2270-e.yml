cite: 23.2270(e)
title: 23.2270(e)
text: '(e) Cada compartimento de bagagem e de carga

  deve:

  (1) Ser projetado para o peso máximo dos con-

  teúdos e para distribuições de cargas críticas

  nos fatores de carga máximos correspondentes

  às condições de voo e solo determinadas por

  este regulamento;

  (2) Ter meios de prevenir que o conteúdo do

  compartimento venha a se tornar perigoso, por

  impacto com o ocupante ou por deslocamento;

  e

  (3) Proteger quaisquer controles, fiações, li-

  nhas, equipamentos ou acessórios, cuja falha

  ou dano afetariam as operações seguras.


  SUBPART D

  DESIGN AND CONSTRUCTION

  SUBPARTE D

  PROJETO E CONSTRUÇÃO'
