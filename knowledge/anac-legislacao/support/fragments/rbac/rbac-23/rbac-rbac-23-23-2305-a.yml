cite: 23.2305(a)
title: 23.2305(a)
text: '(a) O trem de pouso deve ser projetado para:

  (1) Fornecer suporte e controle estáveis ao avi-

  ão durante a operação em superfície; e

  (2) Levar em conta possíveis falhas no sistema

  e prováveis ambientes de operação (incluindo

  extrapolação das limitações previstas e proce-

  dimentos de emergência).'
