title: 23.2305(c)
text: '(c) For airplanes that have a system that actu-

  ates the landing gear, there is:

  (1) A positive means to keep the landing gear

  in the landing position; and

  (2) An alternative means available to bring the

  landing gear in the landing position when a

  non-deployed system position would be a haz-

  ard.

  levar em conta essa energia cinética adicional.'
