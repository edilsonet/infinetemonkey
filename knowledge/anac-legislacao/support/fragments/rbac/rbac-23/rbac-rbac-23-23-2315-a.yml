cite: 23.2315(a)
title: 23.2315(a)
text: '(a) Com a cabine configurada para decolagem

  ou pouso, o avião deve ser projetado para:

  (1) Facilitar a evacuação rápida e segura do

  avião em condições susceptíveis de ocorrer

  após um pouso de emergência, excluindo pouso

  na água para os aviões de nível 1, nível 2 e

  monomotores de nível 3.

  (2) Ter meios de saída (aberturas, saídas ou

  saídas de emergência) que possam ser facil-

  mente localizados e abertos de dentro e de fora.

  Os métodos de abertura devem ser simples e


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  and marked inside and outside the airplane.

  (3) Have easy access to emergency exits when

  present.'
