section_title: Ambiente físico para o ocupante.
subsection_id: a
cite: 23.2320(a)
title: 23.2320(a)
text: '(a) O requerente deve projetar o avião para:

  (1) Permitir comunicação clara entre a tripula-

  ção de voo e os passageiros;

  (2) Proteger o piloto e os controles de voo, das

  hélices; e

  (3) Proteger os ocupantes de ferimentos graves

  devido a danos nos para-brisas, janelas e cano-

  pies.'
