cite: 23.2320(b)
title: 23.2320(b)
text: '(b) For level 4 airplanes, each windshield and

  its supporting structure directly in front of the

  pilot must withstand, without penetration, the

  impact equivalent to a two-pound bird when

  the velocity of the airplane is equal to the air-

  plane''s maximum approach flap speed.'
