title: 23.2320(d)
text: '(d) Se um sistema de pressurização estiver ins-

  talado no avião, ele deve ser projetado para

  proteger contra:

  (1) Descompressão para um nível inseguro; e

  (2) Pressão diferencial excessiva.'
