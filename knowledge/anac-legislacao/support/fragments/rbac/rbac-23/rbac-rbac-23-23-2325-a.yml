cite: 23.2325(a)
title: 23.2325(a)
text: '(a) Os seguintes materiais devem ser autoex-

  tinguíveis:

  (1) Isolamento de fios elétricos e cabos elétri-

  cos;

  (2) Para aviões níveis 1, 2 e 3, materiais nos

  compartimentos de bagagem e de carga inaces-

  síveis em voo; e

  (3) Para aviões nível 4, materiais na cabine de

  comando, cabine de passageiros e nos compar-

  timentos de carga e bagagem.'
