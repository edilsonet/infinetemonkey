title: 23.2325(b)
text: '(b) The following materials must be flame re-

  sistant:

  (1) For levels 1, 2 and 3 airplanes, materials in

  each compartment accessible in flight; and

  (2) Any equipment associated with any electri-

  cal cable installation and that would overheat in

  the event of circuit overload or fault.'
