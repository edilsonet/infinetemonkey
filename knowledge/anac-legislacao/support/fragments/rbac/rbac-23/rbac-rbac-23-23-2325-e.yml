title: 23.2325(e)
text: '(e) Para os aviões de nível 4, cada comparti-

  mento de bagagem e de carga deve:

  (1) Estar localizado onde o fogo seria visível


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  the pilots, or equipped with a fire detection

  system and warning system; and

  (2) Be accessible for the manual extinguishing

  of a fire, have a built-in fire extinguishing sys-

  tem, or be constructed and sealed to contain

  any fire within the compartment.'
