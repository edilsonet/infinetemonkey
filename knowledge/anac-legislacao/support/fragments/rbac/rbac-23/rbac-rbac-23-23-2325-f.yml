section_title: Proteção contra fogo.
subsection_id: f
cite: 23.2325(f)
title: 23.2325(f)
text: '(f) Deve haver um meio para extinguir qual-

  quer fogo na cabine, de modo que:

  (1) O piloto, enquanto sentado, possa acessar

  facilmente os meios de extinção de fogo; e

  (2) Para aviões de níveis 3 e 4, os passageiros

  tenham meios de extinção de fogo disponíveis

  no compartimento dos passageiros.'
