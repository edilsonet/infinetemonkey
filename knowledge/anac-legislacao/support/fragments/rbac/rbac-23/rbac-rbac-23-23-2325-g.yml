section_title: Proteção contra fogo.
subsection_id: g
cite: 23.2325(g)
title: 23.2325(g)
text: '(g) Cada área em que fluidos inflamáveis ou

  vapores possam escapar por vazamento de um

  sistema de fluidos deve:

  (1) Ser definido como tal; e

  (2) Ter um meio para minimizar a probabilida-

  de de ignição do fluido e vapor, e o perigo re-

  sultante, se a ignição ocorrer.'
