text: '(h) Combustion heater installations must be

  protected from uncontained fire.

  para os pilotos, ou equipado com um sistema

  de detecção de fogo e sistema de alerta; e

  (2) Ser acessível para a extinção manual de

  fogo, tenha um sistema de extinção de fogo

  embutido ou seja construído e selado para con-

  ter qualquer fogo dentro do compartimento.'
