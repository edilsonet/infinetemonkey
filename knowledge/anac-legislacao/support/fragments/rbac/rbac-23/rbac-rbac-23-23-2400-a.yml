title: 23.2400(a)
text: '(a) Para a finalidade desta subparte, a instala-

  ção do grupo motopropulsor do avião deve

  incluir cada componente necessário para pro-

  pulsão que afete a segurança da propulsão ou

  forneça energia auxiliar ao avião.'
