cite: 23.2400(b)
title: 23.2400(b)
text: '(b) Cada motor e hélice do avião deve ser de

  tipo certificado, exceto para motores e hélices

  instalados em aviões de baixa velocidade de

  nível 1, que podem ser aprovados sob o certifi-

  cado de tipo do avião de acordo com um pa-

  drão aceito pela ANAC que contenha critérios

  de aeronavegabilidade que a ANAC considerou

  adequados e aplicáveis ao projeto específico e

  ao uso pretendido do motor ou da hélice, e for-

  neça um nível de segurança aceitável para a

  ANAC.'
