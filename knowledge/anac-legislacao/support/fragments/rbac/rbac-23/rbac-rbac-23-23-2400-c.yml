section_title: Instalação do grupo motopropulsor.
subsection_id: c
cite: 23.2400(c)
title: 23.2400(c)
text: '(c) O requerente deve construir e organizar

  cada instalação do grupo motopropulsor levan-

  do em conta:

  (1) Condições de operação prováveis, incluindo

  ameaças de objetos estranhos;

  (2) Espaçamento suficiente de peças móveis

  para outras partes do avião e seus arredores;

  (3) Perigos prováveis na operação, incluindo os

  perigos para o pessoal em terra; e

  (4) Vibração e fadiga.'
