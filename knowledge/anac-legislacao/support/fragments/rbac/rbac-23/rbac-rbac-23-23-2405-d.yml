cite: 23.2405(d)
title: 23.2405(d)
text: '(d) A menos que a falha de um sistema automá-

  tico de controle de potência ou de empuxo seja

  extremamente remota, o sistema deve:

  (1) Fornecer um meio para a tripulação de voo

  verificar se o sistema está em uma condição

  operacional;

  (2) Fornecer um meio para que a tripulação de

  voo sobreponha a função automática; e

  (3) Impedir a desativação inadvertida do siste-

  ma.'
