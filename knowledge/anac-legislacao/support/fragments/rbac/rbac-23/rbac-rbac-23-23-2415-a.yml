title: 23.2415(a)
text: '(a) O projeto do avião, incluindo o sistema de

  entrada e admissão de ar, deve impedir a acu-

  mulação previsível de gelo ou neve que afete a

  operação do grupo motopropulsor adversamen-

  te.'
