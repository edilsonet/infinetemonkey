section_title: Proteção contra gelo do grupo mo-
subsection_id: b
cite: 23.2415(b)
title: 23.2415(b)
text: '(b) O projeto de instalação do grupo motopro-

  pulsor deve evitar qualquer acumulação de gelo

  ou neve que afete adversamente a operação do

  grupo motopropulsor, naquelas condições de

  formação de gelo para as quais a certificação é

  solicitada.'
