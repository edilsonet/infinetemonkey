text: '(b) O avião seja capaz de continuar o voo e

  pousar seguramente após qualquer falha única,

  combinação provável de falhas, ou mau funci-

  onamento do sistema de reverso.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
