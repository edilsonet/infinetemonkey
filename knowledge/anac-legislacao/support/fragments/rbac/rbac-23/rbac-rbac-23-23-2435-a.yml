title: 23.2435(a)
text: '(a) O sistema de admissão de ar para cada gru-

  po motopropulsor ou unidade de potência auxi-

  liar e seus acessórios devem:

  (1) Fornecer o ar requerido por esse grupo mo-

  topropulsor ou unidade auxiliar de potência e

  seus acessórios sob condições de operação pro-

  váveis;

  (2) Ser concebido para evitar riscos prováveis

  em caso de fogo ou explosão;

  (3) Minimizar a ingestão de matéria estranha; e


  (4) Fornecer uma admissão alternativa se o

  bloqueio da admissão primária for provável.'
