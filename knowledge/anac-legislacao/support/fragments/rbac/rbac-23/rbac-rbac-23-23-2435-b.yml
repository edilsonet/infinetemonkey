title: 23.2435(b)
text: '(b) O sistema de exaustão, incluindo trocadores

  de calor de exaustão, para cada grupo moto-

  propulsor ou unidade de potência auxiliar, de-

  ve:

  (1) Fornecer um meio para descartar de forma

  segura materiais potencialmente prejudiciais; e

  (2) Ser projetado para evitar riscos prováveis

  devido ao calor, corrosão ou bloqueio.'
