section_title: Proteção contra fogo do grupo mo-
subsection_id: c
cite: 23.2440(c)
title: 23.2440(c)
text: '(c) Cada componente, linha, conexões e contro-

  le sujeitos a condições de fogo devem:

  (1) Ser projetados e localizados para evitar pe-

  rigos resultantes de fogo, incluindo qualquer

  item localizado adjacente a uma zona definida

  como de fogo que possa ser afetada por fogo

  dentro dessa zona;

  (2) Ser resistentes ao fogo caso transporte flui-

  dos inflamáveis, gás ou ar ou item necessário

  para operação em caso de fogo; e

  (3) Ser à prova de fogo ou recobertos por uma

  proteção contra fogo, caso armazene fluidos

  inflamáveis concentrados.'
