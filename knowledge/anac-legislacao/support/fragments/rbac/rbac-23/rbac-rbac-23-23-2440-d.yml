section_title: Proteção contra fogo do grupo mo-
subsection_id: d
cite: 23.2440(d)
title: 23.2440(d)
text: '(d) O requerente deve fornecer um meio para

  evitar que quantidades perigosas de fluidos

  inflamáveis fluam para dentro ou por dentro ou

  através de cada zona definida como de fogo.

  Este meio deve:

  (1) Não restringir o fluxo ou limitar o funcio-

  namento de qualquer sistema de propulsão ou

  unidades de potência auxiliar remanescentes,

  ou equipamento necessário para segurança;

  (2) Impedir operação inadvertida; e

  (3) Estar localizado fora da zona de fogo, a

  menos que um grau de segurança igual seja

  fornecido dentro da zona de fogo.'
