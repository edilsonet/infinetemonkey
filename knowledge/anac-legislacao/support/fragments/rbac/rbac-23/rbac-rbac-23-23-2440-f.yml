cite: 23.2440(f)
title: 23.2440(f)
text: '(f) Um meio para extinguir fogo dentro de uma

  zona de fogo, exceto na zona de fogo do aque-

  cedor à combustão, deve ser fornecido para:

  (1) Qualquer zona de fogo localizada fora do

  campo de visão do piloto;

  (2) Qualquer zona de fogo embutida na fusela-

  gem, que também deve incluir um meio redun-

  dante para extinguir o fogo; e

  (3) Qualquer zona de fogo em um avião de

  nível 4.


  SUBPART F

  EQUIPMENT

  SUBPARTE F

  EQUIPAMENTO'
