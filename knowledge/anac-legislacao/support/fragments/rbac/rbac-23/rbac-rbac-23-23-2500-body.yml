title: Requisitos de sistemas a nível avião.
text: '23.2500 Requisitos de sistemas a nível avião.


  Em termos gerais, esta seção se aplica a equi-

  pamentos e sistemas instalados, a menos que

  uma seção deste regulamento imponha requisi-

  tos para uma parte específica do equipamento,

  sistema ou sistemas.'
