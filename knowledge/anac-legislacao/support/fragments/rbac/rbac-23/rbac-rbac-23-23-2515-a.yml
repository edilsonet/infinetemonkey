section_title: Proteção contra efeitos de descargas
subsection_id: a
cite: 23.2515(a)
title: 23.2515(a)
text: '(a) Cada sistema elétrico e eletrônico que de-

  sempenhe uma função cuja falha impediria a

  continuação segura do voo e pouso do avião,

  deve ser projetado e instalado de modo que:


  (1) A função a nível avião não seja afetada ad-

  versamente durante e após o período em que o

  avião for exposto à descarga atmosférica; e


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  (2) The system recovers normal operation of

  that function in a timely manner after the air-

  plane is exposed to lightning unless the sys-

  tem''s recovery conflicts with other operational

  or functional requirements of the system.'
