cite: 23.2520(a)
title: 23.2520(a)
text: '(a) Each electrical and electronic systems that

  perform a function, the failure of which would

  prevent the continued safe flight and landing of

  the airplane, must be designed and installed

  such that:

  (1) The function at the airplane level is not ad-

  versely affected during and after the time the

  airplane is exposed to the HIRF environment;

  and

  (2) The system recovers normal operation of

  that function in a timely manner after the air-

  plane is exposed to the HIRF environment,

  unless the system''s recovery conflicts with oth-

  er operational or functional requirements of the

  system.'
