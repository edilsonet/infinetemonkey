section_title: Proteção contra efeitos de campos
subsection_id: b
cite: 23.2520(b)
title: 23.2520(b)
text: '(b) Para aviões aprovados para operações IFR,

  cada sistema elétrico e eletrônico que desem-

  penhe uma função, cuja falha reduziria signifi-

  cativamente a capacidade do avião ou a habili-

  dade da tripulação de voo de reagir a uma con-

  dição adversa de operação, deve ser projetado e

  instalado de modo que o sistema recupere a

  operação normal daquela função em tempo

  hábil após o avião ser exposto ao ambiente com

  HIRF.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
