text: '(c) Ter capacidade suficiente, caso a fonte pri-

  mária falhe, de suprir as cargas essenciais, in-

  cluindo as cargas essenciais não-contínuas pelo

  tempo necessário para completar a função re-

  querida para a continuação segura do voo e

  pouso.'
