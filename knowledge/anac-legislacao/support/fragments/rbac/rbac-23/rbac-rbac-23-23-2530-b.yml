title: 23.2530(b)
text: '(b) Qualquer luz de posição e anticolisão se

  requerida pelo RBHA 91, ou RBAC que venha

  a substituí-lo, deve atender as intensidades,

  frequência de lampejo, cores, campos de cober-

  tura, e outras características que permitam tem-

  po suficiente para outra aeronave evitar uma

  colisão.'
