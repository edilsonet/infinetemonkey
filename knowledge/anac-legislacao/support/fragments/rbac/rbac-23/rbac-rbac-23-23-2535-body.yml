title: Equipamentos de segurança.
text: '23.2535 Equipamentos de segurança.

  Equipamentos de segurança e sobrevivência,

  requeridos pelas regras operacionais, devem ser

  confiáveis, prontamente acessíveis, facilmente

  identificáveis, e claramente marcados para

  identificar seus métodos de operação.'
