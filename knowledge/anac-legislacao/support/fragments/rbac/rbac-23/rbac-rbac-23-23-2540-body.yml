text: '23.2540 Voo em condições de gelo.

  Um requerente que solicite certificação para

  voo em condições de gelo definidas na parte 1

  do apêndice C do RBAC 25, ou um requerente

  que solicite certificação para voo nessas condi-

  ções de formação de gelo e em qualquer outra

  condição atmosférica de formação de gelo,

  deve demonstrar o seguinte para as condições

  de formação de gelo para as quais a certifica-

  ção é requerida:'
