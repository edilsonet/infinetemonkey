cite: 23.2600(a)
title: 23.2600(a)
text: '(a) O compartimento do piloto, seus equipa-

  mentos, e sua organização incluindo a visão do

  piloto, devem permitir que cada piloto realize

  suas tarefas, incluindo táxi, decolagem, subida,

  cruzeiro, descida, aproximação, pouso e reali-

  zar quaisquer manobras dentro do envelope

  operacional do avião, sem concentração, habi-

  lidade, estado de alerta ou fadiga excessivas.'
