cite: 23.2600(b)
title: 23.2600(b)
text: '(b) O requerente deve instalar controles e mos-

  tradores de voo, navegação, vigilância e do

  grupo motopropulsor, de modo que a tripulação

  de voo qualificada possa monitorar e desempe-

  nhar tarefas definidas, associadas às funções

  pretendidas dos sistemas e equipamentos. O

  projeto do sistema e equipamento deve mini-

  mizar erros da tripulação de voo, que poderiam

  resultar em riscos adicionais.'
