cite: 23.2600(c)
title: 23.2600(c)
text: '(c) Para os aviões de nível 4, o projeto da inter-

  face da tripulação de voo deve permitir a conti-

  nuação do voo e pouso seguros após a perda de

  visão através de qualquer um dos painéis do

  para-brisa.'
