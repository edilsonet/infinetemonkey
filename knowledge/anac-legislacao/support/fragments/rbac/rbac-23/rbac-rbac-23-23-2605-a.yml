text: '(a) Cada item de equipamento instalado relaci-

  onado à interface da tripulação de voo deve ser

  rotulado, se aplicável, quanto à sua identifica-

  ção, função ou limitações de operação ou qual-

  quer combinação desses fatores.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
