title: 23.2605(b)
text: '(b) Deve haver um meio discernível de forne-

  cer os parâmetros operacionais do sistema re-

  queridos para operar o avião, incluindo avisos

  de atenção, alertas de perigo e indicações nor-

  mais para o tripulante responsável.'
