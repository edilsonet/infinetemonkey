cite: 23.2605(c)
title: 23.2605(c)
text: '(c) As informações relativas a uma condição

  insegura de operação do sistema devem ser

  fornecidas em tempo hábil ao tripulante res-

  ponsável por tomar medidas corretivas. A in-

  formação deve ser clara o suficiente para evitar

  erros prováveis da tripulação.'
