cite: 23.2615(a)
title: 23.2615(a)
text: '(a) Os sistemas instalados devem fornecer ao

  integrante da tripulação de voo que define ou

  monitora os parâmetros de voo, de navegação e

  do grupo motopropoulsor, as informações ne-

  cessárias para fazê-lo, durante cada fase do

  voo. Esta informação deve:

  (1) Ser apresentada de forma que o tripulante

  possa monitorar o parâmetro e determinar as

  tendências, conforme necessário, para operar o

  avião; e

  (2) Incluir limitações, a menos que a limitação

  não possa ser excedida em nenhuma das opera-

  ções pretendidas.


  Data da emissão: 7 de agosto de 2019 RBAC nº 23'
