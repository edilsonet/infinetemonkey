cite: 23.2615(b)
title: 23.2615(b)
text: '(b) Sistemas de indicação que integram a exibi-

  ção de parâmetros de voo ou do grupo moto-

  propulsor necessários para operar o avião ou

  que são exigidos pelas regras operacionais de-

  vem:

  (1) Não inibir o mostrador primário de parâme-

  tros de voo ou do grupo motopropulsor neces-

  sários para qualquer membro da tripulação de

  voo em qualquer modo de operação normal; e

  (2) Em combinação com outros sistemas, ser

  projetado e instalado de modo que as informa-

  ções essenciais para a continuação segura do

  voo e pouso estejam disponíveis para a tripula-

  ção de voo em tempo hábil após qualquer falha

  individual ou provável combinação de falhas.'
