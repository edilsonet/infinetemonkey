cite: 23.2620(a)
title: 23.2620(a)
text: '(a) O Manual de Voo do Avião deve conter as

  seguintes informações:

  (1) Limitações operacionais do avião;

  (2) Procedimentos operacionais do avião;

  (3) Informação de desempenho;

  (4) Informações de carregamento; e

  (5) Outras informações necessárias para uma

  operação segura devido a características de

  projeto, operação ou manuseio.'
