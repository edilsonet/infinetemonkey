text: '(b) The following sections of the Airplane

  Flight Manual must be approved by ANAC in a

  manner specified by ANAC:

  (1) For low-speed, level 1 and 2 airplanes,

  those portions of the Airplane Flight Manual

  containing the information specified in para-

  graph (a)(1) of this section; and'
