title: A23.1(b)
text: '(b) The Instructions for Continued Airworthi-

  ness for each airplane must include the Instruc-

  tions for Continued Airworthiness for each

  engine and propeller (hereinafter designated

  “products”), for each appliance required by

  ANAC, and any required information relating

  to the interface of those appliances and prod-

  ucts with the airplane. If Instructions for Con-

  tinued Airworthiness are not supplied by the

  manufacturer of an appliance or product in-

  stalled in the airplane, the Instructions for Con-

  tinued Airworthiness for the airplane must in-

  clude the information essential to the continued

  airworthiness of the airplane.'
