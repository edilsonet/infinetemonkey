title: A23.3(a)
text: '(a) Manual ou seção de manutenção do avião.

  (1) Informação introdutória que inclua uma

  explicação dos dados e das características do

  avião na medida necessária para manutenção

  ou manutenção preventiva;

  (2) Uma descrição do avião e seus sistemas e

  instalações, incluindo seus motores, hélices e

  equipamentos;

  (3) Informações básicas de controle e operação

  descrevendo como os componentes e sistemas

  do avião são controlados e como eles operam,

  incluindo quaisquer procedimentos especiais e

  limitações aplicáveis;

  (4) Informações de serviço que cubram deta-

  lhes sobre pontos de serviço, capacidades de

  tanques, reservatórios, tipos de fluidos a serem

  utilizados, pressões aplicáveis aos vários siste-

  mas, localização dos painéis de acesso para

  inspeção e serviço, pontos de lubrificação, lu-

  brificantes a serem usados, equipamentos ne-

  cessários para serviço, instruções e limitações

  de reboque, informações de amarração, levan-

  tamento e nivelamento.'
