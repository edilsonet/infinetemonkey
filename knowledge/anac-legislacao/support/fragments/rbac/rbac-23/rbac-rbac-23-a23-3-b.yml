title: A23.3(b)
text: '(b) Instruções de manutenção.

  (1) Informações calendárias para cada parte do

  avião e seus motores, unidades auxiliares de

  potência, hélices, acessórios, instrumentos e

  equipamentos que forneçam os períodos reco-

  mendados em que devem ser limpos, inspecio-

  nados, ajustados, testados e lubrificados, e o


  Data da emissão: 7 de agosto de 2019 RBAC nº 23


  degree of inspection, the applicable wear toler-

  ances, and work recommended at these periods.

  However, the applicant may refer to an acces-

  sory, instrument, or equipment manufacturer as

  the source of this information if the applicant

  shows that the item has an exceptionally high

  degree of complexity requiring specialized

  maintenance techniques, test equipment, or

  expertise. The recommended overhaul periods

  and necessary cross reference to the Airworthi-

  ness Limitations section of the manual must

  also be included. In addition, the applicant

  must include an inspection program that in-

  cludes the frequency and extent of the inspec-

  tions necessary to provide for the continued

  airworthiness of the airplane.


  (2) Troubleshooting information describing

  probable malfunctions, how to recognize those

  malfunctions, and the remedial action for those

  malfunctions.

  (3) Information describing the order and meth-

  od of removing and replacing products and

  parts with any necessary precautions to be tak-

  en.

  (4) Other general procedural instructions in-

  cluding procedures for system testing during

  ground running, symmetry checks, weighing

  and determining the center of gravity, lifting

  and shoring, and storage limitations.'
