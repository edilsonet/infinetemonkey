title: A23.3(h)
text: '(h) In addition, for level 4 airplanes, the fol-

  lowing information must be furnished:

  (1) Electrical loads applicable to the various

  systems;

  (2) Methods of balancing control surfaces;


  (3) Identification of primary and secondary

  structures; and

  (4) Special repair methods applicable to the

  airplane.

  mentos de proteção à estrutura após a inspeção.'
