cite: A23.4
title: Seção de limitações de aeronavegabi-
text: 'A23.4 Seção de limitações de aeronavegabi-

  lidade.

  As Instruções para Aeronavegabilidade Conti-

  nua devem conter uma seção intitulada Limita-

  ções de Aeronavegabilidade que seja segregada

  e claramente distinguível do resto do documen-

  to. Esta seção deve estabelecer cada tempo de

  substituição obrigatório, intervalo de inspeção

  estrutural e o relacionado procedimento de ins-

  peção estrutural necessário para certificação de

  tipo. Se as Instruções de Aeronavegabilidade

  Continuada consistirem de múltiplos documen-

  tos, a seção requerida por este parágrafo deve

  ser incluída no manual principal. Esta seção

  deve conter uma declaração legível em uma

  localização proeminente em que se leia "A se-

  ção de Limitações de Aeronavegabilidade é

  aprovada pela ANAC e especifíca a manuten-

  ção requerida pelas seções 43.16 do RBAC 43

  e 91.403 do RBHA 91, a menos que um pro-

  grama alternativo tenha sido aprovado pela

  ANAC".'
