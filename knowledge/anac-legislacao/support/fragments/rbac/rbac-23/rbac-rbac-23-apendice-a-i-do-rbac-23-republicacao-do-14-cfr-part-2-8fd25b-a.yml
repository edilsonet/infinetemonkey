title: apendice-a-i-do-rbac-23-republicacao-do-14-cfr-part-2-8fd25b(a)
text: '(a) Geral


  Para concessão de certificados de tipo para aviões categoria normal será utilizado como
  referên-

  cia o regulamento Title 14 Code of Federal Regulations Part 23, Emenda 23-64, em vigor desde

  30 de agosto de 2017, da autoridade de aviação civil Federal Aviation Administration - FAA,
  do

  Department of Transportation dos Estados Unidos da América, o qual é republicado no corpo

  deste RBAC, com as adaptações necessárias e traduzido para a língua portuguesa, a partir
  do ori-

  ginal contido no sítio oficial de publicação do regulamento em referência: https://www.ecfr.gov.'
