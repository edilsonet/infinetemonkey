section_title: Cowling and nacelle skin
subsection_id: c
cite: 25.1193(c)
title: 25.1193(c)
text: '(c) On airplanes with a diaphragm isolating the engine power section from the engine
  accessory section, each part of the accessory section cowling subject to flame in case of
  fire in the engine power section of the powerplant must-

  (1) Be fireproof; and

  (2) Meet the requirements of RBAC 25.1191.'
