title: 25.1193(e-I)
text: '(e)-I Each airplane must -

  (1) Be designed and constructed so that no fire originating in any fire zone can enter,
  either through openings or by burning through external skin, any other zone or region where
  it would create additional hazards;

  (2) Meet subparagraph (e)(1) of this paragraph with the landing gear retracted (if applicable);
  and

  (3) Have cowlings and nacelles skins, in areas subject to flame if a fire starts in an engine
  fire zone, complying with the following:'
