section_title: Cowling and nacelle skin
subsection_id: i
cite: 25.1193(i)
title: 25.1193(i)
text: '(i) For in-flight operations, cowlings and nacelles skins must be fireproof in the
  complete concerned areas, and

  (ii) For ground operations, cowlings and nacelles skins must be:

  (A) Fireproof in the portions of the concerned areas where a skin burn through would affect
  critical areas of the airplane, and

  (B) Fire-resistant or compliant with subparagraph (e)(1) of this paragraph in the remaining
  portions of the concerned areas.

  [Doc. No. 5066, 29 FR 18291, Dec. 24, 1964, as amended by Amdt. 25-46, 43 FR 50598, Oct.
  30, 1978]

  (Seção incluída pela Resolução nº 777, de 21.08.2025)'
