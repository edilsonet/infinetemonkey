cite: 26.1(a)
title: 26.1(a)
text: '(a) Este regulamento estabelece os requisitos para o suporte da aeronavegabilidade
  continuada e

  as melhorias de segurança para aviões categoria transporte. Estes requisitos podem incluir:
  avalia-

  ções, desenvolvimento de modificações de projeto, desenvolvimento de revisões das instruções
  para

  aeronavegabilidade continuada e a disponibilização dos documentos necessários às pessoas
  afeta-

  das. Os requisitos deste RBAC, que estabelecem normas para modificações de projeto e revisão
  das

  instruções para aeronavegabilidade continuada, são considerados requisitos de aeronavegabilidade.'
