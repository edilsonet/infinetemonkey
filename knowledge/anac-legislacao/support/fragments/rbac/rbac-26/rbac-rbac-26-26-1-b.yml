cite: 26.1(b)
title: 26.1(b)
text: '(b) Exceto como previsto no parágrafo (c) desta seção, este RBAC aplica-se às seguintes
  pesso-

  as, conforme especificado em cada subparte deste regulamento:

  (1) detentores de certificado de tipo e de certificado suplementar de tipo;

  (2) requerentes de certificado de tipo e de certificado suplementar de tipo e de emendas
  a es-

  tes certificados (incluindo boletins serviço que descrevem modificações de projeto);

  (3) pessoas buscando aprovação de projeto de reparos do avião, alterações, ou modificações

  que possam afetar a aeronavegabilidade; e

  (4) detentores de certificado de tipo e seus licenciados produzindo novos aviões.'
