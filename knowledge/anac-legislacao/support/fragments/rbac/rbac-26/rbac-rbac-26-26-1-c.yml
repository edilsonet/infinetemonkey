title: 26.1(c)
text: '(c) Um requerente de aprovação de uma modificação de projeto não é obrigado a cumprir
  com

  qualquer requisito de aeronavegabilidade aplicável deste RBAC, se o requerente optar por,
  ou for

  obrigado a cumprir com a emenda do RBAC/RBHA 25, adotada concomitantemente, ou após aque-

  le requisito de aeronavegabilidade.'
