cite: 26.11(a)
title: 26.11(a)
text: '(a) Exceto como previsto no parágrafo (g) desta seção, esta seção aplica-se aos aviões
  categoria

  transporte, equipados com motores à turbina, com certificado de tipo emitido após 1o de
  janeiro de

  1958, que em razão de sua certificação de tipo original ou posterior aumento de capacidade,
  possua:

  (1) capacidade máxima de assentos para passageiros certificada para o tipo de 30 (trinta)
  ou

  mais; ou

  (2) capacidade máxima de carga paga de 3 402 kgf (7 500 lbf) ou mais.'
