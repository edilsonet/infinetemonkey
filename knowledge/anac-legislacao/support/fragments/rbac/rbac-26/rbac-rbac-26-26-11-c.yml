title: 26.11(c)
text: '(c) Requerentes de emenda ao certificado de tipo e ao certificado suplementar de tipo,
  identifica-

  dos no parágrafo (d) desta seção, devem:

  (1) avaliar se a modificação de projeto, para a qual a aprovação é buscada, implica na neces-

  sidade de revisão das instruções para aeronavegabilidade continuada, requeridas no parágrafo
  (b)

  desta seção, para cumprir com os requisitos do Apêndice H, parágrafo H25.5 (a) (1) e (b).
  Se afir-

  mativo, o requerente deve desenvolver e submeter as revisões necessárias para análise e
  aprovação

  da ANAC; e

  (2) assegurar que qualquer instrução para aeronavegabilidade continuada revisada, relativa
  à

  EWIS, permaneça compatível com as instruções para aeronavegabilidade continuada, previamente

  desenvolvidas para o sistema de tanques de combustível, em cumprimento com o RBAC 21.29(f)-I,

  ou o RBHA-E 88 vigente até 30 de junho de 2021, e que quaisquer requisitos redundantes entre

  estes sejam minimizados.

  (Redação dada pela Resolução nº 624, de 07.06.2021)'
