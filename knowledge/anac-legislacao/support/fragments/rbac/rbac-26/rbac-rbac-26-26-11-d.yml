cite: 26.11(d)
title: 26.11(d)
text: '(d) As seguintes pessoas devem cumprir com os requisitos do parágrafo (b) ou (c) desta
  seção,

  tal como aplicável, e antes das datas estipuladas:

  (1) detentores de certificado de tipo: 05 de junho de 2011;

  (2) requerentes de certificado de tipo, e emendas a tal certificado (incluindo boletins
  de servi-

  ço que descrevam modificações de projeto), se a data do requerimento foi antes de 22/03/2010
  e o


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  certificado foi emitido em ou após 22/03/2010: 05 de junho de 2011 ou na data em que o certificado

  tiver sido emitido, o que ocorrer depois;

  (3) a menos que o cumprimento com o RBAC/RBHA 25.1729, seja requerido ou optado,

  reuerentes de emendas a certificado de tipo, se a data do requerimento foi em ou após 22/03/2010:

  05 de junho de 2011, ou na data de aprovação do certificado, o que ocorrer depois;

  (4) requerentes de certificado suplementar de tipo, incluindo modificações a estes certificados

  já existentes, se a data do requerimento foi antes de 22/03/2010 e o certificado tiver sido
  emitido em

  ou após 22/03/2010: 01 de dezembro de 2011, ou na data de aprovação do certificado, o que
  ocorrer

  depois; e

  (5) a menos que o cumprimento com o RBAC/RBHA 25.1729, seja requerido ou optado, re-

  querentes de certificado suplementar de tipo, incluindo modificações a estes certificados
  já existen-

  tes, se a data de requerimento foi em ou após 22/03/2010: 01 de dezembro de 2011, ou na
  data de

  aprovação do certificado, o que ocorrer depois.'
