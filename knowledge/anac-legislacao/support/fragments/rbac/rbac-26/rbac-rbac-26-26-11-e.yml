section_title: Programa de manutenção das interconexões dos sistemas de cablagens
subsection_id: e
cite: 26.11(e)
title: 26.11(e)
text: '(e) Cada pessoa identificada nos parágrafos (d)(1), (d)(2) e (d)(4) desta seção deve
  submeter até

  22/06/2010 um plano de cumprimento para aprovação pela ANAC. O plano de cumprimento deve

  incluir as seguintes informações:

  (1) um cronograma proposto para o projeto, identificando todos os principais eventos, para

  cumprir com as datas especificadas no parágrafo (d) desta seção;

  (2) uma proposta de meio de cumprimento com esta seção, identificando todas as submissões

  requeridas, incluindo o cumprimento com todos os itens determinados nos parágrafos H25.5
  (a) (1)

  e (b) do Apêndice H do RBAC 25, vigentes em 22/03/2010, e todos os dados a serem desenvolvidos

  para substanciar o cumprimento;

  (3) uma proposta para submissão contendo todos os itens requeridos no parágrafo (e) (2)
  desta

  seção, a ser analisada pela ANAC, em não menos que 60 (sessenta) dias antes da data prevista
  para

  o cumprimento que esta especificada no parágrafo (d) desta seção; e

  (4) uma proposta de como as instruções para aeronavegabilidade continuada aprovadas serão

  disponibilizadas para as pessoas afetadas;'
