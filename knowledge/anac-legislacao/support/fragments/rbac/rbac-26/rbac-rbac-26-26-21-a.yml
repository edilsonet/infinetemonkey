title: 26.21(a)
text: '(a) Aplicabilidade. Exceto como disposto no parágrafo (g) desta seção, esta seção aplica-se
  a

  aviões da categoria transporte, propelidos por turbina, com peso máximo de decolagem bruto

  superior a 75.000 libras (34.020 kg) e um certificado de tipo emitido após 01 de janeiro
  de 1958,

  independentemente do fato de seu peso máximo de decolagem bruto resultar de um certificado
  de

  tipo original ou de uma modificação de projeto posterior. Esta seção também se aplica a
  aviões da

  categoria transporte, propelidos por turbina, com um certificado de tipo emitido após 01
  de janeiro

  de 1958, com alguma aprovação de modificação de projeto requerida após 8 de março de 2013
  que

  tenha o efeito de redução do peso máximo de decolagem bruto superior a 75.000 libras para
  75.000

  libras ou menos.'
