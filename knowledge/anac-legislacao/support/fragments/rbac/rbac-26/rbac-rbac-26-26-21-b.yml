title: 26.21(b)
text: '(b) Limite de validade. Cada pessoa identificada no parágrafo (c) desta seção deve
  cumprir com

  os requisitos a seguir.

  (1) estabelecer um limite de validade dos dados de Engenharia que suportam o Programa de

  Manutenção Estrutural (doravante denominado LOV, do inglês Limit of Validity) que corresponde

  ao período de tempo, considerado como o número total de ciclos de voo ou de horas de voo
  ou

  ambos, durante o qual se demonstra que não ocorrerá dano generalizado por fadiga no avião.
  Essa

  demonstração deve incluir uma avaliação das configurações estruturais do avião e ser suportada,
  no

  mínimo, por evidências de ensaio e análises, e, se disponíveis, a experiência em serviço,
  ou

  experiência em serviço e resultados de inspeção, no estado desmontado, em aviões antigos
  de

  projeto estrutural semelhante, considerando-se as diferenças dos procedimentos e condições

  operacionais. As configurações estruturais do avião a ser avaliadas incluem:'
