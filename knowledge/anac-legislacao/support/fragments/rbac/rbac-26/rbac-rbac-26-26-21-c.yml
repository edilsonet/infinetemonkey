text: '(c) Pessoas que devem cumprir e datas de cumprimento. As pessoas a seguir devem cumprir

  com os requisitos do parágrafo (b) desta seção até a data especificada.

  (1) detentores de Certificados de Tipo (CT) de modelos de avião identificados na Tabela
  1

  desta seção: no mais tardar até a data aplicável identificada na Tabela 1 desta seção.

  (2) requerentes para Certificados de Tipo (CT), se a data do requerimento for anterior a
  7 de

