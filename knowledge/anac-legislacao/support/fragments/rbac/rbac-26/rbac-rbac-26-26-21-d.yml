title: 26.21(d)
text: '(d) Plano de cumprimento. Cada pessoa identificada no parágrafo (e) desta seção deve
  submeter

  um plano de cumprimento consistindo do seguinte:

  (1) um cronograma do projeto proposto, identificando todas as etapas mais importantes para
  o

  cumprimento com as datas especificadas no parágrafo (c) desta seção;

  (2) uma proposta de meio de cumprimento para os parágrafos (b)(1) até (b)(4) desta seção;

  (3) uma proposta para submissão de uma minuta contendo todos os itens de cumprimento

  requeridos pelo parágrafo (b) desta seção para revisão da ANAC, numa data não inferior a
  60 dias;

  e

  (4) uma proposta de como o LOV será distribuído.'
