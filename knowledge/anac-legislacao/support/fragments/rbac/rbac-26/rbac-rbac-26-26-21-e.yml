title: 26.21(e)
text: '(e) Datas de cumprimento para os planos de cumprimento. As pessoas citadas a seguir
  devem

  submeter o plano de cumprimento descrito no parágrafo (d) desta seção à ANAC na data

  especificada.

  (1) detentores de um Certificado de Tipo: no mais tardar em 6 de julho de 2013;

  (2) requerentes de Certificado de Tipo (CT), se a data do requerimento for anterior a 7
  de abril

  de 2013: não excedendo 6 de julho de 2013;

  (3) detentores de Certificados Suplementares de Tipo ou de emendas a CT que aumentem o

  peso máximo de decolagem bruto de 75.000 libras (34.020 kg) ou menos para mais que 75.000

  libras: no mais tardar em 6 de julho de 2013;

  (4) requerentes para CST ou emendas a CT que aumentem o peso máximo de decolagem

  bruto de 75.000 libras (34.020 kg) ou menos para mais que 75.000 libras, se a data do requerimento

  for anterior a 7 de abril de 2013: no mais tardar em 6 de julho de 2013.

  (5) requerentes para CST ou emendas a CT que aumentem o peso máximo de decolagem

  bruto de 75.000 libras (34.020 kg) ou menos para mais que 75.000 libras, se a data do requerimento

  for posterior a 7 de abril de 2013: dentro de 90 dias após a data do requerimento.

  (6) requerentes para CST ou emendas a CT que diminuam o peso máximo de decolagem

  bruto maior que 75.000 libras (34.020 kg) para 75.000 libras ou menos, se a data do requerimento

  for posterior a 7 de abril de 2013: dentro de 90 dias após a data do requerimento.'
