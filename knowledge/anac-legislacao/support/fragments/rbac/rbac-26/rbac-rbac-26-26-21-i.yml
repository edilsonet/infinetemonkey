title: 26.21(i)
text: '(i) [Reservado];

  (ii) a data de emissão da emenda ao certificado;

  (iii) a data especificada no plano aprovado de acordo com a seção 25.571(b) do RBAC 25

  para a conclusão dos ensaios de fadiga em escala natural (full-scale fatigue testing) e
  demonstração

  de que o dano generalizado por fadiga não ocorrerá na estrutura do avião.

  (Redação dada pela Resolução nº 518, de 23.05.2019)

  (4) [Reservado]. (Redação dada pela Resolução nº 518, de 23.05.2019)

  (5) detentores de Certificados Suplementares de Tipo (CST) ou de emendas a CT que

  aumentam o peso máximo de decolagem bruto de 75.000 libras (34.020 kg) ou menos para acima

  de 75000 libras: no mais tardar em 8 de setembro de 2014. (Redação dada pela Resolução nº
  518,

  de 23.05.2019)

  (6) requerentes para CST ou emendas a CT que aumentem o peso máximo de decolagem

  bruto de 75.000 libras ou menos para acima de 75.000 libras: no mais tardar na última das
  seguintes

  datas:'
