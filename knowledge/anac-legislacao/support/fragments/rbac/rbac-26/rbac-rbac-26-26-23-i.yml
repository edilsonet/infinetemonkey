section_title: Limite de validade estendido
subsection_id: i
cite: 26.23(i)
title: 26.23(i)
text: '(i) Todas as variações e derivados de modelo aprovados sob o certificado de tipo pelo
  qual

  a aprovação por uma extensão é procurada; e

  (ii) Todas as modificações estruturais e substituições das configurações estruturais do

  avião especificadas pelo parágrafo (b)(1)(i), tornadas mandatórias por diretrizes de

  aeronavegabilidade, até a data de aprovação do LOV estendido.

  (2) Estabelecer uma revisão ou complemento, conforme aplicável, à Seção de Limitações de

  Aeronavegabilidade, das Instruções para Aeronavegabilidade Continuada requeridas pela seção

  25.1529 do RBAC 25, e submetê-lo à aprovação da ANAC. A Seção de Limitações de

  Aeronavegabilidade revisada ou complementada deve incluir o LOV estendido aplicável,

  estabelecido conforme o parágrafo (b)(1) desta seção.

  (3) Desenvolver ações de manutenção, determinadas pela avaliação de WFD realizada no

  parágrafo (b)(1) desta seção, necessárias para evitar a ocorrência de WFD antes que o avião
  atinja o

  LOV estendido proposto. Essas ações de manutenção devem ser documentadas na Seção de

  Limitações de Aeronavegabilidade como Itens de Limitação de Aeronavegabilidade e submetidas
  à

  ANAC para aprovação.


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  SUBPARTE D

  INFLAMABILIDADE NOS TANQUES DE COMBUSTÍVEL'
