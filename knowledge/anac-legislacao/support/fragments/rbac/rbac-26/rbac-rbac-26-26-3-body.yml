title: Definições
text: '26.3 Definições


  Para os propósitos deste RBAC, “aprovação da ANAC” pode incluir a aprovação realizada por

  pessoa credenciada devidamente autorizada e por autoridade de aviação civil estrangeira,
  desde que

  acordado entre ambas as partes.'
