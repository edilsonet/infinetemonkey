cite: 26.33(b)
title: 26.33(b)
text: '(b) Análise da Exposição à Inflamabilidade:

  (1) Geral. Antes de 22/08/2010, os detentores de certificado de tipo devem submeter para

  aprovação da ANAC uma Análise da Exposição à Inflamabilidade de todos os tanques de combus-

  tível definidos no projeto de tipo, assim como para todas as variações de projeto aprovadas
  sob o

  certificado de tipo que afetam a exposição à inflamabilidade. Esta análise deve ser conduzida
  em

  conformidade com o Apêndice N do RBAC/RBHA 25.

  (2) Exceção. Este parágrafo (b) não se aplica a:'
