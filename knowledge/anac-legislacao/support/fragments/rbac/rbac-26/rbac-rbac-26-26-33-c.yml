title: 26.33(c)
text: '(c) Modificações de Projeto. Para tanques de combustível com Exposição Média da Frota
  à In-

  flamabilidade excedendo o valor de 7%, deve ser feita uma das seguintes modificações de
  projeto:

  (1) Meio de Redução da Inflamabilidade. Deve ser provido um meio de reduzir a inflamabili-

  dade do tanque de combustível.'
