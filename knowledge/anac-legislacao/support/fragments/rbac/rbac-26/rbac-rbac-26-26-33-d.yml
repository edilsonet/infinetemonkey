section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: d
cite: 26.33(d)
title: 26.33(d)
text: '(d)(1) ou (d)(2) desta seção até 05 de junho de 2011. As instruções de serviço requeridas
  devem

  identificar cada avião sujeito a aplicabilidade prevista no parágrafo (a) desta seção.

  (1) Meio de Redução da Inflamabilidade. O detentor de certificado de tipo deve submeter
  à

  aprovação da ANAC as modificações de projeto e instruções de serviço para a instalação de
  Meio

  de Redução da Inflamabilidade do tanque de combustível em conformidade com os critérios
  do pa-

  rágrafo (c) desta seção.

  (2) Meio de Mitigação de Ignição. O detentor de certificado de tipo deve submeter à aprova-

  ção da ANAC as modificações de projeto e instruções de serviço para a instalação de Meio
  de Miti-

  gar a Ignição que cumpra com o RBAC 25.981(c) vigente em 22/03/2010.'
