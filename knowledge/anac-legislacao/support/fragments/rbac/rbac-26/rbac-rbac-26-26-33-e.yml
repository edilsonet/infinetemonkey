section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: e
cite: 26.33(e)
title: 26.33(e)
text: '(e) Instruções para Aeronavegabilidade Continuada. Antes de 05 de junho de 2011, os
  detento-

  res de certificado de tipo, requeridos pelo parágrafo (c) desta seção, ao executarem modificações
  de

  projeto, devem submeter à aprovação da ANAC as Limitações Críticas de Controle de Configura-

  ção de Projeto (Critical Design Configuration Control Limitations - CDCCL), inspeções, ou
  outros

  procedimentos para prevenir o aumento da exposição à inflamabilidade de qualquer tanque
  de com-

  bustível equipado com Meio de Redução de Inflamabilidade permitido pelo parágrafo (c)(1)
  desta

  seção e para prevenir a degradação do desempenho de qualquer Meio de Mitigação de Ignição
  pro-

  vido de acordo com o parágrafo (c)(2) desta seção. As Limitações Críticas de Controle de
  Configu-

  ração de Projeto, as inspeções, e os procedimentos devem ser incluídos na seção de limitações
  de

  aeronavegabilidade das instruções para aeronavegabilidade continuada requeridas pelo

  RBAC/RBHA 25.1529 ou pelo parágrafo (f) desta seção. A menos que seja demonstrado impraticá-

  vel, devem ser colocados meios de detectar visualmente as características críticas do projeto
  nas

  áreas do avião onde as esperadas ações de manutenção, reparos, ou alterações possam comprometer

  estas limitações críticas de configuração de projeto. Estes meios visíveis também devem
  ser identi-

  ficados como Limitações Críticas de Controle de Configuração de Projeto.'
