section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: f
cite: 26.33(f)
title: 26.33(f)
text: '(f) Limitações de aeronavegabilidade. Antes de 05 de junho de 2011, a menos que previamente

  realizada, os detentores de certificado de tipo afetados por esta seção devem estabelecer
  limitações

  de aeronavegabilidade no manual de manutenção ou nas instruções para aeronavegabilidade
  conti-

  nuada para cada configuração de avião avaliada de acordo com o parágrafo (b)(1) desta seção
  e

  submeter a aprovação da ANAC. As limitações de aeronavegabilidade devem incluir a seção
  que

  contenha as Limitações Críticas de Controle de Configuração de Projeto, inspeções ou outros
  pro-

  cedimentos desenvolvidos sob o parágrafo (e) desta seção.'
