section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: g
cite: 26.33(g)
title: 26.33(g)
text: '(g) Plano de cumprimento para a Análise da Exposição à Inflamabilidade. Antes de 22/06/2010,

  cada detentor de certificado requerido a cumprir com o parágrafo (b) desta seção, deve submeter
  à

  ANAC um plano de cumprimento que consista do seguinte:

  (1) um cronograma proposto para o projeto para submissão das análises requeridas, ou a de-

  terminação de que o cumprimento com o parágrafo (b) desta seção não é requerido porque as
  modi-

  ficações no projeto e instruções de serviço para Meio de Redução de Inflamabilidade ou Meio
  de

  Mitigação de Ignição serão desenvolvidas e disponibilizadas tal como requerido por esta
  seção; e

  (2) se aplicável, um meio de cumprimento proposto para com o parágrafo (b) desta seção.


  Data da emissão: 14 de junho de 2021. RBAC nº 26'
