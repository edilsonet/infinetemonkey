section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: h
cite: 26.33(h)
title: 26.33(h)
text: '(h) Plano de cumprimento para as modificações de projeto e instruções de serviço. Antes
  de

  22/10/2010, cada detentor de certificado de tipo requerido a cumprir com o parágrafo (d)
  desta se-

  ção deve submeter à ANAC um plano de cumprimento que contenha o seguinte:

  (1) um cronograma proposto para o projeto, identificando todos os principais eventos para

  cumprimento das datas especificadas nos parágrafos (d), (e) e (f) desta seção;

  (2) um meio de cumprimento proposto para cumprir com os parágrafos (d), (e) e (f) desta
  se-

  ção.

  (3) uma proposta para submissão de uma minuta de todos os itens de cumprimento requeridos

  pelos parágrafos (d), (e) e (f) desta seção para revisão pela ANAC, em não menos que 60
  (sessenta)

  dias antes do cumprimento com os prazos estabelecidos nestes parágrafos; e

  (4) uma proposta de como as informações de serviço aprovadas e quaisquer peças necessari-

  amente modificadas serão disponibilizadas para as pessoas afetadas.'
