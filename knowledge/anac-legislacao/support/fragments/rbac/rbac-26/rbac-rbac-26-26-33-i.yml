section_title: 'Detentores de certificado de tipo: inflamabilidade no tanque de combustível'
subsection_id: i
cite: 26.33(i)
title: 26.33(i)
text: '(i) tanques de combustível projetados como sendo Normalmente Vazios devem atender os

  critérios de exposição à inflamabilidade do Apêndice M do RBAC/RBHA 25, se qualquer parte

  deste tanque estiver localizada dentro do contorno da fuselagem; e

  (ii) para todos os outros tanques de combustível, o Meio de Redução da Inflamabilidade

  deve atender todos os requisitos do Apêndice M do RBAC/RBHA 25, exceto que, ao invés de
  cum-


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  prir com o parágrafo M25.1 deste Apêndice, a Exposição Média da Frota à Inflamabilidade
  não

  pode exceder o valor de 7%.

  (2) Meio de Mitigação de Ignição. Devem ser providos meios de mitigar os efeitos de uma

  ignição dos vapores de combustível dentro do tanque de combustível de tal forma que nenhum
  dano

  causado pela ignição previna a continuação segura do voo e pouso subsequente.'
