section_title: Alterações do projeto de tipo que afetam a inflamabilidade do tanque de combustível
subsection_id: a
cite: 26.35(a)
title: 26.35(a)
text: '(a) Aplicabilidade. Esta seção aplica-se aos detentores e requerentes de aprovação
  das seguintes

  modificações de projeto, para qualquer avião sujeito ao RBAC 26.33 (a):

  (1) qualquer tanque de combustível projetado para ser Normalmente Vazio, se a instalação
  do

  tanque de combustível foi aprovada segundo um certificado suplementar de tipo ou uma aprovação

  de campo antes de 22/03/2010;

  (2) qualquer tanque de combustível projetado para ser Normalmente Vazio, se o requerimento

  para um certificado suplementar de tipo ou uma emenda ao certificado de tipo foi efetuado
  antes de

  22/03/2010 e a aprovação não foi emitida antes de 22/03/2010; e

  (3) se o requerimento para um certificado suplementar de tipo ou uma emenda ao certificado

  de tipo foi feita em ou após 22/03/2010, ou qualquer uma das seguintes alterações de projeto:'
