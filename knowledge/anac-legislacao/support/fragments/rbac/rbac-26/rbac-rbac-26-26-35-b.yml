cite: 26.35(b)
title: 26.35(b)
text: '(b) Análise da Exposição à Inflamabilidade:

  (1) Geral. Antes das datas especificadas nos parágrafos (b)(1)(i) e (b)(1)(ii) desta seção,
  cada

  pessoa sujeita a esta seção deve submeter, para aprovação da ANAC, uma análise quanto à
  exposi-

  ção à inflamabilidade dos tanques auxiliares e outros tanques afetados, tal como definido
  no projeto

  de tipo. Esta análise deve ser conduzida em conformidade com o Apêndice N do RBAC/RBHA 25.'
