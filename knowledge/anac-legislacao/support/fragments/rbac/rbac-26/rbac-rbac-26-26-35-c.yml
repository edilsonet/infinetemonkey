section_title: Alterações do projeto de tipo que afetam a inflamabilidade do tanque de combustível
subsection_id: c
cite: 26.35(c)
title: 26.35(c)
text: '(c) Avaliação de impacto. Antes das datas especificadas nos parágrafos (c)(1) e (c)(2)
  desta se-

  ção, cada pessoa sujeita ao parágrafo (a)(1) desta seção, que detenha uma aprovação para
  instalação

  de um tanque Normalmente Vazio em um modelo de avião listado na Tabela 1 desta seção, e
  cada

  pessoa sujeita ao parágrafo (a)(3)(iii) desta seção, deve submeter uma análise do sistema
  de tanques

  de combustível, tal como previsto na modificação de projeto. A análise deve identificar
  qualquer

  característica da modificação de projeto que comprometa quaisquer Limitações Críticas de
  Controle

  de Configuração de Projeto aplicáveis a qualquer aeronave na qual a modificação de projeto
  é ele-

  gível para instalação.

  (1) detentores de certificado suplementar de tipo e aprovações de campo: antes de 04 de
  de-

  zembro de 2011.

  (2) requerentes a certificado suplementar de tipo e de emendas ao certificado: antes de
  04 de

  dezembro de 2011, ou antes que o certificado seja emitido, o que ocorrer depois.

  Tabela 1

  Modelo - Boeing

  747

  737

  777

  767

  757

  Modelo - Airbus

  A318, A319, A320 e A321

  A300 e A310

  A330 e A340'
