section_id: '26.35'
section_title: Alterações do projeto de tipo que afetam a inflamabilidade do tanque de combustível
subsection_id: e
cite: 26.35(e)
title: 26.35(e)
text: '(e) desta seção, cada pessoa sujeita a esta seção deve estar em conformidade com os
  requisitos do

  parágrafo (d)(1) ou (d)(2) desta seção, conforme aplicável.

  (1) Para detentores e requerentes sujeitos ao parágrafo (a)(1) ou (a)(3)(iii) desta seção,
  se a

  análise requerida pelo parágrafo (c) desta seção identificar quaisquer características na
  modificação

  de projeto que comprometa qualquer Limitação Crítica de Controle de Configuração de Projeto

  aplicável a qualquer avião na qual a modificação de projeto é elegível para instalação,
  o detentor ou

  o requerente deve submeter, para aprovação da ANAC, as modificações de projeto e instruções
  de

  serviço para os Meios de Mitigação de Inflamabilidade (Flammability Impact Mitigation Means
  -

  FIMM), que tragam a modificação de projeto à conformidade com a Limitação Crítica de Controle

  de Configuração de Projeto. Qualquer tanque de combustível modificado tal como requerido
  neste

  parágrafo também deve ser avaliado como requerido pelo parágrafo (b) desta seção.

  (2) Requerentes sujeitos ao parágrafo (a)(2), ou (a)(3)(i) desta seção devem cumprir com
  o

  RBAC 25.981, vigente em 22/03/2010.


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  (3) Requerentes sujeitos ao parágrafo (a)(3)(ii) desta seção devem cumprir com o RBAC

  26.33.'
