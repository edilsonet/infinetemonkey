section_title: Alterações do projeto de tipo que afetam a inflamabilidade do tanque de combustível
subsection_id: f
cite: 26.35(f)
title: 26.35(f)
text: '(f) Plano de cumprimento. Pelo prazo estabelecido na Tabela 2 desta seção, cada pessoa,
  sujeita

  ao parágrafo (a)(1) desta seção, deve submeter à aprovação pela ANAC planos de cumprimento

  para a análise de exposição à inflamabilidade, tal como requerido pelo parágrafo (b) desta
  seção, a

  avaliação de impacto requerida pelo parágrafo (c) desta seção, e as modificações de projeto
  e ins-

  truções de serviço, requeridas no parágrafo (d) desta seção. Os planos de cumprimento de
  cada pes-

  soa devem incluir o seguinte:

  (1) um cronograma proposto para o projeto para submissão das análises ou das avaliações
  de

  impacto requeridas;

  (2) uma proposta do meio de cumprimento com o parágrafo (d) desta seção;

  (3) para os requisitos do parágrafo (d) desta seção, uma proposta de submissão do projeto
  pre-

  liminar de todas as modificações de projeto, caso sejam necessárias, e as limitações de
  aeronavega-

  bilidade (incluindo as Limitações Críticas de Controle de Configuração de Projeto) para
  análise da

  ANAC, em não menos de 60 (sessenta) dias antes do prazo especificado no parágrafo (e) desta
  se-

  ção; e

  (4) para os requisitos do parágrafo (d) desta seção, uma proposta de como as instruções
  de

  serviço aprovadas, e quaisquer partes (peças ou componentes) necessárias para a modificação
  serão

  disponibilizadas para as pessoas afetadas.'
