section_title: Alterações do projeto de tipo que afetam a inflamabilidade do tanque de combustível
subsection_id: i
cite: 26.35(i)
title: 26.35(i)
text: '(i) tanques de combustível para os quais o detentor do certificado de tipo, do certificado

  suplementar de tipo, ou o detentor da aprovação de campo tenha, de acordo com o parágrafo
  (f)

  desta seção, notificado a ANAC que irá prover modificações no projeto e instruções de serviço
  para

  os Meios de Mitigação de Ignição, em conformidade com os requisitos do RBAC 25.981 (c) vigen-

  tes em 22/03/2010; e

  (ii) tanques de combustível substanciados como tanques convencionais de asa em alumí-

  nio, e não aquecidos.'
