title: 26.37(a)
text: '(a) Aplicabilidade. Esta seção se aplica a quaisquer novos certificados de tipo para
  aviões cate-

  goria transporte, se o requerimento para certificação foi feito antes de 22/03/2010, e se
  o certificado

  não foi emitido antes de 22/03/2010. Esta seção se aplica apenas se o avião terá:


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  (1) capacidade máxima de assentos para passageiros certificada para o tipo de 30 (trinta)
  ou

  mais; ou

  (2) capacidade máxima de carga paga de 3 402 kgf (7 500 lbf) ou mais.'
