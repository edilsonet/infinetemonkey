title: 26.43(a)
text: '(a) Aplicabilidade. Exceto como especificado no parágrafo (g) desta seção, esta seção
  aplica-se

  aos modelos de aviões categoria transporte, equipados com motor a turbina, certificados
  após 1º de


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  janeiro de 1958, que em razão de sua certificação de tipo original ou posterior aumento
  de capaci-

  dade, possua:

  (1) capacidade máxima de assentos para passageiros certificada para o tipo de 30 (trinta)
  ou

  mais; ou

  (2) capacidade máxima de carga paga de 3 402 kgf (7 500 lbf) ou mais.'
