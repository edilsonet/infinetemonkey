section_title: 'Detentores ou requerentes de certificado de tipo: reparos.'
subsection_id: b
cite: 26.43(b)
title: 26.43(b)
text: '(b) Lista da estrutura básica crítica a fadiga. Para os aviões especificados no parágrafo
  (a) desta

  seção, o detentor ou o requerente de um certificado de tipo deve:

  (1) identificar a estrutura básica crítica a fadiga para todas as variações de modelos de
  avião e

  modelos derivativos aprovados sob o certificado de tipo; e

  (2) desenvolver e submeter para aprovação pela ANAC, uma lista das estruturas identificadas

  sob o parágrafo (b)(1) desta seção e, após aprovação, tornar esta lista disponível às pessoas
  requeri-

  das a cumprir com os RBAC 26.47, 121.1109 e 129.109.'
