section_title: 'Detentores ou requerentes de certificado de tipo: reparos.'
subsection_id: c
cite: 26.43(c)
title: 26.43(c)
text: '(c) Dados de reparo já publicados e futuros dados de reparo. Para dados de reparo publicados

  pelo detentor de um certificado de tipo vigentes em 22/03/2010 e para todos os dados de
  reparo

  publicados a partir de então, o detentor deste certificado deve:

  (1) analisar os dados de reparo e identificar cada reparo especificado nos dados que afete
  a es-

  trutura básica crítica a fadiga conforme o parágrafo (b)(1) desta seção;

  (2) realizar uma Avaliação de Tolerância ao Dano e desenvolver uma Inspeção de Tolerância

  ao Dano para cada reparo identificado sob o parágrafo (c)(1) desta seção, a menos que já
  tenham

  sido previamente realizadas;

  (3) submeter os dados de Tolerância ao Dano à ANAC para análise e aprovação; e

  (4) uma vez aprovado, tornar a Inspeção de Tolerância ao Dano disponível para as pessoas
  re-

  queridas a cumprir com os RBAC 121.1109 e 129.109.'
