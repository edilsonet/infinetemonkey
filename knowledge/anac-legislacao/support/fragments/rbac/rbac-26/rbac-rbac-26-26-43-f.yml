section_title: 'Detentores ou requerentes de certificado de tipo: reparos.'
subsection_id: f
cite: 26.43(f)
title: 26.43(f)
text: '(f) Datas de cumprimento. Os detentores de certificado de tipo devem submeter o seguinte
  para

  análise e aprovação da ANAC nos prazos especificados:

  (1) a lista identificando as estruturas básicas críticas a fadiga, requerida pelo parágrafo
  (b)(2)

  desta seção, deve ser submetida antes de 22/09/2010 ou antes da emissão do certificado de
  tipo, o

  que ocorrer depois.

  (2) para dados de reparo publicados, vigentes em 22/03/2010, os dados de Tolerância ao Dano

  requeridos pelo parágrafo (c)(3) desta seção devem ser submetidos para a ANAC até 22/09/2010.

  (3) para dados de reparo publicados depois de 22/03/2010, os dados de Tolerância ao Dano

  requeridos pelo parágrafo (c)(3) desta seção devem ser submetidos para a ANAC antes da aprova-

  ção dos dados de reparo.

  (4) para dados de reparo não publicados, desenvolvidos após 22/03/2010, os dados de Tole-

  rância ao Dano requeridos pelo parágrafo (d)(1) desta seção devem ser submetidos dentro
  de 12

  meses após o retorno ao serviço do avião ou de acordo com um cronograma aprovado pela ANAC.

  (5) o guia para avaliação de reparos requerido pelo parágrafo (e)(1) desta seção deve ser
  sub-

  metido até 24 de maio de 2011.'
