section_title: 'Detentores ou requerentes de certificado de tipo: reparos.'
subsection_id: i
cite: 26.43(i)
title: 26.43(i)
text: '(i) um processo para conduzir levantamentos nas aeronaves afetadas, que possibilite
  identi-

  ficar e documentar todos os reparos existentes que afetam uma estrutura básica crítica a
  fadiga iden-

  tificada sob o parágrafo (b)(1) desta seção e o RBAC 26.45 (b)(2);

  (ii) um processo que possibilite os operadores obterem a Inspeção de Tolerância ao Dano

  para os reparos identificados sob o parágrafo (e)(1)(i) desta seção; e


  Data da emissão: 14 de junho de 2021. RBAC nº 26


  (iii) uma programação de implementação para os reparos cobertos pelo guia para avaliação

  de reparos. A programação de implementação deve identificar os tempos nos quais as ações
  devem

  ser tomadas, especificadas numericamente em termos de horas de voo do avião, de ciclos de
  voo, ou

  ambos.

  (2) submeter o guia para avaliação de reparos para análise e aprovação da ANAC.

  (3) uma vez aprovado, tornar o guia disponível para as pessoas requeridas a cumprir com
  os

  RBAC 121.1109 e 129.109.

  (4) se o guia instruir o operador a obter assistência do detentor do certificado de tipo,
  tornar a

  assistência disponível em conformidade com a programação de implementação.'
