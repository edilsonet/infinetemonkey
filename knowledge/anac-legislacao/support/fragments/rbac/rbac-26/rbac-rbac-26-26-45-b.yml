section_title: 'Detentores de certificado de tipo: alterações e reparos'
subsection_id: b
cite: 26.45(b)
title: 26.45(b)
text: '(b)(3) desta seção, deve ser submetida antes de 22/03/2011;

  (2) para dados de alteração desenvolvidos e aprovados antes de 22/03/2010, os dados de Tole-

  rância ao Dano requeridos no parágrafo (c)(2) desta seção devem ser submetidos antes de

  22/09/2011;

  (3) para dados de alteração aprovados a partir de 22/03/2010, os dados de alteração requeridos

  pelo parágrafo (c)(2) desta seção devem ser submetidos antes da aprovação inicial da ANAC;

  (4) para dados de alteração desenvolvidos e aprovados antes de 22/03/2010, os dados de Tole-

  rância ao Dano requeridos pelo parágrafo (d)(2) desta seção devem ser submetidos para aprovação

  da ANAC antes de 22/09/2011; e

  (5) para dados de alteração desenvolvidos e aprovados após 22/03/2010, os dados de Tolerân-

  cia ao Dano requeridos pelo parágrafo (d)(2) desta seção devem ser submetidos dentro de
  12 meses

  após a aprovação inicial dos dados de reparo e antes de disponibilizar os dados de Tolerância
  ao

  Dano para as pessoas requeridas a cumprir com os RBAC 121.1109 e 129.109.'
