section_title: 'Detentores de certificado de tipo: alterações e reparos'
subsection_id: d
cite: 26.45(d)
title: 26.45(d)
text: '(d) Dados de Tolerância ao Dano para reparos aplicados em alterações. Para dados de
  reparos

  existentes ou futuros desenvolvidos pelo detentor do certificado de tipo, este detentor
  deve:

  (1) analisar os dados de reparos e identificar cada reparo que afete qualquer estrutura
  básica

  crítica a fadiga identificada de acordo com o parágrafo (b)(2) desta seção;

  (2) para cada reparo identificado no parágrafo (d)(1) desta seção, a menos que já previamente

  realizadas, realizar uma Avaliação de Tolerância ao Dano e desenvolver uma Inspeção de Tolerân-

  cia ao Dano;

  (3) submeter os dados de Tolerância ao Dano, desenvolvidos de acordo com o parágrafo'
