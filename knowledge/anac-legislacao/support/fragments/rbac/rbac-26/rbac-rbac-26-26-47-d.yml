cite: 26.47(d)
title: 26.47(d)
text: '(d) Dados de Tolerância ao Dano para reparos aplicados em alterações. Para dados de
  alteração

  existentes ou futuros, desenvolvidos pelo detentor de um certificado suplementar de tipo,
  o detentor

  deste certificado deve:

  (1) analisar os dados dos reparos e identificar cada reparo que afeta a estrutura básica
  crítica a

  fadiga identificada de acordo com o parágrafo (b)(2) desta seção;

  (2) para cada reparo identificado no parágrafo (d)(1) desta seção, a menos que já previamente

  realizadas, realizar uma Avaliação de Tolerância ao Dano e desenvolver a Inspeção de Tolerância

  ao Dano;

  (3) submeter os dados de Tolerância ao Dano, desenvolvidos de acordo com o parágrafo'
