title: 26.49(a)
text: '(a) Plano de cumprimento. Exceto para requerentes de certificado de tipo e de certificado
  suple-

  mentar de tipo cujo requerimento foi submetido após 22/03/2010, cada pessoa identificada
  nos

  RBAC 26.43, 26.45, e 26.47 deve submeter um plano de cumprimento de:

  (1) um cronograma proposto para o projeto, identificando todos os principais eventos para

  cumprir com as datas propostas especificadas nos RBAC 26.43(f), 26.45(e), e 26.47(e), tal
  como

  aplicável;

  (2) um meio de cumprimento proposto para os RBAC 26.43, 26.45, e 26.47, tal como aplicá-

  vel; e

  (3) uma proposta para submissão de uma minuta contendo todos os itens requeridos por esta

  subparte para análise da ANAC, em não menos que 60 (sessenta) dias antes da data de cumprimento

  aplicável.'
