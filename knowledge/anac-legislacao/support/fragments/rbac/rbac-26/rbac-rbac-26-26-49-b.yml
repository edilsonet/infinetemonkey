title: 26.49(b)
text: '(b) Datas estabelecidas para os planos de cumprimento. As seguintes pessoas devem submeter
  o

  plano de cumprimento descrito no parágrafo (a) desta seção para aprovação pela ANAC, nos
  se-

  guintes prazos:

  (1) para detentores de certificado de tipo, antes de 22/06/2010;

  (2) para detentores de certificado suplementar de tipo, antes de 22/09/2010; e

  (3) para requerentes de alterações em certificado de tipo, os quais submeteram o requerimento

  antes 22/03/2010, antes de 22/09/2010.'
