text: '(e)

  Fatigue Evaluation: If an applicant establishes that the damage tolerance evaluation described
  in

  paragraph (d) of this section is impractical within the limits of geometry, inspectability,
  or good design

  practice, the applicant must do a fatigue evaluation of the particular composite rotorcraft
  structure and:

  (1)

  Identify all PSEs considered in the fatigue evaluation;

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.573(d)(1)(iv)

  14 CFR 27.573(e)(1) (enhanced display)

  page 39 of 126


  Subpart D - Design and Construction

  GENERAL

  § 27.601 Design.

  § 27.602 Critical parts.

  § 27.603 Materials.

  The suitability and durability of materials used for parts, the failure of which could adversely
  affect safety, must -

  (Secs. 313(a), 601, 603, 604, Federal Aviation Act of 1958 (49 U.S.C. 1354(a), 1421, 1423,
  1424); and sec. 6(c) of the

  Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 27.605 Fabrication methods.

  (2)

  Identify the types of damage for all PSEs considered in the fatigue evaluation;

  (3)

  Establish supplemental procedures to minimize the risk of catastrophic failure associated
  with the

  damages identified in paragraph (d) of this section; and

  (4)

  Include these supplemental procedures in the Airworthiness Limitations section of the Instructions

  for Continued Airworthiness required by § 27.1529.'
