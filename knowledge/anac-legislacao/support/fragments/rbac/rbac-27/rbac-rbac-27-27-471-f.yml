text: '(f)

  Special conditions. In addition to the conditions specified in paragraphs (b) and (c) of
  this section, the

  rotorcraft must be designed for the following ground reactions:

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.501(a)(3)(i)

  14 CFR 27.501(f) (enhanced display)

