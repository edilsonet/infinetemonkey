  § 27.505 Ski landing conditions.

  If certification for ski operation is requested, the rotorcraft, with skis, must be designed
  to withstand the following

  loading conditions (where P is the maximum static weight on each ski with the rotorcraft
  at design maximum

  weight, and n is the limit load factor determined under § 27.473(b).

  WATER LOADS

  § 27.521 Float landing conditions.

  If certification for float operation is requested, the rotorcraft, with floats, must be
  designed to withstand the

  following loading conditions (where the limit load factor is determined under § 27.473(b)
  or assumed to be equal to

  that determined for wheel landing gear):

  (1)

