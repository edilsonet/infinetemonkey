title: 27.471(h)
text: '(h)

  Under the operating conditions specified in paragraph (c) of this section, 500 complete
  cycles of lateral

  control, 500 complete cycles of longitudinal control of the main rotors, and 500 complete
  cycles of control

  of each auxiliary rotor must be accomplished. A “complete cycle” involves movement of the
  controls from

  the neutral position, through both extreme positions, and back to the neutral position,
  except that control

  movements need not produce loads or flapping motions exceeding the maximum loads or motions

  encountered in flight. The cycling may be accomplished during the testing prescribed in
  paragraph (c) of

  this section.'
