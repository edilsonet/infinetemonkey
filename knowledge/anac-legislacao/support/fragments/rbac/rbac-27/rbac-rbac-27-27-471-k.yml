title: 27.471(k)
text: '(k)

  For the purposes of this section, a litter is defined as a device designed to carry a nonambulatory
  person,

  primarily in a recumbent position, into and on the rotorcraft. Each berth or litter must
  be designed to

  withstand the load reaction of an occupant weight of at least 170 pounds when the occupant
  is subjected

  to the forward inertial factors specified in § 27.561(b). A berth or litter installed within
  15° or less of the

  longitudinal axis of the rotorcraft must be provided with a padded end-board, cloth diaphram,
  or

  equivalent means that can withstand the forward load reaction. A berth or litter oriented
  greater than 15°

  with the longitudinal axis of the rotorcraft must be equipped with appropriate restraints,
  such as straps or

  safety belts, to withstand the forward load reaction. In addition -

  (1)

  The berth or litter must have a restraint system and must not have corners or other protuberances

  likely to cause serious injury to a person occupying it during emergency landing conditions;
  and

  (2)

  The berth or litter attachment and the occupant restraint system attachments to the structure
  must

  be designed to withstand the critical loads resulting from flight and ground load conditions
  and from

  the conditions prescribed in § 27.561(b). The fitting factor required by § 27.625(d) shall
  be applied.'
