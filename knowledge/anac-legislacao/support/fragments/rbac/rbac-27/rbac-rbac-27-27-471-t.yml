title: 27.471(t)
text: '(t)

  For rotorcraft for which a 30-second/2-minute OEI power rating is requested, a means must
  be provided

  to alert the pilot when the engine is at the 30-second and the 2-minute OEI power levels,
  when the event

  begins, and when the time interval expires.'
