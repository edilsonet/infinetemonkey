cite: 27.471(u)
title: 27.471(u)
text: '(u)

  For each turbine engine utilizing 30-second/2-minute OEI power, a device or system must
  be provided

  for use by ground personnel which -

  (1)

  Automatically records each usage and duration of power at the 30-second and 2-minute OEI
  levels;

  (2)

  Permits retrieval of the recorded data;

  (3)

  Can be reset only by ground maintenance personnel; and

  (4)

  Has a means to verify proper operation of the system or device.'
