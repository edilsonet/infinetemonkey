title: A27.1(b)
text: '(b)

  The Instructions for Continued Airworthiness for each rotorcraft must include the Instructions
  for

  Continued Airworthiness for each engine and rotor (hereinafter designated ‘products’), for
  each appliance

  required by this chapter, and any required information relating to the interface of those
  appliances and

  products with the rotorcraft. If Instructions for Continued Airworthiness are not supplied
  by the

  manufacturer of an appliance or product installed in the rotorcraft, the Instructions for
  Continued

  Airworthiness for the rotorcraft must include the information essential to the continued
  airworthiness of

  the rotorcraft.

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.1587(a)(1)

  14 CFR 27.1589 (enhanced display)

  page 115 of 126'
