text: '(a)

  General. The helicopter must possess positive static longitudinal control force stability
  at critical

  combinations of weight and center of gravity at the conditions specified in paragraph IV
  (b) or (c) of

  this appendix, as appropriate. The stick force must vary with speed so that any substantial
  speed

