text: '(c)

  Helicopters approved for a minimum crew of two pilots must comply with the provisions of

  paragraphs IV(b)(2) and IV(b)(5) of this appendix.

  V.

  Static Lateral Directional Stability.

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR Appendix-B-to-Part-27 IV.(b)

  14 CFR Appendix-B-to-Part-27 V. (enhanced display)

  page 118 of 126'
