text: 'C27.2 Applicable part 29 sections. The following sections of part 29 of this chapter
  must be met in addition to the

  requirements of this part:

  29.45(a) and (b)(2) - General.

  29.49(a) - Performance at minimum operating speed.

  29.51 - Takeoff data: General.

  29.53 - Takeoff: Category A.

  29.55 - Takeoff decision point: Category A.

  29.59 - Takeoff Path: Category A.

  29.60 - Elevated heliport takeoff path: Category A.

  29.61 - Takeoff distance: Category A.

  29.62 - Rejected takeoff: Category A.

  (iii)

  The equipment, systems, and installations must be designed so that one display of the

  information essential to the safety of flight which is provided by the instruments will

  remain available to a pilot, without additional crewmember action, after any single failure

  or combination of failures that is not shown to be extremely improbable; and

  (iv)

  For single-pilot configurations, instruments which require a static source must be

  provided with a means of selecting an alternate source and that source must be

  calibrated.

  IX.

  Rotorcraft Flight Manual. A Rotorcraft Flight Manual or Rotorcraft Flight Manual IFR Supplement
  must be

