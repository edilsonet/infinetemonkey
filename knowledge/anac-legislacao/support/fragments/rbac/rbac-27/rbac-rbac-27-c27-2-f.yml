section_title: Applicable part 29 sections. The following sections of part 29 of this chapter
  must be met in addition to the
subsection_id: f
cite: C27.2(f)
title: C27.2(f)
text: '(f)

  Equipment HIRF Test Level 3. (1) From 10 kHz to 400 MHz, use conducted susceptibility tests,
  starting at

  a minimum of 0.15 mA at 10 kHz, increasing 20 dB per frequency decade to a minimum of 7.5
  mA at 500

  kHz.

  (2)

  From 500 kHz to 40 MHz, use conducted susceptibility tests at a minimum of 7.5 mA.

  (3)

  From 40 MHz to 400 MHz, use conducted susceptibility tests, starting at a minimum of 7.5
  mA at

  40 MHz, decreasing 20 dB per frequency decade to a minimum of 0.75 mA at 400 MHz.

  (4)

  From 100 MHz to 8 GHz, use radiated susceptibility tests at a minimum of 5 V/m.

  14 CFR Part 27 (up to date as of 5/03/2022)

