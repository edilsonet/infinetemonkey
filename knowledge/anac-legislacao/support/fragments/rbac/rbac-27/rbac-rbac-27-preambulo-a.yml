text: '(a)

  For each rotorcraft manufactured after September 16, 1992, each applicant must show that
  each

  occupant''s seat is equipped with a safety belt and shoulder harness that meets the requirements
  of

  paragraphs (a), (b), and (c) of this section.

  (1)

  Each occupant''s seat must have a combined safety belt and shoulder harness with a single-point

  release. Each pilot''s combined safety belt and shoulder harness must allow each pilot,
  when seated

  with safety belt and shoulder harness fastened, to perform all functions necessary for flight

  operations. There must be a means to secure belts and harnesses, when not in use, to prevent

  interference with the operation of the rotorcraft and with rapid egress in an emergency.

  (2)

  Each occupant must be protected from serious head injury by a safety belt plus a shoulder
  harness

  that will prevent the head from contacting any injurious object.

  (3)

  The safety belt and shoulder harness must meet the static and dynamic strength requirements,
  if

  applicable, specified by the rotorcraft type certification basis.

  (4)

  For purposes of this section, the date of manufacture is either -'
