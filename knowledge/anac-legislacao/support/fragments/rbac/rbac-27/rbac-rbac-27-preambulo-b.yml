text: '(b)

  Each primary control system, including its supporting structure, must be designed as follows:

  (1)

  The system must withstand loads resulting from the limit pilot forces prescribed in § 27.397.

  (2)

  Notwithstanding paragraph (b)(3) of this section, when power-operated actuator controls
  or power

  boost controls are used, the system must also withstand the loads resulting from the force
  output of

  each normally energized power device, including any single power boost or actuator system
  failure.

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.351(c)(1)

  14 CFR 27.395(b)(2) (enhanced display)

  page 25 of 126


  § 27.397 Limit pilot forces and torques.

  § 27.399 Dual control system.

  Each dual primary flight control system must be designed to withstand the loads that result
  when pilot forces of

  0.75 times those obtained under § 27.395 are applied -

  § 27.411 Ground clearance: tail rotor guard.

  § 27.427 Unsymmetrical loads.

  (3)

  If the system design or the normal operating loads are such that a part of the system cannot
  react

  to the limit pilot forces prescribed in § 27.397, that part of the system must be designed
  to

  withstand the maximum loads that can be obtained in normal operation. The minimum design
  loads

  must, in any case, provide a rugged system for service use, including consideration of fatigue,

  jamming, ground gusts, control inertia, and friction loads. In the absence of rational analysis,
  the

  design loads resulting from 0.60 of the specified limit pilot forces are acceptable minimum
  design

  loads.

  (4)

  If operational loads may be exceeded through jamming, ground gusts, control inertia, or
  friction, the

  system must withstand the limit pilot forces specified in § 27.397, without yielding.'
