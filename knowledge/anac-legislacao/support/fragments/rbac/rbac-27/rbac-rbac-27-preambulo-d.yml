text: '(d)

  Emergency high pitch. If the main rotor high pitch stop is set to meet paragraph (b)(1)
  of this section,

  and if that stop cannot be exceeded inadvertently, additional pitch may be made available
  for emergency

  use.

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.29(a)(1)

  14 CFR 27.33(d) (enhanced display)

  page 12 of 126


  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c) of the Dept. of Transportation Act (49 U.S.C. 1655(c)))

  PERFORMANCE

  § 27.45 General.'
