text: '(f)

  For turbine-engine-powered rotorcraft, a means must be provided to permit the pilot to determine
  prior to

  takeoff that each engine is capable of developing the power necessary to achieve the applicable
  rotorcraft

  performance prescribed in this subpart.

  14 CFR Part 27 (up to date as of 5/03/2022)

  Airworthiness Standards: Normal Category Rotorcraft

  14 CFR 27.33(e)

  14 CFR 27.45(f) (enhanced display)

  page 13 of 126


  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c) of the Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 27.49 Performance at minimum operating speed.

  § 27.51 Takeoff.

  The takeoff, with takeoff power and r.p.m. at the most critical center of gravity, and with
  weight from the maximum

  weight at sea level to the weight for which takeoff certification is requested for each
  altitude covered by this section

  -

  § 27.65 Climb: all engines operating.'
