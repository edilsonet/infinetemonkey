title: 29.1415(a)
text: '(a)

  Design. Each hydraulic system must be designed as follows:

  (1)

  Each element of the hydraulic system must be designed to withstand, without detrimental,

  permanent deformation, any structural loads that may be imposed simultaneously with the

  maximum operating hydraulic loads.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1419(b)

  14 CFR 29.1435(a)(1) (enhanced display)

  page 135 of 167


  § 29.1439 Protective breathing equipment.

  § 29.1457 Cockpit voice recorders.

  (2)

  Each element of the hydraulic system must be designed to withstand pressures sufficiently
  greater

  than those prescribed in paragraph (b) of this section to show that the system will not
  rupture under

  service conditions.

  (3)

  There must be means to indicate the pressure in each main hydraulic power system.

  (4)

  There must be means to ensure that no pressure in any part of the system will exceed a safe
  limit

  above the maximum operating pressure of the system, and to prevent excessive pressures resulting

  from any fluid volumetric change in lines likely to remain closed long enough for such a
  change to

  take place. The possibility of detrimental transient (surge) pressures during operation
  must be

  considered.

  (5)

  Each hydraulic line, fitting, and component must be installed and supported to prevent excessive

  vibration and to withstand inertia loads. Each element of the installation must be protected
  from

  abrasion, corrosion, and mechanical damage.

  (6)

  Means for providing flexibility must be used to connect points, in a hydraulic fluid line,
  between

  which relative motion or differential vibration exists.'
