title: 29.1415(b)
text: '(b)

  Category B. For each category B rotorcraft, the Rotorcraft Flight Manual must contain -

  (1)

  The takeoff distance and the climbout speed together with the pertinent information defining
  the

  flight path with respect to autorotative landing if an engine fails, including the calculated
  effects of

  altitude and temperature;

  (2)

  The steady rates of climb and in-ground-effect hovering ceiling, together with the corresponding

  airspeeds and other pertinent information, including the calculated effects of altitude
  and

  temperature;

  (3)

  The landing distance, appropriate airspeed, and type of landing surface, together with all
  pertinent

  information that might affect this distance, including the effects of weight, altitude,
  and temperature;

  (4)

  The maximum safe wind for operation near the ground;

  (5)

  The airspeed calibrations;

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1587

  14 CFR 29.1587(b)(5) (enhanced display)

  page 150 of 167


  § 29.1589 Loading information.

  There must be loading instructions for each possible loading condition between the maximum
  and minimum

  weights determined under § 29.25 that can result in a center of gravity beyond any extreme
  prescribed in § 29.27,

  assuming any probable occupant weights.

  Appendix A to Part 29 - Instructions for Continued Airworthiness

  a29.1 General

  a29.3 Content

  The contents of the manual or manuals must be prepared in the English language. The Instructions
  for Continued

  Airworthiness must contain the following manuals or sections, as appropriate, and information:

  (6)

  The height-speed envelope except for rotorcraft incorporating this as an operating limitation;

  (7)

  Glide distance as a function of altitude when autorotating at the speeds and conditions
  for

  minimum rate of descent and best glide angle, as determined in § 29.71;

  (8)

  Out-of-ground effect hover performance determined under § 29.49 and the maximum safe wind

  demonstrated under the ambient conditions for data presented. In addition, the maximum weight
  for

  each altitude and temperature condition at which the rotorcraft can safely hover out-of-ground-effect

  in winds of not less than 17 knots from all azimuths. These data must be clearly referenced
  to the

  appropriate hover charts; and

  (9)

  Any additional performance data necessary for the application of any operating rule in this
  chapter.'
