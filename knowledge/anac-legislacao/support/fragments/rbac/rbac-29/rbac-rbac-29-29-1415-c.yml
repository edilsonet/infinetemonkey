  § 29.1527 Maximum operating altitude.

  The maximum altitude up to which operation is allowed, as limited by flight, structural,
  powerplant, functional, or

  equipment characteristics, must be established.

  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c), Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 29.1529 Instructions for Continued Airworthiness.

  The applicant must prepare Instructions for Continued Airworthiness in accordance with appendix
  A to this part that

  are acceptable to the Administrator. The instructions may be incomplete at type certification
  if a program exists to

  ensure their completion prior to delivery of the first rotorcraft or issuance of a standard
  certificate of airworthiness,

  whichever occurs later.

