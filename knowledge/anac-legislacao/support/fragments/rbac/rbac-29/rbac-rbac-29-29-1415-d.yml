subsection_id: d
cite: 29.1415(d)
title: 29.1415(d)
text: '(d)

  Equipment HIRF Test Level 1. (1) From 10 kilohertz (kHz) to 400 megahertz (MHz), use conducted

  susceptibility tests with continuous wave (CW) and 1 kHz square wave modulation with 90
  percent depth

  or greater. The conducted susceptibility current must start at a minimum of 0.6 milliamperes
  (mA) at 10

  kHz, increasing 20 decibel (dB) per frequency decade to a minimum of 30 mA at 500 kHz.

  (2)

  From 500 kHz to 40 MHz, the conducted susceptibility current must be at least 30 mA.

  (3)

  From 40 MHz to 400 MHz, use conducted susceptibility tests, starting at a minimum of 30
  mA at

  40 MHz, decreasing 20 dB per frequency decade to a minimum of 3 mA at 400 MHz.

  (4)

  From 100 MHz to 400 MHz, use radiated susceptibility tests at a minimum of 20 volts per
  meter (V/

  m) peak with CW and 1 kHz square wave modulation with 90 percent depth or greater.

  (5)

  From 400 MHz to 8 gigahertz (GHz), use radiated susceptibility tests at a minimum of 150
  V/m

  peak with pulse modulation of 4 percent duty cycle with a 1 kHz pulse repetition frequency.
  This

  signal must be switched on and off at a rate of 1 Hz with a duty cycle of 50 percent.'
