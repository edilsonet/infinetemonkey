title: 29.1415(d)
text: '(d)

  Emergency exit placards. Each placard and operating control for each emergency exit must
  differ in

  color from the surrounding fuselage surface as prescribed in § 29.811(h)(2). A placard must
  be near each

  emergency exit control and must clearly indicate the location of that exit and its method
  of operation.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1555(b)(1)

  14 CFR 29.1557(d) (enhanced display)

  page 147 of 167


  § 29.1559 Limitations placard.

  There must be a placard in clear view of the pilot that specifies the kinds of operations
  (VFR, IFR, day, night, or icing)

  for which the rotorcraft is approved.

  § 29.1561 Safety equipment.

  § 29.1565 Tail rotor.

  Each tail rotor must be marked so that its disc is conspicuous under normal daylight ground
  conditions.

