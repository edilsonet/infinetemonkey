text: '(e)

  Ambient temperature. Ambient temperature limitations (including limitations for winterization

  installations if applicable) must be established as the maximum ambient atmospheric temperature
  at

  which compliance with the cooling provisions of §§ 29.1041 through 29.1049 is shown.

