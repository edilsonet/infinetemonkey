text: '(g)

  A list of special tools needed.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1589

  14 CFR 29.1589 (enhanced display)

  page 152 of 167


  The Instructions for Continued Airworthiness must contain a section titled Airworthiness
  Limitations that is

  segregated and clearly distinguishable from the rest of the document. This section must
  set forth each mandatory

  replacement time, structural inspection interval, and related structural inspection procedure
  required for type

  certification. If the Instructions for Continued Airworthiness consist of multiple documents,
  the section required by

  this paragraph must be included in the principal manual. This section must contain a legible
  statement in a

  prominent location that reads: “The Airworthiness Limitations section is FAA approved and
  specifies maintenance

  required under §§ 43.16 and 91.403 of the Federal Aviation Regulations unless an alternative
  program has been FAA

  approved.”

  Appendix B to Part 29 - Airworthiness Criteria for Helicopter Instrument Flight

  I.

  General. A transport category helicopter may not be type certificated for operation under
  the instrument

  flight rules (IFR) of this chapter unless it meets the design and installation requirements
  contained in this

  appendix.

  II.

  Definitions.'
