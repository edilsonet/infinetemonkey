title: 29.1415(i)
text: '(i)

  Rated 30-second OEI power operation. Rated 30-second OEI power is permitted only on multiengine,

  turbine-powered rotorcraft, also certificated for the use of rated 2-minute OEI power, and
  can only be used

  for continued operation of the remaining engine(s) after a failure or precautionary shutdown
  of an engine.

  It must be shown that following application of 30-second OEI power, any damage will be readily

  detectable by the applicable inspections and other related procedures furnished in accordance
  with

  Section A29.4 of appendix A of this part and Section A33.4 of appendix A of part 33. The
  use of

  30-second OEI power must be limited to not more than 30 seconds for any period in which
  that power is

  used, and by -

  (1)

  The maximum rotational speed which may not be greater than -

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.1521(f)

  14 CFR 29.1521(i)(1) (enhanced display)

  page 143 of 167


  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c), Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 29.1522 Auxiliary power unit limitations.

  If an auxiliary power unit that meets the requirements of TSO-C77 is installed in the rotorcraft,
  the limitations

  established for that auxiliary power unit under the TSO including the categories of operation
  must be specified as

  operating limitations for the rotorcraft.

  (Secs. 313(a), 601, 603, 604, Federal Aviation Act of 1958 (49 U.S.C. 1354(a), 1421, 1423),
  sec. 6(c), Dept. of

  Transportation Act (49 U.S.C. 1655(c)))

  § 29.1523 Minimum flight crew.

  The minimum flight crew must be established so that it is sufficient for safe operation,
  considering -

  § 29.1525 Kinds of operations.

  The kinds of operations (such as VFR, IFR, day, night, or icing) for which the rotorcraft
  is approved are established by

  demonstrated compliance with the applicable certification requirements and by the installed
  equipment.'
