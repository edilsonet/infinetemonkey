text: '(j)

  Rated 2-minute OEI power operation. Rated 2-minute OEI power is permitted only on multiengine,
  turbine-

  powered rotorcraft, also certificated for the use of rated 30-second OEI power, and can
  only be used for

  continued operation of the remaining engine(s) after a failure or precautionary shutdown
  of an engine. It

  must be shown that following application of 2-minute OEI power, any damage will be readily
  detectable by

  the applicable inspections and other related procedures furnished in accordance with Section
  A29.4 of

  appendix a of this part and Section A33.4 of appendix A of part 33. The use of 2-minute
  OEI power must

  be limited to not more than 2 minutes for any period in which that power is used, and by
  -

  (1)

  The maximum rotational speed, which may not be greater than -'
