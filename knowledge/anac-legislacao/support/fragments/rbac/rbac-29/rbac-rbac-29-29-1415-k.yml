text: '(k)

  Before the start of the demonstration, approximately one-half of the total average amount
  of carry-on

  baggage, blankets, pillows, and other similar articles must be distributed at several locations
  in the aisles

  and emergency exit access ways to create minor obstructions.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR Appendix-D-to-Part-29(a)

  14 CFR Appendix-D-to-Part-29(k) (enhanced display)

  page 164 of 167


  Appendix E to Part 29 - HIRF Environments and Equipment HIRF Test Levels

  This appendix specifies the HIRF environments and equipment HIRF test levels for electrical
  and electronic systems

  under § 29.1317. The field strength values for the HIRF environments and laboratory equipment
  HIRF test levels are

  expressed in root-mean-square units measured during the peak of the modulation cycle.

