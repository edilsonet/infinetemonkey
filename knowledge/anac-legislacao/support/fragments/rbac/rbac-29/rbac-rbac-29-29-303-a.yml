title: 29.303(a)
text: '(a)

  Attitudes. Under each of the loading conditions prescribed in paragraph (b) of this section,
  the rotorcraft

  is assumed to be in each of the following level landing attitudes:

  (1)

  An attitude in which each wheel contacts the ground simultaneously.

  (2)

  An attitude in which the aft wheels contact the ground with the forward wheels just clear
  of the

  ground.'
