text: '(b)

  Loading conditions. The rotorcraft must be designed for the following landing loading conditions:

  (1)

  Vertical loads applied under § 29.471.

  (2)

  The loads resulting from a combination of the loads applied under paragraph (b)(1) of this
  section

  with drag loads at each wheel of not less than 25 percent of the vertical load at that wheel.

