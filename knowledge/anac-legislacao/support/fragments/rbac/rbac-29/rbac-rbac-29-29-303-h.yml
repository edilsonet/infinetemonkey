title: 29.303(h)
text: '(h)

  Rear wheel turning loads in the static ground attitude. In the static ground attitude, and
  with the shock

  absorbers and tires in their static positions, the rotorcraft must be designed for rear
  wheel turning loads

  as follows:

  (1)

  A vertical ground reaction equal to the static load on the rear wheel must be combined with
  an

  equal side load.

  (2)

  The load specified in paragraph (h)(1) of this section must be applied to the rear landing
  gear -'
