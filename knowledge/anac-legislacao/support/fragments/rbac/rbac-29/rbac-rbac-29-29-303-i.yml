text: '(i)

  For the aft wheels, the side loads specified in paragraph (b)(1) of this section; and

  (ii)

  For the forward wheels, a side load of 0.8 times the vertical reaction combined with the

  vertical load specified in paragraph (a) of this section.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

