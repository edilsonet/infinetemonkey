title: 29.341(a)
text: '(a)

  The materials (including finishes or decorative surfaces applied to the materials) must
  meet the

  following test criteria as applicable:

  (1)

  Interior ceiling panels, interior wall panels, partitions, galley structure, large cabinet
  walls, structural

  flooring, and materials used in the construction of stowage compartments (other than underseat

  stowage compartments and compartments for stowing small items such as magazines and maps)

  must be self-extinguishing when tested vertically in accordance with the applicable portions
  of

  appendix F of Part 25 of this chapter, or other approved equivalent methods. The average
  burn

  length may not exceed 6 inches and the average flame time after removal of the flame source
  may

  not exceed 15 seconds. Drippings from the test specimen may not continue to flame for more
  than

  an average of 3 seconds after falling.

  (2)

  Floor covering, textiles (including draperies and upholstery), seat cushions, padding, decorative
  and

  nondecorative coated fabrics, leather, trays and galley furnishings, electrical conduit,
  thermal and

  acoustical insulation and insulation covering, air ducting, joint and edge covering, cargo

  compartment liners, insulation blankets, cargo covers, and transparencies, molded and

  thermoformed parts, air ducting joints, and trim strips (decorative and chafing) that are
  constructed

  of materials not covered in paragraph (a)(3) of this section, must be self extinguishing
  when tested

  vertically in accordance with the applicable portion of appendix F of Part 25 of this chapter,
  or other

