  approved equivalent methods. The average burn length may not exceed 8 inches and the average

  flame time after removal of the flame source may not exceed 15 seconds. Drippings from the
  test

  specimen may not continue to flame for more than an average of 5 seconds after falling.

  (3)

  Acrylic windows and signs, parts constructed in whole or in part of elastometric materials,
  edge

  lighted instrument assemblies consisting of two or more instruments in a common housing,
  seat

  belts, shoulder harnesses, and cargo and baggage tiedown equipment, including containers,
  bins,

  pallets, etc., used in passenger or crew compartments, may not have an average burn rate
  greater

  than 2.5 inches per minute when tested horizontally in accordance with the applicable portions
  of

  appendix F of Part 25 of this chapter, or other approved equivalent methods.

  (4)

  Except for electrical wire and cable insulation, and for small parts (such as knobs, handles,
  rollers,

  fasteners, clips, grommets, rub strips, pulleys, and small electrical parts) that the Administrator
  finds

  would not contribute significantly to the propagation of a fire, materials in items not
  specified in

  paragraphs (a)(1), (a)(2), or (a)(3) of this section may not have a burn rate greater than
  4 inches per

  minute when tested horizontally in accordance with the applicable portions of appendix F
  of Part 25

  of this chapter, or other approved equivalent methods.'
