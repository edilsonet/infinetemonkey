text: '(b)

  Forward and rear position lights. The light distribution and intensities of forward and
  rear position lights

  must be expressed in terms of minimum intensities in the horizontal plane, minimum intensities
  in any

  vertical plane, and maximum intensities in overlapping beams, within dihedral angles, L,
  R, and A, and

  must meet the following requirements:

  (1)

  Intensities in the horizontal plane. Each intensity in the horizontal plane (the plane containing
  the

  longitudinal axis of the rotorcraft and perpendicular to the plane of symmetry of the rotorcraft),
  must

  equal or exceed the values in § 29.1391.

  (2)

  Intensities in any vertical plane. Each intensity in any vertical plane (the plane perpendicular
  to the

  horizontal plane) must equal or exceed the appropriate value in § 29.1393 where I is the
  minimum

  intensity prescribed in § 29.1391 for the corresponding angles in the horizontal plane.

  (3)

  Intensities in overlaps between adjacent signals. No intensity in any overlap between adjacent

  signals may exceed the values in § 29.1395, except that higher intensities in overlaps may
  be used

  with the use of main beam intensities substantially greater than the minima specified in
  §§ 29.1391

  and 29.1393 if the overlap intensities in relation to the main beam intensities do not adversely
  affect

  signal clarity.

