text: '(c)

  The failure of mechanical parts (such as piston rods and links), and the jamming of power
  cylinders,

  must be considered unless they are extremely improbable.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.685(d)(7)

  14 CFR 29.723 (enhanced display)

  page 55 of 167


  § 29.725 Limit drop test.

  The limit drop test must be conducted as follows:

  where:

  We = the effective weight to be used in the drop test (lbs.).

  W = WM for main gear units (lbs.), equal to the static reaction on the particular unit with
  the rotorcraft in the most

  critical attitude. A rational method may be used in computing a main gear static reaction,
  taking into consideration

  the moment arm between the main wheel reaction and the rotorcraft center of gravity.

  W = WN for nose gear units (lbs.), equal to the vertical component of the static reaction
  that would exist at the nose

  wheel, assuming that the mass of the rotorcraft acts at the center of gravity and exerts
  a force of 1.0g downward

  and 0.25g forward.

  W = Wt for tailwheel units (lbs.) equal to whichever of the following is critical -

  (1) The static weight on the tailwheel with the rotorcraft resting on all wheels; or

  (2) The vertical component of the ground reaction that would occur at the tailwheel assuming
  that the mass of the

  rotorcraft acts at the center of gravity and exerts a force of 1g downward with the rotorcraft
  in the maximum nose-

  up attitude considered in the nose-up landing conditions.

  h = specified free drop height (inches).

  L = ratio of assumed rotor lift to the rotorcraft weight.

  d = deflection under impact of the tire (at the proper inflation pressure) plus the vertical
  component of the axle

  travel (inches) relative to the drop mass.

  n = limit inertia load factor.'
