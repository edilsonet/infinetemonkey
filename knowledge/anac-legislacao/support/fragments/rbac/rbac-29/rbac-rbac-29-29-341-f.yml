text: '(f)

  Each emergency exit, and its means of opening, must be marked on the outside of the rotorcraft.
  In

  addition, the following apply:

  (1)

  There must be a 2-inch colored band outlining each passenger emergency exit, except small

  rotorcraft with a maximum weight of 12,500 pounds or less may have a 2-inch colored band
  outlining

  each exit release lever or device of passenger emergency exits which are normally used doors.

  (2)

  Each outside marking, including the band, must have color contrast to be readily distinguishable

  from the surrounding fuselage surface. The contrast must be such that, if the reflectance
  of the

  darker color is 15 percent or less, the reflectance of the lighter color must be at least
  45 percent.

  “Reflectance” is the ratio of the luminous flux reflected by a body to the luminous flux
  it receives.

  When the reflectance of the darker color is greater than 15 percent, at least a 30 percent
  difference

  between its reflectance and the reflectance of the lighter color must be provided.

  14 CFR Part 29 (up to date as of 5/03/2022)

