title: 29.341(g)
text: '(g)

  The slide for each passenger emergency exit must be a self-supporting slide or equivalent,
  and must be

  designed to meet the following requirements:

  (1)

  It must be automatically deployed, and deployment must begin during the interval between
  the time

  the exit opening means is actuated from inside the rotorcraft and the time the exit is fully
  opened.

  However, each passenger emergency exit which is also a passenger entrance door or a service
  door

  must be provided with means to prevent deployment of the slide when the exit is opened from
  either

  the inside or the outside under nonemergency conditions for normal use.

  (2)

  It must be automatically erected within 10 seconds after deployment is begun.

  (3)

  It must be of such length after full deployment that the lower end is self-supporting on
  the ground

  and provides safe evacuation of occupants to the ground after collapse of one or more legs
  or part

  of the landing gear.

  (4)

  It must have the capability, in 25-knot winds directed from the most critical angle, to
  deploy and,

  with the assistance of only one person, to remain usable after full deployment to evacuate

  occupants safely to the ground.

  (5)

  Each slide installation must be qualified by five consecutive deployment and inflation tests

  conducted (per exit) without failure, and at least three tests of each such five-test series
  must be

  conducted using a single representative sample of the device. The sample devices must be
  deployed

  and inflated by the system''s primary means after being subjected to the inertia forces
  specified in §

  29.561(b). If any part of the system fails or does not function properly during the required
  tests, the

  cause of the failure or malfunction must be corrected by positive means and after that,
  the full series

  of five consecutive deployment and inflation tests must be conducted without failure.'
