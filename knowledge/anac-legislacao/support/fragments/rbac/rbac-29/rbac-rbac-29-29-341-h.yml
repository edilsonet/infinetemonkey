title: 29.341(h)
text: '(h)

  Based on the requirements of this section, inspections and retirement times or approved
  equivalent

  means must be established to avoid catastrophic failure. The inspections and retirement
  times or

  approved equivalent means must be included in the Airworthiness Limitations Section of the
  Instructions

  for Continued Airworthiness required by Section 29.1529 and Section A29.4 of Appendix A
  of this part.'
