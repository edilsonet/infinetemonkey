title: 29.341(m)
text: '(m)

  Any components that are affected by maneuvering and gust loads must be investigated for
  the same

  flight conditions as are the main rotors, and their service lives must be determined by
  fatigue tests or by

  other acceptable methods. In addition, a level of safety equal to that of the main rotors
  must be provided

  for -

  (1)

  Each component in the rotor drive system whose failure would cause an uncontrolled landing;

  (2)

  Each component essential to the phasing of rotors on multirotor rotorcraft, or that furnishes
  a

  driving link for the essential control of rotors in autorotation; and

  (3)

  Each component common to two or more engines on multiengine rotorcraft.'
