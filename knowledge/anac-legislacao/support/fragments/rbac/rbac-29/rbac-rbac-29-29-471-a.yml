title: 29.471(a)
text: '(a)

  General. For hull type rotorcraft, the structure must be designed to withstand the water
  loading set forth

  in paragraphs (b), (c), and (d) of this section considering the most severe wave heights
  and profiles for

  which approval is desired. The loads for the landing conditions of paragraphs (b) and (c)
  of this section

  must be developed and distributed along and among the hull and auxiliary floats, if used,
  in a rational and

  conservative manner, assuming a rotor lift not exceeding two-thirds of the rotorcraft weight
  to act

  throughout the landing impact.'
