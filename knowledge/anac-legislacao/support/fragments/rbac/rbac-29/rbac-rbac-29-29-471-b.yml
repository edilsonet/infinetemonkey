title: 29.471(b)
text: '(b)

  A side load condition in which -

  (1)

  A vertical load of 0.75 times the total vertical load specified in paragraph (a)(1) of this
  section is

  divided equally among the floats; and

  (2)

  For each float, the load share determined under paragraph (b)(1) of this section, combined
  with a

  total side load of 0.25 times the total vertical load specified in paragraph (b)(1) of this
  section, is

  applied to that float only.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.519

  14 CFR 29.521(b)(2) (enhanced display)

