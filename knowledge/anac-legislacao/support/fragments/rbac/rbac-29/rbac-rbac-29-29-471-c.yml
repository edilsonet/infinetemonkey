text: '(c)

  In determining the total load on a gear unit, the transverse shift in the load centroid,
  due to

  unsymmetrical load distribution on the wheels, may be neglected.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.501(f)

  14 CFR 29.511(c) (enhanced display)

  page 37 of 167


  § 29.519 Hull type rotorcraft: Water-based and amphibian.

  § 29.521 Float landing conditions.

  If certification for float operation (including float amphibian operation) is requested,
  the rotorcraft, with floats, must

  be designed to withstand the following loading conditions (where the limit load factor is
  determined under §

  29.473(b) or assumed to be equal to that determined for wheel landing gear):

  MAIN COMPONENT REQUIREMENTS'
