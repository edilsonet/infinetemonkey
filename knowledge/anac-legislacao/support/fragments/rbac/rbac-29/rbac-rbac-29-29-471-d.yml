title: 29.471(d)
text: '(d)

  Auxiliary float immersion condition. In addition to the loads from the landing conditions,
  the auxiliary

  float, and its support and attaching structure in the hull, must be designed for the load
  developed by a

  fully immersed float unless it can be shown that full immersion of the float is unlikely,
  in which case the

  highest likely float buoyancy load must be applied that considers loading of the float immersed
  to create

  restoring moments compensating for upsetting moments caused by side wind, asymmetrical rotorcraft

  loading, water wave action, and rotorcraft inertia.'
