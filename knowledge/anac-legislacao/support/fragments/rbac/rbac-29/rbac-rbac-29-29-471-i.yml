text: '(i)

  Equal to the vertical loads obtained in the condition specified in paragraph (b) of this
  section;

  and

  (ii)

  Divided equally among the skids.

  (2)

  The vertical ground reactions must be combined with a horizontal sideload of 25 percent
  of their

  value.

  (3)

  The total sideload must be applied equally between skids and along the length of the skids.

  (4)

  The unbalanced moments are assumed to be resisted by angular inertia.

  (5)

  The skid gear must be investigated for -'
