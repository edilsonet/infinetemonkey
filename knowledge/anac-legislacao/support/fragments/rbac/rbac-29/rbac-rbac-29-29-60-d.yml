title: 29.60(d)
text: '(d)

  Wind velocities from zero to at least 17 knots, from all azimuths, must be established in
  which the

  rotorcraft can be operated without loss of control out-of-ground effect, with -

  (1)

  Weight selected by the applicant;

  (2)

  Critical center of gravity;

  (3)

  Rotor r.p.m. selected by the applicant; and

  (4)

  Altitude, from standard sea level conditions to the maximum takeoff and landing altitude
  capability

  of the rotorcraft.'
