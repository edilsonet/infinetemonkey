text: '(e)

  The rotorcraft, after

  (1)

  failure of one engine, in the case of multiengine rotorcraft that meet Transport Category
  A engine

  isolation requirements, or

  (2)

  complete power failure in the case of other rotorcraft, must be controllable over the range
  of

  speeds and altitudes for which certification is requested when such power failure occurs
  with

  maximum continuous power and critical weight. No corrective action time delay for any condition

  following power failure may be less than -'
