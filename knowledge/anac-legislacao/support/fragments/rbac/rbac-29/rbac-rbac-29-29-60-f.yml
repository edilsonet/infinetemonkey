text: '(f)

  For helicopters for which a VNE (power-off) is established under § 29.1505(c), compliance
  must be

  demonstrated with the following requirements with critical weight, critical center of gravity,
  and critical

  rotor r.p.m.:

  (1)

  The helicopter must be safely slowed to VNE (power-off), without exceptional pilot skill
  after the last

  operating engine is made inoperative at power-on VNE.

  (2)

  At a speed of 1.1 VNE (power-off), the margin of cyclic control must allow satisfactory
  roll and pitch

  control with power off.

