text: '(c)

  Total weight with jettisonable external load. A total weight for the rotorcraft with a jettisonable
  external

  load attached that is greater than the maximum weight established under paragraph (a) of
  this section

  may be established for any rotorcraft-load combination if -

  (1)

  The rotorcraft-load combination does not include human external cargo,

  (2)

  Structural component approval for external load operations under either § 29.865 or under

  equivalent operational standards is obtained,

  (3)

  The portion of the total weight that is greater than the maximum weight established under

  paragraph (a) of this section is made up only of the weight of all or part of the jettisonable
  external

  load,

  (4)

  Structural components of the rotorcraft are shown to comply with the applicable structural

  requirements of this part under the increased loads and stresses caused by the weight increase
  over

  that established under paragraph (a) of this section, and

  (5)

  Operation of the rotorcraft at a total weight greater than the maximum certificated weight

  established under paragraph (a) of this section is limited by appropriate operating limitations
  under

  § 29.865 (a) and (d) of this part.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.21(b)

