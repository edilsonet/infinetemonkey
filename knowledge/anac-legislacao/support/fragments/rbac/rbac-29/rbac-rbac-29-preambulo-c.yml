  (Secs. 313(a), 601, 603, 604, and 605 of the Federal Aviation Act of 1958 (49 U.S.C. 1354(a),
  1421, 1423, 1424, and

  1425); and sec. 6(c) of the Dept. of Transportation Act (49 U.S.C. 1655(c)))

  § 29.31 Removable ballast.

  Removable ballast may be used in showing compliance with the flight requirements of this
  subpart.

  § 29.33 Main rotor speed and pitch limits.'
