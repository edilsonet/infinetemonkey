text: '(d)

  For rotorcraft other than helicopters, the steady rate of climb at the minimum operating
  speed must be

  determined over the ranges of weight, altitude, and temperature for which certification
  is requested with -

  (1)

  Takeoff power; and

  (2)

  The landing gear extended.

  14 CFR Part 29 (up to date as of 5/03/2022)

  Airworthiness Standards: Transport Category Rotorcraft

  14 CFR 29.45(c)(1)

  14 CFR 29.49(d)(2) (enhanced display)

  page 15 of 167


  § 29.51 Takeoff data: general.

  § 29.53 Takeoff: Category A.

  The takeoff performance must be determined and scheduled so that, if one engine fails at
  any time after the start of

  takeoff, the rotorcraft can -

  § 29.55 Takeoff decision point (TDP): Category A.

  § 29.59 Takeoff path: Category A.'
