title: preambulo(e)
text: '(e)

  Main rotor low speed warning for helicopters. For each single engine helicopter, and each
  multiengine

  helicopter that does not have an approved device that automatically increases power on the
  operating

  engines when one engine fails, there must be a main rotor low speed warning which meets
  the following

  requirements:

  (1)

  The warning must be furnished to the pilot in all flight conditions, including power-on
  and power-off

  flight, when the speed of a main rotor approaches a value that can jeopardize safe flight.

  (2)

  The warning may be furnished either through the inherent aerodynamic qualities of the helicopter

  or by a device.

  (3)

  The warning must be clear and distinct under all conditions, and must be clearly distinguishable

  from all other warnings. A visual device that requires the attention of the crew within
  the cockpit is

  not acceptable by itself.

  (4)

  If a warning device is used, the device must automatically deactivate and reset when the
  low-speed

  condition is corrected. If the device has an audible warning, it must also be equipped with
  a means

  for the pilot to manually silence the audible warning before the low-speed condition is
  corrected.'
