title: preambulo(i)
text: '(i)

  The critical engine inoperative and the remaining engines within approved operating

  limitations, except that for rotorcraft for which the use of 30-second/2-minute OEI power
  is

  requested, only the 2-minute OEI power may be used in showing compliance with this

  paragraph;

  (ii)

  The landing gear extended; and

  (iii)

  The takeoff safety speed selected by the applicant.

  (2)

  The steady rate of climb without ground effect, 1000 feet above the takeoff surface, must
  be at

  least 150 feet per minute, for each weight, altitude, and temperature for which takeoff
  data are to be

  scheduled with -'
