title: apendice-a-i-diferencas-do-rbac-33-em-relacao-ao-14cf-f01cfa(a)
text: '(a) Geral

  Para concessão de certificados de tipo para motores aeronáuticos, será adotado integralmente,
  na língua inglesa, o regulamento Title 14 Code of Federal Regulations Part 33 original,
  alterado pelas emendas 33-1 a 33-36, estando esta última em vigor desde 5 de junho de 2023,
  da autoridade de aviação civil, Federal Aviation Administration - FAA, do Department of
  Transportation dos Estados Unidos da América. Uma cópia deste regulamento é apresentada
  no mesmo sítio eletrônico que contém este RBAC. (Redação dada pela Resolução nº 768, de
  14.03.2025)'
