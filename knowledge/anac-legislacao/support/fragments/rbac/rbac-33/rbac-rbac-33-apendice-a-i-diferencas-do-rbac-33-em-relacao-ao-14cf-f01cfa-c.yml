title: apendice-a-i-diferencas-do-rbac-33-em-relacao-ao-14cf-f01cfa(c)
text: '(c) Adoção de Emendas Subsequentes

  As emendas posteriores à emenda 33-36 do Title 14 Code of Federal Regulations Part 33 da
  autoridade de aviação civil, Federal Aviation Administration - FAA, do Department of Transportation
  dos Estados Unidos da América são adotadas pela ANAC e entram em vigor no âmbito interno
  como emendas ao RBAC 33 no primeiro dia do mês subsequente após 6 (seis) meses de sua vigência
  nos Estados Unidos da América, salvo disposição contrária da ANAC dentro deste período.
  (Redação dada pela Resolução nº 768, de 14.03.2025)'
