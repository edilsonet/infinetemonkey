  A36.5.4.2

  For each of the thre certification measuring points, the minimum sample size

  is six. The

  sample size must be large enough to establish statisticaly for each of the thre average
  noise

  certification levels a 90 percent confidence limit not exceding ±1.5 EPNdB. No test result
  may be

  omited from the averaging proces unles aprove

  d by the FA.


  Note: Permited methods for calculating the 90 percent confidence interval are shown in the
  curent

  advisory circular for this part.


  A36.5.4.3

  The average EPNL figures obtained by the proces described in section A36.5.4.1 must

  be those by w

  hich the noise performance of the airplane is asesed against the noise certification

  criteria.


