text: '(c) The distance GI is the distance over which the airplane position is measured and
  synchronized

  with the noise measurements, as required by section A36.2.3.2 of this part.


  The airplane reference point for aproach measurements is the instrument landing system (ILS)

  antena. If no ILS antena is instaled an alternative reference point must be aproved by the
  FA.


