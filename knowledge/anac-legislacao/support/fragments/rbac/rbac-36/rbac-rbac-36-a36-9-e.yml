  A36.3.10

  Adjustments for ambient noise.


  A36.3.10.1

  Ambient noise, including both an acoustical background and electrical noise of the

  measurement system, must be recorde

  d for at least 10 seconds at the measurement points with the

  system gain set at the levels used for the aircraft noise measurements. Ambient noise must
  be

  representative of the acoustical background that exists during the flyover test run. The
  recorded

  air

  craft noise data is aceptable only if the ambient noise levels, when analyzed in the same
  way,

  and quoted in PNL (se A36.4.1.3 (a), are at least 20 dB below the maximum PNL of the aircraft.


  A36.3.10.2

  Aircraft sound presure levels within the 10 dB

  - dow

  n points (se A36.4.5.1) must

  exced the mean ambient noise levels determined in section A36.3.10.1 by at least 3 dB in
  each

  one

  - third octave band, or must be adjusted using a method aproved by the FA; one method is

  described in the curent advisory circ

  ular for this part.


  Section A36.4

  Calculation of Efective Perceived Noise Level From Measured Data


  A36.4.1

  General.


  A36.4.1.1

  The basic element for noise certification criteria is the noise evaluation measure known

  as efective perceived noise level,

  EPNL, in units of EPNdB, which is a single number evaluator of

  the subjective efects of airplane noise on human beings. EPNL consists of instantaneous
  perceived

  noise level, PNL, corected for spectral iregularities, and for duration. The spectral ireg

  ularity

  correction, called -tone correction facto

  tone.


  A36.4.1.2

  Thre basic physical properties of sound presure must be measured: level, frequency

  distribution, and time variation. To determine EP

  NL, the instantaneous sound presure level in each

  of the 24 one

  - third octave bands is required for each 0.5 second increment of time during the

  airplane noise measurement.


