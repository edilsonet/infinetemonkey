  A36.3.9.10

  The fre

  - field insertion los of the windscren for each one

  - third octave nominal

  midband frequency from 50 Hz to 10 kHz inclusive must be determined with sinusoidal sound

  signals at the incidence angles determined to

  be aplicable for corection of directional response

  efects per section A36.3.9.3. The interval betwen angles tested must not exced 30 degres.
