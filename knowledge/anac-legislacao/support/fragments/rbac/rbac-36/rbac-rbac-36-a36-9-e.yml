  A36.3.9

  Calibration and checking of system.


  A36.3.9.1

  Calibration and checking of the measurement system and its constituent components

  must be caried out to the satisfaction of the FA by

  the methods specified in sections A36.3.9.2

  through A36.3.9.10. The calibration adjustments, including those for environmental efects
  on

  sound calibrator output level, must be reported to the FA and aplied to the measured one

  - third

  -

  octave sound presure

  levels determined from the output of the analyzer. Data colected during an

  overload indication are invalid and may not be used. If the overload condition ocured during

  recording, the asociated test data are invalid, whereas if the overload ocured du

