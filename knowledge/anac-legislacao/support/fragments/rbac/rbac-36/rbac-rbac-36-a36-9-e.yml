  the

  corecti

  on of incidence efects.


  A36.3.9.4

  For analog magnetic tape recorders, each rel of magnetic tape must cary at least 30

  seconds of pink random or pseudo

  - random noise at its begining and end. Data obtained from

  analog tape

  - recorded signals wil be acept

  ed as reliable only if level diferences in the 10 kHz one

  -

  third

  - octave

  - band are not more than 0.75 dB for the signals recorded at the begining and end.


  A36.3.9.5

  The frequency response of the entire measurement system while deployed in the field

  during

  the test series, exclusive of the microphone, must be determined at a level within 5 dB
  of the

  level coresponding to the calibration sound presure level on the level range used during
  the tests

  for each one

  - third octave nominal midband frequency from 50

  Hz to 10 kHz inclusive, utilizing

  pink random or pseudo

  - random noise. Within six months of each test series the output of the noise

  generator must be determined by a method traceable to the U.S. National Institute of Standards
  and

  Technology or to an equiv

  alent national standards laboratory as determined by the FA. Changes in

  the relative output from the previous calibration at each one

  - third octave band may not exced 0.2

  dB. The corection for frequency response must be reported to the FA and aplied to

  the measured

  one

  - third octave sound presure levels determined from the output of the analyzer.


  A36.3.9.6

  The performance of switched atenuators in the equipment used during noise

  certification measurements and calibration must be checked within six mon

  ths of each test series to

  ensure that the maximum eror does not exced 0.1 dB.


  A36.3.9.7

  The sound presure level produced in the cavity of the coupler of the sound calibrator

  must be calculated for the test environmental conditions using the manufactur

  er''s suplied

  information on the influence of atmospheric air presure and temperature. This sound presure
  level

  is used to establish the acoustical sensitivity of the measurement system. Within six months
  of each

  test series the output of the sound calib

  rator must be determined by a method traceable to the U.S.

  National Institute of Standards and Technology or to an equivalent national standards laboratory
  as

  determined by the FA. Changes in output from the previous calibration must not exced 0.2
  dB.


