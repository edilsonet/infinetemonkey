  . For each 0.5 second data record this instant in time may also be identified as 1.25

  seconds after the start of the asociated 2 second averaging period.


  A36.3.7.7

  The resolution of the sound presure levels, both displayed and stored, must be 0.1 dB or

  finer.


  A36.3.8

  Calibration systems.


  A36.3.8.1 The acoustical sensitivity of the measurement system must be determined using
  a sound

