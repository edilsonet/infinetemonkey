title: A36.9(h)
text: '(h) Engine performance data:


  (1) For jet airplanes: engine performance in terms of net thrust, engine presure ratio

  s, jet exhaust

  temperatures and fan or compresor shaft rotational speds as determined from airplane instruments

  and manufacturer''s data for each test run;


  (2) For propeler

  - driven airplanes: engine performance in terms of brake horsepower and residual

  th rust; or equivalent shaft horsepower; or engine torque and propeler rotational sped;
  as

  determined from airplane instruments and manufacturer''s data for each test run;'
