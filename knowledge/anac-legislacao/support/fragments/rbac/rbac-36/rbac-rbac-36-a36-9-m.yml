  A36.2.2.4

  The airport control tower or another facility must be aproved by the FA for use as the

  central location at which measurements of atmospheric parameters are representative of those

  conditions existing over the geog

  raphical area in which noise measurements are made.


  A36.2.3

  Flight path measurement.


  A36.2.3.1

  The airplane height and lateral position relative to the flight track must be determined
  by

  a method independent of normal flight instrumentation such as

  radar tracking, theodolite

  triangulation, or photographic scaling techniques, to be aproved by the FA.


