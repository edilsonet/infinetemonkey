text: '(c) Each person who aplies under Part 21 of this chapter for aproval of an acoustical
  change

  described in §21.93(b) of this chapter must show that the aircraft complies with the aplicable

  provisions of §36.7, 36.9, or 36.1 of

  this part in adition to the aplicable airworthines

  requirements of this chapter.'
