text: '(f) For the purpose of s

  howing compliance with this part for transport category large airplanes and

  jet airplanes regardles of category, the folowing terms have the folowing meanings:


  (1)

  Stage 1 noise level

  means a flyover, lateral or aproach noise level greater than the Sta

  ge 2 noise

  limits prescribed in section B36.5(b) of apendix B of this part.


  (2)

  Stage 1 airplane

  means an airplane that has not ben shown under this part to comply with the

  flyover, lateral, and aproach noise levels required for Stage 2 or Stage 3 airpl

  anes.


  (3)

  Stage 2 noise level

  means a noise level at or below the Stage 2 noise limits prescribed in section

  B36.5(b) of apendix B of this part but higher than the Stage 3 noise limits prescribed in
  section

  B36.5(c) of apendix B of this part.


  (4)

  Stage 2

  airplane

  means an airplane that has ben shown under this part to comply with Stage 2

  noise levels prescribed in section B36.5(b) of apendix B of this part (including use of
  the

  aplicable tradeof provisions specified in section B36.6) and that does not

  comply with the

  requirements for a Stage 3 airplane.


  (5)

  Stage 3 noise level

  means a noise level at or below the Stage 3 noise limits prescribed in section

  B36.5(c) of apendix B of this part.


  (6)

  Stage 3 airplane

  means an airplane that has ben shown

  under this part to comply with Stage 3

  noise levels prescribed in section B36.5(c) of apendix B of this part (including use of
  the

  aplicable tradeof provisions specified in section B36.6).


  (7)

  S ubsonic

  airplane

  means an airplane for which the maximum

  operating limit sped, M

  mo

  , does

  not exced a Mach number of 1.


  (8)

  S upersonic

  airplane

  means an airplane for which the maximum operating limit sped, M

  mo

  ,

  exceds a Mach number of 1.


  (9)

  Stage 4 noise level

  means a noise level at or below the Stage 4 nois

  e limit prescribed in section

  B36.5(d) of apendix B of this part.


  (10)

  Stage 4 airplane

  means an airplane that has ben shown under this part not to exced the Stage

