text: '(h) For the purpose of showing compliance with this part, for helicopters in the primary,
  normal,

  transport, and restricted categories, the folowing terms have the specified meanings:


  (1)

  Stage 1 noise level

  means a takeof, flyover, or aproach noise level greater than the Stage 2

  noise limits prescribed in section H36.305 of apendix H of this part, or a flyover noise
  level

  greater than the Stage 2 noise limits prescribed in section J36.305 of apendix J of

  this part.


  (2)

  Stage 1 helicopter

  means a helicopter that has not ben shown under this part to comply with the

  takeof, flyover, and aproach noise levels required for Stage 2 helicopters as prescribed
  in section'
