text: '(a) Lateral ful

  - power reference noise measurement point:


  (1) For jet airplanes: The point on a line paralel to and 1,476 fet (450 m) from the runway

  centerline, or extended centerlin

  e, where the noise level after lift

  - of is at a maximum during

  takeof. For the purpose of showing compliance with Stage 1 or Stage 2 noise limits for an
  airplane

  powered by more than thre jet engines, the distance from the runway centerline must be 0.35

  nautical miles (648 m). For jet airplanes, when aproved by the FA, the maximum lateral noise
  at

  takeof thrust may be asumed to ocur at the point (or its aproved equivalent) along the extended

  centerline of the runway where the airplane reaches 985 fe

  et (30 meters) altitude above ground

  level. A height of 1427 fet (435 meters) may be asumed for Stage 1 or Stage 2 four engine

  airplanes. The altitude of the airplane as it pases the noise measurement points must be
  within

  +328 to Þ164 feet (+100 to Þ5

  0 meters) of the target altitude. For airplanes powered by other than

  jet engines, the altitude for maximum lateral noise must be determined experimentaly.


  (2) For propeler

  - driven airplanes: The point on the extended centerline of the runway above which

  the airplane, at ful takeof power, reaches a height of 2,13 fet (650 meters). For tests
  conducted

  before August 7, 202, an aplicant may use the measurement point specified in section B36.3(a)(1)

  as an alternative.'
