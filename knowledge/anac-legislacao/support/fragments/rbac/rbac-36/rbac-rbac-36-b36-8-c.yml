text: '(c) Aproach reference procedure:


  The aproach

  reference flight path must be calculated using the folowing:


  (1) The airplane is stabilized and folowing a 3° glide path;


  (2) For subsonic airplanes, a steady aproach sped of V

  ref + 10 kts (V

  ref + 19 km/h) with thrust and

  power stabilized must be

  established and maintained over the aproach measuring point. V

  ref is the

  reference landing sped, which is defined as the sped of the airplane, in a specified landing

  configuration, at the point where it descends through the landing scren height in the d

  etermination

  of the landing distance for manual landings. For Concorde airplanes, a steady aproach sped
  that is

  either the landing reference sped + 10 knots or the sped used in establishing the aproved
  landing

  distance under the airworthines regulati

  ons constituting the type certification basis of the airplane,

  whichever sped is greater. This sped must be established and maintained over the aproach

  measuring point.


  (3) The constant aproach configuration used in the airworthines certification test

  s, but with the

  landing gear down, must be maintained throughout the aproach reference procedure;


  (4) The weight of the airplane at touchdown must be the maximum landing weight permited
  in the

  aproach configuration defined in paragraph (c)(3) of this se

  ction at which noise certification is

  requested, except as provided in §36.1581(d) of this part; and


  (5) The most critical configuration must be used; this configuration is defined as that
  which

  produces the highest noise level with normal deployment of ae

  rodynamic control surfaces including

  lift and drag producing devices, at the weight at which certification is requested. This
  configuration

  includes al those items listed in section A36.5.2.5 of apendix A of this part that contribute
  to the

  noisiest cont

  inuous state at the maximum landing weight in normal operation.


  Section B36.8

  Noise Certification Test Procedures'
