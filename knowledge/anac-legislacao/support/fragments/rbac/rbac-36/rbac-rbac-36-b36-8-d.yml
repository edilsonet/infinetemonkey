title: B36.8(d)
text: '(d) If the airplane''s weight during the test is diferent from the weight at which
  noise certification is

  requested, the required EPNL adjustment may not exced

  2 EPNdB for each takeof and 1 EPNdB

  for each aproach. Data aproved by the FA must be used to determine the variation of EPNL

  with weight for both takeof and aproach test conditions. The necesary EPNL adjustment for

  variations in aproach flight pat

  h from the reference flight path must not exced 2 EPNdB.'
