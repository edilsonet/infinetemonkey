text: '(g) During takeof, lateral, and aproach tests, the airplane variation in instantaneous
  indicated

  airsped must be maintained within ±3% of the average airsped betwen

  the 10 dB

  - down points.

  This airsped is determined by the pilot''s airsped indicator. However, if the instantaneous
  indicated

  airsped exceds ±3 kt (±5.5 km/h) of the average airsped over the 10 dB

  - down points, and is

  determined by the FA representative

  on the flight deck to be due to atmospheric turbulence, then

  the flight so afected must be rejected for noise certification purposes.


  Note: Guidance material on the use of equivalent procedures is provided in the curent advisory

  circular for this part.


