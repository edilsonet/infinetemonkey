text: '(c) The ambient noise, including both acoustical background and electrical noise of
  the

  measurement systems, must be recorded and determined in the test area with the system gain
  set

  at

  levels that wil be used for aircraft noise measurements. If aircraft sound presure levels
  do not

  exced the background sound presure levels by at least 10 dB(A), aproved corections for the

  contribution of background sound presure level to the obs

  erved sound presure level must be

  aplied.


  Sec. F36.109

  Data recording, reporting, and aproval.'
