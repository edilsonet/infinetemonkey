  pounds, the limit increases from that point with the logarithm of airplane weight at the
  rate of 9.83

  dB (A) per doubling of weight, until the limit of 8 dB (A) is reached, after which the limit
  is

  constan

  t up to and including 19,0 pounds (8,618 kg). Figure G2 shows noise level limits vs

