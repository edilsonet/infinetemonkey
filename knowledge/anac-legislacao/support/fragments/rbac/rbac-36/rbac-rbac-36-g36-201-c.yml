  exced 70dB(A) for aircraft having a maximum

  certificated takeof weight of 1,257 pounds (570 kg) or les. For aircraft weights greater
  than 1,257

  pounds, the noise limit increases from that point with the logarithm of airplane weight
  at the rate of

  10.75d

  B(A) per doubling of weight, until the limit of 85dB(A) is reached, after which the limit
  is

  constant up to and including 19,0 pounds (8,618 kg). Figure G2 depicts noise level limits
  for

  airplane weights for single

  - engine airplanes.


