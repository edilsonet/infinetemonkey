text: '(a) The microphone must be a presure type, 12.7 m in diameter, with a protective grid,
  mounted

  in an inverted position such that the microphone diaphragm is 7 m above and paralel to a
  white

  -

  painted metal circular plate. This white

  - painted metal pl

  ate shal be 40 cm in diameter and at least

  2.5 m thick. The plate shal be placed horizontaly and flush with the surounding ground surface

  with no cavities below the plate. The microphone must be located thre

  - quarters of the distance

  from the center t

  o the back edge of the plate along a radius normal to the line of flight of the test

  airplane.'
