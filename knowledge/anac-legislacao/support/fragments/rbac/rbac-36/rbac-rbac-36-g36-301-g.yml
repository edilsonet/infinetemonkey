text: '(g) The folowing airplane in

  formation must be reported:


  (1) Type, model, and serial numbers (if any) of airplanes, engines, and propelers;


  (2) Any modifications or nonstandard equipment likely to afect the noise characteristics
  of the

  airplane;


  (3) Maximum certificated takeof weig

  ht;


  (4) For each test flight, airsped and ambient temperature at the flyover altitude over the
  measuring

  site determined by properly calibrated instruments;


  (5) For each test flight, engine performance parameters, such as manifold presure or power,

  prope

  ler sped (rpm) and other relevant parameters. Each parameter must be determined by

  properly calibrated instruments. For instance, propeler RPM must be validated by an independent

  device acurate to within ±1 percent, when the airplane is equiped with a

  mechanical tachometer.


  (6) Airsped, position, and performance data necesary to make the corections required in
  section


