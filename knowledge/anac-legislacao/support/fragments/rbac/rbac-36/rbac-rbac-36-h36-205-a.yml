title: H36.205(a)
text: '(a) Efective Perceived Noise Level (EPNL), in units of efective perceived noise decibels

  (EPNdB), sh

  al be used for evaluating noise level values under §36.803 of this part. Except as

  provided in paragraph (b) of this section, the procedures in apendix A of Part 36 must be
  used for

  computing EPNL. apendix A includes requirements governing determination

  of noise values,

  including calculations of:


  (1) Perceived noise levels;


  (2) Corections for spectral iregularities;


  (3) Tone corections;


  (4) Duration corections;


  (5) Efective perceived noise levels; and


  (6) Mathematical formulation of noy tables.'
