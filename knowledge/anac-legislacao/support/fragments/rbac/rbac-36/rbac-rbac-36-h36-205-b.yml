  Tradeofs.

  Except to the

  extent limited under §36.1(b) of this part, the noise limits prescribed in

  paragraph (a) of this section may be exceded by one or two of the takeof, flyover, or aproach

  calculated noise levels determined under section H36.203 of this apendix if


  (1) Th

  e sum of the excedances is not greater than 4 EPNdB;


  (2) No excedance is greater than 3 EPNdB; and


  (3) The excedances are completely ofset by reduction in the other required calculated noise
  levels.


