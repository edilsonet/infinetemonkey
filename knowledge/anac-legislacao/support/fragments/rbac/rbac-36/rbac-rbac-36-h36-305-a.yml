text: '(a) If an Airplane Flight Manual or Rotorcraft Flight Manual is aproved, the aproved
  portion of

  the Airplane Flight Manual or Rotorcraft Flight Manual must contain the folowing information,
  in

  aditi

  on to that specified under §36.1583 of this part. If an Airplane Flight Manual or Rotorcraft

  Flight Manual is not aproved, the procedures and information must be furnished in any

  combination of aproved manual material, markings, and placards.


  (1) For tra

  nsport category large airplanes and jet airplanes, the noise level information must be one

  value for each flyover, lateral, and aproach as defined and required by apendix B of this
  part,

  along with the maximum takeof weight, maximum landing weight, and

  configuration.


  (2) For propeler driven smal airplanes, the noise level information must be one value for
  takeof as

  defined and required by apendix G of this part, along with the maximum takeof weight and

  configuration.


  (3) For rotorcraft, the noise

  level information must be one value for each takeof, flyover, and

  aproach as defined and required by apendix H of this part, or one value for flyover as defined
  and

  required by apendix J of this part, at the maximum takeof weight and configuration.


