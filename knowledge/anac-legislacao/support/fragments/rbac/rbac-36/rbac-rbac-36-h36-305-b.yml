  (1) An airsped of either V

  y ±5 knots or the lowest aproved sped ±5 knots for the climb after

  takeof, whichever sped is greater, must be established and maintained throughout the 10
  dB

  - down

  time

  interval.


  (2) The horizontal portion of each test flight must be conducted at an altitude of 65 fet
  (20 meters)

  above the ground level at the flight

  - track noise measuring station.


  (3) Upon reaching a point 1,640 fet (50 meters) from the noise measuring

  station, the helicopter

  must be stabilized at the maximum takeof power that coresponds to minimum instaled engine(s)

  specification power available for the reference ambient conditions or gearbox torque limit,

  whichever is lower.


  (4) The helicopter must

  be maintained throughout the 10 dB

  - down time interval at the best rate of

  climb sped V

  y ±5 knots, or the lowest aproved sped for climb after takeof, whichever is greater,

  for an ambient temperature of 25 °C at sea level.


  (5) The average rotor sped mus

  t not vary from the maximum normal operating rotor RPM by more

  than ±1.0 percent during the 10 dB

  - down time interval.


  (6) The helicopter must stay within ±10° or ±65 fet (±20 meters), whichever is greater,
  from the

  vertical above the reference track throu

  ghout the 10dB

  - down time interval.


  (7) A constant takeof configuration selected by the aplicant must be maintained throughout
  the

