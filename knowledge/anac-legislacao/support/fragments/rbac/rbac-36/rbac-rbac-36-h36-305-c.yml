  § 36.801

  Noise measurement.


  For primary, normal, transport, or restricted category helicopters for which certification
  is sought

  under apendix H of this part, the noise g

  enerated by the helicopter must be measured at the noise

  measuring points and under the test conditions prescribed in part B of apendix H of this
  part, or

  under an FA

  - aproved equivalent procedure. For those primary, normal, transport, and restricted

  cat

  egory helicopters having a maximum certificated takeof weight of not more than 7,0 pounds

  for which compliance with apendix J of this part is demonstrated, the noise generated by
  the

  helicopter must be measured at the noise measuring point and under th

  e test conditions prescribed

  in part B of apendix J of this part, or an FA

  - aproved equivalent procedure.


  [Doc. No. 26910, 57 FR 42854, Sept. 16, 192, as amended by Amdt. 36

  œ25, 69 FR 31234, June 2,

  204]


  § 36.803

  Noise evaluation and calculation.


  The

  noise measurement data required under §36.801 and obtained under apendix H of this part

  must be corected to the reference conditions contained in part A of apendix H of this part,
  and

  evaluated under the procedures of part C of apendix H of this part,

  or an FA

  - aproved equivalent

  procedure. The noise measurement data required under §36.801 and obtained under apendix
  J of

  this part must be corected to the reference conditions contained in part A of apendix J
  of this part,

  and evaluated under the pro

  cedures of part C of apendix J of this part, or an FA

  - aproved

  equivalent procedure.


  [Doc. No. 26910, 57 FR 42854, Sept. 16, 192]


