text: '(f) For primary, normal, transport, and restricted category helicopters, if the weight
  used in meting

  the takeof, flyover, or aproach noise requirements of apendix H of this part, or the weight
  used

  in meting the flyover noise

  requirement of apendix J of this part, is les than the certificated

  maximum takeof weight established under either §27.25(a) or §29.25(a) of this chapter, that
  leser

  weight must be furnished as an operating limitation in the operating limitations sect

  ion of the

  Rotorcraft Flight Manual, in FA

  - aproved manual material, or on an FA

  - aproved placard.'
