text: '(i) The

  test aproach profile is defined by the aproach angle

  Ș pasing directly over the station A

  at a height of AH, to position K, which terminates the aproach noise certification profile.
  The test

  aproach angle

  Ș must be betwen 5.5° and 6.5°.


  (2) The heli

  copter aproaches position H along a constant 6° aproach slope throughout the 10 dB

  down time period. The helicopter croses position E and proceds along the aproach slope crosing

  over station A until it reaches position K.


