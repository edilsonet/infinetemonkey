  Section K1 General


  This apendix prescribes noise limits and procedures for measuring noise and adjusting the
  data to

  standard conditions for tiltrotors as specified in Sec. 36.1 of this RBAC.


  Sec

  tion K2 Noise Evaluation Measure


  The noise evaluation measure is the efective perceived noise level in EPNdB, to be calculated
  in

  acordance with section A36.4 of Apendix A to this RBAC, except corections for spectral

  iregularities must be determined u

  sing the 50 Hz sound presure level found in section H36.201 of

  Apendix H to this RBAC.


  Section K3 Noise Measurement Reference Points


