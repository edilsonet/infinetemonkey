text: '(c) Aproach reference noise measurement points

  - As shown in Figure

  K3 below:


  (1) The centerline noise measurement flight path reference point, designated A, is located
  on the

  ground 394 fet (120 m) verticaly below the reference aproach flight path. The measurement

  point is defined by the aproach reference procedure in

  section K6.4 of this apendix. On level

  ground, the measurement point coresponds to a position 3,740 fet (1,140 m) from the intersection

  of the 6.0 degre aproach path with the ground plane;


  (2) Two sideline noise measurement points, designated as S(st

  arboard) and S(port), are located on

  the ground perpendicular to and symetricaly stationed at 492 fet (150 m) on each side of
  the

  aproach reference flight path. The measurement points bisect the centerline flight path
  reference

  point A.


