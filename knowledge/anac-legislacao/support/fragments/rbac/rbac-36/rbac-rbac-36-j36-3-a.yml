title: J36.3(a)
text: '(a)

  General.

  (1) The helicopter noise measured under this apendix for noise certification purposes

  must be obtained with FA

  - aproved acoustical equipment and measurement

  practices.


  (2) Paragraph (b) of this section identifies and prescribes the specifications for the noise
  evaluation

  measurements required under this apendix. Paragraphs (c) and (d) of this section prescribe
  the

  required acoustical equipment specifications.

  Paragraphs (e) and (f) of this section prescribe the

  calibration and measurement procedures required under this apendix.'
