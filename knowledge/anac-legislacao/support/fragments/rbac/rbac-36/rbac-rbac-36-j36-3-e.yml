title: J36.3(e)
text: '(e) The requirements of paragraph (

  b)(2) of this section notwithstanding, flyovers at an FA

  -

  aproved lower height may be used and the results adjusted to the reference measurement point
  by

  an FA

  - aproved method if the ambient noise in the test area, measured in acordance with the

  require

  ments prescribed in section J36.109 of this apendix, is found to be within 15 dB(A) of the

  maximum A

  - weighted helicopter noise level (L

  AMAX

  ) measured at the noise measurement station in

  acordance with section J36.109 of this apendix.


  Section J36.107 [Re

  served]


  Section J36.109

  Measurement of helicopter noise received on the ground.'
