text: '(f)

  Noise measurement procedures.

  (1) The microphone shal be of the presure

  - sensitive capacitive

  type designed for nearly uniform grazing incidence response. The microphone shal be mounted

  wi

  th the center of the sensing element 4 fet (1.2 meters) above the local ground surface and
  shal

  be oriented for grazing incidence such that the sensing element, the diaphragm, is substantialy
  in

  the plane defined by the nominal flight path of the helico

  pter and the noise measurement station.


  (2) If a tape recorder is used, the frequency response of the electrical system must be
  determined at

  a level within 10 dB of the ful

  - scale reading used during the test, utilizing pink or pseudorandom

  noise.


  (3) The

  ambient noise, including both acoustical background and electrical noise of the

  measurement systems shal be determined in the test area and the system gain set at levels
  which

  wil be used for helicopter noise measurements. If helicopter sound levels do

  not exced the

  background sound levels by at least 15 dB(A), flyovers at an FA

  - aproved lower height may be


