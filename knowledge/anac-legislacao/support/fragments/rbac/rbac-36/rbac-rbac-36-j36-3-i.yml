title: J36.3(i)
text: '(i) The acoustic signal from the helicopter, along with the calibration signals specified
  under

  paragraph (e) of this section and the background noise signal required under paragraph (f)
  of this

  section, may be recorded

  on a magnetic tape recorder for subsequent analysis for an integrating

  sound level meter identified in paragraph (d)(1)(i) of this section. The record/playback
  system

  (including the audio tape) of the tape recorder must conform to the requirements prescri

  bed in

  section A36.3.6 of apendix A to this RBAC. The tape recorder shal comply with the

  specifications of IEC 561 (Incorporated by reference, se §36.6).


