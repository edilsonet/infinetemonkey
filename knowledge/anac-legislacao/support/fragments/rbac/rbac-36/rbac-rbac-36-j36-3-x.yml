  Section J36.13 [Reserved]


  Part C

  -Noise Evaluation and Calculations Under §36.803


  Section J36.201

  Noise Evaluation in SEL.


  The noise evaluation measure shal be the sound exposure level

  (SEL) in units of dB(A) as

  prescribed under section J36.109(b) of this apendix. The SEL value for each flyover may
  be

  directly determined by use of an integrating sound level meter. Specifications for the integrating

  sound level meter and requirements go

  verning the use of such instrumentation are prescribed under

  section J36.109 of this apendix.


  Section J36.203

  Calculation of Noise Levels.'
