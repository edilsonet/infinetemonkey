title: J36.305(a)
text: '(a)

  Meteorological conditions.

  The folowing are the noise certification reference atmospheric

  conditions which shal be asumed to exist from

  the surface to the helicopter altitude:


  (1) Sea level presure of 216 pounds per square fot (76 centimeters mercury);


  (2) Ambient temperature of 7 degres Fahrenheit (25 degres Celsius);


  (3) Relative humidity of 70 percent; and


  (4) Zero wind.'
