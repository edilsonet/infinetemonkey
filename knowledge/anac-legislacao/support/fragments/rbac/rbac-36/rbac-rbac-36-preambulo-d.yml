text: '(d) Emenda deste RBAC


  Especificamente para este RBAC a indicação de sua emenda também é através da adoção da

  emenda do regulamento adotado e republicado no Apêndice A

  - I deste RBAC, portanto seguindo

  a indicação da emenda do regulamento adotado e indicado

  no parágrafo'
