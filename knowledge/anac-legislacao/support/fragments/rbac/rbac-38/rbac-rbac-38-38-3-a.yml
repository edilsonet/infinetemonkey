text: (a) "Volume III do Anexo 16" significa a primeira edição, que incorporou a emenda 2,
  do Volume III, intitulado "Emissões de CO2 de Aviões", do Anexo 16 à Convenção sobre a Aviação
  Civil Internacional intitulado "Proteção Ambiental", publicado pela Organização de Aviação
  Civil Internacional - OACI e efetivo a partir de 1º de janeiro de 2024. (Redação dada pela
  Resolução nº 760, de 27.11.2024)
