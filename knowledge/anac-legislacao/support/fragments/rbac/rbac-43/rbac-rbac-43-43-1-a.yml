cite: 43.1(a)
title: 43.1(a)
text: '(a) Este regulamento estabelece regras para manutenção, manutenção preventiva, reconstrução
  e

  alteração, incluindo grandes reparos e grandes alterações, de qualquer:

  (1) aeronave que possua um certificado de aeronavegabilidade brasileiro;

  (2) [reservado]; e

  (3) célula, motor, hélice, acessório, componente e partes de tal aeronave.'
