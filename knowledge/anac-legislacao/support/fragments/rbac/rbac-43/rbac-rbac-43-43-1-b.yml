cite: 43.1(b)
title: 43.1(b)
text: '(b) Este regulamento não se aplica a:

  (1) qualquer aeronave para a qual a ANAC tenha emitido um certificado de autorização de

  voo experimental, a menos que a ANAC já tenha emitido um certificado de aeronavegabilidade
  de

  diferente espécie para essa aeronave; ou

  (2) qualquer aeronave para a qual a ANAC tenha emitido um certificado de autorização de

  voo experimental de acordo com o parágrafo 21.191(i)(3) do RBAC 21 e para essa aeronave
  já

  tenha sido emitido um certificado de aeronavegabilidade especial para aeronave categoria
  leve

  esportiva, de acordo com a seção 21.190 do RBAC 21.'
