cite: 43.1(d)
title: 43.1(d)
text: '(d) Este regulamento se aplica a qualquer aeronave categoria leve esportiva, porém:

  (1) os registros de reparos ou alterações especificados nos parágrafos 43.5(b) e 43.9(d)
  não

  são requeridos para produtos não produzidos segundo uma aprovação da ANAC;

  (2) grandes reparos e grandes alterações de produtos não produzidos segundo uma aprovação

  da ANAC não precisam ser registrados conforme o Apêndice B deste regulamento; e

  (3) a listagem de grandes alterações e de grandes reparos especificada nos parágrafos (a)
  e (b)

  do Apêndice A deste regulamento não é aplicável a produtos não produzidos segundo uma

  aprovação da ANAC.'
