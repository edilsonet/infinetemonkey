cite: 43.1(e-I)
title: 43.1(e-I)
text: '(e)-I A ANAC poderá, a pedido, efetuar certificação expedita, emitindo autorização
  caso a caso

  para que pessoas detentoras de certificados ou licenças expedidas por outros países executem

  serviços específicos, individualmente identificados, de manutenção, manutenção preventiva,

  reconstrução ou alteração de artigos, dentro ou fora do território nacional, caso não exista

  organização certificada e capacitada segundo o RBAC 145 para a realização dos serviços

  pretendidos.'
