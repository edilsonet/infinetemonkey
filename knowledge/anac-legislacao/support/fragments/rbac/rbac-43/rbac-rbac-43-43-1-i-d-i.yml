title: 43.1-I(d-I)
text: '(d)-I Tarefa de manutenção crítica significa uma tarefa que envolva a montagem ou afete

  sistema ou parte de aeronave, motor ou hélice tais que um erro durante a execução da tarefa
  possa

  afetar diretamente a segurança operacional. (Incluído pela Resolução nº 509, de 14.03.2019)'
