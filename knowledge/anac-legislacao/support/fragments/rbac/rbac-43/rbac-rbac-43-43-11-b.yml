cite: 43.11(b)
title: 43.11(b)
text: '(b) Lista de discrepâncias. Se uma pessoa que estiver executando uma inspeção requerida
  pelo

  aeronavegável ou não cumpre com dados técnicos aplicáveis da certificação de tipo, de diretrizes
  de

  aeronavegabilidade ou de outros requisitos necessários à aeronavegabilidade, a pessoa deve

  fornecer ao proprietário (ou operador) da aeronave uma lista, assinada e datada, contendo
  tais

  discrepâncias. Para os itens cuja inoperância for permitida segundo o parágrafo 91.213(d)(2)
  do

  regulamentação de certificação de aeronavegabilidade da aeronave. Tais placares deverão
  estar

  associados a cada instrumento inoperante e aos controles na cabine de comando de cada um
  dos

  equipamentos inoperantes. A pessoa deve adicionar tais itens à lista de discrepâncias fornecida
  ao

  proprietário (ou operador) da aeronave. (Redação dada pela Resolução nº 612, de 09.03.2021)


  Data da emissão: 15 de março de 2021'
