section_title: Registros de manutenção - falsificação, reprodução ou alteração
subsection_id: a
cite: 43.12(a)
title: 43.12(a)
text: '(a) Ninguém pode fazer ou induzir que seja feita:

  (1) qualquer anotação fraudulenta ou intencionalmente falsa em qualquer registro ou relatório

  cuja produção, conservação ou uso para demonstrar conformidade com qualquer requisito previsto

  por este regulamento seja requerido;

  (2) qualquer reprodução, com propósito fraudulento, de qualquer registro ou relatório

  requerido por este regulamento; ou

  (3) qualquer alteração, com propósito fraudulento, de qualquer registro ou relatório requerido

  por este regulamento.'
