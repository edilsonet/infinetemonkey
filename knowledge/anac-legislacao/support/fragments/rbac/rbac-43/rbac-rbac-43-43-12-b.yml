section_title: Registros de manutenção - falsificação, reprodução ou alteração
subsection_id: b
cite: 43.12(b)
title: 43.12(b)
text: '(b) Qualquer pessoa que cometa um ato proibido pelo parágrafo (a) desta seção poderá
  ter sua

  licença de tripulante, despachante operacional de voo ou mecânico de manutenção aeronáutica,
  ou

  seu certificado de organização de manutenção, de operador ou de produção ou, ainda, sua

  autorização de produção segundo uma OTP, um APAA ou suas especificações de produtos ou

  processos, como aplicável, suspensos ou cassados pela ANAC.'
