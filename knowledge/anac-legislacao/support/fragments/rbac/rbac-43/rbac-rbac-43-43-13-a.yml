cite: 43.13(a)
title: 43.13(a)
text: '(a) Cada pessoa que estiver executando manutenção, manutenção preventiva e alteração
  em um

  artigo deve usar métodos, técnicas e práticas estabelecidas na última revisão do manual
  de

  manutenção do fabricante, ou nas instruções para aeronavegabilidade continuada preparadas
  pelo

  fabricante ou outros métodos, técnicas e práticas aceitáveis pela ANAC, exceto como previsto
  na

  seção 43.16. A pessoa deve usar as ferramentas, equipamentos e aparelhos de teste necessários
  para

  assegurar a execução do trabalho de acordo com práticas industriais de aceitação geral.
  Se o

  fabricante envolvido recomendar equipamentos e aparelhos de teste especiais, a pessoa deve
  usar

  tais equipamentos e aparelhos ou equivalentes aceitos pela ANAC.'
