cite: 43.13(b)
title: 43.13(b)
text: '(b) Cada pessoa que estiver executando manutenção ou manutenção preventiva ou estiver

  alterando um artigo deve executar esse serviço de tal maneira e usar materiais de tal qualidade
  que

  as condições do artigo sob este serviço fiquem pelo menos iguais às condições originais
  ou fiquem

  apropriadas à alteração pretendida (no que diz respeito à função aerodinâmica, à resistência

  estrutural, à resistência a vibração e deterioração e a outras qualidades que afetam a

  aeronavegabilidade).'
