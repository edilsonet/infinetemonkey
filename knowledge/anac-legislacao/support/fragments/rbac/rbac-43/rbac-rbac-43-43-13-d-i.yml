title: 43.13(d-I)
text: '(d)-I Provisões especiais para reaproveitamento de partes, componentes e equipamentos

  provenientes de aeronaves perecidas. Cada pessoa que estiver utilizando artigos provenientes
  de

  aeronaves perecidas conforme definido no art. 120 da Lei no 7565, de 19 de dezembro de 1986,

  deve cumprir com as instruções específicas da ANAC relativas a inspeção, teste, emissão
  de laudo

  técnico e controle de peças com limite de vida e deverá cumprir com os procedimentos para


  Data da emissão: 15 de março de 2021


  armazenagem estabelecidos nos manuais das organizações certificadas segundo os RBAC 121,
  135

  ou 145.'
