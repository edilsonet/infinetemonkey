title: 43.13(e-I)
text: '(e)-I Provisões especiais para reparo de aeronaves acidentadas. Nenhuma pessoa poderá

  desmontar ou iniciar reparos em aeronaves acidentadas antes da sua liberação pelo órgão

  competente pela investigação do acidente.'
