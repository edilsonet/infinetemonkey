cite: 43.15(a)
title: 43.15(a)
text: '(a) Geral. Cada pessoa que estiver executando uma inspeção requerida pelo RBAC nº 91
  ou

  (1) executar a inspeção de maneira a determinar se o artigo sob inspeção atende a todos
  os

  requisitos de aeronavegabilidade aplicáveis; e

  (2) se a inspeção for requerida pelo RBAC nº 135 ou pelo parágrafo 91.409(e) do RBAC nº

  91, executá-la de acordo com as instruções e procedimentos relacionados no programa de inspeções

  para a aeronave envolvida. (Redação dada pela Resolução nº 612, de 09.03.2021)'
