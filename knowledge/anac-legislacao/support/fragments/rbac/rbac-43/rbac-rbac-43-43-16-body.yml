title: Limitações de aeronavegabilidade
text: '43.16 Limitações de aeronavegabilidade


  Cada pessoa que estiver executando uma inspeção ou outra manutenção especificada em uma

  seção de limitação de aeronavegabilidade de um manual de manutenção do fabricante, ou outras

  instruções para aeronavegabilidade continuada, deve executar o trabalho em conformidade
  com

  aquela seção ou conforme especificações operativas emitidas segundo os RBAC nº 121 ou 135
  ou,

  ainda, conforme um programa de inspeções aprovado conforme o parágrafo 91.409(e) do RBAC
  nº

  91. (Redação dada pela Resolução nº 612, de 09.03.2021)'
