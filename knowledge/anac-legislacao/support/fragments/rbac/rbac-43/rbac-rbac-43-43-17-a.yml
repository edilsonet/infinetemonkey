cite: 43.17(a)
title: 43.17(a)
text: '(a) Uma organização de manutenção instalada em um país com o qual o Brasil possui acordo
  para

  reconhecimento mútuo das funções de manutenção deve seguir as disposições do acordo firmado

  quando aprovar o retorno ao serviço de produto aeronáutico que tenha sido por ela trabalhado.
  A

  documentação referente aos trabalhos realizados deve seguir os termos do acordo firmado.'
