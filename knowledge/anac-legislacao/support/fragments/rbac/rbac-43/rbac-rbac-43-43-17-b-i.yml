cite: 43.17(b-I)
title: 43.17(b-I)
text: '(b)-I Exceto se determinado de outra maneira pela ANAC, uma organização de manutenção

  estrangeira, não certificada pela ANAC, pode executar manutenção, manutenção preventiva,

  reconstrução e alteração e aprovar o retorno ao serviço de artigos, que não aeronave, motor
  e hélice

  completos, somente sob as seguintes condições:

  (1) a ANAC tenha manifestado expressamente a compatibilidade entre os sistemas de

  regulação das funções de manutenção de produtos aeronáuticos do Brasil e da Autoridade de

  Aviação Civil local;

  (2) a organização de manutenção seja certificada pela Autoridade de Aviação Civil local,
  em

  condição regular e com capacidade adequada ao serviço a ser executado;

  (3) a aprovação de retorno ao serviço tenha sido registrada em um documento equivalente
  ao

  requerido pelo RBAC 43.9(d)-I; e

  (4) os dados técnicos, utilizados para a realização de trabalhos considerados como grandes

  alterações e grandes reparos, conforme o Apêndice A, sejam considerados aprovados pela ANAC.'
