cite: 43.17(b-II)
title: 43.17(b-II)
text: '(b)-II O detentor de uma licença de mecânico de manutenção aeronáutica habilitado pela

  ANAC pode aprovar o retorno ao serviço de uma aeronave após execução de manutenção

  preventiva, desde que essa aeronave não esteja vinculada a uma empresa que opere segundo
  o

  RBAC 121 ou 135. (Incluído pela Resolução nº 509, de 14.03.2019)'
