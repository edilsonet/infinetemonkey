title: 43.17(c-I)
text: '(c)-I A manutenção realizada por organização de manutenção conforme parágrafo (b)-I
  desta

  seção impõe ao responsável pelo controle da aeronavegabilidade da aeronave a obrigação de

  assegurar o atendimento ao RBAC 43.

  (Redação dada pela Resolução nº 348, de 02.12.2014)


  Data da emissão: 15 de março de 2021'
