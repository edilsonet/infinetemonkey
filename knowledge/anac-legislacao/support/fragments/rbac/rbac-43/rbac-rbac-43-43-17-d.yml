cite: 43.17(d)
title: 43.17(d)
text: '(d) Um fabricante pode aprovar o retorno ao serviço de um artigo que ele tenha trabalhado

  conforme o parágrafo 43.3(j). Entretanto, exceto quanto a pequenas alterações, o trabalho
  deve ter

  sido feito de acordo com dados técnicos aprovados pela ANAC.'
