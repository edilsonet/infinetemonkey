subsection_id: f-i
cite: 43.17(f-I)
title: 43.17(f-I)
text: '(f)-I O titular de uma licença de piloto ou de certificado de piloto aerodesportivo
  (CPA), exceto

  de licença de aluno piloto, emitidos de acordo com o RBAC 61, pode aprovar o retorno ao
  serviço,

  seguindo critérios estabelecidos pela ANAC, da aeronave que teve manutenção preventiva

  executada por ele segundo o parágrafo 43.3(g)-I. (Redação dada pela Resolução nº 509, de

  14.03.2019)'
