cite: 43.17(i-I)
title: 43.17(i-I)
text: '(i)-I Uma pessoa somente pode aprovar o retorno ao serviço de um artigo que tenha sido

  submetido a grande reparo ou grande alteração se ela for autorizada conforme esta seção
  e se estes

  serviços foram executados com base em dados técnicos aprovados, exceto como previsto no

  parágrafo 43.1(d).


  Data da emissão: 15 de março de 2021'
