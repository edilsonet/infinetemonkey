section_title: podem aprovar o retorno ao serviço de um artigo que tenha sido submetido à
  manutenção,
subsection_id: i
cite: 43.17(i)
title: 43.17(i)
text: '(i) aeronaves empregadas por aeroclubes ou entidades assemelhadas em instrução para

  formação de pilotos que não disponham de organização de manutenção certificada conforme
  o

  RBAC 145; ou

  (ii) aeronaves a serviço de entidades da Administração Federal, Estadual, Municipal ou do

  Distrito Federal;

  (2) aeronaves submetidas a inspeções de até 50 horas previstas no programa de manutenção

  do fabricante ou num programa aprovado de inspeções progressivas e ações corretivas com
  o

  mesmo nível de complexidade, desde que essas aeronaves não estejam vinculadas a uma empresa

  que opere segundo o RBAC 121 ou 135;

  (3) aeronaves submetidas a inspeções de até 100 horas previstas no programa de manutenção

  do fabricante ou num programa aprovado de inspeções progressivas e ações corretivas com
  o

  mesmo nível de complexidade, quando vinculado a uma empresa que opere segundo o RBAC nº

  91;(Redação dada pela Resolução nº 612, de 09.03.2021)

  (4) aeronaves leves esportivas; e

  (5) planadores e motoplanadores, sendo dispensável a habilitação em grupo motopropulsor

  para aprovar o retorno ao serviço de planadores. (Incluído pela Resolução nº 492, de 05.09.2018)'
