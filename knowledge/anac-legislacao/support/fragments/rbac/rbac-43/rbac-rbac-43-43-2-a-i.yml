cite: 43.2(a-I)
title: 43.2(a-I)
text: '(a)-I Revisão geral. Um artigo que passou por uma revisão geral mantém a sua identidade

  anterior (matrícula, número de série, histórico, etc.). Uma pessoa somente pode registrar
  que um

  artigo passou por uma revisão geral se o artigo foi:

  (1) desmontado, limpo, inspecionado, reparado como necessário e remontado usando

  métodos, técnicas e práticas aceitáveis pela ANAC; e

  (2) testado de acordo com dados técnicos aprovados ou de acordo com dados técnicos

  aceitáveis pela ANAC, que tenham sido desenvolvidos e documentados por detentor de certificado

  de tipo, certificado suplementar de tipo ou atestado de produto aeronáutico aprovado.'
