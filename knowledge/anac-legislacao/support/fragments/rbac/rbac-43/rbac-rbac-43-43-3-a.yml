cite: 43.3(a)
title: 43.3(a)
text: '(a) Somente uma pessoa em conformidade com o previsto nesta seção e na seção 43.17
  pode

  executar manutenção, manutenção preventiva, alteração ou reconstrução em um artigo ao qual
  se

  aplica este regulamento. O Apêndice A define, para os propósitos deste regulamento, quais
  itens

  desses trabalhos são considerados como grandes reparos, grandes alterações e manutenção

  preventiva.'
