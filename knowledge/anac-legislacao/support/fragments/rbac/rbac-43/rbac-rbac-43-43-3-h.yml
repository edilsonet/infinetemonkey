section_title: Pessoas autorizadas a executar manutenção, manutenção preventiva, reconstrução
  e
subsection_id: h
cite: 43.3(h)
title: 43.3(h)
text: '(h) Não obstante as provisões do parágrafo (g)-I desta seção, a ANAC pode emitir aprovação

  para que uma empresa de transporte aéreo detentora de especificações operativas emitidas
  segundo

  o RBAC 135, operando helicóptero em área remota, permita que um piloto realize tarefas

  específicas de manutenção preventiva, desde que:

  (1) os itens de manutenção preventiva sejam resultado de dificuldade ou mau funcionamento

  conhecido ou suspeito ocorrido em rota para uma área remota ou em uma área remota;

  (2) o piloto tenha concluído satisfatoriamente um programa de treinamento aprovado e esteja

  autorizado por escrito pelo detentor do certificado para cada tarefa de manutenção preventiva
  que o

  piloto for autorizado a realizar;

  (3) não exista mecânico de manutenção aeronáutica disponível para realizar a manutenção

  preventiva;

  (4) o detentor de certificado possua procedimentos para avaliar o cumprimento de tarefas
  de

  manutenção preventiva que requeiram decisão quanto à aeronavegabilidade do helicóptero;
  e

  (5) as tarefas de manutenção preventiva autorizadas segundo esta seção estejam incluídas
  na

  listagem do parágrafo A43.1(c) do Apêndice A deste RBAC.

  (Redação dada pela Resolução nº 509, de 14.03.2019)'
