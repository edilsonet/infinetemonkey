cite: 43.3(i)
title: 43.3(i)
text: '(i) em relação ao proprietário e ao operador da aeronave:

  (A) o piloto seja proprietário da aeronave, ou um dos proprietários no caso de

  propriedade em condomínio, desde que não exista um operador diferente do proprietário listado
  no

  certificado de matrícula da aeronave;

  (B) o piloto esteja listado como operador da aeronave no certificado de matrícula, caso

  o operador da aeronave não seja seu proprietário; ou

  (C) a aeronave seja operada por pessoa jurídica com propósito de recreação e sem fins

  lucrativos, da qual o piloto seja membro e pela qual o piloto tenha sido designado para
  realização de

  tarefas de manutenção preventiva naquela aeronave;

  (ii) o piloto tenha completado 18 (dezoito) anos, possua habilitação válida aplicável ao

  modelo da aeronave e sua licença ou certificado de piloto não se encontre cassado, suspenso
  ou

  cancelado pela ANAC e não tenha sido renunciado;

  (iii) em relação à complexidade da aeronave:

  (A) se motorizada, a aeronave possua peso máximo de decolagem de 2.730 kg e não

  seja equipada com motor à reação; ou

  (B) seja um planador, motoplanador ou balão;

  (iv) a aeronave não esteja vinculada a empresa que opere segundo o RBAC 121 ou 135, e

  não seja utilizada em operações comerciais de serviços aéreos especializados ou operações

  comerciais de instrução em voo; e'
