cite: 43.9(b)
title: 43.9(b)
text: '(b) Cada empresa de transporte aéreo que opera conforme especificações operativas emitidas

  segundo os RBAC 121 e 135, que requerem um programa de aeronavegabilidade continuada, deve

  fazer as anotações de manutenção, manutenção preventiva, reconstrução e alteração em um
  artigo

  de acordo com o disposto nos referidos regulamentos.'
