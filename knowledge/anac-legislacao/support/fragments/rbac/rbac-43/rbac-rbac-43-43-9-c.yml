cite: 43.9(c)
title: 43.9(c)
text: '(c) desta seção, fazer uma anotação no registro de manutenção desse equipamento com
  o seguinte

  conteúdo:

  (1) uma descrição (ou referência a dados aceitáveis pela ANAC) do trabalho executado;

  (2) a data da conclusão do serviço realizado;

  (3) o nome da pessoa que executou o serviço, caso esta pessoa seja diferente da pessoa

  especificada no parágrafo (a)(4) desta seção; e

  (4) a assinatura e número da licença da pessoa que o aprovou se o serviço foi

  satisfatoriamente concluído no artigo. A assinatura constitui aprovação para o retorno ao
  serviço

  apenas quanto ao serviço realizado. (Redação dada pela Resolução nº 348, de 02.12.2014)'
