title: A43.1(b)
text: '(b) Grandes reparos.

  (1) Grandes reparos de célula. Reparos nas seguintes partes de uma célula e reparos dos

  seguintes tipos, envolvendo resistência, reforço, emenda e fabricação de peças estruturais
  primárias

  ou sua substituição, quando feita por meio de rebitagem ou solda, são grandes reparos:'
