section_id: A43.1
section_title: Grandes alterações, grandes reparos e manutenção preventiva
subsection_id: c
cite: A43.1(c)
title: A43.1(c)
text: '(c) Manutenção Preventiva. A manutenção preventiva é limitada aos seguintes trabalhos,
  desde

  que não envolva operações complexas de montagem:

  (1) remoção, instalação e reparos de pneus;

  (2) substituição de amortecedores de trem de pouso constituídos por cordas elásticas;

  (3) colocação de ar e/ou óleo em amortecedores do trem de pouso;

  (4) limpeza e colocação de graxa nos rolamentos das rodas;

  (5) substituição de frenos e cupilha defeituosas;

  (6) lubrificação que requeira apenas a desmontagem de itens não estruturais como tampas,

  capotas e carenagens;

  (7) execução de remendos simples em revestimento de tela que não requeiram costura em

  nervuras ou remoção de partes estruturais ou superfícies de controle. No caso de balões,
  a execução

  de pequenos remendos de envelopes (como definido e de acordo com as instruções do fabricante)

  não requerendo reparos ou substituição dos tirantes do envelope;

  (8) reabastecimento de fluido hidráulico no reservatório;

  (9) retoques na pintura decorativa da fuselagem, das cestas dos balões, asas, superfícies
  de

  cauda (excluindo superfícies de controle balanceadas), carenagens, capotas do motor, trem
  de pouso

  e interior da aeronave, desde que não seja requerida remoção ou desmontagem de nenhuma

  estrutura primária ou sistema de operação;

  (10) aplicação de material preservativo ou protetor a componentes quando não há necessidade

  de desmontar nenhuma estrutura primária ou sistema de operação e quando o uso de tal material
  não

  é proibido e não contraria boas práticas;

  (11) reparos de tapeçaria e estofamentos e do acabamento interno das aeronaves ou cesta
  do

  balão quando o reparo não envolve desmontagem de nenhuma estrutura primária ou sistema de

  operação, não interfere com tais sistemas e não afeta a estrutura primária da aeronave;

  (12) execução de pequenos reparos em carenagens e em tampas e capotas não estruturais e
  de

  pequenos reforços externos do revestimento da aeronave, desde que não perturbe o fluxo apropriado

  do ar;

  (13) substituição de janelas laterais onde o trabalho não interfere na estrutura ou em qualquer

  sistema de operação, como controles, sistema elétrico etc.;


  Data da emissão: 15 de março de 2021


  (14) substituição dos cintos de segurança;

  (15) substituição de assentos ou suas partes com peças aprovadas para a aeronave, não

  envolvendo desmontagem de qualquer estrutura primária ou sistema de operação;

  (15)-I remoção e reinstalação de macas acopláveis à cabine aprovadas e, somente se nenhuma

  ferramenta for necessária, de garrafas de oxigênio medicinal; (Redação dada pela Resolução
  nº 509,

  de 14.03.2019)

  (16) pesquisa de pane e reparos de fiação no circuito elétrico dos faróis de pouso;

  (17) substituição de lâmpadas, refletores e lentes das luzes de navegação e faróis de pouso;

  (18) substituição de rodas e esquis quando o cálculo do peso e balanceamento não é

  requerido;

  (19) substituição de capota do motor quando não é necessário desmontar a hélice ou

  desconectar controles da aeronave;

  (20) substituição, limpeza ou ajuste de folga das velas do motor (convencional);

  (21) substituição de qualquer conexão de mangueira não utilizada em sistema hidráulico;

  (22) substituição de linhas de combustível pré-fabricadas;

  (23) limpeza ou substituição de elementos de peneira ou filtros de combustível e óleo;

  (23)-I reabastecimento de óleo lubrificante;

  (24) substituição e serviços em baterias;

  (25) limpeza do queimador piloto e queimadores principais de um balão de acordo com as

  instruções do fabricante;

  (26) substituição ou ajuste de fixadores não estruturais que tenham se desgastado ou

  desajustado na operação normal;

  (27) troca de cestas ou queimadores entre balões do mesmo tipo, desde que as cestas ou

  queimadores constem como intercambiáveis nos dados de certificação de tipo do balão e tenham

  sido especificamente projetados para remoção e instalação rápida;

  (28) instalação, nas bocas dos tanques de combustível, de dispositivo visando evitar

  reabastecimento com combustível errado, desde que o dispositivo tenha sido fabricado como
  peça

  para o tipo de aeronave, o fabricante tenha fornecido instruções para instalação aprovadas
  e que a

  instalação não envolva a desmontagem do bocal do tanque;

  (29) remoção, verificação e substituição de detectores de limalhas;

  (30)-I para aeronaves categoria primária para as quais existe um programa especial de

  inspeções e manutenção preventiva aprovado como parte do certificado de tipo ou do certificado

  suplementar de tipo, tarefas definidas nesse programa como passíveis de execução por piloto,
  desde

  que o piloto possua certificado de competência para a referida aeronave emitido pelo detentor
  do

  certificado de produção nos termos do parágrafo 21.145(b) do RBAC 21, ou emitido por entidade

  que possua curso aprovado pela ANAC; (Incluído pela Resolução nº 509, de 14.03.2019)

  (30)-II para aeronaves categoria leve esportiva, tarefas definidas no manual de manutenção
  do

  fabricante como passíveis de execução por piloto; (Incluído pela Resolução nº 509, de 14.03.2019)

  (31) r remoção e substituição de dispositivos de comunicação e navegação montados no

  painel de instrumentos dianteiro, do tipo autônomo (independentes), que empregam conectores
  de

  bandeja que conectam a unidade quando ela é instalada no painel de instrumentos (excluindo

  sistemas de controle automático de voo, transponders e equipamento de medida de distância
  (DME)


  Data da emissão: 15 de março de 2021


  por frequência de micro-ondas). A unidade aprovada deve ser projetada para ser pronta e

  repetidamente removida e substituída e instruções pertinentes devem ser providas. Antes
  do uso da

  unidade, um cheque operacional deve ser executado, de acordo com as seções aplicáveis do
  RBAC

  nº 91; (Redação dada pela Resolução nº 612, de 09.03.2021)

  (32)-I cumprimento de ações requeridas por diretriz de aeronavegabilidade ou por item da

  seção limitações de aeronavegabilidade das instruções de aeronavegabilidade continuada aplicáveis,

  somente quando tais documentos mencionarem explicitamente que tais ações podem ser cumpridas

  por piloto; (Incluído pela Resolução nº 509, de 14.03.2019)

  (32)-II tarefas para as quais o detentor do projeto de tipo ou projeto suplementar de tipo
  tenha

  determinado no programa de manutenção recomendado correspondente que podem ser realizadas

  por pilotos, desde que a ANAC considere serem de complexidade semelhante às demais tarefas
  de

  manutenção preventiva; e (Incluído pela Resolução nº 509, de 14.03.2019)

  (32)-III para planadores e motoplanadores, outras tarefas que a ANAC considere serem de

  complexidade semelhante às demais tarefas de manutenção preventiva. (Incluído pela Resolução
  nº

  509, de 14.03.2019)


  Data da emissão: 15 de março de 2021'
