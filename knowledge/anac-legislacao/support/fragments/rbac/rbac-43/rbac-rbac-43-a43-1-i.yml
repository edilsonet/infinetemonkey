section_title: Grandes alterações, grandes reparos e manutenção preventiva
subsection_id: i
cite: A43.1(i)
title: A43.1(i)
text: '(i) conversão de um motor de um modelo aprovado para outro, envolvendo qualquer

  alteração de razão de compressão, engrenagem de redução de hélice, razão de redução do eixo
  de

  comando de válvulas ou substituição de partes maiores do motor que requeiram extenso retrabalho
  e

  testes;

  (ii) alterações em motor pela substituição de peças estruturais por peças não fornecidas

  pelo fabricante original ou partes não especificamente aprovadas;

  (iii) instalação de um acessório que não seja aprovado para o motor;

  (iv) remoção de um acessório listado como equipamento requerido pela especificação

  técnica da aeronave ou do motor;'
