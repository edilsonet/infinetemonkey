section_title: Grandes alterações, grandes reparos e manutenção preventiva
subsection_id: x
cite: A43.1(x)
title: A43.1(x)
text: '(x) nervuras principais e membros em compressão de asas;

  (xi) montantes da asa e das superfícies da cauda;

  (xii) berços de motor;

  (xiii) longarinas de fuselagem;

  (xiv) membros de vigas mestras laterais e horizontais e membros de cavernas fechadas

  (bulkheads);

  (xv) suportes e tirantes de reforço dos assentos dos pilotos;


  Data da emissão: 15 de março de 2021


  (xvi) montantes de trem de pouso;

  (xvii) eixos das rodas;

  (xviii) rodas do trem de pouso;

  (xix) esquis e suportes;

  (xx) partes do sistema de controle, como colunas de manche, pedais, eixos, suportes ou

  superfícies de balanceamento aerodinâmico (horns);

  (xxi) reparos envolvendo substituição de tipo de material;

  (xxii) reparos em áreas de revestimento trabalhante em metal ou contraplacado, se o dano

  ultrapassar 15,3 cm (6 pol) em qualquer direção;

  (xxiii) reparos em porções de chapas de revestimento por colocação de emendas ou juntas;

  (xxiv) emendas de chapas de revestimentos por superposição;

  (xxv) reparo de 3 ou mais nervuras adjacentes da asa ou superfícies de controle ou reparo

  do bordo de ataque da asa ou das superfícies de controle entre as referidas nervuras;

  (xxvi) reparo de tela de revestimento envolvendo uma área maior que a requerida para

  reparar duas nervuras adjacentes;

  (xxvii) substituição da tela de partes enteladas tais como asas, fuselagem, estabilizadores
  e

  superfícies de controle; e

  (xxviii) reparos, inclusive troca do fundo, de tanques de combustível ou óleo removíveis

  ou integrais.

  (2) Grandes reparos em motor. Reparos nas seguintes partes de um motor e reparos dos

  seguintes tipos são considerados grandes reparos:'
