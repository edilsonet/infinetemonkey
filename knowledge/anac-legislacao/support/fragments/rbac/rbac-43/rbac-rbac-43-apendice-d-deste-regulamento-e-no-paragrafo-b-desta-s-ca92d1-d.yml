title: apendice-d-deste-regulamento-e-no-paragrafo-b-desta-s-ca92d1(d)
text: '(d) Inspeções Progressivas


  Data da emissão: 15 de março de 2021


  (1) Cada pessoa que estiver executando um programa de inspeções progressivas deve iniciá-lo

  por uma inspeção completa da aeronave. Após essa inspeção inicial, as inspeções de rotina
  e

  detalhadas devem ser conduzidas como estabelecido no programa de inspeções progressivas.

  Inspeções de rotina consistem no exame e verificações visuais dos equipamentos da aeronave
  e de

  seus componentes e sistemas, tanto quanto possível sem desmontagens. Inspeções detalhadas

  consistem em verificações completas dos equipamentos, da aeronave e de seus componentes
  e

  sistemas, com as necessárias desmontagens. Para os propósitos deste parágrafo, a revisão
  geral de

  um componente ou sistema é considerada uma inspeção detalhada.

  (2) Se a aeronave estiver fora do local onde as inspeções são normalmente realizadas, uma

  organização de manutenção certificada ou o fabricante da aeronave poderá executar inspeções,

  desde que de acordo com os procedimentos e usando os registros normalmente utilizados pela

  pessoa que deveria executá-la.'
