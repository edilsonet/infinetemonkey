text: '(v) outros parâmetros requeridos pelo fabricante.

  (3) Cada pessoa que estiver aprovando o retorno ao serviço de uma aeronave com motores a

  turbina após uma inspeção anual, uma inspeção de 100 horas ou uma inspeção progressiva deve,

  antes da aprovação, testar o motor ou motores da aeronave para determinar se o seu desempenho

  cumpre com as recomendações do fabricante.'
