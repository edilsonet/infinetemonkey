cite: B43.1(a)
title: B43.1(a)
text: '(a) Exceto como previsto nos parágrafos (b) e (c) deste apêndice, cada pessoa que estiver

  executando um grande reparo ou grande alteração deve:

  (1) preencher o formulário padrão da ANAC em 2 vias;

  (2) fornecer ao proprietário da aeronave o original assinado;

  (3) [reservado]; e

  (4) conservar sua cópia por, pelo menos, 5 anos.'
