title: B43.1(b)
text: '(b) Para grandes reparos feitos conforme um manual ou especificações anteriormente
  aprovadas,

  uma organização de manutenção certificada, em lugar do previsto no parágrafo (a), pode:

  (1) registrar na ordem de serviço segundo a qual o reparo foi executado;

  (2) fornecer ao proprietário da aeronave o original da ordem de serviço cumprida e conservar

  uma cópia assinada por, pelo menos, 5 (cinco) anos após a data de aprovação para retorno
  ao

  serviço do artigo;

  (3) fornecer ao proprietário da aeronave uma liberação de manutenção, assinada por um

  representante autorizado da organização de manutenção, contendo as seguintes informações:'
