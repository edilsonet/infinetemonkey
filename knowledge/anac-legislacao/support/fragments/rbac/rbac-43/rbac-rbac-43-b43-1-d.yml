title: B43.1(d)
text: '(d) Para tanques de combustível instalados dentro do compartimento de passageiros ou
  de

  bagagens, destinados a aumentar o alcance da aeronave, a pessoa que executar o trabalho
  e a pessoa

  autorizada a aprovar o retorno ao serviço conforme a seção 43.7 devem preencher o formulário

  padrão da ANAC em 3 vias. O original e as cópias devem ser distribuídos da seguinte forma:

  (1) uma cópia do formulário deve ser colocada a bordo da aeronave.

  (2) uma cópia do formulário deve ser mantida pelo instalador por, no mínimo, 5 (cinco) anos;

  (3) [reservado]; e

  (4)-I o original do formulário deve ser entregue ao proprietário da aeronave.


  Data da emissão: 15 de março de 2021'
