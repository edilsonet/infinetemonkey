cite: D43.1(a)
title: D43.1(a)
text: '(a) Cada pessoa que for executar uma inspeção anual ou inspeção de 100 horas deve,
  antes dessa

  inspeção, remover ou abrir todas as janelas de inspeção necessárias, portas de acesso, carenagens
  e

  capotas dos motores. Deve, ainda, limpar toda a aeronave e seus motores.'
