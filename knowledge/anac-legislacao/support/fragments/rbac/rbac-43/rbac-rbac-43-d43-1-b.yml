subsection_id: b
cite: D43.1(b)
title: D43.1(b)
text: '(b) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) os seguintes componentes do grupo de fuselagem (ou casco):

  (1) entelamento e revestimento quanto à deterioração, distorção e outras evidências de falha
  e

  quanto a ferragens de ligação e fixações defeituosas ou inseguras;

  (2) sistemas e componentes quanto à instalação imprópria, defeitos aparentes e operação

  insatisfatória; e

  (3) invólucro, garrafas de gás, tanques de lastro e partes afins quanto a más condições.'
