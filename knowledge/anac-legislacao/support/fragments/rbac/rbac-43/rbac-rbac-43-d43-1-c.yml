subsection_id: c
cite: D43.1(c)
title: D43.1(c)
text: '(c) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) os seguintes componentes do grupo compartimento de passageiros
  e

  dos pilotos:

  (1) apresentação geral quanto à limpeza deficiente e objetos soltos que possam emperrar

  controles;

  (2) cadeiras e cintos de segurança quanto a más condições e defeitos aparentes;

  (3) janelas e para-brisas quanto a quebras e deterioração; (Redação dada pela Resolução
  nº

  348, de 02.12.2014)

  (4) instrumentos quanto a más condições, montagens, marcações e (quando praticável)

  indicação incorreta;

  (5) controles de voo e do motor quanto à instalação e operação imprópria;

  (6) baterias quanto à instalação e carga incorreta; e

  (7) todos os sistemas quanto à instalação imprópria, más condições, defeitos aparentes ou

  óbvios e fixações impróprias.'
