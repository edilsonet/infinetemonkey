cite: D43.1(e)
title: D43.1(e)
text: '(e) Cada pessoa que estiver executando uma inspeção de 100 horas deve inspecionar (como

  aplicável) os seguintes componentes do grupo trem de pouso:

  (1) todas as unidades quanto a más condições e inseguranças nas fixações;

  (2) dispositivos de absorção de choques quanto a nível inadequado de óleo;

  (3) articulações, montantes e membros estruturais quanto a desgaste indevido ou excessivo
  e

  deformações;

  (4) mecanismos de recolhimento e travamento quanto à operação imprópria;

  (5) linhas hidráulicas quanto a vazamentos;

  (6) sistema elétrico quanto a atrito de fios e operação imprópria dos interruptores;

  (7) rodas quanto a trincas, defeitos e condições dos rolamentos;

  (8) pneus quanto a desgaste e cortes;

  (9) freios quanto a ajuste impróprio; e

  (10) flutuadores e esquis quanto à fixação insegura e defeitos óbvios ou aparentes.'
