cite: D43.1(f)
title: D43.1(f)
text: '(f) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) todos os componentes das asas e do conjunto da seção central
  quanto

  a más condições gerais, deterioração do entelamento ou revestimento, deformações, evidências
  de

  falha e fixações inseguras.'
