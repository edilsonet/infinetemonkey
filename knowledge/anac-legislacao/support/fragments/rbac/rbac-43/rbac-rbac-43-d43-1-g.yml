cite: D43.1(g)
title: D43.1(g)
text: '(g) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) todos os componentes e sistemas que compõem o conjunto completo

  da empenagem quanto a más condições gerais, deterioração do entelamento ou revestimento,

  deformações, evidências de falha, instalação e funcionamento impróprios de componentes.

  (Redação dada pela Resolução nº 348, de 02.12.2014)'
