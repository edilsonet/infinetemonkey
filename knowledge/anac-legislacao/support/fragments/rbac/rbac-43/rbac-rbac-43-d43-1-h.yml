subsection_id: h
cite: D43.1(h)
title: D43.1(h)
text: '(h) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) os seguintes componentes do grupo hélice:

  (1) conjunto de hélice quanto a trincas, mossas, emperramentos e vazamentos de óleo;

  (2) parafusos quanto a torque de aperto inadequado e falta de freno;

  (3) dispositivos anti-gelo quanto a funcionamento impróprio e defeitos óbvios; e

  (4) mecanismos de controle quanto à operação imprópria, montagem insegura e restrições de

  curso.'
