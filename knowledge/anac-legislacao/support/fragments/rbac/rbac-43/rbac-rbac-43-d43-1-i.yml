cite: D43.1(i)
title: D43.1(i)
text: '(i) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) os seguintes componentes do grupo rádio:


  Data da emissão: 15 de março de 2021


  (1) equipamento rádio e eletrônico quanto à instalação imprópria e fixação insegura;

  (2) fiação e conduítes quanto a posicionamento inadequado, fixações e montagens inseguras;

  (3) aterramentos e blindagens quanto a más condições gerais e instalação imprópria; e

  (4) antenas, incluindo antenas de arrasto, quanto a más condições, montagem insegura e

  operação imprópria.'
