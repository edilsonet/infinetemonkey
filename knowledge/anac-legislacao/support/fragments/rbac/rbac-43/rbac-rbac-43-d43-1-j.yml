title: D43.1(j)
text: '(j) Cada pessoa que estiver executando uma inspeção anual ou inspeção de 100 horas
  deve

  inspecionar (como aplicável) cada item de miscelânea instalado na aeronave porventura não
  citado

  nesta listagem, quanto à instalação e operação imprópria.


  Data da emissão: 15 de março de 2021'
