title: 'definições:'
text: 'definições:

  (1) Peça com limite de vida significa qualquer peça ou parte para a qual um limite obrigatório

  de substituição é especificado no projeto de tipo, nas instruções de aeronavegabilidade
  continuada

  ou no manual de manutenção.

  (2) Situação de vida significa número acumulado de ciclos, horas ou qualquer outro limite

  obrigatório de substituição de uma peça com limite de vida.'
