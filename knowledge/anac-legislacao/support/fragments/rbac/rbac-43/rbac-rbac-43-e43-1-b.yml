text: '(b)(1)(i) a (vi) e (b)(2) deste apêndice. Cada um dos testes de desempenho pode ser
  conduzido com

  o instrumento sujeito à vibração, entretanto, tal procedimento só é necessário quando

  especificamente requerido. Quando os testes forem conduzidos com uma temperatura ambiente

  substancialmente diferente de 25ºC, devem ser acrescentadas tolerâncias para a variação
  das

  condições especificadas:'
