text: 'E43.1 Testes e inspeções do sistema do altímetro


  Cada pessoa que estiver executando teste e inspeção do sistema de altímetro como requerido
  pela

  seção 91.411 do RBAC nº 91 deve fazê-lo conforme segue. (Redação dada pela Resolução nº
  612,

  de 09.03.2021)'
