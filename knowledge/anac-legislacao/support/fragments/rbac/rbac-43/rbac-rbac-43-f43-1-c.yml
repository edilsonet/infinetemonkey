title: F43.1(c)
text: '(c) Sensibilidade do receptor

  (1) Verificar se para qualquer classe de transponder ATCRBS o nível mínimo de

  acionamento (Minimum Triggering Level - MTL) do receptor do sistema é -73+4 dBm ou que para

  qualquer classe de transponder Mode S o MTL do receptor, para interrogações Mode S formato

  (tipo P6), é -74+3 dBm usando um equipamento de teste:'
