title: F43.1(d)
text: '(d) Potência de Pico de Saída de Rádio Frequência - RF:

  (1) verificar se a potência de saída de RF do transponder está dentro das especificações
  para a

  classe do transponder. Usar as mesmas condições descritas nos parágrafos (c)(1)(i), (ii)
  e (iii);'
