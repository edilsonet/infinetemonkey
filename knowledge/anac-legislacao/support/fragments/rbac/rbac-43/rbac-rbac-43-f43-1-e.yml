cite: F43.1(e)
title: F43.1(e)
text: '(e) Isolamento dos Canais de Transmissão de Mode S Múltiplo. Para qualquer classe de

  transponder Mode S que incorpora operação múltipla, verificar se o pico de saída de potência
  de RF

  transmitida através da antena selecionada excede a potência transmitida através de antena
  não

  selecionada por pelo menos 20 dB.'
