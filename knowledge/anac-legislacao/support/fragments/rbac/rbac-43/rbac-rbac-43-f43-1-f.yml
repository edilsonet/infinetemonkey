title: F43.1(f)
text: '(f) Endereço do Mode S. Interrogar o transponder Mode S e verificar se ele responde
  apenas ao

  endereço designado. Usar o endereço correto e pelo menos 2 endereços errados. A interrogação

  deve ser feita na razão nominal de 50 interrogações por segundo.'
