title: F43.1(h)
text: '(h) Interrogações Mode S All-call. Interrogar o transponder Mode S com o formato Mode
  S all-

  call somente UF = 11 e o ATCRBS/Mode S com o formato all-call (pulso P4 1,6 microsegundos)
  e

  verificar se o endereço e capacidade corretos são informados nas respostas (formato do downlink

  DF = 11).'
