cite: F43.1(v)
title: F43.1(v)
text: '(v) para qualquer classe de transponders ATCRBS ou Mode S, verificar se o pico máximo

  de saída de potência de RF não excede 27,0 dBw (500 watts).

  Nota: Os testes de (e) até (j) aplicam-se apenas a transponders Mode S.'
