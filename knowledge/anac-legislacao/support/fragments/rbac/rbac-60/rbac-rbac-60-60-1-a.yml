title: 60.1(a)
text: '(a) Este regulamento estabelece as regras

  de qualificação inicial e recorrente e do uso

  de

  dispositivos

  de

  treinamento

  para

  simulação de voo (FSTD) utilizados para

  cumprir os requisitos de treinamento, exames

  de proficiência ou experiência de voo

  estabelecidos em um RBAC.'
