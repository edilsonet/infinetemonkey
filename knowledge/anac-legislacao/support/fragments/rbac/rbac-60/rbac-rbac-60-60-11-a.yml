cite: 60.11(a)
title: 60.11(a)
text: '(a) Uma pessoa somente pode utilizar um

  FSTD se este::

  (1) has a single sponsor who is qualified

  under section 60.7 of this regulation. The

  sponsor may arrange with another person for

  services

  of

  document

  preparation

  and

  presentation, as well as FSTD inspection,

  maintenance, repair or servicing; however, the

  sponsor remains responsible for ensuring that

  these functions are conducted in a manner and

  with a result of continually meeting the

  requirements of this regulation;

  (1) tiver um único operador que seja

  qualificado conforme a seção 60.7 deste

  regulamento. O operador pode utilizar

  serviços de terceiros para preparação e

  apresentação de documentação, bem como

  para inspecionar, realizar manutenção, reparo

  ou auxílio técnico ao FSTD; entretanto, o

  operador permanece responsável por garantir

  que estas atribuições sejam conduzidas de

  forma a manter o cumprimento dos requisitos

  deste regulamento;

  (2) is qualified as described in the

  Statement of Qualification;

  (2)

  estiver

  qualificado

  conforme

  descrito no seu Certificado de Qualificação;


  Data da emissão: 20 de março de 2020.


  (3)

  remains

  qualified,

  through

  satisfactory

  inspection,

  continuing

  qualification

  evaluations,

  appropriate

  maintenance, and is available for use in

  accordance with the requirements of this

  regulation;

  (3) permanecer qualificado, por meio

  de

  inspeções

  satisfatórias,

  avaliações

  recorrentes, manutenção apropriada e for

  disponibilizado para uso conforme os

  requisitos deste regulamento;

  (4) use the software and hardware that

  were evaluated as satisfactory by the ANAC

  and, if modified, modified only in accordance

  with the provisions of this regulation.

  However, this section does not apply to routine

  software or hardware changes that do not fall

  under the requirements of section 60.23 of this

  regulation; and

  (4) utilizar o software e o hardware que

  foram avaliados como satisfatórios pela

  ANAC e, se modificado, modificado somente

  conforme as disposições deste regulamento.

  Entretanto, este item não se aplica para

  mudanças rotineiras de software ou hardware

  que não se enquadrem nos requisitos da seção'
