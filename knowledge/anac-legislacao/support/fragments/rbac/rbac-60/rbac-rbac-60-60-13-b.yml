cite: 60.13(b)
title: 60.13(b)
text: '(b) e (c) desta seção, a fim de validar o

  desempenho e as características do FSTD

  durante a avaliação de qualificação, os dados

  da aeronave disponibilizados para a ANAC

  (pacote de dados de validação) devem incluir

  os dados de ensaio em voo do fabricante da

  aeronave e todos os dados relevantes

  desenvolvidos após a emissão do certificado

  de tipo da aeronave (por exemplo, dados

  desenvolvidos em resposta a uma diretriz de

  aeronavegabilidade) se estes dados afetarem

  o desempenho, a qualidade de voo, as

  funcionalidades ou outras características da

  aeronave.'
