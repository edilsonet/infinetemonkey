title: 60.13(e)
text: '(e) A ANAC poderá exigir dados de

  validação adicionais, que podem incluir, se

  necessário, ensaio em voo, caso o pacote de

  dados de validação apresentado não atenda os

  requisitos

  de

  qualificação

  do

  FSTD,

  conforme requerido por este regulamento

  para o nível de qualificação pretendido.'
