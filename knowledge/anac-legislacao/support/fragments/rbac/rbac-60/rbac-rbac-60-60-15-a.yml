title: 60.15(a)
text: '(a) Para cada FSTD, o operador deve

  enviar à ANAC uma solicitação de avaliação

  do FSTD para qualificação inicial em um

  nível específico com antecedência mínima de

  90 dias à data de avaliação pretendida, cuja

  confirmação dar-se-á de acordo com a

  disponibilidade da ANAC. A solicitação deve


  Data da emissão: 20 de março de 2020.


  ser feita no formato e na maneira determinada

  pela ANAC.'
