cite: 60.15(b)
title: 60.15(b)
text: '(b) O representante do operador, descrito

  no parágrafo 60.9(c) deste regulamento, deve

  providenciar declaração assinada afirmando

  que:

  (1) the performance and handling

  qualities of the FSTD represent those of the

  aircraft or set of aircraft within the normal

  operating envelope. This statement must be

  made by a qualified pilot in the aircraft or set

  of aircraft being simulated after having flown

  all of the Operations Tasks listed in the QPS

  relevant to the qualification level of the FSTD;


  (1) o desempenho e a qualidade de voo

  do FSTD representam aqueles da aeronave ou

  conjunto de aeronaves sendo simulada dentro

  do seu envelope normal de operação. Esta

  declaração deve ser feita por um piloto

  qualificado na aeronave ou conjunto de

  aeronaves sendo simulada após ter realizado

  todas as tarefas operacionais listadas no QPS

  relevante ao nível de qualificação pretendido

  do FSTD;

  (2) the FSTD systems and sub-systems

  (including the simulated aircraft systems)

  functionally represent those in the aircraft or

  set of aircraft. This statement must be made by

  a qualified pilot in the aircraft or set of aircraft

  being simulated or by a person trained on

  simulator systems/sub-systems and trained on

  the operation of the simulated aircraft systems;

  and


  (2) os sistemas e subsistemas do FSTD

  (incluindo

  os

  sistemas

  simulados

  da

  aeronave) representam o funcionamento

  daqueles da aeronave ou conjunto de

  aeronaves. Esta declaração deve ser feita por

  um piloto qualificado na aeronave ou

  conjunto de aeronaves sendo simulada, ou por

  uma

  pessoa

  treinada

  em

  sistemas

  e

  subsistemas de FSTDs e treinada na operação

  dos sistemas da aeronave simulada; e

  (3)

  the

  cockpit

  represents

  the

  configuration of the specific type; or aircraft

  make, model and series aircraft being

  simulated, as appropriate. This statement must

  be made by a qualified pilot in the aircraft or

  set of aircraft being simulated, or by a person

  trained on the configuration and operation of

  the aircraft simulated.


  (3) a cabine de comando representa a

  configuração do tipo específico ou do modelo

  e série da aeronave sendo simulada, como

  apropriado. Esta declaração deve ser feita por

  um piloto qualificado na aeronave ou

  conjunto de aeronaves sendo simulada, ou por

  uma pessoa treinada em configuração e

  operação da aeronave simulada.'
