title: 60.15(c)
text: '(c)

  Dentro

  de

  12

  meses

  após

  a

  disponibilização pelo fabricante do pacote

  final de dados da aeronave, mas não após 2

  anos

  da

  emissão

  do

  Certificado

  de

  Qualificação interina, o requerente deverá

  solicitar uma avaliação para qualificação

  inicial de acordo com a seção 60.15 deste

  regulamento, baseada no pacote final de

  dados da aeronave, aprovado pelo fabricante

  da aeronave, a menos que a ANAC determine

  que condições excepcionais devam ser

  aplicadas.'
