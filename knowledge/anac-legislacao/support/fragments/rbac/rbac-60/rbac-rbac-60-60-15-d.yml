cite: 60.15(d)
title: 60.15(d)
text: '(d) Um operador pode solicitar que um

  FSTD tenha o seu nível de qualificação

  permanentemente degradado. Neste caso, a

  ANAC degradará o nível de qualificação do

  FSTD sem a necessidade de conduzir uma

  avaliação para qualificação inicial. As

  avaliações

  futuras

  para

  qualificação

  recorrente utilizarão o MQTG existente,

  modificado como necessário para refletir o

  novo nível de qualificação.'
