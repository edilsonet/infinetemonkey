cite: 60.15(e)
title: 60.15(e)
text: '(e) Um operador que possua dados de

  validação da aeronave adequados disponíveis

  e que receba aprovação da ANAC, poderá

  adotar os testes e as tolerâncias estabelecidas

  na base de qualificação atual como os testes e

  tolerâncias

  aplicáveis

  para

  as

  futuras

  qualificações recorrentes de um FSTD

  previamente qualificado. As atualizações de

  teste(s) e tolerância(s) deverão tornar-se parte

  permanente do MQTG.'
