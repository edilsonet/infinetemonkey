title: 60.16(b)
text: '(b) In determining the criteria of the

  evaluation mentioned in paragraph (a)(2) of

  this section, ANAC considers factors such as

  the existing qualification of the FSTD, any

  modifications to the FSTD hardware or

  software that are involved, and any additions

  or modifications to the MQTG, among others.'
