title: 60.16(i)
text: '(i) submeter à ANAC todas as

  modificações ao MQTG requeridas para

  basear a qualificação adicional;

  (ii)

  describe

  to

  ANAC

  all

  modifications to the FSTD that are required to

  support the additional qualification; and


  (ii) descrever à ANAC todas as

  modificações ao FSTD que são requeridas

  para basear a qualificação adicional; e

  (iii) submit to ANAC a statement, as

  described in paragraph 60.15(b) of this

  regulation, that a rated and qualified pilot in the

  aircraft or set of aircraft being simulated has

  subjectively evaluated the FSTD in those areas

  not previously evaluated; and


  (iii)

  submeter

  à

  ANAC

  uma

  declaração, como descrita no parágrafo

  60.15(b) deste regulamento, que um piloto

  habilitado e qualificado na aeronave ou

  conjunto de aeronaves sendo simulada


  Data da emissão: 20 de março de 2020.


  avaliou subjetivamente o FSTD naquelas

  áreas não avaliadas anteriormente; e

  (2) the FSTD must successfully pass an

  evaluation as determined by ANAC.


  (2) o FSTD deve ser aprovado em uma

  avaliação como determinado pela ANAC.'
