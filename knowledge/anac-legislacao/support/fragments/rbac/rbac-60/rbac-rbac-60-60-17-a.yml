section_title: FSTDs qualificados previamente
subsection_id: a
cite: 60.17(a)
title: 60.17(a)
text: '(a) Exceto para os casos especificados em

  uma diretriz de FSTD, ou como especificado

  no parágrafo (d) desta seção, um FSTD

  qualificado pela ANAC anteriormente à data

  de publicação deste regulamento poderá

  manter a mesma base de qualificação

  utilizada à época da qualificação inicial deste

  FSTD, desde que os requisitos daquela base

  continuem sendo cumpridos, incluindo os

  testes objetivos do seu MQTG e os testes

  subjetivos, independentemente do operador.

  Entretanto, o operador de tal FSTD deverá

  adequar-se a todos os outros requisitos

  aplicáveis dispostos neste regulamento.'
