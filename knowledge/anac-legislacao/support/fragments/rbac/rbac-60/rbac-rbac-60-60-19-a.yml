cite: 60.19(a)
title: 60.19(a)
text: '(a) Inspeção. Um operador somente

  poderá utilizar um FSTD se:

  (1) accomplish all appropriate objective

  tests each year as specified in the QPS, or in

  the original qualification basis of the FSTD, or

  as may be amended by an FSTD directive; and


  (1) realizar todos os testes objetivos

  apropriados, progressivamente durante cada

  ano, conforme especificado no QPS, ou na

  base de qualificação original do FSTD, ou

  como requerido por uma diretriz de FSTD; e

  (2) complete a functional preflight check

  within the preceding 24 hours.


  (2) realizar uma inspeção pré voo

  funcional nas 24 horas precedentes.'
