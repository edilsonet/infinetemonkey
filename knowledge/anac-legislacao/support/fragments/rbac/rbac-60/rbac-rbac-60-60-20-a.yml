section_title: Registro de discrepâncias do FSTD
subsection_id: a
cite: 60.20(a)
title: 60.20(a)
text: '(a)

  Cada

  instrutor,

  examinador

  credenciado

  ou

  servidor

  da

  ANAC

  conduzindo ou acompanhando treinamento,

  avaliação ou experiência de voo, e cada

  pessoa conduzindo a inspeção pré voo que

  verifique

  uma

  discrepância,

  qualquer

  componente

  faltante,

  com

  mau

  funcionamento ou inoperante no FSTD,

  deverá incluir ou fazer com que seja incluída

  a descrição desta discrepância no registro de

  discrepâncias.'
