title: 60.21(b)
text: '(b) An FSTD that has been issued interim

  qualification is deemed to have been issued

  initial qualification, unless the ANAC rescinds

  the qualification. Interim qualification expires

  two years after the issuance of Statement of

  Qualification of this FSTD, unless the ANAC

  determines that specific conditions warrant

  otherwise.'
