title: 60.23(c)
text: '(c) Utilização de um FSTD modificado. O

  operador só pode utilizar um FSTD com a

  modificação proposta se:

  (1) the sponsor has notified ANAC of

  their intent to incorporate the proposed

  modification, and one of the following has

  occurred;


  (1) o operador tiver notificado à ANAC

  a intenção de incorporar a modificação

  proposta, e pelo menos um dos seguintes

  eventos tenha ocorrido:'
