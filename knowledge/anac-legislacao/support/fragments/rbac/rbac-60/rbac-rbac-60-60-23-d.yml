section_title: Modificações a FSTDs
subsection_id: d
cite: 60.23(d)
title: 60.23(d)
text: '(d) Quando uma modificação for realizada

  em um FSTD e esta afetar o Certificado de

  Qualificação, conforme a parágrafo 60.23(a)

  deste regulamento, o operador deve anexar o

  adendo ao Certificado até que seja emitido

  um Certificado de Qualificação atualizado.'
