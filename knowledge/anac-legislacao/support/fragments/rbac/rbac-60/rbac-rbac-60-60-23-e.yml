cite: 60.23(e)
title: 60.23(e)
text: '(e) Atualização do MQTG. Cada vez que

  um FSTD for modificado e esta modificação

  afetar um teste objetivo ou outra seção do

  MQTG, o MQTG deve ser atualizado de

  acordo com os resultados dos testes objetivos

  descritos nos parágrafos 60.15(h) e (i) deste

  regulamento,

  fundamentados

  em

  dados

  objetivos conforme a seção 60.13 deste

  regulmento. Se uma diretriz da ANAC for a

  causa da atualização, esta diretriz para

  realizar a modificação e os registros da

  conclusão

  da

  modificação

  devem

  ser

  arquivados no MQTG.


  Data da emissão: 20 de março de 2020.'
