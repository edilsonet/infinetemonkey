title: 60.23(i)
text: '(i) resultados das avaliações de

  qualificação (inicial e cada elevação de nível)

  desde a emissão do primeiro Certificado de

  Qualificação;

  (ii) results of the objective tests

  conducted in accordance with the section

  60.19(a) of this regulation for a period of 2

  years;


  (ii) resultados dos testes objetivos

  conduzidos de acordo com o parágrafo

  60.19(a) deste regulamento por um período

  de 2 anos;

  (iii) results of the previous three

  continuing qualification evaluations, or the

  continuing qualification evaluations from the

  previous 2 years, whichever covers a longer

  period; and


  (iii) resultados das três últimas

  avaliações de qualificação recorrente, ou das

  avalições recorrentes que ocorreram nos 2

  últimos anos, a qual cobrir um período de

  tempo maior; e

  (iv) reports obtained in accordance

  with the paragraph 60.9(b) of this regulation

  for a period of at least 90 days; and


  (iv) relatos obtidos de acordo com o

  parágrafo 60.9(b) deste regulamento por um

  período de pelo menos 90 dias; e

  (4) a record of all discrepancies entered

  in the discrepancy log over the previous 2

  years, including the following:


  (4)

  um

  registro

  de

  todas

  as

  discrepâncias inseridas no registro de

  discrepâncias nos 2 últimos anos, incluindo:'
