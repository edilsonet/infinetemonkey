title: 60.25(a)
text: '(a)

  Nenhuma

  pessoa

  pode,

  intencionalmente, utilizar um FSTD para

  executar qualquer manobra, procedimento ou

  tarefa quando houver componente faltante,

  com mau funcionamento ou inoperante

  (missing, malfunctioning, or inoperative -

  MMI), caso este componente seja requerido

  para

  executar

  satisfatoriamente

  aquela

  manobra, procedimento ou tarefa.'
