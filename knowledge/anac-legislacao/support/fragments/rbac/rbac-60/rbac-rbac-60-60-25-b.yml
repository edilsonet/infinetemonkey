title: 60.25(b)
text: '(b) Todo componente MMI, conforme

  descrito no parágrafo (a) desta seção,

  requerido para atender ao funcionamento

  correto do FSTD, conforme o Certificado de

  Qualificação em vigor, deve ser reparado ou

  substituído dentro de 30 dias, exceto quando

  autorizado de maneira diferente pela ANAC.'
