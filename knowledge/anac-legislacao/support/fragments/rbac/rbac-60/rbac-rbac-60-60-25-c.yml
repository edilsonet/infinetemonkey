title: 60.25(c)
text: '(c) Uma lista dos componentes MMI deve

  estar disponível no FSTD ou em local

  adjacente para ser consultada pelos usuários.

  Acesso eletrônico para esta lista por meio de

  um terminal ou monitor localizado no FSTD

  ou em local adjacente é aceitável. O registro

  de discrepâncias pode ser utilizado para

  cumprir este requisito, desde que cada

  componente MMI no momento esteja listado

  no registro de discrepâncias.'
