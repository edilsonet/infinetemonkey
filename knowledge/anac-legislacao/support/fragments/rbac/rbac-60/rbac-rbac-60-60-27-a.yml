title: 60.27(a)
text: '(a) A qualificação de um FSTD é

  automaticamente suspensa quando qualquer

  uma das situações a seguir ocorrer:

  (1) the FSTD is not used in any ANAC-

  approved flight training program within the

  last 12 months in accordance with the

  paragraphs 60.7(b)(2) or (c)(1) of this

  regulation and the sponsor does not obtain and

  maintain a written statement as described in the

  paragraph 60.7(c)(2) of this regulation;


  (1) o FSTD não for utilizado, nos

  últimos 12 meses, em um programa de

  treinamento aprovado pela ANAC de acordo

  com os parágrafos 60.7 (b)(2) ou (c)(1) deste

  regulamento e o operador não obtiver nem

  mantiver

  uma

  declaração

  escrita

  em

  conformidade com o parágrafo 60.7(c)(2)

  deste regulamento;


  Data da emissão: 20 de março de 2020.


  (2) the FSTD is not inspected in

  accordance with the section 60.19 of this

  regulation;


  (2) o FSTD não for inspecionado,

  avaliado e mantido conforme a seção 60.19

  deste regulamento;

  (3) the FSTD is physically moved from

  one location and installed in a different

  location, regardless of distance;


  (3) o FSTD for fisicamente movido de

  uma localização e instalado em uma

  localização diferente, independentemente da

  distância;

  (4) the MQTG is missing or otherwise

  not available and a replacement is not made

  within 30 days; or

  (5) if the FSTD were out of service for a

  prolonged period. The ANAC will the

  evaluation criteria for an FSTD that has been

  removed from active status based on the

  number of continuing qualification evaluations

  and inspections established in paragraph

  60.19(a) missed during the period of inactivity.


  (4) o MQTG estiver por qualquer

  motivo indisponível e um sobressalente não

  for confeccionado em 30 dias; or

  (5) o FSTD for inativado por período

  prolongado. A ANAC determinará o critério

  de retorno a serviço do FSTD baseada no

  número

  de

  avaliações

  contínuas

  de

  qualificação e inspeções progressivas de

  acordo com o parágrafo 60.19(a) deste

  regulamento perdidas durante o período de

  inatividade.'
