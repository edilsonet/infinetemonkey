text: '60.27 deste regulamento em menos de 24

  meses, a base de qualificação (incluindo os

  testes objetivos e subjetivos) para as futuras

  qualificações recorrentes será a mesma

  utilizada à época da qualificação inicial deste

  FSTD; ou


  Data da emissão: 20 de março de 2020.


  (ii) not restored under section 60.27 of

  this regulation for 24 months or more, then the

  FSTD will be evaluated for initial qualification

  in accordance with the section 60.15 of this

  regulation, at the time of re-qualification

  application.


  (ii) não for restaurada conforme

  seção 60.27 deste regulamento em 24 meses

  ou mais, então o FSTD deverá ser avaliado

  para qualificação inicial conforme a seção'
