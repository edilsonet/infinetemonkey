  (5) Flight training device (FTD). A

  replica of aircraft instruments, equipment,

  panels, and controls in an open flight deck area

  or an enclosed aircraft flight deck replica. It

  includes

  the

  equipment

  and

  computer

  programs necessary to represent aircraft (or set

  of aircraft) operations in ground and flight

  conditions having the full range of capabilities

  of the systems installed in the device as

  described in this RBAC and the qualification

  performance standard (QPS) for a specific

  FTD qualification level.

  (5) Dispositivo de treinamento de voo

  (FTD). Consiste em uma réplica dos

  instrumentos,

  equipamentos,

  painéis

  e

  controles de uma aeronave em uma área

  confinada ou não da cabine de pilotagem.

  Inclui

  os

  equipamentos

  e

  programas

  necessários para representar a operação da

  aeronave em solo e em voo, tendo toda a

  capacidade dos sistemas instalados no

  dispositivo conforme descrito neste RBAC e

