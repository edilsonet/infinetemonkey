title: 60.31(a)
text: '(a) O operador de FSTD deve manter os

  seguintes registros para cada FSTD que

  opere:

  (1) the MQTG and each amendment

  thereto;


  (1) o MQTG com todas as suas revisões

  e emendas;

  (2) a record of all FSTD modifications

  affected by the section 60.23 of this regulation

  since the issuance of the original Statement of

  Qualification;


  (2)

  um

  registro

  de

  todas

  as

  modificações de FSTD afetadas pela seção'
