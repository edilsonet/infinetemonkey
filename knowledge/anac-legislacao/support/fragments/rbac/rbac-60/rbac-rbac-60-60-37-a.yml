cite: 60.37(a)
title: 60.37(a)
text: '(a) Validação. A avaliação e qualificação

  de um FSTD realizada por um país signatário

  da Convenção de Aviação Civil Internacional

  poderá ser utilizada como base para a emissão

  de um Certificado de Qualificação brasileiro

  pela ANAC, para o operador daquele FSTD,

  se

  os

  padrões

  de

  desempenho

  para

  qualificação e vigilância de FSTD daquele

  país forem consistentes com os deste RBAC

  conforme critérios a serem estabelecidos em

  Instrução Suplementar.'
