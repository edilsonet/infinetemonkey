cite: 60.37(b)
title: 60.37(b)
text: '(b) Um FSTD operado por Centro de

  Treinamento da Aviação Civil (CTAC)

  certificado por um país signatário da

  Convenção de Aviação Civil Internacional

  será considerado validado pela ANAC se:

  (1) A qualificação do FSTD estiver

  válida junto à Autoridade de Aviação Civil

  estrangeira;

  (2) O certificado do CTAC estrangeiro

  estiver

  validado

  pela

  ANAC

  em

  conformidade com RBAC nº 142; e

  (3) Os padrões de desempenho para

  qualificação e vigilância de FSTD daquele

  país forem consistentes com os deste RBAC.'
