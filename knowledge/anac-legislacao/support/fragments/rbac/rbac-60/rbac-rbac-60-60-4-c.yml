title: 60.4(c)
text: '(c) Cada FSTD avaliado para qualificação

  inicial deve cumprir os requisitos de

  desempenho para qualificação, definidos na

  seção 60.4 deste regulamento, que estiverem

  em vigor na época da avaliação. As exceções

  são:

  (1) if the ANAC publishes a change to

  the existing standard or publishes a new

  standard for the evaluation for initial

  qualification, a sponsor may request that the

  ANAC apply the standard that was in effect

  when a FSTD was ordered for delivery. In this


  (1) caso a ANAC publique uma revisão

  ao requisito existente ou publique um novo

  requisito para qualificação inicial, um

  operador que já tiver encomendado um FSTD

  poderá solicitar que a ANAC utilize o

  requisito que estava em vigor à época da


  Data da emissão: 20 de março de 2020.


  case, the evaluation must be conducted within

  24 months following the publication of the

  change to the existing standard or publication

  of the new standard; and

  encomenda. Neste caso, a avaliação deverá

  ocorrer em até 24 meses contados a partir da

  publicação da revisão do requisito, ou da

  publicação do novo requisito; e

  (2) an FSTD manufactured before the

  publication of this regulation and which is

  qualified by the aviation authority of a

  contracting State to the Convention on

  International Civil Aviation may be evaluated

  for initial qualification in accordance to its

  original qualification basis, provided it is

  authorized by ANAC.


  (2) um FSTD fabricado anteriormente à

  data de publicação deste regulamento e que

  esteja qualificado por autoridade aeronáutica

  de um país signatário da Convenção de

  Aviação Civil Internacional poderá ser

  avaliado para qualificação inicial, de acordo

  com os requisitos estabelecidos na sua base

  de qualificação original, desde que autorizado

  pela ANAC.'
