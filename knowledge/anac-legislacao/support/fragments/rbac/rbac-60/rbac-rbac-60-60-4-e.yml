text: '(e) Os testes subjetivos que compõem a

  declaração descrita no parágrafo (b) desta

  seção e os testes objetivos realizados para

  atender aos requisitos do parágrafo (f) desta

  seção devem ser realizados na localidade

  permanente onde o FSTD será operado.'
