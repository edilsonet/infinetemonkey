title: 60.4(f)
text: '(f) The organization seeking to qualify the

  FSTD must provide the ANAC access to the

  FSTD for the length of time necessary for the

  ANAC to complete the required evaluation of

  the FSTD for initial qualification, which

  includes the conduct and evaluation of

  objective and subjective tests, including

  general FSTD requirements, as described in

  the QPS, to determine that the FSTD meets the

  standards for the qualification level sought.'
