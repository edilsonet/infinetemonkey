title: 60.4(g)
text: '(g) Quando uma avaliação de qualificação

  inicial de FSTD é concluída com sucesso, a

  ANAC emite um Certificado de Qualificação

  que inclui o seguinte:

  (1) the identification of the sponsor;


  (1) a identificação do operador;

  (2) the identification of the make, model,

  and series of the aircraft or set of aircraft being

  simulated;


  (2) a identificação do fabricante,

  modelo e série da aeronave ou conjunto de

  aeronaves sendo simuladas;

  (3) the identification of the configuration

  of the aircraft or set of aircraft being simulated

  (e.g.,

  engine

  model

  or

  models,

  flight

  instruments, or navigation or other systems);


  (3) a identificação da configuração da

  aeronave ou conjunto de aeronaves sendo

  simuladas (ex: modelo ou modelos do motor,

  instrumentos de voo, sistemas de navegação);


  Data da emissão: 20 de março de 2020.


  (4) a statement that the FSTD is qualified

  as either a FTD or a FFS;


  (4) um certificado de que o FSTD está

  qualificado como FTD ou FFS;

  (5) the identification of the qualification

  level of the FSTD;


  (5) a identificação do nível de

  qualificação do FSTD;

  (6) a statement that the qualification of

  the FSTD includes the tasks set out in the QPS

  relevant to the qualification level of the FSTD

  with the exception of those tasks not evaluated

  or considered unsatisfactory by ANAC; and


  (6)

  uma

  declaração

  de

  que

  a

  qualificação do FSTD inclui todas as tarefas

  operacionais definidas no QPS relevante ao

  nível de qualificação pretendido, com

  exceção daquelas tarefas não avaliadas ou

  consideradas insatisfatórias pela ANAC; e

  (7)

  a

  statement

  referencing

  any

  deviations that have been granted and included

  in the permanent qualification basis of the

  FSTD.


  (7) uma declaração referenciando

  quaisquer

  desvios

  que

  tenham

  sido

  concedidos

  e

  incluídos

  na

  base

  de

  qualificação permanente do FSTD.'
