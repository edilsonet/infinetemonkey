title: 60.5(a)
text: '(a) A sponsor may use a FSTD only if the

  sponsor has established and follows a QMS,

  currently approved by the ANAC, for the

  continuing surveillance and analysis of the

  sponsor''s performance and effectiveness in

  providing a satisfactory FSTD for use on a

  regular basis. The QMS must comply with the

  determination of Appendix E of this RBAC.'
