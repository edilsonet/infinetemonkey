  escrita a cada 12 meses, de um piloto

  qualificado que tenha voado a aeronave ou

  conjunto de aeronaves (como apropriado) nos

  12 meses precedentes, atestando que o

  desempenho e a qualidade de voo do FSTD

  representam a aeronave ou conjunto de

  aeronaves simuladas. O operador deve manter


