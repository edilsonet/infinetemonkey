text: '(c) Adicionalmente ao FSTD descrito no

  parágrafo (b)(2) desta seção, um operador de

  FSTD pode operar quaisquer outros FSTDs,

  independentemente da aeronave simulada,

  desde que:

  (1) all of the other FSTDs are used within

  the sponsor´s or another certificate holder´s

  ANAC-approved training program for the

  aircraft, at least once every 12 months; or


  (1) todos os outros FSTDs sejam

  utilizados dentro do programa de treinamento

  aprovado pela ANAC, do operador do FSTD

  ou de outro detentor de certificado, para a

  aeronave simulada, pelo menos uma vez a

  cada 12 meses; ou

  (2) the sponsor obtains a written

  statement at least annually from a qualified

  pilot who has flown the aircraft or set of

  aircraft (as appropriate) during the preceding

  12-month period stating that the subject

  FSTD''s performance and handling qualities,

  within

  the

  normal

  operating

  envelope,

  represent the simulated aircraft or set of

  aircraft. The sponsor must retain the two most


