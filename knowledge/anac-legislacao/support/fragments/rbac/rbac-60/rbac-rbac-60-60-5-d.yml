title: 60.5(d)
text: '(d) Um órgão da administração pública é

  elegível a ser um operador de FSTD e será

  considerado um operador de FSTD se as

  seguintes condições forem cumpridas:

  (1) the public body has an ANAC-

  approved training program for an aircraft or set

  of aircraft and at least one FSTD, sponsored by

  the body, is used within this training program,

  at least once every 12 months; and


  (1) o órgão público possuir um

  programa de treinamento aprovado pela

  ANAC para uma aeronave ou conjunto de

  aeronaves e, pelo menos um FSTD, operado

  pelo órgão, for utilizado neste programa de

  treinamento, pelo menos uma vez a cada 12

  meses; e

  (2) the public body has a QMS currently

  approved by the ANAC in accordance with

  section 60.5 of this regulation.


  (2) o órgão público possuir um QMS,

  aprovado pela ANAC de acordo com a seção'
