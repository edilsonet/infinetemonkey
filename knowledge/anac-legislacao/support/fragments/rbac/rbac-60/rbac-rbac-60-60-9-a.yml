title: 60.9(a)
text: '(a) O operador, quando solicitado, deve

  permitir à ANAC realizar inspeções no FSTD

  tão logo quanto praticável. Esta inspeção

  pode incluir todos os registros e documentos

  relacionados ao FSTD, para verificação dos

  requisitos vigentes.'
