title: 60.9(i)
text: '(i) monitorar a qualificação em

  andamento do FSTD a ele designado para

  garantir que todos os aspectos referentes à

  qualificação

  do

  FSTD

  estão

  sendo

  conduzidos de acordo com as disposições

  deste regulamento;

  (ii) ensure that the QMS is properly

  established, implemented and maintained; and


  (ii) garantir que o QMS seja

  propriamente estabelecido, executado e

  mantido; e

  (iii) regularly brief the sponsor''s

  management on the status of the on-going

  FSTD

  qualification

  program

  and

  the

  effectiveness and efficiency of the QMS.


  (iii)

  regularmente

  informar

  à

  gerência do operador sobre a situação da

  qualificação vigente do(s) FSTD(s) e da

  efetividade do QMS.

  (3) The management representative

  serves as the primary contact point for all

  matters between the sponsor and the ANAC

  regarding the qualification of that FSTD as

  provided for in this RBAC.


  (3) O representante do operador é o

  contato primário para todos os assuntos entre

  o operador e a ANAC que dizem respeito à

  qualificação

  daquele

  FSTD

  conforme

  disposto neste regulamento.

  (4) The management representative may

  delegate the duties described in paragraph'
