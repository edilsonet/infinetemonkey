  Upset Scenarios: IOS selectable dynamic airplane upsets must provide guidance to

  the instructor concerning the method used to drive the FSTD into an upset condition,

  including any malfunction or degradation in the FSTD’s functionality required to

  initiate the upset. The unrealistic degradation of simulator functionality (such as

  degrading flight control effectiveness) to drive an airplane upset is generally not

  acceptable unless used purely as a tool for repositioning the FSTD with the pilot out

  of the loop.

  Instructor Operating System (IOS): The simulator must have a feedback mechanism

  in place to notify the instructor/evaluator when the simulator’s validated

  aerodynamic envelope and aircraft operating limits have been exceeded during an

  upset recovery training task. This feedback mechanism must include:

  (1) FSTD validation envelope. This must be in the form of an alpha/beta

  envelope (or equivalent method) depicting the “confidence level” of the

  aerodynamic model depending on the degree of flight validation or source of

  predictive methods The envelopes must provide the instructor real-time

  feedback on the simulation during a maneuver. There must be a minimum of a

  (2) flaps up and flaps down envelope available;

  (3) Flight control inputs. This must enable the instructor to assess the pilot’s

  flight control displacements and forces (including fly-by- wire as appropriate);

  and

  (4) Airplane operational limits. This must display the aircraft operating limits

  during the maneuver as applicable for the configuration of the airplane.

  Statement of Compliance (SOC): An SOC is required that defines the source data

  used to construct the FSTD validation envelope. The SOC must also verify that each

  upset prevention and recovery feature programmed at the instructor station and the

  associated training maneuver has been evaluated by a suitably qualified pilot using

  methods described in this section. The statement must confirm that the recovery

  maneuver can be performed such that the FSTD does not exceed the FSTD

  validation envelope, or when exceeded, that it is within the realm of confidence in

