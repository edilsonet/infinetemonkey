text: '(b) Cada FFS deve possuir um QTG, aceito

  pela ANAC, contendo:

  (1) Objective data obtained from

  traditional aircraft testing or another approved

  source;

  (1) Dados objetivos obtidos de ensaio em

  voo da aeronave ou outra fonte de dados

  aprovada;

  (2) The results of FFS objective tests;

  (2) Os resultados dos testes objetivos do

  FFS;

  (3) The results of FFS subjective tests;

  and

  (3) Os resultados dos testes subjetivos do

  FFS; e

  (4) A description of the equipment

  necessary to perform the evaluation for initial

  qualification and the continuing qualification

  evaluations.

  (4) Uma descrição do equipamento

  necessário para executar as avaliações para

  qualificação inicial e para qualificação

  recorrente.


  Data da emissão: 20 de março de 2020.


  Table A1 - General technical requirements for level A, B, C and D full-flight simulators
  -

  Airplane


  Qualification

  Level

  General technical requirements

  A

  The lowest level of FFS technical complexity.

  An enclosed full-scale replica of the airplane cockpit/flight deck including simulation
  of

  all systems, instruments, navigational equipment, communications, and caution and

  warning systems.

  An instructor’s station with seat should be provided. Seats for the flight crew members
  and

  two seats for inspectors/observers should also be provided.

  Control forces and displacement characteristics should correspond to those of the

  replicated airplane and they should respond in the same manner as the airplane under the

  same flight conditions.

  The use of class-specific data tailored to the specific airplane type with fidelity sufficient

  to meet the objective tests, functions and subjective tests is allowed.

  Generic ground effect and ground handling models are permitted.

  Motion, visual and sound systems sufficient to support the training, testing and checking

  credits sought are required.

  The visual system should provide at least 45 degrees horizontal and 30 degrees vertical

  field of view per pilot.

  The response to control inputs should not be greater than 300 ms more than that

  experienced on the airplane.

  See table A2 for more simulator requirements.

  B

  As for level A, plus:

  Validation flight test data should be used as the basis for flight and performance and

  systems’ characteristics.

  Additionally, ground handling and aerodynamics programming to include ground effect

  reaction and handling characteristics should be derived from validation flight test data.

  See table A2 for more simulator requirements.

  C

  The second highest level of FFS fidelity.

  As for level B, plus:

  A daylight/twilight/night visual system is required with a continuous, cross-cockpit,

  minimum collimated visual field of view providing each pilot with 176 degrees horizontal

  and 36 degrees vertical field of view.

  A six-degrees-of-freedom motion system should be provided.

  The sound simulation should include the sounds of precipitation and other significant

  airplane noises perceptible to the pilot and should be able to reproduce the sounds of a

  crash landing.

  The response to control inputs (motion and instrument cues) should not be greater than 100

  ms more than that experienced on the airplane. For a visual system cues should not be

  greater than 120 ms more than that experienced on the airplane.

  Wind shear simulation should be provided.

  An upset prevention and recovery training (UPRT) instructor operating station (IOS)

  feedback mechanism should be available.

  See table A2 for more simulator requirements.

  D

  The highest level of FFS fidelity.

  As for level C, plus:

  Extended set of sound and motion buffet tests.

  Improved aerodynamic modeling.

  See table A2 for more simulator requirements.


