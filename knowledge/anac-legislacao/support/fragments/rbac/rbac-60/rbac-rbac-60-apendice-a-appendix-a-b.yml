  A Statement of Compliance (SOC) is required which describes the aerodynamic

  modeling methods, validation, and checkout of the stall characteristics of the FSTD.

  The SOC must also include verification that the FSTD has been evaluated by a

  subject matter expert pilot acceptable to the ANAC.

  Where known limitations exist in the aerodynamic model for particular stall

  maneuvers (such as aircraft configurations and stall entry methods), these limitations

  must be declared in the required SOC.

  FSTDs qualified for full stall training tasks must also meet the instructor operating

  station (IOS) requirements for upset prevention and recovery training (UPRT) tasks

  as described in section 2.n. of this table.

  2.n.

  Upset Prevention and Recovery Training (UPRT).

  Aerodynamics Evaluation: The simulator must be evaluated for specific upset

  recovery maneuvers for the purpose of determining that the combination of angle of

  attack and sideslip does not exceed the range of flight test validated

  data or wind tunnel/analytical data while performing the recovery maneuver. The

  following minimum set of required upset recovery maneuvers must be evaluated in

  this manner and made available to the instructor/evaluator. Other upset recovery

  scenarios as developed by the FSTD sponsor must be evaluated in the same manner:

  (1) A nose-high, wings level aircraft upset;

  (2) A nose-low aircraft upset; and

  (3) A high bank angle aircraft upset.

  C,D

