  A Statement of Compliance (SOC) is required verifying that the stick pusher system

  has been modeled, programmed, and validated using the aircraft manufacturer’s

  design data or other acceptable data source. The SOC must address, at a minimum,

  stick pusher activation and cancellation logic as well as system dynamics, control

  displacement and forces as a result of the stick pusher activation.

