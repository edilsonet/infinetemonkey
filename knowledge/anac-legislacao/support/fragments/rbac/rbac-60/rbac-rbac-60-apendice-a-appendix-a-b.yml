  2.m.

  High Angle of Attack Modeling

  Aerodynamic stall modeling that includes degradation in static/dynamic lateral-

  directional stability, degradation in control response (pitch, roll, and yaw),

  uncommanded roll response or roll-off requiring significant control deflection to

  counter, apparent randomness or non-repeatability, changes in pitch stability, Mach

  effects, and stall buffet, as appropriate to the aircraft type.

  The aerodynamic model must incorporate an angle of attack and sideslip range to

  support the training tasks. At a minimum, the model must support an angle of attack

  range to ten degrees beyond the stall identification angle of attack. The stall

  identification angle of attack is defined as the point where the behavior of the

  airplane gives the pilot a clear and distinctive indication through the inherent flight

  characteristics or the characteristics resulting from the operation of a stall

  identification device (e.g., a stick pusher) that the airplane has stalled.

  The model must be capable of capturing the variations seen in the stall

  characteristics of the airplane (e.g., the presence or absence of a pitch break,

  deterrent buffet, or other indications of a stall where present on the aircraft). The

  aerodynamic modeling must support stall training maneuvers in the following flight

  conditions:

  (1) Stall entry at wings level (1g);

  C,D

