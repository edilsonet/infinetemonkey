  3.e.

  FTD control feel dynamics must replicate the airplane. This must be determined by

  comparing a recording of the control feel dynamics of the FTD to airplane

  measurements. For initial and upgrade qualification evaluations, the control dynamic

  characteristics must be measured and recorded directly from the flight deck controls,

  and must be accomplished in takeoff, cruise, and landing flight conditions and

  configurations.

