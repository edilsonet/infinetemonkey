  The scene content must allow a pilot to successfully accomplish a visual landing. Dusk

  (or twilight) scenes, as a minimum, must provide full color presentations of reduced

  ambient intensity, sufficient surfaces with appropriate textural cues that include self-

  illuminated objects such as road networks, ramp lighting and airport signage, to

  conduct a visual approach, landing and airport movement (taxi). Scenes must include a

  definable horizon and typical terrain characteristics such as fields, roads and bodies of

  water and surfaces illuminated by airplane landing lights. If provided, directional

