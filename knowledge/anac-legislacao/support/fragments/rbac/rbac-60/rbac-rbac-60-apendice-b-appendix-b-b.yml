  only items such as landing gear pin

  storage compartments, fire axes and

  extinguishers, spare light bulbs,

  aircraft documents pouches are not

  considered essential and may be

  omitted.


  For Level 6 FTDs, flight deck

  window panes may be omitted

  where non-distracting and

  subjectively acceptable to conduct

  qualified training tasks.


