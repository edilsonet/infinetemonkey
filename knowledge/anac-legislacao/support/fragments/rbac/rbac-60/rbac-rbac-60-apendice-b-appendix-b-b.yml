  3.c.1.

  Installed systems must simulate the applicable airplane system operation, both on the

  ground and in flight. Installed systems must be operative to the extent that applicable

  normal, abnormal, and emergency operating procedures included in the sponsor’s

  training programs can be accomplished.

  Level 6 must simulate all applicable airplane flight, navigation, and systems operation.

  Level 5 must have at least functional flight and navigational controls, displays, and

  instrumentation.

  Level 4 must have at least one airplane system installed and functional.

