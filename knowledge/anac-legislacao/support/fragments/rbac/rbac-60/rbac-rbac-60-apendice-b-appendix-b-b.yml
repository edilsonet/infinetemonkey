  Level 7 FTD only;

  The display image of any three dimensional instrument, such as an electro- mechanical

  instrument, should appear to have the same three dimensional depth as the replicated

  instrument. The appearance of the simulated instrument, when viewed from the

  principle operator’s angle, should replicate that of the actual airplane instrument. Any

  instrument reading inaccuracy due to viewing angle and parallax present in the actual

  airplane instrument should be duplicated in the simulated instrument display image.

  Viewing angle error and parallax must be minimized on shared instruments such and

  engine displays and standby indicators.

  1.b.

  The FTD must have equipment (e.g., instruments, panels, systems, circuit breakers,

  and controls) simulated sufficiently for the authorized training/checking events to be

  accomplished. The installed equipment must be located in a spatially correct location

  and may be in a flight deck or an open flight deck area. Additional equipment required

  for the authorized training/checking events must be available in the FTD, but may be

  located in a suitable location as near as practical to the spatially correct position.

  Actuation of equipment must replicate the appropriate function in the airplane. Fire

  axes, landing gear pins, and any similar purpose instruments need only be represented

  in silhouette.

