  6.u.

  The following weather effects as observed on the visual system must be

  simulated and respective instructor controls provided.

  (1) Multiple cloud layers with adjustable bases, tops, sky coverage and scud

  effect;

  (2) Storm cells activation and/or deactivation;

  (3) Visibility and runway visual range (RVR), including fog and patchy fog effect;

  (4) Effects on ownship external lighting;

  (5) Effects on airport lighting (including variable intensity and fog effects);

  (6) Surface contaminants (including wind blowing effect);

  (7) Variable precipitation effects (rain, hail, snow);

  (8) In-cloud airspeed effect; and

  (9) Gradual visibility changes entering and breaking out of cloud.

  7

  Scud effects are low, detached, and

  irregular clouds below a defined

  cloud layer.

  6.v.

  The simulator must provide visual effects for:

  (1) Light poles;

  (2) Raised edge lights as appropriate; and

  (3) Glow associated with approach lights in low visibility before physical lights

  are seen.

  7

  Visual effects for light poles and

  raised edge lights are for the

  purpose of providing additional

  depth perception during takeoff,

  landing, and taxi training tasks.

  Three dimensional modeling of the

  actual poles and stanchions is not

  required.

  6.w

  A minimum of three (3) real-world airport models required for simulator qualification.

  Must be consistent with published data used for airplane operations. Each model

  should be in a different visual scene to permit assessment of FSTD automatic visual

  scene changes.

