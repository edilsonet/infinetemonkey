  2.c.1

  Relative responses of the flight deck instruments must be measured by latency tests, or

  transport delay tests, and may not exceed 300 milliseconds. The instruments must

  respond to abrupt input at the pilot''s position within the allotted time, but not before

  the time when the airplane responds under the same conditions.

  (1) Latency: The FTD instrument and, if applicable, the motion system and the

  visual system response must not be prior to that time when the airplane

  responds and may respond up to 300 milliseconds after that time under the

  same conditions.

  (2) Transport Delay: As an alternative to the Latency requirement, a transport

  delay objective test may be used to demonstrate that the FTD system does not

