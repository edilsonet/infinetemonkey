title: apendice-b-appendix-b(b)
text: '(b) Exceto para FTD nível 4, cada FTD

  deve possuir um QTG, aceito pela ANAC,

  contendo:

  (1) Objective data obtained from

  traditional aircraft testing or another approved

  source;

  (1) Dados objetivos obtidos de ensaio

  em voo da aeronave ou outra fonte de dados

  aprovada;

  (2) The results of FTD objective tests;

  (2) Os resultados dos testes objetivos do

  FTD;

  (3) The results of FTD subjective tests;

  and

  (3) Os resultados dos testes subjetivos

  do FTD; e

  (4) A description of the equipment

  necessary to perform the evaluation for initial

  qualification and the continuing qualification

  evaluations.

  (4) Uma descrição do equipamento

  necessário para executar as avaliações para

  qualificação inicial e para qualificação

  recorrente.


  Data da emissão: 20 de março de 2020.


  Table B1 - General technical requirements for FTD levels - Airplane


  FTD Level

  General technical requirements

  4

  A device that may have an open airplane-specific flight deck area, or an enclosed

  airplane-specific flight deck and at least one operating system.

  Air/ground logic is required (no aerodynamic programming required). All displays

  may be flat/LCD panel representations or actual representations of displays in the

  aircraft.

  All controls, switches, and knobs may be touch sensitive activation (not capable of

  manual manipulation of the flight controls) or may physically replicate the aircraft in

  control operation.

  See table B2 for more FTD requirements.

  5

  A device that may have an open airplane-specific flight deck area, or an enclosed

  airplane-specific flight deck; generic aerodynamic programming; at least one

  operating system; and control loading that is representative of the simulated airplane

  only at an approach speed and configuration.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft.

  Primary and secondary flight controls (e.g., rudder, aileron, elevator, flaps,

  spoilers/speed brakes, engine controls, landing gear, nosewheel steering, trim, brakes)

  must be physical controls.

  All other controls, switches, and knobs may be touch sensitive activation.

  See table B2 for more FTD requirements.

  6

  A device that has an enclosed airplane-specific flight deck; airplane-specific

  aerodynamic programming; all applicable airplane systems operating; control loading

  that is representative of the simulated airplane throughout its ground and flight

  envelope; and significant sound representation.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft, but all controls, switches, and knobs must physically replicate

  the aircraft in control operation.

  See table B2 for more FTD requirements.

  7

  A Level 7 device is one that has an enclosed airplane-specific flight deck and

  aerodynamic program with all applicable airplane systems operating and control

  loading that is representative of the simulated airplane throughout its ground and flight

  envelope and significant sound representation.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft, but all controls, switches, and knobs must physically replicate

  the aircraft in control operation.

  It also has a visual system that provides an out-of-the-flight deck view, providing

  cross-flight deck viewing (for both pilots simultaneously) of a field-of-view of at least

  180° horizontally and 40° vertically.

  See table B2 for more FTD requirements.


