  2.a.1

  The FTD must provide the proper effect of aerodynamic changes for the combinations

  of drag and thrust normally encountered in flight. This must include the effect of

  change in airplane attitude, thrust, drag, altitude, temperature, and configuration.

  Level 6 additionally requires the effects of changes in gross weight and center of

  gravity.

  Level 5 requires only generic aerodynamic programming. An SOC is required.

  5,6

  None

  2.a.2

  A flight dynamics model that accounts for various combinations of drag and thrust

  normally encountered in flight must correspond to actual flight conditions, including

  the effect of change in airplane attitude, thrust, drag, altitude, temperature, gross

  weight, moments of inertia, center of gravity location, and configuration.

  The effects of pitch attitude and of fuel slosh on the aircraft center of gravity must be

  simulated.

  An SOC is required.

  7

  None

  2.b.

  The FTD must have the computer capacity, accuracy, resolution, and dynamic

  response needed to meet the qualification level sought.

  An SOC is required.

