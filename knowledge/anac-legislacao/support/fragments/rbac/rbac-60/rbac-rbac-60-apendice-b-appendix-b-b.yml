  2.e.

  If the aircraft being simulated is one of the aircraft listed in section 121.358 of RBAC

  121, Low- altitude windshear system equipment requirements, the FTD must employ

  windshear models that provide training for recognition of windshear phenomena and

  the execution of recovery procedures. Models must be available to the

  instructor/evaluator for the following critical phases of flight:

  (1) Prior to takeoff rotation;

  (2) At liftoff;

  (3) During initial climb; and

  (4) On final approach, below 500 ft AGL.

  The addition of realistic levels of turbulence associated with each required windshear

  profile must be available and selectable to the instructor.

  In addition to the four basic windshear models required for qualification, at least two

  additional “complex” windshear models must be available to the instructor which

  represent the complexity of actual windshear encounters. These models must be

  available in the takeoff and landing configurations and must consist of independent

  variable winds in multiple simultaneous components. The Windshear Training Aid

  provides two such example “complex” windshear models that may be used to satisfy

  this requirement.

  7

  Windshear models may consist of

  independent variable winds in

  multiple simultaneous components.

  The FTD should employ a method

  to ensure the required survivable

  and non-survivable windshear

  scenarios are repeatable in the

  training environment.

  For Level 7 FTDs, windshear

  training tasks may only be qualified

  for aircraft equipped with a

  synthetic stall warning system. The

  qualified windshear profile(s) are

  evaluated to ensure the synthetic

  stall warning (and not the stall

  buffet) is first indication of the stall.

