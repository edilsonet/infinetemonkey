  2.i.

  Engine and Airframe Icing

  Modeling that includes the effects of icing, where appropriate, on the airframe,

  aerodynamics, and the engine(s). Icing models must simulate the aerodynamic

  degradation effects of ice accretion on the airplane lifting surfaces including loss of

  lift, decrease in stall angle of attack, change in pitching moment, decrease in control

  effectiveness, and changes in control forces in addition to any overall increase in drag.

  Aircraft systems (such as the stall protection system and autoflight system) must

  respond properly to ice accretion consistent with the simulated aircraft.

  Aircraft OEM data or other acceptable analytical methods must be utilized to develop

  ice accretion models that are representative of the simulated aircraft’s performance

  degradation in a typical in-flight icing encounter. Acceptable analytical methods may

  include wind tunnel analysis and/or engineering analysis of the aerodynamic effects of

  icing on the lifting surfaces coupled with tuning and supplemental subjective

  7

