  3.e.

  The FTD must provide control forces and control travel that corresponds to the

  airplane being simulated. Control forces must react in the same manner as in the

  airplane under the same flight conditions.

  For Level 7 FTDs, control systems must replicate airplane operation for the normal

  and any non-normal modes including back-up systems and should reflect failures of

  associated systems. Appropriate cockpit indications and messages must be replicated.

