  1.a.

  The simulator must have a flight deck that is a replica of the helicopter being simulated.

  The simulator must have controls, equipment, observable flight deck indicators, circuit

  breakers, and bulkheads properly located, functionally accurate and replicating the

  helicopter. The direction of movement of controls and switches must be identical to that

  in the helicopter. Pilot seats must afford the capability for the occupant to be able to

  achieve the design “eye position” established for the helicopter being simulated.

  Equipment for the operation of the flight deck windows must be included, but the actual

  windows need not be operable. Fire axes, extinguishers, and spare light bulbs must be

  available in the FFS but may be relocated to a suitable location as near as practical to
  the

  original position. Fire axes, landing gear pins, and any similar purpose instruments need

  only be represented in silhouette.

