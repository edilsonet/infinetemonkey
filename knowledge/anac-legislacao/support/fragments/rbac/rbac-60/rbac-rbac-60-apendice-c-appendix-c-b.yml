  6.c.

  The simulator must provide a continuous visual field-of-view of at least 146° horizontally

  and 36° vertically per pilot seat. Both pilot seat visual systems must be operable

  simultaneously. Horizontal field-of-view is centered on the zero degree azimuth line

  relative to the aircraft fuselage. The minimum horizontal field-of-view coverage must be

  plus and minus one-half (½) of the minimum continuous field-of-view requirement,

  centered on the zero degree azimuth line relative to the aircraft fuselage. An SOC must

  explain the geometry of the installation. Capability for a field-of-view in excess of the

  minimum is not required for qualification at Level C. However, where specific tasks

