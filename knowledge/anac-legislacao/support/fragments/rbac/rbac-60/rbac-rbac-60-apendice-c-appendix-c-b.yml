text: '(b) Cada FFS deve possuir um QTG, aceito

  pela ANAC, contendo:

  (1) Objective data obtained from

  traditional aircraft testing or another approved

  source;

  (1) Dados objetivos obtidos de ensaio

  em voo da aeronave ou outra fonte de dados

  aprovada;

  (2) The results of FFS objective tests;

  (2) Os resultados dos testes objetivos do

  FFS;

  (3) The results of FFS subjective tests;

  and

  (3) Os resultados dos testes subjetivos

  do FFS; e

  (4) A description of the equipment

  necessary to perform the evaluation for initial

  qualification and the continuing qualification

  evaluations.

  (4) Uma descrição do equipamento

  necessário para executar as avaliações para

  qualificação inicial e para qualificação

  recorrente.


  Data da emissão: 20 de março de 2020.


  Table C1 - General technical requirements for level B, C and D full-flight simulators -

  Helicopter


  Qualification Level

  General technical requirements

  B

  The lowest level of FFS technical complexity for a helicopter.

  An enclosed full-scale replica of the helicopter cockpit with representative pilots’

  seats, including simulation of all systems, instruments, navigational equipment,

  communications and caution and warning systems.

  An instructor’s station with seat should be provided and at least one additional seat

  for inspectors/observers.

  Static control forces and displacement characteristics should correspond to that of

  the replicated helicopter and they should reflect the helicopter under the same static

  flight conditions.

  Motion, visual and sound systems sufficient to support the training, testing and

  checking credits sought are required.

  The response to control inputs should not be greater than 150 ms more than that

  experienced on the helicopter.

  Validation flight test data should be used as the basis for flight and performance

  and systems characteristics.

  Additionally ground handling and aerodynamics programming to include ground

  effect reaction and handling characteristics should be derived from validation flight

  test data.

  A motion system having a minimum of three degrees of freedom (pitch, roll, and

  heave) to accomplish the required training tasks should be provided. A reduced six-

  axis motion performance envelope is acceptable.

  See table C2 for more simulator requirements.

  C

  The second highest level of simulator performance. As for level B plus: A

  daylight/dusk/night visual system is required with a continuous field of view per

  pilot of not less than 146° horizontal and 36º vertical.

  The sound simulation should include the sounds of precipitation and significant

  helicopter noises perceptible to the pilot and should be able to reproduce the sounds

  of a crash landing.

  The response to control inputs should not be greater than 100 ms more than that

  experienced on the helicopter.

  Turbulence and other atmospheric models should be provided to support the

  training, testing and checking credit sought.

  See table C2 for more simulator requirements.

  D

  The highest level of simulator performance.

  As for level C plus:

  A full daylight/dusk/night visual system is required with a continuous field of view

  per pilot of not less than 176° horizontal and 56° vertical and an extended set of

  sound and motion buffet tests.

  See table C2 for more simulator requirements.


  Data da emissão: 20 de março de 2020.


