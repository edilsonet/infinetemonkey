  3.

  Equipment Operation.

  See next

  None

  3.a.

  All relevant instrument indications involved in the simulation of the helicopter must

  automatically respond to control movement or external disturbances to the simulated

  helicopter; e.g., turbulence or windshear. Numerical values must be presented in the

  appropriate units.

  B,C,D

  None

  3.b.

  Communications, navigation, caution, and warning equipment must be installed and

  operate within the tolerances applicable for the helicopter being simulated.

  B,C,D

  NA

  3.c.

  Simulated helicopter systems must operate as the helicopter systems operate under

  normal, abnormal, and emergency operating conditions on the ground and in flight.

  B,C,D

  None

  3.d.

  The simulator must provide pilot controls with control forces and control travel that

  correspond to the simulated helicopter. The simulator must also react in the same manner

  as the helicopter under the same flight conditions.

  B,C,D

  None

  3.e.

  Simulator control feel dynamics must replicate the helicopter simulated. This must be

  determined by comparing a recording of the control feel dynamics of the simulator to

  helicopter measurements. For initial and upgrade evaluations, the control dynamic

  characteristics must be measured and recorded directly from the flight deck controls, and

  must be accomplished in takeoff, cruise, and landing conditions and configurations.

  C,D

  None

