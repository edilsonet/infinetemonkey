  The minimum horizontal field-of-view coverage must be plus and minus one-half (½) of

  the minimum continuous field-of-view requirement, centered on the zero degree azimuth

  line relative to the aircraft fuselage. An SOC must explain the geometry of the

  installation.

  An SOC is required.

