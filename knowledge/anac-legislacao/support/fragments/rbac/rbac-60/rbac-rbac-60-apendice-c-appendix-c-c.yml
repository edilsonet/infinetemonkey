cite: apendice-c-appendix-c(c)
title: apendice-c-appendix-c(c)
text: '(c) At least one (1) helicopter landing area on a sloped surface where the slope

  is at least 2½°.

  C,D

  The model identifications must

  be acceptable to the ANAC,

  selectable from the IOS, and

  listed on the SOQ.

  7.

  Sound System.

  See next

  None

  7.a.

  The simulator must provide flight deck sounds that result from pilot actions that

  correspond to those that occur in the helicopter.

  B,C,D

  None

  7.b.

  Volume control, if installed, must have an indication of the sound level setting.

  B,C,D

  None

  7.c.

  The simulator must accurately simulate the sound of precipitation, windshield wipers, and

  other significant helicopter noises perceptible to the pilot during normal and abnormal

  operations, and include the sound of a crash (when the simulator is landed in an unusual

  attitude or in excess of the structural gear limitations); normal engine sounds; and the

  sounds of gear extension and retraction.

  An SOC is required.

  C,D

  None

  7.d.

  The simulator must provide realistic amplitude and frequency of flight deck noises and

  sounds. Simulator performance must be recorded, compared to amplitude and frequency

  of the same sounds recorded in the helicopter, and made a part of the QTG.

  D

  None


  Data da emissão: 20 de março de 2020.


