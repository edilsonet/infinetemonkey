title: apendice-d-appendix-d(b)
text: '(b) Exceto para FTD nível 4, cada FTD

  deve possuir um QTG, aceito pela ANAC,

  contendo:

  (1) Objective data obtained from

  traditional aircraft testing or another approved

  source;

  (1) Dados objetivos obtidos de ensaio

  em voo da aeronave ou outra fonte de dados

  aprovada;

  (2) The results of FTD objective tests;

  (2) Os resultados dos testes objetivos do

  FTD;

  (3) The results of FTD subjective tests;

  and

  (3) Os resultados dos testes subjetivos

  do FTD; e

  (4) A description of the equipment

  necessary to perform the evaluation for initial

  qualification and the continuing qualification

  evaluations.

  (4) Uma descrição do equipamento

  necessário para executar as avaliações para

  qualificação inicial e para qualificação

  recorrente.


  Data da emissão: 20 de março de 2020.


  Table D1 - General technical requirements for FTD levels - Helicopter


  FTD Level

  General technical requirements

  4

  A Level 4 device is one that may have an open helicopter-specific flight deck area, or

  an enclosed helicopter-specific flight deck and at least one operating system.

  Air/ground logic is required (no aerodynamic programming required). All displays

  may be flat/LCD panel representations or actual representations of displays in the

  aircraft.

  All controls, switches, and knobs may be touch sensitive activation (not capable of

  manual manipulation of the flight controls) or may physically replicate the aircraft in

  control operation.

  See table D2 for more FTD requirements.

  5

  A Level 5 device is one that may have an open helicopter-specific flight deck area, or

  an enclosed helicopter-specific flight deck and a generic aerodynamic programming

  with at least one operating system and control loading representative of the simulated

  helicopter.

  The control loading need only represent the helicopter at an approach speed and

  configuration.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft. Primary and secondary flight controls (e.g., rudder, aileron,

  elevator, flaps, spoilers/speed brakes, engine controls, landing gear, nosewheel

  steering, trim, brakes) must be physical controls.

  All other controls, switches, and knobs may be touch sensitive activation.

  See table D2 for more FTD requirements.

  6

  A Level 6 device is one that has an enclosed helicopter-specific flight deck and

  aerodynamic program with all applicable helicopter systems operating and control

  loading that is representative of the simulated helicopter throughout its ground and

  flight envelope and significant sound representation.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft, but all controls, switches, and knobs must physically replicate

  the aircraft in control operation.

  See table D2 for more FTD requirements.

  7

  A Level 7 device is one that has an enclosed helicopter-specific flight deck and

  aerodynamic program with all applicable helicopter systems operating and control

  loading that is representative of the simulated helicopter throughout its ground and

  flight envelope and significant sound representation.

  All displays may be flat/LCD panel representations or actual representations of

  displays in the aircraft, but all controls, switches, and knobs must physically replicate

  the aircraft in control operation. It also has a visual system that provides an out-of-the-

  flight deck view, providing cross-flight deck viewing (for both pilots simultaneously)

  of a field-of-view of at least 146° horizontally and 36° vertically as well as a vibration

  cueing system for characteristic helicopter vibrations noted at the pilot station(s).

  See table D2 for more FTD requirements.


  Data da emissão: 20 de março de 2020.


  Table D2- General FTD Requirements

  Entry

  Number

  General FTD Requirements

  FTD

  Level

  Notes/Information

  1.

  General Flight deck Configuration.

  See next

  None

  1.a.

  The FTD must have a flight deck that is a replica of the helicopter, or set of

  helicopters simulated with controls, equipment, observable flight deck

  indicators, circuit breakers, and bulkheads properly located, functionally

  accurate and replicating the helicopter or set of helicopters. The direction of

  movement of controls and switches must be identical to that in the helicopter

  or set of helicopters.

  Crewmember seats must afford the capability for the occupant to be able to

  achieve the design “eye position.” Equipment for the operation of the flight

  deck windows must be included, but the actual windows need not be

  operable. Those circuit breakers that affect procedures or result in observable

  flight deck indications must be properly located and functionally accurate.

  Fire axes, extinguishers, landing gear pins, and spare light bulbs must be

  available, and may be represented in silhouette, in the flight simulator. This

  equipment must be present as near as practical to the original position.

  6,7

  For FTD purposes, the flight deck consists of

  all that space forward of a cross section of the

  flight deck at the most extreme aft setting of

  the pilots’ seats including additional, required

  crewmember duty stations and those required

  bulkheads aft of the pilot seats.

  Bulkheads containing only items such as

  landing gear pin storage compartments, fire

  axes and extinguishers, spare light bulbs, and

  aircraft documents pouches are not considered

  essential and may be omitted. If omitted, these

  items, or the silhouettes of these items, may be

  placed on the wall of the simulator, or in any

  other location as near as practical to the

  original position of these items.

  1.b.

  The FTD must have equipment (i.e., instruments, panels, systems, circuit

  breakers, and controls) simulated sufficiently for the authorized

  training/checking events to be accomplished. The installed equipment, must

  be located in a spatially correct configuration, and may be in a flight deck or

  an open flight deck area. Those circuit breakers that affect procedures or

  result in observable flight deck indications must be properly located and

  functionally accurate. Additional equipment required for the authorized

  training and checking events must be available in the FTD but may be

  located in a suitable location as near as practical to the spatially correct

  position. Actuation of this equipment must replicate the appropriate function

  in the helicopter.

  4,5

  None


  Data da emissão: 20 de março de 2020.


