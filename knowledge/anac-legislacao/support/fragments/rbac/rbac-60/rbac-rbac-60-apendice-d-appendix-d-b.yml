  6.

  Visual System.

  See next

  None

  6.a.

  The FTD may have a visual system, if desired, although it is not required. If

  a visual system is installed, it must meet the following criteria:

  See next

  None

  6.a.1.

  The visual system must respond to abrupt input at the pilot’s position.

  An SOC is required.

  4,5,6

  None

  6.a.2.

  The visual system must be at least a single channel, non-collimated display.

  An SOC is required.

  4,5,6

  None

  6.a.3.

  The visual system must provide at least a field-of-view of 18° vertical / 24°

  horizontal for the pilot flying.

  An SOC is required.

  4,5,6

  None

  6.a.4.

  The visual system must provide for a maximum parallax of 10° per pilot.

  An SOC is required.

  4,5,6

  None

  6.a.5.

  The visual scene content may not be distracting.

  An SOC is required.

  4,5,6

  None

  6.a.6.

  The minimum distance from the pilot’s eye position to the surface of a direct

  view display may not be less than the distance to any front panel instrument.

  An SOC is required.

  4,5,6

  None

  6.a.7.

  The visual system must provide for a minimum resolution of 5 arc-minutes

  4,5,6

  None


