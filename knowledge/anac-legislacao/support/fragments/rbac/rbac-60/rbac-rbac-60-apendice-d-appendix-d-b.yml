  3.d.

  The lighting environment for panels and instruments must be sufficient for

  the operation being conducted.

  4,5,6,7

  Back-lighted panels and instruments may be

  installed but are not required.

  3.e.

  The FTD must provide control forces and control travel that correspond to

  the replicated helicopter or set of helicopters. Control forces must react in the

  same manner as in the helicopter or set of helicopters under the same flight

  conditions.

  6,7

  None

  3.f.

  The FTD must provide control forces and control travel of sufficient

  precision to manually fly an instrument approach. The control forces must

  react in the same manner as in the helicopter or set of helicopters under the

  same flight conditions.

  5

  None

  4.

  Instructor or Evaluator Facilities.

  See next

  None

  4.a.

  In addition to the flight crewmember stations, suitable seating arrangements

  for an instructor/check airman and ANAC Inspector must be available.

  These seats must provide adequate view of crewmember’s panel(s).

  4,5,6,7

  These seats need not be a replica of an aircraft

  seat and may be as simple as an office chair

  placed in an appropriate position.

  4.b.

  The FTD must have instructor controls that permit activation of normal,

  abnormal, and emergency conditions, as appropriate. Once activated, proper

  system operation must result from system management by the crew and not

  require input from the instructor controls.

  4,5,6,7

  None

  5.

  Motion System.

  See next

  None

  5.a.

  A motion system may be installed in an FTD. If installed, the motion system

  operation must not be distracting. If a motion system is installed and

  additional training, testing, or checking credits are being sought, sensory

  cues must also be integrated. The motion system must respond to abrupt

  input at the pilot’s position within the allotted time, but not before the time

  when the helicopter responds under the same conditions. The motion system

  must be measured by latency tests or transport delay tests and may not

  exceed 150 milliseconds. Instrument response must not occur prior to motion

  4,5,6,7

  None


