  for both computed and displayed pixel size.

  An SOC is required.

  6.b.

  If a visual system is installed and additional training, testing, or checking

  credits are being sought on the basis of having a visual system, a visual

  system meeting the standards set out for at least a Level A FFS (see

  Appendix A of this RBAC) will be required. A “direct- view,” non-

  collimated visual system (with the other requirements for a Level A visual

  system met) may be considered satisfactory for those installations where the

  visual system design “eye point” is appropriately adjusted for each pilot’s

  position such that the parallax error is at or less than 10º simultaneously for

  each pilot.

  An SOC is required.

  4,5,6

  None

  6.c.

  The FTD must provide a continuous visual field-of-view of at least 146°

  horizontally and 36° vertically for both pilot seats, simultaneously. The

  minimum horizontal field-of-view coverage must be plus and minus one-half

  (½) of the minimum continuous field-of- view requirement, centered on the

  zero degree azimuth line relative to the aircraft fuselage. Additional

  horizontal field-of-view capability may be added at the sponsor’s discretion

  provided the minimum field- of-view is retained. Capability for a field-of-

  view in excess of these minima is not required for qualification at Level 7.

  However, where specific tasks require extended fields of view beyond the

  146° by 36° (e.g., to accommodate the use of “chin windows” where the

  accommodation is either integral with or separate from the primary visual

  system display), then such extended fields of view must be provided.

  An SOC is required and must explain the geometry of the installation.

  7

  Optimization of the vertical field-of-view may

  be considered with respect to the specific

  helicopter flight deck cut-off angle. When

  considering the installation/use of augmented

  fields of view, as described here, it will be the

  responsibility of the sponsor to meet with the

  ANAC to determine the training, testing,

  checking, or experience tasks for which the

  augmented field-of-view capability may be

  critical to that approval.

  6.d.

  A minimum of one (1) representative airport and one (1) representative

  helicopter landing area model.

  7

  Each model must be acceptable to the ANAC,

  selectable from the IOS, and listed on the SOQ


