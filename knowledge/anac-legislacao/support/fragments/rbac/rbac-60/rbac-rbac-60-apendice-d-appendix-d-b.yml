  not exceed the specified limit. The sponsor must measure all the delay

  encountered by a step signal migrating from the pilot’s control through all

  the simulation software modules in the correct order, using a handshaking

  protocol, finally through the normal output interfaces to the instrument

  display and, if applicable, the motion system, and the visual system.

  3.

  Equipment Operation.

  See next

  None

  3.a.

  All relevant instrument indications involved in the simulation of the

  helicopter must automatically respond to control movement or external

  disturbances to the simulated helicopter or set of helicopters; e.g., turbulence

  or winds.

  4(a),5,6,7

  None

  3.b.

  Navigation equipment must be installed and operate within the tolerances

  applicable for the helicopter or set of helicopters.

  Levels 6 and 7 must also include communication equipment (inter- phone

  and air/ground) like that in the helicopter.

  Level 5 only needs that navigation equipment necessary to fly an instrument

  approach.

  4(a),5,6,7

  None

  3.c.

  Installed systems must simulate the applicable helicopter system operation

  both on the ground and in flight. At least one helicopter system must be

  represented. Systems must be operative to the extent that applicable normal,

  abnormal, and emergency operating procedures included in the sponsor’s

  training programs can be accomplished.

  Levels 6 and 7 must simulate all applicable helicopter flight, navigation, and

  systems operation.

  Level 5 must have functional flight and navigational controls, displays, and

  instrumentation.

  4(a),5,6,7

  None


