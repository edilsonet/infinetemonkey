  Notes/Information

  Fire axes, landing gear pins, and any similar purpose instruments need only

  be represented in silhouette.

  2.

  Programming.

  See next

  None

  2.a.

  The FTD must provide the proper effect of aerodynamic changes for the

  combinations of drag and thrust normally encountered in flight. This must

  include the effect of change in helicopter attitude, thrust, drag, altitude,

  temperature, and configuration.

  Levels 6 and 7 additionally require the effects of changes in gross weight and

  center of gravity.

  Level 5 requires only generic aerodynamic programming. An SOC is

  required.

  5,6,7

  None

  2.b.

  The FTD must have the computer (analog or digital) capability (i.e.,

  capacity, accuracy, resolution, and dynamic response) needed to meet the

  qualification level sought.

  An SOC is required.

  4,5,6,7

  None

  2.c.

  Relative responses of the flight deck instruments must be measured by

  latency tests or transport delay tests, and may not exceed 150 milliseconds.

  The instruments must respond to abrupt input at the pilot’s position within

  the allotted time, but not before the time that the helicopter or set of

  helicopters respond under the same conditions.

  ● Latency: The FTD instrument and, if applicable, the motion system and the

  visual system response must not be prior to that time when the helicopter

  responds and may respond up to 150 milliseconds after that time under the

  same conditions.

  ● Transport Delay: As an alternative to the Latency requirement, a transport

  delay objective test may be used to demonstrate that the FTD system does

  5,6,7

  The intent is to verify that the FTD provides

  instrument cues that are, within the stated

  time delays, like the helicopter responses.

  For helicopter response, acceleration in the

  appropriate, corresponding rotational axis is

  preferred.


  Data da emissão: 20 de março de 2020.


