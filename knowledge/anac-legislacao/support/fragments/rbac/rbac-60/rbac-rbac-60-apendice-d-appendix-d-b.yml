  The airport and the helicopter landing area may be contained within the same

  visual model. If this option is selected, the approach path to the airport

  runway(s) and the approach path to the helicopter landing area must be

  different. The model(s) used to meet the following requirements may be

  demonstrated at either a fictional or a real-world airport or helicopter landing

  area.

  7.

  Sound System

  See next

  None

  7.a.

  The FTD must simulate significant flight deck sounds resulting from

  pilot actions that correspond to those heard in the helicopter.

  6,7

