title: apendice-e-appendix-e(a)
text: '(a) Each current sponsor of an FSTD must

  submit to the ANAC a proposed Quality

  Management System (QMS) program. The

  ANAC will notify the sponsor of the

  acceptability of the program, including any

  required adjustments. Within 6 months of the

  notification of acceptability, the sponsor must

  implement the program, conduct internal

  audits, make required program adjustments as

  a result of any internal audit, and schedule the

  ANAC initial audit..


  REQUISITOS PARA O SISTEMA DE

  GERENCIAMENTO DA QUALIDADE

  (QMS) PARA FSTD'
