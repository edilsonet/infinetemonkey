title: apendice-e-appendix-e(b)
text: '(b) First-time FSTD sponsors must submit

  to the ANAC the proposed QMS program no

  later than 120 days before the initial FSTD

  evaluation. The ANAC will notify the sponsor

  of the acceptability of the program, including

  any required adjustments. Within 6 months of

  the notification of acceptability, the sponsor

  must implement the program, conduct internal

  audits, make required program adjustments as

  a result of any internal audit, and schedule the

  ANAC initial audit.'
