title: apendice-e-appendix-e(c)
text: '(c) O diretor de operações de um detentor

  de certificado sob o RBAC 119, o instrutor

  chefe de um detentor de certificado sob o

  RBAC 141, ou o equivalente para um

  detentor sob o RBAC 142; deve designar um

  Representante do Operador (MR) que possua

  a autoridade para estabelecer e modificar as

  políticas, processos e procedimentos do

  programa de QMS para as qualificações

  recorrentes e o uso diário de cada FSTD.'
