title: apendice-e-appendix-e(d)
text: '(d)

  As

  políticas,

  processos

  ou

  procedimentos devem ser mantidos em um

  Manual de Qualidade, que servirá de base

  para:


  Data da emissão: 20 de março de 2020


  (1) The sponsor-conducted initial and

  recurring periodic assessments;

  (1) As auditorias inicial e periódicas

  conduzidas pelo operador;

  (2) The ANAC-conducted initial and

  recurring periodic assessments; and

  (2) As auditorias inicial e periódicas

  conduzidas pela ANAC;

  (3) The continuing surveillance and

  analysis by the ANAC of the sponsor''s

  performance and effectiveness in providing a

  satisfactory FSTD for use on a regular basis.

  (3) A vigilância continuada e o

  acompanhamento da ANAC acerca do

  desempenho e efetividade do operador em

  disponibilizar um FSTD satisfatório para uso

  frequente.'
