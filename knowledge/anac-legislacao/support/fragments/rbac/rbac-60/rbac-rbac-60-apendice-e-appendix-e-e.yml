title: apendice-e-appendix-e(e)
text: '(e) The sponsor must conduct assessments

  of its QMS program in segments. The

  segments will be established by the ANAC at

  the initial assessment, and the interval for the

  segment assessments will be every 6 months.

  The intervals for the segment assessments may

  be extended beyond 6 months as the QMS

  program matures, but will not be extended

  beyond 12 months. The entire QMS program

  must be assessed every 24 months.'
