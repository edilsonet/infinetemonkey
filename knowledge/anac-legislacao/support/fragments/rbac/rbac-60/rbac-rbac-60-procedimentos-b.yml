title: procedimentos(b)
text: '(b) Em caso de suspensão da qualificação

  do FSTD conforme o parágrafo (a) desta

  seção, a suspensão poderá ser revogada desde

  que uma das seguintes condições seja

  atendida:

  (1) the FSTD must successfully pass an

  evaluation as determined by ANAC; or


  (1) o FSTD deve ser aprovado em uma

  avaliação como determinado pela ANAC; ou

  (2) the ANAC advises the sponsor that an

  evaluation is not necessary.


  (2) a ANAC comunicar ao operador que

  uma avaliação não é necessária.'
