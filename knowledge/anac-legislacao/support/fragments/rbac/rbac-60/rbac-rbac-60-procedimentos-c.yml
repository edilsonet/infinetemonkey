text: '(c) In determining the criteria for the

  evaluation mentioned in paragraph (b)(1) of

  this section, the ANAC considers factors such

  as the number of continuing qualification

  evaluations missed, the number of sponsor-

  conducted quarterly inspections missed, the

  care that had been taken of the device since the

  last evaluation, among others.'
