text: '(a) Quando solicitado pela ANAC, o

  operador deve disponibilizar todos os

  equipamentos especiais e pessoal qualificado

  necessários para realizar ou auxiliar na

  realização dos testes durante a qualificação

  inicial, qualificação recorrente ou avaliações

  especiais do FSTD.'
