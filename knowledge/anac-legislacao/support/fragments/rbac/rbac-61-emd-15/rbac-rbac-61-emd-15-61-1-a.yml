title: 61.1(a)
text: (a) Este Regulamento estabelece as normas e procedimentos relativos à concessão de licenças,
  habilitações e certificados para pilotos; os requisitos e padrões mínimos que devem ser
  cumpridos para a concessão e manutenção ou restabelecimento da vigência desses documentos
  e as prerrogativas e limitações relativas a cada licença, habilitação ou certificado. (Redação
  dada pela Resolução nº 705, de 09.02.2023)
