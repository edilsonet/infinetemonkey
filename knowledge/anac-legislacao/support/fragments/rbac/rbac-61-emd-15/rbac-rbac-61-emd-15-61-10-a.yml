title: 61.10(a)
text: (a) Os requisitos estabelecidos nesta seção aplicam-se aos pilotos de avião, helicóptero,
  aeronave de decolagem vertical ou dirigível que pretendam operar uma aeronave civil brasileira
  fora da jurisdição do espaço aéreo brasileiro.
