section_title: Comunicações radiotelefônicas e proficiência linguística requerida para operações
  aéreas envolvendo aeronave civil brasileira fora da jurisdição do espaço aéreo brasileiro
subsection_id: f
cite: 61.10(f)
title: 61.10(f)
text: (f) Todas as licenças de pilotos brasileiros que forem emitidas, validadas ou quando
  as habilitações forem revalidadas terão averbadas a observação relativa à proficiência linguística
  do piloto na língua portuguesa (“Português Nível 6”).
