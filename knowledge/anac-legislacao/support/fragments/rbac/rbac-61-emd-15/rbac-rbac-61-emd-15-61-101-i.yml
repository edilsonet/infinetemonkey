section_title: Requisitos de experiência para a concessão da licença de piloto comercial
subsection_id: i
cite: 61.101(i)
title: 61.101(i)
text: '(i) um total de 200 (duzentas) horas de voo, ou 150 (cento e cinquenta) horas de voo,
  se estas foram efetuadas, em sua totalidade, durante a realização completa, ininterrupta
  e com aproveitamento de um curso de piloto comercial de avião aprovado pela ANAC. As horas
  totais devem incluir, pelo menos:

  (A) 100 (cem) horas de voo como piloto em comando, ou 70 (setenta) horas de voo como piloto
  em comando, se estas foram efetuadas, em sua totalidade, durante a realização completa,
  ininterrupta e com aproveitamento de um curso de piloto comercial de avião aprovado pela
  ANAC;

  (B) 20 (vinte) horas de voo de navegação como piloto em comando, que incluam um percurso
  de, no mínimo, 300 (trezentas) milhas náuticas, equivalentes a 540 (quinhentos e quarenta)
  quilômetros, durante o qual deve ter realizado aterrissagens completas em pelo menos 2 (dois)
  aeródromos diferentes;

  (C) 10 (dez) horas de instrução de voo por instrumentos, das quais no máximo 5 (cinco) horas
  podem ser substituídas por instrução realizada em dispositivo de treinamento por voo simulado
  qualificado e aprovado pela ANAC; e

  (D) 5 (cinco) horas de voo noturno em que sejam realizadas 5 (cinco) decolagens e 5 (cinco)
  aterrissagens como piloto em comando;

  (ii) o solicitante de licença de piloto comercial para a categoria avião pode ter reduzido
  o requisito de experiência nas seguintes condições:

  (A) se for titular de uma licença de piloto de planador, o total de horas pode incluir até
  30 (trinta) horas de voo em tais aeronaves que tenham sido realizadas em voo solo;

  (B) se for titular de uma licença de piloto privado de helicóptero ou aeronave de sustentação
  por potência, o total de horas pode incluir até 40 (quarenta) horas de voo em helicóptero
  ou aeronave de sustentação por potência;

  (C) se for titular de uma licença de piloto comercial ou de linha aérea de helicóptero ou
  aeronave de sustentação por potência, o total de horas pode incluir até 100 (cem) horas
  de voo em helicóptero ou aeronave de sustentação por potência; e

  (D) se tiver realizado instrução em dispositivo de treinamento por voo simulado aprovado
  pela ANAC, o total de horas pode incluir até 10 (dez) horas relativas a esta instrução;

  (2) categoria helicóptero:'
