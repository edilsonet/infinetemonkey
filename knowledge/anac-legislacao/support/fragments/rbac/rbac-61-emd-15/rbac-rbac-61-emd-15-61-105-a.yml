subsection_id: a
cite: 61.105(a)
title: 61.105(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, as prerrogativas
  do titular de uma licença de piloto comercial são:

  (1) exercer todas as prerrogativas do titular de uma licença de piloto privado da categoria
  de aeronave correspondente;

  (2) atuar como piloto em comando de aeronave não empregada em voos de serviço de transporte
  aéreo público;

  (3) atuar como piloto em comando em voos de serviços de transporte aéreo público, em uma
  aeronave certificada para operação com tripulação mínima de 1 (um) piloto;

  (4) atuar como segundo em comando em voos de serviços de transporte aéreo público em uma
  aeronave certificada para operação com tripulação mínima de 2 (dois) pilotos; e

  (5) para a categoria de dirigíveis, pilotar a aeronave em voos por instrumentos.'
