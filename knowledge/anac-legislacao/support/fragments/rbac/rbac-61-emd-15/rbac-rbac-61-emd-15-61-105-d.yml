subsection_id: d
cite: 61.105(d)
title: 61.105(d)
text: '(d) Nenhum titular de licença de piloto comercial pode atuar como piloto em operações
  internacionais de serviços de transporte aéreo público após ter completado 60 (sessenta)
  anos de idade ou, no caso de operações com mais de um piloto, 65 (sessenta e cinco) anos
  de idade. (Redação dada pela Resolução nº 378, de 18.03.2016)


  SUBPARTE F

  LICENÇA DE PILOTO DE TRIPULAÇÃO MÚLTIPLA'
