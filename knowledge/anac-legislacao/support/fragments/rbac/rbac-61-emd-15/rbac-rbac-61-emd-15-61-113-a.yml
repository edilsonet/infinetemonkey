section_title: Requisitos gerais para a concessão da licença de piloto de tripulação múltipla
subsection_id: a
cite: 61.113(a)
title: 61.113(a)
text: '(a) O candidato a uma licença de piloto de tripulação múltipla deve:

  (1) ter completado 18 (dezoito) anos; e

  (2) ter concluído o ensino médio.'
