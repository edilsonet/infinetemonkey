section_title: Requisitos de instrução de voo para a concessão da licença de piloto de tripulação
  múltipla
subsection_id: e
cite: 61.119(e)
title: 61.119(e)
text: (e) Cada fase de instrução para a concessão da licença de piloto de tripulação múltipla
  deve abranger o ensino dos conhecimentos básicos e parte da instrução prática, integrando-se
  plenamente a esta, o ensino dos requisitos e manobras necessárias para aprovação no exame
  de proficiência contidos na seção 61.123 deste Regulamento, como detalhado no Apêndice B
  deste Regulamento.
