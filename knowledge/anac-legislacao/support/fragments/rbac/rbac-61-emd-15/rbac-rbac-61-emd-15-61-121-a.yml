cite: 61.121(a)
title: 61.121(a)
text: '(a) O candidato a uma licença de piloto de tripulação múltipla deve:

  (1) ter realizado, no mínimo, 240 (duzentas e quarenta) horas de voo real e simulado, em
  um curso de piloto de tripulação múltipla aprovado pela ANAC;

  (2) ter cumprido, como parte da experiência em voo real, no mínimo, os requisitos de experiência
  para a concessão da licença de piloto privado na categoria avião constantes do parágrafo
  61.81(a) deste Regulamento; e

  (3) ter adquirido experiência necessária para alcançar o nível avançado de competência requerido:'
