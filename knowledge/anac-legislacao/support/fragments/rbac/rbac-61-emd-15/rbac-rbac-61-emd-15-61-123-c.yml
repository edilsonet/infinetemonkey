cite: 61.123(c)
title: 61.123(c)
text: (c) A ANAC exercerá vigilância permanente durante a fase inicial de implantação da licença
  de tripulação múltipla, devendo existir uma estreita coordenação e cooperação entre a ANAC,
  os centros de instrução e treinamento e as empresas de transporte aéreo que contratarem
  titulares deste tipo de licença.
