subsection_id: a
cite: 61.125(a)
title: 61.125(a)
text: (a) As prerrogativas e condições para o exercício das funções mencionadas no parágrafo
  61.111(a) deste Regulamento referem-se ao piloto devidamente qualificado para exercer a
  função de segundo em comando em um avião certificado para operação com tripulação mínima
  de 2 (dois) pilotos, e com vínculo empregatício com a empresa que o treinou na função de
  piloto de tripulação múltipla.
