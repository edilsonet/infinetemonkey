section_title: Prerrogativas do titular da licença de piloto de tripulação múltipla e condições
  que devem ser observadas para exercê-las
subsection_id: b
cite: 61.125(b)
title: 61.125(b)
text: '(b) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, as prerrogativas
  do titular de uma licença de piloto de tripulação múltipla são:

  (1) exercer as atribuições da habilitação de voo por instrumentos em operações com tripulação
  múltipla; e

  (2) atuar como segundo em comando em um avião certificado para operação com tripulação mínima
  de 2 (dois) pilotos, de acordo com a habilitação de tipo averbada em sua licença.'
