title: 61.125(c)
text: (c) O exercício das prerrogativas da licença de piloto de tripulação múltipla em voos
  internacionais é condicionado ao atendimento, pelo seu titular, aos requisitos estabelecidos
  na seção 61.10 deste Regulamento.
