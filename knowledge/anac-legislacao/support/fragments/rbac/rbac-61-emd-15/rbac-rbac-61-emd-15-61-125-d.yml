subsection_id: d
cite: 61.125(d)
title: 61.125(d)
text: '(d) Nenhum titular de licença de piloto de tripulação múltipla pode atuar como segundo
  em comando, em operações internacionais de serviços de transporte aéreo público, regulares
  ou não, após ter completado 65 (sessenta e cinco) anos de idade.


  SUBPARTE G

  LICENÇA DE PILOTO DE LINHA AÉREA'
