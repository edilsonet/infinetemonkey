cite: 61.13(b)
title: 61.13(b)
text: (b) O solicitante que reúna os requisitos estabelecidos neste Regulamento faz jus a
  uma licença/certificado apropriado com suas correspondentes habilitações, desde que não
  conste em seu nome débitos com a ANAC decorrentes de multas, inscritos na Dívida Ativa da
  União.
