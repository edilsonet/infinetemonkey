section_title: Solicitação de licenças, certificados e/ou habilitações
subsection_id: c
cite: 61.13(c)
title: 61.13(c)
text: (c) O titular de uma licença/certificado expedido em conformidade com este Regulamento,
  que tenha tido essa licença/certificado cassado, somente pode requerer nova licença/certificado
  após decorridos pelo menos 2 (dois) anos da data do ato administrativo que determinou a
  cassação do documento, e desde que fique comprovado que os motivos que levaram à cassação
  não mais existam ou não produzam mais efeito.
