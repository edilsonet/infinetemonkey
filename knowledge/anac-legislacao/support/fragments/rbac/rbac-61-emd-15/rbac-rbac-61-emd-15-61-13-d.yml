cite: 61.13(d)
title: 61.13(d)
text: (d) O titular de uma licença/certificado expedido em conformidade com este Regulamento,
  com habilitações suspensas, não pode requerer qualquer outra licença, certificado, habilitação
  ou averbação de qualificação enquanto vigorar alguma suspensão.
