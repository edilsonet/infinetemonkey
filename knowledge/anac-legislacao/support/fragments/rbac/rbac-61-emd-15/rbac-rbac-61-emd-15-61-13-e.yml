section_title: Solicitação de licenças, certificados e/ou habilitações
subsection_id: e
cite: 61.13(e)
title: 61.13(e)
text: (e) O solicitante de uma licença ou certificado que tenha atendido a todos os requisitos
  deste regulamento, inclusive aprovação no exame de proficiência, fará jus a emissão de uma
  licença/certificado provisório válida por um período de 90 (noventa) dias a partir da data
  da sua emissão. A emissão da licença/certificado provisório será automaticamente revogada
  se for constatada alguma irregularidade.
