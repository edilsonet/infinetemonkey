cite: 61.139(b)
title: 61.139(b)
text: (b) O candidato a uma licença de piloto de linha aérea na categoria helicóptero deve
  ter recebido a instrução exigida para a concessão da licença de piloto comercial na categoria
  helicóptero, conforme estabelecido no parágrafo 61.99(a)(2) deste Regulamento.
