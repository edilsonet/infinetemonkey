subsection_id: c
cite: 61.139(c)
title: 61.139(c)
text: (c) O candidato a uma licença de piloto de linha aérea na categoria de aeronave de sustentação
  por potência deve ter recebido a instrução duplo comando exigida para a concessão da licença
  de piloto comercial na categoria aeronave de sustentação por potência (parágrafo 61.99(a)(3)
  deste Regulamento) e da habilitação de voo por instrumentos na categoria aeronave de sustentação
  por potência (parágrafo 61.223(a)(5) deste Regulamento).
