subsection_id: d
cite: 61.139(d)
title: 61.139(d)
text: (d) O candidato a uma licença de piloto de linha aérea para qualquer categoria de aeronave
  deve, ainda, ter atendido aos requisitos estabelecidos neste Regulamento para a concessão
  ou revalidação da habilitação relativa à aeronave em que seja realizado o exame de proficiência.
  (Redação dada pela Resolução nº 378, de 18.03.2016)
