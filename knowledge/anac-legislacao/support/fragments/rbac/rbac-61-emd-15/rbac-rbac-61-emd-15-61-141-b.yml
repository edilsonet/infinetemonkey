section_title: Requisitos de experiência para a concessão da licença de piloto de linha aérea
subsection_id: b
cite: 61.141(b)
title: 61.141(b)
text: (b) O candidato a uma licença de piloto de linha aérea para uma determinada categoria
  de aeronave que já seja titular de licença de piloto comercial ou piloto de linha aérea
  em outra categoria distinta pode ter reduzido o requisito de experiência de horas totais.
  O total de horas pode incluir até 500 (quinhentas) horas realizadas em uma ou duas categorias
  de aeronave diferentes daquela para qual é requerida a licença de piloto de linha aérea.
