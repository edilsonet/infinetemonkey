section_title: Requisitos de experiência para a concessão da licença de piloto de linha aérea
subsection_id: c
cite: 61.141(c)
title: 61.141(c)
text: (c) O candidato a uma licença de piloto de linha aérea para uma determinada categoria
  de aeronave pode ter reduzido o requisito de experiência se tiver realizado treinamento
  supervisionado em dispositivo de treinamento para simulação de voo qualificado e aprovado
  pela ANAC referente a essa categoria. O total de horas pode incluir até 100 (cem) horas
  relativas a este treinamento, desde que pelo menos 75 (setenta e cinco) horas tenham sido
  realizadas em simulador de voo.
