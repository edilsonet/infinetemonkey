section_title: Requisitos de experiência para a concessão da licença de piloto de linha aérea
subsection_id: i
cite: 61.141(i)
title: 61.141(i)
text: '(i) um total de 1.500 (mil e quinhentas) horas de voo que incluam, pelo menos:

  (A) 500 (quinhentas) horas de voo como piloto em comando sob supervisão; ou 250 (duzentas
  e cinquenta) horas de voo como piloto em comando; ou 250 (duzentas e cinquenta) horas de
  voo das quais um mínimo de 70 (setenta) horas de voo como piloto em comando, mais o tempo
  de voo adicional necessário como piloto em comando sob supervisão; (Redação dada pela Resolução
  nº 344, de 17.09.2014.)

  (B) 200 (duzentas) horas de voo de navegação, das quais no mínimo 100 (cem) horas de voo
  como piloto em comando ou como piloto em comando sob supervisão;

  (C) 75 (setenta e cinco) horas de voo por instrumentos, das quais um máximo de 30 (trinta)
  horas de voo podem ser realizadas em dispositivo de treinamento para simulação de voo qualificado
  e aprovado pela ANAC; e

  (D) 100 (cem) horas de voo noturno;

  (2) categoria helicóptero:'
