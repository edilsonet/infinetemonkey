section_title: Requisitos de proficiência para a concessão da licença de piloto de linha aérea
subsection_id: a
cite: 61.143(a)
title: 61.143(a)
text: '(a) O candidato a uma licença de piloto de linha aérea deve demonstrar, em exame de
  proficiência, sua capacidade para executar, como piloto em comando de aeronave da categoria
  para a qual é solicitada a licença, os procedimentos e manobras especificados no parágrafo
  relativo à instrução de voo pertinente, com um grau de competência apropriado às prerrogativas
  que a licença de piloto de linha aérea confere ao seu titular, e para executar:

  (1) os procedimentos antes do voo, que incluam a preparação do plano de voo operacional
  e a apresentação do plano de voo aos órgãos de controle de tráfego aéreo;

  (2) a coordenação com o despacho operacional de voo;

  (3) os procedimentos e manobras normais de voo em todas as suas fases;

  (4) os procedimentos e manobras anormais e de emergência relativos a falhas e irregularidades
  dos equipamentos, como grupo motopropulsor, sistemas e células;

  (5) os procedimentos relacionados à incapacitação e coordenação da tripulação, incluindo
  atribuição de tarefas do piloto, cooperação da tripulação e utilização de listas de verificação;
  e

  (6) quando se tratar de licença para categoria avião ou aeronave de sustentação por potência,
  procedimentos e manobras para operações de voo por instrumentos em condições normais, anormais
  e de emergência, que incluam falha simulada de motor e que envolvam pelo menos o seguinte:'
