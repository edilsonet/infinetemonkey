section_title: Requisitos de proficiência para a concessão da licença de piloto de linha aérea
subsection_id: b
cite: 61.143(b)
title: 61.143(b)
text: '(b) O candidato a uma licença de piloto de linha aérea deve também demonstrar sua capacidade
  para executar os procedimentos e manobras especificados nesta seção com um grau de competência
  apropriado às prerrogativas que a licença de piloto de linha aérea confere ao seu titular
  e para:

  (1) reconhecer e gerenciar ameaças e erros;

  (2) operar a aeronave dentro de suas limitações de emprego;

  (3) executar todas as manobras com suavidade e precisão;

  (4) revelar bom julgamento e aptidão de pilotagem;

  (5) aplicar os conhecimentos aeronáuticos;

  (6) manter controle da aeronave durante todo o tempo do voo, de modo que não ocorram dúvidas
  quanto ao êxito de algum procedimento ou manobra;

  (7) compreender e aplicar os procedimentos relativos à coordenação da tripulação, assim
  como em caso de incapacitação de tripulante;

  (8) pilotar a aeronave no modo de automatização apropriado à fase de voo e manter-se consciente
  do modo ativo de automatização;

  (9) executar de forma precisa, procedimentos normais, anormais e de emergência em todas
  as fases do voo;

  (10) demonstrar bom julgamento e aptidão para tomar decisões estruturadas e manutenção da
  consciência situacional; e

  (11) comunicar-se de forma eficaz com todos os demais membros da tripulação de voo e demonstrar
  a capacidade de executar de forma eficaz os procedimentos em caso de incapacitação da tripulação,
  coordenar-se com a tripulação, aderir aos procedimentos normais de operação (Manual Geral
  de Operações - MGO) e usar as listas de verificações.'
