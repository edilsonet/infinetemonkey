text: '(i) a 6 (seis) meses; ou

  (ii) às vigências ou validades das licenças e certificados estrangeiros originais; ou (Redação
  dada pela Resolução nº 705, de 09.02.2023)

  (iii) à validade do visto de estadia no País; ou

  (iv) ao contrato de trabalho do piloto no País, quando aplicável.

  (4) fabricantes de produtos aeronáuticos, para voos de certificação, demonstração técnica
  ou demonstração comercial, nos quais seja necessária a manipulação dos comandos por piloto
  não habilitado na aeronave. Nesse caso:'
