section_title: Requisitos gerais para a concessão da licença de piloto de planador
subsection_id: a
cite: 61.153(a)
title: 61.153(a)
text: '(a) O candidato a uma licença de piloto de planador deve:

  (1) ter completado 16 (dezesseis) anos; e

  (2) ter concluído o ensino fundamental.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
