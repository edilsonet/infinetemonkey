section_title: Requisitos de instrução de voo para a concessão da licença de piloto de planador
subsection_id: a
cite: 61.159(a)
title: 61.159(a)
text: '(a) O candidato a uma licença de piloto de planador deve ter recebido instrução de
  um instrutor de voo devidamente habilitado de uma associação credenciada segundo o RBAC
  nº 183 ou em um CIAC certificado pela ANAC. Ao término da instrução, o instrutor de voo
  é responsável por endossar a CIV Digital do aluno, declarando que este é competente para
  realizar, de forma segura, todas as manobras necessárias para ser aprovado no exame de proficiência
  para a concessão da licença de piloto de planador. Tal declaração terá validade de 30 (trinta)
  dias, a partir da data do último voo de preparação para o exame de proficiência. O conteúdo
  da instrução de voo deve ser, no mínimo, o seguinte: (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (1) reconhecimento e gerenciamento de ameaças e erros;

  (2) procedimentos anteriores ao voo, incluindo montagem e inspeções;

  (3) técnicas e procedimentos para reboque, lançamento e ascensão, incluindo limitações apropriadas
  de velocidade, procedimentos de emergência e sinais usados;

  (4) operações de tráfego padrão, procedimentos e precauções para evitar colisões;

  (5) controle do planador utilizando referências visuais externas;

  (6) operações dentro das limitações do planador;

  (7) reconhecimento e recuperação de início de estol e estol completo, assim como picadas
  em espiral;

  (8) reboques normais e com vento de través, aproximações e aterrissagens;

  (9) voo de navegação por referências visuais e navegação estimada; e

  (10) procedimentos de emergência.'
