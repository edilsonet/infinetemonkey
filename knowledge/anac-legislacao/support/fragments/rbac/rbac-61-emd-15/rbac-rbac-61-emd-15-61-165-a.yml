subsection_id: a
cite: 61.165(a)
title: 61.165(a)
text: (a) O titular de uma licença de piloto de planador tem a prerrogativa de atuar como
  piloto em comando de qualquer planador, desde que possua experiência operacional no método
  de lançamento utilizado.
