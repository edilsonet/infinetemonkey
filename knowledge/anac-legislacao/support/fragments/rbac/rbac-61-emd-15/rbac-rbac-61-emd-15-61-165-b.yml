title: 61.165(b)
text: '(b) O titular de uma licença de piloto de planador menor de 18 (dezoito) anos não pode
  operar sobre áreas densamente povoadas.

  (Redação dada pela Resolução nº 475, de 07.06.2018)

  SUBPARTE I

  LICENÇA DE PILOTO DE BALÃO LIVRE'
