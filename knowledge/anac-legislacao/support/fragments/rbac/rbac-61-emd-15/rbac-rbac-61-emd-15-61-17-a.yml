section_title: Vigência das licenças de piloto e CPA
subsection_id: a
cite: 61.17(a)
title: 61.17(a)
text: '(a) A licença de piloto e o CPA são permanentes, com exceção da licença de aluno piloto,
  que perde sua validade quando o aluno piloto se desvincula da instituição de ensino de aviação
  civil na qual estava matriculado ou depois de decorridos 24 (vinte e quatro) meses da data
  de sua concessão. As prerrogativas que são conferidas a seu titular somente poderão ser
  exercidas quando atendidos os seguintes requisitos:

  (1) estar com o CMA válido e adequado à licença/certificado de que é titular;

  (2) estar com as habilitações correspondentes vigentes; e (Redação dada pela Resolução nº
  705, de 09.02.2023)

  (3) possuir experiência recente correspondente à licença ou ao certificado, conforme previsto
  na seção 61.21 deste Regulamento.'
