section_title: Vigência das licenças de piloto e CPA
subsection_id: b
cite: 61.17(b)
title: 61.17(b)
text: '(b) As prerrogativas da licença não poderão ser exercidas se:

  (1) estiverem restritas por razões de idade limite, de acordo com os requisitos estabelecidos
  por este Regulamento; ou

  (2) o titular tiver renunciado à licença/certificado ou esta se encontre cassada, suspensa
  ou cancelada pela ANAC; ou

  (3) o CMA correspondente estiver vencido.

  (Seção com redação dada pela Resolução nº 475, de 07.06.2018)'
