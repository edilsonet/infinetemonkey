title: 61.177(a)
text: '(a) O candidato a uma licença de piloto de balão livre deve ter sido aprovado em exame
  teórico da ANAC ou aprovado pela ANAC, para a licença de piloto de balão livre.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
