section_title: Requisitos de instrução de voo para a concessão da licença de piloto de balão
  livre
subsection_id: a
cite: 61.179(a)
title: 61.179(a)
text: '(a) O candidato a uma licença de piloto de balão livre deve ter recebido instrução
  de um instrutor de voo devidamente habilitado de uma associação credenciada segundo o RBAC
  nº 183 ou em CIAC certificado pela ANAC. Ao término da instrução, o instrutor de voo é responsável
  por endossar a CIV Digital do aluno, declarando que este é competente para realizar, de
  forma segura, todas as manobras necessárias para ser aprovado no exame de proficiência para
  a concessão da licença de piloto de balão livre. Tal declaração terá validade de 30 (trinta)
  dias, a partir da data do último voo de preparação para o exame de proficiência. O conteúdo
  da instrução de voo deve ser, no mínimo, o seguinte: (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (1) reconhecimento e gerenciamento de ameaças e erros;

  (2) procedimentos anteriores ao voo, incluindo montagem, armação, inflação, amarração e
  inspeções;

  (3) técnicas e procedimentos para reboque, lançamento e ascensão, incluindo limitações apropriadas,
  procedimentos de emergência e sinais usados;

  (4) operações e procedimentos para evitar colisões;

  (5) controle do balão livre utilizando referências visuais externas;

  (6) reconhecimento e recuperação de descidas rápidas;

  (7) voo de navegação por referências visuais e navegação estimada;

  (8) aproximações e aterrissagens, incluindo manobras em terra; e

  (9) procedimentos de emergência.'
