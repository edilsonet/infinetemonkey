section_title: Requisitos de experiência para a concessão da licença de piloto de balão livre
subsection_id: i
cite: 61.181(i)
title: 61.181(i)
text: '(i) 1 (uma) ascensão deve ter atingido a altura de 3.000 (três mil) pés; e

  (ii) 60 (sessenta) minutos de voo solo, podendo ser realizado em 1 (uma) ascensão ou em
  2 (duas) ascensões, com duração mínima de 30 (trinta) minutos cada uma. (Redação dada pela
  Resolução nº 705, de 09.02.2023)'
