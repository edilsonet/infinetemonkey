subsection_id: a
cite: 61.185(a)
title: 61.185(a)
text: (a) O titular de uma licença de piloto de balão livre tem a prerrogativa de atuar como
  piloto em comando de qualquer balão livre, desde que possua experiência operacional no tipo
  de balão utilizado.
