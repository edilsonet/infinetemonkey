section_title: Vigência das habilitações de piloto
subsection_id: a
cite: 61.19(a)
title: 61.19(a)
text: (a) A vigência das habilitações averbadas nas licenças ou certificados de piloto se
  mantém pelo cumprimento e submissão, na forma definida pela ANAC, dos requisitos de treinamento,
  realização de exames de proficiência e experiência recente constantes desse RBAC 61 e da
  validade dos Certificados Médicos Aeronáuticos, conforme estabelecido no RBAC 67.
