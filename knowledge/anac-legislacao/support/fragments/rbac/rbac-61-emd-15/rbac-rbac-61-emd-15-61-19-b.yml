section_title: Vigência das habilitações de piloto
subsection_id: b
cite: 61.19(b)
title: 61.19(b)
text: '(b) Os requisitos de treinamento e realização de exames de proficiência devem ser comprovados
  nos seguintes prazos máximos, contados a partir do mês de aprovação do piloto no último
  exame de proficiência, a exceção do previsto no parágrafo 61.33 (a) deste Regulamento:

  (1) habilitação de classe: 24 (vinte e quatro) meses, com exceção das habilitações relativas
  ao CPA, que terão vigência de 36 (trinta e seis) meses;

  (2) habilitação de tipo: 12 (doze) meses;

  (3) habilitação de voo por instrumentos: 12 (doze) meses;

  (4) habilitação de instrutor de voo: 12 (doze) meses, com exceção das habilitações relativas
  a instrutor de voo de balão livre e planador, que terão validade de 36 (trinta e seis) meses;

  (5) habilitação de piloto agrícola: 24 (vinte e quatro) meses.

  (6) habilitação de planador: 36 (trinta e seis) meses;

  (7) habilitação de balão livre: 36 (trinta e seis) meses; e

  (8) habilitação de dirigível: 12 (doze) meses.

  (Seção com redação dada pela Resolução nº 705, de 09.02.2023)'
