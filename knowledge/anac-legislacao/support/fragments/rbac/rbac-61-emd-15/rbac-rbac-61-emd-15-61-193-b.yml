cite: 61.193(b)
title: 61.193(b)
text: '(b) Manutenção ou restabelecimento de vigência da habilitação de categoria: (Redação
  dada pela Resolução nº 705, de 09.02.2023)

  (1) o titular de uma licença de piloto de avião, helicóptero ou aeronave de sustentação
  por potência manterá a vigência de sua habilitação de categoria mantendo a vigência de ao
  menos uma habilitação de classe ou de tipo correspondente à categoria de aeronaves da licença
  da qual seja titular; (Redação dada pela Resolução nº 705, de 09.02.2023)

  (2) o titular de uma licença de planador, balão livre ou dirigível pode manter a vigência
  das respectivas habilitações de categoria antes do final do prazo de vigência estabelecido
  na seção 61.19 deste Regulamento, considerando a tolerância estabelecida na seção 61.33
  deste Regulamento, se: (Redação dada pela Resolução nº 705, de 09.02.2023)'
