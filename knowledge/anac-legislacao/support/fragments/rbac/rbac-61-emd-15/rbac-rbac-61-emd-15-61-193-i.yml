section_title: Concessão e manutenção ou restabelecimento de vigência de habilitação de categoria
subsection_id: i
cite: 61.193(i)
title: 61.193(i)
text: '(i) comprovar ter realizado durante o prazo de vigência da habilitação, pelo menos,
  12 (doze) horas de voo em aeronave da categoria pertinente, das quais, pelo menos, 2 (duas)
  horas devem ter sido realizadas em voo de navegação; e (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (ii) cumprir os requisitos de experiência recente pertinentes estabelecidos na seção 61.21
  deste Regulamento; (Redação dada pela Resolução nº 705, de 09.02.2023)

  (3) para restabelecer a vigência da habilitação de categoria após expirados o prazo e a
  tolerância estabelecida na seção 61.33 deste Regulamento, o titular de uma licença de planador,
  balão livre ou dirigível deve ser aprovado em exame de proficiência na categoria apropriada.
  (Redação dada pela Resolução nº 705, de 09.02.2023)

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
