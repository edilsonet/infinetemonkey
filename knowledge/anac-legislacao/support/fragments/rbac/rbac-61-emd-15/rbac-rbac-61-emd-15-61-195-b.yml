cite: 61.195(b)
title: 61.195(b)
text: '(b) O solicitante que desejar incluir outra habilitação de classe em sua licença deverá:

  (1) demonstrar os conhecimentos necessários para a operação segura da aeronave pertinente
  na função de piloto em comando;

  (2) demonstrar ter recebido de um instrutor devidamente habilitado e qualificado a instrução
  de voo apropriada para a habilitação; e

  (3) ser aprovado em exame de proficiência apropriado à sua licença de piloto e aplicável
  à habilitação de classe solicitada.'
