cite: 61.197(a)
title: 61.197(a)
text: '(a) Para restabelecer a vigência da habilitação de classe, seu titular deve ser aprovado
  em exame de proficiência em aeronave da classe pertinente.

  (1) O restabelecimento de vigência se aplica nos casos previstos no parágrafo 61.33(d) desse
  Regulamento.'
