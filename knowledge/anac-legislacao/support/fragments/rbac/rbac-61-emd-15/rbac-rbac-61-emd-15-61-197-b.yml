section_title: Restabelecimento de vigência de habilitação de classe
subsection_id: b
cite: 61.197(b)
title: 61.197(b)
text: '(b) Caso haja mais de uma habilitação de classe averbada na mesma licença:

  (1) a vigência da habilitação de classe avião multimotor terrestre mantém vigente a habilitação
  de classe avião monomotor terrestre;

  (2) a vigência da habilitação de classe avião multimotor anfíbio mantém vigente a habilitação
  de classe avião monomotor anfíbio; e

  (3) a vigência da habilitação de classe helicóptero multimotor mantém vigente as habilitações
  de classe helicóptero monomotor a turbina e helicóptero monomotor convencional.

  (Redação dada pela Resolução nº 705, de 09.02.2023)'
