section_title: Prerrogativas e limitações do titular de habilitação de categoria e de classe
subsection_id: b
cite: 61.199(b)
title: 61.199(b)
text: '(b) O titular de uma habilitação de categoria ou classe pode exercer suas prerrogativas
  em todos os modelos de aeronave pertencentes à categoria ou classe em que esteja habilitado.

  (1) Não obstante o previsto no caput, a ANAC pode estabelecer, por meio de Instrução Suplementar,
  a exigência de treinamento mínimo e endosso na CIV para operar modelos específicos de aeronave.
  Nestes casos, o exercício das prerrogativas do titular de uma habilitação de categoria ou
  classe fica condicionado à prévia conclusão do treinamento e obtenção do endosso.

  (2) [Reservado] (Redação dada pela Resolução nº 705, de 09.02.2023)'
