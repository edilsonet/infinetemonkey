title: 61.2(a)
text: '(a) Para os propósitos deste Regulamento, além das definições aplicáveis contidas na
  seção 01.1 do RBAC 01, os termos, expressões e siglas apresentadas a seguir têm os seguintes
  significados:

  (1) Acidente aeronáutico significa toda ocorrência que seja caracterizada como tal pela
  autoridade de investigação SIPAER.

  (2) Autorização significa ato administrativo discricionário e precário mediante o qual a
  ANAC faculta ao regulado, em casos concretos, o exercício de suas atividades.

  (3) [Reservado] (Redação dada pela Resolução nº 705, de 09.02.2023)

  (4) Caderneta Individual de Voo Digital - CIV Digital significa documento legal em meio
  eletrônico, disponibilizado pela ANAC e disciplinado em Instrução Suplementar específica,
  para verificação da experiência, comprovação e certificação de horas de voo e endossos do
  piloto aerodesportivo, piloto privado, piloto comercial, piloto de linha aérea, piloto de
  planador ou piloto de balão livre operando aeronaves. (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (5) Centro de Instrução de Aviação Civil - CIAC significa organização certificada cuja finalidade
  é formar recursos humanos para aviação civil, conduzindo seus alunos para a obtenção das
  licenças e habilitações requeridas pela ANAC. Para o início de suas atividades deve ser
  detentora de um certificado de CIAC, obtido através de um processo de certificação, com
  uma sede administrativa e base operacional e ter curso(s) aprovado(s) pela ANAC.

  (6) Centro de Treinamento de Aviação Civil - CTAC significa uma organização certificada
  de acordo com o RBAC 142.

  (7) Certificado de Piloto Aerodesportivo - CPA significa o documento comprobatório, com
  status inferior ao de uma licença, que comprova que o titular satisfaz os requisitos para
  operar uma aeronave aerodesportiva, conforme definição do RBAC nº 01, com peso máximo de
  decolagem de até 750 kg, exceto balões e planadores, com as limitações e prerrogativas estabelecidas
  para o referido certificado. (Redação dada pela Resolução nº 475, de 07.06.2018)

  (8) [reservado]. (Redação dada pela Resolução nº 547, de 19.03.2020)

  (9) Código ANAC - CANAC significa o número único, composto de 6 dígitos, que identifica
  o aspirante ou titular de uma licença ou certificado emitido pela ANAC. (Redação dada pela
  Resolução nº 705, de 09.02.2023)

  (10) Dispositivo de Treinamento para Simulação de Voo (Flight Simulation Training Device
  - FSTD) significa qualquer equipamento no qual as condições de voo podem ser simuladas no
  solo e que esteja qualificado pela ANAC como abaixo:'
