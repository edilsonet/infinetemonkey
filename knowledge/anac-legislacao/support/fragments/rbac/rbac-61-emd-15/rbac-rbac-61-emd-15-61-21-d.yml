cite: 61.21(d)
title: 61.21(d)
text: '(d) No caso de piloto rebocador de planador e piloto lançador de paraquedista, caso
  o piloto não tenha realizado pelo menos uma dessas operações (conforme aplicável) dentro
  dos últimos 90 dias, ele deverá realizar uma operação acompanhada de um instrutor de voo
  habilitado.

  (Seção com redação dada pela Resolução nº 475, de 07.06.2018)'
