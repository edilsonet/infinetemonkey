cite: 61.211(a)
title: 61.211(a)
text: (a) Esta subparte estabelece os requisitos a serem atendidos para a concessão e revalidação
  de habilitação de tipo para pilotos de avião, helicóptero, dirigível e aeronave de sustentação
  por potência, assim como as prerrogativas e condições para o exercício das funções inerentes
  a essa habilitação de tipo.
