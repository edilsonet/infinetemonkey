section_title: Manutenção ou restabelecimento de vigência de habilitação de tipo
subsection_id: a
cite: 61.215(a)
title: 61.215(a)
text: '(a) Para manter ou restabelecer a vigência da habilitação de tipo, o requerente deve:
  (Redação dada pela Resolução nº 705, de 09.02.2023)

  (1) ter concluído, com aproveitamento, nos 6 (seis) meses anteriores ao exame de proficiência,
  treinamento de solo e de voo referente ao tipo da aeronave requerida; e (Redação dada pela
  Resolução nº 705, de 09.02.2023)

  (2) ser aprovado em exame de proficiência realizado em conformidade com o parágrafo 61.213(a)(4)
  deste Regulamento;'
