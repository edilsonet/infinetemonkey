section_title: Prerrogativas e limitações do titular de uma habilitação de tipo
subsection_id: b
cite: 61.217(b)
title: 61.217(b)
text: (b) Quando tratar-se de habilitação de tipo que possua mais de um modelo ou configuração
  de aeronave correspondente, as prerrogativas do titular da habilitação de tipo limitam-se
  apenas ao modelo ou configuração da aeronave na qual tenha sido realizado o exame de proficiência.
  Para estar qualificado a operar outro modelo ou configuração de aeronave pertencente à mesma
  habilitação de tipo, o titular da habilitação deverá ter recebido o treinamento de diferenças
  ou de familiarização, conforme aplicável. O treinamento de diferenças deve ser realizado
  em CTAC certificado ou validado pela ANAC ou, caso este não exista, ministrado por um PC
  ou PLA qualificado no modelo ou configuração. Já o treinamento de familiarização consiste
  na leitura de material técnico que aborde as diferenças entre os modelos ou configurações
  de aeronave, não sendo necessária a obtenção de endosso ou certificado adicional. (Redação
  dada pela Resolução nº 740, de 16.04.2024)
