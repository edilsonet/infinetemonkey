cite: 61.217(c)
title: 61.217(c)
text: '(c) As prerrogativas do titular da habilitação de tipo deixam de existir após decorrido
  o período de vigência da habilitação relacionada, considerando-se o prazo de tolerância
  estabelecido na seção 61.33 deste Regulamento. (Redação dada pela Resolução nº 705, de 09.02.2023)

  (Seção com redação dada pela Resolução nº 378, de 18.03.2016)'
