cite: 61.218(a)
title: 61.218(a)
text: (a) Para os aeronautas que vierem a desempenhar, exclusivamente, a função a bordo de
  piloto segundo em comando, será emitida habilitação de tipo restringindo a atuação do aeronauta
  requerente.
