section_title: Qualificações para habilitação de tipo exclusivamente para a função de piloto
  segundo em comando
subsection_id: i
cite: 61.218(i)
title: 61.218(i)
text: '(i) o candidato a uma habilitação de tipo com restrição para a função a bordo de piloto
  segundo em comando, deve comprovar ter concluído com aproveitamento, nos 6 (seis) meses
  anteriores ao exame de proficiência, o treinamento de voo para o tipo de aeronave em que
  pretenda obter a habilitação;

  (ii) o treinamento de voo aplicável à função de segundo em comando deve ser conduzido em
  um CTAC, de acordo com um programa de treinamento aprovado pela ANAC;

  (A) caso sejam utilizados dispositivos de treinamento para simulação de voo (FSTD), tais
  dispositivos devem estar qualificados ou validados pela ANAC;

  (iii) caso não exista, até a data em que o candidato iniciar o treinamento de voo, CTAC
  certificado ou validado pela ANAC para ministrá-lo, o treinamento de voo poderá ser ministrado
  por um PC ou PLA habilitado e qualificado na aeronave, que deve endossar esse treinamento
  na CIV Digital do candidato, observando-se currículo mínimo estabelecido pela ANAC, incluindo,
  no mínimo:

  (A) 10 (dez) horas de voo para aviões a reação e 6 (seis) horas de voo para aviões turboélice
  ou convencionais;

  (B) 4 (quatro) horas de voo para helicópteros com peso máximo de decolagem até 9071 kg (20000
  lbs); ou

  (C) 5 (cinco) horas de voo para helicópteros com peso máximo de decolagem acima de 9071
  kg (20000 lbs).

  (4) proficiência:'
