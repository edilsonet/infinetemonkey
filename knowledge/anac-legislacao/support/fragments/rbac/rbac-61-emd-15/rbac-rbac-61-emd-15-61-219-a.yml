section_title: Manutenção ou restabelecimento de vigência de habilitação de tipo exclusivamente
  para a função de piloto segundo em comando
subsection_id: a
cite: 61.219(a)
title: 61.219(a)
text: '(a) Para manter ou restabelecer a vigência da habilitação de tipo exclusivamente para
  a função de piloto segundo em comando, o requerente deve:

  (1) ter concluído, com aproveitamento, nos 6 (seis) meses anteriores ao exame de proficiência,
  treinamento de solo e de voo referente ao tipo da aeronave requerida; e

  (2) ser aprovado em exame de proficiência realizado em conformidade com o parágrafo 61.218(b)(4)
  deste Regulamento;'
