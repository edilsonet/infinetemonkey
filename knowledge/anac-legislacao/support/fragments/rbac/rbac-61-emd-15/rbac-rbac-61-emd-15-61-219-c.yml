section_title: Manutenção ou restabelecimento de vigência de habilitação de tipo exclusivamente
  para a função de piloto segundo em comando
subsection_id: c
cite: 61.219(c)
title: 61.219(c)
text: '(c) Caso não exista, até a data em que o candidato iniciar o treinamento, CTAC certificado
  ou validado pela ANAC para ministrá-lo, esse treinamento poderá ser ministrado por um PC
  ou PLA habilitado e qualificado na aeronave, observando-se currículo mínimo estabelecido
  pela ANAC, incluindo, no mínimo, 30% (trinta por cento) das horas de voo previstas nos parágrafos
  61.218(b)(3)(iii)(A), 61.218(b)(3)(iii)(B) ou 61.218(b)(3)(iii)(C), conforme aplicável.
  (Redação dada pela Resolução nº 740, de 16.04.2024)

  (Seção incluída pela Resolução nº 705, de 09.02.2023)

  SUBPARTE L

  HABILITAÇÃO DE VOO POR INSTRUMENTOS'
