cite: 61.221(a)
title: 61.221(a)
text: (a) Esta subparte estabelece os requisitos a serem atendidos para a concessão e revalidação
  da habilitação de voo por instrumentos relativa às licenças de piloto para as categorias
  de avião, helicóptero, aeronave de sustentação por potência e dirigível, assim como as prerrogativas
  e condições para a execução deste tipo de operação. (Redação dada pela Resolução nº 378,
  de 18.03.2016)
