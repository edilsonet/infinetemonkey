section_title: Concessão de habilitação de voo por instrumentos
subsection_id: i
cite: 61.223(i)
title: 61.223(i)
text: '(i) procedimentos anteriores ao voo, inclusive utilização do manual de voo ou documento
  equivalente e dos documentos pertinentes aos serviços de controle de tráfego aéreo para
  a preparação de um plano de voo em condições de voo por instrumentos;

  (ii) inspeção de pré-voo, utilização de lista de verificações, táxi e verificações antes
  da decolagem;

  (iii) procedimentos e manobras para operações em voo por instrumentos em condições normais,
  anormais e de emergência que compreendam, no mínimo:

  (A) transição para voo por instrumentos na decolagem;

  (B) saídas e aproximações por instrumentos padronizadas;

  (C) procedimentos de voo por instrumentos em voo de navegação;

  (D) procedimentos de espera;

  (E) aproximações por instrumentos nos mínimos especificados;

  (F) procedimento de aproximação perdida por instrumentos; e

  (G) aterrissagem a partir de aproximações por instrumentos;

  (iv) manobras em voo e características peculiares de voo; e'
