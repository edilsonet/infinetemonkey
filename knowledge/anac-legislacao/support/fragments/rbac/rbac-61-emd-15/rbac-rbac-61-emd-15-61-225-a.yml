section_title: Revalidação ou manutenção de vigência de habilitação de voo por instrumentos
subsection_id: a
cite: 61.225(a)
title: 61.225(a)
text: '(a) Para revalidar uma habilitação de voo por instrumentos, o requerente deve ser aprovado
  em exame de proficiência realizado em conformidade com o parágrafo 61.223(a)(7) deste Regulamento,
  em aeronave da categoria pertinente à habilitação.

  (1) A revalidação se aplica nos casos previstos na seção 61.33(d) desse Regulamento.'
