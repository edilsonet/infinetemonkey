section_title: Revalidação ou manutenção de vigência de habilitação de voo por instrumentos
subsection_id: b
cite: 61.225(b)
title: 61.225(b)
text: '(b) Para a manutenção da vigência da habilitação de voo por instrumentos, o aeronauta
  deve, dentro do prazo previsto no parágrafo 61.33(a)(1)(iii) e (b) deste Regulamento:

  (1) realizar e ser aprovado em exame de proficiência, realizado em conformidade com o parágrafo
  61.223(a)(7) deste Regulamento, em aeronave da categoria pertinente à habilitação;

  (2) manter o atendimento aos requisitos de experiência recente constantes da seção 61.21
  do RBAC 61; e

  (3) manter a validade de seu CMA.

  (Seção com redação dada pela Resolução nº 705, de 09.02.2023)'
