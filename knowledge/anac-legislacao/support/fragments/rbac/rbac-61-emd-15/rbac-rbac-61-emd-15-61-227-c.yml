title: 61.227(c)
text: '(c) As prerrogativas do titular da habilitação de voo por instrumentos deixam de existir
  após decorrido o período de vigência da habilitação, considerando-se o prazo de tolerância
  estabelecido na seção 61.33 deste Regulamento. (Redação dada pela Resolução nº 705, de 09.02.2023)


  SUBPARTE M

  HABILITAÇÃO DE INSTRUTOR DE VOO'
