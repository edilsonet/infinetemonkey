title: 61.231(a)
text: '(a) Esta subparte estabelece os requisitos a serem atendidos para a concessão e revalidação
  da habilitação de instrutor de voo relativa às licenças de piloto e CPA, assim como as prerrogativas
  e condições para desempenho dessa função.

  (Seção com redação dada pela Resolução nº 475, de 07.06.2018)'
