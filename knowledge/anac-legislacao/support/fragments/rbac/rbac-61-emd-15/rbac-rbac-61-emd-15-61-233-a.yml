title: 61.233(a)
text: '(a) O candidato a uma habilitação de instrutor de voo deve cumprir o seguinte:

  (1) pré-requisito: ser titular de um CPA ou de uma licença de piloto de planador, piloto
  de balão livre, piloto comercial ou de linha aérea da categoria para a qual é requerida
  a habilitação de instrutor de voo;

  (2) instrução teórica:'
