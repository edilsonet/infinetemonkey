cite: 61.233(b)
title: 61.233(b)
text: (b) O candidato a habilitação de instrutor de voo de determinada categoria de aeronave,
  que seja titular de habilitação de instrutor de voo em outra categoria de aeronave, está
  dispensado do cumprimento dos requisitos referentes a conhecimentos teóricos, estabelecidos
  no parágrafo (a)(2) desta seção. (Redação dada pela Resolução nº 705, de 09.02.2023)
