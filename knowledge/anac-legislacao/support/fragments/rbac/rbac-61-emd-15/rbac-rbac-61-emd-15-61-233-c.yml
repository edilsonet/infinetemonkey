section_title: Concessão de habilitação de instrutor de voo
subsection_id: c
cite: 61.233(c)
title: 61.233(c)
text: '(c) Um instrutor de voo habilitado só pode ministrar instrução e endossar a CIV de
  um piloto rebocador de planador ou de um piloto lançador de paraquedista, na forma dos parágrafos
  61.31(g) e (h) deste Regulamento, se cumprir com as exigências dos respectivos requisitos
  ou ter sido titular da habilitação correspondente.

  (Seção com redação dada pela Resolução nº 475, de 07.06.2018)'
