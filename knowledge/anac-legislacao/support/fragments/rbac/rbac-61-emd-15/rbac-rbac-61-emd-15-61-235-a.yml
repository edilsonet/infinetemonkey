section_title: Restabelecimento de vigência de habilitação de instrutor de voo
subsection_id: a
cite: 61.235(a)
title: 61.235(a)
text: '(a) Para restabelecer a vigência da habilitação de instrutor de voo, o requerente deve
  ser aprovado em exame de proficiência realizado em conformidade com o parágrafo 61.233(a)(6)
  deste Regulamento, em aeronave da categoria pertinente à habilitação.

  (1) O restabelecimento de vigência se aplica nos casos previstos no parágrafo 61.33(d) desse
  Regulamento.

  (Seção com redação dada pela Resolução nº 705, de 09.02.2023)'
