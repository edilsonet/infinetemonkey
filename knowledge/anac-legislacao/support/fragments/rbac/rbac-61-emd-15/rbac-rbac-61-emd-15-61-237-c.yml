cite: 61.237(c)
title: 61.237(c)
text: (c) Quando realizado em aeronave, o voo de instrução deve ter como única finalidade
  a instrução, não sendo permitido o transporte de passageiros e/ou cargas ou outros serviços
  aéreos durante o voo.
