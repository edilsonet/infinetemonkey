title: 61.241(a)
text: (a) Esta subparte estabelece os requisitos a serem atendidos para a concessão e revalidação
  da habilitação de piloto agrícola, assim como as prerrogativas e condições para o exercício
  dessa habilitação. (Redação dada pela Resolução nº 378, de 18.03.2016)
