cite: 61.243(i)
title: 61.243(i)
text: '(i) reconhecer e gerenciar ameaças e erros;

  (ii) operar a aeronave dentro de suas limitações de emprego;

  (iii) executar todas as manobras com suavidade e precisão;

  (iv) revelar bom julgamento e possuir aptidão para pilotagem;'
