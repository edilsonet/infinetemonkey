title: 61.243(v)
text: '(v) curvas de reversão em aplicação;

  (vi) execução de arremates de aplicação; e

  (vii) procedimentos operacionais;

  (5) possuir 400 (quatrocentas) horas de voo totais, das quais, no mínimo, 200 (duzentas)
  horas de voo devem ter sido realizadas na categoria de aeronave para a qual é solicitada
  a habilitação, sendo, pelo menos, 100 (cem) dessas horas de voo como piloto em comando;

  (6) demonstrar sua capacidade para executar, como piloto em comando de aeronave da categoria
  para a qual é solicitada a habilitação, os procedimentos e manobras especificadas no parágrafo
  (a)(4) desta seção, com um grau de competência apropriado às prerrogativas que a habilitação
  de piloto agrícola confere ao seu titular, e para:'
