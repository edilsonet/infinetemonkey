section_title: Prerrogativa e limitações do titular de uma habilitação de piloto agrícola
subsection_id: a
cite: 61.247(a)
title: 61.247(a)
text: (a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, bem como
  a prerrogativa e condições estabelecidas para a licença na qual é averbada a habilitação,
  a prerrogativa do titular de uma habilitação de piloto agrícola é a de atuar como piloto
  em comando de aeronave agrícola em execução de operações aéreas agrícolas.
