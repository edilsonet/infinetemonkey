section_title: Prerrogativa e limitações do titular de uma habilitação de piloto agrícola
subsection_id: b
cite: 61.247(b)
title: 61.247(b)
text: (b) Para que a prerrogativa do piloto agrícola possa ser exercida, o titular da habilitação
  de piloto agrícola deve ser titular, também, da habilitação correspondente à aeronave utilizada
  na operação agrícola vigente em conformidade com as seções 61.19, 61.25 e 61.33 deste Regulamento.
  (Redação dada pela Resolução nº 705, de 09.02.2023)
