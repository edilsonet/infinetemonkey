section_title: Mudança de nome e de endereço
subsection_id: a
cite: 61.27(a)
title: 61.27(a)
text: (a) A solicitação para mudança de nome em uma licença emitida segundo este Regulamento
  deve ser apresentada à ANAC dentro de 30 (trinta) dias corridos, a contar do fato que originou
  tal mudança, devendo ser apresentada cópia de certidão de casamento, ordem judicial ou outro
  documento comprovando a mudança.
