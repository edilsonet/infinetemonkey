section_title: Requisitos de instrução de voo para a concessão do CPA
subsection_id: a
cite: 61.289(a)
title: 61.289(a)
text: '(a) O candidato a um CPA deve ter recebido instrução de voo de um instrutor de voo
  devidamente habilitado de uma associação credenciada segundo o RBAC nº 183 ou em CIAC certificado
  pela ANAC. Ao término da instrução, o instrutor de voo é responsável por endossar a CIV
  Digital do aluno, declarando que este é competente para realizar, de forma segura, todas
  as manobras necessárias para ser aprovado no exame de proficiência para a concessão do CPA.
  Tal declaração terá validade de 30 (trinta) dias, a partir da data do último voo de preparação
  para o exame de proficiência. A instrução de voo deverá ser, no mínimo, a seguinte: (Redação
  dada pela Resolução nº 705, de 09.02.2023)

  (1) ter completado, no mínimo, 30 (trinta) horas de voo, das quais 20 (vinte) horas de voo
  devem ser realizadas em duplo comando, 5 (cinco) horas de voo solo no modelo de aeronave
  desportiva pretendido e 10 (dez) horas de voo de navegação; e'
