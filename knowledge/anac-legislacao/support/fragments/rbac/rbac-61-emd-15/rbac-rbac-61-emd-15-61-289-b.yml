section_title: Requisitos de instrução de voo para a concessão do CPA
subsection_id: b
cite: 61.289(b)
title: 61.289(b)
text: '(b) O candidato a uma habilitação de aeronave aerodesportiva, que já seja titular de
  uma licença de piloto ou CPA, com pelo menos uma habilitação vigente, fica dispensado do
  requisito estabelecido no parágrafo (a)(1) desta seção, devendo, contudo, realizar instrução
  de voo para a adaptação ao modelo de aeronave aerodesportiva a ser operada. (Redação dada
  pela Resolução nº 705, de 09.02.2023)

  (1) Adicionalmente, o candidato a uma habilitação de aeronave aerodesportiva aquática/anfíbia,
  deve realizar, pelo menos, 5 (cinco) pousos e 5 (cinco) decolagens na água durante a adaptação.'
