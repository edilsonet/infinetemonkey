section_title: Requisitos de instrução de voo para a concessão do CPA
subsection_id: c
cite: 61.289(c)
title: 61.289(c)
text: '(c) O instrutor deve assegurar-se de que o solicitante possui experiência operacional
  ao nível do desempenho exigido para um piloto aerodesportivo, no mínimo nos seguintes aspectos:

  (1) procedimentos anteriores ao voo, inclusive determinação de peso e balanceamento, inspeções
  e serviços de manutenção na aeronave;

  (2) operações em aeródromos e em circuitos de tráfego; precauções e procedimentos relativos
  à prevenção de colisões;

  (3) controle da aeronave utilizando referências visuais externas;

  (4) voo em velocidades críticas baixas, reconhecimento e recuperação de pré-estol;

  (5) voo em velocidades críticas altas e saída de picadas;

  (6) decolagens e aterrissagens normais e com vento de través;

  (7) decolagens de máximo desempenho (pista curta e ultrapassagem de obstáculos), aterrissagens
  em pista curta;

  (8) execução de curvas niveladas de 180 (cento e oitenta) graus;

  (9) voo de navegação por referências visuais e navegação estimada;

  (10) operações de emergência, incluindo falhas simuladas de equipamentos; e

  (11) operações com origem, destino ou trânsito por aeródromos controlados, cumprindo os
  procedimentos dos serviços de controle.'
