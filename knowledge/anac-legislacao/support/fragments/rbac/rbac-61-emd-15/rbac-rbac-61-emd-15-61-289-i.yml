section_title: Requisitos de instrução de voo para a concessão do CPA
subsection_id: i
cite: 61.289(i)
title: 61.289(i)
text: '(i) Este requisito se aplica a aeronaves aerodesportivas com peso máximo de decolagem
  igual ou inferior a 750 kg, com exceção de balão e planador.

  (ii) Caso a aeronave aerodesportiva seja de categoria tal que possa ser comprovada a inviabilidade
  técnica de voo em duplo comando, as 20 (vinte) horas iniciais de instrução poderão ser realizadas
  solo desde que sob constante coordenação via rádio com o instrutor e desde que sejam tomados
  todos os cuidados para a garantia da segurança da operação.

  (2) para aeronaves anfíbias, além de ter completado as horas de voo previstas no parágrafo
  (a)(1) desta seção, ter realizado, pelo menos, 5 (cinco) pousos e 5 (cinco) decolagens na
  água.'
