title: 61.29(a)
text: '(a) Somente serão aceitos para fins de comprovação de experiência de voo os seguintes
  documentos:

  (1) CIV Digital; ou (Redação dada pela Resolução nº 705, de 09.02.2023)

  (2) Declaração de Horas de Voo, constando os dados extraídos de relatório de registro individual
  de horas de voo. (Redação dada pela Resolução nº 705, de 09.02.2023)

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
