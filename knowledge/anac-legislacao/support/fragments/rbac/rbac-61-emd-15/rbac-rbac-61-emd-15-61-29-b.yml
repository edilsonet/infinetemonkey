section_title: Contagem e registro de horas de voo
subsection_id: b
cite: 61.29(b)
title: 61.29(b)
text: (b) Para fins de contagem das horas de voo requeridas para concessão de uma licença/certificado
  inicial de piloto ou para concessão de uma licença de piloto de grau superior, um aluno
  piloto ou o titular de uma licença ou certificado de piloto, respectivamente, deve registrar
  integralmente as horas de voo quando realizar voo solo, em instrução de voo duplo comando
  ou quando atuar na função de piloto em comando.
