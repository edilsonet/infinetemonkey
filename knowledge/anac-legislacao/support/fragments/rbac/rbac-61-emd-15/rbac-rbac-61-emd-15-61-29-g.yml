section_title: Contagem e registro de horas de voo
subsection_id: g
cite: 61.29(g)
title: 61.29(g)
text: (g) Para fins de contagem das horas de voo requeridas para concessão de uma licença
  de piloto de grau superior, o titular de uma licença de piloto, quando operar os comandos
  de uma aeronave em condições de voo exclusivamente por instrumentos, reais ou simuladas,
  sem qualquer referência externa, deve registrar as horas totais do voo por instrumentos
  assim efetuado.
