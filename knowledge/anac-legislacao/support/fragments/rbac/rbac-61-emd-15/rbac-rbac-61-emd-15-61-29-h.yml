section_title: Contagem e registro de horas de voo
subsection_id: h
cite: 61.29(h)
title: 61.29(h)
text: (h) Para fins de atendimento do requisito de experiência requerido para a concessão
  da licença solicitada, o solicitante de uma licença de piloto, a ser expedida em conformidade
  com este Regulamento, que tenha sido habilitado como piloto de aeronave militar, pode ter
  considerado o seu tempo total de voo realizado de acordo com os critérios da respectiva
  organização.
