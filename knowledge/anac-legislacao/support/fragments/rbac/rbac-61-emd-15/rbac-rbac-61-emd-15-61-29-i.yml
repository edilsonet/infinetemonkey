section_title: Contagem e registro de horas de voo
subsection_id: i
cite: 61.29(i)
title: 61.29(i)
text: (i) As horas de voo realizadas em aeronaves experimentais, quando registradas na CIV
  Digital, devem ser identificadas com anotações no campo “Observações”. Tais horas podem
  ser consideradas para cumprimento de requisitos de experiência recente, conforme estabelecido
  na seção 61.21 deste Regulamento; não podendo ser consideradas para concessão de licença
  de piloto ou elevação de graduação de licença de piloto. (Redação dada pela Resolução nº
  705, de 09.02.2023)
