cite: 61.29(j)
title: 61.29(j)
text: (j) As horas de voo realizadas a bordo de aeronaves com marcas de nacionalidade e de
  matrícula estrangeiras somente poderão ser aceitas quando a finalidade for comprovar experiência
  para a concessão de licença e/ou habilitação e/ou comprovar a experiência recente, conforme
  previsto neste Regulamento, desde que as horas de voo tenham sido realizadas em centros
  de treinamento ou centros de instrução ou em empresas de transporte aéreo certificados pela
  autoridade de aviação civil do respectivo país, que seja contratante da Convenção de Aviação
  Civil Internacional, e sejam declaradas por aquela autoridade. (Redação dada pela Resolução
  nº 705, de 09.02.2023)
