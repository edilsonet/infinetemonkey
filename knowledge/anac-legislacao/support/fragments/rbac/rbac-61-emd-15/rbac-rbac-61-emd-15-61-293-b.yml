section_title: Regras de transição para o CPA
subsection_id: b
cite: 61.293(b)
title: 61.293(b)
text: '(b) A transição para o CPA se realizará no momento da revalidação de uma habilitação
  vinculada ao CPD ou CPR, desde que a aeronave pertinente esteja enquadrada como aeronave
  leve esportiva ou aeronave aerodesportiva portadora de CAVE, de acordo com os requisitos
  estabelecidos nos RBAC nº 01 e 21.

  (1) Os detentores de CPD deverão comprovar, no momento da revalidação, que receberam instrução
  complementar de navegação aérea de um instrutor habilitado de uma associação credenciada
  ou em um CIAC certificado.'
