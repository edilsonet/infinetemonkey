subsection_id: b
cite: 61.297(b)
title: 61.297(b)
text: '(b) Somente será permitida a atuação de um piloto de aeronave leve esportiva ou aeronave
  aerodesportiva portadora de CAVE mediante remuneração nos casos em que este estiver atuando
  como instrutor de voo ou examinador credenciado.

  (Seção com redação dada pela Resolução nº 475, de 07.06.2018)'
