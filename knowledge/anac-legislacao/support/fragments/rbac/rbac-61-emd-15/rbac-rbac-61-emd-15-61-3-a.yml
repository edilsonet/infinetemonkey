cite: 61.3(a)
title: 61.3(a)
text: '(a) Licença/certificado e habilitações de piloto: só pode atuar como piloto em comando
  ou segundo em comando a bordo de aeronaves civis registradas no Brasil quem seja titular
  e esteja portando uma licença/certificado de piloto com suas habilitações vigentes, expedidas
  em conformidade com este Regulamento, e apropriadas à aeronave operada, à operação realizada
  e à função que desempenha a bordo. (Redação dada pela Resolução nº 705, de 09.02.2023)'
