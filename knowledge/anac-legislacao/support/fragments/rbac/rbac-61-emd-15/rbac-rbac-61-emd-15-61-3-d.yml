cite: 61.3(d)
title: 61.3(d)
text: '(d) Habilitação de voo por instrumentos (IFR): ninguém pode atuar como piloto em comando
  ou segundo em comando de uma aeronave sob regras de voo por instrumentos ou em condições
  meteorológicas abaixo dos mínimos previstos para voo visual, a menos que seja titular de
  licença de piloto com uma habilitação de voo por instrumentos vigente, adequada à categoria
  da aeronave em operação, expedida em conformidade com este Regulamento. (Redação dada pela
  Resolução nº 705, de 09.02.2023)'
