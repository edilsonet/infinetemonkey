title: 61.3(f)
text: '(f) Inspeção de licenças e certificados: toda pessoa que seja titular de uma licença
  ou certificado expedido em conformidade com este Regulamento deve apresentá-lo para inspeção
  sempre que requisitado pelos servidores da ANAC. (Redação dada pela Resolução nº 705, de
  09.02.2023)'
