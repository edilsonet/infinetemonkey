cite: 61.3(i)
title: 61.3(i)
text: '(i) Para revogar a suspensão de suas habilitações ocasionada por envolvimento em acidente
  aeronáutico, o piloto deve:

  (1) realizar o treinamento periódico constante do programa de treinamento aprovado do operador
  aéreo ou, não se tratando de operador com programa aprovado, realizar treinamento em simulador
  e/ou em voo de instrução supervisionado por um instrutor de voo, conforme requerido para
  a revalidação da respectiva habilitação, no qual execute as manobras e procedimentos necessários
  para recuperar a proficiência nas habilitações suspensas; e (Redação dada pela Resolução
  nº 512, de 11.04.2019, em vigor em 11.07.2019)

  (2) ser aprovado em exame de proficiência em simulador e/ou em voo, por um servidor da ANAC
  ou examinador credenciado devidamente habilitado e qualificado, desde que não tenha sido
  o próprio a prover a instrução de voo para revogação das suspensões. (Redação dada pela
  Resolução nº 705, de 09.02.2023)'
