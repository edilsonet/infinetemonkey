title: 61.31(a)
text: (a) Todo titular de uma licença de piloto ou CPA deve registrar na sua CIV suas atividades
  de voo realizadas em aeronaves e em FSTD qualificados e aprovados pela ANAC. (Redação dada
  pela Resolução nº 475, de 07.06.2018)
