text: (f) Os pilotos, quando atuando para operadores autorizados a emitir, para a ANAC, declaração
  de experiência de voo, estão dispensados do cumprimento do estabelecido nos parágrafos (a)
  e (d) desta seção. (Redação dada pela Resolução nº 512, de 11.04.2019, em vigor em 11.07.2019)
