cite: 61.31(g)
title: 61.31(g)
text: '(g) Para realizar operações como piloto rebocador de planador, um instrutor habilitado
  deverá endossar a CIV do piloto atestando a sua capacidade para realizar a operação, desde
  que o piloto:

  (1) seja detentor de uma licença de piloto ou CPA, com a habilitação correspondente à aeronave
  utilizada para a operação de reboque de planador e, ainda, seja titular de uma licença de
  piloto de planador;

  (2) tenha pelo menos 100 horas em comando no modelo de aeronave que pretende utilizar para
  a atividade de reboque de planador, ou aeronave cujas características de operação sejam
  similares; e

  (3) tenha recebido instrução específica, em solo e em voo, para a realização de operações
  de reboque de planador com um instrutor habilitado, incluindo a execução de três reboques
  completos acompanhado do instrutor e mais três reboques completos em voo solo.

  (Incluído pela Resolução nº 475, de 07.06.2018)'
