section_title: Prazo e tolerância para a manutenção da vigência da habilitação
subsection_id: a
cite: 61.33(a)
title: 61.33(a)
text: (a) Desde que cumpridos os demais requisitos aplicáveis, o exame de proficiência pertinente
  à manutenção da vigência de uma habilitação pode ser realizado no período que compreende
  30 (trinta) dias antes do início do mês de vencimento da vigência até 30 (trinta) dias após
  o fim do mês de vencimento da vigência, mantendo-se o mês base de vigência da habilitação.
