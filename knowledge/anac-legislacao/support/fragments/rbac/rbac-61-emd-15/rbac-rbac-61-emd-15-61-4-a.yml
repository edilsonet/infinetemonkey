title: 61.4(a)
text: (a) Quaisquer das licenças ou certificados de pilotos de que trata este Regulamento
  podem ser cassados pela ANAC se comprovado, em processo administrativo, que o respectivo
  titular não possui idoneidade para o exercício das prerrogativas especificadas em sua licença
  ou certificado.
