cite: 61.41(a)
title: 61.41(a)
text: (a) Esta subparte estabelece os requisitos e condições especiais para a convalidação
  de licenças e/ou habilitações emitidas no exterior a brasileiros e estrangeiros com qualificação
  de piloto, para concessão de licenças e/ou habilitações a oficiais aviadores das forças
  armadas, e para concessão de uma habilitação de tipo a piloto de ensaio.
