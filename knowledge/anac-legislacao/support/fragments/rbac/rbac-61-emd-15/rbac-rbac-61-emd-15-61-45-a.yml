section_title: Convalidação de licenças e habilitações estrangeiras
subsection_id: a
cite: 61.45(a)
title: 61.45(a)
text: (a) Sem prejuízo do cumprimento das normas migratórias e trabalhistas do País, a ANAC
  pode convalidar uma licença estrangeira emitida por Estado contratante da OACI. Para tal,
  será emitida autorização especial que deverá acompanhar, sempre, a licença estrangeira original
  e a reconhecerá como equivalente a uma licença correspondente concedida pela ANAC.
