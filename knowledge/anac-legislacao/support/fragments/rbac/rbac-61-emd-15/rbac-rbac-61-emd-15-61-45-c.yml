section_title: Convalidação de licenças e habilitações estrangeiras
subsection_id: c
cite: 61.45(c)
title: 61.45(c)
text: (c) As licenças estrangeiras de piloto comercial, de tripulação múltipla ou de linha
  aérea pertencentes a estrangeiros podem ser convalidadas nos termos do parágrafo (a) desta
  seção. Entretanto, as mesmas devem ser expedidas com a ressalva de que o seu titular não
  pode exercer função remunerada a bordo de aeronave de matrícula brasileira, conforme disposto
  no §1º do art. 156 do CBA.
