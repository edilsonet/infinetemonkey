section_title: Convalidação de licenças e habilitações estrangeiras
subsection_id: e
cite: 61.45(e)
title: 61.45(e)
text: (e) As licenças estrangeiras pertencentes a brasileiros, natos ou naturalizados, podem
  ser convalidadas com a emissão de uma licença brasileira de grau correspondente à licença
  original. Na licença brasileira será averbada a informação da convalidação constando número
  e país emitente da licença original.
