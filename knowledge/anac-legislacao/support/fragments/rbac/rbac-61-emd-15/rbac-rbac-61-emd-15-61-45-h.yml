cite: 61.45(h)
title: 61.45(h)
text: (h) As habilitações convalidadas têm prazos de vigência compatíveis com os documentos
  originais, desde que tais prazos não sejam superiores aos prazos correlatos estabelecidos
  neste Regulamento, quando devem prevalecer os prazos brasileiros. (Redação dada pela Resolução
  nº 705, de 09.02.2023)
