cite: 61.45(l)
title: 61.45(l)
text: (l) No momento da solicitação de convalidação, a licença e o certificado médico apresentados
  devem estar no idioma português, espanhol ou inglês. De outra forma, o solicitante deverá
  apresentar, também, traduções oficiais dos documentos.
