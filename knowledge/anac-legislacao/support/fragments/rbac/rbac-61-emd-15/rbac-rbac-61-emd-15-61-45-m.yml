cite: 61.45(m)
title: 61.45(m)
text: '(m) Para todos os casos, será realizada consulta à autoridade de aviação civil emitente
  da licença e/ou habilitação original a respeito da:

  (1) validade da licença e das habilitações do titular;

  (2) classe e vencimento do certificado médico; e

  (3) limitações, suspensões e revogações pertinentes.'
