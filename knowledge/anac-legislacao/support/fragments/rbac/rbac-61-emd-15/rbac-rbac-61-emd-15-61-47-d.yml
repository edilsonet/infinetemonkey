cite: 61.47(d)
title: 61.47(d)
text: (d) As habilitações constantes de licenças emitidas nos termos desta seção devem observar
  o prazo de vigência em conformidade com os requisitos aplicáveis estabelecidos neste Regulamento
  ou, como alternativa, a partir do cumprimento do requisito estabelecido no parágrafo (b)(1)(ii)
  desta seção. (Redação dada pela Resolução nº 705, de 09.02.2023)
