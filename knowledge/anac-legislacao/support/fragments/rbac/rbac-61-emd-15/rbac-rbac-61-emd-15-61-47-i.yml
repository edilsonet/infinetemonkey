section_title: Concessão de licença para oficiais aviadores das Forças Armadas Brasileiras
subsection_id: i
cite: 61.47(i)
title: 61.47(i)
text: '(i) apresentar evidência de sua condição de ex-piloto militar, assim como registros
  de horas de voo devidamente classificadas conforme as exigências de experiência aeronáutica
  da licença e/ou habilitação aplicável, que inclua detalhes de aeronaves envolvidas, e emitida
  em documento oficial da força armada pertinente; e

  (ii) apresentar evidências de cumprimento, com aproveitamento, de um curso de instrução
  teórico-prático com instrutor devidamente habilitado ou em um CIAC certificado pela ANAC;

  (A) Fica dispensado da realização do curso de instrução mencionado no parágrafo anterior
  o oficial aviador das Forças Armadas Brasileiras candidato ao CPA.

  (2) deve ser aprovado em exame(s) teórico(s) pertinente(s) à(s) habilitação(ões) requeridas;
  e

  (3) deve ser aprovado em exame(s) de proficiência pertinente(s) à(s) habilitação(ões) requeridas.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
