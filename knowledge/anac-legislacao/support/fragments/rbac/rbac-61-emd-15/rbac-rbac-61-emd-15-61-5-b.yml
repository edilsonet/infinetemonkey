  (1) habilitações de categoria: as habilitações de categoria integram a denominação da graduação
  de todas as licenças e são regidas pelas prerrogativas e condições estabelecidas para a
  licença respectiva. As habilitações de categoria compreendem: (Redação dada pela Resolução
  nº 705, de 09.02.2023)'
