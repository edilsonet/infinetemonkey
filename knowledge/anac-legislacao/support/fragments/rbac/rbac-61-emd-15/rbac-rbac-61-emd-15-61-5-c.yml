cite: 61.5(c)
title: 61.5(c)
text: (c) Quando da emissão de uma habilitação de tipo que limite as atribuições do seu titular
  às de segundo em comando, ou para atuar como piloto em comando somente durante a fase de
  voo de cruzeiro, ou ainda para operar somente compondo tripulação de 2 (dois) pilotos, em
  aeronave certificada para operação com tripulação mínima de 1 (um) piloto, tais limitações
  deverão estar averbadas na referida habilitação.
