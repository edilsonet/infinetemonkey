cite: 61.5(d)
title: 61.5(d)
text: (d) O CPA é concedido, segundo este Regulamento, para pilotos de aeronaves aerodesportivas
  segundo os requisitos dos RBAC nº 01 e 21, com peso máximo de decolagem de até 750kg, exceto
  balões e planadores. (Redação dada pela Resolução nº 475, de 07.06.2018)
