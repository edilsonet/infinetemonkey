section_title: Requisitos para o voo solo de aluno piloto
subsection_id: b
cite: 61.61(b)
title: 61.61(b)
text: '(b) Conhecimentos teóricos: o aluno piloto não pode operar uma aeronave em voo solo,
  a menos que:

  (1) tenha sido aprovado no exame teórico da ANAC referente à licença de piloto privado,
  piloto de planador ou piloto de balão livre, respeitada a categoria da licença pretendida;

  (2) demonstre ao seu instrutor conhecimentos técnicos de características e limitações operacionais
  da aeronave a ser utilizada na instrução prática de voo; e

  (3) demonstre ao seu instrutor conhecimentos sobre as Regras do Ar e procedimentos específicos
  do aeródromo onde se realizará o voo.'
