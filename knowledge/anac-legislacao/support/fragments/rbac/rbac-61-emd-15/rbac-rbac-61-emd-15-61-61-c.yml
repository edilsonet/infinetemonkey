section_title: Requisitos para o voo solo de aluno piloto
subsection_id: c
cite: 61.61(c)
title: 61.61(c)
text: '(c) Treinamento de voo antes do voo solo: antes de ser autorizado para realizar um
  voo solo, o aluno piloto deve ter recebido instrução nas manobras aplicáveis e nos procedimentos
  listados nos parágrafos (d) até (h) desta seção para a marca e o modelo da aeronave a ser
  operada no voo solo e no nível da licença a que aspira e deve demonstrar habilidade em um
  nível de desempenho aceitável para o instrutor que autoriza o referido voo.'
