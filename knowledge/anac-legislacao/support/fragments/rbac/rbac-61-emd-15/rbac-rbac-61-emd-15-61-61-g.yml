section_title: Requisitos para o voo solo de aluno piloto
subsection_id: g
cite: 61.61(g)
title: 61.61(g)
text: '(g) Para aeronaves de sustentação por potência: além das manobras e procedimentos previstos
  no parágrafo (d) desta seção e de acordo com o que permita o desempenho, as características
  e as limitações da aeronave, o aluno piloto deve ter recebido instrução de voo antes do
  voo solo em:

  (1) aproximações para a aterrissagem;

  (2) aproximações perdidas a partir da aproximação final, e toque da aeronave na pista com
  diversas configurações de voo diferentes;

  (3) guinadas em voo pairado, taxiamento e manobras de solo;

  (4) procedimentos de aterrissagens forçadas, a partir de uma decolagem, na subida inicial;
  a partir do voo de cruzeiro; e a partir da descida e no decorrer da aterrissagem; e

  (5) desacelerações rápidas.'
