section_title: Requisitos para o voo solo de aluno piloto
subsection_id: i
cite: 61.61(i)
title: 61.61(i)
text: '(i) Para balões livres: além das manobras e dos procedimentos apropriados previstos
  no parágrafo (d) desta seção, o aluno piloto dever ter recebido instrução prévia ao voo
  solo em:

  (1) operações das fontes de ar quente ou gás, lastro, válvulas, painéis de cordas, conforme
  o que seja apropriado;

  (2) uso do painel de cordas de emergência (pode ser simulado);

  (3) os efeitos do vento em subidas e ângulos de aproximação; e

  (4) reconhecimento de obstruções e técnicas para evitá-las.'
