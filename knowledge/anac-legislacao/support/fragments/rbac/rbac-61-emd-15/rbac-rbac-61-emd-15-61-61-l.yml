cite: 61.61(l)
title: 61.61(l)
text: (l) Quando for necessária a apresentação prévia de Plano de Voo para a realização do
  voo solo, este deverá ser assinado pelo instrutor de voo indicando o nome e CANAC do aluno
  piloto como piloto em comando. (Redação dada pela Resolução nº 705, de 09.02.2023)
