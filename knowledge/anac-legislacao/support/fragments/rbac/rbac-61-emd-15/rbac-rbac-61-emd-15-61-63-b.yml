section_title: Limitações do aluno piloto
subsection_id: b
cite: 61.63(b)
title: 61.63(b)
text: (b) Um aluno piloto não pode atuar como piloto, ou membro da tripulação, em uma aeronave
  certificada para operação com tripulação mínima de 2 (dois) pilotos, ou aeronave que necessite
  de tripulação mínima de 2 (dois) pilotos por força da regulamentação sob a qual é operada,
  exceto quando receba instrução de voo de um instrutor de voo habilitado e qualificado e
  encontre-se a bordo um piloto de segurança devidamente habilitado e qualificado para compor
  a tripulação.
