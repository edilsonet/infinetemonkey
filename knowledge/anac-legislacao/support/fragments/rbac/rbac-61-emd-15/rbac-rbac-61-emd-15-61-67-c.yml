section_title: Requisitos para o voo de navegação para aluno que aspire a licença de aluno
  piloto
subsection_id: c
cite: 61.67(c)
title: 61.67(c)
text: '(c) Um aluno piloto não pode operar uma aeronave em voo solo de navegação a menos que:

  (1) disponha de uma declaração assinada por seu instrutor, certificando que o aluno recebeu
  a instrução e demonstrou um nível aceitável de competência e eficiência nas manobras e procedimentos
  desta seção para a categoria da aeronave que vai operar; e

  (2) o instrutor tenha registrado e/ou averbado a autorização nos registros de voo (CIV Digital)
  do aluno, incluindo: (Redação dada pela Resolução nº 705, de 09.02.2023)'
