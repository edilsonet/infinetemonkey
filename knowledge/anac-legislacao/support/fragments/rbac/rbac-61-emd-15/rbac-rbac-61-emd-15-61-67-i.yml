section_title: Requisitos para o voo de navegação para aluno que aspire a licença de aluno
  piloto
subsection_id: i
cite: 61.67(i)
title: 61.67(i)
text: '(i) a utilização das cartas aeronáuticas para a navegação VFR usando navegação visual
  e a estimada com a ajuda de uma bússola;

  (ii) comportamento da aeronave em voo de navegação, obtenção e análise dos reportes meteorológicos
  aeronáuticos e os prognósticos, incluindo o reconhecimento das situações meteorológicas
  críticas e estimativa de visibilidade enquanto esteja em voo;

  (iii) condições de emergências em voo de navegação, incluindo procedimentos ao encontrar-se
  perdido em voo, condições meteorológicas adversas e procedimentos de aproximações e aterrissagens
  de emergências simuladas fora de aeródromo ou aeroportos;

  (iv) procedimentos de circuito de tráfego aéreo, incluindo chegadas e saídas normais da
  área, precauções contra a turbulência de esteira e maneiras de evitar colisões no ar;'
