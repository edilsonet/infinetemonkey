subsection_id: a
cite: 61.69(a)
title: 61.69(a)
text: '(a) Um aluno piloto não pode operar uma aeronave em voo solo em um espaço aéreo controlado
  a menos que:

  (1) tenha recebido, tanto a instrução em solo como em voo, de um instrutor autorizado para
  operar na área do espaço aéreo controlado designado, e a instrução tenha sido recebida na
  área específica;

  (2) os registros de voo (CIV Digital) do aluno piloto tenham sido assinados pelo instrutor
  responsável pela instrução, dentro dos 90 (noventa) dias precedentes, para realizar o voo
  solo na área do espaço aéreo controlado designado; e (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (3) disponha de uma autorização com a assinatura de seu instrutor de voo e registros de
  voo (CIV Digital) que especifiquem que o aluno piloto recebeu a instrução de solo e em voo
  estabelecida, demonstrando ser competente para realizar o voo solo nessa área específica
  do espaço aéreo controlado. (Redação dada pela Resolução nº 705, de 09.02.2023)'
