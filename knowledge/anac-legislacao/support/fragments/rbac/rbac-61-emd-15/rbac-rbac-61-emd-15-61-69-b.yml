subsection_id: b
cite: 61.69(b)
title: 61.69(b)
text: '(b) Um aluno piloto não pode operar uma aeronave, a partir de ou em um aeroporto localizado
  em um espaço aéreo controlado a menos que:

  (1) tenha recebido, tanto a instrução de solo como a de voo, de um instrutor autorizado,
  para operar nesse espaço, e a instrução tenha sido dada no aeroporto específico para o que
  se autoriza o voo solo;

  (2) os registros de voo (CIV Digital) do aluno piloto tenham sido assinados pelo instrutor
  responsável pela instrução, dentro dos 90 (noventa) dias precedentes, para realizar o voo
  solo no aeroporto específico; e (Redação dada pela Resolução nº 705, de 09.02.2023)

  (3) disponha de uma autorização com a assinatura de seu instrutor de voo e registros de
  voo (CIV Digital) que especifiquem que o aluno piloto recebeu a instrução de solo e em voo
  estabelecida demonstrando ser competente para realizar o voo solo nesse aeroporto específico.
  (Redação dada pela Resolução nº 705, de 09.02.2023)


  SUBPARTE D

  LICENÇA DE PILOTO PRIVADO'
