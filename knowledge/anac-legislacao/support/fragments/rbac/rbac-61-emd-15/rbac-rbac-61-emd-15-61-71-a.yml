cite: 61.71(a)
title: 61.71(a)
text: (a) Esta subparte estabelece os requisitos a serem atendidos para a concessão da licença
  de piloto privado nas categorias avião, helicóptero, aeronave de sustentação por potência
  e dirigível, assim como as prerrogativas e condições para o exercício das funções pertinentes.
  (Redação dada pela Resolução nº 378, de 18.03.2016)
