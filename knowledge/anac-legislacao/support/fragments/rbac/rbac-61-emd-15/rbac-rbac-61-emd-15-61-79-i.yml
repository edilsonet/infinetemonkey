section_title: Requisitos de instrução de voo para a concessão da licença de piloto privado
subsection_id: i
cite: 61.79(i)
title: 61.79(i)
text: '(i) reconhecimento e gerenciamento de ameaças e erros;

  (ii) procedimentos anteriores ao voo, inclusive determinação de peso e balanceamento, inspeções
  e serviços de manutenção na aeronave de sustentação por potência;

  (iii) operações em aeródromos e em circuitos de tráfego; precauções e procedimentos relativos
  à prevenção de colisões;

  (iv) controle da aeronave de sustentação por potência utilizando referências visuais externas;'
