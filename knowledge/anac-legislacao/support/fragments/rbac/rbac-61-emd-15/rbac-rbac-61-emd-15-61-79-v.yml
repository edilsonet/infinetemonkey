section_title: Requisitos de instrução de voo para a concessão da licença de piloto privado
subsection_id: v
cite: 61.79(v)
title: 61.79(v)
text: '(v) manobras e corridas em voo próximo ao solo, decolagens em voo pairado e corrido
  e subida inicial; aproximação e aterrissagens normais em voo pairado e corrido, sem vento
  e em terreno desnivelado;

  (vi) decolagens e aterrissagens com potência mínima necessária; técnicas de decolagem e
  aterrissagem de máximo desempenho; operações em locais restritos; paradas rápidas;

  (vii) voo utilizando de referência de instrumentos para execução de curvas niveladas de
  180 (cento e oitenta) graus;

  (viii) recuperação no estágio inicial de descida vertical lenta com motor, técnicas de recuperação
  com o rotor em baixo regime dentro do regime normal do motor;

  (ix) voo de navegação por referências visuais, navegação estimada e, quando disponível,
  com auxílio de rádio navegação, incluindo um voo de pelo menos 1 (uma) hora;'
