cite: 61.79(x)
title: 61.79(x)
text: '(x) operações de emergência, incluindo falhas simuladas de equipamentos da aeronave
  de sustentação por potência; aproximação e aterrissagem em procedimento de autorrotação,
  quando aplicável; falha na transmissão, quando aplicável;

  (xi) operações com origem, destino ou trânsito por aeródromos controlados, cumprindo os
  procedimentos dos serviços de controle de tráfego aéreo e os procedimentos e fraseologia
  de radiocomunicações; e

  (xii) procedimentos e fraseologia para as comunicações; e

  (4) categoria dirigível:'
