section_title: Requisitos de experiência para a concessão da licença de piloto privado
subsection_id: i
cite: 61.81(i)
title: 61.81(i)
text: '(i) um total de 40 (quarenta) horas de instrução e voo solo, ou 35 (trinta e cinco)
  horas de instrução e voo solo, se estas foram efetuadas, em sua totalidade, durante a realização
  completa, ininterrupta e com aproveitamento de um curso de piloto privado de avião aprovado
  pela ANAC. As horas totais devem incluir, pelo menos:

  (A) 20 (vinte) horas de instrução duplo comando;

  (B) 10 (dez) horas de voo solo diurno no avião apropriado para a habilitação de classe que
  se deseja obter a habilitação, incluindo 5 (cinco) horas de voo de navegação;

  (C) 1 (um) voo de navegação de, no mínimo, 150 (cento e cinquenta) milhas náuticas, equivalentes
  a 270 (duzentos e setenta) quilômetros durante o qual se realizem, ao menos, 2 (duas) aterrissagens
  completas em aeródromos diferentes;

  (D) a instrução de voo recebida em um dispositivo de treinamento para simulação de voo,
  qualificado e aprovado pela ANAC, é aceitável até um máximo de 5 (cinco) horas;

  (E) 3 (três) horas de instrução em voo noturno, que incluam 10 (dez) decolagens e 10 (dez)
  aterrissagens completas, onde cada aterrissagem envolverá um voo no circuito de tráfego
  do aeródromo;

  (ii) o solicitante de licença de piloto privado para a categoria avião pode ter reduzido
  o requisito de experiência nas seguintes condições:

  (A) se for titular de uma licença de piloto de helicóptero ou aeronave de sustentação por
  potência, o total de horas em avião pode ser reduzido para 25 (vinte e cinco) horas;

  (B) se for titular de licença de piloto de planador, o total de horas de voo em avião pode
  ser reduzido para 25 (vinte e cinco) horas; ou

  (C) se for titular de CPA, o total de horas de voo em avião pode ser reduzido para 25 (vinte
  e cinco) horas, desde que comprovadas no mínimo 15 (quinze) horas de operação em aeronave
  da mesma categoria portadora de certificado de aeronavegabilidade padrão ou especial;

  ( 1 ) As horas de operação em aeronave aerodesportiva portadora de CAVE ou CAV não podem
  ser computadas para a redução de horas.

  (Redação dada pela Resolução nº 475, de 07.06.2018)

  (2) categoria helicóptero:'
