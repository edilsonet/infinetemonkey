subsection_id: a
cite: 61.97(a)
title: 61.97(a)
text: '(a) O candidato a uma licença de piloto comercial deve:

  (1) ter completado, com aproveitamento, um curso teórico de piloto comercial aprovado pela
  ANAC, na categoria apropriada, segundo requisitos estabelecidos pelo RBAC 141; e (Redação
  dada pela Resolução nº 705, de 09.02.2023)

  (2) ter sido aprovado em exame teórico da ANAC para a licença de piloto comercial referente
  à categoria a que pretenda obter a licença.'
