section_title: Requisitos de instrução de voo para a concessão da licença de piloto comercial
subsection_id: a
cite: 61.99(a)
title: 61.99(a)
text: '(a) O candidato a uma licença de piloto comercial deve ter recebido instrução de voo
  ministrada por um instrutor de voo habilitado. Ao término da instrução, o instrutor é responsável
  por endossar a CIV Digital do aluno, declarando que este é competente para realizar, de
  forma segura, todas as manobras necessárias para ser aprovado no exame de proficiência para
  a concessão da licença de piloto comercial. Tal declaração terá validade de 30 (trinta)
  dias, a partir da data do último voo de preparação para o exame de proficiência. O conteúdo
  da instrução de voo deverá ser, no mínimo, o seguinte: (Redação dada pela Resolução nº 705,
  de 09.02.2023)

  (1) categoria avião:'
