section_title: Requisitos de instrução de voo para a concessão da licença de piloto comercial
subsection_id: i
cite: 61.99(i)
title: 61.99(i)
text: '(i) reconhecimento e gerenciamento de ameaças e erros;

  (ii) procedimentos anteriores ao voo, inclusive determinação de peso e balanceamento, inspeções
  e serviços de manutenção no dirigível;

  (iii) operações em aeródromos e em circuitos de tráfego; precauções e procedimentos relativos
  à prevenção de colisões;

  (iv) técnicas e procedimentos para a decolagem, incluindo limitações apropriadas, procedimentos
  e sinais de emergência utilizados;'
