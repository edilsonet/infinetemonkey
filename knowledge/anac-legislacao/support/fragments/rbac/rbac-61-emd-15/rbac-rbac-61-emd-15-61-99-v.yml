section_title: Requisitos de instrução de voo para a concessão da licença de piloto comercial
subsection_id: v
cite: 61.99(v)
title: 61.99(v)
text: '(v) recuperação no estágio inicial de descida vertical lenta com motor, técnicas de
  recuperação com o rotor em baixo regime dentro do regime normal do motor;

  (vi) manobras e corridas em voo próximo ao solo, decolagens em voo pairado e corrido e subida
  inicial; aproximação e aterrissagens normais em voo pairado e corrido, sem vento e em terreno
  desnivelado;

  (vii) decolagens e aterrissagens com potência mínima necessária; técnicas de decolagem e
  aterrissagem de máximo desempenho; operações em locais restritos; paradas rápidas;

  (viii) voo pairado sem efeito solo; operações com carga externa, se aplicável; voo a grande
  altitude;

  (ix) manobras básicas de voo e recuperação de atitude anormal somente por referência dos
  instrumentos básicos de voo;'
