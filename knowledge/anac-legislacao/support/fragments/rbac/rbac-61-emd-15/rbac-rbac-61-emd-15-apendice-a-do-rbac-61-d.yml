title: apendice-a-do-rbac-61(d)
text: '(d) A escala de níveis de proficiência linguística é dada pelas tabelas a seguir:


  1.2 Níveis 6 (Expert), 5 (Avançado) e 4 (Operacional):

  Nível

  6 - Expert

  5 - Avançado

  4 - Operacional

  Pronúncia

  Utiliza um dialeto e/ou sotaque inteligível, para a comunidade aeronáutica.

  Pronúncia, intensidade, ritmo e entonação, embora possivelmente influenciados pela língua
  materna ou variação regional, quase nunca interferem na facilidade de compreensão.

  Pronúncia, intensidade,

  ritmo e entonação, embora

  influenciados pela língua

  materna ou variação regional, raramente interferem na facilidade de compreensão.

  Pronúncia, intensidade,

  ritmo e entonação são

  influenciados pela língua

  materna ou variação regional, mas apenas algumas vezes interferem na facilidade de compreensão.

  Estrutura

  Aspectos gramaticais relevantes e padrões estruturais das frases são determinados pelas
  funções da linguagem apropriadas à tarefa.

  Aspectos gramaticais básicos e complexos e padrões estruturais das frases são constantemente
  bem controlados.

  Aspectos gramaticais básicos e padrões estruturais das frases são constantemente bem controlados.
  Esforça-se para usar estruturas complexas

  mas com erros, o que algumas vezes interfere no significado.

  Aspectos gramaticais básicos e padrões estruturais das frases são usados com criatividade
  e são geralmente bem controlados. Erros podem acontecer, particularmente em circunstâncias
  não usuais

  ou não esperadas, mas raramente interferem no significado.

  Vocabulário

  A riqueza e precisão do vocabulário são suficientes para comunicar-se efetivamente em uma
  grande variedade de tópicos familiares e desconhecidos. O vocabulário é idiomático, suficiente
  para expressar sutilezas, e apropriado ao contexto.

  A riqueza e precisão do vocabulário são suficientes para comunicar-se efetivamente em tópicos
  comuns, concretos e relacionados ao trabalho. Parafraseia constantemente e com sucesso.
  O vocabulário é algumas vezes idiomático.

  A riqueza e precisão do vocabulário são geralmente suficientes para comunicar-se efetivamente
  em tópicos

  comuns, concretos e relacionados ao trabalho. Pode geralmente parafrasear com sucesso quando
  faltar vocabulário em circunstâncias não usuais ou não esperadas.

  Fluência

  Capaz de falar por um longo período em ritmo natural e sem esforço. Varia o ritmo da fala
  para efeitos estilísticos, ex: para enfatizar um assunto. Usa marcadores de discurso e conectores
  apropriados espontaneamente.

  Capaz de falar por um longo

  período com uma facilidade

  relativa em tópicos familiares, mas pode não variar o ritmo da fala para efeitos estilísticos.
  Pode usar marcadores de discurso e conectores apropriados.

  Produz segmentos linguísticos em cadência apropriada. Pode ocorrer perda de fluência ocasional
  na transição da fala ensaiada ou formatada para a interação espontânea, mas isto não impede
  a comunicação efetiva. Pode fazer uso limitado de marcadores de discurso ou conectores.
  Os marcadores conversacionais não comprometem a compreensão da mensagem.

  Compreensão

  A compreensão é constantemente precisa em quase todos os contextos e inclui o entendimento
  de sutilezas linguísticas e culturais.

  A compreensão é precisa em tópicos comuns, concretos e relacionados ao trabalho e na maioria
  das vezes precisa quando o falante é confrontado com uma complicação linguística ou situacional
  ou com eventos inesperados. É capaz de compreender uma gama de variedades do discurso (dialetos
  e/ou sotaques) ou registros.

  A compreensão é na maioria das vezes precisa em tópicos comuns, concretos e relacionados
  ao trabalho quando o sotaque ou variedade usada é suficientemente inteligível para uma comunidade
  internacional de usuários. Quando o falante é confrontado com uma complicação linguística
  ou situacional ou com eventos inesperados, a compreensão pode ser mais vagarosa ou requerer
  estratégias de clarificação.

  Interações

  Interage com facilidade em quase todas as situações. É sensível a pistas verbais e não verbais,
  e as responde apropriadamente.

  As respostas são imediatas, apropriadas e informativas. Gerencia a relação falante/ ouvinte
  efetivamente.

  As respostas são geralmente imediatas, apropriadas e informativas. Inicia e mantém trocas
  mesmo quando lidando com eventos inesperados. Sabe lidar adequadamente com mal entendidos
  aparentes, checando, confirmando ou esclarecendo.


  1.3 Níveis 3 (Pré-operacional), 2 (Elementar) e 1 (Pré-elementar):

  Nível

  3 - Pré-operacional

  2 - Elementar

  1 - Pré-elementar

  Pronúncia

  Utiliza um dialeto e/ou sotaque inteligível, para a comunidade aeronáutica.

  Pronúncia, intensidade, ritmo e entonação são influenciados pela língua materna ou variação
  regional e freqüentemente interferem na facilidade de compreensão.


  Pronúncia, intensidade, ritmo e entonação são fortemente influenciados pela língua materna
  ou variação regional e geralmente interferem na facilidade de compreensão.

  Desempenha em um nível abaixo do Nível Elementar.

  Estrutura

  Aspectos gramaticais relevantes e padrões estruturais das frases são determinados pelas
  funções da linguagem apropriadas à tarefa.

  Aspectos gramaticais básicos e padrões estruturais das frases associados com situações previsíveis
  não são sempre bem controlados. Erros freqüentemente interferem no significado.


  Demonstra apenas controle limitado de poucas estruturas gramaticais e padrões estruturais
  das frases simples e memorizados.

  Desempenha em um nível abaixo do Nível Elementar.

  Vocabulário

  A variação e exatidão do vocabulário são freqüentemente suficientes para comunicar-se em
  tópicos comuns, concretos e relacionados ao trabalho, mas a variedade é limitada e a escolha
  de palavras freqüentemente inapropriada. É muitas vezes incapaz de parafrasear com sucesso
  quando falta vocabulário.

  Variedade de vocabulário limitada consistindo apenas de palavras isoladas e frases memorizadas.

  Desempenha em um nível abaixo do Nível Elementar.

  Fluência

  Produz segmentos lingüísticos, mas a construção das frases e pausas são geralmente inapropriadas.
  Hesitações ou lentidão no processamento da língua pode impedir a comunicação efetiva. Os
  marcadores conversacionais algumas vezes comprometem a compreensão da mensagem.

  Pode produzir elocuções muito pequenas, isoladas e memorizadas com pausas freqüentes e um
  uso de marcadores conversacionais que desviam a atenção a fim de procurar expressões e articular
  palavras menos familiares.

  Desempenha em um nível abaixo do Nível Elementar.

  Compreensão

  A compreensão é freqüentemente precisa em tópicos comuns, concretos e relacionados ao trabalho
  quando o sotaque ou variedade usada é suficientemente inteligível para uma comunidade internacional
  de usuários. Pode falhar em entender uma complicação linguística ou situacional ou eventos
  inesperados.

  A compreensão é limitada a frases isoladas e memorizadas quando são articuladas com cuidado
  e vagarosamente.

  Desempenha em um nível abaixo do Nível Elementar.

  Interações

  As respostas são algumas vezes imediatas, apropriadas e informativas. Pode iniciar e manter
  trocas com relativa facilidade em tópicos familiares e em situações previsíveis. Geralmente
  inadequado quando lidando com eventos inesperados.

  O tempo de resposta é lento, e freqüentemente inapropriado. Interação é limitada a trocas
  de rotina simples.

  Desempenha em um nível abaixo do Nível Elementar.


  Nota - O Nível Operacional (Nível 4) é o nível mínimo de proficiência requerido para comunicações
  rádio-telefônicas. Os Níveis 1 a 3 descrevem os níveis de proficiência linguística Pré-elementar,
  Elementar, e Pré-operacional, respectivamente, os quais constituem um nível de proficiência
  abaixo do requisito de proficiência linguística requerido. Os Níveis 5 e 6 descrevem os
  Níveis Avançado e Expert, em níveis de proficiência mais avançados do que o padrão mínimo
  requerido. No geral, a escala serve como padrão de referência para treinamentos e testes,
  auxiliando os candidatos a atingirem o Nível Operacional (Nível 4) requerido.'
