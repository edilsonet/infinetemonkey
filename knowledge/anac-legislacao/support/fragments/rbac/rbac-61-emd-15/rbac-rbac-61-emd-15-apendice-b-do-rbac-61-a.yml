  TEM - Threat and Error Management - Gerenciamento de Erros e Ameaças.

  CRM - Crew Resourse Management - Gerenciamento de Recursos das Tripulações.

  PIC - Pilot in Command -Piloto em Comando; SIC - Second in Command -Segundo em Comando.

