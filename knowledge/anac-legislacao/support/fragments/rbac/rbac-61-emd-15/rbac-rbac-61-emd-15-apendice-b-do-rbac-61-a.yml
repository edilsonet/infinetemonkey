title: apendice-b-do-rbac-61(a)
text: '(a) Fase final da instrução, em que o candidato deve atingir o nível de competência
  requerido para realizar operações como segundo em comando em um avião de motor à turbina
  certificado para operação com tripulação mínima de 2 (dois) pilotos, em condições de voo
  visual e por instrumentos. A avaliação nesta fase confirma que o controle do avião é mantido
  durante todo o tempo de voo, de modo que não ocorram dúvidas quanto ao êxito de algum procedimento
  ou manobra. O candidato deve demonstrar de forma satisfatória que possui os conhecimentos,
  proficiências e atitudes necessárias para executar, com segurança, as operações relativas
  ao tipo e modelo da aeronave pertinente.


  3. Plano de Instrução

