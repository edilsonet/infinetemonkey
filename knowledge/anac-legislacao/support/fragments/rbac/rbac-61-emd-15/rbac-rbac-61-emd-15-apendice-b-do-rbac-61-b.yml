title: apendice-b-do-rbac-61(b)
text: '(b) Ao final da instrução, o candidato deve ter atingido os conhecimentos, proficiências
  e atitudes requeridos como atributos fundamentais para atuar como segundo em comando em
  avião de transporte aéreo com motor à turbina certificado para operação com tripulação mínima
  de 2 (dois) pilotos.


  1.2 Nível de Avaliação'
