cite: 61.1(a)
title: 61.1(a)
text: '(a) Este Regulamento estabelece as normas e procedimentos relativos à concessão de
  licenças,

  habilitações e certificados para pilotos; os requisitos e padrões mínimos que devem ser
  cumpridos

  para a concessão e revalidação desses documentos e as prerrogativas e limitações relativas
  a cada

  licença, habilitação ou certificado.'
