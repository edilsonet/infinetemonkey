title: 61.10(b)
text: '(b) Todo piloto que pretenda operar nas condições estabelecidas no parágrafo (a) desta
  seção deve

  demonstrar as habilidades em falar e compreender a língua inglesa, submetendo-se ao exame
  de

  proficiência linguística elaborado pela ANAC.'
