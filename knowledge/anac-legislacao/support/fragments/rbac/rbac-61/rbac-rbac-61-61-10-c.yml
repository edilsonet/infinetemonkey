cite: 61.10(c)
title: 61.10(c)
text: '(c) O desempenho do piloto no exame de proficiência linguística na língua inglesa,
  será averbado

  em sua licença da seguinte forma:

  (1) “English level 4, 5, ou 6”, de acordo com o nível de proficiência na língua inglesa
  4, 5 ou

  6, atingido no exame de proficiência linguística, conforme a tabela do Apêndice A deste

  Regulamento; ou

  (2) “English Not Compliant Annex 1” no caso em que o piloto tenha obtido níveis 1, 2 ou
  3, ou

  não tenha realizado o exame de proficiência linguística na língua inglesa.'
