title: 61.10(d)
text: '(d) Somente podem operar aeronave civil brasileira fora da jurisdição do espaço aéreo
  brasileiro

  os pilotos de avião, helicóptero, aeronave de decolagem vertical ou dirigível que tiverem
  averbado


  Data da emissão: 20 de março de 2020.


  em suas licenças o nível de proficiência na língua inglesa 4, 5 ou 6, de acordo com o parágrafo
  (c)(1)

  desta Seção.'
