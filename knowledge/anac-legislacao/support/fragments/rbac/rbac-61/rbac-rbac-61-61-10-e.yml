cite: 61.10(e)
title: 61.10(e)
text: '(e) Os pilotos de avião, helicóptero, aeronave de decolagem vertical ou dirigível que
  tiverem

  averbado em sua licença o nível de proficiência na língua inglesa 4 ou 5 devem se submeter
  à

  reavaliação conforme abaixo:

  (1) pelo menos uma vez em cada três anos os pilotos que tiverem averbado o nível 4; e

  (2) pelo menos uma vez em cada seis anos os pilotos que tiverem averbado o nível 5.'
