title: 61.10(f)
text: '(f) Todas as licenças de pilotos brasileiros que forem emitidas, validadas ou quando
  as habilitações

  forem revalidadas terão averbadas a observação relativa à proficiência linguística do piloto
  na língua

  portuguesa (“Português Nível 6”).'
