title: 61.105(b)
text: '(b) Para que as prerrogativas do titular da licença possam ser exercidas à noite, o
  solicitante deve

  ter recebido instrução duplo comando em voo noturno na categoria apropriada, incluindo decolagens,

  aterrissagens e navegação.'
