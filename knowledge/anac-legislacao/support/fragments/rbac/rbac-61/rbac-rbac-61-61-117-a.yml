title: 61.117(a)
text: '(a) O candidato a uma licença de piloto de tripulação múltipla deve cumprir todos os
  requisitos de

  conhecimentos teóricos referentes à concessão de licença de piloto de linha aérea na categoria
  avião

  constantes da seção 61.137 deste Regulamento.

  (Redação dada pela Resolução nº 344, de 17.09.2014)'
