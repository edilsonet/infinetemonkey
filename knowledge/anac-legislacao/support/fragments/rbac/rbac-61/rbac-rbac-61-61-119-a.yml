section_title: Requisitos de instrução de voo para a concessão da licença de piloto de tripulação
subsection_id: a
cite: 61.119(a)
title: 61.119(a)
text: '(a) O candidato a uma licença de piloto de tripulação múltipla deve ter recebido instrução
  de voo,

  em um CIAC certificado pela ANAC. Ao término da instrução, o instrutor de voo é responsável
  por

  endossar a CIV do aluno, declarando que este é competente para realizar, de forma segura,
  todas as

  manobras necessárias para ser aprovado no exame de proficiência para a concessão da licença
  de

  piloto de tripulação múltipla. Tal declaração terá validade de 30 (trinta) dias, a partir
  da data do último

  voo de preparação para o exame de proficiência. O conteúdo da instrução de voo deverá compreender

  todos os requisitos de experiência contidos na seção 61.121 deste Regulamento. (Redação
  dada pela

  Resolução nº 475, de 07.06.2018)'
