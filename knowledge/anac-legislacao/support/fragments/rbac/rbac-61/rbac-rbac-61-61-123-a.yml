section_title: Requisitos de proficiência para a concessão da licença de piloto de tripulação
  múltipla
subsection_id: a
cite: 61.123(a)
title: 61.123(a)
text: '(a) O candidato a uma licença de piloto de tripulação múltipla deve demonstrar, em
  exame de

  proficiência, sua capacidade para executar os procedimentos e manobras especificados na
  seção

  relativa à instrução de voo pertinente, com um grau de competência apropriado às prerrogativas
  que

  a licença de piloto de tripulação múltipla confere ao seu titular, e para:

  (1) atuar como segundo em comando de aviões com motor à turbina (motor à reação ou

  turboélice) certificados para operação com tripulação mínima de 2 (dois) pilotos, em condições

  visuais de voo e de voo por instrumentos;

  (2) reconhecer e gerenciar ameaças e erros;

  (3) operar a aeronave dentro de suas limitações de emprego;

  (4) executar todas as manobras com suavidade e precisão;

  (5) pilotar o avião no modo de automatização apropriado à fase de voo e manter-se consciente

  do modo ativo de automatização;


  Data da emissão: 20 de março de 2020.


  (6) executar de forma precisa, procedimentos normais, anormais e de emergência em todas
  as

  fases do voo; e

  (7) comunicar-se de forma eficaz com todos os demais membros da tripulação de voo e

  demonstrar a capacidade de executar de forma eficaz os procedimentos em caso de incapacitação
  da

  tripulação, coordenar-se com a tripulação, aderir aos procedimentos normais de operação
  (Manual

  Geral de Operações - MGO) e usar as listas de verificações.'
