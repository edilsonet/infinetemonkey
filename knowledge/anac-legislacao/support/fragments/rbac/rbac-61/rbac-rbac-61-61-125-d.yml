title: 61.125(d)
text: '(d) Nenhum titular de licença de piloto de tripulação múltipla pode atuar como segundo
  em

  comando, em operações internacionais de serviços de transporte aéreo público, regulares
  ou não, após

  ter completado 65 (sessenta e cinco) anos de idade.


  Data da emissão: 20 de março de 2020.


  SUBPARTE G

  LICENÇA DE PILOTO DE LINHA AÉREA'
