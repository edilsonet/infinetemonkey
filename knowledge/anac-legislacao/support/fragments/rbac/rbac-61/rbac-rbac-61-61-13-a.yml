section_title: Solicitação de licenças, certificados e/ou habilitações
subsection_id: a
cite: 61.13(a)
title: 61.13(a)
text: '(a) A solicitação para a concessão de uma licença/certificado e/ou de uma habilitação
  de acordo

  com este Regulamento deve ser feita por meio de preenchimento de formulário próprio, apresentado

  à ANAC, o qual deve ser enviado por via eletrônica disponibilizada pela ANAC, após o requerente

  ter atendido aos requisitos de idade, grau de instrução, aptidão psicofísica, conhecimentos
  teóricos,

  instrução de voo, experiência de voo e aprovação em exame de proficiência previstos neste

  Regulamento, correspondentes à licença/certificado e/ou habilitação requerida. Para tanto:

  (1) o requisito de conhecimentos teóricos é atendido mediante a aprovação em exame teórico

  da ANAC ou aprovado pela ANAC, envolvendo os assuntos pertinentes à licença ou habilitação

  requerida. Nos casos em que a realização de curso teórico em instituição certificada for
  requisito para

  obter a licença ou habilitação, o candidato somente poderá realizar o exame teórico após
  ter concluído

  o curso teórico com aproveitamento; e (Redação dada pela Resolução nº 475, de 07.06.2018)

  (2) o solicitante que não obtiver aprovação no exame de proficiência somente poderá prestar

  novo exame após realizar, sob a supervisão de um instrutor de voo habilitado e qualificado,

  treinamento corretivo relativo às deficiências que provocaram a sua reprovação, podendo
  repetir tal

  procedimento tantas vezes quantas forem necessárias até sua aprovação ou desistência.'
