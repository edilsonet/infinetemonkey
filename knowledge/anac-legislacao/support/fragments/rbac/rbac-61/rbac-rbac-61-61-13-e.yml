text: '(e) O solicitante de uma licença ou certificado que tenha atendido a todos os requisitos
  deste

  regulamento, inclusive aprovação no exame de proficiência, fará jus a emissão de uma

  licença/certificado provisório válida por um período de 90 (noventa) dias a partir da data
  da sua


  Data da emissão: 20 de março de 2020.


  emissão. A emissão da licença/certificado provisório será automaticamente revogada se for

  constatada alguma irregularidade.'
