title: 61.131(a)
text: '(a) Esta subparte estabelece os requisitos a serem atendidos para a concessão da licença
  de piloto

  de linha aérea nas categorias avião, helicóptero e aeronave de sustentação por potência,
  assim como

  as prerrogativas e condições para o exercício das funções pertinentes.'
