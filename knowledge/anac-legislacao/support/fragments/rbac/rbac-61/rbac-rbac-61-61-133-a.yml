section_title: Requisitos gerais para a concessão da licença de piloto de linha aérea
subsection_id: a
cite: 61.133(a)
title: 61.133(a)
text: '(a) O candidato a uma licença de piloto de linha aérea deve:

  (1) ter completado 21 (vinte e um) anos;

  (2) ter concluído o ensino médio; e

  (3) ser titular de licença de piloto comercial na categoria de aeronave pretendida.'
