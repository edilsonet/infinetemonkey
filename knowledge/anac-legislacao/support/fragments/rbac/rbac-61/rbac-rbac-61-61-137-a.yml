cite: 61.137(a)
title: 61.137(a)
text: '(a) O candidato a uma licença de piloto de linha aérea deve ter sido aprovado em exame
  teórico

  da ANAC para a licença de piloto de linha aérea referente à categoria em que pretenda obter
  a licença.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
