subsection_id: a
cite: 61.139(a)
title: 61.139(a)
text: '(a) O candidato a uma licença de piloto de linha aérea na categoria avião deve ter
  recebido:

  (1) a instrução duplo comando exigida para a concessão da licença de piloto comercial na

  categoria avião (parágrafo 61.99(a)(1) deste Regulamento), e a instrução da habilitação
  de voo por

  instrumentos na categoria avião (parágrafo 61.223(a)(5) deste Regulamento); ou

  (2) a instrução para a concessão de uma licença de piloto de tripulação múltipla (seção
  61.119

  deste Regulamento).'
