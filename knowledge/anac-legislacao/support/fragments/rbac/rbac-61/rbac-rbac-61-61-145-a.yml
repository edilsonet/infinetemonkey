section_title: Prerrogativas do titular da licença de piloto de linha aérea e condições que
  devem ser
subsection_id: a
cite: 61.145(a)
title: 61.145(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, as prerrogativas
  do

  titular de uma licença de piloto de linha aérea são:

  (1) exercer todas as prerrogativas do titular de uma licença de piloto privado e de piloto

  comercial de uma aeronave da categoria apropriada; e (Redação dada pela Resolução nº 378,
  de

  18.03.2016)

  (2) atuar como piloto em comando ou segundo em comando de aeronave empregada em voos

  de transporte aéreo público.'
