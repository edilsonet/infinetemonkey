section_title: Prerrogativas do titular da licença de piloto de linha aérea e condições que
  devem ser
subsection_id: c
cite: 61.145(c)
title: 61.145(c)
text: '(c) Nenhum titular de licença de piloto de linha aérea pode atuar como piloto em operações

  internacionais de serviços de transporte aéreo público após ter completado 60 (sessenta)
  anos de idade

  ou, no caso de operações com mais de um piloto, 65 (sessenta e cinco) anos de idade. (Redação
  dada

  pela Resolução nº 378, de 18.03.2016)


  Data da emissão: 20 de março de 2020.


  SUBPARTE H

  LICENÇA DE PILOTO DE PLANADOR'
