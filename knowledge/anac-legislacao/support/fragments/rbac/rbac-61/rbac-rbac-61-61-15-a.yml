cite: 61.15(a)
title: 61.15(a)
text: '(a) Pode ser concedida autorização específica para realização de voos nos casos de:

  (1) treinamento em voo para revogar suspensão de habilitações, com validade de 90 (noventa)

  dias;

  (2) voo de traslado realizado por piloto estrangeiro, em aeronave de matrícula brasileira,
  com a

  validade limitada ao tempo necessário para realizar o referido voo; e

  (3) instrutores estrangeiros para ministrar instrução de voo em aeronave que não possua,
  no

  País, instrutores devidamente habilitados e qualificados, disponíveis para ministrar a instrução

  requerida, com validade limitada ao que for menor:'
