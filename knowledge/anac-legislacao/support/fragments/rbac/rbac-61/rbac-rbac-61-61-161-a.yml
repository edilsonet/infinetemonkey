section_title: Requisitos de experiência para a concessão da licença de piloto de planador
subsection_id: a
cite: 61.161(a)
title: 61.161(a)
text: '(a) O candidato a uma licença de piloto de planador deve:

  (1) ter realizado, pelo menos, 15 (quinze) horas de voo em planador ou 60 (sessenta)

  lançamentos e aterrissagens como aluno piloto de planador; e

  (2) ter realizado, pelo menos, 2 (duas) horas de voo solo em planador.'
