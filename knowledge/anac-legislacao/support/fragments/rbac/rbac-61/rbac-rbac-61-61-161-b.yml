section_title: Requisitos de experiência para a concessão da licença de piloto de planador
subsection_id: b
cite: 61.161(b)
title: 61.161(b)
text: '(b) O candidato a uma licença de piloto de planador pode ter reduzido o requisito de
  experiência

  se for titular de uma licença de piloto de avião, podendo o total de horas ser reduzido
  para 10 (dez)

  horas de voo ou 40 (quarenta) lançamentos e aterrissagens, permanecendo a necessidade de
  realização

  de, pelo menos, 2 (duas) horas de voo solo em planador.

  (1) A mesma redução poderá ser concedida ao titular de um CPA, desde que sua habilitação

  seja em categoria cujas características de pilotagem sejam similares às do voo em planador.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
