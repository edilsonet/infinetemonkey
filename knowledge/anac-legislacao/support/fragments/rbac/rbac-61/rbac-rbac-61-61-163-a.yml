section_title: Requisitos de proficiência para a concessão da licença de piloto de planador
subsection_id: a
cite: 61.163(a)
title: 61.163(a)
text: '(a) O candidato a uma licença de piloto de planador deve demonstrar, em exame de proficiência,

  sua capacidade para executar, como piloto em comando, os procedimentos e manobras especificados

  na seção relativa à instrução de voo, com um grau de competência apropriado às prerrogativas
  que a

  licença de piloto de planador confere ao seu titular, e para:

  (1) reconhecer e gerenciar ameaças e erros;

  (2) operar o planador dentro de suas limitações de emprego;

  (3) executar todas as manobras com suavidade e precisão;

  (4) revelar bom julgamento e aptidão de pilotagem;

  (5) aplicar os conhecimentos aeronáuticos; e

  (6) manter controle do planador durante todo o tempo do voo, de modo que não ocorram

  dúvidas quanto ao êxito de algum procedimento ou manobra.'
