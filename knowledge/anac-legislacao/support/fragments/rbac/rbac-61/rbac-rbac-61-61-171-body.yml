title: Aplicabilidade
text: '61.171 Aplicabilidade

  Esta subparte estabelece os requisitos a serem atendidos para a concessão da licença de
  piloto de

  balão livre e a correspondente habilitação de categoria, assim como as prerrogativas e condições
  para

  o exercício das funções pertinentes em operações de voo sob as regras do RBHA 91 ou comerciais,

  distintas das atividades desportivas reguladas pelo RBAC nº 103.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
