section_title: Requisitos gerais para a concessão da licença de piloto de balão livre
subsection_id: a
cite: 61.173(a)
title: 61.173(a)
text: '(a) O candidato a uma licença de piloto de balão livre deve:

  (1) ter completado 18 (dezoito) anos; e

  (2) ter concluído o ensino médio.'
