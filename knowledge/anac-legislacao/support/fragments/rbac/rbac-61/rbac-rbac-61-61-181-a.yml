title: 61.181(a)
text: '(a) O candidato a uma licença de piloto de balão livre deve ter realizado:

  (1) 16 (dezesseis) horas de voo, das quais pelo menos 8 (oito) horas devem ter sido realizadas

  sob a supervisão de um instrutor de voo habilitado e qualificado; e

  (2) 8 (oito) ascensões sob a supervisão de um instrutor de voo habilitado e qualificado,
  das

  quais, pelo menos:'
