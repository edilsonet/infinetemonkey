section_title: Requisitos de experiência para a concessão da licença de piloto de balão livre
subsection_id: i
cite: 61.181(i)
title: 61.181(i)
text: '(i) 1 (uma) ascensão deve ter atingido a altura de 3.000 (três mil) pés; e

  (ii) 1 (uma) ascensão deve ter tido a duração de no mínimo 60 (sessenta) minutos ou 2 (duas)

  ascensões devem ter sido realizadas em voo solo, com duração mínima de 30 (trinta) minutos
  cada

  uma.'
