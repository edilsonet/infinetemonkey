section_title: Validade das habilitações de piloto
subsection_id: a
cite: 61.19(a)
title: 61.19(a)
text: '(a) A validade das habilitações averbadas nas licenças ou certificados de piloto deve
  obedecer aos

  seguintes prazos, contados a partir do mês de aprovação do piloto no exame de proficiência,
  a exceção

  do previsto no parágrafo 61.33 (a) deste Regulamento:

  (1) habilitação de classe: 24 (vinte e quatro) meses, com exceção das habilitações relativas
  ao

  CPA, que terão validade de 36 (trinta e seis) meses;

  (2) habilitação de tipo: 12 (doze) meses;

  (3) habilitação de voo por instrumentos: 12 (doze) meses;

  (4) habilitação de instrutor de voo: 12 (doze) meses, com exceção das habilitações relativas
  a

  instrutor de voo de balão livre e planador, que terão validade de 36 (trinta e seis) meses;

  (5) habilitação de piloto agrícola: 24 (vinte e quatro) meses;

  (6) [reservado];

  (7) habilitação de planador: 36 (trinta e seis) meses;

  (8) habilitação de balão livre: 36 (trinta e seis) meses;

  (9) [reservado]; e

  (10) habilitação de dirigível: 12 (doze) meses.

  (Redação dada pela Resolução nº 475, de 07.06.2018)'
