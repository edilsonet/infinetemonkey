title: 61.19(i)
text: '(i) comprovar ter realizado durante o período de validade da habilitação, pelo menos,
  12

  (doze) horas de voo em aeronave da categoria pertinente, das quais, pelo menos, 2 (duas)
  horas devem

  ter sido realizadas em voo de navegação; e

  (ii) cumprir os requisitos de experiência recente pertinentes estabelecidos na seção 61.21

  deste Regulamento;

  (3) para revalidar a habilitação de categoria após expirados sua validade e o prazo de tolerância

  estabelecido na seção 61.33 deste Regulamento, o titular de uma licença de planador ou licença
  de

  balão livre deve ser aprovado em exame de proficiência na categoria apropriada.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
