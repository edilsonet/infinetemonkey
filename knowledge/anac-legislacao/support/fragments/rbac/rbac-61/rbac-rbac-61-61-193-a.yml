section_title: Concessão e revalidação de habilitação de categoria
subsection_id: a
cite: 61.193(a)
title: 61.193(a)
text: '(a) A habilitação de categoria é concedida juntamente com a concessão de uma licença
  de piloto e

  deve corresponder à categoria de aeronave na qual foi realizada a instrução de voo e o exame
  de

  proficiência ou, no caso de licença de aluno piloto, deve corresponder à categoria pertinente
  ao curso

  que o aluno tenha cursado ou esteja cursando.'
