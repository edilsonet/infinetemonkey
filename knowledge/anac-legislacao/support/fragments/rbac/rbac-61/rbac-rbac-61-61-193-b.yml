cite: 61.193(b)
title: 61.193(b)
text: '(b) Revalidação da habilitação de categoria:

  (1) o titular de uma licença de piloto de avião, helicóptero, aeronave de sustentação por
  potência

  ou dirigível terá revalidada sua habilitação de categoria sempre que revalidar uma habilitação
  de

  classe ou de tipo correspondente à categoria de aeronaves da licença da qual seja titular;

  (2) o titular de uma licença de planador ou licença de balão livre pode solicitar a revalidação

  das respectivas habilitações de categoria antes do final do período de validade estabelecido
  na seção'
