cite: 61.195(d)
title: 61.195(d)
text: '(d) Instrução para a concessão da habilitação de classe monomotor anfíbio ou multimotor
  anfíbio:

  ter recebido, no mínimo, 6 (seis) horas de instrução de voo em modelo do avião anfíbio a
  ser usado

  no exame de proficiência, incluindo, pelo menos, 10 (dez) decolagens e 10 (dez) pousos realizados

  na água. A instrução deve incluir, no mínimo, os seguintes aspectos:

  (1) reconhecimento e gerenciamento de ameaças e erros;

  (2) procedimentos anteriores ao voo, incluindo peso e balanceamento e verificação da

  aeronavegabilidade do avião;

  (3) procedimentos quanto ao pouso na água com a aplicação dos conhecimentos de marinhagem

  pertinentes;

  (4) operações em aeródromos e em circuitos de tráfego; precauções e procedimentos de

  prevenção de colisões, inclusive na água;

  (5) controle do avião utilizando referências externas;

  (6) voo em baixas velocidades, reconhecimento e recuperação do pré-estol, estol e recuperação

  de estol;

  (7) voo em altas velocidades e recuperação de picadas;

  (8) decolagens e pousos com ventos de frente e de través;

  (9) voo com referência dos instrumentos, com curvas niveladas de 180 (cento e oitenta) graus

  e 360 (trezentos e sessenta) graus;


  Data da emissão: 20 de março de 2020.


  (10) voo de navegação por contato/estimada entre aeródromos controlados, utilizando

  procedimentos e fraseologia do controle de tráfego aéreo; e

  (11) operações de emergências com falhas simuladas de equipamentos e de um motor da

  aeronave.'
