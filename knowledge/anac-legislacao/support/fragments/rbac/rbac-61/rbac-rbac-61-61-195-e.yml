title: 61.195(e)
text: '(e) Instrução para a concessão das habilitações de classe helicóptero monomotor convencional,

  helicóptero monomotor a turbina e helicóptero multimotor: o solicitante deve ter recebido,
  no

  mínimo, 8 (oito) horas de instrução de voo em helicópteros da classe pertinente que incluam,
  pelo

  menos, 2 (duas) horas de voo em helicóptero do mesmo fabricante e modelo do usado no exame
  de

  proficiência. A instrução deve incluir, no mínimo, os seguintes aspectos:

  (1) estrutura, sistemas e limitações do helicóptero;

  (2) procedimentos anteriores ao voo, incluindo peso e balanceamento e verificação das

  condições gerais de aeronavegabilidade;

  (3) procedimentos normais em solo e em voo;

  (4) procedimentos anormais e de emergência em solo e em voo; e

  (5) procedimentos em caso de falhas de equipamentos e de motor.'
