cite: 61.195(f)
title: 61.195(f)
text: '(f) O instrutor é responsável por declarar que o piloto é competente para realizar,
  de forma segura,

  todas as manobras necessárias para ser aprovado no exame de proficiência para a concessão
  da

  habilitação de classe requerida. Tal declaração terá validade de 30 (trinta) dias, a partir
  da data do

  último voo de preparação para o exame de proficiência.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
