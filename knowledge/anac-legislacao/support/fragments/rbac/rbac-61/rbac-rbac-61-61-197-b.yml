cite: 61.197(b)
title: 61.197(b)
text: '(b) Caso haja mais de uma habilitação de classe averbada na mesma licença:

  (1) a concessão ou revalidação da habilitação de classe avião multimotor terrestre revalida
  a

  habilitação de classe avião monomotor terrestre;

  (2) a concessão ou revalidação da habilitação de classe avião multimotor anfíbio revalida
  a

  habilitação de classe avião monomotor anfíbio; e

  (3) a concessão ou revalidação da habilitação de classe helicóptero multimotor revalida
  as

  habilitações de classe helicóptero monomotor a turbina e helicóptero monomotor convencional.

  (Redação dada pela Resolução nº 504, de 13.02.2019)'
