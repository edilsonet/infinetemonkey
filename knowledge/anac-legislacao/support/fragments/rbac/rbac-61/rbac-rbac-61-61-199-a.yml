section_title: Prerrogativas e limitações do titular de habilitação de categoria e de classe
subsection_id: a
cite: 61.199(a)
title: 61.199(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, as prerrogativas
  do

  titular de uma habilitação de categoria ou de classe são as de pilotar aeronaves da categoria
  ou classe

  na qual tenha se habilitado, na função de piloto em comando ou segundo em comando.'
