section_title: Prerrogativas e limitações do titular de habilitação de categoria e de classe
subsection_id: c
cite: 61.199(c)
title: 61.199(c)
text: '(c) As prerrogativas do titular da habilitação de categoria ou classe deixam de existir
  após

  decorrido o período de validade da habilitação pertinente estabelecido pela seção 61.19
  deste

  Regulamento, considerando-se o prazo de tolerância estabelecido na seção 61.33 deste Regulamento,

  caso não tenha sido realizada a revalidação dessa habilitação de categoria ou classe.

  (Redação dada pela Resolução nº 378, de 18.03.2016)


  Data da emissão: 20 de março de 2020.


  SUBPARTE K

  HABILITAÇÃO DE TIPO'
