title: 61.2(i)
text: '(i) um piloto detentor da habilitação de Instrutor de Voo prevista na Subparte M deste

  Regulamento; ou

  (ii) um piloto designado para ministrar instrução de voo em um operador que possua

  programa de treinamento aprovado pela ANAC, quando ministrando instrução no âmbito da entidade

  a que está vinculado.

  (13) Licença significa o documento emitido pela ANAC que formaliza a certificação de uma

  pessoa para atuar em operações aéreas civis, a partir do cumprimento de requisitos de idade,
  grau de

  instrução, aptidão psicofísica, conhecimentos teóricos, instrução de voo, experiência e
  proficiência,

  verificados de acordo com as funções, limitações e prerrogativas pertinentes à referida
  licença.

  (14) NOTAM (Notice to Airmen - Aviso aos Aeronavegantes) significa um aviso expedido pelo

  Comando da Aeronáutica que contém informações relativas ao estabelecimento, condição ou

  modificação de quaisquer instalações, serviços, procedimentos ou perigos aeronáuticos, cujo
  pronto

  conhecimento seja indispensável ao pessoal ligado às operações de voo.

  (15) Piloto de segurança significa o membro da tripulação habilitado e qualificado em nível
  de

  piloto em comando ou segundo em comando, designado para acompanhar voos de instrução

  realizados em aeronaves certificadas para operação com tripulação mínima de 2 (dois) pilotos.

  (16) Piloto em comando sob supervisão significa o piloto segundo em comando que

  desempenha, sob a supervisão de um piloto em comando devidamente habilitado e qualificado
  pela

  ANAC como instrutor de voo, as funções e responsabilidades do piloto em comando durante
  o voo.

  (17) Publicação de Informações Aeronáuticas (Aeronautical Information Publication - AIP)

  significa a publicação oficial da autoridade aeronáutica que contém informações atualizadas
  sobre

  aspectos essenciais para a navegação aérea.

  (18) Tempo de instrução em duplo comando significa o tempo de voo durante o qual uma pessoa

  recebe instrução de voo ministrada por um instrutor de voo devidamente habilitado e qualificado
  pela

  ANAC e ocupando um dos postos de pilotagem da aeronave.

  (19) Tempo de voo em FSTD significa o tempo durante o qual um piloto pratica em terra e
  sob

  instrução de um instrutor de voo devidamente habilitado e qualificado pela ANAC, voo simulado
  em

  um dispositivo de treinamento aprovado pela ANAC.

  (20) Tempo de voo solo significa o tempo de voo durante o qual o piloto é o único ocupante
  da

  aeronave.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
