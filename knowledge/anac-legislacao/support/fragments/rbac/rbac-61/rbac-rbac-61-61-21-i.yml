cite: 61.21(i)
title: 61.21(i)
text: '(i) no caso de balão livre e planador, no mínimo 1 (uma) decolagem e 1 (uma) aterrissagem,

  durante as quais tenha efetivamente operado os comandos da aeronave da mesma categoria;
  e


  Data da emissão: 20 de março de 2020.


  (ii) no caso das demais aeronaves, no mínimo 3 (três) decolagens e 3 (três) aterrissagens
  no

  período diurno ou noturno, durante as quais tenha efetivamente operado os comandos da aeronave
  da

  mesma categoria e classe/tipo;

  (2) para operações em voo noturno: no mínimo 3 (três) decolagens e 3 (três) aterrissagens
  no

  período noturno, durante as quais tenha efetivamente operado os comandos de aeronave da
  mesma

  categoria e classe/tipo; e

  (3) adicionalmente, para aviões com trem de pouso convencional: no mínimo, 3 (três)

  decolagens e 3 (três) aterrissagens em aviões com trem de pouso convencional, no período
  diurno ou

  noturno.'
