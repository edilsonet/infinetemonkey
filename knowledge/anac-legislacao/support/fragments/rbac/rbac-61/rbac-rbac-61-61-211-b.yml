cite: 61.211(b)
title: 61.211(b)
text: '(b) Para pilotos empregados por operadores que possuam programa de treinamento aprovado
  pela

  ANAC, os treinamentos de solo e de voo para a concessão e revalidação da habilitação de
  tipo devem

  ser feitos nos termos do programa aprovado, não se aplicando, nesse caso, a obrigatoriedade
  de

  treinamento em CTAC prevista nesta subparte.'
