section_title: Revalidação de habilitação de tipo
subsection_id: a
cite: 61.215(a)
title: 61.215(a)
text: '(a) Para revalidar uma habilitação de tipo, o requerente deve:

  (1) ter concluído, com aproveitamento, nos 6 (seis) meses anteriores ao exame de proficiência,

  treinamento de solo e de voo para a revalidação da habilitação referente ao tipo da aeronave
  requerida;

  e

  (2) ser aprovado em exame de proficiência realizado em conformidade com o parágrafo

  61.213(a)(4) deste Regulamento;'
