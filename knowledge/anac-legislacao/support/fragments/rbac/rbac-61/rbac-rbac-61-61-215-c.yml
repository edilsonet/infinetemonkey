cite: 61.215(c)
title: 61.215(c)
text: '(c) Caso não exista, até a data em que o candidato iniciar o treinamento para revalidação,
  CTAC

  certificado ou validado pela ANAC para ministrá-lo, esse treinamento poderá ser ministrado
  por um

  PC ou PLA habilitado e qualificado na aeronave. O treinamento deverá, nesse caso, incluir,
  no

  mínimo, 20% (vinte por cento) das horas de voo previstas nos parágrafos 61.213(a)(3)(iii)(A),

  61.213(a)(3)(iii)(B) ou 61.213(a)(3)(iii)(C), conforme aplicável.'
