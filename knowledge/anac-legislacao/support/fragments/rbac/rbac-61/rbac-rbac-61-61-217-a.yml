section_title: Prerrogativas e limitações do titular de uma habilitação de tipo
subsection_id: a
cite: 61.217(a)
title: 61.217(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, as prerrogativas
  do

  titular de uma habilitação de tipo são as de pilotar aeronaves correspondentes ao tipo na
  qual tenha

  se habilitado, na função de piloto em comando ou segundo em comando, conforme o nível dos

  requisitos atendidos e respeitadas as possíveis limitações indicadas na sua habilitação,
  conforme

  estabelecido no parágrafo 61.5(c) deste Regulamento.'
