section_title: Prerrogativas e limitações do titular de uma habilitação de tipo
subsection_id: b
cite: 61.217(b)
title: 61.217(b)
text: '(b) Quando tratar-se de habilitação de tipo que possua mais de um modelo de aeronave

  correspondente, as prerrogativas do titular da habilitação de tipo limitam-se apenas ao
  modelo da

  aeronave na qual tenha sido realizado o exame de proficiência. Para estar qualificado a
  operar outro


  Data da emissão: 20 de março de 2020.


  modelo de aeronave pertencente à mesma habilitação de tipo, o titular da habilitação deverá
  ter

  recebido o treinamento de diferenças ou de familiarização, conforme aplicável. O treinamento
  de

  diferenças deve ser realizado em CTAC certificado pela ANAC ou, caso este não exista, ministrado

  por um PC ou PLA qualificado no modelo. Já o treinamento de familiarização consiste na leitura
  de

  material técnico que aborde as diferenças entre os modelos de aeronave, não sendo necessária
  a

  obtenção de endosso ou certificado adicional.'
