section_title: Prerrogativas e limitações do titular de uma habilitação de tipo
subsection_id: c
cite: 61.217(c)
title: 61.217(c)
text: '(c) As prerrogativas do titular da habilitação de tipo deixam de existir após decorrido
  o período de

  validade da habilitação pertinente estabelecido pela seção 61.19 deste Regulamento, considerando-se

  o prazo de tolerância estabelecido na seção 61.33 deste Regulamento, caso não tenha sido
  realizada

  a revalidação dessa habilitação de tipo.

  (Redação dada pela Resolução nº 378, de 18.03.2016)


  Data da emissão: 20 de março de 2020.


  SUBPARTE L

  HABILITAÇÃO DE VOO POR INSTRUMENTOS'
