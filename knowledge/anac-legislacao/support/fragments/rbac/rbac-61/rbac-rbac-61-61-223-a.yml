section_title: Concessão de habilitação de voo por instrumentos
subsection_id: a
cite: 61.223(a)
title: 61.223(a)
text: '(a) O candidato a uma habilitação de voo por instrumentos deve cumprir o seguinte:

  (1) pré-requisito: ser titular de uma licença de piloto da categoria para a qual é requerida
  a

  habilitação de voo por instrumentos;

  (2) [reservado]; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (3) ter completado, com aproveitamento, um curso teórico de voo por instrumentos aprovado

  pela ANAC, na categoria apropriada, segundo requisitos estabelecidos pelo RBHA 141 ou RBAC

  que venha a substituí-lo;

  (4) ter sido aprovado em exame teórico da ANAC para a habilitação de voo por instrumentos,

  referente à categoria a que pretenda obter a habilitação;

  (5) instrução de voo: ter recebido de um CIAC certificado pela ANAC, no mínimo, 15 (quinze)

  horas de instrução de voo em duplo comando em aeronave da categoria para qual é requerida
  a

  habilitação de voo por instrumento. A instrução de voo deve incluir, no mínimo, os seguintes

  aspectos: (Redação dada pela Resolução nº 514, de 25.04.2019)'
