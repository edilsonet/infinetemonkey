section_title: Prerrogativa e limitações do titular de uma habilitação de voo por instrumentos
subsection_id: a
cite: 61.227(a)
title: 61.227(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento, a prerrogativa
  do

  titular de uma habilitação de voo por instrumentos é a de pilotar, sob regras de voo por
  instrumentos,

  aeronaves da categoria correspondente à licença em que tenha sido averbada a habilitação
  referida.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
