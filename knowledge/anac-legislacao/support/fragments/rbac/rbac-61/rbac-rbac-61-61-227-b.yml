section_title: Prerrogativa e limitações do titular de uma habilitação de voo por instrumentos
subsection_id: b
cite: 61.227(b)
title: 61.227(b)
text: '(b) Para que a prerrogativa da habilitação de voo por instrumentos possa ser exercida
  em aeronaves

  multimotoras, o solicitante deve ter demonstrado para um examinador credenciado ou INSPAC,
  em

  aeronave desta classe ou tipo, capacidade de operá-la exclusivamente por instrumentos, em
  condições

  simuladas de um motor inoperante.'
