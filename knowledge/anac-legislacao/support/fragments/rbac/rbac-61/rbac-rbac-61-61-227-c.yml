section_title: Prerrogativa e limitações do titular de uma habilitação de voo por instrumentos
subsection_id: c
cite: 61.227(c)
title: 61.227(c)
text: '(c) A prerrogativa do titular da habilitação de voo por instrumentos deixa de existir
  após decorrido

  o período de validade da habilitação pertinente estabelecido pela seção 61.19 deste Regulamento,

  considerando-se o prazo de tolerância estabelecido na seção 61.33 deste Regulamento, caso
  não tenha

  sido realizada a revalidação dessa habilitação de voo por instrumentos.


  Data da emissão: 20 de março de 2020.


  SUBPARTE M

  HABILITAÇÃO DE INSTRUTOR DE VOO'
