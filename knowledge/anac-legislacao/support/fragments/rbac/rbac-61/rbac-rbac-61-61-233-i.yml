section_title: Concessão de habilitação de instrutor de voo
subsection_id: i
cite: 61.233(i)
title: 61.233(i)
text: '(i) no caso de candidato a instrutor de voo de planador, balão livre, aeronave leve
  esportiva

  ou aeronave aerodesportiva portadora de CAVE, ter completado, com aproveitamento, um curso

  teórico de instrutor de voo aprovado pela ANAC, na categoria apropriada, segundo requisitos

  estabelecidos pelo RBHA 141, ou um curso teórico de instrutor de voo realizado em associação

  credenciada pela ANAC segundo o RBAC nº 183 e autorizada a ministrar curso teórico de instrutor

  de voo; e

  (ii) no caso de candidato a instrutor de voo para as demais aeronaves, ter completado, com

  aproveitamento, um curso teórico de instrutor de voo aprovado pela ANAC, na categoria apropriada,

  segundo requisitos estabelecidos pelo RBHA 141;

  (3) ter sido aprovado em exame teórico da ANAC ou aprovado pela ANAC, para a habilitação

  de instrutor de voo referente à categoria a que pretenda obter a habilitação;

  (4) instrução de voo: ter recebido de um CIAC certificado pela ANAC, dentro de um período

  de 3 (três) meses precedentes à solicitação, instrução de voo que deve incluir, no mínimo,
  os seguintes

  aspectos: (Redação dada pela Resolução nº 514, de 25.04.2019)'
