cite: 61.235(a)
title: 61.235(a)
text: '(a) Para revalidar uma habilitação de instrutor de voo, o requerente deve ser aprovado
  em exame

  de proficiência realizado em conformidade com o parágrafo 61.233(a)(6) deste Regulamento,
  em

  aeronave da categoria pertinente à habilitação. (Redação dada pela Resolução nº 378, de
  18.03.2016)'
