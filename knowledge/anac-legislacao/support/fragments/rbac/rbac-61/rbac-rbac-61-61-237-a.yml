section_title: Prerrogativas e limitações do titular de uma habilitação de instrutor de voo
subsection_id: a
cite: 61.237(a)
title: 61.237(a)
text: '(a) Observado o cumprimento dos preceitos estabelecidos neste Regulamento e as condições
  do

  parágrafo (b) desta seção, as prerrogativas do titular de uma habilitação de instrutor de
  voo são:

  (1) supervisionar voos solo de alunos pilotos;

  (2) ministrar instrução de voo para a concessão e revalidação das licenças e habilitações

  previstas neste Regulamento; e

  (3) endossar os registros de voo de pilotos e alunos pilotos nos casos em que um endosso
  seja

  requerido por este Regulamento.'
