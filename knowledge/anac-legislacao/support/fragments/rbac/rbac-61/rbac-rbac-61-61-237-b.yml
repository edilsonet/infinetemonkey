section_title: Prerrogativas e limitações do titular de uma habilitação de instrutor de voo
subsection_id: b
cite: 61.237(b)
title: 61.237(b)
text: '(b) Para poder exercer as prerrogativas estabelecidas pelo parágrafo (a) desta seção,
  um instrutor

  de voo deve:

  (1) ser titular de licença de piloto de graduação igual ou superior à licença para a qual
  a instrução

  estiver sendo ministrada. No caso de instrução ministrada para CPA, o instrutor pode ser
  titular de

  um CPA em lugar de uma licença de piloto; (Redação dada pela Resolução nº 475, de 07.06.2018)

  (2) ser titular de habilitações válidas para as quais a instrução estiver sendo ministrada;

  (3) ser habilitado como piloto em comando da aeronave a ser usada para a instrução de voo
  e

  possuir, nos casos requeridos pelo parágrafo 61.199(b)(1) deste Regulamento, os endossos

  necessários para sua operação;

  (4) para ministrar instrução de voo em aviões multimotores, helicópteros multimotores e

  aeronaves de sustentação por potência, o instrutor deve possuir um mínimo de 15 (quinze)
  horas de

  voo como piloto em comando no mesmo modelo de aeronave para qual pretenda ministrar a instrução

  de voo; e


  Data da emissão: 20 de março de 2020.


  (5) para ministrar instrução de voo por instrumentos, o instrutor deve possuir um mínimo
  de 50

  (cinquenta) horas de voo por instrumentos em comando.'
