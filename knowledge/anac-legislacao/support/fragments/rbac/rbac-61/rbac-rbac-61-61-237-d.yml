title: 61.237(d)
text: '(d) Quando a instrução de voo for realizada em aeronave certificada para operação com
  tripulação

  mínima de 2 (dois) pilotos, um piloto de segurança, devidamente habilitado e qualificado
  para a

  aeronave em questão, deve compor a tripulação.'
