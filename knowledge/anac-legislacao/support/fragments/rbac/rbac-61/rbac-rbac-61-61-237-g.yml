section_title: Prerrogativas e limitações do titular de uma habilitação de instrutor de voo
subsection_id: g
cite: 61.237(g)
title: 61.237(g)
text: '(g) A prerrogativa do titular da habilitação de instrutor de voo deixa de existir após
  decorrido o

  período de validade da habilitação pertinente estabelecido pela seção 61.19 deste Regulamento,

  considerando-se o prazo de tolerância estabelecido na seção 61.33 deste Regulamento, caso
  não tenha

  sido realizada a revalidação dessa habilitação de instrutor de voo.

  (Redação dada pela Resolução nº 378, de 18.03.2016)


  Data da emissão: 20 de março de 2020.


  SUBPARTE N

  HABILITAÇÃO DE PILOTO AGRÍCOLA'
