cite: 61.243(a)
title: 61.243(a)
text: '(a) O candidato a uma habilitação de piloto agrícola deve cumprir o seguinte:

  (1) pré-requisito: ser titular de uma licença de piloto da categoria de aeronave para a
  qual a

  habilitação de piloto agrícola é requerida, com a habilitação correspondente à aeronave
  utilizada para

  a operação agrícola válida;

  (2) ter completado, com aproveitamento, um curso teórico de voo aprovado pela ANAC, na

  categoria apropriada, segundo requisitos estabelecidos pelo RBHA 141 ou RBAC que venha a

  substituí-lo;

  (3) ter sido aprovado, nos últimos 12 (doze) meses, em exame teórico da ANAC referente à

  habilitação de piloto agrícola referente à categoria de aeronave requerida;

  (4) ter concluído, com aproveitamento, um curso prático de piloto agrícola, aprovado pela

  ANAC, para a categoria de aeronave correspondente à licença na qual será averbada a habilitação,

  abrangendo no mínimo os seguintes aspectos:'
