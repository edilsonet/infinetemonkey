cite: 61.245(a)
title: 61.245(a)
text: '(a) Para revalidar uma habilitação de piloto agrícola, o requerente deve ser aprovado
  em exame de

  proficiência realizado em conformidade com os parágrafos 61.243(a)(6) e (7) deste Regulamento,
  em

  aeronave da categoria pertinente à habilitação. (Redação dada pela Resolução nº 378, de
  18.03.2016)'
