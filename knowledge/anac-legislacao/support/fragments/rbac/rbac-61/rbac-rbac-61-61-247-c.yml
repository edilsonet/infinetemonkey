section_title: Prerrogativa e limitações do titular de uma habilitação de piloto agrícola
subsection_id: c
cite: 61.247(c)
title: 61.247(c)
text: '(c) A prerrogativa do titular da habilitação de piloto agrícola deixa de existir após
  decorrido o

  período de validade da habilitação pertinente estabelecido pela seção 61.19 deste Regulamento,

  considerando-se o prazo de tolerância estabelecido na seção 61.33 deste Regulamento, caso
  não tenha

  sido realizada a revalidação dessa habilitação de piloto agrícola.


  Data da emissão: 20 de março de 2020.


