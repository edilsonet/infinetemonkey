cite: 61.289(d)
title: 61.289(d)
text: '(d) O candidato a um CPA deve apresentar, para fins de comprovação de experiência,
  declaração

  de um CIAC certificado pela ANAC ou do instrutor de voo habilitado informando as horas de
  voo e,

  se for o caso, também os pousos registrados junto a estas entidades.'
