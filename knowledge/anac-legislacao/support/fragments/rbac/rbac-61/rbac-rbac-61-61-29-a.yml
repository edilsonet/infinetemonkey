title: 61.29(a)
text: '(a) Somente serão aceitos para fins de comprovação de experiência de voo os seguintes

  documentos:

  (1) CIV;


  Data da emissão: 20 de março de 2020.


  (2) CIV Digital; ou

  (3) Declaração de Horas de Voo, constando os dados extraídos de relatório de registro

  individual de horas de voo.

  (Redação dada pela Resolução nº 378, de 18.03.2016)'
