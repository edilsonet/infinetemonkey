cite: 61.29(c)
title: 61.29(c)
text: '(c) Para fins de contagem das horas de voo, para concessão de uma licença de piloto
  de grau

  superior, o titular de uma licença de piloto quando atuar como segundo em comando de uma
  aeronave

  certificada para operação com tripulação mínima de 2 (dois) pilotos, deve registrar integralmente
  as

  horas de voo nesta função.'
