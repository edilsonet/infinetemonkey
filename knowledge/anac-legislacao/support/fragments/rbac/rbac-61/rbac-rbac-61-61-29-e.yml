title: 61.29(e)
text: '(e) No caso do estabelecido no parágrafo (d) desta seção, o segundo em comando pode
  registrar

  integralmente as horas de voo se a aeronave possuir uma posição de segundo em comando

  devidamente equipada para operar com segundo em comando. (Redação dada pela Resolução nº
  378,

  de 18.03.2016)'
