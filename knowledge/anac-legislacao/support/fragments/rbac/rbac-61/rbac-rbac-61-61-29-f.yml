cite: 61.29(f)
title: 61.29(f)
text: '(f) Para fins de contagem das horas de voo requeridas para concessão de uma licença
  de piloto de

  grau superior, o titular de uma licença de piloto, quando atuar como piloto em comando sob

  supervisão em uma aeronave certificada para operação com tripulação mínima de 2 (dois) pilotos,

  deve registrar as horas totais do voo.'
