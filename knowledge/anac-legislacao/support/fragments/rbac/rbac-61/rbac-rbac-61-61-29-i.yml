text: '(i) As horas de voo realizadas em aeronaves experimentais, quando registradas na CIV
  ou na CIV

  Digital, devem ser identificadas com anotações no campo “Observações”. Tais horas podem
  ser

  consideradas para cumprimento de requisitos de experiência recente, conforme estabelecido
  na seção'
