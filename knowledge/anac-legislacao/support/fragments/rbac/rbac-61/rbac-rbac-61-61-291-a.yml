section_title: Requisitos de proficiência para a concessão do CPA
subsection_id: a
cite: 61.291(a)
title: 61.291(a)
text: '(a) O candidato a um CPA deve demonstrar, em exame de proficiência, sua capacidade
  para

  executar, como piloto em comando de aeronave leve esportiva ou aeronave aerodesportiva portadora

  de CAVE da categoria em que é solicitado o certificado, os procedimentos e manobras especificados

  no parágrafo relativo à instrução de voo pertinente, com um grau de competência apropriado
  às

  prerrogativas que o CPA confere ao seu titular, e para:

  (1) reconhecer e gerenciar ameaças e erros;

  (2) operar a aeronave dentro de suas limitações de emprego;

  (3) executar todas as manobras com suavidade e precisão;

  (4) revelar bom julgamento e aptidão de pilotagem;

  (5) aplicar os conhecimentos aeronáuticos; e


  Data da emissão: 20 de março de 2020.


  (6) manter controle da aeronave durante todo o tempo do voo, de modo que não ocorram

  dúvidas quanto ao êxito de algum procedimento ou manobra.'
