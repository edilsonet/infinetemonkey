cite: 61.293(a)
title: 61.293(a)
text: '(a) Os Certificados de Piloto Desportivo (CPD) e Certificados de Piloto de Recreio
  (CPR) são

  considerados válidos enquanto pelo menos uma de suas habilitações correspondentes permanecer

  dentro de seu período de vigência.

  (1) Em caráter transitório, para que os portadores de CPD ou CPR recebam instrução

  complementar e obtenham o CPA, serão considerados válidos os Certificados de Piloto Desportivo

  (CPD), os Certificados de Piloto de Recreio (CPR) e respectivas habilitações vencidas por
  até um ano

  a contar da data da publicação desta emenda.'
