cite: 61.293(c)
title: 61.293(c)
text: '(c) As aeronaves enquadradas em categoria superior à aeronave leve esportiva, de acordo
  com os

  requisitos estabelecidos no RBAC 21, somente poderão ser operadas por titular de licença
  de piloto

  devidamente habilitado e qualificado, respeitada as regras de transição estabelecidas nos
  parágrafos'
