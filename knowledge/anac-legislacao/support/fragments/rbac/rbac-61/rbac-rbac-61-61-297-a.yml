section_title: Prerrogativas do titular de CPA e condições que devem ser observadas para exercê-las
subsection_id: a
cite: 61.297(a)
title: 61.297(a)
text: '(a) As prerrogativas do titular de um CPA limitam-se a atuar, durante horário diurno
  e apenas sob

  condições visuais de voo, como piloto em comando de aeronave leve esportiva ou aeronave

  aerodesportiva portadora de CAVE apropriadas à(s) habilitação(ões) averbada(s) em seu certificado.'
