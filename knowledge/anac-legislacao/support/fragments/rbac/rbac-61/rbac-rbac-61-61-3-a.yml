title: 61.3(a)
text: '(a) Licença/certificado e habilitações de piloto: só pode atuar como piloto em comando
  ou segundo

  em comando a bordo de aeronaves civis registradas no Brasil quem seja titular e esteja portando
  uma

  licença/certificado de piloto com suas habilitações válidas, expedidas em conformidade com
  este


  Data da emissão: 20 de março de 2020.


  Regulamento, e apropriadas à aeronave operada, à operação realizada e à função que desempenha
  a

  bordo.'
