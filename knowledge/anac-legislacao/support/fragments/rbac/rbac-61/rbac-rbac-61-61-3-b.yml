cite: 61.3(b)
title: 61.3(b)
text: '(b) Licenças, habilitações e certificados médicos de pilotos de aeronave estrangeira:
  ninguém pode

  atuar no espaço aéreo brasileiro como membro de tripulação de voo de aeronave estrangeira,
  a menos

  que seja titular de licença com suas habilitações apropriadas e certificado médico, ambos
  válidos,

  expedidos ou validados pelo país de matrícula da aeronave.'
