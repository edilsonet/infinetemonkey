cite: 61.3(e)
title: 61.3(e)
text: '(e) Habilitação de instrutor de voo: o titular de uma habilitação de instrutor de voo
  somente pode

  ministrar instrução de voo na categoria de aeronaves relativa à licença em que tenha sido
  averbada

  esta habilitação e em conformidade com as demais habilitações de classe, tipo ou operação
  válidas

  das quais seja, também, titular habilitado em nível de piloto em comando.'
