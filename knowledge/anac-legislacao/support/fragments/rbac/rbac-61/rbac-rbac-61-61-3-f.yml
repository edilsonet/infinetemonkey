title: 61.3(f)
text: '(f) Inspeção de licenças e certificados: toda pessoa que seja titular de uma licença
  ou certificado

  expedido em conformidade com este Regulamento deve apresentá-lo para inspeção sempre que

  requisitado pelos Inspetores de Aviação Civil - INSPAC da ANAC.'
