cite: 61.3(g)
title: 61.3(g)
text: '(g) Conforme normas específicas do Comando da Aeronáutica, todo titular de licença
  de piloto,

  ao participar ou tomar conhecimento de qualquer acidente ou incidente aeronáutico ou ocorrência
  de

  solo, ou da existência de destroços de aeronave, deve comunicá-lo imediatamente à autoridade

  pública mais próxima.'
