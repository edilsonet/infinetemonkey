title: 61.3(l)
text: '(l) Os voos de instrução previstos neste Regulamento devem ter como única finalidade
  a instrução

  do piloto, não sendo permitido o transporte de passageiros ou cargas, ou a realização de
  outros

  serviços aéreos durante a instrução. (Incluído pela Resolução nº 344, de 17.09.2014)'
