cite: 61.31(h)
title: 61.31(h)
text: '(h) Para realizar operações como piloto lançador de paraquedista, um instrutor habilitado
  deverá

  endossar a CIV do piloto atestando a sua capacidade para realizar a operação, desde que
  o piloto:

  (1) seja detentor de uma licença de piloto, com a habilitação correspondente à aeronave

  utilizada para a operação de lançamento de paraquedista;

  (2) tenha pelo menos 100 horas em comando no modelo de aeronave que pretende utilizar para

  a atividade de lançamento de paraquedista; e

  (3) tenha recebido instrução específica, em solo e em voo, para a realização de operações
  de

  lançamento de paraquedista com um instrutor habilitado, incluindo a execução de três lançamentos

  acompanhado do instrutor e mais três lançamentos em voo solo.

  (Incluído pela Resolução nº 475, de 07.06.2018)'
