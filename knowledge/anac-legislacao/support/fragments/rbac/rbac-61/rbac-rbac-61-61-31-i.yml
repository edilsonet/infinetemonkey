section_title: CIV e CIV Digital (Redação dada pela Resolução nº 378, de 18.03.2016)
subsection_id: i
cite: 61.31(i)
title: 61.31(i)
text: '(i) as horas de voo realizadas em instrução devem ser registradas pelo instrutor de
  voo que

  ministrou a instrução, informando um resumo da instrução, a liberação do aluno piloto para
  realizar

  voo solo (quando aplicável), o CANAC, nome e assinatura;

  (ii) as horas realizadas no exame de proficiência devem ser registradas pelo INSPAC ou

  examinador credenciado responsável por tal exame, que informará se o aluno piloto foi aprovado
  ou

  reprovado, seu CANAC, nome e assinatura;

  (iii) as pessoas citadas nos parágrafos (c)(5)(i) e (c)(5)(ii) desta seção que preencherem
  ou

  endossarem um lançamento na CIV ou CIV Digital com informações ou dados inexatos ou

  adulterados ficam sujeitas às providências administrativas previstas na Lei nº 7.565/86
  - Código

  Brasileiro de Aeronáutica (CBA) ou na legislação complementar, além das sanções penais e
  civis

  cabíveis, uma vez que tal fato poderá comprometer a segurança de voo; e (Redação dada pela

  Resolução nº 378, de 18.03.2016)

  (iv) uma vez comprovado, no caso do parágrafo (c)(5)(iii) desta seção, que o instruendo

  estava de acordo com as irregularidades, sendo beneficiado com as informações registradas,
  este

  também ficará exposto às sanções penais e civis cabíveis.'
