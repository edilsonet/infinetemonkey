section_title: Prazo e tolerância para revalidação de habilitação
subsection_id: a
cite: 61.33(a)
title: 61.33(a)
text: '(a) Desde que cumpridos os requisitos aplicáveis à revalidação de uma habilitação,
  o exame de

  proficiência pertinente a essa revalidação pode ser realizado no período que compreende
  30 (trinta)

  dias antes do início do mês de vencimento até 30 (trinta) dias após o fim do mês de vencimento,

  mantendo-se, após concluída a revalidação, o mês base de vencimento para a nova validade.'
