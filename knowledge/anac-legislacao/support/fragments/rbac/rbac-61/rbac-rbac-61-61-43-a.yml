section_title: Concessão de licenças a estrangeiros
subsection_id: a
cite: 61.43(a)
title: 61.43(a)
text: '(a) Podem ser concedidas licenças e certificados, de acordo com os preceitos das subpartes
  C, D,

  E, F, G, H, I e R deste Regulamento, aos estrangeiros que tenham atendido no Brasil aos
  requisitos

  para tais concessões, desde que sua situação no País esteja regularizada para permanência
  definitiva

  ou temporária. (Redação dada pela Resolução nº 475, de 07.06.2018)'
