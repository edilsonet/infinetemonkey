section_id: '61.43'
section_title: Concessão de licenças a estrangeiros
subsection_id: b
cite: 61.43(b)
title: 61.43(b)
text: '(b) As licenças de piloto comercial, de tripulação múltipla ou de linha aérea podem
  ser concedidas

  a estrangeiros nos termos do parágrafo (a) desta seção. Entretanto, as mesmas devem ser
  expedidas

  com a ressalva de que o seu titular não pode exercer função remunerada a bordo de aeronave
  de

  matrícula brasileira, conforme disposto no §1º do art. 156 do CBA.'
