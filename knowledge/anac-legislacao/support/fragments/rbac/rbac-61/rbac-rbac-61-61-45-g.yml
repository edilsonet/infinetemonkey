title: 61.45(g)
text: '(g) O candidato a uma convalidação de licença de piloto de linha aérea na categoria
  avião ou

  aeronave de sustentação por potência deve cumprir, adicionalmente, os requisitos para a
  concessão

  (seja por convalidação ou pela via normal) da habilitação de voo por instrumentos correspondente.'
