title: 61.45(h)
text: '(h) As habilitações convalidadas têm prazos de validade compatíveis com os documentos

  originais, desde que tais prazos não sejam superiores aos prazos correlatos estabelecidos
  neste

  Regulamento, quando devem prevalecer os prazos brasileiros.'
