title: 61.45(i)
text: '(i) As habilitações constantes de licenças emitidas nos termos do parágrafo (e) desta
  seção, quando

  vencidas ou por vencer, devem ser revalidadas em conformidade com os requisitos aplicáveis

  estabelecidos neste Regulamento. (Redação dada pela Resolução nº 378, de 18.03.2016)'
