cite: 61.45(k)
title: 61.45(k)
text: '(k) Para os fins de convalidação, o solicitante deverá cumprir os seguintes requisitos:

  (1) possuir experiência recente, nos termos da seção 61.21 deste Regulamento, na(s)

  habilitação(ões) que deseja convalidar, demonstrada pela CIV ou outro documento correspondente;

  (2) ser aprovado em exame teórico de regulamentos aeronáuticos;

  (3) ser capaz de ler, escrever, falar e compreender o idioma português em um nível de

  competência apropriado às atribuições e responsabilidades que a autorização ou licença a
  ser

  concedida lhe confere;

  (4) demonstrar competência para falar e compreender o idioma inglês pelo menos em nível

  operacional (atingir Nível 4 ou superior), exceto para as licenças de piloto de planador
  e piloto de

  balão livre. Caso não demonstre, será averbada em sua licença a restrição relativa ao parágrafo

  61.10(c)(2) deste Regulamento; e (Redação dada pela Resolução nº 378, de 18.03.2016)

  (5) ser aprovado em exame de proficiência, com exceção da convalidação realizada com

  prerrogativas, no Brasil, equivalentes as de piloto privado.'
