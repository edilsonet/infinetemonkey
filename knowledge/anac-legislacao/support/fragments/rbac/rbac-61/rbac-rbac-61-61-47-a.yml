section_title: Concessão de licença para oficiais aviadores das Forças Armadas Brasileiras
subsection_id: a
cite: 61.47(a)
title: 61.47(a)
text: '(a) Generalidades:

  (1) aos oficiais aviadores da ativa ou da reserva das Forças Armadas Brasileiras pode ser

  concedida a licença de piloto, na graduação correspondente ao nível de experiência técnica
  do

  solicitante, CPA, bem como habilitações relativas a aeronaves, operação de voo por instrumentos
  e


  Data da emissão: 20 de março de 2020.


  operação de instrutor de voo, de acordo com os requisitos constantes nesta seção; (Redação
  dada pela

  Resolução nº 475, de 07.06.2018)

  (2) o requisito de experiência técnica necessário à concessão de determinada licença deve
  ser

  considerado pelo número total de horas de voo do solicitante, considerando os mínimos requeridos

  neste Regulamento;

  (3) as habilitações devem ser concedidas em conformidade com os registros militares do

  solicitante para as aeronaves ou tipos de operação em que tenha sido habilitado como piloto
  em

  comando e que tenham correspondência no âmbito da aviação civil e somente serão concedidas
  com

  validade se cumpridas as disposições contidas nos parágrafos (b) ou (c) desta seção, caso
  contrário,

  serão concedidas com validade da data de sua emissão;

  (4) o candidato a uma concessão por experiência militar de licença de piloto de linha aérea
  na

  categoria avião ou aeronave de sustentação por potência deve cumprir, adicionalmente, os
  requisitos

  para a concessão (seja por experiência militar ou pela via normal) da habilitação de voo
  por

  instrumentos correspondente;

  (5) em todos os casos, exige-se que o solicitante seja titular do CMA válido e correspondente
  à

  licença e/ou habilitação solicitada, de acordo com os requisitos estabelecidos no RBAC 67;
  e

  (6) para o candidato a uma concessão por experiência militar que pretenda operar uma aeronave

  civil brasileira fora da jurisdição do espaço aéreo brasileiro, deve cumprir com os requisitos
  previstos

  na seção 61.10 deste Regulamento.'
