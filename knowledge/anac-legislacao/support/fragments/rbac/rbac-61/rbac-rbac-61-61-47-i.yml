section_title: Concessão de licença para oficiais aviadores das Forças Armadas Brasileiras
subsection_id: i
cite: 61.47(i)
title: 61.47(i)
text: '(i) apresentar evidência de sua condição de piloto militar, assim como registros de
  horas de

  voo devidamente classificadas conforme as exigências de experiência aeronáutica da licença
  e/ou

  habilitação aplicável, que inclua detalhes de aeronaves envolvidas, e emitida por meio de
  documento

  oficial da força armada pertinente; e

  (ii) apresentar evidências de cumprimento, com aproveitamento, de um programa de

  instrução teórica e prática da aeronave ou operação para a qual se requer a habilitação,
  que não exceda

  12 (doze) meses; e

  (A) Fica dispensado da realização do curso de instrução mencionado no parágrafo anterior

  o oficial aviador das Forças Armadas Brasileiras candidato ao CPA. (Incluído pela Resolução
  nº 475,

  de 07.06.2018)

  (2) a validade da habilitação será estabelecida de acordo com os preceitos deste Regulamento,

  considerando-se como data de início do período de validade a data de conclusão do treinamento

  prático estabelecido no parágrafo (b)(1)(ii) desta seção.'
