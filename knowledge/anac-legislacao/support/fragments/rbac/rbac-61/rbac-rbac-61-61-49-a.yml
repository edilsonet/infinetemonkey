section_title: Concessão de uma habilitação de tipo ao piloto de ensaio em voo
subsection_id: a
cite: 61.49(a)
title: 61.49(a)
text: '(a) Ao término de um programa de certificação de tipo bem sucedido, os pilotos de ensaios
  em

  voo que participaram efetivamente de todo o processo de desenvolvimento e de avaliação da
  aeronave

  fazem jus à habilitação de tipo correspondente a essa aeronave.'
