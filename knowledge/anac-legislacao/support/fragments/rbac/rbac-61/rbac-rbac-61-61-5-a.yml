cite: 61.5(a)
title: 61.5(a)
text: '(a) São concedidas as seguintes licenças, nos termos deste Regulamento, para o desempenho
  de

  funções de piloto:

  (1) aluno piloto;

  (2) piloto privado;

  (3) piloto comercial;

  (4) piloto de tripulação múltipla;

  (5) piloto de linha aérea;

  (6) piloto de planador; e

  (7) piloto de balão livre.'
