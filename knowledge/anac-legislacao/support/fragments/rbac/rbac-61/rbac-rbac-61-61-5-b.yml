text: '(b) São averbadas nas licenças indicadas no parágrafo (a) desta seção, as seguintes
  habilitações:

  (1) habilitações de categoria: as habilitações de categoria integram a denominação da graduação

  de todas as licenças e são regidas pelas prerrogativas e condições estabelecidas para a
  licença

  respectiva. São, ainda, averbadas nas licenças de piloto de planador, e balão livre, com
  a finalidade

  de estabelecer prazos de validade. As habilitações de categoria compreendem:'
