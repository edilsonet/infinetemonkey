text: '(f) O candidato detentor de CMA emitido sob as condições do parágrafo 67.101(e), 67.141(d),

  67.221(c) ou 67.261(e) do RBAC nº 67:

  (1) não pode obter as licenças de piloto de linha aérea ou piloto de tripulação múltipla;


  Data da emissão: 20 de março de 2020.


  (2) não pode obter a habilitação de voo por instrumentos;

  (3) antes do primeiro voo solo, deverá ser submetido a um exame prático especial por modelo

  de aeronave e ser aprovado, para verificação da capacidade do candidato de:'
