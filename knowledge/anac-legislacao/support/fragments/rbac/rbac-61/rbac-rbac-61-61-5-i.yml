title: 61.5(i)
text: '(i) reconhecer a perda de potência ou falha de motor a partir da alteração da vibração
  e das

  informações dos instrumentos;

  (ii) reconhecer a aproximação do estol por vibração aerodinâmica e indicadores visuais;
  e

  (iii) reconhecer emergências com um trem de pouso retrátil pela observação das luzes de

  trem de pouso (se aplicável);

  (4) a licença ou certificados, quando emitidos, constará a seguinte observação: "Não válido
  para

  voos que requeiram a utilização de rádio comunicação";

  (5) uma vez concedida a licença ou certificado, o piloto não poderá realizar operações:'
