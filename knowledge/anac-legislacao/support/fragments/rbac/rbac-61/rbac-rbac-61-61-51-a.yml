cite: 61.51(a)
title: 61.51(a)
text: '(a) Esta subparte estabelece os requisitos a serem atendidos para a concessão de uma
  licença de

  aluno piloto, assim como as prerrogativas e condições para o exercício das funções pertinentes.
  É

  considerado aluno piloto o solicitante de uma licença de piloto de planador, piloto de balão
  livre ou

  piloto privado de determinada categoria que não possua qualquer outra licença de piloto
  de aeronave

  na mesma categoria.'
