section_title: Requisitos gerais para a concessão da licença de aluno piloto
subsection_id: a
cite: 61.53(a)
title: 61.53(a)
text: '(a) O candidato a uma licença de aluno piloto deve:

  (1) ter completado 18 (dezoito) anos. Uma licença de aluno piloto pode ser concedida a

  requerentes com 16 (dezesseis) anos completos, desde que este apresente um termo de compromisso

  e responsabilidade assinado pelo responsável, com firma reconhecida em cartório, e onde
  esteja

  expresso neste termo que o responsável autoriza o aluno piloto a iniciar o treinamento de
  voo e se

  responsabiliza pelos atos do aluno piloto; e

  (2) ter concluído ou, pelo menos, estar cursando o ensino médio.'
