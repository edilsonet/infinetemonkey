section_title: Requisitos de conhecimentos teóricos para a concessão da licença de aluno piloto
subsection_id: a
cite: 61.57(a)
title: 61.57(a)
text: '(a) O candidato a uma licença de aluno piloto deve ter concluído, com aproveitamento,
  ou estar

  matriculado em cursos teóricos de piloto privado, piloto de planador ou piloto de balão
  livre,

  aprovados pela ANAC, respeitada a categoria da licença pretendida.'
