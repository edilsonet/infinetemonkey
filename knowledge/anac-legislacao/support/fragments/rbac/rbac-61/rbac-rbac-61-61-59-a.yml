section_title: Requisitos de instrução de voo para a concessão da licença de aluno piloto
subsection_id: a
cite: 61.59(a)
title: 61.59(a)
text: '(a) O candidato a uma licença de aluno piloto deve estar matriculado em cursos práticos
  de piloto

  privado, piloto de planador ou piloto de balão livre, aprovados pela ANAC, respeitada a
  categoria da

  licença pretendida.'
