section_title: Requisitos para o voo solo de aluno piloto
subsection_id: d
cite: 61.61(d)
title: 61.61(d)
text: '(d) Para qualquer categoria de aeronave: o aluno piloto deve ter recebido instrução
  de voo antes

  do voo solo nos seguintes tópicos, quando aplicável:

  (1) os procedimentos da preparação do voo, incluindo as inspeções prévias ao voo, a operação

  do motor e os sistemas da aeronave;

  (2) taxiamento e operações na superfície do aeroporto, incluindo as provas de verificação
  de

  potência ou verificação de motor;

  (3) decolagens e aterrissagens, incluindo aterrissagens normais e com vento de través;

  (4) voo reto e nivelado, curvas de pequena, média e grande inclinação em ambas as direções;

  (5) subidas na reta e curvas em ascensão;

  (6) circuitos de tráfego aéreo, incluindo procedimentos de entrada e de saída, maneiras
  de evitar

  colisões e turbulência de esteira de aeronave;

  (7) descidas em reta e em curva;

  (8) voos com diferentes velocidades, desde a de cruzeiro à velocidade mínima de controle;

  (9) procedimentos de emergências e falhas de funcionamento de equipamentos; e

  (10) manobras com referências em solo.'
