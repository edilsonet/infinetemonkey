section_title: Requisitos para o voo solo de aluno piloto
subsection_id: e
cite: 61.61(e)
title: 61.61(e)
text: '(e) Para aviões: além das manobras e procedimentos previstos no parágrafo (d) desta
  seção, o aluno

  piloto deve ter recebido instrução ou treinamento de voo antes do voo solo em:

  (1) aproximações para aterrissagem com a potência do motor em marcha lenta e com potência

  parcial;

  (2) planeio para a aterrissagem;

  (3) aproximações perdidas a partir da aproximação final, e toque do avião na pista com

  configurações de voo diferentes;

  (4) procedimentos de aterrissagens forçadas, a partir de uma decolagem, na subida inicial;
  no

  voo de cruzeiro; na descida e no tráfego para aterrissagem; e

  (5) entradas de estol a partir de diversas atitudes e combinações de potência, com a recuperação

  iniciando-a à primeira indicação do estol e recuperação de um estol completo.'
