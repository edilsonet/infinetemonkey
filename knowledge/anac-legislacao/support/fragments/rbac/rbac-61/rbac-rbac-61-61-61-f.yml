cite: 61.61(f)
title: 61.61(f)
text: '(f) Para helicópteros: além das manobras e procedimentos previstos no parágrafo (d)
  desta seção

  e de acordo com o que permita o desempenho, as características e as limitações da aeronave,
  o aluno

  piloto deve ter recebido instrução de voo antes do voo solo em:

  (1) aproximações para a aterrissagem;

  (2) taxiamento aéreo e manobras próximas ao solo, incluindo giros;


  Data da emissão: 20 de março de 2020.


  (3) aproximações perdidas a partir de uma aterrissagem com aproximação em voo pairado e
  a

  partir de uma aproximação final;

  (4) procedimentos de emergências simuladas, incluindo descidas em autorrotação finalizadas

  com recuperação de potência ou aterrissagens, recuperação de potência em voo pairado em
  um

  helicóptero monomotor, ou aproximações em voo pairado com um motor inoperante em um

  helicóptero multimotor; e

  (5) desacelerações rápidas.'
