cite: 61.61(h)
title: 61.61(h)
text: '(h) Para planadores: além das manobras e procedimentos apropriados previstos no parágrafo
  (d)

  desta seção, o aluno piloto dever ter recebido instrução de voo antes do voo solo em:

  (1) inspeção pré-voo do aparelho e do cabo de reboque, revisão dos sinais e os procedimentos

  a serem utilizados para soltar o planador do reboque;

  (2) reboque aéreo e em solo ou auto lançamento;

  (3) princípios de amarração e liberação do planador;

  (4) entradas de estol a partir de diversas atitudes com a recuperação iniciando-a à primeira

  indicação do estol e recuperação de um estol completo;

  (5) planeios em reta, em curva e em espiral;

  (6) planeio para a aterrissagem;

  (7) procedimentos e técnicas para uso das correntes térmicas em sustentação convergente
  ou de

  ladeira, conforme apropriado para a área da instrução; e

  (8) procedimentos de emergência que incluam procedimentos de corte do cabo de reboque.'
