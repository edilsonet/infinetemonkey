text: '(j) A instrução de voo requerida nesta seção deve ser ministrada por um instrutor de
  voo,

  devidamente habilitado e qualificado, vinculado à instituição que ministra o curso prático
  aprovado

  pela ANAC no qual o aluno piloto estiver matriculado.'
