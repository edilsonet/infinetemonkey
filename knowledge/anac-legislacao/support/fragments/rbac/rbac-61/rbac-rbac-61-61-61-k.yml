section_title: Requisitos para o voo solo de aluno piloto
subsection_id: k
cite: 61.61(k)
title: 61.61(k)
text: '(k) Autorizações do instrutor de voo: nenhum aluno piloto pode operar uma aeronave
  em voo solo,

  a menos que esteja autorizado pelo seu instrutor a realizar tal voo. A citada autorização
  deverá ser

  averbada no registro de voo (CIV) do aluno piloto. O registro da autorização do instrutor
  deve

  certificar que ele:

  (1) tenha proporcionado ao aluno a instrução de voo na marca e modelo da aeronave em que
  se

  realizará o voo solo;

  (2) tenha informado que o aluno reúne os requisitos de instrução estabelecidos nesta seção;
  e

  (3) tenha determinado que o aluno esteja capacitado para realizar o voo solo de forma segura

  na aeronave.'
