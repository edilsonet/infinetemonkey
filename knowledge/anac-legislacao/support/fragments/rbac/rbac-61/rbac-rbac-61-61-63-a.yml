section_title: Limitações do aluno piloto
subsection_id: a
cite: 61.63(a)
title: 61.63(a)
text: '(a) Um aluno piloto não pode atuar como piloto em comando de uma aeronave:

  (1) que transporte passageiros;

  (2) que transporte carga por compensação ou arrendamento;

  (3) em voos por compensação ou arrendamento;

  (4) em promoções comerciais;

  (5) em voos internacionais;

  (6) com uma visibilidade em voo e terrestre menor que 5 (cinco) quilômetros;

  (7) quando o voo não puder ser realizado em condições VMC; ou

  (8) em desconformidade com qualquer possível limitação anotada pelo instrutor de voo em
  seus

  registros de voo.'
