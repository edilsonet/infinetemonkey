title: 61.67(a)
text: '(a) Generalidades: exceto em casos de emergência ou força maior, nenhum aluno piloto
  pode

  pilotar uma aeronave em voo solo de navegação, nem pode realizar uma aterrissagem em qualquer


  Data da emissão: 20 de março de 2020.


  ponto, exceto o aeroporto ou aeródromo de decolagem, a menos que o aluno reúna os requisitos
  desta

  seção.'
