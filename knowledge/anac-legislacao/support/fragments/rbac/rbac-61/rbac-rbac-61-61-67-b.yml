cite: 61.67(b)
title: 61.67(b)
text: '(b) Instrução de voo: o aluno piloto, além da instrução de voo em manobras e procedimentos
  antes

  do voo solo, deve ter recebido a instrução dada por seu instrutor de voo das manobras e
  procedimentos

  apropriados desta seção em relação à licença a que aspira. Adicionalmente, um aluno piloto
  deve

  demonstrar um nível aceitável de desempenho, a juízo do instrutor de voo que indicará em
  seus

  registros de voo (CIV), a realização das manobras e procedimentos de pilotagem abaixo indicadas:

  (Redação dada pela Resolução nº 378, de 18.03.2016)

  (1) para todas as categorias de aeronaves:'
