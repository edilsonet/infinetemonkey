cite: 61.77(a)
title: 61.77(a)
text: '(a) O candidato a uma licença de piloto privado deve ter sido aprovado em exame teórico
  da ANAC

  para a licença de piloto privado referente à categoria em que pretenda obter a licença.
  (Redação dada

  pela Resolução nº 378, de 18.03.2016)'
