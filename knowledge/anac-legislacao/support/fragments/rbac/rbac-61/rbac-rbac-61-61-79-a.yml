section_title: Requisitos de instrução de voo para a concessão da licença de piloto privado
subsection_id: a
cite: 61.79(a)
title: 61.79(a)
text: '(a) O candidato a uma licença de piloto privado deve ter recebido instrução de voo
  em um CIAC

  certificado pela ANAC. Ao término da instrução, o instrutor de voo é responsável por endossar
  a CIV

  do aluno, declarando que este é competente para realizar, de forma segura, todas as manobras

  necessárias para ser aprovado no exame de proficiência para a concessão da licença de piloto
  privado.

  Tal declaração terá validade de 30 (trinta) dias, a partir da data do último voo de preparação
  para o

  exame de proficiência. O conteúdo da instrução de voo deverá ser, no mínimo, o seguinte:
  (Redação

  dada pela Resolução nº 475, de 07.06.2018)

  (1) categoria avião:'
