subsection_id: a
cite: 61.85(a)
title: 61.85(a)
text: '(a) As prerrogativas do titular de uma licença de piloto privado limitam-se a atuar,
  sem

  remuneração, como piloto em comando ou segundo em comando de aeronave da categoria apropriada

  à sua licença e que realize voos não remunerados e sem qualquer tipo de aproveitamento comercial.'
