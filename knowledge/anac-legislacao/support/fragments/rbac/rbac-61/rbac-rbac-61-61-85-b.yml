title: 61.85(b)
text: '(b) O exercício das prerrogativas da licença de piloto privado à noite é condicionado
  ao

  atendimento, pelo seu titular, à realização de instrução duplo comando em voo noturno, incluindo

  decolagens, aterrissagens e navegação.'
