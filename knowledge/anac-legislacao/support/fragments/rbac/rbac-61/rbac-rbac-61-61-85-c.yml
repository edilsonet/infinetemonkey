text: '(c) O exercício das prerrogativas da licença de piloto privado em voos internacionais
  é

  condicionado ao atendimento, pelo seu titular, aos requisitos estabelecidos na seção 61.10
  deste

  Regulamento.


  Data da emissão: 20 de março de 2020.


  SUBPARTE E

  LICENÇA DE PILOTO COMERCIAL'
