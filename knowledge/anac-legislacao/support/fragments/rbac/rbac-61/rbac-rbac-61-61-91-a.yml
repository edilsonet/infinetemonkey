text: '(a) Esta subparte estabelece os requisitos a serem atendidos para a concessão da licença
  de piloto

  comercial nas categorias avião, helicóptero, aeronave de sustentação por potência e dirigível,
  assim

  como as prerrogativas e condições para o exercício das funções pertinentes.'
