section_title: Requisitos gerais para a concessão da licença de piloto comercial
subsection_id: a
cite: 61.93(a)
title: 61.93(a)
text: '(a) O candidato a uma licença de piloto comercial deve:

  (1) ter completado 18 (dezoito) anos;

  (2) ter concluído o ensino médio; e

  (3) ser titular de licença de piloto privado na categoria de aeronave pretendida.'
