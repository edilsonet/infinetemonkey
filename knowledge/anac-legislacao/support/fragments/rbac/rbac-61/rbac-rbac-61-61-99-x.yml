section_title: Requisitos de instrução de voo para a concessão da licença de piloto comercial
subsection_id: x
cite: 61.99(x)
title: 61.99(x)
text: '(x) voo de navegação por referências visuais, navegação estimada e, quando disponível,
  com

  auxílio de rádio navegação, incluindo um voo de pelo menos 1 (uma) hora;

  (xi) operações de emergência, incluindo falhas simuladas de equipamentos do helicóptero;

  aproximação e aterrissagem em procedimento de autorrotação;


  Data da emissão: 20 de março de 2020.


  (xii) operações com origem, destino ou trânsito por aeródromos controlados, cumprindo os

  procedimentos dos serviços de controle de tráfego aéreo e os procedimentos e fraseologia
  de

  radiocomunicações;

  (xiii) procedimentos e fraseologia para as comunicações; e,

  (xiv) procedimentos e fraseologia sobre instrução aos passageiros quanto aos procedimentos

  de embarque e desembarque e procedimentos de segurança;

  (3) categoria aeronave de sustentação por potência:'
