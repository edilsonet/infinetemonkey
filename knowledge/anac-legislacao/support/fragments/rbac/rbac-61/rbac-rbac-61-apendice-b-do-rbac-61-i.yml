title: apendice-b-do-rbac-61(i)
text: '(i) acessórios adicionais àqueles normalmente associados a computadores pessoais e

  portáteis, tais como: réplica funcional de alavanca de potência, mini-alavanca lateral de
  controle ou

  um teclado para o Sistema de Gerenciamento de Voo (Flight Management System) - FMS; e

  (ii) atividade psicomotora com aplicação apropriada de força e sincronização de resposta

  adequada;

  (2) tipo II: dispositivo que representa um avião genérico com motor à turbina, com sistema

  visual diurno, qualificado pela ANAC como FTD nível 5 ou superior;

  (3) tipo III: dispositivo que representa um avião multimotor à turbina certificado para
  operação

  com tripulação mínima de 2 (dois) pilotos, com sistema visual diurno melhorado, com piloto

  automático, qualificado pela ANAC como FFS nível A ou superior; e

  (4) tipo IV: dispositivo qualificado pela ANAC como FFS nível D, ou nível C como um sistema

  visual diurno melhorado.


  2.

  Descrição das Fases de Instrução


  2.1.

  Proficiências Básicas de Voo'
