title: consideracoes(b)
text: '(b) De acordo com os descritores holísticos contidos no Anexo 1 da Convenção de Aviação
  Civil

  Internacional, pessoas que pretendem se comunicar verbalmente com proficiência devem ser
  capazes

  de:

  (1) comunicar-se efetivamente em situações em que apenas a voz é utilizada

  (telefone/radiotelefone) e em situações face a face;

  (2) comunicar-se em tópicos comuns, concretos e relacionados ao trabalho com precisão e

  clareza;

  (3) usar estratégias comunicativas apropriadas para trocar mensagens e para reconhecer e

  resolver mal entendidos (Ex: checar, confirmar, ou esclarecer informações) em um contexto
  geral ou

  relacionado com o trabalho;

  (4) lidar com sucesso e relativa facilidade com os desafios linguísticos apresentados por
  uma

  complicação ou eventos inesperados que ocorram dentro do contexto de uma situação de trabalho

  rotineira ou uma tarefa comunicativa com a qual eles estejam familiarizados; e

  (5) usar um dialeto ou sotaque que seja inteligível para a comunidade aeronáutica.'
