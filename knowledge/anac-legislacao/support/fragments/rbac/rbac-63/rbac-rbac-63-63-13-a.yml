section_title: Prazo de tolerância para realização do treinamento e exame prático periódico.
  Comissários e mecânicos de voo
subsection_id: a
cite: 63.13(a)
title: 63.13(a)
text: (a) É permitido o exercício das prerrogativas relativas a uma habilitação averbada na
  licença de comissário e de mecânico de voo, até o fim do mês posterior ao mês de vencimento
  dos prazos para realização do exame prático periódico previsto nas seções 63.51 e 63.81
  deste Regulamento.
