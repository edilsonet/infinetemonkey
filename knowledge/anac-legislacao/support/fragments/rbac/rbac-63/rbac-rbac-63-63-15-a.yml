cite: 63.15(a)
title: 63.15(a)
text: (a) O candidato que não obtiver aprovação no exame prático somente poderá prestar novo
  exame após realizar, sob a supervisão de um instrutor, treinamento corretivo relativo às
  deficiências que provocaram a sua reprovação. Tal procedimento poderá ser repetido tantas
  vezes quantas forem necessárias até sua aprovação ou desistência.
