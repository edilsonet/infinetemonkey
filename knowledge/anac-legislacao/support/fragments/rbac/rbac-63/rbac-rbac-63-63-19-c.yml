section_title: Condições relativas à utilização de licenças e habilitações
subsection_id: c
cite: 63.19(c)
title: 63.19(c)
text: (c) O titular de uma licença expedida em conformidade com este Regulamento, que tenha
  tido essa licença cassada, somente pode requerer nova licença após decorridos, pelo menos,
  2 (dois) anos da data do ato administrativo que determinou a cassação do documento e desde
  que fique comprovado que os motivos que levaram à cassação não mais existam ou não produzam
  mais efeito.
