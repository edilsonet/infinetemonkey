title: 63.19(d)
text: '(d) As licenças ou habilitações de comissário ou mecânico de voo pode(m) ser revogada(s)
  a qualquer momento:

  (1) por solicitação do seu titular; ou

  (2) a critério da ANAC, tendo em vista a segurança operacional.'
