cite: 63.19(e)
title: 63.19(e)
text: (e) O titular de uma licença expedida em conformidade com este Regulamento, com habilitações
  suspensas, não pode requerer qualquer outra licença, certificado, habilitação ou averbação
  de qualificação enquanto vigorar a suspensão.
