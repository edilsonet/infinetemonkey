section_title: Condições relativas à utilização de licenças e habilitações
subsection_id: i
cite: 63.19(i)
title: 63.19(i)
text: '(i) o uso indevido de substâncias psicoativas durante o exercício de suas atividades;
  e

  (ii) o exercício de suas atividades enquanto estiver sob o efeito de qualquer substância
  psicoativa;

  (2) qualquer pessoa que viole as proibições do parágrafo (b)(1) desta seção deve ser imediatamente
  afastada de suas atividades; e

  (3) as substâncias psicoativas às quais se refere o parágrafo (b)(1) desta seção são aquelas
  definidas no RBAC nº 120.'
