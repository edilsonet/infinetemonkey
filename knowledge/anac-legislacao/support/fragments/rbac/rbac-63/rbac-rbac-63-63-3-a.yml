cite: 63.3(a)
title: 63.3(a)
text: '(a) Para os propósitos deste Regulamento, além das definições aplicáveis contidas no
  RBAC nº 01, os termos e expressões apresentados a seguir têm os seguintes significados:

  (1) ameaça significa acontecimento ou erro que está fora do controle da pessoa que se encarrega
  da operação, aumenta a complexidade da operação e deve ser gerenciada para manter a margem
  de segurança;

  (2) erro significa ação ou omissão da pessoa encarregada da operação, que dá lugar a desvios
  das intenções ou expectativas da organização ou da pessoa encarregada da operação;

  (3) gerenciamento de ameaças significa detecção e resposta a ameaças, que reduzam ou eliminem
  suas consequências e diminuam a possibilidade de erros ou situações não desejadas;

  (4) gerenciamento de erros significa detecção e resposta a erros, que reduzam ou eliminem
  suas consequências e diminuam a possibilidade de erros ou situações não desejadas;

  (5) habilitação significa uma autorização associada a uma licença, na qual são especificadas
  as qualificações, limitações, condições especiais de operação, atribuições e restrições
  relativas ao exercício das prerrogativas da licença; e

  (6) licença significa o documento emitido pela ANAC que formaliza a certificação de uma
  pessoa para atuar em operações aéreas civis, a partir do cumprimento de requisitos de idade,
  grau de instrução, aptidão psicofísica, conhecimentos teóricos, instrução, experiência e
  proficiência, verificados de acordo com as funções, limitações e prerrogativas pertinentes
  à referida licença.'
