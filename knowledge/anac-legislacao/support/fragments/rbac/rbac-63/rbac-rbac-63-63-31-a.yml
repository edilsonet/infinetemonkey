cite: 63.31(a)
title: 63.31(a)
text: (a) Esta subparte estabelece os requisitos e as condições especiais para concessão de
  licenças a estrangeiro, para a conversão de licenças e/ou habilitações de comissário ou
  mecânico de voo emitidas no exterior a brasileiros e a estrangeiros, bem como para concessão
  de licenças e/ou habilitações de mecânico de voo a militares das Forças Armadas do Brasil.
