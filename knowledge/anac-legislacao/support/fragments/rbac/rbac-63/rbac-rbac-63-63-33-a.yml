section_title: Concessão de licenças a estrangeiros
subsection_id: a
cite: 63.33(a)
title: 63.33(a)
text: '(a) Somente podem ser concedidas licenças de comissário ou de mecânico de voo a estrangeiros
  nos seguintes casos:

  (1) comissário de voo utilizado por empresa aérea brasileira em serviço aéreo internacional,
  conforme previsto nas leis nº 7.565, de 19 de dezembro de 1986, e nº 13.475, de 28 de agosto
  de 2017; ou

  (2) entendimento, por parte da ANAC, de que tal licença é necessária para a operação de
  uma aeronave civil registrada no Brasil.'
