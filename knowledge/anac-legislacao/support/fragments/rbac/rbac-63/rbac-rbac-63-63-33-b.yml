title: 63.33(b)
text: (b) A concessão de licenças tratadas nesta seção pode se dar por meio de conversão de
  licença estrangeira equivalente ou por meio de cumprimento dos requisitos aplicáveis estabelecidos
  nas subpartes C ou D deste Regulamento.
