section_title: Conversão de licenças e habilitações estrangeiras
subsection_id: a
cite: 63.35(a)
title: 63.35(a)
text: '(a) A ANAC pode converter uma licença estrangeira emitida por Estado contratante da
  Organização da Aviação Civil Internacional. Para tal, será emitida uma licença brasileira
  correspondente à licença original.

  (1) Na licença brasileira, será averbada a informação da conversão, constando número e país
  emitente da licença ou da habilitação original.

  (2) A conversão perderá sua vigência caso a licença original seja revogada, cassada, se
  encontre suspensa ou, de outra forma, deixe de estar válida.'
