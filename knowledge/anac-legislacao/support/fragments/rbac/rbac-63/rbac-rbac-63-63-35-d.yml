title: 63.35(d)
text: (d) No momento da solicitação de conversão, a licença apresentada e, se aplicável, o
  certificado médico, devem estar no idioma português, espanhol ou inglês. De outra forma,
  o candidato deverá apresentar, também, traduções oficiais dos documentos.
