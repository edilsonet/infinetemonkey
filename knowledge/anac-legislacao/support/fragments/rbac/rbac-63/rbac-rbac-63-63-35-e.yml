cite: 63.35(e)
title: 63.35(e)
text: '(e) A ANAC realizará consulta à autoridade de aviação civil emitente da licença ou
  habilitação original a respeito da(s):

  (1) vigência da licença e das habilitações do titular;

  (2) classe e vencimento do certificado médico; e

  (3) limitações, suspensões e revogações pertinentes.'
