cite: 63.35(f)
title: 63.35(f)
text: '(f) O candidato deve cumprir os seguintes requisitos:

  (1) ser capaz de ler, falar e entender a língua portuguesa;

  (2) no caso de mecânicos de voo, ter sido aprovado em exame teórico da ANAC apropriado à
  licença pretendida;

  (3) ser titular de CMA válido e adequado à licença pretendida, de acordo com os requisitos
  do RBAC nº 67; e

  (4) ter sido aprovado em exame prático apropriado à licença ou habilitação pretendida.'
