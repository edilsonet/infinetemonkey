title: 63.35(g)
text: (g) As habilitações convertidas têm prazos de vigência compatíveis com os treinamentos,
  exames e/ou documentos originais, desde que tais prazos não sejam superiores aos prazos
  correlatos estabelecidos neste Regulamento, quando devem prevalecer os prazos brasileiros.
