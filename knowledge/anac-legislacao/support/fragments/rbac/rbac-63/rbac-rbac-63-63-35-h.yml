title: 63.35(h)
text: (h) As habilitações constantes de licenças emitidas nos termos desta seção, quando próximo
  da expiração da vigência ou não mais em vigor, devem cumprir com os requisitos aplicáveis
  estabelecidos neste Regulamento para exercício da função de comissário ou mecânico de voo.
