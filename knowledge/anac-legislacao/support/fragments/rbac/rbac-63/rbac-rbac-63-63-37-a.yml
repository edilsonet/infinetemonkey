section_title: Concessão de licença de mecânico de voo para militares das Forças Armadas do
  Brasil
subsection_id: a
cite: 63.37(a)
title: 63.37(a)
text: '(a) Generalidades:

  (1) aos militares das Forças Armadas do Brasil, da ativa ou da reserva, pode ser concedida
  uma licença de mecânico de voo, bem como as habilitações apropriadas, de acordo com os requisitos
  desta seção; e

  (2) somente serão emitidas habilitações de tipo para as aeronaves certificadas pela ANAC
  que necessitem para sua operação de um mecânico de voo compondo a tripulação.'
