cite: 63.37(b)
title: 63.37(b)
text: '(b) Requisitos. O militar das Forças Armadas do Brasil que solicite uma licença a ser
  emitida segundo este Regulamento deve:

  (1) apresentar comprovação de sua condição de mecânico de voo militar, bem como registros
  das horas de voo devidamente classificadas, em conformidade com a seção 63.47, que incluam
  a informação das aeronaves operadas, emitida pela força armada respectiva;

  (2) possuir CMA válido e adequado à licença, de acordo com os requisitos do RBAC nº 67;e

  (3) caso não tenha exercido a função de mecânico de voo nos últimos 12 (doze) meses em uma
  aeronave cuja certificação requer tal função como tripulação mínima:'
