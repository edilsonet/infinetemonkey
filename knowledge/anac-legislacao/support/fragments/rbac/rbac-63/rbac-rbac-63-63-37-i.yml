section_title: Concessão de licença de mecânico de voo para militares das Forças Armadas do
  Brasil
subsection_id: i
cite: 63.37(i)
title: 63.37(i)
text: '(i) ser aprovado em exame teórico da ANAC para a licença de mecânico de voo, conforme
  o parágrafo 63.45(a)(2); e

  (ii) ser aprovado em exame prático perante a ANAC para a licença de mecânico de voo e para
  a habilitação solicitada, conforme a seção 63.49.'
