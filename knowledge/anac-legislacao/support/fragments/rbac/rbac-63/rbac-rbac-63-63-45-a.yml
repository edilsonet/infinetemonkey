title: 63.45(a)
text: '(a) O candidato a uma licença de mecânico de voo deve, nesta sequência:

  (1) ter concluído, com aprovação, um curso de formação de mecânico de voo aprovado pela
  ANAC, ministrado por um centro de instrução de aviação civil certificado segundo o RBAC
  nº 141;

  (2) ter sido aprovado em exame teórico da ANAC para a licença de mecânico de voo com, pelo
  menos, os seguintes assuntos:'
