section_title: Requisitos de conhecimentos teóricos e treinamento para a concessão de licença
  de mecânico de voo
subsection_id: i
cite: 63.45(i)
title: 63.45(i)
text: '(i) regulamentação aeronáutica: normas e regulamentos pertinentes ao titular de uma
  licença de mecânico de voo; normas e regulamentos referentes à operação de aeronaves civis
  pertinentes às funções de um mecânico de voo;

  (ii) teoria de voo e aerodinâmica;

  (iii) conhecimentos técnicos sobre aeronaves:

  (A) princípios básicos dos grupos motopropulsores, motores convencionais e à turbina; características
  de combustíveis, sistemas de combustível, incluindo controle de combustível; lubrificantes
  e sistemas de lubrificação; pós-queimadores e sistemas de injeção, funcionamento e operação
  dos sistemas de ignição e partida do motor;

  (B) princípios de operação, procedimentos de manuseio e limitações operacionais dos grupos
  motopropulsores; efeitos das condições atmosféricas no desempenho dos motores;

  (C) células, controles de voo, estruturas, montagem de rodas, freios e unidades anti-derrapagem,
  corrosão e fadiga; identificação de danos estruturais e defeitos;

  (D) sistemas de proteção contra chuva e gelo;

  (E) sistemas de pressurização e ar condicionado, sistemas de oxigênio;

  (F) sistemas hidráulico e pneumático;

  (G) teoria elétrica básica, sistemas elétricos(AC e DC), sistemas de fiação da aeronave,
  soldagem elétrica e confecção de circuito impresso;

  (H) princípios de operação de instrumentos, bússolas, pilotos automáticos, equipamento de
  rádio-comunicação, auxílios de navegação de rádio e radar, sistemas de gerenciamento de
  voo, displays e aviônicos;

  (I) limitações da referida aeronave;

  (J) sistemas de proteção, detecção, supressão e extinção de fogo; e

  (K) a utilização e a verificação das condições dos equipamentos e sistemas da aeronave apropriada;

  (iv) desempenho, planejamento e carregamento de voo:

  (A) efeitos da carga e da distribuição de peso sobre o manejo da aeronave, as características
  e desempenho do voo; cálculos de peso e balanceamento; e

  (B) uso e aplicação prática dos dados de desempenho, incluindo procedimentos para controle
  de cruzeiro;'
