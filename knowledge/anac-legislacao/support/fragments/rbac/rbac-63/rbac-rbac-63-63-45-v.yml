subsection_id: v
cite: 63.45(v)
title: 63.45(v)
text: '(v) desempenho humano: desempenho humano relativo ao mecânico de voo, incluindo os
  princípios de gerenciamento de ameaças e erros;

  (vi) aspectos operacionais da meteorologia;

  (vii) fundamentos da navegação: princípios e operação de sistemas autônomos;

  (viii) procedimentos operacionais:

  (A) princípios de manutenção, procedimentos para manutenção da aeronavegabilidade, registro
  de defeitos (panes), inspeções pré-voo, procedimentos de precaução para abastecimento de
  combustível e uso de fonte externa de energia; equipamentos instalados e sistemas de cabine;

  (B) procedimentos normais, anormais e de emergência; e

  (C) procedimentos operacionais para o transporte de carga e artigos perigosos; e

  (ix) rádio-comunicações: procedimentos e fraseologia de rádio-comunicações; e

  (3) ter concluído, de forma satisfatória, o treinamento inicial previsto em um programa
  de treinamento aprovado pela ANAC.'
