section_title: Requisitos de experiência de voo e instrução de voo para a concessão de licença
  de mecânico de voo
subsection_id: a
cite: 63.47(a)
title: 63.47(a)
text: '(a) O candidato a uma licença de mecânico de voo deve ter completado, sob a supervisão
  de um mecânico de voo qualificado na aeronave e em conformidade com um programa de treinamento
  aprovado pela ANAC:

  (1) o mínimo de 100 (cem) horas de experiência de voo no desempenho das funções de mecânico
  de voo em aeronave que requeira operação de um mecânico de voo, das quais um máximo de 50
  (cinquenta) horas podem ser realizadas em simulador de voo (FFS - Full Flight Simulator)
  como parte de um programa de treinamento aprovado; ou

  (2) se o candidato for titular de licença de piloto comercial, piloto de tripulação múltipla
  ou piloto de linha área, na categoria avião, e possuir habilitação de tipo válida referente
  a avião certificado para tripulação mínima de mais de 1 (um) piloto, o mínimo de 50 (cinquenta)
  horas de experiência de voo no desempenho das funções de mecânico de voo em aeronave que
  requeira operação de um mecânico de voo, das quais um máximo de 25 (vinte e cinco) horas
  podem ser realizadas em simulador de voo (FFS - Full Flight Simulator), como parte de um
  programa de treinamento aprovado.'
