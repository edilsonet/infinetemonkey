title: 63.47(b)
text: '(b) O candidato a uma licença de mecânico de voo deve receber instrução de voo no desempenho
  das funções de mecânico de voo, sob a supervisão de um mecânico de voo habilitado e qualificado
  na aeronave, em conformidade com um programa de treinamento aprovado pela ANAC, abrangendo
  no mínimo os seguintes aspectos:

  (1) procedimentos normais:'
