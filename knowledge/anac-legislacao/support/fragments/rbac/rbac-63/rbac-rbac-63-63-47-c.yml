subsection_id: c
cite: 63.47(c)
title: 63.47(c)
text: (c) Para iniciar a instrução de voo e a experiência de voo requeridas por esta seção,
  o candidato deve ter atendido previamente aos requisitos de idade e grau de instrução conforme
  a seção 63.41 e de conhecimentos teóricos e treinamento conforme a seção 63.45. Para realizar
  em aeronave qualquer parte da instrução de voo e da experiência de voo, o candidato deve
  atender também aos requisitos de aptidão psicofísica, conforme a seção 63.43.
