cite: 63.49(a)
title: 63.49(a)
text: '(a) O candidato a uma licença de mecânico de voo deve demonstrar, por meio de exame
  prático realizado pela ANAC ou examinador credenciado, sua capacidade para atuar como mecânico
  de voo de uma aeronave, nos procedimentos descritos no parágrafo 63.47(b) e 63.45(a)(2),
  com grau de competência apropriado às prerrogativas que essa licença confere ao titular,
  e para:

  (1) reconhecer e gerenciar ameaças e erros;

  (2) operar os diversos sistemas da aeronave, de acordo com o desempenho e limitações previstas
  nos manuais técnicos da aeronave;

  (3) exercer bom julgamento e atitude;

  (4) aplicar conhecimentos aeronáuticos;

  (5) desempenhar todas as tarefas relativas à sua função como parte de uma equipe, assessorando
  os demais membros da tripulação; e

  (6) comunicar-se efetivamente com os demais tripulantes, aplicando o gerenciamento de cabine
  (CRM).'
