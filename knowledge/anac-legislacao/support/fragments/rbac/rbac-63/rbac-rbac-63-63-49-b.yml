section_title: Requisitos de proficiência para a concessão de licença de mecânico de voo -
  exame prático
subsection_id: b
cite: 63.49(b)
title: 63.49(b)
text: '(b) O exame prático deve ser realizado em:

  (1) aeronave correspondente à habilitação solicitada e que requeira operação de um mecânico
  de voo; ou

  (2) dispositivo de treinamento para simulação de voo qualificado pela ANAC, de forma a garantir
  que seja apropriado para tal fim. O dispositivo de treinamento para simulação de voo deve
  corresponder a uma aeronave que atenda ao parágrafo (b)(1) desta seção.'
