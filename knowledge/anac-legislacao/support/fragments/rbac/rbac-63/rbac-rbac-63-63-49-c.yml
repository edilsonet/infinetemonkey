cite: 63.49(c)
title: 63.49(c)
text: (c) Para realizar o exame prático requerido por esta seção, o candidato deve ter atendido
  previamente aos requisitos de idade e grau de instrução, conforme a seção 63.41, de conhecimentos
  teóricos e treinamento, conforme a seção 63.45 e de experiência de voo e instrução de voo,
  conforme a seção 63.47. Para realizar o exame prático em aeronave, o candidato deve atender
  também aos requisitos de aptidão psicofísica (CMA), conforme a seção 63.43.
