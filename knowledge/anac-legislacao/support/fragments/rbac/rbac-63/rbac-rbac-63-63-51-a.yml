section_title: Treinamento e exame periódico para mecânico de voo
subsection_id: a
cite: 63.51(a)
title: 63.51(a)
text: '(a) O titular de licença de mecânico de voo deve atender, na sequência apresentada,
  aos seguintes requisitos, com relação a um modelo de aeronave abrangido por essa habilitação
  de tipo:

  (1) ter concluído, de forma satisfatória, os treinamentos de solo e de voo previstos em
  um programa de treinamento aprovado pela ANAC; e

  (2) ter sido aprovado em exame prático periódico, conduzido em conformidade com a seção
  63.49 e na regulamentação de operações pertinente.'
