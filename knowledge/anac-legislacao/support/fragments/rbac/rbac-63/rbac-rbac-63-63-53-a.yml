cite: 63.53(a)
title: 63.53(a)
text: '(a) A prerrogativa do titular da licença de mecânico de voo é de atuar como auxiliar
  do comandante, encarregado da operação e do controle de sistemas diversos, conforme especificação
  dos manuais técnicos da aeronave.

  SUBPARTE D - COMISSÁRIO DE VOO'
