section_title: Requisitos para exercício da função de comissário de voo
subsection_id: a
cite: 63.7(a)
title: 63.7(a)
text: '(a) São requisitos mínimos para o exercício da função de comissário de voo:

  (1) ser detentor da licença de comissário de voo;

  (2) ser detentor da habilitação de tipo e na categoria da aeronave em que irá compor a tripulação;

  (3) estar com o CMA válido e adequado à licença, de acordo com os requisitos do RBAC nº
  67;

  (4) ter concluído, de forma satisfatória, os treinamentos nos prazos previstos neste Regulamento,
  na regulamentação pertinente e no programa de treinamento aprovado pela ANAC;

  (5) ter sido aprovado em exame prático, na função de comissário de voo, nos termos e prazos
  previstos na Subparte D deste Regulamento;

  (6) possuir experiência recente correspondente à licença, conforme previsto nos regulamentos
  aplicáveis referentes à operação de aeronaves;

  (7) o titular não tiver renunciado à licença; e

  (8) a licença não se encontrar cassada, suspensa ou revogada pela ANAC.'
