section_title: Requisitos gerais para a concessão de licença de comissário de voo
subsection_id: a
cite: 63.71(a)
title: 63.71(a)
text: '(a) O candidato a uma licença de comissário de voo deve:

  (1) ter completado 18 (dezoito) anos;

  (2) ter concluído o ensino médio ou equivalente; e

  (3) ser capaz de ler, escrever, falar e compreender a língua portuguesa.'
