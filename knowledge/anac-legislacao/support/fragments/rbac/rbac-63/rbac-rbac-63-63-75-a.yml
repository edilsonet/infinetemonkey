section_title: Requisitos de conhecimentos teóricos e treinamento para a concessão de licença
  de comissário de voo
subsection_id: a
cite: 63.75(a)
title: 63.75(a)
text: '(a) O candidato a uma licença de comissário de voo deve ter realizado o treinamento
  inicial conforme programa de treinamento aprovado pela ANAC.

  (1) Os conteúdos, as metodologias e as formas de avaliação do programa de treinamento deverão
  ser organizados de tal modo que, ao final das instruções, o candidato demonstre as competências
  necessárias para exercício da função de comissário de voo.

  (2) O programa de treinamento deverá definir a carga horária do referido treinamento, observado
  o ambiente operacional do operador da aeronave, as competências necessárias para exercício
  da função de comissário e o nível de tolerabilidade do risco à segurança operacional.'
