section_title: Requisitos de experiência para operação em rota para a concessão de licença
  de comissário de voo
subsection_id: a
cite: 63.77(a)
title: 63.77(a)
text: '(a) A experiência para operação em rota consiste em voos nos quais o candidato a comissário
  estará sob supervisão de um instrutor qualificado, com vistas à consolidação das competências
  (conhecimentos, habilidades e atitudes) necessárias para o exercício da respectiva função.

  (1) A experiência de operação em rota poderá ser realizada em dispositivo de treinamento
  de cabine de passageiros, desde que autorizado pela ANAC.

  (2) É vedada a utilização de candidato a comissário de voo pelo operador aéreo para compor
  a tripulação da aeronave durante a execução de voos destinados à obtenção da experiência
  para operação em rota.'
