subsection_id: b
cite: 63.77(b)
title: 63.77(b)
text: '(b) O candidato a uma licença de comissário de voo deve realizar um mínimo de 5 (cinco)
  horas de voo desempenhando as funções de comissário de voo, sob supervisão de um instrutor
  de comissários de voo.

  (1) A ANAC poderá, de forma motivada e visando a manutenção do nível de segurança operacional,
  estabelecer carga horária (horas de voo) complementar para o atendimento satisfatório do
  requisito de experiência para operação em rota previsto no parágrafo(b) desta seção.'
