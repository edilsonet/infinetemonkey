subsection_id: c
cite: 63.77(c)
title: 63.77(c)
text: '(c) Para iniciar a experiência para operação em rota requerida por esta seção, o candidato
  deve ter atendido previamente aos requisitos previstos nas seções 63.71, 63.73 e 63.75 deste
  Regulamento.

  (1) O requisito de CMA, previsto na seção 63.73, poderá ser dispensado, no período de execução
  da experiência para operação em rota, caso seja realizada, integralmente, em dispositivo
  de treinamento de cabine de passageiro da aeronave, nos termos do parágrafo (a)(1) desta
  seção.'
