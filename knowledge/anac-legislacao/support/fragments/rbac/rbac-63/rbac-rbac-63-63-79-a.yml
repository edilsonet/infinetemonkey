section_title: Requisitos de competência para a concessão de licença de comissário de voo
  - exame prático
subsection_id: a
cite: 63.79(a)
title: 63.79(a)
text: (a) O candidato a uma licença de comissário de voo ou de uma habilitação deve ser aprovado
  em um exame prático, demonstrando uma combinação de conhecimento, habilidades e atitudes
  de acordo com os níveis de desempenho estabelecidos para executar as tarefas no padrão de
  segurança requerido pelo programa de treinamento aprovado pela ANAC.
