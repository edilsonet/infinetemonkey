section_title: Requisitos de competência para a concessão de licença de comissário de voo
  - exame prático
subsection_id: b
cite: 63.79(b)
title: 63.79(b)
text: '(b) O exame prático referido no parágrafo (a) desta seção deve ser aplicado pela ANAC
  ou por examinador credenciado, em aeronave do tipo ou dispositivo de treinamento qualificado
  pela ANAC correspondente à habilitação solicitada, nas seguintes áreas, deveres e responsabilidades
  que lhe serão atribuídos:

  (1) autoridade do piloto em comando;

  (2) tratamento com os passageiros, incluindo procedimentos que devem ser seguidos ao lidar
  com pessoa com deficiência, com mobilidade reduzida, com necessidade de assistência especial,
  com passageiro indisciplinado e com outras pessoas cuja conduta possa colocar em risco a
  segurança;

  (3) atribuições, funções e responsabilidades dos tripulantes durante amerissagem e evacuação
  de pessoas que possam necessitar de assistência de uma outra pessoa para mover-se rapidamente
  para uma saída numa emergência;

  (4) instruções aos passageiros;

  (5) localização e operação de extintor portátil e outros itens de equipamentos de emergência;

  (6) uso apropriado de equipamentos e controles da cabine;

  (7) localização e operação do equipamento de oxigênio para os passageiros;

  (8) localização e operação de todas as saídas, nos modos normal e de emergência, incluindo
  rampas de evacuação e cordas de escape;

  (9) acomodação em assento, de pessoas que podem necessitar de assistência de outra pessoa
  para mover-se rapidamente para uma saída numa emergência, como previsto pelo manual de operações
  do detentor de certificado;

  (10) tarefas e responsabilidades desenvolvidas de acordo com o programa de treinamento aprovado
  para o operador aéreo contratante do comissário de voo; e

  (11) regulamentação aeronáutica, aerodinâmica, meteorologia básica, atribuições do comissário,
  transporte de artigos perigosos, inglês técnico, fatores humanos, sobrevivência, primeiros
  socorros, medicina aeroespacial, evacuação na terra e água, equipamentos e procedimentos
  de emergência.'
