title: 63.81(i)
text: '(i) ter concluído, dentro de um período de 24 (vinte e quatro) meses, o treinamento
  periódico previsto em um programa de treinamento aprovado pela ANAC; e

  (ii) ter sido aprovado em exame prático periódico conduzido em conformidade com a seção
  63.79 e dentro de um período de 24 (vinte e quatro) meses.

  (2) para os comissários vinculados aos operadores aéreos certificados sob a égide do RBAC
  nº 135 ou do RBAC nº 121:'
