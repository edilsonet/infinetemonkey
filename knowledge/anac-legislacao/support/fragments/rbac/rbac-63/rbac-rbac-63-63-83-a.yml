section_title: Prerrogativas do titular de licença de comissário de voo
subsection_id: a
cite: 63.83(a)
title: 63.83(a)
text: (a) As prerrogativas do titular da licença de comissário de voo são de atuar como tripulante
  de cabine, auxiliando o comandante da aeronave no cumprimento das normas relativas à segurança,
  no atendimento aos passageiros a bordo, na guarda de bagagens, documentos, valores e malas
  postais, bem como de cumprir outras tarefas que lhes tenham sido delegadas pelo comandante
  da aeronave.
