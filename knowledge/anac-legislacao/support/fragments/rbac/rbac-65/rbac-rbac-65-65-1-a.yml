title: 65.1(a)
text: '(a) Este regulamento estabelece os requisitos para a emissão das seguintes licenças
  e das

  habilitações averbadas nessas licenças, além das regras gerais de operação a serem seguidas
  pelos

  titulares dessas licenças e habilitações, no âmbito da aviação civil:

  (1) [reservado];

  (2) despachante operacional de voo; e

  (3) mecânico de manutenção aeronáutica.'
