title: 65.11(c)
text: '(c) O ex-titular de uma licença emitida em conformidade com este regulamento, que tenha
  tido

  essa licença cassada, não pode requerer outra, a menos que cumpra o previsto no parágrafo
  65.6(d)

  deste regulamento.'
