cite: 65.11(d)
title: 65.11(d)
text: '(d) O titular de uma licença emitida em conformidade com este regulamento, cujas habilitações

  estejam suspensas, não pode requerer qualquer outra licença, habilitação ou averbação de
  qualificação

  enquanto vigorar esta suspensão.'
