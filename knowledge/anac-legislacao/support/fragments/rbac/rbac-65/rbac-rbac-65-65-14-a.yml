section_title: Impedimento por motivo de segurança da aviação contra atos de interferência
  ilícita
subsection_id: a
cite: 65.14(a)
title: 65.14(a)
text: '(a) O titular de uma licença emitida segundo este regulamento não pode exercer suas
  prerrogativas,

  e um requerente não pode obter uma licença emitida segundo este regulamento se qualquer
  órgão de

  segurança pública, do Ministério da Justiça, do Ministério da Defesa ou órgão com competências

  semelhantes a estes notificar a ANAC, formalmente, que essa pessoa, em relação às prerrogativas
  que

  a licença lhe confere ou pode conferir, possa representar uma ameaça à segurança da aviação
  civil

  contra atos de interferência ilícita.'
