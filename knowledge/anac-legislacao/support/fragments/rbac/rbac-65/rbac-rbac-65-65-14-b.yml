section_title: Impedimento por motivo de segurança da aviação contra atos de interferência
  ilícita
subsection_id: b
cite: 65.14(b)
title: 65.14(b)
text: '(b) Após o recebimento de notificação de impedimento por motivo de segurança da aviação
  civil

  contra atos de interferência ilícita de um requerente ou titular de licença ou habilitação:

  (1) a ANAC manterá em suspenso o processamento da solicitação da licença ou habilitação
  até

  determinar junto à autoridade que emitiu a notificação a gravidade da ameaça; e

  (2) a ANAC suspenderá de imediato uma licença emitida bem como as habilitações associadas.'
