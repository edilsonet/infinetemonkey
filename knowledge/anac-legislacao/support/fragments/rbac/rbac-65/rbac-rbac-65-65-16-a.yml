cite: 65.16(a)
title: 65.16(a)
text: '(a) Uma solicitação para alteração de nome em uma licença emitida segundo este regulamento

  deve ser apresentada à ANAC dentro de 30 (trinta) dias corridos, a contar do fato que originou
  tal

  alteração, devendo ser apresentada cópia de certidão de casamento, ordem judicial ou outro

  documento comprovando a alteração.'
