cite: 65.17(c)
title: 65.17(c)
text: '(c) O requerente a um exame prático para emissão de uma licença ou habilitação deve
  solicitar tal

  exame da maneira prevista pela ANAC após:

  (1) ter sido aprovado no exame teórico requerido; e

  (2) ter concluído a instrução e comprovar a experiência prática prevista neste regulamento
  para

  a licença ou habilitação solicitada.'
