title: 65.17(d)
text: '(d) Após verificar o cumprimento dos requisitos do parágrafo (c) desta seção, a ANAC
  autorizará

  o requerente a realizar o exame prático, indicando o profissional responsável por aplicar
  o exame.

  (1) O requerente que não obtiver aprovação no primeiro exame prático somente pode requerer

  autorização para realizar novo exame prático após comprovar que realizou, sob supervisão
  de um

  instrutor, treinamento corretivo relativo às deficiências que provocaram a sua reprovação,
  atendendo

  ainda à seção 65.19 deste regulamento. Novas tentativas posteriores com meta à aprovação
  devem

  seguir o mesmo procedimento.'
