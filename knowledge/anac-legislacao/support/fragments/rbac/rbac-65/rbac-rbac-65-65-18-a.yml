section_title: Condutas não autorizadas em exames teóricos
subsection_id: a
cite: 65.18(a)
title: 65.18(a)
text: '(a) O candidato a um exame teórico não pode:

  (1) ajudar ou receber ajuda de qualquer pessoa na resolução das questões do exame, durante
  o

  período em que este é aplicado;

  (2) utilizar, ou introduzir no recinto do exame, durante sua realização, qualquer material
  que

  não seja expressamente autorizado;


  Data da emissão: 25 de maio de 2018


  (3) desobedecer às orientações dadas pelos fiscais e às instruções específicas estabelecidas
  pela

  ANAC durante qualquer fase das atividades referentes aos exames;

  (4) intencionalmente causar, dar assistência ou participar de qualquer ato ilícito, assim

  caracterizado pela ANAC;

  (5) copiar ou retirar intencionalmente o conteúdo de um exame teórico realizado segundo
  este

  regulamento;

  (6) fornecer a outros, ou receber de outros, qualquer parte ou cópia de tal exame; e

  (7) tomar parte nesse exame em nome de outra pessoa.'
