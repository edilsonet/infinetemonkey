cite: 65.18(b)
title: 65.18(b)
text: '(b) O requerente que incorrer nas situações previstas nos parágrafos 65.18(a)(1) a
  65.18(a)(7) deste

  regulamento terá seu exame anulado, ficará impedido de obter qualquer licença, habilitação
  ou

  certificado emitido pela ANAC pelo período de 1 (um) ano, a contar da data do ato, e os
  fatos serão

  comunicados ao Ministério Público, para a tomada das medidas cabíveis em seu âmbito de atuação.'
