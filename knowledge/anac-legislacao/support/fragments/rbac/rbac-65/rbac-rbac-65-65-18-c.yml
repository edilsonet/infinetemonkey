cite: 65.18(c)
title: 65.18(c)
text: '(c) O requerente que deixar de comparecer ao local designado para a realização do exame
  teórico

  será considerado desistente e sua falta será registrada. Para a realização de novo exame
  o requerente

  deverá realizar nova inscrição e pagar nova taxa.'
