text: '(a) Dentro de 30 (trinta) dias após a mudança de seu endereço de correspondência, o
  titular de uma

  licença emitida segundo este regulamento deve informar à ANAC seu novo endereço.


  Data da emissão: 25 de maio de 2018


  SUBPARTE B

  [RESERVADO]


  SUBPARTE C

  DESPACHANTE OPERACIONAL DE VOO'
