section_title: Concessão de licenças para estrangeiros não residentes no Brasil
subsection_id: a
cite: 65.3(a)
title: 65.3(a)
text: '(a) O estrangeiro não residente no Brasil somente pode obter licença emitida segundo
  este

  regulamento, para utilização fora do Brasil, se a ANAC considerar que a licença é necessária
  para a

  operação ou para garantir a aeronavegabilidade continuada de uma aeronave civil com matrícula

  brasileira.'
