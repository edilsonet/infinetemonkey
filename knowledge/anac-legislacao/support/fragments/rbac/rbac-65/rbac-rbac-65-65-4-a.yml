section_title: Convalidação e validação temporária de licenças e habilitações estrangeiras
subsection_id: a
cite: 65.4(a)
title: 65.4(a)
text: '(a) Sem prejuízo do cumprimento das leis de imigração e trabalhistas do Brasil, a ANAC
  pode

  convalidar uma licença estrangeira emitida por Estado membro da Organização de Aviação Civil

  Internacional se tal Estado reciprocamente aceitar a convalidação de licenças brasileiras.
  Para tal, será

  emitida uma licença brasileira correspondente à licença original.

  (1) A convalidação perderá sua validade caso a licença original seja revogada, cassada,
  se

  encontre suspensa ou de outra forma deixe de estar válida.'
