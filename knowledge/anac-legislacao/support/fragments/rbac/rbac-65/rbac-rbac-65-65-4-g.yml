title: 65.4(g)
text: '(g) Para todos os casos, será realizada consulta à autoridade de aviação civil emitente
  da licença

  ou habilitação original a respeito da:

  (1) validade da licença ou habilitação; e

  (2) limitações, suspensões e revogações pertinentes.'
