title: 65.4(h)
text: '(h) Validação temporária. Sem prejuízo do cumprimento das leis de imigração e trabalhistas
  do

  Brasil, a ANAC poderá emitir validação temporária, pelo prazo de 90 (noventa) dias, prorrogáveis

  por mais 90 (noventa) dias, de licença estrangeira emitida por Estado membro da Organização
  de


  Data da emissão: 25 de maio de 2018


  Aviação Civil Internacional se tal Estado reciprocamente aceitar a validação temporária
  de licenças

  brasileiras.

  (1) A validação terá forma de autorização especial e só terá validade com o porte da licença

  original e documento de identificação.

  (2) A validação será feita somente em caso de necessidade de serviços especiais quando não

  houver pessoal habilitado e capacitado no país, ficando o titular de licença estrangeira
  validada

  comprometido a fazer a transferência de conhecimento.'
