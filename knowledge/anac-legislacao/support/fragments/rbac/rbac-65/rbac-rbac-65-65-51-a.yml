section_title: Obrigatoriedade de licença e habilitação
subsection_id: a
cite: 65.51(a)
title: 65.51(a)
text: '(a) Uma pessoa somente pode atuar como despachante operacional de voo com relação a
  uma

  aeronave civil de matrícula brasileira, ou quando requerido por RBAC, se for titular e tiver
  em seu

  poder uma licença vigente com as correspondentes habilitações de tipo válidas (considerando
  o prazo

  de tolerância estabelecido no parágrafo 65.52(e)) que lhe tenham sido emitidas segundo este

  regulamento.'
