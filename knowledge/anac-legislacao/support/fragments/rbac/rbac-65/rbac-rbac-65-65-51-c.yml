cite: 65.51(c)
title: 65.51(c)
text: '(c) Deve ser averbada na licença do despachante operacional de voo uma habilitação
  de tipo para

  cada modelo específico de aeronave, ou, a critério da ANAC, grupo de modelos de aeronave,
  para o

  qual o despachante operacional de voo tenha demonstrado cumprir os requisitos deste regulamento.'
