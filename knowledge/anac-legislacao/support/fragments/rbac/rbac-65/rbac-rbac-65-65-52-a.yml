cite: 65.52(a)
title: 65.52(a)
text: '(a) A licença de despachante operacional de voo emitida segundo este regulamento é
  permanente.

  As prerrogativas conferidas a seu titular não podem ser exercidas se a licença tiver sido
  suspensa,

  revogada ou cassada pela ANAC.'
