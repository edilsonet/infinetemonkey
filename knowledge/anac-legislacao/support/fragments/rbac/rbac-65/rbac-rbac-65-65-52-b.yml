title: 65.52(b)
text: '(b) A licença ou habilitação de despachante operacional de voo pode(m) ser revogada(s)
  a qualquer

  momento:

  (1) por solicitação do seu titular; ou

  (2) a critério da ANAC tendo em vista a segurança operacional.'
