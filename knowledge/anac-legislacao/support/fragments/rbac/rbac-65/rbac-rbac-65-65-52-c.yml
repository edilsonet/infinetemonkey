cite: 65.52(c)
title: 65.52(c)
text: '(c) As habilitações averbadas em uma licença de despachante operacional de voo têm
  validade de

  12 (doze) meses, a contar do mês de aprovação no exame prático, e o exercício de suas prerrogativas

  é condicionado:

  (1) ao cumprimento do programa de treinamento, aprovado pela ANAC, da instituição à qual
  o

  seu titular estiver vinculado; e

  (2) à experiência recente em sua atividade, de acordo com a seção 65.62 deste regulamento.'
