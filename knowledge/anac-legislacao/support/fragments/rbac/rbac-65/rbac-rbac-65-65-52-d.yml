cite: 65.52(d)
title: 65.52(d)
text: '(d) O exame prático pertinente à revalidação de uma habilitação pode ser realizado
  no período que

  compreende desde o início do mês anterior ao mês de vencimento até o fim do mês posterior
  ao mês

  de vencimento, mantendo-se, após concluída a revalidação, o mês base de vencimento para
  a nova

  validade.'
