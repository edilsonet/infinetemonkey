section_title: Pré-requisitos para concessão de licença e de habilitação adicional
subsection_id: a
cite: 65.53(a)
title: 65.53(a)
text: '(a) Para obter uma licença de despachante operacional de voo, o requerente deve:

  (1) ter completado 21 (vinte e um) anos;

  (2) ter concluído o ensino médio ou equivalente;

  (3) no caso de candidatos estrangeiros, ser capaz de ler, escrever, falar e compreender
  o idioma

  português, demonstrado por meio da realização dos exames teóricos e práticos, conforme a
  seção

  65.17;

  (4) possuir a experiência ou treinamento requeridos, conforme o parágrafo 65.57(a);

  (5) ter sido aprovado no exame teórico requerido, conforme o parágrafo 65.55(a);

  (6) ter cumprido a experiência prática requerida, conforme o parágrafo 65.57(b); e

  (7) ter sido aprovado no exame prático requerido, conforme o parágrafo 65.59(a).'
