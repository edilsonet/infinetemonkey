cite: 65.54(a)
title: 65.54(a)
text: '(a) Para revalidar uma habilitação de tipo, seu titular deve ser aprovado em avaliações
  de:

  (1) conhecimentos: o requerente deve ter demonstrado que mantém seus conhecimentos

  atualizados em relação aos assuntos estabelecidos no Programa de Treinamento Operacional

  aprovado pela ANAC, por meio de avaliação realizada pela instituição à qual ele está vinculado;
  e

  (2) competência: o requerente deve ter demonstrado que mantém sua proficiência técnica em

  relação aos requisitos estabelecidos na seção 65.59, por meio de exame prático referente
  a um modelo

  de aeronave abrangido por essa habilitação de tipo, realizado pela ANAC ou por examinador

  credenciado.'
