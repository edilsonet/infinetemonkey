text: '(a) O requerente de uma licença de despachante operacional de voo deve ser aprovado
  em exame

  teórico específico para tal licença, aplicado pela ANAC, sobre os seguintes assuntos:

  (1) direito aeronáutico:


  Data da emissão: 25 de maio de 2018'
