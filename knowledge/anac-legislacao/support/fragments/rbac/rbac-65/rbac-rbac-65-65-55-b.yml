text: '(b) O requerente de licença de despachante operacional de voo deve realizar seus exames
  práticos

  para obtenção da licença durante o prazo de validade de seu exame teórico, que é de 24 (vinte
  e

  quatro) meses a partir do mês de divulgação do resultado.'
