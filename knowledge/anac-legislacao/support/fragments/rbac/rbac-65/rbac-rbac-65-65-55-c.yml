cite: 65.55(c)
title: 65.55(c)
text: '(c) O requerente de licença de despachante operacional de voo que não se submeter ao
  exame

  prático dentro do prazo de validade do exame teórico pode dar continuidade ou início à experiência

  prática requerida pelo parágrafo 65.57(b). Contudo, está limitado a realizar o exame prático
  em data

  não posterior a 48 (quarenta e oito) meses a partir do início da validade do exame teórico.
  Neste caso,

  com uma antecedência mínima de 60 (sessenta) dias do término do período de 48 (quarenta
  e oito)

  meses, o candidato deve ser aprovado em exame de Regulamentos de Tráfego Aéreo realizado
  na

  ANAC e, na sequência, solicitar o exame prático. Caso o requerente seja reprovado no exame
  de

  Regulamentos de Tráfego Aéreo, pode tornar a realizá-lo, uma única vez, decorridos 15 (quinze)
  dias

  da reprovação. Caso não seja aprovado nesta segunda oportunidade, deverá realizar novamente
  o

  exame teórico previsto no parágrafo 65.55(a).'
