section_title: Suspensão e cassação de licença ou habilitação
subsection_id: a
cite: 65.6(a)
title: 65.6(a)
text: '(a) Quaisquer das licenças de que trata este regulamento ou das habilitações averbadas
  em tais

  licenças podem ser suspensas liminarmente pela ANAC, se forem detectados indícios, devidamente

  registrados em processo administrativo, de que o respectivo titular não possui idoneidade
  profissional

  ou não está capacitado para o exercício das funções especificadas em sua licença ou habilitações

  correspondentes.

  (1) No caso de suspensão por indícios de que o titular não está capacitado para o exercício
  das

  funções especificadas em sua licença ou habilitações correspondentes, o titular deverá se
  submeter a

  novos exames, teóricos e/ou práticos, a critério da ANAC.'
