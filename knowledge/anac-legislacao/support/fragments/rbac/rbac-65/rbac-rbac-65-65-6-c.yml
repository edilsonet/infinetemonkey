section_title: Suspensão e cassação de licença ou habilitação
subsection_id: c
cite: 65.6(c)
title: 65.6(c)
text: '(c) Quaisquer das licenças de que trata este regulamento ou das habilitações averbadas
  em tais

  licenças podem ser cassadas pela ANAC se comprovado, em processo administrativo, que o

  respectivo titular não possui idoneidade profissional ou não está capacitado para o exercício
  das

  funções especificadas em sua licença ou habilitação.'
