section_title: Suspensão e cassação de licença ou habilitação
subsection_id: d
cite: 65.6(d)
title: 65.6(d)
text: '(d) O ex-titular de uma licença emitida em conformidade com este regulamento, que tenha
  sido

  cassada, nos termos do parágrafo (c) desta seção, não pode requerer nova licença equivalente
  àquela

  cassada, a menos que:

  (1) tenham se passado, no mínimo, 2 (dois) anos da data do ato administrativo que determinou

  a cassação da licença; e

  (2) comprove que os motivos que deram origem à cassação não produzam mais efeito,

  prescreveram ou foram superados de forma definitiva.'
