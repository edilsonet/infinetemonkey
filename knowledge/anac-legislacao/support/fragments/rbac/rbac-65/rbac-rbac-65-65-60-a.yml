text: '(a) Observado o cumprimento dos requisitos deste regulamento, a prerrogativa do titular
  de licença

  de despachante operacional de voo, com uma habilitação de tipo averbada nessa licença, é
  a de


  Data da emissão: 25 de maio de 2018


  exercer, em conjunto com o piloto em comando, a responsabilidade pelo controle operacional
  de um

  voo de uma aeronave de modelo abrangido por essa habilitação de tipo.'
