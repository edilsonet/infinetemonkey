cite: 65.60(b)
title: 65.60(b)
text: '(b) Essa prerrogativa deixa de existir após decorrido o período de validade da habilitação

  pertinente estabelecido no parágrafo 65.52(c), considerando-se o prazo de tolerância estabelecido
  no

  parágrafo 61.52(e), caso não tenha sido realizada a revalidação dessa habilitação.'
