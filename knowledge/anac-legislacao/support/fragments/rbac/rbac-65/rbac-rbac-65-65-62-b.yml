title: 65.62(b)
text: '(b) Na impossibilidade de atender ao disposto no parágrafo 65.62(a), o titular da licença
  de

  despachante operacional de voo deve se submeter a treinamento operacional, de acordo com
  o

  programa de treinamento aprovado pela ANAC, e exame prático, conforme a seção 65.59.


  Data da emissão: 25 de maio de 2018


  SUBPARTE D

  MECÂNICO DE MANUTENÇÃO AERONÁUTICA'
