cite: 65.72(a)
title: 65.72(a)
text: '(a) A licença de mecânico de manutenção aeronáutica emitida segundo este regulamento
  é

  permanente. As prerrogativas conferidas a seu titular não podem ser exercidas se a licença
  tiver sido

  suspensa, revogada ou cassada pela ANAC.'
