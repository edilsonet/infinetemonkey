title: 65.72(b)
text: '(b) A licença ou habilitação de mecânico de manutenção aeronáutica pode(m) ser revogada(s)
  a

  qualquer momento:

  (1) por solicitação do seu titular; ou

  (2) a critério da ANAC tendo em vista a segurança operacional.


  Data da emissão: 25 de maio de 2018'
