cite: 65.72(d)
title: 65.72(d)
text: '(d) Recadastramento de titular de licença.

  (1) A cada 3 (três) anos, a partir da data da emissão da habilitação, o titular deve efetuar
  o seu

  recadastramento junto à ANAC, na forma estabelecida pela ANAC.

  (2) A falta deste recadastramento implicará na suspensão da habilitação emitida.'
