cite: 65.73(a)
title: 65.73(a)
text: '(a) As seguintes habilitações podem ser emitidas para uma licença de mecânico de manutenção

  aeronáutica, segundo este regulamento:

  (1) célula (CEL);

  (2) grupo motopropulsor (GMP); e

  (3) aviônico (AVI).'
