cite: 65.75(a)
title: 65.75(a)
text: '(a) O requerente de uma licença de mecânico de manutenção aeronáutica, ou habilitação
  associada,

  deve ser aprovado em um exame teórico que inclua conhecimentos de construção e manutenção
  de

  aeronaves, apropriado à habilitação requerida, aos requisitos deste regulamento, e aos aplicáveis

  requisitos do RBAC nº 43 e do RBHA 91, ou RBAC que venha a substituí-lo. Especificamente,
  o

  exame teórico deve incluir:

  (1) direito aeronáutico e requisitos de aeronavegabilidade'
