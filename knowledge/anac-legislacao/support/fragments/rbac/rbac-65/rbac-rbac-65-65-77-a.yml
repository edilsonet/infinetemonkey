section_title: Requisitos de experiência prática
subsection_id: a
cite: 65.77(a)
title: 65.77(a)
text: '(a) O requerente de uma licença de mecânico de manutenção aeronáutica, ou habilitação
  associada,

  deve apresentar declaração de experiência profissional, conforme previsto na seção 65.90,
  que

  comprove experiência prática com os procedimentos, métodos, materiais, ferramentas, instrumentos

  e equipamentos utilizados na construção, manutenção ou alteração em células (no caso de
  solicitação

  de habilitação em célula), grupos motopropulsores (no caso de solicitação de habilitação
  em grupo

  motopropulsor) ou aviônicos (no caso de solicitação de habilitação em aviônico), em empresa
  aérea

  ou em empresa de manutenção certificada segundo o RBAC nº 121, RBAC nº 135 ou RBAC nº 145,

  pelo prazo mínimo de:

  (1) 18 (dezoito) meses, no caso da comprovação de experiência prática para uma única

  habilitação; ou

  (2) 30 (trinta) meses, no caso da comprovação da experiência prática concomitante para mais

  de uma habilitação.'
