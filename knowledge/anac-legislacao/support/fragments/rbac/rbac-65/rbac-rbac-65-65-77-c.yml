cite: 65.77(c)
title: 65.77(c)
text: '(c) Graduados em engenharia aeronáutica, elétrica, eletrônica, mecânica ou mecânica
  aeronáutica,

  bem como outros engenheiros que tenham registrado nos seus assentamentos junto ao Conselho

  Regional de Engenharia e Agronomia (CREA) a atribuição para exercer a atividade relacionada
  com

  a manutenção de aeronaves, são isentos de realizar curso de formação de mecânico de manutenção

  aeronáutica correspondente à pertinente habilitação, e podem se submeter aos exames teóricos
  da

  ANAC, sem demonstrar o disposto no parágrafo (a)(4) desta seção, desde que enviem seus currículos

  completos, com declaração de experiência de forma aceitável pela ANAC, comprovante de

  escolaridade, certificados de cursos de familiarização em produto aeronáutico, conforme
  aplicável,

  para análise e parecer da ANAC.'
