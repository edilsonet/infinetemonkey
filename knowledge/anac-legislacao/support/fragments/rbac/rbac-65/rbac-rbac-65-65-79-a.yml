cite: 65.79(a)
title: 65.79(a)
text: '(a) O requerente de licença de mecânico de manutenção aeronáutica, ou habilitação associada,

  deve ser aprovado em exames oral e prático na habilitação requerida. O exame prático verifica
  as

  habilidades práticas do candidato na execução de tarefas objeto do exame teórico previsto
  para a

  habilitação requerida.'
