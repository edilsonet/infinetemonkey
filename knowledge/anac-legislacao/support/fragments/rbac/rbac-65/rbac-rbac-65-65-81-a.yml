cite: 65.81(a)
title: 65.81(a)
text: '(a) O titular de licença de mecânico de manutenção aeronáutica pode executar ou supervisionar
  a

  manutenção, manutenção preventiva ou uma alteração em um produto aeronáutico para o qual
  possui


  Data da emissão: 25 de maio de 2018


  habilitação técnica, considerando os cursos e treinamentos complementares que possui, e
  pode

  executar os serviços adicionais de acordo com as provisões das seções 65.85, 65.87 e 65.88.

  Entretanto, o titular da licença somente pode supervisionar a manutenção, manutenção preventiva
  ou

  uma alteração em um produto aeronáutico ou aprovar seu retorno ao serviço, conforme as seções

  65.85, 65.87 e 65.88, desde que tenha satisfatoriamente realizado o mesmo serviço em uma
  ocasião

  anterior. Se o titular da licença não executou o serviço em uma ocasião anterior, ele deve
  ser capaz

  de demonstrar sua habilidade para a ANAC, quando for requerido a ele, ou deve demonstrar
  sua

  habilidade sob a supervisão direta de um titular de licença de mecânico de manutenção aeronáutica

  com certificado de habilitação técnica apropriada que tenha a experiência prática prévia
  para esse

  serviço.'
