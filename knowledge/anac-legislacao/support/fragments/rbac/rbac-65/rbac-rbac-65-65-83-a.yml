section_title: Requisitos de experiência recente
subsection_id: a
cite: 65.83(a)
title: 65.83(a)
text: '(a) Exceto como previsto no parágrafo (b) desta seção, o titular de uma licença de
  mecânico de

  manutenção aeronáutica somente pode exercer as prerrogativas de sua licença se nos últimos
  24 (vinte

  e quatro) meses ele tiver, por pelo menos 6 (seis) meses:

  (1) trabalhado na habilitação relacionada com a sua licença;

  (2) supervisionado tecnicamente outros mecânicos de manutenção aeronáutica;

  (3) supervisionado gerencialmente a manutenção ou alteração de uma aeronave;

  (4) atuado no treinamento técnico de pessoal em serviços relacionados a sua habilitação;
  ou

  (5) exercido qualquer combinação dos parágrafos 65.83(a)(1), 65.83(a)(2), 65.83(a)(3) ou

  65.83(a)(4).'
