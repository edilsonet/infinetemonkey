section_title: Requisitos de experiência recente
subsection_id: b
cite: 65.83(b)
title: 65.83(b)
text: '(b) O titular de uma licença, caso não possa comprovar o requisito de experiência recente
  do

  parágrafo (a) desta seção, poderá exercer as prerrogativas de sua licença desde que tenha
  comprovado

  para a ANAC há menos de 24 (vinte e quatro) meses que está apto a executar um determinado
  serviço,

  por meio da realização de exames oral e prático, conforme previsto na seção 65.79.'
