section_title: Prerrogativas adicionais à habilitação em célula
subsection_id: a
cite: 65.85(a)
title: 65.85(a)
text: '(a) O titular de licença de mecânico de manutenção aeronáutica com habilitação em célula
  pode,

  considerando cursos e treinamentos realizados, aprovar o retorno ao serviço de uma célula,
  ou

  qualquer equipamento ou componente relacionado a essa célula, após ele ter executado,

  supervisionado ou inspecionado sua manutenção, manutenção preventiva ou alteração, incluindo

  também a manutenção preventiva de aeronaves conforme o parágrafo A43.1(c) do Apêndice A
  do


  Data da emissão: 25 de maio de 2018


  conforme previsto na seção 43.7 do RBAC nº 43.'
