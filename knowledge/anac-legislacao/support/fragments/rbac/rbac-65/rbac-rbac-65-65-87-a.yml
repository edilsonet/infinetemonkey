section_title: Prerrogativas adicionais à habilitação em grupo motopropulsor
subsection_id: a
cite: 65.87(a)
title: 65.87(a)
text: '(a) O titular de licença de mecânico de manutenção aeronáutica com habilitação em grupo

  motopropulsor pode, considerando cursos e treinamentos realizados, aprovar o retorno ao
  serviço de

  um motor, hélice, unidade auxiliar de energia, ou qualquer equipamento ou componente relacionado

  a esse grupo motopropulsor, após ele ter executado, supervisionado ou inspecionado sua manutenção,

  manutenção preventiva ou alteração, incluindo também a manutenção preventiva de aeronaves

  conforme o parágrafo A43.1(c) do Apêndice A do RBAC nº 43. As aprovações para retorno ao
  serviço

  estabelecidas nesta seção são aquelas autorizadas conforme previsto na seção 43.7 do RBAC
  nº 43.'
