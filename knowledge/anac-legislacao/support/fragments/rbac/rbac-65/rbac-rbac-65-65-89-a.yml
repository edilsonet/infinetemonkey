title: 65.89(a)
text: '(a) O titular de uma licença de mecânico de manutenção aeronáutica deve manter uma
  cópia da

  sua licença no local em que exerce suas prerrogativas, e apresentá-la para inspeção da ANAC
  quando

  requerido.'
