cite: 67.1(a)
title: 67.1(a)
text: '(a) Este Regulamento aplica-se a:

  (1) qualquer pessoa que deseje obter ou revalidar um Certificado Médico Aeronáutico (CMA)
  de 1ª

  classe, 2ª classe, 4ª classe ou 5ª classe; (Redação dada pela Resolução nº 420, de 02.05.2017)

  (2) qualquer médico ou clínica médica que deseje se credenciar junto à ANAC para realizar
  exames

  de saúde periciais em pessoas que desejem obter ou revalidar um CMA de 1ª classe, 2ª classe,
  4ª classe ou

  5ª classe; e (Redação dada pela Resolução nº 420, de 02.05.2017)

  (3) qualquer entidade pública que firme convênios com a ANAC para exercer atribuições referentes

  a este Regulamento.'
