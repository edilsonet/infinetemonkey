cite: 67.1(b)
title: 67.1(b)
text: '(b) Este Regulamento estabelece os requisitos que devem ser atendidos para que:

  (1) uma pessoa possa obter ou revalidar um CMA de 1ª classe, 2ª classe, 4ª classe ou 5ª

  classe; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (2) um médico ou clínica médica possa receber um credenciamento da ANAC para realizar exames

  de saúde periciais em pessoas que desejem obter ou revalidar um CMA de 1ª classe, 2ª classe,
  4ª classe ou

  5ª classe; e

  (3) qualquer entidade pública que firme convênios com a ANAC para exercer atribuições referentes

  a este Regulamento possa desempenhar tais atribuições.'
