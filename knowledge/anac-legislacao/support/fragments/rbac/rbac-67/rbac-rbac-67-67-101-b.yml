title: 67.101(b)
text: '(b) O candidato que não atender o requisito do parágrafo (a) desta seção, ainda pode
  ser considerado

  apto se:

  (1) tiver uma capacidade de discriminação auditiva normal da linguagem verbal (linguajar
  técnico

  aeronáutico), com um ruído de fundo que reproduza ou simule as mesmas características de
  mascaramento

  do ruído do posto de pilotagem durante o voo, com respeito à voz humana (direta ou transmitida
  pelos

  meios aeronáuticos habituais), aos sinais de radiocomunicação e aos sinais de rádiofaróis.
  Como alternativa,

  este exame pode ser realizado no próprio posto de pilotagem, caso seja viável; e

  (2) puder ouvir uma voz de intensidade normal (85 a 95 dB), em um quarto silencioso (aquele
  em que

  a intensidade do ruído de fundo não chega a 50 dB, medida na resposta “lenta” de um medidor
  de nível

  sonoro com ponderação “A”), com ambos os ouvidos, a uma distância de 2 metros do examinador
  e de

  costas para o mesmo.'
