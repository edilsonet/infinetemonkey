text: '(c) Nos processos estabelecidos no parágrafo (b) desta seção, na escolha do que falar
  não se deve usar,

  exclusivamente, textos do tipo aeronáuticos. As listas de palavras equilibradas foneticamente
  devem ser

  utilizadas (Logoaudiometria).'
