title: 67.101(e)
text: '(e) O candidato que não conseguir atender aos requisitos desta seção em nenhum ouvido,
  ainda assim

  poderá obter um CMA no qual constará a restrição “Não válido para voos onde o uso de rádios
  para

  comunicações bilaterais é necessário ou para atuar como comissário de voo”. (Incluído pela
  Resolução nº

  536, de 04.12.2019)'
