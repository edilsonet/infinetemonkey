cite: 67.103(a)
title: 67.103(a)
text: '(a) Nos exames de saúde periciais iniciais e nas revalidações, o candidato deve atender
  aos seguintes

  requisitos odontológicos:

  (1) presença de um número de dentes compatível com uma função mastigatória assintomática,

  tolerando-se próteses que satisfaçam essa condição e que não prejudiquem a fonação;

  (2) ausência de cáries profundas;

  (3) ausência de moléstias periodontais evidenciáveis ao exame visual ou radiográfico;


  Data da emissão: 29 de setembro de 2021


  (4) ausência de afecções periapicais constatadas visualmente ou em exames radiográficos;

  (5) ausência de deformidades maxilares ósseas, ou de tecidos moles ou dentários, congênitas
  ou

  adquiridas, que dificultem a mastigação ou a articulação da palavra;

  (6) ausência de curativo dentário; e

  (7) ausência de tratamento endodôntico em curso.'
