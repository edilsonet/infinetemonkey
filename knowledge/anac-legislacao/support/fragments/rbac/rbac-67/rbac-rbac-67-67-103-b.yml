title: 67.103(b)
text: '(b) Devem ser anotadas todas as próteses, ausências dentárias, alterações nos elementos
  dentários,

  mucosas e anexos da cavidade oral. A atualização do odontograma deve ser realizada a cada
  5 anos.'
