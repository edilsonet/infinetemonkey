section_title: Requisitos de exames após acidente ou incidente aeronáutico grave
subsection_id: b
cite: 67.105(b)
title: 67.105(b)
text: '(b) Nos exames de saúde periciais após acidente ou incidente aeronáutico grave em que
  tenha havido

  colisão ou parada brusca da aeronave, podem ser exigidos adicionalmente do candidato, a
  critério do

  examinador ou da ANAC, os seguintes laudos: (Redação dada pela Resolução nº 547, de 19.03.2020)

  (1) laudo de neurologista avaliando o sistema nervoso central e periférico;

  (2) laudo de estudo por imagem da aorta torácica e de órgãos intratorácicos; e

  (3) laudo de estudo por imagem da aorta abdominal e de órgãos intra-abdominais.'
