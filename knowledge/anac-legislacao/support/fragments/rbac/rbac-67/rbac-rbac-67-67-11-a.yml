section_title: Condições para a concessão ou revalidação de um CMA
subsection_id: a
cite: 67.11(a)
title: 67.11(a)
text: '(a) Para uma pessoa poder tornar-se candidata a um exame de saúde pericial para concessão
  ou

  revalidação de um CMA, ela deve:

  (1) se apresentar a um examinador, de acordo com a classe de CMA pretendida e de acordo
  com as

  disposições dos parágrafos 67.45(a), 67.45(b) e 67.57(a) deste Regulamento; e

  (2) apresentar prova de identidade por meio de um documento de identificação oficial, com
  foto,

  válido no território nacional. (Redação dada pela Resolução nº 547, de 19.03.2020)'
