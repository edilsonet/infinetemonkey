section_title: Condições para a concessão ou revalidação de um CMA
subsection_id: b
cite: 67.11(b)
title: 67.11(b)
text: '(b) O candidato que, após prévio exame de saúde pericial, devidamente respaldado por
  documentos que

  comprovem a realização desses exames, cumprir com os requisitos psicofísicos das subpartes
  C a G deste

  Regulamento, conforme aplicáveis, estará apto a receber ou a revalidar um CMA da classe
  correspondente

  à solicitada. (Redação dada pela Resolução nº 420, de 02.05.2017)'
