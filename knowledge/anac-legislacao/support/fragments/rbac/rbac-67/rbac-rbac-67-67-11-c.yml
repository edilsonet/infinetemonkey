section_title: Condições para a concessão ou revalidação de um CMA
subsection_id: c
cite: 67.11(c)
title: 67.11(c)
text: '(c) Caso não concorde com a decisão do examinador, o candidato poderá, a qualquer tempo,
  recorrer da

  decisão junto à ANAC, que julgará a questão, auxiliada ou não por outros examinadores que
  não tenham

  participado do primeiro julgamento, e emitirá julgamento em favor ou contra o recurso do
  candidato. A

  ANAC pode, a seu critério, exigir teste de proficiência de voo para julgar recurso do candidato.

  (1) Se a causa geradora do julgamento “não apto” ou “apto com restrição”, por parte de um

  examinador, não mais existir, o candidato poderá se submeter ao mesmo examinador que lhe
  tenha

  anteriormente julgado e demonstrar que a causa não mais existe.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
