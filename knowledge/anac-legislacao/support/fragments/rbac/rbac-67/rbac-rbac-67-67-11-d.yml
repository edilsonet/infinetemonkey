section_title: Condições para a concessão ou revalidação de um CMA
subsection_id: d
cite: 67.11(d)
title: 67.11(d)
text: '(d) O candidato que possua um CMA expirado há mais de 5 (cinco) anos sem revalidá-lo,
  ao pretender

  retornar à atividade aérea, deve ser submetido a um exame de saúde pericial inicial previsto
  para o CMA

  do qual seja detentor. (Redação dada pela Resolução nº 547, de 19.03.2020)'
