title: 67.111(b)
text: '(b) (b) Ressalvados os exames requeridos por esta subparte, outros exames médicos ou
  psicológicos

  adicionais poderão ser requeridos a critério do examinador ou da ANAC, caso estes os considerem

  necessários para julgar a aptidão psicofísica do candidato. A necessidade de exames adicionais
  deve ser

  justificada expressamente nos registros médicos. (Redação dada pela Resolução nº 547, de
  19.03.2020)'
