section_title: Requisitos mentais e comportamentais
subsection_id: b
cite: 67.115(b)
title: 67.115(b)
text: '(b) O candidato não pode possuir histórico médico ou diagnóstico clínico de:

  (1) transtorno mental orgânico;

  (2) transtorno mental e comportamental devido ao uso de substância psicoativa, o que inclui
  a

  síndrome de dependência induzida pelo álcool ou outras substâncias psicoativas;

  (3) esquizofrenia, transtorno esquizotípico ou delirante;

  (4) transtorno do humor (afetivo);

  (5) transtorno neurótico, transtorno relacionado com o estresse ou transtorno somatoforme;

  (6) síndrome comportamental associada com distúrbios fisiológicos e fatores físicos;

  (7) transtorno de personalidade ou de comportamento em adultos;

  (8) retardo mental;

  (9) transtorno do desenvolvimento psicológico;

  (10) transtorno do comportamento ou transtorno emocional, com início usualmente na infância
  e

  adolescência; ou

  (11) transtorno mental não especificado nos parágrafos anteriores de tal forma que possa
  tornar o

  candidato não apto para o exercício seguro das prerrogativas da licença para a qual se aplica
  ou que detém.'
