cite: 67.115(c)
title: 67.115(c)
text: '(c) Um candidato com depressão, sendo tratado com medicamentos antidepressivos, deve
  ser julgado

  não apto, a menos que o psiquiatra, com acesso aos detalhes do caso em questão, considere
  que a condição

  do candidato não vai trazer prejuízo para o exercício seguro das prerrogativas da licença
  e da habilitação

  do candidato.

  Nota: orientações sobre a avaliação de candidatos tratados com medicação antidepressiva
  podem ser

  encontradas no Manual de Medicina de Aviação Civil da ICAO (Manual of Civil Aviation Medicine
  Doc

  8984).'
