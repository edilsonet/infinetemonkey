title: 67.115(h)
text: '(h) A avaliação psicológica deverá ocorrer nos exames de saúde periciais iniciais,
  pós-acidente, pós-

  incidente aeronáutico grave e a cada 5 (cinco) anos nos exames de saúde periciais de revalidação
  ou, a

  qualquer tempo, se solicitado pela ANAC ou por um profissional de saúde.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
