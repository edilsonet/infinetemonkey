section_title: Requisitos neurológicos
subsection_id: i
cite: 67.117(i)
title: 67.117(i)
text: '(i) anormal, caracterizado pela presença de grafoelementos epileptiformes; ou

  (ii) com lentificações focais ou generalizadas, contínuas ou paroxísticas, da atividade
  elétrica

  cerebral, sugestivas de qualquer tipo de anomalia cerebral. Neste caso, o CMA poderá ser
  emitido se uma

  ressonância nuclear magnética de crânio não demonstrar lesão estrutural significativa e
  se o candidato não

  for portador de patologia neurológica que possa, a critério do examinador ou da ANAC, afetar
  a segurança

  de voo;

  (6) diminuição recorrente total ou parcial do nível de consciência e/ou uma perda da função

  neurológica, sem explicação médica satisfatória de sua causa, ou que seja manifestação de

  comprometimento neurológico irreversível; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (7) infarto cerebral ou cerebelar;

  (8) insuficiência vascular cerebral;

  (9) aneurisma;

  (10) hemorragia meníngea ou intracerebral;

  (11) enxaquecas acompanhadas de fenômenos oculares e neurológicos focais transitórios;

  (12) neoplasia cerebral;

  (13) perda transitória recorrente de controle do sistema nervoso sem explicação médica satisfatória.

  No caso de episódio único de perda total ou parcial da consciência, o examinador deve julgar
  o caso em

  conjunto com a ANAC; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (14) transtornos neurológicos que produzam perda de equilíbrio, sensibilidade, força muscular
  ou

  coordenação neuromuscular; e

  (15) intervenção cirúrgica cerebral ou traumatismos craneoencefálicos com sequelas detectadas
  por

  exames de imagem ou clínico que, a critério do examinador ou da ANAC, possam afetar o exercício
  das

  atribuições correspondentes ao CMA solicitado e/ou a segurança de voo.'
