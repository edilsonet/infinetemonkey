cite: 67.119(c)
title: 67.119(c)
text: '(c) Nos casos previstos nos parágrafos (b)(1), (b)(2) e (b)(3) desta seção:

  (1) o julgamento do examinador em consulta com a ANAC, caso favorável ao candidato à

  revalidação, deve ser “apto com restrição”; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (2) a validade concedida para o CMA deve ser de no máximo 6 meses; e

  (3) os exames citados nos parágrafos (b)(1)(i), (b)(2)(i) e (b)(3)(i) desta seção devem
  ser realizados

  por serviços médicos especializados (não necessariamente no examinador) e, nos futuros exames
  de saúde

  periciais de revalidação, fica a critério do examinador ou da ANAC realizá-los ou não, sem
  prejuízo dos

  exames requeridos pelo parágrafo (d) desta seção.'
