cite: 67.119(f)
title: 67.119(f)
text: '(f) O tabagismo, o sedentarismo, a obesidade e a dislipidemia devem ser explorados
  pelo examinador

  ou pela ANAC, a cada exame de saúde pericial, no pessoal do sexo masculino com mais de 35
  anos de

  idade e do sexo feminino em fase pós-menopausa, com antecedentes familiares de enfermidades
  arteriais,

  hipertensos e com alterações de metabolismo dos hidratos de carbono e outras, por seu alto
  risco combinado

  de enfermidades arteriais. A critério do examinador ou da ANAC, podem ser exigidos exames
  adicionais

  ou reduzido o prazo de validade do CMA com base nesses históricos.'
