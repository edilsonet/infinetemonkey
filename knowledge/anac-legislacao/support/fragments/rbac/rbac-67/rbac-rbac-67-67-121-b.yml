title: 67.121(b)
text: '(b) A telerradiografia de tórax deve ser exigida pelo examinador ou pela ANAC em todos
  os exames de

  saúde periciais iniciais. Nos exames de saúde periciais de revalidação, a telerradiografia
  pode ser exigida,

  a critério do examinador ou da ANAC, caso haja razões para se suspeitar de enfermidades
  pulmonares

  assintomáticas. (Redação dada pela Resolução nº 547, de 19.03.2020)'
