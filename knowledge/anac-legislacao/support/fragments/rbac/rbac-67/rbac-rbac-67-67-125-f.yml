cite: 67.125(f)
title: 67.125(f)
text: '(f) O candidato em uso de hipoglicemiantes por via oral pode ser julgado apto desde
  que fique

  constatado, após um período de observação de 60 dias, um controle satisfatório da glicemia,
  que deve ser

  superior a 69mg/dl e inferior a 140mg/dl, e que o examinador ou a ANAC, a seu critério,
  considere que não

  seja provável que afete a segurança de voo. Neste caso, a validade máxima a ser concedida
  para o CMA

  revalidado deve ser de 6 meses no caso de pilotos e os não pilotos de acordo com a seção
  67.15.'
