section_title: Requisitos nefrológicos e urológicos
subsection_id: b
cite: 67.129(b)
title: 67.129(b)
text: '(b) O candidato que sofra de sequelas de enfermidades ou de intervenções cirúrgicas
  nos rins ou nas vias

  genitourinárias, especialmente as obstruções por estenose, compressão ou urolitíase deve
  ser declarado não

  apto, a menos que a condição tenha sido objeto de investigação médica e que, a critério
  da ANAC, não seja

  provável que a condição afete a segurança de voo.'
