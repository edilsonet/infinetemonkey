cite: 67.13(a)
title: 67.13(a)
text: '(a) Um CMA de 1ª classe válido deve ser obrigatoriamente exigido de um detentor de
  licença das

  seguintes categorias: (Redação dada pela Resolução nº 547, de 19.03.2020)

  (1) Piloto de Linha Aérea (PLA);

  (2) Piloto Comercial (PC); e

  (3) piloto de tripulação múltipla (PTM). (Redação dada pela Resolução nº 547, de 19.03.2020)'
