cite: 67.13(b)
title: 67.13(b)
text: '(b) Um CMA de 2ª classe válido deve ser obrigatoriamente exigido de um candidato ou
  detentor de

  licença das seguintes categorias:

  (1) piloto privado (PP);

  (2) piloto privado com habilitação IFR (PP-IFR), sendo necessário o cumprimento dos requisitos

  oftalmológicos correspondentes ao CMA de 1ª classe;

  (3) comissário de voo;

  (4) mecânico de voo;

  (5) piloto de balão livre (PBL); e

  (6) aluno piloto, exceto para piloto de planador.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
