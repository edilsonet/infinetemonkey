title: 67.13(d)
text: '(d) Um CMA de 4ª classe válido deve ser obrigatoriamente exigido de um candidato ou
  detentor de

  certificado ou habilitação das seguintes categorias:

  (1) piloto aerodesportivo (CPA);

  (2) piloto de planador (PPL); e

  (3) aluno piloto para piloto de planador.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
