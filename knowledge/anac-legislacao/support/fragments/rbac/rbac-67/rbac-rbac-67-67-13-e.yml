text: '(e) Um CMA de 5ª classe válido deve ser obrigatoriamente exigido de um candidato ou
  detentor de

  licença ou habilitação de piloto-remoto de aeronave remotamente pilotada, tal como especificado
  no

  Regulamento específico. (Redação dada pela Resolução nº 547, de 19.03.2020)'
