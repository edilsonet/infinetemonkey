text: '(g) Um CMA de 1ª classe válido pode ser apresentado em lugar de um CMA de 2ª, 4ª ou
  5ª classe, assim

  como um CMA de 2ª classe válido pode ser apresentado em lugar de um CMA de 4ª ou 5ª classe.'
