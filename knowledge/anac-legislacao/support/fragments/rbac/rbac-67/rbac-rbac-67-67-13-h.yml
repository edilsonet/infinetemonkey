cite: 67.13(h)
title: 67.13(h)
text: '(h) Um CMA só pode ser revalidado na mesma classe, ou um CMA de 1ª classe pode ser
  revalidado

  como um CMA de 2ª, 4ª ou 5ª classe, ou um CMA de 2ª classe pode ser revalidado como um CMA
  de 4ª

  ou 5ª classe, bastando o candidato à revalidação submeter-se a um exame de saúde pericial
  de revalidação

  com os critérios da classe pretendida e permitida. (Redação dada pela Resolução nº 547,
  de 19.03.2020)'
