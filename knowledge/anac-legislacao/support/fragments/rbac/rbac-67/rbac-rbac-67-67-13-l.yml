title: 67.13(l)
text: '(l) Nenhuma pessoa do sexo feminino pode exercer qualquer função a bordo de aeronave
  em voo a partir

  do momento em que seja constatada a sua gravidez, exceto quando exercendo as prerrogativas
  de um CMA

  de 4ª classe e respeitados os requisitos da seção 67.213.

  (Redação dada pela Resolução nº 420, de 02.05.2017)'
