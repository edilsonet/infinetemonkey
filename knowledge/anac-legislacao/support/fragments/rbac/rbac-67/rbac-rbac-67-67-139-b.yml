title: 67.139(b)
text: '(b) O candidato piloto que tenha sido submetido a cirurgia refrativa pode ser julgado
  apto desde que

  tenha mais de 6 (seis) meses de operado e providencie, por conta própria e caso seja solicitado
  pelo

  examinador ou pela ANAC, teste de ofuscamento e de sensibilidade ao contraste. Estes testes
  devem estar

  dentro dos limites da normalidade. (Redação dada pela Resolução nº 547, de 19.03.2020)'
