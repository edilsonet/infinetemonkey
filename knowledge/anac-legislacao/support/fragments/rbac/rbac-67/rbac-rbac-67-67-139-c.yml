cite: 67.139(c)
title: 67.139(c)
text: '(c) O candidato deve atender aos seguintes requisitos visuais:

  (1) deve possuir acuidade visual para longe, com ou sem correção óptica, igual ou superior
  a 20/40

  para cada olho separadamente, e igual ou superior a 20/30 para a visão binocular. Este requisito
  pode ser

  atendido com o uso de lentes corretoras (óculos ou lentes de contato); (Redação dada pela
  Resolução nº

  547, de 19.03.2020)


  Data da emissão: 29 de setembro de 2021


  (2) deve ser capaz de ler, com ou sem correção por óculos ou lentes de contato, a escala
  J1 ou sua

  equivalente à distância selecionada pelo examinando na faixa de 30 (trinta) a 50 (cinquenta)
  cm. Caso este

  requisito só possa ser atendido com correção (por óculos ou lentes de contato), o candidato
  deve portá-la e

  utilizá-la ao ser submetido aos exames de saúde periciais; (Redação dada pela Resolução
  nº 547, de

  19.03.2020)

  (3) deve demonstrar que um único par de óculos ou lentes de contato (caso precise utilizá-los)
  é

  suficiente para atender aos requisitos de visão para perto e para longe, sem trocar ou retirar
  os óculos.

  Óculos bifocais, multifocais ou tipo meia-taça podem ser usados pelo candidato para atender
  a este

  requisito; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (4) caso precise de correção para atender aos requisitos visuais deste Regulamento, deve
  figurar

  expresso no campo de observações do CMA, caso concedido, que o tripulante deve usar a correção,
  e que

  deve portar um par de óculos reserva (mesmo quando usando correção por lentes de contato),
  quando

  desempenhando as atribuições de sua licença e habilitação;

  (5) deve reconhecer as cores misturadas nas tabelas de senso cromático ou, no mínimo, as
  cores

  básicas isoladas usadas em aviação (amarelo, azul, verde, vermelho, branco, preto e âmbar);
  (Redação dada

  pela Resolução nº 547, de 19.03.2020)

  (6) o piloto pode ter visão monocular nos exames de saúde periciais de revalidação ou nos
  exames de

  saúde periciais iniciais pós-acidente ou incidente grave, desde que o olho bom atenda aos
  requisitos desta

  seção. Em qualquer outro caso, não pode deixar de possuir visão de profundidade normal,
  não podendo,

  portanto, ser monocular; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (7) o candidato não piloto pode ter visão monocular nos exames de saúde periciais iniciais
  e de

  revalidação;

  (8) deve possuir equilíbrio muscular perfeito, sendo permitido, no máximo, 1 dioptria prismática
  de

  hiperforia, 5 de exoforia e 10 de endoforia e capacidade de divergência de 3 a 15 dioptrias
  prismáticas;

  (9) não pode possuir heterotropia; e

  (10) deve apresentar campos visuais, pressão ocular, fundo dos olhos (fundoscopia) e córneas

  normais.'
