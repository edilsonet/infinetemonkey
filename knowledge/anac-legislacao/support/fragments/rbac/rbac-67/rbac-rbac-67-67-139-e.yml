title: 67.139(e)
text: '(e) Com exceção do exposto no parágrafo (f) desta seção, as acuidades visuais de longa,
  média e curta

  distância, tanto corrigidas como não corrigidas, devem ser medidas e registradas a cada
  exame de saúde

  pericial. A critério do examinador ou da ANAC, outros exames adicionais podem ser requeridos,
  desde que

  haja suspeita justificada de não aptidão. Entre as causas que podem justificar a exigência
  de exames

  adicionais, incluem-se:

  (1) uma diminuição significativa da acuidade visual corrigida;

  (2) o aparecimento de oftalmopatia;

  (3) lesões no olho; e

  (4) cirurgias oftálmicas.'
