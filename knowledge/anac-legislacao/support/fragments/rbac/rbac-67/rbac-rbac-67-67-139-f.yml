title: 67.139(f)
text: '(f) O candidato que usa lentes de contato não precisa ser submetido a medições de acuidade
  visual sem

  correção a cada novo exame de saúde pericial de revalidação, desde que se conheça o histórico
  de prescrição

  de suas lentes de contato e sua adaptação a elas.


  Data da emissão: 29 de setembro de 2021'
