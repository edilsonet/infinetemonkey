title: 67.141(a)
text: '(a) Candidatos da categoria PP devem atender aos requisitos auditivos da seção 67.101.
  Os demais

  candidatos devem ser capazes de ouvir uma voz de intensidade normal (85 a 95 dB), em um
  quarto

  silencioso (aquele em que a intensidade do ruído de fundo não chega a 50 dB, medida na resposta
  “lenta”

  de um medidor de nível sonoro com ponderação “A”), com ambos os ouvidos, a uma distância
  de 2 metros

  do examinador e de costas para o mesmo.'
