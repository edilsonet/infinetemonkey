title: 67.145(d)
text: '(d) Os casos de incidente aeronáutico grave poderão receber isenção dos parágrafos
  (a) e (b) dessa seção,

  mediante laudo médico que justifique essa medida, desde que emitido pelo responsável médico
  do setor de

  medicina da empresa aérea onde atua o tripulante envolvido.

  (Redação dada pela Resolução nº 547, de 19.03.2020)


  Data da emissão: 29 de setembro de 2021


  SUBPARTE E

  [RESERVADO]'
