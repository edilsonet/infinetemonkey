title: 67.15(b)
text: '(b) O prazo de validade de um CMA deve levar em conta a capacidade do candidato em
  cumprir os

  requisitos deste Regulamento ao longo de todo o período da validade do CMA e pode ser reduzido
  em

  relação ao expresso pelo parágrafo (a) desta seção, a critério do examinador ou da ANAC,
  caso estes

  considerem clinicamente recomendado. Neste caso, a justificativa da redução deve constar
  expressa nos

  registros dos exames de saúde periciais.'
