cite: 67.15(c)
title: 67.15(c)
text: '(c) O detentor de um CMA válido deve reportar à ANAC, ou ao examinador responsável
  pela sua

  certificação, qualquer diminuição de suas aptidões psicofísicas que possa impedi-lo de exercer
  as

  prerrogativas de suas licenças e habilitações sem afetar a segurança de voo, assim como
  deixar de exercer

  essas prerrogativas até obter um novo julgamento “apto” ou “apto com restrição” por parte
  de um

  examinador ou da ANAC.

  (1) A ANAC, para fundamentar seu julgamento e a fim de dirimir dúvidas acerca da aptidão

  psicofísica, poderá solicitar um parecer de um profissional de saúde.


  Data da emissão: 29 de setembro de 2021


  (Redação dada pela Resolução nº 547, de 19.03.2020)'
