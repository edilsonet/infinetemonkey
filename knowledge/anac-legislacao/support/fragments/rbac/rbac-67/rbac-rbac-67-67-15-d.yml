text: '(d) São também responsáveis por reportar as diminuições das aptidões psicofísicas dos
  candidatos, tão

  logo tomem conhecimento do caso:

  (1) o examinador;

  (2) o CENIPA ou qualquer outro pessoal responsável por investigação de acidentes ou incidentes;

  (3) o operador aéreo, através de seu serviço médico;

  (4) os servidores designados pela ANAC; e (Incluído pela Resolução nº 547, de 19.03.2020)

  (5) as organizações regidas pelos RBHA 140 e 141 ou RBAC que venham a substituí-los e pelo'
