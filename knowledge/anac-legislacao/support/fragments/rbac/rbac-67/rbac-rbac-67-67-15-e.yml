text: '(e) A data de validade de um CMA deve ser estabelecida obedecendo-se aos seguintes
  critérios:

  (1) se for a primeira concessão de um CMA, ou caso se trate da revalidação de um CMA vencido
  ou

  suspenso, a data de validade deve ser a data do exame de saúde pericial mais o prazo estabelecido
  pelo

  parágrafo (a) desta seção;

  (2) caso se trate da revalidação de um CMA ainda válido, a data de expiração deve ser:'
