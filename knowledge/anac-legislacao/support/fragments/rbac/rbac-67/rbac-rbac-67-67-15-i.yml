cite: 67.15(i)
title: 67.15(i)
text: '(i) após o aniversário de 40 (quarenta) anos do piloto que opere no transporte aéreo
  público de

  passageiros com apenas 1 (um) piloto; e

  (ii) após o aniversário de 60 (sessenta) anos do piloto que opere em transporte aéreo público;

  (2) 60 (sessenta) meses para as categorias Aluno Piloto, PP, PP-IFR, PBL, PPL e CPA nos
  exames

  de saúde periciais realizados antes do aniversário de 40 (quarenta) anos do candidato;

  (3) 24 (vinte e quatro) meses para as categorias Aluno Piloto, PP, PP-IFR, PBL, PPL e CPA
  nos

  exames de saúde periciais realizados em ou após o aniversário de 40 (quarenta) anos e antes
  do aniversário

  de 50 (cinquenta) anos do candidato;

  (4) 12 (doze) meses para as categorias Aluno Piloto, PP, PP-IFR, PBL, PPL e CPA nos exames
  de

  saúde periciais realizados em ou após o aniversário de 50 (cinquenta) anos do candidato;

  (5) 12 (doze) meses para o mecânico de voo;

  (6) 48 (quarenta e oito) meses para o piloto remoto de aeronave remotamente pilotada;

  (7) 60 (sessenta) meses para o comissário de voo nos exames de saúde periciais realizados
  antes do

  aniversário de 60 (sessenta) anos do candidato; e

  (8) 24 (vinte e quatro) meses para o comissário de voo nos exames de saúde periciais realizados
  em

  ou após o aniversário de 60 (sessenta) anos do candidato.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
