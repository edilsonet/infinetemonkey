section_title: Suspensão, revogação ou cassação de um CMA
subsection_id: a
cite: 67.17(a)
title: 67.17(a)
text: '(a) Um CMA vigente será suspenso por qualquer uma das seguintes razões:

  (1) quando o seu detentor tomar parte em acidente ou incidente aeronáutico grave, exceto
  mediante

  laudo médico que justifique a não aplicação da suspensão nos termos do parágrafo 67.105(d)
  ou 67.145(d);

  (2) quando o seu detentor, ou qualquer um especificado pelo parágrafo 67.15(d) deste Regulamento,

  informar e for ratificada a ocorrência de uma diminuição de aptidão psicofísica.'
