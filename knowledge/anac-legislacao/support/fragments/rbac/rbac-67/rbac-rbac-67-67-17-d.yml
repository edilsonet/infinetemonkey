section_title: Suspensão, revogação ou cassação de um CMA
subsection_id: d
cite: 67.17(d)
title: 67.17(d)
text: '(d) Caso a ANAC constate, por qualquer meio legal, que o candidato omitiu informações
  requeridas por

  este Regulamento, o CMA, caso concedido, será cassado, e o candidato deverá se submeter
  a novo exame

  de saúde pericial inicial para obter novo CMA.'
