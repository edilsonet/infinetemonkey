section_title: Suspensão, revogação ou cassação de um CMA
subsection_id: e
cite: 67.17(e)
title: 67.17(e)
text: '(e) Se for constatado, por qualquer meio legal, que uma pessoa detentora de um CMA
  emitido segundo

  este Regulamento exerceu as atribuições de suas licenças e habilitações em condição psicofísica
  proibida

  por este Regulamento, o seu CMA será cassado e essa pessoa só poderá se candidatar para
  obter novo CMA

  em um prazo de 180 (cento e oitenta) dias, contados a partir da data da cassação.'
