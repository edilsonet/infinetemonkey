section_title: Suspensão, revogação ou cassação de um CMA
subsection_id: f
cite: 67.17(f)
title: 67.17(f)
text: '(f) Um CMA vigente será cassado, sem prejuízo das medidas administrativas, e os fatos
  serão

  comunicados ao Ministério Público para a tomada das medidas penais cabíveis, por qualquer
  das seguintes

  razões:

  (1) detecção de fraudes em momento posterior aos exames de saúde periciais. O CMA será cassado

  mesmo que o candidato não tenha sido conivente com a fraude; e


  Data da emissão: 29 de setembro de 2021


  (2) caso o candidato tenha dolosamente prestado informações falsas ou inexatas com o fim
  de obter

  um CMA.'
