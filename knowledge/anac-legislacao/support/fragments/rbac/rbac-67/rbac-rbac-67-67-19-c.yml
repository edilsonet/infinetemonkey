section_title: Convalidação de um certificado médico estrangeiro
subsection_id: c
cite: 67.19(c)
title: 67.19(c)
text: '(c) A ANAC poderá, ainda, para o caso dos requisitos psicofísicos da AAC estrangeira
  serem inferiores

  aos da ANAC, realizar a convalidação de um certificado médico estrangeiro emitido a piloto
  brasileiro,

  obedecendo a sua mesma categoria, possíveis restrições existentes e o prazo de validade,
  desde que sejam

  atendidas as seguintes condições:

  (1) Caberá à área técnica da ANAC responsável pelo processo de certificação médica a indicação
  de

  quais serão os requisitos que deverão ser complementados no Brasil.

  (2) Os requisitos exigidos pela ANAC não contemplados na emissão do certificado médico pela
  AAC

  de origem e avaliados como necessários pela ANAC para convalidação deverão, necessariamente,
  passar

  por avaliação psicofísica no Brasil;

  (3) No campo de observações do CMA, no sistema da ANAC, deverá ser lançado o país de origem

  do Certificado Médico convalidado.

  (Incluído pela Resolução nº 636, de 28.09.2021)


  Data da emissão: 29 de setembro de 2021


  SUBPARTE B

  MÉDICOS CADASTRADOS, MÉDICOS CREDENCIADOS, CLÍNICAS CREDENCIADAS E

  ENTIDADES CONVENIADAS'
