title: 67.191(h)
text: '(h) Exames e/ou métodos investigativos que existam ou venham a ser criados e que produzam
  resultados

  iguais ou superiores aos que são exigidos por esta subparte podem ser adotados em lugar
  destes, a critério

  dos examinadores, desde que isso não implique aumento ou diminuição de exigências aos candidatos
  em

  desacordo com esta subparte, e que a ANAC seja notificada e aprove essa adoção.'
