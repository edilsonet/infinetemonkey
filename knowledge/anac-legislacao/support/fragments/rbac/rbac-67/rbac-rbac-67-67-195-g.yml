title: 67.195(g)
text: '(g) Nos casos de necessidade de avaliação psicológica, os exames de saúde periciais
  devem ser

  acompanhados de parecer psiquiátrico emitido por MC, MCad ou por psiquiatra, atestando que
  o candidato

  cumpre os requisitos desta seção.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
