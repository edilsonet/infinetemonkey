cite: 67.197(a)
title: 67.197(a)
text: '(a) O candidato não pode ter antecedentes comprovados ou diagnóstico clínico de:

  (1) hemiplegia, hemiparesia ou paraplegia, a menos que o candidato seja avaliado por um
  instrutor

  de voo e este ateste que aquele possui proficiência suficiente para receber um CMA;

  (2) enfermidade progressiva ou não progressiva do sistema nervoso, cujos efeitos, a critério
  do

  examinador ou da ANAC, provavelmente afetem a segurança de voo;

  (3) epilepsia;

  (4) diminuição recorrente total ou parcial do nível de consciência e/ou uma perda da função

  neurológica, sem explicação médica satisfatória de sua causa, ou que seja manifestação de

  comprometimento neurológico irreversível; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (5) infarto cerebral ou cerebelar;

  (6) insuficiência vascular cerebral;

  (7) aneurisma;

  (8) hemorragia meníngea ou intracerebral;

  (9) neoplasia cerebral;

  (10) perda transitória recorrente de controle do sistema nervoso sem explicação médica satisfatória.

  No caso de episódio único de perda total ou parcial da consciência, o examinador deve julgar
  o caso em

  conjunto com a ANAC; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (11) transtornos neurológicos que produzam perda de equilíbrio, sensibilidade, força muscular
  ou

  coordenação neuromuscular; e

  (12) qualquer situação que, a critério do examinador ou da ANAC, possam afetar a segurança
  de voo.'
