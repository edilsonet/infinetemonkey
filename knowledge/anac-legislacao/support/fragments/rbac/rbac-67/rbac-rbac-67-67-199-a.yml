section_title: Requisitos cardiológicos
subsection_id: a
cite: 67.199(a)
title: 67.199(a)
text: '(a) Não pode existir qualquer condição cardiológica no candidato que, a critério do
  examinador ou da

  ANAC, afete a segurança de voo. Nos exames de saúde periciais, o candidato deve ser submetido
  aos

  seguintes procedimentos: (Redação dada pela Resolução nº 547, de 19.03.2020)

  (1) anamnese dirigida;

  (2) exame auscultatório;

  (3) eletrocardiograma (ECG), nos candidatos com 40 anos ou mais; e

  (4) outros exames complementares, a critério do examinador ou da ANAC, caso julgue necessário.'
