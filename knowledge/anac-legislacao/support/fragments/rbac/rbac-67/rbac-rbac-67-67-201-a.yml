text: '(a) Uma telerradiografia de tórax deve ser requerida a cada exame de saúde pericial
  inicial; nos exames

  de saúde periciais de revalidação, a critério do examinador ou da ANAC. (Redação dada pela
  Resolução nº

  547, de 19.03.2020)


  Data da emissão: 29 de setembro de 2021'
