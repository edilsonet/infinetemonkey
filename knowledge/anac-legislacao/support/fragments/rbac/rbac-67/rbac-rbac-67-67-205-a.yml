section_title: Requisitos metabólicos, nutricionais e endocrinológicos
subsection_id: a
cite: 67.205(a)
title: 67.205(a)
text: '(a) Nos exames de saúde periciais, o candidato não pode ter diagnóstico de:

  (1) diabetis melitus descompensada;

  (2) hipoglicemia de difícil controle ou sem possibilidade de controle; e

  (3) doença metabólica que não esteja compensada.'
