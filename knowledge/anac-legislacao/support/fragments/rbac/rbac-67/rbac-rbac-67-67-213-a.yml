title: 67.213(a)
text: '(a) Candidatas do sexo feminino grávidas devem ser julgadas não aptas a menos que a
  avaliação

  obstétrica e a supervisão médica continuada indiquem se tratar de gravidez de baixo risco.
  (Redação dada

  pela Resolução nº 547, de 19.03.2020)'
