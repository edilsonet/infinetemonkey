title: 67.213(b)
text: '(b) A candidata grávida só poderá ser julgada apta segundo os critérios do parágrafo
  (a) desta seção entre

  a 12ª e a 26ª semana de gestação. Nas demais semanas de gravidez, a candidata grávida deve
  ser julgada

  não apta.'
