title: 67.215(a)
text: '(a) Com exceção do exposto pelo parágrafo (b) desta seção, nos exames de saúde periciais,
  o candidato

  não pode ser portador de:

  (1) alterações ósteo-articulares, doença ativa ou sequelas funcionais de doenças congênitas
  ou

  adquiridas ou como resultado de acidentes ou outras ações violentas, que possam afetar a
  segurança de voo;

  (2) próteses funcionais em substituição a membros ou parte de membros; e

  (3) ausência de membro(s) ou parte dele(s).


  Data da emissão: 29 de setembro de 2021'
