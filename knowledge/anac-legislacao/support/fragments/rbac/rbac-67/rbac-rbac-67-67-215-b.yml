cite: 67.215(b)
title: 67.215(b)
text: '(b) O examinador ou a ANAC, caso considere factível a concessão do CMA a um candidato
  enquadrado

  nas condições do parágrafo (a) desta seção, poderá encaminhá-lo para avaliação por um examinador

  credenciado e, caso este considere que a deficiência não afeta a segurança de voo, o examinador
  ou a ANAC

  poderá julgá-lo apto. Nos futuros exames de saúde periciais de revalidação, caso a condição
  se mantenha,

  não será necessária a avaliação por um examinador credenciado.'
