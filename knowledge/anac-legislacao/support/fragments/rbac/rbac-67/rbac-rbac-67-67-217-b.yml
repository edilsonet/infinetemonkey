cite: 67.217(b)
title: 67.217(b)
text: '(b) O candidato não pode ser portador de transtornos permanentes dos aparelhos vestibulares.
  O

  candidato que possuir um transtorno passageiro deve ser considerado não apto até a condição
  ser

  restabelecida.'
