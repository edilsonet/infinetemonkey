title: 67.217(c)
text: '(c) O candidato elegível à obtenção de um CMA nos termos do parágrafo 67.221(c) pode
  ser isentado

  do cumprimento de requisitos desta seção se, a critério do examinador ou da ANAC, a condição

  provavelmente não afetar a segurança de voo. (Incluído pela Resolução nº 536, de 04.12.2019)'
