cite: 67.221(a)
title: 67.221(a)
text: '(a) O candidato deve ser capaz de ouvir uma voz de intensidade normal (85 a 95 dB),
  em ambiente

  silencioso (aquele em que a intensidade do ruído de fundo não chega a 50 dB, medida na resposta
  “lenta”

  de um medidor de nível sonoro com ponderação “A”), a uma distância de 2 metros, de costas
  para o

  examinador, em pelo menos um dos ouvidos.'
