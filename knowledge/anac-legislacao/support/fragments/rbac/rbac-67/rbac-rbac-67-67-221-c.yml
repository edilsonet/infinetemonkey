title: 67.221(c)
text: '(c) O candidato que não conseguir atender aos requisitos desta seção em nenhum ouvido,
  ainda assim

  poderá obter um CMA no qual constará a restrição “Não válido para voos onde o uso de rádios
  para

  comunicações bilaterais é necessário”. (Incluído pela Resolução nº 536, de 04.12.2019)'
