section_title: Requisitos de exames após acidente ou incidente aeronáutico grave
subsection_id: a
cite: 67.225(a)
title: 67.225(a)
text: '(a) Após acidente ou incidente aeronáutico grave, o candidato deve se submeter a um
  exame de saúde

  pericial inicial com critérios de revalidação, respeitando os requisitos aplicáveis a estas

  condições. (Redação dada pela Resolução nº 547, de 19.03.2020)'
