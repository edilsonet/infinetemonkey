title: 67.231(c)
text: '(c) Ressalvados os requisitos que devem ser atendidos em observância a esta subparte,
  caso o

  examinador ou a ANAC detecte qualquer condição psicofísica não prevista por este Regulamento
  e que, a

  seu critério, afete a segurança de voo, o candidato poderá ser julgado não apto, desde que
  seja elaborado

  um relatório médico adequado justificando a decisão. (Redação dada pela Resolução nº 547,
  de 19.03.2020)'
