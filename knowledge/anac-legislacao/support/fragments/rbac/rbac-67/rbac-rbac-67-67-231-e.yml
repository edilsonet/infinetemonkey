title: 67.231(e)
text: '(e) O examinador ou a ANAC, qual seja o que tenha realizado o exame de saúde pericial
  no candidato,

  emitirá o respectivo CMA de 5ª classe caso esse candidato tenha sido julgado apto (com ou
  sem restrição)

  no respectivo exame de saúde pericial. Caso o candidato tenha sido julgado “apto com restrição”,
  o campo

  de observações do CMA deve conter as condições em que o candidato não pode atuar e/ou as
  condições

  que ele deve satisfazer para poder atuar.'
