title: 67.235(g)
text: '(g) Nos casos de necessidade de avaliação psicológica, os exames de saúde periciais
  devem ser

  acompanhados de parecer psiquiátrico emitido por médico cadastrado ou por psiquiatra, atestando
  que o

  candidato cumpre os requisitos desta Seção.'
