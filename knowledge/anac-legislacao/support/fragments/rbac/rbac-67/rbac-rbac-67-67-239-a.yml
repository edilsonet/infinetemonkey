cite: 67.239(a)
title: 67.239(a)
text: '(a) Salvo especificações em contrário, nos exames de saúde periciais, nenhum candidato
  à obtenção ou

  revalidação de um CMA pode ter antecedentes nem diagnóstico clínico de:

  (1) angina pectoris;

  (2) anomalia ou doença do coração, congênita ou adquirida, que, a critério do examinador
  ou da

  ANAC, provavelmente afete a segurança de voo;

  (3) qualquer enfermidade que implique cirurgia cardíaca ou arterial, coronarioangioplastia,

  implantação de prótese ou marca-passo e uso de anticoagulantes;

  (4) qualquer forma de doença cardíaca congênita, exceto aquelas em que, a critério do examinador

  ou da ANAC, tenha havido cura cirúrgica indubitável;

  (5) qualquer sopro cardíaco significativo ou doença das válvulas cardíacas;

  (6) qualquer evidência de pericardite ou miocardiopatia;

  (7) qualquer distúrbio significativo do ritmo ou da condução cardíaca;

  (8) pressão arterial sistêmica mantida superior a 140 X 90mmHg. O candidato em uso de

  medicamento anti-hipertensivo pode ser julgado apto desde que a condição, a critério do
  examinador ou da

  ANAC, não afete a segurança de voo;

  (9) qualquer evidência de doença obstrutiva vascular, aneurisma, ou ainda, história de cirurgia
  para

  estas condições. Os candidatos a revalidação nestas condições podem ter revalidados os CMA
  segundo as

  disposições do parágrafo (b)(2) desta seção;

  (10) infarto do miocárdio. Os candidatos a revalidação nesta condição podem ter revalidados
  os CMA

  segundo as disposições do parágrafo (b)(1) desta seção;

  (11) substituição de válvula cardíaca ou transplante de coração;

  (12) alterações eletrocardiográficas compatíveis com síndromes de pré-excitação. No caso
  de

  candidatos que tenham sido submetidos à ablação de Feixe Anômalo para a síndrome de pré-excitação,

  estes poderão ser considerados aptos no mínimo 3 (três) meses após o procedimento e depois
  de

  evidenciado, no reestudo eletrofisiológico, a ausência de conexão anômala; e (Redação dada
  pela Resolução

  nº 547, de 19.03.2020)

  (13) prolapso de válvula mitral, a menos que sejam assintomáticos, sem arritmias e na ausência
  de

  doenças cardíacas associadas, e que satisfaçam os seguintes critérios:'
