title: 67.239(b)
text: '(b) O candidato à revalidação que tenha sido submetido a um processo de revascularização
  miocárdica

  ou angioplastia, ou que possua antecedentes de infarto de miocárdio, com ou sem sequela,
  ou sofra de

  qualquer outro transtorno miocárdico, valvular, ou enfermidade anatomofuncional cardíaca,
  que

  potencialmente pudesse provocar incapacitação durante um voo, deve ser declarado não apto,
  a menos que:

  (1) para os casos de infarto do miocárdio previstos no parágrafo (a)(10) desta seção:


  Data da emissão: 29 de setembro de 2021'
