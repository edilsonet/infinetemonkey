title: 67.239(c)
text: '(c) Nos casos previstos nos parágrafos (b)(1) e (b)(2) desta seção:


  Data da emissão: 29 de setembro de 2021


  (1) o julgamento do examinador em consulta com a ANAC, caso favorável ao candidato à

  revalidação, deve ser “apto com restrição”; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (2) a validade concedida para o CMA deve ser de no máximo 6 meses; e

  (3) os exames citados nos parágrafos (b)(1)(i) e (b)(2)(i) desta seção devem ser realizados
  por serviços

  médicos especializados (não necessariamente no examinador) e, nos futuros exames de saúde
  periciais de

  revalidação, fica a critério do examinador ou da ANAC realizá-los ou não, sem prejuízo dos
  exames

  requeridos pelo parágrafo (d) desta seção.'
