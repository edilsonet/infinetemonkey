text: '(d) Para os candidatos sem antecedentes de problemas cardíacos, a avaliação cardiológica
  constitui-se

  no cumprimento das seguintes etapas:

  (1) anamnese dirigida para o aparelho circulatório;

  (2) exame físico cardiológico;

  (3) realização dos seguintes exames obrigatórios:'
