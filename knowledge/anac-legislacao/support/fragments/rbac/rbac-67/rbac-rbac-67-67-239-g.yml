cite: 67.239(g)
title: 67.239(g)
text: '(g) O candidato cujo ritmo cardíaco seja anormal por arritmias ou bloqueios cardíacos
  deve ser julgado

  não apto, a menos que a arritmia cardíaca e/ou bloqueio cardíaco tenham sido objeto de investigação
  e

  avaliação em conformidade com as melhores práticas médicas aceitáveis pela ANAC, e que se
  haja

  estimado que não seja provável que o problema afete a segurança de voo. (Redação dada pela
  Resolução

  nº 547, de 19.03.2020)'
