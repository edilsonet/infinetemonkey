cite: 67.239(i)
title: 67.239(i)
text: '(i) pelo menos 1 ano após o acidente coronariano, o problema cardíaco tenha sido objeto
  de

  investigação e avaliação de conformidade com as melhores práticas médicas, satisfazendo
  minimamente as

  seguintes exigências:

  (A) Holter de 24 horas (eletro-cardiograma dinâmico) sem evidência de arritmias que

  necessitem tratamento;

  (B) cintilografia miocárdica esforço-repouso sem alterações isquêmicas;

  (C) Eco Doppler, uni e bidimensional, sem alterações significativas;

  (D) lipidograma normal;

  (E) como alternativa aos exames citados nos parágrafos (b)(1)(i)(A), (B) e (C) desta seção,
  o

  candidato pode apresentar cineangiocoronariografia com ventriculografia demonstrando:

  ( 1 ) ausência de aterosclerose significativa de um (quando este for dominante) ou mais

  vasos;

  ( 2 ) função ventricular normal;

  ( 3 ) ausência de trombos intraventriculares ou outras complicações devidas ao acidente

  isquêmico coronariano; e

  ( 4 ) perviedade das pontes e artérias pós revascularização miocárdica porventura realizada;

  (F) não possua Índice de Massa Corporal (IMC) maior ou igual a 30 associado à circunferência

  da cintura maior que 102 cm para homens ou maior que 88 cm para mulheres; e

  (G) parecer psiquiátrico favorável, com testes psicológicos, de acordo com a seção 67.235
  deste

  Regulamento;

  (ii) se haja estimado, a critério do examinador ou da ANAC, que não haverá insuficiência
  cardíaca

  nem risco de falha cardiocirculatória súbita; e

  (iii) não seja provável, a critério do examinador ou da ANAC, que o problema afete a segurança

  de voo.

  (2) no caso de portadores de cirurgia de revascularização miocárdica ou angioplastia coronariana
  sem

  infarto do miocárdio, previstos no parágrafo (a)(9) desta seção:'
