cite: 67.243(a)
title: 67.243(a)
text: '(a) O candidato não pode ter diagnóstico clínico de:

  (1) deficiências anátomo-funcionais significativas do trato gastrointestinal ou seus anexos;

  (2) [reservado]; e

  (3) sequelas de enfermidade ou intervenção cirúrgica em qualquer parte do trato digestivo
  ou seus

  anexos, que a critério do examinador ou da ANAC, possam causar incapacitação durante o voo,

  especialmente as obstruções por estenose (intrínseca) ou compressão (extrínseca).'
