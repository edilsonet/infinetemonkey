section_title: Requisitos metabólicos, nutricionais e endocrinológicos
subsection_id: a
cite: 67.245(a)
title: 67.245(a)
text: '(a) O candidato com transtornos do metabolismo, da nutrição ou endócrinos que, a critério
  do

  examinador ou da ANAC, provavelmente afetem a segurança de voo, deve ser julgado não apto.
  Os

  seguintes transtornos, mas não se limitando a eles, são causas de inaptidão:

  (1) as dislipidemias severas;

  (2) [reservado];

  (3) hiper e hipofunção endócrina considerada significativa; e (Redação dada pela Resolução
  nº 547,

  de 19.03.2020)

  (4) alterações fisiopatológicas que, a critério do examinador ou da ANAC, se produzam como
  efeito

  de hormônios de substituição.'
