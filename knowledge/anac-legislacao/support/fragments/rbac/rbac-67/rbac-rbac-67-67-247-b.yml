cite: 67.247(b)
title: 67.247(b)
text: '(b) O candidato com traço drepanocítico ou outros traços de hemoglobinopatias pode
  ser julgado apto,

  a critério da ANAC, a não ser que haja risco de crise hemolítica durante as operações, quando
  então o

  candidato deve ser julgado não apto. (Redação dada pela Resolução nº 547, de 19.03.2020)'
