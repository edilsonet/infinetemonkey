title: 67.249(d)
text: '(d) O candidato que seja portador de um rim transplantado, sem complicações de rejeição
  ou de outra

  enfermidade do órgão transplantado, com apropriada função renal e boa tolerância ao tratamento
  médico

  permanente, pode ser julgado apto, em consulta com a ANAC, caso seja provável que a condição
  não afeta

  a segurança de voo.


  Data da emissão: 29 de setembro de 2021


  (Redação dada pela Resolução nº 547, de 19.03.2020)'
