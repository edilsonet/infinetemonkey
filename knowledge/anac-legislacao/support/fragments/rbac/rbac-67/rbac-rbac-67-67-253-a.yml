cite: 67.253(a)
title: 67.253(a)
text: '(a) A candidata grávida somente pode ser julgada apta até a 34ª semana de gestação,
  se a avaliação

  obstétrica e supervisão médica continuada indicarem se tratar de gravidez de baixo risco.
  Após a 34ª semana

  de gestação a candidata deve ser julgada não apta.'
