cite: 67.253(b)
title: 67.253(b)
text: '(b) A candidata ou piloto-remoto deve informar ao examinador ou à ANAC da ocorrência
  de sua

  gravidez, como requer o parágrafo 67.15(c) deste Regulamento, a fim de que estes possam
  providenciar a

  suspensão de seu CMA, nos termos do parágrafo (a) desta seção e, enquanto isso não for feito,
  ela deve

  deixar imediatamente de cumprir as atribuições de sua licença que requeiram um CMA válido
  fora das

  condições permitidas pelo parágrafo (a) desta seção.'
