cite: 67.255(b)
title: 67.255(b)
text: '(b) O candidato não pode apresentar anomalia dos ossos, articulações, músculos, tendões
  ou estruturas

  conexas suscetíveis de causar alguma deficiência funcional que possa afetar a segurança
  de voo, bem como

  apresentar amputação em extremidades ou fazer uso de próteses ou órteses, a menos que a
  condição tenha

  sido objeto de investigação específica e que, a critério da ANAC, não seja provável que
  a condição afete a

  segurança de voo.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
