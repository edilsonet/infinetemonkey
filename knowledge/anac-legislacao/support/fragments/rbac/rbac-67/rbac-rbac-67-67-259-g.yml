title: 67.259(g)
text: '(g) O candidato pode usar lentes de contato, desde que:

  (1) sejam monofocais e sem cores;

  (2) a função visual seja perfeita;

  (3) as lentes sejam bem toleradas e não produzam transtornos de córnea; e

  (4) o tripulante seja também portador de um par de óculos reserva do grau exigido, que deve
  ser

  apresentado sempre que solicitado pelo examinador ou pela ANAC no exame de saúde pericial,
  ou por um

  servidor designado pela ANAC quando estiver desempenhando as atribuições de sua licença
  e

  habilitação. (Redação dada pela Resolução nº 547, de 19.03.2020)'
