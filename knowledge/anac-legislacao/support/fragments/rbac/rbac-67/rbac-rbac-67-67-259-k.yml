title: 67.259(k)
text: '(k) Candidatos com estereopsia reduzida, convergência anormal que não interfira com
  a visão de perto,

  e desalinhamento ocular onde as reservas fusionais sejam suficientes para prevenir a astenopia
  e a diplopia,

  podem ser considerados aptos.'
