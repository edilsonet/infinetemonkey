title: 67.261(a)
text: '(a) À exceção do exposto pelo parágrafo (b) desta seção, o candidato submetido a uma
  prova com

  audiômetro de tom puro, não pode ter uma deficiência de percepção auditiva, em cada ouvido


  Data da emissão: 29 de setembro de 2021


  separadamente, maior do que 35 dB em nenhuma das três freqüências de 500, 1.000 e 2.000
  Hz, nem maior

  do que 50 dB na frequência de 3.000 Hz. Este exame deve ser realizado em todos os candidatos
  à obtenção

  de um CMA, pelo menos uma vez a cada 4 anos nos candidatos à revalidação;'
