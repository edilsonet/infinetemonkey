text: '67.265 [Reservada]


  Data da emissão: 29 de setembro de 2021


  SUBPARTE H

  DISPOSIÇÕES TRANSITÓRIAS


  Os CMPU emitidos segundo o RBHA 103A valerão até as datas de expiração das validades

  originalmente concedidas.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
