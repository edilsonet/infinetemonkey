cite: 67.3(a)
title: 67.3(a)
text: '(a) Para os efeitos deste Regulamento são aplicáveis as definições contidas no RBAC
  nº 01 e os seguintes

  conceitos, definições e siglas:

  (1) “a critério da(o)”, sempre que aparecer esta expressão neste Regulamento se referindo
  a um

  examinador ou à ANAC, significa um parecer ou um julgamento a ser emitido por um destes,
  para uma

  situação não prevista por este Regulamento, ou que signifique uma concessão ou restrição
  a um candidato,

  a ser tomada com base na experiência e conhecimentos profissionais dos médicos examinadores
  e que

  precisa estar expressamente justificada e fundamentada nos registros dos exames de saúde
  periciais, seja

  para conceder, seja para negar um CMA;

  (2) atualização periódica significa atividades periódicas que devem ser cumpridas, da forma
  e

  maneira estabelecidas pela ANAC, pelos profissionais de saúde, a fim de que mantenham sua
  competência

  na realização dos exames de saúde periciais referentes a este Regulamento;

  (3) candidato significa todo aquele que pretende obter ou revalidar um Certificado Médico

  Aeronáutico (CMA). Quando aplicável, será explicitado quando um determinado requisito se
  aplicar

  somente a um candidato à obtenção ou a um candidato à revalidação de um CMA. Quando for
  usada

  somente a palavra “candidato”, ou a expressão “candidato a um CMA”, os termos se referem
  tanto aos

  candidatos à obtenção como aos candidatos à revalidação de um CMA;

  (4) certificado médico aeronáutico (CMA) significa o certificado emitido pela ANAC, após
  exames

  de saúde periciais realizados em candidatos, atestando as suas aptidões psicofísicas, de
  acordo com este

  Regulamento, para exercer funções relativas a aeronaves. O CMA equivale ao Certificado de
  Capacidade


  Data da emissão: 29 de setembro de 2021


  Física (CCF) para efeito de cumprimento das normas constantes dos arts. 159 a 164 e 302
  da Lei nº 7.565/86

  (Código Brasileiro de Aeronáutica), e do art. 72 da Lei nº 13.475/17 (Lei do Aeronauta).
  Os dados sobre o

  CMA são atualizados e verificados no Portal da ANAC na internet;

  (5) clínica credenciada (CLC) significa a instituição médica pessoa jurídica, composta por

  profissionais de saúde vinculados, representada junto à ANAC por um Diretor Técnico Médico
  (DTM),

  autorizada pela ANAC a realizar exames de saúde periciais em candidatos e emitir pareceres
  e julgamentos

  para fins de concessão ou revalidação de CMA;

  (5)-I convalidação é o processo de aceitação de um certificado médico emitido por uma Autoridade

  de Aviação Civil (AAC) estrangeira a um piloto brasileiro; (Incluído pela Resolução nº 636,
  de 28.09.2021)

  (6) CRM significa Conselho Regional de Medicina;

  (7) curso básico de perícia médica da aviação civil significa um curso para médicos com
  registro

  válido no Conselho Regional de Medicina (CRM), aceito pela ANAC, com currículo, carga horária
  e

  método de avaliação por ela estabelecidos, que, se satisfatoriamente concluído, permite
  que um médico

  possa ser credenciado pela ANAC para se tornar um MC ou DTM. Para efeito de credenciamento,
  a ANAC

  considerará o curso básico de fisiologia de voo e cursos de especialização em medicina aeroespacial

  equivalentes ao curso básico de perícia médica da aviação civil;

  (8) diminuição de aptidão psicofísica significa toda degradação ou limitação de aptidão
  psicofísica a

  um grau tal que impeça uma pessoa de cumprir os requisitos médicos indispensáveis para a
  manutenção de

  seu CMA, e que pode dar causa à suspensão temporária ou cassação do CMA;

  (9) diretor técnico médico (DTM) significa um profissional médico definido conforme o parágrafo

  67.39(a)(1)(i) deste Regulamento;

  (10) entidade conveniada significa a entidade da administração pública conveniada à ANAC
  com o

  objetivo de realizar exames de saúde periciais em candidatos e emitir pareceres e julgamentos
  para fins de

  concessão ou revalidação de CMA;

  (11) exame de saúde pericial significa o processo pericial realizado por MC, CLC, MCad ou
  entidade

  conveniada em candidatos a um CMA com a finalidade de avaliar se as suas condições psicofísicas
  estão

  em conformidade com os requisitos aplicáveis deste Regulamento para fins de concessão ou
  revalidação de

  um CMA. O exame de saúde pericial pode ser:'
