cite: 67.3(i)
title: 67.3(i)
text: '(i) inicial: é aquele a que está sujeito um candidato à obtenção de um CMA originário
  ou em

  situações especificadas por este Regulamento; e

  (ii) de revalidação: é aquele a que está sujeito um detentor de CMA para sua revalidação;

  (12) examinador, para os fins deste Regulamento, pode significar tanto o MCad, o MC, a CLC
  ou a

  entidade conveniada à ANAC, conforme aplicável;

  (13) julgamento significa o resultado final de um exame de saúde pericial emitido por um
  examinador

  ou emitido pela ANAC, em caso de recurso interposto por candidato, para fins de concessão
  ou revalidação

  de um CMA. Esse resultado pode ser de três tipos: “apto”, “apto com restrição” e “não apto”;

  (14) médico cadastrado (MCad) significa o médico autorizado pela ANAC a realizar exames
  de saúde

  periciais em candidatos para fins de concessão ou revalidação de CMA de 4ª classe;

  (15) médico credenciado (MC) significa o médico autorizado pela ANAC a realizar exames de
  saúde

  periciais em candidatos para fins de concessão ou revalidação de CMA de 2ª, 4ª e 5ª classes;

  (16) parecer significa o resultado parcial de um exame de saúde pericial realizado por um
  profissional

  de saúde para servir de base para o julgamento final para fins de concessão ou revalidação
  de um CMA. O


  Data da emissão: 29 de setembro de 2021


  parecer pode ser de três tipos: favorável, favorável com restrição e desfavorável à concessão
  ou revalidação

  de um CMA;

  (17) profissional de saúde pode significar tanto um médico como um psicólogo ou um odontólogo;

  (18) recurso significa a solicitação de reexame à ANAC, por parte de um candidato, caso
  se sinta

  insatisfeito com o julgamento emitido por um examinador;

  (19) requisitos psicofísicos significam as exigências de aptidões psicofísicas a serem atendidas
  por

  candidatos à obtenção ou revalidação de um CMA; e

  (20) substância psicoativa significa qualquer uma das substâncias definidas no RBAC nº 120.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
