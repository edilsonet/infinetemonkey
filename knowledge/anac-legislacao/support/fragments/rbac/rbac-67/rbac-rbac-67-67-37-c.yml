title: 67.37(c)
text: '(c) O credenciamento terá validade de 3 (três) anos e pode ser revalidado mediante
  prévia solicitação do

  MC, em conformidade com a seção 67.43 deste Regulamento.

  (1) A critério da ANAC, o credenciamento poderá ser concedido com um prazo de validade menor.'
