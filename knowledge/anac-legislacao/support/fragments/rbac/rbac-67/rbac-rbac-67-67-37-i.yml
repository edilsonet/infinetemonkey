title: 67.37(i)
text: '(i) ter sido aprovado no curso definido pelo parágrafo 67.3(a)(7) deste Regulamento
  ou

  equivalente;

  (ii) possuir equipamentos e instalações adequados à realização dos exames de saúde periciais
  na

  especialidade médica que se proponha a realizar por si mesmo;

  (iii) ter capacidade para gerar, armazenar e apresentar os registros dos exames de saúde
  periciais

  realizados, conforme os requisitos da seção 67.53 deste Regulamento;

  (iv) ter capacidade de atualizar o sistema informatizado da ANAC com os dados mais recentes
  dos

  exames de saúde periciais realizados; e'
