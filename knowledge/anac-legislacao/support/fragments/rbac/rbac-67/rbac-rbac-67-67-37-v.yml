section_title: Requisitos para credenciamento de médicos
subsection_id: v
cite: 67.37(v)
title: 67.37(v)
text: '(v) ter capacidade para realizar todos os exames de saúde periciais requeridos por
  este

  Regulamento, seja por meios próprios, ou baseando seu parecer em avaliações de outros médicos;

  (3) antes de receber o seu certificado de credenciamento, o candidato ao credenciamento
  deve

  submeter-se a uma inspeção da ANAC, a fim de se constatar a conformidade com todos os requisitos

  aplicáveis deste Regulamento. Esta inspeção abrangerá o consultório do candidato;

  (4) o candidato ao credenciamento deve estar regular perante qualquer legislação que lhe
  seja

  aplicável, de modo que possa exercer legalmente as prerrogativas deste Regulamento para
  as quais pretende

  se credenciar; e

  (5) o candidato ao credenciamento deve apresentar comprovação de endereço e pelo menos um

  telefone de contato.'
