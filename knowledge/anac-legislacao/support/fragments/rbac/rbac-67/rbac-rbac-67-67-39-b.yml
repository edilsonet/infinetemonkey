title: 67.39(b)
text: '(b) O credenciamento terá validade de 3 (três) anos e pode ser revalidado mediante
  prévia solicitação

  pelo DTM da CLC, em conformidade com a seção 67.43 deste Regulamento.

  (1) A critério da ANAC, o credenciamento poderá ser concedido com um prazo de validade menor.

  (Redação dada pela Resolução nº 547, de 19.03.2020)


  Data da emissão: 29 de setembro de 2021'
