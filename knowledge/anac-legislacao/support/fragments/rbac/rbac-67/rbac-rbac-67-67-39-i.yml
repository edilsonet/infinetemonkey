section_title: Requisitos para credenciamento de clínicas
subsection_id: i
cite: 67.39(i)
title: 67.39(i)
text: '(i) possuir um único Diretor Técnico Médico (DTM), designado pela clínica e que a represente

  para todos os fins que lhe competem junto à ANAC. O DTM deve:

  (A) ter sido aprovado no curso definido pelo parágrafo 67.3(a)(7) deste Regulamento ou

  equivalente; (Redação dada pela Resolução nº 547, de 19.03.2020)

  (B) atender os requisitos dos parágrafos 67.37(a)(1) e 67.37(a)(4) deste Regulamento,

  aplicáveis aos MC, não sendo obrigatório seu credenciamento como MC; e (Redação dada pela
  Resolução

  nº 547, de 19.03.2020)

  (C) ser aprovado pela ANAC antes de sua nomeação;

  (ii) possuir, como mínimo, médicos com Registro de Qualificação de Especialista (RQE) junto
  ao

  Conselho

  Regional

  de

  Medicina

  nas

  seguintes

  especialidades:

  cardiologia,

  oftalmologia,

  otorrinolaringologia, neurologia e psiquiatria; (Redação dada pela Resolução nº 547, de
  19.03.2020)

  (iii) possuir pelo menos um psicólogo e um odontólogo, ambos registrados nos seus respectivos

  conselhos regionais, vinculados à clínica;

  (iv) comprovar que cada profissional de saúde que lhe seja vinculado recebeu treinamento

  adequado para sua especialidade quanto à fisiologia de voo e aos requisitos deste Regulamento,
  ministrado

  pelo DTM;'
