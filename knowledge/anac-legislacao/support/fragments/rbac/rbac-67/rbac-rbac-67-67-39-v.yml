cite: 67.39(v)
title: 67.39(v)
text: '(v) possuir equipamentos e instalações adequados à realização dos exames de saúde periciais
  nas

  especialidades que sejam requeridas possuir segundo os parágrafos (a)(1)(ii) e (iii) desta
  seção;

  (vi) possuir controle adequado de todos os consultórios ou clínicas terceirizadas encarregados
  dos

  exames nas especialidades que não sejam requeridas possuir segundo os parágrafos (a)(1)(ii)
  e (iii) desta

  seção;

  (vii) demonstrar ter capacidade para gerar, armazenar e apresentar os registros dos exames
  de

  saúde periciais realizados, conforme os requisitos da seção 67.53 deste Regulamento;

  (viii) ter capacidade de atualizar o sistema informatizado da ANAC com os dados mais recentes

  dos exames de saúde periciais realizados;

  (ix) estar regular perante qualquer legislação que lhe seja aplicável de modo que possa
  exercer

  legalmente as prerrogativas deste Regulamento para as quais pretende se credenciar; e'
