section_title: Requisitos para credenciamento de clínicas
subsection_id: x
cite: 67.39(x)
title: 67.39(x)
text: '(x) apresentar comprovação de endereço e pelo menos um telefone de contato;

  (2) antes de receber o certificado de credenciamento, a clínica candidata ao credenciamento
  deve

  submeter-se a uma inspeção da ANAC, a fim de se constatar a conformidade com todos os requisitos

  aplicáveis deste Regulamento; e

  (3) todos os membros da direção da clínica devem apresentar as certidões requeridas pela
  ANAC, de

  modo a comprovar o atendimento do requisito do parágrafo (a)(1)(ix) desta seção.'
