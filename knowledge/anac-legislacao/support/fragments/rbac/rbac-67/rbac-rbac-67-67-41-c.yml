title: 67.41(c)
text: '(c) O cadastramento terá validade de 3 (três) anos e pode ser revalidado mediante prévia
  solicitação pelo

  MCad, em conformidade com a seção 67.43 deste Regulamento.

  (1) A critério da ANAC, o cadastramento poderá ser concedido com um prazo de validade menor.'
