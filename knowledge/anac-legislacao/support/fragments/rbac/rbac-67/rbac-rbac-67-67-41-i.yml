section_title: Requisitos para cadastramento de médicos
subsection_id: i
cite: 67.41(i)
title: 67.41(i)
text: '(i) ter capacidade para gerar, armazenar e apresentar os registros dos exames de saúde
  periciais

  realizados, conforme os requisitos da seção 67.53 deste Regulamento;

  (ii) ter capacidade de atualizar o sistema informatizado da ANAC com os dados mais recentes
  dos

  exames de saúde periciais realizados; e

  (iii) ter capacidade para realizar todos os exames de saúde periciais requeridos por este

  Regulamento, seja por meios próprios, ou baseando seu parecer em avaliações de outros médicos;

  (3) para receber o seu certificado de cadastramento, o candidato deve estar regular perante
  qualquer

  legislação que lhe seja aplicável, de modo que possa exercer legalmente as prerrogativas
  deste

  Regulamento; e

  (4) o candidato indicado para o cadastramento deve apresentar comprovação de endereço do
  local de

  atendimento e pelo menos um telefone de contato.'
