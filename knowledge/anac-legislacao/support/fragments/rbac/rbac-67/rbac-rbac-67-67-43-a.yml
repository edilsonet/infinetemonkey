cite: 67.43(a)
title: 67.43(a)
text: '(a) O credenciamento de um MC e o cadastramento de um MCad somente podem ser revalidados
  após

  a fiscalização corrente de toda documentação que comprove a manutenção dos requisitos mínimos
  do

  credenciamento inicial.'
