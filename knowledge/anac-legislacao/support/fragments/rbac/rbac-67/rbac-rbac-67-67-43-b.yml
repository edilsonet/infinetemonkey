title: 67.43(b)
text: '(b) O credenciamento de uma CLC somente pode ser revalidado, a critério da ANAC, após
  uma inspeção

  a ser realizada pela ANAC comprovar a manutenção do atendimento dos requisitos mínimos do

  credenciamento inicial.


  Data da emissão: 29 de setembro de 2021'
