cite: 67.43(c)
title: 67.43(c)
text: '(c) Os MC, CLC e MCad devem dar entrada com o pedido de revalidação de credenciamento
  ou de

  cadastramento pelo menos 90 (noventa) dias antes de expirar a validade do credenciamento
  ou do

  cadastramento anterior.'
