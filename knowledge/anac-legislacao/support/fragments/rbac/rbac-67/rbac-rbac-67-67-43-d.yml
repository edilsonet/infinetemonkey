subsection_id: d
cite: 67.43(d)
title: 67.43(d)
text: '(d) O prazo de validade para a revalidação será contado a partir da data de expiração
  do credenciamento

  ou cadastramento anterior. Caso ultrapasse 6 (seis) meses da data de expiração do credenciamento
  ou do

  cadastramento anterior, o processo de revalidação será descontinuado, devendo ser tratado
  como novo

  credenciamento ou cadastramento.

  (Redação dada pela Resolução nº 547, de 19.03.2020)'
