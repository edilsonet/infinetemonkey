cite: 67.45(b)
title: 67.45(b)
text: '(b) À CLC compete:

  (1) por meio de seu DTM, emitir pareceres ou julgamentos para fins de exame de saúde pericial
  inicial

  ou de revalidação de qualquer classe; e

  (2) por meio de seu DTM, e caso seja solicitado pela ANAC, emitir parecer sobre recurso
  interposto

  por candidato.'
