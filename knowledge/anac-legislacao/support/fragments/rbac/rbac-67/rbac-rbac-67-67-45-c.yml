cite: 67.45(c)
title: 67.45(c)
text: '(c) Para efeito do exercício da competência especificada pelo parágrafo (b) desta seção,
  o DTM deve

  basear o seu parecer ou julgamento nos pareceres de cada profissional de saúde que a CLC
  seja obrigada a

  possuir em cumprimento aos parágrafos 67.39(a)(1)(ii) e (iii) deste Regulamento, e nos pareceres
  de cada

  profissional de saúde que a CLC seja dispensada de possuir e cujos exames sejam requeridos
  por este

  Regulamento. Os pareceres com as assinaturas dos profissionais de saúde devem constar dos
  registros

  requeridos pelo parágrafo 67.53(c) deste Regulamento. As seguintes disposições se aplicam:

  (1) no caso de o DTM emitir parecer sobre recurso, ele deverá basear-se no parecer do profissional

  de saúde da especialidade objeto do recurso; e

  (2) caso não concorde com algum parecer, o DTM deverá justificar expressamente a sua discordância

  nos registros médicos.'
