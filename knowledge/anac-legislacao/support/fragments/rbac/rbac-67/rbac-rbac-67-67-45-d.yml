section_title: Atribuições dos MC, CLC e MCad
subsection_id: d
cite: 67.45(d)
title: 67.45(d)
text: '(d) Ao MCad compete:

  (1) realizar exame de saúde pericial e emitir julgamento para fins de concessão de CMA de
  4ª classe

  e o respectivo CMA. Tais atribuições do MCad são indelegáveis; e

  (2) emitir parecer sobre recurso interposto por candidato, caso seja solicitado pela ANAC.'
