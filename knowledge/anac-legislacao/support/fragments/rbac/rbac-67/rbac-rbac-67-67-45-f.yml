cite: 67.45(f)
title: 67.45(f)
text: '(f) Os MC, CLC e MCad devem:

  (1) manter válidos seus registros junto ao CRM;

  (2) se manter regulares perante qualquer legislação que lhes seja aplicável, de modo que
  possam

  exercer legalmente a medicina; e

  (3) manter atualizados os seus endereços e pelo menos um telefone de contato.


  Data da emissão: 29 de setembro de 2021'
