cite: 67.45(h)
title: 67.45(h)
text: '(h) Caso a ANAC determine que deva haver alguma mudança nos critérios ou procedimentos
  dos exames

  de saúde periciais, mesmo dentro do período de validade do credenciamento ou do cadastramento,
  ela

  informará aos MC, CLC e/ou MCad, que deverão implementar as mudanças em prazo a ser estabelecido

  pela ANAC.'
